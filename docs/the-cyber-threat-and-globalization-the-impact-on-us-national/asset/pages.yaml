  md: '# Violent Extremist Organizations and Terrorism in the Cyber Domain 6


    To terrorize, people must feel an immediate danger. Human, physical, and apprehensive
    emotional reaction to terrorist operations must occur for something to be cyberterrorism
    proper. Although the intent to do harm against physical processes exists in terrorist
    tracts, the capability is currently lacking, according to Director of National
    Intelligence Daniel Coats’ statement to the Senate Select Committee on Intelligence:
    “Terrorists— to include the Islamic State of Iraq and ash-Sham (ISIS) -will also
    continue to use the Internet to organize, recruit, spread propaganda, raise funds,
    collect intelligence, inspire action by followers, and coordinate operations.
    Hezbollah and HAMAS will continue to build on their cyber accomplishments inside
    and outside the Middle East. ISIS will continue to seek opportunities to target
    and release sensitive information about US citizens, similar to their operations
    in 2015 disclosing information about US military personnel, in an effort to inspire
    attacks.”


    While low-hanging fruit might exist that low-skill actors could exploit, the targets
    that could cause events of national significance and terrorize a population are
    too complex for current capabilities. Furthermore, in the cops-and robbers game
    between cyber offenders and defenders, the defense does not remain static, and
    thus the human capital of aspiring cyberterrorist organizations must remain on
    the cutting edge of the latest defensive posturing of critical infrastructure
    technology. Therefore, an emphasis of this chapter is to provide clarity on the
    operational realities of the misuse of cyber means by terrorist organizations
    to achieve operational objectives of recruitment, radicalization, fund-raising,
    and planning and execution of attacks in the physical environment. To understand
    the morphing range of limitations and competencies, it is necessary to draw a
    clear distinction between cyber enabled terrorist operations and operations in
    cyberspace creating physical effects equivalent to an armed attack. Such categories
    include, but are not limited to, the following:


    +   • Misuse of the Internet for the logistics of a terrorist network (including
    radicalization, recruitment, and financing).'
  merge: -1
  img_proc: true
- pgno: 165
  md: '+   * Cyber enabled terrorist attacks as observed from improvised explosive
    devices to complex command and control and communications during an operation.

    +   * The threat of cyberterrorism to critical infrastructure and disruption of
    civilian networks.

    +   * The emergence of psyber warfare to intimidate or mobilize populations without
    a physical presence.


    # Definitions


    To place these and other phenomena within their respective contexts, a spectrum
    of terrorist cyber operations is useful in illustrating distinctions and applying
    definitions. Drawing clear distinctions between cyberattacks on the one hand and
    the misuse of information technology for communications, reconnaissance, planning,
    recruiting, fund-raising, and cyber armed attacks on critical infrastructure on
    the other end of the spectrum is important.² A broad definition of *cyberattack*
    risks treating crime and espionage as armed attacks/threats to peace. Espionage,
    crime, and armed attack necessitate responses that fall under mutually exclusive
    sections of the U.S. Code and relevant international laws. It is increasingly
    important that discussions of malicious cyber activities be accurately described
    and differentiated. The operating paradigm required to address the terrorist misuse
    of the Internet to conduct espionage or criminal activities is not the same in
    terms of criticality or modality as that required for them to succeed in creating
    effects through a cyber operation that would rise to the level of an armed attack.
    According to the U.S. Code, *terrorism* is defined as “premeditated, politically
    motivated violence perpetrated against noncombatant targets by subnational groups
    or clandestine agents”; *terrorist group* means any group practicing, or which
    has significant subgroups that practice, international terrorism. Cyberterrorism
    is more than just adding the *cyber* prefix to terrorist activity. For the purposes
    of this discussion, the definition of *cyberterrorism* is “the use of computer
    network tools to shut down critical national infrastructures (such as energy,
    transportation, government operations) or to coerce or intimidate a government
    or civilian population.”³


    # A Spectrum of Cyber-Enabled Terrorist Operations


    It would seem from headlines that the amount of power that has come into non-state
    actors’ hands as a result of access to cyberspace has qualitatively altered the
    amount of power violent nonstate actors may wield. In his 2013 statement to the
    Senate, former director of the National Security Agency and commander of the U.S.
    Cyber Command Keith Alexander reported that


    > cyber programs and capabilities are growing, evolving, and spreading; we believe
    it is only a matter of time before the sort of sophisticated tools developed by
    well-funded state actors find their way to groups or even individuals who in their
    zeal to make some political statement do not know or do not care about'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'the collateral damage they inflict on bystanders and critical infrastructure.
    The United States is already a target. Networks and websites owned by Americans
    and located here have endured intentional, state sponsored attacks, and some have
    incurred degradation and disruption because they happened to be along the route
    to another state''s overseas targets. Our critical infrastructure is thus doubly
    at risk. On a scale of one to ten, with ten being strongly defended, our critical
    infrastructure''s preparedness to withstand a destructive cyberattack is about
    a three based on my experience. There are variations in preparedness across sectors,
    but all are susceptible to the vulnerabilities of the weakest.⁴


    The key point in the statement above is, as currently observed, that activity
    by state and nonstate actors amounts to degradation or disruption of service.
    This is a crucial distinction given that the effects of destruction require high-level
    knowledge of very specialized computer networking protocols, industrial equipment,
    cryptography, and computer programming. In his congressional testimony, General
    Alexander refers to disruption and degradation of service (including those targeting
    U.S. banks in 2012–13), which targets commercial information and communication
    technology, not industrial control systems. Thus, it is important to distinguish
    between the terrorist misuse of information and communication technology and the
    targeting of industrial control systems.


    The area where cyberspace and terrorism overlap is an area with an already extensive
    bibliography.⁵ The enhancement of terrorist organizations'' capabilities for planning
    attacks; anonymizing their communications; recruiting, radicalizing, and inciting
    individuals; and financing their operations presents challenges due to the global
    reach and always on nature of the Internet. The technical realities underlying
    all aspects of this problem will be emphasized in order to contribute to better-informed
    frameworks and policies.


    The chart in figure 6.1 describes the spectrum across which terrorists may misuse
    elements of cyberspace focusing on radicalization, recruitment, fund-raising/planning,
    espionage, disruptions, and finally armed attack. The spectrum of terrorist misuse
    of the Internet includes the following:


    +   1. *Cyber influence*: the misuse of cyberspace to influence populations with
    propaganda. This could be to create sympathizers to the cause. Included in this
    category is the process of radicalization and recruitment via the cyber domain.


    +   2. *Cyber planning*: ''Timothy Thomas coined the term *cyber planning* as
    “the digital coordination of an integrated plan stretching across geographical
    boundaries that may or may not result in bloodshed.”⁶ Thomas''s definition in
    his work includes examples of both influence and execution of attack. One could
    argue that recruitment and command and control of an operation via cyberspace
    do not amount to planning. Planning is more akin to intelligence, surveillance,
    and reconnaissance.


    +   3. *Real-time operational execution*: the misuse of cyberspace to actually
    cause physical destruction. This is beyond the realm of the hypothetical when
    it comes to detonating improvised explosive devices via cellular technologies.⁷
    What has still not been observed is the terrorist capability to attack industrial
    control systems via electronic means to cause physical effects.'
