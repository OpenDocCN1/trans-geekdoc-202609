  md: 'Amid this Cambrian era of artificial intelligence, the DoD envisions an integrated
    web of unmanned systems in its Joint Force program. Systems are developing rapidly
    for deployment in a multidomain battle space, which will change the way we wage
    war, operationally and morally. The United States is investing billions to identify
    targets, pilot unmanned aircraft and land vehicles, navigate its surface and subsurface
    fleets, and sift through massive waves of data from satellite feeds, intelligence
    intercepts, social media, news, and literature from all sources. Ultimately, the
    decision to kill could also be in the control of autonomous weapons systems. These
    AI efforts are the foundation of the U.S. military’s Third Offset Strategy, which
    it foresees as its way to shift the axis of battle in its favor by deploying advanced
    technologies and forward-thinking operational concepts.20 The U.S. military is
    not alone in defense research advancing AI, and some have expressed concern about
    the emergence of autonomous weapons systems and “algorithmic warfare.”


    As the technological process marches headlong, government’s investment pales in
    comparison to that of the private sector. The quest for military superiority is
    only surpassed by the ardor for economic superiority. We invest billions of funds
    and intellectual capital to build machines and systems to predict the market,
    refine products, and make trade more frictionless. As an unintended result, we
    have built machines so complex that, for the first time, we now have inventions
    that “operate in ways their creators don’t understand.”221


    Programs can generate their own algorithms and write their own commands to solve
    problems and make decisions. Even the software engineers who develop these applications
    cannot explain entirely the behavior and reasoning behind their operation. The
    artificial neurons within these systems interconnect across an array of intricate
    layers in a welter of mathematical functions and variables, which combine with
    a series of iterations of calculations to form an opaque and nearly inscrutable
    matrix. Will Knight of the MIT Technology Review describes the interplay of calculations
    within these deep neural networks:


    The neurons in the first layer each receive an input, like the intensity of a
    pixel in an image, and then perform a calculation before outputting a new signal.
    These outputs are fed, in a complex web, to the neurons in the next layer, and
    so on, until an overall output is produced. Plus, there is a process known as
    back-propagation that tweaks the calculations of individual neurons in a way that
    lets the network learn to produce a desired output.22


    We have succeeded in creating machines to perform tasks and make decisions far
    beyond the scale and scope of our own human capabilities. As a result, we have
    come to rely on them to organize our lives, make us more comfortable, limit our
    risk from disease and attack, and predict our futures. Where we have not succeeded
    is in the ability to find a way to have a conversation. As we give these creations
    the permission to diagnose our health, improve our daily routines, and make autonomous
    kill decisions in times of conflict, we should at least consider a means of inserting
    a human element into the loop, if only to be able to ask, “Why did you do what
    you did?” Giving voice to these concerns, Stephen Hawking declared in a 2016 interview,
    “The rise of powerful AI will be either the best, or the worst thing, ever to
    happen to humanity. We do not yet know which.”23'
