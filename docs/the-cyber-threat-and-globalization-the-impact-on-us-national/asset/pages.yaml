    A Belgian newspaper in November 2012 published an investigation into how many
    employees of the Belgian state security service listed their employer on Facebook
    or LinkedIn. Several French users of LinkedIn posted their employer as France’s
    external intelligence agency. In a similar investigation, an American journalist
    discovered that more than two hundred users of LinkedIn claimed the Central Intelligence
    Agency as their employer.28 These personal revelations are more frequent when
    users are looking for another job or, perhaps, a romantic relationship. Official
    employees upon leaving their positions or while conducting job searches have been
    known to distribute online photographs of themselves inside secure domains, of
    their official credentials, and of themselves with important persons as evidence
    of their professional qualifications.29 Once exploited, victims of online abuse
    have difficulties finding redress in the justice system. Privacy and accuracy
    of information is less protected legally when online than offline. As Bruce Newsome
    notes,


    Private citizens face practically no criminal legal restrictions on online behavior.
    The tort system is usually a waste of time for claimants or victims; the few cases
    that have been heard in civil or criminal court usually fail to clarify responsibility
    or harm. In practice, cyber information and misinformation are controlled by users
    and hosts, motivated mostly by their intrinsic ethics and external commercial
    pressures, not the law. In the United States, the Communications Decency Act of
    1996 makes clear that Internet service providers and online hosts are not responsible
    for the content of posts from outside parties, although the positive implication
    of this clarity is that hosts are free to moderate or delete content without legal
    liability.30


    These legal obstacles encourage rampant online slander, defamation, misinformation,
    and abuse, including online bullying. The ambiguities in the law also allow criminals
    and even foreign intelligence agencies to use the anonymity of the Internet and
    the dark web to pursue their aims. Russian intelligence often takes advantage
    of cyberspace by resorting to the familiar dirty trick tactics of their predecessors
    in the KGB. Known as kompromat, these activities include the fabrication and planting
    of compromising or illegal material in order to discredit opponents and journalists
    for the purpose of shaping public opinion. Today, the “cyber mischief making”
    by Russia’s army of official and semiofficial hackers blurs all boundaries “between
    truth and falsehood in the service of operational needs [and] has created a climate
    in Russia in which even the most serious and grotesque accusations, like those
    involving pedophilia, are simply a currency for settling scores.”31 Victims have
    found themselves defending their reputations in public against accusations that
    run the gamut of charges from corruption, drug trafficking, and fraud to adultery,
    pedophilia, and prostitution.'
