    # A Hypothetical Case of Strategic Cyberterrorism


    Terrorists will target institutions regardless of whether there is a way to do
    it via cyberspace. Many argue that the cost of entry is low in cyberspace because
    it is relatively simpler to launch the digital version of a bank robbery, meddle
    with a hospital’s HVAC system, or release the floodgates on a dam. While it is
    true that one requires significantly less resources to conduct a cyberattack,
    the reason for this has less to do with the nature of the domain and more to do
    with poor product development, design, and implementation. Software developers,
    hardware manufacturers, and network providers face no liability or responsibility
    for the systems they produce or operate. As a result, they have no reason to deliver
    secure products to the marketplace. This risk will begin to manifest more starkly
    as cloud computing takes hold and resulting breaches destroy multiple points within
    the health-care establishment rather than a single hospital. Below are some effects
    that a cyberattack could have.


