  img_proc: true
- pgno: 226
  md: 'The CFAA, located at 18 USC § 1030, remains the nation''s preeminent cybercrime
    statute, criminalizing seven main types of computer-related activity. First, it
    prohibits the act of obtaining national security information without authorization
    and then willfully retaining that information or providing or attempting to provide
    that information to an unauthorized recipient.6 Second, it prohibits the unauthorized
    access of information from financial institutions, U.S. government agencies, or
