- pgno: 98
  md: '# # Box 3.4 Cyber Risk Management: The Corporate Governance Imperative


    # Joseph W. McGrath


    Global multinational corporations jumped to take advantage of the dynamics of
    globalization. They knew they could improve their financial performances by leveraging
    the economic benefits of using the lowest-cost labor around the globe if it delivered
    the same-quality results that they were accustomed to in North America and Western
    Europe. They moved manufacturing to China, Taiwan, Vietnam, Mexico, and other
    low-cost countries. They relocated call centers to India, Eastern Europe, and
    Latin America. They transferred software development and information technology–managed
    services to India where there is a vast infrastructure of engineering universities
    led by the Indian Institutes of Technology (IIT). It was also incredibly important
    that English was pervasive as a second language across all of India. They relied
    on a system of just-in-time supply chains to link these enterprises to a complex
    integrated global network.


    The advances in technology served as the underpinnings of these far-flung operations.
    The Internet and interconnected high-speed communication networks were the digital
    circulatory system that linked everything and drove the information flows in this
    twenty-four-by-seven real-time system across six continents. Ubiquitous computing
    and communications in every major country involved allowed this to happen. It
    was this infrastructure that also proved to be its greatest weakness. This global
    network was its greatest vulnerability. In this far-reaching multicountry network
    of data centers, servers, gateways, routers, and websites, it could never be made
    totally secure. There were too many points of entry and too many employees, customers,
    suppliers, and partners who


    have some form of access to it. Bad actors in both the public and private sector
    were prepared to take advantage of it. And they did.


    In 2016, reported data breaches increased by 40 percent. Yahoo! announced the
    largest data breach in history, affecting more than one billion accounts. At retailer
    Target, 110 million customers’ personal and financial information was exposed.
    Home Depot was hacked, and credit card data was stolen from fifty million customers,
    which resulted in a $179 million settlement with customers. Hackers stole $81
    million from the Swift payment system related to the Bangladesh Central Bank.
    At Blue Cross Blue Shield/Anthem, a data breach impacted eighty million customers
    and resulted in a $115 million settlement. Finally, Equifax, one of the three
    largest credit agencies in the United States, suffered a breach that affected
    143 million customers, which included social security numbers and driver’s license
    numbers. It may have been the worst breach ever. Because of the significant amount
    of time that elapsed between when the breach occurred and when the CEO informed
    his board of directors and the company’s customers, the company lost total credibility,
    it had to testify before the U.S. Congress, and the CEO was fired. These are just
    the tip of the iceberg of stories regarding companies impacted by cyberattacks,
    intrusions, and theft.


    Executives in global multinationals now realize that cyber risk may be one of
    the biggest challenges they face over the next decade. Nearly all of these companies
    had already appointed a chief information security officer (CISO) and developed
    a cyber risk security plan under the chief information officer (CIO), but they
    now'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'recognize that these efforts fall short of what is required in the future.
    CEOs and their boards of directors now realize that this dilemma may be the greatest
    systemic existential risk to their companies.


    The solution to this challenge is an end-to-end strategy that involves every employee
    and is the ultimate responsibility of the board of directors. There needs to be
    a governance process that identifies all potential risks and then addresses those
    vulnerabilities on a real-time basis. There needs to be an organization-wide culture
    of cyber awareness. The board needs to be briefed at every board meeting by either
    the audit/risk subcommittee or the technology subcommittee every time they meet.
    Ideally, they should create a cyber risk committee. They need to understand the
    risks to their firms and the appropriate responses. It will be a financial and
    reputation game changer if they do not. Senior


    management and the board of directors must develop an extremely comprehensive
    cyber risk management strategy that is an overlay to all of their company''s processes,
    systems, and policies and defines the responses to the challenges that they will
    inevitably face.


    Globalization has dramatically improved the financial performance of many global
    multinationals. The system that has been put in place to support it has now placed
    it at risk. It must now invest in the cyber competencies, systems, and processes
    to protect it. This will ensure accountability at the most senior levels of the
    enterprise.


    Joseph W. McGrath is retired chief executive officer of Unisys Corporation and
    a past member of the Technology CEO Council, the Business Roundtable, and the
    G100 CEO Network.


    Whether associated by cultural or traditional ties or motivated by unadorned economic
    or self-interest, the new arena of conflict is a constellation of states, corporations,
    terrorists, criminals, and social activists. The cyberspace infrastructure is
    the critical underpinning of the global economy and human interaction, and therefore
    its integrity is essential to national security, public safety, and modern civic
    intercourse. The hyper-interconnection, which evolved parallel with globalization,
    expanded opportunities for all. However, as economic and democratic deficits persist,
    they also create smoldering tensions and unfamiliar security threats.


    # Key Terms


    +   - hacker

    +   - bot network operator

    +   - criminal group

    +   - foreign intelligence service

    +   - disgruntled organization insider

    +   - phisher

    +   - spammer

