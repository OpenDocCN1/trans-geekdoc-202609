    # Robotics and AI


    Robotics, the subject of many a science fiction plot, is also a fundamentally
    related field of AI. Robots require AI to manage such tasks as object handling
    and navigational exercises like motion planning and mapping. Narrow artificial
    intelligence, the nonsentient branch of AI, works ideally where its function is
    to run automated tasks that are largely simple and repetitive. Although the potential
    is still formative, it will be the field of AI that undergoes the most progress
    over the near term. In contrast to narrow AI and despite the boundlessness of
    the human imagination and the vast amount of investment funding, the technology
    of general AI remains nascent and still requires years of serious and collaborative
    research for it to become “a fully functional reality.”14 However, this more “conscious”
    branch of AI is the more transformative and the subject of much research and excitement,
    while at the same time it is fraught with risk for the scientific community, military
    planners, business strategists, and public policy makers. The tension is public
    and has at times led to friction between the private sector and the military.


    Contrary to strong AGI, narrow artificial intelligence does not attempt to perform
    the full range of human cognitive abilities. Narrow artificial intelligence is
    designed to learn and perform a narrow purpose and set of tasks, such as credit
    scoring, insurance pricing, and anomaly, spam, or fraud detection. It is nonsentient
    in that it is not aware of its environment except for its rule-based coding and
    the specific task it performs. Generally, unless retrained with new data and repurposed
    with new algorithms, a narrow artificial intelligence model designed for speech
    recognition cannot perform a mapping or motion planning function, because it is
    restricted by the rules imposed by the programming.


    ANI works ideally where its function is to run automated tasks that are largely
    simple and repetitive. Narrow artificial intelligence pulls data from databases
    to'
