- pgno: 97
  md: '# Box 3.3 4G LTE


    The term 4G LTE is actually two terms. 4G refers to the fourth generation of data
    technology for cellular networks, surpassing the third generation, 3G. LTE is
    short for "long-term evolution" and represents a very technical process for high-speed
    data for phones and other mobile devices. It is not as much a technology as it
    is the track and direction to achieve 4G speeds.


    Another technological breakthrough with a potential underside for national security
    is IPTV and software-defined radio. This technology allows for the broadcasting
    of audio-video material over a packet-switch IP network. Currently, there is a
    shift toward this mode of programming with the rise of video-on-demand online
    services. However, IPv4 networks limit the transmission to a multicast model.
    That is, in terms of use experience, if someone wants to change a program, pressing
    “next channel” will require the device to establish a new connection, leading
    to a lag in load time of the next channel or program being requested. IPv6 allows
    for multicasting. Standards today over which IPTV services will run are emerging
    (such as the ITU’s G.hn standard, which American companies such as AT&T support53).


    IPTV will allow for current and new services to evolve into a format that will
    resemble the seamlessness of how we watch television today. It is highly likely
    that this will result in a paradigm shift similar to the one experienced when
    the television model shifted from local broadcast to satellite broadcast. As such,
    it will present new opportunities for the United States to broadcast messages
    worldwide, following paradigms from general broadcasts to targeting an individual’s
    screen. These opportunities will exist on the open Internet. However, it is conceivable
    that with IPTV embedded into the closed networks described above, it will serve
    as another secure platform for violent extremist organizations to maintain a grip
    on the minds of their followers within self-referential environments.


    The purpose and scope of this chapter was to provide some insight and a broad
    strategic estimate of several technologies. Many of these tools are already upon
    us. Others are being rolled out and slowly being put into practice. In a later
    chapter, we focus on technological trends that may shape the way the cyber environment
    will look to 2035. However, given current technological trends, it is a fool’s
    errand to try to predict what even the next five years of cyberspace will bring.
    Considering also the rapid pace of innovation in the private sector and the unpredictability
    of disruptive technologies, subject matter experts in this field are best differentiated
    by their varying degrees of ignorance rather than their insight into the future.
    Thus, this chapter aimed to focus on certain changing core technologies that define
    cyberspace and their impact on peripheral technologies where applications will
    be built.


    Finally, globalization has drawn populations closer together. As the process goes
    forward, it simultaneously creates opportunity for collaboration and tension.'
