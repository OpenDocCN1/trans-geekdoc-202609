    # # The Internet of Things (IoT)


    A White House press release in 2015 describes the Internet of Things as “a ubiquitous
    network of connected devices, smart sensors, and big data analytics.”7 However,
    as with the term cyber, there is no recognized standard definition for the term
    Internet of Things. Yet its economic impact over the next decade will be measured
    in trillions of dollars. For consumers and enterprises, IoT remains, by and large,
    invisible. Nevertheless, billions of tiny data pipes from a multitude of devices,
    from the common to the extraordinary, infiltrate our world owing to the vastness
    and density of these networks of devices. Also known as ubiquitous computing,
    IoT has been used to describe the full universe of devices that, combined together
    in the near future, will drastically modify the way our societies function. It
    represents a paradigm shift from networked laptops and desktops toward a paradigm
    of networked objects sensing their environments and communicating what they see
    among themselves.


    Smart TVs, health monitoring systems, home appliances, thermostats, and NASA hard
    drives sitting on home and business networks are all part of a network of “things”
    that communicate with computers and other objects through the Internet. Virtually
    any object that uses remote control or remote data collection falls within the
    panoply of IoT. This is more than an extension of the Internet to mobile and other
    devices, as it could include independent systems that operate on their own infrastructure
    and have only partial reliance on the Internet. These objects, from books to cars,
    from electrical appliances to food, create the Internet of things. These objects
    may have their own IPv6 addresses (discussed below) or be embedded in complex
    systems and use sensors to obtain information from their environments (such as
    food products that record the temperature along the supply chain). As in other
    fields, the trend of the Internet is of an ecology that is becoming more fragmented
    while at the same time more closed.


    The Internet of Things is an opportunity and a challenge. A quick scan of the
    potential number of sensors embedded in everything from Fitbits to smart cars,
    and you reach a trillion sensors with reservoirs of information to be mined. No
    more secrets due to the distribution of data that has not been captured in the
    past. Now data is flowing out of objects. For example, your “dumb” oven is currently
    being used but is not recording and distributing data about the use. A smart oven
    would have a data link between the cook and the oven so that the cook can monitor
    from a wireless device what the temperature is in the oven in real time to create
    efficiency in the cooking process. That data, now collected, could be distributed
    back to the oven manufacturer to solicit information about oven performance. With
    lots of data links containing information that was previously digitized and automatically
    sent between machines and between humans, several issues arise.


    For instance, how does our relationship with data change? We have had too much
    data coming at us for a generation. How do we find the most important'
