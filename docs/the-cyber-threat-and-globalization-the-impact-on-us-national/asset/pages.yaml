  md: '# Box 5.1 Simple Network Management Protocol (SNMP)


    Simple Network Management Protocol (SNMP) is a common protocol for network management.
    It is used for configuring and gathering information from network devices, such
    as servers, printers, hubs, switches, and routers on an Internet Protocol (IP)
    network. Developed in 1988 to provide network-device-monitoring capability for
    TCP/IP-based networks, SNMP was approved as an Internet standard in 1990 by the
    Internet Architecture Board (IAB) and has been in wide use since that time.


    Source: https://technet.microsoft.com.


    The kinds of methods that were used in Estonia and Georgia, and in the U.S. financial
    sector in late 2012, certainly did not rise to the level of an armed attack. These
    disruptions, however, were targeting the network layer of the Internet. This is
    not true of all denial-of-service (DOS) events. So called “SNMP overloads” are
    an example of overload DOS attacks. For example, computers running Windows 2000
    to program PLCs on an ICS network could be targeted by malicious code that exploited
    an unpatched vulnerability, causing an “SNMP overload.” In this case, a computer’s
    memory, not the network connection, would fail.


    By exploiting this vulnerability, a malicious actor would cause a hiccup in the
    system, which would prevent *any* new processes from starting on a targeted machine.
    The machine would have to be powered down and restarted in order for it to operate
    again. In critical infrastructure, availability of systems is essential; otherwise
    incidents of national security concern could ensue. Thus, DOS attacks are more
    than just attacks targeting the network layer, leaving websites inaccessible,
    but also the application layer of specific targeted computers that could cause
    a power plant to shut down.


    # Armed Attack


    Existing international legal frameworks provide clarity on how law and policy
    should treat instances of cyberwarfare. The *Tallinn Manual on the International
    Law Applicable to Cyber Warfare*, perhaps the most comprehensive work on the issue
    today, offers the definition of a cyberattack as a “cyber operation, whether offensive
    or defensive, that is reasonably expected to cause injury or death to persons
    or damage or destruction to objects.”26


    Cyber events breaching the threshold of armed attack require the use of cyberweapons,
    which differ substantially from Flame, Zeus, Gauss, or other malicious code. While
    a cyberweapon can be software code designed to attack ICSs, it can also be hardware
    flaws introduced into critical systems. Due to the complexity of ICSs, the skill
    level required to discover vulnerabilities (so-called zero-day vulnerabilities),
    as well as the infrastructure required to find targets, gain access, and execute
    the attack, necessitates significant financial and human capital. To date,'
