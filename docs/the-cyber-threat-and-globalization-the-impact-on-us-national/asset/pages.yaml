- pgno: 64
  md: '# Figure 2.1 Layers of the Internet


    ![](img/18cc7cb0fa00c7c6d22e23ef9d2bc649_64_0.png)


    Note: Proportions in the figure are not to scale.


    Source: Congressional Research Service.


    You can sort through the many hits or you could go directly to publicly available
    sites such as the Department of Homeland Security’s Digital Library, found at
    https://www.hsdl.org. When you reach the site, you are still on the surface web.
    There, you can request access to the complete database by submitting your e-mail
    address and identifying yourself as a member of the government or military, or
    a researcher at a college, university, or think tank. Once you log in and enter
    your search criteria, you have gone below the surface web and successfully accessed
    the world of the deep web. Basically, one enters the deep web when one navigates
    away from a typical search engine to do a search directly in a web-site.66 BrightPlanet
    is a firm that specializes in “harvesting” deep web data, and it explains the
    deep web thus:


    The Deep Web isn’t found in a single location. It consists of both structured
    and unstructured content—a huge amount of which is found in databases. This content
    has often been compiled by experts, researchers, analysts and through auto mated
    processing systems at an array of institutions throughout the world. All of the
    content is housed in different systems, with different structures, at physical
    locations that can be as far apart as New York and Hong Kong.67


    Traditional search engines use “web crawlers” to navigate the surface web. Also
    known as spiders, web search engines use these programs to index all the pages
    on a site by following the links from page to page. The search engine encapsulates
    the content and adds the links to their indexes. They can also locate'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'web pages that sell a particular product or find blogs that have opinions about
    a product. According to BrightPlanet, the problem with this technology is that
    search engines return links based on popularity, not content.⁶⁸ As the surface
    web grew, the utter volume of these sites forced the information to be managed
    through automated systems with databases. The result is an evolved web of database-centric
    design rather than one of static sites.


    The main growth in web traffic occurs here as larger, more dynamic sites come
    online. Dynamic sites are capable of producing different content for different
    visitors from the same source code file. This is a distinction from static sites
    whose content does not change unless edited by an administrator. Interactive online
    shopping sites are examples of dynamic websites. Other examples are blogs and
    any e-commerce site used to make a reservation, check an account balance, or submit
    a form. Practically every time we go online we use the resources of the deep web
    unconsciously, at work, at home, and at leisure.


    Within the deep web is a small segment of content called the dark web. There is
    no standard definition for the dark web. In some circles, the dark web is simply
    a term for data that has been intentionally hidden and is inaccessible through
    standard web browsers.⁶⁹ By this definition, the hidden sites trafficking in illegal
    goods and services, and the secure command-and-control centers that operate nuclear
    power plants, are both technically part of the dark web. Sometimes the word _dark_
    implies a reference to the more disturbing and malevolent aspects of the Internet,
    and therefore distinctions are drawn in the literature between “deep” and “dark.”
    But as noted above, not all of this content is as sinister as the name implies.
    Still, some subject matter experts insist that the dark net only refers to sites
    that can be accessed anonymously.⁷⁰ Further, in order to make the debate over
    definitional language as esoteric and confusing as possible, many commentators
    simply use the terms interchangeably.


    Definitional distinctions aside, the deep web and the dark web contain the largest
    pool of replacement and fresh data on the Internet.⁷¹ Additionally, these subsurface
    webs lend themselves to searches that are more targeted and subject relevant because
    custom queries are often made via content-specific websites. But because websites
    on the deep web are unindexed, a knowledge of their specific URL addresses is
    needed for access. Alternative search engines can help users access corners of
    the deep web that are unreachable with normal search tools. These subscription
    search engines allow users to locate different parts of the deep web for specific
    content. Content ranges from scientific and political topics to issues of concern
    for communities devoted to pet care and figure skating.


    In the anonymous dark web, visitors mainly use TOR to navigate through the population
    of sites. The Invisible Internet Project, known as I2P, is another distributed
    communication network designed for anonymity. However, rather than being a tool
    to connect with and create hidden sites like TOR is, I2P’s sole purpose is as
    a mechanism to host services such as e-mail, online discussions (IRC—Internet
    Relay Chat), and hidden I2P network websites called “eepsites.” Similar to I2P
    is Freenet, a predecessor network with parallel but more limited capabilities.


    As noted above, these anonymous realms within the dark net are refuges and covers
    for those on both sides of the law. Its conception, rise, and continuance'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'reflect the needs of commerce, national security, human rights advocacy, and
    crime. As put by another observer, “The Darknet is nothing more than a mirror
    of society: Distorted, magnified, and mutated by the strange and unnatural conditions
    of life online.”72 While contributing to social welfare, it also facilitates crime.
    Yet, rather than constraining it, policy makers concentrate on shaping its progression.
    To that purpose, initiatives and technology are moving forward to oppose bad actors
    who exploit the anonymity of the dark net.


    An example of this effort is CAUSE (Cyberattack Automated Unconventional Sensor
    Environment), a project of IARPA (Intelligence Advanced Research Project Activity).
    In general, cybersecurity has been mostly reactionary—relying on resilience and
    redundancy to stop infiltrators from doing maximum damage and mitigating losses.
    The developers of CAUSE hope to introduce a more proactive approach by creating
    a framework for a “probabilistic warning system” that anticipates and identifies
    new attack vectors before they emerge.73 Because cyberattacks, like those in the
    physical world, progress in phases, “observations of earlier attack phases, such
    as target reconnaissance, planning and delivery, may enable warning of significant
    cyber events prior to their most damaging phases.”74 These unconventional “sensors”
    will filter data streams from social media, economic trend reports, and political
    and cultural news. These subjects and sources might be nondirectly related to
    cybersecurity, but they might reveal probable impact by potential bad actors and
    their shifting motives and methods.


    We already know how social software can track political situations worldwide.
    It is a valuable enabler of information sharing and connectivity and an intellectual
    force multiplier.75 While it is useful as a general networking apparatus for expressing
    dissent and advocating policy, it can also identify emerging trends and influencers.
    Social media can mobilize sympathizers, associates, and armed insurgents into
    action in support of causes or combat. Hopefully, with CAUSE’s other data sources,
    it can help to merge information flows into a single automated system that allows
    authorities to anticipate and get ahead of cyberattacks well before they materialize.


    The transnational dynamic of the anonymous web frustrates legitimate society and
    law enforcement. The lack of functioning markets in economically depressed regions
    of the world forces them to seek alternative commercial practices and opens them
    up to exploitation. Meanwhile, international consensus on the definition of cyberwar,
    cyber espionage, and cybercrimes remains elusive with respect to official policy
    and law. As well, accurate data on the volume, usage, and very character and scope
    of dark web content is tenuous. The shadowy world of underground markets, failed
    states, and opaque and anonymous cyberspace has resulted in momentous change.
    These forces have changed roles and rules for states, opened opportunities where
    crime and terrorism can fester, altered the impact of nongovernmental organizations
    (NGOs) on civil society, and created new spheres of authority among populations.
    The shifting phantasmagoria is a pageant with which the global security establishment’s
    history and experience is only relatively recent.


    For additional understanding of the challenges of cybersecurity, it might be wise
    to refer to a mythical dialogue between Socrates and a Greek slave called'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'Meno. Meno poses a question to the philosopher: “How will you look for something
    when you do not know what it is?” suggesting that rational inquiry is impossible.
    Socrates''s reply is that, generally, the nature of a solution is not fully known,
    but it is not totally unknown either. We may not know the right answer to a problem,
    but we are able to recognize the wrong answers. Eventually, through continuous
    trial and inquiry we come to the right conclusions. In the current arena of conflict,
    solutions are elusive. The competition over political and economic control by
    state and nonstate actors and the expanding web of criminals, terrorists, disgruntled
    workers, hacktivists, and so on, add to cybersecurity''s version of that paradox.
    In an environment where the combatants are indistinct and their motives are often
    vague or intentionally masked, new threats take shape that do not comfortably
    conform to previous patterns of activity, analysis, and protocols for response.


    Inhibiting the ability to interdict is not only the lack of experience with this
    kind of threat but also the paucity of data that could help create predictive
    modeling methods and tools. These new opponents create a multivariate network
    of plotters. In some cases, they may be unrelated, stateless, and widespread,
    and in other cases not. As a result, Meno’s question becomes a troublesome and
    persistent dilemma for the security and defense communities as a simple hypothetical
    query from the past evolves into a somber global concern.


    Fortunately, our experience with the virtual world grows ceaselessly, and the
    lessons we gain from that experience allow us to better prepare for the increased
    onslaught of cyberattacks and new-generation malware. Unfortunately, as technological
    advances occur and contribute to the stealth and expansion of the dark web, policy-making
    and law enforcement efforts lag behind due to an absence of broad consensus. The
    deep web and the dark web grow deeper and darker every day. The situation, therefore,
    is too critical to leave the solutions solely to the experts. An extensive public
    debate is necessary in order to address the threat from an expanding array of
    plotters and a range of complex issues that are constantly morphing.


    # The Lexicon of Cyber Conflict


    If there is ever a war between great and emerging great powers, we must assume
    that cyberweapons will be used and apply the Law of Armed Conflict to their use
    until a more formal treaty or convention can be negotiated, signed, and ratified.
    Consistency of definitions is essential. There cannot be a system of definitions
    for legal scholars and a conflicting system of definitions for the policy maker,
    technologist, and layperson. It is the clarity of common definitions and language
    on which domestic policy and global norms of behavior can be built. Clarifying
    definitions on technological grounds allows for the distinction of legitimate
    military targets and permits for the establishment of policy tools such as escalatory
    ladders. Embargo and trade sanctions might be the correct approach in milder cases
    of gross intellectual property theft and serve as a warning and token of severe
    penalties to come should something escalate from cyber espionage to attack. It
    is in the early scale of malicious cyber events that the United States'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'should diplomatically address criminal disputes. Claiming all malicious actions
    as cyberwarfare could result in threats of retaliation which, in a real cyberwar,
    could be discounted as a bluff. Vigorously grasping at the situation that we are
    in, rather than fearfully reacting and making desperate pronouncements, will prevent
    misperception by our adversaries and the public alike.


    Participants in debates about air, land, sea, and space power all know what they
    mean by armed attack and the use of force. Definitions and a common lexicon are
    the basis of all debates on warfare. What little argument takes place about definitions
    usually revolves around two or three assertions that more or less mean the same
    thing.


    The United States, its allies, and other nations around the world invest vast
    sums into cyberspace, a domain that is identified not only as a critical national
    infrastructure with myriad vulnerabilities, but also a war fighting domain that
    is increasingly critical to delivering military capabilities and operations. The
    purpose here is to encourage a formal debate to forge common cyberspace definitions
    that are rooted in technological realities that will eventually lead to more coherent
    domestic and international cyber policy, strategy, and doctrine. This is not a
    topic of mere academic semantics. In 1911, the British maritime theorist Sir Julian
    Corbett wrote about the importance of definitions thus: “Without such an apparatus
    no two men can even think on the same line; much less can they ever hope to detach
    the real point of difference that divides them and isolate it for quiet resolution.”76


    The absence of a clear understanding of what cyberwarfare is—and more importantly,
    what it is not—continues to present challenges. This is largely due to an absence
    of understanding of the underlying technologies and expertise required to mount,
    and the tools, techniques, and procedures that would result in, an incident qualifying
    as an armed attack in cyberspace. Experienced professionals all too often contribute
    to confusion by focusing concepts of cyberspace on information and communication
    technologies (ICTs), while not understanding their difference from industrial
    control systems (ICSs). ICTs are those technologies used daily by people globally
    for socioeconomic purposes. ICSs control the physical systems on which modern
    societies also depend. However, there, cyber and physical boundaries blur. Actions
    associated with systems, instrumentation, and controls—through and by means of
    cyberspace—can have actual physical effects.


    Not making this distinction between targets leads to the conflation of incidents
    that target malicious actions on corporate functions, such as e-mail servers,
    with cyber-physical effects, such as Stuxnet. In short, ICT views security through
    the lenses of Windows, the Internet, malware, botnets, etc., which are used for
    espionage, crime, and disruption. While these may also be issues for control systems,
    the vulnerabilities that can cause significant physical effect, such as Aurora,
    are on ICS proprietary platforms and software that are not exploitable by malicious
    software targeting ICTs.


    Not making this distinction between ICT and ICS leads to very different incidents
    treated as a single concept: cyberwar. Illustrative of this is a proclamation
    by the Washington Post’s editorial board that “China is waging a quiet,'
