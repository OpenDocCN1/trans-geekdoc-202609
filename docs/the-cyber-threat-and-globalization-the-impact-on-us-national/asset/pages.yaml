- pgno: 149
  md: 'Russia strives to create a military force in cyberspace that is deployable
    and adaptable anywhere in the world. By merging the martial and the political
    into a single doctrine, the strategy compensates for its inadequacies in electronic
    warfare (C4ISR) vis-à-vis the United States, while defending its interests behind
    a veil of anonymity and plausible deniability. One key element lies in part in
    the capacity to achieve military outcomes by nonmilitary methods. Cyberspace is
    a force multiplier and/or alternative for large-scale military operations. The
    ability to deny, destroy, exploit, corrupt, or usurp automated decision making
    via ICS and SCADA systems of adversaries is an ongoing industry. The manipulation
    of organizations and population segments of targeted societies through the deployment
    of public information campaigns (“psyber warfare”) is, simply, ongoing.


    A rootkit useful in helping to achieve parity of power was found on the Ukrainian
    government computer systems as early as 2010. Known as Uroburos,116 this particular
    APT appears to be part of a widespread campaign known as “Snake”117 (sometimes
    spelled “Ouroboros,” the word is a reference to a mythical two-headed snake).118
    It interacts with the malicious code (described above) called Agent.BTZ. Once
    installed, typically through e-mail scams, watering hole attacks, and USB insertions,
    Agent.BTZ beacons out to a command-and-control computer to upload the Uroburos
    malware. U.S. authorities first discovered it on defense systems in 2008 and described
    it then as “the worst breach of military computers in history.”119


    The designers of Uroburos, who were concluded to be Russian agents, created it
    to scan for Agent.BTZ in order to infect entire systems and exfiltrate sensitive
    information. Its sophistication, flexibility, and elegance suggest the developers
    had access to advanced technology and funding.120 Its targets, suitably, are intelligence
    agencies, businesses, government agencies, and research and education facilities.
    Apparently, Russians used Uroburos primarily to spy on Ukrainian government communications.
    However, analysts also conclude that it had the capability to take control of
    computers and shut down information systems.121 Its brilliance lies in the way
    it propagates through networks, infecting systems as it also scans for hosts with
    active Internet connections. Once it locates a connected host, the information
    it collects can then be exfiltrated from air-gapped systems for retrieval. Because
    the software is complex and discreet, it is able to bypass many security controls
    and escape detection.122 However, even after detection, the code remains implanted
    in the system and continues to search for flaws for further compromise and eventual
    exfiltration of data.


    Tools such as these were in place to promote Russian forces “information superiority”123
    alongside military superiority. The arc of operations against pro-Ukrainian forces
    in Crimea and the eastern part of the country entailed attempts to manage the
    information flow, which ranged from compromising secure communications to overwhelming
    the public narrative:


    The events in Crimea that unfolded in spring of 2014 provide important clues for
    the interplay between IOs [information operations] and kinetic activity. The course
    of events—from the takeover of parliament in Simferopol and dismantling of the
    Ukrainian military presence on the peninsula, to the disputed referendum and the
    de facto annexation of the area to the Russian Federation —was'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'accompanied by intense activity aimed to control the flow of information. This
    activity extended across the entire spectrum of communication and included kinetic,
    cyber and IOs targeting the physical, logical and social layers of communication.124


    Warfare in cyber includes attacks on ICS and telecommunications equipment to disable
    infrastructure or communications. Information warfare is influencing public opinion
    by the spread of disinformation and propaganda campaigns to minimize or turn the
    resistance. With respect to the latter, the Russian Cold War idiom “active measures”
    (aktivnye meropriyatiya) applies to operations that involve false news and accounts,
    the use of front groups, and forged documents to discredit individuals, institutions,
    and policies.125 These practices were distinct from espionage, which are operations
    deployed to gather information. Active measures are operations deployed to influence
    events. It is a craft plied by many actors and one that not only survives but
    thrives in the arena of cyberwar. The technology of the information age and the
    process of globalization have enabled new opportunities and enriched such operations
    with a new potency. The Russian leadership has long recognized the potential of
    these tactics and, owing to traditions that go back to Leninist doctrine, have
    created an infrastructure of technical resources populated with hacktivists and
    operatives with finely honed skills. The same personnel and expertise often operates
    small armies of Internet trolls to deepen and amplify these campaigns. For an
    added splash of inspiration, a quote from Lenin, the founder of the Soviet state,
    contains the central pitch of these strategies: “A lie told often enough becomes
    the truth.” To be fair, the United States has also engaged in active measures
    of its own, but, as noted above, not with the same unbridled access to domestic
    economic/market levers and capability to manipulate a subservient press.


    One hacktivist group engaged in active measures tactics was CyberBerkut. It formed
    during the early stages of the Euromaidan protests. The community of hackers claimed
    credit for attacks on the Ukrainian electronic voting system and the Ministry
    of Defense. In expressing their opposition to Ukrainian independence from Russia,
    CyberBerkut proudly posted all their assertions on their website and on social
    media.126 It also attacked NATO and even Polish websites in August 2014. Nearly
    forty Polish government websites, including the Warsaw Stock Exchange, were defaced.
    Apparently, these attacks were in retaliation for Poland’s involvement in NATO
    and support for the Ukrainian government. The defacement involved posting graphic
    images of the Holocaust.127


    The Russian military revitalized and modernized the concept of “active measures”
    to fit the demands of the post-Soviet era. Independent hackers, criminal elements,
    and anonymous state security organizations with deep covers formed the shadowy
    cyber army to disrupt communications and disseminate propaganda and false information.
    Russia and pro Russian operatives directed botnet and DDoS attacks against Ukraine
    through March 2014 and up to the referendum.128 Although the scale of the attacks
    was confined and the damage to the infrastructure insignificant, they substantially
    contributed to the annexation of Crimea. A reason for there not being a more aggressive
    cyber campaign was most likely due to concerns for inadvertent blowback on Russia’s
    own networks.'
