    # A Two-Edged Sword


    Various examples of how these risks can seep into our daily routines are both
    self-evident and quite subtle. In 2010, researchers demonstrated that they could
    directly control the locks, brakes, and engine of an automobile by connecting
    a computer into the onboard diagnostics ports of the automobile. They success
    fully bypassed the independent driver and automated controls that operate the
    vehicle. They later proved that they could take control wirelessly through cellular
    radio, Bluetooth, audio compact disc players, navigation systems, and emergency
    communications. There is no documentation or studies on the number of auto accidents
    that have been caused by cyberattacks. However, the average luxury car has up
    to 100 computers and at least seven networks controlling everything from entertainment
    to performance and location detection.⁵² Considering their frequency and what
    is known to be technically feasible, the threat of a car acci dent as a violent
    crime or assassination attempt rather than an unintended colli sion can be deemed
