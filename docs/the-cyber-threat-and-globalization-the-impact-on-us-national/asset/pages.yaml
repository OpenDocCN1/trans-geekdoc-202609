    # Distributed Ledger Technology


    In 2013, U.S. federal authorities seized the website and server of a black mar
    ket site known as Silk Road. The following year, the FBI took down the same platform
    a second time after it had reemerged. From 2011 to 2014, Silk Road engaged in
    the illegal trade of narcotics, malicious software programs, pirated media, fake
    passports, computer hacking services, and money-laundering schemes. The payment
    method for these illegal goods and services was the cryp tocurrency known as Bitcoin.
    As briefly discussed in chapter 2, cryptocurrencies are digital assets and a medium
    of exchange that use cryptology to secure finan cial transactions. Because they
    exist outside the traditional banking system, par ticipants in cryptocurrency
    markets benefit from minimal transaction fees, faster transaction times, and varying
    degrees of anonymity.


    Their popularity has grown in seismic proportions since 2009 when Bitcoin was
    launched. “Parents are dispensing allowances in Bitcoin to teach their kids to
    be digital citizens. Marijuana smokers are buying buds from Bitcoin-enabled vending
    machines. Consumers in emerging markets such as Brazil and Russia are starting
    to use Bitcoin to hedge their volatile currencies.”45 In 2016, Bitcoin more than
    doubled its value. In fact, it gained 126 percent in one year, surpass all world
    fiat currencies. According to the 2016 Akamai Threat Advisory, the factors contributing
    to its appreciation were speculation over the instability of national currencies
    and a flight of cash from the Chinese yuan, which accounted for 98 percent of
    all Bitcoin trades.46


    There are many legitimate uses for virtual currencies. Besides reducing transaction
    costs, they facilitate online micropayments. (Micropayments are very small payment
    amounts usually incurred when a user accesses an Internet page or service—such
    as music downloads.) In territories where banking systems are underdeveloped and
    lacking infrastructure, such currencies can also support and boost local commerce.
    Virtual currencies abet commerce in the developed world as well. Because they
    mostly conduct business within their own financial ecosys tem, participants in
    these currency markets not only benefit from the minimal fees and compressed transaction
