  md: '# # Box 8.3 Autonomous Warfare Glossary


    **Autonomous weapon system:** "A weapon system that, once activated, can select
    and engage targets without further intervention by a human operator. This includes
    human-supervised autonomous weapon systems that are designed to allow human operators
    to override operation of the weapon system, but can select and engage targets
    without further human input after activation."


    **Human-supervised autonomous weapon system:** "An autonomous weapon system that
    is designed to provide human operators with the ability to intervene and terminate
    engagements, including in the event of a weapon system failure, before unacceptable
    levels of damage occur."


    **Semi-autonomous weapon system:** "A weapon system that, once activated, is intended
    to only engage individual


    targets or specific target groups that have been selected by a human operator.
    This includes: semi-autonomous weapon systems that employ autonomy for engagement-related
    functions including, but not limited to, acquiring, tracking, and identifying
    potential targets; cueing potential targets to human operators; prioritizing selected
    targets; timing of when to fire; or providing terminal guidance to home in on
    selected targets, provided that human control is retained over the decision to
    select individual targets and specific target groups for engagement."


    Source: DoD Directive 3000.09, 2012, https://www.defense.gov/News/Article/Article/1254719/project-maven-to-deploy-computer-algorithms-to-war-zone-by-years-end.


    In addition to the above issues, the partnership between the private sector and
    DoD will be strained and may require forging a new public-private partnership
    between the government, defense industry, and IT sector. Many companies in the
    software and hardware sectors of the IT industry have little or no experience
    working with either the U.S. government or defense industry prime contractors,
    subcontractors, and systems integrators.⁴¹ They see the rigors and myriad regulations
    of dealing with the federal government acquisition process as discouraging and
    would rather sell to the Fortune 100s of the world than cope with the compliance
    burdens, cost accounting standards, and intellectual property issues that government
    contracts impose.⁴² For its part, the DoD may have to sacrifice some organizational
    and cultural themes in order to attract talent for a more innovative military.⁴³
    A business model approach to operations might displace traditional military methods
    of thinking when necessary.


    Withal, the United States should also find a way to convince its allies to develop
    similar high-end technologies. However, the inducement to commit to invest in
    futuristic weapons could be a difficult sell during times of domestic political
    and economic uncertainty. In the backdrop to these issues is the fact that we
    live in uncertain times and will probably dwell there for at least the foreseeable
    future. In this environment, security forces will have less margin for error than
    predecessor regimes, as unforeseen swings in power alignments and power dispersions
    seem to occur regularly and almost naturally.


    This chapter opened with a discussion about attempts to predict the future of
    the cyber terrain. The pace of development within this domain is staggering,'
