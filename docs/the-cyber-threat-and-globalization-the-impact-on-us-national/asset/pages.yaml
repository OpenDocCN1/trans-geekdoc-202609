- pgno: 122
  md: 'In March 2015, a hammering attack on a popular coding website called GitHub
    forced the management of the software development platform to announce via Twitter,
    “We’ve been under continuous DDoS attack for 24+ hours. The attack is evolving,
    and we’re all hands on deck mitigating.”79 The hosting service maintained the
    web pages for a target of particular interest to the CCP—GreatFire. GreatFire
    is a dissident organization that opposes Chinese censorship. The group uses the
    GitHub platform to set up mirror sites of the New York Times, the BBC, and Google
    (a mirror site is a website on a network that stores some or all of the content
    from another site). The group also monitors cyber censorship activity and helps
    users circumvent the government’s attempts to block access to politically sensitive
    websites.


    In the attack on GitHub, the Great Cannon intercepted Internet traffic and sent
    it to the infrastructure servers of the Chinese web services company Baidu. Baidu
    runs China’s largest search engine and is one of the largest Internet companies
    in the world. Malicious script was inserted into the traffic and aimed at the
    target, which overloaded GreatFire and caused damages resulting in “except tional
    cost” for the organization.80 Internet users were unknowingly “enlisted” and made
    involuntary requests to visit specific sites within GitHub. The Great Cannon weaponized
    their communications and set a disturbing precedent in its abuse of network systems
    and international norms.


    There are equivalent content hijacking/attack tools in the West. However, their
    usage is restrained, so far, by legislative oversight and the rule of law. In
    China, the system of checks and balances is less democratic. Further, according
    to Alex Hern of the Guardian,


    > The Cannon is potentially able to be more damaging still. A technically simple
    change in its configuration would let it target specific individuals, even if
    they did not reside in China, and intercept their communications the minute they
    com municate “with any Chinese server not employing cryptographic protections.”81


    In the meantime, as the Great Cannon continues to hijack Internet traffic to suit
    its purposes, people inside and outside the PRC will be subject to a weaponized
    suite of information systems designed to undermine the things the government opposes,
    such as freedom of speech.82 While virtual private networks (VPNs) provide some
    loopholes by enabling users to encrypt and tunnel through dif ferent countries,
    these outlets from the system are mostly restricted to business elites. The remaining
    population, which accounts for 40 percent of all global retail sales, continues
    to have their voices and purchasing power held in restraint.


    # PLA Reform and the Strategic Support Force


    As mentioned above, the PLA is in the early stages of a massive institutional
    overhaul. A corrupt military establishment, failures to modernize and conduct
    joint war-fighting operations across multiple domains, and a need by the CCP to
    control a fragmented and contentious association of administrative bodies while
    safeguarding its own interests have forced the PRC to launch the biggest orga
    nizational reform of its military establishment in decades.83 The reorganization’s'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'official start was December 31, 2015. From an edifice with roots to the Soviet
    organizational style of the 1950s, a new construct of force structure and policy
    began to evolve and is expected to continue taking shape through 2020. The vision
    projects a model closer to that of the United States, where lines of authority
    are streamlined and operational commanders have the responsibility to organize,
    train, and equip their own troops. Despite the new command accountability, however,
    the CCP maintains control over political commissars and CCP committees in order
    to ensure compliance with the leadership’s goals and its participation in all
    key decisions.84


    These changes will impact China’s cyber operations. After initial conjecture over
    the nature and scope of the mission of the Strategic Support Force (SSF), analysts
    conclude that this agency “will formulate the core of China’s information warfare
    effort.”85 The SSF focus will be, specifically, on space, cyber, and electronic
    warfare.86 Further, the General Staff’s Third and Fourth Departments, the PLA’s
    preeminent cyber intelligence and espionage units, will most likely be integrated
    into the SSF. These operations will involve “hacker troops” responsible for cyber
    offense and defense, a “space force” to conduct surveillance and satellite operations,
    and an “electronic force” to undertake signal interference and disinformation.
    The SSF might also assume the mission of the Second Department, the conventional
    and human intelligence arms of the PLA.”


    The conventional wisdom is that such sweeping reorganization will unify a broad
    and diverse array of cyber operations under one “information umbrella.” The stovepiping
    and competition between units would presumably yield to a single intelligence
    and information warfare structure, which will utilize every resource to its maximum
    capacity.88 Despite the promise, rivalries, organizational cultures, allegiances,
    and competition over resources often persist in any bureaucracy regardless of
    the type of government. These reforms are ambitious, and success is hardly assured.


    The political implications could also be enormous. Not only will the SSF control
    a substantial constituency of personnel and resources of the PRC’s vast, two-million-plus
    military, but it will also undertake the responsibilities of protecting the expanding
    civilian infrastructure and China’s financial institutions. In general, the daily
    routines and quality of life of China’s citizenry will be part of its purview.89
    In addition to absorbing military personnel, the SSF will include the ranks of
    independent and semi-independent hacker groups and employees of commercial organizations.
    To put the scope and magnitude of its oversight and administration in proportional
    perspective, consider the unit as a fusion of military and commercial organizations.
    That paradigm would equal an American analog that would engulf the combined resources
    of government and military entities and include companies such as “Intel, Boeing
    and Google to the mix. Such a swath of organizations represents a U.S. equivalent
    model of how the SSF is conceived and constructed to operate.”90


    It still remains to be seen how much the structure will reflect the concept of
    the original blueprint. What roles previous units will fill and perform in the
    new organization and how the interaction between old regimes and developmental
    workforces will play out are speculative. At this point a prudent response might'
