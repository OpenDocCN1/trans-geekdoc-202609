    medley of patch updates. Rather than an integrated, whole-cloth design, such repairs
    weaken system integrity. A common fear is when industrial controllers and SCADA
    software systems are replaced and updated, hardware may be compromised.44 The
    use of COTS may even violate manufacturer certification.45 Additionally, COTS
