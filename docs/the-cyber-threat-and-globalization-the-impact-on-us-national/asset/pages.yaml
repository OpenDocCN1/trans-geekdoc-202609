  md: '# North Korean Cyber


    Adam Albarado


    Proponents of cyber as an effective tool of statecraft argue such attacks are
    ethical because cyber weapons are able to specifically target certain systems
    to produce desired effects.1 Opponents of such claims argue that there are too
    many limitations to its usage for cyber to be truly effective.2 The reality is
    that cyber is most effective as an element of statecraft when used in conjunction
    with a whole-of-government approach to coercion or deterrence where the state
    maintains escalation dominance. Such capability normally resides with the stronger
    state. Yet weak states continue using cyber as a tool of statecraft in attempts
    to coerce and deter adversaries. North Korea (DPRK) is an example of such a country.


    In addition to its tepid economy, it is also weak in most other forms of traditional
    statecraft. I define traditional forms of statecraft as the elements of DIME,
    that is, diplomatic, information, military, and economic. The outlier here is
    that, while most of North Korea’s military equipment is outdated, it maintains
    one of the world’s largest militaries with over one million active duty and eight
    million reserve personnel.3 Its artillery holds Seoul, South Korea’s capital,
    under constant threat of annihilation, making the North’s military a credible
    threat despite questionable capability in conventional force-on-force engagement.
    Thus, its military can be used in conjunction with cyber to assist with coercion
    efforts. While other weak states may not have such military capability, what matters
    is that there is another element of state power that can be brought to bear.


    Another characteristic of North Korean statecraft is its willingness to eschew
    international norms. One example of this is Pyongyang’s continued nuclear testing
    in the face of international acceptance of the Nonproliferation Treaty (NPT) and
    despite multiple United


    Nations Security Council (UNSC) resolutions intended to punish the DPRK for its
    nuclear program.4 Another example is North Korea’s persistent ballistic missile
    tests, which are also repeatedly condemned and sanctioned by the UNSC.5 UNSC resolutions
    are binding to all UN member states, which includes North Korea. However, North
    Korea continues to ignore such objections to its behavior, weakening arguments
    that cyber norms can effectively deter state-sponsored cyberattacks and act as
    a stabilizing influence in cyberspace.6


    Pyongyang has launched numerous cyberattacks since 2009, with some estimates claiming
    North Korea perpetrates as many as 250 million cyberattacks per day against South
    Korean online entities.7 Given the lack of Internet access to the general population,
    this activity indicates Pyongyang understands the importance of cyber as an asymmetric
    alternative and has invested heavily in its cyber warfare proficiency. With an
    aging military infrastructure and limited sources of national power, the DPRK
    has used cyber in an effort to exert pressure on stronger, more capable adversaries
    and retain its global relevance.


    North Korea, under the leadership of both Kim Jong-Il and his successor, Kim Jong-Un,
    has developed cyber capabilities since the 1990s in hopes of building cheaper
    asymmetric options to use against more powerful adversaries.8 Before the advent
    of the Internet, North Korea was limited to conventional military options to support
    its campaigns of coercion and deterrence, aimed mostly at South Korea. According
    to the International Telecommunications Union, South Korea had the highest ICT
    development index (IDI) score, of all 167 countries measured in 2015. With such
    reliance and integration of all aspects of cyber into the national makeup, South
    Korea is one of the most'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'vulnerable countries to cyber threats. The U.S. is not far behind at 15.9.


    North Korea stands at the other end of the ICT spectrum. Although sufficient data
    is not available to calculate a valid IDI score, it is estimated only a handful
    of elites out of the state''s 25 million people have regular Internet access.
    Such limited connectivity provides North Korea with the advantage of limited cyberattack
    vulnerability when compared to more powerful nations whose economies and command
    and control systems are more dependent upon stable and reliable ICT systems.


    Despite Seoul''s vulnerability to cyberattack, Pyongyang has been unable to translate
    its cyber aggression against its neighbor into noticeable state benefit. While
    some DPRK cyber activities arguably fall within a deterrence framework, other
    actions are better characterized as geopolitical protests or proof-of-concept
    demonstrations to refine future cyber capabilities. Cyberattacks against South
    Korea''s financial sector and government in 2009, 2011, and 2013 created significant
    inconvenience for South Korean citizens, erasing bank files for some, and contributing
    to overall public unease. Although these actions did not result in any obvious
    concessions to North Korea, they also did not result in effective actions in retaliation
    against Pyongyang.


    Outside of the 2014 Sony Pictures Entertainment (SPE) hack, little has been written
    regarding possible motives or objectives for some of the more significant attacks
    over this period. While Pyongyang''s persistent cyber aggression likely furthers
    overall goals associated with the technical state of war between the two neighboring
    states, cyberattacks offer the North a tool that can be used in peacetime and
    wartime with little risk of consequence. Since the elevation of Kim Jong-Un in
    December 2011, the young leader has embarked on a recurring cycle of aggression
    across various domains in order to stabilize his regime and obtain leverage over
    the South through coercion


    and intimidation. The cyberattacks of 2013 and 2014 provide context to draw conclusions
    regarding Kim Jong-Un''s objectives during these events.


    # Overview of Notable North Korea Cyberattacks


    If press reports are accurate, South Korea is under daily attack from DPRK hacker
    units.10 Although North Korea has one of the poorest economies in the world, the
    reclusive regime maintains 17 cyber warfare organizations comprised of approximately
    5,100 personnel who carry out research and development in addition to cyber espionage
    and cyberattacks against various entities.11 Since 2009, North Korean hackers
    have persistently targeted South Korean media, financial, and political institutions.12


    Pyongyang continues aggressive actions in cyberspace despite being ostracized
    from the international community and deprived of the economic benefits of globalization.
    What makes North Korea difficult to defend against is its disregard for international
    law. This disdain for international law makes North Korea unpredictable and weakens
    normal methods of deterrence and coercion. What follows are overviews of two of
    the more significant North Korean malicious cyber actions. An examination of these
    events and the responses by international actors lend insights into the effectiveness
    of cyber as an element of statecraft and potential deterrence responses by the
    victims.


    # 20 March 2013 DarkSeoul Attack


    On 20 March 2013, the networks of three of Seoul''s main television broadcasters
    (KBS, MBC, and YTN), along with three South Korean banks (Shinhan, Nonghyup, and
    Jeju) were attacked by “DarkSeoul”'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'malware suspected of being distributed by Bureau 121 hackers from North Korea.13
    The attacks resulted in the networks of the affected companies being frozen, with
    some customers of affected banks being unable to withdraw money from ATMs and
    news broadcasting crews unable to access computers. Unlike the distributed denial
    of service (DDoS) attacks South Korea experienced in the past, DarkSeoul malware
    was specifically designed to defeat popular Korean antivirus software and hit
    the targeted networks. Notably, all the victimized businesses had been previously
    cited as potential targets by Pyongyang. It is obvious Kim Jong-Un was trying
    to send a message. The New York Times suggested that the North’s leader was demonstrating
    that “[North Korea] can reach into Seoul’s economic heart without blowing up South
    Korean warships or shelling South Korean islands.”14


    The outages in each affected network only lasted a few hours before bank and computer
    services were restored. None of the television broadcasters’ programming was interrupted.15
    On 10 April 2013, the South Korean government announced North Korea was behind
    the attack and had evidence the attacks had been planned for at least eight months.16
    While it is ultimately unknown why the 20 March cyberattacks against South Korea
    occurred, awareness of some of the events surrounding the incident provides context
    within which to gauge possible DPRK objectives.


    The year, 2013, was a low point in North-South relations on the Korean peninsula.
    In just his second year of power, Kim Jong-Un was still consolidating his position
    as North Korea’s Supreme Leader and possibly looking for opportunities to demonstrate
    strength to a domestic audience. On 12 February 2013, North Korea conducted its
    third nuclear test with the detonation of what it claims was a miniaturized device,
    giving fuel to fears it was closer to weaponizing a nuclear warhead with which
    to arm a ballistic missile.17 The test violated the UN


    NPT, to which North Korea was a signatory member until formally withdrawing in
    2003, and blatantly disregarded international norms on nuclear testing.18 The
    nuclear test also occurred on the same day President Obama delivered his State
    of the Union address for 2013 and coincided with threats several days earlier
    from DPRK news outlets to retaliate against the U.S. and South Korea for cyberattacks
    it claims to have suffered.19


    In addition to the nuclear test, the South inaugurated its first female president,
    Park Geun-hye, on 15 February, roughly one month prior to the 20 March attacks.
    The inauguration occurred approximately two weeks prior to the 1 March commencement
    of the annual FOAL EAGLE combined field training exercise involving over 210,000
    U.S. and Korean military forces. The multi-week FOAL EAGLE exercise, conducted
    by the Combined Forces Command, has been a source of friction between the North
    and South for years. The North routinely proclaims the exercise to be a provocation
    to war. On 8 March, in the aftermath of fresh sanctions against Pyongyang for
    its nuclear test and in the run-up to FOAL EAGLE, North Korean news agencies announced
    the nation had “scrapped” the 1953 armistice. It also threatened military retaliation
    against South Korea and the U.S., and cut off a Red Cross hotline between the
    two governments on 11 March, the same day the annual U.S., ROK computer-assisted
    command post exercise, KEY RESOLVE, began.20


    In response, U.S. Secretary of Defense Chuck Hagel announced the U.S. would place
    14 additional ground based interceptor (GBI) missiles in Alaska as a deterrent
    to North Korean threats. The U.S. also deployed four additional guided missile
    destroyers (DDGs), stationed B-52 bombers in Guam, and brought F-22 Raptors to
    participate in the final part of the exercises. Finally, the North continued provocations
    by staging an unusually aggressive military exercise of their own, within their
    own borders.21'
