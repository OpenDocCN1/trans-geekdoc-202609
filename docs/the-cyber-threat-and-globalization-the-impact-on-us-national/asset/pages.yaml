  md: '# # 2013 North Korean Objectives and Results


    Under the rule of Kim Jong-Un''s father, Kim Jong-Il, North Korea routinely conducted
    a predictable cycle of brinkmanship that usually resulted in concessions from
    the United Nations or South Korea in exchange for a cessation of the North''s
    provocative behavior. In exchange for halting activity at its Yongbyon Nuclear
    Scientific Research Center, or other incendiary behavior, the North received economic
    aid or other forms of dispensation, strengthening the Kim family''s hold on power.22
    After the death of Kim Jong-Il in December 2011, Kim Jong-Un attempted similar
    behavior by launching a long-range ballistic missile in December 2012. While the
    launch served a military research and development purpose, it is likely the younger
    Kim anticipated similar concessions, which he could use for domestic consumption
    and subsequently consolidate his hold on power.


    North Korea is also known to posture before each KEY RESOLVE/FOAL EAGLE (KR/FE)
    set of exercises in an attempt to coerce the U.S. and South Korea into canceling
    the exercise. As stated, the North equates the annual exercise to war preparations
    by its adversaries. In the past Pyongyang has offered to suspend nuclear tests
    and return to Six Party Talks on denuclearization in exchange for a halt to joint
    U.S., Korean exercises.23


    Early 2013 provided an optimal time for Kim Jong-Un to attempt to coerce concessions
    from South Korea''s new president given her recent inauguration; fresh UN sanctions
    as a result of the North''s December 2012 ballistic missile launch; threats of
    new sanctions as a result of a third nuclear test in February; and the upcoming
    KR/FE combined exercise. Each of these events can be viewed as attempted coercion
    by deterrence and coercion by compellence. On the one hand, through its actions
    the DPRK was attempting to deter the South from conducting KR/FE. On the other,
    Kim was


    likely also attempting to coerce concessions (e.g., increased humanitarian aid
    and possibly increased dialogue with the international community) to solidify
    his domestic position and increase his legitimacy. The computer attacks on South
    Korea''s financial and media networks were intended to signal an escalation in
    coercion attempts. North Korea likely chose computer attacks because it was one
    of its few options left for escalation.


    While North and South Korea have been at a stalemate since the official end of
    hostilities in 1953, both enjoy what academics term the stability-instability
    paradox. Such a situation is said to exist when there is enough overall deterrence
    for either side to engage in all-out warfare, but not enough deterrence to prevent
    minor provocations. Stephen Haggard and Jon R. Lindsay cite the Cold War as such
    an example. During the Cold War, the risk of nuclear warfare and mutually assured
    destruction deterred nuclear and large-scale conventional war between the U.S.
    and the Soviet Union. However, this threat did not deter proxy wars between the
    two nations, or minor conventional conflicts. Haggard and Lindsay conclude their
    analogy by saying, “The use of threats to attenuate the risks of general war .
    . . can incentivize lower-level aggression.”24 In the case of North and South
    Korea, this situation exists because, while U.S. and South Korean forces enjoy
    overwhelming conventional advantages, South Korea''s major economic and population
    centers are well within range of the North''s excessive conventional capability.
    While South Korea might win any prolonged military engagement with the DPRK, the
    possibility of such conflict turning into a regional war and the devastating damage
    it would cause prevent such conflict, but is not enough to prevent lesser forms
    of aggression, such as the March 2013 cyberattacks.


    Ultimately, Kim''s efforts in 2013 failed to produce coercion by compellence or
    deterrence and his added use of cyber aggression can be viewed as an attempt at
    escalation in order to achieve his strategic'
