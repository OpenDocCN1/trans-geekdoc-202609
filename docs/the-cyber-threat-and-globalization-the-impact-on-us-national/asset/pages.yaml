- pgno: 93
  md: 'small groups and have the ability to swarm, penetrate, disperse, disrupt, elude,
    evade, and reform (resilience). Organizationally, these challengers to established
    power recall past asymmetric conflict since the age of Rome. Now the same tactics
    are adaptable to the information age.


    In contrast to ISIS and al-Nusra “media mujahedeens,” Anonymous is a loose collective
    of hackers devoid of any ideological bent or core beliefs who operate similarly.
    Rather than a network of dedicated believers organized to create a constant presence
    for the purposes of spreading propaganda, planning attacks, organizing operations,
    and recruitment, Anonymous members, known as Anons, have no distinct profile.41
    This is a global collection of hacktivists and script kiddies where dissent is
    common and goals vary depending on consensus and relativity to a foundational
    principle. Authoritarianism is a frequent thematic target. It is a cyber mob that
    sporadically leverages its mass number of participants of varying skill levels
    to protest governments, institutions, and sometimes individuals they deem antidemocratic.
    Media outlets, however, are exempt from their ire and assault.


    Past targets include government entities in the United States, Canada, Israel,
    Tunisia, and Uganda. Anonymous has also targeted the Church of Scientology and
    various known criminal organizations. Attacks mostly involve DDoS and website
    defacements against organizations the group considers antithetical to their common
    opposition to censorship and control of Internet platforms. Visa, MasterCard,
    and PayPal fell victim to them as a result of their refusal to process payments
    to WikiLeaks. Other high-profile prey includes websites of the U.S. Department
    of Justice, the FBI, Sony, the Motion Picture Association of America, and the
    Recording Industry Association of America in 2012. According to Anonymous, their
    “crime” was the effort to shut down one of the world’s largest file-sharing sites,
    Megaupload.42 On the other hand, the Arab Spring and the Occupy movement found
    support.


    Since 2003, the group has been responsible for mostly nuisance and protest campaigns
    against its perceived foes, and sometimes it operates with an affiliated hacker
    group, LulzSec (short for Lulz Security). Although these attacks cause relatively
    little damage, “the group’s construction and global membership afford it significant
    influence and resilience to law enforcement efforts.”43 Despite efforts by authorities
    to control its movement, in 2015, Anonymous claimed responsibility for attacking
    such high-profile targets as the World Trade Organization, Trump Towers, and an
    ISIS website. In 2017, Anonymous also attacked the websites of Spain’s Ministry
    of Transportation and Ministry of Public Works in support of Catalonia’s independence.44


    Over time, it has created for itself a distinctive brand name. Its website (in
    nonstandard English) claims, “We will always fight for people rights. We want
    every citizens of the world is equal. We harm anyone at any time who doing wrong
    things.”45 Anonymous videos often end with the patented catchphrase: “We are Anonymous.
    We are legion. We do not forgive. We do not forget. Expect us.” Their crest and
    motif is a stylized mask of Guy Fawkes, the main conspirator of the plot to blow
    up the British House of Lords in 1605.


    Pure, unadorned crime is of course another great motivator among hacker groups.
    As in the legitimate world, there exists an economic service sector for'
