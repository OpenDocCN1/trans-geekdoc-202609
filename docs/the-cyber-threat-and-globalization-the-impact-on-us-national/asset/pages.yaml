    # Information Technology versus Operational Technology


    Cyberspace infrastructure is the critical underpinning of the global economy.
    We depend on this critical infrastructure to conduct business, power our households,
    access financial assets, and provide and receive health care. Hence, the security
    of these networks is central to our daily life and national defense. The reliance
    of societies on cyberspace and the data flows that information communication technologies
    afford us is essential for our current economic prosperity and national security.
    These dependencies also represent a new domain of human activity and conflict.


    In today''s conflict arena, the threats and sources of attacks are myriad. Cybercriminals,
    disgruntled employees, terrorists, activists, organized crime syndicates, and
    state actors all have their own resources and motivations. In order to understand
    the cyber threat, however, we need to understand what makes something a target—the
    apparatus, properties, and functionalities that create an “exposure.” We also
    need to understand how these elements interoperate and where they disconnect.
    Such insights reveal how security gaps are created through the flaws of legacy
    systems, conventional approaches to system/network management, and the economic
    pressures that drive investment.


    Information technology (IT) is a broad term. It basically refers to the use and
    study of systems that store, send, receive, and process data. Excluded from references
    to IT are personal or home computing and networking. On the other hand, operational
    technology (OT) is the hardware and software systems that manage and monitor the
    physical equipment that operates the critical infrastructure, automated manufacturing
    processes, and defense networks. Although these two environments share some commonality,
    they historically remain separate domains and are managed as independent silos
    within organizations.35 Not only are they distinct in their functionality, but
    they differ culturally and strategically as well. Traditionally, commercial enterprises
    view IT as a cost center and a support unit, while OT more directly aligns with
    the core business and return on assets and investment.


    Critical infrastructure sectors such as utilities, water, oil and gas, energy,
    and transportation rely on OT systems for operation, support, and upgrade. The
    same is the case for the vast defense industrial base and manufacturing and pharmaceutical
    firms. These enterprises require a system to perform limited functions but'
