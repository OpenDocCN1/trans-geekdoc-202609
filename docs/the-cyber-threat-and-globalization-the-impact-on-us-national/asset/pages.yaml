- pgno: 59
  md: 'for the purposes of cyber espionage are increasingly found in attacks on private
    sector enterprises, particularly financial institutions.48 Since its entrance
    into the modern lexicon as a military term, advanced persistent threat is now
    a buzzword with a definition and functionality with grander sweep. APT attacks
    can originate from any number of states, global corporations engaged in industry
    espionage, criminal groups, and possibly terrorist organizations as well.49 They
    not only collect data, but can also potentially cause considerable damage and
    panic.


    When addressing an APT in connection with a foreign government, attribution is
    a particularly complex and problematic issue. The perpetrator might be a hostile
    state or involve surrogates. Governments can claim plausible deniability if the
    sources of the attack are private actors who mask their linkages with official
    authorities. The shadows of cyberspace offer excellent cover for states who use
    hackers “as part of their weapons system.”50 The targets (whether governmental
    or private) of an APT find themselves in a perilous position of having to conclude
    whether the attack was an act committed by a group of cybercriminals or an act
    of war committed by a private actor with official support. The agent can also
    be an official masquerading as a criminal unaffiliated with a regime.


    The source of an APT determines what warrants a justifiable and legal appropriate
    response. If the boundaries between the government and its proxies blur, options
    for the victim fall into the same gray zone of ambiguity. This type of asymmetric
    warfare has been tracked and documented. Since its earlier days as a phenomenon,
    APTs have become a nightmare scenario for the cybersecurity industry. Beginning
    in 2003, investigators believed cyberattacks originating in China were systematically
    and routinely launched against government targets in the United States. Within
    five years, according to the 2008 Report to Congress of the U.S.-China Economic
    and Security Commission, there were 250 hacker groups operating in China with
    either government support or encouragement.51 Chinese hackers have been credited
    with electronic intrusions against the State Department and the Departments of
    Defense, Energy, Agriculture, Treasury, and Health and Human Services. For obvious
    reasons, the Pentagon and its sprawl of private contractors are particularly targeted.
    Boeing, Raytheon, General Dynamics, General Electric, and Lockheed Martin have
    all experienced attacks from cyber spies looking for sensitive information. By
    2012, as the attack surface became more expansive and dense, Secretary of Defense
    Leon Panetta cautioned the country of the threat from APTs:


    > They could derail passenger trains, or even more dangerous, derail passenger
    trains loaded with lethal chemicals. They could contaminate the water supply in
    major cities, or shut down the power grid across large parts of the country.52


    During this time, analysts mainly focused on China’s activity. Meanwhile, Russia’s
    cyber initiatives were becoming more strident and obvious. As reported in a 2016
    New York Times article, the Russian brand of hybrid warfare employs a means in
    which unofficial cyberwarriors “serve a multitude of goals, including espionage,
    [and] the disruption of vital infrastructure.”53 In another article, Eugene V.
    Kaspersky, founder of Kaspersky Labs, a cybersecurity firm based in Moscow, describes
    the breadth and depth of cybercrime activity emanating from Russia: “They don’t'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'just hack the victims, they trade the technology to other gangs,” hc said.
    “Now there are hundreds of victims, in the United States and Asia.”54


    An APT attack begins with reconnaissance to uncover system vulnerabilities. This
    preliminary stage uses various techniques. A favorite method is **spearphishing**.
    Spearphishing is an exploitation tactic that uses e-mails that appear to be from
    a trusted individual or organization. In order to scam their victim, hackers will
    use as cover the names and fake online addresses of legitimate financial institutions,
    colleges, charities, or merchandisers. They often use organizations familiar to
    the target, which they obtain by hacking into the victim’s company network or
    by searching authentic websites, blogs, and social media. The target will unwittingly
    click on the link to the sham website containing malware. The website might request
    sensitive information such as passwords, PIN numbers, access codes, or user IDs.
    Once ensnared, the website tricks the victim into downloading malware designed
    for exfiltrating proprietary or secret information for the purposes of government
    or corporate espionage. This is also a method for hijacking systems as zombie
    computers or botnets (see above).


    Similar to spearphishing are “watering holes.” **Watering holes** also use websites
    to attack network systems. This is done when hackers detect vulnerabilities in
    legitimate websites and inject malicious code that redirects the target to a corrupt
    site that hosts the malware. They lure victims to these websites by profiling
    targets based on their online habits. Employees of corporations, government offices,
    and nongovernmental organizations (NGOs) frequently visit industry websites with
    affinity content55 and therefore are opportune targets.


    Another common attack vector is “island hopping.” Island hopping, also referred
    to as “leapfrogging,” is a borrowed term from World War II. The U.S. Navy used
    island hopping in the Pacific to attack strategically important but less well
    defended Japanese held islands. The strategy allowed the Allies to control a series
    of islands and form a network of landing strips and supply bases that led to Japan’s
    containment and ultimate defeat.56 In general, island hopping strategies concentrate
    their attack on entities that are not the ultimate targets. Attackers use these
    units to leverage their assaults on the original primary target. Similarly, in
    a cyberattack, hackers act against their target’s less well protected affiliates
    or vendors in order to exploit breaches in the main target’s system. Targeted
    companies might be of any size and represent any industry. In addition to research
    and development, payroll, human resources departments, health-care firms, and
    law firms all retain sensitive information that might be of interest to criminals
    and hostile governments.


    Regardless of method, once the attacker implants the malware, the network is compromised.
    However, “compromised” does not mean the system has been breached—yet. Before
    activating the exploit, the installed malware also probes for further access points
    and vulnerabilities in the network. By exposing additional access points, hackers
    establish alternative entries into the system if the primary pathway closes. This
    assures that the cyberattack can continue despite detection by network security.
    Even if monitors remove evidence of the APT attack, the network remains compromised.
    The cybercriminal can return at any time to continue the breach operation.'
