    # Distributed Denial-of-Service Disruption


    Above the threshold of criminal activity but below the threshold of cyberattack
    are incidents and events that, while malicious and disruptive, are aggressive
    but do not rise to the level of attack. The oft-cited cases of distributed denial-of-service
    (DDoS) disruptions are an example of cybercrime, not cyberwarfare. While instances
    of cyber espionage may have long-term negative consequences for national security,
    the act of stealing the data itself is not at the level of an armed attack.


    Despite private sector arguments to the contrary, industrial espionage is not
    an act of terrorism or war and would not require a military response by the government.
    Instead, a crime has occurred that may have been prevented with better information
    security. Federal reform to laws such as the Computer Fraud and Abuse Act would
    allow private sector firms to protect themselves by actively responding to thefts
    of data—including the destruction of what was stolen.


    The Department of Defense Dictionary of Military and Related Terms defines a nonlethal
    weapon as “a weapon that is explicitly designed and primarily employed so as to
    incapacitate personnel or materiel, while minimizing fatalities, permanent injury
    to personnel, and undesired damage to property and the environment.” DDoS disruptions,
    manipulating data in logistics networks, and other software or hardware incidents
    would fall into this category.'
