  md: '# # Cyber-Enabled Recruitment and Radicalization


    The battle against Islamist and other forms of extremism is being fought not only
    in the physical realm but also in the realm of the mind –the _cyberworld_. Cybersecurity
    experts tend to focus on spectacular worst-case scenarios in which terrorists
    plunge the United States into chaos with a few strokes of a keyboard. Radicalization
    and recruitment of individuals via the Internet is just as significant an issue.
    Due to the “always on” nature of the Internet and the ability to direct information
    across the globe instantaneously, militants in Somalia and Yemen are able to influence
    U.S. citizens. The 2010 National Security Strategy clearly reflected the growing
    recognition of the security threat posed by domestic terrorism and emphasized
    the need to address the problem:


    Several recent incidences of violent extremists in the United States who are committed
    to fighting here and abroad have underscored the threat to the United States and
    our interests posed by individuals radicalized at home.


    Before the availability of Internet technology, U.S. citizens who were sympathetic
    to Al-Qaeda’s objectives had a higher cost of entry into a terrorist organization.
    In today’s Information Society, a plethora of terrorist recruiters are misusing
    the Internet with success in recruiting U.S. citizens of Muslim faith or Arab
    descent. Two cases, discussed below, have revealed that the Internet is a hotbed
    for radicalizing and recruiting individuals.


    # # Phases of Internet Radicalization


    As will be discussed, the Internet is used to recruit and incite people residing
    in the West to commit terrorist acts. The psychological factors in the making
    of a terrorist have been analyzed in depth in a multitude of sources already.
    The intent here is emphasis rather than an analysis of the multitude of factors
    that could lead to an individual’s radicalization either online or offline.


    Prior to the widespread distribution of Internet technology, if an individual
    was not in a place that would expose them to terrorist propaganda, such as Somalia,
    it would be difficult for a Muslim living in the West to interface with radicals.
    The Internet changed this, facilitating the radicalization process through its
    misuse globally. Ordinary Muslims may now have access to content and social networks
    that are always available online and produced by individuals espousing an Islamist
    ideology intended to influence people into violent action.


    Internet misuse is a necessary condition for the global radicalization of ordinary
    people. If a terrorist did not misuse the Internet, radicalization would not occur.
    People who would not have otherwise come into contact with extremist content in
    their local environment but can now access this information on the Internet may
    find validity in the text and begin to support the Islamist cause in some form.
    Therefore, without terrorist misuse and exploitation of the Internet, the necessary
    radicalization catalyzed or incubated online could not occur.


    The journey from reading to attempting to detonate a car full of explosives in
    New York City’s Times Square is long. Further studies have demonstrated the linkage
    between ideas and action. For the purpose of this chapter, the pyramid in figure
    6.2 is useful for illustrating and contextualizing the findings of'
