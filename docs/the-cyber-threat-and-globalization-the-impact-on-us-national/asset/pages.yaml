  md: 'the McCauley two-pyramid model of radicalization.12 The graphic represents
    the separation of being radicalized to sympathize with ideas and opinions from
    the process of being radicalized into action.13


    The dynamics within the two-pyramid model can be correlated with four phases of
    radicalization, according to the New York Police Department (NYPD): the preradicalization,
    self-identification, indoctrination, and jihadization phases.14


    # Preradicalization:


    The neutral Internet user neither sympathizes with nor has motivation to conduct
    acts of terrorism. Reading terrorist content on the Internet is not a sufficient
    condition for radicalization. A person must find the content appealing, repeatedly
    visit a website, and reach out and lend support to the terrorists. Websites, social
    media, e-mail, and Internet forums are four mediums through which a radical political
    or religious organization can influence people. Social networks, websites, and
    Internet forums are areas on the Internet where people, regardless of their geographic
    location, can discuss a variety of topics. This includes but is not limited to
    radical topics in a self-referential environment where dissent is infrequent and,
    when it occurs, is overwhelmed with responses designed to negate the dissenting
    opinion. A person going into a radicalized chat room or forum with the intention
    of passively perusing the material or debating the ideas on a website is not misusing
    the Internet.


    # Self-identification:


    During this phase, a person may have been catalyzed to begin seeking information
    about an extremist organization by a real-world event. By beginning to browse
    the extremist web, the individual is exposed to the numerous sites promoting extremist
    ideologies that misrepresent Islamic theology. When a person first reads and begins
    to subscribe to the terrorist''s ideology, the terrorist is not aware of the individual''s
    metaphorosis into a violent political being. In time, a radicalized individual
    reaches out and offers support to the terrorist via the Internet. The terrorist
    accepts this and directs the individual to other websites and terrorists on the
    Internet. After trust is established between the terrorist and newly radicalized
    person, the terrorist informs the radicalized individual of other radicalized
    individuals in the same locale. These other individuals have also been radicalized
    by the terrorist via his website. This leads to the new radicals utilizing the
    Internet to discuss actions they can take to assist the terrorist and his cause.
    Since they are geographically proximate to one another, it is possible for them
    to continue their meetings in the real world rather than on the Internet. Thus,
    the terrorist has radicalized people to form a terrorist cell remotely.


    # Indoctrination


    occurs when the individual sympathizer begins to devote time to exploring terrorist
    websites and forming online relationships with individuals who promote extreme
    ideologies. Written content or speeches posted on the Internet by a militant may
    influence nonradicals in a way that leads to the acceptance of militant actions
    as legitimate recourse against perceived injustice. One expert notes that “the
    ability of social network sites to keep an individual embedded in multiple non
    overlapping social networks reduces the leverage of any one view over an individual—organizing
    low-commitment movements such as Occupy Wall Street are far easier, but demanding
    total commitment to'
