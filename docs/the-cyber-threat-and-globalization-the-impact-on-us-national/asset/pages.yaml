- pgno: 142
  md: '# # Net Warriors


    Sometime after the Georgian conflict, a Russian hacker posted the following on
    an online forum: “We will recreate historical fairness. We will bring the USA
    down to level of 1928–33.”⁶⁹ As patriotic hackers and Russian criminal organizations
    become more motivated by nationalistic zeal, their usefulness to the state becomes
    more obvious. The exact nature and degree of collaboration between Russian cybercrime
    organizations and other private actors with the government is unclear. However,
    since Estonia, the waging of information warfare and cyber-attacks aimed at disrupting
    operations or conducting espionage campaigns for the purposes of destabilization
    or subversion appears to be the long-term strategic plan, which such mergers facilitate.


    The primary suspect behind the cyberattacks on major Georgian government websites
    during the 2007 conflict is a cybercriminal organization called the Russian Business
    Network (RBN).⁷⁰ RBN offers a complete infrastructure to undertake malicious activities.
    Its range of services spans an arc of activity that includes malware hosting,
    phishing, botnet command and control, DDoS attacks, and child pornography.⁷¹ RBN’s
    history may date back as far as 1996. Until 2007 it hosted an Internet service
    provider (ISP).⁷² By that year it also operated the largest botnet in the world.⁷³
    As its presence and notoriety expanded, so did awareness in the cybersecurity
    industry. Networks began blocking or blacklisting RBN IP addresses, forcing the
    group to restructure. Attempts to resume operations on Chinese and Taiwanese networks
    failed, but this did not cause the group to disband.⁷⁴ Observers believe its home
    remains in St. Petersburg where it enjoys political patronage and protection.⁷⁵


    The leader of RBN goes by the name “Flyman.” His connections are both criminal
    and political. While ties with Russian organized crime are naturally assumed,
    the precise nature of the interaction between RBN and the Russian government is
    opaque. However, another principal operative within the group is Aleksandr Boykov
    —formerly a lieutenant colonel in the Federalnaya Sluzhba Bezopasnosti (FSB),
    the successor agency to the KGB.⁷⁶ Given the unique position it occupies between
    the Russian underground and Russian officialdom, it is easy to understand how
    its connections with both worlds create a potent actor in the cyber domain and
    a chief nexus for state and nonstate allies to wage asymmetric/hybrid war. The
    abandonment of the RBN ISP had no immediate impact on RBN and Russian cybercriminal
    activity. RBN countered by dispersing across a multiplicity of ISPs and domains.
    Today, the lore and scope of its activities is on such a scale that experts often
    refer to RBN when speaking about Russian cybercriminal organizations and their
    activity in general.⁷⁷ This is despite the fact that RBN’s existence or extinction
    is sometimes still a topic of debate.


    Whether it be RBN or any number of cybercrime groups, the Russian leadership recognizes
    their usefulness and does not hesitate to call on them to help achieve strategic
    goals anywhere in the world.⁷⁸ RBN surfaced not only in Estonia and Georgia as
    part of the attack force but also in Iran where it aided the regime in monitoring
    dissidents. Their assistance had a strong diplomatic subtext as'
