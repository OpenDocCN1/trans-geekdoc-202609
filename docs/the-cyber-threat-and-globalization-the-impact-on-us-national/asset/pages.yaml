- pgno: 29
  md: 'surveillance cameras, and restricted areas presents a world replete with risks
    of compromise and intrusion for critical infrastructure and private networks.
    The control of smart objects would allow hackers to launch cyberattacks to commit
    data and intellectual property theft, conduct espionage operations, and inflict
    physical damage. Stuxnet showed that smart objects and systems can be hacked even
    if they are not connected to the Internet and that no air gap is completely impenetrable.


    IoT is two edged. On the one hand the implications for it to improve our quality
    of life are far ranging and full of possibility. But so is its potential to make
    more unsafe our efforts to manage our health care, conduct business, facilitate
    communication, operate transportation systems, and secure the homeland. The complexities
    of these systems leave them susceptible to malfunction and sabotage.56 As our
    dependency grows and this next generation of the Internet becomes more ubiquitous,
    so does the exposure to risk as breach points and application flaws populate systems.
    In order to protect our privacy and assure our safety, the future Internet will
    require new state-of-the-art norms and collaboration among stakeholders.


    # The Next-Generation Internet (IPv6)


    This lurch into the future comes with a tectonic shift in the cyberworld —from
    its crust to the core. It also comes with a price for extant Internet technology.
    Any “thing” or device of IoT has a chip that gives that object a unique identifier
    and connectivity to the Internet. The growth of these “smart devices” will be
    epidemic and exponential. Internet traffic will accelerate because of the uncontrollable
    demand for these objects, and as it spreads these smart devices continually consume
    IP (Internet Protocol) space. The lack of available addresses and the restricted
    availability of wireless and high-speed connections strains the system. Consequently,
    the growth of the Internet from a small government project to a global experience
    requires the next leap in technological evolution.


    First deployed in the spring of 1978, Internet Protocol version 4 (IPv4) has been
    the underlying protocol that allows computers to internetwork. IPv4 is now reaching
    its limit. It accommodates 4.2 billion unique addresses while the population of
    the earth is currently 7.3 billion and growing.57 Present data suggests that more
    than twenty-five billion IoT objects will be in use by 2020, and possibly fifty
    billion by 2050.58 The saturation point is at hand, and the move to the next generation
    Internet is as well.


    Indications of the obvious constraints appeared early during the “dot.com” boom.
    Realizing that the future of the Internet was at stake in the mid-1990s, the Internet
    Engineering Task Force (IETF) undertook an effort to engineer a new version of
    the Internet Protocol to assure that the rapid explosion of Internet growth would
    not outpace the availability of IP addresses. The new protocol adjusts for a monstrous
    increase in the number IP addresses. The empyrean standards of IPv6 will allow
    for over 1038 addresses —more than a trillion trillion per person.59 Precisely,
    the new address range number is 340,282, 366,920,938,463,463,374,607,431,768,211,456.60'
