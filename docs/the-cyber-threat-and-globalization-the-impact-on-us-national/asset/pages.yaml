  md: '# Box 2.4 Operation Aurora


    Aurora is an advanced persistent threat operation attributed to the Chinese People''s
    Liberation Army (PLA). It first appeared in 2009 and targeted dozens of organizations
    that ranged from Yahoo!, Adobe Systems, Juniper Networks, and Symantec to Northrop
    Grumman, Morgan Stanley, and Dow Chemical. In total, as many as thirty organizations
    had become targets. When Google realized that it, too, was under attack, it took
    unprecedented action by announcing publicly that the attacks against its network
    originated in China. The disclosure fueled diplomatic tensions between the People''s
    Republic of China (PRC) and the United States.


    Google further claimed that the attacks were directed at Gmail accounts of human
    rights activists and individuals, whom the Chinese government considered to be
    political dissidents. Equally grave for Google were the Chinese intentions to
    compromise Google’s source code. The source code is a vital corporate asset and
    critical piece


    of intellectual property. “If the hackers had been able to alter the source code
    while remaining undetected, they could have built vulnerabilities directly into
    Google’s product plans.”78 Officials at the security firm McAfee said the principal
    goal of Operation Aurora was to access the source codes at high-tech security
    and defense contractors with the possible aim of modifying them at some point
    in the future.


    Google’s defensive action meant tracing the path of attack and entering a privately
    owned and listed Taiwanese server. The response could have opened the company
    to lawsuits under the U.S. Computer Fraud and Abuse Act (CFAA). However, rather
    than level charges against Google, U.S. federal agencies chose to publicly laud
    Google and reprove the PRC. The episode evinced two salient points: (1) without
    clear evidence of an identifiable victim, such countermeasures likely escape lawsuit,
    and (2) attribution is not impossible.79


    mostly invisible but massive cyberwar against the United States, aimed at stealing
    its most sensitive military and economic secrets and obtaining the ability to
    sabotage its vital infrastructure.”80 Theft of information and conducting espionage
    for the purpose of hypothetical future sabotage operations do not rise to the
    level of armed attack in the lexicons of kinetic warfare, and thus they should
    not be conflated in the cyber domain. Discussions of cybercrime and cyber espionage
    must be clearly separated from discussions of cyberwarfare. While we are certainly
    in a cyber Cold War, we are not in an international armed conflict in cyberspace.
    By continuing to employ terms interchangeably, the current discussion drifts from
    issues of information security to issues of national security that warrant a military
    response.


    Cyber espionage, crime, and attack are very different and necessitate responses
    that fall under mutually exclusive sections of the U.S. Code. This makes it increasingly
    important that we clearly define what the targets and potential effects of cyberattack
    are. Existing definitions work; what is lost is the technological understanding
    that underpins cyber operations to create effects. To'
