  md: 'limited as a form of statecraft as cyber tools mature. Issues with attribution
    and credibility also weaken the effectiveness of cyber as a form of statecraft.


    The establishment of international cyber norms may help limit escalation among
    near-peer competitors, but will not have a similar effect on weaker states looking
    for an advantage in the international community. While outside the scope of this
    paper, the pursuit by revanchist powers like China and Russia to create a parallel
    international system through the establishment of such institutions as the Asian
    Investment Bank and organizations based on non-Western principles also limit the
    effectiveness and establishment of such norms. The Joint Chiefs of Staff reinforce
    this in Joint Operations Environment (JOE) 2035. JOE 2035 highlights the evolution
    of parallel international institutions that might legitimize state actions the
    current Western-led international order views as illegitimate.30 At best, cyber
    norms may prevent a state from taking actions that could result in sanctions or
    damage to its reputation. At worst, states may not care about norms if they feel
    their sovereignty is threatened or if they seek to challenge the Western-led international
    order.


