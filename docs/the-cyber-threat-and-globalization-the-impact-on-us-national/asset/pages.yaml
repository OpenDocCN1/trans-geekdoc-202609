  md: 'inferences that prove revealing.”²⁹ Summarizing functions and pattern clustering
    enable analysts to see their worlds through multiple lenses, which can lead to
    further experimentation and theory design. Machine learning optimizes the functions
    that computers are designed to do and do best—performing calculations across massive
    amounts of data. By drawing statistical inferences and constructing models from
    processed data, computers seem to finish our very thoughts. For example, when
