    Despite the vastness of these numbers, the current conception of the Internet
    is a simple modality expressed by a structure with a stack of four layers (protocol
    stack or TCP/IP, see above), each with separate functions. The four layers of
    the Internet are:


    +   - infrastructure layer

    +   - logical layer

    +   - application layer

    +   - content layer


    The **infrastructure layer** is mostly hardware and includes routers, switches,
    Internet exchange points (IXPs—physical intersections between networks), and transmission
    facilities such as fiber optic cable, cellular systems, IoT structures, and systems.
    The majority of this infrastructure is owned and operated by the private sector,
    particularly telecommunications companies.


    The **logical layer** of the Internet includes Internet Protocol (IP) addresses
    and domain names, as well as the Domain Name System (DNS). The logical layer also
    includes Internet standards, such as TCP/IP, HTTP (HyperText Transfer Protocol),
    and HTML (HyperText Markup Language)—in other words, the core protocols and standards
    that permit information to travel across different software and hardware platforms.


    The **application layer** contains the software with which end users and IoT devices
    interact directly. Mobile apps, voice-over-IP applications, search engines, social
    media platforms, and platforms for sharing user-generated content are examples
    of applications found within this layer of the stack.


    The **content layer** of the Internet is the most apparent. Alphanumeric text
    (messaging, IoT data, e mail, web content, and books), audio (music and voice
    calls), pictures (photographs, diagrams, digitized art, and illustrations), video
    (user-generated video, video conferencing, and streaming movies), and multimedia
    of all kinds (video games, virtual reality, and IoT environments) reside here.


    Synoptically, the Internet has been described as “part town square (where people
