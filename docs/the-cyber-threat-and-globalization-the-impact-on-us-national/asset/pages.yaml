- pgno: 74
  md: '# Global Cyber Risk and Access Vectors 3


    # The Globalization Process


    The term globalization throughout the text refers to the highly connected state
    and manner by which populations link economically and politically. Technological
    advancement has resulted in a compression of time and space. The consequence has
    meant an unprecedented interconnectedness and interdependence never before known
    among peoples and locales. As the world transforms, as it moves toward a mode
    of existence resembling a single space, the possibilities of market relations
    and political responses are heightened and intensified. This new geography that
    pressures commerce to respond to exact quality and price demands of the market
    similarly imposes a historical transformation on the national security establishment
    to adapt to the precision weaponry and information technology of modern warfare.
    In the current lexicon, cyber and globalization are lax terms. Definitions can
    be politicized or have no direct equivalent as they cross into other languages
    and cultures. However, a relative constant is the fact that whether the target
    or objective is a market or a battlefield, no territory is beyond reach at, ideally,
    any time. As James Mittelman puts it, globalization is more than a process of
    forming a new structure of international relations. It is also a “domain of knowledge.”
    Cyberspace, William Gibson’s “consensual hallucination,” is another domain of
    information where structures are formative and mutable.


    For commerce and the defence and national security community, the impact has been
    seismic. The integrity of the global marketplace, and the responsibilities for
    securing the homeland and advancing U.S. interests overseas, are under new pressures.
    In the post-Cold War environment, globalization has meant a re-envisioning of
    priorities, creating modern disaggregated enterprises, adapting the force structure,
    and devising new ways to network with civic society, the private sector, and other
    organs of government—at home and abroad.


    In his 1960 book International Politics of the Atomic Age, John Herz wrote, “Political
    authority is based upon the power of protection.” The ability to assure'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'U.S. survival by protecting the nation’s economic strength and competitiveness
    is no longer in defending the strategic markets in Western Europe and Japan and
    the remote territories from which we access valuable resources to feed the economic
    engine. The prime target is the economic engine itself. It includes the critical
    infrastructure, intellectual property, and stability of the markets. The ironic
    twist to the argument is Herz’s claim that the “permeability of the state” is
    due to an explosion of a different kind of onslaught, an asymmetric offensive
    that exists despite the advantage a nation may have in strategic nuclear weapons.
    The primary differentiator is that asymmetric attacks do not aim for total annihilation
    or to establish an area of pacification as security regimes of previous eras did.
    Rather, the goals are either parasitical, as often is the case with cyberattacks,
    or to drain a country (“the protection unit,” as Herz would say) financially and
    psychologically through unending conflict. The pacification of an area or a group
    is unproductive and plays into the hands of any adversary who seeks unending war.
    The erosion of markets means the erosion of political influence.


    The United States, its allies, and its adversaries have entered a new age and
    face a new generation of weapons. The struggle is not in fending off annihilation
    but rather in avoiding marginalization. In addition, the scope of the threat matrix
    not only includes the nation-state; it spans the arc of criminal syndicates, entrepreneurial
    terrorists, and the disgruntled employee or the hubristic hacker seeking to add
    to his reputation. Therefore, national governments and militaries are limited
    in their capacity to provide a “protection force.” The onus is upon all sectors
    of society, including an educated citizenry.


    Adjustment to the new order of world affairs will continue to be a process of
    trial, reorientation, missteps, and lapses. Inhibiting progress are not only the
    present institutions and embedded interests, but also a policy-making apparatus
    and a preference for large scale maneuver warfare, which are rooted in a fluctuating
    inter-state system. As mentioned above, it is a system that has been reshaped
    by technology and the demands of an ever expanding and intensifying global economy.
    The advanced skills revolutions in science and commerce require harmony with a
    global marketplace that operates by the requirements of “just in-time processing”
    and disregard for borders. These same “megatrends” have made information accessible
    in waves of tsunami proportion. Today, we do not mine data; we are bombarded by
    it. Management of information on such a grand scale is key.


    The riches of information come with an underside, however. These resources can
    be used for either empowerment or in exploitation of one group over another. As
    these developments have drawn populations closer, they simultaneously create opportunities
    for collaboration and tension. At the same time, emerging technologies and the
    undermining of borders compel militaries to adapt force structures to a new generation
    of weaponry and the need to be more flexible, to operate in smaller units, to
    adjust objectives, and to maneuver by different rules of engagement and definitions
    of war. Similar demands are put on diplomatic efforts, but also include the imperatives
    of economic and social corporate responsibility as the private sector confronts
    its revised role in national security.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'These developments have given way to a different structure and level of interaction.
    For the national security establishment, it involves a break from the state-centered
    international system and contending more with national and sub-national governments,
    quasi-states, ethnic groups, rivalries among traditional allies, criminal gangs,
    diasporas, nongovernmental organizations, and the new phenomena in media. In the
    post–Cold War arena of conflict, the security framework of past power alliances
    and strategies based on a notion of collective secu- rity has become outmoded
    in the context of how a cyberattack would raise such an event to the level of
    an act of war. The organizing principles of U.S. national security strategy reflect
    less a threat from peer military competitors and more of an “all hazards” approach
    to counter transnational forces that emanate from criminal enterprises, terrorists,
    pirates, and events caused by natural catastrophes.


    Yet, while these emerging threats exist, the primary competitors of the Cold War
    are still major players. Russia and China are participants and innovators in this
    asymmetric war. They compete politically and economically with the United States
    and continue to prosecute the remains of a conflict born from the previ- ous era,
    but with variation in mission and rationale adapted to the realities of the post–Cold
    War period. Adding to the enigma and burden of the American security establishment
    is the need for the U.S. hegemony to support global com- merce and defend the
    global commons. The Pacific Rim countries, including the People’s Republic of
    China and despite its military buildup in recent years, still rely on the U.S.
    Navy to protect global shipping lanes. Other nations, par- ticularly Saudi Arabia
    and Japan, have bought U.S. federal debt instruments as indirect payment for a
    security force. At least until now, these and other govern- ments have justified
    the investment as being more favorable than the alternative of developing their
    own capabilities and militarizing their domestic economies.


    The result of these upheavals is that the familiar ground of a few decades ago
    has become a changing landscape. Furthermore, we now see trends developing and
    events unfolding at a historic pace. Yet, before they have a chance to take hold,
    we have watched as they reverse their course or, in some cases, disappear altogether.
    It is prudent to recall that most of the U.S. national security estab- lishment
    was taken by surprise by the fall of the Soviet Union at the time, and no one
    could have predicted how much the world has changed since September 11, 2001.
    The prospect of unforeseen circumstances and disruptive technologies is even greater
    now as we uncover advancements in artificial intelligence and develop emerging
    Third Offset weaponry.


    Further, the array of failed states, the crime-terrorist nexus, jurisdictional
    arbitrage, attribution and response, and the role of multinational firms are only
    some of the issues that create and impact the global security paradigm. The pat-
    tern shift signals the emergence of a new and perilous world. The reorienta- tion
    in national security portends an era of an asymmetric environment that is in effect
    non-asymmetric. Disorienting features of the new conflict are the unfamiliar objectives
    that dominate a new strategy of warfare and competition by state and nonstate
    actors. In these new wars, mass disruption, rather than destruction, can be acceptable
    goals. The preference of endless conflict over final victory is another strategic
    objective that forces a reshaping of the accepted wisdom on preparedness and offensive
    planning.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'The impact of technology has been the key driver. The compressing of time and
    space has made populations more accessible, whether they are markets or political
    constituencies. Just as economic globalization has opened the field of play to
    new actors and opportunities for creating wealth, global warfare has given many
    competitors frequent openings for plunder and exploitation. The motives can be
    political or economic. In addition, radicalization via the Internet is creating
    a crisis environment, nationally and globally. The risks can be low for the attacker,
    and the losses to the targeted group can be substantial.


    On these subjects, much has been written. Modern weaponry, cyberterrorism, corporate
    espionage, the corruptibility of failed states, and other various themes are often
    discussed as instruments of hard power. Each topic has specific issues, vernacular,
    and a circle of noted authorities and subject matter experts.


    Cyberspace is the new field of battle. Because it is the core of critical infra
    structure and industrial control systems, the electronic medium is a target for
    adversaries, whether they be hostile states, criminals, terrorists, or disgruntled
    employees. The power grid is decentralized, aging, and susceptible to blackouts.
    The U.S. reliance on these systems and the increasing demands of the digital economy
    make the quality of life vulnerable. Overall, the cybersecurity threat is outpacing
    the attempts at a solution. Cyberwar and cybercrime employ the same weapons and
    require the same skills. However, the skills and weapons may now be for sale.
    Underscoring how the cyber threat has become so pervasive and vast, the executive
    director of the National Cyber Security Alliance noted in 2014 that almost every
    crime has a cyber aspect.¹ The world may be at the onset of an inter-state war
    among past Cold War rivals and, simultaneously, engaged in an asymmetric conflict
    of nonstate players who all have access and the means to become peer forces.


    The collusion between terrorists and cross border crime networks is a topic of
    growing concern and an expanding field of subject matter experts. Still, it is
    a critical area often given short shrift in most standard texts in courses on
    national security. Although there is no evidence of any grand strategy of terrorists
    and criminals locking arms against their legitimate counterparts, motives and
    opportunities exist around the world for their collusion. The growth of the global
    economy, communication/computer networks, and the volume of information transmitted
    has fueled scientific advancement, but it has also complicated the threat vector
    as crime insinuates itself in the political process and terrorists become more
    entrepreneurial. The struggle to adapt to a new and perilous environment has strained
    the capacity to think anew and to form efficient partnerships within government
    and between the private and public sectors. These changes arose from the natural
    and irresistible forces of technological development and advancement and high
    volume trade. Obviously, those outside the law have benefited as well. Terrorists
    and criminals take advantage of the same tools and mechanisms of the global economy
    as do legitimate actors. Therefore, the opportunities to create wealth and to
    engage in plunder exist side by side.


    In the background of these events, many population segments have become victims
    of poverty. Economic globalization policies from above, such as structural'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'adjustment programs, privatization strategies, and other IMF and World Bank
    imposed reform projects, are other agents of this spreading poverty. The debt
    trap now being experienced by the developing world has unleashed global migration
    on a mass scale. Ethnic groups, indigenous populations, religious sects, and others
    have the ability to traverse the globe while maintaining ties with identities,
    cultures, belief systems, and devotions or hatreds. They remain connected with
    their communities and worldviews by the instruments of technology and globalization,
    which reduce the importance and relevance of geographic distances and the effectiveness
    of borders. The same tools that can inspire and empower marginalized populations
    can also make them prey to terrorist and criminal enterprises and conspiracies.


    In the case of Russia, globalization has allowed the state to add to its arsenal
    of subversive activity by weaponizing the Internet and weaponizing economic corruption.
    The World Wide Web has given the Putin government a grander reach than anything
    Lenin might have imagined for his propagandist vanguard. The Soviet-style “active
    measure” practices plied during the Cold War found a new potency in the post-Cold
    War arena via the proliferation of legitimate and sham news outlets, social media,
    and a twenty-four hour news cycle. Russia as can other state and nonstate actors,
    uses digital technology to organize a fantastic deception. James Jesus Angleton,
    the founding counterintelligence chief of the CIA in the 1950s, called this sort
    of perverted statecraft a “myriad of stratagems, deceptions, artifices, and all
    other devices of disinformation . . . to confuse and split the West [with] an
    ever fluid landscape, where fact and illusion merge, a kind of wilderness of mirrors.”72


    International money flow is another “weapons system,” according to Manus Laurnavičius
    of the Hudson Institute. Through a network of “friendly firms” initially established
    by the Soviet security organs, Russia created an underground banking system to
    transfer and launder funds throughout the world. These funds were weaponized through
    corruption and the financing of extremist political parties, who worked to undermine
    policies unfavorable to Moscow and create division among Western allies.” Former
    director of U.S. National Intelligence James Clapper named Russia as a “threat
    actor” and an example of a nation for which “the nexus among organized crime,
    state actors, and business blurs the distinction between state policy and private
    gain.” Additionally, as Laurinavičius notes,


    This channel does not just operate one way, however, and local business affiliates
    have also been known to rely on their business connections to provide vital capital
    and political backing to acquire additional assets and investments in large projects
    in their national economies. In this way, Russia appears to have created a mutually
    reinforcing network of patronage that rewards loyalty with loyalty—with increased
    financial compensation.5


    The private sector plays a key role in national defense across so many spheres
    and domains. The weaponizing of money, whether out of Russia, China, or any of
    the various narco states, terrorist groups, or transnational criminal organizations,
    cannot occur without complicity of the international community and,'
