- pgno: 108
  md: 'Nevertheless, the ever-expanding application of ICT and the rise of dual-use
    technology have created a mesh of opportunities and risks ripe for exploitation.
    Since the end of the Cold War there has been a fervish and ongoing effort by the
    American military to adapt its forces to the emerging paradigm forced by the opening
    of the information age and the Revolution in Military Affairs (RMA). As expressed
    by the Chinese word for crisis, the confluence of these trends has offered up
    a convergence of opportunity and danger for China and its perceived rivals. It
    is a technological crisis that the PRC hopes to exploit against its adversaries
    on the one hand, and on the other hand, deflect attacks as it seeks to defend
    its national interests abroad and its authority at home.21


    # # Ancient Traditions and Modern Realities


    Compensating for its relatively late arrival to cyberwarfare, China attempts to
    gain parity with the United States and Russia through projects such as *shashoujian*
    (assassin’s mace). Having the project code number 998, *shashoujian* is believed
    to be a response to America’s continued efforts in RMA and an important instrument
    in countering U.S. hegemony in regional and global affairs.22 Metaphorically,
    the term broadly refers to any action, technique, configuration of power, or technology
    deployed to overcome and reverse the tide of battle. For many in the military
    establishment, the inspiration for these efforts has origins in a Chinese proverb:
    “Kill with a borrowed sword.” The concept has been part of the discourse on military
    policy in China since at least 2000.23 In 1999, PRC president Jiang Zemin, a former
    chairman of the Central Military Commission, declared,


    > > We should set great store by stepping up high technology innovation for national
    defense purposes and by developing technology useable for both military and civil
    purposes as well, and we should also master several *shashoujian* for safeguarding
    our national sovereignty and security as soon as possible.24


    The expression both corroborates and foretells a Chinese military policy that
    seeks to overcome technological deficiencies with superior strategies.25 “If you
    are limited in your strength, then borrow the strength of your enemy.” Thus said
    Sun Tzu, the legendary second century BCE military strategist and traditionally
    recognized author of *The Art of War*. By taking the advice from an ancient text,
    China has girded itself to vigorously compete in the cyber conflict, both politically
    and economically. As part of this strategy, the PLA has been establishing and
    cultivating relationships with patriotic hackers, creating the NCPH, and laying
    the foundation for the strategic concept referred to in Chinese military literature
    as “virtual *shi*.”


    The term *shi* has no Western equivalent. The word embraces a range of meanings,
    interpretations, and aspects that refer to the regular order of battle, creating
    an overwhelming force, and maintaining the initiative. Key among these concepts
    is also the notion of strategic advantage for the purpose of developing a favorable
    situation with the potential of achieving political aims.26 In kinetic, conventional
    warfare, it is parallel to the tactic of taking the high ground. In cyberwarfare,
    it'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'refers to achieving strategic advantage by constantly probing networks, planting
    Trojan horses and viruses, using APTs, and exploiting vulnerabilities in Western
    systems.27 In either domain, the objective is to “win victory before the first
    battle.”


    Taking the high ground is a military maneuver common in warfare since the time
    of the ancients as a way to, according to Sun Tzu, “put themselves beyond the
    possibility of defeat.” In the post–Cold War era cyber theater of conflict, Chinese
    leadership and military planners reach back to the same ancient texts and traditions
    for guidance in an evolving twenty-first-century battle-scape. They use such expressions
    of thought and action to shape strategic plans in order to leverage diplomatic
    efforts, gain psychological advantages, apply soft power, and, eventually, close
    the gap in the disparities between themselves and U.S. economic and armed forces.
    The taking of the “digital high ground” is, therefore, a continuous sequence of
    historical and cultural military thinking that is central to the conceptualization
    of strategies and stratagems of Chinese national security. These concepts are
    not only a clue to understanding how the PRC hopes to revamp its military and
    continue their drive toward economic development,28 but also how the CCP intends
    to stabilize and consolidate domestic rule.


    However, ancient teachings are not enough to fully fathom the entire philosophy
    of the Chinese effort to compete in the twenty-first-century cyber domain. Often
    underemphasized in the literature about their cyberstrategy is the reality of
    the PRC’s political structure. Ancient literature and thinking may thread together
    the psychological and cultural fabric of China’s cyberstrategy, but the system
    is torn and frayed by internal rivalries and underdeveloped institutions and administrative
    bodies.29 According to NATO’s Cooperative Cyber Defense Center of Excellence in
    Tallinn, “institutional fragmentation has been a constant feature in China’s cyber
    organization.”30 Since the regime of Deng Xiaoping, the plunge into a market economy
    intensified the tensions between the center and local governments and opened the
    system to further opportunities for both internal conflict and negotiation. The
    result was a political structure fraught with factionalism, departmentalism, and
    frequent dysfunction. These pressures also bled their way into the PRC’s cybersecurity
    infrastructure where competing groups include government, military actors, contractors,
    patriotic hackers, and even criminal elements.31 The domestic struggle over mission
    creep, budgets, autonomy, and priorities is unending. The interplay between cultural
    impulses and the political structure contributes to the dynamic equilibrium that
    the PRC must manage in order to service its national security interests and still
    continue the Chinese economic miracle.


    # “Win Victory before the First Battle” Abroad and at Home


    The high ground in cyber warfare means having advanced knowledge of the opponent’s
    computer network system. This includes the mapping of hardware configuration topology
    and network node geography and knowledge of communication systems, encryption
    methods, system platforms, network protocols, and software capabilities.32 Computer
    network reconnaissance is the term for'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'gathering intelligence in the network warfare arena, which the PRC hopes will
    allow it to “win victory before the first battle.”33 Thus, reconnaissance operations
    directed at targets that could yield insight into nation-state vulnerabilities
    are central to China’s cyberstrategy. In order to understand China’s cybersecurity
    strategy, its objectives, the forces that influence it, and the infrastructure
    that allows it to stand and actuate policy, it is first necessary to establish
    some definitional themes and terminological distinctions.


    China, similar to Russia (see chapter 5), has no direct semantic nexus or parallel
    for the word cyber. Both countries’ literature refers to the term cybersecurity
    as “information security” (信息安全, xinsi anquan,34 and информационное пространство,
    informatsionnoye prostranstvo). The distinction in terms is important. The West
    uses cybersecurity to specify a technical domain of physical and logical entities
    that attend to computer and information systems. Information security is a separate
    term generally used by Western democracies when referring to content. China, on
    the other hand, regards both the information systems and the content of information
    as inseparable constituent concepts, which fall under the term information security,
    xinsi anquan.


    Although both Russia and the PRC take a more holistic view of cyber, unlike Russia,
    China interprets information security chiefly to mean the defense of data collection,
    its use, and its transmittal by legitimate owners. Russia, in contrast, applies
    the concept of information security far more unhesitatingly as a form of power
    projection. Cyberwar, or offensive operations, what the Chinese call “network
    warfare” (网络 战, wangluo zhan), is a separate concept. Wangluo zhan relates to
    the destruction or undermining of an adversary’s network and information systems
    while defending the Chinese national network of information systems and information.35
    In either case, this non Western, broader definition of information security expands
    the use of the term beyond the field of ICT-related issues and into the terrain
    of the cognitive/psychological realm. This more all-inclusive approach explains
    how the Chinese government (as is also the case with Russia and many rigid and
    doctrinaire regimes) views competition in the digital domain and why the PRC has
    been control seeking and restrictive in its cyber domestic policy as well as with
    its negotiations of treaties and international standards.36


    Although China does not rely on cyber as an instrument of power projection the
    way Russia does, it is even more aggressive and eager to conduct cyber campaigns
    to target, probe, and direct espionage operations against other nation-states
    and private sector firms critical of its national policies and perceived as threats
