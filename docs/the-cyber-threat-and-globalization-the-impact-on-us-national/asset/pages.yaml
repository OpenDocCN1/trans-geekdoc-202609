    on-off switch: It is an attempt to bridge one of the country’s most fundamental
    contradictions—to have an economy intricately connected to the outside world but
    a political culture closed off from such “Western values” as free speech and democracy.77


    The preservation of China’s Internet sovereignty is both defensive and proactive.
    Janus, the Roman two-headed god of passages, doorways, and transitions, is an
    apt metaphor. The god’s two faces looked at the world from opposite directions.
    The deity represented a safeguard from threats outside and within the gates, and
    from dangers of the past and into the future. If the Great Firewall is the first
    face of the PRC’s surveillance and censorship system, the “Great Cannon” is the
    second face. It is an attack tool colocated with the GFW. Both the Great Cannon
    and the Great Firewall are hosted on the same servers, and they likely share the
    same source code for intercepting communications. However, investigators at the
    University of Toronto identified the Great Cannon as more than a mere extension
    of the GFW. Rather, they observed, it is “a separate offensive system, with different
    capabilities and design.” According to these researchers at the University of
    Toronto and their colleagues at Citizen Lab, Princeton University, and the University
    of California, Berkeley, the Great Cannon becomes an offensive cyberweapon by
    hijacking web traffic directed at Chinese sites and repurposes the same traffic
    to flood and disrupt targeted web servers with DDoS attacks. Acting as a “man-in-the-middle,”
    it can arbitrarily replace unencrypted content to turn a normal Internet user
    into an unwitting vector of the attack. China’s cyber surveillance apparatus is,
    thus, more than a passive censorship mechanism; it is an aggressive assault weapon
    as well.78'
