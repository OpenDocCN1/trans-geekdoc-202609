  md: '# Normalizing Cyber Disruption as an Element of National Power


    Sam Kidd and Pano Yannakogeorgos


    Cyber capabilities have great potential as power projection tools across the spectrum
    of statecraft.


    Today, however, command and control of cyber options are as tightly controlled
    as nuclear weapons. This, we believe, is due to the focusing of cyber capability
    development in a military context and a lack of strategic thought in the area
    of disruptive cyber operations. This can be blamed on two things. First, is the
    position that “the classification of cyberspace solely as a domain of conflict
    has contributed to this theoretical stagnation, limiting policymakers’ understanding
    of the ways in which cyberspace can be leveraged for broader applications of statecraft.”
    Second, is the argument that international law regime governing “uses of force
    short of war has fallen in desuetude.” We argue here that disruptive cyber operations
    offer varied and potentially graduated means of operationalizing each of the diplomatic,
    information, military, and economic (DIME) instruments of power against state
    and non-state actors to exact costs on transgressors, deter aggressors, and project
    power in a humanitarian, non-lethal manner. Our purpose is to agitate U.S. national
    security and foreign policy discussion regarding employing disruptive cyber operations
    as legitimate non-lethal means of shaping the behavior of adverse foreign decision
    makers.


    Definitions and a common lexicon are the basis of all debates on warfare. Participants
    in debates about air, land, sea, and space power all know what they mean by armed
    attack and the use of force. What little argument that takes place about definitions
    in traditional warfighting domains usually revolves around two or three assertions
    that more or less mean the same thing. As argued elsewhere more extensively,1
    clarifying definitions for cyber conflict will permit for the


    informed establishment of policy tools to utilize cyber operations to project
    power. Developing clear and widely accepted distinctions between access, disruption,
    and attack is critical. A cyber lexicon that does not label every non-defensive
    action as an attack, and analogizes cyber operations to the recognized international
    tools of statecraft discussed below, has the potential to recast current rhetoric
    within the milieu of statecraft and inform workable policy and strategy.


    A conflation of definitions has led to an over emphasis on cyber thought. This
    has resulted in a wealth of thought validating the application of jus ad bellum
    and jus in bello to cyberspace actions which meet the definition of “use of force”
    or “armed attack.” Yet, there are other tools of statecraft recognized and regulated
    by international law which may be employed in the cyber domain. Utilizing the
    term “disruptive cyber operations” to describe coercive or influential cyber actions
    that do not cross the “armed attack” threshold old adequately shifts the discussion
    away from the attack rhetoric than the commonly used term “computer network attack.”
    It is also less demonizing than the also commonly used “cyber-enabled malicious
    activity.” Recognizing that most cyber activities fall within the spectrum of
    disruptive cyber operations may help drive foreign policy decision makers to analyze
    such actions under the rubric of existing customary international law governing
    coercive measures rather than the armed force or attack construct.


    Disruptive cyber actions undertaken by states may be categorized as retorsion,
    countermeasures, or reprisal. These are tools of statecraft generally recognized
    in customary international law, with the one caveat being armed or forceful reprisal
    actions taken outside the context of'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'an armed conflict. Some commentators argue that this form of reprisal is no
    longer acceptable due in large part to the UN Charter prohibition on the “use
    of force.” Yet, the majority opinion on the UN Charter framework, which finds
    that a gap exists between the “use of force” and “armed attack” thresholds, has
    a tendency to undermine the concept of “an international security regime” designed
    to keep “violence within tolerable levels.” It significantly shrinks “the room
    [for states] to maneuver—to push, shove and struggle with one another—for the
    redress of grievances.” The application of retorsion, countermeasures, and reprisal
    as tools of cyber statecraft may prove to be effective at deterring potential
    adversaries and punishing those who violate international obligations.


    Retorsion is distinguishable from reprisal and other forms of countermeasures
    because it describes actions that are inherently lawful, but “unfriendly.” Countermeasures
    and reprisals are actions taken that would otherwise be in violation of law or
    an obligation to the state against which the action is taken, but are justified
    as a means to compel that state to terminate its own “internationally wrongful
    acts or omissions.” Because cyberspace is still a relatively permissive environment
    with few normatively prohibited actions, a whole host of disruptive cyber operations
    leveraging the diplomatic, information, or economic instruments of power would
    qualify as acceptable forms of retorsion. Limited rules apply to retorsion actions
    because the conduct is not inherently unlawful.


    Economic sanction is a generally accepted form of retorsion under international
    law when the sanction does not contradict other legal obligations. It is commonplace
    in today’s discussion of cyberspace to analogize cyber actions with concepts exist
    in the traditional air, land, maritime, and space domains, resulting in frameworks
    for to another state’s internationally wrongful conduct,” in order to “bring about
    cessation of or reparation for the illegal conduct.” Cyber countermeasures as
    a means of responding to a computer network attack have been analyzed by Michael
    Schmitt and other commentators. Countermeasures are a tool that may operate as
    an extension of any of the United States’ (U.S.) four instruments of power, although
    Schmitt argues that countermeasures are neither punitive or deterrent tools. This
    restrictive view of countermeasures effectively eliminates peacetime reprisal
    from the quiver of legitimate countermeasures available for policy makers.


    The problem with accepting the existence of a gap between the use of force and
    the armed attack thresholds is the lack of legitimate options to proportionally
    respond to a use of force that does not amount to an armed attack. As Schmitt
    states, “In particular, it incentivizes treating such operations as armed attacks
    in order to justify a response by the injured State.” Schmitt argues for the efficacy
    of countermeasures as a means by which states may respond to “harmful'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'cyber actions in a manner more robust than retorsion, but less provocative
    than a use of force.” Yet, he also recognizes the reality of this restriction
    on countermeasures: “It has the consequence of leaving a state facing cyber uses
    of force [or any use of force for that matter] that do not rise to the armed attack
    level unable to respond in kind.” The concept of armed reprisal in peacetime is
    the most controversial of these three tools, but could be overcome provided the
    state is subject to a threat or use of force in cyberspace or otherwise has the
    authority to respond proportionally without escalating the matter to an armed
    attack in order to respond in self-defense.


    A reprisal, different from retorsion, is an act that is “per se illegal under
    international law” but is justified “as a response to an unlawful act by another
    state.” Thus reprisal is generally consistent with countermeasures, except that
    the term reprisal is most often associated with forcible acts. There is disagreement
    among scholars as to the legality of forcible reprisal. The Tallinn Manual recognizes
    that a minority of international law experts hold the opinion that “proportionate
    countermeasures could involve a limited degree of military force in response to
    circumstances below the Article 51 threshold of ‘armed attack.’” Normative acceptance
    of this minority opinion would solve the problems created by the “use of force/armed
    attack” gap. Categorizing these forcible countermeasures as reprisals would provide
    additional utility, especially in the cyberspace context. Reprisals, unlike self-defense
    actions, “can be taken at a time and place different from the pivotal event (although
    not at a completely remote time).” Reprisals can also be directed against individuals
    or non-state actors as well as against states. The attribution problem in cyberspace
    presents a situation where a victim state may not know who is responsible for
    a use of force committed against that state sufficient to meet the immediacy requirement
    to respond in self-defense. In addition, the


    potential exists for a use of force in cyberspace to be committed by a non-state
    actor or unacknowledged proxies. Policies which help resurrect the legitimacy
    of reprisal and articulate the willingness of the U.S. to take action against
    states or non-state actors who use or threaten force against the U.S. would most
    likely be in the best interests of U.S. national security. President Obama’s statements
    after the Sony hack, that the U.S. will “respond proportionally ... in a place
    and time and manner that we choose,” and in response to the possible use of chemical
    weapons by the Assad regime the U.S. would use airstrikes to “impose a price”
    for such actions, are examples of what such policy statements might look like.


    The need for non-lethal, but potentially forceful, coercive and punitive options
    in international relations, as a means of preserving international order and preventing
    escalation to armed conflict, has been demonstrated throughout history. In today’s
    environment, every aspect of the DIME has become digitized and thoroughly interconnected.
    The demand for operationalizing cyberspace across the whole of government to leverage
    the digital DIME to meet national security objectives already exists and will
    grow in importance as adversaries, of both the state and non-state variety, pose
    more complex and sophisticated threats. A lack of effective tools is evident in
    the fact that the U.S. has been relatively willing to employ strategic bombing
    or devastating economic sanctions as coercive or punitive implements, despite
    their history of limited success. There has been little discussion as to how the
    U.S. might utilize cyber, retorsion, countermeasures, or reprisal in response
    to aggressive foreign actions such as Russia’s invasion of Ukraine or China’s
    island building in the South China Sea. U.S. foreign policymakers and strategists
    have the opportunity to reset the cyber lexicon and continue fleshing out existing
    normative international law structures through cyberspace policy,'
