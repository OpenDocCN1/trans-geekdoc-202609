- pgno: 32
  md: 'legal restraints of extraterritorial jurisdiction. Stockholders and businesses
    suffer financially, and national economies can be affected when their exchanges
    are exposed to loss of reputation and loss of investor confidence. Melissa Hathaway
    cites a 2011 study which claims that “the Group of Twenty (G20) economies have
    lost 2.5 million jobs to counterfeiting and piracy and that governments and consumers
