    bespeak a deviation in approaches to national security—as well as a divergence
    of cultures. Liberal democracies generally use the term cybersecurity to refer
    to a technical domain, whereas in Russia, information security (информационное
    пространство) also includes the cognitive domain. Russia''s broader definition
    presumes that economic and social arenas are part of the battleground, and the
    mission is not to steal or destroy information as much as it is to disrupt it.64
    “Information has become a weapon. It is not just an addition to firepower, attack,
    manoeuvre, but transforms and unites all of these,” according to Russian biologist
    Ivan Vorobyov and physicist Valeri Kiselev.65 The merging of military doctrine
    with political doctrine reflects an integrated strategy to defend Russian interests
    in an environment where all military conflicts involve a struggle between both
    armed forces and perceived truths.


    The war and Georgia''s threat to align closer with Europe through NATO illustrate
    how Russia views itself as a target of the West and a victim of these weapons,
    on the one hand, and, on the other, foresees itself as a preeminent exploiter
    of the same tools. In their theory of the world, the collapse of the Soviet Union
    was the first information world war, and the second information world war is occurring
    in the post-Cold War era.66 The color revolutions, the Arab Spring, Syria, rumblings
    from the Baltic to Central Asia, and domestic dissent provoke alarm among the
    Russian elite, who fear that their system is vulnerable and their leadership might
    be unsustainable. Through this prism, Vladimir Putin construes events and makes
    the charge that the West''s modern cries for “democratization” are merely voicing
    the same false outrage and code word used by the former imperial powers when they
    invoked their calls for “civilization” during the period of colonization. Russia''s
    adversaries today, he believes, are the inheritors of that previous tradition.67
    In order to defend Russia from these irreconcilable differences in values, Putin
    also “reasons” that Chem sil''nee gosudarstvo, tem svobodnee lichnost (“Чем сильней
    государство, тем свободней личность”): “The stronger the state, the freer the
    individual.”68 Conformably, dissent is akin to treason.'
