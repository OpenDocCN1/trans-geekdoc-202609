    As IoT continues to expand, the risk of exploitation and opportunities for cybercrime
    grows as well. In some cases, particularly in underdeveloped countries where security
    regimes are weaker, broadband carries a natural exposure for cybercrime. On the
    other hand, industrial nations have more sophisticated cyber defenses but are
    much richer target environments. They attract more sophisticated hackers and are
    also the focus of espionage efforts. The growth of IoT is especially problematic,
    because devices are small and are designed to be disposable. Therefore, they have
    limited capacity for software updates. If a device cannot be updated securely
    and in a timely way, it is at risk of being compromised. An exploitation can spread
    across a network and infect any hardware and software that comes within contact.


    BYOD—bring your own device—refers to the organization policy of allowing employees
    to bring personally owned mobile devices such as laptops, tablets, and smart phones
    to their workplace. In using those devices to access privileged company information
    and applications, employers benefit from higher productivity rates and cost savings.
    Employees, in turn, enjoy the benefits of convenience. However, the security concerns
    are obvious. Information systems become subject to the possibility of unauthorized
    use and mal-intent as interconnectivity opens up other parts of the network and
    potential breach points to determined hackers.69 The cost to organizations can
    be critical and also hard to detect. Without any sort of governance or recognized
    agreement over the application of standards and best practice norms concerning
    IoT, the situation will remain perilously static.70


    # Cybersecurity


    Estimating the cost of cybercrime is difficult. Experts at Sandia Laboratories
    describe the loss valuation of cyber threat as “immature.” The domain of cyber
    threats is “nebulous,” the report further asserts, and one that “tends to resist
    easy measurement, and in some cases, appears to defy measurement.”71 Its impact
    on economic activity is gauged in various ways. In order to comprehend its full
    effect, it must be computed in terms other than simply hard dollars due to cyber-fraud
    or monetary theft. There are collateral, long-term social effects as well.


    Cybercriminals can secure inside information on business plans, merger and acquisition
    strategies, unpublished reports, or other sensitive data that could impact a company’s
    stock prices or bottom line. Once in possession of this information, criminals
    can take advantage of the market through illegal inside or arbitrage trading (simultaneously
    purchasing and selling securities in separate exchanges and profiting from unequal
    prices). These manipulations are difficult to detect and even harder to prosecute,
    often because of their complexity and the'
