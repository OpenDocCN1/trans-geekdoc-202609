- pgno: 172
  md: 'the U.S.-educated radical cleric has been described as an e-recruiter and spiritual
    motivator. Thus, understanding the general process of Internet misuse and how
    it may be used as a catalyst in the radicalization process is important in the
    context of how terrorists exploit the Internet. A future with mobile broadband
    devices and increasing interpersonal connections in the virtual world is more
    than a revealing indication of how terrorists plan to influence perceptions and
    achieve effects in the real world. It is the blueprint to their strategic planning.
    Such efforts, however, extend well beyond terrorist efforts to radicalize and
    recruit individuals to their cause. These strategies and stratagems have broader
    implications for U.S. operations.


    There are several cyber techniques that terrorists already deploy that enable
    them to evade surveillance. Specifically, the Secret Preparatory Communications
    VoIP is a technology used to make telephone calls either to another computer using
    a VoIP application or to a traditional phone line.20 Although counterterrorism
    investigators can conduct surveillance on calls that are placed from VoIP services
    to traditional phone services by monitoring a suspected telephone line, a computer
    to computer VoIP communication can be encrypted using features embedded in VoIP
    software such as Skype, Viber, or Microsoft''s Instant Messenger. Thus, if law
    enforcement personnel intercept the data stream containing voice data packets,
    they will not be able to listen in on such encrypted conversations in real time.
    Hence, VoIP gives terrorists the secure communications capabilities that can thwart
    sophisticated law enforcement efforts.


    As discussed earlier, the Internet Protocol is a critical Internet resource that
    allows for universally resolvable URLs as a result of the DNS root system that
    is managed by the Internet Corporation for Assigned Names and Numbers (ICANN).
    Although this allows for a free and open Internet to function, the standards and
    protocols that the ICANN uses to maintain the domain name registries can be used
    by individuals, ad hoc networks, and nation-states to design and deploy an alternative
    domain name system (altDNS) that can either be independent of or "ride on top"
    of the Internet. A corporate LAN, such as ".company name" for internal company
    use, is an example of the first. When a group wishes to ride over the global DNS
    root but incorporate its own pseudo top-level domain, core operators of the pseudo
    domains can use specific software resources to resolve domains that are globally
    accessible within their alternative DNS system.


    As also mentioned above, American audiences can experience what it is like to
    enter an alternative DNS universe via The Onion Router (TOR) network. Downloading
    the TOR package and navigating to websites one would prefer to visit anonymously
    (the typical use of TOR), one may point the TOR browser to websites on the ".onion"
    domain and mingle where the cyber underworld has started shifting the management
    of its business operations these days to avoid law enforcement and to add another
    layer of protection to their personas. (Disclaimer: This is for informational
    use only. Any action undertaken by the reader of this research on the .onion domain
    is at his or her own risk, and this author is not liable for any harm caused by
    or to the reader.)'
