  md: '# # Machine Learning


    Artificial intelligence and machine learning are closely related concepts. They
    each are categories within the field of computer science, but not without an important
    functional nuance. Where AI is a branch of computer science that tries to build
    machines capable of intelligent behavior, machine learning is the science of getting
    computers to perform without explicit programming. Nidhi Chappell, Intel’s head
    of machine learning, described the difference between AI and machine learning
    thus: “AI is the science and machine learning is the algorithms that make the
    machines smarter. . . . So, the enabler for AI is machine learning.”


    Machine learning algorithms create programs that learn from experience, automatically
    inferring or “learning” preference models based on empirical observations of users.
    For example, whenever you do a Google search on things to do in Paris, a list
    of suggestions will appear, all according to the order of how they are ranked
    and rated based on your previous recorded searches and/or those of others. Through
    these preference modeling methods, more sophisticated machine learning algorithms
    can also conduct searches that can discover or “learn” things other than merely
    consumer behavior, such as identifying terrorist precursor crime, epidemiological
    trends, or how the human genome works.


    Principally, machine learning is the study of how algorithms learn from and make
    predictions on data. Often merged with the term data mining, the idea behind machine
    learning is to formulate algorithms that use input data and statistical analysis
    to calculate an output value within an acceptable range. What results are analytical
    models that allow researchers, data scientists, engineers, and analysts from any
    subject area to produce reliable and repeatable decisions that also reveal previous
    “hidden insights” from historical relationships and data trends or “hidden structures”
    from unknown outputs. Additionally, machine learning can iteratively improve or
    reweight itself as it processes new data. For these reasons, many consider machine
    learning the most promising method for optimizing the analysis of big data.


    Machine learning algorithms generally fall into two distinct classifications.
    They are either supervised or unsupervised. Supervised learning algorithms are
    the more common. Mathematicians formulate these algorithms via the use of a known
    data set (called the training data set or labeled data) to make predictions. The
    training data set includes human labeled input and known response values of known
    outputs. After its “training,” the supervised learning algorithm applies what
    it learned to new data and seeks to construct a model off the labeled data to
    make predictions for a new data set. It gains these insights by “observing” previous
    examples of data and deriving a model that will be further tested. Therefore,
    the algorithm is not confined by hard-coded or fixed program parameters, which
    can result in anti-pattern responses and findings. Rather, it uses the labeled
    data to solve/infer a classification or regression prediction problem (regression
    analysis is a statistical process for estimating the relationships among variables).
    The model makes predictions and refines itself with each iteration. In the supervised
    algorithmic approach, software learns from data to perform such filtering analyses
    as how features correlate to actions or events. As the algorithm self improves'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'over time, it learns through the process of adding larger and more diverse
    data sets. Examples of applications include a range of predictive analyses from
    spam filtering and anomaly detection to visual pattern recognition and human behavior
    analysis drawn from speech and video sources. The U.S. Navy applies supervisory
    learning algorithms to support submarine presurfacing lookout posts. The National
    Institutes of Health’s project on early tumor detection uses the same approach
    for a molecular tagged imaging application. A remote sensing tool that surveys
    outer space is a real-life illustration by NASA of how this methodology is put
    into practice.26 The objective in a supervised learning algorithm is to map new
    input data to predict the output variable for that data in order to reveal “hidden
    insights.”


    In contrast, unsupervised learning algorithms are untrained. This approach uses
    unlabeled data to infer labels from activities or events. The aim is to generate
    a model from an unlabeled data set without any predefined response values, categories,
    or known outputs. The result is a “knowledge discovery” of inferred labels based
    on structures, relationships, commonalities, trends, patterns, and other ordering
    schema between inputs.27 As opposed to the analysis by supervised learning algorithms,
    unsupervised learning seeks to uncover “hidden structures” from unknown outputs
    rather than “hidden insights” from known outputs and trends. The algorithm accomplishes
    this through the use of clustering or association rule learning.28


    Put briefly, an unstructured learning problem looks for inherent groupings in
    data and turns these correlations into lead or “theory generations.” An illustration
    of a real-life application that distinguishes unsupervised learning algorithms
    from supervised learning algorithms would be the example of retail marketing.
    Market analysts would rely on a structured learning approach to predict consumer
    trends and consumer demand using data from past sales. On the other hand, the
    same manufacturer or retailer would use an unstructured algorithmic approach to
    produce a consumer segmentation model to identify markets based on similarities
    of buyers. Buyer resistance to price, ranking of product attributes, or classification
    of consumers as innovators, early adopters, laggards, etc., allows the company
    to identify and size the market for its product or service.


    With 80 percent of data being unstructured, unstructured learning is gaining in
    importance. Association rule learning winnows out groups based on relations between
    variables. Clustering maps entities into smaller groups based on shared features.
    These computing methods offer potential solutions to a broad swath of applications
    in both commerce and government, while addressing the variety problem of big data.
    Clustering and association rule learning have been found useful to many fields
    of research and applications that include not just marketing but also medicine,
    psychology, sociology, archeology, insurance, security, and virtually any recognized
    professional or scientific area.


    The avalanche of unstructured data, which would otherwise lie inert, can be organized,
    modeled, and marshaled to serve society and science through machine learning methodology.
    Machine learning makes possible “the automated processing of ‘data exhaust’ [mentioned
    above] into valuable information about social groupings, spending habits, social
    media sentiments and several other trends and'
