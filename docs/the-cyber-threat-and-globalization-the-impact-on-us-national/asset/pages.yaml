  md: '# Public-Private Partnerships


    In this era of globalization, with militaries, governments, critical infrastructures,
    businesses, and civil society increasingly depending on the ICT composing cyberspace
    to operate, we are witnessing the emergence of an Information Society. The basis
    of this new political partnership is openness, trust, and security in cyberspace.
    However, this global society lacks a body of international law with the appropriate
    political, law enforcement, and technical regimes and institutions to govern human
    activity in the cyber environment. Membership in the Information Society increases
    as all forms of human activity are increasingly transferring into, and rely upon,
    cyberspace. The misuse of this domain by criminals and violent nonstate actors
    (VNSAs), such as terrorists, and the proliferation of strategic cyberwarfare programs
    among states has made the need to develop and harmonize national and cybercrime
    laws all the more urgent.¹


    National and international policy makers have recognized that in order to prevent
    the misuse of cyberspace, especially its ubiquitous elements of the Internet and
    the World Wide Web (WWW), all interested stakeholders must cooperate to harmonize
    their national legislation within the framework of existing efforts undertaken
    by the international community.² However, the framework as it stands does not
    emphasize the importance of a strong public law enforcement presence in cyberspace.
    Instead, as will be shown in a review of efforts undertaken under the auspices
    of the United Nations and the Council of Europe, private architectures of control,
    with government playing a lawmaking role, are encouraged, while its overseeing
    of the day-to-day operations of cyberspace, which is essential to securing the
    Information Society, is discouraged. It is suggested that relying on the private
    sector to provision cybersecurity undermines trust and security in cyberspace
    and hampers the distribution of justice. It is argued more that national and international
    law enforcement capacity building must take place in order for all public law
    enforcement entities to take the lead and enforce the dictates and laws created
    by national and international bodies.'
