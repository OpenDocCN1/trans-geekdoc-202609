  md: '# The Information Society: An Emerging Societal Construct


    Understanding the philosophical underpinnings of the role of public law enforcement
    for distributing justice is important when evaluating arguments calling for the
    private ordering of security. Since the Treaty of Westphalia, the nation-state
    is held as the primary provider of public security. Thus, it is necessary to briefly
    contemplate the conceptualization of what the responsibility of the nation-state
    is in developing and enforcing the laws it creates. In order to avoid contemporary
    debates on the nation-state,³ this chapter examines the polis (πόλις) conceptualization
    in the age of Hellenic antiquity in order to deduce diachronic abstract principles
    of law, distributive justice, and public order that underpin the modern nation-state.


    The polis in Hellenic antiquity was “an independent state organized around an
    urban center and governed typically by formal laws and republican institutions.”⁴
    In essence, it is a political partnership regardless of regime. Aristotle is correct
    in his observation that “every partnership is constituted for the sake of some
    good . . . and that the partnership that is the most authoritative of all and
    embraces all the others does so particularly, and aims at the most authoritative
    good of all.”⁵


    The subunits in the Aristotelian partnership model are formed in a teleological
    hierarchy, outlined as follows:


    [male/female] → [household] → [village] → [polis]⁶


    The partnership of the male and female is the starting point for the household,
    which is the starting point for the village, which is the starting point for the
    polis, which is the end of all the other points.⁷ Each partnership is an extension
    of the preceding partnership, each of which “exists for the sake of living well”
    self-sufficiently.⁸ The political system is considered the most authoritative,
    since the other subunits will know what is good for themselves and will manage
    their own affairs to suit their own interests.⁹ Therefore, what distinguished
    the polis from the other partnerships was that it was a political partnership,
    which is primarily responsible for creating legislation with the interest of all
    its subunits so that justice exists in all the preceding social subunits. Although
    in practice this may be imperfect, it is more perfect that if one of the subunits
    were tasked with legislating. Hence, legislation and adjudication is a primary
    function of the polis through which regimes negate the impact of unjust actions
    equally throughout the political system.¹⁰ Humans impulsively strive by nature
    to achieve this end state. Aristotle condemns those who do not seek to be part
    of a polis since they desire war.¹¹


    The end of the political partnership is the provision of justice to the constituents
    making up the whole of the community. A discussion of what Aristotle means by
    justice, legislation, and deliberation is necessary. In the polis, justice is
    that which preserves the happiness and self-sufficiency of the community, equally
    among all its members.¹² Unjust actions are those in which a person voluntarily
    harms another person against a victim’s wish.¹³ Legislation is created during
    a deliberative process in which the general principles of justice are set by'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'politicians.14 This process can be slow; however, actions on the decisions
    made must be quick to serve the needs of the community.15 Lawmakers create laws
    which foresee possible injustices in order to prescribe corrective measures to
    distribute justice via adjudication. When the rulers of a polis do not treat all
    of its constituents equally, only an illusion of justice exists.16


    The above discussion highlights the importance of making sure that individual
    interests do not guide the laws, adjudication, and distribution of justice. In
    this context, the role of public-private partnerships for securing the Information
    Society is examined.


    # A Global Culture of Cyber Security for the Information Society


    One might suggest an update to the Aristotelian political partnership hierarchy
    for the Information Society as follows:


    +   [individual/computer] → [computer/software] → [computer network] → [Information
    Society]17


    In this schema, individual users partner with computer hardware to benefit from
    the partnership between computers and software. The computer/software partnership
    lies in the rules governing the relationship between a computer and the computer
    code and protocols. For example, an individual may instruct the computer via its
    software to internetwork with other computers. This is done according to protocols
    standardized by the International Organization of Standards (ISO) for Open Systems
    Interconnection (OSI). These protocols are built on an open architecture designed
    on a cross-platform client/server model intended to minimize network traffic.18
    Computers connecting over a network depend on seven layers of standards over which
    computers communicate with other computers and users.19 Without these international
    standards, ICTs could not internetwork, interoperate, and interconnect. The end
    state of the preceding units is the Information Society: the emerging political
    partnership being forged among a multitude of global actors as described in relevant
    United Nations General Assembly (UNGA) resolutions as well as the declarations
    and outcomes of the World Summit for the Information Society (WSIS) and the Internet
    Governance Forum (IGF).20


    The establishment of a “global culture of cybersecurity” (GCC) is the main emphasis
    of UNGA Resolution 57/239.21 Beginning with the fifth preliminary paragraph, the
    UNGA indicates its awareness that “effective cybersecurity is not merely a matter
    of government or law enforcement practices, but must be addressed through prevention
    and supported throughout society.”22 By identifying the provisioning of cybercrime
    as an activity separate from government or law enforcement, this element essentially
    relegates the traditional primary guarantor of national security to a secondary
    role within a broader cybersecurity framework in which other actors are tasked
    with preventing cybercrime. The next paragraph indicates the UNGA’s awareness
    “that technology alone cannot ensure cybersecurity and that priority must be given
    to cybersecurity planning'
