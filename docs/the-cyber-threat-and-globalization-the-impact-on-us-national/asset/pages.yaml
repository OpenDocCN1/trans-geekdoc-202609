    of the social contract frequently stands in direct opposition to Western tenets
    of freedom of expression. When the PRC attempts to export its content-control
    model, lines cross and basic canons clash.


    The world''s largest, most pervasive and sophisticated censorship system, the
    Great Firewall of China (often referred to as GFW) is the PRC’s notion of sovereignty
    brought into being. Raised in 2003, the Great Firewall combines regulatory and
    legislative action to monitor nearly seven hundred million'
