- pgno: 96
  md: '# # Broadband Mobility


    The deployment of IPv6 and its massive address space, in conjunction with the
    convergence of industrial sensing systems with the Internet, are two trends that
    will drive the third major change in the cyber landscape: the use of broadband
    mobile devices. In the developing world, the trend is for countries to skip over
    the plain old telephone system (POTS) and install wireless communications infrastructures,
    including broadband Internet and cellular communications. Standards such as WiMAX
    need IPv6 to support large numbers of customers. It will be possible to create
    ad hoc networks that will effectively be shadow Internets on a local level. This
    presents both opportunities and risks for U.S. military operations. It should
    also be noted that extraordinarily low-priced Chinese-made computer hardware products
    are lucrative buys in Asia and the developing world.51 Furthermore, Chinese entities
    such as Huawei are on the leading edge of developing the standards of next-generation
    mobile 4G LTE networks.52


    Even under U.S. law, not all content can flow freely through the Internet. For
    instance, U.S. law defines cyberbullying as transmitting “any communication, with
    the intent to coerce, intimidate, harass, or cause substantial emotional distress
    to a person, using electronic means to support severe, repeated, and hostile behavior.”
    Depending on circumstances and state laws, there can be legal consequences. Therefore,
    creating some content may be viewed as a criminal offense punishable by fine or
    imprisonment. Russian and Chinese officials use such examples to claim that inconsistencies
    between U.S. domestic and international cyberstrategies are indicative of a double
    standard.


    A future with mobile broadband devices where interpersonal connections can be
    made by flipping out a device from one’s pocket is indicative of the need for
    national security planners and operators to take into account the importance of
    exploiting the mind to achieve effects in the real world, and also to mitigate
    potential adversary operations that aim to exploit the human mind. Such efforts
    extend well beyond the terrorist efforts to radicalize and recruit individuals
    to their cause and have broader implications for U.S. operations. The question
    that should be asked within the national security establishment today should focus
    on identifying and articulating the military’s and the broader intelligence community’s
    roles and missions in the areas where cyber and neuroscience overlap to provide
    the United States with opportunities to counter and deter possible adversarial
    actions in the domain.


    # ## Box 3.2 WiMAX


    WiMAX (Worldwide Interoperability for Microwave Access) is a technology standard
    for long-range wireless networking, for both mobile and fixed connections. WiMAX
    is developed by an industry consortium, overseen by a group called the WiMAX Forum
    that certifies WiMAX equipment to ensure that it meets technology specifications.


    Source: www.lifewire.com.'
