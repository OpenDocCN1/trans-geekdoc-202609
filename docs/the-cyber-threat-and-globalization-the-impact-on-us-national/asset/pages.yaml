    Still, inhibiting China’s efforts to unleash its full cyber potential is the institutional
    fragmentation discussed above. The mixture of government institutions and military
    departments, hacker-for-hire threat groups, and uncoordinated action between central
    and local authorities creates an ungainly mechanism for collecting, harnessing,
    and exploiting valuable intelligence. Additionally, Chinese leadership must address
    an increasingly corrupt and unaccountable military establishment that is resistant
