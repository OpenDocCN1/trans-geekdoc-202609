    alleys (where crime occurs), part secret corridors (where spics engage in economic
    and military espionage), and part battlefield.”31 It connects half the world’s
    population and is still in its infancy. As it expands, it compounds. The future
    for all of us will be based on a digital superstructure, which will underlie and
    shape our modes of production, commerce, trade, and governance.


