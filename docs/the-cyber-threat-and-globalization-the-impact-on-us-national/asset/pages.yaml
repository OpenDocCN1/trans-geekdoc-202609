    # # Third Offset Strategy


    As President Harry Truman was leaving office in 1953, America was still suffering
    from the trauma of World War II. The fragile cease fire agreement with North Korea
    was a nonformal treaty, and Soviet threats to the “free world” appeared to be
    escalating globally. Under the overhang of past turbulence and impending dangers,
    the National Security Council Report 68 (NSC-68) called for a massive buildup
    of the U.S. military and its weaponry. Although the recommendations eventually
    became policy, Truman had concerns about the capacity of the war-weary country’s
    economy to sustain large defense expenditures over a potentially indefinite period.³²
    His administration, therefore, called for a strategy to offset U.S. disadvantages
    in manpower and geographic reach. The logic driving this First Offset Strategy
    was that, as a deterrence to Soviet or Chinese aggression, the United States could
    inflict unacceptable losses by retaliating at a place of its choosing—including
    “Communist heartlands.” Explicitly, “this must be based on massive atomic capability.”³³


    The nuclear strategy maintained U.S. dominance over the succeeding decades of
    the Cold War and through the Vietnam era. However, the retreat from Southeast
    Asia combined with the buildup of Warsaw Pact forces and the Soviet Union’s mushrooming
    nuclear arsenal challenged U.S. superiority. Under Secretary of Defense Harold
    Brown (1977–1981), the military undertook the development of precision-guided
    munitions, stealth, and intelligence, surveillance, and reconnaissance (ISR) systems.
    The array of new-generation weaponry was profusely on display during the 1991
    Gulf War. The use of “smart” weapons, which were supported by global positioning
    navigation systems and the latest IT technology, allowed Allied forces in Operation
    Desert Storm to outmaneuver the opposition, destroy targets, and limit casualties.³⁴
    This new paradigm was described as another “system of systems,” often referred
    to as C4ISR (command, control, communication, computers, intelligence, surveillance,
    and reconnaissance). C4ISR combines information collection, analysis, and transmission
    and weapons systems to create perfected mission assignment—or what others sarcastically
    have called “precision violence” or “just-in-time warfare.”


    Today, perceived U.S. advantages in military “great power” competition are gradually
    eroding. Even “client states” of China and Russia can demonstrate some of the
    same technological strengths as the United States in advanced weaponry. Peer and
    near-peer competitors now invest in Second Offset capabilities that are producing
    a growing symmetry between the United States and its global rivals and regional
    rising powers.³⁵ Therefore, in order to maintain its dominance in the continuing
    revolution in military affairs, the U.S. defense establishment believes it needs
    to commit itself to a new course—a Third Offset Strategy. This Third Offset Strategy
    relies on the development of AI to enhance'
