    # ## Conclusion


    As these technological advances occur, the process of globalization continually
    progresses as well. Technology drives globalization, and globalization responds
    with feedback loops that create and influence a ceaseless chain of cause and effect.
    Technological evolution and intensifying globalization are concomitant forces
    that form the social rhythms of innovation, revelation, risk, government policy,
    public opinion, disruption, and pain. The highly connected system of states and
    the manner by which populations link economically and politically has resulted
    in an information age where time and space are compressed, borders blur, power
    disperses, and alternate spheres of authority rise. Moreover, the monopoly of
    violence to which states once held exclusive rights is marginalized by the weaponization
    of information. These elements make twenty-first-century conflict asymmetrical
    and non asymmetrical in an arena of state and nonstate actors.


    The “sordid boon” of the information age is that while ICT-enabled economic development
    increases productivity, innovation, and GDP growth, as well as an advanced skilled
    workforce, it also has an underside. As discussed in much detail above, terrorists
    recruit, criminals exploit, and adversarial governments can undermine liberal
    democracies. Yet, despite the perils, no state can resist these forces—even if
    they do so choose. Past data indicates that GDP growth directly relates to increased
    connectivity to the Internet. Therefore, we lurch onward and consider the losses
    due to cybercrime and terrorism as essentially a tax on economic growth.62


    Part of the above discussion also detailed the PRC’s and Russia’s attempts to
    use “information security” as a defensive and offensive strategic weapon to further
    national interests and assure the national dominance of the political elite. However,
    under the imperative of human rights, the United States also uses its cyber capability
    to support dissident groups and promote freedom of speech in these countries.
    The National Security Agency is responsible for not only delivering critical information
    in support of national defense; it is also expert in cyber infiltration techniques.
    The Office of Tailored Access Operations (TAO) conducts its work on a 24/7 basis
    in teams of hackers, engineers, hardware and software specialists, and other technology
    professionals. TAO tools include the same categories of malware used by U.S. adversaries
    and implements them with effective deployment and return.


    These efforts are viewed as existential threats to China, Russia, and other authoritarian
    regimes across the globe, and the steps by these governments to resist and retaliate
    are, in their estimation, morally justified. Hence the efforts to align and coordinate
    international agreements and treaties to combat terrorism and organized crime
    and to establish standards on cybersecurity go fallow due to the failure and resistance
    by states to find common ground.


    Meanwhile, other states are trying to emerge as cyber superpowers. In reaction
