    # U.S. Public Policy on Cyber Warfare


    Perhaps more than other areas of DOD practice, U.S. cyber operations are affected
    by internal government policies and are scrutinized by an intensive interagency
    review process.147 This may be because the law in the area is unsettled. Unfortunately,
    there are only a few public documents relevant to the U.S. view of the international
    law applicable to cyber warfare. The primary ones are the International Strategy
    for Cyberspace (2011), the legal advisor Harold Koh''s speech at the U.S. Cyber
    Command Legal Conference (2012), and the DOD Cyber Strategy (2015).148


    There is also a chapter on cyber operations in the DOD Law of War Manual, but
    as discussed earlier, it contains little of note. It leans heavily on Koh''s speech
    and adds nothing new, making it necessary to turn elsewhere for more comprehensive
    guidance. For example, the DOD Law of War Manual cyber chapter notes that none
    of the following would constitute a cyber attack during armed conflict: defacing
    government web pages; briefly disrupting Internet service in a minor way; briefly
    disrupting, disabling, or interfering with communications; or disseminating propaganda.
    These examples are so obvious and limited that they are of little use to legal
    practitioners in the field.


    Turning now to the earliest and broadest of the current U.S. policy documents,
    the International Strategy for Cyberspace is largely an aspirational list of


    how things ought to be with cyber operations and international relations relevant
    to cyberspace. It does, however, provide a useful statement of U.S. policy: “When
    warranted, the United States will respond to hostile acts in cyberspace as we
    would to any other threat to our country.”149 This statement, although carefully
    ambiguous, makes clear that there is a point at which the United States will consider
    cyber aggression the equivalent of a traditional kinetic attack, earning an aggressive
    cyber—or even kinetic—response.


    The DOD Cyber Strategy of 2015 is an update of its 2011 strategy. The original
    document was almost entirely defensive; the 2015 version offers a bit more of
    interest to LOAC practitioners. For one thing, it is reportedly the first document
    in which the United States publicly says cyber warfare is an option for the military
    in future conflicts. It notes that “the U.S. military may conduct cyber operations
    to counter an imminent or on-going attack against the U.S. homeland or U.S. interests
    in cyberspace” and further indicates the military might use cyber operations to
    terminate an ongoing conflict on U.S. terms to prevent the use of force against
    U.S. interests or to deter or defeat strategic threats in other domains.150 Also
    of interest, the strategy lists “military-related” critical infrastructure as
    a potential target of cyber operations.151


    Some other documents that may be of interest to legal advisors include the National
    Response Framework (Cyber Annex),152 the draft National Cyber Incident Response
    Plan,153 and the memorandum of agreement between the DOD and the DHS regarding
    cybersecurity.154


    # Conclusion


    Cyberspace and the activities that occur in cyberspace continue to grow in importance
    and complexity. Most state actions in cyberspace are carried out in secret, and
    states appear to have little interest in agreeing to new treaty law or specific'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'norms of behavior. As a result, cyber operations will continue to be a law-intensive
    subject, requiring the work of attorneys with deep and broad knowledge of the
    area as well as an ability to adapt quickly to changing situations. This essay
    serves as a basic starting point and reference, but in this ever-changing field,
    continual research is required to remain current.


