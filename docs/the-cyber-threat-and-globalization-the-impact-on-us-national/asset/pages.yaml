  md: '# # Espionage for National Security and Economic Advantage—"Know Yourself,
    Know Your Enemy"


    In 2013, the New York Times revealed the findings of an investigation it conducted
    jointly with the cybersecurity provider Mandiant. The study analyzed attacks on
    journalists'' computers and determined that the intrusions provided hackers with
    access to user passwords and reporters'' sources. The investigation further concluded
    that the Chinese military was responsible for the attacks, which were prompted
    by the paper''s story about the Chinese premier''s private wealth. Mandiant later
    reported that in addition to linking it to attacks on nearly 150 organizations
    since 2006, it had identified a long-standing advanced persistent threat (later
    designated as APT1 and also known as “Comment Group” and “Byzantine Candor”).


    Eventually experts exposed a Chinese military unit in Shanghai identified by the
    number 61398, otherwise known as the Second Bureau of China’s Third Department.
    In addition to its primary focus on network warfare operations in North America,
    its interests in commercial objectives are intense and include financial data
    and intellectual property. Rather than military or state secrets, Unit 61398/Second
    Bureau has more often sought out business plans, proprietary documents, e mail
    communications, and information on employees. Their priorities corresponded with
    the PRC’s Twelfth Five-Year Plan (2011 to 2015), and its targets were and continue
    to be aerospace firms, IT companies, and public administration agencies.50


    Unit 61398 used more than 1,000 servers and 832 Internet Protocol addresses for
    its attacks. In all, it attacked 141 companies, of which 115 were based in the
    United States; five in Britain; three each in Israel and India; two each in Canada,
    Taiwan, Singapore, and Switzerland; and one each in Japan, Belgium, France, Luxembourg,
    Norway, the United Arab Emirates, and South Africa. These companies spanned twenty
    major industries, of which the top ten most represented were (in order) IT, aerospace,
    public administration, telecommunications and satellites, scientific research
    and consulting, energy, transport, construction and manufacturing, international
    organizations, and engineering services.51


    Parallel with these incidents emerged a prominent cyber threat actor group known
    to the security expert community as Axiom. It is a state-sponsored group rather
    than a military unit. Nevertheless, its choice of targets and methodology are
    similar to the attacks linked to Unit 61398. Also similar are its motives, which
    appear to be economic rather than military. Analysis concludes that Axiom concentrated
    on systems, which house information also useful in advancing the PRC’s Twelfth
    Five-Year Plan. Those same priorities seem to carry forward in the successor Thirteenth
    Five-Year Plan, but with an increased emphasis on creating new Chinese competitors
    to challenge U.S. companies abroad. The aim is to accelerate the close of market
    opportunities in China for U.S. and other foreign firms in important high-tech
    sectors.52


    Axiom’s and the Second Bureau/Unit 61398’s array of strategic objectives reflects
    China’s long-range attempt to lessen its dependency on foreign technology, particularly
    in the telecommunications, computing and robotics,'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'biopharmaceutical, and energy sectors. Additionally, and in tandem with the
    efforts by Unit 61398, there is also evidence that the group focuses on Chinese
    dissidents in foreign countries and domestically.53 A list of victims indicates
    that the leadership of the Chinese Communist Party is as much concerned with nonstate
    actors as adversary states and therefore aggressively tracks the activity and
    movements of activists, watchdog groups, and media organizations that could possibly
    create a challenge to their authority at home or undermine their agendas internationally.


    In a classic APT modus operandi, Axiom compromises systems through web based attacks,
    targeted attacks against public-facing infrastructure, zero-day exploits, watering
    hole attacks, and phishing e-mails (see table 4.2). Once the system is compromised
    and confirmed to be a valuable target, cyber operatives survey the network. At
    that point, the malware moves laterally through the network looking for additional
    access points for future exploitation. Finally, valuable data is identified and
    exfiltrated through a compromised C2 infrastructure (command-and-control server),
    which connects to the victim network. To mask its identity, the traffic in and
    out of the target system snakes through compromised proxy infrastructure in the
    United States, South Korea, Taiwan, Hong Kong, and Japan.


