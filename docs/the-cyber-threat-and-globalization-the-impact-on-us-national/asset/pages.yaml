    breakthroughs increase the population of malicious or inattentive insiders with
    increased access to sensitive information such as pending patents, trade secrets,
    merger and acquisition plans, and other competitive and market intelligence. The
    globalization of the economy also contributes to the disorder. Employee turnover
    results in lax or competing loyalties.92 Skilled'
