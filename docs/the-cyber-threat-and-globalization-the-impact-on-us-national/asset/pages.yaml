    In proof-of-work, miners vie to add the next block of transactions in the chain
    by competing to solve an extremely difficult cryptographic puzzle. The first to
    solve the puzzle is awarded a prize of newly minted coins and a transaction fee.
    Members usually compete in teams in order to combine computing power. The proposition
    of this method is that a majority consensus is reached because of the concentration
    of computing power. Once the problem is solved, all other machines update their
    ledgers to match the winning team’s results.


    Proof of work is useful on a public blockchain; however, the downside is that
    as they scale upward they need massive computational power. This in turn drains
    electrical power, making it an expensive way to reach consensus. Bitcoin currently
    consumes a million dollars per day. For further illustration of how enormous the
    cost of computing is, studies estimate that four hundred separate virtual currencies
    would need two hundred times the amount of electrical power Ireland consumes.55
    (The website coinranking.com lists 1,757 different types of cryptocurrencies as
