  md: 'policies, practices, measures, and procedures pertaining to their own cyberspace.
    Timely and cooperative response is achieved with Information Society members sharing
    information about threats, vulnerabilities, and security incidents in order to
    facilitate the detection of and response to the misuse of information systems.
    The UNGA recognizes that cross-border information sharing may be required. The
    ethical basis of the GCC is founded on utilitarian grounds in that each participant
    is expected to respect the interests of others and to avoid actions or inaction
    that will harm others. Cybersecurity regimes are guided by democratic principles,
    identified as the freedom of thoughts and ideas, free flow of information, confidentiality
    of information and communication, protection of personal information, openness,
    and transparency. Periodic broad based risk assessments of the security implications
    of technological, physical, and human factors, policies, and services should be
    conducted in order to determine what an appropriate level of risk is and how to
    best manage the risk of potential harm to information systems according to a scale
    based on the importance of information on the information system being assessed.
    Security should be incorporated during the planning, design, development, operation,
    and use of any information system. It is on the basis of dynamic risk assessment
    that security management occurs. Finally, in order to assure that all the above
    elements remain relevant, a periodic reassessment is required.


    As with the preliminary paragraphs, the role of government is not clearly defined.
    It appears that members of the GCC are responsible for the protection of their
    own information systems and developing cybersecurity policies in a way that assures
    that vulnerabilities in one information system do not affect another system. Moreover,
    not all information systems are equal, since some information is considered more
    valuable than other information. It will be argued below that this approach is
    incorrect and does not take into account the underlying reasons pertaining to
    states, organizations, and individuals using ICT.


    The global culture of cybersecurity grew from a previous UNGA resolution. General
    Assembly Resolution 56/19, entitled “Developments in the Field of Information
    and Telecommunications in the Context of International Security,” highlights several
    key issues pertaining to the Information Society and the provisioning of its cybersecurity.
    The UNGA recognizes the global characteristics of ICT, such as the Internet and
    the World Wide Web (WWW), as being the basis for the Information Society, and
    determines that international cooperation is required to assure the peaceful use
    of ICT.29


    Ongoing efforts being undertaken under the auspices of the United Nations promote
    what UNGA refers to in numerous resolutions as the “global culture of cybersecurity.”
    As shown above, this is based on a P3 model of cybersecurity in which the private
    sector takes the lead in providing security. This section focuses on the general
    strategy of global cybersecurity as described in UNGA resolutions and the Council
    of Europe Convention on Cybercrime (CoE Convention), which aim to develop and
    coordinate a global cybersecurity strategy.


    Recall Resolution 56/19. The UNGA acknowledges the potential misuse of ICT in
    ways that will “adversely affect the security of states in both civil and military
    fields.”30 Member states are encouraged to prevent the use of information'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'technology for criminal or terrorist purposes while concurrently promoting
    its peaceful use, though guidelines for how to do so are not offered. In the operational
    paragraphs of Resolution 56/19, the GA calls on member states to support and contribute
    multilateral efforts tasked with identifying present and future threats to international
    security resulting from the misuse of information technology and to develop countermeasures
    to these threats. Cybersecurity solutions must be “consistent with the need to
    preserve the free flow of information.”31


    Preserving the free flow of information is a challenging objective since countermeasures
    tend to prevent the flow of information in one way or another. For example, when
    one installs a firewall on a computer network and sets it to the most secure setting,
    the firewall makes the use of Internet applications more of a hassle than before
    the firewall was installed. The free flow of information is preserved when the
    firewall is tweaked to fit the patterns of an individual’s usage. Analogous problems
    exist when implementing cybersecurity solutions on a larger scale. A corporate
    firewall may block certain applications that are useful for some users but which
    present a security risk for most users. However, if one cannot afford firewalls
    or antivirus software, an attacker can exploit the lack of security and likewise
    prevent the free flow of information, among other things. Both of these examples
    indicate pitfalls of holding the private sector and individuals responsible for
    cybersecurity. A corrective measure that is explored below involves public law
    enforcement efforts, which allow users to not have to implement their own cybersecurity.


    In follow-up Resolution 56/121, “Combating the Criminal Misuse of Information
    Technologies,” the UNGA strengthened the language of Resolution 56/19.32 It is
    recognized in the preliminary paragraphs that the “misuse of information technologies
    may have a grave impact on all States” as a result of the utilization of ICT to
    enhance international cooperation and coordination.33 Further, “gaps in the access
    to and use of information technologies by States can diminish the effectiveness
    of international cooperation in combating the criminal misuse of information technologies.”34
    The best way forward is “cooperation between States and the private sector in
    combating the criminal misuse of information technologies . . . [and] the need
    for effective law enforcement.”35 Thus, in order to preserve the utility of ICT
    for enhancing international cooperation and coordination, all states must have
    access to and use ICT while establishing P3s and law enforcement mechanisms to
    deter the criminal misuse of telecommunications technologies.


    As the UNGA suggests in Resolution 56/121, by transferring information technologies
    to developing countries and training local personnel in it use, global efforts
    to combat the misuse of information technology will be enhanced. It follows that
    if there is one state that is not able to counter the use of ICT by terrorists
    in its territory, that state is a weak link in the chain of countering the criminal
    misuse of cyberspace.


    To illustrate the importance of the issue of bridging the digital divide to enhance
    cybersecurity, it is useful to briefly examine illegal Internet service providers
    in Africa. Such networks present opportunities for criminal and terrorist organizations
    to bypass law enforcement efforts.36 Illegal Internet services'
