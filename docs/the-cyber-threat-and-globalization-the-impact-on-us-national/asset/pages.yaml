    # Box 8.4 Blockchain Technology


    # Angus Champion de Crespigny


    Blockchain technology has taken the world by storm. Starting with Bitcoin, it
    has been declared the new Internet, a bank killer, or a Ponzi scheme and the latest
    “tulip bubble,” depending on whom you ask. The reality is somewhere in the middle.
    The technology is incredibly powerful, but revolutionary technologies take time
    to mature, and occasionally people’s imaginations get ahead of the technology.
    Public blockchains enable network participants to record the state of some data
    at a particular point in time, with no one able to easily restrict or change that
    data. With Bitcoin, this data is who holds how many of the cryptocurrency Bitcoin.
    For other blockchains, other data or even code may be shared. So why is this so
    powerful? Transferring value has always required a central party to ensure that
    people are not spending money they don’t have, which has led to an enormous centralization
    of power among a relatively small number of financial institutions that can move
    that value among a fairly closed network. For many people around the world, this
    is not a big problem, as we can gain access to that network relatively easily.
    For others, however, their ability to get access to money is incredibly low. With
    blockchains, however, value can move simply like another form of data. If you
    can access an Internet connection, you can receive value, and you can send it.
    You don’t even need to be a human: machines or software can send and receive value
    seamlessly. It is a new financial system.


    Blockchains can also act as a global data anchor, for example as the digital fingerprint
    of someone’s passport information. A trusted authority may verify that the digital
    fingerprint matches the original passport, and as long as someone else trusts
    the trusted authority, they can trust that the digital passport information matches
    the original. We now have digital passports. The implications of this technology
    are huge; however, innovations such as this take time, as there are many obstacles
    along the way. To begin with, financial systems have many more regulatory hurdles
    than technical ones, so integrating cryptocurrencies into the financial system
    is unlikely to open banking up to the unbanked. Additionally, when using it as
    a data anchor and storing sensitive information on a blockchain, the data will
    remain on the blockchain forever, which is not ideal even if the data is encrypted,
    as we don’t know if it will remain secure in the future.


    Bitcoin and blockchain technologies are ushering in a new future of finance, but
    it is a long road for it to reach its potential. User-friendly access, consumer
    protections, and simply time to gain consumer adoption are needed. As this evolves,
    however, we can expect to see some very exciting things indeed.


    Angus Champion de Crespigny is a consultant who leads blockchain strategy for
    a global professional financial services practice. He is an international speaker
    and advises governments, media organizations, and start-ups on technical and regulatory
    issues concerning distributed infrastructure.'
