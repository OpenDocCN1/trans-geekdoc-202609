  md: 'find correct responses to queries, either by responding vocally to human language
    interaction or as a guide to navigate through a decision tree. Global Positioning
    Systems (GPSs), video gaming, and Apple’s Siri are examples of narrow or weak
    artificial intelligence because they can accurately respond with information only
    from a linked database. Despite appearing complex or intelligent, these types
    of machine learning algorithms (see below) have no awareness of their environment
    outside the database. However, the rise of big data, the development of graphic
    processing technology (as in gaming videos), and breakthroughs in algorithmic
    methodology have optimized the potential of narrow artificial intelligence.


    According to Michael Chi of the Australian Strategic Policy Institute, “While
    many different kinds of AI will be pervasive, they’ll be narrow, limited and for
    a specific purpose. In the next 10 years, 99% of the artificial intelligence you
    interact with, directly or indirectly, will be narrowly autistic, super smart
    specialists.”15


    Be it commerce, government, or civic society, advancement in AI has the potential
    to be game changing. In the security realm, the consequences will be impactful
    and unpredictable. Autonomous systems will enhance all facets of national security
    and will increase the effect of force used by both state and non state actors.
    In combination with and as an augmentation to cyber, AI will make the non-asymmetrical
    conflict arena more non-asymmetrical. Digital networking can enable extensive
    cyber espionage, facilitate crime, help terrorist groups organize online, and
    exploit media in liberal democracies—and over time, do it more cheaply.


    AI and its subfields, machine learning and deep learning,16 allow systems to not
    only learn from past data but also observe and self teach from additional data
    input. The growing capabilities permit a machine (computer, robot, or weapons
    system) to make decisions and operate autonomously. The new paradigm will not
    only enable cyber defense systems to automate the defense of known vulnerabilities,
    but also to predict emerging threats as the system essentially reprograms itself
    and improves its functionality.


    Unfortunately, any adversarial actor with sufficient resources could create or
    procure an AI exploit capable of automating routine resource-intensive tasks associated
    with penetrating a target system. As the cost of replicating software declines
    and the need for highly skilled personnel diminishes, “work factor constraints
    of entry” for frail/corrupt state actors and nonstate actors ease as well.17 Hence,
    while the impact of AI is uncertain, so are the shocks from the power diffusion
    that could result if these actors acquire the capability to cause significant
    cyber effects.


    Other threats to cybersecurity involve the prospect of automating the discovery
    of system vulnerabilities and the consequent onslaught of cyberattacks on a grander
    scale. As computer systems become more complex and learning systems rely on more
    massive data sets from an ever-expanding universe of big data, hackers find a
    world filled with opportunity as well. Additionally, implanting “poison data”
    into training data sets can allow an adversary to corrupt an AI system to not
    only disable it but also force it to perform inaccurately or counterproductively.18
    AI makes more possible the forgery and alteration of audio and video media to
    undercut surveillance and intelligence operations. Even if discovered and arrested,
    such actors have the effect of undermining trust across institutions and sowing
    panic throughout a population.19'
