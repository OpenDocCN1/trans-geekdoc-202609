- pgno: 63
  md: '# The Deep and Dark Webs


    The terms Internet and the World Wide Web are often used interchangeably. Yet
    the two are not synonymous. The Internet is a massive network of networks connecting
    millions of computers together. It is a global networking infrastructure in which
    any computer can communicate with any other computer as long as they are both
    connected to the Internet. The Internet refers to the network of networks where
    all the information resides. Things like file transfer protocol (FTP), Internet
    gaming, live online discussions, and e-mail are all part of the Internet. They
    are, however, separate from the World Wide Web.


    Specifically, the World Wide Web, or “the web,” is an information system on the
    Internet that allows documents to connect to other documents. As discussed in
    chapter 1, it was the initial creation of Timothy Berners-Lee’s “universal linked
    information system” that allowed academics across the globe to upload immense
    amounts of information on the web and assign locations for accessing it—all owing
    to his HyperText Transfer Protocol (http) and the Uniform Resource Locator (URL)
    system.


    The “surface web,” on the other hand, describes only the portion of the World
    Wide Web that is readily accessible to the general public through browsers like
    Internet Explorer and Firefox and traditional search engines such as Google, Yahoo!,
    etc. Generally, the surface web is made up of static and fixed pages, which means
    they reside on servers as HTML files (HyperText Markup Language; see chapter 1)
    waiting to be retrieved. These are the sites whose domains end in .com, .org,
    .net, .edu, etc., and no special configuration, such as TOR, is required for access.


    The surface web grows every day. Estimates conclude that after the number of sites
    that go offline is subtracted from the number of new registers, thirty thousand
    websites are added daily.61 Yet, despite its growth, the surface web is a fraction
    of what the deep web is believed to be. The algorithms used by commercial search
    engines, such as those named above and others, only capture approximately 5 to
    16 percent of the total Internet.62


    The “deep web,” however, refers to content that is not indexed and that traditional
    search engines cannot access. It includes private sites, blocked sites, unlinked
    sites, and non-HTML sites. Put simply, it is “a class of content on the Internet
    that, for various technical reasons, is not indexed by search engines.”63 The
    volume of data on the deep web has been growing exponentially. While earlier estimates
    suggested that the deep web might be as much as four thousand to five thousand
    times greater than the surface web,64 other calculations put its volume more modestly
    between four hundred and five hundred times as much. Regardless of the differences
    in numbers, current evaluations concede that the rate of growth may be unquantifiable.65


    What we do know is that there is a vast amount of information below the layer
    of the surface net (see figure 2.1). It includes Twitter and Facebook posts, information
    in databases, and data under the layers of content of a website retrieved in a
    standard search. Some are reachable through custom queries made on a specific
    website. For example, if you want to look up information about the “deep web”
    on the surface web, begin by doing a simple Google search.'
