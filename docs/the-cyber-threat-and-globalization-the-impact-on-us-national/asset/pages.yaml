- pgno: 128
  md: '# Conclusion


    Overall, U.S.-China cooperation in cybersecurity needs to encompass both military
    and nonmilitary aspects of cyberspace. An informed focus on the military sector
    is just as important as the focus on its nonmilitary counterpart in this field
    of interest since in the Sino-U.S. relationship, both are extraordinarily linked,
    presenting policy makers on both sides with a unique set of challenges to overcome.
    This economic entanglement could be confused with a guarantee for peace. However,
    history sends us a warning. When diplomacy fails, even in times of intense global
    economic entanglements among competitors as those that existed on the eve of World
    War I, war and conflict may ensue. This is why continuing efforts to establish
    common understanding via formal presidential agreements, diplomatic communication,
    law enforcement cooperation, and academic roundtable discussions are important.


    Cyber conflict, ranging from access to disruption to armed attack, constitutes
    a new form of power. There is a common interest of all in the prevention of cyberwarfare
    that should overshadow any purely national interest of welfare or security. True
    cybersecurity will be found not only in Sino U.S. cooperation, but in the collective
    efforts of all. The Sino-U.S. relationship will be seen by everyone as a positive
    first step. It will require, and does today require, a real renunciation of the
    steps by which past cybersecurity has been sought. It is clear that in a very
    real sense, past patterns of national security are inconsistent with the attainment
    of effective security in cyberspace –a domain that contains many interdependencies.


