    # “There Are No Absolute Rules of Conduct, Either in Peace or War”—Leon Trotsky


    In 1918, the year following the Bolshevik takeover of the Russian government,
    Lenin appointed Leon Trotsky the leader of the Red Army. Trotsky at the time was
    commissar of foreign affairs. His new position involved the daunting task of transforming
    a sloppy network of detachments into a formidable and disciplined military. Sometimes
    this required managing a war effort on as many as sixteen fronts. Conscription,
    discipline, and the Leninist doctrine that insisted there exists a constant state
    of siege between and within nations and societies35 helped earn victories against
    counterrevolutionary adversaries (foreign and domestic) and create the fortress
    state that became the USSR and the system and mind set that have endured despite
    its structural collapse. The belief that “conflict is a constant,” found not only
    in Hegelian dialectics but also embedded in the Russian psyche, is a tradition
    that shapes and drives present government policy. In this environment of never-ending
    struggle, Lenin warned,


    > Any army which does not train to use all the weapons, all the means and methods
