    technology has the potential to streamline and accelerate business processes,
    increase cybersecurity and reduce or eliminate the roles of trusted intermediaries
    (or centralized authorities) in industry after industry.”50 Despite the current
    allure of cryptocurrencies for criminals and those who wish to evade tax laws
    or escape detection and interdiction for purchases of illegal goods and services,
    a main benefit of DLT is also its facility for making transactions transparent
    and secure, as a way to build trust among peer clients and partners in a digital
    collective network. Its injection into the bloodstream of commerce has been predicted
    to be as potentially disruptive as the Internet’s impact on communications.51


    Central to DLT is a distributed ledger or database that permits participants (who
    can be either individuals or institutions) in the network to share and retain
    identically cryptographically secured records on a peer-to-peer basis.52 Transactions
    are recorded one time on a shared ledger and synchronized across the business
    network, thus eliminating duplication and the need for intermediaries. This manner
    of interaction allows transactions to occur more efficiently and at lower transaction
    costs.


    Each transaction is a “block” of information containing addresses, dates, times,
    amounts, and a digital signature, which acts as a tool to certify the authenticity
    of the transaction (see figure 8.1). The digital signature (see chapter 2), which
    is generally a hash function, confirms that the entity making the transaction
    matches their digital identity stored on the ledger. The ledger is maintained
    over a network of computers, with nodes where information about participants’
    accounts is not only stored but where a history of transactions is also kept.
    Each block of information/transaction is mathematically linked to the previous
    block through an algorithm, hence the term blockchain. For a transaction to be
    entered into the ledger, network members validate the agreement by calculating
    the correct input to a hash function. The computation also acts as a digital signature.
    Through this consensus algorithm, known as the consensus mechanism, each network
    participant acts as both a publisher and subscriber.53 The ledger represents a
    database of accounts, balances, and a sequential history of transactions, where
    information is shared, updated, and selectively replicated in real time.54


    The consensus mechanism means that trust is hard coded into the system. Intruders
    cannot modify the records without other members of the exchange noticing the tampering
    of the blockchain, since each transaction is embedded with a digital signature.
    A PKI (public key infrastructure; see chapter 2) protocol assures that only valid
