  md: '# # Algorithms, Software, Audience Mapping, and Targeted Messaging


    In general, social networks are a resource for the intelligence community, who
    can use software programs to help them integrate and distill data in order to
    create holistic actionable intelligence. This information can reflect a particular
    incident at a particular time, like a revolution or earthquake, or reflect the
    knowledge, interests, and activities of an individual or group over periods of
    time. Crisis responders, emergency managers, and military leaders tend to focus
    on the former, while intel analysts concentrate on the latter. In both cases,
    natural language processing programs can be used to analyze, filter, classify,
    and otherwise process human language, whether it is news articles, e mails, tweets,
    reports, recorded conversation, or any other medium.23


    Eduard Hovy of Carnegie Mellon University further explains that this field includes
    programs that perform information retrieval (Google), speech recognition (IBM’s
    ViaVoice), information extraction into databases, automated summarization of one
    or more texts, question answering such as IBM’s Watson system (featured in the
    TV quiz game Jeopardy!), and many other applications.


    Frequently these engines create a characterization of a word, concept, topic,
    person, organization, or even entire document that comprises a list of the most
    relevant words and phrases associated with that object, with each word or phrase
    being given a strength or weight score. Even though they do not fully describe
    the nature of the object in question, these so-called topic/word signatures are
    useful for a variety of purposes.24 The field also includes so called inference
    engines, which combine rules and old facts to deduce new facts to aid analysts
    in filling knowledge gaps and finding inconsistencies in oral or written texts.
    From these programs come data analytic techniques such as anomaly detection and
    pattern learning that help interpret subjective text, opinions, and attitudes
    of authors and other agents. A key approach in information retrieval and disambiguation
    (natural language processing that governs which sense of a word may be applicable
    to its use in a specific sentence) is textual entailment. Textual entailment captures
    the semantic variability of texts and performs inferences as it moves from a lexical
    to a relational context. Basically put, it is a relation between two natural human
    language sentences where readers of the “text” would agree the “hypothesis” is
    most likely true (Peter is snoring → A man sleeps).


    Whereas textual entailment refers to the directional relation between text fragments,
    sentiment analysis is the use of natural language processing and text analysis
    to systematically identify, extract, quantify, and study subjective information
    and emotive states of the author. Sentiment analysis is broadly applied to the
    “voice of the customer” that ranges from marketing services, survey responses,
    and online and social media. It is used to uncover the attitude and mind set of
    a speaker or writer with respect to a topic or the overall contextual polarity,
    separation, or emotional response to an interaction or event. These algorithms
    are also valuable tools for intelligence gathering. They have been successfully
    applied in accurately forecasting events that include emerging market signals,
    the outbreak of diseases, and political unrest. “The Intelligence Advanced Research
    Projects'
