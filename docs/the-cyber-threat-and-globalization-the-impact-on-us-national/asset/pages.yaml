    # “What Is to Be Done?”


    In the early days of Lenin’s revolutionary career, he published a pamphlet called
    Chto delat? (Что делать?), What Is to Be Done? (1902). A central theme of the
    work was that Marxists needed to form a vanguard army to proliferate Marxist political
    ideas among the masses. It is difficult to argue against the theory that active
    measures and influence operations are in many ways echoes from this Leninist past.
    Stalin, as if doubling down on Lenin’s thoughts, once posited, “Ideas are more
    powerful than guns. We would not let our enemies have guns, why should we let
    them have ideas?” This strategy of the Soviet/Russian leadership has endured periods
    of revolution, war, peace, détente, political collapse, regime change, and resets.


    “What is to be done?” in the age of globalization and information warfare has
    now become a burning question for the contemporary security establishment. The
    digital world is a great enabler of information sharing between governments, between
    governments and their citizenry, and between communities of interest, researchers,
    and data sources. Web 2.0 is an empowering connective tool and intellectual force
    multiplier. It is also a means of providing access to populations for exploitation
    by criminal elements and hostile state actors. The Kremlin leadership appreciates
    well this underside and how it can be a military and political force multiplier
    in ways never imagined by Lenin when he sounded a call for the formation of a
    “vanguard.” These exploitable targets include not only communities abroad but,
    in the Kremlin’s view, population segments within Russia as well.


    Circumspectly, it is important to realize that the weapons of information warfare
    and cyberwarfare pose risks to both the perpetrator and the intended'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'victim. In many ways, it is analogous to the chemical weapons warfare of World
    War I. The use of poisonous gas, which was subject to conditions outside of any
    control, often resulted in unpredictable, doubtful, and even adverse consequences.
    Similarly, blowback is always a potential risk in the technical domain as malware
    and other cyberweapons spread across the Internet and circle back to inadvertently
    infect computers and systems that were never intended as targets.


    Additionally, in the cognitive domain, active measures involving fake news and
    disinformation erode over time and can also have unintended results. Eventually,
    more facts surface and evidence comes forward to negate the false narrative.¹⁰⁵
    Disinformation campaigns, therefore, have an element of counterproductivity as
    operations are exposed. Ultimately, the “tyranny of facts” becomes inescapable,
    population segments can become alienated and opposition groups radicalized.¹⁰⁶
    The long term effects of these active measures are still to be tested and analyzed,
    particularly in a data environment of immense and increasing volumes of information
    flow and twenty-four-hour news cycles.


    As discovered by the members of the NATO alliance, national cybersecurity is more
    than a technical issue. In the cognitive domain, protecting democratic societies
    by assuring the integrity of a free press, upholding the right to protest, holding
    officials accountable, and safeguarding the legitimacy of elections is ultimately
    a public onus rather than another theater of war for the national security establishment.
    In any liberal democracy, distrust of government is healthy but certainly not
    enough. Ignorance can be noxious and self-consuming. It undermines social equality
    and corrupts through fear. Voters can resist a system they do not agree with not
    only by protesting but also by seeking the truth. The best defense against active
    measures by any actor that attempts to tamper with the democratic process or inhibit
    the enjoyment of our civil rights may be found in Thomas Jefferson’s prescient
    counsel: “An educated citizenry is a vital requisite for our survival as a free
    people.”


