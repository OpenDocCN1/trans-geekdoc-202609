    # World Summit on the Information Society and Internet Governance Forum


    The World Summit on the Information Society (WSIS) is the forum mandated by the
    aforementioned UNGA resolutions where governments and all interested stakeholders
    deliberate on what the guiding principles of the emerging Information Society
    are. This section will focus on those elements in the WSIS''s Geneva Declaration
    of Principles (2003), the Tunis Commitment and the Tunis Agenda (2005), and the
    outcome of the inaugural Internet Governance Forum (IGF) pertaining to the establishment
    of a global culture of cybersecurity as laid out by the UNGA.


    The first phase of the WSIS, held in Geneva from December 10 to 12, 2003, allowed
    all relevant parties the chance to formally begin the process of developing the
    Information Society based on trust and security. The priorities established by
    GA resolutions, notably 56/121 and 57/239 (described below), were discussed. The
    meeting resulted in the drafting and adoption of the Declaration of Principles
    and Plan of Action by “the representatives of the peoples of the world.”43 The
    Declaration of Principles defines that the Information Society should be organized
    around a


    common desire and commitment to build a people centered, inclusive and development
    oriented Information Society, where everyone can create, access, utilize and share
    information and knowledge, enabling individuals, communities and peoples to achieve
    their full potential in promoting sustainable development and improving their
    quality of life, premised on the purposes and principles of the Charter of the
    United Nations and respecting fully and upholding the Universal Declaration of
    Human Rights.44


    The Information Society is therefore based on democratic principles in which individuals
    are guaranteed the right to freely create and transmit information and knowledge,
    as long as their objectives are not against the principles of the UN Charter and
    the Universal Declaration of Human Rights.


    Security is a cornerstone of the Information Society. Paragraph 5 of the Geneva
    Declaration states that users must have confidence in the Information Society,
    a framework of trust that includes “information security and network security,
    authentication, privacy and consumer protection,” which must be established to
    assure that data, privacy, access, and trade are protected.45 Further, the WSIS
    recognizes that ICT has the potential for devastation and recommends that appropriate
    actions at the national and international levels should be taken to secure cyberspace
    so that ICT is not used “for purposes that are inconsistent with the objectives
    of maintaining international stability and security, and may adversely affect
    the integrity of the infrastructure within States.”46 In this'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'regard, the Declaration of Principles calls for all interested stakeholders
    to have a strong commitment to the concept of “digital solidarity” with governments
    at the national and international level, and it recognizes that new forms of partnership
    will be required in order to meet the goals set out in the declaration.


    In addition to the Declaration of Principles, participants of the first phase
    of the WSIS in Geneva negotiated and agreed on a Plan of Action for achieving
    the goals set therein. In section C.5.12, the WSIS defines what actions must be
    taken to fullfill the objectives contained in paragraph 5 of the Declaration of
    Principles.”48 Reiterating the importance of security and its role in developing
    users’ confidence with using ICT, the Plan of Action recommends public-private
    partnerships for the prevention, detection, and response to cybercrime and ICT
    misuse. For their role, governments are mandated with the task of developing guidelines
    taking into account the ongoing efforts in these areas.


    The main outcome of the second WSIS summit on the Information Society was the
    adoption of the Tunis Commitment and the Tunis Agenda for the Information Society.
    Significantly, the Tunis Agenda calls on the Information Society to ensure the
    “requisite legitimacy of its governance, based on the full participation of all
    stakeholders, from both developed and developing countries, within their respective
    roles and responsibilities.”49 Internet governance is defined as “the development
    and application by government, the private sector and civil society, in their
    respective roles, of shared principles, norms, rule, decision making procedures,
    and programs that shape the evolution and use of the Internet.”49 It does not
    clearly define the role of each stakeholder, the government in particular, for
    Internet governance, though the statement clearly indicates that actors other
    than national governments have a strong role in governing the Internet. Recalling
    the Aristotelian perspective, the risk in allowing nongovernmental authorities
    to develop legislation or decrees is that these parties will seek to further their
    own interests rather than the interests of the community as a whole.


    Further, the Tunis Agenda states that “the existing arrangements for Internet
    governance have worked effectively to make the Internet the highly robust, dynamic
    and geographically diverse medium that it is today, with the private sector taking
    the lead in day-to-day operations, and with innovation and value creation at the
    edges.”50 It is further stressed that there is a “need for enhanced cooperation
    in the future, to enable governments, on an equal footing, to carry out their
    roles and responsibilities, in international public policy issues pertaining to
    the Internet, but not in the day-to-day technical and operational matters, that
    do not impact on international public policy issues.”51 Hence, the private sector’s
    role is clearly defined by the Tunis Agenda as being responsible for the day to-day
    operations of the Internet, and governments should play no role in these technical
    and operational trivialities. The government’s role remains unclear, other than
    that it should have a significant role in international public policy making.


    The views expressed by participants in the inaugural Internet Governance Forum
    provide further insight into the perception of what government’s role should be
    in provisioning Internet security.52 Significantly, a market-driven'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'approach was emphasized in which “government’s first responsibility is [to]
    set the benchmark, and ask the private sector to respond.”53 The reasoning is
    that the main actors in the field are service providers and the software industry
    and individuals.54 While it is true that these are the main stakeholders, this
    viewpoint is tantamount to suggesting that benchmarks be set against certain crimes
    and that it is the responsibility of nongovernment stakeholders to ensure that
    crimes are not committed. Further, it was noted “that better information security
    practices happen globally, not just nationally through the coordinating role of
    government but through the activities of industry.”55 The appropriate role for
    government is thus not one of a critical provider of security. Rather, it is that
    of a security coordinator setting benchmarks for the private sector to meet. According
    to paragraph 40 of the Tunis Agenda, prosecuting cybercrime is one area in which
    the collaborative efforts of stakeholders should take place. Due to the global
    nature of the Internet, it is recognized that cybercrime that is perpetrated in
    one country might impact people in another country.


    It seems paradoxical that entities other than national governments working under
    the auspices of international institutions of diplomacy would be tasked with governing
    any domain, since governance is the responsibility of governments. As Aristotle
    correctly suggested, the political system exists to eliminate the bias of individuals
    to the best extent possible. This is not to say that the private sector is guilty
    of taking advantage of its position as the main engine developing the technology
    on which the Information Society is based. It is quite the contrary. One must
    keep in mind that national governments were the chief negotiators of the Declaration
    of Principles, the Tunis Agenda, and the Tunis Commitment. Therefore, it appears
    that governments are shirking their responsibilities to provide security, hoping
    that the private sector and individuals, with some legislative guidance, will
    do the job for which government is responsible. This becomes apparent when reviewing
    the United States’ National Security Strategy to Secure Cyberspace (NSSSC), which
    is important since the United States founded the Internet and thus “has important
