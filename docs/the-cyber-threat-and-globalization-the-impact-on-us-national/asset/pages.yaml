- pgno: 8
  md: '# Preface


    The application of military power has taken on new purpose and significance in
    the twenty-first century. The change in the order of world affairs has been driven
    by disruptive technologies, an ever-expanding global economy, a dispersion of
    power, and a clash with embedded institutions, interests, and worldviews. Adjustment
    will continue to be a process of trial, reorientation, missteps, and lapses. Despite
    the integration of information and communication technologies (ICTs) onto military
    platforms and the rise of cyber commands worldwide, militaries find difficulty
    in resisting the drift to organize, train, and equip using organizational methods
    adopted in the twentieth century. Further, the nature of the use of the raw power
    of the military as “an instrument of policy” is no longer the convenient definition
    of global conflict it was when Carl von Clausewitz lived and wrote. In today’s
    postindustrial age, information is more valuable than territory and has become
    the main commodity influencing geopolitics. The reliance of societies on cyberspace
    and ICTs for economic prosperity and of national security on data flows represents
    a new domain of human activity and conflict. Cyberspace has become both an economic
    enabler and also a source of global instability. Its potential as a tool of social
    disruption in mobilizing populations and the low cost of entry into asymmetric
    conflict have forced a paradigm shift unknown to man since, as General Michael
    Hayden has remarked, the invention of human language.


    In addressing the paradigm shift in national security and global conflict, this
    book is co-written and designed as a text for courses and students of security
    studies and international relations who want a better grasp of the nature and
    existential threat of today’s information wars. Additionally, security professionals
    and practitioners will find it a useful tool. The work is a conceptual and practical
    book, not a theoretical work. It explains the relevant concepts as well as structural
    challenges and responsibilities with which policy makers struggle and practitioners
    must work. The text interweaves chapters with pedagogy boxes that illustrate the
    challenges and issues for both. For members of the lay public with an interest
    in cyber-related security issues and security affairs, the book is written to
    make policy and technical concepts user friendly and, hopefully, enjoyable to
    read. Ultimately, it will increase the level of understanding of readers of all
    audiences who are concerned about cyber threats and their impact on society, including
    at the level of our daily routines.


    The ultimate goal of the book is to enable students and concerned citizens to
    have a better understanding of the complex nature of the morphing cyber threat
    vector as it relates to national security, commerce, and the everyday things we
    often take for granted. It is intended for upper-level undergraduate and graduate-level
    advanced courses in national and international security. However, security professionals
    will also find the work a valuable resource and reference book. Although this
    is not necessarily a textbook for specialists in computer technology, practitioners
    in supply-chain logistics, legal consultants, public policy'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'administrators, and criminal justice professionals will find it a worthwhile
    tool in communicating relevant concepts and definitions in a way that is accessible
    and less esoteric.


    Scholarly/popular audiences who want an understanding of our overdependence on
    networks and the vulnerabilities to which they are subject should find the book
    educational and clarifying. For these readers, it will become clear how the U.S.
    economy, our political system, and our quality of life are under attack. The threats
    from disgruntled employees, hacktivists, criminals, terrorists, and hostile governments
    are described, and security vulnerabilities are explained in a structured and
    coherent way. It is the wish of the authors, the contributors, and the publisher
    that all groups will regard the book as a constructive, timely text and a worthy
    addition to their library. Any student is likely to encounter cybersecurity in
    disciplines like public administration, public policy, criminology/criminal justice
    and policing, emergency management, political science and international studies,
    international relations, global affairs, security studies, and military or defense
    studies. Cybersecurity is fundamental to many fields as societal institutions
    and conventions adapt to the information age and consequential new patterns of
    change.


    Moreover, as the state-centered international system is under immense pressure,
    security frameworks become more outmoded. Yet, in the face of the challenges from
    offensive cyber capabilities being developed by terrorist groups, criminal gangs,
    and other substate actors, the primary competitors of the Cold War are still major
    players and pose the most significant threat to national and global security.
    In addressing the nonsymmetrical onslaught, this book offers an analysis of the
    altering landscape of warfare and economic competition. Using recent events and
    documented experiences as examples, the book reveals truths about our dependence
    on networks, the fragility of these networks, and the programs, policies, technological
    advancements, and other efforts to defend against adversarial use of cyber.


    To further augment the text, pedagogy boxes include vignettes and case studies.
    Noted subject matter experts also amplify the topics through opinion pieces, essays,
    and extended quotes from testimonies and scholarly articles. Their opinions are
    their own and are not influenced by the views of the authors. Therefore, their
    purpose is to offer different perspectives on a variety of debatable issues and
    subjects and to give the reader exposure to independent thought pieces within
    the structure of an organized work. We are fortunate to have contributors who
    are recognized authorities, and their insights add depth and breadth to a book
    that attempts to make clear some truths and facts on a range of technological
    and policy issues against the backdrop of a mutable environment and a complex
    and developing world order.'
