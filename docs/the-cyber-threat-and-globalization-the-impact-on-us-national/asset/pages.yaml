- pgno: 203
  md: 'either machine generated or human generated. Whatever the source, it adds to
    the burgeoning wave of complex data and the attendant challenges of building resilient
    and economic databases, as well as formulating efficient algorithms for managing
    information.


    The third V in the big-data triptych is velocity. It is the measure of the flow
    of data. Increasing computing speeds and pressures of response demand in support
    of real time analytics and decision making have strained the transport apparatus.
    Status updates along the smart grid that previously transpired every two to four
    seconds are now approaching a rate of ten times a second thanks to new phasor
    technologies.8 Meanwhile, high-frequency financial trading and those who depend
    on situational awareness to perform their duties, such as first responders, national
    security professionals, and the military, need short date-to-decision cycles.
    As volume increases and variety mushrooms, velocity is the third coefficient in
    the big-data problem. The interplay of the three Vs challenges the effort to convert
    raw data into actionable information.


    Withal, the growth of IoT and the explosion of big data will continue to place
    more pressures on national security and global security regimes for at least the
    near future. Analysts are often overwhelmed. Existing and future operations depend
    on a highly educated and technical workforce. Because of a scarcity of talent,
    many security jobs are not filled. (Edward Snowden, who claimed to earn $200,000
    a year as a computer expert, dropped out of high school and took computer courses
    at a local community college without earning a degree.9) Add to these conditions
    the rigors of the security clearance process in finding qualified people and the
    range of tasks at the strategic, operational, and tactical levels that persistently
    feed the pressures of increasing demands.


    As the big-data revolution continues, this list of data sources will grow to include
    unstructured data feeds, such as ISR and drone footage, passive sonar feeds, gunshot
    echolocation systems, traffic systems, surveillance footage analytics, text analytics
    applied to texts, social media—a list that will expand to include novel types
    of sensors and fused data products as they are created. These sources of data
    will need to be managed by the national security community to maintain its intelligence
    edge.10


    Assuming these problems are resolved, the enhancement of the work of police and
    intelligence agencies to investigate their suspects and interdict against crime
    and terrorism can become robust. However, the negative returns are much harder
    to forecast. Important questions will haunt and bedevil us. How will this thickening
    network of connected systems complicate security regimes and be an element in
    the rise of system vulnerabilities? Will privacy concerns clash with security
    imperatives as state and private actors secure access to private information?
    What are the limits for abuse for both legitimate and nonlegitimate actors?


    To summarize, too much data is being generated at too fast a rate, and from too
    many different sources. As briefly mentioned above, the ability to manage data
    by boosting computer performance depends more and more on algorithmic theory and
    development. New types of analytics have the promise of collecting, managing,
    and analyzing data from not only tabular sources but also textual, linguistic,
    and visual feeds. Hence, new knowledge and insight will be drawn'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'through an array of advanced automated technologies and methodologies while
    accommodating a tsunami of data from a multitude of sources. To this end, artificial
    intelligence and its subfield, machine learning, are key concepts.


    # Artificial Intelligence


    Artificial intelligence (AI) is often a lax term that generalists sometimes use
    to merely describe an application that has never been done before. Artificial
    intelligence is frequently grouped into two categories—artificial general intelligence
    (AGI), also referred to as strong intelligence, and artificial narrow intelligence
    (ANI), or weak intelligence. AGI’s base principle is that a machine can be made
    to think and have the ability to represent the human mind and, ergo, be capable
    of experiencing consciousness. A computer, robot, or any smart device, therefore,
    could function in a similar mode as a human brain and, with applicable inputs,
    outputs, and the appropriate programming, have a mind in exactly the same sense
    that human beings have minds. If fulfilled, the belief is that machines will be
    able to reason, think, and do all the functions that a human is capable of doing.


    Noam Chomsky described AI research as a field that “analyzes the internal structure
    of a system that empowers it to perform a task, which computers often perform
    better and faster than human beings.”11 As a discipline, basically, it refers
    to a computer system that perceives its environment and takes actions such as
    learning and problem solving that normally require human or animal intelligence.
    In order to introduce human reasoning, problem solving, and what we casually call
    common sense, machines need access to information, categories, and objects such
    as databases, rules of logic, and sometimes robotics. The enormous power of computers
    to explore and evaluate massive amounts of data, detect patterns, and reveal connections
    has already been demonstrated in economics, the natural sciences, and national
    security.


    These cognitive functions are about maximizing the odds of success at any defined
    goal, which currently include such tasks as visual perception, speech recognition,
    translation between languages, and decision making. Eventually, the combination
    of AI and robotics will be making use of their environments to perform even higher
    cognitive undertakings such as the naturally instinctual task of building a bird’s
    nest. Its potential is immense, transformational, and speculative. Indeed, much
    of AI’s transformative applications are yet to be addressed.12 Advancement in
    artificial intelligence over the past several years has already surpassed expectations.
    Experts foresee an even greater pace of development and progress for the future.


    Researchers at Harvard’s Belfer Center for Science and International Affairs,
