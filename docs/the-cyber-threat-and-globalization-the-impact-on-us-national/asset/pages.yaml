    # “Psyber Operations”


    The misuse of cyberspace to create effects that are destructive to person and
    property is not isolated to industrial control systems (ICSs) or computer systems.
    As has been observed in recent protest movements, such as in Iran (2009), at the
    Pittsburgh Summit (2009), and in Athens (2008), individuals are using converged
    Internet and cellular technologies, such as Twitter and Facebook, to spontaneously
    organize themselves into groups that begin with nonviolence but may turn to violent
    protest. Further, cyber means have caused more than one suicide as a result of
    an individual being intimidated online.32 One study found that the Internet can
    facilitate protest and other antiregime activities through the formation of groups,
    and that there is an impact of the technology on their subsequent collective actions.33
    Thus, the human mind can be a target of influence to either mobilize, intimidate,
    or terrorize a targeted population. This is what I term “psyber operations”: the
    use of social interactions to, without a physical presence, mobilize populations
    to cause physical effects.


    The starting point of this concept is that Internet content produces emotions.
    As discussed above, radicalization of an individual can be the end result of this
    emotion. Psyber operations are not radicalization. As Aristotle noted, “In forming
    opinions we are not free: we cannot escape the alternative of falsehood'
