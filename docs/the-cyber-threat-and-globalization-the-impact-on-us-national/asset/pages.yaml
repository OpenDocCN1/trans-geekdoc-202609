  md: 'According to a 2016 article in the New York Times, “no target is too small
    to warrant attention, no attack too petty,” and attacks are conducted by agents
    “trained to believe that the ends always justify the means.”[32] The Times article
    adds that political opponents, environmental activists, and members of cultural
    societies that the regime finds offensive are among the list of kompromat targets.
    The dark web, discussed in chapter 2, is a cyber demesne where criminals, terrorists,
    and state-sponsored hackers and spies conduct business freely, and which at times
    can involve the work of ruining private lives. This Kafkaesque underworld is another
    dangerous reality of a globalization process driven by technology and challenging
    the imagination to control it equitably across jurisdictions. The dark aspect
    of this modern “sordid boon” might best be expressed in the boast of an advertisement
    by a deep web netizen:


    > I’ll do anything for money. [I will ruin] your opponents, business or private
    persons you don’t like. I can ruin them financially and or get them arrested.
    whatever you like. If you want someone to get known as a child porn user, no problem.
    [A price of $600 per “account” was demanded—denominated in Bitcoins.[33]


    Hindering the use of social media to combat its abuse by state and nonstate actors
    is oftentimes the institutionalization of old practices and the hierarchical structure
    of the chains of command.[34] The inflexibility of governmental bureaucratic structures
    can run in contrast to the self-organizing, horizontal nature of social media.
    There exists as well a cultural divide between many military commanders and entrenched
    bureaucrats, whose understanding of social software is comparatively blurred,
    versus junior members of the security establishment whose familiarity is more
    immediate and crystalline. Many observers claim that until a coherent information
    strategy forms, a great constructive potential of social media may remain fully
    unmatched.[35]


    In the meantime, progress pushes ahead in the fields of algorithmic methodology
    and cognitive security. Bot technology and bot detection technology are in an
    intensifying arms race. According to one expert, this competition between the
    opposing technologies “will only be over when the effectiveness of early detection
    will sufficiently increase the cost of deception.”[36] At present, algorithms
    allow bots the ability to self-govern as they search the net for profile images
    and even “post messages at particular times of day, engage in conversation, and
    clone” real users’ behavior.[37] The “race” becomes more intense as algorithmic
    research becomes more refined as methodologies move to genetic algorithmic theory
    from less sophisticated heuristic algorithms.


    Currently, bot detection technology is expensive, and its effectiveness is as
    yet not convincing enough to justify investment.[38] However, as the financial
    industry becomes more subject to the economic and market risks of this sort of
    public manipulation, there may be a new awareness of the threat. Most likely this
    sector will be the first to commit resources, if market disruptions and eroding
    investor confidence are the outcomes of doing nothing.'
