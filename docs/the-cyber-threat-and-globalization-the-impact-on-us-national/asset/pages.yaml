  md: '# # Box 7.1 The Mechanics of the IP Layer Stack


    The physical layer includes signals such as light and electricity, mechanical
    standards, and the signal procedures (such as the voltage and frequency of the
    signal). The data link is responsible for packet movement across networks. This
    includes protocols for the interconnection of hardware devices such as hubs, bridges,
    switches, and other hardware not connected to the Internet that function to move
    packets across a network. The network layer is a hierarchical addressing mechanism
    through which data is routed from machine X to machine Y. Internet Protocol (IP)
    is one element of the network layer. This protocol is responsible for assuring
    the accurate transmission of packets to their proper destination across networks.
    The session layer controls the establishment, maintenance, and termination of
    connections between applications across a network. The presentation layer delivers
    and formats information to the application layer; this is where the ones and zeros
    making up the packets are compressed, decompressed, encrypted, or decrypted in
    response to service requests made by the user via the application layer, which
    is what the user sees on his or her screen.


    > Source: Robert Molineux, *The Internet under the Hood*.


    and management throughout society.”23 The first part is a valid observation. However,
    the second part does not identify who the main actor responsible for managing
    and planning cybersecurity throughout society is. Not having a clearly identified
    government role becomes problematic in the next paragraph, where the UNGA recognizes
    “that, in a manner appropriate to their roles, government, business, other organizations,
    and individual owners and users of information technologies must be aware of relevant
    cybersecurity risks and preventive measures and must assume responsibility for
    and take steps to enhance the security of these information technologies.”24 Therefore,
    the trend of a broad number of actors (including governments), all of whom are
    responsible for securing ICT and preventing its misuse, is established in a manner
    that relies government of a primary responsibility of national security in the
    cyber domain. Thus, in the sequence and wording of these elements, the UNGA manages
    to strip government of its responsibility to act as the primary mover in cybersecurity
    efforts. Hence, the UNGA encourages a trend of emphasizing the role of private
    actors in providing cybersecurity to society, rather than signifying their importance
    in supporting government and law enforcement efforts.25


    A significant component of Resolution 57/239 is its annex, which establishes nine
    elements forming the basic tenets of the global culture of cybersecurity.26 These
    are awareness, responsibility, response, ethics, democracy, risk assessment, security
    design and implementation, security management, and reassessment.27 A brief summation
    of these nine elements follows. All participants in the global culture of cybersecurity
    should sustain a level of awareness regarding the importance of having secure
    information systems.28 Each participant is responsible for securing their own
    information systems and reviewing the'
