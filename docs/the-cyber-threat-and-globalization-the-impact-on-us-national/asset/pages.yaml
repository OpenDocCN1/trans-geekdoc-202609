- pgno: 126
  md: 'A similar argument can be constructed for building trust with China regarding
    the areas of computer security and critical infrastructure protection. Vice Admiral
    Mike McConnell, USN (ret.), suggests that Sino-U.S. cooperation would help “clean
    up” malevolent cyber activity and minimize hostile intrusions and disruptions
    caused by hacking and cybercrime. The visit of U.S. Deputy Secretary of State
    James Steinberg to Beijing in 2010 signaled a bilateral thaw after a series of
    intensifying controversies over U.S. weapons transfers to Taiwan, UN sanctions
    on Iran, and Internet freedom—heightened by the Google flap.


    The April 2013 visit of Secretary of State John Kerry to Beijing was an early
    sign of what was hoped would be a bilateral thaw after a series of intensifying
    disagreements surrounding U.S. weapons transfers to Taiwan, UN sanctions on Iran,
    and the United States’ Internet Freedom Agenda. Kerry’s visit was less successful
    than desired as it then did little to slow China’s cyber espionage efforts, lending
    credence to Brad DeLong’s suggestion that the balance of influence in China-U.S.
    relations has changed dramatically due to fundamental economic factors. Clearly,
    there will be fluctuations in this bilateral relationship—with the most recent
    “downs” linked to continued Chinese support for pervasive PLA-sponsored industrial
    espionage and China’s growing assertiveness in the South China Sea.


    Additionally, several track 2 diplomatic initiatives have been undertaken by the
    East West Institute to build trust, in addition to track 1.5 dialogues. Although
    held at the whims of the broader strategic relations between the two countries,
    these meetings were launched in an April 2013 announcement by John Kerry, while
    in Beijing, to launch a formal initiative to begin building a foundation for cooperation
    between the United States and the PRC. In his statement, Secretary Kerry said,


    > We will create an immediate working group because cyber security affects everybody.
    It affects airplanes in the sky, trains on their tracks. It affects the flow of
    water through dams. It affects transportation networks, power plants. It affects
    the financial sector, banks, and financial transactions. Every aspect of nations
    in modern times are affected by use of cyber networking, and obviously all of
    us, every nation, has an interest in protecting its people, protecting its rights,
    protecting its infrastructure. And so we are going to work immediately on an accelerated
    basis on cyber.


    Dialogue has led to verifiably increased shared understanding of what kinds of
    state-sanctioned behavior is acceptable. If the U.S. and Chinese leadership’s
    public statements were sincere and sustainable, this is a positive step in the
    U.S.-China relationship in cyberspace.


    # Beyond the Rhetoric


    While the words of politicians are good, we can also see a positive increase in
    the real cooperation between U.S. and Chinese law enforcement authorities in tackling
    cybercrime. Chinese authorities criminalize malicious hacking, putting culprits
    in jail if they are found guilty of creating damage through illegal actions involving
    intrusions in computer systems and networks—and China’s law enforcement services
    have cooperated with their American counterparts.'
