  md: '# Box 1.3 Zero-Day


    A day zero or zero-day is an exploit that takes advantage of a security flaw in
    software that is unknown to the code''s developer. Software companies may make
    public a bulletin or security advisory when the exploit becomes known. However,
    their ability to offer a solution or "patch" may not be available until sometime
    in the future. The term zero-day refers to the moment or day that the vulnerability
    becomes known.


    Zero-day exploits are rare. Only a dozen may surface during a single year. The
    Stuxnet worm contained four exploits. A malware program this highly developed
    might attract a price of approximately $500,000 on the black market, according
    to the producers of the documentary film Zero Days.


