- pgno: 200
  md: '# Cyber Horizons


    The compass of this chapter is to provide a broad strategic-level assessment of
    new technologies either currently being rolled out, slowly being adopted, or on
    the near horizon. Although the chapter focuses on an overview of technological
    trends that may shape the future cyber environment, as we warned in chapter 3,
    predicting what the next five years will look like along the cyberspace terrain
    would be a fool''s errand. The pace of development and innovation coming from
    the private sector, at universities, and in research laboratories is staggering.
    Many outcomes are the result of structured, calculated design. Other consequences
    are completely unintended. In either instance, the anticipation of the timing
    and impact of a disruptive technology is impossible to prophesy. Therefore, a
    cautionary note about predictions might be appropriate. In a 1995 InfoWorld column,
    Robert Metcalfe, founder of 3Com, predicted, “The Internet will soon go spectacularly
    supernova and in 1996 catastrophically collapse.” Adding further context to Metcalfe’s
    vision of the future, an anonymous source once opined, “A good forecaster is not
    smarter than everyone else, he merely has his ignorance better organized.” Thus,
    this chapter aims to focus on only certain changes in core and emerging technologies
    that define cyberspace. In this discussion, we also hope to predict, with caution,
    their impact on peripheral technologies where applications will reside, function,
    and be built. These changes represent a range of new solutions, new threats, and
    new dilemmas that are technical, societal, and even moral. They will require a
    new synergy among cross-disciplinary academic fields, subject matter experts from
    disparate professions, and a new emphasis on public-private partnerships.


    # Big Data


    The term *data mining*, although relevant to discussions on “machine learning”
    (see below), is a somewhat dated expression. We no longer “mine data”—we are assaulted
    by it. In truth, we live in the age of big data. Practically everything we do
    produces data that is tracked and recorded.¹ This data is partially the result
    of'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'the arrival and explosive growth of the Internet of Things (IoT), which bonds
    us to the objects and instruments of our daily life, “our cars, our homes, our
    appliances, our clothing and much more. In the emerging world of the Internet
    of Things, everything we do, see, use or touch will leave electronic tracks, enlarging
    further both the potential commercial and social value of such data.”²


    The flood of data generated daily is difficult to comprehend. In scale, it is
    analogous to the vastness of space or the imagination of the human mind. Sources
    include news articles and accounts in text and audio forms, imagery, video from
    security cameras, all types of sensors, GPS systems, smart phones and tablets,
    new types of media, and LiDAR (light detection and ranging—a remote sensing method
    used to examine the surface of the Earth, which includes sensor data, modeling/simulation
    and virtual training, geophysical analyses, and disaster analyses). Some data
    involves lower quality, such as web data, blogs, forums, and tweets. Adding vagueness
    to the complexity, much of this information is proprietary and fragmented among
    numerous private sector actors and is therefore difficult to quantify in terms
    of the actual size of the Internet or the extent of global cybercrime and cyber
    espionage.³


    This data heterogeneity generates increasingly complex questions and will require
    new processing methods and a workforce of algorithm developers and software engineers.⁴
    The benefits of harnessing these massive flows will lead to valuable insights
    that range from finely tailored marketing campaigns and uncovering new ways to
    detect symptoms of diseases and their spread, to anticipating impending national
    disasters and political or terrorist events.


    In order to understand the virtual incalculability of the data environment, consider
    the estimate that the planet produces 2.5 exabytes (exabyte = one billion billion
    bytes) of data daily.⁵ Five exabytes is supposedly the sum of all words ever spoken
    by humankind. A single exabyte of data would fill 1.5 billion CD-ROM discs or
    three thousand Libraries of Congress. Therefore, by the end of today we will have
    generated the equivalent of 7,500 Congressional Libraries. By 2025, that number
    will increase to the point where the digital world is producing approximately
    163 zettabytes (1 zettabyte = 1,000 exabytes) per year.


    In addition to being immense, data is also heterogeneous, interrelated, and byzantine.
    As these properties intensify and magnify, computing performance has plateaued.
    Moore’s Law (the axiom which, since 1965, suggests that every eighteen months
    the number of transistors on a computer chip doubles, driving the expansion of
    functions on a chip at a lower cost per function) has been declared “dead.” The
    new reliance on computer performance and productivity now, to a large extent,
    rests on the improvement and development of algorithmic research.⁶


    The multidimensional challenge of managing big data comes from the set of problems
    known as the three Vs—volume, variety, and velocity. Volume is the foundational
    challenge. The exponential daily growth of data overwhelms our storage facilities,
    the communication grid that transports it, and our ability to manage it and make
    it actionable. Compounding the problem of volume is the second issue—variety.


    Variety refers to the varying data sources and formats that alternate from simple
    data to more complex data. Simple data often fits into fields on a spreadsheet'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'or a database application. Examples include fiscal data, sensor data, metadata
    (data about data), and clickstream data (the virtual stream a user leaves behind
    while surfing the Internet). More complex data includes biometric data, geo-spatial
    information system (GIS) data, encrypted packages, social media data, and other
    types of data exhaust. These divergent data generation events discharge clashing
    categories and formats. Each “event” requires its own analytical method and contributes
    to, and compounds, the variety problem of big data.


    Moreover, a fusion challenge exists when analysts attempt to merge data from hard
    numerical readings from sensors or databases with softer indicators that articles,
    photos, blogs, and tweets communicate. To the analyst’s world, data is basically
    divided into structured data and unstructured data. Structured data, as its name
    implies, relates to information with a high degree of organization. Information
    in structured data form is usually organized by tables, spreadsheets, and columns
    and can be readily searchable by simple or direct search engine algorithms or
    other search operations. Structured data fits seamlessly within relational databases,
    which are configured to recognize relations among stored items of information,
    and therefore agilely lends itself to searches. Information such as records on
    credit cards, bank accounts, retail purchases, Internet service providers’ metadata,
    air flights, hotel bookings, trade flows, and statistics of all kinds represents
    a brief list of examples.


    On the other hand, unstructured data has no recognizable ordering or identifiable
    relationships and therefore is not adaptable to databases. E-mails, word processing
    documents, videos, photos, audio files, presentations, web pages, and many other
    kinds of images and business documents may have some internal structure, but because
    this type of information does not have a predefined data model and is not organized
    in a predefined manner, it is unstructured. Analysis of unstructured data is highly
    interpretational. What does an image represent? How to gauge the tone of an editorial
    or social media rant? How to identify and trace the movement of individuals of
    interest as they traverse geographic boundaries and multiple networks? How to
    track any entity as it crosses a range of data sets? These are the sorts of questions
    that unstructured data often poses. Moreover, unstructured data is everywhere
    and is far outpacing structured data in terms of both volume and growth. Currently,
    over 80 percent of data is unstructured. As with structured data, unstructured
    data can be


    # Box 8.1 Data Exhaust


    Data exhaust refers to the data generated as trails or information by-products
    resulting from all digital or online activities. These consist of storable choices,
    actions, and preferences, such as log files, cookies, temporary files, and even
    information that is generated for every process or transaction done digitally.
    This data can be very revealing about an individual, so it is very valuable to
    researchers and especially to marketers and business entities.


    Source: https://www.techopedia.com/definition/30319/data-exhaust.'
