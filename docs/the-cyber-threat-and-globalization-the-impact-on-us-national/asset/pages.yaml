- pgno: 212
  md: 'the capability of war fighters and the use of unmanned weapons systems in a
    multidomain battle space. With the arrival of this new generation of weapons comes
    a changing face of warfare, a transformation in combat decision making,³⁰ and
    an outbreak of moral and ethical questions concerning the use of autonomous weapons.


    Machine learning/deep learning is key to the development of future militaries.
    The asymmetric advantage of unmanned vehicles on land, sea, air, and space relies
    on artificial intelligence. AI is also critical to human-machine collaboration
    and teaming in combat. The F-35 Joint Strike Fighter jet (for which Chinese hackers
    allegedly stole plans equal to over fifty terabytes of data from U.S. defense
    contractors in 2010; see chapter 4) is an archetype of Third Offset Strategy weaponry.


    In addition to stealth capability, the F 35 includes information sharing, sensor
    fusion, and digital displays.” It can be described as a flying sensor that can
    accommodate massive amounts of data, analyze it, and then display it in the pilot’s
    helmet.” The technology allows war planners and war fighters to not only make
    enhanced decisions but create an integrated electronic attack platform. “The F-35
    is an airpower force multiplier—the ‘quarterback’ of air operations, utilizing
    its advanced network and sensor suite to distribute information and target allocation
    across the air picture.”³⁹ As noted by a navy test pilot, “In the future, it may
    not matter where the weapon comes from. I may pass the data along, or I may fire
    a weapon and it may come from somewhere else. That is where we are heading.”⁴⁰


    Yet, as discussed above, this reliance on network technology creates vulnerabilities.
    The deep learning mechanisms and “black box” process of automated systems create
    breaches in the system unknown to the creator and operator. These system flaws
    would most likely not be discovered until after they have been exploited by an
    adversary. Because of the complexities of algorithms, the hope of monitoring decision-making
    processes by somehow partnering with machines is an elusive solution—further hobbled
    by vague definitions and standards for optimal efficiency and certainty. At the
    same time, the enormous and mounting flow of data, the demands for instantaneous
    processing, and shorter time-to decision cycles are overwhelming human capacities
    in war and peace.


    For war fighters, the need for optimal decision and solution resolution, however,
    is a matter of life or death. Despite the pressures, we still need a human in
    the loop to assure our moral responsibility and our humanity. The decision to
    use lethal force in a distributed battle scape must not be ceded to machines.
    Yet, in those instances when under attack at machine speeds, as former deputy
    secretary of defense Robert Work offered in a very human response: “We want to
    have a machine that can protect us.” The dilemma for Third Offset Strategists
    is that as unmanned systems become more autonomous over time due to technological
    advances, how do we retain effective and efficient control? Will every human in
    the decision loop create a friction point that yields a timing advantage to an
    adversary who has no such compelling sense of accountability that would require
    human control and verification? There is not a simple path to an “elegant solution.”
    Building unmanned systems with augmented intelligence has profound priority-setting
    challenges.'
