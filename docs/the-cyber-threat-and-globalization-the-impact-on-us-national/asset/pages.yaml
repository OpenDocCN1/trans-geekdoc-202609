- pgno: 10
  md: '# # Defining Cyberspace


    # ## A World at War with Itself


    On April 1, 2001, a U.S. EP-3 reconnaissance and surveillance plane was conducting
    operations along China''s Hainan Province via the South China Sea. When the EP-3
    approached Chinese airspace, two Chinese F-8 fighter jets scrambled to meet it.
    A mid-air collision forced the reconnaissance plane to land in Hainan and resulted
    in the death of one of the fighter pilots. The clash and the death of Wang Wei,
    the Chinese jet pilot, was not only an international incident—it provoked discussions
    in chat rooms in China and the United States which eventually spanned the globe.


    In China, the outrage found vent in messages such as the following: “This is the
    third time the American imperialists have dumped crap down China’s neck.” “We
    can forego joining the WTO but we cannot afford to lose face.” “Why can’t the
    U.S. show any human rights concern to the poor missing pilot?” “The whole nation
    is waiting to see if China can play hardball with the U.S.”


    Within two weeks, an exchange of cyberattacks arose across the Pacific. A cyber
    war was even declared for the dates of April 30 through May 8 between hackers
    in China and the United States. These “unauthorized enthusiasts” launched denial-of
    service attacks and defaced websites. Fortunately, the attacks inflicted little
    damage since participants chose not to launch malicious codes or target servers.


    Three Chinese groups bore primary responsibility for most of the defaced websites.
    The Honker Union of China, Hacker Union of China, and China Eagle Union—a civilian
    nonprofit organization of part time network fanatics—vandalized such targets as
    the White House home page and the websites of the U.S. Department of Labor, the
    U.S. Department of Health, and UPI (United Press International).³ By the time
    hostilities ended, Chinese hackers had defaced about a thousand American sites,
    often with images of waving Chinese national flags and anti-American slogans.


    For their part, the Americans not only targeted Chinese government sites, but
    also universities and nonprofit organizations.³ With a ting of hauteur and'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'characteristic self-assurance, one American defacement read, “bagel—morning
    coffee—and a Chinese website. Nice little routine.”4 At the center of these attacks
    were two American hacker groups identified as Pr0phets and PoizonBox.5


    Both the Chinese (PRC) and U.S. governments took the cyber “war” seriously. During
    the aggressions, the National Infrastructure Protection Commission Watch and Warning
    Unit established a hotline. The U.S. Navy also announced that it was at INFOCONALPHA,
    a cyber-equivalent status of a physical threat condition. Meanwhile, the Chinese
    Communist Party (CCP) urged citizens to show “collective displeasure” by defacing
    American sites. By the time the U.S. crewmen were released and the two governments
    declared the episode closed, thousands of young Chinese hackers had joined in
    the attack on targets as diverse as military installations and public libraries.
    Further, before the attack’s end, hackers from all corners of the planet took
    sides and participated. Individuals from India, Pakistan, Brazil, Indonesia, Malaysia,
    Argentina, South Korea, Saudi Arabia, and Japan took part in what today would
    be described as a global “cyber riot.”


    However, after the U.S. issued a “letter of sorrow” and paid reparations, Chinese
    hackers continued to ply their craft, even under the threat of arrest. In response,
    the CCP seized the moment to bring this community under control by converting
    these groups of “net warriors” into more formal organizations. In 2003, the People’s
    Liberation Army (PLA) began conducting surveys and competitions to identify talent.
    Today, some estimate that as many as two hundred thousand work in labs and commercial
    firms with the support of the Chinese military.6 Reflecting on the events of April
    and May 2001, Professor Zhang Zhaozhong, at the Chinese National Defense University
    and director of its Military and Equipment Teaching and Research Center, commented
    that the cyber conflict


    presented a modern format of warfare, alive and kicking, before the eyes of the
    netizens, and invented many a combat method through practice, amassed abundant
    experience, expanded the contingent of hackers, tempered their mettle for cyberspace
    fighting, and made an impressive show of the wisdom and abilities of the Chinese
    netizens to the netizens around the world.7


    Beyond being a platform for a “modern format of warfare” as Zhang hypothesized,
    the British technologist and journalist Ben Hamersley declared, “[The Internet
    had become the] dominant platform for life in the 21st Century.” The social networking
    phenomenon at work in the EP 3 incident has grown enormously over the past decade.
    The processes and relationships that govern it are complex. The benefits to national
    security are significant, even critical. Social media (also referred to as Web
    2.0) is recognized as a connective tool and an intellectual force multiplier.8
    However, as telling as the EP-3 episode was, it is only a scant glimpse of the
    density and impact of cyber on today’s arena of conflict.


    The notion that the application of military power has been transformed in the
    twenty first century finds acceptance in even the most sclerotic of conventional
    wisdom. Yet despite the integration of information and communication technologies
    (ICTs) into military platforms and the rise of cyber commands worldwide, militaries
    continue to organize, train, and equip personnel using'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'organizational methods adopted in the nineteenth century and used throughout
    the twentieth. Raw military power as “an instrument of policy” is a departed strategic
    response mechanism in today’s arena of conflict. As General David Petraeus, former
    commanding general of the International Security Assistance Force in Afghanistan
    and CIA director, commented, “to kill or capture our way to victory” is no longer
    a strategic opportunity.” Disorienting features of the new conflict are the unfinal
    objectives that dominate a new strategy of warfare and competition by state and
    nonstate actors. In these new wars, mass disruption rather than destruction can
    be acceptable goals. The preference for endless conflict over final victory is
    another strategic objective that forces a reshaping of the accepted wisdom on
    preparedness and offensive planning. Because of our reliance on technology, we
    are highly vulnerable to these threats. Therefore, the cyber domain represents
    the most critical field of conflict.


    # What, Then, Is Cyber?


    Prior to the terms *cyberspace*, *cybersecurity*, *cybercrime*, *cyberwar*, etc.,
    there was the subject area of *cybernetics* (from the Greek word *kybernetes*
    [κυβερνης], “steersman,” from *kuberman*, “to steer”). Cybernetics is the study
    of communication and control systems in living beings and machines. Beginning
    in the late 1940s, specialists from fields as diverse as biology, engineering,
    and social science took up the question, “How do systems work?” and hence a new
    morpheme appeared in the modern lexicon. Earlier natural variations included *cybercube*,
    *cyber friend*, *cyber lover*, *cyber snob*, and even adverbs like *cyber-sheepishly*.10


    The word *cyberspace* was first coined by the science fiction author William Gibson.
    He expresses “cyberspace” in the novel *Neuromancer* as a “consensual hallucination
    . . . a graphic representation of data extracted from the banks of every computer
    in the human system.” Ultimately, the word *cyberspace* is at best a lax term,
    an attempt to describe an information environment while conveying the evolutionary
    and unrestrained nature of its substance and essence. Through time, the Pentagon
    has offered up at least twelve definitions of what it believes is the definition
    of *cyberspace*.11 Ultimately, the operational definition we use must confer a
    meaning of *cyber* and attendant concepts in the same terms that we use to understand,
    pen, and verbalize our notions about the oceans, outer space, the ecosystem, and
    other frontiers of human endeavor where serious challenges co exist alongside
    grand opportunities for cooperation. For the purposes of this discussion, we can
    defer to the U.S. Joint Chiefs of Staff:


    The domain characterized by the use of electronics and the **electromagnetic spectrum**
    to store, modify, and exchange data via network systems and associated physical
    infrastructure.12


    Thus, cyberspace is both logical (virtual) and physical. It encompasses digitally
    networked information and information technologies, which include computer terminals,
    servers, and mobile devices connected to remote or hard drives (servers) via a
    digital network.13 Although man-made, cyberspace is bound by physics. Cyberspace
    exists where the wave-particle duality of radiation, when modulated with bits,
    creates an information flow. Most attention focuses on the'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Box 1.1 Electromagnetic Spectrum


    What is known as the electromagnetic spectrum is the combination of electric and
    magnetic fields. The reciprocal relationship between electricity and magnetism
    forms the medium. When these forces are unified mathematically, they create electromagnetic
    (EM) waves of radio and light. The oscillation of atomic interaction determines
    wave frequencies, which govern such properties as visibility and energy and can
    create the separate pathways, or wavelengths, along which information streams.


    logical elements of cyberspace. However, the importance of the electromagnetic
    spectrum (EMS), cyberspace’s physical element, will increase as broadband and
    mobile technologies continue to converge.


    It is the “logic” elements of cyber that permits information to flow across networks
    and appear within applications to create effects in the real world, which are
    bound only by the limits of human innovation.


    The two main types of media, or digital networks, are the Internet and intranets.
    Intranets refers to private or restricted networks created using Internet software.
    Internet, or the World Wide Web, is the global network that permits access to
    computers worldwide and users the ability to connect and exchange information.
    As is the nature of all technology, the World Wide Web has gone through generations
    of evolutionary processes. It began with Usenet, a computer-based distributed
    discussion system first devised in 1979. Currently, we are on the cusp of Web
    3.0, or the semantic web. The beginnings of this technological era date roughly
    between 2010 and 2012 and will intensify in 2020. Historically, the evolutionary
    trajectory of the Internet is as follows:


    +   • Web 1.0 was the static web, where people would go and read information without
    interacting with the media. Referred to, also, as the personal computer era from
    1980 to 1990.


    +   • Web 2.0 is the interactive and social web. The trend toward this started
    circa 2000 but did not fully take off until later in the decade with the popularization
    of services such as YouTube and Facebook. Users interact across many devices and
    fluently transfer between author and audience states—in real time. Information
    retrieval (Google) and speech recognition (IBM’s ViaVoice) also belong to this
    era of web development.


    +   • Web 3.0, or the semantic web, is about machines connecting data, which was
    not previously linked. The semantic web will teach the computer what the data
    means, and this will evolve into artificial intelligence that can utilize that
    information. Semantic web technologies enable people to create data stores on
    the web, build vocabularies, and write rules for handling data. The question-answering
    system (e.g., IBM’s Watson, which appeared on episodes of the TV quiz-show Jeopardy!)
    is an example of Web 3.0 technology.'
  merge: -1
