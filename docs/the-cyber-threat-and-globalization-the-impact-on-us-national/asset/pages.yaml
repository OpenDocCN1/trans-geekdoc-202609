  md: '# # Electronic Warfare 129


    Electronic warfare (EW) has generally been considered separately from cyber warfare,
    but there is a trend toward combining the two disciplines. This is being driven
    by a recognition that both areas rely on the electromagnetic spectrum to some
    extent and that maintaining a false separation is illogical and potentially detrimental
    to operations in both areas. Unlike cyber warfare, EW has a long history of doctrine
    and practice that enables it to operate as an integral part of kinetic operations.
    For example, an airstrike would not be routed over contested territory without
    suppressing enemy air defenses, which can be an EW mission.


    # ## Cyber Espionage and Intelligence Gathering


    # ### International Law


    It is well established that states commonly use cyberspace to conduct espionage
    activities against other states and nonstate groups. When used within the context
    of an armed conflict, espionage activities are permitted, subject to limitations
    imposed by the LOAC, such as the prohibition on acts of perfidy. Outside of armed
    conflicts, however, espionage is neither expressly condoned nor condemned by international
    law. In fact, despite the fact that espionage has been commonly used to gather
    information since biblical times, there has been little international effort to
    determine what the limits on acceptable espionage might be or even to note its
    international legality. States have seemed satisfied to pass domestic legislation
    prohibiting espionage activities conducted against them, while simultaneously
    dedicating much time, effort, and resources to conducting espionage against others,
    both friend and foe. It is clear that in the absence of a direct prohibition in
    international law on espionage per se, cyber espionage would not rise to the level
    of use of force under the jus ad bellum legal framework discussed earlier.


    Although the rule, or lack of rules, is straightforward, the application in cyberspace
    can be difficult. In physical space, it is generally easy to distinguish espionage
    and more aggressive action. Traditional combatants wear uniforms and carry weapons
    openly, and someone using kinetic weapons to wound or kill is unlikely to be mistaken
    for a spy because the activities are just too different.


    Cyber espionage, on the other hand, could easily be mistaken for aggressive activity.
    Obtaining unauthorized access to a computer or network, elevating privileges from
    user to administrator, viewing system files, and installing malware for persistent
    access are examples of activities that would be undertaken in both cyber espionage
    and in cyber attack operations. This ambiguity has the potential to create confusion
    over whether a particular cyber operation should be considered aggressive or a
    use of force. Consequently, the traditional international law position that ignores
    espionage may not be tenable in cyberspace in the long run.


    The United States has long felt that cyber espionage with the purpose of stealing
    industrial information for profit should be treated less favorably than espionage
    for national security. There has historically been little support for this position,
    but in 2015, China, whose cyber-espionage activities are often pointed out as
    the primary reason for U.S. concerns in the area, appeared to give some ground
    on the issue. The United States and China agreed that neither country’s government
    would conduct or support cyber-enabled theft of intellectual property with the
    intent of providing competitive advantage to private companies. There are concerns
    that Chinese behavior will not change, but even its recognition of a separate
    class of espionage might be seen as a victory of sorts for the U.S. position.


    Case Study: Operation Buckshot Yankee. 2008. In 2008 the DOD''s classified military
    computer networks were compromised by malware. A flash drive preloaded with targeted
    malware'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'was inserted into a military laptop at a base in Southwest Asia. The malicious
    code spread from U.S. Central Command''s computer network across the DOD information
    network, infecting both classified and unclassified computers. The purpose of
    the malware was to discover what information was available on the network, report
    back to its controller, and then exfiltrate desired information. The DOD concluded
    the malware was distributed by a foreign intelligence agency.


    Operation Buckshot Yankee is an example of an operation that doesn''t rise to
    the level of a use of force or armed attack but is rather an effective demonstration
    of the value of cyber techniques as tools of espionage. Another example is the
    Office of Personnel Management hack of 2015, which resulted in the exfiltration
    of the personal data of millions of individuals who hold security clearances in
    the United States.


    # Domestic Law


    It should be noted up front that intelligence law is a very specialized area of
    practice. Legal advisors who do not work in the area regularly should consult
    with those who do before rendering advice. Classification issues and the large
    number of organizations involved in the area make it a potentially treacherous
    field for lawyers.


    In the United States, the ability of an intelligence agency to gather intelligence
    is restrained by laws designed to safeguard the privacy and constitutional rights
    of Americans. For purposes of intelligence gathering by the DOD, the principal
    sources of law in this arena are Executive Order 12333, United States Intelligence
    Activities; DOD Directive 5240.01, DOD Intelligence Activities; and DOD 5240.1-R,
    Procedures Governing the Activities of DOD Intelligence Components.


    The intelligence oversight rules contained within the above documents only apply
    when members of U.S. intelligence components attempt to collect information


    on U.S. persons. For purposes of these procedures, information is deemed to be
    “collected” only when it has been received for use by an employee of an intelligence
    component in the course of his or her official duties. Data collected by electronic
    means is “collected” only when it has been processed into intelligible form. A
    “U.S. person” is any one of the following: a U.S. citizen; an alien known by the
    DOD intelligence component concerned to be a permanent resident alien; an unincorporated
    association substantially composed of U.S. citizens or permanent resident aliens;
    or a corporation incorporated in the United States, except for a corporation directed
    and controlled by a foreign government or governments.


    Persons or organizations outside the United States are presumed to not be U.S.
    persons unless specific information to the contrary is received. Also, aliens
    in the United States are not presumed to be U.S. persons unless specific information
    to the contrary is received.


    In order for a member of an intelligence component to collect information on a
    U.S. person, that collection must be a necessary aspect of the mission assigned
    the collecting component, and the information collected must be within one or
    more of the following categories: information obtained with consent, publicly
    available information, foreign intelligence, counterintelligence, potential sources
    of assistance to intelligence activities, protection of intelligence sources and
    methods, physical security, personnel security, communications security, narcotics,
    threats to safety, overhead reconnaissance, or administrative purposes.


    Collection of foreign intelligence information by DOD components by means of electronic
    surveillance is subject to additional restrictions. For example, electronic surveillance
    for foreign intelligence and counterintelligence purposes may normally be conducted
    in the United States only pursuant to an order issued by the Foreign Intelligence
    Surveillance Court, and electronic surveillance'
