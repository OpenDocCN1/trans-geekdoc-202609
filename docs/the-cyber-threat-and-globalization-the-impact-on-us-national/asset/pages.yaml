    matrix.


    Insider threats are personnel who are employed, authorized, or granted privileges
    by an organization but who intentionally or inadvertently harm the organization.
    Theft and lapse of security compliance result in the loss of a numberless amount
    in bottom line dollars and opportunity costs. Current and former employees, consultants,
    suppliers, contractors, and even business partners all fall within the scope of
    the insider threat.


    Further, information/communication technology has given insiders more capacity
