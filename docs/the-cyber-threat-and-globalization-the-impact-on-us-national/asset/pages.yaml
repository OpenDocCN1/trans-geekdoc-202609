  md: 'Economic relations and notions of governance have felt the pressures of globalization
    and the breakneck speed of technological advancement. While technology hurls populations,
    cultures, and institutions headlong into the information age, in many ways we
    are still organized to fight industrial age conflicts. Knowledge of and familiarity
    with the new battle landscape that takes form in cyberspace is always evolving.
    The battle terrain is blurred, the weaponry is in a constant state of upgrade,
    and the enemy is indistinct and ubiquitous. The rivalry is among states, tribes,
    crime organizations, corporate interests, religious and political sects, and even
    allies. Sometimes it also includes neighbors and co-workers.


    The cyber landscape of town squares, Main Streets, dark alleys, secret corridors,
    and open battlefields referred to earlier is not a static environment. It is dynamic,
    and instability is an accepted condition—for now. As the metaphor implies, cyber
    conflict ensnarls many actors, on varying levels, and in many ways. Finally, because
    the United States is so target rich, the establishment of order may require new
    partnerships between the public and its government, a rewriting of legal codes,
    and new mechanisms for mobilizing society.


    # Key Terms


