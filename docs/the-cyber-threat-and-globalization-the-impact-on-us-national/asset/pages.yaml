    legacy equipment as much as 50 years old, still in place and functioning.34


    Supervisory control and data acquisition (SCADA) systems, which monitor industrial
    control systems (ICSs), are OT systems with origins that go back to the 1960s.
    SCADA systems can be found in public and private sector operations from transportation
    and recycling to manufacturing and energy. Refineries, supermarkets, and households
