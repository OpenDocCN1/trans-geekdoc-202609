    bandwidth is diverted by the operators of an illicit ISP from a commercial Internet
    backbone network to the illicit network. The illicit ISP is then in a position
    to sell Internet access to interested parties at a significantly reduced cost
    compared to licit ISPs. The low cost is a result of the illegal ISP not paying
    the necessary access and regulatory fees, which are typically high in less-developed
    countries since there is a high demand for and low supply of available bandwidth.37
    Furthermore, telecommunications monopolies are typical in these regions, which
    is another factor in the high cost of legal ISPs. Thus, illegal ISPs appeal to
    people since they are able to get the same service offered by the legal ISP for
    a fraction of the cost.38


    Some have suggested that illegal ISPs are a good thing since in some cases, such
    as South Africa, they have helped to demonopolize the Internet industry by competing
    directly with the legal telecommunications providers.39 The problem for law enforcement
    occurs, for example, if one combines an illegal ISP with voice over Internet protocol
    (VoIP). The result is the negation of legal communication interception methods
    used by law enforcement.40 Thus, bridging the technological gaps in developing
    countries is a crucial element in assuring that the P3 and law enforcement efforts
    outlined by UNGA’s global cybersecurity strategy are not undermined.


    In 2004, the UNGA addressed the importance of protecting critical information
    infrastructures.41 Critical infrastructures are identified as “those used for,
    inter alia, the generation, transmission and distribution of energy, air and maritime
    transport, banking and financial services, e-commerce, water supply, food distribution
    and public health—and the critical information infrastructures that increasingly
    interconnect and affect their operations.”42 In this resolution, the role of the
    government in dealing with the critical information infrastructure is clearer
    than in previous resolutions. Eleven elements for the enhancement of the protection
    of critical information infrastructures are proposed in the annex of this resolution.


    First, it is urged that emergency warning networks should be established to identify
    and warn of cyber vulnerabilities, threats, and incidents. General awareness should
    be raised in order to facilitate understanding of the role that stakeholders play
    in critical infrastructure as well as in protecting that infrastructure. The resolution
    further encourages the formation of partnerships between private and public stakeholders
    to better prevent, investigate, and respond to threats on critical information
    infrastructures. Communications networks should be in place and regularly tested
    to assure their effective operation during a crisis situation. For their part,
    the resolution urges states to develop adequate domestic laws and policies that
    will allow for the investigation and prosecution of cybercrime, as well as the
    trained personnel who enable the investigation and prosecution of such misuses.
    Moreover, states are held responsible for identifying the perpetrators of an attack
    against critical information infrastructure and sharing this information with
    affected states. In this regard, appropriate international'
