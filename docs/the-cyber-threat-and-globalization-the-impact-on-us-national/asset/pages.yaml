    violent demonstrations in Tallinn and Moscow gave further weight to the argument
    that this was a synchronized strategy designed, implemented, and sanctioned by
    the Kremlin. While denying involvement, the Russian government made statements
    in praise and support of the online hackers.¹¹ Furthermore, Estonian officials
    insisted the attacks were most likely the result of a year’s worth of planning
