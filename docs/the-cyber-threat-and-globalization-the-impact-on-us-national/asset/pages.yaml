    # Retorsion and Countermeasures


    Even if committed to following the law when suffering cyber malfeasance that falls
    short of a use of force or armed attack, states are not condemned to inaction.
    There are three potential courses of action they might take.


    First, retorsion is an unfriendly but lawful response to an unfriendly, but not
    illegal, action by another state. As acts of retorsion are lawful, they may be
    punitive or anticipatory.63 For example, if a state is using an official social
    media account to spread negative information about another state, the second state
    could refuse to allow its Internet service providers to be used by the first state.


    A second option, countermeasures, takes it up a notch. If a state is a victim
    of unlawful activity, it has the right to engage in countermeasures for the purpose
    of ending the other state’s unlawful behavior. Countermeasures are actions that
    would be unlawful but for the fact that they are


    countermeasures. Countermeasures must be necessary and proportionate.64 Countermeasures
    in response to illegality perpetrated with cyber means are not limited to cyber
    activities, and, conversely, cyber countermeasures are available for kinetic offenses.


    As the proper purpose for countermeasures is ending illegality, if the offensive
    conduct has already ceased, countermeasures are not appropriate. Retaliatory activity
    does not qualify as countermeasures. Further, anticipatory countermeasures are
    not permitted. However, both of these situations may be complicated by a planned
    or ongoing campaign of illegality. If a state has taken steps that are an integral
    part of the illegal act, even if the act has yet to occur, early countermeasures
    may be permitted. Similarly, if a particular unlawful act has ceased but was part
    of a continuing campaign of illegal actions, countermeasures to end the campaign
    might be lawful.


    For example, a state might violate another state’s sovereignty by planned intrusions
    into its territorial seas. The victim state in this case might decide to deny
    service to the ships’ communications systems by overloading them with routine
    network traffic. Interfering with the ships’ systems would be unlawful but for
    the fact that it is an appropriate countermeasure.65


    Finally, a third legal framework option a state might use for a response is referred
    to as the plea of necessity. If an essential interest of a state is subject to
    a grave and imminent peril, a state may respond.66 Although the action taken would
    resemble a countermeasure (i.e., normally be unlawful), it would differ in that
    it would ordinarily be anticipatory.


