- pgno: 14
  md: '# Figure 1.1 Users with Access to the Internet


    ![](img/18cc7cb0fa00c7c6d22e23ef9d2bc649_14_0.png)


    As the number of people with access to the Internet rises, total Internet traffic
    is expected to more than double from the 2012 level by 2017.


    Source: U.S. Department of Homeland Security, 2014 Quadrennial Homeland Security
    Review.


    The World Wide Web is a planetary marvel. From 2007 to 2013, the number of Internet
    users doubled to about 2.27 billion. From 2011 to 2016, experts estimated that
    global network connections increased from 10.6 billion to 18.9 billion. The number
    of connected devices will be 31 billion in 2020, compared to only 2 billion in
    2011.” The main drivers of these trends are technologies referred to as Internet
    of Things (IoT) and Bring Your Own Device (BYOD).


    IoT is still in its infancy. It is the network of routinely used objects such
    as Fitbits, smart TVs, home security and thermostats, alarm systems, and health
    monitoring devices. They contain embedded technologies that communicate and sense
    or interact with their internal states or the external environment. BYOD refers
    to the policy of permitting employees to bring personally owned mobile devices
    (laptops, tablets, and smart phones) to their workplace and to use those devices
    to access privileged company information and applications. With the growing ubiquity
    of such machines and expansive usage, there are significant security concerns,
    which will be discussed later in greater detail.


    # The History of the Internet


    Steve Jobs once observed, “Creativity is just connecting things.” In 1968, the
    Advanced Research Projects Agency (ARPA), which later became the Defense Advanced
    Research Projects Agency (DARPA), began “connecting things” by working on what
    eventually would become the modern-day Internet. ARPA was founded as a result
    of the national trauma created by the Soviet Union in 1957 with the launch of
    Sputnik 1.18 To counter the USSR’s new position of'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'advantage, the agency’s reason for being was to identify key challenges in
    science and technology that would allow the United States to retake and maintain
    a lead in these fields.


    By the late 1960s (at the height of the Cold War and the “space race”), the use
    of computers was bourgeoning. The demand from researchers was beginning to outstrip
    availability. Therefore, the project’s main goal was to find a way to allow scientists
    from disparate locations to have reliable access to unused computer time. Dedicated
    connections were expensive and subject to disruption. A second project aim was
    to invent a communications network that was scalable, could sustain physical attacks,
    and was able to survive malfunctions occurring at other points along the system.
    The solution was a shared network of data links and computational resources.


    This linkage meant a changeover from traditional circuit-switched telephone networks
    to a revolutionary packet-switched network. A packet is a digital envelope of
    data. Outside the envelope is what is known as a header, which contains information
    about the network source, destination, and limited detail on the packet’s contents.
    Along the network are devices called interface message processors (IMPs), or packet-switch
    nodes, to facilitate connections—what we refer to today as “routers.” Electronic
    messages are disaggregated into bits of data at the origin point—contained and
    sent in the form of small packets that have routing information on packet headers.
    Routers along the network read the packet headers and relay the packets toward
    their destination. At the destination point, the data is re-assembled as packets
    arrive to form the original message. The first successful link ran between UCLA
    and Stanford in 1969, and lo, ARPANET was born.


    However, in order to achieve scale, a system must be able to accommodate many
    different networks with varying underlying technologies. In cyberspace, circuits
    that information travels can be physical (copper wiring, optical cable) or radiation
    based (microwave, WiFi). Therefore, a data packet system connecting numerous and
    assorted networks relies upon standardized communication protocols to assure operation
    and control. In 1973, researchers at Stanford and ARPA found a solution in a model
    called Transmission Control Protocol (TCP). The Transmission Control Protocol/Internet
    Protocol (TCP/IP) is the common set of protocols that govern the transmission
    of data between devices. Communication is disaggregated into independent layers.
    The critical information in the IP header allows the transport layer of the TCP/IP,
    or “protocol stack,” to operate across networks. The IP header is simply a string
    of numbers that routers read to direct packets toward their destinations and,
    hence, form connections. At the receiving end, the header carries information
    that also instructs the destination computer how to re-create the message from
    the incoming packet data. Once deployed, TCP/IP became the “vital lingua franca
    between previously incompatible computer networks.”19


    In addition, the model allows systemic integrity. A breakdown or interruption
    of transmission at any place along the network will not cause a system failure.
    The data packets are simply rerouted. Unless messages are encrypted or transmitted
    over virtual private networks (VPNs), information flows according'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'to this mode of transport. The system’s openness contributes to this resilience
    as well as to its vulnerability.20


    Shortly after the inception of ARPANET, the U.S. National Science Foundation (NSF)
    realized the potential impact this technology could have on university research
    throughout the nation. Unfortunately, to have access to ARPANET an institution
    had to have a research contract with the Department of Defense. In 1985, the NSF
    removed this restriction by creating NSFnet, which linked to ARPANET and connected
    existing supercomputing centers around the country. A TCP/IP “backbone” was later
    added to manage traffic between the different regional networks (see figure 1.2).
    The objective of the architecture was to create an “inter-net”—a “network of networks.”
    The new blueprint connected to DARPA’s own internet, which included the ARPANET.
    The result would offer users the ability to access remote computing resources
    from within their own local computing environment.21 As NSFnet became the successor
    system to ARPANET, it became an instantaneous success and quickly overloaded.
