- pgno: 260
  md: '# ISR and Cyberspace


    Maj. Robert Johnson, USAF; Capt. Daniel Votipka, USAF; TSgt. Danielle Dye, USAF;
    Maj. Trevor Stutting, USAF; Capt. Jamie Blummer, USAF; Ms. Tiffany Harbour, DAF;
    Capt. Laura LeFevre, USAF; and Capt. Thomas Shew, USAF


    # Introduction


    The Air Force conducts its core mission of global integrated intelligence, surveillance,
    and reconnaissance (ISR) in and through cyberspace. This new domain represents
    an ever-expanding source of intelligence data vital to the full range of joint
    military operations. At the same time, cyberspace represents both new avenues
    to apply force against adversaries and increasing vulnerabilities for them to
    do likewise. ISR is a critical enabler of the offensive and defensive operations
    the Air Force conducts in cyberspace. This chapter will explore ISR in cyberspace
    and those ISR actions that enable cyberspace operations.


    This definition provides only a limited description. A complete discussion of
    cyberspace and ISR must examine those surveillance and reconnaissance operations
    to collect intelligence in cyberspace, as well as those ISR activities that enable
    cyberspace operations.


    Consider cyberspace ISR as a three-legged stool. The three legs are exploit, attack,
    and defend. Cyberspace ISR activities exploit cyberspace to collect intelligence
    about adversaries from the information that transits and is stored on their digital
    networks. Cyberspace ISR activities also enable cyberspace attack on adversary
    computer networks as well as activities that allow us to defend our own networks.
    Underpinning these three legs is the foundation laid by cyberspace intelligence
    preparation of the operating environment (C-IPOE) that provides a thorough understanding
    of the cyber battlespace. The remainder of this chapter will describe in further
    detail these cyberspace ISR activities.


    # Defining ISR in Cyberspace


    Chairman of the Joint Chiefs of Staff Joint Publication 3-12 (R), Cyberspace Operations,
    defines cyberspace ISR as:


    > ISR activities in cyberspace conducted to gather intelligence that may be required
    to support future operations, including offensive cyber operations (OCO) or defensive
    cyber operations (DCO). These activities synchronize and integrate the planning
    and operation of cyberspace systems, in direct support of current and future operations.
    Cyberspace ISR focuses on tactical and operational intelligence and on mapping
    adversary cyberspace to support military planning.1


    There are a few foundational points that help inform the discussions that follow.
    First, intelligence collected from cyberspace informs the full range of joint
    operations, not only cyberspace operations. Second, the preponderance of cyberspace
    activities involves the collection of intelligence. Third, cyberspace operations
    are critically dependent upon ISR to characterize the operating environment, determine
    access points, develop avenues of attack, and identify threat vectors. Last, cyberspace
    operations rely on all intelligence disciplines, not just intelligence collected
    in cyberspace.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# # Cyberspace Intelligence Preparation of the Operating Environment


    A critical first step for any joint operation is defining and understanding the
    operating environment.2 This is no different for cyberspace operations. Cyberspace
    intelligence preparation of the operating environment characterizes adversary
    cyberspace by providing a detailed understanding of the cyber terrain through
    extensive network mapping utilizing all intelligence disciplines.


    # ## Network Mapping


    Cyberspace can be deconstructed into five layers—the identity, cyber-persona,
    logical, physical, and geographical layers—each with their own unique characteristics.3
    It is the objective of C-IPOE to understand each of these layers to enable collection
    or OCO/DCO. Many times the initial vector to map adversary networks begins with
    the identity and cyber-persona layers. The identity layer describes the person/group
    acting in cyberspace, and the cyber-persona layer describes the “digital representation
    of an individual or entity.”4 Characterizing the identity layer of cyberspace
    involves naming the actual people, state/nonstate groups, and their affiliations
    as well as describing their capabilities and patterns of behavior as it relates
    to the physical world. Mapping the cyber-persona layer includes tying these named
    person(s)/group(s) to their associated e-mail addresses, Internet protocol (IP)
    addresses, handheld devices, and/or computers, to name a few. Cyber-persona layer
    mapping also includes linking identities to signatures in nonmalicious or malicious
    code, detailing individuals’ search histories and noting websites where individuals
    visit or contribute.5


    The identity and persona layers tell us who is operating in cyberspace. The logical
    and physical layers tell us how they are operating in cyberspace. Protocols in
    the logical layer tell the digital information


    where and how to flow through a network architecture. The logical layer also describes
    abstract entities: “not tied to an individual, specific path, or node. A simple
    example is any website that is hosted on servers in multiple physical locations
    where all content can be accessed through a single uniform resource locator (URL).”6


    Analyzing the logical layer is similar to reading the postmarks on the outside
    of an envelope. Cyberspace ISR analysts investigate this layer by analyzing and
    unwrapping packets of information traversing the network and tracing the routes
    on which they flow in order to develop a comprehensive understanding of the network.
    Physical layer analysis complements this by determining the hardware through which
    this information flows. A logical network map can be developed to graphically
    represent this data, detailing information flow paths (links) and network devices
    used for routing and storing digital information (nodes).


    Mapping the physical layers and geographic layers of the network links the abstract
    portion of the cyberspace domain to its physical manifestation in the natural
    domains. The physical layer refers to actual network elements, that is, the infrastructure.
    This network infrastructure includes the links, wired links (cable), and wireless
    links (satellite ground stations and/or terrestrial relay towers) as well as the
    intermediate connectors and nodes, “routers, switches, servers and computers.”7
    The geographic layer represents the specific location of the elements of the network
    in the natural domains of land, sea, air, or space.8


    The order with which these five layers are presented in this chapter should not
    imply that mapping the cyberspace terrain necessarily proceeds sequentially or
    linearly to a finite point. Information collected in any one of these layers can
    provide a linkage to one layer to enable further mapping of another layer. This
    mapping process is an iterative, cross-feeding analytical process. Further,'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'cyberspace is constantly changing, often rapidly and erratically. Thus C-IPOE
    must be constantly refreshed. It is a continual activity of first establishing
    an adversary network baseline map and then continuously updating this network
    map through a process of identifying distinct, relevant changes to an adversary’s
    tactical and/ or strategic network state. Any network changes are characterized
    for the purpose of making the appropriate adjustments to friendly strategy and
    tactics to maintain access and freedom of movement and maneuver in adversary networks.9
    C-IPOE characterization efforts must be dynamic, using broad systematic tools,
    such as high-speed logical sensors and advanced automated analytical support systems.10
    With these sensors and systems, analysts are equipped to characterize the rapidly
    evolving cyberspace terrain.


    well as other metadata from open sources assist in detailing logical layer information
    as well as information useful in identifying and geolocating physical elements
    of such adversary networks. Pictures and video from open sources can show buildings
    or other distinct physical terrain landmarks that support geographic layer mapping.
    Ultimately, C-IPOE activities require a planning, collection, and analysis process
    integrated with all relevant intelligence disciplines to successfully synchronize
    and optimize ISR support for cyberspace.12 C-IPOE is a critical precursor to all
    other cyberspace operations, and it is often the most difficult and time consuming.
    It can take months and years of detailed investigative and analytic work.


    # Multi-Intelligence Support for C-IPOE


    C-IPOE is reliant on the full range of intelligence disciplines. Signals Intelligence
    (SIGINT) may identify a signal or communication in an area of interest vital for
    C-IPOE. For example, an intercept from voice communications may provide network
    login credentials needed to enable further cyberspace mapping. Geospatial Intelligence
    (GEOINT) can detail locations and types of various telecommunications cables,
    radio/cellular relay towers, satellite ground stations, and large data storage
    centers.11 Intelligence collection from human sources (HUMINT) such as debriefings
    (interrogations) and document exploitation can provide information relevant to
    C-IPOE, such as network administrator names and daily routines (identity layer);
    e-mail, phone numbers, and passwords (cyber-persona layer); and network design
    plans (logical and physical layers). Similarly, intelligence collection from open
    sources (OSINT) such as social media websites or other various websites can detail
    cyber-persona, logical, and/or physical layers. Website IP addresses as


    # ISR from Cyberspace


    Using the foundation laid by C-IPOE, network elements as well as access vectors
    can be identified to enable focused collection of intelligence data from cyberspace.
    In digital networks, this data exists in one of two states: “in motion,” transiting
    between two devices in the network, or “at rest,” stored on one of the devices
    in the network. Therefore, cyberspace data collection activities can be divided
    based on the state of the data. Passive collection activities target and collect
    data that transits the wired or wireless links between computers for analysis.
    Active collection, computer network exploitation, targets dormant data on individual
    computers and servers. This section will describe each type of collection in detail.


    # Passive Cyberspace Collection


    An analogy to HUMINT can be useful to better understand passive collection in
    cyberspace. During a HUMINT collection activity, an agent might go to a location
    where two targets are known to meet and listen in on their conversation. Doing
    likewise in cyberspace can be more'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'complicated. Eavesdropping on this conversation through passive collection
    as it transits in cyberspace on links between computers can be difficult due to
    the volume of data transiting. A conversation can easily be “buried” due to the
    link being saturated with messages back and forth between the multiple applications
    running in the background emanating from multiple computers sending and receiving
    information on the Internet. This situation would be akin to the HUMINT collector
    trying to hear that same conversation standing in a busy subway stop at rush hour.
    Additionally, with the use of modern encryption techniques, communicants often
    encode the message into a language only discernible by the sender and receiver
    who hold the key to decrypt the information. Passive collection can be relatively
    easy to execute with little OPSEC risk given it is hard to identify the listener
    in a crowd, but it is inherently limited in the data that can be collected based
    on what the targets are willing to communicate within earshot. This limitation
    requires the second type of collection: active collection, i.e., computer network
    exploitation (CNE). It is very common to see passively collected information used
    to inform subsequent active exploitation. Conversely, CNE operations typically
    gain the initial accesses on links as a precursor to passive collection operations.


    past all the security cameras by moving through all the spots not covered by the
    cameras’ view. However, whenever collection is enabled by vulnerabilities in the
    network, if discovered by the target, software can quickly be corrected, closing
    not only that network to future collection, but also in every other network using
    that software, once a fix is published.


    # The Product of Cyberspace Collection/Analysis: DNI


    # Active Cyberspace Collection: Computer Network Exploitation


    The data obtained through passive and active cyberspace collection, processed,
    and then analyzed becomes an analytical product then called digital network intelligence
    (DNI). The production of DNI to satisfy intelligence requirements is a SIGINT
    function conducted under Title 50, United States Code, by the National Security
    Agency/Central Security Service (NSA/CSS).14 DNI can also be produced by units
    under the command of a joint force commander when authorized by an EXORD or when
    delegated temporary SIGINT operational tasking authority by NSA/CSS.15 DNI may
    be used to focus further collection as well as used to satisfy strategic, operational,
    or tactical intelligence requirements to support operations in any domain. An
    example of a strategic intelligence requirement satisfied by DNI could be a product
    resulting from the exploitation of digital information describing an adversary
    nation’s political leadership’s intent to develop nuclear weapons. An operational
    example can be digital information collected from an adversary’s military command,
    control, communications, computers, and intelligence (C4I) systems that outlines
    impeding troop, weapon system, and/or munitions movements. Finally, a DNI product
    satisfying tactical intelligence requirements can include an increase in C4I system
    network traffic, as indicated from passive collection, indicating changes to enemy
    alert levels such as integrated air defense system activations. DNI production
    specifically for cyberspace operations describes cyberspace


    CNE describes both “enabling operations and intelligence collection capabilities
    to gather data from target computer systems.”13 CNE takes advantage of flaws in
    network infrastructure and/or individual computer systems to gain access and actively
    collect information stored “at rest” in the computer systems. Using the previous
    HUMINT example, this would be like an agent dressing like an employee and getting
    a fake office ID to get into a closed office space or sneaking in at night'
