    The technology is ubiquitous. Unfortunately, wide-area network SCADA systems often
    rely on tenuous communication links.35 Data is sent “in the clear,” or over open
    pathways that rely on the Internet and often require no authentication.36 This
    feature brings to focus another distinction between the two domains.


    By nature, IT and OT technologies have separate approaches to security and attitudes
    toward risk tolerance. An unplanned OT outage or failure is a crisis. It can result
    in a high-impact event with severe economic repercussions and possibly personal
    injury or loss of life. Even planned outages for upgrade are challenges to OT
    environments because of the apprehension linked with unwanted downtime. Upgrades
    can take months of advance planning, require suspension of operations, and sometimes
    result in declining revenues and harm to corporate reputation. Although preferable
    to a disaster event, these stoppages more immediately affect the OT unit’s bottom
    line than they do that of an IT unit, which regards such procedures as a cost
    of doing business. In contrast to OT, downtime to upgrade software, install firewalls,
    or run system audits in IT environments is acceptable and routine. Lost data can
    be restored or re created with minimal cost. Contrariwise, product and supply
    cannot. A lost transformer or downed production line is not the same as a failed
    server. Cloud computing and server clusters (also known as a virtual server farm,
    which is a collection of servers that can provide a network environment and backup
    capability) reduce the impact of system interruption for the IT group. There is
    no corresponding mitigating feature in the OT domain.


    Despite some parallel development owing to OT adaptation of IT-based technologies,
    these environments still basically function by different standards, using dissimilar
    infrastructures, unrelated processes, and managerial departments.37 However, IT/OT
    convergence may be an issue that can no longer be deferred. Pressures and calls
    for a more integrated and holistic approach are mounting. These pressures are
    regulatory as well as organizational. As we move on to smart power grids, smart
    manufacturing plants, smart distribution systems, and even the use of automated
    weapons systems, the encroaching connectivity of intelligent devices will force
    a more robust dependence on IT functions. These'
