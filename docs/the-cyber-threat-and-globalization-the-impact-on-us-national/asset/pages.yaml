    # # Overview of the Attack Matrix


    The Cyber Emergency Response Team (CERT) describes a cyber threat as an attempt
    by persons “[to gain] unauthorized access to a control system device and/or network
    using a data communications pathway. This access can be directed from within an
    organization by trusted users or from remote locations by unknown persons using
    the Internet. Threats to control systems can come from numerous sources, including
    hostile governments, terrorist groups, disgruntled employees, and malicious intruders.”76


    CERT (also known as CSIRT—Computer Security Incident Response Team) refers to
    groups of computer experts who handle computer security incidents. CERT’s inception
    originated with the early appearance of self-replicating computer worms. (The
    first “team” was formed in 1988 in reaction to the Morris Worm named after its
    author, Robert Tappan Morris, a Cornell graduate student.) Around the world, more
    than 250 organizations using the name CERT or CSIRT focus on cybersecurity threat
    issues and response. US CERT acts independently of these organizations yet maintains
    relationships for information-sharing and coordination purposes (see table 1.1).


    US-CERT works with its partners to control the abuse and misuse of technology
    across cyberspace. Those partners include private sector cybersecurity vendors,
    academia, federal agencies, Information Sharing and Analysis Centers (ISACs),
    state and local governments, and domestic and international organizations. Its
    network of participating individuals and organizations represents how deep and
    expansile the threat is.


    Nation-states are far less numerous than private actors. Although their capacity
    and strategic purpose exceed most others, they are much less active compared to
    nonstate actors. Verizon Enterprise Solutions discovered that of more than six
    hundred breaches that occurred in twenty-seven countries in 2012, more than 75
    percent could be sourced to someone in an identifiable country. Of those attacks,
    only 19 percent of data breaches were attributed to state-affiliated'
