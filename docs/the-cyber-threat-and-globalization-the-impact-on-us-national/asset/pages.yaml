- pgno: 144
  md: 'appears to collect intelligence related to Russian political goals and to propagate
    future cyberattacks.⁸⁸ In addition to the DNC and the Democratic Congressional
    Campaign Committee, NATO, media outlets, the military, and security organizations,
    European governments, including Georgia and Ukraine, have also been targets.⁸⁹


    Often mentioned as a companion exploit, APT29 is believed to be the product of
    the Federal Security Service (FSB — Федеральная служба безопасности). Cozy Bear,
    as it is sometimes known, is a more recent exploit. It is often affiliated and
    even referred to interchangeably with another hacker group, dubbed Cozy Duke,
    or simply Dukes.⁹⁰ Its most notable attack occurred in 2014. That year the U.S.
    Department of State underwent a hack on one of its unclassified computer systems.
    At the time, officials and cyber experts described the system as being “owned”
    by its attackers.⁹¹ Other targets include the White House and various U.S. government
    agencies. Although APT29’s chief focus is the United States, there is evidence
    that government and commercial entities in Chechnya, Germany, South Korea, and
    Uzbekistan are also past victims.⁹² Norway is a more recent prey. Officials in
    February 2017 publicly identified Russian sources as the perpetrator of attacks
    on the Norwegian Foreign Ministry, the intelligence service, the national radiation
    protection agency, the Labor Party, and even a school. Although the purpose of
    the attacks remains unclear, government representatives suggest that they are
    in reprisal for Norway’s support of the European Union’s stance on economic sanctions
    against Russia and to punish Norway for allowing the deployment of three hundred
    U.S. soldiers on its territory.⁹³


    Both APTs concentrate on government agencies, think tanks, universities, and corporations
    worldwide. Their methods are a mix of spearfishing campaigns and watering hole
    tactics. In 2015, APT29 delivered malware to the Democratic Party’s computer systems
    via e mail attachments. Once activated, the attackers were able to establish persistence,
    escalate privileges, specify directory accounts, and exfiltrate e-mail.⁹⁴ A year
    later, APT28 penetrated the Democratic Party again, this time using spearfishing
    and leveraging web links to malicious sites. Targeted individuals changed their
    passwords through a fake webmail domain hosted on an APT28 proxy server infrastructure,
    which permitted Fancy Bear to gain access and steal content.⁹⁵ The U.S. intelligence
    community eventually determined, and announced, that Russian military intelligence
    (under the cover name of Guccifer 2.0 and through DCLeaks.com) leaked the information
    publicly and in exclusives to media outlets. WikiLeaks ultimately posted the victim
    data online.⁹⁶


    Sandworm is another Russian state-sponsored APT group similar to APT28 and APT29
    in methodology and objective. Political opponents of the Russian Federation are
    prime targets. Commenters note that the group most likely participated in the
    invasion of Georgia. In the past, Sandworm’s attentions concentrated on NATO,
    the European Union, the European telecommunications sector, European energy companies,
    Poland, and the Ukrainian government.⁹⁷ In 2016, cyber experts named Sandworm
    responsible for attacks on the Ukrainian news media and electrical power industry.⁹⁸
    A favorite malware of Sandworm is BlackEnergy. Originally designed for use in
    DDoS attacks and creating botnets,'
