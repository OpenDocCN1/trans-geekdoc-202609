  md: '# About the Authors


    Jack A. Jarmon is the author of _The New Era in U.S. National Security_ (Rowman
    & Littlefield, 2014) and co-author of _An Introduction to Homeland Security and
    Emergency Management_ (2015). He has taught international relations courses at
    the University of Pennsylvania, the John C. Whitehead School of Diplomacy and
    International Relations at Seton Hall University, and Rutgers University, where
    he was also associate director of the Command, Control and Interoperability Center
    for Advanced Data Analysis — a Center of Excellence of the Department of Homeland
    Security (Science and Technology Division). He was USAID technical advisor for
    the Russian government in the mid-1990s. During its economic transition period,
    he worked for the Russian Privatization Committee and with such organizations
    as the U.S. Russia Investment Fund, the European Bank of Reconstruction and Development,
    and various money center banks. His private sector career includes global consultant
    firms, technology companies, and financial institutions. He was a manager with
    Arthur Andersen in Moscow and director of strategic alliances at Nortel Networks,
    Brampton, Ontario. He studied Soviet and Russian affairs at Fordham University
    and the Harriman Institute at Columbia University. He is fluent in Russian and
    holds a doctorate degree in global affairs from Rutgers University.


    Pano Yannakogeorgos is the founding dean of the Air Force Cyber College. His expertise
    includes the intersection of cyber power, national security, and military operations;
    international cyber policy; cyber arms control; global cyber norms; and Eastern
    Mediterranean security. He was lead researcher on a Chief of Staff of the Air
    Force-directed study published as “The Human Side of Cyber Conflict.” In addition,
    he has edited several books and written monographs, articles, and chapters including
    “Keep Cyber War Narrow” (_National Interest_); “Chinese Hacking Only Part of the
    Story” (CNN Online); “Internet Governance and National Security” (_Strategic Studies
    Quarterly_); “Challenges in Monitoring Cyber Arms Control” (_Journal of Information
    Warfare and Terrorism_); “Pitfalls of the Private-Public Partnership Model,” in
    _Crime and Terror Risk: Studies in Criminology and Criminal Justice_; and “Cyberspace:
    The New Frontier and the Same Old Multilateralism,” in _Global Norms: American
    Sponsorship and the Emerging Pattern of World Politics_. He has also published
    in _The Atlantic_, _The National Interest_, CNN Online, and _The Diplomat_. Prior
    to joining AFRI, Dr. Yannakogeorgos was a member of the faculty at Rutgers University,
    Division of Global Affairs, and he has served as an advisor within the United
    Nations Security Council on issues related to nuclear nonproliferation, the Middle
    East (including Iran), Al Qaeda, and Internet misuse. He holds a PhD and MS in
    global affairs from Rutgers University and an ALB in philosophy from Harvard University.


