  md: '# ## Introduction


    Cyber capabilities have opened an entirely new area of warfare. It has been called
    a revolution in military affairs—evolutionary technological development, and associated
    tactical and strategic change, altering the character of war.¹


    Many of the same law-of-war issues exist in cyber operations as in traditional
    military operations. Whether the law of war applies to a particular cyber activity
    may depend on whether a state of armed conflict exists between the actors. This
    may be more challenging in cyber, as some basic questions remain unanswered. Perhaps
    most important, it is not settled when a cyber operation will be considered to
    constitute a use of force or an armed attack. Despite the uncertainty in policy,
    if injury, death, damage, or destruction results from a military cyber activity,
    cyber law practitioners should assume the activity is likely to be considered
    a use of force under international law.²


    Even given the limitations noted above, as a matter of policy, the United States
    complies with the law of armed conflict (LOAC) in all military operations.³ The
    fundamental issues arising in cyber operations are no different than those relevant
    to kinetic military operations. The law of cyber warfare has at its core the same
    basic principles of military necessity, avoidance of unnecessary suffering (humanity),
    proportionality, and distinction. One of the greatest challenges in cyber warfare
    is applying these time-honored principles to actual cyber operations. These issues
    are set in detail below.


    Another challenge is the way cyber warfare freely mixes with aspects of everyday
    life. Affecting cyber systems can have negative effects on utility systems (such
    as electricity and water), financial systems (such as banking and paying by credit


    card), and communications (such as telephone systems and social media networks).
    Complicating the matter further, cyber warfare techniques are often not very different
    from the practices of cyber criminals or spies. Because there is significant overlap
    and different legal regimes apply to the different areas, cyber activities require
    careful scrutiny from the appropriate lawyers.


    The chapter first addresses cyber-crime, followed by a discussion of the law applicable
    to cyber conflict. It discusses both the resort to armed conflict (jus ad bellum)
    and the law that applies during armed conflict (jus in bello), focusing on issues
    of special concern for cyber law practitioners. Next, the chapter looks at espionage.
    It finishes with a discussion of U.S. policy in the area.


    # ## Cybercrime


    # ### U.S. Domestic Law


    Generally, computer code is considered a form of speech and is protected under
    the First Amendment. That means encryption technology and cyber “weaponry” both
    at least potentially enjoy constitutional protection.⁴ Some specific elements
    of computer-related U.S. laws are set out below.


    In 1984 Congress passed the Computer Fraud and Abuse Act (CFAA), the first U.S.
    domestic cybercrime statute. This statute prohibited unauthorized access to defense
    and financial computer systems in an era when the nation was just starting to
    awaken to the possibilities of cybercrime.⁵ Since then the number and scope of
    U.S. cybercrime statutes have broadened in response to the rapid expansion of
    cyber threats, creating a web of prohibitions and penalties designed to criminalize
    virtually every unauthorized use of a computer network or system.'
