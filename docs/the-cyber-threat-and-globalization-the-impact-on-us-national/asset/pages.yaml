- pgno: 173
  md: 'Should significant usage of such shadow Internets occur, it could become very
    challenging for counterterrorist operators to target the radicalization networks
    that now operate in dark corners of the open Internet. The Internet will thus
    be open to masses of new users who may not have previously entered the space because
    of the English-language barrier. This presents a significant human capital challenge
    as the cultural and linguistic obstacles facing the counterterrorism community
    today will only intensify. Thus, even finding alternative propaganda to counter
    or reverse the radicalization process will become more challenging.


    # Planning, Command, Control, and Communications


    The use of information technology in an actual terrorist operation differs from
    its use to promote ideas and drive otherwise neutral parties into action. Today,
    terrorists have demonstrated that in all terrorist operations, there is some cyber
    element. This may range from the use of encryption technology to protect communications
    in the preparatory phases of an attack to the actual command, control, and communications
    during an operation.


    # Cyber Technique: Secret Preparatory Communications


    Recall that voice over IP is a technology used to make telephone calls either
    to another computer using a VoIP application or to a traditional phone line.21
    Although counterterrorism investigators can conduct surveillance on calls that
    are placed from VoIP services to traditional phone services by monitoring a suspected
    telephone line, a computer-to-computer VoIP communication can be encrypted using
    features embedded in VoIP software such as Skype, Viber, or Microsoft’s Instant
    Messenger. Thus, if law enforcement personnel intercept the data stream containing
