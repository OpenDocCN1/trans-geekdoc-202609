    # Cyber Target: Industrial Control Systems


    Industrial control systems (ICSs) are different from commercial ICT applications
    in business or social environments. ICSs are different because they use technologies
    that are largely different in organization and complexity from the technology
    underpinning the Internet. They are designed to automate complex physical processes
    on which industry, utilities, transportation management, building controls, automobiles,
    and so forth rely to function. By their nature, ICSs were not designed with security
    in mind.27 Should ICS processes fail, physical events will stop functioning, leading
    to damage to equipment, physical destruction, and possibly loss of life.


    Unlike Internet service and content providers, the focus of ICSs is on reliability
    and safety. Modern societies are dependent on their proper functioning. ICSs are
    comprised of distributed remote access points, which allow users to remotely connect
    to infrastructure connected on a particular ICS network. The systems’ direct or
    indirect connections to the Internet allow for the remote monitoring of industrial
    and critical infrastructure.28 Nations and industries rely on these computer networks
    to efficiently maintain the machinery on which a country depends. Thus, ICS is
    itself a critical system that allows countries to function.29 Therefore, malicious
    software designed to cause harm to these systems poses significant threats to
    human and national security. Currently, terrorists have not demonstrated the necessary
    capabilities to conduct the vulnerability research and design the tools needed
    to cause effects in these highly complex systems.


    The lack of capability should not be reassuring, however. Many ICSs have hardware
    configurations that are cyber vulnerable and cannot be patched or fixed. For example,
    the threat to the U.S. power grid is very tangible and has been for a very long
    time due to the Aurora vulnerability. During a DHS exercise, hackers were tasked
    with hacking into the information system of a power generator. Succeeding in gaining
    remote access to the generator’s SCADA control system, the hackers were able to
    physically destroy the generator. The Aurora vulnerability, as this exploit is
    called, lends credence to the suggestion that the manipulation of computer code
    can be just as effective in destroying critical infrastructure as a missile would.
    Since utility companies now use SCADA to remotely monitor and access controls
    for their services, and because SCADA is a ubiquitous technology, U.S. utilities
    are just as vulnerable to these sorts of attacks. Indeed, several incidents have
    already occurred in which destruction of the physical elements that an ICS controlled
    occurred because of poor system design. One such example is the 2009 Sayano Shushenskaya
    hydroelectric dam explosion due to a computer misconfiguration that resulted in
    the destruction'
