    policies.¹² Well before the statue became a public issue, Estonian authorities
    believe both the protests and the cyberattacks occurred through government initiative
    and with the assistance of accomplices using Russian-language forums to help prepare
    and coordinate the plot. The Estonian officials were aware of the chatter and
    reportedly even had plans to issue a notice regarding the approaching cyberstrike
    several days before the event actually took place. The monitoring of e-mails,
    chat rooms, and Internet traffic provided evidence, but, under pressure from the
    European Union, officials withheld the news release.¹³ At the time, a meeting
    between Angela Merkel and Vladimir Putin was in preparation, and the backdrop
    of confrontational news was judged to be imprudent and would set an improper tone
    for the summit.


    As events unfolded, the reaction by the West and NATO was weak and delayed. The
    electronic offensive by Russia raised alarms and cut at the core of the NATO alliance.
    Cries of concern about issues of collective self-defense rose to the surface and
    almost as quickly became mute because of a lack of definitions, precedent, a framework
    for resolution, and any clear policy guidance on an appropriate response.¹⁴ Despite
    the evidence of a coordinated attack and Russian involvement, NATO offered no
    retaliatory response. In the absence of any physical damage or actual injury to
    Estonian citizens, NATO determined that the DDoS attacks did not constitute an
    act of war. A counteroffensive cyberattack would have been a violation of international
    norms and Russia’s sovereignty. The action would have raised tensions, particularly
