    Cybercrime also impacts economies by redistributing assets away from core business
    activities by forcing enterprises to reallocate funds to security. In this way
    cybercrime shifts employment toward jobs of lesser value. Opportunity costs also
    occur when enterprise budgets divert funds away from research and development
    or pursue other lines of business in order to earn and protect shorter term profits.
    The result is a slower rate of innovation and lesser returns on investment.73
    Stolen intellectual property can also completely destroy companies and ruin careers.
    Nortel Networks was the victim of cybercrimes for years. The firm once was a global
