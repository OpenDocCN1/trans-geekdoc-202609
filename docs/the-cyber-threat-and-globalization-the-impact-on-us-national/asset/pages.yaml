- pgno: 52
  md: '# # Attackers, Facilitators, Defenders, and Targets


    Responding to any cyber incident requires the ability to answer the following
    questions within acceptable levels in order to select appropriate responses: Who
    is the threat agent? What motivated the agent and what were his objectives? What
    methods and techniques were used? What were the causes of the effect, which services
    were affected, and what impact did the event have?³³


    **Attack agents** can be states, substate actors such as Chinese privateer hackers
    or Romanian computer criminals, regional/global organizations such as the Russian
    Business Network (believed to be sponsored and supported by the Russian government),
    and ad hoc networks such as LulzSec or Anonymous. There are also malicious individuals,
    such as an unreformed Kevin Mitnick (who served five years in prison for various
    computer related crimes and now runs a cybersecurity firm) and the proverbial
    and ever-threatening insider.


    While all attack agents within information systems pose a threat, not all attack
    agents are likely to produce an effect in cyberspace that would pose a threat
    to national security. An advanced-level attack agent who could mount a complex
    attack with effects of national significance while taking advantage of Internet
    ambiguity to stall attribution of the event would require the following capabilities:
    (1) expert-level programming and cryptographic skills, (2) detailed knowledge
    of industrial control systems, (3) mastery of multiple open and closed operating
    systems, and (4) detailed knowledge of telecommunications and legal regimes.


    The motivating factors for an attack are also important when gauging the intentions
    of the attack agent. Identity theft, espionage, zombie propagation, extortion,
    sabotage, and widespread destruction are common motives. The first four of these
    often indicate economic incentives, where the perpetrator of an attack judges
    that an investment of time and other resources would bring about a payoff. The
    goals and objectives of an attack include the corruption, fabrication, destruction,
    disclosure, or discovery of information. System subversion or disruption can be
    additional goals. The methods by which cyber events occur are through system or
    protocol compromise, resource exhaustion, hardware failure, or software crashes.
    The techniques used to achieve these objectives include the targeted exploitation
    of a system, social, or protocol vulnerability. The overload of network or system
    resources and the autonomous self-propagation of malware are other techniques
    used. A cyber incident is caused by all of the preceding variables.


    Attack incidents range from organized cyberattacks and zombie propagation to uncontrolled
    malicious code. Cyber events of national significance are those that result in
    extensive damage to critical infrastructure or key assets.


    Targets and effects include human targets for social engineering campaigns that
    aim to exploit trust relationships among computer users. The 2011 attack on RSA
    Security (a cybersecurity and computer firm founded by the creators of the RSA
    algorithm) is only one example in which employees interacted with a malicious
    e-mail message that gave the attack agents access to RSA’s networks. Other targets
    include critical infrastructures and financial networks. A cyber-related event
    will produce effects that depend on the perpetrator’s motivation for'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'launching an attack. Cyber events can be either discrete and finite events,
    or they can be advanced and persistent. An example of a discrete and finite event
    is an operation aiming to degrade the operation of critical infrastructure by
    attacking a SCADA. Advanced persistent threats (APTs) are those linked with espionage
    and criminal activities that aim to gain as much information about the functioning
    of a system as possible and can remain active over time.


    # Malware


    The harmful software we refer to as malware proliferates at an exponential rate
    around the world. Criminals, state actors, researchers, and hobbyists create malware
    with malicious intent, for amusement, and sometimes by mistake. At present, nearly
    one million new releases of malware occur every day. Their functions and targets
    vary. However, attackers narrow their use to any of three tracks: stealing data,
    misuse of credentials, and hijacking resources.³⁴ At risk are a target’s competitiveness
    in war or commerce, the ability to protect civilian or national assets, and the
    capability to maintain communication with operational branches or the public.
    As the attack matrix expands and becomes denser, the trend in malicious code is
    a more silent and deeper design. These upgrades allow attackers to more regularly
    and remotely control the target’s computer in order to launch massive attacks
    or “exfiltrate” (infiltration and extraction of data) sensitive information from
    networks.³⁵


    Although malware is a broad term, there are nuances. Malicious code is often considered
    a separate threat. Malicious code is technically not software but refers to scripts
    or code designed to create vulnerabilities in computer systems and on websites.
    These implants exploit unanticipated sequences of multiple, often noncontiguous
    faults (referred to as byzantine faults) throughout the software.³⁶ “Infection”
    may be the result of various methods or pathways. The source might be a USB drive,
    an e-mail, a link to a malicious online site, or a message in a social network.
    Once compromised, malware (malicious software) can be uploaded through the entry
    points. An implanted malicious code can beacon out to a server for commands from
    inside the system. Shell code is the term used to refer to the payload in the
    exploitation of software. They may also function autonomously by lying dormant
    until a designated time or a particular system event occurs before activating.


    In a world of expanding connections and momentous swelling demand, commercial
    software becomes more complicated. This transformation not only makes software
    products more sophisticated and complex, but it also increases the chances of
    inherent software flaws and vulnerabilities to the hardware. Although only a small
    fraction of flaws may become actual malware entry points,³⁷ the spread and stretch
    of software vulnerabilities in the application layer of computer systems is still
    an enormous challenge for cybersecurity. Problematic is not only the way we address
    the problem but also how we even detect and measure it. For benchmarking purposes,
    a 2005 report by the U.S. National Institute of Standards and Technology estimated
    that there were twenty flaws for every line of code (LOC).³⁸ Considering that
    the Microsoft 2000 operating system'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'contains thirty-five million lines, it is easy to understand the level of vulnerability
    and fear potential for exploit. However, the flaw per LOC, or defect density,
    is hard to estimate. More recent evaluations have placed the number below one
    flaw per LOC.39


    Yet approximations are elusive despite the progress made to limit defects and
    improve software reliability. This is because of the changing nature of the threats
    and the targets. Also, as system administrators reconfigure software to establish
    different permissions, misconfigurations create a logic gap between design specification
    and the actual code.40 Thus, vulnerabilities result from the modified configuration
    of the software or its execution environment.41 As Martin Libicki explains,


    > Statistics on the inevitability of so many flaws per thousand lines of code
    suggest that vulnerabilities are nearly infinite (because they may arise through
    an indefinite combination of bugs). ... Between what design specifications say
    a system will do and what the code says it will do lie potential vulnerabilities.42


    Below is a brief list of various categories of malware.


    # Malware Categories


    **Computer viruses** are the most common form of system infection. They are usually
    a contagious program or malicious code that attaches itself to another piece of
    software and then reproduces itself when that software is run. Most often this
    is spread by sharing software or files between computers. Computer viruses earned
    their name due to their ability to “infect” multiple files on a computer. They
    spread to other machines when infected files are sent via e-mail or when carried
    by users on physical media, such as USB drives.


    **Bacteria** do not carry malicious code. Bacteria replicate and damage device
    storage reserves by overloading disks and memory capacity. Commonly, bacteria
    cause denial-of-service attacks (an attempt to make a machine or network resource
    unavailable to those attempting to reach it) by consuming large volumes of system
    resources.


    **Worms** are a program that replicates itself and destroys data and files on
    a computer. Worms can “eat” the system operating files and data files until the
    drive is empty. Olympic Games (Stuxnet) is an example. Unlike viruses, worms are
    stand-alone programs. They do not require human help in order to spread and infect:
    they infect once and then use computer networks to spread to other machines—without
    the help of users. During transmission, they may also spawn additional malware.
    By exploiting network vulnerabilities—such as weaknesses in e-mail programs—worms
    can send out thousands of copies of themselves in the hope of infecting new systems,
    where the process begins again. Worms simply “eat” system resources, thus reducing
    performance. Most now contain malicious “payloads” designed to steal or delete
    files.


    **Denial-of-service attacks/distributed denial-of-service attacks** disable a
    computer system by taking up a shared resource, leaving none of the resource available
    for legitimate users. A DDoS (distributed denial-of-service) attack is a variant
    of a denial-of-service attack that uses a coordinated attack from a'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'distributed system of computers, such as a botnet (see below), rather than
    a single source.


    **Adware** is the least dangerous and most lucrative malware. Adware displays
    ads on your computer. One of the most common online nuisances is adware. The programs
    automatically deliver advertisements to host computers. Familiar types of adware
    include pop-up ads on web pages and in program advertising that often accompanies
    “free” software. While some adware is relatively harm less, other variants use
    tracking tools to glean information about your location or browser history and
    serve up targeted ads to your screen. They also have the capability to disable
    antivirus software.


    **Spyware** is software that can detect what you are doing at your computer. It
    tracks your Internet activities in order to send back adware, which collects data
    such as keystrokes, browsing habits, and even login information. Your information
    is forwarded to third parties, usually cybercriminals. It may also mod- ify specific
    security settings on your computer or obstruct network connections. Legitimate
    companies use forms of spyware to track consumer behavior across multiple devices.
    Although it does so without user consent, it is legal.


    **Botnets** (short for “robot networks”) are an array of computers that run applications
    that spy on and disable networks. They involve programs (bots) designed to automatically
    carry out specific operations. Although they may be use- ful for many legitimate
    purposes, they also are often repurposed as a type of mal- ware. Bot programs
    can execute specific commands without the user’s approval or knowledge to steal
    sensitive data, to spy on the victim’s activities, to distribu- te spam automatically,
    or to launch devastating DDoS attacks on computer net- works. When hackers infect
    multiple computers with the same bot, they create a “botnet,” which is then used
    to remotely manage compromised computers.


    **Rootkits** corrupt an operating system by allowing the installation of hidden
    files and processes that enable remote access or control of a computer by a third
    party. Rootkits go unnoticed and functionally hide their presence. They inter-
    cept data from terminals, keyboards, and network connections. Identity infor-
    mation from a computer can be compromised without detection, and therefore rootkits
    are the hardest of all malware to uncover. Because it activates before the infected
    system boots, its stealth features make it not only the most difficult to detect
    but also the most difficult to remove. Manual monitoring for anomalies and patching
    operating systems and software to eliminate potential infection routes is the
    most effective detection method. Despite their threat as a virulent form of malware,
    IT professionals also find rootkits a useful tool in trouble- shooting for network
    issues.


    **Trojan horses** are malicious programs that mask their true function by appearing
    legitimate or useful. Trojans carry out malicious activities without the knowledge
    or consent of the victim. Their purpose is to grant unautho- rized access for
    hackers into systems for either stealing data or to inflict damage. Trojans can
    access a victim’s financial information, take command of a compu- ter’s system
    resources, and in larger systems conduct a denial-of-service attack.


    **Flaws** are defects in software code. They are not a type of malware but rather
    programming errors. As mentioned above, they provide pathways for attackers to'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'infect machines with malware. While better security and quality control by
    developers helps eliminate software defects, also critical is the continual application
    of software patches and updates that address specific flaws as they become known.


    Logic bombs are similar to software defects in that they are embedded code. Logic
    bombs activate upon a specific time and date or may be triggered by an event.
    They can be spread or be spawned by a Trojan horse. Once embedded into a system,
    they damage circuitry or cripple operations at critical points or times.


    Backdoors are much the same as Trojans or worms, except that they open a “backdoor”
    into a computer, providing a network connection for hackers or other malware to
    enter or for sending viruses or spam.


    Keyloggers record keystrokes in order to gather login names, passwords, and other
    sensitive information. The information transmits to the source of the keylogging
    program. These programs are also used legitimately by corporations and suspicious
    parents to acquire computer usage information.


    Browser hijackers redirect your normal search activity by altering browser settings.
    Users find themselves on websites in which they have no interest or any intention
    of visiting. As users are forcibly made to access websites, developers capture
    your surfing interests. This is particularly precarious for users who bank or
    shop online. Browser hijacker programs may also contain spyware and keylogger
    programs.


    Ransomware is a malware variant that can encrypt sensitive data such as personal
    documents or photos and demands a ransom for their release. Unless payment is
    made, cybercriminals threaten to delete the data. Some ransomware will deny access
    to the computer. Victims may have a message appear on their screens claiming that
    the action is on behalf of a legitimate law enforcement agency such as the FBI.
    It suggests that the user has been caught doing something illegal and locks out
    the computer. In return for resolving the situation, the hackers demand payment.
    There are two types of ransomware. The locker type blocks access to the infected
    device but does not destroy files. The second is crypto-ransomware, which encrypts
    files on computers and mobile devices. The program scrambles the contents and
    requires a decryption key to restore normal usage.


    According to the cybersecurity firm Symantec, ransomware attacks are reaching
    a new level of sophistication and expertise.43 Furthermore, the trend indicates
    a continuous increase of attacks on organizations rather than consumers, where
    attackers deploy the kinds of tactics seen in APTs (advanced persistent threat).
    As organizations become more frequent targets, ICSs and SCADA software may be
    at risk from future ransomware attacks. A crypto ransomware infection at a critical
    infrastructure facility could have a devastating outcome.


    # Cryptocurrencies


    The rise of cryptocurrencies, also referred to as virtual currencies, has facilitated
    trafficking in ransomware. Cybercriminals require a transfer payment system that
    is untraceable, accessible, and convertible. Because there is no single entity
    governing the oversight and verification of transactions, cryptocurrencies such'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Box 2.2 Cryptocurrencies


    Cryptocurrencies are digital assets and a medium of exchange that uses cryptology
    to secure financial transactions. Cryptocurrency exchanges are collectives where
    users can conduct business in these digital units of account, as well as exchange
    them for traditional currencies. Because they exist outside the traditional banking
    system, participants in cryptocurrency markets benefit from minimal transaction
    fees and faster transaction time.


    Mechanics—the transfers are peer to peer and employ public and private keys. The
    recipient provides their currency address to the sender, who authorizes the transaction
    with their private key. Users'' addresses and private keys are stored in corresponding
    wallets to facilitate verification and maintain secrecy. Records are maintained
    on a public ledger, known as a "blockchain," which contains address, transaction
    date, time, and amount information. The blockchain is essentially a distributed
    database of shared data spread geographically across multiple sites, institutions,
    and countries. Because transactions do not require the disclosure of identities,
    traders enjoy some degree of anonymity. Some virtual currencies (VCs) such as
    Bitcoin are semi-anonymous, whereas other cryptocurrencies have encryption software
    that provides additional anonymity and further assurance to those seeking


    to keep their identities and transactions secret. Although the threat from hacking
    is limited, a system crash can be disastrous if there is no central repository.


    Macro issues—since these public systems are free from government control, seizure,
    and regulatory constraints, they are also free from the influences of monetary
    policy or fiscal policy. Because there is no central government to impose monetization,
    inflationary disruptions are not an investment risk. There is often a limit on
    the amount of currency that will be in circulation, and therefore, for this reason,
    cryptocurrency exchanges are similar to the precious metal markets and susceptible
    to built-in market risk.


    Since 2009 (when Bitcoin first appeared) there are now thousands of other cryptocurrencies
    in circulation. Often referred to as altcoins, these digital currencies have user
    benefits and disadvantages. As mentioned above, the transfer of funds is faster
    and less expensive. Users avoid fees charged by banks and other financial institutions
    as well as whatever advantages they derive from anonymity. Although the currencies
    are not subject to valuation swings due to monetary and fiscal policies, they
    are subject to the laws of supply and demand. Therefore, prices between currencies,
    whether digital or fiat (national currencies), can fluctuate markedly.


    as Bitcoin, Litecoin, Quarkcoin, etc., offer an allure to ransomware attackers.
    Bitcoin is the current most popular cryptocurrency and, according to the RAND
    Corporation, ransomware is among the most common criminal uses of these currency
    systems."4 Meanwhile, exchanges and marketplaces are becoming more common on the
    Internet, as are exchange services and buy-and-sell websites. Many banks and other
    financial institutions have business relationships with legitimate companies that
    exchange these virtual currencies into government-issued currencies. Therefore,
    due to this interaction, virtual currencies are part of'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'the real economy:45 As their usage surged, many consumers discovered the benefits
    of the new payment system. At the same time, these math-based, digital currencies
    also created challenges for law enforcement and regulatory agencies. The anonymity
    offered by many virtual currency networks poses obvious difficulties for law enforcement
    and counterterrorism efforts. Tax evasion, money laundering, terrorist financing,
    and the illegal trafficking of drugs, weapons, and other banned goods and services
    favor transactions that conceal identities. Consequently, agencies as diverse
    as the FBI, the IRS, USAID, the Drug Enforcement Administration, the Treasury
    Department, the Department of Homeland Security, the Department of Justice, the
    Financial Crimes Enforcement Network (FinCEN), the Security and Exchange Commission,
    and the Prudential banking regulators (FDIC, Federal Reserve, National Credit
    Union Administration, and Office of the Comptroller of the Currency) all work
    and collaborate to address the criminal potential and use of these currency collectives.


    # # Advanced Persistent Threat (APT)


    The U.S. Air Force coined the term advanced persistent threat in 2006. As mentioned
    earlier, APT originally referred to national security threats, specifically those
    from China. Until recently, most experts believed that only about 5 percent of
    the world''s sovereign states have the technical capacity and likely intent for
    serious cyberattacks against the United States. It is not only traditional rivals
    with which the United States has concerns. Allies, as well, constitute the growing
    cyber threat vector. According to the National Intelligence Estimate of January
    2013, Israel and France are among the most aggressive in cyber espionage. Nonetheless,
    APT attacks from these countries against the United States may “pale in comparison
    to China’s effort” and are mostly economically motivated.46 The electronic intrusions
    our society undergoes are serious issues and call attention to the nature of the
    competition, which reveals the overlap and clash of global politics and economics.


    While the United States may be the most targeted country for cyberattacks, it
    is often accused of being the most active in conducting such attacks. In the application
    and art of cyberwarfare, many countries regard the United States as the primary
    menace. Former RAND analyst and lecturer at the University of California, Berkeley,
    Bruce Newsome cites the Office of the National Counter Intelligence Executive
    admitting that, “In 2010, the German government assessed the US and France as
    Germany’s primary economic espionage threats among friends.” In 2011, France’s
    Central Directorate for Domestic Intelligence described the US and China as the
    leading ‘hackers’ of French businesses.”47 The United States has also been accused
    of cyberattacks on an array of foreign countries that span from Russia, China,
    North Korea, Iran, and Syria to Hungary, Canada, and Australia.


    However, as the costs and risks involved with launching APTs become lower, the
    term has evolved to represent not only other state sources of these prolonged
    network attacks but also APTs conducted by nonstate actors. Because the ability
    to fund APTs is no longer restricted to foreign powers, the methods used'
