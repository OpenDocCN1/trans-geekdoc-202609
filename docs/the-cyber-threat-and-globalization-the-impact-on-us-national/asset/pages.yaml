  md: '# Estonia, 2007


    In April 2007, the Estonian government removed a statue memorializing the Soviet
    liberation of the country from the Nazis. The controversial “Bronze Soldier,”
    known endearingly as Alyosha to the Russian-speaking inhabitants of the city,
    was a symbol of sacrifice and deliverance. To Estonians, it represented Soviet
    oppression. They preferred a less disarming alias—“the Unknown Rapist.” The history
    between these two peoples has been a story of mostly confrontation and strife.
    Tensions have existed for centuries. In the twentieth century, the annexation
    of Estonia by the USSR in 1940 rekindled an enduring bitterness. As the Soviets
    relocated hundreds of thousands of ethnic Russians there in order to “Russify”
    the culture and solidify the Soviet bloc, Estonian nationalism quietly entrenched.
    By 2007, sixteen years after the dissolution of the Soviet Union, silent ferment
    blossomed into open protests as the revelation of another relocation became public.
    Alyosha, the emblem of the Soviet war effort, was being reassigned from central
    Tallinn to a humbler post at a nearby military cemetery. The primary purpose of
    the transfer was to avoid the May 9 Victory Day clashes, which had become an annual
    tradition as Russian Estonians honored their dead and native Estonians simmered
    with resentment. The news of the statue’s removal ignited protests in Estonia
    and Russia. For several days, activists in Moscow blocked access to the Estonia
    embassy, while Russian-speaking protestors in Tallinn persisted with demonstrations
    and rioting.


    As tensions rose and protest turned to violence, events bled into the cyber domain.
    From April 27 to May 18, distributed denial-of-service (DDoS) attacks targeted
    Estonia’s infrastructure. Not only were Estonian government ministry websites
    disabled, but those of political parties, news agencies, banks, and telecommunication
    companies crashed as well. Websites that usually received only one thousand visits
    per day saw their systems fail as incoming attacks reached rates above two thousand
    visits per second. A minister of defense in this nation of 1.3 million reportedly
    admitted to an American Air Force general that “one million computers” attacked
    his country. The source of the attacks was a globally'
