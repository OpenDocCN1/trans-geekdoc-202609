  md: 'objectives. However, Kim was not able to duplicate the cycle of brinkmanship
    used by his father, which had periodically resulted in successful coercion. Nor
    did Kim have other viable options at escalation short of provoking an unacceptable
    response.


    North Korea''s actions did not result in any humanitarian, financial, or other
    concessions to the regime, nor was KR/ FEC canceled. Three important points can
    be drawn from this analysis. First, internationally accepted norms deterring nuclear
    testing and proliferation as well as emerging norms prohibiting cyber interference
    in a state''s financial systems did little to deter state-sponsored cyberattacks
    or strengthen the coercive effects of such an attack. Second, cyber, while an
    available form of statecraft to be used in attempts at coercion, was not used
    in isolation, but as part of a broader escalation effort. Finally, in this case,
    the cyberattacks were the last available form of escalation short of provoking
    a response that would result in either diminished domestic prestige for Kim or
    a larger conflict that would almost certainly result in defeat. In other words,
    Pyongyang did not maintain escalation dominance.


    # November 2014 Sony Pictures Entertainment (SPE) Hack


    The November 2014 cyberattack on SPE is another example of the DPRK''s use of
    cyber as an element of statecraft. In this case, North Korea attempted to deter
    a private U.S. company from showing a film, *The Interview*, depicting the murder
    of its leader, Kim Jong-Un. While Pyongyang did not directly threaten the U.S.
    government, it likely knew the U.S. would respond to any coercive attempts against
    SPE over U.S. networks. This may have been the impetus on 25 June 2014 when the
    North Korean Ministry of Foreign Affairs appealed to the Obama administration
    not to support release of the film, before any cyberattack took place.25


    As the Christmas release date for the film approached, and it became apparent
    SPE would release the film, entities attributed to North Korea hacked into the
    Sony network and began stealing sensitive data to include e-mails, movie scripts,
    and other sensitive information before launching a "wiper" attack on 24 November.26
    SPE employees were made aware of the attack through messages displayed on screens
    of Sony terminals proclaiming the Guardians of Peace (GOP) carried out the attack.
    Over the next several days the personal data of SPE employees, along with embarrassing
    emails from SPE executives and scripts of several movies still in development,
    were leaked online. The Guardians of Peace escalated its rhetoric on 16 December,
    posting an online threat to carry out 9/11-type attacks on theaters showing *The
    Interview*.27


    In response to the threat of terrorism, SPE indefinitely postponed the release
    of *The Interview* on 17 December, the same day U.S. officials blamed North Korea
    for the attacks. The GOP cyberattacks appeared to end the next day, 18 December.
    The FBI confirmed the GOP''s link to Pyongyang on 19 December, the same day President
    Obama, during his year-end address, said SPE made a mistake canceling the release
    and announced the U.S. would respond proportionally. The president''s announcement
    was also the first time the U.S. named a foreign government responsible for a
    cyberattack and promised to punish it. Two days later, SPE representatives reversed
    course and announced *The Interview* would be released.28


    # 2014 North Korean Objectives and Results


    Unlike the inundado during increasingly tense relations on the peninsula amid
    the 2013 financial and entertainment network cyberattacks, North Korea was specific
    and vocal regarding its intent in 2014. It made this apparent through GOP statements
    and DPRK official channels. The'
