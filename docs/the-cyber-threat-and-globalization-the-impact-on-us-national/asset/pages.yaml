- pgno: 146
  md: 'Technicians reestablished service by traveling to the substations and manually
    closing the breakers, which hackers had opened through manipulation of the management
    system.¹⁰¹ Curiously (or not), there was an effort in the Ukrainian Parliament
    to nationalize privately owned power companies at that time. The legislation would
    have been a financial blow to a powerful Russian oligarch with close ties to Vladimir
    Putin.¹⁰² His holdings included various power companies. For obvious reasons,
    the physical equipment and other assets of the facility were not seriously damaged,
    but the message to Kiev was clear.


    As the attack surface advances, cyberattacks become more complex by motives and
    actors who enter into alliances of convenience. Sandworm/BlackEnergy is an example.
    Russian hacker groups, as with all cybercriminals, are complex actors who inhabit
    a highly mutable environment. Criminalware is constantly changing hands, being
    copied, customized, and updated. Vectors shift, as do strategic aims. As a result,
    detection and prosecution efforts are sometimes Sisyphean, as cyber spies, hacktivists,
    and cyberthieves maneuver to keep ahead of interdiction by lawful entities that
    struggle with legal and diplomatic protocols, jurisdictional conflicts, sovereignty
    rights, and civil rights. As a result, different private and governmental organizations
    assign names to malware and hacker groups based on oftentimes incomplete or slanted
    experiences and analysis, and other times based on the threat they pose to a specific
    target.


    The U.S. government refers to the Russian Intelligence Service’s malicious cyber
    activity as Grizzly Steppe. Table 5.1 provides a list of Russian advanced persistent
    threat actors and exploits compiled by a joint analysis team of the Department
    of Homeland Security and the FBI. Among these entries, the names sometimes refer
    to groups; other times they refer to their tools. Although the table is current
    as of 2017, it is always subject to change and further refinement.


    # Ukraine


    For the Kremlin, the menacing specter of liberal democracy loomed over another
    region of the “near abroad.” This time the “province” was much closer, historically,
    culturally, and psychologically. In 2014, Ukrainian president Viktor Yanukovych
    publicly assured the country of the government’s plans to form closer ties with
    the European Union, when in fact he had secretly signed a sweeping economic agreement
    with Russia that would bind Ukraine to Moscow.


    The history of distrust between Yanukovych’s government and the citizenry goes
    back several years. A decade earlier, amid claims of ballot count fraud and manipulation
    from the Kremlin, Yanukovych prevailed in a highly disputed election. In 2004,
    the friction and chasm between him and his pro Western opposition, Viktor Yushchenko,
    could not have been deeper or wider. Yushchenko’s vision for Ukraine meant a move
    toward more economic integration with the European Union. Yanukovych (Putin’s
    preferred candidate), on the other hand, looked eastward to the aegis of the Russian
    Federation and membership in its counterbalancing organization—the Eurasian Union.


    As Yanukovych was being declared the winner, thousands went into the streets in
    protest of the election results. Thus, the “Orange Revolution” rose, taking its'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'name from the color associated with the campaign of Viktor Yushchenko.103 The
    Orange Revolution and the Georgian Rose Revolution of the previous year were seen
    by the Kremlin as part of a Western plot to install Western style democratic regimes
    on the territory of the former Soviet Union. The Russian leadership viewed the
    uprising as a contagion, which if uncontrolled might possibly reach as far as
    Moscow.104 Despite efforts on behalf of Yanukovych, a revote took place a month
    later and Yushchenko was declared the winner. However, fortunes were reversed
    when Yanukovych returned to office in the 2010 presidential elections. This time
    there was no popular uprising. Outside observers declared the election fair and
    the results legitimate.


    Revolt, however, returned to Kiev three years later when Yanukovych refused to
    sign the European Union Association Agreement. In November 2013, protesters gathered
    in Maidan Square to demonstrate against the government’s decision. The “Euromaidan”
    protests gained momentum through the winter and reached ignition stage on the
    20th through 22nd of February 2014 when eighty-eight people were killed by government
    forces. Some victims were shot by rooftop snipers.105 Protesters seized the administration
    buildings and on February 22 set out to form a new government. While his private
    residences were being seized, Yanukovych fled to Russia.


    A counterblast to events in Kiev occurred on February 27 in the regional capital
    of Crimea. The strong pro-Russian presence on the Crimean Peninsula and in eastern
    Ukraine provided Moscow with just cause for intervention. The response to events
    in Kiev in these districts was swift and organized. Armed pro-Russia militiamen
    carrying Russian-made weapons and equipment took over the Parliament and headquarters
    in Simferopol and raised the Russian flag over both buildings.106 The following
    month, Crimea opted to secede from Ukraine and join the Russian Federation. The
    vote was part of a political maneuver orchestrated simultaneously with a hastily
    prepared referendum, which the United States and Western Europe openly denounced
    as illegal. Two days later, on March 18, Putin signed an amendment to the Russian
    constitution admitting the Republic of Crimea and the federal city of Sevastopol
    into the Russian Federation. Thus, the coda to these events was a unilateral act
    of annexation of a territory by a foreign power – a milestone for Europe, which
    had not witnessed such political adventurism since World War II.107


    In less than a month, tens of thousands of masked Russian soldiers (either welcomed
    as “friendly people,” vezhlivye lyudi, or reviled as “little green men,” zeleni
    cholovikii)108 carrying Russian made weapons and equipment swarmed onto the Crimean
    Peninsula to bolster militia forces. In a matter of weeks and without any significant
    loss of life, pro-Russian forces captured the seat of political power, stage-managed
    a referendum declaring Crimea free from Ukraine, and forced the surrender of all
    193 Ukrainian garrisons. Later, Donetsk, Luhansk, and Kharkiv fell to pro Russian
    rebels in April, as the conflict spread to the east. To the incredulity of the
    rest of the world, Putin insisted that Russia was not involved.109


    Ukrainians and Russians have a shared ethnic ancestry and a history of intermingling.
    Yet tensions have endured for centuries. A state-sponsored famine'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'ordered by Stalin in 1932–1933 resulted in the starvation of millions. Known
    as Holodomor (hunger plague), it was part of a policy to suppress the agricultural
    sector and crush any aspirations of Ukrainian nationalism. The devastation was
    so utter it reduced segments of the population to cannibalism.110 Ukrainian nationalism
    also plays to the emotions and unforgiven past of the “Great Patriotic War.” Russians
    still contemptibly recall that many Ukrainians collaborated with Nazis in the
    struggle to defeat fascism. By labeling contemporary protesters as “nationalists,”
    pro-Russia supporters link these Euromaidanists to a previous generation who took
    sides in the encounter with the West, which violated Russia then and, according
    to the pro Kremlin narrative, represents a recidivism that looms over all that
    is Russian today.111


    Unlike Estonia or Georgia, when the Soviet Union fell, Ukraine was not a small
    newly independent state of limited resources and strategic sway. In contrast,
    the country suddenly found itself with the second-largest military in Europe.
    However, despite its infrastructure assets and resources, it did not have the
    financial means to support this military.112 To ease the financial onus and at
    the same time rid the world of 1,850 nuclear weapons,113 the Russian Federation,
    the United States, the United Kingdom, and Ukraine signed the Budapest Memorandum
    on Security Assurances in 1994. The primary provision was that Ukraine agreed
    to dismantle its nuclear arsenal and transfer the weapons to disarmament facilities
    inside Russia. A second condition required that all signatories agree to reject
    the use of military force or occupation of one another’s territory. Additionally,
    the diplomatic document states that all parties would “consult in the event a
    situation arises which raises a question concerning these commitments.”114 The
    legal force of the document is questionable since it is not a formal treaty. Whether
    the legality would have made a difference in Moscow’s ultimate actions is now
    no more than grist for conjecture. The international opprobrium heaped upon the
    Kremlin for the incursion, though extreme and nearly universal, was for the leadership
    an acceptable public relations loss.


    Ukraine’s strategic place within the near abroad was a far more compelling reason
    to justify Russia’s intervention. Its significance is unique on several levels.
    Not only has Ukraine been a border territory between Russia and Western European
    powers, but it has also been an industrial and agricultural center in its own
    right. It is a political buffer for Moscow as well as an economic market. Russia
    relies on it as part of its defensive ring against Western-style democracies,
    and as a consumer for its energy exports. Furthermore, the enfeebled state of
    its economy notwithstanding, Ukraine has the requisite infrastructure elements
    and population for becoming a peer to Germany, France, or the UK.115 Therefore,
    for Russia, the possibility of Ukraine being part of the European Union signifies
    a loss of territory and an encroachment on sacred Russian space—politically, militarily,
    economically, ideologically, psychologically, and culturally. For these reasons,
    Russia views the flight of Ukraine from its orbit as an intolerable threat to
    its national security. The leadership also well realizes that if Ukraine had been
    a member of NATO, as are its Polish, Slovakian, Hungarian, and Romanian neighbors,
    the actions taken by Russia would have been an indisputable act of war. Until
    NATO membership expands to Ukraine, military action is still a relatively safe
    calculated risk.'
