    # The “Sordid Boon” of Social Media


    The nineteenth century English poet William Wordsworth used the metaphor “sordid
    boon” to express his lament over the obsession with materialism during the early
    promising days of the First Industrial Revolution. In our information age we have,
    perhaps, a modern variant of Wordsworth’s “sordid boon.” The Internet is simultaneously
    a tool of empowerment and exploitation. While it becomes more indispensable as
    a means of connecting people and ideas, it is increasingly a key variable for
    instability worldwide.


    The example of the CIA honeypot illustrates how the transformation from industrial
    age war to an era of information warfare (IW) can be precariously fought and,
    for the security establishment as well for democratic societies in general, fraught
    with unexpected consequences. On a grand scale, the World Wide Web is a marvelous
    tool of empowerment. Social media, also known as social software or Web 2.0 (see
    chapter 1), adds to the dynamic. Users interact across many devices and fluently
    transfer between author and audience states—in real time and with outreach to
    millions. Electronic venues such as Facebook, Twitter, LinkedIn, etc., have become
    drivers of the information flow. By 2009, Wikipedia had four million articles
    and YouTube had about one hundred million videos.15 Social networking services
    now exceed web-based e-mail usage.16


    The potential consequences for national security are also dynamic. As the CIA
    honeypot episode demonstrates, too, social media can mobilize sympathizers, associates,
    and armed insurgents into action in support of causes or combat. The same virtual
    pageant functions to bring nonviolent protesters, businesspeople, and consumers
    together for the sake of peaceful interaction and the steady continuance of commerce.
