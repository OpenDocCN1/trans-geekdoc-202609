    both external and internal. Russia longs for the Cold War framework of the 1945
    international system.37 That structure assumed Soviet superpower standing in a
    bipolar world and affirmed state supremacy over national internal affairs. In
    the post–Cold War environment, the inherited mind-sets of the Cold War era have
    not fundamentally changed. Russia’s reduced status to a regional power and the
    loss of military supremacy and economic influence only raises the sense of paranoia.
    The Kremlin still sees the world as a sea of foreign threats—particularly, in
