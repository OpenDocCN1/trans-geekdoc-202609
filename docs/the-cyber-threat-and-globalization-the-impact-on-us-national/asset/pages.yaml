- pgno: 70
  md: 'offer clarity on the kinds of events that take place in cyberspace, we distinguish
    between organized crime, cyber espionage, crime, disruption, and attack:


    +   Cyber espionage: the act of securing information of a military or political
    nature that a competing nation holds secret.

    +   Cybercrime: any interference with the functioning of a computer system, with
    fraudulent or dishonest intent of procuring, without right, an economic benefit
    for oneself or for another person.81

    +   Cyber disruption: the serious hindering without right of the functioning of
    a computer system by inputting, transmitting, damaging, deleting, deteriorating,
    altering, or suppressing computer data.82

    +   Cyberattack: a cyber operation, whether offensive or defensive, that is reasonably
    expected to cause injury or death to persons or damage or destruction to objects.83


    The paradigms required for addressing cybercrime and cyber espionage are not the
    same as those required to succeed in cyberwarfare. Developing a clear distinction
    at the technological level between various types of malicious cyber activity is
    critical to assuring that policy makers appropriately adopt existing international
    law or develop global norms. As will be discussed later, there are separate definitions
    and perceptions for the concept of “cybersecurity,” as well. Indeed, the word
    cyber has no direct semantic equivalent in every language. While the West uses
    the word cybersecurity to refer to the technical domain, other governments understand
    cybersecurity as a concept that also embraces content. Content is an element of
    the cyber domain that needs securing, but in some cases, this interpretation can
    mean censorship and/or weaponization of information. These differences between
    the technical terminology and the more holistic understanding form barricades
    and inhibit treaties, obstruct progress in the codification of international law
    and the setting of global norms, and aggravate contentions between political systems.
    Therefore, the time for gross generalizations and sweeping assertions may be at
    an end for a variety of reasons and at various levels.


    Unfortunately, international norms related to cyberspace are currently scant.
    Guidance and collective action for the advancement of global norms has been wanting.
    This frailty in international governance of cyberspace exists in arrant opposition
    to the rushing pace of technological innovation and its diffusion. The lack of
    multilateral rules, policies, and agreements represents an underdeveloped system
    and opportunity loss to create not only a more secure international environment
    but also a more prosperous one.84


