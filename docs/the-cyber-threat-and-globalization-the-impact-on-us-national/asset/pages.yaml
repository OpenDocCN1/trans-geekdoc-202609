  md: 'In addition to its costs, however, the cyberstrike also created a call to arms
    for alliance members, and a rapid international response eventually emerged. NATO’s
    Computer Emergency Response Teams (CERTs) and the EU’s European Network and Information
    Security Agency (ENISA) helped to reestablish network operations. In addition,
    the incident inspired action to align European national cyber defense mechanisms
    and policies with NATO agencies.¹⁶


    Ultimately, the final stage of this chess match with Estonia did not checkmate
    the government into changing its policy. The statue was removed and demonstrations
    subsided. The incident failed to coerce Estonian officials to soften their actions
    or attitudes toward Russia. In fact, the episode’s primary effect was to raise
    awareness of the geopolitical threat that Russia posed and to underscore the potential
    of this new strain of Kremlin *machtpolitik*. While the attacks mostly involved
    DDoS activity, observers quickly understood the potential for far more serious
    exploits. Future assaults could disable military systems and critical infrastructure
    sectors such as energy grids, communication networks, air traffic control operations,
    and water purification and supply systems.


    The attack was distinctive in its use of personnel, information age weaponry,
    and ability to take advantage of the altering attack surface. As one analyst noted,
    “The Estonian attack is unique in that the Russians were able to marshal the efforts
    of a number of criminal cyber enterprises and direct their collective efforts
    at a state target, while insulating official Russian institutions from culpability.”¹⁷
    The strike also demonstrated, again, the impact of globalization on warfare in
    the information age. Represented in this conflict was a far-reaching range of
    actors and a strain of asymmetry heretofore unknown. It also compelled conventional
    resulted in moving the alliance toward harmonizing national militaries and forcing
    governments to react with smarter policies and processes rather than relying strictly
    on technology as a deterrent.¹⁸ Subsequent outcomes included the adaptation of
    a unified Policy on Cyber Defense in 2008 for centralizing cyber defense planning
    and operations across NATO.¹⁹ The same year, planners also founded the Cyber Defense
    Management Authority (CDMA) based in Brussels (later to be superseded by the Cyber
    Defense Management Board -CDMB)²⁰ and the NATO Cooperative Cyber Defense Center
    of Excellence (CCDCoE) in Tallinn. The primary purpose of the CDMB is to develop
    and coordinate cyber defenses based on technical capability, political risk analysis,
    and information sharing activities.²¹ The CCDCoE complements the CDMB in offering
    a platform for research, education, and information sharing through a suite of
    workshops, exercises, courses, and a staff of experts.²² It can be argued that
    the silver lining to the Russian incursion has been smarter defenses and continuing
