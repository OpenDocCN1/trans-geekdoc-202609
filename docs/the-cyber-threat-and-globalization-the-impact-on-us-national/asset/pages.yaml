- pgno: 125
  md: 'and financial relationship. This dynamic is very different from the strategic
    competition between the Soviet Union and the United States currently and during
    the Cold War. Therefore, the rhetoric and the inner rhythms of this superpower
    relationship are neither separate nor easily grasped due to the strategic economic
    entanglement and competing geostrategic interests.


    # U.S.-Chinese Positive Engagement: Dialogue for Cyber Stability


    When President Obama and President Xi met in California on June 7–8, 2013, to
    discuss, among other issues, cyber conflict, both leaders expressed a desire for
    closer cooperation. President Xi stated, “We need to pay close attention to this
    issue and study ways to effectively resolve this issue. And this matter can actually
    be an area for China and the United States to work together with each other in
    a pragmatic way.” President Obama acknowledged that, “when it comes to those cybersecurity
    issues like hacking or theft, those are not issues that are unique to the U.S.-China
    relationship. Those are issues that are of international concern. Oftentimes it’s
    non-state actors who are engaging in these issues as well. And we’re going to
    have to work very hard to build a system of defenses and protections, both in
    the private sector and in the public sector, even as we negotiate with other countries
    around setting up common rules of the road.” Both leaders expressed a desire to
    address threats, while dancing around the subject of China’s use of cyberspace
    to engage in economic espionage.


    Given their leadership in developing technology, number of users, and great power
    status, the Obama-Xi dialogue, or OX, began to lead by example to begin resolving
    the greatest security dilemma of the early twenty-first century. The two leaders
    concluded in September 2015 that “the United States and China agree that neither
    country’s government will conduct or knowingly support cyber-enabled theft of
    intellectual property, including trade secrets or other confidential business
    information, with the intent of providing competitive advantages to companies
    or commercial sectors.”%


    The opportunity for China and the United States to make marked progress toward
    cyber cooperation continued in the months and years to come. Greater cyber cooperation
    was evident in the reduction of attempted intrusions targeting intellectual property.
    While areas of improvement including the timely sharing of information between
    China and U.S. computer emergency response teams, along with enhanced law enforcement
    activities, OX would serve as a clear indicator of increased cooperation on cyber
    concerns. These are not subject to just cyber issues but the overall strategic
    dialogue between the two countries. How this progress moves forward in post-Obama
    administrations is not yet assured.


    # Building toward a Cooperative Spirit


    Sino-U.S. cooperation is not new. General Joseph Ralston, USAF (ret.), former
    vice chairman of the Joint Chiefs of Staff, makes a compelling case for the long-term
    benefits of building trust with China through military-to-military contacts.'
