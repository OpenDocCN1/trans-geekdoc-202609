    # Vulnerabilities


    SCADA systems are security problem areas. When they were developed over forty-five
    years ago, the designers of these software applications sought a model that was
    scalable, easy to operate, and able to link together decentralized facilities.
    In this environment, security concerns ran second to interests of Internet expansion
    and accessibility. Therefore, standardized technologies and open solutions seemed
    more corresponding to the original vision. Today’s standardization of software
    products, hardware products, and connectivity with other networks are both problematic
    and seminal. The escalating threat from cyberattack has put at risk these control
    systems and the critical national infrastructure facilities that rely on them.


    The chief defense against cyberattack for SCADA systems has been their relative
    remoteness and separation from major networks. “Remote locations and proprietary
    industrial networks used to give SCADA systems a considerable degree of protection
    through isolation.”⁴⁰ However, that defense is compromised through Internet and
    enterprise network connections, from the level of network nodes to remote field
    devices. Furthermore, no network is completely segregated, or “air gapped.” A
    completely isolated system would exclude software and certification updates and
    restrict file uploads.⁴¹ The extension of smart grids and smart metering makes
    the notion of a disconnected critical infrastructure counterproductive to the
    goals of cost efficiency and service/product reliability.


    The most publicized and advanced SCADA malware to date is Stuxnet. Known within
    official circles as “Olympic Games,” Stuxnet attacked the Iranian nuclear facility
    at Natanz over a period between 2008 and 2011, disabling 3,700 of the 9,000 centrifuges
    at the facility⁴² and setting back the Iranian uranium enrichment program by one
    year. Stuxnet, which is believed to be a joint operation between the United States,
    Israel, and the UK, contained multiple zero-day exploits that took advantage of
    a number of Windows vulnerabilities. It preyed on widely used Siemens industrial
    control software and databases and Vacon and Fararo Paya PLCs (programmable logic
    controllers). Once activated, it caused rotor failure of centrifuge operations,
    forcing centrifuges to dump contents.'
