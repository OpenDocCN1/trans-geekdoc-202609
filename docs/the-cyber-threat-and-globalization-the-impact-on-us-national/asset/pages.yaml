    In military and foreign affairs, deterrence is a strategy aimed at dissuading
    an adversary from taking an action or incursion not yet launched—whether on its
    own or on behalf of another actor. In some cases, deterrence may not only be a
    policy instrument to deter acts but also to compel them. The policy generally
    refers to threats of military, hard power retaliation, but soft power instruments
    such as economic sanctions and “shame and blame” measures apply as well. Shame
    and blame are proven tactics of deterrence, often when taken by international
    watchdog regimes against uncompliant states that flaunt international law and
    accepted norms.


    During the Cold War, nuclear deterrence dominated superpower strategic policy.
    The prospect of mutually assured destruction (MAD) was existential enough to maintain
    world order. In the information age, however, its relevance is debatable but still
    applicable in some instances. Yet issues of attribution, collective security,
    state sovereignty, and legal definitions as to what constitutes an act of war
    make discussions about the viability of cyber or information deterrence complex
    and controversial.


    The Chinese, or any adversary, utilize the concept of deterrence as a means to
    achieve “flexibility in negotiations and gain a psychological and digital strategic
    advantage, perhaps through a show of force.”70 The strategy requires the gamut
    of cyber operations. Full execution involves extensive reconnaissance efforts
    to identify vulnerabilities in an adversary’s cyber topology and analysis of potential
    attack vectors and sabotage methods to disrupt or destroy the opponent’s systems.71
    The attack is logical. The threat can be physical. The pressures are psychological.
