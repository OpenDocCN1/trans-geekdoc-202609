    his regime had come to represent the former republic’s ties to the Soviet past.
    His downfall came when his supporters schemed to falsify the election results.
    The backlash turned into protests and a twenty one-day movement, which later took
    the name the Rose Revolution. The gesture by students of exchanging roses for
    soldiers’ guns symbolized the protest and gave the resulting coup its name.


    The justification for Russian intervention in the South Caucasus five years later
    was to support two breakaway provinces seeking official autonomy: South Ossetia
    and Abkhazia had been functioning outside Tbilisi’s control for fifteen years
    during a tense time of sporadic provocation, accusations, and shelling from all
    sides. Russia, which withdrew its military in 1991 from Georgia when it proclaimed
    its independence, maintained a peacekeeping force in South Ossetia and Abkhazia
    to ensure order. Finally, in response to an attack by Georgia against South Ossetia
    on August 7, 2008, Russia launched a large-scale land, air, and sea invasion the
    next day. In addition to supporting these demands for self rule, a primary impulse
    behind Russia’s actions may also have been Georgia’s flirtation with joining NATO.54


