    # Cloud Computing


    The National Institute of Standards and Technology (NIST) has defined cloud computing
    as a model for “enabling ubiquitous, convenient, on-demand network access to a
    shared pool of configurable computing resources (e.g., networks, servers, storage,
    applications, and services) that can be rapidly provisioned and released with
    minimal management effort or service provider interaction.”48 Put more briefly,
    cloud computing is access from remote terminals to shared software or data.


    Cloud computing and IoT, though separate technologies, are becoming more integrated.49
    However, IoT is becoming so systemic that it is outgrowing the transport apparatus
    it travels and the databases it accesses. This fact, combined with an increasing
    trend within the commercial sector of locating many independent services on one
    physical host, is forcing further research and development.


    The paradigm, from an operational perspective, allows for a greater tolerance
    to operate resiliently in a contested environment, enabling a system to transparently
    continue operation in the face of one or more faults that would otherwise cause
    the system to fail. Highly resilient systems are ones that could restart quickly
    and restore data. In a virtual environment, a sensor will be able to detect a
    virtualized machine’s failure and conduct a replacement of the virtual machine
    with a duplicate backup based on the snapshot of a trusted virtualized environment.
    All of the data that had not been backed up within the trust configuration would
    be lost, but system functionality would be restored.


    One might argue that centralizing management of virtual assets may lead to an
    increased risk of a single point of failure that would not have existed before.
    Yet the virtualized environment can also enable a protected environment for deploying
    security services. This would enhance efforts to mitigate the risk of rootkits
    and social engineering attacks. However, there are still problems of the virtual
    machine understanding of how to detect whether or not a guest application is behaving
    in an anomalous manner. Thus, the potential for false positives will persist.


    Virtualization also makes installation operations and managing instances of a
    specific operating system configuration under one authority easier. This lends
    itself to automating the installation of the same operating system across several
    virtual machines. Such massive deployments create software monocultures that could
    facilitate the spread of malicious software, but also creates a uniform ecosystem
    that would make deploying patches to vulnerabilities more efficient and effective.


    Lastly, among other issues connected with the explosive growth of IoT is the matter
    of latency. Latency is the term to describe the time it takes for the'
