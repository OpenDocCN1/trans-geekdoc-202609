- pgno: 196
  md: 'In his article “Towards a Cyber Security Reporting System: A Quality Improvement
    Process,” Jose Gonzalez examines how such a system could be established. It is
    argued that the current mechanisms that monitor cyberspace for security violations
    are not adequate because of overburdened staffs, the ease of anonymity in cyberspace,
    inexperienced defenders of cyberspace, and the lack of sharing of attack data.
    While numerous institutions that monitor cyberspace in order to identify threats
    to security exist, such as computer emergency response teams (CERTs), these centers
    are not coordinated and do not make generally available the data they collect.
    This in effect hampers international efforts to secure cyberspace, since general
    lessons gleaned from successful cyberattacks are not disseminated at a global
    level. Therefore, a private entity operating in a state with adequate CERT facilities
    might be aware of an impending cyberattack, but another private entity in a CERTless
    country will not. Further, the problem with the current CERT system is that private
    entities do not report all infringements of their cyberspace, as they fear loss
    of profits. What is required is for a model similar to that monitoring civil aviation
    to be established to monitor data traffic for attacks. This too requires a P3,
    however, with the public leading the private. The current state of this field
    is that it is still in a slow transitory phase. Thus, while the CoE is correct
    in emphasizing the importance of a 24/7 monitoring network across borders, governments
    need to make a greater effort to facilitate the establishment of such a network.


    # Conclusion


    The problem of public law enforcement authorities not being able to have a primary
    role in assuring private entities’ information security must be addressed. Cybercrime
    is a great threat to the Information Society. Computer networks have greater utility
    to users when there are more users present on a network. Individuals use computers
    to join networks they trust in order to exchange information with other users.
    When trust on these networks is compromised, a user will leave the network, thereby
    diminishing the utility of the network to the rest of the community. Security
    and trust are the cornerstone of the Information Society. With each unjust network
    intrusion, these principles are diminished, no matter how trivial the intrusion
    is.


    Currently, the private sector is being held responsible for securing cyberspace,
    since most of the infrastructure, including the Internet, is not owned by governments.
    This course is being encouraged by the UNGA, WSIS, IGF, and governments, including
    the U.S. government. This strategy is misguided. Public policy and governance
    are the foundation of trust. The roots of this idea stem from the Aristotelian
    conceptualization of the political partnership, which places the polis at the
    top of a political hierarchy. Being made up of a political partnership between
    individuals, households, and villages, the polis is the domain in which the deliberation
    of legislation happens, law enforcement is organized, and adjudication occurs.
    Aristotle placed these powers in the public sector since the'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'realm of interests of each of the polis subunits might not seek out the best
    interests of the community at large. Governments can react and place legal sanctions
    on a private entity that has failed in its duty to provide a secure digital environment
    for its subscribers; however, this does not reverse the fact that the crime happened
    in the first place.


    In this regard, the establishment of independent international investigative commissions
    for cybercrime mandated by the United Nations Security Council with the cooperation
    of Interpol is one solution. This will enhance the ability of states to investigate
    cybercrimes and increase the chances of perpetrators being caught. The second
    proposal is for the establishment of a 24/7 data traffic monitoring and control
    system run by public law enforcement.


    Without the public sector taking an active role in assuring the security of private
    networks, security in cyberspace will not be distributed equally across the Information
    Society. A secure cyberspace is possible. This desired end state can only occur
    with the continuation of the P3 model; however, the public should be in the lead
    rather than, as it stands, the flip side of this modest proposal.


    Countries should not wait until a devastating attack to encourage a robust public
    sector role in leading cybersecurity.


