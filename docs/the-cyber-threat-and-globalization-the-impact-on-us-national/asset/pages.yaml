    The URL is the protocol for specifying global addresses on the web. The URL is
    another string of numbers, which are read by machines and translated (resolved)
    into letters by the Domain Name System (DNS) for easier understanding by humans.
    Therefore, rather than having to type 66.249.90.104 when accessing a search engine,
    you can enter the more user-friendly URL “google.com.” Domain Name Resolvers are
    the computers, commonly located with ISPs or in institutional networks, used to
    respond to a user request to “resolve” a domain name.


    Thirteen root servers house the DNS databases, which facilitate translation between
    IPs and URLs. The former U.S. Department of Commerce agency, Internet Corporation
    for Assigned Names and Numbers (ICANN), allocates top-level designations such
