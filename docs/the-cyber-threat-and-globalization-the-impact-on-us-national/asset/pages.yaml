- pgno: 264
  md: 'ISR activities that enable OCO and DCO. The following sections will explain
    these activities in greater detail.


    # ISR for OCO


    # Cyberspace Targeting


    The ability to deliver cyberspace effects requires three critical elements: target
    identification/characterization, access to that target, and tools to deliver the
    intended effects. Cyberspace targeting enables all three. Cyberspace targeting
    links desired effects with adversary cyberspace vulnerabilities to deny, disrupt,
    or destroy adversary capabilities. Cyberspace targeting relies on intelligence
    detailing system vulnerabilities to identify where and how to direct cyberspace
    fires by answering the question of whether current characteristics or changes
    to the adversary system topography open up a path for generating fires effects
    or close off a path being used previously. Cyberspace targeting must consider
    an update to a computer’s operating system, the connection to a supervisory control
    and data acquisition (SCADA) system, a change to system security policies, and/or
    the addition of antivirus or other security products. In most cases, this data
    is collected by actively probing adversary networks regularly with messages specifically
    crafted to elicit responses that provide information about the topography of the
    network and running programs on each machine in the network. This is commonly
    referred to as scanning the network. Additionally, exploitation may be required
    to identify changes that are intentionally hidden from active scanning, like the
    list of installed antivirus tools or attached physical devices. Finally, for the
    target computer system, analysts compare current network characteristics or any
    changes to offensive cyberspace tools to determine whether these current characteristics
    or changes give the opportunity to use an offensive tool, take a tool off the
    table, or change the risk decisions associated with specific techniques used by
    the tool.


    # Mission Planning and Execution


    Once the cyberspace “target folder” (i.e., detailed targeting solution) has been
    developed, cyberspace ISR analysts and operators develop the mission plan. Mission
    planning takes mission objectives and translates these into tactical tasks for
    execution. In addition to targeting information, ISR input to mission planning
    will include expected threats, neutral actors, and/or other friendly forces operating
    in the target network space. ISR analysts will identify potential vulnerabilities
    to offensive tools as a result of these expected threats and/or other actors operating
    in the space. ISR analysis will provide detailed timing as well as approach vectors
    discovered during the analysis of the target adversary network to help choreograph
    mission execution. ISR analysts also assist in the development of contingency
    options should automated network responses, adversary actions, and/or other actor
    actions precipitate the need for an alternate course of action. During mission
    execution, cyberspace ISR analysts provide real-time situational awareness and
    threat warning. Finally, after the completion of a mission, ISR analysts will
    support mission debriefing and lessons learned. ISR analysts will characterize
    adversary tactics, techniques, and procedures (TTPs) employed in response to friendly
    actions as well as any other adversary network intelligence gathered as a result
    of the operation in order to improve future cyberspace missions.


    # Intelligence Gain/Loss Assessments


    The joint targeting process incorporates intelligence gain/loss (IGL) assessments
    to weigh the risk targeting operations have on future intelligence collection
    activities. In striking a particular target in the natural domains, future collection
    may be denied as a result of the loss of that target which had been providing
    lucrative intelligence. This is particularly critical for cyberspace'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'operations. Whereas in the natural domains the elimination of a target (e.g.,
    radio communication tower) can prevent future collection in a localized area of
    operations due to the absence of the target, in cyberspace, the use of a cyberspace
    tool to create effects on a C4I target can eliminate the future use of the cyberspace
    tool for future intelligence collection or attack missions globally. A cyberspace
    operation (OCO or CNE) utilizes specialized tools that require extensive resources,
    time, and tradecraft to develop and depend on specific network vulnerabilities
    to ensure undetected and continual access to deliver effects or collect information.
    Thus, a cyberspace operation could “potentially compromise (future) intelligence
    collection activities” and future use of an offensive tool by exposing this sensitive
    technology and tipping adversaries to their network vulnerabilities that allowed
    the cyberspace tool to penetrate and then attack or collect.16 When such network
    vulnerabilities are patched to counter a cyberspace tool, the patches can be made
    available worldwide. Thus, many cyberspace tools carry the risk of having utility
    for only a few uses or just one use before adversary countermeasures eliminate
    its use worldwide. Therefore, IGL assessments within the cyberspace domain take
    into account the extreme perilous nature those cyberspace capabilities suffer
    when exposed. The assessment must weigh whether or not the cyberspace tool might
    have utility for a potentially higher-priority operation or intelligence collection
    effort where subsequent loss of the capability is acceptable.


    # ISR for DCO


    # Indications and Warning (I&W)


    While friendly actors attempt to exploit and attack adversary networks, adversaries
    are doing likewise to friendly networks. Defending against exploitation and attacks


    requires a detailed understanding of adversary cyber actors and their capabilities
    and constant vigilance. Cyberspace I&W focuses on predicting, detecting, analyzing,
    and alerting of adversary cyberspace actions and threats. Joint and National Intelligence
    Support to Military Operations (JP 2-01) defines I&W, in general, as a process
    that analyzes and integrates operations and intelligence information to assess
    the probability of hostile actions and provide sufficient warning to preempt,
    counter, or otherwise moderate their outcome.17 Due to anonymity and relative
    freedom to maneuver our adversaries enjoy in cyberspace, cyberspace I&W may only
    recognize adversary cyberspace operations triggers with relatively short windows
    of opportunity to respond.


    Cyberspace I&W data can be organized into two types of observations, those that
    occur in real time at network speed, and the fusion of all other sources of information
    prior to a predicted attack or espionage event. Those observations of enemy activity
    prior to a delivered cyberspace effect follow what is termed the cyberattack kill
    chain. This chain of adversary actions produces many potentially observable events
    that may start with adversaries conducting initial target research (e.g., probing
    network systems) followed by attempts to gain increasing access through testing.
    Adversaries then use this gained knowledge to tailor (weaponize) code specific
    to the target system. Finally, the adversary selects a delivery methodology (e.g.,
    e-mail with link or attachment) that installs the malicious attack code as well
    as any command and control code intended to manage exfiltration of data if the
    intent is also espionage.18 Unlike the physical domain, the transition from delivery
    to attack/ exploitation can transpire in seconds. However, prior to weapon delivery,
    initial phases of adversary cyberspace targeting development generate observable
    warning data over an extended period of time to enable friendly forces the ability
    to alert of an impending adversary network'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'penetration seeking to create adverse network effects or espionage. For example,
    increases in adversary research into military organizational structures, personnel,
    network infrastructure, and workplace procedures, followed by network probing,
    spear phishing e-mails, or social engineering attempts, may occur days, weeks,
    or even months before any network-level adverse effects exist. Furthermore, as
    the attack moves into the intermediate phases of gaining and expanding accesses,
    observations will include those that occur at network speed. For this reason,
    one of the most crucial elements of a cyberspace-warning system is the capability
    to recognize, collect, and profile network anomalies related to all the phases
    of a potential network attack to facilitate the systematic identification of suspected
    and actual malicious activity.19 Cyberspace I&W systems provide support to DCO
    through the monitoring, detecting, analyzing, and alerting of threats to both
    the DODIN and national critical infrastructure.


    actions necessary to prevent future attacks. The intelligence gathered during
    this analysis enables the development of new countermeasures (e.g., security patches
    or updated policies) to prevent future successful attacks. In the cases where
    attribution of major attacks is achieved, the intelligence can be used to inform
    DCO response actions: information gathered about the source, method, or purpose
    of an attack to develop counterattack cyberspace tools to create proportional
    effects outside the DODIN on the adversary’s networks.21 Analysis leading to successful
    network countermeasures (e.g., vulnerability patching) and/or responsive actions
    on adversary networks helps achieve deterrence through communication of network
    resiliency (denial of future benefits from attack) and fear of retribution.


    # Attribution and Mitigation


    If cyberspace ISR is not able to predict an attack to enable proactive defense,
    it can play a critical role in determining key information after an attack. Attribution
    consists of “determining the identity or location of an attacker or an attacker’s
    intermediary.”20 Attribution of cyber-personas is an extremely difficult endeavor
    due to the size, composition, and governance of the Internet. In addition, determining
    the intent/motive behind an attack is an equally important part of attribution
    because it allows leaders to determine possible trends or issues that need to
    be addressed from a defensive standpoint to predict/prevent future attacks.


    Through the analysis phase following an attack, defenders can often discover adversary
    tactics, techniques, and procedures, new attack vectors, and unknown network vulnerabilities
    to support mitigation, recovery from the current attack, and


    # Conclusion


    Communications have transitioned from a radio frequency–dominated paradigm to
    an IP-dominated paradigm. Further, information has shifted from being stored in
    hardcopy print form to being stored digitally. As a result, cyberspace presents
    an ever-increasing source of intelligence about our adversaries as well as an
    increasing area of vulnerability to our own operations. Cyberspace ISR activities
    are described via three primary missions: exploit, attack, and defend, all of
    which require the foundation laid by C-IPOE. Exploitation activities enable access
    to and intelligence collection from adversary information networks. Data collected
    from cyberspace that is processed and analyzed results in the production of what
    is called digital network intelligence. DNI supports the full range of military
    operations, not just cyberspace operations. When conducting offensive cyberspace
    operations, ISR operations are critical for target development and mission planning
    as well as weighing costs versus benefits of using extremely perishable cyberspace
    tools. Adversaries also seek to exploit and attack'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'friendly networks. Thus, cyberspace ISR activities detect, predict, and/or
    mitigate enemy intrusions into our networks. Finally, ISR for cyberspace operations
    requires a multi-INT planning, collection, and analysis approach to synchronize
    and optimize intelligence support for cyberspace.


