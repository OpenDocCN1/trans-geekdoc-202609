  md: 'be found in the comments by Mikk Raud, a researcher at NATO’s Cooperative Defense
    Center of Excellence:


    Overall, the creation of the SSF is a landmark development, giving a clear indication
    of the PLA’s focus on informationised warfare, which raises questions of whether
    these actions should be seen as provocative preparations for an overt conflict,
    or merely to provide China with more credible deterrence in the face of technologically
    advanced Western powers. The developments must also be seen in political context,
    as it shifts control over China’s most powerful and strategically important weapons
    from the army to the Central Military Commission, headed by President Xi.


    The U.S. Third Offset Strategy, whose genesis dates back to the Carter administration,
    is an ongoing effort to maintain the United States’ global power projection lead
    position through technology. The next-generation technologies and concepts to
    assure U.S. military superiority will mean development of “unmanned systems; extended-range
    and low-observable air operations; undersea warfare; and complex systems engineering,
    integration, and operation.” According to Eric Rosenbach, former chief of staff
    to Obama-era defense secretary Ashton Carter, the Third Offset threat may have
    been a primary inspiration behind the Chinese launch to reorganize its security
    structure and the creation of the SSF. This undertaking to create a deeper and
    more multifarious fusion of its systems capabilities reveals the PLA’s recognition
    of the current weaknesses in its force structure and the determination to resolve
    it. The new SSF, therefore, might be the critical integrant for China’s hopes
    to achieve dominance in space, cyber, and electromagnetic domains. As the core
    element of strategic information support, the SSF might be an indispensable force
    in the PLA’s capability to fight and win modern wars. An appropriate technological,
    diplomatic, and collaborative response by the United States, its allies, and in
    concert with the private sector would appear as an indispensable counterstrategy
    and way forward.


    # Mutually Assured Deterrence


    Realizing how mutually dependent each country is on the other’s economy, the United
    States and China have been engaged in bilateral and multilateral discussions on
    cybersecurity cooperation and conflict mitigation. These meetings represent attempts
    by both sides to create and shape a global understanding of how responsible states
    should act, what standards of behavior states should adopt, and how to level the
    playing field in cyberspace for the benefit of all legitimate actors. The Sino-U.S.
    dialogues and roundtables on cyber matter. Despite the agreement by the United
    States and China that this adventurism should cease, obstacles to successful cooperation
    on issues of cybersecurity persist. As more and more people gain access to advanced
    ICT and enter the digital information society in both countries, the consequences
    of how states direct and respond to malicious cyber incidents targeting both business
    systems and critical infrastructure are unclear. As mentioned above, one of the
    reasons that overall prospects for U.S.-China cooperation are positive is their
    increasingly intimate economic'
  merge: -1
