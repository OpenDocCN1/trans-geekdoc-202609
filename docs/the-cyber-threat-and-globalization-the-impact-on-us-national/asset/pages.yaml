- pgno: 102
  md: '# China 4


    Cyberspace, and its subcomponent, the Internet, is the twenty-first century''s
    powder keg. Competing interests and ideologies have emerged over the past decade
    to carve out digital spheres of influence within a domain that was supposed to
    represent the epitome of a project forging a global Information Society. Sadly,
    rather than a means of empowerment and democratization, the domain has come to
    be dominated by cybercriminals, terrorists, and other malicious actors who take
    advantage of a lack of international cyber cooperation and governance for the
    purposes of expanding their own agendas and influence. The absence of enforceable
    international standards and legal codes strains relations between great powers.
    Instead of focusing on ways to enhance cooperation and establish norms, states
    compete in the cyber domain to further their own objectives. As the world moves
    away from the structures and mind-sets of the industrial age and lurches into
    the information age, cyberspace is but another arena where states execute their
    geopolitical and economic strategies.


    China has emerged as the foremost threat to American economic dominance and vitality
    in the cyber espionage arena. Utilizing the domain for intellectual property theft
    to drive its goals of ensured economic growth, it is also a country that wrangles
    with the utilization and prioritization of the cyber domain not just for the purpose
    of its future prosperity, but also in the service of regime stability. Therefore,
    the relationship between China and the United States has been strained as a result
    of China''s intrusion and adventurism against corporate networks as it strives
    to meet both challenges, economically and politically. On the other hand, in the
    PRC''s assessment, the United States'' promotion of American values such as freedom
    of speech and the free flow of information is a direct security threat to its
    authority. This chapter provides an overview of these themes. Publicly uncovered
    data and APTs (advanced persistent threat) firmly document the PRC''s activity
    as perhaps the world''s most active source of national and industrial espionage.
    In these sections, the methods, motives, and capabilities come under examination
    and discussion. This chapter also looks into how these components fit within the
    PRC''s effort to compensate for its relatively late'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'arrival to the information age. In this new domain of state and nonstate activity,
    norms are being established through behavior and interaction among all actors.
    Whereas Russia has been integrating cyber across the diplomatic, informational,
    military, and economic levers of its grand strategy, China appears more focused
    (at this point in time, at least) upon utilizing cyberspace to achieve its economic
    developmental goals through the mass theft of intellectual property worldwide
    rather than using it as an offensive means for power projection.


    # Market Ownership: Controlling the Rules and Physics of the Domain


    Because cyberspace is a man-made domain, it is possible and advantageous for states
    to develop products and services that are appealing and marketable to others.
    China’s exploitation of cyberspace’s natural forces for economic and strategic
    advantage is not limited solely to the use of it for theft of information. It
    is also aggressively pursuing a strategy where it seeks to vie for and ultimately
    usurp market share from non-Chinese firms. Companies such as Huawei and ZTE fiercely
    compete with American firms such as Cisco and AT&T. As the pace of technology
    and innovation accelerates, a battle for control of cyber infrastructure is swiftly
    emerging.


    Along the cyberwar scape, China is making a technical Great Leap Forward in terms
    of computer science and engineering. As reported by the U.S.-China Economic and
    Security Review Commission, “If current trends continue, China (combined with
    proxy interests) will effectively become the principal market driver in many sectors,
    including telecom, on the basis of consumption, production, and innovation.” With
    the ascendance of China’s position in these markets, there is the worry that an
    overreliance on it as a manufacturer of computer chips and other information and
    communication technology (ICT) hardware has already allowed viruses and backdoor
    access to equipment used by U.S.-based entities, including the military. An expanding
    market share might only create a further risk to U.S. cybersecurity. Extraordinarily
    low-priced Chinese-made computer hardware products available in Asia and the developing
    world are a lucrative option and prudent business decision. Competitive pressures
    often force U.S. companies to rely on China’s outsourced production facilities
    to assemble and manufacture products. Western companies have long been irresistibly
    lured into commercial alliances with non-Western partners. These joint venture
    arrangements are openings for a hostile player to implant viruses, malware, Trojan
    horses, and backdoors into equipment for both proprietary civilian and military
    use.


    Malicious insider access to these products is a serious security concern. Source
    codes, or the software programming instructions, are particularly appealing targets.
    The ability to copy or corrupt these millions of lines of instructions gives hackers
    the capability of tunneling into information systems around the world. Once the
    information is accessed, there is little to prevent someone from stealing intellectual
    property and inserting their own code. According to Google, this is precisely
    what has occurred not only to them, but to at least thirty'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'other California-based companies.1 In addition, over the past years, counterfeit
    Cisco routers have surfaced. Their intrusion creates the fear that implanted software
    could give foreign or other unauthorized agents the capability to tap into networks
    with the same ease as U.S. law enforcement agencies.2 As required of network hardware
    manufacturers by law, Cisco Systems produces according to specifications that
    allow the U.S. government wiretapping capability for investigative purposes.3
    In such a case, a corrupted router “could provide the perfect over-the-shoulder
    view of everything coming out of a network,” according to Jeff Moss, a security
    expert with the Homeland Security Advisory Council.4 In 2016, the Pentagon’s Joint
    Staff Intelligence Directorate produced an internal paper claiming that Lenovo
    computers and devices might present a cyber espionage threat. The report stated
    that the Chinese-made products could compromise Defense Department supply chains,
    and further asserted that other Lenovo products were found to communicate information
    covertly back to Chinese intelligence agencies.5


    As opposed to the earlier stages of China’s entry into the market, it is now not
    only the price of Chinese products that gives them such market appeal, but also
    the quality of ICT manufacturing. Chinese entities, such as Huawei, are on the
    leading edge of developing the standards of next-generation mobile 4G LTE networks.
    Changsha is the home of both the fastest supercomputer in the world, Tianhe-2,
    and the Chinese-designed open-source software Kylin Linux operating system. While
    U.S. based entities have traditionally set the standards for Internet technology,
    China based entities, such as the ZTE Corporation, are increasingly taking on
    roles within the ITU (International Telecommunications Union) to draft important
    international standards that will shape the world’s next-generation networks.6


    China, naturally, has a right to compete in the global marketplace for its share
    of the information technology sector. Unfortunately for China, not all elements
    are under its control. Past events and actions have undermined trust and inhibit
    the building of partnerships and other market relationships. One well-known example
    is the incident of April 8, 2010, when Internet traffic was misrouted inadvertently
    or maliciously through servers based in China. The misdirection affected U.S.
    government and military networks. According to the U.S.-China Economic and Security
    Review Commission, state owned China Telecom advertised erroneous network routes
    that instructed “massive volumes” of U.S. and other foreign Internet traffic to
    go through Chinese servers over an eighteen-minute period.7 In their annual report,
    the commission claimed, “China Telecom’s servers erroneously started advertising
    themselves as the best routes for a large chunk of Internet traffic. Such rerouting
    has happened before from simple configuration errors, though it can certainly
    be caused by deliberate actions as well.”8 Incidents such as this, and the lack
    of public punishment, led some in the United States to worry about Chinese companies’
    involvement and motives. For the United States and allied countries, such occurrences
    do little to ease suspicions about the PRC’s activity in the telecommunications
    sector. Even when the source of the problem is known, these events raise to the
    surface the question of attribution. A variation of the usual theme is, at what
    point are actions and consequences the result of commercial missteps or driven
    by political'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'and military interests? This example is just another facet to the many-sided
    and increasingly perplexing cybersecurity dilemma.


    In the backdrop to these events, it is important to remember that China''s long-range
    strategy is ambitious. The government is seeking to break the country''s dependence
    on imports from foreign producers for two reasons: First, it wants to build an
    industrial sector of globally competitive semiconductor domestic firms. With this
    industrial base, China hopes to capture the revenue streams that currently accrue
    to foreign companies. Second, China feels it needs to build a bulwark against
    foreign threats to its national security by breaking “the technological dominance
    of the West and [strengthening] the country’s position in the cybersecurity war,”
    according to Dieter Ernst, senior fellow at the East-West Center.9


    Finally, China’s cyber operations reflect the leadership’s priority of assuring
    the continuation of the Chinese Communist Party’s (CCP) governing authority: Economic
    development, military rebuilding, border security, and domestic stabilization
    are, in the view of the CCP, organically linked with the hardening and enlargement
    of its power.10 The philosophy stretches back to the founding days of the People’s
    Republic of China when a Leninist military was as required to support and safeguard
    Chinese Communist Party rule as it was to defend China’s territory. Therefore,
    unlike the authority exercised by counterparts in the West, PLA unit commanders
    are subject to control by political commissars and party committees who demand
    a role in all major decisions. As the PLA begins an era of reform, these issues
    will need to become reconcilable.


    The PLA retains features designed to maintain Party control over the military
    such as the CMC [Central Military Committee] (which is technically an organ of
    the CCP Central Committee), political commissars, and Party committees. Indeed,
    the reforms have emphasized the need to strengthen the “absolute leadership” of
    the Party. The need for Party consultation and unity could reduce the flexibility
    and autonomy of commanders, especially at the operational level.11


    In 2016, China unveiled its program to reform the organizational structure of
    the PLA, which will carry through to 2020—and possibly beyond. However, the simultaneous
    goals of a more technological, flexible, and responsive force and the creation
    of more robust party supervision and control over military affairs appear to be
    and may occur at cross purposes. Leninist tradition and constructs persist today
    and can conflict with the PLA’s need to reconfigure the system that streamlines
    command and control, combats corruption, and improves its ability to conduct joint
    operations across multiple domains. A challenge for the CCP will be how to maintain
    these Leninist concepts as they reenvision their cyberstrategies and restructure
    their security apparatus during this reorganization period.


    # Nation-State Economic Espionage


    Experts have known for the better part of a decade that the PLA (People’s Liberation
    Army), one of the world’s largest military forces, with an annual budget of $146.67
    billion, FY 201612 (total U.S. defense budget = $582.7 billion, FY 2017, according
    to the DoD13), has had “tens of thousands of trainees launching'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'attacks on U.S. computer networks.”14 These trainees might not officially be
    acting on behalf of the Chinese government, thus allowing the PLA to plausibly
    deny its involvement in an attack. In order to fill the ranks, the government-sponsored
    Network Crack Program Hacker (NCPH) identifies proficient groups of hackers through
    competitions. Those selected receive monthly stipends from the PLA. They are recruited
    to not only ply their craft on foreign targets, but also to teach army cadets
    the tactics and tools for conducting cyberwarfare.15 The results have been impressive.
    Joel Brenner, a former senior government counterintelligence official whose past
    posts include inspector general for the National Security Agency and chief executive
    of the Office of the Director of National Intelligence, remarks about China’s
    cyber threat,


    Some [attacks], we have high confidence, are coming from government-sponsored
    sites. The Chinese operate both through government agencies, as we do, but they
    also operate through sponsoring other organizations that are engaging in this
    kind of international hacking, whether or not under specific direction. It’s a
    kind of cyber-militia.... It’s coming in volumes that are just staggering.16


    Since 2014, the picture of the spreading collusion between China’s military and
    intelligence services, on the one hand, and private corporations on the other
    has become more unambiguous. Reports reveal that Chinese hacking apparatuses not
    only operate from the mainland, but also from third-world countries with weak
    cybersecurity capabilities in order to further mask the source perpetrator or
    true intentions of an attack.17 Despite the globe-spanning cyber infrastructure
    and evasion tactics aimed at hindering attribution of the perpetrator, the U.S.
    Department of Justice has successfully traced a number of Chinese hacks of U.S.
    corporate entities, which since have become well documented and the subject of
    much global security literature. The aim of these operations was to gain unauthorized
    access to these computer systems in order to steal information. Despite some successful
    efforts at interdiction, many operations are still active, and more continue to
    be launched. The data that these exploits capture benefits Chinese corporations
    commercially and, in the longer outlook, China economically. As then director
    of the FBI James Comey stated, “For too long, the Chinese government has blatantly
    sought to use cyber espionage to obtain economic advantage for its state-owned
    industries.”218


    Although collusion between official and nonofficial Chinese entities is ambiguous,
    the U.S. legal code is clear. National security trade secrets can be commercial
    trade secrets under section (a) of 18 U.S.C. § 793, “Gathering, Transmitting,
    or Losing Defense Information. Activity targeting this type of intellectual property
    meets the legal definition of espionage.” Unfortunately, while the law may be
    well defined, enforcement and prosecution are uncertain and, at best, tenuous.
    In the past, these efforts were even futile. For a while, Chinese authorities
    have been able to claim plausible deniability regarding these intrusions. However,
    there are indications that diplomatic pressures and appropriate sanctions can
    have an impact.


    As a result of recent attacks, the U.S. government responded with punitive actions
    against the PLA. In 2014, for the first time, the U.S. Justice Department'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'took the extraordinary step of indicting Chinese government personnel with
    the charge of conducting commercial cyber espionage. Five officials came under
    indictment. By the following year, in another unprecedented move, the Obama administration
    authorized and prepared a list of economic sanctions against specific Chinese
    individuals and corporations for their roles in these operations. According to
    the cybersecurity firm FireEye, these actions had an impact in Beijing and might
    have influenced events.19 Shortly after the announcement of these threats sanctioning
    Chinese commerce, cybersecurity analysts noticed a marked decline of intrusion
    activity against the United States and other countries from China-based hacker
    groups.20


    However, the larger picture in international relations also holds out some hope
    for pragmatism to prevail in the area of U.S.-Sino affairs. Despite the inextricable
    competition between the United States and the People''s Republic of China on so
    many fronts, each nation has a vested interest in the other''s future. China holds
    more than $1 trillion of American sovereign debt—helping to fill the shelves of
    Walmart and Target while employing millions of Chinese. Without diving into the
    balance sheets, it is important to keep this context in mind as we explore the
    political statements of the leaders. As their economic and financial relationship
    becomes more intimate, it is oftentimes evident that China and the United States
    can come to an understanding that their economic interdependence is threatened
    by a cyberwar. Therefore, the push and pull of this superpower rivalry is tempered
    by a need to work toward a delicate balance between the state versus state competition
    and the complex patterns of change in a hyper-connected globalized economy. Yet,
    until that delicate balance is reached, the competition will continue on various
    fronts and in a conflict arena that is simultaneously asymmetrical and non-asymmetrical.


    # Box 4.1 U.S. Indictments of PLA Hackers (2014)


    Summary of the Indictment

    Defendants: Wang Dong, Sun Kailiang, Wen Xinyu, Huang Zhenyu, and Gu Chunhui,
    who were officers in Unit 61398 of the Third Department of the Chinese People''s
    Liberation Army (PLA). The indictment alleges that Wang, Sun, and Wen, among others
    known and unknown to the grand jury, hacked or attempted to hack into U.S. entities
    named in the indictment, while Huang and Gu supported their conspiracy by, among
    other things, managing infrastructure (e.g., domain accounts) used for hacking.


    Victims: Westinghouse Electric Co. (Westinghouse), U.S. subsidiaries of SolarWorld
    AG (SolarWorld), United States Steel Corp. (U.S. Steel), Allegheny Technologies
    Inc. (ATI), the United Steel, Paper and Forestry, Rubber, Manufacturing, Energy,
    Allied Industrial and Service Workers International Union (USW), and Alcoa Inc.
    Time period: 2006–2014.


    Source: https://www.justice.gov/opa/pr/us-charges-five-chinese-military-hackers-cyber-espionage-against-us-corporations-and-labor.'
