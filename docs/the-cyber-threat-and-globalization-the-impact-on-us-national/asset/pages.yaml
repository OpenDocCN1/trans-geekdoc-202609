- pgno: 171
  md: 'one cause becomes more difficult.”¹⁵ A radical website serves to lure in an
    ordinary person who was otherwise looking for information without the intention
    of joining a terrorist organization. Radical websites mix legitimate content with
    propaganda designed to disrupt a person’s psyche.


    **Violent extremism:** Radicalization is complete when the influenced individual
    moves from the opinion pyramid into the realm of actively supporting a specific
    terrorist act, or facilitating it in some material way beyond the realm of ideas.¹⁶
    Radicalization is the transformation of a neutral person from one who is not inclined
    to commit or support a terrorist act to one who does. This leads to the jihadization
    phase, in which the online relationship between individuals serves to incite terrorist
    attacks by encouraging violent action and providing the material required for
    this action.¹⁷


    It must be noted that radicalization is not a one-way street. Throughout the process
    of radicalization, there are not only drivers but also inhibitors. Intervention
    by family and friends and other counteractivators, such as a deeper understanding
    of a political event, can reverse the individual’s course during the radicalization
    process.


    Two examples illustrate the reality of online radicalization for recruitment through
    ideas and later action. On November 23, 2009, the U.S. Federal Bureau of Investigation
    announced the largest (unclassified) recruitment operation on U.S. soil. The Al-Shabab
    organization, an Al-Qaeda–affiliated group, successfully recruited several young
    men using the Internet as a propaganda distribution tool. The FBI reported that
    Al-Shabab does not have any significant on-the-ground presence in the United States,
    preferring to create Internet videos targeting a younger crowd of Muslims living
    in the West.¹⁸ The recruits emigrated from Somalia to the United States over a
    decade ago, only to return to their homeland after being radicalized and engage
    in combat on behalf of Al-Shabab.


    In a second, more publicized incident, Major Nidal Malik Hasan opened fire on
    U.S. military and civilian personnel at Fort Hood, Texas, on November 6, 2009.
    The gunfire and shots drew most of the media attention; however, the shooting
    truly began at the ideological level. Hasan’s mind is influenced in part by jihadists
    exchanging information via the Internet.¹⁹ Online, he was able to network with
    radicals whom he may have been acquainted with in the offline world. Participating
    in a self-referential online Islamist environment catalyzed the radicalization
    process, transforming Hassan into a terrorist who preferred to influence policy
    with violence.


    There has been much coverage of Hasan’s ties to the Dar al Hijrah mosque in Great
    Falls, Virginia, where he attended sermons and held his mother’s funeral in 2001.
    His presence in the mosque coincided with the attendance of two of the perpetrators
    of the attacks of September 11. Further, the radical cleric Anwar al-Awlaki, who
    has been accused of supporting attacks on troops and supporting terrorist organizations,
    was the imam at the mosque. While it is uncertain whether or not Hasan had begun
    to sympathize with Islamist ideology prior to attending services at this mosque,
    it has become clear from investigations that he continued to stay in contact with
    al-Awlaki via the Internet. Indeed,'
