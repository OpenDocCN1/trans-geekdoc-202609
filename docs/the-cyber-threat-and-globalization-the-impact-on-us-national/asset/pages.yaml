  md: '# Box 5.2 Russian Trolls


    The purpose of "trolling" is to make it appear that there are massive armies of
    followers across the spectrum that uphold policies favorable to Russia''s position
    or the candidates who support those views. The word troll became a popular tag
    in the 1990s for Internet users trying to frustrate online conversations with
    vitriol, fake news, or spam. Both sides of an issue might resort to trolling to
    denounce politicians, harass journalists, or discredit demonstrators with false
    accounts of violence, rioting, or looting, all activities designed to make it
    as difficult as possible for the public to separate the truth from fabrication
    and undermine the opposition''s narrative. Russian-sponsored trolls usually maintain
    multiple false profiles and adhere to precise guidelines. Russia reportedly controls
    and manages a large number of bloggers through its troll farms, which it supervises
    through the Presidential Administration. The number of people working for Russian
    troll farms is believed to be in the thousands.


    In the case of the 2016 U.S. presidential campaign, Russia planned to exploit
    the U.S. political process regardless of the election result. Its preference for
    Donald Trump was clear. However, the prospects for a Trump victory oscillated
    between slim and possible for most of the campaign, leaving the Kremlin to hope
    for the best and gird for the worst. Putin loathed Clinton and blamed her for
    aiding and inciting anti-Kremlin protests in Moscow in 2011–2013. He regarded
    her as a more hawkish threat than President Obama and believed his hopes to expand
    Russia''s geopolitical influence and overturn economic sanctions would meet with
    stiffer resistance in a Clinton administration.


    A 2015 International Monetary Fund (IMF) report estimated that Western sanctions
    and Russian countersanctions as a response to Russia''s incursion into Ukraine
    were costing the economy 1–1.5 percent in GDP and as much as 9 percent of GDP
    over the intermediate term. Sanctions included a restriction on the export of
    drilling and fracking technology, which would inhibit access to as much as $8.2
    trillion in oil reserves. The drop in oil prices had an added impact and was shrinking
    the Russian economy to the level of Spain and Australia. Putin knew the economic
    pressures on Russia would eventually translate into a political problem for his
    government. The Kremlin''s best options were either a President Trump or a delegitimized
    President Clinton. While opinion polls unanimously projected Clinton to win, pro-Kremlin
    bloggers arranged Twitter campaigns to cast aspersions on a Clinton victory. Prior
    to the vote, an account, #DemocracyRIP, was readied. During this time, Russian
    trolls and diplomats publicly denounced the election process as a sham and prepared
    to continue the allegations of a "rigged system" after the election and during
    her presidency.


    In the run-up to the November election, Russian cyber operations not only included
    the intrusion into and disclosure of information from the Democratic Party''s
    data banks (as mentioned above) but also the capture of data from state and local
    election boards, think tanks, primary campaigns, and lobbying'
