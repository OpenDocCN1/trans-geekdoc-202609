  md: 'contractors who provide their clients with stolen intellectual property, trade
    secrets, financial data, and details of business plans or merger and acquisition
    contracts. An example is the group Wild Neutron, or Morpoh—more commonly known
    as the **Butterfly Group**.


    Butterfly targets intellectual property and insider trading information for resale.
    It is a hacker-for hire group “ready to go to work for anyone motivated enough
    to hire them.”46 Pharmaceutical formulas, manufacturing designs, and strategic
    planning details all fall within their list of targets. A 2015 report by Symantec
    stated, “Butterfly is financially motivated, stealing information it can potentially
    profit from. The group appears to be agnostic about the nationality of its targets,
    leading us to believe that Butterfly is unaffiliated to any nation state.”47 As
    of 2015 it is believed to have successfully exfiltrated corporate secrets from
    forty-nine organizations in more than twenty countries.


    Butterfly and similar mercenary and espionage groups obtain specific knowledge
    of information to steal and the systems from which to steal the data through competitor
    sources or organization insiders. Watering hole exploits are a common attack vector.
    Symantec further asserts that Butterfly may not be solely profiteering from its
    attacks as “hackers for hire,” targeting corporations on request. The group may
    also select its own targets and either sell stolen information to the highest
    bidder or use it for insider trading for its own purposes.48 Among its victims
    are several multibillion-dollar companies operating in the Internet, IT software,
    pharmaceutical, and commodities sectors. Twitter, Facebook, Apple, and Microsoft
    are among the companies, to date, that have publicly acknowledged attacks.49


    As discussed above, estimates on the extent of cybercrime are difficult to assess,
    and the volume of economic loss is as difficult to valuate. Ranges extend from
    a few billion dollars to hundreds of billions. Data collection is complicated,
    particularly when it concerns the theft of intellectual property. Additionally,
    some companies are unaware of their losses, while others make efforts to conceal
    them.50 As malware commoditizes and the cost of bot rentals drops, there will
    be more entrants into illegal markets, and access to technology will compound.


    # **“Psyber Warfare”**


    Cyberspace can be broken down into three main layers: content, connectivity, and
    cognition. Within the United States, we focus on cybersecurity at the connectivity
    layer and argue that any attempt to limit the free flow of content is against
    our fundamental principles. For example, in 2011, the White House International
    Strategy for Cyberspace was subtitled “Prosperity, Security and Openness in a
    Networked World,” focused on promoting the Internet Freedom Agenda within international
    forums. Doing so focuses a suspicious international audience on the United States
    as being a greater proponent of using the Internet as a tool for democratization
    via freedom of speech rather than on the economic benefits of open networks resulting
    in national prosperity.


    U.S. involvement in openly promoting and organizing “digital activists” in the
    fight for free flows of information has generated international friction that'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'is counterproductive to promoting international cooperation on cybersecurity
    issues. The “Internet Freedom Agenda” is one example of this phenomenon. The Department
    of State is openly distributing “activist” software designed to circumvent cybersecurity
    measures within authoritarian regimes. Such technology effectively allows citizen-activists
    to hack past government digital sentries to spread forbidden information. Other
    tools allow activists to don digital disguises and organize themselves into social
    movements designed to topple regimes. Officials in Russia, China, and other nondemocratic
    countries have declared these activities as tantamount to spearheading digitized
    regime change. From their perspective, the United States is aiding and abetting
    criminal activity. This does not contribute to our national efforts to secure
    cyberspace. For many countries, the content the Department of State is enabling
    to spread is just as dangerous from their perspective as malicious code or intellectual
    property theft is to us. While the Internet Freedom Agenda clearly articulates
    a balance of security with freedom, taking worldwide Internet use out of national
    contexts to create a one-size-fits-all model is a flawed approach that undermines
    global cybersecurity cooperation and ignores the legitimate threat of what we
    term _psyber warfare_.


    The Internet is not a luxury. It is a critical tool that when unrestricted allows
    information and knowledge to flow freely across the globe. This opens new possibilities
    for economic development and innovation. A by-product of this is freedom of thought
    and expression. Internet freedom is a policy that is inconsistently applied within
    the United States. While the U.S. State Department, the originator of the policy,
    advocates for freedom of speech worldwide, this policy causes unnecessary friction
    with allies and competitors alike. The Europeans have strong laws against xenophobic
    speech that are contrary to the spirit of the Internet Freedom Agenda. The Department
    of Defense plays whack-a-mole with terrorists, and authoritarian regimes see the
    agenda as a direct threat to their regime stability. Indeed, after the Russian
    interference in the U.S. election, it appears that “fake news” can have an impact
    on electoral outcomes. From Washington to Paris via Madrid, governments in democratic
    societies are beginning to understand that free flows of information without regard
    for the potential political consequences of the content may detrimentally affect
    societal stability. It will be a delicate balancing act not to go down a slippery
    slope and follow a Chinese or Russian model of censorship of information. However,
    the Internet Freedom Agenda as it was may no longer be that altruistic policy
    option that attempted to globalize the First Amendment via the Internet.


    Similar challenges resulting from the misuse of the Internet occur in the United
    States. While our responses are not as severe as those in repressive regimes,
    there is some resemblance to what occurs in less democratic societies.


    Although the United States has an established democracy, counterterrorist politics
    restrict some uses of the Internet. During the 2009 G20 Pittsburgh Summit, anarchists
    in New York were arrested for allegedly scanning police frequencies and using
    Twitter to inform the antiglobalization protesters as to the actions of law enforcement.
    During the 2011 London riots, the free flow of information was also cut off, citing
    national security. Juxtapose this with Jasmine revolutionaries protesting in China
    who are arrested for national security concerns for organizing themselves with
    similar technologies.'
