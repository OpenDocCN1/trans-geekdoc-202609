- pgno: 151
  md: '# Box 5.1 CyberBerkut


    The group''s name was derived from Ukraine''s special police force, named Berkut
    (or “golden eagle” in Ukrainian), which was created in 1992 under the Ministry
    of Interior Affairs. Not only did the CyberBerkut group use the special forces’


    designation, but they also imitated their insignia. Below the CyberBerkut name
    is their slogan, “We won’t forget, We won’t forgive.”


    Source: TrendMicro.


    The interdependence between Russian and Ukrainian networks had the potential to
    cause disruption of Russia’s communication systems through widespread and uncontrolled
    viral contamination. For that reason, additional action would have been unwarranted
    given the early successes. Plus, the full extent and scope of cyber capability
    left the Ukrainian defense to speculate over the true potential of the threat
    as long as these forces remained in reserve.


    Since events began, the cybersecurity firm CrowdStrike reports that “Russian-based
    adversaries” can include in their cyberwar operations incursions against Ukraine
    on the battlefield, in the civil sector, and on critical infrastructure. These
    strikes are accompanied by relentless disinformation operations.29 As long as
    Russia forcefully demands that other countries respect its spheres of influence
    in the near abroad and in any region that it regards as within its security orbit,
    it will use all means available to counter whatever threat it perceives as existential.
    These means include information operations and information warfare. According
    to the 2013 document “Basic Principles for the Russian Federation’s State Policy
    in the Field of International Information Security to 2020,” the strategy embraces


    > the use of information and communication technology as an information weapon
    for political and military purposes with a view to interfering in the internal
    affairs of states, . . . undermining public order, inciting ethnic, racial or
    religious hostility, promoting racist and xenophobic ideas and theories leading
    to hate and discrimination and encouraging violence.130


    # The United States


    In the mid- to late 1990s, a cyberattack began exfiltrating thousands of sensitive
    but unclassified documents from a swath of research institutes, universities,
    and government facilities that included Los Alamos National Laboratory, Sandia
    National Laboratory, and the U.S. Army. Similar victims appeared in the United
    Kingdom, Canada, Brazil, and Germany. The FBI team covering the investigation
    code-named the operation “Moonlight Maze.” Analysts later attributed the intrusion
    to a hacker group known as Turla, which some forensic specialists contend may
    have links with the Russian Academy of Sciences in Moscow.131 Eventually, Moonlight
    Maze spread to the Navy, the Department of Energy, the Air Force, and NASA. By
    the time of its peak, officials concluded that the total'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'number of stolen files, if printed and stacked, would be taller than the Washington
    Monument.132 The Turla group first gained notoriety when its exploit compromised
    classified material at the Department of Defense in 2008. The Uroburos APT that
    Russian hackers injected into Ukrainian government systems also may have been
    developed by Turla. The exploit continues to vex defense contractors, embassies,
    and governments around the world and establishes the odd fact that a hacking tool
    developed twenty years ago may still be effective against current high-value targets.133


    Moonlight Maze may have been the first signal that the world was entering a new
    era of continuous cyber espionage, but by 2014 2015, it appeared that Russia was
    altering course. While other states and their proxies furiously stole and sold
    military secrets, Russia turned its cyber capabilities to include political action.134
    Targets like the U.S. State Department, the Joint Chiefs of Staff, and the White
    House had worth above their value as a cache of information for espionage purposes.
    Hackers determined that they are, in addition, valuable reservoirs of material
    for influence operations. To any foreign adversary, the ability to shape public
    opinion to impact policy or elections is a greater prize than most state or corporate
    secrets. Therefore, Russian hackers also coveted access to both major political
    parties, state and local electoral boards, and media outlets.


    There are several ways of influencing U.S. elections through cyber operations.
    Manipulating the count and restricting voter participation are two methods. Both
    would be heavy lifts for a foreign adversary. Altering the vote count, although
    plausible, would require a rather large and costly personnel force.135 The approximately
    nine thousand election districts of nonstandardized voting systems make it difficult
    to conduct and coordinate a nationwide cyber campaign to “adjust” vote tallies.
    Such an effort would entail deploying on-site agents across the country to inject
    malicious code. A scheme of this size and scope would be exorbitantly expensive
    and hard to conceal given that a small army of operatives might be too overt to
    avoid suspicion. Furthermore, any anomalies of historical voter patterns would
    raise flags. Even with the elimination of nonstrategic districts, this kind of
    operation requires a staff with unique expertise and resources. However, access
    to the voter database of a major U.S. political party or significant affiliate
    or campaign would make this scenario far more feasible.


    Suppressing the vote by hacking into voter registration files and purging names
    based on party affiliation can influence the vote as well. Such a cyber operation
    might frustrate turnout and skew voter attrition to favor one choice at the expense
    of another.136 These ploys can demobilize segments of the electorate and subdue
    their support for one candidate or party. However, this also might be too conspicuous,
    as massive delays and heavy provisional ballot demand in strategic districts would
    also most likely draw attention. Nonetheless, investigations could undercut confidence
    in the process and delegitimize results regardless of the outcome. For an adversarial
    actor whose aims are to spread doubt and stir controversy over any given election
    or the democratic process in general, this could be viewed as a victory.


    Another method is by influencing the vote through active measures. Freedom of
    expression protects minorities, dissentient voices, and artistic work,'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'but it also gives cover to those who spread baseless claims, conspiracy theories,
    and the hiss of inuendo that incites racism and xenophobia. Free societies are
    often divided ideologically, and the same opportunity to create fissures between
    population segments can in some instances instigate violence. While separately
    these ploys come with individual risks and flaws, a combination of such stratagems
    might produce an effective blend of schemes potent enough to sway an election.


    Because the U.S. two-party system effectively creates a winner-take-all end game,
    manipulation by a foreign adversary is an inviting prospect, particularly if one
    candidate is decidedly preferred over the other. With no experience in coalition
    government, and with the structure and stricture of the electoral college, the
    deeply divided country subjects itself to a binary choice where the outcome hangs
    on the voter results of a handful of strategic states.137 Thus, despite risks
    of discovery, the stratagem to manipulate the U.S. election process remains a
    seductive temptation for influence operations.


    Active measures take particular advantage of the vulnerabilities inherent in liberal
    democracies. These actions have a history during and since the end of the Cold
    War, and more recently, such actions have already delivered results—particularly
    in Europe. In addition to the examples described in detail above, former German
    chancellor Gerhard Schroeder and former Italian prime minister Silvio Berlusconi
    were accused of profiting from their connections with Putin and, in a like-for-like,
    influencing foreign and domestic policies to accommodate the Kremlin.138 Observers
    also link the rise of extremist and populist parties in the Netherlands, the Czech
    Republic, Hungary, Switzerland, Serbia, Denmark, Austria, Finland, and France
    to Russian influence campaigns, financial support, and even legal assistance.139
    Attempted, but less successful, ventures include efforts to interfere with the
    2014 Scottish independence referendum and a foiled hack of the United Kingdom’s
    parliamentary elections in 2015.140


    In the United States, Russia has relied on some tried, tested, and more tolerable
    methods, such as appealing to Beltway think tanks, applying diplomatic pressure,
    and hiring lobbying firms. Yet, as long as cyber-related influence vectors141
    represent a tempting option, the democratic process of free and open elections41
    is always at risk of foreign interference. In the world of social media, there
    are no editorial mechanisms to distill factual data from white noise. Access to
    constituency segments is transnational and includes extremist groups, fringe elements,
    or any aggrieved population who feels their fears have been muted and their voice
    unheard. In the United States, polls reveal a single-digit approval rating of
    Congress by the American people, reflecting an abiding discontent with Washington.
    A study by the Pew Research Center during the 2016 presidential election asserted
    that not only were Americans more divided than at any other time in the last two
    decades, but their opinion of the mainstream media had reached a historic low.142
    When the background noise of outrageous assertions and “fake news” swamps attempts
    to elevate the truth and conduct reasonable discourse, these conditions magnify.
    Irrational fears amplify and fringe thought leavens to the height of legitimate
    election issues.143 For Russia, the chaos presents opportunity.'
