    even if an action is not specifically prohibited by the LOAC, it may still be
    unlawful if it is deemed to have been unnecessary. The United States has rejected
    this position as not properly reflecting the state of the law as contained within
    international treaties or state practice.⁸⁶


    Distinction. The principle of distinction, as codified in Article 48 of Additional
    Protocol (I) to the Geneva Conventions, requires that “the Parties to the conflict
    shall at all times distinguish between the civilian population and combatants
    and between civilian objects and military'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'objectives and accordingly shall direct their operations only against military
    objects.87 Military objectives are those “objects which by their nature, location,
    purpose or use make an effective contribution to military action and whose total
    or partial destruction, capture or neutralization, in the circumstances ruling
    at the time, offers a definite military advantage.88” This delineation is necessary
    to ensure that all parties have the respect due for civilians and their property,
    which are supposed to be protected as much as possible from the vagaries of war.89


    In the cyber context, the application of the principle of distinction would prohibit
    cyber attacks capable of destroying enemy computer systems directed against ostensibly
    civilian infrastructure, such as computer systems belonging to stock exchanges,
    banking systems, and universities. However, many cyber assets are used for both
    military and civilian purposes, which can complicate the analysis. Such “dual-use”
    systems are lawful military objectives if they make an effective contribution
    to the enemy’s warfighting efforts.90 This increasing interconnection between
    military and civilian cyber infrastructure has rendered civilian systems potentially
    more at risk. Electrical grids, communications nodes, transportation systems—all
    are potentially lawful military targets. This is also an issue with kinetic operations,
    but the reach and scope of cyber capabilities increase the opportunity to actually
    carry out operations against such objects.


    Case Study: Operation Orchard, 2007. Just before launching an air strike on Syrian
    nuclear facilities in 2007, Israel apparently used cyber techniques to reduce
    the effectiveness of Syrian air defenses, enabling their jets to carry out the
    mission unhindered. Integrated air defense systems are clearly valid military
    targets.91


    The principle of distinction would also prohibit the use of cyber attacks against
    civilians. However, civilians who engage in attacks, including attacks of a


    cyber nature, are deemed to be “directly participating in hostilities,” which
    consequently causes them to lose the protections generally accorded to civilians
    and become valid targets.92 Interestingly, the general rule that civilians should
    not be used to engage in attacks can be difficult to apply in cyber operations.93
    The U.S. policy about which cyber activities amount to an attack is unclear, so
    determining which activities would qualify a civilian as directly participating
    in hostilities can be a challenge. Also, the issue with civilians participating
    in fighting is that they can compromise the safety of non-participating civilians.
    However, as the nature of cyber operations is such that they may be conducted
    from distant and secure locations, there is no practical additional danger to
    civilians caused by cyber operators launching cyber attacks. It is possible that
    civilians conducting cyber operations amounting to an attack could be subject
    to criminal prosecution either by the enemy or by an international tribunal.


    Ultimately, although cyber attacks upon either dual-use objects or civilians directly
    participating in hostilities would not be prohibited by the principle of distinction,
    as with attacks on all other valid targets, such strikes still need to be tempered
    through the application of the principle of proportionality discussed below.


    Finally, the principle of distinction would prohibit the use of indiscriminate
    cyber weapons that cannot be directed at a specific military objective or limited
    in their effects.94 For example, combatants could not employ a cyber weapon that
    strikes randomly once employed and thus could just as easily strike a protected
    computer system as one constituting a valid military objective.95 Combatants would
    also be prohibited from employing a type of malware that is capable of targeting
    specific military objectives but which, upon striking its objective, spreads uncontrollably
    and causes harm to purely civilian networks.96


    Proportionality. The principle of proportionality finds its expression most'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'clearly in Article 57(2)(iii) of Additional Protocol (I) to the Geneva Conventions,
    which states that parties to an armed conflict are to “refrain from deciding to
    launch any attack which may be expected to cause incidental loss of civilian life,
    injury to civilians, damage to civilian objects, or a combination thereof, which
    would be excessive in relation to the concrete and direct military advantage anticipated.”97
    This principle recognizes that civilians and civilian objects, while generally
    protected from being made the direct object of attack, may, in some situations,
    be incidentally harmed by a strike conducted against a valid military target.98
    In such situations, however, those ordering a strike should remain mindful of
    the protections generally afforded civilians and civilian objects and thus take
    feasible measures to limit the collateral damage that attacks will generate.99
    In the cyber context, for example, it would be important when planning a cyberspace
    operation against a military computer system to assess the potential for damage
    to private civilian computers that hold no military significance but just happen
    to be networked to the military computers that will be struck.100 In situations
    where collateral damage may be difficult to quantify or fully predict, the requirement
    is to consider all apparently reliable information reasonably available at the
    time.101


    However, when examining the concept of proportionality in the context of a specific
    cyberspace operation, keep in mind the distinction between collateral damage and
    collateral effects. While cyberspace operations may result in death or destruction—collateral
    damage—that must be taken into account when calculating the proportionality of
    a strike, cyberspace operations may also result in nondestructive collateral effects,
    such as inconvenience, irritation, stress, or fear, which need not be considered
    when determining whether a particular attack was proportional.102 For example,
    a minor, brief disruption of Internet services to civilians might result incidentally
    from


    a cyber attack against a military objective. The inconvenience caused by this
    disruption would be a collateral effect that would need to be measured and compared
    against the military advantage gained for purposes of a proportionality analysis.103


    Humanity. The principle of humanity (also known as the principle of unnecessary
    suffering) is codified in Article 35(2) of Additional Protocol (I) to the Geneva
    Conventions. Under this provision, parties to a conflict are prohibited from employing
    “weapons, projectiles, and material and methods of warfare of a nature to cause
    superfluous injury or unnecessary suffering.”104 Basically, one may only inflict
    the amount of suffering that is absolutely necessary to accomplish a military
    objective. Any suffering above and beyond that is inhumane.105 This principle
    is most often used to prohibit the use of weapons that are crafted in such a way
    as to create suffering above and beyond that which is necessary or to prohibit
    the use of otherwise legal weapons in ways that are calculated to cause such an
    unnecessary amount of suffering.106 In the cyber context, for example, if an enemy
    combatant has an Internet-addressable pacemaker device with a built-in defibrillator,
    it would be lawful to take control of the pacemaker to kill him or to otherwise
    take him out of the fight. However, it would be unlawful to conduct the operation
    in a manner that is intended to cause additional pain and suffering for his own
    sake, such as stopping his heart and reviving him multiple times before killing
    him.107


    In order to ensure compliance with the principle of avoiding unnecessary suffering,
    the DOD requires a legal review of all weapons before the military is permitted
    to use them.108 The DOD’s requirement to review weapons predates Additional Protocol
    I, but the rule observed by other legally compliant states is Article 36 of the
    protocol. The DOD, in its reviews, ensures that its weapons are not inherently
    indiscriminate and that they are not calculated to cause superfluous'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'injury. Additionally, the DOD ensures its weapons are in compliance with specific
    treaties, such as those banning poisoned and biological weapons.109


    Reviews of kinetic weapons are relatively straightforward; they may involve test
    firing weapons and field tests. Cyber weapons, on the other hand, are not only
    difficult to review but also difficult to even define.110 On the contrary, cyber
    methods of warfare are susceptible to review, and methods of warfare, although
    less often discussed, are also addressed in the prohibition of unnecessary suffering.
    Terrorism, starvation, and perfidy (discussed below) are all examples of prohibited
    means of warfare.111 For example, as discussed above, methods of cyber warfare
    that are indiscriminately destructive are unlawful, including the random distribution
    of malware that damages physical computer components. Of course, the military
    utility of such a method of warfare seems relatively limited. As technology advances,
    legal advisors will need to be ready to review new methods for compliance.


    The DOD Law of War Manual provides little guidance to practitioners regarding
    the legal review of cyber weapons. It merely notes that “[n]ot all cyber capabilities
    . . . constitute a weapon or weapons system” and then directs readers to regulations
    of the various services.112 Unfortunately, the services have not been especially
    forward leaning in defining cyber weapons.


    The Air Force is the first, and to date only, service to regulate the issue specifically.
    Air Force Instruction (AFI) 51-402, Legal Reviews of Weapons and Cyber Capabilities,
    defines weapons as “devices designed to kill, injure, disable or temporarily incapacitate
    people, or destroy, damage or temporarily incapacitate property or materiel.”113
    Generally, it is computer code or hacking techniques that form the basis of a
    cyber attack. Much less often does a cyber attack involve a physical device. So,
    most of the time, the instrumentality of a cyber attack will not qualify as a
    cyber weapon under the Air Force’s


    formulation. The instruction addresses this gap with the term “cyber capability.”
    A cyber capability is “any device or software payload intended to disrupt, deny,
    degrade, negate, impair or destroy adversarial computer systems, data, activities
    or capabilities.”114 The definition of cyber capability goes on to exclude “a
    device or software that is solely intended to provide access to an adversarial
    computer system for data exploitation.”115


    Once something is defined as a cyber capability (and not intended for espionage),
    a rigorous requirement for legal review attaches. The Air Force requires that
    “all cyber capabilities being developed, bought, built, modified or otherwise
    acquired by the Air Force . . . are reviewed for legality under LOAC, domestic
    law and international law prior to their acquisition for use in a conflict or
    other military operation.”116 On its face, this provision requires a new legal
    review every time a line of code is modified. As this could happen dozens of times
    during the course of a single operation, and would happen thousands of times during
    the development process, how the Air Force will actually administer the requirement
    is unclear.


    The Tallinn Manual takes a different approach, in that it appears to put more
    responsibility on the operational legal advisor to ensure compliance with the
    law, recognizing the speed at which operations may proceed.117 The Tallinn Manual
    also excludes any requirement for a new review when code is changed in a minor
    or insignificant way. Finally, the Tallinn Manual does not exempt capabilities
    from legal review based on the motivation behind their intended use but rather
    focuses on the effect of the capability in the operational context.118


    Honor. The principle of honor (also known as chivalry) stands for the proposition
    that the application of the weapons of war should be tempered by “a certain amount
    of fairness in offense and defense and a certain mutual respect between opposing
    forces.”119 Basically, as'
  merge: -1
