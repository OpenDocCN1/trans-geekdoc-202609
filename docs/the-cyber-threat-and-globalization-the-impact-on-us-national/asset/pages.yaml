- pgno: 35
  md: 'Ultimately, most cyberattack sources are not affiliated with any state and
    act privately. Fewer than ten of the nearly two hundred sovereign governments
    in the world are commonly cited as having most of the capacity or intent for cyberattacks.
    These operations are usually under the authority of intelligence or military agencies—designated
    by the U.S. government as either foreign intelligence services (FISs) and/or foreign
    intelligence and security services (FISSs).


    Yet it is important to note that as national borders become blurred by the imperatives
    of global commerce and manipulated by the lure of transnational crime, so do the
    roles of state and nonstate actors become complex and transformative. The dependence
    on interlocking networks for commerce, financial services, communications, utility
    grids, government, and military logistical needs puts all countries at risk. Without
    some form of global governance that establishes the scope of legitimate responses
    to cyberattacks and norms about the use of cyberweapons, the grand hope of a vast
    public good will diminish.¹ Undermining that hope is the prospect of a post-Cold
    War remilitarization. Many believe it is a likelihood, which has earnestly and
    irrevocably begun.


    For-profit criminals account for approximately 75 percent of cyberattacks.² Of
    that category, as much as 80 percent of digital crime involves some form of organized
    activity.³ Other estimates claim the percentage is as high as 90 percent.⁴ These
    acts include computer-related fraud, forgery, and identity offenses. Although
    the definitions of cybercrime and organized crime impact these numbers, the involvement
    of some sort of organized effort continues to drive activity.⁵ The size of these
    groups may range from small criminal units to loose ad hoc networks or organized
    crime that operates on a larger scale. Regardless of their size, organized cybercrime
    is an expanding global phenomenon.


    On the whole, transnational organized crime (TOC) benefits from globalization
    and technology much the way global businesses do. Access to technological innovation
    and the formation of global goods and financial markets have offered opportunities
    to criminal organizations. Exploiting markets, taking advantage of capital and
    exchange rate spreads, and moving funds and personnel are not limited to the world
    of licit business. In cybercrime, TOC finds another field of operations to exploit.
    What is more, criminals do not need complex skills, formal education, or training
    to ply their craft in this area.


    Organized crime is aided by an accelerated and robust black market that facilitates
    cybercrime growth and allows for a vibrant exchange of sophisticated and new exploitable
    technologies. Malware tool kits, or exploit kits, are available online. These
    packets offer capabilities to nontechnical types who are looking to deliver a
    malware payload and control an infected system remotely. They often include user-friendly
    web interfaces for creating Internet platforms for future exploitation.⁶


    The cyber black market is responsible for a cycle of malware creation that includes
    a niche for zero-days. As mentioned earlier, there already is an established market
