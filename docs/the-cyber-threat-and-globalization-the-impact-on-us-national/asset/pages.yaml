  md: 'A year after Barack Obama''s reelection, events outside Russia were unfolding,
    and a new military doctrine was taking form. A Russian military forum in February
    2013 featured an article attributed to General Valery Gerasimov, chief of the
    General Staff. It was called “Value of Science in Anticipation: New Challenges
    Require Rethinking of the Forms and Methods of Warfare.” Despite its innocuous
    title, the document was groundbreaking. While it restated the elements and significance
    of unconventional warfare, it urged an emphasis on nonmilitary methods and instruments
    to achieve military effects.144 The article went further to suggest that the use
    of espionage, propaganda, and cyberattacks be adapted at a four to one ratio of
    nonmilitary to military measures in order to contain the use of armed force.145
    The calculation gave the doctrine (now referred to as the Gerasimov doctrine)
    a new scope of opportunity during times of peace and the flexibility to adjust
    the ratio as situations warrant during open conflict.


    Gerasimov believed that this approach, referred to as hybrid war in the West and
    nonlinear war by Russia, was behind the West-inspired Arab Spring and color revolutions.
    Despite the advantage strong central regimes have over democratic societies in
    mobilizing economic, media, and other nongovernmental “assets” for military objectives,
    the Gerasimov doctrine sees this strategy as singularly Western and proposes a
    Russian variant. A particular focus within the thesis of the Gerasimov doctrine
    is the element of “protest potential of the population.”146 This model works most
    effectively when the preconditions of a disaffected population are present and
    sympathetic to calls for mobilization. The rumbling distrust by the American public
    of Washington, the news media, and elites in general provided a conditio sine
    qua non for active measures and nonlinear war tactics to shape the political landscape.
    In his observations of events taking place during the Arab Spring, Gerasimov’s
    essay noted that “a perfectly thriving state can . . . be transformed into an
    arena of fierce armed conflict, become a victim of foreign intervention, and sink
    into a web of chaos.”147


    Four years after the publication of this article, as if completing Gerasimov’s
    thoughts, the office of the Directorate of National Intelligence released to the
    public its own document, “Assessing Russian Activities and Intentions in Recent
    US Elections.” Its key judgment read as follows:


    We assess Russian President Vladimir Putin ordered an influence campaign in 2016
    aimed at the US presidential election. Russia’s goals were to undermine public
    faith in the US democratic process, denigrate Secretary Clinton, and harm her
    electability and potential presidency. We further assess Putin and the Russian
    Government developed a clear preference for President-elect Trump. We have high
    confidence in these judgments.148


    The report goes on to say that the Russian messaging strategy was a campaign employing
    the resources and personnel of government agencies, third-party intermediaries,
    and state-funded media.149 Activities included cyber operations by covert military
    units, intelligence services, and paid “trolls” who took to social media and posted
    pro-Kremlin propaganda under fake identities.'
