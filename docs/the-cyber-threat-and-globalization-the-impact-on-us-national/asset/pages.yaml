  md: '# Box 4.3 China''s 2017 Cyber Security Law Overview


    +   - Create internal security management systems and operating policies, appointing
    dedicated network security persons.

    +   - Adopt technological measures to prevent computer viruses, cyberattacks,
    network intrusions, and other harmful activities.

    +   - Monitor and record network operational status and network security incidents
    and retain relevant network logs for at least six months.

    +   - Take measures to classify data and back up and encrypt important data.

    +   - Critical information infrastructure (CII) and CII operators must comply
    with more stringent requirements on top of those applicable to all network operators.
    The Cyber Security Law (CSL) provides for the state to implement key protections
    for CII in public communications.


    +   - Annual security assessment of CII operators shall review their network security
    and assess potential risk at least once a year, either by themselves or through
    a third-party provider.

    +   - Procurement security review: when purchasing network products and services,
    CII operators must sign a security and confidentiality agreement with their vendor,
    clearly setting out the duties and responsibilities for security and confidentiality.

    +   - CII operators are required to keep within mainland China all personal information
    and important data collected and generated within mainland China. They are not
    allowed to transmit such data overseas without first passing a security review.


    Source: Derived from: http://www.chinalawblog.com/2017/06/chinas-new-cybersecurity-law-the-101.html.


