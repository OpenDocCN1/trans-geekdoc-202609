    partnership, the NSSC dictates that


    > the federal government could not—and, indeed, should not—secure the computer
    networks of privately owned banks, energy companies, transportation firms, and
    other parts of the private sector. The federal government should likewise not
    intrude into homes and small businesses, into universities, or state and local
    agencies and departments to create secure computer networks. Each American who
    depends on cyberspace, the network of information networks, must secure the part
    that they own or for which they are responsible.57


    It is therefore apparent that national governments are responsible for putting
    the responsibility of cybersecurity on the private sector, which has gladly taken
    up the task. This has been described as a “wonk” approach to cybersecurity.58'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'In the United States, the picture continues to be bleak with regard to public
    ordering of cybersecurity. On the one hand, the Department of Homeland Security
    has announced a “Manhattan Project” for cybersecurity. Disappointingly, its aim
    and scope is solely “to protect the federal domain and ensure the secu- rity,
    resiliency and reliability of the nation’s information, technology and com- munications
    infrastructure.”59 The view of the private sector and individuals being responsible
    for their own cybersecurity continues to permeate government thinking. According
    to Secretary Michael Chertoff,


    > The federal government does not own the Internet, thank God, and it doesn’t
    own the nation’s cyber networks. You own the Internet and the nation’s cyber networks.
    The federal government cannot be everywhere at once over the Internet or in cyberspace.
    There is a network that operates within that domain. And as a consequence, the
    federal government cannot promise to protect every system, let alone every home
    computer from an attack.60


    This logic, which is tantamount to saying that everyone is responsible for pro-
    tecting their own home from attack since the police force cannot be everywhere,
    continues. Until public law enforcement takes the lead in securing cyberspace,
    with the private sector playing an important but secondary role, the Information
    Society will not maximize the utility of networks.


    # The Perils of Private Ordering: Network Effects, Trust, and Community Harm


    Recall Aristotle’s abstract conceptualization of the purpose of a polis’s rulers
    to provide legislation and distribute justice to a community, which in the mod-
    ern era is the Information Society. As discussed above, the Information Society
    depends on the free flow of information over computer networks. The utility of
    computer networks rests on the academic concept of network effects. That is, “The
    greater the size of a network, the greater the benefits.”61 A networked community
    benefits each time a new user joins that network. People tend to join networks
    if they can trust that they will benefit as members of the network.


    Neal K. Katyal, in “The Dark Side of Private Ordering: The Network/ Community
    Harm of Crime,” identifies the main reason for current cybersecurity strategies
    as being the wrong approach in addressing injustice in cyberspace. This, he argues,
    is in part due to the focus of criminal justice on the individual impact of a
    crime, rather than on the harm of a crime to the community at large.62 In his
    view, focusing on harm to the community rather than the individual impact of a
    crime is especially important in cyberspace, as each instance of a cybercrime,
    no matter how trivial it is, leads to the network’s users not trusting the network.63
    With each intrusion, mistrust increases, and the number of users using the compromised
    network decreases. As a result, the utility of the network to the remaining users
    decreases.64 Katyal argues against the common perception as documented in the
    UNGA resolutions, WSIS, IGF, and NSSSC that “the strong arm of law enforcement
    has no business when the only harm to a victim'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'is remote and intangible."65 This view is fallacious, since it focuses only
    on the individual harmed rather than the harm done to the computer network. Katyval
    argues that even breaches of computer networks motivated by curiosity seriously
    damage a community’s trust in the network, thereby decreasing the principle of
    the network effect. It follows that justice in the Information Society can be
    achieved only if injustice to the community is considered in addition to injustice
    to the individual. In order for the Information Society to reach its full potential,
    all cybercriminals should be tracked and punished to the fullest extent possible
    under the law so as to prevent the loss of trust and increase network usage.


    Even if laws exist, this does not mean that the crime will be prevented, since
    law enforcement authorities must have the capabilities and procedures to prevent,
    investigate, and prosecute cybercrime.66 Contrary to the views of the UNGA, WSIS,
    IGF, and NSSSC, Katyval argues that is the responsibility of law enforcement organizations,
    not private individuals or corporations, to enforce cyber law and prosecute all
    infringements. Private ordering efforts, such as proprietary antivirus or firewall
    software, will not prevent computer crime simply because this software or hardware
    is purchased and installed by a user, and the interest of private industry is
    to


    promote sales of anti-virus software, intrusion systems and the like. Yet, the
    ability to afford and the knowledge to use such technologies will not be distributed
    equally. Those with fewer resources will not be able to adopt them in the same
    way that richer individuals and institutions can. Further, because these technologies
    are often complicated, there will be some who have the resources to purchase them
    but lack the skills necessary to use them effectively.67


    Thus, since not all computer users will be able to afford or know how to use protection
    software, their computers will be prey to attackers. This gap will result in those
    without protective measures using the network less because they lack the trust
    in the network to allow for more migration of human activity into cyberspace.68
    Thus, these constraints indicate that private efforts cannot protect every user.
    Hence, governments must steer clear of the current approach and bear greater responsibility
    for network protection in order to ensure that the Information Society is a secure
    environment in which information flows freely.


    A further consequence of private industry being given the responsibility of securing
    cyberspace is that in their effort to assure they meet benchmarks set by the government,
    connectivity to their networks may be diminished.69 Put otherwise, if ISPs are
    burdened with the responsibility to assure that their services are not being used
    for criminal acts, they might react to any suspicious activity (no matter how
    slight) by purging users for such actions. This, too, harms open networks overall.


    One could argue that Katyval is being overly pessimistic in his view that the
    private ordering of cybersecurity harms the network and prevents the equal distribution
    of justice.


    However, currently, states are far from achieving this goal.'
