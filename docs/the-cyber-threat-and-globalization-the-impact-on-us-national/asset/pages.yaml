    # International Norms in Cyberspace


    Because states have been reluctant to agree on how the law applies to cyber operations,
    norms development has assumed a larger role in the discussion. Norms are “shared
    expectations among states about appropriate behavior.”72 The United Nations Group
    of Government Experts, of which the United States is a member, has suggested a
    series of norms that seem to have fairly widespread acceptance. They include


    the following: States should not knowingly allow their territory to be used for
    internationally wrongful acts and should not conduct or knowingly damage or impair
    the use of critical infrastructure or the information systems of emergency response
    teams. States should also cooperate to assist in criminal investigations involving
    information and communications technologies (cyber).73


    Although norms are not law, they do begin to define the behavior that might someday,
    through custom and practice, become international law. Because cyberspace is a
    new field of operations, states have seemed reluctant to agree to bind themselves
    legally. More flexible norms and other confidence building measures may be the
    best option available at this point.74


