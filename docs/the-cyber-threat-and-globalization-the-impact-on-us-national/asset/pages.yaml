    are profound. To rely on a deus ex machina to resolve these issues might


    # Box 8.2 Deep Learning


    Deep learning uses structures loosely inspired by the human brain, consisting
    of a set of units (or “neurons”). Each unit combines a set of input values to
    produce an output value, which in turn is passed on to other neurons downstream.
    For example, in an image recognition application, a first layer of units might
    combine the raw data of the image to recognize simple patterns in the image, a
    second layer of units might combine the results of the first layer to recognize
    patterns of patterns,


    a third layer might combine the results of the second layer, and so on. Deep learning
    networks typically use many layers—sometimes more than one hundred—and often use
    a large number of units at each layer to enable the recognition of extremely complex,
    precise patterns in data.


    Source: “Preparing for the Future of Artificial Intelligence,” Executive Office
    of the President, National Science and Technology Council Committee on Technology,
    October 2016.'
