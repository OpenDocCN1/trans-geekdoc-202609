  md: 'expressed in Article 35(1) of Additional Protocol (I) to the Geneva Conventions,
    the principle of honor is an explicit recognition that “in any armed conflict,
    the right of the Parties to the conflict to choose methods or means of warfare
    is not limited.”120 Most commonly, honor prohibits killing, injuring, or capturing
    an adversary through acts of perfidy, defined in Article 37(1) of Additional Protocol
    (I) to the Geneva Conventions as “acts inviting the confidence of an adversary
    to lead him to believe that he is entitled to, or is obliged to accord, protection
    under the rules of international law applicable in armed conflict, with intent
    to betray that confidence.”121 The rationale is that such actions would potentially


    +   - Undermine or dilute the effectiveness of the protections afforded by the
    LOAC,

    +   - Impair the ability of the parties to interact in a nonhostile way, such
    as through diplomatic negotiations, and

    +   - Damage the basis for the restoration of peace short of the total destruction
    of one party by another.122


    For example, in the cyber context, the principle of honor or chivalry would prohibit
    the use of e-mail to invite the enemy to a meeting with a representative of the
    International Committee of the Red Cross (an internationally recognized protected
    symbol) with intent to lead enemy forces into an ambush.123


    The principle of honor is not intended to prohibit all types of military deception.
    Article 37(2) of Additional Protocol (I) to the Geneva Conventions expressly allows
    ruses of war, which are “acts which are intended to mislead an adversary or to
    induce him to act recklessly but which infringe no rule of international law applicable
    in armed conflict and which are not perfidious because they do not invite the
    confidence of an adversary with respect to protection under that law.”124 In the
    cyber context, such lawful ruses would include the creation of a dummy computer
    system simulating nonexistent forces, transmission


    of false information causing an opponent erroneously to believe operations are
    about to occur or are under way, bogus orders purported to have been issued by
    the enemy commander, etc.125


    In any event, application of this principle in cyberspace may be especially difficult,
    as the notion of honor in long-range combat is already strained. It seems almost
    quaint that in cyber warfare, from thousands of miles away, where foes are effectively
    reduced to electrons and icons on a computer screen, a notion of fair play would
    be part of the combat equation. Nevertheless, it is included in the Law of War
    Manual.


    One particular oddity in the Law of War Manual’s discussion of honor is its assertion
    that there is an obligation to avoid inconvenience to civilians, but only in the
    case of cyber operations. “[E]ven if a cyber operation is not an “attack” or does
    not cause any injury or damage that would need to be considered under the proportionality
    rule, that cyber operation still should not be conducted in a way that unnecessarily
    causes inconvenience to civilians or neutral persons.”126 It is not clear why
    the DOD included this language in the cyber operations chapter when inconvenience
    isn’t a consideration in warfare, as noted elsewhere in the Law of War Manual.127
    The principles apply during times of war, when causing death and destruction is
    lawful, at least under the appropriate circumstances. Under these conditions,
    the attention due avoiding mere inconvenience is de minimis.


    **Case Study: Republic of Georgia, 2008.** The most straightforward use of cyber
    warfare is when cyber activity is taken in conjunction with kinetic action, and
    the best known example of this occurred in 2008 when Russia invaded the Republic
    of Georgia. Concurrent with the movement of Russian troops into South Ossetia
    (the region of Georgia Russia targeted), the majority of websites in the region
    were taken down. Additionally, cyber attacks took down Georgian government websites
    at the same time.128'
