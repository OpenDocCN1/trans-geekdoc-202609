- pgno: 30
  md: 'Available since 1999 and officially launched in 2012, IPv6 is no longer hypothetical—nor
    is the transition from IPv4. Today’s Internet is already in the process of conversion.
    Once the shift is complete, it will be the first time in the Internet’s history
    that the underlying protocol (TCP/IP) will have changed. The impact of this transition
    will affect U.S. and global commerce and security for the next twenty to fifty
    years.61


    Outside the United States, the transferral has begun and has been gathering momentum.
    In August 2012, the European Internet registry exhausted its supply of addresses,
    resulting in the European Internet registry only giving carriers IPv6 addresses.62
    In April 2011, the Asia-Pacific region was no longer able to meet IPv4 demand,
    and IPv6 became mandatory for building new Internet networks and services as the
    final IPv4 spaces are rationed out to the Asia Pacific Network Information Centre
    (APNIC).63


    The United States is at a disadvantage for transition. Because we pioneered the
    Internet, we own legacy technology that is IPv4. Thus, the cost of transitioning
    is higher than for most other countries that do not have this legacy infrastructure
    and can migrate directly to IPv6-compatible infrastructure without dual-stacking
    during the transition period and then shutting off IPv4 (a dual-stack device is
    a device with network interfaces that can originate and understand both IPv4 and
    IPv6 packets). Security issues and availability of replacement applications and
    other system resources also inhibit the conversion process in the United States.


    Meanwhile, IPv6 transition is strongest in the Asia Pacific region given that
    its IPv4 allocation expired in 2012. In fact, the China Education and Research
    Network is the largest IPv6 network in the world. The Asia-Pacific region now
    effectively becomes the first IPv6-enabled region. Hence, there is a greater operational
    understanding of how IPv6 implementations operate in the wild outside the United
    States.64 At the present time, the adaption rate in the United States is approximately
    20 percent.65 However, the conversion has been sporadic and uneven. Some reports
    hint that it may have plateaued, raising doubts about whether the adoption rate
    will be sufficient to accommodate the anticipated growth of IoT.66


    As mentioned above, a contributing inhibitor is the lag time between the growth
    of IoT and the expansion of high-speed Internet and advanced telecommunication
    services. The deployment of IPv6 and its massive address space, in conjunction
    with the convergence of industrial sensing systems with the Internet, is also
    driving the third major change in the cyber landscape: the intensification in
    the use of broadband mobile devices. While urban centers and their surrounding
    areas are well networked, rural locales lack infrastructure. They also lack the
    economic incentive for private sector investment. Low-density population rates
    and the high cost of wiring an expansive geographic area limit development. While
    commercial enterprises dither, government programs are not yet in place to adequately
    fill all needs.67 The result is a supply-demand gap that slows the infrastructure
    build-out.


    The lag time for upgrading to IPv6 also inhibits the process of creating a more
    secure cyber environment by delaying the incorporation of “traceback”'
