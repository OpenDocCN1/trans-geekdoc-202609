  md: '# Box 3.1 Heuristic Algorithm versus Genetic Algorithm


    # Heuristic Algorithm


    Heuristic algorithms find solutions among all possible options. However, the most
    optimum solution is not guaranteed. These algorithms approximate and are directional
    rather than absolute. They find a solution close to the best one, quickly and
    easily. However, solutions might be optimal, despite the algorithm''s suppression
    of some of the problem''s demands.


    # Genetic Algorithm


    A genetic algorithm is a method for solving both constrained and unconstrained
    optimization problems based on a natural selection process that mimics biological
    evolution. The process continually adjusts a population of individual solutions
    and randomly selects ones from the current population, which at each step are
    used as parents to produce creations for the next generation. Over successive
    generations, the population “evolves” toward an optimal solution.


    # “Swarmcasting”—Terrorists, Protesters, and Hired Guns


    The use of media platforms as a logistics and recruiting tool by terrorist groups
    such as ISIS, Jabhat al-Nusra, and their affiliated groups is well known and well
    documented. According to Ali Fisher, “media mujahedeens” avoid exposure and interdiction
    by platform owners and government agencies by relying on emergent and self-organizing
    behaviors. Working in clusters, operating through a dispersed network of accounts,
    constantly reconfiguring (reorganizing in midflight as bees or birds do), the
    new net warriors form “swarmcasts,” which take advantage of the interconnectedness
    of networks. The ability to repost and distribute information over a span of less
    time and a greater variety of locales is a key advantage over legitimate actors
    who attempt to remove their content.39 A key element to these networks is the
    absence of a single hub point where all information must flow. The concept runs
    counter to the design of hub and spoke networks. These centralized constructs
    are vulnerable to debilitation if a central node is lost, whereas “these operations
    are emergent, collective behaviors of a complex system—much the way hurricanes
    and ecosystems self-organize in nature.”


    Content can be domiciled “on thousands of devices around the world with copies
    of a film dispersed so widely it then has a permanent presence as it can be re-shared
    any time a copy is removed or a user requests a specific video.” Media mujahedeen
    are also reconfiguring the mix of platform comprising the swarmcast.40


    The parallel with guerrilla war also illustrates the similarities between kinetic
    operations and cyber in “irregularized” warfare against pyramidal structures.
    As with their predecessors from earlier ages, these net war combatants operate
    in'
