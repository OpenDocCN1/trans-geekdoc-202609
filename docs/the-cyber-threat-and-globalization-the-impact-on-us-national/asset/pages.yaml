    # Unfettered Growth and Challenges


    The sheer growth of the Internet has opened the system to greater risk. By the
    mid-1990s, business took over the role as the driving force behind the design
    and future direction of the Internet. ISPs were quick to realize the benefit of
    having a voice communication over Internet protocol (VoIP). Advances in tech nology
    allowed connections between the Internet and traditional phone lines (PTN—public
    telecommunication network) and resulted in further consumer demand. This revolution
    in ICT forced greater interdependency between PTNs and the Internet. It also increased
    our reliance on computer networks as these systems became more software driven.
    Over the years, the epidemic demand for larger-scale operations and more access
    points has been transformative in its impact on communication and commerce. The
    ceaseless expansion of the web has further elevated the risk of vulnerability.28


    Today when we refer to the Internet, we are not discussing a monolithic framework
    of connections but rather a complex network of hardware, software, protocols,
    and phantasmagoria of evolving technology. A 2007 report esti mated that at least
    80 percent of U.S. commerce flowed through the Internet.29 Content-wise, it is
    a domain with three billion users and, as of 2014, has an eco nomic impact of
    $6.3 trillion.30


    At the core of cyberspace are the standards and protocols that allow for interoperability
    and functionality. As the most potent manifestation of cyberspace,'
