    +   • Real


    Unlike integers that are discrete values from one natural number to another, the
    continuous value numbers of the set of real numbers in Mathematics are called
    real or floating-point/point8, or simply float. Not all real numbers can be accurately
    represented in computer science because many have infinite decimal places. However,
    according to the level of precision, we want these numbers can be approximated
    well enough. The use of the IEEE 754 standard to represent real or floating-point
    numbers has been agreed for several decades, using scientific notation.


    This notation allows you to represent numbers with a mantissa (significant digits)
    and an exponent separated by the letter ‘e’ or ‘E’. For example, the number 4000
    is represented by the mantissa 4 and the exponent 3, 4e3. It reads 4 times from
    10 to 3. The number 0.25 is also represented as 25e-2. It is also allowed to omit
    the initial zero, .25 and the real number 4.0 can be entered as 4. (without the
    zero after the period).


