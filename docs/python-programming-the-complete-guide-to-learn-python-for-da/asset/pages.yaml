- pgno: 11
  md: 'Very often most programmers in this language will hear someone say something
    related to the Python philosophy which is very similar to the Unix philosophy.


    These principles were famously described by Python developer Tim Peters in Python
    Zen.


    +   - Beautiful is better than ugly.

    +   - Explicit is better than implicit.

    +   - Simple is better than complex.

    +   - The complex is better than complicated.

    +   - The flat is better than nested.

    +   - Scattered is better than dense.

    +   - Readability counts.

    +   - Special cases are not so special as to break the rules.

    +   - The practical gains the pure.

    +   - Errors should never be passed silently.

    +   - Unless they have been silenced explicitly.

    +   - Faced with ambiguity, rejects the temptation to guess.

    +   - There should be one - and preferably only one - obvious way to do it.

    +   - Although that way may not be obvious at first unless you are Dutch.

    +   - Now it''s better than ever.

    +   - Although it is never better than now.

    +   - If the implementation is difficult to explain, it is a bad idea.

    +   - If the implementation is easy to explain, it may be a good idea.

    +   - Namespaces are a great idea. Let''s do more of those things!


    Tim Peters, The Python Zen.'
  merge: -1
  img_proc: true
