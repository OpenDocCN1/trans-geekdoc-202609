    \n```\nage = int(input(\"How old are you? \"))\nif age < 18:\n    print (\"Are\
    \ you minor\")\nelse :\n    print (\"Are you of legal age\")\nprint (\"iGoodbye!\"\
    )\n```\n\nAlthough it is not advisable, instead of an \"if ... else\" block you\
    \ could write a program with two \"if\" blocks ...\n\n```\nage = int(input(\"\
    How old are you? \"))\n```"
