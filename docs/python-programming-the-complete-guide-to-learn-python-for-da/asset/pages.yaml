    +   • Integers


    In mathematics, the integers are the natural numbers, their negatives and zero.
    Examples of integers: 5, -20, 0, -104. Numbers with decimal parts are not included
    among the integers, such as 3.4. Integers, in most programming languages including
    Python, are defined with the word int. Python has an internal type function that
    returns the given data type:


    ```

    >>> type(7)

    <class ''int''>

    >>> a = 45

    >>> type(a)

    <class ''int''>

    ```


    In C ++ or Pascal 4 bytes (32 bits are used, and one bit is reserved for the sign,
    signed 32-bit) for standard integers (int, integer), represented in the number
    range:


    -2147483648... 2147483647


    For greater range in these languages, 8 bytes (signed 64-bit) are used, declaring
    them as long or int64:


    -263......263 -1


    Unlike C++ or Pascal, in Python integer data is stored with “arbitrary precision”,
    that is, the number of bytes needed to represent the integer is used. For example,
    the numbers 5 (binary: 101) and 200 (2^7 + 2^6 + 2^3 , binary: 11001000) are represented:'
