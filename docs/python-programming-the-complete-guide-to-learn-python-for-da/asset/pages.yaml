- pgno: 72
  md: "The if ... elif ... else ... control structure allows you to chain several\
    \ conditions.\nelif is a contraction of else if. The order in Python is written\
    \ like this:\n\nConditional statement syntax if ... elif ... else ...\n\nThe syntax\
    \ of the if ... elif ... else ... construct is as follows:\n\n```\nif condition_1:\n\
    \    block 1\nelif condition_2:\n    Block 2\nelse :\n    block 3\n```\n\n+  \
    \ - If condition 1 is met, block 1 is executed\n+   - If condition 1 is not met\
    \ but condition 2 is met, block 2 is executed\n+   - If neither condition 1 nor\
    \ condition 2 is met, block 3 is executed.\n\nThis structure is equivalent to\
    \ the following nested if ... else ... structure:\n\n```\nif condition_1:\n  \
    \  block 1\nelse :\n    if condition_2:\n        Block 2\n    else :\n       \
    \ block 3\n```\n\nYou can write as many elif blocks as necessary. The else block\
    \ (which is\noptional) is executed if none of the above conditions is met."
  merge: -1
  img_proc: true
