    # # Invalid examples


    ```

    print re.findall(regexp,"cos (0)") != ["cos (0)"]

    #>>> True

    print re.findall(regexp,"sqrt(x)") != ["sqrt(x)"]

    #>>> True

    ```


    As we see, the first invalid example is precisely not valid because we do not
    allow spaces between the name of the function and the parentheses. The second
    is wrong because the parameter is a letter instead of a number.


    Let''s see another one, this time we want to find strings that contain escape
    characters () and quotes


    ```

    regexp = r """(?:[^\\]|(?:\.))*"""

    ```


    In this case, first we are going to look for chains that are enclosed in quotation
    marks (r """), what we find, we will find it zero or more times (r ""(? :)*"""),
    (? :) matches the regular expression in the parentheses. Next, we want anything
    other than a \\, and note that we must escape it (r "" (?:[^\\") "" *) Or (|)
    a. followed by any character (r "" (?:[^\\]|(?:.))"" *)


    # Examples:


    ```

    regexp = r """(?:[^\\]|(?:\.))*"""

    ```


    # # Valid examples:


    ```

    print re.findall(regexp,"I say, \"hello.\"") == ["I say, \"hello.\""]

    #>>> True

    ```


