    \ of one or more sentence blocks to the fulfillment of one or more conditions.\n\
    \n# Conditional statements: if ...\n\nThe if ... control structure allows a program\
    \ to execute instructions when a condition is met. \"If\" means \"yes\" (condition)\n\
    \nConditional statement syntax if ...\n\nThe syntax of the if construct is as\
    \ follows:\n\n```\nif condition:\n    here are the orders that are executed if\
    \ the condition is true\n    and that can occupy several lines\n```\n\n# The execution\
    \ of this construction is as follows:\n\n+   - The condition is always evaluated.\n\
    +   - If the result is True, the statement block is executed\n+   - If the result\
    \ is False, the sentence block is not executed.\n\nThe first line contains the\
    \ condition to evaluate and is a logical expression. This line must always end\
    \ with a colon (:).\n\nNext comes the block of orders that are executed when the\
    \ condition is met (that is when the condition is true). It is important to note\
    \ that this block must be indented since Python uses the indentation to recognize\
    \ the lines that form an instruction block. The bleeding that is usually used\
    \ in Python is four spaces, but more or less spaces can be used. When writing\
    \ two points (:) at the end of a line, the editor will automatically bleed the\
    \ following lines. To finish a block, just go back to the beginning of the line."
