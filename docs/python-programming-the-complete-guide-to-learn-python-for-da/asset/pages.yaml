  md: '# Chapter 5: Files & Error Handling In Python


    # Handling Exceptions in Python


    Let''s start with a simple program to add two numbers in Python. Our program takes
    two parameters as input and prints the sum. Here is a Python program to add two
    numbers:


    ```

    def addNumbers(a,b):

    print a + b

