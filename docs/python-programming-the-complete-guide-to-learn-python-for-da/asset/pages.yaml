    # conditional statement if ... elif ... else ...


    In the structures if ... elif ... else ... the order in which the cases are written
    is important and, often, the conditions can be simplified by properly ordering
    the cases.


    We can distinguish two types of situations:


    # 1- When the cases are mutually exclusive


    Consider a program that asks for age and depending on the value received gives
    a different message. We can distinguish, for example, three situations:


    +   - if the value is negative, it is an error

    +   - if the value is between 0 and 17, it is a minor

    +   - if the value is greater than or equal to 18, it is a minor


    Cases are mutually exclusive since a value can only be in one of the cases.'
