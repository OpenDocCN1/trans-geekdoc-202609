  md: 'other languages such as Pascal it would be of type character (char).


    # Composite or structured data


    Composite or structured data includes data with elements of values of the same
    type or of different types, which are represented unified to be saved or processed.


    +   - Characterized string data: string


    The string data type is the basic structure for handling text, which includes
    alphanumeric characters and other characters of the ASCII or UTF-8 encoding. Strings
    in Python are defined in single ('') or double (") quotes. They can also be defined
    in triple quotes ("" ") when multiple lines are thrown. For example,


    ```

    >>> ''Hi''

    ''Hi''

    >>> b = "Wooden house"

    >>> type(b)

    <class ''str''>

    >>> type (15)

    <class ''int''>

    >>> type (''15'')

    <class ''str''>

    ```


