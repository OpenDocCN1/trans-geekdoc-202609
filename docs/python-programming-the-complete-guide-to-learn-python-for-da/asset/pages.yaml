  md: "# 2-When some cases include others\n\nConsider a program that asks for a value\
    \ and tells us:\n\n+   - if it is a multiple of two,\n+   - if it is a multiple\
    \ of four (and two)\n+   - if it is not a multiple of two\n\nNote: The value 0\
    \ will be considered a multiple of 4 and 2.\n\nThe cases are not mutually exclusive,\
    \ since the multiples of four are also multiples of two.\n\nThe following program\
    \ would not be correct:\n\n```\n```python\n# This program does not work properly\n\
    number = int (input (\"Enter a number:\"))\nif number % 2 == 0:\n    print (f\
    \ \"{number } is a multiple of two\")\nelif number % 4 == 0:\n    print (f \"\
    {number } is a multiple of four and two\")\nelse :\n    print (f \"{number } is\
    \ not a multiple of two\")\n```\n```\n\nThe error of this program is that if number\
    \ meets the second condition, it also meets the first. That is, if number is a\
    \ multiple of four, as it is also a multiple of two, it meets the first condition\
    \ and the program executes the first block of instructions, without checking the\
    \ rest of the conditions.\n\nOne way to correct that error is to add in the first\
    \ condition (if) that the number is not a multiple of four.\n\n```\n```python\n\
    number = int (input (\"Enter a number:\"))\nif number % 2 == 0 and number% 4!\
    \ = 0:\n    print (f \"{number} is a multiple of two\")\nelif number % 4 == 0:\n\
    \    print (f \"{number} is a multiple of four and two\")\n```\n```"
  merge: -1
