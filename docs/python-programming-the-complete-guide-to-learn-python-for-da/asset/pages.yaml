  md: "# # Python History And Evolution\n\nThe history of Python as a programming\
    \ language begins in the late 80s and early 90s with Guido Van Rossum, a history\
    \ of 29 years of development.\n\nOn a Christmas in 1989, Guido Van Rossum, who\
    \ worked at the CWI (a Dutch research center), decided to start a project as a\
    \ hobby giving continuity to ABC, a programming language that was developed at\
    \ the CWI.\n\nRetrieve words from a document in ABC Retrieve words from a document\
    \ in PYTHON\n\n```\nHOW TO RETURN words document:\nPUT {} IN collection\nFOR line\
    \ IN document:\n    FOR word IN split line:\n        IF word not.in collection:\n\
    \            INSERT word IN\ncollection\nRETURN collection\n\ndef words(document):\n\
    \    collection = set()\n    for line in document:\n        for word in line.split():\n\
    \            if word not in collection:\n                collection.add(word)\n\
    \    return collection\n```\n\nABC was developed in the early 80s as an alternative\
    \ to BASIC, it was designed for beginners for its ease of learning and use. His\
    \ code was compact but readable.\n\nThe project did not transcend as the hardware\
    \ available at the time made its use difficult. So, Van Rossum gave it a second\
    \ life creating Python.\n\nGuido Van Rossum liked the Monty Python group, for\
    \ this reason, he chose the name of the language. Currently, Van Rossum continues\
    \ to play the central role in deciding the direction of Python."
