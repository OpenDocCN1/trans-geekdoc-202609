- pgno: 9
  md: '# 1- General-Purpose Language


    That means that it is not aimed at a specific purpose, such as PHP, specially
    designed to make websites.


    With Python, you can create pages without having a high knowledge (with Javascript
    as a powerful ally), but also make scripts or software for the Windows operating
    system.


    There is still nothing featured for mobile devices, but you can use Kivy for this
    purpose.


    # 2- It is multiparadigm


    And what does that mean? Multiparadigm?


    Well, although its strong is object-oriented programming (it is a high-level language),
    there are other programming paradigms or styles for its users, such as imperative
    programming (with loop sentences) or functional programming (with modules and
    functions).


    So, if you don''t know anything about objects and only know how to write code
    using methods, you can use Python perfectly, which in other languages do that
    is impossible.


    # 3- Python is an interpreted language


    When you program in Python, you do not compile the source code to machine code,
    but there is an interpreter that will execute the program based on the code directly.


    Although this property suggests that programs may be slower, that in Python language
    is not usually so, that facilitates the development of the following feature.


    # 4- It is cross-platform


    Unlike many languages such as visual basic, which mainly you can only do things
    for Windows, with Python you can use it in many devices and operating systems
    since interpreters have been created for Unix, Linux, Windows and Mac Os systems.'
  merge: -1
  img_proc: true
