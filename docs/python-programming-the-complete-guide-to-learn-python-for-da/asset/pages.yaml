  md: '# 5- It is dynamic typing


    When you declare a variable, it is not necessary to tell what types the data is
    (if it is int, string, float, etc.). The variable adapts to what you write when
    the program is executed.


    Before this feature has always been criticized in other languages, for the optimization
    of memory, errors when writing code, etc. But with Python the goal is for language
    to help create software, not having to deal with peculiarities of the language.


    ![](img/6308792a7b2c124d01547ee394b31561_10_0.png)


    Similarly, Python is strongly typed, for example, you will not be able to add
    numbers and text (a variable of type int with one of the type strings) because
    it would give an error.


    # 6- It is object oriented


    We have already said that you can apply another programming style, making object-oriented
    software entails a series of standard advantages, especially when reusing components
    thanks to inheritance and its polymorphism functions.


