  md: "# Sample programs with conditional statements if ... else ...\n\nLet's see\
    \ an example. The following program asks the user for age and stores the answer\
    \ in the \"age\" variable. Then check if the age is less than 18 years. If this\
    \ comparison is true, the program writes that it is a minor and if it is false\
    \ write that it is of legal age. Finally, the program always says goodbye, since\
    \ the last instruction is out of any block and therefore is always executed. Below\
    \ you can see two step-by-step executions of that program:\n\n# Example of \"\
    if\" ... \"else\" ... 1\n\n```\nage = int(input(\"How old are you? \"))\nif age\
