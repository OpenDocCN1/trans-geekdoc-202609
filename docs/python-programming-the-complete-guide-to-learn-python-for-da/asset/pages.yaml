  md: '# # Regex in Python


    ```

    regex = r ''[a-z] + -? [a-z] +''

    ```


    The above expression will consider valid any string that begins with one or more
    letters ([az] +), followed by a hyphen, which is optional, that is, it may or
    may not appear in the string (-?) Followed again by one or more more character
    from a to z, in lower case.


    Some example cases are as follows:


    # # Valid examples:


    ```

    print re.findall(regex,"well-liked") == ["well-liked"]

    #>>> True

    print re.findall(regex,"html") == ["html"]

    #>>> True

    ```


    # # Invalid examples:


    ```

    print re.findall(regex,"a-b-c") != ["a-b-c"]

    #>>> True

    print re.findall(regex,"a--b") != ["a--b"]

    #>>> True

    ```


    The first expression of the invalid examples is not correct since the second indent
    is not expected by the regular expression, in the second example, the same occurs.


    The following example will be used to match strings that represent single parameter
    mathematical functions:


    ```

    regexp = r "[a-z] + (* [0-9] + *)"

    ```


    This will find strings that start with one or more letters ([az] +), we have to
    escape the parentheses to take them as something we want to be part of the string,
    since the parentheses have a special meaning in regular expressions, we escape
    them with \\, then we look for zero or more spaces (*) followed by numbers ([0-9]
    +) and again zero or more spaces.


    # Examples:'
  merge: -1
  img_proc: true
