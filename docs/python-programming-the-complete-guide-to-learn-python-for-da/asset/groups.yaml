    Python 和 C++ 等其他语言包含针对二进制数的逻辑运算符，按位执行。这些按位运算符对输入的十进制数对应的二进制数的位执行逻辑运算。例如，5 = 101
    和 6 = 110。如果按位进行“逻辑与”运算，你会得到二进制 100，即等同于 4 = 100。在机器语言级别，还会使用异或（exclusive or）运算符，当且仅当一个操作数为
    1 时返回 1。在 Python 中，如同在 C++ 中一样，位运算符如下。


    | 位运算 | 运算符 | 表达式 | 结果 |

    |---|---|---|---|

    | "逻辑与", and | & | 5 & 6 | 101 和 110 -> 100，十进制为 4 |

    | "逻辑或", or | \| | 5 \| 6 | 101 或 110 -> 111，十进制为 7 |

    | 异或 | ^ | 5 ^ 6 | 101 异或 110 -> 011，十进制为 3 |

    | 取反，not | ~ | ~x | 将 0 替换为 1，将 1 替换为 0。等同于 -x -1 |

    | 左移 | << | x << n | 返回 x 的位向左移动 n 位后的值。等同于 x * 2 **n |

    | 右移 | >> | x >> n | 返回 x 的位向右移动 n 位后的值。等同于 x // 2 ** n |


    ## 关系运算符（比较）


    它们用于比较 2 个表达式或值，结果始终为真或假，即布尔值。


    | 数学 | 在 Python 中 | 含义 | 示例 | 结果 |

    | :--- | :--- | :--- | :--- | :--- |

    | = | == | 等于 | ''a'' == ''b'' | 假 |

    | ≠ | != | 不等于 | ''b'' != ''B'' | 真 |

    | < | < | 小于 | 7 < 3 | 假 |

    | > | > | 大于 | 7 > 3 | 真 |

    | ≤ | <= | 小于或等于 | 7 <= 7 | 真 |

    | ≥ | >= | 大于或等于 | 7 >= 3 | 真 |


    在以下示例中，我们将使用关系运算符检查赋给变量 temp 的测量温度是否在 37 到 42 °C 之间（包含边界）。


    ```

    >>> temp = 38 # measured temperature

    >>> (temp >= 37) and (temp <= 42)

    True

    ```


    表达式 (temp >= 37) and (temp <= 42) 可以省略括号，因为关系运算符的优先级高于布尔运算符。Python 的特点是，这种表达式可以写成数学记法：37
    <= temp <= 42。Python 中类型为 a < b < c 的表达式表示 (a < b) and (b < c)，这提高了语言的可读性。


    属于 ASCII 表的字母字符（不包括 ñ）是有序的。小写字母的十进制等效二进制范围为 97 到 122，大写字母为 65 到 90。尽管在 Python
    中字符为字符串类型，但我们可以比较字符，其 True 或 False 结果将根据其 ASCII 位置给出。例如，''b'' > ''a'' 将返回 True。同样，''B''
    > ''a'' 将返回 False。


    在以下练习中，我们将查找一个表达式，当给定变量 car 且该变量是字母表符号时，该表达式为真：


    ```

    >>> car = ''q''

    >>> (car >= ''a'') and (car <= ''z'') or (car >= ''A'') and (car <= ''Z'')

    True

    >>> # Equals to

    >>> ''a'' <= car <= ''z'' or ''A'' <= car <= ''Z''

    True

    >>> car = ''&''

    >>> ''a'' <= car <= ''z'' or ''A'' <= car <= ''Z''

    False

    ```


    结果可以赋给布尔变量：


    ```

    >>> is_letter = ''a'' <= car <= ''z'' or ''A'' <= car <= ''Z''

    >>> is_letter

    False

    ```


    在大多数语言（包括 Python）中，布尔值 True（逻辑 1）大于 False（逻辑 0）：


    ```

    >>> True > False

    True

    ```


