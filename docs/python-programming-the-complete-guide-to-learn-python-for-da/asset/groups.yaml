  md: "\n## Chapter 5: Files & Error Handling In Python\n\n### Handling Exceptions\
    \ in Python\n\nLet's start with a simple program to add two numbers in Python.\
    \ Our program takes two parameters as input and prints the sum. Here is a Python\
    \ program to add two numbers:\n\n```\ndef addNumbers(a, b):\n    print a + b\n\
    addNumbers(5, 10)\n```\n\nTry to run the previous Python program, and you should\
    \ get the printed sum.\n\nWhen writing the previous program, we don't really consider\
    \ the fact that something could go wrong. What would happen if one of the passed\
    \ parameters is not a number?\n\n```\naddNumbers(\", 10)\n```\n\nWe have not handled\
    \ that case, therefore, our program will break with the following error message\n\
    \n```\nTraceback (most recent call last):\nFile \"addNumber.py\", line 4, in <module>\n\
    addNumbers(\", 10)\nFile \"addNumber.py\", line 2, in addNumbers\nprint a + b\n\
    TypeError: cannot concatenate 'str' and 'int' objects\n```\n\nWe can handle the\
    \ above question by checking if the passed parameters are integers. But that does\
    \ not solve the problem. What happens if the code is broken for some other reason\
    \ and causes the program to crash? Working with a program that breaks when encountering\
    \ an error is not a good sight. Even if an unknown error has occurred, the code\
    \ must be robust enough to handle the break with grace and that the user knows\
    \ that something is wrong.\n\n### Exception Management Using Try and Except\n\n\
    In Python, we use the try and except statements to handle exceptions. When the\
    \ code is broken, an exception occurs without the program crashing. We will modify\
    \ the program that adds numbers to include the try and except statements.\n\n\
    ```\ndef addNumbers(a, b):\n    try:\n        return a + b\n    except Exception\
    \ as e:\n        return 'Error occurred: ' + str(e)\nprint addNumbers(\", 10)\n\
    ```\n\nPython would process all the code within the try and except statements.\
    \ When it finds an error, the control is passed to the except block, omitting\
    \ the code in the middle.\n\nAs seen in the previous code, we have moved our code\
    \ into a try and except statement. Try to run the program and you should throw\
    \ an error message instead of the program crashing. Also, the reason for the exception\
    \ is returned as an exception message.\n\nThe above method handles unexpected\
    \ exceptions. Let's take a look at how to handle an expected exception. Assume\
    \ we are trying to read a file with our Python program, but the file does not\
    \ exist. In this case, we will control the exception and let the user know that\
    \ the file does not exist when it occurs. Check out the file reading code:\n\n\
    ```\ntry:\n    try:\n        with open('fname') as f:\n            content = f.readlines()\n\
    \    except IOError as e:\n        print str(e)\n    except Exception as e:\n\
    \        print str(e)\n```\n\nIn the previous code, we have handled the file reading\
    \ within an IOError exception handler. If the code is broken due to the lack of\
    \ availability of the fname file, the error would be handled within the IOError\
    \ handler. Similar to the IOError exception, there are much more standard exceptions\
    \ such as ArithmeticError, OverflowError and ImportError, to name a few.\n\n###\
    \ Multiple Exceptions\n\nWe can handle multiple exceptions at once by joining\
    \ the standard exceptions as shown:\n\n```\ntry:\n    with open(fname) as f:\n\
    \        content = f.readlines()\n    print content\nexcept (IOError, NameError)\
    \ as e:\n    print str(e)\n```\n\nThe above code would show the IOError and NameError\
    \ exceptions when the program runs.\n\n### Clause finally\n\nSuppose we are using\
    \ certain resources in our Python program. During the execution of the program,\
    \ an error was found and only executed halfway. In this case, the resource will\
    \ be unnecessarily maintained. We can clean up such resources using the finally\
    \ clause. Check out the following code:\n\n```\ntry:\n    filePointer = open('fname',\
    \ 'r')\n    try:\n        content = filePointer.readline()\n    finally:\n   \
    \     filePointer.close()\nexcept IOError as e:\n    print str(e)\n```\n\nIf during\
    \ the execution of the previous code, an exception occurs when reading the file,\
    \ filePointer would be closed in the finally block.\n\n### Logs in Python\n\n\
    When something goes wrong within an application, it is easier to debug if we know\
    \ the source of the error. When an exception occurs, we can record the information\
    \ necessary to locate the problem. Python provides a simple and powerful log library.\
    \ Let's take a look at how to use Python records.\n\n```\nimport logging\n```\n\
    \n```\n# initialize the log settings\nlogging.basicConfig(filename='app.log',\
    \ level=logging.INFO)\n\ntry:\n    logging.info('Trying to open the file')\n \
    \   filePointer = open('appFile', 'r')\n    try:\n        logging.info('Trying\
    \ to read the file content')\n        content = filePointer.readline()\n    finally:\n\
    \        filePointer.close()\nexcept IOError as e:\n    logging.error('Error occurred\
    \ ' + str(e))\n```\n\nAs seen in the previous code, we first have to import the\
    \ Python log library and then initialize the logger with the log file name and\
    \ log level. There are five logging levels: DEBUG, INFO, WARNING, ERROR and CRITICAL.\
    \ Here we have to adjust the logging level to INFO; therefore, INFO and the previous\
    \ records will be registered.\n\n### Getting Stack Tracking\n\nIn the previous\
    \ code we had a program file, therefore it was easier to find out where the error\
    \ had occurred. But what do we do when it comes to several program files? In such\
    \ a case, getting the error stack helps in finding the source of the error. The\
    \ stack trace of the exception may have been recorded as shown:\n\n```\nimport\
    \ logging\n\n# initialize the log settings\nlogging.basicConfig(filename='app.log',\
    \ level=logging.INFO)\n\ntry:\n    filePointer = open('appFile', 'r')\n    try:\n\
    \        content = filePointer.readline()\n    finally:\n        filePointer.close()\n\
    except IOError as e:\n    logging.exception(str(e))\n```\n\nIf you try to run\
    \ the previous program, when an exception arises, the following error is recorded\
    \ in the log file:\n\n```\n[ERROR:root] [Errno 2] No such file or directory: 'appFile'\n\
    ```\n\n```\nTraceback (most recent call last):\nFile \"readFile.py\", line 7,\
    \ in <module>\n    filePointer = open('appFile', 'r')\nIOError: [Errno 2] No such\
    \ file or directory: 'appFile'\n```\n\n## Chapter 6: Common Python Questions &\
    \ Answers\n\n### 1. What is the difference between list and tuples in Python?\n\
    \nAnswer:\n\n| List Vs. Tuples |\n| :--- |\n| List | Tuples |\n| The lists are\
    \ mutable, that is, they can be edited. | Tuples are immutable (tuples are lists\
    \ that cannot be edited). |\n| Lists are slower than tuples. | Tuples are faster\
    \ than the list. |\n| Syntax: list_1 = [10, 'Chelsea', 20] | Syntax: tup_1 = (10,\
    \ 'Chelsea', 20) |\n\n### 2. What are the main features of Python?\n\nAnswer:\n\
    \n- Python is an interpreted language, contrary to other languages such as C and\
    \ variants, Python does not need to be compiled before being executed. There are\
    \ other interpreted languages such as PHP and Ruby.\n- Python is written dynamically,\
    \ this means that it is not necessary to indicate the types of variables when\
    \ they are declared or something. You can do things like x = 111 and then x =\
    \ \"I am a string\", without error.\n- Python adapts very well to object-oriented\
    \ programming because it allows classes to be defined along with composition and\
    \ inheritance. It has no input specifiers (such as public, private C++).\n- In\
    \ Python, functions are first-class objects. This means that they can be assigned\
    \ to variables, returned from other functions and passed to functions. Classes\
    \ are also first-class objects.\n- Writing Python code is fast, but execution\
    \ may be slower than compiled languages. Fortunately, Python allows you to include\
    \ C-based extensions, so bottlenecks can be optimized and often are. The numpy\
    \ package is a good example of this, is fast because most of the calculations\
    \ that Python does not do.\n- Python is useful in many areas: automation, web\
    \ applications, large data applications, scientific modeling, and many more. It\
    \ is also frequently used as an \"intermediary\" code to get other languages and\
    \ components to play well.\n\n### 3. What kind of language is Python? Programming\
    \ or scripting?\n\nAnswer:\n\nPython can create scripts, but it is a general-purpose\
    \ programming language.\n\n### 4. How is Python interpreted?\n\nAnswer:\n\nPython\
    \ is an interpreted language, which is not in machine-level code before its runtime.\n\
    \n### 5. What is PEP 8?\n\nAnswer:\n\nPEP is an acronym that represents the Python\
    \ Enhancement Proposal. It specifies how to format the Python code so that it\
    \ has maximum readability.\n\n### 6. How is memory managed in Python?\n\nAnswer:\n\
    \n- Python memory is managed by Python private heap space. Then, Python data objects\
    \ and structures are located in a private heap (a tree-like data structure). The\
    \ programmer has no access to this private heap, that is what the Python interpreter\
    \ takes care of.\n"
  mdcn: "\n\n## 第 5 章：Python 中的文件与错误处理\n\n### 在 Python 中处理异常\n\n让我们先从一个简单的 Python\
    \ 程序来添加两个数字开始。我们的程序将两个参数作为输入并打印总和。以下是添加两个数字的 Python 程序：\n\n```\ndef addNumbers(a,\
    \ b):\n    print a + b\naddNumbers(5, 10)\n```\n\n尝试运行上述 Python 程序，你应该能看到打印出的总和。\n\
    \n在编写上述程序时，我们并未真正考虑到事情可能出错的事实。如果传递的参数中有一个不是数字，会发生什么？\n\n```\naddNumbers(\", 10)\n\
    ```\n\n我们没有处理这种情况，因此，我们的程序会随以下错误消息崩溃：\n\n```\nTraceback (most recent call last):\n\
    File \"addNumber.py\", line 4, in <module>\naddNumbers(\", 10)\nFile \"addNumber.py\"\
    , line 2, in addNumbers\nprint a + b\nTypeError: cannot concatenate 'str' and\
    \ 'int' objects\n```\n\n我们可以通过检查传递的参数是否为整数来处理上述问题。但这并不能解决问题。如果代码因其他原因而损坏并导致程序崩溃怎么办？使用一个在遇到错误时就会崩溃的程序不是件好事。即使发生了未知错误，代码也必须足够健壮，能够优雅地处理中断，并让用户知道有问题出现。\n\
    \n### 使用 Try 和 Except 进行异常管理\n\n在 Python 中，我们使用 try 和 except 语句来处理异常。当代码损坏时，异常会在不导致程序崩溃的情况下发生。我们将修改添加数字的程序以包含\
    \ try 和 except 语句。\n\n```\ndef addNumbers(a, b):\n    try:\n        return a +\
    \ b\n    except Exception as e:\n        return 'Error occurred: ' + str(e)\n\
    print addNumbers(\", 10)\n```\n\nPython 将处理 try 和 except 语句内的所有代码。当它发现错误时，控制权会转移到\
    \ except 块，跳过中间的代码。\n\n正如前面代码所示，我们已将代码移入 try 和 except 语句中。尝试运行程序，你应该会抛出一条错误消息，而不是导致程序崩溃。此外，异常的原因会作为异常消息返回。\n\
    \n上述方法处理意外异常。让我们来看看如何处理预期异常。假设我们试图使用 Python 程序读取文件，但文件不存在。在这种情况下，我们将控制异常，并在发生时让用户知道文件不存在。查看文件读取代码：\n\
    \n```\ntry:\n    try:\n        with open('fname') as f:\n            content =\
    \ f.readlines()\n    except IOError as e:\n        print str(e)\n    except Exception\
    \ as e:\n        print str(e)\n```\n\n在前面的代码中，我们已在 IOError 异常处理程序内处理文件读取。如果由于\
    \ fname 文件不可用导致代码损坏，错误将在 IOError 处理程序内得到处理。与 IOError 异常类似，还有许多其他标准异常，例如 ArithmeticError、OverflowError\
    \ 和 ImportError，仅举几例。\n\n### 多个异常\n\n我们可以通过连接标准异常来一次处理多个异常，如下所示：\n\n```\ntry:\n\
    \    with open(fname) as f:\n        content = f.readlines()\n    print content\n\
    except (IOError, NameError) as e:\n    print str(e)\n```\n\n上述代码在程序运行时会显示 IOError\
    \ 和 NameError 异常。\n\n### finally 子句\n\n假设我们在 Python 程序中使用某些资源。在程序执行过程中，发现了一个错误，程序只执行了一半。在这种情况下，资源将被不必要地保留。我们可以使用\
    \ finally 子句来清理此类资源。查看以下代码：\n\n```\ntry:\n    filePointer = open('fname', 'r')\n\
    \    try:\n        content = filePointer.readline()\n    finally:\n        filePointer.close()\n\
    except IOError as e:\n    print str(e)\n```\n\n如果在执行前面的代码时，读取文件时发生异常，filePointer\
    \ 将在 finally 块中关闭。\n\n### Python 中的日志\n\n当应用程序中出错时，如果我们知道错误的来源，调试会更容易。当异常发生时，我们可以记录定位问题所需的信息。Python\
    \ 提供了一个简单而强大的日志库。让我们来看看如何使用 Python 记录。\n\n```\nimport logging\n```\n\n```\n# initialize\
    \ the log settings\nlogging.basicConfig(filename='app.log', level=logging.INFO)\n\
    \ntry:\n    logging.info('Trying to open the file')\n    filePointer = open('appFile',\
    \ 'r')\n    try:\n        logging.info('Trying to read the file content')\n  \
    \      content = filePointer.readline()\n    finally:\n        filePointer.close()\n\
    except IOError as e:\n    logging.error('Error occurred ' + str(e))\n```\n\n正如前面的代码所示，我们首先必须导入\
    \ Python 日志库，然后使用日志文件名和日志级别初始化记录器。有五个日志级别：DEBUG、INFO、WARNING、ERROR 和 CRITICAL。在这里，我们必须将日志级别调整为\
    \ INFO；因此，INFO 和之前的记录将被注册。\n\n### 获取堆栈跟踪\n\n在前面的代码中，我们有一个程序文件，因此更容易找出错误发生的位置。但是，当涉及多个程序文件时，我们该怎么办？在这种情况下，获取错误堆栈有助于找到错误的来源。异常的堆栈跟踪可能已按如下方式记录：\n\
    \n```\nimport logging\n\n# initialize the log settings\nlogging.basicConfig(filename='app.log',\
    \ level=logging.INFO)\n\ntry:\n    filePointer = open('appFile', 'r')\n    try:\n\
    \        content = filePointer.readline()\n    finally:\n        filePointer.close()\n\
    except IOError as e:\n    logging.exception(str(e))\n```\n\n如果你尝试运行前面的程序，当异常发生时，以下错误将记录在日志文件中：\n\
    \n```\n[ERROR:root] [Errno 2] No such file or directory: 'appFile'\n```\n\n```\n\
    Traceback (most recent call last):\nFile \"readFile.py\", line 7, in <module>\n\
    \    filePointer = open('appFile', 'r')\nIOError: [Errno 2] No such file or directory:\
    \ 'appFile'\n```\n\n## 第 6 章：常见 Python 问题与解答\n\n### 1. Python 中列表和元组有什么区别？\n\n\
    Answer：\n\n| 列表 vs. 元组 |\n| :--- |\n| 列表 | 元组 |\n| 列表是可变的，也就是说，它们可以被编辑。 | 元组是不可变的（元组是不能编辑的列表）。\
    \ |\n| 列表比元组慢。 | 元组比列表快。 |\n| 语法：list_1 = [10, 'Chelsea', 20] | 语法：tup_1 = (10,\
    \ 'Chelsea', 20) |\n\n### 2. Python 的主要特点是什么？\n\nAnswer：\n\n- Python 是一种解释型语言，与\
    \ C 及其变体等其他语言不同，Python 在执行前不需要编译。还有其他解释型语言，例如 PHP 和 Ruby。\n- Python 是动态编写的，这意味着在声明变量时不需要指示变量类型。你可以进行如\
    \ x = 111 然后 x = \"I am a string\" 之类的操作，而不会出错。\n- Python 非常适合面向对象编程，因为它允许定义类以及组合和继承。它没有输入说明符（例如\
    \ C++ 中的 public、private）。\n- 在 Python 中，函数是一等对象。这意味着它们可以被赋值给变量，从其他函数返回并传递给函数。类也是一等对象。\n\
    - 编写 Python 代码很快，但执行可能比编译型语言慢。幸运的是，Python 允许你包含基于 C 的扩展，因此瓶颈可以得到优化，而且通常都会得到优化。numpy\
    \ 包就是一个很好的例子，它之所以快，是因为 Python 不执行的大部分计算都由它完成。\n- Python 在许多领域都很有用：自动化、Web 应用程序、大数据应用程序、科学建模等。它还经常被用作“中介”代码，以便其他语言和组件能够良好协作。\n\
    \n### 3. Python 是什么样的语言？是编程语言还是脚本语言？\n\nAnswer：\n\nPython 可以创建脚本，但它是一种通用编程语言。\n\
    \n### 4. Python 如何被解释？\n\nAnswer：\n\nPython 是一种解释型语言，在运行时之前不是机器级代码。\n\n### 5.\
    \ 什么是 PEP 8？\n\nAnswer：\n\nPEP 是 Python Enhancement Proposal（Python 增强提案）的缩写。它指定了如何格式化\
    \ Python 代码，以使其具有最大可读性。\n\n### 6. Python 中如何管理内存？\n\nAnswer：\n\n- Python 内存由 Python\
    \ 私有堆空间管理。然后，Python 数据对象和结构位于私有堆（一种类似树的数据结构）中。程序员无法访问此私有堆，这是 Python 解释器需要处理的事情。\n\
    \n"
