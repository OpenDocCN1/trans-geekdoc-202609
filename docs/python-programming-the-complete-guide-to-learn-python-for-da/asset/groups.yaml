  - '[PAGE 14]


    programming tools such as lambda, reduce, filter and map.


    Tools that came to the language thanks to a Lisp hacker, a family of multiparadigm-type
    computer programming languages.


    The last version released in CWI was Python 1.2, in 1995, Van Rossum continued
    his work at the Corporation for National Research (CNRI) in Virginia, where he
    released several versions of the language.


    For version 1.4, there are new features, many inspired by Modula-3, and also built-in
    support for complex numbers.


    By 2000, the main Python developer team was switched to BeOpen.com to form the
    BeOpen Python Labs team. CNRI requested that version 1.6 be published at the time
    the team left CNRI.


    Version 1.6 published in the CNRI includes a license substantially longer than
    that of the versions published in CWI. The new license included a clause stating
    that it was governed by the laws of Virginia.


    The Free Software Foundation (FSF), a foundation created by Stallman to encourage
    Free Software, argued that the clause was incompatible with GNU GPL. So, they
    agreed to change Python to a Free Software license, which would make it compatible
    with GPL.


    This is why Python 1.6.1 is the same as 1.6, with a couple of bug fixes and a
    new GPL-compatible license.


    # Version 2.0


    Python 2.0 included the generation of lists, one of the most important features
    of the Haskell functional programming language. It also included a garbage collection
    system capable of collecting cyclic references.


    In 2001, the Python Software Foundation was created, which as of Python 2.1 owns
    all the code, documentation and language specifications. The foundation was based
    on the Apache Software Foundation model.


    # Version 3.0


    The last major Python update was in 2008 with Python 3.0 with the PEP 3000, designed
    to rectify fundamental flaws in language design.'
