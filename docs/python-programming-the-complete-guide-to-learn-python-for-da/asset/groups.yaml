    is not expected by the regular expression, in the second example, the same occurs.


    The following example will be used to match strings that represent single parameter
    mathematical functions:


    ```

    regexp = r "[a-z] + (* [0-9] + *)"

    ```


    This will find strings that start with one or more letters ([az] +), we have to
    escape the parentheses to take them as something we want to be part of the string,
    since the parentheses have a special meaning in regular expressions, we escape
    them with \\, then we look for zero or more spaces (*) followed by numbers ([0-9]
    +) and again zero or more spaces.


