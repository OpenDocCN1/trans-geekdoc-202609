    # # Chapter 1: Introduction to Python


    # ## What Is Python?


    A general-purpose programming language, whose expansion and popularity is relatively
    recent. This is Python, a commitment to simplicity, versatility, and rapidity
    of development.


    Python is a platform-independent and object-oriented scripting language prepared
    to perform any type of programming language, from Windows applications to network
    servers or even web pages. It is an interpreted language, which means that it
    is not necessary to compile with the source code to be capable to execute it with,
    which offers advantages such as the speed of development and inconveniences such
    as lower speed.


    In recent years the language has become popular, thanks to several reasons such
    as:


    +   - The number of libraries it contains, types of data and functions incorporated
    with the language itself, which helps to perform many common tasks without having
    to program them from scratch.


    +   - The simplicity and speed with which the programs are created. A program
    in Python can have 3 to 5 lines of code less than its equivalent in Java or C.


    +   - The number of platforms on which you can develop, such as Unix, Windows,
    OS/2, Mac, Amiga, and others.


    +   - Also, Python is free, even for business purposes.


    # ## What Is Python For?


    One of the main advantages of learning Python is the possibility of creating a
    code with great readability, which saves time and resources, which facilitates
    its understanding and implementation.


    These factors and others that you will see later, have made Python become one
    of the most used programming languages. From web applications to artificial'
