    ## 带赋值的算术运算符


    增加变量值的操作在计算机程序中非常常见。


    例如，在事件计数器中，计数器 c 每次增加 1。


    ```

    >>> c = c + 1 # the variable c is increased by 1

    >>> d = d - 1   # the variable d is decremented by 1

    ```


    Python 包含将赋值运算符与任何算术运算符合并的语句。在变量增加或减少的情况下，我们有，


    ```

    >>> c += 1      # equals: c = c + 1

    >>> x += 0.01   # equals: x = x + 0.01

    >>> d -= 2      # equals: d = d - 2

    ```


    其他算术运算符（*, /, //, %, **）也可以使用这种紧凑形式。还可以包含递增或其他运算的表达式：


    ```

    >>> y *= d+1          # equals: y = y * (d + 1)

    >>> n = 7

    >>> n //= 2           # equals: n = n // 2

    >>> n

    3

    >>> n **= 2           # equals: n = n ** 2

    >>> n

    9

    ```


    | 操作 | 运算符 | 表达式 | 等同于 |

    |---|---|---|---|

    | 加并赋值 | += | a += b | a = a+b |

    | 减并赋值 | -= | a -= b | a = a-b |

    | 乘并赋值 | *= | a *= b | a = a*b |

    | 除并赋值 | /= | a /= b | a = a/b |

    | 除并赋值整数部分 | //= | a //= b | a = a//b |

    | 取模并赋值 | %= | a %= b | a = a%b |

    | 幂并赋值 | **= | a **= b | a = a**b |


    | A | B | A or B | A and B | Not A |

    |---|---|---|---|---|

    | 假 | 假 | 假 | 假 | 真 |

    | 假 | 真 | 真 | 假 | 真 |

    | 真 | 假 | 真 | 假 | 假 |

    | 真 | 真 | 真 | 真 | 假 |


    等同于：


    | A | B | A or B | A and B | Not A |

    |---|---|---|---|---|

    | 0 | 0 | 0 | 0 | 1 |

    | 0 | 1 | 1 | 0 | 1 |

