    \ 等语言组成的结构。Py：Python 中的复合结构。来源：自制。\n\n### 简单数据\n\n基础数据是简单的，也称为标量，因为它们是不可分割的对象。简单数据的特点是只有一个关联值，类型为整数、实数或浮点数（float）、布尔和字符。在\
    \ Python 中，没有简单的字符数据类型。尽管数据仅由一个字母或 ASCII 字符组成，但它表示为由字符串（string）组成的数据。\n\n- 整数\n\
    \n在数学中，整数是自然数、它们的负数和零。整数示例：5、-20、0、-104。带有小数部分的数字不属于整数，例如 3.4。在大多数编程语言（包括 Python）中，整数使用关键字\
