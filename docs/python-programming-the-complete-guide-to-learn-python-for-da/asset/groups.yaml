    \ 18 岁。如果此比较为真，程序会输出是未成年人，如果为假则输出是法定成年人。最后，程序总是说再见，因为最后一条指令不在任何块中，因此始终会被执行。以下可以看到该程序的两个逐步执行示例：\n\
    \n### \"if\" ... \"else\" ... 示例 1\n\n```\nage = int(input(\"How old are you?\
    \ \"))\nif age < 18:\n    print(\"Are you a minor\")\nelse:\n    print(\"Are you\
    \ of legal age\")\nprint(\"Goodbye!\")\n```\n\n### \"if\" ... \"else\" ... 示例\
    \ 2\n\n```\nage = int(input(\"How old are you? \"))\nif age < 18:\n    print(\"\
    Are you minor\")\nelse:\n    print(\"Are you of legal age\")\nprint(\"Goodbye!\"\
    )\n```\n\n虽然不建议这样做，但你可以使用两个 \"if\" 块来代替一个 \"if ... else\" 块编写程序...\n\n```\nage\
    \ = int(input(\"How old are you? \"))\nif age < 18:\n    print(\"Are you minor\"\
    )\nif age >= 18:\n    print(\"Are you of legal age\")\nprint(\"Goodbye!\")\n```\n\
    \n出于两个原因，最好不要这样做：\n\n使用两个 \"if\" 块会强制 Python 始终求值两个条件，而在 \"if ... else\" 块中只会求值一个条件。在简单程序中，差别不明显，但在执行大量比较的程序中，影响可能会明显。\n\
    \n使用 else 可以省去编写一个条件（此外，编写条件时可能会出错，但编写 else 不会）。\n\n如果出于任何原因你不想在任何块中执行任何指令，则该指令块至少应包含\
    \ pass 语句（该语句告诉 Python 不需要执行任何操作）。\n\n```\nage = int(input(\"How old are you?\
    \ \"))\nif age < 120:\n    pass\nelse:\n    print(\"I don't believe it!\")\nprint(f\"\
    You say that you have {age} years.\")\n```\n\n显然，通过更改不等式可以简化此程序。这只是一个示例，用于展示 pass\
    \ 语句的用法。\n\n```\nage = int(input(\"How old are you? \"))\nif age >= 120:\n   \
    \ print(\"I don't believe it!\")\nprint(f\"You say that you have {age} years.\"\
    )\n```\n\n## 不止两个替代方案: if ... elif ... else ...\n\nif ... else ... 结构可以通过添加 elif\
    \ 指令来扩展：\n\nelif 是 else if 的缩写。Python 中的语法如下：\n\n### if ... elif ... else ...\
    \ 条件语句语法\n\nif ... elif ... else ... 结构的语法如下：\n\n```\nif condition_1:\n    block\
    \ 1\nelif condition_2:\n    block 2\nelse:\n    block 3\n```\n\n- 如果满足条件 1，执行块\
    \ 1\n- 如果条件 1 不满足但条件 2 满足，执行块 2\n- 如果条件 1 和条件 2 都不满足，执行块 3。\n\n该结构等效于以下嵌套的 if\
    \ ... else ... 结构：\n\n```\nif condition_1:\n    block 1\nelse:\n    if condition_2:\n\
    \        block 2\n    else:\n        block 3\n```\n\n你可以编写任意数量的 elif 块。else 块（可选）在没有满足上述任何条件时执行。\n\
    \n![](img/6308792a7b2c124d01547ee394b31561_73_0.png)\n\n### if ... elif ... else\
    \ ... 条件语句的流程图\n\n在 if ... elif ... else ... 结构中，编写情况的顺序很重要，通常可以通过合理排序情况来简化条件。\n\
    \n我们可以区分两种情况：\n\n### 1- 当情况互斥时\n\n考虑一个询问年龄并根据接收到的值输出不同消息的程序。例如，我们可以区分三种情况：\n\n\
    - 如果值为负数，则是错误\n- 如果值在 0 到 17 之间，则是未成年人\n- 如果值大于或等于 18，则是法定成年人\n\n情况是互斥的，因为一个值只能属于其中一种情况。\n\
    \n可能的程序如下：\n\n```python\nage = int(input(\"How old are you? \"))\nif age >= 18:\n\
    \    print(\"Are you of legal age\")\nelif age < 0:\n    print(\"You cannot have\
    \ a negative age\")\nelse:\n    print(\"You are a minor\")\n```\n\n之前的程序可以正常工作，但情况比较杂乱。最好按顺序编写，以确保不会遗漏任何可能的情况。例如，我们可以从未成年人到老年人编写，尽管这迫使我们编写其他条件：\n\
    \n```python\nage = int(input(\"How old are you? \"))\nif age < 0:\n    print(\"\
    You cannot have a negative age\")\nelif age >= 0 and age < 18:\n    print(\"Are\
    \ you a minor\")\nelse:\n    print(\"Are you legal age\")\n```\n\n在之前的程序中，比较可以简化：\n\
    \n```python\nage = int(input(\"How old are you? \"))\nif age < 0:\n    print(\"\
    You cannot have a negative age\")\nelif age < 18:\n    print(\"Are you a minor\"\
    )\nelse:\n    print(\"Are you of legal age\")\n```\n\n这两个程序是等价的，因为在 \"if ... elif\
    \ ... else\" 结构中，当某个 Python 比较满足后，就不再求值后续条件。在此例中，如果程序需要检查第二个比较（elif 中的），那是因为第一个（if\
    \ 中的）未满足。如果第一个未满足，说明 age 大于 0，因此在第二个条件中无需再次检查。\n\n但需要小心，因为如果按相反顺序排列之前程序的情况并保持条件不变，程序将无法按预期工作，因为输入负值将显示消息\
    \ \"Are you a minor\"。\n\n```\n# This program does not work properly\nage = int(input(\"\
    How old are you?\"))\nif age < 18:\n    print(\"Are you a minor\")\nelif age <\
    \ 0:\n    print(\"You cannot have a negative age\")\nelse:\n    print(\"Are you\
    \ of legal age\")\n```\n\n"
