  mdcn: "\n\n## 4- Python in Test Frameworks\n\n测试是另一种已转向 Python 的活动。\n\nPython 非常适合验证想法或产品，因为它拥有许多集成框架，有助于调试代码并提供快速的工作流和执行。\n\
    \n诸如 'Unittest'、'Pytest' 和 'Nose test' 之类的测试工具使测试变得更容易。Python 还支持跨平台测试和带有不同框架的浏览器，例如\
    \ \"PyTest\" 和 \"Robot\"。\n\n测试通常是最艰巨的任务之一，现在变得简单快捷得多。\n\n## 5-Python in Web Development\n\
    \nPython 允许您用更少的代码构建更多内容，因此原型创建更加高效。\n\n由 Python 提供的 Django 框架对所有开发人员都是一项优势，因为它可用于创建动态且非常安全的\
    \ Web 应用程序。\n\nPython 语言还用于爬取，即从其他网站获取信息。Instagram、Bit Bucket、Pinterest 等应用程序都是基于此类框架构建的。\n\
    \nPython 的用途和应用远超上述领域，从游戏开发到数据可视化，从网络到一般的软件开发。Python 应用程序数不胜数。\n\n如果您是开发人员或希望专注于上述提到的某个领域，我们邀请您抽出一点时间读完这整本书。Python\
    \ 是您必须学习和掌握的语言之一，以便参与最前沿的技术项目。\n\n## Python Features\n\n让我们来看看 Python 语言的主要特性，它们与\
    \ Java 或 Ruby 等编程语言非常相似\n\n### 1- General-Purpose Language\n\n这意味着它不是针对特定目的的，例如专为构建网站而设计的\
    \ PHP。\n\n使用 Python，您无需具备高深的知识（JavaScript 作为强大的盟友）即可创建网页，也可以为 Windows 操作系统编写脚本或软件。\n\
    \n目前尚未有针对移动设备的突出功能，但您可以为此目的使用 Kivy。\n\n### 2- It is multiparadigm\n\n那是什么意思？多范式？\n\
    \n嗯，尽管其强项是面向对象编程（它是一种高级语言），但为其用户提供了其他编程范式或风格，例如命令式编程（带有循环语句）或函数式编程（带有模块和函数）。\n\
    \n因此，如果您对对象一无所知，只会使用方法编写代码，您也可以完美地使用 Python，而在其他语言中这是不可能的。\n\n### 3- Python is\
    \ an interpreted language\n\n使用 Python 编程时，您不需要将源代码编译为机器代码，而是有一个解释器会根据代码直接执行程序。\n\
    \n虽然这一特性暗示程序可能会更慢，但在 Python 语言中通常并非如此，这有助于促进下一特性的发展。\n\n### 4- It is cross-platform\n\
    \n与许多语言（如主要只能针对 Windows 进行开发的 Visual Basic）不同，使用 Python 您可以在许多设备和操作系统上使用它，因为已为\
    \ Unix、Linux、Windows 和 Mac OS 系统创建了解释器。\n\n### 5- It is dynamic typing\n\n声明变量时，不需要告诉数据是什么类型（是\
    \ int、string、float 等）。变量会根据程序执行时编写的内容进行调整。\n\n此特性在其他语言中一直因内存优化、编写代码时出错等原因而受到批评。但使用\
    \ Python 时，目标是让语言帮助创建软件，而不必处理语言的特性。\n\n![](img/6308792a7b2c124d01547ee394b31561_10_0.png)\n\
    \n同样，Python 是强类型语言，例如，您无法将数字和文本相加（int 类型变量与 string 类型变量相加），因为这会导致错误。\n\n### 6-\
    \ It is object oriented\n\n我们已经说过，您可以应用另一种编程风格，编写面向对象的软件会带来一系列标准优势，尤其是通过继承及其多态函数重用组件时。\n\
    \n## Python Philosophy\n\n非常经常，这种语言的大多数程序员都会听到有人说与 Python 哲学相关的事情，该哲学与 Unix 哲学非常相似。\n\
    \n这些原则由 Python 开发者 Tim Peters 在 Python 之禅中著名地描述。\n\n- 优美胜于丑陋。\n- 显式胜于隐式。\n- 简单胜于复杂。\n\
    - 复杂胜于繁琐。\n- 扁平胜于嵌套。\n- 稀疏胜于稠密。\n- 可读性很重要。\n- 特例不特殊到足以打破规则。\n- 实用胜于纯粹。\n- 错误绝不应被悄然忽略。\n\
    - 除非它们已被明确禁用。\n- 面对歧义，拒绝猜测的诱惑。\n- 应该只有一种——最好是只有一种——显而易见的方法来做这件事。\n- 虽然这种方法起初可能并不明显，除非你是荷兰人。\n\
    - 现在胜于永远。\n- 虽然永远不如现在。\n- 如果实现难以解释，那是个坏主意。\n- 如果实现容易解释，那可能是个好主意。\n- 命名空间是个好主意。让我们多做这样的事情！\n\
    \nTim Peters, Python 之禅。\n\n## Python History And Evolution\n\nPython 作为编程语言的历史始于\
    \ 20 世纪 80 年代末和 90 年代初，与 Guido Van Rossum 一起，拥有 29 年的开发历史。\n\n1989 年的一个圣诞节，在 CWI（一家荷兰研究中心）工作的\
    \ Guido Van Rossum 决定启动一个业余项目，为 ABC 编程语言（在 CWI 开发的一种编程语言）延续生命。\n\nRetrieve words\
    \ from a document in ABC Retrieve words from a document in PYTHON\n\n```\nHOW\
    \ TO RETURN words document:\nPUT {} IN collection\nFOR line IN document:\n   \
    \ FOR word in split line:\n        IF word not in collection:\n            INSERT\
    \ word IN collection\nRETURN collection\n\ndef words(document):\n    collection\
    \ = set()\n    for line in document:\n        for word in line.split():\n    \
    \        if word not in collection:\n                collection.add(word)\n  \
    \  return collection\n```\n\nABC 编程语言在 20 世纪 80 年代初开发，作为 BASIC 的替代品，专为初学者设计，因其易于学习和使用。其代码简洁但易读。\n\
    \n该项目并未广泛传播，因为当时可用的硬件使其使用困难。因此，Van Rossum 通过创建 Python 赋予了它第二次生命。\n\nGuido Van\
    \ Rossum 喜欢 Monty Python 团体，因此他选择了该语言的名称。目前，Van Rossum 继续在决定 Python 方向方面发挥核心作用。\n\
    \n![](img/6308792a7b2c124d01547ee394b31561_13_0.png)\n\n用红色标注的版本被视为过时版本\n\n1991\
    \ 年，Van Rossum 在 alt.sources 中发布了 0.9.0 版本的代码。\n\n该版本显示了从 Modula-3 采用的模块系统，Modula-3\
    \ 是一种结构化和模块化编程语言，Guido 将其描述为 Python 最大的编程单元之一。例如，Python 的异常模型与 Modula-3 的类似。\n\
    \n到 1994 年，comp.lang.python 论坛被创建，这是一个 Python 讨论论坛，标志着其普及率的里程碑，并使其用户数量翻了几倍。\n\n\
    ### Version 1.0\n\n同年，Python 达到 1.0 版本，包含 lambda、reduce、filter 和 map 等函数式编程工具。\n\
    \n这些工具得益于一位 Lisp 黑客引入语言，Lisp 是一种多范式计算机编程语言系列。\n\n在 CWI 发布的最后一个版本是 1995 年的 Python\
    \ 1.2，之后 Van Rossum 在弗吉尼亚州的国家研究公司（CNRI）继续工作，并发布了该语言的多个版本。\n\n对于 1.4 版本，有许多新功能，大部分受到\
    \ Modula-3 的启发，还内置了对复数的支持。\n\n到 2000 年，主要的 Python 开发团队转移到 BeOpen.com 组建 BeOpen\
    \ Python Labs 团队。CNRI 要求在团队离开 CNRI 时发布 1.6 版本。\n\n在 CNRI 发布的 1.6 版本包含比在 CWI 发布的版本明显更长的许可证。新许可证包含一条规定其受弗吉尼亚州法律管辖的条款。\n\
    \n自由软件基金会（FSF，由 Stallman 创立以鼓励自由软件的基金会）认为该条款与 GNU GPL 不兼容。因此，他们同意将 Python 改为自由软件许可证，使其与\
    \ GPL 兼容。\n\n这就是为什么 Python 1.6.1 与 1.6 相同，只是修复了几个错误并采用了新的 GPL 兼容许可证。\n\n### Version\
    \ 2.0\n\nPython 2.0 引入了列表生成，这是 Haskell 函数式编程语言最重要的特性之一。它还包含能够收集循环引用的垃圾回收系统。\n\n\
    2001 年，Python 软件基金会成立，自 Python 2.1 起拥有所有代码、文档和语言规范。该基金会基于 Apache 软件基金会模型。\n\n\
    ### Version 3.0\n\n最后一次重大 Python 更新是在 2008 年的 Python 3.0，随 PEP 3000 推出，旨在纠正语言设计中的根本缺陷。\n\
    \n"
