    # Frozen sets (Frozenset)


    In Python, there is another group of heterogeneous structured data that try to
    keep a certain relationship with set theory. This data is the Set and Frozenset
    sets. The first ones are presented in the following section of structured mutable
    or dynamic data.


    A frozen set (Frozenset) is a collection of unordered items that are unique and
    immutable. That is, it can contain numbers, string, tuples, but not lists. That
    they are unique elements means that they are not repeated. The Set and Frozenset
    are not sequences of data.


    Frozen sets are immutable because they cannot be changed or removed or added.
    Examples of frozen data:


    ```

    >>> FS1 = frozenset({25, 4, ''a'', 2, 25, ''house'', ''a''})

    >>> FS1

    frozenset({2, ''a'', 4, ''house'', 25})

    >>> type (FS1)

    <class ''frozenset''>

    >>> len (FS1)

    5

    ```


    The repeated elements (25 and ''a'') that we included in the frozen set were discarded.


    # Types of structured mutable (dynamic) data


    Unlike the frozen strings, tuples and sets, the structured mutable data, also
    called dynamic, are characterized in that their elements can change in value and
    elements can be added or deleted.


    In Python, we have as mutable structured data the lists, the sets (Set) and the
