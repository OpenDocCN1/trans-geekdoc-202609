    \n## 第 1 章：Python 简介\n\n### 什么是 Python？\n\n一种通用编程语言，其发展和普及相对较近。这就是 Python，一种致力于简单性、多功能性和快速开发的承诺。\n\
    \nPython 是一种平台无关且面向对象的脚本语言，旨在执行任何类型的编程，从 Windows 应用程序到网络服务器甚至网页。它是一种解释型语言，这意味着不需要使用源代码进行编译即可执行，这既带来了开发速度快等优势，也带来了运行速度较低等劣势。\n\
    \n近年来，该语言因多种原因而流行，例如：\n\n- 它包含的大量库，以及随语言本身集成的数据类型和函数，这有助于在无需从头开始编程的情况下执行许多常见任务。\n\
