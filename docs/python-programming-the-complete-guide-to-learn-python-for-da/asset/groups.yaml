    >>> a = 7

    ```


    在 Python 中，执行语句或指令 a = 7 时，首先会创建一个值为 7、类型为 int 的对象，并将其放置在一个内存位置。这个内存位置称为 Python
    对象标识。然后，将 7 赋值给变量 a 的操作会导致该名称或标识符与对象 7 的内存地址相关联或引用，也就是说，它将与 7 具有相同的标识。我们将使用 Python
    内部 id() 函数来更好地理解变量对其值为 7 的内存位置的这一引用。id() 函数返回对象所在的标识或内存位置。


    Python 中的简单数据对象具有三个特性：


    值、类型、标识


    ```

    >>> id(7)

    1449917120

    >>> a = 7

    >>> id(a)

    1449917120

    >>> b = 7

    >>> id(b)

    1449917120

    >>> c = a

    >>> id(c)

    ```


    7、a、b 或 c 都是同一个对象，占据一个唯一的内存位置。在此情况下，位置为 1449917120。当变量 b 被赋予相同的值（和对象）7 时，它将引用同一个位置。如果将变量
    a 赋给变量 c，情况也是如此；c 将引用 7 的同一个位置。这使得 Python 在内存处理上更高效，因为在其他语言中，拥有三个相同值的变量会导致内存使用量翻三倍。但是，如果使用值
    7.0 而不是 7 会发生什么？：


    ```

    >>> x = 7.0

    >>> id(x)

    1722264

    >>> type(x)

    <class ''float''>

    ```


    变量 x 将与对象 7.0 关联，标识为 1722264，类型为 float，值为 7.0。因此，Python 对象具有三个特性：值、类型和标识。如所述，变量在使用前不需要像
    Pascal 或 C 那样声明其类型。它们甚至可以在程序中更改类型。


    为了更好地理解编程中的赋值概念，并将其与数学中符号 = 的对称性区分开来，让我们试一下：


    ```

    >>> 7.0 = x

    SyntaxError

    >>> x = x + 3

    >>> x

    10.0

    ```


    7.0 = x 语句在编程中是语法错误，尽管在数学中是有效的。但是 x = x + 3 在数学中是荒谬的，但在编程语言中，它意味着向变量 x 添加值 3，然后将该表达式的结果再次赋给同一个变量
    x。


    Python 允许以下类型的多重赋值：


    ```

    >>> x, y, z = 7, 8.2, 9

    ```


    变量 y 是值为 8.2 的实数，x 是值为 7 的整数，z 是值为 9 的整数。在赋值右侧，写入了一个复合数据，即 Python 中的元组，它被赋给由这三个变量组成的元组。


    总结：在 Python 中，变量不会直接存储在内存中；会创建一个对象（其在内存中的位置称为标识），变量的标识符与该对象的标识相关联。下图展示了 Python
    中相同值变量的使用示例，与其他编程语言相比。


    Other languages

    ...

    years=99(int)

    Height=99(int)

    Higher=99(int

    Upmost=99(int

    ...

    ...


    Python

    ...

    99(int)

    ...

    ...

    ...

    ...

    ...

    ...


    - years

    - Height

    - Higher

    - Upmost


    ```

    >>> id(99)

    1790316048

    >>> years = 99

    >>> Height = 99

    >>> Higher = 99

    >>> id(99)

    1790316048

    >>> id(Height)

    1790316048

    >>> id(Higher)

    1790316048

    >>> id(Upmost)

    1790316048

    >>> type(years)

    <class ''int''>

    ```


    ## 表达式和语句


    表达式是进行计算的机制，由值、标识符与运算符的组合构成。它们可以包括变量、数据、运算符、括号以及返回结果的函数。


    每个表达式都有一个值，即从左到右计算并考虑优先级后的结果。表达式示例：


    ```

    >>> 1.5 * 3 / 2

    2.25

    >>> 1.2 * x + 3 # The value of x in the previous example is 10.0

    15.0

    ```


    ```

    >>> 3 > (3.1 + 2) / 3

    True

    ```


    语句或指令是程序的基本单位（在程序员行话中也称为代码），用于产生一个动作，例如向变量赋值、显示结果等。Python 解释器执行每条语句以产生给定的动作。


    ```

    >>> y = x / 2 + 3

    >>> print(y)

    8.0

    ```


    ```

    >>> 1.5 * 3 / 2

    2.25

    >>> print(_)

    2.25

    ```


    左侧框中的第一条语句计算表达式 x / 2 + 3 并将结果赋给变量 y。第二条语句显示 y 的值。但是，右侧框中的表达式 1.5 * 3 / 2，其计算结果未赋给任何变量，而是保存并关联到名为
    “ _” 的变量中。


    ## 运算符


    运算符是表示计算动作的符号。除了经典数学运算外，编程中还使用逻辑运算符以及关系或比较运算符。我们可以将运算符分为 3 类：算术运算符、逻辑或布尔运算符，以及关系运算符。


    ### 算术运算符


