    \n吉多·范罗苏姆\n\n## 第 2 章：Python 基础\n\n### 数据类型\n\n计算机程序中处理的信息以多种方式表示。如果你处理数值信息，将使用简单值或实值或简单数据。如果你处理结果为真或假的逻辑表达式，将使用逻辑或布尔数据。另一方面，如果你操作文本，将使用字符型或字符串（string）类型的数据。要表示数值信息（甚至逻辑或文本），当数据以表格形式（如向量和矩阵）或更复杂的结构分组时，将使用复合数据类型。\n\
    \n下图显示了主要编程语言中使用的数据类型。\n\n- 数据类型\n  - 简单\n    - 整数，int\n    - 实数，float\n    -\
    \ 布尔，bool\n    - 字符，char\n  - 复合\n    - 数组，字符串\n    - 结构，记录\n    - 元组，字符串（静态，不可变）\n\
