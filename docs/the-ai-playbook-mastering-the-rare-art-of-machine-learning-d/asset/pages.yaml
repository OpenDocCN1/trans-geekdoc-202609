- pgno: 54
  md: 'Once created—or “learned”—the model’s purpose is to generate predictive scores
    (probabilities) for current customers who haven’t yet churned on a case-by-case
    basis. So, for the second step, we use it to do so, thereby applying what’s been
    learned. That’s called scoring. Scoring with a model and then acting on the score
    is called model deployment.


    ![](img/99a58a0ea5f8204f7fbf446f6593fd4f_54_0.png)


    Scoring: A model generates a prediction for an individual.


    This is the launch, the main event, the whole point. The first step may have been
    the “rocket science” part, but eventually the time must come to launch the rocket.
    In the deployment step, we dispatch the model into the field where it generates
    predictions that drive operations—such as marketing outreach to retain customers.
    Model deployment is also referred to as operationalization, integration, implementation,
    or “putting a model into production.”


    For example, once the model’s been deployed, when the rule outlined above “fires”
    for a customer and therefore scores the customer with a 43 percent probability
    of cancellation—which is relatively high—it triggers an email that says, “We love
    you as a customer, here’s a discount code.”


    That’s what I pitched to gay.com. After developing the model, I knew I had to
