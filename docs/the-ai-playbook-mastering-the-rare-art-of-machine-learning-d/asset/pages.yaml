- pgno: 226
  md: '# Conclusion


    ML''s Elevator Pitch, Staff, Timeline, Upkeep, and Ethics


    Now that we''ve seen the entire end-to-end process, it''s time to distill it back
    down to a brief proposition. This book concludes by describing how a machine learning
    initiative must begin: pitching the project. In a nutshell, you must sell the
    way in which ML will launch and the value of doing so. This conclusion also rounds
    out the bizML practice with the who, how long, and then-what: who constitutes
    the project team, how long it takes, and then what ongoing maintenance you must
    perform to keep the model in operation. Finally, I end with the enormous ethical
    responsibilities you accept when you deploy ML.


    When you''re selling machine learning deployment, swimming upstream against resistance
    and inertia, it sometimes feels like you''re hustling. But in actuality, you''re
    recruiting. You''re enlisting collaborators and orchestrating a vision. Don''t
    get me wrong; as you advocate for the project, there are times you might need
    to aggressively cajole. During parts of Jack Levis''s story, it looked like a
    battle of wills between him and a universe of naysayers. But sometimes it takes
    a hard sell—not only to prevail and achieve buy-in, but to catalyze a fruitful,
    unified collaboration across the enterprise.


    At first, the imbalance is real: You get it and they don''t. And they may be slow
    to come around. But once they finally do, it''s up to you to embrace a profound
    shift in perspective: More than a skeptic you''ve convinced, they''re now a critical
    partner who will deliver new insights that the project needs. Only by having sold
    them on your plan can you now jointly refine and improve it.'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'When you first pitch, bending over backward is part of the deal. You may feel
    like this stuff should basically just sell itself. After all, the value proposition
    can seem totally obvious when you’re already invested in it. The potential operational
    improvement is a “no-brainer.” But, to get the green light, you must get the people
    in charge not only interested but enthusiastic. This means taking a step back
    from the excitement and telling a simple, non-technical story that is dispassionate
    rather than fervent, one that could just as well come from the lips of a truly
    impartial third party. In the art of sales, evenhandedness is more rousing.


    To sell ML convincingly, sell it succinctly. Strengthen your pitch by distilling
    it down to the fundamentals: the precise operational change, the value of that
    change, and how ML will achieve the change—in that order. It’s time to perfect
    your elevator pitch.


    # The Elevator Pitch


    > No one wants to be sold to, but everybody loves to buy. Give them something
    to buy.

    > —Jack Levi


    The premise to this book’s bizML practice is simple: Reframe “ML projects” as
    “operations-improvement projects that use ML.” Leading with the scientific virtues
    and quantitative capabilities of the technology—such as modeling algorithms, the
    idea of learning from data, or the notion of probabilities—is putting the cart
    before the horse. Instead, lead with the business value proposition, a simple
    story about how processes will improve.


    Here’s an example elevator pitch:


    Currently, 99.5 percent of our direct mail is ineffective. Only half a percent
    respond.


    If we could increase that to 1.5 percent, that would mean a projected $500,000
    increase in revenue in return for our current'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'marketing spend, tripling the ROI of marketing campaigns. I can show you the
    arithmetic in detail.


    ML can hone down the population to whom we''re marketing by targeting the customers
    more likely to respond. This should deliver the gains and ROI I just mentioned.


    What do you think? Would you support this project or would you have objections?
    What questions do you have?


    When you pitch, get straight to the point, the business value and the bottom line,
    and then gauge the person to whom you''re speaking. They will be interested in
    the business value, but they''re not necessarily excited about ML. ML is only
    the technical solution, the means to the end, so, in this early stage, its details
    can easily distract, confuse, or bore.


    Your narrowly focused pitch must accomplish three things:


    +   1. Lead with the value proposition, expressed in business terms, without details
    about ML, models, or data. For now, share nothing about how ML works, only the
    actionable value it delivers, the operational improvement gained by model deployment.
    This usually means avoiding the words “model” and “deployment.”


    +   2. Estimate the value, a performance improvement in terms of one or two key
    performance indicators (KPIs), such as response rate, profit, ROI, cost reduction,
    or labor reduction. You must include a potential KPI win, even if only from scratch
    calculations. Convey this potential in simple terms, such as a bar graph that
    has only two bars to illustrate the potential improvement. It’s not yet time to
    mention predictive performance metrics such as lift. Make the case that the KPI
    win will more than justify the expense of the ML project.


    +   3. Stop and listen. Keep the pitch short and then open the conversation. Realize
    your pitch isn’t the conclusion but rather a catalyst to begin a dialogue. By
    laying out the fundamental proposition and asking them to go next, you get to
    find out which aspects are of concern and which are of interest, and you get a
    read on their comfort level with ML or with analytics in general.'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'After the pitch, you’ve got to interactively gauge when to get into details
    about how ML will be applied—and at what depth and speed. It’s more common than
    you may realize for the business professional to whom you’re speaking to feel
    nervous about their own ability to understand analytical methods. People are skilled
    at covering this nervousness. Keep it simple. As with many technologies, convolution
    and the appearance of arcane complexity threaten to extinguish a newcomer’s excitement
    about the potential value. This might leave them feeling compelled only by the
    pressure that comes from all the “Everyone’s doing it!” hype. Nip that in the
    bud with a straightforward, concrete explanation. Cover just enough of the inside
    mechanics to demystify ML. Resist the temptation to ride the wave of “AI” hype.
    It oversells. The propaganda’s sheer excitement does successfully broadcast that
    there’s value to be had—but it only distracts from the concrete value proposition
    by idealizing the core technology. Don’t passively affirm starry-eyed decision
    makers who appear to be bowing at the altar of an all-capable AI. If you do, here’s
    the risk that you face: When the hype fades and the overselling is debunked, much
    of ML’s true value proposition will inevitably be disposed of along with the myths,
    like the baby with the bathwater.


    # Exercise Patience and Solicit Input


    > > One of the hardest things I have to teach my employees in the art of consulting
    is you have to talk to people much more often than you want to.

    > > —John Elder, founder, Elder Research


    > > Data scientists will literally solve AGI instead of talking to a product manager.

    > > —Josh Wills, experienced data scientist


    As decision makers slowly come around, you may find that they do so by way of
    a long, winding road. The first meeting is only one of many. Ramping up others
    on the proposed initiative is, well, a process.'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'In the end, it’s you versus the Fear of Change. Volumes have been written on
    change management. In fact, that’s the theme of this book as well. It covers the
    practice and the background knowledge for managing the particular kind of change
    made by ML deployment.


    But no preordained plan of action is bulletproof against the wild card you will
    ultimately face: human anxiety. “We can’t afford the cost of integrating a model
    into mission-critical operations,” nervous executives will declare, “nor can we
    afford the associated risk of doing so.”


    Your response is simple: We can’t afford not to. Turn up the heat from there as
    you see fit. If we don’t jump on the opportunity, one of a diminishing number
    of unique differentiators that technology can provide, we will incur a severe
    opportunity cost and jeopardize our competitive stronghold. Streamlining operations
    with models is not a question of whether but of when: before the competition does
    or after? Change can be hard, but the facts are much harder. If pure apprehension
    is precluding the company from pursuing the value propositions that ML has to
    offer, then the business is getting in the way of doing business.


    Even as you’re selling, you’re learning. Be prepared to change course. You can’t
    know beforehand what objections, valid feedback, and new information may arise.
    You’re there to listen as much as you are to talk. Undoubtedly, you will learn
    about new pragmatic considerations that mean modifying the operational deployment
    you’ve had in mind.


    Ultimately, your persistence will pay off—but only after providing more information
    than you’ve crammed into the elevator pitch. Management needs more specifics,
    including the staffing requirements and project timeline, in order to finalize
    their decision. And you will need these specifics too, in order to properly execute.
    Let’s dive into them.


    # Assemble Your Team: Staffing the ML Project


    At a minimum, in addition to the project lead—sometimes called the data product
    manager—you need technical experts to facilitate each of the three culminating
    project steps. Be warned that there’s not a lot of agreement on terminology for
    these roles. Here’s the breakdown:'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'For step 4—prepare the data—you need a data engineer or data wrangler, someone
    familiar with the data tables in their current form and capable of transforming
    them into training data. This person is responsible for accessing and reconfiguring
    the data. This task will often be split across multiple people, since it involves
    miscellaneous tasks often assigned to certain database administrators and database
    programmers, and it involves multiple technologies such as cloud computing and
    high-bandwidth data pipelines.


    For step 5—train the model—you need a predictive modeler, a hands-on expert in
    core ML methods. This person creates the model using ML software that operates
    on the training data. Often, this person takes on the more general title of data
    scientist, so that’s the title named most often throughout the chapters of this
    book.


    For step 6—deploy the model—you need an ML engineer capable of modifying the existing
    operational system so that a model is newly integrated. The engineering requirements
    will vary greatly depending on what kind of operational change you’re making and
    how the operational system was constructed in the first place.


    For a pilot project—an isolated, narrowly focused ML initiative—you may not need
    more than the skeleton staff listed above. With such a project, you start judiciously
    small, and so your staffing investment should start small as well. On the other
    hand, if your project is part of a broader analytics initiative that will spawn
    multiple projects across the enterprise, that’s a very different story, one that
    likely involves shared teams and resources across projects.


    For most projects, in addition to this technical staff and the project leader,
    you also need another business-side role filled: an operational liaison (a.k.a.
    analytics translator, business translator, data product partner, or innovation
    marshal). This person bridges the gap between tech and business, between the technical
    project staff and the line-of-business stakeholders in charge of the operations
    that the project will alter. The operational liaison ensures the model will be
    understood and embraced by those'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'running operations. This person works within—or closely with—the line-of-business
    team. The pertinent team may be in marketing, website operations, fraud investigations,
    or financial credit application processing. The liaison is involved from the get-go,
    delivering feedback to the ML team to ensure the prediction goal, deployment plan,
    and performance objectives are aligned with the operational team’s needs.


    # Sourcing the ML Project Team


    Where do you get these people? After all, folks with these very particular skills
    can be hard to come by.


    Well, when you need something, there are three ways to get it: Buy it, rent it,
    or make it. For a staff member, that means hire someone new, engage consultants,
    or train existing staff.


    External consultants are often central when you’re launching a pilot ML project,
    since, that way, you don’t need to commit to hiring ML experts until you have
    more firmly established the value of the ML application that you’re pursuing for
    the first time. Outsourcing to consultants can be expensive, but the good news
    is that you can often keep this expense reasonably low, since you need these experts
    only for a relatively light engagement. During the first three planning steps
    of bizML, a consultant can be engaged for light “consulting” in the literal sense
    of the word, helping to refine the project plan down to the details of the prediction
    goal, and informing the data requirements. Then, most of step 4, data preparation,
    can be handled by your existing internal staff. The core predictive modeling is
    where you’ll need the most intensive expert assistance, but that step is relatively
    short in terms of person hours and calendar days.


    Eventually, as you tackle more ML projects and move toward establishing more in-house
    expertise, training your existing staff is a favored way to “grow your own” ML
    team. In addition to training your staff, ML leadership innovator and professor
    Bryan Bennett advocates for a complementary approach he calls the DataScienceStein
    approach—à la Frankenstein’s monster. Since data scientists are hard to come by
    and'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'data science involves so many varied skills, he suggests “building your data
    scientist out of a team of people currently on staff or readily available in the
    marketplace” with the right complementary skills.


    ML experts come from all kinds of backgrounds and scientific fields. While your
    staff further develops its ML skills, keep in mind that we see ML practitioners
    who have moved laterally from all walks of life, including neurosurgeons, physicists,
    and psychologists. It turns out that experience in all kinds of quantitative fields
    often translates quite nicely to working in ML.


    As you bring staff onboard or upskill them, beware the overzealous notion of an
    “all-capable” data scientist. It’s better your staff develop the specific skills
    that your ML project needs than for them to pursue the overly ambitious goal of
    becoming an individual super-employee capable of performing any and all data-related
    tasks. Make sure the project roles are well defined and the team member skills
    meet the needs of each role.


    Regardless of how you source your staff for an ML project, they won’t come cheap.
    For how much time will you need to utilize these in-demand experts?


    # ## Projecting the Project: How Long It Will Take


    > > In theory there is no difference between theory and practice, while in practice
    there is.

    > > —Benjamin Brewster, nineteenth-century American industrialist


    You might be in for a long journey. ML projects vary in duration as widely as
    enterprise projects in general. And they suffer delays as often as any kind of
    operational change.


    In the very best of scenarios, the stars could align for a two-month project.
    This could be the case, for example, if you’re cranking out a model to target
    an existing direct marketing operation—swapping it into an established process,
    and only requiring batch deployment from within the ML software without the need
    to export the model.'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'In contrast, Jack''s project at UPS took years to launch at full scale. It
    was a first-of-its-kind initiative at the company, deploying a model within a
    complex, semi-automatic system for which extensive in-person staff training was
    required across many sites.


    Only the people and protocols at your company can properly project the timeline.
    But, to help establish your rough estimate, here are some ballpark ranges for
    each step, with the caveat that, for each one, the sky could turn out to be the
    limit:


    +   Steps 1, 2, 3: Establish the deployment goal, prediction goal, and evaluation
    metrics: two weeks to three months.

    +   Step 4: Prepare the data: four weeks to five months.

    +   Step 5: Train the model: three weeks to two months.

    +   Step 6: Deploy the model: three weeks to one year.


    Even with great excitement about a new ML initiative, the first three pre-production
    steps make for an era of planning, socializing, and greenlighting. Your up-front
    pitch may take less than two minutes, but you will need to ride that elevator
    quite a few times.


    Of the three technical steps, the most sophisticated science takes the least calendar
    time. Data preparation is a perpetually underestimated bottleneck, and model deployment
    can be as well, especially if it requires the model to be integrated into existing
    real-time systems. On the other hand, although model-training demands the greatest
    depth of ML experience and expertise, it''s a relatively contained, isolated process—the
    steps just before and after it effectively buffer the core number crunching itself
    from many enterprise complexities.


    Another consideration makes the project timeline harder to estimate and potentially
    drags it out: Following the six steps is not a linear process.


    # Backtracking: Iteratively Looping on the Steps


    Almost always what happens in my most successful engagements is you get trust
    and buy-in up front, you try to solve the problem, and then you''re wrong about,
    like, half of the assumptions . . . you'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'uncover things you have to adjust and adapt in the middle of the project.

    —Dean Abbott, renowned consultant and chief data scientist of Abbott Analytics


    With bizML, you backtrack a lot, looping back to a previous step as new insights
    come to bear. At each iteration, the team must reconvene with stakeholders to
    revisit earlier choices. Here are some examples:


    +   - While preparing the data, data scientists or data engineers discover that
    there aren’t enough positive examples available. This triggers team members to
    reconvene and modify the prediction goal to be one for which there are plenty.

    +   - While training the model, data scientists detect a bug in the training data:
    a data leak. This circles back to data preparation.

    +   - After training the model, its performance is disappointing and decision
    makers say it’s not ready for deployment. This can mean circling back to any previous
    step, such as reconsidering the prediction goal, reconsidering the evaluation
    metrics, or enhancing the training data.

    +   - During deployment, field tests show that model-scoring is too slow, because
    the model itself is too complex. By circling back to model training, it may be
    possible to generate a simpler, faster model that exhibits only a minimal loss
    in predictive performance. In one famous case, Netflix decided not to deploy the
    complex model with which competitors won the firm’s $1 million contest to improve
    movie recommendations. Netflix elected to deploy internally developed models instead.

    +   - After deployment, the business context changes—new regulations emerge or
    new strategic imperatives are handed down that prompt a change to the deployment
    goal. Although this means beginning again with step 1, much of the work completed
    throughout all the bizML steps may be repurposable during this new project iteration.'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'In the best of cases, you circle back due to a happy surprise or a new inspiration.
    For example:


    +   - During model training, an input variable unexpectedly proves to be important,
    inspiring the introduction of related data sources during data preparation.


    Critically, each time the project backtracks, a cross-disciplinary team jointly
    navigates, incorporating the insights of data scientists as well as those of business
    stakeholders and operations managers.


    # Life after Launch: Maintaining the Model


    “Developing and deploying ML systems is relatively fast and cheap, but maintaining
    them over time is difficult and expensive,” warns a technical paper from Google.
    This writing has gained some notoriety among data scientists—although perhaps
    not enough, in my opinion. The paper’s title would strike fear in the most stoic
    accountant: “Hidden Technical Debt in Machine Learning Systems.”


    When you launch astronauts into space, you commit yourself to a new job: You’ve
    got to keep them alive. Likewise, once it’s in play, sustaining a model’s viability
    moving forward takes maintenance, monitoring, and vigilance. The model and the
    deployment infrastructure that cradles it join the ranks of mission-critical enterprise
    systems. These things require upkeep.


    For one thing, models stagnate. If they remain unchanged, they degrade. The world
    changes around them. The economy shifts and customer behavior patterns evolve.
    As a result, the data over which a model was trained becomes less pertinent, less
    representative of today’s world. After all, that training data becomes a part
    of the more distant past every day. Over time, your model inevitably devolves
    into a defunct dinosaur, a phenomenon known as model drift. This prompts the need
    to monitor model performance over time. The tools and techniques for doing so
    are sometimes collectively called ML observability.'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'The remedy is to periodically update the model. That''s standard protocol.
    This normally means training a whole new model over more recent data (incrementally
    updating an existing model is an alternative, but only rarely worth the complexity
    involved). For some projects, the refresh is daily and for others it''s annual.
    It can be triggered when model performance weakens or can be scheduled at regular
    intervals. When the world changes drastically, due to political upheaval, natural
    disasters, or a pandemic, models become outdated more quickly. Such events potentially
    highlight ML''s strength: the capacity to adapt to a changed world. But this capacity
    is realized only if you refresh the model on data that reflects the new world
    in which you now live.


    It''s worth clarifying that, in a certain sense, some deployed models adapt on
    their own between updates in that the inputs are always kept updated. For example,
    FICO Falcon''s fraud detection model is updated only once a year for the 9,000-plus
    banks that use it. But some of its inputs are engineered to track the ever-changing
    usage patterns of each individual cardholder. For example, if a cardholder begins
    to regularly shop at small online stores, an input could reflect this change in
    the individual''s tendencies, showing such purchases as less anomalous for them.
    This level of adaptation is continuous and ongoing between model updates. What
    changes with periodic model updates is how the model weighs and considers such
    an input, whereas the input itself is continually updated.


    The expense of upkeep only adds to the already substantial price tag attached
    to each ML project. The resources needed just to get to deployment include staff,
    software, and deployment infrastructure, such as data pipelines and possibly an
    upgraded operational system to incorporate model scoring. The total that these
    expenditures come to can grow almost as much as for any kind of business initiative.


    But ML''s value eases the sticker shock. Divide the estimated win by the cost
    and you have your potential ROI. It''s bound to be strong for one simple reason:
    Prediction pays.


    But beyond the business gains, there''s a nonfinancial consideration to also account
    for.'
  merge: -1
  img_proc: true
- pgno: 238
  md: "# # Morality Matters\n\n> > AI is a superpower that enables a small team to\
    \ affect a huge number of people's lives . . . make sure the work you do leaves\
    \ society better off.\n> \n> —Andrew Ng\n\nWhen you use ML, you aren't just optimizing\
    \ models and streamlining business. You're governing. In effect, models embody\
    \ and implement policies that control access to opportunities and resources, such\
    \ as credit, employment, housing—and even freedom, when it comes to arrest-prediction\
    \ models that inform parole and sentencing. Insurance risk models determine what\
    \ each policyholder must pay, and targeted marketing determines who gains discounts,\
    \ exclusive deals, and even the awareness of certain financial products.\n\nWhen\
    \ ML acts as the gatekeeper to these opportunities, it can perpetuate or magnify\
    \ social injustice, adversely affecting underprivileged groups by undeservingly\
    \ denying access disproportionately often. Here are four ways in which that can\
    \ happen, among others:\n\n+   1. Discriminatory models: Models that take a protected\
    \ class such as race or national origin as an input so that their decisions are\
    \ directly based in part on that class. These models discriminate explicitly,\
    \ doing so more visibly and detectably than a person who discriminates but keeps\
    \ private the basis for their decisions. For example, such a model could penalize\
    \ a Black person for being Black. Although outlawed in some contexts and relatively\
    \ uncommon so far, some decorated experts in ML ethics loudly advocate for allowing\
    \ protected classes as model inputs.\n\n+   2. Machine bias: Unequal false-positive\
    \ rates between groups, which means the model incorrectly denies approval for\
    \ or access to opportunities to one group more often than another. This can and\
    \ often does occur even if the model is not discriminatory (per above), since\
    \ a model can employ other, unprotected input variables as proxies"
  merge: -1
  img_proc: true
- pgno: 239
  md: 'for a protected class. For example, ProPublica famously exposed a rearrest-prediction
    model that wrongly jails Black defendants more often than White defendants.


    +   3. The coded gaze: When a group is underrepresented in the training data,
    the resulting model won’t work as well for members of that group. This results
    in exclusionary experiences, such as when a facial recognition system fails for
    Black people more often than for people of other races. Also known as representation
    bias, this phenomenon can also occur for speech recognition.


    +   4. Inferring sensitive attributes: A model’s predictions can reveal group
    membership, such as sexual orientation, whether someone is pregnant, whether they’ll
    quit their job, or whether they’re going to die. Researchers have shown that it
    is possible to predict race based on Facebook likes, and officials in China use
    facial recognition to identify and track the Uighurs, a minority ethnic group
    systematically oppressed by the government. In these cases, sensitive information
    about an individual is derived from otherwise innocuous data.


    The question to always ask is, “For whom will this fail?” says Cathy O’Neil, author
    of Weapons of Math Destruction and one of the most visible activists in ML ethics.
    This fundamental question conjures the four issues above and many others as well.
    It’s an ardent call to action that reminds us to pursue ethical considerations
    as an exercise in empathy.


    Only proactive leaders can meet these ethical challenges. Companies using ML are
    mostly frozen by the cosmetics demanded by corporate public relations. It’s often
    only to posture when firms call for ML deployment to be “fair, unbiased, accountable,
    and responsible.” These are vague platitudes that don’t alone guide concrete action.
    Declaring them, corporations perform ethics theater, protecting their public image
    rather than protecting the public. Rarely will you hear a firm come down explicitly
    on one side or the other for any of the four issues I listed above, for example.


    O’Neil has taken on the indifference to these and other issues with another weapon:
    shame. She advocates for shaming as a means to battle'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'corporations that deploy analytics irresponsibly. Her more recent book, The
    Shame Machine, takes on “predatory corporations” while criticizing shame that
    punches down rather than up. The fear of shame delivers clients for her model-auditing
    consulting practice. “People hire me to look into their algorithms,” says O’Neil.
    “Usually, to be honest, the reason they do that is because they got in trouble,
    because they’re embarrassed . . . or sometimes it’s like, ‘We don’t want to be
    accused of that and we think that this is high-risk.’”


    But I would invite you to also consider a higher ideal: Do good rather than avoid
    bad. Instead of dodging shame, make efforts to improve equality. Take on the setting
    of ethical ML standards as a form of social activism. To this end, define standards
    that take a stand rather than only conveying vague platitudes. For starters, I
    advocate for the following standards, which I consider necessary but not sufficient:
    Prohibit discriminatory models, balance the false-positive rates across protected
    groups, deliver on a person’s right to explanation for algorithmic decisions—at
    least in the public sector—and diversify analytics teams.


    Your role is critical. As someone involved in initiatives to deploy ML, you have
    a powerful, influential voice—one that is quite possibly much more potent than
    you realize. You are one of a relatively small number who will mold and set the
    trajectory for systems that automatically dictate the rights and resources to
    which great numbers of consumers and citizens gain access. Allan Sammy, director
    of data science and audit analytics at Canada Post, put it this way: “A decision
    made by an organization’s analytic model is a decision made by that entity’s senior
    management team.”


    ML can help rather than hurt. Its widening adoption provides an unprecedented
    new opportunity to actively fight injustice rather than perpetuate it. When a
    model shows the potential to disproportionately affect a protected group adversely,
    it has put the issue on the table and under a spotlight by quantifying it. The
    analytics then provide quantitative options to tackle injustice by adjusting for
    it. And the very same operational framework to automate or support decisions with
    ML can be leveraged to deploy models adjusted to improve social justice.'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'As you follow this book’s practice to get ML successfully deployed, make sure
    you’re putting this powerful technology to good use. If you optimize only for
    a single objective such as improved profit, there will be fallout and dire ramifications.
    But if you adopt humanistic objectives as well, science can help you achieve them.
    O’Neil sees this, too: “Theoretically, we could make things more fair. We could
    choose values that we aspire to and embed them in code. We could do that. That’s
    the most exciting thing, I think, about the future of data science.”


    Over the last decade, I have spent a considerable portion of my work on ML ethics.
    For a more in-depth dive, such as a visual explanation of machine bias, a call
    against models that explicitly discriminate, and more details regarding the standards
    I propose, see my writing and videos at www.civilrightsdata.com.'
  merge: -1
  img_proc: true
