- pgno: 62
  md: '2. Target: Establish the prediction goal. This step defines exactly what the
    model will predict for each individual case. Each detail of this matters from
    a business perspective.


    3. Performance: Establish the evaluation metrics. This step defines which measures
    matter the most and what performance level must be achieved—how well the model
    must predict—for project success.


    4. Fuel: Prepare the data. This step defines what the data must look like and
    gets it into that form.


    5. Algorithm: Train the model. This step generates a predictive model from the
    data. The model is the thing that’s “learned.”


    6. Launch: Deploy the model. This step uses the model to render predictions (probabilities)—thereby
    applying what’s been learned to new cases—and then acts on those predictions to
    improve business operations.


    These steps define a business practice that forges and navigates a shrewd path
    to ML deployment. Anyone who wishes to participate in ML projects must be familiar,
    no matter whether you’ll play a role on the business side or the technical side.
    Rip out the one-page cheat sheet toward the end of this book and hang it on the
    wall above your desk.


    If you’ve seen this book’s table of contents, these six steps will look familiar.
    They’re the six subsequent chapters of this book. For each step, a full chapter
    is dedicated to exploring the step’s considerations, decision points, and challenges.


    After culminating with step 6, deployment, you have finished . . . starting something
    new. BizML only begins an ongoing journey, a new phase of running improved operations—and
    of keeping things working. Once launched, a model requires upkeep: monitoring
    it, maintaining it, and periodically refreshing it. This book’s conclusion introduces
