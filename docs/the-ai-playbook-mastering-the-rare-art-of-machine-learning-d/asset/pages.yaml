    # Why Deployment Requires a Mental Leap


    Paradigm shifts don’t come easy. To deploy ML is to run mammoth numbers of decisions
    probabilistically, to systematically apply probabilities on a much lower level
    of granularity than traditionally conceived of. If you’re a data scientist, allow
    me to shatter your world: Probabilistic thinking is a trendy notion, yes, but
    probabilistic doing—methodically acting on probabilities—is barely on the radar
    for most people.


    In most popular media and books, probability serves only to support singular decisions,
    rather than millions of everyday operational ones. Nate Silver’s popular book,
    The Signal and the Noise, tells us to “think probabilistically.” It focuses on
    singular events such as terrorist attacks, economic recessions, pandemics, and
    political elections. And Peter Bernstein’s bestseller Against the Gods chronicles
    the historical development of probabilistic methods. Neither book even hints at
    applying probability to change the very way we drive our large-scale operations.
    It’s one thing to think probabilistically—it’s another to act probabilistically
    hundreds of thousands of times a day.


    The first deployment takes a mental leap. Even rolling out the most well-trodden
    application requires a revolutionary mindset, if it’s your organization’s first
    time—which is today still the case for most applications at most organizations,
    as ML’s commercial deployment is still relatively young. For example, imagine
    a company that’s considering deploying ML for fraud detection for the first time:


    # Application: Fraud detection


    # Desired business outcome: Catch more fraudulent transactions.


    +   1. What’s predicted: Will the transaction turn out to be unauthorized?


    +   2. What’s done about it: Manually audit the transaction.


    Before deploying ML, a team of human auditors is doing their best to comb through
    transactions to find those enacted by criminals.'
