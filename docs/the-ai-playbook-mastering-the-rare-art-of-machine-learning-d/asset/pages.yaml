- pgno: 198
  md: '# 6 Launch


    Deploy the Model


    To deploy a model is to propel it from the lab to the field where the enterprise
    will drive operational decisions with its probabilistic scores. To be specific,
    each time the model scores an individual, that score directly informs the action
    taken for that individual, such as whether to contact, approve, or audit. This
    culminating project step is where machine learning begins to deliver its value
    (so begins model upkeep, which is covered in the conclusion).


    Deployment requires full-stack organizational buy-in, cooperation from staff at
    every level. While executives are the ones who approve it, operational staff must
    also agree, since that’s where deployment introduces change. How do you overcome
    the resistance to such change? How do you mitigate the risk of deployment mishaps
    and assuage even the most risk-averse stakeholder? How do you translate predictive
    probabilities into operational actions? How do you engineer the right data into
    the model on the fly and get the model to work in only milliseconds for high-speed
    processes? In the end, even if performance improves, how do you prove that the
    credit should go to your ML project rather than to other changes within or outside
    the organization? As UPS and EduPay conclude their stories, we’ll have our answers.


    # The BizML Practice:


    +   1. Value: Establish the deployment goal.

    +   2. Target: Establish the prediction goal.

    +   3. Performance: Establish the evaluation metrics.

    +   4. Fuel: Prepare the data.

    +   5. Algorithm: Train the model.

    +   6. Launch: Deploy the model.


    After step 6: Maintain the model (covered in the conclusion).'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'Jack Levi was in deep water at UPS. So far, trial runs of Package Flow Technology—the
    system that deployed his delivery-prediction model—had only delivered disappointment.
    “Things were really ugly internally,” Jack reflects. “It was a nightmare.”


    The rocky road to deployment will test any technology pioneer’s mettle.


    But this wasn’t only an internal affair. The media had caught wind of it and blown
    the lid off. “New Package Flow Technology Not Delivering at UPS,” screamed a Computerworld
    headline. The feature story continued, “Its highly touted Package Flow Technology
    isn’t flowing as smoothly as expected, with problems at about a third of the 300
    or so centers where it has been implemented.”


    Within an office shut off from the kerfuffle, the COO of UPS chastised Jack privately.
    It was a heated discussion and the fallout would reverberate for a long while.
    Even two years later when they were discussing the next project iteration, the
    COO looked Jack dead in the eye with the stare that only a Fortune 500 executive
    could muster. “I don’t want another Package Flow—don’t you dare do that.”


    Remember that stiff upper lip Jack had perfected early in this book? It comes
    in handy when weathering the hailstorms that arise when managing organizational
    change.


    But Jack had good reason to defend his innovation: The problems so far weren’t
    in the technology—they were in the humans. To deploy delivery prediction at UPS
    was to ask people to change their habitual routines and embrace a new paradigm.
    It’s a story as old as machine learning: The deployment plan was easier said than
    done.


    # Shift Happens: When a Legacy Process Goes Digital


    Out with the old, in with the new. Package Flow Technology (PFT) was designed
    to boost efficiency by replacing each shipping center’s legacy process with one
    that’s more automated and centralized:'
  merge: -1
  img_proc: true
- pgno: 200
  md: '**Legacy process:** Each day, humans assign the delivery regions (sequences)
    that each truck must cover. Many of these decisions come while loading the trucks,
    during which time the staff adjust the assignments in an ad hoc manner as they
    deem necessary. This sometimes means reassigning packages that have already been
    loaded, shifting them from one truck to another.


    **Updated process:** The PFT system centralizes and semi-automates the assignment
    of sequences to trucks, based largely on predicted deliveries. Just before truck-loading
    begins, a planning manager completes final adjustments through a central PFT console
    in the hope that little to no further revisions will take place on the fly during
    the loading process.


    If adopted fully, this process change would radically improve the efficiency of
    operations: It would decrease the mileage—and the time clocked by drivers—accumulated
    across the entire fleet of trucks. It could accomplish this because of two fundamental
    advantages over the legacy process. First, it dynamically incorporated the prediction
    of as-yet unknown deliveries in order to plan and begin loading the trucks early
    for on-time departures. Second, it centralized decision making so that it applied
    across all the shipping center’s trucks at once. This would beat the legacy process’s
    distributed decisions made by individual truck loaders on the fly while loading.


    With the PFT system in place, these two advantages held even when managers made
    manual adjustments to the plan. When they did so, it was at a central console,
    with a bird’s-eye view across all the trucks going out that day. The console incorporated
    the day’s predicted deliveries along with known deliveries. As a manager revised
    the plan on-screen, it displayed the forecasted effect based on both known and
    predicted deliveries.


    But the system had some “bugs”: the humans—in particular, those who were carrying
    out its instructions. If the staff loading the trucks overrode the centralized
    decisions too often, the benefits of PFT and delivery prediction would vanish.
    Changing a package’s truck assignment meant not only enacting a potentially suboptimal
    decision'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'without the bird''s-eye perspective provided by the central console; it could
    also mean inefficiently moving packages that were already loaded. This risked
    delaying trucks so they wouldn''t depart on time. Moreover, when staff vetoed
    the system and loaded a package onto another truck, they typically wouldn''t update
    the system. This meant the physical world and the digital world didn''t align—and
    that spelled trouble. Following the data on their handheld device, a driver would
    go to deliver a package that was in actually on another truck, and the driver
    of that other truck wouldn''t even know they had the package. To address this
    misalignment, Jack formulated a new mantra for his staff: “The data is as important
    as the delivery.”


    Clearly, Jack''s team had more work to do getting these staff members to change
    their ways. With the legacy process, staff had applied their hard-earned knowledge
    and experience. If a seasoned truck loader saw a package with a delivery address
    that they recognized, they''d reflectively say, “Oh, that''s got to go on the
    truck with this other package.” To realize the potential gains in efficiency,
    Jack and his team would have to convince and reorient staff to more strictly follow
    a preordained plan while loading the trucks.


    # To Manage Change, Change Management


    > Two-thirds of my effort was deployment, versus models and build with IT.

    > —Jack Levis


    Staff at every level resist change, from the loading dock to the top-floor offices.
    Recall another precarious moment from earlier in this book, when Jack, struggling
    to gain authorization from Chuck, the executive, literally took him for a ride
    to demonstrate the system''s truck navigation. Just as Chuck initially had a tough
    time swallowing decisions that seemed to defy his human intuition, so did those
    who loaded the trucks.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'But staff at every level must cooperate. Deployment stalls when an organization
    can’t or won’t. To gain buy-in from both the bottom and the top is to ensure both
    the “can” and the “will” of deployment—both the capacity and the authorization.
    Executives approve change, and yet those executing must also comply. We must achieve
    full-stack organizational buy-in.


    Different decisions, same story. This chapter’s story is a prequel to the episode
    with Chuck. Here, Jack works to get prescribed truck loading implemented properly.
    Only later did he get Chuck to approve prescribed truck navigation.


    The efficacy of technology so often comes down to human adoption. “The most difficult
    part of my job is not actually working with mathematicians to come up with a beautiful
    model to solve a problem,” lamented a keynote speaker years later, as he strode
    across the stage at Machine Learning Week 2022. As the conference chair, I’d enlisted
    another leader from UPS, network planning and optimization director Yentai Wan.
    He continued, “The most difficult part of my job is actually deployment. It’s
    the so-called change management. How do I convince those end-users to switch from
    the legacy system and leverage the modernized technology we build out?”


    Such change-management challenges aren’t new in general, but when it comes to
    ML projects, the need to shrewdly manage operational change is often overlooked.
    The advanced modeling algorithm itself absorbs much of the project’s attention
    and seems to promise the moon. ML delivers a rocket, but those in charge still
    must oversee its launch.


    # Training Daze


    > Large-scale change requires advancing an inspirational vision, building relationship
    capital, and maintaining organizational alignment . . . leadership simultaneously
    embraces unifying and disruptive ideals.

    > —Christopher Hornick, The Last Book of Leadership'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'In order for transformation to be successful, leaders must approach it in ways
    designed to . . . drive emotional commitment from employees.


    > —Andrew White et al., “Organizational Transformation Is an Emotional Journey,”
    Harvard Business Review


    With PFT’s effectiveness in question, Jack felt the heat. But he and his team
    still saw the same potential as always, even if the payoff was presently delayed.
    The problem was in the human piece, not the technical system. Jack and his team
    had underestimated the effort required to gain widespread buy-in and compliance.
    It was time to follow through in that effort.


    So they doubled down on change-management efforts. At each shipping center, the
    training team would have to stick it out, refusing to leave until performance
    results were attained. Transferring knowledge wasn’t enough. The center’s staff
    might be fascinated by the new system, but that excitement was often just a flash
    in the pan. Left on their own too quickly, they would return to old routines.


    How do you reform stubborn creatures of habit? There’s always sheer will and an
    iron fist. Big change requires some law enforcement. The team supervised, cajoled,
    and even micromanaged a bit. For example, loaders who struggled to break old habits
    were reassigned to new areas with which they weren’t familiar, where they wouldn’t
    recognize delivery addresses. You can’t take the knowledge out of a person, but
    you can take the person out of their domain of knowledge.


    But babysitting and arm-twisting go only so far. Rather than relying solely on
    the application of pressure, Jack’s team mobilized by sharing the rewards of success.
    The trick was to reward in terms of short-term success since improvements to bottom-line
    efficiency would take some time to materialize. “Because those early transition
