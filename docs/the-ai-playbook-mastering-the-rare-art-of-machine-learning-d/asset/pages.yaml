    |---|---|---|---|

    | Logistic regression | A weight for each input | Apply the formula to the inputs:
    Add up a weighted sum of the inputs and then apply a nonlinear adjustment. | Easy
    to interpret, but usually outmatched by more advanced methods. |

    | Naive Bayes | A factor for each input for positive cases and the same for negative
    cases | Apply the formula to the inputs: Roughly speaking, multiply the inputs''
    factors for positive, then for negative, then normalize. | Easy to program and
    robust against overfitting but limited in predictive performance. |

    | Ensemble models | A set of simple models—sometimes all decision trees (e.g.,
    random forests and TreeNet) and sometimes varied (e.g., boosting and bagging)
    | Score with each simple model and then combine the scores, e.g., by averaging
    them or taking a vote. | An elegant way to improve over simple models, but the
    resulting amalgam of models is difficult to interpret (opaque). |

    | Deep learning | The many weights within a large, complex mathematical formula
    (a deep neural network) | Apply the formula to the inputs (complex). | A breakthrough
    advanced method, which can handle a great number of inputs—e.g., each pixel of
    a high-resolution image—without the need for preprocessing, but difficult to interpret
    (opaque), computationally expensive, and often requires highly technical human
    expertise to use successfully. |


    When experts mention one of these, such as decision trees or ensemble models,
    they are referring to two things at once: the structure of the model and the process
    to train it. These two aspects are always paired. The model''s structure can be
    things like a tree, a simple formula, or a'
