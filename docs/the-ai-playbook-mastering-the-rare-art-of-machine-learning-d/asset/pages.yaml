- pgno: 22
  md: '# Optional FAQ: What This Book Is about and Who It’s For


    You may skip this optional FAQ—but I advise looking through the questions below
    for those that pertain to or interest you. Readers of this book come with diverse
    backgrounds and various preconceptions about the problem the book aims to solve:
    getting machine learning deployed. This FAQ will orient you, clarifying why you
    should read this book and aligning your expectations.


    # What is this book about?


    This book presents a strategic and tactical playbook for launching machine learning,
    a six-step discipline to run an ML project so that it successfully deploys. I
    call this practice bizML.


    Along the way, the book also delivers the semi-technical background knowledge
    everyone participating in the project needs—in a friendly, accessible way anyone
    can understand. Because of that coverage, the book also serves as a non-technical
    introduction to the field for newcomers.


    # Why does machine learning need a specialized business practice?


    Here’s the problem. ML is the world’s most powerful generally applicable technology.
    But ML can only improve large-scale operations by changing them. For that reason,
    an ML project shouldn’t be viewed as “a technology project.” Instead, to make
    an impact, it must be reframed as a business project meant to improve operational
    performance, with ML as only one component—one that’s necessary but not sufficient.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'With the attention overwhelmingly focused on the technical portion and its
    execution, the industry has failed to establish a widely adopted business practice
    for executing *the whole other half* of a successful ML project. As a result,
    new ML initiatives routinely fail to deploy.


    # If most machine learning projects fail to deploy, is the field of machine learning
    a flop?


    Not at all. Many ML projects succeed, even if it''s only a minority—even a fraction
    of this popular field''s many projects is still many. Moreover, in certain circumstances
    an ML project is bound to succeed, such as high-priority projects at a Big Tech
    firm or projects meant to update an existing model that''s already deployed. The
    industrial world remains bullish on ML because its great potential remains intact.


    # Since this book covers a practice for running ML projects, is it only for leaders?


    No. When an ML project follows bizML, the organizational practice presented by
    this book, everyone involved in the project participates in that practice in some
    way. Only with universal familiarity with this end-to-end practice—and with the
    semi-technical background knowledge that drives it—can the team collaborate most
    effectively.


    # Who is this book for?


    This book serves anyone who wishes to gain value with ML by participating in its
    business deployment, no matter whether you''ll play a role on the business side
    or the technical side.


    First and foremost, I wrote this book for business professionals—the people who
    run the ML project, hold stakes in it, make decisions about it, or manage the
    operations that will be changed (and improved) by it. This includes executives,
    directors, managers, consultants, and leaders of all kinds.


    But this book is for techies, too. If you''re a data scientist, ML engineer, or
    any kind of technical practitioner involved with ML, this book invites you to
    step back from the hands-on execution and gain'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'a new perspective on the holistic paradigm within which you are contributing.


    # Is this book a how-to?


    This book is a business how-to, but not a technical how-to. Unlike most ML books,
    it tackles the business practice instead of the technical practice. It presents
    a six-step business practice, bizML, for running an ML project.


    This book does not delve deeply enough to guide data professionals in the technical
    how-to. That’s what the vast majority of other ML books are for. The ML methods
    they cover are only one ingredient. They constitute a key technical component
    of the project, but that component makes for only one of the six project steps
    covered in this book. Accordingly, one and only one chapter of this book, chapter
    5, delves into core ML methods—it provides an accessible “crash course.”


    This book also differs from most business books on ML, which present a strategic
    industry overview. Such books typically cover the topic from a higher level, without
    providing how-to guidance and without concretely detailing how ML integrates to
    deliver operational improvements.


    # What introductory materials should I read before this book?


    None are required. This book is accessible for all readers and serves as a conceptually
    complete introduction to the field of ML for newcomers. While describing the end-to-end
    steps for executing an ML project, it covers the fundamentals along the way. Gaining
    some background knowledge of ML methods before reading this book certainly wouldn’t
    hurt, but considering the theme of this book—the business vantage of an ML project
    should precede the technical vantage—you are invited to read this book first and
    then determine how much further you’d like to dig into the core technology.


    # I already understand that ML projects must begin with a business objective—do
    I need this book?'
  merge: -1
  img_proc: true
- pgno: 25
  md: "Establishing the deployment goal is only the first step—literally. It’s the\
    \ first of this book’s six-step bizML practice. The rest serve to accomplish that\
    \ goal. Pursuing it demands an in-depth, end-to-end procedure. The helpful mantra\
    \ “begin with the business objective” alone does not surmount the challenges of\
    \ deployment. It takes a book.\n\n# I’m a business professional, not a data scientist—do\
    \ I really need semi-technical knowledge?\n\n> Rapid, continuous learning and\
    \ reskilling . . . starts at the top. AI requires a new type of C-suite leadership,\
    \ with deep understanding of AI and its implications . . .\n> \n> —Julie Sweet,\
    \ chair and CEO of Accenture\n\nYes, you must achieve a particular kind of _data\
    \ literacy_ in order to be involved in the deployment of ML, helping to guide\
    \ each project and ensure that it works within—and successfully produces value\
    \ for—business operations.\n\nYou may be unconvinced. After all, to drive a car,\
    \ you don’t need to know how the engine works. True—but you do need expertise:\
    \ a keen feel for how the car moves, a sense of the physics, including the momentum\
    \ of the vehicle and the friction of the tires. As a driver, you’ve also internalized\
    \ the rules of the road and you know what moves to expect from other drivers and\
    \ what they’ll expect from you.\n\nDriving an ML project is just the same. To\
    \ pursue the goal of improving operational performance, you need the what, why,\
    \ and how much. You need to understand the precise way in which this technology\
    \ will enact change to business processes, the basis of those changes, and a quantitative\
    \ appraisal of how well it is working.\n\nFear not—you don’t need a degree in\
    \ the “rocket science” part, and what you do need to learn goes down easy. It’s\
    \ conceptual, not hands-on, and requires no heavy math. This book delves into\
    \ the nifty principles of internal combustion, not how to change a spark plug.\
    \ This level of data literacy is useful for almost everyone, like driver’s education,\
    \ not auto-mechanic school."
  merge: -1
