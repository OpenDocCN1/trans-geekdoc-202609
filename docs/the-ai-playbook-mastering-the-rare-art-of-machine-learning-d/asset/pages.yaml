    You now know the main requirements for training data:


    **Training data:** The data from which modeling learns—that is, the data from
    which ML generates a predictive model. If the training data includes labels that
    indicate whether each example is positive or negative, it is supervised training
    data, which is required for supervised ML, the kind of ML covered in this book.


    For most business applications of ML, the training data is really that simple:
    a two-dimensional table with one row per example. That’s why it’s also affectionately
