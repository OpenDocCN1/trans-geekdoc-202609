  md: 'supplements the model predictions themselves so that they can be acted upon.


    # Translating Predictions to Actions


    For EduPay, predictions drove ad selection in a relatively direct manner—but you
    always need some customized logic to top things off. A user arrives on a web page,
    so it’s time to pick the ad. The system has 291 models—one per ad—and uses them
    to derive 291 probabilities. Each one tells you the chances that this user would
    respond if shown the corresponding ad. If you choose the ad with the highest probability,
    you’re most likely to receive a response from the user.


    But there was another factor at play: each ad’s bid, that is, the amount the sponsor
    would pay for each response. No surprise: EduPay’s aim was to increase revenue,
    not clicks. So the *expected return* for each ad was calculated, simply by multiplying
    the probability of a response by the bid. For example, consider choosing between
    these two ads:


    Ad A has a probability of 20 percent and a bid of $5, so the expected return is
    $1.


    Ad B has a probability of 10 percent and a bid of $15, so the expected return
    is $1.50.


    The system will choose ad B, even though it has a lower probability of response.
    By running things this way, we don’t maximize responses, but we do maximize revenue.
    Recall the chapter 3 sidebar where we similarly transformed the probability that
    a debtor would repay into the expected return by factoring in the revenue generated
    by a loan.


    Beyond this, EduPay also had to filter ads by eligibility. Sponsors would only
    pay for responses by eligible candidates, such as certain military recruitment
    pertaining only to users who were seventeen years old or older.


    In the end, simple logic and arithmetic translate predictions to actions. For
    each ML project, leaders manually design this translation based on business pragmatics
    and requirements. The translation'
