- pgno: 177
  md: 'is ready. Now we get to feed it into the modeling software and push the “go”
    button.


    When researchers set out to invent that software, they had their work cut out
    for them. They had to develop the step-by-step instructions for building a model
    from data. That is, they had to write a computer program that would generate a
    mechanism that itself would work with the dozens or hundreds of input values for
    an individual in order to calculate the predictive score for that individual.
    This model is expected to predict reasonably well for the example individuals
    within the training data used to guide its creation. More importantly, it must
    also predict well for a held-aside test dataset of examples. This separate set
    of cases serves to estimate the model’s performance in general on unseen cases
    never before encountered. That evaluation step tells you whether the modeling
    has succeeded.


    What a challenge! Imagine the plight of your poor computer, a feeble, knowledgeless
    mechanism. You pour reams of data into it, but it doesn’t “understand” the data.
    The variables have no meaning to it. It has no general knowledge about user profiles
    and behavior as you do— nor does it grasp what it’s trying to predict, the real-world
    meaning of the output variable.


    The model has to take into consideration all the dozens or hundreds of factors
    known about a new, unique situation or individual. Given the input variables that
    define that situation, how should it weigh or combine all these factors to calculate
    the most precise probability of a positive outcome? More to the point, how could
    the computer automatically learn to do that—that is, how could it automatically
    generate that model?


    You’re about to find out. In the face of this ultimate challenge, predictive modeling
    methods such as those described in this chapter achieve scientific greatness:
    Their models work. The generalizations drawn from past examples still hold when
    applied to new, never-before-seen situations. This capability makes ML the world’s
    most powerful widely applicable technology.


    Modeling methods are tried and true, born of research labs and proven in commercial
    deployment to be adept and robust. When we'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'use them, we’re standing on the shoulders of giants, the researchers who developed
    them. And in beholding them, we’re enjoying the privilege of seeing what methods
    have turned out to work best, skipping past all the trials and tribulations that
    those inventors suffered. As with genius, some say that research is 1 percent
    inspiration and 99 percent perspiration. But for a commercial user of established
    ML methods, it’s no sweat—or at least a lot less sweat.


    It’s easy to get excited by how profound an endeavor this is. Let’s connect that
    excitement to the concrete mechanics by looking at exactly how it works.


    # Decision Trees: Models Made of Rules


    One of the most popular modeling methods is decision trees. A decision tree is
    made up of if-then rules like the one we looked at above—which I did indeed extract
    from a decision tree. Here’s an example:


    ![](img/99a58a0ea5f8204f7fbf446f6593fd4f_178_0.png)


    A decision tree to predict ad response. Start at the top. If the answer is yes,
    go left; otherwise, go right.'
