- pgno: 135
  md: 'With no fraud detection model deployed, a medium-sized regional bank could
    be losing $50 million per year. The following sidebar steps through a scenario
    for such a bank, showing the savings achieved by introducing a fraud detection
    model.


    # The Cost Savings of Fraud Detection


    Consider a bank that has issued 100,000 credit cards and each sees an average
    of 1,000 transactions per year, with one in 1,000 being fraudulent. To summarize:


    +   * Annual transactions: 100 million

    +   * Percentage that are fraudulent: 0.1 percent

    +   * Annual fraudulent transactions: 100,000

    +   * Cost per fraudulent transaction: $500 (the FN cost)

    +   * Annual loss from fraud: 100,000 x $500 = $50 million


    It looks like crime does pay after all. But before you quit your day job to join
    the ranks of fraudsters, let''s see what fraud detection could do to improve the
    situation.


    If the bank is willing to treat two of every 1,000 attempted transactions as potentially
    fraudulent—holding the transaction and possibly inconveniencing the customer—then
    the onus is on a fraud detection model to flag which transactions should be held.


    Let''s assume the model attains a lift of 300. That''s a lot higher than the lift
    of, say, 3 that we discussed in a previous example. But remember that lift is
    always relative to the size of the targeted group. In this case, we care about
    the lift only among the very top, small sliver of transactions scored as most
    likely to be fraudulent—the top 0.2 percent that will be blocked. We won''t block
    any attempted transactions other than those, so that sliver is all that counts.
    Given that it''s such a small portion, a high lift is feasible—a model''s scores
    can potentially sort transactions well enough so that at least the very top portion
    includes a high concentration of positive cases.


    First, we need to calculate how many errors occur, broken into FPs and FNs—how
    often the model wrongly blocks a legitimate transaction'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'and how often it lets a fraudulent transaction slip by. Here''s the breakdown:


    +   Transactions blocked: 200,000 (two per 1,000)

    +   Percentage blocked that are fraud: 30 percent

    +   (Lift × overall fraud rate = 300 × 0.1 percent)

    +   Fraudulent transactions blocked: 60,000 (30 percent × 200,000)

    +   FPs—legitimate transactions blocked: 140,000 (200,000 – 60,000)

    +   FNs—fraudulent transactions allowed: 40,000 (100,000 – 60,000)


    This model is often wrong, but extremely valuable. When it blocks a transaction,
    it''s usually wrong—only 30 percent of the blocked transactions are fraud. This
    isn''t unusual. Since fraud is so infrequent, it would be very difficult to correctly
    detect some cases without also incorrectly flagging legit transactions even more
    often. With legitimate transactions—that is, negative cases—so prevalent, even
    misclassifying a small portion of them means a lot of FPs.


    So the best we can hope for from a model is that it provides an advantageous trade-off
    between FPs (less costly) and FNs (more costly). To calculate the bottom line,
    we add up the costs. We''ve already established the cost for individual errors:


    +   Cost of a FP: $100 (inconvenience to a customer)

    +   Cost of a FN: $500 (fraudster gets away with it)


    So we need only multiply these costs by how often they''re incurred:


    +   Aggregate FP cost: $14 million (140,000 at $100 each)

    +   Aggregate FN cost: $20 million (40,000 at $500 each)

    +   Total cost with fraud detection: $34 million


    We''ve cut fraud losses by $30 million (from $50 million to $20 million), but
    introduced $14 million in new costs resulting from FPs. Clearly, this is a worthy
    trade-off.


    Overall cost savings: $16 million ($50 million – $34 million)


    If you would like to access a spreadsheet with these calculations and try out
    different scenarios—such as varying the model lift, the number of transactions
    held, or the cost of each FP and FN—see the notes for this chapter at www.bizML.com.'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'Fraud detection only achieves the cost savings shown in the sidebar above by
    sacrificing a little accuracy. The model in that example is 99.8 percent accurate,
    slightly lower than the 99.9 percent accuracy of a “dumb” model that simply assumes
    every transaction is legitimate (and therefore takes no action to prevent fraud).
    In this case, a less accurate model was actually better.


    To understand why, just revisit accuracy’s fatal flaw: It doesn’t distinguish
    between different kinds of errors, treating FPs and FNs as equally bad. Since
    it doesn’t account for different misclassification costs, accuracy oversimplifies
    for all but very rare ML projects where the costs don’t differ. For most projects,
    accuracy is a red herring.


    Beyond delivering business value, fraud detection pursues a societal objective:
    It fights crime. In the example shown, it blocks more than half of the attempted
    fraudulent transactions. In so doing, it meets the expectations of consumers.
    Although citizens at large sometimes bristle at being predicted by models—electronically
    pigeonholed to receive bad ads or bad credit—when it comes to using their card,
    many consumers welcome prediction, gladly withstanding the occasional blocked
    transaction. Instead, they bristle when there’s no predictive intervention and
    they’re charged for a purchase they never made. Although they may not quite be
    cognizant of it, the typical cardholder has an expectation of fraud detection.


    In the next chapter, we will return to this vital ML application, payment card
    fraud detection. But first we must finish our discussion of misclassification
    costs.


    # Subjective Costs: Misdiagnosis versus Missed Diagnosis


    Establishing misclassification costs is critical. By doing so we can bridge a
    precarious gap, translating from pure predictive performance to a business KPI.
    Analytics consultant Tom Khabaza has been telling us how important that is for
    a long time—ever since we called ML “data mining.” His Value Law of Data Mining
    states, “There is no technical measure of [a model’s] value. . . . The only value
    is business value.”'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'But sometimes it’s next to impossible to set the costs. Take medical diagnosis.
    If you mistakenly tell a healthy patient they’ve just had a heart attack, that’s
    really bad. You can imagine the unnecessary stress, as well as the unnecessary
    treatments possibly administered. But if you mistakenly fail to detect a real
    heart attack, that’s worse. You let a serious condition go untreated. How much
    worse is a missed diagnosis in comparison to a positive misdiagnosis? A hundred
    times worse? Ten thousand times? Someone’s got to put a number on that and I’m
    glad it’s not me.


    But we all must navigate this kind of judgment call more often than you may realize.
    For example, consider deciding whether to take a COVID-19 test during the pandemic.
    Like predictive models, the at-home antigen tests are imperfect. In the spring
    of 2021, during the delta variant surge, an at-home antigen test briefly convinced
    me that I had COVID, but a subsequent series of negative antigen as well as a
    few negative PCR tests showed me that it had almost definitely been a FP. That
    FP had a cost: Before realizing I was in the clear, my life was greatly disrupted
    as I quarantined from my family and canceled various plans. The cost of inconvenience
    may have paled in comparison to the cost of COVID going undetected, but it wasn’t
    a zero cost. Weighing these costs was rarely made explicit, but an implicit disagreement
    in how they compared underlay contentious public disputes around COVID policies
    and etiquette. In fact, when the United States cut the recommended quarantine
    period in half in December 2021, it was partly because people were intentionally
    avoiding testing in order to avoid the consequences of a potential FP.


    The same challenge applies for predictive policing, where rearrest-predicting
    models inform sentencing as well as decisions for or against paroling an incarcerated
    convict. A FP means someone stays in prison longer, even though they will not
    offend again. A FN means someone is set free sooner, even though they will commit
    a crime again. The quarry of how to determine the relative costs of these two
    kinds of errors rests at the heart of justice. And when one race, ethnicity, or
    other protected group more often experiences injustice by way of a model—that'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'is, when the model commits FPs more for one group than another—it’s called
    algorithmic bias. For more on ML ethics as a general topic, I provide an overview
    at the end of this book’s conclusion. For a deeper dive on algorithmic bias and
    other topics in ML ethics, see my articles and videos at www.civilrightsdata.com.


    For many business applications of ML, we have it much easier. The misclassification
    costs are often self-evident, based on business realities such as the cost of
    marketing, the cost of fraud, or the opportunity cost for each missed customer
    who would have responded if contacted.


    But not always. Even spam detection can go wrong and cost you something immeasurable,
    such as a missed job—or even a missed date with someone you would have ended up
    marrying. A FP means you may miss out on an important message, and a FN means
    you have to manually filter spam out of your inbox. There’s no consensus on how
    to best determine the relative costs of these two, but whoever is behind your
    spam filter made that determination—if not explicitly, then by allowing the system
    to effectively default to something arbitrary.


    Sometimes decision makers must quantify the unquantifiable. They must commit to
    specific costs for misclassification errors—despite the subjectivity and ethical
    dilemmas. Costs drive the development, evaluation, and use of the model. “Be sure
    to assign costs for FPs and FNs that are directionally better than just passively
    assuming the two costs are equal,” industry leader Dean Abbott told me, “even
    when you don’t have a truly objective basis for doing so.”


    # Challenges Translating from Predictive Performance Metrics to KPIs


    The analysis paralysis we may experience when setting costs is not the only obstacle.
    Sometimes, to translate from raw predictive performance to potential KPI improvements,
    you’ve got to make some audacious assumptions. Some projects require a presumptive
    leap in order to estimate the expected business value deployment will deliver.


    I took such a leap when pitching deployment to my first client, gay .com. Although
    they didn’t go for it, you can bet I pitched the churn'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'model''s potential value. At 27 percent, my model showed a lift of 1.5, which
    I translated into a potential profit of $286,000. That''s where the beautiful
    profit curve that I showed them came to a peak, forecasting the effect of a targeted
    marketing campaign offering a discount to customers most at risk for cancellation.


    But the value of churn modeling is harder to forecast than the value of response
    modeling. A response model is trained on data recording a previous marketing campaign,
    but a churn model is only trained on the history of who did and who didn''t cancel.
    Gay.com hadn''t conducted a campaign to retain customers, so even if the model
    promised to target likely defectors well, we could only guesstimate how many of
    those defectors would change their minds after receiving a discount meant to keep
    them around. For gay.com, I assumed the company would gain an average of $100
    in value for every would-be defector offered a $25 discount. The profit calculation
    also had to take into account that the company would lose $25 in revenue for FPs—customers
    who were provided that discount but weren''t actually going to cancel.


    Although gay.com didn''t deploy, my second client, EduPay, courageously launched
    my ad targeting models—despite an equally high dose of uncertainty. Remember that,
    for EduPay, I generated 291 different models, each predicting whether the user
    would respond to its corresponding ad. I could see how well each model predicted,
    but that only indirectly spoke to how much deployment would pan out financially.
    How much would using these predictions improve over the existing process of displaying
    ads that are popular across users in general? Until we conducted the ultimate
    experiment that is model deployment, we couldn''t be certain how much value it
    would generate.


    # To Launch Is to Take a Leap


    At UPS, this uncertainty only added to the pressure Jack Levi felt. It magnified
    the challenge presented by the Innovator''s Paradox—that the more novel or radical
    an idea, the greater the struggle to gain support for it. On top of that, Jack
    now faced the Deployment Paradox:'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'The Deployment Paradox: For some projects, the business value of improved decisioning
    is hard to estimate before deployment; it can only be reliably established _after_
    you deploy.


    Jack''s model was technically sound, predicting up to 93 percent of tomorrow''s
    deliveries correctly. And he knew how to estimate the misclassification costs.
    Each FP cost a good deal, on average, since the resulting plan would include an
    unnecessary delivery destination. FNs weren''t as bad, since it was often relatively
    easy to later correct a truck''s plan by incorporating a new destination.


    But Jack wanted to translate this to business metrics. As he put it, “I wanted
    to know what more accuracy''s worth, moneywise.” However, for UPS''s complex delivery-planning
    system, this translation wasn''t straightforward. Delivery prediction injected
    insight into UPS''s complex planning system. How much this more sophisticated
    method would improve operations in business terms was something you could only
    roughly approximate beforehand. The pertinent KPIs included annual dollars and
    driving miles saved. They also included the more wonky metric _stops-per-mile_,
    which increases as truck planning becomes more efficient—the more densely a route
    is packed with deliveries, the more value is generated from each mile of driving.


    Jack made rough estimates, but he would only find out the ultimate value of his
    optimization system by tracking its performance during deployment. When we get
    to the topic of deployment in chapter 6, we''ll see the ups and downs his system
    experienced. And we''ll also see EduPay''s deployment results in that chapter
    as well.


    But we have a couple more steps to go before deployment. In the next chapter,
    we prepare the data on which the model will be trained.'
