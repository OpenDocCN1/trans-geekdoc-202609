    therefore inconsequential.


    When you look into a model and see that it’s mostly discovered things that seem
    obvious to you, that’s no cause for disappointment. It means that your human hunches
    have been validated by the data. That validation is more crucial than you may
    realize. After all, what you don’t see in the model are the many other potentially
    “obvious” but false presumptions that the algorithm has quite helpfully ruled
    out. Moreover, the model’s value comes from not only the “obvious” discoveries
    but how it adeptly combines them together—along with some potentially surprising
    discoveries as well. By doing this well, modeling methods exhibit a certain logical
    and mathematical finesse.


    Moreover, when a model seems to align with human intuition, that can help shore
