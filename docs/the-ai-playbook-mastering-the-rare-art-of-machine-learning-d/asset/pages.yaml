  md: 'Data scientist: Just integrate the model into this new, large-scale operational
    process.


    Client: (Balking at the audacity of the data nerd) You want me to do what?


    This conversation frustrates the data scientist. She throws up her arms and storms
    away to spend some alone time crunching data. It’s bewildering, this seeming lack
    of vision and unwillingness to seize opportunity.


    But, if she sold the project and got it greenlit in the first place, the data
    scientist holds much of the responsibility. She’s plowed forward, executing the
    technical part of a project that cannot succeed because it’s incomplete from a
    business standpoint.


    Many senior data scientists have already come to hold this perspective. They transcend
    their technical role and provide invaluable leadership. Take Dean Abbott, an industry-leading
    consultant and the author of Applied Predictive Analytics, who holds us quants
    accountable: “We think, ‘Ugh, they just don’t get it, they don’t understand statistics,
    they don’t understand machine learning.’ It’s true, they don’t. But you probably
    don’t understand business and all the inputs they’re getting, the stressors they
    have, either. So, we have to lower the wall, be humble, ask a lot of questions,
    let them explain things in their language, and then try to translate the language
    so you can be on board with the same ideas.”


    When I pitched gay.com, I hadn’t yet joined the enlightened minority. To help
    the company hold on to more customers, I should have sold them on just that—not
    ML (or predictive analytics, as was the more common term back then). Rather than
    churn modeling itself, I should have reframed my pitch to focus on a new operational
    effort, with a parenthetical mention of the technology that will drive it:


    We will run a new marketing process to retain customers (using ML to target those
    most at risk of canceling).


    Gay.com may not have bought in, but at least I wouldn’t have sold them on a technical
    project fated to require as-yet unrecognized operational efforts before it ever
    realized value.'
