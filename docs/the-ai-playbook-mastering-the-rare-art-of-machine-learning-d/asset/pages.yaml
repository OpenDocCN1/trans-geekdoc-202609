- pgno: 97
  md: '“Will the customer buy if contacted?” leaves too much unspecified. While we
    iron out the details, the Law of ML Planning tells us to keep deployment at the
    top of mind. For this application, the model''s predictions will target marketing.
    They will determine who is and who is not included in a campaign''s contact list.


    The question then is, Who''s worth marketing to? Well, a customer must buy enough
    to be profitable. And we need a realistic time frame—a customer who buys a year
    later doesn''t normally count for campaign ROI, and that kind of lag makes tracking
    difficult. With that in mind, here''s a step in the right direction:


    # Response Modeling Prediction Goal (hypothetical example):


    If sent a brochure, will the customer buy within thirteen business days with a
    purchase value of at least $125 after shipping and not return the product for
    a refund within forty-five days?


    Now we''re in business. We''ve fully defined the prediction task that ML will
    pursue, the requirements specifications for the predictive model. And it''s based
    on the particular business context: the existing practices into which the model''s
    predictions will integrate and the way they''ll take effect. This is the level
    of detail you need to establish before preparing the data and training a model
    with it.


    Prediction goals like this determine what a model will do for each individual.
    The goal poses a question about a single individual—a yes/no question for binary
    models (see the following sidebar). That''s the question the model will attempt
    to answer each time it scores an individual. “Will the customer buy?” refers to
    the one individual that a model is scoring, since it scores only one at a time.


    Before you dive too deeply into defining a prediction goal, there''s a fundamental
    pitfall to consider: Settling on a poor approximation of the true prediction goal.
    Sometimes, the available data is only a proxy for the pertinent target of prediction.
    For example, law enforcement aims to predict future crime to drive sentencing
    and parole decisions, but only rearrest data is available. The ground truth of
    whether a released defendant went on to commit a crime is not directly known—it''s
    only'
