  md: '![](img/99a58a0ea5f8204f7fbf446f6593fd4f_126_0.png)


    This is a typical *profit curve*. The horizontal axis corresponds with how far
    down the ordered list we''ve gone. As you proceed from left to right, you begin
    with those scored most highly by the model. At each position, the profit is calculated
    in the same way we did above in the sidebar on response modeling profit, based
    on how much we''ve spent to contact that many customers and how much we''ve gained
    from those who in turn responded with a purchase.


    Following the upper curve, you can see the campaign''s ups and downs. At the beginning,
    the more customers you contact, the more your profit goes up. Although you spend
    more to move along to the right—to contact more and more customers—you''re getting
    enough positive responses to turn a profit. This is where you''re getting the
    most bang for your marketing buck.


    About one quarter of the way down the list, diminishing returns begin to set in.
    You''ve exhausted the most responsive portion of the list and you actually start
    to lose money—the cumulative profit begins to diminish as you contact more customers
    but you no longer elicit as many positive responses.'
