- pgno: 26
  md: '# I’m a technically trained data professional—why do I need this book?


    This book establishes a sorely needed strategic framework, providing complementary
    business-side know-how that all great data professionals need to master. The real
    “data science unicorn” isn’t the person who knows every analytical technique and
    technology; rather, it’s the one who has expanded their skillset to also participate
    in a company-wide, business-oriented effort that gets their models deployed. After
    all, the soft skills are often the hard ones.


    In so doing, this book does cover certain technical steps generally omitted by
    courses and books meant for data professionals, including how to fully establish
    the dependent variable (called the output variable in this book), how to prepare
    the data, and how to establish the performance metric (including why accuracy
    and a popular technical metric called AUC are usually the wrong choice)—all so
    that these choices align with business objectives and operational considerations.


    On the other hand, know that this broadly accessible book is not the technical
    fare to which you’re likely accustomed. For some experienced data professionals,
    the best use of this book may be to give it a good skim—slowing down to give chapter
    0 on the need for a specialized business-side practice and chapter 3 on evaluation
    metrics a complete read—and then passing it on to your boss or a key colleague.


    # Is this book about artificial intelligence?


    The buzzword AI can mean many things, but this book is about ML, which is a central
    basis for—and what many mean by—AI. This book does not cover other areas that
    are also sometimes referred to as AI, including artificial general intelligence
    (hypothetical systems that would be capable of any intellectual task humans can
    do), natural language processing, rule-based systems, and computer vision.


    # Does this book pertain to generative AI?


    Yes. Generative AI dazzles the world by writing text and producing images—but
    when it comes to improving operational efficiencies,'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'classical ML (a.k.a. _predictive AI_) has long reigned supreme. However, generative
    AI is also well suited and stands to potentially beat out classical ML in some
    arenas. The bizML practice presented by this book also serves generative AI—for
    projects that apply generative AI to measurably improve great numbers of operational
    decisions. For either kind of technology, bizML gets you there, guiding the project
    to a successful deployment.


    # Does this book pertain to deep learning?


    Yes. Although deep learning is more technically complex than many classical ML
    methods and tends to be applied for different classes of problems (more on image
    processing, for example, and less on customer prediction), the ML project discipline
    presented in this book applies and is equally needed. The organizational challenges
    of deployment are largely the same, no matter how the model being deployed operates
    on the inside.


    # Does this book pertain to predictive analytics?


    Yes—_predictive analytics_ is a major subset of ML. It is the application of ML
    methods for certain business problems. Alternatively, in many contexts, _predictive
    analytics_ is simply a synonym for _machine learning_.


    # How does this book compare to your previous book, _Predictive Analytics_?


    This book and my previous book—_Predictive Analytics: The Power to Predict Who
    Will Click, Buy, Lie, or Die_—are complementary, but each stands alone. Neither
    is required reading for the other, so you can read only one or both, in either
    order. Both make ML accessible for business professionals, newcomers, and other
    non-data professionals, but they serve different purposes: _Predictive Analytics_
    is about how ML works, and this book is about how to capitalize on it.'
  merge: -1
  img_proc: true
