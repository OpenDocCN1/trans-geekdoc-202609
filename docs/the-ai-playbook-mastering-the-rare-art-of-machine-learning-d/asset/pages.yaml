- pgno: 179
  md: 'The modeling process automatically creates a tree like this from the training
    data—usually ending up with one much bigger than the example shown above. Then,
    to use it in deployment to predictively score an individual (e.g., an EduPay user),
    you simply start at the top (the root of what is an upside-down tree) and by answering
    yes/no questions, you make your way down to an end point (a leaf) to derive the
    score for that individual. For example, if the answers are yes, no, yes, then
    by going left, right, and then left, you wind up at a leaf with 4.2 percent—the
    model is saying there is a 4.2 percent probability that the individual will respond
    if shown the ad.


    You can think of a decision tree as a bunch of nested if-then-else statements
    (if you’ve done some programming), as a flowchart with no loops, or as a bunch
    of rules—each path from the root down to a leaf makes a rule. For example, for
    the path we just covered, the rule is: If the user has opted into email and has
    not seen the ad before and has an SAT math greater than 480, then the score is
    4.2 percent.


    The way modeling builds a decision tree is to “grow” it from the top down. It
    starts with the most predictive single input variable at the top, thereby dividing
    all individuals into two groups: in the case of the example tree shown, those
    who’ve opted in for emails and those who have not. Then, it further subdivides
    these groups as it builds the tree in a downward direction. This repeats as the
    training data is divided into fairly small groups, although not too small, since
    you can’t generalize well from only a handful of examples. By following this process,
    the tree’s size and shape—and the choice of input variables for its yes/no questions—are
    all determined automatically.


    # More Modeling Methods: Linear and Logistic Regression


    Other modeling methods look completely different and work completely differently.
    Linear regression creates a linear model that simply combines input variables
    with a weighted sum, such as:


    ```

    (0.0008 × SAT-written) + (0.4 × email-opt-in) + (0.16 × in-college)

    ```'
