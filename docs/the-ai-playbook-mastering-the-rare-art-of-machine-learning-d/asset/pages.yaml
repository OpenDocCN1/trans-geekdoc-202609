    in which operational performance drives corporate performance, the greatest potential
    is in supply chain, logistics, and manufacturing.


    > —McKinsey’s “Notes from the AI Frontier”


    Some of ML’s more typical use cases apply across industry verticals, such as those
    in marketing and advertising. Others are industry-specific. Here are some examples:


    | Application and desired business outcome | What''s predicted (model output)
    | What''s done about it (deployment) |

    | :--- | :--- | :--- |

    | Response modeling to increase the marketing response rate | Will the customer
    buy if contacted? | Mail a brochure to those likely to buy. |

    | Targeting ads to increase clicks | Will the user respond to this ad? | Display
    the ad to which the user is most likely to respond. |

    | Churn modeling to decrease customer attrition | Will the customer defect if
    not contacted? | Reach out with a retention offer to those most likely to defect.
    |

    | Credit scoring to decrease defaults | Will the debtor default on their loan?
    | Deny risky applications for credit. |

    | Supply chain management to optimize inventory | How much demand will there be
    for each item? | Maintain stock levels accordingly. |

    | Delivery prediction to plan for more efficient delivery | Will the address receive
    a package delivery? | Plan the delivery truck assignments of predicted packages
    alongside known ones. |'
