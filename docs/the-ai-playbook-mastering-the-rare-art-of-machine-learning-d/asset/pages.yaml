  md: '# Machine Learning Failure Is Usually Human Failure


    > Individual use of technology does not always translate into knowing how to use
    these tools effectively within or as an organization.

    > —Gerald Kane et al., *The Technology Fallacy: How People Are the Real Key to
    Digital Transformation*


    > Statisticians, like artists, have the bad habit of falling in love with their
    models.

    > —Famed statistics professor George Box


    But gay.com didn''t deploy my model. Instead, they complimented it and placed
    it on the back burner. The VP assured me that my proposal was interesting and
    that they would take it into consideration. She thanked me for my consulting engagement,
    which had drawn to a close. No more Twinkies for me—and no value achieved for
    them.


    I quickly shrugged it off. As a new consultant in a field that was just beginning
    to catch fire, I could only afford a moment to feel perplexed and disappointed.
    I''d done my part and it was their loss.


    But today, after two more decades of consulting, the lesson has sunk in. Unfortunately,
    this lesson is still just as relevant and hard-earned today, perhaps in part because
    it''s a paradoxical one:


    **The ML Paradox**: For this advanced technology to succeed, we now need improvements
    in humans—in the way of understanding and leadership—more than in the technology
    itself.


    The ML Paradox is a special case of what James Bessen calls the *Automation Paradox*.
    “When computers start doing the work of people,” he wrote in the *Atlantic*, “the
    need for people often increases.”


    It takes a holistic view—one that integrates business- and technology-side perspectives—to
    sell, educate on, socialize, and lead ML projects. Lacking this, organizations
    often fail to bridge the business/tech “culture gap.” On the one hand, data scientists,
    who perform the model development step, compromise the value of their work by
    fixating'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'solely on data science. As a rule, they prefer to be left to their highly technical
    area of expertise, not bothered with “mundane” managerial activities. There’s
    a tendency for the data scientist to take the deployment of their model for granted.
    Its value is self-evident—how could it not be put to real use? With that mindset,
    they enthusiastically jump past a rigorous business process and straight into
    the modeling. In most cases, the resulting model only collects dust.


    On the other hand, many business professionals—especially those already inclined
    to forgo the particulars as “too technical”—have been seduced into seeing this
    stunning technology as a panacea that solves problems on its own. To them, there’s
    no need to get into the details, since the tech is intrinsically valuable and
    the details belong only within the purview of data scientists. Ultimately, when
    faced with the operational change that a deployed model would incur, it’s a tough
    sell. Taken off-guard, the stakeholder hesitates before altering the very way
    in which the company maintains its profitability.


    With no one taking proactive ownership, the hose and the faucet fail to connect.
    The irony is undeniable: All parties tend to focus more on the technology itself
    than how it should deploy. This is like being more excited about the development
    of a rocket than its launch.


    # Many Models Never Deploy: An Industry-Wide Problem


