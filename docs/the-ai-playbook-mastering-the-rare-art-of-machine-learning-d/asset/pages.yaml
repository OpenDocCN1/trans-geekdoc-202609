- pgno: 68
  md: 'With ML, we’re right at that precipice, ready to tumble down to the “Trough
    of Disillusionment.” Gartner suggests that ML has already slid partway down toward
    the trough, but I would argue that it still rests at the peak. Industry excitement
    about ML does not yet appear to have been affected by its struggling deployment
