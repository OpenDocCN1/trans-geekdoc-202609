- pgno: 189
  md: '# It''s the Data, Stupid!


    > We don''t have better algorithms than anyone else. We just have more data.

    > —Peter Norvig, director of research, Google


    > The summation of my decade of data work is that the data matters more than the
    model. Every time.

    > —Caitlin Hudon, principal data scientist, OnlineMedEd


    Fine-tuning an algorithm and trying new ones for comparison will only get you
    so far. As you put in more and more effort, the returns tend to diminish. You
    might make small, incremental improvements by stepping up to a more complex model
    like a big, hairy ensemble or even deep learning—but it''s often not worth the
    complexity. Sometimes, you tweak the heck out of your modeling efforts for only
    a small gain. On other occasions, for certain projects where every little improvement
    makes a big difference, it could be worthwhile to go the extra mile. Even so,
    that extra effort may provide only a small gain and may pay off only for a few
    brief months before changes in the business require a full project restart.


    Either way, the mandate is clear: Improve your data. That''s where your efforts
    will usually pay off much more handsomely. This means both more data and better
    data. Google research director and famed Artificial Intelligence textbook coauthor
    Peter Norvig espouses getting more data, but that''s not all. “More data beats
    clever algorithms, but better data beats more data,” he says.


    Bettering data quality rather than its quantity is harder to formally define,
    yet it''s just as intuitive. Just think about what might make data more predictive.
    In the previous chapter, we discussed how to design more revealing, informative
    inputs through a feature engineering process. For example, FICO developed a summary
    of cardholder propensities and changes in spending behavior. As another example,
    a telecom expanded its churn model inputs by merging in summaries of how a'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'user tends to use the website. Cellphone subscribers who’d checked out their
    remaining contractual obligation were more likely to cancel. Beyond adding new,
    informative inputs, one can always exert more effort in data quality assurance,
    seeking out where there might be errors.


    But this takes discipline. Only the most regimented ML leaders focus on this “predictive
    fuel” more than on the sexy “prediction engine.” As Google ML software engineer
    Josh Cogan puts it, “I find most people really tend to focus just on optimizing
    the ML algorithm. They want to make sure they have the newest, coolest thing right
    out of the papers. . . . I’ve never found anyone who overestimated how hard it
    was going to be to get that data collection right in the first place.”


    Also at Google, a group of six researchers put it on the line with a plea for
    sanity: “Data quality carries an elevated significance in high-stakes AI due to
    its heightened downstream impact, impacting predictions like cancer detection,
    wildlife poaching, and loan allocations,” they wrote in a research paper. “Paradoxically,
    data is the most undervalued and de-glamorized aspect of AI.” They titled their
    paper so that nobody could miss the point: “Everyone Wants to Do the Model Work,
    Not the Data Work.”


    To emphasize data’s importance, data science has borrowed a clarion call from
    political science. “It’s the economy, stupid!” proclaimed political strategist
    James Carville to campaign staffers working in 1992 to elect Bill Clinton. By
    adopting that as a campaign slogan, they won the presidency. In more recent years,
    ML has revised that legendary catchphrase to be its own mantra: “It’s the data,
    stupid!”


    And yet data isn’t the only game in town. More complex models do have their place
    for certain projects.


    # How Deep Is Your Learning?


    The latest, greatest wave in modeling methods, deep learning, produces models
    that involve more complexity than ever before. And it often pays off. Deep learning
    is an advanced form of neural networks, which represent complex mathematical formulas
    as networks organized into layers.'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'Deep learning has improved the state of the art in modeling so that it can
    truly take advantage of a large, complex model. It’s always been the case that
    you could set up a neural network with many, many inputs— it’s just that it never
    used to work well. For example, if you want the model to detect whether a 1280
    × 720-pixel resolution image includes a traffic light, you could directly feed
    it all 921,600 pixels. That’s a hugely greater number of inputs than the typical
    few hundred provided when, say, predicting customer churn. The problem is, for
    the model to handle each detailed image in a useful way, it must be possible to
    train it for adept, complex processing. Not only must the model be complex, but
    the training must be capable of leveraging that complexity. The original algorithms
    a few decades back always flopped when this was attempted.


    Because of this, neural networks, which originated in the 1980s, started small.
    Back in 1997, the first time I taught the graduate ML course at Columbia University,
    neural networks were shallow rather than deep, and yet, for many domains, they
    were nonetheless the leading option. They were already steering self-driving cars,
    in limited contexts—but the input was only a very low-resolution view of the road
    ahead, an image of 30 × 32 pixels. I even had my students apply neural nets for
    face recognition as a homework assignment, using the same low resolution.


    Increasing the layers of a neural network—so that it is literally deeper—increases
    the complexity of the mathematical formula that it embodies. But, for decades,
    the modeling process (backpropagation) was incapable of scaling up to take advantage
    of that complexity. Since they couldn’t make use of the additional layers, neural
    networks couldn’t effectively handle a large number of inputs.


    As data exploded, so did advanced modeling. After the turn of the century, amazingly,
    modeling methods improved to meet the challenge—and realize the potential—of properly
    training deep neural networks. This was possible due to bigger data and faster
    compute, as well as some new improvements to the modeling algorithm itself.


    Deep learning blossomed, both in buzz and in proven value. It is the one and only
    technology that achieves and defines the state of the art for speech recognition
    and for various image-processing applications,'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'including diagnosis on medical images, autonomous vehicles recognizing and
    classifying objects around them, and everyday operations like unlocking your phone
    with facial recognition.


    Google, for example, has made significant improvements to most of its main products
    with deep learning, including Android, Apps, Maps, Speech, Search, and YouTube.
    Gmail now intercepts 99.9 percent of spam. And your unlabeled Google Photos are
    searchable by ad hoc terms such as “hug.” Google Translate—which anyone can use
    online—swapped out the original underlying solution for a much-improved one driven
    by deep learning. Go try it out—translate a letter to your friend who has a different
    first language than you. I use it a lot myself.


    The exploding field generative AI is built on deep learning. This includes large
    language models, which write prose that is impressively coherent for a computer;
    digital image generators, which take a written prompt and create an image for
    you; and deep fakes, depictions of people who do not exist or of existing people
    doing things they’ve never done. Generative AI also produces synthetic music,
    speech, and video.


    To keep up, we launched the Deep Learning World conference in 2018 as part of
    the Machine Learning Week conference series that I founded in 2009. They take
    place annually on two continents.


    As much as I can’t help but geek out like mad over deep learning, here’s the thing:
    This all-powerful Hulk isn’t the right superhero to enlist every time. When you
    need someone to crawl into a mousehole, Ant-Man would be a better choice.


    # For Many Business Problems, Deep Learning Is Overkill


    Deep learning tends to solve different types of problems, in comparison to so-called
    classical ML algorithms. For one thing, it’s more often used for detection rather
    than the prediction of the future. Since it takes so many inputs, a deep learning
    model can directly handle an entire unprocessed file, such as a photograph, medical
    image, or an audio file for speech recognition. This lends itself to detecting
    whether each contains a certain element or belongs to a certain category.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'This tends to pigeonhole deep learning into certain industries, those where
    you need to do detection on raw image and sound files, such as for autonomous
    vehicles, medical image processing, and devices that need to recognize speech.
    That''s a somewhat distinct arena from the kinds of customer-prediction applications
    that this book largely focuses on, such as for targeting ads and marketing, managing
    financial risk, averting fraud, and predicting which locations will receive a
    package delivery.


    Deep learning applications also tend to allow for high accuracy—in the casual
    sense of the word: *the ability to classify correctly a great majority of the
    time for both positive and negative cases.* Just as humans can usually tell which
    photographs do or do not include a traffic light and which sound bites do or do
    not include the word “hello,” so too can deep learning.


    In contrast, customer prediction, typically the domain of classical ML methods,
    means predicting what people will do. For those applications, you can only hope
    to gain some meaningful lift in comparison to guessing, unless you have a magic
    crystal ball. Not even deep learning can confidently predict human behavior in
    general. No matter how sophisticated and advanced the model and the modeling algorithm,
    it doesn’t change the fact that we’re trying to predict the unpredictable: people.


    Given that there’s an intrinsic upper limit in predictive performance, deep learning
    is usually overkill for many of the more classical, standard business applications
    of ML. For those problems, deep learning’s awesome capabilities are often wasted,
    and working with a classical ML method would do virtually as well, requiring less
    complexity, time, computational resources, and advanced expertise. Moreover, simpler
    methods maintain transparency, so it’s possible to more easily understand the
    model itself, to see what’s been learned and on what basis predictions and decisions
    are being made by the model.


    On the other hand, there are exceptions where deep learning has provided value
    for traditional business applications. For example, FICO’s Falcon fraud detection
    system is based in part on deep neural'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'networks. The research and advisory firm Celent has estimated that, if more
    widely deployed, deep learning could reduce fraud losses by $161 billion worldwide,
    across all kinds of financial fraud.


    > “Deep learning largely dominates today’s media buzz about machine learning,”
    points out industry leader Dean Abbott. “It sucks the oxygen out of the room.”


    Still, deep learning constitutes only a subset of the field as a whole. Like all
    modeling methods, it belongs within one corner of the taxonomy of techniques.


    Despite its unique nature, deep learning doesn’t impose much change on the project’s
    business-side execution. Successful deployment requires the same six-step bizML
    practice. You’re still altering operations with predictive probabilities by integrating
    them into existing systems. You still need to ramp up decision makers and line
    of business managers. You still need to surmount the universal challenges of data
    preparation. And the organization still needs to understand and agree on quantitative
    measures of predictive performance and business performance. It’s a different
    animal, but the animal trainer’s skillset translates nicely.


    # Machine Learning Software: How to Choose a Tool


    So many powerful ML algorithms, so little time. To make use of these algorithms,
    you need software that implements them. The good news is there are many competing
    solutions out there. For more than two decades, I’ve noticed new ones come across
    my radar every two or three months. But this exploding plethora of options is
    enough to give you analysis paralysis, with an incapacitating fear of buyer’s
    remorse. How to proceed? Here are some tips and pointers.


    Don’t program ML software from scratch. Buy rather than build, download rather
    than develop. ML projects almost always leverage existing analytics software.
    All the standard predictive modeling methods are each implemented within many
    software tools that you have at your disposal. Even the latest, cutting-edge techniques
    straight out of the research lab have often been released as open source code
    by the researchers'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'themselves. For industry ML projects, circumstances only very rarely warrant
    programming the algorithm from scratch.


    **Software selection doesn’t guide the project—project requirements and team skills
    come first.** Do not hold any illusions that an analytics software tool can be
    a “plug-and-play” solution to the business problem you’re solving. The goal of
    an ML project is a new way of business, an improvement to operations, for which
    ML software plays a central but limited part. Some ML vendors may offer an aggressive
    sales pitch that you will need to resist. Instead, allow your data scientists
    to determine software requirements as the project matures and evolves. If your
    data scientists have a strong preference or are already well versed with one tool
    in particular, their work may be most effective using that tool.


    **Postpone the decision.** If no preordained tool is in place, don’t ordain one
    until absolutely necessary. After you’ve greenlit a project and proceeded through
    the first four steps—through data preparation—then you will have pertinent data
    on which to evaluate modeling software. Many vendors will provide a free evaluation
    license, so you can give it a go on your data, possibly comparing multiple tools.
    Moreover, other determining factors will also have become clear during later phases
    of the project, including your budget to buy software, how its models must integrate
    with your existing systems and data pipelines, and whether deployment is to be
    cloud-based or on-premises.


    **Use what you’ve got.** If your organization has already adopted a solution,
    take a good hard look at that product as your first consideration. Often, a team
    will end up adopting a combination of paid and free, open-source tools, many of
    which play well together.


    # Generating Numerous Models for Ad Targeting


    Let’s return to the challenge I faced for EduPay. I had to generate 291 deployment-ready
    models, somehow streamlining and scaling the quality-assurance process by eliminating
    the need to spend a lot of time poking around and inspecting each model.


    A couple of months into the project, I had an “aha!” moment. I ran a few experiments
    and then emailed my client to propose a solution:'
