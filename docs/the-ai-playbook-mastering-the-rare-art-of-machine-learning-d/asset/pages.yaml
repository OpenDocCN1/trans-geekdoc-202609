    To obtain this data, Scott’s got to align the stars.


    # The Lifeblood of Optimization


    Most people think data is boring. The word “data” is a deal-killer at cocktail
    parties. I know this from personal experience . . . I have the data.


    But data isn’t just an arcane bunch of 1s and 0s. It’s a recording of history,
    a list of prior events. It encodes the collective experience of an organization
    from which it is possible to learn, analytically, how to predict.


    Preparing the data represents both the most meaningful and the most mundane sides
    of an ML project. Although it isn’t the “rocket science” part, it’s how you construct
    predictive potential. It’s the most time-consuming technical step, a discipline
    unto itself often requiring a specialist known as a data engineer. Data prep is
    typically estimated to demand around 80 percent of an ML project’s technical efforts
    and generally takes longer than expected. It is habitually underestimated.


    But it’s worth it! The resulting training data is the fuel that powers ML. So
    even business leaders must become conceptually familiar with its consequential—and
    simple—format.


    Data prep as a topic is strikingly neglected and generally untaught. Its omission
    is an understandable but costly mistake that afflicts ML as a field: Newcomers
    flock to the excitement of hands-on model-training with little thought as to how
    the data—and its requirements—were conjured in the first place.


    Perhaps more surprisingly, educators and other leaders encourage rather than correct
    this misguided path. Most technical ML books and courses take data prep for granted—they
    skip right past it. On day one, your first step is to load the data into the ML
    software. The presumption is that the data is all set and good to go. But this
    presumption is false.'
