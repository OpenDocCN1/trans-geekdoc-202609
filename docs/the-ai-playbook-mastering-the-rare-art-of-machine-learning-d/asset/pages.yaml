- pgno: 70
  md: 'ML software product, but by implementing a paradigm. For the business project,
    ML software plays a vital role, but it''s only a supporting one.


    With some kinds of technology, the product alone delivers value. Faster computing
    hardware, larger storage solutions, and streamlined database software provide
    value in and of themselves. But ML software is different: To improve business
    operations, it must be used as only one part of a broader organizational process.


    After all, no software product alone could solve the kind of monumental problems
    that ML projects solve: operational inefficiencies. An ML project is a consulting
    gig, not a technology install. Those running the project are delivering services
    more than software.


    Accordingly, vendors don''t lead the ML industry—users do. In this way, the ML
    industry differs from the cellphone industry, the laptop industry, or even many
    forms of enterprise software, where companies compete for a pole position that
    defines the market by way of the products they sell. Instead, the ML industry
    is a movement led by the innovators within the companies that use ML. It''s more
    like the restaurant industry, where stove manufacturers are critical but restaurateurs
    and chefs lead the industry.


    The myth of a do-it-all citizen data scientist is spread in part by certain ML
    vendors. They do so when they sell the false narrative that their ML software
    product itself solves an enterprise problem. Au contraire—untrained users can''t,
    unassisted, develop predictive models for new ML initiatives. ML software requires
    data science expertise to use and thereby create value. And capturing that value
    takes more than only using the product—it requires a holistic, collaborative enterprise
    practice. Inexperienced enterprises turn to ML vendors for guidance, but vendors
    lack an incentive to elucidate on the full context within which their product
    must be used. They often exploit that inexperience, selling a product to a customer
    who hasn''t realized what it will take to capture value with it.


    Now, if you were hoping to be wowed by technology that just “plugs in” and generates
    value, it’s time to manage expectations. That’s silver-bullet thinking. From that
    vantage, there’s bad news:'
