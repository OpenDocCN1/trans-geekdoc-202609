- pgno: 128
  md: '# Deploying Aggressively or Defensively—Your Cutoff Makes the Difference


    I''m going to blow your mind: The profit curve is only a projection. You can draw
    it before conducting the marketing campaign. Rather than tracking how marketing
    went, it estimates beforehand how it would go.


    That''s what data''s for. It serves not only to train the model but to evaluate
    it and to plan its deployment. We''ll dive into data in the next bizML step—"prepare
    the data"—but for now know this: Before deployment, models are provisionally tested
    on the same kind of historical data used to develop them.


    Before deployment, you can draw this kind of projected curve just the same for
    most any ML project. To help decide how many individuals to target, you view the
    spectrum of options corresponding with how the model has ranked individuals. As
    you move along the spectrum, deciding how many to contact, approve for a loan,
    or audit for fraud, you often see the same pattern: an upward ride followed by
    a decline. There''s a sweet spot, a Goldilocks zone, that''s often the best place
    to stop. By establishing a threshold—a.k.a. a cutoff point—at that position, the
    model will then serve to be selective, targeting for treatment those who scored
    above the threshold.


    In this way, one model provides a whole range of options. When you draw the line,
    you''re establishing which option to go with in deployment—you''re deciding precisely
    how to use the model.


    For example, a response model could be applied either to increase revenue or to
    decrease costs. After all, increased efficiency can pay off in either way. To
    cut costs while maintaining current sales, target a smaller number of more highly
    ranked prospects. In comparison to mass marketing without a model, this could
    land the same sales even while spending less on the campaign. Or, to increase
    sales without increasing costs, spend the current marketing budget more wisely
    by targeting with the response model. In this way, you''re contacting a more responsive
    pool. The difference between these two options comes down to where you draw the
    line, that is, how far you proceed down the list of ranked customers.'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'Similarly, fraud detection provides the same kind of trade-off options. For
    example, Citizens Bank developed a checking fraud model that could be used to
    either prevent 20 percent more loss or decrease their fraud prevention staff by
    30 percent. On one hand, a set team of human auditors would capture more fraud
    if they spent their time on a more targeted pool of transactions that includes
    more fraud. This way, their time would be better spent. On the other hand, the
    model could maintain the current level of fraud detection with a smaller team
    of auditors. With a smaller team auditing a smaller group of transactions—but
    one even more densely filled with fraud—they''ll catch the same amount of fraud
    as a larger team with no model. Once again, the choice between these options is
    enacted by where you set the threshold and draw the line.


    You can think of these pairs of options as presenting a choice between a more
    aggressive or a more defensive deployment. The decision is a strategic one. Although
    there''s some intense debate around which is best, there''s no one-size-fits-all
    choice. If the economy is dipping or your company is having a tough quarter, you
    can expect a focus on cutting costs. And some ML applications are usually advertised
    more on the “defensive” side as cost-reducers, such as predictive maintenance
    and supply chain optimization. Other applications are more often sold as a means
    to increase revenue, such as price optimization and product recommendations. But,
    for any use case, there''s always a range of options for model deployment.


    In these examples, the bottom-line profit generated by a model has guided how
    to plan its deployment. We wouldn''t use lift alone to decide where to draw these
    lines. So, why do we need a raw measure of predictive performance such as lift
    when a business metric always takes the lead?


    # Business Metrics versus Model Metrics


    Business metrics such as profit or ROI drive ML projects. They define the business
    objective, inform the deployment plan, and measure project success.'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'In contrast, many business managers find reports of a model’s pure predictive
    capability abstract and arcane. It feels irrelevant to them. Performance metrics
    like lift or the pairing test tell you the technical capability of a model and
    give you a reading of its analytical success—for example, lift tells you how much
    better it does than guessing—but they don’t directly tell you the business value
    model deployment will deliver.


    So why not work only with a directly relevant business metric like profit and
    drop technical metrics like lift entirely?


    Measuring a model’s predictive power may be abstract, but that’s also an advantage.
    Model performance metrics apply universally, telling you how well your model predicts
    no matter the application area or industry. Given ML’s wide applicability, such
    metrics establish a language that all data scientists—and their tools—can always
    speak, across projects, across industries. And they serve to validate and debug
    a raw model before involving the complexities of its intended business context.
    Let’s put a name on this concept:


    **Predictive performance metric:** A measure of a model’s pure predictive performance,
    such as lift, accuracy, or the pairing test. Such a metric serves to evaluate
    a model’s *technical* performance but does not directly assess the business value
    of a model. Therefore, when possible, this raw metric is translated into a business
    metric.


    Among the many performance metrics commonly in use, this chapter focuses on lift
    because it’s a good place to start for many projects. As a “predictive multiplier,”
    it’s intuitive and, for many projects, translates to profit with straightforward
    arithmetic, as we’ve seen.


    Beyond lift and the pairing test, predictive performance metrics also include
    *f-measure*, *precision*, *recall*, and *sum of squares*. I won’t take space in
    this book to cover them, but know that they each follow the same trend: They’re
    relatively arcane to the business leader and yet each has their time and place
    for the data scientist.


    Despite the guidance that model performance metrics provide to the technical model
    development process, at the end of the day, business metrics rule. They have the
    final word. And they appear first within a'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'project summary. For UPS''s delivery-prediction project, I didn''t make you
    wait until chapter 6 on deployment to learn of the business-metric gains. I gave
    it to you up front in this book''s introduction: $35 million and 18.5 million
    driving miles saved per year.


    Which brings me to the next point: Profit isn''t the only business metric. Savings,
    revenue, return on investment, marketing response rate, and debtor default rate
    are just a few others. How do you choose?


    # Business Metrics: Key Performance Indicators


    The most important metric for your model''s performance is the business metric
    that it is supposed to influence.


    > —Wafiq Syed, Data Product Manager, Walmart


    When it comes to business metrics, we don''t have to reinvent the wheel. Let''s
    go “old school.” Your ML project''s business objective is to optimize something
    and that something is a KPI:


    Key performance indicator (KPI): A measure of operational business performance
    that is key to a business''s strategy. An ML project''s business value is expressed
    as a KPI improvement. Aka business metric.


    The word KPI may burn your ears with the sound of twentieth-century jargon. It''s
    often associated with the older domain of business intelligence. After all, KPIs
    are simple, both conceptually and mathematically. They''re usually just about
    counting something.


    But KPIs matter the most because they report on the most fundamental notions of
    success at an organization. A KPI measures the degree to which a strategic objective
    has been achieved. As such, business leaders will feel more familiar and comfortable
    with a KPI than a predictive performance metric. And they''ll be more excited
    about it.


    The KPI will drive the ML project, so select one that:


    +   1. aligns with strategic objectives;

    +   2. compels stakeholders in order to achieve buy-in for the ML project; and

    +   3. is measurable, in order to track ML success.'
