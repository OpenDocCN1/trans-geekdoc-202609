  md: 'do you care about the ultimate scientific explanation for the patterns it has
    discovered? Why should your company''s decision makers require such explanations
    in order to trust a model that sheer numbers have already shown is reliable, especially
    when the attempted explanations are only conjecture?


    In principle, decision makers shouldn''t, but in practice, they often do. You
    certainly can''t blame people for taking a look and speculating on the logic behind
    a model''s machinations. Decision makers are often loath to greenlight a model
    without a look-see. Otherwise, the model is a mysterious black box that many feel
    is hard to trust.


    I can''t resolve this religious debate and I''d be a fool to try. But even if
    you''re dead set against deriving dubious explanations, there are other, definitive
    reasons to inspect each model. One is to check for bugs, which I turn to now.
    Another is to screen for ethical issues in how the model drives decisions, which
    I address in this book''s conclusion.


    # Inspecting Models to Check for Bugs


    With the EduPay project, I was grappling with a tough predicament: how to generate
    291 models and then personally inspect each one, thoroughly.


    For a typical ML project, you have to sanity-check each model. After all, there
    are many things that could go wrong, many potential gotchas and bugs in the data.
    I once had a model suggest that high-school drop-outs were better hires. This
    prompted me to take another hard look at the data and how it had been obtained.
    There turned out to be a systematic problem in how humans had manually entered
    the data from the job-applicant resumes.


    In another cautionary tale, researchers from the University of Washington generated
    a model that distinguished wolves from huskies within images. It showed great
    performance, but when they investigated how it was making decisions, they found
    it was actually operating based on whether there was snow in the background—the
    wolf images were more likely to have snow than the husky images. This'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'was a problem in the data, but it became apparent only when they inspected
    the model.


    These things happen. In general, the data scientist must do some ad hoc poking
    around, performing a kind of model-integrity checkup. Before concerning yourself
    too much with any one model, the first question is whether the modeling method
    is fundamentally working, that is, whether the resulting model combines input
    variables in an effective way. Does the model mostly rely on only one input variable,
    failing to integrate other inputs as well? And if there is one overly dominant
    input, is its performance too good to be true—potentially revealing the kind of
    “time leak from the future” I discussed in the previous chapter?


    At the same time, you look at the model''s predictive performance, such as its
    lift. Does it pan out over held-aside test data, in comparison to how well it
    performs on the training data used to generate it? If not, this kind of underperformance
    is known as overfitting. It means the modeling process is memorizing particularities
    that are unique to the training data rather than truly learning—that is, finding
    insights that hold in general. If you’re overfitting, you’ve got to troubleshoot
    how you’ve set up the modeling process or even just move on to another method.


    On the EduPay data, a handful of models appeared to be passing muster. But unless
    I cloned myself or EduPay dramatically increased the project’s budget, how could
    I scale this process to 291 models?


    Before we get to my plan of attack for this project, let’s take a step back and
    look at how modeling works in general and the wide range of modeling methods from
    which the data scientist may choose.


    # Learning from Data: The Ultimate Technology Challenge


    After the first four project steps, we''ve completed the prep work and set the
    stage for the machine learning part of a machine learning project, the core technology
    itself: step 5, train the model, a.k.a. predictive modeling. The business case
    has been agreed on and the training data'
