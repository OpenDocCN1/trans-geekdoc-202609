    Before I outline that practice, let''s look at why so many ML projects struggle
    to deploy.


    # They Can''t Deploy . . . or Just Won''t?


    The ML industry has nailed the development of potentially valuable models, but
    not their deployment. A report prepared by the AI Journal based on surveys by
    Sapio Research showed that the top pain point for data teams is “Delivering business
    impact now through AI.” Ninety-six percent of those surveyed checked that box.
    That challenge beat out a long list of broader data issues outside the scope of
    AI per se, including data security, regulatory compliance, and various technical
    and infrastructure challenges. But when presented with a model, business leaders
