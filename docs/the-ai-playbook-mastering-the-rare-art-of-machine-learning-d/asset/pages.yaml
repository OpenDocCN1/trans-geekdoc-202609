- pgno: 65
  md: '# BizML: A Core Requirement That Had Gone Unnamed


    Following all six of the steps of the bizML practice is uncommon, but hardly unheard
    of. Many ML projects succeed wildly, even if they''re in the minority. While a
    well-known, established framework has been a long time coming, the ideas at the
    heart of the bizML framework are not new to many experienced data scientists.


    And yet the folks who need it the most—business leaders and other business stakeholders—are
    least likely to be familiar with it. In fact, the business world in general has
    yet to become aware of even the need for a specialized business practice in the
    first place. This is understandable, since the common narrative leads them astray.
    AI is often oversold as an impenetrable yet exciting cure-all. Meanwhile, many
    data scientists far prefer to crunch numbers than to take pains to elucidate.
    All along, there''s been no popular business book and no commonplace business
    school curriculum that teaches a detailed playbook for ML projects.


    Most unhelpfully of all, there''s not even been a name for it. No widely recognized
    lingo to spread the word and create a trend. Instead, the ML buzzwords that have
    so far gained traction pertain to technical methods, not to the business-side
    discipline. For one, the trending field MLOps—which deals with ML operationalization,
    another term for deployment—solves technical hurdles, not organizational ones.
    MLOps refers to an important collection of engineering “tricks of the trade” for
    managing and maintaining models. This should not be confused with a practice for
    managing humans. Although both relate to the operationalization of models, MLOps
    addresses the technical execution of ML projects and bizML addresses the organizational
    execution. A project following bizML may well employ MLOps as an invaluable approach
    to make sure that the company can deploy a model technically, but MLOps doesn’t
    holistically address whether its leaders will deploy it. No technical solution
    alone can address the business-side challenges faced by ML projects. Instead,
    an effective business practice like bizML must be the dog that wags the MLOps
    tail.'
