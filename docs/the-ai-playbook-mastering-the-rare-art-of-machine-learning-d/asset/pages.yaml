- pgno: 142
  md: '# 4 Fuel


    # Prepare the Data


    Data trumps the algorithm. Machine learning algorithms may be the fun, sexy part—everyone
    wants to crash that party—but improving the data is where you usually get the
    greatest payoff. Data is the source of predictive power. It encodes the prior
    happenings of the world, the experience from which ML will learn. ML software
    is only as good as the data you give it.


    To make use of the data you have, you’ve got to expertly reconfigure it into training
    data, which takes a simple form: Whatever you want to predict, you need a bunch
    of both positive and negative learning examples. But despite this simplicity,
    training data is no easier to prepare than Michelin-starred cuisine. Whatever
    form your existing data has come to take, it probably wasn’t accrued with ML in
    mind. As a result, preparing the training data usually represents the ML project’s
    greatest technical bottleneck.


    So why is data prep so commonly underestimated, underplayed, and undervalued?
    How do business-side priorities drive data requirements? How much data do you
    need? And how do you know which learning examples are positive and which are negative—where
    do you get those labels? Finally, what kind of noise in the data kills ML and
    what kind is copacetic?


    # The BizML Practice:


    +   1. Value: Establish the deployment goal.

    +   2. Target: Establish the prediction goal.

    +   3. Performance: Establish the evaluation metrics.

    +   4. Fuel: Prepare the data.

    +   5. Algorithm: Train the model.

    +   6. Launch: Deploy the model.'
  merge: -1
  img_proc: true
