    But changing the mind of a customer who’d otherwise defect is expensive, usually
    achieved by offering them a tempting discount. A company can’t afford to offer
    a discount to its entire customer base.


    Prediction is the only recourse. A company focuses its outreach, offering a retention
    discount only to the customers most likely to cancel. This common use of ML, called
    churn modeling, pays off for many organizations. It’s popular, for example, with
    cell phone carriers. Telenor, the world’s seventh-largest—with over 150 million
