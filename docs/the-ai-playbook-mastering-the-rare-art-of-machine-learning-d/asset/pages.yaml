  img_proc: true
- pgno: 170
  md: '# 5 Algorithm


    # Train the Model


    Machine learning algorithms constitute the single most powerful generally applicable
    technology. They''re also the coolest. By learning from data, they derive models
    that work—the models are capable of making predictions for new, unique cases.
    When training a model, the computer is essentially programming itself.


    If you''ve excitedly jumped right to this chapter, then you''re in good company—and
    yet you''re exactly the person for whom I wrote the chapters that come before
    this one. You need to pay your business-side dues before you get to revel in this
    sexy rocket science. We all must fight our natural propensity to exalt the advanced
    tech in lieu of sufficiently obsessing over its launch—and in lieu of executing
    the preceding four project steps needed to make that launch possible. But if you''ve
    read all the pages before this one, you''ve earned the right to revel—enjoy!


    This chapter delivers an accessible crash course for newcomers and business professionals
    to ramp up on ML algorithms. After all, these core methods have great ramifications:
    They will drive your large-scale operations. We''ll keep it relevant by diving
    into the nifty principles of internal combustion, not how to change a spark plug.


    # The BizML Practice:


    +   1. Value: Establish the deployment goal.

    +   2. Target: Establish the prediction goal.

    +   3. Performance: Establish the evaluation metrics.

    +   4. Fuel: Prepare the data.

    +   5. Algorithm: Train the model.

    +   6. Launch: Deploy the model.'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'For the EduPay project, I was as happy as a pig in mud. I had 50 million rows
    of data, a viable business case for machine learning—ad selection—and a client
    willing to deploy.


    But I also had my work cut out for me: I needed to generate models that would
    dynamically select between 291 ads in real time for one third of all college-bound
    high school seniors. That meant I needed to generate 291 models, one for each
    ad. With most ML projects, you only generate one model. Where to begin?


    So much data, so little time.


    As we’ve discussed, each model was to predict user response to its corresponding
    ad:


    # **Prediction Goal for Targeting Ads (EduPay): Will the user respond to this
    ad if it is displayed?**


    I started by developing models for only a couple of ads. One had a lift of 3 at
    10 percent. That means that the 10 percent of users predicted most likely to respond
    were three times more likely to do so than the average user. Those users might
    be the right ones to show this ad to rather than, say, the most universally popular
    ad.


    The advertisement at hand recruited for the navy. It splashed the slogan “Accelerate
    your life” across a blue graphic and then asked, “<username>, are you ready to
    leave <city> and see the world? The Navy can show you how!” It presented two options,
    “Yes, please contact me!” and “No, thank you,” followed by a “submit” button.
    The user had to choose one to get past this “interstitial” page and continue using
    the EduPay website to explore grants and scholarships for college. For each user
    who selected yes, the navy paid EduPay $12.50.


    Let’s dig into this model as an example.


    # Peering into a Model


    When a newborn model emerges, it absorbs all your attention. Like counting a baby’s
    fingers and toes, you examine it thoroughly, poking around to see how well it
    works and why—what makes it tick.'
  merge: -1
  img_proc: true
