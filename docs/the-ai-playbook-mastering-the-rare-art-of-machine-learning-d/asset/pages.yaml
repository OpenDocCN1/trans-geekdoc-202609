- pgno: 127
  md: 'The overall marketing campaign is a bust if you actually contact the entire
    list. If you contact 100 percent of the customers, making your way to the far
    right of the graph, you end up with a loss of about $550,000.


    For the example profit curve shown, if you have no model at all, you only lose.
    To visualize that situation, the straight, lower line shows what would happen
    without a model and therefore without any means to order the list. By following
    an effectively random order, you would lose money at a constant rate as you make
    your way through the list, so the lower line just keeps making a “beeline” down
    to the final end result. That line serves as a baseline for comparison. In contrast,
    the rise and eventual fall of the upper profit line is a testimony to how much
    value a model can deliver.


    Either way, at the far right, you end up at the same place, losing about $550,000.
    This is because, if you’re marketing to everyone, the order in which you do so
    doesn’t matter—you always end up with the same overall loss, a negative profit.
    If you intend on just contacting everyone, you aren’t targeting so there’s no
    purpose to having a predictive model.


    Turning back to the upper profit curve, you’re probably feeling the urge to slam
    on the brakes, perhaps around the 25 percent mark. If you stopped there, your
    profit would be $350,000. That’s often the best choice—but it’s not an absolute.
    Sometimes, the marketing benefit of contacting more people takes a higher strategic
    priority, even if doing so isn’t reflected in immediate-term profits. In that
    case, you may argue that stopping around 72 percent where you break even would
    be a much better choice than spending more than half a million dollars to contact
    everyone. That way, you basically get to market to almost three quarters of the
    list for free. Ultimately, the choice depends on the longer-term marketing strategy
    and other pragmatic factors at your organization. In any case, a profit curve
    like this one helps guide that choice.


    The rise and fall of this marketing campaign seems to tell a tragic story. If
    only you knew the full story before playing it out, you could end the story earlier,
    quitting while you’re still ahead—at the high point—instead of learning the hard
    way by winding up at the graph’s deadly lower-right point. Is there a way to tell
    the story before living it?'
