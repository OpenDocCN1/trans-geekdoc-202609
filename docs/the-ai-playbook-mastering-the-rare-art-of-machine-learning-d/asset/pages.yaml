  md: 'Earlier in this book, we depicted a model as a black box—more precisely, a
    golden egg:


    ![](img/99a58a0ea5f8204f7fbf446f6593fd4f_181_0.png)


    Scoring: A model generates a prediction for an individual.


    Inside that egg, if it''s a decision tree, then it''s applying rules to derive
    the score. If it''s a linear model, it''s applying arithmetic. But whatever it''s
    doing on the inside, the model is always used in the same basic way: The organization
    retrieves scores from the model and guides operational decisions accordingly,
    irrespective of how the scores were calculated.


    From that utilitarian perspective, you can conceive of a model as a black box
    that outputs predictive scores. To make use of those scores, the model''s inner
    workings make little difference. In fact, the other five bizML steps outside this
    one operate in mostly the same way, regardless of which kind of model your data
    scientist develops. Those steps can be executed with little concern about the
    choice of modeling method, so long as the model does its job without consuming
    too much time or computational resources.


    Even so, the data scientist who owns this model-training step doesn''t have the
