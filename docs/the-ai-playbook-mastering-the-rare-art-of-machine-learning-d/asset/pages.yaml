  md: '# Choosing a Modeling Method


    Better prediction doesn’t come for free. Broadly speaking, the better the method,
    the more complex—both to use and to interpret how the resulting model works. You
    can see that progression as you go down the list of methods within the table presented
    earlier. After the first three simpler types of models—decision trees, logistic
    regression, and Naive Bayes—you come to a more complex, adept one: ensemble models.
    To improve on simpler models, an ensemble literally “ensembles them together”—so
    by definition, ensemble models are more complex. By the end of the list, deep
    learning, you’ve increased capacity greatly for certain problems, but you’ve also
    piled on complexity.


    For many projects, the interpretability you get with simpler models is a godsend.
    As we’ve discussed, being able to understand what makes a model tick is sometimes
    critical for debugging and for convincing certain decision makers to fully buy
    in. And auditing a model for ethical considerations—to inspect how it renders
    consequential decisions that affect people—also hinges on understanding its innards.
    This desirable model characteristic is also known as explainability or transparency.
    It’s at least somewhat lost when you move to the impenetrable, unwieldy soup of
    math you get with more complex models. The long if-then rules of a decision tree
    may seem arcane and difficult to understand, but on the scale of things, they’re
    relatively friendly to human eyes.


