    > —Gerhard Pilcher, president and CEO, Elder Research


    Home in on the ML application that offers the greatest potential impact. Pick
    the lowest-hanging fruit: the application that improves the large-scale operational
    process with the most room for improvement.


    And yet, start small. Even if the potential win is big, the project''s scope is
    finite in one key way: You only solve one problem at a time. Each project must
    focus on a single, modestly scoped opportunity with laser precision. This means
    settling on one application of ML, a single value proposition defined by what''s
    predicted and what''s done about it. This increases the likelihood that your organization''s
    first ML initiative will succeed. That early win will set a valuable precedent
    for future ML projects.


    Choosing which process to improve with ML is a business decision very much specific
    to each company. There''s no one-size-fits-all answer. It depends on your sector,
    your business model, the nature of your operations, and how much they could stand
    to improve. Your current operational model, method, and culture must guide the
    choice.


    First and foremost, spend time with operational stakeholders to understand their
    pain points and constraints. As a group, the stakeholders constitute your client
    for the project. That''s the customer you are here to serve.


    Explore. What''s the ripest high-volume operation, the process performed repeatedly
    many times at your organization that could most stand to benefit first? Is there
    a frequent operational decision that''s already entirely or partially automated
    but not yet optimized?


    The options are seemingly endless. Predictive models determine which tax returns
    to audit, which customers to contact for marketing, which debtors to approve for
