    # Speedy Delivery: Models Work Fast


    Great news: Model scoring can be fast, as fast as most any project needs it to
    be. Model scoring is not the *learning* part of machine learning—that''s the “heavy
    lifting.” Rather, it’s the application of what’s been learned. To score with a
    model is usually only a matter of applying a fixed mathematical formula that does
    not involve any loops. Computers do so super quickly.


    The previous step, model training, consumes the most time. It must operate across
    an entire set of training data, which could consist of hundreds of thousands or
    millions of learning cases. That algorithm eats up many computational cycles to
    generate the model, running through the data with its trial-and-error process.
    Model training is typically executed as an offline process that doesn’t need to
    utilize real-time systems. In rare cases, an already-deployed model is continuously
    updated as new training examples are encountered, but such *online learning* is
    very uncommon, since it’s complex and costly to implement and it fails to deliver—if
    properly scheduled, periodic batch training for refreshing a model usually results
    in model performance that holds up virtually as well.


    Once trained, models work fast. To calculate the score for an individual, models
    need only operate on the input data for that one individual. And since the model
    itself is often a relatively simple structure, applying it can be a relatively
    lightweight step for the machine. For example, a logistic model is simply a weighted
    sum of the inputs, with a bit of nonlinear “squeezing and stretching” added on
    for good measure.


