- pgno: 182
  md: '# Why There Are Competing Modeling Methods


    There is no one best *predictive modeling method* (a.k.a. *ML algorithm*). There’s
    no “Holy Grail,” no universal champion. No matter how good a modeling method is,
    there are always some datasets that would be better handled by another method.
    The method that performs the best depends on the problem at hand—ultimately, on
    the nature of the data.


    As the field of ML develops, it’s not converging toward a single best modeling
    method. This fact is encapsulated by the *No Free Lunch* theorem, a famous principle
    among those on the more academic and theoretical side. It’s a cute name that makes
    the point: If there were one method that always wins, the data scientist wouldn’t
    have to work as hard. It’d be like receiving a free lunch.


    Human nature will sometimes try to defy the undeniability of No Free Lunch. ML
    practitioners often become quite infatuated with one modeling method or another.
    But the fact is, you never know what you might be missing by not trying an alternative
    method until you try it out on your data.


    The diversity of solutions is a good thing. The industry thrives by leveraging
    a wide range of competing methods. Even if it were theoretically possible to discover
    one winner-takes-all algorithm, that would be the wrong wish to ask from a genie.
    Each method has its own pros and cons—not only with regard to predictive performance,
    but also regarding all kinds of pragmatic factors such as speed, understandability
    by humans (a.k.a. *model transparency*), complexity, and the level of human expertise
    required to use it.


    The diversity of methods stems from their diversity of conception. Today’s wide
    range of methods were invented at different times, in different countries, by
    different people. Each algorithm was conceived as and designed around a researcher’s
    intuitive notion, something that seemed like a good idea to that person.


    Human ideas tend to be relatively simple, but that helps ML work—because *simplification
    facilitates learning*. Modeling methods only work'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'because they oversimplify. Learning from examples is only possible by way of
    an “inductive leap,” a simplifying assumption about the world. For example, decision
    trees impose a very simple structure: rigid if-then rules based only on whatever
    limited set of input variables has been made available. Even if it were theoretically
    possible to predict perfectly, it certainly wouldn’t be accomplished with that
    kind of simple mechanism. However the world works, it could never be expressed
    in such simple terms. But although far from perfect, the patterns expressed by
    those if-then rules do indeed pan out in general, providing a lift over pure guesswork.
    Modeling methods only work—they only succeed in drawing generalizations from examples—because
    of the limitations in how patterns can be expressed that this kind of structure
    imposes. Without any such structure, an ML algorithm would overfit the data, memorizing
    its peculiarities rather than gleaning insights that hold in general.


    Having such a diverse range of methods empowers the data scientist. She has a
    versatile, dynamic toolkit of options at her disposal. Depending on the project’s
    particulars and requirements, she can try out various options, following her gut
    and the pragmatic rules of thumb that she has picked up throughout her career.
    There’s an ad hoc aspect to this process, but, with experience, experts gain a
    sense for how to proceed.


    This range of available methods is especially valuable when you combine them together,
    having them cooperate rather than compete. An ensemble of diverse models itself
    is in fact one of the most important kinds of modeling methods. Let’s see where
    it fits in among a short list of popular methods.


    # A Summary of Modeling Methods


    There’s a certain commonality among today’s diverse hodgepodge of modeling methods.
    As we’ve discussed, they all accomplish the same thing: Generate a model that
    takes input variables and produces a predictive score. Moreover, they all do so
    in a similar way: Start with a'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'crummy model—one that is very small or totally random—and then iteratively
    tweak it, repeatedly making small modifications to it so that its performance
    across the training examples improves.


    Since each incremental improvement corrects the model so that it gets some cases
    right that it had been getting wrong, you can think of the process as a regimented,
    automated way to improve a scientific hypothesis or theory (in fact, in past decades
    some ML researchers used the word hypothesis instead of model). As Clayton Christensen
    put it in his book The Innovator’s Dilemma, “The key to improving any theory is
    to surface anomalies—events or phenomena that the theory cannot explain. It is
    only by seeking to account for outliers—exceptions to the theory—that researchers
    can improve the theory.” In a way, modeling automates the process of refining
    a hypothesis.


    Modeling methods are supremely general-purpose, applying across industries and
    organizational functions. Each kind of model can serve marketing, financial risk
    management, fraud detection, or clinical healthcare—what makes the difference
    is the data you give it. With all the concrete ways in which we apply them across
    domains, the methods themselves are designed in the abstract. The input and output
    variables you pull together as training data determine whether the model will
    predict sales or successful surgeries.


    Here’s a summary of some of the most popular modeling methods (these all depend
    on labeled training data, which makes them supervised ML methods):


    | | What''s learned from data during model training | Once trained, how the model
    generates a score | Pros and cons |

    |---|---|---|---|

    | Decision trees | The decision tree''s architecture: its size, shape, and choice
    of inputs | Start at the top (the root) and flow down to an end point (leaf).
    | Easy to interpret (transparent) and surprisingly effective for its simplicity,
    although usually outmatched by more advanced methods. |'
