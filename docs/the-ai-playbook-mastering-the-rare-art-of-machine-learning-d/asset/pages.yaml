    When you think up new inputs like these, they’re called derived variables and
    your effort to add them is called feature engineering. This is typically an ad
    hoc, manual process that taps your own creativity. It’s a key opportunity during
    the project for business insights to contribute, complementing the degree to which
    the machine will automatically form combinations that are useful for the predictive
    goal at hand. Some of the variables that people come up with would be difficult
    if not impossible for ML to derive automatically, so manually designing new inputs
    is an important part of the data prep process. Collaborating with business stakeholders
    to generate ideas for new derived variables often contributes a valuable impact.


    Some of the most fruitful derived variables come from thinking outside the box.
    For example, a senior analytics leader, Brandon Southern, engineered inputs to
    detect fraudulent accounts several years ago when working at eBay. His hypothesis
    was that, since a fraudster would typically create many accounts, they would automate,
    and, therefore, the time to set up a new account would be relatively short, as
    would the time to get up a first auction listing. By introducing these factors
    as model inputs, the fraud detection system was able to better detect bots and
    contributed to roughly $20 million in loss reduction across multiple fraud detection
    projects that he worked on.


    Although he now works at Amazon, Brandon reflects on the success of his creative
    insights and the critical need for adept feature engineering. “By 2025 more than
    465,000 petabytes of data will be collected on a daily basis across the globe,”
    he says. “However, only a fraction of a percent of this data is considered to
    be useful for analysis and models.'
  merge: -1
