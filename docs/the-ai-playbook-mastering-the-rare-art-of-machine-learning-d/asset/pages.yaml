  md: '# ML Done Right and Done Wrong


    Jack’s story is exceptional. Beyond capturing value for UPS, he trail-blazed for
    a new business paradigm, establishing best practices for greenlighting and executing
    on the massive operational overhaul that is ML deployment. Jack’s work defines
    a blueprint for effective ML leadership.


    Here’s what Jack got right:


    +   Value-obsessed. Jack evangelized the concrete gains of ML deployment rather
    than the glitz of the technology itself.


    +   Launch-focused. He ruthlessly pursued a strategic path to deployment, instead
    of assuming that the value of deploying the system would be self-evident and taken
    on by others.


    +   End-to-end ownership. He took ownership of the entire, full-scoped process—from
    developing to evangelizing to testing to launching.


    Years have passed, but getting these right is still not the norm. Instead, many
    companies flounder, neglecting to recognize the end-to-end business practice needed
    to deploy ML into the field.


    # A Tale of Two Technologies


    > It was the best of times, it was the worst of times, it was the age of wisdom,
    it was the age of foolishness.

    > —Charles Dickens


    On the one hand, ML is “the most important general-purpose technology of our era,”
    as Harvard Business Review astutely put it. On the other hand, it’s the most misunderstood
    and mismanaged. Misfire after misfire, many ML projects go amiss in their mission
    to deploy, their models destined only to collect dust.


    Capitalizing on this technology is critical—but it’s notoriously difficult to
    launch. Many ML projects never progress beyond the modeling, the number-crunching
    phase. Industry surveys repeatedly show that'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'most new ML initiatives don’t make it to deployment, where the value would
    be realized.


    Hype contributes to this problem. ML is mythologized, misconstrued as “intelligent”
    when it is not. It’s also mismeasured as “highly accurate,” even when that notion
    is irrelevant and misleading. For now, these adulations largely drown out the
    words of consternation, but those words are bound to increase in volume.


    Take self-driving cars. In the most publicly visible cautionary tale about ML
    hype, overzealous promises have led to slamming on the brakes and slowing progress.
    As the Guardian put it, “The driverless car revolution has stalled.” This is a
    shame, as the concept promises greatness. Someday, it will prove to be a revolutionary
    application of ML that greatly reduces traffic fatalities. This will require a
    lengthy “transformation that is going to happen over 30 years and possibly longer,”
    according Chris Urmsom, formerly the CTO of Google’s self-driving team and now
    the CEO of Aurora, which bought out Uber’s self-driving unit. But in the mid-2010s,
    the investment and fanatical hype, including grandiose tweets by Tesla CEO Elon
    Musk, reached a premature fever pitch. The advent of truly impressive driver assistance
    capabilities were branded as “Full Self-Driving” and advertised as being on the
    brink of widespread, completely autonomous driving—that is, self-driving that
    allows you to nap in the back seat. Expectations grew, followed by . . . a conspicuous
    absence of self-driving cars. Disenchantment took hold and by the early 2020s
    investments had dried up considerably. Self-driving is doomed to be this decade’s
    jetpack.


    What went wrong? Underplanning is an understatement. It wasn’t so much a matter
    of overselling ML itself, that is, of exaggerating how well predictive models
    can, for example, identify pedestrians and stop signs. Instead, the greater problem
    was the dramatic downplaying of deployment complexity. Only a comprehensive, deliberate
    plan could possibly manage the inevitable string of impediments that arise while
    slowly releasing such vehicles into the world. After all, we’re talking about
    ML models autonomously navigating large, heavy objects through the midst of our
    crowded cities! One tech journalist poignantly'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'dubbed them “self-driving bullets.” When it comes to operationalizing ML, autonomous
    driving is *literally* where the rubber hits the road. More than any other ML
    initiative, it demands a shrewd, incremental deployment plan that doesn’t promise
    unrealistic timelines.


    # How to Get It Right


    It’s the same disappointing story with many ML projects, even though you don’t
    usually face a deployment challenge nearly as great as when installing models
    into autonomous vehicles. Likewise, you also don’t usually face the complexity
    of optimizing UPS’s operations. Most ML projects have it much easier. And yet
    greenlighting and managing model integration still turns out to be much harder
    than expected.


    In this book, I present a strategic and tactical playbook for launching ML, a
    six-step business discipline to run an ML project so that it successfully deploys.
    I call this practice *bizML*. It overcomes ML’s common failure to launch, surmounting
    the hurdles to deployment by planning for it from the get-go, in detail, even
    before the hands-on data work begins.


    Along the way, I also cover the semi-technical background knowledge everyone participating
    in an ML project needs—in a friendly, accessible way that anyone can understand.
    With everyone on the same page, a multidisciplinary team can collaborate deeply
    throughout the entire end-to-end project.


    The next chapter, chapter 0, overviews the bizML paradigm, kicking off with a
    cautionary tale from my own consulting practice. Then, chapters 1 through 6 cover
    the six-step discipline. Last, the conclusion covers some final ingredients needed
    for planning an ML project, including the project’s staffing, timeline, ongoing
    upkeep, and ethical considerations.'
