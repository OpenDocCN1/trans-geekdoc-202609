  img_proc: true
- pgno: 157
  md: '![](img/99a58a0ea5f8204f7fbf446f6593fd4f_157_0.png)


    In this row of data, the input variables encode what we knew back when we made
    the marketing treatment decision, the point at which it could have helped to make
    a prediction. The final piece of information in that row of data, the outcome,
    was found out later—it’s now also already in the past, but it came at a later
    point in time.


    The potential for error comes in the fact that a lot may have happened since.
    Let’s say it is now the following May. If records currently show they’ve made
    a total of fifteen purchases, we better have a method to calculate that, back
    in October, they’d only made ten purchases so far and include that amount within
    this row of training data.


    Many time-related challenges like this arise and they’re really easy to mess up.
    The mistakes are often called “leaks from the future,” where an input accidentally
    relays information that could only be known later. For example, consider, when
    applying churn modeling, an input that indicates whether the customer has recently
    been included in a marketing campaign that was applied only to customers who hadn’t
    canceled their subscription. In this case, the modeling method will very quickly
    “figure out” that this is a helpful input. The model’s performance will appear
    high—but it’s cheating. In deployment, the model wouldn’t have access to that
    kind of “sneak peek” into the future.


    As another example, one insurance company generated a model that seemed to be
    doing a great job predicting which policyholders would'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'submit a high claim by incorporating the following pattern discovered within
    the data: Policyholders with an email address on file would be more likely to
    submit high claims. But it turned out that email addresses “leaked” the future
    because they had only been solicited from those who ultimately filed a claim.
    As a result, customers with an email address—that is, customers who had by now
    submitted at least one claim rather than none—were indeed more likely to have
    submitted a high claim. Once again, in deployment, the model wouldn’t yet have
    access to this indicator of a claim. The discovery was circular, not predictive.


    This “time leak” pitfall compromises the integrity of predictive modeling. With
    the relative future always readily available during data prep, it’s all too easy
    to inadvertently provide that future to the very model trying to predict it. Such
    temporal leaks are a common “gotcha.” Fortunately, they can often be noticed when
    the data scientist realizes that the model’s performance just looks too good to
    be true.


    # Most People Aren''t Prepared for Data Preparation


    With these stringent “temporal” requirements on each input—that the value provided
    to the model reflects only what was known at a certain point in the past—data
    prep presents a tricky challenge. The data sources that you’re repurposing weren’t
    originally collected with ML in mind. In whatever form your data currently sits—distributed
    across tables, databases, and even systems—you must engineer its transformation
    into the form and format of training data. This transformation involves more than
    only achieving the requisite tabular structure. More than just the arrangement
    of the data, you’re dealing with its very meaning.


    Given these nuanced requirements, you can’t fully automate data prep for a new
    ML project. Each project necessitates a specialized database programming task
    customized for the existing data sources in accordance with how they originated.
    Some analytics software may help automate limited portions of this task—and some
    analytics vendors will promise the moon—but no software can fully handle the meat'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'of the matter for you. Once you’ve worked through how to program it, the programs
    may then automate data prep for future iterations to update the model. But for
    each project’s first pass, you’ve just got to dig in and take this on. There’s
    no running.


    In some cases, you can employ a little trick to sidestep some of this complexity:
    *snapshotting*. This is the process of periodically capturing a “freeze frame”
    of the input variables, logging them as they look right now, so that later, after
    you’ve tracked the outcome that will serve as the output variable, you can then
    just tack this outcome onto each row of training data. In that case, you don’t
    need to recreate the past values of the input variables—you’ve saved them as they
    were at the right time.


    However, that trick doesn’t always apply. If snapshotting hasn’t already been
    in place for a while, you’ll need to do it the hard way in order to make use of
    the data you currently have.


    Common wisdom states that data prep takes a whopping 80 percent of the project’s
    hands-on time, although some estimates are lower. A survey by the ML software
    company Anaconda said that data scientists spend 39 percent of their time on data
    prep—which is still more than the time spent on training and deployment combined,
    according to the same survey. But, for new ML initiatives, data prep is likely
    to take longer than that. On the other hand, if you’re repeating a mostly established
    data prep process in order to update an existing model, the logistical hurdles
    and troubleshooting probably won’t pile on nearly as badly.


    Understandably, the ML industry downplays all this. It prefers to portray itself
    as leading a glamorous life consumed with learning from data—rather than the grind
    of hacking that data together beforehand. Consultants, vendors, and proponents
    often leave this nuisance unmentioned in favor of discussing the sexy part, the
    modeling.


    Beyond the “let’s jump straight into the modeling” culture adopted by most of
    the popular courses and how-to books, one other major trend also inadvertently
    contributes to the costly devaluing of data prep: public ML competitions. The
    host of such competitions—most commonly a company called Kaggle—provides the training
    data and'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'pits data scientists against one another to train the best possible model.
    This advances the state of the art and often provides sponsors with the best crowdsourced
    model that money can buy, but as a side effect, it perpetuates the misleading
    narrative that ML projects are all about the modeling. If you win a modeling competition,
    that doesn’t necessarily mean you’re prepared to lead an ML project to deployment.


    To address this, the education tech firm DeepLearning.AI has launched a new kind
    of data-centric competition. “In most ML competitions, you are asked to build
    a high-performance model given a fixed dataset,” proclaims this unique contest.
    “The Data-Centric AI Competition inverts the traditional format and instead asks
    you to improve a dataset given a fixed model.” Competitors don’t get to make the
    model—they only get to improve the data that’s then used for model training. This
    could help course-correct a culture that’s overly fixated on modeling.


    # Some Noise Kills ML, but Some Is Copacetic


    Given its stringent demands, how disastrous is noise in the training data? In
    light of the credo “garbage in, garbage out,” one might presume that any noise
    would kill ML—especially given the intricacy and delicacy of model training. If
    an ML algorithm is misled by bad data and develops a faulty model, the consequences
    could be dire—the stakes are high when you deploy models for fraud detection,
    financial credit scoring, and so many other pivotal application areas.


    Well, you may be surprised. ML is actually quite robust in the face of certain
    kinds of noise, so there’s only so much cleanup you actually need to do.


    First, let’s de-noise the word noise. It can mean two very different things. If
    data has errors—plainly incorrect values—that’s one kind of noise. This is sometimes
    called corrupt data.


    On the other hand, if the data shows values that appear random—since we have no
    way to predict them, no basis for understanding their origin—that’s another kind
    of noise that doesn’t necessarily involve'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'incorrect values. It just reflects our human lack of knowledge. It''s uncertainty.
    This is the kind of noise Nate Silver references in the title of his famous book,
    The Signal and the Noise.


    So, when data appears senseless or random, that doesn''t necessarily mean it''s
    faulty. It just means we don''t understand all the factors that have affected
    it. ML helps us understand the world a bit better by discovering trends in the
    data. It finds some signal, but it doesn''t by any means eliminate all the noise.


    On the other hand, noise in the sense of outright errors can be a concern. It''s
    pervasive, stemming from many systematic issues. Maybe somebody mislabeled a field
    within one of the databases you merged in. Maybe the age for a group of customers
    was calculated based on the year of birth without looking at the month and day,
    so it''s sometimes off by one, depending on the current month and day. Maybe missing
    (unknown) values were changed, incorrectly, to the value 0 when data was ported
    between systems that represent missing values in different ways. Maybe your sensors
    record only imperfectly. Or perhaps there''s even been malicious, intentional
    corruption of values in the data.


    Despite all this potential noise, things aren''t so bad. Here''s your saving grace:
    Noise among the output variable labels is detrimental to ML, but ML can generally
    withstand noise in an input variable, so long as the amount of noise remains consistent.


    First and foremost, the output variable labels must be sound. They encode the
    prediction goal, which gives model training its direction. For example, if many
    customers who didn''t buy are labeled as having bought, or vice versa, this is
    very much going to mislead the modeling process. The output variable''s integrity
    is critical—it must align with ground truth. Not only does it guide the learning
    process; it also serves to evaluate model performance after the modeling is complete.


    But on the other hand, ML is robust to noise within input variables. Basically,
    you can throw a lot of junk in there, and although it won''t help model training,
    it usually won''t hurt nearly as much as you might imagine. The reason is that
    the less helpful an input is, the less the model will rely on it. Taking that
    to the extreme case, if an input has'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'so many incorrect values that it''s effectively random junk, then a good learning
    algorithm will completely avoid using that variable—or at least lower its involvement
    within the model down to nearly zero.


    To put it another way, incorrect input values just make for more noise. Inputs
    are already noisy in the sense of uncertainty. For the ML algorithm, noise is
    noise and it doesn''t matter which kind of noise it is.


    Picture it this way: If you''re doing image classification, you can see that even
    if there''s a fair amount of noise in the image, it is still easy for you to tell
    that it''s a photograph of a person wearing a hat. A model can handle noise much
    the same.


    ![](img/99a58a0ea5f8204f7fbf446f6593fd4f_162_0.png)


    A photograph of a person wearing a hat is still easy to discern with noise added.


    It''s a relief the world won''t end if you have bad values among the input variables.
    But there''s one major caveat: The level of noise must remain roughly consistent
    between the training data and the data input to the model during deployment. If
    incorrect values are provided when actually using a model, but a similar prevalence
    of errors wasn''t present in the training data when developing the model, the
    model''s performance won''t hold up. So its input better not be wrong much more
    often than it was within the training data that the machine learned from in the
    first place.'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'This is just one part of a more general requirement: The training data must
    be *representative* of the data encountered during deployment. That is, the experience
    over which the machine learns must come from the same “world” or “universe” within
    which the model will subsequently be used. The learning cases must *represent*
    the same “reality.” For example, if the model will target marketing for all customers
    in the United States but the training data only includes customers in California,
    that data won’t be representative; you can’t expect model performance to carry
    over to the rest of the country.


    For the EduPay project, my data failed to meet this requirement. It wasn’t entirely
    representative. For each ad, the training cases were a result of the legacy system’s
    peculiarities. For example, an ad hoc method estimated how popular each new ad
    would be when first launched, which determined how often and on whom it was tested.
    I was working with the available data in hand, not conducting experiments to collect
    an evenly distributed battery of tests for each ad. Although there are technical
    approaches that might have helped, I didn’t take any measures to address this
    imperfection in the data. In the chapter on deployment, you’ll see how things
    panned out nonetheless.


    Now that we’ve covered the various requirements for training data, let’s return
    to FICO to see how the company pulls the data together for its global fraud-detection
    system.


    # FICO Cultivates Data without Borders


    Scott Zoldi has a PhD in theoretical physics from Duke University. And he’s formed
    a team of seventy more people with PhDs. Together, they generate the world’s de
    facto system for detecting fraudulent card transactions. You, me, and most people
    with payment cards are relying on them.


    Scott’s antifraud operation isn’t what FICO is most widely known for. Along with
    another one of his teams, Scott also oversees this country’s *most famous* deployed
    model: the FICO Credit Score. Your FICO'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'Score determines your power to borrow. It''s the most widely used credit score
    in the United States, employed by the vast majority of banks and credit grantors.
    It''s a household name, and many understandably feel that their FICO Score is
    a central part of their identity as a consumer.


    But FICO’s fraud detection, which is normally invisible to us as consumers, affects
    us much more often. Named Falcon, this product is the biggest part of FICO’s software
    business and affects most of us almost every day—every time you use your card.
    FICO evaluates financial power by day—and fights financial crime by night.


    To meet this responsibility, it’s important that the Falcon team gets the data
    it needs—some long, wide, and labeled data. To do so, it collects data from across
    a global network of banks.


    This reliance on inter-enterprise data—collected from multiple companies—is atypical.
    Ordinarily, an ML project serves only the enterprise running the project. For
    such a project, internal data suffices, since the company has been tracking the
    very operations that the project aims to improve. In contrast, FICO isn’t a bank.
    It doesn’t process card transactions. Rather, it holds a rare, globally central,
    entrusted role across banks.


    In 1992, Falcon was born of a radical move by a small group of banks: They decided
    to cooperate rather than only compete. At the time, a tremendous portion of all
    credit card transactions—almost 1 percent—were fraudulent. The fraud rate was
    only growing and threatened the entire industry. This looming crisis convinced
    financial institutions to overcome their raw capitalistic instincts and follow
    a call to arms for the universal good: to collaborate to fight crime, improve
    transaction integrity, and cut losses. Led by a company called HNC Software, they
    joined their data together, thereby multiplying their power to train fraud-detection
    models. Ten years later, FICO acquired HNC Software—and both Falcon and Scott
    Zoldi along with it.


    Since then, Falcon’s consortium has grown to more than 9,000 banks globally, all
    continually sending in anonymized card transaction details. FICO receives about
    20 billion records—amounting to terabytes of raw data—each month, a petabyte every
    five years.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '![](img/99a58a0ea5f8204f7fbf446f6593fd4f_165_0.png)


    Banks provide data to develop Falcon''s fraud detection model and Falcon deploys
    that model for each bank.


    Banks can’t benefit from Falcon without contributing to it. To be a FICO customer
    that uses Falcon, you must also join the consortium and share your data. Falcon
    has become so standard that, despite its cooperative nature, it’s a competitive
    necessity. To hold their position in the payment card market, banks need Falcon’s
    best-in-class fraud detection—which they can access only by cooperating. In the
    end, this levels the playing field: Even the smallest bank can deploy the very
    best fraud-detection model.


    # Engineering Better Inputs for Falcon


    For each card transaction, Falcon’s model needs an informative but reasonably
    succinct summary of all the “evidence” that could reveal whether it’s legitimate
    or fraudulent. That list of factors, each a potential model input, makes for a
    row of training data. It includes a rundown of the cardholder’s previous transactions,
    such as the total number of'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'transactions, number of cash withdrawals, and average transaction amount. These
    counts are broken down by different time ranges, such as for transactions conducted
    over the last day, week, month, and three-month period. The counts are also broken
    down by different types of merchants, such as restaurants and clothing stores.


    But that''s only the basic groundwork. Scott''s team has made a fine art of feature
    engineering, manually designing more complex inputs that further help identify
    fraud. These inputs encode whether recent transactions mark changes in cardholder
    behavior, such as an extreme acceleration in spending or purchases from a completely
    new kind of merchant—for example, purchasing from a golf store when you''ve never
    done so before. At the same time, long-term tracking for each cardholder must
    recognize annual trends so they don''t trigger false flags, such as when a family
    vacations every year in Florida.


    Actually, it''s a bit more "meta" than that. Even the most dramatic change in
    behavior doesn''t necessarily reveal fraud since some cardholders are prone to
    change. They''re inclined to do something unprecedented. For this kind of customer,
    purchasing from a golf store for the first time should not be interpreted as potential
    fraud. For them, change is nothing new. Some anomalies are benign. With the right
    inputs, a well-trained model will be able to discern which sort of change in behavior
    corresponds with fraud.


    On top of all this, other inputs track updates to the cardholder''s profile. For
    example, after you change your email address, it may turn out that you''re a little
    more likely to conduct a transaction in a new-to-you country. With inputs designed
    to reflect this kind of change, the model can potentially learn when to be forgiving
    of such first-time behaviors. Remember, the aim isn''t only to identify fraud
    but also to tame false positives by allowing legitimate transactions even when
    they''re an outlier for that cardholder.


    Finally, other inputs help the model scrutinize aspects of the merchant. After
    all, it''s not only the cardholder''s history that reveals that an attempted transaction
    may be fraudulent. The goings-on at the merchant—across all cards—also provide
    clues. This includes whether'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'the merchant has experienced a rise in attempted fraud or other unusual changes
    in how transactions are trending there.


    # It''s Not Over Yet: Labeling the Data


    Beyond well-engineered inputs, Falcon''s training data needs one more ingredient:
    labels for the output. Each example transaction that makes for a row of data is
    incomplete until designated as either fraudulent or not fraudulent. Those labels
    will guide model training to do its job: Generate a model that can discern positive
    cases from negative cases.


    Only humans can provide the labels. As I briefly touched on a couple of chapters
    ago, for detection, we don''t get to benefit from “time will tell,” as we do when
    predicting a future event. Time has told whether a user responded when shown a
    certain ad or whether a debtor has defaulted. In those cases, we get the label
    “for free.” But for detecting a qualitative attribute for each case—such as whether
    it is fraudulent—each training example’s label can only be determined by a person.


    Manual labeling is labor-intensive and expensive. The expense especially racks
    up when it requires subject matter experts, such as doctors for establishing whether
    each example indicates a certain medical diagnosis.


    On the other hand, problems that don''t require special expertise, such as labeling
    traffic lights within images for an autonomous-driving project, can be outsourced
    on “crowd labor” platforms like Amazon Mechanical Turk for as little as a penny
    per case. But there’s a dark side: Their largely unregulated working conditions
    “offer a bleak glimpse of what could come for a growing digital underclass,” according
    to Vocativ. Marketplace calls this “the new factory floor of the digital age.”


    To make matters worse, fraud detection requires an immense number of labeled transactions
    because positive ones are rare. If the fraud rate is 0.1 percent and you want
    the data to include at least 10,000 positive cases, then you need to label 10
    million cases as to whether each is positive or negative.'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'Don’t fret! Falcon’s training data manages to sidestep this costly bottleneck
    by relying on what consumers do naturally. With card fraud, if the consumer sees
    an erroneous charge, they complain. We cardholders and our banks are in effect
    already doing all the grunt work to label many cases of fraud in the course of
    just living our lives.


    A key reason this approach works is that, with card fraud, banks can afford to
    learn the hard way. Since the detection system is imperfect, it allows some fraudulent
    transactions to go through. This generates a positive training case if the cardholder
    later complains about the unauthorized charge—even though it’s then typically
    too late to prevent the fraudster’s crime. The cost is absorbed by the bank, but
    the overall cycle is economically copacetic. No humans were substantially harmed
    in the process of this data creation.


    In other domains, you can’t do it that way. The missed, uncaught cases—false negatives—aren’t
    nearly as allowable for an autonomous vehicle that would drive through a red light
    or a medical system that would miss a diagnosis. In those domains, you often can’t
    avoid the need for additional manual work labeling many examples.


    This “organic” labeling process for fraud detection, wherein people are essentially
    “following the money,” prioritizes bigger cases of fraud over smaller cases. FICO
    treats only adjudicated fraud as positive cases, where the cardholder has formally
    certified that the transaction was fraudulent (whether it was them or the bank
    who’d noticed it in the first place). This means that suspected cases that never
    get adjudicated aren’t labeled as positive in the training data, even if the bank
    had to write off the charge. Since folks tend to bother with adjudication more
    for larger-value cases of fraud, lower-cost fraud is less often correctly labeled
    and is therefore effectively deprioritized by Falcon’s model. And that’s tolerable
    since the false negative cost is lower for them.


    On top of this manual labeling, many other positive cases are passively labeled:
    those Falcon has automatically spotted. A bank using Falcon blocks an attempted
    fraudulent transaction and the cardholder might never even hear about it. This
    is almost a circular process, since'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'that positive example will then serve to train an updated model for Falcon,
    which identified the positive case in the first place. However, once again, natural
    cardholder reactions help correct the data. If Falcon was wrong—if it is a false
    positive—then the cardholder, whose legitimate attempt to transact was blocked,
    will often take action to get it approved and the case will wind up as negative
    in the training data. In that way, what the model got wrong will serve to improve
    the next version of the model.


    Altogether, this provides plenty of positive examples for Scott''s team. The number
    of labeled cases of fraud that they end up with approaches one million.


    # FICO Falcon Fights Fraud Fantastically


    Falcon works. I consider it one of the world''s most successful and widely impactful
    commercial deployments of ML. It screens all the transactions for 2.6 billion
    payment cards worldwide. That''s two thirds of the world''s cards, including about
    90 percent of those in the United States and the United Kingdom. Seventeen of
    the top 20 international credit card issuers, all of the United States'' 100 largest
    credit-card issuers, and 95 of the United States'' top 100 financial institutions
    use Falcon.


    Since its introduction, Falcon has reduced card fraud losses by more than 70 percent
    in the United States. With the United States currently suffering around $10 billion
    in annual fraud losses, that reduction is saving us in the vicinity of $20 billion
    per year.


    Just as Falcon''s data collection is distributed across banks, so too is its deployment.
    What''s more, that deployment has to happen in real time, generating each predictive
    score in a matter of only milliseconds. These considerations are coming in chapter
    6 on deployment.


    But first, we turn to step 5, using our hard-earned data to train the model itself.
    How do we mere mortals design an algorithm that generates a predictive model from
    training data? That''s one hell of a computer programming homework assignment.'
