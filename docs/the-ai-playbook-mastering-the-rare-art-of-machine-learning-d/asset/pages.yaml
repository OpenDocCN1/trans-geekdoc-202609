- pgno: 29
  md: '# How is bizML different from MLOps?


    The method presented by this book, bizML, is a business practice for running ML
    projects successfully through to deployment, whereas MLOps is a set of technical
    methods and practices to manage and maintain models. Although both relate to the
    operationalization of models, MLOps addresses the technical execution of ML projects
    and bizML addresses the organizational execution, including project leadership
    and cross-functional collaboration. The two work together: A project that follows
    bizML may well employ MLOps. But no technical solution alone can address the business-side
    challenges faced by ML projects. Instead, it takes a business paradigm such as
    bizML.


    # How is bizML different from CRISP-DM?


    This book''s introduction of bizML represents a renewed effort to establish an
    updated, industry-standard playbook for running successful ML projects that is
    pertinent and compelling to both business professionals and data professionals.
    One previous standard established almost thirty years ago, CRISP-DM, paved the
    way by laying out many of the fundamentals, but never gained much traction among
    business professionals. For more details, see chapter 0.


    # Where are this book''s notes and glossary?


    This book''s notes—references, plus resources for further learning—are available
    at www.bizML.com. For a tutorial glossary that includes the terms introduced within
    this book and more, see www.MachineLearningGlossary.com.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Introduction


    Never sell AI. Instead, pitch operational improvements, with no more than a footnote
    to mention machine learning as part of the solution.


    Most ML leaders focus more on the technology than its deployment, so most new
    ML initiatives fail.


    Make no mistake, operational change is a tough sell, especially in comparison
    to hot tech, which sells so effortlessly that we actually call it “sexy.” It’s
    less glamorous to propose a process overhaul. Folks respond like you’re suggesting
    a root canal. But that’s life—great gains come only by imposing great change.


    We begin with the tale of an ambitious pioneer determined to go big with ML at
    a century-old Fortune 500 company already set in its ways. His domain? Logistics.
    But stay tuned and you’ll see why stodgy ML projects are, ironically, really the
    sexiest. You’ll also see how the Innovator’s Paradox can be overcome and why it
    is a good thing that, ultimately, most practical ML projects are bound to dispense
    with the “AI” brand.


    They tried to warn him. As Jack Levis pursued a deep-seated desire to innovate,
    his colleagues thought he was committing career suicide. “I love your passion,”
    one coworker told him, “but you need to know: Everyone thinks you’re nuts.”


    Jack wasn’t trying to change the world. He was only taking on the small matter
    of streamlining how the United Parcel Service (UPS) delivered packages—16 million
    of them a day. He just couldn’t remain satisfied with the status quo. There were
    185 million miles of annual driving to potentially shave off.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Jack had tackled this whole crazy idea voluntarily. He hadn''t been charged
    with this project from above, nor was it part of his defined responsibilities
    at UPS. Instead, he had proactively formed a small team to develop a proof-of-concept
    prototype. As a group, they''d taken it on part-time, on the side.


    One autumn day, after years of work, Jack finally landed an exciting opportunity
    to present to a key UPS executive named Chuck. So he sat Chuck down and pitched
    him an inventive story: a system that would prescribe more efficient delivery
    routes for truck drivers—and, in so doing, more fully realize the value of another
    of Jack''s recent contributions, a system that planned for tomorrow''s deliveries
    by predicting them.


    Sure, implementing this system would mean introducing a mammoth change to existing
    operations. But it promised a mammoth payoff. Jack ran through his presentation
    swiftly and stuck the landing.


    But in response, Chuck''s face remained blank. After a pause, he cleared his throat
    and asked, “So, are you working on anything important?” Jack''s heart sank. Years
    later, he still remembers that day well. “I assure you,” he says, “I didn''t sleep
    a wink that night.”


    The Innovator''s Paradox states that the more novel or radical an idea, the greater
    the struggle to gain support for it. This mighty law seemed to be binding Jack''s
    hands. How do you sell innovation that''s so profound the buyer doesn''t grasp
    it?


    # Pioneers Beware: Disrupt at Your Own Peril


    Unfortunately, the warning from Jack''s coworkers applies far and wide: The greater
    your innovation''s potential impact, the more treacherous it is to pursue. Bravely
    press onward and there''s hell to pay, in the form of doubt, obstinance, resentment,
    and, perhaps worst of all, a glaring lack of appreciation. In return for your
    innovation, expect first to be misunderstood and then, eventually, ruthlessly
    exploited.


    The world ostracizes the very innovators who built it. What if you developed the
    first television (Philo Farnsworth—inspired to emit images'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'row by row like a farmer plows a field) or invented the intermittent windshield
    wiper (Robert Kearns—more challenging than you think). Say you took off for the
    first officially observed, sustained flight (Alberto Santos-Dumont—don''t let
    the Wright brothers’ “long hop” fool you) or fathered theoretical computer science
    (Alan Turing—who also cracked Germany’s World War II Enigma machine and founded
    AI philosophy). Things didn’t turn out too well for you. Corporate empires came
    down on Farnsworth and Kearns and governments brutally persecuted Santos-Dumont
    and Turing. The result? Three deaths and a nervous breakdown.


    And yet, in modern times, innovators disrupt more than ever. The greatest opportunities
    aren’t in building a new device such as a TV or airplane. Instead, the leading
    innovative paradigm upgrades existing systems. It infiltrates the established
    enterprise and overhauls its largest-scale activities, its millions of daily operations.
    It combats risk, targets advertising, prevents fraud, optimizes manufacturing,
    triages medical cases, and streamlines logistics.


    I’m talking about *machine learning* (ML). This book is about ML in the following
    practical, applied sense:


    **Machine learning**: Technology that learns from experience (data) to predict
    the outcome or behavior of each customer, patient, package delivery, business,
    vehicle, image, piece of equipment, or other individual unit—in order to drive
    better operational decisions. ML generates a *predictive model* whose job is to
    calculate a *predictive score* (probability) for each individual.


    ML is a central basis for—and what many mean by—*AI*. This book does not cover
    other areas that are also sometimes referred to as AI, including *artificial general
    intelligence* (hypothetical systems that would be capable of any intellectual
    task humans can do), *natural language processing*, *rule-based systems*, and
    *computer vision*. But this book does pertain to *generative AI*, most famous
    for writing text and producing images. When it comes to improving operational
    efficiencies, classical ML has long reigned supreme—but generative AI is also
    well suited and stands to potentially beat out classical ML in some arenas. The'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'framework presented by this book also serves generative AI—for projects that
    apply generative AI to measurably improve great numbers of operational decisions.


    ML innovates in a straightforward, albeit disruptive way. Don’t let the glare
    emanating from this glitzy technology obscure the simplicity of its fundamental
    duty: For most business applications, the purpose of ML is to issue actionable
    predictions—which is why it''s also sometimes called *predictive analytics*. Although
    learning from data in order to generate a predictive model deserves as much “gee-whiz”
    admiration as any other feat of science or engineering, that capability translates
    into tangible value in an uncomplicated manner: The model generates predictive
    scores, which in turn drive millions of operational decisions.


    For UPS, Jack used ML to predict package deliveries in order to optimize those
    deliveries. This kind of use case for prediction is clear-cut—and yet also momentous,
    even historic. It’s a strategy that drives a vast range of innovation, improving
    practically all the main things that organizations do, all the largest-scale operations
    that make the world go ’round. After all, the universal key to driving better
    decisions is to calculate risks and likelihoods—the chances that a customer will
    cancel, a debtor will default, a component will fail, a transaction will turn
    out to be fraudulent, or a medical image conveys a positive diagnosis.


    ML is the world’s most important technology. This isn’t only because it’s so widely
    applicable. It’s also because it offers a novel boost that can’t be found elsewhere:
    a critical edge for what is becoming a final battleground of business: process
    optimization. As products and services become commoditized and organizations become
    increasingly homogenous in their operations, ML has come of age as a core enterprise
    practice necessary to sustain competitive advantage. To deploy ML is to participate
    in the latest evolutionary step of the Information Age.


    But great gains come only by great disruption. Jack’s system would improve an
    enormous delivery operation—but to realize this value, you’d need to make enormous
    changes by actually deploying it “in the field.” Jack needed to sell his superiors
    on reshaping the entrenched procedure of more than 55,000 delivery personnel.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# When Greatness Is Too Big to See Up Close


    Jack''s proposal also faced another dire challenge, one that''s universal to all
    ML projects: Success only becomes apparent after tracking multitudes of cases
    over time. With a traditional invention, you just turn it on and see it work.
    You immediately witness its power right before your eyes. Press the gas pedal
    and the car moves. Press send and your friend receives your email message. And
    let''s take a moment to appreciate how your windshield wiper pauses beautifully
    between intermittent wipes when there''s only a sprinkle of rain.


    But when an enterprise deploys ML, the effect is not immediately observable. It
    doesn''t operate as a single device or take effect in a single moment. Instead,
    its value accumulates as it drives many decisions, such as which customer to market
    to, which risky debtor to lend money to, or which delivery address to plan for.
    You only see the benefit of changing major operations after tallying many cases
    over time. So, as powerful as it may be, the story is more abstract.


    For many folks, this value proposition doesn''t click as quickly as it would for
    a newly invented device. Some just aren''t mentally prepared to embrace this kind
    of operational overhaul as the pivotal innovation that it is—one that''s just
    as consequential as the various gizmos that have revolutionized our lives.


    Besides, the decision makers who manage the world''s well-oiled machines naturally
    resist change. They''re in the business of avoiding risk rather than overcoming
    it. So, the inertia that an innovator feels holding them back doesn''t only stem
    from some capricious, abominable resistance to change. The resistance is a safety
    measure. It''s for good reason that the boss has never been prone to cultivate
    an interest in grasping highfalutin calculations like Jack''s. Given the priorities
    of keeping the boat afloat, the powers that be barely even have the bandwidth
    to take a look.


    Jack took stock of the challenge before him. Sometimes it seemed like only another
    fearless innovator would have the kind of vision needed to buy into this high-impact
    proposal. But at a long-standing Fortune'
  merge: -1
  img_proc: true
- pgno: 35
  md: '500, the head honchos just ain’t that type. How do you snap them out of their
    corporate trance? Jack weighed his options.


    One sure bet was that, if it’s sexy, it sells. So how about packaging this up
    as the ultimate “secret sauce”?


    # Sexy but Vague: Artificial Intelligence


    The ML industry has bitten forbidden fruit: It has chosen to promote itself as
    AI, an ill-defined umbrella term that includes ML within its malleable scope.
    This tends to mislead, especially when discussing a more typical, practical ML
    initiative designed to improve business operations and not, for example, meant
    to generate humanlike writing or to achieve human-level “intelligence.”


    While the world largely knows of ML as AI—thus the title of this book, The AI
    Playbook—the term AI is also how the world largely misunderstands ML. Because
    AI alludes to “intelligence,” which is stubbornly nebulous when describing a technology,
    the term tends to overstate and fetishize rather than pitching the technology’s
    concrete value. AI is sometimes used to specifically refer to ML or another kind
    of technology like chatbots or rule-based systems—but in many other uses, the
    term hints at exaggerated capabilities.


    Vendors, consultants, and, chances are, some of your colleagues employ the AI
    brand rather than clearly advertising, without obfuscation, what an ML project
    actually offers. After all, plenty of folks with a budget have ears that perk
    up when they hear how advanced and “intelligent” a technology is, even without
    seeing precisely how it will improve business operations. So that route could
    serve to pad your wallet, at least in the short term.


    But it can’t last. The ML industry had better tone this down or we’re all going
    to pay dearly. Glamorizing the core technology takes the focus off its concrete
    value, the specific way its deployment can improve operations. When that deployment
    isn’t central to the plan, the plan is unlikely to come to fruition. Instead,
    the organization must consider the value proposition for a candidate project and
    buy into the project'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'for that tangible value. Then, a very particular change management process
    must commence from the project''s onset. Otherwise, you''re prone to develop a
    model that never gets launched—which is the most common way ML projects fail.


    # Logistics Is Bringing Sexy Back


    > The best [ML] use cases for big business are, frankly, the most mundane ones.

    > —Caroline Zaborowski, astrophysicist turned data scientist


    Jack is the impeccable hero of my story, so you can bet he was too prudent to
    garnish his pitch with flowery “AI” talk. He knew that a change affecting 16 million
    deliveries a day would have to be sold quite concretely. In fact, he didn’t even
    call it ML, predictive analytics, or data science. Instead, he went with just
    about the most boring word there is for it: operations research.


    But boring is exciting. This project was the kind of large-scale optimization
    that reduces tons of carbon emissions and makes tons of money. It promised large-scale
    change and tangible gains.


    The reverse is also true: Some seemingly sexy projects have been slow to transform
    business. They attract a lot of attention with impressive capabilities that promise
    to deliver value in the long run, but so far they’ve enacted little to no change
    and they won’t be moneymakers any time soon. Someday, fully autonomous cars will
    save countless lives, but impediments to their wide-scale deployment prevail,
    with some estimating that it will take decades to achieve. Likewise, IBM’s computer
    that defeated the humans on the quiz show Jeopardy! excited me in 2011 like no
    technology ever had—but its specialized skill does not readily generalize to real-world
    tasks. Similarly, when ML conquers chess, Go, and complex video games, it impresses
    the best of us—but ML’s value is captured only when it’s applied practically.
    And most prominent of all, generative AI systems, which are built with ML, generate
    images and text—often in such an adept and seemingly humanlike'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'manner as to give you the impression that they embody an “understanding” of
    human concepts and that they can express these concepts with language and images.
    When employed to assist humans with creative tasks, generative AI may well prove
    valuable to the enterprise, but to date it hasn’t typically been utilized to boost
    enterprise efficiencies in the straightforward manner adopted by the use cases
    covered here.


    Instead of the glitz, get excited about the measurable impact of running established
    large-scale operations more effectively! Jack’s story took place at the United
    Parcel Service, a sturdy complement to the US Postal Service for more than a century.
    We’re talking about the world’s largest courier, with higher revenue than even
    FedEx. This isn’t some hot new tech company. No, this is precisely the kind of
    older, established firm that runs society’s essential operations—entrenched processes
    begging to be streamlined, even while many in charge fight tooth and nail against
    change.


    Who knew that optimizing brick and mortar logistics was so sexy? Jack’s job title
    plainly reaffirmed this point: senior director of process management at UPS. He
    wasn’t the “director of AI”—or of any technology whatsoever. His focus was on
    the ends—process improvements—not the means, on the business goal rather than
    the technical solution. Having been at the company for more than three decades,
    he was in charge of operations technology and oversaw six divisions. He didn’t
    sit among the upper echelons of executives whom he now had to convince for approval.
    He worked on operations directly, right where it counts. He was situated to enact
    operational change personally. But Jack’s superior had given him the cold shoulder.
    Was this project such a great idea after all? How do you distinguish viable progress
    from overly radical upheaval? First, let’s dive into how Jack’s system worked.


    # Planning for Tomorrow with Incomplete Info


    Imagine that you run a typical shipping center where fifty-five trucks leave every
    morning, each tasked with delivering 300 packages that day. Your job is to decide
    exactly how to distribute these 16,500 packages'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'among the trucks so that the overall operation requires as few miles and driver
    hours as possible. To complicate things, some deliveries are committed for a specific
    time of day, plus no driver''s shift can extend too long. No pressure.


    ![](img/99a58a0ea5f8204f7fbf446f6593fd4f_38_0.png)


    Packages are assigned to delivery trucks at a shipping center.


    Now multiply this problem by 1,000. The system you develop must handle these logistics
    every day for 1,000 shipping centers in the United States. Across this mammoth
    operation, every moment counts. One minute per driver per day costs $14.5 million
    per year. Likewise, one mile is worth $50 million. Really, though, no pressure.


    Overall, millions of gallons of fuel and thousands of metric tons of emissions
    are on the line annually. Okay, maybe there''s a little pressure.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'But here’s the real kicker: The system must work with incomplete information.
    Shipping centers must begin the lengthy process of planning and loading the trucks
    before all of tomorrow’s deliveries have become known. Many delivery destinations
    don’t become apparent until the wee hours of the morning.


    Jack calls this the *Delivery Paradox*. You can’t optimally plan the truck-loading
    until you know all the deliveries that will need to be made. But by the time you
    know all the deliveries, you’ve run out of time to load the trucks.


    This enormously complicates the problem. After all, every package matters for
    the overall plan. If an unforeseen last-minute package shows up after the trucks
    are loaded, it could add miles to a truck’s existing plan. If you’d known earlier,
    you might have distributed the packages completely differently among trucks. But
    you’re out of time. The fully loaded trucks are headed out and redistributing
    the packages would take too long.


    Jack recognized that the Delivery Paradox was a central dilemma since shipping
    centers faced a plethora of unforeseen packages every day. At the time, up to
    30 percent of deliveries still weren’t in the system when the planning for the
    next day had to begin. This was because many packages that arrived on overnight
    flights had missing or only partial tracking information. Some shipping customers
    were late to upload data about their shipments or used noncompliant or glitchy
    systems to do so. Unexpected delays caused by factors like the weather could be
    slow to percolate. Throughout the long night of loading, some “dumb” packages
    would even show up without proper coding, so handlers then had to manually enter
    the destination address on the spot.


    Much of this information latency persists today—it’s largely unavoidable, despite
    various improvements UPS has made to its systems. For example, suppose that a
    package will fly this afternoon from the West Coast to an East-Coast shipping
    center for delivery tomorrow morning. If the East-Coast center begins its planning
    at midday, it’s still too early on the West Coast for the destination address
    to have been uploaded. As another example, even if *all* delivery addresses have
    been uploaded,'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'the number of stops each truck will need to make, each costing precious time,
    is often unknown until the deliveries are actually made, since, for example, a
    large building or strip mall with multiple recipients could turn out to require
    multiple stops. On top of all this, some broad-strokes planning must be completed
    days ahead, for example, to book the right number of drivers.


    In a system as complex as UPS''s internal package network, uncertainty is an inherent
    predicament. The antidote is prediction.


    # Predicting Tomorrow''s Deliveries


    Jack''s system, named Package Flow Technology (PFT), predicts tomorrow''s package
    deliveries so that it can plan for them. These predicted deliveries augment the
    list of known packages.


    ![](img/99a58a0ea5f8204f7fbf446f6593fd4f_40_0.png)


    A combination of known and predicted deliveries is assigned to delivery trucks
    at a shipping center.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'PFT can form a complete plan with this augmented batch of delivery destinations
    and trigger the overnight loading process with time to spare. Trucks are typically
    loaded from about 4:00 a.m. to 7:00 a.m., so the planning must begin earlier—in
    the evening or even during daytime hours for some shipping centers.


    Let''s look at the mechanics of how this batch of delivery predictions is formed.
    First, a predictive model generates each individual prediction, one at a time.


    ![](img/99a58a0ea5f8204f7fbf446f6593fd4f_41_0.png)


    The model, shown here as a golden egg, was generated from data for this very purpose.
    It encodes patterns learned from the past that now serve to put odds on what will
    happen in the future—whether a given address will have a package coming.


    The model is applied repeatedly, performing its calculations for each possible
    delivery address. For the United States, that''s 200 million predictions. Then,
    all the most probable destinations—say, those scored as being more than 80 percent
    likely—are combined with the list of known destinations.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '![](img/99a58a0ea5f8204f7fbf446f6593fd4f_42_0.png)


    UPS''s PFT augments the list of known packages set for delivery with a list of
    predicted deliveries in order to make a plan in time to load the delivery trucks.


    PFT regularly updates these predictions—roughly every two minutes—until the trucks
    head out. Throughout the overnight loading process, some predicted deliveries
    become known, since the package actually shows up—plus, other unforeseen packages
    also come in. The system revises the plan accordingly. As a result, some packages
    may be moved from one truck to another, but most of the prediction-based plan
    remains intact without imposing time-consuming changes. By morning, any incorrectly
    predicted deliveries that never materialized as real packages are dropped from
    the plan. In the end, as the trucks head out with their packages, they no longer
    need delivery predictions—but the predictions are what got them well planned and
    fully loaded in time for that day''s expedition.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# # Predictions Run the World


    Beyond UPS, the same fundamental idea applies far and wide. The capacity to predict
    on a case-by-case basis is the Holy Grail because it pertains everywhere, driving
    decisions such as which customer to target for marketing, which patient to triage,
    which transaction to audit for fraud, which building to inspect for risk of fire,
    and which product to replenish in a supply chain.


    The story is universal: Businesses and other organizations need prediction. Prediction
    requires ML. And ML depends on data.


    Putting that in reverse, the flow runs from left to right in this sequence:


    ```

    data → machine learning → model → predictions → operations

    ```


    We have data, we give it to ML, it makes models that predict, and we use the predictions
    to drive operations more optimally.


    Data fuels prediction because it embodies experience from which to learn. Looking
    back, an organization knows, for example, who bought what, which transactions
    turned out to be fraudulent, and which buildings burned. And UPS knows every shipment
    they’ve made. In making predictions with ML, a company applies what it has learned
    from this experience.


    Let’s be real: It’s not a magic crystal ball. Perfect prediction is not possible—but
