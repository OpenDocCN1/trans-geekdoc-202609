- pgno: 10
  md: '# # Series Foreword


    The world does not lack for management ideas. Thousands of researchers, practitioners,
    and other experts produce tens of thousands of articles, books, papers, posts,
    and podcasts each year. But only a scant few promise to truly move the needle
    on practice, and fewer still dare to reach into the future of what management
    will become. It is this rare breed of idea—meaningful to practice, grounded in
    evidence, and built for the future—that we seek to present in this series.


    Abbie Lundberg

    Editor in Chief

    MIT Sloan Management Review'
  merge: -1
  img_proc: true
