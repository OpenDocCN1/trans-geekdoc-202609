- pgno: 132
  md: 'Although revenue and profit are often obvious choices, sometimes it''s short-sighted
    to go so directly for the “gold.” For example, what''s most important when decreasing
    customer attrition? Retaining only the most valuable customers? Not necessarily.
    The absolute rate of defection across all customers—including those who barely
    turn a profit—speaks to the integrity of your business and the extent to which
    the customer experience satisfies.


    Fraud detection brings up the same question. In the immediate term, it pays to
    intercept the biggest fraudulent transactions—so you could make it a priority
    to preempt perpetrators about to grab $50,000 worth of goods rather than only
    $50. But there is also value in punishing offenders large and small in order to
    decrease the overall crime rate and protect the fundamental integrity of commercial
    transactions.


    How about often-heard, lofty business objectives like “meet today’s escalating
    customer expectations” or “enhance user experience”? These alone aren’t specific
    enough to fulfill a KPI’s third requirement: Be measurable. They must be translated
    into well-defined quantitative measures such as “frequency of product returns”
    or “customer satisfaction conveyed on a survey.”


    We seem to have our left and right feet in two very different worlds. KPIs pursue
    business goals. Performance metrics like lift pursue pure predictive power. How
    do the two relate?


    # Distinguishing False Positives from False Negatives


    The quantities that data scientists are trained to optimize, the metrics they
    use to gauge progress on their data science models, are fundamentally useless
    to and disconnected from business stakeholders without heavy translation.


    > —Katie Malone, Harvard Data Science Review


    Sometimes, translating from a performance metric to a KPI is straightforward.
    Within a couple of sidebars earlier in this chapter, we’ve seen that applying
    some arithmetic based on the model''s lift serves'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'to calculate profit—for response modeling and for credit scoring. The intuition
    behind these calculations is straightforward: Lift tells us how many times better
    the model has predicted than guessing, and that multiplier is how much more often
    we get to seize on more profitable cases or avert more costly cases.


    More generally, we often can span a mathematical bridge from technical performance
    to business performance by incorporating the price you pay when a model predicts
    wrongly. You incur a misclassification cost for two different kinds of prediction
    error:


    **False positive (FP):** When a predictive model says “positive” but is wrong.
    It’s a negative case that’s been wrongly flagged by the model as positive. Also
    known as a *false alarm* or a *false flag*.


    **False negative (FN):** When a predictive model says “negative” but is wrong.
    It’s a positive case that’s been wrongly flagged by the model as negative.


    ![](img/99a58a0ea5f8204f7fbf446f6593fd4f_133_0.png)


    As we’ve seen, accuracy is a blunt instrument. It’s one thing to know a model
    is wrong, say, 12 percent of the time. That’s the same as saying it is correct
    88 percent of the time; that is, it’s 88 percent accurate. But it’s another thing,
    a much more helpful thing, to separately break'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'down how often it''s wrong for positive cases and how often it''s wrong for
    negative cases. Accuracy doesn''t do that (nor does the pairing test).


    That''s what FNs and FPs are for. A FP is when the model says “positive” but is
    wrong. It''s a negative case that''s been wrongly flagged by the model as positive.
    This is also called a *false alarm*. The story about the boy who cried wolf is
    about him intentionally generating false positives. A FN is when the model wrongly
    says “negative.” It has overlooked a positive case.


    # Calculating Savings Based on Misclassification Costs


    So how do we assign a cost to each of these kinds of misclassification? That comes
    down to how much each kind of error matters. For almost all projects, it matters
    a different amount for a FP versus a FN.


    Take fraud detection. When your bank''s model wrongly blocks your legitimate credit
    card transaction as if it were fraudulent, you''re inconvenienced. That''s a FP.
    This could cost the bank $100 on average, given that you may turn to another card
    in your wallet—not only for the current purchase, but in general.


    The other kind of error is worse. When the bank''s model wrongly allows a fraudulent
    credit card charge to go through, that could cost the bank $500 on average, as
    the criminal gets away with the contraband. That''s a FN.


    These costs are no small deal. Global payment card fraud losses have surpassed
    $28 billion annually. The cardholder or an eagle-eyed auditor may notice the bogus
    charge later, but for card purchases, if it isn''t caught by a model on the fly,
    it''s in the wind. In the United States, the bank is usually liable for this loss.


    By determining the two misclassification costs, we establish a cost-benefit analysis
    not only for the entire project but for each individual decision about whether
    to hold or authorize a transaction. Next, we''ll add those individual costs up
    to calculate a KPI for the overall project: *cost savings*.'
