- pgno: 12
  md: '# Foreword


    There''s almost no business outcome that machine learning cannot help you improve
    today. From delivering a best-in-class customer and consumer experience to fueling
    productivity, increasing safety, optimizing operations, and improving your employee
    experience, ML can raise the bar on the metrics that matter across all. Its practical
    deployment represents the forefront of human progress: *improving operations with
    science*. But where do you start, and how do you ensure what you do start doesn''t
    end up in the dustbin?


    Over the course of my career I''ve consulted with over thirty Fortune Global 500
    companies on data and analytics, and led global data and analytics organizations
    at Caterpillar and Unilever. I''ve seen the highs and the lows, including analytics
    programs that generate tremendous value and competitive advantage, and those that
    never seem to leave the starting gate. In my experience, those companies or teams
    that struggle to embed analytics at scale typically suffer not because of imperfect
    analytics execution or ML models, but rather because of a gap in the other factors
    required for success.


    As one example, while consulting, I worked with an analytics team at one of the
    world''s largest retailers on a program to improve marketing ROI. The in-house
    team had already developed an advanced media analytics model. They were flush
    with data, leveraging hundreds of millions of data points on marketing spend,
    response, products, stores, and other contributing factors. The team poured hours
    and hours into perfecting the model and fine-tuning it to highest possible levels
    of'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'accuracy and then summarizing the output into a list of top insights for action.
    The day of the big presentation to marketing leadership arrived and the team presented
    the recommendations to improve ROI by making key changes to offline marketing
    spend. They looked to top marketing leadership for their reaction, expecting smiles,
    gratitude, praise, and appreciation. Instead, they were met with a mix of apathy
    and disbelief. The problem was that the team had missed crucial steps required
    to fully understand and incorporate stakeholder priorities, decision-making factors,
    and processes.


    Contrast that with an experience I had leading an AI-powered portfolio optimization
    program at Unilever. Unilever is a global organization. The products are sold
    in over 25 million stores across 190 countries, with over 2.5 billion people using
    the products every day. Unilever’s brands include Dove, Knorr, Sunsilk, Hellmann’s,
    Axe, Ben & Jerry’s, Domestos, Suave, TRESemmé, and Magnum.


    We saw an opportunity to make smarter and faster decisions by taking a global,
    data-driven approach to optimize our portfolio of products and reduce complexity—through
    a program we would later name Polaris. A sharper portfolio of products ultimately
    benefits consumers and retailers, optimizes our operations, and drives profitable
    growth for Unilever’s shareholders. Our team built an AI-powered capability and
    business process to analyze the entire product portfolio globally and recommend
    products to delist, grow, fix, and protect. The system leverages analytics to
    track the execution of those actions and drive accountability across thousands
    of individuals in the organization. We created and scaled Polaris globally in
    approximately two years, bringing together the best of machine and human intelligence,
    which empowered us to make more efficient and effective decisions and grow through
    simplification.


    The path to get there wasn’t easy and there wasn’t a guidebook available to help
    us at the time. Fortunately for the reader, the steps outlined in this book bring
    to life crucial best practices we followed in delivering a globally scaled initiative
    with lasting business impact. These include:'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# 1. Start with outcomes in mind and focus on delivering value incrementally.


    We started with a simple question: Could we increase the rate of decision making
    and execution to simplify the product portfolio—delivering savings while driving
    growth with our customers? Only after delivering on that scope and establishing
    that value did we expand to complete product portfolio optimization, including
    non-consumer facing simplification such as flagging specifications and ingredients
    to harmonize across products.


    # 2. Leverage empathy to overcome barriers to change.


    Consciously or unconsciously, we are all preprogrammed to resist change. To overcome
    this, the analytics team spent hundreds of hours with other teams across the business
    to understand how portfolio decisions were being taken currently—including marketing,
    sales, supply chain, finance, research and development, and retailers. By gaining
    an understanding of the pain points in the current processes, we were able to
    bring forward a compelling value proposition for stakeholders across levels and
    functions.


    # 3. Prepare the data so that it meets business needs.


    Only by anticipating early the differences in data availability, due to the global
    nature of our business, did the team succeed in scaling the capability across
    geographies. We recognized that we had to adapt to variations of data across markets—some
    of which were rich with retailer and third-party data illuminating shopper behavior
    patterns, while others held inconsistent point of sale and shopper information
    based on the route to market. A versatile data infrastructure and stringent data
    validation process were key to success.


    These experiences have made me acutely aware of the many hurdles that must be
    overcome to deliver scaled value realization with ML. Innovating the enterprise
    with ML is revolutionary, and revolutions aren’t easy.


    Many senior data leaders come to learn the same lessons, but only after years
    of experience and failed projects. Then after understanding it'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'themselves, they still struggle to advocate for these success factors with
    their business counterparts. Without common understanding between business stakeholders
    and data leaders on the best practices for delivering data and analytics transformations,
    many projects fail to take off, struggle to scale, or ultimately don’t deliver
    on the business outcomes.


    The industry needs a framework to better leverage ML for business results. This
    book introduces bizML, which brings forward the best practices in a succinct and
    actionable way. Not only is the book a timely and much needed addition to the
    industry; it is also powerful in bringing AI down to earth, eschewing the hype,
    and making it tangible for all readers. This book is the driver’s manual for machine
    learning—every business and analytics professional should read it.


    Morgan Vawter

    Global Vice President of Data & Analytics at Unilever,

    former Chief of Analytics at Caterpillar,

    former Data Management Practice Lead at Accenture,

    and a Fortune magazine “40 Under 40” honoree'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Preface


    # A Brief History of Why Machine Learning Projects Stall


    When promoting breakthrough technology, be careful what you wish for.

    Back in the Dark Ages, before data was cool and phones were smart, I networked
    my way into the swank office of a powerful business executive. Hoping that he
    would introduce me to—or become—my first client, I declared that I was striking
    out on my own as a machine learning (ML) consultant. Unfamiliar with ML and disinterested,
    he looked at me like, “Don’t waste my time,” and I was quickly back on the streets
    of San Francisco.


    This was 2003, right after I''d relocated from the East Coast and ordered new
    business cards, all in the pursuit of my passion. I had fallen in love with ML
    a dozen years earlier, first in the research lab and then as a Columbia University
    professor teaching the graduate-level ML and AI courses. It was the most exciting,
    potent, and widely applicable kind of technology. Moving west, I vowed to introduce
    it to the non-academic world. I wanted to see ML deployed.


    At that time, a corner of the industrial world was already using ML, but they
    called it something else: data mining. I thought that term was misleading to the
    non-data folks, but “machine learning” kept getting me kicked out of offices.
    So I latched onto a new buzzword that had just started to gain traction, predictive
    analytics. A rose by any other name.


    Unfortunately, my improved vocabulary didn’t immediately land me clients. “You
    should just take a full-time job,” a senior executive at an established analytics
    vendor bluntly threw in my financially insecure face.

    Instead, I doubled down. Tripled down. I held corporate training seminars. I published
    articles. I networked like mad.'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'Clients eventually started coming in, but only enough to keep me busy. I was
    knee-deep in demand, but I needed it up to my belly button. The world still didn''t
    get it. I had to evangelize harder. I took a three-pronged approach:


    +   1. Conference. I launched Machine Learning Week (formerly Predictive Analytics
    World), the first ML conference series outside academic and vendor events. Bolstered
    by its sister publication, the Machine Learning Times, the conference series has
    since grown to serve 18,000 attendees internationally.


    +   2. Book. Next, I wrote Predictive Analytics, the first popular book that showed
    readers of all levels how the algorithms work under the hood. Written to ignite
    and excite, it ended up becoming a best-seller, winning several awards, landing
    me 100 keynote speeches at conferences outside my own, and being adopted as course
    material by hundreds of universities.


    +   3. Music video. I even dropped an educational rap music video called “Predict
    This!,” which went a bit viral (to watch, go to www.PredictThis.org). Surely this
    proves that I’d literally do anything to spread the gospel of ML.


    Whether or not these efforts helped light the fuse, one thing’s for sure: ML exploded
    in popularity. It grew from a nascent industry to a full-blown commercial movement.
    It came of age as a core enterprise practice necessary to sustain competitive
    advantage. Hyperboles reigned as data scientist dethroned firefighter to become
    “the sexiest job.”


    Watching ML become so hot felt both gratifying and surreal. The experience reinforced
    an age-old lesson: Keep the faith. When you believe in a good idea—such as the
    notion that learning from data is not only cool but valuable—and stick to your
    convictions, people will eventually come around.


    # Failure to Launch


    Unfortunately, ML’s great rise has also taught me another lesson: Be careful what
    you wish for. The buzz has gone too far. In a way, ML is now'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'too hot for its own good. The problem is, the onslaught of excitement has fed
    a common misconception that derails many ML projects:


    **The ML Fallacy**: Since ML algorithms work (amazing and true), the models they
    generate are intrinsically valuable (not true).


    The value of ML comes only by launching it to enact organizational change. After
    generating a model with ML, you capture its potential value only when you deploy
    it so that it actively improves operations. Until a model is *used* to actively
    reshape how your organization works, it''s *use-less*—literally. A model doesn''t
    solve any business problems on its own and it ain''t gonna deploy itself. ML can
    be the disruptive technology it''s cracked up to be, but only if you disrupt with
    it.


    Most ML projects fail to deploy. I believe this is mainly because most ML leaders
    neglect to properly plan for the operational change that deployment would bring
    to fruition. That planning takes more preaching, socializing, cross-disciplinary
    collaboration, and change-management panache than many, including myself, initially
    realized.


    Far too often, the data scientist delivers a viable model, but the operational
    team isn''t ready for the pass—and they drop the ball. There are wonderful exceptions
    and glowing successes, but the generally poor track record we witness today forewarns
    of broad disillusionment with ML—even a dreaded *AI winter*. It''s time to tap
    the brakes and correct course so that ML can deliver on its promise.


    # Breaking through the ML Snafu


    So I''ve pivoted from ML cheerleader to wary disciplinarian—albeit an optimistic
    one—with a new mission: *Standardize and broadcast the very particular business
    discipline needed to get ML launched*. Whereas my first book was about how ML
    works technically, this book is about how to run ML projects so that models not
    only work in the lab but also successfully deploy.


    First things first: Business professionals—who are a primary audience for this
    book—need some edification. Before those in charge can'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'confidently green-light model deployment, they must gain a concrete understanding
    of how an ML project works from end to end: What will the model predict? Precisely
    how will those predictions affect operations? Which metric meaningfully tracks
    how well it predicts? and What kind of data is needed?


    Only when the business leaders—including executives, managers, and decision makers—come
    up to speed on this semi-technical but straightforward knowledge can we bridge
    the gap between the tech and business sides and bring model deployment into the
    realm of possibility.


    These days, everything I do is to unite those two worlds, tech and biz. In addition
    to this book, I''ve taken another three-pronged approach:


    +   1. Conferences focused on deployment. Newer offshoots of my event series,
    Machine Learning Week, build on the nuts-and-bolts aspect of analytics to also
    cover industry-specific deployment, including applications in marketing, financial
    services, industry 4.0, healthcare, and climate technology. The first track devotes
    itself to the business side—we call it the operationalization and leadership track.


    +   2. Business school professorship. After a twenty-two-year hiatus, I returned
    to academia to hone the methodology described in this book, serving for one year
    as the Bodily Professor in Analytics at the Darden School of Business at the University
    of Virginia. The switch in departments—from computer science years ago to business
    more recently—reflects my shift in focus: For ML to succeed, we need a business-side
    vantage.


    +   3. More expansive training. Finally, I''ve launched an online course, “Machine
    Learning Leadership and Practice: End-to-End Mastery,” to broaden the almost universally
    narrow focus of today''s ML courses—which typically jump straight to the number
    crunching, forgoing the extensive business planning that should come first.


    If you don''t have time for a three-month course, you might instead just read
    this book. It covers the disciplined approach required to deploy ML initiatives,
    formulated as a six-step playbook that I call'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'bizML. Along the way, it gets readers of all backgrounds up to speed on the
    semi-technical knowledge they need.


    Considering the innumerable dollars and resources pumped into ML, how much more
    potential value could we capture by adopting a universal procedure that facilitates
    the collaboration and planning needed to reach deployment?


    Let''s find out.'
  merge: -1
  img_proc: true
