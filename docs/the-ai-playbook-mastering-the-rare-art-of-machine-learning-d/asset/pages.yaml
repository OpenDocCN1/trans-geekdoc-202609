  md: 'There is no Santa Claus; you must gather and assemble the training data yourself.


    As Cisco''s chief data evangelist Jennifer Redmon put it, “New data science graduates
    have a false sense of security that the data they’ll receive will be sound.”


    By not skipping past the steps up to and including data preparation, we properly
    plan for deployment. In particular, step 2 established a prediction goal worthy
    of deployment—based on an informed, socialized, and ultimately greenlit project—and
    the training data, in turn, will embody that prediction goal; the way you pursue
    that goal is by preparing the data accordingly.


    # What Training Data Looks Like: Rows and Columns


    Before we see how Scott and his team at FICO get their data, let’s first cover
    the basics by way of a simpler, more typical story.


    When I pulled together the data for the EduPay project, I had it a lot easier
    than Scott. The data I needed was readily at my fingertips. This is typical. After
    all, most ML projects seek to optimize only the business, not the whole world,
    so you don’t have to search the world over for data. Internal data is enough—at
    least to get started.


    Even so, data prep always presents a great challenge. Preparing the necessary
    long, wide, and labeled dataset from internal sources is already hard enough without
    pulling it together from across organizations.


    Data serves the prediction goal so that goal must be reflected within the data.
    The prediction goal determines what the data consists of and affects its length,
    width, and labels. For EduPay, we had this goal:


    # Prediction Goal for Targeting Ads (EduPay): Will the user respond to this ad
    if it is displayed?


    I needed a long list of examples with both positive and negative cases, situations
    in which the user did respond to the ad and others in which they did not. Here
    are three sample rows of data pertaining to an ad for a university:'
