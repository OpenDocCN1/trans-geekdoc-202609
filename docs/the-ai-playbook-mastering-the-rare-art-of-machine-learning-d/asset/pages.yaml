  md: 'the smallest unit of geography that is taken into consideration when planning
    a truck’s packing and deliveries. In some areas, a sequence corresponds to a single
    delivery address. In less populous areas, it may correspond to a group of addresses.
    And in the most rural regions, a sequence corresponds with an entire zip code.


    Since the existing planning process operated in terms of each package’s sequence,
    *predicted* packages would also need to be determined on the sequence level. But
    it didn’t quite stop there. Within a sequence—whether large or small—the number
    of packages and the number of times the truck would need to make a stop were critical
    to determine whether a driver’s assignments were doable within one workday. After
    working through the details, here’s how Jack formulated his prediction goal.


    **UPS Prediction Goal**: For each sequence (a kind of dynamic geographical region),
    how many packages across how many stops will be required tomorrow—for each delivery
    time commitment? For example, sequence 457, a group of three office buildings
    with twenty-four business suites, will require two stops with three packages each
    by 8:30 a.m. and five stops with eight packages each by 5:00 p.m.


    Before UPS introduced package prediction, the planning process already worked
    with this level of detail for known deliveries. Once this process could also work
    with the same level of detail for *predicted* deliveries, it could plan even more
    effectively. With the predictions designed to be compatible with the existing
