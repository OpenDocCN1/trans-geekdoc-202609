    ML’s plunge could be worse than most. The disconnect between hype and reality
    seems to only be increasing, with so much more attention being given to the tech
    than to its deployed value. When the executives catch on, there’ll be hell to
    pay. If we continue on the current course, the fall from grace will be steeper
    and the disillusionment deeper. It’ll be central to a third AI Winter, an era
    of diminished excitement and funding. Our subsequent climb back up the “Slope
    of Enlightenment” will likely be more gradual, with productivity a longer way
    off.


    # Reframing ML


    We don’t focus on the technology. To tell you the truth, I don’t have a single
    analytics project. I’ve got business projects and analytics may be part of that.


    > —Jack Levi


    If we reframe ML, it could avoid such a dire plunge. Although I believe AI Winters
    are inevitable, that painful nosedive need not take ML along for the ride. By
    realistically and concretely communicating what ML offers—and, ideally, by calling
    it “ML” rather than “AI”—we can differentiate it from the often-misinformed hype
    that defines the AI brand and save ML from being a victim of its own hotness.


    We need only reorient the focus. Don’t propose an “ML project.” Instead, pitch
    and lead a project that will improve operations, with no more than a side note
    mentioning ML as part of the solution. Usually, ML projects are framed in this
    way:


    AI will improve operations.


    In addition to dispensing with the term “AI,” which usually compromises clarity,
    we must reframe the project in this way:'
