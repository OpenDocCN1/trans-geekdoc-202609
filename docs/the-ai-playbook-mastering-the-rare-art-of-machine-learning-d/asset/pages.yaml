- pgno: 148
  md: 'The most notable exception is for models that handle large files such as images
    or sounds, most commonly *deep learning models*, a.k.a. *deep neural networks*.
    In that case, the raw data for each case doesn''t elegantly fit into a single
    row. So, for example, when you apply deep learning to classify medical images,
    the training data isn''t conceived of as a two-dimensional table. Each case consists
    of an image—itself two-dimensional—and the image''s label, such as whether there
    is a positive medical diagnosis. Such non-tabular data is sometimes known as *unstructured
    data*, with tabular data known as *structured data*. And yet, even with unstructured
    data, the broader concept still applies: It''s a long list of positive and negative
    examples, even though each item in the list isn''t structured as a simple row
    of data.


    # The Data Dictates What the Model Does


    For a standard modeling project, the columns you set up in the training data determine
    the model''s functional purpose, its input and output. The *target* column, conventionally
    but not always the rightmost one, is what the model will try to predict—it corresponds
    to the model''s output. This is where the prediction goal established back in
    step 2 comes into play. By filling that column with those values, you''re dictating
    what the model will predict.


    Setting up the data is setting up the modeling. More than any configuration you
    may adjust when operating a predictive modeling software tool, it''s the training
    data you give to that tool that determines what your modeling project is set to
    do, what the model will predict for each individual. You don''t somehow characterize
    or “describe” the prediction goal to the modeling software. Instead, the one and
    only way in which you set up your established prediction goal is here and now
    in step 4, by filling in that column of data.


    The rest of the columns are what the model will try to predict with—it will take
    their values as inputs. By putting those columns of data in place, you are stipulating
    that they will be available to the resulting model. These inputs will constitute
    the model''s eyes and ears, the only pieces of information it will have in order
    to make its prediction about'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'any one individual. They''re the fodder the model will chew on before generating
    a predictive score.


    As all data scientists know, the training data''s input columns are technically
    known as *independent variables* (a.k.a. *features*) and the output column is
    called the *dependent variable*. But in this book, I''ll just call them input
    and output variables or the inputs and the output.


    By placing the input variables next to the output variable on each row, we juxtapose
    what was known at one point in time alongside the outcome that was found out later,
    which we''d like to be able to predict. This juxtaposition is what enables the
    system to discover how things known at one point relate to—and therefore are predictive
    of—something that will happen later.


    To be clear, in this data, both the inputs and the output are already known—no
    prediction required. Rather, each row is an example from which to learn. Once
    we ultimately have a model, we''ll apply it to cases that look similar to those
    in the training data, except the output will be as yet unknown. After all, that''s
    the whole point of the modeling process: When the resulting model is used in deployment,
    all it will have is the input variables. The outcome will be part of the *ultimate
    unknown* that we call the future. Putting odds on that eventuality is precisely
    what we''re making the model for.


    # Big Training Data for Ad Targeting


    Of course, real training data grows much wider and longer than the small sample
    of three rows and nine columns shown earlier. It''s wider because more model inputs
    means more to predict with. For EduPay, I pulled together thirty-three inputs—making
    the training data thirty-four columns wide if you also count the output variable.
    This included other elements from the extensive profile EduPay collects from its
    users, such as career objectives, school clubs, and military experience.


    It also included inputs I designed in the hope they would provide novel predictive
    value, such as:'
