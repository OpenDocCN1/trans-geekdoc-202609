- pgno: 50
  md: '# 0 BizML


    # Six Steps to Machine Learning Deployment


    Why start with a “chapter 0”? This chapter introduces bizML, the six-step playbook
    covered by chapters 1 through 6. BizML maps out the strategic practice needed
    to get machine learning launched—that is, not only to perform number crunching
    on data, but also to operationally deploy the results. To understand why this
    approach is needed, this chapter addresses several pressing questions: Why do
    most ML projects fail to deploy? Why is it so important to plan ML projects backward?
    Why must business leaders possess semi-technical know-how, even if they’re not
    data scientists? And who should lead the project in the first place?


    It''s a crisis. Humanity''s latest, greatest invention is stalling right out of
    the gate. Machine learning projects routinely fail.


    This cannot stand. The world needs ML. It combats our most significant risks—including
    wildfires, climate change, pandemics, and child abuse. It boosts sales, cuts costs,
    prevents fraud, streamlines manufacturing, and strengthens healthcare.


    But most ML initiatives die an early death: They stall before deploying. These
    misfires cost us dearly. Who''s to blame?


    Blame data scientists like me.


    My regrettable behavior began years ago. I was visiting the hip San Francisco
    offices of gay.com—now defunct, but then the most popular gay dating site in the
    United States. This was the first significant client engagement I''d landed as
    a newly minted independent consultant.'
