  md: 'tree. With a model so straightforward and intuitive under the hood, project
    staff members had an easier time selling its deployment across the company.


    Another reason to stick with simpler models is that even if you pay the extra
    price of complexity, it won’t necessarily improve prediction. More complex methods
    aren’t guaranteed to do better. Sometimes it isn’t worth it to go “full rocket
    science.” Again, the best method for any given data just depends. There is no
    one method sure to always do best. Every ML project has an experimental aspect
    to it: You can only know how well a method will work by trying it.


    When it comes to choosing a method, human judgment is key, since rigorously comparing
    every competing method is impractical. It’s usually possible, for example, to
    give all five of the methods listed in the table above a preliminary shot, or
    even to try out three or four times as many, if you invest a lot of time. The
    challenge is that, for each method, there are many settings that affect its performance—too
    many to exhaustively test. To address this, techniques from the field AutoML serve
    to systematically explore many methods and settings. AutoML is an increasingly
    popular, albeit inexact, approach. It helps scale your search for the best modeling
    setup, but it does not replace the expertise of a data scientist.


    Ultimately, a rigorous head-to-head comparison between even just two modeling
    methods is a challenge to accomplish, since each one has so many knobs and dials
    with which you could experimentally fiddle ad infinitum. Champions of any one
    method—data scientists who are fans and have become highly experienced with that
    method—tend to get the best performance out of it. Given this human factor in
    model performance, the conclusiveness of any head-to-head trial pitting methods
    against one another can always be questioned.


    In the end, the data scientist must be artful. Their experience and intuition
    guides the choice of model. Practically speaking, for many ML projects, data scientists
    end up trying out only a few methods. Besides, there’s another, better opportunity
    for improving predictive performance.'
