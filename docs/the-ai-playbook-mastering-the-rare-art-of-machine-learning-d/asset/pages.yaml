  md: '**Churn Modeling Prediction Goal (for gay.com):** For customers on monthly
    and quarterly plans only, will the customer intentionally and explicitly cancel
    within three months? Passively canceling due to a credit card failure doesn’t
    count.


    The details matter. We want to predict would-be cancelers who we might still be
    able to save. Predicting too far into the future, such as a year from now, often
    proves too difficult for a model. Besides, we don’t want to reach out with an
    incentive to stay—such as a costly discount offer—until their departure is more
    imminent. This means setting aside those customers on annual plans, since their
    next renewal may be up to a year away (they could be handled with a separate churn
    modeling project). Finally, we can only try to change the mind of those who will
    cancel on purpose. For those whose credit card charge is declined, which leads
    to an automatic cancellation, it may suffice for the company to take reactive
    rather than predictive action, with potentially no need to offer a discount. Those
    customers aren’t canceling intentionally, so their attrition is another matter
    for another project.


    # Predicting Too Late


    Some churn modeling projects predict well but predict too late. ML consultant
    Karl Rexer shared with me a perfect example of this that arose when he was helping
    a bank. The goal was to identify customers likely to close their accounts. Karl
    discovered that if the customer’s deposit and loan balances fell very low—in combination
    with some other factors about the customer—they had a 44 percent chance of closing
    within a month. On the scale of things, that’s an astounding find. Relatively
    speaking, 44 percent is very high. Across all customers, the chances were only
    2 percent.


    For any one of these customers, the bank faced a high risk of losing them. Unfortunately,
    as Karl realized, there wasn’t much they could do about it. These predictions
    were almost useless since it was already too late to change their mind. That is
    to say, the insight wasn’t'
