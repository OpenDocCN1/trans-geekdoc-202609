    # Detection versus Prediction: Sometimes Easier, Sometimes Harder


    As you define the prediction goal, beware the differences between a goal to predict
    the future in the literal sense of *prediction* and a goal that predicts a situation
    or diagnosis—that is, a detection goal. As I pointed out in the last chapter,
    we do generally use the word “predict” either way, such as when “predicting which
    transaction is fraudulent,” and we still call it a *predictive model*. But there
    are some significant differences between the two that could wind up making the
    project alternatively easier or harder.


    At first glance, detection goals look easier to define. When it comes to predicting
    (detecting) which transaction is fraudulent, which email is spam, and which medical
    image signifies a certain diagnosis, how many caveats and qualifications could
    there be?


    The answer is, not many. Since the model doesn’t predict a future event, we need
    not grapple with the concept of time in defining exactly what’s to be predicted.
    We don’t need to decide how far ahead to predict, as in, “Will the customer cancel
    within three months?” We don’t need to define the extent to which the event *happens*,
    as in, “Will the customer decrease their usage by 80 percent?” And we don’t need
    to consider predicting intermediate actions that occur before the most important
    behavior, as in, “Will the prospective donor agree to a meeting?”


    When defining a detection task, there’s not much room for variation. For example,
    a transaction is either authorized or fraudulent. Specifying the prediction goal
    tends to be simpler.


    On the other hand, projects to predict the future reap the benefits of *big data*
    in a way detection tasks cannot: Model training can *learn from history*. We know
    which customers did or did not buy in the past, which canceled their subscription,
    and which clicked on an ad. This information is already encoded in data that has
    been collected in the normal course of business. This *found data* serves as experience
    from which to'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'learn. In step 4, it will form the basis for preparing the training data that
    fuels the pursuit of the prediction goal we''re establishing in this step.


    In contrast, for detection, the training data must be labeled manually. We don''t
    get to benefit from the “time will tell” nature of found data. Time has told where
    packages tend to be delivered—and that provides learning examples—but we need
    humans to label whether a transaction is fraudulent or whether a medical image
    signifies a positive diagnosis. Because of this, the data needed for training
    detection models is generally more expensive than the data needed for predicting
    future outcomes.


    And yet the human bottleneck for labeled data isn’t always that bad. When we get
    into step 4—prepare the data—we’ll see that, for some detection tasks, although
    human input is required for each label, we don’t need much additional human effort
    beyond what people are already doing anyway in the normal course of commerce.


    # Model Performance: How Well Can We Achieve the Prediction Goal?


    Now that we’ve defined the functional purpose of a model—what it should do—the
    next logical question is, How well does it do it? We’ve established what it should
    predict; now we want to know how well it predicts—and which performance metric
    is the right one to report on. That’s the next chapter’s step. Warning: If you
    were thinking “model accuracy” is the way to go, you’ve got another thing coming.'
