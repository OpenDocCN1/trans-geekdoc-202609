- pgno: 69
  md: '# We will improve operations (using ML).


    By way of illustration, let''s apply this reframing to the stories we''ve covered
    so far—put in the briefest of terms:


    +   We will run a new marketing process to retain customers (using ML to target
    those most at risk of canceling).


    +   We will improve the efficiency of UPS''s package deliveries (using ML to predict
    delivery destinations).


    As a couple more examples, let''s properly frame a credit scoring and a fraud
    detection project:


    +   We will improve our bank''s credit application processing (using ML to predict
    which applicants are most likely to default on their loan).


    +   We will increase our detection of fraudulent transactions without increasing
    the auditors'' workload (using ML to predict which transactions are most likely
    to be fraudulent).


    Reframing ML projects in this way puts the business objective first, rather than
    the technology—and, likewise, it shifts the agency from the technology to the
    business. The first word of the sentence is “we” not “AI,” humans not machines.


    Moreover, this adjustment puts change management squarely on the agenda. Change
    management is a well-established discipline designed to facilitate operational
    shifts—but it can only do so if it’s employed. Many ML projects don’t recognize
    that the notion of change management applies, but model deployment means changing
    the very way the business operates and that change must be proactively managed
    like any other. By viewing the endeavor as an enterprise project rather than a
    technology project, folks will recognize an often-overlooked truth: ML deployment
    presents a challenge that only a change management process can meet.


    # ML Vendors Help, but Enterprises Lead the Industry


    ML software creates potential value, but only a broader enterprise initiative
    can capture that value. An ML project succeeds not only by using an'
