- pgno: 80
  md: 'But Melissa, the director of advertising products at EduPay, didn''t call me
    only to improve the user experience. She wanted to make the company more money.
    The advertisers paid bounties of up to $25 for each lead. If ad response rates
    increased, so would the earnings—even without a single new user or advertiser.


    # The Value Proposition: Defining an ML Application


    Let''s start at the beginning, by which I mean the end. In planning for a successful
    deployment, the first thing Melissa at EduPay did right—even before she called
    me—was to establish the deployment plan, the exact way in which ML would launch.
    This means specifying what would be predicted and the way in which the predictions
    would take effect and improve operations.


    EduPay''s desired business outcome was simple:


    +   Desired business outcome: Increase ad response rates (and therefore revenue).


    But for step 1 of an ML project, you must specify how you will get to that outcome,
    the means to that end. You must declare the way you plan to deploy—first, what
    will be predicted and, second, what will be done about it:


    +   Application: Ad targeting


    +   1. What''s predicted: Will the user respond to this ad?


    +   2. What''s done about it: Display the ad to which the user is most likely
    to respond.


    Since these two ingredients describe the way in which you''re applying ML, they
    specify the ML application, a.k.a. the ML use case. They establish the value proposition
    for a given ML project. The two determine, respectively, what we will do during
    the two culminating steps: step 5, train the model to predict something, and step
    6, deploy the model into the field to drive operations.'
