- pgno: 219
  md: 'model training. Data scientists train the model somewhere else, sparing online
    systems from that burden so that they may continue running smoothly. Those well
    immersed in ML may neglect to make this abundantly clear, but this distinction
    will assuage stakeholders, who are understandably protective of operational systems.
    They will be relieved to hear that there’s no need to strain real-time systems
    that are already handling operations, that the heavy lifting carried out by modeling
    algorithms is kept apart, handled by separate resources allocated to data scientists
    for model development.


    I was pleased to find that EduPay was both capable of and confident about deploying
    my models—they could and they would. But confidence is never literally 100 percent.
    Rather than swapping out the existing ad-selection system entirely, it would be
    safer to start with an incremental step.


    # Mitigating Deployment Risk with a Control Group


    Melissa, the director at EduPay who’d brought me on board, proposed a prudent
    next step: Deployment would start by using the models only half the time. For
    half the users, nothing would change, but the other half would see ads selected
    by the models.


    This is A/B testing, but not the way web marketers usually conceive of it. Typically,
    you set up a head-to-head comparison between two simple options. Color 1 versus
    color 2. Product A versus product B. But in this case the website would compare
    a complex ad-selection method with an even more complex, model-based ad-selection
    method. Data scientists call this a controlled experiment.


    Whatever you call it, this tactic measures how much the new method improves the
    business metrics over the existing legacy method by trying them both simultaneously.
    This is critical since, if you try one for a predetermined time period, stop,
    and then try the other, then you are not controlling for other changes that may
    have taken place in the meantime. You can’t directly control all sorts of factors
    that might make the comparison unfair, such as seasonal shifts, changes in'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'customer trends, or other concurrent operational changes. As a result, even
    if performance improves with deployment, you can only be sure it resulted from
    the model (or models) if you simultaneously track a control group.


    Beyond establishing credit where it is due, a control group serves another critical
    need: mitigating deployment risk. Many things can go wrong when you deploy, resulting
    in performance that is disappointing if not disastrous. After all, any new system
    might have bugs—and in the case of model deployment, you’ve opened yourself up
    not only to logical or programming bugs but also to quantitative bugs, including
    mistakes in the math or misconceptions about the data.


    Fortunately, you can manage this risk as conservatively as you’d like by deploying
    incrementally, just a bit at a time. For example, rather than jumping to Melissa’s
    50/50 champion/challenger runoff, you could start with an even smaller, more incremental
    step by introducing the model-based process only 5 percent of the time. After
    this, as trust increases, grow from there. Along these lines, UPS also started
    with only a partial deployment, initially integrating the system at only a few
    shipping centers.


    Without a control group, it’s all too easy to grant undeserved credit to a model.
    This is a common mistake that’s often made, for example, with direct marketing.
    If a targeted campaign elicits a high response rate, stop and think for a moment
    before you congratulate the marketing manager. It may be that the model is doing
    a great job identifying customers more likely to buy, but that most of them would
    have bought anyway, even if not contacted. In that case, the money spent mailing
    brochures may not have been making an actual impact on sales. A control group
    would avert this pitfall by righting the misconception. If you simultaneously
    observe the purchases made by a control group of customers with whom no contact
    was made, then you have your baseline for comparison.


    For EduPay, the control group provided a critical gauge, since we were moving
    to deployment with a lot of uncertainty. We had no solid method for estimating
    the gain beforehand. We could evaluate'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'individual models, but the combined effect of using all 291 models for each
    ad choice was an unknown before deployment. Improving over the existing legacy
    method was not a sure thing since it was a tough champion to unseat. Even though
    the existing method didn’t personalize ad choices based on the particulars of
    each user, the fact is that you do well by simply serving up the most universally
    popular, high-paying ads that a user hasn’t yet seen. That’s a standard approach
    for online ads. Any time a model-based system goes with a less universally popular
    ad, it takes a risk.


    It’s no wonder that Gary Loveman, when he was at Harrah’s casino—a CEO with a
    PhD in economics from MIT—famously said that he’d fire any employee who runs an
    experiment without a control group just as quickly as one who steals from the
    company.


    After this champion-challenger runoff, the EduPay results came in. In comparison
    to the control group, model-based ads boosted revenue by 3.6 percent, enough to
    aggregate an extra $1 million every nineteen months—and possibly more, if extended
    from interstitial ads to also target those embedded within other web pages. It
    achieved this improvement by sometimes selecting ads that were less universally
    profitable, but that the individual customer was more likely to click on. As a
    result, the overall response rate increased more than revenue did—by 25 percent.
    It’s safe to assume that this higher rate of response meant that the users were
    now experiencing even greater ad relevancy, more often seeing ads that served
    their interests.


    When it comes to large-scale systems, a boost of a few points goes a long way.
    According to McKinsey, “Our research finds that for each $5 billion in credit
    balances a bank originates, an increase of just one percentage point in the predictive
    power of a credit model could reduce losses by up to $10 million within the first
    year alone.”


    # Credit Where Credit Is Due: A Control Group at UPS


    UPS also saw the same potential from a small win. As Jack at UPS put it, “Little
    things matter. If we can just reduce one mile per driver per day'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'in the U.S. alone, we can impact the bottom line by $50 million . . . one minute
    per driver per day is worth $14.6 million.”


    Big or small, Jack needed a win. Having doubled down on deployment training with
    large teams devoted to the task, there was every reason to believe business performance
    would benefit.


    And Jack had a control group against which to compare performance improvements:
    all the UPS shipping centers that hadn’t yet deployed his PFT system. Since deployment
    had started at only a limited number of trial locations—a sample that was considered
    representative of shipping centers in general—the performance at all the other
    sites served as a control.


    Initial signs were good. Within a few months of deployment, it became clear that
    performance had improved by 15 percent over control sites, according to a highly
    visible key performance indicator (KPI) within UPS: stops-per-mile. The more efficiently
    a truck’s route was planned and utilized, the more delivery stops it would make
    for every mile it drove. As stops-per-mile increased, the aggregate miles, gas,
    and driver time needed to fulfill a day’s deliveries decreased.


    PFT flourished, eventually gaining notoriety as a success: It was saving 85 million
    miles annually. The press was ready to congratulate rather than eviscerate. InformationWeek
    even placed the project atop its annual “20 Great Ideas to Steal” list.


    This great gain came from the deployment of the package-prediction model in combination
    with other related improvements, such as centralizing the package-delivery planning
    at each shipping center. Jack informally credits the predictive model itself with
    an estimated 10–25 percent of PFT’s wins, although it is hard to differentiate
    between the contributions of mutually interdependent innovations.


    The rest is history, as already told in this book’s introduction: Jack built ORION
    on top of PFT and convinced the executive Chuck to authorize the system, which
    prescribes turn-by-turn driving routes. The overall efficiency compounded even
    further, ultimately saving the company 185 million miles and 185,000 metric tons
    of emissions every year.'
