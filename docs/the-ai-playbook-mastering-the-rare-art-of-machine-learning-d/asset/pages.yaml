- pgno: 78
  md: '# # 1 Value


    # Establish the Deployment Goal


    In the first step of a machine learning project, you establish the value proposition:
    what the model will predict and how those predictions will improve operations.
    This is the deployment goal, the launch intended to take place as the final project
    step. Your backward planning has begun.


    As with any technology, an ML project must begin with a clear business objective,
    such as “decrease miles driven” or “retain more customers.” But that’s not where
    participation from business stakeholders ends—it’s only where it begins. Business
    considerations also inform several semi-technical aspects of precisely how that
    objective will be pursued by model deployment.


    Beyond helping with the project’s execution, bringing business stakeholders into
    the details also helps greenlight the project in the first place. Since the model
    is meant to seize some degree of control, those in charge must be willing to accept
    some loss of control. To achieve their buy-in, you must offer full transparency
    by ramping them up on the concrete way predictions will drive operational decisions.
    This way, they will come to embrace not only probabilistic thinking, but probabilistic
    doing.


    # The BizML Practice:


    +   1. Value: Establish the deployment goal.

    +   2. Target: Establish the prediction goal.

    +   3. Performance: Establish the evaluation metrics.

    +   4. Fuel: Prepare the data.

    +   5. Algorithm: Train the model.

    +   6. Launch: Deploy the model.'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'As the editor in chief of ITworld, Jodie Naze pronounced advertising “the lifeblood
    of the Internet.” Without it, she wrote, “the Internet would still be an isolated
    plaything for the sole use of the academic elite.”


    When I took a call from the company that was to be my second client, they asked
    me to use machine learning to better target ads—the very ads that provided their
    revenue. This company was in the sure-fire business of giving away money: It was
    the leading search engine for student grants and scholarships. One in three college-bound
    high school seniors signed up to find out what kind of financial aid they were
    eligible for. In this book, I’ll call the company EduPay.


    Users “paid” to use EduPay in the same way you pay for most online content: by
    seeing ads. But these ads were different. First, most were relevant to a student’s
    interests. Some presented ways to cover tuition, such as student loans and military
    recruitment. Others pitched universities. Moreover, EduPay visually integrated
    the ads into the overall user experience. Some ads would even ask for a bit of
    info such as a phone number or intended study year in exchange for connecting
    the user to the sponsor—rather than just begging to be clicked on. As a result,
    many users would not even notice that they were interacting with a paid commercial.


    But there was room for improvement. The current EduPay system didn’t personalize
    ads. It selected them based on overall popularity rather than relevancy, prioritizing
    those with the highest response rates across users. This is a solid and common
    tactic, but it doesn’t select ads based on the user’s individual preferences.


    Personalizing ads with ML nudges up the number of ads that users experience as
    informative. At EduPay, a unique wellspring of data amplified ML’s potential to
    personalize. Their site collected rich profiles when users registered, including
    their backgrounds, interests, and educational plans. This presented just about
    as good an opportunity to target ads as you could hope for.'
