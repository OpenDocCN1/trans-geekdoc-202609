    data scientist, it can also work the other way around. My project pursued a worthy
    business goal, but it served me as well. I got to flex my modeling muscles in
    the name of that pursuit.


    Gay.com’s business goal was one of the most rudimentary of all: Retain more customers.
    After all, a customer saved is a customer earned. It’s a well-known marketing
    rule of thumb that holding on to an existing customer is far more cost effective
    than acquiring a new one “off the street.”


    Prediction makes customer retention possible. If gay.com targeted customers likely
    to leave with marketing contact and that managed to turn around just 5 percent
    of those who would otherwise cancel their paid membership, the company would annually
    gain an estimated $862,000 in customer lifetime value, the additional revenue
    to come from those saved customers.


    Why such great potential? This dating site was for brief flings. On other sites
    populated with relationship-seekers, users were prone to'
