- pgno: 151
  md: 'In order to locate the most useful attributes, feature engineering is a vital
    skill.”


    On the other hand, take care not to load the training data with too many inputs,
    since they don’t come for free. Usama Fayyad, famed as the world’s first chief
    data officer—first at Yahoo! and subsequently at Barclays—emphasizes tying your
    data investment to business value. After all, any and all inputs you include in
    the training data signify a long-term commitment: You’ll need to maintain them
    moving forward for as long as the deployed model remains in play. “Keep the data
    pull narrow so you can justify it . . . and scope the data for only one use case
    at a time,” Fayyad advised during a keynote address at Machine Learning Week.


    But let’s move on to the really big part of this big data: its length. Using data
    from eight months of EduPay’s operations, I had more than 50 million training
    cases (rows). The company had accrued this abundance of experience from which
    to learn because this website was popular. It had witnessed many little episodes
    where a user was shown an ad and then either did or did not respond. And this
    was only for its interstitial ads, where the user was shown a full-page ad to
    either accept or reject before moving on. We didn’t take on the regular, smaller
    ads that were embedded within normal web pages during this project.


    However, this mammoth load actually broke down into 291 smaller training datasets.
    Remember, I was producing 291 models, one per ad—each trained to predict the odds
    that the ad would generate a response if displayed for the user at hand. This
    meant about 170,000 cases per training dataset on average.


    170,000 rows may sound like a lot—but one can’t blithely assume it’s enough.


    # How Big Is Big Enough?


    How much data do you need? Actually, that’s not the right question. What really
    matters is how many positive cases you have, because those'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'are more rare. You need a healthy mix of both positive and negative examples.
    If you have enough positive cases, you''re sure to also have enough negative cases.


    For example, if an ad''s response rate is 1 percent, then 1 percent of the training
    data will be positive cases and the rest negative. In that situation, negative
    cases occur ninety-nine times as often as positive. With 1,000 positive cases,
    we''d have 99,000 negative cases.


    Okay, then how many of those less common positive cases do you need? Often, you''ll
    have thousands or even up into six or seven digits'' worth. But when positive
    cases are very rare or your overall dataset is small, that''s when this question
    arises. Responses to ads are rare. Cases of fraud are even more so, amounting
    to somewhere around 0.1 percent of card transactions.


    This question can only be answered vaguely. For many projects, a few thousand
    positive cases is enough. Even a few hundred may be enough to make a project viable—it''s
    still potentially worth trying. A few dozen usually puts you more into “research
    project” territory. But there are no absolutes here. You never know how well modeling
    will work until you try it. There is no concrete theory that provides an absolute
    answer since the factors at play are just too complex. These include how well
    your inputs (columns) serve the prediction goal, how well the model must perform
    to deliver value—depending on the business context—and just how “difficult” the
    prediction goal is. Some things are easier to predict than others. For example,
    asking the model to predict further into the future is usually harder than predicting
    the more immediate future, in that your model''s performance would likely be lower
    for longer-term prediction.


    Whatever amount of data may suffice to train the model, you actually need a bit
    more than that for the purpose of evaluating the model—you need test data. This
    is a sample of, say, 20 percent of the training data that''s held aside during
    model training. Since it''s not available during the model''s formation, the test
    data serves as a basis to assess how well the model performs in general—in new
    situations that extend beyond the training cases used to develop it.'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'So, despite the mythology about drowning in “too much” data, the real scientific
    challenge comes when you have “small data”—especially when the number of positive
    cases is very small. For example, in healthcare, certain diseases are very rare
    and applicable patient records can be hard to come by. Modeling on very small
    datasets is a rich research area. Studies have been published with impressively
    small counts of positive cases in the training data, yet other such modeling efforts
    just plain fail.


    But for business applications, you often do have enough data—and this is not only
    because of today’s general “data explosion.” The reason is more specific: Large-scale
    operations that are worth the effort to improve are the ones repeated frequently
    and therefore are the ones for which you have accumulated a lot of data. It’s
    an almost self-evident piece of good news: Anything you do a lot generates the
    data you need to improve that very process. The data you need has already grown
    organically in the course of conducting operations. For example, if you regularly
    conduct large direct mail marketing campaigns, you already have the history for
    such campaigns, including who was contacted and whether or not they responded.
    If you issue credit cards, you’ve tracked which customers turned out to be reliable
    debtors and which did not. Many times, ads have been displayed and the response
    recorded. Likewise, many transactions have been approved and the fraudulent ones
    subsequently spotted by unhappy credit card holders. All the main things we do
    are worth improving and are the very things for which we’ve built up experience—that
    is, data—from which to learn.


    Data abundance is a good thing; the more the merrier. So long as the data is representative
    of the kinds of cases that will be given to the model in its deployment, then
    more rows of training data, both positive and negative examples, will only further
    help train the model.


    But even as we gather as much data as possible, the ratio of positive to negative
    cases is usually skewed. The data simply reflects reality: Those all-important
    positive outcomes occur less often. Will the lopsidedness of your data throw things
    off?'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Are Positive Cases Underrepresented?


    Positive cases are usually more important—the reward for predicting them correctly
    is higher, as is the cost for predicting them incorrectly (false negatives—when
    the model has mispredicted a positive case as negative). The biggest wins come
    from identifying those rare customers who will respond to an ad and those rare
    transactions that are fraudulent.


    And yet it’s often negative cases that dominate the training data. Will this mean
    that model training prioritizes negative cases, generating a model that predicts
    better for them than for positive cases?


    The answer is no—this problem has been solved. For some modeling methods, math
    can solve it by applying certain adjustments to the training algorithm that account
    for the imbalance. In other cases, it’s best to reduce the abundance of negative
    cases, by essentially “throwing away” some of them—especially if there’s so much
    data that doing so saves a lot of computing time in exchange for only a negligible
    loss in model performance. But there’s a critical, yet often-overlooked caveat:
    If you do pare down the training data in this way, do not do so to the dataset
    used for testing the model after it’s trained. That test data must retain the
    true, original balance, as it occurs “in the wild.” If not, you begin treading
    on the accuracy fallacy territory we explored in the previous chapter.


    In fact, having fewer positive cases often aligns with having a more valuable
    ML project. When you and your colleagues define the prediction goal—that is, what
    would be valuable for a model to predict, what it means to be a positive case—it’s
    only natural that it occurs somewhat rarely. For example, if the goal is to predict
    which customers will cancel their subscription within three months, you could
    end up with, say, 15 percent positive cases. But if your prediction goal is those
    who will cancel within five years, that’s a more common occurrence— it could be
    half of your current customer base. Knowing that a customer will cancel sometime
    in the next five years is less actionable. It doesn’t clearly mandate any immediate
    response. Instead, knowing'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'that a customer is likely to cancel in the near term more clearly suggests
    immediate action: Invest in retention activities to avert an imminent cancellation.


    As another example, if you''re targeting marketing, you may want to predict highly
    valuable respondents. That is, instead of just predicting who will make any sort
    of purchase, predict rare, special cases, such as who will buy a lot or buy higher-margin
    products. Likewise, for fraud detection, if you predict not any and all fraud
    but specifically more costly cases of fraud, you''ll similarly be focusing the
    model on identifying the fewer, more important cases.


    Not only do rare positives tend to be more valuable—there''s also a cosmetic perk:
    Your model will look more impressive, since it will exhibit a higher lift. If
    an ad''s response rate is 1 percent, the model could realistically flag a small
    group of customers with a lift of 10. That impressive lift of 10 means that, among
    that top portion of users most likely to respond, they do so ten times more than
    average—that is, 10 percent of the time. Last chapter, we calculated the value
    of a fraud detection model with a strikingly high lift of 300. That was only feasible
    given the very low fraud rate of 0.1 percent.


    But if you''re predicting something that happens half the time—for example, which
    customer will cancel within five years—you could never get a lift of 10. That
    would mean ten times the average cancellation rate: 500 percent. The maximum lift
    you could ever hope to report would be 2 and the model''s lift will generally
    be somewhere below that maximum, so you might expect a lift around 1.2 or 1.3.


    Generally speaking, reporting a low lift isn''t as good a look. To seasoned data
    scientists, it isn''t sexy. As it turns out, there''s good reason—for many projects,
    this isn''t only a cosmetic matter. A high lift aligns with high value. After
    all, finding positive cases, say, ten times more often than random guessing, can
    indeed be ten times more valuable to your business, since operations multiply
    their effectiveness that many times over: Auditors find ten times as much fraud
    in the pool of transactions they process; an ad gains ten times as many'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'responses when displayed; and marketing hits ten times as many respondents.


    So if this step, data prep, reveals that your positive cases occur close to half
    of the time, it may be a signal to circle back to step 2 and revisit the prediction
    goal, ensuring you''ve established as valuable a goal as you could.


    But there''s a balance to be struck. If you find that positive cases are too rare,
    leaving you with too small a count in the training data, you must backtrack to
    step 2 just the same—or somehow get more data.


    # It''s about Time: Input Variables


    > Time is the wisest counselor of all.

    > —Pericles


    Preparing the training data is a real ordeal because time matters. You''re setting
    the stage to train a model, which later, when put to work, will input what is
    known at the time and output the odds on what''s to come. This means the values
    you place in the input columns must reflect what was known at an earlier point
    in time than when the output column became known.


    For example, let''s say you pull from company logs that a user who''s now in tenth
    grade responded to an ad one year ago. That serves as a learning case, but you''ve
    got to roll back the clock: This row of training data should show the grade as
    ninth, since that''s what grade they were in when they responded to the ad.


    It''s a similar story when targeting marketing. Behavioral variables meant to
    serve as model inputs need the same kind of TLC. Consider a row of training data
    corresponding to a customer who was sent a marketing brochure last October 18
    and at the time we knew he was male, lived in California, and had made ten purchases
    so far, as well as other factors. By two months later, on December 18, we knew
    that the outcome was positive—he had purchased the product.'
