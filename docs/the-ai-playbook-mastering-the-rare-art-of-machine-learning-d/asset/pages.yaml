    Recall how Jack formulated the paradox that had been holding the company back:


    **The Delivery Paradox:** You can’t optimally plan the truck-loading until you
    know all the deliveries that will need to be made. But by the time you know all
    the deliveries, you’ve run out of time to load the trucks.


    You can only predict your way out of a paradox like this. The same kind of conundrum
    arises for optimizing all kinds of logistics, whether you’re carpooling a bunch
    of kids, any one of whom may call in sick at the last minute; you’re casting big
    stars in a movie, any one of whom could surprisingly say yes just after you’ve
    offered the role to someone less famous; or you’re accepting a new consulting
    client, even though you know that a bigger client opportunity could come tomorrow.
    But these operations are too small for machine learning. Let’s be real: Your kid’s
    carpool probably wouldn’t benefit.


    When applied to large operations, predictions help, even without unrealistic expectations
    as to their precision. When UPS predicts a delivery, it’s presumed without being
    presumptuous. It’s only tentatively treated as a given—just for the purposes of
    loading the trucks. By the time the trucks roll out, all the packages have become
    real—they’ve arrived at the shipping center and wound up on a truck. Any predictions
