  md: 'complex network (which is just a way to visualize a complex formula). And then,
    for each type of structure, the process to train it—to perform modeling—is specialized
    for that structure.


    In some cases, the modeling process has its own name, separate from the type of
    model. For neural networks, the method is backpropagation, which tries the model
    on a training case and, to the degree the output is wrong, propagates negative
    feedback backward through the network, adjusting weights accordingly. By doing
    this repeatedly, the model''s performance improves. Originally developed in the
    1980s, backpropagation still trains today''s more complex and capable neural networks,
    deep neural networks. This method is called deep learning (named in this case
    after the modeling process rather than the model''s structure).


    # Why Are Modeling Methods Also Called Algorithms?


    > What do you call a formula that can predict Al Gore''s dance moves?

    > An Al Gore Rhythm.

    > —Anonymous


    Modeling methods are also called modeling algorithms or ML algorithms—because
    algorithm simply means a process to get something done.


    Algorithm: A well-defined, finite process that solves a problem.


    In the context of ML, algorithm refers to a modeling method, such as decision
    trees or logistic regression. But more generally, algorithms are fundamental to
    the whole of computer science. In practice, the word just means any procedure
    that is defined specifically enough that you could program a computer to do it.
    The word may sound technical, but it''s a simple and intuitive notion.


    The way media has come to use the word algorithm tells us a lot about ML''s elevated
    status. Even though the concept applies for any and all of the many things we
    do with computers, the press uses algorithm as a synonym for ML. It''s like how
    hair stylists use the word product to mean hair product. Or how the word crypto
    usually refers to cryptocurrency even though cryptography applies to securing
    any and all kinds of transactions and communications. When a field gets famous,
    it dominates more than its fair share of vocabulary.'
