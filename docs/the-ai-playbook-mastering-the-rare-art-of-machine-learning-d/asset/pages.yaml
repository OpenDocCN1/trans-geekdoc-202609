  md: 'approximated, imprecisely, with data tracking whether they were arrested again.
    But using “Will the convict be rearrested?” as the prediction goal brings up a
    central ethical issue with predictive policing. Because historically disadvantaged
    groups such as Black Americans are more heavily policed, this unfairly inflates
    the relative frequency of arrests and, as a result, of predicted arrests by a
    model trained for that prediction goal. Similarly, as another example, a widely
    used model for guiding healthcare treatment was trained to predict healthcare
    cost rather than need. Since the data reflected that less had been spent on Black
    patients on average, the model was shown to disadvantage those patients. This
    book’s conclusion surveys other ethical issues that arise with ML’s deployment.


    # Binary Models


    Unlike UPS’s goal for package prediction, response modeling pursues a binary prediction
    goal—it predicts the answer to a yes/no question. This holds for both for the
    simplified goal, “Will the customer buy if contacted?” as well as the more complete
    prediction goal just discussed—and it holds also for the remaining examples in
    this chapter and most of this book. A model trained for a binary prediction goal
    is called a binary model or a binary classifier.


    For most new ML initiatives, binary models are usually the best place to start.
    Most any prediction problem can be framed as binary—to classify which individuals
    do or do not behave in some defined way, such as whether they spend beyond a certain
    amount, default on their credit, click, buy, lie, or die. This applies for detection
    tasks as well: Is this transaction fraudulent? Is this email message spam? Is
    this manufactured item faulty?


    But models can also predict how much or how many, rather than only whether. Such
    models predict the number of purchases, amount expended, magnitude of insurance
    claims, or a customer’s lifetime value, which is the amount of revenue or profit
    expected across a relatively long period of time (an ideal yet sometimes overly
    ambitious prediction goal). These are sometimes called continuous or numerical
    models.


    Binary models hold a couple of significant advantages. First, even though they
    pertain to only two possible outcomes, they estimate where'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'that outcome falls on a continuum of likelihoods. That is, they provide a probability
    for the outcome—how likely is it the customer will buy?—rather than only outputting
    a definitive “yes” or “no.” Since a probability relays the degree of uncertainty,
    it more effectively drives all kinds of decision-making processes, from pricing
    to ad selection to risk management.


    Further, models that predict “how much” tend to be more technically challenging—both
    to develop and to evaluate. For many projects, binary models offer a more straightforward
    approach that avoids introducing unnecessary complexity.


    # Proactively Preventing Bad Outcomes


    Some models aim to predict bad outcomes, in order to intervene before they come
    to fruition. For marketing, this means predicting customer defection so that we
    can target retention efforts most effectively. Enter churn modeling:


    | Application and desired business outcome | What''s predicted (model output)
    | What''s done about it (deployment) |

    | :--- | :--- | :--- |

    | Churn modeling to decrease customer attrition | Will the customer defect if
    not contacted? | Reach out with a retention offer to those most likely to defect.
    |


    But just saying “Let’s predict which customer will defect” omits some crucial
    details. Does the question pertain to all customers, even brand-new ones? Are
    we only predicting explicit quitters, or do we also want to predict those who
    significantly decrease their business with us? And how far ahead are we predicting?


    Even back at my first consulting gig with gay.com, I got this part right. By naively
    selling the modeling piece rather than genuine operational change, I’d killed
    my chances of achieving deployment. But I did recognize the need to carefully
    define the prediction goal so that the model’s outputs could be actionable in
    a business context:'
