    # One Firm’s Firm Approach to the Data Disconnect


    The antidote to the data disconnect? A new connection. Model development and deployment
    must be bound and inseparable. The two have traditionally been handled discretely,
    as isolated steps—conceptually linked yet decoupled in practice—but successful
    leaders seek to unify them so that preparing the data for modeling and engineering
    the inputs for deployment are one and the same.


    But this means asking data scientists to change their habits and to accept some
    new responsibility. Many have grown accustomed to thinking up and implementing
    input variables at will during the model training step—without paying heed to
    how they’ll be made available during deployment. With a focus on developing and
    evaluating models offline, they view engineering as a distinct job, department,
    and mindset. Data scientists often see themselves in the business of prototyping,
    not production.


    Nothing breaks techie habits like executive authority. Enter Gerhard Pilcher,
    the president and CEO of Elder Research, a widely experienced data consulting
    firm with which I’ve collaborated many times. Gerhard has instilled best practices
    across the firm’s client projects that have data scientists collaborating in detail
    with data engineers from the beginning of each modeling effort.


