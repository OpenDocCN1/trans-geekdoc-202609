  img_proc: true
- pgno: 196
  md: 'Melissa,


    I completed a few more rounds of modeling with a different method: Naive Bayes.
    The results are good—here are the takeaways:


    +   - Naive Bayes gives us complete coverage. It would enable us to churn out
    a massive number of models—one per ad—in “one fell swoop” with the push of a button
    and little or no manual “fiddling” for each individual model.

    +   - Naive Bayes did almost as well as decision trees with little “fiddling”
    on my part.

    +   - Naive Bayes is free (I programmed it from scratch).


    Here''s a brief description of how Naive Bayes works: It calculates a predictive
    “degree of evidence” for each input. For example, say a user is in tenth grade
    and is in ROTC and those both provide a degree of positive evidence that the user
    is more likely to respond to the ad. Those degrees of evidence are aggregated
    by simply multiplying them together. There’s some probability theory, but the
    main part is multiplying together the degrees of predictive evidence that correspond
    with the input variables.


    Let''s discuss further!


    —Eric


    Because of its simplicity, Naive Bayes works reliably. It’s robust against overfitting
    because it doesn’t try to draw generalizations from small groups of individuals.
    In contrast, a decision tree drills down to “sub-sub-segments,” such as all tenth-grade
    males who are not US citizens and have Hotmail as their email provider. When you
    look at such a specific group, it may include only a handful of cases. But Naive
    Bayes considers only one input variable at a time, never drilling down to such
    specific, smaller groups.'
  merge: -1
  img_proc: true
