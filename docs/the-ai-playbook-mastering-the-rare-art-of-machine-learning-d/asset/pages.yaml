- pgno: 223
  md: '# The End Is a New Beginning


    "Happy ending" is an oxymoron—if a good thing ends, you''re unhappy. Once you
    deploy a model, you''ve only just begun to reap the benefits. Likewise, you''ve
    also only just begun to maintain the model. To keep it in play and sustain its
    effectiveness, you must monitor and periodically refresh it. Proceed to this book''s
    conclusion for the lowdown on model upkeep, as well as a few other practicalities
    for your ML project: how to sell it, who to enlist for it, how long it takes,
    and how to responsibly manage its societal impact.'
