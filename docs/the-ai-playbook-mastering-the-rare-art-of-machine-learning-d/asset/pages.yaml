    probability for each address is adjusted by an overall forecast. For example,
    if on the whole more deliveries are expected tomorrow than average, then each
    individual destination’s probability is adjusted slightly upward so that the aggregate
    expected count is consistent with the forecast. The effect of this scheme is similar
    to—and has the same simplicity of—a decision'
