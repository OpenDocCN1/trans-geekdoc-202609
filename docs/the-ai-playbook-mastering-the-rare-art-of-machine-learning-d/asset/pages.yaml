    # The Greatest Opportunities Are the Hardest to Tap


    Organizations often fumble the greatest opportunity that ML has to offer: optimizing
    the largest-scale operations. Since they''re often the highest-speed operations,
    they require real-time deployment, which is harder to greenlight. It''s more complex
    and carries greater risk, since it means changing mission-critical, high-speed
    systems.


    As a result, integrating real-time predictive scoring is more rare and cutting-edge
    than many realize. During its formative decades when the ML industry was incubating
    and developing—and building a reputation—most models were deployed not in real
    time but only offline in “batch mode,” for applications that didn’t require real-time
    scoring, such as targeting direct marketing and scoring credit applicants. For
    most ML projects, this is still the case.


    Deploying in real time increases the potential gains—but also the resistance to
    change. It''s only human nature. The larger the scale, the greater the fear. If
    you suggest a plan to enhance operations that are currently flying by at thousands
    of transactions per second, some of your colleagues just might freeze up. Some
    will argue that the company can''t possibly afford the cost of introducing a new
    step to each and every transaction—nor the risk that doing so could slow things
    down.


    But neglecting to move forward incurs a severe opportunity cost and puts the organization''s
    competitive stronghold in jeopardy.


    Back to basics. The six-step practice of bizML overcomes resistance by making
    known what is otherwise a fearful unknown. Only by engaging and ramping up decision
    makers on the end-to-end plan—so that they fully understand both the value and
    the technical feasibility of deployment—can a leader overcome an otherwise costly
    case of analysis paralysis.


    One simple clarification especially greases the wheels for the green light: Runtime
    operations remain unaffected by the heavy lifting of'
