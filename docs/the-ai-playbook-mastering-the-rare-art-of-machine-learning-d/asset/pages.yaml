- pgno: 110
  md: '# 3 Performance


    Establish the Evaluation Metrics


    Once you’ve established _what_ machine learning will predict, the next question
    is _how well_ it predicts. Fortunately, evaluating its performance doesn’t require
    becoming a technical expert, since you can benchmark a model without regard to
    its inner workings. Here, we only judge _how well_ it predicts, not _how_ it predicts.
    It’s only a matter of arithmetic, not “rocket science.”


    Often, you will hear of _accuracy_, a simple tally of how often a model predicts
    correctly. But accuracy is not only the wrong measure for most ML projects; it
    also feeds a common fallacy that tremendously mismanages expectations.


    If not accuracy, then what metric? One is _lift_, a simple multiplier that tells
    you how many times better than guessing your model predicts. Another is _cost_—the
    price of each false positive and the (usually very different) price of each false
    negative.


    Once established, the metrics serve to evaluate both model training (step 5) and
    deployment (step 6). This chapter gets to the heart of the matter. Exactly how
    valuable is imperfect prediction? In what way do all ML deployments serve to triage
    and prioritize? And how do you translate from raw predictive performance to true
    business metrics like profit?


    # The BizML Practice:


    +   1. Value: Establish the deployment goal.


    +   2. Target: Establish the prediction goal.


    +   3. Performance: Establish the evaluation metrics.


    +   4. Fuel: Prepare the data.


    +   5. Algorithm: Train the model.


    +   6. Launch: Deploy the model.'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'Headlines about machine learning promise godlike predictive power. Here are
    four examples:


    +   * Newsweek: “AI Can Tell If You’re Gay: Artificial Intelligence Predicts Sexuality
    from One Photo with Startling Accuracy”

    +   * The Spectator: “Linguistic Analysis Can Accurately Predict Psychosis”

    +   * The Daily Mail: “AI-Powered Scans Can Identify People at Risk of a Fatal
    Heart Attack almost a Decade in Advance . . . with 90% Accuracy”

    +   * The Next Web: “This Scary AI Has Learned How to Pick Out Criminals by Their
    Faces”


    It’s all a lie. ML can’t confidently tell such things about each individual. In
    most cases, these things are too difficult to predict with certainty.


    Here’s how the lie works. First, researchers report high “accuracy,” thereby suggesting—and
    reliably misleading the reader to believe—that their model can identify both positive
    and negative cases and generally be right about it either way. For many prediction
    problems, that level of performance is achievable only in science fiction.


    These reports later reveal—buried within the details of a technical paper—that
    they were misusing the word accuracy to mean another measure of performance related
    to accuracy but in actuality not nearly as impressive as “high accuracy” implies.


    But the press runs with it. Time and again, this scheme succeeds in hoodwinking
    the media, a beast that all too often thrives on hyperbole. This time-honored
    tactic repeatedly generates flagrant publicity stunts that mislead.


    Now, the predictive models they’re reporting on often do deserve high praise.
    The ability to predict better than random guessing, even if not with high confidence
    for many cases, improves all kinds of business processes. That’s paydirt. And,
    in some limited arenas, ML can predict extremely well, such as for recognizing
    objects like traffic lights within'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'photographs or recognizing the presence of certain diseases from medi-cal images.


    But many human behaviors defy reliable prediction. Predicting them is like trying
    to predict the weather many weeks in advance. There''s no achieving consistently
    high certainty. There''s no magic crystal ball.


    # Stanford’s “Gaydar” Doesn’t Perform at Face Value


    Take the hype surrounding Stanford University’s infamous “gaydar” study. In its
    opening summary (the abstract), a paper published in 2018 by researchers Michal
    Kosinski and Yilun Wang claims their predictive model achieves 91 percent accuracy
    in distinguishing between gay and straight males from facial images. This inspired
    journalists to broadcast grossly exaggerated claims of predictive performance.
    One Newsweek article kicked off with, “AI can now tell whether you are gay or
    straight simply by analyzing a picture of your face.” The front cover of the Economist
    depicted a face looking like a fingerprint along with, “What machines can tell
    from your face.”


    This resulting deceptive media coverage is to be expected. The researchers’ opening
    claim of 91 percent accuracy tacitly and inevitably conveys—to lay readers, non-technical
    journalists, and even casual technical readers—that the system can tell who’s
    gay and who isn’t and generally be correct about it for both categories.


    But that assertion is false. The model can’t confidently “tell” for any given
    individual in general. Instead, what Stanford’s model can do 91 percent of the
    time is much less remarkable: It can identify which of a pair of two males is
    gay when it’s already been established that one is and one is not.


    This benchmark—which I call the pairing test—can sound like a compelling story,
    but it’s a deceptive one. At first, it may look like a reasonable indication of
    a predictive model’s performance, since the test creates a level playing field
    where each case has 50/50 odds. And, indeed, the result of this test does confirm
    that the model performs better than random guessing. Most data scientists know
    the pairing test by'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'a more technical name, AUC (Area Under the receiver operating characteristic
    Curve). And yet most data scientists, in my experience, haven''t come to realize
    that the two metrics are one and the same. AUC is mathematically equal to the
    performance observed running the pairing test (assuming you run it enough times).
    They''re just two different ways to estimate the same number. Although AUC is
    quite popular among data scientists, its technical details fall outside the scope
    of this book. But since the pairing test is easier to understand and is an equivalent
    measure, that''s the term I''ll use in this chapter.


    But the model''s ability to get the pairing test right 91 percent of the time
    translates to low performance outside the research lab, where there''s no contrived
    scenario presenting such pairings. In the real world, employing the model would
    require navigating a tricky trade-off. For example, you could tune the model to
    correctly identify two thirds of all gay individuals, but it would also wrongly
    identify others as gay, errors known as *false positives*. In fact, it would commit
    many such errors, predicting incorrectly more than half the time it predicted
    someone to be gay! And if you configured its settings so that it correctly identified
    even more than two thirds, the model would exhibit such errors even more often.


    This is because one of the two categories is infrequent—in this case, gay individuals,
    which amount to about 7 percent of the general population of males (going by the
    stats the Stanford study cites). When one category is in the minority, that intrinsically
    makes it more challenging to predict.


    Besides, accuracy isn''t a helpful benchmark here in the first place. Accuracy
    only tells you how often the model is correct.


    **Accuracy**: The proportion of cases a predictive model predicts correctly, that
    is, how often the model is correct.


    For this project, it would mean nothing to achieve a bedazzling accuracy of 93
    percent: Just classify everyone as straight. By doing so, you''re correct 93 percent
    of the time, even though you fail to correctly distinguish anyone in the minority,
    the 7 percent who are gay. To improve'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'upon this and correctly identify at least some of the minority cases would
    require trade-offs: the introduction of false positives and, in general, a lower
    overall accuracy.


    The Stanford model succeeded to a certain degree—it could predict better than
    guessing—but then the researchers misrepresented its performance on the pairing
    test by calling it “accuracy.” Voila! Journalists and their readers believe the
    model can “tell” whether you’re gay or straight.


    Some things are too hard to reliably predict. “Gaydar” as a popular notion refers
    to an unattainable form of human clairvoyance. We shouldn’t expect ML to attain
    supernatural abilities either.


    # Accuracy: A Word So Often Used Inaccurately


    The Stanford study is a perfect example of a common misstep that I call the accuracy
    fallacy, which greatly exaggerates ML’s performance across domains. It leads the
    public to falsely believe that the system can achieve an unrealistic, “crystal-ball”
    level of performance—specifically, that it can distinguish positive and negative
    cases and generally be correct for both positive and negative cases. That’s just
    not feasible for many noteworthy prediction goals. Since many important behaviors—such
    as whether you’ll click, buy, lie, or die—tend to occur more rarely, they’re particularly
    difficult to predict. No model could “tell” such things with high reliability
    in general.


    In some cases, researchers perpetrate a variation on the accuracy fallacy: They
    report the classification accuracy you would get if half the cases were positive.
    For example, Emory and Harvard universities reported on a model that predicts
    the onset of psychosis with “90 percent accuracy,” as evaluated on data from a
    world where 50 percent of patients are eventually diagnosed with psychosis. There’s
    a word for measuring accuracy in this way: cheating. Mathematically, this usually
    inflates the reported “accuracy” a bit less than the pairing test, but it’s a
    similar maneuver and far overstates performance in much the same way.'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'The accuracy fallacy scheme is applied far and wide, in reports about predicting
    criminality, suicide, job resignations, bestselling books, deep fakes, tsunamis,
    and heart attacks. This list continues on to be breathtakingly long. For my extended
    coverage of the accuracy fallacy, see this chapter’s notes at www.bizML.com.


    Reviewing these projects spotlights both good and bad sides of the ML industry.
    The studies each misrepresent predictive performance, but, collectively, they
    illustrate ML’s wide, cross-industry applicability. Many of them are otherwise
    legitimate projects, having generated a sound, potentially valuable model. The
    only problem is in how they misleadingly convey the predictive performance that
    the model achieves.


    The accuracy fallacy contributes to AI hype. By conveying inflated performance
    levels and referring to the technology as AI rather than ML, researchers exploit—and
    simultaneously feed into—the public’s fascination with awesome yet fictional powers.


    The responsibility falls, first, on the researcher and second, on the journalists
    to communicate unambiguously and unmisleadingly to journalists and second, on
    the journalists to make sure they and their readers understand the predictive
    proficiency they’re reporting. But given current circumstances, we must all hone
    a certain vigilance: Be wary about claims of “high accuracy” in ML. If it sounds
    too good to be true, it probably is.


    # The Bad Rap of Imperfect Prediction


    As we rightly take down overblown claims of fantastical prediction, others wrongly
    take down some of the most astute, albeit imperfect, forecasting. Clear-headed
    quants who forthrightly communicate the limits of their model nevertheless face
    a threat to their reputation by reactionary misinterpretation.


    Take the famous political election quant Nate Silver. Despite the impressive track
    record of his political forecasts, pundits crucified him after Donald Trump defeated
    Hillary Clinton in 2016 for the US presidency. Silver’s election forecast had
    put about 70 percent odds on it going'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'the other way. As the Harvard Gazette put it, “Stunned political pundits blamed
    pollsters and forecasters, proclaiming ‘the death of data.’”


    But that’s simply unfair and unjustified. “70 percent” does not mean Clinton will
    clearly win. And a 30 percent chance of Trump winning isn’t a long shot at all.
    Something that happens 30 percent of the time is pretty common and normal. And
    that’s what a probability is. It means that, in a situation just like this, it
    will happen 30 out of 100 times, or 3 out of 10 times. Those aren’t long odds.


    Unless you’re posing as a soothsayer, relaying uncertainty isn’t a sin—rather,
    it’s often a virtue. Clinton’s 70 percent probability was closer to a 50/50 toss-up
    than a 100 percent “sure thing.” The takeaway from a 70 percent forecast for Clinton
    isn’t that she’s pretty much a shoe-in. No, the take-away is, “I don’t know.”
    At the time, most other prominent forecasts put Clinton’s chances much higher—between
    92 and 99 percent. Those models exhibited overconfidence. Silver’s model didn’t
    strongly commit. It expressed, first and foremost, uncertainty. But, unfortunately
    for him, his model’s probability was widely misinterpreted as a definitive prediction,
    as if he’d made an absolute call.


    # Forcing Your Hand


    Being noncommittal is often prudent. Silver’s best defense against public misapprehension
    might be to simply abstain when there’s a fair amount of uncertainty and to only
    disclose his prediction when a candidate’s probability is very high.


    But for many deployments of ML, it has got to commit even when the prediction
    is uncertain. It must land on yes/no decisions—over and over again. Who should
    we market to? Those predicted to buy. Who should we approve for a credit card?
    Those predicted to always pay their bill. As we’ll see later in the chapter on
    deployment, the mapping from prediction to action isn’t always quite that simple,
    but, ultimately, predictions drive operational decisions, and the decision at
    hand is often binary.


    This sounds like a recipe for disaster. We know that, when it makes committed
    predictions, ML generally doesn’t achieve performance'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'anywhere in the vicinity of perfection. We know that high accuracy isn’t even
    the right objective. And we know the price Nate Silver paid. Happily, the game
    ML plays is more fortuitous than the game Nate Silver plays, the game of singular,
    one-off election forecasts where each receives public scrutiny. ML repeatedly
    predicts, affecting a tremendous number of operational decisions and accumulating
    a track record along the way.


    # The Value of Imperfect Prediction


    > All models are wrong but some are useful.

    > —Famed statistics professor George Box


    With the act of repeated, frequent prediction comes great news: For many applications
    of ML, getting a good number of predictions wrong is totally okay. So long as
    it predicts better than pure guesswork, that’s often more than sufficient to improve
    large-scale operations and boost the bottom line. I call this the Prediction Effect
    (introduced in my previous book, Predictive Analytics):


    The Prediction Effect: A little prediction goes a long way. The law of large numbers
    is on our side; predicting better than guessing is generally more than sufficient—when
    applied across many predictions—to deliver value.


    In deploying ML, we enjoy the security of a numbers game that’s much more reliable
    than a single forecast, any one of which is so easy to get wrong. Will the economy
    go up or down next quarter? Will we hit our sales quota next month?


    In its business deployment, ML drives many repeated operational decisions. By
    playing the odds over time, the overall performance pans out well as the model’s
    predictions improve organizational efficiency. Your project isn’t evaluated by
    any one case—you need not fret over individual missteps.'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'Okay, so a model''s potentially good enough to be valuable, but exactly how
    good? How do we measure and report on predictive performance? Having blasted accuracy
    as impertinent and often misleading, what''s the right metric?


    # Lift: A Meaningful Measure of Performance


    To measure predictive performance in a meaningful way, you''ve got to differentiate
    between positive and negative cases. Accuracy doesn''t do this. It simply reports,
    “How often is the model correct?”—across positive and negative cases alike. Since
    it doesn''t differentiate, it generally fails to report on performance in a useful
    way. A bad model can look good. For example, if only 1 percent of the customers
    buy, a model that predicts “no” for every customer achieves 99 percent accuracy
    but fails to correctly predict any positive case—that is, any customer who is
    going to buy.


    To remedy this, a common approach is to measure how often the model correctly
    identifies positive cases in particular. For targeted marketing, for example,
    this means we measure how often the campaign will contact the right customers—those
    who will buy. For most projects, positive signifies the less frequent class—which
    is typically the one that is more valuable to correctly identify—such as customers
    who will cancel, debtors who will default, medical images that signify the presence
    of a disease, or patients who will experience a heart attack.


    More specifically, we want to know how much more often the model identifies positive
    cases in comparison to just guessing. There may not be many positive cases—say,
    only 1 percent of customers will buy in response to marketing. Can a model identify
    a “hot pocket” significantly richer in respondents? If the model picks out a group
    who buy 3 percent of the time, then it has improved over randomly selecting by
    a factor of three. This is known as a lift of three. That sounds like a good group
    to market to.


    Wait a minute—that model is hardly better than a blindfolded monkey shooting darts.
    Its predictions aren''t very confident. Among the'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'customers it identifies for marketing contact, only 3 percent end up buying.
    It doesn’t have high confidence regarding any one customer who will respond. It
    can never proclaim, “This customer will almost definitely buy.”


    But improving prediction just this small amount goes a long way. Predicting three
    times as well as guessing can *more than triple profit*. Let’s say the model has
    made these positive predictions for 25 percent of customers—that is, the group
    that it has targeted for contact makes up a quarter of the overall population.
    This could multiply profit by more than five, as in the example covered in the
    following sidebar.


    # The Profit of Response Modeling


    For one example scenario, here’s some back-of-the-napkin arithmetic that shows
    how a lift of three translates to profit multiplying more than five times over.


    +   Number of customers: 1,000,000

    +   Cost per contact: $2

    +   Profit per purchase: $220

    +   Number of customers who purchase: 1 percent


    Profit without a predictive model—mass marketing to all the customers:


    ```

    Overall profit = revenue – cost

    = ($220 x 10,000 responses) – ($2 x 1 million)

    = $200,000

    ```


    Profit of marketing to (only) 25 percent of the customers, with a lift of three—targeted
    with a predictive model:


    +   Number of customers: 250,000

    +   Cost per contact: $2

    +   Profit per purchase: $220

    +   Number of customers who purchase: 3 percent


    ```

    Overall profit = revenue – cost

    = ($220 x 7,500 responses) – ($2 x 250,000)

    = $1,150,000

    ```'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'Given the clear benefit of achieving a certain lift, let’s define it properly:


    **Lift:** A multiplier: How many times more often positive cases appear within
    a group identified by a predictive model, in comparison with how often they appear
    in general.


    Lift captures the multiplicative improvement to operations, the increased return
    for your efforts, how much more bang you get for your buck. With a lift of three,
    marketing to the targeted group will be three times as effective. Auditing the
    flagged group of transactions will find three times as much fraud. Examining the
    demarcated patients will find three times as many positive diagnoses. In this
    way, lift quantifies a model’s contribution, even for models that aren’t highly
    confident or anywhere in the vicinity of a magic crystal ball.


    Lift reflects a limitation intrinsic to every model: It predicts less confidently
    as you target larger groups. The more cases it predicts as positive, the lower
    the lift will tend to be. Lift is always measured in relation to the group that’s
    been targeted by the model. In the response modeling example, the model achieved
    a lift of three for one quarter of the overall population—the 25 percent predicted
    most likely to buy. If you went further and took one half, the 50 percent predicted
    most likely to buy, the lift would be lower since this group includes individuals
    who didn’t make the top 25 percent.


    Alternatively, the model could achieve a higher lift if it were used to identify
    a smaller, more select portion of the population. For example, a model might achieve
    a lift of 20 for the top 1 percent of the population. But there’s a downside to
    targeting only such a small group: In exchange for more confident predictions,
    you end up with a much smaller pool of prospects—for marketing, this means a smaller
    number of potential buyers to market to.


    # **Even a Little Lift Helps a Lot**


    Sometimes it makes sense to target a larger group despite that meaning a lower
    lift. Let’s turn to credit scoring, where the model predicts'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'whether a credit applicant will default on their loan. Suppose 10 percent of
    applicants will ultimately default and your model attains a lift of 1.7 at 50
    percent. That is, it identifies a full half of the population of applicants who
    are 1.7 times as likely as average to default—that is, 70 percent more likely
    than average. In this case, the targeted half has a 17 percent likelihood of defaulting.


    Seventeen percent might not seem like the worst risk in the world—but it''s high
    in comparison to the other, less risky half, which defaults at a rate of only
    3 percent. How''d we get to 3 percent? The arithmetic is simple: The two halves
    must average to an overall 10 percent default rate. Since that''s the average
    of 17 and 3, we know that the less risky group must have a 3 percent default rate.


    What a world of difference! Translating this into profit drives it home—the following
    sidebar shows that we can choose between winning or losing hundreds of millions
    of dollars.


    # The Profit of Credit Scoring


    Number of loan applicants: 1,000,000

    Average loss from a defaulting debtor: $5,000

    Average gain from a repaying debtor: $500


    The model predicts half the applicants to be high-risk, with a 17 percent default
    rate, and the other half to be low-risk, with a 3 percent default rate.


    **If you approve high-risk applicants:**


    Gain = 83% x 500,000 x $500 = $207.5M

    Loss = 17% x 500,000 x $5,000 = $425M

    Profit = gain - loss = -$217.5M (a loss)


    **If you approve low-risk applicants:**


    Gain = 97% x 500,000 x $500 = $242.5M

    Loss = 3% x 500,000 x $5,000 = $75M

    Profit = gain - loss = $167.5M (a profit)'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'Lift applies universally, across ML applications. No matter what you’re using
    ML for, lift serves as a fundamental, cross-disciplinary metric to report on a
    model’s pure predictive performance. It provides a straightforward reading on
    how well the model can identify individuals relatively more likely to behave in
    a certain way.


    But lift can only be calculated for a model once the model has targeted a group.
    This means it must commit to yes/no predictions that determine which individuals
    do and which don’t belong in the group. Calculating lift—as well as profit—is
    possible only in relation to such a group. However, a raw model doesn’t commit.
    For each individual, it outputs a probabilistic score that ranges across the spectrum
    of 0 to 100 percent. So, to determine who belongs in the targeted group, a threshold
    must be established in order to commit to a decision for each individual. Individuals
    with scores above the threshold belong in the targeted group. So where do you
    draw that line?


    # An Illustrative Example: How Big Is Your TV?


    When I teach lift in the classroom, I get everyone to stand up and be the data.
    Each person holds up a piece of paper with the size of the largest TV in their
    home and the group arranges itself into a row ordered by TV size:


    ![](img/99a58a0ea5f8204f7fbf446f6593fd4f_122_0.png)


    People in order of their TV size (a zero means they have no TV). Those with a
    raised hand are subscribed to HBO.


    Then I ask a question related to TV usage, such as, “Who has a subscription to
    HBO?” Not forgetting to thoroughly define the prediction goal, my question is
    actually more precise: “Who lives in a household that not only uses but pays for
    a subscription to HBO or Max?”'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'As you can see, the positive cases are more concentrated within the top portion—the
    left side—of this “human dataset.” Let’s calculate the lift for the top portion.
    Overall, 32 percent of the individuals have HBO (12 of the 38). But among the
    top ten, it’s 70 percent. That’s a lift of 2.2: That top portion has 2.2 times
    as many positive cases as the overall population.


    Now, this classroom exercise oversimplifies in a couple ways. It’s a comically
    small dataset, so the results are far from reliable. And the predictions are based
    on one and only one variable: TV size (that’s what we call a univariate model).
    Plus, the scores aren’t scaled to be probabilities, although they do serve to
    rank-order and calculate lift just the same. Despite these caveats, the visual
    effect and sample arithmetic illustrate the concepts for teaching purposes.


    Why did I calculate lift for the top ten rather than, say, the top twenty? The
    answer is pragmatic. Perhaps I only have a marketing budget to contact that many.
    Or perhaps it’s only worth marketing my product where the HBO subscription rate
    is at least 70 percent. Let’s move on to some more realistic examples to explore
    further.


    # To Deploy ML Is to Triage and Prioritize


    This story is the same for a large-scale modeling project: Cases more likely to
    be positive—and therefore more deserving of attention—rank more highly.


    Instead of those thirty-eight people in a classroom, say we have a list of 100,000
    customers. Here are the first four:


    | Name: | Model score: | Buy: |

    |---|---|---|

    | E. Siegel | 85.628% | Yes |

    | G. Clooney | 85.626% | No |

    | T. Mitchell | 85.625% | Yes |

    | T. Bayes | 85.623% | Yes |

    | ... | | |'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'The model has scored each individual and we’ve ordered the list based on that
    score. The first one has a score of 85.628 percent. For response modeling, that
    would mean the model has calculated that as the probability they will buy if contacted—which
    would be quite a high probability, considering marketing campaigns tend to have
    very low response rates overall, in the single digits or even only a fraction
    of a percent.


    Next, let’s look at only the rightmost column, whether the case is positive or
    negative (yes or no). To show more, here are that column’s values for the top
    100 cases, showing the positive cases as a 1 and negative cases as a 0:


    ```

    101111111101111011110011111101111101111101111111111111101111

    1100111111101111111011110111111001110111111011010111

    ```


    From a glance you can see just how dense with 1s this highly ranked portion is.
    The frequency of 1s doesn’t necessarily decrease as you go through this list of
    100, since this is only a small portion of a much longer list. But if we pulled
    out the 100 customers that are halfway down the list, we’d get a much different
    picture, with a more balanced mix of positive and negative cases:


    ```

    101101000101101011100010001011110111100000110101110100

    1101101001000101110110101000101101110101011011110000

    ```


    And then the very final 100 would be mostly negative cases:


    ```

    110000000010100100001000000010000000001000010000001000

    00110000000100100001000011000010000100001000010000100

    ```


    The same overall trend occurs across this long list as with the small set of students
    with TV sizes: Many positive cases appear early in the ranking, decreasing down
    to only small numbers at the end of the list.


    A model achieves this same valuable effect across all kinds of ML applications.
    Its predictive scores serve to rank individuals so that the top portion is denser
    with positive cases and the bottom portion sees far fewer positive cases.'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'By ranking individuals, ML empowers the organization to triage and prioritize.
    Contact customers more likely to buy. Expend retention efforts on customers more
    likely to leave. Manually audit transactions more likely to be fraudulent. Inspect
    buildings more likely to catch fire.


    This concept extends naturally to Internet search. It''s the antidote to information
    overload. Google does you the favor of using ML to place an unwieldy number of
    items into a meaningful order. Facebook does too, ordering its Feed by predicting
    which of the many items your contacts have recently posted will be most of interest
    to you. Airbnb and Match.com follow suit, helping you sort through an oversupply
    of prospects, be they rental properties or romantic partners.


    Of course, this also applies for the most literal of triage, medical triage. Tend
    first to patients scored by a model as more likely to decline in health or more
    likely to have a positive diagnosis. Reexamine patients predicted as more likely
    to be readmitted within the next year. Reach out to patients more likely to skip
    a prescribed medication or healthcare appointment.


    In all cases, the model proactively targets according to risk or opportunity.
    It earmarks the individuals with the highest risk or potential gain—those worthy
    of investing limited time and resources.


    # Drawing a Profit Curve


    The ranked list tells us where to draw the line—where to set the threshold—for
    driving a yes/no operational decision. Consider the decision as to whether to
    contact each customer with a marketing outreach. You can see the profit accumulated
    as we send a promotional brochure to customers, from most likely to buy down to
    least likely.'
