- pgno: 52
  md: 'stick it out (until eventually finding a partner and canceling, after which
    there was little chance of winning them back). With gay.com, up to 80 percent
    of paying members were canceling before their next auto-renewal. I saw that behavior
    in the numbers, but at first I was clueless about why. As I crunched data behind
    the scenes, I was removed from the website’s look and feel. I knew it catered
