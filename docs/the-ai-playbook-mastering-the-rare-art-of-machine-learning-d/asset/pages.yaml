  md: '# # About the Author


    Eric Siegel, PhD, is a leading consultant and former Columbia University professor
    who helps companies deploy machine learning. He is the founder of the long-running
    Machine Learning Week conference series, the instructor of the acclaimed online
    course “Machine Learning Leadership and Practice—End-to-End Mastery,” executive
    editor of the *Machine Learning Times*, and a frequent keynote speaker. He wrote
    the bestselling *Predictive Analytics: The Power to Predict Who Will Click, Buy,
    Lie, or Die*, which has been used in courses at hundreds of universities. Eric’s
    interdisciplinary work bridges the stubborn technology/business gap. At Columbia,
    he won the Distinguished Faculty award when teaching the graduate *computer science*
    courses in ML and AI. Later, he served as a *business school* professor at UVA
    Darden. Eric also publishes op-eds on analytics and social justice.


    Eric has appeared on Bloomberg TV and Radio, BNN (Canada), Israel National Radio,
    National Geographic Breakthrough, NPR Marketplace, Radio National (Australia),
    and TheStreet. Eric and his previous book have been featured in *Big Think*, *Businessweek*,
    *CBS MoneyWatch*, *Contagious Magazine*, the *European Business Review*, the *Financial
    Times*, *Forbes*, *Fortune*, *GQ*, *Harvard Business Review*, *Huffington Post*,
    the *New York Review of Books*, the *New York Times*, *Newsweek*, *Quartz*, *Salon*,
    the *San Francisco Chronicle*, *Scientific American*, the *Seattle Post-Intelligencer*,
    the *Wall Street Journal*, the *Washington Post*, and *WSJ MarketWatch*.


    +   - Eric Siegel is available for select lectures. To inquire: www.MachineLearningKeynote.com


    +   - Attend the conference founded by the author: www.MachineLearningWeek.com


    +   - Access the author’s online course: www.MachineLearning.courses


    +   - Follow the author: @predictanalytic or www.linkedin.com/in/predictiveanalytics'
