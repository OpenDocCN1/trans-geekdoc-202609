    # To which ML tools and software does this book apply?


    This book pertains to all ML software. It is vendor-neutral and tool-agnostic.
    The contents apply universally, regardless of which of the many ML software tools
    you or your data professionals may end up using.


    # Is this book about supervised or unsupervised machine learning?


    This book only covers supervised machine learning, which trains models over supervised
    data, that is, data that consists of examples for which the target prediction
    is already known—either by way of accumulating historical outcomes or manually
    labeling the data (more specifically, the book mostly focuses on binary classification,
    that is, ML for predicting yes/no outcomes). Supervised ML is the kind of ML most
    commonly applied to optimize business operations. However, the bizML practice
    presented in this book largely holds for unsupervised learning projects as well.'
