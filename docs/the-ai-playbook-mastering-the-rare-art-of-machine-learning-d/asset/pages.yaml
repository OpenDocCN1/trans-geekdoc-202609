    when architecting for deployment.


    The problem stems from the *data disconnect*, an abominable divide between model
    development and deployment. When preparing the training data, the data scientist
    is typically focused only on incubating a model and ensuring that it performs
    well in “the lab.” To that end, they set up the input variables—positioned as
    columns in the training data—in whatever ad hoc manner is most convenient.


    This leaves a formidable challenge for deployment. The system housing the model
    will need to recreate the variables exactly as the data scientist set them up
    during development, mimicking the form and format they held within the data scientist’s
    system or within the ML software, both of which are typically foreign to the engineers.


    In that endeavor, every detail matters. For example, my EduPay models took the
    email domain as input. Should it be a string of characters like “yahoo” or “gmail”?
    Or should it also include the “.com”? Must it be all lowercase? Should Boolean
    variables like “US citizen—yes or no” or “Has opted in for marketing email—yes
    or no” be represented as 1 and 0, “yes” and “no,” or “Y” and “N”? How do you represent
    a value that’s simply unknown, a.k.a. a *missing value*—is it the word “NULL,”
    an empty string, a negative one (–1), or something else? How do you calculate
