- pgno: 61
  md: 'Ramp up on a semi-technical—yet accessible—side of ML. Before their involvement
    in an ML project, all professionals must gain some rare background knowledge,
    familiarity with a collection of accessible ML fundamentals. Surprisingly, some
    of them are seldom known even by data scientists. Chapters 1 through 6 of this
    book cover these fundamentals while stepping through the ML business practice.


    Mandate deep collaboration between business professionals and data scientists.
    These two very different “species” must team up to execute each project step in
    order to achieve deployment. After all, deployment means radical change to existing
    operations. You can’t assume that the decision makers will buy in easily. To keep
    things on track and grease the wheels for operationalization, business-side stakeholders
    must be enlisted to deeply collaborate with data scientists and weigh in at each
    project step, end to end. This includes defining performance goals, preparing
    the data, and developing and deploying the predictive model.


    Plan ML projects backward. In the first step of that collaboration, before modeling
    begins, start with the end goal: precisely how ML will be deployed to improve
    operations. Stakeholders must approve the way in which the probabilities calculated
    by a model will change business processes in order to improve them. Only by declaring
    this up front does an ML initiative stand a chance of achieving successful deployment.
    This “backward” strategy is a simple and yet surprisingly underutilized trick
    of the trade.


    To embody these three guidelines, a knowledgeable team must collaboratively follow
    an end-to-end practice that begins by backward planning for the end. I call this
    practice bizML and it consists of the following steps.


    # The six steps of bizML:


    +   1. Value: Establish the deployment goal. This step defines the business value
    proposition: how ML will affect operations in order to improve them by way of
    the final step, model deployment.'
