- pgno: 180
  md: 'This example linear model—which involves only three input variables—assumes
    that the email-opt-in and in-college variables have the value 1 when true and
    0 when false.


    In this case, the job of the modeling method is to adjust those three weights,
    tweaking them until the model does as well as possible on the training data. It’s
    unlikely to do especially well; this old-school, standard statistical method has
    become overshadowed by modern modeling methods.


    However, linear models serve as the basis for other methods. One such method,
    which is very popular, is logistic regression, which is simply a linear model
    followed by a nonlinear transformation known as an S-curve or sigmoid function.
    This extra step “stretches” predictive scores in the mid-range to be closer to
    100 percent or 0 percent probabilities, in effect trying to get the model to commit
    to more definitive “yes” or “no” predictions. This turns out to do a better job
    for many yes/no prediction goals (a.k.a. binary classification) than a plain linear
    model.


    Now, if you’re not a data scientist, you might wish you could skip over these
    technical details for the most part. Allow me to grant your wish.


    # Everything You Need to Know about Modeling Methods


    Before we briefly survey several more modeling methods, let’s get one thing clear:
    As vastly different as they may seem to be from one another, all models accomplish
    the same simple task: They take the inputs and output a predictive score. That’s
    literally the definition:


    Predictive model: A mechanism that predicts a behavior or outcome for an individual,
    such as click, buy, lie, or die. It takes characteristics of the individual as
    input (input variables) and provides a predictive score as output, usually in
    the form of a probability. The higher the score, the more likely it is that the
    individual will exhibit the predicted behavior.


    Since the model is generated by ML, we say it’s the thing that’s “learned” or
    “trained.” Because of this, ML is also known as predictive modeling.'
