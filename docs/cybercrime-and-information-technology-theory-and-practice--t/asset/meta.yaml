  - 3. (3) 法定损害赔偿。——(A) 在最终判决作出前的任何时间，原告可选择就每项违反第 1201 节的行为，判赔法院认为公平的不低于 200 美元且不超过
    2,500 美元的法定损害赔偿，每项规避行为、设备、产品、组件、要约或服务履行均按此计算。
- - '####'
  - 4. (4) 重复违规。——在任何受损方承担举证责任，且法院认定某人在针对其另一此类违规行为作出最终判决后三年内违反第 1201 节或第 1202 节的情况下，法院可根据其认为公平的情况，将损害赔偿增加至原本应判赔金额的三倍。
- - '####'
  - '5. (5) 无过错违规。—— '
