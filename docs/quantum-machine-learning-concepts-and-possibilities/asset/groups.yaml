    \n在 Deutsch-Jozsa 算法中，算谕 $U_f$ 编码了一个*黑盒*函数 $f: [0, 1]^n \\to [0, 1]$。在物理上，它是一个相干地查询该函数的酉变换，这意味着由于量子叠加，它同时在所有可能的输入\
    \ $x$ 上评估 $f(x)$。算谕作用于两个量子寄存器：\n\n```\n$|x\\rangle\n```\n\n其中 $x$ 是持有函数参数的 $n$\
    \ 位输入，$y$ 是存储结果的比特寄存器。符号 $\\oplus$ 表示模 2 加法。\n\n在此映射中，第一个寄存器 $|x\\rangle$ 保持不变，而仅当\
    \ $f(x) =1$ 时，第二个寄存器会被翻转。这种控制翻转可以被解释为经典逻辑门的可逆实现。例如，当 $f(x)$ 对应于布尔表达式时，$U_f$ 的作用类似于经典电路的量子版本，能够在不破坏叠加态的情况下计算\
