    selecting a hypothesis class—such as neural networks (NNs)—and optimizing the
    parameters of a model to minimize some notion of loss or error respect to training
    data.


    A standard distinction is drawn between supervised and unsupervised learning.
    In supervised learning, the model is trained on labeled examples, where the goal
    is to generalize beyond the observed inputs to correctly predict unseen outcomes.
