    # # Introduction


    # ## 1.1 Motivation and scope


    The accelerating development of quantum technologies has opened new frontiers
    in computation, communication, and sensing. Among the most promising direction
    is **quantum machine learning (QML)**.


    QML aims to explore whether and how quantum resources can enhance learning tasks,
    improve model expressivity, or accelerate training and inference. It combines
    the principles of quantum mechanics and machine learning to explore new ways of
    processing, analyzing, and generating data.


    This book introduces the core ideas, algorithms, and challenges in *QML*, presenting
    both theoretical foundations and practical applications tailored for current and
    near-term quantum devices. The text is structured to serve as a *self-contained
    textbook*, suitable for graduate students or researchers with a working knowledge
    of quantum computing and a general background in classical machine learning.


    Quantum speedup in learning


    QML is motivated by the potential for *computational speedups* over classical
    algorithms [1]. But what ‘speedup’ mean in general? In a quantum algorithm exhibits
    *quantum speedup* when it solves a problem with lower resource usage (e.g. time,
    queries, or samples) than any known algorithm [2]. These speedups can take various
    forms:


    +   * **Polynomial speedup**: Occurs when a quantum algorithm reduces the runtime
    from $O(n^k)$ to $O(n^m)$ for $m < k$. *Example*: Grover''s algorithm [3] for
    unstructured search achieves a quadratic speedup ($O(N)$ to $O(\sqrt{N})$).


    +   * **Exponential speedup**: Occurs when a quantum algorithm solves a task in
    poly(n) while classical solutions require exp(n). *Example*: Shor''s factoring
    algorithm [4].'
