    # Quantum Machine Learning


    (0) (1) (2)


    ![](img/7dbe239d4cc1f635a551b6e06f3d3df9_75_0.png)


    **Figure 6.1.** A simple feed-forward neural network architecture with an input
    layer in $\mathbb{R}^2$, a hidden layer in $\mathbb{R}^3$ and an output layer
    in $\mathbb{R}^1$. Each node represents an artificial neuron, and arrows indicate
    the flow of information through weighted connections. This structure explains
    how classical neural networks compute nonlinear mappings from input to output
    via layer-wise transformation.


    By stacking multiple layers, networks are able to learn hierarchical representations
    of data. For instance, in classification, the initial layers may learn edges and
    textures, while deeper layers learn shapes and object categories.


    During training, the network parameters $\theta = \{W, b\}$ are adjusted to minimize
    a loss function $L(f(x; \theta), y)$, which quantifies the error between the predicted
    output and the true label. This is typically done via **gradient descent**, stochastic
    gradient descent, or one of its many variants. Gradients are computed using **backpropagation**,
    a recursive application of the chain rule of calculus across the layers of the
    network.


    Neural networks are **universal function approximators** [6, 7], a feed-forward
    network with a single hidden layer and sufficient units can approximate any continuous
    function on a compact domain, given the right parameters. This powerful theoretical
    foundation, combined with efficient training methods and hardware acceleration
    (e.g., GPUs), has fueled the rise of deep learning across many fields, including
    computer vision, natural language processing, and scientific data modeling. Universal
    approximation theorems have been derived for deeper neural architectures [8].


    ## 6.1.2 Parameterized quantum circuits as learning models


    As introduced in the previous chapter, a parameterized quantum circuit (PQC) or
    variational quantum circuit (VQC) consists of an arbitrary set of quantum gates,
    which are parameterized by a set of controls that determine the outcome of the
    circuit. A specific type of PQC is so-called quantum neural networks (QNNs), where
    the suitable set of parameters for a task is learned on a given set of data, resembling
    the training of a classical neural network [9–11, 13, 37].


    Classical neural networks provide the architectural and conceptual blueprint for
    variational quantum models. Understanding classical neural networks sets the stage
    for appreciating their quantum counterparts. Quantum circuits, like neural networks,
    consist of sequential transformations applied to inputs, followed by a nonlinear
    output process (in this case, measurement). These gates may be fixed (e.g. Hadamard,
    CNOT) or parameterized (e.g. $R_X(\theta), R_Y(\theta), R_Z(\theta)$), and their
    structure defines the *ansatz*, the expressive capacity of the model. The general
    workflow of a VQC classifier is as follows:


    1. **State preparation** (*data encoding*): Classical input data $x \in \mathbb{R}^d$
    are encoded into a quantum state $|\psi(x)\rangle$ using an *encoding circuit*
    $U_{enc}(x)$. This circuit maps the data into the Hilbert space of $n$ qubits.

    2. **Parameterized quantum transformation:** A parameterized quantum circuit $U(\theta)$,
    composed of gates with tunable parameters $\theta = (\theta_0, \theta_1, \dots,
    \theta_l)$, is applied to the final state. This is the quantum analog of learnable
    weights in classical neural networks.

    3. **Measurement and output:** After applying the variational circuit, a measurement
    is performed in a chosen basis (the computational basis). The classifier output
    is derived from the *expectation value* of a measurement operator $M$ on the final
    state,


    ```

    $f(x; \theta) = \langle\psi(x; \theta)|M|\psi(x; \theta)\rangle, \quad (6.2)$

    ```


    or explicitly in terms of circuit units:


    ```

    $f(x; \theta) = |0\rangle U^{\dagger}_{enc}(x) U^{\dagger}(\theta) U(\theta) U_{enc}(x)|0\rangle.
    \quad (6.3)$

    ```


    The result of a measurement can be interpreted in different ways, depending on
    the classification task:


    - *Binary classification*: A single-bit observable (e.g. Z) is measured


    The training loop resembles classical training, but with quantum evaluations at
    the forward step and specialized techniques (e.g. parameter-shift rule) for computing
    gradients. The final state before measurement


    ```

    $|\psi(x; \theta)\rangle = U(\theta) U_{enc}(x)|0\rangle^{\otimes n}. \quad (6.4)$

    ```


    This hybrid structure *classical input* $\rightarrow$ *quantum embedding* $\rightarrow$
    *parameterized quantum evolution* $\rightarrow$ *classical output* forms the backbone
    of quantum classification models.

    Like neural networks, VQCs can be stacked, extended with data re-uploading layers,
    and in conjunction with classical layers. However, their training dynamics and
    representational capacity differ significantly, motivating new theoretical and
    empirical analysis.


    ## 6.2 Backpropagation and gradient estimation in quantum models


    Training variational quantum classifiers requires differentiating expectation
    values of **observables with respect to circuit parameters**. Unlike classical
    neural networks, where backpropagation flows through a graph of differential primitives,
    quantum hardware only returns **samples from measurement outcomes**, so gradients
    must be estimated through **hardware-compatible rules**. In hybrid models, these
    quantum gradients are then stitched into a larger *end-to-end* auto-differentiation
    pipeline. Below we review the main techniques, their assumptions, costs, and when
    to use them.


    ### 6.2.1 Automatic differentiation on hybrid computational graphs


    In modern machine learning, automatic differentiation (autodiff) [14] is the backbone
    of efficient gradient-based training. Whether in PyTorch [15], TensorFlow [16],
    or JAX [17], autodiff enables seamless computation of derivatives by traversing
    a **computational graph**. In the context of quantum machine learning, the introduction
    of hybrid models—where quantum circuits are embedded within classical learning
    architectures—raises a crucial question: how do we propagate gradients through
    a model that contains a quantum circuit?


    The answer lies in hybrid computational graphs, which extend the autodiff paradigm
    to quantum nodes. These nodes encapsulate quantum operations (state preparation,
    variational evolution, and measurement) and expose *custom gradient rules* so
    that classical optimizers can update parameters across the quantum-classical boundary.


    #### Hybrid quantum graph structure


    A typical model consists of:


    - **Classical nodes**: feature pre-processing, dense layers, and loss functions.

    - **Quantum nodes**: parameterized quantum circuits acting on input-encoded states,
    returning expectation values or sample statistics.


    These nodes are linked in a computation graph, where data flow *forward* during
    evaluation, and gradients flow *backward* during training. The overall architecture
    resembles a deep learning pipeline, but with variational circuits taking the role
    of nonlinear transformations.


    Formally, let $x \in \mathbb{R}^d$ be a $d$-dimensional classical feature vector,
    and let $\psi(x; \theta)$ be prepared by the quantum circuit parameterized by
    the vector of angles $\theta$. The output of the quantum circuit is $f(x; \theta)$—example,
    if the output is an expectation value over $M$:


    ```

    $f(x; \theta) = \langle\psi(x; \theta)|M|\psi(x; \theta)\rangle. \quad (6.5)$

    ```


    The output is a scalar value bounded between $[-1, 1]$ from a label $\hat{f}(x;
    \theta)$ which is extracted. Examples of label extraction include using a classical
    bias parameter as binary labels, or re-scaling values from $[-1, 1]$ to $[0, 1]$.
    A classical loss $L^C(y, \hat{f})$ is then evaluated using ground truth label
    $y$. The gradient with respect to the parameters is


    ```

    $\nabla_{\theta} L(f(x; \theta), y) = \frac{\partial L}{\partial f} \frac{\partial
    f}{\partial \theta} \quad (6.6)$

    ```


    Here, $\frac{\partial f}{\partial \theta}$ is computed classically, while must
    be estimated using quantum-compatible methods, such as the parameter-shift rule.

