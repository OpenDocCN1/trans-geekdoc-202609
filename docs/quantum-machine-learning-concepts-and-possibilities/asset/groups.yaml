    ## Quantum Machine Learning


    Trotter-Suzuki decompositions or product formulas, especially when the terms in
    the Hamiltonian commute or be grouped into commuting subsets.


    **Example:** graph encoding.

    Consider a graph $G=(V, E)$ with adjacency matrix $(A)$. One can define a Hamiltonian
    $H_G = \sum_{(i,j) \in E} Z_i Z_j$, where the Pauli-$(Z_i)$ operator acting on
    $(i)$. Then the encoding becomes $U_G = e^{-i\theta \sum_{(i,j) \in E} Z_i Z_j}$,
    and the graph structure is embedded into the entanglement pattern of the evolved
    quantum state. Such encodings are used in graph-based learning tasks or in modeling-based
    systems.


    - **Properties.**

    - **Data type**: Structured data (e.g., graphs, molecules), or real-valued vectors
    mapped to Pauli coefficients.

    - **Circuit requirement**: depends on the system $(n)$; typically moderate to
    high.

    - **Circuit depth**: Variable; depends on the Hamiltonian and simulation method
    (e.g., Trotterization, hardware-native gates).

    - **Noise resilience**: Moderate. While expressive is high, long simulation times
    or deep circuits can introduce decoherence.

    - **Expressivity**: Hamiltonian encodings can represent complex correlations and
    entanglement patterns.


    **Applications.**

    Hamiltonian encoding has found applications in quantum kernel methods (e.g., data
    re-uploading models), quantum generative learning, and phase classification tasks.
    It also naturally arises in quantum simulation workflows, where learning is applied
    to time-evolved or ground-state data generated by physical models. Table 3.1 compares
    the major encoding schemes.


    Table 3.1. Comparison of quantum data encoding strategies. Each strategy balances
    trade-offs in terms of circuit requirements, circuit complexity, noise resilience,
    and applicability to data types.


    | Encoding strategy | Data type | requirement | Circuit depth | Noise resilience
    | Examples |

    |---|---|---|---|---|---|

    | Basic encoding | Binary strings | $n$ | Low | High | $X, I$ |

    | Angle encoding | Real-valued features | $n$ | Low-Moderate | High | $R_y(x_i),
    R_z(x_i)$ |

    | Amplitude encoding | Normalized real vector $x \in \mathbb{d}$ | $log_2d$ |
    Low | Low | State preparation circuit |

    | Hamiltonian-based encoding | Structured inputs (e.g. graphs, molecules) | Problem-dependent
    | Variable | Moderate | $e^{-itH(x)}$ |


    ## 3.3 Autoencoders


    Autoencoders [9, 10] are a class of machine learning models designed to learn
    efficient, lower-dimensional representations of data. In the classical setting,
    an autoencoder consists of an encoder $E: \mathbb{R}^d \to \mathbb{R}^d$ and a
    decoder $D: \mathbb{R}^d \to \mathbb{R}^d$, trained jointly to minimize reconstruction
    loss:


    $$\mathcal{L}(x) = \|D(E(x)) - x\|^2 \quad (3.9)$$


    The learned representation $z = E(x)$ ideally captures the most salient features
    of the input data in a compressed format. Quantum autoencoders (QAEs) [11] extend
    this concept to quantum data (see table 3.2 for comparison of classical and quantum
    autoencoders), aiming to compress quantum states into Hilbert space while preserving
    the essential information. Let $|\psi\rangle_{in} \in \mathcal{H}_A \otimes \mathcal{H}_B$,
    where $\dim(\mathcal{H}_A) = 2^n$ and $\dim(\mathcal{H}_B) = 2^m$. A QAE seeks
    a unitary $U$ that:


    $$U|\psi\rangle \approx |\psi\rangle_A \otimes |0\rangle_B, \quad (3.10)$$


    where $|\psi\rangle_A$ encodes the compressed information and $|0\rangle_B$ is
    a fixed reference state of the discarded subsystem. The loss function used in
    variational quantum autoencoders (VQAEs) [12] is typically of the form


    $$\mathcal{L}_{QAE} = 1 - \text{Tr}[\rho_B|0\rangle\langle 0|] \quad (3.11)$$


    where $\rho_B = \text{Tr}_A[|\psi\rangle\langle\psi|U^\dagger]$ is the reduced
    density matrix of the discarded subsystem. Loss is minimized when the discarded
    subsystem is disentangled and in the reference state, allowing for successful
    compression.


    ### 3.3.1 Circuit construction


    A VQAE is implemented via a parameterized circuit $U(\theta)$ trained over a set
    of input states $|\psi_i\rangle$. After optimization, $U(\theta^*)$ encodes the
    essential degrees of freedom into a subset of qubits while mapping the remaining
    qubits to $|0\rangle$. The decoder is given by $U^*(\theta^*)$, which recovers
    an approximation of the original state:


    $$|\psi_j\rangle \approx U^*(\theta^*)(|\phi_j\rangle_A \otimes |0\rangle_B).
    \quad (3.12)$$


    Table 3.2. Comparison of classical and quantum autoencoders.

    | Aspect | Classical autoencoder | Quantum autoencoder |

    | --- | --- | --- |

    | Input | Real vector $x \in \mathbb{R}^d$ | Quantum state $|\psi\rangle \in \mathcal{H}_{in}$
    |

    | Latent space | $\mathbb{R}^{d''}$ with $d'' < d$ | Subsystem $\mathcal{H}_A
    \subset \mathcal{H}_{in}$ |

    | Encoder | Neural network $E(x)$ | Parameterized unitary $U(\theta)$ |

    | Decoder | Neural network $D(z)$ | $U^*(\theta)$ |

    | Loss function | Reconstruction error $\|D(E(x)) - x\|^2$ | Projection fidelity
    $1 - \text{Tr}[\rho_B|0\rangle\langle 0|]$ |

    | Applications | Dimensionality reduction, denoising | State compression, error
    mitigation, quantum channel capacity |


    ### 3.3.2 Applications and relevance


    QAEs are a powerful and flexible component within the broader framework of QML.
    At their core, QAEs are designed to compress quantum states into a smaller subspace
    while preserving the essential information needed for downstream tasks. This ability
    to reduce the dimensionality of quantum states has far-reaching implications for
    practical applications and theoretical investigations. In contexts where quantum
    resources such as memory, coherence time, or qubit availability are limited, QAEs
    offer a route toward more efficient use of these scarce resources. They enable
    the representation of complex quantum data using fewer qubits, which is especially
    important.


    ## 3.4 Quantum data


    The notion of quantum data refers to information that is inherently quantum, unlike
    classical strings which are composed of deterministic or probabilistic assignments.
    Quantum data are encoded in the state of a system, described mathematically by
    a vector in complex Hilbert space (for pure states) or density matrix (for mixed
    states). Quantum data arises naturally in a variety of scientific domains, including
    quantum physics, chemistry, and metrology.


    ### 3.4.1 Definition and representations


    Formally, quantum data correspond to a state $\rho \in \mathcal{D}(\mathcal{H})$,
    where $\mathcal{D}(\mathcal{H})$ denotes the set of density operators on a Hilbert
    space $\mathcal{H}$. Pure quantum data are described by $|\psi\rangle$ with $|\psi\rangle
    \in \mathcal{H}$, while mixed quantum data may represent classical uncertainty
    or entanglement with an environment. These states may be prepared experimentally
    or arise from quantum circuits.


    From an information-theoretic perspective, quantum data differ fundamentally from
    classical data due to key properties such as:


    - **Superposition**: A quantum state can encode a continuum of amplitudes, leading
    to richer representational capacity.

    - **Entanglement**: Quantum data may exhibit non-classical correlations across
    subsystems, which can encode structured global information.

    - **No-cloning**: Quantum data cannot, in general, be copied without disturbance,
    limiting access to training examples or labeled data in a supervised learning
    context.

    - **Measurement-induced collapse**: Extracting classical information from quantum
    data is fundamentally probabilistic and destructive.


    ### 3.4.2 Sources of quantum data


    Quantum data may be generated from a number of sources, depending on the application
    domain:


    - **Simulated systems**: Quantum states from condensed matter, lattice gauge theory,
    or molecular systems simulated via classical or quantum algorithms.

    - **Experimental systems**: Data collected from quantum optics, superconducting
    circuits, trapped ions, or other quantum hardware.

    - **Intermediate quantum circuits**: Quantum states produced at intermediate stages
    of quantum algorithms, such as ansats in variational quantum algorithms or latent
    states in generative models.

    - **Sensor networks and metrology**: Quantum states encoding physical parameters
    of interest, such as fields, forces, or time intervals, used in precision measurement
    tasks.

