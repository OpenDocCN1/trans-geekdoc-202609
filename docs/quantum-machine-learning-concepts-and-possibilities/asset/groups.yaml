    ## 2.6.4 意义\n\n该算法展示了量子并行性和干涉的威力。通过对叠加态中的所有输入进行评估，并通过相长干涉或相消干涉，Deutsch–Jozsa 算法在查询复杂度上实现了指数级加速。\n\
