    Colorado School of Mines, USA)**


    # About the Series


    The IOP Series in Quantum Technology is dedicated to bringing together the most
    up to date texts and reference books from across the emerging field of quantum
    science and its technological applications. By prepared leading experts, the series
    is intended for graduate students and researchers either already working in or
    intending to extend the field. The series seeks (but is not restricted to) publications
    in the following topics:


    +   * Quantum biology

    * Quantum communication

    * Quantum computation

    * Quantum control

    * Quantum cryptography

    * Quantum engineering

    * Quantum machine learning and intelligence

    * Quantum materials

    * Quantum metrology

    * Quantum optics

    * Quantum sensing

    * Quantum simulation

    * Quantum software, algorithms and code

    * Quantum thermodynamics

    * Hybrid quantum systems


    A list of recent titles published in this series can be found here: https://iopscience.iop.org/bookListInfo/iop-series-in-quantum-technology.'
