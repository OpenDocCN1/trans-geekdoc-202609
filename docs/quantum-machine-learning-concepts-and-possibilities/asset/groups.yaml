    Structurally the models are neural networks where neurons are partitioned into
    visible (v) and hidden variables (h). The BM is a fully connected, recurrent network,
    whereas the RBM and DBN restrict weighted connections into bipartite graphs (no
    direct connections exist between visible or hidden variables).


    A classical Boltzmann machine defines a probability distribution over the visible
    variables by associating each configuration x (comprising visible and hidden units)
    with an energy value. The model learns by minimizing the energy of likely configurations
    and maximizing the energy of unlikely ones. The probability of a visible configuration
    v is given by marginalizing over hidden variables h,


    ```

    $p(v) = \frac{1}{Z} \sum_{h} e^{-E(v, h)}, \quad (7.1)$

    ```


    where the energy function is defined as


    ```

    $E(v, h) = -\mathbf{v}^T W \mathbf{h} - \mathbf{b}^T \mathbf{v} - \mathbf{c}^T
    \mathbf{h}, \quad (7.2)$

    ```


    and the partition function Z ensures normalization:


    ```

    $Z = \sum_{v,h} e^{-E(v, h)}, \quad (7.3)$

    ```


    The summation over all pairs of visible and hidden units in the partition function
    makes training BMS difficult. The contrastive divergence algorithm [9] has been
    successful in training RBMs. Since no intra-layer connections are allowed, the
    states of the hidden or visible nodes are iteratively updated and stochastic sampling
    offers a tractable alternative that became widely used in deep learning pipelines,
    as pre-training layers for DBNs.


    BMs are conceptually appealing because they encode correlations through learned
    landscapes and can be related to physical systems in thermal equilibrium. This
    connection makes them ideal candidates for generalization to the quantum domain.
    particularly appealing for statistical physics-inspired learning and the stage
    for quantum extensions that substitute classical energy functions with quantum
    Hamiltonians.


    RBMs gained popularity in the early 2000s as building blocks of DBNs and were
    used for dimensionality reduction, collaborative filtering, and pre-training deep
    networks. By the advent of deep learning, energy-based models [10] have incorporated
    other deep neural architectures into non-parametric models trained by unsupervised
    learning.


    ### 7.1.2 Deep generative models


    Modern deep generative models have greatly expanded the applicability of generative
    modeling to high-dimensional data, including images, text, and audio. Notable
    examples include:


    - Variational autoencoders (VAEs) [11]: Learn a probabilistic latent space using
    an encoder-decoder architecture, optimizing a variational lower bound over the
    data likelihood.

    - Generative adversarial networks (GANs) [12]: Consist of a generator and a discriminator
    trained in a minimax game, leading to highly realistic generation.


    Table 7.1. Classical generative models at a glance.


    | Model Type | Example | Key Mechanism | Strengths | Limitations |

    |---|---|---|---|---|

    | Probabilistic models | GMM, HMM | Parametric estimation | Interpretable, well-studied
    | Limited in high dimensions |

    | Energy-based models | RBM | Low-energy sampling | Physically inspired, flexible
    | Intractable partition function |

    | Latent variable models | VAE | Variational inference | Probabilistic decoding
    | Blurry samples |

    | Adversarial models | GAN | Generator-discriminator game | Sharp, realistic outputs
    | Training instability, mode collapse |

    | Invertible models | Normalizing flow | Bijective mapping from prior | Exact
    likelihoods | Requires specific architectural design |


    - **Normalizing flows** [13]: Learn invertible transformations from simple distributions
    (e.g. Gaussians) to complex ones, enabling fast likelihood computation.


    These models offer powerful tools for generation, representation learning, and
    simulation, but also come with limitations (table 7.1).


    ## 7.2 Quantum generative models


    Quantum generative models (QGMs) have been developed either hardware-agnostic
    theoretical models or have been developed through co-design with near-quantum
    hardware. Many technologies are used for quantum processors and different processors
    rely on different computing models. Quantum annealers use the adiabatic evolution
    of quantum systems [14], while digital quantum computers use unitary evolution
    of quantum systems. Annealers are well-suited for energy-based models, while digital
    quantum systems are well-suited for variational algorithms. However, hardware
    capacities are advancing yearly and are assisted through novel algorithm design.
    A QGM is typically defined by three components:


    - A **quantum circuit** $U(\theta)$ with parameters $\theta$, acting on an initial
    state $|\Psi\rangle$;

    - A **measurement scheme**, often in the computational basis;

    - A **training objective**, such as matching the output distribution $p_{\theta}(x)$
    to a target distribution $p_{\text{data}}(x)$ via a loss function $\mathcal{L}(p_{\theta},
    p_{\text{data}})$.


    The output distribution is defined as


    ```

    $p_{\theta}(x) = |\langle x|U(\theta)|0^{\otimes n}\rangle|^2$.

    ```


    Training proceeds by adjusting $\theta$ to minimize a divergence or distance metric,
    total variation distance, or adversarial loss. Depending on the task, QGMs can
    be used for:


    - **Quantum data generation**, i.e. producing quantum states or measurement statistics;

    - **Classical data modeling**, i.e. approximating the distribution of classical
    data using a quantum circuit;

    - **Hybrid applications**, where classical and quantum components interact during
    training or inference.


    ### 7.2.1 Quantum Boltzmann machines


    The motivation for Boltzmann machines Quantum machines (QBMs) [15] extend classical
    BMs by replacing classical energy functions with Ising spin Hamiltonians. Instead
    of modeling probability distributions directly, QBMs prepare a thermal state in
    a Hilbert space. Through projective measurements, samples can be drawn to the
    density matrix of the prepared state:


    $$\$$\rho = \frac{e^{-\beta H}}{\text{Tr}(e^{-\beta H})} = \sum_i |\psi_i\rangle\langle\psi_i|$$

    ```


    Here, $H$ is a Hamiltonian encoding interactions between qubits, $\beta$ is the
    inverse temperature ($1/k_B T$), and $|\psi_i\rangle$ represents individual state
    vectors. The transverse field Ising model is a well-established system for Boltzmann
    machines the Hamiltonian is composed of nearest-neighbor interactions as well
    as on-site potentials and external fields,


    ```

    $H_{\text{ISING}} = -\sum_{\langle i,j\rangle}\sigma_i\sigma_j - \sum_i h_i\sigma_i$

    ```


    This system exhibits transitions where individual spins (i.e. neurons or binary
    variables) can align or anti-align with nearest neighbors, or can align or anti-align
    with t external field. These interactions are controlled by the amplitude and
    sign of the individual terms $J_{ij}$, and the on-site potential and external
    fields ($h_i$) and can result in long-range coherent patterns or random, frustrated
    configurations of spins.


    Training this model approximates a target distribution by optimizing the parameters
    ($J_{ij}, h_i$) of $H_{\text{ISING}}$.


    > $k_B$ is the Boltzmann constant.

