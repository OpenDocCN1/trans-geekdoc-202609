    PAC learning bound (classical)

    Let $\mathcal{H}$ be a hypothesis class of finite VC dimension $d$, and let $\delta
    \in (0,1)$. Then, with probability at least $1 - \delta$ over $m$ training examples
    sampled i.i.d. of $\mathscr{D}$, every hypothesis $h \in \mathcal{H}$ satisfies

    $$R(h) \leq \hat{R}_S(h) + \Theta\left(\frac{d \log(m/d) + \log(1/\delta)}{m}
    \right)$$

    where $\hat{R}_S(h)$ is the empirical risk over the sample $S$.


    These bounds extend to quantum learners when hypothesis classes are suitably restricted
    (e.g. finite precision, bounded output) and the loss is estimated finite-shot
    measurements.


    ## 8.2.2 Quantum sample complexity


    It is natural to ask whether quantum learning models offer improvements in sample
    complexity, that they require fewer training examples to achieve the same generalization
    error? The answer depends critically on the data-access model.


    In the standard PAC model with classical examples, it is known that quantum models
    do not enjoy better sample complexity than classical models. That is, the number
    of examples needed to learn a class $\mathcal{H}$ up to error $\epsilon$ is lower
    bounded by $\Omega(d/\epsilon^2)$, where $d$ is the VC dimension or effective
    dimension of $\mathcal{H}$.


    However, when learners have access to quantum examples they may experience constant-factor
    improvements in sample complexity or stronger query complexity reductions in sample
    oracle-based tasks. These do not violate known lower bounds in classical PAC learning
    but represent separations in models of computation.


    ### PAC learnability result

    Let $\mathcal{H}$ be a concept class with sample complexity $m(\epsilon, \delta)$
    in the classical PAC model. Then, under access to quantum examples $\{\psi_x\}$,
    $\mathcal{H}$ remains PAC learnable with sample complexity

    $$m_Q(\epsilon, \delta) = \mathcal{O}(m(\epsilon, \delta)),$$

    with potential constant-factor improvements depending on the concept class. However,
    no super-polynomial separation in sample complexity is possible under standard
    assumptions.


    Several concept classes exhibit provable separations in query complexity when
    learners are given quantum membership or evaluation oracles. For example:


    - Learning Boolean juntas with fewer queries [5].

    - Fourier-sparse functions [6].

    - Parity functions with noise [7].


    ## 8.2.3 Generalization bounds for quantum models


    Generalization bounds quantify how well a model trained on finite data will perform
    on unseen data. For quantum models, classical learning theory provides the blueprint,
    but it must be adapted to account for:


    - The nature of quantum hypothesis spaces (e.g., variational circuits, kernel-induced
    Hilbert spaces)

    - Shot noise in finite sampling

    - Non-Euclidean optimization geometry


    ### 8.2.3.1 Quantum kernel models


    For quantum kernel methods, generalization error is governed by the effective
    dimension $d_{eff}(\lambda)$, which depends on the spectrum of the kernel matrix.
    Specifically, for regularized empirical risk minimization (e.g. kernel ridge regression),
    the following bound holds.


    > Generalization bound via effective dimension

    Let $K$ be a quantum kernel matrix on $m$ training examples and $\lambda > 0$
    the regularization parameter. The excess risk of the trained predictor satisfies


    $$R(h) - R(h^*) \le \mathcal{C}\left(\frac{d_{eff}(\lambda)}{m}\right) + \mathcal{C}(\lambda|f^*|^2)$$


    where $f^*$ is the target function in the reproducing kernel Hilbert space (RKHS)
    and


    $$d_{eff}(\lambda) = \text{Tr}(K(K+\lambda I)^{-1})$$


    This result reveals that high-dimensional quantum feature maps do not automatically
    result in overfitting, generalization depends instead on the spectral decay of
    the kernel.


    ### 8.2.3.2 Variational quantum circuits


    For variational models, generalization can be bounded using:


    - Uniform stability of the training algorithm.

    - PAC-Bays bounds on the classical post-measurement distribution.

    - Quantum Information geometry to assess sensitivity to parameters


