    # Common traits among applications


    +   - Tasks are often low-data or high-dimensional—favorable settings for kernel-based
    methods.

    - Preprocessing (e.g. PCA, downsampling, feature selection) is critical to adapting
    data to current quantum hardware.

    - Quantum advantage has not yet been demonstrated on real-world datasets, but
    hybrid methods show promise.

    - Most implementations remain limited to binary classification due to circuit
    and qubit constraints.


    These case studies illustrate the diversity of application domains in which quantum
    inference models are being tested. Although limitations persist, in particular
    with respect to hardware capabilities and model expressivity, these real experiments
    are essential for guiding co-design strategies between quantum algorithms, data
    encodings, and physical devices.


    # 4.7 Open challenges and future directions


    Quantum inference is a rapidly evolving field at the intersection of quantum computing
    and machine learning. While early results have demonstrated feasibility and potential,
    there remain significant theoretical, algorithmic, and hardware-related challenges
    that must be addressed before quantum models can consistently outperform classical
    ones in practical tasks. In this section, we outline several key problems and
    emerging research directions.


    # 4.7.1 Scalability and resource constraints


    The most immediate obstacle to deploying quantum inference models at scale is
    the limited size and fidelity of quantum hardware. Current devices are constrained
    by:


    +   - **Qubit count**: Many practical datasets require input features that far
    exceed the number of available qubits. Dimensionality reduction and feature compression
    are necessary, but may limit the model''s expressivity.

    - **Circuit depth**: Deep circuits are needed to realize expensive quantum feature
    maps and variational ansätze, but are often infeasible due to noise and decoherence.

    - **Sampling cost**: Estimating expectation values requires many repetitions (shots),
    in particular for small signal-to-noise ratios. This increases training time and
    reduces model efficiency.


    Research into more hardware-efficient architectures (e.g. shallow circuits, tensor
    networks, or error-mitigated inference schemes) is essential to overcoming these
    constraints.'
  - '[PAGE 57]


    # 4.7.2 Design of quantum feature maps


    The choice of quantum feature map has a critical impact on the performance of
    both kernel-based and variational models. However, there is no universal method
    for constructing feature maps that guarantee good generalization. Open questions
    include:


    +   - How different encodings affect the geometry of the Hilbert space and the
    learnability of the target function

    - Can one systematically design quantum feature maps with provable advantages
    over classical counterparts?

    - What classes of problems benefit most from quantum feature spaces?


    Understanding the expressivity and inductive biases of quantum feature maps remains
    a major theoretical and empirical challenge.


    # 4.7.3 Noise robustness and error mitigation


    Quantum circuits used for inference are inherently noisy, and even shallow circuits
    can suffer from decoherence, gate infidelity, and readout errors. While some methods
    (e.g. zero-noise extrapolation, randomized compiling) can reduce these effects,
    they add computational overhead and are not yet standard across platforms. Key
    directions include:


    +   - Developing noise-aware training algorithms that are robust to stochastic
    loss landscapes

    - Formalizing the impact of noise on generalization bounds and learning guarantees

    - Exploring hybrid or variational error mitigation methods tailored for inference
    tasks.


    # 4.7.4 Learning theory and generalization bounds


    Despite recent progress in benchmarking and empirical evaluation, there is a lack
    of rigorous theory of quantum models. Open theoretical questions include:


    +   - What are the sample complexity and generalization bounds on quantum classifiers?

    - Can quantum models provably reduce the number of training examples needed to
    achieve a given accuracy?

    - Under what conditions can quantum models be said to learn more efficiently than
    classical ones?


    These questions are fundamental to understanding when and why quantum models might
    outperform their classical counterparts, particularly in regimes of limited data
    or high-dimensional structure.'
