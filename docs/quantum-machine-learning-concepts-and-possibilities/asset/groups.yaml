    # 4.1.1 Supervised learning basics


    Supervised learning refers to the process of learning a function that maps inputs
    to outputs based on label examples. Formally, we are giving a training dataset


    $$\mathcal{D} = \{(x_i, y_i)\}_{i=1}^n$$ (4.1)


    where $x_i \in \mathbb{R}^d$ is the feature vector and $y_i \in \mathcal{Y}$ is
