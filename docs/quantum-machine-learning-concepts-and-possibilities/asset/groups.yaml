    both kernel-based and variational models. However, there is no universal method
    for constructing feature maps that guarantee good generalization. Open questions
    include:


    - How different encodings affect the geometry of the Hilbert space and the learnability
    of the target function.

    - Can one systematically design quantum feature maps with provable advantages
    over classical counterparts?

    - What classes of problems benefit most from quantum feature spaces?


    ### 4.7.3. Noise robustness and error mitigation


    Quantum circuits used for inference are inherently noisy, and even shallow circuits
    can suffer from decoherence, gate infidelity, and readout errors. While some methods
    (e.g. zero-noise extrapolation, randomized compiling) can reduce these effects,
    they add computational overhead and are not yet standard across platforms. Key
    directions include:


    - Developing noise-aware training algorithms that are robust to stochastic loss
    landscapes.

    - Formalizing the impact of noise on generalization bounds and learning guarantees.

    - Exploring hybrid or variational error mitigation methods tailored for inference
    tasks.


    ### 4.7.4. Learning theory and generalization bounds


    Despite recent progress in benchmarking and empirical evaluation, there is a lack
    of rigorous theory of quantum models. Open theoretical questions include:


    - What are the sample complexity and generalization bounds for quantum classifiers?

    - Can quantum models provably reduce the number of training examples needed to
    achieve a given accuracy?

    - Under what conditions can quantum models be said to learn more efficiently than
    classical ones?

