    Unlike classical learning theory, which benefits from well-established measures
    such as VC dimension and covering numbers, quantum models span a wide range of
    circuit and feature maps, many of which are not well understood in their classical
    simulability or learning complexity. Identifying relationships between quantum
    kernels, PQCs, and classical analogs is essential for characterizing what quantum
    models can learn efficiently and how they differ in expressive power.


