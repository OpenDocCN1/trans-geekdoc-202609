    ## Quantum Machine Learning Concepts and possibilities

    Andrea Delgado and Kathleen E Hamilton


    ## Chapter 8: Theory, expressivity, and learning bounds


    Machine learning theory gives us a language to reason about what a model can represent
    (expressivity), how many samples it needs to learn (sample complexity), how well
    it will perform on unseen (generalization), and what the fundamental limitations
    are. Quantum machine learning inherits these questions and complicates them: hypothesis
    classes grow in exponentially Hilbert spaces, training dynamics may be governed
    by quantum Fisher information metrics rather than Euclidean ones, and access models
    to the data (classical versus quantum states, labeled unlabeled, i.i.d. samples)
    membership queries vastly affect what can be learned. This chapter develops a
    self-contained framework to address issues:


    1. **Expressivity.** We formalize quantum hypothesis classes (e.g., variational
    quantum circuits, quantum kernels, quantum generative models) and compare them
    to classical counterparts using measures such as pseudo-dimension, covering numbers,
    Rademacher complexity, effective dimension/kernel eigenvalue decay, entanglement
    capacity, circuit depth/design, and the rank of induced feature maps.


    2. **Learning bounds.** We adapt the properly approximately correct (PAC) and
    agnostic learning notions to quantum settings (both with classical and quantum
    data) and know upper and lower bounds on sample complexity and generalization
    error. We stress when quantum examples (quantum superpositions of labeled samples)
    do or not change the asymptotics, and distinguish between information-theoretic
    and computational advantages.


    3. **Quantum learning results.** We summarize results showing (i) no super-polynomial
    reductions in PAC sample complexity from quantum examples (beyond constant/low-order
    factors), (ii) quantum speedups in query or time complexity for specific concept
    classes or certain data attributes, and (iii) constructions of quantum kernels
    or feature maps that can be exponentially hard to emulate classically (subject
    to complexity assumptions), along with their generalization analyses.


    4. **Limitations and no-go theorems.** We discuss hardness-of-training results,
    dequantization of several linear-algebraic quantum learning algorithms, barren
    plateaus, expressivity-trainability trade-offs, stability/robustness limits under
    noise, and finite measurement budgets.


    5. **Open problems.** We close with a research agenda: tighter, noise-aware generalization
    bounds for variational circuits; a unifying complexity-theoretic taxonomy of quantum
    hypothesis classes; PAC-Bayes, compression, and algorithmic stability frameworks
    for quantum machine learning; and principled ways to relate entanglement structure,
    kernel spectra, and trainability.


    We assume familiarity with quantum computing (states, unitaries, measures—chapter
    2), introductory statistical learning theory (PAC learning, Vapnik-Chervonenkis
    (VC) dimension, generalization bounds), and elementary functional analysis. The
    chapter is otherwise self-contained and provides boxed definitions and theorems
    for quick reference


    ### 8.1 Definitions and frameworks for expressivity


    This section establishes rigorous foundations for comparing the expressivity of
    classical and quantum hypothesis classes. By articulating definitions and measures
    used to quantify model complexity and representational power, we lay the groundwork
    for understanding the theoretical performance and limitations of quantum learning
    models.


    #### 8.1.1 Hypothesis classes


    In statistical learning theory, a hypothesis class **H** is a set of functions
    mapping inputs to outputs. In classical machine learning, common hypothesis classes
    include neural networks, decision trees, linear separators, and kernel-based methods.
    These models operate in classical computational paradigms, and their expressive
    capacity is typically characterized by parameters such as the number of layers
    and neurons (in neural networks), the tree depth (in decision trees), or the norm
    bounds and kernel choices (in kernel methods).


    In contrast, quantum hypothesis classes are defined by quantum circuits that act
    on quantum states and are measured according to some observable. The quantum analog
    of a hypothesis class is typically constructed using a parameterized quantum circuit
    (PQC) or variational quantum circuit that encodes classical data into quantum
    states, processes them through a unitary transformation, and measures them to
    produce an output prediction.

