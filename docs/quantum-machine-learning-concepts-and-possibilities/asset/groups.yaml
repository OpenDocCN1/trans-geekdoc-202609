    (sample efficiency) |

    | Quantum simulation and sampling | QBM, QBM | Variational sampling/distribution
    emulation | High (for complex physical models) |


    task. It also provides qualitative assessment of the quantum advantage potential,
    based on the current literature and scaling behavior.


    ## 7.6 Open challenges and future directions


    Quantum generative modeling presents both exciting prospects and substantial technical
    hurdles. As a rapidly evolving field of quantum computing, probabilistic modeling,
    and optimization, it sits at the intersection of quantum computing. This section
    discusses **open challenges** currently limiting the scalability and practicality
    of quantum generative models, followed by a summary of **opportunities** for advancing
    the field, both theoretically and experimentally.


    ### 7.6.1 Challenges


    Training quantum generative models often requires optimizing non-convex, high-dimensional
    landscapes. In variational settings, in particular with deep or uncertain ansatz,
    gradients can vanish exponentially with the number of qubits. This limits scalability
    for circuits initialized randomly or without prior knowledge. Understanding the
    relationship between circuit architecture, expressivity, and learnability remains
    an open research area, particularly when targeting hard distributions.


    **QGANs** are not immune to the failure modes that classical generative models
    encounter. For example, QGANs and QBMs can suffer from **mode collapse**, where
    the model learns to generate only a subset of the target distribution''s support.
    This is exacerbated by limited expressivity in shallow circuits or poor entangling
    strategies, and by the inability of some training objectives to fully penalize
    degeneracy.


    Furthermore, gradient estimation on quantum hardware relies on parameter-shift
    rules or finite difference approximations, both of which require a large number
    of circuit evaluations and are sensitive to noise and sampling error.


    QGMs, like many PQC-based models, are susceptible to hardware noise, including
    gate infidelity, readout error, and decoherence. Even as hardware fidelities improve,
    the reliance on finite samples leads to instabilities in training statistics or
    biased estimators in low-sample regimes. Shot noise affects loss estimation, gradient
    direction, and model convergence. Overall, these effects distort the output distribution
    and make training inefficient, in particular when high precision is required for
    tasks such as quantum state learning or anomaly detection.


    ### 7.6.2 Evaluation metrics and benchmarks


    Unlike classical models, quantum distributions are not always easy to interpret
    or evaluate. Standard metrics such as KL divergence, inception score, or Frechet
    inception density may not be applicable or tractable. Fidelity, trace distance,
    and observable-based metric are useful, but often require access to the full target
    distribution or ideal output state.


    In addition, certifying generative model performance in the quantum setting remains
    challenging, in particular when neither the data nor the model can be simulated
    classically. This limits cross-comparison between models and slows down the development
    of domain-specific techniques, such as for quantum chemistry, condensed matter,
    or high-energy physics.


    While several proof-of-concept studies have demonstrated QGM training on many
    problems, there is a lack of standardized benchmarks and real-world datasets tailored
    to quantum learning tasks. QGMs are well-positioned to address niche domains where
    generative methods struggle, such as sparse, structured data from nuclear physics,
    lattice gauge theories, sensor networks, or quantum tomography. However, in contexts,
    the balance between noise and the quantum inductive bias must be carefully controlled—it
    may lead to more data-efficient or physically faithful models, or the lack of
    precision may inhibit training altogether.


    ### 7.6.3 Opportunities


    Despite these challenges, quantum generative modeling offers a range of promising
    directions for theoretical advancement and near-term experimentation.


    There is active work in designing expressive, trainable, and hardware-efficient
    ansätze, including quantum convolutional and autoregressive circuits, normalizing
    flows, and multi-scale entanglement structures. These architectures aim to balance
    depth, trainability, and expressivity while being compatible with real devices.


    Several tasks in quantum physics—such as generating samples from spectral functions,
    learning many-body wavefunctions, or sampling from high-rank observables—may offer
    provable or practical quantum advantage. These settings are particularly amenable
    to QGMs since the sampling task itself is quantum-native and intractable classically.


    New training paradigms, including hybrid quantum-classical workflows and non-adversarial
    loss functions (e.g. fidelity-based, score-matching, or kernel-based), offer more
    stable convergence than adversarial schemes. They also make better use of classical
    computing for parameter updates and gradient smoothing. Additionally, incorporating
    noise models or injecting noise during training loop may produce quantum models
    that are robust to near-term hardware noise. These approaches need to incorporate
    noise-mitigation methods such as zero-noise extrapolation, probabilistic error
    cancellation, and robust optimization help stabilize training under realistic
    conditions. Again, this raises the challenge of building efficient, noise robust
    workflows.


    ## 7.7 Summary


    QGMs offer a compelling approach to probabilistic modeling, leveraging the unique
    capabilities of quantum mechanics to represent and learn complex distributions.
    From QCBMs to QGANs and hybrid variational autoencoders, a diverse landscape of
    architectures has emerged, with distinct strengths, training methodologies, and
    potential applications.


    In this chapter, we began by tracing the classical roots of generative modeling,
    particularly through Boltzmann machines and general energy-based models and showed
    how these circuits can encode probability distributions via the Born rule and
    explored different classes of models tailored for tasks ranging from classical
    data generation to quantum state learning and sampling.


    A key theme throughout the chapter was expressivity: the ability of quantum circuits
    to represent complex distributions more efficiently than their classical counterparts.
    We reviewed formal characterizations of expressivity and linked them to circuit
    depth, entanglement, and architectural design. We also examined practical considerations
    in training these models, including loss functions, gradient estimation, and the
    role of shot noise and hardware constraints.


    Through various applications and case studies, we highlighted how QGMs can be
    used in domains such as anomaly detection, circuit compression, and physics-informed
    sampling. These examples illustrated both the promise and the near-term feasibility
    of QGMs when deployed on or upcoming quantum hardware.


    At the same time, we anticipate persistent challenges that remain critical barriers
    to scale. Yet the field is rapidly advancing, and emerging techniques in noise-aware
    training, hybrid optimization, and expressive circuit design continue to push
    the boundaries of what is achievable.


    Looking forward, we anticipate that generative modeling will play a foundational
    role in quantum machine learning and simulation. Ultimately, QMS exemplify the
    hybrid paradigm of quantum learning: utilizing the statistical power of generative
    modeling with the expressive and computational resources of quantum circuits.
    Their development will be pivotal to realizing practical quantum advantage in
    machine learning.

