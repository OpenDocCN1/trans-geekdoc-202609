    Andrea Delgado and Kathleen E Hamilton**


    # Chapter 2


    # Quantum information processing


    Quantum information theory is a branch of physics and computer science that deals
    with the behavior and manipulation of information at the quantum level. It is
    based on the principles of quantum mechanics, the fundamental theory of describing
    the behavior of matter and energy at the atomic and subatomic scales.


    In classical information theory, information is represented by bits—fundamental
    units that can take values of 0 or 1. In contrast, quantum information is represented
    by **quantum bits**, **or qubits**, which can exist in a superposition of states,
    enabling more complex and parallel computation.


    Quantum information theory has wide applications in quantum computing, quantum
    communication, quantum cryptography, and quantum metrology. Key concepts include
    entanglement, quantum teleportation, and quantum error correction. Entanglement
    describes correlations between quantum systems that cannot be explained classically.
    Quantum teleportation allows the transmission of states via classical communication
    and entanglement. Quantum error correction ensures the robustness of quantum information
    in the presence of noise.


    This chapter introduces core principles of quantum mechanics as they pertain to
    computation, including qubit states, gates and circuit-based algorithms. The final
    section provides an overview of the **postulates of quantum mechanics**, and introduces
    canonical algorithms such as **Deutsch-Jozsa''s algorithms** and **Grover''s algorithms**
    for ground future quantum machine learning (QML) discussions.


    ## 2.1 Quantum computing


    Quantum computing uses principles of quantum mechanics—superposition, entanglement,
    and interference—to perform computations. A **qubit** can be both 0 or a 1 simultaneously
    due to superposition, and its state is represented in a two-dimensional Hilbert
    space $\mathcal{H} \cong \mathbb{C}^2$.


    A qubit''s state $|\psi\rangle = \alpha|0\rangle + \beta|1\rangle$, with $\alpha,
    \beta \in \mathbb{C}$ and $|\alpha|^2+\|\beta|^2=1$, describes a unit vector on
    the Bloch sphere. Measurement projects the state to $|0\rangle$ or $|1\rangle$
    represented by two-dimensional vectors,


    $$|0\rangle = \begin{bmatrix} 1 \\ 0 \end{bmatrix}, |1\rangle = \begin{bmatrix}
    0 \\ 1 \end{bmatrix} \quad (2.1)$$


    with the probabilities $|\alpha|^2$ and $|\beta|^2$. Quantum systems also exhibit
    entanglement, a nonlocal correlation that allows multi-qubit states to exhibit
    joint properties that classical systems cannot reproduce.


    The quantum bit

    The quantum bit or qubit is the fundamental unit of quantum information. Unlike
    a classical bit, which can be found in one of two definite states (0 or 1), a
    qubit can exist in a superposition of both states simultaneously:


    $$|\psi\rangle = \alpha|0\rangle + \beta|1\rangle$, with $|\alpha|^2+\|\beta|^2=1.
    \quad (2.2)$$


    This abstract two-level system can represent a wide range of physical realizations,
    as the states (0) and (1) in the computational basis, as $-\frac{1}{2}$ and $\frac{1}{2}$
    for a spin-1/2 particle.


    - The qubit remains in a ''superposition'' state until a measurement is performed.
    Measurement collapses the superposition, projecting the qubit into one of the
    states. The behavior of quantum systems is governed by a small set of rules, known
    as the postulates.


    - State space: A quantum system is a unit vector $|\psi\rangle$ in a Hilbert space.

    - Evolution: In the absence of measurement, quantum states evolve according to
    unitary transformations $U$.

    - Measurement: Observables correspond to Hermitian operators. Upon measurement,
    the system collapses to an eigenstate of the observable with probability given
    by the Born rule.

    - Composite systems: The state space of a composite system is the tensor product.
    Entanglement arises when the state cannot be factored.


    ## 2.2 Dirac notation

    Dirac''s notation is a formalism used in quantum mechanics to describe quantum
    states. In Dirac''s notation, a vector $v$ is represented as $|v\rangle$. It is
    based on the use of bra-ket notation, where a ket represents a column vector and
    a bra is its conjugate transpose. Thus, a qubit is in the superposition of states
    0 and 1:


    $$|\psi\rangle = \alpha|0\rangle + \beta|1\rangle$$


    The coefficients $\alpha$ and $\beta$ are complex numbers $(\alpha, \beta \in
    \mathbb{C})$. The bra and ket represent vectors in a two-dimensional Hilbert space
    where the states $|0\rangle$ and $|1\rangle$ form an orthonormal basis. The bra-ket
    notation allows one to represent inner products, outer products, and other operations
    on these in a concise and intuitive way. For example, in this orthonormal basis,
    we can write $|\psi\rangle$ as


    $$|\psi\rangle = \begin{bmatrix} \alpha \\ \beta \end{bmatrix}$$


    The physical interpretation of $\alpha$ and $\beta$ are the probabilities $|\alpha|^2$
    or $|\beta|^2$ of finding our state in $|0\rangle$ or $|1\rangle$, respectively,
    after a measurement. Furthermore, these probabilities are normalized to unity.
    Finally, in Dirac''s notation, the bra-ket notation is used to represent quantum
    states and operators. For example, a quantum state $|\psi\rangle$ can be represented
    as a ket and an operator $A$ can be represented as a bra-ket pair $\langle\psi|A|\psi\rangle$.


    ## 2.3 Bloch sphere

    The Bloch sphere is a graphical representation of the state of a two-level system,
    such as a qubit. The Bloch sphere is a sphere of unit radius, with the north pole
    representing the state $|0\rangle$ and the south pole representing the state $|1\rangle$.
    Any state is a point on the surface of the Bloch sphere. For example, the state
    $|+ \rangle$, which is a superposition of $|0\rangle$ and $|1\rangle$, is represented
    by the point on the equator that is halfway between the north and south poles.


    The Bloch sphere

    Any point on the surface of the Bloch sphere represents a state of a two-level
    system.

    The generalization of such a state can be represented through the parameters $\gamma,
    \theta, \phi$:


    $$|\psi\rangle = e^{i\frac{\phi}{2}}(\cos\frac{\theta}{2}|0\rangle + \sin\frac{\theta}{2}e^{i\phi}|1\rangle)$$

