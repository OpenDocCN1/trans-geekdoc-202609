    # Quantum Machine Learning


    # 3.1 Bridging computational realms


    In the realm where classical data interfaces with quantum systems, the linchpin
    that facilitates the flow of information is classical-to-quantum encoding. This
    essential conduit allows quantum processors, with their inherently quantum nature,
    to comprehend and manipulate data that originate in the classical domain. In this
    section, we will delve into the intricacies of this conversion process, exploring
    various methods and considering their implications.


    In classical learning, data representation plays a central role in determining
    the performance of learning algorithms. Consider a dataset $\mathcal{D} = \{(x_i,
    y_i)\}_{i=1}^n$, where $x_i \in \mathbb{R}^d$ are input features and $y_i \in
    \mathbb{R}$ the corresponding labels. A common approach in QML is to transform
    the input space using a quantum feature map $\Phi: \mathbb{R}^d \to \mathcal{F}$,
    where $\mathcal{F}$ is a high-dimensional feature space, such as a Hilbert space.
    This transformation enables the application of linear methods in $\mathcal{F}$
    to capture nonlinearities in the original input space.


    A classical analog to quantum encoding is found in kernel methods, where data
    are mapped implicitly through a kernel function $k(x, x'') = {\langle\phi(x),
    \phi(x'')\rangle}$. Popular feature maps include polynomial and radial basis functions
    (RBFs), which effectively encode prior assumptions about the structure of the
    data and the task.


    Feature maps

    Consider a Hilbert space denoted as $\mathcal{H}$, referred to as the feature
    space. Let $\chi$ and $x$ represent an individual sample from this input set.
    In this context, a **feature map** is a function, denoted as $\phi$, that operates
    on inputs from the set $\chi$ and maps them to vectors within the Hilbert space
    $\mathcal{H}$


    $$\phi: \chi \to \mathcal{H}$$


    such that

    Then a quantum model constructs a function

    $$f(x) = {\langle0|U^{\dagger}(x)MU(x)|0\rangle} \otimes_n$$ (3.1)

    where $\mathcal{M}$ is a Hermitian observable. This representation allows for
    kernel-based approaches via the quantum kernel

    $$k(x, x'') = ||\langle\phi(x), \phi(x'')\rangle||^2,$$ (3.2)

    which has been studied in the context of quantum support vector machines (QSVMs)
    [8] and other learning models.


    By employing a series of quantum gates to induce superpositions and entanglements,
