    - Very easy to implement.

    - Works for any differentiable or even non-differentiable model.

    - Requires only access to forward evaluations (black-box compatible).


    Cons:


    - Introduces bias controlled by the step size $\varepsilon$; small $\varepsilon$
    reduces bias but increases variance due to noise.

    - Computational cost scales poorly with the number of parameters.

    - Sensitive to hardware noise and sampling fluctuations.


    ### 6.2.4.2 Simultaneous perturbation stochastic stochastic approximation


    SPSA is a stochastic gradient approximation algorithm that estimates the full
    gradient using **only two evaluations**, regardless of the number of parameters.
    This is achieved by perturbing all parameters simultaneously along a random direction
    and estimating the gradient via a finite-difference quotient.


