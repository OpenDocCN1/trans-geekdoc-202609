    # Chapter 4


    # Quantum computing for inference


    Supervised learning is a central paradigm in classical machine learning, wherein
    a model learns a mapping from inputs to outputs using labeled data. From image
    classification to spam detection, supervised learning algorithms are widely used
    to extract patterns from data and make reliable predictions on unseen examples.
    At the heart of these methods lie models, often linear or nonlinear, that learn
    decision boundaries based on the training data, and tools such as feature maps
    and kernels that enhance the model''s ability to capture complex relationships
    in high-dimensional spaces.


    With the advent of quantum computing, researchers have begun to explore how quantum
    mechanical principles can be harnessed to enhance the performance of inference
    algorithms. Quantum computers, by operating in Hilbert spaces of exponentially
    large dimension, offer a new substrate for representing and processing information.
    In particular, quantum machine introduces a novel approach to supervised learning
    by replacing classical components, such as feature maps or inner products, with
    their quantum analogues. These include quantum feature maps, which encode classical
    data into quantum states, and quantum kernels, which evaluate the similarity of
    data points via quantum circuits.


    The key insight is that certain quantum feature maps can implicitly embed data
    into extremely high-dimensional spaces, where learning tasks may become easier,
    and where classical computers would struggle to compute the corresponding inner
    products. This opens the possibility of quantum-enhanced inference, where quantum
    circuits help extract patterns from data in a way that is more expressive or efficient
    than classical models, at least in principle.


    In this chapter, we explore the role of quantum computing in supervised learning
    from the perspective of inference. We begin with a brief review of classical inference,
    feature maps, and kernel methods. We then introduce the notion of quantum maps
    and how they induce quantum kernels can be used within kernel-based learning algorithms
    such as support vector machines (SVMs). We also discuss parameterized quantum
    circuits (PQCs) that act as linear models in Hilbert space and can be trained
    to perform classification tasks.


    Along the way, we provide insight into both the theoretical motivations and practical
    implementations of quantum inference models, including discussion of current empirical
    benchmarks, noise robustness, and the open question of quantum advantage. By the
    end of this chapter, the reader will be equipped with a foundational understanding
    of how quantum devices can be used for supervised learning, the potential benefits
    they may offer, and the challenges that must be overcome to realize practical
    quantum inference.


    ## 4.1 Classical foundations of quantum inference


    To understand how quantum computing can aid inference tasks, we must first revisit
    the classical framework of supervised learning and kernel-based models. These
    foundations not only guide the design of quantum algorithms but also serve as
    benchmarks to evaluate the performance and expressivity of quantum approaches.


    ### 4.1.1 Supervised learning basics


    Supervised learning refers to the process of learning a function that maps inputs
    to outputs based on label examples. Formally, we are giving a training dataset


    $$\mathcal{D} = \{(x_i, y_i)\}_{i=1}^n$$ (4.1)


    where $x_i \in \mathbb{R}^d$ is the feature vector and $y_i \in \mathcal{Y}$ is
    the corresponding label. For classification problems, the label set is finite,
    typically $\mathcal{Y} = \{1, \dots, n\}$, whereas for regression, $\mathcal{Y}
    = \mathbb{R}$.


    The learning algorithm aims to find hypothesis $h: \mathbb{R}^d \to \mathcal{Y}$
    within a chosen hypothesis class $\mathcal{H}$, such that the model generalizes
    well to new, unseen data. The generalization ability is typically assessed via
    a loss function $\mathcal{L}(h(x), y)$, such as the 0-1 loss for classification
    or the squared loss for regression. The empirical risk (or training error) is
    defined as


    $R(h) = \frac{1}{n} \sum_{i=1}^n \mathcal{L}(h(x_i), y_i),$ (4.2)


    A fundamental challenge in classical supervised learning is balancing bias and
    variance: models that are too simple may underfit the data (high bias), while
    overly complex models overfit (high variance). Regularization, cross-validation,
    and model selection techniques are typically used to navigate this trade-off.


    ### 4.1.2 Feature maps and kernels in classical machine learning


    Many learning tasks benefit from transforming the data into a new space where
    the structure becomes more amenable to linear separation. This transformation
    is performed by a feature map:


    $$\phi: \mathbb{R}^d \to \mathcal{F}$$ (4.3)

