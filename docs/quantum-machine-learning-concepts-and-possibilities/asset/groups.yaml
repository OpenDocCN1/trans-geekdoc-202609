    \ a low-rank update (e.g. from recent parameter history), and\n- Estimating $F$\
    \ on a subset of training data or using empirical Fisher approximations.\n\nSome\
    \ quantum software libraries such as PENYLANE and QISKIT provide utilities for\
    \ computing or approximating the QGT, often via parameter-shift rules for QGT\
    \ entries.\n\n## 6.2.7 Comparison to the classical natural gradient\n\nTable 6.2\
