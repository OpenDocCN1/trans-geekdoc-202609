    problem involves solving a quadratic,


    ```

    $$\min_{\alpha} \frac{1}{2}\sum_{i,j} \alpha_i\alpha_j\kappa(x_i, x_j) - \sum_i
    \alpha_i y_i, \quad (4.14)

    ```


    subject to the constraints $0 \le \alpha_i \le C$ and $\sum_i \alpha_i y_i = 0$,
    where $\alpha_i$ are dual variables and $C$ is a regularization parameter.


    Importantly, this is performed on a classical computer. The quantum device is
    only used to compute the kernel matrix $K$, which captures the geometry of data
    in Hilbert space.


    ## 4.3.4 Generalization and expressivity


    A key question in quantum computation is whether quantum kernels offer any statistical
    or computational advantage over classical kernels. Several recent years have analysed
    this question through the lens of:


    - Kernel alignment: Measures how well the quantum kernel matrix aligns with an
    ideal kernel that separates the data. Poor alignment can result in underperformance
    compared to classical kernels.

    - Inductive bias and reproducing kernel Hilbert space (RKHS): Every positive-definite
    kernel defines an RKHS. The hypothesis class of quantum kernel methods is constrained
    by the RKHS associated with $\kappa(x, x'')$, which determines the types of functions
    that can be learned.

    - Hardness of classical approximation: If $\kappa(x, x'')$ is difficult to approximate
    classically (e.g. related to problems such as random circuit sampling or instantaneous
    quantum polynomial-time (IQP) models), the quantum kernel could provide a separation
    from classical methods.


    | Pros and cons of quantum kernels | |

    | :--- | :--- |

    | **Pros:** | - Can implicitly embed data into exponentially large Hilbert spaces.<br>-
    May be hard to simulate classically under complexity-theoretic assumptions.<br>-
    Naturally compatible with existing classical kernel learning frameworks. |

    | **Cons:** | - Kernel estimation requires many quantum circuit evaluations (shots).<br>-
    Sensitivity to noise can degrade fidelity estimates.<br>- Poor kernel alignment
    can lead to suboptimal performance. |


    In the next section, we move beyond fixed-feature kernel models and explore linear
    quantum models, in which the hypothesis class is encoded directly into a PQC whose
    parameters are learned during training.


    ## 4.4 Linear quantum models


    Quantum kernels rely on fixed quantum feature maps and classical optimization.
    In contrast, linear quantum models introduce trainable parameters directly into
    quantum circuits. These models represent quantum analogs of linear classifiers,
    such as logistic regression or perceptrons, but operate in high-dimensional Hilbert
    space where the feature space is defined by the structure of a quantum circuit.


    The most common approach involves PQCs, also known as variational circuits, where
    some gates are equipped with tunable angles. These parameters are optimized using
    classical routines, making the overall learning architecture hybrid quantum-classical
    model.


    ## 4.4.1 Parameterized quantum circuits for classification


    A parameterized quantum circuit is a quantum circuit with gates that depend on
    a vector of parameters $\theta$. In the context of classification, a typical circuit
    structure includes:


    - A quantum feature map $U_{\phi}(x)$, which encodes the classical input $x$ into
    a quantum state.

    - A trainable unitary $U(\theta)$, applied after the encoding, representing the
    model''s hypothesis.

    - A measurement in the computational basis to extract the output.


    This circuit prepares a state


    ```

    $$\psi(x; \theta)\rangle = U(\theta)U_{\phi}(x)|0\rangle^{\otimes n}, \quad (4.15)

    ```


    and the predicted label is obtained by measuring one or more qubits and postprocessing
    the result. For example, in binary classification, one might define


    ```

    $f(x; \theta) = \langle\psi(x; \theta)|M|\psi(x; \theta)\rangle, \quad (4.16)

    ```


    where $M = Z \otimes I \otimes \dots \otimes I$ is a Pauli operator acting on
    the first qubit. A decision rule is then applied, e.g. classify $x$ as class 1
    if $f(x; \theta) > 0$ and class 0 otherwise.


    ## 4.4.2 Training strategies


    The model parameters $\theta$ are optimized by minimizing a cost function $\mathcal{L}(\theta)$,
    such as cross-entropy or mean squared error, over a training dataset. Optimization
    is typically performed using a classical algorithm such as gradient descent or
    one of its variants.


    There are two main approaches for optimization:


    - **Gradient-based optimization:** Uses analytical gradients computed via the
    parameter-shift rule, which allows exact derivative estimates from additional
    circuit evaluations.

    - **Gradient-free optimization:** Includes methods such as COBYLA, Nelder-Mead,
    or genetic algorithms. These are also more robust to noise but may converge slowly.


    The cost landscape can exhibit *barren plateaus*—regions where the gradient is
    vanishingly small—particularly in deep or highly expressive circuits. This makes
    the choice of circuit architecture and initialization critical for successful
    training.


    ## 4.4.3 Example: variational quantum classifier


    A common implementation of a linear quantum model is the *variational quantum
    classifier (VQC)*. It typically follows the architecture:


    1. Apply angle encoding $U_x(x)$ to map input $x$ to a quantum state.

    2. Apply a parametrized circuit $U(\theta)$ consisting of layers of single-qubit
    rotations and entanglement gates.

    3. Measure a subset of qubits in the $Z$-basis.

    4. Use the measurement outcomes (or expectation values) as the model output.


    Remarks in variational circuits:

    - Expressivity of a PQC depends on its depth, the choice of entangling gates,
    and the connectivity between qubits.

    - Shallow circuits may underfit the data, while deep circuits are prone to barren
    plateaus.

    - Measurement strategies affect both the efficiency of training and interpretability
    of results.


    Linear quantum models offer a trainable alternative to fixed-feature quantum kernels.
    While kernel methods rely on evaluating quantum overlaps, variational models attempt
    to learn the mapping directly in Hilbert space by tuning parameters. In the next
    section, we compare the performance of quantum models—both kernel-based and variational—on
    benchmark tasks.

