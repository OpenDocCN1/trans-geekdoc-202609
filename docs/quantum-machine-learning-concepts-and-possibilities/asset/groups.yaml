    (QAOA)** 进行组合优化。如今，变分算法已成为大多数实际量子应用的核心，涵盖了从化学、材料科学到金融和机器学习的多个领域。


    ## 5.1 模型描述


    变分量子算法的工作原理是将问题编码到代价函数中，该函数可以在量子设备上进行评估，并通过经典优化进行最小化。变分算法的基本组成部分包括参数化量子电路（拟态）、用于评估代价的量子测量程序，以及更新参数的经典优化循环。这种混合反馈机制使得在硬件限制存在的情况下高效探索量子态成为可能。


    设 $|\psi(\theta)\rangle = U(\theta)|\psi_0\rangle$ 表示由电路 $U(\theta)$ 准备的量子态，其中
    $|\psi_0\rangle$ 是初始参考态。变分算法的目标是寻找参数 $\theta 以最小化特定问题的代价函数（通常是哈密顿算符 $H$ 的期望值），评估方法为：


    $E(\theta) = \langle\psi(\theta)|H|\psi(\theta)\rangle$ (5.2)$


    该代价通过测量哈密顿分解中的项（通常是泡泡利算符之和）并在经典端进行组合来计算。


    变分算法的两个主要子类——VQE 和 QAOA——说明了该框架在连续和离散优化设置中的灵活性。


    ### 5.1.1 变分量子本征求解器


    VQE 作为一种实用的量子-经典混合算法被引入，用于估计量子哈密顿量的基态能量。其动力直接来源于量子力学中的变分原理：对于任何试探态 $|\psi\rangle$，量
    $\langle\psi|H|\psi\rangle$ 是基态能量 $E_0$ 的上界。试探态越接近真实的基态，期望值就越低。


    在 VQE 中，哈密顿量 $H$ 通常代表分子的电子结构，使用二量子化形式通过费米子产生符和湮灭算符表示。这些算符通过 Jordan-Wigner [4]
    或 Bravyi-Kitaev [5] 等映射转换为比特算符。生成的比特哈密顿量是泡泡利矩阵张量积的加权和：


    $H = \sum_{i \in \mathbb{R}} c_i P_i, \quad (5.3)$


    其中 $P_i \in \{I, X, Y, Z\}^{\otimes n}$，$c_i$ 是由问题哈密顿量定义的系数。为了估计能量 $E(\theta)$，必须在量子硬件上测量每个项
    $\langle \psi(\theta)|P_i|\psi(\theta)\rangle$ 并根据 $c_i$ 加权。所需的测量次数可能非常多，这促成了诸如测量分组
    [6-8]、经典影子 [9, 10] 和基旋转分组 [11] 等策略，以减少测量开销。


    拟态 $U(\theta)$ 在 VQE 的性能中起着核心作用。常见的选择包括：


    - **硬件高效拟态 [12]**，它们使用原生门操作和纠缠层。

    - **受问题启发的拟态**，例如化学中的 UCC [13] 拟态。

    - **自适应拟态**，例如 ADAPT-VQE [14]，它根据算符梯度增长电路。


