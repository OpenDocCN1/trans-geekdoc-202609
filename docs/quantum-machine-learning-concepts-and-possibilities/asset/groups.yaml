    - 最大独立集（Maximum independent set）：识别图中最大的互相邻节点集合 [22]。

    - 顶点染色与图染色（Vertex color and graph coloring）：与资源分配和调度相关 [29, 30]。

    - 旅行推员问题（Traveling salesman problem）：经典的路线优化问题 [31, 32]。


    在这些应用中，问题被编码进对角哈密顿量 $H_c$ 中，而 QAOA 通过交替应用 $H_c$ 和混合哈密顿量 $H_d$ 生成参数化的量子态。随后使用经典后处理来提取与候选解相对应的结果。


    尽管 QAOA 必须在现实基准测试中优于经典算法，但它在小型问题实例上展示了潜力，特别是在可以使用问题特定结构或初始化策略的设置下。针对热启动 QAOA、逐层训练和优化景图分析的持续研究旨在提高其可扩展性和训练性。


    ## 5.2.3 量子机器学习


    变分框架已扩展到机器学习任务中，其目标不再是寻找基态，而是训练量子模型来执行分类、回归或生成建模。在这种背景下，变分电路充当可训练模型——类似于神经网络——通过更新其参数来最小化定义在经典或量子数据上的损失函数。


    另一个极具前景的方向是构建量子分类器，通过训练变分电路来对经典或量子输入进行标记。这些分类器可以被视为神经网络的量子模拟，其参数化门门层和纠缠操作作为非线性变换。量子神经网络的架构和训练将是下一章（第6章）的主题，在该章中我们将讨论它们的结构、表达能力以及在量子学习理论中的作用。


    另一个应用是量子生成建模，通过训练变分电路来产生目标分布的统计特性。这些方法特别适用于量子硬件，因为生成过程本质上是概率性的。我们将在随后的第 7 章中详细探索这些模型，该章节将关注量子机器学习中的生成建模。


    最后，变分电路还支持量子核方法，其中参数化的特征映射用于将数据嵌入到高维希尔伯特空间。嵌入态之间的内积定义了核函数，该函数可以在量子设备上评估，并用于支持分类等经典学习任务。这些方法，包括量子特征映射的变分设计，在前一章第
    4 章关于信息编码和基于核的量子机器学习中进行了详细讨论。


    # 量子机器学习


    这些方法共同证明了变分量子算法的灵活性，能够在量子电路框架内编码模型结构和数据表示。


    ## 5.2.4 量子控制与计量学


    变分优化也用于量子控制问题，其目标是寻找控制参数以优化量子系统的性能。例如，变分电路可设计脉冲序列，以制备所需的态或在量子计量set中最大化灵敏度。这些应用使用了随时间变分原理（TDVP）[33]
    或其他物理启发的代价函数，并受益于 VQE 和 QAOA 核心的电路-优化循环。


    在量子计量学中，已经提出利用变分电路来优化量子传感器的灵敏度 [34]，特别是在存在噪声或退干的情况下。变分框架的灵活性使得根据特定的硬件限制或环境定制传感策略成为可能。


    ## 5.2.5 量子模拟与动力学


    除了基态能量等静态属性外，变分算法现在被应用于模拟量子系统的实时动力学。变分量子模拟框架使用随时间变分原理来近似给定哈密顿量下量子态的演化。这对于研究多体物理中的非平衡现象特别有用，因为这些现象在经典上是不可行的。


    该类别的应用包括晶格规范理论的模拟 [35]、量子自旋模型 [36] 和耗散系统。这些任务对于近期量子硬件特别有前景，因为它们可能只需要适中的电路深度，同时仍提供经典范围之外的见解。


    ## 5.3 面临的挑战与未来方向


    尽管变分量子算法具有前景且具有较高的硬件效率，但它们面临着许多基础性和实操性的挑战，限制了它们的可扩展性和性能。这些挑战源于量子硬件限制以及变分方法本身的算法结构。


    最显著的障碍之一是优化景图中的贫高原（barren plateau）[37]。贫高原是指参数空间中的某些区域，其中代价函数的梯度随比特数的数量呈指数级消失。在这些区域中，优化器几乎接收不到关于更新参数方向的信息，严重阻碍了训练过程。这种现象已在于随机初始化的硬件高效拟设（ansätze）[38]
    以及某些结构化电路中，特别是使用全局代价函数时 [39]。减轻贫高原的策略包括使用局部代价函数、浅层电路以及保留某种局部性或问题结构的拟设。在 QAOA 中，变分参数通常遵循类似于
    Trotter 化绝热演化的模式，这种结构已被证明有助于缓解贫高原。这种联系在文献 [40, 41] 中有详尽记录，还包括相关的策略如参数传递和参数集中 [42]，这些策略允许在问题实例之间复用优化的参数——进一步减少了对大量训练的需求，并帮助避免优化景图中的平坦区域。


    另一个关键问题是拟设的选择和表达能力 [43, 44]。拟设必须具有足够的表达能力来近似目标态，同时要有足够的结构化，以便在 NISQ 设备上实现。过于简单的拟设可能在其可及子空间内不包含基态，导致对最优值的系统性低估。相反，表达能力极强或随机初始化的电路可能会遭受过参数化的影响，并导致泛化能力差。因此，设计有效的拟设在化学应用中，UCC
    拟设提供了高度启发的结构，尽管其实现通常需要深度电路。硬件高效拟设虽然更实用，但可能缺乏归纳偏差。


    经典优化步骤也面临巨大困难。由于有限采样和硬件缺陷，在量子硬件上评估的代价通常带有噪声。这增加了基于梯度的优化器的难度，并可能导致不稳定或无效的参数更新 [45]。此外，优化景图通常是非凸的，且充满了局部最小值、鞍点和平坦区域，这些区域可能会捕获经典优化器并导致次优解。优化器的选择及其超参数（如学习率或置信半径）对算法性能有显著影响。实践中常用无导数方法如
    COBYLA 或 Nelder-Mead，但它们的性能可能随维度增加而下降。


    另一个重大挑战是评估代价函数所需的测量开销。在 VQE 中，哈密顿量被分解为泡利算符之和，每一项必须通过重复量子测量单独估计。由于项数随系统规模呈多项式或指数级增长——估计能量所需的测量次数也随之增加。由于量子测量是概率性的，这一问题变得更加严重，需要多次重复（次数）才能获得统计学意义的结果。目前已开发了测量分组、项聚类和经典影子等方法来减轻这种负担，但开销在实践中仍然是一个瓶颈。


    最后，退干是 NISQ 设备固有的特性，会显著影响变分算法的准确性 [46, 47]。量子门并非完美实现，量子比特会受到弛豫和相位退干的影响，特别是在长时间或深度执行期间。这些效应在态制备和测量中引入了误差，导致代价估计偏差并最终导致性能下降。尽管认为变分算法由于其混合结构具有某些内在抗噪性，但在实践中，硬件噪声的累积效应会限制电路的深度和保真度。


