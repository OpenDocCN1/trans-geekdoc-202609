    ## Quantum Machine Learning


    In way, the potential of QML is not limited to achieving runtime improvements.
    The development of quantum-native models—algorithms that operate directly on quantum
    data or within quantum systems—suggests new paradigms for information processing.
    These models are not simply quantum analogs of classical algorithms but often
    involve novel approaches that exploit the structure of quantum mechanics to redefine
    what learning can mean. The remainder of this book explores both the theoretical
    underpinnings and practical implementations of these approaches, with attention
    to the opportunities and limitations they present for near-term and future quantum
    hardware.


    ## When and why quantum models might help


    Quantum models offer potential advantages in machine learning due to their ability
    to represent, manipulate, and sample from high-dimensional spaces more efficiently
    than classical models in certain settings. Unlike classical models, quantum algorithms
    use complex amplitudes and patterns that encode richer geometric structures. QML
    may help in one or more of the following ways:


    - **Computational speed**: Certain subroutines—such as solving linear systems
    [20], estimating kernels [11], or sampling distributions—can be executed more
    efficiently on a quantum computer.


    - **Model expressivity**: Quantum circuits represent probability distributions
    and functions that are difficult or impossible for classical models to simulate
    efficiently [21].


    - **Compact data encoding**: Through amplitude [22] or Hamiltonian encoding [15],
    quantum states can represent exponentially large feature spaces [11, 12], potentially
    enabling better generalization from fewer physical resources.


    - **Quantum advantage on quantum data**: For tasks involving inherently quantum
    data (e.g. quantum states from sensors or simulators), quantum models offer a
    natural computational framework with no classical analog [23].


    Note that these potential benefits are subject to ongoing research. Not every
    learning problem benefits from quantum models, and practical performance depends
    on hardware limitations, the structure of the data, and the design of the algorithm.
    The goal of this book is to explore where and how such advantages may be realized.


    ## 1.3 Quantum computing: a refresher


    To understand how quantum mechanics can be harnessed for learning tasks, it is
    helpful to recall the foundational principles of quantum computing. The basic
    unit of quantum information is the qubit, which unlike a classical bit, can exist
    in a superposition of its two states. A qubit is described by a complex-valued
    unit vector in a two-dimensional Hilbert space, and through the application of
    unitary transformations. These unitary operations are implemented using quantum
    gates, which manipulate individual qubits or pairs of qubits through reversible,
    deterministic dynamics governed by the Schrödinger equation.


    ## Quantum Machine Learning


    ![](img/7dbe239d4cc1f635a551b6e06f3d3df9_15_0.png)


    **Figure 1.1.** A simple circuit illustrating the basic structure of quantum computation.
    The circuit begins with qubit initialization in the $|0\rangle$ state, followed
    by unitary gate operations (including entangling gates), and ends with measurement
    in the computational basis. This process forms the core abstraction for quantum
    algorithms.


    An essential feature of quantum systems is entanglement, a form of non-classical
    correlation that enables the joint state of multiple qubits to encode information
    that cannot be decomposed into separate components. Entanglement plays a crucial
    role in many quantum algorithms and is often viewed as a resource that allows
    for quantum advantage. In practice, quantum computations are carried out by assembling
    circuits which consist of a sequence of gate operations acting on an initial quantum
    state, followed by a final measurement. Measurement projects the quantum state
    onto a classical outcome according to the Born rule, introducing probabilistic
    behavior even when the evolution is entirely deterministic (figure 1.1).


    Quantum algorithms exploit the unique structure of quantum mechanics to solve
    problems in ways that are inaccessible to classical computation. The development
    of such algorithms—such as Grover''s search or Shor''s factoring—has provided
    theoretical insight and practical motivation for building quantum hardware. These
    foundational algorithms also serve as building blocks in more complex routines,
    including those used in QML. As we progress through this book, we will revisit
    these concepts in more detail, particularly in contexts where they directly inform
    the design of quantum learning models.


