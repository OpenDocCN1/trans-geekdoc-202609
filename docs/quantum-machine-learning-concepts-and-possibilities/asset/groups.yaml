    # Table 8.1. Representative generalization bounds for classical and quantum hypothesis
    classes. Quantum models inherit similar complexity behavior under well-behaved
    spectra or stable training dynamics, but some variational models suffer from barren
    plateaus that hinder generalization.


    | Model type | Complexity measure | Generalization bound | Reference |

    |---|---|---|---|n| Classical kernel (ridge) | Effective dim., $d_{eff}(\lambda)$
    | $e(\frac{d_{eff}(\lambda)}{m})$ | Steinwart et al [8] |

    | Quantum kernel | $d_{eff}(\lambda)$, spectral decay | $e(\frac{d_{eff}(\lambda)}{m})$
    | Schult et al [9] |

    | PQC/QNN (stochastic training) | Training stability, QFIM | PAC-Bayes-type bound
    on measurement-indexed distributions | Abbas et al [10] |

    | PQC (global cost functions) | Gradient norm, barren plateau effect | No meaningful
    bound (exponential gradient variance) | McLean et al [11] |


    Variational quantum models (e.g. PQCs or QNNs) are more challenging to analyse
    directly using classical complexity measures. Instead, generalization bounds are
    often obtained through algorithmic stability arguments or PAC-Bayesian frameworks
    applied to the output distributions of quantum measurements. Some bounds rely
    only on the structure of the QFIM, which governs the circuit''s sensitivity to
    parameters.


    As shown in the final row of table, models with poorly conditioned landscapes
    lack meaningful generalization guarantees, since gradients vanish exponentially
    and training cannot reliably converge. This highlights the need for both expressive
    and trainable architectures when designing quantum learning models.


    # 8.3 Positive results from quantum learning


    This section highlights provable contexts where quantum learners offer advantages
    over classical counterparts. These advantages can manifest in reduced complexity,
    improved computational efficiency, or the ability to realize hypothesis classes
    that are hard to emulate classically.


    # 8.3.1 Query and time complexity speedups


    Several results from quantum learning theory establish that, under specific oracle
    models or problem instances, quantum algorithms can outperform classical ones
    in terms of query complexity and runtime. These separations are typically shown
    in idealized models such as access to quantum membership or evaluation results.


    # 8.3.1.1 Learning juntas


    In the classical setting, learning a $k$-junta (a Boolean function depending on
    $k \ll n$ out of $n$ variables) requires $\Omega(k \log n)$ queries in the worst
    case. Quantum algorithms can reduce this to $O(k)$ with Fourier sampling or Grover-type
    searches [5].'
  - '[PAGE 128]


    # Quantum Machine Learning


    # 8.3.1.2 Fourier-sparse functions


    Concept classes that are sparse in the Fourier domain (i.e. with only a few nonzero
    Fourier coefficients) are more accessible to quantum learners via quantum Fourier
    sampling. In particular, estimating significant Fourier coefficients can be accomplished
    with quadratically fewer samples.


    # 8.3.1.3 Learning parity with noise


    Quantum learners can learn parity functions in the presence of random classification
    exponentially faster than any classical statistical query (SQ) algorithm, due
    to their ability to leverage quantum interference [7].


    These separations demonstrate that quantum learners may access different information-theoretic
    pathways through their interaction with oracles, even when their PAC sample complexity
    does not improve asymptotically.


    # 8.3.2 Quantum kernels and feature maps


    Quantum kernels are a prominent approach in quantum learning where classical data
    $x \in \mathbb{R}^d$ are encoded into quantum states via a unitary feature map
    $U_\phi(x)$, and learning is performed via inner products of the results. The
    kernel is defined as


    ```

    $k(x, x'') = |langle\phi(x)|\phi(x'')\rangle|^2,\quad(8.4)$

    ```


    where $|\phi(x)\rangle = U_\phi(|0\rangle$.

    In some cases, quantum kernels can be hard to simulate or estimate classically.
    This hardness is typically based on assumptions from quantum computational complexity
    (e.g. the hardness of simulating circuits implies classical intractability).


    One example is the quantum kernel estimation (QKE) approach, where the kernel
    entries are estimated on a quantum device and used to train a classical model
    such as a support vector machine (SVM). If the quantum kernel corresponds to a
    circuit that implements a task believed to be classically intractable, the associated
