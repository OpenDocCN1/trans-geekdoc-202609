    # Quantum Machine Learning


    - Entanglement structure: Models that generate highly entangled states tend to
    have more expressive power.

    - Parameterization: Redundant or untrainable parameters can reduce effective expressivity.

    - Measurement scheme: The choice of measurement basis can influence what features
    are observable in the output.


    A useful metric is the frame potential [28, 29], which measures how well a set
    of circuits covers the unitary group. A circuit family with low frame potential
    is closer to forming a unitary 2-design, which is often used as a proxy for high
    expressivity.


    ## 7.3.3 Trade-off with trainability


    - High expressivity can be a double-edged sword. While expressive models are capable
    of learning complex distributions, they may also be prone to:

    - Overfitting in small datasets

    - Barren plateaus, where gradients vanish exponentially with system size [30,
    31]; and

    - Optimization instability when too many parameters interact nonlinearly


    Thus, balancing expressivity with inductive bias and training feasibility is critical
    when designing quantum generative circuits.


    ## 7.4 Training quantum generative models


    Training quantum generative models involves optimizing the parameters of a quantum
    circuit such as the distribution induced by measurement outcomes approximates
    a target distribution. While conceptually analogous to training classical generative
    models, the quantum setting introduces distinctive challenges and opportunities,
    particularly due to measurement stochasticity, non-differentiability, and hardware
    constraints.


    This section outlines the typical training loop, common losses, gradient estimation
    techniques, and specific difficulties encountered during optimization.


    ### 7.4.1 The optimization loop


    - Most quantum generative models follow a hybrid quantum-classical training loop:

    - Initialize parameters $\theta$ for the quantum circuit $U(\theta)$.

    - Generate samples from the circuit by measuring in the computational basis, yielding
    outcomes $x \sim p_\theta(x)$.

    - Estimate a loss function comparing $p_\theta$ to the target distribution $p_{data}$.

    - Update parameters using a classical optimizer (e.g. gradient descent, Adam,
    or SPSA).

    - Repeat until convergence.


    This loop is model-agnostic and applies to QCBMs, QGANs, QVAEs, and other quantum
    generative frameworks.


    ## 7.4.2 Loss functions


    The loss functions guide the model toward better approximation of the target distribution.
    Common choices include:


    - KL divergence [32]:

    $D_{KL}(p_{data} || p_{\theta}) = \sum_{x} p_{data}(x) \log \frac{p_{data}(x)}{p_\theta(x)}.
    \quad (7.14)$

    Requires knowing both distributions and can be unstable if $p_\theta(x)$ vanishes.


    - Maximum discrepancy (MMD) [33]:

    $L_{MMD} = E_{x,x'' \sim p_{data}}[k(x, x'')] + E_{y,y'' \sim p_{data}}[k(y, y'')]
    - 2E_{x \sim p_{data}, y \sim p_{data}}[k(x, y)], \quad (7.15)$

    where $x, x'' \sim p_{data}$, $y, y'' \sim p_{data}$, and $k$ is a kernel function
    (e.g. Gaussian). MMD is popular in QCBMs due to sample-based and gradient-free
    nature.

    - Adversarial loss: Used in QGANs, where a discriminator is trained simultaneously
    to distinguish real generated data.

    - Reconstruction + regularization losses: Used in QVAEs, combining negative log-likelihood
    with KL divergence over latent variables.


    ### 7.4.3 Gradient estimation


    Unlike classical neural networks, gradients in quantum models are not obtained
    via automatic differentiation. Instead, parameter-shift rules and finite difference
    estimators are used.


    For a parameter $\theta$ appearing in a gate of the form $e^{-iG\theta}$, where
    $G$ has two distinct eigenvalues $\pm\lambda$, the derivative of an expectation
    value $(O)$ can be computed as


    $\frac{\partial(O)}{\partial\theta} = \frac{1}{2}\left(\langle O_{\theta+\frac{\pi}{2}}\rangle
    - \langle O_{\theta-\frac{\pi}{2}}\rangle\right). \quad (7.16)$


    This allows gradient computation using only circuit evaluations at shifted parameter
    values.


    For non-differentiable objectives (e.g., discrete outputs, sample-based losses
    such as MMD), gradient-free optimizers are used. These are robust to noise but
    may require more iterations to converge.


    ## 7.4.4 Training challenges


    QGMs face similar obstacles during training that are encountered by other variational
    algorithms:


    - Shot noise and statistical error: Estimates of loss and gradients only on finite
    sampling from quantum hardware, introducing variance.

    - Barren plateaus: Variational circuits can exhibit exponentially vanishing gradients
    in high-dimensional Hilbert spaces, in particular with random or deep ansätze.

    - **Mode collapse**: Especially relevant in adversarial training, where the generator
    fails to capture the diversity of the data distribution. This can also be encountered
    due to the prevalence of spurious minima in the optimization landscape.

    - **Hardware constraints**: Real quantum devices have limited qubit counts, gate
    fidelity, and coherence times, which restrict circuit complexity and batch sizes.


    ## 7.5 Case studies and applications


    QGMs offer a flexible and powerful framework for learning and synthesizing distributions
    that are difficult or inefficient to represent classically. This has opened the
    door to a wide range of applications in quantum physics, machine learning, optimization,
    and sensing. In this section, we highlight some cases where QGMs have shown promise
    or achieved early success, and discuss the potential for scaling these techniques
    in quantum computing workflows.


    ### 7.5.1 Learning classical data distributions


    A major line of research focuses on using QCBMs, QGANs, and hybrid VAEs to learn
    structured classical datasets. These include:


    - **Binary images** with bars-and-stripes or small MNIST digits,

    - **Correlated patterns** from spin models or statistical physics, and

    - **Synthetic tabular data** with controllable complexity.


    In these cases, quantum models are trained to reproduce a classical probability
    distribution $P_{data}(x)$ by minimizing a divergence (e.g. KL or MMD). Because
    QCBMs encode the distribution directly into quantum amplitudes, they offer a natural
    advantage in representing highly entangled or non-factorizable correlations that
    may be difficult for shallow classical models.


    For example, in a recent study [34], QCBMs were used to learn event distributions
    from simulated high-energy physics experimental data, demonstrating that quantum
    circuits with modest depth and hardware-efficient layout can successfully model
    nontrivial correlations present in collider observables.


    ### 7.5.2 Quantum state learning and tomography


    QGMs can be used to learn and reconstruct unknown quantum states, an application
    that leverages their quantum-native architecture. The goal is to train a parameterized
    circuit $U(\theta)$ such that its output matches a target state $\rho_{target}$
    through fidelity-based loss:


    $L_{fidelity} = 1 - F(\rho_\theta, \rho_{target}), \quad \text{where} \quad F(\rho,
    \sigma) = (\text{Tr}\sqrt{\sqrt{\rho}\sigma\sqrt{\rho}})^2. \quad (7.17)$


    This approach bypasses full state tomography and has been shown to scale for higher-dimensional
    systems [35]. It is particularly well-suited for applications in quantum chemistry
    and state preparation.


    ### 7.5.3 Quantum circuit compilation and data compression


    The ability of QGMs to approximate arbitrary distributions or states also enables
    applications in data compression. For instance, once a quantum state is learned
    via QVAE, one can extract a latent representation that is lower-dimensional or
    more efficient. In this context:


    - The encoder maps a high-complexity state to a latent space

    - The decoder reconstructs the state from fewer quantum resources.


    This can be used to compress outputs of variational algorithms [36] or to recompile
    deep circuits into shallower ones with similar performance [37].


    ### 7.5.4 Anomaly detection


    An emerging application of QGMs is in anomaly detection, where the model is trained
    to learn a baseline distribution (either quantum or classical), and deviations
    from it are used to flag rare or unexpected inputs. These include:


    - Quantum noise or hardware errors

    - Novel events in experimental data (e.g. in particle physics)

    - Out-of-distribution detection in classical data streams.


    Fidelity-based metrics, expectation values of observables, or distance in latent
    space can all be used as anomaly scores. For example, QGANs have been tested for
    anomaly detection in high-energy physics, where quantum resources may help distinguish
    subtle features with fewer samples [38].


    ### 7.5.5 Physical simulation and sampling


    QGMs have also been proposed as variational samplers in quantum Monte Carlo methods
    or for preparing input distributions in Hamiltonian simulation. Applications include:


    - Sampling from Gibbs or Boltzmann distributions

    - Preparing ground states of physical Hamiltonians

    - Modeling time-evolved states via QCBMs or quantum flows.


    Recent work [39] has shown that **quantum phase estimation** (QPE) can be reinterpreted
    as a quantum generative model for sampling **dynamical response functions** of
    many-body systems. By encoding spectral densities into a quantum circuit, one
    can efficiently sample from distributions representing observables such as the
    dynamic structure factor, optical conductivity, and nuclear magnetic resonance
    (NMR) spectra.

