    # Quantum Machine Learning

    Concepts and possibilities


    **Andrea Delgado and Kathleen E Hamilton**


    # Chapter 3


    # Information encoding


    Encoding classical data into quantum states is a foundational task in quantum
    computing and, by extension, quantum machine learning (QML). The choice of encoding
    not only determines how classical information is mapped to Hilbert space but also
    directly influences the expressiveness and trainability of quantum circuits. The
    study of quantum data encoding can be traced back to early quantum algorithms
    such as the quantum Fourier transform (QFT) [1] and Grover''s algorithm, where
    classical inputs were embedded using basic encoding or amplitude encoding techniques.


    The theoretical implications of data encoding renewed attention as QML matured
    into a distinct field. Schuld and Petrucchio (2020) [2], and later Schuld, Bocharov,
    Wiebe, and Svore (3], emphasized that the data-loading step can be computationally
    costly and may negate quantum speedups if not addressed carefully. Various encoding
    strategies have been proposed, including basis, amplitude, angle, and Hamiltonian
    based encodings, each with trade-offs in terms of circuit depth, qubit count,
    and noise.


    Recent literature has led to consider the induced bias by different encodings
    [4], the complexity of state preparation [5] and the limitations posed by barren
    plateau during training [6]. A recurring theme is that while quantum models offer
    theoretical advantages, their practical utility hinges on encoding schemes that
    are both expressive and resource-efficient.


    This chapter provides a comprehensive treatment of information encoding strategies
    for QML. We begin by reviewing classical approaches to data representation and
    proceed to formalize the quantum counterparts using rigorous formulations. We
    then identify major challenges associated with encoding, including state preparation
    complexity, hardware limitations, and optimization issues. Finally, we highlight
    emerging opportunities in the design of encoding strategies for noisy intermediate-scale
    quantum (NISQ)-era algorithms and beyond.'
