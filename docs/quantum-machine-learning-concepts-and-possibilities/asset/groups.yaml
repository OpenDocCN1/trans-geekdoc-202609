    # Quantum Machine Learning


    Several quantum machine learning frameworks provide infrastructure for hybrid
    auto-differentiation:


    +   - **PennyLane [18]** enables full differentiable quantum-classical graphs,
    supporting PyTorch, TensorFlow, JAX backends. It exposes *quantum nodes* with
    built-in gradients and supports end-to-end optimization with standard optimizers.

    - **Qiskit Machine Learning [19]** integrates with PyTorch via custom TORCHCONNECTOR
    modules and supports parameter-shift gradients or finite-difference estimators
    on IBM backends or simulators.

    - **TensorFlow Quantum [20]** supports differentiable quantum layers integrated
    with classical TensorFlow/Keras pipelines. It uses adjoint differentiation in
    simulation and sampling-based gradient rules on.


    These frameworks automatically keep track of which parts of the graph are quantum
    versus classical, and invoke the correct gradient rules accordingly.


    **Hybrid training loop**

    Consider a model where a quantum circuit produces a real-valued output $f(x; 0)$
    used in a logistic regression task. The loss might be


    > $L(f, y) = -y\log(f) - (1 - y)\log(1 - f).$ (6.6)


    +   During training:

    - The **forward pass** evaluates the quantum circuit on input $x$, measures the
    observable, and computes is stored in the graph.

    - The loss $L$ uses uses, the scalar output $f$.

    - The **backward pass** starts from $

    abla_f L$, uses quantum gradient rules to evaluate $

    abla(f)$, and applies the chain rule to compute $

    abla_x L$.

    - A classical optimizer (e.g. Adam) updates the parameters $\theta$.


    The entire process is transparent to the user, who simply defines the model and
    loss in a declarative way, like building a classical neural network.


    # Differentiability in practice


    Differentiability across the quantum-classical boundary is possible only because
    quantum circuits can be expressed as expectation-value functions, given suitable
    gates and observables. However, differentiability **does not mean analyability**
    due to sampling noise, barren plateaus, and hardware limitations; must be taken
    to ensure gradients are informative and reliable.


    Nevertheless, hybrid autodiff has made variational quantum models practical. It
    enables the integration of quantum modules into large-scale machine learning systems,
    facilitating experimentation with architectures where quantum computation plays
    a meaningful, trainable role.'
  - "[PAGE 79]\n\n# 6.2.2 Parameter-shift rule\n\nOne of the main break-throughs enabling\
    \ the training of variational quantum circuits on quantum hardware is the parameter-shift\
    \ rule (PSR) [21]. This rule allows us to compute the gradient of an expectation\
    \ value with respect to a circuit parameter, using only evaluations of the quantum\
    \ circuit at shifted values of the parameter, meaning no access to the internal\
    \ quantum state or wavefunction is required. This makes the PSR a hardware-friendly\
    \ and analytically exact method for computing gradients on NISQ devices.\n\n#\
    \ Mathematical derivation\n\nSuppose we have a parameterized quantum circuit $U(\\\
    theta)$ composed of gates where a specific gate $R(\theta)$ has the form\n\n```\n\
    $R(\\theta) = e^{-i\\theta G},\n```\n\nwhere $G$ is a Hermitian generator with\
    \ two distinct eigenvalues $\\pm r$ (common case: $r=\\frac{1}{2}$, as in Pauli\
    \ rotations).\n\nLet the circuit prepare the quantum state,\n\n```\n$|psi(\\theta)\\\
    rangle = U(\\theta)|\\psi_0\\rangle$,\n```\n\nand let the output be the expectation\
    \ value of some observable $M$:\n\n```\n$f(\\theta) = \\langle\\psi(\\theta)|M|\\\
    psi(\\theta)\\rangle$,\n```\n\nThen the parameter-shift rule states\n\n```\n$\\\
    frac{\\partial f}{\\partial\\theta} = \\frac{1}{2}[f(\\theta+\\frac{\\pi}{4r})\
    \ - f(\\theta-\\frac{\\pi}{4r})],$\n```\n\nwhere $s=\\frac{\\pi}{4r}$,\n\nFor\
    \ the common case $G=\\frac{1}{2}Z$ (i.e. single-qubit rotation gates such as\
    \ $R_X, R_Y, R_Z$), this simplifies to\n\n```\n$\\frac{\\partial f}{\\partial\\\
    theta} = \\frac{1}{2}[f(\\theta+\\frac{\\pi}{2}) - f(\\theta-\\frac{\\pi}{2})],$\n\
    ```\n\nThis result is exact and does not involve finite-difference approximations\
    \ or knowledge of the wavefunction, only evaluations of the same circuit with\
    \ different parameter values.\n\n# Intuition\n\nIn variational circuits, parameterized\
    \ gates are often single qubit rotations about the (X, Y, and Z) axes:\n\n+  \
    \ * $R_X(\\theta) = e^{-i\\theta X/2}$,\n* $R_Y(\\theta) = e^{-i\\theta Y/2}$,\n\
