  - '[PAGE 73]


    # Quantum Machine Learning


    Concepts and possibilities


    Andrea Delgado and Kathleen E Hamilton


    # Chapter 6


    # Variational classifiers and neural networks


    The fusion of quantum computing and machine learning has led to the emergence
    of variational quantum classifiers. These models leverage quantum circuits to
    perform classification tasks by optimizing parameters through training. These
    models sit at the intersection of physics, optimization theory, and computational
    learning, continuing the historical trend of variational approaches in quantum
    mechanics that was explored in the previous chapter.


    While classical neural networks have undergone decades of development since their
    conceptual origins in the 1940s with McCulloch and Pitt''s formal neural model[1,
    4], the idea of training a quantum circuit for classification is far more recent.
    However, the inspiration is rooted in a long lineage of ideas: from the variational
    principles used in chemistry to approximate ground states, to the optimization
    of circuit parameters for learning tasks in today''s intermediate-scale (NISQ)
    devices.


    The variational circuit (VQC) as a model of computation emerged in part as a response
    to the limitations of fully quantum or classical models. Early work in this direction,
    such as the quantum perceptron [2] or the quantum neural network[3], introduced
    the idea of learning from quantum devices. However, these efforts lacked a feasible
    implementation route. It was with the advent of hybrid quantum-classical algorithms,
    notably the variational eigensolver (VQE) and quantum approximate optimization
    algorithm (QAOA) (discussed in chapter 5), that a practical training using quantum
    circuits became viable.


    This chapter picks up from the previous discussion of variational optimization
    and examines how hybrid training frameworks can be adapted for classification
    tasks. In these settings, a parameterized quantum circuit plays a role analogous
    to a neural network layer. Input data are encoded into quantum states, transformed
    through variational gates, and measured to yield predictions. The loss is then'
  - '[PAGE 74]


    computed using classical resources, and parameters are optimized via gradient
    descent.


    The potential advantage of this approach lies in its use of quantum state space
    as a learning resource. Even with a modest number of qubits, the expressivity
    of a quantum classifier may exceed certain classical models, particularly when
    using data re-reloading [5] or quantum kernel-inspired architectures. Yet, practical
    deployment is far from straightforward. Proof-of-principle experiments on such
    image classification and state discrimination can be compared to classical neural
    networks through analysis of dimensionality and capacity (see chapter 8). However,
    fully understanding the differences between classical and quantum learning dynamics
    remains an open question and challenges such as barren plateaus, circuit noise,
    and limited connectivity make scaling up of quantum neural models a non-trivial
    question.


    In this chapter, we provide a self-contained introduction to quantum variational
    classifiers and hybrid neural networks, describe the training procedure including
    quantum-compatible back-propagation and gradient estimation, and discuss the challenges
    and opportunities for implementation on current and near-term hardware. This discussion
    sets the stage for the next chapter, which shifts from discriminative models to
    quantum generative models (chapter 7), where circuits are trained to model data
    distributions.


    # 6.1 Model description


    In this section, we describe the architecture of variational classifiers by contrasting
    them with classical neural networks and highlighting how parameterized quantum
    circuits can be used as building blocks in hybrid learning models.


    # 6.1.1 Classical neural networks


    Classical neural networks are computational models inspired by the functioning
    of the human brain. At their core, they consist of simple processing units—artificial
    neurons—organized in layers (figure 6.1). Each neuron receives inputs, performs
    a linear combination of them (through weights and biases), and applies a nonlinear
    activation function to produce its output. This enables the network to model complex,
    nonlinear relationships between input and output data.


    The basic building block of a feed-forward neural network is a layer that maps
    an input vector **x** $\in \mathbb{R}^n$ to an output vector **y** $\in \mathbb{R}^m$
    via


    ```

    $\mathbf{y} = \sigma(\mathbf{W}\mathbf{x} + \mathbf{b}), \quad (6.1)$

    ```


    where:


    +   - **W** $\in \mathbb{R}^{m\times d}$ is the weight matrix,

    - **b** $\in \mathbb{R}^m$ is the bias vector, and

    - **$\sigma$** is an element-wise nonlinear activation function, such as the rectified
    linear unit (ReLU), sigmoid, or hyperbolic tangent.'
