    - **在实践中较少见**：最邻应用仍然由 Pauli 旋转门和受控非门（CNOT）组成的电路主导，在这些情况下，标准 PSR 就足够了。


    然而，随着量子比特的表达能力增强并结合了更多样化的集合（例如，在模拟量子计算或哈密顿量模拟中），泛化 PSR 可能会变得越来越重要。


    # 替代方案：门分解


    在实践中，与其直接应用泛化规则，不如将复杂集合分解为具有已知参数位移规则的标准门通常更为优越。例如：


    - 受控旋转门可以分解为基础 Pauli 旋转加 CNOT 门。

    - 多轨道酉算子可以分解为通用门集（例如 Clifford + T），从而能够使用基础的 PSR。


    这种策略减少了为每个新门开发位移规则的负担，但代价是增加了电路深度。


