    QAOA [19] 是一种用于解决组合优化问题的变分算法。QAOA 通过将问题编码到经典代价函数 $C(z)$ 来工作，其中 $z \in \{0, 1\}^n$
    代表位串，并构造代价哈密顿量 $H$，其特征值对应于不同解的代价值。


