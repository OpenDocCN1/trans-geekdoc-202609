    ### 6.4.1 Trainability and optimization


    One of the most pressing challenges in training variational classifiers is the
    emergence of barren plateaus, regions in parameter space where the gradient vanishes
    exponentially with system size. These regions hinder the optimizer''s ability
    to explore the landscape effectively and result in slow or stalled convergence.
    The problem is particularly acute in deep circuits, randomly initialized ansates,
    or global cost functions. While initialization strategies, local cost functions,
    and symmetry-preserving architectures (such as QCNNs or QNNs) offer partial mitigation,
    a systematic theory of trainability remains an open research frontier.


    Moreover, noisy gradient estimation due to finite sampling introduces significant
    variance during training, in particular when computing gradients via the parametersshift
    rule. This effect compounds with the circuit depth and number of parameters, making
    training on real hardware time-consuming and error-prone. Recent advances in adaptive
    batching, momentum-aware optimizers, and gradient variance reduction techniques
    show promise, but their integration with quantum circuits is still under active
    development.


