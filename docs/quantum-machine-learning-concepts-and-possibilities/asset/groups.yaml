    ## 3.3 自动编码器


    自动编码器 [9, 10] 是一种用于学习数据高效低维表示的机器学习模型。在经典设置中，自动编码器由一个编码器 $E: \mathbb{R}^d \to \mathbb{R}^d$
    和一个解码器 $D: \mathbb{R}^d \to \mathbb{R}^d$ 组成，联合训练以最小化重构损失：


    $$\mathcal{L}(x) = \|D(E(x)) - x\|^2 \quad (3.9)$$


    学习到的表示 $z = E(x)$ 理想情况下以压缩格式捕捉输入数据中最显著的特征。量子自动编码器 (QAE) [11] 将此概念扩展到量子数据（比较表 3.2
    经典和量子自动编码器），旨在将量子态压缩到希尔伯空间的同时保留关键信息。设 $|\psi\rangle_{in} \in \mathcal{H}_A \otimes
    \mathcal{H}_B$，其中 $\dim(\mathcal{H}_A) = 2^n$ 且 $\dim(\mathcal{H}_B) = 2^m$。QAE
    寻求一个酉算符 $U$，使得：


    $$U|\psi\rangle \approx |\psi\rangle_A \otimes |0\rangle_B, \quad (3.10)$$


    其中 $|\psi\rangle_A$ 编码压缩后的信息，$|0\rangle_B$ 是丢弃子系统的固定参考态。变分量子自动编码器 (VQAE) [12]
    中使用的损失函数通常形式为


    $$\mathcal{L}_{QAE} = 1 - \text{Tr}[\rho_B|0\rangle\langle 0|] \quad (3.11)$$


    其中 $\rho_B = \text{Tr}_A[|\psi\rangle\langle\psi|U^\dagger]$ 是丢弃子系统的还原密度矩阵。当丢弃子系统去纠缠并处于参考态时，损失最小，从而实现成功的压缩。


    ### 3.3.1 电路构建


    VQAE 通过一个参数化电路 $U(\theta)$ 实现，该电路在输入态集合 $|\psi_i\rangle$ 上进行训练。优化后，$U(\theta^*)$
    将关键自由度编码到量子比特子集中，同时将剩余量子比特映射到 $|0\rangle$。解码器由 $U^*(\theta^*)$ 给出，它恢复了原始态的近似：


    $$|\psi_j\rangle \approx U^*(\theta^*)(|\phi_j\rangle_A \otimes |0\rangle_B).
    \quad (3.12).$$


    表 3.2 经典与量子自动编码器的比较。

    | 方面 | 经典自动编码器 | 量子自动编码器 |

    | --- | --- | --- |

    | 输入 | 实值向量 $x \in \mathbb{R}^d$ | 量子态 $|\psi\rangle \in \mathcal{H}_{in}$ |

    | 隐空间 | $\mathbb{R}^{d''}$，其中 $d'' < d$ | 子系统 $\mathcal{H}_A \subset \mathcal{H}_{in}$
    |

    | 编码器 | 神经网络 $E(x)$ | 参数化酉算符 $U(\theta)$ |

    | 解码器 | 神经网络 $D(z)$ | $U^*(\theta)$ |

    | 损失函数 | 重构误差 $\|D(E(x)) - x\|^2$ | 投影保真度 $1 - \text{Tr}[\rho_B|0\rangle\langle
    0|]$ |

    | 应用 | 降维、去噪 | 态压缩、误差缓解、量子道容量 |


    ### 3.3.2 应用与相关性


    QAE 是量子机器学习 (QML) 广泛框架内强大且灵活的组件。QAE 的核心设计目标是将量子态压缩到较小的子空间，同时保留下游任务所需的关键信息。这种减少量子态维度的能力对实际应用和理论研究具有深远影响。在内存、相干时间或量子比特可用性等量子资源有限的背景下，QAE
    为更有效地利用这些资源提供了途径。它们能够用更少的量子比特表示复杂的量子数据，这一点尤为重要。


    ## 3.4 量子数据


    量子数据的概念是指本质上是量子的信息，与由确定或概率赋值组成的经典字符串不同。量子数据编码在系统的态中，数学上由复希尔伯空间中的向量（纯态）或密度矩阵（混合态）描述。量子数据自然出现在许多科学领域，包括量子物理、化学和计量学。


    ### 3.4.1 定义与表示


    形式上，量子数据对应于 $\rho \in \mathcal{D}(\mathcal{H})$，其中 $\mathcal{D}(\mathcal{H})$
    表示希尔伯空间 $\mathcal{H}$ 上的密度算符。纯量子数据由 $|\psi\rangle \in \mathcal{H}$ 描述，而混合量子数据则可能代表了经典不确定性或与环境的纠缠。这些态可以通过实验制备或产生量子电路。从信息论的角度来看，由于以下特性，量子数据与经典数据有本质区别：


    - **叠加**：量子态可以编码连续的幅度，从而具有丰富的表达能力。

    - **纠缠**：量子数据在子系统间表现出非经典相关性，可以编码结构化的全局信息。

    - **不可克隆**：量子数据通常无法在不受到干扰的情况下进行复制，这限制了监督学习语文中对训练样本或标记数据的访问。

