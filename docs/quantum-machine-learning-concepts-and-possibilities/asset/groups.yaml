    terms）以提高收敛，以及显式强制约束的混合算符修改也是机会所在。这些约束在保持可行性的有效地引导优化 [48, 49]。


    除了固定的拟态，自适应变分算法提供了一种动态电路构建方法。诸如 ADAPT-VOE 和基于算子的扩展方法从最小拟态开始，根据梯度信息或能量启发式迭代添加算子。这些自适应框架在发现针对特定问题实例的紧凑、高表达电路方面具有巨大前景，可能避免与高表达力或随机初始化电路相关的开销。此外，通过仅在需要时扩展电路，自适应方法缓解了荒漠高原（barren
    plateaus）和参数过度的问题。


    变分算法也是量子感知优化策略进展的沃土。与计算高效的传统机器学习场景不同，变分量子算法必须应对噪声评估和随机梯度。这促使了对量子噪声稳健的优化策略的发展，例如随机偏移估计器
    [50]、稳健梯度下降 [51] 和贝叶斯优化 [52]。进一步的机会存在于探索量子感知优化器调度中，其中超参数根据噪声或信号强度动态调整，以及将经典代理模型与量子评估相结合以加速收敛。


    另一个重要机会在于变分电路中表达力和纠缠的强度。越来越多的理论工作正寻求理解电路表达力、训练性和泛化能力之间的权衡 [53, 54]。


    诸如表达力（衡量拟态探索希尔伯特空间的程度）、纠缠熵和费舍尔信息几何等指标为设计更好的变分形式提供了见解 [55]。这一研究方向为更有原则的构建打开了大门，使设计者能够根据问题规模和噪声容差使用表达力。


    与此同时，为变分算法定制的**误差缓解任务**所需的重复测量显示出巨大潜力。这些算法依赖统计估计，可以从误差缓解策略中受益，如零噪声外推 [56]、测量误差修正
    [57, 58]、虚拟蒸馏 [7] 和 Clifford 数据回归 [59]。这些方法某些特别适用于变分工作流，因为它们利用了重复电路的结构并可以嵌入训练循环中。


    最后，也许最令人兴奋的是**变分技术在能量最小化之外的扩展**。尽管最初设计用于寻找量子化学中的基态，但变分范式此后被广泛应用于，包括量子建模、核估计、量子分类器甚至量子控制。变分框架的灵活性允许其扩展到监督学习、无监督聚类和强化学习任务——代价函数可以在量子电路上进行评估。这些发展表明，变分算法可能成为近期量子机器学习和科学计算的基础。


    随着领域的成熟，量子电路设计、经典优化、噪声感知方法和特定特定建模的收融合可能会推向变分算法所实现的边界。这些算法并不是 NISQ 局限性的临时补救，而是可能会演变成一种通用的量子计算范式，解锁跨学科的新见解。


    ## 5.4 总结


    变分算法的多功能性使其成为 NISQ 时代量子计算的核心支柱。从量子化学到离散优化，从机器学习到量子控制，它们的应用跨越了广泛的计算需求。虽然这些应用中的许多处于概念证明阶段，但电路设计、优化和噪声缓解方面的持续改进正在快速扩大理论与实用之间的边界。


