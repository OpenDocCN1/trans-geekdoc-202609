    where $\mathcal{F}$ is a (possibly high- or infinite-dimensional) feature space.
    A simple linear model in feature space is given by


    $h(x) = (w, \phi(x)) + b,$


    where $w \in \mathcal{F}$ and $b \in \mathbb{R}$. If $\phi$ is appropriately chosen,
    a linear model can capture nonlinear patterns in the input space (see figure 4.1).


    # 4.1.3 Kernel methods


    Instead of explicitly computing $\phi(x)$, *kernel methods* evaluate inner products
    in the feature space using a *kernel function*


    $k(x, x'') = \langle\phi(x), \phi(x'')\rangle.$


    This trick—known as the *kernel*—allows efficient computation in high-dimensional
    space. A popular example is the radial basis function (RBF) kernel,


    $k(x, x'') = \exp\left(\frac{|x - x''|^2}{2\sigma^2}\right),$


    which corresponds to an infinite-dimensional feature space.


    Kernel methods such as the SVM use kernel functions to construct classifiers with
    strong generalization properties. The dual formulation of the SVM optimization
    problem depends only on kernel evaluations, making it possible to learn complex
    decision boundaries without explicitly constructing the feature-vectors.


    # 4.1.4 Theoretical guarantees


    The use of kernel methods is grounded in the *representer theorem*, which ensures
    that solutions to a wide class of regularized empirical risk minimization problems
    lie in the span of the kernel evaluations on the training set. Furthermore, *Mercer’s*
    theorem guarantees that any continuous, symmetric, positive-definite kernel corresponds
    to an inner product in some Hilbert space.


    ### The kernel trick

    Given a map $\phi: \mathbb{R}^d \rightarrow \mathcal{F}$, the kernel trick allows
    us to compute inner products in $\mathcal{F}$ without explicitly constructing
    $\phi(x)$. That is,


    $$k(x, x'') = \langle\phi(x), \phi(x'')\rangle \quad (4.7)$$


    can be computed directly in the input space. This leads to powerful algorithms
    that operate in high-dimensional or even infinite-dimensional feature spaces with
    computational cost depending only on the size of the dataset.


    These classical techniques motivate quantum counterparts. By replacing classical
    feature maps and inner products with quantum states and overlap amplitudes, one
    can define **quantum kernels** and **quantum-enhanced inference models**. The
    next sections will explore how quantum computing implements these ideas, with
    the potential for exponential expressivity and computational advantages.


    # 4.2 Quantum feature maps


    One of the most promising avenues for leveraging quantum computing in supervised
    learning is the use of **quantum feature maps**. These maps embed classical data
    into high-dimensional quantum states, opening the possibility of using quantum
    hardware to implicitly access large Hilbert spaces that are intractable to simulate
    classically. The inner products between quantum states serve as the foundation
    for **quantum kernel methods** and other quantum-enhanced inference algorithms.


    # 4.2.1 Quantum states as features


    Let us recall the concept of a classical feature map $\phi: \mathbb{R}^d \rightarrow
    \mathcal{F}$, where $\mathcal{F}$ is a high-dimensional feature space. In the
    quantum setting, the role of $\phi(x)$ is played by a quantum state $|\phi(x)\rangle$,
    prepared by a quantum circuit that encodes the classical data $x$.


    Formally, a *quantum feature map* is a mapping


    ```

    $x \rightarrow |\phi(x)\rangle \in \mathcal{H}, \quad (4.8)$

    ```


    where $\mathcal{H}$ is the Hilbert space associated with an $n$-qubit quantum
    system, i.e., $\mathcal{H} \simeq (\mathbb{C}^2)^{\otimes n}$. The quantum circuit
    that prepares $|\phi(x)\rangle$ is often denoted by $U_{\phi}(x)$, such that


    ```

    $|\phi(x)\rangle = U_{\phi}(x)|0\rangle^{\otimes n}. \quad (4.9)$

    ```


    The encoding circuit $U_{\phi}(x)$ may include data-dependent gates such as $R_y(x)$,
    and the choice of encoding affects the performance of quantum algorithms.


    # 4.2.2 Data encodings for feature maps


    Several encodings were introduced for. Here, we briefly recall their relevance
    in quantum methods:


    - **Basic encoding**: Encodes strings directly into feature space.

    - **Amplitude encoding**: Represents $x$ as quantum state:

    ```

    $|\phi(x)\rangle = \sum_{i=1}^{2^n} x_i |i\rangle \quad (4.10)$

    ```

    - **Angle encoding**: Maps $x$ to rotation:

    ```

    $|\phi(x)\rangle = \bigotimes_{j=1}^n e^{i x_j Z_j} |+\rangle. \quad (4.11)$

    ```

    - **Hamiltonian encoding**: Applies unitary evolution $e^{-iHt}$ data.


    # 4.2.3 Properties of quantum feature maps


    Quantum feature maps are designed to:


    - **Expressive**: Capture complex relationships in Hilbert space.

    - **Hard to simulate classically**: Due to the exponential size of the Hilbert
    space.

    - **Implicitly high-dimensional**: In the number of qubits $n$.


    **Table 4.1.** Comparison of classical and quantum feature maps.


    | Property | Classical feature map $\phi(x)$ | Quantum feature map $|\phi(x)|$
    |

    | :--- | :--- | :--- |

    | Domain | $\mathbb{R}^d \rightarrow \mathcal{F}$ | $\mathbb{R}^d \rightarrow
    (\mathbb{C}^2)^{\otimes n}$ |

    | Representation | Explicit vector | Quantum state prepared by circuit |

    | Dimensionality | Often infinite (e.g., RBF) | Exponential in number of qubits
    |

    | Inner product | $\langle\phi(x), \phi(x'')\rangle$ | $|\langle\phi(x)|\phi(x'')\rangle|^2$
    |

    | Potential benefit | Improved separability | Compact and expressive embeddings
    |


    These properties make quantum feature maps central to machine learning. In table
    4.1, we present a comparison to highlight similarities. In the next section, we
    will see how quantum feature maps induce quantum kernels.


    # 4.3 Quantum kernels and kernel methods


    The concept of a kernel is central to many inference algorithms, particularly
    for SVMs and Gaussian processes. When data are encoded into quantum states via
    a quantum feature map $x \mapsto |\phi(x)|$, the inner product between these states
    defines a *quantum kernel*. Quantum kernels offer a natural extension of classical
    methods into the quantum regime, with the potential to represent highly expressive
    similarities that are difficult to compute classically.


    # 4.3.1 Quantum kernel definition


    Given a quantum feature map $|\phi(x)|$, the associated quantum kernel is defined
    as


    ```

    $\kappa(x, x'') = |\langle\phi(x)|\phi(x'')\rangle|^2 \quad (4.12)$

    ```

