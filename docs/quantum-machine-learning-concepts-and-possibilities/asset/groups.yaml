    # Author biographies


    # Dr Andrea Delgado


    Dr Andrea Delgado is a Research Scientist in the Physics Division at Oak Ridge
    National Laboratory. Her research focuses on quantum computing applications to
    high-energy physics, with an emphasis on developing novel algorithms for data
    analysis and simulation in large-scale particle physics experiments, such as those
    at the Large Hadron Collider. She is a recipient of the prestigious Eugene Wigner
    Fellowship, awarded for her pioneering work at the intersection of quantum information
    science and fundamental physics. Dr Delgado serves on the steering committee of
    the IBM/CERN Quantum Computing for High Energy Physics Working Group and has played
    a leadership role in IEEE Quantum Week since its inception, multiple terms as
    Technical Program Chair. She is also an Associate Editor for IEEE Transactions
    on Quantum Engineering. Dr Delgado received her PhD in Physics from Texas A&M
    University, where she specialized in searches for new physics. Her current work
    explores quantum machine learning, quantum generative modeling, and hybrid quantum-classical
    algorithms with the aim of advancing discovery in high-energy and nuclear physics.


    # Dr Kathleen E Hamilton


    Dr Kathleen E Hamilton is a Research Scientist in the Quantum Computational Science
    Group at Oak Ridge National Laboratory. Her research interests cover the development
    of benchmarks and algorithms for next-generation processors in quantum computing
    or neuromorphic computing. Her work in quantum machine learning includes designing
    new approaches for natural language processing, reservoir computing, and using
    machine learning workflows to benchmark near-term quantum devices. She has served
    on the Program Committee for the International Conference on Neuromorphic Systems
    (ICONS) from 2019 to 2021, and has organized the Quantum Artificial Intelligence
    Workshop which has been a part of IEEE’s Quantum Week since 2020. She received
    her PhD from the University of California at Riverside.'
