    # 2.5 Quantum gates and circuits


    In the realm of classical computing, gates are used to manipulate binary data.
    Gates, such as AND, OR, and NOT, transform input bits into specific output bits
    based on well-defined logic operations. When transitioning to the quantum realm,
    we require a new set of tools to perform operations on our quantum data—the qubits.
    These tools come in the form of quantum gates.


    # 2.5.1 Quantum gates


    Quantum gates are fundamental operations that allow for the manipulation of qubits
    in a quantum computer. Like their classical counterparts, these gates dictate
    the behavior of the system. However unlike classical gates that deal with definitive
    0s and 1s, quantum gates handle qubits, which can be in a superposition of 0 and
    1 states.


    The operations of classical gates are deterministic. When you know exactly what
    the output will be. Quantum gates, on the other hand, operate in the probabilistic
    realm of quantum mechanics. Their actions are non-destructive; instead of setting
    a qubit to a specific state, quantum gates transform qubits in ways that evolve
    their state in the complex space of possible quantum states. For instance, whereas
    a classical NOT gate would flip a bit from 0 to 1 and vice versa, its quantum
    counterpart, when the qubit is in a superposition state, the outcome becomes less
    predictable.


    Mathematically, quantum gates are represented by unitary matrices. In quantum
    mechanics, unitary operations are crucial because they preserve the length of
    vectors in the state space, ensuring that probabilities sum to one. This ensures
    the conservation of quantum information during computation, aligning with one
    of the core principles of quantum mechanics. Quantum gates include single-qubit
    gates (X, Y, Z, H, S, T) and multi-qubit gates (CNOT, Toffoli, SWAP). See table
    2.1.


    # Universal gate sets


    Any quantum computation can be approximated using the Clifford + T gate set. This
    set combines the Clifford group, generated by the Hadamard (H), Phase (S), and
    Controlled-Not (CNOT) gates, with the non-Clifford T (or π 8) gate. The Clifford
    gates alone can be efficiently simulated classically, but adding the T gate promotes
    to universality, any unitary operation can be approximated to arbitrary accuracy.
    The Solovay-Kitaev theorem [6] guarantees decomposition into a universal set.'
