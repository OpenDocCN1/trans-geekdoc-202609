    define interactions via entangling gates. This approach is conceptually simple
    but requires flexible compilation pipelines, in particular for irregular graphs.

    - **Dynamic QGNN:** The graph is fully embedded or encoded into a fixed-size quantum
    state, and a general-purpose variational circuit is used to process this state.
    Information about the graph structure is introduced through parameter initialization,
    gate placement, or feature re-loading. This method decouples circuit topology
    from input topology but may lose some inductive biases.


