    and estimate the gradient


    $$\hat{g}_k = \frac{f(\theta^+) - f(\theta^-)}{2c_k(\Delta_k)} (6.21)$$


    Key features:


    - Requires two circuit evaluations per training step, regardless of parameter
    count.

    - Particularly useful in high-dimensional optimization tasks or where evaluating
    gradients is expensive.

    - Can be used with noisy or partially inaccessible quantum hardware, including
    analog devices.


    Pros:


    - Dimension-independent cost (two evaluations per update).

    - Naturally noise-tolerant and robust to gradient sparsity.

    - Suitable for noisy hardware, black-box models, and non-differentiable settings.


    Cons:


    - Gradient estimates have high variance.

    - Convergence is slower compared to exact gradients.

    - Often requires tuning of learning rate $a_k$ and perturbation size $c_k$.


    ### 6.2.4.3 Practical considerations


    - Use fine differences when PSR is unavailable but you are working with simulators
    or moderately noisy devices where variance is controlled.

