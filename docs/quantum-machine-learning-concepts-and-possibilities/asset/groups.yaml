    \ (6.32)\n```\n\nwhere:\n\n+   - $\\mathcal{U}_i$ are unitary gates (parameterized)\n\
    - $\\mathcal{N}_i$ are noise channels (e.g. depolarizing, amplitude damping).\n\
    \nIn this context, gradient estimation methods that assume pure states become\
    \ inaccurate. Shot noise, stochastic gate noise and hardware drift all contribute\
