    # Quantum Machine Learning


    supervised classification tasks. Beginning with an overview of classical neural
    networks and their core mathematical structure, we introduced their quantum counterparts
    and examined how they can be embedded into hybrid workflows that alternate between
    classical and quantum computation.


    We then focused on the techniques that enable the training of such hybrid models,
    including gradient-based optimization and the implementation of backpropagation
    through parameter-shift rules and adjoint differentiation. Particular attention
    was given to the sources of gradient variance, such as shot noise and stochastic
    bagging, and their implications for convergence and robustness in practical training
    loops.


    Architectural variants, including QCNNs and QNNs, were analysed in terms of their
    inductive biases, depth efficiency, and suitability for structured data. The chapter
    concluded with a discussion of challenges afforded by co-design strategies, expressivity
    theory, and domain-specific quantum model architectures. These discussions lay
    the groundwork for understanding quantum networks not only as theoretical constructs
    but as practical tools in near-term quantum machine learning.


