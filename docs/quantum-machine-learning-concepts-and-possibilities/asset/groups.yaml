    ## 5.1 Model description


    Variational quantum algorithms operate by encoding a problem into a cost function
    that can be evaluated on a quantum device and minimized using classical optimization.
    The fundamental components of a variational algorithm include a parameterized
    quantum circuit (ansatz), a quantum measurement procedure to evaluate the cost,
    and a classical optimization loop that updates the parameters. This hybrid feedback
    mechanism enables efficient exploration of quantum states in the presence of hardware
    limitations.


    Let $|\psi(\theta)\rangle = U(\theta)|\psi_0\rangle$ denote the quantum state
    prepared by a circuit $U(\theta)$, where $|\psi_0\rangle$ is an initial reference
    state. The goal of a variational algorithm is to find the parameters $\theta$
    that minimize a problem-specific cost function, often the expectation value of
    a Hamiltonian operator $H$, by evaluating


    $E(\theta) = \langle\psi(\theta)|H|\psi(\theta)\rangle$ (5.2)$


    This cost is computed by measuring terms in a Hamiltonian decomposition, typically
    in sums of Pauli operators, and combining them classically.


    Two major subclasses of variational algorithms—VQE and QAOA—illustrate the versatility
    of this framework in both continuous and discrete optimization settings.


    ### 5.1.1 Variational quantum eigensolver


    The VQE was introduced as a practical quantum-classical hybrid algorithm to estimate
    the ground-state energy of a quantum Hamiltonian. Its motivation comes directly
    from the variational principle in quantum mechanics: for any trial state $|\psi\rangle$,
    the quantity $\langle\psi|H|\psi\rangle$ provides an upper bound on the ground-state
    energy $E_0$. The closer the trial state is to the true ground state, the lower
    the expectation value will be.


    In VQE, the Hamiltonian $H$ usually represents the electronic structure of a molecule,
    expressed in a second-quantized form using fermionic creation and annihilation
    operators. These operators are mapped to qubit operators via transformations such
    as the Jordan-Wigner [4] or Bravyi-Kitaev [5] mappings. The resulting qubit Hamiltonian
    is a weighted sum of tensor products of Pauli matrices:


    $H = \sum_{i \in \mathbb{R}} c_i P_i, \quad (5.3)$


    where $P_i \in \{I, X, Y, Z\}^{\otimes n}$, and $c_i$ are coefficients defined
    by the problem Hamiltonian. To estimate the energy $E(\theta)$, each term $\langle
    \psi(\theta)|P_i|\psi(\theta)\rangle$ must be measured on the quantum hardware
    and weighted by $c_i$. The number of measurements required can be significant,
    motivating strategies such as measurement grouping [6-8], classical shadows [9,
    10], and basis rotation grouping [11] to reduce measurement overhead.


    The ansatz $U(\theta)$ plays a central role in VQE''s performance. Common choices
    include:


    - **Hardware-efficient ansätze [12]**, which use native gate operations and entangling
    layers.

    - **Problem-inspired ansätze**, such as the UCC [13] ansatz in chemistry.

    - **Adaptive ansätze**, such as ADAPT-VQE [14], which grow the circuit based on
    operator gradients.


    The classical optimizer may be derivative-free (e.g. COBYLA [15], Nelder-Mead
    [16]) or gradient-based (e.g. Adam [17], L-BFGS [18]), depending on whether analytic
    gradients are available or estimable.


    ### 5.1.2 Quantum approximate optimization algorithm


    The QAOA [19] is a variational algorithm designed to solve combinatorial optimization
    problems. QAOA operates by encoding the problem into a classical cost function
    $C(z)$, where $z \in \{0, 1\}^n$ represents a bitstring, and constructing a cost
    Hamiltonian $H$, whose eigenvalues correspond to the cost values for different
    solutions.


    To explore the solution space, QAOA defines a parameterized quantum state by alternating
    between unitaries generated by the cost and a mixing Hamiltonian $H_M$, typically
    chosen as


    $H_M = \sum_{j=1}^n X_j, \quad (5.4)$


    which induces transitions between bitstrings. The QAOA state is then defined as


    $|\psi(\gamma, \beta)\rangle = \prod_{j=1}^p e^{-i\beta_j H_M} e^{-i\gamma_j H_C}|\psi_0\rangle,
    \quad (5.5)$


    where $p$ is the depth or number of QAOA layers, and $\gamma, \beta \in \mathbb{R}^p$
