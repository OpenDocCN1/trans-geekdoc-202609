  md: "\n# Quantum Machine Learning\n\nespecially true in quantum models, where the\
    \ parameter space is often curved due to the geometry of quantum states. In such\
    \ cases, standard gradients can be misaligned with the natural directions of change\
    \ in the state space, leading to poor convergence.\n\nThe **quantum natural gradient\
    \ (QNG)** [25] corrects this by accounting for the Riemannian geometry of the\
    \ quantum state manifold—used in statistical learning to improve convergence by\
    \ adjusting for curvature—by incorporating quantum-specific metrics derived from\
    \ information geometry.\n\n## 6.2.6.1 From Euclidean to Riemannian geometry, the\
    \ update rule is\n\nIn ordinary gradient\n\n```\n$$\\theta = \\theta - \\eta \\\
    nabla_{\\theta} \\mathcal{L},\\quad (6.25)$$\n```\n\nwhere $\\eta$ is the learning\
    \ rate and the gradient is taken with respect to the Euclidean geometry of parameter\
    \ space.\n\nHowever, this approach does not account for how a change in parameters\
    \ affects the quantum state, it ignores the fact that two parameter updates might\
    \ lead to very different magnitudes of change in the underlying state $|\\psi(\\\
    theta)\\rangle$.\n\nThe quantum natural gradient modifies the update rule to follow\
    \ the geodesics of the quantum state by rescaling the gradient using the inverse\
    \ of the quantum Fisher information metric [26, 27], which is equivalent to the\
    \ real part of the quantum geometric tensor (QGT):\n\n```\n$$\\tilde{\\theta}\
    \ = -\\eta F^{-1}(\\theta) \\nabla_{\\theta} \\mathcal{L},\\quad (6.26)$$\n```\n\
    \n## 6.2.6.2 The quantum geometric tensor\n\nThe QGT $F_{\\theta}$ captures how\
    \ sensitive the quantum state is to changes in the parameters. It is defined as\n\
    \n```\n$F_{\\theta}(\\theta) = \\langle\\psi|\\partial_{\\theta}\\partial_{\\\
    theta}|\\psi\\rangle - \\langle\\partial_{\\theta}|\\psi\\rangle\\langle\\psi|\\\
    partial_{\\theta}\\rangle,\\quad (6.27)$\n```\n\nThe **real** part of this quantity\
    \ defines the **Fisher information matrix**, which is used in the QNG:\n\n```\n\
    $Re[F_{\\theta}] = \\mathbf{Cov}\\left(\\frac{\\partial}{\\partial\\theta_i},\
    \ \\frac{\\partial}{\\partial\\theta_j}\\right),\\quad (6.28)$\n```\n\nThe QGT\
    \ behaves like a **local metric tensor**, measuring how far infinitesimal parameter\
    \ changes move the quantum state in the **Fubini-Study metric** (which governs\
    \ distance in projective Hilbert space).\n\n## 6.2.6.3 Why it matters\n\n- In\
    \ regions of parameter space where the quantum state is **insensitive** to parameter\
    \ changes (i.e., the landscape is flat), the natural gradient **boosts updates**.\n\
