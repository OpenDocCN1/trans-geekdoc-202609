    # 量子机器学习


    概念与可能性


    **Andrea Delgado 和 Kathleen E Hamilton**


    # 第2章


    # 量子信息处理


    量子信息理论是物理学和计算机科学的一个分支，涉及量子层级上信息的行为和操纵。它基于量子力学原理，量子力学是描述原子和亚原子尺度下物质和能量行为的基础理论。


    在经典信息理论中，信息由位（bits）表示——即可以取值为 0 或 1 的基本单位。相比之下，量子信息由**量子比特**（quantum bits），或**qubits**表示，它们可以处于态的叠加中，从而实现更复杂的并行计算。


    量子信息理论在量子计算、量子通信、量子加密和量子计量中具有广泛的应用。关键概念包括纠缠、量子隐传态和量子纠错。纠缠描述了量子系统之间无法用经典理论解释的相关性。量子隐传态允许通过经典通信和纠缠来传输态。量子纠错确保了量子信息在存在噪声时的稳健性。


    本章引入了与计算相关的量子力学核心原理，包括量子比特态、门和基于电路的算法。最后一节提供了对**量子力学公理**的概述，并引入了经典算法，如**Deutsch-Jozsa
    算法**和**Grover 算法**，为后续的量子机器学习（QML）讨论奠定。


    ## 2.1 量子计算


    量子计算利用量子力学的原理——叠加、纠缠和干涉来执行计算。由于叠加态的存在，一个**qubit**（比特）可以同时是 0 或 1，其态在二维希尔伯特空间 $\mathcal{H}
    \cong \mathbb{C}^2$ 中表示。


    量子比特的态 $|\psi\rangle = \alpha|0\rangle + \beta|1\rangle$，其中 $\alpha, \beta \in
    \mathbb{C}$ 且 $|\alpha|^2+\|\beta|^2=1$，描述了布洛赫球面上的单位向量。测量将态投影到由二维向量表示的 $|0\rangle$
    或 $|1\rangle$：


    $$|0\rangle = \begin{bmatrix} 1 \\ 0 \end{bmatrix}, |1\rangle = \begin{bmatrix}
    0 \\ 1 \end{bmatrix} \quad (2.1)$$


    概率为 $|\alpha|^2$ 和 $|\beta|^2$。量子系统还表现出纠缠，这是一种非域相关，允许多比特态表现出经典系统无法复制的联合特性。


    量子比特

    量子比特（quantum bit）或 qubit 是量子信息的根本单位。与经典比特只能处于两个确定态（0 或 1）之一不同，qubit 可以同时处于这两种态的叠加态中：


    $$|\psi\rangle = \alpha|0\rangle + \beta|1\rangle$，其中 $|\alpha|^2+\|\beta|^2=1.
    \quad (2.2)$$


    这个抽象的二级系统可以代表广泛的物理实现，例如计算基中的态 (0) 和 (1)，或者自旋为 1/2 粒子的 $-\frac{1}{2}$ 和 $\frac{1}{2}$。


    - 量子比特在进行测量之前一直保持“叠加”态。测量会坍缩叠加态，将量子比特投影到其中一个态。量子系统的行为由一组被称为公理的少量规则支配。


    - 态空间：量子系统是希尔伯特空间中的单位向量 $|\psi\rangle$。

    - 演化：在没有测量的情况下，量子态根据酉变换 $U$ 演化。

    - 测量：观测量对应于厄算符。测量时，系统坍缩为观测量的本征态，概率由波规则给出。

    - 复合系统：复合系统的态空间是张积。当态无法分解时，就会产生纠缠。


    ## 2.2 狄拉克符号

    狄拉克符号是量子力学中描述量子态的一种形式。在狄拉克符号中，向量 $v$ 表示为 $|v\rangle$。它基于 bra-ket 符号，ket 表示列向量，bra
    是其共轭转置。因此，量子比特处于态 0 和态 1 的叠加中：


    $$|\psi\rangle = \alpha|0\rangle + \beta|1\rangle$$


    系数 $\alpha$ 和 $\beta$ 是复数 $(\alpha, \beta \in \mathbb{C})$。bra 和 ket 表示二维希尔伯特空间中的向量，其中
    $|0\rangle$ 和 $|1\rangle$ 构成正交基。bra-ket 符号允许以简洁直观的方式表示内积、外积以及对这些态的其他操作。例如，在这个正交基中，我们可以将
    $|\psi\rangle$ 写为


    $$|\psi\rangle = \begin{bmatrix} \alpha \\ \beta \end{bmatrix}$$


    $\alpha$ 和 $\beta$ 的物理含义是在测量后发现态处于 $|0\rangle$ 或 $|1\rangle$ 的概率 $|\alpha|^2$
    或 $|\beta|^2$。此外，这些概率归一化为1。最后，在狄拉克符号中，bra-ket 符号用于表示量子态和算符。例如，量子态 $|\psi\rangle$
    可以表示为 ket，算符 $A$ 可以表示为 bra-ket 对 $\langle\psi|A|\psi\rangle$。


    ## 2.3 布洛赫球面

    布洛赫一直是二级系统（如 qubit）态的图形表示。布洛赫球面是一个单位球面，北极代表态 $|0\rangle$，南极代表态 $|1\rangle$。任何态都是布洛赫球面上的一个点。例如，态
    $|+ \rangle$ 是 $|0\rangle$ 和 $|1\rangle$ 的叠加，由赤道上位于南北极中间的点表示。


    布洛赫球面

    布洛赫球面上的任意点都代表二级系统的态。

    这种态的推广可以通过参数 $\gamma, \theta, \phi$ 来表示：


    $$|\psi\rangle = e^{i\frac{\phi}{2}}(\cos\frac{\theta}{2}|0\rangle + \sin\frac{\theta}{2}e^{i\phi}|1\rangle)$$


