  - "[PAGE 75]\n\n# Quantum Machine Learning\n\n(0) (1) (2)\n\n![](img/7dbe239d4cc1f635a551b6e06f3d3df9_75_0.png)\n\
    \n**Figure 6.1.** A simple feed-forward neural network architecture with an input\
    \ layer in $\\mathbb{R}^2$, a hidden layer in $\\mathbb{R}^3$ and an output layer\
    \ in $\\mathbb{R}^1$. Each node represents an artificial neuron, and arrows indicate\
    \ the flow of information through weighted connections. This structure explains\
    \ how classical neural networks compute nonlinear mappings from input to output\
    \ via layer-wise transformation.\n\nBy stacking multiple layers, networks are\
    \ able to learn hierarchical representations of data. For instance, in classification,\
    \ the initial layers may learn edges and textures, while deeper layers learn shapes\
    \ and object categories.\n\nDuring training, the network parameters $\theta =\
    \ \\{W, b\\}$ are adjusted to minimize a loss function $L(f(x; \\theta), y)$,\
    \ which quantifies the error between the predicted output and the true label.\
    \ This is typically done via **gradient descent**, stochastic gradient descent,\
    \ or one of its many variants. Gradients are computed using **backpropagation**,\
    \ a recursive application of the chain rule of calculus across the layers of the\
    \ network.\n\nNeural networks are **universal function approximators** [6, 7],\
    \ a feed-forward network with a single hidden layer and sufficient units can approximate\
    \ any continuous function on a compact domain, given the right parameters. This\
    \ powerful theoretical foundation, combined with efficient training methods and\
    \ hardware acceleration (e.g., GPUs), has fueled the rise of deep learning across\
    \ many fields, including computer vision, natural language processing, and scientific\
    \ data modeling. Universal approximation theorems have been derived for deeper\
    \ neural architectures [8].\n\n# 6.1.2 Parameterized quantum circuits as learning\
    \ models\n\nAs introduced in the previous chapter, a parameterized quantum circuit\
    \ (PQC) or variational quantum circuit (VQC) consists of an arbitrary set of quantum\
    \ gates, which are parameterized by a set of controls that determine the outcome\
    \ of the circuit. A specific type of PQC is so-called quantum neural networks\
    \ (QNNs), where the suitable set of parameters for a task is learned on a given\
    \ set of data, resembling the training of a classical neural network [9–11, 13,\
    \ 37].\n\nClassical neural networks provide the architectural and conceptual blueprint\
    \ for variational quantum models. Understanding classical neural networks sets\
    \ the stage for appreciating their quantum counterparts. Quantum circuits, like\
    \ neural networks, consist of sequential transformations applied to inputs, followed\
    \ by a nonlinear output process (in this case, measurement). These gates may be\
    \ fixed"
  - "[PAGE 76]\n\ne.g. Hadamard, CNOT) or parameterized (e.g. $R_X(\\theta), R_Y(\\\
    theta), R_Z(\\theta)$), and their structure defines the *ansatz*, the expressive\
    \ capacity of the model. The general workflow of a VQC classifier is as follows:\n\
    \n+   1. **State preparation** (*data encoding*): Classical input data $x \\in\
    \ \\mathbb{R}^d$ are encoded into a quantum state $|\\psi(x)\rangle$ using an\
    \ *encoding circuit* $U_{enc}(x)$. This circuit maps the data into the Hilbert\
    \ space of $n$ qubits.\n2. **Parameterized quantum transformation:**: A parameterized\
    \ quantum circuit $U(\theta)$, composed of gates with tunable parameters $\theta\
    \ = (\theta_0, \theta_1, \\dots, \theta_l)$, is applied to the final state. This\
    \ is the quantum analog of learnable weights in classical neural networks.\n3.\
    \ **Measurement and output:** After applying the variational circuit, a measurement\
