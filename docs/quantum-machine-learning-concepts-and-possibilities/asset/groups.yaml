    ## 6.3.2 Quantum graph neural networks


    **Quantum graph neural networks (QGNN)** generalize variational quantum circuits
    to the setting of graph-structured data. Inspired by classical graph neural networks
    (GNNs), QGNN capture the topological and relational structure of datasets defined
    over nodes and edges, such as molecules, social networks, particle interactions,
    and discretized domains in physics. Their key insight of QGNN is that quantum
    entanglement can naturally encode correlations across the edges of a graph, and
    quantum interference can amplify or suppress global properties emerging from local
    interactions.


    In classical GNNs, message-passing operations update node features by aggregating
    information from neighboring nodes. QGNN seek to reproduce or extend this capability
    using quantum operations, by encoding graphs into quantum circuits or by embedding
    node and edge attributes into a quantum state whose structure is influenced by
    the graph.


    There currently currently no universally accepted architecture for QGNNs, but
    most proposals offer one of two paradigms:


    - **Static QGNN:** The quantum circuit layout mirrors the topology of the input
    graph. Each node corresponds to a qubit or register of qubits, and edges define
    interactions via entangling gates. This approach is conceptually simple but requires
    flexible compilation pipelines, in particular for irregular graphs.

    - **Dynamic QGNN:** The graph is fully embedded or encoded into a fixed-size quantum
    state, and a general-purpose variational circuit is used to process this state.
    Information about the graph structure is introduced through parameter initialization,
    gate placement, or feature re-loading. This method decouples circuit topology
    from input topology but may lose some inductive biases.


    A common component of QGNNs is the use of **edge-conditioned gates**, where features
    or the presence of a gate is modulated by edge weights or features. For instance,
    an entangling gate $U_{ij}$ between qubits $i$ and $j$ may be turned on only if
    $i$ and $j$ are connected in the input graph.


