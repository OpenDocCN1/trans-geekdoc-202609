    ## 2.7.1 问题描述\n\n给定一个包含 $N=2^n$ 个条目的无结构数据库以及一个算谕函数 $f: \\{0, 1\\}^n \\to \\{0,\
    \ 1\\}$（该函数仅对目标项返回 1，其他返回 0），找到一个输入 $x_0 使得 $f(x_0) = 1$。在经典情况下，这需要 $O(N)$ 次评估。Grover\
