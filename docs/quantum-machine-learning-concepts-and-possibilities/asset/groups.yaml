    ```\n$f(\\theta) = \\text{Tr}[M\\rho(\\theta)] = \\sum_{k} MK_k(\\theta)\\rho_0K_k^{\\\
    dagger}(\theta)$. (6.30)\n```\n\nThe gradient of this function can be computed\
    \ by differentiating the Kraus operators:\n\n```\n$\\frac{\\partial f}{\\partial\\\
    theta} = \\sum_{k} \\text{Tr}\\left[\\frac{\\partial K_k}{\\partial\\theta}\\\
    rho_0K_kM + K_k\\rho_0\\frac{\\partial K_k^{\\dagger}}{\\partial\\theta}M\\right]$.\
