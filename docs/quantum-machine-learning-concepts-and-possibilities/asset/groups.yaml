    # 8.4 Limitations, no-theorems, and quantization


    While quantum machine learning holds significant promise, there are important
    theoretical and practical limits. This section provides a balanced view by discussing
    known lower bounds, structural limitations of variational circuits, quantization
    results, and the fragility of quantum models under noise and finite measurements.


    # 8.4.1 Sample complexity lower bounds


    In classical learning theory, lower bounds on sample complexity are typically
    expressed in terms of VC dimension, Rademacher complexity, or covering numbers.
    In the quantum setting, many of these bounds carry over, in particular under classical
    data access or even quantum examples.


    In particular, it has been shown [3] that:


    +   - For general concepts, access to quantum examples does not asymptotically
    reduce PAC sample complexity beyond logarithmic or constant-factor improvements.

    - Lower bounds on quantum PAC learning mirror those of classical learners when
    measured against the VC dimension of the concept class.


    Thus, while quantum access may help with query efficiency or runtime, it does
    not circumvent the fundamental need for a sufficient number of samples.'
