    # Preface


    Quantum computing and machine learning are some of today''s most active and rapidly
    expanding fields of research and development. Quantum machine learning has evolved
    in recent years as a subdiscipline of quantum computing that explores how quantum
    computers can be used for machine learning tasks—in other words, how quantum computers
    can learn from data, either quantum or classical. Quantum machine learning is
    an exciting field because it holds the promise of accelerating classical machine
    learning algorithms.


    This book will showcase the growing number of algorithms and practical applications
    of quantum machine learning. Starting from the foundational approach that reformulates
    learning theory in a quantum setting, this book will highlight recent efforts
    to find quantum algorithms that speed up machine learning regarding computational
    complexity. The book will also cover new machine learning applications tailored
    for noisy intermediate-scale quantum (NISQ) devices from near-term or co-design
    perspective, quantum-classical methods. The aim of this book is to help readers
    develop a clear understanding of the promises and limitations of the current machine
    learning, and help them define directions for future research in this exciting
    field. We start by looking at the quantum mechanical principles that enable quantum
    computing and helping the reader gather some intuition about how to harness these
    quantum mechanical properties to speed up some computational tasks. Then, we introduce
    the reader to some of the basic quantum algorithms that are often used to develop
    more complicated algorithms. Later, we explore the different fields of study in
    quantum machine learning, which are related to the choice of algorithm, and whether
    it operates on quantum or classical data. Finally, we describe the state-of-the-art
    for quantum machine learning algorithms including both supervised and unsupervised
    learning, discussing their applications and limitations for implementation on
    near-term devices.


    Quantum machine learning is a subject in the making, with endless possibilities
    for applications in the near and long term. Nonetheless, to find out what quantum
    machine learning has to offer, its numerous avenues first have to be explored
    by an interdisciplinary community of scientists and quantum computing enthusiasts.
    We intend this book to be a possible starting point for this journey, as it is
    intended to introduce some key concepts, ideas, and algorithms that are the result
    of the first few years of quantum machine learning research. Our aim is to provide
    a comprehensive literature review and to summarize key topics that appear often
    in quantum machine learning, to put them into context and make them accessible
    to a broader audience in order to foster future research and applications.'
