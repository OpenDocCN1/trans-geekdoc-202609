    # 7.5.3 Quantum circuit compilation and data compression


    The ability of QGMs to approximate arbitrary distributions or quantum states also
    enables applications in quantum data compression. For instance, once a quantum
    state is learned via QVAE, one can extract a latent representation that is lower-dimensional
    or more efficiently preferably. In this context:


    +   * The encoder maps a high-complexity state to a latent space and

    * The decoder reconstructs the state from fewer quantum resources.


    This can be used to compress output observables of variational quantum algorithms
    [36] or to recompile deep circuits into shallower ones with similar performance
    [37].


    # 7.5.4 Anomaly detection


    An emerging application of QGMs is in quantum anomaly detection, where the model
    is trained to learn a baseline distribution (either quantum or classical), and
    deviations from it are used to flag rare or unexpected inputs. These include:


    +   * Quantum noise or hardware errors,

    * Novel events in experimental data (e.g. in particle physics), and

    * Out-of-distribution detection in classical data streams.


    Fidelity-based metrics, expectation values of observables, or distance in latent
    space can all be used as **anomaly** **scores**. For example, QGANs have been
    tested for anomaly detection in high-energy physics, where quantum resources may
    help distinguish subtle features with fewer samples [38].


    # 7.5.5 Physical simulation and sampling


    QGMs have also been proposed as variational samplers in quantum Monte Carlo methods
    or for preparing input distributions in Hamiltonian simulation. Applications include:


    +   * Sampling from Gibbs or Boltzmann distributions,

