    # 6.3.1 Quantum convolutional neural networks


    QNNs are variational architectures inspired by classical convolutional neural
    networks (CNNs), which have proven remarkably effective in processing high-dimensional
    structured data such as images, videos, and spatially sensor inputs. QNNs translate
    this architectural principle into the quantum domain, where quantum circuits extract
    hierarchical features from quantum states using local entangling operations and
    measurement-based pooling. QNNs are particularly well-suited for tasks translation-invariant
    or lattice-structured data.


    +   A QCNN consists of a suited quantum circuit comprising three key components:
    Quantum layers: These layers apply parameterized, local unitary operations across
    subsets of neighboring qubits. The arrangement is translation-invariant, analogous
    to the application of a filter kernel across an image in a classical CNN. Typically,
    the quantum layer includes:

    - Two-or or three-qubit entangling gates (e.g. CZ, CNOT, CRY).

    - Followed by single-qubit rotations (e.g. RY, RZ).

    These operations are repeated across the entire register using shared parameters,
    capturing local correlations and symmetry features. Pooling layers (quantum downsampling):
    To reduce the number of active qubits and aggregate information, QNNs implement
    pooling either through:

    - Measurement and discard: Certain qubits are measured, and their outcomes are
    used to conditionally update the rest (non-unitary, requires classical feedback).

    - Unitary pooling: Learned units disentangle and isolate a subset of qubits, which
    are then traced out or ignored. Pooling reduces the circuit width, enabling logarithmic
    depth scaling, which is favorable for implementation on NISQ hardware. Fully connected
    or readout layer: At the final stage, the remaining few qubits are used to compute
    the model''s output. A final measurement (typically in the Z-basis) of a designated
    qubit produces the classification result.


    To highlight the unique properties of QNNs, table 6.3 provides a consolidated
    summary of their architectural features and implementation strengths. The table
    outlines how QNNs leverage hierarchical structures, exploit logarithmic depth
    scaling, and align well with the symmetry and locality found in many physical
    systems. Each property is paired with a short explanation to clarify its role
    within the model architecture and its practical implications for NISQ-era deployment.'
