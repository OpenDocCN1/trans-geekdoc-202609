  md: 'Quantum Machine Learning


    Linear quantum models offer a trainable alternative to fixed-feature quantum kernels.
    While kernel methods rely on evaluating quantum overlaps, variational models attempt
    to learn the mapping directly in Hilbert space by tuning circuit parameters. In
    the next section, we compare the performance of quantum inference models—both
    kernel-based and variational—on benchmark tasks and discuss their potential.


    # 4.5 Performance and benchmarks


    Understanding the practical utility of quantum inference models requires a critical
    evaluation of their performance across multiple dimensions. In this section, we
    examine the theoretical motivations for using quantum models in supervised learning,
    summarize recent benchmark studies, and discuss how hardware noise counts model
    performance on near-term devices.


    # 4.5.1 Theoretical speedsups and limitations


    The appeal of quantum machine learning stems from the potential for computational
    speeds and representational power. In the context of supervised learning, this
    potential is reflected in three key ideas:


    +   * **Implicit feature spaces:** Quantum circuits can map classical data into
    quantum spaces. This enables highly expressive hypothesis classes without the
    need to explicitly construct large feature vectors [1–4].


    +   * **Hard-to-simulate kernels:** Some quantum kernels are conjectured to be
    classically intractable to compute under standard complexity-theoretic assumptions.
    This inaccessibility may allow quantum models to generalize better on problems
    where classical models are limited [5


    +   * **Linear speedsups in optimization:** For variational quantum models, gradients
    can often be estimated efficiently using the parameter-shift rule [7, 8], leading
    to training times that scale linearly with the number of parameters under favorable
    conditions.


    That said, many of these advantages assume ideal, fault-tolerant quantum hardware.
    On noisy intermediate-scale quantum (NISQ) devices, empirical benchmarking is
    crucial to assess what can be achieved in practice.


    # 4.5.2 Empirical studies and benchmarks


    Recent benchmarking efforts have compared quantum inference models to classical
    baselines across both synthetic and real datasets. Key observations include:


    +   * On simple low-dimensional datasets (e.g. XOR [9, 10]), concentric circles
    [11], parity functions [12]), quantum kernel methods and variational classifiers
    significantly outperform classical models when circuits are carefully designed
    [13].


    +   * On larger or real-world datasets (e.g. MNIST digits [14]), classical models
    such as SVMs and neural networks tend to outperform quantum models due


