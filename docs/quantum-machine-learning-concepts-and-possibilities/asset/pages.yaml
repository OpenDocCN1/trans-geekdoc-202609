  md: "# Quantum Machine Learning\n\n# ## 3.3 Autoencoders\n\nAutoencoders [9, 10]\
    \ are a class of machine learning models designed to learn efficient, lower-dimensional\
    \ representations of data. In the classical setting, an autoencoder consists of\
    \ an encoder $E: \\mathbb{R}^d \to \\mathbb{R}^d$ and a decoder $D: \\mathbb{R}^d\
    \ \to \\mathbb{R}^d$, trained jointly to minimize reconstruction loss:\n\n```\n\
    $$\\mathcal{L}(x) = ||D(E(x)) - x|^|^2 \\quad (3.9)$\n```\n\nThe learned representation\
    \ $z = E(x)$ ideally captures the most salient features of the input data in a\
    \ compressed format. Quantum autoencoders (QAEs) [11] extend this concept to quantum\
    \ data (see table 3.2 for comparison of classical and quantum autoencoders), aiming\
    \ to compress quantum states into Hilbert space while preserving the essential\
    \ information. Let $|\\psi\rangle_{in} \\in \\mathcal{H}_A \\otimes \\mathcal{H}_B$,\
    \ where $\\dim(\\mathcal{H}_A) = 2^n$ and $\\dim(\\mathcal{H}_B) = 2^m$. A QAE\
    \ seeks a unitary $U$ that\n\n```\n$U|\\psi\rangle \\approx |psi\rangle_A \\otimes\
    \ |0\rangle_B, \\quad (3.10)$\n```\n\nwhere $|\\psi\rangle_A$ encodes the compressed\
    \ information and $|0\rangle_B$ is a fixed reference state of the discarded subsystem.\
    \ The loss function used in variational quantum autoencoders (VQAEs) [12] is typically\
    \ of the form\n\n```\n$$\\mathcal{L}_{QAE} = 1 - \\text{Tr}[\\rho_B|0\\rangle\\\
    langle 0|] \\quad (3.11)$\n```\n\nwhere $\rho_B = \text{Tr}_A[|\\psi\rangle\\\
    langle\\psi|U^\\dagger]$ is the reduced density matrix of the discarded subsystem.\
    \ Loss is minimized when the discarded subsystem is disentangled and in the reference\
    \ state, allowing for successful compression.\n\n# ## 3.3.1 Circuit construction\n\
    \nA VQAE is implemented via a parameterized circuit $U(\theta)$ trained over a\
