    rangle\\langle\\psi_i|$\n```\n\nHere, $H$ is a Hamiltonian encoding interactions\
    \ between qubits, $\beta$ is the inverse\ntperature ($1/k_B T$), and $|\\psi_i\r\
    angle$ represents individual state vectors. The transverse\nfield Ising model\
    \ is a well-established system for Boltzmann machines the\nHamiltonian is composed\
