    # ## 5.2 Case studies and applications


    The flexibility and hybrid structure of variational quantum algorithms have enabled
    their applications across a diverse array of domains. These applications take
    advantage of the algorithms'' ability to approximate complex quantum states or
    optimize cost functions that are otherwise classically intractable. Two of the
    most prominent domains—quantum chemistry and combinatorial optimization—were in
    the motivating problems for VQE and QAOA, respectively. Since then, the use of
    variational algorithms has expanded significantly, including into fields such
    as quantum machine learning, quantum control, and even quantum error mitigation.


    # ### 5.2.1 Quantum chemistry and materials science


    Perhaps the most impactful near-term application of variational quantum algorithms
    lies in simulating molecular systems. The VQE has been used to estimate ground-state
    energies of small molecules as $H_2$ [24], LiH [25], BeH [26], and $H_2O$ [27],
    offering benchmarks for early quantum hardware. In these problems, the molecular
    Hamiltonian is derived from first-principles electronic structure theory and then
    transformed into a qubit representation via mappings such as the Jordan-Wigner
    or Bravyi-Kitaev transformations.


    These quantum simulations are particularly promising because classical methods
    with such configuration interaction (FCI) scale exponentially with system size.
    VQE offers a polynomial-scaling alternative, assuming that a suitable ansatz can
    be found and trained. In recent work, adaptive methods and ansatz-inspired constructions
    like UCC have improved accuracy while reducing circuit depth. Materials science
    applications, such as modeling transition complexes or strongly correlated systems,
    are also being explored, although they require higher-fidelity devices and deeper
    circuits which are currently feasible on most hardware.


    # ### 5.2.2 Combinatorial optimization


    The QAOA is specifically designed to tackle classical combinatorial optimization
    problems, which are ubiquitous in computer science, operations research, logistics,
    and finance. These problems typically involve optimizing a cost function over
    discrete variables subject to constraints. Examples:'
  merge: -1
