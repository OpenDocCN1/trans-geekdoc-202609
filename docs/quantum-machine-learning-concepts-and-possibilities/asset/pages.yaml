  md: "# Quantum Machine Learning\n\nThe parameter-shift rule tells us that the effect\
    \ of changing $\theta$ on the measurement outcome can be captured by evaluating\
    \ the circuit at two symmetrically shifted points. This is particularly advantageous\
    \ because it works even when the circuit runs on a noisy quantum device.\n\n#\
    \ Practical implementation\n\nTo compute the gradient of a loss function with\
    \ respect to a parameter $\theta$, one must:\n\n+   1. Shift $\theta$ forward\
    \ by $\\frac{\\pi}{2}$ evaluate the circuit, and record the outcome.\n2. Shift\
    \ $\theta$ backward by $\\frac{\\pi}{2}$, evaluate the circuit again.\n3. Take\
    \ the difference, divide by 2, and chain with the loss function.\n\nThis results\
    \ in two **forward passes per trainable parameter.**\n\nExample: Parameter-shift\
    \ rule\nSuppose we are measuring a qubit in the $Z$ basis after applying a rotation\
