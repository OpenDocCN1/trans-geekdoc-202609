  md: "# 6.2.11.1 When do barren plateaus occur?\n\nBarren plateaus are not universal,\
    \ they depend on specific circuit choices and cost functions. Key findings include:\n\
    \n+   - **Global cost functions** (e.g. fidelity between full states) are more\
    \ susceptible.\n- **Deep random circuits** (or those approximating 2-designs)\
    \ show exponential gradient decay.\n- **Unstructured ansatze\x13** with too much\
    \ expressivity suffer worse than task-specific circuits.\n- **Problem-invariant\
    \ initializations** (e.g. all-zero angles) often land directly in flat regions.\n\
    \nRecent research has formalized these results and identified several conditions\
    \ under which barren plateaus arise.\n\n# 6.2.11.2 Avoiding barren plateaus\n\n\
    Several strategies have been developed to mitigate this phenomenon:\n\n+   - **Local\
    \ cost functions**. Observables that depend on a small number of qubits (e.g.\
    \ local Hamiltonian terms)\n- **Layerwise training**. Gradually grow the circuit\
    \ depth during training. This keeps the parameter landscape smoother in early\
    \ stages [33].\n- **Problem-inspired ansatze**. Architectures developed from the\
    \ structure of the physical system (e.g. hardware efficiency or QAOA circuits)\
    \ [34, 35].\n- **Parameter initialization schemes**. Break symmetry using random\
    \ initializations or schemes as identity blocks or shallow pretraining [36].\n\
    - **Quantum gradient methods**. Incorporate curvature information to traverse\
    \ plateaus more effectively.\n\n```\n$$\\mathcal{L} = \\langle Z_{i} Z_{i+1} \\\
