  md: '# 8.2.3 Generalization bounds for quantum models


    Generalization bounds quantify how well a model trained on finite data will perform
    on unseen data. For quantum models, classical learning theory provides the blueprint,
    but it must be adapted to account for:


    +   - The nature of quantum hypothesis spaces (e.g., variational circuits, kernel-induced
    Hilbert spaces)

    - Shot noise in finite sampling

    - Non-Euclidean optimization geometry


    # 8.2.3.1 Quantum kernel models


    For quantum kernel methods, generalization error is governed by the effective
    dimension $d_{eff}(\lambda)$, which depends on the spectrum of the kernel matrix.
    Specifically, for regularized empirical risk minimization (e.g. kernel ridge regression),
    the following bound holds.


    > Generalization bound via effective dimension

    Let $K$ be a quantum kernel matrix on $m$ training examples and $\lambda > 0$
    the regularization parameter. The excess risk of the trained predictor satisfies


    $$R(h) - R(h^*) \le \mathcal{C}\left(\frac{d_{eff}(\lambda)}{m}\right) + \mathcal{C}(\lambda|f^*|^2)$$


    where $f^*$ is the target function in the reproducing kernel Hilbert space (RKHS)
    and


    $$d_{eff}(\lambda) = \text{Tr}(K(K+\lambda I)^{-1})$$$


    This result reveals that high-dimensional quantum feature maps do not automatically
    result in overfitting, generalization depends instead on the spectral decay of
    the kernel.


    # 8.2.3.2 Variational quantum circuits


    For variational models, generalization can be bounded using:


    +   - Uniform stability of the training algorithm.

    - PAC-Bays bounds on the classical post-measurement distribution.

    - Quantum Information geometry to assess sensitivity to parameters


    Table 8.1 summarizes representative generalization bounds across classical and
    quantum learning methods. For classical and quantum kernel methods, generalization
    performance is controlled by the effective dimension $d_{eff}(\lambda)$, which
    captures the complexity of the kernel matrix via its spectrum. When the kernel
    eigenvalues decay rapidly, these models can generalize well even in high-dimensional
    Hilbert spaces.'
