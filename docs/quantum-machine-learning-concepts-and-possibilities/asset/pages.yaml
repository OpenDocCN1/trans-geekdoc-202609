  md: 'A qubit''s state $|\psi\rangle = \alpha|0\rangle + \beta|1\rangle$, with $\alpha,
    \beta \in \mathbb{C}$ and $|\alpha|^2+\|\beta|^2=1$, describes a unit vector on
    the Bloch sphere. Measurement projects the state to $|0\rangle$ or $|1\rangle$
    represented by two-dimensional vectors,


    ```

    $|0\rangle = \begin{bmatrix} 1 \ 0 \end{bmatrix}, |1\rangle = \begin{bmatrix}
    0 \ 1 \end{bmatrix} \quad (2.1)$

    ```


    with the probabilities $|\alpha|^2$ and $|\beta|^2$. Quantum systems also exhibit
    entanglement, a nonlocal correlation that allows multi-qubit states to exhibit
    joint properties that classical systems cannot reproduce.


    The quantum bit

    The quantum bit or qubit is the fundamental unit of quantum information. Unlike
    a classical bit, which can be found in one of two definite states (0 or 1), a
    qubit can exist in a superposition of both states simultaneously:


    ```

    $|\psi\rangle = \alpha|0\rangle + \beta|1\rangle$, with $|\alpha|^2+\|\beta|^2=1.
    \quad (2.2)$

    ```


    This abstract two-level system can represent a wide range of physical realizations,
    as the states (0) and [1] in the computational basis, as $-\frac{1}{2}$ and $\frac{1}{2}$
    for a spin-1/2 particle.


    +   - The qubit remains in a ''superposition'' state until a measurement is performed.
    Measurement collapses the superposition, projecting the qubit into one of the
    two basis states with probabilities given by $|\alpha|^2$ and $|\beta|^2$.


    The behavior of quantum systems is governed by a small set of fundamental rules,
    known as the postulates of quantum mechanics [1, 2]. These postulates define how
    quantum states are represented, how they evolve in time, how measurement outcomes
    are determined, and how systems combine.


    +   - State space: A quantum system is described by a unit vector $|\psi\rangle$
    in a complex Hilbert space.

    - Evolution: In the absence of measurement, quantum states evolve according to
    unitary transformations $U$, typically generated by the Schrödinger equation.

    - Measurement: Observables correspond to Hermitian operators. Upon measurement,
    the system collapses to an eigenstate of the observable, and the outcome is one
    of its eigenvalues with probability given by the Born rule.

    - Composite systems: The state space of a composite system is the tensor product
    of the component Hilbert spaces. Entanglement arises when the joint state cannot
    be factored into individual subsystems.'
