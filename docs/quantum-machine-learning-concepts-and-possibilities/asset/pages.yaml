- pgno: 65
  md: '# Quantum Machine Learning


    +   * MaxCut: Finding a partition of a graph that maximizes the number of edges
    between the two partitions [20, 28].

    * Maximum independent set: Identifying the largest set of mutually adjacent nodes
    in a graph [22].

    * Vertex color and graph coloring: Relevant in resource allocation and scheduling
    [29, 30].

    * Traveling salesman problem: A classical route optimization problem [31, 32].


    In these applications, the problem is encoded into a diagonal Hamiltonian $H_c$,
    and QAOA generates a parameterized quantum state through alternating applications
    of $H_c$ and a mixing Hamiltonian $H_d$. Classical post-processing is then used
    to extract results corresponding to candidate solutions.


    While QAOA has to outperform classical algorithms on real-world benchmarks, it
    has demonstrated potential on small problem instances, in particular in settings
    where problem-specific structure or initialization strategies can be employed.
    Ongoing research into warm-start QAOA, layer-wise training, and optimization landscape
    analysis aims to improve its scalability and trainability.


    # 5.2.3 Quantum machine learning


    The variational framework has also been extended to machine learning tasks, where
    the goal is no longer to find a ground state but rather train a quantum model
    to perform classification, regression, or generative modeling. In this context,
    variational circuits serve as trainable models—analogous to neural networks—whose
    parameters are updated to minimize a loss function defined over classical or quantum
    data.


    Another promising direction is the construction of quantum classifiers, where
    a variational circuit is trained to label classical or quantum inputs. These classifiers
    can be viewed as quantum analogs of neural networks, with layers of parameterized
    gates and entangling operations as non-linear transformations. The architecture
    and training of quantum neural networks will be the subject of the next chapter,
    6, where we discuss their structure, expressivity, and role in quantum learning
    theory.


    Another application is in quantum generative modeling, where variational circuits
    are trained to produce the statistical properties of a target distribution. These
    approaches are particularly well-suited to quantum hardware, as the generative
    process is inherently probabilistic. We will explore these models in detail in
    the subsequent chapter, 7, which focuses on generative modeling in quantum machine
    learning.


    Finally, variational circuits also support quantum kernel methods, in which a
    parameterized feature map is used to embed data into a high-dimensional Hilbert
    space. The inner product between embedded states defines a kernel function, which
    can be evaluated on a quantum device and used for classical learning tasks such
    as support classification. These methods, including the variational design of
    quantum feature maps, were discussed in detail in the previous chapter, 4, on
    information encoding and kernel-based quantum machine learning.'
