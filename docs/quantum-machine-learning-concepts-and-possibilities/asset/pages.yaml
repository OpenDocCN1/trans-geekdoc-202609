  md: "# Quantum Machine Learning\n\nhardware only returns **samples from measurement\
    \ outcomes**, so gradients must be estimated through **hardware-compatible rules**.\
    \ In hybrid models, these quantum gradients are then stitched into a larger *end-to-end*\
    \ auto-differentiation pipeline. Below we review the main techniques, their assumptions,\
    \ costs, and when to use them.\n\n# 6.2.1 Automatic differentiation on hybrid\
    \ computational graphs\n\nIn modern machine learning, automatic differentiation\
    \ (autodiff) [14] is the backbone of efficient gradient-based training. Whether\
    \ in PyTorch [15], TensorFlow [16], or JAX [17], autodiff enables seamless computation\
    \ of derivatives by traversing a **computational graph**. In the context of quantum\
    \ machine learning, the introduction of hybrid models—where quantum circuits are\
    \ embedded within classical learning architectures—raises a crucial question:\
    \ how do we propagate gradients through a model that contains a quantum circuit?\n\
    \nThe answer lies in hybrid computational graphs, which extend the autodiff paradigm\
    \ to quantum nodes. These nodes encapsulate quantum operations (state preparation,\
    \ variational evolution, and measurement) and expose *custom gradient rules* so\
    \ that classical optimizers can update parameters across the quantum-classical\
    \ boundary.\n\n# Hybrid quantum graph structure\n\nA typical model consists of:\n\
    \n+   - **Classical nodes**: feature pre-processing, dense layers, and loss functions.\n\
    - **Quantum nodes**: parameterized quantum circuits acting on input-encoded states,\
    \ returning expectation values or sample statistics.\n\nThese nodes are linked\
    \ in a computation graph, where data flow *forward* during evaluation, and gradients\
    \ flow *backward* during training. The overall architecture resembles a deep learning\
    \ pipeline, but with variational circuits taking the role of nonlinear transformations.\n\
    \nFormally, let $x \\in \\mathbb{R}^d$ be a $d$-dimensional classical feature\
    \ vector, and let $\\psi(x; \\theta)$ be the prepared by the quantum circuit parameterized\
    \ by the vector of angles $\theta$. The output of the quantum circuit is $f(x;\
    \ \\theta)$—example, if the output is an expectation value over $M$:\n\n```\n\
    $f(x; \\theta) = \\langle\\psi(x; \\theta)|M|\\psi(x; \\theta)\\rangle. \\quad\
    \ (6.5)$\n```\n\nThe output is a scalar value bounded between $[-1, 1]$ from a\
    \ label $\\hat{f}(x; \\theta)$ which is extracted. Examples of label extraction\
    \ include using a classical bias parameter as binary labels, or re-scaling values\
    \ from $[-1, 1]$ to $[0, 1]$. A classical loss $L^C(y, \\hat{f})$ is then evaluated\
    \ using ground truth label $y$. The gradient with respect to the parameters is\n\
    \n```\n$\\nabla_{\\theta} L(f(x; \\theta), y) = \\frac{\\partial L}{\\partial\
    \ f} \\frac{\\partial f}{\\partial \\theta}.. \\quad (6.6)$\n```\n\nHere, $\\\
    frac{\\partial f}{\\partial \\theta}$ is computed classically, while must be estimated\
    \ using quantum-compatible methods, such as the parameter-shift rule."
