    # 6.2.5 Adjoint differentiation (simulators only)


    Adjoint differentiation [24], also referred to as reverse-mode differentiation
    for quantum circuits, is a gradient computation technique that is exact, but it
    is only available in state-vector simulators. Unlike the PSR, which estimates
    gradients by executing the circuit multiple times with shifted parameters, the
    adjoint method propagates derivatives analytically and backward through the circuit,
    akin to classical backpropagation.


    This method is not compatible with real quantum hardware because it requires full
    access to the quantum state, including the ability to apply adjoint operations
    and compute overlaps between intermediate states, which are quantities that are
    inaccessible on physical devices due to the no-cloning theorem and measurement
    collapse.'
