  md: 'but we can only access it through **shot-based sampling** on a quantum device.
    If $M$ has eigenvalues in $[−1, 1]$, then the **standard deviation** of the sample
    mean over $N$ shots is


    $$\text{Std}[\hat{\gamma}] = \frac{\sqrt{\text{Var}(M)}}{\sqrt{N}} \le \frac{1}{\sqrt{N}}$
    (6.36)


    Thus, to reduce the error in the estimate by a factor of 10, we must increase
    the number of shots by a factor of 100. This statistical noise is referred as
    **shot noise**, and it affects:


    +   * **Forward evaluations** of the model output,

    * **Gradient estimates**, in particular when using the parameter-shift rule, and

    * **Loss values**, which are often nonlinear functions of noisy outputs.


    # 6.2.9.2 Gradient variance and signal-to-noise ratio


    Let $\hat{g}_i$ be the estimated gradient of parameter $\theta_i$. The variance
    of this estimate scales with:


    +   * The number of shots,

    * The functional sensitivity of the circuit, and

    * The parameterization of the gates.


    When gradients are small (e.g. near flat regions or in barren plateaus), **shot
    noise can dominate**, making the signal indistinguishable from noise. This leads
    to:


    +   * Unstable optimization steps

    * Poor convergence or stagnation, and

    * Bias in gradient direction due to measurement error.


    Quantifying the **signal-to-noise ratio (SNR)** of gradients is essential in practice.
    The **Fisher information** or **gradient norm** serves as proxy for when to adapt
    shot counts or learning rates.


    # 6.2.9.3 Adaptive shot allocation


    To mitigate the impact of shot noise:


    +   * **adaptive shot strategies** [29, 30]: allocate more shots to parameters
    or data points with high gradient variance.

    * **Estimate the variance per parameter** during training and dynamically adjust
    measurement budgets.

    * **Variance-reduced estimators**, e.g. averaging over symmetric circuits, parameter
    mirroring, or antithetic sampling.

    * These techniques can reduce the total number of shots while maintaining effective
    convergence, in particular hardware-constrained settings.


    # 6.2.9.4 Mini-batching over data


    If the training dataset $\{(x_i, y_j)\}$ is large, one can further reduce variance
    by averaging gradients over **mini-batches** of size $B$:'
