  md: "The component $e^{i\\phi}$ is a global factor that cannot be detected experimentally\
    \ and is often omitted, thus reducing the number of parameters needed to describe\
    \ any point in the Bloch sphere to only two.\n\n![](img/7dbe239d4cc1f635a551b6e06f3d3df9_23_0.png)\n\
    \nThe Bloch sphere is a useful tool for visualizing and understanding the properties\
    \ of quantum states and the operations that can be performed on them. It is particularly\
    \ useful for understanding the behavior of quantum gates, which are operations\
    \ that can be performed on a qubit to change its state. It can also be used to\
    \ represent the state of a two-level system in the context of quantum error correction,\
    \ where it can be used to identify and correct errors that occur in the quantum\
    \ state. In this context, the Bloch sphere is known as the Bloch sphere representation\
    \ of a quantum error-correcting code.\n\n# ## 2.4 The Copenhagen interpretation\n\
    \nAlthough there are infinitely many points on the Bloch sphere, one corresponds\
    \ to a possible state for a qubit, quantum mechanics dictate that after a measurement,\
    \ the wave function describing the quantum system collapses to one of the two\
    \ bases, $|0\rangle$ or $|1\rangle$. Furthermore, subsequent measurements performed\
    \ on the system will also yield the same result.\n\nThis phenomenon is understood\
    \ in the context of the Copenhagen interpretation, developed by Niels Bohr [3]\
    \ and Werner Heisenberg [4]. This framework for understanding quantum mechanics\
    \ is based on the idea that quantum particles is inherently indeterminate and\
    \ cannot be predicted with certainty. Instead, the Copenhagen interpretation proposes\
    \ that the act of measurement or observation causes the quantum system to ‘collapse’,\
    \ resulting in a definite outcome.\n\nAccording to the Copenhagen interpretation\
    \ [1, 5], quantum systems do not have definite properties until they are measured\
    \ or observed, and the act of measurement itself determines the outcome. This\
    \ means that the behavior of quantum particles is fundamentally unpredictable\
    \ and cannot be described by classical concepts of cause and effect. Instead,\
    \ it must be described using probability and statistical methods."
