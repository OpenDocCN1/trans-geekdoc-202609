    \ Compact and expressive embeddings in Hilbert space |\n\nThese properties make\
    \ quantum feature maps central to any quantum machine learning algorithms. In\
    \ table 4.1, we present a comparison of classical and quantum feature maps to\
    \ highlight similarities and potential advantages of each domain. In the next\
    \ section, we will see how quantum feature maps induce *quantum kernels*, which\
    \ form the backbone of quantum kernel methods for supervised learning.\n\n# 4.3\
    \ Quantum kernels and kernel methods\n\nThe concept of a kernel is central to\
    \ many classical inference algorithms, particularly for SVMs and Gaussian processes.\
    \ When data are encoded into quantum states via a quantum feature map $x \\mapsto\
    \ |\\phi(x)|$, the inner product between these states defines a *quantum kernel*.\
    \ Quantum kernels offer a natural extension of classical methods into the quantum\
    \ regime, with the potential to represent highly expressive similarities that\
    \ are difficult to compute classically.\n\n# 4.3.1 Quantum kernel definition\n\
    \nGiven a quantum feature map $|\\phi(x)|$, the associated quantum kernel is defined\
    \ as\n\n```\n$\\kappa(x, x') = |\\langle\\phi(x)|\\phi(x')\rangle|^2. \\quad (4.12)$\n\
    ```\n\nThis expression quantifies the fidelity between two quantum states prepared\
    \ by circuits $U_x(x)$ and $U_{x'}(x')$. The higher the fidelity, the more similar\
    \ the inputs $x$ and $x'$ are considered to be, according to the geometry of the\
    \ quantum Hilbert space induced by the encoding.\n\nAn alternative (but less common)\
    \ definition used the real part of the overlap,\n\n```\n$\\kappa(x, x') = \text{Re}(\\\
    langle\\phi(x)|\\phi(x')\rangle). \\quad (4.13)$\n```\n\nalthough this form is\
    \ less used in practice due to measurement constraints."
