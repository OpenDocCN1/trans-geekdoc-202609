    - Training efficiency, evaluating the number of circuit evaluations required.


    # 4.5. Robustness and noise considerations


    Quantum inference on NISQ devices faces several physical and algorithmic

    challenges:


    +   - Decoherence and gate errors reduce the effective circuit depth, limiting
    the

    complexity of models that can be trained in practice.

    - Shot noise introduces statistical fluctuations due to probabilistic measure-\ments.
    Accurate estimation of expectation values often requires thousands of

    repeated measurements, which increases runtime.

    - Error mitigation techniques as zero-overhead extrapolation and readout

    correction can help, but add computational overhead and may not scale well.


    To address these limitations, researchers often simulate noise during training
    or

    pre-train parameters classically before deploying circuits on hardware. Some

    methods optimize quantum by modeling noise in the cost function explicitly.


    In summary, there is currently no conclusive experimental evidence of quantum

    advantage for supervised learning on real-world datasets using available quantum

    hardware. Some theoretical constructions suggest potential quantum-classical

    separation in contrived or worst-case distributions, usually via hard-to-simulate

    quantum kernels. In practice, quantum advantage is more likely to be found in
    hybrid

    workflows co-designed with application-specific constraints and error mitigation

    strategies.


    # 4.6 Case studies and applications


    While theoretical and benchmark studies provide insight into the capabilities
    and

    lations of quantum inference models, their practical relevance is well understood

    through domain-specific applications. This section presents case studies that

    illustrate how quantum kernel methods and variational quantum classifiers have

    been applied to real-world data from a variety of scientific and industrial domains.

    These examples help identify both opportunities for near-term deployment and

    challenges that remain for achieving that quantum advantage.'
