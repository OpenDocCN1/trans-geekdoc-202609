    - **Amplitude encoding**: Represents a normalized vector $x \\in \\mathbb{R}^d$\
    \ as a quantum state:\n\n```\n$x \\mapsto |x\\rangle = \\sum_{j=1}^{d} x_j |j\\\
    rangle, \\quad (4.10)$\n```\n\nwhere $|x\rangle$ is 1. Amplitude encoding is exponentially\
    \ compact, although state preparation can be costly.\n\n+   - **Angle encoding**:\
    \ Maps each feature $x_j$ to a rotation angle on a qubit:\n$x_j \\rightarrow R(x_j/2)|0\\\
    rangle = \\cos(x_j/2)|0\\rangle + \\sin(x_j/2)|1\\rangle. \\quad (4.11)$\n- **Hamiltonian\
    \ encoding**: Applies a data-dependent unitary $U(x) = e^{-iH(x)}$, where $H(x)$\
    \ is a Hamiltonian encoding data. This strategy is commonly used in quantum kernel\
    \ methods.\n\nEach encoding scheme offers trade-offs in circuit depth, representational\
    \ power, and robustness to noise. In practice, angle and Hamiltonian encodings\
    \ are popular choices for constructing expressive and hardware-feasible quantum\
    \ feature maps.\n\n# 4.2.3 Properties of quantum feature maps\n\nQuantum feature\
    \ maps are designed to exploit the geometric structure of Hilbert space to encode\
    \ data in ways that:\n\n+   - **Expressive**: Quantum feature maps may encode\
    \ nonlinear relationships in a highly entangled quantum state space, enabling\
    \ more complex decision boundaries.\n- **Hard to simulate classically**: If the\
    \ quantum inner product $|\\phi(x)\\rangle\\langle\\phi(x')|^2$ is classically\
    \ hard to compute (under plausible complexity assumptions), then the associated\
    \ kernel function may be inaccessible to classical methods.\n- **Implicitly high-dimensional**:\
    \ Due to the exponential size of the Hilbert space, quantum states can implicitly\
    \ represent feature vectors in space with dimension $2^n$, where $n$ is the number\
    \ of qubits. Unlike classical machine learning, the inner product can be computed\
    \ via a physical quantum process."
