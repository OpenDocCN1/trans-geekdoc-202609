  md: "# 7.4.2 Loss functions\n\nThe loss functions guides the model toward better\
    \ approximation of the target distribution. Common choices include:\n\n+   - KL\
    \ divergence [32]:\n\n$D_{KL}(p_{data} || p_{\theta}) = \\sum_{x} p_{data}(x)\
    \ \\log \\frac{p_{data}(x)}{p_{\theta}(x)}. \\quad (7.14)$\n\nRequires knowing\
    \ both distributions and can be unstable if $p_{\theta}(x)$ vanishes.\n\n+   -\
    \ Maximum discrepancy (MMD) [33]:\n$L_{MMD} = E_{x,x' \\sim p_{data}}[k(x, x')]\
    \ + E_{y,y' \\sim p_{data}}[k(y, y')] - 2E_{x \\sim p_{data}, y \\sim p_{data}}[k(x,\
    \ y)], \\quad (7.15)\nwhere $x, x' \\sim p_{data}$, $y, y' \\sim p_{data}$, and\
    \ $k$ is a kernel function (e.g. Gaussian). MMD is popular in QCBMs due to sample-based\
    \ and gradient-free.\n Adversarial loss: Used in QGANs, where a discriminator\
    \ is trained simultaneously to distinguish real generated data.\n- Reconstruction\
    \ + regularization losses: Used in QVAEs, combining negative log-likelihood with\
    \ KL divergence over latent variables.\n\n# 7.4.3 Gradient estimation\n\nUnlike\
    \ classical neural networks, gradients in quantum models are not obtained via\
    \ automatic differentiation. Instead, parameter-shift rules and finite difference\
    \ estimators are used.\n\nFor a parameter $\\theta$ appearing in a gate of the\
    \ form $e^{-iG\\theta}$, where $G$ has two distinct eigenvalues $\\pm\\lambda$,\
    \ the derivative of an expectation value $(O)$ can be computed as\n\n$\\frac{\\\
    partial(O)}{\\partial\\theta} = \\frac{1}{2}\\left(\\langle O_{\\theta+\\{\\pi}{2}}\\\
    rangle - \\langle O_{\\theta-\\frac{\\pi}{2}}\\rangle\\right). \\quad (7.16)$\n\
    \nThis allows gradient computation using only circuit evaluations at shifted parameter\
    \ values.\n\nFor non-differentiable objectives (e.g. discrete outputs, sample-based\
    \ losses such as MMD), gradient-free optimizers are used. These are robust to\
    \ noise but may require more iterations to converge.\n\n# 7.4.4 Training challenges\n\
    \nQGMs face similar obstacles during training that are encountered by other variational\
    \ algorithms:\n\n+   - Shot noise and statistical error: Estimates of loss and\
    \ gradients only on finite sampling from quantum hardware, introducing variance.\n\
    - Barren barren: Variational circuits can exhibit exponentially vanishing gradients\
    \ in high-dimensional Hilbert spaces, in particular with random or deep ansat."
