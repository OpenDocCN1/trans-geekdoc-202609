    # 3.4.3 Quantum learning from quantum data


    Learning from quantum data involves estimating functions, decision boundaries,
    or generative models from a training set $\{\rho_i, y_i\}$, where $\rho_i$ are
    quantum states and $y_i$ are classical or quantum labels. Several settings have
    been explored:


    +   - **Quantum classification:** Determine a label $y$ from an unknown quantum
    state $\rho$ via a quantum measurement strategy or variational circuit [18–20].

    - **Quantum regression:** Learn a mapping from quantum states to real-valued observables
    or expectation values [21].

    - **Quantum generative modeling:** Learn to generate a distribution over quantum
    states or to reproduce the statistics of quantum data [22].


    One challenge in this regime is access: quantum data cannot be freely copied and
    are available only through quantum oracles or experimental runs. Techniques such
    as quantum state tomography are limited in scalability [23, 24], prompting the
    need for *informationally* efficient learning methods that require few copies
    or indirect observables. Recent work has also explored learning quantum measurements,
    i.e., optimizing operator-valued measurements (POVMs) [25]—measure whose values
    are positive semi-definite operators in a Hilbert space.


    # 3.4.4 Implications for encoding


    Encoding quantum data is conceptually different from encoding classical data.
    In the classical case, data must first be embedded into a quantum state via unitary
    transformations or state preparation routines. In contrast, for quantum data,
    the challenge lies in designing quantum machine learning models that preserve
    and exploit the structure of the input quantum state, often with destructive measurement.


    Furthermore, standard assumptions in classical learning theory—such as i.i.d.
    sampling or unrestricted access to data—do not carry over straightforwardly to
    quantum settings. New theoretical frameworks, such as PAC learning with quantum'
