  md: "# Quantum Machine Learning\n\n| Pros and cons of quantum kernels\\Pros:\n*\
    \ Can implicitly embed data into exponentially large Hilbert spaces.\n* May be\
    \ hard to simulate classically under complexity-theoretic assumptions.\n* Naturally\
    \ compatible with existing classical kernel learning frameworks.\nConsCons:\n\
    * Kernel estimation requires many quantum circuit evaluations (shots).\n* Sensitivity\
    \ to noise can degrade fidelity estimates.\n* Poor kernel alignment can lead to\
    \ suboptimal performance. |\n\nIn the next section, we move beyond fixed-feature\
    \ kernel models and explore linear quantum models, in which the hypothesis class\
    \ is encoded directly into a PQC whose parameters are learned during training.\n\
    \n# 4.4 Linear quantum models\n\nQuantum kernels rely on fixed quantum feature\
    \ maps and classical optimization. In contrast, linear quantum models introduce\
    \ trainable parameters directly into quantum circuits. These models represent\
    \ quantum analogs of linear classifiers, such as logistic regression or perceptrons,\
    \ but operate in high-dimensional Hilbert space where the feature space is defined\
    \ by the structure of a quantum circuit.\n\nThe most common approach involves\
    \ PQCs, also known as variational circuits, where some gates are equipped with\
    \ tunable angles. These parameters are optimized using classical routines, making\
    \ the overall learning architecture hybrid quantum-classical model.\n\n# 4.4.1\
    \ Parameterized quantum circuits for classification\n\nA parameterized quantum\
    \ circuit is a quantum circuit with gates that depend on a vector of parameters\
    \ $\theta$. In the context of classification, a typical circuit structure includes:\n\
    \n+   * A quantum feature map $U_{\\phi}(x)$, which encodes the classical input\
    \ $x$ into a quantum state.\n* A trainable unitary $U(\\theta)$, applied after\
    \ the encoding, representing the model's hypothesis.\n* A measurement in the computational\
    \ basis to extract the output.\n\nThis circuit prepares a state\n\n```\n$$\\psi(x;\
    \ \\theta)\\rangle = U(\\theta)U_{\\phi}(x)|0\\rangle^{\\otimes n}, \\quad (4.15)$\n\
    ```\n\nand the predicted label is obtained by measuring one or more qubits and\
    \ postprocessing the result. For example, in binary classification, one might\
    \ define\n\n```\n$f(x; \\theta) = \\langle\\psi(x; \\theta)|M|\\psi(x; \\theta)\\\
    rangle, \\quad (4.16)$\n```"
