  md: '# 8.2 performance measure: sample complexity and generalization


    This investigates how expressive quantum hypothesis translate into learnable models.
    We develop bounds on sample complexity and generalization error, adapting classical
    learning-theoretic concepts to quantum settings. We also highlight the subtleties
    introduced by quantum-data access and quantum circuits, and summarize known results
    on both upper and lower bounds for quantum learning.


    # 8.2.1 PAC and agnostic learning


    In the probably correct (PAC) learning model [3, 4], the learner aims to find
    a hypothesis with lower generalization error using only a limited number of training
    samples drawn i.i.d. from a fixed distribution. Let $\mathcal{H}$ be a hypothesis
    class mapping inputs $x \in \mathcal{X}$ to labels $y \in \{0, 1\}$ or real values
    in regression. The learner has access to a dataset $\mathcal{S} = \{(x_i, y_i)\}_{i=1}^n
    \sim \mathcal{D}$, and the goal is to find $h \in \mathcal{H}$ such that the population
    risk $R(h)$ is close to the minimum possible risk with $\mathcal{H}$:


    ```

    $R(h) = \mathbb{E}_{x,y \sim \mathcal{D}} [l(h(x), y)], (8.1)

    ```


    In the agnostic learning model, we do not assume the data labels are consistent
    with any hypothesis in $\mathcal{H}$. The learner competes with the best possible
    hypothesis in the class.

    Quantum models can be analysed in this framework with minor adjustments. The hypothesis
    $h_0$ now results from a measurement on a quantum circuit:


    ```

    $h_0(x) = \mathbb{E}[M|U_0 U_{enc}(x)|0], (8.2)

    ```


    where the expectation is taken with respect to the Born rule over repeated shots.
    The training dataset may be classical (a list of $(x_i, y_i)$) or quantum, consisting
    of access to pure or mixed quantum states encoding the data-label pairs.

    Two quantum-data models are often considered:


    +   * **Classical access:** The learner receives $(x_i, y_i)$ drawn i.i.d. from
    $\mathcal{D}$.

    * **Quantum examples:** The learner has access to the quantum superposition stat,


    ```

    $|psi_y\rangle = \sum_{x} \sqrt{p(x, y)}|x, y\rangle, (8.3)

    ```


    possibly along with oracle related operations.


    The PAC learning guarantees under both access models often follow similar forms,
    with dependence on a complexity measure such as VC dimension or effective dimension.'
