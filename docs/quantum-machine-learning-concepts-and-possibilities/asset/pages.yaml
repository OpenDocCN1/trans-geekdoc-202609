  md: "# Quantum Machine Learning\n\n![](img/7dbe239d4cc1f635a551b6e06f3d3df9_28_0.png)\n\
    \n**Figure 2.2.** Quantum circuit for Grover's algorithm with three qubits. The\
    \ initial Hadamard gates prepare a uniform superposition over all possible inputs.\
    \ The oracle $U_f$ flips the phase of the marked state. The diffusion operation\
    \ (also known as the inversion-about-mean) amplifies the probability amplitude\
    \ of the marked state. After one iteration of oracle and diffusion, measurement\
    \ reveals the state with high probability.\n\nIn the Deutsch-Jozsa algorithm,\
    \ the oracle $U_f$ encodes a *black-box* function $f: [0, 1]^n \\rightarrow [0,\
    \ 1]$. Physically, it is a unitary operation that queries this function coherently,\
    \ meaning it evaluates $f(x)$ on all possible inputs $x$ simultaneously due to\
    \ quantum superposition. The oracle acts on two quantum registers according to\n\
    \n```\n$|x\n```\n\nwhere $x$ is the $n$-qubit input that holds the argument of\
    \ the function, and $y$ is a one-qubit register that stores the result. The symbol\
    \ $\\oplus$ denotes addition modulo 2.\nIn this mapping, the first register $|x\\\
    rangle$ remains unchanged, while the second register is flipped if only is $f(x)\
    \ =1$. This controlled flip can be interpreted as a reversible implementation\
    \ of a classical logic gate. For example, when $f(x)$ corresponds to a Boolean\
    \ expression, $U_f$ acts like a quantum version of a classical circuit that computes\
    \ $f(x)$ without destroying superpositions.\n\nThis means that $U_f$ coherently\
    \ 'writes' the function value $f(x)$ into the phase or amplitude of the quantum\
    \ state, allowing interference patterns to later reveal global properties of $f$.\n\
    \n# 2.7.2 Algorithm overview\n\n+   - **Initialize** an $n$-qubit system in the\
    \ state $|0\\rangle^{\\otimes n}$ and apply Hadamard gates to create an equal\
    \ superposition.\n- **Repeat** the Grover iteration $O(\\sqrt{N})$ times:\n  \
    \  - **Oracle step**: Apply $U_f$, which flips the phase of the marked item.\n\
    \    - **Diffusion operator**: Reflect the state around the average amplitude.\n\
    - **Measure** the final state to obtain $x_0$ with high probability.\n\n# 2.7.3\
    \ Mathematical insight\n\nLet $|s\\rangle = \\frac{1}{\\sqrt{N}}\\sum_{x=0}^{N-1}|x\\\
    rangle$ be the initial superposition. Grover's iteration amplifies the amplitude\
    \ of the marked state by rotating the quantum state toward $|x_0\\rangle$ in a\
    \ two-dimensional subspace spanned by $|x_0\\rangle$ and $|s_0\\rangle$."
