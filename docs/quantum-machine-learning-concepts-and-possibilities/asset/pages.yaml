    \ as\n\n```\n$F_{\\}(\\theta) = \\langle\\psi|\\partial_{\\theta}\\partial_{\\\
    theta}|\\psi\\rangle - \\langle\\partial_{\\theta}|\\psi\\rangle\\langle\\psi|\\\
    partial_{\\theta}\\rangle,\\quad (6.27)$\n```\n\nThe **real** part of this quantity\
    \ defines the **Fisher information matrix**, which is used in the QNG:\n\n```\n\
    $Re[F_{\\}] = \\mathbf{Cov}\\left(\\frac{\\partial}{\\partial\\theta_i}, \\frac{\\\
    partial}{\\partial\\theta_j}\\right),\\quad (6.28)$\n```\n\nThe QGT behaves like\
