    # **General form of the gradient**


    Given a quantum circuit that prepares the state $|\psi\rangle = U(\theta)|\psi_0\rangle$,
    and an observable $M$, the expectation value is


    $f(\theta) = \langle\psi(\theta)|M|\psi(\theta)\rangle. \quad (6.16)$


    Then, under suitable regularity conditions (e.g. that $G$ has a discrete spectrum
    and the circuit is differentiable), the derivative $f(\theta)$ can be expressed
    as a finite weighted sum of circuit evaluations at **multiple shifted parameter
    values**,


    $$\frac{\partial f}{\partial\theta} = \sum_{s} c_s \cdot f(\theta + s). \quad
    (6.17)$


    where:


    +   - $s \in \mathbb{R}$ is a set of shifted values

    - $c_s \in \mathbb{R}$ are coefficients depending on the spectrum of $G$.


    The set $\{c_s, s\}$ is obtained via **Fourier analysis** of the generator''s
    spectral decomposition. This approach still only requires forward evaluations
    of the quantum circuit, making it compatible with hardware.


    # **Key observations**


    +   - The number of shifts depends on the **number of distinct eigenvalues** of
    $G$. For Pauli generators (two eigenvalues), two shifts; for more complex gates,
    the number of required shifts increase accordingly.

    - For **multi-qubit gates** such as controlled-phase or controlled-rotation gates,
    the generator circuit often has four or more eigenvalues. In this case, one may
    need four, six, or even more circuit evaluations to estimate the gradient of a
    single parameter.

    - **Diagonal generators** (e.g. projectors or Hamiltonian terms in block-diagonal
    form) can often be decomposed analytically, facilitating an efficient generalized-PSR
    formulation.


    Example: Three eigenvalue generator

    Suppose $G$ has eigenvalues $(-1, 0, +1)$. Then the generalized PSR yields:


    $$\frac{\partial f}{\partial\theta} = \sum_{k} c_k f(\theta + s_k). \quad (6.18)$


    with shift values $s_k \in {\pm\pi/2, \pm\pi/4\}$, and coefficients $c_k$ computed
    to match the derivative of $f$. Specific shifts and weights depend on the gate
    decomposition and the operator $M$, but remain computable for a wide class of
    circuits.'
