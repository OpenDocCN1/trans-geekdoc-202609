  md: '# Quantum Machine Learning


    same way. The extent to which quantum mechanics is utilized depends not only on
    whether the algorithm runs on a quantum device, but also on the nature of the
    input data and how they are represented.


    Some QML methods aim to process entirely classical data, using quantum circuits
    as models with potentially advantageous expressivity or trainability. Others are
    designed for quantum-native tasks, such as learning from quantum states produced
    by physical systems or quantum simulations. Others fall somewhere in between,
    using classical inputs but relying on quantum subroutines—such as state overlap
    estimation or kernel computation—to accelerate specific components of the learning
    process. This diversity has led to a need for a coherent framework that distinguishes
    between the different modes of operation in QML.


    To classify these, the following taxonomy presents QML approaches in terms of
    two orthogonal criteria: the type of data being learned from, and the type of
    model performing the learning. This classification not only provides a conceptual
    map of the field but also highlights the assumptions, limitations, and opportunities
    inherent in each approach.


    # Taxonomy of QML approaches


    QML algorithms can be broadly categorized by two features, the nature of the data
    and the model/algorithm. This leads to four types of QML workflows:


    | Data type | Model type | Example use case |

    | :--- | :--- | :--- |

    | Classical | Classical | Standard ML: SVMs, CNNs, Gaussian mixture models, gradient
    boosting |

    | Quantum | Quantum | Variational quantum classifiers, quantum kernel methods,
    quantum circuit Born machines trained on classical datasets |

    | Quantum | Classical | Shadow tomography, quantum measurement data classification,
    classical post-processing of quantum sensor outputs |

    | Quantum | Quantum | Full quantum generative models, quantum autoencoders, quantum
    state determination, quantum-enhanced metrology


    Remarks:


    +   * The classical data + quantum model category is most relevant for near-term
    applications using hybrid quantum-classical algorithms.

    * The quantum data + quantum model scenario is natural for quantum-native tasks
    such as quantum error correction, state classification, or entangled sensor networks.

    * Some algorithms (e.g. QANs) can bridge multiple categories depending on how
    the generator, discriminator, and data encoding are structured.'
