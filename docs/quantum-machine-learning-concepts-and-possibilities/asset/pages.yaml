  md: 'states compactly and accurately. Expressivity in quantum generative models
    are

    closely tied to the structure of the circuit, the dimensionality of the Hilbert
    space,

    and the entanglement and interference effects that quantum operations can exploit.


    # 7.3.1 Defining expressivity


    The expressivity of a quantum generative model refers to it ability to represent
    a

    wide and complex class of probability distributions over bitstrings or other measure-

    outcomes. In the context of circuit-based models such as QCBMs, this notion is

    formalized via the induced distribution [24, 25], that is, the probability distribution

    over measurement outcomes given by the Born rule applied to a parameterized

    quantum state.


    Let $U(\theta)$ be a parameterized quantum circuit acting on an $n$-qubit system

    inialize in the computational base state $|0\rangle^{\otimes n}$. The output probability
    distribution

    of bitstrings $x \in \{0, 1\}^n$ is given


    $p_{\theta}(x) = |\langle x|U(\theta)|0\rangle^{\otimes n}|^2 \quad (7.13)$


    The induced distribution $p_{\theta}$ defines the model''s output. The set of
    all distributions

    accessible by varying the parameters $\theta$ determines the expressive capacity
    of the model.

    in contrast to classical neural networks that execute an output

    function, QCBMs define a probability distribution through wavefunction

    amplitudes and the interference patterns generated by the circuit.


    As shown by Benedetti et al. [17], the expressivity of QCBMs is directly linked
    to

    the structure and depth of the circuit ansatz. Shallow circuits or those with
    restricted

    connectivity are generally only capable of representing a narrow family ofndndistributions,
    often those with limited or local correlations. Deeper or more

    entangling architectures, however, can give rise to highly nontrivial distributions,

    many which may be hard to simulate or represent classically.


    Sim et al. [26] introduced a quantitative notion of expressivity based on how

    uniform the circuit ensemble covers the space of unitary operations, drawing

    connections to the structure of unitary $t$-designs. Du et al. [27] further formalized
    the

    comparison between classical and quantum models, showing that certain families
    of

    quantum circuits can represent probability distributions that grow exponentially

    large classical models to approximate.


    Taken together, these results suggest that quantum circuits offer a natural and

    powerful bias for generative modeling. The expressivity of a QCBM is not

    only a function of its parameter count or Hilbert space size, but also of its
    ability to

    gate entanglement, exploit interference, and produce classically intractable

    correlations.


    # 7.3.2 Factors affecting expressivity


    The expressivity of a QGM depends on multiple aspects:


    +   * Circuit depth and gate set: Deeper circuits with a universal gate set can

    approximate arbitrary unitaries.'
