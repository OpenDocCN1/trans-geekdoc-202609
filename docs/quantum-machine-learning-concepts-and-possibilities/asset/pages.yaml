- pgno: 27
  md: "![](img/7dbe239d4cc1f635a551b6e06f3d3df9_27_0.png)\n\n# ###### 2.6.2 Algorithm\
    \ overview\n\n+   1. Initialize an $(n+1)$-qubit system in the state $|0\rangle^{\\\
    otimes n} |1\rangle$.\n2. Apply Hadamard gates to all $n+1$ qubits to create a\
    \ superposition.\n3. Invoke the oracle $U_f$, which maps $|x|y\rangle \to |x|y\
    \ \\oplus f(x)\rangle$.\n4. Apply Hadamard gates to the first $n$ qubits.\n5.\
    \ Measure the first $n$ qubits.\n\n# ###### 2.6.3 Interpretation of results\n\n\
    +   * If the output is $|0\rangle^{\\otimes m}$, then $f$ is constant.\n* Otherwise,\
    \ $f$ is balanced.\n\n# ###### 2.6.4 Significance\n\nThe algorithm showcases the\
    \ power of quantum parallelism and interference. By evaluating all inputs in superposition\
    \ and interfering the amplitudes constructively or destructively, the Deutsch–Jozsa\
    \ algorithm achieves exponential speedup in query complexity.\n\n# ###### 2.7\
    \ Grover’s algorithm\n\nGrover’s algorithm [8] provides a quantum solution to\
    \ the unstructured search problem, offering a quadratic speedup over classical\
    \ brute-force methods.\n\n# ###### 2.7.1 Problem statement\n\nGiven an unstructured\
    \ database of $N=2^n$ items and an oracle function $f: \\{0, 1\\}^n \to \\{0,\
    \ 1\\}$ that returns 1 only for the target item and 0 otherwise, find an input\
    \ $x_0$ such that $f(x_0) = 1$. Classically this requires $O(N)$ evaluations.\
    \ Grover’s algorithm achieves this in approximately $O(\\sqrt{N})$ steps (see\
    \ figure 2.2)."
