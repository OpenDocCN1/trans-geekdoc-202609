    # 8.1 Definitions and frameworks for expressivity


    This section establishes rigorous foundations for comparing the expressivity of
    classical and quantum hypothesis classes. By articulating definitions and measures
    used to quantify model complexity and representational power, we lay the groundwork
    for understanding the theoretical performance and limitations of quantum machine
    learning models.


    # 8.1.1 Hypothesis classes


    In statistical learning theory, a hypothesis class **H** is a set of functions
    mapping inputs to outputs. In classical machine learning, common hypothesis classes
    include neural networks, decision trees, linear separators, and kernel-based methods.
    These models operate in classical computational paradigms, and their expressive
    capacity is typically characterized by parameters such as the number of layers
    and neurons (in neural networks), the tree depth (in decision trees), or the norm
    bounds and kernel choices (in kernel methods).


    In contrast, quantum hypothesis classes are defined by quantum circuits that act
    on quantum states and are measured according to some observable. The quantum analog
    of a hypothesis class is typically constructed using a parameterized quantum circuit
    (PQC) or variational quantum circuit that encodes classical data into quantum
    states, processes them through a unitary transformation, and measures them to
    produce an output prediction.'
