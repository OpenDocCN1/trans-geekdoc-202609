    theta)|0^{\\otimes n}\\rangle|^2$.\n\nThe QCU($\theta$) is constructed with repeating\
    \ patterns of single-axis rotations ($R_{x}(\theta)$, $R_{y}(\theta)$, $R_{z}(\t\
    heta)$), or using general Euler rotations $U_{z}(\theta, \\phi, \\lambda)$ and\
    \ entangling gates, multi-qubit gates. Commonly PQCs are designed to utilize hardware-native\
    \ gates (e.g. two-qubit gates CNOT or CZ over multi-control or multi-unitary)\
