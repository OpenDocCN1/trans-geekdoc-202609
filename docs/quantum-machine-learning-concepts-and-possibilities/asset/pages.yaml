    +   High expressivity can be a double-edged sword. While expressive models are\
    \ capable of learning complex distributions, they may also be prone to:\n* Overfitting\
    \ in small datasets\n* Barren plateaus, where gradients vanish exponentially with\
    \ system size [30, 31]; and\n* Optimization instability when too many parameters\
    \ interact nonlinearly\n\nThus, balancing expressivity with inductive bias and\
    \ training feasibility is critical when designing quantum generative circuits.\n\
    \n# 7.4 Training quantum generative models\n\nTraining quantum generative models\
    \ involves optimizing the parameters of a quantum circuit such as the distribution\
    \ induced by measurement outcomes approximates a target distribution. While conceptually\
    \ analogous to training classical generative models, the quantum setting introduces\
    \ distinctive challenges and opportunities, particularly due to measurement stochasticity,\
    \ non-differentiability, and hardware constraints.\n\nThis section outlines the\
    \ typical training loop, common losses, gradient estimation techniques, and specific\
    \ difficulties encountered during optimization.\n\n# 7.4.1 The optimization loop\n\
    \n+   Most quantum generative models follow a hybrid quantum-classical training\
    \ loop:\n* Initialize parameters $\theta$ for the quantum circuit $U(\theta)$.\n\
    * Generate samples from the circuit by measuring in the computational basis, yielding\
    \ outcomes $x \\sim p_\theta(x)$.\n* Estimate a loss function comparing $p_\t\
    heta$ to the target distribution $p_{data}$.\n* Update parameters using a classical\
    \ optimizer (e.g. gradient descent, Adam, or SPSA).\n* Repeat until convergence.\n\
    \nThis loop is model-agnostic and applies to QCBMs, QGANs, QVAEs, and other quantum\
    \ generative frameworks."
