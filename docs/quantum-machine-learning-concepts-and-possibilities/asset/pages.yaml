  md: '# Quantum Machine Learning


    placed on these lines. When a gate acts on multiple qubits, connecting lines or
    symbols show the qubits involved. Typically, a quantum circuit starts with all
    qubits initialized in the |0⟩ state. This standardization simplifies the set-up,
    but it is essential to understand that quantum algorithms can use and produce
    position of quantum gates. Once the set is set, the computation begins by applying
    a series of quantum gates, which act on one, or more qubits, transform the qubits''
    states. Not while a single gate affects only one qubit, a two-qubit gate entangle
    the qubits, creating a link between them that is fundamental to quantum algorithms.


    After a series of quantum gates, a measurement is performed on one or more qubits.
    In classical computing, reading the state of a bit is straightforward. In contrast,
    measuring a qubit is more complex due to the principles of quantum mechanics.
    A measurement collapses the qubit''s state to either |0⟩ or |1⟩. The outcome is
    inherently probabilistic, with probabilities determined by the state''s amplitude
    squared. If the same quantum circuit is run multiple times, the measurement might
    yield different results each time.


    An essential feature of quantum circuits is the ability to perform computations
    in parallel tasks By placing a qubit in a superposition of |0⟩ and |1⟩ states,
    the circuit can compute both states simultaneously. This trait does not mean that
    quantum computers can solve all problems faster than classical, but it does open
    up for specific algorithms where this parallelism can be exploited for speeds..
    When qubits are entangled, the state of one qubit is dependent on that of another.
    This powerful feature allows quantum circuits to represent and manipulate vast
    amount of information in ways that classical circuits cannot.


    Grasping the basics of quantum circuits is pivotal for understanding computing
    as a whole. These circuits are the playground where quantum principles come alive,
    showcasing the peculiarities and immense potential of quantum mechanics in computation.
    As one grows familiar with these basics, they serve as a stepping stone to more
    advanced quantum algorithms and applications.


    # 2.6 Deutsch–Jozsa algorithm


    The Deutsch-Jozsa algorithm [7] was the first quantum algorithm to demonstrate
    a clear advantage over classical computation. It solves a problem that is exponential
    in the worst-case classical setting using only a single evaluation on a quantum
    computer.


    # 2.6.1 Problem statement


    Let f: {0, 1}ⁿ → {0, 1} be a Boolean function that is promised to be either constant
    (the same output for all inputs) or balanced (outputs 0 for exactly half the inputs
    and 1 for the other half). The task is to determine which one is.


    Classically, in the worst case, one must evaluate f on 2ⁿ⁻¹ + 1 inputs. The Deutsch-Jozsa
    algorithm solves this with a single invocation of a quantum oracle (see figure
    2.1).'
