    Throughout this chapter, we aim to balance conceptual clarity and technical rigor
    to provide the tools needed to understand, evaluate, and implement generative
    models in quantum machine learning pipelines. Whether used for modeling quantum
    data or enhancing classical tasks, QGMs offer a promising frontier in the effort
    to harness quantum computing for learning tasks.


    # 7.1 Classical generative models


    Classical generative models are probabilistic models that can be parametric or
    non-parametric. They are used to represent the probability distribution of a dataset
    (X) that is comprised of observations (x) and may or not include labels (y). Generative
    models learn joint distributions p(x,y) or the marginal p(x),and trained models
    can be used to generate new samples that resemble the original data, estimate
    likelihoods, or infer missing hidden variables ideal for tasks involving synthesis,
    completion, and unsupervised learning.


    Parametric models are defined by a finite number of parameters and assume that
    observations are generated according to a specific family of distributions. For
    example, Gaussian mixture models (GMMs), assume that observations are drawn from
    a process that can be represented by the weighted combination of several base
    distributions which are assumed to be Gaussian with unknown parameters (weights,
    means, and standard deviations). Mixture models can be constructed using other
    distributions as well. Another hidden Markov models (HMMs), assume that observations
    x are generated sequentially, or by assuming that the system follows a Markov
    process in the hidden states.


    These models can be generalized under probabilistic Graph models [4]. Optimizing
    such models often employs techniques such as expectation-maximization [5] or belief
    propagation [6]. These models are interpretable and computationally tractable
    for low-dimensional or structured problems, but they struggle with high-dimensional,
    complex datasets due to their limited representational capacity.


    Non-parametric models rely on an unbonded number of parameters. Energy-based models,
    Bayesian models, and state of the deep learning models that utilize neural networks.


    # 7.1.1 Boltzmann machines and energy-based models


    Boltzmann machines (BMs) [1], their restricted variants (RBMs) [7], and the generalization
    to deep belief networks (DBNs) are generative models where data samples correspond
    to low-energy configurations of a system described by a global energy function.
    Structurally the models are neural networks where neurons are partitioned into
    visible (v) and hidden variables (h). The BM is a fully connected, recurrent network,
    whereas the RBM and DBN restrict weighted connections into bipartite graphs (no
    direct connections exist between visible or hidden variables).'
