  md: "# Quantum Machine Learning\n\n# 2.2 Dirac notation\nDirac's notation is a formalism\
    \ used in quantum mechanics to describe quantum states and the time evolution\
    \ of operators. In Dirac's notation, a vector $v'$ is represented as $|v\rangle$.\
    \ It is based on the use of the bra-ket notation, where a ket represents a column\
    \ vector and a bra is its conjugate transpose. Thus, a qubit is in the superposition\
    \ of states 0 and 1, can be represented by the vector or state $|\\psi\rangle$.\
    \ Such state can be represented as the linear combination between $|0\rangle$\
    \ and $|1\rangle$ in the following way:\n\n```\n$|\\psi\rangle = \\alpha|0\rangle\
    \ + \beta|1\rangle$\n```\n\nThe coefficients $\\alpha$ and $\beta$ are complex\
    \ numbers $(\\alpha, \beta \\in \\mathbb{C})$. The bra and ket represent vectors\
    \ in a two-dimensional Hilbert space where the states $|0\rangle$ and $|1\rangle$\
    \ form an orthonormal basis. The bra-ket notation allows one to represent inner\
    \ products, outer products, and other operations on these in a concise and intuitive\
    \ way. For example, in this orthonormal basis, we can write $|\\psi\rangle$ as\n\
    \n```\n$|\\psi\rangle = \begin{bmatrix} \\alpha \\ \beta \\end{bmatrix}$\n```\n\
    \nThe physical interpretation of $\\alpha$ and $\beta$ are the probabilities $|\\\
    alpha|^2$ or $|\beta|^2$ of finding our state in $|0\rangle$ or $|1\rangle$, respectively,\
    \ after a measurement. Furthermore, these probabilities are normalized to unity.\
    \ Finally, in Dirac's notation, the bra-ket notation is used to represent quantum\
    \ states and operators. For example, a quantum state $|\\psi\rangle$ can be represented\
    \ as a ket and an operator $A$ can be represented as a bra-ket pair $\\langle\\\
    psi|A|\\psi\rangle$.\n\n# 2.3 Bloch sphere\nThe Bloch sphere is a graphical representation\
    \ of the state of a two-level quantum system, such as a qubit. The Bloch sphere\
    \ is a sphere of unit radius, with the north pole representing the state $|0\r\
    angle$ and the south pole representing the state $|1\rangle$. Any state is a point\
    \ on the surface of the Bloch sphere. For example, the state $|+\rangle$, which\
    \ is a superposition of $|0\rangle$ and $|1\rangle$, is represented by the point\
    \ on the equator that is halfway between the north and south poles.\n\nThe Bloch\
    \ sphere\nAny point on the surface of the Bloch sphere represents a state of a\
    \ two-level system.\nThe generalization of such a state can be represented through\
    \ the parameters $\\gamma, \theta, \\phi$:n\n$|\\psi\rangle = e^{i\\frac{\\phi}{2}}(\\\
    cos\\frac{\theta}{2}|0\rangle + \\sin\\frac{\theta}{2}e^{i\\phi}|1\rangle)$"
