  md: '# Trade-offs


    While generalized PSR preserves many of the advantages of the original rule—such
    as no acillae, hardware-compatibility, and bias-free estimation——it introduces
    a few complications:


    +   - **Increased cost**: The number of evaluations per parameter scales with
    the number of unique eigenvalues in the generator. In the worst case, this can
    become impractical.

    - **Complex precomputation**: The coefficients $c_i$ and shifts $s$ are model-dependent
    and must be derived for each generator.

    - **Less common in practice**: Most-near applications are still dominated by circuits
    from Pauli rotations and controlled-NOT gates, where the standard PSR suffices.


    However, as quantum qubits grow more expressive and incorporate more diverse sets
    (e.g. in analog quantum computing or Hamiltonian simulation), generalized PSR
    will likely become increasingly relevant.


    # Alternative: gate decomposition


    In practice, rather than applying the generalized rule directly, it is often preferable
    to decompose complex sets into standard gates with known parameter-shift rules.
    For example:


    +   - Controlled-rotation gates can be decomposed into basic Pauli rotations plus
    CNOTs.

    - Multi-orbit unitaries can be decomposed into a universal gate set (e.g. Clifford
    + T), enabling the use of basic PSR.


    This strategy reduces the burden of developing shift rules for each new gate,
    at the cost of increasing circuit depth.


    # 6.2.4 Finite differences and simultaneous perturbation stochastic approximation


    While the PSR provides exact, hardware-compatible gradients under specific conditions,
    there are scenarios where one of a gate has a complex spectrum or is unknown.


    +   - The generator of a gate has a complex spectrum or is unknown.

    - The gate is non-analytic or device-specific.

    - The cost of multiple circuit evaluations per parameter is too high.


    In such cases, *black-box gradient estimators* such as *finite-differences and
    simultaneous perturbation stochastic approximation (SPSA)* [23] offer useful alternatives.
    These methods do not rely on circuit structure or spectral properties and can
    be used to train any differentiable or non-differentiable function approximator,
    including noisy or proprietary quantum hardware.


    # 6.2.4.1 Finite-difference estimators


    Finite-difference methods estimate the gradient of a function by evaluating the
    function at nearby points and computing a difference quotient. For a scalar function
