- pgno: 10
  md: '# Preface


    Quantum computing and machine learning are some of today''s most active and rapidly
    expanding fields of research and development. Quantum machine learning has evolved
    in recent years as a subdiscipline of quantum computing that explores how quantum
    computers can be used for machine learning tasks—in other words, how quantum computers
    can learn from data, either quantum or classical. Quantum machine learning is
    an exciting field because it holds the promise of accelerating classical machine
    learning algorithms.


    This book will showcase the growing number of algorithms and practical applications
    of quantum machine learning. Starting from the foundational approach that reformulates
    learning theory in a quantum setting, this book will highlight recent efforts
    to find quantum algorithms that speed up machine learning regarding computational
    complexity. The book will also cover new machine learning applications tailored
    for noisy intermediate-scale quantum (NISQ) devices from near-term or co-design
    perspective, quantum-classical methods. The aim of this book is to help readers
    develop a clear understanding of the promises and limitations of the current machine
    learning, and help them define directions for future research in this exciting
    field. We start by looking at the quantum mechanical principles that enable quantum
    computing and helping the reader gather some intuition about how to harness these
    quantum mechanical properties to speed up some computational tasks. Then, we introduce
    the reader to some of the basic quantum algorithms that are often used to develop
    more complicated algorithms. Later, we explore the different fields of study in
    quantum machine learning, which are related to the choice of algorithm, and whether
    it operates on quantum or classical data. Finally, we describe the state-of-the-art
    for quantum machine learning algorithms including both supervised and unsupervised
    learning, discussing their applications and limitations for implementation on
    near-term devices.


    Quantum machine learning is a subject in the making, with endless possibilities
    for applications in the near and long term. Nonetheless, to find out what quantum
    machine learning has to offer, its numerous avenues first have to be explored
    by an interdisciplinary community of scientists and quantum computing enthusiasts.
    We intend this book to be a possible starting point for this journey, as it is
    intended to introduce some key concepts, ideas, and algorithms that are the result
    of the first few years of quantum machine learning research. Our aim is to provide
    a comprehensive literature review and to summarize key topics that appear often
    in quantum machine learning, to put them into context and make them accessible
    to a broader audience in order to foster future research and applications.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Author biographies


    # Dr Andrea Delgado


    Dr Andrea Delgado is a Research Scientist in the Physics Division at Oak Ridge
    National Laboratory. Her research focuses on quantum computing applications to
    high-energy physics, with an emphasis on developing novel algorithms for data
    analysis and simulation in large-scale particle physics experiments, such as those
    at the Large Hadron Collider. She is a recipient of the prestigious Eugene Wigner
    Fellowship, awarded for her pioneering work at the intersection of quantum information
    science and fundamental physics. Dr Delgado serves on the steering committee of
    the IBM/CERN Quantum Computing for High Energy Physics Working Group and has played
    a leadership role in IEEE Quantum Week since its inception, multiple terms as
    Technical Program Chair. She is also an Associate Editor for IEEE Transactions
    on Quantum Engineering. Dr Delgado received her PhD in Physics from Texas A&M
    University, where she specialized in searches for new physics. Her current work
    explores quantum machine learning, quantum generative modeling, and hybrid quantum-classical
    algorithms with the aim of advancing discovery in high-energy and nuclear physics.


    # Dr Kathleen E Hamilton


    Dr Kathleen E Hamilton is a Research Scientist in the Quantum Computational Science
    Group at Oak Ridge National Laboratory. Her research interests cover the development
    of benchmarks and algorithms for next-generation processors in quantum computing
    or neuromorphic computing. Her work in quantum machine learning includes designing
    new approaches for natural language processing, reservoir computing, and using
    machine learning workflows to benchmark near-term quantum devices. She has served
    on the Program Committee for the International Conference on Neuromorphic Systems
    (ICONS) from 2019 to 2021, and has organized the Quantum Artificial Intelligence
    Workshop which has been a part of IEEE’s Quantum Week since 2020. She received
    her PhD from the University of California at Riverside.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# # Quantum Machine Learning


    Concepts and possibilities


    Andrea Delgado and Kathleen E Hamilton


    # # Chapter 1


    # # Introduction


    # ## 1.1 Motivation and scope


    The accelerating development of quantum technologies has opened new frontiers
    in computation, communication, and sensing. Among the most promising direction
    is **quantum machine learning (QML)**.


    QML aims to explore whether and how quantum resources can enhance learning tasks,
    improve model expressivity, or accelerate training and inference. It combines
    the principles of quantum mechanics and machine learning to explore new ways of
    processing, analyzing, and generating data.


    This book introduces the core ideas, algorithms, and challenges in *QML*, presenting
    both theoretical foundations and practical applications tailored for current and
    near-term quantum devices. The text is structured to serve as a *self-contained
    textbook*, suitable for graduate students or researchers with a working knowledge
    of quantum computing and a general background in classical machine learning.


    Quantum speedup in learning


    QML is motivated by the potential for *computational speedups* over classical
    algorithms [1]. But what ‘speedup’ mean in general? In a quantum algorithm exhibits
    *quantum speedup* when it solves a problem with lower resource usage (e.g. time,
    queries, or samples) than any known algorithm [2]. These speedups can take various
    forms:


    +   * **Polynomial speedup**: Occurs when a quantum algorithm reduces the runtime
    from $O(n^k)$ to $O(n^m)$ for $m < k$. *Example*: Grover''s algorithm [3] for
    unstructured search achieves a quadratic speedup ($O(N)$ to $O(\sqrt{N})$).


    +   * **Exponential speedup**: Occurs when a quantum algorithm solves a task in
    poly(n) while classical solutions require exp(n). *Example*: Shor''s factoring
    algorithm [4].'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'Super-polynomial speedup in query complexity: In some learning-theoretic settings,
    some concept classes can be learned with exponentially fewer queries by quantum
    learners. For example, certain parity functions can be learned with exponentially
    fewer queries on a quantum computer [5, 6].


    Applications to learning theory: Let us consider a few scenarios where quantum
    speedup is either proved or conjectured in the context of learning:


    +   * PAC learning: In the probably approximately correct (PAC) framework, quantum
    learners can improve sample complexity or access richer hypothesis classes when
    provided with quantum examples [7, 8].

    * Fourier sampling: Quantum algorithms can access the Fourier coefficients of
    Boolean functions more efficiently than classical algorithms [9, 10]. This yields
    exponential speedups for specific function classes, such as jurtas or parity functions.

    * Quantum kernel estimation: Classically intractable kernels (e.g. those based
    on the overlap of quantum states) can be estimated efficiently on a quantum computer,
    enabling quantum-enhanced classification [11–16].

    * Quantum generative models: In generative modeling [17], quantum circuits represent
    distributions that are difficult to sample or describe classically, suggesting
    a form of expressive advantage [18].


    **Key Example:** Learning DNF formulas. The class of disjunctive normal form (DNF)
    formulas is conjectured to be difficult to learn classically in the PAC model,
    but quantum learners with access to quantum examples can achieve better sample
    efficiency under certain assumptions [19].


    # 1.2 The promise of quantum machine learning


    Machine learning has become an indispensable tool across science, technology,
    and industry, powering advances in areas ranging from medical diagnostics to high
    energy physics. Despite this, many learning tasks remain constrained by classical
    computational resources, in particular when dealing with high-dimensional feature
    spaces, large-scale generative models, or intractable optimization landscapes.
    Quantum computing introduces fundamentally different computational principles
    that offer new possibilities for overcoming these limitations. By harnessing superposition,
    entanglement, and quantum inference, quantum computers can represent and process
    information in ways that have no classical analog.


    The central promise of QML lies in the hope that quantum algorithms can provide
    speedups, improved express, or more efficient data encoding for specific tasks.
    In some cases, quantum algorithms may reduce the complexity of a learning task,
    enabling solutions to problems that are otherwise infeasible. In others, quantum-enhanced
    methods explore richer hypothesis spaces or learn data distributions that are
    difficult to simulate with classical resources. At the interface of these possibilities
    is a rapidly evolving field that reimagines both the tools and goals of learning
    theory through the lens of quantum computation.'
  merge: -1
  img_proc: true
- pgno: 14
  md: "# Quantum Machine Learning\n\n way, the potential of QML is not limited to\
    \ achieving runtime improvements. The development of quantum-native models—algorithms\
    \ that operate directly on quantum data or within quantum systems—suggests new\
    \ paradigms for information processing. These models are not simply quantum analogs\
    \ of classical algorithms but often involve novel approaches that exploit the\
    \ structure of quantum mechanics to redefine what learning can mean. The remainder\
    \ of this book explores both the theoretical underpinnings and practical implementations\
    \ of these approaches, with attention to the opportunities and limitations they\
    \ present for near-term and future quantum hardware.\n\n# When and why quantum\
    \ models might help\n\nQuantum models offer potential advantages in machine learning\
    \ due to their ability to represent, manipulate, and sample from high-dimensional\
    \ spaces more efficiently than classical models in certain settings. Unlike classical\
    \ models, quantum algorithms use complex amplitudes and patterns that encode richer\
    \ geometric structures. QML may help in one or more of the following ways:\n\n\
    +   **Computational speed**: Certain subroutines—such as solving linear systems\
    \ [20], estimating kernels [11], or sampling distributions—can be executed more\
    \ efficiently on a quantum computer.\n\n+   **Model expressivity**: Quantum circuits\
    \ represent probability distributions and functions that are difficult or impossible\
    \ for classical models to simulate efficiently [21].\n\n+   **Compact data encoding**:\
    \ Through amplitude [22] or Hamiltonian encoding [15], quantum states can represent\
    \ exponentially large feature spaces [11, 12], potentially enabling better generalization\
    \ from fewer physical resources.\n\n+   **Quantum advantage on quantum data**:\
    \ For tasks involving inherently quantum data (e.g. quantum states from sensors\
    \ or simulators), quantum models offer a natural computational framework with\
    \ no classical analog [23].\n\nNote that these potential benefits are subject\
    \ to ongoing research. Not every learning problem benefits from quantum models,\
    \ and practical performance depends on hardware limitations, the structure of\
    \ the data, and the design of the algorithm. The goal of this book is to explore\
    \ where and how such advantages may be realized.\n\n# 1.3 Quantum computing: a\
    \ refresher\n\nTo understand how quantum mechanics can be harnessed for learning\
    \ tasks, it is helpful to recall the foundational principles of quantum computing.\
    \ The basic unit of quantum information is the qubit, which unlike a classical\
    \ bit, can exist in a superposition of its two states. A qubit is described by\
    \ a complex-valued unit vector in a two-dimensional Hilbert space, and through\
    \ the application of unitary transformations. These unitary operations are implemented\
    \ using quantum gates, which manipulate individual qubits or pairs of qubits through\
    \ reversible, deterministic dynamics governed by the Schrödinger equation."
  merge: -1
  img_proc: true
- pgno: 15
  md: "# Quantum Machine Learning\n\n![](img/7dbe239d4cc1f635a551b6e06f3d3df9_15_0.png)\n\
    \n**Figure 1.1.** A simple circuit illustrating the basic structure of quantum\
    \ computation. The circuit begins with qubit initialization in the $|0\rangle$\
    \ state, followed by unitary gate operations (including entangling gates), and\
    \ ends with measurement in the computational basis. This process forms the core\
    \ abstraction for quantum algorithms.\n\nAn essential feature of quantum systems\
    \ is entanglement, a form of non-classical correlation that enables the joint\
    \ state of multiple qubits to encode information that cannot be decomposed into\
    \ separate components. Entanglement plays a crucial role in many quantum algorithms\
    \ and is often viewed as a resource that allows for quantum advantage. In practice,\
    \ quantum computations are carried out by assembling circuits which consist of\
    \ a sequence of gate operations acting on an initial quantum state, followed by\
    \ a final measurement. Measurement projects the quantum state onto a classical\
    \ outcome according to the Born rule, introducing probabilistic behavior even\
    \ when the evolution is entirely deterministic (figure 1.1).\n\nQuantum algorithms\
    \ exploit the unique structure of quantum mechanics to solve problems in ways\
    \ that are inaccessible to classical computation. The development of such algorithms—such\
    \ as Grover's search or Shor's factoring—has provided theoretical insight and\
    \ practical motivation for building quantum hardware. These foundational algorithms\
    \ also serve as building blocks in more complex routines, including those used\
    \ in QML. As we progress through this book, we will revisit these concepts in\
    \ more detail, particularly in contexts where they directly inform the design\
    \ of quantum learning models.\n\n# 1.4 Machine learning foundations\n\nMachine\
    \ learning is a broad and evolving field that aims to develop models capable of\
    \ recognizing patterns, making predictions, or generating new data from examples.\
    \ At its core, machine learning involves the approximation of a function or distribution\
    \ using a dataset sampled from an unknown process. This is typically achieved\
    \ by selecting a hypothesis class—such as neural networks (NNs)—and optimizing\
    \ the parameters of a model to minimize some notion of loss or error with respect\
    \ to training data.\n\nA standard distinction is drawn between supervised and\
    \ unsupervised learning. In supervised learning, the model is trained on labeled\
    \ examples, where the goal is to generalize beyond the observed inputs to correctly\
    \ predict unseen outcomes. In"
  merge: -1
  img_proc: true
- pgno: 16
  md: 'Table 1.1. Correspondence between classical and quantum machine learning terminology.
    While classical models operate on vectors and real-valued functions, quantum models
    manipulate quantum states using parameterized circuits and observables.


    | Classical machine learning | Quantum machine learning |

    |---|---|

    | Data | Quantum state |

    | Model | Parametric circuit |

    | Feature map | Data encoding |

    | Loss function | Observable |

    | Training | Optimization |


    contrast, unsupervised learning seeks to uncover hidden structure in data without
    explicit labels, by identifying clusters, reducing dimensionality, or learning
    generative representations. In both settings, the concepts of generalization,
    overfitting, and regularization are essential for understanding model performance
    on unseen data. These challenges arise because the learner must strike a balance
    between flexibility and inductive bias—choosing a rich enough to capture relevant
    patterns but constrained enough to avoid fitting noise.


    The training process is typically framed as an optimization problem. A cost function,
    or loss quantifies how the models'' predictions are from the desired outcomes,
    and the model''s parameters are adjusted iteratively using optimization algorithms
    such as gradient descent or its variants. In deep learning, the hypothesis class
    is often a highly non-linear, layered composition of functions with millions of
    parameters. See table 1.1 for the correspondence between classical and quantum
    machine learning terminology. Given the complexity of such models, empirical evidence
    shows they can perform remarkably well when trained on large datasets, provided
    that the optimization landscape is well-behaved and the model capacity is sufficient.


    These foundational ideas will recur throughout the book as we explore quantum
    models for learning. Many of the concepts—such as model selection, generalization,
    and optimization—carry over to the quantum domain, but they must be re in light
    of quantum constraints, such as measurement-induced noise, circuit depth limitations,
    and the probabilistic nature of quantum state preparation and inference. The challenge,
    and promise, of QML lies in identifying which elements of this classical framework
    can be enhanced or replaced by quantum mechanisms, and in understanding when such
    replacements yield practical or theoretical benefits.


    #  1.5 Types of quantum machine learning


    QML encompasses a broad range of algorithmic strategies, shaped by the interplay
    between the data and the computational model used. At its core, QML research asks
    whether quantum resources can offer an advantage over classical methods in tasks
    such as classification, regression, sampling, or generative modeling. However,
    not all QML algorithms engage with quantum mechanics in the'
