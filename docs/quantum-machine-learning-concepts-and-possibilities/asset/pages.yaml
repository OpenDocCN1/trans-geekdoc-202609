    # Quantum computing for inference


    Supervised learning is a central paradigm in classical machine learning, wherein
    a model learns a mapping from inputs to outputs using labeled data. From image
    classification to spam detection, supervised learning algorithms are widely used
    to extract patterns from data and make reliable predictions on unseen examples.
    At the heart of these methods lie models, often linear or nonlinear, that learn
    decision boundaries based on the training data, and tools such as feature maps
    and kernels that enhance the model''s ability to capture complex relationships
    in high-dimensional spaces.


    With the advent of quantum computing, researchers have begun to explore how quantum
    mechanical principles can be harnessed to enhance the performance of inference
    algorithms. Quantum computers, by operating in Hilbert spaces of exponentially
    large dimension, offer a new substrate for representing and processing information.
    In particular, quantum machine introduces a novel approach to supervised learning
    by replacing classical components, such as feature maps or inner products, with
    their quantum analogues. These include quantum feature maps, which encode classical
    data into quantum states, and quantum kernels, which evaluate the similarity of
    data points via quantum circuits.


    The key insight is that certain quantum feature maps can implicitly embed data
    into extremely high-dimensional spaces, where learning tasks may become easier,
    and where classical computers would struggle to compute the corresponding inner
    products. This opens the possibility of quantum-enhanced inference, where quantum
    circuits help extract patterns from data in a way that is more expressive or efficient
    than classical models, at least in principle.


    In this chapter, we explore the role of quantum computing in supervised learning
    from the perspective of inference. We begin with a brief review of classical inference,
    feature maps, and kernel methods. We then introduce the notion of quantum maps
    and how they induce quantum kernels can be used within kernel-based learning algorithms
    such as support vector machines (SVMs). We also discuss parameterized quantum
    circuits (PQCs) that act as linear models in Hilbert space and can be trained
    to perform classification tasks.'
