  md: "# Quantum Machine Learning\n\n#  4.3.2 Evaluating kernels\n\nIn practice, the\
    \ quantum kernel $\\kappa(x, x')$ is evaluated using a quantum circuit. Two\n\
    common strategies are:\n\n+   * The swap test: A circuit that estimates the overlap\
    \ $|\\langle\\phi(x)|\\phi(x')\rangle|^2$ by using an\nancilla qubit to interfere\
    \ with two quantum states. This requires controlled-swap\ngates and multiple copies\
    \ of the states.\n* Direct fidelity estimation: If both states $|\\phi(x)\rangle$\
    \ and $|\\phi(x')\rangle$ are prepared on the\ndevice, the fidelity can be estimated\
    \ by preparing the state $U_\\delta(x)^\\dagger U_\\delta(x')|0\rangle$ and measuring\
    \ the probability of obtaining the all-zero state.\n\nAfter computing pairwise\
    \ kernel values over a training set, one obtains the\nkernel matrix $K$, where\
    \ $K_{ij} = \\kappa(x_i, x_j)$. This matrix is then used as input to a\nclassical\
    \ kernel method such as an SVM, yielding a hybrid quantum-classical\nlearning\
    \ pipeline.\n\n#  4.3.3 Training with quantum kernels\n\nOnce the kernel matrix\
    \ is computed, the training procedure follows that of a\nstandard classical kernel\
    \ method. For instance, in an SVM classifier, the optimiza-\nproblem involves\
    \ solving a quadratic,\n\n```\n$$\\min_{\\alpha} \\frac{1}{2}\\sum_{i,j} \\alpha_i\\\
    alpha_j\\kappa(x_i, x_j) - \\sum_i \\alpha_i y_i, \\quad (4.14)$\n```\n\nsubject\
    \ to the constraints $0 \\le \\alpha_i \\le C$ and $\\sum_i \\alpha_i y_i = 0$,\
    \ where $\\alpha_i$ are dual variables\nand $C$ is a regularization parameter.\n\
    \nImportantly, this is performed on a classical computer. The quantum\ndevice\
    \ is only used to compute the kernel matrix $K$, which captures the geometry of\n\
    data in Hilbert space.\n\n#  4.3.4 Generalization and expressivity\n\nA key question\
    \ in quantum computation is whether quantum kernels offer any\nstatistical or\
    \ computational advantage over classical kernels. Several recent years\nhave analysed\
    \ this question through the lens of:\n\n+   * Kernel alignment: Measures how well\
    \ the quantum kernel matrix aligns with\nt ideal kernel separates the data. Poor\
    \ alignment can result in\nunderperformance compared to classical kernels.\n*\
    \ Inductive bias and reproducing kernel Hilbert space (RKHS): Every positive-\\\
    inite kernel defines an RKHS. The hypothesis class of quantum kernel\nmethods\
    \ is constrained by the RKHS associated with $\\kappa(x, x')$, which\ndetermines\
    \ the types of functions that can be learned.\n* Hardness of classical approximation:\
    \ If $\\kappa(x, x')$ is difficult to approximate\nclassically (e.g. related to\
    \ problems such as random circuit sampling or\ninstantaneous quantum polynomial-time\
    \ (IQP) models), the quantum kernel\ncould provide a separation from classical\
    \ methods."
