  md: '# Quantum Machine Learning


    Concepts and possibilities


    Andrea Delgado and Kathleen E Hamilton**


    # Chapter 2


    # Quantum information processing


    Quantum information theory is a branch of physics and computer science that deals
    with the behavior and manipulation of information at the quantum level. It is
    based on the principles of quantum mechanics, the fundamental theory of describing
    the behavior of matter and energy at the atomic and subatomic scales.


    In classical information theory, information is represented by bits—fundamental
    units that can take values of 0 or 1. In contrast, quantum information is represented
    by **quantum bits**, **or qubits**, which can exist in a superposition of states,
    enabling more complex and parallel computation.


    Quantum information theory has wide applications in quantum computing, quantum
    communication, quantum cryptography, and quantum metrology. Key concepts include
    entanglement, quantum teleportation, and quantum error correction. Entanglement
    describes correlations between quantum systems that cannot be explained classically.
    Quantum teleportation allows the transmission of states via classical communication
    and entanglement. Quantum error correction ensures the robustness of quantum information
    in the presence of noise.


    This chapter introduces core principles of quantum mechanics as they pertain to
    computation, including qubit states, gates and circuit-based algorithms. The final
    section provides an overview of the **postulates of quantum mechanics**, and introduces
    canonical algorithms such as **Deutsch-Jozsa''s algorithms** and **Grover''s algorithms**
    for ground future quantum machine learning (QML) discussions.


    # 2.1 Quantum computing


    Quantum computing uses principles of quantum mechanics—superposition, entanglement,
    and interference—to perform computations. A **qubit** can be both 0 or a 1 simultaneously
    due to superposition, and its state is represented in a two-dimensional Hilbert
    space $\mathcal{H} \cong \mathbb{C}^2$.'
