    Jefts 是一位 30 多岁的深思学者，她是芝加哥某大学的档案管理员和艺术史学家，她从未想过自己的裸体照片会在互联网上传传。但 2011 年，在 Jefts
    与一位住在意大利的男友结束异地恋后不久，他们 `Skype` 对话的露骨截图开始在网上出现。这些截图被发送给她的家人和朋友，发布在 `Facebook` 上并伴随着对她的暴力威胁，甚至出现在专门揭露他人性传播疾病的网站上，并对她的性史做出了虚假指控。


    ## 非自愿色情与报复性色情


    Jefts 所的经历有一个专门的名称，这是一种数字性犯罪，颠覆了成千上万的人生，但大多数仍然逃法执法部门的监管：非自愿色情，广为人知的报复性色情。两者并不完全：报复性色情通常是为了骚扰受害者，而任何在未经主体同意的情况下传播的图像都属于非自愿色情。但两者都可能导致公众性贬低、社会孤立和职业羞辱。


    ## 技术的影响


    在技术和文化剧变的推动下，这种变化让每个口袋里都有摄像头，并为每条社交媒体帖子创造了全球观众，非自愿色情变得日益普遍。几乎每天都有新案例报道：德克萨斯州一名
    19 岁的女性在情男友威胁要发布她的露骨视频后，被勒迫与另外三个青少年发生性。该男子承认威胁泄露亲密视觉材料罪名成立，被罚款 400 美元并判处缓刑。新泽西州一名
    20 多岁的女性在在前男友发布了她的照片和地址并邀请人们“来约会”后，有奇怪的男人来她的门口。犯人被指控侵犯隐私，并被判处六个月监禁并执行了三个月。伊利诺伊州一位
    50 多岁的学校学监被解雇，据称她的前丈夫将她的一段露骨视频给了校委会。


    ## 普及率与社交媒体


    其中一些私人照片和视频会流向色情网站，在那里，“报复”本身就是一种类型。然而，它们通常被发布在社交媒体上，受害者的所有朋友都能看到。根据 `The 卫报`
    获取的文件，`Facebook` 仅 2017 年 1 月就收到了超过 51,000 份报复色情报告，导致该网站禁用了超过 14,000 个账号。`Data
    and Society` 杂志对 3,000 名网络用户进行的 2016 年调查显示，大约 25 个美国人中有一人曾被未经许可发布照片或被威胁要这样做——对于
    30 岁以下的女性，这一数字上升到 10 分之一。反报复色情倡导组织 `Cyber Civil Rights Initiative` (`CCRI`) 在
    `Facebook` 月的一项调查显示，20 名社交媒体用户中有一人发布过未经同意的性图像。


    ## 黑客与全球案例


    在某些情况下，犯罪者是针对知名女性的黑客，寻找可以泄露的敏感照片。去年，《周六夜现场》明星 Leslie Jones 被黑客，她的裸照在网上流传。2014
    年，詹妮弗·劳伦斯和其他女星的裸照被破解并泄露，这是迄今最大的非自愿色情案件之一。而且这是一个全球几乎每个地方存在的问题：2017 年 5 月，卢旺达总统候选人
    Diane Shima Rwigara 在宣布打算挑战该国长期领导人 Paul Kagame 几天后，据称她的裸照出现在了网上。


    ## 性侵犯与数字文化


    （此处内容为原文中重复的“Sexual violation”，已根据要求未进行重复输出）

