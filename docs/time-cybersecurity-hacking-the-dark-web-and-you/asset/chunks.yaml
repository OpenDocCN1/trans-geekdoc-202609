    2014 年 11 月 3 日（周一），来自位于硅谷的小型“威胁情报”公司 Norse Corp.的一个四人小组早早来到位于洛杉矶郊区库尔弗城（Culver
    City）的索尼影业娱乐片场，参加上午 11:30 的会议。他们计划见索尼的高级网络安全经理，推销 Norse 的服务，以帮助片厂抵御多年来一直扰索尼的黑客。


    在大门经过快速的安全检查后，他们来到索尼园区东侧的乔治·伯恩大楼，Norse 小组直接走进了信息安全部门未锁门的一楼办公室，那里挂着一个写有 `INFO SEC`
    的小牌子。那里没有接待员或保安人员检查他们的身份；事实上，现场根本没有别人。房间里有很多工位，上面的无人看管的电脑可以访问索尼的国际数据网络。


    访客们找到了索尼信息安全高级副总裁杰森·斯帕尔罗（Jason Spaltro）办公室外的一个小休息区，坐下并等待。他们独自坐在那里，等了大约 15 分钟。


    “我感到有点震惊，”Norse 的联合创始人兼首席技术官托米·斯蒂森（Tommy Stiansen）说，“他们的信息安全部门是空的，所有的屏幕都处于登录状态。基本上，清洁工可以直接走进他们的信息安全部门。”协助安排会议并出席当日的资深娱乐业律师米基·沙普罗（Mickey
    Shapiro）补充道：“如果我们是坏人，本可以做些可怕的事情。”


    最后，自 1998 年起一直任职索尼的斯帕尔罗出现了，带领他们来到附近的一个会议室，另一位片厂信息安全高管在那里等候。会议开始了，当斯蒂森描述 Norse
    如何评估潜在威胁时，斯帕尔罗打断了他：“天哪，这真的能对我们处理那部韩国电影非常有帮助！”根据四位 Norse 代表的说法，斯帕尔罗解释说，他担心一部由赛斯·罗根（Seth
    Rogen）主演的喜剧片《会面》（The Interview），片厂正计划在圣诞节上映。该片涉及刺杀该国实际领导金正正的情节。斯蒂森回忆道：“他们说朝鲜威胁他们。”（索尼否认了任何关于朝鲜网络威胁的说法。）


    大约一小时后，根据 Norse 团队的说法，索尼团队宣布会议“非常有成效”，并承诺保持联系。他们离开了，让访客们自行寻找出口。


    ### 网络攻击


    三周后——从太平洋时间 11 月 24 日（周一）上午约 7 点开始——索尼影业遭受了一场毁灭性的网络攻击。登录网络的员工听到枪声，看到屏幕滚动的威胁信息，以及一个巨大的火光骷髅笼罩在片厂前两位高管矮小僵尸化头部之上的威胁形象。


    在索尼的 IT 人员来得及拔掉电源之前，黑客的恶意软件已经在整个园区及跨越大陆的机器之间跳跃，摧毁了索尼全球网络的一半。它删除了 6,797 台个人电脑中的
    3,262 台以及 1,555 台服务器中的 837 台存储的所有内容。为了确保没有任何数据可以恢复，攻击者甚至添加了一点额外的“毒药”：一种特殊的删除算法，以七种不同的方式覆盖数据。完成后，代码击毁了每台电脑的启动软件，使机器陷入“脑死亡”。


    从恶意软件发布的那一刻起——在黑客首次入侵几个月后——仅用一小时，索尼影业就回到了录像带（Betamax）时代。该片厂被迫使用传真机，通过张贴的消息交流，并用纸质支票向
    7,000 名员工发放工资。


    ### 数据泄露与后果


    这只是索尼恐怖故事的开始。在销毁公司数据之前，黑客已经偷走了它们。在接下来的三周里，他们将九批机密文件上传到了公共文件共享网站：内容涵盖一切，从未完成的电影剧本、令人脸脸的邮件，到工资单以及超过
    47,000 个社会安全号码。五部索尼电影（其中四部尚未发行）被泄露到盗版网站网站供人免费观看。随后，黑客威胁要对影院发动“9/11”式的袭击，迫使索尼放弃了《会面》在圣诞节上映的计划。一周后，在引发巨大骚动后，该片厂宣布，无论如何，他们都将通过视频点播和在几百家影院上映该电影。


    12 月 19 日，联邦调查局将黑客归咎于朝鲜，朝鲜曾对该电影发布过威胁。白宫随后采取了经济制裁。索尼因其极其糟糕的判断（拍了一部描写杀害朝鲜领导人的喜剧片）以及其似乎的屈协而饱受指责。


    ### 索尼的防御


    在索尼看来，公司是一个无辜的受害者。在 12 月接受国家公共广播电台（NPR）的采访时，林顿（Lynton）坚持认为他的公司已经“做了充分的准备”，但面对的是“历史上最糟糕的网络攻击”。他多次将其描述为一次“极其复杂的攻击”。索尼影业通过其首席发言人罗伯特·劳森（Robert
    Lawson）对问题提供了书面回复。他说，林顿没有解雇或惩罚任何人的计划。


    劳森在声明中辩解道，“任何认为索尼娱乐能够防御这种攻击的建议都是深度错误的，并且忽略了联邦调查局和凯文·曼迪亚（Kevin Mandia）所提出的关键发现和评论——这两个人都是对此调查中……证据最了解的人。当时的联邦调查局网络部门助理局长约瑟夫·德马雷斯特（Joseph
    Demarest）在美国参议院听会上的表述再再清晰了：‘所使用的恶意软件会溜过，可能会绕过今天私营部门现有 90%的网络防御，我甚至敢说政府部门也是如此。’
    ”声明继续道，“曼迪亚也解释了此次攻击中使用的外取方法的复杂性使得它们几乎无法被检测。曼迪亚和联邦调查局都表示，所使用的恶意软件是行业标准杀毒软件无法检测的。”

