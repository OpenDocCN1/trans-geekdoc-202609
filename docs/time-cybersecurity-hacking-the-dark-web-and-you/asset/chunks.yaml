    #### Google’s Elite Hacker SWAT Team

    Brash. Controversial. A guard against rising digital threats around the globe.
    Google’s Project Zero is securing the internet on its own terms. Is that a problem?
    BY ROBERT HACKETT


    ![image](images/ZER07_Google_Hacker_SWAT_Team.png)


    One Friday afternoon in February 2017, Tavis Ormandy, a virtuosic security researcher
    with a brown buzz cut and an uneasy smile, was performing some routine fuzzing,
    a common code-testing technique that blasts software with random data to expose
    faults, at his desk at Google headquarters in Mountain View, Calif. The process
    was going as expected when he spotted something amiss in the data set.


    Weird, he thought. This isn’t typical corrupted data. Instead of the expected
    output, he saw bizarrely configured anomalies—strange chunks of memory strewn
    about. So he dug deeper.


    After assembling enough information, Ormandy called his fellow security researchers
    into a huddle to share what he had found. The Google team, which goes by the name
    Project Zero, soon realized what it was looking at: a wide-ranging data leak spouting
    from a San Francisco company called Cloudflare. Most of the time, Cloudflare’s
    content-delivery network processes roughly a tenth of the world’s internet traffic
    without a hitch. But Ormandy had discovered that the company’s servers were splattering
    people’s private data across the Web. The information had been leaking for months.

