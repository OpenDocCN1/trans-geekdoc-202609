    Rogen 并不总是计划要拍一部关于刺杀朝鲜实际统治者的喜剧片。根据采访记者编剧 `Dan Sterling` 的说法，早期脚本曾用过一个名为 `Kim Il-hwan`
    的虚构角色。他坚持认为，最初建议使用 `Kim` 这个名字的是一位片厂高管（他拒绝透露该人的姓名）。Rogen 和 `Goldberg` 非常喜欢这个主意。与比如
    `中国`（作为一个重要的电影市场，因此 `Sony` 不想疏远）不同，朝鲜被认为是好莱坞可以进行挑衅性素材创作的领域。`Pascal` 和 `Lynton`
    批准了这一改变。


    事后回来看，很容易对这个决定产生怀疑。朝鲜是一个（拥有核导弹的）流氓国家，由一位反复无常、不可预测的独裁者领导。一位曾与 Sony 合作过的电影制作人告诉《财富》杂志：“有必要点名金正恩吗？这在票房上真的会有那么大影响吗？如果你拍的是严肃电影那是一回事。但这是一部放屁电影！”


    《终极记者》的剧情现在已广为人知。由 `James Franco` 扮演的笨蛋小报口秀主持人和他的兄弟制作人（`Rogen`）受邀前往朝鲜采访 `Kim Jong
    恩`，后者是他们节目的秘密粉丝。随后，`CIA` 雇用两人刺杀 `Kim`。发生了一系列笑料。最后以 `Kim` 在直升机中惨死结束，`Franco` 和
    `Rogen` 的角色用一台征用的坦克将其击落。


    《终极记者》的制作耗资 4400 万美元（其中 820 万美元给了 Rogen），营销预算为 3200 万美元。`Sony` 对这部 R 级喜剧有很高的票房预期：1
    亿到 1.35 亿美元。电影中出现了老虎、军事装备和昂贵的特效。即使是 `Rogen` 也对他享有的自由度感到惊叹，他在上映前告诉《滚石》杂志：“他们给了我们疯狂的资金，让我们随心所欲做什么。”


    鉴于这对人的商业成功，`Sony` 有强烈的动力让 `Rogen` 和 `Goldberg` 保持愉快并留在片厂内，他们在一套办公室里工作，并在园区里散步抽大麻。Sony
    线下营销总裁 `Dwight Caines` 在一封邮件中告诉 `Rogen`：“我们喜欢你的电影，坦率地说，你们是我们最重要的合作关系。”《终极记者》的试映表现非常好。`Pascal`
    在 4 月写给 `Rogen` 及其团队时道：“被这部电影震撼了，也被你们震撼了。”“谢谢你们让我们拍这部电影，”`Rogen` 回道，“没有别人会这么做。”


    `Rogen` 和他的合作者似乎真心想要对 `Kim` 政权疯狂且压迫的方式发表表态。`Sterling` 说：“我对于有机会拍出一部在色色笑话中夹杂一些政治评论的大众制片厂电影而感到非常兴奋。”
    Sony 高管们似乎也赞同。`Caines` 在 5 月写给 `Rogen`：“这部电影正在做一些非常大胆的事情，我不确定是否有过其他电影做过——将一个如此臭名昭著的人物作为题材。这种角度让电影引值得关注……幽默中带着一丝聪明。”


    6 月 17 日，泄露的邮件显示，`Sony` 嘲讽“真实人物”的胃口立刻消失了。在电影首预告片在线上线几天后，刚看完完电影的 `Hirai` 打了 `Lynton`
