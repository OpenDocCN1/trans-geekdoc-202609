  raw: 'On Monday, Nov. 3, 2014, a four-man team from Norse Corp., a small “threat-intelligence”
    firm based in Silicon Valley, arrived early for an 11:30 a.m. meeting on the studio
    lot of Sony Pictures Entertainment, in the Los Angeles suburb of Culver City.
    They were scheduled to see Sony’s top cybersecurity managers to pitch Norse’s
    services in defending the studio against hackers, who had been plaguing Sony for
    years.


    After a quick security check at the front gate and then proceeding to the George
    Burns Building on the east side of the Sony lot, the Norse group walked straight
    into the unlocked first-floor offices of the information security department,
    marked with a small sign reading INFO SEC. There was no receptionist or security
    guard to check who they were; in fact, there was no one in sight at all. The room
    contained cubicles with unattended computers providing access to Sony’s international
    data network.


    The visitors found their way to a small sitting area outside the office of Jason
    Spaltro, Sony’s senior vice president for information security, settled in and
    waited. Alone. For about 15 minutes.


    “I got a little shocked,” says Tommy Stiansen, Norse’s co-founder and chief technology
    officer. “Their Info Sec was empty, and all their screens were logged in. Basically
    the janitor can walk straight into their Info Sec department.” Adds Mickey Shapiro,
    a veteran entertainment attorney who helped set up the meeting and was present
    that day: “If we were bad guys, we could have done something horrible.”


    Finally Spaltro, who’s worked at Sony since 1998, showed up and led them to a
    nearby conference room, where another studio information security executive was
    waiting. The meeting began, and as Stiansen described how Norse scopes out potential
    threats, Spaltro interrupted: “Boy, that could really help us with that North
    Korean film!” According to the four Norse representatives, Spaltro explained that
    he was worried about a Seth Rogen comedy called The Interview that the studio
    was preparing to release on Christmas Day. It featured a plot to assassinate Kim
    Jong-un, the country’s actual leader. Recalls Stiansen, “They said North Korea
    is threatening them.” (Sony denies any mention of a North Korean cyberthreat.)


    After about an hour the Sony team declared the session “very productive,” according
    to the Norse team, and promised to be in touch. They departed, leaving the visitors
    to find their own way out.


    Three weeks later—starting at about 7 a.m. Pacific time on Monday, November 24—a
    crushing cyberattack was launched on Sony Pictures. Employees logging on to its
    network were met with the sound of gunfire, scrolling threats and the menacing
    image of a fiery skeleton looming over the tiny zombified heads of the studio’s
    top two executives.


    Before Sony’s IT staff could pull the plug, the hackers’ malware had leaped from
    machine to machine throughout the lot and across continents, wiping out half of
    Sony’s global network. It erased everything stored on 3,262 of the company’s 6,797
    personal computers and 837 of its 1,555 servers. To make sure nothing could be
    recovered, the attackers had even added a little extra poison: a special deleting
    algorithm that overwrote the data seven different ways. When that was done, the
    code zapped each computer’s startup software, rendering the machines brain-dead.


    From the moment the malware was launched—months after the hackers first broke
    in—it took just one hour to throw Sony Pictures back into the era of the Betamax.
    The studio was reduced to using fax machines, communicating through posted messages,
    and paying its 7,000 employees with paper checks.


    That was only the beginning of Sony’s horror story. Before destroying the company’s
    data, the hackers had stolen it. Over the next three weeks they dumped nine batches
    of confidential files onto public file-sharing sites: everything from unfinished
    movie scripts and mortifying emails to salary lists and more than 47,000 Social
    Security numbers. Five Sony films, four of them unreleased, were leaked to piracy
    websites for free viewing. Then the hackers threatened a 9/11-style attack against
    theaters, prompting Sony to abandon The Interview’s Christmas release. A week
    later, after an uproar, the studio announced it would make the movie available,
    after all, through video on demand and in a few hundred theaters.


    On December 19, the FBI blamed the hack on North Korea, which had issued threats
    over the film. The White House followed with economic sanctions. Sony was pilloried
    both for horrendous judgment (for making a comedy depicting the killing of North
    Korea’s sovereign leader) and its seeming capitulation (for its initial refusal
    to show the film). In its darkest hours, Sony drew zero support from Hollywood—and
    a blast from President Obama. Sony’s traumatized employees face an ongoing threat
    of identity theft.


    The studio and its Tokyo-based parent, Sony Corp., were already under siege. “Big
    Sony”—as studio executives refer to it—is facing a prolonged crisis after losing
    money for six of the past nine years. Sony Pictures remains one of its few moneymaking
    businesses. But as interviews and internal emails reveal, the studio was a deeply
    unhappy place, beset by pressures over disappointing profits, cost cutting and
    layoffs, the scorn of an activist investor and tribal infighting. Sony Pictures
    CEO Michael Lynton pursued four separate opportunities to leave the company during
    the 18 months before the hack.


    In Sony’s view, the company is a blameless victim. In a December interview with
    National Public Radio, Lynton insisted his company was “extremely well prepared
    for conventional cybersecurity,” but faced “the worst cyberattack in U.S. history.”
    He has repeatedly described it as a “highly sophisticated attack.” Sony Pictures
    provided written responses to questions through Robert Lawson, its chief spokesman.
    He says Lynton has no plans to fire or discipline anyone. The CEO’s reasoning
    rests on the belief that because Sony’s assailant was a foreign government, with
    far more resources than a renegade band of hackers, what happened was unstoppable.
    The studio simply faced an unfair fight.


    In a statement, Lawson argues that “any suggestion Sony Pictures Entertainment
    should have been able to defend itself against this attack is deeply flawed and
    ignores essential findings and comments made by the FBI and \[Sony’s cybersecurity
    consultant\] Kevin Mandia—the two parties most knowledgeable of the nation state
    threat and the evidence in this investigation. Joseph Demarest, then assistant
    director of the FBI’s cyber division, could not have been clearer when he told
    a U.S. Senate hearing that ‘the malware that was used would have slipped, probably
    would have gotten past 90% of the net defenses that are out there today in private
    industry, and I would challenge to even say government.’ ” Mandia, the statement
    continues, “has also explained how the sophistication of the exfiltration methods
    used in this attack made them virtually undetectable. And both Mandia and the
    FBI have stated that the malware used was undetectable by industry standard antivirus
    software.”


    In truth, there is no way to know whether Sony’s attackers would have prevailed
    over even impeccable cyberdefenses. Experts say Sony’s electronic security probably
    wasn’t worse than that of many others; weak, outmoded practices are the norm at
    far too many companies. But it’s clear that Sony, which failed to employ several
    basic safeguards, didn’t put up much of a fight.


    As it was, the company had ample reason to have bolstered its defenses: For years,
    culminating with its release of The Interview, Sony Corp.’s business decisions
    have made it a virtual piñata for cyberassailants. And North Korea had been blamed
    for devastating high-profile electronic attacks in the past. Despite that, the
    company’s leadership failed repeatedly to take greater precautions.'
