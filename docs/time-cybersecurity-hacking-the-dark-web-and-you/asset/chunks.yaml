    anything an attacker could use as an entry point. “One thing we try to maintain
    is a capability in every major backup software out there, because that’s one of
    the juiciest targets,” Portnoy told TIME in 2014. “If you get on an enterprise
    network, what is an administrator going to want to protect? Their important information.
    What do they use to protect that? Backup software.”


    When a researcher at Exodus finds a vulnerability, he or she types it up in a
    professional-looking report along with technical documentation that explains what
    it does, where it lives, what it gets you, how to spot it, what versions of the
    software it works on, how one can mitigate it and so on. Most important, Exodus
    provides you with an exploit, which is the procedure you’d have to follow to actually
    trigger the bug and take advantage of it. “Every single vulnerability that we
    give our customers comes with a working exploit,” Portnoy explained. “If we can’t
    exploit it, we don’t even bother telling anyone. It’s not worth it.” Voilà, one
    freshly minted zero-day vulnerability.


    (A note on that term, “zero-day”: it refers to a bug’s freshness. Bugs, like fish,
    don’t age well, and zero-day means that the bug has been public for exactly zero
    days, hence no one has tried to fix it yet. The term is so ubiquitous that it
    has gone from adjective to noun: Exodus sells zero-days.)


    Portnoy takes pride in the superior quality and effectiveness of Exodus’s exploits.
    “We try to make them as nasty and invasive as possible,” he said in 2014. “We
    tout what we deliver as indicative of or surpassing the current technical capabilities
    of people who are actually actively attacking others.” When a company hires Exodus,
    it generally does so on a subscription basis: you get a certain number of bugs
    a year for such-and-such amount of money. Subscriptions start at around $200,000.


    The vulnerabilities business has a mixed reputation, based on the presumption
    that the bugs it provides are being used for criminal or unethical purposes. A
    Washington, D.C., company called Endgame that sold vulnerabilities to the government
    for years was dubbed “the Blackwater of hacking” by Forbes magazine. In 2013,
    when Endgame announced that it was getting out of the game, it did so triumphantly,
    as if it were kicking a heroin habit: “The exploit business is a crummy business
    to be in,” its CEO said.'
