- fmt: "\nHackers blocked millions of Americans from accessing the internet one day\
    \ by remotely taking control of legions of Web-connected gadgets, such as baby\
    \ monitors and digital video recorders, to unleash floods of bogus traffic. They\
    \ shut down the San Francisco municipal railway over Thanksgiving weekend after\
    \ an IT administrator allegedly clicked one wrong link embedded in a malicious\
    \ email.\n\nIn 2016, hackers took aim at American democracy itself. The presidential\
    \ campaign coasted on a steady stream of leaked documents and emails stolen in\
    \ a series of sophisticated digital break-ins. Though there is no indication the\
    \ machines 128 million American voters used to cast a ballot on November 8 were\
    \ compromised, the question—could they be?—was repeatedly and credibly raised.\
    \ Which may have been the whole point. In a nation where every vote is supposed\
    \ to count, the lesson of the past 12 months was that a few lines of malevolent\
    \ code can crack open more than a computer system.\n\n## Who are they? \n\n“Somebody\
    \ sitting on their bed that weighs 400 pounds,” as Donald Trump put it in the\
    \ first presidential debate, somehow forgetting about the black hoodie? Or dead-eyed\
    \ drones sitting in a windowless room, serving a nation-state?\n\nThe truth, as\
    \ security researchers have shown in recent years, is both more malignant and\
    \ more mundane. There are the good, the bad and every morally ambiguous shade\
    \ in between. There are those sponsored by a state or a terrorist organization.\
    \ There are the freedom fighters, the truth campaigners, the anarchists, the tinkerers.\
    \ There are criminal kingpins and, yes, even working stiffs. A 2016 survey of\
    \ 10,000 hackers in the U.S., U.K. and Germany found that on average the annual\
    \ salary for hacking was $28,744.\n\n## The Cost of Hacking\n\nWhen hackers took\
    \ an entire Los Angeles hospital hostage in February 2016, the ransom demanded\
    \ to restore employees’ access to email and patients’ electronic health records\
    \ was all of $17,000. For individuals hoping to retrieve their hijacked information,\
    \ the average ransom demand was $544 in 2017, nearly double the average in 2015.\
    \ It adds up: the FBI estimates that ransomware—programs that infect a computer\
    \ or network and hold data hostage until a fee is paid—this year will generate\
    \ $1 billion for criminals.\n\nBusinesses stand to lose much more from hacks—at\
    \ least $400 billion globally, according to the British insurer Lloyd’s, though\
    \ that estimate is surely low. Because hacking has a much longer half-life than\
    \ conventional crime, it’s very likely that this year’s biggest breaches have\
    \ yet to come to light. That very uncertainty feeds the booming cyberdefense,\
    \ cyberforensics and cyberinsurance industries, projected to be worth nearly $200\
    \ billion annually by the close of the decade.\n\n## Vulnerability and Uncertainty\n\
    \nYet the bottom line isn’t money but vulnerability and uncertainty. Consider\
    \ Stuxnet, the computer worm jointly developed by Israeli and U.S. intelligence\
    \ to infect the Iranian nuclear program nine years ago. Its primary intention\
    \ was not to destroy lab equipment but to undermine Iranian confidence. “The intent\
    \ was that the failures should make them feel they were stupid,” an American participant\
    \ told the New York Times in 2012. To some extent, even if you are not building\
    \ centrifuges in Iran or running a major Hollywood studio or sending nude selfies,\
    \ all hackers have the same power over you: to humiliate.\n\n## Political Impact\n\
    \nThe Democrats got the worst of it. In the most notorious break-ins since Watergate,\
    \ in 2016 hackers stole thousands of pages of documents from the Democratic National\
    \ Committee and the Democratic Congressional Campaign Committee as well as Hillary\
    \ Clinton’s campaign and the Gmail account of its chairman, John Podesta. Then,\
    \ using a network of online allies like WikiLeaks and fake websites with names\
    \ like DC Leaks, hackers deployed information gleaned from the breaches to, it\
    \ seemed, maximally blunt the Democrats’ progress. True bombshell revelations\
    \ were few and far between. But that wasn’t the point. In this style of conflict,\
    \ the objectives are to provide distracting grist, however innocuous, for the\
    \ media mill and, more important, to sow doubt about the integrity of the electoral\
    \ system.\n\nEspionage and disinformation have a millennia-long tradition in statecraft.\
    \ Both the Soviets and the U.S. interfered with foreign elections during the Cold\
    \ War. What changed in 2016—what made the DNC and its sibling hacks sobering and,\
    \ to many, terrifying—was Russia’s apparent skill in weaponizing information and\
    \ aiming it at the foundations of the U.S. system. Russian president Vladimir\
    \ Putin calls this kind of campaign, with its noxious combinations of fabrication\
    \ and fact, deniability and distrust, hybrid warfare.\n\n## Fighting Back\n\n\
    How to fight back, now that the encryption around Pandora’s box has been cracked?\
    \ In 2015, CIA director John Brennan announced the most sweeping reforms of the\
    \ agency in 69 years, spurred largely by cyberthreats. And in late 2016, the FBI\
    \ and other law-enforcement agencies gained a powerful new legal tool that expands\
    \ their ability to search multiple computers, phones and other devices across\
    \ the country, and even overseas, on a single warrant. Private firms, meanwhile,\
    \ would do well to emphasize security awareness to users and make disclosure of\
    \ breaches more transparent.\n\nThe more fundamental challenge is to societies\
    \ that have seen their reliance on free information used against them. At the\
    \ state level, because there is no equivalent to military pageantry in cyberspace,\
    \ it’s unclear how the U.S. projects its power to the rest of the world. Nor have\
    \ the rules of engagement been defined. A pact signed in 2015 between China and\
    \ the U.S. seems to have resulted in fewer government-led hacks, but the efficacy\
    \ of treaties in this digital frontier may be limited.\n\nIndeed, retaliation\
