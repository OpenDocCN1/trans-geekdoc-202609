    “没有任何一家公司会说：‘我们只是太疏忽了，所以人才才进来的’，”网络安全专家、战略与国际研究中心高级研究员詹姆斯·刘易（James Lewis）表示。“对方是一个国家级且难以击败，并不意味着你必须敞开大门并铺好欢迎垫。”


    本文基于对索尼（Sony）现任及前任高管（他们均坚持不具名标识）、网络安全专家和执法人员的 50 多次采访。此外，它在很大程度上也基于被黑客窃取的索尼邮件和文件。除了能产生他们已经拥有的好莱坞八卦之外，这些材料还提供了一个观察黑客期间索尼影视业务的绝佳窗口：其领导者的个性、他们在与位于东京的母公司关系中面临的压力，以及在
    21 世纪经营娱乐制片厂的挑战。（我们保留了邮件的原始标点符号和许多粗糙的拼写。）


    这些邮件还揭示了无数惊喜和此前未报道的轶闻，其中包括索尼监视自己员工邮件的一个事件。矛盾的是，这些被黑客的邮件和文件提供了一个生动的窗口，展示了这场灾难性的攻击是如何以及为何能够成功，以及公司需要做什么来保护自己——这正是《财富》杂志选择使用这些材料的原因。


    索尼发生的事件是一个里程碑式的事件。它让整个美国企业界的董事会陷入了恐惧，尽管索尼的情况具有独特元素，但这些教训适用于每一家公司。毕竟，用老的话说，公司只有两类：被黑客过的公司和尚未意识到自己被黑客过的公司。无数巨头曾遭受大规模的受害，包括
    Target、Anthem、Home Depot 和摩根大通，它们为了利润为目的的数据窃取或企业间谍活动遭受了入侵。


    美国企业界面临的危险似乎增长得比现在动员对抗电子犯罪的巨大资源还要快。（政府也未完全幸免，美国税务局（IRS）、白宫邮件系统和美国人事管理局都曾被备受注目的渗透。）但在大多数情况下，之前的企业入侵伤害的是客户而非企业。这次事件之所以触及核心，因为它展示了攻击者如何窃取甚至是高管最宝贵的秘密——并让一家公司陷入瘫痪。


    这家日本电子巨头与好莱坞制片厂这种不可思议的结合可以追溯到 1989 年。当时的索尼公司是地球上最具主导地位的电子公司，当时日本企业的主导地位似乎是永久的。索尼花费了惊人的
    48 亿美元收购了陷入困境的哥伦比亚影业（Columbia Pictures），宣布电影等同于提升其高端“硬件”（电视机、录像带机和音乐播放器）销售所需的“软件”。该制片厂被更名为索尼影视娱乐，但继续挣扎，导致在五年后进行了
    27 亿美元的减值准备。


    接下来的四分之一之世纪对索尼公司并不友好，当消费电子业务变得商品化时，它仍然固守着这项业务。今天，该公司仍然是一个巨头，拥有 132,000 名员工，截至
    3 月份的财年收入为 747 亿美元。但索尼在过去的七个财年中亏损了 121 亿美元。当平平雄（Kazuo Hirai）于 2012 年 4 月成为首席执行官时，他宣布了“非常严重的危机感”，并宣布了一项转型战略，包括数千人的裁员。


    （注：原文后续存在大量重复的段落，此处已根据要求不重复输出原文翻译内容。）

