    In November 2014, hackers release a trove of sensitive corporate data from Sony,
    including the personal information of high-level executives, advance copies of
    unreleased films, and embarrassing emails. Sony’s internal communication systems
    were crippled, further limiting the company’s ability to respond. The attack became
    big news, in part because it was revealed that the hackers may have been linked
    to the North Korean regime and because it took place just prior to the release
    of The Interview, a comedy depicting an assassination plot targeting North Korean
    leader Kim Jong-un. The Sony hackers were sophisticated actors who used a variety
    of methods to bypass the firm’s defenses. In the aftermath, a person claiming
    to be involved in the incident said that he gained physical access to Sony’s corporate
    computers. It’s unclear if this was true or simply an attempt at further intimidation.
    But the episode underscores the need for individuals and companies alike to ensure
    the physical safety of their devices.


    1. Protect devices like your phone, tablet and laptop with a strong password.
    Make sure to log out of or lock your devices when you leave your home or office.

    2. Use your “biometric” security features, like the iPhone’s `TouchID` fingerprint
    scanner, if you can. However, keep in mind that some of these features have demonstrated
    weaknesses, meaning they are not failproof.

    3. Be sure to use encryption, a security feature found on almost every modern
    computer and smartphone. Encryption can make it significantly harder for a hacker
    to access your sensitive data in the event your device is stolen. Trent Telford,
    the CEO of enterprise encryption provider `Covata`, describes encrypted data this
    way: “To look at it visually, you would just see a big block of 1,000 letters
    that meant nothing. But when you decipher it, you can see that there are words
    hidden in there.”

    4. Don’t check your devices when you’re traveling, says Stacey Vogler, managing
    director for device-insurance firm `Protect Your Bubble`. “There’s a number of
    things that could happen to it—like getting damaged or stolen—once it’s out of
    your sight,” she says.

    5. Keep your smartphone and laptop on or very near your person at all times. Think
    of it like your wallet. If you leave any devices at your office overnight, it’s
    a good idea to lock them away in a drawer, especially if you work in a open area
    often accessed by many people.


    ## Malware


    Also known as viruses—the original software weakness was only amplified by the
    Web


    ![image](images/GettyImages-608877599.png)


    In May 2017, hospitals, businesses and institutions around the world fell victim
    to a cyberattack unfortunately but aptly nicknamed `WannaCry`. The nefarious ransomware
    had spread to more than 200,000 computers in 150 countries by the time it was
    publicized. The ransomware, which stemmed from a vulnerability in Microsoft’s
    `Windows` platform, locked up victimized computers by encrypting all of their
    data until a $300 ransom had been paid. Once your system has been infected with
    ransomware, there’s very little you can do to salvage it. But there are precautions
    you can take to make your computer less susceptible to malware in general and
    to ensure that not all of your information will be lost in the event of an attack.


    ### Install software updates


    Software updates are critical for keeping your computer safe because they often
    include fixes for bugs that hackers can otherwise exploit. Not doing so can leave
    your computer open to viruses, malware and other types of attacks. Installing
    updates “is extremely important to make sure people aren’t able to run something
    on your computer without your permission,” says Vikram Thakur, Symantec’s technical
    director of security response. The process for updating your device will vary
    depending on which operating system it runs. `Windows 10` and `MacOS` automatically
    apply security-software updates.


    ### Update your phone’s software too


    On an iPhone, open the `Settings` menu, tap the `General` option and choose `Software
    Updates`. Each Android phone model has a slightly different interface, but the
    option can usually be found by opening the `Settings` menu and navigating to the
    `About` section.


    ### Back up your data


    Losing access to your computer is less devastating if you’re able to access important
    files elsewhere. That’s why creating backups of work-related files, family photos
    and other personal data is crucial. Companies like `Google`, `Microsoft`, `Dropbox`
    and `Apple` all offer their own cloud-storage services for doing so. You can also
    choose to back up your data on a larger external drive like those sold by `SanDisk`
    and `Western Digital`.


    ### Use anti-virus software


    Anti-virus software is important for monitoring the overall health of your computer.
    `McAfee` and `Norton` both offer products that can help prevent viruses from hiding.
    `McAfee`’s `Total Protection` can be used on various devices. `Norton` offers
    a similar product.


    ## Identity Theft


    One of the original dangers of the Web has only gotten more pernicious and pervasive


    ![image](images/GettyImages-585628346.png)


    In September 2017, consumer-credit reporting agency `Equifax` announced that,
    the previous summer, hackers had infiltrated its network and stolen the personal
    information of more than 145 million Americans—nearly half the U.S. population.
    The pilfered data included people’ names, birth dates, addresses and even Social
    Security numbers. A smaller number of people—209,000—also had their credit-card
    information taken. Security experts now fear that some of the cache is being sold
    online. The incident is considered by some experts to be the largest single breach
    of personal information in history. `Equifax` offered free credit monitoring and
    credit freezes to victims of the breach. But the company was criticized for being
    slow to publicize the incident. Meanwhile, some of affected are angry because
    they had limited choice in which of “Big Three” credit-reporting agencies to use.
    The fallout from the incident is expected to continue for months, and likely years,
    to come.


    1. Check your banking and credit-card statements weekly. If something looks off,
    call your bank or financial firm to find out more. “This is reason number one
    to check your online bank and credit-card statements on a regular basis,” says
    Matt Schulz, `CreditCards.com`’s senior industry analyst.

    2. Keep a close eye on your credit score as well. If an identity thief tries to
    take out a loan or open a credit card in your name, that activity should appear
    on a credit report.

    3. If you suspect you have been the victim of identity theft or fraud, you can
    place a fraud alert or credit freeze on your credit reports. “Credit freezes typically
    cost $3 to $10 per bureau to place and remove,” says Liz Weston, a personal-finance
    writer and certified financial planner at `NerdWallet`. “If you decide against
    a freeze, you should place a fraud alert on your credit reports at all three bureaus.”

    4. If you have been the victim of identity theft or fraud, you can file a police
    report with your local department. Because hackers and identity thieves often
    work from overseas, it’s rare that local police can do much about them. But creating
    a paper trail can help you work with your bank and other financial institutions
    to correct any problems.

    5. In the case of the very broad `Equifax` breach, a company website can help
    you determine if you have been affected. `Equifax` is also offering free credit
    monitoring to victims of the breach.


    ## Advertising


    Online ads aren’t just distracting. They can also carry malicious software within
    them


    ![image](images/GettyImages-486132971.png)

