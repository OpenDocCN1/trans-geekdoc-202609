    Our Age of Insecurity


    Technology’s golden age is casting some very dark shadows


    BY ROBERT HACKETT


    ![image](images/GettyImages-515766685.png)


    Just as the foundations for what would become the internet were being laid within
    his division of the RAND Corporation in 1967, Willis Ware sounded a note of alarm.
    “Great quantities of private information are being accumulated in computer files,”
    one of the world’s earliest computing pioneers and an eventual National Security
    Agency adviser warned in a paper, “and the incentives to penetrate the safeguards
    to privacy are bound to increase.”


    He was right. Ware aired his hunch two years before researchers began assembling
    Arpanet, or the U.S. Department of Defense’s Advanced Research Projects Agency
    Network, the embryonic internet. By then, Ware had predicted the rise of the personal
    computer. He accurately forecasted that these devices would shrink—and grow. He
    saw that these appliances would become ubiquitous, all-powerful and intimate.
    This vision both inspired and worried him.


    What Ware understood before many of his contemporaries was that once information
    enters a network—a meshwork of exchange—it risks exposure. By virtue of their
    connectivity, machines render data accessible to disparate operators. The enhanced
    convenience and productivity, as well as their potential for harm, he saw, were
    awe-inspiring. “The computer will certainly be useful to society in combating
    crime,” he wrote in a 1966 paper. “But might it not also help the criminal plan
    his crime or the large criminal organization manage its affairs?”


    Half a century later, Ware’s prophecies ring true. The world faces a dawning realization
    that its enthusiasm for connection has created complications. Bluntly, it has
    put us all in danger. Our identities, our finances, our families, our homes—nearly
    everything anchored in the physical world has some point of entry that opens it
    up to attack through the electronic ether. In this hyper-networked world, marauding
    bands of data raiders knock at the gates in a perpetual siege—the digital equivalent
    of Europe’s Viking age. Except in the cyber realm, space and time are no obstacles
    for ne’er-do-wells; all loot is effectively a click away.


    With keyboards rather than bearskins and battle-axes brandished, today’s assailants
    are enjoying a period of unprecedented ransacking. Everywhere, it seems, spies
    lurk in the wires. Crooks drain bank accounts. Contraband trades hands on underground
    markets. Perverts peep through webcams. Intelligence operatives concoct schemes
    to steal secrets and fry hard drives. And yes, foreign governments subvert elections.
    No prize is off-limits.


    We often talk about cybersecurity, but the reality is more accurately described
    by the phrase’s antithesis: cyber-insecurity. In the pages that follow, we lay
    out the many invisible forces at work that are shaping this storm. Though the
    water may look calm on the surface, underneath a riptide is readying to suck your
    personal information—and then some—out to sea. Staying high and dry isn’t an option
    unless you plan to live without access to the internet, so you’d better learn
    to swim.


    This special edition aims to help you do just that, starting with its opener.
    Lev Grossman and Jay Newton-Small’s dive into the Deep Web outlines the central
    themes that echo throughout—namely, that all technology is dual-use. In this case,
    the so-called Tor browser, originally funded by the military to enable covert
    communications, provided the bedrock for one of the most brazen dark markets ever
    to arise. Still, the State Department relies on this same enshrouded network to
    enable foreign dissidents to access the wider Web. In the sphere of the unseen
    internet, nothing is cut-and-dried.


    You will find stories of power, ego and ambition. You’ll come to know how ex-lovers
    exact revenge and how disillusioned moralists leak state secrets. Russia figures
    prominently in chapter two; a tale of vengeance unfolds in which Moscow’s intelligence
    apparatus pays America back for allegedly meddling in its own election, turning
    Silicon Valley’s tech against the U.S.’s own citizenry. Before you pass judgment,
    remember where the Russians learned their tactics. Not long ago, the U.S. funded
    a knockoff Twitter to foment rebellion against the Communist regime in Cuba. Karma
    comes back for a bite.


    Hollywood long ago picked up on hacking’s built-in David-vs.-Goliath narrative.
    In 1983, WarGames, a movie about a teen hacker who almost causes a third world
    war after penetrating defense-department systems, inspired a generation of young
    computer crackers. The film even moved then-president Ronald Reagan to invest
    in the nation’s cybersecurity (see chapter six’s “Heroes or Villains?”). Three
    decades later, Hollywood has really taken notice. North Korea’s pummeling of Sony
    Pictures Entertainment—in retaliation for the company’s depiction of the Hermit
    Kingdom leader’s assassination in a sophomoric stoner flick—has even movie studios
    appreciating the importance of digital defense. (See chapter three for Peter Elkind’s
    masterly investigation of this international fiasco.)


    Hacking is not all bad, though. Despite their frequent demonization in popular
    media, hackers just as often fight to keep the world protected. Google’s elite
    hacker SWAT team kicks down the doors of competitors in the interest of forcing
    them to fix security holes that affect ordinary internet users. Amazing to say,
    your safety rests on the prowess of a group of tough-knuckled geeks you’ve never
    heard of. What’s more amazing: they could just as easily sell their findings to
    spies for top dollar.'
