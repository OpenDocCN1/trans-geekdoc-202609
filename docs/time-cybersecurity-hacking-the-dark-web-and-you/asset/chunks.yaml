    2016 年选举远超以往的任何情况。在伊利诺伊州遭受黑客攻击以及亚利桑那州同时发生类似事件后，前白宫网络安全协调员 `Michael Daniel` 表示：“我们意识到自己玩的是完全不同的游戏”。Daniel
    的团队得出结论，俄罗斯人不仅仅是为了收集情报而窃取信息，他们可能表现出了干预投票的意图。


    伊利诺伊州于 7 月 12 日发现了这一入侵。黑客试图下载 `15 million` 份 `voter` 文件，其中包括 `90,000` 个 `Social
    Security` 号和 `75,000` 个驾执照号。攻击发生后，`FBI` 和 `DHS` 与州官员合作，以确定泄露的范围。


    对黑客攻击的调查显示，两个俄罗斯情报机构 `GRU` 和 `VR` 的运作方式不同。`GRU` 和 `Fancy Bear` 针对州政府和州选举官员的电子邮件账户，而
    `GRU` 还获得了某些选民注册系统的访问权限，并尝试更改 `voter` 编号。


    此次行动的目标不仅是窃取信息，还在于破坏公众对选举过程的信任。`Michael Daniel` 说：“目标是制造混乱，让人们怀疑投票的完整性。”


    对 2016 年选举干预的调查仍在进行，关于俄罗斯的影响范围及其对最终结果的影响，仍有许多问题待解答。

