    Her concern is not just the Russian media outlets that spread disinformation,
    Hegelich says. It is also the automated algorithms, known as bots, that help false
    reports go viral before politicians or fact-checkers can debunk them. In June
    2017, one study found that 59% of Germans reported seeing fake news online; 61%
    said the phenomenon poses a threat to democracy.


    So Merkel’s government prepared for a siege. Her coalition in Parliament passed
    a law that imposes fines of upward of $59 million on Facebook and other companies
    that do not promptly remove “illegal content,” a term Merkel’s government has
    used to target everything from hate speech and pornography to defamatory propaganda.
    “False news is a threat to our culture of debate,” the official behind the law,
    Justice Minister Heiko Maas, told a German newspaper in January 2017. “There should
    be just as little tolerance for criminal rabble-rousing on social networks as
    on the street,” he later added.


    Germany’s Network Enforcement Act is among the more extreme reactions to Moscow’s
    influence campaign, though it’s hardly the only one. The E.U. has created an office
    devoted to debunking fake news and Russian propaganda. A Czech police agency scans
    social media for disinformation and other “hybrid threats.” And French president
    Emmanuel Macron banned Russian news organizations RT and Sputnik from his campaign
    headquarters in April.


    These steps point to the fears, or paranoia, that the tools of political sabotage
    have advanced enough to threaten Western democracies. “Democracy is all about
    public opinion,” Hegelich recalls telling Merkel when they met. “And if there
    are new ways to manipulate public opinion, then we will see a new type of democracy.”


    In some ways this is already happening. In an era when hackers can steal the secrets
    of virtually any politician, and in which an internet connection is all that’s
    needed to command an audience of millions, one viral post—even a fake one—could
    be enough to turn an election. No democracy is free from that risk. Russia and
    Germany have emerged as the most determined players in the scramble to adapt to
    this new terrain and, where possible, to reshape it.


    Konstantin Knyrik, the young founder and editor of the website News Front, thinks
    of himself less as a journalist than an information warrior for the digital age,
    and he has the career and the connections to prove it. As a teenager in the mid-2000s,
    he became an active member of the Eurasian Youth Union, a group of hard-line Russian
    nationalists who campaign for Moscow to restore the empire it lost after the fall
    of the Soviet Union. When he was just 16, Knyrik became its representative in
    the region of Crimea, a vast peninsula in southern Ukraine. In the spring of 2014,
    as Russian troops invaded the region and prepared to annex it, he led a column
    of pro-Russian paramilitaries that seized the headquarters of the Crimean Center
    for Investigative Journalism, the region’s leading independent news source. The
    troops forcibly expelled the center’s journalists and confiscated their equipment.
    Knyrik then created News Front in its place.


    Today Knyrik’s outlet films its broadcasts at a studio in Simferopol, the capital
    of Crimea, with oversight from the region’s Kremlin-backed authorities. Speaking
    by phone from his offices in June 2017, Knyrik cast himself as a counterweight
    to the West’s propaganda war against Russia: “We want people to see an alternative
    point of view.” In the U.S. and Europe, he says, “all they have is an information
    vacuum, with all this stuff being pounded into their heads, all these absurd lies
    from the official propaganda channels.” It is a favorite narrative of Russian
    state media; the editor in chief of the Kremlin-funded RT network, Margarita Simonyan,
    told TIME much the same thing in 2015: “No one shows objective reality,” she said.
    Even the idea of objective reporting is inconsistent with this worldview. There
    is only the spin of competing perspectives, none of which is more valid than the
    others.


    In an analysis of Russia’s influence operation in Germany that was published in
    June 2017, the Digital Forensic Research Lab of the Atlantic Council, a Washington-based
    think tank, found News Front to be one of the Kremlin’s three main “amplifiers”
    in Germany, alongside Sputnik and RT. “Together, this network represents a potential
    channel by which disinformation could be inserted into the German information
    space ahead of the elections,” the report states.


    If Russia and Germany are establishing the front lines in this new information
    war, the authorities in Europe are still attempting to marshal the troops. The
    Brussels-based organization East StratCom, which the E.U. created in 2015 to counter
    Russian misinformation, seems woefully underequipped. Its few journalists compile
    a weekly list of fake news stories and try to debunk them on Facebook and Twitter.
    But the agency’s reach on social-media platforms is tiny; its Facebook page has
    only around 22,000 likes, compared with the million-plus likes on Sputnik’s.


    There’s another problem. Chasing hoaxes around the internet often draws more attention
    to them, and in an age of partisan divides, many readers are inclined to believe
    a deception that reinforces their political views. “Fake news always has an early
    start,” says Peter Burger, a lecturer at Leiden University in the Netherlands
    who studies how hoaxes spread. “Even if we fact-check them, a lot of people will
    say we are just liberals in an ivory tower, or part of some conspiracy.”


    The better approach, he says, might be to introduce a fact-checking curriculum
    in schools and make students more aware of their sources of information. But that
    educational approach will take years to have an impact, and in the meantime fake-news
    technology will continue to advance. In July 2017, academics at the University
    of Washington revealed that they could “synthesize” a video of Barack Obama delivering
    statements he had never made. “You can create videos that look absolutely like
    they are real,” says Hegelich, who continued advising the German government after
    that first meeting in November. Right now, it would take hours if not days to
    produce a forensic analysis showing that such a video is fake, and by then its
    impact would be almost irreversible. At the very least, it could make voters unsure
    of what to believe as they head to the polls. “It leaves a trace of doubt over
    everything,” says Hegelich. And if the goal is to undermine a democracy, that
    would be a mission accomplished.


    ## CHAPTER THREE

    ### A Tale of Caution for All

    The riveting inside story of a hack at Sony Pictures has huge implications. Never
    has a cybersecurity attack been so brazen, so damaging and so instructive about
    the world we live in.


    ### INSIDE THE HACK OF THE CENTURY

    A cyber-invasion brought Sony Pictures to its knees and terrified corporate America
    BY PETER ELKIND


    ## CHANGE OF PLANS

    Workers removed an ad for The Interview from a Hollywood, Calif., billboard in
    late December 2014, days before the movie’s scheduled release.


    **EDITOR’S NOTE:** In July 2015, Fortune published an extraordinary, 13,383-word
    investigation into one of the most dramatic and devastating corporate hacks of
    all time, the breach of Sony Pictures. Peter Elkind spent six months reporting
    the story. What follows is an abridged version of what ran at the time of its
    publication.

