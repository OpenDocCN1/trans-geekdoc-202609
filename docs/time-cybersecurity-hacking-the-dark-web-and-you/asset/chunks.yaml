  trans: "\n黑客曾通过远程控制数以百万计的联网 get 设备（如婴儿监视器和数字视频录像机），释放大量虚假流量，阻断了数百万美国人访问互联网一天。在感恩节假期周末，据称由于一名\
    \ IT 管理员点击了恶意邮件中嵌入的一个错误链接，黑客关闭了旧金山的市交通铁路。\n\n2016 年，黑客将目标指向了美国民主制度本身。总统竞选活动依靠在系列复杂的数字入侵中窃取的泄露文件和电子邮件维持运转。尽管没有迹象表明\
    \ 1.28 亿美国大选民在 11 月 8 日投票时使用的机器没有遭到攻破解，但“它们可能被攻破解吗？”这一问题被反复且令人信服地提出。这或许正是其全部目的。在一个每一张选票都应该被计入的国家，过去\
    \ 12 个月的教训是：几行恶意代码所破解的远不止是一个计算机系统。\n\n## 他们是谁？\n\n正如唐纳德·特朗普在第一次总统大辩论中所说的，“一个坐在床上、体重\
    \ 400 磅的家伙，”他似乎忘记了那件黑色连帽衫？还是坐在无窗房间里、为国家服务的眼神死死的无人机？\n\n正如近年来安全研究人员所展示的，事实既更具恶意性，也更平庸。他们既有好的，也有坏的，还有中间各种道德上模糊的灰色地。有受国家或恐怖组织赞助的。有自由斗士、真理捍卫者、无政府主义者、爱好者。有犯罪头目，是的，甚至还有普通的打工者。2016\
    \ 年对美国、英国和德国的 1 万名黑客进行的一项调查显示，黑客攻击的平均年薪为 28,744 美元。\n\n## 黑客攻击的成本\n\n当黑客在 2016\
    \ 年 2 月劫持整个洛杉矶某医院的人质时，要求恢复员工访问电子邮件和患者电子健康记录的赎金仅为 17,000 美元。对于希望取回被劫持信息的个人，2017\
    \ 年的平均赎金要求为 544 美元，几乎是 2015 年平均水平的两倍。这些数字非常惊人：FBI 估计，勒索软件（感染计算机或网络并扣留数据直到支付费用的程序）今年将为犯罪分子带来\
    \ 10 亿美元的收益。\n\n企业从黑客攻击中损失可能得多——根据英国保险公司劳德（Lloyd’s）的数据，全球损失至少达 4000 亿美元，尽管这个估计显然偏低。由于黑客攻击的半衰期比传统犯罪得多，今年最大的泄密事件可能尚未浮现。正是这种不确定性滋养了蓬勃发展的网络防御、网络取证和网络保险行业，预计到本世纪末，这些行业的年价值将接近\
    \ 2000 亿美元。\n\n## 脆弱性与不确定性\n\n然而，核心问题不是钱，而是脆弱性和不确定性。考虑史斯蠕（Stuxnet），这是以色列和美国情报部门九年前联合开发的用于感染伊朗核程序的计算机病毒。它的主要意图不是破坏实验室设备，而是为了破坏伊朗的信心。一位美国参与者在\
    \ 2012 年告诉《纽约时报》：“意图是让这些失败让他们觉得自己很愚蠢。”在某种程度上，即使你不是在伊朗制造离心机，不是在经营大型好莱坞制片厂或发送裸自拍，所有的黑客对你都拥有同样的力量：羞辱。\n\
    \n## 政治影响\n\n民主党遭受的最为严重。在自水门事件以来最臭名昭著的入侵中，2016 年黑客从民主全国委员会和民主国会竞选委员会，以及希拉里·克林顿的竞选活动及其主席约翰·波斯塔的\
    \ Gmail 账户中盗了数千页文件。然后，黑客利用维基解（WikiLeaks）等在线盟友以及名为 DC Leaks 的虚假网站，部署了从泄密中获取的信息，似乎是为了最大限度地阻碍民主党的进展。真正的重磅揭露少寥无几。但那不是重点。在这种风格的冲突中，目标是为媒体磨坊提供无论多么无关紧要但能分散其注意力的养料，更重要的是对选举系统的完整性播种怀疑。\n\
    \n间谍活动和虚假信息在国家术中有着数千年的传统。冷战期间，苏联和美国都曾干涉外国大选。2016 年发生的变化——让民主党及其关联的黑客攻击令人们清醒且对许多人来说是令人恐惧的——是俄罗斯显而易见的将信息武器化并对准美国系统基石的技能。俄罗斯总统弗拉基米尔·普京将这种结合了造假与事实、否认与不信任等有害组合的行动称为“混合战争”。\n\
    \n## 反击\n\n在潘多拉盒的加密被破解后，现在该如何反击？2015 年，CIA 局长约翰·布伦南宣布了该机构 69 年来最广泛的改革，这在很大程度上是由网络威胁的推动的。在\
    \ 2016 年底，FBI 和其他执法机构获得了一个强大的新法律工具，扩大了他们根据单份搜查令搜索全国范围内甚至海外的多台计算机、手机和其他设备的能力。同时，私营公司最好强调对用户的安全意识，并使泄密披露变得更加透明。\n\
    \n更根本的挑战在于那些看到自己对自由信息的依赖被用来对自己的社会。在国家层面，由于网络空间没有等同于军事展示，尚不清楚美国如何向世界其他地区投射权力。作战规则也尚未定义。中美在\
    \ 2015 年签署的一项协议似乎导致政府主导的黑客攻击减少，但条约在这个数字前沿的效力可能是有限的。\n\n事实上，报复似乎是常态。2016 年 12 月，俄罗斯官员指控对其银行基础设施的广泛黑客攻击是美国对其干预选举的报复。该国中央银行表示，黑客在\
    \ 2016 年成功盗走了 20 亿卢布（约 3100 万美元）。没有人公开说明是谁做的，或者为什么要这样做。\n\n这让我们其他人处于什么境地呢？正应对一种极具现代感的焦虑——即怀疑我们习惯了大量、几乎不断产生的信息可能会在脱离语境的情况下作为破坏性负载被暴露于世。\n\
    \n![image](img/page-30.png)\n\n*Time Inc. 于 2016 年初收购了 MySpace 的母公司*\n\n## \n\n\
    黑客攻击每年给全球经济带来 4000 亿美元损失。2016 年，几次重大数据窃取事件被曝光。以下是每家公司被盗账户或记录的数量：\n\n### FRIENDFINDER\
    \ NETWORKS\n412,000,000\n成人网站网络的用户名、电子邮件和密码被盗取并在网上出售。\n\n### YAHOO\n500,000,000\n\
    该公司透露，2014 年发生的用户账户黑客规模比此前认为的要得多，是历史上最大的泄密事件。\n\n### MYSPACE\n427,000,000\n\n\
    ### MINECRAFT\n7,000,000\n\n### WEEBLY\n43,000,000\n\n### MAIL.RU\n25,000,000\n\
    \n### CLIXSENSE\n6,600,000\n\n### MOSSACK FONSECA\n11,500,000\n来自总部位于巴拿马的律师事务所的数\
    \ TB 泄露数据显示了名流、亿万翁和犯罪分子如何规避税收。\n\n### TELEGRAM\n15,000,000\n\n### BANNER HEALTH\n\
    3,700,000\n\n## 政府\n\n### 民主党\n美国政府得出结论，该党遭到了俄罗斯间谍的攻击，以“影响”选举。\n\n### 司法部\n亲巴勒斯坦黑客泄露了约\
    \ 30,000 份被盗的员工文件以示威。\n\n### 美国国税局 (IRS)\n该机构表示，2015 年的泄密规模比最初认为的要大，扩大到包含 70 万纳税人记录。\n\
    \n## 基础设施\n\n### 东岸断网\n黑客利用受感染的摄像头等设备导致互联网访问中断一天。\n\n### 旧金山市交通局\n黑客锁定了交通系统计算机，导致该市实施了两天的免费出行。\n\
    \n### BITFINEX\n约 6500 万美元的数字货币从全球最大的比特币交易所之一被盗。\n"
