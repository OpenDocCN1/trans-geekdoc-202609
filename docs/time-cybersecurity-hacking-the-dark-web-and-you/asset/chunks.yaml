    # 世界反兴奋剂机构


    俄罗斯黑客发布了来自 13 个国家的 41 名运动员的医疗记录。


    # 技术巨头 CEO 们


    一个团体入侵了某些 CEO 和名人的社交媒体账号，似乎仅仅是为了证明他们能做到。


    # 第二章：破解黑客


    为了应对来自孤立黑客和受流氓国家支持组织的网络安全威胁，大量私人公司和政府机构应运而生。


    * ■ 一场选举的秘密历史

    * ■ 代码战争

    * ■ 谷歌的精英黑客 SWAT 小组

    * ■ 下一次假新闻冲突


    ![image](img/chap_two.png)


    ## 一场选举的秘密历史

    白宫已准备派遣军队保护投票免受俄罗斯黑客攻击。作者：MASSIMO CALABRESI


    ![image](img/Time_votingbooth.png)


    2016 年 6 月 7 日，河滨县地区检察官迈克尔·赫斯特林（Michael Hestrin）正坐在办公桌前，电话开始接接不断。那是加利福尼亚州总统初选的日子，愤怒的选民希望这位县最高检察官知道，他们被阻止了投票。“有人给我们的办公室打电话并投诉，说他们尝试投票，但他们的注册信息在他们不知情的情况下被更改了，”赫斯特林说。很快，问题报告就超过了
    20 份，在该办公室工作了 19 年的资深员工、斯坦福法学院毕业的赫斯特林，派遣调查员前往县投票站查看发生了什么情况。


    起初，他们发现的情况令他们宽慰。所有被阻止投票的人都获得了临时选票，大多数人已经以这种方式投了票。但随着调查人员的深入挖掘，情况看起来没那么简单了。投票后的几天里，更多人开始出来说，他们在初选当天选民注册也出了问题。赫斯特林和他的调查人员得出，在至少六个案件中，更改是由黑客做的，他们利用私人信息（如社会安全号码或驾照号码）访问了涵盖整个加利福尼亚州的中央选民登记数据库。


    线索就此中断了。加利福尼亚州州卿办公室告诉赫斯特林的调查员，该州的系统没有记录做出更改的计算机 IP 地址，因此无法获知黑客的身份。赫斯特林无法继续调查，但事情并未结束。选民注册更改的悬而未决之谜在两党成员中引发怀疑。当地共和人公开指责民主党忽视了这个问题，并在私下指责他们试图压制共和党的选票。民主党人则认为共和党是在为他们在县投票站的失败找借口。“这是一个巨大的担忧，”这位当选的共和人赫斯特林说，“人们仍然应该对我们的选选举制度保持信心。”


    直到几个月后，华盛顿的调查员们才意识到，动摇选民的信任可能一直是河滨县黑攻击的目的。在加利福尼亚州初选后的几个月里，联邦政府发现俄罗斯黑客入侵了 20 多个州级和地方选举系统，并试图更改其中几个系统中的选民注册。回顾河滨县的事件，白宫的网络安全官员怀疑这是否是俄罗斯人的首次演习。“这看起来像是一个网络攻击者在测试他们可以在选举日引发种种混乱，”一位调查过此案的前联邦网络安全官员说。“没有法证证据，我们可能永远无法确定，但情报告诉我们，俄罗斯人正在吹嘘他们做到了这一点。”


    在不断的新闻流中，人们很容易忘记，俄罗斯针对 2016 年总统选举行动的持久目标，正如美国情报界所言，“动摇公众对美国民主进程的信任”。从 2016 年春初到
    11 月 8 日全美各州各县投票结束，发生的是对我们选举公信力的激进攻击，以及联邦政府在很大程度上未被察觉且徒劳的反击。联邦调查局（FBI）、国土安全部（DHS）和美国情报机构致力于识别这些黑客，并确定他们恶意影响行动的范围有多大。联邦政府努力帮助各州保护其投票机和选民登记册，但在党派对立加剧的背景下，他们自己被怀疑干预了选举。最后，意识到他们无力阻止他们所恐惧的俄罗斯对投票的最后攻击时，联邦政府制定了一项异常计划，以限制选举日及随后几日的损害。


    这份此前未公开的 15 页计划由总统巴拉克·奥巴马的网络安全官员制定，并被《时间》杂志（TIME）获得，显示了华盛顿有多有多担忧。在选举日发生的大多数网络事件中，它将权力交给了各州。但对于“可能对选举基础设施产生可证明影响”的严重攻击，它规定了应对的“增强程序”。该计划允许在黑客成功阻止投票时，向投票站部署“武装的联邦执法人员”。在危机时刻，它还预见到在“根据联邦机构的要求以及国防部长或总统的指示下”，部署“现役和预备役军力量”以及国民卫队成员。在选举后的三天内，一个特别的跨机构小组将负责处理“任何选后后的网络事件”，包括“质疑选举结果的蓄意发布的报道”。


    11 月 1 日，白宫甚至对一次选举日攻击进行了兵演推习。在五个小时的时间里，国家安全委员会运行了一系列虚构的事件，演练联邦机构在真实攻击中将如何沟通和应对。某些场景涉及实际的投票干预，而另一些则侧重于动摇选举的虚假信息攻。随着噩梦场景的展开——从选民被拒之到投票站发生暴力——团队回顾了每个机构将采取的行动，以及他们所能做事的法律限制。


    事实是，11 月 8 日就这样过去了，没有发生针对选举完整性的最终的、戏剧性的攻击。但俄罗斯的努力可能仍在奏效，并在唐纳德·特朗普的有意或无意帮助下进行。大多数美国人相信自己的票会被正确计算，但他们对选举诚实的信心正在崩溃。根据盖洛调查，2009
    年，59%的美国人对选举的诚实有信心，而 40%没有。到 2015 年，这些数字发生了反转，在 11 月投票之前，在特朗普反复提到选举舞弊以及俄罗斯黑客攻击被广泛报道之际，盖洛发现只有
    30%的美国人对我们选举的诚实有信心，而 69%没有。


    在河滨县攻击约三周后，一名俄罗斯特工加入了伊利诺伊州 109 个选举管辖区之一的选民注册网站，每个辖区都有自己的投票系统。但黑客没有在姓名和地址的字段之一输入他的个人信息，而是上传了一串恶意的预写代码，执行了一种被称为`SQL
    注入`的经典攻击。借此，黑客打开了自 2006 年以来该州所有 1500 万份过去和现有选民文件的后门。在近三周的时间里，没有人发现他在那里。


