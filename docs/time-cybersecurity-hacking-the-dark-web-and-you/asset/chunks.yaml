    华盛顿许多人感到困扰，仅仅为了关闭一个由假冒沃尔特·怀特式人物运行的非法网站，就花费了如此多的时间和精力。`FBI` 正在使用静态且往往已经过时的法律来监管不断演变的互联网。规范执法部门搜查程序并被称为
    `CALEA` 的《执法协助通信法案》于 1994 年通过。


    暂且不把如 `Tor` 等专业工具不谈，还有许多主流技术可供犯罪分子隐藏其活动，范围从卫星电话到 `Apple iMessage`。加密消息服务 `Facebook
    Messenger` 和 `WhatsApp`（同样归 `Facebook` 所有）在 2017 年年中期分别拥有 13 亿月活跃用户，成为全球范围内最受欢迎的两个移动应用程序之一。但监管的滞后导致了承诺用户隐私的科技公司与希望追捕犯罪犯的执法部门之间产生了分歧。


    在 2015 年 12 月加利福尼亚州圣贝纳迪诺发生 14 人死亡的恐怖袭击后，当 `FBI` 要求 `Apple` 解锁嫌疑人的加密 `iPhone` 时，`Apple`
    坚决表示反对。最终，`FBI` 放弃了请求，转而聘请外部专家破解该设备。同样在 2015 年，`Arkansas` 州警方请求 `Amazon` 帮助他们访问一个
    `Echo` 智能音箱的数据，他们认为该设备可能含有一起潜在谋杀案的证据。`Amazon` 一直拒绝，直到嫌疑人给予许可。这起谋杀案最终被撤销。


    `特朗普`时代的立法者尚未制定更清晰的路线图。总统在 2017 年 4 月签署了一项法案，废除了`联邦通信委员会`规则，该规则要求宽带公司在收集和共享浏览信息等敏感数据时必须获得客户许可。`FCC`
    主席 `Ajit Pai` 曾争议地声称，他扭转当前网络中立政策（即互联网服务提供商应平等对待所有互联网数据的概念）的计划将“让联邦政府最丰富的隐私警察——`FTC`
    [`联邦贸易委员会`]重回岗位，以保护消费者的在线隐私。”并在 2018 年，美国最高法院可能会对一个涉及手机地理位置隐私的《第四修正案》案件做出裁决。


    `Ross Ulbricht` 的入狱引发了对疑似 `Deep Web` 毒贩的逮捕潮。2013 年晚些时候，瑞典警方逮捕了两名指控通过 `Silk Road`
    销售大麻的男子，另外四名男子在同一日在 `U.K.` 因毒品罪被捕。英国`国家犯罪局`前负责人 `Keith Bristow` 在 2013 年接受 `TIME`
    采访时表示：“这些逮捕向犯罪分子传了一个明确的信号。隐藏的互联网并不隐藏，你们的匿名活动并不匿名。我们知道你在哪里，在做什么，我们会抓住你。”


    这是否真实并不完全清楚。在泄露有关 `国家安全局` 全球监控实践的信息的前 `CIA` 员工 `Edward Snowden` 所泄露的文件中，有一份日期为
    2012 年 6 月、标题为“`Tor 糟透了’”的 `NSA` 演示文稿。它描述了 `NSA` 在破解 `Tor` 时面临的困难，并明确指出：“我们永远无法对所有
    `Tor` 用户随时去匿名。”`Ulbricht` 创建的 `Deep Web` 模板在技术上仍然是可靠的。正如一位前 `Silk Road` 用户所说：“尘埃落定了，大家都像是在说‘噢，好吧，是时候再订点药了’。我们都知道这会发生。”在
    `Silk Road` 灭亡后不久，基于旧网站备份版本重建的名为 `Silk Road 2.0` 的网站上线。2014 年 11 月，它再次被执法部门突然关闭。


    `Tor` 本身处于一种奇特的境地：它一方面由联邦政府的部分部门（包括`国务院`和`国防部`）资助，而另一些部门（`FBI` 和 `NSA`）却在试图破解它。但直接参与此案件的执法官员也赶紧澄清，他们并没有将
    `Silk Road` 归咎于技术本身。`Bharara` 在 2013 年告诉 `TIME` 时：“互联网上的匿名性本身没有问题。某些类型的货币（如 `Bitcoins`）本身也没有问题。就像现金本身没有问题一样。但事实是……它也允许了毒品贸易的繁荣。它允许洗钱发生。它允许雇佣杀杀发生。”


    可以确定的是，对 `Tor` 或类似工具的需求并不会消失。互联网正变成一个日益缺乏隐私的地方，数十亿美元的商业计划正建立在公司观察并贪婪收割消费者行为的每一个点滴之上。越来越多地，这需要消费者自己来界定界限。


