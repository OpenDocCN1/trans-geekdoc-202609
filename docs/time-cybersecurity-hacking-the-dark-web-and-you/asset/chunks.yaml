    Klein says he also feared that North Korea might unleash a cyberassault on the
    studio to try to block *The Interview*’s release. Rogen and Goldberg relayed that
    message to Sony executives, according to Labov. “We felt that everybody involved
    in this had to protect themselves—the studio and the filmmakers,” says Klein.
    “The North Koreans are pretty aggressive cyberwarriors … It’s just surprising
    to me that there wasn’t a more robust sense of alarm and caution.” (Sony’s spokesman
    also denies receiving a warning from Rogen and Goldberg.)


    Instead of hardening its network defenses, emails show, Sony focused on somehow
    trying to offend the North Koreans less. Its actions befit a Hollywood farce.
    Never mind that Sony was planning to release a film that portrayed the violent
    death of a real head of state; the company spent $550,000 to digitally alter the
    movie’s images of Kim family members shown on a wall mural and jacket pins worn
    by movie characters. It banished marketing materials for *The Interview* from
    Sony websites. And the studio prepared a statement insisting the movie was “a
    fictionalized comedy that is not in any way related to current events.”


    In early August, Pascal departed with her family for a long vacation through Asia.
    Lynton decamped to Martha’s Vineyard. By then, they had decided to postpone *The
    Interview*’s release until Christmas Day, buying time to tackle another issue.
    On Hirai’s orders, studio executives had begun a three-month battle with the filmmakers
    to soften the movie’s gory climactic scene, in which a tank shell strikes Kim’s
    helicopter and kills him in a slow-motion, head-popping, flesh-dripping ball of
    fire.


    The *Hollywood Reporter* caught wind of this, Sony Pictures PR executive Jean
    Guerin advised Pascal and other executives in an email. It was preparing to report
    that “Corporate Sony” had asked for “a few key edits,” including “that the melted
    face of Kim Jong-un will now be taken out of the final cut … ” The studio denied
    that changes were being made in response to outside pressure. “We are dismissing
    [the reporter’s] premise and letting her know off the record that this is normal/what
    happens in the filmmaking process,” Guerin told the executives.


    The article, which appeared on August 13, suggested that Sony was changing the
    movie to appease the North Koreans. Rogen was livid. As he saw it, this painted
    him as a sellout. Executives convened an emergency call to plan damage control.
    Asked to join the session, Lynton said he was at a dinner on Martha’s Vineyard
    and couldn’t get up to leave. “I am sitting between president obama and Hillary
    Clinton … If we need a change of strategy then I don’t want anything done until
    we speak.”


    Hirai and Lynton, who found the movie more offensive than funny, wanted the “head-popping
    scene” eliminated entirely. “We cannot be cute here,” Lynton wrote in one email.
    “What we really want is no melting face and actually not seeing him die.” But
    Rogen was fiercely resisting major changes in what he called the “awesome” shot.


    Sony had final authority over the editing of the movie. But according to interviews
    and leaked emails, the studio feared that if it imposed its will, Rogen would
    disassociate himself from the film, creating a box-office and PR debacle. “This
    movie is supposed to be controversial,” he emailed Pascal. “That was your pitch
    to us amy. There’s nothing controversial about a movie that has been tempered
    to.”

