    Lynton decamped to Martha’s Vineyard. By then, they had decided to postpone The
    Interview’s release until Christmas Day, buying time to tackle another issue.
    On Hirai’s orders, studio executives had begun a three-month battle with the filmmakers
    to soften the movie’s gory climactic scene, in which a tank shell strikes Kim’s
    helicopter and kills him in a slow-motion, head-popping, flesh-dripping ball of
    fire.


    The Hollywood Reporter caught wind of this, Sony Pictures PR executive Jean Guerin
    advised Pascal and other executives in an email. It was preparing to report that
    “Corporate Sony” had asked for “a few key edits,” including “that the melted face
    of Kim Jong-un will now be taken out of the final cut … ” The studio denied that
    changes were being made in response to outside pressure. “We are dismissing \[the
    reporter’s\] premise and letting her know off the record that this is normal/what
    happens in the filmmaking process,” Guerin told the executives.


    The article, which appeared on August 13, suggested that Sony was changing the
    movie to appease the North Koreans. Rogen was livid. As he saw it, this painted
    him as a sellout. Executives convened an emergency call to plan damage control.
    Asked to join the session, Lynton said he was at a dinner on Martha’s Vineyard
    and couldn’t get up to leave. “I am sitting between president obama and Hillary
    Clinton … If we need a change of strategy then I don’t want anything done until
    we speak.”


    Hirai and Lynton, who found the movie more offensive than funny, wanted the “head-popping
    scene” eliminated entirely. “We cannot be cute here,” Lynton wrote in one email.
    “What we really want is no melting face and actually not seeing him die.” But
    Rogen was fiercely resisting major changes in what he called the “awesome” shot.


    Sony had final authority over the editing of the movie. But according to interviews
    and leaked emails, the studio feared that if it imposed its will, Rogen would
    disassociate himself from the film, creating a box-office and PR debacle. “This
    movie is supposed to be controversial,” he emailed Pascal. “That was your pitch
    to us amy. There’s nothing controversial about a movie that has been tempered
    to appease the very people it’s mocking.” (Rogen barraged Pascal, then vacationing
    through Vietnam and Bali, with messages, insisting they talk “as soon as humanly
    possible.” Pascal forwarded one email to a colleague, asking, “Can I be lost in
    the jungle?”)


    On September 25, Pascal, back in L.A. and sitting in temple on the Jewish New
    Year holiday, emailed Rogen an emotional personal plea to make the scene “a little
    less gory.” “No one has backed you more than I have,” she wrote. “And this isn’t
    some flunky it’s the chairman of the entire sony corporation who I am dealing
    with. You must know there are very few relationships and film makers I would let
    myself be in this situation for.”


    Rogen relented, agreeing to reduce Kim’s “flaming hair by 50%,” cut “three out
    of four of the face embers,” and alter “the color of the head chunks to try to
    make them less gross.” On September 28, after viewing the new version, Hirai gave
    his blessing, according to emails, with the understanding that the scene would
    be removed entirely from any overseas release. Plans to release and promote The
    Interview moved forward. “I would love working for you and Sony no matter what
    you decided,” Pascal emailed Hirai, “but I just needed to tell you how important
    this was for me and the studio Thank you for being an amazing leader and a very
    cool boss With much gratitude and devotion Amy.”


    It’s not known precisely what new safeguards Sony Pictures implemented in the
    wake of Hirai’s promises; the company declined to provide examples. But it’s painfully
    clear whatever steps it took weren’t enough.


    The studio’s email system, for example, didn’t employ a fundamental protection
    called two-factor authentication, which many companies have used for years. This
    requires anyone logging in to use two forms of identification—for example, a personal
    password and a one-time password randomly generated on a mobile phone or electronic
    key-chain fob—making it far harder for hackers to steal a user’s identity.


    Lax email practices weren’t new at Sony. In a 2007 article titled “Your Guide
    to Good-Enough Compliance” in CIO, a trade publication for IT professionals, studio
    cybersecurity chief Spaltro told the writer how an auditor, citing Sarbanes-Oxley
    requirements to protect personal info, had warned him that Sony had multiple security
    weaknesses, including lax password procedures. “If you were a bank, you’d be out
    of business,” the auditor told him. Spaltro talked the auditor out of noting the
    deficiency, according to CIO’s phrasing, by arguing “that if his people had to
    remember those non-intuitive passwords, they’d most likely write them down on
    sticky notes and post them on their monitors. And how secure would that be?”


    Spaltro seemed more afraid of the costs than the risks. “We literally could go
    broke trying to cover for everything,” he told CIO. “I will not invest $10 million
    to avoid a possible $1 million loss,” he reasoned. “It’s a valid business decision
    to accept the risk.” Although Spaltro’s statements were made eight years ago,
    before Sony became the prominent repeat target of hackers (and he insisted “Sony
    is over-compliant in many areas”), there’s little sign the company’s attitude
    changed.


    There was a litany of laxity. Sony’s email-retention policy left up to seven years
    of old messages on servers, unencrypted and ripe for the taking. The company was
    essentially using email for long-term storage of business records, contracts,
    and documents saved in case of litigation. When Sony announced plans, in the fall
    of 2014, to reduce how long emails would be stored to two years—to make the system
    run better, according to emails, not because of hacking risk—howls of protest
    erupted at the studio.


    An array of sensitive information—including user names and passwords for IT administrators—was
    kept in unprotected spreadsheets and Word files with names like “Computer Passwords.”
    Sony’s IT team had difficulty keeping track of all the hardware in its network,
    which included 30 data centers. In the fall of 2013, while transferring studio
    security monitoring from an outside vendor to a corporate Sony team, one firewall
    and 148 routers, switches, and Web servers were left unwatched for months, according
