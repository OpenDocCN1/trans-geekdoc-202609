    elite hacker squad has built a reputation for being among the most effective computer
    bug exterminators on the planet. Although an ordinary consumer is unlikely to
    recognize any one of their names—James Forshaw, Natalie Silvanovich, Gal Beniamini—the
    world owes them a debt of gratitude for sealing up the devices and services that
    run our digital lives. The team is responsible for a litany of improvements in
    other companies’ products, including finding and helping to patch more than a
    thousand security holes in operating systems, antivirus software, password managers,
    open-source code libraries, and other software. Project Zero has published nearly
    80 blog posts about its work to date, some of the best public security research
    available on the Web today.


    The team’s work indirectly benefits Google’s primary business: online advertising.
    Protecting Internet users from threats means protecting the company’s ability
    to serve those users ads. Project Zero’s effort to hold vendors’ feet to the fire
    also forces them to fix bugs that cause Google products to crash.


    According to Matthew Prince, CEO and cofounder of Cloudflare, the leak uncovered
    by Google’s top bug hunters initially cost his company about a month of growth.
    If he’s at all sour about the experience, Prince doesn’t let it show. He knows
    what it’s like to be targeted by truly malicious hackers. A few years ago a hacker
    group called “UGNazi” broke into Prince’s personal Gmail account, used it to gain
    control over his corporate email account, and then hijacked Cloudflare’s infrastructure.
    The hooligans could have done significant damage. Instead, they decided to redirect
    4chan.org, a common hacker hangout, to their personal Twitter profile for publicity.


    Prince still regrets not informing his customers of the full extent of the Cloudbleed
    issue before Google and Cloudflare published their initial findings. He wishes
    his company had alerted customers before they read about the leak in news reports.
    Even so, Prince believes in retrospect that the Project Zero team was right on
    the timing of when to go live with the disclosure. “I have many more gray hairs
    and will likely live a year less than before as a result of those 14 days,” Prince
    says about the discovery and the aftermath of the leak. “Thank God it was Tavis
    and that team who found it and not some crazy hacker.”


    ![image](images/20140710-GOOGLE-PROJECT-ZERO-014.png)


    CHRIS EVANS He founded Google’s anti-hacker team.


    PRICE LIST: BUG BOUNTIES


    Some companies reward researchers for finding flaws in their products. Here’s
    a sampling of the spoils


    ![image](images/GettyImages-637159024.png)


    GOOGLE


    Android operating system


    Up to $200,000 per bug


    TESLA


    Tesla Model S sedan


    Up to $10,000 per bug


    APPLE


    Apple iOS operating system


    Up to $200,000 per bug


    CLOUDFLARE


    Internet services


    T-shirt and a free trial for bugs


    DEPT. OF DEFENSE


    Public DoD websites


    Portion of $150,000 pool for all bugs


    UNITED AIRLINES


    Website and apps


    Up to 1 million miles per bug


    NETGEAR


    Routers, apps and services


    Up to $15,000 per bug


    ORACLE


    Any product or service


    “Thanks,” a.k.a. credit in advisory about the fix


    ![image](images/GettyImages-613744318.png)


    MATTHEW PRINCE CEO of tech firm Cloudflare


    The Bug Baroness Explains the Economy of Exploits


    ![image](images/ZER07_A.png)


    KATIE MOUSSOURIS Luta Security CEO


    There are two markets for bugs: offense and defense. The former is made of nation-states,
    organized crime groups and other attackers. The latter consists of bug-bounty
    programs and companies that sell security products. The offense market pays higher
    prices and doesn’t have a ceiling. They’re not just buying a vulnerability or
    an exploit; they’re buying the ability to use it without being detected. They’re
    buying silence. The defense market can’t pay as much. It’s not like vendors are
    going to compensate their top developers a million dollars. Even though major
    companies’ code quality is improving, complexity continues to increase. That means
    more bugs. What security researchers do with a particular bug may depend on their
    financial needs, their dispositions about a piece of software or vendor, and their
    own personal risk. It’s not black-hat sellers vs. white-hat. —As told to Robert
    Hackett


    The Code War


    The internet is a battlefield. The prize is your information, and bugs are weapons
    BY LEV GROSSMAN


    ![image](images/140630059014.png)


    HACK STAR Security expert Aaron Portnoy


    Aaron Portnoy started his hacking career when he was still in high school, at
    the Massachusetts Academy of Math and Science in Worcester, which not coincidentally
    was the institution he hacked. He did it as follows: Portnoy had a friend call
    one of the dorms, posing as tech support. The students were more than happy to
    give him their passwords. Hiding behind those borrowed accounts and routing his
    approach through proxies in various foreign countries, Portnoy wormed his way
    into the school’s network through a bug in the system that’s technically known
    as a vulnerability, or even more technically as a zero-day. “I had access to every
    email, grades, everything,” he says. “They had a number of issues with their configurations
    that allowed me to just kind of spread everywhere.”


    Showing what in retrospect seems like considerable restraint, Portnoy tweaked
    the school’s website to say something uncomplimentary about another student. Then
    he got out. Later the school brought in tech experts to trace the intrusion, but
    they could never quite track it back to him.


    So naturally Portnoy did it again the next year and got caught. The academy encouraged
    him to find an alternative venue for his education. It didn’t really matter. He
    graduated from a local high school instead and went on to Northeastern University.
    It was all excellent preparation for what he does for a living now: researching
    and selling software vulnerabilities, which since his high school days have become
    one of the world’s newer and more controversial commodities.


    Portnoy, now 32 and working as a cybersecurity engineer at defense and security
    firm Raytheon, co-founded a company called Exodus Intelligence in Austin, Texas,
    in 2012. Its mission statement reads, “Our goal is to provide clients with actionable
    information, capabilities, and context for our exclusive zero-day vulnerabilities.”
    Which means—translated from the quasi-paramilitary parlance that’s endemic to
    the software-security industry—that Exodus Intelligence finds and sells bugs,
    specifically the kind of bugs that could potentially give a third party access
    to a computer, the same way Portnoy got access to his high school’s network. They’re
    worth a lot of money. Vulnerabilities in popular applications and operating systems
    have been known to change hands for hundreds of thousands of dollars each.'
