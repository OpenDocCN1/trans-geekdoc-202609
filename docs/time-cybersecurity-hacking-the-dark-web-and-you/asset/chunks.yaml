    # 但丝绸之路有所不同。一方面，它更具辨别性：其服务条款禁止儿童色情物品、盗窃货物和伪币。另一方面，它不使用美元，而是使用 `Bitcoins`。


    当 `Bitcoin` 在 2009 年出现时，它是一种完全全新的货币。它由一个被称为 `Satoshi Nakamoto` 的人作为一种财政思想实验引入，此人的真实身份仍然是一个谜。`Bitcoin`
    既是一种支付系统，也是一种纯数字货币——它没有物理形态。`Bitcoin` 的价值由供需关系决定，并且只有在个人和公司同意交易它时才具有价值。


    `Bitcoins` 属于一个对银行和政府的信任受到损害的时代。用户可以将它们从一个数字钱包转移到另一个，而无需银行进行交易撮合或收取费用。这种货币是完全去中心化的——其架构很大程度上归于
    Napster 的继任者 `BitTorrent`——并基于复杂的密码学。`Bitcoin` 本质上是互联网的现金，几乎匿名且极难伪造。农夫市场（The Farmer’s
    Market）之所以脆弱，是因为它在现实世界中留下了财务轨迹。而丝绸之路没有。


    和 `Tor` 一样，`Bitcoin` 的存在有完全合法的理由。据所知，它主要用于法律目的——现在有数十家企业接受 `Bitcoins`，包括 `Howard
    Johnson`、约会网站 `OKCupid` 以及至少一家纽约的酒吧。但 `Bitcoin` 的数字隐蔽性，在深层网（Deep Web）匿名性的加倍效应下，创造了一个现实世界或虚拟世界从未见过的潜在犯罪交易平台。这种潜力被
    `Dread Pirate Roberts` 实现了。


    ## Ross Ulbricht 的兴起


    `Ulbricht` 在德克萨斯州长大，曾是一名鹰军童军员，随后在德克萨斯州大学达拉斯分校学习物理学。他是同同为德克萨斯州人、自由意志主义者 `Ron Paul`
    的粉丝；两人都研究奥地利学派以及该学派创始人 `Ludwig von Mises` 的著作，后者信奉不受限制的市场。`Ulbricht` 在宾夕法尼亚州立大学获得了材料科学与工程硕士学位。熟人描述他既聪明又守规。“他不是谈话的中心，也不是任何事情的中心，”一位自称在
    2012 年与他有过短暂交往的朋友说道，“他有点是把自己置于背景中。”


    在他毕业时，`Ulbricht`已经对互联网作为完善自由市场的场所这一想法产生了兴趣。根据他的 `LinkedIn` 资料，他最大的敌人是政府。“武力最广泛、系统性的使用存在于机构和政府之间，因此这是我目前努力的重点，”他写道，“然而，改变政府的最好方法是改变被统治者的思想。为了实现这一目标，我正在创建一个经济模拟系统，让人们亲身体验生活在一个没有系统性使用武力的世界里会是什么样。”


    在 2009 年从宾夕法尼亚州立大学毕业后，`Ulbricht` 去了澳大利亚悉尼看他的姐姐。据称，正是在那里，他开始着后来成为丝绸之路的项目，并将自己转变为
    `Dread Pirate Roberts`。那时，毒品贩已经活跃在深层网，但他们的业务往往因两个原因而失败：交交的资金是可以追溯的，而且很难与客户建立信任。`Roberts`
    将解决这两个问题。`Tor` 和 `Bitcoin` 创造的双层匿名性使得资金几乎不可追溯。为了建立信任，`Roberts` 从两个合法商业的殿堂中寻求灵感：`Amazon`
    和 `eBay`。


    ## 丝绸之路的运营


    他学习很快。丝绸之路的用户描述了一种精良、功能齐全的体验，拥有买家和卖家的评论以及客户论坛。“在决定是否与某个供应商交易时，我会阅读他们页面上的反馈，以及几个月前的评级，”一位不愿具名的丝绸之路客户说，“我还会去论坛阅读卖家的评论贴帖，根据具体内容，我会去查看一个‘复仇者联盟’贴帖，那里丝绸之路社区的人会发布单个产品的实验室结果。”当交易真的出现问题时，有一套纠纷解决系统。“老实说，那里就像一家糖果店，”该用户说道。丝绸之路于
    2011 年 1 月上线。它的存在几乎没有被保密——既然 `Tor` 让匿名进出成为可能，又何必费事呢？隐藏只会对生意不利。“这基本上是对比执法部门的公开挑衅，”`Bharara`
    在 2013 年接受《时代》杂志采访时说道。


    ## 调查与逮捕


    FBI 在 2011 年 10 月首次窥探了 `Ross Ulbricht`。一个名为 `altoid` 的人一直在各种聊天群中推广丝绸之路；根据针对 `Ulbricht`
    的起诉书，随后在一个 `Bitcoin` 论坛上，`altoid` 发布了一则广告，为一家“风险投资支持的比特币初创公司”寻找一位“比特币社区的 IT 专家”。`Ulbricht`
    列出了他的真实邮箱地址作为申请该职位的联系方式。


    `Ulbricht` 的真实邮箱地址是该职位的联系方式。FBI 从 `Google` 获取了记录，显示 `Ulbricht` 在旧金山的一家咖啡馆访问丝绸之路。与
    `Ludwig Mises Institute` 关联的 `Google` 账户显示了一个对应旧金山的 IP 地址。`Ulbricht` 匆忙更改了他的用户
    ID（改为 `frosty`），但损害已经造成：那段代码同样出现在丝绸之路网站的代码中。


    从那里开始，线索变得更加阴暗和错综。2013 年 1 月，一名丝绸之路员工显然盗取了用户的 `Bitcoins`，随后被捕。`Roberts` 展现了调查人员未见过的一面，他与一名丝绸之路客户签约对其进行酷刑直到其交还
    `Bitcoins`。这不是一个自由意志主义理想者的行为，而是一个反社会人格者的行为。`Roberts` 并不知道他交易的杀手是一个在丝绸之路购买毒品的 FBI
    卧探。该探员向 `Roberts` 发了伪造的杀人证据。满意的 `Roberts` 从一家澳大利亚货币交易所汇出了 8 万美元。


    根据 FBI 探员 `Christopher Tarbell` 的证词，加拿大的丝绸之路用户开始勒索 `Roberts`，威胁要泄露客户信息。`Roberts`
    的回应是支付给网友 `redandwhite` 15 万 `Bitcoin` 以杀掉那个勒索者。（`Roberts` 也收到了那次杀人的照片，但加拿大警方无法将其与已知的任何案件匹配。）2013
    年 6 月，`Roberts` 向 `redandwhite` 订了一套假身份证。当月晚些时候，海关打开了一个从加拿大寄来的包裹，里面有九张带有 `Ulbricht`
    照片和出生日期的假身份证。该包裹还提供了 `Ulbricht` 的地址。


    收网行动迅速收紧。到 7 月，FBI 黑客追踪到了丝绸之路的一台服务器，位于一个尚未公布的国家，这让他们获取了 `Roberts` 所有的邮件副本，以及从网站启动开始的交易记录。2013
    年 7 月 26 日，国土安全部的探员敲响了 `Ulbricht` 的门。他承认自己一直用假名生活。


    当局在 7 月 31 日获得了另一个突破，他们搜查了一名西雅图毒品贩的公寓，该贩子通过丝绸之路以代号 `Nod` 甲基冰碱、古柯因和海洛；他们迅速将其转为线人。10
    月 1 日，在首次发现他后的两年后，联邦探员跟随 `Ulbricht` 到了格伦公园图书馆并将其逮捕。FBI 表示，在他在电脑屏幕上显示证据时抓获了他的现行证据。


