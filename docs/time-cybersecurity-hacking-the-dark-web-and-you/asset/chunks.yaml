  raw: 'Jefts is a thoughtful academic in her mid-30s, an archivist and art historian
    at a Chicago university who never intended for images of her naked body to circulate
    on the internet. But in 2011, soon after Jefts ended her long-distance relationship
    with a boyfriend who lived in Italy, explicit screenshots from their Skype conversations
    began to appear online. They were emailed to her family and friends, posted on
    Facebook with violent threats against her and even appeared on websites devoted
    to exposing people’s sexually transmitted diseases, with false allegations about
    her sexual history.


    There’s a name for what Jefts has experienced, a digital sex crime that has upended
    thousands of lives but still mostly eludes law enforcement: nonconsensual porn,
    better known as revenge porn. The two are not quite the same: revenge porn is
    often intended to harass the victim, while any image that is circulated without
    the agreement of the subject is nonconsensual porn. But both can result in public
    degradation, social isolation and professional humiliation.


    Enabled by the technological and cultural upheaval that put a camera in every
    pocket and created a global audience for every social-media post, nonconsensual
    porn has become increasingly common. Practically every day brings reports of a
    new case: A 19-year-old woman in Texas was blackmailed into having sex with three
    other teens after a former partner threatened to release an explicit video of
    her. The man pleaded guilty to threatening to disclose intimate visual material,
    was fined $400 and was sentenced to probation. A 20-something in New Jersey had
    strange men coming to her door after an ex-boyfriend posted her pictures and address
    with an invitation to “come hook up.” The perpetrator was charged with invasion
    of privacy and served three months of a six-month sentence. An Illinois school
    superintendent in her 50s was fired when her ex-husband allegedly sent an explicit
    video of her to the school board.


    Some of these private photos and videos find their way to porn sites, where “revenge”
    is its own genre. Often, however, they’re posted on social media, where all the
    victim’s friends can see them. According to documents obtained by The Guardian,
    Facebook received more than 51,000 reports of revenge porn in January 2017 alone,
    which led the site to disable more than 14,000 accounts. A 2016 survey of 3,000
    internet users by the journal Data and Society found that roughly 1 in 25 Americans
    had either had someone post an image without permission or threaten to do so—for
    women under 30, that figure rose to 1 in 10. And a June Facebook survey by the
    anti-revenge-porn advocacy group Cyber Civil Rights Initiative (CCRI) found that
    1 in 20 social-media users has posted a sexually graphic image without consent.


    In some cases, the perpetrator is a hacker who targets famous women, searching
    for compromising photos to leak. Last year, Saturday Night Live star Leslie Jones
    was hacked and her nude pictures were spread online. In 2014, nude photos of Jennifer
    Lawrence and other female celebrities were hacked and leaked in one of the biggest
    nonconsensual-porn cases to date. And it’s a problem nearly everywhere in the
    world: in May 2017, nude photos purportedly of Rwandan presidential candidate
    Diane Shima Rwigara appeared online days after she announced her intention to
    challenge the nation’s longtime leader, Paul Kagame.


    Sexual violation, in short, has become digital as well as physical. And its rapid
    spread has left law enforcement, tech companies and officials scrambling to catch
    up. When evidence lives in the cloud and many laws are stuck in the pre-smartphone
    era, nonconsensual porn presents a worst-case scenario: it’s easy to disseminate
    and nearly impossible to punish.


    Jefts never thought of herself as the kind of person who would send nude photos.
    She is circumspect and professional—and acutely aware of the power of images.
    But then she met a man who lived an ocean away, and quickly fell in love. Skype
    kept the relationship alive, and the pair sent each other photos and video-chatted
    in ways that sometimes became sexual. “If it’s World War II and your husband leaves,
    you send letters and pictures, you have this correspondence that helps maintain
    that emotional connection,” she explains. “It’s more instantaneous \[today\] because
    of the technology, but the origin of it is the same.”


    While some nonconsensual porn comes from pictures that are hacked or taken surreptitiously,
    in many cases the images were traded between partners as sexts. According to a
    2016 study of nearly 6,000 single adults by researchers at Indiana University,
    16% had sent a sexual photo, and more than 1 in 5 had received one. Of those who
    received a nude image, 23% reported sharing it with others, with men twice as
    likely as women to do so. Boomers might be baffled by this practice, but for many
    under 30, sexting isn’t seen as particularly transgressive. “It’s embedded in
    modern relationships in a way that makes us feel safe,” says Sherry Turkle, a
    professor at MIT. “This is a question that doesn’t need an answer if you grew
    up with a phone in your hand.”


    According to Turkle, many digital natives are so comfortable on the internet that
    they simply imagine that there are rules about what can and can’t happen to the
    content they share. “If you feel the internet is safe, you want to share everything
    because it’ll make you feel closer and it’s a new tool,” she says. “People made
    up a contract in their minds about the online spaces they’re in.”


    Women sometimes circulate male nudes, but studies show the vast majority of nonconsensual
    images are photos of women spread by men. When accused, some men say they were
    hacked and the photos must be coming from another source. Others admit that they
    posted the photos out of anger, lashing out over a perceived slight. One Louisiana
    tattoo artist told police he posted a sex tape of his ex on a porn site as retribution
    after she damaged his car. A Minnesota man reportedly admitted putting explicit
    images of his ex-wife on Facebook because he was jealous of her new boyfriend.


    The act of sharing these images can be as much about impressing other men as it
    is about humiliating the victim. Boys once presented stolen underwear as trophies
    from conquests—now a nude selfie can signal the same thing. As a result, schools
    around the nation have dealt with what are often referred to as sexting rings.
    In 2014, more than 100 teens in a rural Virginia county were investigated for
    circulating more than 1,000 nude photos of mostly underage girls on Instagram.
    A Colorado district attorney chose not to bring charges against teens who were
    sharing photos of high schoolers and middle schoolers in 2015. Similar incidents
    have popped up recently in schools in Ohio, New York and Connecticut, and the
    practice has become common enough that the American Academy of Pediatrics developed
    a guide for parents on talking to children about sexting.


    “Lots of this isn’t intentional,” says Erica Johnstone, a San Francisco attorney
    with a practice dedicated to sexual privacy. “It’s just part of the hypermasculine
    culture: sex pictures become like currency.”


    On an otherwise ordinary day in 2011, Holly Jacobs decided to Google herself.
    When a porn site came up in her search results, Jacobs went into what she now
    describes as “a complete state of shock. I could feel the blood rushing out of
    my head. I was turning white as the page was buffering.”


    She would soon learn that photos of her were posted on nearly 200 porn sites.
    A collage of nude images had been sent to her boss and co-workers. Explicit pictures
    of her were shared with her father on Facebook. She says she almost lost her job
    at a Florida college after someone online accused her of masturbating with students
    there, and she eventually stopped working as a statistical consultant because
    “every time I met with a client, I wondered if they had seen me naked.”'
