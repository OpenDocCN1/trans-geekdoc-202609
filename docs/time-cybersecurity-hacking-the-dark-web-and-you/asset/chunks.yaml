  raw: 'Rogen didn’t always plan a comedy about a plot to kill the actual ruler of
    North Korea. Early scripts employed a fictional character named Kim Il-hwan, according
    to Interview screenwriter Dan Sterling. He maintains it was a studio executive
    (he declined to give the person’s name) who originally suggested using Kim. Rogen
    and Goldberg loved the idea. Unlike, say, China, an important film market and
    thus one Sony didn’t want to alienate, North Korea was regarded as fair game for
    provocative material in Hollywood. Pascal and Lynton blessed this change.


    In hindsight it’s easy to second-guess this decision. North Korea is a rogue state
    (with nuclear missiles) led by a volatile, unpredictable dictator. “Why is it
    necessary to name Kim Jong-un?” a filmmaker who has worked with Sony asks Fortune.
    “Is it going to mean that much more at the box office? If you’re doing a serious
    film it’s one thing. But it’s a fart movie!”


    The plot of The Interview is now well-known. A doltish tabloid talk-show host
    played by James Franco and his bosom-buddy producer (Rogen) are invited to North
    Korea to interview Kim Jong-un, who’s a secret fan of their program. The CIA then
    enlists the pair to assassinate Kim. Some laughs ensue. It all ends with Kim’s
    fiery death in a helicopter, which Franco’s and Rogen’s characters gun down from
    a commandeered tank.


    The Interview cost $44 million to make ($8.2 million went to Rogen) and had a
    $32 million marketing budget. Sony had hefty box-office expectations for the R-rated
    comedy: $100 million to $135 million. The movie features tigers, military hardware
    and expensive special effects. Even Rogen marveled at the latitude he’d enjoyed,
    telling Rolling Stone before its release, “They’re giving us insane amounts of
    money to do whatever the f - - k we want.”


    Given the pair’s commercial success, Sony was deeply motivated to keep Rogen and
    Goldberg happy and on the studio lot, where they worked out of a suite of offices
    and strolled the grounds smoking weed. “We love your movies and frankly yours
    is the most important relationship we have,” Dwight Caines, Sony’s president of
    theatrical marketing, told Rogen in an email. Test screenings for The Interview
    were strong. “Totally floored by this movie. And by you,” Pascal wrote Rogen and
    his team in April. “Thanks for letting us make it,” Rogen replied. “Nobody else
    would do that.”


    Rogen and his collaborators seem to have genuinely wanted to make a statement
    about the loony and oppressive ways of the Kim regime. “I was thrilled by the
    opportunity to make a mass-appeal studio movie with a bit of political commentary
    in between the dick jokes,” says Sterling. Sony executives seemed onboard. “The
    movie is doing something bold that I’m not sure any other movie has done before—taking
    on as its subject matter a real persona of this notoriety,” Caines wrote Rogen
    in May. “This is the kind of angle that makes this notable … fun with a dash of
    smarts.”


    On June 17, leaked emails show, Sony’s appetite for mocking a “real persona” instantly
    diminished. Days after the film’s first trailer appeared online, Hirai, who had
    just screened the movie, called Lynton, concerned about roiling already fraught
    relations between Japan and North Korea. As Hirai saw it, this made The Interview
    dangerous fare for a Japanese company.


    Lynton scrambled, first by yanking the trailer from the internet for re-editing.
    As part of Hirai’s One Sony initiative, the studio had just added the Sony logo
    to the credits for all films released under the studio’s brands, which include
    Columbia Pictures, TriStar and Screen Gems. Now orders went out to erase “Sony”
    from everything associated with The Interview in an attempt to downplay its Japanese
    parentage. Plans for a limited Asia release were also scrapped. “Have to keep
    whole interview thing under wraps,” Lynton told Pascal.


    That wouldn’t be easy. Within days a North Korean government spokesman warned
    that The Interview’s release would represent “the most blatant act of terrorism
    and war,” and threatened “a merciless counter-measure.” (The government later
    filed formal complaints with the White House and the United Nations Security Council.)
    North Korea has long been known for its threats against other countries, but most
    have turned out to be mere bluster.


    Still, the Kim regime had been widely blamed for a series of cyberattacks, especially
    against its archenemy, South Korea, and was believed to employ a cadre of several
    thousand army hackers. The worst incident had occurred in March 2013. Known as
    the DarkSeoul attack, it caused $700 million in damage to South Korean banks and
    broadcasters, freezing ATMs and erasing the hard drives of 30,000 computers. The
    hackers in this episode, which received considerable press coverage in the U.S.,
    posted a notice featuring images of skulls.


    Yet Sony Pictures executives were caught off guard by the growing storm over their
    film. They tried to assess the danger. Reached in Europe after Hirai’s call, studio
    executive Doug Belgrad advised Lynton that he was now “doing the homework on whether
    there is precedent on depicting and/or killing a living leader on film.” Emails
    show Lynton tapped his personal network, conferring informally with two outside
    experts. (Rogen brushed it all off with a jocular tweet: “People don’t usually
    wanna kill me for one of my movies until after they’ve paid 12 bucks for it.”)


    In a written statement on behalf of Lynton, Sony spokesman Lawson insists that
    the “extremely knowledgeable” experts the CEO consulted “gave no hint or warning
    of the possibility of a cyberattack.” Indeed, one expert Lynton spoke with, Daniel
    Russel, assistant secretary of state for East Asian and Pacific affairs, made
    no mention of hacking risk, according to a note Lynton prepared memorializing
    their conversation.


    But Lynton got a different message from the expert he consulted most extensively.
    Bruce Bennett, a North Korea specialist with the RAND Corp.—where Lynton serves
    on the board—says he did warn the Sony CEO that a cyberattack was “a possibility.”


    After watching The Interview, Bennett sent him a three-page memo assessing the
    situation even before the Koreans began protesting the film, then had several
    follow-up exchanges with Lynton. Bennett advised him that the North Koreans frequently
    made empty threats, and there probably wasn’t much to fear.


    Bennett’s memo noted the likelihood that North Korea would probe Sony’s computer
    systems: “Even if North Korea doesn’t know about the film yet, as soon as they
    do find out about it, they will likely explore Sony’s computer systems to see
    if Sony is ready to deal with North Korean criticism.” (The memo was not retrievable
    from the hacked documents; Bennett read the passage to Fortune.)


    In their follow-up conversations, Bennett says, he went further. He says he told
    the CEO that the Kim regime employed hackers “who could potentially cause damage,”
    described the DarkSeoul episode and counseled: “You need to realize something
    could happen in that area.” Lawson denies this: “If \[Lynton\] had received any
    kind of warning, his next call would have been to a cyberexpert to ask about it
    … In their many phone conversations, Bennett never mentioned the possibility of
    a cyberattack on the studio … ”


    Rogen and Goldberg also received warnings of a possible cyberattack, according
    to their spokesman, Matt Labov. Even before they began shooting the film the pair
    sought the advice of Rich Klein, whose Washington, D.C.–based consulting firm,
    McLarty, advises Hollywood on sticky geopolitical problems. After reading their
    script, Klein tells Fortune, he advised the filmmakers to expect North Korean
    “blowback,” possibly in the form of an electronic assault. He urged them to change
    their banking and email passwords and closely monitor their internet accounts,
    and passed on the name of a cybersecurity adviser.'
