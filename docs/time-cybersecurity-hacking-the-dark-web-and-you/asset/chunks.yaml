    They’re worth a lot because although you wouldn’t know to look at it, the internet
    is a war zone. Even as it gets outwardly ever glossier and more social and eager
    to please, below that surface the Net is becoming a hostile, contested territory
    where private companies, law enforcement, criminals, the military and various
    international intelligence agencies are engaged in constant low-level cyberwarfare.
    This conflict only occasionally becomes visible to the naked eye—in May 2014,
    for example, when the U.S. indicted five members of the Chinese army for stealing
    data from American companies, including `Westinghouse` and `Alcoa`. They are still
    on the `FBI` Most Wanted list. That wasn’t an anomaly; it’s the norm, and it’s
    getting more normal all the time. Retired Army general Keith Alexander, who formerly
    headed both `NSA` and `U.S. Cyber Command`, has called China’s ongoing theft of
    intellectual property “the greatest transfer of wealth in history.” Recently several
    security firms confirmed that a group believed to be backed by the Russian government
    has been systematically hacking U.S. energy infrastructure since at least 2012.
    According to `Ponemon Institute`, which conducts data-security research, the average
    organization fielded a total of 28,512 attacks in 2016.


    ### The Reality of Cyberwar


    Cyberwar isn’t the future; it’s already here. It’s business as usual. In this
    war, the battlefield is everywhere, bugs are weapons, and people like Portnoy
    are arms dealers. The idea that a software bug can be worth actual dollars is
    an odd one. Bugs are mistakes; people generally pay money to fix them. The fact
    that there’s market for them is consequence of larger oddness of our present era,
    in which our entire world—our businesses, medical records, social lives—is emigrating
    bit by bit out of reality and into software innards of computers in the form of
    data. A lot of people are interested in that, for reasons both good and bad. Some
    of people are spies. Some of them are criminals.


    ### The Stuxnet Case


    In 2009 there was a good lesson in what makes vulnerabilities so useful. U.S.
    and Israel jointly developed a complex computer worm that was designed to penetrate
    and compromise a specific uranium-enrichment facility in Iranian city of Natanz.
    The worm, which is now known as `Stuxnet`, was arguably the first true cyberweapon.
    It was introduced into the facility’s computer system by a double agent with a
    USB drive. The worm checked out the place and sent detailed intelligence back
    to its masters. Then it really let down its hair and went after the computers
    used to enrich uranium. It eventually destroyed about 20% of them. All deduced
    by security experts and journalists. What made `Stuxnet` so effective? In a word:
    bugs. To get the access it needed, `Stuxnet` took advantage of at least four distinct
    vulnerabilities, including one in `Microsoft Windows`. These vulnerabilities—or
    rather the knowledge to exploit them—were themselves unlike the uranium the Iranians
    were working on, but in software form: expensive, highly refined munitions that
    formed the core of an extremely sophisticated weapons system. They made `Stuxnet`
    all the more destructive when—unsreasonably to anyone who’s seen `Jurassic Park`—it
    got loose from the Natanz facility and infected around 100,000 computers worldwide.


    ### The Bug Bounty Market


    The idea of paying money for bugs goes back a lot further than `Stuxnet`. In 1995
    `Netscape` announced a program, `Bugs Bounty`, that paid cash to anybody who could
    find flaws in its browser. The company wasn’t trying to destroy centrifuges; it
    just wanted to fix holes in its software. In 2002 a security firm called `iDefense`
    started buying up vulnerabilities of all kinds; another company, `TippingPoint`,
    launched a similar program in 2005. Both programs were created as alternatives
    to the increasingly active and chaotic exchange of zero-days on the open market—essentially
    they acted as safe zero-day disposal facilities, a bit like radioactive-waste
    repositories. If you found a bug, instead of selling it to the highest bidder
    who would do God knows what with it, you could sell it to `iDefense` or `TippingPoint`
    for a reliable price, and they would alert their clients to the problem and work
    with the software vendor to get the bug patched. `iDefense` and `TippingPoint`
    had something else in common too: they both, in successive years 2005 and 2006,
    hired an intern named Aaron Portnoy.


    `Portnoy` in no way resembles Matthew Broderick in `WarGames`. He’s a confident,
    affable, articulate guy who makes good eye contact and just happens to be a super-cyberintrusions
    expert. In 2006, `Portnoy` dropped out of `Northeastern` to work at `TippingPoint`
    full-time, and in 2012 he left to go into the vulnerabilities business on his
    own. In November 2015, `Portnoy` left his startup to work for `Raytheon`. `Exodus
    Intelligence` joined a small, elite field that includes `Vupen`, which is based
    in the South of France; `Revuln` in Malta; `Netragard` in the U.S.; and `Telus`
    in Canada. `Netragard` wins for best corporate motto: “We protect you from people
    like us.”


    ### Operations at Exodus Intelligence


    Hackers at Exodus spend their days banging on software looking for ways in: browsers,
    email clients, instant-messaging clients, `Flash`, `Java`, industrial control
    systems, anything an attacker could use as an entry point. “One thing we try to
    maintain is a capability in every major backup software out there, because that’s
    one of the juiciest targets,” `Portnoy` told `TIME` in 2014. “If you get on an
    enterprise network, what is an administrator going to want to protect? Their important
    information. What do they use to protect that? Backup software.”


    When a researcher at Exodus finds a vulnerability, he or she types it up in a
    professional-looking report along with technical documentation that explains what
    it does, where it lives, what it gets you, how to spot it, what versions of the
    software it works on, how one can mitigate it and so on. Most important, Exodus
    provides you with an `exploit`, which is the procedure you’d have to follow to
    actually trigger the bug and take advantage of it. “Every single vulnerability
    that we give our customers comes with a working exploit,” `Portnoy` explained.
    “If we can’t exploit it, we don’t bother telling anyone. It’s not worth it.” Voilà,
    one freshly minted zero-day vulnerability. (A note on that term, “zero-day”: it
    refers to a bug’s freshness. Bugs, like fish, don’t age well, and zero-day means
    that the bug has been public for exactly zero days, hence no one has tried to
    fix it yet. The term is so ubiquitous that it has gone from adjective to noun:
    Exodus sells zero-days.)


    `Portnoy` takes pride in the superior quality and effectiveness of Exodus’s exploits.
    “We try to make them as nasty and invasive as possible,” he said in 2014. “We
    tout what we deliver as indicative of or surpassing the current technical capabilities
    of people who are actually attacking others.” When a company hires Exodus, it
    generally does so on a subscription basis: you get a certain number of bugs a
    year for such-and-such amount of money. Subscriptions start at around $200,000.


    The vulnerabilities business has a mixed reputation, based on the presumption
    that the bugs it provides are being used for criminal or unethical purposes. A
    Washington, D.C., company called `Endgame` that sold vulnerabilities to the government
    for years was dubbed “the Blackwater of hacking” by `Forbes magazine`. In 2013,
    when `Endgame` announced that it was getting out of the game, it did so triumphantly,
    as if it were kicking a heroin habit: “The exploit business is a crummy business
    to be in,” its CEO said.

