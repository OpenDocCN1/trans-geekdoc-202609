    Jefts is a thoughtful academic in her mid-30s, an archivist and art historian
    at a Chicago university who never intended for images of her naked body to circulate
    on the internet. But in 2011, soon after Jefts ended her long-distance relationship
    with a boyfriend who lived in Italy, explicit screenshots from their `Skype` conversations
    began to appear online. They were emailed to her family and friends, posted on
    `Facebook` with violent threats against her and even appeared on websites devoted
    to exposing people’s sexually transmitted diseases, with false allegations about
    her sexual history.


    ## Nonconsensual Porn and Revenge Porn


    There’s a name for what Jefts has experienced, a digital sex crime that has upended
    thousands of lives but still mostly eludes law enforcement: nonconsensual porn,
    better known as revenge porn. The two are not quite the same: revenge porn is
    often intended to harass the victim, while any image that is circulated without
    the agreement of the subject is nonconsensual porn. But both can result in public
    degradation, social isolation and professional humiliation.


    ## The Impact of Technology


    Enabled by the technological and cultural upheaval that put a camera in every
    pocket and created a global audience for every social-media post, nonconsensual
    porn has become increasingly common. Practically every day brings reports of a
