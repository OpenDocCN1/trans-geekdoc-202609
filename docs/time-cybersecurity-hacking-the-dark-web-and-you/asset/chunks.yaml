    白帽：一种目标是修补漏洞并保护安全系统的黑客。白帽黑客通常会将公司防御和软件中的弱点相关信息提供给公司本身，以便其进行修复。


    # 第一章：网页的危险


    互联网的构想曾是人类知识共享的乌托邦。然而，尽管它带来了许多益处，网络也滋生了从黑客到恐怖分子的各种坏分子。


    ## 深网 | 斗击报复性色情 | 黑客之年


    ![image](img/chap_one.png)


    ### 深网


    大约 10 年前，政府建立了一个完全私密、匿名的网络。随后，它成为了毒品和儿童色情内容的避风港。作者：夫·格罗斯曼（Lev Grossman）和杰·纽顿-斯马尔（Jay
    Newton-Small）。


    ![image](img/shutterstock_372828304.png)


    2013 年 10 月 1 日下午，一个高、消瘦、留着长发的男子离开了他位于金山市 15 道的家。他每月支付 1000 美元现金与两个室友合住，这两个室友只知道他是一个叫乔什·特里（Josh
    Terrey）的安静货币交易员。他的真名字是罗斯·乌尔布希特（Ross Ulbricht）。他今年 29 岁，没有犯罪记录。乌尔布希特穿着牛仔裤和红色 T
    恤，前往格伦公园公共图书馆，走向科幻区并登录笔记本电脑——他正在使用免费 Wi-Fi。几名穿便服的 FBI 探员聚集在一起，将他推到窗户边，然后护送他离开建筑。


    FBI 认为乌尔布希特是网络上被称为“恐惧海盗罗伯特”（Dread Pirate Roberts）的 {罪犯，这个名字源自书籍和电影《新娘传奇》。在现实生活中，这位“恐惧海盗罗伯特”是`丝绸之路`（Silk
    Road`）的所有者和管理员。极其成功的在线市集，人们在那里买卖非法物品——主要是毒品，还有虚假身份证、烟花和黑客软件。他们可以这样做而不被发现，因为`丝绸之路`位于互联网一个不为人知的区域，即“深网”（`Deep
    Web`）。乌尔布希特在 2015 年因计算机黑客、洗钱和贩毒等等指控被定罪，目前在监狱中服从无期徒刑。


    从技术上讲，`深网`指的是所有`Google`等搜索引擎未索引或无法索引的网站和数据库的集合，从信息总量来看，它比我们所知的网络大许多倍。但更宽泛地说，`深网`是互联网的一个特定分支，其特征是那种日益稀缺的商品：完全的匿名性。你在`深网`上所做的任何事情都无法与你的现实世界身份联系起来，除非你意愿如此。尽管大多数人从未见过它，但访问它所需的软件是免费的，且下载安装只需不到三分钟。如果说网格中有一部分可以被认为是脱离网的，那就是`深网`。


    `深网`的存在有充分的理由。它是情报人员、执法部门、政治异见人士以及任何需要或想要私下处理在线事务的人的至关工具——而现在，越来越多的人都是如此。根据皮尤亚洲与美国生活项目在
    2013 年发布的一项调查显示，86%的互联网用户尝试过删除或隐藏自己的数字历史，55%的人尝试避免被雇主或政府等特定方在网上监视。


    但`深网`也是进行非法活动的理想场所，特别是当它像`丝绸之路`案那样，与匿名且几乎无法追踪的电子货币`比特币`（`Bitcoin`）结合时。“它让各种犯罪分子，在过去的时代必须寻找露天毒品市场或某个小巷来从事坏活动，现在可以公开进行，”普里特·巴哈拉（Preet
    Bharara）在 2013 年告诉《时代》杂志。他是纽约南部区的前美国检察官，他的办公室在 2015 年起诉了乌尔布希特。根据针对乌尔布希特的 39 页联邦起诉书，从
    2011 年 1 月到 2013 年 9 月的 2.5 年里，`丝绸之路`充当了亚马逊式的非法物品清算中心，为全球近百万名客户提供了价值 12 亿美元的违禁品。“恐惧海盗罗伯特”，即`深网`世界的“杰夫·贝佐斯”（Jeff
    Bezos），据指控他收集了约 8000 万美元的费用。


    大多数使用`深网`的人并不是犯罪分子。但一些检察官和政府机构认为，`丝绸之路`只是冰山一角，而`深网`是一个潜在的噩梦，是小偷、儿童色情制作者、人口贩子、伪造者、刺客以及国家机密和扩散核武器贩子的电子避风港。FBI、DEA、ATF
    和 NSA（仅列举几个）正花费数千万美元试图弄清楚如何破解。这很讽刺，因为最初是美国军方建造了`深网`。


    `深网`的故事是一个关于技术及其意之外后果的寓言。1996 年 5 月，三位来自美国海军研究实验室的科学家在英国剑桥的一的一个研讨会上发表了一篇题为“隐藏路由信息”的论文。该论文阐述了一种系统的技术特征，用户可以访问互联网而无需向在此过程中可能交互的任何
    Web 服务器或路由器泄露身份。他们将自己的想法称为“洋葱路由”（onion routing），因为包裹并遮盖往回传输的数据周围有层层加密。到 2003 年
    10 月，这个想法准备好作为一个开源项目发布到网络上，名为`Tor`。如果`深网`是一个面具舞会，`Tor`提供了面具。


    在许多方面，`Tor`与其说是进步，不如说是回到过去。在互联网历史的大部分时间里，用户的在线形象与其真实身份联系松散，或者根本没有联系。互联网是一个人们可以创建新的、更流动的自我的地方。在
    90 年代的大部分时间里，网络向人们承诺第二生命。但随着时间的推移，特别是`Facebook`的出现，我们的在线生活与现实自我紧密相连。现在无论我们走到哪里，都会辐射自己的信息——浏览历史、购买记录、视频品味、社交关系，甚至是地理位置。无处不在。


    美国政府为什么要资助创建这样一个系统？有很多理由。警方可以利用它在线收集匿名举报、设置钓鱼行动并探索非法网站而不触引起所有者。军事和情报机构可以使用它进行秘密通信。国务院可以培训外国异见人士使用它。`Tor`目前由一家位于西雅图的非营利组织管理，并由`Google`和骑士基金会在内的各种组织资助。但根据
    2017 年《卫报》的报告，直到 2015 年，仍有 120 万美元的资金来自美国政府。


    `深网`的腐败从其建立后不久就开始了。早在 2006 年，一个后来被称为“农夫市场”（The Farmer’s Market）的网站就在出售大麻和氯酮等毒品。在
    2012 年 4 月被 DEA 领导的团队摧毁之前，它已在 50 个州和 34 个国家建立了客户。`深网`不仅仅是毒品的来源：有证据表明圣战分子通过它进行通信，僵尸网络（垃圾邮件发送者利用的大型病毒计算机网络）利用它来躲避调查人员。即使现在，在`深网`上找到武器或儿童色情也只需要一两分钟。2013
    年 8 月，FBI 关闭了自由托管（`Freedom Hosting`），这是一家专门经营深网的公司，指控它是“全球最大的儿童色情便利者”。其所有者现年 32
    岁的里克·马奎斯（Eric Marques）正面临从爱尔兰引渡。


