    ## Why It’s So Hard for Revenge-Porn Victims to Get Justice


    Sex crimes can be difficult to prosecute when they take place in the physical
    world—when the offense happens online, justice is even harder to come by. Between
    cultural attitudes, technological obstacles and legal inconsistencies, victims
    of nonconsensual porn face a challenging road to recourse.


    ![image](images/page_27.png)


    ### PERSONAL SHAME

    Many revenge-porn victims are too embarrassed to come forward. Victim blaming
    is pervasive, and the first response of many friends, family and even police officers
    is to ask why anyone would take and send a nude photo in the first place. People
    would ask, “‘How could you share those photos?’” recalls Cyber Civil Rights Initiative
    founder Holly Jacobs, describing her own experiences.


    ![image](images/page_27-1.png)


    ### ILL-EQUIPPED POLICE

    Few local law-enforcement agencies have a sophisticated understanding of the impact
    of revenge porn and the technological tools to address it. Even if they do take
    the crime seriously, in many cases local police can’t effectively collect digital
    evidence.


    ![image](images/page_27-2.png)


    ### PATCHWORK LAWS

    While 38 states now have laws against revenge porn, those laws apply a variety
    of standards. And unlike crimes in which the victim and perpetrator have a physical
    encounter, nonconsensual porn can be spread across state lines, creating a tangle
    of different jurisdictions and competing laws.


    ![image](images/page_27-3.png)


    ### TECHNOLOGICAL REALITY

    Once something is on the internet, it’s nearly impossible to erase it. While many
    social-media platforms and porn websites have become more cooperative about removing
    content that was shared without consent, there’s no guarantee that those photos
    haven’t spread elsewhere online. “Generally speaking, the internet is permanent,”says
    Reg Harnish, the CEO of `GreyCastle Security`.


    ## The Year of the Hacker


    It was in 2016 that hackers made vulnerability the new normal and took aim at
    democracy itself BY MATT VELLA.


    ![image](images/code.png)


    Hackers have a bad name everywhere, it seems, except in Silicon Valley, founded
    as it was on the virtues of creatively overcoming technical limits by any means.
    This tradition produced the likes of Bill Gates, Steve Wozniak and Mark Zuckerberg,
    who, on the eve of `Facebook`’s initial public offering in 2012, lamented the
    “unfairly negative connotation” of the word. Hacking, he wrote, “just means building
    something quickly or testing the boundaries of what can be done. Like most things,
    it can be used for good or bad.”


    The past couple of years will be remembered for the bad. Hardly a week passed
    without news of some kind of digital breach, somewhere in the world, often establishing
    some kind of record—for sheer scope, for novel tactics or for setting an ominous
    new precedent. Hackers broke into the U.S. Department of Justice, the Internal
    Revenue Service and likely the National Security Agency. They stole or tried to
    sell data from private companies including Adult FriendFinder, `LinkedIn`, `Mail.ru`
    and `Yahoo`. They leaked the confidential medical records of elite athletes Simone
    Biles and Serena and Venus Williams, the private photos of celebrities including
    comedian Leslie Jones and, along the way, the embarrassing password choices of
    a billionaire hacker named Zuckerberg. In 2017, breaches came to light at the
    U.S. Securities and Exchange Commission, `Equifax`, `Gmail` and `Verizon`, among
    others.

