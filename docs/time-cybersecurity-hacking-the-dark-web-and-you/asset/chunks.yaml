  raw: 'More important, WarGames caught the attention of Ronald Reagan. After watching
    the film at Camp David, the president asked his advisers to look into the possibility
    that someone could really hack into the nuclear arsenal. They quickly came back
    with an answer: Yes. In fact, the National Security Agency had already been hacking
    into the Soviet Union’s and China’s communications systems. It was only a matter
    of time until those countries began to do the same. That investigation eventually
    led Reagan to sign a national-security directive and Congress to pass the Computer
    Fraud Abuse Act, a sweeping anti-hacking bill still in effect today.


    Through the 1980s and ’90s, screenwriters and directors tried to replicate WarGames’s
    success at the box office. Whereas previous movies like 1982’s Tron depict hacking
    as something akin to playing a video game, later films try a modicum of realism.
    That has resulted in some risible flaws: in 1995’s Hackers, Angelina Jolie’s character
    taunts her enemies with a cartoon virus bunny, and in 1992’s Sneakers, Robert
    Redford’s character leads a crew of hackers who employ an unrealistic universal
    key that can break all cryptography. Both are beloved for trying, but hopelessly
    outdated now.


    Moviegoers, meanwhile, grew more sophisticated. So some directors decided to lean
    into the fantastical. In 1999’s The Matrix, a computer hacker (Keanu Reeves) stumbles
    into a group of rebels online who reveal that most people are living in a false
    world, created by a sentient machine. The conceit tapped into growing paranoia
    about the power of computers. It also cleverly set up real warfare as a stand-in
    for cyberwarfare: an avatar of Reeves’s Neo enters the alternate world, the Matrix,
    to practice his ninja-inspired moves on the baddies. Most viewers saw Neo as a
    warrior, not a computer nerd.


    Throughout the early 2000s, hacker characters were downgraded from hero to a staple
    of a team. They always came in handy in heists. They could make red lights turn
    green (The Italian Job, 2003) or create fake surveillance-camera footage (Ocean’s
    11, 2001). They also make great sidekicks. The hacker will tell you where the
    bad guy is headed (Spider-Man: Homecoming, 2017) or whether that baddie is in
    fact coming after you (24, beginning in 2001).


    More recently, the hacker has made a comeback as a protagonist. A few filmmakers
    have found a way to upend our stereotypes about hackers to create compelling new
    characters. The Social Network, released in 2010, brought hacking down to earth.
    In an early scene, Mark Zuckerberg (Jesse Eisenberg) creates—by hacking into Harvard’s
    student databases—a website called FaceSmash, where users can rate fellow students
    according to attractiveness. (He really did do that.) Hacking suddenly felt more
    real. Not just the tool for trying to take down governments, it was also a tool
    for trying to take down social hierarchies.


    Other works combined hacking with older genres. Steig Larsson’s novel The Girl
    with the Dragon Tattoo—and its two film adaptations—made the hacker cool. It marries
    classic noir with modern technology to make the hacker something akin to a detective,
    rather than a nerd typing from a basement. This publishing blockbuster picked
    up themes that had been explored by authors ranging from Neal Stephenson to Margaret
    Atwood.


    Then came the golden-age TV shows. In 2015 USA premiered Mr. Robot, a show about
    a group of Anonymous-like hackers who dub themselves F Society and endeavor to
    take down the evil conglomerate E Corp. Rather than spend most of the show trained
    on protagonist Elliot’s computer screen, creator Sam Esmail concentrates on the
    circumstances that forced Elliot (Rami Malek) to hack—a company keeping a secret,
    a world increasingly run by a few rich, powerful men. When it came time to show
    Elliot’s screen, Esmail asked his actors to learn basic coding and his production
    designers to put real code onscreen so that the actors could accurately react
    to the information that was sent and received. Mr. Robot has prided itself on
    its accuracy, even going so far as to make fun of films like Hackers in its episodes.


    Other shows, like the HBO comedy Silicon Valley, about a group of wannabe entrepreneurs,
    and Halt and Catch Fire—which takes place in “Silicon Prairie,” the 1980s Texas
    predecessor to today’s Silicon Valley—examine coding culture and, with it, practical
    hacking. The shows have earned critical acclaim by creating interesting characters
    that do more than clack away at a keyboard.


    Meanwhile, the hacker is back in movie theaters. In 2017’s Fate of the Furious,
    Charlize Theron’s villainous Cipher controls events on the ground by typing from
    a plane in the sky, including overriding cars’ navigation systems to send them
    driving in droves—and flying off five-story parking garages—to keep the police
    away from her target. Fate of the Furious grossed $1.2 billion at the international
    box office, a cold, hard sign that Hollywood has finally figured out the power
    of the hacker. If these hits are any indication of what’s to come, we can expect
    more tech-savvy heroes—and foes.


    ![image](images/WarGames_1983_11.png)


    WARGAMES, 1983


    THE EARLY YEARS WarGames doesn’t hold up very well for contemporary viewers, but
    its portrayal of the potential impact of even amateur hackers does. Books such
    as The Girl with the Dragon Tattoo, MaddAddam and The Shockwave Rider, along with
    many others throughout the years, explore various aspects of hacker culture and
    what it might produce in the highly connected digital future. They helped provide
    templates and scenarios for turning hackers into more complex characters than
    the way they are portrayed in Disney’s fantastical Tron and the more earnest,
    if flawed, Hackers from the mid-’90s, when the internet boom was just getting
    started.


    ![image](images/Tron.SIJA099_EC106.png)


    TRON, 1982


    ![image](images/_NEWourheritagemedia-original-be9f2d58ddb6b90e9533022a6f9e8750.png)


    THE SHOCKWAVE RIDER, 1975


    ![image](images/_NEW9780307454546.png)


    THE GIRL WITH THE DRAGON TATTOO, 2005


    ![image](images/_NEW9780307455482.png)


    MADDADDAM, 2013


    ![image](images/Hackers_1995_10.png)


    HACKERS, 1995


    ![image](images/Social_Network.MCDSONE_EC059.png)


    THE SOCIAL NETWORK, 2010


    GETTING CLOSER As the internet—and cybersecurity—became a more prevalent part
    of people’s everyday lives, film representations got better at portraying various
    types of hackers. The Matrix is a high-octane, visual-effects-laden adventure,
    but one based at least in part on real-world ideas. Films like The Social Network
    and Snowden depict hackers’ biographies, and franchises like Ocean’s employ them
    as reliable sidekicks to classic heroes to keep their plots freshly contemporary.


