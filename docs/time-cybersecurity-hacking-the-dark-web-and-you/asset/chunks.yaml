  trans: '


    在书面声明和公开评论中，FBI 官员引用了与“DarkSeoul”事件的相似之处、索尼恶意软件是在带有韩语设置的计算机上构建的证据、攻击的互联网跳板，以及——最引入胜的是——来自“敏感来源和方法”的情报。在福特兰大学的一次网络安全会议上，FBI
    局长科米表示，他对这一结论有“极高的信心”（《纽约时报》后来报道道，监视朝鲜的美国情报机构发现了其参与的证据）。


    然而，许多专家仍然不信服。他们指出，黑客很容易植入虚假线索。如果攻击者的目标真的是罗根的电影，为什么他们没有立即提到它？朝鲜人如何知道要泄露哪些数据？他们如何能熟练地穿梭索尼的网络？为什么在《采访记者》（The
    Interview）发布后他们保持了沉默？


    “这是一场群攻行为，”网络安全公司 `Cylance` 的首席执行官斯图亚特·麦克卢鲁说，“好吧，那是朝鲜，这个看起来像朝鲜，所以一定是朝鲜。’并没有客观证据。”


    此外，在爱德华·斯诺登揭露政府秘密收集数据之后，电子世界的居民们不倾向于相信政府的话。（FBI 拒绝公开其证据。）参加了科米演讲的福特兰大学法学教授、信息技术学者
    `约尔·瑞登伯格` 表示：“这有点像是‘相信我们吧，但我们不会让你们验证。’”


    ### 替代理论：内部人员理论


    正如估计约四分之一的网络攻击一样，索尼黑客事件是一场内部人员。这种观点最详尽的维护来自 `Norse` 公司，该公司在攻击前曾访问索尼推销其产品。`Norse`
    表示，其自己的调查涉及几位精通 IT 但心怀不满的被裁员索尼员工。12 月 29 日，`Norse` 高管抵达华盛顿 FBI 总部，在一场为期三小时的会议上阐述了他们的推理。此后，FBI
    发布了一份公开声明，坚称没有“可靠信息”可以指向朝鲜以外的任何人。


    ### 怀疑论与内部冲突


    在最初怀疑朝鲜是罪魁祸首的人中，包括艾米·帕斯卡（`Amy Pascal`），她不想相信自己支持的电影导致了如此破坏性的后果。1 月 21 日，她也私下与
    `Norse` 会了面，在洛杉矶的家中与丈夫坐在一起听取 `Stiansen` 详细介绍他的理论。`Pascal` 后来告诉一位访客，“在很长一段时间里，我认为是员工干的。”从那时起，`Pascal`
    告诉朋友不确定怎么想。`Norse` 官员表示，他们现在相信朝鲜在索索尼员工的“某些协助”下完成了攻击。


    对于 `Pascal` 来说，担任制片厂负责人一段时间以来一直并不愉快。但即使在被全世界阅读了她邮件的公开羞辱之后，她还没有准备放弃。在 12 月底从佛蒙特家庭旅行回来后，`Pascal`
    重新开始推动新合同，她曾告诉公司这将是她的最后一份合同。在过去的四年里，她赚了 4700 万美元，她想要一份同等的交易。从 6 月以来，她一直在与索尼谈判一项新协议。


    ### 艾米·帕斯卡的离职


    但林顿（`Lynton`）还没有准备好继续推进。毕竟，电影片单——`Pascal` 表现的最终衡量标准——在过去两年没有达到预期。还有另一个考虑。在 `Lynton`
    看来，黑客事件的影响似乎创伤了她。他告诉其他人，自从圣诞节以来，`Pascal` 很少出现在制片厂周围，这对每个人来说都是感性的时刻。对 `Lynton`
    来说，这种领导力的缺失不可挽回地损害了她在员工中的地位（`Pascal` 私下称这种说法是“胡说八道”）。


    因此在 1 月下旬，当 `Pascal` 要求给出最终答复时，`Lynton` 决定拒绝。他与平（`Hirai`）商量了这一变动。然后， 1 月 31 日星期六，他在家中会见了
    `Pascal`。`Lynton` 告诉她，他不会为她提供制片厂负责人的新合同。对她来说，成为索尼的大制片更好，这也是他们讨论过的选项。根据 `Pascal`
    的一位朋友说，她处于“震惊中”。


    `Pascal` 的离职于于下周四宣布。在新闻稿中，双方都将她的离职描述为她的决定。但几天后在旧金山的一次女性会议上，`Pascal` 直言不讳地宣布她是被“开除了”。尽管如此，她将享受到一个软着陆，帮助制作索尼的一些大片，包括《蜘蛛侠》。知情人士证实，取决于这些电影的表现，`Pascal`
    的薪酬包将在四年内给她提供 3000 万到 4000 万美元，外加她所创造利润的抽成。


    ### 财务影响与法律挑战


    《采访记者》创造了另一段历史。在 `VOD` 上点播几天且没有出现灾难性后果后，包括 `Apple`、`PlayStation` 在内的其他在线供应商开始提供它。到目前为止，它在
    `VOD` 上已带来超过 4000 万美元的收入，院线 1200 万美元，成为索尼历史上最大的数字销售产品。


    如果加上由于黑客攻击产生的支出，财务计算将更加严峻：根据公司说法，截至 3 月底，已有 4100 万美元。对于索尼这种规模的公司来说，这是一个可以承受的数字。但还有更多成本。除了调查攻击、IT
    维修和电影利润损失的费用外，索尼还面临诉讼，指责其网络安全不力导致员工的隐私信息泄露。七起案件已在洛杉矶联邦法院合并为一项拟议的集体诉讼。


    ### 未来安全策略


    在索尼努力修复其声誉时，它还承担了重建其被毁计算机网络的挑战，这次采取了一系列预防措施来抵御——真正抵御——下次攻击。索尼的“安全重建”策略预计需要一年时间，让制片厂缓慢恢复正常，同时堵补攻击者可以轻易利用的无数漏洞。


    该计划的前提是“零信任”。它实施了索尼此前不会考虑的预防措施，因为这些措施太不方便且太昂贵。它的目标是将坏人隔之门外，防止他们在进入后接触任何有价值的东西，并在他们进入时阻止他们偷取。


    为了安全地恢复运营，索尼首先建立了一个全新的“白色网络”，它与旧的“黑色网络”的潜在污染完全隔离。在开始，互联网访问受到了严格限制。索尼将在其活动网络上保留尽可能少的信息；其余部分将安全地存储、加密并切断网络连接。电子邮件将在几周后被存档。系统管理员将仅拥有其工作所需的区域。员工被禁止安装未预先批准的应用程序。

