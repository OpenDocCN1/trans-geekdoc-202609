    This book aims to equip you with an understanding of how to survive in the age
    of con artistry and connectivity. To be sure, methods of attack and defense are
    constantly evolving and adapting. Ware put it presciently in his futurist manifesto
    all those decades ago. “The computer will touch men everywhere and in every way,
    almost on a minute-to-minute basis,” he portended. “Every man will communicate
    through a computer whatever he does. It will change and reshape his life, modify
    his career, and force him to accept a life of continuous change.”


    Even amid that state of flux, we hope this book will reveal the eternal elements
    at stake in this ongoing battle for control, for influence, for supremacy. If
    any sufficiently advanced technology is indistinguishable from magic, as the sci-fi
    scion Arthur C. Clarke once wrote, then these pages meant to help draw the curtain
    on the sorcerers.


    # HACKING OUR LIVES


    ## Cyberattacks and breaches keep making news


    ![image](images/GettyImages-675452848.png)


    ### LE HACK

    Then-candidate Emmanuel Macron at a May rally. Days later, the U.S. NSA director
    Michael Rogers accused Russia of trying to tilt the French elections with targeted
    hacks. Macron’s political party said it had been the victim of “a massive, coordinated”
    hack, though it didn’t affect the outcome of the race.


    ![image](images/GettyImages-868719006.png)


    ### HOT SEAT

    Facebook general counsel Colin Stretch, Twitter acting general counsel Sean Edgett
    and Google law-enforcement and information-security director Richard Salgado testified
    before the Senate in October. At issue: revelations that Russian firms bought
    online ads to impact the U.S.’s 2016 election.


    ![image](images/shutterstock_editorial_9186009b_huge.png)


    ### FAKE NEWS

    Facebook and Instagram ads were linked to Russian efforts to disrupt the American
    political process by stirring up divisive social issues. The ads were released
    as social-media companies faced criticism on Capitol Hill about why they hadn’t
    done more to combat Russian interference.


    ![image](images/h_15025285.png)


    ### TROUBLE AT NSA

    Jake Williams, a former member of the National Security Agency’s hacking unit,
    was targeted by a group called the Shadow Brokers. A leak of the agency’s cyberweapons
    has damaged morale, slowed intelligence operations, and resulted in hacking attacks
    on businesses and civilians.


    ## The 6 Worst Kinds of Internet Bad Guys

    ### BY ERIKA FRY


    ![image](images/GettyImages-823248118.png)


    If the internet has one constant, it’s that somewhere, somehow, somebody is being
    hacked. Cyberassaults on financial institutions, multinational corporations and
    governments now routinely make headlines. Then there are the legions of attacks
    that go unreported. A 2017 Ponemon Institute survey found that the average cost
    of a U.S. data breach is $7.35 million and that one in four organizations will
    face an attack involving at least 10,000 records within the next two years. Security
    analysts say the first thing to know is just what types of threats are lurking
    in the shadows. While many hackers use relatively basic tools, such as phishing
    or malware, they wield them with different motives. Here are six of the most effective
    actors:


    ### 1. State-sponsored

    - **Who**: China, Iran, Israel, Russia, U.S.

    - **Objectives**: Intelligence, state secrets, sabotage

    - **Targets**: Foreign governments, terrorists, industry

    - **Signature**: Multitiered, precisely orchestrated attacks that breach computer
    systems

    - **Classic Case**: One fifth of Iran’s nuclear centrifuges crashed after `Stuxnet`,
    a worm reportedly developed by `U.S.` and Israeli intelligence, penetrated computers
    at an Iranian enrichment facility. Iran allegedly retaliated by disrupting access
    to the websites of `J.P. Morgan`, `PNC`, `Wells Fargo` and others.


    ### 2. Hacktivist

    - **Who**: Anonymous, AntiSec, LulzSec

    - **Objectives**: Righting perceived wrongs, publicity, protecting internet freedoms

    - **Targets**: Bullies, Scientologists, corporations, governments

    - **Signature**: Leaking sensitive information, public shaming, creepy YouTube
    videos

    - **Classic Case**: The websites of `PayPal`, `Visa` and `MasterCard` were disrupted
    during `Operation Payback`, an Anonymous-led effort to punish companies that suspended
    the accounts of `WikiLeaks` in 2010. Some $5.6 million was lost by `PayPal` alone.


    ### 3. Cyber-criminal

    - **Who**: Nigerian “princes,” carders, identity thieves, spammers

    - **Objective**: Treasure

    - **Targets**: The gullible, online shoppers, small businesses, data-rich

    - **Signature**: Stealing data

    - **Classic Case**: Malicious software that records keystrokes. Often the first
    step is a social-engineering attack is sending fake emails.


    ### 4. Insider (Also Known As: You)

    - **Who**: Disgruntled employees, whistleblowers

    - **Objectives**: Score-settling

    - **Targets**: Large companies, governments

    - **Signature**: Document theft

    - **Classic Case**: Maroochy Shire, an Australian district along the Sunshine
    Coast, was inundated with pumping stations.


    ### 5. Script Kiddie

    - **Who**: Bored youth

    - **Objectives**: Thrills, notoriety

    - **Targets**: Low-hanging fruit such as unprotected websites

    - **Signature**: Defacing or dismantling websites

    - **Classic Case**: An email subject I LOVE YOU duped people inside the Pentagon
    in 2001.


    ### 6. Vulnerability Broker

    - **Who**: Endgame, Netragard, Vupen

    - **Objective**: Hacking as legitimate business

    - **Targets**: Agnostic

    - **Signature**: Finding zero-day exploits

    - **Classic Case**: French firm `Vupen` hacked `Google’s Chrome` browser at a
    security conference in 2013. Rather than share its technique with the company
    (and accept a $60,000 award), `Vupen` sold the exploit to higher-paying customers.


    # Hacking, Glossary


    **black hat**: A hacker who hacks for personal gain and engages in illegal activities
    in the process. Often black hats sell information about security flaws they discover
    to the highest bidder.


    **crypto**: Short for “cryptography,” the science of keeping online communications
    secret.


    **Dark Web**: Websites that are not indexed by search engines like Google and
    can only be accessed covertly. The Dark Web is used by individuals who want their
    dealings to remain purely anonymous. Also known as the Deep Web.


    **DDoS**: Short for “distributed denial of service,” an increasingly popular type
    of attack that uses a large number of computers to cripple a website or online
    service.


    **infosec**: Short for “information security.” These are generally the people
    in charge of defending institutions against hacks.


    **jailbreak**: The practice of circumventing the security measures built into
    a gadget, such as a Sony PlayStation or Apple iPhone, to remove a manufacturer’s
    restrictions. Often the goal of jailbreaking a device is to enable it to run unauthorized
    software.


    **social engineering**: The practice of gaining access to a secure system by tricking
    insiders into giving away access. Often the first step in a social-engineering-driven
    attack is sending fake emails that appear to be very real, a practice called phishing.


    **warez**: Pirated software often distributed via technologies like BitTorrent
    and Usenet. Hackers can exploit people’s desire for free software by also distributing
    virses within their warez.

