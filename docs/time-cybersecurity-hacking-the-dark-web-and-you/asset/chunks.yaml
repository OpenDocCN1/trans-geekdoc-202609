    2014 年 11 月，黑客发布了大量来自索尼的敏感公司数据，其中包括高层高的个人信息、未上映电影的预告片以及尴尬的电子邮件。索尼的内部通信系统瘫痪，进一步限制了该公司的应对能力。这次攻击成了一大大新闻，部分是因为据报道黑客可能与北朝鲜政权有关，而且它发生在喜剧片《记者》（The
    Interview）发布之前，该片描述了一个针对北朝鲜领导人金正恩的暗杀计划。索尼黑客是手段复杂的攻击者，他们使用了多种方法绕过公司的防御。在事件发生后，一名声称参与了事件的人表示他获得了访问索尼公司电脑的物理权限。目前不清楚这是否真实还是仅仅是进一步的恐吓。但这一事件强调了个人和公司确保其设备物理安全的必要性。


    1. 使用强密码保护手机、平板电脑和笔记本电脑等设备。离开家或办公室时，请确保注销或锁定设备。

    2. 如果可以，使用你的“生物识别”安全功能，例如 iPhone 的 `TouchID` 指纹扫描仪。然而，请记住，这些某些功能已显示出弱性，意味着它们并非万无一失。

    3. 务必使用加密，这是几乎每台现代电脑和智能手机上都有的一种安全功能。加密可以在你的设备被盗的情况下显著增加黑客访问你敏感数据的难度。企业加密提供商 `Covata`
    的首席执行官 Trent Telford 这样描述加密数据：“从视觉上看，你只会看到一个由 1000 个无意义的字母组成的大区块。但当你解密时，你会发现里面隐藏着单词。”

    4. 在旅行时不要离开视你的设备，设备保险公司 `Protect Your Bubble` 的董事总经理 Stacey Vogler 说道。“一旦它脱离你的视线，可能会发生很多事情——比如损坏或被盗，”她说。

    5. 始终将你的智能手机和笔记本电脑放在身上或非常近的地方。把它想象成你的钱包。如果你晚上把任何设备留在办公室，将它们锁在抽屉里是个好主意，特别是如果你经常在很多人经常使用的开放区域工作。


    ## 恶意软件


    也被称为病毒——最初的软件缺陷仅被网络放大了


    ![image](img/GettyImages-608877599.png)


    2017 年 5 月，全球各地的医院、企业和机构不幸遭遇了一场被恰切命名为 `WannaCry` 的网络攻击。这种恶意的勒索软件在公开时已传播到 150 个国家的
    200,000 多台电脑。这种勒索软件源于微软`Windows`平台的一个漏洞，它通过加密受害者电脑的所有数据来锁定电脑，直到支付 300 美元的赎金。一旦你的系统被勒索软件感染，你几乎无能为力挽救它。但你可以采取一些预防措施，让你的电脑对恶意软件不那么敏感，并确保在发生攻击时你的所有信息都不会丢失。


    ### 安装软件更新


    软件更新对于保持电脑安全至关重要，因为它们通常包含了黑客本可以利用的漏洞修复。不这样做会让你的电脑暴露在病毒、恶意软件和其他类型的攻击之下。赛门铁（Symantec）安全响应技术总监
    Vikram Thakur 表示，“安装更新对于确保人们无法在未经许可的情况下在你的电脑上运行某些程序极其重要。”更新设备的方法取决于它运行的操作系统。`Windows
    10` 和 `MacOS` 会自动应用安全软件更新。


    ### 更新你的手机软件


    在 iPhone 上，打开`Settings`设置菜单，点击`General`通用选项并选择`Software Updates`软件更新。每个安卓手机型号的界面略有不同，但通常可以通过打开`Settings`设置菜单并导航到`About`关于部分来找到该选项。


    ### 备份你的数据


    如果你能够在其他地方访问重要文件，那么失去电脑的访问权限就不会那么严重。这就是为什么对工作相关文件、家庭照片和其他个人数据备份至关重要。`Google`、`Microsoft`、`Dropbox`
    和 `Apple` 等公司都提供了自己的云存储服务来这样做。你也可以选择在较大的外部硬盘上备份数据，例如 `SanDisk` 和 `Western Digital`销售的硬盘。


    ### 使用杀毒软件


    杀毒软件对于监控电脑的整体健康非常重要。`McAfee` 和 `Norton` 都提供了可以帮助防止病毒隐藏的产品。`McAfee` 的 `Total Protection`
    可用于各种设备。`Norton` 提供了类似的产品。


    ## 身份盗窃


    互联网最初的危险之一变得更加有害和普遍


    ![image](img/GettyImages-585628346.png)


    2017 年 9 月，消费者信誉报告机构 `Equifax` 宣布，去年夏天，黑客入侵了其网络并盗取了超过 1450 万美国人的个人信息——几乎是美国人口的一半。被盗数据包括人们的名字、出生日期、地址甚至是社会安全号码。较少的人（209,000
    人）的信用卡信息也被盗了。安全专家现在担心某些缓存数据正在网上出售。一些专家认为该事件是历史上最大的单次个人信息泄露。`Equifax` 为泄露受害者提供了免费的信誉监控和信用冻结。但该公司因公布该事件太晚而受到批评。同时，一些受影响的人感到愤怒，因为他们在选择使用“三大”信誉报告机构中的哪一个时选择有限。预计事件的影响将继续持续几个月，很可能是多年。


    1. 每周检查一次你的银行和信用卡账单。如果发现看起来不对，请致电你的银行或金融机构以获取更多信息。“这是定期检查在线银行和信用卡账单的第一原因，”`CreditCards.com`
    的高级行业分析师 Matt Schulz 说道。

    2. 也要密切关注你的信用分。如果身份盗窃者尝试用你的名义贷款或开信用卡，该活动将出现在信用报告上。

    3. 如果你怀疑自己是身份盗窃或欺诈的受害者，你可以在信用报告上设置欺诈警报或信用冻结。“`NerdWallet` 的个人财务作家兼认证理财师 Liz Weston
    说道，“信用冻结通常每个机构设置和移除费用为 3 美元到 10 美元。“如果你决定不冻结，你应该在三个机构的信用报告上都设置欺诈警报。”

    4. 如果你是身份盗窃或欺诈的受害者，你可以在当地派出部门报警案。由于黑客和身份盗窃者通常在海外工作，当地警察很少能对他们做什么。但创建书面记录可以帮助你与银行和其他金融机构合作纠正任何问题。

    5. 在范围巨大的 `Equifax`泄露事件中，公司网站可以帮助你确定自己是否受到影响。`Equifax` 还向泄露受害者提供免费的信誉监控。


    ## 广告


    在线广告不仅仅是分散注意力。它们内部还带有恶意软件


    ![image](img/GettyImages-486132971.png)


