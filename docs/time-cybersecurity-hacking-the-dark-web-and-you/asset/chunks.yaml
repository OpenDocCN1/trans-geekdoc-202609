    In a written statement and public comments, FBI officials cited similarities to
    the DarkSeoul episode, evidence that the Sony malware was constructed on computers
    with Korean language settings, internet staging points for the attack, and—most
    intriguingly—intelligence from “sensitive sources and methods.” At a Fordham University
    cybersecurity conference, FBI director Comey said he had “very high confidence”
    in this conclusion. (The New York Times later reported that U.S. intelligence,
    spying on North Korea, had found evidence of its role.)


    Yet many experts remain unconvinced. It is easy, they note, for hackers to plant
    false clues. If the attackers’ target was really Rogen’s movie, why didn’t they
    mention it right away? How would North Koreans know what data to leak? How could
    they so skillfully navigate Sony’s network? And why had they fallen silent after
    the release of `The Interview`?


    “It’s a dogpile,” says Stuart McClure, the CEO of cybersecurity firm `Cylance`.
    “ ‘Well, that one is North Korea, and this one looks like it, so it must be North
    Korea.’ There’s no objective evidence.”


    Moreover, in the wake of revelations of secret government data gathering revealed
    by Edward Snowden, denizens of the electronic world are disinclined to take the
    government at its word. (The FBI has declined to make its evidence public.) Says
    Fordham law professor `Joel Reidenberg`, an information technology scholar who
    attended Comey’s speech, “It was sort of ‘Trust us, but we’re not going to let
    you verify.’ ”


    ### Alternative Theories: The Inside Job Theory


    Like an estimated one quarter of cyberattacks, the Sony hack was an inside job.
    The most elaborate advocacy of this came from `Norse`, the firm that visited Sony
    to pitch its wares before the attack. `Norse` said its own investigation implicated
    a few bitter, laid-off Sony employees with IT savvy. On December 29, `Norse` executives
    arrived at FBI headquarters in Washington to lay out their reasoning in a three-hour
    meeting. Immediately afterward the FBI issued a public statement, insisting there
    was “no credible information” to implicate anyone but the North Koreans.


    ### Skepticism and Internal Conflict


    Among the initial skeptics that North Korea was to blame: `Amy Pascal`, who didn’t
    want to believe the film she backed had led to so much devastation. On January
    21, she met privately with `Norse` too, sitting down with her husband in their
    Los Angeles home to hear `Stiansen` detail his theories. `Pascal` later told a
    visitor that “for the longest time, I thought it was employees.” Since then, `Pascal`
    has told friends, she is uncertain what to think. `Norse` officials say they now
    believe North Koreans pulled off the attack with “some assistance” from former
    Sony employees.


    For `Pascal`, being studio chief hadn’t been much fun for a while. But she wasn’t
    ready to give it up, even after the public humiliation of having the world read
    her emails. After returning in late December from a family trip to Vermont, `Pascal`
    renewed her push for a new contract, which she’d told the company would be her
    last. She had made $47 million over the previous four years, and she wanted a
    comparable deal. She had been in negotiations with Sony for a new agreement since
    June.


    ### The Departure of Amy Pascal


    But `Lynton` wasn’t ready to move forward. After all, the film slate—the ultimate
    measure of `Pascal`’s performance—had’t met expectations for the past two years.
    And there was another consideration. As `Lynton` saw it, the events of the hack
    seemed to have traumatized her. `Pascal` hadn’t been visible around the studio
    much since Christmas, an emotional time for everyone, he told others. To `Lynton`,
    this lack of leadership had irreparably damaged her standing with employees. (`Pascal`
    has privately called this account “nonsense.”))


    So in late January, when `Pascal` demanded a final answer, `Lynton` decided it
    was no. He conferred with `Hirai` about the move. Then, on Saturday, January 31,
    he met with `Pascal` at her home. He wasn’t going to offer her a new contract
    as studio chief, `Lynton` told her. It would be better for her to become a big
    producer for Sony, an option they’d also been discussing. According to a `Pascal`
    friend, she was “shell-shocked.”


    `Pascal`’s departure was announced the following Thursday. In a press release
    both sides cast her departure as her decision. But at a women’s conference in
    San Francisco days later, `Pascal` bluntly declared that she’d been “fired.” Still,
    she’d enjoy a gentle landing, helping produce some of Sony’s biggest films, including
    `Spider-Man`. Depending on how they perform, insiders confirm, `Pascal`’s package
    will give her $30 million to $40 million over four years plus a percentage of
    the profits her generate.


    ### Financial Impact and Legal Challenges


    `The Interview` made one additional bit of history. After several days on `VOD`
    passed with no calamitous consequences, other online providers, including `Apple`,
    `PlayStation` began offering it. So far it has brought in more than $40 million
    on `VOD`, in addition to $12 million in theaters, making it Sony’s biggest digital
    seller ever.


    The financial calculus is grimmer if you add in out-of-pocket costs stemming from
    the hack: $41 million through the end of March, according to the company. That’s
    a bearable sum for a company of Sony’s size. But there are a lot more costs to
    come. In addition to expenses for investigation of the attack, IT repairs and
    lost movie profits, Sony faces litigation blaming it for poor cybersecurity that
    exposed employees’ private information. Seven cases have been consolidated into
    a proposed class action in Los Angeles federal court.


    ### Future Security Strategy


    As Sony struggles to repair its reputation, it has also undertaken the challenge
    of reconstructing its blitzed computer network, this time with an array of precautions
    to resist—really resist—the next assault. Sony’s “secure rebuild” strategy is
    expected to take a year, slowly returning the studio to normalcy while plugging
    the myriad weaknesses that its attackers so readily exploited.


    The plan’s premise is zero trust. It imposes precautions that Sony wouldn’t previously
    countenance because they were too inconvenient and expensive. It’s aimed at keeping
    bad guys out, preventing them from reaching anything valuable if they get in and
    blocking them from stealing it if they do.


    To resume operations safely, Sony began by building an entirely new “white network,”
    completely segregated from the potential contagion of its old “black network.”
    At the start, internet access was tightly restricted. Sony will keep as little
    information as possible on its active network; the rest will be stashed securely,
    encrypted and cut off from the internet. Emails will be archived after just a
    few weeks. System administrators will have access only to areas required for their
    jobs. Employees will be barred from installing applications that aren’t pre-approved.

