    更重要的是，《战争游戏》（`WarGames`）引起了罗纳德·里根的关注。在戴维营庄看完这部电影后，总统要求他的顾问研究是否真的有人能黑入核武器库库。他们很快给出了答案：肯定的。事实上，美国国家安全局已经对苏联和中国的通信系统进行了黑客入侵。这些国家开始做同样的事情只是时间问题。那次调查最终导致里根签署了一项国家安全指令，并使国会通过了《计算机欺诈滥用法》（`Computer
    Fraud Abuse Act`），这是一项至今生效的全面反黑客法案。


    在整个 20 世纪 80 年代和 90 年代，电影剧作家和导演试图复制《战争游戏》在票房的成功。早期的电影，如 1982 年的《电子幻战》（`Tron`）将黑客行为描绘类似于玩视频游戏，而后来的电影则尝试增加现实感。这导致了一些令人发笑的缺陷：在
    1995 年的《黑客帝国》（`Hackers`）中，安吉丽娜·乔莉的角色用一个卡通病毒兔嘲讽她的敌人；而在 1992 年的《偷天监控》（`Sneakers`）中，罗伯特·雷德福的角色带领着一支黑客团队，他们使用了一种可以破解所有加密术的不切实际万能钥匙。这两部电影虽然因为这种尝试而受到喜爱，但现在已完全过时。


    与此同时，电影观众变得越来越老练。因此，一些导演决定转向奇幻风格。在 1999 年的《黑矩阵》（`The Matrix`）中，一名电脑黑客（基努·里维斯 饰）在网络上偶然了一个反抗军组织，他们揭示了大多数人生活在一个由意识机器创造的虚假世界中。这种构想利用了对计算机力量日益增长的偏执。它还巧妙地将现实战争作为网络战争的代名词：里维斯饰演的角色“尼奥”（`Neo`）进入另一个世界“矩阵”（`Matrix`），在那里对反派练习他受忍者启发的动作。大多数观众将“尼奥”视为一个战士，而不是一个电脑宅。


    在整个 21 世纪 00 年代，黑客角色从英雄降级为团队的成员。他们在抢劫行动中总是大派用场。他们能让红灯变绿（《意大利大劫》，`The Italian Job`，2003）或制作伪造监控摄像头录像（《十一线谍》，`Ocean’s
    11`，2001）。他们也是极好的助手。黑客会告诉你坏人正要去哪里（《蜘蛛侠：英雄回归》，`Spider-Man: Homecoming`，2017），或者那个坏蛋是否真的在找你（《24
    小时》，始于 2001 年）。


    最近，黑客作为主角回归了。一些电影人找到了颠覆我们对黑客刻板印象的方法，创造了引人入胜的新角色。2010 发布的《社交网络》（`The Social Network`）让黑客变得接地气。在早期场景中，马克·扎克伯格（杰西·艾森伯格
    饰）通过黑入哈佛大学的学生数据库，创建了一个名为“脸书粉碎”（`FaceSmash`）的网站，用户可以根据吸引力对同学进行评分。（他确实这样做过。）黑客行为突然变得更加真实。它不仅是试图推翻政府的工具，也是试图推翻社会阶层的工具。


    其他作品将黑客与更老的类型相结合。斯蒂格·拉尔松的小说《龙纹身的女孩》（`The Girl with the Dragon Tattoo`）以及它的两部电影改编版让黑客变得酷炫。它将经典的黑色电影与现代技术相结合，使黑客变得类似于侦探，而不是一个在地下室里打字的书呆。这部出版界的畅销书涵盖了从尼尔·斯蒂芬森到玛格丽特·阿特伍德等作家探讨过的话题。


    接着是黄金时代的电视节目。2015 年，美国国家广播电台播出了《机器人总》（`Mr. Robot`），这是一部关于一群类匿名组织黑客的剧，他们自称为“F 社会”（`F
    Society`），并致力于击败邪恶的联合体“E 公司”（`E Corp`）。剧并没有把大部分时间花在主角艾利特（`Elliot`）的电脑屏幕上，而是创始人萨姆·埃斯梅尔关注迫使艾利特（拉米·马拉克
    饰）进行黑客行为的环境——一家保守秘密的公司，一个日益由少数富有权势的人统治的世界。当需要展示艾利特的屏幕时，埃斯梅尔要求演员学习基础代码，并让美术设计在屏幕上放置真实的代码，以便演员能够对发送和接收的信息做出准确反应。《机器人总》以其准确性为傲，甚至在剧集中嘲讽了像《黑客帝国》（`Hackers`）这样的电影。


    其他节目，如 HBO 的喜剧剧《硅谷》（`Silicon Valley`）——关于一群渴望成为创业者的人，以及《燃点风暴》（`Halt and Catch
    Fire`）——故事发生在“硅谷草原”（80 年代的德克萨斯州，是今日硅谷的前身），审视了编程文化以及随之而来的实战黑客行为。这些节目通过创造不仅仅是敲击键盘的有趣角色，赢得了评论界的好评。


    与此同时，黑客又回到了电影院。在 2017 年的《速度与激情 7》（`Fate of the Furious`）中，查理兹·塞隆饰演的反派西西（`Cipher`）通过在天上的飞机上打字来控制地面事件，包括覆盖汽车的导航系统让它们成群结队地行驶——甚至冲出五楼高的停车场——以此让警察远离她的目标。《速度与激情
    7》在国际票房上狂揽 12 亿美元，这是一个冷酷而现实的信号，表明好莱坞终于掌握了黑客的力量。如果这些热门影片预示了未来，我们可以期待看到更多精通技术的英雄——以及反派。


    ![image](img/WarGames_1983_11.png)


    1983 年《战争游戏》


    ### 早期

    《战争游戏》对于当代观众来说并不好懂，但它对甚至是业余黑客潜在影响的描绘却依然如此。像《龙纹身的女孩》（`The Girl with the Dragon
    Tattoo`）、《新设定》（`MaddAddam`）和《冲击波行者》（`The Shockwave Rider`）等书籍，以及多年来的许多其他作品，探索了黑客文化的各个方面以及它在高度连接的未来可能产生的结果。这些作品为黑客提供了模板，就像
    1982 年的《电子幻战》（`Tron`）和 90 年代中期虽然完美的《黑客帝国》（`Hackers`）中呈现的那样。


    ![image](img/Tron.MSDEL_EC08.png)


    《电子幻战》，1982


    ![image](img/be985d6b9022.png)


    《冲击波行者》，1975


    ![image](img/_NEW97803075446.png)


    《龙纹身的女孩》，2005


    ![image](img/_NEW97803075542.png)


    《新设定》，2013


    ![image](img/Hackers_1995_10.png)


    《黑客帝国》，1995


    ![image](img/Social_Network.MCDSON_EC59.png)


    《社交网络》，2010


    ### 越来越近

    随着互联网以及网络安全成为人们生活中更普遍的一部分，电影在描绘不同类型的黑客方面变得更好。《黑矩阵》（`The Matrix`）是一部高节奏、视觉特效丰富的冒险片，但至少部分基于现实的想法。像《社交网络》（`The
    Social Network`）和《斯登》（`Snowden`）这样的电影描述了黑客的传记，而像《十一线谍》（`Ocean’s`）这样的系列电影将他们作为可靠的助手，以保持剧情的新鲜感。


    ![image](img/MatrixMSDEL_EC08.png)


    《黑矩阵》，1999


    ![image](img/Snowden_2016_11.png)


    《斯登》，2016


    ![image](img/Oceans11_MSDEL_EC008.png)


    《十一线谍》，2001


    ![image](img/SiliconValley_S1_15.png)


    《硅谷》，2014


    ### 黄金时代电视

    最近，黑客在电视上得到了广泛实现。除了美国广播电台色彩较重的《机器人总》（`Mr. Robot`），HBO 的《硅谷》（`Silicon Valley`）——关于一群笨书呆的搞笑喜剧——展示了轻松的一面。


