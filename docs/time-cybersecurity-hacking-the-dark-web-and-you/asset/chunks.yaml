    “I never thought this kind of violation was happening to everyday people,” says
    Jacobs, who originally sent the photos to someone she knew and trusted. “I didn’t
    realize there was a market for naked photos of people nobody knows.”


    Jacobs says she was diagnosed with depression and PTSD, and became afraid to meet
    new people for fear that they would find the photos. “It was a living nightmare,”
    she says. “I kept being rejected by police, the attorneys, the FBI because they
    kept saying there was nothing they could do.”


    Now in her 30s, Jacobs ended up legally changing her name to escape her online
    footprint. But she also decided to fight back. She started `CCRI`, a nonprofit
    devoted to helping victims of nonconsensual porn reclaim their identities. Since
    she launched the help line in 2014, more than 5,000 victims have called `CCRI`,
    Jacobs says, adding that the group now gets between 150 and 200 calls a month.
    “The intent of the perpetrator is irrelevant, really. Whether he’s doing it for
    jollies or money, it’s destroying another person’s life.”


    Many victims think the moment they see their nude photos online is the worst part
    of their ordeal. Then they start having awkward conversations with bosses, fielding
    relatives’ questions about obscene social-media posts and getting strange looks
    from co-workers. It becomes impossible to know who has seen your photos, and what
    they think of you if they have. And when these victims start trying to get the
    pictures taken down, they realize something even worse: this type of violation
    can leave a lasting digital stain that is nearly impossible to fully erase.


    “Once the images and videos have been exposed or published, the internet is permanent,”
    says Reg Harnish, the CEO of cyber-risk-assessment firm `GreyCastle Security`,
    who worked with Kara Jefts to successfully remove most of her photos. But even
    if you get an image scrubbed from one site, there’s no way to guarantee it hasn’t
    been copied, screenshotted or stored in a cache somewhere. “There are literally
    hundreds of things working against an individual working to remove a specific
    piece of content from the internet,” he says. “It’s almost impossible.”


    With the law-enforcement response in flux, tech companies have begun responding
    to growing pressure to help address the problem. Under the `1996 Communications
    Decency Act`, platforms like `Google` and `Facebook` aren’t liable for the content
    they host, which means they can’t be held legally responsible for the nonconsensual
    porn on their networks. But after an outpouring of user requests, several major
    websites have developed new policies to help fight revenge porn. In 2015, streaming
    porn site `Pornhub` made it easier for victims to request that nonconsensual content
    be removed from its site, and `Google` agreed to remove complainants’ images from
    its search results. `Twitter` and `Reddit` have also updated their rules to prohibit
    nonconsensual porn. In April 2017, `Facebook` unveiled a tool enabling users to
    flag content they think is being shared without consent; company technicians then
    check if it’s appeared anywhere else on the network to prevent it from spreading
    further. But this kind of approach requires significant manpower, since nonconsensual
    porn is difficult to identify. Unlike child pornography, which can often be spotted
    on sight, an image posted without consent doesn’t necessarily look different than
    one posted willingly.


    The problem is confounding on almost every level: personal, legal and technical.
    And as lawyers sue and lawmakers debate, millions of pictures are still out there
    circulating, multiplying, waiting to ruin a life.


