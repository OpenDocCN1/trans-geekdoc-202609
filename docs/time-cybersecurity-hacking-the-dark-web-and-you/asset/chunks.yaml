    Many in Washington are troubled that it took so much time and effort just to close
    one illegal website run by a would-be Walter White. The `FBI` is policing an ever-evolving
    internet using static, often outdated laws. The `Communications Assistance for
    Law Enforcement Act`, which governs law enforcement’s warrant process and is known
    as `CALEA`, was passed in 1994.


    Even leaving aside specialized tools like `Tor`, there are plenty of mainstream
    technologies that criminals can use to hide their activities, ranging from satellite
    phones to `Apple iMessage`. Encrypted-messaging services `Facebook Messenger`
    and `WhatsApp` (also owned by `Facebook`) each boasted 1.3 billion monthly active
    users in mid-2017, making them two of the most popular mobile apps globally. But
    lagging regulation has led to disputes between tech companies promising user privacy
    and law enforcement hoping to chase criminals.


    Following the December 2015 terror attack in San Bernardino, Calif., which killed
    14 people, `Apple` firmly objected when the `FBI` asked it to unlock the suspect’s
    encrypted `iPhone`. In the end, the `FBI` dropped its request, instead enlisting
    outside pros to hack the device. Also in 2015, `Arkansas` police asked `Amazon`
    to help them access data from an `Echo` smart speaker they believed might hold
    evidence in a potential murder investigation. `Amazon` resisted until the suspect
    gave his permission. The homicide case was ultimately dropped.


    Lawmakers in the `Trump` era have yet to set a clearer road map. The president
    signed a bill in April 2017 that repealed `Federal Communications Commission`
    rules requiring broadband companies to obtain permission from customers to collect
    and share sensitive data like browsing information. `FCC` chairman `Ajit Pai`
    has controversially claimed that his plan to reverse the current policy of net
    neutrality—the concept that all internet data be treated equally by internet service
    providers—will “put the federal government’s most experienced privacy cop, the
    `FTC` [`Federal Trade Commission`], back on the beat to protect consumers’ online
    privacy.” And in 2018, the `U.S. Supreme Court` will likely rule on a `Fourth
    Amendment` case hinging on mobile-phone geolocation privacy.


    The incarceration of `Ross Ulbricht` started a wave of arrests of suspected `Deep
    Web` dealers. Later in 2013, police in Sweden arrested two men on charges of selling
    pot through `Silk Road`, and four more men were picked up in the `U.K.` the same
    day on drug charges. “These arrests send a clear message to criminals,” `Keith
    Bristow`, the former head of Britain’s `National Crime Agency`, told `TIME` in
    2013. “The hidden internet isn’t hidden, and your anonymous activity isn’t anonymous.
    We know where you are, what you are doing, and we will catch you.”


    It’s not completely clear that that’s true. One of the documents leaked by `Edward
    Snowden`, the former `CIA` employee who leaked information about the `National
    Security Agency`’s global surveillance practices, was an `NSA` presentation dated
    June 2012 titled “`Tor Stinks`.” It describes the difficulties the `NSA` had cracking
    `Tor`, and it says definitively, “we will never be able to de-anonymize all `Tor`
    users all the time.” The Deep Web` template that `Ulbricht` created remains technically
    sound. As one former `Silk Road` user puts it, “The dust has settled and everyone
    is kind of like ‘Oh, well, time to order some more drugs.’ We all knew it was
    coming.” Shortly after `Silk Road`’s demise, a reconstituted site known as `Silk
    Road 2.0`, based on a backed-up version of the old site, was launched. In November
    2014, it was abruptly shut down again by law enforcement.


    `Tor` itself is left in the curious position of being funded by some parts of
    the federal government (including the `State Department` and the `Department of
    Defense`) while others (the `FBI` and the `NSA`) are trying to crack it. But even
    law-enforcement officials directly involved with the case hasten to clarify that
    they don’t blame the technology itself for `Silk Road`. “There’s nothing inherently
    wrong with anonymity on the internet,” `Bharara` told `TIME` in 2013. “There’s
    nothing inherently wrong with certain kinds of currency, like `Bitcoins`. Just
    like there’s nothing inherently wrong with cash. But it happens to be the case
    that ... it’s also the thing that allows the drug trade to flourish. It allows
    money laundering to happen. It allows murder for hire to happen.”


    What’s certain is that the need for `Tor`—or something like it—isn’t going away.
    The internet is becoming an increasingly unprivate place where multibillion-dollar
    business plans are being built on companies’ ability to observe and rapaciously
    harvest every last iota and fillip of consumer behavior. More and more, it falls
    to consumers themselves to say where the line is.

