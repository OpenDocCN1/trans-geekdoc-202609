    ## WHERE DOES THE INTERNET LIVE?


    The answer to that question may not quite be “everywhere”—for now. A big part
    of the answer is data centers, or “server farms,” like this one operated by `Google`.
    These massive complexes of computers have increased in number along with the world’s
    demand for information. According to analysts at the industry-research firm `IDC`,
    global data-center space will only continue to swell, growing from 1.58 billion
    square feet in 2013 to 1.94 billion in 2018.


