    that targets a specific individual or small group of individuals.) Spearphishing
    often comes in the form of a work email that appears to be from an employee’s
    manager or other supervisor but is in fact a fake from a hacker. Companies worldwide
    are now training employees to spot such attempts.


    1. Hackers can make messages look like they are coming from somebody you trust,
    so do not open any attachments or click on any links in your email without first
    verifying the true identity of the sender. One way to do that: call the person
    sending you something and double-check that it’s actually from him or her.


    2. Activate “two-factor authentication” on your apps and other services, and encourage
    your IT department to make that a standard practice across the company. With two-factor
    authentication, you’ll need a memorized password in addition to a code generated
    by an app on your smartphone to log in to various services. That means it’s harder
    for hackers to access your workplace software even if they get your password.


    3. Change your passwords at least once a month. Yes, it’s a pain to memorize new
    passwords. You can use a password manager like LastPass or 1Password to keep track
    of your various passwords.


    4. Report any suspicious emails to your IT department. Calling out spearphishing
    attempts can often help in figuring out how to keep them out of your inbox in
    the first place.


    5. Avoid using USB drives whenever possible. USB drives are a common way to share
    large files around an office, but hackers can load them up with secret software
    that can give them access to your company’s networks. Instead, use cloud-based
    platforms like Dropbox to transmit large files from cubicle to cubicle.


    At Home


