    They’re a nuisance for sure, but also a necessary first line of digital defense.


    ![image](images/GettyImages-623213400.png)


    In 2017, Yahoo revealed that all of its approximately 3 billion user accounts
    were affected by a previously disclosed data breach that took place in 2013. The
    compromised data may have included email addresses, passwords, birth dates and
    phone numbers. It’s one of the largest cybersecurity breaches ever, but Yahoo
    is far from being the only large-scale business to be victimized by hackers. Myspace
    also confirmed in 2016 that it had suffered an attack that resulted in 360 million
    login credentials being leaked. While the steps here may not prevent your password
    from falling into the wrong hands, they can certainly help mitigate the potential
    damage.


    ## Change your password regularly


    Changing your password often can make it more difficult for hackers to obtain
    valid login credentials. This is an especially important first step if you believe
    your information may have been stolen or compromised. But be careful to avoid
    the common pitfall of reusing old passwords or words and phrases that are similar
    to your previous passcodes. Doing so just makes it easier for hackers to guess
    it, particularly if they have knowledge of your previous passwords.


    ## Create strong passwords


    It may be tempting to come up with a password that’s easy to remember, but these
    are also often the easiest for criminals and computer algorithms to guess. Make
    your passwords long, and try to include a mix of special characters, numbers,
    and capital and lowercase letters. Avoid using common phrases.


    ## Use a password manager


    Using a password manager like `1Password` or `LastPass` makes the argument for
    creating complex passwords even stronger. These apps store your passwords and
    autofill them for you so that you don’t have to remember your login credentials.
    `1Password` and `LastPass`, for example, use encryption to guard this data. And
    you can only access them using the master password you’ve created.


    ## Set up two-factor authentication


    Many digital services, including social-media platforms, email providers and online
    banks, offer multifactor authentication. This essentially adds a second step (hence
    the second “factor”) to the login process after typing in your password. It also
    makes it impossible to access your account with your password alone. Most platforms
    offer several different options for two-factor authentication, such as sending
    a code via email or text message or through a phone call. If you receive text
    messages or email on a wide variety of devices, it may be more prudent, if a little
    more time-consuming, to opt for the phone call.


    ## Checklist


    Tear out this handy guide and follow it closely, especially if you’re just getting
    started online.


    ![image](images/GettyImages-586715692.png)


    1. **Use complex passwords**

    Using “12345” as a password is like locking up your bike with dental floss. `LastPass`
    and `1Password` can help generate secure passwords.

    2. **Change your passwords frequently**

    Changing your passwords regularly, like every month or even every week, can help
    keep hackers from accessing your account if they happen to get their hands on
    an old password of yours.

    3. **Use two-step authentication**

    Make sure to activate it on any website or app that offers it, and consider it
    a secondary wall in your digital fortress.

    4. **Avoid public Wi-Fi networks**

    If you cannot avoid public Wi-Fi networks, it’s good to use a Virtual Private
    Network, or `VPN`, to keep your internet use away from prying eyes.

    5. **Beware suspicious emails**

    Many email providers have become very good at detecting and filtering out suspicious
    emails before they ever appear in your inbox. But some malicious emails can still
    make it through to you. So be judicious.

    6. **Update your devices**

    Most gadget makers spend a good deal of time patching flaws. For you to get them,
    though, you have to make sure your software is up to date.

    7. **Use virus protection**

    `McAfee` and `Norton` both offer top-of-the-line virus-protection solutions, with
    a range of subscriptions, features and prices depending on your needs. There are
    very good free options as well, including `Avast` and `Bitdefender`.

    8. **Back up your data**

    The simplest way to back up your data is with an external hard drive and the included
    backup software on your `Windows` or `Apple` computer. There are also several
    online subscription services that let you back up your computer to far-flung servers,
    which will ensure that you have a backup in case of a house fire or other disaster.

    9. **Tape up your laptop’s camera**

    The idea of a hacker hijacking your computer’s camera to secretly record embarrassing
    footage of you sounds like the stuff of dystopian science fiction, but it can’t
    hurt to be proactive about the possibility. A bit of gaffer tape does the trick
    nicely, and it’s easy to remove when you need to hop on `FaceTime` with your kids.
    Alternatively, make sure to keep your laptop lid closed when you’re not using
    it.

    10. **Keep your devices physically secure**

    Never leave your computer alone in public. It’s also wise to keep your work computer
    secured in a locked drawer. You should steer clear of `USB` drives of unknown
    origin. For added security, you can set your computer to require your password
    every time it is turned on, as well as every time you wake it from sleep mode.


    —Lisa Eadicicco and Alex Fitzpatrick


    ## Heroes or Villains? Hollywood’s Still Figuring It Out


    Entertainment’s long, strange effort to understand and portray the hacker BY ELIANA
    DOCKTERMAN


    ![image](images/NUP_178052_1118.png)


    `Mr. Robot`, 2015 `USA`’s take on hackers not only premiered at the perfect time—as
    major hacks started making headlines—it won plaudits for its accurate portrayal
    of what they can and can’t really do.


    The hacker is an appealing villain. Unless the good guys stop him (or her), the
    hacker can launch a nuclear missile or blackmail the president. A hacker also
    holds potential as a hero. He could just as easily stumble across a government
    conspiracy or take down an evil corporation. Since the 1980s, screenwriters have
    been trying to figure it out—sometimes more aptly than others. The question is,
    why has Hollywood had such a mixed track record bringing computer geniuses to
    life onscreen?


    For one thing, watching people grimace as they type code is not particularly compelling,
    and directors have long struggled with how to make the subtle weapon of the keyboard
    as exciting as, say, a sword or a laser beam. A biopic in which `Edward Snowden`
    reads through `NSA` files is just never going to be quite as exciting as `Indiana
    Jones` exploring a hidden tomb or `Wonder Woman` fighting German soldiers in hand-to-hand
    combat. To make such scenes more tactile, some filmmakers have created psychedelic
    rooms full of binary numbers or singing viruses, and in doing so found themselves
    the target of ridicule by real-life hackers, not to mention pretty much everybody
    who’s ever used a computer.


    But over the years, film and television portrayals of hackers have slowly improved—and
    even had a real-world impact. Take the 1983 film `WarGames`. Best known as `Matthew
    Broderick`’s breakout movie, it is also arguably the first blockbuster film about
    a hacker. `Broderick` plays a nerdy high schooler who accidentally hacks into
    the North American Aerospace Defense Command (`NORAD`) and almost sets off a nuclear
    war. `WarGames` established a compelling rubric for a successful hacking film:
    the computer stuff is a means to an end. Once `Broderick`’s character realizes
    what he’s done, he tries to stop the launch by talking to real, live people, rather
    than just typing away. It also helps that the computer program in charge of launching
    the missiles oddly has a personality. (Broderick’s character sets up a speaker
    so he can “talk” to this program, a big conceptual leap at the time that’s now
    pretty commonplace.) The film was a hit, the fifth-highest-grossing of that year.

