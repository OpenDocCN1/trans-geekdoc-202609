    人们明显渴望逃避侵入性在线广告的骚扰。根据监控在线广告网站 `PageFair`的数据，广告拦截插件（将网页广告替换为空白的小型软件）在全球范围内的普及率在
    2016 年增长了 30%。谷歌也在 2018 年的`Chrome`浏览器中增加了一个项争议的新功能，将自动拦截不符合特定标准的广告（例如带有声音的自动播放视频广告和弹出广告）。在互联网上保持完全隐私可能意味着根本不上网。但最近出现了一系列技术，可以帮助你至少维持一些隐私。


    ## 安装广告拦截器


    这些浏览器插件（如 `uBlock Origin`）可以阻止广告识别并追踪你。网络安全专家还建议安装禁用 `cookies` 的工具，它们存储了有关用户的信息，以使某些网站的使用更加顺畅。`Privacy
    Badger` 就是由电子前线基金会（Electronic Frontier Foundation）推出的示例，该组织是一个旨在保护用户数字权利的国际非营利组织。


    ## 考虑临时信用卡


    如果你对在线广告的内容感兴趣，点击它并没有错。通过在线广告购买东西也没有错。如果你经常通过这种方式进行在线购物，一种保护自己的可靠方法是考虑获取临时卡进行购买。许多银行和像
    `Privacy` 这样的第三方公司都提供创建具有短有效期的虚拟在线卡的选项。这些卡与你的实际信用卡绑定，但具有不同的号码、安全代码和有效期。它们还有由你自己设置的虚拟额度。


    ## 不要告诉他们你在哪里


    不可否认的是，广告已经变得越来越复杂，能够根据消费者实际居住和工作的地方进行投放。检查你的 `Facebook`、`LinkedIn`、`Twitter`
    以及其他社交媒体网站上的隐私设置，寻找如位置设置之类的选项并将其关闭。在你的智能设备上，如果不使用，也请关闭 `GPS`、`Wi-Fi` 和 `蓝牙` 连接。在手机的
    `Settings` 部分，你还可以根据应用程序切换位置设置，为那些绝对不需要该功能的应用关闭它。


    ## 使用无痕模式


    这种模式可以限制广告收集关于你的信息，并且不会存储你的浏览历史。在谷歌的 `Chrome` 浏览器上，使用 `File > New Incognito Window`；在苹果的
    `Safari` 上，使用 `File > New Private Window` 来启动该功能。


    ## 在公司


    仅仅是员工就可能让你成为虚假信息和操纵性目标


    ![image](img/GettyImages-693176958.png)


    全球最大的银行之一 `JPMorgan Chase` 在 2014 年透露，黑客曾入侵了其网络，并获取了至少 7600 万户家庭消费者的姓名、地址、电话号码和电子邮件地址。该银行当时表示，“没有证据”表明任何账户信息在这次攻击中遭到泄露，但这次攻击仍被认为是对美国公司以来最严重的攻击之一。后来被发现，同一批黑客还针对了其他几家金融公司，包括
    `E-Trade` 和 `Scottrade`。黑客使用的技术中包括：“鱼叉式钓鱼”，即欺骗公司员工交出登录信息。（该技术之所以这样命名，是因为它是针对特定个人或小群体的钓鱼尝试。）鱼叉式钓鱼通常以看似伪装成员工的工作邮件的形式出现。


    1. 激活双重身份验证。

    2. 报告任何可疑邮件。

    3. 修改你的密码。

    4. 删除你的录音。

    5. 避免使用 USB 盘。


    ## 在家里


    越来越多的人在家里充满了智能设备


    ![image](img/GettyImages-547054296.png)


    现在从电视到扬声器的一切设备都具备监听能力，维护隐私可能比任何时候都更加困难。随着更多设备的连接，这个问题在未来几年可能只会增加。电视制造商 `Vizio`
    在今年早些时候支付了 220 万美元和解了一项指控该公司收集数据的诉讼。诉状称，某些追溯到 2014 年的 `Vizio` 电视默认开启了软件，该软件会监控用户观看的内容。


    ### 遮住笔记本电脑摄像头


    遮住电脑摄像头可能无法阻止黑客接管它，但有助于确保他们无法获得可以对付你的私人视频。黑客可以通过一种被称为公司远程管理工具`（`RAT`）的软件访问你的网络摄像头及更多内容。即使是
    `Facebook` 首席执行官 `Mark Zuckerberg` 也给他的笔记本摄像头贴上了胶带。


    ### 关闭某些电视功能


    虽然将智能电视断开网络连接是确保敏感数据不被传输的最佳方法，但这样做会显著限制其功能。一些电视制造商允许你禁用特定的数据收集功能。例如，在 `Vizio`
    电视上，导航到 `Menu > System > Reset & Admin > Viewing Data` 并将其切换到“off”即可解决。


    ### 关闭语音识别


    包含 `Google Assistant` 的较新安卓机型以及支持苹果 `Hey Siri` 功能的 iPhone 会监听触发词，以便在无需按键的情况下回答问题并满足请求。如果这让你感到不舒服，可以通过长按
    `Google Pixel 2` 的主键，点击看起来像三个点的图标，并选择 `Settings` 来关闭 `Google Assistant` 的此功能。在
    iPhone 上，前往 `Settings > Siri & Search > Listen for “Hey Siri.”。


    ### 删除你的 Amazon Echo 录音


    如果你拥有一个 `Amazon Echo` 扬声器，很可能你已经接受了设备监听你对话的概念。亚马逊存储语音日志是为了更好地适应你的偏好。然而，你可以通过 `Alexa`
    应用进入 `Settings > History` 来删除你的语音请求历史。从那里，你可以点击录音进行删除。你也可以通过访问 `Amazon Content
    and Devices` 网站，点击 `Your Devices` 标签，选择你的设备，然后选择 `manage your voice recordings`
    进行操作。


