    如果实施，这将代表索尼在网络安全领域迈出了一大步。这足以防止另一场灾难吗？网络专家路易斯（Lewis）认为，这个问题问错了。“把它看作风险的连续体，”他说，“如果你什么都不做，风险就是
    100%。或者，你可以做很多工作，将风险降低到`10% to 15%`。”去年，公司的风险更接近 100%，而现在正向更低的水平下降。这是不可否认的进步。现在，索尼要做的就是找到一种停止挑衅黑客——以及报复性独裁者的方法。


    ![image](img/SON07_Q.png)


    ### 严厉警告

    上方是索尼影视公司员工在 2014 年 11 月 24 日登录电脑时看到的屏幕。这次黑客攻击盗取了大量的文档和电子邮件，并删除了公司半数电脑和服务器上的所有数据。


    ![image](img/SON07_A.png)


    ### 奇特组合

    索尼影视公司首席执行官迈克尔·林顿（Michael Lynton）和制片人主管艾米·帕斯卡尔（Amy Pascal）于 2010 年在索尼片场合影，他们性格上完全对立，但在十年里保持着高效合作。


    ![image](img/SON07_D.png)


    ### 挑衅者

    从左到右：演员詹姆斯·弗兰科（James Franco）、联合导演范·戈德伯格（Evan Goldberg），以及联合导演兼演员塞斯·罗根（Seth Rogen），他们位于《戏肉记者》片场。


    ![image](img/SON07_E.png)


    ### 谨慎行事

    2014 年春天，索尼公司首席执行官平井雄（Kazuo Hirai，见上）对《戏肉记者》对日与朝鲜之间已经紧张的关系的影响表示了担忧。


    ![image](img/SON07_C.png)


    ### 侮辱喜剧

    在《戏肉记者》中，詹姆斯·弗兰科（左）扮演一名受 CIA 雇佣的笨拙记者，负责刺杀金正恩（由兰达尔·帕克（Randall Park，右）饰演）。


    如今，索尼依然是一个巨头，拥有 `128,400` 名员工，在截至 2017 年 3 月结束的财年收入为 `$67.9B`。但在过去的九个财年中，索尼已经损失了
    `$7.6B`。


    # 第四章

    ## 如何保护你自己


    对于政府或大型企业，更不用说个人了，网络安全可能是一个令人困惑的概念。本分步指南将帮助你防范骗子、黑客和病毒。


    ■ 免费 Wi-Fi ■ 网络钓鱼 ■ 设备与小用工具 ■ 恶意软件 ■ 身份盗用 ■ 广告 ■ 在职场中 ■ 在家中 ■ 密码 ■ 检查清单


    ![image](img/chap_four.png)


    ### 免费 Wi-Fi

    当你的手机或电脑连接到公共无线网络时，如何防止入侵者进入


    ![image](img/GettyImages-849664230.png)


    2017 年 10 月，研究人员发现几乎所有支持 Wi-Fi 的设备都存在一个重大安全漏洞。这种被称为 `KRACK` 的漏洞允许黑客绕过流行的 Wi-Fi
    安全功能，并查看本应加密的网络上的 Web 流量。他们可以访问人们通过 Wi-Fi 网络传输的各种敏感信息，如密码和银行账户信息。Wi-Fi 设备制造商几乎立即开始发布补丁来解决这一问题，但许多旧的
    Wi-Fi 设备不再接收此类更新，导致它们处于易受攻击状态。`KRACK` 攻击强调了使用公共 Wi-Fi 的潜在危险。虽然不太可能有黑客徘伏在你的家庭网络中，但已知他们会在咖啡馆和机场安营，寄图入侵连接到那里的智能手机和电脑。要判断免费
    Wi-Fi 网络上是否存在黑客几乎是不可能的，这使得问题变得更加严重。


    [content]


    1. **确保你连接到了正确的网络。** 假设仅仅因为网络与地点名称相同就连接到相应的网络可能是一个巨大的错误。例如，如果你在咖啡店或商店里，请员工核实其特定
    Wi-Fi 网络的名称。这将让你避免连接到黑客设置的“欺骗性”或假网络。

    2. **仅连接到受密码保护的 Wi-Fi 网络。** 你可以通过名称旁边的锁图标识别它们。你通常可以从咖啡师或其他员工那里获得密码。当然，无法保证黑客没有拥有该密码，但它比完全开放的网络要好。

    3. **坚持访问在 WWW 地址之前带有“HTTPS”的网站。** `HTTPS` 是一种安全协议，有助于保护你发送到特定网站的信息。

    4. **使用虚拟专用网络，或称 VPN。** `VPN` 服务将帮助加密你在设备和互联网之间发送的所有数据，无论 Wi-Fi 网络是否受保护。是如此。许多
    `VPN` 服务——如 `PureVPN` 和 `KeepSolid VPN Unlimited`——都需要支付小额费用。但这是值得的。

    5. **关闭手机、平板电脑或笔记本电脑上的任何文件共享和打印机共享选项。** 如果你没有使用任何无线配件，也请关闭 `Bluetooth`。黑客访问你设备的无线路径越少，你的整体安全性就越高。**


    ### 网络钓鱼 (Phishing)

    这不仅仅是一个听起来很奇怪的互联网词汇——它是一种严重的威胁。


    ![image](img/GettyImages-857325286.png)


    2017 年 5 月，大量记者开始收到电子邮件，其中包含一个分享给他们的 `Google Doc` 链接。这些邮件看起来很正常：在某些情况下，该文件似乎来自收件人认识的人。但事实证明这是一个复杂的网络钓鱼——试图通过将信息伪装成来自可靠来源来获取敏感信息，从而诱骗受害者交出
    Google 账户。网络钓鱼诈骗并不新鲜，但犯罪分子已变得越来越擅长让这些诈骗看起来比旧式的“尼日利亚王子”求助请求更有说服力。


    **永远不要点击疑链接**

    如果你通过电子邮件收到一个看起来陌生的链接，不要点击它。钓鱼者经常伪装成合法网站以获取登录凭据。谷歌垃圾邮件和滥用主管马克·里舍（Mark Risher）告诉《时代》杂志：“他们只是复制了你习惯看到的那个页面。”如果你收到一封看起来重要的邮件——无论是来自银行的警告，还是
    Apple 通知你的 iCloud 服务——请尝试联系服务提供商确认该邮件是否已发送。


    **警惕威胁**

    钓鱼者通过诱导你点击链接或输入登录凭据获利，因此他们经常试图传达一种紧急感。邮件可能会促使你在特定时间内验证你的信息，否则他们将永久锁定或删除你的账户。这应该是一个红旗。


    **留意糟糕的语法**

    已知网络钓鱼邮件包含拼写和语法错误。与他们模仿的大型公司不同，钓鱼者没有作家和编辑团队。


    **仔细检查电子邮件**

    尽管图形、邮件别名和主题行可能很有说服力，但你通常可以通过仔细查看邮件地址来识别网络钓鱼诈骗。正如 CNET 发现的一封钓鱼邮件所示，伪装成 PayPal
    的骗子使用的是这样的邮箱地址：`web-scured1@inc.pay1.com`。列出的 URL 情况通常类似。尽管发送者声称是 PayPal 或 Facebook，但邮件中包含的任何链接与这些网站的网址不同。不要通过点击链接来查看；你只需将鼠标悬停在上面通常就能看到
    URL。因此，在可以使用笔记本电脑或台式电脑时查看可疑邮件可能是个主意，而不是在手机上查看。


    ### 设备与小用工具

    数以亿计的连接设备意味着黑客有数以亿计的目标。


