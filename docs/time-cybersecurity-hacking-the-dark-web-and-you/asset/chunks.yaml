    There’s a clear desire to escape the annoyance of intrusive online ads. Usage
    of ad-blocking extensions—small bits of software that replace Web ads with white
    space—rose in popularity by 30% globally in 2016, according to `PageFair`, a site
    that monitors online advertising. Google is also adding a controversial new feature
    to its `Chrome` browser in 2018 that will automatically block ads that don’t meet
    specific standards (such as autoplay video ads with sound and pop-up ads). Maintaining
    total privacy online probably means not going on at all. But a slew of technologies
    have come along recently to help you maintain at least some.


    ## Install an ad blocker


    These browser plugins, such as `uBlock Origin`, stop ads from identifying and
    tracking you. Cybersecurity experts also suggest installing a tool that disables
    `cookies`, which store pieces of information about a user to make using certain
    websites more seamless. `Privacy Badger` is one example put out by the `Electronic
    Frontier Foundation`, an international nonprofit aimed at protecting the digital
    rights of internet users.


    ## Consider temporary credit cards


    There’s nothing wrong with clicking on an online advertisement if you’re interested
    in what’s on offer. And there’s nothing wrong with buying something through an
    online ad. One surefire way to protect yourself if you do a lot of online shopping
    this way is to look into getting a temporary card to make purchases. Many banks
    and third-party companies like `Privacy` have options to create virtual online
    cards with short expiration windows. The cards are tied to your actual credit
    card but have a different number, security code and expiration date. They also
    have virtual limits that you set yourself.


    ## Don’t tell them where you are


    There’s no denying that ads have gotten more sophisticated in targeting consumers
    based on where they actually live and work. Comb through the privacy settings
    on your `Facebook`, `LinkedIn`, `Twitter` and other social-media sites and look
    for things like your location settings, which you should turn off. On your smart
    devices, turn off `GPS`, `Wi-Fi` and `Bluetooth` connections as well if you’re
    not using them. In the `Settings` section on your phone, you can also toggle location
    settings based on apps, shutting the feature off for those that don’t absolutely
    need it to function.


    ## Go incognito


    This mode can limit the information ads collect about you and does not store your
    browsing history. On Google’s `Chrome` browser, use `File > New Incognito Window`;
    on Apple’s `Safari`, use `File > New Private Window` to launch the feature.


    ## At Work


    Just being an employee can make you a target of misinformation and manipulation


    ![image](images/GettyImages-693176958.png)


    `JPMorgan Chase`, one of the world’s largest banks, revealed in 2014 that hackers
    had penetrated its network and accessed the names, addresses, phone numbers and
    email addresses of consumers in at least 76 million households. The bank said
    at the time that there was “no evidence” that any account information was compromised
    in the hack, but the attack is still considered one of the worst ever on a U.S.
    corporation. It was later revealed that the same hackers also went after several
    other financial firms, including `E-Trade` and `Scottrade`. Among the techniques
    the hackers used: “spearphishing,” or tricking a company employee into handing
    over login information. (The technique is so named because it’s a phishing attempt
    that targets a specific individual or small group of individuals.) Spearphishing
    often comes in the form of a work email that appears to be from an employee.


    1. Activate two-factor authentication.

    2. Report any suspicious emails.

    3. Change your passwords.

    4. Delete your recordings.

    5. Avoid using USB drives.


    ## At Home


    More and more people are filling their homes with smart gadgets


    ![image](images/GettyImages-547054296.png)


    Now that everything from TVs to speakers are capable of listening, maintaining
    privacy can be more difficult than ever. This is a problem that is only likely
    to grow in the coming years as more gadgets connect. TV maker `Vizio` paid $2.2
    million earlier this year to settle a lawsuit that accused the company of collecting
    data. The complaint said that certain `Vizio` TVs dating as far back as 2014 had
    software turned on by default that would monitor what a user was watching.


    ### Tape up your laptop’s camera


    Covering your computer’s camera may not stop hackers from taking it over, but
    it will help ensure that they don’t obtain private footage they can use against
    you. Hackers can gain access to your webcam and more through a type of software
    known as a `Remote Administration Tool`, or `RAT`. Even `Facebook` CEO `Mark Zuckerberg`
    keeps his laptop camera taped up.


    ### Turn off certain TV features


    While disconnecting your smart TV from the internet is the best way to ensure
    that sensitive data won’t be transmitted, doing so can notably limit its functionality.
    Some TV manufacturers allow you to disable specific data-collecting features.
    On `Vizio` TVs, for instance, navigating to `Menu > System > Reset & Admin > Viewing
    Data` and toggling it to “off” should do the trick.


    ### Turn off voice recognition


    Newer Android models that include the `Google Assistant` and iPhones that support
    Apple’s `Hey Siri` feature listen for a trigger phrase in order to answer questions
    and fulfill requests without requiring a button press. If this makes you uncomfortable,
    you can turn off this function for the `Google Assistant` by pressing and holding
    the `Google Pixel 2`’s home button, tapping the icon that looks like three dots,
    and choosing `Settings`. On an iPhone, head over to `Settings > Siri & Search
    > Listen for “Hey Siri.”


    ### Delete your Amazon Echo recordings


    If you own an `Amazon Echo` speaker, chances are you’ve already embraced the concept
    of gadgets listening to your conversations. Amazon stores voice logs in order
    to better adapt to your preferences. However, you can delete your voice-request
    history through the `Alexa` app by going to `Settings > History`. From there,
    you can tap a recording to delete it. You can also do this by visiting the `Amazon
    Content and Devices` website, clicking the `Your Devices` tab, choosing your device
    and then selecting `manage your voice recordings`.

