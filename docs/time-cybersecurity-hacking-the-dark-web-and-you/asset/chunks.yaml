    # But Silk Road was different. For one thing, it was more discriminating: its
    terms of service forbade child pornography, stolen goods and counterfeit currency.
    For another, it didn’t use dollars; it used `Bitcoins`.


    When `Bitcoin` appeared in 2009 it was a radically new kind of currency. It was
    introduced as a kind of fiscal thought experiment by someone known only as `Satoshi
    Nakamoto`, whose true identity is still a mystery. `Bitcoin` is both a payment
    system and a currency that is purely digital—it has no physical form. A `Bitcoin`’s
    worth is determined by supply and demand and is valuable only insofar as individuals
    and companies have agreed to trade it.


    `Bitcoins` belong to an era in which trust in banks and government has been compromised.
    Users can transfer them from one digital wallet to another without banks brokering
    the transaction or imposing fees. The currency is completely decentralized—its
    architecture owes a lot to Napster’s successor, `BitTorrent`—and is based on sophisticated
    cryptography. `Bitcoin` is essentially cash for the internet, virtually anonymous
    and extremely difficult to counterfeit. The Farmer’s Market was vulnerable because
    it left financial tracks in the real world. Silk Road didn’t.


    Like `Tor`, `Bitcoin` has entirely legitimate reasons for existing. As far as
    anyone can tell, it’s primarily used for legal purposes—scores of businesses accept
    `Bitcoins` now, including `Howard Johnson`, the dating website `OKCupid` and at
    least one New York bar. But `Bitcoin`’s digital slipperiness, when force-multiplied
    by the anonymity of the Deep Web, creates a potential platform for criminal transactions
    unlike anything the real or virtual world has ever seen. That potential was realized
    by the `Dread Pirate Roberts`.


    ## The Rise of Ross Ulbricht


    `Ulbricht` grew up in Texas, an Eagle Scout who went on to study physics at the
    University of Texas in Dallas. He was a fan of fellow Texan and libertarian `Ron
    Paul`; both studied the Austrian school of economics and the work of its father,
    `Ludwig von Mises`, who believed in unrestricted markets. `Ulbricht` earned a
    master’s in materials science and engineering at Pennsylvania State University.
    Acquaintances describe him as bright and straitlaced. “He wasn’t the center of
    conversation or the center of anything,” says a friend who claims to have briefly
    dated him in 2012. “He kind of set himself in the background.”


    By the time he graduated, `Ulbricht` had become interested in the idea of the
    internet as a venue for perfecting free markets. His greatest enemy—according
    to his `LinkedIn` profile—was the government. “The most widespread and systemic
    use of force is amongst institutions and governments, so this is my current point
    of effort,” he wrote. “The best way to change a government is to change the minds
    of the governed, however. To that end, I am creating an economic simulation to
    give people a firsthand experience of what it would be like to live in a world
    without the systemic use of force.”


    After graduating from Penn State in 2009, `Ulbricht` went to Sydney, Australia,
    to visit his sister. It was there, allegedly, that he began working on what would
    become Silk Road and transforming himself into the `Dread Pirate Roberts`. By
    then, drug dealers were already active on the Deep Web, but their businesses tended
    to fail for two reasons: the money changing hands was traceable, and it was difficult
    to build trust with clients. `Roberts` would solve both of those problems. The
    double layer of anonymity created by `Tor` and `Bitcoin` made the money virtually
    untraceable. To establish trust, `Roberts` looked to two temples of legitimate
    commerce for his ideas: `Amazon` and `eBay`.


    ## The Operations of Silk Road


    He was a quick study. Users of Silk Road describe a sophisticated, full-featured
    experience complete with buyer and seller reviews and customer forums. “When deciding
    whether or not to go with a vendor, I read the feedback on their page and also
    ratings from a few months ago,” says one Silk Road client, who declined to be
    identified. “I also go to the forums and read the seller’s review thread and,
    depending on the substance, I’ll go to an ‘Avengers’ thread, where people from
    the Silk Road community post lab results for individual products.” When transactions
    did go south, there was a dispute-resolution system. “Honestly it was like a candy
    store,” says the user. Silk Road launched in January 2011. Its existence was hardly
    kept a secret—with `Tor` making it possible to get in and out anonymously, why
    bother? Hiding would just have been bad for business. “It was basically an open
    thumbing of noses at law enforcement,” `Bharara` told `TIME` in 2013.


    ## The Investigation and Arrest


    The FBI got its first glimpse of `Ross Ulbricht` in October 2011. Someone named
    `altoid` had been promoting Silk Road in various chat rooms; then, in a `Bitcoin`
    forum, `altoid` posted an ad seeking an “IT pro in the bitcoin community” for
    “a venture-backed bitcoin-startup company,” according to the complaint against
    `Ulbricht`. `Ulbricht` listed his real email address as the contact for the position.


    `Ulbricht`''s real email address was the contact for the position. The FBI obtained
    records from `Google` that showed `Ulbricht` was accessing Silk Road from a San
    Francisco café. The `Google` account linked to the `Ludwig Mises Institute` showed
    an IP address corresponding to San Francisco. `Ulbricht` hastily changed his user
    ID (to `frosty`), but the damage was done: that same code turned up as part of
    the Silk Road site.


    From there the thread becomes darker and more tangled. In January 2013, a Silk
    Road employee apparently stole `Bitcoins` from users, then managed to get arrested.
    `Roberts`, displaying a side investigators hadn’t seen before, contracted with
    a Silk Road customer to have the employee tortured until he or she returned the
    `Bitcoins`, then killed. This was the work not of a libertarian idealist but of
    a sociopath. `Roberts` was unaware that the hit man he was dealing with was an
    undercover FBI agent who had bought drugs on Silk Road. The agent sent `Roberts`
    faked photographic proof of the murder. Satisfied, `Roberts` wired $80000 from
    an Australian money-transfer exchange.


    According to the testimony of FBI agent `Christopher Tarbell`, who led the investigation,
    a Silk Road user in Canada began to blackmail `Roberts`, threatening to leak information
    about the clientele. `Roberts` responded by paying someone known online as `redandwhite`
    the sum of $150000 in `Bitcoins` to kill the blackmailer. (`Roberts` received
    photos of that killing too, but the Canadian police can’t match it to any murder
    they’re aware of.) In June 2013, `Roberts` ordered a set of fake IDs from `redandwhite`.
    Later that month, U.S. Customs opened a package from Canada containing nine fake
    IDs bearing `Ulbricht`’s photo and birth date. The package also gave them `Ulbricht`’s
    address.


    The net was closing fast. By July, FBI hackers had tracked down one of Silk Road’s
    servers, in a foreign country whose name has not yet been revealed, which gave
    them copies of all `Roberts`’s email plus transaction records dating to the site’s
    launch. On July 26, 2013, agents from Homeland Security knocked on `Ulbricht`’s
    door. He admitted that he’d been living under a false name.


    The authorities got another break on July 31, when they raided the condo of a
    Seattle-area dealer who sold methamphetamine, cocaine and heroin through Silk
    Road under the handle `Nod`; they quickly flipped him as an informant. On October
    1, two years after they first spotted him, federal agents followed `Ulbricht`
    to the Glen Park library and arrested him. The FBI says it caught him red-handed
    with evidence on his laptop screen.

