  trans: '

    “我从未想过这种违规行为会发生在普通人身上，”Jacobs 说道，她最初将照片发给了一个她认识并信任的人。“我没有意识到，非自愿裸照竟然存在这样一个市场。”


    Jacobs 表示，她被诊断出抑郁症和创伤后应激障碍（PTSD），并开始害怕见到新人，担心他们会发现那些照片。“这是一场生活的噩梦，”她说。“我一直被警察、律师和
    FBI 拒绝，因为他们一直无能为力。”


    现在 30 多岁的 Jacobs 最终通过更改法律姓名来逃避网络足迹。但她也决定反击。她创立了 `CCRI`，一家致力于帮助非自愿色情受害者恢复身份的非营组织。自
    2014 年推出热线以来，已有 5000 多名受害者拨打了 `CCRI`，Jacobs 说，该小组现在每月收到 150 到 200 个电话。“犯罪者的意图其实并不重要。无论是为了钱还是为了钱，都在毁另一个人的生活。”


    许多受害者认为在网上看到自己的裸照的那一刻是遭遇中最糟糕的部分。然后他们开始与老板进行尴尬的谈话，面对社交媒体帖子并遭受同事们异样的眼光。知道谁看了你的照片以及他们如何看待你，变得是不可能的。当这些受害者开始尝试删除照片时，他们意识到了更糟糕的事情：这种违规行为会留下几乎无法完全消除的数字污点。


    “一旦图像和视频曝光或发布，互联网就是永久的，”风险评估公司 `GreyCastle Security` 的执行官 Reg Harnish 说，他曾与 Kara
    Jefts 合作删除了她的大部分照片。但即使你从一个网站删除了图像，也没有办法保证它没有被复制、截图或存储在某个缓存中。“从互联网上删除特定内容有成百上千种障碍，”他说，“这几乎是不可能的。”


    随着执法部门的回应反复不定，科技公司开始应对日益增长的压力以解决这个问题。根据《1996 年通信尊严法案》（Communications Decency Act），`Google`
    和 `Facebook` 等平台不对其托管的内容负责，这意味着它们对网络上的非自愿色情内容不承担法律责任。但在用户请求如潮后，几家主要网站已经制定了新政策来帮助打击复仇色情。2015
    年，流媒体网站 `Pornhub` 让受害者更容易要求从其网站删除非自愿内容，`Google` 也同意从其搜索结果中移除投诉者的图像。`Twitter` 和
    `Reddit` 也更新了规则禁止非自愿色情。2017 年 4 月，`Facebook` 发布了一个工具，允许用户标记他们认为未经许可分享的内容；公司技术人员随后会检查内容是否出现在网络其他地方，以防止其进一步传播。但这种方法需要大量的人力，因为非自愿色情很难识别。与肉眼就能发现儿童色情不同，未经许可发布的图像看起来并不自愿不同。


    这个问题在几乎每个层面都令人困扰：个人、法律和技术。当律师在起诉、立法者在辩论时，数百万张照片仍在那里流传、倍增，等待着毁掉别人的生活。


    ![image](img/h_14934015.png)


    SNL 的 Leslie Jones（上），以及后续照片中的球星 Hope Solo 和演员 Jennifer Lawrence 都被黑客攻击过。


    ![image](img/GettyImages-51161650.png)


    ![image](img/h_10.03437058.png)


    “这些是我认为这是一段自愿的私人关系时拍摄的。它们分享的背景改变了它们的意义。”


    –Kara Jefts，复仇色情受害者


    ![image](img/Harnish.png)


    风险评估公司 `GreyCastle Security` 执行官 REG HARNISH


    **4 分之 1**

    在对近 6000 名单身成年人的调查中，表示收到过性照片的男性比例。


    **23%**

    在收到裸照的人中，报告将其转给他人的百分比；男性传播照片的概率是女性的两倍。


    ## 为什么复仇色情受害者很难获得正义


    性犯罪在物理世界发生时可能很难起诉——而当犯罪发生在网上时，正义变得更难获得。在文化态度、技术障碍和法律不一致性之间，非自愿色情受害者面临着充满挑战的救济之路。


    ![image](img/page_27.png)


    ### 个人羞耻

    许多复仇色情受害者因感到羞耻而不敢露面。受害者指责无处不在，许多朋友、家人甚至警察人员的第一反应是问为什么当初会拍摄和发送裸照。网络民权利倡议（Cyber
    Civil Rights Initiative）创始人 Holly Jacobs 回忆起自己的经历时说，人们会问：“你怎么能分享那些照片的？”


    ![image](img/page_27-1.png)


    ### 装备不足的警察

    极少数当地执法机构对复仇色情的影响有深入的理解，也拥有处理它的技术工具。即使他们认真对待这项犯罪，在许多情况下，当地警察也有效收集数字证据。


    ![image](img/page_27-2.png)


    ### 补丁式法律

    虽然现在有 38 个州制定了针对复仇色情的法律，但这些法律采用的标准不一。与受害者和犯罪者有物理接触的犯罪不同，非自愿色情可以跨州传播，导致管辖权和法律的交织。


    ![image](img/page_27-3.png)


    ### 技术现实

    一旦图像出现在互联网上，就几乎无法删除，”风险评估公司 `GreyCastle Security` 的执行官 Reg Harnish 说。“即使许多社交媒体平台和色情网站在移除未经许可分享的内容方面变得更加合作，但也没有办法保证这些照片没有出现在互联网的其他地方。”


    ## 黑客年


    2016 年，黑客让漏洞成为常态，并直指民主本身。作者：MATT VELLA


    ![image](img/code.png)


    黑客似乎到处都是坏名，除了硅谷，因为硅谷是建立在通过任何手段创造性克服技术限制的优德之上。这种传统产生了比尔·盖茨、史蒂夫·沃兹尼亚克和马克·扎克伯格等人物，后者在
    2012 年 `Facebook` 首次上市前夕对这个词的“不公平的负面含义”表示遗憾。他写道，“黑客意味着快速构建某些东西或测试可以做的边界。就像大多数事物一样，它可以被用于善，也可以用于恶。”

