    Rogen didn’t always plan a comedy about a plot to kill the actual ruler of North
    Korea. Early scripts employed a fictional character named `Kim Il-hwan`, according
    to Interview screenwriter `Dan Sterling`. He maintains it was a studio executive
    (he declined to give the person’s name) who originally suggested using `Kim`.
    Rogen and `Goldberg` loved the idea. Unlike, say, `China`, an important film market
    and thus one `Sony` didn’t want to alienate, North Korea was regarded as fair
    game for provocative material in Hollywood. `Pascal` and `Lynton` blessed this
    change.


    In hindsight it’s easy to second-guess this decision. North Korea is a rogue state
    (with nuclear missiles) led by a volatile, unpredictable dictator. “Why is it
    necessary to name Kim Jong-un?” a filmmaker who has worked with Sony asks Fortune.
    “Is it going to mean that much more at the box office? If you’re doing a serious
    film it’s one thing. But it’s a fart movie!”


    The plot of The Interview is now well-known. A doltish tabloid talk-show host
    played by `James Franco` and his bosom-buddy producer (`Rogen`) are invited to
    North Korea to interview `Kim Jong-un`, who’s a secret fan of their program. The
    `CIA` then enlists the pair to assassinate `Kim`. Some laughs ensue. It all ends
    with `Kim`’s fiery death in a helicopter, which `Franco`’s and `Rogen`’s characters
    gun down from a commandeered tank.


    The Interview cost $44 million to make ($8.2 million went to Rogen) and had a
    $32 million marketing budget. `Sony` had hefty box-office expectations for the
    R-rated comedy: $100 million to $135 million. The movie features tigers, military
    hardware and expensive special effects. Even `Rogen` marveled at the latitude
    he’d enjoyed, telling `Rolling Stone` before its release, “They’re giving us insane
    amounts of money to do whatever the f - - k we want.”


    Given the pair’s commercial success, `Sony` was deeply motivated to keep `Rogen`
    and `Goldberg` happy and on the studio lot, where they worked out of a suite of
    offices and strolled the grounds smoking weed. “We love your movies and frankly
    yours is the most important relationship we have,” `Dwight Caines`, `Sony`’s president
    of theatrical marketing, told `Rogen` in an email. Test screenings for The Interview
    were strong. “Totally floored by this movie. And by you,” `Pascal` wrote `Rogen`
    and his team in April. “Thanks for letting us make it,” `Rogen` replied. “Nobody
    else would do that.”


    `Rogen` and his collaborators seem to have genuinely wanted to make a statement
    about the loony and oppressive ways of the `Kim` regime. “I was thrilled by the
    opportunity to make a mass-appeal studio movie with a bit of political commentary
    in between the dick jokes,” says `Sterling`. `Sony` executives seemed onboard.
    “The movie is doing something bold that I’m not sure any other movie has done
