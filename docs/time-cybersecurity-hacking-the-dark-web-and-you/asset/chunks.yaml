    它们非常有价值，因为尽管你可能察觉不到，但互联网是一个战场。尽管它表面上变得越来越华丽、社交化且乐于取悦，但在表象之下，网络正变成一个充满敌意、充满争议的领土，私营公司、执法部门、犯罪分子、军方以及各种国际情报机构在这里进行着持续的低级网络战。这种冲突只是偶尔能被肉眼看到——例如在
    2014 年 5 月，美国起诉了五名中国军人，指控他们从美国公司窃取数据，包括`Westinghouse`和`Alcoa`。他们目前仍列在`FBI`的通缉逃犯名单上。这并非异常，而是常态，而且这种正变得越来越常态。曾任`NSA`和美国网络司令部司令的退役陆军将基思·亚历山大（Keith
    Alexander）将中国持续的知识产权窃取行为称为“历史上规模最大的财富转移”。最近，几家安全公司证实，一个被认为受俄罗斯政府支持的团体至少从 2012
    年起就在系统性地黑入美国能源基础设施。根据开展数据安全研究的`Ponemon Institute`的数据，平均机构在 2016 年共遭受了 28,512 次攻击。


    ### 网络战的现实


    网络战并非未来，而是已经到来。这已是常备饭。在这场战争中，战场无处不在，漏洞是武器，而像 Portnoy 这样的人则是军火商。软件漏洞可以价值真实的美元这种想法很奇特。漏洞是错误；人们通常付钱来修复它们。漏洞之所以存在市场，是因为我们当今时代更大荒诞性的结果——在这个时代里，我们的整个世界——我们的业务、医疗记录、社交生活——正以数据的形式一点一点地离开现实，迁移到计算机的软件内部。许多人对此感兴趣，原因既有好的也有坏的。其中有些人是间谍，另一些人是犯罪分子。


    ### 震网病毒（Stuxnet）案例


    2009 年，关于什么让漏洞如此有用，提供了一个深刻的教训。美国和以色列共同开发了一种复杂的计算机蠕虫，旨在渗透并破坏伊朗纳坦兹（Natanz）的一处特定的铀富缩设施。这种现在被称为`Stuxnet`的蠕虫被认为可能是第一个真正的网络武器。它是由一名双面间谍通过优盘引入该设施计算机系统的。蠕虫检查了该场所并向其主人回传了详细的情报。然后它大显身手，开始攻击那些用于富铀的计算机。它最终摧毁了大约
    20%的设备。这一切都是安全专家和记者推断出来的。是什么让`Stuxnet`如此有效？一言以之：漏洞。为了获得所需的访问，`Stuxnet`利用了至少四个不同的漏洞，包括`Microsoft
    Windows`中的一个。这些漏洞——或者说利用这些漏洞的知识——本身与伊朗人正在研究的铀不同，它们是以软件形式存在的：昂贵、高度精炼的弹药，构成了极其复杂的武器系统的核心。当`Stuxnet`从纳坦兹设施逃脱（这对任何看过《侏罗纪公园》的人来说都是不理性的）并感染了全球范围内约
    10 万台计算机时，它的破坏性更显剧了。


    ### 漏洞赏金市场


    为漏洞付钱的想法比`Stuxnet`要早得多。1995 年，`Netscape`宣布了一项名为“漏洞赏金”（Bugs Bounty）的计划，向任何能发现其浏览器缺陷的人支付现金。该公司并不是在试图摧毁离心机；它只是想修复其软件中的漏洞。2002
    年，一家名为`iDefense`的安全公司开始购买各种类型的漏洞；另一家公司`TippingPoint`在 2005 年启动了类似的计划。这两项计划的创建是作为公开市场上日益活跃且混乱的“零日漏洞”（zero-days）交易的替代方案——本质上，它们充当了安全的零日处置设施，有点像放射性废物库。如果你发现了一个漏洞，与其把它卖给可能会对其做鬼知道是什么坏事的最高出价者，你也可以以可靠的价格卖给`iDefense`或`TippingPoint`，他们会向客户提醒该问题，并与软件供应商合作修补漏洞。`iDefense`和`TippingPoint`还有另一个共同点：它们在
    2005 年和 2006 年连续两年聘佣了一个名叫阿伦·波特诺伊（Aaron Portnoy）的实习生。


    `Portnoy`看起来完全不像《战争游戏》中的马修·布罗德里克里克（Matthew Broderick）。他是一个自信、随和、口齿伶道的男士，眼神交流良好，而且恰好是一个超级网络侵入专家。2006
    年，`Portnoy`从东北大学（`Northeastern`）退学全职进入`TippingPoint`，2012 年他离开创业。2015 年 11 月，`Portnoy`离开了他的初创公司为雷神公司（Raytheon）工作。`Exodus
    Intelligence`加入了一个小众精英领域，该领域包括位于当地的`Vupen`。


