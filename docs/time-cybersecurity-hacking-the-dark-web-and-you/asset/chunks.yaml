    Hope Solo and actress Jennifer Lawrence have all been hacked.


    ![image](images/GettyImages-511616650.png)


    ![image](images/h_10.03437058.png)


    “These were images that I took under the assumption that it was a consensual,
    private relationship. The context in which they were shared changed their meaning.”


    –Kara Jefts, revenge-porn victim


    ![image](images/Harnish.png)


    REG HARNISH CEO of cyber-risk-assessment firm `GreyCastle Security`


