  trans: "\n它们确实很麻烦，但也是数字防御的第一道必要防线。\n\n![image](img/GettyImages-623213400.png)\n\n\
    2017 年，雅虎（Yahoo）披露其约 30 亿用户账户均受到了此前披露的 2013 年数据泄露事件的影响。泄露的数据可能包括电子邮件地址、密码、出生日期和电话号码。这是史上规模最大的网络安全漏洞之一，但雅虎绝并非唯一受黑客之害的大型企业。Myspace\
    \ 也在 2016 年确认曾遭受过攻击，导致 3.6 亿登录凭据泄露。虽然这些步骤可能无法防止你的密码落入他人之手，但它们确实可以帮助减轻潜在损害。\n\n\
    ## 定期更改密码\n\n经常更改密码可以增加黑客获取有效登录凭据的难度。如果你认为自己的信息可能已被盗取或破解，这是一个一个尤为重要的第一步。但要注意避免重复使用旧密码，或与你之前的密码相似的词汇和短语等常见陷阱。这样做只会让黑客更容易破解，特别是当他们了解你之前的密码时。\n\
    \n## 创建强密码\n\n编写一个容易记忆的密码可能很有诱力，但这些密码通常也是犯罪分子和计算机算法最容易猜到的。让你的密码长一些，并尝试包含特殊字符、数字以及大写和小字母的混合。避免使用常用短语。\n\
    \n## 使用密码管理器\n\n使用如 `1Password` 或 `LastPass` 等密码管理器会让创建复杂密码的理由变得更加充分。这些应用程序存储你的密码并为你自动填充，这样你就不需要记住登录凭据了。例如，`1Password`\
    \ 和 `LastPass` 使用加密保护这些数据。你只能通过创建的主密码来访问它们。\n\n## 设置双重身份认证\n\n许多数字服务（包括社交媒体平台、电子邮件提供商和在线银行）都提供多因素认证。这本质上是在输入密码后的登录过程中增加了第二个步骤（即第二个“因素”）。它使得仅凭密码无法访问你的账户。大多数平台提供几种不同的双重认证选项，例如通过电子邮件或短信发送代码，或者通过电话。如果你在多种设备上接收短信或电子邮件，虽然可能稍微更费时间，但选择电话验证可能更稳妥。\n\
    \n## 清单\n\n撕下这份实用的指南并严格遵守，特别是如果你刚开始接触网络世界。\n\n![image](img/GettyImages-586715692.png)\n\
    \n1. **使用复杂密码**\n   使用“12345”作为密码就像用牙线锁住你的自行车。`LastPass` 和 `1Password` 可以帮助生成安全的密码。\n\
    2. **频繁更改密码**\n   定期更改密码（例如每月一次甚至每周一次）可以帮助在黑客万一拿到你的旧密码时，防止他们访问你的账户。\n3. **使用双步认证**\n\
    \   确保在任何提供该服务的网站或应用上激活它，并将其视为你数字堡垒的第二道墙。\n4. **避开公共 Wi-Fi 网络**\n   如果你无法避免公共\
    \ Wi-Fi 网络，使用虚拟专用网络（或 `VPN`）是好的，可以让你的上网活动避开窥探。\n5. **警惕可疑邮件**\n   许多电子邮件提供商已经非常擅长在可疑邮件出现在收件箱之前对其进行检测和过滤。但某些恶意邮件仍可能发送到你这里。因此，请务必谨慎。\n\
    6. **更新你的设备**\n   大多数设备制造商都会花费大量时间修补漏洞。但为了让你获得这些更新，你必须确保你的软件是最新的。\n7. **使用病毒防护**\n\
    \   `McAfee` 和 `Norton` 都提供顶尖的病毒防护解决方案，根据你的需求提供一系列订阅、功能和价格。也有非常好的免费选择，包括 `Avast`\
    \ 和 `Bitdefender`。\n8. **备份你的数据**\n   备份数据最简单的方法是使用外部硬盘以及 `Windows` 或 `Apple`\
    \ 电脑自带的备份软件。还有几种在线订阅服务可以让你将电脑备份到遥远的服务器上，这将确保在发生火灾或其他灾难时你有备份。\n9. **贴住笔记本电脑的摄像头**\n\
    \   黑客劫持你的电脑摄像头并秘密录制你尴尬视频的想法听起来像反乌托邦科幻小说，但对这种可能性采取预防措施并无害处。用一点胶带效果很好，而且当你需要和孩子进行\
    \ `FaceTime` 通话时很容易取掉。或者，确保在不使用笔记本电脑时保持盖子关闭。\n10. **保持设备物理安全**\n    永远不要在公共场所独自离开电脑。将工作电脑锁在锁好的抽屉里也是明智之举。你应该远离来源不明的\
    \ `USB` 盘。为了增加安全性，你可以设置电脑在每次开机以及每次从睡眠模式中唤醒时都需要输入密码。\n\n—Lisa Eadicicco 和 Alex\
    \ Fitzpatrick\n\n## 英雄还是反派？好莱坞仍在思考\n\n娱乐界为了理解和刻画黑客的漫长而奇特的努力 作者：ELIANA DOCKTERMAN\n\
    \n![image](img/NUP_178052_1118.png)\n\n《黑客帝国》（Mr. Robot）这部 2015 年关于黑客的美剧，其上映时机非常完美——正值重大黑客事件开始成为头条新闻——它对黑客能做什么、不能做什么的描述获得了赞誉。\n\
    \n黑客是一个很有吸引力的反派。除非好人阻止他（或她），否则黑客可以发射导弹或勒索总统。黑客也具有当英雄的潜力。他完全可以发现一个政府阴谋，或者击败一家邪恶公司。自\
    \ 80 年代以来，剧作家们一直在思考这个问题——有时比其他时候做得更好。问题是，为什么好莱坞在将计算机天才带入银幕方面一直表现不一？\n\n一方面，看着人们在输入代码时皱脸并不特别吸引人，导演们长期一直如何让键盘这种微妙的武器变得像剑或激光束一样精彩。一部爱德华·斯诺登（Edward\
    \ Snowden）阅读国家安全局（NSA）文件的传记，永远不会像《印第纳·琼斯》探索隐藏墓穴或《神奇女侠》与德国士兵搏斗那样精彩。为了让这些场景更有质感，一些电影人创造了充满二进制数字或唱歌病毒的迷幻空间，并因此发现自己成了真实黑客嘲笑的对象，更说每个用过电脑的人了。\n"
