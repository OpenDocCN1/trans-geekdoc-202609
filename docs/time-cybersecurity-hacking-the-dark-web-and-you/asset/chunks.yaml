    # WORLD ANTIDOPING AGENCY


    Russian hackers released the medical records of 41 athletes from 13 countries.


    # TECHNOLOGY CEOS


    A collective cracked into the social-media accounts of CEOs and celebrities, seemingly
    just to show it could.


    # CHAPTER TWO: Hacking the Hackers


    Legions of private companies and government agencies have sprung up to counter
    cybersecurity threats from lone hackers and organized groups, sometimes backed
    by rogue states.


    * ■ THE SECRET HISTORY OF AN ELECTION

    * ■ THE CODE WAR

    * ■ GOOGLE’S ELITE HACKER SWAT TEAM

    * ■ THE NEXT FAKE-NEWS CONFLICT


    ![image](images/chap_two.png)


    ## The Secret History of an Election

    The White House was prepared to call out the military to guard the vote from a
    Russian hack. BY MASSIMO CALABRESI


    ![image](images/Time_votingbooth.png)


    Riverside County district attorney Michael Hestrin was at his desk on June 7,
    2016, when the calls started coming in. It was the day of the California presidential
    primary, and upset voters wanted the county’s top prosecutor to know that they
    had been prevented from casting their ballots. “There were people calling our
    office and filing complaints that they had tried to vote and that their registration
    had been changed unbeknownst to them,” says Hestrin. Soon there were more than
    20 reports of trouble, and Hestrin, a 19-year veteran of the office and a graduate
    of Stanford Law School, dispatched investigators to county polling places to see
    what was going on.


    At first what they found was reassuring. Everyone who had been blocked from voting
    had been offered a provisional ballot, and most had cast their votes that way.
    But as the investigators dug deeper, things looked less innocuous. In the days
    after the vote, more people started coming forward to say they’d also had problems
    with their voter registration on primary day. In at least half a dozen cases,
    Hestrin and his investigators concluded, the changes had been made by hackers
    who had used private information, like Social Security or driver’s-license numbers,
    to access the central voter-registration database for the entire state of California.


    There the trail went cold. The California secretary of state’s office told Hestrin’s
    investigators that the state’s system hadn’t recorded the internet addresses of
    the computers that had made the changes, so there was no way to learn the identity
    of the hackers. Hestrin could go no further, but that wasn’t the end of it. The
    lingering mystery of the voter-registration changes bred doubt among members of
    both parties. Local Republicans publicly alleged that Democrats were ignoring
    the issue and privately accused them of trying to suppress the GOP vote. Democrats
    thought Republicans were making up an excuse for their losses at the county polls.
    “That was a big concern,” says Hestrin, an elected Republican. “People should
    still have faith in our election systems.”


    It was only months later that it dawned on investigators in D.C. that undermining
    voters’ faith may have been the point of the Riverside County hack all along.
    In the months following the California primaries, the feds discovered that Russian
    hackers had broken into more than 20 state and local election systems and attempted
    to alter voter registration in several of them. Looking back at the events in
    Riverside County, cybersecurity officials at the White House wondered whether
    it had been a test run by the Russians. “It looked like a cyber-attacker testing
    what kind of chaos they could unleash on Election Day,” says one former federal
    cyber-security official who looked into the case. “There was no forensic evidence,
    so we may never know for sure, but the intelligence told us the Russians were
    bragging about doing just that.”


    It is easy to forget, in the constant flurry of news, that the abiding goal of
    the Russian operation against the 2016 presidential election was, in the words
    of the U.S. intelligence community, “to undermine public faith in the U.S. democratic
    process.” What unfolded from early spring 2016 through the close of polls on November
    8 in states and counties across America was an aggressive attack on the credibility
    of our elections and a largely unseen and futile attempt by the federal government
    to counter it. The FBI, the Department of Homeland Security (DHS) and U.S. intelligence
    services worked to identify the hackers and determine how widespread their malicious
    influence operation was. The feds struggled to help states protect their ballot
    machines and voter-registration rolls, only to become suspected of election meddling
    themselves amid mounting partisanship. In the end, realizing there was little
    they could do to stop what they feared might be a final Russian attack on the
    vote, the feds worked up an extraordinary plan to limit the damage on Election
    Day and in the days after.


    The previously undisclosed 15-page plan, produced by President Barack Obama’s
    cyber-security officials and obtained by TIME, shows just how worried Washington
    was. It deferred to states in most cases of a cyber-incident on Election Day.
    But in a severe attack “likely to result in demonstrable impact to election infrastructure,”
    it provided for “enhanced procedures” in response. The plan allowed for the deployment
    of “armed federal law enforcement agents” to polling places if hackers managed
    to halt voting. In a crisis, it also foresaw the deployment of “Active and Reserve
    military forces” and members of the National Guard “upon a request from a federal
    agency and the direction of the Secretary of Defense or the President.” For three
    days after the election, a special interagency effort would be tasked with addressing
    “any post-election cyber-incidents,” including “planted stories calling into question
    the results.”


    On November 1, the White House went so far as to war-game an Election Day attack.
    Over the course of five hours, the National Security Council ran a fictionalized
    sequence of events to rehearse how federal agencies would communicate and respond
    in a real attack. Some of the scenarios dealt with actual vote meddling, while
    others focused on disinformation efforts to undermine the election. As the nightmare
    scenarios unfolded—from voters turned away to violence at polling places—the team
    went over what actions each agency would take and what the legal constraints were
    on what they could do.


    As it happened, November 8 came and went with no final, spectacular attack on
    the integrity of the election. But the Russian effort may nonetheless be working,
    helped wittingly or otherwise by Donald Trump. Most Americans believe that their
    own votes will be correctly counted, but their faith that elections are honest
    is collapsing. In 2009, 59% of Americans had confidence in the honesty of elections,
    while 40% did not, according to Gallup. By 2015, those numbers had flipped, and
    just before the November vote, amid Trump’s repeated talk of rigged elections
    and the widespread coverage of Russian hacking, Gallup found that only 30% of
    Americans had confidence in the honesty of our elections, while 69% did not.


    About three weeks after the Riverside County hack, a Russian agent signed on to
    the voter-registration website of one of Illinois’s 109 election jurisdictions,
    each of which has its own voting system. But instead of entering his personal
    information in one of the fields for names and addresses, the hacker uploaded
    a string of malicious prewritten code, executing a classic hack known as `SQL
    injection`. With that, the hacker opened a back door to all 15 million files on
    past and current voters in the state since 2006. And for nearly three weeks, no
    one knew he was there.

