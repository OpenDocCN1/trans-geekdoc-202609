    And then there are the ones that aren’t just playing. Exodus is discreet about
    its client list, but others have been less so. It’s well known that the `NSA`
    and `FBI` are fond of implanting surveillance software on target computers to
    gather intelligence; after the bureau successfully lobbied the courts, in 2016
    the Supreme Court approved a rule change that allows judges to issue a warrant
    to search or seize devices regardless of their location. How do you implant software
    on somebody’s computer without that person knowing about it? One way is to exploit
    a vulnerability. In 2013 the `FBI` busted a company called `Freedom Hosting`,
    which it called “the largest facilitator of child porn on the planet.” Freedom
    Hosting operated on the `Tor` network, which anonymizes Web traffic. To get around
    the anonymity, the `FBI` used a vulnerability in `Firefox`.


    As for the `NSA`, the Washington Post’s analysis of the Edward Snowden leaks revealed
    an `NSA` budget that included $25.1 million for “additional covert purchases of
    software vulnerabilities,” suggesting that it both buys zero-days and rolls its
    own internally. (In 2013 the investigative-journalism site `MuckRock` obtained
    a copy of a contract between the `NSA` and `Vupen`, a now-defunct French cybersecurity
    company.) That same budget provided a remarkable x-ray of a secret `NSA` initiative
    code-named `GENIE`, funded at $652 million, to implant malware on foreign computer
    networks on a mass scale. By the end of 2013, `GENIE` was expected to control
    around 85,000 machines.


    According, again, to the Snowden documents, the U.S. mounted 231 offensive cyberoperations
    in 2011 against China, Russia, Iran and North Korea, among others—and that was
    2011, ancient history in cybertime. The 2017 defense budget includes $6.7 billion
    for cyberspace operations, which is a very general term for an arena about which
    not much is known. `Verizon` estimates, in its annual `Data Breach Investigations
    Report`, that 21% of data breaches in 2016 were attributable to cyberespionage
    operations. `Verizon` has also acknowledged that solid information about cyber­espionage
    is hard to come by. The action is covert, and even when you can spot it, cyberespionage
    is difficult to distinguish from the industrial kind, or from plain old cybercrime,
    because it’s so hard to pinpoint the source and intent of an attack.


    Given the offensive potential of vulnerabilities, you’d think the government would
    want to control the trade in them the way it does, say, the trade in fighter jets
    and land mines. But regulators are just now catching up with it. The `Wassenaar
    Arrangement`, which is the international agreement that governs arms sales among
    the `U.S.` and 40 other participating nations, was modified in 2013 to include
    “intrusion software” in its list of restricted dual-use technologies, but so far
    that change hasn’t been enforced. “It’s not a market that right now the government
    has really looked at regulating,” a senior Obama administration official told
    `TIME` in 2014. “We’ve been much more in the voluntary best-practices-and-standards
    space. And I think that you’ll see us continue to focus on that.” In 2016, `U.S.`
    officials announced that they hoped to renegotiate the deal again in the future.


    The dream, of course, is a world where there are no more vulnerabilities, where
    software can be perfected, security will be total, and we can move on and find
    something else to worry about. But the trend is going the other way. The more
    we ask computers to do for us, the more urgently we need them to be secure—but
    the more computers have to do, the more complex their software has to be, and
    therefore the more bugs they have, and round and round—it’s a vicious cycle. The
    operating system on your laptop consists of tens of millions of lines of code.
    Throw a bunch of applications on top of that, most of which have been rushed to
    market three-quarters finished, and then connect your laptop to millions of other
    devices, tablets and phones included, each with its own configuration of hardware
    and software, and the situation rapidly becomes unmanageable. “There are a finite
    number of bugs in a given piece of software,” `Portnoy` says. “However, that given
    piece of software is updated and added to and changed, and underlying operating
    systems change, and they have to support a legacy this, that and the other thing.
    `Windows XP`—when was that released? In 2000? 2001? You have to support systems
    that are 15 years old. And there’s new software being released every day, and
    new classes of vulnerabilities being discovered. As long as that’s the case, we’ll
    have a job.”


    ![image](images/page_50.png)


    $250,000

    Microsoft’s top cash reward to hackers who find potent ways to sneak around existing
    security protections in `Windows`


    $1.6M

    Reward money that `Mozilla`, the maker of `Firefox`, has paid to hackers since
    2004


    $1,780

    Facebook’s average award per bug in 2015. But the company paid one Brazilian hacker
    $33,500 in 2013 and a 10-year-old Finnish boy $10,000 for a major `Instagram`
    flaw in 2016


    $9M

    Google’s total payoffs to hackers since 2010 as part of its reward program. Normal
    rewards range from $100 to $20,000. But one huge bug fetched $150,000 as part
    of a company hack-a-thon


    ## NOTABLE ATTACKS


    When hackers get their hands on a fresh vulnerability, the results can be devastating.
    Here are some cases


    ![image](images/page_52.png)


    ![image](images/page_52.png)


    ### STUXNET, 2009

    The `U.S.` and Israel began wreaking havoc on Iran’s incipient nuclear program
    in 2009 by using zero-day vulnerabilities to infect `Windows` machines.


    ### AURORA, 2009

    A China-based group used vulnerabilities in `Internet Explorer` to launch attacks
    against `Google`, `Adobe` and dozens of other `U.S.` companies, spying on human-rights
    organizations.


    ### BLACKHOLE, 2010–13

    A powerful Russian hacker allegedly created the notorious software kit known as
    Blackhole, a bundle sold on the black market that accounted for a vast array of
    attacks.


    ### RSA, 2011

    An employee opened a bugged `Microsoft Excel` file, and hackers stole valuable
    information on `RSA`’s `SecurID`, a security tool used by corporations.


    ### EQUifax, 2017

    Though `Equifax` was warned about a Web-application vulnerability, it failed to
    patch the faulty software, leading to an attack that exposed 145.5 million customers’
    sensitive information.


    ## The Next Fake-News Conflict


    On the front lines with the fact-checkers and soldiers in the information war
    BY SIMON SHUSTER


    ![image](images/redSmileinvertGettyImages-86217278_ext.png)


    One morning in November of 2016, Simon Hegelich, a professor of political science
    at the Technical University of Munich, was surprised to get an invitation from
    Angela Merkel. The German chancellor said she wanted to hear about his research
    on the manipulation of voter sentiment. Less than two weeks earlier, the U.S.
    election had ended in victory for Donald Trump, and the postmortems were full
    of buzzwords Merkel urgently needed to understand: filter bubbles, bots, fake
    news, disinformation, much of it related to the claims that Russia had somehow
    hijacked the election.


    What was past, Merkel said, may be prologue. The chancellor knew that her bid
    for a fourth term in office might be subject to the same dirty tricks allegedly
    employed in the `U.S.` race. As Europe’s most powerful leader and a determined
    critic of the Kremlin, Merkel has sounded alarms over Russia’s alleged “disinformation”
    campaigns in Germany. Emails were stolen from her political allies in 2015 by
    the same hackers who later targeted the `U.S.` race. During her more than 12 years
    in power, Merkel has also watched the Kremlin’s media apparatus air broadsides
    against her policies in a variety of languages.

