  trans: '

    Ormandy 在 Cloudflare 没有熟人，而且在三天长假前的傍晚，他不忍心在这个时候拨打他们的通用支持热线。于是，他采取了他能想到的折中。Ormandy
    上 Twitter 上向他在那里的数万关注者发起了求助。


    “能不能请一位 Cloudflare 的安全人员紧急联系我？”


    时间戳显示是太平洋标准时间下午 5:11。


    Ormandy 并没有费心通过“@”符号标记该公司的 Twitter 账号来提醒他们。他不需要这样做。在狂热的信息安全专业人士社区中，他的声望极高，以至于在
    Ormandy 点击“发送”后的 15 分钟内，世界上所有需要知道消息的人（以及许多不需要的人）都看到了这条备注。


    当地时间凌晨 1:26，John Graham-Cumming 的手机插在伦敦床边的插座上，震动声将他吵醒。这位 Cloudflare 的首席技术官揉了揉眼睛，伸手去拿起震动的听筒。是一个未接来电。一位同事——Graham-Cumming
    少数几个允许在午夜后联系他的白名单人员之一——打了电话。这位 CTO 发了一条短信询问怎么了。


    他的同事立即回复了。


    “非常严重的安全问题”


    Graham-Cumming 惊恐地坐起并回复道：


    “我这就上线”


    CTO 从床上起来，下楼来到地下室，拿了为了应对这种情况而准备的应急包——充电器、耳机、备用电池。他启动笔记本电脑，迅速加入了与 Cloudflare 加州州总部同事的
    Google Hangout 会议。


    安全团队向他简报了正在演变的态势。Google 的 Project Zero 团队在 Cloudflare 的基础设施中发现了一个漏洞——一个严重的漏洞。运行超过
    600 万个客户网站（包括 FBI、纳斯达克和 Reddit 的网站）的服务器发生了数据泄露。任何人都可以访问由 Cloudflare 支持的网站，并在某些情况下获取其网络上另一个网站用户的私密详细信息——如身份验证令牌、Cookie、私信，这些用户包括
    Uber、1Password、OKCupid 和 Fitbit。


    这些信息就隐藏在显眼处。糟糕的是，搜索引擎和其他网络爬虫过去几个月来已经在其缓存中存储了这些泄露的数据。仅仅堵住漏洞并不能完全解决问题。


    “我把它比作溢油事故，”Graham-Cumming 说，“堵住油轮侧面的一个孔很容易，但你会有大量的海床需要清理。”


    于是，Cloudflare 的工程师们开始工作。安全主管 Marc Rogers 在业余时间担任美国电视网黑客剧集《机器人小姐》的顾问，他领导了分拣工作。在不到一小时内，团队发布了首个缓解更新，在全球范围内堵住了该漏洞。几小时后，技术人员成功回滚了导致该错误的功能。在
    Ormandy 发出推文近七小时后，Cloudflare 的工程师们成功促使主要搜索引擎（谷歌、微软、雅虎）清空了它们的历史网页缓存。


    这是一个非常漫长的假假的开始。Cloudflare 的工程师们在剩下的时间里评估了泄露了多少以及什么类型的数据，以及这场混乱蔓延到了多大范围。


    Google 的 Project Zero 团队最初对 Cloudflare 的快速响应留下了印象，Cloudflare 在安全事务方面以透明度闻名。但随着双方团队就何时公开发生的事情协商，关系开始出现裂痕。两家公司初步同意最早在
    2 月 21 日周二发布公告。随着一天天晚，Cloudflare 决定需要更多时间清理。周二变成了周三。周三变成了周四。Google 态度硬了：周四下午是两家公司发布泄露细节的日子，Ormandy
    将其称为“Cloudbleed”（云端出血），无论 Cloudflare 是否完成了评估并确保泄露的数据已从在线缓存中清除。


    两份公告均于 2 月 23 日发布。随后发生了为期一周的互联网恐慌。


    包括微软和苹果在内的许多公司都有内部安全研究团队来调查自己的软件。但很少有团队专门关注其他公司制造的软件。这让 Google 显得如此不同寻常。对于 Ormandy
    和组成 Google Project Zero 的十几个左右顶尖计算机破解高手来说，他们的管辖范围没有边界——任何触及互联网的东西都是猎物。监管网络空间不仅对人类有益，对商业也有好处。


    Google 于 2014 年正式成立了 Project Zero，但该小组的起源可以追溯到五年前。通常需要一个紧急情况才能驱动大多数公司认真对待安全。对于
    Google 来说，那个时刻就是“极光行动”。


    2009 年，一个与中国政府有关的网络间谍组织入侵了 Google 以及其他几家科技巨头，突破了他们的服务器，盗取了知识产权，并试图监视他们的用户。这次掠夺让
    Google 的高层高管非常愤怒，以至于公司最终因此离开了退出了中国这一全球最大的市场。


    这一事件特别让 Google 联合创始人 Sergey Brin 感到困扰。计算机取证公司和调查人员确定，公司被入侵并不是因为 Google 自身的软件有缺陷，而是通过
    `Microsoft Internet Explorer 6` 中一个未修补的漏洞。他在想，为什么 Google 的安全要取决于其他公司的产品呢？


    在随后的几个月里，Google 开始更加激进地要求竞争对手修复其软件代码中的漏洞。Google 与其同类公司之间的战斗很快变成了传奇。在其中几次冲突的中心，正是臭漏洞猎人
    Tavis Ormandy，他以其修复漏洞的强硬手段而闻名。（Ormandy 拒绝了本文故事的采访。）


    Google 静静地开始将后来在 2014 年成为 Project Zero 的内容正式化。公司建立了一套协议，并允许 Chris Evans（与美国队长无血缘）前
    Google Chrome 安全负责人执政。Evans 随后开始招募 Google 员工和其他加入团队。


    他签下了 Ian Beer，一位出生在英国、定居瑞士的安全研究人员，他展现出了破解 Apple 编码错误的天赋。他请来了 Ormandy，一位英国硬汉，以与微软之间引发的广为人知的冲突而闻名。Evans
    招募了 Ben Hawkes，一位以消灭 Adobe Flash 和 Microsoft Office 漏洞而闻名的新西兰人。他还邀请了 George Hotz，这是一个早慧的青少年，今年早些时候在一次黑客大赛中破解
    Google Chrome 浏览器后赢得了 15 万美元，担任实习生。（目前 Project Zero 的成员拒绝了多次就他们的工作接受采访的请求。）

