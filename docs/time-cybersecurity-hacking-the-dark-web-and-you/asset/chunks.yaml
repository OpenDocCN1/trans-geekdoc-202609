  raw: 'Election 2016 was a step well beyond anything that had come before. After
    the Illinois hack and a similar one at about the same time in Arizona, “we realized
    we were playing a different game,” says former White House cybersecurity coordinator
    Michael Daniel. The Russians weren’t just stealing information for the purposes
    of collecting intelligence. Instead, Daniel’s team concluded, they were showing
    a possible intent to meddle with the vote.


    Illinois discovered the intrusion on July 12, when the hackers triggered an alarm
    by trying to download the whole file of 15 million voters. Illinois officials
    took the system offline and found that about 90,000 files had been stolen, more
    than 75,000 of which included personal data like driver’s-license numbers and
    the last four digits of the voters’ Social Security numbers. When Illinois reported
    the news to the FBI in late July, the bureau dispatched a tactical Cyber Action
    Team to the state capital, Springfield, where the computers are kept.


    Fortunately for the feds, Illinois officials had kept a full backup of all the
    data on the system from before the SQL attack, so the FBI was able to track what
    the hackers had done. Bureau agents found that while they were inside, the hackers
    had attempted to alter and delete information in the voter rolls. In particular,
    they had tried to change voters’ names and addresses. As far as the agents could
    tell, none of the efforts had been successful. Most important, Illinois had recorded
    the IP addresses of the attackers. Those digital finger­prints and the techniques
    the hackers had used, combined with the intelligence reporting on Russian plans,
    convinced the feds that the attackers were a group, known as Fancy Bear, that
    operates as an arm of Russian military intelligence (GRU).


    At first, says a former senior White House official, that revelation “was terrifying.”
    For a week or so starting in late July, the feds faced the prospect that Russia
    might be planning to physically hack into the voting machines and fiddle with
    the vote count. The urgent need: to figure out if Moscow could actually swing
    the election. As it turned out, the White House had on staff one of the country’s
    leading experts in voting-machine manipulation, professor Ed Felten of Princeton,
    who was serving as deputy to the U.S. chief technology officer. Felten had famously
    been the first academic to obtain a Diebold voting machine and publish a public
    study showing it could be compromised.


    With colleagues from the National Institute of Standards and Technology who had
    written the benchmarks for electronic-voter-machine security, Felten and Daniel
    concluded that hacking voting machines was technically possible. “In many places
    in the U.S., there are touchscreen voting machines, which are vulnerable to manipulation
    by someone who gets access ahead of time,” Felten says. The cyberteam began worrying
    that Russia might try to compromise a poll worker and gain access to touchscreen
    machines before the election. But doing that in a way that could alter the outcome
    of the election was very hard. First, the attackers would have to know which districts
    could affect the outcome. Then they’d have to change just enough votes to ensure
    victory without switching so many that it would draw attention.


    That didn’t mean all was well. The whole point of the election wasn’t just to
    count ballots; it was for the U.S. to reach consensus that the democratic will
    of the people had been freely and fairly expressed. Hacking the consensus was
    much easier. “We concluded that Russia could erode the confidence of millions
    of voters and undermine our ability to conduct free and fair elections,” says
    Anthony Ferrante, the former director for cyber­incident response at the National
    Security Council, who ran the frontline efforts to combat the Russian operation.


    Since May, U.S. spy hunters had seen evidence that Russia’s military intelligence
    might try to damage the expected winner, Hillary Clinton. The intel was incomplete
    but pointed in the same direction: an initial report of a bragging GRU official
    that month was followed by other intelligence reports indicating a widespread
    willingness to interfere. In the wake of the Illinois intrusion and on the basis
    of the intelligence it had received, the White House team by mid-August believed
    there were three main ways Russian president Vladimir Putin could under­mine the
    integrity of the vote.


    Knowing all this, Ferrante began working up an emergency plan for what to do on
    Election Day, and the day after, if the Russians attacked the vote. Drawing on
    the insights of election experts at the Justice Department, the FBI and DHS, Ferrante
    scrambled to figure out what powers the federal government had, legally, to push
    back.


    But it turned out the credibility of the vote would come into question well before
    Election Day. And rather than the Russians, it would be the government of the
    U.S. that would be suspected, by some Americans at least, of subverting the vote.


    Which may partly explain why the atmosphere was so tense when Secretary of Homeland
    Security Jeh Johnson convened a conference call on August 15 with representatives
    of election officials from every state across the country. On August 3, Johnson,
    an Obama appointee, said he was considering declaring elections part of the U.S.
    critical infrastructure, along with things like the banking and electrical systems.
    That designation would give the federal government access to state-level voter
    information and would open regular lines of communication with local election
    officials. On the August 15 call, Johnson said DHS stood ready to help the states
    by conducting vulnerability scans, providing what he said could be “actionable
    information” about threats and delivering cybertools to help protect election
    systems from intrusion. But some of the states were less concerned about outsiders
    than they were about federal overreach, according to Johnson and several participants
    in the call. States didn’t know what being declared critical infrastructure meant
    and were suspicious for partisan reasons: Were Democratic officials in Washington
    preparing to take control of the nation’s polling places? The call grew contentious
    as participants felt the feds were encroaching on the constitutional authority
    of states to run elections. “We secretaries of state were faced with an issue
    where there were perhaps foreign actors trying to get into our databases,” says
    Arizona’s Michele Reagan, a Republican and one of the first victims of the Russian
    hack. “And their answer was ‘Let’s just take over the election infrastructure,’
    which goes against the Constitution and our state law.”


    The atmosphere of mistrust of the feds was hampering the White House’s ability
    to respond to the Russian attack too. Obama was already worried about the possibility
    of escalating the cyberwar with Moscow if he retaliated for the ongoing Russian
    hack, senior White House officials privately said at the time. With Trump fueling
    antigovernment suspicion, Obama was even less inclined to take strong measures
    against Moscow, in part because of the danger of seeming political. Coming out
    hard against Russia, which was widely believed to favor Trump, Obama thought,
    would make it look as if the White House was trying to help get Clinton elected.
    “It was pervasive in the discussions,” says a former senior White House official,
    “because some state officials were questioning whether some of our actions were
    advancing the interests of the Democratic Party.”'
