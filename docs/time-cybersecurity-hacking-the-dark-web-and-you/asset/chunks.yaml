- fmt: '

    Exactly what “obey us” meant wasn’t clear. The initial message from the hackers,
    who later identified themselves in emails to selected reporters as the “Guardians
    of Peace,” also praised another group: “Thanks a lot to God’sApstls contributing
    your great effort to peace of the world.”


    As it turned out, “God’sApstls` had emailed Lynton, Pascal, and three other Sony
    executives three days before the attack, demanding a payoff. “We’ve got great
    damage by Sony Pictures. The compensation for it, monetary compensation we want.
    Pay the damage, or Sony Pictures will be bombarded as a whole. You know us very
    well. We never wait long. You’d better behave wisely.” The menacing messages did
    not specify how much of a payoff was being demanded. Sony executives forwarded
    the email to the `FBI`, according to spokesperson Lawson.


    Neither “God’sApstls” (which was never heard from again) nor the GOP mentioned
    The Interview.


    Hours after Sony’s computers went dark, Nicole Seligman, the president of Sony
    Entertainment, notified the `FBI`. That afternoon a team of agents from the bureau’s
    Los Angeles cybersquad arrived on the lot. Sony also retained forensic investigator
    Mandia.


    Inside Sony Pictures, employees were left to work with pens and paper. The studio
    issued 190 `Blackberrys` to key employees. Shops on the lot took only cash. “It
    is possible that some or all of this disruption will continue over the Thanksgiving
    Holiday,” the studio advised them. “We appreciate your efforts to find work arounds.”


    Then, starting on December 1, after again alerting reporters through emails, the
    hackers began dumping heaps of stolen documents, many of them deeply personal,
    onto file-sharing sites. The first batches included confidential performance evaluations,
    family medical records, criminal background checks, disciplinary memos over workplace
    affairs, passport information, and salary details for everyone at Sony. The studio
    had maintained little control over even sensitive information prized by identity
    thieves. Analysis by a data protection firm called `Identity Finder` found, for
    example, that Sony had left Social Security numbers for 47,426 people (including
    many who hadn’t worked at the company for years) in more than 600 files lacking
    password protection or encryption.


    More dumps followed, one every few days, each triggering a new crisis as reporters
    pored through Sony’s business and, especially, its dirty laundry. “It was a nightmare,”
    says one executive working on the studio lot. “Just when you think you’d gotten
    over one—it was starting to get quiet and calm—boom, you’d get hit with something
    else that was even crazier.”


    Pascal’s email exchanges with producer Scott Rudin proved especially cringeworthy
    and were widely disseminated in the press. They included nasty comments about
    celebrities like Angelina Jolie (Rudin called her a “minimally talented spoiled
    brat”); insensitive banter about President Obama’s presumed taste for black-themed
    films (“Should I ask him if he liked `DJANGO`?” she wrote); and knockdowns over
    their film deals (“Do not fucking threaten me,” Pascal warned Rudin at one point.
    As she routinely did, Pascal forwarded this last exchange to Lynton, who scolded:
    “You are both crazy to put this in an email.”)


    After the embarrassing headlines, Pascal issued a public apology, then sought
    forgiveness in meetings with Sony employees and Rev. Al Sharpton, who had threatened
    to demand her head over the Obama comments. “I feel like I’ve been raped,” she
    privately told a studio visitor. “And I was blamed for it.”


    Sony tried vainly to bottle it all up. In mid-December the studio retained attorney
    David Boies, who warned 40 media organizations (including `Fortune`) not to use
    the stolen information or they would be held “responsible for any damage or loss.”
    Boies asserted the documents were, variously, “private,” “confidential,” and “trade
    secrets,” and protected under an array of U.S. and foreign legal doctrines. Many
    news outlets, including the `Wall Street Journal`, `Bloomberg` and `Reuters`,
    published articles using the emails nonetheless. (Boies even wrote `Twitter`,
    seeking to shut down Val Broeksmit, leader of an indie band called `Bikini Robot
    Army`, whose tweeted screenshots of hacked Sony emails had won him 19,000 followers.
    `Twitter` suspended his account for just a day. Broeksmit, who was contacted by
    Boies, blew him off.)


    That was all a sideshow. Sony’s biggest problem was The Interview. The media first
    raised the prospect that North Korea had hacked Sony because of the film on November
    28, four days after the attack. The GOP made no reference to The Interview until
    December 8, when it demanded that Sony, having “refused to accept” its previous
    terms, “stop immediately showing the movie of terrorism.” Rogen and Franco, meanwhile,
    had continued their promotional tour, maintaining the studio’s line—as Rogen put
    it on `Good Morning America` on December 15—that The Interview “wasn’t meant to
    be controversial in any way.”


    The GOP intensified its threats. It had already made ominous statements about
    the safety of studio employees’ family members if its demands were not met. Then,
    on December 16, the hackers, vowing a “bitter fate” for “those who seek fun in
    terror,” claimed it would attack movie theaters screening the “awful movie Sony
    Pictures Entertainment has made. The world will be full of fear,” they warned.
    “Remember the 11th of September 2001. We recommend you to keep yourself distant
    from the places at that time.”


    The outrageous statements, made by an anonymous group seemingly able to wield
    great power, had their intended effect. Fear gripped the movie world. All five
    big theater chains, citing security concerns but also scared of ruining their
    holiday box office, told Sony they wouldn’t show the film. The Interview had been
    scheduled to open on 3,500 screens. Lost in the anxiety: word from the `Department
    of Homeland Security` that it had “no credible intelligence to indicate an active
    plot against theaters.”


    On December 17, Sony issued a statement, saying it was “deeply saddened at this
    brazen effort to suppress the distribution of a movie” and insisting, “We stand
    by our filmmakers and their right to free expression.” But Sony wasn’t standing
    by the movie; it was shelving it. “In light of the decision by the majority of
    our exhibitors not to show the film,” the studio announced, it was scrapping the
    Christmas release.


    Lynton would later insist that the chains’ withdrawal had left him with no choice,
    commenting: “This was not our decision.” In fact, a group of least 150 independent
    theaters were eager to show the movie. Tim League, CEO of Austin-based `Alamo
    Drafthouse Cinema`, says he quickly notified Sony that his 19-location chain wanted
    to show it, as did other members of the `Art House Convergence`. But Sony refused
    to let them have it.


    Late in the day on December 17, when journalists asked about releasing the film
    through video on demand (`VOD`) or streaming services like `Netflix`—a way to
    bypass the threat to theaters—the studio issued a second statement ruling out
    any option: “Sony has no further release plans for the film.”


    A day later the hackers demanded that Sony also yank “everything related to the
    movie, including its trailers.” The studio did this too, pulling TV advertising,
    canceling press screenings, even abandoning promotional `Facebook` and `Twitter`
    accounts. (Sony’s spokesperson says, “This was not an effort to appease hackers.
    There was no national release so the prudent thing to do was to stop the marketing
    efforts.”) The Interview, the press reported, wasn’t to see the light of day.
    The hackers had won.


    Whodunit? Twenty-five days after the hack, the `FBI` attributed the Sony attack
    to North Korea. The determination came extremely fast, and it was rare for the
    agency to identify a government as the culprit.

