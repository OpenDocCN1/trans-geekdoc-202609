    Election 2016 was a step well beyond anything that had come before. After the
    Illinois hack and a similar one at about the same time in Arizona, “we realized
    we were playing a different game,” says former White House cybersecurity coordinator
    `Michael Daniel`. The Russians weren’t just stealing information for the purposes
    of collecting intelligence. Instead, Daniel’s team concluded, they were showing
    a possible intent to meddle with the vote.


    Illinois discovered the intrusion on July 12. The hackers had attempted to download
    `15 million` `voter` files, which had included `90,000` `Social Security` numbers
    and `75,000` `driver-license` numbers. In the wake of the attack, the `FBI` and
    `DHS` worked with state officials to determine the extent of the breach.


    The investigation into the hack revealed that two Russian intelligence agencies,
    the `GRU` and `VR`, were operating differently. The `GRU` and `Fancy Bear` had
    targeted the email accounts of state and state election officials, while the `GRU`
    had also gained access to some voter registration systems and attempted to change
    the `voter` numbers.


    The goal of the operation was not just to steal information but also to undermine
    public confidence in the election process. “The goal was to create chaos and to
    make people doubt the integrity of the vote,” says `Michael Daniel`.


    The investigation into the 2016 election interference is ongoing, and many questions
    remain to be answered about the extent of the Russian influence and its impact
    on the final results.

