    ## 从农到浏览器


    ![image](img/shutterstock_editorial_1931699m_huge.png)


    ## 互联网存在哪里？


    这个问题的答案可能并非“无处不在”——至少目前如此。答案很大一部分是数据中心，或称“服务器农场”，例如由 `Google` 运营的这一处。随着世界对信息的需求增加，这些巨大的计算机群数量不断增加。根据行业研究公司
    `IDC` 分析师的数据，全球数据中心空间将继续膨胀，从 2013 年的 15 亿平方英英到 2018 年的 194 亿平方英。


