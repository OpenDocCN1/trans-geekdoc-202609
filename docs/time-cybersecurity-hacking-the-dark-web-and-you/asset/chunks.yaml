    Heavier forces waited in the wings. The White House plan included the possibility
    of deploying active and reserve components of the military. “The Department of
    Defense may support civil authorities in response to cyber-incidents based upon
    a request from a federal agency, and the direction of the Secretary of Defense
    or the President,” the plan said. Two people familiar with it say the idea was
    to make the Pentagon’s cyber-experts available to mitigate and investigate an
    attack.


    At 6 a.m. on Election Day 2016, Ferrante opened the door to the “second Situation
    Room,” a carbon copy of the president’s secure West Wing conference room a stone’s
    throw away in the Eisenhower Executive Office Building. On a secure video teleconference
    system, the team dialed into the `FBI` and `DHS` command posts that were running
    the Election Day response. They were joined by election-crimes coordinators from
    the Justice Department and cyber-intelligence agents at the Office of the Director
    of National Intelligence. Russia experts at `CIA`, the `National Security Agency`
    and other intelligence agencies were standing by on the classified `Joint Worldwide
    Intelligence Communications System` email system.


    Over the course of the day, reports came in that made the group think it might
    be seeing a repeat of Riverside County, or worse. In Colorado, the election voter
    database went down for 30 minutes. In Utah, lines formed in what had become an
    unlikely battleground thanks to the independent candidacy of Evan McMullin. At
    one point, sensitive intelligence came in that needed to be run to ground. But
    ultimately the level of disruption was no greater than in any normal national
    election, and all in all, the vote went off smoothly. As the polls closed, and
    the election was called for Donald Trump, some on the White House cyber-team celebrated
    the fact that there had been no disruptive attack.


    On November 25, amid talk of possible challenges to the vote in Wisconsin, Pennsylvania
    and Michigan, the Obama White House released a statement saying, “We stand behind
    our election results, which accurately reflect the will of the American people
    [and] believe our elections were free and fair from a cyber-security perspective.”
    But even as the calls for recounts faded, doubts about the security of the election
    system spread.


    A senior intelligence official tells `TIME` that although the cybersecurity officials
    at the `FBI`, `DHS` and the White House may have been scrambling to secure the
    vote throughout the fall, the counter-intelligence operation at the bureau aimed
    at uncovering whether the Russian operation was trying to aid Trump only began
    in earnest once the election was over. Given the focus of `FBI` cyber- and counter-intelligence
    officials on Hillary Clinton’s emails, this looks like a spectacular blunder in
    retrospect. The Russia counter-intelligence probe “never got any intelligence
    legs until after the election,” the senior official says, “because I don’t think
    anybody believed Trump would win, so nobody really put a lot of stock into the
    Russian attempts [to help him].”


    At the same time, some division remained over who the real threat was to America’s
    electoral system. Georgia was the only state that didn’t accept some form of assistance
    from the federal government, according to officials familiar with the matter.
    But as the Georgians looked for intruders themselves, they found a `DHS` employee
    scanning their system on November 15. `DHS` looked into the matter and said it
    was an employee of the federal training facility in Glynco, Ga., who was confirming
    that job applicants had licenses to be armed guards—information that is on the
    same system as the voter data. The `DHS` inspector general, John Roth, looked
    into the matter and concluded in June that `DHS` employees did not conduct any
    unauthorized scans of the Georgia election system.


    If some state officials remain angry about the perceived threat of federal overreach,
    many also appear to be in denial about the extent of the risk from overseas. The
    Russians succeeded in compromising more than 20 state systems, according to Jeanette
    Manfra, a senior Homeland Security official. But calls by `TIME` to the offices
    of election officials in every state revealed only two, Arizona’s and Illinois’s,
    that know or are willing to admit they were hacked. And when `TIME` asked Illinois
    to confirm that the Russian intruder had tried to alter data fields, state officials
    at first denied that had happened, but after checking with their technical team,
    they confirmed that it had.


    In Riverside County, election security remains front and center. In July 2017,
    California governor Jerry Brown signed the `Voter Integrity Protection Act`, which
    allows counties to inform voters by text or email if any part of their voter-registration
    information is changed. DA Hestrin still worries about continuing voter doubts,
    however. “People’s faith in the system is a fragile thing,” he says. “Once people
    lose faith that the elections are fair and honest, then our entire system of government
    is in jeopardy.”


    ![image](images/170731053777.png)


    ### ICY EXCHANGE

    In a “candid, blunt and businesslike” meeting at a G-20 summit in Hangzhou, China,
    in September 2016, President Obama warned Vladimir Putin against “Wild West” hacking
    wars.


    ![image](images/170731053776.png)


    ### TÊTE-À-TÊTE

    President Trump met with Putin not once but twice at the G-20 summit in Hamburg
    in July 2017. The undisclosed second conversation took place during a dinner and
    without any other U.S. officials present.


    ### SOURCES: CURRENT AND FORMER SENIOR CYBERSECURITY OFFICIALS


