    # 零项目 (Project Zero)


    在 Google 的 `Project Zero` 正式成立三年来，这支精英黑客小队已经建立了全球最有效的计算机漏洞消灭者之一的声誉。尽管普通消费者可能认不出他们中的任何一个名字——James
    Forshaw、`Natalie Silvanovich`、`Gal Beniamini`——但世界对他们感激之尽，因为是他们封堵了运行我们数字生活的设备和服务的漏洞。该团队负责了其他公司产品的一系列改进，包括发现并帮助修复了超过一千个针对操作系统、反杀病毒软件、密码管理器、开源代码库和其他软件的安全漏洞。`Project
    Zero` 至今已发布了近 80 关于其工作的博客文章，这些当今网络上最优秀的公共安全研究。


    团队的工作间接惠及了 Google 的核心业务：在线广告。保护互联网用户免受威胁，意味着保护公司向这些用户投放广告的能力。`Project Zero` 向供应商施加压力的努力也迫使他们修复导致
    Google 产品崩溃的漏洞。


    根据 `Cloudflare` 首席执行官兼创始人 `Matthew Prince` 的说法，Google 顶尖漏洞猎人发现的泄露最初让他的公司损失了大约一个月的增长。如果他对比这段经历感到一丝酸涩，`Prince`
    也没有表现出来。他知道被真正怀恶意的黑客针对是什么感受。几年前，一个名为“UGNazi”的黑客组织入侵了 `Prince` 的个人 `Gmail` 账号，利用它获取了他的企业邮箱的控制权，并劫持了
    `Cloudflare` 的基础设施。这些暴徒本可以造成巨大的损害。相反，他们决定将 `4chan.org`（一个常见的黑客聚集地）重定向到他们的个人 Twitter
    资料以进行宣传。


    `Prince` 仍然遗憾没有在 Google 和 `Cloudflare` 发布最初调查结果之前就向客户说明 `Cloudbleed` 问题的全部范围。他希望公司能在客户从新闻报道中读到泄露消息之前就早地警了他们。尽管如此，`Prince`
    回顾时认为，`Project Zero` 团队在披露时机上是正确的。“因为那 14 天，我多了很多白发，而且可能比以前少活一年，”`Prince` 在谈及该发现和泄露后果时说道，“感谢天谢，是
    `Tavis` 和那个团队发现了它，而不是某个疯狂的黑客。”


    ![image](img/20140710-GOOGLE-PROJECT-ZERO-014.png)


    **CHRIS EVANS** 他创立了 Google 的反黑客团队。


    ## 价格表：漏洞赏金


    一些公司会奖励发现其产品缺陷的研究人员。以下是部分奖金示例：


    ![image](img/GettyImages-637159024.png)


    *   **GOOGLE**: Android 操作系统 — 每个漏洞高达 200,000 美元

    *   **TESLA**: 特斯拉 Model S 轿 — 每个漏洞高达 10,000 美元

    *   **APPLE**: Apple iOS 操作系统 — 每个漏洞高达 200,000 美元

    *   **CLOUDFLARE**: 互联网服务 — 漏洞奖励 T 恤和免费试用

    *   **DEPT. OF DEFENSE**: 美国国防部公共网站 — 所有漏洞共享 150,000 美元的奖池

    *   **UNITED AIRLINES**: 网站和应用 — 每个漏洞高达 100 万英里

    *   **NETGEAR**: 路由器、应用和服务 — 每个漏洞高达 15,000 美元

    *   **ORACLE**: 任何产品或服务 — “感谢”，即在修复建议中注明致谢


    ![image](img/GettyImages-613744318.png)


    **MATTHEW PRINCE** 技术公司 `Cloudflare` 首席执行官


    ## 漏洞女皇解释漏洞经济学


    ![image](img/ZER07_A.png)


    **KATIE MOUSSOURIS** Luta Security 首席执行官


    正如 `Katie Mousssouris` 告诉 `Robert Hackett` 的那样：


    > “漏洞有两个市场：进攻防御。前者由国家机器、有组织犯罪集团和其他攻击者组成。后者由漏洞赏金计划和销售安全产品的公司组成。进攻市场的价格更高，且没有上限。他们买的不只是漏洞或利用工具；他们买的是在不被发现的情况下使用它的能力。他们买的是沉默。防御市场付不了那么多。供应商并不会给他们的顶尖开发者支付百万美元。尽管大公司的代码质量正在提高，但复杂性仍在不断增加。这意味着更多的漏洞。安全研究人员如何处理特定漏洞取决于他们的财务需求、对某款软件或供应商的态度，以及他们个人的风险。这并不是简单的黑帽卖家对白帽黑客。”


    ## 代码战争


    互联网是一个战场。奖品是你的信息，而漏洞是武器 BY `LEV GROSSMAN`


    ![image](img/140630059014.png)


    **HACK STAR** 安全专家 `Aaron Portnoy`


    `Aaron Portnoy` 在还在读高中时就开始了他的黑客生涯，当时在位于伍彻斯特的马萨诸塞数学与科学学院，这并非巧合，那正是他入侵的那所学校。他是这样做的：`Portnoy`
    让一个朋友打给其中一个宿舍，假装成技术支持。学生们非常乐意把密码交给了他。躲在这些借来的账号后面，并通过各种外国国家的代理服务器进行路由，`Portnoy`
    通过系统中的一个漏洞进入学校网络，这种漏洞在技术上被称为漏洞，或者更技术地称为零日漏洞。“我访问了所有的邮件、成绩、一切内容，”他说。“他们的配置上存在许多问题，让我可以随意渗透到各处。”


    回想起来，表现出相当克制的是，`Portnoy` 修改了学校的网站，写了一些关于另一个同学的负面评价。然后他离开了。后来学校请了技术专家追踪入侵行为，但他们无法将其追溯到他身上。


    因此自然地，`Portnoy` 第二年又做了一次并被抓住了。学院鼓励他寻找其他的教育场所。这其实并不重要。他从当地的高中毕业，并进入了东北大学。这一切对于他现在的职业工作都是极佳的准备：研究并销售软件漏洞，自他高中时代起，这已成为行业中更新且更具争议的商品之一。


    `Portnoy` 今年 32 岁，在防务安全公司 `Raytheon` 担任安全工程师，他在德克萨斯州奥斯汀创立了一家名为 `Exodus Intelligence`
    的公司。其使命声明写道：“我们的目标是为客户提供独家零日漏洞的可操作信息、能力和背景支持。”


