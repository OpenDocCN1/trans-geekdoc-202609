    更强大的力量在后方待命。白宫的计划中包含了部署军现役和预备役部队的可能性。该计划指出：“根据联邦机构的请求，并国防部长或总统的指示，国防部可能会支持民事当局应对网络事件。”
    两位知情人士透露，这一构想的想法是让五角陆大楼的网络专家投入使用，以缓解和调查攻击。


    2016 年选举当天凌晨 6 点，费兰特（Ferrante）开启了“第二号情势室”的大门，那是艾森豪威尔行政办公大楼内一石之隔、总统西翼安全会议室的复刻版。在一个安全的视频电话会议系统上，团队拨通了正在处理选举日响应工作的`FBI`和`DHS`指挥部。加入他们的是来自司法部的选举犯罪协调员以及国家情报局长办公室的网络情报特员。`CIA`、`国家安全局`及其他情报机构的俄罗斯专家已经在机密的`全球联合情报通信系统`（Joint
    Worldwide Intelligence Communications System）邮件系统待命。


    在这一天中，报告不断传来，让小组认为他们可能正在目睹河滨县事件重演，甚至更糟。在科罗拉多州，选举选民数据库宕机了 30 分钟。在犹州，由于埃文·麦克穆林（Evan
    McMullin）的独立竞选，那里已变成一个意料之外的战场，排起了长队。一度，收到了需要进行封锁的敏感情报。但最终，干扰程度并不超过任何正常的全国性选举，总而言之，投票进展顺利。随着投票站关闭，唐纳德·特朗普宣布当选，白宫网络团队的一些成员庆祝并没有发生破坏性攻击。


    11 月 25 日，在对威斯康星州、宾夕法尼亚州和密歇根州选举提出挑战之际，奥巴马白宫发布一份声明称：“我们支持我们的选举结果，这些结果准确反映了美国人的意愿，且我们相信从网络安全的角度来看，我们的选举是自由且公正的。”但尽管重新计票的呼逐渐平息，对选举系统安全的疑虑仍在蔓延。


    一位高级情报官员告诉《时代》周刊，尽管`FBI`、`DHS`和白宫的网络安全官员在整个秋天可能一直在忙于奔波确保投票安全，但该局旨在揭露俄罗斯行动是否试图帮助特朗普的局内反间谍行动，直到选举结束后才开始认真进行。鉴于`FBI`网络和反间谍官员重点关注希拉里·克林顿的邮件，回过来看，这看起来像是一场极其惨重的失误。这位高级官员表示，针对俄罗斯的反间谍调查“在选举之前从未获得过任何情报支持，因为我不认为有人会相信特朗普会赢，所以没有人真正看重俄罗斯的（[帮助他的]尝试’。”


    与此同时，对于谁是美国选举系统的真正威胁仍存在分歧。据知情人士透露，乔治亚州是唯一没有接受联邦政府任何形式援助的州。但当乔治亚人自己寻找入侵者时，他们在 11
    月 15 日发现一名`DHS`员工在扫描他们的系统。`DHS`调查了此事并表示，那是乔治亚州格林科联邦培训设施的一名员工，正在确认工作申请人是否持有武装守卫执照——这些信息与选民数据在同一个系统中。`DHS`监察长约翰·罗斯（John
    Roth）调查了此事，并在 6 月份得出结论，认为`DHS`员工没有对乔治亚州选举系统进行任何未经授权的扫描。


    尽管一些州官员对认为联邦过度扩张感到愤怒，但许多人似乎对海外风险的程度处于否认状态。根据国土安全部高级官员珍内特·曼弗拉（Jeanette Manfra）介绍，俄罗斯人成功破解了超过
    20 个州的系统。《时代》杂志对每个州选举官员办公室的询问显示，只有亚利桑那州和伊利诺伊州知道或愿意承认自己曾被黑客攻击。而当《时代》询问伊利诺伊州确认俄罗斯入侵者曾试图更改数据字段时，州官员最初否认发生这种情况，但在与其技术团队核实后，他们确认了确实发生过。


    在河滨县，选举安全仍然是核心问题。2017 年 7 月，加利福尼亚州州长里·布朗（Jerry Brown）签署了《选民诚信保护法案》，允许县级在选民注册信息发生变化时通过短信或电子邮件通知选民。然而，检察官赫斯特林（Hestrin）仍在担心选民持续产生怀疑。他说：“人们对系统的信任是脆弱的。一旦人们失去了对选举公平诚实的信任，那么我们整个政体体系就会面临危险。”


    ![image](img/170731053777.png)


    ### 冷冰交流

    2016 年 9 月，在中国杭州举行的 G20 峰会上的一次“坦诚、直率且公事公”会议上，奥巴马总统警告弗拉基米尔·普京不要进行“西部西部”式的黑客战争。


    ![image](img/170731053776.png)


    ### 面对面

    特朗普总统在 2017 年 7 月汉堡举行的 G20 峰会期间与普京会了两次。未公开的第二次会话发生在晚餐期间，且没有其他美国官员在场。


    ### 来源：现任及前任高级网络安全官员


