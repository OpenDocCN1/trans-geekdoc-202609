  trans: '


    “服从我们”的具体含义并不明确。黑客最初发出的信息中（他们随后在发给选定记者的邮件中自称为“和平守护者”），还顺便赞美了另一个团体：“非常感谢 God’sApstls
    为世界和平贡献巨大努力。”


    事实证明，“God’sApstls”在攻击发生三天前曾向林顿（Lynton）、帕斯卡（Pascal）和另外三名索尼高管发送邮件，要求索要。“索尼影业遭受了巨大的损失。我们需要金钱补偿。支付损失费，否则索尼影业将面临毁灭性的轰炸。你们对我们非常了解，我们不会等太久。你们最好明智一点。”这些威胁性信息并未说明具体的索要金额。根据发言人劳森（Lawson）介绍，索尼高管将该邮件转发给了
    `FBI`。


    无论是“God’sApstls”（再也没有出现过）还是 GOP，都没有提到《会面》（The Interview）。


    在索尼电脑瘫痪几小时后，索尼娱乐总裁尼科尔·塞尔格曼（Nicole Seligman）通知了 `FBI`。当天下午，该局洛杉矶网络小组的探员抵达了片场。索尼还请了法医调查员曼迪（Mandia）。


    在索尼影业内部，员工被迫用纸笔工作。制片厂向关键员工发放了 190 台 `Blackberrys`。片场内的商店只收现金。制片厂建议他们：“这种干扰可能会持续到整个感恩节假期。我们感谢你们努力寻找通融方案。”


    随后，从 12 月 1 日开始，黑客在再次通过邮件提醒记者后，开始在文件共享网站上倾倒大量被盗文件，其中许多涉及深度个人隐私。第一批文件包括机密绩效评估、家庭医疗记录、犯罪背景调查、关于职场事务的纪律备忘、护照信息以及索尼所有人的薪资详情。制片厂对即使是身份窃取者看重的敏感信息也几乎没有控制。例如，一家名为
    `Identity Finder` 的数据保护公司通过分析发现，索尼在 600 多个缺乏密码保护或加密的文件中留下了 47,426 人的社会安全号码（包括许多已离开公司多年的员工）。


    此后发生了更多泄露，每隔几天一次，随着记者仔细研读索尼的业务，尤其是其“丑闻”，每次泄露都引发了一场新的危机。“这是一场噩梦，”一位在片场工作的高管说，“正当你觉得已经度过了一个关头——一切开始变得安静平静时——砰的一声，你会被另一个更疯狂的事情击中。”


    帕斯卡与制片人斯科特·鲁丁（Scott Rudin）的邮件往来显得格外的令人尴尬，并在媒体中广泛流传。其中包括对安吉丽娜·乔莉（Angelina Jolie）等名人的刻薄评论（鲁丁称她为“才华平平的任性野大女孩”）；以及对奥巴马总统可能偏好黑色主题电影的趣味性不敏感玩笑（她写道：“我应该问问他喜不喜欢
    `DJANGO` 吗？”）；还有对他们电影交易的否认（“别他妈的威胁我，”帕斯卡在某处警告鲁丁。帕斯卡像她惯常做的那样，将最后这段对话转发给了林顿，林顿责备道：“你们两个疯了，竟然把这些发在邮件里。”）


    在尴尬的头条之后，帕斯卡发布了公开道歉，随后在与索尼员工以及阿尔·沙尔普顿（Al Sharpton）牧师的会议上寻求原谅，后者威胁要因为奥巴马评论要她的命。“我觉得自己像被强奸一样，”她私下对一位访问者说，“而且我还因此遭到了埋备。”


    索尼徒劳地试图压制这一切。12 月中旬，制片厂请了律师大卫·波伊斯（David Boies），他警告 40 多家媒体机构（包括 `Fortune`）不要使用被盗信息，否则他们将对“任何损害或损失负责”。波伊斯声称这些文件分别是“私人的”、“机密的”和“商业秘密”，并受一系列美国和外国法律原则的保护。尽管如此，包括《华尔街日报》、彭博社和路透社在内的许多媒体仍发表了使用这些邮件的文章。（波伊斯甚至写信给
    `Twitter`，试图关闭名为 `Bikini Robot Army` 的独立乐队领领瓦尔·布鲁克斯斯米特（Val Broeksmit），后者在推特上发布的被盗索尼邮件截图为他赢得了
    19,000 个粉丝。`Twitter` 只封禁了他的账号一天。被波伊斯联系的布鲁克斯米特理理了他。）


    那只是侧戏。索尼最大的问题是《会面》。媒体在 11 月 28 日（攻击发生四天后）首次提出朝鲜可能因为这部电影而黑了索尼的可能性。GOP 直到 12 月 8
    日才提到《会面》，要求索尼在“拒绝接受”其之前的条款后，“立即停止放映这部恐怖电影”。与此同时，罗根（Rogen）和弗兰科（Franco）继续他们的宣传之旅，维持制片厂的立场——正如罗根在
    12 月 15 日的《美国早晨节目》中所说，《会面》“从根本上不是为了引起争议”。


    GOP 加剧了威胁。它已经就如果不满足其要求将对制片厂员工家属的安全做出不详的预言。随后，在 12 月 16 日，黑客宣称要给“在恐怖中寻求乐趣的人”带来“悲惨的命运”，声称将攻击放映“索尼影业娱乐制作的这部糟糕电影”的电影院。他们警告道：“世界将充满恐惧。记住
    2001 年 9 月 11 日。我们建议你们远离当时的地点。”


    这些由一个似乎掌握巨大权力的匿名团体发表的荒谬言论达到了预期。恐惧笼罩了电影界。所有五大电影院连锁店援引安全考虑，但也担心毁掉假期票房，告诉索尼他们不会放映这部电影。《会面》原计划在
    3,500 个银幕院放映。在焦虑中：来自 `国土安全部` 的消息称，他们“没有可靠的情报表明有针对电影院的活跃阴谋。”


    12 月 17 日，索尼发布了一份声明，表示对“这种压制电影发行的无耻行为深表哀遗憾”，并坚持认为，“我们支持我们的电影制作人员及其言论自由的权利。”但索尼并不是支持这部电影；而是将其搁置。“鉴于大多数放映方不放映该片的决定，”制片厂宣布，取消圣诞节上映。


    林顿后来坚持认为连锁店的退出让他别无选择，并评论道：“这不是我们的决定。”事实上，有至少 150 家独立影院渴望放映这部电影。位于奥斯汀的 `Alamo Drafthouse
    Cinema` 首席官蒂姆·李格（Tim League）表示，他迅速通知了索尼，他的 19 家连锁店想放映这部电影，艺术院联盟（Art House Convergence）的其他成员也是如此。但索尼拒绝让他们放映。


    12 月 17 日深夜，当记者问及通过视频点播（`VOD`）或 `Netflix` 等流媒体服务发行电影——一种绕过对电影院威胁的方法时——制片厂发布了第二份声明排除了任何可能：“索尼对该片没有进一步发行计划。”


    一天后，黑客要求索尼撤掉与电影有关的所有内容，“包括预告片。”制片厂也这样做了，撤掉了电视广告，取消了首映，甚至放弃了宣传用的 `Facebook` 和 `Twitter`
    账号。（索尼发言人说，“这并不是为了安抚黑客。由于没有全国性的发行，明智的做法是停止营销工作。”）媒体报道，《会面》没有见面日。黑客赢了。


    是谁干的？


    在攻击发生 25 天后，`FBI` 将索尼攻击归因于朝鲜。这一结论得得极快，而且该机构认定政府为罪首是非常罕见的。


