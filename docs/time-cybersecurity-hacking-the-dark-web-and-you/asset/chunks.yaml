    赫格利希表示，她担心的不仅是传播虚假信息的俄罗斯媒体，还有那些被称为“机器人”的自动化算法，这些算法帮助虚假报告在政治家或事实核查人员揭穿它们之前病毒式传播。2017
    年 6 月，一项研究发现，59%的德国人曾在网上看到过虚假新闻；61%的人认为这种现象对民主构成了威胁。


    因此，默克尔政府为围攻做了准备。她在议会的执政联盟通过了一项法律，对未及时删除“非法内容”的 Facebook 等公司处以超过 5900 万美元的罚款。默克尔政府使用这一术语来界定涵盖从仇恨言论、色情内容到诽性宣传的各种内容。“虚假新闻是对我们辩论文化的威胁，”该法律背后的官员、司法部长海因科·马斯在
    2017 年 1 月告诉一家德国报纸。他随后补充道，“我们对社交网络上犯罪煽动行为的容忍度，应该和对街头行为一样小。”


    德国的《网络执行法》是对莫斯科影响活动最激进的反应之一，尽管这绝不是唯一的反应。欧盟设立了一个专门负责揭穿虚假新闻和俄罗斯宣传的机构。捷克一家警察机构扫描社交媒体以寻找虚假信息和其他“混合威胁”。法国总统埃马纽埃尔·马克龙也于
    4 月禁止了俄罗斯新闻机构 RT 和 Sputnik 进入他的竞选总部。


    这些步骤指向了恐惧，或偏执——即政治破坏工具的进步已足以威胁西方的民主国家。“民主的核心在于公共舆论，”赫格利希回忆起在与默克尔会面时告诉过的话，“而且如果存在操纵舆论的新方法，那么我们将看到一种新型的民主。”


    在某些方面，这种情况已经在发生了了。在一个黑客可以窃取几乎任何政治家秘密的时代，在一个只需要一个互联网连接就能调动数百万观众群的时代，一条病毒式帖子——即使是虚造的——就足以扭转选举。没有任何民主国家能逃避这种风险。俄罗斯和德国已成为在适应这一新领域并在可能的情况下重塑这一领域方面最有决心的玩家。


    康斯坦丁·克尼里克（Konstantin Knyrik）是“新闻前线”（News Front）网站的年轻创始人兼编辑，他认为自己与其说是记者，不如说是数字时代的信息战士，他也有自己的职业生涯和人脉来证明这一点。21
    世纪 00 年代中期，作为一名青少年，他成为欧亚青年联盟的活跃成员，这是一个由强硬俄罗斯民族主义者组成的团体，主张莫斯科恢复在苏联解体后失去的帝国。当他仅
    16 岁时，克尼里克就成为了该克里米亚地区（乌克兰南部的一片巨大半岛）的代表。2014 年春天，当俄罗斯军队入侵该地区并准备兼并它时，他领导了一支亲俄准军事部队占领了克里米亚调查新闻中心的总部，那里是该地区领先的独立新闻来源。士兵强行驱逐了该中心的记者并没收了他们的设备。克尼里克随后在原址创建了“新闻前线”。


    如今，克尼里克的媒体在克里米亚首府辛费罗波尔的演播室拍摄节目，并受到该地区支持支持林的当局的监督。2017 年 6 月，在办公室电话采访时，克尼里克将自己定位为西方对俄罗斯宣传战的制衡力量：“我们希望人们看到另一种观点。”他说，在美国和欧洲，“他们拥有的只有信息真空，所有这些东西都被塞进他们的脑子里，所有来自官方宣传渠道的荒谬谎言。”这是俄罗斯国家媒体最喜欢的叙事；克里姆林资助的
    RT 网络总编辑玛加丽塔·西莫扬（Margarita Simonyan）在 2015 年向《时间》杂志表达了类似的观点：“没有人展示客观现实，”她说。即使是客观报道的想法与这种世界观也是矛盾的。存在的只有竞争视角的转述，其中没有任何一个视角比其他的更有效。


    在 2017 年 6 月发表的一份关于俄罗斯在德国影响行动的分析中，位于华盛顿的智库大西洋委员会数字取证实验室发现，“新闻前线”是克里姆林在德国的三个主要“放大器”之一，还有
    Sputnik 和 RT。报告指出，“这个网络代表了一个潜在的渠道，虚假信息可以在选举之前注入德国的信息空间。”


    如果说俄罗斯和德国正在建立这场新信息战争的前战线，那么欧洲的当局仍在试图集结部队。总部位于布鲁塞尔的东欧战略委员会（East StratCom）是欧盟于 2015
    年为应对俄罗斯虚假信息而设立的，似乎设备极其匮乏。它的少数记者每周编制一份虚假新闻故事列表，并试图在 Facebook 和 Twitter 上揭穿它们。但该机构在社交媒体平台上的影响力微乎其微；其
    Facebook 页面只有约 2.万个赞，而 Sputnik 的页面超过百万个赞。


    还有另一个问题。在互联网上追逐骗局往往会引起人们更多的关注，在一个党派对立的时代，许多读者倾向于相信能够强化他们政治观的欺骗。“虚假新闻总是抢占先机，”荷兰莱登大学研究骗局传播的讲师彼得·伯格（Peter
    Burger）说，“即使我们对其进行事实核查，许多人也会说我们只是象牙塔里的自由派，或者是某些阴谋论的一部分。”


    他说，更好的方法可能是在学校引入事实核查课程，让学生对自己的信息来源更加重视。但这种教育方法需要多年才能产生影响，在此期间，虚假新闻技术将继续进步。2017
    年 7 月，华盛顿大学的学者揭露，他们可以“合成”一段巴拉拉克·奥巴马发表从未发表过的声明的视频。“你可以创建看起来完全真实的视频，”赫格利希说道，他在 11
    月那次会面后继续为德国政府提供建议。现在，需要几个小时甚至几天才能出一份证明此类视频是伪造的鉴定报告，而到那时其影响几乎是不可逆转的。至少，这会让选民在投票时不确定该相信什么。”

