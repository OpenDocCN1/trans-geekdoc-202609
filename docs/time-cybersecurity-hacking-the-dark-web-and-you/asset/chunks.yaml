    or resolved timely,” the report noted. Over a 10-month period, according to the
    audit, the corporate team had alerted the studio to 193 security “incidents.”


    In August 2014, Philip Reitinger, an executive who had been hired to harden Sony
    Corp.’s defenses, quit as global chief information security officer. A Sony spokesperson
    says his departure was “long planned and not a surprise.” Emails at the time paint
    a different picture. “Was this a surprise?” Sony Pictures general counsel Leah
    Weil wrote security chief Spaltro. “Yes,” he replied.


    Reitinger, an advocate for stronger security during his time in government, declined
    requests for an interview. But his many admirers in the field believe he didn’t
    accomplish more at Sony because he lacked adequate authority (the company disputes
    this) and because Tokyo didn’t pay enough attention. Even today, they say, it
    can be hard for an American to wield significant influence in Sony’s Tokyo headquarters.
    Says cyberexpert Lewis, “He felt a little frustrated.”


    Then–FBI director James Comey said he believed Sony’s cyberattackers first breached
    the studio’s network in September, gaining access through a common tactic called
    “spear phishing”—duping an employee into clicking on an email attachment or a
    Web link.


    Sony’s traditional virus-detection programs provided no protection from the hackers’
    malware, since they block only previously identified attacks, and hackers know
    to make small changes in their code. Indeed, it’s now accepted wisdom in the cyberworld
    that attackers can penetrate the perimeter defenses of almost any company.


    What’s critical is detecting the intruders quickly, before they can do much damage.
    According to a 2015 report by Mandia’s company, it typically takes a company 205
    days to discover it has been penetrated, and less than a third of companies detect
    the breach themselves. This doesn’t mean it’s impossible to stop attacks; it’s
    evidence that most companies haven’t embraced the right precautions.


    Once inside, the Sony attackers’ next step was to “escalate privileges”—to gain
    wide access by stealing the credentials of system administrators. For more than
    two months Sony’s hackers roamed freely, identifying what they wanted to steal.
    This was possible because the studio, with few exceptions, didn’t segregate or
    provide extra security for even its most precious secrets. In effect, once the
    invaders made it past the network gates they could go anywhere they wanted because
    Sony hadn’t locked any doors—much in the way that the company had left its information
    security department open and unattended.


    It’s “astounding” that the Sony hackers were able to remove so much without being
    noticed, says J. Alex Halderman, a University of Michigan computer-science professor.
    Most corporate networks employ intrusion-detection software, which is designed
    to sound alarms about unusual file transfers—big files sent to strange places
    at unusual times—or odd behavior by system users accessing stuff they don’t usually
    touch. This has fed suspicions that the Sony attackers had inside help providing
    access to its system—that someone downloaded its secrets onto portable hard drives
    (as Edward Snowden did at the NSA), rather than sent them through the internet.


    Kevin Mandia, the prominent forensic expert Sony hired to investigate the hack,
    insists there is no evidence of that. The hackers, he contends, escaped detection
    by patiently moving data out in chunks over several weeks from different company
    servers to various attacker-controlled locations around the world. As a media
    company, Sony routinely transfers giant files, making it harder to spot the theft.


    Sony would not permit Mandia, the chief operating officer of FireEye, to be interviewed
    by Fortune, allowing him to provide only a brief written statement. Sony has often
    cited a note Mandia provided to Lynton that asserts that no company could have
    been “fully prepared for” the attack. But that note was carefully worded. For
    example, it notes that “industry standard antivirus software” wouldn’t have detected
    the malware. That’s not saying much. To a cyberexpert, traditional antivirus protection
    offers the hacking equivalent of being able to repel a musket ball when today’s
    villains are firing AK-47s.


    Indeed, several cybersecurity vendors—including FireEye—claim their products would
    have prevented (or at least dramatically reduced) the devastation at Sony. Says
    FireEye spokesman Vitor De Souza, “If they had our solution, we probably would
    have spotted the malware used in the attack.” De Souza says two-factor authentication
    also would have made a big difference at Sony. “It creates a big hurdle of the
    attackers,” he says. “If you don’t have two-factor authentication and they penetrate
    your network, you’re in big trouble.” If blocked, De Souza acknowledges, hackers
    might have employed other methods. “If a state actor wants to get in, he’ll get
    in,” he says. “The question is, How fast do you respond? Instead of, say, taking
    10 terabytes of data, they might have gotten one.”


    After pilfering Sony documents, the invaders turned to swiping emails for five
    top studio executives; the most recent messages are dated just two days before
    the hackers detonated their attack. By that point they had stolen seven sets of
    credentials for system administrators and mapped the studio’s entire network.
    This information was “hard-coded” into the destructive malware, allowing it to
    infect all the computers those IT managers were authorized to touch.


    On Monday, November 24, the attackers unleashed their customized wiper malware—igfxtrayex.exe—into
    Sony’s network. On each machine the malware reached, it deleted everything on
    the hard drive while installing the threatening web page, with its skeletal imagery
    and warning. Anyone already logged in helplessly watched their files disappear.
    The malware also erased the software instructions that tell the computer how to
    operate. Two hours later the computer would restart to display another chilling
    message: “Operating system not found.”


    To avoid detection the hackers immediately exited Sony’s network after launching
    their destruction. The malware reported back to “command and control” servers
    out in cyberspace, allowing the intruders—wherever they were—to tally up their
    digital toll. Hackers typically use the simplest means necessary to accomplish
    their mission, and experts say there was nothing particularly sophisticated about
    the Sony attack. Ed Skoudis, a “white hat” hacker who teaches cyberdefense testing
    for corporate IT security professionals at the SANS Institute, says the skill
    level deployed at Sony looks “pretty average.” He puts its perpetrators on par
    with students in his mid-level classes. “It shows the defenses of Sony were not
    particularly good,” says Skoudis. “I didn’t see the bad guys jumping over any
    extreme hurdles, because there weren’t any extreme hurdles in place.” What was
    extreme was the destruction.


    From the outset, the management and employees at Sony Pictures didn’t have a clue
    as to what hit them—or what was on the way. The studio’s initial public comment
    on November 24 was a marvel of understatement: “We are investigating an IT matter.”


    The invaders had spelled out their intentions in the scrolling text that accompanied
    the scarlet skeleton. “Hacked By #GOP,” it read. “We’ve already warned you, and
    this is just a beginning. We continue till our request be met. We’ve obtained
    all your internal data including your secrets and top secrets. If you don’t obey
    us, we’ll release data shown below to the world.”'
