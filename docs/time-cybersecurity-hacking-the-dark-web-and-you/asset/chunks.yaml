    还有一些机构不仅仅是在玩游戏。Exodus 对其客户名单非常谨慎，但其他机构则没那么小心。众所周知，`NSA`（国家安全局）和 `FBI`（联邦调查局）喜欢在目标计算机上植入监控软件以收集情报；在联邦局成功游说法院后，2016
    年最高法院批准了一项规则变更，允许法官签发搜索或没收设备的授权，无论这些设备位于何处。如何在当事人不知情的情况下在其电脑上植入软件？一种方法是利用漏洞。2013
    年，`FBI` 打破了一家名为 `Freedom Hosting` 的公司，将其描述为“全球最大的儿童色情传播便利者”。Freedom Hosting 运行在
    `Tor` 网络上，该网络可以使 Web 流量匿名。为了绕过匿名性，`FBI` 利用了 `Firefox` 中的一个漏洞。


    至于 `NSA`，《华盛顿邮报对爱德华·斯诺登泄密事件的分析显示，`NSA` 的预算中包含 2510 万美元用于“额外秘密购买软件漏洞”，这表明他们既购买零日漏洞，又在内部自行研发。（2013
    年，调查新闻网站 `MuckRock` 获取了一份 `NSA` 与 `Vupen` 一家已倒闭的法国网络安全公司的合同副本。）同一笔预算揭示了一个代号为 `GENIE`
    的秘密 `NSA` 计划，该计划资金达 6.52 亿美元，旨在大规模地在外国计算机网络上植入恶意软件。到 2013 年底，`GENIE` 预计将控制约 85,000
    台机器。


    同样根据斯诺登的文件，美国在 2011 年针对中国、俄罗斯、伊朗和北朝鲜等国家发起了 231 次攻性性网络行动——而这还是 2011 年，在网络时代已是远古的历史了。2017
    年的国防预算包含了 67 亿美元的网络空间行动资金，这是一个非常通统的术语，指的是一个人们并不了解的领域。`Verizon` 在其年度《数据泄露调查报告》中估计，2016
    年 21% 的数据泄露归因于网络间谍活动。`Verizon` 也承认，关于网络间谍活动的可靠信息很难获得。这种行动是秘密的，即使你能够发现它，网络间谍活动也很与工业间谍活动或普通的网络犯罪区分开来，因为很难确定攻击的源头和意图。


    考虑到漏洞的攻击潜力，你可能会认为政府会像控制战斗机和陆雷贸易那样控制这些漏洞的交易。但监管机构才刚刚跟上。《瓦森纳军控协定》（`Wassenaar Arrangement`）是一项规范
    `U.S.` 和其他 40 个参与国之间武器销售的国际协议，它在 2013 年经过修订，将“侵入软件”列入其限制性双用技术清单，但到目前为止该变更尚未执行。奥巴马政府的一位高级官员在
    2014 年告诉《时代》杂志：“这目前还不是一个政府真正关注并监管的市场。我们一直更多地处于自愿性的最佳实践和标准领域。我认为你们将看到我们继续关注这一点。”2016
    年，`U.S.` 官员宣布，他们希望未来能再次对该协议进行谈判。


    当然，梦想是一个不再有漏洞的世界，软件可以被完美，安全将是绝对的，我们可以继续去寻找其他需要担心的事情。但趋势正向另一个方向发展。我们要求计算机为我们做的事情越多，我们就越需要它们保持安全——但计算机要做的事情越多，其软件就越复杂，因此
    Bug 就越多，如此循环复始——这是一个恶性循环。你笔记本电脑上的操作系统由数千万行代码组成。

