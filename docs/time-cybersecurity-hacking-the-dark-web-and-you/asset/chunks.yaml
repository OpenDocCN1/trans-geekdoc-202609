    Ormandy didn’t know anyone at Cloudflare, and he was hesitant to cold-call its
    generic support line so late in the day ahead of a three-day weekend. So he did
    the next best thing he could think of. Ormandy took to Twitter to appeal to the
    tens of thousands of people who follow him there.


    “Could someone from Cloudflare security urgently contact me”


    The time stamp was 5:11 p.m. Pacific time.


    Ormandy did not bother to alert the company’s Twitter account by tagging its name
    with an “@” symbol. He didn’t need to. Such is his reputation among the zealous
    community of information-security professionals that within 15 minutes of Ormandy’s
    pressing “Send,” everyone in the world who needed to know—and plenty who didn’t—would
    see the note.


    At 1:26 a.m. local time, John Graham-Cumming’s phone, plugged into an outlet by
    his bedside in London, buzzed him awake. The chief technology officer of Cloudflare
    rubbed his eyes and reached to pick up the rumbling handset. Missed call. A colleague—one
    of the few whom Graham-Cumming had white-listed to reach him after midnight—had
    called. The CTO fired off a text message asking what was up.


    His colleague responded immediately.


    “very serious security issue”


    Graham-Cumming sat up, alarmed, and replied.


    “I will get online”


    The CTO rose from bed, went downstairs to the basement, and grabbed the emergency
    bag—charger, headphones, extra batteries—that he had stowed for such an occasion.
    He booted up his laptop computer and quickly joined a Google Hangout with his
    colleagues at Cloudflare’s California headquarters.


    The security team briefed him on the unfolding situation. Google’s Project Zero
    team had found a bug in Cloudflare’s infrastructure—a bad one. The servers that
    help run more than 6 million customer websites, including those of the FBI, Nasdaq
    and Reddit, had sprung a data leak. Anyone could access a Cloudflare-supported
    site and retrieve in certain circumstances the intimate details—authentication
    tokens, cookies, private messages—of users of another site on its network, among
    them Uber, 1Password, OKCupid and Fitbit.


    The information was hidden in plain sight. Worse, search engines and other web
    crawlers had been storing the leaked data in their caches for months. Plugging
    the leak would not fully solve the problem.


    “I liken it to an oil spill,” Graham-Cumming says. “It’s easy to deal with a hole
    in the side of a tanker, but then you’ve got a lot of seabeds that need to be
    cleaned up.”


    So Cloudflare’s engineers got to work. Security chief Marc Rogers, who in his
    spare time serves as a consultant for the USA Network hacker drama Mr. Robot,
    led the triage effort. In less than an hour the team pushed out an initial mitigating
    update that plugged the leak worldwide. After several hours the technicians successfully
    rolled back functions that had contributed to the error. Almost seven hours after
    Ormandy fired off his tweet, Cloudflare’s engineers managed to enlist the major
    search engines—Google, Microsoft, Yahoo—to clear their historical web page caches.


    It was the beginning of a very long weekend. Cloudflare engineers spent the rest
    of it evaluating how much and what kind of data had leaked as well as how far
    the mess had spilled.


    Google’s Project Zero team was initially impressed with the rapid response of
    Cloudflare, which has a reputation for transparency when it comes to security
    matters. But the relationship began to fray as the teams negotiated when they
    would publicly reveal what had transpired. The companies tentatively agreed to
    make an announcement as early as Tuesday, February 21. As the day waned, Cloudflare
    decided it needed more time for cleanup. Tuesday became Wednesday. Wednesday became
    Thursday. Google put its foot down: Thursday afternoon would be the day the companies
    published details of the leak, which Ormandy dubbed “Cloudbleed,” whether or not
    Cloudflare had completed its assessment and ensured that the leaked data was clear
    from online caches.


    Both advisories went up on February 23. A weeklong internet panic ensued.


    Many companies, including Microsoft and Apple, have internal security-research
    teams that investigate their own software. But few have teams that focus on the
    software made by other companies. That is what makes Google so unusual. To Ormandy
    and the dozen or so ace computer crackers that make up Google’s Project Zero,
    there are no boundaries to their jurisdiction—anything that touches the internet
    is fair game. Policing cyberspace isn’t just good for humanity. It’s good for
    business too.


    Google officially formed Project Zero in 2014, but the group’s origins stretch
    back another five years. It often takes an emergency to drive most companies to
    take security seriously. For Google, that moment was Operation Aurora.


    In 2009, a cyberespionage group associated with the Chinese government hacked
    Google and a number of other tech titans, breaching their servers, stealing their
    intellectual property, and attempting to spy on their users. The pillaging outraged
    Google’s top executives—enough so that the company eventually exited China, the
    world’s biggest market, over the affair.


    The event particularly bothered Google co-founder Sergey Brin. Computer-forensics
    firms and investigators determined that the company had been hacked not through
    any fault of Google’s own software, but via an unpatched flaw in `Microsoft Internet
    Explorer 6`. Why, he wondered, should Google’s security depend on other companies’
    products?


    In the months that followed, Google began to get more aggressive in demanding
    that rivals fix flaws in their software’s code. The battles between Google and
    its peers soon became the stuff of legend. At the center of several of these spats
    was none other than bug hunter Tavis Ormandy, known for his smashmouth approach
    to getting flaws fixed. (Ormandy declined to be interviewed for this story.)


    Google quietly began to formalize what became Project Zero in 2014. The company
    established a set of protocols and allowed Chris Evans (no relation to Captain
    America), former head of Google Chrome security, to take the helm. Evans in turn
    began recruiting Googlers and others to the team.


    He signed on Ian Beer, a British-born security researcher based in Switzerland,
    who had demonstrated a penchant for sussing out Apple’s coding errors. He brought
    on Ormandy, a British bruiser known for his highly publicized skirmishes with
    Microsoft. Evans enlisted Ben Hawkes, a New Zealander known for stomping out Adobe
    Flash and Microsoft Office bugs. And he invited George Hotz, a precocious teenager
    who had earned $150,000 after busting open the Google Chrome browser in a hacking
    competition earlier that year, to be an intern. Current members of Project Zero
    declined multiple requests to be interviewed about their work for this story.)


    The first sign that Project Zero had arrived in April 2014 when Apple credited
    a Google researcher in a brief note for discovering a flaw that would allow a
    hacker to take control of software running Apple’s Safari web browser. The note
    thanked `Ian Beer of Google Project Zero`.


    More credits soon appeared. In May, Apple credited the discovery of several bugs
    in its OS X operating system to `Beer`. A month later, Microsoft patched a bug
    that made it possible to defeat its malware protection, noting the help of `Tavis
    Ormandy of Google Project Zero`.


    By then, the team had generated considerable buzz among those who track security
    issues. Evans finally made its presence officially known in a blog post on the
    company’s website. “You should be able to use the web without fear that a criminal
    or state-sponsored actor is exploiting software bugs to infect your computer,
    steal secrets or monitor your communications,” he wrote, citing recent examples
    of spies targeting businesses and human-rights activists as unconscionable abuses.
    “This needs to stop.”

