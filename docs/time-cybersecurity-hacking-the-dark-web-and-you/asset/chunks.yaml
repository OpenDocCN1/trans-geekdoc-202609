  raw: '“No company is ever going to say, ‘We were just sloppy, so people got in,’
    ” says cybersecurity expert James Lewis, a senior fellow at the Center for Strategic
    and International Studies. “The fact that it’s a nation-state and is hard to defeat
    doesn’t mean you have to leave the doors wide open and put out the welcome mat.”


    This article is based on more than 50 interviews with current and former high-level
    executives at Sony (all of whom insisted on not being identified by name), cybersecurity
    experts and law-enforcement officials. It is also based, in large part, on Sony
    emails and documents stolen by the hackers. Beyond generating Hollywood gossip,
    which they already have, they offer a remarkable window into the business of Sony
    Pictures at the time of the hack: the personalities of its leaders, the pressures
    they faced in their relationship with the business’s Tokyo-based parent and the
    challenges of running an entertainment studio in the 21st century. (We’ve preserved
    the emails’ original punctuation and often sloppy spelling.)


    The emails also reveal myriad surprises and previously unreported anecdotes, including
    one episode in which Sony spied on its own employees’ emails. Paradoxically, the
    hacked emails and documents provide a telling window into how and why such a disastrous
    hack succeeded and what companies need to do to protect themselves—which is precisely
    why Fortune has chosen to use this material.


    What happened at Sony stands as a landmark event. It struck terror in boardrooms
    throughout corporate America, and for all the unique elements in Sony’s situation,
    the lessons apply to every company. After all, to use an old line, there are only
    two kinds of companies: those that have been hacked, and those that don’t yet
    realize they’ve been hacked. Countless behemoths have been victimized on a massive
    scale, including Target, Anthem, Home Depot and J.P. Morgan, suffering incursions
    for profit-oriented data theft or corporate espionage.


    The peril for corporate America seems to be growing even faster than the immense
    resources now mobilized to combat electronic crime. (The government has hardly
    been immune, with high-profile infiltrations of the IRS, the White House’s email
    system and the U.S. Office of Personnel Management.) But for the most part, previous
    corporate invasions have afflicted customers, not businesses. This one hit home
    because it showed how attackers could steal even executives’ most precious secrets—and
    bring a company to its knees.


    The improbable combination of a Japanese electronics giant and a Hollywood studio
    dates back to 1989. Sony Corp. was then the most dominant electronics company
    on the face of the earth, at a moment when Japanese business dominance seemed
    permanent. Sony paid an eye-popping $4.8 billion for struggling Columbia Pictures,
    declaring movies the equivalent of “software” needed to boost sales of its premium
    “hardware”—TVs, videocassette recorders and music players. The studio was renamed
    Sony Pictures Entertainment but continued to struggle, forcing a $2.7 billion
    write-down five years later.


    The next quarter-century was not kind to Sony Corp., which clung to its consumer
    electronics business as it became commoditized. Today the company remains a Goliath,
    with 132,000 employees and $74.7 billion in revenues for the fiscal year ending
    in March. But Sony has lost $12.1 billion over the past seven fiscal years. When
    Kazuo Hirai became CEO in April 2012, he declared “a very severe sense of crisis”
    and announced a turnaround strategy, including thousands of layoffs. In the change-averse
    Japanese corporate culture, it has unfolded far too slowly.


    Hirai, who succeeded Howard Stringer, Sony’s first non-Japanese CEO and a man
    frustrated by his inability to reenergize the sclerotic company, rose through
    its PlayStation videogames division, which he helped make a reliable moneymaker.
    Just 51 when named CEO, Hirai dressed casually, encouraged employees to call him
    Kaz and, after years in the U.S., pitched products in perfect English.


    Like his predecessors, Hirai kept his hands off Sony Pictures, run for more than
    a decade through a delicate yin-yang partnership. Sony’s studio chief was Amy
    Pascal, who reigned as the most powerful woman in Hollywood. Masterly at stroking
    celebrity egos, Pascal cultivated relationships with filmmakers and stars, who
    returned the affection. “I adore you, Amy,” George Clooney wrote her last year.
    “You are literally the only person running a studio that loves film.” Raised middle
    class in Los Angeles, Pascal was frenetic, thin-skinned and unfiltered, given
    to long, stream-of-consciousness emails. Paid $9.1 million for 2014, she proudly
    presided over her domain from a majestic office once occupied by Louis B. Mayer.
    She had a reputation for dispensing overly generous deals and falling in love
    with ambitious movies that had dubious commercial prospects.


    To inject fiscal discipline, Stringer in 2004 had forced Pascal to team up with
    Lynton, who had left a job as head of AOL Europe to join Sony Pictures as CEO.
    Raised in the Netherlands by a wealthy German-Jewish family that fled Hitler,
    Lynton attended Exeter before earning his undergraduate degree and MBA at Harvard,
    where he played rugby; he’d done a stint as an investment banker. Cool, cerebral
    and measured, Lynton was an East Coast intellectual with artistic interests that
    he viewed as more refined than the crassly commercial fare typically peddled by
    Hollywood. In 1998, after leaving Disney Studios and moving back east to run Penguin
    Books, he told a New Yorker writer of his “horror” at “living in a town where
    everything is about movies.”


    A consummate networker, Lynton avoided drama and the spotlight, preferring to
    pull strings behind the scenes. He arranged a film audition for billionaire Leon
    Black’s actress niece, dined with President Obama on Martha’s Vineyard and plotted
    with Facebook COO Sheryl Sandberg to see if they could find a blind date for Malcolm
    Gladwell, one of his many writer buddies.


    Lynton and Pascal had survived together for a decade—an eternity in Hollywood.
    Both in their mid-50s, they lived two miles apart and even attended the same synagogue.
    When Lynton first took the job, he diplomatically vowed to steer clear of Pascal’s
    turf and rarely stood in the way of a film she wanted—even one he loathed—where
    the bottom line seemed to make sense. After reading the script for a movie called
    Money Monster, for example, he wrote Pascal: “I hate it … It is simplistic, bombastic,
    wrongheaded, and stupid. All that being said … if the numbers work and there is
    no risk then I am ok.” Sony moved forward with the film; it was released in 2016.
    (Says Sony spokesperson Lawson: “Initially \[Lynton\] was not supportive, but
    what you don’t see in the stolen emails is that through further discussion, his
    position changed and he ended up supporting the project.”)


    Hirai maintained a similar posture. In June 2014, after forwarding enthusiastic
    European screening reports for the Cameron Diaz comedy Sex Tape (which would later
    bomb), Lynton joked with the Sony Corp. CEO about their mutual dislike for it.
    “Something tells me that I should keep my day job,” wrote Hirai.


    “The box office will be the judge,” Lynton replied. “But you and I have the same
    view of the movie!!”


    Even as Sony’s film business struggled through another rocky year, Pascal hoped
    her skill at building relationships with emerging stars would help turn things
    around. Seth Rogen was perhaps her favorite.


    Rogen and his collaborator Evan Goldberg had been making profitable movies with
    Sony since 2007, starting with Superbad, which they had written as teenagers in
    Canada. The pair’s hits included Pineapple Express and This Is the End. By early
    2014, Pascal was working to line up Rogen for three more Sony projects. The Interview,
    which Rogen and Goldberg had directed and already filmed, was set for wide release
    on Oct. 10, 2014.'
