    # CHAPTER FOUR

    ## How to Protect Yourself


    Cybersecurity can be a bewildering concept for a government or a massive corporation,
    let alone an individual. This step-by-step guide will help you guard against scammers,
    hackers and viruses.


    ■ FREE WI-FI ■ PHISHING ■ DEVICES & GADGETS ■ MALWARE ■ IDENTITY THEFT ■ ADVERTISING
    ■ AT WORK ■ AT HOME ■ PASSWORDS ■ CHECKLIST


    ![image](images/chap_four.png)


    ### Free Wi-Fi

    How to keep intruders out when your phone or computer is connected to public wireless
    networks


    ![image](images/GettyImages-849664230.png)


    In October 2017, researchers discovered a major security flaw present in nearly
    all Wi-Fi-enabled devices. Called `KRACK`, the exploit could allow hackers to
    bypass a popular Wi-Fi security feature and view Web traffic on networks that
    would otherwise be encrypted. They could then access a variety of sensitive information
    that people transmit over Wi-Fi networks, like passwords and bank-account information.
    Wi-Fi device manufacturers almost immediately began issuing patches to address
    the problem, but many older Wi-Fi devices no longer receive such updates, leaving
    them vulnerable. The `KRACK` attack underscores the potential dangers of using
    public Wi-Fi. Although it’s unlikely there are hackers hanging out on your home
    network, they have been known to set up camp at coffee shops and airports in hopes
    of breaking into smartphones and computers that connect there. It can be nearly
    impossible to tell if a hacker is present on a free Wi-Fi network, making the
    problem that much more serious.


    1. **Make sure you’re connecting to the right network.** Assuming you’re connecting
    to an appropriate network just because it shares a location’s name can be a big
    mistake. If you’re in a coffee shop or store, for example, ask an employee to
    verify the name of its specific Wi-Fi network. That will enable you to avoid connecting
    to a “spoof”—or fake—network set up by hackers.

    2. **Only connect to Wi-Fi networks that are protected by a password.** You’ll
    spot these because they have a lock icon next to their name. You can often get
    the password from a barista or other employee. Of course, there’s no guarantee
    that a hacker doesn’t also have the password, but it’s better than a completely
    open network.

    3. **Stick to websites that have “HTTPS” before their WWW address.** `HTTPS` is
    a secure protocol that helps protect information you send to a particular website.

    4. **Use a Virtual Private Network, or VPN.** A `VPN` service will help encrypt
    all of the data you send between your device and the internet, whether a Wi-Fi
    network is protected or not. Many `VPN` services—such as `PureVPN` and `KeepSolid
    VPN Unlimited`—charge a small fee for their use. But it’s worth it.

    5. **Turn off any kind of file- and printer-sharing options on your smartphone,
    tablet or laptop.** If you’re not using any wireless accessories, shut off `Bluetooth`
    as well. The fewer wire-free pathways that a hacker has to access your devices,
    the safer you will be overall.


    ### Phishing

    It’s not just one of those internet words that sounds odd—it’s a serious kind
    of threat.


    ![image](images/GettyImages-857325286.png)


    A large number of journalists began receiving emails in May 2017 with a link to
    a `Google Doc` that had been shared with them. The email seemed normal enough:
    in some instances, the file appeared to be from a person the recipient knew. But
    it turned out to be a sophisticated phishing—an attempt to obtain sensitive information
    by disguising messages as coming from a trustworthy source—that tricked victims
    into handing over their Google account. Phishing scams are nothing new, but criminals
    have gotten increasingly good at making them appear more convincing than old-school
    requests for aid from a Nigerian prince.


    **Never click suspicious links**

    If you receive a link that seems unfamiliar via email, don’t click on it. Phishers
    will often pose as legitimate websites to obtain login credentials. “They just
    copy the exact page you’re used to seeing,” Mark Risher, Google’s spam and abuse
    chief, told TIME. If you receive an email that seems important—whether it an alert
    from your bank or Apple informing you of your iCloud service—try reaching out
    to the service provider to see if the email was sent.


    **Beware of threats**

    Phishers benefit from enticing you to click a link or enter your login credentials,
    so they often try to communicate a sense of urgency. The email might urge you
    to verify your information within a certain time frame or else they’ll permanently
    block or delete your account. This should be a red flag.


    **Look out for bad grammar**

    Phishing emails are known to contain spelling and grammatical errors. Unlike the
    large companies they imitate, phishers don’t have a staff of writers and editors.


    **Examine email closely**

    Although the graphics, email alias and subject line may be convincing, you can
    often spot a phishing scam by looking at the actual email address more closely.
    As noted in a phishing email spotted by CNET, a scammer posing as PayPal was using
    an email address that looked like this: `web-scured1@inc.pay1.com`. The case will
    often be similar for URLs listed in the email. Although the sender may claim to
    be PayPal or Facebook, any links included in the email will be different from
    the Web addresses for those sites. Don’t click these links to find out; you can
    often see the URL just by hovering your mouse over it. As such, it may be a good
    idea to take a closer look at a suspicious email when you have access to a laptop
    or desktop computer rather than doing so on your phone.


    ### Devices & Gadgets

    Hundreds of millions of connected gadgets mean hundreds of millions of targets
    for hackers.


