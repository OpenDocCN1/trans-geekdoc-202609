    本书旨在让你理解如何在充满骗术与互联的时代中生存。诚然，攻击与防御手段在不断演变和适应。沃尔（Ware）在几十年前的未来主义宣言中曾预见地写道：“计算机将以每种方式触及每个人、每个地方，几乎每分钟发生一次，”他预言道，“无论人们做什么，都会通过计算机进行通信。它将改变并重塑他的生活，修改他的职业，并迫使他接受持续变化的生活。”


    即使在那种变动不中，我们希望这本书能揭示在这场关于控制权、影响力和霸权的持续斗争中涉及的永恒元素。正如科幻小说巨匠亚瑟·C·克拉克所写，如果任何足够先进的技术与魔法无异，那么这些页面就旨在为这些巫师们拉开帷幕。


    # 破解我们的生活


    ## 网络攻击和泄露事件频频上新闻


    ![image](img/GettyImages-675452848.png)


    ### 黑客行动 (LE HACK)

    时任候选人埃马纽埃尔·马克龙在 5 月的一次集会上。几天后，美国国家安全局局长迈克尔·罗杰斯指责俄罗斯试图通过针对性攻击影响法国选举。马克龙的政党表示他们是一场“大规模、协同性”攻击的受害者，尽管这并未影响结果。


    ![image](img/GettyImages-868719006.png)


    ### 暴风中心 (HOT SEAT)

    Facebook 总法顾问科林·斯特莱奇、推特代理总法顾问肖恩·埃格特以及谷歌执法与信息安全总监理查德·萨尔加于 10 月在参议院作证。争议焦点在于：有揭显示俄罗斯公司购买在线广告以影响美国
    2016 年选举。


    ![image](img/shutterstock_editorial_9186009b_huge.png)


    ### 虚假新闻 (FAKE NEWS)

    Facebook 和 Instagram 的广告与俄罗斯通过煽动分裂性的社会问题来破坏美国政治进程的努力有关。这些广告发布时，社交媒体公司正面临国会山的批评，质问他们为什么没有在对抗俄罗斯干预方面做得更多。


    ![image](img/h_15025285.png)


    ### NSA 内部危机 (TROUBLE AT NSA)

    美国国家安全局黑客部队的前成员杰克·威廉姆斯被一个名为“影子经纪人”的组织针对。该机构网络武器的泄露损害了士气，减慢了情报行动，并导致了针对企业和平民的攻击攻击。


    ## 六类最糟糕的网络坏蛋

    ### 作者：埃里卡·弗莱 (ERIKA FRY)


    ![image](img/GettyImages-823248118.png)


    如果互联网有一个恒定不变，那就是在某处、以某种方式，有人正在被攻击。针对金融机构、跨国公司和政府的网络攻击已成为常态新闻头条。此外还有大量未被报道的攻击。2017
    年波尼蒙研究所的一项调查发现，美国数据泄露的平均成本为 735 万美元，四家机构中就有一将在未来两年内面临涉及至少 10,000 条记录的攻击。安全分析师表示，首先要了解的是潜伏在阴影中的威胁类型。虽然许多黑客使用相对基础的工具，如钓鱼或恶意软件，但他们带有不同的动机使用这些工具。以下是六类最有效的成员：


    ### 1. 国家支持的 (State-sponsored)

    - **成员**: 中国、伊朗、以色列、俄罗斯、美国

    - **目标**: 情报、国家机密、破坏

    - **对象**: 外国政府、恐怖分子、行业

    - **特征**: 多层次的、精密策划的攻击，可入侵计算机系统

    - **经典案例**: 在 `Stuxnet` 之后，伊朗五分之一的核离心机崩溃，据报道这种由 `U.S.` 和以色列情报部门开发的蠕虫渗透了伊朗浓缩设施的计算机。据称，伊朗通过干扰
    `J.P. Morgan`、`PNC`、`Wells Fargo` 等网站的访问进行报复。


    ### 2. 黑客行动主义 (Hacktivist)

    - **成员**: 匿名组织、AntiSec、LulzSec

    - **目标**: 纠正感知中的错误、宣传、保护互联网自由

    - **对象**: 欺凌者、科学教徒、公司、政府

    - **特征**: 泄露敏感信息、公开羞辱、诡异的 YouTube 视频

    - **经典案例**: 在“回击行动”期间，`PayPal`、`Visa`和`MasterCard`的网站遭到中断，这是由匿名组织领导的、旨在惩罚在 2010
    年封禁 `WikiLeaks`账户的公司。仅`PayPal`一家就损失了 560 万美元。


    ### 3. 网络犯罪 (Cyber-criminal)

    - **成员**: 尼日利亚“王子”、盗刷者、身份窃取者、垃圾邮件发送者

    - **目标**: 财宝

    - **对象**: 易信的人、在线购物者、小企业、数据丰富的实体

    - **特征**: 窃取数据

    - **经典案例**: 记录击键的恶意软件。通常第一步是发送虚假邮件的社会工程攻击。


    ### 4. 内部人员（也称为：你）

    - **成员**: 不满的员工、吹哨哨者

    - **目标**: 结算旧账

    - **对象**: 大公司、政府

    - **特征**: 文档窃取

    - **经典案例**: 澳大利亚阳光海岸沿线的马鲁奇郡（Maroochy Shire）曾被泵站淹没。


    ### 5. 脚本小子 (Script Kiddie)

    - **成员**: 无聊的青少年

    - **目标**: 刺激、成名

    - **对象**: 易于手的手的，如未受保护的网站

    - **特征**: 篡改或拆解网站

    - **经典案例**: 2001 年，一封主题为 LOVE YOU 的邮件欺骗了五角大楼内部的人员。


    ### 6. 漏洞经纪人 (Vulnerability Broker)

    - **成员**: Endgame, Netragard, Vupen

    - **目标**: 将黑客作为合法业务

    - **对象**: 无限制

    - **特征**: 寻找零日漏洞

    - **经典案例**: 法国公司 `Vupen` 在 2013 年的一次安全会议上破解了 `Google 的 Chrome` 浏览器。与其与公司分享技术并获得
    6 万美元的奖励，`Vupen` 将该漏洞卖给了出价更高的客户。


    # 黑客，术语表


    **黑帽 (black hat)**: 为了个人利益而进行黑客并在过程中从事非法活动的黑客。黑帽通常会将发现的安全漏洞出售给出价最高者。


    **加密 (crypto)**: “密码学”的缩写，保持在线通信秘密的科学。


    **暗网 (Dark Web)**:不受 Google 等搜索引擎索引且只能通过隐蔽访问的网站。暗网被那些希望交易保持纯匿名的人使用。也称为深网。


    **分布式拒绝服务 (DDoS)**: “分布式拒绝服务”的缩写，一种日益流行的攻击类型，利用大量计算机来瘫痪网站或在线服务。


    **信息安全 (infosec)**: “信息安全”的缩写。这些通常是负责防御机构受攻击的人员。


    **越狱 (jailbreak)**: 绕过在设备（如索尼 PlayStation 或苹果 iPhone）中内置的安全措施以移除制造商限制的行为。越狱设备的目标通常是使其运行未经授权的软件。


    **社会工程学 (social engineering)**: 通过欺骗内部人员交出权限以获取安全系统访问权限的行为。社会工程驱动攻击的第一步通常是发送看起来非常真实的虚假邮件，这种做法被称为钓鱼（phishing）。


    **破解软件 (warez)**: 通过 BitTorrent 和 Usenet 等技术分发的盗版软件。黑客可以通过在他们的破解软件中分发病毒来利用人们对免费软件的渴望。


