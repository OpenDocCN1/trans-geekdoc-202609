- raw: 'Michael transfers 0.5 Bitcoin (BTC) from his Coinbase wallet to his Ledger
    Nano S cold wallet. He originally bought the Bitcoin for $10,000, and at the time
    of the transfer, it is worth $25,000. Since the transfer does not constitute a
    sale, no capital gains are realized, but Michael incurs a transaction fee of 0.0005
    BTC.


    Michael must record the transaction fee as an expense and ensure that the cost
    basis of 0.5 BTC remains $10,000. When he eventually sells the Bitcoin, he will
    use this cost basis to calculate his capital gain.


    * * *


    ##### 4\. Custodial vs. Non-Custodial Wallets: Accounting Implications


    The choice between custodial and non-custodial wallets has accounting implications,
    particularly regarding transaction visibility and control. Custodial wallets,
    provided by exchanges like Coinbase or Kraken, handle transaction records on behalf
    of the user. Non-custodial wallets, such as Ledger or MetaMask, require users
    to manage their own transaction records.


    In custodial wallets, users can typically download transaction histories directly
    from the platform, simplifying the tracking process. However, with non-custodial
    wallets, users must manually track each transaction, including transfers between
    wallets and exchanges, which can complicate the accounting process.


    ##### Example: Managing Transactions in a Non-Custodial Wallet


    Emma stores her Ethereum in a Ledger Nano S cold wallet. When she transfers her
    Ethereum to Uniswap for trading, she manually records the date, transaction amount,
    and transaction fees. Since Ledger is a non-custodial wallet, Emma must keep accurate
    records of all transfers to and from her wallet to ensure proper accounting of
    her crypto assets.


    * * *


    ##### 5\. Crypto Staking and Income from Wallets


    Many crypto wallets, especially non-custodial wallets, allow users to participate
    in staking programs or earn rewards through yield farming. In these cases, the
    rewards received must be recorded as income at the FMV on the date they are received.
    These staking rewards may be taxable, depending on the jurisdiction.


    ##### Example: Receiving Staking Rewards


    Jason stakes his Cardano (ADA) in a non-custodial wallet and earns 10 ADA as staking
    rewards. At the time he receives the rewards, the FMV of 1 ADA is $2. Jason must
    record $20 as income from staking rewards and report it on his tax return.


    * * *


    #### Best Practices for Accounting with Crypto Wallets and Exchanges


    To ensure accurate and compliant accounting when using wallets and exchanges,
    consider the following best practices:


    1.  Consolidate Transaction Data: Use crypto accounting software, such as Koinly,
    CoinTracking, or TokenTax, to import transaction histories from multiple exchanges
    and wallets. This helps consolidate data and provides an accurate record of all
    transactions.


    2.  Track Transfers and Fees: Always record transfers between wallets or exchanges,
    along with any transaction fees incurred. While transfers are not taxable events,
    fees may impact the cost basis of the cryptocurrency.


    3.  Use Consistent Valuation Methods: Use a consistent method (e.g., FIFO, LIFO,
    or Specific Identification) to track the cost basis of cryptocurrency when it
    is sold or traded. This ensures that capital gains and losses are calculated accurately.


    4.  Record Staking and Mining Income: If you earn cryptocurrency through staking,
    mining, or yield farming, record the FMV of the rewards as income on the day they
    are received.


    5.  Reconcile Wallet Balances: Periodically reconcile the balances in your wallets
    and exchanges to ensure that your transaction records are accurate and complete.


    * * *


    #### Conclusion


    Crypto wallets and exchanges are essential tools for managing digital assets,
    but they also present unique accounting challenges. Accurately tracking transactions,
    fees, and transfers across multiple platforms is critical for ensuring tax compliance
    and financial transparency. By following best practices for crypto accounting,
    individuals and businesses can effectively manage their crypto portfolios and
    report their financial activities with confidence.


    In the next chapter, we will discuss how to report cryptocurrency holdings and
    transactions on financial statements, including how to classify and disclose crypto
    assets in line with accounting standards like GAAP and IFRS.


    # Chapter 8: Reporting Crypto on Financial Statements


    As cryptocurrencies become more common in business and investment portfolios,
    accurately reporting them on financial statements is increasingly important. However,
    the decentralized and volatile nature of cryptocurrencies creates unique challenges
    for accountants. In this chapter, we will explore how to report cryptocurrency
    holdings and transactions in financial statements, including how to classify,
    measure, and disclose these assets under common accounting frameworks such as
    GAAP and IFRS.


    * * *


    ## Classifying Cryptocurrencies on Financial Statements


    One of the first steps in reporting cryptocurrency on financial statements is
    determining how to classify the asset. Cryptocurrencies do not fit neatly into
    traditional asset categories, such as cash or cash equivalents, due to their volatility
    and lack of legal tender status. Instead, cryptocurrencies are often classified
    as:


    1.  Intangible Assets: Many accounting standards, including IFRS, classify cryptocurrencies
    as intangible assets because they are not physical and lack a legal claim for
    conversion to cash.


    2.  Inventory: For businesses that buy and sell cryptocurrency as part of their
    normal operations (e.g., cryptocurrency exchanges), cryptocurrencies may be classified
    as inventory.


    3.  Investments: In some cases, cryptocurrencies held as long-term investments
    may be classified as investment assets.


    4.  Financial Assets: Some argue that cryptocurrencies could be classified as
    financial assets, although most current accounting standards do not recognize
    them as such due to their decentralized nature and lack of an issuer.


    ##### Example: Classifying Bitcoin on a Company’s Balance Sheet


    Tech Innovators Inc., a company that holds 100 Bitcoin (BTC) as part of its investment
    portfolio, classifies the Bitcoin as intangible assets under IFRS because Bitcoin
    does not have a physical form, and the company does not use it as legal tender.
    The Bitcoin is reported under non-current assets on the balance sheet, as it is
    held for long-term investment purposes.


    * * *


    ## Measuring Cryptocurrencies on Financial Statements


    Once the classification of cryptocurrency is determined, the next step is to decide
    how to measure its value on the financial statements. Cryptocurrencies are highly
    volatile, which complicates the measurement process. Common methods for measuring
    cryptocurrency on financial statements include:


    1.  Cost Model: Under the cost model, cryptocurrencies are recorded at their original
    purchase price (cost basis) and are not revalued unless an impairment occurs.
    This method is typically used for intangible assets under IFRS and some GAAP standards.


    2.  Fair Value Model: Under the fair value model, cryptocurrencies are revalued
    at the end of each reporting period based on their current market price. This
    method is commonly used for investments and inventory in companies that actively
    trade cryptocurrency.


    3.  Impairment Testing: If the value of cryptocurrency declines below its purchase
    price, companies may need to perform impairment testing and write down the value
    of the asset on the balance sheet.


    ##### Example: Using the Cost Model for Ethereum Holdings


    Blockchain Enterprises Ltd. holds 500 Ethereum (ETH) tokens purchased at $2,000
    per ETH. At the time of the balance sheet reporting, the price of Ethereum has
    dropped to $1,800 per token. Under the cost model, the Ethereum is recorded at
    its original cost basis of $1,000,000 (500 ETH × $2,000).'
