    # Chapter 6: Taxation of Cryptocurrencies


    Cryptocurrency taxation is a critical aspect of crypto accounting, as crypto transactions
    often trigger taxable events. Despite the decentralized nature of cryptocurrencies,
    governments across the globe have established tax regulations to ensure that individuals
    and businesses report their crypto gains, income, and holdings. In this chapter,
    we will explore how cryptocurrencies are taxed, the different types of taxable
    events, and how to calculate capital gains, income, and losses. We will also look
    at examples to illustrate common tax scenarios.


    * * *


    #### Understanding Cryptocurrency as Taxable Property


    In many jurisdictions, cryptocurrencies are classified as property for tax purposes,
    similar to stocks, bonds, and real estate. This classification means that any
    sale, trade, or exchange of cryptocurrency can trigger a taxable event, subject
    to capital gains tax or income tax. The tax treatment depends on the nature of
    the transaction, whether the crypto is held for personal investment, business
    purposes, or as a form of income.


    ##### Taxable Events in Cryptocurrency Transactions


    Here are the common types of taxable events in cryptocurrency:


    1.  Selling Cryptocurrency for Fiat: When you sell your cryptocurrency for fiat
    currency (e.g., USD, EUR, CAD), the sale triggers a capital gain or loss.


    2.  Trading Cryptocurrency for Another Cryptocurrency: Exchanging one cryptocurrency
    for another (e.g., trading Bitcoin for Ethereum) is considered a sale and triggers
    a taxable event.


    3.  Using Cryptocurrency to Purchase Goods/Services: Paying for goods or services
    with cryptocurrency is a taxable event. The value of the crypto at the time of
    the transaction is compared to its cost basis to calculate any capital gains or
    losses.


    4.  Receiving Cryptocurrency as Income: When you receive cryptocurrency as payment
    for goods, services, staking rewards, or mining, it is considered income and taxed
    as ordinary income at the fair market value (FMV) on the day of receipt.


    * * *


    ## Capital Gains Tax on Cryptocurrency


    Most jurisdictions subject cryptocurrency to capital gains tax when you sell,
    trade, or dispose of it. The capital gain or loss is calculated as the difference
    between the selling price (or the FMV when disposing of it) and the original cost
    basis (the purchase price plus any transaction fees).


    ##### Types of Capital Gains


    *   Short-Term Capital Gains: If you hold the cryptocurrency for less than a year
    before selling it, the gain is considered short-term and taxed at the same rate
    as ordinary income.


    *   Long-Term Capital Gains: If you hold the cryptocurrency for more than a year
    before selling, the gain is considered long-term and typically taxed at a lower
    rate.


    ##### Example: Selling Bitcoin for Fiat


    John buys 1 Bitcoin (BTC) for $20,000 in January. In November of the same year,
    he sells the Bitcoin for $40,000. Since he held the Bitcoin for less than a year,
    this transaction results in a short-term capital gain. His capital gain is calculated
    as follows:


    ![](image_rsrc1TX.jpg)


    John must report the $20,000 as a short-term capital gain, which is taxed at his
    ordinary income tax rate.'
