  trans: "\n\n![](img/image_rsrc1TE.jpg)\n\n# 面向未来的会计：理解财务报告中的加密货币与区块链\n\n一份面向企业和个人的必备指南，助您在不断演变的数字金融与加密资产管理世界中保持领先。\n\
    \n## 目录\n\n- 第 1 章：加密货币简介\n  - 什么是加密货币？\n  - 加密货币的历史\n  - 区块链技术\n  - 加密货币的类型\n\
