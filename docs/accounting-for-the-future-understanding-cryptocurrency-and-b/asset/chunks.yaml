    ## 2. 加密货币出售


    当加密货币以法币出售或兑换为另一种加密货币时，必须将所得收益与成本基础进行比较，以确定是否发生了资本利得或损失。


    *   **资本利得**：当售价高于购买价时。

    *   **资本损失**：当售价低于购买价时。


    利得或损失的计算公式为：


    ```

    资本利得/损失 = 所得收益 - 成本基础

    ```


    ### 示例：以美元出售以太坊


    Sophia 以 10,000 美元购买了 5 枚以太坊 (ETH)（每枚 2,000 美元）。两年后，她以 15,000 美元（每枚 3,000 美元）的价格卖出了这
    5 枚 ETH。她的资本利得计算如下：


    ```

    资本利得 = 15,000 美元 - 10,000 美元 = 5,000 美元

    ```


    这 5,000 美元的资本利得必须为税务目的进行申报。


    在会计术语中，该出售将记录为：


    *   借方：15,000 美元（现金/银行账户）

    *   贷方：10,000 美元（加密货币资产 – 以太坊）

