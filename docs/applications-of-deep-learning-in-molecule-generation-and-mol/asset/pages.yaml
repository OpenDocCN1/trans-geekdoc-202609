    Over the past years, the field of molecule and property prediction has seen a
    revolution, which has been driven by deep learning. Advances in computer hardware
    and software have made natural language processing now applicable to molecular
    properties including bioactivity, ADME, and interactions with targets such as
    QSAR. Rather than relying on sets of expert-defined models, deep learning has
    enabled researchers to develop models that can be trained directly on large datasets.
    With the depth and complexity of the neural networks employed, these models have
    outperformed traditional QSAR approaches. This has also transformed the field
    of de novo generation. Rather than expanding existing molecules or using a set
    of rules to link existing generative models, deep learning generates molecules
    based on learned features of existing molecules.


    provides an overview of machine learning approaches for molecular property prediction.
    A training set with associated data is used to create a model that can be used
    to predict a set of experimental observables.


    # 2.1. Neural Networks for Property Prediction


    Advancements in neural models opened a possibility to handle this state of the
    era. One of the key departments of these models is how molecules relate to properties
    represented within the machine learning algorithms. Traditional models use pre-computed
    features such as fingerprints. The role of the ML algorithm was to learn how to
    weigh these features to deliver accurate attributes. Clearly, the success of these
    models depends on the quality of the training data, which is critical for a predictive
    modeling task. In contrast, neural models learn their own experience representations
    from the data, mapping a molecular structure into a continuous vector space using
    various network architectures.


    While the field is advancing, it still faces a number of significant challenges
    in current research efforts. Although researchers are developing heuristics, we
    specifically lack a fundamental understanding of molecules required to develop
    a learned representation and the scope of chemical space covered by a model. As
    models become more powerful, we need to develop guidelines for the evaluation
    of these “discoveries” and comparing them with more traditional human-driven methods.


