    # 3.2. Applications of Generative Modeling


    While many papers have been describing generative models, very few have reported
    the synthesis of molecules based on generative models. One of the first papers
    to report on synthesis and chemical and biological testing of molecules designed
    by a generative algorithm was published in 2018 by Merck and coworkers who successfully
    designed agonists of retinoid X receptors (RXRs) or peroxisome proliferator-activated
    receptors (PPARs).$^{46}$


    ![](img/536f19b45a7f1be615936a253b8eec62_4_1.png)


    Figure 5. Comparison of Compound 1, designed by a generative model, and the marked
    drug ponatibinib.


    A QSAR model was used to predict the activity of each generated molecule. Subsequent
    biological assays showed that the compound were dual PPAR and RXR inhibitors with
    $EC_{50}$ values between 60 and 13 nM.


    A subset generated by Zhavorov et al. reported the molecules as potent inhibitors
    of DDR1, a protein tyrosine kinase family often implicated in fibrosis.$^{47}$
    That paper received considerable notice in the popular press and led to reports
    of "a drug designed in 21 days." This work was considered notable, in order to
    demonstrate its selectivity in a biochemical model, the authors demonstrated that
    one molecule was active in cells and demonstrated reasonable pharmacokinetics
    in a mouse model. These results initially provided a strong response.$^{48}$ Murcko
    pointed out that the molecule highlighted in the hidden space bore a striking
    similarity to a previously published DDR1 inhibitors, including the marked drug
    ponatibinib (Figure 5). This controversy highlights difficulties in assessing
    the significance of molecules "invented" by generative methods.


    A number of recent papers suggested methods for evaluating the molecules produced
    by generative models.$^{49}$ These benchmarks focus on evaluating the ability
    of generative models to explore chemical space and exploit known information.
    The GuacMolchem benchmark, published by Brown and coworkers, evaluates exploration
    through a series of tests to evaluate the validity, novelty and diversity of molecules
    generated by a generator. The software also has a goal-directed method to assess
    the ability of a generative model to focus on specific chemical space. An alternative
    for evaluating the diversity of molecules produced by a generative model is to
    compare the generated molecules with an exhaustive exploration of chemical space.


    Another question for the field is where to apply generative models in the drug
    discovery process. Given the difficulty of exploring large chemical spaces, one
    can imagine in the assessment of synthesizability$^{50}$ and the use of machine
    learning in the synthesis of synthetic molecules.$^{51}$ the synthesis of molecules
    produced by generative models may end up being difficult or time-consuming.


