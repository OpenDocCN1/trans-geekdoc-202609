    # 2.4. Data Augmentation Strategies


    As mentioned above, the performance of models depends on the quantity of data
    used to train the model. In some machine learning disciplines, it is possible
    to augment data by modifying training examples. For instance, when analyzing images,
    one can create a larger dataset by blurring or inserting elements into the data.
    Unfortunately, this augmentation is not possible with molecules. Every change
    to a molecule can drastically affect the molecular property in context. Multiple
    lines of research are aiming to address these limitations by generating additional
    data or looking for more effective ways of augmenting data. One direction that
    has already been shown to be highly effective is to suggest target training with
    data from related tasks (e.g., Netflix-style recommendation systems). Another
    method of line works is to use encoders of molecular structures to improve learned
    representations. Such approaches have been shown to be successful in computer
    vision and natural language processing to demonstrate similar benefits in the
    context of molecular property prediction.³⁴ However, the crucial dependence on
    training data means that activating a set of candidates requires a fixed training
    budget. These learning approaches provide a systematic approach to the exploration
    and optimization of their properties (encoding). By informing the collection of
    experimental data with diverse properties, researchers can hopefully strengthen
    the drug discovery process.


    decode a continuous representation to generate new molecules. In an alternate
    approach, another type of deep neural network (RNN), can be used to generate new
    molecules.³⁵ An RNN is designed to learn sequential data such as text or speech.
    When an RNN is trained to generate molecules, it learns which parts of molecules
    belong to atoms or groups being connected. These connections vary depending on
    the parts of the molecule it has already seen. By treating the molecule as a sequence
    of atoms at each step, one can generate molecules with a high likelihood of being
    valid and bearing some resemblance to the training process. In another approach,
    known as reinforcement learning (RL), the agent learns a series of actions to
    reach a specific goal.³⁶⁷ The most well-known example of RL is AlphaGo, a program
    developed by Google, that defeated a grandmaster in the strategy game known as
    Go.³⁹ In molecular drug design, generative models define a molecule to grow or
    change through the addition and modification of bonds. A goal is defined as a
    reward based on a predicted metric and the agent then learns the path to that
    goal. In a 2019 paper, Zhao and chaholders used RL to generate molecules with
    multiple objectives, including similarity to a target molecule and diversity.


    # 3. DE NOVO MOLECULAR DESIGN WITH GENERATIVE MODELS


    Over the past few years, we have seen the emergence of a new number of approaches
    to novo molecular design that have been inspired by techniques used in areas such
    as computer vision and natural language processing. This field has gained significant
    interest in the machine learning community, lately of natural chemistry, to increase
    state-of-the-art performance. In instance, from 2017 on some data sets, the absolute
    gain reached over 20% (measured by the quality of generating molecules with the
    desired properties).


    The first of these techniques, known as an autoencoder (3), utilizes complex tasks:
    to encode molecules in a continuous latent space that facilitates the prediction
    and optimization of their properties (encoding) and to learn an optimal representation
    of a molecular graph with improved properties (decoding).⁴⁰ This is illustrated
    in Figure 4, where we navigate and


    The first applications of generative models to novo molecular design used the
    Simplified Input Line Entry System (SMILES) representation of the molecular structure,
    which was transformed into a latent vector and further optimized to decode the
    desired property.³¹ The new optimized vector is then decoded into a SMILES string
    representing the output molecule. The key assumption in this approach is that
    representation in this space is smooth, in contrast to the discrete nature of
    molecular space. However, research has revealed that the constructed latent space
    is far from smooth: molecules with similar properties might not be similar to
    each other in the latent space. This part of the explanation can be bridged by
    the IMPACT of SMILES representation as a starting point—similar molecules may
    have very different SMILES strings. However, there are other contributing factors,
    such as property cliffs (chemicals with very similar structures but very different
    properties) and chemical constraints of the synthesis process. Recent work has
    significantly advanced the state of the art in novo generative models. Moving
    molecules representations have explored encoding and decoding algorithms that
    can effectively process molecular graphs. Unlike computer vision and natural language,
    the field is still far from having a standard architecture, and we expect to see
    new developments in this area.


