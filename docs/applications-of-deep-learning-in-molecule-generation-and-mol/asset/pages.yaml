    # 1. INTRODUCTION


    # 2. MOLECULAR PROPERTY PREDICTION


    The generation and evaluation of new molecules based on data are critical tasks
    in the design of new medicines. In the early days of drug discovery, iteration
    were largely manual and intuition-driven. Scientists would test a set of compounds,
    examine the data produced, and use an understanding of the underlying science
    to synthesize molecules. The structural-activity relationships (QSAR) in the 1990s
    created a framework for associating compounds with chemical properties from physical
    or biological responses. These quantitative models formed the basis of many virtual
    screening strategies.


    The promise of virtual screening has moved decades beyond infancy. machine learning
    (ML) methods for predicting molecular properties ranging from biotoxicity to distributive
    and physical properties. If successful, these methods could transform the process
    by reducing the time and expense associated with experimental screening while
    broadening the chemical space. Current experimental screening approaches can potentially
    access millions of molecules, virtual screening can enable the evaluation of billions
    of molecules in a short time. The ML algorithms developed using virtual screening
    can capture complex chemical structure and the nature of molecules. The assumption
    is that when methods of chemical analysis used with large amounts of data in the
    form of measured properties, these algorithms can systematically capture properties
    that may be too subtle for humans to grasp.


