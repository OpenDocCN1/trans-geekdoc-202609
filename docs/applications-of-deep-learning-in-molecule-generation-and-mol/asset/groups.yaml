    ## 个人传记


    W. Patrick Walters在马萨诸塞州的Relay Therapeutics领导计算与信息小组。他的小组专注于计算方法的新颖应用，通过整合模拟和实验数据来驱动药物发现。在加入Relay之前，他在Vertex
    Pharmaceuticals工作了20多年，担任全球建模与信息学负责人。他在亚利利桑那大学获得博士学位，在构象分析方面积累了专业知识。在获得博士学位之前，他曾在Instruments担任化学家和软件开发人员。他拥有科罗拉多大学的化学学士学位。


    Regina Balazaki是马萨诸塞理工学院工程与计算机科学系教授，也是该校计算机科学与人工智能实验室的成员。在MIT，她领导生物学机器学习小组，并担任James
    Clinic（一个专注于机器学习与健康的中心）的教职负责人。她的研究兴趣包括自然语言处理和肿瘤学。她曾是哥比亚大学Rossel的博士后研究，并在尼日尔大学Gen
    Bonn担任了一年的博士后研究。


    ## 4. 总结与展望


    在过去的几年里，人工智能在药物发现领域引起了巨大的兴趣、热情和应用的激增。尽管一些小组发表了具有前景的结果，但需要注意的是，药物发现是一个需要平衡参数的复杂过程。为了实现针对目标的活性，药物发现必须避免副作用并确保安全递送。


    最后，生成机器学习模型最关键的要素之一是数据。不幸的是，训练这些模型所需的大数据存在制药公司或出版商的内部数据库中。大量的实验数据可用于扩展质量，随着该领域的发展，我们可能能够创建出哪些分子包含错误。预测的质量和可靠性取决于所使用的数据。只有当个人收集到易于使用的数据集时，领域才能向前发展。虽然我们不认为AI是药物发现的万灵药，但它将成为用于开发药物的广泛技术中的另一种工具。


