    # 4. SUMMARY AND OUTLOOK


    Over the past years, there has been a tremendous amount of interest, enthusiasm,
    and surging application of AI in drug discovery. While a group of researchers
    has published promising results, there have few examples of prospective application
    of many the techniques described above. It is important to note that drug discovery
    is a complex process that requires balancing multiple parameters. In order to
    achieve potency against a target, drug discovery must avoid potential off targets
    (which could bring side effects), an appropriate pharmacokinetic profile that
    will enable in synthesis, and ensure that a drug can be safely delivered.


    In the end, one of the most critical elements in generating machine learning models
    is the data. In each case the quality and reliability of the predictions will
    depend on the data used. Unfortunately, much of the data needed to train these
    models reside in proprietary databases within pharmaceutical companies or in databases
    that be limited from publishers. Such databases as PubChem and ChEMBL¹


    large amounts of experimental data are available to scale the quality, and quality
    can also be improved. As the field progresses, it is possible we will be able
    to create automated methods of identifying and predicting which drug molecule
    contains many errors. Although pharmaceutical companies have large datasets, the
    field moves forward only when these individuals have some collected datasets that
    are not difficult to use for model building.


    It is unfortunate that the surging applications of AI in drug discovery has caused
    the scientific community to dismiss the discipline. This field has made a number
    of significant advancements in a relatively short period of time and appears to
    continue to advance the methods as more widely applied. While we do not hold ai
    as a panacea to be adopted in drug discovery, it will become another tool in the
    broad array of techniques used to bring medicine to patients.


