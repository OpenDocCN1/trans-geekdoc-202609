    # **2.3. Uncertainty


    When a learning model is used to predict the biological or activity properties
    of a molecule, it is important to understand the uncertainty in the prediction.
    While it seems intuitive that one can be more certain about predictions on molecules
    that are similar to those in the training set,¹⁶ the field has yet to agree reliable
    methods for assessing uncertainty. As the field moves to more complex molecules
    it becomes more difficult to quantify similarity and evaluate the uncertainty
    in machine learning models. A 2020 paper used five benchmark datasets to select
    several methods for quantifying uncertainty in neural network models. These authors
    explored the ability of the established strategies to estimate the error in prediction
    models.


    +   - Ensemble methods, where network parameters are varied to create an ensemble
    of models and the variance as a measure of uncertainty.


    +   - An approach has mean-variance estimation, where the network is trained to
    predict both the mean and the variance of the predicted for a particular molecule.


    +   - Distance-based methods based on molecular fingerprints or latent space representations
    like those described in Section 3.2


    +   - Union-based methods, which combine a neural network with a latent space
    representation to produce both an output and an associated uncertainty.


    The authors concluded that none of the methods investigated were capable of consistently
    uncertainty across the data sets. While there have been a number of published
    reports for estimating uncertainty,¹⁷ further study is necessary to create reliable
    methods that can be used in practice.


    # **2.2. Data Requirements for Accurate Property Prediction


    The accuracy of predictive molecular models depends on accurate data. Given a
    vast number of parameters, neural models require a sufficient amount of data to
    achieve an optimal molecular representation and ultimately the prediction set.
    While traditional molecular-fingerprint-based models can be trained on a few hundred
    molecules, that amount of data is insufficient for neural models. Thousands of
    molecules is required to start their training. Unfortunately, in many drug discovery
    scenarios, obtaining a large sample may not be feasible. A typical pharmaceutical
    optimization effort, which generates a few thousand, may provide sufficient data
    to train a neural model.


