    Complete information is available at:


    https://pubs.acs.org/doi/10.1021/acs.c006999


    Notes


    The authors do not claim financial interest.


    ## Biographies


    W. Patrick Walters leads the Computation and Informatics group at Relay Therapeutics
    in Massachusetts. His group focuses on novel applications of computational methods
    that integrate simulations and experimental data to drive drug discovery. Prior
    to joining Relay, he spent more than 20 years at Vertex Pharmaceuticals, where
    he was Global Head of Modeling & Informatics. He earned his Ph.D. from the University
    of Arizona, where he developed expertise in conformational analysis. Prior to
    obtaining his Ph.D., he worked at Instruments as both a chemist and a software
    developer. He holds a B.S in chemistry from the University of Colorado.


    Regina Balazaki is a professor in the Department of Engineering and Computer Science
    and a member of the Computer Science and Artificial Intelligence Laboratory at
    Massachusetts Institute of Technology. At MIT she leads the Machine Learning for
    Biology group and faculty lead of James Clinic, a center for machine learning
    and health. Her research interests include natural language processing and oncology.
    She was a postdoctoral researcher at Rossel at Columbia University and she spent
    a year as a postdoctoral researcher at Gen Bonn of the University of Niger.


    ## 4. SUMMARY AND OUTLOOK


    Over the past years, there has been a tremendous amount of interest, enthusiasm,
    and surging application of AI in drug discovery. While a group has published promising
    results, it is important to note that drug discovery is a complex process that
    requires balancing parameters. In order to achieve potency against a target, drug
    discovery must avoid side effects, safely delivered.


    In the end, one of the most critical elements in generating machine learning models
    is the data. Unfortunately, much of the data needed to train these models reside
    in proprietary databases within pharmaceutical companies or in publishers. Large
    amounts of experimental data are available to scale the quality, and as the field
    progresses, it is possible we will be able to create which molecule contains errors.
    The quality and reliability of the predictions will depend on the data used. The
    field moves forward only when individuals have collected datasets that are not
    difficult to use. While we do not hold AI as a panacea to be adopted in drug discovery,
    it will become another tool in the broad array of techniques used to bring medicine
    to patients.


