    # 1. 引言


    # 2. 分子性质预测


    基于数据的新分子的生成和评估是新药设计中的关键任务。在药物发现的早期，迭代在很大程度上是人工和直觉驱动的。科学家会测试一组化合物，检查产生的数据，并利用对基础科学的理解来合成分子。20世纪90年代的构效关系（QSAR）为化合物与性质之间的联系建立了一个框架。


    ### 2.1. 用于性质预测的神经网络


    在过去的几年里，分子和性质预测领域经历了一场深度学习驱动的革命。计算机硬件软件的进步使得自然语言处理现在适用于分子性质，包括生物活性、ADME 以及与靶点的相互作用。深度学习不再依赖于专家定义的模型，而是使研究人员能够开发可以直接在大型数据集上训练的模型。由于所采用神经网络的深度和复杂性，这些模型的性能优于传统的
    QSAR 方法。本文提供了分子性质预测的机器学习方法的概述。使用带有相关数据的训练集创建一个模型，该模型可预测一组实验观测值。


