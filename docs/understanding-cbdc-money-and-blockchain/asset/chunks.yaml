- raw: 'In what we usually call developed countries, the use of cash is very low,
    almost non-existent, for example in the Nordic countries, where paying with physical
    money is becoming increasingly difficult as businesses and shops prefer the convenience
    of electronic means of payment.


    We all associate money with coins or bills, but almost all existing money is an
    electronic record. It is truly amazing how a social abstraction we call money
    is considered real only because in its least used form, cash, we can still touch
    and count it.


    I have on many occasions heard people very reluctant to consider the value of
    owning bitcoin, arguing that it is not tangible, it is electronic, "virtual" and
    therefore not real, although they are not yet aware that their money in the bank
    is exactly an electronic record, and even more virtual than bitcoin itself, since
    that record is maintained by the private computer system of a bank.


    The island of Yap has a strange form of money. In Micronesia, in the Pacific Ocean,
    large stone discs were used as money. These discs, known as "Rai Stones", were
    hand carved from a special limestone rock found only on a small nearby island,
    not on Yap Island itself.


    The Rai Stones were very large and heavy, some measuring over 3 meters in diameter
    and weighing over 4 tons.


    Rai Stones were used as a medium of exchange for important economic transactions.


    Once a Rai Stone was used in a transaction, its ownership was transferred to the
    new owner.


    Everyone on the island knew about the transaction and therefore recognized the
    new ownership of a Rai Stone by associating it with its new owner. However, the
    physical disk remained in its original location.


    This was because they were too large and heavy to be easily moved or stolen.


    Rai Stones were considered valuable not only because of their size and weight,
    but also because of the history and reputation of their provenance.


    Rai Stones are essentially a monetary record of a large transaction, but of public
    knowledge and acceptance by all inhabitants of the island.


    We can think of the definition of money as a quantifiable record of the value
    that our work has contributed to society, or the value that farmers, fishermen,
    ranchers, manufacturing or service companies have contributed to society.


    I particularly like this definition of money, just as I naturally rebel against
    money that is created out of nothing, as debt with interest to be repaid, issued
    by opaque institutions that are not even democratically elected, such as central
    banks.


    Understanding money as a record still causes a certain amount of rejection in
    many people, because we almost unconsciously associate money with its physical
    form, and it makes them uncomfortable to think that it is just a record that can
    be easily lost, erased, or altered.


    Let''s look at a striking example to try to assimilate that perhaps the best definition
    of money is as a record.


    After the invasion and armed conflict between Russia and Ukraine that began in
    February 2022, the United States, using its control over the Western financial
    and monetary system, first promoted the freezing or blocking of Russian state
    bank deposits throughout the Western world (where we must also include Japan)
    and immediately the bank deposits of all Russian companies as well as Russian
    citizens in an arbitrary manner, since many Russians will undoubtedly be against
    such a war.


    Many Russian banks have been blocked and excluded from the banking interconnection
    system called SWIFT\*, which in practice means an isolation of the entire Russian
    banking system, at least with Western banks.


    The amount of money frozen, although it would be more correct to say confiscated,
    from Russia reaches about $300 billion in various banks and in various Western
    countries.


    Without going into an evaluation of this act, nor mentioning the consequences,
    for which we would need another book, we can realize that in recent decades Russia
    has exported its valuable commodities in immense quantities to the whole world,
    not only oil and natural gas, but also grain, fertilizers, metals such as aluminum,
    palladium, gold, uranium, the list could be much longer, receiving in return those
    billions of dollars that were "deposited" as dollars and euros in Western banks,
    in quotation marks, because "deposited" really means recorded in some accounting
    notes, simple numbers in the computer system of a few banks.


    The immense cost and labor involved in sourcing, refining, and delivering these
    large volumes of goods in exchange for digital transactions can now be fully appreciated.


    When we realize that money is primarily a record, we understand how vulnerable
    it is and how easy it will be to block or confiscate your money from the CBDC
    application that will be forced upon us.


    If you have bills or coins, you own them, and although they could be confiscated,
    it would not be that easy, you can always protect or hide your physical money.


    When your money is accounted for as a number in a computer system managed by a
    bank, or in a CBDC system managed by the central bank and the government, it is
    no longer in your possession, and therefore you do not own it. You only have permission
    to use it, and that permission can be conditioned or revoked at any time.


    Note that the same principle can be applied to a digital identity; if your identity
    information is electronic, it could be altered or deleted without you being able
    to do anything about it.


    This argument has been used in novels and movies to describe dystopian worlds
    where the government could make any individual who proves rebellious disappear.


    ## **CHAPTER 4.**


    ## **Differences from Cryptocurrencies like Bitcoin.**


    As I mentioned in the analysis of the "reasons" given by central banks and governments,
    CBDCs are the antithesis of a cryptocurrency like bitcoin.


    Let''s look deeper into the subject, we are already clear on several concepts,
    fiat currencies, like all current ones, are not backed by anything other than
    a legal imposition and the confidence we assume that the state authority will
    be able to exert whatever force is necessary to maintain that imposition.


    Let''s look at a quick list of the differences and then analyze them:


    1 a/b. Issuer/Issue: A CBDC coin is issued by a central bank, while Bitcoin is
    decentralized and has no central issuer.


    2\. Regulation: A CBDC coin is regulated by the government, while Bitcoin is not
    regulated by laws, only by its internal protocol published in its white paper.


    3\. Privacy: CBDC transactions are monitored by the central bank and/or the government,
    while Bitcoin transactions are pseudonymous.


    4\. Processing: CBDC transactions may be faster than bitcoin transactions due
    to centralization.


    5\. Volatility: The volatility of CBDC coins may be lower than Bitcoin due to
    regulation.


    6\. Permissioned System: CBDC coins must identify the user or company and may
    have restrictions on their use, while Bitcoin is non-permissioned and can be used
    freely.


    7\. Adoption: CBDC adoption will be enforced by the government and central banks,
    while Bitcoin adoption is entirely voluntary and driven by the community of its
    users.


    Let us analyze the differences.


    1a. Issuer.


    As we have seen above, fiat currencies are issued by central banks, although the
    money supply is mostly created by commercial banks through the creation of credit.


    If the issuers, the central banks, are interdependent and not independent of governments,
    the criteria for issuing and setting the interest rates that define the price
    of credit and effectively control the money supply will clearly be set to satisfy
    the desires of governments and banks, and not according to social interests or
    the common good of society, to think otherwise would be naïve.


    Bitcoin is issued according to a publicly known, pre-established and decentralized
    protocol that is de facto accepted by all its users.'
