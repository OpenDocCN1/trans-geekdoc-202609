- raw: 'The issuance of non-gold-backed money since 1971 has resulted in a loss in
    the purchasing value of money.


    Between 1971 and 2021, the dollar has experienced an average annualized inflation
    rate of 3.87%, resulting in a cumulative "devaluation" of -85.05%.


    Reference: US Official Data Org.


    [https://www.officialdata.org/us/inflation/2021?endYear=1971](https://www.officialdata.org/us/inflation/2021?endYear=1971)


    The history of the dollar''s decline and the chronology of gold.


    To conclude this point, we must always remember this concept: **The more money
    is issued, the less value it has**.


    To explain this, I will use a simple parable that you can tell your children so
    that they are not misled in the future about the causes of inflation.


    Let''s imagine that money has just been invented and the central bank has created
    100 euros/dollar. If there are only 100 cans of tuna for sale on the market, and
    there are only 100 euros/dollar, nothing else for sale and nothing else to buy,
    it seems clear that the price of each can of tuna will be 1 euro/dollar.


    (100 *€ or* $ / 100 cans of tuna = 1 euro/dollar per can)


    Now someone, not elected by the citizens, decides from his position in the central
    bank to carry out a QE (Quantitative Ease\*) and creates out of nothing, by the
    power granted to him by law, 900 new euros/dollar.


    We still have the same 100 cans of tuna, but the total money supply is now 1,000
    euros/dollar. The reader will quickly guess that each can of tuna now costs 10
    euros/dollar.


    (1,000 *€ or $* / 100 cans of tuna = 10 euro/dollar per can).


    The value of the can of tuna has not increased, it is still the same 100 cans
    of tuna, if each can now costs 10 euros/dollars, it is because the value of money
    has decreased and it takes more money to buy the same can of tuna.


    **Inflation is not the general rise in prices, it is the loss of purchasing power
    of money, and this effect is always a monetary event.**


    Remember this definition; the disinformation media will try to mislead you every
    day by making you believe that inflation is the result of "shortages" in supply
    chains, wars started by some dictator, climate change, or whatever absurd cause
    some journalist can come up with.


    Inflation is always a monetary event, caused by the issuance of fiat money, not
    backed by an increase in the production of goods or services.


    Now, when the central bank decides to create new money out of thin air, a process
    which the media euphemistically call *"quantitative easing", or “QE”, it does
    so by various methods* which we will not go into in this chapter, but which will
    be explained later, for the moment in a very simple way and again using financial
    or disinformation slang, it initiates a "liquidity injection", it lends money
    at very low-interest rates to commercial banks so that they, in turn, buy public
    debt from governments and grant loans to companies and individuals, of course
    with a differential in these interest rates in their benefit.


    Companies and individuals will pay a higher interest rate than the interest on
    the loans initially obtained from the central bank, and the difference between
    the interest paid to the central bank and the interest charged to governments,
    companies, and customers will provide the commercial banks with large profits
    from their financial intermediation.


    In this indirect way, although there are several other ways, they manage to inject
    new money, which always creates an economic boom, and always with a certain time
    lag, when this new money enters into circulation in the real economy of companies
    and individuals, is when inflation finally appears "unexpectedly".


    With CBDCs, creation and issuance will be direct and immediate, bypassing commercial
    banks, and knowing the track record of central banks and governments'' addiction
    to spending more than they take in, what can we expect? More money issued, which
    will steal value from ours, and more money spent, which will add to the national
    debt.


    When citizens lacking the most basic notions of economics were informed on the
    television that the European Central Bank, or ECB, had created a "liquidity injection"
    of 2.5 trillion euros to save the economy during the pandemic, and that the ECB
    was "buying" 80 billion (new millions created out of thin air) of government bonds,
    mortgage-backed bank bonds, and large corporate bonds every month, almost no one
    was concerned about the excessive issuance of money.


    Money created out of thin air, but which we will have to pay back with interest
    through our taxes and inflation, the so-called silent tax on the poor.


    CBDCs will only speed up the process of creating new money and give central banks
    free rein to issue or withdraw money whenever they want, in a direct and immediate
    way.


    5\. Competing with cryptocurrencies.


    One does not have to be very astute to realize that, observing the development
    and adoption of some cryptocurrencies, in particular bitcoin, the determination
    of governments and central banks to issue digital electronic currencies as legal
    tender seems to be a crude attempt to imitate, combat and slow down the adoption
    of some of these cryptocurrencies.


    If cryptocurrencies, again specifically mentioning bitcoin, and the "tokens\*"
    represented by cryptocurrencies called "stable coins"\* with 1:1 parity, or at
    least intentional parity with fiat currencies, were to be massively accepted and
    adopted by businesses and individuals, central banks and governments would lose
    the "exorbitant privilege" of creating and controlling money, and thus controlling
    the economy.


    A simple definition of a token\*.


    A token is like a casino chip, when we enter the casino, we go through the cashier
    and buy with real money the chips that represent money in the casino and are used
    at the gaming tables.


    If we have any chips left when we leave the casino, we can go back to the cashier
    and exchange them for ''real'' money.


    The problem could arise if the casino''s cashier is closed for some reason; then
    we would not be able to exchange the chips for real money, and those chips would
    have no value outside the casino.


    ## **CHAPTER 3.**


    ## **Understanding Money.**


    ## **History and Evolution of the Monetary System.**


    Money is one of those things that we rarely stop to think about what it is and
    where it comes from, even though we have all been using it since childhood.


    We can find several definitions, but the most common is the following:


    Money is any medium of exchange commonly accepted by society to buy and sell goods
    and services.


    In addition to the first expected property of money, that it is generally accepted,
    it must have several other properties, the most important of which is that it
    stores value and is a unit of account for measuring or quantifying the value of
    goods and services.


    The list of properties that we should expect a medium of exchange to have in order
    to call it money is as follows, in no particular order of importance.


    1\. Acceptance: Money must be generally accepted as a means of payment for the
    acquisition of goods and services.


    2\. Divisibility: Money must be easily divisible into smaller fractions to facilitate
    exchange.


    3\. Interchangeability: Goods and services can be bought with money and sold in
    exchange for money.


    4\. Unit of account: Banknotes and coins should have a numerical or standardized
    face value that serves to quantify the value of goods and services.


    5\. Reserve of value: Money should be a store of value overtime.


    6\. Scarcity: Money must be limited to maintain its value. **The more money is
    issued, the less value it has**.


    7\. Portability and Durability: Money must be easy to transport and store, and
    it must resist wear and tear.


    8\. Fungibility: This concept applied to money means that any unit or fraction
    of money is indistinguishable from any other unit or units of the same denomination.
    For example, the value of five $1 coins is identical to the value of one $5 bill.'
