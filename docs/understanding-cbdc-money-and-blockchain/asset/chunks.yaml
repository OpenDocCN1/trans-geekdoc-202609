- raw: 'Bitcoin, its protocol, and its blockchain cannot be controlled or altered
    by any government, corporation, group, or individual.


    Bitcoin''s characteristics make it the best money yet created, especially for
    Internet commerce.


    It is possible that over time, nations will discover that it could be the ideal
    solution for settlement and payment in international trade, including trade between
    political enemies.


    Of course, it will be rejected by governments, as its widespread use would cause
    them to lose control over fiat currencies, but they could quickly accept it for
    international trade, as Russia and Iran, among other states, are already exploring.


    By 2023, there are already two states, El Salvador and the Central African Republic,
    that grant bitcoin legal tender status, along with the dollar in El Salvador and
    the CFA franc in the Central African Republic.


    The state control that will be exercised through CBDC currencies will force citizens
    to consider a monetary alternative in defense of freedom, our money and our patrimony.


    We should keep in mind the concept that when money is nothing more than a record
    in a computer system controlled by the government, it will no longer be our money,
    we will have permission to use it, permission that can be conditioned or revoked
    at any time.


    Again, to quote Charles de Gaulle''s speech in which he said, "We think it necessary
    that international trade should be based on an indisputable monetary standard,
    and that it should not bear the stamp of a particular country. What standard?
    The truth is that no standard other than gold is conceivable!


    Charles de Gaulle could not imagine any standard other than the gold standard,
    because at that time the Internet could not even be imagined.


    I cannot miss this opportunity to recommend the book:


    The Bitcoin Standard: The Decentralized Alternative to Central Banking.By professor
    Saifedean Ammous. Professor of Economics at the Adnan Kassar School of Business
    at the American University of Lebanon.


    Thanks to *“*my age*”*, I''ve been fortunate enough to witness several significant
    societal changes resulting from the advancements in technology.


    I have always been a technology enthusiast, and since my teenage years I have
    witnessed firsthand the evolution of computing and the popularization of microcomputing
    in the 80''s of the last century, which later became my profession.


    I enjoyed living through this revolution, and in those years, with my 8-bit personal
    computers that could barely display 256 colors, I was already dreaming of digital
    photography and audio.


    I still remember the comments of professional photographers at the time who argued
    that poor digital photography would never compete with, much less replace, analog
    photography based on chemical film.


    There is a famous conversation at a Kodak board meeting when one of the attendees
    suggested promoting the incipient digital photography that Kodak was already developing.


    And the response to that suggestion was:


    "If digital photography develops, what will we do with our entire industrial base
    of chemical film and photographic paper production?*”*


    "Filmless photography is nice, but don''t tell anyone about it."


    Failure to innovate was the primary reason for Kodak''s demise with the advent
    of digital photography.


    Although the company essentially invented the digital camera, it suppressed the
    technology out of fear that it would threaten its profits from traditional film.


    Digitalization, like all previous technological revolutions, has been disruptive
    in all areas, and although it is still being resisted in the monetary system,
    it will be no different.


    And no, when I talk about digital money, I am not talking about credit cards or
    Google/Apple Pay.


    I also remember the introduction of the Internet into every home, with modems
    plugged into the phone''s audio line, the first emails sent from the Netscape
    browser, and the first songs in mp3 format.


    Things that were unimaginable just a few years earlier became normal thanks to
    personal computers and the Internet.


    I remember, when I was a student of digital electronics and microprocessors in
    the late 1980s, that I read with some skepticism in an electronics magazine that
    standards were being developed for cellular telephony and that in a few years
    we would be able to make phone calls from our cars.


    A few years later, smartphones with permanent Internet connection would arrive.
    The technological evolution forces changes in our lives and in our society, it
    has always been like that, since the time of the caves, what happens now is that
    these changes are accelerated, more and more important and in less time.


    With these experiences in mind, I can safely say that it won''t be long before
    we have a universal and neutral digital money, free from government and corporate
    interference, impossible to confiscate, and impossible to be censored. What''s
    even more, it may already be available and accessible to everyone.


    The idea that government and corporate fiat money can be replaced by a different
    monetary system may still seem like utopia or fiction, but it is not, this technology
    already exists.


    *“Any sufficiently advanced technology is indistinguishable from magic”*


    Arthur C. Clarke.


    ## **Glossary.**


    **Accounting entry.**


    A written entry detailing a commercial or economic movement that changes the assets
    of a person or company. In accounting, journal entries are used to record each
    of a company''s transactions.


    **Backing.**


    Backing, in finance, is a guarantee offered or received to support a financial
    transaction.


    For example, in a mortgage, the guarantee or financial backing provided as collateral
    is the property.


    During the Gold Standard period, the backing of banknotes was a certain amount
    of gold for which the banknote could be redeemed.


    **Bail-in / Bail-out.**


    Bail-in, or more simply a financial rescue, is the refinancing of a troubled financial
    institution or entity.


    Bail-out refers to the fact that the capital for this rescue comes from outside
    the entity, usually from other entities or from the states, which will pass this
    cost on to the taxpayers.


    Bail-out was the model used in the 2008 financial crisis.


    Bail-in refers to the fact that the capital to rescue the troubled institution
    comes from within the institution, i.e. from shareholders or depositors.


    After the 2008 crisis, all the countries of the world updated their laws in order
    to carry out bail-ins in future crises.


    It is very important to understand that in the future, when a bank is in trouble,
    the authorities will enforce these laws by taking capital from the bank''s creditors,
    i.e. its shareholders and depositors, and only after that, if it is still not
    enough, the deposit guarantee funds will act.


    **Balance Sheet.**


    Balance sheet is a financial report that is made periodically; monthly, quarterly
    or annually, detailing all the assets, value of what is owned, and liabilities
    or debts and the resulting capital of a company.


    With a very simple formula:


    Assets - Liabilities (Or debts) = Capital of the company.


    This term is commonly used in the media to refer to financial assets that have
    been "purchased" by central banks, such as corporate bonds, government bonds,
    or treasury bonds.


    Note that these assets are purchased with new money created out of thin air to
    make such purchases.


    Central banks are creating new money with these purchases.


    **Bear Market / Bull Market.**


    Colloquial expressions of financial terminology to denote a bear market, or Bear
    Market, in analogy to how the bears attack, from top to bottom, when lowering
    their claws, or Bull Market, Bull Market, in analogy to how the bulls attack,
    goring from bottom to top.


    **BETA Index.**


    In financial terminology, the beta index is an indicator that measures the volatility
    of an asset (a stock or security) relative to the market in which it is traded.'
