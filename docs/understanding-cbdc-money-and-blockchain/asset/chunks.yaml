- raw: 'The answer to the second question: What is the difference? Virtually none.
    Since investors and other financial institutions rarely want to buy the public
    debt of southern countries, or do so in small amounts, most and usually all of
    the public debt issued by countries like Spain or Italy is purchased by the ECB
    "at auction" or on the secondary market, in this author''s opinion, in violation
    of Article 123-1.


    Despite the fact that the Court of Justice of the European Union has ruled that
    it does not violate Article 123.1 of the Treaty on European Union.


    With this legal trap, the ECB is financing the structural deficit of the countries
    of the South, giving the politicians of these countries the wings to continue
    increasing the deficit until we reach the point where we will not even be able
    to pay the interest on this debt, since it has already reached a value that makes
    it unpayable.


    Many economists describe the situation as "keep kicking the can down the road
    and we''ll see in the future.


    Another way the central banks create money is by lending to the commercial banks,
    the normal thing is that the central bank charges the banks a moderate interest,
    according to the interest rates they set, and the banks charge their customers
    a higher interest, making a profit on the difference.


    Therefore, money is again created as debt; debt that must be repaid, but since
    there is always more debt than money, to pay the interest on this new money, more
    money must be created, which in turn creates more debt.


    This is the ultimate reason why our monetary system is inherently unstable and
    unsustainable, and is considered by many to be a Ponzi scheme\* or pyramid scheme.


    And a Ponzi scheme has no solution until it collapses.


    However, for the last ten years the ECB has been lending money at negative interest
    rates, which in the simplest explanation is an economic and logical aberration,
    since interest rates set by central banks are the price of money.


    It is an aberration when a commercial bank borrows money from the central bank
    and the commercial bank has to pay back less than it borrowed, i.e. the Central
    Bank is paying for lending, or seen from another point of view, the commercial
    bank borrowing is charging the Central Bank for receiving credit. It is simply
    illogical.


    In addition, the central bank charged commercial banks for keeping their deposits
    at the central bank itself instead of remunerating their deposits, in an attempt
    to force commercial banks to lend these funds to improve the economy, which never
    happened.


    This anomalous and abnormal situation we have been suffering in Europe for the
    last few years, and because of the consequences it has generated, such as the
    runaway inflation crisis that Europe is experiencing in 2022 and 2023, during
    the writing of this book. Finally, the period of negative interest rates has ended
    with a sharp rise in interest rates set by the European Central Bank.


    By raising interest rates, credit contracts, such as loans and mortgages, increase
    the interest that applicants must pay, causing a reduction or contraction in the
    number of loans, which in turn reduces the amount of money in circulation, which
    will certainly lead to a collapse in consumption, higher mortgage rates, and a
    certain recession.


    By reducing the demand for goods and services due to the crisis, prices should
    fall.


    However, there is a popular saying about inflation that goes:


    "Inflation is like toothpaste, it''s easy to take out of the tube, but hard to
    put back in."


    **Let''s review some important concepts.**


    Inflation is the loss of purchasing power of money caused by the issuance of new
    money.


    The more money is issued the less value it has, so more money is needed to purchase
    the same goods or services.


    Rising prices are a symptom of inflation, not its cause; the cause of inflation
    is always a monetary event.


    Inflation is not a one-time event, it is a permanent, deliberate and inherent
    characteristic of fiat money, created and controlled by the issuer of the currency.


    The money we know as the Euro, Dollar, Pound, etc. is fiat money that is not backed
    by precious metals, it simply has value by legal imposition in the respective
    geographical areas.


    Money is created as debt; therefore, fiat money is debt.


    Since all money issued is created as debt with interest to be repaid to the issuer,
    there is always and at all times more debt than money.


    **Forms of Money.**


    Money comes in many forms. But the most common are: cash in the form of coins
    and bills, checks, credit/debit cards, bank transfers and electronic wallets,
    promissory notes, and corporate or government bonds. They are all different forms
    of money.


    Note to the reader that except for cash in the form of coins and bills, the above
    list mentions others that are not necessarily issued by the central bank, and
    all of them are a representation of money in the form of a record of a promise
    or obligation to pay, such as a check, bond, or certificate issued by the treasury
    or public administration of a state, or the key or physical object, such as a
    credit or debit card, that allows access or disposal of the money deposited in
    a bank account by means of a secret key, but in essence all of them are nothing
    more than physical or electronic written records.


    As I mentioned earlier, most of the money in circulation was created by commercial
    banks in the form of loans and exists only as an electronic record in the banks''
    database.


    Only in countries with a large unbanked population, such as India, is the amount
    of cash in circulation greater than the amount "deposited" in bank records, although
    the process of transition from physical cash to electronic money is developing
    rapidly.


    India will move directly from a mostly physical money circulation to CBDCs thanks
    to the gigantic electronic and biometric identification program that the Indian
    government has implemented, as well as brutal coercive measures such as eliminating
    the highest denomination notes and those most used by the poor to store their
    savings by forcing them to open bank accounts.


    On the evening of November 8, 2016, Indian television made a surprise announcement.
    In a live appearance, Prime Minister Narendra Modi declared that the two most
    valuable banknotes on the market (Rs. 1,000 and Rs. 500) would be withdrawn from
    circulation immediately. The demonetization plan, as the press called it, had
    been planned in secret and was immediately hailed as Modi''s masterstroke against
    dark money.


    The immediate result was chaos. People rushed to banks and ATMs to exchange their
    old notes and withdraw the new currency. Bank queues grew, many people suffered,
    especially the poor who did not have access to credit cards or mobile wallets,
    and dozens were reported dead in the crisis.


    The Indian government''s Aadhaar program was launched in 2009 to provide all Indian
    citizens with a unique identification number to facilitate access to government
    and financial services.


    Aadhaar is an online identity verification system that uses iris, fingerprint,
    and facial recognition technology to verify a person''s identity.


    Indian citizens must register for an Aadhaar number and then use it to access
    a variety of services, including financial assistance, healthcare services, and
    access to social security programs.


    In addition to providing access to government and financial services, Aadhaar
    has helped reduce corruption by reducing the need for physical documents and reducing
    duplication of financial assistance and other government programs.


    Obviously, Aadhaar is the essential first step in the implementation of the e-Rupee
    CBDC.


    Note the importance of this electronic identification in several areas that will
    allow the government to have full control over its citizens, without neglecting
    the practical benefits it brings in a country of 1.4 billion people.'
