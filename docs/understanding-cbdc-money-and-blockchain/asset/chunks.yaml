  trans: '


    如果这种货币由世界上人口最多、商品产量最大的经济体所使用并提供支持，它可能会迅速取代美元，成为国际贸易货币和储备货币，从而给西方国家带来严重问题。


    然而，这种新货币必须满足货币的首要要求，即被广泛接受，而这一品质始终与信任紧密相连。


    以本货币进行国际贸易总是会引发信任问题。如果一个国家发行无限数量的货币来购买服务和有形货物或商品，出口国最终会意识到，它正在用“彩色的数字”换取实实在在的价值。


    美国将美元作为武器、对政治或经济对手进行制裁并没收其美元储备（而这些储备在银行中无非只是会计分录）的策略，已经让其他国家意识到，美元不是一种可靠的货币，因为它可以凭空产生且数量是无限的，而且还可以可以根据发行者的意愿被没收。


    著名的美国投资者雷·达利欧（Ray Dalio）在他畅誉的著作《应对新世界秩序的原则：国家如何成功与失败》中分析了这一点。我并不想破坏这本我推荐的巨著——即历史上不断重复的主导国家兴衰周期。


    这些历史周期呈现出某种相似性：由于达利欧在书中解释的各种原因，一个国家成功建立起霸权，这种霸权很快转移到其货币上，成为世界贸易标准和储备货币。


    正如查尔·德高乐（Charles de Gaulle）在他提到的演讲中所描述的，这一事实使霸权国家拥有了一种特权，使其能够免费债务，这通常会加强其霸权，尽管由于通过发行货币来为这些债务以及其军事实力，这不可避免地会导致通货膨胀告终。


    当前的地缘政治状况表明，美国的衰落已经开始。考虑到贫富之间巨大的社会鸿沟、已经无法偿还且不成比例的债务，美国进入了一个通过创造新货币来维持经济并支付此前债务利息的螺旋，而利息只能通过新货币来支付，这进一步推高了债务。


    我邀请读者访问这个链接：`US Debt Clock`（美国债务时钟）。


    `https://www.usdebtclock.org/world-debt-clock.html`


    在这个网站上，你可以实时看到世界上最重要的国家的债务，但让我们不要只看第一列公共债务，还要看后面的几列：国内生产总值（GDP）；债务占 GDP 比率；以及最后一列国际债权人债务占
    GDP 比率。


    美国：债务 31.5 万亿美元，GDP26 万亿美元，债务/GDP 比率：94%，外债占 GDP 比率：93%。


    列表中的后续国家显示出非常相似的数据，尽管外债占 GDP 比率在某些国家中要低得多，例如：中国为 17%，印度为 25%，而俄罗斯的债务/GDP 比率是世界最低，仅为
    19%，外债占 GDP 比率为 26%。


    请注意，这三个国家都是国际`金砖国家`（BRICS）组织的创始成员。


    我们从债务数据中观察到的现象不容任何疑义：基于不断发行货币的法币货币体系注定会崩溃。


    我们极有可能正在走向一个多极化的世界，这是目前`金砖国家`及其目前的候选国家所预测的，他们可能建立一种由黄金和商品做支撑的国际电子货币；而另一极（即西方国家加上韩国和日本）的货币体系正处于崩溃边缘，其基于无一物支撑的货币无限创造。


    这将导致系统性和全球性的经济和社会危机，这必然意味着霸权货币的货币重置，以及一个新的世界和货币秩序的建立。


    记住，世界上大多数国家的储备，尤其是那些以美元计值的储备，如果美元失去了作为储备货币的地位，对这种债务可以偿还的价值和信心将会丧失。达利欧在书中分析的货币周期跨越较长的时间，但我们也可以发现周期更短的经济周期，尽管它们发生的原因不同，但都有一个共同点，即基于不断发行货币的循环。


    我们极有可能正在走向一个多极化的世界，这是目前`金砖国家`及其目前的候选国家所预测的，他们可能建立一种由黄金和商品做支撑的国际电子货币；而另一极（即西方国家加上韩国和日本）的货币体系正处于崩溃边缘，其基于无一物支撑的货币无限创造。


    这将导致系统性和全球性的经济和社会危机，这必然意味着霸权货币的货币重置，以及一个新的世界和货币秩序的建立。


    记住，世界上大多数国家的储备，尤其是那些以美元计值的储备，如果美元失去了作为储备货币的地位，对这种债务可以偿还的价值和信心将会丧失。达利欧在书中分析的货币周期跨越较长的时间，但我们也可以发现周期更短的经济周期，尽管它们发生的原因不同，但都有一个共同点，即基于不断发行货币的循环。


    当央行通过扩大贷款和债务增加货币供应时，就会出现经济繁荣，这同时也产生了通胀。这一过程被称为量化宽松（Quantitative Easing）。


    当债务和通胀达到某些极限，或出于任何原因，央行通过提高利率从流通中收回货币，这一过程被称为量化紧缩（Quantitative Tightening），随之的是衰退。


    随后，作为对这种危机的所谓反应，央行再次通过降低利率扩大货币总量，货币扩张和债务收缩的周期再次循环。


    在危机期间保留流动性的人，或在货币扩张阶段能够轻松获得信贷的人（例如商业银行），通过以低价收购公司和资产迅速增加了财富。


    这一过程被称为`坎蒂隆效应`（Cantillon Effect），经济学家理查德·坎蒂隆（Richard Cantillion）解释了货币政策对经济产生的不平等影响。


    这种现象是指，央行发行货币会让先获得货币的人受益，而损害普通民众的利益，因为新创造的货币并非同步且均匀地分布在整个中。


    因此，货币扩张的过程涉及到财富的转移。


    有些人可能认为，央行的行为是为了应对经济繁荣与衰退周期。


    在本人以及许多分析师看来，恰恰相反：央行对经济政策的干预创造了经济的繁荣与衰退周期。


    这曾是央行存在的假设，为了应对周期性危机。


    如果我们分析历史，就会发现这个理由是虚假的。


    `CBDCs`（央银行数字货币）向公众推出是基于政府和央行的几个前提的，例如它们是我们目前使用的货币的新形式，它们不会取代实体货币，它们在兑换商品、服务以及纸币和实体货币时更加方便。


    在整书中，我试图对这些前提的真实性产生超出合理的怀疑。


    本人认为，法币体系基于发行无担保、无限制的货币来支付无限增长的债务，这将导致对这种债务可以偿还的价值和信心的失去，从而不可避免地导致货币重置。


    2023 年 3 月 9 日，美国的一家小银行银门银行（`Silver Gate Bank`）宣布破产。


    '
