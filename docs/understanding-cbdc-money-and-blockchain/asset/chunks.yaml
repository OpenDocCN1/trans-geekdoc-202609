- raw: 'This system has a peculiarity that is necessary to understand, as it is usually
    the mechanism that triggers most financial disasters. In a x10 leverage, the investor
    contributes 1 part and the entity providing the leverage contributes 10 times
    the investor''s initial capital, in exchange, of course, for a percentage of interest
    that the investor must pay.


    This capital is used to buy a financial asset, for example a number of shares;
    if the value of these shares rises, the investor can sell them with a profit of
    x10 times his capital and thus pay the interest on the temporary loan he used
    to buy the shares.


    The danger comes when the value of the shares falls, in this case the entity that
    lent the investor x10 the capital, which monitors the price of these shares, observes
    that the loss of value of the shares purchased on credit is approaching the real
    capital contributed by the investor, then warns, if there is time, the investor
    to add more capital to maintain his investment, this notice is called margin call,
    or call to maintain the margin of safety.


    If the investor is unwilling or unable to provide more capital, then the lender,
    before the loss affects the investor''s loan, executes the sale of the shares,
    which is called liquidation, with the investor losing all of his capital, and
    if the process has been carried out correctly, the lender will lose nothing.


    Sometimes the financial markets can fluctuate so rapidly that the company that
    lent the leveraged capital has literally no time to liquidate, or if it does liquidate,
    it suffers a loss.


    In April 2021, several large banks, and in particular the Swiss bank Credit Suisse,
    lost 4 billion as the entity that provided financing to the Archegos fund.


    This fund lost 10 billion in 48 hours. Not being able to provide more capital,
    the companies that financed the investment of Archegos Capital liquidated their
    assets of more than 30 billion, incurring terrible losses, since the sale of such
    an amount of shares accelerates the price decline.


    This type of cases is not frequent, usually the entities that provide the financing
    of leverage in the financial markets usually repay the borrowed capital before
    it is lost, the one who always loses all his capital is the leveraged investor
    whose leveraged asset is liquidated.


    Leverage is the norm in financial markets, and it generates huge profits in a
    bull market, but terrible losses in a bear market.


    A large leveraged financial operation that goes wrong can drag a credit institution
    into insolvency, which in turn affects other institutions, as the liquidations
    accelerate price declines in the stock market, which in turn affect other investors
    leveraged with that or other institutions, creating a downward spiral.


    **Liquidity.**


    The ease and or speed with which an asset can be bought or sold without significantly
    affecting its price.


    Generally, securities issued by the U.S. government are considered the most liquid
    assets in the economy, because there are always many buyers and sellers and sales
    and purchases can be very quick.


    At the other extreme are real estate with very little liquidity, because there
    may be few buyers interested in a given real estate property, and these sales
    and purchases require more time to be formalized.


    **Margin Call.**


    A request by a broker or dealer for an investor to contribute more capital to
    his or her margin account because the value of the assets held in the account
    has fallen below the minimum margin required by the exchange. Margin is the money
    an investor lends through his or her broker to invest in financial assets.


    If the investor fails to comply with the Margin Call request, the broker has the
    right to close out the investor''s positions to recover the borrowed money. Forced
    liquidation can result in large losses for the investor.


    **mBridge.**


    The Bank for International Settlements (BIS or central bank of central banks)
    mBridge project is an initiative to explore and assess the potential of blockchain
    technology and cryptocurrencies in financial markets.


    The mBridge project focuses specifically on the use of blockchain technology for
    the settlement of cross-border interbank transactions, which could offer significant
    advantages in terms of efficiency, speed and cost compared to traditional settlement
    methods.


    The mBridge project is being developed by the Technology Innovation Hub of the
    Bank for International Settlements.


    **Monetary Mass. M1, M2, M3.**


    Money supply is the total amount of money in circulation in an economy. It is
    commonly divided into three groups: M1, M2 and M3.


    M1: This is the most liquid money in circulation, i.e. cash, notes and coins in
    the hands of the public and bank demand deposits, or those that can be withdrawn
    at any time.


    M2: Includes everything that makes up M1, plus time deposits, money market mutual
    funds or other short-term funds.


    M3: Money supply M3 is the broadest measure of money supply because it includes
    everything in M2, plus long-term deposits and other financial instruments such
    as government bonds and corporate debt, but long-term.


    That is, assets that take much longer to be converted into cash, i.e., less liquid
    assets.


    M3 is useful for analyzing the long-term money supply and its impact on the overall
    economy.


    **Money.**


    Any medium of exchange generally accepted by a society for buying and selling
    goods and services.


    While it must have certain characteristics such as:


    Acceptability, Divisibility, Interchangeability, Unit of Account,


    Reserve of value, Scarcity, Portability, Durability, and Fungibility.


    **Mortgage.**


    A long-term loan used to purchase real estate, such as a house, apartment or land.
    The mortgage is used to finance the purchase of the property and is secured by
    the property itself. This means that the property is the collateral for the loan;
    if the borrower defaults on the agreed payments, the lender can take possession
    of the property to recover its investment.


    Each monthly payment includes a portion of the loan principal and interest due
    on the outstanding principal, which means that the interest portion of the monthly
    payment is higher at the beginning of the loan and decreases as the loan principal
    is amortized.


    Mortgages can be fixed rate or variable rate mortgages. In Europe, the 1-year
    Euribor is used as a reference.


    For variable rate mortgages, the lending bank will mark a spread over the Euribor.
    For example, 1% over the Euribor index and the rates are revised every 6 months
    according to this index. If the Euribor is at 4%, the interest rate of the mortgage
    will be 5%.


    It is very important to understand that the interest paid is always on the capital
    still to be paid, so the longer the duration, the more interest will be paid,
    even if the installments are a little lower.


    Here is an example to help you understand **in numbers** what the interest rates
    on a typical mortgage loan mean.


    Capital to be financed: 200.000 €.


    Term: 30 years.


    Fixed interest rate for the example: 5.5%.


    *Monthly payment: 1.135,58 €.*


    *Total amount paid at the end (30 years): 408.808,80 €.*


    In other words, for the example data, the mortgagor will have paid more than twice
    the capital he financed.


    **NASDAQ.**


    An acronym for National Association of Securities Dealers Automated Quotations,
    a U.S. electronic stock exchange where shares of technology and related companies
    are traded.


    The NASDAQ is divided into two main markets: the NASDAQ Composite and the NASDAQ-100.


    The NASDAQ Composite is a market index that includes all companies listed on the
    NASDAQ, while the NASDAQ-100 is a market index that includes the 100 largest and
    most actively traded companies on the NASDAQ.


    Founded in 1971, NASDAQ was the world''s first electronic stock exchange.


    **Offshore Financial Services.**'
  fmt: '

    This system has a peculiarity that is necessary to understand, as it is usually
    the mechanism that triggers most financial disasters. In a `x10` leverage, the
    investor contributes 1 part and the entity providing the leverage contributes
    10 times the investor''s initial capital, in exchange, of course, for a percentage
    of interest that the investor must pay.


    This capital is used to buy a financial asset, for example a number of shares;
    if the value of these shares rises, the investor can sell them with a profit of
    `x10` times his capital and thus pay the interest on the temporary loan he used
    to buy the shares.


    The danger comes when the value of the shares falls, in this case the entity that
    lent the investor `x10` the capital, which monitors the price of these shares,
    observes that the loss of value of the shares purchased on credit is approaching
    the real capital contributed by the investor, then warns, if there is time, the
    investor to add more capital to maintain his investment, this notice is called
    `margin call`, or call to maintain the margin of safety.


    If the investor is unwilling or unable to provide more capital, then the lender,
    before the loss affects the investor''s loan, executes the sale of the shares,
    which is called `liquidation`, with the investor losing all of his capital, and
    if the process has been carried out correctly, the lender will lose nothing.


    Sometimes the financial markets can fluctuate so rapidly that the company that
    lent the leveraged capital has literally no time to liquidate, or if it does liquidate,
    it suffers a loss.


    In April 2021, several large banks, and in particular the Swiss bank `Credit Suisse`,
    lost 4 billion as the entity that provided financing to the `Archegos` fund.


    This fund lost 10 billion in 48 hours. Not being able to provide more capital,
    the companies that financed the investment of `Archegos Capital` liquidated their
    assets of more than 30 billion, incurring terrible losses, since the sale of such
    an amount of shares accelerates the price decline.


    This type of cases is not frequent, usually the entities that provide the financing
    of leverage in the financial markets usually repay the borrowed capital before
    it is lost, the one who always loses all his capital is the leveraged investor
    whose leveraged asset is liquidated.


    Leverage is the norm in financial markets, and it generates huge profits in a
    bull market, but terrible losses in a bear market.


    A large leveraged financial operation that goes wrong can drag a credit institution
    into insolvency, which in turn affects other institutions, as the liquidations
    accelerate price declines in the stock market, which in turn affect other investors
    leveraged with that or other institutions, creating a downward spiral.


    ### Liquidity


    The ease and or speed with which an asset can be bought or sold without significantly
    affecting its price.


    Generally, securities issued by the U.S. government are considered the most liquid
    assets in the economy, because there are always many buyers and sellers and sales
    and purchases can be very quick.


    At the other extreme are real estate with very little liquidity, because there
    may be few buyers interested in a given real estate property, and these sales
    and purchases require more time to be formalized.


    ### Margin Call


    A request by a broker or dealer for an investor to contribute more capital to
    his or her margin account because the value of the assets held in the account
    has fallen below the minimum margin required by the exchange. Margin is the money
    an investor lends through his or her broker to invest in financial assets.


    If the investor fails to comply with the `Margin Call` request, the broker has
    the right to close out the investor''s positions to recover the borrowed money.
    Forced liquidation can result in large losses for the investor.


    ### mBridge


    The Bank for International Settlements (BIS or central bank of central banks)
    `mBridge` project is an initiative to explore and assess the potential of blockchain
    technology and cryptocurrencies in financial markets.


    The `mBridge` project focuses specifically on the use of blockchain technology
    for the settlement of cross-border interbank transactions, which could offer significant
    advantages in terms of efficiency, speed and cost compared to traditional settlement
    methods.


    The `mBridge` project is being developed by the Technology Innovation Hub of the
    Bank for International Settlements.


    ### Monetary Mass. M1, M2, M3


    Money supply is the total amount of money in circulation in an economy. It is
    commonly divided into three groups: `M1`, `M2` and `M3`.


    - **M1**: This is the most liquid money in circulation, i.e. cash, notes and coins
    in the hands of the public and bank demand deposits, or those that can be withdrawn
    at any time.

    - **M2**: Includes everything that makes up `M1`, plus time deposits, money market
    mutual funds or other short-term funds.

    - **M3**: Money supply `M3` is the broadest measure of money supply because it
    includes everything in `M2`, plus long-term deposits and other financial instruments
    such as government bonds and corporate debt, but long-term. That is, assets that
    take much longer to be converted into cash, i.e. less liquid assets. `M3` is useful
    for analyzing the long-term money supply and its impact on the overall economy.


    ### Money


    Any medium of exchange generally accepted by a society for buying and selling
    goods and services. While it must have certain characteristics such as: Acceptability,
    Divisibility, Interchangeability, Unit of Account, Reserve of value, Scarcity,
    Portability, Durability, and Fungibility.


    ### Mortgage


    A long-term loan used to purchase real estate, such as a house, apartment or land.
    The mortgage is used to finance the purchase of the property and is secured by
    the property itself. This means that the property is the collateral for the loan;
    if the borrower defaults on the agreed payments, the lender can take possession
    of the property to recover its investment.


    Each monthly payment includes a portion of the loan principal and interest due
    on the outstanding principal, which means that the interest portion of the monthly
    payment is higher at the beginning of the loan. Mortgages can be fixed rate or
    variable rate. In Europe, the 1-year `Euribor` is used as a reference. For variable
    rate mortgages, the lending bank will mark a spread over `Euribor`. For example,
    1% over `Euribor` and the rates are revised every 6 months according to this index.
    If `Euribor` is at 4%, the interest rate of the mortgage will be 5%.


    It is very important to understand that the interest paid is always on the capital
    still to be paid, so the longer the duration, the more interest will be paid,
    even if the installments are a little lower.


    Here is an example to help you understand in numbers what the interest rates on
    a typical mortgage loan mean:


    - Capital to be financed: 200,000 €

    - Term: 30 years

    - Fixed interest rate for the example: 5.5%

    - Monthly payment: `1,135.58 €`

    - Total amount paid at the end (30 years): `408,808.80 €`


    In other words, for the example data, the mortgagor will have paid more than twice
    the capital he financed.


    ### NASDAQ


    An acronym for National Association of Securities Dealers Automated Quotations,
    a U.S. electronic stock exchange where shares of technology and related companies
    are traded.


    The `NASDAQ` is divided into two main markets: the `NASDAQ Composite` and the
    `NASDAQ-100`.


    The `NASDAQ Composite` is a market index that includes all companies listed on
    the `NASDAQ`, while the `NASDAQ-100` is a market index that includes the 100 largest
    and most actively traded companies on the `NASDAQ`.


    ### Offshore Financial Services

