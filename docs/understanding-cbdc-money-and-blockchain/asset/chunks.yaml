- raw: 'It is likely that the power behind today''s banking institutions will not
    be a reliable long-term ally of political power in the process of implementing
    CBDCs.


    Also, banks are often seen as enemies of bitcoin as a possible future money, but
    this does not have to be the case. Banks make their business by providing credit
    and financial services to their customers, this model can and probably will be
    replaced by CBDC payment systems, but if bitcoin continues to gain acceptance,
    this could be a type of money that does not necessarily have to kill the banking
    business model.


    Many people will not want to take on the responsibility of self-custodianship
    or learn how to trade bitcoin; banks could provide credit and services to buy,
    sell, and store bitcoin as a back-up for savings that citizens refuse to hold
    in CBDCs, and protect them from the currency debasement accelerated by the introduction
    of CBDCs and the arbitrary decisions of their government.


    According to the Bank of England''s public document published in February 2023:


    The digital pound: A new form of money for households and businesses?


    Reference:


    [https://www.bankofengland.co.uk/paper/2023/the-digital-pound-consultation-paper](https://www.bankofengland.co.uk/paper/2023/the-digital-pound-consultation-paper)


    Contains licensed public domain information.


    Open Government License v3.0


    *“*The Digital Pound will be a public-private partnership or collaboration. Private
    sector companies, which could be banks or licensed non-bank companies, could be
    integrated into the core infrastructure of the Digital Pound and provide the interface
    between the bank and the users.


    They would do this by offering digital "portal" wallets to end users. The wallets
    could be integrated with their other services. They are called "transfer" wallets
    (hereafter simply "wallets") because the user''s digital pound holdings are recorded
    anonymously in the bank''s central ledger to "protect your privacy," and the wallet
    simply passes instructions from the user to the central ledger. End users would
    interact with these wallets rather than directly with the bank.


    Users would dispose of digital pounds by using their wallet to view their balance
    and to instruct payments and transfers of digital pounds. It is likely that most
    people would access the wallet through their smartphone, but there would be alternative
    options, such as a smart card.*”*


    As can be seen, the private sector and the necessary infrastructure for the Digital
    Pound platform will be provided at least in part by commercial banks and "approved"
    financial companies, as well as the wallet applications themselves and their maintenance.


    It cannot be ignored that all this will come at a cost, if we think that the digital
    pound, even with quantity limits, will reduce the capitalization of bank funds,
    as well as create competition in the payment systems business, CBDCs will not
    be well regarded by banks, unless they make some profit. One way or another, this
    cost will be borne by citizens.


    According to Bank of Spain, gross fees for payment services represent approximately
    **one third** of Spanish banks'' fee income in their Spanish business.


    Payment services account for 4,472 million euros in revenues for Spanish banks.
    31.2% of the total)


    Referencia: Bank of Spain.


    Financial Stability Report. Spring 2022. (bde.es)


    How will banks be able to handle the threat or competition from public electronic
    payments through CBDC?


    Undoubtedly, a massive implementation of CBDC will have to establish a new role
    of financial institutions with the political power that we will have to pay attention
    to in the future.


    In the same Bank of England document, without explicitly mentioning it, it is
    suggested that "to safeguard financial stability", at least initially, limits
    will be set on the amount of digital pounds that a user can store in his or her
    wallet.


    This is obviously intended to prevent savers from withdrawing their funds from
    banks to deposit them in digital pounds, which would create a very serious problem
    for banks.


    However, page #17 of the document adds:


    *“*Unlike cash, the amount of digital pounds that an individual or firm could
    hold would be subject to some limits, at least for an introductory period. This
    would ensure a smooth introduction without unintended consequences for monetary
    or financial stability.


    These restrictions would still allow individuals to use the digital pound for
    their daily transactions, including receiving their payments. It would be for
    a new decision, in the light of experience, as to whether **such restrictions
    should be made permanent.”**


    More references: [Coindesk.com](http://Coindesk.com) (Feb-07-2023)


    Digital Pound Holdings Could Be Limited to 10K, Central Bank Says ([coindesk.com](http://coindesk.com))


    The Bank of England has set out technical features of its central bank digital
    currency, which officials have said is likely to be needed.


    On page #16 it states:


    *“*The digital pound would be designed to support the Government''s and the Bank''s
    commitments to mitigating climate change.*”*


    In other words, it anticipates that there will be restrictions, though of course
    for "well-justified" reasons.


    The general characteristics of the digital pound announced in the Bank of England
    document would be as follows:


    1\. It will be a consortium or public-private partnership project.


    2\. The digital pound will be used by households and businesses.


    3\. The issuance of digital money and the platform will be operated by the central
    bank.


    4\. The digital pound will be perfectly interchangeable with other forms of money
    such as cash or bank deposits.


    5\. Wallet applications will be provided by the private sector.


    6\. It will be used through smart phones and cards.


    7\. It will have privacy protection like bank accounts and cards, but it will
    NOT be anonymous.


    8\. No interest will be paid.


    9\. The Bank of England and the Government will not see any personal information.


    10\. The amount of the deposit would be limited, at least initially.


    11\. It would be available to UK and non-UK residents.


    12\. It will be usable for everyday physical and online shopping.


    Even with a superficial analysis of the features announced by the Bank of England,
    we can find some highly suspicious contradictions.


    Let''s look at the contradictions or inconsistencies:


    Number 1: The issuance and the platform will be operated by the Bank of England,
    but it will be a consortium or public-private partnership (?), furthermore the
    wallets will be offered by the private sector (?).


    Number 2: It will have the same privacy as the bank cards and bank accounts, (which
    is equal to zero privacy); but it will NOT be anonymous, also the Bank of England
    and the government will not see any personal data (?).


    ## **CHAPTER 9.**


    ## **Likely Evolution and Implications for Geopolitics and the Global Economy.**


    On page #16 of the same Bank of England paper on the Digital Pound, it is written:


    "Although a digital pound would be designed with UK users in mind, it would also
    be available to non-UK residents."


    This detail is very important when considering how digital currencies or CBDCs
    will affect the global economy and geopolitics once they are widely adopted, because
    as mentioned at the beginning of the book, almost every central bank and government
    in the world is working on developing a digital currency.


    Currently, although the treaty of the European Union guarantees the free movement
    of people, goods, services, and capital across the Union, European citizens face
    many administrative barriers to opening a bank account in another EU country.


    The use of a bank account abroad, even within the European Union and for an EU
    citizen, is only possible through private banking services, which generally require
    a capital of between three hundred thousand and one million euros.'
