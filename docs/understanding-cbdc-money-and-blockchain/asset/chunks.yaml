    \nThis book is not financial advice of any kind, the sole purpose of this book\
    \ is to explain the most basic economic and monetary concepts, including the author's\
    \ subjective opinion on the economics, history and current affairs of the monetary\
    \ system.\n\nFor financial advice, you should consult a duly licensed professional\
    \ advisor.\n\n## **Prologue.**\n\nMotivated by my professional curiosity, I decided\
    \ to learn about the technical workings of bitcoin and its blockchain.\n\nTo understand\
    \ the technical basis, I had to understand the economic and monetary concepts\
    \ mentioned in the white paper that defines bitcoin, and then I discovered what\
    \ was for me a whole new world; the economic, financial, monetary and banking\
    \ systems, which usually go unnoticed by most ordinary citizens, entering a gray\
    \ area of unknowing, which is not accidental, and whose apparent complexity effectively\
    \ discourages almost everyone from learning about these much-needed subjects,\
    \ which, surprisingly, are not mandatory at all levels of education.\n\nSince\
    \ then, I have started a new hobby, learning what money is and how it works, finance,\
    \ banking, understanding the financial terminology that is skillfully used by\
    \ the disinformation media to keep the population ignorant about these issues,\
    \ and finally understanding the connection between financiers, governments and\
    \ politicians of all colors and in all countries of the world.\n\nOne of the challenges\
    \ of this book is to adapt the content it analyzes for people with different knowledge\
    \ bases.\n\nAn ordinary person who only receives information from the mass disinformation\
    \ media with a very basic knowledge, supported by topics that we have been told\
    \ since childhood, that we read in the press or see on television, might find\
    \ the exposition of this book quite dense, difficult or even too \"alternative\"\
    .\n\nHowever, a reader with a greater knowledge base, either by hobby or profession,\
    \ and who is familiar with economic and financial terminology, may find the book\
    \ too basic and, in its attempt to explain complex concepts in a simple way, perhaps\
    \ not entirely rigorous in explaining those concepts.\n\nThe author's main goal\
    \ is to provide the basic knowledge that every person should have about money,\
    \ CBDC, the monetary system, and the economy of the first group; although I hope\
    \ that many readers who are halfway between the two groups described will find\
    \ this text an incentive to continue learning.\n\nYou may find some statements\
    \ and concepts in this book so different from what we take for granted, so shocking,\
    \ and perhaps so counter-intuitive, that you may find it hard to believe that\
    \ they are true.\n\nI will try to provide references where necessary, but if you\
    \ find a subjective opinion of the author, I encourage you to delve into it and\
    \ find out for yourself how you can expand your knowledge in this subject.\n\n\
    The ultimate goal of this book is to stimulate your curiosity to understand not\
    \ only the new CBDC currencies, but also money, the workings of the monetary system,\
    \ finance and the economy that move our world, to know the real meaning of the\
    \ terms used, for which you can consult the glossary at the end of the book, and\
    \ above all, to encourage you to continue learning, to be able to educate our\
    \ children and our family on these subjects, since they are deliberately omitted\
    \ in education plans.\n\nDelving into the discovery of this world of finance and\
    \ economics has been a healthy shock that has changed the way I see the world.\n\
    \nI hope you will enjoy discovering what is usually hidden or disguised with a\
    \ language of euphemisms and technical terms for the initiated only, whose purpose\
    \ is usually to mask the real meaning\n\n.\n\n## **CHAPTER 2.**\n\n## **Introduction\
    \ to CBDCs.**\n\n## **What they are and why they are being developed.**\n\nIf\
    \ you have started reading this book, you have probably already heard or read\
    \ something about the new digital currencies being prepared by virtually all the\
    \ Central Banks in the world, some already in the testing phase, and others, such\
    \ as in China, Tonga, and Nigeria, already in service at the time of writing this\
    \ book; January 2023.\n\nThese new digital currencies are created in the image\
    \ and likeness of cryptocurrencies, but issued and backed by a Central Bank, with\
    \ *“*stable, secure, and legal tender\" value.\n\nCBDC is the acronym for Central\
    \ Bank Digital Currency.\n\nThe terms money and currency are different. Money\
    \ is the physical unit and currency refers to the monetary unit of each country.\
    \ For example, a currency exchange is a sale of, let's say, euros for the local\
    \ currency of the country we're visiting. Operations that do not involve the physical\
    \ movement of money, such as bank transfers or cheques, are called currency exchanges.\n\
    \nCBDCs are essentially currencies because they will be a digital version of the\
    \ same money we use today, but instead of being managed by a payment service of\
    \ a bank or card issuer, they will be managed directly by the central bank or\
    \ by private companies contracted and duly authorized to manage the infrastructure\
    \ necessary for their operation.\n\nTherefore, considering their use, we could\
    \ say that CBDCs are a means of payment.\n\nAs mentioned at the beginning of this\
    \ chapter, CBDCs will be created in the image and likeness of cryptocurrencies,\
    \ from an application on our phone, tablet or computer, commonly called a wallet,\
    \ we can pay with our mobile devices, as we can already do today, by placing our\
    \ smartphone to an NFC reader in the box of a trade, or through a QR code generated\
    \ by the seller's terminal that scans our phone to accept payment from the screen\
    \ of our phone.\n\nBeyond the electronic nature and the analogy of using an application\
    \ from our mobile phone with NFC or reading a QR code to authorize a payment,\
    \ everything similar to cryptocurrencies ends here, because we must make it clear\
    \ that, regarding the essential properties of a cryptocurrency like bitcoin, which\
    \ are; decentralization, limited or finite issuance and permissionless system,\
    \ CBDCs or Central Bank Digital Currencies are basically the opposite, the absolute\
    \ antithesis of a cryptocurrency like bitcoin."
