    * [12. Glossary](#15_12__Glossary.html#page_157)


    ## LEGAL NOTICE


    This book is not financial advice of any kind, the sole purpose of this book is
    to explain the most basic economic and monetary concepts, including the author''s
    subjective opinion on the economics, history and current affairs of the monetary
    system.


    For financial advice, you should consult a duly licensed professional advisor.


    ## Prologue


    Motivated by my professional curiosity, I decided to learn about the technical
    workings of `bitcoin` and its `blockchain`.


    To understand the technical basis, I had to understand the economic and monetary
    concepts mentioned in the white paper that defines `bitcoin`, and then I discovered
    what was for me a whole new world; the economic, financial, monetary and banking
    systems, which usually go unnoticed by most ordinary citizens, entering a gray
    area of unknowing, which is not accidental, and whose apparent complexity effectively
    discourages almost everyone from learning about these much-needed subjects, which,
    surprisingly, are not mandatory at all levels of education.


    Since then, we have started to see the `CBDC` as a new phenomenon. The goal of
    this book is to provide a clear overview of what these digital currencies are,
    how they work, and the impact they will have on the monetary system.


    ## CHAPTER 2


    ## Introduction to CBDCs


    ### What they are and why they are being developed


    If you have started reading this book, you have probably already heard or read
    something about the new digital currencies being prepared by virtually all the
    Central Banks in the world, some already in the testing phase, and others, such
    as in China, Tonga, and Nigeria, already in service at the time of writing this
    book; January 2023.


    These new digital currencies are created in the image and likeness of cryptocurrencies,
    but issued and backed by a Central Bank, with stable, secure, and legal tender
    value.


    `CBDC` is the acronym for Central Bank Digital Currency.


    The terms `money` and `currency` are different. `money` is the physical unit and
    `currency` refers to the monetary unit of each country. For example, a currency
    exchange is a sale of, let''s say, euros for the local currency of the country
    we''re visiting. Operations that do not involve the physical movement of money,
    such as bank transfers or cheques, are called currency exchanges.


    `CBDCs` are essentially currencies because they will be a digital version of the
    same money we use today, but instead of being managed by a payment service of
    a bank or card issuer, they will be managed directly by the central bank or by
    private companies contracted and duly authorized to manage the infrastructure
    necessary for their operation.

    '
  trans: '


    ![cover](img/cover.jpg)


    对自印刷术发明以来最大革命的批判性分析，亦是一个将改变我们所知世界的反乌托邦。


    它们是什么、如何运作、其对社会和经济的影响，以及它们将如何永远地改变我们所认知的货币体系。


    献给我的妻子 Silvia 和儿子 Xabier。


    2023 年 5 月。


    ## 目录


    * 1. 法律声明与序言

    * 2. CBDC 简介：它们是什么以及为何要开发它们

    * 3. 理解货币：货币体系的历史与演变

    * 4. 与比特币等加密货币的区别

    * 5. 底层技术与区块链的愿景

    * 6. 与现有系统的用例对比：数字身份

    * 7. 安全与经济方面的潜在现实收益

    * 8. 挑战与担忧：对银行现有角色的冲击

    * 9. 可能的演变以及对地缘政治和全球经济的影响

    * 10. 现实应用：控制与监控。对自由的限制

    * 11. 更多货币故事——替代方案

    * 12. 词汇表


    ## 法律声明


    本书不构成任何形式的财务建议，其唯一目的是解释最基础的经济和货币概念，包括作者对货币体系的经济、历史和当前事态的主观观点。


    如需财务建议，您应该咨询获得许可的专业顾问。


    ## 序言


    在职业好奇心的驱动下，我决定学习 `bitcoin` 及其 `blockchain` 的技术原理。


    为了理解其技术基础，我必须理解定义 `bitcoin` 的白皮书中提到的经济和货币概念，随后我发现了一个对我来说完全全新的世界：经济、金融、货币和银行体系。这些系统通常被大多数普通公民所忽略，进入了一个未知的“灰色地带”。这并非偶然，其表象上的复杂性实际上有效地阻碍了几乎所有人学习这些迫需的科目，而令人惊讶的是，这些科目在所有教育阶段完全并不是强制性的。


    从那时起，我们开始将 `CBDC` 视为一种新现象。本书的目的是为了概述这些数字货币是什么、它们如何运作，以及它们将对货币体系产生什么影响。


    ## 第二章


    ## CBDC 简介


    ### 它们是什么以及为何要开发它们


    如果你开始阅读这本书，可能已经听过或读过有关几乎所有央行都在准备的新数字货币的消息。有些已经处于测试阶段，而另一些（如中国、汤加和尼日利亚）在本书写作时已投入使用；2023
    年 1 月。


    这些新的数字货币是以模仿加密货币的形式创建的，但由中央银行发行并提供支持，具有稳定、安全且法币的价值。


    `CBDC` 是中央银行数字货币的缩写。


    `money` 和 `currency` 这两个词是不同的。`money` 是物理单位，而 `currency` 指每个国家的货币单位。例如，货币兑换是将欧元兑换成我们所访问国家的当地货币。不涉及资金物理移动的操作（如银行转账或支票）被称为货币兑换。


    `CBDCs` 本质上是货币，因为它们将是我们今天使用的货币的数字版本，但它们不再由银行或卡片发行方的支付服务管理，而是由央行直接管理，或由签约并获得授权管理其运行所需基础设施的私营公司管理。


    '
