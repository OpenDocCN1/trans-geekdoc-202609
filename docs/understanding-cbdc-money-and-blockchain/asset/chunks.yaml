  trans: '


    当今银行机构背后的力量，在实施央行数字货币（CBDC）的过程中，可能不会政治权力的可靠长期盟。


    此外，银行通常被视为作为未来货币的比特币的敌人，但情况并不一定如此。银行通过向客户提供信贷和金融服务来营运业务，这种模式可以且可能会被 CBDC 支付系统取代，但如果比特币继续获得认可，它可能成为一种不一定非要终结银行业务模式的货币。


    许多人不愿承担自托管的责任，或不愿学习如何交易比特币；银行可以提供信贷业务务，用于购买、出售和存储比特币，作为公民拒绝在 CBDC 中持有资金的储蓄的备选方案，并保护他们免受因
    CBDC 推出和政府武断决策而加速的货币贬值影响。


    根据英格兰银行于 2023 年 2 月发布的公共文件：


    ### 数字英镑：家庭和企业的新型货币形式？


    参考：

    [`www.bankofengland.co.uk/paper/2023/the-digital-pound-consultation-paper`](https://www.bankofengland.co.uk/paper/2023/the-digital-pound-consultation-paper)

    包含授权的公共领域信息。

    开放政府许可协议 v3.0


    “数字英镑将是一项公私合作伙伴关系或协作。私营部门公司（可能是银行或获得许可的非银行公司）可以整合到数字英镑的核心设施中，并在银行与用户之间提供接口。


    他们通过向终端用户提供数字“门户”钱包来实现这一点。这些钱包可以与其它的服务相结合。它们被称为“转账”钱包（下文简称为“钱包”），因为用户的数字英镑持有量将匿名记录在银行的中央账本中，以“保护您的隐私”，而钱包仅将来自用户的指令传递给中央账本。终端用户将与这些钱包交互，而不是直接与银行交互。


    用户将通过使用钱包查看余额，并指示数字英镑的支付和转账来处置数字英镑。大多数人可能会通过其智能手机访问钱包，但也会有替代方案，例如智能卡。”


    可见，私营部门和数字英镑平台所需的设施将至少部分由商业银行和“批准的”金融公司提供，以及钱包应用程序本身及其维护。


    不可忽视的是，这一切将付出代价。如果我们认为数字英镑（即使有数量限制）将减少银行资金的资本化，并在支付系统业务中产生竞争，那么 CBDC 将不会受到银行的青睐，除非它们能获得某种利润。无论如何，这种成本都将由公民承担。


    根据西班牙银行的数据，支付服务的总费用约占西班牙银行在西班牙业务中手续费收入的三分之一。支付服务为西班牙银行带来了 44.72 亿欧元的收入（占总额的 31.2%）。


    参考：西班牙银行。

    《金融稳定报告》。2022 年春季。（bde.es）


    ### 银行将如何应对来自通过 CBDC 的公共电子支付的威胁或竞争？


    无疑，CBDC 的大规模实施必须在金融机构与政治权力之间建立一种新的角色，这是我们未来必须关注的。


    在英格兰银行的同一份文档中，虽然没有明确提到，但暗示“为了维护金融稳定”，在实施初期应对数字英镑的持有量进行限制。


    正如这些，私营部门和数字英镑平台所需的设施将至少部分由商业银行和“批准的”金融公司提供，以及钱包应用程序及其维护。


    不可忽视的是，这一切将付出代价。如果我们认为数字英镑（即使有数量限制）将减少银行资金的资本化，并在支付系统业务中产生竞争，那么 CBDC 将不会受到银行的青睐，除非它们能获得某种利润。无论如何，这种成本都将由公民承担。


    根据西班牙银行的数据，支付服务的总费用约占西班牙银行在西班牙业务中手续费收入的三分之一。支付服务为西班牙银行带来了 44.72 亿欧元的收入（占总额的 31.2%）。


    无疑，CBDC 的大规模实施必须在金融机构与政治权力之间建立一种新的角色，这是我们未来必须关注的。


