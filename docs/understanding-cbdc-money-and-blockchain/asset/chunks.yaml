- raw: 'A validator node is a team in the network that provides the first layer of
    checks to determine if a transaction is valid; they will verify on the blockchain
    that the bitcoin or fractions sent are indeed owned by the wallet sending the
    transaction, as well as the validity of the signature chain that is also included
    in the message, which allows the nodes to mathematically verify, thanks to cryptography,
    all the history of the previous owners of that bitcoin or fractions since it was
    created or mined.


    Valid transactions are added to a memory pool called "MemPool", a queue of transactions
    that have already been validated but have not yet been assigned a block. Over
    a period of about 10 minutes, the miners take from this queue of transactions
    those that have a higher fee associated with their processing, as an auction,
    and add them to a block.


    The miners compete to find an unknown hash\*, called a nonce, which, when combined
    with the transaction data, gives them the right to close the block.


    The winning miner, who finds the hash\* that meets a difficulty requirement through
    raw computational power, closes his block and retrieves the previously selected
    transactions from the mempool queue and adds them along with the nonce hash to
    the blockchain.


    Once closed, the block is sent to all nodes, both miners and validator nodes,
    which verify that the block was legitimately closed by the mining node that first
    found the nonce hash, and cryptographically verify the new hash of the block.


    This verification is extremely simple, and it suffices to verify the hash of the
    last block added to ensure the integrity of all previous blocks with mathematical
    certainty.


    Therefore, all nodes can verify that their local copy of the blockchain is identical
    to everyone else''s.


    Miners can also act as nodes because they have a complete copy of the entire blockchain.
    However, nodes cannot act as miners.


    If a validator or miner node detects a fraudulent transaction, it will mark it
    as such and it will not be added to any block.


    It could happen that a node, also fraudulent, accepts a false transaction, in
    this case the Bitcoin protocol establishes a majority consensus, so in order to
    add a block with a fraudulent transaction to the blockchain, it should be accepted
    by at least 51% of the nodes, since we are talking about 300,000 nodes spread
    all over the world, plus between 7,000 and 10,000 mining nodes, this possibility
    is completely excluded.


    In addition, fraudulent blocks, or blocks generated by malicious nodes, are also
    marked so that the other nodes stop processing and accepting their blocks.


    For your information, you can freely download and install a validator node with
    a fairly normal home computer, but with good storage capacity.


    This is what creates the vast network of nodes that provide security for Bitcoin.


    Explaining how to close and link the blocks that make up the bitcoin blockchain.


    This part may be more technical, but is only necessary if you want to go deeper
    into the underlying technology, otherwise you can skip to page 71.


    Bitcoin uses the SHA-256 algorithm, a one-way cryptographic fingerprint or "hash"
    algorithm created by the NSA (US National Security Agency) in 2001.


    Basically, the algorithm generates a key, or fingerprint, as an alphanumeric block
    (consisting of letters and numbers) unique to 64 characters, from an input text;
    any change in the input text will generate a fingerprint of the same length but
    completely different, even changing or adding a space in the input text will generate
    a completely different fingerprint.


    However, if you repeat the process with the same text, you will always get the
    same hash or fingerprint.


    The hash of a previous block that has already been closed is included with the
    transactions that make up the next block.


    Therefore, if any data in a block is changed, it will generate a different block
    hash, and from that moment on, all subsequent blocks created will have different
    hashes from the hash of the majority of nodes.


    The mining and validation nodes, by simply verifying that the hash of the last
    block added is valid, can know with complete mathematical certainty that all previous
    blocks in the blockchain are original, validated and verified, guaranteeing the
    immutability of the data added.


    This is the mechanism that guarantees the absolute integrity of the blocks added
    to the blockchain in each copy distributed among the nodes.


    This point is crucial in a blockchain database, the absolute mathematical certainty
    that all nodes in the network store an identical copy.


    The hash function of the algorithm is also used to generate the private key and
    public key used in bitcoin to encrypt or verify a message or transaction. This
    pair is also known as a private key and public key, or asymmetric cryptography.


    We can verify with full mathematical certainty that a message, such as a transaction,
    was signed by the owner of a private key or private key, knowing only his or her
    transmitted public key.


    Reference: SHA-256 Explained.


    [https://blog.passwork.pro/how-sha256-works/](https://blog.passwork.pro/how-sha256-works/)


    Reference: SHA-256 Hash tool function


    [https://emn178.github.io/online-tools/sha256.html](https://emn178.github.io/online-tools/sha256.html)


    Once the size limit of approximately 1 megabyte per block is reached, in which
    all received and validated transactions of the last 10 minutes are recorded, the
    mining nodes close the block, and to do so, in competition mode, they try to solve
    a mathematical puzzle that meets a difficulty requirement that requires extraordinary
    computing power.


    The first Mining Node that finds a solution that meets the established difficulty
    closes the block, and this is where the magic happens, the digital signature or
    hash of all the contents of the block already closed and validated is included
    in the next block, in this way all the blocks are linked together, guaranteeing
    each one the integrity of all the previous ones, any modification of a closed
    block and previously added to the blockchain would generate a different hash in
    all the subsequent blocks, which would be easily identifiable by the Mining Nodes
    and Validators.


    The difficulty of the proof of work, which allows a block to be closed and added
    to the blockchain, is to find a random hash called a "nonce" that, together with
    the text of the block containing the transactions of the last 10 minutes, must
    find a hash that starts with a given number of zeros.


    If at any given time there are many miners with high computing power, they will
    find this hash in less than 10 minutes, so the Bitcoin protocol increases the
    difficulty by increasing the number of required zeros with which the block-closing
    hashes must start.


    On the contrary, if the computing power or the number of miners decreases, we
    are talking about hundreds of thousands of specialized computers, and the blocks
    take more than 10 minutes to close, the protocol will dynamically decrease the
    difficulty, until an average speed of 1 new block per 10 minutes is achieved.


    There are many different blockchains, including commercial versions from large
    manufacturers, but they cannot guarantee the same level of security as the bitcoin
    blockchain due to the simple fact that the bitcoin network has a gigantic number
    of nodes.


    The expected characteristics of each blockchain can be very different depending
    on the utility sought; to assess the performance offered by a blockchain, we must
    look at whether it fulfills its function of storing information with absolute
    security, in a decentralized way, i.e. without a central validation authority,
    and in a distributed way, i.e. with an integrated copy of the data in multiple
    locations.


    Many other cryptocurrencies and various IT solutions implemented with a blockchain
    do not necessarily achieve their objective; blockchain databases are appropriate
    if we want security, decentralization, distribution and immutability.'
