  trans: "\n\n这意味着，我西班牙 CBDC 应用或钱包中的西班牙欧元，可能无法在其他预算赤字或公共债务较低的欧洲国家（如德国或荷兰）自由使用，反之亦然，除非施加某种纠正税；也就是说，西班牙数字欧元的价值并不一定等同于德国数字欧元的价值，这在事实上摧毁了货币联盟。\n\
    \n一旦欧盟成员国之一发生国家破产（这种风险不仅可能，而且极有可能发生），欧盟和负责的国家政府都可以轻易、有效且立即地没收我们钱包中的储蓄，以便在国家层面进行“`bail-in`”（自救）或内部救援。\n\
    \n这种情况已经早到了预见，例如在西班牙的《国家安全法》中。这是政府用来合法执行其他法律未允许的任何行动的术语，因为一旦引用“国家安全”，所有其他法律准则、权利和自由都可能被侵犯。\n\
    \n对公民实施绝对控制的技术可能性是如此巨大，以至于它们应该让我们思考，应该顺从接受还是抵制 CBDC 数字货币。\n\n显然，这种控制不会立即实施，而是将等待现金在实践中彻底消失，或者当现金被定为仅供罪分子使用而被取缔之时。\n\
    \n这种情况在国际银行混乱或货币重置时可能会迫发，届时 CBDC 将将得到实施。\n\n在这种情况下，政府的控制将是绝对的。\n\n参考：银行危机加速了美国\
    \ `FedNow` 和数字美元的推出。\n\n《银行危机可能加速美国 CBDC 发展 - Dales 报告》\n\n联邦储备银行宣布将于 2023 年 7\
    \ 月前推出 `FedNow`，这是一个 24/7 的即时支付系统。\n\n针对现金的政治战争已经全面展开，特别是在西班牙等欧洲国家，在这些国家，用现金买卖超过一千欧元的物品是违法的。\n\
    \n* 2021 年 7 月 10 日的《国家公报》发布了 2021 年 7 月 9 日的`第 11/2021 法》，关于预防和打击税收欺诈的措施。\n\n\
    同样，出入境等于或大于 10,000 欧元的现金金额必须申报。如果金额超过 100,000 欧元，即使在西班牙境内的现金流动也是强制申报的。\n\n超过 10,000\
    \ 欧元的银行转账也必须申报。此限制也适用于 ATM 取款。\n\n为了申报这些传输，需要向税务局提交表格，并提供转账人和收款人的证明文件。还需要“澄清”转账的“目的”。\n\
    \n参考：\n\n税务局：支付方式（`agenciatributaria.gob.es`）\n\n我们应该问问自己，如果我的钱是我的，为什么我不能再用法定货币支付任何超过一千欧元的物品？如果我的钱是我的，为什么我必须向政府申报并解释我对钱在做什么？\n\
    \n幸运的是，已经有公民和国家意识到了危险：\n\n日内瓦，2023 年 2 月 6 日。瑞士人将在公投中决定是否应法律规定经济永远不会完全虚拟化，且现金始终可以使用。\n\
    \n参考：\n\n瑞士将对保持现金流通的倡议投票 - `SWI swissinfo.ch`\n\n瑞士的“现金倡议”——涉及哪些问题？ - `SWI [swissinfo.ch](http://swissinfo.ch)`\n\
    \n禁止实施 CBDC 的立法已在美国多个州颁布。\n\n北卡罗来纳州议会一致通过了 `HB690`：禁止 #CBDC 支付并禁止北卡罗来纳参与任何 CBDC\
    \ 测试。\n\n该立法的最新版本包括限制联邦储备银行将该州作为其自身 CBDC 试点潜在测试场。\n\n北卡罗来纳州议会通过了禁止向州政府支付 CBDC\
    \ 的法案（[cointelegraph.com](http://cointelegraph.com)）。\n\n佛罗里达州立法机构通过了由迪桑斯州长支持的数字货币禁令。\n\
    \n众院以 116 比 1 的投票通过了 `SB 7054`。\n\n“通过这项法案，我们旨在保护佛罗里达人的隐私。”\n\n立法机构通过了由迪桑斯州长支持的中央银行数字货币禁令——得到了民主党的支持（[floridapolitics.com](http://floridapolitics.com)）。\n\
    \n如前所述，实施 CBDC 不需要禁止现金，至少在最初几年是如此；它们在取代私人支付手段方面的便利性和易用性将导致实体货币不再用于日常生活中。\n\n同样，如果几个州在当代政客的推动下通过了反对实施\
    \ CBDC 的法律，这可能并没有效；相应议会的选举发生更替就足以撤销这些法律。\n\n但至少，对引入 CBDC 已经有了公众和政治反应。\n\n# 第 11\
    \ 章。\n\n# 更多金钱故事。\n\n意识到引入 CBDC 货币引发的合理担忧以及现金的必然消失，我们应该问自己以下问题：\n\n### 我们可以避免引入数字货币吗？\n\
    \n对这个问题的简短答案是：否。\n\n财务、经济和社会控制的可能性是如此，政治权力几乎无法不抓住它们。\n\n### 我们可以推迟 CBDC 的引入吗？\n\
    \n我恐怕不能，正如我们之前所指出的，世界上 90% 的中央银行正在快速实施中央银行货币。\n\n最可能的时间线是：首先在 2023 年下半年进行公开测试，2024\
    \ 年进行初步部署，2025 年进行大规模实施。\n\n### 现到 2023 年，已有少数国家流通了 CBDC 数字货币，其中最重要的尼日利亚的奈日拉和中国的数字。\n\
    \n在尼日利亚，其 CBDC 的实施可以被描述为令人失望。这个非洲人口最多的国家尽管政治权力“并不透明”，但经历了快速的社会经济发展。奈日拉的使用率仅为 0.5%，这是由于尼日利亚公民对政府完全不信任。\n\
    \n拉各斯资本的董事 Adesoji Solanke 告诉媒体，“奈日拉没有解决任何这些基本用例，因此目前采用率低并不意外，”\n\n尼日利亚金融科技协会首席官\
    \ Babatunde Obrimah 认为，“他们认为监管机构是敌意的，因此对其引入的任何东西都没有兴趣，”\n\n参考：奈日拉击败私人加密货币采用了吗？（[beincrypto.com](http://beincrypto.com））\n\
    \n阿比贾，尼日利亚（美联社）——周二尼日利亚南部抗议者与安全人员之间发生新的冲突，导致至少一人受伤，这是由于这个西非国家推动快速淘汰旧纸币导致的现金短缺抗议。\n\
    \n参考：尼日利亚货币切换在睫，现金短缺引发抗议 | 美联社\n\n“由于银行政策导致现金短缺，暴徒在尼日利亚的三个城市袭击了银行 ATM 并封锁了道路，愤怒宣泄到街头”\n\
    \n参考：尼日利亚城市因现金短缺爆发暴乱 | 尼日利亚 | 卫报\n\n巧合的是，尼日利亚是比特币最广为人知和使用的国家之一，用于规避监管问题以及银行及其实物货币的低效。\n\
    \n 2022 年初，约 35% 的尼日利亚人使用或拥有比特币。在 ATM 现金减少措施生效后，尼日利亚政府预计其国家数字货币或 CBDC——奈日拉将获得更多关注，这是一个比特币关注者正在增加的国家。\n\
    \n"
