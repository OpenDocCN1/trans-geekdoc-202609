  trans: '


    这项技术的用处由这三个因素决定，其用处在于数据可靠、安全且不可篡改的注册。


    对于 `Bitcoin` 区块链，我们可以说即使发生大规模互联网停机、灾难性事件或节点数量减少，`Bitcoin` 的响应和完整性也能得到保障。


    `Bitcoin` 网络的健性和计算能力目前是全球最大的，比任何其他专用计算机网络高出几个数量级，包括所有大型科技公司、研究实验室或国家所拥有的超级计算机。


    以下是区块链数据库的一些最合适的应用：


    *   云存储访问的数字身份与安全保障。

    *   数据注册与验证。

    *   土地登记、民事登记、商业登记。

    *   智能合约注册、公共机构的透明化。

    *   供应链、自动化安全、投票系统。


    `bitcoin` 区块链的一个伟大特性是它是非许可且公开访问的，这意味着任何人都可以访问、查看并分析所有交易以及所有 `bitcoin` 地址的内容。


    请记住，包含输入和输出的地址与任何名称或个人身份无关，因此我们说 `bitcoin` 是伪匿名的而非匿名，而且所有的 `bitcoins` 都是可追踪的。


    所有交易都可以使用称为区块链浏览器的应用程序进行追踪。


    一个基于 `CBDC` 但构建在区块链上的经济系统，不仅在技术上可行，而且极易于实现公共账户的绝对透明。


    只要使用像 `bitcoin` 这样公开访问的区块链，国家和政府机构只需在其使用的区块链上发布其地址，任何公民就可以审计每一分公款。


    如果国家自自剥夺了控制我们钱包中所有交易的权力，我们公民是否应该要求一种公开访问的区块链 `CBDC`？


    在作者看来，这个答案是乌托邦式的，但正如我们现在所知，它是完全可能的，因此是可以实现的。


    # 第 6 章


    ## 与当前系统相比的用例。


    ## 数字身份。


    互联网上的卡片支付具有潜在的灾难性特征。当你在互联网上使用它们时，每次交易都会发送你所有的卡片信息，包括安全密钥。


    通过 `bitcoin`，用户发送一个数字签名，该签名保证只有发送 `bitcoin` 的所有者才能生成该签名，仅提供公钥和哈希值或数字签名，使得通过公钥完全无法找到私钥，因此被称为非对称加密。


    使用私钥，每笔交易都会生成不同的签名，因为即使发送和接收地址、或者发送的 `bitcoin` 或其部分的金额和之前的签名链相匹配，时间戳也总是不同的。


    在电子商务中使用传统的信用卡和借记卡一直是有风险的。使用一种在上世纪 50 年代兴起且初衷并非为了此类类用途的技术，仍然是一个坏主意；即使采取了额外的措施，它仍会导致许多欺诈行为，尽管这些欺诈有时由银行或发行公司承担，但它们无疑以某种或其他方式将这些成本包含在了其服务的价格中。


    ### 参考文献


    信用卡是何时发明的：信用卡历史 – Forbes Advisor


    信用卡起源于 1914 年，当时西联公司（Western Union Company）创建了一种为其最精选客户提供福利的卡片。它允许他们享受优惠待遇和免费的信用额度。


    1958 年，美国银行（Bank of America）引入了第一张银行卡。


    1958 年，美国银行（Bank of America）引入了第一张银行卡。


    1958 年，美国银行（Bank of America）引入了第一张银行卡。


    1967 年，美国国家公司（American National）创建了第一个。


    这是一个主要由非营利组织 `Sovrin Foundation` 管理的开源项目，并由 `Evernym` 公司提供支持。


    `Sovrin` 是一个去中心化的数字身份系统。该平台基于使用 `Hyperledger` 技术的混合区块链。因此，它的使用是公开的，但通过管理权限限制了访问。


    `uPort` 是一个基于 `Ethereum` 网络提供去中心化数字身份系统的项目。它是 `ConsenSys` 运行的最古项目之一。

    '
