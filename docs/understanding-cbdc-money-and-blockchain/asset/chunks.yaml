- raw: 'Switzerland would be very interested in offering its digital Swiss franc to
    anyone who can buy it.


    If a citizen of Spain, Italy or Greece sees the value of the Euro falling rapidly,
    or distrusts the solvency of his country or government, he will probably want
    to keep some of his savings in Digital Swiss Francs.


    Of course, there is also the possibility that local businesses in Spain or Italy
    will start accepting Digital Swiss Francs instead of Euros.


    Will local political power be able to stop the use of foreign digital currencies?


    We can extrapolate this possible digital currency war to the whole world, it is
    not hard to imagine a currency war in Africa where the Chinese Yuan becomes the
    dominant currency, or on the Latin American front a war between the Digital Dollar
    and the Digital Yuan.


    Another effect that has yet to be measured is the impact that the use of digital
    money will have on payment service providers, all of which are of American origin
    and in use in the West, and which will be practically unnecessary unless they
    adapt to the new circumstances by offering new services.


    It is very likely that there will be exchange services between digital currencies
    CBDC or between Bitcoin and CBDC.


    I am sure that just as today there are already multi-currency and multi-cryptocurrency
    wallets, cards, and applications from fintech companies\*, these will allow us
    to keep our money in different CBDCs or cryptocurrencies, automatically exchanging
    between them at our convenience, or recharging prepaid smart cards from any of
    these CBDCs or cryptocurrencies.


    While there is a fee associated with each of these exchanges, consider that an
    Argentine citizen will gladly pay a 3% fee to avoid a 50% loss in value of the
    Argentine Peso, with an annual inflation rate of 100%.


    There are a variety of circumstances that could turn out to be terrible with the
    introduction of CBDC currencies.


    Let''s imagine that the United States restricts the use of digital dollars to
    U.S. citizens only, and stops issuing or removes physical money from circulation.


    Millions of people, especially in emerging markets and Latin America, hold their
    savings and use dollar bills on a daily basis; all of them could find from one
    day to the next that their bills are no longer accepted, or simply that the issuer
    of digital dollars will not allow them to purchase the new CBDC dollars if they
    do not have US citizenship or a bank account denominated in dollars, which is
    quite likely to be the case.


    If all the dollars in circulation around the world were returned to the United
    States, it would cause hyperinflation that could ruin its economy; the transition
    to digital could be used to eliminate this risk, with terrible consequences for
    holders of physical dollars in emerging markets.


    From a geopolitical point of view, the potential destruction of weak national
    currencies could, in turn, bring about the downfall of the governments of many
    countries that are supported only by the imposition of a local currency.


    Of course, zones of monetary influence will be created according to the CBDC prevailing
    in each region of the world. However, there is already a mechanism by which poor
    or underdeveloped countries could have a CBDC currency.


    The mBridge\* project is a Chinese-led initiative to create an international payment
    platform based on central bank digital currencies (CBDCs).


    The project involves the central banks of China, Hong Kong, Thailand and the United
    Arab Emirates, as well as the BIS\* or Bank for International Settlements.


    The aim of the project is to facilitate cross-border transactions between the
    participating economies and to improve the efficiency and security of payment
    systems. The mBridge project is seen as an important step towards the internationalization
    of the digital yuan and a possible alternative to the US dollar as the world''s
    reserve currency.


    This project would allow countries with little infrastructure to issue a "customized"
    CBDC that would function in this way:


    A poorly developed country, but with certain natural resources, or with foreign
    exchange or gold reserves, could go to the BIS\* and, by contributing those foreign
    currency reserves, gold, or by pledging its natural resources, could obtain the
    issuance of a customized CBDC for the value of the reserves contributed, with
    a pre-determined exchange rate.


    References:


    Bank for International Settlement.


    Multi-CBDC arrangements and the future of cross-border payments.


    [https://www.bis.org/publ/bppdf/bispap115.htm](https://www.bis.org/publ/bppdf/bispap115.htm)


    Project mBridge: Connecting economies through CBDC.


    [https://www.bis.org/about/bisih/topics/cbdc/mcbdc\_bridge.htm](https://www.bis.org/about/bisih/topics/cbdc/mcbdc_bridge.htm)


    The Bank for International Settlements (BIS) is an international financial institution,
    headquartered in Basel, Switzerland, owned by the central banks of various countries,
    which promotes international monetary and financial cooperation and serves as
    the central bank for national central banks.


    The BIS also develops public technology solutions to support central banks and
    improve the functioning of the financial system through its Technology Innovation
    Hub.


    The BIS promulgates or enforces a de facto set of standards that apply to the
    entire global banking system.


    ## **CHAPTER 10.**


    ## **Application in Real Life.**


    ## **Control, Surveillance and Restriction of Freedom.**


    The use of Central Bank Digital Currencies (CBDCs) as a surveillance tool, combined
    with other control tools such as social networks, cell phones with default geolocation,
    facial recognition, and license plate recognition in cars, pose a threat that
    many citizens would prefer to ignore and believe will not be implemented. However,
    they herald a dystopian and Orwellian world even worse than the one described
    in his famous novel "1984"


    This process, promoted by the media of disinformation, can be carried out in steps,
    gradually, as described in the political theory of the Overton Window.


    The Overton Window is a political theory that describes how social opinion can
    change in several stages (or a window of time) so that an idea that is initially
    completely unacceptable can eventually and gradually be introduced and accepted
    by society.


    As an example, although in ancient times there were safe conducts to move through
    different kingdoms or countries, it was not until after World War II that the
    requirement to have a " permission" or passport to travel was introduced.


    In the late 19th century and until World War I, passports were generally not required
    for travel within Europe, and crossing borders was easy. Few people had passports,
    and they were very simple, containing only a description of the passport holder.
    As the use of photography became widespread in the early decades of the 20th century,
    photographs were added to passports.


    During World War I, European governments introduced this type of document for
    security reasons and to control the emigration of citizens with education or skills
    useful to the war effort, thus keeping potential workers within their borders.
    These controls were maintained after the war and became standard procedure.


    In 1920, the predecessor of the UN, the League of Nations, held a conference on
    passports and tickets, which resulted in guidelines that were further developed
    at conferences in 1926 and 1927. Finally, in 1980, passports were standardized
    under the auspices of the International Civil Aviation Organization (ICAO).


    Today, no one questions why citizens must ask the government to issue a passport,
    which is essentially a license to travel; it is so much taken for granted that
    we do not even think about the reason for this administrative permission.'
