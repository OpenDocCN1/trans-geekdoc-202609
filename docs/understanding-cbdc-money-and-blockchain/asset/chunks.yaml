- raw: 'The use of wallet applications on smartphones will be enough to eliminate
    or render unnecessary the infrastructures of current private card-based payment
    services.


    Instead, these private infrastructures will become public, and therefore at public
    expense.


    There is one major drawback to the widespread use of CBDC, and that is the need
    to be connected to the Internet. In the event of a natural disaster, power outage,
    or force majeure, wallet applications will need to be able to perform transactions,
    both offline and online, both payments and collections, using NFC technology or
    QR codes.


    This should be possible at least for a limited time and for limited amounts.


    Although it would be very difficult to provide completely offline CBDC solutions,
    at least occasional online synchronization should be a necessary feature to cover
    geographic areas without Internet access or with limited or no permanent access.


    There is one point we can make in this section about possible advantages, although
    it could very well be a critical disadvantage.


    That point is that if our money is a record in a CBDC application of the central
    bank, it would in principle be protected from bank failure.


    The basis of the entire current financial system that we mentioned earlier, fractional
    reserve banking, in which banks keep only a small fraction of deposits in their
    vaults, is based on the premise that it is very unlikely that many depositing
    customers will want to withdraw their deposits or cash at the same time.


    When this happens, and it has happened many, many times, the bank is unable to
    repay its depositors, then it must turn to the central bank, also called the lender
    of last recourse, which will provide the necessary liquidity, provided that the
    bank''s assets, such as real estate, bonds, stocks, and loans made by the bank
    but not yet collected, can support the amount the bank needs to repay the deposits.


    Usually there will be problems because the bank''s assets may take a long time
    to liquidate or may not be sufficient, causing the bank to fail, a term synonymous
    with "bankruptcy".


    During this process the bank will be closed or will have suspended withdrawals,
    causing serious problems to all its depositors, before the authorities execute
    the laws already established for such an eventuality, which would be in principle
    an Internal Recapitalization or Bail-in\* and only afterwards the indemnities
    of the Deposit Guarantee Fund of your country will be settled, provided that this
    Fund has sufficient "funds" to compensate the depositors up to a maximum limit
    of 100,000 Euros per depositor.


    In the United States this limit is 250,000 dollars, in Switzerland 100,000 Swiss
    francs and in the United Kingdom 75,000 pounds.


    From the point of view of a European, it is easier to believe that a collapse
    of the Euro system behind CBDC or Digital Euro would be much less likely than
    that of any of the major European commercial banks, especially if you are a citizen
    of one of the southern countries.


    But this could also become a fatal trap, because there would be no way to get
    your money out of the CBDC system.


    With physical money gone, our money will only be an electronic record, and we
    have already seen how vulnerable and easy it is to block, seize or delete a record.


    A crash of the Euro system (not an impossible eventuality) would have consequences
    best left unimagined as we will be trapped.


    The concept that when you deposit your money in a bank or an accounting record
    in a CBDC system, that money is no longer yours must be very present.


    From that moment on, you have a promise to pay, or in the case of an electronic
    currency, permission to dispose of your money. But permissions can easily be revoked
    and promises to pay broken.


    The risk of fragmentation and collapse of the European Union, and not just of
    the CBDC system, but of the confidence and value of the Euro itself as a common
    currency, is a very real risk.


    The value of a currency, as we have seen, can be legally imposed, but that value
    can disappear, because in the end the value is not in the law, but in the trust
    we place in that law to be enforced, by the use of coercion if necessary.


    In Chapter 10 we will explore these and other risks, as well as possible remedies
    or alternatives.


    ## **CHAPTER 8.**


    ## **Challenges and Concerns.**


    ## **Disruption of the current role of banks.**


    Today we naturally assume that money comes from, or is created by, the state or
    a union of states, such as the European Union.


    That the state has the power to issue money is such a natural assumption that
    hardly anyone asks why and since when.


    The link between money and government is much more recent than one might think.


    In the case of Spain, it was only in 1874, during the ephemeral First Spanish
    Republic, that the Decree-Law of March 19, promoted by the Minister of Finance,
    José de Echegaray\*, put an end to the system of plurality of issue and granted
    the Bank of Spain the monopoly of issuing banknotes for mainland Spain and the
    islands, in exchange for an important loan to cover the financial needs of the
    government of the day.


    Reference: Jose Echegaray - Wikipedia


    Note that Jose Echegaray, an engineer and mathematician, was awarded the Nobel
    Prize for Literature in 1904.


    This decree gave the other provincial banks the option of remaining commercial
    banks, without the privilege of issuing banknotes, or of being integrated into
    the Bank of Spain as branches. Most of the provincial banks were integrated, and
    only five chose to remain commercial banks.


    Until then, the banks, which were always private, issued their own banknotes,
    which were nothing more than a receipt certifying the ownership of the gold deposited
    in each bank''s vaults.


    Money was private until 1874, when the Bank of Spain was granted by law the privilege
    of the monopoly of issuing banknotes.


    It was at that time that the State granted itself the power to issue money, and
    when banknotes ceased to be convertible into gold, and the Bank of Spain was granted
    the exclusive right to issue non-convertible paper money, or paper money not backed
    by gold.


    Reference: Bank of Spain.


    Banco de España - About us - History - From the Banco de San Carlos to the Banco
    de España (bde.es)


    In the United States, the central bank known as the Federal Reserve System was
    not created until 1913.


    The creation of the Federal Reserve System was the third attempt to create a central
    bank. Its predecessors were the First Bank of the United States in 1791 and the
    Second Bank of the United States in 1816, neither of which survived. Nearly 100
    years later, a new opportunity arose and 12 regional banks were created that now
    make up the U.S. monetary machine.


    The history of the dollar, however, is tied to the United States'' war for independence
    from the British Crown.


    In 1783, after the victory in the war, the first U.S. currency was introduced
    under the name "Nova Constellatio" and the states were forbidden to mint their
    own money. This meant that only the federal government could do so.


    On April 2, 1792, the dollar became the official currency of the United States
    by the Coinage Act of Congress by order of the government.


    That same year, the Coinage Act was passed, providing for the establishment of
    a mint in Philadelphia, then the nation''s capital.


    This establishment was responsible for the circulation and production of coins.
    In addition, the American dollar was adapted to the Spanish "Piece of Eight",
    which was the world reference at the time, in its composition, silver, dimensions
    and weight, thus guaranteeing its interchangeability with it, and the decimal
    system was established.


    References:


    Real of Eight - Real de a ocho and Global Currency - ([traveling-cook.com](http://traveling-cook.com))


    Colonial American Currency - World History Encyclopedia'
