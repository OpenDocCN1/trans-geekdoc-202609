    From the moment a bank makes a loan "using" the deposits of other customers, it
    doubles the amount of money in that loan, because the borrower can use that money
    with the promise to pay it back with interest, but the loaned money is still available
    to the depositors.


    Therefore, this "fractional reserve" system creates a monetary aggregate that
    increases the monetary base, thereby expanding the amount of money circulating
    in the economy.


