- raw: 'No one, person, company or entity has the power to change the issuance criteria
    to their advantage. The criteria are predictable in the future and publicly known,
    and their use is voluntary and not mandatory.


    1b. Issuance.


    We must be very clear that the issuance of new money is a permanent fact, intrinsic
    to the fiat monetary model, where it is necessary to create more money to be able
    to pay the interest on the money previously issued.


    Moreover, the temptation to create more money to pay for spending is absolutely
    unavoidable.


    Virtually every government in the world desires the power to issue or control
    the issuance of money, which is the very core and heart of political corruption.


    In fact, every government in the world constantly spends more than it takes in
    and disguises some of that money as being for social purposes in order to justify
    the creation of new money.


    And the result is that the more money that is issued, the less value it has, because
    this new money dilutes or reduces the value of the previously issued money, creating
    inflation.


    Milton Friedman:


    "Inflation is always and everywhere a monetary phenomenon in the sense that it
    is and can be produced only by a faster increase in the quantity of money than
    in production."


    If the issue of money has no limit, in mathematics we would say that it tends
    to infinity, then its value tends to zero.


    This paradigm has repeated itself throughout history. All, absolutely all, fiat
    currencies that are not backed by a physically scarce asset or commodity such
    as gold have failed, and the current ones will be no exception.


    When a fiat currency collapses due to loss of value from unlimited issuance, a
    terrible crisis is created, then the political power creates a "new" currency
    with a new look and lower face values to appear more valuable, forcing the exchange
    of the old currency for the new one with an associated loss on the exchange.


    After the end of World War II, the new Deutsche Mark (DM) was created and reestablished
    by the authorities of Allied occupied Germany at an exchange rate of 1 DM to 10
    old Reichsmarks.


    This "generous" exchange rate was used to stabilize the German economy and eliminate
    the hyperinflation that had plagued the country during the war due to the Hitler
    government''s constant spending to finance the war effort.


    Unfortunately, the history of fiat money has always been associated with war.
    In ancient times, military expenditures were financed with gold coins, when the
    gold ran out, the war was over, but unlimited issuance of fiat money makes it
    possible to finance equally unlimited war expenditures, and wars are always used
    as a pretext to justify excessive issuance.


    All this historical review shows us that the main difference between fiat money
    and bitcoin is that bitcoin, having a finite issue and limited to 21 million units
    as its first quality, establishes an absolute difference with fiat currencies.


    The value of a currency could remain stable if it were issued at exactly the same
    rate of growth of the real economy, the growth of raw materials, processed goods
    and services, but quantifying economic activity is an almost impossible task given
    the chaotic nature of all the interactions that make up economic activity.


    The issuance of new bitcoin units is halved approximately every four years, so
    we could apply the inverse rule to fiat money: if it tends to infinity, its value
    will tend to zero; on the contrary, if the issuance of new bitcoin tends to zero,
    a moment that will arrive approximately in the year 2,140, the value of bitcoin
    will grow and tend to infinity.


    This mathematical paradigm can be so shocking that many skeptics refuse to accept
    it because we take it for granted that money loses value over time.


    Some people call for a return to a monetary system anchored or backed by gold
    because it is a scarce commodity whose historical average ratio of new gold mined
    annually to existing gold is about 1.5% to 2%. This means, for example, that a
    Roman toga, reserved for freemen, patricians and nobles in ancient Rome, cost
    the equivalent of one ounce of gold, or about 31.1 grams of gold.


    At the time of writing, an ounce of gold is trading at about $2,000 the price
    at which we could buy a good tailored suit today.


    This argues that gold is holding its value and clearly shows the loss of value
    of fiat money.


    Remember the previously mentioned fact that when Richard Nixon "temporarily" suspended
    the convertibility of the dollar into gold in 1971, the price was $35 per ounce
    and today it is close to $2,000.


    This represents a 98% loss in value in little more than 50 years; following the
    trend we have described, the value of the dollar as a fiat currency, even though
    it is the most stable currency, tends to zero because there is no limit to its
    issuance.


    Those responsible for the management of central banks are called central bank
    governors in most languages, in an attempt to give a halo of public authority
    to positions and entities that are not really accountable to either the government
    or the parliaments of the countries, in most of which the system for appointing
    their positions remains conveniently unclear or, in any case, little known.


    The most important central bank in the world is the Federal Reserve of the United
    States, but it is actually a banking cartel\* composed of 13 private banks called
    Regional Federal Reserve Banks.


    The Federal Reserve System consists of twelve regional banks from different geographical
    districts of the United States and a central bank located in Washington D.C..


    Each regional bank has its own board of directors, and the president of each regional
    bank is appointed by the Reserve Bank of its district and approved by the Board
    of Governors of the Federal Reserve System.


    The governors of the Board and the Federal Reserve Chairman himself are appointed
    by the President and confirmed by the Senate.


    So far, it seems to be a democratic institution, since its positions are appointed
    by the President of the United States and confirmed by the Senate; but as almost
    always, the devil is in the details, and the "little detail" is that the members
    and the governor of the central bank are pre-appointed by the FED itself.


    Nominees for President and Vice President may be selected by the President of
    the United States from among the governors of the regional Federal Reserve Banks
    to serve four-year terms (Banking Act of 1935).


    This nomination must then be confirmed by the Senate.


    In other words, it is not the President or the Senate that appoints the members;
    they are nominated internally by the Fed and proposed to the President and the
    Senate for approval.


    Since the Federal Reserve does not have shareholders like a traditional corporation,
    it is funded by the profits from its operations, not by shareholders.


    However, the regional Federal Reserve Banks are owned by the banking institutions
    in their districts, and these banks are the shareholders of the regional banks.


    However, the banks cannot control the decisions of the central Federal Reserve,
    and the economic benefits of the regional banks are retained by the Federal Reserve
    rather than distributed to shareholders.


    The reader will probably agree with this writer that the whole structure that
    operates the U.S. monetary and banking system seems like gibberish that is difficult
    to understand, and I suspect that this is no accident.


    By its name, the Federal Reserve could pass for a public body, but it is not,
    it is a cartel of private banks that have their shareholders, and the private
    property of these "Regional Reserves" belongs to the largest banking entities
    in the United States, although this is completely opaque to the citizens.


    It is not a reserve, since it holds nothing tangible, which is the function of
    the U.S. Treasury, nor is it federal, since it is not a public entity.'
