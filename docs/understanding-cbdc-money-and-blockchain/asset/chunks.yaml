    Suisse.'
  fmt: '

    The next day, on March 10, 2023, the mid-sized Silicon Valley Bank also failed,
    and the `FDIC` or Bank Deposit Insurance Corporation of the United States intervened.


    This second bank to fail within 48 hours triggered a widespread banking panic
    not only in the United States, but also in Europe.


    On March 14, 2023, Signature Bank also failed. This forced the `Federal Reserve`
    and the `U.S. Treasury` to take immediate and drastic measures to prevent a general
    banking collapse.


    The reason for the collapse of these banks is the same as almost always, fractional
    reserve banking, where banks keep only a very small percentage of their customers''
    deposits available for withdrawal while they lend the rest to other customers
    or invest in assets that provide them with profitability, hoping that many of
    the depositing customers will not want to withdraw their money at the same time.


    Due to the lack of confidence in Silicon Valley Bank, customers withdrew 42,000
    million in the morning of the day of its failure.


    We must understand that a bank, by definition, is always an insolvent entity,
    and this assertion is not an overstatement. The raw material with which a bank
    works is the money of its creditors, i.e. its depositors, as well as other entities,
    including the central bank, which "lend" it money so that the bank can make profits
    by investing in various financial assets and granting loans.


    That is, using its liabilities or money owed to its depositors and other entities,
    it makes profits with medium and long-term assets and repays the loans it has
    made with interest. In a normal situation, all may go well, since generally not
    many depositors come to withdraw their deposits at the same time.


    The fractional reserve system on which banking is based is essentially a fraud,
    because when a bank lends capital to a customer who asks for a loan, the bank
    is really pretending to use the deposits of other customers, but without reflecting
    that capital taken from the depositors'' accounts. Deposors still see 100% of
    their deposits in their account balance and can withdraw those funds today. Since
    banks invest most of their deposits in medium- and long-term assets, they will
    not be able to cope with a massive withdrawal of their depositors in the short
    term.


    ### Lack of confidence always triggers this reaction


    In a situation of banking panic with massive customer withdrawals, banks can liquidate
    short-term assets such as stocks or government bonds in the secondary market or
    by borrowing from the central bank using the medium- and longterm assets they
    hold as collateral. This happened to the three failed banks mentioned above and
    threatened a large number of other small and medium-sized regional banks.


    In an attempt to obtain liquidity, Silicon Valley Bank sold shares that had been
    devalued in the stock market in recent months, and also sold its treasury bonds
    in the secondary market at a huge loss, as they had fallen in price.


    The reader will ask: If `U.S. Treasury Bonds` are Fixed interest rate assets,
    and are the safest, and most liquid assets, how can they lose value? The answer
    is not difficult to understand, during the decade and a half after the collapse
    of 2008, interest rates have been close to zero in the United States, and negative
    in Europe, so Treasury Bonds issued during those years, and we are talking about
    an overwhelming money supply, had a very low yield between `1%` and `2%`.


    As the `Federal Reserve` has initiated a steep rise in interest rates reaching
    in the United States at the time of writing this book the yield on bonds at `3.75%`,
    the new bonds issued are now much more profitable than the bonds issued in previous
    years. Bonds are fixed interest assets only if they are held until maturity; if
    you want to sell or liquidate them before maturity, you have to go to the secondary
    market where they are traded according to supply and demand.


    Obviously, investors will prefer to invest in recently issued bonds with an interest
    rate or yield close to `4%`, rather than in bonds from previous years with a yield
    of `1%`. Therefore, the market will assign a lower value to bonds with lower yields,
    and if you want to sell them, you will have to accept a drop in price at least
    equal to what the investor will lose compared to buying a newer bond.


    All banks, large and small, have in their balance sheet, or in their list of assets
    a huge amount of money, some of it in stocks and most of it in fixed interest
    securities, mainly US Treasury bonds, as the safest and most liquid asset that
    exists, but let''s not forget that in just 18 months, during 2020 and the first
    half of 2021, the `US Federal Reserve` will have issued `25%` of all the dollars
    created in the history of the dollar, this huge amount of money supply would necessarily
    have to generate an inflationary event like the one we are experiencing.


    With the banks'' balance sheets full of bonds with very low profitability compared
    to the current bonds, the market logically assigns them a value much lower than
    the purchase value, known as unrealized losses, the banks can wait for the maturity
    period according to the composition of their bond portfolio to receive at the
    end of that period `100%` of the nominal value of these bonds, but if for some
    reason they are forced to sell them before maturity, they will suffer catastrophic
    losses.


    This happened to Silicon Valley Bank, after selling the bonds it could at a loss,
    it tried to increase its capital, but when it did not find new investors to provide
    more capital to the bank, it caused panic among its depositors, who began a massive
    withdrawal of funds, leading to the bank''s bankruptcy and its intervention by
    the `FDIC`, or Bank Deposit Insurance Corporation of the United States. The following
    banks, `Signature Bank` and `First Republic Bank`, suffered identical circumstances,
    so the `Federal Reserve` and the `Treasury` decided to intervene once again to
    prevent the banking panic from spreading throughout the banking system.


    The solution? Simple, the same as always, inject new money and manipulate the
    markets with increasingly extreme practices that will end up undermining the confidence
    of investors and citizens. Since all the banks have an enormous mass of money
    in devalued Treasury bonds, the "happy" idea that the regulators and the `Treasury`
    have come up with is to value the banks'' bond reserves not at the real market
    price, but at the nominal price, or maturity price. And on the basis of this "falsely
    valued" collateral, they will issue `300 billion` in new money, which they will
    lend to the troubled banks on favorable terms.


    The situation of the big banks is not much different, their balance sheets are
    accumulating huge unrealized losses because they have not had to sell these bonds
    for the moment, with the new injection of liquidity they will probably not have
    to do so anymore. We should ask ourselves some questions here. If `300 billion`
    was issued to save three banks, how much would be needed if more than a hundred
    regional banks needed it?


    ### Reference:


    More than 186 U.S. banks are at risk of collapse, analysis shows.


    `https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4387676`


    Is it a good idea to bail out a mismanaged bank with public money or funds that
    will end up devaluing our money?


    The reasons to condemn bank bailouts would be enough to write another book.


    In Europe, the giant Swiss bank `Credit Suisse`, classified as a global systemic
    risk, was on the verge of bankruptcy, and the `Swiss National Bank (SNB)` has
    decided to inject `54 billion` to avoid its immediate bankruptcy.


    We should know that the `SNB` itself has accumulated losses of `133 billion` in
    `2022`, and now in `2023` it has already committed `54 billion` more to try to
    save `Credit Suisse`.

    '
  trans: '


    第二天，即 2023 年 3 月 10 日，中型银行硅谷银行（Silicon Valley Bank）也倒闭了，美国`FDIC`（联邦存款保险公司）介入了处理。


    这 48 小时内倒闭的第二家银行不仅引发了美国的范围银行业恐慌，也波及了欧洲。


    2023 年 3 月 14 日，签名银行（Signature Bank）也倒闭了。这迫使`联邦储备体系`和`美国财政部`采取立即且果断的措施，以防止银行业发生全面崩溃。


    这些银行倒闭的原因几乎如出一常：准备金金制度。在这种制度下，银行仅保留极小比例的客户存款可供取款，而将其余资金贷给其他客户，或投资于能够产生利润的资产中，希望许多存款客户不会在同一时间提取资金。


    由于对硅谷银行缺乏信心，客户在其实行倒闭当天的早晨提取了 42,000 万亿元的资金。


    我们必须理解，从定义上来说，银行始终是一个无偿能力的实体，这一断言并非夸张。银行运作的原材料是其债权人（即存款人）以及其他实体（包括中央银行）向其“借出”的资金，以便银行通过投资各种金融资产和发放贷款来获取利润。


    也就是说，银行利用其对存款人和其他实体的负债（欠款资金），通过中长期资产获利，并偿还带息的贷款。在正常情况下，一切可能进展顺利，因为通常没有这么多存款人会同时提取存款。


    银行业赖生存的准备金制度本质上是一种骗局，因为当银行向要求贷款的客户提供资金时，银行实际上是在假装使用其他客户的存款，但并没有反映从存款人账户中提取的资金。存款人仍然在自己的账户余额中看到
    100% 的存款，并可以在今天提取这些资金。由于银行将大部分存款投资于中长期资产，它们在短期内无法应对客户的大规模取款。


    ### 缺乏信心总是会引发这种反应


    在客户大额取款的银行业恐慌情况下，银行可以在二级市场变现股票或政府债券等短期资产，或者通过将其持有的中长期资产作为抵押向中央银行借款。上述提到的三家倒闭银行就是这种情况，并威胁到了大量其他中小型区域性银行。


    为了获取流动性，硅谷银行出售了最近几个月来在股市中贬值的股票，还以巨大的损失在二级市场抛售了其国债，因为这些债券的价格已经下跌。


    读者会问：如果如果`美国国债`是固定利率资产，而且是最安全、流动性最强的资产，它们怎么会贬值呢？答案并不难理解：在 2008 年危机后的十五年里，美国的利率接近于零，欧洲则为负，因此在这些期间发行的国债（我们谈论的是规模巨大的货币供应量）收益率非常低，仅在
    `1%` 到 `2%` 之间。


    随着`联邦储备体系`发起了利率的剧烈上涨，在本书撰写此期间，美国的债券收益率已达到 `3.75%`，新发行的债券现在比以前几年发行的债券有利得多。债券只有在持有到到期时才是固定利率资产；如果你想在到期前出售或变现它们，就必须去二级市场，那里它们根据供需关系进行交易。


    显然，投资者将倾向于投资利率或收益率接近 `4%` 的新发债券，而不是收益率只有 `1%` 的旧债。因此，市场会给低收益率债券分配较低价值，如果你想出售它们，就必须接受至少等同于投资者与购买新债相比所遭受损失的价格跌幅。


    所有银行，无论大小，在它们的资产负债表或资产清单上都拥有巨额资金，其中一部分是股票，大部分是固定收益证券（主要是美国国债），因为它是存在的最安全、流动性最强的资产。但让我们不要忘记，在短短
    18 个月内（即 2020 年到 2021 年上半年），`美国联邦储备体系`发行的美元占了美元历史上创造的所有美元总额的 `25%`，如此巨大的货币供应量必然会产生像我们正在经历的这种通胀事件。


    由于银行的资产负债表上充满了与当前债券相比收益率极低的债券，市场在逻辑上赋予了它们远低于购买价值的价值，这被称为未实现亏损。银行可以根据其债券组合的构成等待到期，以便在该期结束时获得这些债券面值的
    `100%`，但如果由于某些原因它们被迫在到期前出售，它们将遭受灾难性的损失。


    '
