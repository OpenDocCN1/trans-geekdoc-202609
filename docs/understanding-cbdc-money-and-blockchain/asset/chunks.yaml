- raw: 'A trust is a legal agreement in which an individual or organization (the trustor
    or settlor) transfers assets to a trustee. The trustee is then responsible for
    managing those assets for the benefit of the trust''s beneficiaries in accordance
    with the terms of the trust agreement.


    A trustee is an individual or organization responsible for managing the assets
    placed in a trust. The trustee performs this role on behalf of a grantor, the
    person who created and funded the trust.


    It is a contract by which a person, called the grantor (or trustor or settlor),
    transfers certain assets for a specific lawful purpose and entrusts the realization
    of that purpose to a trust institution which, at a certain time or when the condition
    imposed by the grantor of the assets is fulfilled, must deliver to the beneficiary
    or trustee the fruits or products generated by the activity.


    The assets transferred to the trust are not at the commercial risk of the settlor
    (the one who transfers the ownership of the assets) or of the trustee (the owner
    of the trust assets at the end of the term of the contract), since the assets
    that are the subject of the trust cannot be pursued by the creditors of either
    of them, nor can they be affected by the bankruptcy of both or one of them.


    The trustee (the one who administers the assigned property) may, by extension,
    refer to the person or entity that provides the service to the settlor (the one
    who assigns the property).


    **VIX. (Index)**


    The VIX (CBOE Volatility Index) is an indicator of the implied volatility of put
    and call options on the S&P 500 Index, which is used to measure market expectations
    of future equity market volatility.


    The VIX Index is considered a measure of market "fear" or "anxiety" and is commonly
    used as a risk management tool for investors.


    **Volatility.**


    Stock market volatility refers to the measure of the magnitude and frequency of
    changes in the price of a security, index or market.


    In other words, volatility is a statistical measure of the number and magnitude
    of fluctuations that a financial asset experiences in a given period of time.


    However, the term volatility is often used colloquially, beyond its precise meaning,
    to describe uncertainty about asset prices and, more frequently, to emphasize
    potential price declines.


    **Yield.**


    Refers to the profit, if the return is positive, or loss, if the return is negative,
    earned on an investment, expressed as a percentage of the capital invested.


    High-yield bonds are a euphemism for junk bonds, which are bonds issued by institutions
    with poor credit ratings and a high risk of default. These bonds usually offer
    a high rate of interest. However, there is a high risk of default.


