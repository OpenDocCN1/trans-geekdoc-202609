- raw: 'If this currency is used and backed by the economic bloc with the largest
    population and the largest production of commodities, it could quickly displace
    the dollar as the international trade and reserve currency, causing serious problems
    for Western countries.


    However, this new currency will have to meet the first requirement of money, which
    is to be generally accepted, a quality that is always linked to trust.


    International trade in national currencies always raises the problem of trust.
    If a nation issues unlimited amounts of money to buy services and tangible goods
    or commodities, the exporting nation will eventually realize that it is delivering
    tangible value in exchange for colored numbers.


    The United States'' strategy of using the dollar as a weapon, sanctioning political
    or economic rivals, and confiscating their dollar reserves, which are nothing
    more than accounting entries in the banks, has already made the rest of the countries
    aware that the dollar is not a reliable currency, because it can be created out
    of nothing in unlimited quantities, and it can also be confiscated at the will
    of its issuer.


    The renowned American investor Ray Dalio analyzes in his successful book "Principles
    for Confronting the New World Order: Why Nations Succeed and Fail," and it is
    not my wish to spoil this great book, which I recommend, the cycles that have
    been repeated throughout history of the rise and fall of dominant nations.


    These historical cycles present analogies as, for various reasons that Dalio explains
    in his book, a nation manages to rise with a hegemony that soon moves to its currency,
    which becomes the standard for world trade and reserve currency.


    This fact, as Charles de Gaulle also describes in his previously mentioned speech,
    leads the hegemonic state to an exorbitant privilege that allows it to go into
    debt for free, which usually strengthens its hegemony, although this inevitably
    ends in inflation due to the issuance of money to finance this debt, as well as
    its military power.


    The current geopolitical circumstances indicate that the decline of the United
    States has already begun, with growing social tensions, given the huge social
    gap between the rich and the poor, a totally disproportionate debt that is already
    unpayable, and has entered into a spiral of creating new money to sustain its
    economy and pay the interest on the debt previously created, which can only be
    paid with new money, which further inflates the debt.


    I invite the reader to visit this Internet link: US Debt Clock.


    [https://www.usdebtclock.org/world-debt-clock.html](https://www.usdebtclock.org/world-debt-clock.html)


    On this website you can see in real time the debt of the most important countries
    in the world, but let''s look not only at the first column of public debt, but
    also at the following ones: Gross Domestic Product; Debt to Gross Domestic Product
    Ratio; and in the last column, Debt in the hands of International Creditors to
    GDP Ratio.


    United States: 31.5 trillion debt, GDP: 26 trillion, debt/GDP ratio: 94%, foreign-owned
    debt/GDP ratio: 93%, foreign-owned debt/GDP ratio: 93%.


    The next countries on the list show very similar data, although the ratio of foreign-owned
    debt to GDP is considerably lower in the cases of China at 17%, India at 25%,
    and Russia with the best debt/GDP ratio in the world at only 19% and a foreign-owned
    debt/GDP ratio of 26%.


    Note that all three are founding members of the international BRICS group.


    What we can observe in the debt data leaves no room for doubt: The fiat money
    monetary system, based on the constant issuance of money, is doomed to implode.


    It is highly probable that we are heading towards a multipolar world, currently
    projected by the BRICS and their current candidates, which could establish an
    international electronic currency backed by gold and commodities, and the other
    pole, known by the Western countries plus Korea and Japan, with a monetary system
    on the verge of imploding and based on the infinite creation of money backed by
    really nothing.


    This would lead to a systemic and worldwide economic and social crisis, which
    would necessarily entail a monetary reset of the hegemonic currency and the establishment
    of a new world and monetary order.


    Remember that most of the reserves of the world''s countries, especially those
    most closely tied to the United States, are denominated in dollars; if the dollar
    loses its status as the world''s reserve currency, this collateral represented
    by the reserves will be worthless enough to support other national currencies
    or the European Union''s euro.


    The boom-and-bust cycles of the hegemonic countries analyzed by Ray Dalio occur
    over considerable periods of time, but we can find other economic cycles that
    are shorter in time, which we could call cyclical and non-systemic booms and busts
    like those mentioned by Ray Dalio.


    These cycles, of which this author has seen several, occur every few years, and
    all of them, although they occur under different circumstances and seem to have
    different causes, always have one element in common.


    When central banks increase the money supply by expanding credit and debt, an
    economic boom occurs, which also creates inflation. This process is called Quantitative
    Easing.


    When this debt and inflation reach certain limits, or for whatever reason, the
    central banks reduce the money supply by raising interest rates and withdrawing
    money from circulation, this process is called Quantitative Tightening, a recession
    with high unemployment and economic crisis ensues.


    Then, as a supposed response to this crisis, the central banks begin to expand
    the monetary mass again, increasing credit again by lowering interest rates, and
    the periodic cycles of monetary expansion and contraction of credit and debt are
    repeated.


    Those who have conserved their liquidity during the crisis or those who have easy
    access to credit in a new phase of monetary expansion, such as commercial banks,
    rapidly increase their wealth by buying companies and assets at low cost as a
    consequence of the previous crisis.


    This process is called the "Cantillon Effect", which is explained in economist
    Richard Cantillon''s theory of the unequal impact of monetary policy on the economy.


    It is a phenomenon whereby the issuance of money by central banks benefits those
    who print money to the detriment of the general population, because the newly
    created money is neither simultaneously nor evenly distributed throughout the
    population.


    The process of monetary expansion therefore involves a transfer of wealth.


    Some may argue that the actions of central banks are intended to counteract economic
    boom and bust cycles.


    In the opinion of this author and many analysts, the opposite is true: it is the
    intervention of central banks in economic policy that creates boom and bust cycles
    in the economy.


    This was supposedly the premise for which central banks were created, to fight
    cyclical crises.


    If we analyze history, we will see that this excuse is false.


    CBDCs are presented to the public on several premises publicized by governments
    and central banks, such as that they are a new form of the same money we already
    use, that they will not replace physical money, and that they will be more convenient,
    interchangeable for goods and services as well as for bank notes and physical
    money.


    Throughout this book I have tried to sow more than reasonable doubt about the
    veracity of these premises.


    This author believes that the fiat monetary system, based on the issuance of money
    with no backing nor limit, to pay a debt that is also growing without limit, will
    lead to a loss of value and confidence that this debt can be repaid, which will
    inexorably lead to a monetary reset.


    On March 9, 2023, the small U.S. bank Silver Gate Bank declared bankruptcy.'
