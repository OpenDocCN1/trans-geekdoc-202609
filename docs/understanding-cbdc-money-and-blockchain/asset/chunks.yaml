- raw: 'However, it is relatively easy to open an account with one of the new "neo-banks".
    Neo-banks are financial institutions that operate exclusively online, without
    physical offices, and offer limited services such as current accounts, cards,
    money transfers and cryptocurrencies, but do not offer services typical of large
    traditional banks such as investment portfolios, consumer loans and even less
    mortgage loans, i.e. they do not really compete with the bulk of traditional banking.
    These banks also tend to have limits or restrictions on operating with high amounts,
    which may be very convenient for their users, but in reality, try to restrict
    the free movement of capital.


    Initially, when these banks became popular, they offered bank account numbers
    (called IBANs in the EU) of their countries of origin, such as the United Kingdom,
    Germany, some in the Baltic republics, etc., but the major service providers in
    each country began to create problems with direct debit of bills for services
    such as telephone, water, energy, etc. to foreign IBAN accounts, even if they
    had European IBANs. This again violated the principles of free movement of capital
    and services within the EU, but forced these banks to set up "legal" branches
    in each country, offering their own IBAN for each EU country.


    This change had several objectives, first of all to improve the usefulness of
    their services to customers in each country, but in fact, it hides that, for example,
    Spanish IBAN accounts, although provided by a German bank, are actually controlled
    by the Central Bank of Spain, i.e. it is actually to maintain national control
    of money, ensuring that they do not compete with the bulk of banking business,
    such as the credit market with large traditional banks in each country.


    This type of operation actually hides a tacit agreement between banks, or what
    we could rather call a banking cartel, i.e. an agreement between companies to
    avoid mutual competition, in this case with banking services.


    Of course, agreements between companies to avoid competition are also illegal
    and violate another EU principle, such as the principle of free competition.


    However, CBDCs could radically and forever change the relationships between customers,
    banks, countries and currencies in a disruptive way that we can only guess at
    by doing an exercise of imagination about the new possibilities and inconveniences
    they could create.


    From the moment a currency is issued in electronic form, borders cease to exist,
    and its use will be "standard" throughout the world.


    While the international banking cartel is reluctant to allow free competition
    in their sector, CBDC e-currency issuers will clearly be in favor of allowing
    foreign citizens to buy and use their new digital currency, which would result
    in a juicy incoming flow of foreign currency into the funds of any CBDC-issuing
    central bank.


    Ever since China launched the Digital Yuan, which is currently in use or in very
    advanced testing, there has been speculation that it would be used as an "economic
    weapon" to gain global monetary supremacy to displace the dollar in international
    trade, which has done nothing but accelerate the process of creating and developing
    digital currencies by all the world''s central banks with the clear intention
    of promoting the international use of their digital currency.


    The control and issuing power of the world''s reserve currency gives the nation
    that issues it an exorbitant privilege, as well as some minor inconveniences.


    The greatest power of the United States is not its enormous army, but its enormous
    power to control the economy and international trade through the dollar.


    Without going into depth on this subject, which would be enough for another book,
    all issuers of CBDC digital currencies will be interested in having their digital
    currency bought and used by as many users as want it and can pay for its acquisition.


    Let''s consider likely scenarios.


    The transformation of the Chinese yuan into an international currency is "a necessary
    condition for maintaining peace in the world".


    So says Ju Jiandong, head professor of the School of Finance at Tsinghua University
    (Beijing), in an article published on February 28th in the Chinese state newspaper
    Reference: Global Times.


    Professor Ju Jiandong, points out that: The U.S. may unleash wars to "protect
    the dollar" given China''s economic growth. As we can see, the "currency war"
    is not so likely, it is already announced.


    China will eventually open its digital yuan to all citizens of the world, it is
    easy to imagine that citizens of all emerging countries, who are forced to use
    their national currencies and suffer from a permanent confiscation of wealth throughout
    history in inflation mode, immediately prefer to start buying, selling and saving
    in digital yuan.


    Let''s think about geographical scenarios with underdeveloped countries in Africa,
    Asia or Latin America, if you were a citizen of Liberia, Ghana, Ecuador, Nicaragua,
    Argentina, Turkey, Lebanon ...... The list would be enormous. Which currency would
    you prefer to use, your local currency that is stealing its value with inflation
    from the moment you receive it, or would you prefer to save in a stronger currency
    that will retain its value?


    At the time of writing this book, the beginning of 2023, the annual inflation
    suffered by Argentines is already around 100%, this situation is worse in some
    countries, better in others, is the normality, if we exclude the developed countries
    that have convertible currencies such as the US dollar, the Euro, the British
    pound, the Japanese yen, the Chinese yuan, etc., the local currencies become a
    machine of permanent confiscation of wealth.


    In fact, this confiscation also occurs in the developed countries, only the process
    is slower, except in times like the *present, when the inflation data, conveniently
    “cooked up” by* the governments, has reached double digits in Europe.


    How can an Argentine worker save a certain amount of money for retirement or simply
    for unforeseen expenses?


    As soon as the United States begins to issue its Digital Dollars to foreign citizens,
    and it will no doubt be strongly encouraged to do so in order to limit the issuance
    of the Digital Yuan around the world, every Argentine worker will immediately
    convert his monthly salary in Argentine Pesos into Digital Dollars, thus preserving
    somewhat better the value of his work.


    The Argentine worker will soon discover that the bakery, supermarket, and gas
    station in his neighborhood are doing the same thing, and he will agree to pay
    for his bread, groceries, or gas directly in Digital Dollars without having to
    exchange them back into Argentine Pesos.


    With this example, still imaginary but highly probable, we can foresee a scenario
    in which strong CBDC currencies could literally cause a "mass extinction" of weak
    national currencies.


    Will the Argentine government be able to prevent its citizens from using the digital
    dollar to the detriment of the Argentine peso?


    Massive use of the digital dollar will lead to the irrelevance of the Argentine
    peso.


    What political changes can we expect from the disruption of CBDC digital currencies
    in all countries with weak currencies?


    There will undoubtedly be a global currency war, a war that has always existed
    but that physical money, borders and banking have slowed down or rather hidden.


    There have always been tax havens and countries that have used their developed
    financial industry to provide offshore financial services\*, both legal and non-legal,
    to wealthy clients, the best example of this practice is undoubtedly the UK, with
    its multitude of offshore jurisdictions, but also countries such as Switzerland,
    the Netherlands, Ireland, Luxembourg, etc.


    Some of these countries, let''s take Switzerland as an example, might be very
    interested in offering financial services and legal security to foreign users
    of their digital currency.'
