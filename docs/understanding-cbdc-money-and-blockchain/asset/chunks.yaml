    This project would allow countries with little infrastructure to issue a "customized"
    `CBDC` that would function in this way:


    A poorly developed country, but with certain natural resources, or with foreign
    exchange or gold reserves, could go to the `BIS` and, by contributing those foreign
    currency reserves, gold, or by pledging its natural resources, could obtain the
    issuance of a customized `CBDC` for the value of the reserves contributed, with
    a pre-determined exchange rate.


    ## References


    - `Bank for International Settlement`.

    - Multi-CBDC arrangements and the future of cross-border payments.

    - [`https://www.bis.org/publ/bppdf/bispap115.htm](https://www.bis.org/publ/bppdf/bispap115.htm)

