- raw: 'This could mean that the Spanish euros in my Spanish CBDC application or wallet
    would not be freely usable in other European countries with a lower budget deficit
    or public debt, such as Germany or the Netherlands, and vice versa, without applying
    a corrective tax, i.e. the value of a Spanish digital euro would not necessarily
    have to be equal to that of a German digital euro, de facto destroying the monetary
    union.


    In the event of a national bankruptcy of one of the member states of the European
    Union, a risk that is not only possible but highly probable, both the European
    Union and the national government in charge could easily, effectively and immediately
    confiscate our savings in our wallets in order to carry out a bail-in\* or internal
    rescue at the national level.


    This case is already foreseen, for example, in the Spanish law of "National Security",
    a term used by governments to legally execute any action that the rest of the
    laws do not allow, because invoking "National Security" all other legal precepts,
    rights and freedoms can be violated.


    The technical possibilities for absolute control over citizens are of such a magnitude
    that they should make us think about whether we should submissively accept or
    resist CBDC digital currencies.


    Obviously, this control will not be implemented immediately, but will wait for
    the definitive disappearance of cash in practice, or when cash is outlawed as
    being used only by criminals.


    This situation could be precipitated in the event of international banking chaos
    or monetary reset, where CBDCs would undoubtedly be implemented.


    In such a case, government control will be absolute.


    Reference: Banking crisis accelerates the launch of FedNow and the digital dollar
    in the U.S.


    Banking Crisis Potentially Accelerates CBDC Development In The U.S. - The Dales
    Report


    The Federal Reserve announced the launch of FedNow, a 24/7 instant payment system,
    by July 2023.


    The political war on cash is already well underway, especially in European countries
    like Spain, where it is illegal\* to buy or sell anything over a thousand euros
    in cash..


    \* The Official State Gazette of July 10, 2021 published Law 11/2021 of July 9,
    2021 on measures to prevent and combat tax fraud.


    Likewise, it is mandatory to declare the movements in or out of Spain of amounts
    in cash equal to or greater than 10,000 euros. It is even mandatory to declare
    cash movements within Spain if the amount exceeds 100,000 euros.


    Bank transfers over 10,000 euros must also be declared. This limit also applies
    to ATM withdrawals.


    In order to declare these transfers, it is necessary to submit a form to the Tax
    Agency and provide documentation of both the person sending the transfer and the
    person receiving the money. It will also be necessary to "clarify the purpose"
    of the transfer.


    Reference:


    Tax Agency:Payment methods (agenciatributaria.gob.es)


    We should ask ourselves, if my money is mine, why can I no longer pay anything
    over a thousand euros with legal tender? If my money is mine, why do I have to
    declare and explain to the government what I am doing with my money?


    Fortunately, there are already citizens and states who have realized the danger:


    Geneva, February 06, 2023. The Swiss will decide in a referendum whether it should
    be written into the law that the economy will never be completely virtual and
    that cash can always be used.


    References:


    Swiss to vote on initiative to keep cash in circulation - SWI swissinfo.ch


    Switzerland’s ‘cash initiative’ – what’s at stake? - SWI [swissinfo.ch](http://swissinfo.ch)


    Legislation prohibiting the implementation of CBDC has been enacted in several
    U.S. states.


    North Carolina House unanimously passes HB690: Banning Payments in #CBDC''s &
    Prohibiting NC Participation in Any CBDC Testing.


    The latest version of the legislation included limiting the Federal Reserve from
    using the U.S. state as a potential testing ground for its own CBDC pilot.


    North Carolina House passes bill banning CBDC payments to the state ([cointelegraph.com](http://cointelegraph.com))


    Florida Legislature passes Gov. DeSantis-backed ban on central bank digital currency.


    The House passed SB 7054 by a 116-1 vote.


    ''With this bill, we are looking to protect the privacy of Floridians.''


    Legislature passes Gov. DeSantis-backed ban on central bank digital currency —
    with Democratic support ([floridapolitics.com](http://floridapolitics.com))


    As mentioned previously, it will not be necessary to ban cash in order to implement
    CBDCs, at least in the first years; their convenience and ease of use in replacing
    private means of payment will cause physical money to be no longer used in daily
    life.


    Similarly, if several states pass laws against the implementation of CBDCs, promoted
    by the politicians of the day, it may not be very effective; an electoral change
    in the corresponding parliaments will be enough to repeal these laws.


    But at least there is already a public and political reaction against the introduction
    of CBDCs.


    ## **CHAPTER 11.**


    ## **More Money Stories.**


    Aware of the legitimate concerns raised by the introduction of CBDC currencies
    and the certain disappearance of cash, we should ask ourselves the following questions:


    Can we avoid the introduction of digital currencies?


    The short answer to this question is NO.


    The possibilities of financial, economic and social control are such that political
    power can scarcely fail to seize them.


    Can we delay the introduction of CBDC?


    I am afraid not, as we have noted previously, 90% of the world''s central banks
    are working quickly to implement central bank digital currencies.


    The most likely timeline is: First public tests in the second half of 2023, initial
    deployment in 2024, and massive implementation in 2025.


    Now in 2023, there are a handful of countries with CBDC digital currencies already
    in circulation, the two most important being Nigeria with its e-Naira and China
    with its e-CNY.


    In Nigeria, the implementation of its CBDC, the e-Naira, can be described as disappointing.
    Africa''s most populous country has experienced rapid socio-economic development
    despite having a political power that is "not very transparent". The e-Naira has
    a usage rate of only 0.5% due to the total mistrust of Nigerian citizens towards
    their government.


    Adesoji Solanke, director at Renaissance Capital in Lagos, *told the media outlet,
    “The eNaira does not address any of* these basic use cases, so no surprise at
    its low adoption rates s*o far,”*


    Babatunde Obrimah, chief operating officer of the Fintech *Association of Nigeria,
    believes, “They \[Younger Generation\]* see the regulator as hostile to them and
    therefore have no *interest in anything it introduces,”*


    Reference:


    One Year on, Has E-Naira Defeated the Private Crypto Adoption? ([beincrypto.com](http://beincrypto.com))


    ABUJA, Nigeria (AP) *—* New clashes Tuesday between protesters and security forces
    in southern Nigeria left at least one person injured, amid demonstrations against
    a cash *shortage caused by the West African nation’s push to rapidly* phase out
    its old currency notes.


    Reference:


    Protests over cash shortage as Nigeria banknote switch looms | AP News


    *“Rioters have attacked bank ATMs and blocked roads in three* Nigerian cities
    as anger spilled on the streets over a scarcity *of cash”*


    Reference:


    Riots erupt in Nigerian cities as bank policy leads to scarcity of cash | Nigeria
    | The Guardian


    By coincidence, Nigeria is one of the countries where bitcoin is most widely known
    and used to circumvent regulatory problems and the inefficiencies of banking and
    its physical currency.


    About 35% of Nigerians used or owned bitcoin in early 2022.


    The Nigerian government expects its national digital currency or CBDC, the eNaira,
    to receive more attention after a reduction in cash available at ATMs takes effect
    in a country where bitcoin is gaining followers.'
