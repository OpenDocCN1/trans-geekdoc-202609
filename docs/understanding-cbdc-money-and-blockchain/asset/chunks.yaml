- raw: 'For example, if a stock''s beta index is 1.5, it means that if the market
    goes up 1%, the stock will go up 1.5%, and if the market goes down 1%, the stock
    will go down 1.5%.


    In this way, the beta index serves to measure the relative risk of an asset compared
    to the behavior of other similar assets within the same market.


    **BIS (Bank for International Settlements).**


    The Bank for International Settlements (BIS) is an international organization
    dedicated to promoting monetary and financial cooperation among central banks
    and other monetary authorities. Founded in 1930 and headquartered in Basel, Switzerland,
    the BIS is the central bank of central banks and serves as a forum for discussion
    and coordination on issues related to global financial stability.


    The BIS focuses on three main areas of work: economic research and analysis, international
    monetary and financial cooperation, and services to central banks and other monetary
    authorities


    **Bitcoin.**


    Bitcoin is a decentralized, intermediary-free digital currency.


    It allows online payments to be sent directly between parties without going through
    a financial institution.


    It is based on a network of computers that verify and record transactions in a
    public ledger called a blockchain.


    Bitcoin can be sent and received over the Internet without the need to trust any
    entity or authority.


    Its issuance is limited to 21 million units, of which 19 million have been issued,
    and the rest will be issued in a decreasing mode until the 21 million are completed
    around the year 2140.


    **Blockchain.**


    Usually used to refer to the Bitcoin ledger.


    Blockchain is a database technology that enables the creation and management of
    a digital ledger in which transactions involving a currency or asset are recorded
    and verified.


    Each transaction is grouped into a block that is cryptographically linked to the
    previous block, forming a blockchain.


    This blockchain is shared and updated by all network participants without the
    need for a central authority.


    Blockchain guarantees security through decentralization in multiple nodes, distribution
    of the database in multiple locations, as well as transparency, traceability and
    immutability of operations, since data is encrypted and cannot be modified or
    deleted.


    **Bond.**


    A bond is a type of loan that a person makes to a company or government. The issuer
    of the bond undertakes to repay the money borrowed within a specified period of
    time, plus interest, which may be fixed or variable according to a predetermined
    rate.


    In financial terms, a bond can also be called a debt security, debt financial
    asset or fixed income instrument, since its formalization establishes an interest
    rate that the issuer will pay to the investor.


    There are short-, medium- and long-term bonds, months, 1 year, 5, 10, 30 years.


    During the period or duration of a bond, especially medium- and long-term bonds,
    they can be traded in the secondary market.


    For example, if an investor buys a 10-year government bond paying 4% interest
    annually, the investor will receive 4% each year from the issuer, and at the end
    of the term or maturity, the issuer will return the last year''s interest plus
    the total (or nominal) amount of the bond.


    But if the investor wants to get his investment back before the bond matures,
    he can sell it to another investor, in the secondary market.


    The price of a bond in the secondary market depends on several factors, including
    the financial condition of the issuer, prevailing interest rates, and supply and
    demand.


    **Broker.**


    A broker is an intermediary who is responsible for executing orders to buy and
    sell financial assets placed with him by his clients. The broker may be an individual
    or a firm.


    The broker charges a commission for each transaction it executes on behalf of
    its clients, whether buying or selling, and must comply with a number of legal
    and regulatory requirements in order to conduct its business.


    Stock brokers operate only in the stock market, but a broker may operate in other
    financial markets, such as foreign exchange, commodities or cryptocurrencies.


    **Call / Purchase Option.**


    A call is a contract that gives the buyer the right to buy an asset at a fixed
    price in the future.


    For this right, the buyer pays an amount called a premium to the seller of the
    option.


    The seller is obligated to sell the asset if the buyer exercises the option.


    **Cartel.**


    An agreement, illegal in most jurisdictions, among several similar companies to
    avoid competition with each other and to regulate production, sales and prices
    in a particular geographic or commercial area.


    **Cash Flow**.


    Cash flow is the difference between a company''s income and expenses in a given
    period.


    More simply, it is the ability of a company to generate cash after paying expenses
    in a specified period.


    Cash flow shows the company''s ability to generate cash and pay its obligations.


    **CBDC.**


    Central Bank Digital Currency.


    A type of fiat currency equivalent to physical cash such as banknotes and coins,
    but in digital format, similar to cryptocurrencies, but centralized. Like its
    physical cash equivalent, as a fiat currency it is not backed by anything other
    than legal tender. See the term: fiat


    **Central Bank.**


    The central bank is the institution that issues and manages legal tender and performs
    the function of banker to the commercial banks.


    It also controls the monetary system, by controlling the issue of money, and the
    credit system, by controlling interest rates.


    In mixed economies or those with heavy government intervention, it also controls
    the foreign exchange market, controlling the exchange rate with other foreign
    currencies.


    In an ideal capitalist system, the exchange rate between currencies should fluctuate
    freely according to the supply and demand of each currency.


    However, there are agreements between central banks called currency swaps\*, which
    consist of a temporary exchange of currencies between two central banks with a
    commitment to return them at a future date and at a fixed exchange rate.


    There is also a tacit agreement between the main central banks to guarantee convertibility
    between a small group of currencies called convertible currencies.


    These are: the Euro, the US Dollar, the Pound Sterling, the Japanese Yen and the
    Swiss Franc.


    It is common for the central banks of these currencies to act in concert in the
    event of international exchange rate tensions to avoid too sharp fluctuations,
    buying or selling currencies as a group to alleviate specific problems.


    The main functions of a central bank are, to act as the bank of the state, and
    control the issue of currency.


    Receive deposits from commercial banks and make loans to commercial banks and
    governments.


    To manage monetary policy and control a country''s inflation.


    They are also responsible for making currency transfers with other countries in
    the world and regulating and auditing the activities of commercial banks in their
    area.


    **CFTC**


    Commodity Futures Trading Commission (CFTC).


    A U.S. agency that oversees and regulates the trading of futures and options contracts
    on commodities, raw materials, currencies, indices and other assets such as derivatives,
    futures, options and swaps.


    **Commodity.**


    In the plural, commodities are those generic or basic products that vary little
    in price, appearance, or use, such as raw materials like oil, timber, grain, or
    precious metals.


    They are tangible materials that can be traded, bought, or sold without further
    processing.


    **Creditor / Debtor.**


    These are the two parties to a financial transaction.


    A creditor is the one who has the right to claim a debt from his debtor.


    A debtor is one who has the obligation to pay a debt to its creditor.


    **Crypto-asset**'
