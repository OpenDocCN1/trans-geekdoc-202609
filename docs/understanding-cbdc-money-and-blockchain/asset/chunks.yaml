- raw: 'Finally, on Monday, March 20, before the opening of the markets in the West,
    the purchase of Credit Suisse by its competitor UBS, for about 3 billion, with
    the support, if necessary, and the author fears it will be necessary, of 100 billion,
    which would be provided by the Swiss National Bank, known by its acronym SNB,
    is announced.


    In anticipation of 10,000 layoffs, UBS is taking over about 5 billion of Credit
    Suisse''s known losses and valuing the bonds issued by Credit Suisse at zero.


    This will result in terrible losses for its investors, especially the Saudi National
    Bank, whose investment portfolio has literally propped up Credit Suisse for at
    least the last few years.


    It may be history by the time you read this book, or rather the beginning of a
    new story of the failure of the international monetary and financial system.


    Reference: Swiss National Bank posts record $143 billion loss ([cnbc.com](http://cnbc.com))


    The 2022 loss means the central bank will not make its usual payout to Switzerland''s
    central and regional governments.


    Last year, the SNB paid out 6 billion francs.


    The purchase of Credit Suisse by UBS and the support of the Swiss National Bank
    may initially be enough for the combined entity to meet its short-term obligations,
    but it will certainly not be enough to restore the confidence of clients and depositors.


    As we have said before, banks are by definition insolvent companies, their assets
    are for the medium and long term, but their obligations to their creditors could
    be immediate in the event of a lack of confidence and panic.


    Let''s take a look at these data published by Mises Institute on its website:
    [https://mises.org](https://mises.org)


    Reference: Central Banks: Profligacy in Lockstep.


    [https://mises.org/wire/central-banks-profligacy-lockstep](https://mises.org/wire/central-banks-profligacy-lockstep)


    **Numbers to get your attention!**


    *The Swiss National Bank’s (SNB) financial statements for the* nine months ending
    September 30, 2022, show a bottom-line loss of US$150 billion.


    Still, the SNB has a capital ratio, *a bank’s equity to its total* assets, over
    6%.


    *In contrast, the Federal Reserve’s reported capital ratio,* which does not *reflect
    the Fed’s massive mark*\-to-market losses, is 0.5%. The Federal Reserve Bank of
    New York, by far the largest of the Federal Reserve Banks, has a reported capital
    ratio of 0.3%, again not counting its market value losses.


    The Reserve Bank of Australia announced in September that losses on its investments
    caused its capital to drop to a negative $8 billion on June 30.


    *The Bank of England joined “the club of major central banks showing negative
    net worth” if its investments are marked*\-to-market, *Grant’s Interest Rate Observer*
    reported. Thus far, the Bank has lost $230 billion on its bond investments, 33
    *times the Bank’s capital of $7 billion as of February 2022, its* fiscal year-end.


    Fortunately for the Bank, it has an indemnity from His *Majesty’s Treasury, that
    is, the taxpayers, to cover the losses.* The Bank of Canada carries most of its
    investments at market value, and its financial statements reflect market value
    losses of $26 billion as of November 2022


    Our monetary system is based on fiat currency, which is essentially debt created
    out of thin air.


    This system has led to a situation where there is always more debt than actual
    money in circulation, making it inherently unstable and prone to collapse.


    Furthermore, our economy relies heavily on a banking system that is inherently
    insolvent and is kept afloat only by waning public confidence.


    This leaves us vulnerable to financial crises and underscores the need for systemic
    reform to ensure greater long-term stability and sustainability.


    The geopolitical shift from unipolar, led by the United States and its dollar,
    to multipolar, where the majority of the world''s population no longer trusts
    the dollar and is building a new international trade currency backed by commodities
    and tangible goods, seems to indicate that we are accelerating toward a monetary
    reset.


    And this makes me fear that the "final solution" will be the introduction of CBDCs,
    a dystopian system in which your money, your savings and your assets will no longer
    belong to you.


    You will only be allowed to use them according to the impositions of central bankers
    and political power.


    ### **Alternatives.**


    Gary Gensler, currently the 2023 Chairman of the Securities and Exchange Commission
    (SEC), the official regulator of the securities market in the United States, has
    publicly stated on several occasions that in his opinion all cryptocurrencies
    except Bitcoin are securities, an opinion with which this author fully agrees.


    In order to determine what is a market value, the Howey test is used.


    The Howey test refers to U.S. Supreme Court case law used to determine whether
    a transaction can be considered an "investment contract" and therefore a security
    that should be subject to the disclosure and registration requirements of the
    Securities Act of 1933 and the Securities Exchange Act of 1934.


    To this end, the U.S. Supreme Court has established four criteria for determining
    whether an investment contract exists.


    An investment contract requires:


    An investment of money.


    In a common enterprise.


    With an expectation of profit.


    Derived from the efforts of others.


    In June 2018, former SEC Chairman Jay Clayton specifically clarified that bitcoin
    is not a security.


    *“These are replacements for sovereign currencies, replace* the dollar, the euro,
    the yen with bitcoin," Clayton said. "That type of currency is not a security."


    Reference:


    SEC Chairman Clayton says agency won’t change definition of a security ([cnbc.com](http://cnbc.com))


    Bitcoin has never sought public funding, i.e. from any company, to develop its
    technology, and it does not pass the Howey test used by the SEC to classify securities.


    All other cryptocurrencies, also known as altcoins ("alt" for alternatives to
    bitcoin), may have some value depending on their usefulness in efficiently solving
    some purpose, and all of them, except bitcoin, have an organization or company
    behind them.


    All altcoins meet the criteria of the Howey test.


    Therefore, we can be sure that it is only a matter of time before U.S. regulators
    take legal action against all cryptocurrencies; all except bitcoin.


    Bitcoin is really in the same category as a commodity\*, i.e. a good, product
    or raw material, such as gold.


    Bitcoin could solve all monetary problems, including inflation, lack of trust
    between parties to be used in international trade, and the growth since its creation
    in 2009 is astounding.


    Unlike fiat money, which is created as debt, every unit of euro, dollar or yen
    we own is someone''s debt, bitcoin is no one''s debt.


    Bitcoin has a finite, limited and public-known issuance of 21 million units, of
    which 19 million have already been mined.


    Its value against some fiat currencies may still be extremely volatile in the
    short to medium term, but as the New York Fed''s publication acknowledges. Paper
    NO. 1052 of February 2023\. mentioned above, it has an average annual growth rate
    over the entire sample (last 10 years) of 220% per year due to its recent decline
    (in 2021).


    Since its launch, Bitcoin has suffered all kinds of cyber-attacks on its network
    of nodes, media attacks and regulatory attacks, by governments and economic authorities,
    nothing has been able to stop its blockchain.


    On February 10, 2011, it reached the price of 1 dollar, today, March 2023, it
    exceeds 28,000 dollars per unit.


    Bitcoin''s massive decentralization makes it unstoppable, censorship-resistant,
    unconfiscable and its transactions immutable.


    Bitcoin allows transactions between two parties without the need for mutual trust
    and without any intermediary or central authority, and has been operating without
    interruption since its inception in 2009.'
