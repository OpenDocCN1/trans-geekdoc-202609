    `Amazon Web Services`, `Google Cloud`, `Microsoft Azure`, which have already outsourced
    practically the entire public and even military digital infrastructure of some
    countries.


    ¿What would happen in the event of a crash of these services, a hacking or even
    a hostile action in the context of a hybrid or cyber war?


    We should keep in mind that when our data is "stored" in a centralized computer
    storage system, it is no longer ours, but the property and under the control of
    the administrator of the computer system that stores it.


    Understanding this concept is extremely important. It is identical to digital
    money.


    When our data is stored in a computer system as a record of information, it is
    very vulnerable because the information can be easily altered or deleted, unlike
    a physical document in our custody.


    The data you wish to associate with this European Digital Identity is highly sensitive
    and is currently specifically protected by privacy laws that should, in theory,
    ensure that it is used only with our knowledge and consent, and only when necessary.


    If your personal information and medical records are stored in a computer system,
    this information may be accessed without our knowledge and consent.


    This information may be altered or deleted, in whole or in part, without us being
    able to do anything about it.


    Access, rectification or deletion of some of our data could be conditioned or
    restricted by the real owner of the data, the system administrator, under the
    orders of the government, not to mention the fact that being centralized, it will
    be vulnerable to hacker attacks.


    We prefer to think that these things will not happen, but the truth is that they
    have happened in the past and will happen again.


    ### Spain. November 11, 2022.


    #### A hack through the Judiciary steals data of half a million taxpayers from
    the Treasury.

    The Treasury has been hacked: a dangerous cyberattack steals the data of more
    than half a million Spaniards - [Crast.net](http://Crast.net)

    The information services speak of an unprecedented data leak that includes the
    name, ID or address of some 50,000 members of the National Police Corps.


    #### November 21, 2022.

    Hackers hack into the Spanish Ministry of Economy

    Spain''s Ministry of Labor and Social Economy hit by cyberattack ([bleepingcomputer.com](http://bleepingcomputer.com))

    Last Monday, a public employee saw them remotely accessing the network with all
    the economic information of Spain: the police are secretly investigating.

    The cyber-attack on the `CGPJ` stole the data of all taxpayers.

    These computer attacks were later denied by the government in a short communiqué
    without providing any additional information.

    "All of the Ministry''s cybersecurity systems are active and under constant monitoring.
    There is no such thing as zero risk, and extreme caution must be exercised in
    the face of Internet risks."


    We would like to point out that a well-developed and implemented `CBDC` system
    could be very efficient for the settlement of all types of transactions in the
    financial markets, which will most likely be managed by means of tokenized assets
    registered in a `blockchain`.


    As mentioned above, many IT experts predict that the blockchain revolution will
    forever change all the mechanisms of financial markets.


    Stocks or securities, ETFs or shares, call or put options, bonds, trusts, loans,
    property titles, all, absolutely all financial assets will be represented in digital
    tokens and managed in one or more `Blockchains`. Each token will be associated
    with a digital identity, and all types of assets can be managed from an app on
    your computer or smartphone.


    In this scenario, payments and receipts or monetary settlements of any transaction
    could be efficiently handled by a `CBDC` system.


    It is very likely that two types of `CBDC` will be implemented: `Wholesale`, for
    the exclusive use of governments, banks, financial institutions and corporations,
    and `Retail`, for the private use of citizens.


    # CHAPTER 7.

    ## Potential benefits in safety and economy.


    As mentioned above, the `bitcoin` blockchain does not stand out for its efficiency
    or speed, because what it seeks is absolute security. The 10-minute period between
    blocks is necessary for a large number of nodes to validate each transaction.
    This is not a flaw, it is an inherent feature of its design, but it makes it of
    little use for managing fast transactions such as those required in commerce,
    unless the second-layer protocol `Lightning Network` is used.


    In contrast, a blockchain with only a few nodes or a centralized database will
    serve a large number of transactions, as credit or debit card payment systems
    do today.


    A centralized `CBDC` should be suitable for ultra-fast transactions, which could
    also be used to settle financial products that today rely on private interbank
    payment and settlement systems.


    Which, once again, suggests that banks, at least as we know them today, will be
    completely useless and dispensable.


    The `mBridge` project of the International Bank for Settlements will be the bridge
    that will make `CBDCs` globally interoperable, and with it, foreseeably, centralized
    global control.


    A centralized, traceable and monitored digital money will make many of the common
    crimes very difficult; any theft will be virtually impossible, as the stolen funds
    will necessarily move from one wallet to another, all perfectly identified and
    geolocated.


    Criminals will really have to find a new way to "liquidate" their illegal operations.


    Full tracking by the authorities would allow detection of any fraudulent or corrupt
    activity, as long as the ledger of transactions could be publicly audited, technology
    will allow it, political power may not allow it.


    Not only individuals, but also companies and public institutions would have a
    wallet and all their transactions would be traceable, it would be nice to think
    that in this way any diversion of funds could be effectively combated and those
    responsible could be identified.

