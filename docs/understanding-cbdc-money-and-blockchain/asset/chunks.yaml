  trans: '


    尼日利亚中央银行（CBN）最近的一份新闻稿详细说明，截至 2023 年 1 月 9 日，该国 ATM 机每日取款限额将为 20,000 奈拉，约合 45 美元。


    尼日利亚。尼日利亚中央银行将现金取现金额限制在每天最高 42 欧元，试图通过使用其数字货币来促进电子交易。全球范围内强制使用央行控制的数字货币（`CBDC`）的趋势是否会危及我们的自由？


    ## 参考：


    尼日利亚想要强制使用其 `CBDC` - 11Onze


    正如我们已经看到、也将来将在欧洲看到的那样，如果 `CBDC` 的实施和使用得不到接受或未能达到政府的时间表，强制阶段将开始，政治权力将拥有所有可用工具来施加任何必要的强制。


    在中国，人们过去倾向于服从政府全能的权力，这可能是由于将公共利益置于个人利益之上的文化偏好（这使他们与西方文化有所不同），但接受率也令人失望。


    中国人民银行发布了一份财务统计报告，其中包含了过去 12 个月数字人民币（或 `CBDC`）的指标。


    根据这些数据，央行指出，截至 2022 年底，流通的数字人民币为 136.1 亿元（20 亿美元），同比增长 15.3%。


    尽管有这一增长，但仅占流通法币总额的 0.13%。《2022 年金融统计报告》指出，流通的数字人民币并未对数据产生任何“显著变化”。


    ## 参考：


    中国央行在货币流通报告中纳入数字人民币 ([cointelegraph.com](http://cointelegraph.com))


    数字人民币使用率低下的原因主要是因为数字手机支付已经通过流行的支付应用在中国大规模实施，这些应用包括电子领域巨头阿里巴巴旗下的 `AliPay`（支付宝）以及中国最流行的即时通讯应用
    `WeChat`（微信）。


    这些应用程序如此受欢迎且广泛使用，以至于它们实际上已成为首选支付方式。正如我在第一章中提到的，当涉及到实施 `CBDC` 货币时，用户会提出的第一个问题是：“`CBDCs`
    与我已经使用的电子系统相比，能给我什么优势？”


    出于这一原因，而且由于这些公司通过提供手机快速贷款进入金融市场而实际上并非银行，中国政府决定采取严格措施遏制它们的业务活动。


    这些中国科技巨头拥有优势，因为它们拥有客户的所有信息，因此可以对客户进行信用风险评估，并可以使用用户在支付应用中存入的资金通过著名的部分准备金法来发放贷款。


    银行仅来自 `WeChat` 就会面临激烈的竞争，因为它在中国有 9 亿日活跃用户，全球范围内有 12 亿用户。


    2020 年 11 月，阿里巴巴拥有的 `Ant Financial`（蚂蚁金服）原计划上海上市，这本将是历史上规模最大的 IPO，但其上市许可被撤销了。


    它似乎最早 2023 年就可以重新申请这一最大的 IPO（即公司在证券交易所开始出售股票的正式、受监管流程）。


    大型科技公司长期以来一直想要（文本在此继续，对剩余段落也应用了类似的格式逻辑）。


    *（注：提供的文本包含许多重复和碎片化的句子；已根据要求对提供的内容应用了格式规则，同时保持了核心信息不变。）*


    '
