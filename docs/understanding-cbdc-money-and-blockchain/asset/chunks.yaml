- raw: 'Fintech companies have emerged as an alternative to traditional financial
    services and have been able to provide more efficient and cost-effective cross-border
    services than banks.


    **Fixed Income / Variable Income. (Equities).**


    Fixed income is a type of investment that includes all financial assets where
    the issuer is obligated to make payments in a predetermined amount and period
    of time. In other words, the issuer guarantees the return of the invested capital
    and a certain predetermined profitability.


    Fixed income securities can be sold on the secondary market without waiting for
    them to mature, but supply and demand affect their price. Therefore, a fixed income
    security has a "fixed" return only if the security is held to maturity.


    An example of a fixed income investment is bonds or debt securities issued by
    governments or corporations to finance their activities.


    Variable income is a type of investment that consists of buying financial assets
    whose profitability is not guaranteed or known in advance. Variable income implies
    a higher risk than fixed income, but it also offers the possibility of higher
    profits if the value of the assets increases in the market. The main equity instruments
    are stocks or equity securities.


    **Forex.**


    Also, FX, is an abbreviation for Foreign Exchange. Foreign exchange takes place
    when one country''s currency is exchanged for another country''s currency. Forex
    is the largest financial market in the world, trading some $5 trillion daily.


    **GDP (Gross Domestic Product.)**


    Gross domestic product is the value of all final goods and services produced in
    a country or region during a period of time, usually 1 year.


    **Government (Public) Debt.**


    Public debt, or sovereign debt, is the total amount of debt owed by a government
    to individuals, institutions or other governments.


    A way of obtaining financial resources by states that spend more than they take
    in. Usually by issuing securities or bonds.


    **High Yield Bond.**


    Also known as junk bonds. A high yield bond is a fixed income bond that offers
    a high rate of return but with a high risk of default.


    The offer of high-yield bonds is due to the risk that the issuer may not be able
    to pay the interest or the principal when the bond matures or the interest is
    due.


    The issuers of these bonds are companies or governments with low credit ratings,
    below investment grade.


    However, a good credit rating is no guarantee of the issuer''s solvency


    **Inflation.**


    The loss of purchasing power of money.


    Inflation is not the general increase in prices.


    The generalized rise in prices is the result, not the cause, and is always a monetary
    event driven by the issuance of money.


    The more money in circulation for the same quantity of goods or services, the
    lower the value of money, so more money is needed to buy the same goods or services.


    **Initial Public Offer.**


    An Initial Public Offer (IPO) is the selling of securities to the public in the
    primary market. It is the largest source of funds with long or indefinite maturity
    for the company.


    The initial public offering (IPO) of a company''s shares is a process that is
    regulated by law and subject to the scrutiny of the relevant financial authorities.


    **Interest / Negative Interest.**


    In economics and finance, interest is the additional amount paid or charged for
    the use of borrowed or invested money over a given period of time. It is essentially
    the cost of using money and is usually expressed as a percentage of the amount
    borrowed or invested.


    Negative interest: A euphemistic term used to describe an anomalous and aberrant
    situation in which borrowers (who have borrowed money) charge lenders (who make
    the loan) interest for the use of the borrowed money instead of paying interest
    on the loan.


    This means that the lender receives less money than originally lent, instead of
    receiving the principal plus an additional amount as interest.


    Negative interest rates are very bad for savers, who lose money instead of earning
    interest on their savings. It is also detrimental to financial institutions, which
    rely on interest income to keep their businesses profitable. In general, negative
    interest rates are an anomalous phenomenon and are generally considered a last
    resort in economic policy.


    The European Central Bank (ECB) has maintained negative interest rates since June
    2014, when it lowered its deposit rate to - 0.10%. It then cut the deposit rate
    further to -0.50% in September 2019, and kept it negative until July 2022.


    **Interest Rates (from a Central Bank)**


    A central bank''s interest rate is an important monetary policy tool. If a central
    bank wants to stimulate economic growth, it can lower the interest rate, which
    makes borrowing cheaper and encourages spending and investment.


    If the central bank wants to cool the economy and control inflation, it can raise
    the interest rate, which makes borrowing more expensive and discourages spending
    and investment, and by restricting credit it slows the creation of money generated
    by commercial bank credit.


    This process is discussed in Chapter 2.


    Central bank interest rates also affect the value of the national currency. When
    a central bank raises its interest rate, it makes its currency more attractive
    to foreign investors because they can earn a higher return on their investments
    in that currency.


    When commercial banks deposit with their central bank the money they have not
    yet lent to their customers, the central bank pays them the interest rate set
    by the central bank.


    The interest rates set by central banks, not by the market, are the base price
    of money that affects all other interest rates.


    Por For example, mortgage interest rates are based on the EURIBOR interbank rate,
    which in turn is based on the European Central Bank''s base rate.


    To give an example:


    If the European Central Bank sets a rate of 3%, the banks will set a higher rate,
    let''s say 4%, which is their profit, when they lend to other banks, which is
    set by Euribor, and the mortgages will again have the interest rate set by Euribor
    plus the difference, which is the bank''s profit. Continuing with the example,
    it could be 5%.


    If the central bank lowers interest rates to 2%, the Euribor would probably follow
    this fall to 3% and the variable rate mortgages would fall to 4%.


    In this way, the interest rates set by the central banks are the base price on
    which the market then sets all other interest rates applied in the financial market.


    **Investment Fund.**


    A form of investment that pools money from several investors to invest in financial
    assets such as stocks, bonds, real estate, or other securities with the goal of
    earning a profit.


    Mutual funds are managed by professional managers who make investment decisions
    on behalf of investors.


    When an investor invests in a fund, he or she buys a pro rata share of the fund.
    Each share has a net asset value, which is calculated daily based on the value
    of the fund''s underlying assets. At the end of each liquidation period, the fund''s
    gains or losses are shared proportionately among the investors.


    **ISIN (Code)**


    The ISIN code (International Securities Identification Number) is developed in
    the international standard ISO 6166 and is used to identify securities. It is
    a code that uniquely identifies a security on an international level and is used
    by all financial markets worldwide that have incorporated it into their settlement
    and custody processes.


    **Leverage.**


    A system of financing the purchase of assets with borrowed money. For example,
    an investor may invest his capital in a financial asset, but add to his capital
    an amount borrowed from a company.'
