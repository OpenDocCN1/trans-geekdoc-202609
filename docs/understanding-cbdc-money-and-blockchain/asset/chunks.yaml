  trans: '

    然而，在其中一家新的“数字银行”开户是容易的。数字银行是完全在线运营的金融机构，没有实体办公室，提供如活期账户、银行卡、汇款和加密货币等有限服务，但不提供大型传统银行的典型服务，如投资组合、消费贷款甚至更少的抵押贷款，也就是说，它们并没有真正与传统银行的大部分业务竞争。这些银行在进行大额交易时往往会有限制或规定，这对于其用户可能非常方便，但实际上，它们试图限制资本的自由流动。


    起初，当这些银行流行时，它们提供其原国的银行账号（在`EU`中称为 `IBANs`），例如英国、`Germany`、某些波罗的海的海共和国等，但每个国家的主要服务提供商开始在处理电话、水费、能源等服务的账单时，对直接扣款至外国
    `IBAN` 账户的操作制造问题，即使他们拥有欧洲的 `IBANs`。这再次违反了 `EU` 内部资本和服务的自由流动原则，但迫使这些银行在每个国家设立“法律”分支，为每个
    `EU` 国家提供其自身的 `IBAN`。


    这种变化有几个目标，首先是提高其服务对每个国家客户的实用性，但事实上，它隐藏了诸如西班牙的 `IBAN` 账户尽管由 `German` 银行提供，但实际上由西班牙中央银行控制，也就是说，这实际上是为了维持对资金的国家控制，确保它们不会与各国大型传统银行的大部分业务（如信贷市场）竞争。


    这种操作实际上隐藏了银行之间的秘密协议，或者我们可以称之为一种银行卡特尔，即公司之间为了避免相互竞争的协议，在这种情况下是针对银行服务。


    当然，公司之间避免竞争的协议也是非法的，并违反了另一个 `EU` 原则，例如自由竞争原则。


    然而，`CBDCs` 可能会以破坏性的方式彻底永久地改变客户、银行、国家和货币之间的关系，这种变化我们只能通过对其可能产生的新可能性和不便进行想象练习来猜测。


    从货币以电子形式发行的那一刻起，边界就不复存在了，它的将在全球范围内成为“标准”。


    虽然国际银行卡特尔不愿在其领域允许自由竞争，但 `CBDC` 电子货币发行者显然会支持外国公民购买和使用他们的新数字货币，这将导致大量外汇流入任何 `CBDC`
    发行国中央银行的资金中。


    自从 `China` 启动了 `Digital Yuan`（目前已在使用或处于非常先进的测试阶段）以来，一直有推测它将被用作“经济武器”来获得全球货币霸权，以取代国际贸易中的
    `dollar`，这除了加速世界上所有央行创建和开发数字货币的过程之外，其明确意是促进其数字货币的国际使用。


    世界储备货币的控制和发行权赋予了发行国一种优越的特权，同时也带来了一些细微的不便。


    `United States` 最大的力量不是其庞大的军队，而是其通过 `dollar` 控制经济和国际贸易的巨大力量。


    不深入探讨这个主题（这足够写另一本书了），所有 `CBDC` 数字货币发行者都将希望他们的数字货币被尽可能多想要并能够支付获取费用的用户购买和使用。


    让我们考虑可能的情景。


    `Chinese yuan` 转化为国际货币是“维持世界和平的必要条件”。`Tsinghua University`（北京）金融学院院长教授 `Ju Jiandong`
    在 2 月 28 日发表于中国官方报《环球时报》（参考 `Global Times`）的文章中这样说。


    `Ju Jiandong` 教授指出：考虑到 `China` 的经济增长，美国可能会发动战争来保护美元”。正如我们所看到的，“货币战”并不那么可能，它已经宣布了。


    `China` 将最终向世界所有公民开放其 `digital yuan`，很容易想象，所有新兴国家的公民——他们被迫使用本国货币，并在历史上一直遭受通胀模式下财富的永久没收——会立即倾向于开始用
    `digital yuan` 进行买、卖和储蓄。


    让我们考虑一下 `Africa`、`Asia` 或拉丁美洲欠发达国家的地理情景，如果你是 `Liberia`、`Ghana`、`Ecuador`、`Nicaragua`、`Argentina`、`Turkey`、`Lebanon`
    的公民……名单将是巨大的。你倾向于使用哪种货币？是从收到那一刻起就被通胀偷走价值的本地货币，还是倾向于储存在一种能够保持价值的强货币中？


    在本书写作的 2023 年初，`Argentines` 遭受的年通胀率已达到约 100%，这种情况在某些国家更糟，在另一些国家较好，这是常态；如果我们排除拥有
    `US dollar`、`Euro`、`British pound`、`Japanese yen`、`Chinese yuan` 等可兑换货币的发达国家，本地货币变成了财富永久没收的机器。


    事实上，这种没收也发生在发达国家，只是过程较慢，除非现在这种时期，即政府方便地“捏造”的通胀数据在 `Europe` 已经达到了双位数。


    一个 `Argentine` 工人如何为退休储下一笔金额的钱，或者仅仅是为了不可预见的开支？


    一旦 `United States` 开始向外国公民发行其 `Digital Dollars`，并且无疑会被强烈鼓励这样做，以限制 `Digital Yuan`
    在全球范围内，每个 `Argentine` 工人都立即将其月工资 `Argentine Pesos` 转换为 `Digital Dollars`，从而较好地保护其劳动价值。


    `Argentine` 工人很快会发现社区里的面包店、超市和加油站都在这样做，他会同意直接用 `Digital Dollars` 支付面包、杂货或汽油，而无需将其换回
    `Argentine Pesos`。


    通过这个虽然是想象的但极可能的例子，我们可以预见到一种情景：强大的 `CBDC` 货币可能真的导致弱势国家货币的“大灭绝”。


    `Argentine` 政府能够阻止其公民使用 `digital dollar` 来损害 `Argentine peso` 吗？


    大量使用 `digital dollar` 将导致 `Argentine peso` 变得无不足道。


    由于所有弱货币国家 `CBDC` 数字货币的冲击，我们可以预期哪些政治变化？


    无疑将出现全球性的货币战争，这种战争一直存在，但被物理货币、边界和银行放缓了或者说隐藏了。


    世界上一直存在避税港以及利用其发达金融业为富裕客户提供离岸金融服务（包括合法和非法的）的国家，这种做法最好的例子无疑是 `UK`，还有 `Switzerland`、`Netherlands`、`Ireland`、`Luxembourg`
    等国家。


    这些国家中的一些，以 `Switzerland` 为例，可能非常有兴趣为其数字货币的外国用户提供金融服务和法律保障。

    '
