  trans: '

    绝对监控只是第一步。通过各种方式获取的信息（主要是关于我们资金的使用、来源和去向），将行使控制权力的将是政府，而不是这种数字货币的发行者——在欧洲，这将是
    `ECB`。


    政府不仅能够看到我们数字钱包的每一笔活动，还拥有法律权力冻结、没收、征收当前和未来的税收、扣留某些资金、撤销交易，并有效且立即对不遵守任何规章的行为收取罚款；他们还可以对收到的资金设置过期日期，以促进消费和经济活动为借口阻止或限制储蓄，并根据任意的标准（“始终为了我们的健康”）或根据我们的碳足迹（“为了拯救地球”）对产品实施消费限制。


    他们还可以根据每个公民的社会评分，根据中国已经存在的名为“社会信用”的服从指数，对他们的资金收取“负利率”。


    “负利率”是储蓄税的委婉说法；与其通过对储蓄存款提供一定利率来奖励储蓄者，不如通过惩罚来鼓励消费并刺激经济。


    当然，在所谓的“民主”国家，这个术语将变为一个更友好的名称，即对 `ESG` 标准的遵守指数。


    `ESG` 缩写代表环境、社会治理因素，世界经济论坛利用这些因素来评估公司和个人的影响和责任。


    这些标准越来越多地被强制公司遵守世界经济论坛发布的 `2030 议程`，否则如果不符合这些因素，资产管理巨头将不会提供投资。


    美国多个州已禁止其各自公共和州养老基金投资于寻求实施这些 `ESG` 标准的资产管理基金，因为这些标准已被证明对投资者的利益是适得其反的。


    19 个州的州检察长写信给 `Black Rock Company` 首席执行官劳伦斯·D·芬克，警告称 `BlackRock''s` `ESG` 投资政策可能是对“单一利益原则”的“肆意侵犯”，这项法律原则要求投资受托人的行为必须是“为了财务回报最大化，而不是促进社会或政治目标”。


    ### 参考文献


    - `ESG` 投资成为美国政治的争议焦点 - CNA (`channelnewsasia.com`)

    - 保守团体将反 `ESG` 运动推向新高度 (`axios.com`)


    利用金融和经济胁迫已成为一种政治武器，但历史经验表明，当经济由政治因素而非经济因素驱动时，总是以灾难告终。


    `CBDC` 数字货币的另一种用途可能是对任何被指定为敌对的产品、品牌、公司或国家实施“制裁”，通过通过一份一份政府认为“受制裁”的个人、公司或国家名单来阻止交易。我们必须理解，“制裁”这个委婉的词汇实际上意味着“抵制”。


    阻止任何在你政府认为适当的地理区域之外的交易将特别容易，从而根据你被授予的移动权限，将公民限制在你的邮政编码、城市、地区或国家。


    ### 15 分钟城市


    “15 分钟城市”的新概念已经作为奥弗顿窗口（Overton''s time window）的第一步出现。在这些城市或社区中，普通市民可以在步行或骑自行车不超过
    15 分钟的情况下满足所有需求，那里普通的汽车将成为奢侈品，从而节省能量以帮助“拯救地球”。


    15 分钟城市的奥弗顿窗口可以像这样实施：


    #### 第一年，即 2023 年。

    虚假信息大众媒体会告诉你，如果你能在社区内满足所有需求，那么通勤时间不超过 15 分钟对地球将有多好处。


    #### 第二年。

    为了拯救地球，将收取一小笔费用，当你的手机或汽车被检测到位于家 15 分钟覆盖范围之外时，该费用会自动从你的 `CBDC` 钱包中扣除。


    在西班牙，道路上已经开始安装自动车辆识别系统以支付新的道路税或通行费，正如葡萄牙在 2008 年危机后几年所做的那样，增加税收以涵盖无限的公共赤字，顺便对控制私人和职业旅行很有用。


    请记住，欧盟新的强制安全设备（包含在每辆车必须携带的应急灯中）将包含一个 `SIM card`，以便在事故或碰撞时自动传输定位数据。当然，交通部门否认该系统将用于此类目的。


    这可能是绝对控制和地理定位的新“奥弗顿窗口”吗？


    如果你是步行，智能手机的默认定位将传输你的位置；如果你把手机留在家里，将是你的车辆传输你的位置。


    当你使用 `CBDC` 智能卡时，系统会记录使用的物理位置，这一地理记录可以用于监控和跟踪你的活动。


    下一次转折将是你自己的手机或汽车自动向当局发送超速报告，因为这些设备可以测量瞬时速度。我们可能认为这种方法有点像偏执，但技术上的可行性是存在的，当然，这是为了更大的出行安全。


    #### 第三年。

    由于政府预期的通勤次数减少未能实现，将有必要申请行政许可，并充分说明超出 15 分钟区域范围的每次出行的合理理由。


    如果你在区域外通过手机、汽车或使用你的 `CBDC` 钱包的行为被识别出来，你将因环境不当行为被自动缴纳生态罚款。罚款将随着每次违规而增加。


    最终，你的驾驶执照将被吊销，你的汽车（如果你还有的话）将为了地球的利益而被没收。


    这 true 由世界经济论坛自身的新教条推动的“15 分钟城市”提议其实并不新鲜，它被称为“开放监狱制度”（Open Prison Regime），尽管总会有时间将其转变为“封闭制度”，只需点击一下就足以禁用我们离开住所
    15 分钟以外的 `CBDC` 钱包。


    使用资金或购买某些产品的时间或日历限制也是可能的且易于实施的。


    欧盟负债最重的国家之间在经济财政法规以及公共赤字方面的差异，预见将导致货币和财政管理的困难，这最近被称为“欧洲碎片化风险”。


    因此，`CBDC` 控制的使用很容易被应用于在实践中创造出多年来一直在发生的情况，特别是在威胁欧洲联盟统一的希腊严重债务危机期间，即一种以“不同速度”运行的欧元——这又是一个委婉的表达，旨在根据需要将欧元（单一货币）划分为不同的货币，并辅以财政规则和资本管制，尽管这被《联盟条约》禁止，但将被政府或欧盟委员会轻松实施。

    '
