  trans: '


    最后，在 3 月 20 日周一，西方市场开盘前，宣布了其竞争对手瑞银将以约 30 亿美元的价格收购瑞信，并在必要时（作者担心这种支持是必须的）获得由瑞士国家银行（缩写为
    `SNB`）提供的 1000 亿美元支持。


    为了应对预期的 10,000 人裁员，瑞银将接手瑞信约 50 亿美元的已知亏损，并将瑞信发行的债券估值计为零。


    这将给其投资者带来巨大的损失，特别是沙沙特国家银行，其投资组合在过去的几年里从字面上来说一直支撑着瑞信。


    当你读到这本书时，这可能已经成为历史，或者说是国际货币和金融体系失败的一个新故事的开端。


    参考：瑞士国家银行公布创纪录 1430 亿美元损失 ([cnbc.com](http://cnbc.com))


    2022 年的亏损意味着央行将不再向瑞士中央和地区政府进行常规派付。


    去年，`SNB`支付了 60 亿法郎。


    瑞银对瑞信的收购以及瑞士国家银行的支持最初可能足以让合并后的实体满足短期债务，但绝对不足以恢复客户和存款人的信心。


    正如我们之前所说的，银行从定义上说就是资不抵的公司，其资产是长期的，但在缺乏信心和恐慌的情况下，它们对债权人的义务可能是即时的。


    这使我们容易受到金融危机的影响，并凸显了进行系统性改革以确保更大的长期稳定性和可持续性的必要性。


    让我们看看 Mises 学院在其网站上发布的这些数据：[`mises.org`](https://mises.org)


    参考：中央银行：步调一致的挥霍。


    [`mises.org/wire/central-banks-profligacy-lockstep`](https://mises.org/wire/central-banks-profligacy-lockstep)


    ## 引起关注的数字！


    瑞士国家银行（`SNB`）截至 2022 年 9 月 30 日的九个月财务报表显示，净亏损为 1500 亿美元。


    尽管如此，`SNB` 的资本充足率（银行权益与其总资产的比率）仍超过 6%。


    相比之下，联邦储备局报告的资本充足率为 0.5%，这并没有反映美联储巨大的按市值计值的亏损。作为联邦储备银行体系中规模最大的银行，纽约联邦储备银行报告的资本充足率为
    0.3%，同样未计入其市场价值损失。


    澳大利亚储备银行在 9 月份宣布，由于投资亏损，其资本在 6 月 30 日跌至负 80 亿美元。


    据 `Grant’s Interest Rate Observer` 报道，如果将其投资按市场价值计值，英格兰银行已加入“净值为负的大型央行俱乐部”。截至目前，该银行在债券投资上已亏损
    2,300 亿美元，是其 2022 年 2 月财年年底 70 亿美元资本的 33 倍。


    对于该银行来说，幸运的是它拥有英国财政部（即纳税人）的补偿来涵盖这些损失。加拿大银行按市场价值计入其大部分投资，其财务报表显示截至 2022 年 11 月的市场价值损失为
    260 亿加。


    ## 货币体系


    我们的货币体系基于法币，而法币本质上是凭空产生的债务。


    这种系统导致了流通中的实际货币总是少于债务的情况，使其具有内在的不稳定性并极易崩溃。


    此外，我们的经济严重依赖于一个本质上资不抵债的银行系统，该系统仅靠日益减少的公众信心维持运转。


    这使我们在面对金融危机时变得脆弱，并强调了进行系统性改革的必要性，以确保更大的长期稳定性和可持续性。


    地缘政治从美国及其美元为主的单极向多极转变——即世界上大多数人口不再信任美元，并正在建立由商品和实物支撑的新国际贸易货币——这似乎表明我们正在加速走向货币重置。


    这让我担心，“最终解决方案”将是引入 `CBDCs`，这是一个反乌托邦的系统，在这个系统中，你的钱、储蓄和资产将不再属于你。你将被允许根据央行和政治权力的规定来使用它们。


    ## 替代方案


    现任美国证券市场监管机构证券委员会（`SEC`）2023 年主席盖里·盖斯勒（Gary Gensler）已多次公开表示，在他看来，除比特币外，所有加密货币都是证券，作者完全同意这一观点。


    为了确定什么是市场价值，使用了 `Howey test`。


    `Howey test` 指美国最高法院的判例法，用于确定交易是否可以被视为“投资合同”，从而成为根据《1933 年证券法》和《1934 年证券交易法》接受披露和注册要求的证券。


    为此，美国最高法院建立了判定是否存在投资合同的四个标准。投资合同需要：


    1. 资金投资。

    2. 在共同企业中。

    3. 对利润有预期。

    4. 源于他人的努力。


    2018 年 6 月，前 `SEC` 主席杰·克莱顿（Jay Clayton）专门澄清了比特币不是证券。


    “这些是主权货币的替代品，用比特币取代美元、欧元和日元，”`Clayton`说，“那种货币不是证券。”


    参考：`SEC` 主席 `Clayton`表示机构不会改变证券的定义 ([cnbc.com](http://cnbc.com))


    比特币从未寻求过公共资金（即来自任何公司）来开发其技术，它没有通过`SEC`使用的 `Howey test`。


    所有其他加密货币（也称为 `altcoins`，“alt”代表比特币的替代方案）可能根据其在某些目的上的有效性而具有某些价值，而且除比特币外，它们背后都有一个组织或公司。


    所有 `altcoins` 都符合 `Howey test`。


    因此，我们可以确定，美国监管机构对所有加密货币（比特币除外）采取法律行动只是时间问题。


    比特币实际上与商品处于同一类别，即货物、产品或原材料，例如黄金。


