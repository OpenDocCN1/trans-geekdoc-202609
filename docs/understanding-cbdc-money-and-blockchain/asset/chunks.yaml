- raw: 'As Bitcoin insiders assure, if the user is not in control by holding his private
    keys from a self-custodial wallet application, and has his Bitcoin held by an
    intermediary, he will not really be the effective holder, and will be in the same
    case as having his fiat money in a bank, worse still, usually exchanges still
    operate today without a clear regulation, and are excluded from the financial
    system as being able to join a public or private deposit guarantee consortium,
    as bank accounts usually have.


    7\. Adoption.


    The adoption of CBDC is imposed by the government and central banks, while the
    adoption of Bitcoin is entirely voluntary and driven by the user community.


    Considering the advantages that a CBDC electronic currency would bring in terms
    of social and economic control, it would be unrealistic to think that the political
    power would desist from implementing CBDC because of the resistance of the citizens.


    In any case, they will use the well-known Overton''s Window\* system, which could
    well look like this:


    First, they will introduce it as a test, "guaranteeing" that it will not replace
    physical money, but will complement it. They will continue to make the current
    means of payment obsolete, soon the only way to receive any social aid will be
    in the form of digital money, they could continue to make it compulsory to pay
    all kinds of taxes in digital currency, at which point physical money will have
    practically disappeared from everyday life, and indeed, as is already happening
    today, if someone handles a relatively large amount in banknotes, he will immediately
    be suspected of handling illicit money.


    This excuse would be enough to interrupt the "guarantee" of the non-elimination
    of physical money, since this would obviously be the favorite of criminals and
    tax evaders.


    The question is not whether CBDC will be the only money in circulation, but when
    or how fast it will be implemented.


    This process, like all social control processes using the Overton Window\* methodology,
    will go completely unnoticed by the majority of the population; young people will
    not even remember what physical money is, or the need to carry some papers and
    a certain number of heavy coins to make small payments.


    The use of bitcoin as a digital money that is not controlled by governments, banks,
    or corporations is completely voluntary. The natural human preference for choice
    and resistance to the imposition of CBDCs could lead to social reactions that
    remain to be seen as bitcoin adoption continues to grow.


    We will explore this topic in depth in the final chapter, "Alternatives to CBDCs,"
    where we will examine the success of CBDCs in pioneering countries.


    ## **Chapter 5.**


    ## **Overview of the Underlying Technology and Blockchain.**


    Here we will analyze what a blockchain is: Blockchain, and why it is the preferred
    technology for managing bitcoin, money and digital assets, tokens or tokenized
    assets, and will almost certainly be the technical foundation for implementing
    CBDCs.


    We will only briefly discuss what a database is, the definition of which could
    be as follows:


    A database is an organized set of data stored and accessible in a computer system.
    This data can include text, images, numbers, and other types of information that
    are structured for easy access, use, and management.


    Databases are managed by a specific type of software called a database manager,
    either directly or by other applications that can access and query the stored
    data, and are used to perform tasks such as searching, querying, updating, and
    analyzing data.


    There are many types of databases, the simplest form would consist of a table
    or box with horizontal rows and vertical columns of boxes where we would write
    the information we need.


    Let''s take an example, in the first column we could enter the Personal Identification
    Number, and in the following boxes on the same line we could enter the personal
    data of a customer or user, such as name, address, phone, and so on.


    From the identification number of the first column, we could query the rest of
    the data associated with the number of the first cell in the entire row.


    Many of the most commonly used databases today are relational databases.


    These databases have multiple tables in which they store different types of information,
    but all of the tables share a common index or reference column with the rest of
    the other tables in the same database, and with a specific programming language
    that allows information from any of the tables to be found, queried, extracted,
    and combined.


    Common examples are MySQL, PostgreSQL, and Microsoft SQL Server.


    There are many other types of databases:


    Non-relational databases: These databases do not use a fixed schema and allow
    flexibility in data structure.


    Object-oriented databases: These databases use an object model to store the data
    and allow relationships between objects


    Network databases: These databases use a network model to represent data and the
    relationships between them.


    Real-Time Databases: These databases provide high performance and scalability
    to handle large amounts of data in real time.


    Each type or architecture of database has advantages and disadvantages.


    However, since the birth of bitcoin, it has been proven that when security, reliability
    and immutability are required, blockchain database technology is the ideal technology.


    When we talk about the transfer of value over the Internet, such as money or digital
    assets that will be transacted electronically over the network, we do not want
    to have the slightest doubt that it will be done with an absolutely secure system.


    For this purpose, a solution based on a database architecture such as those mentioned
    above, and not on blockchain, could be used, and maybe some state will do it.


    However, the risks associated with sending and receiving money digitally would
    be very high.


    Let''s think about some of these risks, for example, if the computer system that
    processes the transactions were to fail for any reason, all transactions would
    stop. The solution to this problem is to have redundant systems, where there are
    many processing centers, and although a large number of them could become inoperable,
    the remaining ones still in service could provide their function without causing
    a problem in the traffic of transactions.


    If there is a single point of failure, such as a central processing system, and
    it goes down, disaster is inevitable. So, the solution is to decentralize to multiple
    processing nodes. Even if some go down, the rest will maintain service operations.


    Another problem could arise if the database is corrupted by an error in the processed
    data, which could be due to human error, hardware error in data storage, or worse,
    a criminal act or hacking.


    We could imagine a dystopian movie scenario where the entire public electronic
    money network was not only out of service, but the data, i.e. the funds in your
    wallet, had been erased or inflated, as well as the wallets of all citizens, the
    chaos would be total.


    This could be reasonably solved by having backup systems, called backup in computer
    science, for both the database itself and the computer processing systems.


    However, restoring data and systems from a backup may take some time, during which
    the CBDC system would not be operational.


    The way to solve this problem is called in computer science distribution or real-time
    replication.


    The database should not be stored in a single storage system, but in several,
    the more the better, the more secure, with the very important detail that all
    stored and used copies must be absolutely identical.


    If a processing node detects data corruption, it could stop processing transactions,
    a service that would be covered by one of the other nodes, to quickly rebuild
    the integrity of the data from its local backup of the database, or from the database
    of another node that stores the correct database.'
