- raw: 'The usefulness of this technology is given by these three factors, and its
    usefulness is focused on the reliable, secure and immutable registration of data.


    With respect to the Bitcoin blockchain, we can say that even in the event of a
    massive Internet outage, a catastrophic event, or a reduction in the number of
    nodes, the response and integrity of Bitcoin is guaranteed.


    The robustness and computing power of the Bitcoin network is currently the largest
    in the world, surpassing by several orders of magnitude any other dedicated computer
    network, including all the supercomputers of large technology companies, research
    labs or nations.


    Here are some of the most appropriate applications for a blockchain database:


    *   Digital identities and security for access to cloud storage.


    *   Data registration and verification.


    *   Land registries, civil registries, commercial registries.


    *   Registry of smart contracts, transparency of public institutions.


    *   Supply chains, automated security, voting systems.


    A great feature of the bitcoin blockchain, which is not permissioned and publicly
    accessible, is that anyone can access, view and analyze all transactions and the
    contents of all bitcoin addresses.


    Remember that the addresses, which contain the inputs and outputs, are not associated
    with any name or personal identity, so we say that bitcoin is pseudonymous, not
    anonymous, and absolutely all bitcoins are traceable.


    All transactions can be tracked using applications called blockchain browsers.


    With an economic system based on CBDC, but built on a blockchain, it would not
    only be technically possible, but extremely easy to achieve absolute transparency
    of public accounts.


    It would be enough for state and government agencies to publish their addresses
    on the blockchain used, so that any citizen could audit every penny of public
    money, as long as a publicly accessible blockchain, such as bitcoin, is used.


    If the state arrogates to itself the power to control all transactions in our
    wallets, should we citizens demand a publicly accessible blockchain CBDC?


    In the opinion of this author, the answer is utopian, but as we now know, perfectly
    possible and therefore achievable.


    ## **CHAPTER 6.**


    ## **Use cases compared to current systems.**


    ## **Digital Identity.**


    Card payments over the Internet have a potentially disastrous feature. When you
    use them over the Internet, you send all your card information, including the
    security key, with each transaction.


    With bitcoin, the user sends a digital signature that guarantees that only the
    owner of the bitcoin sent could have generated that signature, providing only
    their public key and a hash or digital signature, making it totally impossible
    to find out the private key by knowing the public key, hence the name asymmetric
    cryptography.


    With the private key, a different signature is generated for each transaction,
    because even if the sending and receiving addresses or the amount and chain of
    previous signatures of the bitcoin or fraction sent match, the time stamp will
    always be different.


    The use of traditional credit and debit cards for Internet commerce has always
    been risky, using a technology that became popular in the 50''s of the last century
    and was never intended for this use is still a bad idea and even with additional
    measures causes numerous frauds that, although sometimes assumed by banks or issuing
    companies, they undoubtedly include these costs in the price of their services,
    one way or another.


    **Reference**


    When Were Credit Cards Invented: The History of Credit Cards – Forbes Advisor


    Credit cards originated in 1914 when the Western Union Company created a card
    that offered benefits to its most select customers. It allowed them to enjoy preferential
    treatment and a free line of credit.


    In 1958, Bank of America introduced the first bank card, known as Bankamericard
    (now VISA). Also in 1958, American Express introduced its first credit card.


    In 1967, the First American National Bank of Nashville created the MasterCharge
    card (now MasterCard).


    Undoubtedly, the weak point of using credit cards for Internet use has been their
    security, first because the transaction sends its own security key, which is highly
    vulnerable to a malicious attack called "man in the middle".


    This consists of intercepting the communication between 2 or more interlocutors.
    To do this, the attacker places himself between the two and intercepts the messages
    from A to B, knowing the information, while at the same time allowing the message
    to continue on its way.


    The communication between A and B normally continues as if it were legitimate,
    but the attacker can decide whether to continue the intercepted message, whether
    to continue it with the same information or with other modified content, or whether
    to take note of the data and keys sent, which will allow him to impersonate the
    victim and make purchases with the impersonated identity, or worse, sell this
    information to other hackers, multiplying the danger.


    The use of Bitcoin, a technology created precisely to be used on the Internet,
    solves this and all other problems associated with sending value over the Internet.


    Users of their own wallets or exchanges\* can be attacked, but the blockchain
    protocol and chain has never been hacked, since its creation in 2009 all attempts
    or analyses show the impossibility of doing so.


    Bitcoin hacks can occur on the wallets or exchanges, not on the Bitcoin network.


    A digital identity that allows its secure use, in the sense that it cannot be
    impersonated, and also respects the privacy and the right of individuals to control
    their personal information and prevent its misuse, is still an open challenge.


    However, we can already see two different paths in development: the solutions
    of large corporations and governments, which always tend to centralize, with the
    consequent risk of creating a single point of failure, and therefore even "fairly"
    secure will still be vulnerable.


    An example of advanced development is the one presented by the Spanish company
    Alastria (Alastria ID), funded by a huge multi-sector consortium with 600 partners,
    including large companies, SMEs, public administration and academic institutions,
    for the creation of a public infrastructure, but based on a permissioned blockchain
    designed in accordance with Spanish and European regulations.


    The other alternative path is open source, decentralized, blockchain-based solutions
    that are not permissioned and have no corporate or government involvement.


    Some of these projects are:


    **RIF Directory.**


    Directory is an identity layer supported by the RIF Name Service. This project
    is intended to work in the RSK ecosystem, Bitcoin''s smart contract platform.


    **Sovrin.**


    This is an open-source project managed primarily by the Sovrin Foundation, a non-profit
    organization, and powered by the company Evernym.


    Sovrin is a decentralized digital identity system. The platform is based on a
    hybrid blockchain using Hyperledger technology. As such, its use is public, but
    with restricted access through administrative permissions.


    **uPort.**


    uPort is a project that provides a decentralized digital identity system based
    on the Ethereum network. It is one of the oldest projects run by ConsenSys. It
    focuses on providing open-source tools and protocols to build the identity layer
    in this blockchain network.


    The ideal solution, in which each individual protects the privacy of his or her
    own personal data and provides only what is strictly necessary to access a service,
    is still in its initial stages.


    For now, it is advisable to be cautious about the information we share. In particular,
    personal addresses, telephone numbers or financial information. In this way, we
    will avoid being exposed to malicious agents that could cause us very serious
    damages.


    Undoubtedly, cryptography and blockchain will play an important role in digital
    identity.'
