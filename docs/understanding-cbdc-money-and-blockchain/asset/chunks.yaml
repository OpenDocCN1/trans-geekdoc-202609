- raw: 'Governors are nothing more than executives elected by the shareholders of
    the regional banks that make up the Federal Reserve System.


    By definition, a private corporation engages in economic or commercial activity
    in pursuit of profit, or gains for its owners or shareholders, so it seems unrealistic
    to expect the Federal Reserve to make decisions with the public good in mind rather
    than its own interests.


    2\. Regulation.


    Although governments repeat that regulations of all kinds are for our good and
    always to protect the citizen, the truth is that they are nothing more than the
    disguised use of government force against citizens to maintain control.


    Economic and financial regulations are created to protect the interests of big
    business, especially the banking and financial sector.


    Governments and lawmakers use the so-called revolving door to gain access to high-level,
    politically appointed political or civil service positions from which they legislate
    and regulate with the primary objective of benefiting the banking industry and
    controlling citizens.


    Using public institutions that supposedly oversee banking, financial and competition
    activities.


    When their time of public "service" is over, most of them use the revolving doors
    to return to the corporate world, occupying high and well-paid positions.


    CBDCs will be the perfect instrument to control and impose the restrictions they
    wish to impose, always to "protect us" and in strict compliance with the laws;
    laws that will be created or modified as necessary for this purpose.


    Bitcoin is a permissionless system, no permission is needed to create a wallet,
    send or receive Bitcoin.


    Bitcoin transactions are irreversible, unlike credit card transactions and bank
    transfers, and cannot be censored, worldwide, regardless of governments, states
    or borders.


    3\. Privacy:


    "The digital euro will never be programmable"


    Fabio Panetta. Member of the Executive Board of the European Central Bank (January
    2023).


    Even if we give the benefit of the doubt to the words of the Executive Board of
    the European Central Bank, this does not mean that governments and not the central
    bank, under the usual pretexts of anti-money laundering and anti-terrorist financing,
    will exercise control or have full access to the information extracted from our
    CBDC digital wallet, also called the Digital Euro in Europe.


    The most reasonable thing to do will be to assume that every single transaction,
    both sent and received, will be fully monitored by the government, a task that
    in practice will probably be performed by private companies subcontracted for
    this purpose.


    4\. Processing.


    This could be one of the few clear advantages of a digital currency system, as
    long as it is properly implemented, transactions should be as fast and convenient
    as credit/debit card payments or mobile payment systems from major technology
    companies.


    On the other hand, bitcoin payments to replace cash or credit cards would be extremely
    slow, since it takes at least 1 hour for a transaction to be considered secure
    and irreversible, which is the time required to confirm at least 6 blocks of the
    bitcoin blockchain, which are added every 10 minutes.


    At this point, it is necessary to emphasize that not all payments require the
    immediacy of payment in a merchant, for example, billing between companies or
    direct debits of monthly receipts for services or rentals could be perfectly carried
    out with bitcoin.


    In any case, although it is not the purpose of this book, the reader should know
    that there are already second-layer systems on the Bitcoin blockchain that allow
    instant micro-payments with Bitcoin through the Lightning Network system, which
    is already widely used even though it is still considered to be in the testing
    phase.


    This system is being used in El Salvador to provide instant payment services using
    bitcoin as legal tender alongside the US dollar.


    The Lightning Network system can be unbeatable in terms of capacity, speed and
    number of transactions processed per second, far exceeding the services most commonly
    used by credit/debit card issuers today.


    By design, the more users that use the Lightning Network, the faster and more
    powerful it becomes.


    5\. Volatility.


    Volatility is a statistical measure of how much the price of a currency or financial
    asset changes over a given period of time.


    While we may think that a fiat currency issued by a central bank maintains a stable
    value over time, a cursory review of history shows that its value inexorably goes
    to zero, and inflation steadily erodes its purchasing power.


    Unfortunately, during periods of high inflation, such as the current one, 2022,
    2023, the accelerated loss of value is clearly observable, although the appearance
    of a fixed nominal value in banknotes and coins disguises this adverse event.


    On the contrary, bitcoin, which still has a small capitalization compared to the
    fiat money supply and lacks a regulation that provides legal certainty to large
    institutional investors, suffers from an enormous volatility that makes it very
    inconvenient to use as a currency in the short and medium term.


    Although it is in the long term where bitcoin shows an increase in its value,
    1,800% counting only since 2014, with cycles of four 4 years, where one year is
    a big drop in price, for three years of increases.


    Reference:


    The Bitcoin Macro Disconnect.


    [https://www.newyorkfed.org/medialibrary/media/research/staff\_reports/sr1052.pdf](https://www.newyorkfed.org/medialibrary/media/research/staff_reports/sr1052.pdf)


    Federal Reserve Bank of New York Staff Reports, no. 1052


    Page #10:


    *“*In about ten years, Bitcoin experienced rapid growth going from $5 in 2012
    to above $60,000 in March 2021, for a compound annual growth rate of about 270%
    per year.


    The compound annual growth rate in the full sample is, however, 220% per year
    because of its recent decline. (2022) During the same sample period, the S&P 500
    grew about 11% per year between 2012 and 2022, while gold and silver prices remained
    flat.*”*


    According to the above information from the New York Federal Reserve about Bitcoin
    price volatility and growth, we should consider the time period according to our
    expectations before making a judgment about it.


    6\. Permitted System.


    Just like using the banking system, the basic requirement for using a CBDC digital
    currency is personal identification, the direct consequence of which is that users
    must have the permission of the issuer to access the e-wallet application in the
    first place.


    Secondly, the registered funds and all transactions will be under constant monitoring,
    supervision and approval, which obviously undermines the real ownership of the
    funds, since at the discretion of the CBDC issuer, the permission to access the
    wallet application could be conditioned or revoked at any time, always under legal
    premises or for its "own security".


    Likewise, any transaction that might violate the issuer''s criteria or its government''s
    regulations could be unauthorized, blocked, or worse, reversed.


    Bitcoin, on the other hand, is a permissionless system; it does not require permission
    to install the wallet of your choice, nor to receive or send Bitcoins.


    As a fully decentralized system, it does not require an intermediary or authorized
    central entity to verify and record transactions. Instead, this is done through
    a decentralized and globally distributed network of nodes that maintain a copy
    of the ledger, or blockchain, and verify and record transactions by consensus.
    This means that no one has central control over the network, and anyone can participate
    without permission.


    Transactions are pseudonymous, not anonymous, we will come back to this point
    later, and cannot be censored, stopped, blocked or reversed as long as the user
    is operating their own custodial wallet and not a wallet or application of a custodian
    company or an exchange house, known simply as *“Exchanges”.*'
