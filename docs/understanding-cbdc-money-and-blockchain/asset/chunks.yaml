  trans: '


    比特币、其协议及其区块链无法被任何政府、公司、团体或个人所控制或更改。


    比特币的特性使其成为迄今为止创造的最优货币，尤其是对于电子商务而言。


    随着时间的推移，各国可能会发现，它可能是国际贸易中结算和支付的理想解决方案，包括政治敌对双方国家之间的贸易。


    当然，它将遭到政府的拒绝，因为其广泛使用将导致他们失去对法币的控制，但他们可能很快就会接受它用于国际贸易，正如俄罗斯和伊朗等国家正在探索的那样。


    到 2023 年，已经有两个国家——萨尔瓦多和中非共和国——授予了比特币法货币地位，与其并列，萨尔瓦多使用的美元和中非共和国使用的中非法郎并列。


    通过 `CBDC` 货币实行的国家控制将迫使公民为了捍卫自由、我们的钱和我们的财产，而考虑一种货币替代方案。


    我们应该记住这样一个概念：当货币仅仅是政府控制的计算机系统中的记录时，它就不再是我们的钱，我们拥有使用它的许可，而这种许可可以随时被设定条件或撤销。


    再次引用夏尔·德高尔的演讲，他在其中说：“我们认为国际贸易应该基于一种不可争议的货币标准，而且不应该带有特定国家的印记。什么标准？事实是，除了金标准之外，没有其他标准是可以想象的！”


    夏尔·德高尔无法想象除金标准之外的任何标准，因为在当时互联网甚至无法被想象。


    我不能错过这个机会来推荐这本书：


    《比特币标准：中央银行体系的去中心化替代方案》。作者为 Saifedean Ammous 教授。他是黎巴农大学阿德南·卡萨商学院的经济学教授。


    得益于`my age`，我有幸运见证了由于技术进步带来的若干重大社会变化。


    我一直是一个技术爱好者，从我青少年时期起，我就亲眼见证了 20 世纪 80 年代计算的演进和微型计算机的普及，这后来成为了我的职业。


    我很享受经历这场变革，在那些年里，用我那几乎只能显示 256 种色的 8 位个人电脑，我已经梦想梦想数字摄影和音频了。


    我仍然记得当时专业摄影师的评论，他们辩称，糟糕的数字摄影永远无法与、更不用取代基于化学胶片的模拟摄影相竞争。


    在柯达的一次董事会议上，有一段著名的对话，一位与会者建议推广柯达已经在开发的萌芽阶段数字摄影。


    而对该建议的回答是：


    “如果数字摄影发展起来，我们整个化学胶片生产和相片纸的工业基础该怎么办？”


    “无胶片摄影很棒，但不要告诉任何人。”


    缺乏创新是数字摄影出现后柯达衰落的首要原因。


    尽管这家公司本质上发明了数字相机，但他们由于担心这会威胁到其传统胶片的利润而抑制了这项技术。


    数字化像所有之前的技术革命一样，在所有领域具有颠覆性，尽管它在货币体系中仍然受到抵制，但它也不会例外。


    而且，当我谈论数字货币时，我指的不是信用卡或 `Google/Apple Pay`。


    我还记得互联网进入每个家的场景，调制调器插在电话的音频线上，从 `Netscape` 浏览器发出的第一封电子邮件，以及第一首 `mp3` 格式的歌曲。


    几年前还无法想象的事情，得益于个人电脑和互联网而变成了常态。


    我记得，当我 20 世纪 80 年代后期学习数字电子和微处理器时，我带着怀疑的态度在一种电子杂志上读到，正在为蜂电话制定标准，几年后我们就能从汽车里拨打电话。


    几年后，具有永久互联网连接的智能手机问世了。技术的演进迫使我们的生活和社会发生变化，这一直是如此，从洞穴时代开始；现在发生的是这些变化加速了，变得越来越重要，且耗时更短。


    带着这些经历，我可以安全地说，很快我们就会拥有一种通用且中立的数字货币，不受政府和公司的干涉，无法被没收，也无法被审查。更进一步，它可能已经对所有人可用并可获取。


    政府和公司法币可以被不同的货币体系取代的想法可能仍然看起来像乌托邦或小说，但事实并非如此，这项技术已经存在。


    “任何足够先进的技术与魔法无异。”


    ——亚瑟·C·克拉克。


    ## 术语表


    ### 会计分录 (Accounting entry)

    一种详细说明商业或经济变动的书面记录，改变了个人或公司的资产。在会计中，日记分录用于记录公司的每笔交易。


    ### 支撑 (Backing)

    在金融领域，“Backing”是指为了支持金融交易而提供或接受的担保。


    例如，在抵押贷款中，作为抵品的提供的担保或财务支撑是房产。


    在金标准时期，钞币的支撑是一定数量的黄金，钞币可以兑换黄金。


    ### 内救 / 外救 (Bail-in / Bail-out)

    `Bail-in`（内救），或者简单来说是指金融营救，是对陷入困难的金融机构或实体的再融资。


    `Bail-out`（外救）是指这种营救的资金来自实体外部，通常来自其他实体或国家，这些国家会将此成本转嫁给纳税人。


    `Bail-out` 是 2008 年金融危机期间使用的模型。


    `Bail-in`（内救）是指营救困境机构的资金来自机构内部，即来自股东或存款人。


    在 2008 年危机之后，全球所有国家都更新了法律，以便在未来执行内救。


    非常重要的一点是，理解在未来当银行陷入困难时，当局将通过这些法律从银行的债权人（即股东和存款人）那里提取资金，只有在之后仍然不足，存款担保基金才会采取。


    ### 资产负债表 (Balance Sheet)

    资产负债表是一份定期制作的财务报告（每月、季度或每年），详细列出了所有资产、拥有价值、负债或债务以及产生的公司资本。


    有一个非常简单的公式：


    资产 - 负债（或债务） = 公司资本。


    这个术语在媒体中常指代中央银行“购买”的金融资产，如公司债券、政府债券或国债。


    注意，这些资产是用凭空创造的新货币购买的。


    ### 熊市 / 牛市 (Bear Market / Bull Market)

    金融术语的口语化表达，用于表示熊市，或 `Bear Market`（熊市），类比熊在降低爪子时从上往下攻击；或 `Bull Market`（牛市），类比牛从底部向上冲撞的攻击。


    ### BETA 指数 (BETA Index)

    在金融术语中，Beta 指数是一个衡量资产（股票或证券）相对于其交易市场波动性的指标。


