  trans: '

    正如比特币内部人士所保证的那样，如果用户没有通过自托管钱包应用持有私钥来掌握控制权，而是将比特币由中间机构持有，那么他将不是真正的有效持有者，其情况与在银行存有法币相同，更糟糕的是，目前的交易所通常在没有明确监管的情况下运营，并且被排除在金融系统之外，无法像银行账户那样加入公共或私立存款保障联盟。


    ### 7. 采用。


    CBDC（央银行数字货币）的采用是由政府和中央银行强制的，而比特币的采用完全是自愿的并由用户社区驱动的。


    考虑到 CBDC 货币在社会经济控制方面带来的优势，认为政治权力会因为公民的抵制而放弃实施 CBDC 是不现实的。


    无论如何，他们都将使用著名的 `Overton''s Window`（奥顿窗）系统，其运作方式可能如下：


    首先，他们将其作为一种测试引入，“保证”它不会取代实体货币，而是对其补充。他们将继续使当前的支付手段过时，很快接收任何社会援助的唯一方式将是数字货币形式；他们可以继续强制用数字货币支付各种税费，届时实体货币将实质上从日常生活中消失，而且事实上，正如今天已经发生的那样，如果有人处理大量纸币，他将立即被怀疑在处理非法资金。


    这个借口足以中断对“不消除实体货币”的“保证”，因为这显然是犯罪分子和逃税者的最爱。


    问题不在于 CBDC 是否会成为唯一的流通货币，而在于它何时或多快被实施。


    这一过程就像所有使用 `Overton''s Window` 方法论的社会控制过程一样，将完全不会被大多数人察觉；年轻人甚至不会记得实体货币是什么，也不会记得需要携带一些纸币和一定数量沉重的硬币来进行小额支付。


    将比特币作为一种不受政府、银行或公司控制的数字货币，是完全自愿的。人类对选择的天然偏好以及对 CBDC 强制推行的抵制，可能会导致社会反应，这种反应随着比特币采用率的持续增长有待观察。


    我们将在最后一章“CBDC 的替代方案”中深入探讨这一主题，并将研究先驱国家 CBDC 的成功案例。


    ## 第 5 章。


    ## 底层技术与区块链概述。


    在这里我们将分析什么是区块链：`Blockchain`，以及为什么它是管理比特币、货币和数字资产、代币或代币资产的首选技术，并且它几乎将是实施 CBDC 的技术基础。


    我们将简要讨论什么是数据库，其定义如下：


    数据库是存储在计算机系统中并可访问的组织化数据集合。这些数据可以包括文本、图像、数字和其他类型的信息，这些信息经过结构化处理以便访问、使用和管理。


    数据库由一种名为 `database manager`（数据库管理器）的特定类型软件直接管理或通过其他可以访问和查询存储数据的应用程序管理，用于执行搜索、查询、更新和分析数据等任务。


    数据库有许多类型，最简单的形式由包含水平行和垂直列框的表格或框组成，我们在其中写入信息。


    （注：原文中存在大量关于数据库定义的重复段落，已按要求保留格式并翻译核心含义，此处省略重复部分的翻译以保持简洁，遵循原文逻辑）


    内容如下...]


    数据库是存储在计算机系统中并可访问的组织化数据集合。这些数据可以包括文本、图像、数字和其他类型的信息，这些信息经过结构化处理以便访问、使用和管理。


    数据库由一种名为 `database manager`（数据库管理器）的特定类型软件直接管理或通过其他可以访问和查询存储数据的应用程序管理，用于执行搜索、查询、更新和分析数据等任务。


    数据库有许多类型，最简单的形式由包含水平行和垂直列框的表格或框组成，我们在其中写入信息。


    ...


    示例包括 `MySQL`、`PostgreSQL` 和 `Microsoft SQL Server`。


    `Non-relational databases`：这些数据库不使用固定模式，允许数据具有灵活性。


    `Object-oriented databases`：这些数据库使用对象模型表示数据。


    `Network databases`：这些数据库使用网络模型表示数据。


    `Real-Time Databases`：这些数据库提供高性能的可扩展性来处理大量数据。


    每种类型或架构都有优缺点。


    然而，自比特币诞生以来已经证明，当需要安全性、可靠性和不可变性时，`blockchain` 技术是理想选择。


    当我们谈论在互联网上传输价值（如货币或数字资产）时，我们不希望出现任何微小的安全隐患。


    为此，可以使用基于上述架构而非 `blockchain` 的解决方案。


    如果存在单点故障（例如中央处理系统）且其宕机，灾难将不可避免。因此，解决方案是去中心化到多个处理节点。


    如果数据库因处理数据中的错误而损坏，可能会出现另一个问题，这可能是由于人为错误、数据存储硬件错误，或者犯罪行为或黑客攻击。


    我们可以想象一个反乌托邦电影场景：整个公共电子货币网络不仅停止服务，而且数据（即你钱包中的资金）被擦除或通胀，所有公民的钱包也是如此，这将导致彻底的混乱。


    这可以通过拥有备份系统来合理解决，计算机科学中称为 `backup`，涵盖数据库本身和计算机处理系统。


    然而，从备份恢复数据和系统可能需要一些时间，在此期间 CBDC 系统将无法运行。


    解决这个问题的方法在计算机科学中称为分布或实时复制。


    数据库不应存储在单一存储系统中，而应存储在多个系统中，数量越多越安全，一个非常重要的细节是，所有存储和使用的副本必须完全一致。


    如果处理节点检测到数据损坏，它可以停止处理交易（该服务将由其他节点之一覆盖），从其本地数据库备份或存储正确数据库的另一个节点中快速重建数据的完整性。

