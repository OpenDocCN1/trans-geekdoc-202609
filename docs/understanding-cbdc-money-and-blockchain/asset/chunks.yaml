    The S&P 500 is a market-capitalization-weighted measure, which means that larger
    companies have a greater weight in the index than smaller companies.


    ## SEC.


    The Securities and Exchange Commission. An independent U.S. federal agency responsible
    for protecting investors and maintaining the integrity of the U.S. securities
    market.


    The `SEC`''s responsibilities include:


    - Protecting investors, regulating the securities market, and promoting transparency.


    - The `SEC` also has the authority to enforce the federal securities laws and
    can bring legal action against individuals and companies that violate these laws.


    ## Security.


    In financial terminology, the term "security" refers to a tradable financial asset
    that holds some type of monetary value. This includes stocks, bonds, options,
    futures, and other derivatives. A security can represent ownership in a company
    (in the case of stocks) or a creditor relationship with a company or government
    entity (in the case of bonds).


    Securities are traded on financial markets and can be bought and sold by investors
    with the expectation of generating a return on their investment.


    The term "security" is a legal term that is often used in regulatory and compliance
    contexts as well.


    ## Shares.


    A share is a portion of a company''s capital that can be bought and sold on the
    stock exchange.


    Essentially, it is one of the forms of financing a company; when a company needs
    capital or financing to conduct its business, it sells securities that represent
    equal portions of that capital, and those portions or securities or shares can
    be bought and sold on a regulated market called the stock exchange.


    ## Shareholders.


    The owners of the shares who have rights to the company and its profits.


    ## Share - Stock market value.


    The terms "share" and "stock" are often used interchangeably, but technically
    they have slightly different meanings.

    '
  trans: '


    离岸金融服务是指由位于国家或管辖区的金融机构提供的金融产品和服务，这些国家或管辖区比客户国家税收较低、监管更少且金融隐私性更高。


    这些服务可能包括银行、投资管理、保险以及向个人、公司或机构投资者提供的金融产品。


    “离岸”一词通常指客户所在国家以外的地点，尽管某些管辖区可能位于本土，但提供类似的税收和监管优惠。


    使用离岸金融服务的公司和个人通常寻求减轻税收负担或保护其资产免受没收或诉讼。然而，离岸金融服务的使用也因助长逃税和洗钱而受到批评。


    ## 奥弗斯顿窗口（Overton Window）


    奥弗斯顿窗口是一种政治理论，描述了社会观点如何在几个阶段（或一个时间窗口）内发生变化，使得一个最初完全无法接受的观点最终能够逐渐被引入并被社会接受。


    这是政治权力最重要且应用广泛的机制之一，如今也被称为社会工程，用于强制推行最初无法接受的法律和准则，通常是为了限制自由、增加控制和税收。


    ## 庞氏骗局（Ponzi Fraud）


    庞氏骗局是一种投资诈骗类型，其利用新投资者投入的资金支付给早期投资者回报，而不是通过投资产生的任何实际利润。该骗局以查尔斯·庞氏（Charles Ponzi）命名，他在
    20 世纪初因因这种这种方法欺骗投资者而臭名昭著。


    在庞氏骗局中，策划者向投资者承诺高额回报，通常使用复杂且看似合法的投资策略。策划者可能使用虚假或误导性的财务报表，或者简单地对投资产生的收益进行撒谎。


    随着更多投资者加入骗局，策划者使用他们的钱来支付给早期投资者，创造出获利回报的幻象。然而，骗局最终会崩溃，要么是因为策划者无法再吸引足够的新投资者来支付早期投资者，要么是因为太多的投资者同时提现，而没有足够的资金支付他们的取款。


    庞氏骗局在大多数国家都是违法的，参与者如果被发现可能会面临严重的法律和财务后果。对于投资者来说，警惕那些好得令人不可信的投资机会并在投资前进行尽职调查至关重要。


    ## 一级市场 / 二级市场


    一级市场是发行新证券或资产并向公众出售以募集资金的地方。


    二级市场是投资者买卖已经在一级市场发行的证券的地方。


    在这个市场中，投资者在彼此之间买卖证券而不涉及发行人的直接参与。


    ## 盈利能力（Profitability）


    这是产生利润或收益的特性，表现为产生的利润与投入资本之间的百分比或比例。


    ## 工作证明。“PoW”（比特币网络）


    工作证明是一种共识机制，它利用矿工的计算能力来保护比特币网络并确保交易的有效性。虽然这种有效，但它消耗大量的计算能力，因此消耗大量的能量。


    工作证明通过让攻击者更改或伪造交易或区块变得非常困难且昂贵来保护比特币网络。要做到，攻击者需要比其他矿工更多的计算能力，这需要大量的能量和资金投入。此外，`PoW`
    通过向矿工奖励 `BTC` 来激励他们遵守规则并维护网络的完整性。


    ## 量化宽松“QE”/ 量化紧缩。“QT”。


    量化宽松（QE）是中央银行使用的一种扩张性货币政策，用于增加货币供应并刺激经济。在 `QE` 中，中央银行通过电子创建的新货币购买政府债券和其他金融工具（如抵押贷款支持证券）。


    量化紧缩（QT）是中央银行的一种收缩性货币政策工具，用于减少经济中的流动性或货币。`QT` 是量化宽松（QE）的相反。中央银行通过出售或让政府债券到期并将其从现金余额中移除来实现
    `QT`。其目标是提高利率，抑制贷款和投资，并控制通胀。


    ## 评级（Rating）


    或金融评级是一种表明公司、国家或金融产品信用风险的资质。评级由信用评级机构提供，这些机构是评估债务发行人偿债和支付能力的私人实体。


    评级由一系列字母和符号表示，范围从 `AAA`（最高信用质量）到 `D`（违约）。


    ## 罗素 2000 指数（Russell 2000）


    罗素 2000 指数是一个衡量美国约 2000 家小市值公司表现的股票指数。它经常被用作小盘股的基准，或作为美国股市状况的指标。


    罗素 2000 指数由市值在约 3 亿美元到 20 亿美元之间的较小公司组成。


    ## 标普 500 指数（S&P500）


    它是一个反映美国股市 500 家最大且最重要的公司表现的股票指数。它是金融领域应用最广泛的指数之一，被认为是衡量美国股市表现的代表性衡量标准。


    标普 500 是一个市值加权衡量标准，这意味着大公司在指数中的权重比小公司大。


    ## SEC（美国证券交易委员会）


    美国证券交易委员会。一个独立的美国联邦机构，负责保护投资者并维护美国证券市场的完整性性。


    `SEC` 的职责包括：


    - 保护投资者、监管证券市场并提高透明度。


    - `SEC` 还有执行联邦证券法的权力，并对违反这些法律的个人和公司提起诉讼。


    ## 证券（Security）


    在金融术语中，“证券”指的是具有货币价值的可交易金融资产。这包括股票、债券、期权、期货和其他衍生品。证券可以代表对公司的所有权（股票）或与公司或政府体的债权关系（债券）。


    证券在金融市场上交易，投资者为了获得投资回报而进行买卖。


    “证券”也是法律术语，经常也用于监管和合规背景下。


    ## 股份（Shares）


    股份是可以在交易所买卖的公司资本的一部分。


    本质上，它是公司融资的一种形式；当公司需要资本或资金经营业务时，它出售代表资本相等部分的证券，这些部分或证券或股份可以在被称为交易所的监管市场上进行买卖。


    ## 股东（Shareholders）


    股份的所有者，拥有对公司及其利润的权利。


    ## 股份 - 股票价值


    “share”和“stock”这两个词经常互换使用，但技术上它们有略有不同的含义。


