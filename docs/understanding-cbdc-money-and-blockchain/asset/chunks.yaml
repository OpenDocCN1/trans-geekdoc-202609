- raw: 'A recent press release from the Central Bank of Nigeria (CBN) details that
    as of January 9, 2023, ATMs in the country will be allowed to withdraw a maximum
    of 20,000 naira per day, which is about $45.


    Nigeria. The Central Bank of Nigeria limits cash withdrawals to a daily maximum
    of 42 euros in an attempt to boost electronic transactions through the use of
    its digital currency. Does the global trend to impose the use of central bank-controlled
    digital currencies, CBDC, endanger our freedoms?


    Reference:


    Nigeria wants to force the use of its CBDC - 11Onze


    As we are already seeing, and will surely see in Europe, if the implementation
    and use of CBDC is not accepted or does not meet the governments'' timetable,
    the coercive phase will begin, and the political power will have all the tools
    at its disposal to apply whatever force is necessary.


    In the case of China, people used to obey the omnipotent power of government,
    perhaps due to the cultural bias of putting the common good before the personal
    good that distinguishes them from Western culture, the rate of acceptance has
    also been disappointing.


    The People''s Bank of China has released a report of its financial statistics
    that includes the digital yuan, or CBDC, in the metrics for the past 12 months.


    According to this data, the central bank has indicated that there were 13.61 billion
    digital yuan ($2 billion) in circulation at the end of 2022, an increase of 15.3%
    from the previous year.


    Despite this increase, it represents only 0.13% of the total fiat currency in
    circulation. The Financial Statistics 2022 report notes that the digital yuan
    in circulation did not cause any "notable changes" in the data.


    Reference:


    China’s central bank includes digital yuan in report on currency circulation ([cointelegraph.com](http://cointelegraph.com))


    The reason for the low usage rate of the digital yuan is mainly due to the fact
    that digital phone payments have already been massively implemented in China through
    the popular payment applications of AliPay, a company of the electronic giant
    Alibaba, and WeChat, the most popular instant messaging application in China.


    These applications are so popular and widely used that they are practically the
    preferred method of payment, and as I mentioned in Chapter One, the first question
    that users will ask when it comes to implementing CBDC currencies is, "What advantage
    will CBDCs give me over the electronic systems I already *use?”*


    For this reason, and also because these companies were entering the financial
    market by offering quick loans over the phone without actually being banks, the
    Chinese government decided to curb their business activities with strict measures.


    These Chinese tech giants have advantages because they have all the information
    and therefore the credit risk assessment of their customers and could use the
    money deposited by their users in their payment applications to grant loans using
    the well-known fractional reserve technique.


    Banks will face stiff competition from WeChat alone, which has 900 million daily
    users in China and 1.2 billion worldwide.


    In November 2020, Alibaba-owned Ant Financial was set to go public in Shanghai
    in what would have been the largest IPO in history, but its permit was revoked.


    It appears that it could reapply for the largest IPO, which is the formal, regulated
    process for a company to start selling its shares on the stock exchange, as early
    as 2023.


    The big tech companies have long wanted to get into the financial business, especially
    Amazon, Google and Apple.


    It is known that Google has a banking license in Lithuania, which would give it
    access to the entire European Union, and several other licenses as a payment institution,
    for example in Ireland.


    With this new license, Google Payment Ireland will be able to manage credit cards,
    perform online money transfers for users and foreign exchange transactions.


    It will also be able to provide customers with detailed analysis of their spending
    patterns to create customized financial and budgeting plans based on the information
    in its databases.


    Apple and Amazon also hold banking licenses in the European Union that allow them
    to operate as banks throughout the Union.


    These companies have the capital, all the information about their users, and the
    corporate image to become a competitor that could easily cannibalize the entire
    European banking industry, time will tell.


    I must confess that I am a customer of the three technology companies mentioned,
    and from a user''s point of view, each of them gives me more confidence than any
    of the European banks.


    Undoubtedly, the banking business is besieged by several possible enemies, not
    only the CBDCs, but also the technology giants, all of which already have very
    convenient and popular payment platforms for their users.


    Knowing the likely problems of CBDCs and being familiar with payment platforms
    such as Google Pay, Apple Pay or Samsung Pay, what advantages can the central
    bank offer us?


    After all, goods and services must compete, and only the most efficient and convenient
    will succeed, and CBDCs will have to compete not only with payment companies,
    technology, traditional banks, and fintech or neo-banks, but also with each other.


    The centralized political power will find some excuse to ban EU citizens from
    using the Digital Yuan or Digital Ruble, or at least they will try.


    But what excuse could they find to boycott the Digital Dollar, the Digital Pound
    or the Digital Swiss Franc?


    "Don''t put all your eggs in one basket" is the first rule of good financial practice.


    ### **Other Money Stories.**


    **The neocolonial "seigniorage" of the CFA franc.**


    For 75 years, the CFA franc has been the currency of fourteen African countries,
    almost all former French colonies, and is itself divided into two, for West Africa
    (XOF) and for Central Africa (XAF).


    Namely: Benin, Burkina Faso, Côte d''Ivoire, Guinea-Bissau, Mali, Niger, Senegal
    and Togo in West Africa; and Cameroon, Central African Republic, Chad, Republic
    of the Congo, Equatorial Guinea and Gabon in Central Africa.


    The acronym of this currency stands for "African Financial Community", although
    at the time of its creation it stood for "French Community of Africa".


    It should be noted that in April 2022, the Central African Republic declared bitcoin
    as legal tender alongside the CFA franc.


    This is the second country to do so after El Salvador, which made bitcoin legal
    tender in September 2021.


    In its origins, the CFA Franc was a colonial currency imposed by the metropolis,
    and even today Paris retains a great deal of influence over the countries that
    use it.


    This currency is issued by the Bank of France and has a fixed exchange rate with
    the currency used by France, first the franc and now the euro.


    In order to use this currency, the central banks of these countries must keep
    50% of their reserves with the French Treasury, they are also obliged to buy French
    public debt, and the Bank of France has a virtual veto over the monetary policy
    decisions of the central banks of these countries.


    There is an international controversy about France''s policy of neo-colonialism
    towards its former colonies, which is growing with time.


    It is not difficult to imagine that the growing influence of China throughout
    Africa, on the one hand, and the rejection of the former metropolis, on the other,
    will turn these countries into fertile ground for the massive use of the digital
    yuan, with the de facto disappearance of the already decadent currency, the CFA
    franc.


    References:


    What is the CFA Franc and which countries use it?


    CFA Franc | History and information | BCEAO.


    Franco CFA.


    CFA franc - Wikipedia


    The model and operation of the CFA Franc is a clear practical example of how the
    issuer of a fiat currency acquires enormous power, which many economists and analysts
    describe as a Ponzi scheme\* or neo-feudalism.'
