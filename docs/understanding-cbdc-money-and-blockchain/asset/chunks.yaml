- raw: 'We have addressed the dangers associated with CBDCs, such as absolute control
    over citizens and the economy, as well as possible restrictions on freedoms, but
    the most basic danger is simply that a CBDC not only reinforces the worst political
    control of society, but also remains a fiat currency.


    We already know that a fiat currency is backed by nothing, its issuance has no
    limit, so its value tends to zero. All fiat currencies end their life cycle with
    a monetary reset.


    A monetary or currency reset is a process in which a new currency is introduced
    to replace the existing one, usually in times of deep financial and social crisis.


    It usually occurs when the public has lost confidence in the currency, causing
    the exchange rate to fall, or when a country is experiencing hyperinflation and/or
    bankruptcy.


    The cause of a failing currency is often related to government over-indebtedness
    and the perception that the government has lost the ability to pay what it owes.
    Reading the above, we can realize that the mentioned circumstances are so common
    to all countries and fiat currencies today that they lead us to believe that a
    collapse of the fiat monetary system is not too far away.


    This perception, coupled with excessive spending and an apparent inability to
    raise taxes that are already strangling individual, corporate and national economies,
    can lead to a loss of confidence in the currency and make a reset more likely.


    Currency reset processes vary from time to time, but generally involve exchanging
    the old currency for a new one. People may be allowed to exchange some of their
    old bank notes for new ones, or for CBDC up to a certain limit, as will bank balances;
    rarely will it be 1:1, especially for large balances, which is effectively a confiscation
    of wealth.


    During monetary reset crises, corporations may also be treated "differently" from
    individuals. Special rules may apply to certain types of institutions, such as
    banks, pension funds, foreign governments, international institutions, government
    agencies, and the government itself.


    Bonds\* and money market funds\* may not be converted because they make up the
    bulk of the debt that the failed currency cannot repay.


    Corporate bonds, mortgages, loans, and private debt can remain in the old currency
    or be converted to the new, often with "elastic" rules tailored to the financial
    sector and the political and ruling power.


    The new currency will come with the "guaranteed" promise that it is tied to something
    of value, and "safeguards" will be promised to ensure that the loss of value seen
    in the previous failed currency will never happen again.


    Observing the growing geopolitical tensions between the Western countries on one
    hand and the BRICS group of countries on the other, it seems obvious that we are
    heading towards an economic fragmentation that will eventually affect the global
    monetary system to form a new map of what is beginning to be called a multipolar
    world, as opposed to the current unipolar world led by the United States.


    In the Western countries, we will include the United States, all the countries
    of Western Europe, Canada, Australia, New Zealand, South Korea and Japan. We would
    be talking about less than 1 billion people.


    In the BRICS, the acronym for the founding countries, we will include Brazil,
    Russia, India, China, South Africa.


    But there is a long list of candidates to join the founding group, including:
    Saudi Arabia, Qatar, Kuwait, Bahrain, United Arab Emirates, Argentina, Iran, Egypt
    and Algeria.


    Observe that the BRICS will include China as the world''s factory, the largest
    producers of oil, energy and raw materials, as well as giants in agri-food production.


    Just add China with 1.4 billion people, India with another 1.4 billion, the Muslim
    world with 1.8 billion, plus 260 million from Brazil and Argentina, almost five
    times the population of the Western countries.


    These countries have commodities, manufacturing, and economies with great potential,
    and large populations with young age indexes, in contrast to Western countries,
    especially Europe and Japan, which are already facing population aging problems
    due to low birth rates.


    Reference:


    Economic power shift: BRICS nations overtake G7 in global GDP (Purchasing Power
    Parity).


    Economic Power Shift: BRICS Nations Outpace G7 in Global GDP ([thenewscrypto.com](http://thenewscrypto.com))


    The BRICS nations, Brazil, Russia, India, China and South Africa, have surpassed
    the G7 nations in economic power. In terms of purchasing power parity (PPP), these
    nations rank first and form the world''s largest gross domestic product (GDP)
    bloc.


    The GDP Purchasing Power Parity (PPP) economic index is an economic indicator
    used to compare the standard of living between different countries, taking into
    account the Gross Domestic Product (GDP) per capita in relation to the cost of
    living in each country.


    This index is the set of final goods and services produced in a country during
    a year, but instead of using the prices of that country, it uses the prices of
    the United States, which will serve as the basis of calculation for all countries..


    The current unipolar world, led by the United States since the Second World War,
    is based on an intact industrial position after the Second World War, which has
    kept the United States in a privileged position by imposing its currency, the
    dollar, as the currency of international trade and world reserve.


    As Charles de Gaulle said in his famous speech mentioned in chapter 7:


    *“*The fact that many countries accept as a matter of principle that dollars are
    as good as gold means that Americans are borrowing for free at the expense of
    other countries. For what the U.S. owes, it pays, at least in part, with money
    that only it can issue.


    We consider it necessary that international trade should be based on an indisputable
    monetary standard, and that it should not bear the stamp of any particular country."


    These words are undoubtedly enlightening, because if we analyze the public debt,
    which is very high worldwide, but absolutely unsustainable in Western countries,
    with the United States leading the way with almost 32 trillion and a debt/GDP
    ratio of 128% in 2022, the same debt/GDP ratio will reach 100% in Europe and 259%
    in Japan.


    We could assume that Western countries, including Japan, are in fact sustaining
    the economy thanks to a constant issuance of money, which devalues our currencies.


    The case of Japan stands out in every index we can analyze. Over the past decade,
    the Bank of Japan (BoJ) has managed to gobble up 80% of Japan''s exchange-traded
    funds (ETFs), which represent about 7% of the country''s $6 trillion stock market,
    as well as 40% of all government debt.


    Reference:


    How much of the Japanese stock market is held by the BoJ. BlackBull Markets ([blackbullmarkets.com](http://blackbullmarkets.com))


    [https://blackbullmarkets.com/en/market-reviews/how-much-of-the-japanese-stock-market-does-the-boj-own/](https://blackbullmarkets.com/en/market-reviews/how-much-of-the-japanese-stock-market-does-the-boj-own/)


    But this process has accelerated over the past decade.


    Japan''s massive government debt is being bought almost entirely by the Bank of
    Japan, or in simple terms, all of Japan''s gigantic government debt is being bought
    with new money created by the Bank of Japan, and this situation has led Japan
    to the highest rate of inflation and the largest decline in the value of the yen
    against the dollar in 32 years.


    If our economy is sustained by the constant creation of money out of thin air,
    there will be a loss of confidence and a monetary reset will be inevitable.


    The BRICS countries, led by Russia and China, are already working on a new international
    currency that will most likely be backed by their gold and commodity reserves,
    as both are also the largest gold producers.'
