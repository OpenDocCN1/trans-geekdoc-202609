- raw: 'The material to be used for all coins was also specified: copper for the half
    and one cent coins, silver for the ten cent, quarter, half and whole dollar coins,
    and gold for the five-, ten-and 2.5-dollar coins. This decimal system was very
    different from the rest of the foreign currencies with the purpose of establishing
    a new national identity.


    The production of the first coins in the House of Philadelphia was not put into
    circulation until 1794, the coins which, as we have mentioned, followed the model
    of the Spanish "Piece of Eight", were of the same size and were also made of silver.
    They were in circulation until 1935 and were called "silver dollars".


    The "Piece of Eight" was a silver coin with a value of eight Reals, minted by
    the Spanish monarchy since the 16th century.


    It was the first universal currency and the first legal tender in the United States
    until 1857. Its design, size, and silver weight inspired the symbol of the dollar.


    **Introduction of the first green Dollar notes.**


    Abraham Lincoln Dollars were demand notes redeemable for gold or silver at seven
    designated banks in the country. These notes were issued in 1861 and 1862 during
    the American Civil War. There was also the Gold Dollar, a gold coin minted from
    1849 to 1889.


    In 1861, funds were needed to pay for the war against Southern secessionists,
    and Congress authorized the Treasury Department to issue interest-free demand
    notes called greenbacks, named for the ink used on the back.


    Later, a new currency known as United States Notes or Legal Tender Notes, also
    green, was issued. In 1862, these notes began to have geometric patterns and fine
    lines that became a seal of the Treasury Department, details that prevented counterfeiting.
    This is the origin of the current dollar bill.


    Note that, except for brief periods, the bills were promissory notes redeemable
    in gold.


    *The convertibility of the dollar into gold was “definitively suspended” in 1971,
    during the Nixon presidency, due to a* massive flight of capital from the country
    and the crisis of the international monetary system after the Bretton Woods agreement
    (1944), where it was "agreed" that the international monetary standard would be
    governed by the US dollar, but backed by gold, guaranteeing the interchangeability
    of dollars for gold, at a price of 35 dollars per troy ounce of gold.


    This period of mistrust of the United States as a guarantor of the value of dollars,
    as if they were gold, began after Charles de Gaulle demanded the return of gold
    to France in exchange for the dollars in its reserve.


    The war effort of the Vietnam War forced the U.S. government to issue money without
    gold backing, which increased mistrust, caused exchange rate misalignments, inflation,
    and volatility in the financial markets, leading Nixon to "temporarily suspend"
    the exchangeability of dollars for gold. Needless to say, the "temporary suspension"
    became de facto permanent and is still in effect today.


    De Gaulle famously argued that a gold-based monetary standard would keep public
    spending under control and *prevent an economic crisis at the hands of “the money
    masters”.*


    Speech by Charles De Gaulle, 1965:


    "The fact that many countries accept as a matter of principle that dollars are
    as good as gold means that Americans are indebted for free at the expense of other
    countries.


    What the United States owes, it pays, at least in part, with money that only it
    can issue.


    Given the serious consequences that could be unleashed in the event of a crisis,
    we believe that measures must be taken in time to avoid it.


    We believe it is necessary for international trade to be based on an indisputable
    monetary standard and not on the stamp of a particular country. What standard?
    The truth is that "no *other standard than gold is conceivable! ”*


    Once money loses its backing or exchangeability guaranteed by gold, as a scarce
    commodity that prevents its uncontrolled issuance, and becomes a monopoly of state
    governments, a degradation of the value of money begins through inflation, which
    continues to this day.


    The appetite for spending and the deficit of political power embodied in the states
    inevitably lead to an increase in spending without limit, or with a limit that
    rises as it is reached, and to its simplest solution, the issuance of new money.
    From that moment on, government spending, military budgets and wars have a seemingly
    "unlimited" source of financing.


    The assumption of the monopoly of money creation by the states is a relatively
    recent historical fact, since the value of money, which must necessarily be scarce
    to maintain its value, has been distorted ever since.


    Every time central banks issue or create money out of thin air, as when they "buy"
    private bonds of large corporations, banks, and public debt of states, or when
    they extend credit to commercial banks, they create fake money.


    Money as false as that printed by counterfeiters, because this new money is not
    backed by the value of new goods or increased services.


    Even worse, the value of this new money drains the value of the economy and the
    money already in circulation, because it creates inflation, stealing value or
    purchasing power from your savings, the fruit of our labor and the real economic
    activity of businesses.


    But the damage does not stop there, the false belief of political power that states
    can create money out of nothing, drives the appetite for unlimited spending by
    governments, and the misallocation of this resource extracted from the already
    existing money to finance the new political dogmas of each moment, as well as
    military expenditures.


    The role assigned to commercial banks has evolved with the history of money, when
    money was backed by gold and deposited in the safe vaults of private banks, that
    money issued as promissory notes, apart from enriching the bankers, was at least
    the representation of a tangible non-inflationary value.


    Kings and states used to need the credit provided by the banks, until finally
    the political power took over the monopoly of money issue, from that moment on
    the commercial banks became an interdependent appendix of the political power.


    Commercial banks obtain their profits, among other things, from the difference
    between the interest they pay when borrowing money from the central bank and the
    interest they charge their customers, individuals, companies and states, at which
    point the idea or question arises: Why should governments finance their public
    deficits by borrowing from commercial banks when they could obtain this cheaper
    financing directly from the issuer of fiat money, the central bank?


    Another way in which commercial banks benefit is through bank intermediation in
    the processing of money transfers and custodial services, but with CBDCs, transactions
    will be made directly between wallets without the need for bank intermediation,
    and the custodial service will be completely unnecessary as the money issuer and
    the digital wallet applications or wallets will have to guarantee this custody.


    Mortgage and consumer lending by banks could quickly be threatened by the government
    itself or by the issuer of the CBDC, since the privilege of having access to the
    full economic information of customers and businesses, and thus to the credit
    risk of the applicant customers, would give banks an insurmountable advantage
    in unfair competition with governments or central banks.


    If CBDCs are successfully implemented, commercial banks may become completely
    unnecessary; the very existence of these banks, at least in the form we know them
    today, will be doubtful unless the political power finds a way to give them some
    of the benefits of intermediation.


    Undoubtedly, during the process of implementing CBDCs, banks will play a role
    that is still necessary, but foreseeably unnecessary in the near future, once
    CBDCs are in place.'
