- raw: 'CBDCs will be centralized in the interest of the issuer, they will be subject
    to permission to use via a digital identity, and their issuance will be unlimited,
    just like physical money, so their value will tend to zero over time. We will
    discuss this claim below.


    We will analyze these premises point-by-point by looking at the reasons given
    by central banks for implementing CBDCs.


    1\. Improve efficiency: a CBDC could provide a faster and safer way of carrying
    out transactions, which could increase the efficiency of the financial system
    by eliminating the intermediation of banks or issuers of means of payment.


    2\. Elimination of Fraud: Because cash is anonymous and CBDC currencies are not,
    a CBDC could reduce or eliminate the possibility of tax fraud or other crimes
    by eliminating the need for physical cash.


    3\. Controlling the economy: By having direct control over the money supply, central
    banks could use CBDC to control the economy.


    4\. Compete with cryptocurrencies: Governments and central banks may want to issue
    their own digital currency to compete with cryptocurrencies and maintain control
    over the currency in circulation.


    Let''s analyze the arguments one by one


    1\. Improve efficiency.


    The current electronic payment systems that are so common today, such as cards,
    mobile devices and even smart watches, are so simple and convenient that the first
    question users will ask is How will CBDC benefit me over the electronic systems
    and cards I already use?


    Let''s remind ourselves that every time we pay with a card, which is a private
    means of payment and the most common in developed countries, we also pay the commission
    for using this means of payment. The bank and the card issuer charge these fees
    to the merchants, who of course pass them on to the customer in the final price.


    Usually, the commission percentage is around 1 to 3% of the transaction value
    for credit cards and 0.5 to 1% for debit cards. In addition to this commission,
    there may be other fees charged to the merchant, such as transaction fees or monthly
    point-of-sale rental fees.


    If we were to pay with CBDC in the near future, we could ask the seller for a
    discount for not using private means of payment. Since the seller would no longer
    have to pay these additional costs. However, it is very likely that governments,
    as a new hidden tax, or the central bank itself, to finance the CBDC infrastructure,
    will maintain these fees.


    Finally, the cost of the infrastructure needed to operate CBDCs will not be low.
    These costs, even if they are hidden, would have to be covered in one way or another
    by public spending. The business of banks and payment institutions will be subject
    to public competition in this particular vector of the banking business, and this
    will have such important consequences that we will have to analyze them in detail
    later in chapter eight.


    2\. Absolute elimination of commercial tax fraud.


    It is likely that governments and the central bank will force us to use CBDCs
    with a minor temporary incentive or, if necessary, with coercive measures such
    as the obligation to pay all fees, tariffs and taxes with digital currency, or
    directly by legal imposition.


    Once in place, it would be enough to charge banks and stores an additional cost
    for using physical money, or to restrict the accessibility of coin and banknote
    exchanges.


    This would cause merchants and businesses to refuse to accept physical money,
    which in practice would lead to the disappearance of cash from the streets.


    Even without having to ban it, and at that point, virtually all transactions will
    be conducted through the CBDC, and the government and the central bank, as well
    as licensed private entities, will have complete and absolute information about
    all the money we spend and receive.


    It will be completely impossible to avoid paying VAT and any other taxes and charges
    that may be added to the current ones.


    Just think, when we give our children money to buy sweets or ice cream, or when
    we receive any income, VAT or capital gains tax and probably gift tax, as in Spain
    for example, could be automatically deducted in the case of our child allowance.


    With the virtual disappearance of physical money in everyday life, everyone, including
    our youngest children, will inevitably need an electronic device or smart card
    to buy anything.


    3\. Improved accessibility.


    According to data from the Federal Reserve Bank of the United States (FED), in
    2019, 7.1% of US households did not have access to a traditional bank account.


    However, this percentage varies significantly by education, income, and ethnic
    group.


    For example, the percentage of households without access to a traditional bank
    account is 14.1% for low-income households.


    By education level, 12.7% of households with a high school education or less do
    not have a bank account.


    By ethnicity, 17.7% of Afro-descendants are unbanked.


    The percentage of unbanked people without access to any financial services can
    vary significantly between developed and non-developed countries, reaching as
    high as 70% in the so-called "emerging markets". We are talking about billions
    of people worldwide.


    The premise of providing these people with access to financial services with CBDC
    seems highly dubious.


    We should consider that the first requirement to access digital money is an electronic
    personal identification. Identification that many of these emerging countries
    do not yet have, and of course an electronic device and the necessary infrastructure
    for those devices.


    So probably all those people who do not meet the first requirement, digital identification,
    will be automatically excluded from the new monetary system.


    A Universal Digital Personal Identity will be mandatory because it will be not
    only your CBDC wallet, but also your national ID card, passport, health card,
    driver''s license, academic or professional degree certificate, public transportation
    pass, and even access to your workplace, home, and maybe even your gym.


    Now consider the consequences of a government arbitrarily deciding to block any
    or all of these functions, including your CBDC wallet. Authoritarian governments
    could do this directly, but even democratic countries already have the legal tools
    to take whatever measures are necessary, including "temporary" asset seizures,
    for example, in the event of a *“national security threat”.*


    Think about what would happen in the event of software failure, natural disaster,
    war or force majeure, or simply hacking or identity theft.


    4\. The control of the economy.


    Central banks have the disproportionate privilege of controlling the economy,
    or rather of trying to control it, because we all notice that almost without getting
    out of one crisis, the next one follows, and with each one the control, surveillance
    and restrictions on the economy and on individual and collective freedoms increase.


    It is shocking to hear Christine Lagarde, the current president of the European
    Central Bank, advocate a CBDC because "it will be the only way to have the backing
    of a central bank", when any observer with a minimum of education in history or
    economics will realize that the management of the economy has been disastrous
    since the introduction of central banks, and especially since the beginning of
    the era of fiat money, backed only by the imposition of the binomial: Government
    + Central Bank.


    Definition of Fiat Money: A currency that represents a value that it does not
    intrinsically have.


    Fiat money has no intrinsic value and is not backed by the precious metal reserves
    of its issuer; its value exists because the law says it has that value.


    Since 1971, when Richard Nixon "temporarily" suspended the convertibility of the
    dollar into gold as the world''s reserve currency under the Bretton Woods Agreements
    (1944), money has basically been backed by legal tender, and the current era of
    fiat money began definitively, not temporarily.'
