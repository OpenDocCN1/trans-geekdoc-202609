- raw: 'A share refers to a single unit of ownership in a company. If a company is
    divided into multiple units of ownership, each of those units is called a share.
    These shares are issued by the company to raise capital, and shareholders who
    own these shares are entitled to a share of the company''s profits, as well as
    the right to vote on certain matters.


    On the other hand, stock refers to the total ownership units in a company represented
    by shares. Thus, "stock" is a more general term that includes all shares issued
    by a company.


    In practice, the terms "share" and "stock" are often used interchangeably to refer
    to ownership interests in a company. However, in certain contexts, such as legal
    documents or financial statements, the distinction between the two terms can be
    important.


    Stock market value is calculated by multiplying the current price of a share,
    or the price at a given time, by the total number of shares of that company.


    **Sell short. Short selling.**


    A "short" in the stock market is an investment technique that allows investors
    to bet on the decline of a security or index. This technique is used to make a
    profit when the stock price falls and is known as "short selling" or "short position".


    It works as follows.


    If an investor believes that a security or stock will go down in price, he can
    borrow a certain number of those shares, paying an amount, let''s say as a "rent"
    or loan, to the owner, with the obligation to return them at the expiration of
    the "short" contract.


    As soon as the investor receives the shares, he sells them and waits for the price
    to fall.


    When the price has fallen, he buys them back at a lower price and returns them
    to the owner who lent them to him.


    The profit is the percentage drop minus the amount he had to pay for the "rent"
    or loan.


    Short''s technique is risky and complex and is usually done with a rollover, which
    increases the risk exponentially. The worst scenario for a short is that the shares
    that were expected to go down start to go up, so the short seller has to buy them
    as soon as possible because he will be forced to give them back and now he has
    to buy them more expensive.


    If a stock has many short sellers, they can force the stock to go down in price,
    but if the opposite happens and the stock starts to go up, all the short sellers
    will rush to buy as soon as possible so that they can return the shares they borrowed
    to short, since the increase in price will cause them losses because they will
    have to buy them back more expensively.


    If many short sellers rush to buy the shares to be returned, it will cause an
    accelerated rise in price, creating a chain reaction that will trap other short
    sellers who will also be forced to buy to mitigate the losses.


    In general, these types of events are extremely abrupt and, as mentioned, are
    usually leveraged, which usually results in forced liquidations of positions with
    huge losses for the short sellers.


    These market events are known as "short squeezes".


    **Solvency.**


    Solvency refers to the ability of a company or individual to meet its long-term
    financial obligations, i.e., its ability to pay all outstanding debts in the future.


    Solvency should not be confused with liquidity, which refers to the ability of
    a company or individual to meet its short-term financial obligations, i.e., to
    pay its immediate debts.


    **Spread.**


    The difference between two prices, interest rates or yields on different financial
    instruments.


    In the foreign exchange market, the spread is the difference between the bid and
    ask price of a currency pair, where the spread represents the broker''s profit.


    In the bond market, the spread is the difference between the yield on one bond
    and the yield on another bond with a similar credit rating.


    **Stablecoin.**


    A stablecoin is a type of cryptocurrency that is tied to another asset, such as
    a fiat currency.


    For example, one unit of a stablecoin may be equal to one U.S. dollar.


    The issuing company must hold one unit of the linked currency as backing for each
    unit of cryptocurrency issued.


    Some of the best known are USDT or Theter, and USDC from Circle.


    **Stock Exchange**.


    The stock exchange is a market or institution where stocks, bonds, and other financial
    instruments that represent the value of a company or debt are bought and sold.


    The exchange allows investors to trade these instruments for the purpose of making
    profits or financing businesses.


    The first official stock exchange was established in 1602 in Amsterdam by the
    Dutch East India Company, which was the first to issue shares to the public, marking
    a financial breakthrough by dividing into equal parts (shares) the capital needed
    to finance a company that would also share its profits (dividends) in proportion
    to the number of shares owned by each shareholder.


    Until then, business activities usually required a financier who provided a large
    amount of capital and was the sole owner of the company and the sole recipient
    of any profits.


    By dividing capital into many smaller pieces, companies could raise capital from
    many investors.


    This development led to a great economic boom that spurred trade and, later, the
    Industrial Revolution.


    **Supply and demand.**


    These are the two basic concepts that explain how markets work, where supply is
    the amount of a good or service that producers are willing to sell at a given
    price, and demand is the amount of a good or service that consumers are willing
    to buy at a given price.


    If supply is greater than demand, prices will tend to fall because sellers will
    have to compete with each other by lowering prices to attract buyers; on the other
    hand, if demand is greater than supply, buyers will have to compete with each
    other by offering a higher price to buy the goods or services offered, so the
    price will tend to rise.


    **Swap.**


    A swap is a financial contract in which two parties agree to exchange future cash
    flows according to agreed-upon terms.


    Swaps can be interest rate swaps, currency swaps, or swaps on other financial
    assets.


    For example, a company that has a fixed interest rate on a loan may agree to exchange
    cash flows with another company that has a floating interest rate on a similar
    loan.


    This allows the company to convert its fixed interest rate to a variable interest
    rate, which can provide greater financial flexibility and reduce interest rate
    risk.


    Another common type of swap is a currency swap.


    For example, an American company may need euros and a European company may need
    dollars for their respective operations.


    Instead of using a currency swap, they could agree to a swap, which is an agreement
    for a fixed period of time in which the European company sends Euros to the American
    company and the American company sends Dollars to the European company, according
    to the exchange rate fixed at the time the swap is entered into, plus an interest
    rate that attempts to anticipate possible changes in the euro/dollar exchange
    rate.


    **SWIFT.**


    Society for Worldwide Interbank Financial Telecommunications.


    It is a global financial messaging network used by banks and other financial institutions
    to exchange information and conduct financial transactions in a secure and reliable
    manner.


    The SWIFT network is owned by its members and managed by the SWIFT Cooperative,
    headquartered in Belgium.


    **Token.**


    They are digital assets that represent a specific value or asset and are used
    in the cryptocurrency and blockchain world for various purposes, such as representing
    real assets, crowdfunding and speculation.


    Tokens differ from bitcoin in that they are designed to represent a specific value
    rather than being used as a form of payment.


    **Trust (Company) / Trustee.**'
