    许多公司和初创企业已经实施了数字识别系统，但还有很长的路要走。


    # 迈向单一欧洲数字身份。


    ### 参考：

    欧洲数字身份：轻松访问关键服务 | 新闻 | 欧洲议会 (europa.eu)


    欧洲数字身份正与欧洲央行数字货币（CBDC）——`数字欧元`的发展同步快速推进。


    根据欧洲议会的发布，数字身份的定义如下：


    ## 什么是欧洲数字身份？


    欧洲数字身份（`eID`）允许不同欧盟国家的电子识别系统相互认可。换句话说，它允许欧洲公民在线识别自己的身份并验证个人信息，而无需依赖商业提供商。欧洲数字身份的“益处”是什么？


    欧洲数字身份可用于访问公共服务，例如：

    * 请求出生证明和医学证明。

    * 通知地址变更。

    * 开立银行账户。

    * 报税。

    * 申请大学名额，无论是在您的居住国还是另一个欧盟国家。

    * 获取可在欧洲任何地方使用的医疗处方。

    * 年龄证明。

    * 使用数字驾照租车。

    * 办理酒店入住。


    这仅仅是数字身份在绝对所有方面都需要的一个示例。


    然而，对于上述列表中的所有示例，我们现有的文档已经足够了，因此不需要额外文档，访问我们的药物除外，这当然允许我们在访问医疗史之外访问我们的健康数据。


    我们必须意识到，整个数字身份验证基础设施将外包给云服务巨头（互联网服务），如 `Amazon Web Services`、`Google Cloud`、`Microsoft
    Azure`，它们已经外包了某些国家大部分公共甚至军事数字基础设施。


    如果这些服务发生崩溃、黑客攻击，甚至在混合或网络战争背景下发生敌意行动会发生什么？


    我们应该记住，当我们的数据“存储”在中央计算机存储系统中时，它不再属于我们，而是该计算机系统的管理员所有并受其控制。


    理解这一概念极其重要。这与数字货币相同。


    当我们的数据作为信息记录存储在计算机系统中时，它是脆弱的，因为信息可以被轻易更改或删除，不像我们手中的实体文件。


    您希望与此欧洲数字身份关联的数据高度敏感，并且目前受到隐私法律的专门保护，从理论上说，这些法律应确保只有在我们知情并同意的情况下、且在必要时才使用这些数据。


    如果您的个人信息和医疗记录存储在计算机系统中，这些信息可能会在在我们不知情不同意的情况下被访问。


    这些信息可能会被全部或部分更改或删除，而我们无能为力。


    我们某些数据的访问、更正或删除可能会由数据的真实所有者（系统管理员根据政府指令设定条件或进行限制，更不用说由于是集中化的，它很容易受到黑客攻击。


    我们倾向于认为这些事情不会发生，但事实是它们在过去发生过，并且还会再次发生。


    ### 西班牙。2022 年 11 月 11 日。


    #### 司法部门黑客从国库盗走了五十万纳税人的数据。

    国库遭到黑客：一次危险的网络攻击盗走了超过 50 万西班牙人的数据 - [Crast.net](http://Crast.net)

    情报部门提到了一场前所未有的数据泄露，其中包括约 5 万名国家警察警察部队成员的姓名、身份证号或地址。


    #### 2022 年 11 月 21 日。

    黑客入侵西班牙经济部。

    西班牙劳工和社会经济部遭受网络攻击 ([bleepingcomputer.com](http://bleepingcomputer.com))

    上周一，一名公职人员看到他们远程访问了西班牙所有经济信息的网络：警方正在秘密调查。

    针对 `CGPJ` 的网络攻击盗走了所有纳税人的数据。

    这些计算机攻击随后被政府在一份简短公告中否认，未提供任何额外信息。

    “部门所有的网络安全系统均处于激活状态并受到持续监控。不存在零风险的说法，面对互联网风险时必须保持极端谨慎。”


    我们想指出，一个开发和实施良好的 `CBDC` 系统对于金融市场中所有类型交易的结算可能非常高效，这些交易很可能通过注册在 `blockchain` 中的代币化资产进行管理。


    如上所述，许多 IT 专家预测区块链革命将永远改变金融市场的所有机制。


    股票或证券、ETF 或股份、看涨或看跌期权、债券、信托、贷款、物业所有权，所有、绝对所有的金融资产将以数字代币的形式存在并在一个或多个 `Blockchains`
    中管理。每个代币将与数字身份相关，所有类型的资产都可以从计算机或智能手机上的 App 进行管理。


    在这种情况下，任何交易的支付和收据或货币结算都可以通过 `CBDC` 系统高效处理。


    很有可能实施两种 `CBDC`：批发型（Wholesale），供政府、银行和公司专门使用；零售型（Retail），供公民使用。


    # 第 7 章

    ## 安全和经济方面的潜在收益。


    如上所述，`bitcoin` 区块链并不以效率或速度著称，因为它追求的是绝对的安全。每个区块之间 10 分钟的间隔对于大量节点验证每笔交易是必要的。这不是一个缺陷，而是其设计的固有特征，但使得它对于管理商业所需的快速交易用途较小，除非使用二层协议
    `Lightning Network`。


    相比之下，仅有少数节点的区块链或中央数据库将适用于大量交易，就像现在的信用卡或借记卡支付系统一样。


    集中的 `CBDC` 应适用于超快速交易，也可用于结算目前依赖私人银行间支付和结算系统的金融产品。


    这再次表明，银行至少按我们所了解的样子将变得完全无用且可以被。


    国际结算银行的 `mBridge` 项目将成为使 `CBDCs` 实现全球互操作的桥梁，预见的是，这将导致集中的全球控制。


    集中的、可追踪的受监控的数字货币将许多许多犯罪变得非常困难；任何盗窃将几乎是不可能的，因为被盗资金必然从一个钱包移动到另一个钱包，且都被完美识别和定位。


    犯罪分子真的必须寻找新的方法来“清理”他们的非法操作。


    当局的全方位追踪允许检测任何欺诈或腐败行为，只要交易账本可以公开审计，技术上允许，但政治权力可能不允许。


    不仅是个人，公司和公共机构也将将拥有钱包，他们所有的交易都是可追溯的，我们很希望认为这样任何资金挪用都能得到有效打击，并识别责任人。


