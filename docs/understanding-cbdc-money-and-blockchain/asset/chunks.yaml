- raw: 'It is also a risk a possible access or even a modification of the accounting
    entries of the system by an external or internal malicious agent, which for example
    will create false funds in the system database, giving these funds to your wallet,
    at this point we must consider crucial security not only for access but for the
    modification of the database, and it is at this point where we can understand
    that the digital identity is absolutely essential to control this risk.


    For all these assumptions, blockchain database technology has demonstrated absolute
    reliability, although it is not as fast or efficient as other types of databases,
    in fact it is quite slow, it provides the security, reliability and immutability
    required to process monetary transactions or value transmission, although it is
    less efficient in terms of speed.


    This feature is not a defect of blockchain databases, it is a feature sought by
    their design, where absolute security is prioritized over any other criterion,
    using decentralization, distribution and immutability.


    **How a Blockchain Database works.**


    To explain how it works, I''ll use the bitcoin blockchain as an example, because
    since it was created on January 3, 2009 at 18:15, the bitcoin blockchain has demonstrated
    absolute solidity, without a single interruption, working with absolute reliability,
    despite being attacked even with the means of government organizations.


    However, I will abstract from the more technical details related to the Bitcoin
    protocol.


    The author''s interest is for the reader to understand the basic functioning of
    a blockchain database and the huge revolution it represents if we want to guarantee
    the security and immutability of the recorded data.


    Many experts in information technology, economics, management, etc. already foresee
    a near future where all transactions, not only of digital money like CBDC or Bitcoin,
    but also of stocks, bonds, options, notes, contracts, real estate titles, ownership
    of all kinds of tokenized goods, digital identities, etc. - the list would be
    even longer - will be recorded in blockchain databases.


    A crucial feature of a blockchain-based database is whether the access to query
    the data is public or whether this access is permissive.


    On the bitcoin blockchain, access is completely free and all content is public.


    With a purely digital monetary system based on the Blockchain, the transparency
    of public institutions and all government agencies could be audited down to the
    last cent, provided that access to the ledger contained in the Blockchain as a
    query is also public. There will be no credible excuse to prevent citizens from
    consulting or auditing public accounts and transactions on the blockchain.


    Let''s explain the bitcoin blockchain.


    The bitcoin blockchain is a digital database that records all bitcoin transactions
    in cryptographically linked blocks, like an accounting ledger.


    It is a decentralized and public system that does not rely on a central authority
    or main server.


    The Bitcoin protocol establishes three types of actors in the Bitcoin network
    and blockchain, which are Wallets, Validator Nodes, and Mining Nodes.


    The wallets have several functions, the main ones are to send and receive bitcoin,
    or rather the messages of sending and receiving Bitcoin from or to another wallet,
    which once registered in the Blockchain are considered irreversible and immutable,
    as well as to store the Private Key with which you will sign each transaction.


    We must understand that a bitcoin wallet does not store bitcoins, it only stores
    the private cryptographic key that allows to sign spending transactions.


    In fact, the more appropriate name should be keychain and not wallet.


    Wallets connect to the bitcoin network and can display bitcoins received and sent,
    and calculate the balance between those received and those spent or sent. The
    bitcoin blockchain does not keep track of how much bitcoin an address holds, only
    the inflows (received) and outflows (sent) in the manner of a ledger.


    When a bitcoin wallet is installed, a new private key is created using a cryptographic
    algorithm that can never be shared, and a public key or address, or set of addresses
    derived from that public address. Each of these is a long string of alphanumeric
    characters, which we call addresses, from which bitcoin or fractions can be sent
    or received.


    The private key is used to generate the digital signatures of outgoing or spending
    transactions when we send bitcoin. The public key is used to verify the authenticity
    of the digital signatures generated with the private key without knowing the private
    key.


    Cryptography makes it possible to verify mathematically that the digital signature
    of a transaction can only be signed by a unique private key, knowing only the
    public key derived from that unique private key.


    The wallet application is designed to manage the entire set of addresses from
    which bitcoins or fractions of bitcoins are received and sent, showing the owner
    the outgoing or sending, incoming or receiving, and unspent balance.


    When the user of a wallet decides to send bitcoin, automatically and transparently
    to the user, his wallet generates an outgoing or spending message, which very
    briefly includes his own address, the amount to be sent from the bitcoin or fractions
    of bitcoin he has previously received and not yet spent, the destination address,
    a date and time stamp, and the digital signatures that unequivocally prove that
    the bitcoin or fractions of bitcoin he is sending, called "Satoshis", have been
    received and not previously spent, which proves that he is the holder, until the
    sending transaction is completed and added to the blockchain, at which time the
    new owner of that bitcoin or its fractional Satoshis is registered, who will be
    the holder of the wallet with the destination address, and of course the digital
    signature that authorized this transaction is also included.


    Each transaction contains all the signatures of all the previous owners of that
    bitcoin or fraction, so it is easily traceable back to the initial point where
    that bitcoin or fraction was mined (or minted) by a mining node.


    This verification process seems tedious, but a computer can perform it in milliseconds.


    In addition, the wallet will add a small commission to the transaction to compensate
    the mining nodes for processing this transaction, many wallets allow the user
    to select what amount they will add as commission, if we want this transaction
    to be processed quickly, as in the next block, we should increase the commission
    we will pay, if we put a very low commission, this could be delayed.


    The volume of transactions at a given time determines the price of the processing
    fee. At a time of high demand for transactions, the miners will only include those
    transactions that have a higher commission added as a tip, since these commissions
    are received by the mining node that manages to close and include a new block
    in the chain.


    The price of the commission for the miners to process the transaction is given
    on the one hand by the length in bytes of the transaction, which includes all
    the data and all the previous signatures of the bitcoin sent, and on the other
    hand by the demand to add new transactions to the blockchain.


    Once the message or transaction is sent by the wallet to the bitcoin network,
    it is received by the validator nodes and the mining nodes.


    At the core of the consensus protocol (proof of work)\* are these two main participants
    in the network: miners and validator nodes.'
