    ![cover](Images/cover.jpg)


    A critical approach to the greatest revolution since the invention of the printing
    press, or the dystopia that will change the world as we know it.


    What they are, how they will work, the social and economic implications and how
    they will forever change the monetary system as we know it.


    Dedicated to my wife Silvia and my son Xabier.


    May 2023.


    ## INDEX


    * [1. Legal Notice and Prologue](#04_1__Legal_Notice_and_Prologue.html#page_1)

    * [2. Introduction to CBDCs. What they are and why they are being developed](#05_2__Introduction_to_CBDCs__What_t.html#page_5)

    * [3. Understanding Money. History and Evolution of the Monetary System](#06_3__Understanding_Money__History.html#page_17)

    * [4. Differences with cryptocurrencies like Bitcoin](#07_4__Differences_with_cryptocurren.html#page_39)

    * [5. Vision of the underlying Technology and Blockchain](#08_5__Vision_of_the_underlying_Tech.html#page_55)

    * [6. Use cases compared to current Systems. Digital Identity](#09_6__Use_cases_compared_to_current.html#page_71)

    * [7. Potential real-world benefits in Safety and Economy](#10_7__Potential_real_world_benefits.html#page_81)

    * [8. Challenges and Concerns. Disruption to the current role of banks](#11_8__Challenges_and_Concerns__Disr.html#page_87)

    * [9. Likely Evolution and Impact on Geopolitics and the Global Economy](#12_9__Likely_Evolution_and_Impact_o.html#page_101)

    * [10. Real life application. Control and surveillance. Restrictions on freedom](#13_10__Real_life_application__Contr.html#page_111)

