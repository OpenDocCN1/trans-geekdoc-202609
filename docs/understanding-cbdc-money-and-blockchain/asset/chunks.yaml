    The hash function of the algorithm is also used to generate the private key and
    public key used in bitcoin to encrypt or verify a message or transaction. This
    pair is also known as a private key and public key, or asymmetric cryptography.


    We can verify with full mathematical certainty that a message, such as a transaction,
