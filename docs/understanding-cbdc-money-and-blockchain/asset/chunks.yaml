- raw: 'So far, we have defined what money is and its properties, although there are
    several other definitions that we will see later, we will briefly review the history
    of money to discover how we achieved the physical money that we still use.


    Undoubtedly the first form of transactions between individuals in a society was
    barter, our ancestors exchanged one good they had for another that they might
    need, let''s take an example, imagine a Neanderthal who was very skilled at carving
    bone hooks with which to fish, but somewhat clumsy at carving arrowheads, if he
    wanted to eat meat instead of fish, he could exchange a hook for an arrowhead
    with a fellow arrowhead maker.


    The problem is that the work, skill, and difficulty of finding the right stones
    to make arrowheads makes them more expensive than bone picks, so barter was so
    impractical that our Neanderthals probably quickly abandoned this system and most
    likely began to value their goods by trading them for other specific, easily quantifiable
    goods, such as beads, which they could easily wear, or shells, as long as there
    weren''t a lot of shells around.


    The reason for this is obvious: in a coastal location, the shells of marine animals
    may be so abundant and easy to find that they have no value as a medium of exchange.


    With this example, we can see that beads or shells (if scarce at the site) have
    many of the properties of money mentioned above.


    They were widely accepted by the Neanderthal group because they were easily quantifiable,
    fairly durable, and easily transported.


    With the example of shells, we discover that when a good is very abundant and
    easy to obtain, it has low value, or rather we assign low value to it, this concept
    must be remembered every time we think about money, the value and the price of
    goods or services are very different things.


    In the days following the terrible earthquake and tsunami that devastated Japan
    in 2011 and caused the Fukushima nuclear power plant disaster, an alert was issued
    for possible radioactive contamination of Tokyo''s tap water. Until the alert
    was lifted, Tokyo residents could buy any luxury goods in the stores of Shibuya,
    but they could not buy bottled water, no matter how much money they paid, because
    the value of water could not be paid for with money during those hours.


    This leads us to think about two concepts that are often related but very different:
    value and price.


    A good can change its price quickly if the circumstances of its availability (also
    called supply) cause our estimate of its value to change.


    If a necessary good is very scarce, it will be valued and expensive; on the contrary,
    if a good, even a vital one like drinking water, is abundant, it will have a low
    price.


    Therefore, scarcity is an essential property of money.


    After the radioactive contamination alarm passed and the supply of bottled water
    was restored, it quickly returned to its usual price.


    With the progress of time and technology, our ancestors discovered that the best
    money, according to the properties mentioned, was metals, first bronze, and soon
    gold and silver. Their price was quickly fixed according to their characteristics;
    in the case of metals, the scarcest and most costly to find, gold, was the one
    that reached the highest value just because of its properties.


    In the case of metals, the scarcest and most hard to find, gold, was the one that
    attained the highest value precisely because of its scarcity.


    If we think about it rationally, gold is only valuable because of its scarcity,
    since its properties as a metal can be satisfied by other alternative metals that
    are more abundant and therefore cheaper.


    Bronze and silver coins could be used to trade goods of small value, but gold
    was reserved for larger payments, although its weight and especially the possibility
    of theft made it risky to transport.


    At that time, the goldsmiths, the first artisans to work with precious metals,
    invented the following system:


    "Leave your gold coins in my secure vault, I will give you a paper note with my
    signature and seal in the form of a receipt or certificate of deposit, which today
    we would call a bill of exchange, and when you want them back you can bring the
    receipt or certificate of deposit and I will return your gold coins.


    So, a paper note, signed and stamped by a goldsmith, was in effect the value of
    the coins stored in the goldsmith''s secure vault.


    This is the concept we call backing; the notes (today''s banknotes) were backed
    by the value of the gold deposited.


    Given the convenience and ease of transport of the goldsmith''s certificates,
    depositors rarely reclaimed their coins, as they could cover their expenses by
    exchanging the paper certificates.


    This was noticed by the goldsmiths (what today we would call bankers), who very
    soon began to create more paper certificates than the actual gold they held for
    their depositing customers.


    This made them very rich, of course, and also allowed them to lend money in the
    form of bills or promissory notes and charge interest, even though they didn''t
    really have enough real backing 1:1 with the physical gold stored in their vault.


    If a depositor asked for his coins back, there was no problem because the goldsmiths
    always kept a fraction of gold for such cases.


    The problem arose when, for some reason, many depositors came at the same time
    to collect their notes in the form of coins, only to discover that the goldsmith
    did not have all the coins because he had lent them to other customers.


    The happy idea of issuing more promissory notes or paper money than they had gold
    is called fractional reserve, it is the essential core of today''s banking business,
    and coldly analyzed it is actually a fraud, because the bankers make profits by
    lending money that is not theirs but that of their depositor customers.


    However, not only is fractional reserve banking perfectly legal, it is also the
    most common way to create new money.


    As I mentioned in the introduction, the reader may find some statements or concepts
    difficult to believe a priori because they remain hidden from the knowledge of
    the common citizen.


    Approximately 95% to 97% of the money in circulation today is electronic and has
    been created by commercial banks as debt through the granting of credit.


    Our current money is debt, it is created as debt, and at all times there is more
    debt than money.


    Only the remaining 3% to 5% would be coins and notes issued by the respective
    central bank.


    Reference: 97% Owned | Creation of Money | Finance Documentary | Debts Explained
    - YouTube


    97% Owned (2012)


    Director: Michael Oswald


    Writers: Mike Horwath, Michael Oswald


    How is this possible? You might think, well, let''s explain.


    Our money in a bank is nothing more than an electronic entry on an account that
    the bank keeps in a database in its computer system.


    *“*It''s basically an accounting trick.... Banks create money. They don''t lend
    it out, when a bank makes what is called a loan, it basically pretends that the
    money is written down... it has to invent the liability... that''s how the money
    supply is created.*”*


    Professor Richard Werner.


    Professor in banking and finance at Linacre College, Oxford.


    The borrower of the loan "receives" new money created out of nothing as a debt
    to be repaid with interest. Once repaid, this debt or liability disappears, leaving
    only the amount of interest paid as new money created by the bank.


    But that''s just the beginning, although we have mentioned the fractional reserve
    mechanism, let''s take a closer look at it.


    Fractional reserve is the system by which banks hold only a small fraction of
    their depositors'' money on deposit, on the assumption that many of their depositors
    will not demand their money at the same time.


    This allows the bank to lend its depositors'' money to other customers in the
    form of credits or loans, but to keep only a small fraction of its depositors''
    capital in this reserve.'
