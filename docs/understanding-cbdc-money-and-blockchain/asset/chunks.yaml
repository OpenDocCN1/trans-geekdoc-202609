  trans: '


    我们已经应对了与央行数字货币（CBDCs）相关的危险，例如对公民和经济的绝对控制，以及对自由可能的限制，但最基本的危险仅仅在于，CBDC 不仅加剧了社会最糟糕的政治控制，而且仍然是一种法币。


    我们已经知道，法币没有任何支撑，其发行没有限制，因此其价值趋向于零。所有法币的生命周期都以货币重置终结。


    ## 货币重置的本质


    货币重置（或货币重组）是一个引入新货币来取代现有货币的过程，通常发生在深度的金融和社交危机时期。它通常在公众对货币失去信心导致汇率下跌时，或者当一个国家经历恶性通货膨胀和/或破产时发生。


    货币失败的原因通常与政府过度负债以及人们认为政府已失去支付其债务的能力有关。阅读上述内容，我们可以意识到，所提到的情况对于当今的所有国家和法币来说是如此普遍，以至于让我们相信法币货币体系的崩溃并不遥远。


    这种认知，加上过度的支出，以及显然无法通过加收已经勒索个人、企业和国家经济的税收，可能导致对货币信心的丧失并使重置更有可能。


    ## 重置的机制


    货币重置的过程随时间变化，但通常涉及将旧货币兑换为新货币。人们被允许在一定限制内将其部分旧钞票兑换为新钞票或 CBDC，银行余额余额也是如此；极少会有 1:1
    的兑换，特别是对于大额余额，这实际上等于对财富的没收。


    在货币重置危机期间，企业也可能受到与个人“不同”的对待。特殊规则可能适用于某些类型的机构，如银行、养老基金、外国政府、国际机构、政府机构以及政府本身。


    `债券`和`货币市场基金`可能无法转换，因为它们构成了失败货币无法偿还的债务大部分。公司债券、抵押贷款、贷款和私人债务可以以旧货币形式存在，也可以转换为新货币，通常带有针对金融部门以及政治执政权力量身定制的“弹性”规则。


    新货币将带有“保证”的承诺，即它挂钩了某些有价值的事物，并承诺提供“保障”，以确保在之前的失败货币中看到的价值贬值永远不再发生。


    ## 地缘政治转向：多极世界


    观察西方国家与金砖国家（BRICS）集团之间日益紧张的地缘政治局势，显然我们正在走向经济碎片化，这将最终影响全球货币体系，形成一个开始被称为“多极世界”的新格局，而不是目前由美国领导的单极世界。


    ### 西方

    在西方国家，我们将包括美国、西欧所有国家、加拿大、澳大利亚、新西兰、韩国和日本。我们讨论的是少于 10 亿人口。


    ### 金砖联盟

    在`BRICS`（创始国的缩写）中，我们将巴西、俄罗斯、印度、中国、南非。但有一个很长的加入创始小组的候选名单，包括：沙特阿拉伯、卡塔尔、科威特、巴林、阿拉伯酋酋、阿根廷、伊朗、埃及和阿尔及利亚。


    注意，`BRICS` 将包括作为世界工厂、石油能源和原材料最大生产国以及农业食品生产巨头的中国。加上 14 亿人口的中国、另一个 14 亿人口的印度、18
    亿人的穆斯林世界，再加上来自巴西和阿根廷的 2.6 亿人，几乎是西方国家人口的五倍。


    这些国家拥有商品、制造业和具有巨大潜力的经济，以及年龄年轻的人口；相比之下，西方国家，尤其是欧洲和日本，已经由于低出生率面临人口老龄化问题。


    ## 参考资料与经济分析


    经济转向：金砖国家超越 G7 购买力平价（GDP）（[thenewcrypto.com](http://thenewcrypto.com)）


    金砖国家（巴西、俄罗斯、印度、中国和南非）在购买力平价（`PPP`）上领先。购买力平价（`PPP`）是衡量不同国家最终商品和服务的经济指标。国内生产总值（`GDP`）在全球范围内非常高，但在西方国家是绝对不可持续的，美国以
    32 万亿的 `债务/GDP` 比率处于 128%，而日本为 259%。


    二战后由美国领导的单极世界是基于二战后建立的，立了美元作为国际货币的地位。正如戴高乐在他在著名的演讲中提到的：


    > “许多国家接受美元等同于黄金的原则，意味着美国正在免费偿还债务。对于美国欠下的债务，它至少部分是用它可以发行的货币来支付。我们认为国际贸易应该基于一种不可争议的货币标准……”


    这些话无疑是具有启发性的，因为如果我们分析全球范围内极高的债务，西方国家包括日本实际上依靠不断发行货币来维持经济，这贬值了我们的货币。日本的情况在我们分析的每一个指数中都脱颖而出。在过去的十年里，日本银行（`BoJ`）成功收购了日本
    80% 的交易基金（`ETFs`），这些基金占该国 6 万亿股市市场的 7%，以及政府债务的 40%。


    '
