    外部或内部恶意代理可能访问甚至修改系统的会记账分目，这存在一种风险，例如，这会在系统数据库中创建虚假资金并将这些资金转入你的钱包。在此时，我们不仅要考虑访问的安全性，还要考虑数据库修改的安全性，正是在这一点上，我们可以理解到数字身份对于控制这种风险至关重要。


    基于这些假设，区块链数据库技术已经证明了绝对的可靠性，尽管它不像其他类型的数据库那样快速或高效（事实上，它非常慢），但它提供了处理货币交易或价值传输所需的安全性、可靠性和不可篡改性，尽管在速度方面效率较低。


    这一特性并不是区块链数据库的缺陷，而是其设计追求的特性，通过去中心化、分布式和不可篡改性，将绝对安全性置于任何其他标准之上。## 区块链数据库是如何工作的。


    为了解释其工作原理，我将以比特币区块链为例。因为自 2009 年 1 月 3 日 18:15 创建以来，比特币区块链展现了绝对的稳固性，没有任何一次中断，并以绝对的可靠性运行，尽管曾受到来自政府机构手段的攻击。


    然而，我将抽象与比特币协议相关的更多技术细节。


    作者的意图是让读者理解区块链数据库的基本运行机制，以及如果我们想保证记录数据的安全性和不可篡改性，它所代表的巨大变革。


    信息技术、经济、管理等领域的许多专家已经预见到一个不久的未来，所有的交易——不仅是如 `CBDC` 或 `Bitcoin` 等数字货币，还包括股票、债券、期权、票据、合同、房地产产权、各种代币商品的所有权、数字身份等（列表还会更）——将记录在区块链数据库中。


    基于区块链的数据库的一个关键特性是查询数据的访问是公开的，还是许可性的。


    在比特币区块链上，访问是完全免费的，且所有内容都是公开的。


    在一个基于区块链的纯数字货币系统中，只要对区块链中账本的查询也是公开的，公共机构和所有政府部门的透明度就可以被审计到每一分。将没有任何合理的理由阻止公民查阅或审计区块链上的公共账户和交易。##
    我们来解释一下比特币区块链。


    比特币区块链是一个数字数据库，它以加密区块的形式记录所有比特币交易，就像一个会计账本。


    它是一个去中心化的公共系统，不依赖中央权威或主服务器。


    比特币协议在比特币网络和区块链中建立了三种参与者，即 `Wallets`（钱包）、`Validator Nodes`（验证节点）和 `Mining Nodes`（矿节点）。


    `Wallets` 有多个功能，主要功能是发送和接收比特币，或者说是从另一个钱包发送或接收比特币的消息，这些信息一旦注册在区块链上就被认为是不可逆转且不可篡改的，还要存储用于签署每笔交易的
    `Private Key`（私钥）。


    我们必须理解，比特币钱包并不存储比特币，它只存储允许签署支出交易的私加密密钥。


    事实上，它的名称应该是钥匙链（keychain）而不是钱包。


    `Wallets` 连接到比特币网络，可以显示接收和发送的比特币，并计算接收与支出或发送金额之间的余额。


    加密技术使得从数学上验证交易的数字签名只能由唯一密钥签署。


    钱包应用程序旨在管理接收比特币或份额的地址集，并向所有者显示发送情况。

