- raw: 'A crypto-asset is a type of digital asset, or token, based on cryptography
    (a branch of mathematics) and blockchain, that has a certain market value by utility
    or demand and can generate income by selling it or exchanging it for goods or
    services.


    **Cryptocurrency.**


    It is a crypto-asset, but which, in addition to basing its value on a possible
    utility and/or demand, meets the characteristics that define money.


    In this author''s opinion, only bitcoin is a cryptocurrency, all other "cryptocurrencies"
    called alt-coins or alternative currencies are actually tokens or crypto-assets.


    **Cryptography.**


    It is a branch of mathematics that deals with the techniques of encrypting and
    decrypting, or encoding and decoding, information. Cryptography is based on the
    mathematical theory of numbers.


    **Currency.**


    Colloquially, they are used interchangeably, but currency is the physical unit
    or unit of account, and foreign currency refers to the generic name of a foreign
    country''s monetary units.


    The official name of China''s currency is the renminbi, but its basic unit is
    the yuan.


    **Dividends.**


    Dividends are the portion of earnings that a company distributes to its shareholders.
    Dividends are the primary way in which shareholders are compensated as owners
    of a company.


    **Dow Jones (Stock Index)**


    Usually refers to: Dow Jones Industrial Average, which is a stock market index
    consisting of the 30 companies with the largest market capitalization on the New
    York Stock Exchange, excluding transportation and utility companies.


    There are other specific indexes with the same name:


    **Dow Jones Industrial Average** (DJIA), mentioned above.


    **Dow Jones Utility Average** (DJUA): This reflects the securities of the 15 largest
    companies in markets such as gas and electricity.


    **Dow Jones Transportation Average** (DJTA) Includes the 20 largest transportation
    and distribution companies.


    **Dow Jones Composite Average** (DJCA) Index that measures the performance of
    the shares of 65 member companies of any of the above three main indexes.


    **Economy / Economics (Social science)**


    Economics is the social science that studies the laws that govern the production,
    distribution, and consumption of goods and services in the most efficient way
    to satisfy human needs.


    **Equity.**


    A company''s equity, commonly referred to as stockholders'' equity, is the amount
    of money that would be returned to stockholders if all of the company''s assets
    were liquidated and all of the company''s debts were repaid.


    Equity financing allows the company to raise sufficient funds without borrowing
    or incurring debt.


    Equity financing involves the sale of stock in the company. A portion of the company''s
    ownership is given to investors in exchange for cash.


    **ETF**


    From "Exchange-Traded Fund".


    An ETF is a financial instrument that is traded on an exchange and is designed
    to replicate the performance of a stock market index, a commodity, or a specific
    market sector.


    In a mutual fund, an investor usually cannot withdraw his participation until
    a predefined date, on the contrary, ETFs are investment funds that are divided
    into units, or "shares".


    Investors can buy and sell ETF shares on the stock exchange just like shares.


    **EURIBOR / LIBOR**


    Euro Interbank Offered Rate is the reference interest rate used in the European
    interbank market.


    The Euribor is calculated from the average of the interest rates reported by the
    banks in the sample. It is calculated daily for different maturities, such as
    1 week, 1 month, 3 months, 6 months and 1 year.


    LIBOR is similar to Euribor: London InterBank Offered Rate (LIBOR) is the daily
    bank rate based on the rates at which UK banks lend money to each other in the
    wholesale interbank market.


    Note that banks "declare" the interest rates they charge other banks, but are
    not actually required to document that they actually charge the declared rates.


    This detail has on several occasions allowed large banks to falsify the interbank
    interest rate and receive convictions, but with rather light economic sanctions.


    **Exchange Rate (Foreign Exchange).**


    The price of one currency expressed in terms of another currency, i.e., the number
    of units of one currency required to obtain one unit of another currency.


    Exchange rates between currencies should be freely determined by the market according
    to supply and demand, but governments and central banks try to intervene to change
    the exchange rate of their currency according to their interests. This usually
    has negative and counterproductive effects.


    **Fiat Money / Fiduciary Currency.**


    From the Latin "Let''s make it".


    A currency that represents a value that it does not actually have.


    All current national currencies are fiat, with the exception of Gold and Bitcoin.


    Fiat money is money that has no intrinsic value, nor is it backed by the precious
    metal reserves of its issuer; its value exists because the law says it has that
    value.


    **Financial Arbitrage.**


    A financial strategy that involves taking advantage of the difference in price
    between different markets for the same financial asset to gain an economic advantage.


    If a company''s stock is quoted at different prices in two markets, an investor
    can buy stock in the market where the price is lower and sell it in the market
    where the price is higher; this price difference is the profit.


    This type of operation is carried out automatically by computer systems with the
    so-called high frequency trading, in operations that can be carried out in milliseconds.


    The automatic arbitrage makes the price differences of the same asset tend to
    quote the same price, even if they are traded in different markets, quickly.


    **Financial Derivative**.


    A financial derivative is a financial product whose value depends on the value
    of another asset, called the underlying.


    More simply put, they are bets based on the price of another asset.


    An example of a financial derivative is a contract for difference (CFD). A CFD
    is a contract where the investor and the broker exchange the difference in the
    price of a particular underlying asset. For example, if you buy a CFD on Apple
    stock and the stock price goes up, the broker pays you the difference. If it goes
    down, you pay the broker.


    **Financial indicator.**


    A financial indicator is a numerical data point that provides information about
    a variable used to measure, for example, liquidity, solvency, debt, profitability,
    or simply the price of an asset over a period of time.


    There are many types of indicators, but there are two broad categories: leading
    indicators, which make it possible to predict a situation before it occurs, and
    lagging indicators, which show past performance.


    Numerical data can be used to create a graph.


    Visualizing data through graphs helps to identify patterns, trends, relationships,
    and data structures.


    **Financial Record.**


    A financial record is a document that details a company''s financial transactions,
    such as a receipt, bank statement or invoice, bank statements, payment vouchers,
    contracts, etc.


    Financial records are important because they provide evidence of a company''s
    business activities and serve as the basis for financial accounting.


    **Fintech.**


    Acronym for Financial Technology. It is a term that refers to the application
    of information and communication technologies in the financial industry, with
    the aim of improving and optimizing financial services. Fintech companies use
    technologies such as artificial intelligence, big data, blockchain, and automation
    to provide more efficient, convenient, and personalized financial solutions.


    Fintech companies offer a wide range of products and services, ranging from mobile
    banking apps, electronic payments, online lending, investment management, insurance,
    to accounting and corporate finance solutions.'
