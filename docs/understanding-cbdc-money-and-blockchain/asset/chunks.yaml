- raw: 'Absolute surveillance is only the first step, with the information obtained
    in various ways, mainly on the use, origin and destination of our money, it will
    be the governments that will exercise their powers of control, not the issuer
    of this digital money, which in Europe would be the ECB.


    Governments would not only be able to see each and every movement of our digital
    wallets, they would also have the legal power to freeze, confiscate, collect current
    and future taxes, withhold certain funds, reverse transactions, effectively and
    immediately collect penalties for non-compliance with any regulation, they could
    also set an expiration date on the money received, prevent or limit savings on
    the pretext of promoting consumption and economic activity, as well as impose
    spending limits on products based on arbitrary criteria "always for our health"
    or based on our carbon footprint "to save the planet".


    They could charge negative interest on their money, depending on each citizen''s
    social score, according to an index of obedience called "social credit" that already
    exists in China.


    "Negative interest" is a euphemism for a tax on savings; instead of rewarding
    savers'' deposits with a certain amount of interest, they could be penalized with
    the aim of encouraging consumption and stimulating the economy.


    Of course, in so-called "democratic" countries, this term will be changed to a
    friendlier name as an index of compliance with ESG criteria.


    The acronym ESG stands for Environmental, Social and Governance factors, which
    are used by the World Economic Forum to assess the impact and responsibility of
    companies and individuals.


    These criteria are increasingly being used to force companies to comply with the
    2030 Agenda, also published by the World Economic Forum, or else the asset management
    giants will not provide investments if these factors are not met.


    Several U.S. states have prohibited their respective public and state pension
    funds from investing in asset management funds that seek to impose these ESG criteria,
    as they have clearly proven to be counterproductive to the benefit of investors.


    State attorneys from 19 states wrote a letter to Black Rock Company CEO Laurence
    D. Fink warning that BlackRock''s ESG investment policies could be a "rampant
    violation" of the "single-interest rule," a legal principle that requires investment
    fiduciaries to act "to maximize financial return, not to promote social or political
    objectives."


    References:


    ESG investing becomes a lightning rod in American politics - CNA ([channelnewsasia.com](http://channelnewsasia.com))


    Conservative group takes anti-ESG campaign to the next level ([axios.com](http://axios.com))


    The use of financial and economic coercion has become a political weapon, but
    historical experience shows that when the economy is driven by political rather
    than economic factors, it always ends in disaster.


    Another possibility for the use of CBDC digital money would be to enforce "sanctions"
    against any product, brand, company or country that is designated as hostile by
    preventing transactions with a blacklist of individuals, companies or countries
    that the government deems "sanctioned". We must understand that the euphemistic
    term "sanction" really means boycott.


    It will be particularly easy to block any transaction outside of the geographic
    area your government deems appropriate for you, thus restricting citizens to your
    zip code, city, region, or country, depending on the movement permissions you
    have been granted.


    The new concept of "15-minute cities" is already emerging as a first step in Overton''s
    time window.


    Cities or neighborhoods where the average citizen should be able to meet all his
    or her needs without moving more than 15 minutes on foot or by bicycle, where
    the average car will be a luxury, thus saving energy to help "save the planet".


    Overton''s time window of 15-minute cities could be implemented like this:


    Year one, this 2023.


    The mass media of disinformation will tell you how good it would be for the planet
    to have commutes of no more than 15 minutes if you could satisfy all your needs
    in your neighborhood.


    Year 2.


    To save the planet, a small toll would be charged that would be automatically
    deducted from our CBDC wallet when your cell phone or car is detected beyond its
    15-minute area of coverage from your residence.


    In Spain, automatic vehicle identification systems are already being installed
    on the roads to pay the new road tax or toll, as was done in Portugal in the years
    following the 2008 crisis, to increase tax revenues to cover the unlimited public
    deficit and, incidentally, will be useful for controlling private and professional
    travel.


    Let''s keep in mind that the new mandatory safety device in the European Union,
    included in the emergency light that every vehicle must carry, will contain a
    SIM card for automatic transmission of geolocation data in case of accident or
    collision.


    Of course, the traffic authorities have denied that this system will be used for
    this purpose.


    Could this be a new "Overton window" for absolute control and geolocation?


    If you are on foot, the default geolocation of your smartphone will transmit your
    position; if you leave your phone at home, it will be your vehicle that transmits
    your position.


    When you use a CBDC smart card, the system records the physical location of use,
    and this geographic record can be used to monitor and track your movements.


    The next twist will be when your own phone or car automatically sends a report
    to the authorities for speeding, since these devices can measure instantaneous
    speed. We may think that this approach is a little bit paranoid, but the technical
    possibility is there, it is clear that it will be used for a greater safety of
    travel, of course.


    Third year.


    Since the reduction in the number of commutes expected by the government would
    not have been achieved, it will be necessary to request an administrative authorization,
    adequately justifying the cause of each trip beyond the distance of your 15-minute
    zone.


    If you are identified by your phone, car, or use of your CBDC wallet outside your
    area, you will automatically be charged an ecological penalty for your environmental
    misconduct.


    The penalty would increase with each offense.


    Eventually, your driver''s license would be revoked and your car, if you still
    have it, would be confiscated for the good of the planet.


    This proposal of "15-minute cities", promoted by the new dogmas of the World Economic
    Forum itself, is actually nothing new, it is called Open Prison Regime, although
    there will always be time to turn it into a Closed Regime, a click would be enough
    to deactivate our CBDC wallets beyond those 15 minutes from our residence.


    Time or calendar restrictions to use your money or buy certain products will also
    be possible and easy to implement.


    The differences in economic and fiscal regulations and public deficits among the
    most indebted countries of the European Union will foreseeably lead to difficulties
    in monetary and fiscal management, which has recently been referred to as the
    "risk of European fragmentation".


    Thus, the use of the CBDC control could easily be applied to create in practice
    what has been happening for years, especially during the serious debt crisis in
    Greece that threatened the unity of the European Union, a euro at "different speeds",
    once again a euphemistic expression to divide the euro, the single currency, into
    different currencies as needed, with fiscal rules and capital control, which although
    prohibited by the Treaty of the Union, would be easily implemented by governments
    or the European Commission.'
  fmt: '

    Absolute surveillance is only the first step, with the information obtained in
    various ways, mainly on the use, origin and destination of our money, it will
    be the governments that will exercise their powers of control, not the issuer
    of this digital money, which in Europe would be the `ECB`.


    Governments would not only be able to see each and every movement of our digital
    wallets, they would also have the legal power to freeze, confiscate, collect current
    and future taxes, withhold certain funds, reverse transactions, effectively and
    immediately collect penalties for non-compliance with any regulation, they could
    also set an expiration date on the money received, prevent or limit savings on
    the pretext of promoting consumption and economic activity, as well as impose
    spending limits on products based on arbitrary criteria "always for our health"
    or based on our carbon footprint "to save the planet".


    They could charge negative interest on their money, depending on each citizen''s
    social score, according to an index of obedience called "social credit" that already
    exists in China.


    "Negative interest" is a euphemism for a tax on savings; instead of rewarding
    savers'' deposits with a certain amount of interest, they could be penalized with
    the aim of encouraging consumption and stimulating the economy.


    Of course, in so-called "democratic" countries, this term will be changed to a
    friendlier name as an index of compliance with `ESG` criteria.


    The acronym `ESG` stands for Environmental, Social and Governance factors, which
    are used by the World Economic Forum to assess the impact and responsibility of
    companies and individuals.


    These criteria are increasingly being used to force companies to comply with the
    `2030 Agenda`, also published by the World Economic Forum, or else the asset management
    giants will not provide investments if these factors are not met.


    Several U.S. states have prohibited their respective public and state pension
    funds from investing in asset management funds that seek to impose these `ESG`
    criteria, as they have clearly proven to be counterproductive to the benefit of
    investors.


    State attorneys from 19 states wrote a letter to `Black Rock Company` CEO Laurence
    D. Fink warning that `BlackRock''s` `ESG` investment policies could be a "rampant
    violation" of the "single-interest rule," a legal principle that requires investment
    fiduciaries to act "to maximize financial return, not to promote social or political
    objectives."


    ### References


    - `ESG` investing becomes a lightning rod in American politics - CNA (`channelnewsasia.com`)

    - Conservative group takes anti-`ESG` campaign to the next level (`axios.com`)


    The use of financial and economic coercion has become a political weapon, but
    historical experience shows that when the economy is driven by political rather
    than economic factors, it always ends in disaster.


    Another possibility for the use of `CBDC` digital money would be to enforce "sanctions"
    against any product, brand, company or country that is designated as hostile by
    preventing transactions with a blacklist of individuals, companies or countries
    that the government deems "sanctioned". We must understand that the euphemistic
    term "sanction" really means boycott.


    It will be particularly easy to block any transaction outside of the geographic
    area your government deems appropriate for you, thus restricting citizens to your
    `zip code`, city, region, or country, depending on the movement permissions you
    have been granted.


    ### The 15-Minute Cities


    The new concept of "15-minute cities" is already emerging as a first step in Overton''s
    time window. Cities or neighborhoods where the average citizen should be able
    to meet all his or her needs without moving more than 15 minutes on foot or by
    bicycle, where the average car will be a luxury, thus saving energy to help "save
    the planet".


    Overton''s time window of 15-minute cities could be implemented like this:


    #### Year one, this 2023.

    The mass media of disinformation will tell you how good it would be for the planet
    to have commutes of no more than 15 minutes if you could satisfy all your needs
    in your neighborhood.


    #### Year 2.

    To save the planet, a small toll would be charged that would be automatically
    deducted from our `CBDC` wallet when your cell phone or car is detected beyond
    its 15-minute area of coverage from your residence.


    In Spain, automatic vehicle identification systems are already being installed
    on the roads to pay the new road tax or toll, as was done in Portugal in the years
    following the 2008 crisis, to increase tax revenues to cover the unlimited public
    deficit and, incidentally, will be useful for controlling private and professional
    travel.


    Let''s keep in mind that the new mandatory safety device in the European Union,
    included in the emergency light that every vehicle must carry, will contain a
    `SIM card` for automatic transmission of geolocation data in case of accident
    or collision. Of course, the traffic authorities have denied that this system
    will be used for this purpose.


    Could this be a new "Overton window" for absolute control and geolocation?


    If you are on foot, the default geolocation of your smartphone will transmit your
    position; if you leave your phone at home, it will be your vehicle that transmits
    your position.


    When you use a `CBDC` smart card, the system records the physical location of
    use, and this geographic record can be used to monitor and track your movements.


    The next twist will be when your own phone or car automatically sends a report
    to the authorities for speeding, since these devices can measure instantaneous
    speed. We may think that this approach is a little bit paranoid, but the technical
    possibility is there, it is clear that it will be used for a greater safety of
    travel, of course.


    #### Third year.

    Since the reduction in the number of commutes expected by the government would
    not have been achieved, it will be necessary to request an administrative authorization,
    adequately justifying the cause of each trip beyond the distance of your 15-minute
    zone.


    If you are identified by your phone, car, or use of your `CBDC` wallet outside
    your area, you will automatically be charged an ecological penalty for your environmental
    misconduct. The penalty would increase with each offense.


    Eventually, your driver''s license would be revoked and your car, if you still
    have it, would be confiscated for the good of the planet.


    This proposal of "15-minute cities", promoted by the new dogmas of the World Economic
    Forum itself, is actually nothing new, it is called Open Prison Regime, although
    there will always be time to turn it into a Closed Regime, a click would be enough
    to deactivate our `CBDC` wallets beyond those 15 minutes from our residence.


    Time or calendar restrictions to use your money or buy certain products will also
    be possible and easy to implement.


    The differences in economic and fiscal regulations and public deficits among the
    most indebted countries of the European Union will foreseeably lead to difficulties
    in monetary and fiscal management, which has recently been referred to as the
    "risk of European fragmentation".


    Thus, the use of the `CBDC` control could easily be applied to create in practice
    what has been happening for years, especially during the serious debt crisis in
    Greece that threatened the unity of the European Union, a euro at "different speeds",
    once again a euphemistic expression to divide the euro, the single currency, into
    different currencies as needed, with fiscal rules and capital control, which although
    prohibited by the Treaty of the Union, would be easily implemented by governments
    or the European Commission.

