- raw: 'From the moment a bank makes a loan *“*using*”* the deposits of other customers,
    it doubles the amount of money in that loan, because the borrower can use that
    money with the promise to pay it back with interest, but the loaned money is still
    available to the depositors.


    Therefore, this "fractional reserve" system creates a monetary aggregate that
    increases the monetary base, thereby expanding the amount of money circulating
    in the economy.


    The reader may ask, what is the percentage of reserves that the European Central
    Bank requires banks to hold?


    At the time of writing, it is **1%**.


    Reference: Bank of Spain - Monetary policy - Monetary policy in the euro area
    and its instruments - ECB interest rates (bde.es)


    For the United States, the reserve requirement for all depository institutions
    has been set by the Federal Reserve at 0% of eligible deposits beginning in March
    2020. Prior to that, however, the reserve ratio has historically ranged from zero
    to 10% of bank deposits.


    Reference: Reserve requirement - Wikipedia


    What is the reserve requirement or reserve ratio?


    The reserve ratio is a percentage set by the European Central Bank (ECB) that
    is applied to certain items on the balance sheet of credit institutions in order
    to determine the reserve requirement.


    In the Eurosystem, the reserve requirement is set by the European Central Bank
    (ECB). Until January 2012, credit institutions in the euro area were required
    to hold at least 2% of certain liabilities, mainly customer deposits, with their
    national central banks. **Since then, this ratio has been reduced to 1%.**


    In other words, for *every €1,000 of customer deposits, banks keep €10 as a reserve
    and either lend €990 to other* customers or invest it in the purchase of a profitable
    asset that the bank will hold.


    *Now we have in circulation: 1,000 + 990 = €1,990 from a deposit of only €1,00*0.


    The borrower uses this money, buys something, and this money is deposited in the
    account of another person or company in another bank, or even in the same bank.


    The second bank, or even in the same bank, with this *“new”* deposit of 990 euros,
    keeps 1% of this deposit, i.e. 9.9 euros (let''s round off the decimals for simplicity''s
    sake), and this allows it to lend the remaining 980 euros to a second customer.


    Now we have 1,000 euros from the initial deposit + 990 from the second customer
    + 980 from the third customer, i.e. we have a total of 2,970 euros in circulation,
    backed by an initial deposit of only 1,000 euros.


    Imagine that the process is repeated a few more times, again we will round the
    percentages for ease of compression: 1,000 + 990 + 980 + 970 + 960 + 950; in only
    5 iterations of fractional reserve banking, we have about 5,850 euros in circulation,
    backed by only 1,000 real euros of the first deposit.


    In this way, the commercial banks expand the monetary base, almost geometrically
    or exponentially, the more iterations there are, and there is no predetermined
    limit, the more growth of the monetary base is created.


    But this is only the beginning, central banks have the magical power, or the exorbitant
    privilege, to create money out of nothing.


    Central banks can issue banknotes that cost only a few cents to produce by earning
    the face value of the banknote minus the cost of issuing it, called "seigniorage".


    Seigniorage from the Old French seigneuriage, "Right of the lord (seigneur) to
    mint money".


    Is the difference between the value of money and the cost to produce and distribute
    it. In other words, it is the profit made by a government by issuing currency.


    Reference: What is seigniorage? (europa.eu)


    But there is more: although the commercial banks are the biggest money creators
    in quantitative terms, the main money issuer is the central bank, in the Euro
    system, the ECB or European Central Bank, which creates and puts into circulation
    as much new money as it sees fit in various other ways.


    One of them is by "buying" corporate bonds\*, from large corporations or from
    the banks with mortgage-backed bonds, with money that it does not have, but that
    it can invent "ad hoc", i.e. for this purpose, which we call the real money qualifier
    we use: fiat money, from the Latin "let it be done" already mentioned above: "money
    which represents a value which it does not have in itself and which is not backed
    by the precious metal reserves of its issuer, but only by legal imposition".


    And even more: The ECB is buying up the public debt of some member states, especially
    those with chronic and structural deficits, such as Portugal, Spain, France, Italy
    and Greece, with money that it does not have and it is creating out of thin air
    for this purpose.


    The reader should be aware that Article 123, paragraph 1 of the Treaty on European
    Union **expressly prohibits the subsidization or purchase of public debt by the
    ECB.**


    Treaty on European Union. Article 123-1.


    1\. Overdraft facilities or any other type of credit facility with the European
    Central Bank or with the central banks of the Member States (hereinafter referred
    to as ‘national central banks’) in favour of Union institutions, bodies, offices
    or agencies, central governments, regional, local or other public authorities,
    other bodies governed by public law, or public undertakings of Member States shall
    be prohibited, as shall the purchase directly from them by the European Central
    Bank or national central banks of debt instruments.


    Reference:


    EUR-Lex - 12016E123 -EN - EUR-Lex (europa.eu)


    In my opinion, the wording of the article is so transparent and clear that it
    cannot give rise to any other interpretation.


    The German Constitutional Court felt the same way when, in August 2017, it referred
    a dispute to the Court of Justice of the European Union on the grounds that the
    financing and purchase of Greek public debt violated Article 123.1 of the Treaty
    on European Union.


    However, as the popular saying goes: "As the law is made, so is the trap".


    The Judgment of the Court of Justice (Grand Chamber) in Case C-493/17 (H. Weiss
    and others) considers that the Programme of government bond **purchases on secondary
    markets** implemented by the European System of Central Banks since Decision 2015/774
    of the European Central Bank of 4 March 2015 **does not infringe primary Union
    law**.


    The Judgment of the Court of Justice (Grand Chamber) of December 11, 2018.


    Reference: [https://eur-lex.europa.eu/legal-content/en/TXT/?uri=CELEX:62017CJ0493](https://eur-lex.europa.eu/legal-content/en/TXT/?uri=CELEX:62017CJ0493)


    The purchase of public debt securities of member states does not violate the EU
    treaty if the ECB buys public debt securities in the secondary market.


    So it is forbidden to do it directly, but it is allowed on the secondary market.


    The reader may ask; What is the Secondary Market \*?


    What is the difference?


    The first question can be answered in simple terms: it is a public auction of
    securities or bonds, in which the issuer of the asset does not participate, but
    other participants, such as investors and financial institutions, act as intermediaries,
    which, under the criteria of supply and demand, come to the auction and can acquire
    these public bonds issued by the States.


    In simple terms, the ECB cannot buy the public debt of a Member State directly;
    it must do so on the secondary market from an intermediary, which will be the
    commercial banks, which in turn will resell the bonds they have just bought to
    the ECB at a certain profit and without any effort on their part.


    This kind of intermediation and arbitrage between markets is what stockbrokers
    and bankers call "free money".'
