  \ 为什么可扩展性被认为是 ML 微服务的关键方面？\n   A) 它确保服务能够高效地处理工作负载\n   B) 它仅与大型企业相关\n   C) 它允许系统在不损失性能的情况下管理不断增加的工作负载\n\
