  \ ![](img/image-61e7ptkw.jpg)\n\n# 第 7 章 机器学习微服务的扩展与负载均衡\n\n## 引言\n机器学习微服务的可扩展性不仅关乎处理更多数据或服务更多用户；它更关乎确保随着需求的增长，系统性能能够保持最佳状态，而不会产生高昂的成本。未扩展的系统会导致瓶颈、用户体验下降，在某些情况下甚至会导致整个系统故障。在机器学习领域，由于模型通常是数据密集型且计算密集型的，扩展性变得至关重要。人工智能和机器学习运维（MLOps）的负载均衡面临着独特的挑战。与工作负载相对可预测的传统系统不同，机器学习负载具有高度变异性。例如，训练深度学习模型可能在短时间内需要大量的计算资源，而推理可能更加持续但资源密集程度较低。在保持性能的同时，通过平衡来确保资源得到优化利用并降低成本，是一项复杂的任务。\n\
  \n在本章中的旅程将围绕一个特定的用例展开：音乐推荐引擎。这一选择并非偶然。音乐平台在专辑发布、音乐节甚至文化活动期间，用户活动会出现激增。在这些情况下，确保推荐引擎的响应灵敏、准确且高效是至关重要的。这为在现实世界中理解、探索和实现扩展性和负载均衡的概念提供了一个极佳的背景。在我们学习章节的过程中，我们将不断回到这个系统，查看如何利用我们讨论的原则对其进行增强和优化。\n\
  \n## 结构\n本章强调了在多样化工作负载下扩展机器学习微服务以获得最佳性能。随着 AI 应用的增长，有效的扩展对于满足用户需求和运行要求变得至关重要。到本章结束，你将准备好开发响应迅速、可扩展的机器学习服务，确保\
  \ AI 驱动应用具有一致的性能。我们将在本章中涵盖以下主题：\n* 水平扩展与垂直扩展策略\n* 用于可扩展性的无状态微服务\n* 针对机器学习负载的负载均衡技术\n\
  * 自动扩展的机器学习微服务\n* Kubernetes 及其在扩展中的作用\n* 扩展与负载均衡中的挑战与考量\n\n# 目标\n在本章中，我们旨在为机器学习微服务的扩展和负载均衡提供一份清晰且全面的指南。我们将深入探讨机器学习负载带来的独特挑战，并突出专门的解决方案。通过以音乐推荐引擎为中心的实际示例，读者将掌握知识和工具，以增强其\
  \ AI 驱动应用的效率和健壮性。为了实现这些目标，我们将探索几个作为掌握机器学习微服务扩展和负载均衡基础的关键领域。\n\n## 水平扩展与垂直扩展策略\n\
  扩展是确保应用程序能够处理增加的流量或工作负载而不损害性能的基础。工业界中采用的两种主流策略是水平扩展和垂直扩展。每种策略都有其优势、局限性和适用场景。在这里，我们将深入探讨这两种策略，重点关注它们的核心原理和区别。\n\
  \n### 水平扩展与垂直扩展\n水平扩展（通常称为 `scaling out`）是指向系统中添加更多机器，或增加集群中的节点数量。这类似于在装配线上增加工人的数量。以下是水平扩展的关键特征：\n\
  * 分布式（Distributed）：水平扩展背后的主要原理是将系统负载分布到不同的服务器上，确保没有单台服务器被淹没。\n* 弹性（Elasticity）：水平扩展为系统提供了弹性，使其根据需求进行扩展和收缩。\n\
  * 负载（Load）：在水平扩展时，通常有一个负载均衡器将传入的请求分发到各个服务器，确保没有服务器成为瓶颈。\n* 容错（Fault）：如果一台机器或节点故障，其他机器可以接管其任务。这提供了更高的可用性，并确保单台机器故障不会导致系统崩溃。\n\
  * 规模（Scale）：你可以根据需要向系统添加更多机器，允许近乎无限的扩展性。\n* 更好（Better）：由于每个节点通常拥有自己的资源（CPU、内存、存储），因此资源竞争较少。\n\
  \n以下是水平扩展所面临的一些挑战：\n* 管理和维护分布式系统可能具有挑战性。它需要工具和专业知识来处理分布式数据、故障转移机制和同步。\n* 在分布式环境中，确保数据一致性可能是困难的，特别是当数据跨节点复制时。\n\
  * 由于请求可能在不同服务器之间传输，或者数据可能需要同步，如果管理不当，网络延迟可能会成为问题。\n\n垂直扩展（通常称为 `scaling up`）意味着增强现有机器的能力，例如添加更多内存、CPU\
  \ 或存储。这类似于用更高效的工人替换装配线上的工人。以下是垂直扩展的关键特征：\n* 单机系统（Single system）：与增加更多机器的水平扩展不同，垂直扩展侧重于升级现有机器的能力。\n\
  * 立即资源（Immediate resource）：机器一升级，系统就能从增加的资源中受益，可能导致性能即时提升。\n* 数据简化（Simplified data）：由于只有一个机器或节点，数据管理、同步和一致性通常比分布式系统更简单。\n\
  \n以下是垂直扩展的优势：\n* 由于扩展仅涉及一台机器，因此在设置、维护和管理方面的复杂性较低。\n* 不需要在多台机器之间进行通信，通常涉及的网络延迟较少。\n\
  * 通过单一的中心化系统，数据一致性得到了内在的维护，消除了跨节点数据复制等挑战。\n\n以下是垂直扩展所面临的一些挑战：\n* 局限性（Limitations）：单台机器的升级程度是有限制的。超过某个点后，你可能会发现无法进一步扩展。\n\
  * 潜在的单点故障（Potential single point of）：如果单台机器面临问题或故障，可能会导致系统完全停机。\n* 昂贵（Costly）：高端硬件升级可能非常贵，特别是在考虑顶级组件时。\n\
  * 升级（Upgrading）：升级机器可能需要停机，除非采用了特定的高可用性策略或冗余系统。\n\n\n\n\n\n# 决定因素：扩展策略的选择\n\n对于像音乐推荐系统这样的机器学习（ML）微服务，选择水平扩展还是垂直扩展取决于多种因素，例如：\n\
  \n- **应用**：根据应用程序的具体需求做出决定。\n- **负载**：对于稳定的负载使用垂直扩展；对于波动且不可预测的需求，选择水平扩展。\n- **容错性**：水平扩展提供了更好的容错能力，这对于维持用户参与度至关重要。\n\
  - **成本对比**：虽然垂直扩展在初期可能更便宜，但从长远来看，水平扩展更具成本效益且更具扩展性。\n- **运维**：水平扩展增加了复杂性，但提供了可扩展性。垂直扩展则更为简单。\n\
  - **架构**：分布式应用程序和微服务框架与水平扩展更为为契合。\n- **停机时间**：水平扩展允许以最小的停机时间进行调整，这对于要求高性的服务至关重要。\n\
  - **延迟**：垂直扩展通常提供较低的延迟；水平扩展通过有效分配负载来管理并发请求。\n\n鉴于这些因素，音乐推荐系统等可能经历显著增长且对高可用性有要求的\
  \ ML 服务，可能从水平扩展中受益更多。然而，一种适应每个微服务独特需求的混合方法可能是最有效的。\n\n### 混合方法：结合水平扩展和垂直扩展\n\n混合扩展方法结合了水平扩展和垂直扩展的优点，创建一个灵活、高效且具韧性的系统。通过针对每个微服务的特定需求和特征定制扩展方法，你可以实现一个平衡且优化的系统。为了实现混合扩展方法的优势，我们关注于以下几个确保系统效率和适应性的关键方面：\n\
  \n- **特定于特定服务**：在一个由多个微服务组成的系统中，每个微服务可能都有其独特的扩展需求。某些微服务由于其无状态的本质的需求的可变性，可能从水平扩展中受益更多。另一些计算密集型但未面临高变异性的微服务则可能更适合垂直扩展。混合方法提供了根据不断变化的条件或需求调整扩展策略的灵活性。\n\
  - **优化**：通过仅在必要时投资昂贵的硬件（垂直扩展）并在其他领域分配负载（水平扩展），可以优化成本。\n\n以下是这种混合方法的优势：\n\n- **平衡**：通过结合这两种策略，系统可以处理大量请求并执行密集的计算任务而不会产生延迟。水平扩展的分布式特性提供了应对故障的韧性，而垂直扩展带来的能力提升确保了对沉重任务的处理。\n\
  - **最优资源**：可以通过某种方式分配和利用资源，为每个微服务获得最大输出，防止浪费并确保效率。\n\n# 用例：针对用户突然涌入扩展音乐推荐引擎\n\n\
  想象一下，一位人气艺人意外地发布了一张新专辑。结果是，大量用户突然涌向音乐推荐平台收听这张专辑。这一意外的事件触发了多个服务的剧性增长——从用户身份验证到获取专辑元数据，更重要的是根据新专辑推荐其他歌曲。\n\
  \n以下是处理这波涌入的流量的步骤：\n\n- **监控与**：首先，系统应该建立实时监控。一旦用户活动超过特定阈值，警报将发送给系统管理员，或由伸缩机制自动处理。\n\
  - **用户身份验证的水平扩展**：随着更多用户尝试登录或注册，身份验证服务应该扩展。将创建新的身份验证微服务实例以分配负载，防止任何一个实例被过载。\n- **数据库复制与**：鉴于需求，负责存储新专辑元数据和用户活动的数据库将看到频繁的读写操作。使用水平扩展，可以创建数据库副本来分配读操作。写操作可以通过优化的数据库操作或使用缓存机制来精简。\n\
  - **扩展推荐**：\n    - **水平**：启动新的推荐服务实例以处理增加的请求数量。这确保了每个用户都能及时收到他们的推荐。\n    - **垂直**：鉴于生成推荐的计算性质，向现有实例中添加更多资源（如\
  \ `CPU` 或 `memory`）可以加快推荐过程。\n    - **缓存**：对频繁访问的数据实施缓存，例如新专辑的详情或该专辑的热门歌曲。这减少了直接查询数据库的次数，允许系统更快速地服务用户。\n\
  \    - **负载**：由于水平扩展启动了新的服务实例，负载均衡器将分发进入的流量以确保每个实例接收最佳数量的请求。这防止了任何单个实例成为瓶颈。\n- **事件后扩展**：一旦热峰消退，缩减资源同样重要。可以终止涌入期间产生的多余实例以节省成本。这就是自动伸缩策略（包括向上扩展和向下缩缩）变得至关重要的地方。\n\
  \n处理用户的突然涌入，特别是在意外发布专辑这样的场景下，测试了音乐推荐引擎的健壮性和可扩展性。通过水平和垂直扩展的结合，加上缓存和负载均衡等策略，系统可以有效管理激增，确保用户拥有无缝且响应的体验。\n\
  \n# 用于扩展的无状态微服务\n\n微服务根据其管理数据和会话的方式分为两类：`Stateful`有状态）和`stateless`无状态）。在无状态微服务中，每个客户端请求都被视为一次新的交互。它不保留会话数据，确保请求之间不保存上下文。\n\
  \n## 无状态微服务的概念\n\n在微服务架构中，服务被设计为独立的、模块化的单元，能够自主运行和演进。它们功能的关键（特别是关于扩展性和管理性方面）是状态的概念。\n\
  \n计算中的状态是指随时间保留关于交互的信息。无状态微服务顾如名，不保留对之前交互的任何记忆。对无状态服务的每个请求完全基于该请求内部的信息，不依赖于任何过去的上下文。\n\
  \n以下是无状态微服务的特征：\n\n- **无状态**：无状态服务表现出幂等性，确保对重复的客户端请求产生一致的响应，提高了可靠性。\n- **自包含**：每个请求必须包含处理所需的所有信息，包括身份验证令牌、数据负载和所需的元数据。\n\
  - **临时性**：无状态服务可以创建或终止，而不必担心用户会话或上下文丢失。这种行为支持根据需求进行轻松的扩展和收缩。\n- **无会话**：与传统系统不同，无状态服务不需要将用户请求定向到特定的服务器实例以保持会话连续。任何可用实例都可以处理任何请求。\n\
  - **设计简单**：无状态服务的设计简化了应用程序逻辑。不需要管理会话数据、处理会话超时或实例之间复杂的同步。这种简单性通过简化新实例的添加直接促进了可扩展性。\n\
  \n\n\n\n\n# 无状态 ML 微服务的优势\n\n在音乐推荐系统等 ML 业务中，无状态化提供了以下优势：\n\n- **扩展性 (Scaling)**：通过独立处理每个带有所有必要信息的请求，实现轻松扩展，便于操作的分发。\n\
  - **容错性 (Fault)**：最大限度地减少故障带来的风险，因为失败的请求可以重新路由而不会丢失数据。\n- **负载 (Load)**：提高了负载均衡，由于实例未与特定用户数据绑定，请求分布得更均匀。\n\
  - **资源 (Resource)**：优化了资源利用，因为每个请求在处理时都不保留数据，确保了内存使用的可预测性。\n- **维护 (Maintenance)**：简化了更新和系统维护，无需管理会话数据。\n\
  - **一致性 (Consistent)**：确保可靠且一致的 ML 预测，这对于维护音乐推荐等应用中的用户信任至关重要。\n- **部署与迭代 (Deployment\
  \ and iteration)**：允许对 ML 模型进行快速部署和更新，支持快速适应活动期间用户行为变化等变化。\n\n## 使用 TensorFlow 和\
  \ PyTorch 实现\n\n使用 `TensorFlow` 和 `PyTorch` 等流行的深度学习框架实现无状态微服务可以相对简单。本节将讨论一些简单的示例来阐明这一概念。\n\
  \n让我们分解使用 `TensorFlow` 的实现过程，特别关注 `TensorFlow Serving`，它是将 `TensorFlow` 模型作为无状态微服务的辅助方法之一：\n\
  \n## TensorFlow\n\n`TensorFlow Serving` 是一个专门为 ML 模型设计的专用、可扩展的服务系统，专为生产环境设计。它可以同时提供多个模型或多个版本的模型。\n\
  \n`TensorFlow Serving` 的步骤如下：\n\n### 以 SavedModel 格式导出模型\n在训练完 `TensorFlow` 模型后，必须将其保存为\
  \ `SavedModel` 格式，如下所示：\n```python\n# 假设 model 是已训练 TensorFlow Keras 模型的实例\nmodel.save(\"\
  path_to_saved_model\")\n```\n\n### 安装 TensorFlow\n你可以使用 `Docker` 或 `apt-get` 轻松安装\
  \ `TensorFlow Serving`。这里是 `Docker` 方法：\n```bash\n# 拉取最新的 TensorFlow Serving Docker\
  \ 镜像\ndocker pull tensorflow/serving\n```\n\n### 服务\n现在，使用 `TensorFlow Serving`\
  \ 的 `Docker` 镜像提供模型服务：\n```bash\ndocker run -p 8501:8501 --name=tf_model_serving\
  \ --mount type=bind,source=/path/to/saved_model/,target=/models/model_name -e MODEL_NAME=model_name\
  \ -t tensorflow/serving\n```\n\n### 发送\n一旦你的模型服务器运行，就可以发送 HTTP 请求来获取预测。例如，使用 `Python`：\n\
  ```python\nimport requests\nimport json\n\ndata = {\n    \"value\": ...\n}\nheaders\
  \ = {\"Content-Type\": \"application/json\"}\njson_response = requests.post(url,\
  \ data=json.dumps(data), headers=headers)\npredictions = json.loads(json_response.text)['predictions']\n\
  ```\n\n`TensorFlow Lite` 适用于移动和嵌入式设备。一个典型的用例是将你训练的 `TensorFlow` 模型转换为 `.tflite`\
  \ 格式，如下所示：\n```python\n### 将 TensorFlow 模型转换为 TensorFlow Lite 格式\nconverter = tf.lite.TFLiteConverter.from_saved_model(saved_dir)\n\
  tflite_model = converter.convert()\nwith open('model.tflite', 'wb') as f:\n    f.write(tflite_model)\n\
  ```\n\n`TensorFlow Hub` 促进了预训练模型的使用。例如，为了加载预训练的图像特征向量，可能会使用：\n```python\nimport\
  \ tensorflow_hub as hub\nfeature_extractor_url = \"https://tfhub.dev/google/tf2-preview/mobilenet_v2/feature_vector/4\"\
  \nfeature_extractor_layer = hub.KerasLayer(feature_extractor_url)\n```\n\n### 使用\
  \ TF cloud 在云端部署\n`TensorFlow Cloud` 允许在 `Google Cloud` 上训练和部署 `TensorFlow` 模型，需要设置\
  \ `Google Cloud` 项目、配置 `Google Cloud SDK` 并使用 `tf_cloud` Python 包。这里简要提到了这些步骤，但实际实现涉及更复杂的决策（如预处理和版本控制），旨在将\
  \ `TensorFlow` 有效集成到无状态微服务中。\n\n## PyTorch\n\n`TorchServe` 是与 `AWS` 合作开发的 `PyTorch`\
  \ 模型服务库。它旨在便于大规模部署 `PyTorch` 模型，而无需编写自定义代码。\n\n`TorchServe` 的步骤如下：\n\n### 以 TorchScript\
  \ 格式导出模型\n服务 `PyTorch` 模型的初始步骤之一将其转换为 `TorchScript`。`TorchScript` 是一种从 `PyTorch`\
  \ 代码创建可序列化和可优化模型的方法，如下所示：\n```python\n# 假设 model 是已训练 PyTorch 模型的实例\nscripted_model\
  \ = torch.jit.script(model)\nscripted_model.save(\"model.pt\")\n```\n\n### 安装\n\
  你可以使用以下命令安装 `TorchServe`：\n```bash\npip install torch torchtext torchvision sentencepiece\n\
  pip install torchserve torch-model-archiver\n```\n\n### 打包\n在提供服务之前，你需要按照所示方式对其进行打包：\n\
  ```bash\ntorch-model-archiver --model-name my_model --version 1.0 --model-file model.py\
  \ --serialized-file model.pt --handler image_classifier\n```\n\n### 服务\n你可以启动 `TorchServe`：\n\
  ```bash\ntorchserve --start --model-store model_store --models my_model=my_model.mar\n\
  ```\n\n### 发送\n与 `TensorFlow Serving` 类似，一旦模型服务器启动，你就可以发送请求来获取预测，如下所示：\n```bash\n\
  curl -X POST http://127.0.0.1:8080/predictions/my_model -T sample_input.jpg\n```\n\
  \n### TorchScript\n`TorchScript` 不仅用于 `TorchServe`。一旦你拥有 `TorchScript` 格式的模型，就可以在多种环境中加载并运行它。这段简单的\
  \ Python 代码使用了 `PyTorch` 中的 `torch.jit` 模块从指定路径加载保存的 `TorchScript` 模型：\n```python\n\
  import torch.jit\n### 在 Python 中加载 TorchScript 模型\nmodule = torch.jit.load(\"model.pt\"\
  )\n```\n\n### 开放神经网络交换 (ONNX)\n`ONNX` 是表示 ML 模型的开放标准格式。`PyTorch` 原生支持将模型导出为 `ONNX`\
  \ 格式，与其他深度学习框架的互操作更容易，如下所示：\n```python\n### 将模型导出为 ONNX 格式\ntorch.onnx.export(model,\
  \ dummy_input, \"model.onnx\")\n```\n一旦变为 `ONNX` 格式，你就可以利用 `ONNX Runtime` 等多种运行时库进行高效推理。\n\
  \n这些示例展示了 `PyTorch` 模型在训练后如何以各种方式提供服务，以适应不同的部署场景。无论部署在云服务器、边缘设备上还是与其他框架集成，`PyTorch`\
  \ 在模型服务方面都提供了灵活性和效率。\n\n## ML 工作负载的负载均衡技术\n\n负载均衡是一项关键技术，用于将传入的网络流量或计算任务分配到多个服务器上，确保没有单个服务器过载。由于\
  \ ML 任务具有复杂性和多变的负载，负载均衡对于确保及时处理和高效利用资源至关重要。让我们进一步探讨。\n\n\n\n\n\n## 常见的负载均衡技术\n\n\
  考虑到机器学习（ML）负载的动态性和密集型特征，结合对高可用性和最优性能的需求，负载均衡不仅是一项加分项，更是必需。它提供了一个安全保障，确保 ML 系统无论面临什么需求或挑战，都能保持运行、高效并以用户为中心。\n\
  \n负载均衡技术旨在将负载分布到多个服务器或计算资源上。以下是一些广泛使用的负载均衡策略：\n\n### 轮询 (Round robin)\n将客户端请求按顺序分配给列表中的每个服务器，然后从头开始循环。\n\
  **最佳用例**：当服务器的处理能力和资源大致相等，且服务器能力之间没有显著差异时。\n\n### 最少连接数 (Least connections)\n将流量导向活动连接最少的服务器，假设连接数较少的服务器较忙，可以承担更多工作。\n\
  **最佳用例**：当服务器性能存在差异，且某些服务器比其他服务器强大时。\n\n### 最小响应时间 (Least response time)\n为新连接选择响应时间最短的服务器，当服务器响应时间发生波动时尤为有效。\n\
  **最佳用例**：对于响应时间至关重要的服务，例如实时应用或高并发服务。\n\n### IP 哈希 (IP hash)\n使用基于用户 IP 地址的哈希函数来决定请求发送的位置，确保相同的\
  \ IP 始终指向同一台服务器。\n**最佳用例**：需要保留会话或用户特定数据时。\n\n### 加权负载均衡 (Weighted load balancing)\n\
  根据处理能力为服务器分配权重，允许权重较高的服务器处理更多请求。\n**最佳用例**：在服务器能力不同的环境中。\n\n### 第 7 层负载均衡 (Layer\
  \ 7 load balancing)\n根据从应用层（OSI 模型第 7 层）提取的属性（如 HTTP 头部或特定内容）做出路由决策。\n**最佳用例**：当需要根据内容类型、URL\
  \ 或其他消息内容做出决策时，特别是对于 HTTP/HTTPS 流量。\n\n### 会话粘性 (Sticky sessions)\n一旦用户与特定服务器建立会话，他们在整个会话期间将继续使用该服务器。\n\
  **最佳用例**：用户数据在会话期间存储在服务器本地的应用程序，例如电子商务购物车。\n\n负载均衡策略的选择通常取决于应用的特定需求、流量性质以及现有基础设施。对于\
  \ ML 负载，考虑到其计算密集性和对实时响应的需求，像最少连接数或第 7 层负载均衡等技术可能 {。\n\n# 为音乐推荐引擎实现负载均衡\n\n音乐推荐引擎必须高效处理实时用户交互并提供定制音乐建议，这需要可扩展、健壮的基础设施来处理峰值负载。为了确保音乐推荐引擎以最优效率和可靠性运行，我们针对涉及每个微服务的独特需求实施了不同的负载均衡策略。这些策略旨在管理变化的需求并确保服务的无缝交付：\n\
  \n- **用户交互**：管理点赞和跳过等用户数据，需要轮询负载均衡器来实现请求的平均分配，并在并在流量激增期间防止服务器过载。\n- **数据处理**：为 ML\
  \ 模型转换原始用户数据，最少连接数负载均衡策略通过将任务导向负载较小的服务器，有助于快速高效地处理数据。\n- **ML 模型**：处理推荐算法，通过加权轮询策略平衡快速推理任务和资源密集型模型训练，为推理任务分配更高的请求权重。\n\
  - **音乐交付**：交付歌曲推荐，采用会话持久化负载均衡，通过为每个会话维护用户与服务器的连接，确保流畅、不中断的用户体验。\n\n这些微服务之间有效的负载均衡确保了推荐的及时性，防止了服务器过载并实现了资源效率的最大化，每个微服务都受益于定制的策略。\n\
  \n# 自动伸缩 ML 微服务\n\n自动伸缩 ML 微服务确保 ML 应用能够根据负载需求动态调整资源，优化性能和成本效益。\n\n## ML 任务的动态性\n\
  \nML 任务是动态且演变的，与传统软件更可预测的行为形成对比：\n\n- **训练与推理**：`Training` 涉及从数据中学习且计算密集型，而 `inference`\
  \ 对新数据进行预测，通常速度更快，但对深度模型来说是资源密集型的。\n- **模型**：`Models` 必须使用新数据定期重新训练或微调，导致计算需求的可变性。\n\
  - **数据**：数据量、多样性和速度的变化会影响模型训练的频率和方法。\n- **超参数**：涉及在不同设置下的多次训练迭代，影响计算负载。\n- **批量与在线**：`Batch`\
  \ 学习一次性需要大量资源，而 `online` 学习持续更新模型，导致需求波动。\n- **分布式**：大型数据集可能需要跨多台机器或 `GPUs` 进行，增加了复杂度。\n\
  - **复杂性**：ML 工作流（包括预处理、特征提取和验证）具有不断且演变的资源需求。\n- **性质**：ML 的动态性源于不断的数据、模型需求和目标，需要适应性基础设施来实现最优性能。\n\
  \n## 自动伸缩的需求\n\n自动伸缩对于 ML 微服务至关重要，能够在当今变化的数字环境中调整资源以满足需求。主要优势包括：\n\n- **优化资源**：自动伸缩确保资源在低流量期间不会被浪费，在激增期间不会过载，提高了效率。\n\
  - **成本**：通过按需分配资源使成本最小，避免在闲置容量上产生不必要的支出。\n- **提高可用性**：自动伸缩为流量高峰做好准备，保持一致性能并避免停机或缓慢。\n\
  - **应对不确定性的活性**：允许业务适应不可预测的流量，确保服务的可靠性。\n- **支持持续性**：自动伸缩适应 ML 模型变化的计算需求，特别是在持续学习场景下。\n\
  \n本质上，自动伸缩确保 ML 微服务无论需求如何波动，都能保持韧性、成本效益和高性能。\n\n# Kubernetes 及其在扩展中的作用\n\n`Kubernetes`\
  \ 是一个强大的容器编排系统，正在改变包括 ML 微服务在内的部署、管理和扩展的方式。它的动态资源分配结合强大的管理功能，确保系统能够轻松适应变化的负载，在不同的运行场景中确保最优性能和成本效益。\n\
  \n\n\n\n\n## Kubernetes 简介\n\nKubernetes 是一个开源容器编排平台，用于自动化应用程序容器的部署、扩展和运行。它源于 Google\
  \ 的 Borg 系统，于 2015 年交给了云原生计算基金会（CNCF）。核心概念包括：\n\n- **K8s 中的基本部署单元**：每个 `pod` 运行单个应用程序实例，它可能是单个容器，也可能是共享存储或网络的多个容器。\n\
  - **Worker machines（工作节点）**：托管 `pods`，由 `Kubelet` 管理。\n- **Master（主节点）**：管理集群并跨节点分发应用程序。\n\
  - **Worker**：执行应用程序实例。\n- **Cluster（集群）**：由 Kubernetes 管理的一组节点，确保在发生故障时应用程序也能顺利运行，并处理部署和扩展。\n\
  - **Service（服务）**：一种抽象，将 pod 上的应用程序作为网络服务暴露。\n    - 仅在集群内部可见。\n    - 可以在集群外部通过每个节点的端口进行访问。\n\
  \    - 创建具有固定 IP 的外部负载均衡器。\n    - 通过 CNAME 记录使用任意名称暴露服务。\n\n理解这些基础元素对于使用 Kubernetes\
  \ 部署和管理应用至关重要。\n\n## 用于 ML 微服务负载的 Kubernetes\n\nKubernetes 是部署、管理和扩展 ML 微服务的关键平台，对于将机器学习集成到业务运营中至关重要。关键特性包括：\n\
  \n- **隔离与容器**：Kubernetes 提供了一致的环境，解决了依赖问题并确保了复现性。\n- **服务发现与负载均衡**：促进不同 ML 微服务组件之间的通信，并在\
  \ `pods` 之间高效地分配请求。\n- **扩展性**：根据负载动态调整微服务实例，优化资源利用并降低成本。\n- **滚动更新**：为 ML 微服务提供零停机更新和易于的回滚。\n\
  - **持久化**：支持各种存储后端以实现持续数据访问，这对于模型权重等需要持久化数据的服务至关重要。\n- **多云与本地化**：允许在多样化环境（从多个云到本地数据中心）进行部署，增强灵活性并防止供应商锁定。\n\
  - **集成监控**：通过 `Prometheus` 和 `ELK Stack` 等工具，提供实时性能洞察，辅助主动管理。\n- **安全性**：通过 `RBAC`、密钥管理和网络策略等功能确保\
  \ ML 微服务和敏感数据的安全。\n\n因此，Kubernetes 为 ML 驱动服务的高效、可扩展和安全管理提供了全面的解决方案。\n\n## Kubernetes\
  \ 自动伸缩：在扩展性管理中脱颖而出\n\nKubernetes 凭借其强大的自动扩展功能在动态工作负载管理方面表现出色，这对于 ML 负载和其他应用程序至关重要。自动扩展的不同类型有：\n\
  \n- **Horizontal Pod Autoscaler（水平 Pod 缩器）**：根据 `CPU` 或自定义指标调整 `pod` 数量。\n- **Vertical\
  \ Pod Autoscaler（垂直 Pod 缩器）**：优化 `pod` 的 CPU 和内存限制。\n- **Cluster（集群）**：调整集群本身，关注整体资源需求。\n\
  - **Resource（资源）**：使资源与需求对齐，通过释放未使用的资源处理峰值并降低成本。\n\n### 扩展方法\n\n- **响应式（Reactive）**：响应实时指标（如\
  \ `CPU` 使用率激增）进行扩展。\n- **主动式（Proactive）**：使用自定义和预定义指标进行预测性扩展，以应对即将到来的需求。\n- **自定义型（Custom）**：支持用于复杂负载的自定义指标，这在\
  \ ML 中管理推理请求或模型训练时间等多种因素至关重要。\n- **无缝 CNCF**：与 `Prometheus` 等 `CNCF` 工具集成，通过稳健的指标和自定义\
  \ API 增强功能。\n\n### 用户关注点\n\n- 专注于应用程序编码和逻辑。\n- 确保基础设施自动且适当地扩展。\n- **策略驱动**：使用策略来指导扩展操作，保持操作在理想的参数范围内。\n\
  \nKubernetes 自动伸缩凭借其全面、适应性强的方法以及与 `CNCF` 生态系统的集成，是管理可扩展、高弹性且高效应用程序的关键，特别是在像机器学习这样复杂的环境中。\n\
  \n在 AWS 上为音乐推荐引擎实现 Kubernetes 自动伸缩需要以下步骤：\n\n### 初始设置 EKS 集群\n使用 `eksctl` 命令行工具（它是\
  \ Amazon `EKS` 的官方 CLI），所示：\n\n```bash\n# 对于 EKS\neksctl create cluster --name music-recommendation-cluster\
  \ --region us-west-2 --nodegroup-name standard-workers --node-type t2.medium --nodes\
  \ 3\n```\n\n### 部署微服务\n部署数据处理服务作为示例：\n\n```yaml\n# data-preprocessing-deployment.yaml\n\
  apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: data-preprocessing-deployment\n\
  spec:\n  replicas: 3\n  selector:\n    matchLabels:\n      app: data-preprocessor\n\
  \  template:\n    metadata:\n      labels:\n        app: data-preprocessor\n   \
  \ spec:\n      containers:\n        - name: data-preprocessor\n          image:\
  \ music/data-preprocessor:v1\n          ports:\n            - containerPort: 8080\n\
  ```\n\n应用以下配置：\n```bash\nkubectl apply -f data-preprocessing-deployment.yaml\n```\n\
  \n### 确定指标并设置 HPA\n```bash\nkubectl autoscale deployment data-preprocessing-deployment\
  \ --min=2 --max=10 --cpu-percent=80\n```\n\n### VPA 配置\n启用 VPA：\n\n```yaml\n# vpa-config.yaml\n\
  apiVersion: autoscaling.k8s.io/v1\nkind: VerticalPodAutoscaler\nmetadata:\n  name:\
  \ data-preprocessing-vpa\nspec:\n  targetRef:\n    apiVersion: \"apps/v1\"\n   \
  \ kind: Deployment\n    name: data-preprocessing-deployment\n  updatePolicy:\n \
  \   updateMode: \"Auto\"\n```\n\n应用此配置：\n```bash\nkubectl apply -f vpa-config.yaml\n\
  ```\n\n### 集群自动伸缩器 (Cluster autoscaler)\nAmazon `EKS` 提供了自带的自动扩展组，可以与集群自动伸缩器集成，所示：\n\
  \n修改部署以包含资源请求和限制。\n\n```yaml\nspec:\n  containers:\n    - name: data-preprocessor\n\
  \      image: music/data-preprocessor:v1\n      resources:\n        requests:\n\
  \          memory: \"64Mi\"\n          cpu: \"250m\"\n        limits:\n        \
  \  memory: \"128Mi\"\n          cpu: \"500m\"\n```\n\n### 监控\nAWS 提供了其原生监控解决方案 Amazon\
  \ `CloudWatch`。然而，为了获得更符合 Kubernetes 原生的体验，可以使用 `Helm` 安装 `Prometheus` 和 `Grafana`：\n\
  \n```bash\nhelm install stable/prometheus --name prometheus\nhelm install stable/grafana\
  \ --name grafana\n```\n\n### 特殊情况处理\n这将涉及更多的监控、预测，然后根据预测结果调整配置。\n\n### 数据扩展\n如果你在\
  \ Kubernetes 中使用 Amazon `RDS` 或任何其他 AWS 数据库解决方案，请考虑 AWS 为特定服务提供的自动扩展能力。\n\n\n\n\n\
  \n# 扩展与负载均衡中的挑战与考虑\n\n扩展至关重要但非常复杂，涉及不仅仅是流量管理。它需要仔细的规划以及对潜在挑战的认识：\n\n- **快速 (Rapid)**：避免了停机，但可能导致成本增加、资源浪费和管理复杂性增加。\n\
  - **激进 (Aggressive)**：损害用户体验并增加系统压力。\n- **未经测试的扩展 (Un-tested scale)**：可能导致不可预测的行为并错过优化机会。\n\
  - **有状态 (Stateful)**：由于复制问题、数据不一致以及恢复和扩展延迟，增加了扩展的难度。\n\n以下是扩展中的开销成本：\n\n- **空闲 (Idle)**：导致成本浪费和对环境的影响。\n\
  - **管理**：需要先进的工具以及可能更大、更专业的团队。\n- **数据传输**：产生与带宽、数据访问和冗余相关的费用。\n\n### 确保跨规模的 ML\
  \ 一致性涉及：\n\n- **模型**：使用 `TensorFlow` 的 `ModelServer` 等工具进行一致性部署。\n- **数据**：`Apache\
  \ Kafka` 等工具确保实时数据的统一性。\n- **硬件**：`Kubernetes` 可以管理在相似硬件上的部署，以避免模型性能差异。\n\n总结来说，有效的扩展和负载均衡是维护性能和用户信任的关键，但它们在成本、管理复杂性和确保\
  \ ML 一致性方面带来了挑战。\n\n# 在 MRE 中应对这些挑战\n\n为了应对 MRE 面临的多方面挑战并保持其效率和可靠性，需要采取策略性的解决方案。这些解决方案包括：预先管理用户需求激增的预测性扩展、确保操作一致性的无状态化、用于优化开支的成本监控、用于统一推荐的稳健模型管理系统，以及用于系统韧性的定期基准测试。以下概述了我们如何应对每种挑战，以确保\
  \ MRE 的性能和用户满意度保持在高水平：\n\n### 预测性 (Predictive)\n在音乐世界，某些事件（如新专辑发布、颁奖典礼或音乐节）会导致用户活动出现预测性的激增。预测性扩展在这些情况下非常有益。以下是其特征：\n\
  \n- 传统的扩展方法对即时需求做出反应，如果数千名用户在短时间内涌入平台，这可能太晚了。\n- 通过分析历史数据，可以识别出与重大活动期间用户活动相关的模式。例如，注意到每个周五晚上的活动激增（典型的专辑发布时间）可以作为系统的提示。通过提前预测这些激增，可以在激增发生前分配资源，从而确保顺畅的用户体验，而不会出现突然的过度扩展或响应延迟。\n\
  \n### 无状态 (Stateless)\n可扩展音乐推荐引擎的固有的分布式特性决定了必须进行无状态操作以确保一致性和可靠性。\n\n- 在推荐过程中保留用户会话数据、近期活动或中间计算会导致扩展性瓶颈和不一致性。\n\
  - 将推荐引擎中的每个微服务设计为无状态，可以确保每个请求都可以独立于其他请求进行处理。任何所需的状态（如用户偏好或会话详情）都可以存储在中心化的数据存储中，例如\
  \ `Amazon DynamoDB`，可以被快速访问和更新。\n\n### 成本监控 (Cost monitoring)\n随着系统的扩展，成本可能会迅速增加，特别是当资源过度配置或处于空闲时。\n\
  \n- 随着基础设施的增长，跟踪与每个服务、实例或数据传输相关的成本可能会变得艰巨。\n- `AWS` 提供了如 `Cost Explorer` 等工具，它提供了成本、趋势和预测的详细细分。定期监控这些内容有助于识别不必要的成本并相应地优化扩展策略。\n\
  \n### 模型管理 (Model management)\n推荐的一致性对于用户信任和平台可靠性至关重要。\n\n- 有多个实例或节点提供推荐时，确保它们都使用相同的模型版本和数据是具有挑战性的。\n\
  - 实现模型管理系统可以确保每次更新模型时，所有实例都保持同步。将其与中心化的数据存储或缓存机制（如 `Redis`）相结合，可以确保用于推荐的实时数据在跨请求和节点时保持一致。\n\
  \n### 定期 (Regular)\n确保系统应对意外激增的稳健性至关重要。\n\n- 如果没有压力测试或基准测试，系统潜在的断点将保持未知，导致在在真实流量激增期间出现漏洞。\n\
  - 定期使用 `Apache JMeter` 或 `AWS` 自己的测试工具模拟高流量场景，可以提供有关系统在压力下的性能洞察。这不仅突显了潜在的弱点，还允许开发者优化配置、扩展策略和资源分配。\n\
  \n总结来说，音乐推荐引擎的动态特性，加上音乐流行度不可预测的世界，要求采取一种主动且知智的扩展方法。通过预判挑战并实施这些解决方案，引擎可以保持韧性、高效和以用户为中心。\n\
  \n# 结论\n\n本章探讨了 ML 系统中扩展和负载均衡的复杂方面。它首先比较了水平扩展和垂直扩展，讨论了它们的优点和挑战，以及影响它们使用的因素。随后，强调了无状态微服务（如\
  \ `TensorFlow` 和 `PyTorch`）在提高 ML 可扩展性方面的意义。本章还研究了负载均衡，详细介绍了传统方法和特定于 ML 的方法（如轮询\
  \ `round robin` 和加权最少连接 `weighted least connections`），并强调了自动扩展在 ML 中对于自适应动态任务管理的重要性。指出\
  \ `Kubernetes` 不仅在容器编排方面，在扩展 ML 负载也非常有效。本章承认了扩展的挑战，例如快速过度扩展以及在不同规模上保持 ML 结果一致的必要性。通过音乐推荐引擎案例研究，展示了高流量事件期间实际的扩展性管理。总体而言，本章为在\
  \ ML 系统中实现扩展性、效率和一致性之间关键的平衡提供了详尽指南。\n\n在下一章中，我们将深入探讨 ML 生态系统中安全这一关键方面。通过强调保护 ML\
  \ 微服务的重要性，我们将探索防御威胁的策略、通过数据匿名化优先考虑隐私，以及安全地部署 ML 模型。\n\n\n\n\n\n# 需要记忆的点\n\n## 水平扩展\
  \ vs. 垂直扩展\n- **水平扩展**：增加更多机器。提供容错能力，但会引入复杂性。\n- **垂直扩展**：增加机器的容量。可能会遇到性能瓶颈。\n-\
  \ **决策**：基于成本、架构和流量。音乐推荐引擎在流量高峰期可能需要水平扩展。\n\n## 无状态微服务\n- 无状态微服务在不同会话之间不保留客户端数据。\n\
  - 增强了可扩展性和容错能力。对于 `TensorFlow` 和 `PyTorch` 等机器学习模型非常有用。\n- 音乐推荐系统受益于无状态化，可以实现高效处理。\n\
  \n## 机器学习的负载均衡\n- 将流量分到各个服务器。\n- 需要针对机器学习的特定技术。方法包括 `round robin`、`weighted least\
  \ connections`。\n- 对于音乐推荐系统的高效运行至关重要。\n\n## 自动伸缩机器学习微服务\n- 机器学习任务具有可变的计算需求。\n- 自动伸缩根据需求监控并调整资源。\n\
  - 音乐推荐系统应根据用户活动模式进行自动伸缩。\n\n## Kubernetes 在扩展中的作用\n- 容器编排工具。\n- 通过专门的配置支持机器学习。提供动态自动伸缩。\n\
  - 帮助音乐推荐系统高效扩展。\n\n## 扩展和负载均衡中的挑战\n- 注意过度扩展、扩展不足以及未测试的局限性。\n- 意识到成本、资源浪费和压力。\n-\
  \ 目标是获得一致的机器学习结果。解决音乐系统中的如数据一致性和硬件差异等问题。\n\n## 案例研究\n- 观察音乐系统如何对重大事件（例如热门专辑的发布）做出反应。\n\
  - 演示了无状态化、负载均衡和 `Kubernetes` 的实际应用。\n\n掌握这些关键点可以确保对机器学习系统扩展和平衡的细微差别有深入的理解。\n\n#\
  \ 作业\n\n为了应用机器学习系统的扩展和负载均衡原理：\n\n1. 设计一个假设的电子商务平台的扩展版本。\n2. 根据针对大型销售活动（例如黑色星期五或网络星期一）的预测用户流量，对是否实现水平扩展或垂直扩展做出决策。\n\
  3. 在你的设计中设计中引入无状态微服务。在 `TensorFlow` 和 `PyTorch` 之间选择一个框架，并为你在预测分析或个性化产品推荐中的选择提供理由。\n\
  4. 为你的平台实现一种负载均衡策略。讨论你为什么选择这种技术而不是其他技术。\n5. 起草一个微服务自动伸缩的计划，考虑到机器学习任务的动态性。\n6. 探索\
  \ `Kubernetes` 如何在你的平台扩展策略中发挥作用。详细说明你将如何使用其自动伸缩功能。\n7. 识别你的扩展和负载均衡策略中的潜在挑战和考虑因素，并提供缓解这些问题的解决方案。\n\
  8. 以一份简要报告结束，总结你的决策、方法论和预期结果。必要时使用视觉辅助工具（图表、流程图）。\n\n# 单选题\n\n1. **机器学习微服务水平扩展的主要益处是什么？**\n\
  \   - 增加单个机器的计算能力\n   - 容错能力和系统可用性\n   - 简化数据管理\n   - 减少网络延迟\n\n2. **垂直扩展最适用于以下应用：**\n\
  \   - 需要弹性来处理可变负载\n   - 具有可预测的工作负载\n   - 需要最小化网络延迟\n   - 以上所有\n\n3. **哪种负载均衡策略是基于将流量导向活动连接最少的服务器？**\n\
  \   - 轮询 (Round robin)\n   - 最少连接 (Least connections)\n   - IP 哈希 (IP hash)\n  \
  \ - 加权轮询\n\n4. **无状态微服务架构意味着什么？**\n   - 微服务需要持续的互联网连接\n   - 微服务在会话之间保留客户端状态\n  \
  \ - 发向微服务的每个请求被视为一个独立的事务\n   - 微服务一次只能处理一个客户端\n\n5. **Kubernetes 自动伸缩不支持以下哪种功能？**\n\
  \   - Pod 自动伸缩器 (Horizontal Pod Autoscaler)\n   - Pod 自动伸缩器 (Vertical Pod Autoscaler)\n\
  \   - 自动模型版本更新\n   - 集群自动伸缩 (Cluster Autoscaler)\n\n6. **在机器学习微服务的背景下，预测性伸缩对以下哪特别有用：**\n\
  \   - 减少云资源的成本\n   - 处理可预测的用户活动激增\n   - 缩短部署新模型的时间\n   - 提高机器学习预测的准确性\n\n7. **以下不是扩展机器学习微服务时常用的\
  \ Kubernetes 对象是：**\n   - Pods\n   - Nodes\n   - Clusters\n   - Firewalls\n\n8.\
  \ **在扩展机器学习微服务时，有状态组件的主要挑战是：**\n   - 推理的计算需求增加\n   - 存储的高成本\n   - 数据不一致和恢复问题\n \
  \  - 简化回滚和版本控制\n\n9. **哪种负载均衡技术使用基于客户端 IP 地址的哈希函数？**\n   - 响应时间\n   - 会话保持 (Sticky\
  \ sessions)\n   - IP 哈希\n   - 加权负载均衡\n\n10. **在机器学习微服务中使用自动伸缩确保：**\n    - 在高峰期间手动扩展的人工干预\n\
  \    - 无论需求如何，负载均匀\n    - 根据工作负载需求动态调整资源\n    - 无论流量如何都固定数量的 pod\n\n# 答案页\n\n加入我们书籍的\
