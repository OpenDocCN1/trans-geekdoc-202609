    ## START SMALL


    When you are looking to invest in a certain cryptocurrency or project, you need
    to find out a few things about them. For this, there are two analysis models:
    fundamental and technical. We went over these two briefly in Chapter 6 and we
    will discuss them in detail here.


    Although the crypto market is unpredictable, you are better off knowing what causes
    prices to rise, fall, or stabilize. With some sound analysis, you can at least
    have a good idea of what to expect and set up your trade from there. A savvy trader
    would know when to get into the market and when to get out. They can see market
    trends and identify certain instances where something would happen. You can only
    really do that with the aforementioned analysis models.


    **Fundamental Analysis**


    The thing about this analysis model is that it works on all trading vehicles,
    be it crypto, forex, commodity, etc. It is compatible with all types of trading.
