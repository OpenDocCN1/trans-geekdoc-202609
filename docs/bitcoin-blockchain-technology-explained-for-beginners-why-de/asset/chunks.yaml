    然而，很有可能你也会做出错误的判断并最终损失所有的钱。再次强调，加密货币市场是不可预测的。即使你非常小心，你控制之外的因素也可能毁掉一切。所以，如果你亏光了所有的钱，那就结束了。你只能用剩下的钱勉强维持到下一次发薪日。


    更危险的是，也许你认为自己能抓住下一次大行情。这在加密货币交易市场中并不起见。情绪会变得异常高涨，你的直觉告诉你利润近在咫尺。于是，你投入了负担不起的资金并尝试运气。如果你成功了，那祝喜你；如果没有，那游戏就结束了。这种恶性循环如何持续下去是显而易见的。


    因此，投资的黄金法则是只投资你愿意掉进去的钱。潜在投资者应该首先评估自己目前的财务状况。你的投资不应该影响你的财务健康，至少不要直接影响。


    在完成这项初步评估后，到底需要多少钱才能开始投资加密货币？


    吸引很多人进入加密货币交易的原因之一是其门槛非常低。你不需要大量的前期投入就可以开始。虽然你可以投资得较少，但你至少应该从 50 美开始。


    你可以先在交易所购买加密货币，然后开始卖出或交易这些币。所有这些操作都有相关的费用，因此糟糕的交易或利润空间太小的交易是行不通的。


    由于市场波动巨大，取决于你的策略和一点运气（或缺乏运气），你可以将 500 美变成 5000 美，反之亦然。和任何其他交易工具一样，做好研究并拥有稳健的策略将让你走得很远。


    至于开始交易比特币或山寨币（Altcoins）的最低金额，这取决于交易所。每种加密货币几乎都是无限可分的。例如，比特币可以被分成一亿份。亿分之一是最小单位，被称为一个
    `Satoshi`（聪），以此向比特币的创始人、开启一切的中本聪（`Satoshi Nakamoto`）致敬。


    尽管如此，最低金额将由你的加密货币交易所设定，因此请务必检查一下。简而言之，即使你没有多少闲钱，也可以开始交易比特币。只是需要更多的时间来积累财富。


    人们问的下一个大问题是，是否可以通过交易加密货币来维持。短答案是肯定的。外汇交易员和股票交易员可以靠他们的游戏维持生活，你通过加密货币也可以做到。唯一的区别在于你需要一些运气和技巧来开始。


    有些人通过加密货币交易实现了完全的财务独立。高波动意味着高风险、高回报的场景，如果你操作得当，可以赚取一笔巨额利润。


    你的成功可能还取决于你的耐心。再次，这是一个高波动的市场，因此价格波动真的会让你怀疑自己的策略。但如果你坚持你的执行计划并保持耐心，最重要的是不要贪婪，那么在大多数情况下你都能获胜。再次，在这里你还需要一点运气。看到交易因为你控制之外的因素而一次又一次地变得糟糕会是令人沮丧的。但请保持冷静，理解这种事情会偶尔发生。


    ## 交易比特币的成本是多少？


    除了币本身的价格之外，你还必须考虑在加密货币交易所交易时需要支付的费用。买卖币时会有费用。这并不是什么从你那里赚钱的阴险手段，这些费用是为了确保加密交易所能够继续运营。


    这些费用包括 `Maker`（挂单）费用和 `Taker`（吃单）费用。`Maker` 费用是通过限价单增加订单簿流动性的费用。`Taker` 费用是通过市价单从订单簿中提取流动性的费用。有时，如果限价单已经在订单簿中，你可能会同时产生挂单和吃单费用。


    通常，加密货币交易所按每笔交易的固定费率计算费用，或按你账户 30 天交易额的比例计算。无论哪种情况，它们都有一套结构，根据你的交易金额来决定收取多少费用。


    ## 在加密交易所交易时需要考虑的四件事


    在你开始交易之前，有四件事你需要记住。首先，加密货币交易很多很多国家不受监管的。它们对加密货币的监管采取了非常放任的态度。例如，美国的加密交易所仅受零散法律的监管。尽管某些加密货币在中国被禁止，但主要的中国加密交易所目前仍在运行，它们将地点迁到了马尔他或塞舌尔屿以躲避政府的打击。


    其次，你需要理解为什么费用是这样设置的。其目的是鼓励你进行频繁的大额交易，金额至少在 1000 美元以上。频繁且大量交易，大多数交易所通常会降低费用。换句话说，如果你进行小额且不频繁的交易，费用会很快侵蚀你的利润空间。某些加密交易所在你交易超过
    1000 万美元时完全不收取费用。


    此外，加密交易所鼓励用户使用代币进行交易。法币有提现和入金费用，取决于你选择的支付方式。当然，当你首次设置账户时，你可能需要支付入金费用以及一笔创建钱包的小额费用。当你想要提取资金时，也必须支付提现费用。但一旦你进入系统，用其他加密货币购买加密货币会更好，这大部分是免费的。


    最后，记住即使是最大最流行的加密交易所也没有提供所有的币，即使是热门币也是。然而，你可以支付一小笔费用从你的钱包导入币，而无需切换你的加密交易所。


    例如，假设你正在使用 `Coinbase`，并且想用你在 `Coinbase` 钱包中的比特币来尝试交易 Cardano（`ADA`）。遗憾的是，`Coinbase`
    没有列出 `ADA`。你可以寻找另一个提供 `ADA` 的加密交易所，比如 `Binance`。你不需要向 `Binance` 账户存入法币来购买比特币然后交易
    `ADA`。`Binance` 提供了从 `Coinbase` 导入钱包的选项，所以你可以直接在 `Binance` 用比特币购买 `ADA`。当然，会有一小笔费用，但这比在
    `Binance` 创建账户时支付入金费用要好。


    ## 寻找理想的加密货币


    接下来，你需要设定一个目标。你应该投资哪种加密货币？这取决于你的目标。大多数人想赚更多钱，所以他们认为投资比特币是正确的选择。他们说的没错。比特币是目前最大最流行的加密货币。你只需要买一些比特币并一直持有直到价格上涨，然后卖掉并获利。


    但是，加密货币投资中投资和获利的方法比这多得多。上述方法可行，但速度较慢。此外，某些币的用途比这更大，你可以用它们来投资初创公司或 ICO。


    **比特币 (BTC)**

    '
- fmt: '

    Bitcoin is released in 2009 by Satoshi Nakamoto. It is the biggest and most popular
    cryptocurrency in the market today as it is the first cryptocurrency to ever be
    created. Although the technology behind it is rather complex, paying via Bitcoin
    is becoming easier for an average user. They would use digital wallets to send
    and receive payments and the coins themselves are listed on virtually every crypto
    exchange. To date, more and more merchants are accepting Bitcoin such as Microsoft,
    Subway, etc.


    That said, though Bitcoin is recognized as the first cryptocurrency that pioneered
    blockchain technology and `Altcoins`, they do have their shortcomings. For instance,
    due to the block size limitations, it can only handle so many transactions simultaneously.
    On average, it can handle seven transactions per second. However, there are far
    more transactions to be processed than just seven in a given second. In the end,
    it can take up to nine or ten minutes to verify one transaction.


    On the other hand, Visa can take on thousands of transactions every second. Bitcoin
    is considered pretty slow in the transaction processing department. Other cryptocurrencies
    make it a habit of increasing their block size and other clever methods to improve
    the transaction speed.


    Bitcoin’s prices are currently on the rise following the 2020 halving. However,
    there is no telling if the price will continue to go up. It could just follow
    the 2016 trend and plummet very soon. Although cryptocurrencies are definitely
    here to stay, no one can say for certain that Bitcoin can be the biggest cryptocurrency
    around. `Ethereum`, `Zcash`, and `Dash` boast greater anonymity, faster transaction
    speed, and more functionality than Bitcoin.


    ## Ethereum (Ether, ETH)


    Ether or `ETH` is a cryptocurrency that is based on the `Ethereum` blockchain.
    It comes as a close second when it comes to popularity compared to Bitcoin. Some
    people believe that Ethereum would overtake Bitcoin and become the dominant cryptocurrency
    in the market thanks to its versatility. Of course, you can invest in Ethereum
    as if it is a digital asset like Bitcoin, but the `Ethereum` platform is also
    home to token developments.


    The `Ethereum` platform allows you to create smart contracts and tokens to fuel
    your `ICOs`. Ether would be used to fuel the transactions on the platforms. A
    quick refresher on the function of smart contract, it is mostly an `if-then` function
    on your excel spreadsheet. For instance, when a predetermined condition is met,
    the smart contract executes the corresponding contractual clause.


    For instance, suppose that you are a company that manufactures and sells smartphones
    and you partnered up with suppliers and shipping companies. You want to make sure
    that your phones are manufactured properly and punctually, and that there are
    no labor violations (aka no slacking off during working hours), and that all parties
    get paid on time. For this to happen, you need a lot of contracts with your workers
    and the companies you work with.


    But, if you use smart contracts with blockchain, it speeds up the entire process
    and makes everything convenient for all parties without compromising reliability.
    So, how does it work in this situation?


    Let’s start with the contract between your company and the shipping company. It
    starts when the trucks come over to pick up the smartphones from the factory.
    The company would scan the boxes before hauling the box onto the trucks. What
    the scanning does is update the entry on the blockchain network, telling both
    parties that a certain number of products is picked up. This activates a clause
    in the smart contract which would release the fund from your company and send
    it to the shipping company. No invoice is needed.


    When it comes to the labor contract between you and your worker, the system works
    similarly. When they come into work, they’d scan their cards and a third party
    would verify it so that no labor policies are violated.


    ## Other Popular Cryptocurrencies


    There are other cryptocurrencies that offer various features and it is impossible
    to cover every single one of them. For this reason, we will only cover some of
    the most popular coins to date. It is best that you do your own research and look
    for the coins you want to invest in yourself.


    The first is `Litecoin`, which is launched in 2011. Litecoin is basically the
    lite version of Bitcoin, hence the name. It is an open-source, decentralized,
    and cryptography-backed cryptocurrency. The developers claimed that Litecoin would
    be the silver to Bitcoin’s gold. Litecoin has a faster transaction confirmation
    rate than Bitcoin.


    `Dash` is released in 2014 but under the name of `Darkcoin`. It soon changed its
    name and gives more anonymity to users thanks to its decentralized mastercode
    network. It achieved this thanks to a `Masternode`, a node on its blockchain network,
    that forms a more robust foundation than Bitcoin.


    `Zcash` is launched after `Dash`. It is quite new to the whole cryptocurrency
    market, but some people say that Zcash provides complete anonymity to its users
    since it utilizes `zero-knowledge SNARKS`. In simple terms, it does not record
    transactions at all. It does verify transactions, encrypts information, and prevents
    double-spending.


    `Monero` has a unique take on privacy. For instance, it allows for complete anonymity
    by using a special technique called “ring signatures”. It works well enough that
    it became popular among users on the Dark Web.


    `Ripple` was launched back in 2012 and offers almost instant transactions internationally
    at a very low cost. Instead of the conventional mining techniques that many other
    cryptocurrencies use, Ripple uses a consensus ledger which allows transactions
    to be verified without mining. This means less computational power is required
    to verify the transaction.


    ## GET YOURSELF A CRYPTO WALLET


    We have mentioned this time and again since the start of the book: digital wallet/crypto
    wallet. What is it? The wallet is an app that allows you to store your coins.
    It also doubles as a way to receive coins.


    Cryptocurrency wallets are apps that you can run on your phone or computer. But
    if the idea is too abstract for you and you want to have a little something more
    tactile, you can get a hardware wallet or a device that runs the wallet app for
    you.


    Digital wallets do not work the way you think they do. You might think that your
    coins would be stored in your crypto wallet as if they are files on a USB drive.
    But that is not the case. The data stored on the wallet just points to where the
    actual coins are in the blockchain network and the public ledger.


    That said, why do you need a wallet? The whole idea behind Bitcoin and `Altcoins`
    is to act as a decentralized currency so that the common people have full control
    over their money. The money you put into the bank would be into something else
    to turn a profit. Basically, your bank is borrowing money from you so they can
    do other businesses. Except, this time, they control how much they have to give
    back in interest.


    So, what you get is an `IOU` or a promise that the bank would give back your money
    by demand. The only problem is that’s not always the case. There were instances
    when the economy reaches a point where banks just do not have enough money to
    give back to their customers. So, a lot of people ended up losing money.


    Bitcoin and `Altcoins` give you more power over your money. Since they are also
    steadily increasing in value, investing in cryptocurrencies might not be a bad
    idea. Plus, with such a valuable digital asset in your hands, you want to make
    sure that you have a safe place to store your coins.


    You might be wondering that since your crypto exchange would give you a wallet
    anyway, would it be adequate enough. You can store your coins there, but it is
    best if you do not. Exchanges can be hacked and all the coins there could be whisked
    away in an instant.

    '
