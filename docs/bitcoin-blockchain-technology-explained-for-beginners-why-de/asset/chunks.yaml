  raw: 'When you do it this way, you can keep fooling people into believing that your
    company or project is making a lot of money, when the only money you make is that
    from other investors. The pool of investors grows until it is no longer sustainable,
    usually around the time when there are no more new investors to fool and people
    start to ask more and more questions. So, you can go down the classic scam route
    and run off with the rest of the money.


    Luckily, you can spot this kind of scam from a mile away. If they come up to you,
    usually unsolicited, with a crypto project that offers 10% returns on investment
    a year or even more, every month, it’s a scam.


    Sometimes, they may go down the pyramid scheme and ask you to find new investors.
    If you do, you will get a bonus of some kind. That is also a scam.


    **The Exit Scam**


    This kind of scam is also pretty common in the crypto circle. This happens quite
    often in ICOs and small crypto exchanges. The plan is simple. You overhype a scheme,
    get the investment, and run. It is simple in principle, but people have added
    extra levels of sophistication to make it even more convincing.


    Some people would put together a fully functional crypto exchange. That means,
    they can take your coin and you can trade with them. At least, that is what you
    are seeing on your screen. Behind the scenes, scammers would sell off your coins
    and manipulate the exchange’s accounting system to make you think that you are
    actually trading coins.


    The balance you see does not reflect the actual wallet on the exchange, which
    has already been emptied out. Keep in mind that you need to transfer coins into
    the exchange’s wallet in order to start trading. If you do, the scammers will
    empty it out the instance the coins come in.


    The jig is up when you make a withdrawal request. Now, some scammers are willing
    to part with some coins to keep up the game. But, if the withdrawal gets too close
    for comfort for the scammers, they will just shut down the website. Plain and
    simple.


    Of course, just because a website is down does not mean it is a complete scam.
    Sometimes, the exchange’s wallet came under cyberattacks. Maybe there was a bug.
    Your coins might be liquidated to pay for the bill. Regardless, the outcome is
    the same. The coins are gone and so is the website. All you get is a vague error
    page, maybe an error 404, and no way to recover your coins.


    Sometimes, they have another variation. That is scamming via KYC form. This is
    where you fill out your personal information. They would simply open up a crypto
    exchange that allows everyone to sign up without filling out a KYC form, which
    involves sharing private information that people aren’t comfortable with. Since
    this is cryptocurrency we’re talking about, people are more sensitive about privacy
    and anonymity.


    So, people would come in without the need to fill out a KYC form. But once they
    make enough money and go to make a withdrawal, they are suddenly required to submit
    a KYC form or keep all their spoils on the exchange, basically forfeiting everything
    to the scammers. How could this happen?


    Most people would fail to read the fine print in the terms of service or any agreement
    they inadvertently agree to regarding the KYC requirement upon withdrawal. Legitimate
    crypto exchanges let people know well in advance of their policy change that would
    require KYC upon withdrawal. But for scammers, they don’t have to complicate things.
    They can put it in the fine print, sneak in a policy change without notifying
    the users, or simply spit an error message whenever people try to submit the KYC
    form to get their money.


    Regardless, the result is the same. You can’t submit the KYC form and all your
    coins on the exchange are gone. They will have all sorts of excuses, but nothing
    in the way of reparation.


    So, how can you stop that from happening? First of all, have your own wallet.
    Putting all of your coins on your crypto exchange wallet is just asking for trouble.
    Have a mobile app on your phone or computer to store your coin, or better yet,
    have a hardware wallet. A cold wallet that is disconnected from the internet would
    be your best bet in protecting your investment.


    Of course, as mentioned before, you would need to have coins in your crypto exchange
    wallet in order to trade. So, the safest method to approach this would be to have
    only the amount you need in your crypto wallet and transfer everything out at
    the end of the day. At the very least, only keep the coins you need to use the
    next day on your crypto exchange wallet. Yes, it is a hassle having to do it every
    day, but you never know when it will end up saving your investment.


    In other words, you should never trust any exchange, ever. Sure, some popular
    exchanges such as Coinbase are trustworthy and they would never steal your coins
    since their reputation is on the line. But crypto exchanges work like banks.


    It does not really matter how trustworthy or regulated they are, or even how much
    money they have, there will come a time when they stumble and they may go bust.
    Crypto exchanges function largely similarly to banks since they only have a small
    share of all the coins that move in the blockchain networks.


    Plus, there are a few things that work behind the curtain that you have to understand.
    First of all, when you trade one coin for another, the accounting system will
    update your balance accordingly. The coins that move out of your crypto exchange
    wallet would be held in a cold wallet elsewhere, which is separate from the accounting
    system. So, when you go and make a withdrawal, be it cash or coin, you would get
    it from a new account, usually separate from the exchange itself. The accounting
    system would also update to reflect this change.


    In simple terms, a crypto exchange works very much like a casino, except the odds
    aren’t skewed against you that much. You go to the person who handles the exchange
    from cash to chips and vice versa. You give them money and they hand you back
    some chips. You play with those chips and after you are done, you go back to the
    same person and they will take your chips and give you money.


    This disconnect between the actual amount of coins the crypto exchange has to
    the coins you use to trade with allows the crypto exchange to work somewhat like
    a reserve bank. They never have enough cash to pay everyone if they all simultaneously
    request a withdrawal. If they do, the crypto exchange would just capitulate and
    disappear.


    And the crypto exchange may disappear, especially when they no longer make a profit
    and going forward would not yield any economic benefit for the owners. If the
    crypto prices suddenly yet slowly rise without any explanation and there are slow
    payments from the exchanges, it is time to leave.


    So, you should always make it a habit to move all your wealth from your crypto
    exchange at the end of the day. You should also only use the most popular crypto
    exchange such as Coinbase. There may be newer ones that you want to try out since
    they offer better security and other handy features, but if you do go there, keep
    an eye out for two things.


    The first is how fast they pay you when you request a withdrawal. It should not
    take more than a few days. If the new crypto exchange needs a week or two just
    to make a withdrawal, that’s a red flag.


    Also, you should test out how fast they respond to you. A solid crypto exchange
    should have a very active customer support network. It usually does not take them
    more than a business day to respond. If they are slow to respond or do not respond
    to your email at all, you should not be using that crypto exchange.


