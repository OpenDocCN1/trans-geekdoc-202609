- fmt: '

    Just like crypto exchanges, crypto wallets should have a solid infrastructure
    for their customer service. They should be very responsive and can answer most
    of your questions. This is doubly important when you are operating in the cryptocurrency
    environment, where market values go up and down very quickly.


    ## Liquidity Risk


    Funding or cash flow liquidity risk is another thing to consider as it can affect
    your ability to trade off your coins quickly during peak trading hours. In this
    context, liquidity refers to how fast or easily you can buy or sell your coins,
    including the speed at which cash would be converted to coins and vice versa.
    Funding or cash flow liquidity risk refers to whether the firm or company has
    enough assets or funds to support its liabilities.


    ## Blockchain Evolution


    There is also the question of future-proofing features. Blockchain technology
    is continuing to develop by the day. There may be new breakthroughs or updates,
    and your wallet needs to be able to keep up with the changes to the blockchain
    network. This applies not just to crypto wallets, but also to crypto exchanges
    as well.


    Normally, the developers are pretty vocal about their upcoming update that can
    break the current platform, and they also give people plenty of time to prepare.
    So, keep an eye out for that and see what your crypto exchange or crypto wallet
    provider is doing in preparation for that update.


    When the update hits, there might be some issues. Programmers and developers would
    know that when one fixes a bug, they may inadvertently introduce a bunch of new
    ones. Something may break, and it will take a while to fix.


    So, your best bet would be to keep your coins in a hardware wallet in cold storage.
    Once everything is patched up and ready to go, you can jump straight back in.


    ## Custodial Wallet


    Finally, and most importantly, go for non-custodial wallets. What are they? Simply
    put, they are wallets that users have full control over. In other words, no one,
    not even the company that provides the crypto wallet, has control or access to
    the wallet. You are the owner of the wallet and only you can access it. Its importance
    can never be overstated.


    To be fair to custodial wallets, they are highly convenient. People who are new
    to the whole cryptocurrency world can start with custodial wallets first. Once
    they get a feel for how everything works, they can then move to non-custodial
    wallets.


    A non-custodial wallet gives you the ability to interact directly with a blockchain
    network, cutting out the middleman, which is in line with the spirit of cryptocurrency
    in the first place.


    There are two main types of non-custodial wallets: software and hardware.


    Software wallets are apps on your computers or phone. They generate a private
    key and store it as a file on your computer. The key (pun intended) here is that
    a non-custodial wallet does not store your private key on the provider’s server.
    It is all on your device, so your provider cannot access your money.


    But having a file on your computer can be risky. For this reason, you should find
    a non-custodial wallet provider that also allows you to protect your private key
    with a password and encryption. Again, maybe a two-factor authentication as well.
    This might be a bit of a hassle, but they serve as an additional layer of security.


    As mentioned before, you want a wallet that has the ability to generate and scan
    QR codes. If you install the software app on your computer, you lack that ability.
    For this reason, mobile wallets are also created, usually to pair with their computer
    app counterpart. Both apps work largely the same, but the mobile apps are more
    convenient in the sense that you can make quick everyday payments and scan QR
    codes. In addition to password and encryption, your phone may also come with other
    security features such as `TouchID` or `FaceID`.


    However, if you do not have that much confidence in the security of your everyday
    devices, you have the option to go for hardware wallets. These devices contain
    all the features you would want in a crypto wallet and are considered to be the
    safest option for coin storage.


    As always, make sure that you back up your private key in case something goes
    wrong and you lose access to your device.


    5![](Images/svgimg0003.svg)


    # INVESTING IN ETHEREUM


    While Bitcoin is the center of attention, anyone could see that Ethereum (ETH)
    is right there in second place. Of course, the price difference is astounding
    between the two. While Bitcoin is fixing to become the internet gold, Ethereum
    explores other avenues that enable new ways to fund startups and projects with
    interesting applications.


    The question then becomes, is it worth investing in Ethereum? We will answer that
    in this chapter.


    ## ETHEREUM STRENGTHS AND WEAKNESSES


    Ethereum refers to the blockchain network and Ether refers to the currency on
    said network. There are a number of benefits and considerations you need to go
    through when deciding whether to invest in Ethereum.


    ### Advantages


    The first and most important thing about Ethereum is its complexity. Ethereum
    uses smart contracts, which may seem very technical and full of jargon to a layperson
    because of how complex it can get, but there is value in this complexity.


    Ethereum provides this value in ways that Bitcoin could not. Transactions using
    Ether utilizes what is basically a self-executing contract that is slowly proving
    its value to companies. They can use this to enforce contracts without the need
    for a third party to oversee the whole thing.


    This creates a firm confidence in Ethereum, something that Bitcoin rather lacks.
    Even if the whole cryptocurrency market falls apart in the next few years, Ethereum
    still has some utility values in its smart contract. So, if the crypto market
    collapses, Ethereum stands a good chance of surviving the fallout because there
    is still a need for smart contracts.


    Speaking of utility, Ethereum is also more than just a cryptocurrency. Other than
    smart contracts, the platform itself is a breeding ground for groundbreaking ideas.
    Many startups and tokens are created on the platform and Ether is needed to fuel
    these projects. The platform itself supports Decentralized Finance (`DeFi`) projects,
    `dApps` (apps on the blockchain), which gives Ethereum a lot of utility.


    Ethereum can be used in different sectors such as medicine, energy, or even gaming.
    The platform allows developers to create tokens, which can foster the tokenization
    of art, patents, voting history, ID verification, medical records, and other complex
    tasks.


    Plus, Ethereum is also very affordable. It is still the most expensive Altcoin
    in the market today, but it is far cheaper than Bitcoin. So, you can get into
    the Ethereum market a lot easier than Bitcoin. Add to that the ability to invest
    in startups with Ether, and you can see why Ethereum comes as a close second to
    Bitcoin. If Ethereum was created before Bitcoin, it could very well be the leading
    cryptocurrency right now.


    Another benefit to Ethereum is that its coin, Ether, no maximum supply. The developer
    has no plan to put a hard limit on how many Ether can be in circulation. That
    means, the price for Ether would remain more or less stable since Ether would
    be needed to execute contracts and transactions.


    ### Drawbacks


    The first problem could come from the fact that it may struggle with scaling.
    Bitcoin is created to be the digital gold, or a medium of exchange just like fiat
    currencies. It has only a single purpose.


    Ethereum, on the other hand, has to fill many shoes. It needs to be a ledger,
    a platform for smart contracts, etc. While the broad scope may be appealing, it
    can also lead to breakdowns, hacks, and bugs.

