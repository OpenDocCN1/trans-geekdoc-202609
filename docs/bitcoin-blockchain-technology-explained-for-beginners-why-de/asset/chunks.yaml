    The platform itself can be used to create new apps and tokens. Developers do not
    need to focus much on creating an entire blockchain network that is small and
    vulnerable just to power their dApp. Instead, they can piggyback the `Ethereum`
    blockchain and go from there.


    The only problem here is that Ethereum uses `Solidity`, which is another programming
    language that can be pretty tricky to learn. Since it is a relatively new programming
    language, coupled with the fact that its application is limited to `Ethereum`,
    `Solidity` has very little support.


    It is not easy to find beginner-friendly tutorials. Most of the guides you find
    out there are usually for people who know coding like the back of their hands.
    It will definitely slow down the token development process, but it gets better
    over time once the developers figure out how to navigate this new programming
    language.


    Also, the fact that `Ether` is used to fuel transactions might not be appealing
    to some people. `Bitcoin` is considered to be a crypto gold but `Ether` is more
    like gas used to fuel smart contracts. As mentioned before, `GAS` fees are basically
    the cost needed to execute a transaction. You do not need much, but it still cuts
    into your margin. For some investors who are interested in holding onto the coins,
    losing them in some small transaction is a big no-no for them.


    Finally, `Ether`’s unlimited supply can be both a blessing and a curse. When we
    talk about price, we need to understand supply and demand. Low supply and high
    demand mean high prices. High supply and low demand mean low prices.


    The developers behind `Bitcoin` decided to put their feet down and put a hard
    cap on `Bitcoin` and control how many coins can be released into circulation.
    Plus, every four years or so, there would be a halving in which the rate of `Bitcoin`
    is given to miners (which is the only way to inject `Bitcoin` into circulation)
    is cut in half. Whenever this has happened, `Bitcoin`’s price skyrocketed for
    a moment before settling down again at a price higher than that before the halving.
    It is believed that the last coin to be released into circulation would be around
    the year 2140.


    There can never be over 21 million `Bitcoins` in circulation, so this effectively
    controls the supply, which influences its price. Sure, the fact that cryptocurrency
    is almost infinitely divisible can alleviate the supply problem, but the presence
    of that hard cap allows `Bitcoin` to retain its value once the maximum number
    of coins is reached.


    No one really knows what would happen when `Bitcoin` reaches that cap. Maybe users
    would need to use `Bitcoin` as `GAS` fees just like `Ethereum` since miners need
    to be compensated, after all. Maybe the `Bitcoin` limit would be raised.


    Going back to `Ether`, the fact that there is no limit and the fact that it is
    used up to fuel transactions means that `Ether` might not rise in price all that
    much. Though `Ether` is the second biggest cryptocurrency in the market, its value
    is not even in the same ZIP code as `Bitcoin`. That means, `Ether` is probably
    not a good investment for those who are looking to pull a `HODL` strategy.


    ## SHOULD YOU INVEST IN ETHEREUM?


    That depends on how you plan to use `Ethereum` and the risks/rewards associated
    with the cryptocurrency. If you buy `Ether` to fund startups or projects via `ICO`,
    then `Ether` is definitely worth it. Plus, `Ether` has more utility than `Bitcoin`,
    which ensures that there is always demand for the coin, despite the fact that
    there won’t be a limit on supply.


    However, `Ether` is probably not a worthwhile investment if you are trying to
    execute a `HODL` strategy. Its value is minuscule compared to `Bitcoin`. There
    is an infinite supply of coins. If you want to trade `Ether` as if it is a stock,
    you are better off investing in `Bitcoin` and `HODL`.


    ## ETHEREUM VS. BITCOIN


    A lot of people ask what is the difference between `Ethereum` and `Bitcoin`, and
    which one they should invest in because all the resources out there say that both
    are good investment options. Here, we will quickly go over the key differences.
    But before that, we need to grasp the basics of these two major cryptocurrencies.


    `Bitcoin` was launched in early 2009 by `Satoshi Nakamoto`. The idea behind `Bitcoin`’s
    creation is to create a secured cryptocurrency that is independent of any central
    authority. `Bitcoin` has no physical form and its blockchain network records all
    transactions on secured public ledgers. Though `Bitcoin` was not the first-ever
    attempt in creating a virtual currency of this type, its launch was the most successful.
    It laid the foundation for all other cryptocurrencies that came after it. Over
    the years, its value continues to go up and is now starting to gain acceptance
    among regulators and government bodies.


    `Ethereum` was introduced in mid-2015, and it is the largest and most well-known
    and well-established open-ended platform for decentralized software. `Ethereum`
    has a different goal in mind. It provides people with a platform to develop apps,
    and its coins `Ether` have more utility beyond just a digital currency.


    As mentioned before, `Ether` is used to make payments, as collateral, and as a
    store of value. It is also needed to fuel transactions on the platform and `dApp`
    developers use it to build and run their `dApps` on the platform.


    ### Key Differences


    With the basics in mind, let’s talk about how they are different, to help you
    understand which one is worth investing in if you have to choose one.


    ### History


    `Bitcoin` was the first cryptocurrency, so you can blame it for starting all of
    this. The creator, `Satoshi Nakamoto`, remains anonymous to this day. No one knows
    if it is a person or a group, or even if they are alive or dead. `Ethereum` was
    created in 2015 by `Vitalik Buterlin`, a researcher and programmer. He looked
    at `Bitcoin` and its blockchain network, understood their flaws, and set out to
    work on a new platform that improved upon `Bitcoin`. His platform provides a lot
    more functionality and it is used for the development and use of distributed applications
    (`dApp`) as well as smart contracts.


    ### Concepts


    Here, while both `Bitcoin` and `Ethereum` allow peer-to-peer (`P2P`) transactions
    and they can be used as a payment method, their similarities end here. `Bitcoin`
    functions as a replacement for fiat currencies without the issues associated with
    the latter. The transaction fee is low and there is no central authority to dictate
    the value.


    For `Ethereum`, its application goes beyond just being a currency. It also provides
    developers with a platform to create `dApps` and smart contracts. Therefore, `Ethereum`
    is the platform where groundbreaking blockchain-based technology is likely to
    be developed. If such a thing were to happen, it would take place on the `Ethereum`
    network.


    ### Mining


    `Bitcoin` uses a `Proof of Work` validation method. In short, miners race to solve
    a mathematical problem in order to validate the transaction. Whoever gets it first
    wins some coins. Since this is a race, not many people would win and many people
    end up losing money because they have to pay their utility bills while earning
    nothing from mining.


    `Ethereum` used to have the same validation method. However, it is moving to a
    new validation system called `Proof of Stake`. Simply put, miners would be randomly
    chosen to propose a block and other miners would also be randomly chosen to attest
    that they have seen the block. Once enough consensus has been gathered, the block
    is added.


    The difference here is that in `PoS` consensus model, everyone has a good chance
    of being chosen either to propose a new block or to provide their attestations.
    Moreover, the hardware requirement for mining `Ethereum` is much lower since there
    isn’t a lot of processing to do. `Bitcoin` mining is a very power-intensive process
    and the hardware requirement is very high if you are willing to get yourself a
    mining rig.


    ### Fees

