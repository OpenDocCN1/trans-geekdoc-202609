  trans: '


    虽然 OMG 在市场上还很新，但在泰国非常流行，目前泰国已有 240 家麦当劳分店接受其作为支付方式。这种成功部分归功于泰国人支持他们自己的产物，例如泰铢、当地制造的泰国产品等。因此，OMG
    在那里获得成功也是情理合理的。


    ## VeChain (VEN)


    VeChain 利用其强大的平台提供了一种改进业务供应链的方法。通过其区块链，公司可以快速地进行交易，每秒可达 10,000 次。此外，VeChain 还提供了透明度，允许企业创建并存储细化到分钟的详细交易记录。而且，他们可以无限期存储这些信息。


    除此之外，VeChain 目前正在开发一种微芯片验证系统，以便平台上的每种产品都能轻松通过身份验证，从而打击假货并增强客户信心。


    就像 OmiseGo 一样，VeChain 是在 `Ethereum` 区块链网络开发的，并且仍在在使用。然而，开发者目前正在为自己开发一个新的全新的区块链网络。这是一个可行的方案，因为系统中有足够的需求和矿工，安全性将不再是一个问题。这次向新区块链的迁移意味着将
    `BeChain (VEN)` 重命名为 `VeChain Thor (VET)`。


    ## NEO (NEO)


    NEO 总部位于中国，中国目前正在努力清除网络上所有形式的加密货币。可以理解的是，他们希望对公民的财富拥有完全控制权。


    NEO 有一个雄心勃勃的目标。那就是创建并支持一种新的数字“智能经济”。它的平台允许开发者创建去中心化应用（`dApps`），这些应用可以使用智能合约进行快速且安全的交易。


    尽管对加密货币进行了打压，NEO 仍然成功筹集了足够的资金来开发和启动其项目。这导致一些人认为它与中国政府有关。无论事实如何，除了双方之外没人知道。


    无论如何，NEO 的成功将完全取决于中国政府未来对加密货币的政策。如果他们决定完全禁止加密货币，那么 NEO 雄心勃勃的目标将化东流。


    ## Lisk (LSK)


    与 NEO 和 `Ethereum` 类似，Lisk 是一个为创建 `dApps` 提供解决方案的区块链平台。那么区别在哪里呢？Lisk 更强调帮助开发者。你可以认为，Lisk
    区块链生态系统运作非常像一个城市。


    把整个区块链想象成一个城市。主路是主链。从这条主路延伸出来的是侧链，就像大道。鼓励开发者在侧链上创建他们的 `dApps`，消费者可以使用这些侧链进行交易。开发成本将由交易费和其他奖励涵盖，这意味着鼓励开发者继续创新并致力于
    Lisk 生态系统的工作。


    ## Qtum (QTUM)


    Qtum 读作 Quantum，总部位于新加坡。它的目标是提高智能合约对企业的触达范围和操作性。它提供了一种无需第三方即可快速、安全、方便地进行交易的解决方案。他们旨在通过将
    `Bitcoin` 的稳定区块链结构与 `Ethereum` 的智能合约技术相结合，使用 `Proof of Stake` 共识模型来实现这一点。它目前仍处于开发的早期，但开发者已经有了一些雄心勃勃的计划，通过与许多
    ICO 项目建立新的合作伙伴关系来扩张。


    ## Filecoin


    Filecoin 在 2017 年发起了 ICO，是目前最受期待的代币项目之一，筹集了超过 2.57 亿美元的资金。尽管它甚至还没有 alpha 版本，但它之所以如此成功的原因在于其团队的实力和支持者的背景。


    那么，Filecoin 正在努力实现什么才使其如此成功？它是一个去中心化的区块链生态系统，提供了一种安全高效地存储数据的方法。数据泄露无论在罚款还是公关方面都是非常昂贵的，除非你有顶级的安全措施，否则它们发生得很频繁。


    Filecoin 利用区块链的防弹安全性来存储数据，从而最大限度地减少甚至完全消除数据泄露风险。正因如此，它获得了一些硅谷重量级风险投资公司的支持，这贡献了其巨大的资金。


    ## Ethos (ETHOS)


    Ethos 总部位于美国，仍在开发中。他们的目标是帮助加密货币在全球范围内普及。为此，他们创建了一个平台，为用户提供广泛的区块链功能，旨在简化加密资产的存储、管理和交换。


    以 Ethos 的钱包为例。它旨在兼容任何加密货币，并提供一个安全的空间来存储你的币，同时允许你随时随地、立即地发送它们。


    虽然还不知道何时发布公共版本，但至少 Ethos 发布了一个 alpha 版本，且 beta 版已在路上。这至少表明他们正在积极地推进该项目。


    ## Substratum (SUB)


    如果你在互联网上呆了一段时间，你可能会意识到消费者数据有多么价值。否则，公司就不会收集它们。美国的网络中立性已经死亡，全球其他司法管辖区，特别是那些政权并不民主的地区，正在努力货币限制、审查或完全阻止对各种数据的访问。


    这产生了一种更民主、更易访问且最重要的是免费的手段，在网络上共享数据而不受任何审查或限制。这就是 Substratum 的用身之地。它是一个开源去中心化区块链网络，旨在赋予用户在没有任何形式限制的情况下共享信息的能力。


    这在字面上是真正的即插即用。你不需要安装任何软件。你只需要在浏览器上安装它即可。尽管如此，你的设备将作为节点参与区块链，并作为另一个内容提供者，通过区块链协助请求信息。如果你这样做，就可以获得一些
    `SUB` 令牌作为奖励。


    ## EOS Token (EOS)


    EOS 是一种半去中心化的数字货币，为 `dApps` 和 `DAOs` 提供动力。许多人认为 EOS 是 `Ethereum` 的直接竞争对手。就像 `Ethereum`
    一样，EOS 开发者希望加密货币成为世界领先的智能合约平台。


    从核心来说，与 `Ethereum` 相比，EOS 的速度快且扩展性更强。缺点是它必须放弃一些去中心化能力以来实现这种功能。在这种情况下，EOS 将控制权交给了所谓的“委托权益证明”共识机制（`dPoS`），并有自己的宪法来在平台上建立基本规则。


    然而，EOS 在整个加密货币领域仍然非常新，在被认为是以 的严肃竞争对手之前，还有很长的路要走。由于由于原因，EOS 尚未被广泛接受。


    ## Ripple (XRP)


    Ripple 更像是一个可以用于支付的数字令牌。它由 `Ripple Labs` 创建，允许用户使用法币进行快速的跨境支付。因此，XRP 也被称为“银行币”。`Ripple
    Labs` 团队将 XRP 设计为最快且扩展性最好的数字资产。


    ## TRON (TRX)


    Tron 是一种用于数字娱乐和内容生成的数字货币。TRON 协议具有大量的扩展性、可用性和吞吐量计算支持，使得在 TRON 生态系统中构建 `dApps`
    成为可能。


    '
- fmt: '

    Other than that, it also works with Ethereum smart contracts. The idea of the
    TRON blockchain network is to decentralize content delivery on the internet. The
    `TRX` coin would be used to share content on its native blockchain network and
    also to compensate content creators who share their work on the network. For this
    reason, `TRX` is considered to be both a digital currency and a utility token.


    ### IOTA (MIOTA)


    As the name might suggest, `IOTA` is a unique project that aimed at improving
    the Internet of Things (IoT) by enabling quick machine-to-machine transactions
    across IoT devices without any fee. This functionality is a bit ahead of its time,
    but the people at `IOTA` want to work on the future of IoT. For now, `MIOTA` can
    be used as a cryptocurrency for normal payments, so it is more like a digital
    currency.


    ### Uniswap (UNI)


    `Uniswap` was developed on the Ethereum blockchain. It is a dApp for exchanging
    Ethereum tokens via liquidity pools. For this, `Uniswap` offers two services:
    providing and using liquidity.


    `Uniswap` allows users to exchange Ethereum-based cryptocurrencies in an instant
    by utilizing its smart contract liquidity pools. The liquidity pools are made
    up of other users who get some exchange fees by providing liquidity. These fees
    are paid using `UNI` tokens.


    ### Stellar Lumens (XLM)


    `Stellar` provides users a platform that brings together the world’s various banking
    systems that has different and disconnected payment methods. Their network connects
    all these systems together via a decentralized ledger.


    `Ripple` is currently dealing with the SEC’s investigations and `Stellar` is its
    direct competitor. This could open up the space for `Stellar` to take the leap
    forward and become the global payment network.


    As a way to combat spam on the Stellar Network, users need to pay a small transaction
    fee and also meet a margin requirement. All of this is complete by spending `Lumens`,
    which is `Stellar`’s token.


    ### Aave (AAVE)


    Some offer decentralized lending services in the crypto world. However, due to
    the anonymous nature of blockchain, there needs to be a lot of trust between the
    lender and the borrower, which usually does not work out. That and the fact that
    the interest rates are higher in decentralized lending means that lenders need
    to have some sort of security without giving up their anonymity.


    `Aave` comes in by offering smart contracts between the two parties. In this case,
    the borrowers must provide collateral that is greater in value than the amount
    they want to borrow. This would be put into the smart contract, which would then
    deposit in `Escrow` throughout the entirety of the loan term. This effectively
    reduces the need for a trusted third party.


    In the event that the borrower could not pay back the loan, the smart contract
    would kick into gear and release the collateral to the lender. Since the collateral
    is greater in value compared to the borrowed amount, the lender does not lose
    much.


    In addition, `Aave` offers a 10% annual percentage yield (APY) for loans with
    specific stablecoins. In this case, there is no know-your-customer (KYC) required,
    which is something that has never been done before in the traditional finance
    world.


    ### Dogecoin


    At the moment of writing, `Dogecoin` took a surprising turn and skyrocketed in
    price. It is included in this list not because it has anything special. In fact,
    it’s quite the opposite. `Dogecoin` was launched back in 2013, using the “Doge”
    meme that depicts Shiba Inu, a Japanese dog breed, as its mascot. It has no promising
    features nor does it introduce any new sort of technology. The devs behind this
    coin were honest and said that the coin was created as a joke. Nothing more. Nothing
    less.


    So, what’s the reason for its price surge?


    Again, at the moment of writing, there is a movement to pump GameStop’s prices,
    a collective movement orchestrated by a Subreddit called “WallStreetBets”. This
    movement was done when a Reddit user named “Deepf\*\*kingValue” noticed that many
    hedge funds are shorting GameStop’s stocks, way past the number of stock it physically
    has. So, he proposed to pump the price up to mess with the major financial institutions.


    Keep in mind that this movement is done for several reasons. The first is the
    2008 Great Depression that saw many major financial institutions getting biled
    out by the U.S. government and the common folks had to deal with the financial
    hardship. The second is the Covid pandemic, which resulted in the U.S. government
    doing pretty much the same thing.


    This also happened to be one of the reasons why people are starting to turn to
    cryptocurrency. It takes the power from major financial institutions and puts
    it back into the people’s hands. Cryptocurrency democratizes wealth.


    And so, the whole GameStop fiasco ends up costing major hedge funds a lot of money.
    `Melvin Capital` is one of those caught in the blast because of their greed, and
    end up losing $4.5 billion, and it is very likely that they are still reeling
    from the blows and are on full damage control.


    But before this, `WallStreetBets` is a Subreddit for people who came looking for
    investment advice (usually getting none) and posting their wins, and mostly losses.
    It is a rather nasty place, hinted by the fact that each user on the Subreddit
    describes themselves as monkeys and degenerates. In other words, these groups
    are mostly unorganized and have little knowledge in investment. More often than
    not, they would treat the stock market as a casino (hence the name) and they end
    up losing a lot of money, which did not really bother them all that much.


    Why the long description of `WallStreetBets`? Because there is a similar Subreddit
    called `SatoshiBets`. It is filled with memes, dark humor, and people losing a
    lot of money. This time, they are losing it over bad crypto trades.


    This community is primarily responsible for propelling `DogeCoin` into the top
    ten cryptocurrency list on many crypto exchanges, but not really because they
    are scornful. They saw that the people at `WallStreetBets` could “meme” a stock
    sky high, so they set out to do the same. They piled on in and it was a great
    success. The surge in `Dogecoin`''s price also coincides with the landmark public
    listing of `Coinbase`.


    The question then is, is it worth investing in `Dogecoin`? If you happen to catch
    the rising trend of `Dogecoin` before its eventual crash again, you can give it
    a shot. But it is still a very risky investment.


    There really is no future potential for this cryptocurrency. It was created simply
    as a joke. It only achieved this status now because people piled in to buy the
    coin. Some of them would wait until the price was high enough so they could bail
    out before the bubble burst. It is like the 2016 Bitcoin craze all over again.
    That means, some people will make a lot of money but many others will be in the
    red.


    For the people at `SatoshiBets`, losing money is probably fine for them. They
    got into this game knowing that they would lose a lot of money. Perhaps they are
    just in for the ride, and we can’t really judge them for that.


    But for those newbie crypto investors who want to make a quick buck from it, it
    is a very risky cryptocurrency to get into. For those who want to HODL, it is
    extremely risky and should not be attempted unless you monitor every single price
    movement and get out before the crash.


    ## HOW TO DIVERSIFY


    As with anything in life, diversifying your cryptocurrency investment portfolio
    is not that simple. If you’re just trading cryptocurrencies the way you trade
    the Forex market, then this probably won’t be useful to you. In that case, simply
    jump between cryptocurrencies and make use of the price swings to make a profit.

