    **Exiting the Market**


    Of course, when you enter a market, you have to think of your exit strategy well
    in advance. You want to know when you want to get out so you can cash in on your
    profits. The crypto market’s off-ramps pose another problem for many investors.
    It is with the exchange rate. Most exchange only allows you to withdraw in USD.
    If you’re in the United States, that is fine. Other exchanges might offer JPY,
    GBP, or EUR, but your options are nonetheless limited.


    The problem is that while blockchain allows for cheap and fast transactions, you
    are still subject to the inefficiency and slow speed of major financial institutions
    once you are out of the system. Most exchanges have a high minimum amount if you
    want to withdraw your fiat currencies.


    To make matters worse, they also only accept major cryptocurrencies such as Bitcoin
    or Ethereum. Once you get past that hurdle, you also need to wait on the exchange
    to send the money over to your bank. This is outside the blockchain network, so
    you have to put up with the tedious process that can take up to months to complete.


    To this day, some exchanges are allegedly withholding funds without a clear reason
    and most banks are still wary of accepting cash from the sale of cryptocurrency.
    All this factor means is that investors have to put up with the exchange rates,
    fees, and other risks if they happen to be using exchanges that lack transparency.


    Of course, if they were to invest using fiat currencies directly, they would still
    have to deal with similar hurdles, but they won’t have to worry about the initial
    steps they had to do with cryptocurrencies.


    2 ![](Images/svgimg0003.svg)


    # BEFORE YOU INVEST, THINK


    With the crypto basics out of the way, let’s talk about investment. Or rather,
    before you do, you should stop and think of a couple of things before you dive
    in. Cryptocurrency can serve as a lucrative investment option if you know what
    you are doing. As always, investing in cryptocurrencies is not for everyone. So,
    this chapter will help you determine whether you should set aside some cash and
    try to make more money. Even if it does not stop you from jumping into the game,
    it at least gives you something to think about when you do.


    ## CAN YOU AFFORD IT?


    First thing first, can you actually afford to invest in cryptocurrencies? That
    might sound silly. Of course, anyone can set aside a hundred bucks and buy some
    coins to get started. The real question is intended to access your financial situation.


    It should go without saying, but investors know to invest only as much money as
    they are willing to lose. In other words, the money they put forward in an investment
    is the money they are willing and can afford to lose.


    Your financial situation could be different. Perhaps you are struggling and barely
    get by every month and you want to make some more money by investing in cryptocurrencies.
    You can argue that the price volatility could help you turn a profit here and
    there when the price swings favorably. You might be right and you could theoretically
    catch these price swings.'
