    # Cryptography Made Simple


    Cryptocurrency got its name as a cross between currency and cryptography. Although
    cryptocurrency boasts bulletproof encryption to protect data, not many people
    understand what cryptography is and how is it linked to cryptocurrency.


    Let’s start with the basics. Cryptography is the practice of encrypting information
    in a way that only the people “in the know” would be able to read it. That way,
    even if the information falls into the wrong hands, no one from outside would
    know what it means. It’s an ancient technique that is still used today, from Julius
    Caesar communicating with his generals using ciphers, to the Allied forces using
    encrypted messages so the Axis could not read it, even if they could intercept
    the message.


    Cryptography is needed to protect sensitive information or data from being stolen
    by someone who isn’t supposed to see it. The data can be anything from finance
    to military information. There are plenty of reasons why people would want to
    keep their private information private.


    As you can probably tell, cryptography can take on many forms. There are many
    ways to scramble data or information in a way that the recipient can decipher
    it. Before modern technology, people came up with creative ways to encrypt information.
    For instance, `BSELUEA` can go through a cipher and give you `BLUE SEA`. It’s
    a simple task of rearranging the letters in a specific way. Some would go as far
    as to create an entire alphabet.


    Nowadays, cryptography becomes much more complex thanks to computers. They can
    apply very complex mathematical technology to encrypt data. These technologies
    are now used for cryptocurrencies. But no matter how complex it gets, it always
    works on the same basic principle. That is to hide the actual information so that
    only authorized people can access it.


    ### So, how does cryptography apply in cryptocurrency?


    Cryptography is used in the blockchain network to protect the transactions, control
    the registration of new transactions, and verify the transfer of assets. To accomplish
    these goals, cryptocurrencies rely on public key cryptography.


    Public key cryptography gives users two separate keys. One is called “public key”,
    which is used to receive the coins. To access the coins, you would need a “private
    key”. Think of it like one of those blue mailboxes you find in public places.
    The public key would be the box itself since anyone can put mail in there. However,
    to access the mail in the box, you would need the key, and only the mailman has
    that key. This key to the box is the private key.


    The keys are normally around 30 characters long and are a jumbled mess of letters
    and numbers. It does not mean anything. The public key is also called the public
    address since that jumbled mess serves as an address so people can send you coins.


    These keys are linked to your digital wallet, where your coins are actually stored.
    So, anyone can send you coins into your wallet using your public key. However,
    to access the wallet, you would need a private key, which you should not share
    with anyone.


    Public key cryptography is a simple concept, but pulling it off is an impressive
    technological advancement. Even if cryptocurrency fades into obscurity in the
    near future, the technologies it leaves behind would benefit everyone. This cryptography
    is one of those technologies that will change the online payment industry.


    Though there are vulnerabilities with public key cryptography, it is all just
    human errors and there is not much technology can do to compensate for that. For
    instance, people could lose their private keys. If so, they might have no way
    of recovering the funds in their crypto wallet. Sometimes, they might accidentally
    reveal their private key to someone else and they could just access the wallet
    and steal everything.


    Again, this is just human errors but there are ways to prevent this from happening
    by setting up two-factor authentication, backing up the digital wallet, and keeping
    spare private keys. You can write your private keys on a piece of paper stick
    it somewhere that you know will be safe. Have a couple of copies in different
    places just to be safe.


    # Investing Crypto at Your Own Risk


    Before you invest in cryptocurrencies, you need to understand the associated risks.


    ### Price Volatility and Manipulation


    As mentioned before, cryptocurrencies experience very wild price swings. There
    are major price surges that are soon followed by crashes. These seemingly random
    events leave experts and investors alike amazed and baffled. Your profit today
    could be your loss tomorrow. The price swings so wildly that it is difficult for
    anyone to have the same confidence as the stock market or Forex. The volatility
    is oftentimes random and unpredictable, so even the strategies you meticulously
    planned out might not work because of factors outside your control.


    Speaking of factors, the volatility in crypto prices comes from three sources:
    market manipulation, speculation, and sentiment. Since the cryptocurrency market
    is largely unregulated and anonymous, the price becomes very volatile. Feelings
    run high. Influencers can manipulate prices just by tweeting. Price manipulation
    hasn’t been widely proven yet because of the anonymous nature of cryptocurrency,
    but it is not hard to see that it is there. The most common price manipulation
    tactics would be pump and dumps and shilling.


    ### Lack of Regulations


    The lack of a regulatory framework contributes to the problem. Governments across
    the globe are on the fence about the issue. Some outlawed cryptocurrencies whereas
    others are starting to accept them.


    For one, having a legal framework would be a sign that the government views cryptocurrencies
    favorably. It is the missing link that `Bitcoin` and `Altcoins` need to achieve
    widespread adoption. However, in the business world, you want to have as few regulations
    as possible so you can trade and make a profit easily. Too many laws mean more
    restrictions that could cut into your margins.


    At the same time, if there’s a lack of regulation, then the legal outlook would
    be uncertain. It means that the government does not officially support the coins
    and they may remain obscure and function as little more than speculative vehicles.


    The current legal framework for cryptocurrencies is complex, haphazard, and disorganized.
    The biggest concern right now would be taxes, as expected. It is all about the
    money, after all. The lack of regulations in this area or a “regulatory greyness”
    means that investors are uncertain of what obligations are required. They want
    to know how much they should set aside for taxes as well as what records they
    need to keep. Failing to meet these obligations comes with a very hefty price
    and investors do not want to make the `IRS` unhappy.


    Though regulations are slow to catch up to technology, when there is a lot of
    money on the line, the pacing is much better. In this case, regulations are catching
    up quickly to cryptocurrencies. Authorities in many countries are taking appropriate
    steps to introduce regulations. Research papers are being written, standards are
    set, etc.

