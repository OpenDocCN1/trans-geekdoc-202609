- fmt: '

    Ideally, you want to have two wallets: hot and cold. A hot wallet is connected
    to the internet and a cold wallet is usually offline. Having a wallet on an exchange
    is fine, but you should only have coins in there when you want to use them. Once
    done, you should move all your coins to a cold wallet.


    A cold wallet is a hardware wallet and is disconnected from the internet. This
    is perhaps the safest way to store your coins. Hackers cannot hack what is not
    connected to the internet, after all. That said, maintaining a hardware wallet
    can be difficult. You need to keep your private keys safe and accessible only
    to you.


    Other than that, you need to practice all the online safety procedures such as
    activating two-factor authentication and not clicking on suspicious links. We
    have covered this extensively in the first book.


    Another thing to keep in mind is that certain wallets can only hold a certain
    cryptocurrency. A Bitcoin wallet, for example, can only hold Bitcoins, not Ethereum.
    So, you can only send and receive Bitcoins. There are wallets out there that allow
    you to store different coins, but make sure that they are compatible with the
    coins you intend to own.


    # Understanding Crypto Transactions and Exchange


    In this section, we will quickly go over how you can send and receive cryptocurrencies.
    We have already talked about private and public keys. The public key is what you
    share with others so they can send coins to your wallet. The private key is what
    you use to access your wallet and your coins.


    So, to send your coins, log into your wallet and choose to send your coins. Keep
    in mind that coins transfer only works within the same blockchain network. In
    other words, you can only send and receive the same coins for your wallet. For
    instance, you can only send or receive Bitcoin since the transaction takes place
    on the Bitcoin blockchain network.


    From there, you just put in the recipient’s public key or public wallet address
    and choose the amount you want to send. Keep in mind that you may have to pay
    a bit of a transaction fee to grease the engine depending on the cryptocurrency
    you are dealing with. Once you get the amount and address right, you can send
    your coins away.


    This is the most dangerous part of the transaction. So, make sure to triple-check
    the address before you hit “send”. A QR code or straight-up copying the address
    instead of typing it in would help you avoid sending the coins to the wrong address.
    You may have the option to write a short note to the recipient as well to let
    them know why they just got some coins from you.


    Receiving coins from other people is a lot easier. You just have to share your
    public wallet address with the sender. Some crypto wallets generate a QR code
    that the other person can scan so they don’t have to go through the hassle of
    typing out your entire address.


    Other than that, keep in mind that it might take some time for the transaction
    to go through. The coins are usually sent almost instantaneously, but there have
    been cases when the transaction can take hours if the traffic is that congested.


    # Crypto Exchange Basics


    In this section, we will talk about crypto exchanges. They are basically where
    you would buy, sell, or trade your coins for other coins or for fiat currencies.
    So, they are the intermediary that facilitates the buying and selling process
    and charge some fees for their work.


    There are two types of crypto exchanges. You have the centralized crypto exchange
    and the decentralized exchange. Both have their strengths and drawbacks. Look
    for the cryptocurrency that suits your needs.


    ## Centralized Crypto Exchanges


    Centralized crypto exchanges are the most popular option. They function as the
    third party when you buy or sell cryptocurrencies. These exchanges are operated
    and controlled by a company. They are generally more reliable and user statistics
    prove just that. 99% of all crypto transactions take place on centralized exchanges.
    These include Coinbase, Gemini, Kraken, and GDAX.


    There are a few advantages of using a centralized crypto exchange. For one, it
    is more user-friendly both in terms of interface and its inner workings. It works
    very much like a Forex trading platform. So, it presents a familiar face and allows
    beginners to ease into crypto trading faster.


    Users just need to log in, take a look at their account balance, and then head
    straight to making transactions via apps or websites. No additional setup is needed
    from there.


    Plus, centralized exchanges are just as reliable. Ironically, having a centralized
    exchange for a decentralized currency gives users another layer of protection
    and reliability for transactions. A highly developed and robust platform gives
    users higher levels of comfort.


    That said, centralized crypto exchanges have their fair share of problems.


    For one, there is the hacking risk. These exchanges are operated by companies
    that are responsible for their customers’ coins. They usually have billions of
    dollars worth of coins in one place, which makes them a prime target for hackers.


    Then there are the problems with transaction fees. Again, these crypto exchanges
    operate entirely against the reasons why cryptocurrencies are created in the first
    place. They are meant to phase out the intermediary, cut down on the transaction
    cost, improving transaction speed, and offer anonymity by being a decentralized
    digital asset.


    Crypto exchange is a prime target for hackers since they hold all the coins in
    one place, they act as an intermediary, and they have transaction fees. The rate
    at which they charge you depends on the amount you are trading with, so make sure
    to read up on that before you decide.


    Some of the most popular centralized crypto exchanges include Binance, Coinbase,
    Bithumb, Bitfinex, Huobi Global, Bitstamp, FTX, bitFlyer, and KuCoin.


    ## Decentralized Crypto Exchanges


    On the other hand, there are decentralized cryptocurrency exchanges. These are
    not controlled by any companies. They function on peer-to-peer technology and
    allow for transactions without the need for a third party. The 1% of crypto users
    prefer this form of exchange since there are certain issues associated with centralized
    exchanges. Blocknet, io, Barterdex, and AirSwap are some examples of decentralized
    exchanges.


    Though unpopular, decentralized exchanges offer something that centralized exchanges
    just cannot.


    One of its biggest strengths is the hacking risk, which is virtually none for
    a decentralized exchange. In this exchange, there is no third party that the coins
    have to go through. It’s just the sender and the recipient. So, there is no company
    or organization that hackers can target. It’s just a bunch of people trading coins
    among themselves.


    Decentralized exchanges also prevent market manipulation. Since it operates on
    a peer-to-peer basis, it protects users from wash trading and fake trading.


    Then there is the anonymity that makes cryptocurrencies so great. On a centralized
    exchange, you have to tell them your name, banking details, ID documents, etc.
    Users do not have to fill any form to get started on a decentralized exchange.
    No private information is shared.


    So, what are the drawbacks?


    For one, decentralized exchanges are not user-friendly. You have to remember the
    keys as well as passwords to your wallets or risk losing everything in there.
    You also need to get comfortable with the platform and the process, which can
    take some time. Centralized exchanges make everything easy and convenient even
    for someone who is not tech-savvy.


    Decentralized exchanges also do not give the users the ability to convert their
    coins into fiat currencies. So, unless you already have cryptocurrencies in your
    wallet, getting into a decentralized exchange is less convenient.

