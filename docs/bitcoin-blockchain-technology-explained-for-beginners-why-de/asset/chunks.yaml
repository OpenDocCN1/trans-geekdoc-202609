    and potentially riskier investing ventures that might yield better rewards down
    the line.


    **The Anchor**


    The crypto market is notorious for its volatility. For this reason, you want to
    have something to fall back to when the sea is getting choppy and you see dark
    clouds on the horizon. For this, you want to have stablecoins in your portfolio
    to help you weather the storm. Pax, USDC, TrueUSD, and Tether are some good options
    here since they are tied to fiat currencies. That way, you are more shielded from
    wild price swings.'
