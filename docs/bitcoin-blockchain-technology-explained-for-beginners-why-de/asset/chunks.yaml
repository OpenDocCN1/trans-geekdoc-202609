    The first country to start building up a robust regulatory framework for cryptocurrency
    is Switzerland. Their idea is to create as few rules as possible so that the market
    remains free, but provide enough rules that go with other legal frameworks so
    that companies know what obligations they need to fulfill through a “sandbox”
    so that startups can play around with their innovations within a controlled environment.


    Singapore and Britain are also starting to experiment with their blockchain and
    crypto regulatory environment. This environment allows companies to experiment
    under relaxed regulations and licensing requirements. For the United States, there
    is a study on exchanges created by the New York Attorney General’s Office.


    ## Market Adoption


    Bitcoin strives toward widespread adoption, but there are a number of things that
    are holding it back such as regulatory concerns, market volatility, the lack of
    understanding from the public, among other things. That and the fact that cryptocurrencies
    and the blockchain technology that powers them are still new, there is a chance
    that cryptocurrency would not be broadly adopted. By that point, cryptocurrencies
    would lose all of their value. While no one really knows when the deadline would
    be, cryptocurrencies need the law, technological improvements, and institutions
    to back them up as soon as possible if they were to grow in scale.


    ## Security, Custody, and Consumer Rights


    Although the blockchain network is secure, there are other points of vulnerability
    in its ecosystem. Users need to take all measures to store their cryptocurrencies
    and other crypto assets or risk losing it all.


    Crypto exchanges are viewed as one of the most unsafe places to store your cryptocurrencies.
    Most exchanges give you a wallet to store your coins, but there have been cases
    where they have been hacked and all the coins were stolen. Of course, most exchanges
    you see today would talk about their top-notch security and that your coins would
    be safe with them. But it is better to be safe than sorry and store your coins
    in a hardware wallet.


    To make matters worse, lost or stolen coins or assets cannot be recovered. Tracking
    down where your coins went is nigh impossible. If you send your coins to someone
    by mistake, there is no way to reverse the transaction either. The best you can
    do is to ask them nicely to send you back the coin. That is, assuming that you
    know who got your coins in the first place.


    Because there is no intermediary, cryptocurrencies do not have central or official
    safeguards or insurances. How much you get from rebates on lost investment depends
    entirely on the organization you are doing business with.


    Thankfully, there are now custody solutions that allow financial institutions
    to act as an intermediary in such a transaction. This is one of the things cryptocurrencies
    desperately need to gain trust and receive widespread adoption.


    The system works by having a third party holding onto the cryptocurrencies on
    behalf of the trading clients. Once the products or services are given and all
    are satisfied, then the coins would be sent to the provider. The basic system
    includes three parties. The client, the provider, and the mediator. The client
    purchases goods or services from the provider, but place the coins with the mediator
    until the provider delivers the goods or services. Once done, it takes two out
    of three approvals from the parties involved to release the funds. If there are
    any disputes, then the mediator may step in and resolve the conflict.


    This gives investors an added level of security when investing their expensive
