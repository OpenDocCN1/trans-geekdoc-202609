- fmt: '

    Stablecoins offer a great way to protect your portfolio from the unpredictable
    volatility of the crypto market. They provide you with on-demand liquidity. In
    simple terms, because they have a relatively stable value, you can put money into
    them knowing that their prices won’t change much in the future and you can sell
    them off to get some money for a rainy day.


    So, when the market takes a hit, at least you still have your investment in stablecoins
    while the rest of your portfolio might be going down the drain. But since their
    prices are relatively stable, you probably won’t get any long-term benefit from
    them. That said, they have another interesting use.


    Suppose that the price for a particular cryptocurrency plummets and you want to
    buy the dip. You know that the price would skyrocket in the near future and you
    want to catch the trend before it happens. The problem is you don’t have much
    money on you. No problem, you can just sell your stablecoins and put the money
    into the cryptocurrency while the price is low. When it jumps back up, you can
    sell off some of your coins and put them back into your cash reserve, and pocket
    the rest.


    ## The Fringes


    To be honest, you can stop at the last stage and sit quite comfortably with your
    investment. However, there is no harm in branching out if you know what you are
    doing. In this case, you want to be looking for smaller, niche protocols that
    have potential. You just look at upcoming projects that you believe will be successful
    in the future and you buy into their `ICO` or their coins.


    There are two main ways you can benefit from this if the projects are successful.
    You can buy into the projects while their tokens or coins are cheap and sell them
    off at a later date, or hold onto them if they’re offering security tokens that
    grant you dividends now and then. For the latter, you would be filling up your
    portfolio with more passive earners.


    As always, your portfolio should be nicely diversified. In this case, you want
    each category of your digital assets to be diverse either in terms of industry,
    solution, types, or geographical. Of course, you probably do not have enough money
    to diversify it across all fronts, but try your best to diversify.


    ## Putting Diversity into Practice


    What we’ve covered are some of the ways you can diversify your coins. But the
    question remains: how? How much money should I put into each coin? That really
    comes down to your risk tolerance and how much money you have at hand, so it is
    impossible to give you exact numbers. Instead, here are some basic diversification
    models so you have an idea of what would work best for you.


    ### The Newbie


    This is a good strategy if you are just starting out with cryptocurrency and do
    not know much about investment or crypto. If you are just new to the whole thing,
    you should start here. In this model, you just pick out a varied group of coins
    as we’ve mentioned above, and just allocate equal portions of your capital to
    each asset. Depending on which coin you chose, your risk level is medium to low.


    ### The Gambler


    Though this strategy is not for beginners, they usually do this because of how
    simple it is. There is not much in the way of diversification since you would
    be going all-in on one cryptocurrency and not consider any other. At most, you
    would only leave a fraction or 10% of your portfolio on other digital assets.
    It is high risk and high reward. It sometimes works out well, but it does not
    more often than not. Your target coins would be `Bitcoin` and `Ethereum`.


    ### The Conservative


    This model is also quite simple. You look at the top ten cryptocurrencies and
    allocate equal capital for each of them. You do not have to invest in all ten,
    of course. That depends on how much money you have. Five or three would be enough
    as the starting point. For that, you can invest in `Bitcoin`, `Ethereum`, and
    `Litecoin` or `Ripple`.


    ### The Whale


    The term “whale” refers to people who have a lot of money to spare. This term
    usually comes up in the gaming community, especially games with microtransactions,
    which would allow you to purchase certain things using real money. These people
    usually spend a lot of money on microtransactions either because they are addicted
    or because they have a lot of money to spare.


    In this case, the term simply means that you have quite a bit of cash to spare
    and you want to put it to good use. With this model, you distribute large portions
    of your capital between a few cryptocurrencies and then acquire small volumes
    of others. Again, you want to invest in `Bitcoin`, `Ethereum`, and `Litecoin`
    or `Ripple`. How much you should invest is up to you. But if you really want to
    have a number, you can just give each of the three major cryptocurrencies 25%
    of your capital, and leave the other 25% for other smaller cryptocurrencies.


    ### The Protectionist


    This strategy is employed primarily to combat inflation. Unless you live in Zimbabwe,
    or Venezuela where hyperinflation is rife, chances are that you do not really
    know or understand the effects of hyperinflation. To be honest, no one really
    wants to find out the hard way either.


    People from countries that suffer from this economic phenomenon usually use digital
    assets to hedge against inflation. They put a lot of their savings into stablecoins
    and only invest a little bit in volatile assets such as `Bitcoin`.


    ## ALTERNATIVES TO CRYPTOCURRENCY


    The blockchain technology that powers cryptocurrencies have a wide range of uses.
    What `Ethereum` has brought to light is the fact that developers can create decentralized
    applications that work on the blockchain network for data storage and analysis
    without security risks, as well as smart contracts that enforce themselves once
    certain conditions are met.


    Among those applications are `ICOs` or initial coin offerings. Though some would
    say that `ICOs` are just glorified GoFundMe campaigns or Patreon because of their
    similarities, `ICOs` are another great way to invest your cryptocurrency. In simple
    terms, investing in `ICOs` is very much like investing in a startup and earning
    yourself some share in the company. If you pick the right projects or startups
    to back, the payout will be astounding.


    You spend some money to buy a cryptocurrency and hope that their prices go up
    in the future so you can sell it for more money. And you can stop there, but you
    can go down another level by spending cryptocurrency to make cryptocurrencies.


    In this section, we will be expanding upon the idea of “passive earner” coins,
    especially security tokens, and cover how you can put your money in the right
    projects. But before we do that, let us talk about the basics, again.


    ### What is an ICO?


    We have mentioned `ICOs` in the past. It works like this. Suppose that you are
    a Silicon Valley entrepreneur with big ideas. That does not narrow it down that
    much, but let’s go with it.


    You’ve got big ideas, but unlike Elizabeth Holmes’ Theranos or Adam Neumann’s
    WeWork, both of which are disastrous startups that are little more than a complete
    scam, your ideas actually solve problems and they are actually feasible so long
    as you get enough funding. But how do you get funding?


    You can go to the local bank and take out a loan or try to get venture capitalist
    investors on your side. But this means you have to give up some ownership of your
    own company. This is where `ICO` comes in.


    `ICO` stands for Initial Coin Offering. It works like this. First, you create
    a document that explains in detail how your solution would work. This is called
    a white paper. Then, you design a sleek and professional-looking website, as is
    the current trend, and explain why your project is worth backing.

