- fmt: '

    Then, you just ask people to send you money in cryptocurrency. Most of the time,
    that would be `Ethereum` if you design your projects on their blockchain. This
    is also where you need to create your own tokens, which you would send to your
    backers. You get the funding you need and your backers hope you are successful.
    If you bag the investment and run, that would be a scam.


    Keep in mind that in `ICOs`, you would be distributing utility tokens or cryptocurrency,
    not security tokens. Therefore, the owner of the company does not have to give
    up on the ownership stake of the company.


    For an investor, you won’t be getting any source of passive income. But the utility
    tokens you have might come in handy. For instance, if the company creates a new
    crypto exchange platform that offers token holders discounts on their trades,
    this would also benefit you since you can start trading on the exchange with reduced
    transaction fees.


    Different companies or projects grant token holders different privileges, some
    of which are very useful. Even if you are not interested in getting those benefits,
    you can also sell the tokens off at a later date when the project is successful
    to make more money.


    But if you want to get your hands on security tokens, you would need to look for
    `STO` or `Security Token Offerings`.


    ### What is an STO?


    The process is largely the same compared to `ICO`, except there are a lot more
    regulations to deal with since owners of the tokens are entitled to dividends
    of the company’s profit. A security token represents the holders’ ownership or
    shares in the company. In other words, `STOs` are very much like `IPO`, or initial
    public offering, where the company offers its shares to the public.


    ### STO vs. ICO


    As mentioned before, the process is largely the same, but the token characteristics
    are different.


    For one, `STOs` are asset-backed and have to comply with regulations. So, it is
    quite difficult to launch an `STO` because the idea is to offer an investment
    contract under securities law. So, the people behind `STO` projects have to make
    sure they comply with all relevant regulations. Plus, they normally would have
    to raise funds only through accredited investors who meet certain requirements
    themselves.


    `ICOs` are not as difficult to get started. This is down to the simple fact that
    their utility tokens are for usage, not investment. Therefore, they can weasel
    their way around the strict regulations. So, the barrier to entry for startups
    is much lower if they just launch `ICOs`. They just need to focus on working on
    their project and developing their utility tokens.


    ### STO vs. IPO


    Again, the process is mostly the same. The difference is that `STOs` issue tokens
    on a blockchain network while `IPOs` provide certificates on the traditional markets.
    Both are also well-regulated since they fall under the securities law.


    That said, `IPOs` are only used when private companies want to go public. They
    can raise funds by giving away shares to accredited investors through their initial
    public offering process.


    On the other hand, `STO` developers would provide security tokens. These tokens
    represent an underlying asset that is issued to accredited investors via the blockchain
    network. Though the token can represent the company’s share, it can also represent
    any other asset that is expected to turn a profit, such as property ownership,
    investment funds, fine art, etc.


    ### STO Regulations


    As you probably expect, this depends on the jurisdiction. In the United States,
    the Securities and Exchange Commission (`SEC`) is pretty vocal on how a security
    token is defined. They are also debating on whether certain utility tokens should
    be reclassified as security tokens that need to be regulated.


    Although the line between security tokens and utility tokens is pretty clear,
    some are operating in the grey zone. Certain businesses hand out utility tokens
    that are very similar to security tokens. That way, they can attract more people
    by the promise of periodic dividends payouts without having to deal with all the
    regulations relevant to security tokens.


    According to the `SEC`, `ICOs` would be reclassified as a security if they fit
    the definition of an investment contract. The definition was established by the
    Supreme Court from a case between the `SEC` and `The Howey Company`, which is
    now known as the `Howey Test`.


    Without using all the technical terms commonly found in legal stuff, we can say
    that an investment contract is an investment of money in a company with an expectation
    of profit that would be deducted from the company’s revenue. Although, the “investment
    of money” part here does not only apply to money alone. It does not have to be
    cash.


    The United Kingdom also created consultation papers to help people decide whether
    their crypto asset is an exchange token, a utility token, or a security token.
    Switzerland also joined in with their `ICO` guidelines.


    As expected, governments across the globe do not have the same opinion on `STOs`.
    In fact, certain countries outright ban `STOs`. Some have regulations in place,
    but they are a patchwork of vague laws.


    ### Advantages of STOs


    Let’s first compare `STOs` to `ICOs`. `STOs` have lower risks because of the security
    laws they have to comply with before they can start issuing security tokens. As
    a potential owner of security tokens, you would be pleased to know that there
    will be transparency and accountability.


    Plus, a security token is tied to real-world assets. Meaning, it is more accessible
    even if it is not priced fairly compared to its underlying asset. Pure tokens
    are more difficult to evaluate because they are not tied to any physical asset.
    Therefore, it is difficult to judge whether or not your utility tokens are priced
    fairly.


    What about `IPOs`, then? `STO` is a cheaper alternative because there is no need
    for a middleman like banks or brokerages. Companies can make use of `smart contracts`
    to limit reliance on expensive lawyers and the storage of data on the blockchain
    network limits the need for paperwork. So, `STOs` are just cheaper and faster.


    ### Challenges of STOs


    As with anything in life, there are a couple of challenges or drawbacks `STO`
    platforms face. That is primarily the increased regulations that put a bigger
    administrative burden on them.


    The people behind `STO` projects now have to have proper processes for custodianship,
    a way to track ownership, a way to approve the exchange, `KYC forms`, and many
    other things. They have to go through all of these to ensure that they comply
    with relevant security laws. Though it is cheaper than `IPOs`, the work needed
    to launch an `STO` is costlier than `ICOs`, which raises the barrier of entry.
    For an investor, that means it is harder to find `STO` than `ICO`, let alone `STOs`
    that are worth investing in.


    In addition, the lack of a middleman like banks, brokerages, and lawyers means
    that the responsibility of doing those jobs fall to the company, which also increases
    the administrative burden for the company.


    Finally, there is the question of legality to consider. Depending on where you
    live, you may not even get to invest in `STO` since the jurisdiction limits who
    can invest in `STOs`. So, this also limits the investor pool.


    ### Which ICO/STO should I Invest in?


    The best you can do is to do your own research and determine for yourself whether
    the project would be successful. You would need to read the `white paper`, know
    the team behind the project, and make sure that they have at least some experience
    in cryptocurrency.


    You are safer investing in `STOs` if you can because of all the regulations they
    have to comply with before they can even launch. Their security tokens would be
    quite valuable if the company does well because you would then be entitled to
    a share of their spoils, and this is a great source of passive income.

