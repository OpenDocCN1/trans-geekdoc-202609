    **Team**


    Any successful project has to have a very solid team behind it. At the very least,
    know who is on the senior management team, where they are from, what their experience
    is in crypto. The more information you have about the team, the better. A good
    project would have a skilled and experienced team on the wheel.


    **Roadmap**


    A roadmap is basically a guideline on what direction the project is going to go.
    It details future contents, features, or things that will be done as the project
    goes forward. This is to be expected since any project needs to have a plan. The
    development team would lay out this roadmap and you can take a look and see if
    they have a solid plan for their project. One thing you want to keep an eye out
    for is how ambitious their plan is. A bit of ambition is good, but too much means
    that the project would fail to meet its lofty goals.


    **Development and Releases**


    On the flip side, development and releases highlight how much progress the project
    has made and how it has performed since its inception in terms of development.
    Normally, the development team or the community manager would come out to give
    everyone an update and what to expect next. Communication between the investors
    and the development team is important, so regular updates would be a good sign
    of an effective project.


    **Partnerships**


    Partnerships are also a good way to determine the value of a project. However,
    it all comes down to the finer details, so make sure to look into those before
    you pass judgment.


    **Demand, Token economics, and Utility**


    The fundamental rule of economy dictates that supply and demand drive price and
    value. For an investor, you would need to consider demand first, then supply.
    The higher the demand, the higher the price. And demand is influenced by token
    economics or tokenomics as well as utility.


    For token economics, you need to consider the economy surrounding the token. The
    token itself should be useful, as in having a wide range of applications so that
    there would be demand for it. When it comes to utility, you want to know if the
    coin has enough utility to create future demand. Roadmap also influences the project’s
    utility, so factor that in your decision.


    **Status**


    This refers to the status of the project, which is mostly related to the team
    behind it and the reputation the team has from previous projects if they have
    any. Unfortunately, though crypto projects may start from scratch, that does not
    translate into a level playing field.


    If you launch a new cryptocurrency tomorrow and Amazon decided to do the same
    the very next day, people would flock to Amazon’s amazing tokens. This is one
    more reason to do a thorough background check on the team behind a project and
    this track record in the crypto world.


    If some members of the team came from some popular cryptocurrencies and they have
    created many successful projects in the past, chances are that you are looking
    at a valuable project.


    **White Paper**


    We have mentioned this quite a few times in the past. Any project would have a
    white paper attached to it. It goes into the details of the projects. They are
    technical in nature, so it won’t be a very readable paper unless you have some
    experience in the crypto world. However, once you get over this problem, you would
    find that it is a very important piece of document.


    In short, the paper outlines everything you need to know about the project. This
    can give you a much clearer picture of the whole situation and help you make an
    investment decision. If there is only one thing you have to look at when conducting
    fundamental analysis, it would be white papers. Always read it before deciding
    whether to invest.


    **Community and Reviews**


    This one is simple. Doing your own analysis would subject your findings to a certain
    bias that you are not entirely aware of. This is okay. You can get other people’s
    opinions on the matter by diving into the community and reading reviews on the
    project. This should give you a more objective view of the whole thing before
    you decide to put your money in.


    **Real-World Use Case**


    Just because you can does not mean you should. Many people get caught up with
    all the hype at the moment and forget to stop and ask the important question:
    why? Why does the project have to do things this way? Why does it have to have
    its own blockchain?


    For instance, we have watches that can track how many steps we have taken today
    and it is connected to our phone via Bluetooth. That is fine and dandy. But what
    do you think of shoes that need to be connected to the internet, and you need
    to download an app that also needs to be connected to the internet in order to
    monitor your steps. It is a pretty roundabout way to doing things and is completely
    necessary.


    So, always ask why. If there is no good or practical reason to do something a
    certain way, chances are that it is a solution in search of a problem. In other
    words, it’s probably a bad investment.


    **Price History and Age**


    Just like empires, cryptocurrencies rise and fall. There are some decisions you
    have to make here, and unfortunately, there is no way to tell if the answer is
    right or wrong unless backed up by other factors we have covered here.


    You see, an established project would be easier to evaluate because you can look
    at its values since its beginning and compare that to others. A project will have
    longevity if it manages to maintain a consistent value over time. This would provide
    you with a stable investment, but the payout might not be that great.


    On the other hand, you can invest in upcoming projects that are not well-known.
    It is a riskier investment, but if it is successful, you get to be an early joiner
    and get larger returns on investment.


