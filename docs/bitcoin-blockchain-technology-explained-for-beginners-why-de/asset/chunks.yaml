  trans: '

    现在，你可能在想，既然它们如此优秀，为什么它们不像 GPU 矿机那样流行呢？那是因为它们实在太强大了。


    当 `ASIC` 公司推出他们的矿机时，加密货币社区中引起了骚动。他们想要禁止这些东西，因为它们太强大了，以至于其他矿工完全没有竞争能力。这意味着 `ASIC`
    所有者可以囤积所有的币，因为其他矿工根本跟不上如此之高的哈希率。


    这样想：如果大部分收益都流向了少数有足够资金建立 `ASIC` 农场的矿工，你认为会发生什么样的混乱？他们不仅可以独占所有代币，还可能潜在性地控制加密货币区块链网络，因为他们可以验证网络上
    50% 以上的交易，因此从技术上讲可以控制整个网络。


    尽管如此，如今对 `ASICs` 的普遍情绪已经不再那么刻薄了，而且它们正逐渐变得更加负担负担。事实上，越来越多的人正在转向使用 `ASICs`。市场上有很多针对特定任务的
    `ASIC` 设备。这既是它的优点，也是它的缺点。


    你要知道，`ASIC` 设备是为了挖掘特定币而制造的。根据其设计，它们可以挖掘多种不同的币，也可以只挖掘一种币。这完全取决于它使用的算法。所以，如果你的 `ASIC`
    矿机只能挖掘一种加密货币，而随后挖掘算法发生了更新，那么你最终将得到一个昂贵且没有转手价值的纸镇。


    `ASIC` 矿机也消耗大量的电力，即使是效率最高的设备，运行起来也会相当热且噪音很大。前期投入、小众应用以及缺乏转手价值，使其在作为矿机建议时很难被推荐。


    对于 GPU 矿机，你至少在挖完矿后可以将显卡用于你的电脑，或者将其转卖给那些想要升级电脑的玩家。对于 `ASIC` 矿机，你不能这么说。


    然而，另一个危险正迫在眉睫。有些人开始挖掘除 `Bitcoin` 以外的加密货币。具体来说，他们正涌向 `Ethereum`，因为其更新了共识模型——`Proof
    of Stake` (`PoS`) 系统，该系统不需要大量的算力即可挖掘。这意味着消耗的电力更少，在昂贵的矿机上花费的钱也更少。


    但也许这将为拥有 `ASIC` 矿机的 `Bitcoin` 矿工创造机会，因为竞争者变少了，当人们开始迁移时，他们可以开始获利。只有时间会给出答案。


    ## 应该挖掘什么加密货币？


    如前所述，你希望尽可能从你的矿机中榨取更多价值。这意味着挖掘正确的币，以便你可以将其卖掉并大赚。但应该挖掘哪些币呢？


    嗯，这很简单。去挖掘价值最高的币。这意味着 `Bitcoin`、`Dash`、`Ethereum`、`Litecoin` 等。只需去 `Coinbase`
    或 `Binance` 查看列表上价值最高的币即可。这应该让你对从哪里开始挖掘有一个良好的思路。


    另一个值得注意的有趣点是你使用什么种矿机来挖掘加密货币。例如，如果你有一台矿机，或者与云矿矿服务提供商达成了交易，你完全可以开始挖掘 `Bitcoin`，因为它们使用
    `PoW` 共识模型。尽管如此，挖掘 `Bitcoin` 可能会很，因为它太流行了，每个人都想分一杯 `Bitcoin` 蛋糕。全球的矿工都会进入网络中少数几个矿池，并试图抢夺少量的币。你可能需要等待几个小时，才能看到第一笔
    `Bitcoin` 流入。


    然而，如果你对拥有和维护矿机不感兴趣，或者负担不起一台，你可以寻找使用 `PoS` 共识模型的币。那么 `Ethereum` 将是完美选择，但你现在想先保留这个想法，因为它们仍在进行改造。`Ethereum
    2.0` 将 `PoS` 共识模型整合到它们的网络中，并定于 2021 年或 2022 年全面推出，所以请保持关注，一旦一切就绪就加入其中。这可能是你的最佳选择。


    现在，你可能在想，如果选择那些不流行的币并开始挖掘它们会怎样，因为竞争者会更少。你完全可以这样做，也许可以在不消耗太多能量的情况下产相当数量的币。那么问题在于币价。


    `Bitcoin` 单项就占据了总市值的 50% 以上，每币价值超过 55,000 美元。`Ethereum` 位第二，每币仅超过 2,000 美元。你可以清楚地看到这两种币之间的价格差异，而且列表越靠后，价格就越低。


    也许你可以忍受这种低价。只要你产生大量的币，无论如何你都能获得所有利润。但那里有功耗、时间和安全问题需要考虑，取决于取决于加密货币使用的是 `PoW` 还是
    `PoS` 共识模型。


    在使用 `PoW` 共识模型的加密货币中，你需要考虑功耗，因为你的设备需要执行大量的计算。用这种共识模型挖掘小型加密货币的问题是，这里的交易并不多，所以你可能每秒并不会产生大量的币。


    你产生的币可能仍然比 `Bitcoin` 多，但它们的累积价值会很小，你可能在卖掉它们时遇到问题。因为再次强调，你挖掘的币并不流行，所以不会有很多人想交易它们。


    再次，你可能对这无所谓。只要你最终能卖掉所有的币就可以了。但那时有电费问题需要考虑。不幸的是，尽管币很便宜且你可以挖掘很多，但你的矿机仍然会全负运转并消耗大量能量。你赚的币可能连电费都不够，更不用说带来利润。由于这个原因，你希望通过挖掘更流行的加密货币来充分利用你的功耗。


    但是使用 `PoS` 共识模型的加密货币又如何？对于那种，功耗将不是问题。时间可能是问题，因为每个人都是随机的，但你可以通过获得更多验证者来增加被选中的概率。由于周围的人不多且加密货币很便宜，你不需要花费很多就能获得良好的被选中机会。但那时有安全问题。


    我们需要理解，支撑流行加密货币的区块链网络几乎是不可破解的，因为网络上的用户数量巨大。如前所述，每个用户和矿工都会获得一个自动更新的账本。这些账本相互检查并验证对方的数据，以确保不会伪造。数据的篡改只有在有人控制了大部分节点时才可能。


    在流行的 `PoS` 加密货币中，这是可能的，因为网络上有大量的用户和验证者。这种接管区块链需要比你想象的多得资金。然而，对于不流行的加密货币，这是非常有可能的。


    你可以购买大量廉价币并使用它们进行质押，让你拥有大量的验证者。由于这种币并不流行，网络上不会有很多用户，所以你最终会达到拥有多数权的关键点。然后，你可以随心所欲地篡改数据并双花。对于那些想要看到世界毁灭的人来说，这没问题，但对于矿工来说并不有趣。

    '
- fmt: '

    To be clear, this threat still applies to small PoW cryptocurrencies, except it
    is even more expensive to carry out that attack. You would need to have a lot
    of money and have the mining rigs powerful enough for the attack. It is expensive
    and really not worth it for the attacker, most of the time. In PoS cryptocurrencies,
    you just need to have money.


    For all the reasons above, it is not recommended that you mine smaller cryptocurrencies.
    It’s just not worth all the trouble.


    ## Crypto Mining Legality


    One of the most common questions people ask is whether mining cryptocurrency is
    legal. Generally, yes. But that really depends on your government and your mining
    method. Unfortunately, governments across the globe view cryptocurrency differently,
    so the answer won’t be a solid “yes” across the board.


    Certain governments ban the possession of cryptocurrency, let alone mining or
    using it. They are usually quite vocal about it, so a quick search on the internet
    should give you a pretty solid idea of what your government’s stance is on the
    coins.


    When it comes to the mining method, it means you should not use illegal means
    to mine coins. You see, some hackers would use `Javascript` on browsers or any
    other means to install malware on your computer. They are not after your data,
    but they want your computer’s processing power. This is called `cryptojacking`,
    which is highly illegal.


    Then, there are taxes to consider. After all the fees are cut by your broker or
    exchange, and the bank transfer, you may have to deal with another tax from your
    government. It is money, after all, so you can guess that your government would
    be interested in having a share of your spoils.


    ## Crypto Mining Pool


    The reward for verifying the block is granted to the miner who found the right
    hash first in the PoW system. However, given how large the `Bitcoin` blockchain
    network is, your chance of getting there first is highly unlikely.


    Your probability of finding the valid hash is equal to the portion your mining
    rig contributes to the overall mining power on the network. So, if your machine
    only contributes `0.001%` to the total mining power, that is your chance of finding
    the hash first. That is not a good probability.


    So, miners with weak rigs stand a very small chance of actually getting any coin.
    Therefore, they band band together to create a mining pool. That means, miners
    would pool their computational power over a network to mine the coins. In this
    case, the aggregate computational power might go up to `15%` share if you band
    together with a few thousand others, and suddenly your odds of making money are
    pretty good.


    That said, the pool mines for every member. So, the reward is divided proportionally
    according to the amount of computational power you contribute to the pool. If
    there are a few thousand people in the pool, everyone gets their fair share. For
    you, that means you won’t get a lot, but it is better than your `0.001%` probability.
    So, you should definitely join a crypto mining pool.


    ## Crypto Trading


    Cryptocurrency trading wasn’t the hottest thing when `Bitcoin` just launched.
    That is because there wasn’t any other cryptocurrency in the market yet. Right
    now, that is a different story. There are over a thousand cryptocurrencies in
    the market, so the possibilities are endless here.


    Trading cryptocurrency is simple. You exchange one cryptocurrency for another
    and hope that the coins you have increase in value. You can do this at your crypto
    exchange and they will charge you a small fee for doing this. Crypto trading is
    probably the next hottest thing right now as billions of dollar’s worth of coins
    are being traded every day.


    Savvy traders, with a little bit of luck, can make bank just by trading cryptocurrency.
    There are plenty of people who do this full-time from the comfort of their own
    homes. But to do so would require a lot of skill and knowledge of the market.


    For this, traders use a number of tools to monitor the market and price movement.
    This is so that they can choose to grab the right coin at the right time. Among
    their repertoire of tools, they have software to monitor previous price trends
    among others.


    This might sound intimidating to you already, but worry not. Everyone has to start
    somewhere, after all. So long as you trade with the money you are willing and
    can afford to lose, there is no danger in giving this a shot.


    There are two ways to trade cryptocurrency. You can put together a short-term
    strategy or a long-term strategy.


    ### Short-Term Trading


    As the name suggests, short-term trading involves the purchase of cryptocurrency
    that you plan on holding onto for a short time before selling it off again. How
    long? That depends on you.


    Short-term trading has a number of advantages. For one, it provides a good opportunity.
    In `forex`, or `foreign exchange`, the prices hardly move by more than `1%` every
    day. Another drawback is that you need to make large investments if you want to
    see a chunky return on investment. This is something that many people aren’t very
    comfortable with, especially beginners.


    The key here would be to carefully analyze the market, have a solid entry and
    exit strategy and maybe a couple of contingency plans, and commit through it without
    panicking. Keep in mind that you need to have a cool head if you are to pull this
    off. Remain calm as you weather through the choppy sea of the crypto market.


    One thing you will learn right off the bat is that you do not always win. There
    are factors outside your control that no one can anticipate. It gets very stressful
    very quickly when you see how prices move against you. So, you sometimes just
    have to bite the bullet, take the `L`, and pull out before losses mount. Even
    the best trader on the market do not make a profit `100%` of the time, so chances
    are that you won’t either.


    Also, understand that short-term crypto traders are only after the small price
    movement. So, you have to see the subtle details on the charts to make the most
    out of it. If you are a complete beginner, this can be tricky.


    ### Long-Term Trading


    Long-term trading involves a lot of waiting time, which might also involve a lot
    of nail-biting moments. The term `HODL` is pretty common in this context and only
    the beginners do not know what it means.

