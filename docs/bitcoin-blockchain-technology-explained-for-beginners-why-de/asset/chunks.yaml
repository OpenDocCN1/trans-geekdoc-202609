    需要明确的是，这种威胁仍然适用于小型 PoW（工作量证明）加密货币，只是执行此类攻击的成本更高。你需要大量的资金，以及强大到足以攻击的矿机。对于攻击者来说，这非常昂贵，而且通常不划算。而在
    PoS（权益证明）加密货币中，你只需要有钱。


    基于上述所有原因，不建议你挖掘较小的加密货币。这不值得冒险。


    ## 加密货币挖掘的合法性


    人们最常见的问题之一是挖掘加密货币是否合法。通常情况下是肯定的。但这取决于你的政府以及挖掘方法。遗憾的是，全球各国对加密货币的观点不同，因此答案并不是统一的“是”。


    某些政府禁止持有加密货币，更不用挖掘或使用了。他们通常对此非常明确，所以上网快速搜索就能了解你政府对这些币的立场。


    至于挖掘方法，这意味着你不应该使用非法手段挖币。有些黑客会在浏览器中使用 `Javascript` 或或其他手段在你的电脑上安装恶意软件。他们并不是想要你的数据，而是想要你电脑的计算能力。这被称为
    `cryptojacking`（加密货币劫持），是高度违法的。


    此外，还需要考虑税务。在经纪商或交易所扣除所有费用以及银行转账费用后，你可能还需要处理政府的另一笔税。毕竟这是钱，你可以猜到你的政府会对分得你的战品感兴趣。


    ## 加密货币矿池


    在 PoW 系统中，验证区块的奖励授予第一个找到正确哈希值的矿工。然而，考虑到 `Bitcoin` 区块链网络如此庞大，你抢第一的概率极低。


    你找到有效哈希值的概率等同于你的矿机对网络总算力贡献的比例。因此，如果你的机器只对总算力贡献了 `0.001%`，那么这就是你第一个找到哈希值的概率。这不是一个好的概率。


    因此，矿机性能较弱的矿工实际上获得任何币的机会非常微小。因此，他们聚集在一起创建一个矿池。这意味着矿工会在网络上汇集他们的计算力来挖币。在这种情况下，如果你与几千其他人聚集在一起，总计算力可能会达到
    `15%` 的份额，突然你赚钱的机会就变得相当不错了。


    尽管如此，矿池为每位成员进行挖掘。因此，奖励将根据你为矿池贡献的计算力按比例分配。如果矿池有几千人，每个人都能获得公平的份额。对你来说，这意味着你不会得到很多，但比你
    `0.001%` 的概率要好。所以，你应该加入加密矿池。


    ## 加密货币交易


    在 `Bitcoin` 刚发布时，加密货币交易并不是最热门的话题。因为当时市场上还没有其他加密货币。而现在，情况完全不同了。市场上上有超过千多种加密货币，这里的可能性是无限的。


    交易加密货币非常简单。你将一种加密货币兑换另一种，并希望你持有的币升值。你可以在加密货币交易所进行交易，他们会收取你小笔费用。加密货币交易可能是现在最热门的话题，因为每天都有价值数十亿美元的币在交易。


    精明的交易者运气好的话，仅仅通过交易加密货币就能大赚一场。很多人在舒适的家里全职做这项工作。但这样做需要大量的技能和对市场的了解。


    为了这一点，交易者使用多种工具来监控市场和价格波动。这样他们就能在正确的时间抓住正确的币。在他们的工具箱中，他们有监控之前的价格趋势的软件等。


    这听起来可能已经让你感到压力很大，但不必担心。毕竟每个人都得从哪里开始。只要你用你愿意且负担得起损失的钱进行交易，尝试一下是没有危险的。


    交易加密货币有两种方式。你可以制定短期策略或长期策略。


    ### 短期交易


    顾如其名，短期交易涉及购买加密货币，并计划在持有短一段时间后将其再次卖出。持有多久？这取决于你。


    短期交易有很多优点。首先，它提供了一个很好的机会。在 `forex`（或外汇）中，价格每天的波动幅度几乎不会超过 `1%`。另外一个缺点是，如果你想看到丰厚的投资回报，就需要投入巨额资金。这是许多人并不很舒服的，尤其是初学者。


    这里的关键在于仔细分析市场，拥有稳健的入场和退出策略，可能还要准备几个应急预案，并坚持执行而不恐慌。请记住，如果你想完成这项任务，需要保持清醒。在加密货币市场的波动中航行时，请保持冷静。


    你一开始就能学到的一点是，你并不总是赢。存在一些你无法预测的外部因素。当你看到价格不利于你波动时，压力会很快变得非常大。所以，有时你不得不硬着头皮接受 `L`（亏损），并在损失扩大之前退出。即使是市场上最好的交易者也不是
    `100%` 的时间获利，所以你可能也不会。


    此外，要理解短期加密交易者追求的是细微的价格波动。


    ### 长期交易


    长期交易涉及大量的等待，这可能还会涉及许多紧张时刻。`HODL` 这个术语在这种语境下非常常见，只有初学者不知道它的意思。


