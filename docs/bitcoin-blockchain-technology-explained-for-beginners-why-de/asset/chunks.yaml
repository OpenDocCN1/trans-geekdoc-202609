- fmt: '

    Another interesting application for blockchain technology is in the video-streaming
    industry. The issue with the current video-streaming methodology is the file size.
    High-quality videos take up a lot of space and you would need servers to store
    everything. This has continued to increase costs that have trickled down to content
    creators.


    However, blockchain technology seeks to cut down on those costs using smart contracts,
    which we will get to in a minute. Blockchain technology works here by allowing
    you to store video content on decentralized servers. The content is heavily encrypted
    and secured.


    What are these decentralized servers? Those are miners’ devices. Miners can load
    the software onto their devices and basically rent out their excess computer space
    to store the video files and stream the content with their excess bandwidth. Miners
    would then be rewarded in the form of tokens or cryptocurrency.


    Theta is doing just that and their project has seen steady growth. Over time,
    perhaps we will see a new crypto mining method in the future. So far, we have
    `CPU`, `GPU`, `cloud`, `ASIC` mining, all of which we will discuss in Chapter
    3.


    ## Smart Contracts


    Smart contracts are essentially programs slapped onto a contract. It is created
    to take in certain data and execute certain clauses of the contract should certain
    conditions be met. At its core, smart contracts are the `if-then` Excel function.
    Nothing more, nothing less.


    Again, this application is very simple in nature. But its utility is very versatile.
    You can use it to trade product movement in a supply chain, to confirm identity
    digitally, for voting, healthcare, food safety, intellectual property, the list
    goes on and on.


    The reason why smart contracts are so desirable is that it operates on the blockchain
    network. That means, tampering with the data is nigh impossible unless you break
    the whole thing. It takes away a third party who has to oversee the whole thing.
    It just automates the entire process for you. With a bit of tinkering, you just
    need to feed it some input and it will spit out the right output. It is that simple.


    ## HOW CRYPTOCURRENCIES WORK


    In this section, we will get into the details of the workings behind cryptocurrencies.


    We will start with the ledger. As the name suggests, the ledger records all transactions
    that happen within the blockchain network and organizes them all into chronological
    order. The entries are completely public, meaning that anyone can view them. Anonymity
    here comes in the form of username or pseudonyms. So, while you can see which
    user sent how many coins to whom, you do not know the real person behind those
    usernames. This gives you the perfect balance between anonymity and transparency.


    The entries on the ledger cannot be changed, either. The only way to do that would
    be through a `50% + 1` confirmation from other ledgers in the system. Having a
    majority of ledgers that agree would automatically update all ledgers to have
    the same entries. This is difficult to pull off since each user has their own
    independent ledger that uses a consensus algorithm. While all ledgers agree on
    updating their entries after a transaction has been verified by a miner, fabricating
    a transaction is nigh impossible.


    We also need to talk about transaction verification. Suppose that you want to
    dabble in cryptocurrency. You buy some `Bitcoins` through a crypto exchange. Then,
    you decide to spend it. The entire process is completed within minutes, but a
    lot happened behind the scenes.


    When you decided to spend your coins, the transaction requires verification. In
    other words, the transaction is not official yet and it is up to the miners to
    verify it. The miners’ computers or devices have to solve an algorithm problem
    to complete the verification. They are looking for the key to confirm the transaction.
    Once that is completed, the transaction is recorded in the ledger and becomes
    part of the blockchain. The miners would be awarded a modest sum of `Bitcoin`
    for their work.


    ## WHERE CAN YOU USE CRYPTOCURRENCY?


    The biggest question surrounding cryptocurrency right now is whether it will advance
    beyond being a vehicle for speculation. The goal for `Bitcoin` is to become a
    global currency that is accepted worldwide. It is a lofty goal, but given its
    current value, it has a good chance of becoming the currency that transcends borders
    and jurisdictions.


    Given its price volatility and the fact that governments across the globe are
    still on the fence about the matter, many companies are still waiting. Adopting
    cryptocurrencies into their payment method is easy enough. Plus, they have every
    incentive to do so. The transaction cost is lower. The processing speed is faster.
    Plus, it is impossible to forge transactions. The only thing stopping everyone
    from accepting cryptocurrencies is the law.


    That said, there are plenty of stores out there that accept cryptocurrencies as
    a payment method. It’s a high-risk high-reward move. If the government suddenly
    decides to outlaw cryptocurrencies, then all the coins they’ve made would go down
    the drain. However, if the government would officially accept cryptocurrencies,
    then these stores would be well ahead of their competition when it comes to adopting
    cryptocurrencies.


    Then there is the problem with its volatility. Again, the price swings wildly
    and so pricing your products or services based on the number of coins is just
    asking for trouble. Let’s say that a coin is worth `$5` and so your `$50` product
    would require 10 coins. Now, if the price goes down to `$4` per coin, then you
    would already lose `$10` from last day’s sale.


    That is unless you cash out on the coins the moment you get them. This is a viable
    solution since some crypto exchanges allow you to convert your coins into fiat
    currencies at a flat rate. That means, if you route your payment via the crypto
    exchange, they would convert the coins and give you the cash and you don’t have
    to worry about the fluctuating rate.


    But therein lies another problem. What if you route your coins through the exchange,
    but then the rate goes up? Then you would lose out on the extra profit you can
    make. If the coin price goes up to `$8` per coin, then you miss out on `$30` per
    because you sold all your coins yesterday.


    In fact, many business owners rely on the bullish trend of `Bitcoin`. A bullish
    trend simply means an upward trend. In other words, they hold onto the coins and
    hope that the price will go up so they can cash out when the price is much better.
    It’s riskier than converting the coins at a flat rate, but there is a lot of money
    to make if the price difference is only `$10`. If you hoard enough coins, the
    numbers will start to add up very quickly.


    For this reason, companies are slowly adopting cryptocurrencies into their payment
    methods. This also expands their reach to the cryptocurrency community. Elon Musk
    tweeted that `Tesla` would be accepting cryptocurrencies in the near future at
    the moment of writing and many tech giants are jumping on the cryptocurrency train.


    Among them is `Microsoft`. In fact, `Microsoft` started accepting `Bitcoin` for
    its Xbox store in 2014 but stopped for a while due to price volatility. Now, you
    can buy Xbox store credits using `Bitcoin` once again. Bill Gates said that `Bitcoin`
    is just better than fiat currencies on several occasions.


    `Overstock` is another early adopter. They accept `Altcoins` as well as `Bitcoin`
    and it is clear that they support the cryptocurrencies since they are holding
    onto the coins. They do not just cash in on the coins at their earliest convenience.
    Instead, they are holding onto this precious digital asset.


    `Home Depot`, one of the biggest hardware store chains in the U.S., also accepts
    `Bitcoin`. Since they are the biggest hardware provider, you can buy enough material
    to build an entire house using nothing but `Bitcoin`. `Geminis` partnered up with
    `Flexa` to create the checkout systems for `Home Depot` so that the payments go
    as smoothly as possible.

