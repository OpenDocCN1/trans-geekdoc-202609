    all assets are worthless if no one is buying or selling them. If there is a lot
    of interest around a project, then there should be a lot of trading going on,
    and this is an indication that the cryptocurrency or token is in high demand.


    **Market Cap**


    You would need to look at the market capitalization or market cap. It is the total
    market value of the project or company or underlying cryptocurrency. In this case,
    the values would be derived from the supply of the cryptocurrency or token behind
    the project. Normally, a large market cap would have smaller growth potential
    whereas lower cap markets have more room for growth.


    **Regulation**


    We went over this before, but its importance can never be overstated. Make sure
    the project actually abides by the relevant laws and regulations. Otherwise, there
    could be adverse consequences on your investment in the future.


    With that said, there are so many nuances and other little details that would
    need an entire book for itself. But what we have discussed above are some of the
    most important factors to consider. Over time, you will pick up on some other
    things you want to keep an eye on when you are scoping out for future investment.


    **Technical Analysis**


    Technical analysis is a whole other can of worms because it involves drastically
    different strategies than what was outlined in fundamental analysis. Here, you
    would crunch numbers, data, and deal with a lot of colorful charts that would
    leave beginners frustrated within the first 30 seconds unless they know how to
    interpret them. Luckily, it is not super complex and it should become second nature
    once you get into the groove of things.


    Traders would look at price movement patterns and use various analytic tools to
    help them understand the strengths and weaknesses of each cryptocurrency. Previous
    price movements can help them predict future ones too. Just like fundamental analysis,
    technical analysis is also used in many markets such as stocks, futures, currencies,
    and forex. Luckily, the process is mostly the same so you can still apply this
    technique to other markets if you are interested in trading them.


    **The Basic Ideas for Technical Analysis**


    A few ideas from the Dow Theory give a basic understanding of technical analysis.
    First off, the theory says that pricing in the market reflects many things that
    can influence the price. In the crypto world, that “many things” include the regulations,
    traders’ expectations, demand in the past, present, and future, etc. Technical
    analysis would give traders an idea of the general sentiment around a market.


    Technical analysis also makes the basic assumption that history often repeats
    itself, at least in the crypto world. For this reason, technical analysis seeks
    to predict market psychology and cryptocurrency based on data from the past.


    Technical analysis also makes another assumption that price movement is not always
    random, even in the volatile crypto market. Price movements usually follow short
    or long-term trends. More often than not, when a cryptocurrency follows a certain
    trend, it will follow an opposite one soon after. Traders who use technical analysis
    can use this to identify price movement patterns and make profits.


    Overall, technical analysis does not really look at the underlying value of the
    cryptocurrency. Instead, it only considers what is happening and why it happens.


    **Reading the Charts**


    So, with this in mind, let us start technical analysis by reading the charts.
    The most basic elements are candlesticks, trend lines, support and resistance
    levels, trading volumes, market caps, relative strength index, moving averages,
    and time frames.


    **Candlesticks**


    These are either red or green bars with a little line sticking out from above
    and below them, with varying lengths. These are called candlesticks although they
    sometimes look more like hammers.


    Every element of the candlestick, from the color to the length of the lines at
    the top and bottom as well as the length of the “body”, or the bars tells a lot
    of stories. First of all, the top and bottom of the candlestick’s rectangle indicate
    the opening and closing prices of the cryptocurrency at that instance.


    Green means that the crypto rises in value, so the closing price is at the top
    and the opening price is at the bottom. If it is red, then it indicates that the
    crypto price drops in value and the closing price is at the bottom and the opening
    price is at the top.


    The little lines poking out from the top and bottom are called wicks. They indicate
    the lowest and highest prices that the coin managed to reach within the same time
    period. The wick can give you an idea of market volatility.


    And this is the most basic level of technical analysis. You can use the candlesticks
    to guide you in making future predictions. For instance, if you can see that the
    wicks are long, you know that the market is volatile and the waves will be choppy
    going forward. You can take this time to set up your trades so that you can buy
    the dip and sell at the peak, given that you time everything properly. Other than
    that, it also tells you that the market will correct itself by tomorrow.


    If the wicks are short, then there could be a change in the market on the horizon.
    The potential change depends on the wick. If the top wick is short, this indicates
    that the coin reached a peak price and one that is possibly one of its highest
    in its history, hence a price ceiling or resistance level. If the top wick is
    very long, it tells us that the coin was much higher in price at a certain point
    in the day before traders cashed in for profit. This type of pattern occurring
    at the peak of an upward trend can indicate that the trend is coming to an end
    and a downward trend is imminent.


    If the bottom wick is short, it means that people continue to sell the coin. This
    would bump up the coin supply, further driving the price down. A long bottom wick
    suggests that the price used to dip in the past and that general sentiment is
    that the price could not go any lower, hence a price floor or a support level.
    You can usually spot this at the bottom of a downward trend right before an upward
    trend. Because by then, people believe that this is the best time to buy the coins
    and they would do just that. In doing so, supply would dip and the price would
    go up, further encouraging more people to buy the coin.


    **Trend Lines**


    Along with the candlesticks, you might also see a line that vaguely follows the
    candlestick patterns. This is the trend line. Trend lines simply point out the
    direction that the crypto price moves. But they also contain some other information
    only perceivable to a trained eye.


    This is especially true in the volatile crypto market. Traders need to understand
    the overarching trend that goes up or down with all the little highs and lows.
    To make matters worse, trends do not just move up or down. They can also move
    sideways, which indicates that the cryptocurrency has neither significantly moved
    up or down. But if it stays this way for long, then it could lead to some explosive
    breakouts that can see massive gains or losses.


    Most exchanges or trading platforms would come with a trend line built into their
    charts. These are done for you automatically, though some allow you to tweak the
    settings to make the readings more sensitive to changes. You can normally get
    away with the default settings, but for those who want to squeeze a bit more efficiency
    out of their trading, they have that option to change the trend line settings.
    How the platform draws the trend line is different based on the platform you use.


    **Support and Resistance Levels**'
