  trans: '

    然后就是交易费的问题。在比特币中，矿工在成功验证交易时获得少量的代币。这种货币并非凭空产生，它是被创造出来的。这也是进入流通的唯一方式。


    在以太坊上验证交易对用户是免费的，尽管你可能需要支付少量的费用来启动引擎。这些费用是完全可选的，即使你不支付，交易也会进行，这只需要一点时间。


    以太坊也是通过挖矿生成的。这里的区别在于以太坊需要 `GAS` 费用来验证交易，促进了以太坊的流通。


    ### 时间


    关于验证交易并将区块添加到区块链网络所需的平均时间，比特币大约需要九到十分钟，而以太坊快得多。通常，在以太坊网络上大约需要 15 秒。


    ### 哈希算法


    哈希算法是区块链网络保护数据并确保所有人匿名性的方式。比特币使用名为 `SHA256` 的哈希算法，而以太坊使用 `Ethash`。


    ### 数量


    相比比特币，以太坊的流通量更多。尽管以太坊很多，比特币达到了万亿美元的市值里程碑。以太坊拥有更多的是它的区块数量，在写作时超过 660,000 个，而比特币约为
    540,000 个。以太坊区块更多，因为验证交易花费的时间少得多。


    ## 购买和出售以太坊


    现在你对以太坊有了深入了解，让我们来聊如何购买以太坊。假设你已经有一个用于存储以太坊的钱包。我们在第四章介绍过加密钱包，如果你还没有，请查看。简而言之，加密钱包需要能够存储以太坊，并提供足够的安全功能来保护你的投资免受黑客攻击或访问丢失。此外，假设你不打算挖掘以太坊。我们在第三章也介绍过加密货币。


    那么，如何获取以太坊来开始你的投资之旅呢？


    ### 识别交易平台


    你需要做的第一件事是寻找最适合你需求的交易平台。有很多提供以太坊的热门平台，如 `Coinbase`、`Binance`、`Kraken`、`Bitstamp`、`Gemini`
    和 `Bitfinex`。建议先从这些开始，慢慢寻找真正拥有你所需一切的平台。


    此外，选择加密交易所的最大考虑因素之一是交易所本身的类型。这里有三种类型：一种提供法币交换的服务，一种提供加密货币兑加密货币的服务 (`C2C`)，还有一种两者兼顾。


    你会发现，有些加密交易所实际上作为外汇平台或提供其他交易服务。他们只是扩展了业务，将加密货币纳入其服务。


    根据你计划如何交易，你可能会发现 `C2C` 交易所更有力。


    ### 创建账户


    一旦你决定了想使用哪个交易所，就是创建账户的时候了。你只需要提供一些个人信息，如 `name`、`address`、社会安全号码等。这个过程不应该花费很长时间。


    ### 获取货币


    一旦验证过程全部完成，我们来聊聊钱的问题。假设你名下没有任何加密货币，你需要从购买它们开始。大多数交易所只接受主要的法币。


    ### 开始交易


    一旦一切完成，你终于可以交易加密货币了。


    ### 获得你的收益


    一旦你获得了一些利润，就可以提取货币。大多数加密交易所允许你将加密货币转换为法币，这样你就可以将现金转入银行账户。


    # 多元化


    当你进入投资领域时，听到的第一件事之一就是你应该让投资组合多元化。同样的理论在这里也适用。你不应该将所有的投资投入到一种加密货币中。一旦币价崩盘，你将一无所有。因此，请选择其他几种加密货币来丰富你的投资组合。

    '
- fmt: '

    As the name suggests, mining-based coins refer to the cryptocurrencies that are
    created by mining. Mining here has two main methods: `Proof of Work (PoW)` and
    `Proof of Stake (PoS)` systems that we have already discussed in Chapter 3. Some
    examples include `Ethereum`, `Zcash`, `Monero`, and `Litecoin`. Some cryptocurrencies,
    such as `Ripple`’s `XRP`, are premade or pre-mined. Meaning, they are not produced
    via mining but are created and distributed before their listing on the crypto
    market.


    ### Stablecoins


    Some people would tout Stablecoins as the best compromise that would secure the
    future of cryptocurrencies. Cryptocurrency trading has been plagued by volatility
    since its inception. Stablecoin aims to remedy this problem by tying its value
    to goods such as fiat currencies, precious metals, or other cryptocurrencies.
    That way, their value remains relatively stable, earning confidence from potential
    investors. Some examples of Stablecoins include `MakerDAO` and `USDC`.


    ### Security Tokens


    Security tokens are basically securities that are traded in the stock market,
    except these are traded in the crypto market. They provide similar benefits to
    traditional stocks and these tokens promise their owners equity in terms of ownership
    or a dividend based on profit.


    The idea that a company would be successful and that their security token would
    skyrocket in value makes them an appealing prospect for investors. These tokens
    are offered to investors through `ICOs` or initial coin offerings. That said,
    security tokens are subject to heavy scrutiny and they have to satisfy all legal
    requirements before the company can hand them out.


    ### Utility Tokens


    Utility tokens work a bit like security tokens, but they aren’t subject to all
    the legal scrutiny. These tokens are used to provide services to the owners. They
    can use utility tokens to redeem rewards or to purchase goods and services. Utility
    tokens do not give owners a share of the company that issued them, however.


    ### Are Altcoins Good Investment?


    It’s not just `Ethereum`. There are many other promising Altcoins out there. Should
    you invest in them?


    You see, the market is still in its infancy. There are almost 10,000 Altcoins
    on the market today and the number is still on the rise. This attracts hordes
    of retail investors. They simply speculate on the price movement and make short-term
    profits.


    The crypto market has yet to mature and there isn’t a good way to define investment
    criteria or metrics to evaluate cryptocurrencies. More often than not, Altcoins
    are purely speculative vehicles and only a fraction of the coins are actually
    worth trading. The rest are dead cryptocurrencies, coins that failed to gain traction
    or simply faded into obscurity.


    So, if you are looking for long-term gains, you are probably better off buying
    `Bitcoins` and hold onto them and sell them at a later date. But if you are interested
    in funding startups, you can use `Ether` or other supported cryptocurrencies for
    `ICOs`. Using other Altcoins for long-term investment is not viable yet and you
    should be trading them only as speculation.


    ## WHAT ALTCOINS TO GET?


    Though there are over 9,000 Altcoins out there, only some of them are actually
    worth investing in. You should have a good idea of what Altcoins to put your money
    in by looking at the top 10 cryptocurrencies listed on your crypto exchange, but
    perhaps you want to know how they made it up there or what features do they promise
    that make them that valuable. So, in this section, we will talk about some other
    Altcoins that you can invest in. We won’t talk about `Ethereum` since it already
    has a chapter to itself. So, what Altcoins should you consider investing into?


    ### Litecoin (LTC)


    Litecoin was launched back in 2011 and the developer said that it would be silver
    if `Bitcoin` is considered to be gold. It shares a lot of similarities with `Bitcoin`
    and is improved on areas where `Bitcoin` was lacking. Litecoin was created by
    `Charlie Lee`, an MIT graduate who used to work for `Google` as an engineer.


    Litecoin uses `scrypt` as a `Proof of Work` that can be decoded with consumer-grade
    CPUs. While `Litecoin` resembles `Bitcoin` in many ways, it offers faster transaction
    confirmation time. It is gaining traction quickly as more and more merchants are
    accepting `Litecoin` as payment.


    ### Cardano (ADA)


    Cardano is considered to be a serious contender against `Ethereum` and other cryptocurrencies.
    It is said that its blockchain is more versatile than that of `Ethereum`, though
    no one knows for certain since the cryptocurrency is still in its infancy. What
    it does beat `Ethereum` in is the fact that it uses the `Proof of Stake (PoS)`
    consensus model first. To be precise, it uses the `Ouroboros` protocol in its
    `PoS` consensus model. However, the team at `Cardano` still needs a lot of time
    before their platform can support `dApps` development.


    Cardano is a cryptocurrency created by a group of engineers, mathematicians, and
    cryptocurrency experts. In fact, the whole project was co-founded by `Charles
    Hoskinson`, who is one of the five people who created `Ethereum`. After some dispute
    over the direction of `Ethereum`, he left to create `Cardano`.


    Cardano was created after extensive research and experimentation. The team behind
    the project has written over 90 research papers on various topics, which laid
    the foundation for `Cardano`. The people behind Cardano know what they are doing.
    Because of this rigorous process, `Cardano` stands out from the crowd. What is
    their endgame? They want to be the financial operation system of the world. They
    want to achieve that by creating decentralized financial products similar to what
    has been created on the `Ethereum` blockchain. But, they also want to provide
    solutions for legal contract tracing, voter fraud prevention, among others.


    ### Polkadot (DOT)


    Polkadot uses a different protocol for their `PoS` consensus model. Similar to
    `Cardano`, the developers behind `Polkadot` want to create a cryptocurrency that
    offers interoperability between different blockchain networks via its protocol.
    It is created to connect various blockchains and oracles so all systems work together,
    forming a gigantic cluster of networks.


    The `relay chain` is `Polkadot`’s core component. It allows the interoperability
    between networks in the first place. It also enables `parachains`, or parallel
    blockchains, to function using their own native tokens.


    What makes `Polkadot` different from `Ethereum` is that `Polkadot` gives developers
    the ability to create their own blockchain. `Ethereum`, developers can just piggyback
    off `Ethereum`’s vast blockchain network. You can develop your own blockchain
    and go from there, but you run into security problems. Developing your own blockchain
    takes time and is considered a risky move. Its small size means it is prone to
    hacking. The developers behind `Polkadot` are aware of this problem, so their
    `relay chain` allows the smaller blockchain to link up with `Polkadot`’s blockchain.
    That way, the smaller blockchain is protected by `Polkadot`’s blockchain.


    ### Bitcoin Cash (BCH)


    Bitcoin Cash was created as the hard fork from `Bitcoin`. It is actually one of
    the earliest and most successful hard forks from `Bitcoin`. What is a hard fork?
    For that, we first need to understand the community behind each cryptocurrency.


    You see, because of the decentralized nature of digital currencies, any changes
    made to the blockchain network or the cryptocurrency itself have to be made with
    general consensus. The developers would take it to the community and ask for their
    opinions and the developers themselves would debate among themselves what direction
    should their coins go.

    '
