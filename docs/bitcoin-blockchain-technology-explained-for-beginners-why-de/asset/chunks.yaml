    The discussion here is important since the cryptocurrency’s value depends entirely
    on the users. More specifically, the miners, who actually confirm transactions,
    generate coins and bring them into circulation in the first place. Major changes
    to the codes behind the coins would have to go through a consensus.


    It is all well and good when everyone agrees. But when there is a conflict, a
    hard fork may occur. A hard fork can be initiated by developers or the members
    of the crypto community who are dissatisfied with the status quo and their proposed
    changes went unheard. Such a hard fork requires users to upgrade to the latest
    protocol software version and this results in certain invalid blocks and transactions
    becoming valid and vice-versa.


    And a hard fork was exactly what happened that led to Bitcoin Cash. There was
    a split in the community when they could not come to an agreement on Bitcoin’s
    direction going forward in late 2017.


    The disagreement that caused all of this came down to Bitcoin’s problem with scalability.
    You see, the Bitcoin network has a limit on the block’s size, which is only one
    megabyte (`MB`). The block size is one of the things that contribute to the slow
    transaction speed in Bitcoin in the first place.


    There were actually two solutions proposed for this problem. The first one would
    be to increase the block size, which was promptly shut down by the developers.
    The second solution was to implement Segregated Witness (`SegWit`) protocol, which
    would optimize the data storage in the block.


    But the push for `SegWit` implementation was controversial, to say the least.
    Miners weren’t happy because of the radical changes it requires. Without going
    into the technical details, the solution is seen as ineffective and unprofessional,
    due in part because the push was done without community consensus or an honest
    discussion to understand the associated benefits and the costs.


    So, the fork happened and Bitcoin Cash was created. Each block is eight megabytes
    big and there is no `SegWit` protocol. Larger blocks mean that they can hold more
    transactions within them and the transaction speed would be improved.


    ### Stellar (XLM)


    Stellar is created to provide enterprise solutions for financial institutions
    to make large transactions using its specially designed blockchain network. Anyone
    who has to send a lot of money across the continent would know the bureaucracy
    and prices associated with such transactions.


    Banks and investment firms making huge transactions like this would take many
    days and many people who act as intermediaries. It is expensive and inefficient.
    So, Stellar allows those institutions to do just that without any intermediaries
    and very little cost.


    Stellar was founded by Jed McCaleb, who was among the team that founded `Ripple
    Labs`. He also happened to be the developer of the `Ripple` protocol. One day,
    he decided to part ways with the team at `Ripple` to co-found `Stellar Development
    Foundation`.


    Stellar is an open blockchain network. Although it is designed for enterprises,
    anyone can use it. Cross-border transactions between countries can be done with
    Stellar. The native cryptocurrency is Lumens (`XLM`) and it would be used to make
    transactions on the network, just like Ethereum.


    ### Chainlink


    Developed by Steve Ellis and Sergey Nazarovl, Chainlink provides an interesting
    solution to the invincible barrier between blockchain networks and the internet.
    It is a decentralized oracle network that allows smart contracts to interact with
    data outside the blockchain network. You see, the blockchain networks themselves
    lack the ability to connect to external applications. At least, they can’t do
    it safely. Most solutions are pretty clunky and unsafe and this is where Chainlink
    comes in.


    Chainlink’s decentralized oracles give smart contracts the ability to interact
    with data outside the blockchain network. In this case, Tether provides a solution
    for users to send and receive fiat currencies while also minimizing the volatility.


    ### Binance Coin (BNB)


    Binance is a cryptocurrency that operates as exchange. At first, Binance Coin
    was an `ERC-20` token, meaning that it was created on the Ethereum blockchain.


    ### Tether (USDT)


    Tether is an early member of the stablecoin club. In this case, Tether provides
    values are pegged to `USD`.


    ### Monero (XMR)


    Monero advertised itself as a cryptocurrency when it was launched in 2014. What
    makes it stand out from other cryptocurrencies is the fact that its development
    is based solely on donations and community feedback.

