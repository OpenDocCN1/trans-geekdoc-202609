    There are many forms of cold wallets. The most user-friendly option would be USB
    wallets such as that from Ledger, `KeepKey`, or `TREZOR`. There used to be paper
    wallets as well, which is a document sent to an offline printer that would create
    private and public keys for the owner. But ever since hardware wallets became
    commonplace, paper wallets started to become obsolete.


    The idea behind cold wallets is that private keys are generated offline. For a
    USB wallet, you just plug it into your computer and launch a certain app to access
    and store your coins. If you use a USB wallet, make sure to keep it safe as any
    damage or loss means losing access to your wallet.


    There are also offline software wallets. This works similarly to hardware wallets
    except it involves two separate platforms, which makes the whole process a bit
    more complicated and overwhelming for an average user. An offline software wallet
    uses two platforms: an online platform where the public key is stored and an offline
    platform that contains the private key.


    So, the online portion creates new unsigned transactions and sends the user’s
    address to the sender or recipient on the other side. Then, this unsigned transaction
    would be moved to the offline wallet where the private key would be used to sign.
    The transaction, now signed, would be moved back to the online wallet and be broadcasted
    on the blockchain network to confirm the transaction. Since the offline wallet
    is never connected to the internet, the private keys remain protected. If you
    are interested in having an offline software wallet, consider `Electrum` and `Armory`.
    They are known to have the best offline software wallet.


    Now is a good time to mention hardware and software wallets. These are pretty
    self-explanatory. Hardware wallets are special devices that store your private
    keys whereas software wallets do so on your computer.


    You want to have hardware or at least a cold wallet to store your coins. You see,
    when you register with a crypto exchange, you would need to create a wallet with
    them. Unfortunately, they also handle the generation of private and public keys.
    Therefore, they could, in theory, use the private key to steal your money.


    So, you should look for well-known crypto wallet providers that have cutting-edge
    technology. There are many options out there, so look around and evaluate the
    pros and cons of each provider before you decide.


    # WHAT WALLET TO CHOOSE


    That said, if you are new to the world of cryptocurrency, maybe you are undecided
    and not know where to start. Worry not. We’ve got you covered. There are a number
    of things to consider when choosing a wallet provider.


    ## Reputation


    This is self-explanatory, you should only consider companies that are well-known.
    These companies understand that they are better off providing their customers
    with good quality products instead of scamming them out of their money. Their
    reputation is worth more than a quick buck.


    Look for companies that have been around for a long time and see what their customers
    say about them. Understand what features they offer and how those can help protect
    your coins. More often than not, you can find online reviews about these companies
    so you know what to expect going in.


    ## Technology


    Given the anonymous, decentralized, yet transparent features of cryptocurrencies,
    people would want the same from their crypto wallet provider. In this case, your
    provider should have open-source wallets. That means, other people can see how
    the wallets are developed by looking at the codes that are made publicly available.


    That way, if there is anything amiss, people would know about it. Knowing the
    codes that power these wallets is very important because they basically tell you
    how the wallet works in its entirety. They tell you how the private key is stored;
    is it with you or your provider, also is the key stored on their server? The second
    path is riskier. Two-factor authentication is also something to look out for.


    In addition, privacy is also something that a lot of people care about. A few
    of them care about it a little too much, but you can’t fault them for that given
    all the private data leaks in the past. If that is you, consider checking out
    whether the crypto wallet would work over a `TOR Network` in case you really want
    to operate in the dark.


    ## Backup Functionalities


    This is one of those things that may seem whimsical and insignificant at first
    until you realize a little too late just how important it is. There are a lot
    of problems that you might face in the future that may jeopardize your investment.
    Maybe your computer broke down and that computer happens to be the only place
    where you’ve installed your software offline wallet. Maybe the external environment
    shortens your hardware wallet’s lifespan faster than you expect, and it suddenly
    dies one day. If any of those happen, your investment will go down the drain.


    To prevent this from happening, make sure you back up your wallet. Again, since
    wallets hold data showing where your coins are on the blockchain network, backing
    up your wallet does not duplicate the coins you have in your wallet. Backing up
    just duplicates the treasure map to your spoils just in case anything happens
    to the original copy.


    So, when you are out looking for a proper crypto wallet, make sure that they have
    a solid backup procedure. It should have a rescue link, password, and some passphrases
    to restore your access. Two-factor authentication is also important here.


    ## Multi-Coin Support


    Most wallets these days allow you to store a few types of Altcoins, in addition
    to Bitcoin. What coins they choose to support may differ between manufacturers,
    so make sure you know what coins you are going to trade in the future, and then
    choose the right wallet for them.


    Having a crypto wallet that can support different coins is handy. You do not have
    to own multiple wallets that only support one type of coin each. You won’t have
    to go through so much hassle just to access different coins.


    ## Cryptocurrency Conversion


    This is optional, but handy, nonetheless. It is a nice little integration that
    can be built right into your crypto wallet. Of course, they would need to be working
    with a crypto exchange or have other means to buy and sell your coins for you
    if the manufacturer is to be able to offer such a feature. In this case, `Exodus`
    works with `ShapeShift` to create a crypto wallet to convert coins to simplify
    cryptocurrency arbitrage.


    ## Shared Account


    To be clear, you should not be sharing your crypto wallet with another user, for
    obvious reasons. You cannot really trust anyone. You can do that just as another
    form of protection against lost keys or similar situations. Luckily, there is
    a way to ensure that your coins are safe. You can do this by creating a `MultiSig`,
    or Multiple Signature, account.


    It is a trust system in which transactions cannot take place unless all parties
    tied to the account give their approval. So, multiple private keys would be generated
    and tied to the same wallet. This feature is very useful for business partners
    or families.


    ## Platforms/Devices


    This is something worth considering. Having multiple devices connected to the
    same wallet is convenient, albeit a bit risky. Ideally, you want to have a wallet
    per device only. It would be a hassle to manage all of them, but if any of your
    devices get lost or compromised or something, at least you won’t lose all of your
    coins.


    ## QR Scanner


    This one is pretty important. Scanning the QR code lets people share their public
    key without the need to type everything out. Since keys are just a jumbled mess
    of letters and numbers, it is very easy to misread or mistype a certain character.
    Just a single mistake means that your coins would be sent to the wrong person,
    and there is no way to recover them. So, any crypto wallet worth a penny can generate
    and scan QR codes to facilitate coin transfers.


    ## Customer Service

