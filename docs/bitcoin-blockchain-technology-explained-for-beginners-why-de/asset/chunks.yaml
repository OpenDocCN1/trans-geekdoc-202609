- fmt: '

    Then there is the question of transaction fees. In Bitcoin, miners are awarded
    a small amount of coin when they successfully verify a transaction. This coin
    does not come from anywhere. It is created. It also happens to be the only way
    to generate Bitcoin, meaning that this is the only way that new Bitcoin is introduced
    into circulation.


    Verifying transaction on the Bitcoin blockchain is free for the users, although
    you can choose to pay the miner a bit more money so they prioritize going through
    your transactions first. The fees are completely optional, so even if you don’t
    pay them anything, the transaction would go through, nonetheless. It just takes
    a little bit more time.


    Ether is also generated via mining. The difference here is that Ether is needed
    to fuel all transactions on the Ethereum blockchain. This is called the `GAS`
    fee and Ether would be used to verify transactions, run apps, etc. Some may frown
    upon the fact that they need to pay a small transaction fee in Ether to grease
    the engine, but this also promotes Ether circulation within the network.


    ### Time


    When it comes to the average amount of time needed to verify transactions and
    add the block to the blockchain network, Bitcoin takes around nine to ten minutes
    whereas Ethereum is a lot faster. Usually, it takes about 15 seconds to do so
    on the Ethereum network.


    ### Hashing Algorithms


    Hashing algorithms are how blockchain networks protect their data and ensure that
    everyone on it is anonymous. Bitcoin uses a hashing algorithm called `SHA-256`
    whereas Ethereum uses `Ethash`.


    ### Numbers


    There is more Ethereum in circulation compared to Bitcoin. Despite the fact that
    there is more Ether, it is Bitcoin that reached the $1 trillion market cap milestone
    first. Ethereum is lacking behind by a country mile. What Ethereum has more than
    Bitcoin is its number of blocks, which is at over 660,000 at the moment of writing,
    while Bitcoin is around 540,000. Ethereum has more blocks in its blockchain because
    it takes a lot less time to verify transactions.


    ## BUYING AND SELLING ETHER


    Now that you have a solid understanding of Ethereum, let’s talk about how you
    can buy Ether. This is assuming that you already have a wallet to store Ether.
    We have covered crypto wallets in Chapter 4, so check that out if you haven’t
    already. Long story short, the crypto wallet needs to be able to store Ether and
    provide adequate security and quality of life features to protect your investment
    against hacking or loss of access. Also, this is assuming that you don’t plan
    on mining Ether. We have also covered crypto mining in Chapter 3.


    So, how can you go about acquiring some Ether to get your investment journey started?


    ### Identify a Trading Platform


    The first thing you need to do is to look for a trading platform that best suits
    your needs. There are a number of popular platforms out there that offer Ether,
    such as `Coinbase`, `Binance`, `Kraken`, `Bitstamp`, `Gemini`, and `Bitfinex`.
    It is recommended that you start with these first and then slowly work your way
    to finding out which platform really has everything you need.


    Also, one of the biggest considerations for picking a crypto exchange is the type
    of exchange itself. Here, there are three types. One that offers fiat currency
    exchange services, or cryptocurrency to cryptocurrency services (`C2C`), and then
    one that does both.


    You see, some crypto exchanges are actually used as Forex platforms or used to
    offer some other trading services. They simply expanded their business to incorporate
    cryptocurrency into their offerings.


    Depending on how you plan to trade, you may find that `C2C` exchanges are more
    appealing.


    ### Creating an Account


    Once you have decided on which exchange you want to use, it is time to create
    your account. You just need to provide some personal information such as `name`,
    `address`, `social security number`, etc. This process should not take long.


    ### Acquiring Currency


    Once the verification process is all done and dusted, let’s talk money. Assuming
    that you do not have any cryptocurrency to your name, you would need to start
    by buying them. Most exchanges only accept major fiat currencies.


    ### Start Trading


    Once everything is complete, you can finally trade cryptocurrencies.


    ### Earning Your Spoils


    Once you have made some profit, you can withdraw the currency. Most crypto exchanges
    allow you to convert cryptocurrency into fiat currency, so you can convert the
    cash to your bank account.


    # DIVERSIFY


    One of the first things you will hear when you get into the investment game is
    that you should diversify your portfolio. The same theory applies here. You should
    not put all of your investments into a single cryptocurrency. In the event that
    the coin’s price crashes, you would be left with nothing. Therefore, pick up a
    couple of other cryptocurrencies to enrich your portfolio. This is where Altcoins
    come in.


    ## ALTCOINS


    Altcoins, or alternative coins, is an umbrella term that refers to every other
    cryptocurrency except for Bitcoin. They share characteristics that make them a
    cryptocurrency, but they offer different features from Bitcoin.


    ### Types of Altcoins


    What distinguishes one Altcoin from another comes down to its functionalities
    and consensus mechanism. They usually fall under these four categories, some fit
    into more than one category.


    **Mining-Based**

