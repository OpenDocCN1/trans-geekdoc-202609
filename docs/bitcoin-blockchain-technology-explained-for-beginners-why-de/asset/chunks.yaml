    to be a partner of that airline, you would have the option to scan a QR code.
    The app would then send all the necessary details to the company. No more fumbling
    with papers. It’s all inside your phone. Of course, to confirm that the information
    indeed comes from you, you are required to do a fingerprint or an iris scan.


    You can do this whenever you need to verify your identity. So long as the destination
    is a partner with Civic, then the entire process is a breeze. Your information
    can be verified via the blockchain network.


    You might be thinking that not many companies would partner up with Civic, and
    you would be correct. It is still rather small in scope right now, but as the
    app continues to be used, the more trust it gathers. Eventually, it will reach
    a point where everyone has heard about the app.


    But that’s not the entire system behind the CVC tokens. They have another role
    to play. CVC is used up in the verification process. The verifiers of IDs such
    as governments, banks, and other trusted sources would be paid CVC tokens for
    their KYC (know-your-customer) checks. The records would be stored on the blockchain.'
