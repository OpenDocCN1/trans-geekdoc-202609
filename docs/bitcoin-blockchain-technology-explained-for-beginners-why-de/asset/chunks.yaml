    # ANSWERING THE 7 WHS OF CRYPTOCURRENCIES


    To start things off, we need to establish the groundwork by understanding what
    cryptocurrencies are and what you can do with them. We will go over the basics
    of cryptocurrencies in this chapter. Even if you had no idea of cryptocurrencies
    before, this chapter should equip you with everything you need to understand them.


    ## WHAT IS CRYPTOCURRENCY


    At a glance, cryptocurrency is just like any other digital currencies for your
    online banks. You are partly right. Cryptocurrencies do not have a physical presence.
    The entire system is completely online, supported by the users.


    You see, cryptocurrencies are within decentralized networks. These networks use
    `blockchain` technology. `blockchain` is a peer-to-peer (P2P) distributed ledger
    system that is upheld by the user’s computers. More on its function and inner
    workings later.


    Cryptocurrency is classified as a virtual currency by the United States government
    and it is secured by cryptography. In other words, the major cryptocurrencies
    are virtually impossible to replicate or counterfeit.


    The thing that sets cryptocurrencies apart from other fiat currencies, or government-issued
    currencies, is the fact that these do not usually come from any government or
    financial institution. While certain governments and banks are experimenting with
    cryptocurrencies of their own, the original and major cryptocurrencies do not
    come from any central authorities. Instead, they come from the users.


    This defining feature is the main point of contention nowadays between crypto
    supporters and skeptics. Cryptocurrencies are technically immune to government
    interference or manipulation, but some argue that this lack of control is dangerous,
    to say the least.


    The name “cryptocurrency” is derived from the encryption techniques implemented
    to protect the entire network from hackers. `blockchain` technology powers the
    entire system, which is why you often hear the two terms used together. Think
    of it this way. Cryptocurrency is the money that you send and receive whereas
    `blockchain` technology is the entire financial system that allows the transaction
    to happen.


    Since cryptocurrencies are independent of government and financial institutions,
    there have been concerns surrounding the subject. After all, the latest 2020 `Bitcoin`
    halving and its subsequent price surge gave many people the impression that `Bitcoin`
    is the digital gold. There is a lot of money here, so you can bet that many people
    are interested in the coins.


    Many financial experts believe that `blockchain` and other relevant technology
    will ultimately revolutionize how transactions work. But their applications reach
    far beyond just financial technology. `blockchain` is an information technology.
    In other words, it gives you a new way to store information. Sure, the technology
    is not new. It just implements technologies differently and that happens with
    a very secure and effective method. This technology has the potential to change
    how information is stored and disrupts many industries such as healthcare, law,
    and finance.


    Cryptocurrencies have been bashed many times in the past and the arguments against
    them are largely the same. They always point to the potential use for illegal
    activities, volatility in the exchange rate, and the vulnerabilities of the underlying
    infrastructure, especially the cryptocurrency exchanges where cryptocurrencies
    can be bought and sold. While the `blockchain` network itself is virtually impenetrable,
    the crypto exchanges are particularly vulnerable and that is where most of the
    money is at.


    Despite all of this, cryptocurrencies are praised for their transparency, divisibility,
    resistance to inflation, and portability.


    ## TYPES OF CRYPTOCURRENCY


    The first-ever cryptocurrency was `Bitcoin`, which kickstarted it all. `Bitcoin`
    is still the most valuable and popular cryptocurrency today. This is closely followed
    by `Ethereum`, `Bitcoin Cash`, `Litecoin`, etc. `Altcoin` is a blanket term for
    all alternative cryptocurrencies besides `Bitcoin`.


    Not all cryptocurrencies are created with the same purpose in mind. While `Bitcoin`
    is created to become a medium of transaction, `Ethereum` is also used to fund
    startups with their Initial Coin Offering (`ICO`) events. Investing your `Ether`
    into `ICO` is a viable way to make more money, and we will talk more about this
    later.


    `Bitcoin` was born in 2009 developed by one `Satoshi Nakamoto`. It is not known
    who this person is or if it is a group of people, but we do know that their cryptocurrency
    is digital gold. As of March 2021, there were over 18 million `Bitcoins` in circulation.
    This means that the total market cap of `Bitcoin` is around $927 billion. The
    total market cap of all cryptocurrencies in existence is about $1.5 trillion,
    and `Bitcoin` holds over 60% of that share.


    ### Advantages


    Cryptocurrency makes transactions fast and cheap. This is possible because of
    the `blockchain` network which allows fund transfer between two parties without
    the need for an intermediary. For a normal bank transfer, your bank would verify
    the transaction before sending your money off to the other party. The way it works
    now is people are still required at the helm, especially when a large amount of
    money is being transferred internationally. This means higher transaction costs
    and more time needed to verify the transaction.


    Cryptocurrency does not have such a tedious system. Sure, the transaction still
    needs to be verified but this job falls onto the `miners`, a common term when
    one discusses cryptocurrency. These `miners` contribute their computing power
    to verify transactions and they get paid a small amount of cryptocurrency for
    their work. The thing is that they get paid similar amounts regardless of how
    much money is being sent. The fee on crypto transactions is minuscule compared
    to the fees from your bank or other financial institutions.


    Plus, the `blockchain` network allows for transactions to occur within minutes.
    `Bitcoin` takes about nine to ten minutes to verify, and other cryptocurrencies
    can do the job faster because the developers optimized their network.


    ### Disadvantages


    That said, the biggest perceived disadvantage for cryptocurrency is its anonymity.
    You see, users on the `blockchain` network do not use their real names. They use
    pseudonyms or usernames, and tracking down any specific user is a challenging
    task even for the United States government.


    This blanket of anonymity means that criminals can engage in illegal activities
    without the government’s knowledge. They might use it to launder money or avoid
    tax. On the flip side, there have been cases where people would send their life
    savings into the `blockchain` network by buying up a cryptocurrency, and then
    move out of their dangerous country, only to get back their riches. That way,
    they don’t have to risk all their wealth by carrying it with them.


    Certain journalists and whistleblower websites and outlets require an alternative
    source of income since they may be denied financial services by major financial
    institutions. `WikiLeaks` is one such website. These websites are located on the
    Dark Web, where anonymity is guaranteed. That means, cryptocurrency benefits whistleblowers
    and activists living under repressive governments.


    It is also worth mentioning that the best way to stop crime would be to give up
    all forms of privacy. If the government knows everything, they can stop illegal
    activities long before it happens. But would you want to live in such a society?
    Evidently, any government should not have this much power. In fact, the `NSA`
    scandal with `Edward Snowden` illustrates just that.

    '
