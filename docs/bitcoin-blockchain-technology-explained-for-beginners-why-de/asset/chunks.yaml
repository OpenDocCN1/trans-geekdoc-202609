    Then there are risks to consider. What are they? Risk represents the possibility
    of loss that traders or investors are willing to take in exchange for the possibility
    of making a profit or gain from their investment. In the cryptocurrency market,
    there are two main types of risks. Systematic or market risk, and coin-specific
    or idiosyncratic risk.


    Market risks are the risks associated with the overarching performance of the
    crypto market. This is the kind of risk that is inherent and inevitable. So, the
    only thing you can do is minimize risk. This is down to the fact that all cryptocurrencies
    are more or less tied to Bitcoin and each other. Just like the Bitcoin crash following
    its halving in 2016, almost all coins and tokens are almost worthless.


    Idiosyncratic risks are a lot easier to deal with since they are tied to a specific
    coin or token. These risks are influenced by factors that directly relate to the
    project or coin itself. For instance, suppose that the project experiences a network
    failure, a member of the development team quits, the entire development team runs
    away with the investors’ funds or any other negative event, then the coin holder
    would lose money.


    What is interesting in the investment world is that risks are both a blessing
    and a curse. Conventional wisdom in the financial world dictates that the greater
    the risk, the better the reward.


    **Key Factors to Consider when Investing**


    So, what are some of the things you should consider before you jump into cryptocurrency
    trading?


    **Timing**


    Due to the volatile nature of the crypto market, timing is everything. While simple
    in concept, actually pulling it off is a lot trickier than people think. Normally,
    when you go into a trade, you should have the main plan and a few backup plans
    for your entry and exit points. Fail to define those two and you are at great
    risk of losing money.


    The basic principle here is to buy into the market when there is a bearish trend
    and sell when there is a bullish trend. In simpler terms, you buy low and sell
    high. Simple, but difficult to pull out. It is not just about the market volatility
    you have to deal with, but you also need to make the right decisions in the face
    of prevailing circumstances.


    **Trading vs Investing**


    We have gone over this before, but it’s worth mentioning it here again. Given
    how many cryptocurrencies there are on the market, coupled with the fact that
    cryptocurrencies are inherently volatile, you should know that you are setting
    yourself up for a particularly bumpy ride and you should know what you are doing
    before you jump in. This involves analytics. There are two main types of analysis.


    The first is fundamental analysis. This involves a very basic research process
    and analysis of the data you gather. You would first look for the coin’s whitepaper
    or a detailed proposal by the development team. It should contain all the information
    you need to establish a basic understanding. You should look for information regarding
    the industry it operates in, what problem it seeks to solve, how it aims to achieve
    its goals, the intrinsic value of the company, its financial statements, and other
    economic variables.


    But whitepaper could get technical quickly, so you can also seek out alternative
    sources. You should do this because a salesperson worth their paycheck would not
    write anything negative about themselves that would dissuade potential buyers
    or investors. For this, you want to look at blog posts or community forums to
    access the general sentiments around the coin, how the developers interact with
    the community, etc.


    Most people would have already gone over the technical jargon and explain it in
    detail for other people who come before you. If not, then all you have to do is
    ask and someone will gladly explain it to you. Alternatively, you can also Google
    the term and add “ELI5”, which means “Explain it to me like I’m 5 years old”.
    Don’t mind the condescending tone of the term.


    Another form of analysis is technical analysis. This one requires a bit more data
    because you need to forecast the price movement in the near future, which requires
    you to look at market data from the past, especially volume and prices. All of
    this involves a lot of charts and number crunching, which is understandably not
    for everyone. Unlike fundamental analysis, technical analysis does not evaluate
    the coin’s underlying value. It just looks at the price charts, understands the
    trends and patterns, and formulates a strategy from there.


    Now, you need to ask yourself whether you want to invest or trade cryptocurrencies.
    Both are nuanced in their own way.


    The trading path involves short-term but frequent investments, so it is better
    suited for traders who like living life on the edge. Traders would use technical
    analysis to identify price movement patterns and time their entry and exit accordingly.


    On the other hand, the investment path is more risk-averse. Your plan would be
    to hold onto the coins long-term and reap your profits by either selling off your
    coins several months or even years into the future or by holding onto security
    tokens and getting dividends. Because you don’t have to care too much about minute
    price movements in the immediate future, your focus should be on the coin’s underlying
    value. That means, you would need to do some fundamental analyses.


    Regardless of which path you choose, you should always do enough research so you
    know what kind of person you are, be it a daredevil or a scholar, as well as the
    risks associated with the coins you are looking into and whether you can tolerate
    those risks.


    **Personal Competency**'
