    Sometimes, small changes can make a huge impact on the project as a whole. When
    performing fundamental analyses, always keep a lookout for what is happening and
    how the market is going to react to those changes. Understanding these, and also
    knowing the future potential for assets will put you several steps ahead of an
    average Joe.


