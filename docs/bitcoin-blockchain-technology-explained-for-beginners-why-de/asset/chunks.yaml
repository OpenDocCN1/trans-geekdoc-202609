    The funny thing is that the price suddenly goes up significantly. Since your position
    is closed, you are cut out of the game and you just missed that opportunity to
    make a profit. That’s not something you want to see in the middle of the night.
    Sometimes, it’s just the volatility of the market. But some other times, other
    nefarious things are going on behind the curtain.


    This trick is called the stop drive. It can happen when your crypto exchange knows
    where you set your stop-loss and they decided to crash the price with fake moves.
    Then, they move in to take the profits.


    It works by the exchange selling the coins, therefore causing the price to go
    down. They do this because they know that they would make more money on the stop-loss
    than they would lose to sell the coins to cause the price crash, only to buy them
    back later. The good thing about driving a stop is that you get your coins back
    from covering the stop. In simple terms, it is basically a way for people to print
    money.


    This strategy is not new. In fact, it has been done many times in history by brokers
    in various markets. It’s not just the crypto exchange. Traders also play the game
    sometimes, but it is normally the “house” that uses this strategy since they have
    all the data they need to pull this off.


    Though this is highly illegal, it doesn’t stop it from happening. It still occurs
    from time to time in the stock and commodities markets, though rare. But it is
    starting to become pretty common in the cryptocurrency market.


    So, what can you do to stop it? Here, we need to talk about leverage. It is basically
    a way to amplify your profits if your trade goes well, or loss if it does not.
    It is a multiplier. Crypto exchange offers various levels of leverage. In Forex,
    it can go up to 1:1000, meaning that you can get 1,000 times your profit if you
    utilize leverage.


    Leverage is created so that traders can benefit from large volume trading without
    actually having to invest much money. This is particularly important in forex
    when the profit you make is in thousandths of cents, so leverage pumps the numbers
    up so that your profit is more tangible. Traders only need to invest a small fraction
    of the position to make use of the leverage. A portion of their balance would
    be frozen by their platform so that they can cover their losses if the trade goes
    south.


    In crypto trading, it is a different story. You should learn the charts and trade
    without leverage or even without stops if you can keep an eye on the charts. Crypto
    exchange platforms that do not provide leverage or stop-loss features do so to
    protect their users. Those that do, do so because of their own interest.


    Novice traders that go into crypto trading platforms every day have little idea
    of how trading works and would use all the features to help them trade, be it
    leverage and stop-loss, without really knowing the intricacies of crypto trading.
    They often end up losing a lot of money and then some more since they are novice
    traders and let their emotions get the best of them.


    All of this would give the exchange more and more money, and that is exactly what
    they want. This just goes to show that trading is usually a zero-sum game. Nobody
    wins it all and the losers have to pay for it. At least some people care and understand
    the risk behind leveraging and stop-loss, and decided to offer a platform that
    does not have these features, which is something to look for.


    If you have to use stops, just make a mental note or write it down somewhere so
    your platform does not know where your stops actually are. Also, try your best
    not to use leverage. It will take some time to bring in the profits, certainly,
    but it is a safer route. Even if you do, keep it as low as possible. If you have
    high leverage, monitor every price movement. Better yet, buy and hold onto the
    coins, and also buy the dips (buy the coins when the price goes down), but this
    is a very risky move and no one wants to be in that position. This is why there
    aren’t many successful traders. It’s high risk and high reward.


