    我们之前稍微提到过这一点。这两者都是你可以在交易图表上绘制的水平线，以更好地理解该特定币种的价格走势。有些人可能会认为，将这些水平视为区域而非线条会更好。某些交易软件允许你画线，但如果你的软件没有这个功能，你也可以肉眼估算。


    ### 支撑位与阻力位


    支撑位基本上是价格地板。你可以通过 K 线和趋势线看到这一点。价格永远不会跌破某个特定点。它们会多次接近该点，但永远不会低于该点。那里就是你的支撑位。这是该币种的感官最低价格点，通常也是许多交易者买入的地方。这要么防止币价进一步下跌，要么会完全反转趋势并启动上涨趋势。


    阻力位则是相反的。它是一条价格无法进一步上升的线或区域。这表明买方认为价格已经相当高，因此他们不会再买入。这也意味着买方倾向于卖出他们手中的代币，因为价格已经达到了他们的最高水平，从而增加了供应并推动价格回落。


    当价格达到其中任何一个水平时，它就在测试这条线。测试的次数越多，它就变得越弱。然而，支撑位和阻力位并不是永久的。价格最终会突破这些水平，并建立新的支撑和阻力位。


    趋势强性的几个关键指标包括突破支撑位或阻力位。有时，阻力位变成新的支撑位，反之亦然，这进一步加强了当前趋势的强度。当然，也可能发生假突破（即假信号）。有时，假突破发生的规模之大，足以触发你的止损或止盈，让交易者感到非常沮丧。因此，建议交易者将止损和止盈位设得远一点，并查看不同的指标来帮助他们定义趋势。


    ### 交易量


    交易量也有助于交易者判断趋势是否具有重要性。如果成交量高，意味着趋势是重要的。反之，如果成交量低，意味着趋势很弱，会很快消逝。


    所以，当币价下跌时，请检查成交量。你需要检查价格下跌时成交量是否低，价格上涨时成交量是否高。这意味着正在进行一个健康的趋势，并伴随着长期增长。但如果交易量在上涨趋势期间下降，则意味着趋势很快就会结束。下降趋势的情况同样如此。


    ### 市值


    你可以查看市值来了解币种的稳定性能。通常情况下，该加密货币的市值越大，就越稳定。如果你的交易所没有提供市值，计算它也非常简单。你只需要将流通量乘以其当前价格即可。


    ### 相对强度指数


    仅通过肉眼估算图表、观察 K 线和跟踪趋势线，作用是有限的。有时，你需要使用指标，而且有很多可供选择。其中一个被称为 `RSI` 指标，即相对强度指数指标。


    这里面涉及大量的数学计算。幸运的是，你不需要自己计算，因为大多数平台都为你计算好了。你可以在图表软件上开启 `RSI` 指标。它显示为一条或两条线，范围在
    0 到 100 的光谱上。如果 `RSI` 处于 30 或以下，意味着该加密货币被低估，价格可能很快就会上涨。如果 `RSI` 处于 70 或以上，意味着该加密货币被高估，这可能表明人们将开始抛代币，价格很快就会下跌。


    ### 移动平均线


    这也有对应的指标。正如名称所暗示的，平均线是特定时期内的价格平均值。你可以使用移动平均线来帮助预测未来价格。大多数交易者使用指数平均线（EMA）来帮助他们。例如，如果短期移动平均线穿越长期移动平均线，可能意味着上涨趋势到来。


    '
- fmt: '

    In short, many things influence the price of a cryptocurrency, most of which are
    outside your control. Therefore, traders are advised to keep an eye out for crypto-related
    news and act accordingly. Information is key here.


    ## Other Considerations


    Trading cryptocurrencies can be nerve-wracking because there are so many things
    you need to consider and many things that can go wrong. Trading in itself is quite
    complex, and trading crypto is even more so. It is not for everyone, especially
    beginners.


    If you are new to the whole trading game, you should at least come equipped with
    some knowledge about trading. We have covered some of it here but there is so
    much more to explore.


    What can you do, then? There are many free resources out there to help you understand
    the trading game, such as `BabyPips`. Some of their content might not be totally
    accurate and their specialty is in forex, but most of the concepts apply to crypto
    trading as well. The content you find online might be inaccurate or outdated,
    however.


    This is why you should also consider signing up for some classes. Sure, you have
    to pay a bit of cash and some of them are outright scams, but if you do your research,
    you should be able to find some reputable mentors who can show you the ropes.
    Consider this an investment that will pay you much more in the future.


    Other than that, never start trading with your own money straight away. Most trading
    platforms offer demo accounts with a certain amount of virtual balance. You get
    to play with real-world live data and trade with this virtual cash and see how
    you are doing. This is a great place to practice and familiarize yourself with
    the trading platform. Once you are comfortable, you can then put money in and
    start to trade for real.


    ## Conclusion


    We are now at the end of our second book in our three-book series on cryptocurrency
    and how to trade and invest in it. We have covered a lot of things here, but this
    is by no means an exhaustive coverage of the vast world of cryptocurrency.


    In short, cryptocurrency is considered to be a digital asset and there are many
    forms of cryptocurrencies. Its biggest selling point is the fact that it is a
    decentralized currency, which is free from the control of major financial institutions
    and governments. This is important because many people are tired of the government
    putting their tax money into all the wrong causes or industries that are not important
    are getting bailed out while the common folks have to deal with the economic hardships.
    This is very apparent in the Great Depression and the recent Covid pandemic.


    So, with the `Bitcoin halving`, there is renewed interest in cryptocurrency once
    again. While some speculated that it is merely a bubble that would pop again just
    like it did the last time in the `2016 halving`, others believe that this time
    will be different. This is because more and more companies and major financial
    institutions are getting in on the action.


    It’s not just cryptocurrencies that have future potential. The technology behind
    it is also quite versatile. Blockchain technology has so much potential that even
    if cryptocurrencies were to fade into obscurity tomorrow, blockchain would still
    be around. It created smart contracts, decentralized apps, and decentralized financial
    technologies, all of which would be very helpful in any given industry. It also
    provides a way to store information that is very secure against hackers, if set
    up properly. In this case, cryptocurrency would just be tokens to enable these
    services.


    As with anything in life, trading or investing in cryptocurrency is never a straightforward
    process. At least, not if you want to succeed. There are so many things to consider
    that would give anyone a headache.


    Of course, you can just invest in `Bitcoin` and `Ethereum` and hold onto those
    coins until they reach a certain point before you sell it all off. But there is
    more to cryptocurrency investment than this.


    For one, you can put your `Ether` into startups or projects that launch `ICOs`
    or `STOs`. If their projects are successful, you can sell off the utility tokens
    to make an even bigger profit or hold onto those so you can access various services.
    For security tokens, you basically hold a share in the company and you can hold
    onto these tokens and have a solid source of passive revenue.


    Of course, it is not just `Bitcoin` and `Ethereum` that are in the crypto space.
    They are the big players, sure, but there are also many other cryptocurrencies
    to consider. And you should really consider investing in `Altcoins`. There is
    no telling when any of the big players will suddenly crash in value because of
    government regulations or something else, so you need to be diversifying your
    investment.


    What is really interesting about the crypto world is that different cryptocurrencies
    and tokens are created for different purposes. While `Bitcoin` is intended to
    be the digital gold, `Ethereum` aims to provide a platform for developers to create
    decentralized applications. Other cryptocurrencies attempt to facilitate low-cost
    and quick transactions, file sharing, or video streaming. All of this is thanks
    to the wide range of applications of blockchain technology.


    And you should really consider the endless possibility in the crypto world. The
    developers in that space are coming up with new ways to solve problems. They have
    different solutions for the same issue, and this only encourages new technological
    development.


    For you as an investor or trader, there is a lot of money to be made here, provided
    that you know what you are doing. Unfortunately, a lot of people in the crypto
    world are not familiar with trading. They think that trading or investing in cryptocurrencies
    is a way to get rich quickly without fully understanding the intricacies of trading
    in the first place. So, they end up losing a lot of money and this gives cryptocurrency
    a bad reputation.


    Mastering the art of trade is not easy, but there is profit to be made. It takes
    careful consideration, experience, and a little bit of luck to pull off. But if
    you keep your wits about you and diligently gather information and do your research,
    and make your decisions are based on facts, not other people’s opinions, you are
    well on your way to seeing your equity in a beautiful green color.


    Of course, the story does not end there because there are taxes to consider. If
    you can afford it, the best thing to do would be to get a certified public accountant
    to help you. They know their way around the tax laws and can give you some advice
    on how you can minimize your tax. Their service is quite pricey, but it pays itself
    with the deduced tax rate over time. Just make sure that your `CPA` is familiar
    with cryptocurrency and has experience in dealing with it.


    Even if you are not interested in investing in cryptocurrency, you should at least
    consider the future potential for the underlying blockchain technology that powers
    cryptocurrencies.


    And this is part of the reason why large corporations are getting in on the action,
    especially the giants from Silicon Valley. They realize the potential application
    for blockchain technology, which is virtually limitless, and they understand how
    they can leverage this to bring new innovations to the world.


    We are now starting to see wider adoption for cryptocurrency. Governments across
    the globe are working on ways to regulate cryptocurrency as well. Things are really
    looking up for cryptocurrency, despite the naysayers.

    '
