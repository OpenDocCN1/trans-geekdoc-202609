    # STORAGE OPTIONS


    In this chapter, we will go over how you can store your coins, in detail. You
    need a place to store your coins and you can’t just place them on your crypto
    exchange wallet unless you want to lose all your coins in a cyberattack or a scam.
    Therefore, it is imperative that you choose a secure wallet to hold all of your
    coins.


    ## HOW CRYPTOCURRENCY WALLETS WORK


    To quickly summarize, a crypto wallet is basically a piece of software that allows
    you to send and receive coins. While all wallets allow you to store different
    coins at once, most of them only allow you to do so for a small number of coins.
    They usually cover the most popular coins such as `Bitcoin`, `Litecoin`, `Ethereum`,
    etc.


    To be clear, the wallets do not store your coins in any shape or form. They simply
    contain the address to which your coins belong. To access these coins, you would
    need to use your `private key`, which is a string of numbers and letters. Everyone
    uses their `public key` as a way to send and receive coins, but a `private key`
    is needed to access the coins in the wallet.


    Creating a cryptocurrency wallet is quite simple. Most wallet providers would
    give you detailed step-by-step instructions on how you can set up a wallet with
    them. Before you do, just make sure that the wallet actually supports the coins
    you plan to have. Upon creation, you would be given a `private` and `public key`
    to your wallet, and you should write them down somewhere.


    ## TYPES OF CRYPTOCURRENCY WALLETS


    There are many types of cryptocurrency wallets, and they can be categorized based
    on how they are used. They are grouped into two main categories: hot or cold,
    and software or hardware. Ideally, you should be using a cold hardware wallet.


    The difference between hot and cold wallets depends on internet connectivity.
    Hot wallets are connected to the internet and are less secure, prone to cyberattacks,
    but convenient to use. On the other hand, cold wallets do not need to be connected
    to the internet in order to be used.


    Cold wallets work because of how cryptocurrency wallets work in the first place.
    To reiterate, the wallet themselves do not physically hold the coins. They only
    hold the data that point to where the coins are on the cryptocurrency network.
    So, they do not need to be online in order to function. They would still need
    to go online to receive coins from others, but they just go off the grid once
    that is complete.

