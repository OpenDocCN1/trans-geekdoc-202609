- fmt: '

    Investing in such a new investment vehicle the like of `Bitcoin` has great potential
    as it could become something very big in the future. The loss? Though some would
    say that the loss would be equally massive, keep in mind that you are not going
    to lose more money than you put in since the price cannot go into the negative.
    The most it will go is zero, and the loss incurred then would be the entire amount
    you put into `Bitcoin` or `Altcoins`.


    ## The Case Against Cryptocurrency


    That said, not everyone believes that investing in cryptocurrencies is a good
    idea. At least, they do not think an average investor should concern themselves
    with crypto investments. There are a number of reasons for this.


    The biggest one, again, is price volatility. While it is fun to ride the waves,
    the price swings are definitely not for the faint-hearted. There are yet to be
    sufficient regulations to prevent fraud or theft that we see in other markets.


    Hacking remains a major threat in the cryptocurrency ecosystem. The blockchain
    network is virtually impenetrable, but other parts of the ecosystem such as the
    digital wallet and crypto exchanges remain particularly vulnerable. Hackers can
    get in, steal all your coins, and there is little you can do about it once that
    happens.


    Plus, there is the fact that cryptocurrency is not the only investment option
    you have out there. Unless you really, really hate the current financial system,
    there are other ways to make use of your money without having to deal with the
    aforementioned threats.


    For one, if you want to invest in something and hope the price will go up, there
    is the stock market. Its speculations are all the same here, except the prices
    are a lot more stable. If you are looking to invest in startups, having some tokens
    to your name seems appealing, but it’s just a more convenient way to verify your
    contributions and to enjoy the promised perks. There are other ways to do that
    without the use of tokens.


    ## MINING CRYPTOCURRENCY


    If you are not into trading cryptocurrencies or investing in them, then you can
    always try to dabble in cryptocurrency mining. As mentioned before, miners are
    always in demand as they are the ones who allow the whole blockchain network to
    function. Since there is no central authority to verify transactions or anything,
    the task falls to them.


    Every blockchain network has to have miners. They use their computers to solve
    complex mathematical problems to verify transactions. As a token of appreciation,
    the miners are awarded a small amount of cryptocurrency. How many coins you get
    from mining depends on the coin.


    We have mentioned `Proof of Work` before, but there are two types of mining. There
    is the `Proof of Work` (`PoW`), and `Proof of Stake` (`PoS`). These two types
    of mining verify transactions and update the ledger using consensus algorithms.


    ### Proof of Work


    To put it simply, the `Proof of Work` consensus model requires miners to solve
    mathematical problems. This is the system for `Bitcoin`, but it requires a lot
    of computational power. What are they calculating for? Miners generate what is
    called “hash”, which turns an input into a random string of letters and numbers.
    The idea is to find the right string to match the target.


    As you can see, the probability is pretty low. However, given how fast computers
    perform these calculations in a given second, it is not impossible. In fact, miners’
    rigs can generate trillions of computations every second. So, it takes them an
    average of nine to ten minutes to find the right one.


    The problem is that it only awards the people who completed the verification first.
    That means, whoever generates the right one first takes the coins, so not everyone
    is a winner here. And you can say that the competition is fair, but it isn’t between
    humans and their abilities. It depends completely on people having better and
    more expensive hardware.


    For instance, there are `ASICs` in the `Bitcoin` network and they are the point
    of controversy. `ASICs` are specialized devices that do a very good job in mining
    coins. They are expensive, sure, but they mine coins at a rate with which no other
    machine can really compete. So, their presence in the ecosystem means that no
    one other than the people who own `ASICs` can make a living off mining coins.


    Then, there are other problems with the system. The first and most obvious one
    would be energy consumption. Mining `Bitcoin` consumes the same amount of energy
    on average as that of Switzerland because of the `PoW` system. As more miners
    join the ecosystem to mine for coins, the energy use is only going to go up.


    Then there is the centralization element of this system, despite the fact that
    cryptocurrencies are all about decentralization. For one, if a mining entity can
    take over `50% +1` of the entire blockchain network’s hash rate, then the owner
    can double-spend, block transactions, or bend the rule temporarily. That is highly
    unlikely for larger cryptocurrencies such as `Bitcoin`, however.


    Sometimes, the problem isn’t concentrated on one individual. The system is somewhat
    centralized because a few mining pools can control up to around 50% of `Bitcoin`’s
    computational power already. As of now, developers are working to alleviate this
    issue.


    ### Proof of Stake


    `Proof of Stake` works by having the miners, in this case “validators”, stake
    some of their `Ether`. That amount would be frozen and cannot be used for anything
    while the validators participate in the proof-of-stake process. When they stake
    their `Ether`, they make themselves available to be chosen to propose a new block
    to be added to the chain.


    The selection process is entirely random, of course. Once chosen, other validators
    attest that they have seen the block. Once enough attestations for the block are
    gathered, the block is added to the blockchain.


    Validators are awarded when they attest to a new block and say that it is accurate
    and it follows the rule. That is it. Then, they would be awarded a small number
    of coins. The one chosen to propose a block would also be awarded.


    Of course, one can easily see how this system can be abused. This is why there
    are punishments in place for breaking the rule. If the validator proposes a block
    with false data history, or transaction, their stake would be slashed and they
    would be banned from the network. But for smaller infractions such as going offline
    when they are chosen to propose a block, there are equally smaller penalties.


    The biggest advantage of `PoS` consensus model is the fact that it consumes less
    energy. In fact, you do not need to worry much about the initial investment in
    hardware or the power bill. This makes this mining method a lot more accessible
    to an average person. You just need a working computer and a solid internet connection.


    The only investment you need to make is to invest a certain amount of crypto to
    be qualified to be a validator. But if it is still too much for you, there are
    even staking pools. These are groups of people who put together their coins and
    this pool would stake on everyone’s behalf. The reward would then be distributed
    proportionally to the percentage of their contribution to the pool. So, you can
    just chip in a little bit of coin and you can get started with them. Just don’t
    expect to get paid much if you only contribute a little bit of coin to the pool.


    This also opens up the door for participation and allows many people a new way
    to generate revenue. Considering that you do not need much to get started in `PoS`-based
    cryptocurrency, many people would jump into mining here. Since everyone is chosen
    to propose and attest to new blocks at random, everyone has an equal chance to
    earn their keep.

    '
