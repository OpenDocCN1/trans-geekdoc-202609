- fmt: '

    The case with the `TOR` browser that allows you to access the Dark Web shows why
    anonymity has to be accessible for everyone or no one at all. The `TOR` browser
    is intended to be used by United States officials. It allows them to remain anonymous
    as they conduct their investigation. However, if only they have access to the
    technology, the website’s host would know that an `FBI` agent is checking out
    their website if they see an anonymous user. So, the `U.S.` government is forced
    to release the technology to the public.


    And that is just the sad truth of anonymity. Either no one has it at all or everyone
    has to have it if we want anonymity to work. Unfortunately, that also includes
    criminals. That said, not all cryptocurrencies are equally private.


    For instance, `Bitcoin` is not a good option for illegal businesses. The way the
    `blockchain` network is set up allows digital forensic analysts to track down
    criminals. This happened with the `Silk Road` website in the Dark Web, which was
    basically Amazon for drugs.


    ## Special Considerations


    The entire appeal behind cryptocurrencies is `blockchain` technology, which provides
    a new way to store information. It is used to keep an online ledger of all the
    transactions that happened within the network and recorded everything in chronological
    order. In addition, the ledger is distributed among all the users in the `blockchain`
    network.


    These ledgers are independent of one another, but they would arrive at the same
    conclusion thanks to the consensus algorithm. In other words, the ledgers are
    a way to check and verify each other’s validity so that to alter an entry, one
    needs to alter every entry on the network, which is nigh impossible.


    All transactions are recorded and added to a “block”, which would be added to
    the `blockchain` after it is confirmed by a `miner`. After the block has been
    confirmed, it is impossible to change it unless you alter every block in the `blockchain`.
    That means, it is not possible to forge transaction histories.


    Many experts, though divided on the future of `Bitcoin` and `Altcoins`, all agree
    that `blockchain` technology has a serious potential for other uses where anonymity
    is guaranteed and forgery or fabrication is impossible. That means online voting,
    crowdfunding, etc.


    However, since cryptocurrencies are completely virtual, you can lose your expensive
    coins simply by hardware failure. If you store your coins in your hard drive without
    a backup copy, they are gone if your hardware fails. If you were to lose your
    credit card or forgot your PIN, your bank can restore your access easily. The
    same cannot be said for your crypto wallet since no one else can access it.


    ## Criticism of Cryptocurrency


    The price for every product on the planet is based on supply and demand. High
    supply and low demand mean low prices. Low supply and high demand mean high prices.
    Cryptocurrencies are designed to be scarce so that their price would go up exponentially
    over time if they are successful.


    The perfect illustration of this is `Bitcoin`. `Bitcoin` experienced a “halving”
    back in 2016. This halving is a way to control how much `Bitcoin` would be released
    into circulation. You see, there is a hard cap on how many `Bitcoins` there would
    be in the end. That cap is 21 million `Bitcoins`. New `Bitcoins` are created to
    reward the `Bitcoin miners` and the amount changes after every halving.


    As the name suggests, `Bitcoin` halving is when the flow of `Bitcoin` being released
    into circulation is cut in half. This occurs every four years or so and is a way
    to control the price of the coins. When the halving happens, miners receive only
    half the coins they used to get.


    This, in turn, creates scarcity and drives the price way up. The 2016 halving
    saw the coins going as high as $19,000 each before dropping back down to $7,000.
    However, the price before the halving was much lower than $7,000. In other words,
    just because you receive fewer coins from mining, their worth is more than doubled,
    so it’s a win-win for everyone.


    Other than that, cryptocurrency is controlled by the people. There is no central
    authority to oversee the flow other than what’s been hardcoded in the network.
    That also means that the crypto trading market is highly volatile.


    In foreign exchange or `Forex`, the major financial institutions exert influence
    over a currency’s value trends. So, the retail traders, the ordinary people, generally
    trade alongside the financial institutions in hope that they can cash in on the
    trend. Retail traders only trade in small amounts, so they don’t have any influence
    over the trends.


    In cryptocurrency, there is no central authority. So, people who trade cryptocurrencies
    directly influence their prices. And since there are plenty of people in the system
    hoping to make money off cryptocurrencies, they cause a lot of swings in the price.


    In short, cryptocurrencies are highly volatile and experts agree that this is
    a risky investment option. This is exactly what happened in the 2016 halving where
    people would flock to `Bitcoin`, buy up every coin they could get, and hope to
    sell when the price is at its peak. However, most people who joined the craze
    were not savvy traders and they bought up the coins when the price was already
    at the highest. Many saw their investments going down the drain and refused to
    sell, hoping to catch the next big break that never came. For this reason, cryptocurrencies
    are often regarded as a short-term fad or little more than a speculative bubble.


    Another concern surrounding cryptocurrencies is that they are not tied to any
    material goods. Before the gold standard was obsolete, gold was the store of value.
    Then came fiat currencies, which is money issued by the government and its value
    is tied directly to the government’s economic and political power.


    Cryptocurrencies possess neither of those so their value remains questionable
    to this day. One possible “material good” that cryptocurrencies are tied to is
    the production cost, or the energy and hardware needed to mine cryptocurrencies.


    But there is yet another problem. Mining cryptocurrencies is a power-intensive
    process and the upfront cost can be too steep for many people. You need to have
    a beefy computer or a specialized tool to mine `Bitcoin` efficiently. Mining `Bitcoin`
    is a race, as in whichever miner gets to verify the transaction first would be
    awarded. This is the proof of work system.


    If you’re interested in mining `Altcoins` such as `Ethereum`, you might have a
    better shot since some cryptocurrencies use a different method called `proof of
    stake`, where you stake some of your coins to show your willingness to verify
    the transaction. Everyone gets their fair share of work, even the small-timers,
    and everyone is happy.


    Power consumption is a serious issue and mining crypto is not helping the issue
    here. At first, people used graphics cards and processors to handle the mining.
    But these tools are not optimized for the job since they are created for other
    purposes.


    The `Bitcoin` craze created a market that arguably left everyone worse off. Certain
    tech companies such as `Nvidia` started creating dedicated `GPU` for miners. It
    is a `GPU` with no output port and is intended to be used for mining. The problem
    with this move is that it puts more strain on the global supply of silicone and
    chips, which is already stretched thin as it is. This affected even car manufacturers.

