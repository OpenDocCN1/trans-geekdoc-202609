    We have mentioned this a bit earlier. Both of these are horizontal lines that
    you can draw on your trading chart to better understand the price movement for
    that particular coin. Some would argue that it would be better to see these levels
    as areas rather than lines. Some trading software allows you to draw a line, but
    if yours doesn’t have that feature, you can just eyeball it.


    ### Support and Resistance


    The support level is basically a price floor. You can see this with the candlestick
    and the trend line. They never drop below a certain point. They get close to it
    a few times, but never below it. That would be your support level. This is the
    perceived lowest price point for that coin and this is usually where a lot of
    traders would buy in. This will either stop the coin price from going even further
    down or reverse the trend entirely and jumpstart an upward trend.


    The resistance level is the opposite. It is a line or an area where prices just
    would not go any higher. This is an indication that buyers feel that the price
    is already quite high, so they are not going to buy into it anymore. This also
    means that buyers are tempted to sell off their coins because the prices are as
    good as they can get, therefore increasing supply and drive the price back down.


    When the price reaches either of these levels, it is testing the line. The more
    it is tested, the weaker it becomes. Support and resistance levels are not permanent,
    however. Prices will break through these levels eventually and will end up establishing
    new support and resistance levels.


    A few key indications of the trend’s strength include a breakout of either support
    or resistance levels. Sometimes, the resistance level can become the new support
    level or vice versa, which further reinforces the strength of the current trend.
    Of course, a false breakout, or a fakeout, can also occur. Sometimes, a fakeout
    can occur at such a magnitude that it triggers your stop-loss or take-profit,
    much to the frustration of traders. Because of that, traders are advised to put
    their stop-loss and take-profit a little bit further and to look at different
    indicators to help them define trends.


    ### Trading Volumes


    Trading volumes also help the trader know whether a trend is significant. If there
    is a high trading volume, it means that the trend is significant. On the other
    hand, if there is a low trading volume, it means that the trend is weak and will
    pass by quickly.


    So, check the trading volume if there is a drop in price for the coin. You want
    to check if there is low volume if the price drops and high volumes if the price
    goes up. That means there is a healthy trend going on with long-term growth. But,
    if the trading volume goes down during an upward trend, that means the trend will
    end soon. The opposite applies to downtrends.


    ### Market Caps


    You can look at the market cap to give you an idea of a coin’s stability. Normally,
    the larger the market cap is for that cryptocurrency, the more stable it is. Calculating
    the market cap is pretty simple if your exchange does not provide it to you already.
    You just take the number of coins in circulation and multiply it by their current
    price.


    ### Relative Strength Index


    You can only get so far with eyeballing the charts, looking at the candles, and
    following the trend lines. Sometimes, you would need to use indicators, and there
    are a lot to choose from. One of them is called the `RSI` indicator, or relative
    strength index indicator.


    There is a bunch of math involved here. Luckily, you don’t have to crunch numbers
    since most platforms do that for you. You can enable the `RSI` indicator on the
    charting software. It is displayed as a line or two lines, on the spectrum from
    0 to 100. If the `RSI` is at 30 or lower, that means the crypto is undervalued
    and the price is likely to go up very soon. If the `RSI` is 70 or above, that
    means the crypto is overvalued, which may indicate that people would start to
    sell off their coins, and the price would drop very soon.


    ### Moving Averages


    There is an indicator for this as well. As the name suggests, a moving average
    is the crypto’s average price over a certain period. The default calculation is
    based on the trading prices of the coin in the last 20 days. You can draw a line
    with the moving averages to help you make predictions about future price movements.


    Most traders use an exponential moving average indicator to help them trade. `EMA`
    involves a little more math since it is more sensitive to recent price movements.
    You can use different moving averages at the same time, over different time frames.
    For instance, if one short-term moving average crosses over a long-term moving
    average, that could mean that an upward trend is imminent.


    ### Time Frame


    Then, there is also the time frame to consider. There is a lot to choose from
    such as one, five, fifteen, and 60 minutes, all the way to 24 hours and more.
    You should choose your time frame based on the way you trade.


    For instance, if you are a day, intraday, or short-term trader, you should close
    all your positions within the day. That means, you should select a shorter time
    frame than 24 hours. Many traders would opt for 5, 15, or 60 minutes. You might
    be able to work with a larger time frame, but it is not recommended.


    Long-term traders usually can afford to keep their positions open for a long time.
    This can be as long as several years. For this reason, long-term traders are better
    off looking at larger time periods such as 4 hours, 24 hours, or weekly charts.


    ## FACTORS THAT INFLUENCE INVESTMENT


    It is also worth noting external factors that can change the price of your cryptocurrency.
    Given how volatile it is, a single event can negatively impact your investment.
    So, it pays to keep an eye out for a few things and get ready to take action when
    something happens. So, what should you look out for?


    ### Government


    As of now, governments across the globe do not have a uniform view of cryptocurrencies.
    Some of them are working to regulate cryptocurrencies whereas others outright
    them. Many jurisdictions are still on the fence about the matter and whichever
    stance they take can influence the price of your digital asset. For instance,
    if a government decided to ban cryptocurrency or impose heavy tax on it, users
    in that country would be discouraged from using it and its price would drop. If
    a government accepts crypto, there may be more users coming into the market, which
    would drive prices up.


    ### Financial Institutions


    Major financial institutions such as banks and credit card companies are still
    your money outlet when you want to get coins from your cash. Therefore, they are
    among the most powerful players that influence the future of cryptocurrency. If
    they decide to co-exist with crypto, or even better, integrate crypto into their
    banking systems, then crypto’s values would rise significantly. However, if they
    go out of their way just to stifle crypto’s growth, then its price would suffer
    accordingly.


    ### Businesses


    Major and popular companies or businesses that adopt crypto payments can also
    increase the value of cryptocurrencies across the board. That can be a restaurant
    chain, a hotel, or online retailers. Their inclusion of crypto payment would help
    legitimize cryptocurrency for customers.


    ### Trading Platforms


    Then, there are the platforms that offer traditional assets such as stocks or
    forex. If they announce that they would also deal in crypto trading, this would
    promote cryptocurrencies to their users.


    ### Crypto Economy


    The above are factors outside the cryptocurrency sphere. In the crypto world,
    several things can alter the price of a certain cryptocurrency. That could be
    a successful cyberattack, a new cryptocurrency that positions itself as a direct
    competitor to the coin you are investing in, etc.

