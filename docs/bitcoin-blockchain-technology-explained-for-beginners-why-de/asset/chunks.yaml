- fmt: '

    Another thing to consider is your experience and overall competency. The idea
    here is that you should focus on your strengths. For this, you should ask yourself
    what coins and tokens do you research, what sector or industry you are most familiar
    with, and what you understand better between utility tokens or security tokens.


    As mentioned before, everyone has to start somewhere, and there is no better place
    to start than familiar grounds. It would work best for you and you can build up
    competency. In doing so, you can learn to call the shots and maximize your profits.


    ## How to Get Started


    There are a number of strategies that you can use to diversify your portfolio.
    This is why we went to great lengths to explain what each `Altcoin` does in the
    last section. Your strategy here involves looking at what the `Altcoin` provides
    and how it goes about doing it. With this in mind, there are a number of strategies
    to go over.


    ### Industry Diversification


    The idea is simple. You just look at what industry the `Altcoin` is catering toward
    and try to diversify by investing in `Altcoins` in as many industries as possible.
    So, when an industry takes a hit, your portfolio can survive the blow. Some of
    the main industries that `Altcoins` fall into include finance, medical, supply
    chain, data and data analysis, and innovation (such as `AI` or `machine learning`).


    You can also take it up a notch by looking within each industry and diversify
    your investments again based on the projects behind the coins. That means, you
    can support well-established projects, emerging projects, those that solve existing
    problems, or those that bring innovation.


    From here, it is up to you how you want to invest. Each sub-strategies above have
    their own risks and strengths. That said, you should never invest in a project
    that you do not know much about. This is even more so if you do not understand
    their values or the industry they are operating in.


    As always, do your own research. More often than not, you can find most information
    on the project’s page. If it’s filled with jargon and complex languages, chances
    are that it’s a bad investment.


    ### Solution Method


    The second strategy depends on the kind of solution or products the `Altcoin`
    provides. That would involve looking at how the blockchain for that `Altcoin`
    works. Some would provide new tools or services such as digital wallet, a `dApp`
    development platform, a new protocol, etc.


    Not all business ventures would work out. Not all solutions would end well. So,
    spreading your investment this way would mitigate the risk as well.


    ### Types of Cryptocurrency


    As mentioned before, there are four types of cryptocurrency. Mining-based, `stablecoins`,
    `security tokens`, and `utility tokens`. Because each type of cryptocurrency has
    its own strengths and weaknesses, by spreading your investment this way, you can
    also minimize risks.


    You can also categorize cryptocurrencies into five groups: transactional tokens,
    smart contract tokens, yield-earning tokens, utility tokens, and `stablecoins`.
    Transactional tokens are coins that are used up in transactions, like `Bitcoin`.
    Smart contract tokens are protocols that allow developers to create `dApps` on
    their blockchain network, run `smart contracts`, etc. Yield-earning tokens are
    basically `security tokens` gained by funding projects and earning dividends so
    that you can get more coins than you put in.


    That said, make sure to look at the different possibilities and how you want to
    spread your investments around.


    ### Geographical Diversification


    Finally, invest in coins based on different regions. `Asian` `blockchain` projects
    are particularly popular since it covers a good chunk of the globe. But you can
    also think about investing in projects based in `America` and `Europe` as well
    to have a geographically balanced portfolio.


    ### Time Diversification


    Another way to diversify is through time. The idea is that you do not invest all
    your money outright. Instead, you would just invest over time. If you have `$100,000`
    to invest, you don’t go all in. You just put in `$5,000` every month, over 20
    months, and see where the wind takes you. In doing so, you limit the risk of having
    to time your entry into the market to make the best return on investment.


    Let’s say that you started investing in `Bitcoin` starting in `January`. You put
    in `$5,000` every month and you didn’t care much about the price movement. You
    just spent that five grand on however many `Bitcoins` it can buy. Six months later,
    you would have put in `$30,000` into `Bitcoin`. But let’s say that the price moves
    favorably and the price for `Bitcoin` increases. Then, you can exit the market
    with more than `$30,000`.


    But what would happen if the price dips? Then your investment would take a hit
    and you end up with less money than you put in. That is not so good. But this
    is the risk with trying to time the market. At least, by diversifying through
    time, you would not lose a lot of money.


    If you put in all your money upfront and the market goes sour, you could lose
    everything. At least with this strategy, you only stand to lose some cash, so
    the damage is contained.


    ## The Four-Step Diversification Strategy


    Finally, we have this four-step strategy. There is nothing super specific in this
    strategy other than the fact that you would group the coins loosely based on how
    they can provide you value.


    ### The Foundation


    The first part of your portfolio should consist of some core cryptocurrencies
    such as `Bitcoin`, `Ethereum`, and `XRP`. These should make up from 10 to 25 percent
    of your portfolio because of their inherent values. `Bitcoin` is the digital gold.
    `Ethereum` is the most popular cryptocurrency thanks to a myriad of features it
    provides. `XRP` is a payment network. Each of these three coins has specific and
    separate use cases.


    ### The Passive Earners


    Once you have the foundation laid out, consider branching out to `Altcoins` that
    generate money for you passively, literally. Mining is not passive income in this
    context because you need to put your computer to work. Passive earners here refer
    to `security tokens`, `yield-earning tokens`, or interest-bearing coins (they
    are the same thing) that would generate revenue for you by the virtue of you having
    the coins in your possession.


    Other than their inherent values, these tokens would distribute dividends monthly,
    quarterly, or bi-annually. `Stellar`, `Bankera`, and `NEO` are good examples here.
    Although `NEO` is the most popular out of the bunch, `Stella` is almost criminally
    underrated and is worth looking into.


    Another form of passive income from coins is `airdrops` and `hard forks`. `Adrops`
    are similar to pre-mined coins in the sense that the developers would just give
    away free coins. The difference here is that `airdrops` are done as a marketing
    maneuver. `Hard forks` are also beneficial since the developer of the newly created
    coin usually gives people the same or equivalent amount of coins if they migrate
    to the new cryptocurrency.


    With a good selection of passive earners, you would start to earn coins and money
    just by holding onto them. This would form the launch pad to propel you into newer
    and potentially riskier investing ventures that might yield better rewards down
    the line.


    ### The Anchor


    The crypto market is notorious for its volatility. For this reason, you want to
    have something to fall back to when the sea is getting choppy and you see dark
    clouds on the horizon. For this, you want to have `stablecoins` in your portfolio
    to help you weather the storm. Pax, `USDC`, `TrueUSD`, and `Tether` are some good
    options here since they are tied to fiat currencies.

    '
