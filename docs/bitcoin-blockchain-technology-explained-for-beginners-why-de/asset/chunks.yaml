    Cryptocurrency is a new front for many CPAs and so many of them do not have a
    clue about it. When you are gauging their general familiarity, ask whether they
    own any cryptocurrency themselves. If they say yes, then that means they at least
    know their way around cryptocurrency.


    However, if the answer is no, then ask them if they have any past experience with
    clients who came to them with crypto-related business. Some CPAs do not own cryptocurrency
    because they still have reservations about the future of crypto, and you cannot
    really fault them for that. However, if they have successfully helped cryptocurrency
    clients in the past, then they might still be a good fit for you.


    However, it is worth noting that regulations in the crypto space are very general
    and most of it is subject to interpretation. Most of it is just guidance and might
    not even be binding in the first place. So, taxpayers may report different things
    on their returns based on how much risk they can tolerate.


    That also means that there are no official crypto tax experts right now. Some
    CPAs may have experience in the field because they learn about cryptocurrency
    on the job, but they are as good as they come. These people talk to regulators,
    keep up with the latest crypto tax news, and learn on the job.


    Moreover, good CPAs care about their customers and they value honesty. They can
    tell you about various uncertainties and explain thoroughly how that is the case.
    For instance, staking income may be taxed differently. Some people say that you
    should be taxed upon token sale, not when you got it. Right now, many questions
    would be met with these uncertain answers. If your CPA is upfront about it and
    communicates this fact with you, they know what they are talking about. The know-it-alls
    are to be avoided.


    Finally, ask about their work process. More specifically, how they use technology
    to calculate your gains, losses, and the tax you ultimately have to pay at the
    end. There are plenty of crypto tax programs to help you with that.


    Of course, you might argue here that if CPAs use the software anyway, would it
    not be better if you do it yourself? And you might have a point here. However,
    CPA can confirm whether the tax is the right amount, and an average Joe just cannot
    do that. So, ask your CPA what program or software they use.


    If they say that they do everything manually, as in using a spreadsheet or by
    hand, then this is a huge red flag. Doing calculations manually is time-consuming,
    which will also cost you a lot more money, and the complexity of the crypto space
    plus the fact that your CPA is a human mean that there would be a lot of inaccuracies.
    Tracking your tax manually is an impossible task.


    ### Lawyers


    Having a crypto lawyer is more for the benefit of the company that issues tokens,
    not the people who buy them. A crypto lawyer can help you understand whether the
    token you are about to release would be classified as a utility token or a security
    token.


    You need to get this out of the way before the launch of your `ICO` or `STO`,
    which is why customers usually do not have a need for a crypto lawyer. They already
    know whether the token is a utility token or a security token.


    Ideally, you want to have a lawyer who works on a per-project basis. The charge
    might be chunky per project, but at least your lawyer would be encouraged to get
    the job done as soon as possible. If they charge you hourly, you could feel the
    money slipping away from your wallet as your lawyer works.


    When hiring a crypto lawyer, you need to look for a couple of things. For one,
    they need to have specialized knowledge about the laws of your state since different
    states can have different laws. On top of that, your lawyer should have experience
    in security law as well since security tokens would be subject to it. Finally,
    they need to have comprehensive knowledge of cryptocurrency, for obvious reasons.


    8 ![](Images/svgimg0003.svg)


    # GETTING TECHNICAL WITH INVESTING


    As you might have guessed, investing is a whole can of worms to get into. There
    are many nuances and caveats that you need to understand before you can consider
    yourself a mildly competent trader. The investment world is complex, which goes
    to show why many people decided to give up and pursue something a little less
    boring.


    You can do what many users on `SatoshiBets` have been doing and just look at the
    charts and buy low and sell high. But there are so many things going on behind
    the curtain that you need to grasp before you can really understand the market.
    So, in this chapter, we will go over the technical side of investing.


    ## START SMALL


    When you are looking to invest in a certain cryptocurrency or project, you need
    to find out a few things about them. For this, there are two analysis models:
    fundamental and technical. We went over these briefly in Chapter 6 and we will
    discuss them in detail here.


    Although the crypto market is unpredictable, you are better off knowing what causes
    prices to rise, fall, or stabilize. With some sound analysis, you can at least
    have a good idea of what to expect. savvy trader would know when to get into the
    market and when to get out.


    ### Fundamental Analysis


    The thing about this analysis model is that it works on all trading vehicles,
    be it crypto, forex, etc. It is compatible with all types of trading. The underlying
    concept is very simple. If you know that an asset has an intrinsic value that
    is higher than its current price, then you trade based on your analysis and make
    profit.


    In other words, if you see projects that have a good chance of success, you want
    to get in early. When you invest and the people behind the project prove their
    capabilities, other investors would notice and jump in on the action. This would
    improve the overall price. For you, that means more profit.


    That is the basic idea behind fundamental analysis method. You just do your research
    to determine whether the investment would increase in the future. But you can
    also profit from the investment becoming less valuable. For that, you would do
    what is called shorting, which we have already covered.


    You might be skeptical about this analysis model since it makes everything so
    simple. But it works out more often than not.


    If you know that the project has future potential and that its future value would
    be much higher than the present, you can buy in right now and ride the upward
    trend toward profit. But fundamental analysis does not only look at the big picture.
    Sometimes, you would need to think of the smaller details as well.


    For instance, back in 2015, crypto developers would rebrand frequently by changing
    the name and logo. Doing so would increase the price for that cryptocurrency.
    However, this soon no longer has any significant impact.


    As a trader, you need to understand how changes like this can influence how a
    project is viewed by market participants. More often than not, it does not really
    matter what you feel about the project. Rather, how the collective, the market,
    feels about it.


    Sometimes, small changes can make a huge impact on the project as a whole. When
    performing fundamental analyses, always keep a lookout for what is happening and
    how the market is going to react to those changes.

