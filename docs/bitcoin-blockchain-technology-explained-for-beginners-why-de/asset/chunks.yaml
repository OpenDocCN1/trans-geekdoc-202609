- fmt: '

    While relatively new to the market, OMG is pretty popular in Thailand, with 240
    McDonald’s branches in Thailand now accepting it as a payment method. This success
    is partially due to the fact that people in Thailand support their own things
    such as the Thailand Baht, Thailand products manufactured locally, etc. So, it
    makes sense that OMG would be successful there as well.


    ## VeChain (VEN)


    VeChain utilizes its robust platform to provide a way to improve the business
    supply chains. With its blockchain, companies can make transactions quickly, up
    to 10,000 every second. On top of that, VeChain also provides transparency by
    allowing businesses the ability to create and store detailed records of transactions
    down to the minute details. Plus, they can store that information indefinitely.


    On top of all that, VeChain is currently working on a microchip verification system
    so that every product on its platform can be authenticated easily, which would
    combat counterfeiting and improve customer confidence.


    Just like OmiseGo, VeChain was developed on the `Ethereum` blockchain network
    and it is still using that. However, the developer is currently developing a new
    blockchain network for itself. This is a viable option since there is enough demand
    and miners in the system that security would no longer be an issue. This migration
    to a new blockchain would mean rebranding `BeChain (VEN)` to `VeChain Thor (VET)`.


    ## NEO (NEO)


    NEO is based in China, which is currently working hard to purge all forms of cryptocurrency
    on the network. Understandably, they want to have full control over their citizen’s
    wealth.


    NEO has an ambitious goal. That is to create and support a new digital “smart
    economy”. Its platform allows developers to create decentralized apps (`dApps`)
    that can make quick and secured transactions using smart contracts.


    Despite the crackdown on cryptocurrencies, NEO still managed to secure enough
    funding to develop and launch its projects. This led some people to believe that
    it has ties with the Chinese government. Whether it is true or not, no one other
    than the two parties know.


    Regardless, NEO’s success will depend entirely on the Chinese government’s policy
    on cryptocurrency going forward. If they decide to completely ban cryptocurrency,
    then NEO’s ambitious goal would go down the drain.


    ## Lisk (LSK)


    Similar to NEO and `Ethereum`, Lisk is a blockchain platform that provides a solution
    to creating `dApps`. What’s the difference then? Lisk puts more emphasis on helping
    developers. You see, the Lisk blockchain ecosystem works a lot like a city.


    Think of the entire blockchain like a city. The main road is the primary blockchain.
    Branching out from this main road are sidechains, which are like avenues. Developers
    are encouraged to create their `dApps` on the sidechains, which consumers can
    use to make transactions. The development costs would be covered by the transaction
    fees and other rewards, meaning that developers are encouraged to keep innovating
    and working on the Lisk ecosystem.


    ## Qtum (QTUM)


    Pronounced Quantum, Qtum is based in Singapore. Its goal is to improve the reach
    and operability of smart contracts for businesses. It offers a solution to make
    transactions quickly, securely, and easily without the need for a third party.
    They aim to do that by combining `Bitcoin`’s stable blockchain structure with
    smart contract technology from `Ethereum`, using a `Proof of Stake` consensus
    model. It is still quite early in its development, but the developers already
    have some ambitious plans to expand by forming new partnerships with many ICO
    projects.


    ## Filecoin


    Filecoin launched its ICO back in 2017 and is one of the most highly anticipated
    Altcoin projects to date, pulling over $257 million in funding. What makes it
    so successful despite the fact that it does not even have an alpha version is
    the strength of its team and the pedigree of the backers.


    So, what is Filecoin striving to achieve that made it so successful? It is a decentralized
    blockchain ecosystem that provides a way to store data securely and efficiently.
    Data breaches are a very costly affair, both in fines and public relations, and
    they happen quite frequently unless you have top-notch security.


    Filecoin utilizes the blockchain bulletproof security to store data, therefore
    minimizing if not outright eliminating data breach risks. For this reason, it
    received backings from some Silicon Valley heavyweight venture capital firms that
    contribute to its massive funding.


    ## Ethos (ETHOS)


    Ethos is based in the United States and is still in development. Their goal is
    to help get cryptocurrency adopted worldwide. For this, they created a platform
    that provides users with a wide range of blockchain-based features designed to
    simplify the storage, management, and exchange of crypto assets.


    Take Ethos’s wallet, for example. It aims to be compatible with any cryptocurrency
    and provides a secure space to store your coins while also allowing you to send
    them anywhere, anytime, instantly.


    Though it is not known when a public version will be available, at least Ethos
    released an alpha version with the beta well on its way. It at least shows that
    they are actively working on the project.


    ## Substratum (SUB)


    If you’ve been on the internet for a while, you might realize how valuable consumer
    data is. Otherwise, companies would not be gathering them. Net neutrality in the
    United States is dead and other jurisdictions on the globe, especially the ones
    with not-so-democratic regimes, are working to monetize, limit, censor, or outright
    block internet access to all sorts of data.


    This created a need for a more democratic, accessible, and most importantly free
    means to share data on the web without any sort of censorship or limitation. This
    is where Substratum comes in. It is an open-source decentralized blockchain network
    meant to give users the ability to share information without any form of restriction.


    This is literally plug and play in every sense of the word. You do not need to
    install any software. You just install it on your browser and you are good to
    go. In doing so, though, your device will participate in the blockchain as a node
    and it will act as another content provider that helps requested information via
    the blockchain. If you do, then you can get some `SUB` tokens as a reward.


    ## EOS Token (EOS)


    EOS is a semi-decentralized digital currency that powers `dApps` and `DAOs`. EOS
    is considered by many to be the direct competitor with `Ethereum`. Just like `Ethereum`,
    EOS developers want cryptocurrency to become the world-leading platform for smart
    contracts.


    At its core, EOS is a lot faster and scalable compared to `Ethereum`. The downside
    is that it has to give up some of its decentralization capability to achieve such
    functionality. In this case, EOS gives control to what is called the `delegated
    Proof-of-Stake` consensus (`dPoS`) and has its own constitution to establish fundamental
    rules on the platform.


    However, EOS is still very new to the whole cryptocurrency game and it has a long
    way to go before it can be considered to be a serious competition to Ethereum.
    For this reason, EOS is not yet widely accepted.


    ## Ripple (XRP)


    Ripple is more like a digital token that can be used for payments. Created by
    `Ripple Labs`, it allows users to make quick cross-border payments in fiat currencies.
    Because of this, XRP is also referred to as the banksters coin. The team at `Ripple
    Labs` designs XRP to be the fastest and most scalable digital asset.


    ## TRON (TRX)


    Tron is a digital currency that is used for digital entertainment and content
    generation. The TRON protocol has a lot of scalability, availability, and throughput
    computing support so that making `dApps` on the TRON ecosystem possible.

    '
