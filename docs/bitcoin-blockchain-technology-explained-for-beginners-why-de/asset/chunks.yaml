    ## INVESTING IN CRYPTOCURRENCY


    A decade ago, around the time when Bitcoin started to make an appearance, if you
    were to tell someone that part of your investment portfolio consists of cryptocurrency,
    people would just laugh in your face. They may even tell you that you have no
    clue how to invest and probably say bad things behind your back.


    After all, you would need around ten thousand Bitcoin to buy a pepperoni pizza
    at Papa John’s. Of course, it would not pass as a viable investment option. But
    that was a decade ago.


    Fast forward to today, and people say that you are late to the game if you haven’t
    invested in cryptocurrency already. They may laugh in your face and say nasty
    things about you if you don’t even know cryptocurrencies or that you have never
    traded Bitcoin, Ethereum, or any coins in your life.


    Whether you want it or not, cryptocurrency is here to stay. It is everywhere and
    more businesses are incorporating it into their payment system. It is no longer
    a conversation among geeks and day traders anymore.


    This is clearly illustrated when PayPal made it possible for their customers to
    buy, sell, and own cryptocurrency, and to use it to buy things at 26 million different
    merchants. Some may ask why, and others may say that it took them long enough.


    According to PayPal, the adoption was hindered by their limited potential as an
    instrument of exchange, citing volatility, cost, and transaction speed. That said,
    they also mentioned that their platform can give people a means to make cryptocurrency
    more accessible as a payment method.


    The CEO of PayPal Dan Schulman said in a press release that the move to digital
    forms of cryptocurrency is inevitable. It is going to happen, but it is just a
    matter of how and when it is going to happen. It will bring various advantages
    that the current financial system could not, such as accessibility, efficiency,
    speed, and resilience.


    This move alone is not insignificant. This push immediately addresses three of
    the major concerns people had with cryptocurrencies for over a decade such as
    legitimacy, a clearly defined and accessible marketplace, and everyday purchases.


    As of now, there is a number of crypto savings accounts to choose from. Soon,
    you could sign up for a Bitcoin rewards credit card, which works mostly similar
    to the reward systems for your bank-issued credit cards.


    This world’s first Bitcoin Reward Credit Card would be provided by BlockFi. They
    said that the reward system here is different in the sense that you get 1.5% back
    on the purchase in Bitcoin. In other words, you effectively get a 1.5% discount
    on all purchases in Bitcoin while the merchant still gets the full amount. This
    would encourage users to start buying Bitcoin and use it to make everyday purchases.


    To top it all off, merchants can also introduce additional discounts on their
    products to encourage users to pay via cryptocurrency. Since the transaction cost
    is lower, merchants have a little more wiggle room to allow special discounts,
    which further encourages people to start paying with cryptocurrencies.


    As of now, BlockFi’s credit card is still on the waiting list. We do not have
    an exact date for its eventual release yet, but this is another push into getting
    cryptocurrencies widely adopted.


    So, what does all of this mean? It means that more and more businesses are finding
    more ways to make cryptocurrency useful. In other words, cryptocurrency could
    become mainstream in the near future. That said, should you invest in cryptocurrency?
    Opinions are divided still and the answer varies depending on who you ask.


    **Why You Should Consider Investing in Crypto**


    The Associate Director of Product Management at Gemini Claire Lovell said that
    Bitcoin has reached an all-time high, just like it did in 2016. The difference
    that suggests the price will not crash this time around is the fact that financial
    institutions and businesses are now working to find ways to incorporate cryptocurrencies
    into their payment systems.


    Lovell said that cryptocurrencies give people higher levels of independence, opportunity,
    and choice in their finances. Cryptocurrency provides a decentralized and open-source
    financial system that addresses many shortcomings that our current financial systems
    have by making it accessible directly to consumers. In simple terms, it means
    it is easier than ever to buy, sell, store, and trade.


    The fact that cryptocurrency is still in its infancy works as an argument for
    and against it. Critics will say that it has yet proven itself to be a reliable
    store of value and that it would fade into obscurity very soon. They would say
    that it is just a fad. On the other hand, this presents a unique opportunity for
    investors. If you invest in cryptocurrency now, even though the price is high,
    you would be among the first adopters. The price could still go up even higher,
    so you can cash in at the top and make bank.'
