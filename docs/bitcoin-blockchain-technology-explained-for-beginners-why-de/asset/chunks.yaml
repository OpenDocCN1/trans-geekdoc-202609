- fmt: '

    Inasing how many coins you stake is also interesting. For Ethereum at least, the
    starting cost would be 32 ETH or Ether. Staking this many Ethers would give you
    “one” validator. If you want to stake more, you need to dump in another 32 ETH,
    which would give you another validator. You cannot stake 33, or 34, or 63 ETH.
    You need to do it in multiples of 32, each of which gets you one validator. If
    you have multiples of validators, your chance increases accordingly. Having 10
    validators boosts your chance of being picked tenfold compared to having only
    one validator.


    This is also another reason why staking pools are popular. People chip in bits
    of Ether and the aggregate Ether the pool has can get them many validators. This
    means, a staking pool can have tens or even hundreds of validators running at
    the same time, which massively improves the chance for the pool to get picked.


    ## Mining Hardware


    We have mentioned mining hardware before, so what is that? Actually, it can be
    a simple computer that you already have at home or a purpose-built machine that
    can churn out coins at an alarming rate. We went over this in the previous book,
    so check that out for more details. But here is a quick refresher.


    There are a number of ways to mine cryptocurrency. You have `CPU mining`, `GPU
    mining`, `cloud mining`, and `ASIC mining`. The first two just utilize computer
    hardware that you already have and the last two make mining a bit more interesting.


    ## CPU Mining


    Let’s start with `CPU mining`. `CPU mining` simply uses your computer processor
    to mine cryptocurrencies. It was initially the best way to mine cryptocurrencies.
    But, as the technology improved and a better understanding of cryptocurrencies
    was established, this quickly became obsolete.


    This is for two main reasons. The first is that `CPU mining` is just super slow.
    You can actually leave it running for months on end without making any tangible
    revenue. That’s how bad it is. Then, there is the problem of electricity and cooling.
    Your `CPU` can heat up very quickly though, and if you subject it to crypto mining
    without some beefy cooling, you can cook an egg on it after leaving it running
    for 15 minutes.


    That said, at least `CPU mining` is the most accessible option since every computer
    comes with a `CPU`. So, if you really want to, and it is highly ill-advised to
    do so, you can start crypto mining using your `CPU`. You just need some software
    to get started and you are set. `CPU mining` will get you started, but chances
    are that it won’t get you off the ground any time soon.


    ## GPU Mining


    `GPU mining` is possibly the most popular crypto mining method today. This is
    because `GPU rigs` can churn out coins at a respectable speed without spending
    too much on them. A quick Google search for cryptocurrency mining and chances
    are that you will find `GPU rigs` among the top results.


    `GPU mining` is far more efficient and cheaper than `CPU mining`. Of course, the
    initial investment in a `GPU mining rig` can be costly, but it can process a lot
    more than your computer’s processor alone.


    `GPU rigs` consist of a motherboard, a processor, a rig frame, a cooling system,
    and some graphic cards. Some could have a modest number of two `GPUs` whereas
    others pack eight of them inside the frame.


    A decent `GPU mining rig` would set you back around $3,000. This might be a hefty
    investment, but keep in mind that it will pay itself a lot faster than a `CPU
    rig`. If you are looking to get serious about crypto mining, this is a great place
    to start.


    It is also worth pointing out that certain graphic card companies such as `Nvidia`
    are pushing out graphic cards that are built for mining alone. You can tell if
    it is a mining graphics card if it does not have a port for display output.


    The introduction of a new line of mining graphics cards caused outrage among gamers
    who are looking to upgrade their computers. The problem here is that, at the moment
    of writing, there is a global shortage of chips that are needed to build `GPUs`.


    `Nvidia`’s `3000 series` of graphics cards are already snatched up by scalpers
    who would resell them at marked-up prices. So, the supply for those graphic cards
    is already running low. Instead of putting more supplies into manufacturing more
    graphics cards, `Nvidia` decided to create mining graphic cards instead with the
    little supply they had. This is seen as a move to latch onto the latest cryptocurrency
    trend and people are not very happy about it.


    `Nvidia` is also working to discourage people from using their latest `3000 series`
    graphic cards to mine by simply reducing the hash rate, which basically slows
    down the mining speed of those cards. So, if you are in the market for mining
    graphic cards, make sure to look at the hash rate.


    ## Cloud Mining


    But let’s say that your computer sucks. Your `Intel` processor from the early
    2000s can’t run the latest `Windows Media Player`, `Google Chrome`, and `Microsoft
    Word` at the same time without it reaching boiling temperature. You also happen
    to be in a bad spot and don’t have enough money to spare for a mining rig. Yet,
    you want to get into the crypto mining game. What are your options?


    There is `cloud mining`. It is the most popular way to mine cryptocurrencies with
    little to no effort on your part. The idea is simple. Some people who have a lot
    of money decided to make a business out of mining cryptocurrency. So, they bought
    up a bunch of `GPU mining rigs` and let people borrow them to mine cryptocurrencies.
    It’s that simple.


    Many `cloud mining companies` normally have massive mining facilities with multiple
    farms located in areas where power is cheap. Their farms usually have hundreds
    of `GPU rigs` stacked and working simultaneously. The people maintaining the farms
    and offering `cloud mining services` are tech-savvy and know full well how to
    mine cryptocurrencies.


    Given the fact that you can just borrow their rig, it is not hard to see why it
    is as popular as it is today. If you don’t have enough money, your computer is
    just inadequate, or you are not interested in owning a mining rig, then `cloud
    mining` is your best bet. All you really need is some cash and an internet connection.


    `Cloud mining` can be free if you use certain providers. You might think that
    it would be a better deal, but it usually comes with slow mining speeds, extra
    conditions, etc. Plus, they are designed in a way that you would be familiar with
    their platform and is more willing to pay to get better service from them.


    Your `cloud mining provider` should provide plans going from the cheapest to the
    most expensive one, with different perks. You are looking to pay anywhere from
    $500 to $5,000.


    It might sound expensive, and it kind of is. You do not own the mining rig permanently.
    There is a term and it usually lasts a few years. You might get a lifetime deal
    with your provider too, but you might have to fork over some extra cash for that
    to happen. Such is the price for convenience.


    Speaking of price, how would you get paid? You just have to register an account
    with your provider, pay them, and put in your cryptocurrency wallet code, and
    you are good to go. Throughout your rental period, all the earnings that your
    rig generates would be sent to your wallet. At least, the remaining value after
    electricity and maintenance costs are deducted.


    On average, it is expected that `cloud mining` would pay itself in about six months
    to one year. From that point, you start to rack up profit. But this is just an
    average estimate since the prices for coins tend to fluctuate.


    ## ASIC Mining


    Finally, we have `ASIC mining`. `ASIC` is `Application-Specific Integrated Circuit`.
    These are special devices created specifically to mine cryptocurrency. These are
    the most powerful rigs to mine cryptocurrencies. They are so fast that they leave
    `GPU` and `CPU rigs` in the dust.

