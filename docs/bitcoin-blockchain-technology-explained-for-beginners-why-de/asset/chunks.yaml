  trans: '


    质押多少硬币也是很有趣的。至少对于以太坊而言，起始成本是 32 ETH（以太坊）。质押这么多太坊将为你提供“一个”验证者。如果你想质押更多，你需要再投入 32
    ETH，这将为你提供另一个验证者。你不能质押 33、34 或 63 ETH。你需要以 32 的倍数进行，每 32 个就能获得一个验证者。如果你有多个验证者，你的机会也会随之增加。拥有
    10 个验证者使得你被选中的概率是仅拥有一个验证者的十倍。


    这也是质押池流行的另一个原因。人们投入少量的以太坊，池汇聚的以太坊可以让他们获得许多验证者。这意味着，质押池可以同时运行几十甚至上百个验证者，这极大地提高了池被选中的概率。


    ## 挖矿硬件


    我们之前提到过挖矿硬件，那么它是什么呢？实际上，它可以是你家里已经拥有的简单电脑，也可以是可以以惊人速度产生硬币的专用机器。我们在上一书中介绍过这一点，请查阅该书以获取更多细节。但这里有一个快速的复。


    挖掘加密货币有多种方法。你有`CPU 挖矿`、`GPU 挖矿`、`云挖矿`和 `ASIC 挖矿`。前两种仅利用你已经拥有的计算机硬件，而后两种让挖矿变得更有趣。


    ## CPU 挖矿


    让我们从`CPU 挖矿`开始。`CPU 挖矿` 简单地使用你的计算机处理器来挖掘加密货币。它最初是挖掘加密货币的最佳方式。但随着技术的进步和对加密货币更深入的理解，这很快就过时了。


    这主要有两个原因。首先是`CPU 挖矿` 速度太慢了。你实际上可以让它运行几个月而产生产生实质性的收益。就是糟糕到这种程度。然后，还有电力和冷却的问题。你的
    `CPU` 加热非常快，如果你在没有强力冷却设备的情况下让它进行加密挖矿，在运行 15 分钟后，你可以在上面煎一个鸡蛋了。


    尽管如此，至少`CPU 挖矿` 是最容易获取的选项，因为每台电脑都配有 `CPU`。所以，如果你真的想尝试（尽管非常不建议这样做），你可以使用你的 `CPU`
    开始加密挖矿。你只需要一些软件就可以开始并就绪。`CPU 挖矿` 会让你入门，但很可能在短期内无法让你取得性进展。


    ## GPU 挖矿


    `GPU 挖矿` 可能是目前最流行的加密挖矿方法。这是因为 `GPU 矿机`（GPU rigs）可以以可观的速度产生硬币，而不需要花费太多钱。在 Google
    上快速搜索“加密货币挖矿”，你很会在搜索结果中看到 `GPU 矿机`。


    `GPU 挖矿` 比 `CPU 挖矿` 效率得多且更便宜。当然，`GPU 挖矿机` 的初始投资可能很贵，但它处理的内容比单靠你的计算机处理器多得多。


    `GPU 矿机` 由主板、处理器、矿机框架、冷却系统和一些显卡组成。有些可能只有少量的两个 `GPU`，而另一些在框架内装了八个。


    一台不错的 `GPU 挖矿机` 大约要花费你 3,000 美元。这可能是一笔巨额投资，但请记住，它的回本速度会比 `CPU 矿机` 快得多。如果你正考虑认真对待加密挖矿，这是一个极佳的起点。


    同样值得注意的是，某些显卡公司（如 `Nvidia`）正在推出专门为挖矿而设计的显卡。如果一张显卡没有显示输出端口，你就可以判断它是一个矿用显卡。


    新系列矿用显卡的引入引起了想要升级电脑的游戏玩家的愤怒。这里的问题是，在写此时，全球制造 `GPU` 所需的芯片处于短缺状态。


    `Nvidia` 的 `3000 系列` 显卡已经被黄牛抢购，他们将以加价的价格进行转卖。因此，这些显卡的供应已经非常低。`Nvidia` 并没有将更多供应投入到制造更多显卡中，而是决定利用其手中仅有的少量供应来创建矿用显卡。这被视为一种追逐最新加密货币趋势的举措，人们对此并不非常开心。


    `Nvidia` 还在通过简单降低哈希率来阻止人们使用他们最新的 `3000 系列` 显卡进行挖矿，这基本上减慢了这些显卡的挖矿速度。所以，如果你正在购买矿用显卡，务必查看哈希率。


    ## 云挖矿


    但假设你的电脑很烂用。你那台 2000 年代初的 `Intel` 处理器无法同时运行最新的 `Windows Media Player`、`Google Chrome`
    和 `Microsoft Word` 而不达到沸点温度。你恰好处于一个困境，没有足够的资金购买矿机。然而，你又进入加密挖矿的游戏。你会有什么选择？


    有`云挖矿`。它是挖掘加密货币最流行的方法，你只需要付出很少或毫不努力。想法很简单。一些很有钱的人决定把挖掘加密货币作为生意。所以，他们购买了一大堆 `GPU
    矿机` 并让人们租用它们来挖掘加密货币。就是这么简单。


    许多`云挖矿公司`通常拥有巨大的设施，在电力廉价地区设有多个矿场。他们的矿场通常有成百上千的 `GPU 矿机` 堆叠并运行。提供云挖矿服务的人通常精通技术并非常了解如何挖掘加密货币。


    鉴于你可以租用设备，很难理解为什么它现在如此流行。如果你没有足够的资金，或者电脑性能不足，或者对拥有矿机不感兴趣，那么`云挖矿` 是你的最佳选择。你真正只需要一些资金和网络连接。


    `云挖矿` 在某些提供商那里可以是免费的。你可能认为这是一个更划算的交易，但通常伴随着缓慢的挖矿速度、额外的条件等。此外，他们设计了从最便宜到最贵的方案，带有不同的益处。你可能需要支付
    500 到 5,000 美元。


    这听起来可能贵，而且确实如此。你并不永久拥有矿机。它有一个期限，通常持续几年。你可能从提供商那里获得终身交易，但你可能需要支付额外的资金。这就是便利的代价。


    说到价格，你是如何收款的？你只需要在提供商处注册账户，付费并输入你的加密货币钱包代码，就可以了。在租赁期内，你的设备产生的所有收益都会发送到你的钱包。至少是扣除电力和维护成本后的剩余价值。


    平均而言，预计`云挖矿` 在六个月到一年内回本。从那时起，你就开始积累利润。但这只是一个平均估计，因为硬币价格往往会波动。


    ## ASIC 挖矿


    最后，我们有`ASIC 挖矿`。`ASIC` 是`专用集成电路`。这些是专门为挖掘加密货币而创建的特殊设备。这些是挖掘加密货币最强大的矿机。它们非常快，让
    `GPU` 和 `CPU 矿机` 望尘莫及。


    '
- fmt: '

    Now, you might be wondering why aren’t they are popular as GPU rigs if they are
    so good. That is because it is just too good.


    When the `ASIC` company announced the introduction of their mining rig, there
    was an uproar among those in the crypto community. They wanted these things banned
    because they are so powerful that other miners just have no way to compete. That
    means `ASIC` owners can hoard all the coins because other miners just cannot keep
    up with the high hash speeds.


    Think of it this way. If the majority of earnings just go to a few miners who
    have enough money to build an `ASIC` farm, what kind of chaos do you think would
    ensue? Not only that they have all the coins to themselves, but they can also
    potentially control the cryptocurrency blockchain network as well since they can
    verify over 50% of all transactions on the network and therefore could technically
    control the entire network.


    Although, nowadays, the general sentiment around `ASICs` isn’t that harsh anymore
    and it is slowly becoming more affordable. In fact, more and more people are migrating
    to using `ASICs`. There are many `ASIC` devices out there with specific tasks.
    This is its strength and also weakness.


    You see, `ASIC` devices are built to mine a specific coin. Depending on how they
    are designed, they can either mine a number of different coins or only one coin.
    It all comes down to the algorithm it uses. So, if your `ASIC` miner can only
    mine a cryptocurrency, but then there is an update to the mining algorithm, then
    you end up with a very expensive paperweight with no resale value.


    `ASIC` miners also consume quite a lot of power, even the most efficient device,
    can run pretty hot and loud as well. The upfront expense, niched application,
    and lack of resale value make it a difficult recommendation as a mining rig.


    For GPU mining rig, you can at least use the graphic cards for your computer when
    you are done mining or resell it to gamers out there looking to upgrade their
    computers. You cannot say the same for `ASIC` miners.


    There is another danger on the horizon, though. Some people are starting to mine
    cryptocurrencies other than `Bitcoin`. More specifically, they are flocking toward
    `Ethereum` because of its updated consensus model, to a `Proof of Stake` (`PoS`)
    system, which does not require much computing power to mine. That means, less
    power is consumed and less money is spent on a pricey mining machine.


    But perhaps this would create an opportunity for `Bitcoin` miners who have `ASIC`
    mining rigs because there are fewer competitors and they can start to rake in
    profit when people start to migrate. Only time will tell.


    ## What Cryptocurrency to Mine?


    As mentioned before, you want to squeeze as much value out of your mining rig
    as possible. That means mining the right coins so you can sell them off and make
    bank. But what coins to mine?


    Well, that’s easy. You go for the most valuable coins to mine. That means `Bitcoin`,
    `Dash`, `Ethereum`, `Litecoin`, etc. Just go to `Coinbase` or `Binance` and look
    at the most valuable coins on the list. That should give you a good idea where
    to start mining.


    Another interesting thing to note is what rig you use to mine cryptocurrency.
    For instance, if you have a mining rig or got yourself a deal with a cloud mining
    service provider, you can definitely start mining `Bitcoin` as they use the `PoW`
    consensus model. That said, mining `Bitcoin` is probably going to be difficult
    since it is so popular that everyone wants a piece of that `Bitcoin` pie. Miners
    across the globe would go into the few mining pools on the network and try to
    snatch a small amount of coin. You might have to wait for hours until you start
    to see the first `Bitcoin` trickle in.


    However, if you are not interested in owning and maintaining a rig or cannot afford
    one, you can look for coins that use the `PoS` consensus model. `Ethereum` would
    then be the perfect option, but you want to hold onto that thought for now since
    they are still undergoing a renovation. `Ethereum 2.0` would incorporate the `PoS`
    consensus model into their network and it is set to fully launch in 2021 or 2022,
    so keep an eye out and jump in once everything is set up. This is probably your
    best bet.


    Now, you might be wondering what if you go for the less popular coins and start
    mining them since there would be fewer competitors. You can definitely do that
    and you can perhaps churn out quite a number of coins without using up too much
    energy. The problem then would be the coin prices.


    `Bitcoin` alone takes up over 50% of the total market cap and is worth over $55,000
    for each coin. `Ethereum` comes in second place with only over $2,000 for each
    coin. You can clearly see the price disparity between the two coins and it only
    gets lower the further you go down the list.


    And maybe you can tolerate the low price. So long as you make a lot of coins,
    you can still rake in all the profit anyway. But then there is the problem of
    power consumption, time, and security to consider, depending on whether the cryptocurrency
    uses the `PoW` or `PoS` consensus model.


    In a cryptocurrency that uses the `PoW` consensus model, you would need to consider
    power consumption since your device would need to perform a lot of calculations.
    The problem with mining small cryptocurrencies with this consensus model is that
    there aren’t many transactions here, so chances are that you won’t be making a
    ton of coins every second.


    You might still be making more coins than `Bitcoin`, but their cumulative value
    would be very small and you might have problems selling them off. Because, again,
    the coin you are mining is not popular so there will not be many people who would
    want to trade these coins.


    Again, you might be fine with that. So long as you get to dump all your coins
    off eventually, that would be okay. But then there is the power bill to consider.
    Unfortunately, although the coins are cheap and you can mine a lot of them, your
    miner would still run at full power and consume a lot of energy. The coins you
    make are most likely not to cover even the power bill, let alone generate a profit
    for you. For this reason, you want to make the most out of your power consumption
    by mining more popular cryptocurrencies.


    But what about the cryptocurrencies that use `PoS` consensus model? For that,
    power consumption will not be an issue. Time could be an issue since everyone
    is chosen randomly, but you can also increase your odds of being picked by getting
    more validators. Since there aren’t many people around and that cryptocurrency
    is cheap, you do not have to spend much in order to stand a good chance of getting
    picked. But then there is the security problem.


    We need to understand that the blockchain networks that power popular cryptocurrencies
    are virtually impenetrable because of the sheer number of users on the network.
    As mentioned before, each user and miner would be given a ledger that updates
    itself from the rest. These ledgers check and validate each other’s data to ensure
    that there won’t be any counterfeiting. The alteration of data is only possible
    when someone controls a majority of the node.


    In popular `PoS` cryptocurrencies, this is not possible because of the number
    of users and validators on the network. It would require way more money than you
    think to take over the blockchain that way. It is very much possible with not-so-popular
    cryptocurrencies, however.


    You can buy many cheap coins and use them to stake so you have a lot of validators
    to your name. Since the coin is not so popular, there won’t be many users on the
    network, so you will eventually reach a critical point where you have a majority
    of control over the network. Then, you can just alter data and double-spend at
    your leisure. That is fine for people who want to watch the world burn, but not
    so fun for miners.

