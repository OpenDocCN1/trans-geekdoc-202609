    # Using Tax Calculators


    Luckily, because we live in an era with advanced technology, you do not have to
    page through thousands of regulations just to find out how much money you have
    to pay your government over taxes. This is also important because you might have
    to jot down all transactions you have made in the past.


    Although blockchain technology records everything in chronological order and makes
    it accessible to everyone, it is still a hassle to go over everything a few days
    before your tax is due. So, it pays to set up a system right now to track your
    taxes to save you from a lot of headaches down the line.


    A few programs come to mind: Accointing, Cointracking, and TokenTax.


    If you are new to the cryptocurrency space, consider using Accointing because
    it is user-centric and also provides some useful educational content. They have
    a crypto tracker app and a crypto tax software that give you specific results
    based on your county, be it the USA, UK, Germany, Australia, etc. that use `FIFO`
    or `LIFO` tax methods. They also have great customer support and are also very
    affordable.


    But, if you know your way around taxes and want a more complex platform with statistics
    and such, consider Cointracking. It has a versatile infrastructure in terms of
    data, but it might not be a good option for beginners.


    If you want to have access to a platform with professional help to get your taxes
    done, there is TokenTax. Having professionals on the line means that any update
    to the regulations would be quickly reflected in your tax reports. Some other
    platforms may take a while to update their calculator, so you could end up in
    trouble. The only downside with TokenTax is that it has a much higher price than
    any other platform. They pretty much handle most of the job for you. They cover
    English-speaking countries and they can handle various tax methods. If you want,
    you can also get a tax package that comes with a CPA, if you can afford it.


    ## LOWERING YOUR TAXES


    Believe it or not, there are a few ways you can lower your taxes. It’s not tax
    avoidance, of course. You would just be using the law to shave off some extra
    expenses that you could do without. Is it ethical? That is up to the philosophers.


    But you may find comfort in knowing that large companies, especially transnational
    corporations, are always looking for ways to reduce taxes. The common folks are
    not aware of the intricacies of tax law, so they usually spend more than they
    have to. A few tips here and you should be able to cut off a few percentages of
    your hard-earned cash.


    ### Tax Loss Harvesting


    It sounds more ominous than it actually is. It works like this: if you see that
    some of your crypto holdings go down in value, you can sell them off to incur
    a loss. This will reduce your overall tax bill. It is not illegal or unethical.
    It is totally legal to balance capital gains with capital losses. So, if you have
    some crypto that has depreciated a lot in value, consider selling them off to
    reduce the tax on the gains you have made earlier in the fiscal year. You can
    offset it by up to `$3,000`, but always make sure to check with your local legislation.


    ### Long-Term Investment


    The `IRS` sees cryptocurrency as property. So, playing by their rule, its capital
    gains rate is lower if you hold onto your investment over a year. Therefore, if
    you buy and sell your crypto asset after nine months, your capital gains tax would
    be higher than if you held it for over a year.


