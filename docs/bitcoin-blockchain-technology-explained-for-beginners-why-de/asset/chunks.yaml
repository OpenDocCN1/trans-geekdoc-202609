    **Stellar (XLM)**


    Stellar is created to provide enterprise solutions for financial institutions
    to make large transactions using its specially designed blockchain network. Anyone
    who has to send a lot of money across the continent would know the bureaucracy
    and prices associated with such transactions.


    Banks and investment firms making huge transactions like this would take many
    days and many people who act as intermediaries. It is expensive and inefficient.
    So, Stellar allows those institutions to do just that without any intermediaries
    and very little cost.


    Stellar was founded by Jed McCaleb, who was among the team that founded Ripple
    Labs. He also happened to be the developer of the Ripple protocol. One day, he
    decided to part ways with the team at Ripple to co-found Stellar Development Foundation.


    Stellar is an open blockchain network. Although it is designed for enterprises,
    anyone can use it. Cross-border transactions between countries can be done with
    Stellar. The native cryptocurrency is Lumens (XLM) and it would be used to make
    transactions on the network, just like Ethereum.


    **Chainlink**


    Developed by Steve Ellis and Sergey Nazarovl, Chainlink provides an interesting
    solution to the invincible barrier between blockchain networks and the internet.
    It is a decentralized oracle network that allows smart contracts to interact with
    data outside the blockchain network. You see, the blockchain networks themselves
    lack the ability to connect to external applications. At least, they can’t do
    it safely. Most solutions are pretty clunky and unsafe and this is where Chainlink
    comes in.


    Chainlink’s decentralized oracles give smart contracts the ability to interact
    with external data, which is something that Ethereum has not yet been able to
    do. On their website, they list down in detail various use cases for their systems.


    One of them is that it can be used to monitor water supplies for pollution or
    alteration in certain areas. It works like this. Sensors would be placed to monitor
    consumption, water tables, and the levels of local bodies of water. The sensors
    would then feed the data to a smart contract inside Chainlink oracle. The smart
    contract can then use this data to hand out fines, give flood warnings to areas
    that could be affected, or send invoices to companies.


    **Binance Coin (BNB)**


    Binance is a cryptocurrency exchange platform and BNB is a utility token that
    operates as a payment method for fees related to trading on their platform. You
    can still trade on Binance even if you don’t own BNB, but those who do can do
    so at a discount. Lowered transaction fees might not seem like much, but the number
    adds up over time.


    Binance Coin operates on the same blockchain that Binance’s decentralized exchange
    uses. Binance was found by Changpeng Zhao and the platform is one of the most
    popular crypto platforms today.


    At first, Binance Coin was an ERC-20 token, meaning that they were created on
    the Ethereum blockchain and remained there for a while. It soon got its own blockchain.
    Miners would be pleased to know that BNB uses a proof-of-stake consensus model.


    **Tether (USDT)**


    Tether is an early member of the stablecoin club. To quickly iterate, stablecoins
    peg their values to a currency or other external referencing point to combat volatility
    that plagues cryptocurrency. In this case, Tether is tied to USD. This gives Tether
    the ability to make transfers more easily from USD to other cryptocurrencies faster
    than it would normally take if you have to convert it to normal currency and then
    make the transfer.


    Tether was launched back in 2014. The developers behind the coin said Tether is
    a blockchain-enabled platform created specifically to facilitate the use of fiat
    currency digitally. In simpler terms, that means Tether provides a solution for
    users to send and receive fiat currencies via its blockchain network while also
    minimizing the volatility and complexity associated with digital currencies.


    **Monero (XMR)**


    Monero advertised itself as a cryptocurrency when it was launched in 2014. What
    makes it stand out from other cryptocurrencies is the fact that its development
    is based solely on donations and community feedback. In other words, the developers
    want this cryptocurrency to be a project for the community, by the community.
    It’s a breath of fresh air from the usual tone-deaf developers who don’t listen
    to the community.


    Monero has been launched with some other key goals in mind as well. They are decentralization
    and scalability. Monero allows for complete transparency by using ring signatures.


    Using this technique, a group of cryptographic signatures would be created. Only
    one of them is actually valid. However, because all of them look valid, it is
    impossible to find the real cryptographic signature. The only issue with this
    technique is that it works too well.


    Monero has been linked to criminal operations across the globe. Of course, this
    is more or less inevitable. You cannot have privacy for yourself. It’s either
    everyone has it, including the criminal, or no one has it at all. Most people
    prefer the latter because there are always bad apples in every community, and
    the crypto world is no exception.


    That said, Monero has also helped political dissidents of oppressive regimes move
    cash out of the country or remain funded even though they are denied financial
    services by their government.


    **OmiseGo (OMG)**


    OmiseGo was launched back in 2013 in Thailand. It is an Ethereum-based platform,
    meaning that the coin was developed on the Ethereum blockchain. OMG’s goal is
    to give users the ability to make transactions quickly and securely between digital
    wallets, in both cryptocurrencies or fiat currencies. In doing so, OMG effectively
    removes third-party involvement.'
