    # COVERING YOUR LEGAL BASES


    As mentioned before how cryptocurrencies are regulated depends on the local jurisdiction.
    This will involve learning how to read the overly complicated law that is designed
    to create new jobs for lawyers. If wrapping your head around the legal landscape
    is difficult, consider getting professional help.


    ## ON LEGAL MATTERS


    As mentioned before, governments across the globe have a different view on cryptocurrency.
    Although you may have seen it coming from a mile away, it is usually the not-so-democratic
    countries that are banning cryptocurrencies whereas free states are finding ways
    to introduce regulations to this new digital asset as a way to integrate it into
    the free market.


    ### The United States


    The United States, for example, allows cryptocurrencies to operate in their jurisdiction.
    Although, the states do not have a consistent or uniform legal approach to cryptocurrencies.
    The laws change between states and even the federal law could not decide what
    cryptocurrency is.


    While discussing what something is or isn’t might not be important to an average
    Joe, it can make or break an entire legal framework if you don’t get the definition
    right. For instance, the Financial Crimes Enforcement Network views cryptocurrencies
    as money transmitters, and the `IRS` sees them as property. It really does not
    help the situation here.


    Crypto exchanges also have to deal with uncertainty because the government is
    undecided on the matter. For one, they do not know what law they need to comply
    with and which authority they should answer to. Different regulators have various
    jurisdictions and they get to call the shots. The problem is that many different
    regulators are claiming jurisdictions although there is no cohesive approach yet.
    The policy is still unclear.


    As of now, there really is no uniform definition of “cryptocurrency” because states
    have different views on the matter. It is often referred to as a virtual currency,
    digital asset, digital tokens, crypto assets, or just crypto. Many jurisdictions
    in the United States adopt a more tech-agnostic broader definition and some want
    to come up with detailed definitions. The latter would have to regulate when technology
    evolves, but they would have to keep up.


    Although everything is muddled with confusion, at least the United States government
    is working hard toward creating some sort of overarching crypto regulation so
    people at least can say for sure how the government defines it and what laws would
    apply to it.


    ### The European Union


    The European Union has a different problem in regards to cryptocurrency. Although
    it is widely considered legal throughout the EU, the rules for exchanges are different
    depending on the states they are based in. That also means different taxes where
    you pay 0% in one state but 50% in the other. Crypto is also subject to capital
    gains tax. Looking at it now, the `EU` Parliament seems pretty content with the
    status quo as they have not passed any more specific legislation regarding cryptocurrencies.


    Exchanges need to register with their local financial authority. Once that is
    done, they can operate within the `EU`’s jurisdiction. In addition, they also
    have to follow the `EU`’s anti-money laundering regulations. Some crypto exchanges
    allow users to convert from fiat currencies to cryptocurrencies without VAT.


    ### The United Kingdom


    The United Kingdom, since it separated from the EU a while ago, have created their
    own regulations for cryptocurrencies. The United Kingdom does not consider cryptocurrency
    to be legal tender but crypto exchanges are allowed to operate. The taxability
    of cryptocurrency depends on the parties and activities involved, but gains or
    losses are subject to capital gains tax.


    Crypto exchanges need to first register with the `Financial Conduct Authority`
    (`FCA`) before they are allowed to operate. Some exceptions apply where registrations
    are permitted online. The `FCA` also has the authority to supervise how businesses
    that deal in cryptocurrency handle terrorist financing and money laundering.


    ### Russia


    Russia has a complex relationship with cryptocurrency, but it appears that they
    have finally decided what to do about it. They are now taking action against the
    use of cryptocurrencies as they are classified as money substitutes. And a recent
    law outlawed money substitutes, so cryptocurrency is illegal under its classification
    under Russia’s jurisdiction. It still remains unclear what cryptocurrency can
    be used for then.


    There are also proposals on the horizon that might allow the confiscation of cryptocurrencies.
    These proposals can be implemented as laws. Although it is unclear how the Russian
    government plans to go about confiscating cryptocurrencies since everything is
    anonymous and decentralized.


    ### China


    China’s stance on the issue is pretty clear. They reject cryptocurrencies and
    are working hard to purge them from their country. They have been at it for quite
    a long time now, in fact. The People’s Bank of China banned financial institutions
    from dealing with `Bitcoin` transactions since 2013. In 2017, they banned crypto
    exchanges and ICOs.


    Back then, there were some workarounds, but those loopholes are quickly closed.
    Mining used to be rampant in China because it sorts of operates in a grey area,
    but the government is also looking to put a stop to that as well.


    In short, the Chinese government has the toughest anti-crypto laws in the world
    and it is only going to get worse for them. Recent government crackdowns have
    seen some crypto exchanges based in China closed down.


    ### Japan


    Surprisingly enough, Japan has been one of the most progressive states in the
    world when it comes to regulations regarding cryptocurrencies. Japan used to be
    the biggest market for `Bitcoin` in 2017. Though it lost that title now, it still
    holds on well enough to be regarded as one of the top countries in terms of market
    size.


    Cryptocurrencies are considered to be legal properties in Japan and they are subjected
    to tax as miscellaneous income. The regulations on crypto exchanges are also way
    ahead of their time, although there are a number of crypto exchange security breaches
    in the past. Since then, Japan is enforcing stricter rules for crypto exchanges
    to protect both the consumers and the companies that run the exchanges.


    Japan is considered to be one of the friendliest countries toward cryptocurrency.
    Although, the cyberattacks on the crypto exchanges grabbed the attention of regulators.
    As a response, they now have a separate regulatory body that deals with crypto
    exchanges specifically. This is a move to restore the balance between progress
    and regulation.


    ### India


    It is a different story in India. Although cryptocurrencies are readily adopted
    by the Indian government, there is a clash between them and the `Reserve Bank
    of India` in court because the latter banned crypto. Although cryptocurrency is
    not banned in India, the court battle is still going on.


    With this in mind, the future of cryptocurrency is still uncertain and only time
    will tell how it plays out. Much of the dispute revolves around how cryptocurrencies
    can be used to launder money and to fund terrorists. But, with the right regulations
    in place, measures can be implemented to combat those problems and foster progress.


    ## ON THE MATTER OF TAXES


    As the old saying goes, nothing is as certain as death and taxes. Depending on
    where you live, you are subject to certain taxes. This is to be expected because
    anywhere where money can be made, taxes can be found in the same place. So, you
    should set aside some cash from your spoils to cover taxes or you will be in trouble.
    But how much will they tax you?

