    plan involves holding onto the coins for over a year and weather the volatility
    storm. That said, the price swings are to be expected, but you are expecting to
    see a slow increase in value over a long time. It will take a while, but you are
    going to get there and you can cash in. The whole plan hinges on you doing absolutely
    nothing, which is easier said than done.


    A good example of this would be the early investors in Bitcoin. Sure, people would
    laugh in your face if you invested in Bitcoin back when you needed over 10,000
    of those to get a pizza. Around 2011, the price was just $0.35 a pop. If they
    held onto the coins until 2017, they would be able to sell them all off for around
    $20,000 each. In other words, you would get around 57,000 times of your initial
    investment. You have to wonder what those people are doing right now.


    So, what kind of benefits does this long-term strategy bring? For one, all it
    takes is time. You buy some coins and sit on them for a while. It is that simple.
    That means, you do not have to understand the charts or graphs since you just
    hold onto the coins for a long time.


    Plus, you do not need to waste time anxiously checking the price movement every
    five minutes. You can do it when you are free or whenever you want. It does not
    really matter much since you are not doing anything else anyway.


    You can also treat this like investing in stock, not to grow wealth, but rather
    to develop good habits. The idea is simple. You start off with whatever cash you
    can afford to give away and put that forward to buy a couple of coins. Whenever
    you have some cash to spare, put that into buying more coins. You can even say
    that you would spare just $100 every month and you would put that into a cryptocurrency.
    You do that every month over a long period of time until it is time to reap your
    harvest when you are near retirement or when you need some emergency cash. This
    strategy lets you avoid the stress of market volatility since there is no need
    to fuss about short-term price movements.


    Of course, no plans are without their own flaws. The biggest one is that you will
    miss opportunities that would otherwise allow you to make short-term profits.
    Because of price volatility, sometimes it may jump up momentarily before settling
    back down again. Short-term traders would wait for this moment to make a quick
    profit.


    You may also notice another major flaw in this strategy. It is the fact that you
    are betting on the price going up in the future. Given how unpredictable the future
    is, you can miss out on some bad news and have your investment go down the drain.
    If there is bad news relating to your coins, the price may drop and never rise
    again.


    This is why you should always have a solid main plan and some contingency plans
    when things go south. In this case, you should keep an eye on cryptocurrency news.
    If the outlook is bad, pull out and move your wealth to another cryptocurrency
    and try again.


    But before you even begin, you should do your research. This is probably repeated
    many times in literally every investment advice you get, but its importance could
    never be overstated. Do your due diligence and at least try to understand if the
    coin would grow in the future.


    **What to Be Careful of?**


    That said, there are a few other tips to help you navigate the chaotic yet lucrative
    world of crypto investments.


    **You Don’t Always Win**


    The most important thing to keep in mind is that you do not always win. Sometimes,
    everything goes south because of factors outside of your control, without prior
    warning. Sometimes, you may lose a portion of your investment. Sometimes, you
    lose everything. It can happen.


    For this reason, traders are advised to not invest more than what they can afford
    to lose. Plus, traders should not set up their trade in a way that would cost
    them more than 2% of their outstanding balance on a given position. That way,
    if things do go south hard, you only lose 2%.


    How you deal with losses as they happen can also be the difference between a good
    trader and a bad one. This tip is also important: don’t try to earn your losses
    back. You might think you can do that by putting in more money. In reality, you
    could recoup your losses. The problem is that people try it without having a solid
    plan going in, which is a very bad idea. They lack planning because they let their
    emotions get the best of them. So, if you go in just because you are upset and
    you do not have good entry and exit strategies, what you are doing is basically
    gambling, which ends up causing people to lose a lot more money.


    **Fear, Uncertainty, and Disinformation**


    Commonly referred to as FUD, this occurs when you start to doubt your investments
    just because you heard other people’s opinions. They may tell you that the coin
    is a scam or that it would crash in the foreseeable future. They may even have
    some solid reasoning as well.


    But, again, do not panic. Always do your own research before making a decision.
    Information is everything here, remember that. A quick Google search would prove
    whether what you hear from other people is correct. More often than not, they
    parrot other people’s opinions and pass them off as facts.


    **Persuasion**


    Speaking of facts, you should always differentiate between facts and opinions,
    and value them differently. Keep in mind that there are other people who want
    to make a profit from trading cryptocurrencies as well. Therefore, you should
    not allow yourself to be influenced by other people’s opinions.


    This is important if you get your information from YouTubers or any social media.
    Some people are paid by the developer of a certain cryptocurrency to promote their
    coin. The influencer would then “shill” by touting to their audience how great
    the coin is. This would, of course, lead to an increase in that coin’s price since
    people are buying in, but this only lasts for a while. It will decrease over time.


    This is called shilling. Influencers would be paid to say nice things about a
    certain product, service, or company, by following a script or guideline, but
    they themselves do not actually believe in what they are saying.


    This doesn’t just apply to cryptocurrency. Some people are transparent and would
    tell you that they are sponsored by a certain company and go the extra length
    to tell you that their options would remain honest. How true it is will depend
    entirely on the influencer’s reputation. If they keep touting one product after
    another without really having anything concrete to back up their claims, chances
    are that they are a shill.


    Regardless, thorough research should give you a better idea. They can say what
    they want, but nothing beats the truth. Do your research and stick to the facts,
    and you should be fine.


    **Ponzi Scheme**


    Cryptocurrencies got a bad rep because there have been some malicious individuals
    who successfully pulled off a Ponzi scheme in the past. The idea is simple. You
    put together a legendary sales pitch, promising huge upsides to investors and
    little to no risk. It does not have to be difficult if you pack your pitch full
    of jargon and technicality and put it toward people who are desperate and not
    too knowledgeable in the field.


    With the money, the scammer could run away, but that would be a simple scam. Nothing
    special about it. A Ponzi scheme goes a level deeper by taking the money from
    recent investors and giving some of it to the investors that came before them.
    You don’t have to pay for everything. Just cover the interest and you will be
    fine.'
