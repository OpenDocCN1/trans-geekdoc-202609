    You can also pay for your coffee at Starbucks using `Bitcoin`. Though, they would
    not be accepting direct payment via `Bitcoin`. Instead, you would have to use
    the `Bakkt` app, a crypto exchange, for that.


    Whole Foods also jumped on the train by partnering up with the `Winklevoss Flexa`
    app called “Spedn”. They accept `Bitcoin`, `Litecoin`, and `Gemini dollars`. So,
    you’ve got your grocery expenses covered with Whole Foods. But, through the `Spedn`
    app, you can also find products from Baskin Ribbins, Gamestop, Jamba Juice, and
    Regal Cinemas.


    Newegg is known for buying hardware to mine cryptocurrencies and they have all
    kinds of computer hardware for sale, so if you’re interested in mining cryptocurrencies,
    consider checking out what they have to offer.


    The list goes on and on. Chances are that a few weeks after this book has been
    published, more shops would accept cryptocurrencies as a payment method.


    # On the Subject of Coins and Tokens


    When you talk about cryptocurrencies, you might hear the term “token” being used
    now and again, and it can be confusing when you learn that you can buy and sell
    these tokens as well. It’s even more baffling when people sometimes use the term
    “coins” and “tokens” interchangeably. However, both are totally different things.
    So, what’s the difference?


    ## Coins


    Coins or cryptocurrencies are digital assets that have their own blockchain. So,
    each cryptocurrency, or coin, has its own blockchain network that they operate
    in. `Bitcoin` only works on the `Bitcoin` blockchain. `Litecoin` only works on
    the `Litecoin` blockchain. Each blockchain is independent of one another.


    You can send and receive coins but there is nothing physical about it other than
    the computers working to send the data around a gigantic global database. This
    database is the blockchain network that keeps track of all transactions.


    You can use your coins the same way you spend money. You can send and receive
    it from someone. You can also hold onto it and sell it off at a later date and
    pocket the profit. Or, you can also buy products and services using cryptocurrency.


    While `Bitcoin` is intended to be used as money, `Ether` and other cryptocurrencies
    are created for other purposes.


    For instance, `Ether` is used to facilitate transactions on the `Ethereum` network.
    This is important since most tokens are developed on `Ethereum`. So even though
    you are sending or receiving tokens, the sender still has to spend a bit of `Ether`,
    which goes to the miners.


    `NEO` is a stake in a wallet to earn a dividend. This is also known as `GAS`.
    Tokens built on `NEO` can be sent and received the same way on `Ethereum`, and
    the `GAS` is a transaction fee.


    Then there’s `DASH`. It’s a coin, but if you own enough of them, you can vote
    on important decisions for the entire `Dash` network. Let’s say that someone posted
    an idea to upgrade the `DASH` network. So, those who own a large amount of `Dash`
    coins can decide whether to upgrade or not. So, owners of `Dash` coins can decide
    what direction the project goes.


    ## Tokens


    So, how about tokens? Tokens are different from coins. They are created on an
    existing blockchain. Thanks to smart contracts, the most popular platform for
    tokens would be `Ethereum`. All tokens created on `Ethereum` are called `ERC-20`
    tokens.


    Smart contracts are computer programs or transaction protocols created to automate
    the execution, control, or documentation of legally relevant events and actions.
    This is all based on the terms and agreement of the contract.


    As mentioned before, Ethereum is not the only platform for creating tokens. You
    have `NEO`, `Lisk`, `Waves`, and `Stratis`. They have different names for their
    tokens. For instance, tokens created on the `NEO` platform are known as `NEP-5`
    tokens.


    Creating tokens is very easy, although you still need some coding experience.
    You just have to have some native coins to get started so the miners can facilitate
    the transaction process.


    Most tokens are created to be used with decentralized apps such as `dApps`. Developers
    creating the tokens have complete control over how many tokens they want to have
    and where they would go after they are created. Upon creation, they would need
    to spend some native coins.


    After the tokens are created and distributed, token owners can use them to activate
    features on specific apps. For instance, `Musicoin` gives you the ability to access
    their library of music, videos, and songs.


    A crypto exchange called `Binance` also has its own token which gives users a
    50% discount on their fees.


    Tokens can also be used to represent a physical object. Suppose you want to use
    a smart contract to sell your house. Of course, you cannot put your house into
    the smart contract, at least not physically. So, an alternative would be to use
    a token to represent the house.


    `WePower` or `WPR` reflects that usage perfectly. Their project is a `dApp` and
    their tokens represent electricity. It’s not entirely physical, but you get the
    idea. Users can buy and sell electricity using smart contracts. Each `WPR` token
    represents a certain amount of energy.


    ## Why Use Tokens?


    The question then is, why use tokens?


    First of all, it’s the simple fact that developers do not have to create an entire
    blockchain. They can piggyback on an existing blockchain and use their limited
    resources on something else. They benefit from the security and resilience of
    the native blockchain they are on, such as `Ethereum`.


    If they were to create their own blockchain, it would be expensive and it can
    take forever. You see, if you create a blockchain, you would need miners. Lots
    of them. And since miners flock to the more popular cryptocurrencies, you can
    see how that is not happening.


    Plus, a blockchain’s resilience against cyberattacks depends entirely on the number
    of users. You want to have many computers connected to a blockchain rather than
    having thousands of weak and centralized blockchain networks. Overall, it’s just
    expensive, tedious, and nigh impossible.


    This problem can be solved if you bite the bullet and pay a bit of coin of the
    blockchain network and work on there.


    ## Tokens in Practice


    With all that said, how does a token work in practice? Let’s take `Civic`. `Civic`
    uses `CVC` tokens and is an app that contains your private information. This information
    is fully encrypted so that even if your device is stolen, your private information
    remains safe.


    The `Civic` app is intended for those who would have their identities checked
    often. It can be a hassle having to hold onto the paperwork and other things,
    so the `Civic` app puts everything in one place. It is cheaper, more reliable,
    and efficient.


    Suppose that you go to South-East Asia on a holiday, then you might need to confirm
    your identity more than once. The first time would be the airport. If `Civic`
    happens to be a partner of that airline, you would have the option to scan a `QR
    code`. The app would then send all the necessary details to the company. No more
    fumbling with papers. It’s all inside your phone. Of course, to confirm that the
    information indeed comes from you, you are required to do a fingerprint or an
    iris scan.


    You can do this whenever you need to verify your identity. So long as the destination
    is a partner with `Civic`, then the entire process is a breeze. Your information
    can be verified via the blockchain network.


    You might be thinking that not many companies would partner up with `Civic`, and
    you would be correct. It is still rather small in scope right now, but as the
    app continues to be used, the more trust it gathers. Eventually, it will reach
    a point where everyone has heard about the app.


    But that’s not the entire system behind the `CVC` tokens. They have another role
    to play. `CVC` is used up in the verification process. The verifiers of IDs such
    as governments, banks, and other trusted sources would be paid `CVC` tokens for
    their `KYC` (know-your-customer) checks. The records would be stored on the blockchain.

