- "# 比特币与区块链技术初学者指南：去中心化、DeFi、NFT 和山寨币如何改变世界以及对你的意义何\n\n\n\n\n\n\n\n\n\n\n\n[Images/image00134.jpeg](https://qrco.de/bcWgbg)\
  \ \n\n![全页图像](img/image00135.jpeg)\n\n# 引言\n\n加密货币最近非常流行。有人认为这是一种狂热，他们确实有一定的道理。但这一次，它可能不是一阵风。加密货币并不是新话题，它已经存在很长时间了。\n\
  \n它在 2016 年 `Bitcoin` 减半后首次获得了大量的关注。这推高了 `Bitcoin` 的价格，并引发了巨大的兴趣。人们参与的时机稍晚了，随着 `Bitcoin`\
  \ 价格从那时开始下跌，他们最终亏了。不久后，加密货币变得淡，，在加密圈之外就未被提及。\n\n当 `Bitcoin` 在 2020 年经历下一次减半时，兴趣再次复燃。从那以后它的价格持续攀升，人们开始关注。多亏于困扰地球的整个新冠疫情，人们被迫困在自己的家里。大多数人失去了工作，他们转而寻求替代收入来源。其中就包括加密货币交易和投资。\n\
  \n与此同时，人们对政府处理疫情的方式感到不满，特别是由于他们分配纳税人资金的方式。大部分资金被用于救助巨型公司，这些公司尽力减少税收，并且几乎不关心其员工。某些政府没有拯救小微企业，而是将资金投入营救那些能够承受打击的大型公司。\n\
  \n这，加上很久以前的大萧条，让人们对政府产生了警备。在他们看来，他们辛苦工作来的钱并没有完全由自己控制。他们开始看到政府如何倾向于大型金融机构，而不是最初创造这一切的人们。\n\
  \n因此，一些人正在寻找重新获得对财富控制权的方法。\n\n\n\n\n\n# 回答关于加密货币的 7WH\n\n在开始之前，我们需要通过了解加密货币以及你可以用它们做什么来建立基础。在本章中，我们将介绍加密货币的基础知识。即使你之前对加密货币一无所知，本章也将为你提供理解它们所需的所有知识。\n\
  \n## 什么是加密货币\n\n简单来说，加密货币就像你在线银行使用的任何其他数字货币。你说的对了一部分。加密货币没有物理实体。整个系统完全在线，并由用户支持。\n\
  \n你要知道，加密货币存在于去中心化网络中。这些网络使用 `blockchain` 技术。`blockchain` 是一种点对点（P2P）分布式账本系统，由用户的计算机维护。关于它的功能和内部机制，我们稍后会介绍。\n\
  \n美国政府将加密货币归类虚拟货币，并由加密技术提供保护。换句话说，主要的加密货币几乎无法复制或伪造。\n\n加密货币与其他法币（或政府发行的货币）的区别在于，这些货币通常不是来自任何政府或金融机构。虽然某些政府和银行正在尝试开发自己的加密货币，但原始和主要的加密货币并非来自任何中央机构。相反，它们来自用户。\n\
  \n这一性特征是目前加密货币支持者和怀疑者之间争论的核心。加密货币在技术上不受政府干预或操纵，但一些人认为，这种缺乏控制至少是危险的。\n\n“加密货币”这一名称源于保护整个网络免受黑客攻击而实现的加密技术。`blockchain`\
  \ 技术驱动着整个系统，这就是为什么你经常听到这两个词连用。你可以这样想：加密货币是你发送和接收的钱，而 `blockchain` 技术是允许交易发生的整个金融系统。\n\
  \n由于加密货币独立于政府和金融机构，围绕该主题一直存在担忧。毕竟，2020 年最新的 `Bitcoin` 减半及其随后的价格飙升让许多人留下了 `Bitcoin`\
  \ 是数字黄金的印象。这里涉及资金巨大，所以你可以相信许多人对这些硬币感兴趣。\n\n许多金融专家相信，`blockchain` 和其他相关技术将最终改变交易方式。但它们的应用范围远超金融科技。`blockchain`\
  \ 是一种信息技术。换句话说，它为你提供了一种存储信息的新方式。诚然，这项技术并不新。它只是以不同的方式实现了技术，而且这种方法非常安全且有效。这项技术具有改变信息存储方式的潜力，并颠覆了医疗、法律和金融等许多行业。\n\
  \n加密货币在过去曾多次受到攻击，反对它们的论点大体相同。他们总是指向其潜在的非法用途、汇率波动以及底层基础设施的脆弱性，特别是可以买卖加密货币的加密货币交易所。虽然\
  \ `blockchain` 网络本身几乎不可破破，但加密货币交易所特别脆弱，而那里正是大部分资金所在的地方。\n\n尽管如此，加密货币仍因其透明性、可分割性、抗通胀能力和便携性而受到赞誉。\n\
  \n## 加密货币的类型\n\n第一个加密货币是 `Bitcoin`，它开启了这一切。`Bitcoin` 仍然是今天最有价值、最流行的加密货币。紧随其后的是 `Ethereum`、`Bitcoin\
  \ Cash`、`Litecoin` 等。`Altcoin` 是除 `Bitcoin` 之外所有替代加密货币的统称。\n\n并不是所有加密货币的设计初衷都相同。`Bitcoin`\
  \ 的产生是为了成为交易媒介，而 `Ethereum` 也用于通过代代币发行（`ICO`）活动为初创公司提供资金。将你的 `Ether` 投入 `ICO` 是赚更多钱的一种可行方法，我们稍后会详细讨论。\n\
  \n`Bitcoin` 出于 2009 年，由一位名为 `Satoshi Nakamoto` 的人开发。目前还不知道这个人是谁，或者是否是一个群体，但我们知道加密是数字黄金。截至\
  \ 2021 年 3 月，流通量超过 1800 万枚 `Bitcoins`。这意味着 `Bitcoin` 的市值约为 9270 亿美元（注：原文为 927 billion\
  \ 可能为笔误或指特定语境，此处按原意翻译并保留数字逻辑）。所有加密货币的市值约为 1.5 万亿美元，而 `Bitcoin` 占据了 60% 的份额。\n\n\
  ### 优点\n\n加密货币使交易变得快速且廉价。这是由于 `blockchain` 网络允许在两个双方之间进行不需要中介的资金转账。对于普通的银行转账，银行在资金发送到对方之前需要进行验证。这意味着交易成本更高，且需要更多时间来验证。\n\
  \n加密货币没有这种繁琐的系统。诚然，交易仍然需要验证，但这项工作由 `miners` 完成，这是讨论加密货币时的常用术语。这些 `miners` 贡献他们的算力来验证交易，并获得少量的加密货币奖励。关键在于，无论发送多少资金，他们获得的都是类似的。与银行或其他金融机构的费用相比，加密货币交易的费用微乎其微。\n\
  \n此外，`blockchain` 网络允许交易在几分钟内完成。`Bitcoin` 需要大约九到十分分钟进行验证，而其他加密货币由于开发者的优化，速度更快。\n\
  \n### 缺点\n\n尽管如此，加密货币被认为最大的缺点是其匿名性。加密货币网络用户不使用真实姓名。他们使用匿名名或用户名，追踪特定用户对美国政府来说是一项挑战性任务。\n\
  \n这种匿名性意味着犯罪分子可以在政府不知的情况下从事非法活动。他们可能利用它洗钱或避税。反之，也出现过人们通过购买加密货币将全部积蓄投入 `blockchain`\
  \ 网络，然后离开危险的国家，并取回他们的财富。这样，他们就不需要通过随身携带财富来冒险。\n\n某些记者、吹哨人网站和媒体需要替代收入来源，因为他们可能会被主要金融机构拒绝金融服务。`WikiLeaks`\
  \ 就是这样一个网站。这些网站位于暗网，那里的匿名性是有保障的。这意味着加密货币造福了生活在压迫性政府下的吹哨人和活动人士。\n\n同样值得注意的是，停止犯罪的最佳方法是放弃所有形式的隐私。如果政府了解一切，他们就能在非法活动发生很久以前阻止它。但你想生活在这样的社会中吗？显然，任何政府都不应该拥有如此巨大的权力。事实上，`Edward\
  \ Snowden` 引发的 `NSA` 丑闻就说明了这一点。\n\n\n\n\n\n`TOR` 浏览器允许用户访问暗网，这一案例说明了匿名性必须对所有人都可用，否则对任何人都不可用。`TOR`\
  \ 浏览的设计初衷是供美国官员使用的。它允许他们在进行调查时保持匿名状态。然而，如果只有他们才能使用这项技术，那么当网站宿主看到一个匿名用户时，就会知道是一个\
  \ `FBI` 探员在查看他们的网站。因此，`U.S.` 政府被迫向公众发布这项技术。\n\n这就是匿名性的悲剧事实。如果我们想让匿名性发挥作用，要么大家无缘拥有，要么每个人都必须拥有。遗憾的是，这也包含了犯罪分子。尽管如此，并不是所有的加密货币都同样隐私。\n\
  \n例如，`Bitcoin` 并不是非法业务的良好选择。`blockchain` 网络的设置允许数字取证分析师追踪到犯罪分子。这种情况发生在暗网上的“丝绸之路”（`Silk\
  \ Road`）网站，它本质上是一个药品亚马逊。\n\n## 特别考虑\n\n加密货币的核心吸引力在于 `blockchain` 技术，它提供了一种存储信息的新方法。它用于维护网络内发生的所有交易的在线账本，并按时间顺序记录一切。此外，账本分布在\
  \ `blockchain` 网络中的所有用户之间。\n\n这些账本是相互独立的，由于共识算法的作用，它们会得出相同的结论。换句话说，账本是检查和验证彼此有效性的一种方法，因此要更改某条记录，就需要更改网络上的每条记录，这几乎是不可能的。\n\
  \n所有的交易都会被记录并添加到“区块”（block）中，该区块在被 `miner`（矿工）确认后会被添加到 `blockchain` 中。一旦区块被确认，除非你更改\
  \ `blockchain` 中的每一个区块，否则就无法更改它。这意味着，伪造交易历史是不可能的。\n\n尽管许多专家对 `Bitcoin` 和代币（`Altcoins`）的未来持有分意见，但他们都认为\
  \ `blockchain` 技术在其他用途上具有巨大的潜力，在这些用途中匿名性得到了保障，且无法伪造或虚构。这意味着在线投票、众筹等。\n\n然而，由于加密货币完全是虚拟的，你可能会因为硬件故障而丢失昂贵的硬币。如果你将硬币存储在硬盘中而没有备份副本，一旦硬件故障，硬币就消失了。如果你丢失了信用卡或忘记了\
  \ PIN 码，你的银行可以轻松恢复你的访问权限。你的加密钱包则不能如此，因为没有其他人可以访问它。\n\n## 加密货币的批评\n\n地球上每种产品的价格都基于供需关系。高供低求意味着低价。低供高求意味着高价。加密货币的设计旨在具有稀缺性，这样如果它们成功了，价格将随时间呈指数级增长。\n\
  \n`Bitcoin` 是此点的完美说明。`Bitcoin` 在 2016 年经历过一次“减半”（halving）。这种减半是控制 `Bitcoin` 进入流通量的的一种方式。你可以看到，`Bitcoins`\
  \ 的最终总量有一个硬性上限。该上限是 2100 万个 `Bitcoins`。新 `Bitcoins` 的创建是为了奖励 `Bitcoin miners`，且其数量在每次减半后发生变化。\n\
  \n正如其名所示，`Bitcoin` 减半是指 `Bitcoin` 进入流通的流量减少一半。这大约每四年发生一次，是控制币价的一种手段。当减半发生时，矿工获得的硬币只有他们获得的一半。\n\
  \n这反过来创造了稀缺性并推高了价格。2016 年的减半期间，币价曾高达每枚 19000 美元，然后回落到 7000 美元。然而，减半前的价格远低于 7000\
  \ 美元。换句话说，仅仅因为你从挖矿中获得的币少了，它们的价值就翻了一倍多，所以这对每个人来说都是双赢的。\n\n此外，加密货币不受中心机构控制的。除了这些，加密货币的稀缺性驱动了价格飙升。在价格达到峰值期间，人们疯狂购买了币。。，由于加密货币是完全中心机构的的。。。。，，市场是是通胀的。\n\
  \n。，是是是是严重问题，这导致了价格的波动。由于加密货币中心机构影响的。，大型金融机构直接影响了货币的价值。\n\n在外汇（`Forex`）中，电力消耗是一个严重的问题。许多人们加入加密货币系统并希望从中获利，这导致了价格的剧烈波动。\n\
  \n在加密货币中，没有中心机构。因此，人们直接影响价格。简而言之，加密货币的波动性很大，专家认为这是一种高风险的投资。\n\n这正是在 2016 年减半期间发生的情况，人们涌向\
  \ `Bitcoin`，购买他们能买到的每一个币，并希望价格最高时卖出。然而，许多加入这场热潮的人并不是精明的交易者，他们在价格已经最高时购买了币。由于这种原因，加密货币通常被视为一种短期时尚或仅仅是一个投机泡沫。\n\
  \n围绕加密货币的另一个担忧是它们不与任何实物挂钩。在金本标准失效之前，黄金是价值载体。后来出现了法币，即政府发行的货币，其价值与政府的经济和政治权力直接相关。\n\
  \n加密货币不具备这些，因此其价值至今仍存疑。加密货币挂钩的一个可能的“实物商品”是生产成本，即挖掘加密货币所需的能源和硬件。\n\n但还有另一个问题。挖掘加密货币是一个高能耗的过程，前期成本对许多人来说太高了。你需要一台强大的计算机或专用工具来高效地挖掘\
  \ `Bitcoin`。挖掘 `Bitcoin` 是一场竞赛，即哪个矿工先验证交易，就会获得奖励。这就是工作量（proof of work）系统。\n\n如果你对挖掘如\
  \ `Ethereum` 等代币（`Altcoins`）感兴趣，你可能会有更好的机会，因为某些加密货币使用一种不同的方法，称为证明权益（proof of stake），你通过质押一些硬币来证明你愿意验证交易。每个人都能获得公平的工作份额，即使是小额投资者也是如此，大家都很开心。\n\
  \n电力消耗是一个严重的问题，挖掘加密货币对解决这个问题没有帮助。起初，人们使用显卡和处理器来挖掘。但这些工具并不是针对这项工作优化的，因为它们是为其他目的设计的。\n\
  \n`Bitcoin` 热潮创造了一个可以说让每个人都变得更糟的市场。某些像 `Nvidia` 等科技公司开始为矿工创建专用 `GPU`。这是一种没有输出端口的\
  \ `GPU`，旨在用于挖掘。这一举措的问题在于它增加了全球硅和芯片供应的压力，而这些本已经非常紧张。这甚至影响了汽车制造商。\n\n\n\n\n其次是安全问题。当然，每种加密货币背后的区块链网络是非常安全的，但它们并不是加密货币生态系统中的唯一成员。存在加密交易所，你可以在那里买卖加密货币，并可以将硬币存储在数字钱包中。虽然区块链网络几乎无法被黑客，但交易所和钱包并非如此。\n\
  \n加密交易所是你买卖加密货币的在线平台。这些网站通常是黑客的目标，已经发生过成功的网络攻击，导致了数百万美元的损失。加密钱包也并非 100% 安全，除非你使用硬件钱包，但这本身也会带来一些其他风险。\n\
  \n尽管如此，许多观察者认为加密货币具有变革金融世界的潜力。即使未能实现这一目标，区块链技术本身也是有益的。\n\n## 为什么要投资加密货币\n\n人们问的最大问题是，他们为什么要花精力投资加密货币。2016\
  \ 年的比特币减半已经给人们上了教训，他们拒绝立场并表示“绝不再”。但现在，大家对这个话题突然再次产生了兴趣。这是怎么回事？为什么大家又在讨论加密货币了？\n\n\
  ### 与以往不同\n\n你应该投资加密货币有很多理由。目前人们对加密货币保留意见的主要原因之一是 2016 年的比特币减半，那次事件经历了价格的大涨，随后紧接着崩盘，让许多人的处境变得糟糕。\n\
  \n但这次情况不同，因为许多公司（包括特斯拉和 PayPal 在内的巨头企业）正在参与其中。这些玩家在 2016 年减半期间是缺席的。他们现在与加密货币的广泛采用相结合，意味着加密货币正在蓬勃发展。\n\
  \n你可以利用你的加密货币赚大钱。你可以像对待股票一样，买入并持有硬币，直到以后以更高的价格卖出。\n\n或者，你可以投资于接受加密货币的各种项目和初创公司。这些项目利用区块链技术创造创新，这些将为许多行业带来巨大的飞跃。因此，尽管你可能对加密货币持有保留，但至少应该考虑驱动加密货币的区块链技术的使用场景。这种技术有很多应用。\n\
  \n### 区块链用例\n\n区块链技术允许在点对点网络上存储数据，这种网络对网络攻击具有很强的韧性。这种看似简单的功能为区块链技术提供了广泛的应用，而直到现在我们才发现自己需要这些。\n\
  \n### 去中心化金融\n\n区块链技术最常见的用途之一是去中心化金融，它是传统和中心化金融系统的一股清风。去中心化金融 (`DeFi`) 利用由区块链网络创建的去中心化技术实现的点对点金融。\n\
  \n这就是所有加密货币的来源。有趣的是，这并不单独适用于加密货币。银行和其他金融机构可以利用区块链技术来实现法币的转账，并获得区块链技术提供的所有好处。\n\n\
  `DeFi` 最常被引用的案例是在 `Ethereum` 网络上，你可以在那里运行智能合约，完全按照程序设定自动执行某些协议，而无需第三方监督整个操作。`DeFi`\
  \ 没有中心化的基础设施，而是。\n\n\n\n区块链技术的另一个有趣应用是视频流媒体行业。当前视频流媒体方法的问题在于文件大小。高质量视频占用大量空间，且你需要服务器来存储所有内容。这导致成本不断增加，并一直转嫁到内容创作者身上。\n\
  \n然而，区块链技术试图通过智能合约来降低这些成本，我们稍后会介绍。区块链技术在这里的工作原理是允许你在去中心化服务器上存储视频内容。这些内容经过了深度加密和安全保护。\n\
  \n这些去中心化服务器是什么？它们是矿工的设备。矿工可以将软件加载到他们的设备上，基本上是租出多余的计算机空间来存储视频文件，并利用多余的带宽流传输内容。矿工将获得代币或加密货币形式奖励。\n\
  \nTheta 正在这样做，他们的项目经历了稳定增长。随着时间的推移，也许未来我们会看到一种新的加密货币挖掘方法。到目前为止，我们有了 `CPU`、`GPU`、`cloud`、`ASIC`\
  \ 挖掘，我们将在第三章讨论所有的。\n\n## 智能合约\n\n智能合约本质上是附加在合同上的程序。它的创建目的是接收特定数据，并在满足特定条件时执行合同的某些条款。从核心上说，智能合约就是\
  \ Excel 中的 `if-then` 函数。仅此而已。\n\n再次，这种应用在本质上非常简单。但它的用途非常广泛。你可以用它交易供应链中的产品移动、进行数字身份确认、投票、医疗保健、食品安全、知识产权等等，以此类推。\n\
  \n智能合约之所以如此受欢迎，是因为它运行在区块链网络上。这意味着，除非你破坏整个系统，否则篡改数据几乎是不可能的。它去除了必须监督整个过程的第三方。它只是为你自动化了整个过程。通过稍加调整，你只需要提供一些输入，它就会输出正确的输出。就如此。\n\
  \n## 加密货币是如何工作的\n\n在本节中，我们将进入加密货币背后的运作细节。\n\n我们将从账本开始。正如名称所示，账本记录了区块链网络内发生的所有交易，并将它们按时间顺序排列。这些条目完全完全的，这意味着任何人都可以查看。这里的匿名性以用户名或伪名的形式出现。因此，虽然你可以看到哪个用户向谁发送了多少硬币，但你不知道这些用户名背后的真实身份。这让你在匿名性和透明度之间取得了完美的平衡。\n\
  \n账本上的条目也无法更改。唯一的办法是通过系统内其他账本的 `50% + 1` 确认。大多数账本达成共识将自动更新所有账本以具有相同的条目。这很难实现，因为每个用户都有自己、使用共识算法的独立账本。虽然所有账本在交易被矿工验证后都同意更新其条目，但伪造交易几乎是不可能的。\n\
  \n我们还需要谈谈交易验证。假设你想尝试一下加密货币。你通过加密货币交易所购买了一些 `Bitcoins`。然后，你决定花费它们。整个过程在几分钟内完成，但黑幕后发生了很多事情。\n\
  \n当你决定花费你的硬币时，交易需要验证。换句话说，交易尚未正式生效，要由矿工来验证。矿工的计算机或设备必须解决一个算法问题来完成验证。他们正在寻找确认交易的密钥。一旦完成，交易就会记录在账本中，并成为区块链的一部分。矿工将获得少量的\
  \ `Bitcoin` 作为工作的报酬。\n\n## 你可以在哪里使用加密货币？\n\n目前围绕加密货币最大的问题是它是否会超越投机工具。`Bitcoin` 的目标是成为一种在全球范围内接受的全球货币。这是一个高远的目标，但考虑到它目前的价值，它有很好的可能成为跨国界跨管辖区的货币。\n\
  \n鉴于其价格波动性以及全球政府对对此仍持观望态度，许多公司仍在等待。将加密货币采纳为支付方式是容易的。此外，他们有充分的理由这样做。交易成本更。处理速度更快。此外，交易无法伪造。阻止所有人接受加密货币的唯一因素是法律。\n\
  \n尽管如此，那里有许多商店接受加密货币作为支付方式。这是一项高风险高回报的尝试。如果政府突然决定禁止加密货币，那么他们获得的所有硬币将化为乌有。然而，如果政府正式接受加密货币，那么这些商店在采纳加密货币方面将远于竞争对手。\n\
  \n然后是波动性的问题。再次，价格波动剧烈，根据硬币数量为你的产品或服务定价简直是自找苦吃。假设一个硬币值 `$5`，所以你价值 `$50` 的产品需要 10\
  \ 枚硬币。现在，如果价格跌到每枚硬币 `$4`，那么你已经从昨天的销售中损失了 `$10`。\n\n除非你在拿到硬币的瞬间就将其兑现。这是一个可行的解决方案，因为一些加密交易所允许你以固定汇率将硬币转换为法币。这意味着，如果你通过加密交易所路由你的支付，他们会转换硬币并给你现金，你不需要担心汇率波动。\n\
  \n但其中存在着另一个问题。如果你通过交易所路由硬币，但随后汇率上涨了呢？那么你将错失可以获得的额外利润。如果硬币价格上涨到每枚 `$8`，那么你将错失 `$3`\
  \ 的利润，因为你昨天卖掉了所有硬币。\n\n\n\n\n你也可以在星巴克使用 `Bitcoin` 支付咖啡。尽管如此，他们并不接受通过 `Bitcoin` 直接支付。相反，你必须使用加密交易所\
  \ `Bakkt` 应用来实现。\n\n全食超市（Whole Foods）也通过与名为“Spedn”的 `Winklevoss Flexa` 应用合作而加入了这一行列。他们接受\
  \ `Bitcoin`、`Litecoin` 和 `Gemini`。通过 `Spedn` 应用，你也可以在全食超市支付购物费用，还可以找到 Baskin、Gamestop、Jamba\
  \ Juice 和 Regal Cinemas 等。\n\nNewegg 以挖掘加密货币而闻名，他们有各种硬件设备出售，如果你对加密货币感兴趣，可以查看他们提供的产品。\n\
  \n列表以此类推。可能在本书出版几周后，更多商店接受加密货币作为支付方式。\n\n# 关于币与代币的论题\n\n当你谈论加密货币时，可能会听到“代币（token）”一词，并且在学习购买和销售它们时可能会感到困惑。人们有时会混用“币（coin）”和“代币”。然而，两者是完全不同的东西。那么什么是币？\n\
  \n## 币\n\n币或加密货币是拥有自己区块链的数字资产。因此，每种加密货币或币都有其独立的区块链。`Bitcoin` 只运行在 `Bitcoin` 区块链上。`Litecoin`\
  \ 只运行在 `Litecoin` 区块链上。每个区块链都是独立的。\n\n你可以发送和接收币，但除了运行它的计算机外没有其他东西。这个区块链负责跟踪所有交易。\n\
  \n你可以像花钱一样使用币。你可以向某人发送和接收币。你也可以持有并在卖掉以获取利润。或者，你也可以加密货币购买商品和服务。\n\n虽然 `Bitcoin` 设计用于货币，`Ether`\
  \ 和其他加密货币的创建是为了其他目的。例如，`Ether` 用于 `Ethereum` 网络上的交易。这很重要，因为即使你在发送或接收代币，发送者仍然需要花费\
  \ `Ether`，这会交给矿工。\n\n`NEO` 是为了在钱包中赚取分红，这也涉及到 `GAS`。在 `NEO` 上构建代币可以发送和接收，`GAS` 是交易费用。\n\
  \n然后是 `DASH`。它是一种币，如果你拥有足够的 `DASH`，就可以对整个 `Dash` 网络进行投票。假设某人发布了一个想法来升级 `Dash` 网络。因此，`Dash`\
  \ 币的持有者可以决定其去向。\n\n## 代币\n\n那么，代币如何？代币与币不同。它们创建在现有的区块链上。得益于智能合约，最流行的代币平台是 `Ethereum`。所有在\
  \ `Ethereum` 上创建的代币被称为 `ERC-20`。智能合约是用于自动执行法律事件和程序的计算机程序，这基于合约。正如之前提到的，`Ethereum`\
  \ 不是创建代币的唯一平台。你还有 `NEO`、`Lisk`、`Waves` 和 `Stratis` 等平台。例如，在 `NEO` 平台上创建的代币被称为 `NEP-5`。创建代币非常容易，尽管你仍然需要一些代码经验。你只需要一些原生币即可开始，这样矿工就可以促进交易过程。大多数代币是为了用于\
  \ `dApps` 等去中心化应用。创建代币的开发者对他们想要拥有的代币有完全控制权。在创建时，他们需要花费一些原生币。代币创建并分发后，代币持有者可以使用它们激活特定应用。例如，`Musicoin`\
  \ 让你访问他们的音乐、视频和歌曲库。\n\n加密交易所 `Binance` 也有自己的代币，为用户提供 50% 的费用折扣。代币也可以用来代表物理对象。假设你想使用智能合约出售你的房子。当然，你不能把房子放入智能合约（至少在物理意义上不是）。所以，替代方案是使用代币来代表房子。`WePower`\
  \ 或 `WPR` 完美反映了这种用途。他们的项目是一个 `dApp`，他们的代币代表电力。这并非完全物理化，但你明白了。用户可以使用智能合约购买和出售电力。每个\
  \ `WPR` 代币代表特定的能量。\n\n## 为什么要使用代币？\n\n问题在于，为什么要使用代币？\n\n首先，由于开发者不需要创建一个整个区块链，他们可以寄放在现有的区块链并将有限的资源用于其他地方。他们受益于他们所在的原生区块链的安全性和韧性，例如\
  \ `Ethereum`。\n\n如果他们创建自己的区块链，将会非常昂贵且需要漫的时间。你看，如果你创建一个区块链，你需要大量的矿工。由于矿工会蜂向更流行的加密货币，你可以看到这种情况不会发生。\n\
  \n此外，区块链对抗网络攻击的韧性完全取决于用户的数量。你希望有很多计算机连接到区块链，而不是有成千上万个脆弱且中心化的区块链网络。总之，这既昂贵又枯燥，几乎不可能。\n\
  \n如果你硬着头皮支付区块链网络的币并在那里工作，这个问题就可以得到解决。\n\n## 代币的实践\n\n说了这么多，代币在实际操作中是如何运作的？以 `Civic`\
  \ 为例`Civic` 使用 `CVC` 代币，是一个包含你隐私信息的应用程序。这些信息经过了完全加密，因此即使你的设备被盗，你的隐私信息也是安全的。\n\n\
  `Civic` 应用适用于那些经常需要检查身份的人。持有文件和其他东西很麻烦，所以 `Civic` 应用将所有内容都放在了一个地方。它更廉价、更可靠且高效。\n\
  \n假设你去东南亚旅游，你可能需要多次确认身份。第一次是在机场。如果 `Civic` 恰好是那家航空公司的合作伙伴，你就有选择扫描 `QR code`。应用程序随后会将所有必要的细节发送给公司。不再需要翻找纸质文件。一切都在你的手机里。当然，为了确认信息确实来自你，你被要求进行指纹或虹膜扫描。\n\
  \n你可以在需要验证身份时随时这样做。只要目的地是 `Civic` 的合作伙伴，整个过程就会轻而易举。你的信息可以通过区块链网络进行验证。\n\n\n\n\n\n\
  当发生这种情况时，用户还会收到一定数量的 CVC。其目的是鼓励你继续使用 Civic，因为需要确认你身份的公司需要从你这个用户那里购买更多代币。因此，这个系统创建了一个有趣的经济体系，每个人的参与都会奖励。\n\
  \n由于 CVC 令牌开发在以太坊区块链上，因此交易需要一些 Ether 来驱动交易过程。尽管如此，Civic 应用程序专门使用 CVC 令牌。你无法使用 `Bitcoin`、`Ethereum`\
  \ 或 `NEO` 来访问其服务。\n\n# 简单的密码学\n\n加密货币的名称来源于货币（currency）与密码学（cryptography）的交叉。尽管加密货币拥有防弹级的加密来保护数据，但并没有多少理解什么是密码学，以及它是如何与加密货币联系的。\n\
  \n从基础开始。密码学是一种加密信息的实践，使得只有“知情人士”才能阅读它。这样，即使信息落入他人之手，外部人员也不知道它的含义。这是一项至今仍在使用的古老技术，从尤利斯·凯撒使用密码与其将军通信，到同盟军使用加密信息以确保轴心国即使截获信息也无法读取。\n\
  \n密码学需要保护敏感信息或数据不被不该看到它的人窃取。数据可以是从财务到军事情报的任何内容。人们有很多理由想要保持自己的隐私机密。\n\n正如你可能察觉到的，密码学有许多形式。有很多方法可以打乱数据或信息，使接收者能够解码。在现代技术出现之前，人们想出了许多创意方式来加密信息。例如，`BSELUEA`\
  \ 通过密码给出 `BLUE SEA`。这只是以特定方式重新排列字母的简单任务。有些人甚至会创建一个完整的字母表。\n\n如今，得益于计算机，密码学变得复杂得多。它们可以应用非常复杂的数学技术来加密数据。这些技术现在被用于加密货币。但无论变得多么复杂，它们始终基于相同的基本原理运行。即隐藏实际信息，使得只有授权人员才能访问。\n\
  \n### 那么，密码学是如何应用于加密货币的？\n\n密码学用于区块链网络，以保护交易、控制新交易的注册并验证资产转移。为了实现这些目标，加密货币依赖于公钥加密。\n\
  \n公钥加密赋予了用户两个独立的密钥。一个被称为“公钥”，用于接收代币。要访问这些币，你需要一个“私钥”。把它想象成你在公共场所看到的那些蓝色邮箱箱之一。公钥就是箱本身，因为任何人都可以往里面投邮件。然而，要访问箱里的邮件，你需要钥匙，而只有邮递员有那把钥匙。箱子的钥匙就是私钥。\n\
  \n密钥通常长 30 个字符左右，是字母和数字的混乱组合。它们没有任何意义。公钥也被称为公共地址，因为这个混乱组合充当了地址，以便人们向你发送代币。\n\n这些密钥与你的数字钱包相关，你的代币实际上存储在那里。因此，任何人都可以使用你的公钥向你的钱包发送代币。然而，要访问钱包，你需要私钥，你不应该与任何人分享私钥。\n\
  \n公钥加密是一个简单的概念，但实现它是一项令人印象的技术进步。即使加密货币在不久的未来归于沉寂，它留下的技术也将使每个人受益。这种密码学是那些将改变在线支付行业的技术之一。\n\
  \n尽管公钥加密存在漏洞，但这些都是人为错误，技术上并没有能做什么来补偿这一点。例如，人们可能会丢失私钥。如果是这样，他们可能无法找回加密钱包中的资金。有时，他们可能会无意中向他人泄露私钥，他人就可以访问钱包并偷走一切。\n\
  \n再次，这只是人为错误，但人们可以通过设置双重身份验证、备份数字钱包和保留备用私钥来防止这种情况发生。你可以将私钥写在纸上，把它贴在你知道是安全的地方。为了安全起见，在不同的地方保留几份副本。\n\
  \n# 自担风险投资加密\n\n在投资加密货币之前，你需要了解相关的风险。\n\n### 价格波动与操纵\n\n如前所述，加密货币经历着非常剧烈的价格波动。会出现大幅的价格飙升，紧接着就是崩盘。这些看似随机的事件让专家和投资者都感到惊讶和困惑。你今天的利润可能是你明天的损失。价格波动如此剧烈，以至于任何人很难拥有像股市或外汇市场那样的信心。波动性往往是随机且不可预测的，因此即使是你精心策划的策略也可能因为你控制之外的因素而失效。\n\
  \n说到因素，加密货币价格的波动来自三个来源：市场操纵、投机和情绪。由于加密货币市场在很大程度上不受监管且匿名，价格变得非常动荡。情绪高涨。影响者只需通过发推特就能操纵价格。由于加密货币的匿名性质，价格操纵尚未被广泛证明，但并不难看出它的存在。常见的价格操纵策略是“拉高出货”（pump\
  \ and dumps）和“软广”（shilling）。\n\n### 缺乏监管\n\n监管框架的缺乏加剧了这个问题。全球政府对此问题犹豫不决。一些国家禁止加密货币，而另一些国家正开始接受它们。\n\
  \n其，拥有法律框架将是政府认可加密货币的标志。这是 `Bitcoin` 和 `Altcoins`（代币）实现广泛采用所需的缺失环节。然而，在商业世界，你希望监管越少越好，这样你就可以轻松交易并获利。法律过多意味着限制更多，可能会削减你的利润。\n\
  \n同时，如果缺乏监管，法律前景将是不定的。这意味着政府没有正式支持这些代币，它们可能保持隐晦，其功能仅仅是投机工具。\n\n目前加密货币的法律框架是复杂、杂乱且无组织的。目前最大的担忧将如所预期的税收问题。毕竟，这都关乎钱。该领域缺乏监管或“监管灰色地带”意味着投资者不确定需要承担哪些义务。他们想知道应该为税收留出多少资金，以及需要保留哪些记录。未能履行这些义务将付出非常昂贵的代价，投资者不想让\
  \ `IRS`（美国税务局）不高兴。\n\n尽管监管跟上技术的速度缓慢，但当涉及巨大利益时，速度会好得多。在这种情况下，监管正在快速追赶加密货币。许多国家的当局正在采取适当步骤引入监管。研究论文正在编写中，标准正在制定等。\n\
  \n\n\n\n瑞士是第一个开始为加密货币建立稳健监管框架的国家。他们的理念是尽可能减少规则，以保持市场自由，但同时提供足够的与其他法律框架相匹配的规则，让公司知道它们需要通过“沙盒”来履行哪些义务，从而让初创公司能够在受控的环境内尝试它们的创新。\n\
  \n新加坡和英国也开始对其的区块链和加密货币监管环境进行实验。这种环境允许公司在宽松的监管和许可要求下进行实验。对于美国来说，纽约州总检察长办公室进行了一项关于交易所的研究。\n\
  \n## 市场采纳\n\n比特币正努力实现广泛采用，但有许多因素在阻碍着它，例如监管忧虑、市场波动、公众缺乏理解等。再加上加密货币以及支持它们的区块链技术仍然处于新阶段这一事实，加密货币可能无法被广泛采用。到那个那时，加密货币将失去所有的价值。虽然没有人确切知道截止日期何时会到来，但如果加密货币想要扩大规模，它们需要尽快获得法律、技术改进和机构的支持。\n\
  \n## 安全性、托管与消费者权益\n\n尽管区块链网络是安全的，但其生态系统中存在其他脆弱性点。用户需要采取一切措施来存储自己的加密货币和其他加密资产，否则将面临失去所有内容的风险。\n\
  \n加密交易所被视为存储加密货币最不安全的地方之一。大多数交易所为你提供钱包来存储硬币，但已经出现过被黑客攻击导致所有硬币被盗的情况。当然，你今天看到的大多数交易所都会谈论它们的顶尖安全性，以及你的硬币在它们那里是安全的。但未患于于，将你的硬币存储在硬件钱包中。\n\
  \n糟糕的是，丢失或被盗的硬币或资产是无法找回的。追踪你的硬币去了哪里几乎是不可能的。如果你不小心把硬币发给了别人，也没有办法撤销交易。你能做的就是礼貌地请求他们把币还给你。前提是你起初知道是谁拿了你的硬币。\n\
  \n由于没有中间环节，加密货币没有中央或官方的安全保障或保险。你从损失投资中获得的回扣金额完全取决于你开展业务的机构。\n\n幸运的是，现在有了托管解决方案，允许金融机构在此类交易中担任中间人。这是加密货币获得信任并被广泛采用所迫切需要的问题之一。\n\
  \n系统的运作方式是由第三方代表交易客户持有加密货币。一旦交付了产品或服务且各方满意，硬币就会发送给提供者。基础系统包括三方：客户、提供者和中间人。客户从提供者处购买商品或服务，但将币放在中间人处，直到提供者交付商品或服务。完成后，需要涉及方的三取二一批准即可释放资金。如果发生任何纠纷，中间人可以介入解决冲突。\n\
  \n这为投资者在投资他们昂贵的硬币时提供了额外的安全保障。如果情况变糟，他们可以让硬币退回。有人可能会认为，客户可能会滥用权力，在获得产品或服务后要求归还硬币。当然，中间人必须受到双方的信任才能实现。\n\
  \n（注：原文后续存在大量重复的段落，根据“不要重复输出原文”的原则，此处仅翻译核心逻辑内容部分。）\n\n\n\n然而，很有可能你也会做出错误的判断并最终损失所有的钱。再次强调，加密货币市场是不可预测的。即使你非常小心，你控制之外的因素也可能毁掉一切。所以，如果你亏光了所有的钱，那就结束了。你只能用剩下的钱勉强维持到下一次发薪日。\n\
  \n更危险的是，也许你认为自己能抓住下一次大行情。这在加密货币交易市场中并不起见。情绪会变得异常高涨，你的直觉告诉你利润近在咫尺。于是，你投入了负担不起的资金并尝试运气。如果你成功了，那祝喜你；如果没有，那游戏就结束了。这种恶性循环如何持续下去是显而易见的。\n\
  \n因此，投资的黄金法则是只投资你愿意掉进去的钱。潜在投资者应该首先评估自己目前的财务状况。你的投资不应该影响你的财务健康，至少不要直接影响。\n\n在完成这项初步评估后，到底需要多少钱才能开始投资加密货币？\n\
  \n吸引很多人进入加密货币交易的原因之一是其门槛非常低。你不需要大量的前期投入就可以开始。虽然你可以投资得较少，但你至少应该从 50 美开始。\n\n你可以先在交易所购买加密货币，然后开始卖出或交易这些币。所有这些操作都有相关的费用，因此糟糕的交易或利润空间太小的交易是行不通的。\n\
  \n由于市场波动巨大，取决于你的策略和一点运气（或缺乏运气），你可以将 500 美变成 5000 美，反之亦然。和任何其他交易工具一样，做好研究并拥有稳健的策略将让你走得很远。\n\
  \n至于开始交易比特币或山寨币（Altcoins）的最低金额，这取决于交易所。每种加密货币几乎都是无限可分的。例如，比特币可以被分成一亿份。亿分之一是最小单位，被称为一个\
  \ `Satoshi`（聪），以此向比特币的创始人、开启一切的中本聪（`Satoshi Nakamoto`）致敬。\n\n尽管如此，最低金额将由你的加密货币交易所设定，因此请务必检查一下。简而言之，即使你没有多少闲钱，也可以开始交易比特币。只是需要更多的时间来积累财富。\n\
  \n人们问的下一个大问题是，是否可以通过交易加密货币来维持。短答案是肯定的。外汇交易员和股票交易员可以靠他们的游戏维持生活，你通过加密货币也可以做到。唯一的区别在于你需要一些运气和技巧来开始。\n\
  \n有些人通过加密货币交易实现了完全的财务独立。高波动意味着高风险、高回报的场景，如果你操作得当，可以赚取一笔巨额利润。\n\n你的成功可能还取决于你的耐心。再次，这是一个高波动的市场，因此价格波动真的会让你怀疑自己的策略。但如果你坚持你的执行计划并保持耐心，最重要的是不要贪婪，那么在大多数情况下你都能获胜。再次，在这里你还需要一点运气。看到交易因为你控制之外的因素而一次又一次地变得糟糕会是令人沮丧的。但请保持冷静，理解这种事情会偶尔发生。\n\
  \n## 交易比特币的成本是多少？\n\n除了币本身的价格之外，你还必须考虑在加密货币交易所交易时需要支付的费用。买卖币时会有费用。这并不是什么从你那里赚钱的阴险手段，这些费用是为了确保加密交易所能够继续运营。\n\
  \n这些费用包括 `Maker`（挂单）费用和 `Taker`（吃单）费用。`Maker` 费用是通过限价单增加订单簿流动性的费用。`Taker` 费用是通过市价单从订单簿中提取流动性的费用。有时，如果限价单已经在订单簿中，你可能会同时产生挂单和吃单费用。\n\
  \n通常，加密货币交易所按每笔交易的固定费率计算费用，或按你账户 30 天交易额的比例计算。无论哪种情况，它们都有一套结构，根据你的交易金额来决定收取多少费用。\n\
  \n## 在加密交易所交易时需要考虑的四件事\n\n在你开始交易之前，有四件事你需要记住。首先，加密货币交易很多很多国家不受监管的。它们对加密货币的监管采取了非常放任的态度。例如，美国的加密交易所仅受零散法律的监管。尽管某些加密货币在中国被禁止，但主要的中国加密交易所目前仍在运行，它们将地点迁到了马尔他或塞舌尔屿以躲避政府的打击。\n\
  \n其次，你需要理解为什么费用是这样设置的。其目的是鼓励你进行频繁的大额交易，金额至少在 1000 美元以上。频繁且大量交易，大多数交易所通常会降低费用。换句话说，如果你进行小额且不频繁的交易，费用会很快侵蚀你的利润空间。某些加密交易所在你交易超过\
  \ 1000 万美元时完全不收取费用。\n\n此外，加密交易所鼓励用户使用代币进行交易。法币有提现和入金费用，取决于你选择的支付方式。当然，当你首次设置账户时，你可能需要支付入金费用以及一笔创建钱包的小额费用。当你想要提取资金时，也必须支付提现费用。但一旦你进入系统，用其他加密货币购买加密货币会更好，这大部分是免费的。\n\
  \n最后，记住即使是最大最流行的加密交易所也没有提供所有的币，即使是热门币也是。然而，你可以支付一小笔费用从你的钱包导入币，而无需切换你的加密交易所。\n\n\
  例如，假设你正在使用 `Coinbase`，并且想用你在 `Coinbase` 钱包中的比特币来尝试交易 Cardano（`ADA`）。遗憾的是，`Coinbase`\
  \ 没有列出 `ADA`。你可以寻找另一个提供 `ADA` 的加密交易所，比如 `Binance`。你不需要向 `Binance` 账户存入法币来购买比特币然后交易\
  \ `ADA`。`Binance` 提供了从 `Coinbase` 导入钱包的选项，所以你可以直接在 `Binance` 用比特币购买 `ADA`。当然，会有一小笔费用，但这比在\
  \ `Binance` 创建账户时支付入金费用要好。\n\n## 寻找理想的加密货币\n\n接下来，你需要设定一个目标。你应该投资哪种加密货币？这取决于你的目标。大多数人想赚更多钱，所以他们认为投资比特币是正确的选择。他们说的没错。比特币是目前最大最流行的加密货币。你只需要买一些比特币并一直持有直到价格上涨，然后卖掉并获利。\n\
  \n但是，加密货币投资中投资和获利的方法比这多得多。上述方法可行，但速度较慢。此外，某些币的用途比这更大，你可以用它们来投资初创公司或 ICO。\n\n**比特币\
  \ (BTC)**\n\n\n\n比特币由中本聪（Satoshi Nakamoto）于 2009 年发布。它是目前市场上最大、最流行的加密货币，因为它是人类第一个加密货币。尽管其背后的技术相当复杂，但对于普通用户来说，通过比特币支付正变得越来越简单。他们使用数字钱包来发送和接收支付，而货币本身列在几乎每一个加密交易所。截至目前，越来越多的商家开始接受比特币，例如微软、赛百味（Subway）等。\n\
  \n尽管如此，虽然比特币被认为是开创区块链技术和 `Altcoins`（代币）的首个加密货币，但它确实存在缺点。例如，由于区块大小的限制，它同时只能处理有限的交易。平均它每秒能处理七次交易。然而，在给定秒内需要处理的交易远多于七次。最终，验证一次交易可能需要九到十分钟。\n\
  \n相比之下，Visa 每秒可以处理数千次交易。在交易处理方面，比特币被认为相当缓慢。其他加密货币则形成了增加区块大小和其他巧妙方法来提高交易速度。\n\n继\
  \ 2020 年减半后，比特币价格目前处于上升趋势。然而，无法预知价格是否会继续上涨。它可能仅仅遵循 2016 年的趋势并很快暴跌。虽然加密货币绝对会存在下去，但没有人能确定比特币会成为最大的加密货币。`Ethereum`、`Zcash`\
  \ 和 `Dash` 都比比特币具有更高的匿名性、更快的交易速度和更多的功能。\n\n## 以太坊 (Ether, ETH)\n\nEther 或 `ETH`\
  \ 是一种基于 `Ethereum` 区块链的加密货币。在人气方面，它仅次于比特币。有些人认为，得益于多功能性，以太坊将超越比特币并成为市场上的主导加密货币。当然，你可以像投资比特币这样的数字资产一样投资以太坊，但\
  \ `Ethereum` 平台也是代币开发的所在地。\n\n`Ethereum` 平台允许你创建智能合约和代币来为你的 `ICOs`（首次代币发行）助力。Ether\
  \ 将用于平台上的交易。简单回顾一下智能合约的功能，它主要是你 Excel 表格中的 `if-then` 函数。例如，当满足预设条件时，智能合约就会执行相应的合同条款。\n\
  \n例如，假设你是一家制造和销售智能手机的公司，你与供应商和运输公司合作。你想确保你的手机制造得当且准时，并且没有违反劳动准则（即工作期间没有无所事事），并且所有都能准时收到付款。为了实现这一点，你需要与工人以及你合作的公司签订大量合同。\n\
  \n但是，如果你在区块链中使用智能合约，它会加速整个过程，并让所有方变得便利，而不会损害可靠性。那么，在这种情况下它是如何运作的呢？\n\n从你公司与运输公司之间的合同开始。当卡车来工厂提取手机时，流程开始了。公司在将箱子装上卡车之前会扫描。扫描会更新区块链网络上的条目，通知双方已提取特定数量的产品。这会激活智能合约中的条款，该条款将从你公司释放资金发送给运输公司。不需要发票。\n\
  \n涉及到你与工人之间的劳动合同，系统的工作原理也类似。当他们上班时，他们会扫描卡片，第三方将进行验证，以确保不违反劳动方针。\n\n## 其他热门加密货币\n\
  \n还有其他提供各种功能的加密货币，涵盖每一个是不可能的。由于由于原因，我们只介绍迄今为止最受欢迎的一些币种。最好的方法是你自己进行研究并寻找你想要投资的币种。\n\
  \n第一个是 `Litecoin`（莱币），于 2011 年发布。Litecoin 基本上是比特币的简化版本，因此得名。它是一种开源、去中心化且由加密支持的加密货币。开发者声称\
  \ Litecoin 将是比特币黄金的白银。Litecoin 的交易确认率比比特币快。\n\n`Dash` 于 2014 年发布，但当时名为 `Darkcoin`。它很快更改了名称，并益于其去中心化的主代码网络为用户提供了更多的匿名性。这得益于其区块链网络上的\
  \ `Masternode`（主节点），它形成了一个比比特币更稳健的基础。\n\n`Zcash` 在于 `Dash` 之后推出。它对于整个加密货币市场来说还很新，但有些人说\
  \ Zcash 由于利用了 `zero-knowledge SNARKS`（零知识证明），因此为其用户提供了完全的匿名性。简单来说，它完全不记录交易。它确实会验证交易、加密信息并防止双重支付。\n\
  \n`Monero`（门罗）对隐私有独特的见解。例如，它通过使用一种名为“环签名”（ring signatures）的特殊技术实现了完全匿名。它的运行良好，以至于在暗网用户中变得流行。\n\
  \n`Ripple`（瑞波）于 2012 年发布，以极低的成本提供几乎实时的国际交易。Ripple 没有使用许多其他加密货币使用的挖矿技术，而是使用共识账本，允许无需挖矿即可验证交易。这意味着验证交易所需的计算能力较少。\n\
  \n## 为自己准备一个加密钱包\n\n从书开始，我们就反复提到了：数字钱包/加密钱包。它是什么？钱包是一个允许你存储硬币的应用程序。它同时也作为接收硬币的一种。\n\
  \n加密钱包是你可以在手机或电脑上运行的应用程序。但如果你觉得这个想法对你来说太抽象，想要一些更具触感的东西，你可以买一个硬件钱包，或者一个运行钱包 App 的设备。\n\
  \n数字钱包的工作方式并非你想的那样。你可能认为你的硬币存储在加密钱包里，就像 U 盘上的文件一样。事实并非如此。存储在钱包中的数据只是指向货币在区块链网络和公共账本中的位置。\n\
  \n尽管如此，你为什么需要钱包？比特币和 `Altcoins` 的核心理念是作为去中心化货币，让普通人对自己的资金拥有完全控制权。你存入银行的钱会被投入其他领域以盈利。基本上，银行是从你那里借钱来开展其他业务。只是这次，他们控制着给多少利息。\n\
  \n所以，你得到的是一张欠条（IOU）或一个银行会根据要求还钱的承诺。唯一的问题是并非总是如此。在经济达到某些点时，银行没有足够的资金还给客户。因此，很多人因此损失了金钱。\n\
  \n\n\n理想情况下，拥有两个钱包：热钱包和冷钱包。热钱包连接到互联网，而冷钱包通常是离线状态。在交易所持有钱包是可以的，但你应该只在需要使用时才在里面存放硬币。一旦完成，你应该将所有硬币移动到冷钱包。\n\
  \n冷钱包是一种硬件钱包，与互联网隔离开。这可能是存储硬币最安全的方法。毕竟，黑客无法攻击未连接到互联网的设备。尽管如此，维护硬件钱包可能会很困难。你需要确保你的私钥是安全的，并且只有你本人可以可以访问。\n\
  \n除此之外，你还需要练习所有的在线安全操作程序，例如激活双重身份验证以及不点击可疑链接。我们已经在第一书中详细介绍过这些内容。\n\n另一个需要注意的是是，某些钱包只能持有特定的加密货币。例如，比特币钱包只能持有比特币，不能持有以太坊。因此，你只能发送和接收比特币。市上有一些允许你存储不同币种的钱包，但请确保它们与你打算拥有的币种兼容。\n\
  \n# 了解加密货币交易与交易所\n\n在本节中，我们将快速介绍如何发送和接收加密货币。我们已经讨论过私钥和公钥。公钥是你与他人共享的信息，以便他们将硬币发送到你的钱包。私钥是你用于访问钱包和硬币的密钥。\n\
  \n所以，要发送硬币，请登录你的钱包并选择发送。请记住，硬币传输仅在同一区块链网络内有效。换句话说，你只能为钱包发送和接收相同的币种。例如，你只能发送或接收比特币，因为交易发生在比特币区块链网络上。\n\
  \n之后，你只需输入接收者的公钥或公钱包地址，并选择你想发送的金额。请记住，取决于你处理的加密货币，你可能需要支付一些交易费用来“润滑引擎”。一旦金额和地址正确，你就可以发送硬币了。\n\
  \n这是交易中最危险的部分。因此，在点击“发送”之前，务必三遍地址。使用二维码 或直接复制地址而不是手动输入将有助于你避免将硬币发送到错误的地址。你可能还可以给接收者写简短备注，让他们知道他们为什么收到了你的硬币。\n\
  \n从别人那里接收硬币要容易得多。你只需要向发送者分享你的公钱包地址即可。有些加密钱包会生成对方可以扫描的二维码 ，这样他们就不必费力输入你的整个地址。\n\n\
  除此之外，请记住，交易可能需要一些时间。硬币通常是瞬时发送的，但在网络拥堵的情况下，也有过交易需要数小时的情况。\n\n# 加密货币交易所基础\n\n在本节中，我们将讨论加密交易所。它们基本上是你购买、卖出或将硬币兑换为其他货币或法币的地方。因此，它们是促进买卖过程的中间机构，并为其工作收取一定的费用。\n\
  \n加密交易所有两种。你有中心化加密交易所（CEX）和去中心化交易所（DEX）。两者各有优缺点。请寻找适合你需求的加密货币。\n\n## 中心化加密交易所\n\n\
  中心化加密交易所是最受欢迎的选择。当你购买或卖出加密货币时，它们充当第三方角色。这些交易所由公司运营和控制。它们通常更可靠，用户统计也证明了这一点。99% 的加密货币交易发生在中心化交易所。这些包括\
  \ Coinbase、Gemini、Kraken 和 GDAX。\n\n使用中心化加密交易所有几个优点。首先，在界面和内部运行机制方面都对用户友好。它的运行方式非常像外汇交易平台。因此，它提供了一个熟悉的界面，让初学者能够更快地融入加密货币交易。\n\
  \n用户只需登录，查看其账户余额，然后直接通过应用程序或网站进行交易。之后无需任何额外的设置。\n\n此外，中心化交易所同样可靠。讽刺的是，对于去中心化货币，拥有中心化交易所反而为用户的交易提供了另一层保护和可靠性。高度开发且稳健的平台给用户带来了更高水平的舒适感。\n\
  \n尽管如此，中心化加密交易所也有不少问题。\n\n首先，存在黑客攻击风险。这些交易所由公司运营，公司对客户的硬币负责。它们通常在一个地方存放价值数十亿美元的硬币，这使其成为黑客的首要目标。\n\
  \n然后是交易费用的问题。再次，这些加密交易所的运作完全背离了加密货币的初衷。加密货币的初衷是消除中间环节、降低交易成本、提高交易速度，并通过作为去中心化的数字资产提供匿名性。\n\
  \n加密交易所是黑客的首要目标，因为它们将所有硬币存储在一个地方，充当中间人，并且收取交易费用。它们的收费费率取决于你交易的金额，因此在决定之前请确保阅读相关信息。\n\
  \n一些最流行的中心化加密交易所包括币安 (Binance)、Coinbase、Bithumb、Bitfinex、火币全球 (Huobi Global)、Bitstamp、FTX、bitFlyer\
  \ 和纽币 (KuCoin)。\n\n## 去中心化加密交易所\n\n另一方面，还有去中心化加密货币交易所。这些交易所不受任何公司的控制。它们基于点对技术运行，允许在不需要第三方的情况下进行交易。1%\
  \ 的加密货币用户倾向于这种形式的交易所，因为中心化交易所存在某些问题。Blocknet、io、Barterdex 和 AirSwap 是一些去中心化交易所的示例。\n\
  \n虽然不流行，但去中心化交易所提供了中心化交易所无法提供的。\n\n它最大的优势之一是黑客风险，对于去中心化交易所来说，这种风险几乎为零。在这种交易所中，硬币不需要经过第三方。只有发送者和接收者。因此，没有黑客可以攻击的公司或组织。只是一群人之间进行交易。\n\
  \n去中心化交易所还可以防止市场操纵。由于它是基于点对点运行的，它可以保护用户免受自售交易和虚假交易的影响。\n\n然后是让加密货币如此强大的匿名性。在中心化交易所，你必须告诉他们你的姓名、银行详情、身份证文件等。用户在去中心化交易所开始时无需填写任何表格。不需要共享任何隐私信息。\n\
  \n那么，缺点是什么？\n\n首先，去中心化交易所对用户并不友好。你必须记住密钥以及钱包密码，否则将面临丢失那里所有资金的风险。还需要熟悉平台和流程，这需要一些时间。中心化交易所让即使是不精通技术的人也能让一切变得简单且方便。\n\
  \n去中心化交易所也没有给用户提供将硬币兑换为法币的能力。因此，除非你已经在钱包中有了加密货币，否则进入去中心化交易所将不那么方便。\n\n\n\n\n当你想要变现你的币时，这引发了另一个问题。你仍然需要将它们转移到中心化交易所，以便将你的币转换为法货币。这个过程会产生服务费。尽管如此，这至少比在交易的每一步都要收取费用要好。\n\
  \n最后，是流动性问题。这是因为中心化交易所要流行得多。因此，你可能寻找你心仪的币种的买家或卖家可能会遇到困难。考虑到目前有如此多的币种，很显然这可能会成为一个问题。\n\
  \n如果可以的话，在过渡到去中心化交易所之前，先熟悉中心化加密货币交易所可能对你更有利。如果你正在寻找这类，一些最受欢迎的交易所包括 Venus、Uniswap、Tokenlon、ox\
  \ Protocol、Sishiswap、BurgerSwap、Compound、Curve Finance、1inch Exchange 和 PancakeSwap。\n\
  \n## 关于经纪人的话题\n\n最后是加密货币经纪人。在任何可以交易任何东西的地方，你都能看到这些人。由于加密货币已被证明是一种非常受欢迎的交易工具，在这个领域存在经纪人也是合合理的。\n\
  \n加密货币经纪人是生态系统中的另一个参与，他们是你（客户）与加密货币市场或交易所之间的中间人。那么，它与加密货币交易所有什么区别呢？\n\n其实，并没有太大区别。它只是系统中的另一个环节。有时，这些经纪人会买入币，并以设定的价格提供给他们的客户。换句话说，他们的功能与加密货币交易所相似，除了加密货币交易所的费用外，你还需要处理另一笔交易费。\n\
  \n### 为什么考虑使用加密货币经纪人？\n\n再次，由于加密货币的核心在于去中心化和降低交易成本，你为什么应该考虑注册经纪人平台呢？毕竟，他们会因为使用他们的平台而收取溢价。\n\
  \n### 适合初学者\n\n首先，加密货币经纪人提供了最用户友的环境。即使是那些不精通技术的人也能理解界面并轻松地开始交易加密货币。\n\n你的经纪人还可能以经纪人设定的相对稳定的价格提供加密货币。如果你只进行小额交易，他们也是更好的选择。他们还为用户提供了币转换为某些法货币的能力。\n\
  \n注册过程非常简单。你只需要注册、验证你的身份和账户，选择一种支付方式，就可以立即开始。\n\n### 广泛的服务\n\n在促进交易方面，你的加密货币经纪人可以为你持有币，以防你不想处理第三方钱包等问题。这是人们倾向于通过经纪人交易的最原因之一，因为他们交易时不需要处理安全问题。与容易受到黑客攻击和盗窃的加密交易所不同，加密货币经纪人将其客户的币存储在他们的\
  \ `Trezor` 和 `Ledger` 硬件钱包中，这提供了防止网络攻击的并增强了用户的信任。\n\n一如既往，当你寻找与哪个加密货币经纪人合作时，务必从最流行、最有能力的平台开始。你的经纪人应该拥有顶级的安全性，同时符合当前的国家法规。他们还应该是\
  \ 24/7 全天候服务的，以便你随时随地可以进行交易，并在需要时获得支持。此外，除了桌面端，他们还应该有移动平台。\n\n### 你需要经纪人吗？\n\n简短的回答是不。不需要，你不需要加密货币经纪人来交易加密货币。你可以亲自在交易所进行，他们提供了更好的交易工具来帮助你的交易游戏。你最多需要的一个可以方便买卖加密货币的加密货币交易所。\n\
  \n你的经纪人在向你提供服务时，可能有不同的利益。这从持续的 GameStop 股票问题得到了完美说明。简而言之，一些经纪人平台阻止人们买入股票，以保护上方的对冲基金。`Robinhood`\
  \ 就是这种恶意行为的负罪者。\n\n由于加密货币交易完全取决于去中心化和匿名性，你需要一个你可以信任的平台。当没有第三方来监管和撤销交易时，信任非常重要，而这在加密货币中简单是不可能的。\n\
  \n你只需要使用一个具有良好功能的加密货币交易所来帮助你。不多不少，也不止。那里有很多加密货币交易所为你提供你可以信任的强大工具。\n\n你有许多方法可以判断交易所是否值得你花时间。它们应该提供高水平的流动性、低差价费、低购买和提现限额、高交易量、顶级的安全性、保险以及易用性。\n\
  \n这里的差价（Spread）简单指的是买卖价格之间的差。这是你的交易所赚钱的方式。当你卖出币时，交易所会从你那里买入，然后立即以稍高的价格卖出并赚取差价。相反，当你买入币时，交易所以高于他们买入时的价格卖给你，他们也可以从中获得一小笔利润。理想情况下，你希望差价越小越好，以实现利润最大化。\n\
  \n功能在这里非常重要。有些交易所为你提供无价的工具，如止损和止盈。这些工具帮助你在价格出现不利波动时退出市场以将损失减少到最低，并让你在特定的价格点变现。这大多是自动化的，所以你不需要坐在那里盯着屏幕整天。\n\
  \n一旦你找到了想使用的交易所，只需注册、买币并开始交易。重复这个过程，你离开时可能比进去时多得钱。这需要时间和耐心，但最终是完全值得的。\n\n\n\n\n\n\
  # 交易加密货币\n\n让我们从加密货币交易开始。这在很大程度上与外汇（Forex）相似。如果你擅长看图表，你就可以在这里获利。外汇交易的原理是在货币对之间进行交易。由于价格不断变化，你可以顺势而为。如果你时机掌握得当，就可以通过差价盈利。\n\
  \n加密货币交易的原理相同。你只需要在不同的加密货币之间进行交换，并希望在一天结束时获得更多的币。但是，由于价格波动不可预测，依靠交易加密货币来生计最多是不可靠的。你需要精准地把握交易时机。如果你是刚开始，最好在正式开始之前进行一些练习。这意味着花时间研究技术分析方法和图表。当然，这需要花费时间。\n\
  \n另一种交易方法是对价格走势进行投机。我们之前讨论过这一点，但简而言之，你只是对价格会上还是下跌进行下注。\n\n如果你认为价格会会上，你就买入币，并在价格上涨足够高时卖出。如果你认为价格会下跌，你就进行所谓的“做空”：从交易所借入币，将其卖出，在预定段时间后再次购买相同数量的币并还给交易所，从而赚取差价。\n\
  \n# 投资\n\n这有两种方法。你可以采取投机的方式，买入一些币并持有直到价格上涨然后卖出。这种方法非常简单，如果是热门币种则相对安全，但需要很长时间才能看到实质性的收益。\n\
  \n你也可以用你的币投资于项目或初创公司。你的回报是代币，它们可以授予你访问各种服务的特殊权限，甚至是公司利润份额。你甚至可以卖掉代币来赚更多的钱。\n\n###\
  \ 挖矿\n\n挖矿被认为是一种产生加密货币相当缓慢的方法，但它是以恒定进行的，不需要你花费精力。最棒的一点是，矿工是任何区块链网络不可或的一部分，因为他们是验证交易并添加到区块链的人。换句话说，对矿工的需求始终存在。\n\
  \n你只需要一台高性能电脑就可以开始。如果你是一个游戏玩家，你的设备应该足够挖掘加密货币。不过，这是一个高耗能的过程，所以你的电费会飙升。风险就在这里。\n\n\
  你想挖掘有价值的币。只有那些币才值得你投入时间。曾有关于矿工花费的电费比赚的钱还多的故事，所以你想实现利润化。\n\n# 投资加密货币\n\n十年前，大约在 `Bitcoin`\
  \ 开始露面的时候，如果你告诉某人你的投资组合的一部分是加密货币，人们会当着你的脸大笑。他们甚至会告诉你你根本不知道如何投资，并可能在背后说你的坏话。\n\n\
  毕竟，你大约需要一万个 `Bitcoin` 才能在 `Papa John’s` 买一个意大利腊披萨。当然，这当时不会被视为一种可行的投资选择。但那是十年前了。\n\
  \n快回到现在，人们说如果你还没有投资加密货币，你就入场晚了。如果你没有，他们可能会当着你的脸大笑并对你说难听的话。\n\n无论你是否愿意，加密货币将一直存在。越来越多的企业正在寻找让加密货币变得有用的方法。换句话说，加密货币可能会变得主流。尽管如此，你应该投资加密货币吗？意见仍然分歧，答案取决于你问谁。\n\
  \n# 为什么你应该考虑投资加密\n\n`Gemini` 的产品管理副总监 `Claire Lovell` 表示，`Bitcoin` 达到了历史新高，就像在 `2016`\
  \ 年一样。暗示这次价格不会崩溃的差异在于，金融机构和企业现在正致力于寻找将加密货币纳入其支付系统的方法。\n\nLovell 说，加密货币让人们在财务上拥有更高水平的独立、机会和选择。加密货币提供了一个去中心化的开源的金融系统，通过直接面向消费者，解决了我们当前金融体系存在的许多缺陷。简单来说，这意味着买入、卖出、存储和交易加密货币比以往任何时候都容易。\n\
  \n\n\n\n\n投资诸如 `Bitcoin` 这样的新投资工具具有巨大的潜力，因为它在未来可能成为非常重大的事物。损失呢？虽然有些人会说损失也将是巨大的，但请记住，你损失的钱不会超过你投入的金额，因为价格不会跌成负数。它最低会变为零，届时产生的损失将是你投入到\
  \ `Bitcoin` 或山寨币（Altcoins）的全部金额。\n\n## 反对加密货币的理由\n\n尽管如此，并不是所有人人都认为投资加密货币是一个好主意。至少，他们认为普通投资者不应该关注加密货币投资。这有几个原因。\n\
  \n最重要的一点仍然是价格波动。虽然随波逐流很有趣，但这种价格波动绝对不适合心软的人。目前还没有足够的法规来防止我们在其他市场中看到的欺诈或盗窃。\n\n黑攻击仍然是加密货币生态系统中的主要威胁。区块链网络几乎是不可破解的，但生态系统的其他部分，如数字钱包和加密交易所仍然特别脆弱。黑客可以进入并偷走你所有的币，一旦这种情况发生，你几乎无能为力。\n\
  \n此外，事实是加密货币并不是你唯一的有的投资选择。除非你真的非常讨厌现在的金融系统，否则还有其他方法可以利用你的资金，而无需应对上述威胁。\n\n例如，如果你想投资某些东西并希望价格上涨，还有股市市场。它的投机行为在这里都是那样的，只不过价格稳定得多。如果你想投资初创公司，名下拥有一些代币似乎很有吸引力，但这仅仅是一种更方便验证你的贡献并享受承诺福利的方法。在不使用代币的情况下，还有其他方法可以做到。\n\
  \n## 挖掘加密货币\n\n如果你对交易或投资加密货币不感兴趣，那么你总是可以尝试接触加密挖矿。正如之前提到的，市场一直对矿工的需求，因为他们是让整个区块链网络运行的人。由于没有中央机构来验证交易或其他任何事情，任务就落在了他们身上。\n\
  \n每个区块链网络都必须有矿工。他们使用计算机来解决复杂的数学问题以验证交易。作为奖励，矿工将获得少量的加密货币。你从挖矿中获得多少币取决于币的种类。\n\n\
  我们之前提到过 `Proof of Work`，但挖矿有两种类型。它们是 `Proof of Work` (`PoW`) 和 `Proof of Stake`\
  \ (`PoS`)。这两种挖矿类型使用共识算法验证交易并更新账本。\n\n### 工作量证明\n\n简单来说，`Proof of Work` 共识模型要求矿工解决数学问题。这是\
  \ `Bitcoin` 的系统，但它需要大量的计算能力。他们是在计算什么呢？矿工生成所谓的“哈希”（hash），它将输入转换为随机的字母和数字字符串。其想法是找到匹配目标的正确字符串。\n\
  \n如你所见，概率非常低。然而，考虑到计算机在给定秒内执行这些计算的速度有多快，这并非不可能。事实上，矿工的设备每秒可以产生数万亿次计算。因此，他们平均需要九到十分钟才能找到正确的那个。\n\
  \n问题是，它只奖励第一个完成验证的人。这意味着，谁先生成正确的那个谁就拿走了币，所以并不是每个人都是获胜者。你可以说这种竞争是公平的，但它不是人类与其能力之间的竞争。它完全取决于人们是否拥有更好、更昂贵的硬件。\n\
  \n例如，`Bitcoin` 网络中存在 `ASICs`，它们是争议的焦点。`ASICs` 是在挖币方面表现非常好的专用设备。它们确实很贵，但它们挖币的速度是任何其他机器都无法竞争的。因此，它们在生态系统中的存在意味着除了拥有\
  \ `ASICs` 的人之外，没有人能通过挖币生存。\n\n此外，该系统还有其他问题。第一个也是最明显的问题是能耗。由于 `PoW` 系统，挖掘 `Bitcoin`\
  \ 的平均能量消耗与瑞士相当。随着越来越多的矿工加入生态系统进行挖币，能源消耗只会增加。\n\n此外，尽管加密货币的核心是去中心化，但该系统仍存在中心化元素。例如，如果一个挖矿实体可以接管整个区块链网络哈希率的\
  \ `50% + 1`，那么所有者就可以双重花费、阻止交易或临时扭曲规则。然而，对于像 `Bitcoin` 这样较大的加密货币来说，这是极可能的。\n\n有时，问题并不集中在某个人身上。系统在某种程度上是中心化的，因为少数矿池已经控制了\
  \ `Bitcoin` 约 50% 的计算能力。目前，开发者正在努力缓解这个问题。\n\n### 权益证明\n\n`Proof of Stake` 的工作原理是让矿工（在这种情况下称为“验证者”）质押他们部分\
  \ `Ether`。这部分金额将被冻结，在验证者参与权益证明过程中，不能用于任何地方。当他们质押 `Ether` 时，他们就让自己可以被选中提议将新区块添加到链中。\n\
  \n选择过程完全是随机的。一旦被选中，其他验证者会证明他们看到了该区块。一旦收集到足够的该区块证明，该区块就会添加到区块链中。\n\n当验证者对新区块进行证明并称其准确且符合规则时，他们将获得奖励。仅如此。然后，他们将获得少量币。被选中提议区块的人也会获得奖励。\n\
  \n当然，人们很容易看出这个系统如何被滥用。这就是为什么对违反规则的行为有惩罚措施。如果验证者提议包含虚假历史或交易的区块，他们的质押将被没收，并被禁止进入网络。但对于在被选中提议区块时离线等较小违规，也有相应的较小处罚。\n\
  \n`PoS` 共识模型的最大优势在于它消耗能量更少。事实上，你不需要太担心硬件投资或电费。这使得这种挖矿方法对普通人更容易。你只需要一台可以运行的计算机和稳定的网络连接。\n\
  \n你唯一的投资是投入一定数量的加密货币以获得成为验证者的资格。但如果这对你来说仍然太多了，还有质押池。这些是人们将币组合在一起，由该池子代表大家进行质押。奖励将根据他们对池子贡献的比例进行分配。因此，你只需要投入一点币就可以和他们一起开始了。如果你只对池子贡献一点币，就不要指望获得很多报酬。\n\
  \n\n\n\n\n质押多少硬币也是很有趣的。至少对于以太坊而言，起始成本是 32 ETH（以太坊）。质押这么多太坊将为你提供“一个”验证者。如果你想质押更多，你需要再投入\
  \ 32 ETH，这将为你提供另一个验证者。你不能质押 33、34 或 63 ETH。你需要以 32 的倍数进行，每 32 个就能获得一个验证者。如果你有多个验证者，你的机会也会随之增加。拥有\
  \ 10 个验证者使得你被选中的概率是仅拥有一个验证者的十倍。\n\n这也是质押池流行的另一个原因。人们投入少量的以太坊，池汇聚的以太坊可以让他们获得许多验证者。这意味着，质押池可以同时运行几十甚至上百个验证者，这极大地提高了池被选中的概率。\n\
  \n## 挖矿硬件\n\n我们之前提到过挖矿硬件，那么它是什么呢？实际上，它可以是你家里已经拥有的简单电脑，也可以是可以以惊人速度产生硬币的专用机器。我们在上一书中介绍过这一点，请查阅该书以获取更多细节。但这里有一个快速的复。\n\
  \n挖掘加密货币有多种方法。你有`CPU 挖矿`、`GPU 挖矿`、`云挖矿`和 `ASIC 挖矿`。前两种仅利用你已经拥有的计算机硬件，而后两种让挖矿变得更有趣。\n\
  \n## CPU 挖矿\n\n让我们从`CPU 挖矿`开始。`CPU 挖矿` 简单地使用你的计算机处理器来挖掘加密货币。它最初是挖掘加密货币的最佳方式。但随着技术的进步和对加密货币更深入的理解，这很快就过时了。\n\
  \n这主要有两个原因。首先是`CPU 挖矿` 速度太慢了。你实际上可以让它运行几个月而产生产生实质性的收益。就是糟糕到这种程度。然后，还有电力和冷却的问题。你的\
  \ `CPU` 加热非常快，如果你在没有强力冷却设备的情况下让它进行加密挖矿，在运行 15 分钟后，你可以在上面煎一个鸡蛋了。\n\n尽管如此，至少`CPU 挖矿`\
  \ 是最容易获取的选项，因为每台电脑都配有 `CPU`。所以，如果你真的想尝试（尽管非常不建议这样做），你可以使用你的 `CPU` 开始加密挖矿。你只需要一些软件就可以开始并就绪。`CPU\
  \ 挖矿` 会让你入门，但很可能在短期内无法让你取得性进展。\n\n## GPU 挖矿\n\n`GPU 挖矿` 可能是目前最流行的加密挖矿方法。这是因为 `GPU\
  \ 矿机`（GPU rigs）可以以可观的速度产生硬币，而不需要花费太多钱。在 Google 上快速搜索“加密货币挖矿”，你很会在搜索结果中看到 `GPU 矿机`。\n\
  \n`GPU 挖矿` 比 `CPU 挖矿` 效率得多且更便宜。当然，`GPU 挖矿机` 的初始投资可能很贵，但它处理的内容比单靠你的计算机处理器多得多。\n\n\
  `GPU 矿机` 由主板、处理器、矿机框架、冷却系统和一些显卡组成。有些可能只有少量的两个 `GPU`，而另一些在框架内装了八个。\n\n一台不错的 `GPU\
  \ 挖矿机` 大约要花费你 3,000 美元。这可能是一笔巨额投资，但请记住，它的回本速度会比 `CPU 矿机` 快得多。如果你正考虑认真对待加密挖矿，这是一个极佳的起点。\n\
  \n同样值得注意的是，某些显卡公司（如 `Nvidia`）正在推出专门为挖矿而设计的显卡。如果一张显卡没有显示输出端口，你就可以判断它是一个矿用显卡。\n\n\
  新系列矿用显卡的引入引起了想要升级电脑的游戏玩家的愤怒。这里的问题是，在写此时，全球制造 `GPU` 所需的芯片处于短缺状态。\n\n`Nvidia` 的 `3000\
  \ 系列` 显卡已经被黄牛抢购，他们将以加价的价格进行转卖。因此，这些显卡的供应已经非常低。`Nvidia` 并没有将更多供应投入到制造更多显卡中，而是决定利用其手中仅有的少量供应来创建矿用显卡。这被视为一种追逐最新加密货币趋势的举措，人们对此并不非常开心。\n\
  \n`Nvidia` 还在通过简单降低哈希率来阻止人们使用他们最新的 `3000 系列` 显卡进行挖矿，这基本上减慢了这些显卡的挖矿速度。所以，如果你正在购买矿用显卡，务必查看哈希率。\n\
  \n## 云挖矿\n\n但假设你的电脑很烂用。你那台 2000 年代初的 `Intel` 处理器无法同时运行最新的 `Windows Media Player`、`Google\
  \ Chrome` 和 `Microsoft Word` 而不达到沸点温度。你恰好处于一个困境，没有足够的资金购买矿机。然而，你又进入加密挖矿的游戏。你会有什么选择？\n\
  \n有`云挖矿`。它是挖掘加密货币最流行的方法，你只需要付出很少或毫不努力。想法很简单。一些很有钱的人决定把挖掘加密货币作为生意。所以，他们购买了一大堆 `GPU\
  \ 矿机` 并让人们租用它们来挖掘加密货币。就是这么简单。\n\n许多`云挖矿公司`通常拥有巨大的设施，在电力廉价地区设有多个矿场。他们的矿场通常有成百上千的\
  \ `GPU 矿机` 堆叠并运行。提供云挖矿服务的人通常精通技术并非常了解如何挖掘加密货币。\n\n鉴于你可以租用设备，很难理解为什么它现在如此流行。如果你没有足够的资金，或者电脑性能不足，或者对拥有矿机不感兴趣，那么`云挖矿`\
  \ 是你的最佳选择。你真正只需要一些资金和网络连接。\n\n`云挖矿` 在某些提供商那里可以是免费的。你可能认为这是一个更划算的交易，但通常伴随着缓慢的挖矿速度、额外的条件等。此外，他们设计了从最便宜到最贵的方案，带有不同的益处。你可能需要支付\
  \ 500 到 5,000 美元。\n\n这听起来可能贵，而且确实如此。你并不永久拥有矿机。它有一个期限，通常持续几年。你可能从提供商那里获得终身交易，但你可能需要支付额外的资金。这就是便利的代价。\n\
  \n说到价格，你是如何收款的？你只需要在提供商处注册账户，付费并输入你的加密货币钱包代码，就可以了。在租赁期内，你的设备产生的所有收益都会发送到你的钱包。至少是扣除电力和维护成本后的剩余价值。\n\
  \n平均而言，预计`云挖矿` 在六个月到一年内回本。从那时起，你就开始积累利润。但这只是一个平均估计，因为硬币价格往往会波动。\n\n## ASIC 挖矿\n\n\
  最后，我们有`ASIC 挖矿`。`ASIC` 是`专用集成电路`。这些是专门为挖掘加密货币而创建的特殊设备。这些是挖掘加密货币最强大的矿机。它们非常快，让 `GPU`\
  \ 和 `CPU 矿机` 望尘莫及。\n\n\n\n\n现在，你可能在想，既然它们如此优秀，为什么它们不像 GPU 矿机那样流行呢？那是因为它们实在太强大了。\n\
  \n当 `ASIC` 公司推出他们的矿机时，加密货币社区中引起了骚动。他们想要禁止这些东西，因为它们太强大了，以至于其他矿工完全没有竞争能力。这意味着 `ASIC`\
  \ 所有者可以囤积所有的币，因为其他矿工根本跟不上如此之高的哈希率。\n\n这样想：如果大部分收益都流向了少数有足够资金建立 `ASIC` 农场的矿工，你认为会发生什么样的混乱？他们不仅可以独占所有代币，还可能潜在性地控制加密货币区块链网络，因为他们可以验证网络上\
  \ 50% 以上的交易，因此从技术上讲可以控制整个网络。\n\n尽管如此，如今对 `ASICs` 的普遍情绪已经不再那么刻薄了，而且它们正逐渐变得更加负担负担。事实上，越来越多的人正在转向使用\
  \ `ASICs`。市场上有很多针对特定任务的 `ASIC` 设备。这既是它的优点，也是它的缺点。\n\n你要知道，`ASIC` 设备是为了挖掘特定币而制造的。根据其设计，它们可以挖掘多种不同的币，也可以只挖掘一种币。这完全取决于它使用的算法。所以，如果你的\
  \ `ASIC` 矿机只能挖掘一种加密货币，而随后挖掘算法发生了更新，那么你最终将得到一个昂贵且没有转手价值的纸镇。\n\n`ASIC` 矿机也消耗大量的电力，即使是效率最高的设备，运行起来也会相当热且噪音很大。前期投入、小众应用以及缺乏转手价值，使其在作为矿机建议时很难被推荐。\n\
  \n对于 GPU 矿机，你至少在挖完矿后可以将显卡用于你的电脑，或者将其转卖给那些想要升级电脑的玩家。对于 `ASIC` 矿机，你不能这么说。\n\n然而，另一个危险正迫在眉睫。有些人开始挖掘除\
  \ `Bitcoin` 以外的加密货币。具体来说，他们正涌向 `Ethereum`，因为其更新了共识模型——`Proof of Stake` (`PoS`) 系统，该系统不需要大量的算力即可挖掘。这意味着消耗的电力更少，在昂贵的矿机上花费的钱也更少。\n\
  \n但也许这将为拥有 `ASIC` 矿机的 `Bitcoin` 矿工创造机会，因为竞争者变少了，当人们开始迁移时，他们可以开始获利。只有时间会给出答案。\n\n\
  ## 应该挖掘什么加密货币？\n\n如前所述，你希望尽可能从你的矿机中榨取更多价值。这意味着挖掘正确的币，以便你可以将其卖掉并大赚。但应该挖掘哪些币呢？\n\n\
  嗯，这很简单。去挖掘价值最高的币。这意味着 `Bitcoin`、`Dash`、`Ethereum`、`Litecoin` 等。只需去 `Coinbase` 或\
  \ `Binance` 查看列表上价值最高的币即可。这应该让你对从哪里开始挖掘有一个良好的思路。\n\n另一个值得注意的有趣点是你使用什么种矿机来挖掘加密货币。例如，如果你有一台矿机，或者与云矿矿服务提供商达成了交易，你完全可以开始挖掘\
  \ `Bitcoin`，因为它们使用 `PoW` 共识模型。尽管如此，挖掘 `Bitcoin` 可能会很，因为它太流行了，每个人都想分一杯 `Bitcoin`\
  \ 蛋糕。全球的矿工都会进入网络中少数几个矿池，并试图抢夺少量的币。你可能需要等待几个小时，才能看到第一笔 `Bitcoin` 流入。\n\n然而，如果你对拥有和维护矿机不感兴趣，或者负担不起一台，你可以寻找使用\
  \ `PoS` 共识模型的币。那么 `Ethereum` 将是完美选择，但你现在想先保留这个想法，因为它们仍在进行改造。`Ethereum 2.0` 将 `PoS`\
  \ 共识模型整合到它们的网络中，并定于 2021 年或 2022 年全面推出，所以请保持关注，一旦一切就绪就加入其中。这可能是你的最佳选择。\n\n现在，你可能在想，如果选择那些不流行的币并开始挖掘它们会怎样，因为竞争者会更少。你完全可以这样做，也许可以在不消耗太多能量的情况下产相当数量的币。那么问题在于币价。\n\
  \n`Bitcoin` 单项就占据了总市值的 50% 以上，每币价值超过 55,000 美元。`Ethereum` 位第二，每币仅超过 2,000 美元。你可以清楚地看到这两种币之间的价格差异，而且列表越靠后，价格就越低。\n\
  \n也许你可以忍受这种低价。只要你产生大量的币，无论如何你都能获得所有利润。但那里有功耗、时间和安全问题需要考虑，取决于取决于加密货币使用的是 `PoW` 还是\
  \ `PoS` 共识模型。\n\n在使用 `PoW` 共识模型的加密货币中，你需要考虑功耗，因为你的设备需要执行大量的计算。用这种共识模型挖掘小型加密货币的问题是，这里的交易并不多，所以你可能每秒并不会产生大量的币。\n\
  \n你产生的币可能仍然比 `Bitcoin` 多，但它们的累积价值会很小，你可能在卖掉它们时遇到问题。因为再次强调，你挖掘的币并不流行，所以不会有很多人想交易它们。\n\
  \n再次，你可能对这无所谓。只要你最终能卖掉所有的币就可以了。但那时有电费问题需要考虑。不幸的是，尽管币很便宜且你可以挖掘很多，但你的矿机仍然会全负运转并消耗大量能量。你赚的币可能连电费都不够，更不用说带来利润。由于这个原因，你希望通过挖掘更流行的加密货币来充分利用你的功耗。\n\
  \n但是使用 `PoS` 共识模型的加密货币又如何？对于那种，功耗将不是问题。时间可能是问题，因为每个人都是随机的，但你可以通过获得更多验证者来增加被选中的概率。由于周围的人不多且加密货币很便宜，你不需要花费很多就能获得良好的被选中机会。但那时有安全问题。\n\
  \n我们需要理解，支撑流行加密货币的区块链网络几乎是不可破解的，因为网络上的用户数量巨大。如前所述，每个用户和矿工都会获得一个自动更新的账本。这些账本相互检查并验证对方的数据，以确保不会伪造。数据的篡改只有在有人控制了大部分节点时才可能。\n\
  \n在流行的 `PoS` 加密货币中，这是可能的，因为网络上有大量的用户和验证者。这种接管区块链需要比你想象的多得资金。然而，对于不流行的加密货币，这是非常有可能的。\n\
  \n你可以购买大量廉价币并使用它们进行质押，让你拥有大量的验证者。由于这种币并不流行，网络上不会有很多用户，所以你最终会达到拥有多数权的关键点。然后，你可以随心所欲地篡改数据并双花。对于那些想要看到世界毁灭的人来说，这没问题，但对于矿工来说并不有趣。\n\
  \n\n\n\n需要明确的是，这种威胁仍然适用于小型 PoW（工作量证明）加密货币，只是执行此类攻击的成本更高。你需要大量的资金，以及强大到足以攻击的矿机。对于攻击者来说，这非常昂贵，而且通常不划算。而在\
  \ PoS（权益证明）加密货币中，你只需要有钱。\n\n基于上述所有原因，不建议你挖掘较小的加密货币。这不值得冒险。\n\n## 加密货币挖掘的合法性\n\n\
  人们最常见的问题之一是挖掘加密货币是否合法。通常情况下是肯定的。但这取决于你的政府以及挖掘方法。遗憾的是，全球各国对加密货币的观点不同，因此答案并不是统一的“是”。\n\
  \n某些政府禁止持有加密货币，更不用挖掘或使用了。他们通常对此非常明确，所以上网快速搜索就能了解你政府对这些币的立场。\n\n至于挖掘方法，这意味着你不应该使用非法手段挖币。有些黑客会在浏览器中使用\
  \ `Javascript` 或或其他手段在你的电脑上安装恶意软件。他们并不是想要你的数据，而是想要你电脑的计算能力。这被称为 `cryptojacking`（加密货币劫持），是高度违法的。\n\
  \n此外，还需要考虑税务。在经纪商或交易所扣除所有费用以及银行转账费用后，你可能还需要处理政府的另一笔税。毕竟这是钱，你可以猜到你的政府会对分得你的战品感兴趣。\n\
  \n## 加密货币矿池\n\n在 PoW 系统中，验证区块的奖励授予第一个找到正确哈希值的矿工。然而，考虑到 `Bitcoin` 区块链网络如此庞大，你抢第一的概率极低。\n\
  \n你找到有效哈希值的概率等同于你的矿机对网络总算力贡献的比例。因此，如果你的机器只对总算力贡献了 `0.001%`，那么这就是你第一个找到哈希值的概率。这不是一个好的概率。\n\
  \n因此，矿机性能较弱的矿工实际上获得任何币的机会非常微小。因此，他们聚集在一起创建一个矿池。这意味着矿工会在网络上汇集他们的计算力来挖币。在这种情况下，如果你与几千其他人聚集在一起，总计算力可能会达到\
  \ `15%` 的份额，突然你赚钱的机会就变得相当不错了。\n\n尽管如此，矿池为每位成员进行挖掘。因此，奖励将根据你为矿池贡献的计算力按比例分配。如果矿池有几千人，每个人都能获得公平的份额。对你来说，这意味着你不会得到很多，但比你\
  \ `0.001%` 的概率要好。所以，你应该加入加密矿池。\n\n## 加密货币交易\n\n在 `Bitcoin` 刚发布时，加密货币交易并不是最热门的话题。因为当时市场上还没有其他加密货币。而现在，情况完全不同了。市场上上有超过千多种加密货币，这里的可能性是无限的。\n\
  \n交易加密货币非常简单。你将一种加密货币兑换另一种，并希望你持有的币升值。你可以在加密货币交易所进行交易，他们会收取你小笔费用。加密货币交易可能是现在最热门的话题，因为每天都有价值数十亿美元的币在交易。\n\
  \n精明的交易者运气好的话，仅仅通过交易加密货币就能大赚一场。很多人在舒适的家里全职做这项工作。但这样做需要大量的技能和对市场的了解。\n\n为了这一点，交易者使用多种工具来监控市场和价格波动。这样他们就能在正确的时间抓住正确的币。在他们的工具箱中，他们有监控之前的价格趋势的软件等。\n\
  \n这听起来可能已经让你感到压力很大，但不必担心。毕竟每个人都得从哪里开始。只要你用你愿意且负担得起损失的钱进行交易，尝试一下是没有危险的。\n\n交易加密货币有两种方式。你可以制定短期策略或长期策略。\n\
  \n### 短期交易\n\n顾如其名，短期交易涉及购买加密货币，并计划在持有短一段时间后将其再次卖出。持有多久？这取决于你。\n\n短期交易有很多优点。首先，它提供了一个很好的机会。在\
  \ `forex`（或外汇）中，价格每天的波动幅度几乎不会超过 `1%`。另外一个缺点是，如果你想看到丰厚的投资回报，就需要投入巨额资金。这是许多人并不很舒服的，尤其是初学者。\n\
  \n这里的关键在于仔细分析市场，拥有稳健的入场和退出策略，可能还要准备几个应急预案，并坚持执行而不恐慌。请记住，如果你想完成这项任务，需要保持清醒。在加密货币市场的波动中航行时，请保持冷静。\n\
  \n你一开始就能学到的一点是，你并不总是赢。存在一些你无法预测的外部因素。当你看到价格不利于你波动时，压力会很快变得非常大。所以，有时你不得不硬着头皮接受 `L`（亏损），并在损失扩大之前退出。即使是市场上最好的交易者也不是\
  \ `100%` 的时间获利，所以你可能也不会。\n\n此外，要理解短期加密交易者追求的是细微的价格波动。\n\n### 长期交易\n\n长期交易涉及大量的等待，这可能还会涉及许多紧张时刻。`HODL`\
  \ 这个术语在这种语境下非常常见，只有初学者不知道它的意思。\n\n\n\n\n\n`HODL` 代表“死死守护”（Hold On for Dear Life）。正如你可能猜到的那样，这个简单的计划涉及持有币超过一年，并抵御波动的风暴。尽管如此，价格波动是预料之中的，但你预期价值随着时间的推移缓慢增长。这需要一段时间，但你终将会达到目标并变现。整个计划取决于你完全什么都不做，而这说起来容易做起来难。\n\
  \n`Bitcoin` 的早期投资者就是一个很好的例子。当然，如果你在需要 10,000 多枚币才能买到一张披萨的年代投资 `Bitcoin`，人们会对着你的脸大笑。2011\
  \ 年左右，价格仅为每枚 0.35 美元。如果他们一直持有到 2017 年，他们就能以每枚约 20,000 美元全部卖掉。换句话说，你将获得初始投资的 57,000\
  \ 倍左右。你不禁好奇这些人现在在做什么。\n\n那么，这种长期策略带来了什么样的好处呢？首先，它只需要时间。你买一些币并持有一段时间。就是这么简单。这意味着你不需要理解图表或走势，因为你只需要长期持有币。\n\
  \n此外，你不需要浪费时间每五分钟焦虑地检查一次价格变动。你可以在空闲时或任何你想的时候这样做。这其实并不重要，因为反正你什么其他事情都没做。\n\n你也可以把这看作是投资股票，不是为了增加财富，而是为了养成良好的习惯。这个想法很简单：你从能够负担得起的任何现金开始，投入并购买几枚币。每当你有闲钱时，就将其投入购买更多币。你甚至可以说每月只省下\
  \ 100 美元，并将其投入加密货币中。长期坚持每个月这样做，直到临近退休或需要急用钱时收获。这种策略让你避免了市场波动的压力，因为不需要纠结短期价格波动。\n\
  \n当然，任何计划都有自己的缺陷。最大的缺陷是，你将错过本可以让你获得短期利润的机会。由于价格波动，有时价格在回落稳稳之前会短暂跳升。短期交易者会等待这一时刻来赚快钱。\n\
  \n你可能还会注意到策略的另一个主要缺陷。事实是你是在赌未来价格会上涨。鉴于未来是不可预测的，你可能会错过一些坏消息并导致投资付诸东流。如果有关你的币出现坏消息，价格可能会下跌且再也不回升。\n\
  \n这就是为什么你应该始终有一个稳健的主计划，并在情况不妙时有一些备选计划。在这种情况下，你应该关注加密货币新闻。如果前景不妙，退出并将你的财富转移到另一种加密货币并重新尝试。\n\
  \n但在你开始之前，你应该做好研究。这可能在你收到的每条投资建议中都反复提到多次，但它的重要性如何强调都不为过。做好尽职调查，至少尝试理解该币在未来是否会增长。\n\
  \n## 注意事项\n\n最大的缺陷是，你将错过本可以让你获得短期利润的机会。由于价格波动，有时价格在回落稳稳之前会短暂跳升。短期交易者会等待这一时刻来赚快钱。\n\
  \n你可能还会注意到策略的另一个主要缺陷。事实是你是在赌未来价格会上涨。鉴于未来是不可预测的，你可能会错过一些坏消息并导致投资付诸东流。如果有关你的币出现坏消息，价格可能会下跌且再也不回升。\n\
  \n这就是为什么你应该始终有一个稳健的主计划，并在情况不妙时有一些备选计划。在这种情况下，你应该关注加密货币新闻。如果前景不妙，退出并将你的财富转移到另一种加密货币并重新尝试。\n\
  \n但在你开始之前，你应该做好研究。这可能在你收到的每条投资建议中都反复提到多次，但它的重要性如何强调都不为过。做好尽职调查，至少尝试理解该币在未来是否会增长。\n\
  \n## 你并不总是赢家\n\n尽管如此，有一些技巧可以遵循。最重要的是记住的一点：你并不总是赢的。有时候，一切都会出错。\n\n## 恐惧、不确定性和虚假信息\n\
  \n通常被称为 `FUD`，当你开始怀疑自己的投资时就会发生。他们可能会告诉你这种币是骗局，或者会崩盘。\n\n## 说服\n\n说起事实，你应该始终区分事实和观点。记住，还有其他人想通过交易加密货币获利。\n\
  \n## 庞氏骗局\n\n加密货币名声不佳，是因为过去有一些恶意分子成功实施了 `Ponzi scheme`（庞氏骗局）。\n\n\n\n\n当你这样做时，你可以继续欺骗人们让他们相信你的公司或项目正在赚取大量资金，而你赚取的唯一钱仅是来自其他投资者。投资者池会不断扩大，直到无法维持，这通常是在没有新投资者可供欺骗、人们开始问得越来越多的时候。所以，你可以走这条经典的诈骗路线，并卷走剩下的钱跑路。\n\
  \n幸运的是，你可以在里外就识破这种骗局。如果他们主动找上门，提供一个年度投资回报率达到 10% 甚至每月 10% 的加密货币项目，那就是骗局。\n\n有时，他们可能会采取传销计划模式，要求你寻找新投资者。如果你这样做了，就会获得某种额外奖金。这也是一种骗局。\n\
  \n## 跑路骗局 (Exit Scam)\n\n这种骗局在加密货币圈也很常见。这在 `ICOs` 和小型加密货币交易所经常发生。计划非常简单：你过度炒作一个方案，获得投资，然后跑路。在原理上这很简单，但人们增加了额外的复杂性，使其更具说服力。\n\
  \n有些人会搭建一个功能完备的加密交易所。这意味着他们可以接收你的代币，你可以与他们进行交易。至少，你在屏幕上看到的是这样。在后台，诈骗者会卖掉你的代币，并操纵交易所的会计系统，让你认为自己实际上在交易币。\n\
  \n你看到的余额并没有反映交易所真实的钱包，钱包已经被清空了。请记住，你需要将代币转入交易所的钱包才能开始交易。如果你这样做了，骗子会在代币入账的瞬间将其清空。\n\
  \n当你提出提现请求时，事情就露馅了。现在，有些骗子愿意放弃一些代币以维持游戏。但如果提现让骗子们感到不安，他们就会直接关闭网站。简单粗暴。\n\n当然，仅仅因为网站关闭了并不意味着它是完全的骗局。有时，交易所的钱包遭到了网络攻击。也许存在某个漏洞。你的代币可能被清算以支付账单。无论如何，结果都是样的。代币消失了，网站也消失了。你得到的只有一个模糊的错误页面，可能是错误\
  \ `404`，并且没有任何办法找回你的代币。\n\n有时，他们还有另一种变体，即通过 `KYC` 表单进行诈骗。在这种情况下，你需要填写个人信息。他们会简单地开设一个允许所有人注册无需填写\
  \ `KYC` 表单的加密交易所，而 `KYC` 涉及分享人们不习惯的隐私信息。由于我们讨论的是加密货币，人们对隐私和匿名性更加敏感。\n\n因此，人们无需填写\
  \ `KYC` 表单即可进入。但一旦他们赚够了钱并想要提现时，他们突然被要求提交 `KYC` 表单，或者将他们所有的获利留在交易所，基本上就是将所有东西都交给了骗子。这怎么会发生呢？\n\
  \n大多数人往往没有仔细阅读服务条款或他们无意中同意的任何协议中关于提现时 `KYC` 要求的细则。合法的加密交易所会在政策更改前提前通知人们，即提现时需要 `KYC`。但对于诈骗者来说，他们不需要把事情搞复杂。他们只需要把它写在小字里即可。\n\
  \n\n\n\n这是某些加密交易所为了赚快钱而采取的另一种狡猾策略。假设你晚上正在熟睡，梦见到明天早上起床时，你全天的的仓位将产生盈利。你投资了 `Bitcoin`（比特币），并设置了止损单，以防价格在半夜期间下跌。\n\
  \n那天晚上，价格确实下跌了，`Bitcoin` 在不到两分钟内跌幅了 2000 美元。这触发了你的止损单，你的加密交易所为你平平了仓位。你的余额在某种程度上得到了保留，但你仍然在这笔交易中亏损了\
  \ 1000 美元。你可能会认为这没关系，因为你没有损失更多的钱。这正是止损的意义所在，它很好地保护了你的投资。\n\n可笑的是，价格突然大幅上涨。由于你的仓位已经关闭，你被排除在局之外，就这样错过了那个获利的机会。这不是你希望在半夜时看到的景象。有时，这只是市场的波动。但在另一些时候，幕后正发生着其他不阴险的交易。\n\
  \n这种手段被称为“止损驱动”（stop drive）。当你的加密交易所知道你在哪里设置了止损，并且他们决定通过虚假动作打低价格时，这种情况就会发生。然后，他们进场获利。\n\
  \n它的原理是交易所卖出币，从而导致价格下跌。他们这样做是因为他们知道，通过止损单赚到的钱比他们卖出币导致价格崩盘所损失的钱要多，之后他们再买回来。驱动止损的好处是，你可以从平仓中拿回你的币。简单来说，这基本上是人们印钱的方法。\n\
  \n这种策略并不新鲜。事实上，在历史上，各种市场的经纪人已经执行过很多次。这不仅仅是加密交易所。交易者有时也会玩这种游戏，但通常是“庄家”在使用这种策略，因为他们拥有完成此操作所需的所有数据。\n\
  \n尽管这是高度违法的，但并不能阻止它的发生。它在股票和商品市场中仍时时发生，尽管很罕见。但在加密货币市场，它正开始变得相当常见。\n\n那么，你能做什么来阻止它呢？在这里，我们需要谈谈杠杆。它基本上是一种在交易顺利时放大利润、在不顺利时放大亏损的方法。它是一个倍数。加密交易所提供不同级别的杠杆。在\
  \ `Forex` 中，它可以达到 `1:1000`，这意味着如果你利用杠杆，你可以获得利润的 1000 倍。\n\n杠杆的创建是为了让交易者能够在不需要实际投入大量资金的情况下从大额交易中获益。这在外汇领域尤为重要，因为你赚取的利润是以万分计算的，所以杠杆会将数字放大，使你的利润更具象感。交易者只需要投资仓位的一小部分就可以利用杠杆。他们的平台会冻结其余额的一部分，以便在交易失败时覆盖亏损。\n\
  \n在加密交易中，情况是另一了。你应该学习图表，并在能够盯着图表的情况下不带杠杆甚至不带止损进行交易。不提供杠杆或止损功能的加密交易所平台是为了保护其用户。而提供这些功能的是为了他们自己的利益。\n\
  \n进入加密交易平台的新手交易者几乎不知道交易是如何运作的，他们会使用所有功能来帮助自己交易，无论是杠杆还是止损，而并不真正了解加密交易的复杂性。他们通常会损失大量的钱，甚至更多，因为他们是新手交易者，让情绪主宰了自己。\n\
  \n这一切都会给交易所带来越来越多的钱，而这正是他们想要的。这正说明交易通常是一场零和博弈。没有人能赢得一切，输者必须付出代价。至少有些人为此付出了代价。\n\n\
  \n\n\n冷钱包有许多形式。最易于用户的选项是 USB 钱包，例如 Ledger、`KeepKey` 或 `TREZOR`。以前也有纸质钱包，这是一种发送到离线打印机的文档，用于为所有者创建私钥和公钥。但自从硬件钱包变得普及后，纸质钱包开始变得过时。\n\
  \n冷钱包的核心理念是私钥离线生成。对于 USB 钱包，你只需要将其插入电脑并启动特定的应用程序来访问和存储你的硬币。如果你使用 USB 钱包，请务必妥善保管，因为任何损坏或丢失都意味着失去对钱包的访问。\n\
  \n还有离线软件钱包。它的工作方式与硬件钱包类似，但它涉及到两个独立的平台，这使得整个过程对普通用户来说有点复杂且让人无从下手。离线软件钱包使用两个平台：一个存储公钥的在线平台和一个包含私钥的离线平台。\n\
  \n因此，在线部分创建新的未签名交易，并将用户的地址发送给对方发送者或接收者。然后，这个未签名的交易将被移动到离线钱包，使用私钥进行签名。签名后的交易将移回在线钱包，并在区块链网络上广播以确认交易。由于离线钱包从未连接互联网，私钥始终保持保护。如果你对拥有离线软件钱包感兴趣，可以考虑\
  \ `Electrum` 和 `Armory`。它们被认为拥有最好的离线软件钱包。\n\n现在是提到硬件钱包和软件钱包的好时机。这些是不言自喻的。硬件钱包是存储你私钥的特殊设备，而软件钱包则在你的电脑上存储。\n\
  \n你需要一个硬件钱包或至少一个冷钱包来存储你的硬币。你要知道，当你在加密交易所注册时，你需要在他们那里创建一个钱包。遗憾的是，他们也处理私钥和公钥的生成。因此，从理论上讲，他们可以使用私钥窃取你的钱。\n\
  \n所以，你应该寻找具有领先技术的知名加密钱包提供商。市场上有很多选择，在决定之前，请多观察并评估每个提供商的优缺点。\n\n# 选择哪种钱包\n\n话虽如此，如果你是加密货币世界的新手，也许你犹豫不决，不知道从何开始。别担心，我们会为你提供帮助。在选择钱包提供商时，有许多需要考虑的因素。\n\
  \n## 声誉\n\n这是不言自喻的，你应该只考虑知名公司。这些公司明白，为客户提供优质产品要比骗取他们的钱要好得多。它们的声誉比快钱更有价值。\n\n寻找那些存在已久的公司，并看看他们的客户如何评价他们。了解他们提供哪些功能以及这些功能如何帮助保护你的硬币。通常情况下，你可以在网上找到关于这些公司的在线评论，这样你就能在开始之前有所预期。\n\
  \n## 技术\n\n鉴于加密货币匿名化、去中心化且透明的特性，人们希望他们的加密钱包提供商也具备这些特性。在这种情况下，你的提供商应该拥有开源钱包。这意味着其他人可以通过查看公开的代码来了解钱包是如何开发的。\n\
  \n这样一来，如果有任何不对劲，人们就会知道。了解驱动这些钱包的代码非常重要，因为它们从根本上告诉了钱包是如何整体运作的。它们告诉你是私钥是如何存储的；是存储在你手中还是你的提供商那里？此外，密钥是否存储在他们的服务器上？后种路径风险更大。双重身份验证也是需要注意的。\n\
  \n此外，隐私也是许多人关心的点。其中一些人对此过度关注了，但考虑到过去所有的隐私数据泄露，你不能责怪他们。如果你是这样的人，可以考虑一下加密钱包是否可以在 `TOR\
  \ Network` 上运行，以防你真的想在暗网操作。\n\n## 备份功能\n\n这是起初看起来可能随性且微不足道的事情之一，直到你太晚了才意识到它是多么重要。你未来可能会面临许多危及你投资的问题。也许你的电脑坏了，而那台电脑恰好是你安装离线软件钱包的唯一地方。也许外部环境缩短硬件钱包寿命的速度比你预的要快，它某天突然坏了。如果发生任何一种，你的投资将付诸东流。\n\
  \n为了防止这种情况发生，请确保备份你的钱包。再次强调，由于钱包持有显示你的硬币在区块链网络上位置的数据，备份钱包不会复制你钱包中的硬币。备份只是复制了通往你战利品的宝地图，以防原始副本发生任何意外。\n\
  \n所以，当你去寻找合适的加密钱包时，请确保它们有稳健的备份程序。它应该有一个恢复链接、密码和一些用于恢复访问权限的短语。双重身份验证在这里也很重要。\n\n\
  ## 多币支持\n\n现在的大多数钱包都允许你存储比特币之外的几种山山寨币（Altcoins）。制造商选择支持哪些硬币可能有所不同，因此确保你知道未来将交易哪些硬币，然后为它们选择正确的钱包。\n\
  \n拥有一个可以支持不同币种的加密钱包非常方便。你不需要拥有多个只支持每种货币一种类型的钱包。你不需要为了访问不同的币种而经历这么多麻烦。\n\n## 加密货币转换\n\
  \n这是可选的，但仍然很有用。这是一个可以直接构建在你的加密钱包中的小型集成功能。当然，如果制造商能够提供此类功能，他们需要与加密交易所合作，或其他通过手段为你买卖硬币。在这种情况下，`Exodus`\
  \ 与 `ShapeShift` 合作创建一个加密钱包来转换货币，以简化加密货币套利。\n\n## 共享账户\n\n明确的是，由于明显的原因，你不应该与其他用户共享加密钱包。你不能真正信任任何人。你可以将其作为防止密钥丢失或类似情况的另一种保护。幸运的是，有一种方法可以确保你的硬币安全。你可以通过创建一个\
  \ `MultiSig`（多签名账户来实现。\n\n这是一种信任系统，除非账户的所有方批准，否则交易无法进行。因此，将生成多个私钥并绑定同一个钱包。该功能对于业务伙伴或家庭非常有用。\n\
  \n## 平台/设备\n\n这是值得考虑的。将多个设备连接到同一个钱包是方便的，尽管有点风险。理想情况下，你希望每个设备只有一个钱包。管理所有钱包将很麻烦，但如果你的任何设备丢失、被破解或发生了什么，至少你不会丢失所有的硬币。\n\
  \n## 二维扫描器\n\n这个非常重要。扫描二维码可以让人们共享他们的公钥，而无需手动输入。由于密钥只是字母和数字的乱码，很容易读错或输错某个字符。仅仅一个错误就意味着你的硬币被发送给错误的人，且无法找回。所以，任何有值的加密钱包都能生成和扫描二维码以方便硬币转账。\n\
  \n## 客户服务\n\n\n\n\n就像加密交易所一样，加密钱包也应该拥有完善的客户服务基础设施。它们应该非常及时，并能够回答你的大部分问题。当你处于加密货币市场时，由于市场价值波动极快，这一点尤为重要。\n\
  \n## 流动性风险\n\n资金或现金流动流动风险是另一个需要考虑的因素，因为它可能会影响你在交易高峰期间快速买卖硬币的能力。在这种背景下，流动性指的是你买卖硬币的速度或易程度，包括现金转换为硬币以及反之的速度。资金或现金流流动性风险是指企业或公司是否有足够的资产或资金来支持其负债。\n\
  \n## 区块链进化\n\n还存在未来特性的问题。区块链技术每天都在不断发展。可能会有新的突破或更新，你的钱包需要跟上区块链网络的变化。这不仅适用于加密钱包，也适用于加密交易所。\n\
  \n通常情况下，开发者会对即将发布的可能破坏当前平台的更新进行公开说明，他们也会给人们充足的时间来准备。因此，请留意这些动态，看看你的加密交易所或加密钱包供应商正在为该更新做什么准备。\n\
  \n当更新发布时，可能会出现一些问题。程序员和开发者知道，当修复一个漏洞时，可能会无意中引入一堆新漏洞。某些功能可能会损坏，并且需要一段时间才能修复。\n\n\
  所以，最好的办法是将你的硬币存储在冷存储硬件钱包中。一旦所有补丁完成并准备就绪，你就可以直接回来。\n\n## 托管钱包\n\n最后也是最重要的一点是选择非托管钱包（non-custodial\
  \ wallets）。它们是什么？简单来说，就是用户完全控制的钱包。换句话说，没有任何（甚至包括提供加密钱包的公司）对钱包拥有控制权或访问权限。你是钱包的所有者，只有你能访问它。它的重要性怎么强调都不为过。\n\
  \n公平地说，托管钱包非常方便。刚接触加密货币世界的人可以先从托管钱包开始。一旦他们熟悉了所有的运作方式，就可以转到非托管钱包。\n\n非托管钱包让你能够直接与区块链网络交互，去掉了中间人，这正符合加密货币的初衷。\n\
  \n非托管钱包主要有两种类型：软件和硬件钱包。\n\n软件钱包是你电脑或手机上的应用程序。它们生成私钥并将其作为文件存储在你的电脑上。这里的“关键”（双关语）在于非托管钱包不会将你的私钥存储在提供者的服务器上。它都在你的设备上，所以提供者无法访问你的资金。\n\
  \n但在电脑上拥有文件是有风险的。出于这个原因，你应该寻找一个同时也允许你通过密码和加密保护私钥的非托管钱包供应商。同样，可能还可以进行双重身份验证。这可能会有点麻烦，但它们起到了额外的安全防护作用。\n\
  \n如前所述，你需要一个能够生成和扫描二维码的钱包。如果你在电脑上安装软件程序，你就缺少了这种能力。因此，人们还开发了移动钱包，通常与他们的电脑端应用程序配对。这两个应用程序在很大程度上运行相同，但移动端应用程序的优点在于，你可以进行快速的日常支付并扫描二维码。除了密码和加密之外，你的手机可能还带有\
  \ `TouchID` 或 `FaceID` 等其他安全功能。\n\n然而，如果你对日常设备的安全性没有足够的信心，你可以选择硬件钱包。这些设备包含了你在加密钱包所需的所有功能，并被认为是存储币最安全的选择。\n\
  \n一如既往，请确保你备份了私钥，以防发生故障导致丢失对设备的访问权限。\n\n5![](img/svgimg0003.svg)\n\n# 投资以太坊\n\n\
  虽然比特币是关注的焦点，但任何人都能看到以太坊 (ETH) 位居第二。诚然，两者之间的价格差异是惊人的。比特币正致力于成为互联网黄金，而以太坊在探索其他途径，为具有有趣应用的初创公司和项目提供新的融资方式。\n\
  \n那么问题变成了，投资以太坊值得吗？我们将在本书中回答。\n\n## 以太坊的优势与劣势\n\n以太坊指的是区块链网络，以太币指的是该网络上的货币。在决定是否投资以太坊时，你需要考虑许多优势和注意事项。\n\
  \n### 优势\n\n以太坊第一且最重要的一点是它的复杂性。以太坊使用智能合约，对于外行来说，由于其复杂性看起来非常技术且充满了术语，但这种复杂性具有价值。\n\
  \n以太坊以比特币无法实现的方式提供了这种价值。使用以太币的交易利用了基本上是自动执行的合约，正在逐渐向公司证明其价值。他们可以使用它来执行合同，而不需要第三方来监督整个过程。\n\
  \n这对以太坊建立了坚定的信心，而这是比特币所缺乏的。即使整个加密货币市场在未来几年内崩溃，以太坊的智能合约仍然具有某些实用价值。因此，如果加密市场崩盘，以太坊有很大机会生存下来，因为市场上仍然需要智能合约。\n\
  \n谈到实用性，以太坊不仅仅是一种加密货币。除了智能合约，该平台本身也是开创性想法的温床。许多初创公司和代币在该平台上创建，并且需要以太币来支持这些项目。平台本身支持去中心化金融\
  \ (`DeFi`) 项目、`dApps`（区块链上的应用），这使得以太坊具有大量的实用性。\n\n以太坊可以用于不同的领域，如医疗、能源甚至游戏。该平台允许开发者创建代币，可以促进艺术、专利、投票历史、身份验证、医疗记录和其他复杂任务的代币化。\n\
  \n此外，以太坊也非常负担得起。它仍然是目前最贵的山寨币（Altcoin），但比比特币便宜得多。所以，你可以更容易进入以太坊市场。再加上用以太币投资初创公司的能力，你就能明白为什么以太坊紧随比特币。如果以太坊是在比特币之前创建，它现在很可能是领先的加密货币。\n\
  \n以太坊的另一个优势是它的代币以太币没有总量上限。开发者没有计划对流通的以太币数量设置硬性限制。这意味着以太币的价格将保持相对稳定，因为执行合约和交易需要以太币。\n\
  \n### 劣势\n\n第一个问题可能源于它在扩展性方面可能面临困难。比特币被创建为数字黄金，或像法币货币一样的交换媒介。它只有一个用途。\n\n另一方面，以太坊必须承担多重角色。它需要是一个账本、一个智能合约平台等。虽然广泛的范围可能很有吸引力，但也可能导致崩溃、攻击和漏洞。\n\
  \n\n\n\n\n平台本身可以用于创建新的应用和代币。开发者不需要为了运行自己的 dApp 而花费精力去创建一个规模小且易受攻击的整个区块链网络。相反，他们可以依托\
  \ `Ethereum` 区块链在此基础上进行。\n\n这里唯一的问题是以 使用了 `Solidity`，这是另一种学习起来可能非常棘手的编程语言。由于它是一种相对新的编程语言，加上其应用仅限于\
  \ `Ethereum`，`Solidity` 的支持非常少。\n\n要找到对初学者友教程并不并不。你在那里找到的大多数指南通常是面向那些对代码了如指掌的人的。这无疑会减慢代币开发进程，但一旦开发者学会了如何操作这种新编程语言，情况会时间的推移而好转。\n\
  \n此外，使用 `Ether` 来驱动交易可能对某些人没有吸引力。`Bitcoin` 被视为加密黄金，但 `Ether` 更像是在驱动智能合约的燃料。如前提到的，`GAS`\
  \ 费用基本上是执行交易所需的成本。你不需要很多，但它仍然会侵入你的利润。对于一些有兴趣持有代币的投资者来说，在某些小交易中丢失它们对他们来说是件件不讳的事。\n\
  \n最后，`Ether` 的无限供应既是福也是诅咒。当我们谈论价格时，我们需要理解供需关系。低供高需意味着高价。高供低需意味着低价。\n\n`Bitcoin`\
  \ 背后的开发者决定采取强硬措施，对 `Bitcoin` 设置了硬性上限，并控制有多少硬币可以进入流通。此外，每隔大约四年就会一次减半，其中给矿工的 `Bitcoin`\
  \ 速率（这是向流通注入 `Bitcoin` 的唯一方式）会减半。每当这种情况发生时，`Bitcoin` 的价格都会瞬间飙升，然后再次稳定在高于减半之前的价格。据信，最后一枚进入流通的硬币将在\
  \ 2140 年左右产生。\n\n流通中的 `Bitcoins` 永远不会超过 2100 万，因此这有效地控制了供应，从而影响了它的价格。诚然，加密货币几乎无限的分分可以缓解供应问题，但硬性上限的存在允许\
  \ `Bitcoin` 在达到最大硬币数量后保留其价值。\n\n没有人真正知道 `Bitcoin` 达到上限后会发生什么。也许用户需要像 `Ethereum`\
  \ 一样将 `Bitcoin` 作为 `GAS` 费用，因为毕竟矿工需要获得补偿。也许 `Bitcoin` 的限制会被提高。\n\n回到 `Ether`，没有限制的事实以及它被用于驱动交易的事实意味着\
  \ `Ether` 的价格可能不会上涨多少。尽管 `Ether` 是市场上第二大加密货币，但它的价值甚至与 `Bitcoin` 不在同一个量级上。这意味着，对于那些寻求执行\
  \ `HODL` 策略的人来说，`Ether` 可能不是一个好的投资选择。\n\n## 你应该投资以太坊吗？\n\n这取决于你计划如何使用 `Ethereum`\
  \ 以及加密货币相关的风险/奖励。如果你购买 `Ether` 是为了通过 `ICO` 助初创公司或项目，那么 `Ether` 绝对值得。此外，`Ether` 比\
  \ `Bitcoin` 有更多实用性，这确保了尽管供应没有限制，但该代币总有需求。\n\n然而，如果你正试图执行 `HODL` 策略，`Ether` 可能不是一个值得的投资。与\
  \ `Bitcoin` 相比，它的价值微乎其微。代币供应是无限的。如果你想像交易股票一样交易 `Ether`，不如投资 `Bitcoin` 并 `HODL`。\n\
  \n## 以太坊 vs 比特币\n\n许多人问 `Ethereum` 和 `Bitcoin` 之间的区别是什么，他们应该投资哪一个，因为外那里所有的资源都说两者都是很好的投资选择。在这里，我们将快速回顾一下主要区别。但在那之前，我们需要掌握这两种主流加密货币的基础知识。\n\
  \n`Bitcoin` 由 `Satoshi Nakamoto` 于 2009 年初发布。`Bitcoin` 创建背后的想法是创建一个一种独立于任何中央权威的安全的加密货币。`Bitcoin`\
  \ 没有物理形态，它的区块链网络在安全的公共账本上记录所有交易。尽管 `Bitcoin` 并不是创建此类虚拟货币的首次尝试，但它的发布是最成功的。它为之后出现的所有加密货币奠定了基础。多年来，它的价值不断上涨，现在开始受到监管机构和政府机构的接受。\n\
  \n`Ethereum` 于 2015 年中期引入，它是最大、最知名且最成熟的去中心化软件开放式平台。`Ethereum` 有一个不同的目标。它为人们提供了一个开发应用的平台，它的代币\
  \ `Ether` 除了数字货币之外还具有更多实用性。\n\n如前提到的，`Ether` 用于支付、抵押和作为价值存储。它还需要驱动平台上的交易，`dApp`\
  \ 开发者使用它在平台上构建和运行他们的 `dApps`。\n\n### 关键区别\n\n在了解基础之后，让我们谈谈它们如何不同，以帮助你理解如果你必须选择其一，哪一个值得投资。\n\
  \n### 历史\n\n`Bitcoin` 是第一种加密货币，所以你可以归怪它开启了这一切。创始人 `Satoshi Nakamoto` 直今天仍保持匿名。没有人知道它是一个人还是一个团体，甚至不知道他们是否还活着。`Ethereum`\
  \ 是 2015 年由研究员和程序员 `Vitalik Buterin` 创建的。他研究了 `Bitcoin` 及其区块链网络，理解了它们的缺陷，并致力于开发一个改进\
  \ `Bitcoin` 的新平台。他的平台提供了更多功能，并用于应用程序 (`dApp`) 以及智能合约。\n\n### 概念\n\n在这里，虽然 `Bitcoin`\
  \ 和 `Ethereum` 都允许点对点 (`P2P`) 并且可以作为支付方式，它们的相似之处到此为止。`Bitcoin` 作为法定货币的替代品，且没有后者相关的问题。交易费用很低，没有中央权威来规定价值。\n\
  \n对于 `Ethereum`，它的应用不仅限于作为货币。它还为开发者提供了创建 `dApps` 和智能合约的平台。因此，`Ethereum` 是可能开发突破性区块链技术的平台。如果发生这样的事情，将在\
  \ `Ethereum` 网络上进行。\n\n### 挖矿\n\n`Bitcoin` 使用工作量证明 (`Proof of Work`) 验证方法。简单来说，矿工竞争解决数学问题以验证交易。先完成的人赢得一些代币。由于这是一场竞赛，没有多少人获胜，很多人最终亏损，因为他们必须支付账单却无法从挖矿中获得收益。\n\
  \n`Ethereum` 使用相同的验证方法。但它正在转向一种被称为权益证明 (`Proof of Stake`) 的新验证系统。简单，矿工将被随机选择以提议区块，其他矿工也会被随机选择以证明他们看到了该区块。一旦收集了足够的共识，区块就会被添加。\n\
  \n\n\n\n然后就是交易费的问题。在比特币中，矿工在成功验证交易时获得少量的代币。这种货币并非凭空产生，它是被创造出来的。这也是进入流通的唯一方式。\n\n\
  在以太坊上验证交易对用户是免费的，尽管你可能需要支付少量的费用来启动引擎。这些费用是完全可选的，即使你不支付，交易也会进行，这只需要一点时间。\n\n以太坊也是通过挖矿生成的。这里的区别在于以太坊需要\
  \ `GAS` 费用来验证交易，促进了以太坊的流通。\n\n### 时间\n\n关于验证交易并将区块添加到区块链网络所需的平均时间，比特币大约需要九到十分钟，而以太坊快得多。通常，在以太坊网络上大约需要\
  \ 15 秒。\n\n### 哈希算法\n\n哈希算法是区块链网络保护数据并确保所有人匿名性的方式。比特币使用名为 `SHA256` 的哈希算法，而以太坊使用\
  \ `Ethash`。\n\n### 数量\n\n相比比特币，以太坊的流通量更多。尽管以太坊很多，比特币达到了万亿美元的市值里程碑。以太坊拥有更多的是它的区块数量，在写作时超过\
  \ 660,000 个，而比特币约为 540,000 个。以太坊区块更多，因为验证交易花费的时间少得多。\n\n## 购买和出售以太坊\n\n现在你对以太坊有了深入了解，让我们来聊如何购买以太坊。假设你已经有一个用于存储以太坊的钱包。我们在第四章介绍过加密钱包，如果你还没有，请查看。简而言之，加密钱包需要能够存储以太坊，并提供足够的安全功能来保护你的投资免受黑客攻击或访问丢失。此外，假设你不打算挖掘以太坊。我们在第三章也介绍过加密货币。\n\
  \n那么，如何获取以太坊来开始你的投资之旅呢？\n\n### 识别交易平台\n\n你需要做的第一件事是寻找最适合你需求的交易平台。有很多提供以太坊的热门平台，如\
  \ `Coinbase`、`Binance`、`Kraken`、`Bitstamp`、`Gemini` 和 `Bitfinex`。建议先从这些开始，慢慢寻找真正拥有你所需一切的平台。\n\
  \n此外，选择加密交易所的最大考虑因素之一是交易所本身的类型。这里有三种类型：一种提供法币交换的服务，一种提供加密货币兑加密货币的服务 (`C2C`)，还有一种两者兼顾。\n\
  \n你会发现，有些加密交易所实际上作为外汇平台或提供其他交易服务。他们只是扩展了业务，将加密货币纳入其服务。\n\n根据你计划如何交易，你可能会发现 `C2C`\
  \ 交易所更有力。\n\n### 创建账户\n\n一旦你决定了想使用哪个交易所，就是创建账户的时候了。你只需要提供一些个人信息，如 `name`、`address`、社会安全号码等。这个过程不应该花费很长时间。\n\
  \n### 获取货币\n\n一旦验证过程全部完成，我们来聊聊钱的问题。假设你名下没有任何加密货币，你需要从购买它们开始。大多数交易所只接受主要的法币。\n\n\
  ### 开始交易\n\n一旦一切完成，你终于可以交易加密货币了。\n\n### 获得你的收益\n\n一旦你获得了一些利润，就可以提取货币。大多数加密交易所允许你将加密货币转换为法币，这样你就可以将现金转入银行账户。\n\
  \n# 多元化\n\n当你进入投资领域时，听到的第一件事之一就是你应该让投资组合多元化。同样的理论在这里也适用。你不应该将所有的投资投入到一种加密货币中。一旦币价崩盘，你将一无所有。因此，请选择其他几种加密货币来丰富你的投资组合。\n\
  \n\n\n\n正如其名，基于挖矿的币是指通过挖矿创建的加密货币。这里的挖矿主要有两种方法：我们在第三章中已经讨论过的`工作量证明 (PoW)` 和 `权益证明证明\
  \ (PoS)` 系统。一些示例包括 `Ethereum`、`Zcash`、`Monero` 和 `Litecoin`。某些加密货币（如 `Ripple` 的\
  \ `XRP`）是预先制作或预矿的。这意味着，它们不是通过挖矿产生的，而是在在加密市场上市之前就已创建并分发的。\n\n### 稳定币\n\n一些人会推崇稳定币是保障加密货币未来的最佳折中方案。自诞生以来，加密货币交易一直受到波动性的困扰。稳定币旨在通过将其价值与法币货币、贵金属或其他加密货币挂钩来解决这一问题。这样一来，它们的价值就能保持相对稳定，从而赢得潜在投资者的信任。稳定币的一些示例包括\
  \ `MakerDAO` 和 `USDC`。\n\n### 证券代币\n\n证券代币基本上是在股票市场交易的证券，只不过这些是在加密货币市场交易的。它们提供了与传统股票类似的收益，且这些代币承诺其所有者拥有所有权方面的股权或基于利润的分红。\n\
  \n公司将会成功且其证券代币价值飙升的想法，使其对投资者来说是一个极具吸引力的前景。这些代币通过 `ICOs`（首次代币发行）向投资者提供。尽管如此，证券代币受到严格审查，在公司发放它们之前，必须满足所有的法律要求。\n\
  \n### 用型代币\n\n用型代币的工作原理与证券代币类似，但它们不受所有的法律审查。这些代币用于向所有者提供服务。他们可以使用用型代币兑换奖励或购买商品和服务。然而，用型代币并不赋予所有者发行该公司的股份。\n\
  \n### 山寨币是好的投资选择吗？\n\n不仅仅是 `Ethereum`。市场上还有许多很有前景的山寨币（Altcoins）。你应该投资这些它们吗？\n\n\
  你看，市场仍然处于婴儿阶段。今天市场上几乎有 10,000 种山寨币，而且数量仍在增加。这吸引了大量的散户投资者。他们仅仅是投机价格波动并获取短期利润。\n\n\
  加密货币市场尚未成熟，还没有良好的方法来定义投资标准或指标来评估加密货币。通常情况下，山寨币纯粹是投机工具，只有一小部分币实际上值得交易。其余都是死掉的加密货币，即未能获得关注或仅仅淡出无几的币。\n\
  \n所以，如果你在寻找长期收益，可能购买 `Bitcoins` 并持有它们直到以后某个日期卖掉可能更好。但如果你对资助初创公司感兴趣，可以使用 `Ether`\
  \ 或其他支持的加密货币进行 `ICOs`。使用其他山寨币进行长期投资目前尚不可行，你应该仅将其作为投机进行交易。\n\n## 该买哪些山寨币？\n\n尽管市场上有\
  \ 9,000 多种山寨币，但只有极少数实际上值得投资。你可以通过查看你加密货币交易所列出的前 10 位加密货币，对把钱投入哪些山寨币中有一个良好的想法，但也许你可能想知道它们是如何进入名单的，或者它们承诺了什么特征让它们如此有价值。因此，在本节中，我们将讨论其他你可以投资的山寨币。我们不会讨论\
  \ `Ethereum`，因为它已经有一个专门的章节了。那么，你应该考虑投资哪些哪些山寨币呢？\n\n### 莱币 (LTC)\n\n莱币发布于 2011 年，开发者说如果将\
  \ `Bitcoin` 视为黄金，那么它就是银。它与 `Bitcoin` 有许多相似之处，并在 `Bitcoin` 缺乏的领域进行了改进。莱币由 `Charlie\
  \ Lee` 创建，他是一名 MIT 毕业生，曾在 `Google` 担任工程师。\n\n莱币与 `Bitcoin` 具有许多相似之处，并在 `Bitcoin`\
  \ 不足的进行了改进。莱币使用 `scrypt` 技术，随着越来越多的商家接受莱币作为支付，它正在迅速普及。\n\n### 加达坊 (ADA)\n\nCardano\
  \ 被认为是 `Ethereum` 的强力竞争者，它的区块链比 `Ethereum` 更具功能性，尽管由于这种加密货币仍处于婴儿阶段。确切地说，它使用了 `权益证明\
  \ (PoS)` 模型。\n\n加达坊是由一群工程师、数学家和加密货币专家创建的。事实上，整个项目是由创建 `Ethereum` 的五位创始人之一在对 `Ethereum`\
  \ 方向产生争议后创立的。Cardano 是在经过了大量的研究和实验后创建的。Cardano 背后的团队清楚自己在做什么。由于这种严谨的过程，Cardano 在人群中脱颖而出。它们极目标是什么？它们想成为世界的金融操作系统。他们希望通过创建类似于在\
  \ `Ethereum` 上开发的去中心化金融产品来实现。此外，他们还想为法律追踪、防止投票欺诈等提供解决方案。\n\n### 波卡 (DOT)\n\nPolkadot\
  \ 使用了不同的 `PoS` 模型。与 `Cardano` 类似，Polkadot 的开发者希望创建一种通过其协议实现不同区块链互操作的加密货币。它的创建是为了连接各种区块链和预言机，形成一个巨大的网络集群。\n\
  \n`relay chain` 是 Polkadot 的核心组件。它允许网络之间的互操作。它还允许 `parachains`（平行链）使用它们自己的原生代币运行。\n\
  \nPolkadot 与 `Ethereum` 的不同在于，`Polkadot` 赋予了开发者创建自己区块链的能力。`Ethereum` 开发者只需要寄放在 `Ethereum`\
  \ 巨大的区块链网络。你可以开发自己的区块链并从那里开始，但你会遇到安全问题。开发自己的区块链需要时间，并且被认为是一种冒险行为。它的规模小意味着它容易受到攻击。\n\
  \n### 比特币 (BCH)\n\n比特币现金是作为 `Bitcoin` 的硬叉创建的。它实际上是 `Bitcoin` 最早且最成功的硬叉之一。什么是硬叉？为了这一点，我们首先需要了解加密货币背后的社区。你看，由于数字货币的去中心化本质，对区块链网络或加密货币本身的任何更改都必须通过普遍共识来实现。开发者会将想法提交社区并征求他们的意见，开发者之间也会对他们的应该走向什么方向进行辩论。\n\
  \n\n\n\n这里的讨论非常重要，因为加密货币的价值完全取决于用户。更具体地说，矿工是实际上确认交易、生成代币并最初将其投入流通的人。代币背后代码的重大更改必须通过共识。\n\
  \n当大家都达成一致时，一切都是顺利的。但当发生冲突时，可能会发生硬分叉（hard fork）。硬分叉可以由开发者或对现状不满且提议的未被采纳的加密社区成员发起。这种硬分叉要求用户升级到最新的协议软件版本，这将导致某些无效的区块和交易变得有效，反之亦然。\n\
  \n硬分叉正是导致比特现金（Bitcoin Cash）诞生的缘源。在 2017 年底，社区无法就比特币的未来发展方向达成共识，导致了社区的分裂。\n\n导致这一切的分歧归根结底比特币的可扩展性问题。如你所见，比特币网络对区块大小有限制，仅为一兆（`MB`）。区块大小是最初导致比特币交易速度缓慢的根源之一。\n\
  \n针对这个问题，实际上提出了两种解决方案。第一种方案是增加区块大小，但很快被开发者否决。第二种方案是实施隔离见证（`SegWit`）协议，它可以优化区块中的数据存储。\n\
  \n但对实施 `SegWit` 的推动至少是具有争议的。矿工们对其所要求的激进变化感到不悦。在不深究技术细节的情况下，该解决方案被认为是无效且不专业的，部分原因是这种推动是在没有社区共识或没有通过诚实讨论来理解相关收益和成本的情况下进行的。\n\
  \n因此，分叉发生了，比特现金应运生。每个区块的大小为八兆，且没有 `SegWit` 协议。更大的区块意味着它们可以容纳更多的交易，从而提高交易速度。\n\n\
  ### Stellar (XLM)\n\nStellar 的创建是为了为金融机构提供企业解决方案，使其利用专门设计的区块链网络进行大额交易。任何需要跨大洲发送大量资金的人都会知道此类交易相关的官僚程序和费用。\n\
  \n银行和投资公司进行此类巨额交易需要许多天以及许多中间人。这既昂贵又低效。因此，Stellar 这些机构在不需要任何中间人的情况下以极低的成本完成操作。\n\n\
  Stellar 由 Jed McCaleb 创立，他曾是 `Ripple Labs` 创始团队的成员。他恰好也是 `Ripple` 协议的开发者。一天，他决定与\
  \ `Ripple` 团队分手，共同创立了 `Stellar Development Foundation`。\n\nStellar 是一个开源区块链网络。尽管它是为企业设计的，但任何人都可以使用。可以使用\
  \ Stellar 进行国家间的跨境交易。其原生加密货币是光币（`XLM`），它就像以太坊一样，用于网络上的交易。\n\n### Chainlink\n\nChainlink\
  \ 由 Steve Ellis 和 Sergey Nazarov 开发，为区块链网络与互联网之间不可逾越的障碍提供了一个有趣的解决方案。它是一个去中心化预言机网络，允许智能合约与区块链网络外部的数据交互。如你所见，区块链网络本身缺乏连接外部应用程序的能力。至少，它们无法安全地做到。大多数解决方案都非常笨拙且不安全，这正是\
  \ Chainlink 的用武之地。\n\nChainlink 的去中心化预言机赋予智能合约与区块链网络外部数据交互的能力。在这种情况下，Tether 为用户提供了发送和接收法的解决方案，同时降低了波动性。\n\
  \n### Binance Coin (BNB)\n\nBinance 是一种作为交易所运行的加密货币。最初，币币是一个 `ERC-20` 代币，这意味着它是创建在以太坊区块链上的。\n\
  \n### Tether (USDT)\n\nTether 是稳定币俱乐部的早期成员。在这种情况下，Tether 提供的价值挂钩 `USD`。\n\n### Monero\
  \ (XMR)\n\nMonero 在 2014 年推出时曾自称为一种加密货币。让它与其他加密货币脱颖而出的事实是，它的开发完全基于捐赠和社区反馈。\n\n\n\
  \n\n虽然 OMG 在市场上还很新，但在泰国非常流行，目前泰国已有 240 家麦当劳分店接受其作为支付方式。这种成功部分归功于泰国人支持他们自己的产物，例如泰铢、当地制造的泰国产品等。因此，OMG\
  \ 在那里获得成功也是情理合理的。\n\n## VeChain (VEN)\n\nVeChain 利用其强大的平台提供了一种改进业务供应链的方法。通过其区块链，公司可以快速地进行交易，每秒可达\
  \ 10,000 次。此外，VeChain 还提供了透明度，允许企业创建并存储细化到分钟的详细交易记录。而且，他们可以无限期存储这些信息。\n\n除此之外，VeChain\
  \ 目前正在开发一种微芯片验证系统，以便平台上的每种产品都能轻松通过身份验证，从而打击假货并增强客户信心。\n\n就像 OmiseGo 一样，VeChain 是在\
  \ `Ethereum` 区块链网络开发的，并且仍在在使用。然而，开发者目前正在为自己开发一个新的全新的区块链网络。这是一个可行的方案，因为系统中有足够的需求和矿工，安全性将不再是一个问题。这次向新区块链的迁移意味着将\
  \ `BeChain (VEN)` 重命名为 `VeChain Thor (VET)`。\n\n## NEO (NEO)\n\nNEO 总部位于中国，中国目前正在努力清除网络上所有形式的加密货币。可以理解的是，他们希望对公民的财富拥有完全控制权。\n\
  \nNEO 有一个雄心勃勃的目标。那就是创建并支持一种新的数字“智能经济”。它的平台允许开发者创建去中心化应用（`dApps`），这些应用可以使用智能合约进行快速且安全的交易。\n\
  \n尽管对加密货币进行了打压，NEO 仍然成功筹集了足够的资金来开发和启动其项目。这导致一些人认为它与中国政府有关。无论事实如何，除了双方之外没人知道。\n\n\
  无论如何，NEO 的成功将完全取决于中国政府未来对加密货币的政策。如果他们决定完全禁止加密货币，那么 NEO 雄心勃勃的目标将化东流。\n\n## Lisk (LSK)\n\
  \n与 NEO 和 `Ethereum` 类似，Lisk 是一个为创建 `dApps` 提供解决方案的区块链平台。那么区别在哪里呢？Lisk 更强调帮助开发者。你可以认为，Lisk\
  \ 区块链生态系统运作非常像一个城市。\n\n把整个区块链想象成一个城市。主路是主链。从这条主路延伸出来的是侧链，就像大道。鼓励开发者在侧链上创建他们的 `dApps`，消费者可以使用这些侧链进行交易。开发成本将由交易费和其他奖励涵盖，这意味着鼓励开发者继续创新并致力于\
  \ Lisk 生态系统的工作。\n\n## Qtum (QTUM)\n\nQtum 读作 Quantum，总部位于新加坡。它的目标是提高智能合约对企业的触达范围和操作性。它提供了一种无需第三方即可快速、安全、方便地进行交易的解决方案。他们旨在通过将\
  \ `Bitcoin` 的稳定区块链结构与 `Ethereum` 的智能合约技术相结合，使用 `Proof of Stake` 共识模型来实现这一点。它目前仍处于开发的早期，但开发者已经有了一些雄心勃勃的计划，通过与许多\
  \ ICO 项目建立新的合作伙伴关系来扩张。\n\n## Filecoin\n\nFilecoin 在 2017 年发起了 ICO，是目前最受期待的代币项目之一，筹集了超过\
  \ 2.57 亿美元的资金。尽管它甚至还没有 alpha 版本，但它之所以如此成功的原因在于其团队的实力和支持者的背景。\n\n那么，Filecoin 正在努力实现什么才使其如此成功？它是一个去中心化的区块链生态系统，提供了一种安全高效地存储数据的方法。数据泄露无论在罚款还是公关方面都是非常昂贵的，除非你有顶级的安全措施，否则它们发生得很频繁。\n\
  \nFilecoin 利用区块链的防弹安全性来存储数据，从而最大限度地减少甚至完全消除数据泄露风险。正因如此，它获得了一些硅谷重量级风险投资公司的支持，这贡献了其巨大的资金。\n\
  \n## Ethos (ETHOS)\n\nEthos 总部位于美国，仍在开发中。他们的目标是帮助加密货币在全球范围内普及。为此，他们创建了一个平台，为用户提供广泛的区块链功能，旨在简化加密资产的存储、管理和交换。\n\
  \n以 Ethos 的钱包为例。它旨在兼容任何加密货币，并提供一个安全的空间来存储你的币，同时允许你随时随地、立即地发送它们。\n\n虽然还不知道何时发布公共版本，但至少\
  \ Ethos 发布了一个 alpha 版本，且 beta 版已在路上。这至少表明他们正在积极地推进该项目。\n\n## Substratum (SUB)\n\n\
  如果你在互联网上呆了一段时间，你可能会意识到消费者数据有多么价值。否则，公司就不会收集它们。美国的网络中立性已经死亡，全球其他司法管辖区，特别是那些政权并不民主的地区，正在努力货币限制、审查或完全阻止对各种数据的访问。\n\
  \n这产生了一种更民主、更易访问且最重要的是免费的手段，在网络上共享数据而不受任何审查或限制。这就是 Substratum 的用身之地。它是一个开源去中心化区块链网络，旨在赋予用户在没有任何形式限制的情况下共享信息的能力。\n\
  \n这在字面上是真正的即插即用。你不需要安装任何软件。你只需要在浏览器上安装它即可。尽管如此，你的设备将作为节点参与区块链，并作为另一个内容提供者，通过区块链协助请求信息。如果你这样做，就可以获得一些\
  \ `SUB` 令牌作为奖励。\n\n## EOS Token (EOS)\n\nEOS 是一种半去中心化的数字货币，为 `dApps` 和 `DAOs` 提供动力。许多人认为\
  \ EOS 是 `Ethereum` 的直接竞争对手。就像 `Ethereum` 一样，EOS 开发者希望加密货币成为世界领先的智能合约平台。\n\n从核心来说，与\
  \ `Ethereum` 相比，EOS 的速度快且扩展性更强。缺点是它必须放弃一些去中心化能力以来实现这种功能。在这种情况下，EOS 将控制权交给了所谓的“委托权益证明”共识机制（`dPoS`），并有自己的宪法来在平台上建立基本规则。\n\
  \n然而，EOS 在整个加密货币领域仍然非常新，在被认为是以 的严肃竞争对手之前，还有很长的路要走。由于由于原因，EOS 尚未被广泛接受。\n\n## Ripple\
  \ (XRP)\n\nRipple 更像是一个可以用于支付的数字令牌。它由 `Ripple Labs` 创建，允许用户使用法币进行快速的跨境支付。因此，XRP\
  \ 也被称为“银行币”。`Ripple Labs` 团队将 XRP 设计为最快且扩展性最好的数字资产。\n\n## TRON (TRX)\n\nTron 是一种用于数字娱乐和内容生成的数字货币。TRON\
  \ 协议具有大量的扩展性、可用性和吞吐量计算支持，使得在 TRON 生态系统中构建 `dApps` 成为可能。\n\n\n\n\n除此之外，它也适用于以太坊智能合约。波场\
  \ TRON 区块链网络的理念是实现互联网内容传输的去中心化。`TRX` 币将用于在其原生区块链网络上共享内容，并补偿在网络上分享其内容的创作者。正因如此，`TRX`\
  \ 被认为既是数字货币也是一种实用型代币。\n\n### IOTA (MIOTA)\n\n正如其名称所示的那样，`IOTA` 是一个独特的项目，旨在通过在物联网设备之间实现无需任何费用的快速机机交易，来改进物联网（IoT）。这一功能略领先于时代，但\
  \ `IOTA` 的人们想要致力于物联网的未来。目前，`MIOTA` 可以用作加密货币进行普通支付，因此它更像是一种数字货币。\n\n### Uniswap (UNI)\n\
  \n`Uniswap` 开发在以太坊区块链上。它是一个通过流动性池交换以太坊币的去中心化应用（dApp）。为此，`Uniswap` 提供了两种服务：提供流动性以及使用流动性。\n\
  \n`Uniswap` 允许用户利用其智能合约流动性池瞬间交易基于以太坊的加密货币。流动性池由其他用户组成，他们通过提供流动性获得一些交易费用。这些费用使用 `UNI`\
  \ 代币支付。\n\n### Stellar Lumens (XLM)\n\n`Stellar` 为用户提供了一个平台，将世界上具有不同且互不连接支付方式的各种银行系统结合。他们的网络通过去中心化账本将所有这些系统连接在一起。\n\
  \n`Ripple` 目前正在处理美国证券交易委员会（SEC）的调查，而 `Stellar` 是它的直接竞争对手。这为 `Stellar` 跨越并成为全球支付网络提供了空间。\n\
  \n作为对抗 Stellar 网络垃圾信息的一种方式，用户需要支付小额交易费用并满足保证金要求。这一切都是通过花费 `Lumens`（`Stellar` 的代币）完成的。\n\
  \n### Aave (AAVE)\n\n有些平台在加密世界提供去中心化贷款服务。然而，由于区块链的匿名性，贷款人和借款人之间需要大量的信任，而这通常是行不通的。再加上中心化贷款的利率较高，意味着贷款人在不放弃匿名性的情况下需要某种安全保障。\n\
  \n`Aave` 的出现通过在双方之间提供智能合约解决了这个问题。在这种情况下，借款人必须提供价值大于其想要借金额的押品。这些押品将被放入智能合约，并在整个贷款期限内存入托管（`Escrow`）中。这有效地减少了对信赖第三方的需求。\n\
  \n如果借款人无法还款，智能合约将启动并将押品释放给贷款人。由于押品的价值高于所借金额，贷款人不会损失太多。\n\n此外，`Aave` 为某些使用特定稳定币的贷款提供\
  \ 10% 的年化收益率（APY）。在这种情况下，不需要进行了解您的客户（KYC），这在传统金融世界中是从未实现过的。\n\n### 狗狗币 (Dogecoin)\n\
  \n在写本文时，`Dogecoin` 发生了出人意料的转变，价格飙升。它被列入此列表并不是因为它有什么特别之处。事实上，事实恰恰相反。`Dogecoin` 于\
  \ 2013 年推出，使用“Doge”迷因作为其吉祥物，该迷因描绘的是日本赤犬。它没有广阔前景，也没有引入任何新类型的技术。这种硬币背后的开发者很诚实，他们说硬币是作为一个玩笑创建的。仅此而已，不多也不少。\n\
  \n那么，其价格飙升的原因是什么？\n\n再次，在写本文时，有一场推高 GameStop 价格的运动，这是一个由名为“WallStreetBets”的 Reddit\
  \ 子板块策划的集体运动。这一运动发生在一个名为“Deepf\\*\\*kingValue”的 Reddit 用户注意到这一点时。\n\n\n\n\n在这里，我们假设你想要对加密货币进行长期投资，并想知道如何提高你的胜率。正如你可能猜到的，这并不是去\
  \ Coinbase 买入前十种币之一并长期持有（HODL）那么简单。\n\n就像股票一样，你希望你的投资组合实现多元化。这里的核心思想是通过混合多种不同的投资来降低风险。这样，你的投资就会分布在尽可能多的不同领域，从而降低整体风险。如果你的投资中某一个领域失败了，你还有其他投资可以维持运营。\n\
  \n例如，假设你将 90% 的投资放在比特币上，10% 放在以太坊上。从一开始你就会遇到几个问题。首先，分配非常不利。你只有两项投资。更不用说，这两者之间存在高度相关性。如果比特币价格下跌，以太坊也会随之下跌。这意味着，你的整个投资组合将处于严重风险之中。\n\
  \n因此，你想要投资其他与比特币并非真正紧密关联的山寨币（Altcoins）。你如何判断呢？你可以查看某个山寨币相对于比特币的相关系数。其值范围从 1 到 -1。数值越高，该山寨币与比特币的关联就越紧密。\n\
  \n当然，所有山寨币以某种方式都与比特币相关，但这处于一个光谱上。这个数字很难变成负数，但你应该持有一些相关系数在零附近波动的币种。这样，如果某天比特币真的崩了，你也可以度过这场风暴并脱颖而出。\n\
  \n## 学习基础知识\n\n如果你对加密货币世界完全是一个新手，对于交易更是如此，那么请不要为此感到沮丧。每个人都要从哪里开始。为了让你快速进入状态，我们将介绍一些基础知识。\n\
  \n让我们从投资组合（Portfolio）开始。“投资组合”是指你所有投资资产的集合。如果你投资了十种类型的货币或代币，那么你的投资组合就由这十种货币或代币组成。\n\
  \n然后还有需要考虑的风险。它们是什么？风险代表交易者或投资者为了从投资中获得利润或收益而愿意承担的损失可能性。在加密货币市场，主要有两种风险：系统性风险（或市场风险）以及币种风险（或特异性风险）。\n\
  \n市场风险与加密货币市场的整体表现相关的风险。这种风险是内在且不可避免的。因此，你所能做的是将风险降至最低。这是因为所有加密货币在某种程度上都与比特币以及彼此相互关联。就像\
  \ 2016 年减半后的比特币崩盘一样，几乎所有的币和代币变得几乎不值。\n\n特异性风险容易处理得多，因为它们与特定的币或代币相关。这些风险受到直接与项目或币本身相关的因素的影响。例如，假设项目经历了网络故障、开发团队成员辞职、整个开发团队卷走了投资者的资金或任何其他负面事件，那么持币者就会亏损。\n\
  \n投资世界中趣味之处在于，风险既是福赐，也是诅咒。金融世界的常识认为，风险越大，回报越高。\n\n## 投资时需要考虑的关键因素\n\n那么，在你跳入加密货币交易之前，你应该考虑哪些事情呢？\n\
  \n### 时机\n\n由于加密货币市场的波动性，时机决定了一切。虽然概念简单，但实际上操作起来比人们想象的要困难得多。通常，当你进入一笔交易时，你应该为自己的入场和离场点准备主计划和几个备用计划。如果未能定义这两点，你将面临亏损的巨大风险。\n\
  \n这里的基本原则是在看跌趋势时买入，在看涨趋势时卖出。简单来说，就是低买高卖。简单，但难以做到。你必须应对的不仅仅是市场波动，还需要在面对主流形势时做出正确的决策。\n\
  \n### 交易 vs 投资\n\n我们之前讨论过这个话题，但在这里再次提到它是值得的。鉴于市场上有这么多加密货币，加上加密货币本质上具有波动性的事实，你应该知道自己正处于为一段特别坎坷的旅程做准备，在跳进去之前，你应该清楚自己在做什么。这涉及到分析。分析主要有两种类型。\n\
  \n第一种是基本面分析。这涉及一个非常基础的研究过程以及对你收集的数据进行分析。你首先会寻找该币种的白皮书或开发团队的详细提案。它应该包含你建立基础理解所需的所有信息。你应该寻找有关其运营行业的信息、它试图解决的问题、它计划如何实现目标、公司的内在价值、财务报表以及其他经济变量。\n\
  \n但白皮书可能会变得非常技术化，所以你也可以寻找替代来源。你应该这样做，是因为一个拿了薪水的销售人员不会对自己写任何会阻止潜在买家或投资者的负面内容。为此，你想要查看博客文章或社区论坛，以获取围绕该币的普遍情绪、开发者如何与社区互动等信息。\n\
  \n大多数人可能已经研究过那些技术术语，并为你在你之前来的人详细解释了它们。如果没有，你只需要问，就会有人乐意向你解释。。或者，你也可以在 Google 上搜索该术语并加上“ELI5”，意思是“像对\
  \ 5 岁孩子解释一样向我解释”。不要介意这个词带有贬低的语气。\n\n另一种分析形式是技术分析。这需要更多的数据，因为你需要预测近期的价格走势，这要求你查看过去的市场数据，特别是成交量和价格。这一切都涉及到大量的图表和数字计算，可以理解这并不适合所有人。与基本面分析不同，技术分析不评估币的内在价值。它只是观察价格图，理解趋势和模式，并据此制定策略。\n\
  \n现在，你需要问问自己是想投资还是交易加密货币。这两者都有其细微之处。\n\n交易路径涉及短期但频繁的投资，因此更适合喜欢在边缘生存的交易者。交易者会使用技术分析来识别价格波动模式，并据此调整他们的入场和离场时间。\n\
  \n另一方面，投资路径更规避风险。你的计划是长期持有币种，通过在几个月甚至几年后卖出币，或持有证券代币并获得股利来获取利润。因为你不需要过度关注近期微小的价格波动，你的重点应该放在币种的内在价值上。这意味着，你需要进行一些基本面分析。\n\
  \n无论你选择哪条路径，你都应该做足够的研究，以便了解自己是一个什么样的人（无论是冒险者还是学者），以及你所研究的币种相关的风险，以及你是否能够承担这些风险。\n\
  \n\n\n\n另一个需要考虑的因素是你的经验和整体能力。这里的理念是你应该专注于自己的专长。为此，你应该问自己：你研究哪些硬币和代币？你最熟悉哪个领域或行业？你对实用型代币（utility\
  \ tokens）和证券代币（security tokens）哪一个理解得更好？\n\n正如之前提到的，每个人都必须从某个地方开始，没有比熟悉的领域更好的开始地点。这对你来说最有效，你也可以借此建立能力。通过这种方式，你可以学会掌握局面并实现利润化。\n\
  \n## 如何开始\n\n你可以使用多种策略来使投资组合多元化。这就是为什么我们在上一节中尽力解释了每个 `Altcoin` 的作用。你这里的策略涉及观察该 `Altcoin`\
  \ 提供了什么以及它是如何实现的。考虑到这一点，有几项策略需要回顾一下。\n\n### 行业多元化\n\n这个理念非常简单。你只需要看该 `Altcoin` 服务于哪个行业，并尝试通过投资尽可能多个行业的\
  \ `Altcoins` 来实现多元化。这样，当某个行业遭受打击时，你的投资组合可以经受住冲击。`Altcoins` 所属的主要行业包括金融、医疗、供应链、数据及数据分析以及创新（如\
  \ `AI` 或机器学习）。\n\n你还可以更进一步，在每个行业内部进行观察，并根据代币背后的项目再次对你的投资进行多元化。这意味着你可以支持已经成熟的项目、新兴的项目、解决现有问题的项目或那些带来创新的项目。\n\
  \n从这里开始，如何投资完全取决于你。上述每个子策略都有其自身的风险和优势。尽管如此，你永远不要投资于一个你并不了解的项目。如果你不理解它们的价值或其运营的行业，情况甚至更加如此。\n\
  \n一如既往，请进行你自己的研究（DYOR）。大多数情况下，你可以在项目页面上找到大部分信息。如果页面上充满了术语和复杂的语言，那么它很可能是一个糟糕的投资。\n\
  \n### 解决方案方法\n\n第二种策略取决于 `Altcoin` 提供的解决方案或产品类型。这将涉及观察该 `Altcoin` 的区块链是如何运作的。有些会提供新的工具或服务，如数字钱包、`dApp`\
  \ 开发平台、新协议等。\n\n并不是所有的商业活动都能成功。并不是所有的解决方案都有良好的终结。因此，通过这种方式分散投资也能降低风险。\n\n### 加密货币类型\n\
  \n正如之前提到的，加密货币有四种：基于挖掘的、`stablecoins`（稳定币）、`security tokens`（证券代币）和实用型代币。由于每种加密货币都有自己的优缺点，通过这种方式分散投资，你也可以使风险最小。\n\
  \n你还可以将加密货币分为五类：交易代币、智能合约代币、收益代币、实用型代币和 `stablecoins`。交易代币是在交易中消耗的硬币，如 `Bitcoin`。智能合约代币是允许开发者在其区块链网络上创建\
  \ `dApps`、运行 `smart contracts` 等的协议。收益代币基本上是通过资助项目并赚分红而获得的 `security tokens`，这样你获得的币会比投入的更多。\n\
  \n尽管如此，请确保查看不同的可能性以及你想要如何分散你的投资。\n\n### 地理多元化\n\n最后，根据不同地区投资硬币。`Asian` `blockchain`\
  \ 项目特别受欢迎，因为它们涵盖了全球很大范围内。但你也可以考虑投资位于`America`和`Europe`的项目，以获得地理上平衡的投资组合。\n\n###\
  \ 时间多元化\n\n另一种多元化方式是通过时间。这个理念是你不要一次性投入所有的钱。相反，你会随着时间进行投资。如果你有 `$100,000` 要投资，你不要全投入。你只需每月投入\
  \ `$5,000`，持续 20 个月，然后顺其自然。通过这种方式，你限制了为了获得最佳投资回报率而必须把握市场入场时机的风险。\n\n假设你从 `January`\
  \ 月开始投资 `Bitcoin`。你每月投入 `$5,000`，并且并不在意价格波动。你只是把这五千美元花在能买到的数量的 `Bitcoins` 上。六个月后，你已经向\
  \ `Bitcoin` 投入了 `$30,000`。但假设价格有利，`Bitcoin` 的价格上涨。那么你可以带着超过 `$30,000` 退出市场。\n\n\
  但如果价格下跌会发生什么？那么你的投资就会受到损失，最终得到的钱比你投入的少。这并不好。但这就是尝试把握市场时机的风险。至少，通过时间进行多元化，你不会损失大量的钱。\n\
  \n如果你预先投入所有的钱，而市场变得变糟了，你可能会失去一切。至少通过这种策略，你只会损失一些现金，所以损害是有限的。\n\n## 四步多元化策略\n\n最后，我们有这种四步策略。这种策略中没有特别具体的规定，除了你根据硬币如何为你提供价值来对它们进行粗略分组。\n\
  \n### 基础\n\n你投资组合的第一部分应该由一些核心加密货币组成，如 `Bitcoin`、`Ethereum` 和 `XRP`。由于它们的内在价值，这些应该占你投资组合的\
  \ 10%到 25%。`Bitcoin` 是数字黄金。`Ethereum` 由于其提供的众多功能而是最流行的加密货币。`XRP` 是一个支付网络。这三种币都有特定的且独立的用途。\n\
  \n### 被动收益者\n\n一旦奠定了基础，考虑扩展到能够为你被动产生资金的 `Altcoins`。在这种情况下，挖掘不是被动收入，因为你需要让电脑工作。这里的被动收益者指的是\
  \ `security tokens`、`yield-earning tokens` 或利息币（它们是同一事物），它们通过你持有这些币为你产生收入。\n\n除了内在价值外，这些代币还会每月、每季度或每年发放分红。`Stellar`、`Bankera`\
  \ 和 `NEO` 是这里很好的例子。尽管 `NEO` 是这些中最流行的，但 `Stella` 被被严重低估了，值得关注。\n\n硬币的另一种被动收入形式是 `airdrops`\
  \ 和 `hard forks`。`airdrops` 与预挖币类似，因为开发者会直接赠送免费币。这里的区别是 `airdrops` 是一种营销手段。`Hard\
  \ forks` 也有益处，因为新创建币的开发者通常会给迁移到新加密货币的人相同或等值的币。\n\n通过良好的被动收益者选择，你只需持有它们就能开始获得币和钱。这将形成平台，推动你进入更新的、可能风险更大、但未来可能会产生更好回报的投资项目。\n\
  \n### 锚点\n\n加密市场以其波动闻名。因此，当海浪汹涌且看到地平线上出现乌云时，你希望有一个可以依靠。为此，你希望你的投资组合中拥有 `stablecoins`\
  \ 来帮助你度过风暴。Pax、`USDC`、`TrueUSD` 和 `Tether` 是这里的一些不错选择，因为它们与法币挂钩。\n\n\n\n\n稳定币为保护投资组合免受加密市场不可预测的波动提供了一种极佳的方式。它们为你提供了按需流动性。简单来说，因为它们的价值相对稳定，你可以将资金投入其中，由于它们的价格在未来不会发生太大变化，你可以将它们卖掉以获取资金以备不时之需。\n\
  \n所以，当市场遭受打击时，至少你的投资还在稳定币中，而你投资组合的其他部分可能正在付诸东流。但由于它们的价格相对稳定，你可能无法从中获得任何长期收益。尽管如此，它们还有另一个有趣的用途。\n\
  \n假设某种特定加密货币的价格暴跌，而你想“抄底”。你知道价格在不久的将来会飙升，并且想在趋势发生之前赶上它。问题是你手头没有多少钱。没关系，你只需要卖掉稳定币，在价格低位时将资金投入该加密货币中。当价格回升时，你可以卖掉一些币并放回现金储备，并将剩下的落入囊中。\n\
  \n## 边缘领域\n\n老实说，你可以停留在最后一个阶段，舒适地守着你的投资。然而，如果你知道自己在做什么，进行扩展也并无害。在这种情况下，你想要寻找具有潜力的较小、分众协议。你只需要关注你认为未来会成功的上线项目，并购买它们的\
  \ `ICO` 或其代币。\n\n如果这些项目成功，你可以通过两种主要方式从中获益：你可以在项目代币或货币廉便宜时买入并在日后卖出；或者，如果它们提供可以让你定期获得分红的证券代币，则持有它们。对于后者，你将为你的投资组合填充更多的被动收入来源。\n\
  \n一如既往，你的投资组合应该保持良好的多样化。在这种情况下，你希望每一类数字资产在行业、解决方案、类型或地理上都具有多样性。当然，你可能没有足够的资金在所有方面进行多样化，但请尽力做到多样化。\n\
  \n## 将多样化付诸实践\n\n我们涵盖的是实现货币多样化的某些方法。但问题仍然是：如何做？我应该向每种币投入多少钱？这实际上取决于你的风险承受能力以及你手头的资金量，因此无法给你出一个精确的数字。相反，这里有一些基础的多样化模型，让你对什么方案最适合你心中有数。\n\
  \n### 新手\n\n如果你刚开始接触加密货币，并且对投资或加密货币了解不多，那么这是一个很好的策略。如果你是这整个领域的新手，应该从这里开始。在 във模型中，你只需要像我们上面提到的那样选择一组多样化的币，并将你的资本等额地分配给每种资产。取决于你选择哪种币，你的风险水平处于中等到低。\n\
  \n### 赌徒\n\n虽然这种策略不适合初学者，但他们这样做是因为它太简单了。多样化方面话可无，因为你会将全仓投入一种加密货币，而不考虑其他任何。最多，你也只将投资组合的一分之一或\
  \ 10% 留在其他数字资产上。这是高风险高回报。它有时效果很好，但大多数时候并不如此。你的目标币将是 `Bitcoin` 和 `Ethereum`。\n\n\
  ### 保守型\n\n这个模型也非常简单。你查看前十大加密货币，并为每种分配相等的资金。当然，你不需要投资全部十种，这取决于你有多少钱。作为起点，五个或三个就足够了。为此此，你可以投资\
  \ `Bitcoin`、`Ethereum` 以及 `Litecoin` 或 `Ripple`。\n\n### 巨户\n\n“鲸鱼（whale）”一词指的是有大量闲置资金的人。这个词通常出现在游戏社区，尤其是带有微交易的游戏，这些游戏允许你使用真实货币购买某些物品。这些人通常在微交易上花费大量资金，要么是因为上瘾了，要么是因为他们有很多闲钱。\n\
  \n在这种情况下，这个词简单地意味着你有相当的现金，并想将其善用。通过这种模型，你将资本的大部分分配在几种加密货币之间，然后收购少量的其他货币。再次，你想要投资\
  \ `Bitcoin`、`Ethereum` 以及 `Litecoin` 或 `Ripple`。你应该投入多少取决于你自己。但如果你真的想要一个数字，可以给这三种主要的加密货币各分配\
  \ 25% 的资本，并将剩下的 25% 留给其他较小的加密货币。\n\n### 保护主义者\n\n这种策略主要用于对抗通胀。除非你住在恶性通胀盛行的津巴布韦或委内瑞拉，否则你可能并不真正知道或理解恶性通胀的影响。老实说，没有人真的想通过这种方式来体验。\n\
  \n来自遭受这种经济现象国家的人通常使用数字资产来对冲通胀。他们将大部分储蓄投入稳定币，而只对 `Bitcoin` 等波动性资产投入极少资金。\n\n## 加密货币的替代方案\n\
  \n支持加密货币的区块链技术有广泛的用途。`Ethereum` 为我们揭示了一个事实：开发者可以创建在区块链网络上运行的去中心化应用程序，用于无安全风险的数据存储和分析，以及在满足某些条件后自动执行的智能合约。\n\
  \n这些应用中包括 `ICOs` 或初始代币发行。虽然有些人会因为它们的相似性认为 `ICOs` 仅仅是美化版的 GoFundMe 募捐或 Patreon，但\
  \ `ICOs` 是另一种投资加密货币的绝方法。简单来说，投资 `ICOs` 非常像投资初创公司并获得公司的股份。如果你选择了正确的项目或初创公司，回报将是惊人的。\n\
  \n你投入资金购买加密货币，并希望它们的价格在未来上涨，从而卖出更多钱。你可以停在此处，但你也可以通过制造加密货币来更进一步。\n\n在这一节中，我们将扩展“被动收入”币的概念，特别是证券代币，并介绍如何将资金投入正确的项目。但在在此之前，让我们再次谈谈基础知识。\n\
  \n### 什么是 ICO？\n\n我们过去提到过 `ICOs`。它的运作方式如下：假设你是一个拥有大想法的硅谷创业者。这并没有缩小多少范围，但让我们就这么吧。\n\
  \n`ICO` 全称为初始代币发行。它的运作方式如下：首先，你创建一个详细说明你的解决方案如何工作的文档。这被称为白皮书（white paper）。然后，你设计一个精美且专业的网站（正如目前的趋势），并解释为什么你的项目值得支持。\n\
  \n\n\n\n然后，你只需要要求人们向你发送加密货币即可。大多数情况下，如果你在他们的区块链上设计项目，那通常是 `Ethereum`。这也是你需要创建自己的代币的地方，并将将其发送给你的资助者。你获得了所需的资金，而你的资助者也希望你成功。如果你拿了投资就跑路，那就是诈骗。\n\
  \n请记住，在 `ICO` 中，你发行的是实用型代币（utility tokens）或加密货币，而不是证券代币（security tokens）。因此，公司所有不需要放弃公司的股权。\n\
  \n对于投资者来说，你将无法获得被动收入的来源。但你拥有的实用型代币可能会派上用场。例如，如果公司创建一个新的加密货币交易所平台，为代币持有者提供交易折扣，这将让你受益，因为你可以以较低的手续费在交易所开始进行交易。\n\
  \n不同的公司或项目赋予代币持有者不同的特权，其中某些非常有用。即使你对获得这些收益不感兴趣，你也可以在项目成功后卖掉代币以赚取更多钱。\n\n但如果你想获得证券代币，你需要寻找\
  \ `STO` 或证券代币发行（Security Token Offerings）。\n\n### 什么是 STO？\n\n该过程与 `ICO` 很大相同，不同之处在于有很多规定需要处理，因为代币所有者有权获得公司利润的分红。证券代币代表持有者对公司的所有权或股份。换句话说，`STOs`\
  \ 非常像 `IPO`，即首次公开募股，公司向公众出售其股票。\n\n### STO 与 ICO\n\n如前所述，该过程很大相同，但代币的特性不同。\n\n首先，`STOs`\
  \ 是资产支持的，并且必须遵守规定。因此，启动一个 `STO` 非常困难，因为其核心理念是在证券法框架下提供投资合同。所以，`STO` 项目背后的人必须确保他们符合所有相关规定。此外，他们通常只能通过符合某些要求的合格投资者筹集资金。\n\
  \n`ICOs` 的启动没有那么困难。这归因于简单的事实：它们的实用型代币是为了使用的，而不是为了投资。因此，它们可以规避严格的监管。所以，如果初创公司只是发行\
  \ `ICOs`，其准入门槛要低得多。他们只需要专注于开发自己的项目并开发他们的实用型代币。\n\n### STO 与 IPO\n\n再次，过程大部分是相同的。区别在于，`STOs`\
  \ 在区块链网络上发行代币，而 `IPOs` 在传统市场提供证书。两者都受到了良好的的监管，因为它们属于证券法的范畴。\n\n尽管如此，`IPOs` 仅在私有公司想要上市时使用。它们可以通过首次公开募股过程向合格投资者分发股份来筹集资金。\n\
  \n另一方面，`STO` 开发者将提供证券代币。这些代币代表了通过区块链网络向合格投资者发行的底层资产。虽然代币可以代表公司的股份，但也可以代表任何预期产生利润的资产，例如物业所有权、投资基金、艺术品等。\n\
  \n### STO 监管\n\n正如你可能预期的那样，这取决于管辖区。在美国，证券交易委员会（`SEC`）对于如何定义证券代币非常活跃。他们还在辩论是否应该将某些实用型代币重新归类为需要监管的证券代币。\n\
  \n虽然证券代币和实用型代币之间的界限相当清晰，但有些业务在灰色地带运行。某些企业发放与证券代币非常相似的实用型代币。这样，他们就可以通过承诺定期分红来吸引更多人，而无需处理所有与证券代币相关的所有规定。\n\
  \n根据 `SEC` 的规定，如果 `ICOs` 符合投资合同的定义，将被重新归类为证券。该定义是由最高法院通过一个案件确立的。\n\n\n\n对于 ICO，你必须格外小心。请记住，这里的诈骗非常容易发生。加密货币支付无法撤销的，除非你给接收者写一封措辞严厉的信并听天由命。\n\
  \n7![](img/svgimg0003.svg)\n\n# 做好你的法律准备\n\n如前所述，加密货币的监管情况取决于当地的司法管辖区。这将涉及学习如何阅读那些极其复杂的法律，这些法律的设计似乎是为了给律师创造新工作。如果你觉得理解法律格局很困难，请考虑寻求专业帮助。\n\
  \n## 关于法律事务\n\n如前所述，全球各国政府对加密货币持有不同观点。尽管你可能一眼就能预见到结果，但通常是那些不民主的国家在禁止加密货币，而自由国家则在寻找方法对这种新的数字资产引入监管，以此将其整合进自由市场。\n\
  \n### 美国\n\n例如，美国允许加密货币在其司法管辖范围内运行。尽管如此，各州对加密货币并没有统一或一致的法律方法。法律在各州之间变化，甚至联邦法也无法判定加密货币。\n\
  \n虽然讨论某物是什么或不是什么对普通人来说可能并不重要，但如果你没有准确定义它，可能会毁掉整个法律框架。例如，金融犯罪执法网络（FinCEN）将加密货币视为资金传输工具，而\
  \ `IRS` 则将它们视为财产。这对于局面真的没有任何帮助。\n\n加密交易所也必须应对不确定性，因为政府对此事尚未下定论。一方面，他们不知道需要遵守什么法律，以及应该向哪个机构汇报。不同的监管机构有不同的司法管辖权，并且他们拥有决定权。问题是，许多不同的监管机构都声称拥有管辖权，尽管目前还没有统一的方法。政策仍然不明确。\n\
  \n截至目前，“加密货币”实际上并没有一个统一的定义，因为各州对这个问题持有不同观点。它通常被称为虚拟货币、数字资产、数字代币、加密资产或直接称为 crypto。美国的许多司法管辖区采用了更具技术中立性的宽泛定义，而一些地方则想制定详细的定义。后者必须在技术演进时进行监管，但他们必须跟上时机。\n\
  \n尽管一切都处于混乱之中，但至少美国政府正在努力创建某种总的加密货币监管机制，以便人们至少可以确定政府是如何定义它的，以及哪些法律适用于它。\n\n### 欧盟\n\
  \n欧洲联盟在加密货币方面面临着不同的问题。尽管在整个欧盟范围内被广泛认为是合法的，但交易所的规则取决于它们所在的国家。这意味着不同的税收也不同，你在一个国家支付的税率为\
  \ 0%，而在另一个国家则可能是 50%。加密货币还涉及资本利得税。从目前来看，`EU` 议会对现状相当满意，因为他们还没有通过任何关于加密货币的更具体的立法。\n\
  \n交易所需要向当地的金融机构注册。一旦完成，它们就可以在 `EU` 的司法管辖范围内运营。此外，它们还必须遵守 `EU` 的反洗钱规定。一些加密交易所允许用户在不交增值税的情况下将法币转换为加密货币。\n\
  \n### 英国\n\n英国在一段时间前退出欧盟后，创建了自身的加密货币监管条例。英国不将加密货币视为法定货币，但允许加密交易所运营。加密货币的纳税情况取决于涉及的双方和活动，但收益或亏损须缴纳资本利得税。\n\
  \n加密交易所被允许运营之前需要首先向`金融行为管理局`（`FCA`）注册。某些特殊情况下允许在线注册。`FCA` 还有权监督处理加密货币的业务如何处理恐怖融资和洗钱问题。\n\
  \n### 俄罗斯\n\n俄罗斯与加密货币的关系非常复杂，但他们似乎终于决定了如何处理。他们现在正采取行动反对使用加密货币，因为它们被归类为货币替代品。最近的一项法律禁止货币替代品，因此根据俄罗斯司法管辖区的分类，加密货币是违法的。目前尚不清楚加密货币还可以用于什么。\n\
  \n前景中还出现了一些提案，可能允许没收加密货币。这些提案可以作为法律的形式实施。尽管由于一切都是匿名且去中心化的，目前还不清楚俄罗斯政府计划如何没收加密货币。\n\
  \n### 中国\n\n中国对这一问题的立场非常明确。他们拒绝加密货币，并正努力将其从本国清除。事实上，他们已经为此努力了很长时间。中国人民银行自 2013 年起就禁止金融机构处理\
  \ `Bitcoin` 交易。2017 年，他们禁止了加密交易所和 ICO。\n\n那时曾有一些通融办法，但那些漏洞很快被堵死了。挖矿在中国曾非常盛行，因为它在某种灰色地带运行，但政府也希望停止这种行为。\n\
  \n简而言之，中国拥有世界上最严厉的反加密货币法律，而且对他们来说情况只会变得糟糕。近期政府的打击行动导致一些总部位于中国的加密交易所关闭。\n\n### 日本\n\
  \n令人惊讶的是，日本在加密货币监管方面曾是世界上最进取的国家之一。日本在 2017 年曾是 `Bitcoin` 最大的市场。虽然现在已经失去了这一头衔，但它仍然保持得很好，足以被视为市场规模领先的国家之一。\n\
  \n加密货币在日本被视为合法财产，并作为杂项收入纳税。加密交易所的监管也远领先时代，尽管过去发生过多次加密交易所的安全漏洞事件。从那时起，日本开始对加密交易所执行更严格的规则，以保护消费者和运营交易所。\n\
  \n日本被认为是对加密货币最友好的国家之一。尽管如此，针对交易所的网络引起了监管机构的注意。作为回应，他们现在有一个专门处理加密交易所的监管机构。这是恢复进步与监管之间平衡的举措。\n\
  \n### 印度\n\n印度的情况有所不同。尽管印度政府接受加密货币，但他们与印度储备银行在法庭上发生了冲突，因为后者禁止了加密。虽然加密货币在印度禁止，但法律战仍在进行。\n\
  \n考虑到这一点，加密货币的未来仍然是不确定的，只有时间能证明结果如何。许多争议围绕着加密货币如何被用于洗钱和资助恐怖主义。但是，通过正确的监管，可以采取相应的措施来应对这些问题并促进进步。\n\
  \n\n\n\n# 使用税务计算器\n\n幸运的是，因为我们生活在一个科技先进的时代，你不需要翻阅成千上万条条例来弄清楚你需要向政府缴纳多少税款。这也很重要，因为你可能需要记录你过去进行的所有交易。\n\
  \n尽管区块链技术按时间顺序记录所有内容并让每个人都能访问，但在纳税截止日前的几天去回过所有内容仍然是一件麻烦事。因此，现在建立一套追踪税款的系统是值得的，这可以避免你以后遇到很多头疼的问题。\n\
  \n这里想到了几个程序：Accointing、Cointracking 和 TokenTax。\n\n如果你是加密货币领域的新手，可以考虑使用 Accointing，因为它以用户为中心，并提供一些实用的教育内容。他们有一款加密货币追踪\
  \ App 和加密税务软件，可以根据你所在的国家（无论是美国、英国、德国、澳大利亚等）提供特定的结果，这些国家使用 `FIFO` 或 `LIFO` 税务方法。他们还提供优秀的客户支持，而且价格非常亲民。\n\
  \n但如果你熟悉税务知识，并希望使用一个具有统计数据等功能的复杂平台，可以考虑 Cointracking。它在数据方面拥有多功能架构，但对初学者来说可能不是一个好选择。\n\
  \n如果你希望获得一个提供专业帮助来完成税务工作的平台，可以使用 TokenTax。专业人士的加入意味着法规的任何更新都会迅速反映在你的税务报告中。其他某些平台可能需要一段时间来更新它们的计算器，因此你可能会陷入麻烦。TokenTax\
  \ 唯一的缺点是价格比任何其他平台都高得多。他们几乎为你处理了大部分工作。他们涵盖了英语国家，并可以处理各种税务方法。如果你愿意且负担得起，你还可以获得一个带有注册会计师（CPA）服务的税务包。\n\
  \n## 降低你的税税\n\n信不信由，你有几种方法可以降低税税。当然，这并不是逃税。你只是利用法律来削减一些本可以不需要的额外支出。这符合伦理吗？这取决于哲学家们。\n\
  \n但你可能会发现，大大公司（尤其是跨国公司）总是在寻找减税的方法。普通人并不了解税法的复杂性，因此他们通常花费了比需要更多的钱。这里有几个建议，你就能省下几个百分辛苦赚来的现金。\n\
  \n### 税务亏损收割 (Tax Loss Harvesting)\n\n听起来比实际情况更阴险。它的运作方式是：如果你发现你的一些加密货币资产价值下降，你可以将它们卖掉以产生亏损。这将减少你的总税单。这既不违法也不违背伦理。用资本利得抵消资本亏损是完全合法的。所以，如果你有一些价值贬了很多的加密货币，可以考虑将其卖掉，以减少你在本财年早些时候所获得收益的税费。你可以抵消高达\
  \ `$3,000` 的金额，但务必检查当地的法律。\n\n### 长期投资\n\n`IRS` 将加密货币视为财产。因此，按照他们的规则办事，如果你持有投资超过一年，其资本利得税率会较低。因此，如果你在九个月后买卖你的加密货币资产，你的资本利得税将比持有超过一年更高。\n\
  \n（注：提供的源文本在“长期投资”及之后的部分包含多个重复/碎片化的句子。我已在保持核心逻辑不变的基础上清理了结构流。）\n\n\n\n\n\n加密货币对许多注册会计师（CPA）来说是一个新领域，他们中的很多人对此一无所知。当你评估他们的普遍熟悉程度时，问问他们自己是否持有任何加密货币。如果他们说是的，那就意味着他们至少了解加密货币的基本知识。\n\
  \n然而，如果答案是否定的，那么问问他们过去是否过处理过加密货币相关业务客户的经验。有些注册会计师不持有加密货币是因为他们对加密货币的未来仍持有保留，对此你并不能真正指责他们。但是，如果他们过去曾成功帮助过加密货币客户，那么他们可能仍然适合你的工作。\n\
  \n然而，值得注意的是，加密领域的法规非常概括，大部分内容都取决于解释。大部分内容仅仅是指导性的，而且起初可能并不具有法律约束力。因此，纳税人可能会根据他们能够承受的风险程度，在纳税表上报告不同的内容。\n\
  \n这意味着目前还没有官方的加密货币税务专家。某些注册会计师可能在该领域拥有经验，因为他们是在工作中学习加密货币的，但他们已经是该领域的顶尖人才了。这些人与监管机构交流，关注最新的加密货币税务新闻，并在工作中学习。\n\
  \n此外，优秀的注册会计师关心客户并看重诚实。他们可以告诉你各种不确定性，并彻底解释其原因。例如，质押收益（staking income）可能以不同的方式征税。有些人认为，你应该在出售代币时缴税，而不是在获得它时。现在，许多问题都会得到这些不确定的答案。如果你的注册会计师对此坦诚并与你沟通了这一事实，说明他们知道自己在说什么。应该避免那些自以为是的人。\n\
  \n最后，问问他们的工作流程。更具体地说，问问他们如何利用技术来计算你的收益、亏损以及你最终需要支付的税款。有很多加密货币税务程序可以帮助你完成这一点。\n\n\
  当然，你可能会在这里反驳，如果注册会计师都要使用软件，那么你自己来不是更好吗？你说的可能是的。但是，注册会计师可以确认税额是否正确，而普通人无法做到这一点。所以，问问你的注册会计师使用哪种程序或软件。\n\
  \n如果他们说一切都是手动完成的（例如使用电子表格或手工操作），那么这是一个巨大的危险信号。手动计算非常耗时，这也会让你花费更多的钱，而且加密领域的复杂性加上你的注册会计师是人类这一事实，意味着会有很多错误。手动跟踪你的税款是一项不可能完成的任务。\n\
  \n## 律师\n\n拥有加密货币律师更多是为了发行代币的公司利益，而不是购买代币的人的。加密货币律师可以帮助你理解即将发布的代币会被归类为实用型代币（utility\
  \ token）还是证券代币（security token）。\n\n你需要在启动 `ICO` 或 `STO` 之前解决这个问题，这就是为什么客户通常不需要加密货币律师。他们已经知道代币是实用型代币还是证券代币。\n\
  \n理想情况下，你希望有一个按项目计费的律师。每个项目的费用可能很昂贵，但至少你的律师会被鼓励尽快完成工作。如果他们按小时收费，当律师工作时，你可能会感觉到钱正从钱包里流走。\n\
  \n在雇佣加密货币律师时，你需要寻找几点。首先，他们需要拥有你所在州法律的专业知识，因为不同的州可能有不同的法律。此外，你的律师还应该具有证券法经验，因为证券代币受该法律约束。最后，出于显而易见的原因，他们需要对加密货币有全面的知识。\n\
  \n8 ![](img/svgimg0003.svg)\n\n# 投资的技术性\n\n正如你可能猜到的，投资是一个极其复杂的“陷阱”。在你认为自己是一个勉强胜任的交易员之前，你需要理解许多细微差别和注意事项。投资世界是复杂的，这说明了为什么许多人决定放弃并去追求一些不那么无聊的事情。\n\
  \n你可以像 `SatoshiBets` 上的许多用户做的那样，只看图表并低买高卖。但在幕后发生着许多事情，在你真正理解市场之前，你必须掌握这些事情。因此，在本章中，我们将介绍投资的技术方面。\n\
  \n## 从小开始\n\n当你想要投资某个特定的加密货币或项目时，你需要了解关于它们的几点信息。为此，有两种分析模型：基本面分析和技术面分析。我们在第 6 章中简要介绍过这些，现在我们在这里详细讨论。\n\
  \n尽管加密市场是不可预测的，但你了解是什么导致价格上涨、下跌或稳定的会更好。通过一些可靠的分析，你至少可以对预期结果有一个大致的了解。精明的交易员会知道何时进入市场以及何时退出市场。\n\
  \n### 基本面分析\n\n这种分析模型的特点是它适用于所有交易工具，无论是加密货币、外汇等。它兼容所有类型的交易。其核心概念非常简单：如果你知道一项资产的内在价值高于当前价格，那么你就根据你的分析进行交易并获利。\n\
  \n换句话说，如果你看到有很大机会成功的项目，你想尽早入场。当你投资，而项目背后的人证明了他们的能力时，其他投资者就会注意到并加入其中。这将提高整体价格。对你来说，这意味着更多的利润。\n\
  \n这就是基本面分析方法背后的基本思想。你只需要研究以确定该投资在未来是否会增长。但你也可以从投资价值下降中获利。对于这一点，你会进行所谓的做空（shorting），我们已经涵盖过了。\n\
  \n你可能对这种分析模型表示怀疑，因为它让一切变得如此简单。但它大多数时候是有效的。\n\n如果你知道一个项目有未来潜力，其未来价值将远高于现在，你现在就可以买入并沿着上涨趋势获利。但基本面分析不仅仅看大局。有时，你还需要考虑更小的细节。\n\
  \n例如，在 2015 年，加密开发者经常通过更改名称和标志来重新进行品牌。这样做会增加该加密货币的价格。然而，这很快就不再产生任何重大影响了。\n\n作为交易员，你需要理解这些变化如何影响市场参与者对项目的看法。通常情况下，你对项目的感受并不重要。相反，重要的是集体、即市场对它是如何感受。\n\
  \n有时，微小的变化会对整个项目产生巨大影响。在进行基本面分析时，务必关注正在发生的事情以及市场如何对这些变化做出反应。\n\n\n\n\n你看到大多数加密项目与你现在看到的公司大不相同。通常情况下，你无法像进行普通股票投资那样拥有大量数据供你深入研究。因为加密货币世界仍然非常年轻，其大部分都是纯粹的投机。因此，当你在评估一项新的投资项目时，请务必关注以下几点：\n\
  \n### 目标市场\n每个项目都有自己的目标市场。这意味着你需要查看目标市场的规模。你可能认为市场越大越好，但情况并非总是如此。大市场可能已经吸引了许多企业，这意味着市场过度饱和。这会降低被采纳的可能性。虽然小众市场较小，但客户对问题的新解决方案的接受程度要高得多。\n\
  \n### 竞争\n在任何行业中，竞争几乎无处不在。新行业在更多公司加入之前，通常只能维持很短的时间。对于消费者来说这是一件好事，因为竞争性业务意味着更低的价格和更高质量的产品。作为加密货币投资者，你可以利用竞争来衡量一个加密项目的有效性。\n\
  \n首先，你需要考虑竞争对手。有多少个？如果同一行业内有很多公司，那么你的项目要实现采纳将更加困难。\n\n你还需要将你的项目与其竞争对手进行比较。通过这样做，你可以看到你的项目背后的优缺点，甚至可以判断你的项目是否有很大机会击败对手。观察你的项目并评估竞争程度。衡量该项目与竞争对手相比是否处于良好状态。如果该项目提供了独特的东西，那是它将成功的良好信号。\n\
  \n### 团队\n任何成功的项目背后必须有一个非常坚实的团队。至少，要了解高级管理团队中有哪些成员，他们来自哪里，以及他们在加密货币领域的经验如何。关于团队的信息越多越好。一个好的项目应该有一个技能熟练且经验丰富的团队掌舵。\n\
  \n### 路线图\n路线图基本上是项目未来发展方向的指南。它详细说明了随着项目推进将要完成的内容、功能或事项。这是预料之中的，因为任何项目都需要计划。开发团队会制定此路线图，你可以查看他们是否对项目有一份切实可靠的计划。你需要关注的是他们的计划有多么雄心。一点野心是好事，但过大则意味着项目将无法实现其高远目标。\n\
  \n### 开发与发布\n另一方面，开发和发布突出了项目自成立以来在开发方面取得了多少进展，以及表现如何。通常，开发团队或社区经理会出来向大家提供更新，并告知接下来的预期。投资者与开发团队之间的沟通至关重要，因此定期更新是一个有效项目的良好信号。\n\
  \n### 合作伙伴关系\n合作伙伴关系也是确定项目价值的好方法。然而，这都取决于细节，所以在在你做出判断之前，务必研究这些细节。\n\n### 需求、代币经济学和用途\n\
  经济学的基本法则规定供需驱动价格和价值。对于投资者来说，你需要首先考虑需求，然后是供给。需求越高，价格越高。\n\n### 状态\n指的是项目的状态，与团队有关。\n\
  \n### 白皮书\n我们提到过很多，任何项目都会附带白皮书。简而言之，该论文概述了你需要关于项目的所有信息。这可以让你对整个情况有更清晰的认识，帮助你做出投资决策。在决定是否投资之前务必阅读。\n\
  \n### 社区与评论\n这很简单。进行自己的分析会让你的发现受到你未察觉的偏见的影响。然而，你可以深入社区并阅读对项目的评论来获取他人对该事的意见。\n\n\
  ### 现实世界应用\n“可以做到”并不意味着“应该这么做”。很多人被当下的热度所吸引，忘记了停下来问一个重要问题：为什么这个项目必须以这种方式运作？为什么它必须有自己的区块链？例如，我们有手表可以记录我们今天走了多少步，它通过蓝牙连接到手机。但你如何看待需要连接互联网并下载\
  \ App 才能监控步数的鞋子呢？这种处理这些问题的方式非常迂回，却是完全必要的。\n\n### 价格历史与年龄\n就像帝国一样，加密货币也有起落。这里存在一些你必须做出的决定，遗憾的是，如果没有我们在这里涵盖的其他因素提供支持，没有办法判断答案是正确还是错误。你看，一个成熟的项目会更容易评估，因为你可以查看它从开始以来的价值，并与其他项目进行比较。\n\
  \n\n\n简单来说，这个项目有多少个硬币或代币？它们的交易频率是怎样的？你想知道买卖它们有多容易，因为如果没有人买入或卖，所有资产都是毫无价值的。如果人们对某个项目有很大兴趣，那么应该会有大量的交易，这表明该加密货币或代币需求量很大。\n\
  \n### 市值\n你需要查看市值（market cap）。它是该项目、公司或底层加密货币的总市场价值。在这种情况下，这些价值将根据项目背后的加密货币或代币的供应量得出。通常，高市值的增长潜力较小，而低市值的市场有更大的增长空间。\n\
  \n### 监管\n我们之前讨论过这一点，但它的重要性无论如何强调都不为过。确保项目实际上遵守相关的法律法规。否则，未来对你的投资可能会产生不利后果。\n\n\
  尽管如此，还有许多细微差别和其他小细节需要一整本书才能解释清楚。但我们上面讨论的是需要考虑的最重要的一些因素。随着时间的推移，当你在评估未来的投资机会时，你会发现其他一些需要关注的事项。\n\
  \n### 技术分析\n技术分析是完全另一个领域，因为它涉及的策略与基本面分析中概述的策略截然不同。在这里，你需要计算数字、数据，并处理许多五彩斑斓的图表，除非新手知道如何解读这些图表，否则他们在前\
  \ 30 秒内就会感到沮丧。幸运的是，它并不超级复杂，一旦你进入状态，它就会变成本能。\n\n交易者会观察价格走势模式，并使用各种分析工具来帮助他们理解每种加密货币的优缺点。之前的价格走势也可以帮助他们预测未来的走势。就像基本面分析一样，技术分析也用于股票、期货、货币和外汇等许多市场。幸运的是，这个过程大体相同，所以如果你对交易这些市场感兴趣，仍然可以将这种技术应用于其他市场。\n\
  \n### 技术分析的基本概念\n`道氏理论`（Dow Theory）中的几个观点可以让你对技术分析有一个基本的了解。首先，该理论认为市场价格反映了许多影响价格的因素。在加密货币世界，这些“许多因素”包括监管、交易者的预期、过去、现在和未来的需求等。技术分析能交易者对市场的整体情绪有一个大致的想法。\n\
  \n技术分析还包含另一个假设：历史往往会重演，至少在加密货币世界是如此。出于这个原因，技术分析试图根据过去的数据来预测市场心理和加密货币。\n\n技术分析还做了另一个假设：价格波动并不总是随机的，即使在波动剧烈的加密货币市场也是如此。价格波动通常遵循短期或长期趋势。通常，当一种加密货币遵循某种趋势时，它很快就会遵循相反的趋势。使用技术分析的交易者可以利用此来识别价格走势模式并获利。\n\
  \n总的来说，技术分析并不真正考虑加密货币的底层价值。相反，它只考虑发生了什么以及为什么发生。\n\n### 读图表\n那么，考虑到这一点，让我们从读懂图表开始技术分析吧。最基本的元素是\
  \ K 线、趋势线、支撑位和阻力位、成交量、市值、相对强弱指数、移动平均线和时间框架。\n\n#### K 线\n这些是红色或绿色的条形，上方和下方各伸出一根小短线，长度不一。这些被称为\
  \ K 线，尽管它们有时看起来更像锤子。\n\nK 线 线的每一个元素，从颜色到顶部和底部短线的长度，再到“实体”（即条形）的长度，都讲述了许多故事。首先，K\
  \ 线矩形的顶部和底部指示了加密货币在那个时刻的开价和收盘价。\n\n绿色意味着加密货币价值上升，所以收盘价在顶部，开价在底部。如果是红色的，则表示加密货币价格下跌，收盘价在底部，开价在顶部。\n\
  \n从顶部和底部伸出的小线被称为影线（wicks）。它们指示了币在该时间段内达到的最低和最高价格。这可以让你对市场波动有一个大致了解。如果影线短，意味着人们继续卖出硬币；这会增加硬币供应，进一步推动价格下跌。长下影表明价格过去曾下跌，且整体情绪认为价格不会再更低，因此形成了一个价格底部或支撑位。你通常可以在下降趋势末端、上升趋势之前的底部发现这一点。因为到那时，人们认为这是购买硬币的最佳时机，并且他们会这样做。通过这样做，供应量会减少，价格将会上涨，进一步鼓励更多人购买该硬币。\n\
  \n如果影线短，那么市场可能会发生变化。潜在的变化取决于影线。如果上影短，这表明硬币达到了一个峰值及其历史上的最高点之一，因此是一个价格天花板或阻力位。如果上影非常长，它告诉我们，交易者获利了结之前，价格在某个点更高。这种模式出现在上升趋势的顶点，可能预示着趋势即将结束，下降趋势在即刻。\n\
  \n#### 趋势线\n除了 K 线之外，你可能还会看到一条模糊遵循 K 线模式的线。这就是趋势线。趋势线简单地指出加密货币价格移动的方向。但它们也包含只有经过训练的眼睛才能感知到的其他信息。这在波动剧烈的加密货币市场中尤其如此。交易者需要理解伴随所有小高低低的整体趋势。更糟糕的是，趋势并不只是向上或向下。它们还可以横向移动，这表明加密货币既没有显著上涨也没有显著下跌。但如果它保持这种状态很长时间，可能会导致爆发性的突破，产生巨大的收益或亏损。\n\
  \n#### 支撑位和阻力位\n\n\n\n\n\n我们之前稍微提到过这一点。这两者都是你可以在交易图表上绘制的水平线，以更好地理解该特定币种的价格走势。有些人可能会认为，将这些水平视为区域而非线条会更好。某些交易软件允许你画线，但如果你的软件没有这个功能，你也可以肉眼估算。\n\
  \n### 支撑位与阻力位\n\n支撑位基本上是价格地板。你可以通过 K 线和趋势线看到这一点。价格永远不会跌破某个特定点。它们会多次接近该点，但永远不会低于该点。那里就是你的支撑位。这是该币种的感官最低价格点，通常也是许多交易者买入的地方。这要么防止币价进一步下跌，要么会完全反转趋势并启动上涨趋势。\n\
  \n阻力位则是相反的。它是一条价格无法进一步上升的线或区域。这表明买方认为价格已经相当高，因此他们不会再买入。这也意味着买方倾向于卖出他们手中的代币，因为价格已经达到了他们的最高水平，从而增加了供应并推动价格回落。\n\
  \n当价格达到其中任何一个水平时，它就在测试这条线。测试的次数越多，它就变得越弱。然而，支撑位和阻力位并不是永久的。价格最终会突破这些水平，并建立新的支撑和阻力位。\n\
  \n趋势强性的几个关键指标包括突破支撑位或阻力位。有时，阻力位变成新的支撑位，反之亦然，这进一步加强了当前趋势的强度。当然，也可能发生假突破（即假信号）。有时，假突破发生的规模之大，足以触发你的止损或止盈，让交易者感到非常沮丧。因此，建议交易者将止损和止盈位设得远一点，并查看不同的指标来帮助他们定义趋势。\n\
  \n### 交易量\n\n交易量也有助于交易者判断趋势是否具有重要性。如果成交量高，意味着趋势是重要的。反之，如果成交量低，意味着趋势很弱，会很快消逝。\n\n\
  所以，当币价下跌时，请检查成交量。你需要检查价格下跌时成交量是否低，价格上涨时成交量是否高。这意味着正在进行一个健康的趋势，并伴随着长期增长。但如果交易量在上涨趋势期间下降，则意味着趋势很快就会结束。下降趋势的情况同样如此。\n\
  \n### 市值\n\n你可以查看市值来了解币种的稳定性能。通常情况下，该加密货币的市值越大，就越稳定。如果你的交易所没有提供市值，计算它也非常简单。你只需要将流通量乘以其当前价格即可。\n\
  \n### 相对强度指数\n\n仅通过肉眼估算图表、观察 K 线和跟踪趋势线，作用是有限的。有时，你需要使用指标，而且有很多可供选择。其中一个被称为 `RSI`\
  \ 指标，即相对强度指数指标。\n\n这里面涉及大量的数学计算。幸运的是，你不需要自己计算，因为大多数平台都为你计算好了。你可以在图表软件上开启 `RSI` 指标。它显示为一条或两条线，范围在\
  \ 0 到 100 的光谱上。如果 `RSI` 处于 30 或以下，意味着该加密货币被低估，价格可能很快就会上涨。如果 `RSI` 处于 70 或以上，意味着该加密货币被高估，这可能表明人们将开始抛代币，价格很快就会下跌。\n\
  \n### 移动平均线\n\n这也有对应的指标。正如名称所暗示的，平均线是特定时期内的价格平均值。你可以使用移动平均线来帮助预测未来价格。大多数交易者使用指数平均线（EMA）来帮助他们。例如，如果短期移动平均线穿越长期移动平均线，可能意味着上涨趋势到来。\n\
  \n\n\n\n简而言之，许多因素会影响加密货币的价格，其中大多数因素是你无法控制的。因此，建议交易者密切关注加密货币相关新闻并采取相应的行动。在这里，信息就是关键。\n\
  \n## 其他考虑\n\n交易加密货币可能会让人神经紧张，因为有许多你需要考虑的事情，以及许多可能出错的地方。交易本身相当复杂，而交易加密货币更是如此。这并不适合所有人，特别是初学者。\n\
  \n如果你是刚接触整个交易游戏新手，你至少应该配备好一些交易知识。我们在这里涵盖了其中一部分内容，但还有很多东西待探索。\n\n那么，你能做什么呢？市上有许多免费资源可以帮助你理解交易游戏，例如\
  \ `BabyPips`。虽然他们的一些内容可能并不完全准确，而且他们的专长是外汇，但大多数概念也适用于加密货币交易。然而，你在网上找到的内容可能是不准确或过时的。\n\
  \n这就是为什么你也应该考虑参加一些课程。当然，你必须支付一些现金，而且有些课程是纯粹的诈骗，但只要你做过研究，你就能够找到一些声誉良好的导师，他们可以带你入门。将此看作一项未来将为你带来更多回报的投资。\n\
  \n除此之外，永远不要一开始就用自己的钱开始交易。大多数交易平台提供带有一定虚拟余额的演示账户。你可以使用真实的实时数据进行操作，并用这些虚拟资金进行交易，观察自己的表现。这是一个练习和熟悉交易平台的绝佳场所。一旦你感到自在，就可以投入资金并开始真实交易。\n\
  \n## 结论\n\n我们现在已经完成了关于加密货币以及如何交易和投资它的三部曲系列中的第二本书。我们在这里涵盖了很多内容，但这绝不是对广阔加密货币世界的详尽介绍。\n\
  \n简而言之，加密货币被认为是一种数字资产，并且有许多种形式。它最大的卖点在于它是一种去中心化的货币，不受主要金融机构和政府的控制。这很重要，因为许多人已经厌倦了政府将税收资金投入到错误的事或行业中，或者让不重要的行业获得救助，而普通百姓却不得不应对经济困境。这在大萧条和最近的新冠疫情中表现得尤为明显。\n\
  \n因此，随着 `Bitcoin halving` 的出现，人们再次对加密货币产生了兴趣。有人推测这仅仅是一个泡沫，会像上次 `2016 halving` 那样再次破裂，但另一些人认为这次将会不同。这是因为越来越多的公司和主要金融机构正在加入其中。\n\
  \n不仅仅是加密货币具有未来潜力。其背后的技术也相当通用。区块链技术的潜力巨大，即使加密货币明天消失得无踪，区块链仍然会存在。它创造了智能合约、去中心化应用程序（DApps）和去中心化金融技术，所有这些在任何行业中都非常有帮助。如果设置得当，它还提供了一种非常安全的、能够防止黑客的信息存储方式。在这种情况下，加密货币只是启用这些服务的代币。\n\
  \n就像生活中的任何事情一样，对加密货币进行交易或投资绝不是一个简单的过程。至少，如果你想成功的话，不是如此。有太多需要考虑的事情，会让任何人都感到头疼。\n\n\
  当然，你只需要投资 `Bitcoin` 和 `Ethereum`，并持有这些硬币直到它们达到某个点再全部卖掉。但加密货币投资远不止于此。\n\n例如，你可以将你的\
  \ `Ether` 投入到启动 `ICOs` 或 `STOs` 的初创公司或项目中。如果他们的项目成功了，你可以卖掉实用代币以获得更大的利润，或者持有它们以获得各种服务。对于证券型代币，你基本上持有的是公司的股份，你可以持有这些代币并获得稳定的被动收入来源。\n\
  \n当然，加密货币领域并不只有 `Bitcoin` 和 `Ethereum` 值得关注。虽然它们是其中的佼佼者，但还有许多其他加密货币可以考虑。你真的应该考虑投资\
  \ `Altcoins`（山币）。无法预知大盘何时会因为政府监管或其他原因而突然下跌，因此你需要进行投资多元化。\n\n加密世界真正有趣的地方在于，不同的加密货币和代币是为了不同的目的而创建的。虽然\
  \ `Bitcoin` 旨在成为数字黄金，`Ethereum` 旨在为开发者提供一个平台。其他加密货币尝试实现低成本交易、文件共享或视频流传输。这一切归功于区块链技术的广泛应用。\n\
  \n正如任何事情一样，你真的应该考虑加密货币世界中的无限可能。该领域的开发者正在开发新方法来解决问题。他们对同一个问题有不同的解决方案，这进一步促进了技术的发展。\n\
  \n对于作为投资者或交易者的你来说，这里有很多获利的机会，只要你清楚自己在做什么。遗憾的是，加密货币世界的许多人并不熟悉交易。他们认为交易或投资加密货币是快速致富的方法，而完全不理解交易的复杂性。因此，他们损失了大量资金，这给加密货币带来了坏名声。\n\
  \n掌握交易艺术并非易事，但是有利润可的。这需要仔细的考虑、经验和一点运气。但如果你能保持清醒，勤奋地收集信息并进行研究，基于事实而非他人的意见做出决策，你就已经在通往看到你的资产变成绿色的道路。\n\
  \n\n\n\n即使你不想投资加密货币，它们也是支持区块链应用的核心动力。它们在市场中提供了一些独特且有趣的解决方案，其中一些已经真的开始异军突起。事实上，专家们对于加密货币是否会长久存在仍存在分歧，但你需要考虑区块链技术的未来潜力。成为加密货币的早期采用者是有风险的，但回报远高于其相关风险。\n\
  \n如果说从这整本书你只能带走一点，那就是：任何投资决策（无论是加密货币还是其他任何领域）——都需要坚实的数据和信息作为支撑。每个人都有自己的观点，他们可以随心所欲地说什么。但没有什么能比得上冷冰冰且具体的事实。信息是关键，所以请做好自己的研究，并据此做出决策。\n\
