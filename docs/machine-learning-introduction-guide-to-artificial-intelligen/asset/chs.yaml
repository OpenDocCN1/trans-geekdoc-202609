- "# 机器学习：人工智能入门指南。机器学习工具与技术\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 描述\n### 为什么要学习大数据和机器学习？\n\
  \n机器学习允许你自动化人类的思维和体力劳动。因此，`ML` 被搜索引擎、银行和保险公司、零售业、移动运营商、工业企业、广告和营销机构使用。\n\n机器学习模型比人类专家更准确、更快地做出预测并识别模式。例如，银行使用\
  \ `ML` 模型计算每个特定借款人诚信还贷的概率。此外，如果专家分析一个客户需要几分钟，模型可以在几秒钟内为数百万客户做出预测。\n\n机器学习是一种自动构建分析模型的数据分析技术。它是人工智能的一个分支，其基础是系统可以从数据中学习、识别模式并在极人工干预的情况下做出决策。\n\
  \n得益于新的计算技术，今天的机器学习与过去不同。它诞生于模式识别以及计算机无需编程为执行特定任务即可进行学习的理论；对人工智能感兴趣的研究人员想知道计算机是否可以从数据中学习。机器学习的迭代特性非常重要，因为当模型接触新数据时，它们可以独立地适应。它们从之前的计算中学习以获得可靠、重复的解决方案和结果。这不是一项新科学，但它获得了新的动力。\n\
  \n但如果你了解机器学习，你就可以成为一名 AI 运营师甚至是创造者。开始只需要想象力。\n\n\n\n\n本书旨在解释这些内容并帮助你开启机器学习之旅。编写这本书正是为了解释这些概念并帮助你开始机器学习。\n\
  \n# 引言\n\n## 什么是机器学习？\n\n如果你像大多数人一样，那么你对“大数据”这个短语并不熟悉。\n\n大数据是科技领域各种语境下使用的分析类热词。在企业语境下，这意味着通过分析数据来发现模式和趋势，并改进结果。\n\
  \n虽然这可能不是非常直观，但机器学习（ML）是一种最适用于企业 IT 环境的机器学习类型。机器学习（ML）是一种可以从经验中学习的机器学习类型，而不仅仅是收集数据。\n\
  \n“学习”意味着机器从人类（或其他）用户以及内部业务数据中获取经验。计算机系统可以使用这些数据来改进其算法和准确性，并提高其未来处理数据的能力。\n\n云原生基金会（Cloud\
  \ Native Computing Foundation）对机器学习的定义是：\n\n“机器学习是人工智能的一个子领域，它使用机器算法进行学习。机器学习是自运行系统或学习并自我改进系统的关键组件。机器学习是一种设计能够不断适应变化和新任务的计算机系统的策略。”\n\
  \n## 云端中的机器学习\n\n本地计算架构是一项昂贵的业务。除非公司拥有完善的云管理环境，否则本地计算系统通常以孤立的方式执行其任务。当使用机器学习模型进行预测时，它们通常是巨大且复杂的——并且无法孤立运行。并发创建和运行多个机器学习模型的能力在公有环境中更容易实现，因为扩展性在公云环境中是一个考量因素。\n\
  \n云端机器学习可以通过促进与外部数据源的通信来改进机器学习。通过创建一个可以与外部数据源通信的机器学习模型，你的公司可以收集更多关于业务的数据，并利用这些数据做出更好的决策。根据业务需求的变化，扩展模型也将变得更加容易。随着你从数据中学习，模型也将会变得更加可靠和准确，而不是去猜测会发生什么。\n\
  \n## 机器学习和容器如何结合？\n\n所有企业数据和计算通常由 IT 员工在本地管理。这使得业务难以无缝地将新应用程序与业务的其他部分集成。如果你希望将第三方应用程序与你的机器学习（ML）堆栈集成，你就必须对应用程序进行标准化。\n\
  \n你可以通过使用容器来实现这一点。流行的容器化技术 `Docker` 用于创建隔离的虚拟机实例。\n\nDocker 对包括 `TensorFlow` 和 `Jupyter\
  \ Notebook` 在内的机器学习技术提供原生支持，以及各种让数据收集和处理变得简洁的框架。\n\n随着 `Docker` 的日益流行，预计将大量让机器学习更易实现的解决方案涌现。\n\
  \n例如，`Redis Labs` 提供了一个专门的机器学习项目，从 `Redis` 社区内部提供数据访问和标准化。该公司还为想在公有和私有数据上训练自定义机器学习模型的企业提供免费服务。\n\
  \n## 机器学习的其他工具\n\n还有其他几种实现机器学习的选择。以下是几个可以让你快速了解的选项：\n\n大数据湖 (CDL) —— 针对 `Hadoop`、`Spark`\
  \ 和 `Spark SQL` 的容器化、基于事件的数据流水线。\n\n针对 `Hadoop`、`Spark` 和 `Spark SQL` 的容器化、基于事件的数据流水线。IBM\
  \ 全数据单元 (GDU) —— 提供企业级机器学习服务的企业大数据项目。\n\nSAS 数据科学体验 —— 除了为机器学习提供研究级环境外，SAS 还提供了数据科学培训、指导和工具，例如\
  \ `SAS Inside Data Science` —— 这是一个允许用户学习数据科学统计方法的交互式环境。\n\nGoogle 云机器学习引擎（Cloud\
  \ Machine Learning Engine） —— 一个为数据科学家、模型训练师和数据工程师设计的开源平台。\n\n## 企业机器学习将如何改变我们的工作方式？\n\
  \n机器学习已经应用于各种场景中，从销售分析到挖掘市场趋势数据。\n\n示例包括：图像识别技术，它可以帮助我们识别网站上的物体（如标志或汽车）；跟踪人们在城市周围的身体活动和路线；以及通过查看社交媒体应用\
  \ Feed 流中的可疑活动来应对账户欺诈。\n\n## 什么是算法？\n\n算法简单来说就是计算机遵循的指令。计算中的每一步都被称为算法步骤。如果有很多步骤，计算机就会执行许多算法步骤。\n\
  \n由于我们做出的每一个决策都是依靠计算机的，因此我们做的每个决策都依赖于算法。所以，一切都是算法。\n\n算法是做什么的？算法是计算机遵循的一组指令。这组指令描述了计算机行为的所有规则。例如，在验证码（captcha）中，算法告诉计算机“如果是单词，就点击它，否则不点击”。\n\
  \n我们如何决定什么是算法？我们通过观察它的输出（即它对问题的答案）来判断什么是算法。来看一个解决问题的函数。\n\n如果一个函数解决了问题，它就有一个答案。但仅仅因为一个函数有答案并不意味着它是一个算法。\n\
  \n这是一个例子：如果我们有一个名为 `squares` 的函数，那么 `squares(x) = sqrt(x)`。平方并没有算法，所以 `squares`\
  \ 执行什么并不重要。\n\n## 为什么 Python 和数据科学结合得很好？\n\nPython 拥有丰富且成熟的生态系统。你不需要了解每一个函数，并且熟悉该社区。你可以启动一个项目，尝试各种函数并看看你喜欢什么。生态系统中的所有工具都经过测试且易于理解，支持数据处理。如果你不需要，就不需要学习像\
  \ `R` 或 `Excel` 这样的数据语言，因此你可以专注于编写数据分析代码。然后你可以将学到的知识转移到适合你的其他语言或环境，或者你自己的语言中。\n\n\
  ## Python 是一种通用编程语言\n\nPython 不是一种数据科学语言，也不是如此。然而，作为一种专注于服务器端编程的语言，它足够灵活，对数据分析非常有用。此外，还有大量的库（如\
  \ `pandas` 和 `numpy`）针对处理你的数据分析进行了优化，而且这些库在 Python 中运行良好。\n\n使用 Python 作为你的数据科学语言有许多理由，你可能不知道从何处开始。读完这篇博客文章后，你应该渴望采取行动。答案是阅读更多、学习更多，但并非必须如此。\n\
  \n# 第 1 章 机器学习\n\n## 机器学习的定义是什么？\n\n机器学习是一种自动识别模式和组织数据的技术。你可以将其认为一种使用数学建模将数据与预测模型匹配，然后使用优化技术来充分利用你所拥有数据的价值。\n\
  \n\n\n\n## 机器学习与统计技术有何区别？\n\n机器学习与传统统计方法之间的主要区别如下：\n\n机器学习算法（或你用于拟合机器学习算法的工具）具有多个“深层”结构。例如，YouTube\
  \ 的平均视频大约为 12 秒，因此如果你想将图像与视频匹配，你需要查看视频中每一帧的高度、宽度以及观看速度。\n\n即使你可能拥有该视频的成千上万个匹配项，你仍然需要知道它们是否是同一个视频。这就是匹配模型大显用场的地方。匹配模型描述你数据的数学模型；它是一套将视频中的图像与其他数据进行对比的配方，以便选出一个你可以后续处理的匹配项。这就像为食谱寻找正确的原料，但你并不知道最终产品会是什么。\n\
  \n你可能有几十万个匹配项，但你只能找到 1 个匹配的；找到良好的匹配项就像尝试用你家里的食谱烤蛋糕，结果发现它并不符合你的预期。这就是为什么配对需要通过多次重复来完成。\n\
  \n## 监督学习与无监督机器学习之间有什么区别？\n\n监督机器学习（也称为“监督学习”或“窄类”分类）是指人类编写程序让软件从数据中学习模式。在无监督机器学习（也称为“无监督学习”或“窄类”分类）中，数据是没有标记的。\n\
  \n当你使用监督机器学习时，算法会被告知数据的正确分类应该是什么。相比之下，在无监督学习中，算法根据其自身学到的信息利用自己的智能和推理能力。在理论上，算法学会了执行我们想要它做的事，但在实践中，算法可能会学会识别对它本身重要的数据特征，并避开它认为无关的数据。\n\
  \n## 机器学习与人工智能有何区别？\n\n虽然人工智能也被称为 `AI`，但重要的是要理解并没有一种单一类型的 `AI`。有许多不同类型的 `AI`，它们都有各自的优缺点。\n\
  \n机器学习与人工智能的区别在于，机器学习是一种技术，而 `AI` 是一种已经使用了多年的方法。但人工智能要被视为 `AI`，并不要求机器表现得像人类一样。\n\
  \n机器学习更侧重于使用计算机算法来转换数据。相比之下，`AI` 使用计算能力来解决它从数据中学会如何解决的问题。`AI` 还利用算法帮助它学习执行特定任务，并创建体验和/或产品。\n\
  \n然而，人工智能通常与机器人联系在一起，它经常被用于执行比机器自然能完成的任务更抽象的任务，例如识别不同的人类情感。\n\n## 你能教电脑学习吗？\n\n\
  机器学习并不依赖于编程，在许多情况下，它可以通过经验来学习。例如，如果你正在处理的数据集包含猫的照片，而分类器的目标是识别猫的照片，那么计算机必须经过训练来学习如何识别猫。一旦它学会了这项任务，它就能通过识别计算机程序被教导在照片中寻找的特征来自动识别猫。\n\
  \n## 你如何训练机器进行学习？\n\n就像任何技能一样，你必须通过练习来学习。在机器学习中，你可能会使用几种不同类型的数据来训练机器，并使用这些数据集来预测随后添加到训练集中的新数据的结果。\n\
  \n来自互联网的输入，包括某个关键词的点击次数、某个链接的排名以及某个网页收到的评论。\n\n## 机器学习的好处是什么？\n\n机器学习正在取得快速进展，作为一种开源实践，人们很容易亲自尝试。结果，许多机构已经实施了某种形式的机器学习，另一些机构正在快速实施。\n\
  \n机器学习的一个关键优势是能够利用数据自动执行通常需要人工干预的任务，例如收集和分析数据，或根据特定结果决定采取什么行动。这些任务通常需要人工干预，但机器学习使得这些过程能够自动化，释放了劳动力。\n\
  \n机器学习为组织提供了许多益处，例如减少人为错误的风险、提高数据质量、提高组织效率、降低错误率、加快决策速度以及增加收入。\n\n例如，自动进行电子邮件数据的收集和分析使公司能够提高客户服务的质量。以前，员工必须花时间手动阅读客户发送的每一封邮件。据估计，大约\
  \ 50% 的客户邮件没有得到回复，这给机构每年造成了数十亿美元。\n\n在由电子邮件 API 提供商 `Cloudmark` 委托的一份报告中，估计公司每收到一个报告的未处理客户投诉，就会损失约\
  \ 15,000 美元。在同一份报告中，还估计通过自动收集和处理数据，平均机构每年可以节省 15,000 美元。\n\n\n\n\n分析、挖掘和数据挖掘。机器学习系统通过分析信息来识别趋势和“隐藏”模式，例如一组变量之间的相关性。这些方法可以帮助分析师更深入地理解数据。一个有效的机器学习系统会获取数据、解析数据，然后根据分析结果和建议提供建议。\n\
  \n分析数据以进行学习、预测和算法。学习是计算机在处理新的、更复杂的任务时获得性能提升的过程。\n\n算法定义机器（例如计算机）将执行的函数的步骤集合。机器学习算法旨在对由分析师（科学家或数据挖掘人员）收集的数据进行工作，并且它们具有自学习能力。机器学习算法必须不断进行优化和更新，以便为使用它们的研究人员或科学家提供最佳结果。\n\
  \n# 第 2 章 机器学习的未来是什么？\n\n一种在现实领域开始崭现的强大机器学习（ML）分支是自适应学习（adaptive learning），这是一种使用能够适应其输入的模型的机器学习技术。\n\
  \n自适应学习的一个经典案例是：多次使用同一个数据集来产生完全不同的输出。例如，消费者可能会反复收听同一首歌，或者观察同一张脸，但同一同一张脸会产生不同但又相似的解释。\n\
  \n自适应学习需要神经网络——一种利用输入产生输出的系统。当应用于输入和输出之间没有显著先前关系的情况时，自适应学习比其他模型强大得多，且工作效果好得多。\n\n\
  ## 自适应学习的示例\n\n回到 2010 年，作家道格拉斯·亚当斯（Douglas Adams）写了《回到未来》系列小说，但他从未真正尝试过编写机器学习算法。那是因为当时的机器学习并不存在，这项技术花费了十多年时间才赶上。这导致了从想法到技术通常所需的漫长时间：16\
  \ 年！\n\n2016 年，科学家们发表了一篇题为《迈向自适应图像分类》（On Towards Adaptive Image Classification）的论文，他们在文中描述了如何调整图像识别算法以适应海量数据、物体形状对视觉感知的影响，以及一种在这种情况下可以补偿衰老影响的自适应算法。\n\
  \n在当今的产品管理领域，我们也看到了自适应学习中类似的自适应性。\n\n## 回到未来\n\n在生产环境中最著名的自适应学习例子可能过于电影《回到未来》，其中马蒂·麦飞莱（Marty\
  \ McFly）的生活（以及记忆）被投影回 1955 年，然后是 2015 年。\n\n类似于预测性推理（许多自适应学习系统使用的技术），预测性推理是基于这样一个前提：机器学习模型可以学习预测结果。但它不是预测马蒂赢得与布朗博士（Doc\
  \ Brown）赌约的概率，而是预测性推理计算了马蒂避开黑洞引力场的概率。\n\n预测性推理的假设是，考虑到海量数据的预测模型可以提供更好、更准确的预测。2015\
  \ 年，科学家发表了一篇题为《利用流体定位增强预测》（Augmenting Predictions using Fluid Localization）的论文，他们提出了一种训练预测性推理模型的新方法，该方法在提高预测准确性的同时，显著减少了训练和运行模型所需的数据量。\n\
  \n基于流体定位的概念，作者确定，增加本地训练数据的长度可以提高模型所做的所有预测的预测准确性，即使这意味着需要大幅增加训练模型所需的预测次数。\n\n与其他机器学习技术类似，自适应学习可用于消除对不断调优训练数据的需求。自适应学习的历史相对较短，但已经证明能产生比其他机器学习技术更好、更准确的模型。\n\
  \n在 2015 年洛杉矶车展上展出的德罗伦 DMC-12 汽车。\n\n## 前沿开发\n\n### 管理故障的巧妙方法\n\n显而易见，在一个信息丰富、数据廉价且连接性日益重要的世界里，组织需要采用能够同时利用数据和连接性的系统来避免失败。\n\
  \n今天，企业依赖数据流来构建应用程序，因此预测性监控是逻辑上的下一步。但预测性监控也并不完美，早期且准确的故障检测是防止昂贵损失的第一步。\n\n### 管理故障\n\
  \n近年来出现了一种新型预测性监控软件，它利用数据流、网络诊断和用户行为在故障发生前进行检测和缓解。目前的预测性监控软件可以捕捉洞察，并主动向 IT 报告问题。一些预测性监控供应商提供\
  \ `APIs`，并能够与现有监控、配置管理和故障管理工具集成。\n\n### 故障早期检测\n\n任何类型的软件要有效运行，都需要适应其环境特征。无论做出多少工程更改以确保系统运行良好，故障总是可能的。\n\
  \n在预测性监控中，故障一旦被检测就会被识别。因此，系统设计为记录并测量系统的每一个输入，包括用户定义的异常。当某些操作的输出出现不一致时，系统能够进行实时调整并向用户发出警告。预测性监控工具可以提供完整的事件时间线。\n\
  \n例如，如果一个以前产生错误的输入持续出现，则表明存在故障，尽管这可能是一个容易修复的瞬态错误。系统还可以程序为检测离散操作中的错误，并在单个操作完成之前收集数据，并在发生异常操作时触发警报。\n\
  \n## 预测性监控还结合了机器学习\n\n现代预测性监控软件可以检测指标集的变化，而无需实际激活任何警报或降低警报级别。为了让设备在这种情况下提供警告，人类必须识别异常并为特定指标设置警报。\n\
  \n因此，一种可能的情况是人收到警报，而需要采取的操作被指向另一个不需要人们了解特定指标或特定事件序列的工具。\n\n第二种方法可以更加主动，即触发警报并将系统配置为向相关工程师或管理员发送电子邮件。\n\
  \n最后，第三种方法是预测性监控的最佳状态。它没有人工干预；系统记录所有数据，由程序进行解释并向相关人员发出警报。当不应出现异常的地方检测到异常时，预测性监控就发挥了作用。在这些情况下，系统运行完美，但发生了异常，提醒人类情况不对。随后，人类可以采取行动以确保系统运行正常。\n\
  \n\n\n\n\n 预测性监控工具还可以用于分析应用连接和流量流的性能。例如，在数据中心，它可以用来识别对某些远程 IP 地址范围响应缓慢的特定服务器，并识别某些异常发生的位置。\n\
  \n在识别异常后，系统可以确定是哪个服务导致了错误，隔离问题，并在问题对另一个站点产生不利影响之前将其纠正。这也有防止延迟问题和站点间的网络拥塞，这些是导致性能下降的一些常见问题。\n\
  \n# 什么是 PaaS（平台即服务）？我为什么应该关注它？\n\nPaaS 一词描述了通过中心化基础设施交付的一系列服务。这些服务为开发者提供了基础设施，他们可以在其上开发、测试和部署应用程序。这些服务的示例包括应用服务、对象存储、数据库服务和负载均衡器。\n\
  \nPaaS 服务通常对如何处理安全性、冗余和灾备（DR）具有定义良好的策略。它们为开发者提供专用资源（通常是 CPU 和内存），以便他们进行开发和测试，而不会降低运行这些服务器的速度。\n\
  \nPaaS 服务具有定义良好的工具，这减少了开发者在设置应用程序时必须投入的时间和精力。这些工具自动化了开发者原本需要花费在维护、构建和测试应用程序的大量工作。\n\
  \nPaaS 通常被称为基础服务，因为它使开发者能够访问构建和部署应用程序所需的必要基础设施和工具。它还提供了开发者构建应用程序所需的运行环境的可视性。\n\n\
  ## 什么是持续集成（CI）和持续交付（CD）？我为什么应该关注它们？\n\n持续集成和持续交付通常是同义词，但并非总是如此。虽然 CI 的确是指代码的持续流，但它并不总是意味着持续部署。\n\
  \n通常，持续集成可以在开发过程的所有阶段进行。它通过将构建合并到不可变仓库中来工作。开发者随后可以提交生成的代码，并立即进行测试。这些结果被集成到版本控制系统（或版本控制系统）中，并可以推广到生产发布。\n\
  \nCI 通常用于开发者在仓库上创建一个分支，她计划在该分支上测试最新版本的代码。一旦代码通过测试，就可以将其合并回主分支，开发者使用主分支对整个源代码提交更改。这被称为持续集成，它起到了一个全兜底的作用，允许开发者将可测试的代码集成到仓库中，并有助于确保在开发过程中不会引入错误。\n\
  \n持续交付本质上是一种用于简化新代码交付的流水线。通常，每天至少向服务器发布一次新应用程序，有时一天发布多次。正是这种持续交付最常被用于实现持续交付。\n\n\
  ## 什么是 API 管理？我为什么需要它？\n\nAPI 管理是应用管理的一个分支。它是管理客户端需要使用的 API 的实践，包括客户端外部的 API 和企业内部的\
  \ API。API 管理通常涉及中心化/移动应用以及本地应用的混合。虽然 API 管理不是一项新实践，但由于它与在云端构建数字服务有关，它获得了更多的关注。\n\
  \n一种通过 API 管理应用程序和服务的中心化、移动友好型方法，允许公司通过 API 供应和管理应用程序。\n\n## 什么是 API 测试？\n\nAPI\
  \ 测试是指一种测试应用程序端到端体验的方法。这是数字化转型的关键要素。让我们看看 API 测试提供的某些优势：\n\n* 它助于将 API 集成到单一代码库中。\n\
  * 它允许开发者为应用程序进入生产环境做准备。\n* 它帮助组织确保应用程序在部署期间的性能。\n* 它助于理解 API 如何与外部系统交互。\n* 它帮助开发者解决开发过程中出现的问题。\n\
  * 它提供了测试多种语言和框架的能力。\n\n## API 测试最适合什么样的 API 管理器？\n\nAPI 管理可用于部署 API，或者作为包含部署和 API\
  \ 测试的混合方法。API 管理器是一个供应商中立的第三方组织，可以将 API 管理与 API 和自动化技术结合起来。他们通过提供一个可用于 API 集成的平台来实现此。该平台可以作为一种敏捷系统，管理云集成，并持续地构建和发布。\n\
  \n## 你认为需要进行什么样的测试？\n\n数字化转型需要数字服务。我们称这些服务为应用。让一个服务“真正”成为数字服务的特点是它还内置了某种形式的 API。数字服务的问题在于，许多服务只是测试应用，没有有效使用它们的\
  \ API，甚至没有测试它们之间如何交互。需要的是更智能的测试，但要做到，你需要理解服务的不同部分是如何交互的，以及如何测试这些交互是如何暴露给客户端的。\n\n\
  \n\n\n\n在应用架构成为当今数字化赋能世界的关键问题时，任何想要保持领先的组织都必须意识到，数字化转型本身并不是终点。相反，它是将组织的所有其他组件整合在一起的方式，以提供卓越的用户体验。这意味着要能够连接系统层、业务层和技术层。只有通过这种程度的参与，你才能触及所有相关的人员、系统和流程。\n\
  \n## 什么是平台？\n\n平台是数字服务的赋能器。它们帮助组织连接应用程序的所有层级。这包括网络层、业务层和技术层。这使得开发者能够在其基础上进行构建。一旦平台搭建完成，`API`\
  \ 测试就可以轻松地自动化，从而帮助新产品和服务的开发。\n\n平台的优点不胜许多：它有助于新应用程序的开发，有助于开发新的收入来源，有助于维护现有的产品和服务，最重要的是，它还提升了向客户持续交付高质量产品和服务的能力。\n\
  \n## 开发者如何从 API 测试系统中获益？\n\n`API` 是一个与外部世界交互的数字接口。它可以用于交换数据，或控制对软件或 `API` 的访问。在\
  \ `API` 系统中，可能会有很多服务。一个 `API` 可以是支持访问后端服务的前端服务，也可以是后端服务和前端服务。通过 API`，开发者可以创建一个“服务层”，该服务层可以从应用程序的不同层级进行访问。\n\
  \n`API` 测试通过暴露 `API` 及其组件如何相互作用，以及暴露它们所依赖的数据，来帮助开发者开发应用程序。\n\n## API 测试如何帮助开发者实现和测试新应用程序？\n\
  \n应用程序开发者拥有许多数字服务，可以组合这些服务来构建新的产品和服务。全面的测试用例有助于开发者确保其产品和服务所依赖的软件层运行正常。\n\n`API`\
  \ 测试帮助开发者编写测试用例，以暴露 `API` 及其组件如何相互作用，以及暴露它们所依赖的数据。\n\n一个测试用例可以帮助开发者指定他们想要解决的问题类型，并指定必须进行测试和报告的系统、数据和技术组件。测试有助于确保\
  \ `API` 与系统兼容，确保接口中可用数据和所需的命令，并确保命令被正确执行。`API` 测试还帮助确保对 `API` 的请求符合 `API` 中给出的规范。测试用例有助于识别可能的更改或故障以及如何补救这些故障。\n\
  \n`API` 测试还帮助识别可能的更改或故障以及如何补救这些故障。`API` 测试还帮助确保对 `API` 的请求符合 `API` 中给出的规范。测试用例有助于识别可能的更改或故障以及如何补救这些故障。\n\
  \n（注：原文中存在段落重复，已根据指令“不要重复输出原文”的原则在翻译时进行了去重处理）[/\n\n\n还有其他选项，包括 `fast.ai`，它提供按月订阅付费的商业级产品，同时也提供了你可以下载并在自己的环境中运行和使用的软件版本。`fast.ai`\
  \ 的一个大卖点是，它提供了可用于你应用程序的训练模型，而且它同时也支持 `Python` 和 `R`，因此有多种选项可以免费开始学习机器学习。\n\n## 构建机器学习服务\n\
  \n为了构建一个可以可以将机器学习模型部署到多个用户的端到端服务，通常使用大型云提供商之一提供的服务是一个好主意。提供此服务的两个主要云提供商是 `Amazon\
  \ Machine Learning` 和 `Google Cloud`。\n\n`Amazon Machine Learning` 面向想要执行简单任务的开发者，例如构建一个可以在几分钟内部署和配置的简单自然语言处理系统，Amazon\
  \ 已与一系列机构合作，帮助它为用户提供其他机器学习服务。好消息是，它以工具包的形式提供给开发者。一旦你安装了它，就可以从 `Github` 下载源代码，并在你自己的机器上本地运行它，也可以通过命令行运行，还可以从\
  \ Amazon 的云端运行。\n\n`Amazon Machine Learning Service`（简称 `AML`）是一种计算服务，可以从 `AWS console`\
  \ 启动，并用于创建 `AWS EC2` 实例集群，以训练和运行机器学习模型，以及执行其他的机器学习负载。`AML` 面向那些为特定问题构建简单解决方案的开发者，但\
  \ Amazon 也在尝试其他用例，包括如何使用 `AML` 为用户提供专门的服务。\n\nAmazon 为即将推出的 `AWS Advanced Machine\
  \ Learning` 服务引入了开发者预览版，该服务将于 2018 年第二季度发布。你可以在这里找到更多关于 `AWS Advanced Machine Learning`\
  \ 预览的信息。`AWS` 还在对 `Amazon Machine Learning` 的 `API` 进行实验，你可以使用它来创建机器学习模型，或者使用该 `API`\
  \ 让其他 `AWS` 服务与机器学习模型协作，并对模型本身生成分析结果。该 `API` 仍处于预览阶段，但你可以通过在此处注册 Beta 版来请求访问权限。\n\
  \n`Google Cloud Machine Learning`（简称 `GCR`）是一个免费服务，包含许多可以在云端部署的各种预配置机器学习模型。这些由 Google\
  \ 人员创建的预配置模型分为三类：强化学习、深度学习和训练。`Google Cloud Platform` 的 `ML API` 可在 `GitHub` 上获取，你可以从存储库下载源代码，然后在\
  \ Google 云上的虚拟机中运行它。你可以在这里在 `GitHub` 上找到这些代码。\n\n`Google Cloud Machine Learning`\
  \ 服务是 Google 承诺的一部分，旨在让开发者轻松创建运行在 `Google Cloud Platform` 上的应用程序，无论是使用机器学习模型还是其他机器学习系统。如果你对使用\
  \ `Google Cloud Machine Learning` 感兴趣，可以在此处注册免费方案，你就可以从 `Google Cloud Platform`\
  \ 下载代码并将其安装在自己的本地机器上。\n\n## 进行预测，或者，进行预测？\n\n预测有多种方法，你可以使用这些工具中的任何一个来实现，也可以使用许多其他方法。在大多数情况下，预测仅仅是对未来的一种的一种推测。事实上，你实际上在做的是对现状的预测。\n\
  \n人类进行预测的最早尝试可能是关于母鸡会产多少个蛋，或者天气何时会变化。这些预测可能基于对动物行为的观察。当天气变化，母鸡产的蛋没有前一天多时，人类可能会尝试预测那是行为的暂时波动，还是会成为一种持续的趋势。\n\
  \n这可能就是许多早期科学家对人类行为产生兴趣的原因。我们会对天气做些什么吗？天气会影响我们的行为吗？行为会影响天气吗？一些占优势的动物可能为我们提供一些预测。它们产的蛋会减少吗？它们会有很多蛋吗？因此，尝试观察人们看看他们的行为是什么样的，看看这些预测模型是否有效，是很自然的。\n\
  \n预测在表示方式上实际上非常简单：它们由数字或单词组成。数字可以是像 `1`、`2`或 `3` 这样的。单词可以是形容词、名词或动词。\n\n有时存在如何表示数字或单词的问题。必须是整数吗？可以是浮点数吗？可以是一个符号吗？可以是一个位（bit）吗？如果你不知道如何写单词，该如何表示单词？结果，我们可以用二进制位对数字建模，用\
  \ `Unicode` 字符对单词建模。\n\n事实证明，我们不能仅用数字或符号对单词建模。有时你无法写下单词，但你可以通过特定的形状来写它们，如果你想表达它们的含义，需要进行一些数学计算。\n\
  \n这就是机器学习的用场：你需要使用机器学习算法来建模“人类”，因为它包含了大写字母和小写字母，并且包含了 `b`（意味着 `in`），还包含了 `a`（意味着\
  \ `people`）。在许多情况下，你拥有的变量数量以及你正在解决问题的复杂性，让你无法手动进行建模。你需要计算机。这就是机器学习的用场。\n\n在机器学习中，我们使用软件程序处理数据并做出预测。你输入一组数据，例如朗读书中的章节时发出的声音，程序尝试预测下一个声音。你输入另一组数据，例如人们看预告片时的反应，程序对你应该租赁还是购买该电影做出预测。\n\
  \n你想要一个根据你输入的数据、所采取的步骤来做出正确预测的程序。你有一组未拟合的数据，你想要一个根据新信息、未来以及其他可能发生的情况做出预测。\n\n在早期，我们只使用标准的回归、分类、聚类等策略。我们把这些策略用于图像识别、语音识别等。这些算法背后的思想已经存在了很久。它们至少从\
  \ 20 世纪 50 年就开始存在了。\n\n现在，许多算法使用的是相当基础的数学。我们如何做得更好？嗯，一种方法是使用神经网络。这些网络接收传感器接收的信息传递给大脑的其他部分（实际上是一个计算机），大脑的这个部分执行所有的复杂的数学计算，决定最佳预测结果，然后将其反馈给网络。这是一种并行处理方法，使得以比传统算法复杂得的方式来实现这些事情。\n\
  \n\n\n与此同时，在 20 世纪 80 年代和 90 年代，研究人员开始使用神经网络进行语音、视觉和文本处理中的模式识别。1992 年，一种名为`deep\
  \ learning`（深度学习）的技术展示了演示：训练一个网络来识别数据中的模式，然后使用该网络来识别新数据中的模式。它处理的数据量比传统算法多得多，但仍然存在一些问题。\n\
  \n其中一个问题是，准确性往往取决于网络的哪个部分在尝试进行预测。如果网络的一部分试图根据输入数据进行预测，那么如果它试图根据网络其他部分的预测结果进行预测，得到的输出就会大不相同。\n\
  \n另一个问题是训练新网络需要很长时间，但非常很难找到训练它们的好方法，因为网络对自身并不了解多少。你不知道层与层之间正确的连接序列是什么。你不知道正确的权重是多少。这并不是说你可以简单地添加权重或可视化连接，或预测连接应该是什么样。即使只是用良好的数据进行训练，也很难弄清楚网络内部发生了什么。\n\
  \n这两个问题中有趣的地方在于，它们是相互解决的。你得到了一个简单的预测算法，它在根据自己的数据进行预测方面表现良好，但它不知道自己在尝试做什么。这让你拥有了一个学习进行预测的网络，但它并不知道如何这样做。你拥有这种几层可以连接的架构，但你无法对这些连接是如何构建的有详细的。\n\
  \n今天，神经网络一直用于模式识别，并且被用于许多不同任务的模式识别。它们在在这方面非常成功，但较不成功的是它们并不特别擅长的预测任务类。我们喜欢预测未来。我们想知道未来五分钟内会发生什么，或者想知道下周会发生什么。我们并不真正关心过去的五分钟、上周或明年。\n\
  \n我们需要一种方法来预测未来十秒内将发生什么。也许我们想知道未来十秒内是否有汽车朝我们驶来，或者我们想知道未来十分钟内是否会有导弹发射。如果我们能预测这类事情，将是非常有用的。\n\
  \n我们有一个预测事情的好方法：我们使用`Bayesian estimation`（贝叶斯估计）。我们知道许多种算法。其中一种被称为`multivariate\
  \ regression`（多元回归），你从中获取一个预测矩阵，比如一个两个变量的矩阵。如果你取两个变量，比如向右移动或向左移动，它有两个条目，一个前向项和一个后向项，如果你分别计算前向和后向项，就会得到一个方程。然后你想计算斜率的斜率。如果方程的斜率为零，你就可以计算斜率，你就得到了预测。\n\
  \n问题是，方程实际上比变量多得多，所以你需要知道计算哪一个方程以及如何计算它。你不能只单独计算每个方程。这真的很难做到。\n\n另一种好用的技术是`autoencoder`（自动编码器），它是一种神经网络，旨在为数据集学习高效的编码。目标是将输入压缩为低维表示，然后从该表示重构输入。这使得网络能够学习数据中最精要的特征。\n\
  \n## 什么是人工神经网络？\n\n人工神经网络（`ANNs`）的灵感源于人脑。ANN 基本上由层组成，就像人脑一样。每一层处理来自前一层的输入，然后将其传递给下一层。`ANN`s\
  \ 的输出层返回整个网络的输出，而底层决定输入是否正确。\n\n例如，输入层可能被用于处理图像。输出层会判断特定的图像是猫还是狗。输入层可能还会根据形状、颜色和其他特征决定猫或狗看起来是什么样。\n\
  \n在研究中，`ANNs`经常与人脑进行比较，但这只是因为它们尝试像人脑一样学习。`ANNs`能够以我们相同的方式收集信息，输入层是感知发生的地方。\n\n根据\
  \ DeepMind 的，`ANN`实际上是最简单的算法形式，但它的学习速度远超人类大脑目前的可能。在使用神经网络的测试中，该系统学会了玩《太空入侵者》（Space\
  \ Invaders）游戏，准确率达到 80%，并能在 30 分钟内学会一项任务。\n\n“谷歌在几周内教会了`AlphaGo`——通过仔细地调整训练集、调整架构以及调整训练它的实验，”博客文章写道。\n\
  \n“当然，这只是`AlphaGo`的一小部分。有数千万种新游戏等待`AlphaGo`学习，我们预计我们的系统最终将玩所有可能的游戏。到目前为止，`AlphaGo`已经与世界上最好的计算机——所有的大师——进行了对比赛，并赢得了每场比赛。”\n\
  \n## 使用 AI 映射照片\n\n微软的科学家利用谷歌 DeepMind 背后的技术创建了他们称为的人脑表示图像的“图形格式”。\n\n通过扫描整个世界，微软提供数据集而索尼提供\
  \ AI，该软件能够学习图像的底层结构，并在相应位置绘制物体。\n\n更重要的是，该软件可以在照片中移动物体，即使是更复杂的角度。\n\n\n\nDeepMind\
  \ 的突破性工作也被用于保护 Wikipedia 免受网络攻击。2015 年的研究人员能够通过替换 Wikipedia 页面上的背景图像，实时更改新的图像。\n\
  \n## 机器学习中的数据结构\n\n尽可能快速的错误标记是实现良好训练的关键。它被用于将数据分类为标签 `A` 或 `B`。在实践中，我们通过一种被称为`迁移学习`的技术来改进模型的预测。\n\
  \n与其计算函数，我们实际上是在尝试从给定的函数中学习。例如，如果我们正尝试计算函数的梯度，只需通过指数级增加函数来修改。这种方式，通过选择最佳候选函数，我们对每个候选者调整参数，直到参数收敛。这一过程可以显示，当模型函数与观测标签之间的距离最小化时，学习就会收敛。\n\
  \n这一概念的一个经典例子是用于图像聚类的“深度置信网络”。\n\n神经网络的标准方法是将特征绘制到训练数据上。在训练的第一阶段，如果数据非常稀疏，训练需要大量的时间。然而，如果训练数据很大，计算将变得昂贵。为了减少成本，我们定义了一个考虑训练数据量的正则化项。在标准方法中，正则化考虑了固定成本，即`梯度下降`函数，这在实践中很容易计算。我们将看到正则化项的效果。\n\
  \n## 监督学习示例\n\n在监督学习中，我们也可以定义一种衡量标准，告诉我们预测标签与观测标签之间的差异。例如，我们有一个模型 `A` 来预测给定数字是正还是负，以及另一个模型\
  \ `B` 来预测给定数字是正还是负。\n\n假设我们想要预测数字是否高于或低于阈值。通常，数字越高，它高于阈值的概率越大；数字越低，它低于阈值的概率越大。\n\
  \n我们想要训练一个模型来预测数字是否高于阈值（或预测低于阈值）。我们还想知道如何选择高于或低于阈值的参数。训练阶段，我们从训练数据中取一个样本并输入模型。如果模型的预测值高于阈值，我们减去`平均值`和`方差`。这给了我们一个低于阈值的预测数字。\n\
  \n如果预测数字高于阈值，我们从训练数据中取一个样本并输入模型。如果模型的预测值低于阈值，我们同样从训练数据中取一个样本并输入模型。我们可以看到，在上述方程中，`平均值`和`方差`是预测的归一化值。我们还需要取函数的导数并将其转换为标量。这被称为`自动编码器`，是深度学习的一个子类。\n\
  \n# 第 4 章 机器学习方法\n\n## 监督学习方法\n\n让我们从同一个角度解决这个问题，从机器学习算法开始（在这里，我们只需要分类：“德国”或“伊朗”）。让我们通过取模型的泛化大小作为输出，并注意它可能取决于标签：\n\
  \n对于每个输入层，只需提取函数的`log loss`（`1` 或 `-1`）。这足以通过跟踪分类器的输出来预测模型每一层的分类。\n\n简单来说：取输入的`log-loss`，并对神经网络的每一层对其加上\
  \ `1`。\n\n最小的输入输出差异是我们的输出标签，差异越大，该层的预测（输入）越强。\n\n这是我们可以用于扩展复杂数据算法的方法。\n\n通过观察学习算法的训练/测试划分，我们可以对算法的参数（如隐藏层数、隐藏节点数、激活函数等）有一个直观的理解。我们还有需要处理的参数数量（例如目标区域的大小）。让我们看看一种处理它们的快速方法：\n\
  \n简单但具有一些高级特征。简单但具有一些高级特征。\n\n这里是我们缩放函数的输出：\n\n对于每一层，简单取函数的`logloss`（`1` 或 `-1`）。\n\
  \n并对我们模型的每一层对其加上 `1`。\n\n缩放后，最大值（需要额外的测试）随层数的增加线性增长。我们可以将缩放函数重写为矩阵：\n\n神经网络现在可以通过少数参数进行学习。稍微复杂一点的示例步骤如下：\n\
  \n添加加权先验以最小化每一步的标准差（矩阵，其中 `X` 和 `Y` 是每个权重索引隐藏层的输入、输出和 `logloss`）。权重的结果将是一个过度权重分布。\n\
  \n以及对于每个权重索引隐藏层）。权重的结果将是一个过度权重分布。我们需要为每一层准备特定迭代次数的训练/测试划分。从矩阵可以看出，列（其 `X` 和 `Y`\
  \ 坐标为输入、输出和 logloss`）对于 3 个权重索引层中的每一个都有不同的迭代次数。\n\n完成训练/测试划分后，我们将取`logloss` 并结合层数进行缩放。通过这种方式，我们能够从输入到输出，再到\
  \ `logloss`。\n\n虽然我们不需要显式地可视化这些组件来构建模型，但在这种情况下，我们可以通过运行两次缩放函数来获得更灵活的可视化（例如直方图）：一次针对维度（例如\
  \ `10 × 10`），一次针对尺寸（例如 `3 × 3`）。这里是我们对每个权重索引层所需的特征单元图像：\n\n\n\n\n除非机器学习程序有一个起点，可以开始学习它们正在寻找什么，否则它将无法理解此类数据。\n\
  \n无监督学习的优势在于可以从零开始，因为它让计算机有机会观察到数据数据中那些被现有知识所掩盖的模式。\n\n无监督机器学习工具是通过将数据输入到算法集中开发的，这些算法会开始处理数据。\n\
  \n这是一个非常费力且耗时的过程，但对于那些处理大型非结构化数据集的公司来说，它可以带来益处。无监督算法是一种不需要任何训练的算法，而是在运行过程中不断学习的。\n\
  \n这意味着它可以应用于新的数据集，并在没有人类干预的情况下针对新任务或新任务接受进一步的训练。\n\n研究表明，无监督学习对机器学习程序的准确性具有重大影响。\n\
  \n监督式机器学习方法是一种在设计时预先考虑了预定义任务或一组任务的机器学习程序。\n\n对于任何在学校里上过机器学习入门课程或使用过标准计算机程序的人来说，这种方法都会很熟悉。\n\
  \n这种方法需要使用预训练的数据集，通过这些数据集，机器学习程序可以学习如何在新数据上执行任务，前提是训练集中的数据没有被无法用于创建程序的信息误偏。\n\n\
  使用包含正确和错误答案的数据集训练的程序，其性能可能不如在仅包含正确答案的数据集上训练的模型。\n\n第二类机器学习被称为深度学习。它也是机器学习的一种形式，在其中机器学会在视觉环境中学习执行任务。\n\
  \n它通常被用于图像识别甚至计算机视觉等领域。\n\n深度学习是 Google 开发的一种方法，旨在提高 Google 图像搜索结果的质量，它学会了从图像中识别猫并提高结果的质量。\n\
  \n## 监督学习和无监督学习有什么区别？\n\n监督学习为计算机提供了一个需要遵循的目标或方向，而无监督学习则是告诉计算机只需观察并学习。\n\n在监督学习中，计算机被赋予了一个需要遵循的数学公式以及在数据集中寻找特定数学函数的指令，并根据其结果决定下一步做什么，例如加法、减法或如何存储数据。\n\
  \n在监督学习中，计算机通过算法引导完成任务，程序被设定为为其提供一组函数或规则，引导其到达目标点的终点，在这种情况下，是找到目标函数。\n\n在无监督学习中，计算机根据通过获取数据获得的经验遵循自己的本能，并自主地产生一个值、答案或行动。\n\
  \n## 机器学习如何改进公司的产品或服务？\n\n机器学习将显著提高机器可以执行的分析和其他操作的质量和深度。\n\n它还将提高任何机器学习程序的速度和准确性。\n\
  \n深度学习对组织来说极其重要。\n\n机器学习程序需要学习如何与数据交互并学习做出决策。\n\n在大数据的情况下，在广泛数据集中发现的数据类型将是不同的。\n\
  \n因此，处理广泛数据集的机器学习程序将学习连接数据，并学习根据数据做出决策。\n\n一个有效的机器学习程序的产生需要许多人员参与机器学习程序的生产。\n\n\
  他们需要知道如何使用数据来制作机器学习程序，并学习如何进行编程。\n\n## 什么是半监督机器学习方法？\n\n我们可以使用半监督学习模型来帮助我们预测数据的完整色彩空间，而无需指定所有参数。考虑为特定数据集估计完整色彩空间的问题：\n\
  \n我们将具有已知空间频率的图像（即 `RGB` 颜色模型）作为输入，并将一些需要预测的数据。例如，假设数据已准备好 `75%` 的图像，我们需要预测剩余像素的色彩。\n\
  \n在监督学习中，我们使用包含正确和错误答案的数据集来训练程序，其性能可能不如在仅包含正确答案的数据集上训练的模型。\n\n在无监督学习中，计算机遵循算法引导完成任务，并且程序被设定为为其提供一组函数或规则，引导其到达目标点的终点，在这种情况下，是找到目标函数。\n\
  \n在无监督学习中，计算机遵循自己的本能，根据通过获取数据获得的经验，并自主地产生一个值、答案或行动。\n\n（此处由于部分原文重复，翻译时已确保逻辑连贯）\n\
  \n在写作时，我们还没有找到完美适合该模型的数据集。我们可以使用示例图像来训练我们的模型，但这更多像是一个玩具。然而，我们发现了一张图像（如下所示），可以使用半监督模型对其进行训练并查看模型的效果。我们的模型给出了相当的预测，尽管上方区域和下方区域之间存在细微差异。\n\
  \n这种细微差异的原因是我们在使用具有不同深度的绿色区域，但 `100%` 置信度的区域是绿色，而 `50%` 置信度的区域是浅绿色。这与我们在全监督模型中发生的情况相似。\n\
  \n## 什么是强化学习方法？\n\n强化学习方法是一种用于自训练模型的机器学习方法。它是一种非常容易理解的方法，因为它基于训练数据中的动态优化以及一些参数拟合。训练模型时，你首先定义模型中每个变量的副本，以及每个可能数据集所需的准确率，然后以具有该参数值最高值的方式运行模型优化步骤。如果你想训练一个具有大量参数的模型，例如，它可能需要两周，但对于较大的参数值，例如，你可能只需要几个小时。\n\
  \n在这里，每个可能的参数值都会根据模型性能（或缺乏性能）进行调整。在我们的情况下，对于任何给定的训练数据，所需的 `CUBE` 单位数量被用作基准，确定模型需要多少样本才能获得相应的评分。一旦模型训练完成，将对其进行微调以达到最大准确率，即给定数据集的评分。\n\
  \n\n\n\n此外通过对模型进行微调，我们对每个样本进行大量的处理，因此，可能同时使用连续变量和分类变量。分类变量通常是连续变量的良好预测器，但对于连续模型，结果的预测值是整个数据集。然而，在强化学习方法中，分类发生在模型中。因此，我们需要运行模型多次（一次迭代）以获得数据集的预测。然后，我们将预测结果转换为分类形式。\n\
  \n在实践中，这需要对执行两次转换。我们需要将结果转换为分类形式，然后对结果进行预测器比较，如果有的话。\n\n### 强化学习方法是如何工作的？\n\n[content]\n\
  在强化学习中，我们使用环境的虚拟模型并运行模型直到达到阈值。然后，我们将性能得分作为输入应用于输入层。然而，这些信息在基础层是不可用的。因此我们需要对其进行转换。\n\
  \n我们定义特定的状态，例如 `CUBE` 的左上角，并运行模型直到达到指定的阈值。这就是为什么我们需要运行模型多次（一系列迭代）以获得最终得分。然后，我们将预测结果转换为分类形式，并将其用于预测。\n\
  \n### 这在基于事件的神经网络中是如何发生的？\n\n[content]\n这发生在双层神经网络中，第一层是概率空间。也就是说，它记录了基于当前输入的结果可能的概率。网络的输出是另一个代表最终输出的概率空间。\n\
  \n然而，在强化学习方法中，我们需要能够将当前输入转换为相应的输出，而无需反复运行模型。因此，我们需要一个二级分类器将输入转换为相应的输出。如果输入可能是特定的输出，我们再次运行模型。然而，如果输入可能不是特定的输出，我们再次运行它。这就是为什么我们使用二级分类器。\n\
  \n这里有两个巨大的挑战：将概率转换为输出，以及将输出转换为输入向量。概率空间（又称模糊逻辑）可能如下：\n\n然而，从逻辑的角度来看，这非常繁琐，并且并不容易转换为可用于神经网络的语言。然而，我们仍然可以将概率空间转换为概率密度函数，然后可以将其编码为神经网络内部的核（或其平滑版本）。\n\
  \n此外，我们可以添加一些转换。我们可以更改为每个输出所保留的概率权重，使得神经元的输出是输入中所有神经元的输出之和。我们还可以在输入和输出之间添加步长或损失函数。\n\
  [/content]\n\n# 第 5 章 大数据\n\n## 什么是大数据？\n\n[content]\n大数据指的是以数字形式存储的海量信息。从理论上讲，数据可以处理的内容以及访问这些数据的地方应该是无尽的。跨应用程序共享的大量信息，以及云端的访问和存储需求，创造了一个巨大的未处理数据宝库。全球每天产生的信息中至少有一半从未被使用，导致了全球监控鸿沟。\n\
  \n不仅数据量正呈指数级增长，分析这些数据点的能力也未能跟上。由于计算系统中的可用核心和显卡数量没有限制，分析数据所需的处理能力已指数级增加。\n\n虽然目前的工具允许将分析大量数据的成本分摊到大量数据上，但新模型（如学术界开发的模型）已成功地将昂贵的计算能力与廉价的数据处理基础设施相结合。\n\
  \n大数据将改变我们与数据交互的方式。它将为个人提供比以往任何更好的信息访问。它将允许企业创建准确的预测模型并发现新的市场机会。访问和利用海量信息的能力将创造新的业务模式和服务。\n\
  [/content]\n\n## 准备工作\n\n[content]\n大数据具有转型行业的潜力，因此，我们的政府、教育机构和公民社会了解其潜在益处并理解其可能带来的威胁是至关重要的。\n\
  \n为大数据做好准备意味着意识到它提供的机遇，并理解它将带来的挑战。这需要公司意识到，为了充分利用机会，他们需要采取行动。一些工作已经在进行。例如，在 2015\
  \ 年，`IBM` 和国家安全中心制定了英国的大数据战略。\n\n然而，由于还没有大数据的监管机构，“大数据”的概念在英国尚未被完全定义，政策制定者和行业尚不确定它将影响业务和社会。这种不确定性产生了“数据沙漠”这一术语。政府尚未就如何应对不断变化的法律制定指南。\n\
  \n\n\n缺乏清晰的指南，并且由于只有少数公司能够获取其进行分析所需的全部数据这一事实而变得更加严峻。事实上，在旧的数据保护法下，公司被要求在数据泄露发生后的特定时间内发布有关数据泄露的信息。\n\
  \n在实施的第一年，数据保护法必须应对一个长期存在的问题，即如何处理由于社交媒体平台增长和互联网演变导致机构可用数据量不断增加的问题。\n\n由于英国尚未设立大数据的监管机构，目前尚不清楚公司是否仍然能够像现在那样获取和处理数据。这对美国大数据行业的影响可能与对英国的影响一样之大。\n\
  \n鉴于行业内缺乏共识，且尚无人能定义“大数据”这一概念，这种透明度的缺乏在可预见的未来可能仍是企业面临的一个主要担忧。\n\n为了应对这些问题带来的挑战，英国政府应该退后一步，并制定一种整体性方法来监管大数据和社交媒体平台。这将帮助企业和组织了解他们可以使用哪些数据，以及如何降低与使用这些数据相关的风险。\n\
  \n此外，政府应该意识到，就像金融行业一样，大数据领域的机构如果有手段隐瞒，在起初可能会寻求避免报告泄露。\n\n然而，最终为提供可供报告的数据并没有简单的解决方案。\n\
  \n## 为什么大数据很重要？\n\n在本节中，我们将观察一些趋势。大数据平台供应商将专注于构建更具模块化的大数据平台，并可以进行定制以满足企业的特定需求。为了给用户提供完整的解决方案，大数据平台提供了相关工具。\n\
  \n## 大数据平台的趋势\n\n大数据平台将成为所有大数据解决方案和服务的中央神经系统。因此，人们越来越需要找到方法使平台更加灵活和模块化，以适应各种用途。\n\
  \n为了创建一个能够满足企业多样化需求的大数据平台，平台将是模块化且开源的。这将允许不同的企业使用平台，提供灵活性并帮助企业将平台与其现有的系统和工具集成。\n\
  \n## 大数据的出现\n\n大数据平台有两种类型：\n\n- `Data warehouses`：数据仓库为存储和处理提供中心枢纽。\n- `Data lakes`：数据湖与数据仓库类似，但它们通常是开源的。\n\
  \n## 大数据的趋势\n\n大数据可以分为四大类：\n\n- **战略性分析 (Strategic Analytics)**：这是一个衡量业务结果并发现模式以了解个人或组织行为的过程。\n\
  - **运营性分析 (Operational analytics)**：这是一个从系统中收集信息并从中获得洞察以提高运营性能的过程。\n- **商业智能 (Business\
  \ intelligence)**：这是一个对从系统中收集的信息生成可操作报告的过程，以帮助组织做出明智的决策。\n- **应用程序接口 (API)**：这是一套即插即用的\
  \ `API`（应用程序接口）工具，简化了企业应用程序中的编程工作。\n\n## 企业应用的趋势\n\n预计大数据平台市场在未来几年内以 30% 的复合年增长率（CAGR）增长。因此，采用大数据平台和服务的企业数量预计将增长。\n\
  \n\n\n然而，企业需要选择一个符合其需求的大数据平台。大多数企业级大数据平台供应商都提供以解决方案为中心的产品，这些产品包含了预构建的数据库、分析、商业智能、集成等其他适用于企业的功能。\n\
  \n商业智能工具和平台可能是大数据的下一个大趋势。商业智能工具和平台将使组织能够连接各种数据源。因此，企业将能够从收集的数据中得出具有可操作性的洞察。\n\n\
  商业智能工具和平台将为他们提供可视化和分析数据的能力。结果是企业能够制定更好的业务决策，并从收集的数据中获得可操作的洞察。\n\n## 大数据分析的趋势\n\n\
  尽管大数据在市场中正势头良好，但仍然需要为数据提供分析能力。为了提供这种分析能力，供应商将专注于增强数据仓库和数据湖工具的能力，以提供各种高级分析能力，如预测建模、分类、回归和时间序列。\n\
  \n为了提供高级分析能力，大数据工具和平台需要具备互操作性和灵活性。大数据平台将使用多种分析技术进行构建，使平台能够与企业系统和数据湖进行集成。\n\n大数据工具和平台的能力将取决于嵌入其中的高级分析。软件需要具有足够的灵活性以适应企业需求，并使用可以被不同应用程序和设备使用的`open\
  \ APIs` 进行构建。\n\n## 数据集成趋势\n\n大数据技术和平台与现有企业系统及数据湖的集成将成为成功的关键。为了满足集成需求，供应商将侧重于在其数据平台中提供不同平台和工具的无缝集成。\n\
  \n这将确保不同的平台和工具可以轻松集成，并供企业内部的不同团队使用，从而帮助他们有效协作，并加速大数据分析和其他业务应用进程。\n\n为了满足集成需求，大数据平台需要具有灵活性，并能够与其业务应用程序集成。这将帮助企业在大数据分析和其他业务应用中提高效率。\n\
  \n## 云部署趋势\n\n云部署预计将成为大数据工具和平台的关键因素。对可以通过云访问的大数据工具和平台的需求预计将市场增长的主要因素。\n\n大数据工具和平台的云部署将允许企业将其数据从本地迁移到云端，然后执行各种业务分析和数据湖，而无需雇用\
  \ IT 专家。\n\n## 分析与数据访问挑战\n\n为了克服访问和分析数据时面临的挑战，大数据工具和平台可能会与企业系统和数据湖进行深度集成。这将确保存储在数据湖中的数据可以通过大数据工具和平台进行访问。\n\
  \n大数据工具和平台与企业系统及数据湖的集成对于企业访问存储在数据湖中的所有数据至关重要。这将使企业能够更好地访问存储在数据湖中的数据。\n\n为了提高大数据分析和其他业务应用的效率，工具和平台需要具有更好的分析能力。这将使他们能够数据分析和各种业务流程的准确性和速度。这将使他们对数据提供更好的分析。\n\
  \n大数据工具和平台的企业部署预计将在未来几年继续。大数据工具和平台将提供多种优势，如灵活性、效率和敏捷性。\n\n# 什么是数据科学统计学习？\n\n数据科学统计学习，或\
  \ `DSLe`，是一种获取洞察的工具。统计学习是一种监督机器学习的形式，用于涉及数据收集和预测的任务。在许多情况下，机器学习算法对其推理的解释不够充分；`DSLe`\
  \ 的目标是提供这种人类洞察。本关于统计学习的教程介绍了用于定量指标分析、创建和训练推理引擎的 `DSLe`。\n\n## 什么是图形线性代数 (GLAM)？\n\
  \n`GLAM` 是一种将数据信息转换为可用向量场操作的表达式的技术。它主要用于图像处理，以及解释特征工程算法，这些算法决定了特征如何贡献于特征空间相似性的定义。它也经常用于统计机器学习，将数据转换为特征。作为一种产生数据线性变换的工具，`GLAM`\
  \ 在创建数据可视化应用程序（如感知图和散点图）方面非常有用。它还允许算法被多次应用。\n\n## 什么是抽象学习？\n\n抽象学习是一种用于近似推理的机器学习技术。在传统的统计框架下，方程被表示为无限大的向量，例如\
  \ `X` 变量和 `Y` 变量的相关性；相比之下，在抽象学习中，公式被表示为数组，例如 `X` 变量与 `Y` 变量的比率。对一组数据的方程近似输出并不总是像精确公式提供的那样精确。目标是找到一个尽可能好、但仍是所需解决方案的合理近似的指标。抽象学习在数据挖掘等科学应用中特别有用。\n\
  \n## 什么是数值学习？\n\n\n\n\n数值学习是一种用于估计寻找最优解所需样本量的统计技术。用于评估数值解质量的定量衡量标准被称为数值近似比率（ANR）。这个\
  \ `ANR`（读作“anno”）是算法必须求解的似然函数与样本量之间的比率。由于评估的是 `ANR`，因此数值解被称为“校准近似解”。为了创建校准，算法必须知道\
  \ `ANR`。\n\n在统计学习中，`ANR` 提供了关于单个样本质量的信息。例如，如果 `ANR` 为 3/5 且考虑了三个示例，那么可以得出 `ANR`\
  \ 有很大可能是 3/5。然而，如果 `ANR` 为 10，这个信息就没太大意义；相反，人们想知道随着考虑的样本的增加，`ANR` 的表现如何。在数值情况下，这显而易见：`ANR`\
  \ 仅仅是有限样本数（例如 `n`）与样本量（例如 `n * 3`）之间的比率，或者是为了找到问题的解决方案而必须求解的优化实例的数量。\n\n## 什么是逻辑回归？\n\
  \n逻辑回归是一种在机器学习中广泛使用的统计模型。与许多机器学习算法一样，逻辑回归基于贝叶斯模型。在这个模型中，目标函数由一个名为“logistic”函数描述，该函数估计在给定一组数据的情况下假设的概率。在最形式的形式，逻辑回归的似然函数可以写为：\n\
  \n该函数描述了在给定一组数据的情况下符合假设的案例比例。案例或标准是“这是最佳假设吗？”该函数有三种书写方式：\n\n影响似然函数的超参数有两类：\n\n-\
  \ 修改似然函数的超参数\n- 修改其他参数的超参数。\n\n通常情况下，逻辑回归将使用其基于模型选择找到的逻辑函数。模型选择是统计学的一个分支，描述了如何选择最佳假设或模型，以构建出参数的最优估计。在参数独立的简单模型中，这可能涉及从大量可行函数中选择似然函数并计算\
  \ .。似然函数的选择受成本函数的限制，该成本函数指定了人们愿意在多大程度上增加数据的似然性（这将影响 ）。该成本函数可以通过对偶方程来描述：\n\n## 训练中的逻辑回归拉格朗日乘子\n\
  \n对于回归问题，最重要的超参数之一是数据点的数量。在训练时，人们自然想要仅使用这些数量的数据点找到最佳参数。然而，这往往会导致估计质量很差；使用更大的训练数据以减少过拟合的可能会更好。\n\
  \n这种公式被称为训练中的逻辑回归拉格朗日乘子（LR-LMIT）。\n\n在训练时，`LR-LMIT` 通常设置为数据点的数量。如果数据点足够多，`LR-LMIT`\
  \ 在训练数据上具有二次或更高的误差，而将其设置为较小会导致准确率大幅下降。`LR-LMIT` 在优化参数和 . 也起着重要作用。在许多情况下，`LR-LMIT`\
  \ 是对数据的“最优”拟合，成本函数使用 `LR-LMIT` 定义。然而，这种通用形式是有歧义的，因为通常不清楚它是否对应于数据的最优拟合。\n\n虽然机器学习中的大多数优化方法使用通用公式\
  \ ，但已经开发了三种用于优化的特定公式。这些通常被称为交叉验证 (CVC)、标准模型 (SM) 和 CVC/SM 混合模型 (CVC-SM)。`CVC-SM`\
  \ 具有数值严谨且对广泛不同场景灵活的优点。作为替代公式，我们还使用了 CVC 的简化版本 (SVC)，它提供了一个更适合极大规模设置的 `CVC-SM` 版本。\n\
  \n`SVC` 公式优于 `CVC-SM` 公式的优势是 `SVC` 保留了参数严格正数的情况。在这种情况下，`CVC-SM`是非线性的，不适用于复杂模型。\n\
  \n在实践中，通常更倾向于 `CVC-SM` 公式。例如，对于只有少数参数的简单且低维的模型，已知 `CVC-SM` 公式产生的结果明显优于 `CVC` 公式。此外，`SVC-SM`\
  \ 可以表示为 Gamma 的积分，这个 Gamma 函数在逻辑函数方面有很好的表示，即为 . 因此，`SVC-SM` 公式的拟合为参数设置提供了更直观的表示。然而，`SVC`\
  \ 公式在最小化成本函数方面缺乏灵活性，且可用函数集无法针对特定问题进行数值调优。因此，`SVC-SM` 常用于仿真以重现所需的模型行为。\n\n## 自动推理\n\
  \n在过去，反向传播算法的发明使自动推理变得容易得多。该算法背的思想是根据给定权重调整误差，并将误差反向传播回成本函数。该算法易于实现，是所有机器学习算法中最基础的之一。尽管相对容易实现，但已证明该算法在非常大的数据集学习中可以产生巨大的收益。此外，它促进了深度学习以及通用自动学习的巨大进展。\n\
  \n在现代机器学习世界中，已经证明反向传播方法会导致强大的误差，即使对于非常大的数据集也能极大提高解决方案的准确性。然而，反向传播算法不能应用于任意问题。反向传播算法的主要局限之一是在每次迭代中为模型提供更新的权重。这一过程为算法运行引入了开销，从而为实现创建了昂贵的迭代。此外，这种开销层通常被忽略，性能通常通过比较算法结果与学习率来衡量。在大规模机器学习应用中，误差对这种梯度计算非常敏感，这会显著降低结果解决方案的准确性。\n\
  \n许多计算机算法允许为优化算法自动生成训练集。允许此的最著名的算法是神经网络算法。神经网络算法利用了机器学习模型形式的大量简单或独特的“神经元”。神经网络中的神经元无非是梯度下降方程的某种配置，该方程仅依赖于训练数据。尽管这个模型非常复杂，但它会在单个训练数据上运行很长时间以近似适当的函数。神经网络计算梯度的误差并将误差反向传播到成本函数以纠正误差。该算法的结果通常非常准确，并且对于定义良好的问题特别有用。\n\
  \n\n\n\n反向传播算法有几个缺点，它不再是许多大规模机器学习问题的首选解决方案。然而，在针对极大规模问题的研究中，它仍然被广泛使用。许多流行的研究型神经网络库都会调用反向传播，例如\
  \ `scikit-learn`、`cnn-learn`、`MXNet` 和 `PyTorch`。这些库为以非常高效且可扩展的方式构建大规模机器学习模型提供了框架。\n\
  \n作为最后，我们还想提到 `Ben Goldacre` 在改进反向传播算法方面所出的巨大工作。他的工作极大地提高了该算法的计算效率，是深度学习和传统机器学习问题性能大幅提升的原因。如果你对学习更多关于反向传播算法感兴趣，可以查阅他的论文：“深度卷积网络：使用部分状态熵稳定误差”。\n\
  \n## 深度学习\n\n这些神经网络算法中最著名的，也是最复杂的。深度学习算法背后的思想是获取数据并将其还原为更小、更简单且更具体的部分，例如输入维度或类别维度。深度学习算法然后计算这些较小部分的输出，并将它们组合在一起，以创建一个更复杂的输出。\n\
  \n该算法涉及将大量的小型操作（称为 `training sets`）应用于大量的训练数据。训练阶段的第一步是选择一个 `learning rate`。这决定了我们从输入层到输出层的进展速度有多快，以及输出层的计算有多快。这一步在算法的实现中经常被忽略，通常留给用户进行配置。\n\
  \n一旦选择了 `training set`，我们就可以训练网络来解决手特定的特定问题。例如，我们的网络处于类别维度 3，它应该能够输出类别标签 3 以及对应参数的正负号。我们可以训练网络计算参数的正负号，以确保输出与预期值对应。一旦网络训练完成，我们需要确定如何表示和处理训练数据。通常建议将数据抽象为多个层，并为同一个训练数据集创建更高层次的表示。这是一种极其有用的技术，因为它允许我们把许多大量数据压缩到一个较小得多的空间中，同时保持准确性。在深度学习领域，这通常被称为前向数据流，并且通常出现在卷积神经网络的设计中。\n\
  \n一旦训练阶段完成，我们希望确保算法能够处理训练数据，并且代价函数是可求解的。为了做到这一点，我们需要在代价函数和 `learning rate` 之间找到权衡，并不断调整它们直到我们获得正确的解决方案。我们可以通过训练或测试阶段来实现这一点。我们可以在不同的数据集上训练网络，直到找到最优参数集，或者我们可以进行定期测试，看看参数是否可以进一步调整以降低整体学习曲线。\n\
  \n深度学习比更传统的机器学习方法具有许多优势。深度学习算法在大规模应用中的有效性部分归功于海量的可用训练数据，以及反向传播算法和计算机硬件的效率。然而，AI\
  \ 领域仍处于发展的早期阶段，由于其高复杂性和处理要求，深度学习算法在实现实际现实应用方面一直面临困难。\n\n## 结论\n\n### 思考未来\n\n技术将如何改变未来的工作：\n\
  \n- **预测市场行为** – 医生使用机器学习来分析你的病史，并预测疾病是否可能复发。这有助于预测哪种治疗效果最好，允许医生根据你的症状定制治疗方案。\n\
  - **更智能的数据管理** – 机器学习应用可以确定使用数据的最佳方式，这将有助于提高数据安全。\n- **更精简的安全** – 学习如何识别数据泄露中的可疑活动可以让所有人变得更安全。\n\
  - **更主动的营销** – 数据科学家将能够使用机器学习发现新的受众。\n- **更具个性化的广告** – 利用来自 Facebook 个人资料和搜索历史的数据，营销人员可以比以往任何时候都更好地针对你投放广告。\n\
  \n## 机器学习的优势\n\n不同的机器学习算法根据其学习方式进行分类。这种分类基于它们的 `training set`，通常由标记数据和高维数据组成。这些被称为监督学习算法。\n\
  \n## 深度学习\n\n深度学习涉及由许多隐藏层组成的神经网络，这些层被不断调整以反映真实世界的数据，就像简单的特征检测器。学习过程允许从许多高维向量提取数据，以更高效地执行任务。\n\
  \n## 神经网络\n\n通常，神经网络由若干层组成，每层被称为 `neuron`，以及一个允许神经元相互发送接收消息的线性控制器，称为 `input layer`\
  \ 和 `output layer`。神经网络通常输入训练数据，以学习网络的 `weights`，使得每个层随后能够生成一个值的向量。输出被馈到下一层，该层根据之前的权重和当前的训练数据进行修改。下一层将输出传递给下一层，依此类推。网络的层之间可以重叠。\n\
  \n\n\n\n在启动机器学习的模型训练时，会使用各种步骤和算法。在本文中，我们将讨论其中一些。\n\n## 分类 (Classification)\n\n分类是根据单个对象的特征识别对象特征的过程。这是一个相对简单的过程，因为大多数对象都有明确定义并且可以进行分类。分类对象简单的方法是尝试使用一组预定义的属性或特征来识别每个对象。\n\
  \n例如，你可能使用一组名词来根据特定区域的海滩或日落对你的照片进行分类。同样，如果我们想对图像中的对象进行分类，可以使用颜色将它们归为红色或黄色。所有对象都会被分配一个颜色并标记标签。换句话说，每个对象都是被孤立地来看，并进行相应的分类。\n\
  \n分类有几个优点，包括：\n\n- 它有助于确定给定场景中对象的间隔情况\n- 它可以用于判断两个对象是否属于同一类别\n- 它有助于确定图像中的对象与图像中其他对象的关系\n\
  - 可以为每张图像分配一个分数，根据上述因素对其进行分类\n\n## 分布特征 (Distributional Features)\n\n在大多数情况下，分类是基于一组特征的。这种方法被称为通过给定的特征对图像进行分类。这是一种广泛使用的机器学习技术，但它并不是最准确的，因为图像不需要被正确地标记。例如，一个\
  \ 10 岁的男孩可以很容易地分类为男孩，但对于如何标记同龄的其他儿童，这种分类是不准确的。\n\n分布特征被用于对象分类，并且通常涉及回归。例如，如果一张照片因为存在办公桌而被归类为办公室，然后与其它办公室照片进行比较，那么这种分类就是很有用的。它有助于显示特定属性的程度。通过特征进行的分类随后就是一种回归，而回归是一种基于假设的分类形式。\n\
  \n## 正则化 (Regularization)\n\n在构建机器学习模型时，我们需要知道如何以正则化的方式构建我们的模型。正则化是指降低自由度以提高分类质量。因为所有模型都基于这样一个假设：如果给出非期望类别的示例，分类器将会失败。在类模型中，可以调整分类器，使其在数据真的充满噪声时也永远不会失败。\n\
  \n像 Stanford Learnings 这样的许多来源列出了各种正则化技术。所需的正则化程度取决于你尝试预测的类别。它还取决于分类器的准确性和信噪比。这里的目标是定义一个在小数据上运行良好的模型，因此，你应该尝试设计并设置适用于你应用程序的正则化因子。\n\
  \n## 特征选择 (Feature Selection)\n\n基于分类结合其他函数的模型也可以称为 AI 系统。通常，模型将包含用于模型评估的额外特征。被考虑特征选择的特征是那些影响分类结果的特征。特征通常被分为：\n\
  \n- 概率性 (Probabilistic) - 它包括可以从一个类别变为另一个类别的特征\n- 决策性 (Decisional) - 这些特征相对稳定，因此即使数据有噪声，预期类别变化也会很小\n\
  \n## 建模 (Modeling)\n\n一旦构建了模型，下一步就是在训练数据中对其进行测试。训练数据由一个或多个需要在模型中解决的问题组成。例如，我们用于卖车票的分类器将需要显示车票的图像特征。一旦我们有了训练数据，就可以根据预测的标准差来评估模型的性能。\n\
  \n构建模型需要遵循以下四个步骤：\n\n- 步骤 1：生成一组数据，包括类别内部和外部的数据。\n- 步骤 2：定义模型，它可以通过创建一个值（即每个样本的标签）来执行任务。\n\
  - 步骤 3：使用数据训练模型并评估其性能。\n- 步骤 4：训练完成后，你可以在观察结果中找到类别标签。\n\n这一过程可以通过使用统计技术 `奇异值分解 (SVD)`\
  \ 来完成。然而，如果你正在处理非常大的数据集，可以将数据划分为较小的集合并重复该过程。\n\n机器学习模型被应用于许多科学领域。使用不同算法和数据进行学习始终是这些模型的目标。\n\
  \n到目前，你必须能够正确分类某些数据。对一组新数据的能力被称为分配 (Assignment)。\n\n机器学习模型用于许多问题，但以下是一些我们在日常生活中最常用的：\n\
  \n- 营销 - 预测客户购买产品的概率\n- 销售 - 通过预测你的客户将购买什么来销售产品\n- 客户关系管理 - 使用机器学习预测客户将如何购买\n- 产品性能\
  \ - 确定 `API`（应用程序接口）的性能。\n\n机器学习的应用非常广泛。你可以将其应用于预测、分类、回归、聚类、异常检测等。例如，你可以通过使用已知分子的网站或简介来预测恐怖活动，并通过使用历史天气数据来预测天气。\n\
  \n## 大数据分析工具 (Big Data Analysis Tools)\n\n通过自动化甚至有时是手动处理，公司可以使用一系列工具（包括人工智能）来筛选海量数据，并将这些信息转化为人力资源专业人员可以采取的信息。这些工具允许公司快速识别性能低于标准或表现停滞的员工。\n\
  \n### 基于分析的人才管理解决方案\n具有分析背景，你可以使用这些工具识别出优秀员工的特征，然后利用这些特征来判断候选人是否适合公司。\n\n### 劳动力分析\n\
  虽然不一定使用分析，真正的劳动力分析解决方案不仅查看员工表现。它可能包括扫描社交媒体和其他形式的公开或私人信息，以寻找员工痛苦的迹象。结果可能是解雇员工，但也可能是采取留住或改进员工表现的措施。\n\
  \n\n\n\n\n许多组织仍在探索在员工绩效中使用预测性分析的方法。但其实现范围是有局限的。最显而易见的局限性是，它无法知员工的想法。尽管存在例外，但大多数人无法准确地描述自己的行为。至少可以说，人类的直觉是不完善的。\n\
  \n最后，在大多数行业中，预测性分析不会取代人类的人才管理。人才管理成功的关键在于既要理解系统的潜力，又要愿意学习它能做什么以及不能做什么。许多组织仍然倾向于由真实的人来做出最佳决策。\n"
