    employee performance. But there are limits to what it can accomplish. The most
    obvious limitation is that it can''t know what an employee is thinking. There
    are exceptions to that, but most people can''t accurately speak about their own
    behavior. Human intuition is imperfect, to say the least.


    Finally, predictive analytics won''t replace human talent management in most industries.
    The key to success with talent management requires both understanding the potential
    of the system and being willing to learn what it can and can''t do. Many organizations
    still prefer an actual human being to make the best decisions.'
