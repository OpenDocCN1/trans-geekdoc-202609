    ##  Benefits of machine learning.


    Different algorithms for machine learning can be categorized based on how the
    machine learns. This classification is based on their training set, typically
    consisting of labeled data and usually of high-dimensional data, often with a
    large number of features. A few of these are commonly called supervised learning
    algorithms.


    ##  Deep learning.


    Deep learning involves neural networks composed of many hidden layers that are
    continuously adjusted, one by one, to reflect real-world sensory data, as if adjusting
    a simple feature detector. The learning process allows the training data to be
    taken from many high-dimensional vectors to decrease computational complexity
    and perform the task more efficiently.


    ##  Neural networks.


    Typically, a neural network consists of a number of layers in which each layer
    can be called a neuron, and a linear controller that allows neurons to send and
    receive messages to one another called an input and an output layer. Neural networks
    are typically fed training data for which the weights of the network are learned
    such that each layer then can generate an output which is a vector of values.
    The outputs are fed to the next layer, which will modify them based on the previous
    weights and the current training data. The next layer will feed the outputs to
    the next layer, and so on. The layers of the network can overlap. The layers are
    typically added up into a multi-layered network.


    ##  Sparse neural networks.


    For some problems, the general approach of deep learning will not be sufficient,
    and another way is required to solve it. This approach involves training the network
    with different numbers of hidden layers with an approximation of the inputs and
    output to come up with a network that is more appropriate. Typically, the input
    and output values for a layer are multiple. The sparse network has some features,
    called features, distributed over the parameters of a layer. These features are
    small and are often multiple of the features in the layer being trained.


    ##  Matrices


    A matrix is an array of numbers that looks like a column and row. This column
    and row give the shape of the row-column axis in which each element is called
    a vector. Matrices are of two types: global and local. The global matrix contains
    all the elements in a training data set and the local matrix contains only those
    elements that are in the training data set. This way, each element in a matrix
    is treated as a node in a directed graph.


