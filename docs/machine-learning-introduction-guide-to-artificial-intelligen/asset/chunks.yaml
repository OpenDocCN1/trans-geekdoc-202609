- raw: 'There are other options, including fast.ai, which offers a business-level
    product with the monthly subscription fee, and it also offers versions of the
    software that you can download and use in your own environment. One of the big
    selling points for fast.ai is that it provides training models to use in your
    application, and it can also support both Python and R, so there are a variety
    of options available for getting started with machine learning for free.


    ##  Building a machine learning service


    For building an end-to-end service that can deploy machine learning models to
    multiple users, it’s usually a good idea to use the services offered by one of
    the big cloud providers. The two main cloud providers that provide this service
    are Amazon Machine Learning and Google Cloud.


    Amazon Machine Learning is aimed at developers who want to do simple things such
    as building a simple natural language processing system that can be deployed and
    configured in minutes, and Amazon has partnered with a range of organizations
    to help it provide users with other machine learning services as well. The good
    news is that it’s available to developers as a toolkit. Once you’ve installed
    it, you can download the source code from Github, and you can run it locally on
    your own machine, and from the command line, and also from Amazon’s cloud.


    The Amazon Machine Learning Service, or AML, is a compute service that can be
    launched from an AWS console, and it can be used to create a cluster of AWS EC2
    instances, for training and running machine learning models, as well as doing
    other machine learning workloads. AML is aimed at developers who are building
    simple solutions to specific problems, but Amazon is also experimenting with other
    use cases, including how they can use AML to provide specialized services to users.


    Amazon has introduced a developer preview for the upcoming AWS Advanced Machine
    Learning service, which will be launched in Q2 2018. You can find out more about
    the AWS Advanced Machine Learning preview here. AWS has also been experimenting
    with the API for Amazon Machine Learning, which you can use to create machine
    learning models, or you can use the API to get other AWS services to work with
    machine learning models, as well as to generate analytics on the models themselves.
    This API is still in preview, but you can request access by signing up for the
    beta here.


    Google Cloud Machine Learning, or GCR, is a free service, with many different
    pre-configured machine learning models that can be deployed in the cloud. The
    pre-configured models, created by Google’s developers, come in three categories:
    reinforcement learning, deep learning, and training. The Google Cloud Platform’s
    ML API is available on GitHub, and you can download the source code from the repository,
    and then run it in a virtual machine on Google’s cloud. You can find the code
    on GitHub here.


    The Google Cloud Machine Learning service is part of Google’s commitment to making
    it easy for developers to create applications that run on the Google Cloud Platform,
    whether it’s using machine learning models or other kinds of machine learning
    systems. If you’re interested in using Google Cloud Machine Learning, you can
    sign up for the free tier here, and you’ll be able to download the code from the
    Google Cloud Platform and install it locally on your own machine.


    ##  Making predictions, or making predictions?


    There’s more than one way to make predictions, and it’s possible to do this with
    either one of these tools, or with many other methods too. In most of these cases,
    a prediction is simply a prediction about the future. In fact, what you’re actually
    doing is making predictions about the present.


    The earliest human endeavors at making predictions were probably about how many
    eggs a chicken would lay, or when the weather would change. These predictions
    were probably based on observing the behavior of the animal. When the weather
    changed, and the chicken didn’t lay as many eggs as the day before, humans might
    have tried to predict if that was a temporary fluctuation in the behavior, or
    if it would be a continuing trend.


    This is probably how many early scientists got interested in the behavior of humans.
    Were we going to do anything on the weather? Would the weather affect our behavior?
    Would the behavior affect the weather? Some of the more dominant animals might
    have been able to give us some predictions. Were they going to lay fewer eggs?
    Were they going to have a lot of eggs? So it was natural to try to observe people
    see what their behavior was like, to see if these prediction models were valid.


    Predictions are actually simple in the way that they can be represented: they
    are made of either numbers or words. A number can be something like 1, 2, or 3.
    A word can be an adjective, noun, or verb.


    Sometimes there’s a question of how to represent a number or a word. Does it have
    to be an integer? Can it be a floating-point number? Can it be a symbol? Can it
    be a bit? How do you represent words if you don’t know how to write them down?
    As a result, we can model numbers with binary bits and words with Unicode characters.


    It turns out, we can’t model words using only numbers or symbols. Sometimes you
    can’t write the words down, or you can only write them in certain shapes, and
    if you want to say what it means, you’re going to have to do a bit of math. What
    if you want to say that it means “people''''? Well, it’s only one symbol, and
    it’s got two parts: it has an upper and lower case letter “e” in it, so it can
    mean “people” or “at” or it can also mean “in”. You need a little bit of math
    to figure out the binary values of the letter.


    This is where machine learning comes in: you’re going to say, “I’m going to have
    to use a machine-learning algorithm to model the word ‘people because it has both
    upper and lower case letters, and it has a ‘b’, so it means a thing that’s ‘in’,
    and it has an ‘a’, so it means ‘people’.” In many cases, the number of variables
    you have, and the complexity of the problems that you’re tackling, you’re not
    going to be able to model this all by hand. You’re going to need a computer. This
    is where machine learning comes in.


    In machine learning, we use software programs to process data and make predictions.
    You input a set of data, say the sounds produced by speakers who are reading a
    passage in a book, and the program tries to predict the next sound to be made.
    You input another set of data, maybe the responses of people who are watching
    a movie trailer, and the program makes a prediction about whether you should rent
    or buy the movie. These programs, you could call them algorithms, can take information
    that’s supplied by humans and make predictions that humans can’t make.


    What you want is a program that can predict correctly, given the data that you’re
    inputting, the sequence of steps that you’re taking. You have a bunch of data
    that’s not already fitted, and you want a program that can make predictions based
    on new information, based on the future, based on the future of other things that
    are going to occur.


    In the early days, we used just the standard strategies of regression, classification,
    clustering, and so on. We used these strategies for image recognition, speech
    recognition, and so on. The ideas behind these algorithms had been around for
    a long time. They’ve been around since at least the 1950s, maybe earlier.


    Now, a lot of these algorithms were using fairly basic math. How could we do better?
    Well, one way to do it was to use neural networks. These are networks that take
    information that’s received by the sensors and gives it to some other part of
    the brain, which is actually a computer, and that part of the brain does all of
    the hard math, decides what the best predictions are, and then feeds it to the
    network. It’s sort of a parallel processing approach that makes it possible to
    do these things in ways that are much more complicated than traditional algorithms.'
