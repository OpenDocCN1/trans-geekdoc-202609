    为了构建一个可以可以将机器学习模型部署到多个用户的端到端服务，通常使用大型云提供商之一提供的服务是一个好主意。提供此服务的两个主要云提供商是 `Amazon
    Machine Learning` 和 `Google Cloud`。


    `Amazon Machine Learning` 面向想要执行简单任务的开发者，例如构建一个可以在几分钟内部署和配置的简单自然语言处理系统，Amazon
    已与一系列机构合作，帮助它为用户提供其他机器学习服务。好消息是，它以工具包的形式提供给开发者。一旦你安装了它，就可以从 `Github` 下载源代码，并在你自己的机器上本地运行它，也可以通过命令行运行，还可以从
    Amazon 的云端运行。


    `Amazon Machine Learning Service`（简称 `AML`）是一种计算服务，可以从 `AWS console` 启动，并用于创建
    `AWS EC2` 实例集群，以训练和运行机器学习模型，以及执行其他的机器学习负载。`AML` 面向那些为特定问题构建简单解决方案的开发者，但 Amazon
    也在尝试其他用例，包括如何使用 `AML` 为用户提供专门的服务。


    Amazon 为即将推出的 `AWS Advanced Machine Learning` 服务引入了开发者预览版，该服务将于 2018 年第二季度发布。你可以在这里找到更多关于
    `AWS Advanced Machine Learning` 预览的信息。`AWS` 还在对 `Amazon Machine Learning` 的 `API`
    进行实验，你可以使用它来创建机器学习模型，或者使用该 `API` 让其他 `AWS` 服务与机器学习模型协作，并对模型本身生成分析结果。该 `API` 仍处于预览阶段，但你可以通过在此处注册
    Beta 版来请求访问权限。


    `Google Cloud Machine Learning`（简称 `GCR`）是一个免费服务，包含许多可以在云端部署的各种预配置机器学习模型。这些由 Google
    人员创建的预配置模型分为三类：强化学习、深度学习和训练。`Google Cloud Platform` 的 `ML API` 可在 `GitHub` 上获取，你可以从存储库下载源代码，然后在
    Google 云上的虚拟机中运行它。你可以在这里在 `GitHub` 上找到这些代码。


    `Google Cloud Machine Learning` 服务是 Google 承诺的一部分，旨在让开发者轻松创建运行在 `Google Cloud
    Platform` 上的应用程序，无论是使用机器学习模型还是其他机器学习系统。如果你对使用 `Google Cloud Machine Learning`
    感兴趣，可以在此处注册免费方案，你就可以从 `Google Cloud Platform` 下载代码并将其安装在自己的本地机器上。


    ## 进行预测，或者，进行预测？


    预测有多种方法，你可以使用这些工具中的任何一个来实现，也可以使用许多其他方法。在大多数情况下，预测仅仅是对未来的一种的一种推测。事实上，你实际上在做的是对现状的预测。


    人类进行预测的最早尝试可能是关于母鸡会产多少个蛋，或者天气何时会变化。这些预测可能基于对动物行为的观察。当天气变化，母鸡产的蛋没有前一天多时，人类可能会尝试预测那是行为的暂时波动，还是会成为一种持续的趋势。


    这可能就是许多早期科学家对人类行为产生兴趣的原因。我们会对天气做些什么吗？天气会影响我们的行为吗？行为会影响天气吗？一些占优势的动物可能为我们提供一些预测。它们产的蛋会减少吗？它们会有很多蛋吗？因此，尝试观察人们看看他们的行为是什么样的，看看这些预测模型是否有效，是很自然的。


    预测在表示方式上实际上非常简单：它们由数字或单词组成。数字可以是像 `1`、`2`或 `3` 这样的。单词可以是形容词、名词或动词。


    有时存在如何表示数字或单词的问题。必须是整数吗？可以是浮点数吗？可以是一个符号吗？可以是一个位（bit）吗？如果你不知道如何写单词，该如何表示单词？结果，我们可以用二进制位对数字建模，用
    `Unicode` 字符对单词建模。


    事实证明，我们不能仅用数字或符号对单词建模。有时你无法写下单词，但你可以通过特定的形状来写它们，如果你想表达它们的含义，需要进行一些数学计算。


    这就是机器学习的用场：你需要使用机器学习算法来建模“人类”，因为它包含了大写字母和小写字母，并且包含了 `b`（意味着 `in`），还包含了 `a`（意味着
    `people`）。在许多情况下，你拥有的变量数量以及你正在解决问题的复杂性，让你无法手动进行建模。你需要计算机。这就是机器学习的用场。


    在机器学习中，我们使用软件程序处理数据并做出预测。你输入一组数据，例如朗读书中的章节时发出的声音，程序尝试预测下一个声音。你输入另一组数据，例如人们看预告片时的反应，程序对你应该租赁还是购买该电影做出预测。


    你想要一个根据你输入的数据、所采取的步骤来做出正确预测的程序。你有一组未拟合的数据，你想要一个根据新信息、未来以及其他可能发生的情况做出预测。


    在早期，我们只使用标准的回归、分类、聚类等策略。我们把这些策略用于图像识别、语音识别等。这些算法背后的思想已经存在了很久。它们至少从 20 世纪 50 年就开始存在了。


    现在，许多算法使用的是相当基础的数学。我们如何做得更好？嗯，一种方法是使用神经网络。这些网络接收传感器接收的信息传递给大脑的其他部分（实际上是一个计算机），大脑的这个部分执行所有的复杂的数学计算，决定最佳预测结果，然后将其反馈给网络。这是一种并行处理方法，使得以比传统算法复杂得的方式来实现这些事情。

    '
