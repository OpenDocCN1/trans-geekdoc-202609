- raw: 'Predictive monitoring tools can also be used to analyze the performance of
    application connections and traffic flows. For example, in the data center, it
    can be used to identify specific servers that are experiencing slow response time
    to remote IP address ranges, as well as identify where some of the anomalies occur.


    After identifying the anomalies, the system can determine what service is causing
    the errors, isolate the problem, and correct the problem before it adversely affects
    another site. This also helps to prevent latency problems and inter-site network
    congestion, which are some of the most common issues that cause performance degradation.


    ##  What is PaaS (platform as a service) and why should I care about it?


    The term PaaS describes a set of services that are delivered via a centralized
    infrastructure. These services provide developers with infrastructure that they
    can develop, test, and deploy their applications on. Some examples of these services
    are application services, object stores, database services, and load balancers.


    PaaS services typically have well-defined policies for how they handle security,
    redundancy, and disaster recovery (DR). They provide dedicated resources, typically
    CPUs and RAM, to the developers, so that they can develop and test without slowing
    down the servers that the servers are running on.


    PaaS services have well-defined tools, which reduce the amount of time and effort
    developers must invest in setting up their applications. These tools automate
    much of the effort that the developers would otherwise spend maintaining, building,
    and testing their applications.


    PaaS is often called a foundational service because it enables developers to access
    the necessary infrastructure and tools they need to build and deploy their applications.
    It also offers visibility into the operating environment that developers need
    to build their applications.


    ##  What are continuous integration (CI) and continuous delivery (CD) and why
    should I care about them?


    Continuous integration and continuous delivery are often synonymous, but not all
    the time. While CI does refer to a continuous flow of code, but it does not always
    mean continuous deployment.


    Generally, continuous integration can be performed at all phases of the development
    process. It works by merging builds into an immutable repository. The developers
    can then commit the resulting code and testing can be performed immediately. These
    results are integrated into the version control system, or version control system,
    and can be promoted to a production release.


    CI is typically used when a developer creates a branch on the repository where
    she or he plans to test the latest version of the code. Once this code has been
    tested, it can be merged back to the master branch, which the developers use for
    committing changes to the overall source code. This is called continuous integration
    and it acts as a catch-all to allow developers to integrate testable code into
    the repository and helps to ensure that bugs are not introduced while development
    is still in progress.


    Continuous delivery is essentially a pipeline that is used to streamline the delivery
    of new code. Typically, a new application is released at least a few times each
    day, sometimes multiple times per day, to a server. It is this continuous delivery
    that is most often used to implement continuous delivery.


    ##  What is API management and why do I need it?


    API management is a branch of application management. It’s the practice of managing
    the APIs that clients need to consume, both externally to clients and internally
    to the enterprise. API management typically involves a mix of centralized/mobile
    apps, and on-premises apps. While API management is not a new practice, it has
    gained more attention as it relates to building digital services in the cloud.


    A centralized, mobile-friendly approach to managing applications and services
    via APIs allows companies to provision and manage APIs through a single vendor,
    saving a significant amount of development time. The centralized approach also
    makes it easy to integrate the API into existing applications or automate new
    use cases through automated code execution.


    ##  What is API testing?


    API testing refers to an approach in which the end-to-end user experience (EUX)
    of an application or service can be tested. This UX test involves simulating the
    use of an API to assess its user experience. API testing is a key element of digital
    transformation. It also enables organizations to scale and integrate APIs.


    Let’s have a look at some of the advantages that API testing offers:


    ●     It helps developers in integrating APIs and tests the application’s performance
    with a single code base.


    ●     It allows developers to prepare for end-to-end test scenarios and test end-to-end
    apps without affecting the production code.


    ●     It helps organizations ensure the performance of applications during deployment
    to a cloud.


    ●     It helps developers understand how an API can be integrated into an application,
    or how the API can interact with external systems.


    ●     It helps developers understand how to prepare an app for production, or
    how to resolve certain issues that arise during development.


    ●     It provides the ability to test the APIs of multiple languages and frameworks,
    by providing the ability to execute integration tests in one package.


    ##  How is API testing best suited for an API manager?


    API management can be used to deploy an API, or as a hybrid approach that includes
    both deployment and API testing. An API Manager is a vendor-neutral third-party
    organization that can bring together API management with APIs and tests automation
    technologies. They do this by providing a platform that can be used by developers
    for testing API integration, handling API licenses and license renewal, and also
    automatically creating releases. The platform can be used as an agile system to
    manage cloud integrations and build and release on a continuous basis.


    ##  What kind of testing do you think needs to be done?


    Digital transformation requires digital services. We call these services "apps".
    What makes a service "truly" a digital service is that it also has some form of
    API built-in to it. These APIs are usually very complex and fragile but are critical
    to delivering a smooth end-to-end experience.


    The problem with digital services is that many of them are just test apps that
    don''t use their APIs effectively, and don''t even test how they interact with
    one another. What''s needed is a more intelligent test, but to do this you need
    to understand how the different parts of the service interact, and how to test
    how these interactions are exposed to a client.


    If the testing is only done manually, then you will have a manual test plan that
    must be reviewed and the app and dependencies tested separately. This results
    in a big volume of manual effort. A test plan that covers all the combinations
    of dependency mapping and integration testing is called an integration test plan.
    This is a hard task to achieve and, with a very high time cost.


    With an automated API testing system, you can instead test the entire application
    pipeline in one suite, thereby reducing the time and resources needed for testing.
    This makes it easier to integrate more applications and develop new ones. In addition,
    API tests provide better insight into how the whole application works. This enables
    you to find bugs that may have been missed manually. The integration tests also
    prevent bugs that may have not been found because of the manual effort.'
