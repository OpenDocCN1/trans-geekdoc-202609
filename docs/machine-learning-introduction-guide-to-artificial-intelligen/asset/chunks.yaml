    数值学习是一种用于估计寻找最优解所需样本量的统计技术。用于评估数值解质量的定量衡量标准被称为数值近似比率（ANR）。这个 `ANR`（读作“anno”）是算法必须求解的似然函数与样本量之间的比率。由于评估的是
    `ANR`，因此数值解被称为“校准近似解”。为了创建校准，算法必须知道 `ANR`。


    在统计学习中，`ANR` 提供了关于单个样本质量的信息。例如，如果 `ANR` 为 3/5 且考虑了三个示例，那么可以得出 `ANR` 有很大可能是 3/5。然而，如果
    `ANR` 为 10，这个信息就没太大意义；相反，人们想知道随着考虑的样本的增加，`ANR` 的表现如何。在数值情况下，这显而易见：`ANR` 仅仅是有限样本数（例如
    `n`）与样本量（例如 `n * 3`）之间的比率，或者是为了找到问题的解决方案而必须求解的优化实例的数量。


    ## 什么是逻辑回归？


    逻辑回归是一种在机器学习中广泛使用的统计模型。与许多机器学习算法一样，逻辑回归基于贝叶斯模型。在这个模型中，目标函数由一个名为“logistic”函数描述，该函数估计在给定一组数据的情况下假设的概率。在最形式的形式，逻辑回归的似然函数可以写为：


