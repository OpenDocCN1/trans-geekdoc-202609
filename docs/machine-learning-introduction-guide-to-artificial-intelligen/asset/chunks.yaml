- raw: 'Google DeepMind''s groundbreaking work with Atari was also used to help protect
    Wikipedia from cyberattacks. Researchers in 2015 were able to remove the text
    on Wikipedia pages and replace it with background images, with the new images
    changing in real-time as people view the page.


    ##  Data structures in machine learning.


    Mislabelling as fast as possible is key to achieving good training quality. It
    is used for clustering on data points which are assigned to a label A or B. In
    practice we assign labels for various purposes, either to classify data or for
    cross-validation. Training of most models can be greatly improved by applying
    a technique called transfer learning.


    Instead of computing the function we are really trying to learn, we attempt to
    obtain a function from a given function that is somewhat different. For instance,
    if we are trying to compute the gradient of a function we simply modify the gradient
    by an exponentially increasing function, which is just a list of the parameters.
    The function gets trained this way by choosing the best of three candidate functions,
    where each candidate is a parameter of the model we are trying to learn. We adjust
    the parameters for each candidate and repeat until the parameters get trained
    to converge. This process can be shown to converge when the distance between the
    best learning function and a trained one is minimized.


    A classic example of this concept is the learning of clusters for image processing,
    see “Clustering Learning from Deep Belief Networks”.


    The standard approach for training a neural network is to draw features onto the
    training data. For the first stages of training, the training data is depicted
    as a simple line. If the training data is quite sparse, training the network requires
    a lot of computing time. However, on the other hand, if the training data is large
    the computations become more expensive, especially if the network gets stuck on
    the training. To reduce the cost, we define a regularization term to a function
    that takes into account the amount of training data. In the standard approach
    the regularization takes into account a fixed cost, that is the cost of the gradient
    descent function, because it is pretty easy to compute in practice. We will see
    the effect of the regularization term in the next sections.


    ##  Examples of supervised learning.


    In supervised learning, we can also define a measure that tells us whether the
    observed difference between the predicted label and the observed label is large
    or small. For instance, imagine we have a model A that predicts whether a given
    real number is positive or negative, and another model B that predicts whether
    the given real number is positive or negative.


    Let’s assume that we want to predict whether the number is above or below a certain
    threshold. In general, the higher the number is above the threshold, the more
    likely the number is to be above the threshold, and the lower the number is below
    the threshold, the more likely the number is to be below the threshold.


    We would like to train a model to predict whether the number is above the threshold
    (or to predict whether the number is below the threshold). We would also like
    to know how to choose a number above or below the threshold. We will call this
    parameter as the parameter of the model.


    For a training stage, we take a sample from the training data and feed it to the
    model. If the prediction of the model is above the threshold, then we subtract
    the average of the mean and the variance of the sample. This gives us a predicted
    number below the threshold, and a predicted number above the threshold. If the
    predicted number is above the threshold, then we take a sample from the training
    data and feed it to the model. If the prediction of the model is below the threshold,
    then we take a sample from the training data and feed it to the model. As we can
    see, in the above equation, the mean and the variance are the single, respectively,
    normalized values of the predicted number. We also need to take the derivative
    of the function and turn it into a scalar, so that the estimated parameters of
    the model are unique. This is called autoencoders and is a subcategory of deep
    learning.


