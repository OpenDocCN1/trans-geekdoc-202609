    ## 描述

    ### 为什么要学习大数据和机器学习？


    机器学习允许你自动化人类的思维和体力劳动。因此，`ML` 被搜索引擎、银行和保险公司、零售业、移动运营商、工业企业、广告和营销机构使用。


    机器学习模型比人类专家更准确、更快地做出预测并识别模式。例如，银行使用 `ML` 模型计算每个特定借款人诚信还贷的概率。此外，如果专家分析一个客户需要几分钟，模型可以在几秒钟内为数百万客户做出预测。


    机器学习是一种自动构建分析模型的数据分析技术。它是人工智能的一个分支，其基础是系统可以从数据中学习、识别模式并在极人工干预的情况下做出决策。


    得益于新的计算技术，今天的机器学习与过去不同。它诞生于模式识别以及计算机无需编程为执行特定任务即可进行学习的理论；对人工智能感兴趣的研究人员想知道计算机是否可以从数据中学习。机器学习的迭代特性非常重要，因为当模型接触新数据时，它们可以独立地适应。它们从之前的计算中学习以获得可靠、重复的解决方案和结果。这不是一项新科学，但它获得了新的动力。


    但如果你了解机器学习，你就可以成为一名 AI 运营师甚至是创造者。开始只需要想象力。


