- raw: 'With application architecture being a key issue in today’s digitally enabled
    world, any organization that wants to stay ahead must realize that digital transformation
    is not an end in itself. Instead, it is a way of bringing together all the other
    components of the organization to provide an incredible user experience. This
    means being able to connect the system layer, the business layer, and the technical
    layer. Only through this level of engagement can you reach all the people, systems,
    and processes involved.


    ##  What is a platform?


    Platforms are an enabler for digital services. They help organizations to connect
    all the layers of an application. This includes the network layer, the business
    layer, and the technical layer. This enables developers to build on the back of
    them. Once the platform is set up, API testing can be easily automated and thereby
    help in the development of new products and services.


    The benefits of a platform are many: it helps with the development of new applications,
    it helps to develop new revenue streams, it helps to maintain existing products
    and services, and most importantly, it helps in the ability to do continuous delivery
    of quality products and services to the customers.


    ##  How can developers benefit from an API testing system?


    An API is a digital interface with the outside world. It can be used to exchange
    data or control access to the software or the API. In the case of an API system,
    there can be many services. An API can be a front-end service that supports accessing
    a back-end service, or it can be a back-end service and a front-end service. With
    an API, a developer can create a "layer of services" that can be accessed from
    different layers of an application.


    API testing helps developers develop applications by exposing how an API, along
    with its components, interacts with one another and exposes the data on which
    they are dependent.


    ##  How can API testing help a developer implement and test new applications?


    An application developer has a number of digital services that can be combined
    to build new products and services. A comprehensive testing scenario helps developers
    ensure that the software layer on which their products and services depend is
    functioning properly.


    API testing helps developers write test cases to expose how an API, along with
    its components, interacts with one another and exposes the data on which they
    are dependent.


    A testing scenario helps developers to specify the kind of problem they want to
    address and to specify the system, data, and technical components that have to
    be tested and reported on. Tests help to ensure that the API is compatible with
    the system, that the data and the required commands are available in the interface,
    and that the commands are correctly executed. API testing also helps to ensure
    that the requests to the API conform to the specifications given in the API. The
    testing scenario helps to identify possible changes or faults and how to remedy
    them.


    As the number of services that can be served from an API increases, the ability
    to test them has to increase along with it. API testing allows the testing of
    multiple services and ensures that the use of service is safe.


    An API provides a platform for many business processes and value-added features
    such as alerts, notifications, notifications to incoming calls, messaging, and
    so on. Through an API, developers can create apps that act as gateways for accessing
    multiple applications.


    In a nutshell, API testing has an impact on an organization''s ability to develop
    new products and services, innovate by allowing them to reach out to the world
    with new and improved products and services, or to ensure that existing products
    and services are robust enough to cater to changing market needs.


    #  Сhapter 3 How to use machine learning?


    The technology behind machine learning has been around for years now, but it has
    only recently become more accessible to many developers thanks to great improvements
    in computing, and the creation of open-source software like Apache Spark. The
    MLLib library from Jupyter allows you to build algorithms in Python and deploy
    them into your code.


    Training, for instance, involves training a machine learning model by feeding
    it lots of data, and assessing how well it works with it. Once a model is trained
    and ready for deployment, you can then implement it in your code by integrating
    it into your application or connecting it with your backend. The MLLib library
    does all of the hard work for you by making all of the pieces of the model visible
    and available within the Jupyter environment. You can see and adjust the data
    models through the data interpretation module, and run the model through any of
    the evaluation functions. For the model evaluation function, you can choose to
    evaluate either the error, average accuracy, precision, or predictability, and
    you can do all of that in the interactive viewer from within your Jupyter notebook.
    For code to deploy a model to your codebase you need to tell the computer to ‘run’
    the model, and also install and configure some pieces of code. The library has
    a number of examples that you can use to get started, and those are both well
    documented and easy to follow, so this should not be too daunting of a task for
    any budding developer.


