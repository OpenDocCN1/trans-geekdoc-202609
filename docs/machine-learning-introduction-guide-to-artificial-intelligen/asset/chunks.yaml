    features, add more layers of analysis, change the data types, or even make the
    model more performant by refactoring the code to use parallelization techniques.
    The whole point of machine learning is that the better the model performs, the
    more valuable it becomes, and so if you make your model perform better you stand
    a much better chance of getting good data, a good model, and a positive return
    on your investment.


    ##  Building machine learning applications


    If you are going to build an application that incorporates machine learning, then
    you need to decide whether you want to build it in-house or buy it. Although the
    terms are often used interchangeably, in this case, I am talking about owning
    the underlying machine learning software, rather than the standalone products
    that are in the cloud. If you choose to buy the actual machine learning tools,
    then the typical options for machine learning are Apache Spark, TensorFlow, or
    Caffe.


    Apache Spark is, of course, an open-source library. It is licensed under the Apache
    License, which means that developers can freely redistribute it and modify it.
    You can find out more about the advantages of being an open-source contributor
    here, and a good overview of Apache Spark’s basic use cases here.


    Caffe is a standalone product. It’s released under the same terms as Apache Spark,
    and available as a Python package, and so you don’t need to have Apache Spark
    installed on your machine in order to run it. It comes with a variety of pre-trained
    models, as well as many more models that you can build yourself by combining Spark
    and Caffe. The commercial version of Caffe also has the benefit of having a large
