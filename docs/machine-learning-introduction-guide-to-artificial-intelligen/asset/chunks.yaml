    ##  Trends in big data analytics


    While big data is gaining a lot of momentum in the market, there is a need to
    provide analytics capabilities to the data. To provide the analytics capability,
    the vendors will focus on enhancing the capabilities of the data warehouse and
    data lake tools to provide a variety of advanced analytics capabilities such as
    predictive modeling, classification, regression, and time series.


    To provide advanced analytics capabilities, the big data tools and platforms will
    need to be interoperable and flexible. Big data platforms will be built with a
    variety of analytic techniques that will allow the platform to integrate with
    the enterprise systems and data lakes.


    The capabilities of the big data tools and platforms will depend on the advanced
    analytics that will be embedded into them. The software will need to be flexible
    enough to adapt to the needs of enterprises and will be built with open APIs that
    can be consumed by different applications and devices.


    ##  Trends in data integration


    The integration of big data technologies and platforms with the existing enterprise
    systems and data lakes will become critical for success. To meet the need for
    integration, the vendors will be focusing on providing seamless integration of
    different platforms and tools in their big data platforms.


    This will ensure that different platforms and tools can be easily integrated and
