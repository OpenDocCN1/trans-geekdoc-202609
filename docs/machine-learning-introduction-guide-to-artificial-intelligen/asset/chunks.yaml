    ## Classification


    Classification is the process of identifying the characteristics of objects based
    on individual objects. It is a relatively simple process as most of the objects
    are well-defined and can be classified. The easiest way to classify objects is
    to try to identify each object using a predefined set of attributes or characteristics.


    For example, you may use a set of nouns to classify your photos by a beach or
    a sunset in a particular area. Similarly, if we wish to classify objects in an
    image, we may classify them as red or yellow by using colors. All objects are
    assigned a color and labeled. In other words, each object is viewed in isolation
    and classified accordingly.


    Classification has several advantages including:


    - It helps in determining the separation of objects in a given scene

    - It can be used to determine if two objects belong to the same category

    - It helps in determining how an object in an image is related to other objects
    in the image

    - Each image may be given a score to classify it according to the above-mentioned
    factors


    ## Distributional Features


    In most cases, the classification is based on a set of characteristics. This approach
    is called classifying the image by a given set of features. It is a widely used
    machine learning technique, however, it is not the most accurate as the image
    does not need to be labeled properly. For example, a 10-year-old boy can be easily
    classified as a boy, but it is inaccurate as to how to label other children at
    the same age.


    Distributional features are used in object classification and often involved in
    regression. For example, if a picture is classified as an office, based on the
    presence of a desk, and then a comparison with other office pictures, the classification
    is useful. It helps in showing the extent of specific attributes. A classification
    by feature is then a regression which is a form of classification by hypothesis.


    ## Regularization


    When building Machine Learning models, we need to know how to build our models
    in a regularised way. Regularisation refers to lowering the degrees of freedom
    to improve the classification quality. As all models are based on the assumption
    that the classifier will fail if given examples of an undesired class. In this
    model, the classifier can be adjusted to never fail even if the data is really
    noisy.


    Many sources like Stanford Learnings list the various regularization techniques.
    The amount of regularization required depends on the class you are trying to predict.
    It also depends on the accuracy of the classifier and the signal-to-noise ratio.
    The goal here is to define a model that works well on small data, thus, you should
    try to design and set the regularisation factors that are appropriate for your
    application.


    ## Feature Selection


    A model based on classification with some other functions can also be called an
    AI system. Usually, the model will contain additional features which are used
    in the evaluation of the model. The features which are considered for feature
    selection are the ones that affect the results of the classification. The features
    are typically classified as:


    - Probabilistic - It includes the features which can change from one class to
    another

    - Decisional - These are relatively stable, hence, they are expected to have a
    small change in class even if the data is noisy


    ## Modeling


    Once a model is built, the next step would be to test it in the training data.
    The training data is made up of one or more problems that have to be solved in
    the model. For example, our classifier for selling bus tickets will require the
    features of an image that shows a bus ticket. Once we have the training data,
    we can evaluate the performance of the model based on the standard deviation of
    the predictions.


    There are four steps that need to be followed to build a model.


    - Step 1: Generate a set of data, both from within and outside the class.

    - Step 2: Define the model, which can perform the task by creating a value, which
    is a label for each sample.

    - Step 3: Train the model using the data and evaluate its performance.

    - Step 4: After the training, you can find the class labels in the observations.


    This process can be done by using a statistical technique called `Singular Value
    Decomposition (SVD)`. However, if you are working on a very large dataset, then
    you can divide the data into smaller sets of data and repeat the process.


    Machine Learning models are used in many domains of science. Learning of classifications
    with different types of algorithms and data is always the goal of these models.


    Till now, you must have been able to classify some data correctly. The ability
    to classify a new set of data is called Assignment.


