    此外通过对模型进行微调，我们对每个样本进行大量的处理，因此，可能同时使用连续变量和分类变量。分类变量通常是连续变量的良好预测器，但对于连续模型，结果的预测值是整个数据集。然而，在强化学习方法中，分类发生在模型中。因此，我们需要运行模型多次（一次迭代）以获得数据集的预测。然后，我们将预测结果转换为分类形式。


    在实践中，这需要对执行两次转换。我们需要将结果转换为分类形式，然后对结果进行预测器比较，如果有的话。


    ## 强化学习方法是如何工作的？


    [content]

    在强化学习中，我们使用环境的虚拟模型并运行模型直到达到阈值。然后，我们将性能得分作为输入应用于输入层。然而，这些信息在基础层是不可用的。因此我们需要对其进行转换。


    我们定义特定的状态，例如 `CUBE` 的左上角，并运行模型直到达到指定的阈值。这就是为什么我们需要运行模型多次（一系列迭代）以获得最终得分。然后，我们将预测结果转换为分类形式，并将其用于预测。


    ## 这在基于事件的神经网络中是如何发生的？


    [content]

    这发生在双层神经网络中，第一层是概率空间。也就是说，它记录了基于当前输入的结果可能的概率。网络的输出是另一个代表最终输出的概率空间。


    然而，在强化学习方法中，我们需要能够将当前输入转换为相应的输出，而无需反复运行模型。因此，我们需要一个二级分类器将输入转换为相应的输出。如果输入可能是特定的输出，我们再次运行模型。然而，如果输入可能不是特定的输出，我们再次运行它。这就是为什么我们使用二级分类器。


    这里有两个巨大的挑战：将概率转换为输出，以及将输出转换为输入向量。概率空间（又称模糊逻辑）可能如下：


    然而，从逻辑的角度来看，这非常繁琐，并且并不容易转换为可用于神经网络的语言。然而，我们仍然可以将概率空间转换为概率密度函数，然后可以将其编码为神经网络内部的核（或其平滑版本）。


    此外，我们可以添加一些转换。我们可以更改为每个输出所保留的概率权重，使得神经元的输出是输入中所有神经元的输出之和。我们还可以在输入和输出之间添加步长或损失函数。

    [/content]


    # 第 5 章 大数据


    ## 什么是大数据？


    [content]

    大数据指的是以数字形式存储的海量信息。从理论上讲，数据可以处理的内容以及访问这些数据的地方应该是无尽的。跨应用程序共享的大量信息，以及云端的访问和存储需求，创造了一个巨大的未处理数据宝库。全球每天产生的信息中至少有一半从未被使用，导致了全球监控鸿沟。


    不仅数据量正呈指数级增长，分析这些数据点的能力也未能跟上。由于计算系统中的可用核心和显卡数量没有限制，分析数据所需的处理能力已指数级增加。


    虽然目前的工具允许将分析大量数据的成本分摊到大量数据上，但新模型（如学术界开发的模型）已成功地将昂贵的计算能力与廉价的数据处理基础设施相结合。


    大数据将改变我们与数据交互的方式。它将为个人提供比以往任何更好的信息访问。它将允许企业创建准确的预测模型并发现新的市场机会。访问和利用海量信息的能力将创造新的业务模式和服务。

    [/content]


    ## 准备工作


    [content]

    大数据具有转型行业的潜力，因此，我们的政府、教育机构和公民社会了解其潜在益处并理解其可能带来的威胁是至关重要的。


    为大数据做好准备意味着意识到它提供的机遇，并理解它将带来的挑战。这需要公司意识到，为了充分利用机会，他们需要采取行动。一些工作已经在进行。例如，在 2015
    年，`IBM` 和国家安全中心制定了英国的大数据战略。


    然而，由于还没有大数据的监管机构，“大数据”的概念在英国尚未被完全定义，政策制定者和行业尚不确定它将影响业务和社会。这种不确定性产生了“数据沙漠”这一术语。政府尚未就如何应对不断变化的法律制定指南。

    '
