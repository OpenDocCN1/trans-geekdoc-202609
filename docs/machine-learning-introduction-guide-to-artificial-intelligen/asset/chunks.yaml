    通常情况下，逻辑回归将使用其基于模型选择找到的逻辑函数。模型选择是统计学的一个分支，描述了如何选择最佳假设或模型，以构建出参数的最优估计。在参数独立的简单模型中，这可能涉及从大量可行函数中选择似然函数并计算
    .。似然函数的选择受成本函数的限制，该成本函数指定了人们愿意在多大程度上增加数据的似然性（这将影响 ）。该成本函数可以通过对偶方程来描述：


    ## 训练中的逻辑回归拉格朗日乘子


    对于回归问题，最重要的超参数之一是数据点的数量。在训练时，人们自然想要仅使用这些数量的数据点找到最佳参数。然而，这往往会导致估计质量很差；使用更大的训练数据以减少过拟合的可能会更好。


    这种公式被称为训练中的逻辑回归拉格朗日乘子（LR-LMIT）。


    在训练时，`LR-LMIT` 通常设置为数据点的数量。如果数据点足够多，`LR-LMIT` 在训练数据上具有二次或更高的误差，而将其设置为较小会导致准确率大幅下降。`LR-LMIT`
    在优化参数和 . 也起着重要作用。在许多情况下，`LR-LMIT` 是对数据的“最优”拟合，成本函数使用 `LR-LMIT` 定义。然而，这种通用形式是有歧义的，因为通常不清楚它是否对应于数据的最优拟合。


    虽然机器学习中的大多数优化方法使用通用公式 ，但已经开发了三种用于优化的特定公式。这些通常被称为交叉验证 (CVC)、标准模型 (SM) 和 CVC/SM
    混合模型 (CVC-SM)。`CVC-SM` 具有数值严谨且对广泛不同场景灵活的优点。作为替代公式，我们还使用了 CVC 的简化版本 (SVC)，它提供了一个更适合极大规模设置的
    `CVC-SM` 版本。


    `SVC` 公式优于 `CVC-SM` 公式的优势是 `SVC` 保留了参数严格正数的情况。在这种情况下，`CVC-SM`是非线性的，不适用于复杂模型。


    在实践中，通常更倾向于 `CVC-SM` 公式。例如，对于只有少数参数的简单且低维的模型，已知 `CVC-SM` 公式产生的结果明显优于 `CVC` 公式。此外，`SVC-SM`
    可以表示为 Gamma 的积分，这个 Gamma 函数在逻辑函数方面有很好的表示，即为 . 因此，`SVC-SM` 公式的拟合为参数设置提供了更直观的表示。然而，`SVC`
    公式在最小化成本函数方面缺乏灵活性，且可用函数集无法针对特定问题进行数值调优。因此，`SVC-SM` 常用于仿真以重现所需的模型行为。


    ## 自动推理


    在过去，反向传播算法的发明使自动推理变得容易得多。该算法背的思想是根据给定权重调整误差，并将误差反向传播回成本函数。该算法易于实现，是所有机器学习算法中最基础的之一。尽管相对容易实现，但已证明该算法在非常大的数据集学习中可以产生巨大的收益。此外，它促进了深度学习以及通用自动学习的巨大进展。


    在现代机器学习世界中，已经证明反向传播方法会导致强大的误差，即使对于非常大的数据集也能极大提高解决方案的准确性。然而，反向传播算法不能应用于任意问题。反向传播算法的主要局限之一是在每次迭代中为模型提供更新的权重。这一过程为算法运行引入了开销，从而为实现创建了昂贵的迭代。此外，这种开销层通常被忽略，性能通常通过比较算法结果与学习率来衡量。在大规模机器学习应用中，误差对这种梯度计算非常敏感，这会显著降低结果解决方案的准确性。


    许多计算机算法允许为优化算法自动生成训练集。允许此的最著名的算法是神经网络算法。神经网络算法利用了机器学习模型形式的大量简单或独特的“神经元”。神经网络中的神经元无非是梯度下降方程的某种配置，该方程仅依赖于训练数据。尽管这个模型非常复杂，但它会在单个训练数据上运行很长时间以近似适当的函数。神经网络计算梯度的误差并将误差反向传播到成本函数以纠正误差。该算法的结果通常非常准确，并且对于定义良好的问题特别有用。


    '
