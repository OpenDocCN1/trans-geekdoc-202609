- raw: "This book is designed to explain this and help you get started with machine\
    \ learning.\n\nThis book created that to explain it and help to start in machine\
    \ learning.\n\n## \n\n#  Introduction\n\n#   \n\n##  What is machine learning?\n\
    \nIf you're like most people, you're familiar with the phrase \"big data.\"\n\n\
    Big data is the analytics buzzword used in various contexts in the tech world.\
    \ In an enterprise context, this means analyzing data to uncover patterns and\
    \ trends and improve outcomes.\n\nWhile it might not be very intuitive, machine\
    \ learning (ML) is a type of ML that is most appropriate for the context of an\
    \ enterprise's IT environment. Machine learning (ML) is a type of ML that can\
    \ learn from experience, rather than simply gathering data.\n\n\"Learning\" means\
    \ that the machine receives experiences from human (or other) users and internal\
    \ business data. The computer system may use this data to improve its algorithm\
    \ and accuracy and improve its ability to process data in the future.\n\nThe Cloud\
    \ Native Computing Foundation defines ML as:\n\n\"Machine learning is a subfield\
    \ of artificial intelligence that uses machine algorithms to learn for itself.\
    \ ML is a key component of a self-operating system or a system that learns and\
    \ is self-improving. ML is a strategy for designing computer systems that can\
    \ constantly adapt to change and new tasks.\"\n\n##  Machine learning in the cloud\n\
    \nOn-premises computing architectures can be an expensive business. Unless a company\
    \ has a sophisticated cloud management environment in place, on-premises computing\
    \ systems typically perform their tasks in a solitary manner. When ML models are\
    \ used to make predictions, they're usually large and complex – and can't be run\
    \ in isolation. The ability to create and run multiple ML models concurrently\
    \ is more easily achieved in a public cloud environment, where scale-out is a\
    \ factor.\n\nML in the cloud can help improve ML by facilitating communications\
    \ with external data sources. By creating an ML model that can communicate with\
    \ external data sources, your company can collect more data about your business\
    \ and use that data to make better decisions. It will also be easier to scale\
    \ the model in response to changes in your business needs. The model will also\
    \ become more reliable and accurate as you learn from data, rather than guess\
    \ what will happen.\n\n##  How do machine learning and containers mix?\n\nAll\
    \ enterprise data and computation are typically managed on-premises by IT staff.\
    \ This makes it difficult for the business to integrate new applications with\
    \ the rest of the business in a seamless manner. If you want the ability to integrate\
    \ third-party applications with your machine learning (ML) stack, you'll have\
    \ to standardize your applications.\n\nYou can do that through the use of containers.\
    \ The popular containerization technology, Docker, is used to create isolated\
    \ virtual machine instances.\n\nDocker has native support for ML technologies\
    \ including TensorFlow and Jupyter Notebook, along with various frameworks that\
    \ make data collection and processing straightforward.\n\nWith the increased popularity\
    \ of Docker, a proliferation of solutions that make machine learning easier to\
    \ implement is expected.\n\nRedis Labs, for example, provides a dedicated ML project\
    \ that provides data access and standardization from within the Redis community.\
    \ The company also offers a free service for businesses that want to train a custom\
    \ ML model on public and private data.\n\n##  Other tools for ML\n\nThere are\
    \ several other options out there for implementing ML. Here are a few, to give\
    \ you a quick glance at a few of the options:\n\nBig Data Lake (CDL) – Containerised,\
    \ event-based data pipeline for Hadoop, Spark, and Spark SQL.\n\n– Containerised,\
    \ event-based data pipeline for Hadoop, Spark, and Spark SQL. IBM’s Global Data\
    \ Unit (GDU) – Enterprise big data project that delivers enterprise-class ML services.\n\
    \n– Enterprise big data project that delivers enterprise-class ML services. SAS’s\
    \ Data Science Experience – In addition to a research-ready environment for machine\
    \ learning, SAS also provides data science training, mentoring, and tools, such\
    \ as SAS Inside Data Science – an interactive environment that allows users to\
    \ learn a statistical approach to data science.\n\n– In addition to a research-ready\
    \ environment for machine learning, SAS also provides data science training, mentoring,\
    \ and tools, such as SAS Inside Data Science – an interactive environment that\
    \ allows users to learn a statistical approach to data science. Google's Cloud\
    \ Machine Learning Engine – An open-source platform for data scientists, trainers,\
    \ and data engineers.\n\n##  How will enterprise ML change the way we work?\n\n\
    ML is already being used across a variety of applications, ranging from sales\
    \ analytics to mining data for market trends.\n\nExamples include the image recognition\
    \ technology that can help us identify objects, such as logos or cars, on a website;\
    \ tracking people’s physical activity and routes around our cities; and responding\
    \ to account fraud by looking for suspicious activity in the feed of our social\
    \ media apps.\n\n##  What is an algorithm?\n\nAn algorithm is simply a set of\
    \ instructions for the computer to follow. Each step in a computation is called\
    \ an algorithm step. If there are many steps, then the computer makes a number\
    \ of algorithmic steps.\n\nBecause every decision we make is made by relying on\
    \ a computer, every decision we make relies on an algorithm. So everything is\
    \ an algorithm.\n\nWhat is an algorithm for? An algorithm is a set of instructions\
    \ for the computer to follow. This set of instructions describes all the rules\
    \ for how the computer will behave. For example, in captcha, the algorithm tells\
