  trans: '

    与此同时，在 20 世纪 80 年代和 90 年代，研究人员开始使用神经网络进行语音、视觉和文本处理中的模式识别。1992 年，一种名为`deep learning`（深度学习）的技术展示了演示：训练一个网络来识别数据中的模式，然后使用该网络来识别新数据中的模式。它处理的数据量比传统算法多得多，但仍然存在一些问题。


    其中一个问题是，准确性往往取决于网络的哪个部分在尝试进行预测。如果网络的一部分试图根据输入数据进行预测，那么如果它试图根据网络其他部分的预测结果进行预测，得到的输出就会大不相同。


    另一个问题是训练新网络需要很长时间，但非常很难找到训练它们的好方法，因为网络对自身并不了解多少。你不知道层与层之间正确的连接序列是什么。你不知道正确的权重是多少。这并不是说你可以简单地添加权重或可视化连接，或预测连接应该是什么样。即使只是用良好的数据进行训练，也很难弄清楚网络内部发生了什么。


    这两个问题中有趣的地方在于，它们是相互解决的。你得到了一个简单的预测算法，它在根据自己的数据进行预测方面表现良好，但它不知道自己在尝试做什么。这让你拥有了一个学习进行预测的网络，但它并不知道如何这样做。你拥有这种几层可以连接的架构，但你无法对这些连接是如何构建的有详细的。


    今天，神经网络一直用于模式识别，并且被用于许多不同任务的模式识别。它们在在这方面非常成功，但较不成功的是它们并不特别擅长的预测任务类。我们喜欢预测未来。我们想知道未来五分钟内会发生什么，或者想知道下周会发生什么。我们并不真正关心过去的五分钟、上周或明年。


    我们需要一种方法来预测未来十秒内将发生什么。也许我们想知道未来十秒内是否有汽车朝我们驶来，或者我们想知道未来十分钟内是否会有导弹发射。如果我们能预测这类事情，将是非常有用的。


    我们有一个预测事情的好方法：我们使用`Bayesian estimation`（贝叶斯估计）。我们知道许多种算法。其中一种被称为`multivariate
    regression`（多元回归），你从中获取一个预测矩阵，比如一个两个变量的矩阵。如果你取两个变量，比如向右移动或向左移动，它有两个条目，一个前向项和一个后向项，如果你分别计算前向和后向项，就会得到一个方程。然后你想计算斜率的斜率。如果方程的斜率为零，你就可以计算斜率，你就得到了预测。


    问题是，方程实际上比变量多得多，所以你需要知道计算哪一个方程以及如何计算它。你不能只单独计算每个方程。这真的很难做到。


    另一种好用的技术是`autoencoder`（自动编码器），它是一种神经网络，旨在为数据集学习高效的编码。目标是将输入压缩为低维表示，然后从该表示重构输入。这使得网络能够学习数据中最精要的特征。


    ## 什么是人工神经网络？


    人工神经网络（`ANNs`）的灵感源于人脑。ANN 基本上由层组成，就像人脑一样。每一层处理来自前一层的输入，然后将其传递给下一层。`ANN`s 的输出层返回整个网络的输出，而底层决定输入是否正确。


    例如，输入层可能被用于处理图像。输出层会判断特定的图像是猫还是狗。输入层可能还会根据形状、颜色和其他特征决定猫或狗看起来是什么样。


    在研究中，`ANNs`经常与人脑进行比较，但这只是因为它们尝试像人脑一样学习。`ANNs`能够以我们相同的方式收集信息，输入层是感知发生的地方。


    根据 DeepMind 的，`ANN`实际上是最简单的算法形式，但它的学习速度远超人类大脑目前的可能。在使用神经网络的测试中，该系统学会了玩《太空入侵者》（Space
    Invaders）游戏，准确率达到 80%，并能在 30 分钟内学会一项任务。


    “谷歌在几周内教会了`AlphaGo`——通过仔细地调整训练集、调整架构以及调整训练它的实验，”博客文章写道。


    “当然，这只是`AlphaGo`的一小部分。有数千万种新游戏等待`AlphaGo`学习，我们预计我们的系统最终将玩所有可能的游戏。到目前为止，`AlphaGo`已经与世界上最好的计算机——所有的大师——进行了对比赛，并赢得了每场比赛。”


    ## 使用 AI 映射照片


    微软的科学家利用谷歌 DeepMind 背后的技术创建了他们称为的人脑表示图像的“图形格式”。


    通过扫描整个世界，微软提供数据集而索尼提供 AI，该软件能够学习图像的底层结构，并在相应位置绘制物体。


    更重要的是，该软件可以在照片中移动物体，即使是更复杂的角度。

    '
