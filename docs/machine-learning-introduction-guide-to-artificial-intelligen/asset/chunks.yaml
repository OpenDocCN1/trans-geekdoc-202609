- raw: 'At the same time, in the 1980s and 1990s, researchers started using neural
    networks for pattern recognition in speech and vision and text processing. In
    1992, there was a demonstration of a technique called deep learning: training
    a network to recognize patterns in the data and then using the network to recognize
    patterns in new data. It was capable of processing a lot more data than traditional
    algorithms, but it still had a couple of problems.


    One problem was that the accuracy tended to vary a lot depending on what part
    of the network was trying to make the prediction. If part of the network was trying
    to make predictions based on the input data, it would get a very different output
    if it was trying to make predictions based on the predictions from the other part
    of the network.


    The other problem was that training new networks took a long time, but it was
    very hard to find good ways to train them because the network didn’t know much
    about itself. You didn’t know what the correct sequence of connections between
    layers was. You didn’t know what the correct weights were. It wasn’t as if you
    could just add weights or visualize the connections or predict what the connections
    should be. It was hard to figure out what was going on in the network, even if
    it was just trained with good data.


    What was interesting about these two problems is that they solved each other.
    You got a simple prediction algorithm that was relatively good at making predictions
    based on its own data, but it didn’t know what it was trying to do. That allowed
    you to have a network that learned to make predictions, but it didn’t know how
    to do it. You had this architecture of several layers that you could connect,
    but you couldn’t have a detailed understanding of how those connections were built.


    Today, neural networks are used for pattern recognition all the time, and they’re
    used for pattern recognition for a number of different tasks. They’re very successful
    at that, but what’s less successful is the class of prediction tasks that they’re
    not particularly good at. We like to predict the future. We want to know what’s
    going to happen in the next five minutes, or we want to know what happens next
    week. We don’t really care about the previous five minutes or the last week or
    the next year.


    We need a way to predict what’s going to happen in the next ten seconds. Maybe
    we want to know if there’s a car coming at us in the next ten seconds, or we want
    to know if there’s going to be a missile launch in the next ten minutes. If we
    can predict things like that, it would be tremendously useful.


    We have one good way of predicting things: we use Bayesian estimation. There are
    a number of algorithms that we know about. One of them is called multivariate
    regression, where you take a matrix of predictions, like a matrix of two variables.
    If you take two variables, like moving right or moving left, it has two entries,
    a forward term, and a backward term, and if you calculate the forward and backward
    terms separately, you get an equation. Then you want to calculate the slope of
    the slope. If the slope of the equation is zero, you calculate the slope and you
    have the prediction.


    The problem is that there are really many more equations than there are variables,
    so you need to know which equation to calculate and how to calculate it. You can’t
    just calculate each equation separately. That’s really hard to do.


    Another good technique is autoencoder, which is a form of the neural network,
    where you don’t have all the equations. Instead, the algorithm basically uses
    some kind of pre-existing knowledge of the inputs to find which equation will
    give you the best prediction. Then, you can train this network on the inputs and
    then find the predictions that are best. You can train this network on the previous
    10 or 20 guesses and figure out which equations were best and iterate over them.


    There are a number of different ways of doing that. The way we did it in the lab
    is we used many different networks that learned to associate different patterns,
    like moving right or moving left, with different equation relationships. We then
    tried to train them together and generate predictions that worked, and if they
    didn’t work, we discarded the last few guesses.


    The thing we liked the most was that we could have multiple networks in parallel,
    and they had very different statistics. There was not one correct answer. There
    were a lot of different answers, and some of them worked in certain types of situations.


    For example, in an automobile situation, a neural network will try to classify
    whether or not a car is going to hit us, and if it doesn’t work, we will try another
    network to do it better, or we will try a network with more variance in its predictions.
    The way you train a neural network is that the more data you put in, the better
    the predictions. You learn to distinguish different classes of cars.


    What we found is that there was almost no correlation between the accuracy of
    a neural network and the number of neural networks that you used. Even for a task
    where the cars would move rapidly, where there were lots of movements in all different
    directions, the same networks seemed to work best.


    ##  What are artificial neural networks?


    Artificial neural networks (ANNs) have become more of a household name in the
    world of machine learning over the last few years, thanks to a number of breakthroughs
    in deep learning. Google''s AlphaGo is the classic example of this: the game-playing
    program developed in the early days of deep learning, and the system used a neural
    network to teach itself the game of Go.


    ANNs are basically built from layers, much like in the human brain. Each layer
    processes a different function - processing the input from the previous layer
    and then passing it onto the next layer, which processes the data. An ANN''s output
    layer gives back the output of the entire network, and the bottom layer determines
    whether the input to the network was correct or incorrect.


    For example, the input layer might be used to process visual images. The output
    layer would decide whether a particular image was a cat or a dog. The input layer
    might also decide what a cat or dog might look like, in terms of shape, colour,
    and other features.


    In research, ANNs are often compared to the human brain, but that''s just because
    they try to learn like a human brain. ANNs are able to collect information in
    much the same way as our brains do, with the input layer being where our perception
    takes place.


    According to DeepMind, an ANN is actually the simplest form of learning algorithms,
    but its speed of learning is far beyond anything that is currently possible for
    a human brain. In tests using a neural network, the system learned to play the
    Atari game of Space Invaders with an accuracy of 80 per cent, and can learn a
    task within just 30 minutes.


    "Google taught AlphaGo in a matter of weeks - by carefully tweaking the training
    set, tweaking the architecture, and tweaking the experiment that trained it,"
    the blog post said.


    "Of course, this was just a tiny slice of AlphaGo. There are some tens of millions
    of new games for AlphaGo to learn, and we expect our system will be able to play
    every possible game eventually. So far, AlphaGo has played against the best computers
    in the world - all grandmasters - and won every match."


    ##  Mapping photos with AI


    Scientists at Microsoft used the technology behind Google''s DeepMind to create
    what they are calling a "graphical format" for the human brain to represent images.


    By scanning the entire world, with Microsoft providing the data set and Sony providing
    the AI, the software was able to learn the underlying structure of an image and
    then draw the object in its place.


    What''s more, the software could move the object around in the photo, even to
    more complex angles.'
