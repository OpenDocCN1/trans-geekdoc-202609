    反向传播算法有几个缺点，它不再是许多大规模机器学习问题的首选解决方案。然而，在针对极大规模问题的研究中，它仍然被广泛使用。许多流行的研究型神经网络库都会调用反向传播，例如
    `scikit-learn`、`cnn-learn`、`MXNet` 和 `PyTorch`。这些库为以非常高效且可扩展的方式构建大规模机器学习模型提供了框架。


    作为最后，我们还想提到 `Ben Goldacre` 在改进反向传播算法方面所出的巨大工作。他的工作极大地提高了该算法的计算效率，是深度学习和传统机器学习问题性能大幅提升的原因。如果你对学习更多关于反向传播算法感兴趣，可以查阅他的论文：“深度卷积网络：使用部分状态熵稳定误差”。


    ## 深度学习


    这些神经网络算法中最著名的，也是最复杂的。深度学习算法背后的思想是获取数据并将其还原为更小、更简单且更具体的部分，例如输入维度或类别维度。深度学习算法然后计算这些较小部分的输出，并将它们组合在一起，以创建一个更复杂的输出。


    该算法涉及将大量的小型操作（称为 `training sets`）应用于大量的训练数据。训练阶段的第一步是选择一个 `learning rate`。这决定了我们从输入层到输出层的进展速度有多快，以及输出层的计算有多快。这一步在算法的实现中经常被忽略，通常留给用户进行配置。


    一旦选择了 `training set`，我们就可以训练网络来解决手特定的特定问题。例如，我们的网络处于类别维度 3，它应该能够输出类别标签 3 以及对应参数的正负号。我们可以训练网络计算参数的正负号，以确保输出与预期值对应。一旦网络训练完成，我们需要确定如何表示和处理训练数据。通常建议将数据抽象为多个层，并为同一个训练数据集创建更高层次的表示。这是一种极其有用的技术，因为它允许我们把许多大量数据压缩到一个较小得多的空间中，同时保持准确性。在深度学习领域，这通常被称为前向数据流，并且通常出现在卷积神经网络的设计中。


    一旦训练阶段完成，我们希望确保算法能够处理训练数据，并且代价函数是可求解的。为了做到这一点，我们需要在代价函数和 `learning rate` 之间找到权衡，并不断调整它们直到我们获得正确的解决方案。我们可以通过训练或测试阶段来实现这一点。我们可以在不同的数据集上训练网络，直到找到最优参数集，或者我们可以进行定期测试，看看参数是否可以进一步调整以降低整体学习曲线。


    深度学习比更传统的机器学习方法具有许多优势。深度学习算法在大规模应用中的有效性部分归功于海量的可用训练数据，以及反向传播算法和计算机硬件的效率。然而，AI
    领域仍处于发展的早期阶段，由于其高复杂性和处理要求，深度学习算法在实现实际现实应用方面一直面临困难。


    ## 结论


    ### 思考未来


    技术将如何改变未来的工作：


    - **预测市场行为** – 医生使用机器学习来分析你的病史，并预测疾病是否可能复发。这有助于预测哪种治疗效果最好，允许医生根据你的症状定制治疗方案。

    - **更智能的数据管理** – 机器学习应用可以确定使用数据的最佳方式，这将有助于提高数据安全。

    - **更精简的安全** – 学习如何识别数据泄露中的可疑活动可以让所有人变得更安全。

    - **更主动的营销** – 数据科学家将能够使用机器学习发现新的受众。

    - **更具个性化的广告** – 利用来自 Facebook 个人资料和搜索历史的数据，营销人员可以比以往任何时候都更好地针对你投放广告。


    ## 机器学习的优势


    不同的机器学习算法根据其学习方式进行分类。这种分类基于它们的 `training set`，通常由标记数据和高维数据组成。这些被称为监督学习算法。


    ## 深度学习


    深度学习涉及由许多隐藏层组成的神经网络，这些层被不断调整以反映真实世界的数据，就像简单的特征检测器。学习过程允许从许多高维向量提取数据，以更高效地执行任务。


    ## 神经网络


    通常，神经网络由若干层组成，每层被称为 `neuron`，以及一个允许神经元相互发送接收消息的线性控制器，称为 `input layer` 和 `output
    layer`。神经网络通常输入训练数据，以学习网络的 `weights`，使得每个层随后能够生成一个值的向量。输出被馈到下一层，该层根据之前的权重和当前的训练数据进行修改。下一层将输出传递给下一层，依此类推。网络的层之间可以重叠。

