- raw: 'The backpropagation algorithm has a few shortcomings, and it is no longer
    the solution of choice for many large-scale machine learning problems. However,
    it is still used widely in research for very large-scale problems. Many popular
    research neural network libraries will call for backpropagation, such as scikit-learn,
    cnn-learn, MXNet, and PyTorch. These libraries provide a framework for the building
    of large-scale machine learning models in a very efficient and scalable manner.


    As a final note, we also would like to mention the great work done by Ben Goldacre
    on improving the backpropagation algorithm. His work greatly improved the algorithmic
    efficiency of the algorithm and is responsible for the substantial performance
    increases in deep learning and traditional machine learning problems. If you are
    interested in learning more about the backpropagation algorithm, check out his
    publication: “Deep Convolutional Nets: Error Stabilization Using Partial State
    Entropy”.


    ##  Deep Learning


    The most famous of these neural network algorithms is also the most complex. The
    idea behind the deep learning algorithm, is that we take data and reduce it to
    smaller, simpler and more specific parts, such as the input dimension or the class
    dimension. The deep learning algorithm then calculates the output of these smaller
    pieces and combines them together to create a more complex output.


    The algorithm involves applying a large number of small operations, called training
    sets, to a large amount of training data. The first step in the training phase,
    is to choose a learning rate. This determines how fast we will advance through
    the input layer to the output layer, and how quickly the output layer can be computed.
    This step is often overlooked in the implementation of the algorithm and is often
    left to the users to configure.


    Once a training set is chosen, we can train the network to solve the specific
    problem at hand. For example, our network is in the class dimension 3, and it
    should be able to output the class label 3 as well as the sign of the corresponding
    parameter. We can train the network to calculate the sign of the parameter to
    ensure that the output corresponds to the expected value. Once the network is
    trained, we need to determine how to represent and process the training data.
    It is often advised to abstract the data into multiple layers, and create higher
    level representations for the same training dataset. This is an incredibly useful
    technique, as it allows us to compress a lot of the data into a much smaller space
    while still maintaining accuracy. In the field of deep learning, this is commonly
    referred to as forward data motion, and is often found in the design of convolutional
    neural networks.


    Once the training phase is complete, we want to make sure that the algorithm can
    process the training data and that the cost function is solvable. To do this,
    we need to find a tradeoff between the cost function and the learning rate and
    tweak them until we reach a correct solution. We can do this with training or
    testing phases. We can train the network on different sets of data until we find
    the optimum set of parameters, or we can conduct regular testing to see if the
    parameters can be adjusted further to reduce the overall learning curve.


    Deep learning provides a number of advantages over more traditional machine learning
    methods. The effectiveness of deep learning algorithms in large-scale applications
    is partially due to the enormous amount of available training data, as well as
    the efficiency of the backpropagation algorithm and computer hardware. However,
    the AI field is still in the early stages of development, and deep learning algorithms
    have struggled to achieve practical real world applications due to their high
    complexity and processing requirements.


