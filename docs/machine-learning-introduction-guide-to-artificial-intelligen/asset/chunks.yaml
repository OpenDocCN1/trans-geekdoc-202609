- raw: 'Analyzing, mining, and mining data. Â Machine learning systems analyze information
    to identify trends and "hidden" patterns, such as correlations between a set of
    variables. These approaches can assist analysts in gaining a deeper understanding
    of the data. An effective machine learning system will take data, parse the data,
    and then provide recommendations based on the analysis and recommendations.


    Analyzing the data to learn, make predictions and algorithms. Â Learning is the
    process by which computers gain improved performance on new and more complex tasks.


    Algorithms are the set of steps that define the functions a machine (e.g. computer)
    will perform. Machine learning algorithms are designed to work on the data that
    has been collected by an analyst (a scientist or data miner) and they are self-learning.
    Machine learning algorithms have to be continually optimized and updated so that
    they provide the best result to the researcher or scientist using them.


    #  Chapter 2 What is the future of machine learning?


    A powerful brand of machine learning (ML) that’s beginning to show up in the wild
    is adaptive learning, an ML technique that uses models that adapt to their inputs.


    A classic example of adaptive learning is when the same data set is used multiple
    times to produce vastly different outputs. For instance, a consumer might listen
    to the same song over and over again, or look at the same faces, but the same
    faces will yield different, but relatively similar, interpretations.


    Adaptive learning requires neural networks—systems that use inputs to produce
    outputs. When applied to situations where the input and output don’t have a significant
    previous relationship, adaptive learning is much more powerful and can work much
    better than other models.


    ##  Examples of adaptive learning


    Back in 2010, writer Douglas Adams wrote the “Back to the Future” novels, but
    he never actually tried to write a machine learning algorithm. That’s because
    machine learning at the time did not exist, and it took over a decade for the
    technology to catch up. This led to the usual length of time it takes to go from
    idea to technology: 16 years!


    In 2016, scientists published a paper titled “On Towards Adaptive Image Classification,”
    where they described how they adapted image-recognition algorithms to account
    for large amounts of data, the effects of object shape on visual perception, and
    an adaptive algorithm that could, in this case, compensate for the effects of
    aging.


    We see similar adaptability with adaptive learning in today’s domain of product
    management.


    ##  Back to the Future


    Perhaps the most famous example of adaptive learning in production is the movie
    Back to the Future, where Marty McFly’s life (and memories) are projected back
    to 1955 and then to 2015.


    Like predictive inference (the technique used by many adaptive learning systems),
    the predictive inference is based on the premise that machine learning models
    can learn to predict outcomes. But instead of predicting the probability that
    Marty will win a bet with Doc Brown, predictive inference calculates the probability
    that Marty will avoid the gravitational field of a black hole.


    The assumption of predictive inference is that predictive models that account
    for large amounts of data can give better and more accurate predictions. In 2015,
    scientists published a paper titled “Augmenting Predictions using Fluid Localization,”
    where they proposed a new approach for training predictive inference models that
    improves prediction accuracy while also significantly reducing the amount of data
    required to train and run the model.


    Based on the concept of fluid localization, the authors determined that increasing
    the length of the local training data improves prediction accuracy for all predictions
    made by the model, even if it means significantly increasing the number of predictions
    needed to train the model.


    Similar to other ML techniques, adaptive learning can be used to eliminate the
    need to continuously tweak the training data. Adaptive learning has a relatively
    short history but has already shown to produce better and more accurate models
    than other ML techniques.


    The DeLorean DMC-12, on display at the 2015 Los Angeles Auto Show.


    ##  Frontier Development


    A clever approach to managing failure


    It’s clear that in a world where information is abundant, data is cheap, and connectivity
    is ever more important, organizations need to adopt systems that can leverage
    both the data and connectivity to avoid failure.


    Today, enterprises depend on data streaming to build applications, so predictive
    monitoring is the next logical step in system and application monitoring. But
    even predictive monitoring is far from perfect, and early and accurate detection
    of failure is the first step in preventing costly data loss and taking remedial
    actions before there is irreparable damage.


    Managing predictive failures


    A new breed of predictive monitoring software has emerged in recent years, leveraging
    data streaming, network diagnostics, and user behavior to detect and mitigate
    system and application failures before they occur. Today’s predictive monitoring
    software captures insights and can provide specific inputs to anomaly detection,
    anomaly remediation, and proactively bring issues to IT’s attention before they
    can cause an outage.


    Some of today’s predictive monitoring software vendors offer APIs and the ability
    to integrate directly with existing monitoring, configuration management, and
    fault management tools.


    Early detection of failure


    For any type of software to operate effectively, it needs to adapt to the characteristics
    of its environment. No matter how many engineering changes are made to ensure
    that a system can perform well in a specific location or use case, there will
    always be a chance that it fails.


    In predictive monitoring, a failure is identified as soon as it is detected. As
    such, the system is designed to record and measure every input that comes into
    the system, including user-defined exceptions. When certain outputs from an operation
    appear inconsistent, the system is able to adjust itself in real-time, and then
    alert the user or other system users. Predictive monitoring tools can provide
    a complete timeline of events that occur.


    For example, if an input that has previously generated an error consistently occurs,
    it would indicate a failure, even though it might be a transient error that is
    easily remediated. The system can also be programmed to detect errors in a discrete
    set of operations and collect data before an individual operation is completed
    and trigger alerts when an irregular operation occurs.


    ##  Predictive monitoring also incorporates machine learning.


    Modern predictive monitoring software can detect when a set of metrics might have
    changed without actually activating any alarms or dropping down an alert level.
    In order for a device to provide a warning in this situation, a human has to identify
    the anomaly and raise an alarm for a specific set of metrics.


    Thus, one thing that can happen is that a person is alerted by an alert, and the
    action that needs to be taken is referred to another tool that does not require
    someone to know the specific set of metrics or the specific series of events.


    The second approach can be more proactive, where an alert is raised and the system
    is configured to send an email to the responsible engineer or administrator.


    Finally, the third approach is predictive monitoring at its best. It has no human
    involvement; a system records all of the data, and a program interprets it and
    issues an alert to the appropriate person. Predictive monitoring comes into play
    when something anomalous is detected at a location that should not be anomalous.
    In these scenarios, a system is performing perfectly, but an anomaly has occurred
    that alerts the human that something is amiss. The human can then take action
    to make sure that the system is operating correctly.'
