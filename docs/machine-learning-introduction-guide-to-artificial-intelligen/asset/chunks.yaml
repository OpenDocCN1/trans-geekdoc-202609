    This book is designed to explain this and help you get started with machine learning.
    This book created that to explain it and help to start in machine learning.


    # Introduction


    ## What is machine learning?


    If you''re like most people, you''re familiar with the phrase "big data."


    Big data is the analytics buzzword used in various contexts in the tech world.
    In an enterprise context, this means analyzing data to uncover patterns and trends
    and improve outcomes.


    While it might not be very intuitive, machine learning (ML) is a type of ML that
    is most appropriate for the context of an enterprise''s IT environment. Machine
    learning (ML) is a type of ML that can learn from experience, rather than simply
    gathering data.


    "Learning" means that the machine receives experiences from human (or other) users
    and internal business data. The computer system may use this data to improve its
    algorithm and accuracy and improve its ability to process data in the future.


    The Cloud Native Computing Foundation defines ML as:


    "Machine learning is a subfield of artificial intelligence that uses machine algorithms
    to learn for itself. ML is a key component of a self-operating system or a system
    that learns and is self-improving. ML is a strategy for designing computer systems
    that can constantly adapt to change and new tasks."


    ## Machine learning in the cloud


    On-premises computing architectures can be an expensive business. Unless a company
    has a sophisticated cloud management environment in place, on-premises computing
    systems typically perform their tasks in a solitary manner. When ML models are
    used to make predictions, they''re usually large and complex – and can''t be run
    in isolation. The ability to create and run multiple ML models concurrently is
    more easily achieved in a public cloud environment, where scale-out is a factor.


    ML in the cloud can help improve ML by facilitating communications with external
    data sources. By creating an ML model that can communicate with external data
    sources, your company can collect more data about your business and use that data
    to make better decisions. It will also be easier to scale the model in response
    to changes in your business needs. The model will also become more reliable and
    accurate as you learn from data, rather than guess what will happen.


    ## How do machine learning and containers mix?


    All enterprise data and computation are typically managed on-premises by IT staff.
    This makes it difficult for the business to integrate new applications with the
    rest of the business in a seamless manner. If you want the ability to integrate
    third-party applications with your machine learning (ML) stack, you''ll have to
    standardize your applications.


    You can do that through the use of containers. The popular containerization technology,
    `Docker`, is used to create isolated virtual machine instances.


    Docker has native support for ML technologies including `TensorFlow` and `Jupyter
    Notebook`, along with various frameworks that make data collection and processing
    straightforward.


    With the increased popularity of `Docker`, a proliferation of solutions that make
    machine learning easier to implement is expected.


    `Redis Labs`, for example, provides a dedicated ML project that provides data
    access and standardization from within the `Redis` community. The company also
    offers a free service for businesses that want to train a custom ML model on public
    and private data.


    ## Other tools for ML


    There are several other options out there for implementing ML. Here are a few,
    to give you a quick glance at a few of the options:


    Big Data Lake (CDL) – Containerised, event-based data pipeline for `Hadoop`, `Spark`,
    and `Spark SQL`.


    Containerised, event-based data pipeline for `Hadoop`, `Spark`, and `Spark SQL`.
    IBM’s Global Data Unit (GDU) – Enterprise big data project that delivers enterprise-class
    ML services.


    SAS’s Data Science Experience – In addition to a research-ready environment for
    machine learning, SAS also provides data science training, mentoring, and tools,
    such as `SAS Inside Data Science` – an interactive environment that allows users
    to learn a statistical approach to data science.


    Google''s Cloud Machine Learning Engine – An open-source platform for data scientists,
    trainers, and data engineers.


    ## How will enterprise ML change the way we work?


    ML is already being used across a variety of applications, ranging from sales
    analytics to mining data for market trends.


    Examples include the image recognition technology that can help us identify objects,
    such as logos or cars, on a website; tracking people’s physical activity and routes
    around our cities; and responding to account fraud by looking for suspicious activity
    in the feed of our social media apps.


    ## What is an algorithm?


    An algorithm is simply a set of instructions for the computer to follow. Each
    step in a computation is called an algorithm step. If there are many steps, then
    the computer makes a number of algorithmic steps.


    Because every decision we make is made by relying on a computer, every decision
    we make relies on an algorithm. So everything is an algorithm.


    What is an algorithm for? An algorithm is a set of instructions for the computer
    to follow. This set of instructions describes all the rules for how the computer
    will behave. For example, in captcha, the algorithm tells the computer to "click
    on the word if it''s a word, and otherwise not."


    How do we decide what is an algorithm? We decide what an algorithm is by looking
    at its output, the answer it gives to a problem. Let''s look at a function that
    solves a problem.


    If a function solves a problem, then it has an answer. But just because a function
    has an answer does not mean that it is an algorithm.


    Here is an example: If we have a function called `squares`, then `squares(x) =
    sqrt(x)`. There is no algorithm for squares, and so it does not matter what `squares`
    does.


    ## Why do Python and data science mix well?


    Python has a rich and mature ecosystem. You don''t need to know every function,
    and are familiar with the community. You can start a project, play with the functions,
    and see what you like. All the tools in the ecosystem are tested and well understood,
    and support working with data. You don''t need to learn a data language like `R`
    or `Excel` if you don''t need to, so you can focus on coding your data analysis.
    You can then transfer the knowledge you learn to other languages or environments
    that suit you, or to your own language.


    ## Python is a general-purpose programming language


    Python is not a data science language, and it''s not meant to be. However, as
    a language that is focused on server-side programming, it''s flexible enough to
    be very useful for data analysis. Plus, there are a ton of libraries (such as
    `pandas`, and `numpy`) that are optimized for handling your data analysis, and
    these libraries work well in Python.


    ## Python is the perfect programming language for data science


    There are so many reasons to use Python as your data science language, you might
    not know where to begin. After reading this blog post, you should be eager to
    take action. The answer is to read more and learn more, but that''s not necessary.


    # Chapter 1 Machine learning


    ## What is the definition of machine learning?


    Machine learning is a technology for automatically recognizing patterns and organizing
    data. You can think of it as a way of using mathematical modeling to match data
    to predictive models, then using optimization techniques to get the most out of
    the data that you have.

    '
