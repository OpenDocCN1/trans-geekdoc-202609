    # 什么是数据科学统计学习？


    数据科学统计学习，或 `DSLe`，是一种获取洞察的工具。统计学习是一种监督机器学习的形式，用于涉及数据收集和预测的任务。在许多情况下，机器学习算法对其推理的解释不够充分；`DSLe`
    的目标是提供这种人类洞察。本关于统计学习的教程介绍了用于定量指标分析、创建和训练推理引擎的 `DSLe`。


    ## 什么是图形线性代数 (GLAM)？


    `GLAM` 是一种将数据信息转换为可用向量场操作的表达式的技术。它主要用于图像处理，以及解释特征工程算法，这些算法决定了特征如何贡献于特征空间相似性的定义。它也经常用于统计机器学习，将数据转换为特征。作为一种产生数据线性变换的工具，`GLAM`
    在创建数据可视化应用程序（如感知图和散点图）方面非常有用。它还允许算法被多次应用。


    ## 什么是抽象学习？


    抽象学习是一种用于近似推理的机器学习技术。在传统的统计框架下，方程被表示为无限大的向量，例如 `X` 变量和 `Y` 变量的相关性；相比之下，在抽象学习中，公式被表示为数组，例如
    `X` 变量与 `Y` 变量的比率。对一组数据的方程近似输出并不总是像精确公式提供的那样精确。目标是找到一个尽可能好、但仍是所需解决方案的合理近似的指标。抽象学习在数据挖掘等科学应用中特别有用。


