    ##  What is an unsupervised machine learning method?


    Unsupervised machine learning is one of the important application areas where
    machine learning works best, especially when there is no prior knowledge about
    the data in question. The fact is, there is a lot of variation in a data structure,
    the process of data generation, and how data is processed.'
