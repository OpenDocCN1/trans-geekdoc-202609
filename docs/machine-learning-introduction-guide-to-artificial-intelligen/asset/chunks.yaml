    That’s enough to predict the classification at every layer of our model, by simply
    following the classifier output.


    More simply: take the log-loss of the input, and add 1 to it for each level of
    the neural network.


    The smallest input-output difference is our output label, and the larger this
    difference is, the stronger the prediction (input) for that layer.


    This is the method we can use to scale up our algorithm for more complex data.


    We can get a direct idea of the parameters of our learning algorithm (such as
    the number of hidden layers, the number of hidden nodes, the activation function,
    etc) by looking at the hyperparameters for the learning algorithm’s train/test
    splits. We also have the total number of parameters to work with (e.g. size of
    the desired region). Let’s look at a quick way to work with them:


