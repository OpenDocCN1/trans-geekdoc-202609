    ## 机器学习与统计技术有何区别？


    机器学习与传统统计方法之间的主要区别如下：


    机器学习算法（或你用于拟合机器学习算法的工具）具有多个“深层”结构。例如，YouTube 的平均视频大约为 12 秒，因此如果你想将图像与视频匹配，你需要查看视频中每一帧的高度、宽度以及观看速度。


    即使你可能拥有该视频的成千上万个匹配项，你仍然需要知道它们是否是同一个视频。这就是匹配模型大显用场的地方。匹配模型描述你数据的数学模型；它是一套将视频中的图像与其他数据进行对比的配方，以便选出一个你可以后续处理的匹配项。这就像为食谱寻找正确的原料，但你并不知道最终产品会是什么。


    你可能有几十万个匹配项，但你只能找到 1 个匹配的；找到良好的匹配项就像尝试用你家里的食谱烤蛋糕，结果发现它并不符合你的预期。这就是为什么配对需要通过多次重复来完成。


    ## 监督学习与无监督机器学习之间有什么区别？


    监督机器学习（也称为“监督学习”或“窄类”分类）是指人类编写程序让软件从数据中学习模式。在无监督机器学习（也称为“无监督学习”或“窄类”分类）中，数据是没有标记的。


    当你使用监督机器学习时，算法会被告知数据的正确分类应该是什么。相比之下，在无监督学习中，算法根据其自身学到的信息利用自己的智能和推理能力。在理论上，算法学会了执行我们想要它做的事，但在实践中，算法可能会学会识别对它本身重要的数据特征，并避开它认为无关的数据。


    ## 机器学习与人工智能有何区别？


    虽然人工智能也被称为 `AI`，但重要的是要理解并没有一种单一类型的 `AI`。有许多不同类型的 `AI`，它们都有各自的优缺点。


    机器学习与人工智能的区别在于，机器学习是一种技术，而 `AI` 是一种已经使用了多年的方法。但人工智能要被视为 `AI`，并不要求机器表现得像人类一样。


    机器学习更侧重于使用计算机算法来转换数据。相比之下，`AI` 使用计算能力来解决它从数据中学会如何解决的问题。`AI` 还利用算法帮助它学习执行特定任务，并创建体验和/或产品。


    然而，人工智能通常与机器人联系在一起，它经常被用于执行比机器自然能完成的任务更抽象的任务，例如识别不同的人类情感。


    ## 你能教电脑学习吗？


    机器学习并不依赖于编程，在许多情况下，它可以通过经验来学习。例如，如果你正在处理的数据集包含猫的照片，而分类器的目标是识别猫的照片，那么计算机必须经过训练来学习如何识别猫。一旦它学会了这项任务，它就能通过识别计算机程序被教导在照片中寻找的特征来自动识别猫。


    ## 你如何训练机器进行学习？


    就像任何技能一样，你必须通过练习来学习。在机器学习中，你可能会使用几种不同类型的数据来训练机器，并使用这些数据集来预测随后添加到训练集中的新数据的结果。


    来自互联网的输入，包括某个关键词的点击次数、某个链接的排名以及某个网页收到的评论。


    ## 机器学习的好处是什么？


    机器学习正在取得快速进展，作为一种开源实践，人们很容易亲自尝试。结果，许多机构已经实施了某种形式的机器学习，另一些机构正在快速实施。


    机器学习的一个关键优势是能够利用数据自动执行通常需要人工干预的任务，例如收集和分析数据，或根据特定结果决定采取什么行动。这些任务通常需要人工干预，但机器学习使得这些过程能够自动化，释放了劳动力。


    机器学习为组织提供了许多益处，例如减少人为错误的风险、提高数据质量、提高组织效率、降低错误率、加快决策速度以及增加收入。


    例如，自动进行电子邮件数据的收集和分析使公司能够提高客户服务的质量。以前，员工必须花时间手动阅读客户发送的每一封邮件。据估计，大约 50% 的客户邮件没有得到回复，这给机构每年造成了数十亿美元。


    在由电子邮件 API 提供商 `Cloudmark` 委托的一份报告中，估计公司每收到一个报告的未处理客户投诉，就会损失约 15,000 美元。在同一份报告中，还估计通过自动收集和处理数据，平均机构每年可以节省
    15,000 美元。


