  trans: '

    DeepMind 的突破性工作也被用于保护 Wikipedia 免受网络攻击。2015 年的研究人员能够通过替换 Wikipedia 页面上的背景图像，实时更改新的图像。


    ## 机器学习中的数据结构


    尽可能快速的错误标记是实现良好训练的关键。它被用于将数据分类为标签 `A` 或 `B`。在实践中，我们通过一种被称为`迁移学习`的技术来改进模型的预测。


    与其计算函数，我们实际上是在尝试从给定的函数中学习。例如，如果我们正尝试计算函数的梯度，只需通过指数级增加函数来修改。这种方式，通过选择最佳候选函数，我们对每个候选者调整参数，直到参数收敛。这一过程可以显示，当模型函数与观测标签之间的距离最小化时，学习就会收敛。


    这一概念的一个经典例子是用于图像聚类的“深度置信网络”。


    神经网络的标准方法是将特征绘制到训练数据上。在训练的第一阶段，如果数据非常稀疏，训练需要大量的时间。然而，如果训练数据很大，计算将变得昂贵。为了减少成本，我们定义了一个考虑训练数据量的正则化项。在标准方法中，正则化考虑了固定成本，即`梯度下降`函数，这在实践中很容易计算。我们将看到正则化项的效果。


    ## 监督学习示例


    在监督学习中，我们也可以定义一种衡量标准，告诉我们预测标签与观测标签之间的差异。例如，我们有一个模型 `A` 来预测给定数字是正还是负，以及另一个模型 `B`
    来预测给定数字是正还是负。


    假设我们想要预测数字是否高于或低于阈值。通常，数字越高，它高于阈值的概率越大；数字越低，它低于阈值的概率越大。


    我们想要训练一个模型来预测数字是否高于阈值（或预测低于阈值）。我们还想知道如何选择高于或低于阈值的参数。训练阶段，我们从训练数据中取一个样本并输入模型。如果模型的预测值高于阈值，我们减去`平均值`和`方差`。这给了我们一个低于阈值的预测数字。


    如果预测数字高于阈值，我们从训练数据中取一个样本并输入模型。如果模型的预测值低于阈值，我们同样从训练数据中取一个样本并输入模型。我们可以看到，在上述方程中，`平均值`和`方差`是预测的归一化值。我们还需要取函数的导数并将其转换为标量。这被称为`自动编码器`，是深度学习的一个子类。


    # 第 4 章 机器学习方法


    ## 监督学习方法


    让我们从同一个角度解决这个问题，从机器学习算法开始（在这里，我们只需要分类：“德国”或“伊朗”）。让我们通过取模型的泛化大小作为输出，并注意它可能取决于标签：


    对于每个输入层，只需提取函数的`log loss`（`1` 或 `-1`）。这足以通过跟踪分类器的输出来预测模型每一层的分类。


    简单来说：取输入的`log-loss`，并对神经网络的每一层对其加上 `1`。


    最小的输入输出差异是我们的输出标签，差异越大，该层的预测（输入）越强。


    这是我们可以用于扩展复杂数据算法的方法。


    通过观察学习算法的训练/测试划分，我们可以对算法的参数（如隐藏层数、隐藏节点数、激活函数等）有一个直观的理解。我们还有需要处理的参数数量（例如目标区域的大小）。让我们看看一种处理它们的快速方法：


    简单但具有一些高级特征。简单但具有一些高级特征。


    这里是我们缩放函数的输出：


    对于每一层，简单取函数的`logloss`（`1` 或 `-1`）。


    并对我们模型的每一层对其加上 `1`。


    缩放后，最大值（需要额外的测试）随层数的增加线性增长。我们可以将缩放函数重写为矩阵：


    神经网络现在可以通过少数参数进行学习。稍微复杂一点的示例步骤如下：


    添加加权先验以最小化每一步的标准差（矩阵，其中 `X` 和 `Y` 是每个权重索引隐藏层的输入、输出和 `logloss`）。权重的结果将是一个过度权重分布。


    以及对于每个权重索引隐藏层）。权重的结果将是一个过度权重分布。我们需要为每一层准备特定迭代次数的训练/测试划分。从矩阵可以看出，列（其 `X` 和 `Y`
    坐标为输入、输出和 logloss`）对于 3 个权重索引层中的每一个都有不同的迭代次数。


    完成训练/测试划分后，我们将取`logloss` 并结合层数进行缩放。通过这种方式，我们能够从输入到输出，再到 `logloss`。


    虽然我们不需要显式地可视化这些组件来构建模型，但在这种情况下，我们可以通过运行两次缩放函数来获得更灵活的可视化（例如直方图）：一次针对维度（例如 `10 ×
