- raw: 'Moreover, by fine-tuning a model, we are applying a lot of processing to each
    sample and, hence, it is not possible to use both continuous and categorical variables
    in the same model. Categorical variables are typically good predictors of a continuous
    variable, but a continuous variable is usually a better predictor of a categorical
    variable. With a continuous model, the predicted value of the outcome is the whole
    data set. However, with a categorical model, the predicted value of the outcome
    is a subset of the whole data set. In the reinforcement learning method, the categorization
    happens right in the model. Therefore, we have to run the model three times (one
    iteration) to obtain the prediction of the data set. Then, we take the prediction
    and transform it into a categorical form.


    In practice, this requires the execution of two transformations. We need to transform
    the outcome into the categorical form and then we need to transform the predicted
    value of the outcome into the categorical form. Then, we can compare the prediction
    of the outcome against the categorical predictor and correct the model if necessary.


    ##  How does the reinforcement learning method work?


    In reinforcement learning, we use a virtual model of the environment and we run
    the model until it reaches a threshold score. Then, we apply the performance score
    as a feature to the input layer. However, that information is not available in
    the base layer. That''s why we need to transform it.


    We define a particular system state, such as whether the CUBE has a right angle
    or left angle, and we run the model against the virtual environment until the
    model reaches the specified threshold. That''s why we run it three times (a series
    of iterations) in order to get the final score. Then, we transform the score into
    the categorical form and we can use it for predictions.


    ##  How does this happen on an event-based deep learning network?


    This happens on a two-layer neural network where the first layer is the probabilistic
    vector space. That is, it keeps track of how likely the outcome is based on the
    current input. The output of the network is another probabilistic vector space
    that represents the final output.


    However, in the reinforcement learning method, we need to be able to translate
    the current input into the corresponding output, without running the model repeatedly.
    Thus, we need a second-level classifier to transform the inputs into the corresponding
    outputs. If the input is likely to be a specific output, we run the model again.
    However, if the input is not likely to be a specific output, we run it again.
    That''s why we use a second-level classifier.


    There are two big challenges here: to convert the probabilities into the outputs,
    and to transform the outputs into the input vectors. The probabilistic vector
    space (aka fuzzy logic) might look something like this:


    However, from the logical point of view, this is quite cumbersome and not so easy
    to convert into a language that can be used for neural networks. However, we still
    can translate the probabilistic vector space into a probability density function,
    which can then be encoded as a kernel (or a smoothed version of it) inside the
    neural network.


    Moreover, we can add some transformations. We can change the probability weight
    that we keep for each of the outputs so that the output of a neuron would be the
    sum of the output of all the neurons in the input. We can also add a stride or
    loss function between input and output.


    #  Chapter 5 Big Data


    ##  What is big data?


    Big data refers to an enormous amount of information held in digital form. Theoretically,
    there should be no end to what data can be crunched and where this data can be
    accessed. The large volumes of information shared across applications, and the
    access and storage requirements in the cloud, create a vast treasure trove of
    data that is unprocessed. At least half of the global information created every
    day is never used, leading to the global surveillance gap.


    Not only is the amount of data growing exponentially, but the ability to analyze
    these data points has not kept pace. As there are no limits on the number of cores
    and graphics cards available in computing systems, the processing power needed
    to analyze data has increased exponentially.


    While current tools allow the cost of analyzing large amounts of data to be amortized
    over large volumes of data, new techniques, such as those developed by academia,
    have managed to combine the relatively expensive computing power with an inexpensive
    data processing infrastructure.


    Big data will change the way we interact with data. It will provide individuals
    with better access to information than ever before. It will allow businesses to
    create accurate predictive models and to find new market opportunities. New business
    models and services will be created by the ability to access and utilize a vast
    amount of information.


    ##   


    ##   


    ##   


    ##  Getting ready


    Big data has the potential to transform the industry, and as such, it is imperative
    that our governments, educational institutions, and civil society become informed
    about big data''s potential benefits and understand the threats it may pose to
    our democracies, economies, and individual rights.


    Being ready for the impact of big data means being aware of the opportunities
    it presents and understanding the potential challenges it will pose. It also requires
    companies to understand that in order to take full advantage of the opportunities,
    they will need to take a hands-on approach. Some of this work is already happening.
    For example, in 2015, IBM and the National Cyber Security Centre developed the
    UK''s first National Big Data Strategy, which was released in February 2016, and
    a day after the UK''s data protection law came into force.


    However, as there is no regulator in place for big data, the concept of "big data"
    has yet to be fully defined in the UK, and policymakers and industry are not yet
    sure how big data will affect business and society. This uncertainty has given
    rise to the phrase "data desert".


    A day after the data protection law came into force in the UK, the government
    still did not have a definition for big data and had not developed an overarching
    policy for dealing with the complex legal and regulatory environment it poses.
    Nor were there guidelines for how businesses should respond to the ongoing changes
    to the law.


    Not enough time has passed since the UK''s data protection law came into force
    for organizations to have a clear picture of how their data processing systems
    will change to address the legal requirements in the legislation.


    There is a need for clarity on how companies can continue to acquire and process
    data when the European Union General Data Protection Regulation comes into force
    in 2018. Given the wide scope of the regulation, it is unclear whether businesses
    will still be able to acquire and process data as they do currently, and how they
    will identify the right customers for their big data systems in the future.


    Not surprisingly, many organizations and individuals are looking to the US, a
    country that already has robust laws in place, for guidance. But data privacy
    is very much still a topic of discussion, and confusion reigns.


    One issue is that different laws apply to a business, and only some of them require
    companies to report data breaches. And there is a lack of clarity on the kind
    of information that companies need to report and the way they should share it.


    Small companies in particular are finding it difficult to comply with the new
    rules. This is because they may not have the resources and expertise to conduct
    a thorough assessment of their own data processing systems to identify and rectify
    their data management gaps.


