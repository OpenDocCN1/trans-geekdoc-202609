    许多组织仍在探索在员工绩效中使用预测性分析的方法。但其实现范围是有局限的。最显而易见的局限性是，它无法知员工的想法。尽管存在例外，但大多数人无法准确地描述自己的行为。至少可以说，人类的直觉是不完善的。


