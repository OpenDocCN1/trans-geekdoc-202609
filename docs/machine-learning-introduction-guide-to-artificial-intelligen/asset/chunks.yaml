    a variety of benefits to the businesses, such as greater flexibility, efficiency,
    and increased agility.


    #  Chapter 7 What is Data science statistical learning?


    Data science statistical learning, or DSLe, is a tool for gaining insight into
    the reasoning behind data scientists. Statistical learning is a form of supervised
    machine learning and is meant to be used for those parts of machine learning that
    require human insight. Data scientists have a range of different tasks, some of
    which involve collecting data, others involving making predictions and others
    involving interpreting the results. In many cases, machine learning algorithms
    do not explain their reasoning well enough to be used in an untrained role. DSLe’s
    goal is to provide that human insight. This tutorial on statistical learning introduces
    DSLe for the analysis of quantitative metrics, creating and training inference
    engines, and uses DSLe to create a learning program for internet traffic predictions.


    ##  What is graphical linear algebra (GLAM)?


    GLAM is a technique that converts information about data into expressions that
    can be manipulated with vector fields. GLAM is used primarily in image processing
    and to interpret feature engineering algorithms that determine how well features
    contribute to a feature space’s definition of similarity between the two. However,
    it is also frequently used in statistical machine learning to transform data into
    features or features into data and to perform feature engineering. As a tool for
    producing linear transformations of data, GLAM is useful in creating data visualization
    applications such as plot-sense plots and scatter plots. It also enables the reuse
    of algorithms to be applied multiple times.


    ##  What is abstract learning?


    Abstract learning is a machine learning technique for approximate inference. In
    the traditional statistics framework, an equation is represented as an infinitely
    large vector, e.g. the correlation of the X and Y variables; in contrast, in abstract
    learning, a formula is represented as an array, e.g. the ratio of the X variable
    to the Y variable. The output of an approximation of an equation for a set of
    data may not always be as exact as an exact formula would provide. The aim is
    to find a metric that is as good as possible but that is still a reasonable approximation
    of the desired solution. Abstract learning is especially useful in scientific
    applications such as data mining.


    ##  What are neural networks?


    Neural networks are a type of learning algorithm that has been around for over
    50 years. Originally inspired by the connections between neurons in the brain,
    neural networks are commonly used to make predictions about small collections
    of data in discrete categories. In machine learning, neural networks are useful
    for statistics because they can predict the probability of an event given a large
    number of data points, thus overcoming the limitations of statistical learning.
    They are also used in machine vision and natural language processing to assist
    with vision and language tasks. For further information, see the Machine Learning
    Pipelines Tutorial on neural networks.


