    缺乏清晰的指南，并且由于只有少数公司能够获取其进行分析所需的全部数据这一事实而变得更加严峻。事实上，在旧的数据保护法下，公司被要求在数据泄露发生后的特定时间内发布有关数据泄露的信息。


    在实施的第一年，数据保护法必须应对一个长期存在的问题，即如何处理由于社交媒体平台增长和互联网演变导致机构可用数据量不断增加的问题。


    由于英国尚未设立大数据的监管机构，目前尚不清楚公司是否仍然能够像现在那样获取和处理数据。这对美国大数据行业的影响可能与对英国的影响一样之大。


    鉴于行业内缺乏共识，且尚无人能定义“大数据”这一概念，这种透明度的缺乏在可预见的未来可能仍是企业面临的一个主要担忧。


    为了应对这些问题带来的挑战，英国政府应该退后一步，并制定一种整体性方法来监管大数据和社交媒体平台。这将帮助企业和组织了解他们可以使用哪些数据，以及如何降低与使用这些数据相关的风险。


    此外，政府应该意识到，就像金融行业一样，大数据领域的机构如果有手段隐瞒，在起初可能会寻求避免报告泄露。


    然而，最终为提供可供报告的数据并没有简单的解决方案。


    ## 为什么大数据很重要？


    在本节中，我们将观察一些趋势。大数据平台供应商将专注于构建更具模块化的大数据平台，并可以进行定制以满足企业的特定需求。为了给用户提供完整的解决方案，大数据平台提供了相关工具。


    ## 大数据平台的趋势


    大数据平台将成为所有大数据解决方案和服务的中央神经系统。因此，人们越来越需要找到方法使平台更加灵活和模块化，以适应各种用途。


    为了创建一个能够满足企业多样化需求的大数据平台，平台将是模块化且开源的。这将允许不同的企业使用平台，提供灵活性并帮助企业将平台与其现有的系统和工具集成。


    ## 大数据的出现


    大数据平台有两种类型：


    - `Data warehouses`：数据仓库为存储和处理提供中心枢纽。

    - `Data lakes`：数据湖与数据仓库类似，但它们通常是开源的。


    ## 大数据的趋势


    大数据可以分为四大类：


    - **战略性分析 (Strategic Analytics)**：这是一个衡量业务结果并发现模式以了解个人或组织行为的过程。

    - **运营性分析 (Operational analytics)**：这是一个从系统中收集信息并从中获得洞察以提高运营性能的过程。

    - **商业智能 (Business intelligence)**：这是一个对从系统中收集的信息生成可操作报告的过程，以帮助组织做出明智的决策。

    - **应用程序接口 (API)**：这是一套即插即用的 `API`（应用程序接口）工具，简化了企业应用程序中的编程工作。


    ## 企业应用的趋势


    预计大数据平台市场在未来几年内以 30% 的复合年增长率（CAGR）增长。因此，采用大数据平台和服务的企业数量预计将增长。

