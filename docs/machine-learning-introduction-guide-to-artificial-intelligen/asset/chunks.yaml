    本书旨在解释这些内容并帮助你开启机器学习之旅。编写这本书正是为了解释这些概念并帮助你开始机器学习。


    # 引言


    ## 什么是机器学习？


    如果你像大多数人一样，那么你对“大数据”这个短语并不熟悉。


    大数据是科技领域各种语境下使用的分析类热词。在企业语境下，这意味着通过分析数据来发现模式和趋势，并改进结果。


    虽然这可能不是非常直观，但机器学习（ML）是一种最适用于企业 IT 环境的机器学习类型。机器学习（ML）是一种可以从经验中学习的机器学习类型，而不仅仅是收集数据。


    “学习”意味着机器从人类（或其他）用户以及内部业务数据中获取经验。计算机系统可以使用这些数据来改进其算法和准确性，并提高其未来处理数据的能力。


    云原生基金会（Cloud Native Computing Foundation）对机器学习的定义是：


    “机器学习是人工智能的一个子领域，它使用机器算法进行学习。机器学习是自运行系统或学习并自我改进系统的关键组件。机器学习是一种设计能够不断适应变化和新任务的计算机系统的策略。”


    ## 云端中的机器学习


    本地计算架构是一项昂贵的业务。除非公司拥有完善的云管理环境，否则本地计算系统通常以孤立的方式执行其任务。当使用机器学习模型进行预测时，它们通常是巨大且复杂的——并且无法孤立运行。并发创建和运行多个机器学习模型的能力在公有环境中更容易实现，因为扩展性在公云环境中是一个考量因素。


    云端机器学习可以通过促进与外部数据源的通信来改进机器学习。通过创建一个可以与外部数据源通信的机器学习模型，你的公司可以收集更多关于业务的数据，并利用这些数据做出更好的决策。根据业务需求的变化，扩展模型也将变得更加容易。随着你从数据中学习，模型也将会变得更加可靠和准确，而不是去猜测会发生什么。


    ## 机器学习和容器如何结合？


    所有企业数据和计算通常由 IT 员工在本地管理。这使得业务难以无缝地将新应用程序与业务的其他部分集成。如果你希望将第三方应用程序与你的机器学习（ML）堆栈集成，你就必须对应用程序进行标准化。


    你可以通过使用容器来实现这一点。流行的容器化技术 `Docker` 用于创建隔离的虚拟机实例。


    Docker 对包括 `TensorFlow` 和 `Jupyter Notebook` 在内的机器学习技术提供原生支持，以及各种让数据收集和处理变得简洁的框架。


    随着 `Docker` 的日益流行，预计将大量让机器学习更易实现的解决方案涌现。


    例如，`Redis Labs` 提供了一个专门的机器学习项目，从 `Redis` 社区内部提供数据访问和标准化。该公司还为想在公有和私有数据上训练自定义机器学习模型的企业提供免费服务。


    ## 机器学习的其他工具


    还有其他几种实现机器学习的选择。以下是几个可以让你快速了解的选项：


    大数据湖 (CDL) —— 针对 `Hadoop`、`Spark` 和 `Spark SQL` 的容器化、基于事件的数据流水线。


    针对 `Hadoop`、`Spark` 和 `Spark SQL` 的容器化、基于事件的数据流水线。IBM 全数据单元 (GDU) —— 提供企业级机器学习服务的企业大数据项目。


    SAS 数据科学体验 —— 除了为机器学习提供研究级环境外，SAS 还提供了数据科学培训、指导和工具，例如 `SAS Inside Data Science`
    —— 这是一个允许用户学习数据科学统计方法的交互式环境。


    Google 云机器学习引擎（Cloud Machine Learning Engine） —— 一个为数据科学家、模型训练师和数据工程师设计的开源平台。


    ## 企业机器学习将如何改变我们的工作方式？


    机器学习已经应用于各种场景中，从销售分析到挖掘市场趋势数据。


    示例包括：图像识别技术，它可以帮助我们识别网站上的物体（如标志或汽车）；跟踪人们在城市周围的身体活动和路线；以及通过查看社交媒体应用 Feed 流中的可疑活动来应对账户欺诈。


    ## 什么是算法？


    算法简单来说就是计算机遵循的指令。计算中的每一步都被称为算法步骤。如果有很多步骤，计算机就会执行许多算法步骤。


    由于我们做出的每一个决策都是依靠计算机的，因此我们做的每个决策都依赖于算法。所以，一切都是算法。


    算法是做什么的？算法是计算机遵循的一组指令。这组指令描述了计算机行为的所有规则。例如，在验证码（captcha）中，算法告诉计算机“如果是单词，就点击它，否则不点击”。


    我们如何决定什么是算法？我们通过观察它的输出（即它对问题的答案）来判断什么是算法。来看一个解决问题的函数。


    如果一个函数解决了问题，它就有一个答案。但仅仅因为一个函数有答案并不意味着它是一个算法。


    这是一个例子：如果我们有一个名为 `squares` 的函数，那么 `squares(x) = sqrt(x)`。平方并没有算法，所以 `squares`
    执行什么并不重要。


    ## 为什么 Python 和数据科学结合得很好？


    Python 拥有丰富且成熟的生态系统。你不需要了解每一个函数，并且熟悉该社区。你可以启动一个项目，尝试各种函数并看看你喜欢什么。生态系统中的所有工具都经过测试且易于理解，支持数据处理。如果你不需要，就不需要学习像
    `R` 或 `Excel` 这样的数据语言，因此你可以专注于编写数据分析代码。然后你可以将学到的知识转移到适合你的其他语言或环境，或者你自己的语言中。


    ## Python 是一种通用编程语言


    Python 不是一种数据科学语言，也不是如此。然而，作为一种专注于服务器端编程的语言，它足够灵活，对数据分析非常有用。此外，还有大量的库（如 `pandas`
    和 `numpy`）针对处理你的数据分析进行了优化，而且这些库在 Python 中运行良好。


    使用 Python 作为你的数据科学语言有许多理由，你可能不知道从何处开始。读完这篇博客文章后，你应该渴望采取行动。答案是阅读更多、学习更多，但并非必须如此。


    # 第 1 章 机器学习


    ## 机器学习的定义是什么？


    机器学习是一种自动识别模式和组织数据的技术。你可以将其认为一种使用数学建模将数据与预测模型匹配，然后使用优化技术来充分利用你所拥有数据的价值。

    '
