- fmt: "\n# Math in Python\n\nTo perform math functions, Python offers modules such\
    \ as `chance` and `math`. Start `IDLE`. Go to the `File` menu and click `New Window`.\
    \ Enter the following:\n\n```python\nimport math\nprint (math.pi) # Edition: 3.14159\
    \ ....\nprint (math.cos (math.pi)) # The output is -1.0\nprint (math.exp (10))\
    \ # The output is 22026.4….\nprint (math.log10 (100)) # The output is 2\nprint\
    \ (math.factorial (5)) # The output is 120\n```\n\n### exercise\nWrite a Python\
    \ program that uses `math` functions from the `math` module to do the following:\n\
    a. Place of 34\nb. `Log10(10000)`\nc. `Cos 45` x `sin 90`\nd. Exponent of 20\n\
    \n# Random function in Python\n\nStart `IDLE`. Go to the `File` menu and click\
    \ `New Window`. Enter the following:\n\n```python\nimport Math\nPrint (random.shuffle_num\
    \ (11, 21))\ny = ['f', 'g', 'h', 'm']\nprint (random.pick (y))\nrandom.anypic\
    \ (y)\nprint (y)\nprint (your_pick.random ())\n```\n\n# Lists in Python\n\nWe\
    \ create a list in Python by putting elements called `elements` in square brackets,\
    \ separated by commas. Items in a file can be mixed. Start `IDLE`. Go to the `File`\
    \ menu and click `New Window`. Enter the following:\n\n```python\nlist_mine =\
    \ [] # empty list\nlist_mine = [2,5,8] # List of integers\nlist_mine = [5, \"\
    Happy\", 5.2] #List of mixed data types\n```\n\n### To do work\nWrite a program\
    \ that lists the following: \"Best\", 26, 89, 3.\n\n# Nested lists\n\nA nested\
    \ list is a list as an element in another directory. example\n\nStart `IDLE`.\
    \ Go to the `File` menu and click `New Window`. Enter the following:\n\n```python\n\
    list_mine = [\"Carrot\", [9, 3, 6], ['g']]\n```\n\n### exercise\nWrite a nest\
    \ for the following elements: `[36,2,1], \"Writer\", 't', [3.0, 2.5]`.\n\n# Access\
    \ items from a list\n\nIn programming and especially in Python, the first time\
    \ is always indexed with zero. For a list of five elements, we access `index4`\
    \ from `index0`. If you do not access items in a file in this way, an index error\
    \ is generated. The index is always an integer because using other types of numbers\
    \ causes such a failure. For nested lists that are accessed through nested indexing.\
    \ example \n\nStart `IDLE`. Go to the `File` menu and click `New Window`. Enter\
    \ the following:\n\n```python\nlist_mine = ['b', 'e', 's', 't']\nprint (list_mine\
    \ [0]) # The output is b\nprint (list_mine [2]) # The output is s\nprint (list_mine\
    \ [3]) # The output is t\n```\n\n### exercise\nGiven the following list: `your_collection\
    \ = ['t', 'k', 'v', 'w', 'z', 'n', 'f']`\na. Write a Python program to display\
    \ the second element in the list.\nb. Write a Python program to display the sixth\
    \ element in the last.\nc. Write a Python program to display the last item in\
    \ the list.\n\n# Indexing nested lists\n\nStart `IDLE`. Go to the `File` menu\
    \ and click `New Window`. Enter the following:\n\n```python\nnested_list = [\"\
    Best ', [4,7,2,9]]\nprint (nested_list [0] [1])\n```\n\n# Python negative indexing\n\
    \nPython allows negative indexing for its sequences. The last element in the list\
    \ is `index-1`, `index -2` is the penultimate element and so on. Start `IDLE`.\
    \ Go to the `File` menu and click `New Window`. Enter the following:\n\n```python\n\
    list_mine = ['c', 'h', 'a', 'n', 'g', 'e', 's']\nprint (list_mine [-1]) # The\
    \ output is s\nprint (list_mine [-4]) # The output is n\n```\n\n# Slicing lists\
    \ in Python\n\nThe slicing operator (colon `:`) is used to access several items\
    \ in a list. example \n\nStart `IDLE`. Go to the `File` menu and click `New Window`.\
    \ Enter the following:\n\n```python\nlist_mine = ['c', 'h', 'a', 'n', 'g', 'e',\
    \ 's']\nprint (list_mine [3: 5]) # Press points 4 to 6\n```\n\n### example\nSelection\
    \ of items from start to fifth idle start. Go to the `File` menu and click `New\
    \ Window`. Enter the following:\n\n```python\nprint (list_mine [: - 6])\n```\n\
    \n### example\nSelect the third to the last element. print \n```python\nprint\
    \ (list_mine [2:])\n```\n\n### To do work\nGiven `class_names = ['John', 'Kelly',\
    \ 'Yvonne', 'A','ve ',' ' Pio ', 'Tracy']`\na. Write a Python program with the\
    \ slice operator to display it by the second student and the rest.\nb. Write a\
    \ Python program with the slice operator to display the first student with the\
    \ negative indexing function to the third student.\nc. Write a Python program\
    \ with the slice operator to display only the fourth and fifth student.\n\n# Edit\
    \ items in a list with the assignment operator\n\nThe elements in a list can be\
    \ edited. This means that the files can be deleted. Start `IDLE`. Go to the `File`\
    \ menu and click `New Window`. Enter the following:\n\n```python\nlist_yours =\
    \ [4,8,5,2,1]\nlist_yours [1] = 6\nPRINT (list_yours) # The output is [4,6,5,2,1]\n\
    ```\n\n# Edit several items in a list\n\nStart `IDLE`. Go to the `File` menu and\
    \ click `New Window`. Enter the following:\n\n```python\nlist_yours [0: 3] = [12,11,10]\
    \ # List of integers\n```\n\n*(Note: The remaining text contained significant\
    \ repetitive/garbled phrases in the source which have been cleaned up based on\
    \ the core logic provided.)*"
