    ## Conversion type


    Sometimes called constraint, type conversion allows us to change one type of number
    to another. Preinstalled functions like `float()`, `int()` and `complex()` enable
    implicit and explicit type conversions. The same features can be used to change
    strings.


    ### example

    Start IDLE. Go to the File menu and click New Window. Enter the following:

    ```python

    int (5.3) # Gives 5

    int (5.9) # Gives 5

    ```

    `int()` creates a truncation effect when applied to float numbers. The part of
    the decimal point is simply released without rounding. Let''s look at the following
    for `float()`:

    Start IDLE. Go to the File menu and click New Window. Enter the following:

    ```python

    float (6) # Gives 6.0

    Complex (''4 + 2j'') # Gives (4 + 2y)

    ```


