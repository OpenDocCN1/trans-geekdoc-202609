  trans: "\n\n# 第 4 章：Python 基础操作\n\n到目前为止，我们使用了加法运算符（`+`），它也可以作为链操作符（附加指令）。然而，我们想要扩展运算符列表，这引向了\
    \ Python 中的主要运算符。\n\n## 算术字符\n\n乘法（`*`）、除法（`/`）、减法（`-`）和加法（`+`）是处理数字的算术运算符。\n\n\
    #### 后活动\n编写并运行以下程序。\n\n#### a. 差\n```python\nnumber1 = 35 # 声明第一个数字\nnumber2\
    \ = 12 # 声明第二个数值差\ndifference = number2-number1 # 声明差 (difference)\n# 调用 print\
    \ 函数显示差\n```\n\n#### b. 乘法\n```python\nnumber1 = 2 # 声明第一个数字\nnumber2 = 15 # 声明第二个数字\n\
    product = number1 \\* number2 # 声明打印的乘积 (product)\n# 调用 print 函数指示哪个乘积是多少\n```\n\
    \n#### c. 除法\n```python\nnumber1 = 10 # 声明第一个数字\nnumber2 = 50 # 声明第二个数字\nDivision\
    \ = Number2 / Number1 # 声明打印的除法 (Division)\n# 调用 print 函数指示哪个除法有余数\n```\n\n##\
    \ 取模\n\n取模运算符用于返回分割后的剩余部分。共享取模 `module =% divisor`。\n\n### 示例\n启动 IDE。前往 File（文件）菜单并点击\
    \ New Window（新窗口）。输入以下：\n```python\nnumber1 = 2 # 声明第一个数字\nnumber2 = 15 # 声明第二个数字\n\
