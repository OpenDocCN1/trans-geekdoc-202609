    that the variable num1 (our abbreviation of number1, first number) was assigned
    4 before the program was run. The second line num2 = 5 indicates that the variable
    num2 (our abbreviation for number2, second number) was assigned 5 before the program
    was run. The computer interprets these instructions and saves the specified numbers
    The third line sum = num1 + num2 tells the computer that it takes everything that
    has been given and adds to what has been given. In other words, add the values
    ​​ of num1 and num2. The fourth print line (total) means that the specified total
    is displayed. If we add double quotes, the computer simply shows the sum of the
    words and not the amount of the two numbers! Think of this cliché, where machines
    are garbage inside and out. They follow what you give them! Note: + is an operator
    for adding variables and has other users that will be explained later. Now let''s
