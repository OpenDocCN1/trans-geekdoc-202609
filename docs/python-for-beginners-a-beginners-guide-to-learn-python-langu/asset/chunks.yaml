  trans: "\n\n要完成工作：\na. 使用列表访问方法反序显示以下项：`List_yours = [4,9,2,1,6,7]`\nb. 使用列表访问方法统计\
    \ a 中的项数。\nc. 使用列表访问方法对 a 中的项按升序/预定义顺序进行排序。\n\n### 用于编辑 列表的集成 Python 函数\n\n| 方法\
    \ | 描述 | 方法 | 描述 |\n| --- | --- | --- | --- |\n| `enumerate()` | 返回一个枚举对象，包含列表中所有元素的索引和值（元组形式）。\
    \ | `len()` | 返回列表的长度。 |\n| `sorted()` | 返回一个重新排序的列表，但不对列表本身进行排序。 | `any()` |\
    \ 如果列表中项为真，则返回 True。如果列表为空，则返回 False。 |\n| `Total()` | 返回列表中所有项之和。 | `Minimum()`\
    \ | 返回列表中的最小项。 |\n| `Max()` | 返回列表中最大的项。 | `all()` | 如果列表所有元素均为真，则返回 True。 |\n\
    \n### Python 中的元组 (Tuple)\n元组类似于列表，但我们不能更改元组中的元素。\n\n**示例**\n启动 IDLE。进入 File 菜单并点击\
    \ New Window。输入以下：\n```python\ntuple_mine = (21, 12, 31)\nprint(tuple_mine)\n\
    tuple_mine = (31, \"Green\", 4.7)\nprint(tuple_mine)\n```\n\n### 访问 Python 元组元素\n\
    **示例**\n启动 IDLE。进入 File 菜单并点击 New Window。输入以下：\n```python\ntuple_mine = ['t',\
    \ 'r', 'o', 'g', 'r', 'a', 'm']\nprint(tuple_mine[1]) #输出: 'r'\nprint(tuple_mine[3])\
    \ #输出: 'g'\n```\n\n#### 负索引\n和列表一样，元组也可以使用负索引进行索引。与列表类似，`-1` 指向最后一个最后一个元素，`-2`\
    \ 指向倒数第二个元素。\n**示例**\n启动 IDLE。进入 File 菜单并点击 New Window。输入以下：\n```python\ntuple_mine\
    \ = ['t', 'r', 'o', 'g', 'r', 'a', 'm']\nprint(tuple_mine[-2]) # 输出是 'a'\n```\n\
    \n#### 切片 (disc)\n切片运算符冒号 `:` 用于访问元组中的多个元素。\n**示例**\n启动 IDLE。进入 File 菜单并点击 New\
    \ Window。输入以下：\n```python\ntuple_mine = ['t', 'r', 'o', 'g', 'r', 'a', 'm']\n\
    print(tuple_mine[2:5]) # 输出: 'o ',' g ',' r ',' un '\nprint(tuple_mine[:-4]) #\
    \ 'Gram'\n```\n\n#### 注意事项\n元组元素是不可变的，这意味着它们不能被更改。然而，我们可以使用 `+`（连接运算符）在元组中组合元素。我们也可以像列表一样，使用\
    \ `*` 运算符在元组中重复元素。\n**示例**\n启动 IDLE。进入 File 菜单并点击 New Window。输入以下：\n```python\n\
    print((7, 45, 13) + (17, 25, 76))\nprint((\"Different\",) * 4)\n```\n\n#### 注意事项\n\
    由于我们不能更改元组中的元素，因此无法删除单个项。然而，可以使用 `del` 关键字删除整个元组。\n**示例**\n启动 IDLE。进入 File 菜单并点击\
    \ New Window。输入以下：\n```python\ntuple_mine = ['t', 'r', 'o', 'g', 'r', 'a', 'm']\n\
    del tuple_mine\n```\n\n### Python 中可用的元组方法\n处理元组只有两种方法可用：`count()` 和 `index(y)`。调用时，它返回第一个与\
    \ y 相同的元素的索引。\n**示例**\n启动 IDLE。进入 File 菜单并点击 New Window。输入以下：\n```python\ntuple_mine\
    \ = ['t', 'r', 'o', 'g', 'r', 'a', 'm']\nprint(tuple_mine.count('t'))\nprint(tuple_mine.index('l'))\n\
    ```\n\n#### 成员测试\n用于检查指定项是否在元组中的关键字是 in。\n**示例**\n启动 IDLE。进入 File 菜单并点击 New Window。输入以下：\n\
    ```python\ntuple_mine = ['t', 'r', 'o', 'g', 'r', 'a', 'm']\nprint('a' in tuple_mine)\
    \ # 输出: True\nprint('k' in tuple_mine) # 输出: false\n```\n\n#### 与元组的集成 Python\
    \ 函数\n\n| 方法 | 描述 | 方法 | 描述 |\n| --- | --- | --- | --- |\n| `enumerate()` | 返回一个枚举对象。包含所有元素的索引和值对。\
    \ | `tuple()` | 将可迭代对象转换为元组。 |\n| `sorted()` | 获取元组中的项并返回一个新的有序列表（不要对元组本身进行排序）。\
    \ | `Max()` | 返回元组中最大的元素。 |\n| `all()` | 如果元组中的所有元素均为真（或元组为空），则返回 True。 | `Total()`\
    \ | 返回元组中所有元素的和。 |\n| `len()` | 返回元组的长度（元素个数）。 | `Minimum()` | 返回元组中最小的元素。 |\n\
    | `any()` | 如果列表中至少有一个项为真，则返回 True。如果列表为空，则返回 False。 | |\n\n### 字符串 (String)\n\
    字符串是不可变的，这意味着一旦创建就不能更改。\n**示例**\n启动 IDLE。进入 File 菜单并点击 New Window。输入以下：\n```python\n\
