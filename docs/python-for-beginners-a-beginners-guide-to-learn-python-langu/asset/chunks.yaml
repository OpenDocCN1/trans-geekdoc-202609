    Python 缩进用于 Python 块中分类器的行。在 Python 中 中使用的缩进量完全取决于程序员。然而，确保一致性至关重要。按照习惯，使用四个空格而不是制表符来缩进。例如：注意：我们将在下方说明提供什么类型的程序。重写
    Python 代码也有助于使程序整洁。重新输入可以创建连贯性。然而，如果你对行的延续部分进行缩进，这是可以忽略的。错误的缩进会导致缩进错误（indentation
    error）。修正后的缩进 Python 程序可以继续运行，从人类可读性的角度来看，它们可以保持有序且一致。


    ### Python 中的注释

    在编写 Python 程序或其他编程语言时，注释至关重要。注释用于描述应用程序内部正在发生的情况。通过阅读包含的注释，其他人可以更容易查看计划，并了解程序在做什么。注释对程序员也很有用，因为你可能会忘记编写的计划中的关键细节。在
    Python 中，编写注释之前使用哈希符号（`#`）。这种限制扩展到了换行符。Python 解释器通常会忽略注释。注释是为了让程序员更好地理解程序。


    #### 示例 I

    1. 启动 IDLE。

    2. 进入文件（File）菜单并点击新窗口（New Window）。

    3. 输入以下内容：

    ```python

    #这是我的第一条注释

    #程序打印 Hello World

    Print (''Hello World'')

    # 这是一个用于显示的集成函数

    ```

    4. 在文件中，点击菜单上的保存（Save）。输入名称 `myProgram5.py`。

    5. 进入运行状态并点击运行模块（Run Module）来运行程序。


    #### 练习任务

    此练习补充了我们目前为止涵盖的大部分内容。

    a. 写一个程序相加两个数字 `45` 和 `12`，并在每行代码中包含单独的。

    b. 写一个程序查看两个员工的名字，第一个员工是 `"Daisy"`，第二个员工是 `"Richard"`。为每行代码添加单独的注释。

    c. 写一个程序查看学生注册号，其中学生姓名和注册号对应为：`Yvonne = 235`、`Ian = 782`、`James = 1235`、`Juliet
    = 568`。


    ### 多行注释

    就像多行程序的语句一样，我们也有多行注释。有几种方法可以在多行上编写注释。


    第一方法是在每行注释的开始处输入哈希符号（`#`）。例如：

    1. 启动 IDLE。

    2. 进入文件（File）菜单并点击新窗口（New Window）。

    3. 输入以下内容：

    ```python

    # 我将写一条长注释行

    # 注释将移动到这一行

    # 并最终在这里结束。

    ```


    编写多行注释的另一种方法是使用三引号或三双引号：`''''''` 或 `"""`。我们在 Python 中使用三引号处理多行字符串和多行注释。警告：当在 docstring（文档字符串）中使用时会生成额外的代码，但在这种情况下，我们不需要担心这个。


    #### 示例

    1. 启动 IDLE。

    2. 进入文件（File）菜单并点击新窗口（New Window）。

    3. 输入以下内容：

    ```python

    """这也是 Python 中多行注释的一个极佳示例""

    """

    ```


    ### Python 的 docstring

    在 Python 中，docstring 指包含描述的字词，并作为函数、模块、方法或类定义中的初始程序语句编写。（我们稍后会处理这个）。Python 中的
    docstring 使用三引号编写。


    ### 集成后续练习

    本次练习使用了之前讨论过的几项练习。

    a. 使用以下程序声明：`Color1 = ''red''`。

    b. 考虑以下程序：`student_age = 23`、`student_age = 19`、`student_age = 50`。

    c. 使用 Python 运算符查找 `student_age`。

