    ## Python libraries for data analysis


    The Python programming language helps developers create games for mobile phones
    and other applications. Given the increasing demand for data scientists, beginners
    and professionals are looking for resources to learn the art of data presentation.
    Once you understand how to manage unstructured information, let''s take a look
    at some Python libraries that are useful for all.


    1. `numpy`: It is the first choice for data scientists and developers who know
    technologies that deal with data. It is a Python package available for scientific
    calculations and is registered under BSD license. With `numpy`, you can use n-dimensional
    array objects, C++, and FORTRAN programs based on integration tools functions
