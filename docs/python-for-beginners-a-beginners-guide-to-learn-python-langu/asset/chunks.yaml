    # Chapter 2 Basics of the Python programming language


    Python is a procedural and object-oriented coding language. It has a simple syntax.
    The Python programming language is cross-platform. This means that it can run
    under various operating system environments such as `Linux`, `Windows`, `Mac OS
    X` and `UNIX` and can be ported to virtual `.NET` and Java machines. The Python
    programming language is free and open source. While Python is preinstalled in
    newer versions of Mac and `Linux`, it is recommended to install and run the current
    version.


    ## Install Python


    The latest versions of `Linux` and `Mac` have already installed Python. However,
    you may need to install Python. The steps for installing Python on `Windows` ,
    `Mac OS X` or `Linux` are described below.


    ### Install Python on the Macintosh X operating system

    i. Visit the Python download page, which is the credible site, and click "Download
    Python 3.7.2" (version may differ from the one shown here).

    ii. When the download is complete, click `Open Package` and follow the instructions.
    The installation should be completed with the "Installation was successful" request.

    iii. Now visit Download Notepad ++, download and install the text editor by opening
    the package and following the instructions in the message. The `Notepad ++` text
    editor is free of charge and is suitable for writing source code (raw text programming
    words).


    ### Installation of Python under the Windows operating system

    i. Visit the recommended Python download site and click `Download Python 3.7.2`
    (the version may differ from the one shown here).

    ii. When the download is complete, open the package by clicking and following
    the guidelines provided. Python should be installed with the "Installation was
    successful" prompt. If you install Python correctly, a program called `IDLE` will
    also be installed. `IDLE` is a graphical user interface when you work with Python.
    `IDLE` is an integrated development environment for the Python programming language,
    which has long been bundled with the implementation of the word. It is usually
    packaged as an optional part with numerous `Linux` variants. It is written entirely
    in the `Tkinter` GUI Toolkit and Python.

    iii. Now visit Download Notepad ++, download and install the text editor by opening
    the package and following the instructions in the message. The `Notepad++` text
    editor is free of charge and is suitable for writing source code (raw text programming
    words).


    ## Ways to run Python


    Before we run our first Python program, it is essential to understand how we can
    run Python programs. Running or executing or distributing or activating a program
    simply means that we are processing instructions/lines of code for processing
    the computer. For example, if the machine needs to display a message in the lines
    of code (programs), this should be the case. Here are ways to run Python programs.


    The interpreter is a unique program that is installed during the installation
    of the Python package and helps to convert the text code into a language that
    the computer understands and to which it can respond (`Run`).


    ### i. Immediate mode

    This allows Python programs to be run that are not written to a file. We switch
    to the instant mode by typing the word `Python` on the command line. This triggers
    the interpreter in immediate mode. You can type expressions directly, and pressing
    Enter will generate the output. The following character is the python prompt:
    `>>>`. The Python prompt instructs the interpreter to accept user input. For example,
    if you type `2 + 2` and press Enter, `4` is displayed as the output. In a sense,
    this prompt can be used as a calculator. If you need to exit instant mode, type
    `quit()` or `exit()`. Now type `5 + 3` and press Enter. The output should be `8`.
    The next mode is the script mode.


    ### ii. Script mode

    Script mode is used to run a Python program written in a file. The file is called
    a script. Scripts can be stored in an external archive such as a hard disk for
    later use. All Python scripts have the extension `.py`, which means that the file
    name ends with `.py`. An example is `myFirstProg.py`. We''ll explain later how
    to write Python scripts.


    ## The integrated development environment (IDE)


    An `IDE` is a convenient way to write and run Python programs. You can also use
    text editors to create a Python script file instead of an IDE by writing lines
    of code and saving the file with a `.py` extension. However, using an IDE can
    make it easier to write and run Python programs. The `IDEL` in the Python package
    is an example of an IDE with a graphical user interface and is installed together
    with the Python language. Benefits of IDE include helping you eliminate repetitive
    tasks and simplifying coding for beginners. Among other things, IDE offers syntax
    highlighting, code hints and syntax checking. There are also commercial IDEs like
    overview.


    ## Overview


    We introduced the Python programming language, how to download and install Python,
    the instant and script modes of the Python IDE, and what an IDE is.


    ## Your first Python program


    The rest of the figures assume that Python programs run in a `Windows` environment.

    1. Start `IDLE`

    2. Go to the `File` menu and click `New Window`.

    3. Enter the following:

    ```python

    print ("Hello world!")

    ```

    4. In the file, click `Save` on the menu. Enter the name of `myProgram1.py`.

    5. Go to `Run` and click `Run Module` to run the program.


    The first program we wrote is called "Hello World!" and is used not only to give
    an introduction to a new computer coding language but also to test the basic configuration
    of the IDE. The output of the program is "Hello world!"


    Here''s what happened: `Print()` is an integrated function that is pre-written
    and preinstalled for you. It is used to display everything contained in `()` as
    long as it is between double-quotes. The computer shows everything that is written
    in double-quotes.


    ## To do work


    Now write and execute the following Python programs:

    ```python

    print ("I am now a Python language encoder!")

    print ("This is my second simple program!")

    print ("I love the simplicity of Python")

    print ("I show everything in quotes, like owyhen2589gdbnz082")

    ```


    Now we have to write a program with numbers, but before we write such a program,
    we have to learn something about variables and types. Remember that Python is
    object-oriented and not statically typed. This means that you don''t have to declare
    variables before using them. We explain this statement; Object-oriented language
    simply means that language supports the visualization and manipulation of real
    scenarios such as groups that can be connected and shared by imitating the natural
    order of things. Not all programming languages are object-oriented; for example
    the C programming language is not object-oriented. When programming, declaring
    variables means that we explicitly state the type. The variable can be reported
    as integer, long integer. For example, `number1` can take any number from `0`
    to infinity. However, if we explicitly specify this `int1`, it means that location
    only accepts integers and no fractions. Fortunately or unfortunately, Python does
    not require that we expressly leave the type (declaring variables).


    Before we look at the types of variables and the rules for writing variables,
    let''s run a simple program to understand what variables are:

    a. Start `IDLE`

    b. Go to the `File` menu and click `New Window`

    c. Enter the following:

    ```python

    num1 = 4

    num2 = 5

    sum = num1 + num2

    print (sum)

    ```

    d. In the file, click `Save` on the menu. Enter the name of `myProgram2.py`.

    e. Go running and click `Run Module` to run the program. The expected output of
    this program should be `9` without quotes.


    ### Explanation


    At this point, you want to understand what happened and why `print(sum)` does
    not contain quotes like the first programs we wrote. The first line `num1 = 4`
    indicates that the variable `num1` (our abbreviation for `first number`) was assigned
    `4` before the program run. The second line `num2 = 5` indicates that the variable
    `num2` (our abbreviation for `second number`) was assigned `5` before the program
    run. The computer interprets these instructions and saves the specified numbers.
    The third line `sum = num1 + num2` tells the computer that it takes everything
    that has been given and adds what has been given. In other words, add the values
    of `num1` and `num2`. The fourth line `print(sum)` means that the specified `total`
    is displayed. Note: `+` is an operator for adding variables and has other uses
    later.


    ## Variables


    We used `num1`, `num2` and `sum`, and the variable names were not just random
    but had to follow certain rules and conventions. We cannot violate the rules,
    while the conventions are very similar to the recommended way. Let''s start with
    the rules:


    ### The rules for when to name variables in Python

    i. Variable names must always begin with a letter or underscore e.g. `enum1`,
    `_NUM1`.

    ii. The rest of the variable name can consist of numbers, letters and underscores,
    e.g. `number1`, `num_be_r`.

    iii. A distinction is made between the upper and lower case for variable names.
    This means that upper and lower case letters are treated differently. `Num1` is
    treated differently with `num1`.


    ### Homework one

    You can write/suggest five variables for

    a. Infirmary.

    b. Bank.

    c. Media house.

    With `scrip = 75`, `scr4 = 9`, `sscr2 = 13`, `Scr = 18`.

    The names of the above variables should represent dozens of students. Rewrite
    the variables to comply with the rules and conventions of the Python variables.


    ### Conventions for naming variables in Python

    As mentioned above, conventions are not rules in themselves, but established traditions
    that add value and readability to the way we name variables in Python.

    i. readability. Your variables should give you an idea of what they are managing
    because the programs must be read by someone other than the person who writes
    them. `number1` is natural to read compared to `n1`. `first_name` is also easy
    to read compared to `fname` or `fn`. This implies that both variables are valid/acceptable
    variables in Python, but the convention forces us to write them in an easily readable
    form.

    ii. Use descriptive names when writing your variables. For example, `number1`
    describes `yale` or `mything` as the variable name. In other words, we can write
    `yale` to take values for `number1`, but the name doesn''t reveal what we''re
    doing. Remember this when writing programs. Suppose someone else keeps it. The
    person should be able to understand what the program is about before executing
    it quickly.

    iii. Avoid using the uppercase ''O'', the lowercase ''l'' and the uppercase ''I''
    because of the confusion as these can be confused with numbers. In other words,
    using these letters does not violate the writing of variables, but including them
    as variable names is confusing.


    ### Homework two

    Rewrite the following variable names in (1) to be valid variable names and follow
    (2) the writing convention for variable names.

    a. `23doctor`

    b. `line 1`

    c. `Option3`

    d. ` desk`

    e. `# cup3`


    ### Task two

    Write/suggest variable names that are (1) valid and (2) conventional. You want
    to add three numbers. You want to save the names of four students.

    a. `Daniel`

    b. `Brenda`

    c. `Rita`

    d. `Luke`

    e. `Kelly`


