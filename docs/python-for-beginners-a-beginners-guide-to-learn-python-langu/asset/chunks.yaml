    f. 16

    g. 19th Decimal


    ## Decimal in Python


    ### Explanation

    The computer works with finite numbers, and the fractions cannot be saved in their
    raw form because they generate an infinitely long binary sequence.


    ## Python fractions


    The fraction module in Python enables operations with fractional numbers.


    ### example

    ```python

    Import fractions

    print (Fractions.my_Fraction (2.5)) # edition 5/2

    print (Fractions.my_Fraction (4)) # edition 5

    print (Fractions.my_fraction (2.5)) # Edition 2/5

    ```

    **Important:** Creating `my_fraction` from float can lead to unusual results due
    to the misleading representation of the double movement point.

