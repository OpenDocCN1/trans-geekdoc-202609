    \ New Window。输入以下：\n```python\ns = \"Python\"\nprint(s[0:4]) # 输出: 'Pyth'\nprint(s[:-2])\
    \ # 'Pytho'\n```\n\n#### 注意事项\n字符串是不可变的，这意味着它们不能被更改。然而，我们可以使用 `+`（连接运算符）拼接字符串。我们也可以使用\
    \ `*` 运算符重复字符串。\n**示例**\n启动 IDLE。进入 File 菜单并点击 New Window。输入以下：\n```python\nprint(\"\
    Hello\" + \"World\")\nprint(\"Ab\" * 3)\n```\n\n#### 注意事项\n由于我们不能更改字符串中的元素，因此无法删除单个字符。然而，可以使用\
    \ `del` 关键字删除整个字符串变量。\n**示例**\n启动 IDLE。进入 File 菜单并点击 New Window。输入以下：\n```python\n\
    s = \"Hello\"\ndel s\n```\n\n### Python 中可用的字符串方法\n处理字符串只有两种方法可用：`count()` 和 `index(y)`。调用时，它返回第一个与\
