    ### 导入到 Python

    我们到目前运行的程序很小，但实际上，一个应用程序可能包含数百到数千行代码。在这种情况下，一个大型程序被分成称为模块的小型单元。这些模块是相关的，但位于以 `.py`
    结尾的不同文件中。Python 允许使用 `import` 关键字将一个模块导入另一个模块。


    **类比：** 假设我们需要访问数学 `pi`，它是另一个模块。以下程序将说明：


    ```python

    import math # 指向 math 模块的内容

    print (math.pi) # 现在使用了数学引用包含的功能

    ```


    ### 概述

    类型转换是指将一种数据类型的值更改另一种数据类型的过程。记住拆分两个整数可能会得到小数。在这种情况下，你需要将整数强制转换为浮点数。Python 编程语言有两种翻译（转换）：隐式类型转换和显式转换。在
    Python 中，输入和输出（I / O）活动由内置函数完成。`print()` 执行输出/显示，而 `input()` 执行输入活动。Python 中的命名空间是指名称的集合。虽然不同的命名空间可以存在，但它们是完全隔离的。


