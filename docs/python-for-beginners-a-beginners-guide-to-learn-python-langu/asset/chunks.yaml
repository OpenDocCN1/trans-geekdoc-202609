  trans: "\n还有另一种提取模型的方法：\n\n```python\nimport right text = 'he is a boy' style =\
    \ 'boy' match = king. Indall (style, phone number) print (matches)\n```\n\n另一种方法是：\n\
    \n```python\nTelephone number = 'asdfgh' print (phonenumber.split ('@')) \n```\n\
    \n```python\nimport right Telephone number = 'asdfgh' style = '\\[az\\] +' match\
    \ = king. Indall (style, phone number) print (matches)\n```\n\n```python\nimport\
    \ right Telephone number = 'asdfgh' style = '\\[az \\\\.\\] +' match = king. Indall\
    \ (style, phone number) print (matches)\n```\n\n```python\nTelephone number =\
    \ 'asdfgh' print (phonenumber.split ('@'))\n```\n\n如果元素的格式与直接从文件中提取出的格式不同：\n\n\
    ```python\nimport right price = 'RetailPrice: $ 39.25' expression = 'RetailPrice:\
    \ \\\\ $ (\\[\\\\ d,\\] + \\\\.  \\\\ d +)' combo = re.search (expression, price)\
    \ print (combo.group (0)) print (combo.group (1))\n```\n\n如果你想将字符串转换为浮点数，必须将 \"\
    ,\" 替换为 \".\"。\n\n```python\ndisc = '39 .25 ' disc = disc.replace (',', '') press\
    \ (float)\n```\n\n## 操作\n\n这三种操作是交集、并集和差集。我们定义两个集合：\n`set_one = {1, 2, 3, 4, 5}`\n\
    `set_two = {1, 3, 5, 7, 9, 11}`\n\n两者都包含一些数字；你可能会发现两个集合之间的某些名称是的，某些数字不同。你可能知道集合的交集，它影响两个集合之间的共同元素。\n\
    \n```python\nprint (set_one.intersection (set_two)) # {1, 3, 5}\nprint (set_one\
    \ & set_two) # {1, 3, 5}\n```\n\n两个集合的并集也是一种操作，将两个集合的元素合并到一个集合中。两个集合的共同元素被采用且不重复，并且项目按顺序排序。\n\
    \n```python\nprint ({1, 2} .union ({2, 3})) # {1, 2, 3}\nprint ({1, 2} | {2, 3})\
    \ # {1, 2, 3}\n```\n\n有一种你可能已经知道的操作。句句之间的差集，即一个句子减去另一个句子。差集操作返回一个句子中不在另一个句子中的所有元素。共同因子从集合中移除，并指定剩余成分。\n\
    \n```python\nprint ({1, 2, 3, 4} .differenz ({2, 4})) # {1, 3}\nprint ({1, 2,\
    \ 3, 4} - {2, 4}) # {1, 3}\n```\n\n```python\nset_one = {1, 2, 3, 4, 5}\nset_two\
    \ = {1, 3, 5, 7, 9, 11}\nprint (set_one.intersection (set_two)) # {1, 3, 5}\n\
    print (set_one & set_two) # {1, 3, 5}\nprint ({1, 2} .union ({2, 3})) # {1, 2,\
    \ 3}\nprint ({1, 2} | {2, 3}) # {1, 2, 3}\nprint ({1, 2, 3, 4} .differenz ({2,\
    \ 4})) # {1, 3}\nprint ({1, 2, 3, 4} - {2, 4}) # {1, 3}\n```\n\n## 类\n\n类是对象的模型。如你所知，对象被定义为一组数据变量和处理数据的函数。类就像是盖房子之前的草图、建筑模型、窗户、门等所有提到的内容。类就像草图，而创建的对象就像房子。它是根据级别设计的。可以使用草图创建许多房子。类可以创建许多对象。\n\
    \n在类中，属性是数据或函数。在一个新的命名空间中，所有属性首先被定义，类和对象具有相同的名称。多个类对象可以访问这些属性。此外，这使得区分最新的目的变得容易。对象的创建被称为实例化。\n\
    \n## Python 中的上下文管理器\n\n上下文管理器用于正确管理资源。上下文管理器的必要用法是从文件中读取。首先打开文件；第二步是消耗资源（le 描述符）。资源描述符\
    \ ID 是有限的，操作系统规定了这一限制。同时只能打开数量的文件。\n\n首先，当打开文件时，操作系统提供一个打开的文件编号，用户可以使用它来打开文件，而不是授予数据本身的访问权限。这种方法有很多用处，原因之一是它可以帮助在处理过程中传递文件引用，同时保持内核的特定安全性。\n\
    \n因此产生的问题是什么是描述符“丢失”。答案很简单：不要关闭任何打开的文件。用户通常会忘记关闭 `close()` - `open()` 数据，这会导致泄漏，而且文件描述符的数量是有限的。当你关闭每个文件时，你的资源就会被保存，这是一种更自然的程序完成方式。\n\
    \n## 管理资源的高级方法\n\n在实际系统中，很难确保每个打开的文件都调用了 `close()`，特别是当……（文本继续）\n\n"
- fmt: "\n# Chapter 6: Type Conversion and Type Conversion in Python\n\nType conversion\
    \ refers to the process of changing the value of one type of programming data\
    \ to a different kind of programming data. Remember to split two whole numbers\
    \ that result in decimal numbers. In this case, you need to convert to force conversion\
    \ of an integer to a floating-point number. The Python programming language has\
    \ two types of translation: implicit type conversion and explicit conversion.\n\
    \n## 1. Implicit conversion type\n\nIn this case, Python automatically changes\
    \ one data type to another, and the process does not require user involvement.\
    \ The implicit type conversion is mainly used to avoid data loss.\n\n### example:\
    \ Conversion from integer to float\nStart IDLE. Go to the File menu and click\
    \ New Window. Enter the following:\n\n```python\nnumber_int = 451\nnumber_flo\
    \ = 4.51 \nnumber_new = number_int + number_flo\nprint (\"the data type of number_int-\"\
    , type (number_int))\nprint (\"the data type of number_flo-\", type (number_flo))\n\
    print (\"value of number_new-\" number_new)\nprint (\"data number of new_number-\"\
    , type (new_number))\n```\n\n**Explanation**\nWhen programming, two variables\
    \ are added, one of the integer data type and the other of the float type, and\
    \ the value is stored in a new variable of the float data type. Python automatically\
    \ converts small data types to more extensive data types to avoid data loss. This\
    \ is called implicit type conversion.\n\n### Important\nHowever, the Python programming\
    \ language cannot convert numeric data types to a string data type or a string\
    \ data type to an implicit digital data type. Attempting such a conversion will\
    \ result in an error.\n\n### example\nStart IDLE. Go to the File menu and click\
    \ New Window. Enter the following:\n\n```python\nnumber_int = 432 # lower data\
    \ type\nnumber_str = \"241\" # higher data type\nprint (\"The data type of number_int-\"\
    , type (number_int))\nprint (\"The data type of number_str-\", type (number_str))\n\
    print (number_int + number_str)\n```\n\n### Challenge:\nCan you imagine why this\
    \ is happening? The Python interpreter cannot understand exactly whether we want\
    \ to chain or add. If concatenation is required, the other string cannot be found.\
    \ The other number cannot be found during the addition. The solution to the previous\
    \ error is an explicit conversion.\n\n## 2. Explicit conversion\n"
