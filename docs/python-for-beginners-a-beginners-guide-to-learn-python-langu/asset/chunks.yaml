    # IDLE 示例开始。


    前往“文件”菜单并点击“新窗口”。输入以下内容：


    ```python

    print ("D: \\\\ lessons \\\\ programming")

    print ("Print \ n in two lines")

    ```


    ## 概述


    Python 支持整数、浮点数和复数。有 `int`、`float` 和 `complex` 类可以用于转换不同类型的数值数据。小数点的存在与否区分了整数和浮点数。例如，`4`
    是一个整数，而 `4.0` 是浮点数。


    程序员经常需要将十进制转换为八进制、十六进制和二进制形式。在 Python 中，我们只需通过加上特定的名称前缀即可表示二进制、十六进制和八进制系统。类型转换（有时称为约束）允许我们将一种数字类型转换为另一种。如
    `int()` 等内置函数使我们能够直接转换数据类型。同样的特性也可用于转换字符串。


    我们通过将元素（称为 `elements`）放在方括号中并用逗号分隔，在 Python 中创建一个列表。特别是在编程中，特别是在 Python 中，第一次索引总是从零开始的。对于一个包含五个元素的列表，我们从
    `index0` 访问 `index4`。如果你不以此方式访问文件中的项，就会产生索引错误。


    ## 可迭代对象 (iterable)


    在 Python 中，表是用于迭代的对象。`iterable` 一词用作：


    * 形容词：一个对象可以被表示为 `iterable` 的。

    * 名词：一个对象可以被表征为 `iterable`。


    一个对象可以传递给 `iter()`。这是一个 Python 内置函数。如果是 `iterable`，则返回一个迭代器。大多数人经常混淆 `iterable`
    和 `iterator`，但它们在所有权方面有显著区别。以下是区分它们的一些特征。


    ### 可重复的 (repeatable)


    `Iterable` 是一个可以使用 `for` 循环进行遍历的对象。可迭代对象并不一定具有长度，也不总是唯一的或可索引的。要获取迭代器，会将可迭代对象传递给内置函数
    `iter()`。


    ### 迭代器 (Iterator)


    迭代器只有一个任务：返回我们 `iterable` 中的“下一个”元素。要从迭代器获取下一个元素，可以将其传递给以下内置函数。如果没有后续元素，将抛出 `StopIteration`
    异常。当传递给 `iter()` 函数时，会返回迭代器。


    迭代器是一个值生成器，从其关联的可迭代对象接收连续的值。`next()` 函数是一个内置函数，主要用于从迭代器获取后续收益。迭代器在内部维护其状态。接收到的下一个值已经是已知的。因此，当调用
    `next()` 时，要返回的内容是预知的。


    ## 含义 (term sense)


    ### 重复 (Repetition)


    集合中项之间的循环过程。


    ### 迭代器 (Iterator)


    从其可迭代赋值生成连续值的对象。


    ### `iter()`


    从可迭代对象检索迭代器的内置函数。


    当 `for` 循环遍历字典、列表或数组时，循环变量被赋值为字典的键或列表的值或数组对应索引的值。要在循环内访问字典、列表或矩阵值，你必须像通常一样通过键创建字典、列表或矩阵引用。如下例所示。


    ![](img/rsrc2BC.jpg)

    输出：![](img/rsrc2BD.jpg)


    ## 使用指令停止和继续


    在处理 `while` 循环时，停止和继续执行循环的方式相同。`Break` 会完全停止每个循环，然后继续执行（循环后的）后续指令：


    ![](img/rsrc2BE.jpg)


    按下 "a" 和 "b"。

