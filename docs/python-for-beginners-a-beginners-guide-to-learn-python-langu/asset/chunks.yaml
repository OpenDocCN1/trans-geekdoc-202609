    print str[3:] # 打印从第四个字符开始的字符串

    print str * 3 # 打印三次序列

    print str + "I love Python" # 打印拼接后的字符串

    ```

    iv. 在文件中，点击菜单上的 `Save`。输入名称 `myProgram4.py`。运行并点击 `Run Module` 运行程序。上述程序的输出应为：

