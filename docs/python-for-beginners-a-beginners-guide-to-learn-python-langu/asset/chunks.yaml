  trans: "\n\n# 第 6 章：Python 中的类型转换与类型转换\n\n类型转换是将一种编程数据类型的值转换为另一种编程数据类型的过程。记住，当两个整数相除并得到小数时，在这种情况下，你需要将整数强制转换为浮点数进行转换。Python\
    \ 编程语言有两种类型的转换方式：隐式类型转换和显式转换。\n\n## 1. 隐式类型转换\n\n在这种情况下，Python 会自动将一种数据类型转换为另一种类型，且该过程不需要用户参与。隐式类型转换主要用于避免数据丢失。\n\
    \n### 示例：从整数到浮点的转换\n启动 IDLE。点击 File（文件）菜单并点击 New Window（新建窗口）。输入以下内容：\n\n```python\n\
    number_int = 451\nnumber_flo = 4.51 \nnumber_new = number_int + number_flo\nprint\
    \ (\"the data type of number_int-\", type (number_int))\nprint (\"the data type\
    \ of number_flo-\", type (number_flo))\nprint (\"value of number_new-\" number_new)\n\
    print (\"data number of new_number-\", type (new_number))\n```\n\n**解释**\n在编程时，将两个变量相加（一个是整数数据类型，另一个是浮点类型），结果存储在一个浮点数据类型的新变量中。Python\
    \ 会自动将较小的数据类型转换为更的数据类型以避免数据丢失。这被称为隐式类型转换。\n\n### 注意\n然而，Python 编程语言无法将数值数据类型转换为字符串数据类型，或将字符串数据类型转换为隐式数字数据类型。尝试此类转换会导致错误。\n\
    \n### 示例\n启动 IDLE。点击 File（文件）菜单并点击 New Window（新建窗口）。输入以下内容：\n\n```python\nnumber_int\
    \ = 432 # lower data type\nnumber_str = \"241\" # higher data type\nprint (\"\
    The data type of number_int-\", type (number_int))\nprint (\"The data type of\
    \ number_str-\", type (number_str))\nprint (number_int + number_str)\n```\n\n\
    ### 挑战：\n你能想象为什么会发生这种情况吗？Python 解释器无法准确判断我们是想要拼接还是相加。如果需要拼接，则找不到另一个字符串；在相加过程中，则找不到另一个数字。解决上述错误的方案是显式转换。\n\
    \n## 2. 显式转换\n\n"
- fmt: "\nHere programmers convert the data type of a named programming object into\
    \ the required data type. The explicit conversion is carried out using the functions\
    \ `float()`, `int()`, and `str()`, among others. The syntax for the exact conversion\
    \ is: `(necessary_data type) (expression)`.\n\n### Sum of a string and an integer\
    \ with explicit conversion\n\nStart IDLE. Go to the File menu and click New Window.\
    \ Enter the following:\n\n```python\nnumber_int = 431\nnumber_str = \"231\"\n\
    print (\"data type of number_int-\", type(number_int))\nprint (\"data type number_str\
    \ before type casting-\", type(number_str))\nnumber_str = int(number_str)\nnumber_sum\
    \ = number_int + number_str\nprint (\"Add number_int and number_str-\", number_sum)\n\
    print (\"Sum data type-\", type(number_sum))\n```\n\n**Note:** When you run this\
    \ program, the data types and the sum as well as an integer and a string are displayed.\n\
    \n### Explanation\nIn the program above, we added the variables `number_str` and\
    \ `number_int`. We then converted `number_str` from string (upper data type) to\
    \ an integer type (lower data type) using the `int()` function to do the sum.\
    \ Python manages to add the two variables after converting `number_str` to an\
    \ integer value. The `number_sum` amount and the data type are an integer data\
    \ type.\n\n**Note:** Converting the object from one data type to another data\
    \ type is known as type conversion. The Python interpreter automatically performs\
    \ an implicit type conversion. The inherent type conversion should be activated\
    \ Python to avoid data loss. Type conversion or explicit conversion takes place\
    \ when the data types of the object are converted using the function predefined\
    \ by the programmer. Unlike implicit conversion, typecasting can lead to data\
    \ loss if we apply the purpose to a specific data type.\n\nThe previous explicit\
    \ conversion/type conversion can be written as follows:\n\nStart IDLE. Go to the\
    \ File menu and click New Window. Enter the following:\n\n```python\nnumber_int\
    \ = 431 #int data type\nnumber_str = \"231\" #string data type\nnumber_str = int(number_str)\
    \ # int Function that converts the string to the int data type\nnumber_sum = number_int\
    \ + number_str #variable number_sum\nprint (\"Add number_int and number_str-\"\
    , number_sum)\n```\n\n**Note:** Explicitly converting / casting types takes some\
    \ practice to master, but it's easy. The trick is here: the name of the variable\
    \ to be converted = standard function for the desired data type (name of the variable\
    \ to be saved).\n\n### Follow the work ::\nUse knowledge of type conversion /\
    \ explicit data conversion to write a program and calculate the sum of:\na. `score_int\
    \ = 76`, `score_str = \"61\"`\nb. `count_str = 231`, `count_str = \"24\"`\nUse\
    \ knowledge of the cast / explicit data conversion type to write a program and\
    \ find the product of:\nc. `number_int = 12`, `number_str = \"5\"`\nd. `Odds_int\
    \ = 6`, `odds_str = \"2\"`\ne. `minute_int = 45`, `minute_str = \"7\"`\n\n###\
    \ Input, output and import in Python\nIn Python, input and output (I / O) activities\
    \ are performed by built-in functions. `print()` does the output/display while\
    \ `input()` does input activity. `print()` sends data to standard output devices\
    \ such as a screen. However, it is also possible to copy the data to a file. You\
    \ are now familiar with the `print` function, which is written like `print()`.\
    \ It is a built-in feature because there is no need to write it down and indicate\
    \ what and how it works. There are usually two main types of functions: embedded/integrated\
    \ and custom, which we will manage later. If the `print` function should refer\
    \ to or select the value of a variable, we don't use double-quotes.\n\n**example**\n\
    Start IDLE. Go to the File menu and click New Window. Enter the following:\n\n\
    ```python\nNumber = 6 # definition and variable assignment\nprint (number) # Display\
    \ value saved in variable number\n```\n\n**Note:** Now let's say we want to explain\
    \ to the user who runs this program because he only has 6 and doesn't understand\
    \ why 6 is shown on the screen.\n\n```python\nNumber = 6\nprint (\"This is a number\
    \ stored in the variable number, it is:\", number)\n```\n\n**Note:** Strings and\
    \ other data types can be displayed in the `print` function. A comma is commonly\
    \ used to delimit the end of one data type and the beginning of another. To do\
    \ work:\na. If the `score = 5`, write a Python program that displays \"The score\
    \ is 5\". The application should reference/extract the `score` value in its `print`\
    \ function.\nb. `Age date = 26`, write a python to display \"Richard's age is\
    \ 26\". The program should reference/extract the `score` value in its `print`\
    \ function.\nc. For a given `grade = 87`, write a Python program that shows \"\
    The middle characters in the class are 87\". The application should reference/extract\
    \ the `score` value in its `print` function.\n\n**Important:** The new line in\
    \ Python is retrieved from `\"\\n\"` without double quotes and outside the string\
    \ or line code.\n\n### Format output\nYou may have to mess around with the layout\
    \ of the output to make it attractive and formatting. The `str.format()` method\
    \ is used to format the production and is visible/accessible to any string object.\n\
    \n**example**\nStart IDLE. Go to the File menu and click New Window. Enter the\
    \ following:\n\n```python\nLucy = 3; brian = 7\nprint ('Lucy's age is {} and Brian\
    \ is {}'. Format (Lucy, Brian))\n```\n**Note:** The expected edition is \"Lucy\
    \ is 3 years old, and Brian is 7 years old\".\n\n**example**\nStart IDLE. Go to\
    \ the File menu and click New Window. Enter the following:\n\n```python\nprint\
    \ ('Brian loves {1} and {0}'. Format ('football', 'films')) # The expected edition\
    \ will be: He likes football and moves the press\n```\n\n**Note:** Using the index/tuple\
    \ numbers to indicate the display order frees the programmer because changing\
    \ the request of variables means that the entire string does not have to be re-entered.\n\
    \n```python\nprint ('study {0} and {1}'. Format ('Health', 'films')) #Edition:\
    \ He likes films and soccer\n```\n\n**Challenge:** Where in real life, the above\
    \ concept (tuple index) can be useful if is not necessary to rewrite entire lines\
    \ of code.\na. Rewrite the Python program to display \"Study and Health\".\nb.\
    \ Rewrite the Python program to display \"Study and Health\".\nc. Rewrite the\
    \ Python program to display \"Study and ICT\".\n\n### Typing in Python\nSo far,\
    \ our Python programs were static, which means that before we ran the program,\
    \ we couldn't enter everything was assigned to the variable. In practice, users\
    \ can use applications to enter values. The `input()` function is used to accept\
    \ input of values.\n\n**example**\n```python\nname = input ('Enter your name:')\
    \ # It is displayed: Enter your name here\n```\n**Important:** The Python interpreter,\
    \ at this point, treats all entered numbers as a string. For the Python interpreter\
    \ to manage the amount entered as a number, we must convert the name using the\
    \ type conversion functions for amounts that are `int()` and `float()`. To do\
    \ work:\na. Write a Python program to accept numerical data from users for their\
    \ use and record the age of user. Use explicit type conversion to convert the\
    \ entered string to variable value in a.\nb. Write a Python program to accept\
    \ user salary information. Use explicit type conversion to convert the entered\
    \ string to value in b.\nc. Write a Python program to accept the number of students\
    \ by users. Use explicit type conversion to convert the entered string to integer\
    \ in d.\nd. Write a Python program to accept the number of students in class.\
    \ Use explicit type conversion to convert the entered string to integer type in\
    \ e.\ne. Write a Python program to accept the number of students. Use explicit\
    \ type conversion to convert the entered string to...\n\n### Import into Python\n\
    The programs we've run so far are small, but in reality, an application can contain\
    \ hundreds to thousand lines of code. In this case, an extensive program is divided\
    \ into smaller units called modules. These modules are related but are in different\
    \ files that usually end with `.py`. Python allows you to import a module into\
    \ another module using the `import` keyword.\n\n**Analogy:** Suppose we have to\
    \ access the mathematical `pi`, which is another module. The following program\
    \ will illustrate:\n\n```python\nimport.math # refers to the content of the math\
    \ module\nprint (math.pi) #Now the functionality contained in this mathematical\
    \ reference is used\n```\n\n### overview\nType conversion refers to the process\
    \ of changing the value of one data type to another data type. Remember to split\
    \ two whole numbers that result in decimal numbers. In this case, you need to\
    \ convert to force conversion of an integer to a floating-point number. The Python\
    \ programming language has two types of translation: implicit type conversion\
    \ and explicit conversion. In Python, input and output (I / O) activities are\
    \ performed by built-in functions. `print()` does the output/display while `input()`\
    \ does input activity. The namespace in Python refers to a collection of names.\
    \ Although different namespaces can exist at the same time, they are entirely\
    \ isolated.\n\n### Namespace and scope in Python\nThe identifier is simply a named\
    \ object. Python treats every purpose as an object.\n\n**example**\n```python\n\
    Number = 3\nprint (id (3) = ', id(3))\nprint (' id (number) = ', id(number))\n\
    ```\n**Note:** Both refer to the same object.\n\n### Python namespace\nWhen we\
    \ start the Python interpreter, a namespace is created that contains all the built-in\
    \ names as long as the application's workspace remains active. Integrated functions\
    \ such as `print()` and `id()` are available throughout the program.\n**Integrated\
    \ namespace:** These are functions, methods and associated data that can be accessed\
    \ as soon as the Python interpreter is loaded. As such, they are accessible to\
    \ every instance and area of the work area.\n**Global namespace:** Contains the\
    \ content of a module that can be accessed throughout the module. Modules can\
    \ have different functions and methods.\n**Local namespace:** Mainly for user-defined\
    \ functions, a local namespace is restricted to the specific purpose and is not\
    \ implicitly possible outside of access to the service.\n\n### Variable scope\n\
    Although multiple unique namespaces can be specified, it may not be possible to\
    \ access all of the provided namespaces due to the scope. The concept of range\
    \ applies to a segment of the program that allows direct access to the namespace\
    \ without a prefix. The types of reach are follows:\ni. The area with local names,\
    \ current function.\nii. Range with global names, the scope of module.\niii. The\
    \ area with embedded outermost area names.\n\n### Error handling\nIn Python, a\
    \ program exits when it detects an error. Such a mistake is a syntax error or\
    \ an exception. Syntax errors occur when the parser detects an incorrect instruction,\
    \ which is mainly due to typing errors or wrong code structure. Whenever syntactically\
    \ correct Python code generates an error, in this case, Python creates an exception.\
    \ These exceptions are useful for handling errors and exceptional conditions during\
    \ programming. Here are some universal exception codes:\n- `IOError`: If the file\
    \ does not open.\n- `ImportError`: If the module is not found.\n- `ValueError`:\
    \ Generated when an argument is found during embedded operation or function is\
    \ of the correct type, but the value is not suitable.\n- `KeyboardInterrupt`:\
    \ When the user presses Ctrl-C.\n- `EOFError`: When one of the built-in functions\
    \ (`input()` or `raw_input()`) reaches EDF (End of Cycle) status without reading\
    \ data.\n\nHere are some examples:\n**Try**\n```python\nword = random.choice(words)\n\
    if word in list:\n    count = len(list)\n```\n**Try-Except**\n```python\nword\
    \ = random.choice(words)\ntry:\n    count = len(list)\nexcept KeyError:\n    print(\"\
    The database is no longer on the left.\")\n```\n**Try-Except-Else**\n```python\n\
    def check_object(A):\ntry:\n    print(str(A))\nexcept TypeError:\n    print(\"\
    object cannot be printed at all\")\nelse:\n    print(\"the object is printable\"\
    )\n\ndef show_name_of_user(user_id):\n    try:\n        data_base = get_data_base()\n\
