    Rewrite the following program instructions with multiline operators such as `\`,
    `[]`, `()` or `{}` to improve the readability of the program instructions.

    a. `total = 9 + 2 + 3 + 6 + 8 + 2 + 5 + 1 + 14 + 5 + 21 + 26 + 4 + 7 + 13 + 31
    + 24`

    b. `Number = 1 + 13 + 56 + 3 + 7 + 9 + 5 + 12 + 54 + 4 + 7 + 45 + 71 + 4 + 8 +
    5`


    ## Semicolons

    Semicolons are also used when multiple statements are created on a single line.
    Suppose we have to assign and display the age of four employees in a Python program.
    The program could be written as follows:

    ```python

    employee1 = 25; Employees2 = 45; Employees3 = 32; work4 = 43

    ```

