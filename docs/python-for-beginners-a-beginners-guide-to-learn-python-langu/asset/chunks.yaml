    \nprint('e' in s) # 输出: True\nprint('z' in s) # 输出: false\n```\n\n### 与字符串的集成\
    \ Python 函数\n\n| 方法 | 描述 | 方法 | 描述 |\n| --- | --- | --- | --- |\n| `enumerate()`\
    \ | 返回一个枚举对象。包含所有字符的索引和值对。 | `str()` | 将可迭代对象转换为字符串。 |\n| `sorted()` | 获取字符串中的字符并返回一个新的有序列表（不要对字符串本身进行排序）。\
    \ | `max()` | 返回字符串中最大的字符。 |\n| `all()` | 如果字符串中的所有字符均为真（或字符串为空），则返回 True。 | `sum()`\
    \ | 返回字符串所有元素的和。 |\n| `len()` | 返回字符串的长度（字符个数）。 | `min()` | 返回字符串中最小的字符。 |\n|\
    \ `any()` | 如果字符串中至少有一个字符为真，则返回 True。 | |\n\n### 字符串\n**示例**\n启动 IDLE。进入 File\
    \ 菜单并点击 New Window。输入以下：\n```python\ns = \"Python\"\nprint(s)\n```\n\n#### 访问字符串元素\n\
    **示例**\n启动 IDLE。进入 File 菜单并点击 New Window。输入以下：\n```python\ns = \"Python\"\nprint(s[1])\
    \ # 输出: 'y'\nprint(s[3]) # 输出: 'h'\n```\n\n#### 负索引\n和列表一样，字符串也可以使用负索引进行索引。`-1`\
    \ 指向最后一个字符，`-2` 指向倒数第二个字符。\n**示例**\n启动 IDLE。进入 File 菜单并点击 New Window。输入以下：\n```python\n\
    s = \"Python\"\nprint(s[-2]) # 输出是 'o'\n```\n\n#### 切片\n切片运算符冒号 用于访问字符串中的多个字符。\n\
    **示例**\n启动 IDLE。进入 File 菜单并点击 New Window。输入以下：\n```python\ns = \"Programming\"\
    \nprint(s[0:4]) # 输出: 'Prog'\nprint(s[:-4]) # 'Programmin'\n```\n\n#### 注意事项\n\
    字符串是不可变的，这意味着它们不能被更改。然而，我们可以使用 `+`（连接运算符）拼接字符串。我们也可以使用 `*` 运算符重复字符串。\n**示例**\n\
    启动 IDLE。进入 File 菜单并点击 New Window。输入以下：\n```python\nprint(\"Code\" + \"ing\")\n\
    print(\"Go\" * 3)\n```\n\n#### 注意事项\n由于我们不能更改字符串中的元素，因此无法删除单个字符。然而，可以使用 `del`\
    \ 关键字删除整个字符串变量。\n**示例**\n启动 IDLE。进入 File 菜单并点击 New Window。输入以下：\n```python\ns\
    \ = \"Code\"\ndel s\n```\n\n### Python 中可用的字符串方法\n处理字符串只有两种方法可用：`count()` 和 `index(y)`。调用时，它返回第一个与\
    \ y 相同的字符索引。\n**示例**\n启动 IDLE。进入 File 菜单并点击 New Window。输入以下：\n```python\ns = \"\
    Hello\"\nprint(s.count('l'))\nprint(s.index('e'))\n```\n\n#### 成员测试\n用于检查指定字符是否在字符串中的关键字是\
