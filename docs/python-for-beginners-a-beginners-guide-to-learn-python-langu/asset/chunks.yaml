    # Python 编程语言中的关键字和标识符


    此时，你可能在想为什么要这样使用 `print` 和 `str`，而没有自由地或不知道为什么声明的单词必须这样写。`print` 和 `str` 短语代表特定的词性，必须始终这样写。每种编程语言都有一组关键字。在大多数情况下，某些关键字可以在不同的编程语言中找到。在
    Python 中，关键字区分大小写，这意味着我们必须以小写输入它们。关键字不能用于命名函数（我们稍后会解释其含义）或变量名。Python 中有 33 个关键字，除了
    `None`、`False` 和 `True` 之外，所有的都是小写的。它们必须始终像下面所示书写：


    | to the | great | return | is | is | not local | import | yield | |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | try out | DEF | of | Elif | With | passage | Lambda | except | increase |

    | how | from | Self | while | in the | Not | global | other | |

    | Finally | None | True | or | not correct | to claim | Go on | break | |


