    # 1. Numbers


    The Python programming language can contain two types of numbers, namely floating-point
    numbers and integers. Python also supports complex numbers. When you sign value
    for a number, a number object is created. For example: `Number 3 = 9`, `Number
    4 = 12`. Several numeric types are supported in Python:

    - `long`, for example `681581903L`

    - `int` for example `11`, `123`, `-151`

    - `float` for example `0.5`, `23.1`, `-54.2`

    - `complex`, for example `4.12j`


    ### Exercise

    Identify the following numeric type:

    a. `234, 19, 312`

    b. `4.56, 2.9, 9.3`

    c. `76189251468290127624471`


    Identify the numeric type that is appropriate for the following contexts:

    d. Salary amount.

    e. Count the number of students in a class.

    f. Get the census across an entire country in China.


    # 1. Strings


    A single or double quotation mark in Python is used to display strings. Subsets
    of lines can be captured using the slice operator `[::]` and `[]`, where the indexes
    of `()` begin at the beginning of the string and range from `-1` to the end. Lines
    can be linked with the `+` sign (chain operator). The asterisk `*` is used as
    the repeat operator. Remember that when programming, the count starts with the
    zero indexes (the first value)!


    ### Example

    i. Start IDLE

    ii. Go to the `File` menu and click `New Window`

    iii. Enter the following:

    ```python

    str = ''Go deep!''

    print str # Print a complete string

    print str[0] # Print the first character of the string

    print str[3:6] # Print the characters from the fourth to the seventh

    print str[3:] # Print the string from the fourth character

    print str * 3 # Print the series three times

    print str + "I love Python" # Print the concatenated string

    ```

    iv. In the file, click Save on the menu. Enter the name of `myProgram4.py`. Go
    running and click `Run Module` to run the program. The output of the above program
    should read:

    `Go deep! Sol from Deep! Go deep! Go deep! Go deep! Go deep! I love Python`


    **Note:** The `#` (pound sign) is used to indicate a one-line comment. A comment
    is a descriptive information in one or more lines of code. The feedback is usually
    ignored when the program is run. The explanation must be written after the `#`
    sign in Python. Comments improve the readability of the printed program.


    ### Exercise

    You enter the following program declaration: `str = "I think I''m a programmer
    now."`

    a. Write a program instruction that shows all of the previous string/instruction.

    b. Write a program instruction to display the characters in the string from the
    second to the sixth character.

    c. Write a single program instruction that shows the entire series twice (use
    `*`).

    d. Write a program instruction that adds the following `"from the Python programming
    language"` at the end of the previous note.


    # Keywords and identifiers in the Python programming language


    At this point, you may be wondering why you should use `print` and `str` this
    way, without the freedom or knowledge of why the declared words should be written
    like this. The phrase `print` and `str` represent a particular part of speech
    that must always be written like this. Each programming language has a set of
    keywords. In most cases, some keywords are found in different programming languages.
    In Python, keywords distinguish between uppercase and lowercase, which means that
    we always have to enter them in lowercase. Keywords cannot be used to name a function
    (we will explain later what it is about), the name of a variable. There are 33
    keywords in Python, all of which are lowercase except for `None`, `False`, and
    `True`. They must always be written as they appear below:


    | to the | great | return | is | is | not local | import | yield | |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | try out | DEF | of | Elif | With | passage | Lambda | except | increase |

    | how | from | Self | while | in the | Not | global | other | |

    | Finally | None | True | or | not correct | to claim | Go on | break | |


    **Note:** `print()` and `str` are functions, but functions that are integrated/preinstalled
    in Pythons. Services are a set of rules and methods that work when called. For
    example, the `print` function displays the output when it is activated/called
    up. At this point, you have not yet found all the keywords, but you will gradually
    find them. Take some time to browse, read, and try to remember as many as possible.


    ### Exercise

    Identify what''s wrong with the following variable names (In this exercise, you
    need to remember what we''ve learned so far).

    A. `for = 1`

    b. `Yield = 3`

    c. `34ball`

    d. `m`


    # Comments and declarations


    ## Python declarations

    A statement in Python refers to the statements that a Python interpreter can work
    with / execute. An example is `str = ''I am a programmer''` and `number1 = 3`.
    Instruction with an equal sign (`=`) is called an assignment instruction. There
    are other types of declarations, e.g., `B. whether`, during and for whom they
    will be treated later.


    ### Exercise

    a. Write a Python statement that gives the first number `18`.

    b. Write a programming declaration that assigns the second numeric value of `21`.

    c. What kind of comments are you talking about? And `B.` above?


    ## Multi-line declaration

    You can spread an instruction over several lines. This claim is called a multi-line
    claim. A new line character indicates the end of programming instruction. To distribute
    a multi-line statement, we use the backslash (`\`) in Python, which is called
    a line continuation character. An example of a multi-line command is:

    ```python

    sum = 3 + 6 + 7 + \

    9 + 1 + 3 + \

    11 + 4 + 8

    ```

    The example above is also referred to as an line continuation. In Python, square
    brackets `[]` indicate the continuation of the line similar to the bracket `()`
    and finally the brackets `{}`. The above example can be rewritten as:

    ```python

    Sum = (3 + 6 + 7 +

    9 + 1 + 3 + 11 + 4 + 8)

    ```

    **Note:** When using the brackets (parentheses), the backslash (`\`) known as
    the line continuation character was removed, since the bracket performs the task
    that was carried out by the line continuation.


    **Question:** Why do you think multi-line instructions are needed? Can we just
    write a single line and do the program instructions work well?

    **Answer:** Multi-line instructions can help to improve the formatting/readability
    of the entire program. When writing an application, always remember that other
    people are using it and keep it without your contribution.


