  trans: "\n\n# 第二章 Python 编程语言基础\n\nPython 是一种过程化和面向对象的编程语言。它具有简洁的语法。Python 编程语言是跨平台的。这意味着它可以在\
    \ `Linux`、`Windows`、`Mac OS X` 和 `UNIX` 等多种操作系统环境下运行，并可以移植到虚拟的 `.NET` 和 Java 虚拟机。Python\
    \ 编程语言是免费且开源的。虽然较新版本的 Mac 和 `Linux` 预装了 Python，但建议安装并运行当前版本。\n\n## 安装 Python\n\
    \n最新版本的 `Linux` 和 `Mac` 已经安装了 Python。然而，你可能仍然需要安装 Python。以下是在 `Windows`、`Mac OS\
    \ X` 或 `Linux` 上安装 Python 的步骤说明。\n\n### 在 Macintosh X 操作系统上安装 Python\ni. 访问 Python\
    \ 下载页面（这是一个可靠的网站），并点击“Download Python 3.7.2”（版本可能与此处显示的不同）。\nii. 下载完成后，点击 `Open\
    \ Package` 并按照指示操作。安装应在出现“Installation was successful”提示时完成。\niii. 现在访问下载 Notepad++\
    \ 页面，通过打开包并按照消息中的指令下载并安装文本编辑器。`Notepad++` 文本编辑器是免费的，适用于编写源代码（原始文本编程词）。\n\n###\
    \ 在 Windows 操作系统下安装 Python\ni. 访问推荐的 Python 下载网站并点击 `Download Python 3.7.2`（版本可能与此处显示的不同）。\n\
    ii. 下载完成后，点击打开包并按照提供的指南操作。Python 应在出现“Installation was successful”提示时安装完成。如果你正确安装了\
    \ Python，还会安装一个名为 `IDLE` 的程序。`IDLE` 是你使用 Python 时的图形用户界面。`IDLE` 是 Python 编程语言的集成开发环境，长期以来一直与程序的实现一起。它通常作为可选部分与许多\
    \ `Linux` 变体一起分发。它完全用 `Tkinter` GUI 工具包和 Python 编写。\niii. 现在访问下载 Notepad++ 页面，通过打开包并按照消息中的指令下载并安装文本编辑器。`Notepad++`\
    \ 文本编辑器是免费的，适用于编写源代码（原始文本编程词）。\n\n## 运行 Python 的方法\n\n在我们运行第一个 Python 程序之前，了解我们如何运行\
    \ Python 程序至关重要。运行、执行、分发或激活程序简单来说意味着我们正在为计算机处理指令/代码行。例如，如果机器需要在代码行（程序）中显示消息，那么情况应该是这样的。以下是运行\
    \ Python 程序的几种方法。\n\n解释器是一个在安装 Python 包时安装的唯一程序，它帮助将文本代码转换为计算机可以理解并做出响应的语言（`Run`）。\n\
    \n### i. 即时模式（Immediate mode）\n这种模式允许运行未写入文件的 Python 程序。我们通过在命令行中输入 `Python` 单词切换到即时模式。这会触发即时模式下的解释器。你可以直接输入表达式，按回车键将生成输出。以下字符是\
    \ Python 提示符：`>>>`。Python 提示符指示解释器接受用户输入。例如，如果你输入 `2 + 2` 并按回车，将显示输出 `4`。从某种意义上，这个提示符可以当作计算器。如果你需要退出即时模式，输入\
    \ `quit()` 或 `exit()`。现在输入 `5 + 3` 并按回车。输出应为 `8`。下一个模式是脚本模式。\n\n### ii. 脚本模式（Script\
    \ mode）\n脚本模式用于运行编写在文件中的 Python 程序。该文件被称为脚本。脚本可以存储在外部存档（如硬盘）中供以后使用。所有 Python 脚本都有扩展名\
    \ `.py`，这意味着文件名以 `.py` 结尾。例如 `myFirstProg.py`。我们稍后会解释如何编写 Python 脚本。\n\n## 集成开发环境\
    \ (IDE)\n\n`IDE` 是编写和运行 Python 程序的方便方法。你也可以使用文本编辑器通过编写代码行并保存为 `.py` 文件来创建 Python\
    \ 脚本文件，而不是使用 IDE。然而，使用 IDE 可以编写和运行 Python 程序变得更容易。Python 包中的 `IDLE` 是一个具有图形用户界面的\
    \ IDE 示例，与 Python 语言一起安装。IDE 的优点包括帮助你消除重复任务并为初学者简化编码。除其他外，IDE 还提供语法高亮、代码提示和语法检查。还有一些商业级\
    \ IDE 等。\n\n## 概述\n\n我们介绍了 Python 编程语言、如何下载和安装 Python、Python IDE 的即时模式和脚本模式，以及什么是\
    \ IDE。\n\n## 你的第一个 Python 程序\n\n其余插图假设 Python 程序运行在 `Windows` 环境中。\n1. 启动 `IDLE`\n\
    2. 进入 `File` 菜单并点击 `New Window`。\n3. 输入以下内容：\n```python\nprint (\"Hello world!\"\
    )\n```\n4. 在文件中，点击菜单上的 `Save`。输入名称 `myProgram1.py`。\n5. 进入 `Run` 并点击 `Run Module`\
    \ 来运行程序。\n\n我们写的第一个程序被称为“Hello World!”，它不仅用于介绍一种新的计算机编码语言，还用于测试 IDE 的基本配置。程序的输出是\
    \ \"Hello world!\"\n\n这里发生了什么：`Print()` 是一个为你预先编写并预装的集成函数。它被用于显示 `()` 中包含的所有内容。\n\
