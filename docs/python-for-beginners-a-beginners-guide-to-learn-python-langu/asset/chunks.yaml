    ## Overview

    We covered what makes the variables in Python. Variables are called locations.
    For this reason, we have variable names. There are numeric and string variables.
    These are called variable types. When dealing with variables and other aspects
    of Python, we will come across and use particular words known as reserved words
    or keywords. The keywords are fixed and must be entered in a specified manner.
    Keywords cannot be used as variable names or identifiers. The comments (preceded
    by `#`, `''''''` or `" "`) refer to the human readability aspect of a Python program.
    Indentation is used in Python to group lines of code into blocks.


    # Chapter 5: Datatypes


    ## numbers


    Python can contain floating, integer and complex numbers. The presence or absence
    of a decimal point separates integers and floating-point numbers. For example,
    `4` is an integer, while `4.0` is a floating-point number. On the other hand,
    complex numbers in Python are called `r + tj`, where `j` is the real part and
    `t` is the virtual part. In this context, the function `type()` is used to determine
    the variable class. The Python function is an instance `()` that is called to
    determine which specific class function it comes from.


    ### example

    Start IDLE. Go to the File menu and click New Window. Enter the following:

    ```python

    Number = 6

    prints (type (number)) # should output class int

    print (type(6.0)) # The output class should fluctuate complex_num = 7 + 5j

    print (complex_num + 5)

    print (isinstance (complex_num, complex)) # should display True

    ```


    **Important:** Integers in Python can be infinitely long. Floating numbers in
    Python are considered accurate to fifteen decimal places.


    ## Numerical conversion


    This segment assumes that you have a basic understanding of manual or use a calculation
    to convert decimal places to binary, octal, and hexadecimal numbers. Take a look
    at the Windows computer in Windows 10, computer version 10.1804.911.1000 and select
    the programming model for the automatic conversion. Programmers often have to
    convert decimal numbers to octal, hexadecimal, and binary forms. A prefix in Python
    enables these numbers to be identified in the corresponding type.


    ### Numerical system prefix

    - Octal: `''0O''` or `''0o''`

    - Binary: `''0B''` or `''0b''`

    - hexadecimal: `''0X''` or `''0x''`


    ### example

    ```python

    print (0b10101) # Edition: 21

    print (0x7B + 0b0101) # Edition: 128

    print (0o710) # Edition: 456



    ### do work

