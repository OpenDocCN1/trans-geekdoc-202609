  trans: '


    # 引言


    Python 已成为世界上最流行、最知名且至重要的编程语言之一，尤其在企业领域。近年来，其需求剧增。在许多国家，Python 专业人士有许多选择。数据科学、Web
    应用程序、家庭自动化等许多行业都为人们提供了大量机会。根据最近的一项行业调查，Python 被许多程序员认为是最令人兴奋、最迷人且最期待的编程语言之一。


    这本书对于熟悉编程的人和不了解编程的人来说都是理想的。尽管 Python 以作为编程语言而闻名，但它已成为一种持续受欢迎的数据分析工具。近年来，几个库已经趋成熟，因此
    `Stata` 和 `R` 的用户可以利用 `Python` 的灵活性、性能和美感，而无需牺牲旧程序多年积累的特性。在本书中，我们将介绍 `Python`
    在数据分析和社会科学中的应用。这本书特别适合几乎或完全没有重大编程经验的用户。对于那些想要做一些工作且在 `Stata` 和 `R` 等程序具有丰富经验的程序员来说，它特别有用。


    机器学习的细节将在后面讨论，但简而言之，如果一个机器可以自己学习或预测，那么该系统就是智能的或启用了机器学习（ML）。机器学习目前是任何技术部门的必经因素。为了数据分析、分类和预测，学习它是必要的。大数据、数据科学和机器学习与人工智能相关。目前，`ML`
    的各种理论被用于通用 Web 应用或手机，以使你使用的应用程序更智能，并能够理解你的想法。典型应用和适用的 `ML` 应用是不同的。典型应用总是理想的，但
    `ML` 的实现是独特的。每当你使用该应用时，它似乎变得更聪明了。`ML` 不仅为应用提供信息；对于任何类型的诊断和完善，没有比 `ML` 更配的。


    # 第一章 什么是机器学习？


    在我们开始学习机器学习之前，让我们看看书中的一些定义。在这方面，Arthur Samuel 将其定义为：计算机有机会在没有显式编程的情况下学习的领域。假设一个双足机器人可以在没有特定行走程序的情况下学会跑步，但可以说机器人学习算法已经被使用。我们可以快速为双足机器人行走编写一个应用程序。但如果是为它编写了嵌入式系统，那么这种行走完全不能被称为智能。那么，它如何才能变得明智呢？如果设备的行为随着变化而改变，就可以认为它是智能的。


    Tom Michel 说——如果一个计算机程序通过经验 `E` 学习某些活动类别 `T` 和性能衡量标准 `P`，当它在活动 `T` 中的性能（由 `P`
    衡量）随着经验 `E` 的增加而提高。突然看这个定义可能有问题，所以可以用例子来说：比如，我造了一台可以下棋的机器，我们可以这样写以下参数：`E = 假设计算机已经下了
    500 盘完整的棋`，`T = 国际象棋游戏是机器的任务`，`P = 设备未输或赢`。正如定义一样，当机器游戏次数（`E`）增加收益率（`P`）时，机器就知道如何学习。而且这是无法显式编程的。


    ## 数据分析与数据分析的区别（注：原文此处标题重复）


    数据分析是传统的研究方法。它被用于医疗、商业、保险和电信等各个领域，以便根据数据做出决策并对数据采取必要的行动。数据分析被组织用于分析数据。要执行数据分析，你需要各种工具，如
    `Python`、`R`、`SAS`、`Apache Spark`、`Tableau`、`Excel`、`KNIME` 和 `Open Refine`。


    数据分析的生命周期如下：

    * 案例评估

    * 数据提取

    * 数据获取与过滤

    * 数据识别

    * 数据验证与清洗

    * 数据聚合

    * 数据展示

    * 结果使用


    数据分析的生命周期也包括：

    * 数据收集

    * 数据清洗

    * 数据分析

    * 数据解释


    如果你想知道将发生什么，特别是在营销领域，数据分析有助于预测未来的数字。在分析数据时，执行最后数据记录是为了理解之前发生了什么。插值法和外推法是数据分析中两个特别基本的原理。插值意味着查看数据并使用当前数据确定过去的情况。这在进行市场分析等时特别有用。外推法则相反；获取当前数据并对未来的可能样子给出合理的猜测。通常，它的使用频率比另外两种高得多，因为公司对未来的兴趣远大于过去。这两种技术将贯穿你的整个职业。所以请确保你两者都懂。


    ## 关于 Python 的重要信息


    Python 最初开发于 `Guido Van Rossum` 的工作。他从 1989 年左右开始工作并更新 `Python`。Python 是一种简单直接的编程语言。无论是否需要新的编程，你都可以毫无问题地学习
    `Python`。


    Python 运行在解释器系统中，即代码在配置后可以立即执行。这意味着原型设计不需要时间。它完成得非常快。此外，该语言可以通过过程化、面向对象或实用的方式进行管理。在看了讽刺电视节目《蒙提
    Python 的飞行马戏》后，它被命名为 Python。它不是以 Python 蛇命名的。


    ### Python 编程语言的特性


    1. **合理**：`Python` 是一种易于理解的语言，直接预测其行为。

    2. **易理解**：学习这种蛇对开发者非常有帮助，因为使用这种编程语言并不困难。

    3. **跨平台**：`Python` 可以在多个框架上运行。Macintosh、Windows、Linux、UNIX 等。它们通常都是用的，因此 Python
    语言是合适的。

