    using the square and cube operators is that we can write compact and efficient
    code. Remember that the interpreter goes through every line, including the comments,
    ignoring the comments. Using the cube and square operators helps compress the
    system and increase the efficiency of interpretation, including debugging and
    human readability of the code. String operators in Python Some operators are used
    in the Python programming language to support string concatenation. The additional
    character is used to concatenate strings in Python. example Start the IDE. Go
    to the File menu and click New Window. Enter the following: status = "I''m glad
    to know" + "how to write programs in Python." print (status) Python multiplication
    of a string to create a sequence many\_words = "Great Programmer" \* 5 print (many\_words)
    exercise a. Use a concatenation operator to join the following strings in  Python.
    I understand that programming is passion, dedication and practice. b. Use an operator
    to generate the following string ten times happy overview We covered what makes
    the variables in Python. Variables are called locations. For this reason, we have
    variable names. There are numeric and string variables. These are called variable
    types. When dealing with variables and other aspects of Python, we will come across
    and use particular words known as reserved words or keywords. The keywords are
    fixed and must be entered in a specified manner. Keywords cannot be used as variable
    names or identifiers. The comments (preceded by #, '''' ''or ") refer to the human
    readability aspect of a Python program. Indentation is used in Python to group
    lines of code into blocks. Chapter 5: Datatypes numbers Python can contain floating,
    integer and complex numbers. The presence or absence of a decimal point separates
    integers and floating-point numbers. For example, 4 is an integer, while 4.0 is
    a floating-point number. On the other hand, complex numbers in Python are called
    r + tj, where j is the real part and t is the virtual part. In this context, the
    function type () is used to determine the variable class. The Python function
    is an instance () that is called to determine which specific class function it
    comes from. example Start IDLE. Go to the File menu and click New Window. Enter
    the following: Number = 6 prints (type (number)) # should output class int print
    (type (6.0)) # The output class should fluctuate complex\_num = 7 + 5j print (complex\_num
    + 5) print (isinstance (complex\_num, complex)) # should display True Important:
    Integers in Python can be infinitely long. Floating numbers in Python are considered
    accurate to fifteen decimal places. Numerical conversion This segment assumes
    that you have a basic understanding of manual or use a calculation to convert
    decimal places to binary, octal, and hexadecimal numbers. Take a look at the Windows
    computer in Windows 10, computer version 10.1804.911.1000 and select the programming
    model for the automatic conversion. Programmers often have to convert decimal
    numbers to octal, hexadecimal, and binary forms. A prefix in Python enables these
    numbers to be identified in the corresponding type. Numerical system prefix Octal
    ''0O'' or ''0o'' Binary ''0B'' or ''0b'' hexadecimal ''0X or'' 0x '' example print
    (0b1010101) # Edition: 85 prints (0x7B + 0b0101) # Edition: 128 (123 + 5) print
    (0o710) # Edition: 710 To do work Write a Python program to display the following:
    a. 0011 11112 b. 7478 c. 9316 Conversion type Sometimes called constraint, type
    conversion allows us to change one type of number to another. Preinstalled functions
    like float (), int () and complex () enable implicit and explicit type conversions.
    The same features can be used to change strings. example Start IDLE. Go to the
    File menu and click New Window. Enter the following: int (5.3) #Gives 5 int (5.9)
    #Gives 5 Int () creates a truncation effect when applied to float numbers. The
    part of the decimal point is simply released without rounding. Let''s look at
    the following for float (): Start IDLE. Go to the File menu and click New Window.
    Enter the following: float (6) #Gives 6.0 Complex (''4 + 2j'') #Gives (4 + 2y)
    To do work Apply the int () conversion to the following: a. 4.1 b. 4.7 c. 13.3
    d. 13.9 Apply the float () conversion to the following: e. 7 f. 16 g. 19th Decimal
    in Python example Start IDLE. Go to the File menu and click New Window. Enter
    the following: (1.2 + 2.1) == 3.3 # Will return false, why? Explanation The computer
    works with finite numbers, and the fractions cannot be saved in their raw form
    because they generate an infinitely long binary sequence. Python fractions The
    fraction module in Python enables operations with fractional numbers. example
    Start IDLE. Go to the File menu and click New Window. Enter the following: Import
    fractions print (Fractions.my\_Fraction (2.5)) # edition 5/2 print (Fractions.my\_Fraction
    (4)) # edition 5 print (Fractions.my\_fraction (2.5)) # Edition 2/5 Important
    Creating my\_fraction from float can lead to unusual results due to the misleading
    representation of the double movement point. '
