  \n# 技术编辑简介\n\n**Aaron Kraus, CCSP, CISSP** 是一位拥有 15 多年经验的信息安全专业人士，曾在联邦机构、金融服务和技术初创公司等行业从事安全和合规工作。Aaron\
  \ 在 Learning Tree International 工作了 3 多年，担任课程作者、讲师和网络安全院长，最近教授 (ISC)² CISSP 考试备考。他曾担任\
  \ Wiley 多部出版物的作者和技术编辑，包括*The Official (ISC)²* *CISSP CBK Reference*、*The Official\
  \ (ISC)²* *CCSP CBK Reference*、*(ISC)²* *CCSP Cloud Security Professional Official\
  \ Study Guide, 2nd Edition**CCSP Official (ISC)²* *Practice Tests*、*The Official\
  \ (ISC)²* *Guide to the CISSP CBK Reference, 5th Edition* 以及 *(ISC)²* *CISSP Certified\
  \ Information Security Professional Official Practice Tests, 2nd Edition*。\n\n#\
  \ 致谢\n\n首先我要感谢我的 Wiley 采购编辑 Jim Minatel。我们已经合作了至少四本书了。Jim 总是能在正确的时间策划出合适的书籍，并汇集其他才华的团队来实现目标。我想感谢我的制作团队的其他成员，包括项目经理\
  \ Brad Jones、执行编辑 Pete Gaughan、Sacha Lowenthal、Saravanan Dakshinamurthy、Kim Wimpsett\
  \ 和技术编辑 Aaron Kraus。在项目开始之前我不认识 Aaron，但现在我知道他是一个明星。他遇到过的过的技术编辑之一。Brad 在节奏和响应方面简直完美。\n\
  \n\n\n\n特别感谢 Anjali Camara（M.S., M.A.），她是 Connected Risk Solutions 的合伙人兼网络安全业务负责人。她从自己的博士研究中抽出时间，向我介绍了网络安全保险问题以及行业发生的巨大变化，这些内容最终成为了书中的一个完整章节。特别感谢我几十年的老朋友\
  \ Gladys Rodriguez，她是微软首席网络安全顾问，感谢她提供了关于恢复微软环境的信息，而且在任何她感兴趣的微软技术主题上，她通常都是房间里最机敏的人。\n\
  \n我必须感谢我的 KnowBe4 同事们，首先是 Erich Kron。多年前当我刚开始学习新型勒索软件时，看到的是他早期制作的勒索软件幻灯片。我是在他的肩上上不断进步的。我的朋友兼同事\
  \ James McQuiggan 一直是我坚定的倾听者，他非常擅长将我 30 分钟的漫诉转化为更引人注目的 30 秒金句，让人们更愿意倾听并频繁阅读。同期作者\
  \ Perry Carpenter 在社会工程学方面的了解比我这辈子能学的还要多。我那些出色的同事们：Javvad Malik（去看看他的 YouTube 视频以及他和\
  \ Erich 合作的 Jerich Show 播客）、Jacqueline Jayne（她为“人类防火墙”注入了人的灵魂）、Anna Collard（南非摇滚巨星！）以及\
  \ Jelle Wieringa（他精通 5 种语言的读写和交流，包括高管会议语言），他们都教了我勒索软件是如何影响他们国家和地区的。\n\n还要非常感谢我的首席执行官\
  \ Stu Sjouwerman；直接主管 Kathy Wattman（我从未拥有过比她更大的支持者）；高级副总裁 Michael Williams；我们优秀的营销团队，包括\
  \ Mandi Nulph、Mary Owens 和 Kendra Irimie；以及我们的公关团队，包括 Amanda Tarantino、Megan Stultz\
  \ 和 Reilly Mortimer，感谢他们在过去几年里无论是允许还是强迫我进行了数百次关于勒索软件的演讲。没有什么比通过数百次地谈论某个主题，并根据产生的反馈来完善它，更能精炼你对该主题的理解了。感谢同事\
  \ Ryan Meyers 帮助我寻找勒索软件组织正在使用或可能使用的正确钓鱼线索。\n\n最后，感谢成百个现有的勒索软件资源——文章、演示文、白皮书和调查——它们为我提供了大量的教育素材，我尝试将这些内容整合到这本书书中。击败勒索软件需要每个人的努力。我希望我在击败勒索软件的道路上贡献了一些价值。\n\
