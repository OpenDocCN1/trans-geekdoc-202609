  \n*(注：由于输入文本中存在大量重复段落，译文已根据“不要重复输出原文”的原则进行去重处理。)*\n\n\n\n\n所有组织都应努力使 `RDP` 和所有登录门户（包括允许登录的任何互联网可访问的应用程序编程接口\
  \ [`APIs`]）变得安全。这意味着尽可能地要求并使用多因素身份验证 (`MFA`)。这意味着在某些密码的情况下，密码必须足够长且复杂（至少 8 个字符长度，并包含某些非字母字符）。在所有登录门户和\
  \ `APIs` 上都应启用账户锁定策略。在失败登录次数过多后，用于登录的用户账户应自动停用，直到管理员对其进行调查并清除，或者用户证明了所有权并将其解锁。\n\
  \n许多指南建议不要从互联网访问 `RDP` 和其他远程访问工具。它们建议要求使用 `VPN` 访问登录门户，这并不是一个坏主意。然而，要求强密码并拥有可接受的账户锁定策略同样是可以接受的。这种建议适用于任何登录门户或\
  \ `API`。此外，微软允许通过数字证书保护 `RDP`。如果攻击者没有安装、允许且受信任的数字证书，即使是尝试 `RDP` 登录也将不被允许。这对于 `RDP`\
  \ 连接是一个很好的预防性控制，并且已经存在了几十年。我过去在 [IDG Pro](https://www.idginsiderpro.com/article/3318123/experience-an-rdp-attack-it-s-your-fault-not-microsoft-s.html)\
  \ 中写过这一点。\n\n所有设备和组织都应该及时应用所有关键安全补丁。及时到什么程度？大多数指南说至少在 30 天内。我更为激进。我认为所有关键安全补丁都应该在供应商发布的一周内应用，当然，是在生产环境进行全面部署之前经过适当的测试。\n\
  \n所有组织都应该尝试在最可能被黑客、恶意软件和勒索软件攻击的软件上，实现 100% 的及时补丁合规。这包括操作系统、浏览器、浏览器插件、微软 `RDP`、Web\
  \ 服务器、管理门户、数据库程序和服务器端 `VPN` 软件。后者特别受到勒索软件团体的关注。\n\n显然，所有希望最大限度减少网络安全风险的组织都应该缓解社会工程攻击和未打补丁软件的影响。想要专门缓解勒索软件的组织应该集中在这两种缓解措施上，并增加针对\
  \ `RDP` 和密码破解攻击的缓解措施，如果在这三项建议之间必须有一个优先级顺序，也许这些应该优先于打补丁。\n\n总结来说，前三大勒索软件预防措施如下：\n\
  \n*   缓解社会工程攻击，这是首要且最佳\n*   保护登录门户和 `APIs`，使用 `MFA` 或强密码策略，并启用账户锁定\n*   及时修复关键安全补丁\n\
  \n### 其他所有内容\n\n在这三项预防性控制之后，防御者还可以采取许多其他措施来击败恶意黑客、恶意软件和勒索软件。我按顺序列出了它们，我认为这种顺序能最大程度降低网络安全风险（在列出的前三大预防性控制之后）。\n\
  \n*   使用应用控制\n*   防病毒防护/EDR\n*   安全配置\n*   特权账户管理\n*   安全边界分段\n*   阻止 USB 密钥\n*\
  \   实施外语支持\n\n### 使用应用控制\n\n在强制模式下使用应用控制程序是任何个人或组织为停止所有恶意黑客、恶意软件和勒索软件所能做的单一最大的防御缓解措施。我会将其列为首要防御，但由于大多数个人和组织都无法实施它。尽管如此，如果实施，其显著减少恶意攻击和横向扩散的独特能力值得那些可以考虑此点的组织进行关注。此外，在监控/仅审计模式下的应用控制可以由任何组织实施，作为一种强力的检测控制，但这将在第\
  \ 6 章“检测勒索软件”中进行介绍。\n\n应用控制程序已经存在了几十年，传统上也被称为`黑名单`和`白名单`程序。描述这些模式的更好方法是阻止/拒绝模式（即`黑名单`）和允许模式（即`白名单`）。应用控制程序在允许模式下仅允许预定义的、经过批准的应用程序和脚本执行。任何组织都可以实施这种模式，将其作为一种强力的检测控制。通过拒绝任何未经批准的内容，这默认拒绝了所有勒索软件的执行（除非能够绕过白名单控制）。\n\
  \n拒绝/黑名单是指应用控制程序仅阻止特定的程序或脚本运行。黑名单最初的想法是给用户尽可能多的自由，同时确保击败已知的恶意程序。当网络世界只有几十或几百个恶意程序时，这是一个很棒的主意。但现在，每年产生并检测出数百万新的恶意软件，拒绝名单已大多成为过去式，或仅在需要立即缓解特定程序的紧急情况下使用。\n\
  \n今天，有许多应用控制程序。微软在 Windows 版本中内置了两种：`AppLocker` 和 `Windows Defender Application\
  \ Control`。图 2.2 显示了一个 AppLocker 配置示例。\n\n![图 2.2 AppLocker 配置示例](img/c02f002.png)\n\
  \n图 2.2 AppLocker 配置示例\n\n许多计算机安全厂商都有应用控制程序或功能集，包括 `McAfee`、`TrendMicro`、`Symantec`、`Beyond\
  \ Trust`、`Carbon Black`、`Tripwire`、`Cisco` 和 `Ivanti`。\n\n所有个人和组织都应该在允许强制模式下实施应用控制程序。这样做可以防止大多数黑客、恶意软件和勒索软件，无论漏洞源是什么。不是全部，但大部分。\n\
  \n遗憾的是，大多数用户和组织非常不想将他们的计算机和设备限制在仅允许经过批准的软件。用户将其视为对他们个人自由、创造力和生产力的侵犯。组织担心实施强制模式下的白名单会降低生产力和创造力，而且这可能是正确的。它可能确实抑制创造力。但更强的计算机安全需要这种控制和权衡。然而，许多组织缺乏正确实施所需的的技术知识或时间。\n\
  \n如果启用了允许强制模式，相关组织应努力积极主动，响应报告的问题和对新软件的请求。这是大多数应用控制白名单项目失败的地方。在现实实施中，对新软件的审批可能需要几周或几个月。这种审批延迟基本上杀死了大多数用户并最终组织对白名单程序的接受。但尽管如此，如果能够完成允许强制模式，它将显著击败大多数恶意黑客和恶意软件，包括勒索软件。\n\
  \n\n\n尽管 50% 到 85% 的勒索软件受害者使用了更新过的杀毒软件或 `EDR` 解决方案（以及其他类型的防御），但这些防御类型成功阻止或缓解了一些勒索软件攻击，仅凭这一点，就应该包含在任何人的防御体系中。在数百万实例中，杀毒保护（或任何其他类型的计算机安全防御）确实阻止了勒索软件的初始执行，或者在初始执行后不久就捕获了它。没有任何安全控制是完美的。但在每个易受勒索软件攻击的设备上，都应该运行最新的杀毒软件或\
  \ `EDR` 防护。只是不要过度依赖它达到 100% 的准确和完美。这可能是大多数勒索软件受害者成为受害者的原因。\n\n### 安全配置\n\n每个设备、服务和应用程序都应该进行安全配置。大多数操作系统、服务和应用程序在创建厂商提供的默认情况下都是相当安全的。然而，管理员和用户以不安全的方式使用这些产品或设置不安全的配置的情况非常常见。例如，管理员无意中给机密文件和文件夹授予过大的权限的情况并不罕见。许多勒索软件攻击的发生是因为勒索软件供应商发现了一个权限过大的站点或存储区域，然后利用该漏洞植入并执行勒索软件。所有文件、文件夹、服务和站点权限都应该是“最小权限”。这意味着始终为每个用户、计算机和服务仅将权限配置为潜在危险性最低的设置——即执行该任务或角色所需的极少权限。\n\
  \n用户、服务和应用程序使用过大的安全上下文和组成员身份（如 `administrator` 和 `root`）运行也是相当常见的。利用运行在这些过大安全上下文中的程序或服务的恶意软件能够获得相同的过大权限和特权，从而允许更容易、更快速地利用和传播。所有用户都应该使用执行其工作和角色所需的最小权限安全上下文。所有服务和应用程序都应该在最小权限安全上下文中运行。\n\
  \n### 特权账户管理\n\n同样，应该尽量减少特权组和用户的数量，以降低攻击者控制这些高特权账户的风险。所有黑客和大多数恶意软件总是试图使用被攻破系统中高特权组和账户的安全权限和许可。\n\
  \n所有高特权组应始终减少到最少数量的永久成员。应根据需要，针对特定任务在有限时间内添加额外成员。我曾经工作过的微软将其称为 `just enough, just-in-time`（足够且及时）特权账户管理。\n\
  \n许多大型程序及其功能允许特权账户管理 (`PAM`)。`PAM` 程序允许安全且有效地管理特权组和用户，以降低安全风险。某些 `PAM` 程序允许根据需要“借出”特权组成员（或成员或特权）。任何对特权组或成员的意外使用都应进行调查，直到解决。\n\
  \n### 安全边界划分\n\n“最小权限”建议适用于所有的安全和网络边界。两个安全边界之间的任何“封锁”都能降低一侧的攻击和攻破被轻易用作另一侧攻击的风险。安全边界可以通过物理和逻辑方式实施。安全边界划分通常由软件和设备提供，包括防火墙、路由器、交换机、`VLANs`\
  \ 和软件定义网络。\n\n不同的安全边界不应`使用相同的登录凭据。凭据重用增加了一个安全边界被攻破后更容易被攻击另一个安全边界的机会。\n\n### 数据保护\n\
  \n有很多方法保护数据使其不被外泄。防御者可以做的最有保护性的措施之一是加密数据使其无法被复制。另一种是将数据保留在高度安全的飞地中。通常，请研究数据泄露防护系统。\n\
  \n### 阻止 USB 密钥\n\n极少数勒索软件是通过 USB 密钥上传到环境中的。阻止 USB 访问可以降低恶意攻破的风险。理想情况下，使用白名单比完全阻止更佳。\n\
  \n### 实现外语\n\n这几乎是一个“笑话式”的建议，但它确实有效。大多数勒索软件来自俄罗斯或其盟国。因此，大多数勒索软件会尝试检查其是否运行在俄语或盟国常用语言的计算机上。如果是，勒索软件将迅速终止。以下是一些俄罗斯勒索软件会检查并尝试避免的语言：\n\
  \n*   俄语\n*   乌克兰语\n*   亚美尼亚语\n*   阿塞疆语\n*   白俄罗斯语\n*   西里字母\n*   格鲁吉亚语\n*   哈萨克语\n\
  *   柯尔吉斯语\n*   鞑语\n*   罗马尼亚语\n*   塞尔维语\n*   土库曼语\n*   乌兹别语\n\n一些专家建议在操作系统（通常是 Microsoft\
  \ Windows）中启用那些常用的回避语言之一，因为这样做将显著降低勒索软件继续执行的风险。\n\n从安全“专家”的角度来看，这种防御并不是很强大的。首先，非俄罗斯勒索软件可能根本不检查，甚至某些俄罗斯勒索软件可能也不检查。其次，你无法保证俄罗斯勒索软件会如何检查以确认其是否存在于俄罗斯设备或计算机上。第三，无论使用什么防御方法，俄罗斯勒索软件都可以尝试绕过。尽管如此，有大量证据表明，启用常用的俄语可以阻止许多（如果不是）俄罗斯勒索软件程序。安全记者和畅销书作者\
  \ Brian Krebs 在 `https://krebsonsecurity.com/2021/05/try-this-one-weird-trick-russian-hackers-hate/`\
  \ 中介绍了这种建议的防御。所有个人和组织都应该实施这些建议的预防控制，从对抗社会工程和网络钓鱼、防止密码攻击以及更好的补丁开始。其他建议的预防控制也应予以考虑。\n\
  \n\n\n\n个人和组织在防止恶意黑客、恶意软件和勒索软件方面能做的努力是有限的。对于网络安全行业的任何人来说，之前的建议并不应该感到意外。这些都是几十年来一直向我们推荐的安全控制措施（如果你在网络安全行业呆得足够久）。每一份计算机安全监管指南（例如\
  \ `HIPAA`、`SOX`、`NERC`、`PCI-DSS` 等）自存在以来一直在推荐相同的内容。也许我在这些建议中引入的唯一新意是对是对预防性控制、根源漏洞以及正确的优先级排序的高度关注。\n\
  \n我们不需要任何新的控制措施、新的控制文档或框架来防止勒索软件。但单凭个人和组织的努力击败勒索软件是不够的。底层的地缘政治环境和互联网的不安全性使得恶意黑客和恶意软件可以逃避惩罚。我们需要不仅仅是个人和组织的控制；我们需要：地缘政治解决方案和更安全的互联网。\n\
  \n## 地缘政治解决方案\n\n有几种地缘政治解决方案可以显著减少勒索软件的威胁。\n\n### 国际合作与执法\n\n大多数勒索软件要么源于蓄意的网络犯罪避风港（如\
  \ `Russia`），要么受益于许多国家之间法律管辖权的缺乏合作。恶意黑客和他们的恶意软件创作之所以兴盛，是因为犯罪实施者无法被识别，即使被识别，也几乎从未被成功起诉。对于网络犯罪分子来说，这全是收益而几乎零风险。犯罪分子会不利用这些条件呢？抢劫真正的银行将面临被捕和入狱的真实风险。抢劫在线银行可以获得更多钱，而且入狱机会几乎为零。我们需要消除网络安全避风港，并在调查网络犯罪、指控和逮捕网络犯罪分子时建立国际跨管辖权的最低水平。\n\
  \n在密切盟友之间已经存在一些国际合作，但显然还没有具有传统敌对关系的国家，例如 `United States` 与 `Russia` 和 `China`。`Russia`\
  \ 和 `China` 很少执行来自 `United States` 针对其境内公民的授权或传票，反之亦然。正因如此，我们有许多从一个国家产生另一个国家的网络犯罪。某些国家，如\
  \ `North Korea` 和 `Russia`，似乎不仅容忍勒索软件，还被认为鼓励它并利用它为自己牟利。只要对手之间允许甚至鼓励网络犯罪，我们停止它的难度将大得多。\n\
  \n这将需要政治家同意制定全球网络安全框架，并各国同意接受这些新规则。要让任何群体对任何事情达成一致都是困难的。你的亲家人可能对所有事情都没有意见，更不用说全世界以及问题各方的利益相关者了。但有些组织和个人正在尝试。\n\
  \n例如，联合国（`UN`）已致力于一套全球公认的网络安全和网络战标准至少六年，在此之前的十年里还有其他的全球共识尝试。`UN` 通过了一项成果。2021 年\
  \ 3 月 10 日，他们发布了第一份全球网络安全建议报告 (`https://front.un-arm.org/wp-content/uploads/2021/03/Final-report-A-AC.290-2021-CRP.2.pdf`），这类似于数字日内瓦公约。它提升并确认了国际法在网络空间的权威以及负责任行为的准则，对负责任的国家网络行为设定了预期，并讨论了所有国家变得更具网络韧性的性。当然，大国对此正在抵制，但\
  \ `French` 和其他国家也在提出一条出路（`https://front.un-arm.org/wp-content/uploads/2020/10/joint-contribution-poa-future-of-cyber-discussions-at-un-10-08-2020.pdf`）。总之，我们在网络方面应该和不应该容忍什么方面，距离全球共识更近了。\n\
  \n还需要对数字犯罪证据规则，以及不同国家如何接受和执行其他国家提出的嫌疑人传票和逮捕请求达成全球共识。可能还需要对作为网络犯罪分子避风港的大国进行广泛的全球性谴责。我们必须让那些避免采取使我们的网络活动更安全的措施的国家感到比这样做更痛苦。\n\
  \n### 协调技术防御\n\n新成立的 `US Ransomware Task Force` 报告，题为“打击勒索软件：全面的行动框架：勒索软件工作组的关键建议”\
  \ (`https://securityandtechnology.org/ransomwaretaskforce/report/`)，列出了 48 项建议 `US`\
  \ 政府采取的以缓解勒索软件的独立行动。\n\n其许多建议要求建立一个中央化的、协调的、政府/私营资助的组织来直接对抗勒索软件。它建议了许多行动，包括以下：\n\
  \n*   建立一个跨情报机构的工作组和小组来打击勒索软件\n*   将勒索软件指定为国家安全威胁（这是在报告发布后完成的）\n*   建立打击勒索软件犯罪者的国际联盟\n\
  *   创建一个全球勒索软件调查中心网络\n\n### 切断资金供应\n\n`Ransomware Task Force` 的报告还建议中断勒索软件集团目前享有的加密货币资金供应。报告明确地将勒索软件支付的网络安全保险范围的增加以及加密货币的使用，与勒索软件事件的增加和每次事件成本的增加联系起来。工作组建议显著削弱受害者支付赎金以及勒索软件集团收集赎金支付的能力。报告称，仅\
  \ `199` 个比特币地址就占了 2020 年所有勒索支付的 80%。通过中断这些支付，可能会减少勒索集团的动力。\n\n## 修复互联网\n\n但如果你想显著减少网络安全风险，真正来自勒索软件在内的所有网络犯罪来源，我们必须“修复”互联网。也就是说，让互联网成为一个设备和人类更安全的地方。这不是一项小任务。大多数观察者认为这是一项不可能完成的任务，特别是在可以接受的时间范围内，比如\
  \ 10 年或更短。\n\n你可能会问，为什么互联网还没有变得显著安全。这源于几个主要问题，包括之前讨论过的关于大多数黑客无法被成功起诉的事实。其他挑战包括：\n\
  \n*   互联网在创建时并没有考虑安全性，事后补救安全性永远不是最优的。\n*   互联网如此巨大，即使是 100%的人对如何做达成共识并想要这样做，改变它也将是一项巨大的、持续多年的的工程。\n\
  *   有许多大型团体反对以其可能要求的方式使互联网更安全，从隐私倡导者到政府和执法部门（出于截然相反的原因）。\n*   许多人认为到为止的“痛苦”是可以接受的，将其等同于我们与现实世界中共同生活的犯罪，并且不希望发生改变。\n\
  *   如果没有发生灾难性的崩溃或“转折点”事件来让大家聚在一起进行修复，就不可能获得全球共识（如更好地保护互联网所需的共识）。\n\n我在 `https://www.linkedin.com/pulse/why-isnt-internet-more-secure-roger-grimes`\
  \ 中详细讨论了互联网不是更安全的原因。\n\n\n\n\n令许多人感到惊讶的事实是，互联网可以变得更加安全。大多数人认为这无法实现，因为我们没有这项技术或方法。这并不是一个技术问题，而是一个社会学问题，即让人们聚集在一起，认同需要这样做，并对如何实施达成一致。\n\
  \n在我的职业生涯中，我多次写过关于我认为如何实现这一点，包括几份白皮书、数十篇文章（大多发表在 `InfoWorld` 和 `CSO Online`，我在那里担任了近\
  \ 15 年的每周安全专栏作家），甚至在顶尖大学论坛上对这些观点进行了学术辩护。提高互联网安全的方法有很多。我的方法并非唯一，但以下是我提议的简要总结：\n\n\
  *   使用相同的现有的互联网连接和节点，构建一个第二个、可选的、更安全的互联网版本（对于想要使用原始互联网的人，原始互联网将不受阻地继续）。\n\n    在这个新的、更安全的互联网版本上：\n\
  \n    *   对用户、设备和网络流量进行默认、普遍且强力的身份认证，取代当前互联网普遍的默认匿名性。\n\n    *   所有用户、设备、网络和服务都可以针对与意愿方建立他们愿意接受的最低级别保证认证。\n\
  \n    *   一个中心化的、类似于 `DNS` 的服务，但用于动态收集和报告源自恶意的区域。\n\n    *   一切都基于开放标准和协议。\n\n我提议中描述的这种新的、更安全的互联网并不会阻止任何想要保持完全匿名的人保持匿名。事实上，我的设计允许任何人选择他们所需的认证级别，范围从完全匿名到对每个不同的服务和连接对其真实、现实世界的身份进行强力认证。因此，你可能想在与癌症互助小组聊天时保持匿名，但你的银行可能只允许在你使用强力认证时才进行取款。某些服务可以迎合那些渴望绝对匿名的人，而另一些服务则面向那些渴望光谱另一端的人。而且如果某人的设备被攻破并发送恶意软件，整个世界都会知情，并能够根据自己的意愿做出相应反应。当该设备被清理并可以再次安全使用时，世界也会知道这一点。\n\
  \n更安全的互联网可以通过控制它的各个各个团体（例如 `IETF`、`ICANN`、`W3C` 等）就实施哪些内容达成共识来实现。所有的规划都可以在几个月内完成。它不会中断任何现有的操作，也不需要购买任何新东西。大部分内容可以通过软件更新来实现。它甚至可以启动大量想要利用新功能集的初创公司和服务。\n\
  \n如果你对我的解决方案如何修复互联网的更多细节感兴趣，请查看 `https://www.linkedin.com/pulse/wanna-fix-internet-roger-grimes`。我的提议只是可能的解决方案之一，但还有其他让互联网更安全的方法。我们只需要决定一个解决方案并实施它。在没有转折点事件的情况下，这种情况会发生吗？大多数人认为不会。我认为，勒索软件的严重性就是它的转折点事件。也许不是互联网毁灭性的崩溃，但勒索软件非常糟糕。它已经在没有真正崩溃的情况下变得糟糕了。\n\
  \n## 总结\n\n在结束本章时，最重要的记忆点是，在那之前，恶意网络攻击仍然是罕见事件。有些黑客窃少量数据并获取免费服务，但大多数黑客行为是非常友好的。这更多是青少年和年轻人证明他们可以黑进某些东西，而不是伤害什么。当然，从一开始就有恶意的黑客和恶意软件，例如\
  \ 1992 年攻击硬盘的米开朗基病毒，但它们寥寥无几。大多数黑客闯入仅仅是因为他们可以，观察一下然后离开。恶意软件更有可能播放像 `Yankee Doodle`\
  \ 这样的曲子并合法大麻，而不是造成危害。\n\n# 第 3 章 网络安全保险\n\n在本章中，我们将讨论网络安全保险以及如何选择。网络安全保险以各种形式存在了几十年，它最初是其他业务保单的附加条款，主要涵盖第三方索赔。第一方覆盖直到\
  \ 21 世纪初才开始。\n\n### 网络安全保险\n\n在 21 世纪中叶，垃圾邮件机器人、僵尸网络、身份窃取者和信用卡盗取程序的出现，将昨天的黑客和恶意软件变成了利润驱动的项目。但即使在那时，大多数情况也是资源的未经授权，而不是直接破坏受害主机。黑客“业务”导致了更多黑客出现，并非都是无害的。企业和行业法规（例如\
  \ `PCI-DSS`、`SOX`、`NERC`、`HIPAA` 等）被制定出来进行反击。网络安全保险的出现是为了与业务中断和恢复相关的损失提供补偿。\n\n\
  网络安全保险真正的驱动因素，正如第 1 章所述，是 2013 年勒索软件与 `bitcoin` 交叉的结果。现在网络安全犯罪可以直接从受害者那里获得巨额资金。他们不需要窃取信息并转售或购买东西来获利。他们可以索要并获得更短的付款周期。\n\
  \n### 网络安全保险洗牌\n\n网络安全保险可以通过控制它的各个团体（例如 `IETF`、`ICANN`、`W3C` 等）就实施哪些内容达成共识来实现。所有的规划都可以在几个月内完成。它不会中断任何现有的操作，也不需要购买任何新东西。大部分内容可以通过软件更新来实现。它甚至可以启动大量想要利用新功能集的初创公司和服务。\n\
  \n### 网络安全保险\n\n网络安全保险有助于为事件提供财务保护。如今，网络安全保险公司甚至因为勒索软件而加强了力度。讽刺的是，勒索软件是许多公司实施更强安全措施的原因。\n\
  \n\n在几年中，提供网络安全保险的保险公司数量逐年增加。在巅峰时期，有近 200 家不同的保险公司提供涵盖勒索软件攻击的网络安全保险。网络安全保险会（且通常也会）涵盖支付赎金、恢复成本和业务中断成本——最高达到承保限额。\n\
  \n被保险实体可以从许多报价方案中选择，几乎可以是任何所需的最高保额，只需支付少额免额，并支付负担得起的保费。例如，在 2019 年，机构获得一份保额为 1,000,000\
  \ 美元、免额为 10,000 美元、年保费为 1,500 美元的保单是非常常见的。对于保险公司来说，这是一个非常有利且竞争激烈的领域。他们并不敢涨价。事实上，当其他保险公司争夺客户时，他们甚至考虑降低费率以留住现有客户。\n\
  \n对于被保险者来说，网络安全保险允许将大部分的财务风险“转移”给另一个实体（保险公司）。这被称为 `risk transference`（风险转移）。多年来，与涵盖相同金额财务风险的其他类型保险相比，网络安全保险的成本相对较低。有很多不同类型的的产品，提供广泛的免额和承保范围，供组织选择。\n\
  \n直到几年前，提供网络安全保险的保险承运人仍然赚取丰厚的利润。这是“轻松赚的钱”。保险承运人通常从收取的每美元网络安全保险保费中获得 60% 或以上的利润。勒索软件及其赎金在不断增加，但这些事件仍然属于相对罕见。平均支付的赎金仅为几万美元。\n\
  \n一两年后，随着勒索软件事件数量的增加以及平均支付赎金的更剧增长，保险承运人仍从收取的每美元保费中获得 40%。对于提供网络安全保险的保险公司来说，这仍然是很好的利润。对于被保险者来说也是好事。被保险机构可以以合理的成本获得数百万美元的承保。这对双方都是双赢，许多网络安全保险公司并没有费费精力去评估客户实际的网络安全风险。他们赚取的利润不需要长期的网络安全风险评估。正如一位保险经纪人告诉我的：“我记得以前保险公司要求的网络安全风险调查调查只有五个问题，其中三个是姓名、地址和电话号码。”\n\
  \n这一切都改变了。网络安全保险行业所享有的惊人利润在近年来消失了——大部分是由于勒索软件。勒索软件攻击的次数和支付赎金的金额动摇了网络安全保险市场。图 3.1\
  \ 显示了根据保险代理人和经纪人委员会（Council of Insurance Agents and Brokers）的数据，网络安全保险保费随时间变化的百分比（`https://www.icab.org/`）。[注：此处原文提供的文本片段似乎不完整]\n\
  \n\n\n\n这一事实并没有被网络犯罪分子忽视。许多勒索软件团专门针对投保了保险的组织，或者在他们刚刚攻破的组织内部寻找网络安全保单的证据。在谈判过程中，许多勒索软件团会立即询问特定保单允许支付的最高赎金金额，让受害者知道他们已经阅读了其保单详情。\n\
  \n已有几条新闻报道称，勒索软件团已入侵网络安全保险公司，盗取了它们的客户名单（或简单地从这些公司的营销网页上读取他们的姓名），然后将这些客户名称作为新受害者的首选购物清单。至少有一个勒索软件团\
  \ `Maze` 公开证实了确实如此，尽管没有人知道这种说法是真实的还是仅仅是虚假的吹牛。\n\n几家规模最大的网络安全保险公司本身也遭到了勒索软件攻击。至少有一家网络安全保险承保人遭到了特定攻击，其数据被加密且未解密，因为该承保人曾公开表示他们不再支付任何赎金。一个勒索软件团通过惩罚他们来向其他承保人发出警告。\n\
  \n虽然许多人在质问，对于勒索软件而言，网络安全保险业是否弊大于利，但从事实来说，这并没有改变一个事实：网络安全保险对于许多公司来说是一个良好的业务风险决策，这些公司希望限制因网络安全事件可能从自腰支付的最高金额。无论这是否是一个自我膨胀、自我失败的循环，大多数组织都至少必须考虑是否购买网络安全保险。甚至有一种日益增长的可能性，增加的网络安全保险要求将提高我们整体的网络韧性。\n\
  \n## 网络安全保单\n\n在本节中，我们将深入探讨网络安全保险的基础知识。提供网络安全保险并没有所谓的“标准”方式，而且在我写这本书时它正在发生变化，但查看其大轮廓是值得的。\n\
  \n尽管有数十家到一百多家保险公司仍在提供网络安全保险，但少数几公司（例如美国国际集团 `AIG`、`AXA`、`Beazley`、`Chubb`、`CNA`、`Travelers`\
  \ 等）提供了半以上的保单。重要的是，网络安全保险涵盖的不仅仅是勒索软件攻击。大多数保单还涵盖了（常规）数据窃取、身份盗窃、内部威胁、欺诈和其他类型的网络犯罪，即使本章侧重于勒索软件。网络安全保险不涵盖勒索软件也是常见现象。例如，Sophos\
  \ 的“2020 年勒索软件现状报告”（`https://www.sophos.com/en-us/medialibrary/Gated-Assets/white-papers/sophos-the-state-of-ransomware-2020-wp.pdf`）显示，虽然\
  \ 84%的调查组织拥有网络安全保险，但只有 64%的保险涵盖勒索软件。许多不涵盖勒索软件的保单是投保人已有的其他类型保单的附加险。无论如何，确保你的网络安全保单涵盖勒索软件很重要，因为它是最频繁且破坏性最大的攻击之一。\n\
  \n### 大多数网络保险涵盖的内容\n\n并非所有与勒索软件攻击事件相关的费用都在保险范围内。以下是一些常见的涵盖费用：\n\n* 恢复费用\n* 赎金\n\
  * 溯分析\n* 业务中断成本\n* 客户/利益相关者的通知与保护\n* 罚款和法律调查\n\n### 恢复费用\n\n大多数处理勒索软件后果的网络安全保单都涵盖了恢复/重建涉及系统和数据所需的费用，以将其恢复到原始的运行状态和服务水平。这不取决于受害者是否支付赎金。恢复通常是勒索软件事件中最昂贵的部分，与支付赎金相比，其费用可能是翻倍、四倍甚至更多。\n\
  \n网络安全保险公司可能有他们自己的内部应急响应人员和恢复专家，或者将恢复外包给专门从事勒索软件恢复的其他公司。一些保险公司吹嘘他们利用内部员工提供更快、更好服务的能力，但这种说法并没有得到数据支持。内部和外包的应急响应人员通常都能快速响应并精于此。找出你是必须使用保险公司的内部或外包应急响应和恢复专家，还是他们仅仅是建议。\n\
  \n重要的是，无论你使用谁，他们在处理勒索软件恢复方面不能是新手。勒索软件事件不是让某第一次尝试处理时展示能力的时候。你需要一个拥有丰富经验的专家。一个“见惯了大场面”的人！无论保险公司推荐是谁，可能都擅长勒索软件恢复，无论从降低成本还是让受害者恢复运营方面来看都是如此。\n\
  \n### 赎金\n\n大多数网络安全保单支付支付赎金的费用，并在勒索软件事件中支付赎金（一项调查显示，当支付赎金时，94%的情况是由网络安全保险公司支付的）。\n\
  \n全球有几十甚至上百名普通人通过在受害者（或其代表）与勒索软件供应商之间谈判赎金来维持生。我不确定人们如何获得这类工作的经验，但他们确实存在，并且被频繁使用。大多数勒索软件谈判员与一个或几个勒索软件团合作。他们了解勒索软件团是如何运作的、给谁发邮件、如何操作以及通常的条款是什么。勒索软件团通常也信任他们，在犯罪分子可以信任的范围内是如此。当勒索软件团认识、信任并与勒索软件谈判员保持持续关系时，他们会放松一点。他们对受者的那么强硬和不耐烦。如果你买了网络安全保险，请确保最终由谁决定是否支付赎金。大多数情况下，客户是最终决定者，但如果你对支付赎金有问题，最好在购买保单之前明确这一点。\n\
  \n### 溯源分析\n\n正如第 2 章所述，弄勒索软件是如何在受害者环境中执行的是非常重要的。它是由于社会工程学、未修补的软件、密码猜测或其他类型的根源利用方法发生的吗？受害者需要确定这一点，以便关闭现有的被利用的漏洞。这不仅防止了当前或未来的勒索软件攻击者进入或再次进入，还缓解了未来恶意软件和黑客使用相同利用方法的影响。没有足够的受害者对勒索软件如何成功进入进行溯源分析，这是一个错误。\n\
  \n\n\n\n许多勒索软件受害者也想知道是否发生了“数据泄露”。传统的勒索软件只是利用并加密数据，这可能不被视为数据泄露。今天，大多数勒索软件会外泄数据，因此更有可能发生数据泄露事件。在某些州、国家或受监管的行业，数据泄露需要大量的法律步骤，例如客户通知和保护。如果数据泄露对你的组织很重要，那么询问调查是否发生了泄露的费用包含在保险范围内。\n\
  \n\n\n\n现实生活是复杂的。很多时候，购买新设备是为了替换那些被忽略或损坏的设备，而你可能别无选择。例如，假设一批 `Microsoft Windows\
  \ 7` 客户端和 `Microsoft Windows 2012` 服务器崩溃了。大多数受害者最终会购买 `Microsoft Windows 10` 和 `Microsoft\
  \ Windows Server 2019` 或 `2022` 来替换它们。新软件的成本通常比旧软件高。很多时候，需要新硬件来支持新软件对资源更高的需求。在过程中的某个地方，一位安全顾问提到，你当前的\
  \ `Active Directory` 设计可能导致了某些问题。因此，他们建议从头开始以“正确的方式”进行设计，而这个项目将需要其他顾问团队花费几周甚至几个月的时间。\n\
  \n其他人提到，更好的事件响应流程本可以减轻损害、降低停机时间并降低成本。他们建立了一个正式的事件响应（IR）团队，让团队成员接受培训，进行桌面演练，并为新团队购买了\
  \ IR 软件。还有人建议购买企业级的漏洞扫描和管理程序。你还需要一名新员工来运行和管理这一切。以此此类推。\n\n所以，在恢复勒索软件事件的过程中，许多组织最终拥有了新软件、新硬件、新的网络设计、新的安全设备、新服务、新员工等。而这一切都没有由保险支付。不要指望良好的恢复只是回到原来的状态。通常，你并不想回到原来的状态，那正是导致你最初大问题的所在。\n\
  \n最后，大型勒索软件事件造成的运营中断远超任何网络安全保险公司能够覆盖的范围……即使他们覆盖，被保险公司也永远负担不起保费。对于某些勒索软件事件，真实的中断成本是巨大的，甚至是全球性的。\n\
  \n例如，正如第 1 章中关于 Colonial Pipeline 勒索软件攻击的介绍，它导致了整个美国东南地区的燃气供应中断，尽管其实际直接影响范围要小得多。我老家位于佛罗里达州的坦帕附近，那里出现了大规模燃气短缺。这并不是因为我们的燃气供应发生了任何减少。无论如何，大家都恐慌燃气可能会耗尽，于是急着冲出去加油，这导致我所在地区的大多数加油站在几小时内就没油了。当我出去给我的卡车加油时，在我家\
  \ 10 英里范围内找不到油——只有挂在油嘴上的塑料袋和灯黑的加油站。我浪费了两个小时和几加仑已经稀缺的汽油，却没找到油。我给公司打电话，告诉他们第二天或后几天不上班了，因为我不确定是否有足够的油开车过去。我在荷兰的同事说，他们收到了警告，由于美国发生的情况，可能会出现燃气问题。这太疯狂了！但这就是单次勒索软件事件造成的后果。这些中断中任何一个是不被保险覆盖的。\n\
  \n两周后，国际肉类工厂 JBS 支付了 1100 万美元赎金，但其肉类供应仍然延迟，这影响了等待肉源的餐厅和商店。显而易见，勒索软件造成的运营中断规模可能是巨大的，甚至是全球性的。它会影响数百万人的生活并降低他们的生产力。这部分成本将永远无法报销。\n\
  \n如果你对网络安全保险提供的财务保护感兴趣，请务必了解保单涵盖了哪些、不涵盖哪些。你应该与一位优秀、明智且值得信赖的保险代理合作，他应该了解相关的保单并能回答你的问题。审查新的网络安全保险保单不是靠猜的时候。\n\
  \n## 保险流程\n\n理解获取保险的正常流程是关键。一旦你拥有了保险，了解发生勒索软件事件时会发生什么同样重要。让我们仔细查看获取保险、确定网络安全风险以及承保、审批和事件理赔流程。\n\
  \n### 获取保险\n\n大多数组织简单地联系他们目前的商业保险经纪人来咨询网络安全保险。有些组织联系网络安全保险专家，而少数新客户通过点击互联网上的广告找到新的网络安全保险经纪人。无论采取哪种方式，所有寻求购买网络安全保险的组织都会经过几轮提问。\n\
  \n第一轮将是对申请保险的组织进行分类、定位和规模评估。某些类型的组织无法获得网络安全保险（它们受到的攻击太频繁，或者造成的损害太高），或者涵盖范围很低且/或保费很高。不同行业有不同的定价。\n\
  \n该组织位于何处，在何处运营？所有地点是否都位于同一个地区、同一个国家，还是遍布全球？如果是全球分布，分布在哪里？某些国家是不可保的，或者此外，必须引入其他保险公司来填补空白。\n\
  \n你想涵盖哪些设备？仅仅是计算机，还是包括移动设备、工业设备、环境设备等？你有什么种类型的计算机（例如 `Windows`、`Linux` 等）？你有多少台计算机？你有多少台服务器？你有多少台客户端计算机？\n\
  \n你的组织价值多少钱？年收入是多少？你有多少客户？你有多少机密记录？你有多少笔信用卡交易，总价值是多少？评估组织规模不仅对于保险公司适地确定保单规模很重要，而且特别是考虑到勒索软件时，它最终决定了可能的勒索软件勒索金额可能是什么样子。\n\
  \n### 网络安全风险确定\n\n最终，保险公司想知道你是一个好还是一个坏的网络安全风险。为此，他们通常会向你提出几十个甚至超过 100 个关于特定策略的问题，例如你是否使用\
  \ `MFA`、是否对登录失败实施账户锁定、你的备份流程由什么组成、备份是否离线存储等。某些保险提供商会询问你是否符合监管指南（例如 `PCI-DSS`、`HIPAA`\
  \ 等）以及/或是否进行过安全审计。他们希望对与你的组织所承担的风险有一个最好的了解。\n\n尽管这在几年前几乎闻所未闻，但许多保险公司现在要求他们或其指定的服务商允许进行外部和/内部漏洞扫描。他们想确认你有多少个容易发现的攻击者可能利用的漏洞，并要求你在提供保单之前修复关键漏洞。他们还可能要求在保单期内进行额外的漏洞扫描，并在不合规的情况下提前撤销保单。\n\
  \n### 承保与审批\n\n一旦收集了所有信息，就会发送给保险承保人，由其对收集的信息进行审查。承保人之前已经发送了最初遵循的指南，但他们现在根据收集的信息尝试对申请组织是否可以承保做出决定，如果是，在什么定价点。\n\
  \n\n\n他们会想要了解许多额外信息。你想要多大的覆盖范围？你愿意支付多少免赔额？你是否需要勒索软件覆盖？诸此类推。然后，核保人将决定是否需要更多信息来做出决策。如果是，保险公司将要求申请保险的组织提供更多信息。随后，有了新的回答，保单将返回以进行“通过/不通过”的决策。过程中收到一些额外问题，甚至被告知如果你想获得该保单就必须做某些事情（例如获取\
  \ `MFA`），这是非常普遍的。\n\n我从几位保险经纪人那里听过，对于保险经纪人来说，要提供报价并让客户在核保人更改要求之前及时批准，正变得越来越困难。客户批准保险保单报价的时间越长，所引述的保单要求被取消或更改的可能性就越大。再次，这在很大程度上是因为勒索软件造成的损害日益增加，以及它对网络安全保险行业带来的财务影响。\n\
  \n在最终，如果客户同意由核保人和保险经纪人提出的条款和定价，客户现在就有了一份针对涵盖事件的网络安全保险保单。如果该网络安全保险保单包含了建议或要求的事件响应经纪人，现在是被保险组织的网络安全负责人或主要联系人联系保险公司事件响应联系人的时候了。大多数被保险客户会等到网络安全事件发生后才第一次联系事件响应经纪人。虽然这样做也可以，但在事件发生前进行电话沟通和介绍可能会有一些益处。\n\
  \n被保险公司需要确保所有相关的联系信息和保单在离线状态下可用，因为在线计算机系统可能会宕机、无法使用，或者变得不可信。被保险组织的联系人应该向事件响应经纪人介绍自己，并询问真实的事件响应可能会如何进行。也许，现在是时候时候完成一次模拟的“桌面演练”练习了。在与许多经历过勒索软件事件的人以及事件响应经纪人交流时，他们都认为双方之间进行预备会议对双方都有帮助。遗憾的是，不到\
  \ 1% 的被保险组织会进行事前的介绍性电话。因此，如果你有网络安全保险，并且有一个要求的或可能的事件响应团队/经纪人，请给他们打个电话。\n\n### 事件理赔流程\n\
  \n现在，让我们假设一个被保险客户发生了网络安全事件，特别是勒索软件攻击。响应过程是怎样的？\n\n通常情况下，会有一个或多个系统首先崩溃，因为它们开始被加密。起初，如果大多数人在屏幕前，会看到他们正在操作的系统出现了运行问题，但不确定发生了什么。这只是一些意外之外的、奇怪的、看起来很严重的错误信息。然后，他们正在观察的系统或他们为了排查第一个系统故障而检查的另一个系统最终会显示出勒索软件勒索信息。\n\
  \n受害者组织在开始将所有系统从网络断开（无线或其他网络）时，应该联系组织内的其他需要的事件响应人员和高级管理层。在某个时刻，需要拨打保险公司之前告知的事件响应电话。通常，这会在初始响应电话中通知保险公司正在发生事件，或者受害者将在稍后的某个时间或日期单独联系保险公司。保险公司会设定一个最长时间，被保险人必须在此时间内通知他们，该事件才能符合保单规定。这个时间限制可能从一天到几周不等。保险公司非常关注客户首先获得他们所需的技术帮助，以最大限度地减少停机时间和成本。在最初的几小时内立即通知保险公司通常不是要求的。尽管如此，让你的保险经纪人参与进来，重复保单下哪些类型的项目是可以报销的，以及为了报销支出可能需要哪些类型的证据和收据，这并没有坏。\n\
  \n### 初始技术帮助\n\n当拨打事件响应人员或公司时，他们通常会开始告诉你接下来会发生什么。通常，他们会尽可能获取大量信息，例如有多少计算机受到影响以及在哪里，以及是否已经识别出勒索软件的变种。识别勒索软件的变种和版本对于初始响应人员来说很重要，因为不同的勒索软件程序和团伙具有不同的属性。通常，受害者组织的来电人会被告知所需的其他类型信息，以及还需要谁参加下一次通话。然后将为下一次通话设定时间。在下一次通话中，将传达第\
  \ 7 章 和 第 8 章 中涵盖的初始建议响应。此时，“停止传播”和“停止损害”的专家和建议将负责。根据需要引入更多的人员或团队。\n\n最终，初始的危机风险将开始降低。最大的损害已经发生或开始稳定。取决于发生的情况，可能将开始谈判赎金。在某个时刻，事件响应将从初始阶段移动到下一个恢复阶段。各种受损的系统将根据业务影响（以及它们的依赖关系）开始排名，并开始进行初始恢复工作。系统将开始重新上线。新的硬件和软件通常会被购买并部署。如果可能，加密的数据可能开始解密。将将检查系统以确保它们没有安装其他后门木马，或者直接从头开始。\n\
  \n保险公司可能会进行多次跟进，以评估进展情况并开始评估当前和未来的预期费用。最终，费用索赔将提交给保险经纪人，将提出问题，必须提供文件，并在更多的讨论中做出承诺。\n\
  \n某些保险付款可能已经提供（减去约定的免赔额），例如支付早期的事件响应人员和恢复费用。或者受害者最初承担所有费用，稍后获得报销。最终，客户将所有收据提交给保险公司，并达成一个最终的报销金额。这很容易在勒索软件事件发生几个月后才完成。这一过程的关键是客户理解他们的网络安全保单涵盖什么、不涵盖什么，以及谁支付什么。理想情况下，客户在签署保单协议*之前*就了解了所有约定的包含费用。\n\
  \n## 注意事项\n\n网络安全保险对于面临勒索软件威胁的组织来说通常是一项划算的交易。他们通常可以将过度的财务风险转移给保险公司。然而，有许多“免责条款”是客户应该寻找的，有些在任何看到它们时应该避免的。\n\
  \n### 社会工程免责条款\n\n\n\n\n有些网络安全保险保单专门排除或大幅削减了涉及社会工程学漏洞利用的保障范围。这类保单在 100% 的情况下都应该避免。这是因为\
  \ 70% 到 90% 的恶意数据泄露都涉及社会工程学。在单独勒索软件时，这一比例略低（但根据大多数调查，这一比例仍超过 50%）。这意味着网络安全漏洞利用事件很可能包含社会工程学作为根源利用方法。允许网络安全保险保单因为社会工程学而拒绝或削弱保障，本质上是接受了在您需要时可能无法获得最佳保障的现实。\n\
  \n### 确保您的保单涵盖勒索软件\n某些保单专门不涵盖勒索软件。一项又一项的调查显示，如今大多数组织（50% 以上）每年都会遭受勒索软件的攻击。这意味着您的组织今年或明年极有可能遭到勒索软件的攻击，而拥有勒索软件免责条款将导致您在最需要的时候无法获得保障。尽管如此，许多组织无法通过其他方式获得任何其他网络安全风险事件的保障，除非接受勒索软件不被涵盖。如果您认为其他网络安全风险事件的风险相当高，并且希望获得这些风险的保障，那么对于面临这些因素的组织来说，这可能是合理的。\n\
  \n### 涉及员工失误\n我看过某些保单，如果员工做出了不当决定导致恶意入侵，保单将拒绝理赔。有时，您可能会看到针对某些情况（如员工故意转账）的“回扣（carve\
  \ back）”条款。您还可能看到某些保险保单规定，如果员工在转账前没有执行要求的“双重授权”程序且资金进入了欺诈账户，将不予理赔。\n\n总的来说，这类免责条款（针对员工失误）相当罕见，但我见过。甚至出现过一些涉及欺诈支付（例如，即\
  \ CEO 诈骗或业务电子邮件诈骗）的法庭案件，网络安全保险公司利用员工的失误来避免支付保单，即使员工的失误并没有在保单中被特定明确地列为免责条款。绝大多数网络攻击都涉及员工受到社会工程学攻击。任何将员工失误作为排除赔付的条款都应该不惜一切地避免。\n\
  \n### 居家办公场景\n某些罕见的保单仅涵盖发生在被保险人主要经营场所的事件。请确保如今非常流行的“居家办公”（WFH）场景不是免责的有效理由。大多数保险都涵盖居家办公场景，而且它们是勒索软件成功的日益增多的原因，但请务必确保您的保单无论员工位于何处都能涵盖您的员工和业务。\n\
  \n### 战争免责条款\n俄罗斯交付的 NotPetya 勒索软件事件给公司造成了数十亿美元的损失，给乌克兰和其他国家造成了数百亿美元的损失。许多网络安全保险公司试图根据“战争行为”免责条款拒绝保障。大多数保险保单都有一项条款，基本上表示他们不涵盖战争行为。事实有力证明\
  \ NotPetya 是由俄罗斯政府的网络进攻部门创建并发布的，该部门当时还利用部队、导弹和其他武器对乌克兰进行了动能攻击。大多数国家和联合国已正式宣布俄罗斯对乌克兰的敌对行为为“战争”。由于\
  \ NotPetya 被视为同一种一种侵略行为的网络军事行动，许多网络安全保险公司表示他们不需要赔付。\n\n好的一面是，尽管存在强有力的“战争行为”辩护依据，大多数网络安全保险公司仍然支付了赔付，其他网络安全保险公司还进一步明确澄清他们确实涵盖数字网络恐怖主义行为。只需仔细阅读您的保单，并对不明确的术语或短语提问。\n\
  \n## 网络安全保险的未来\n除了网络安全保险行业的影响之外，由于越来越多的保险公司不再提供保障，剩余的许多提供者正在增加其产品供应。您在[第 1 章]中读过勒索软件服务（RaaS）。\n\
  \n\n\n本章涵盖了网络安全保险，从其基本概念开始，以及它由于勒索软件攻击的“成功”而发生的变化。如果购买网络安全保险从风险与财务的角度来看是一个明智的决策，那么每个组织都应该考虑购买。每一位网络安全保险的买家都应该确保识别出保单中涵盖和不涵盖的内容。许多买家遭受了损失，因为他们要么没有充分充分理解免责条款，要么不理解这些条款发生的概率。勒索软件正迫使剩余的网络安全公司更好地评估风险，这反过来又迫使客户和潜在客户具备更好的网络安全防护。\n\
  \n第 4 章“法律考虑”涵盖了支付赎金时面临的法律风险。\n\n# 第 4 章：法律考虑\n\n在本章中，我们将讨论与勒索软件恢复和支付相关的法律后果。没有人希望支付勒索软件的勒索。大多数（如果不是所有）执法机构和许多专家建议不要支付赎金，因为这只会鼓励未来的勒索软件勒索事件。然而，大多数人理解，支付赎金对于参与勒索软件恢复事件的受害者（组织）来说，可能是最佳的财务决策。\n\
  \n重要的是，不仅是支付赎金，仅仅是帮助他人从勒索软件事件中恢复，也可能在某些国家、州或监管机构处产生法律风险。*让我再说一遍：仅仅帮助他人从勒索软件事件中恢复就可能导致法律后果！*大多数人如果知道围绕勒索软件的法律风险问题，会认为这只在支付赎金时才适用，但它显然适用于任何帮助受害者从支付赎金的勒索事件中恢复的人。下文将对此更多介绍。\n\
  \n由于大多数勒索软件赎金是用比特币支付的，因此在讨论与勒索软件相关的潜在法律问题之前，更好地了解比特币会有帮助。\n\n## 比特币与加密货币\n\n勒索软件通常要求使用比特币或其他加密货币支付勒索赎金。正如第\
  \ 1 章所提到的，比特币于 2009 年 1 月由一个名为中本聪（Satoshi Nakamoto）的（伪）匿名身份首次公开发布。中本聪通过一篇名为《比特币：一种点对点的电子现金系统》（`https://bitcoin.org/bitcoin.pdf`）的论文向世界发布了比特币，并附带了一个任何人都可以创建和使用比特币的网站和软件。直到\
  \ 2013 年 12 月，第一个勒索软件程序`CryptoLocker`才开始要求用比特币支付。之前，各种勒索软件供应商要求将款项发送到外国邮政信箱、汇款服务和货币卡。这些每种方法都让追踪资金到诈犯的真实身份变得更加困难，但并非不可能。如果当局足够重视资金追踪，他们通常能够识别出接收者，并将收集的证据纳入官方法律诉讼。不言而喻，这让犯罪分子感到非常沮丧。\n\
  \n比特币以及后期其他加密货币的出现，在某种程度上让追踪资金变得更容易，但要看到谁拿了钱却变得极其困难甚至不可能（稍后将详细介绍）。许多人错误地认为使用比特币和加密货币会让资金轨迹无法追踪，但事实并非总是如此。但由于加密货币使用者的真实身份可能是未知的，且难以或无法确定，如今大多数勒索软件程序都要求用比特币支付，尽管有一小部分要求用其他加密货币或其他更隐晦的方法支付。\n\
  \n有许多理由值得理解为什么犯罪分子喜欢使用比特币、区块链和其他加密货币。比特币和其他加密货币使用加密程序、协议、创建和“证明”来创建、追踪和验证价值、交易以及追踪到每笔交易的数字身份。\n\
  \n特别是当中本聪发布比特币时，他（为了写作方便假设代词为*他*）不仅创建了比特币，还创建了一个底层分布式追踪账本，称为`区块链`。今天，区块链可以并且与其他加密货币分开使用，也可以与其他比特币或任何加密货币无关的应用分开使用。\n\
  \n区块链是一个分布式、去中心化的账本（即数据库或记录列表），用于追踪和验证单个交易或一组交易。所追踪的每笔交易可以存储在单独的交易“区块”中，也可以将多个交易共同存储在一个区块中。每个区块存储的交易数量以及交易代表的内容取决于实现方式。单个区块包含交易信息（它可以是应用程序定义的任何信息，包括仅为所需交易信息的哈希值）以及至少一个加密哈希结果，以及任何其他必要信息。图\
  \ 4.1 展示了一种常见的区块链格式。\n\n![图 4.1 常见区块链格式的图形表示](img/c04f001.png)\n\n图 4.1 常见区块链格式的图形表示\n\
  \n哈希是使用加密哈希算法处理任何内容后的加密结果。哈希处理的输出结果被称为`hash result`（哈希结果），或者为了混淆，也称为`hash`。对于每个唯一的输入，哈希结果是唯一的。因此，如果两个分析的输入产生了相同的哈希结果，那么这两个输入极可能是相同的，反之亦然。任何不同的输入都会产生不同的哈希结果。哈希结果或哈希用于通过加密方式证明或反驳两个对比的内容是否相同。哈希贯穿于计算机和数字交易，用于证明或反驳两个不同对比内容的完整性。常见的哈希算法有`SHA2`、`RIPEMD-160`、`NT`、`BCRY`等。区块链使用哈希来验证过去交易的完整性。\n\
  \n区块链的“链”是指上一个区块的哈希存储在下一个区块中，而该区块又被哈希并存储在下一个区块中，以此此类推。这使得后续每个区块都通过哈希与前一个区块挂钩，使得区块链中的所有区块都通过加密方式相互链接。你无法轻易篡改任何区块，而不修改后续的所有区块（因为被篡改区块的哈希值会改变）。这对于防止篡改之前的交易是一种非常强（尽管并非完美）的保护。\n\
  \n比特币是第一个加密货币，也是第一个使用分布式点对点区块链来追踪交易的货币。存在几种不同的比特币区块链（叉），用于存储涉及区块链的个人价值并追踪该区块链的交易。每个比特币叉都有其参与者使用的独立独立区块链。今天最常用的、价值最高（根据\
  \ 2021 年 8 月的价格计算，价值数数百亿美元）的版本与`BTC`交易符号相关。当大多数人说起“比特币”时，他们指的通常是这个版本。\n\n\n\n每位比特币参与者都有一个比特币区块链“地址”。该地址是参与者与之相关的非对称私钥/公钥对中的公钥。对特定私钥的所有权或对私钥的了解使得持有者能够在区块链上进行安全的交易。参与者的公钥是任何人皆知的，可用于验证私钥用户的交易。\n\
  \n每个参与者可以拥有一个或多个地址，但这些地址是参与者在区块链上价值存储的关键。如果私钥所有者失去了对其私钥的控制权（或使用能力，通过丢失或失去对私钥的唯一所有权），他们将无法进行未来的安全交易、无法提取价值，甚至无法证明他们对存储在区块链上的现有价值的所有权。如果他们丢失了私钥（即\
  \ `address`），他们的“钱”基本上就消失了。如果其他人获取了受害者的私钥，他们就可以偷取受害者的加密货币。\n\n参与者的区块链地址是他们在区块链上的身份。在比特币和其他大多数加密货币中，一个人的真实身份与区块链地址之间没有任何关联。这就是为什么数字犯罪分子倾向于使用加密货币来索要和接收赎金。如果他们足够小心，那么极难甚至无法将区块链交易与任何人的真实身份联系起来。\n\
  \n任何参与者都可以使用其比特币地址发送或接收比特币价值。每笔交易都使用参与者的地址记录在区块链中。每位参与者都可以下载部分或整个区块链。目前，`BTC` 区块链的大小已有数十\
  \ GB。但任何参与者都可以加载比特币客户端，并指令其将整个区块链下载到他们的本地计算机/设备上。区块链上的每笔交易都可以被任何参与者查看或验证。\n\n不同的加密货币和应用程序的工作方式不同，但它们通常都具有这样一个特性：允许任何参与者查看区块链的部分或全部，并验证交易。\n\
  \n区块链对调查人员变得有用之处在于，任何参与者（包括调查人员）都可以看到哪些交易和价值流向哪个地址。因此，支付的任何赎金都是支付给特定的区块链地址，包括调查人员在内的所有人都能看到支付的地点、时间和金额。大多数勒索软件勒索要求都会包含一段文本，指示必须使用哪种加密货币和区块链地址来支付赎金。图\
  \ 4.2 显示了 第 1 章 中 图 1.2 NotPetya 显示的比特币地址。\n\n![图 4.2 NotPetya 使用的比特币地址](img/c04f002.png)\n\
  \n图 4.2 NotPetya 使用的比特币地址\n\n尽管 NotPetya 是一种擦除软件（例如，专门用于破坏数据）而不是勒索软件，但典型的勒索软件勒索指令看起来非常相似。有时勒索软件勒索指令会要求受害者通过预定义的电子邮件地址或聊天通道向勒索团发送电子邮件以获取详情，但在过程中受害者会获得一个用于发送价值的区块链地址。这就是勒索团获得付款的方式。\n\
  \n勒索软件团通常会有多个区块链地址，尽管增加地址数量会增加操作的复杂性。这就像任何其他账户一样。\n\n\n\n\n勒索软件窃贼经常使用 `bitcoin fogging`\
  \ 作为为自己提供额外保护的一种。执法部门和追踪人员通常可以识别出这些混淆者，因为有大量看似相互无关的交易被转移到一个公共地址，随后又有一系列在规模和金额上都各不同的交易从另一端流出。有时，混淆者会失误，被执法部门识别并最终被捕，正如示例“联邦调查局逮捕一名涉嫌\
  \ 3.6 亿美元比特币洗钱头目”所示（`https://www.wired.com/story/bitcoin-fog-dark-web-cryptocurrency-arrest/`）。\n\
  \n比特币和其他加密货币对勒索软件犯罪分子来说既有优势也有缺点。优势明显大于劣势，但执法部门和防御缓解措施正试图缩小这一差距。许多人甚至多次尝试禁止与非法活动（包括勒索软件）密切相关的比特币和其他加密货币。这些人员呼吁建立一种更受监管的加密货币类型，以增加犯罪分子使用的难度。目前尚不清楚此类倡议是否会获得支持，或者如果成为法律，是否能有效减少勒索软件。\n\
  \n## 支付赎金会让你面临法律风险吗？\n\n在受害者领域，试图从刑事损害中尽可能恢复却可能导致受害者及其帮助者陷入法律危险，是非常罕见的。但在某些国家（包括美国），这确实是可能的。2020\
  \ 年 10 月 1 日，美国财政部外国资产控制办公室（`OFAC`）发布了一备忘录（`https://home.treasury.gov/system/files/126/ofac_ransomware_advisory_10012020_1.pdf`），专门针对支付勒索软件赎金的人员组织及其帮助者可能面临的法律问题威胁。图\
  \ 4.4\n\n图 4.4 OFAC 备忘录开头，说明受害者支付勒索软件可能是非法的\n\n美国执法部门一直正式建议不要支付赎金。毕竟，这只会助长网络犯罪分子实施更多勒索软件攻击。但在此之前，美国或其他任何地方的执法部门从未暗示过，支付赎金的勒索软件受害者或任何帮助他们的人（即使完全没有参与支付赎金）可能会面临法律后果。在美国和其他国家，向列入的“被禁止”国家和个人汇款、提供帮助或其他有价值的物品一直是非法的。这就是\
  \ `OFAC` 备忘录所指的是或提醒人们的。它明确说明了以下内容（使用备忘录中的选定陈述）：\n\n> “OFAC 已在其网络相关制裁计划和其他制裁计划下指定了大量恶意网络参与，包括勒索软件攻击的实施者和协助勒索软件交易的人员……协助由于恶意网络活动而要求的勒索软件支付，可能会使具有制裁关联的犯罪分子和对手获利并推进其非法目标……美国人士通常被禁止直接或间接地与\
  \ `OFAC` 特别指定的国民和受制人员名单（SDN 名单）上的个人或实体（“个人”）进行交易……OFAC 可根据严格责任制对违反制裁的行为实施民事处罚，这意味着受美国管辖的人员即使不知道或没有理由知道其正在与根据\
  \ OFAC 管理的制裁法律法规所禁止的人员进行交易，也可能承担民事责任。”\n\n该备忘录非常有包容性，指出即使仅提供恢复和取证服务的计算机人员/组织也可能承担法律责任。`OFAC`\
  \ 备忘录规定：\n\n> “这同样适用于与勒索软件攻击受害者接触的公司，例如提供网络保险、数字取证和事件响应，以及可能涉及赎金支付服务的金融公司（包括存款机构和货币服务业务）。”\n\
  \n因此，任何即使提供恢复服务的公司，只需尝试帮助受害者公司从勒索软件攻击中恢复，就可能面临法律风险，即使没有任何一方理由知道他们正在打交道的勒索软件小组在禁止名单上。这相当令人恐惧。明确的是，美国政府和\
  \ `OFAC` 只是在重申已经成为法律的规定，并仅仅澄清：是的，它也适用于勒索软件事件。仅仅是提供这份提醒性的“澄清”，就在涉及的社区中引起了震波（即任何可能受到勒索软件攻击、参与勒索软件恢复的组织及其法律顾问）。\n\
  \n勒索软件小组可能在禁止名单上的想法并不是某种未来的担忧。备忘录列出了许多在禁止名单上的勒索软件小组或人员示例，包括：\n\n*   `Cryptolocker`\
  \ 的开发者 Evgeniy Mikhailovich Bogachev\n*   两名为恶意网络活动提供物质支持的伊朗，并识别出两个用于输送 `SamSam`\
  \ 勒索软件收益的数字货币地址\n*   `WannaCry` 勒索软件背后的朝鲜 `Lazarus Group`，以及两个子小组 `Bluenoroff` 和\
  \ `Andariel`\n\n其他国家甚至美国的各州也提议了禁止支付赎金的立法，例如：`https://www.csoonline.com/article/3622888/four-states-propose-laws-to-ban-ransomware-payments.html`。许多有权罚款的监管机构也建议不要支付勒索软件勒索。\n\
  \n这一切引出了问题：“你（一个美国组织）会因为支付赎金而受到惩罚吗？”短答案是：会的。\n\n\n\n\n预先，你应该就这些问题咨询律师，这样如果你的组织遭受了勒索软件攻击，你的律师已经咨询了所有必要的法律资源，并制定了明智的意见，以指导你的组织应对勒索软件攻击。你不希望在遭受勒索软件事件打击后，才开始在极其紧迫的时间表下寻求法律意见。尽管如此，大多数遭受勒索软件攻击的组织并没有提前做好这些准备。如果遭受了勒索软件攻击，请获得快速且专业的法律建议。\n\
  \n### 尝试追踪资金流向\n\n尽管 `OFAC` 规定“……即使[受害者]不知道或没有理由知道其正在与受 `OFAC` 管理的制裁法律法规禁止的个人进行交易，`[受害者仍可能承担责任]”，但查看索要赎金的特定勒索软件小组是否在已知的“禁用名单”上并无害处。正如前文所述，有一些企业提供此类服务，包括区块链追踪公司，例如\
  \ `Elliptic` (`www.elliptic.co`)。一些网络保险公司和承保人（如 `CFC Underwriting` (`www.cfcunderwriting.com`)）将此类服务作为其网络安全保险政策和业务的一部分提供。\n\
  \n### 引入执法部门\n\n引入执法部门是一项双刃剑的缓解措施，是否这样做应由高级管理层和法律部门决定。通常情况下，引入执法部门是好事。他们通常会提供良好的建议和指导。然而，执法部门有法律权利根据其意愿做很多可能违背你的意愿，例如没收资产、调查人员、禁止交易等。当你邀请执法部门介入你的网络安全事件时，你是在引入一种风险，即他们可能会强制做出受害者或其组织不希望的决定。\n\
  \n但在美国，邀请执法部门介入有一个特别充分的理由。`OFAC` 备录还提到了以下内容：\n\n> “根据 `OFAC` 的执法指南，如果事后确定情况与制裁有关，`OFAC`\
  \ 还会将公司向执法部门主动发起的、及时且完整的勒索软件攻击报告，视为确定适当执法结果的一个重要减轻因素。`OFAC` 在评估可能的执法结果时，公司在勒索软件攻击期间和之后对执法部门全面且及时的配合也被视为一个重要的减轻因素。”\n\
  \n对于美国组织而言，只有当美国执法机构和/或美国网络安全基础设施安全局 (`CISA`) 会因支付赎金而面临法律威胁时，引入他们才对组织的案件有所帮助。\n\n\
  ### 获取 OFAC 许可以支付赎金\n\n美国受害者也可以申请 `OFAC` “许可”以尝试获得支付赎金的批准，尽管 `OFAC` 规定存在“拒绝推定”。如果你遭受了勒索软件事件，你必须让律师来告诉你应该采取的路径和行动。\n\
  \n### 尽尽职调查\n\n任何人能给你的最佳建议就是就此问题获得良好的法律意见并进行尽职调查。虽然我没有见过任何组织或个人仅仅因为支付勒索软件勒索款（且没有其他非法关联或与勒索软件组织的往来）而被起诉，但你不希望成为第一个“测试案例”。不要成为第一个因支付赎金而被起诉或受到惩罚的组织。不要成为头条新闻。做好你的尽职调查。\n\
  \n## 这属于官方数据泄露吗？\n\n并不是每个勒索软件事件都会变成数据泄露。并不是每个涉及数据外泄的勒索软件攻击都是“官方”数据泄露。被盗的数据可能不是监管定义的数据类型（例如\
  \ `PII`、`PHI` 等），或未涵盖其他强制性保护合同范围内。但大多数组织都受某种数据治理/隐私法律或合同的约束，当定义的受保护数据泄露时，需要向公开和私有部门报告。任何勒索软件事件的一部分，是确定该事件是否构成必须向组织外报告并按规定要求的方式处理的官方泄露。如果你的组织可能受此类数据泄露报告法律或合同的约束，让你的律师来做出判断。\n\
  \n### 保留证据\n\n如果涉及的资源可能被用于法医调查、法律事务或监管调查的一部分，你就应该保留所有证据。在有疑问时，请保留所有证据。这意味着至少要对所有涉及资源的硬盘（以及可能还有内存）进行法医复制。在大多数情况下，这样做是正确的做法，即使不涉及法律和监管问题也是如此。许多勒索软件受害者在后期提出了他们无法回答的问题，因为他们急于恢复而破坏了原始证据。勒索软件加密密钥有时会在计算机内存中。你不希望在不需要向犯罪分子支付密钥的情况下错失恢复数据的机会。\n\
  \n## 法律辩护总结\n\n总而言之，为了降低因支付勒索软件勒索款或参与恢复而受到惩罚的风险，请履行你的尽职调查。\n\n如果你是勒索软件受害者：\n\n*\
  \   让你的法律团队参与此问题（如果可能，请提前），以便他们进行研究，并就如何处理勒索软件事件带来的法律风险为你提供经过充分研究的意见。\n*   如果遭受了勒索软件攻击，立即让你的法律团队介入。\n\
  *   让你的法律团队就该事件与他人进行所有联系，这样沟通更有可能受到法律特权通信法律的保护。\n*   尝试确定勒索软件小组是否在“禁用”监控名单上。\n*\
  \   涉及相关的执法部门并遵循他们的指导。\n*   如果你计划支付勒索软件勒索要求，考虑获取 `OFAC` “许可”。\n*   在有疑问时，考虑不要支付勒索软件勒索要求。\n\
  *   确定你是否需要保留证据，并在不确定时请保留证据。\n*   确定是否发生了官方数据泄露，如果是，以及如何应对。\n\n\n\n在本章中，我们将讨论如何制定详细的勒索软件响应计划，包括为什么要制定、何时制定以及其中应该包含什么。这里总结的许多项目将在后续章节中进行详细介绍。\n\
  \n## 为什么要进行响应规划？\n\n为什么任何组织都需要勒索软件响应计划？简单一句话：为了节省金钱。自 2020 年以来，在所有调查的组织中，三分之一到超过一半的在一年内被勒索软件成功利用。这意味着任何组织在一年内被勒索软件成功攻击的概率非常高。大约一半的组织在勒索软件能够加密所有目标数据之前意识到了初始攻击，尽管某些组织最终因为数据泄露威胁而不得不支付赎金。\n\
  \n积极且针对性地准备勒索软件攻击的组织，有更好的机会防止勒索软件，更有机会更快识别勒索软件，并且比那些没有准备的组织恢复得更快、成本更低。创建并练习勒索软件计划可能意味着更快的检测、更快的响应时间、更低的损失成本、更快的恢复运行以及更少的法律责任。\n\
  \n## 何时应该制定响应计划？\n\n你应该什么时候制定勒索软件响应计划？现在，在勒索软件成功利用你的环境之前。如果你还没有勒索软件响应计划，请开始创建一个，目标是尽快拥有一个。几乎没有其他威胁具有如此高的环境攻破风险，且会造成如此巨大的损害。如果你还没有勒索软件响应计划，时间至关重要。现在就开始。我可以向你保证，每一个在被利用时没有响应计划的勒索软件受害者，都希望自己在事件发生前已经有了计划。在可以进行更深思考分析时做出的决策，比在压力下第一次做出的决策更有可能产生有利的结果。即便如此，勒索软件响应计划也是一个极佳的企业全方位教育工具。在理想情况下，它是具体的、指令性的指导，能够支持并改进你更通用的业务连续性/灾难恢复和应急响应计划。\n\
  \n## 响应计划应该包含什么？\n\n勒索软件响应计划需要应对勒索软件攻击的关键人员、策略、工具、决策和流程。本节将讨论勒索软件响应计划中应该包含的内容。\n\
  \n### 小规模响应与大规模响应的阈值\n\n并不是每个勒索软件事件都会损害组织的大部分或关键任务部分。许多勒索软件事件在造成最大损害之前就被捕获。单个受损的设备除非干扰了关键任务操作，否则通常不会导致全面响应。`antivirus/EDR`\
  \ 在勒索软件执行之前捕获的勒索软件，通常不会导致完整的勒索软件响应事件。也许几台受损的机器会导致一次快速检查，以查看是否有更多计算机受损，但除非初始检查确认了更多受损，否则不需要整个勒索软件团队。启动完整勒索软件响应计划的必要阈值是什么？根据计划，每份计划都应该包含在执行整个勒索软件响应之前必须满足的阈值。对于小事件无需大动干戈。\n\
  \n### 关键人员\n\n你的勒索软件响应计划需要提前识别所有将参与勒索软件响应事件的人员和团队。推荐的角色包括：\n\n* 团队负责人\n* 高层管理\n\
  * 法务代表\n* IT 人员\n* 勒索软件领域专家\n* 帮助热台\n* IT 安全\n* 应急响应\n* 公关\n* 外部顾问以及* 法律执法部门\n*\
  \ 网络安全保险联系人\n* 外部资源\n\n在较小的组织中，这些许多角色可以由一个人代表。目标是提前识别所有所需的角色和人员以及他们参与的需求。\n\n###\
  \ 通讯计划\n\n这是计划的关键部分。许多最糟糕的结果被归因于沟通不畅，这并不意外。所以，请提前做好计划。需要决定的第一个通信目标是每个人将如何访问勒索软件计划。假设环境中的每个设备都已受损和/或故障。响应计划是否已打印并物理存储在每个参与者的家中？如果是，你是否能确保每次更新时每位参与者都能获得更新？它是否存储在另一个未连接到组织主网络的在线网站上，且可以保证所有参与者都能访问？\n\
  \n如何通知团队成员勒索软件事件？再次，你的网络和正常通信通道可能会中断。我建议你在没有更好方法时计划使用手机。在计划中列出每个人的电话号码或将其收集在单独的文档中。\n\
  \n需要独立的会议空间吗？大多数团队能够在组织正常使用的常规办公空间见面。但我参与过一些恶意攻击事件，在这些事件中，正常的会议空间被破坏使得使用变得具有风险。在某些情况下，IP\
  \ 电话系统或远程会议软件被攻破，导致攻击者可以监控正在进行的会议。如果担心这一点，请设置一个安全的外部会议区域；或者直接假设所有会议都将使用安全可靠的通信方法远程举行。\n\
  \n很有可能提前建立一个独立的在线通信通道，以便团队成员可以互相发送信息和更新。这可能不应该是你的普通电子邮件系统或设备。选择一个所有人都可以使用的外部在线通信通道。例如，不使用正常公司方法访问的特定特定的\
  \ Microsoft Office 365 或 Gmail 账户可以作为备用通信通道。许多响应团队甚至比于购买新的设备和网络设备，所有团队成员在响应事件中必须使用这些设备。\n\
  \n\n\n一次严重的勒索软件事件将严重影响运营。你将通过直接接触和媒体渠道与员工、客户、其他利益相关者、监管机构以及潜在的“公众”进行沟通。你需要决定向谁沟通什么以及何时沟通。提前在你的计划中引入公关（PR）团队，并听取他们关于如何与每种受众沟通的建议。他们应该为每种类型的受众制作一些粗略的模板。当然，法律顾问需要审查所有通信内容（理想情况下在作为示例制作之前审查），并与公关团队紧密合作。他们应该计划好在所有正常系统都崩溃时如何进行沟通。\n\
  \n我经常看到勒索软件的受害者花费几天时间才公开承认发生了某些事情。这在很大程度上是因为他们所有的系统和正常通信手段都崩溃了，而他们没有对这种情况做好预案。很多时候，外界发现问题出问题的唯一线索就是受害者没有向任何人进行沟通。受害者组织没有任何人回复电子邮件。有时甚至电话系统也会宕机。网站通常会弹出\
  \ 404（“未找到”）错误信息，或者更糟糕，这些信息还包含了勒索软件团伙的嘲讽和不安信息。客户和人们理解，在严重的勒索软件事件期间，与他们沟通可能不是你的首要任务，但如果你在需要时已经准备好了一些周全的初始沟通信息，那情况会好多少呢？\n\
  \n确认什么信息以及何时确认是拼图中的重要部分。你希望在沟通中保持诚实和透明。你希望做到及时（绝对满足并可能超过监管要求）。你希望沟通的内容足够，但不要过量。永远不要撒谎、过度承诺，或将未确认的事实描述为事实。同时，缺乏真实信息的简短、晦涩的消息对外部人员很少起到安慰作用，甚至可能看起来像是受害者在隐藏某些事情。计划在初始响应中至少提供几段信息的沟通。通常，这种响应应该来自组织领导者（即\
  \ `CEO`）。\n\n由于员工的个人信息和凭据经常会被勒索软件破解泄露，请考虑如何处理这种结果，特别是当不支付赎金的情况下。某些员工可能会觉得组织不够关心他们，决定为了利润而牺牲员工的个人信息。你需要安慰员工，并反驳勒索软件团伙任何相反的叙说。如果你没有支付赎金且员工信息被盗，请解释原因。如果员工个人信息被盗，考虑提供期一年的免费信用监控服务，或其他会让员工尊重的善意措施。\n\
  \n### 可靠备份\n\n尽管仅靠备份通常无法减轻大多数勒索软件程序造成的所有损害，但可靠、详尽、经过测试、离线且最新的备份必须是一项关键要求。遗憾的是，认为自己拥有良好备份的组织比实际上拥有良好备份的组织多得多。你的组织需要确认自己拥有良好的备份。它必须是全面的。\n\
  \n这意味着要假设最坏的情况，即你环境中的每台关键任务设备都已完全加密、无法运行并且/或不再具有安全完整性。这包括服务器、工作站、基础设施服务、云服务、存储设备、前端设备、中间件、数据库、Web\
  \ 服务器等。\n\n大多数声称拥有可靠备份的组织，要么没有这种全面的恢复能力，要么从未进行过这种规模的备恢复测试。不要让大规模的勒索软件事件成为你唯一的测试。\n\
  \n### 赎金支付计划\n\n任何组织可以提前做出的最重要的决策之一，就是是否支付赎金。没有人想要支付勒索要求，尽管许多组织正确地认为支付赎金更便宜、更快速。有些组织从伦理上拒绝支付赎金。另一些组织在监管或法律上禁止支付赎金。无法保证支付赎金会导致任何数据恢复，更不用说完全恢复了。因此，综上所述，你的组织会支付赎金吗？这是一个二选一的问题：是或否。\n\
  \n\n\n\n有很多组织声称他们绝不会支付赎金，但一旦漏洞被利用，最终还是支付了赎金。因此，第一步是确定你的组织是否真的会支付赎金。如果答案是组织绝对不会支付赎金，那么这需要被纳入你的规划和沟通规划流程中。我曾见过许多个人因为没有支付赎金而受到赞誉，即使这导致了更长的停机时间，且消耗的资源远比支付赎金要多。只需确保高层管理对所做的任何决定表示一致即可。决定是否支付勒索软件赎金通常不是\
  \ IT 部门的最终责任，而是取决于高层管理和法律团队。\n\n组织在需要时对支付赎金持开放态度是很。他们将根据具体情况决定可能支付或不支付赎金。关键在于确定无论出现什么问题，支付赎金是否具有这种可能。如果这种可能，那么就必须通知所有参与人员，这一决定将显著影响修复工作和勒索软件响应计划。\n\
  \n如果支付赎金是有可能的，那么提前决定什么种情况和事实会导致支付或不支付赎金是有帮助的，包括以下内容：\n\n*   涉及的勒索软件是否已知在支付赎金后能提供成功的解密？\n\
  *   受害者组织在不支付赎金的情况下，能否承受数据和凭据泄露的风险或潜在后果？\n*   受害者支付赎金是否合法？受害者如何确认合法性？\n*   支付的赎金最高金额是多少？\n\
  *   受害者组织能多快筹集到所要求的金额？\n*   将如何支付赎金？\n*   保险会涵盖赎金成本吗？\n*   你是否会使用专业的谈判员？\n\n大多数经验丰富且知识渊勒索软件恢复专家都会告诉你，每一个勒索软件事件都是独特的，但每个勒索软件团伙都有其运作模式和要求。勒索软件响应人员首先想要确定涉及的是哪种勒索软件程序和勒索软件团伙。某些勒索软件程序和团伙即使支付了赎金也极不可靠，专家会建议不要支付赎金。如果你想要最快速、成本最低的恢复，大多数恢复专家会建议支付赎金。你能够信任恢复后加密的系统是安全的吗？你能够信任勒索软件团伙会删除或不发布泄露的数据和凭据吗？所有这些类型的问题和决定都需要提前考虑并回答。你不想在巨大的停机事件的高热时刻去考虑你的勒索勒索政策是什么。提前思考你将做什么和不做什么，会让对勒索软件事件的响应更具可预测性。\n\
  \n### 网络安全保险计划\n\n你的组织会购买网络安全保险？多年来，购买网络安全保险的组织比例一直在增加。这对于受害者公司和保险行业来说都有极佳的益处。遗憾的是，勒索软件可怕的“成功”导致保费大幅上涨、免赔额提高、覆盖范围缩小以及选择减少。网络安全保险可能不再是曾经提供的那种财务利益。尽管如此，我建议每个组织都考虑网络安全保险，并提前决定他们是否希望购买。更多细节请参见第\
  \ 3 章，“网络安全保险”。\n\n如果你购买了网络安全保险：\n\n*   确保它涵盖勒索软件。\n*   将任何网络安全保险单存储在离线位置或远离潜在勒索软件的地方。\n\
  *   确保你以防万一有必要的联系信息。\n\n### 宣布数据泄露的条件\n\n组织在需要时对支付赎金持开放态度是很。他们将根据具体情况决定可能支付或不支付赎金。关键在于确定无论出现什么问题，支付赎金是否具有这种可能。如果这种可能，那么就必须通知所有参与人员，这一决定将显著影响修复工作和勒索软件响应计划。\n\
  \n法律和法规规定了发生泄露时的处理措施。许多组织直到为时已晚才意识到这些要求。理解报告泄露的法律义务是非常重要的，因为这些要求因管辖区和行业而异。\n\n与愿意在需要时“即时”出售加密货币的经纪人合作。在需要时直接购买加密货币。通过专门支付勒索赎金的经纪人或谈判员，他们已经拥有必要的账户或货币。我听过好几个勒索软件受害者告诉我，被偷的东西并没有被。\n\
  \n提前决定什么因素会导致你的组织正式宣布数据泄露。如果检测到数据泄露，在报告之前最多可以多久？必须向谁报告？再次，这需要高层管理和法律团队做出决定。\n\n\
  ### 内部与外部顾问\n\n你会邀请谁参与勒索软件事件？你会使用所有内部员工处理，还是会引入外部资源？如果你使用外部资源，他们会是谁？如果你有网络安全保险，你是必须使用他们指定的资源，还是这些恢复资源只是建议？你会使用单一资源，还是针对不同的技术使用不同的小组？\n\
  \n我的建议是确保你邀请的每个人在响应勒索软件方面都有丰富的经验。提前挑选一个勒索软件响应协调员，让他们在预算限制的情况下拥有必要的人员。你不想自己应对勒索软件，或使用缺乏经验的外部小组。你需要一个有经验的领导者。\n\
  \n无论你使用谁作为恢复资源，在勒索软件事件发生之前先与他们建立联系（如果还没有关系的话）。告诉他们你的勒索软件响应计划，以及你认为事件进展如何以及供应商的责任（如果需要的话）。当然，许多勒索软件响应专家会在你联系他们后从他们的角度告诉你将如何进行。你甚至可能想要他们对你的勒索软件响应计划提供意见，看看他们会增加、修改或删除什么。\n\
  \n### 加密钱包\n\n如果你可能会支付赎金，你需要考虑如何使用加密货币支付——可能是比特币。将现金兑换成加密货币可能很快。传统方法包括：\n\n*   在需要之前，提前在加密货币交易所建立加密货币账户和余额。\n\
  *   仅在需要时在加密货币交易所建立加密货币账户。\n*   与愿意在需要时“即时”出售加密货币的加密货币经纪人合作。\n*   通过专门支付勒索赎金的经纪人或谈判员，他们已经拥有必要的账户或货币\n\
  \n\n\n\n在信誉良好的加密货币交易所（如 `https://www.coinbase.com`）建立加密货币账户可能需要一天或更长时间。将非加密货币资金转入加密货币账户很容易花费三到五天。勒索软件组织通常要求在一天到七天内付款，因此如果你是第一次建立加密货币账户，可能会出现调度问题，而这是在决定支付赎金后可能发生的任何延迟之外的。你可以通过在信誉良好的交易所预先建立加密货币账户来减少一些等待时间。这样，你只需要等待账户中所需的加密货币金额发生任何必要的变化即可。\n\
  \n你可以从某人即时购买加密货币（例如查看 `https://localbitcoins.com/`）。然而，通常情况下，买卖加密货币越快，欺诈交易的风险越高，且/或通常涉及更高的交易费用。\n\
  \n如果你有网络安全保险单，请与你的保险经纪人讨论勒索软件赎金将如何支付。协助付款是他们的人的责任，还是完全取决于你和你的事件响应供应商？某些保险单会代表你提供服务，例如谈判和支付赎金，而另一些则仅提供报销。对于后者，你的组织负责所有与恢复勒索软件相关的费用，并可以在事后报销。虽然这种保险计划较便宜，但它要求组织手中保留更多资金和资源来应对勒索软件攻击。\n\
  \n如果你直接与勒索软件组织处理勒索软件付款，你可能需要建立 `TOR`（洋葱路由）浏览器（`https://www.torproject.org/`）并与勒索软件组织的地址建立连接。使用\
  \ `TOR` 浏览器和连接意味着你正在连接到“暗网”，这简单意味着能够访问普通网络无法访问的网站和服务。虽然暗网充满了不符合伦理的网站和服务，但只需连接那里不需要在使用常规浏览器会话时可能采取措施之外的任何技术保护，尽管从隔离的计算机/虚拟机连接将降低风险。\n\
  \n## 响应\n\n你的勒索软件恢复计划中最大的部分当然应该是实际的恢复步骤。你希望阻止初始传播、限制损害、从事件中恢复并防止其再次发生。这些阶段中的每一个都将在\
  \ 第 7 章 到 第 11 章 中详细介绍。\n\n你的勒索软件恢复响应计划应该与现有的业务连续性/灾难恢复（BC/DR）计划集成（如果存在），适应并利用现有的策略、程序、工具和格式。勒索软件恢复计划是你的正常\
  \ BC/DR 规划的子集。\n\n### 检查清单\n\n准备一个随时可用的总结清单总是好的，它涵盖了任何参与者都可以快速参考的所有关键点。这里是一个快速清单示例：\n\
  \n*   确认勒索软件被利用\n*   勒索软件事件是否需要全面的事件响应并激活勒索软件响应计划？如果是，继续：\n*   激活勒索软件响应计划\n*   通知高层管理人员和其他参与者\n\
  *   按照计划建立备用通信（如果需要）\n*   从网络上断开可能涉及的设备，包括无线连接\n*   减少初始传播和损害（第 7 章）\n*   启动公关通信计划\n\
  *   确定勒索软件变种并研究预期行为（如果可能的话）\n*   确定勒索软件利用损害的范围\n    *   涉及的位置、设备、数据和系统，哪些被加密了，数据和凭据泄露等。\n\
  *   联系网络安全保险公司（如果涉及）\n*   联系勒索软件响应恢复人员\n*   寻找后门和其他恶意程序\n*   确定初始损害范围和已知后果\n*  \
  \ 召开初始响应会议（或）\n*   决定是否应该支付赎金；如果是，开始谈判\n*   开始恢复（第 8 章 和 第 9 章）\n*   备份加密文件以备错误恢复/可能的未来解密（可选）\n\
  *   确定初始根因感染向量并缓解\n*   根据业务影响评估/需求优先考虑系统恢复\n*   决定是否可能并希望进行解密，如果是，则开始\n*   决定是否需要恢复备份，如果是，则开始\n\
  *   决定是否需要系统恢复或重建，如果是，则开始\n*   如果支付了赎金并收到解密密钥，在隔离的测试系统上进行测试\n    *   如果测试成功且如果希望使用勒索软件解密密钥进行解密，则支付赎金，获取其余密钥并继续\n\
  *   移除后门和其他恶意程序\n*   将系统恢复到已知的清洁或最可信状态\n*   更改所有可能被盗的登录凭据\n*   继续系统解密/恢复/还原/重建\n\
  *   完全恢复环境\n*   进行事后分析（哪些做得好，哪些做得不好，应该改变什么）\n*   尝试防止下一次攻击（第 10 章）\n\n此清单并不详细、详尽或并非完全有序。每个勒索软件恢复计划都是定制的。再次，第\
  \ 7 章 到 第 11 章 将详细介绍这些步骤。\n\n定义 定义\n\n所有的技术术语和缩写，例如勒索软件、比特币、加密货币、网络安全保险、多因素身份验证、补丁、钓鱼、针对性网络钓鱼等，都应在计划中说明，以确保勒索软件响应计划的所有读者对其都有共同的。永远不要假设任何人或所有人理解所有的术语和缩写。定义可以放在计划的开头或结尾，取决于组织的偏好。\n\
  \n## 实践形成\n\n如果没有练习，计划就大打折扣。所有参与者和利益相关者都应该审查计划草案，并建议增加、更改和删除。在最终草案批准后，每个人都应该审查并练习。在大多数情况下，应该进行“桌面演习”练习，每个参与者按顺序执行其所需的角色，无论是现场还是远程，以让每个人对计划有良好的了解。\n\
  \n一些最关键的角色和程序不应仅仅是桌面演习、心理练习，而应该尽可能根据真实的流程和工具进行实际练习。例如，备份人员应该进行彻底的测试恢复，以证明实际上可以执行可靠、全面、最新的恢复。应该使用取证工具来搜寻可能的恶意程序和行为。联系信息是否能让团队成员和利益相关者及时联系，等等？该计划应至少练习一次，或者在发生重大更新后进行。\n\
  \n## 总结\n\n你希望定义在勒索软件恢复事件中需要涉及的所有重大决策、策略、工具、程序和人员。将所有这些记录在书面文档中，并确保在发生勒索软件事件时可以访问。预先定义如何联系团队成员，并让每个相关的利益相关者熟悉并练习该计划。拥有全面的、经过练习的勒索软件恢复计划可能会比等待事件发生获得更快、更廉价的恢复。\n\
  \n\n\n\n第 6 章，“检测勒索软件”将讨论在勒索软件绕过你已实施的预防控制并成功渗透环境后，如何有效地检测它。\n\n# 第 6 章：检测勒索软件\n\n\
  如果你无法防止勒索软件，最好的办法就是快速检测到它。高达 85% 的受害者组织安装了最新的防病毒软件（和其他传统防御措施），但仍然被勒索软件成功利用。在本章中，将讨论检测勒索软件的最佳方法，试图立即阻止其运行或缓解其扩散和破坏。\n\
  \n## 为什么勒索软件如此难以检测？\n\n许多人发现，在开启了所有传统防御的情况下，勒索软件在组织中依然如此成功，对此感到惊讶。大多数遭受勒索软件攻击的组织都有最新的防病毒软件、防火墙、内容过滤以及我们所有人被告知的为了成功防御黑客和恶意软件而需要的所有常规防御措施。勒索软件之所以能在你认为受保护良好的环境中取得如此成功，原因不胜许多。在本章的后半部分，我们将讨论即使是防御良好的组织也也会被攻破的一些原因。\n\
  \n首先，无论广告如何说，防病毒软件和终端检测与响应（`EDR`）软件从未做到 100% 准确。计算机防御领域没有任何东西既简单又 100% 准确（这一点后文将详细介绍）。如今，任何防病毒供应商都要跟上每年创建的数百万个新恶意软件程序极其困难。这并不是每年真的创建了数百万完全全新、独特的恶意软件程序；而是相同的恶意程序在每次利用过程中都会被重做、混淆和加密，以呈现出不同的形态。因此，传统的基于特征的防病毒扫描器很难跟上。它们必须等待新的恶意程序被检测、报告、检查，然后创建一个可靠的特征。等到这些发生时，大多数勒索软件程序已经重新加密了自己以创建一个新特征。在发布和可靠检测之间始终存在滞后，而勒索软件犯罪集团充分利用了这一点。正如第\
  \ 1 章 所提到的，一旦勒索软件执行，它就会不断“拨回主页”并更新自身以规避防病毒软件的检测。\n\n其次，没有任何防御是完美应用的。对于防御者来说，要在环境中\
  \ 100% 地应用任何安全防御是非常困难的。仅仅向每台需要的计算机推送关键补丁，很少能在第一次尝试就实现 100% 的成功。由于无数原因，无论防御者试图应用何种防御措施，会有一小部分相关计算机根本不会应用该防御。这可能是因为\
  \ `Microsoft Windows` 注册表损坏、设备离线、设备存储空间已满、有第三方程序阻止应用、用户刻意阻止安全控制的应用等等。无论计算机防御者试图做什么，要\
  \ 100% 成功地应用该安全控制是非常困难的。而且在所有计算机安全控制中做到这一点几乎是不可能的。从计算机出现之初一直如此。黑客和恶意软件喜欢不一致性。勒索软件通常会在缺少某项关键防御的计算机上找到其初始足点访问。\n\
  \n第三，一旦激活，许多勒索软件程序会立即搜索并禁用防御保护，以便它们无法发出攻击警告。某些勒索软件程序会寻找特定的已禁用防御程序，以便无法发出攻击警告。\n\n\
  第四，大多数勒索软件程序日益依赖使用脚本。例如，最常用的后利用工具之一是微软自己的 `psexec`（`https://docs.microsoft.com/en-us/sysinternals/downloads/psexec`）。`psexec`\
  \ 已存在几十年，允许程序被远程复制和执行，这使其成为勒索软件的最爱。任何防御程序都很难区分合法活动和恶意活动。\n\n第五，大多数管理员对其环境的了解未达到应有的水平。因此，当恶意活动出现时，他们并不会进行研究。\n\
  \n第六，监控的强度远未达到应有的水平。许多研究（包括受尊敬的 Verizon 破解调查报告 `https://www.verizon.com/business/resources/reports/dbir/`）一直强调，如果他们简单查看，大多数被利用的组织就会发现入侵。安全事件监控工具捕捉了事件，但没有人看——或者看还不够。\n\
  \n必须理解，尽管是“防御良好”的组织也会经常被攻破，运行所有传统防御仍然是有益的。为什么？因为尽管它们并不完美，但可以阻止一部分勒索软件。就像我们大多数时候不需要，但开车时会系安全带一样。\n\
  \n## 检测方法\n\n了解能够帮助任何组织更好地、更快检测新勒索软件的传统和主动检测措施很重要。假设你已经执行了所有传统防御，包括使用防病毒/EDR、防火墙、安全配置、内容过滤、声誉过滤、反钓鱼、监控等。因此，重点将放在对勒索软件特别有效的检测方法上。推荐的检测方法某些仅是改进现有防御的方法，另一些并不是新的。本节的目的是让你接触不同类型的检测方法的横截，并让你在环境中实施一种或多种。像任何计算机防御一样，这里存在明显的易用性与安全性之间的权衡。最好的勒索软件防御需要更多的资源、精力和手动研究。没有简单自动的方法可以\
  \ 100% 检测勒索软件。\n\n### 安全意识培训\n\n大多数恶意数据泄露（包括勒索软件利用）是因为终端用户被欺骗提供登录凭据或运行木马程序。根据我的研究（`https://blog.knowbe4.com/phishing-remains-the-most-common-form-of-attack`），70%\
  \ 到 90% 的攻击归因于社交工程和网络钓鱼。教育管理员和终端用户关于勒索软件的不同迹象非常有意义，这样当终端用户看到潜在恶意活动时，他们可以报告并由人员研究是否与勒索软件有关。\n\
  \n\n\n\n管理员和用户应该关注哪些迹象和症状？他们应该关注下文章节涵盖的任何内容。管理员和终端用户需要关注最流行的勒索软件迹象和症状。这些内容通常会出现在计算机安全厂商的博客中，包括\
  \ KnowBe4 (`https://blog.knowbe4.com`)。你甚至可以在互联网上搜索勒索软件文章，例如搜索 `https://blog.knowbe4.com`\
  \ `ransomware` 来获取快速列表。勒索软件的迹象和症状会随时间演变，因此确保你的管理员和终端用户知道要寻找什么。今天的勒索软件看起来已经和去年的不一样了。请保持更新！\n\
  \n#### AV/EDR 辅助检测\n\n如前所述，运行最新的防病毒软件/端点检测与响应检测（`AV/EDR`）总是正确的。它们确实可以捕获并防止一定比例的恶意软件和勒索软件。同样重要的是意识到，很多时候\
  \ `AV/EDR` 发现的可能看起来是互不相关的恶意（或合法）程序，而这些程序正被勒索软件利用。如今，大多数勒索软件使用其他恶意程序、脚本甚至合法程序来执行其脏活。很多时候，你面临待勒索软件攻击的迹象仅仅是在你的环境中发现了一个恶意程序或无法解释的脚本。在大多数大型勒索软件攻击中，有人在主攻击之前注意到一个相关程序，但并不理解其重要性。你如何让某人理解看似不相关的程序或脚本可能与更大的勒索软件攻击有关？教育他们吧！\n\
  \n#### 检测新进程\n\n检测新进程是可能的最佳侦测控制，但也是有效实施上最困难之一。所有勒索软件都会执行新的、未经授权的恶意进程。要检测勒索软件（以及所有的恶意软件和恶意黑客），你所做的就是检测所有新的、未经授权的进程，并确定它们是否合法。这说起来容易，做起来难得多。如果你能做好这一点，就能显著降低勒索软件、所有恶意软件和大多数恶意黑客的风险。\n\
  \n困难在于，很少有组织真正理解单台设备上运行着哪些进程，更不用说网络中每台设备了。你必须了解每台设备（或至少是存在恶意侵害高风险的设备）上运行着哪些合法、授权的进程，并对新进程发出警报。然后，每个新进程都必须经过研究以确定其合法性。图\
  \ 6.1 总结了基本的逻辑步骤。\n\n![图 6.1 进程异常检测逻辑流](img/c06f001.png)\n\n图 6.1 进程异常检测逻辑流\n\n\
  第一步是对环境中的每台设备进行清单，或者是对每个可能被恶意利用的设备。这意味着 PC、笔记本电脑、服务器、网络设备、IoT 设备、电器设备等。第二步是对每台设备上允许的合法进程进行清单。这可能很难做到，通常涉及不同的清单软件和步骤来完成。还需要考虑未来的合法软件和进程。\n\
  \n第三步是安装监控进程，以检测何时发生了新的、未经授权的进程（或对现有允许进程进行未经授权的“注入”）。进程包括可执行文件、脚本、库以及任何其他可以归类为“活动”代码或内容并可被恶意操纵的内容。第四步是创建一个事件响应流程，快速研究每个新检测到的未经授权的进程，直到确定其为合法或恶意。\n\
  \n任何可用于隐藏、存储或启动恶意行为的新新事物都需要被监控并触发警报。例如，在 Microsoft Windows 上，恶意软件经常安装在 Windows 注册表中，这样当\
  \ Windows 重启时它会自动重新。或者，它将自己安装为新的计划任务。恶意程序在 Windows 上安装自身的方法真的有几十种，甚至上百种。\n\n\n\n\
  \n所有的勒索软件都会建立未经授权的网络连接，包括受损网络内部和外部的连接。勒索软件总是会“回传（dials home）”，而它们回传的对象并不是合法的、授权的连接（尽管它们经常使用并指向诸如\
  \ `AWS` 等通用公共服务，这使得很难判断其是否具有恶意）。在大多数勒索软件攻击中，勒索软件组织通过非法的连接连接到受损的网络（例如，不是来自合法的客户站点）。\n\
  \n在任何企业网络中，大多数服务器都不会连接到所有其他服务器或工作站。大多数工作站不会连接到其他工作站。大多数工作站不会连接到大多数服务器。域管理员（在 `Microsoft\
  \ Active Directory` 网络上）不应连接到大多数服务器和工作站。网络中存在合法允许的连接，也存在某些如果被监控并获知，任何合格的观察者都会视为异常的连接。\n\
  \n就像检测未经授权的进程一样，你需要清单并记录合法、允许的网络连接，并对异常连接告警。与进程异常检测一样，网络异常检测遵循相同的逻辑流程：清单、基线、告警、研究。图\
  \ 6.2\n\n图 6.2 网络异常检测的逻辑流程\n\n之前在“检测新进程”部分列出的大多数软件产品都会监控异常进程和异常网络连接。还有一些网络流量分析产品专门专注于网络连接异常。其中一些包括以下产品（按字母顺序排序）：\n\
  \n*   Bro\n*   Cisco（特别是其 `Lanscope Stealthwatch` 产品）\n*   Corelight\n*   Darktrace\n\
  *   Flowmon Networks\n*   Juniper Networks\n*   Netscout\n*   Noction\n\n每个组织都应该理解其合法的网络流量连接，并对异常连接进行告警和研究。\n\
  \n### 新的未解释异常\n\n任何新发现的、未解释的活动、进程或网络连接，如果可能涉及勒索软件（或其他恶意软件或恶意黑客活动），都应该进行调查。这包括以下未解释的情况：\n\
  \n*   数据文件的集合或归档\n*   脚本或工具\n*   新安装的驱动程序\n*   大量文件的变化（例如：位置、属性、权限、加密等）\n*   存在大量具有常见但奇怪的文件扩展名（例如：`readme`、`ransom`\
  \ 等）\n*   备份任务的变化\n*   备份加密密钥的变化\n*   启动到安全模式\n*   程序崩溃、操作中断等\n*   使用 `taskkill.exe`、`PsExec.exe`、`Wbadmin.exe`、`Vssadmin.exe`\
  \ 等（如果不是经常使用的话）\n\n这些都是常见的勒索软件入侵指标（`IoC`）。值得注意的是，也出现过勒索软件安装合法驱动程序的实例，这些驱动程序被认为有漏洞，因此它们随后可以利用新安装的驱动程序获取对受损系统和网络的额外访问。可以在此处找到\
  \ `https://news.sophos.com/en-us/2020/02/06/living-off-another-land-ransomware-borrows-vulnerable-driver`\
  \ 示例。\n\n### 未解释的停止\n\n任何新发现的、未解释的活动、进程或网络连接，如果可能涉及勒索软件（或其他恶意软件或恶意黑客活动），都应该进行调查。这包括以下未解释的情况：\n\
  \n*   数据文件的集合或归档\n*   脚本或工具\n*   新安装的驱动程序\n*   大量文件的变化（例如：位置、属性、权限、加密等）\n*   存在大量具有常见但奇怪的文件扩展名（例如：`readme`、`ransom`\
  \ 等）\n*   备份任务的变化\n*   备份加密密钥的变化\n*   启动到安全模式\n*   程序崩溃、操作中断等\n*   使用 `taskkill.exe`、`PsExec.exe`、`Wbadmin.exe`、`Vssadmin.exe`\
  \ 等（如果不是经常使用的话）\n\n这些都是常见的勒索软件入侵指标（`IoC`）。值得注意的是，也出现过勒索软件安装合法驱动程序的实例，这些驱动程序被认为有漏洞，因此它们随后可以利用新安装的驱动程序获取对受损系统和网络的额外访问。可以在此处找到\
  \ `https://news.sophos.com/en-us/2020/02/06/living-off-another-land-ransomware-borrows-vulnerable-driver`\
  \ 示例。\n\n### 积极监控\n\n所有这些检测控制都需要管理员了解其设备和网络上什么是正常的、什么是不正常的，或者拥有具有相同功能的工具。本质上，所有组织都需要研究勒索软件\
  \ `IoCs` 并警惕此类实例。许多常见的案例已在本章前面列出。\n\n良好的勒索软件检测需要积极的规划、研究和监控。正因为大多数组织没有这样做，勒索软件往往能够成功。不要成为勒索软件的受害者。学习你的环境中应该和不应该在运行以及与其他终端连接的内容，并检测、告警和研究所有异常。如果你没有资源，请购买可以为你提供服务的软件或服务。不这样做意味着你的组织面临成功的勒索软件攻击的风险将会增加。\n\
  \n\n\n\n本章通过总结一种检测方法来结束，任何人都可以使用 Microsoft Windows 企业版轻松来实现该方法。该解决方案涉及使用微软的 AppLocker\
  \ 应用程序控制程序，以“仅审核”（audit-only）模式运行，检测并对新进程发出告警。\n\n微软的 AppLocker 自 Windows 7/Windows\
  \ Server 2008 以来一直存在 Windows 中。它取代了 Windows XP 的软件限制策略。如今，它被视为 Windows 10 中发布的微软\
  \ Windows Defender Application Control 的“更简单”的版本。AppLocker 可以通过 PowerShell、本地或 Active\
  \ Directory 组策略或 Windows Intune 等移动设备管理服务进行配置和控制。本示例展示了如何使用本地组策略进行配置和部署。\n\n第一步是启用并配置\
  \ AppLocker。执行此操作，在开始 ➢ 运行提示符中输入 `gpedit.msc` 并按回车。这将显示本地组策略编辑器。在编辑器控制台中，导航到 `Computer\
  \ Configuration\\Windows Settings\\Security Settings\\Application Control Policies\\\
  AppLocker`，如图 6.3 所示。\n\n![Figure 6.3 Opening AppLocker using Local Group Policy](img/c06f003.png)\n\
  \nFigure 6.3 使用本地组策略打开 AppLocker\n\n这将产生一组 AppLocker “规则”选项，类似于图 6.4 中所示的。\n\n![Figure\
  \ 6.4 AppLocker rule types](img/c06f004.png)\n\nFigure 6.4 AppLocker 规则类型\n\n每种规则类型都可以通过点击并启用复选框单独启用，如图\
  \ 6.5 所示。对于我们的目的，每条规则都应启用为“仅审核”模式而非“强制”模式。\n\n![Figure 6.5 Enabling Audit Only mode\
  \ in AppLocker](img/c06f005.png)\n\nFigure 6.5 在 AppLocker 中启用仅审核模式\n\n如图 6.6 所示，AppLocker\
  \ 将允许管理员创建一组“基准”规则，这将允许所有现的可执行文件运行而不创建安全事件。当前安装的任何内容都将被运行而不创建安全事件。\n\n![Figure 6.6\
  \ Baseline rules about to be created in AppLocker](img/c06f006.png)\n\nFigure 6.6\
  \ 即将在 AppLocker 中创建的基准规则\n\nFigure 6.7 显示了生成的基准规则的部分示例。\n\nWindows 中的必须启用 `Application\
  \ Identity` 服务才能启用 AppLocker 监控。但一旦启用，任何违反现有基准规则的执行或安装都将生成 8003 警告消息（示例见图 6.8），写入\
  \ Windows 安全事件日志，其中将详细说明违规的可执行文件、设备、位置以及涉及的计算机和用户。\n\n![Figure 6.7 Partial example\
  \ of resulting AppLocker baseline rules](img/c06f007.png)\n\nFigure 6.7 生成的 AppLocker\
  \ 基准规则示例\n\n![Figure 6.8 Example 8003 AppLocker event log warning](img/c06f008.png)\n\
  \nFigure 6.8 8003 AppLocker 事件日志警告示例\n\n在任何将 AppLocker 作为主要新进程检测工具的环境中（如本节所示），所有的\
  \ 8003 日志消息警告都应进行调查，直到确定该执行是合法的还是否。在多计算机环境中，所有 8003 日志消息都应收集到一个公共数据库中，然后通知管理员或研究人员开始调查。\n\
  \n针对每个 8003 事件可以增加额外的自动化处理，包括向涉及的用户发送“表单式”邮件，询问他们是否确实打算安装该新的、之前未说明的可执行文件。或者，可以将涉及的可执行文件发送到\
  \ Google 的 VirusTotal 或用户的反恶意软件供应商进行进一步分析。无论使用什么工具，其概念都是相同的：弄清楚你的环境中应该运行什么，检测偏差并进行研究。\n\
  \n即使在中等规模的组织中，每天检测到的新进程数量也可能让人应接不。可以通过不允许普通用户安装新程序（通过撤销其管理员或 root 账户）来减少这些，但普通用户仍然可以安装大量新软件。确定哪些合法哪些不合法可能需要数小时的研究。许多组织使用阻塞模式下的应用程序控制来限制新安装和未经批准的执行。其他组织则使用\
  \ EDR 软件，大多数 EDR 软件应该内置了此类功能，包括判断哪些合法哪些不合法的能力。\n\n\n\n\n前两个任务——停止损害扩散和进行初始损害评估通常是并行进行的。停止勒索软件（程序）的扩散通常意味着评估涉及了哪些类型的设备、位于何处以及它们是如何受到影响的。\n\
  \n停止勒索软件（程序）及其损害的扩散涉及尝试两种不同的缓解措施：一是，对已知正被利用的设备阻止其扩散和任何可能的额外损害；二是，尝试阻止其扩散到尚未受侵害的额外设备。\n\
  \n初始损害评估将揭示一或多个确定已受勒索软件影响的设备。在至少一两台受影响的设备上，你将快速判断出出了问题。勒索软件提示信息是怎么说的？拍张照片。尝试让初始响应人员进行一些快速的取证检查。文件是真的被加密了，还是仅仅是恐吓软件（scareware）？能看到任何未加密的文件吗？你的目标是大致了解正在发生的情况。\n\
  \n## 关闭电源或隔离受攻击设备\n\n在初始评估之后，大多数情况下，你将关闭电源或隔离所有受影响的设备，以防止进一步损害和扩散。你可能甚至想要关闭或隔离额外的看似未受影响的设备，以防止它们被利用或损坏。\n\
  \n在勒索软件响应事件中要出的最大决策之一是关闭受影响计算机的电源还是仅进行隔离。许多指南和专家主张仅进行隔离。他们担心关闭设备会导致丢失宝贵的取证证据，事实确实如此。关闭设备甚至可能会移除位于内存中的勒索软件加密密钥。\n\
  \n一些勒索软件响应建议采取了折中方案，例如美国网络和基础设施安全局（CISA）提供的建议，详见：`https://www.cisa.gov/sites/default/files/publications/CISA_MS-ISAC_Ransomware%20Guide_S508C.pdf`。CISA\
  \ 建议仅关闭那些无法从网络断开的设备，而对于任何可以禁用网络功能的设备，保持其开启状态。其逻辑是，关闭任何设备（无论粗暴地还是平稳地）都会擦除易失性内存中可能具有价值的证据。这是一个合理的顾虑。\n\
  \n“关闭所有设备”的方法更多是担心可能正处于额外加密或损坏过程中的设备，通过关闭它们，可以尽可能保存大量数据和服务。如果你确定自己真正面对的是“擦除器（wiper）”事件，即恶意软件程序的目标是尽可能造成大量不可恢复的破坏，那么“关闭所有设备”最有意义。根据你了解的现场情况，将导致选择其中一种方法而非另一种。\n\
  \n现实是，在大多数勒索软件场景中，关闭电源或保持运行这两种方法的差异从纯损害的角度来看通常并不显著。通常当初始事件响应发生时，大部分损害已经造成。尽管如此，如果可能且取证证据收集不是首要考虑因素，快速响应和关闭设备可能会导致较轻的损害。有时勒索软件攻击在大部分损害发生之前的阶段就会被发现。根结底，这是勒索软件响应团队负责人的一项判断。\n\
  \n如果你决定关闭电源，请勿执行优雅关机（graceful shutdowns），除非你确信执行非优雅关机将导致更糟糕且无法挽回的损害。你需要权衡执行“软”关机的潜在损害，与如果你现在不关闭系统，恶意软件可能造成的损害之间的关系。你的目标是使整体损害降至最低。\n\
  \n## 断开网络\n\n所有人同意应该尽快从网络上断开所有可能受影响的内容，但明白在网络恢复之前，你无法对这些受影响的设备执行取证等远程任务。你应该断开所有可能的网络，包括以下内容：\n\
  \n*   所有互联网接入和出站连接点\n*   所有有线和无线连接\n*   潜在的短距离网络，如蓝牙、NFC 等（如果它们可能允许勒索软件或损害扩散）\n\n\
  ### 在网络接入点断开连接\n\n禁用网络连接的最好方法之一是在涉及的网络接入点处禁用网络，而不是在单个设备上禁用。这是因为，如果操作得当，它可以在最短时间内将所有设备从网络中断开，并且可以更容易地根据需要（带有未来的限制）允许重新连接。如果你在本地设备本身上断开网络，那么通常在不再次物理访问受影响设备的情况下无法重新启用网络（尽管通常仍然需要对每台设备进行物理评估）。\n\
  \n使用网络聚合点（如路由器、交换机或 `VLANs`）禁用网络，可以更方便地根据需要禁用并重新建立选定的设备、端口、源端和目的。一旦你了解了勒索软件程序是如何运行并建立网络连接的，你就可以以更精细的方式重新开放网络，允许远程取证或恢复，同时阻止恶意软件进行通信。\n\
  \n如果无法通过网络聚合点禁用网络，请在每个设备上禁用网络，确保禁用所有有线和无线连接。具体方法取决于操作系统。如果你无法通过网络接入点断开设备，且你计划关闭电源，那么在关闭电源之前在每个设备上禁用网络（如果可以快速安全地做到）。这样当你重新启动设备时，它们默认已禁用了网络，不会在你准备好之前自动允许网络流量发生。\n\
  \n### 假设你无法断开网络\n\n在某些情况下，关闭整个网络并不是一个选项。几乎每个遭受勒索软件攻击的组织最初都是这样。关闭整个网络（或所有可能受影响的设备）意味着面临额外损害扩散和服务中断的风险。大多数组织认为他们无法关闭整个网络。但从风险的角度来看，大多数此类组织如果这样做会更好。\n\
  \n\n\n\n极少数组织确实无法在不造成更严重损害的情况下关闭网络，在这些情况下，关闭网络的风险远大于勒索软件造成额外损害的风险。我指的是那些运行导弹防御系统的组织、突然关闭会导致物理损坏的工业控制系统等等。我曾咨询过一些公司，对于这些公司来说，尽管风险会增加，但关闭网络并非选项。对于这些罕见情况，仍要尝试断开尽可能不必要的网络连接和服务。你只需要表现得更加细致并划分优先顺序。在这些情况下，如果可能，请考虑关闭以下类型的非本质网络连接：\n\
  \n*   互联网入站和出站点，或将连接限制在少数设备\n*   任何非本质设备\n*   与非本质存储设备的连接\n*   任何活跃的“同步”连接，例如 `Microsoft\
  \ Exchange ActiveSync`、`Microsoft OneDrive`、`Dropbox`、`iTunes`\n\n勒索软件团通常拥有每个人的登录名和密码，包括设备和网络上权限最大的账户（例如\
  \ `Administrator`、`Domain Admins`、`root`、`service accounts` 等）。禁用特权账户和或更改其密码，以防止黑客、脚本和恶意软件在已知且被使用的情况下它们。\n\
  \n关闭设备和断开网络的关键在于防止现有的恶意软件程序和活跃的黑客连接在已受感染的设备上造成更多损害，并防止其扩散到其他设备。在证明之前，不应恢复设备或将其从隔离状态中移除。\n\
  \n## 初始损害评估\n\n你正试图快速确定涉及哪些设备和服务、它们受损程度如何、涉及哪些位置，以及数据和凭据是否被盗取。你不需要 100% 准确，但你希望初始评估能尽可能准确。以下是你需要评估并报告的类型：\n\
  \n*   涉及的 OS 平台\n*   位置\n*   设备类型\n*   角色类型（例如：服务器、工作站、数据库服务器、Web 服务器、基础设施服务）\n\
  *   利用模式\n    *   受影响的系统是随机的，还是受影响系统之间存在关联？\n*   存储设备——仅限服务器、仅限网络驱动器、仅限映射或共享驱动器\n\
  *   仅本地存储或云存储数据和服务\n*   涉及的云存储\n*   云服务\n*   涉及的便携介质，如 USB 设备\n*   受影响的备份\n*   涉及的电子邮件服务器\n\
  \    *   邮件是否被窃听\n    *   是否存在任何恶意邮件“规则”将邮件复制到外部邮件地址？\n*   数据外泄\n    *   是否似乎涉及数据或凭据外泄？\n\
  *   攻击者对环境的熟悉程度\n    *   攻击者似乎知道人们的名字和角色？\n*   恶意文件\n    *   你是否发现了恶意脚本、其他恶意软件程序、意外的大型压缩文件（例如\
  \ `gz`、`zip`、`arc` 等）？\n*   来自勒索软件攻击者的通知和信息\n\n### 哪些受了影响？\n\n你需要确定哪些设备和服务受到了影响。开始列一份清单（例如表格），列出确认受影响的、可能受影响的，以及确认未受影响的设备和服务。了解哪些未受影响与了解哪些受了影响同样重要。此外，即使某个设备或服务目前没有受到直接影响，也要考虑它可能参与过或在未来可能受到影响的可能性。例如，如果攻击者影响了你的\
  \ `Active Directory` 域控制器，他们是否可以在不获得必要的访问权限的情况下，影响每个工作站、其他服务（例如 `DNS`、`DHCP` 等），或在人们访问个人网站时捕获其个人密码？你想了解哪些是确定受影响的，哪些可能受影响但尚未\
  \ 100% 确认的，以及哪些看起来没有受到影响。这并不总是简单或直接的。通常，计算机会显示关键错误，但这些错误与受感染的其他计算机的连接问题有关，而显示错误的机器本身未受感染（尽管仍受到影响）。\n\
  \n### 确保你的备份仍然完好\n\n找到备份并验证其完整性至关重要。备份的完整性及其恢复能力必须是 100% 可的。许多受害者做了粗略检查并认为备份是完好的，结果后来发现它们已经损坏。这是需要用\
  \ 100% 准确率进行验证的最步骤之一，因为后续的大量勒索软件响应很大程度上取决于备份是否可靠。如果云端数据已损坏，你还能获取已知的洁净副本吗？如果云数据受到影响，请通知你的云供应商和/或确保你可以恢复哪些数据。你可能需要在攻击期间临时停止备份，以防损坏的文件无意中覆盖已知的洁净副本。\n\
  \n### 检查数据和凭据外泄的迹象\n\n勒索软件攻击者声称他们外泄了什么？他们是否发送了“生存证明”（即被盗的数据样本）？检查日志以寻找入侵者留下的迹象。如果你有数据泄露防护\
  \ (`DLP`) 系统，请检查那里是否有迹象。你能找到任何大型文件压缩包吗？在初始阶段，首要任务是确认你的数据和/或凭据是否已被外泄。某些勒索软件组织会谎称其数据外泄能力并试图恐唬你。你想确认或拆穿数据外泄的指控。尽管如此，大多数声称已外泄数据和/或凭据的勒索软件组织实际上确实做到了。如果发生了数据外泄，被盗的内容是否意味着需要宣布“官方”数据泄露？\n\
  \n### 检查是否存在异常邮件规则\n\n许多电子邮件服务器和客户端，特别是 `Microsoft Office 365`、`Microsoft Exchange`\
  \ 和 `Microsoft Outlook`（以及 `Apple Mail`、`Gmail`、`Thunderbird` 等），允许创建规则、表单或过滤器，攻击者可以以此恶意窃听或执行其他异常操作，如转发邮件副本或删除邮件以隐藏恶意活动迹象。检查是否存在异常规则、表单或过滤器永远无害。微软创建了一个\
  \ PowerShell 脚本来检查 Office 365 实例中的所有自定义规则和表单，地址：`https://github.com/OfficeDev/O365-InvestigationTooling/blob/master/Get-AllTenantRulesAndForms.ps1`。来自白帽论坛\
  \ SensePost 的此脚本检查 Microsoft Exchange 环境中的规则和表单：`https://github.com/sensepost/notruler`。我没有\
  \ Gmail 等其他环境的脚本，但如果需要，优秀的脚本编写者应该写出来。\n\n### 你对该勒索软件了解多少？\n\n关于该勒索软件和勒索软件组织，你知道的所有信息是什么？你知道使用的勒索软件程序吗，包括版本？是否有任何关于过往受害者谈判的公开报告？索要是多少？勒索软件组织如何要求付款？他们给出的初始倒计时是多少？他们要求的加密货币是什么？使用的加密货币钱包地址有哪些？是一个还是多个？\n\
  \n\n\n\n如果你有加密数据，是否有可能在没有备份或没有勒索软件解密密钥的情况下解密这些数据？某些勒索软件程序的加密程序会由于无数原因而失败。它们认为自己已经成功了，但由于某些原因，数据并未被加密。你可以尝试一些快速解密网站，看看你面临的勒索软件解密密钥在上面可用。例如，尝试\
  \ `https://www.nomoreransom.org/en/decryption-tools.html`。\n\n你需要了解勒索软件程序的关键信息是它的名称和版本（如果可以确定）。这些信息对于确定下一步行动非常有价值。\n\
  \n## 第一次团队会议\n\n在缓解了初始损害并防止其扩散后，是时候与所有相关团队成员召开第一次正式团队会议，以了解攻击的基本事实了。如果你计划引入外部顾问，这次大会议是邀请他们加入的好时机。根据他们的角色，他们可能希望主持这次会议，并获得他们为了提供有用高效帮助而需要了解的问题答案。\n\
  \n再次，你想要答案的关键问题如下：\n\n* 勒索软件的要求和已知的细节是什么？\n* 是否已经防止了进一步的损害？\n* 设备是关机了还是保持开启状态？\n\
  * 网络是否禁用？如果是，是如何禁用的？\n* 损害范围（例如：平台、位置、角色、数量、涉及设备的类型）？\n* 我们知道勒索软件程序可能在环境中潜伏多久吗？\n\
  * 我们知道勒索软件可能是如何渗透环境的吗？\n* 除了“仅仅”勒索软件外，是否发现了额外的恶意软件程序（通常情况下是这样的）？\n* 对业务的影响是什么？\n\
  * 看起来数据和/或凭据是否被外泄了？\n* 涉及哪种勒索软件，版本是多少（如果已知）？\n* 备份是否安全并已验证良好？\n* 最新备份的日期和时间是什么（针对每个受影响的设备和角色）？\n\
  * 目前谁知道这次勒索软件攻击或服务中断？是否有任何意外的泄露？\n* 如果涉及网络保险，是否已通知保险经纪人或承保商？\n* 目前谁参与了勒索软件事件响应，他们目前正在做什么？\n\
  * 最大的未知因素是什么？\n* 阻碍事件响应的最不利因素是什么？\n* 对团队最有利的因素是什么？\n\n当然，此时应该分享任何其他相关的细节。评估哪些涉及、哪些没有涉及至关重要。不同类型的和服务角色需要不同类型的事件响应专家来解决。\n\
  \n## 确定下一步行动\n\n现在你已经了解了损害范围以及你正在处理的勒索软件类型，你可以对下一步行动做出更明智的决定。关键的初始决策包括：\n\n* 哪些系统需要恢复，按什么顺序首先恢复？\n\
  * 需要执行的初始额外步骤有哪些？\n* 是否还需要采取其他操作来阻止损害的扩散？\n* 仅根据加密或受损的数据，可以在不支付赎金和/或不获取解密密钥的情况下恢复损害吗？\n\
  * 如果数据或凭据已被外泄，这对事件响应意味着什么？即使备份良好，是否会为了防止被盗数据和信息的泄露而支付赎金？\n* 是否会支付赎金？如果是，会有专业谈判员参与吗？\n\
  * 受影响的系统将进行修复（即仅移除已知的恶意软件）、从已知的良好副本中完全恢复，还是从头开始重建？\n* 内部团队需要哪些人员？他们的所在地和预计工作时间是什么？\n\
  * 哪些登录凭据需要更改，何时更改？\n* 还需要引入哪些其他恢复专家？他们的时机、费率、预算等是多少？\n* 公共关系响应是什么？还需要通知谁？\n* 关键路径是什么？项目计划？\n\
  * 是否需要额外的会议？这些会议的必要利益相关者是谁（例如专家、高级管理人员或全体团队会议）？\n* 下次会议的时间和日期是什么？\n\n### 是否支付赎金？\n\
  \n是否支付赎金？这是一个需要决定的巨大答案。再次，即使可以从备份中恢复数据，可能仅仅因为额外数据外泄泄露的风险，也可能会支付赎金。未来开展的大部分工作都依赖于这个答案。\n\
  \n请记住，大多数勒索软件受害者（即使是支付了赎金的）也没有恢复所有数据。然而，获得勒索软件解密密钥的受害者平均而言恢复的数据更多。\n\n### 恢复还是重建？\n\
  \n如果你恢复了系统（即解密数据、移除已知的恶意软件、更改登录凭据等），它们可以被完全信任吗？还是你必须从头开始重建一切，不重用之前的任何东西？最安全、风险最低的选择是从头完全重建所有受影响的系统。这是确保之前受损的信息无法被用于再次轻易入侵的唯一方法。这也是确保某些处没有隐藏的、额外的后门程序让攻击者可以使用其再次入侵你的环境的唯一方法。\n\
  \n尽管如此，大多数勒索软件团伙可以相信不会再次攻击支付过赎金的受害者。并不是所有，但大多数是。如果勒索软件团伙拿到钱后再次攻击相同的受害者，随着这种做法的传开，会有更少受害者支付赎金。对于犯罪分子来说，不再攻击同一个受害者（如果已收到赎金）符合自身的利益。\n\
  \n得知此，许多受害者决定从头重建一切的成本时间会导致重大、昂贵且痛苦的停机。尽管他们知道不重建增加了攻击者留下的恶意内容的风险，但许多受害者决定接受这种风险并仅进行恢复。每个受害者都需要自己决定：是进行简单的修复恢复，还是从头完全重建？这并不总是一个二选一决定。某些受害者决定重建部分受影响的系统，对其他系统不处理。这取决于受害者组织的影响程度、资源、时间和风险承受能力。考虑未来购买网络保险的组织可能想要考虑重建。某些保险公司在受害者从头重建环境之前将不再提供保险。重建与风险的决策在图\
  \ 7.2 中以图形形式表示。\n\n![图 7.2 重建与修复恢复风险](img/c07f002.png)\n\n[图 7.2] 重建与修复恢复风险\n\n\
  ## 总结\n\n本章涵盖了初始勒索软件响应任务，包括阻止损害扩散、收集初始信息、召开初始团队会议以及确定下一步行动。第 8 章“早期响应”将讨论下一步行动。\n\
  \n\n\n\n本章涵盖了在初步阻止勒索软件造成的进一步损害后应采取的措施。包括检查目前关于勒索软件的信息、需要做出的重大决策以及额外的早期行动。总的来说，本章涵盖了勒索软件响应的第二阶段，但不包含大多数恢复任务。\n\
  \n本章假设勒索软件响应计划已经启动，并且勒索软件程序已被识别并防止了进一步扩散或造成更多损害。假设你已经遭受的现场损害是未来将面临的最大损害。\n\n## 你了解什么？\n\
  \n现在是再次写下并记录有关勒索软件攻击信息的时候，包括以下内容：\n\n* 哪些资源受到了影响？\n* 哪些资源似乎未受影响？\n* 受影响和未受影响资源之间的共同点是什么（例如：位置、操作系统、角色、网络、共享服务、账户等）？\n\
  * 是否还有资产处于在线状态并正常运行？\n* 是否还有网络处于在线状态并正常运行？\n* 是否有资产或网络正处于部分运行状态？\n* 目前的项目团队、进行中的任务线程以及未来可能的任务有哪些？\n\
  * 目前有谁知道该事件？\n* 谁已经联系过并获知了该事件？\n* 目前的沟通计划是什么？你仍在等待什么信息传递给谁？\n* 你是否知道是否有数据被外泄？你是否知道是否有数据被外泄，包括电子邮件、登录凭据或员工或客户信息？\n\
  * 识别出了哪些恶意执行程序？\n* 你或组织中的任何人是否联系了勒索团伙？勒索团伙是否联系了你？如果是，传达了什么或要求了什么？\n* 勒索软件索要金额是多少？\n\
  * 支付方式是什么？\n* 备份是否已验证为可靠？\n* 哪些方面不符合计划，原因是什么？\n* 最大的剩余问题和挑战是什么？\n* 其他未解决的问题？\n*\
  \ 是否有其他值得关注的数据点？\n\n这些项目应详细记录，并对剩余的未解决问题进行优先级排序。更新项目计划，按优先级顺序列出事件响应中仍未完成的关键路径。列出需要回答的主要遗留问题。总结发现的结果并与团队传达已知信息。允许团队更新并纠正目前的理解。\n\
  \n## 需要记住的几件事\n\n有一些重要的事情需要记住，许多受害者在响应的这一阶段会犯错或误解其重要性。\n\n* 加密可能不是你唯一的问题。\n* 可能会发生声誉损害。\n\
  * 可能会发生裁员。\n* 情况可能会变得糟糕。\n\n我将在下面详细介绍每一项。\n\n### 加密可能不是你唯一的问题\n\n许多受害者关注勒索软件加密过程造成的本地逻辑损害。重要的是要记住，超过\
  \ 70% 的勒索软件还可以外泄数据和/或业务/员工/客户数据及凭据。在互联网上进行快速搜索通常可以提供你目前正在处理的勒索软件变种/团伙是否已知认为经常参与数据外泄。如果该勒索软件变种/团伙以外泄数据闻名，你必须假设他们对任何被利用的组织都已实施此类操作。勒索软件响应负责人必须在事件初始阶段向利益相关者提醒这种风险。许多提到\
  \ `ransomware` 一词的人倾向于只关注加密部分，而忘记可能涉及其他因素。\n\n第三方法律责任也可能是一个因素。根据过去的网络安全保险统计，第三方赔付占了所有网络安全保险索赔近三分之一。第三方责任了受上游网络安全事件影响的下游利益相关者和客户的损害。在最低范围内，这可以包括服务/产品中断导致的感知或实际损害、数据隐私问题、监管辩护和媒体责任。\n\
  \n许多勒索软件受害者因数据隐私问题被起诉。这是勒索软件受害者组织被起诉的最主要原因。此类行动的两个示例可以在 `https://www.fiercehealthcare.com/tech/following-ransomware-attack-scripps-health-now-facing-class-action-lawsuits-over-data-breach`\
  \ 和 `https://grahamcluley.com/irish-hospital-sued-by-cancer-patient-after-ransomware-attack/`\
  \ 找到。\n\n虽然较少见，但下游受影响的个人客户也曾就和服务产品交付中断问题提起诉讼。此类行动的示例可以在 `https://healthitsecurity.com/news/class-action-lawsuit-filed-after-allscripts-ransomware-attack`\
  \ 找到。甚至有指控（后期被成功反驳）称勒索软件攻击导致了本可以避免的死亡，例如针对某医院医院的攻击案例，报道见 `https://www.hipaajournal.com/hospital-ransomware-attack-results-in-patient-death/`。另一个是：`https://healthitsecurity.com/news/us-fertility-sued-over-ransomware-attack-health-data-exfiltration`。\n\
  \n虽然大多数诉讼似乎与医疗保健有关，但所有类型的行业受害者都面临诉讼（`https://abc11.com/colonial-pipeline-gas-prices-shortage/10821125/`），包括云服务供应商（`https://www.securitymagazine.com/articles/93857-blackbaud-sued-after-ransomware-attack`）、股东（`https://www.cyberscoop.com/fedex-shareholder-suit-notpetya/`）和交通局（`https://www.cbc.ca/news/canada/british-columbia/translink-ransomware-attack-lawsuit-1587462`）。\n\
  \n持有他人隐私数据的勒索受害者组织在时间证明事实之前，应假设法律责任很高。这就是为什么所有遭受勒索软件攻击的组织都需要确保其法律顾问参与所有勒索软件恢复操作和沟通。起诉遭受勒索软件攻击组织的人无疑要求共享与勒索事件相关的所有电子邮件和其他通信。组织与法律顾问之间的特权通信对于诉讼方来说可能更困难或无法获得。\n\
  \n### 声誉损害可能会发生\n\n即使你的组织没有被客户或第三方起诉，可能会发生某种程度的声誉损害。大多数受害者组织能够度过最初的声誉损害、恢复，并实现收入增长。这并非总是如此。有些组织字面上消失了。勒索软件攻击使其脱离运营，它们再无法作为持续经营的企业。\n\
  \n有些组织最初恢复了，但声誉损害会持续存在，有时持续多年。问问 Equifax，它是有记录以来最大的数据泄露事件之一（`https://en.wikipedia.org/wiki/2017_Equifax_data_breach`）。直到今天，仍有潜在客户和泄露受害者拒绝与他们做生意。从财务角度看，他们比泄露之前状况更好，但谁知道如果没有遭受历史上最糟糕的泄露之一，他们今天可能正在做什么。\n\
  \n### 裁员可能会发生\n\n\n\n遭受财务和声誉问题的组织往往喜欢推卸责任，即使这种指责是错误的。如果勒索软件事件的发生是因为你所做或未做出的某项决策，你的工作可能会面临被裁的。如果你的公司是受害者组织安全防护的一部分，他们可能很容易决定转向竞争对手供应商。下游客户也可能轻易决定使用其他供应商和服务。\n\
  \n对勒索软件攻击为何成功进行“事后分析”始终是一个好主意，分析哪些可以做得更好以防止其发生，以及勒索软件的响应情况如何。如果涉及到追究责任，通常一个良好的事后评估会显示有很多地方可以共同承担责任。通常，导致攻破的不仅仅是一个人的错误。\n\
  \n## 可能会变得更糟\n\n许多勒索软件受害者假设他们目前所了解的都是全部，包括所有受损的资源、损害和被盗数据。例如，在获得多次保证后，他们相信自己的备份是安全的，并已准备好用于恢复。很多时候，情况并非如此。提供最初保证的人并不知道备份是有缺陷的、使用了未知加密密钥加密，或者已经损坏了数周甚至几个月。\n\
  \n根据最初的保证，一些受害者拒绝了甚至嘲讽了勒索软件团伙，认为他们已经掌控了一切。有时这确实是真的，但有时受害者并没有意识到攻破的程度和时长，勒索软件团伙会以更贪婪、更愤怒的情态和更高的要求回来。\n\
  \n许多受害者认为他们所知道的已经是最糟糕的。我有许多受害者告诉勒索软件团伙他们不会支付赎金，结果发现勒索软件团伙对他们网络的控制比他们想象的要得多；或者勒索软件团伙透露他们还拥有受害者最有价值的机密数据，并要求双倍的原始赎金。\n\
  \n我见过勒索软件团伙通过造成更大的损害来报复，包括攻击客户、员工并发起大规模的分布式拒绝攻击（`DDoS`）。勒索软件团伙有时会利用其使用的全部工具让受害者组织遭受无法忍受的运营中断、财务损失和声誉痛苦。某些勒索软件团伙从一开始就带来最大的痛苦，而另一些则只在受害者拒绝第一笔赎金请求时才增加痛苦。\n\
  \n一个好的经验法则是：假设存在你尚不知道的因素，并且攻击者可能持有他们尚未打出的额外底牌。务必始终谨慎并审慎行事。\n\n## 主要决策\n\n在此时，必须做出若干重大决策，这些决策驱动了其他剩余的决策和行动。其中一些重大决策将在后续章节中进行详细讨论。\n\
  \n### 业务影响分析\n\n在未来的某个时间点，你将把受影响的业务资产重新上线。你应该已经完成了业务影响分析（`BIA`），如果没有，请尽快执行一个。在大多数情况下，`BIA`\
  \ 将列出根据运营和财务目标必须按顺序恢复的各种关键任务系统。列一个列表，从必须首先恢复的所需依赖系统开始。\n\n大多数应用程序和系统都有多个支持依赖项，例如网络、`IP\
  \ addressing`、`DHCP`、`DNS`、安全系统、身份验证系统、数据库、中间件、前端系统等。确定哪些系统需要优先启动（不要忘记电子邮件、帮助线、电话等）以及所有必须先恢复到已知洁净状态的依赖项，以便依赖于这些系统能够启动。核心基础设施将始终是需要需要的首的首批系统之一。\n\
  \n在大多数勒索软件场景中，你将不知道哪些登录凭据被攻破了。假设所有未受多因素身份认证（`MFA`）保护的凭据都被攻破了。这意味着你的网络设备、基础设施和计算机安全设备的所有非\
  \ MFA 密码都必须更改，才能考虑再次依赖它们。从基础开始开始，然后沿着你的依赖链向上移动，直到你可以让主要事项和应用程序重新上线。\n\n有时，低优先级的系统可以比高优先级系统更早上线，且工作量要少得多。如果你可以同时进行多项恢复，那么比其\
  \ `BIA` 优先级建议的更早恢复“容易易摘的果实”是有意义的，哪怕仅仅是为了提振士气。\n\n### 确定业务中断的替代方案\n\n在勒索事件的某些阶段，一个或多个系统将无法运行或无法完全运行。在主系统中断期间，业务如何进行？“替代方案”应该已经记录在现有的灾难恢复/业务连续计划中。例如，可能意味着通过电话接收客户请求并使用纸张记录新交易。它可能意味着取出纸质信用卡表单、填写信用卡号，或使用物理信用卡压制机。贵公司的业务是否可以使用替代应用程序（例如现有的移动端或云端替代方案）进行？所有替代方案都应该已经在现有的准备计划中制定完毕，如果没有，现在就是头脑风暴和测试替代方案的时候。\n\
  \n### 是否发生了数据外泄？\n\n你能够确认或排除数据外泄吗？如果勒索软件团伙似乎外泄了数据，是什么数据？由于现在超过 70%的勒索软件团伙都会外泄数据，在没有相反证据的情况下，假设关键数据已经外泄。很多时候，团伙能够下载数据，但那并不是最具破坏性的、最坏的情况。如果他们声称拥有数据，他们是否发送了“生还证明”？是否存在某类数据，一旦被盗，就会让你确定支付赎金？如果发生了数据外泄，你是否需要决定是否发生了正式的数据泄露？\n\
  \n### 你可以在不付钱的情况下解密数据吗？\n\n在少数情况下，可能可以在不支付赎金勒索的情况下解密加密数据。尽管相当罕见，但检查是否适用这些场景之一并无害：\n\
  \n*   勒索软件有漏洞，没有加密文件。\n*   勒索软件解密密钥存在受害者已知并可以使用网站上。\n*   勒索软件团伙发布了所有的解密密钥。\n*  \
  \ 勒索软件主密钥在加密过程中被某些监控程序记录下来。\n*   解密密钥可以在受影响设备的内存中找到。\n*   执法部门控制着勒索软件解密密钥（这是为什么联系\
  \ `CISA` 或 `FBI` 是件事的另一个例子）。\n\n后续章节将详细介绍各个具体的场景。\n\n#### 勒索软件有漏洞\n\n有很多例子显示勒索软件由于各种原因根本没有加密文件。有时是因为勒索软件程序有一个或多个漏洞，导致无法运行。有时是受攻击的设备具有防御系统阻止了加密。其他时候是某些安全或配置设置阻止了勒索软件程序的成功。因此，务必检查并确认勒索软件声称已加密的文件确实被加密了。\n\
  \n#### 勒索软件解密网站\n\n\n\n\n互联网上存在一些网站，例如 `https://www.nomoreransom.org`，它们持有一个或多个勒索软件解密密钥。其中一些网站（如\
  \ No More Ransom）比其他网站更具信誉。许多网站非常老旧，已经过时，且多年没有更新过最新的解密密钥。通常情况下，它们涵盖的勒索软件已经多年未使用了。\n\
  \n大多数受害者可以做的最好是在互联网上针对其勒索软件变种名称配合搜索字符串“decryption keys”（解密密钥）进行快速搜索，看看是否有可行的网站。更好的做法是让专业的勒索软件响应人员进行搜索。有些网站会要求受害者上传其被加密的文件。如果是这样，请确保上传的文件不包含机密信息，因为你无法信任你上传文件的网站。其他网站则要求提供加密货币地址，这些地址随后与该网站正在追踪的勒索软件关联。\n\
  \n提供解密帮助的示例网站包括：\n\n*   `https://godecrypt.com/`\n*   `https://www.avast.com/ransomware-decryption-tools`\n\
  *   `https://geeksadvice.com/remove-gujd-ransomware-virus/`\n*   `https://howtofix.guide/how-to-decrypt-djvu-ransomware-files/`\n\
  \n互联网上有几十个此类网站。\n\n### 勒索软件组织发布解密密钥\n\n在某些情况下，勒索软件组织本身会发布密钥。很多时候，他们声称自己正在停止营业（无论自愿还是非自愿），并公开发他们的主密钥。这种情况已经发生过多次，正如这些新闻报道所示所示：\n\
  \n*   `https://www.bleepingcomputer.com/news/security/avaddon-ransomware-shuts-down-and-releases-decryption-keys/`\n\
  *   `https://www.zdnet.com/article/fonixcrypter-ransomware-gang-releases-master-decryption-key/`\n\
  *   `https://www.secureworld.io/industry-news/shade-ransomware-shutdown-decryption-keys`\n\
  \n### 从网络中嗅探勒索软件密钥？\n\n存在这种情况：防御者可以捕获受影响计算机与勒索软件命令与控制（C&C）服务器之间的网络包，从而捕获一个或多个加密密钥。如何使用\
  \ Wireshark 进行此类操作的示例可以参考 `https://sensorstechforum.com/find-decryption-key-files-ransomware/`。\n\
  \n从网络中嗅探加密密钥是可能的，但由于大多数勒索软件程序使用 HTTPS，受害者设备与 C&C 服务器之间的所有流量都是加密的。为了嗅探流量，必须在受害者计算机上安装网络包分析器，或者网络架构设计成能够“看到”HTTPS\
  \ 保护的数据包内部内容。即便如此，这也不是一个容易的过程。\n\n问题在于，如今大多数勒索软件程序为每个加密文件或文件夹都使用不同的加密密钥，而这些密钥又被另一个主密钥（或一组主密钥）加密。捕获主密钥是非常困难或几乎是不可能的。因此，你嗅到的任何加密密钥只适用于一个文件或文件夹，而平均每个受感染的设备有超过\
  \ 100,000 个文件。在解密过程中，需要反复嗅探并使用如此大量的密钥。\n\n尽管如此，如果你正在为某个特定的重要文件或文件夹寻找特定的密钥，这可能是一个值得考虑。对于大多数受害者来说，即使是恢复一个系统，工作量也太大了。此外，请记住，数据外泄是一个主要威胁，数据加密并不是你唯一的担忧。\n\
  \n### 在解密密钥使用上撒谎的恢复公司\n\n现在存在真正的“勒索软件恢复”公司问题，它们声称可以在不支付赎金的情况下恢复被勒索软件加密的数据，其中许多人都在撒谎。这些公司中的许多声称拥有特殊的精英能力，可以在不支付赎金的情况下恢复加密文件，但他们实际上所做的只是支付赎金、获取解密密钥，并让受害者支付比实际多得多的费用。这种现象在以下优秀的深度报道中了他的详尽描述：`https://www.newyorker.com/magazine/2021/06/07/how-to-negotiate-with-ransomware-hackers`。\n\
  \n使用这些公司的受害者足够多，以至于我有时怀疑这是因为受害者不知情而偶然发生的，还是出于某些其他隐藏意图而蓄意为之。无疑，有些勒索软件受害者并不知道他们遇到的这家承诺帮助他们处理勒索软件的公司其实是骗子——至少在他们提出的恢复加密数据的方法上是。\n\
  \n也许还有一些公司出于一个或多个原因公开“正式”决定不支付赎金，但在实际发生时确实想或需要支付。也许这被首席执行官、董事会或行业监管机构等禁止了。也可能是受害者发现自己无法通过其他方式恢复数据，于是他们决定尽管最初承诺不支付赎金，但仍需要秘密支付赎金以获得最佳结果。与虚假公司合作可以为他们提供掩护，甚至在被发现时提供合情合理的推卸借口。\n\
  \n### 如果你拿到了解密密钥\n\n如果你拿到了解密密钥，不要在第一次测试时直接将其用在生产环境的生产数据上。相反，请备份加密数据并恢复到另一个系统——虚拟机（VM）很有用，因为如果需要，可以轻松地隔离和重置。然后在那里尝试初始恢复。\n\
  \n### 以防万一保存加密数据\n\n由于某种原因或其他原因，你解密的数据可能无法成功完全解密。并不是所有的勒索软件组织都以无 Bug、完美著称。即使你决定完全放弃解密，你可能也想保存加密数据的副本，以防勒索软件组织、执法部门或其他恢复小组发布密钥。\n\
  \n如果你可以在不支付赎金的情况下解密数据，那太好了！记录你的成功案例并立即通知团队。然而，仍然有其他原因会导致受害者即使能够恢复数据也会支付赎金。\n\n###\
  \ 决定是否应该支付赎金\n\n决定支付赎金时要考虑的因素在之前的章节中已经过，但在响应过程的这一阶段可能尚未做出决定。现在是决定是否支付赎金的时候。该决定将导致后续截然不同的行动方案。\n\
  \n#### 不支付赎金\n\n许多组织（估计占受害者的 40% 到 60%）出于一个或多个原因决定不支付赎金。在许多情况下，这是一个明智的决定，最终如果大多数组织都做出同样的决定，勒索软件就不会是今天这样严重的问题了。遗憾的是，因为有这么多受害者支付勒索，，个人的决定（即可能的你的决定）并不会影响未来勒索事件的发生。支付或不支付赎金的决定完全应该受害者的具体情况做出。\n\
  \n\n\n\n*   他们考虑了不支付赎金可能导致的声誉损害或法律风险。\n*   他们考虑了在告知勒索软件团伙将得不到款后，可能会出现的其他额外损害或进一步要求。\n\
  *   他们考虑到未来来自同一勒索软件团伙的攻击可能会发生，从而抵消掉他们目前的事件恢复工作（即：支付赎金通常意味着同一勒索软件团伙未来不会再次攻击同一受害者）。\n\
  \n这些问题并不是为了说服任何受害者支付或不支付赎金。支付赎金取决于每个受害者的决定。然而，这些问题和考虑强调了某些可能被忽视或忽略的因素，这些因素可能导致受害者即使最初并不打算支付，最终也会支付赎金。决策者需要意识到这些因素。\n\
  \n如果你不支付赎金，请记录该决策以及将如何恢复数据和系统的说明，并通知团队。\n\n## 支付赎金\n\n如果受害者正在考虑支付赎金，应考虑以下因素：\n\n\
  *   最初请求的勒索金额是多少？\n*   受害者最初被给出的支付赎金期限是多久？\n*   该勒索软件团伙是否有在收到款后提供所需解密密钥的历史记录？解密密钥和/或程序是否能够完全恢复被加密的数据？\n\
  *   受害者支付赎金是否合法？\n*   如果涉及网络安全保险或执法部门，他们是否批准支付赎金？\n*   受害者是否有全额赎金可以支付，或者要求的勒索金额是否可以通过谈判降低以符合受害者的支付能力？\n\
  *   受害者以可支付的形式获得勒索金额需要多长时间？\n*   如何与勒索软件团伙进行通信？\n*   将如何支付赎金？使用哪种加密货币？通常会是比特币（例如，97%\
  \ 支付了赎金的勒索软件受害者被要求使用比特币支付）。\n*   涉及的加密货币地址有哪些，在何处进行支付？\n*   是否会使用专业的勒索软件谈判专家？\n\
  *   是否会涉及加密货币交易所？如果涉及交易所，从转账支付到加密货币可以使用之间有多长时间延迟？\n*   是否需要建立加密货币账户或钱包？\n*   是否需要设置\
  \ TOR 浏览器以便在暗网上进行通信？\n\n当成功谈判好勒索金额后，要求对方提供解密密钥有效的证明。此时，勒索软件团伙可能会要求一笔较小的付款（“以相互信任”）。完成后，勒索软件团伙会提供一个或多个密钥来解密部分数据。\n\
  \n如果发生了数据外泄，则应要求提供外泄数据的“生存证明”（proof of life）。如果确实发生了数据外泄，受害者需要向勒索软件团伙确认，在支付赎金后被盗的数据必须被成功删除（特别是当这是支付赎金的主要原因之一时）。某些勒索软件团伙会忽略这一请求，但表达其对贵机构的重要性以及你们支付的初衷并无害。\n\
  \n如果支付赎金，通常将使用加密货币支付。如果使用加密货币支付，实际操作的人应确认支付细节，特别是支付指向的账户/密钥。支付到错误账户的资金通常无法撤回。\n\n\
  ## 恢复还是重建系统？\n\n另一个重大决策是受影响的系统是完全重建还是仅恢复。如第 7 节所述，从角度来看重建风险小得多，但执行速度通常更慢，费用贵得多。通过恢复，会移除勒索软件程序、更改密码，并寻找其他恶意修改（如果发现）。尽管这是风险最高的选项，大多数勒索软件受害者选择恢复而非重建。\n\
  \n## 确定潜伏时间\n\n勒索软件程序在你的设备环境中停留了多久？知道这个答案对你决定恢复还是重建具有重大影响。潜伏时间越长，风险越大。勒索软件通常会在潜伏期间寻找并窃取它能找到密码。假设在勒索软件潜伏期间输入的任何密码或存储在密码管理器或浏览器中的密码已被破解。较短的潜伏时间（如几分钟或几小时）意味着勒索软件团伙及其恶意软件没有发现多少信息。许多恶意程序会对密码进行初步的粗略检查（有时仅持续前\
  \ 15 秒），然后立即加密它们所在的设备。它们要么不外泄数据，要么不会过多观察以决定取走什么（如果有的话）。\n\n## 确定根源\n\n投入巨大精力来确定勒索软件是如何获得初始访问是非常重要的。这通常可以通过查看日志文件和登录记录来查找未经授权的活动。未经授权活动与一个或多个恶意程序和/脚本有关，通常涉及未经授权的登录。查看新安装程序、脚本以及相关登录的各种时间戳，通常指向恶意程序首次出现的时间和位置。这一发现通常可以找到根源。\n\
  \n如第 2 节“防止勒索软件”所述，大多数勒索软件使用社会工程方法获取初始访问，其次是未打补丁的软件，然后是针对远程管理服务的密码破解（或攻击者已知道密码不需要猜解）。防御者可以检查他们的日志，看是否能察觉到潜在的恶意活动。如果找不到根源，防御者应假设使用了最流行的三种方法（如本段开头列出的方法）。\n\
  \n防御者试图弄清勒索软件使用了哪种根源漏洞是非常重要的，因为如果该漏洞处于开启状态且未支付赎金，当前涉及的勒索软件团伙可能会再次利用该漏洞。\n\n\n\n\n\
  勒索软件受害者往往深陷于恢复工作工作之中，以至于在面对确定根本原因的可能性时，他们并不不在乎或不关注于确定当前勒索软件攻击的根源。这可能只是我的个人经验，但那些忽视尽尽了解受攻击方式的首次勒索软件受害者，似乎更有可能再次遭受攻击。通常，第二次和第三次的情况会更糟。\n\
  \n### *修复漏洞，还是是时候严肃对待了？*\n\n勒索软件受害者在恢复期间似乎会走向两种路径。一些受害者希望以最少的计算机安全反思尽可能地恢复。他们只想尽快恢复运行，回到现状。另一些人则似乎将攻击视为一个警钟，以及审视其整体计算机安全态势的机会。后者群体倾向于重新定义并改进他们的计算机安全态势，变得更具长期韧性。例如，前者组会重置所有密码；后者组则从密码转向多因素身份验证。前者组尝试仅对涉及的软件系统进行更好的补丁管理；后者组则改进他们所有的补丁管理。前者组开启\
  \ `Windows` 日志；后者组购买端点检测与响应 (`EDR`) 软件，并购买安全信息和事件管理 (`SIEM`) 服务或产品。前者仅为了恢复运行而做最少的工作；后者则利用机会进行严肃的风险评估，并在恢复过程中修复许多破损或薄弱的实践。\n\
  \n如果说这两种策略在某些情况下都同样有效，那将是不诚实的。严肃检查你组织整体网络安全的后一种策略是首选方法。想要长期将恶意黑客和恶意软件排除在你的环境之外吗？更全面的策略会有更大的机会。\n\
  \n当然，这在短期内可能更贵且更耗时。修复一个存在许多漏洞的缺陷环境并建立强大的网络安全文化需要时间、资源和资金。进行更全面评估并修复所有漏洞的组织更有可能避免下一次勒索软件事件，并且在对对抗恶意对手时通常表现更好。如果你被勒索软件利用了，请利用这一事件尽可能地改进你的网络安全水平。\n\
  \n### 早期行动\n\n无论此前的决定如何，都需要采取许多额外的响应。以下是此响应阶段需要采取的一些重大事项。\n\n### *保留证据*\n\n在大多数恢复场景中，保留证据至关重要。这通常意味着在受影响的设备恢复或重建之前，对其进行法医级复制和内存快照。这样做可以是恢复过程中的关键一步，有助于解决法律问题，并帮助确定勒索软件利用的根源。\n\
  \n### *移除恶意软件*\n\n如果可能受勒索软件事件影响的所有内容都没有从头开始，并且你正在恢复受影响的资产，则需要识别并移除勒索软件以及任何相关的程序、脚本和工具。操作方法取决于你现有的或新购买的网络安全软件。大多数勒索软件都有特定的通用名称或命名模式，可以很容易识别。这些可以通过手动删除或使用如\
  \ `EDR` 等反恶意软件扫描程序来移除。\n\n由于此时系统可能仍未连接网络且可能已关闭，每个可能受影响的设备都必须连接。如果使用了本地 `USB` 密钥设备，请确保\
  \ `USB` 设备已“写保护”。\n\n由于此时系统可能仍未连接网络且可能已关闭，每个可能受影响的设备都必须连接并运行扫描。如果使用了本地 `USB` 密钥设备，请确保\
  \ `USB` 设备已“写保护”。\n\n\n\n\n\n还有两个重大决策需要做出，这两者在之前的章节中已经介绍。为了继续进行，现在仍然需要做出决策。这两个大决策是“恢复”与“重建”，以及确定执行的顺序。\n\
  \n### 恢复 vs. 重建\n\n第一个决策是恢复那些受影响的（可能受影响的或已确认受感染的）设备，还是从头开始重建。如前所述，从安全角度来看，从头开始重建是最安全的答案，但在资源和时间上的成本可能最高。恢复意味着从受感染的设备中移除当前和潜在未来可能发生的攻击向量，以便你获得合理的保证，而无需从头开始重建每个受影响的设备。\n\
  \n恢复与重建的决策可以以单个设备或单个应用程序为单位进行。这并不是一个二一选择，不是全有全无。例如，你可以决定从头开始重建网络设备和客户端工作站，并恢复 `Microsoft\
  \ Active Directory` 和 `DNS`。根据你的情况，选择保障性与成本结合最佳的选项。\n\n### 按何种顺序\n\n你必须决定恢复或重建受影响\
  \ IT 资源的顺序。所有密码都应该已经重置（在消除所有恶意软件和未经授权的访问之后）。你的业务影响分析应该确定要恢复或重建哪些应用程序和服务，以及按什么顺序。如果你没有其他计划，可以考虑使用以下列表作为通用优先级模板和启动指南，以创建你自己的自定义计划：\n\
  \n*   网络基础设施\n*   IT 安全设备/应用程序/服务\n*   虚拟机宿主机\n*   通用备份/恢复服务\n*   高优先级/Tier 1 客户端计算机/设备\n\
  *   电子邮件或其他主要通信软件/服务\n*   最高优先级/Tier 1 应用程序/服务\n*   高优先级/Tier 2 服务器和客户端\n*   中优先级/Tier\
  \ 3 服务器和客户端\n*   低优先级/Tier 4 服务器和客户端\n\n#### 恢复网络\n\n尽可能收集所有环境文档，包括 `IP addresses`、主机名和域名、网络、`VLANS`\
  \ 等。准备好恢复你的环境所需的所需的任何文档。每个涉及的服务都应记录记录其输出或消耗的网络流量，以便对这些服务进行监控，异常情况将触发立即警报和调查。在服务于生产环境中广泛部署之前，所有调查都应该完成。\n\
  \n在从网络基础设施开始时，首先确保组成网络的物理网络设备（例如 `routers`、`switches`、`Wi-Fi access points`、`cable\
  \ modems`、`WAN devices` 等）是安全的。密码应该已经更改。也许管理员登录已转换为多因素身份验证 (`MFA`）以增加保障性。也许网络设备固件已恢复到已知的良好副本，配置设置已从已知的良好副本恢复，或者设备已从头开始进行了新配置。你希望确保网络设备上没有运行任何可能是恶意的内容。\n\
  \n接下来，开始恢复提供 Internet 协议 (`IP`) 连通性的设备/软件/服务（例如 `IP address device management`）。这些可能包括\
  \ `Dynamic Host Configuration Protocol` (`DHCP`) 服务和 `Domain Name System` (`DNS`)\
  \ 节点/服务。它们还可能包括虚拟局域网 (`VLAN`) 和/或软件定义网络 (`SDN`) 的配置、设备和服务。\n\n#### 恢复 IT 安全服务\n\n\
  接下来，启动所有关键 IT 安全系统。你希望所有的日志和监控都达到最高详细级别，让负责这些服务的人员深度参与并监控捕获的事件和流量，寻找任何恶意迹象。特别关注勒索软件组织在最近攻击中使用的方法，因为这些方法很可能就是重新获得受影响网络控制权时使用的方法。支付赎金的受害者受到同一勒索软件组织利用的风险可能较低，但这不能保证你不会再次利用。\n\
  \n#### 恢复虚拟机和/或云服务\n\n可以恢复虚拟机宿主机，如 `VMware ESXi` 和 `Microsoft Hyper-V`。在大多数环境中，它们可能支持基础架构、应用程序和服务。确保\
  \ `VM` 宿主机软件是安全的，并且所有管理员密码都已更改。此时你也可以重新启用云基础设施服务。\n\n#### 恢复备份系统\n\n恢复你的备份和恢复服务，再次使用安全的实现和更改后的密码。未来的备份作业和数据应该受到防止未经授权的保护。你希望在开始恢复客户端、服务器和应用程序之前恢复或重建你的备份和恢复服务，以防在这些恢复过程中你需要先备份某些内容。你无法让其他所有内容都处于安全状态。\n\
  \n#### 恢复客户端、服务器、应用程序、服务\n\n最后，可以开始恢复客户端、服务器、应用程序和服务，从优先级最高的项目开始。从 `Tier 1`（最高优先级）到\
  \ `Tier 4`（最低优先级）。有时恢复一个高优先级资产可能需要几周到几个月，而低优先级资产可以在几小时到几天内完成，同时等待高优先级资产的恢复。\n\n\
  #### 进行单元测试\n\n在恢复/提取必要的服务器和客户端的过程中，你应该进行单独的、小型的测试。这些单元测试应该在开始更广泛的恢复之前完成。提前记录所有预期的过程和网络流量。创建测试输入并记录从输入预期的输出。确保包含所有类型的输入，以测试被测系统的所有过程。你自然需要你的领域专家参与来创建测试输入、运行处理并审查输出。一旦测试完成，将你计划恢复的单个服务或应用程序的实例恢复/提取到生产环境中。输入测试数据并记录是否发生了预期输出（例如数据库记录、服务、报告等）。如果实际输出与预期输出不符，则回退并解决问题。一旦通过初始测试确认所有流程均合法，即可开始更广泛的部署。\n\
  \n## 重建流程总结\n\n你可能决定重建一个或多个客户端或服务器。以下是通用流程：\n\n1.  首先对现有系统进行备份（例如硬盘和内存）（可选），以防重建过程未按计划进行或用于取证目的。\n\
  2.  收集重建过程所需的必要指令、安全凭据、软件、驱动程序和许可证密钥。\n3.  根据需要，重建硬件和固件设备/驱动程序。\n4.  重建核心资产到安全的基础配置。\n\
  5.  确保应用所有关键补丁。\n6.  根据应急响应建议添加所需新的软件和服务。\n7.  添加自定义配置设置、添加服务账户等。\n\n\n\n\n8. 恢复或重建数据。\n\
  9. 如果尚未完成，重新连接网络。\n10. 执行单元测试。\n11. 批准进行更广泛的部署。\n\n*重建*（rebuilding）一词意味着从“裸机”开始进行完全的重建。传统上，这可能意味着格式化硬盘、安装操作系统的纯净副本、打补丁，然后启动软件和数据恢复过程。如今，许多设备和操作系统允许更快的“逻辑重建”，即对全部或大部分软件进行重新构建，其效果就像计算机已完全重建一样，但实际上并没有经过所有的物理重装步骤。如果考虑这些“准重建”（quasi-rebuilds），请确定该准重建在重建过程中是否是安全且可用的。\n\
  \n例如，某些黑客会将恶意软件隐藏在存储磁盘的“空隙空间”（slack space）或未使用的区域（甚至隐藏在固件或视频显存中）。准重建可能不会将这些常用区域恢复到已知的干净副本。如果准重建过程让这些区域保持原封不动，恶意软件就有可能在重建过程中“幸存”。只有在你确定不会留下任何可能被黑客或勒索软件利用以重新建立支配地位的恶意软件残留时，才进行准重建。黑客或恶意软件在准重建期间未重建的区域示例包括：\n\
  \n*   未使用的、未的磁盘扇区\n*   未使用的磁盘分区\n*   BIOS、UEFI 和固件\n*   控制卡内存\n*   Windows 注册表区域\n\
  *   邮件规则、过滤器、表单等\n\n若有疑问，请擦除或重建可能问题的区域。\n\n这些准重建过程的范围很大，从类似于真正的重建到接近部分恢复不等。例如，Microsoft\
  \ Windows 有三种准重建方法：重置（Reset）、重装（Refresh）和还原（Restore）。微软在其位于 `https://support.microsoft.com/en-us/windows/how-to-refresh-reset-or-restore-your-pc-51391d9a-eb0a-84a7-69e4-c2c1fbceb8dd`\
  \ 的支持网站上对这每种方法的描述如下：\n\n*   `Refresh`（刷新）你的 PC 以重新安装 Windows 并保留你的个人文件和设置。重置还会保留电脑自带的应用程序以及你从\
  \ Microsoft Store 安装的应用程序。\n*   `Reset`（重置）你的 PC 以重新安装 Windows，但删除你的文件、设置和应用程序——电脑自带的应用程序除外。\n\
  *   `Restore`（还原）你的 PC 以撤销你所做的最新系统更改。\n\n这些是在使用内置或第三方备份应用程序备份的文件和文件夹恢复能力的基础上。最安全的选项可能是\
  \ `Reset`（重置），将 Windows 恢复到供应商交付首日的原始状态。\n\n对于 Apple 电脑，大多数用户会在启动期间按下 `Command+R`\
  \ 进入 Apple macOS 恢复模式。你最终会看到 `Restore from Time Machine`（从 Time Machine 恢复）、`Install\
  \ macOS`（安装 macOS）和 `Disk Utility`（磁盘工具）选项。你可以从任何过的 Time Machine 备份恢复，重新安装 macOS，或删除或擦除特定磁盘。如果你能识别出勒索软件进入系统之前的时间点，`Restore\
  \ From Time Machine` 将非常有用；而 `Install macOS` 会安装新版本的操作系统，且可以使用任何 Time Machine 备份来手动恢复特定的文件或目录。\n\
  \n重建 Linux 电脑需要从备份程序恢复数据，或者使用供应商的发行版（即 distro）系列命令来执行（例如 `fdisk`、`mkfs`、`mount`\
  \ 等）。命令随发行版和版本而异。你可以在 `https://documentation.commvault.com/commvault/v11/article?p=57175.htm`\
  \ 找到一个手动重建 Linux 的过程示例。\n\n大多数其他设备也有类似的重建过程。某些设备将恢复到基础系统的重建称为“硬重置”（hard reset）。相比之下，“软重置”（soft\
  \ reset）可能更接近部分恢复。\n\n\n\n\n*   构建一个全新的 DC，并将 `FSMO` 角色安装或迁移（如果仍存在功能完备 AD DC）到新的\
  \ DC。\n*   使用 `Azure Site Recovery`（如果已启用）恢复到稳定的恢复点。\n\n如果数据恢复不起作用，你可能需要从头开始构建一个新的\
  \ `AD`。某些勒索软件受害者选择从头开始以降低风险至最低，并借此机会删除他们长期以来尝试删除但一直找不到停机理由的的陈旧 `AD` 对象。但既然勒索软件已经瘫痪了他们的系统，他们就会利用安全理由，按照当前业务应该的方式来构建\
  \ `AD`（并移除旧遗留部分）。\n\n通常，恢复 `AD` 意味着其他底层网络服务（例如网络基础设施、`DNS`、`DHCP` 等）已先恢复。如果需要部分恢复，你将需要审查现有的\
  \ `AD` 及其最关键的安全相关对象（例如用户、组和组策略对象），寻找恶意修改或添加。\n\n与勒索软件最常见的 `AD` 修改是向特权组（如 `Enterprise\
  \ Admins`、`Domain Admins` 或 `local Administrators`）添加新成员。从高权限组中移除所有不必要的成员。\n\n以下是可以在勒索软件恢复事件期间帮助恢复\
  \ `AD` 的其他指南：\n\n*   备份和恢复活动目录服务器 (`https://docs.microsoft.com/en-us/windows/win32/ad/backing-up-and-restoring-an-active-directory-server`)\n\
  *   `AD 森林恢复 – 执行初始恢复 (`https://docs.microsoft.com/en-us/windows-server/identity/ad-ds/manage/ad-forest-recovery-perform-initial-recovery`)\n\
  *   备份和恢复活动目录域控制器 – 最佳实践 (`https://docs.microsoft.com/azure/backup/active-directory-backup-restore#best-practices`)\n\
  *   通过 Azure Site Recovery 应对勒索软件攻击 (`https://dokumen.pub/surviving-a-ransomware-attack-with-azure-site-recovery.html`\
  \ 或 `https://1lib.us/book/11369256/4fc00a?id=11369256&secret=4fc00a`)\n\n最后一份文档是一份很好的实践实验室文档，详细介绍了如何模拟勒索软件攻击并使用\
  \ `AD site recovery` 从勒索软件事件中恢复。这是一份非常值得阅读和学习的文档。\n\n请参考其他设备、网络和平台类型的恢复指南。在任何时候，特别是在初始恢复期间，IT\
  \ 安全部门应密切监控进程和网络连接，寻找恶意活动。如果受害者组织没有支付赎金，勒索软件团将寻找重新进入环境的方法。任何恶意程序、后门或未更改的密码都可以允许攻击者重新进入环境。\n\
  \n## 总结\n\n本章涵盖了从勒索软件攻击中恢复环境的流程和步骤。涵盖了网络基础设施、IT 安全、虚拟机主机、云服务、备份系统、客户端、服务器、应用程序、服务的恢复，并在广泛部署到生产环境之前对每项进行单元测试。本章还详细介绍了\
  \ Microsoft Windows 的恢复和重建，并结合了 Microsoft Active Directory（微软活动目录），因为它们通常涉及勒索软件的恢复工作。\n\
  \n在第 10 章“下一步”中，你将学习受害者需要做什么来防止和缓解另一次勒索软件攻击。该章节将关注一些必要的整体范式转变，以及对任何网络安全防御者都有益的特定策略。\n\
  \n# 第 10 章：下一步\n\n勒索软件攻击是一个警钟。它意味着你的计算机安全防御中至少有一个严重的弱点，而且可能还有许多其他弱点。本章讨论了受害者组织在勒索软件攻击后可能考虑的想法。本章重点关注一些必要的整体范式转变以及一些对任何网络安全防御者都有益的特定策略。\n\
  \n## 范式转变\n\n80% 的勒索软件受害者遭受过多次攻击(`https://blog.knowbe4.com/80-of-ransomware-victim-organizations-experience-a-second-attack`)。一次导致严重业务中断的糟糕勒索软件事件是一个重新审视整个网络安全策略的机会。大多数网络安全防御者的防御是低效的，集中在错误的事情上，并且没有将大部分精力放在正确的地方。本节讨论了大多数勒索软件受害者计算机安全防御中可能需要的范式转变。你可能是少数已经在做这些事情的受害者之一，但如果不是的话，请继续阅读。本章强化了第\
  \ 2 章“防止勒索软件”中提出的观点和建议，并增加了更多内容。\n\n### 实现数据驱动的防御\n\n想象两支军队，一支好，一支坏，陷入了一场持续数十年的战争。坏军在右侧翼不断赢得战斗，并且已经持续多年。在现实世界的战斗中，好军在发现右翼的弱点后，会在右翼集结更多兵力和资源，以抵消敌人的持续成功。事实上，在真正的战争中，好军会继续在右翼集结额外资源，直到那里变得不可攻破，或者他们最终输掉了战争。\n\
  \n但在针对今天计算机进行的虚拟战争中，在得知右翼不断被击败后，防御者莫名其妙地在几乎到处集结。他们有时甚至因为听过某种理论上的空中攻击，就在垂直方向上堆叠士兵。\n\
  \n\n\n\n\n其次，有大量的供应商和利益相关者在争夺防御者的注意力。每一家计算机安全公司都想说服防御者，他们的产品是解决所有安全诉求的答案。许多公司会刻意增加对其产品所缓解问题的恐惧程度，因为当防御者感到恐惧时，东西更容易销售。这种竞争性叙述洪流导致的结果是，防御者被各种不同类型的威胁数量所淹没，不知道应该最集中关注哪些问题。而他们读到或被迫遵守的每一份计算机安全指南和法规都在告诉他们，必须一次性、完美地执行超过\
  \ 100 种不同的安全控制措施，这让问题变得雪上加霜。哪些特定的威胁和风险是最大的往往在“一次性做好所有事情”的目标中丢失了。正是缺乏对最可能且危害最大的威胁和风险的关注，导致了计算机防御低效。那么，该如何修复呢？我很高兴你问这个问题。\n\
  \n![图 10.1 每年新发布的漏洞数量](img/c10f001.png)\n\n图 10.1 每年新发布的漏洞数量\n\n### 关注根源\n\n任何计算机安全防御者能做的最好的一件事，就是关注初始利用的根源，这些利用允许勒索软件（以及黑客和恶意软件）进入他们的设备和环境，这样他们就可以部署正确的缓解措施来防止下次攻击。正如第\
  \ 2 章所涵盖，有九种不同的根源解释了所有的黑客和恶意软件攻击。我在这里重复一遍：\n\n*   程序漏洞（是否有补丁可修复）\n*   社会工程学\n* \
  \  身份验证攻击\n*   人为错误/配置错误\n*   窃听/中间人攻击 (MitM)\n*   数据/网络流量畸形\n*   内部攻击\n*   第三方依赖问题（供应链/供应商/合作伙伴/水塘攻击攻击等）\n\
  *   物理攻击\n\n弄清楚你的环境中哪些根源是最可能发生的威胁，并优先、尽可能好地缓解它们。每当恶意软件或黑客在你的环境中被发现并移除时，尽力找出这些东西是如何进入你的环境的。是什么让它们进入了发现它们的设备？找到并关注根源。勒索软件不是你的问题，它是你真实问题的结果。\n\
  \n## 对万物进行排名！\n\n计算机安全防御充满了斥未排序的列表。你会不断收到一大堆未排序的项目，并被要求去修复或实施它们。不要再盲目接受这些未排序的列表了。相反，强制这些列表根据执行某事对你的防御改进有多大来进行排名，并优先处理影响最大的事情。\n\
  \n当有人让你去做某事时，问问自己这是否是对你时间的最好利用，或者是否有其他事情对你的计算机安全防御更重要？如果是，请（礼貌地）抗争去做另一件事。\n\n这里有一个例子。我非常喜欢的美国标准与技术研究所（`NIST`）发布了以下供审阅的勒索软件指南草案：“NISTIR\
  \ 8374 初步草，勒索软件风险管理网络安全框架配置文件”（`https://csrc.nist.gov/CSRC/media/Publications/nistir/draft/documents/NIST.IR.8374-prelim`）。按顺序排列如下：\n\
  \n*   保持系统更新\n*   避免用户网络\n*   使用数据驱动\n*   停止打开文件\n*   对未知来源保持小心\n*   切换到安全软件\n*\
  \   使用多因素身份验证\n*   共享意识培训\n\n## 获取并使用良好数据\n\n提出正确的问题。如果你没有数据来回答问题，请尝试获取数据。你组织的特定威胁比关于他人的报告更有价值。很多时候，数据就在那里，但没有人收集或分析它。其他时候，数据并不在那里，但收集它并不困难。开始使用数据和指标。不要接受“直觉”和轶事经验作为主要驱动力。相反，尽可能收集数据并使用这些数据。\n\
  \n## 更加关注增长中的威胁\n\n所有的网络安全威胁都经历着起伏，从不流行到非常流行，再到不流行。威胁通常追逐新兴技术，有时滞后，有时领先。利用你的威胁情报数据确定不同威胁和风险在你的环境中发生的频率和成功率。关注增长中的威胁，因为它们往往成为最新、最大的问题。我们对新兴威胁的反应通常是反应性的，因此我们越早发现并开始解决增长的问题，就越好。\n\
  \n## 目标一致\n\n一旦你确定了针对你环境最大的威胁，请将这种理解传给组织中的每个人。除非每个人都知道首要的问题并被要求参与缓解，否则你就无法拥有高效的网络安全防御。第一步是确保每个人知道首要的问题。第二步是分享将如何缓解这些问题。第三步是不断沟通首要威胁，直到首要威胁不再是首要威胁，你开始关注一个新的首要威胁。\n\
  \n\n\n\n这太疯狂了！一旦你确定了首要威胁是什么，风险降低团队就有责任对其进行反复、再反复的讨论，确保每个人都集中在最核心的问题上。任何其他事情都是低效的，参考之前的比喻，这就像关注左侧翼而不是右侧翼，或者关注门而不是窗户。正是因为缺乏对核心根源的关注，才让恶意黑客和恶意软件变得如此成功。反击吧。专注，专注，专注。\n\
  \n## 关注社会工程防御\n\n30 多年来，首要威胁一直是社会工程和未修补的软件。正如第 2 章所示，密码问题也是一个首要威胁（在本章稍后部分将进行详细介绍）。你应该关注你机构的首要威胁。如果你不知道自己环境的首要威胁是什么，请优先关注社会工程，其次是未修补的软件，第三是密码问题。其他所有事情都应该次于你对这些问题的缓解关注。大多数机构的计算机安全风险通过首先且最关注这三个问题可以得到最好且最高效的降低。\n\
  \n大多数机构可以通过最关注社会工程防御来减少最大的风险。这包括实施所有的策略、技术控制和培训，以最好地对抗社会工程。\n\n### 追踪进程和网络流量\n\n\
  显而易见，在大多数环境中，勒索软件通常潜伏数月而不被发现。每个机构都应该更多地对异常计算机进程和网络流量进行清单管理、跟踪和报警。最好的防御是实施应用控制程序，拒绝允许任何未经批准进程运行。这样做将显著降低机构内部恶意攻击的风险。\n\
  \n遗憾的是，实施强制性的应用控制可能是困难的，需要大量资源，如果做得不好，可能会导致管理层和终端用户的过度不满满（而且通常做得并不好）。在这种情况下，使用任何程序（如应用控制或端点检测与响应\
  \ `EDR`）来跟踪进程和网络流量都是件好事。关键在于调查任何所有新的进程和网络流量连接，直到你证明它们是合法的必要的或者否则。这并不容易做到。但我们无法很好进程和网络流量连接的异常关联，是勒索软件如此成功的巨大原因。如果你想停止勒索软件在你的机构中肆虐，请采取主动措施，进行进程和网络流量的异常检测。\n\
  \n## 提高整体网络安全卫生\n\n大多数机构通过提高整体`网络安全卫生`可以显著降低遭受勒索软件（以及其他恶意软件和恶意黑客）攻击的风险。`卫生`一词被用来比喻，就像洗澡、刷牙、饮食和整体个人卫生被视为人类长期健康的最佳指标之一。以下是一些常见的网络安全卫生建议。\n\
  \n### 使用多因素身份验证\n\n多因素身份验证要求用户输入至少两种不同类型的数字身份所有权证明，以向特定的访问控制系统进行身份验证。`MFA` 有许多形式，包括硬件设备、软件程序手机应用程序。尽管使用\
  \ `MFA` 的人仍可能被攻击，且任何 `MFA` 解决方案本身也可以被攻击或绕过，但使用 `MFA` 显著减少了一些常见的黑客攻击。例如，如果有人尝试钓你的密码，但除了用户名和密码外使用了\
  \ `MFA`，你就不会被这种常见的社会工程技巧所欺骗。在可能的情况下你应该你应该 `MFA` 保护包含机密系统。\n\n### 使用强密码策略\n\n密码攻击的主要类型很少。根据我的经验，我比大多数人都更了解密码，以下是我的建议：\n\
  \n- 尽可能使用 `MFA`。\n- 在无法使用 `MFA` 的情况下，使用长短语。\n- 至少每年更改一次密码，或每 90 天。\n- 尽可能启用账户锁定。\n\
  - 不要在任何网站或服务之间重复使用密码。\n- 不要使用常用密码（例如，`123456`、`password`、`qwerty`）。\n\n所有计算机安全防御者都应该尽可能严格地遵守这些密码策略。以下是一些文章（大部分由我编写）：\n\
  \n- [你的密码策略应该是怎样的以及其他密码烦恼](https://www.linkedin.com/what-your-password-policy-should-be-and-other-password-frustrations)\n\
  - [关于密码策略的问答](https://blog.knowbe4.com/qa-with-data-driven-evangelist-roger-grimes-on-the-password-debate)\n\
  - [什么是正确的密码策略？](https://blog.knowbe4.com/what-is-the-password-policy)\n- [为什么 MFA\
  \ 不能阻止所有的黑客攻击？](https://www.linkedin.com/why-doesnt-mfa-stop-hacking-roger-grimes)\n\
  - [最佳密码管理器 - Wired 文章](https://www.wired.com/story/best-password-managers/)\n- [你的密码管理器会被破解吗？](https://www.linkedin.com/pulse/can-your-password-manager-hacked-roger-grimes)\n\
  \n### 保护高权限组\n\n每个操作系统和网络都有一个或多个内置的高权限组。在 Microsoft Windows 中，本地高权限组是 `Administrators`\
  \ 和 `Power Users`。在 Microsoft Active Directory 网络中，是 `Administrators`、`Domain Admins`、`Enterprise\
  \ Admins` 和 `Schema Admins`。在 Apple、Linux 和 BSD 计算机上，是 `root`。\n\n尽力限制任何高权限组中永久成员的数量。拥有高权限成员的人越少，你的网络安全风险越低。最好的身份验证和访问控制系统会积极管理谁属于这些组，减少永久成员，仅在需要时、在需要的时候、在范围内添加成员。所有高权限成员的使用都应受到严格监控，并限制使用范围。例如，`Domain\
  \ Admins` 的成员应该只登录域控制器。任何 `Domain Admins` 登录非域控制器的行为都被认为是高风险且不必要的。\n\n\n\n\n\n如果大多数组织能够关注安全事件日志中的异常事件，它们就会早早发现勒索软件的利用。所有组织都应该定义可能指示恶意活动或至少值得进一步调查的事件，然后对这些事件触发告警并做出响应。\n\
  \n### 安全 PowerShell\n\n黑客和恶意软件经常使用 Microsoft PowerShell 来实施恶意活动。PowerShell 是微软顶尖的脚本语言，完全禁用它通常会导致业务运行中断，或至少减慢合法任务的速度。相反，将\
  \ PowerShell 置于受限制模式或需要 PowerShell 脚本由你信任的实体签名的模式。\n\n默认情况下，有五种 PowerShell 执行模式：\n\
  \n*   `Restricted`：默认模式。无法运行自动化脚本。PowerShell 只能由用户输入命令以交互模式使用。\n*   `Unrestricted`：无限制；可以运行所有\
  \ Windows PowerShell 脚本。\n*   `AllSigned`：只能运行由受信任发布者签名的脚本。\n*   `RemoteSigned`：下载的脚本在运行之前必须由受信任发布者签名。\n\
  *   `Undefined`：未设置执行策略。\n\n确保你的 PowerShell 环境设置为 `Restricted` 或任何需要签名代码的模式。以下是两个关于保护\
  \ PowerShell 的相关链接：\n\n*   `https://docs.microsoft.com/en-us/powershell/module/microsoft.powershell.core/set-strictmode?view=powershell-7.1`\n\
  *   `https://winaero.com/change-powershell-execution-policy-windows-10`\n\n### 数据安全\n\
  \n绝大多数勒索软件的目的是外泄你的数据。应该探索任何可以防止数据被外泄的措施。数据保护方案包括以下：\n\n*   专门设计用于防止未经授权数据外泄的程序\n\
  *   加密数据库（尤其是字段级加密）\n*   数据封装（Data wrappers）\n*   虚拟化数据查看\n*   容器化数据\n*   数据泄露防护（DLP）\n\
  *   条件访问\n\n条件访问的一个示例是微软的“受控制文件夹访问”（Controlled Folder Access）。在 Microsoft Windows\
  \ 10/Microsoft Windows Server 2019 及更高版本中，管理员可以声明哪些文件夹受受控制文件夹访问保护，然后定义哪些信任应用程序允许访问。任何未声明的程序（如勒索软件）将无法访问这些数据。虽然它不能防止所有勒索软件成功，但目前确实阻止了许多形式。以下是两个相关链接：\n\
  \n*   `https://docs.microsoft.com/en-us/microsoft-365/security/defender-endpoint/controlled-folders?view=o365-worldwide`\n\
  *   `https://docs.microsoft.com/en-us/microsoft-365/security/defender-endpoint/enable-controlled-folders?view=o365-worldwide`\n\
  \n需要注意的是，防止数据加密或外泄可能不足以阻止普通的勒索软件程序或团伙得逞。操作系统和其他类型非数据文件的加密仍然会破坏环境并可能导致业务问题，但至少这会让勒索软件团伙外泄数据变得困难。我预计这种以数据为核心的保护系统在未来会变得越来越多且流行。\n\
  \n### 安全备份\n\n保护你未来的备份免受勒索软件侵害。勒索软件经常删除卷影复制（Volume Shadow copies）、删除在线备份、停止备份作业并使用其他方法。\n\
  \n# 第 11 章：不该做的事\n\n本书的大部分内容都是关于遭受勒索软件攻击时应该做什么。在本章中，每一节都将明确讨论受害者不应该做的事，以帮助你避免常见的错误。\n\
  \n## 假设你不会成为受害者\n\n许多勒索软件受害者在攻击发生前假设自己不会中招。他们认为只有安全防护最差的组织才会被攻击。他们在媒体上读到过那些补丁管理做得糟糕，或者多年来没有注意到勒索软件已进入其网络中的公司。如果除了你之外每个人都遭受了攻击，可能会导致一个过早的结论，认为你一定做对了什么，所以不会被攻击。不要犯那个错误。\n\
  \n大多数受害者甚至认为自己不可能成为勒索软件的目标。“他们为什么要攻击我们？”是一个常见的调调。答案是他们想要钱，而你的加密货币和任何人的价值一样。大多数组织的安全性处于平均水平，也就是说，安全性并不高。大多数组织在某些计算机安全方面做得很好，大多数方面平平，而许多其他方面很糟糕。攻击者只需要发现一个漏洞，例如找到一个可以被骗点击邮件钓鱼攻击的员工、一个未打补丁的应用程序或一个未受保护的密码登录门户。防御者必须完美无缺，而攻击者只需要坚持。\n\
  \n永远不要假设你不会被攻击。如果你还没有被勒索软件成功攻击，它总会变成变成糟糕的一天……或一个月。\n\n## 认为某一个超级工具就能防止攻击\n\n永远不要认为一种工具或任何计算机安全防御工具的组合可以防止勒索软件攻击。你经常会遇到很多供应商声称他们的防御方法论是可以防止所有勒索软件攻击的。如果真的——任何一种工具都能防止所有勒索软件攻击——那么全世界都会挤进供应商的大门，供应商也不需要要求人们购买他们的解决方案了。无论供应商承诺了什么，很可能勒索软件攻击已在其一个或多个客户身上成功了。\n\
  \n## 太快地假设你的备份是安全的\n\n\n\n\n许多勒索软件受害者在攻击启动后，过早地假设他们的备份会救他们命。毕竟，多年来他们一直声称自己拥有良好的备份。他们的备份软件曾被用于恢复文件和文件夹，且没有出现过问题。IT\
  \ 人员在被问及时甚至证实了备份是稳固且可靠的。他们说备份是离线的，黑客无法触及。相比之下，你还能有什么更确定的保证呢？\n\n事实证明，拥有非常可靠的备份比看起来要困难得多。大多数人说他们他们有良好的备份时，其意思是他们尝试过恢复一些文件、文件夹，甚至是一整台或两个计算机。几乎没有进行备份的组织尝试过一次性恢复所有服务器和工作站，而勒索软件恰恰可以做到这一点。即使备份是安全且可靠的，当分布在几十、上百台电脑上时，恢复的速度估计可能需要几年，甚至数千年才能完成。这还是假设黑客没有以某种方式删除或损坏你的备份。如果你能让你的备份上线，那么攻击者也能做到。\n\
  \n为了确保你拥有可靠且安全的备份，必须至少每年进行一次测试，测试方式要模拟勒索软件事件可能的要求。也就是说，测试一次性或顺序地将几十台服务器和电脑恢复到测试恢复环境中，并测量所需的时间以及其可靠性。很多时候，恢复一组系统最终会导致大量损坏，因为很少有所有系统是在完全相同的时间进行备份的。这导致了同步错误。某些服务器和服务可以进行故障排除并解决解决，而另一些则必须重建。\n\
  \n如果你真的想确保自己拥有良好且可靠的备份，你应该聘佣一名渗透测试人员，看看他们是否能接触到你的备份，如果可以，他们能对备份做些什么（例如删除、损坏等），并且至少每年从离线或超保护的备份中进行一次全环境恢复测试。大多数受害者组织并不这样做，或者即使被告知要这样做也会因为成本原因而不去。这是昂贵的，所以，除非你彻底对备份恢复进行测试，否则在没有证明之前，永远不要认为它是稳固且可靠的。\n\
  \n## 不要使用缺乏经验的响应人员\n\n勒索软件攻击不是使用缺乏经验的响应人员的时机。你需要处理过大量勒索事件响应的经验丰富的人员。你需要那些见过大世面的人。不同的勒索软件程序和团伙有不同的做法。有些会外泄数据，有些则不会。有些声称会外泄数据但实际上并不会。大多数支付赎金的人会提供解密密钥，但有些不会。有些提供了解密密钥，但解密密钥实际上不起作用。有些声称不会再次攻击你，但实际上还是会。有些会试图利用解密程序溜入更多的勒索软件。有些会索原索赎金的四分之一；有些则要求一半或三分之二。有些会惯常地寻找网络安全保险单，以确定保险公司将支付的最高可报销赎金，尽管大多数人并不这样做。有些声称只接受\
  \ `Monero`（门罗币）加密货币，但仍然接受比特币并收取更高的费用。有些会给你几天时间来回复，有些则给几周。这些情况可以层出不穷。\n\n知道你对面谈判的对象是谁是勒索响应的重要组成部分。经验丰富的勒索事件响应人员，特别是熟悉你所受勒索软件变体的人员，其价值金连城，反之亦然。缺乏经验的响应人员和谈判人员可能会让情况变得比本需要的糟糕得多。\n\
  \n## 对支付赎金的考虑不充分\n\n许多受害者提前发誓永远不会支付赎金。小心不要让你的自尊或社会伦理产生阻碍。很可能，不支付赎金意味着更大的支出、更长的恢复时间，以及当前和未来损害风险显著增加。仅仅因为你在道德上反对支付赎金，就要做出如此巨大的代价。\n\
  \n有些组织拒绝支付赎金，是因为他们知道自己拥有良好、可靠的备份，可以用此恢复加密数据。请记住，大多数勒索软件攻击涉及数据外泄。\n\n## 向攻击者提供谎信息\n\
  \n\n\n\n一些顶级谈判大师建议通过回复极小金额来重新设定对话框架。这是顶级谈判大师的常用策略，但它只在请求者几乎没有其他选择的场景下有效，例如现实世界中的人质劫持。现实世界中的人质劫持者，即使他们参与过数十次绑架，获取资金的机会也非常少。基本上，他们必须见拿就拿，因为进行新一轮交易的风险极高。\n\
  \n然而，勒索软件团伙有许多其他潜在受害者，而且几乎没有受到惩罚的机会。每笔交易都是低风险，下一笔交易也是低风险，之后的一笔同样低风险。勒索软件团伙的谈判人员不需要“要或不要”。他们对于同意大幅减少勒索金支付几乎完全没有动力。这样做可能会导致他们产生一种声誉，即他们收到的赎索金总是远低于他们要求的金额，而没有哪个勒索团伙想要那样的声誉。\n\
  \n## 立即支付全额\n\n相反，千万不要在第一次请求时就立即支付要求的勒索软件全额。我读过许多勒索软件受害者谈判的记录，其中勒索团伙要求一个金额，而受害者立即就同意了全额。这样做是可以的，但你增加了攻击者找借口索要更多钱的风险。也许你支付的赎金只释放了部分解密密钥。大多数勒索软件团伙位于国外，那里对大额资金的谈判是预期之中的。回来并提出支付原始建议金额的四分之一或二分之一是可以的。你并不会侮犯他们，也不会让他们觉得本该要得更多钱。\n\
  \n## 与勒索软件团伙争论\n\n让我重说一遍。不要侮辱勒索软件团伙。你会惊讶于发现有多少受害者组织最终侮辱了他们正在交的勒索软件团伙。我理解！你正被一个试图偷你钱的犯罪团伙勒索。你感到受辱！你很愤怒！但如果你从一开始就开始侮辱犯罪分子，那么你在勒索攻击中获得最佳结果的能力将非常小。\n\
  \n如果你想要获得最好的结果，请保持友好且非对抗的态度。向你的团队发泄负面情绪。与勒索软件团伙交流时，要冷静、客观、温和。\n\n## 将解密密钥应用到你的唯一副本\n\
  \n在第一次尝试解密过程或密钥时，如果该副本是你的唯一副本，请不要直接应用到加密的服务器、工作站或数据上。解密过程或密钥因错误最终导致加密数据损坏的情况并非闻未闻。你不想搞坏你唯一的数据副本。因此，请备份加密数据，将其恢复到安全的地方，并在那里尝试你的解密过程。\n\
  \n## 不在乎根源\n\n为了停止进一步的勒索软件和黑客入侵，你必须减轻他们进入你环境的所有方式。许多勒索软件受害者太忙于试图从勒索软件事件中恢复，没有花太多时间考虑它是如何开始的。弄清楚勒索软件是如何进来的可能看起来很艰巨或是不可能的。但通过对日志文件进行审查和少量的研究，通常可以做出一些不错的、有理依据的推测。我见过很多次，受害者在支付赎金后询问攻击者他们是如何进入的。有时攻击者会诚实并告诉他们。其他情况下，他们会说不确定，说他们只是从其他小组那里购买了访问权限或密码。问一下并没有坏处。不了解勒索软件攻击的初始根源方法的受害者更容易受到类似的攻击，特别是如果他们没有支付赎金的话。\n\
  \n## 不要让你的勒索软件响应计划仅在线\n\n假设在勒索软件事件中你的整个在线环境都会宕机。如果你的勒索软件响应计划都在网上，你将如何访问它？确保计划存储在网络之外和/或以纸质形式，以便所有关键团队成员在勒索软件事件需要时可以轻松访问。\n\
  \n\n\n\n我记得在 2019 年，当勒索软件正攻痪包括计算机安全公司、医院、警察局甚至多个城市在内的组织时，我曾想：“勒索软件还能更糟吗？”随后，确实变得更糟了。2019\
  \ 年底，勒索软件开始常规性地外泄数据、窃取身份凭据（例如业务、员工和客户凭据）、威胁并勒索员工和客户、针对信任伙伴和客户进行鱼叉式钓鱼，并公开羞辱受害者。我在第\
  \ 1 章“勒索软件简介”中将此描述为“五重勒索”。在随后的几年里，五重勒索已成为常态，占了所有勒索攻击的 75%以上，甚至更多。所以，现在我又在问自己：“勒索软件还能变得更糟吗？”基于三十年的经验，并考虑到短期内不会有广泛的解决方案实施，我知道在情况好转之前，它可能会变得更糟。\n\
  \n总有一天，像之前所有流行的网络威胁（例如宏病毒、邮件蠕虫、启动扇区病毒等）一样，勒索软件将成为过去，或者至少对某些未准备好的防御者来说只是一个微小的困扰，但它将不再是今天这种主要的威胁。目前，它仍然是一项主要威胁（如果不是最大的威胁），并且在不久的未来可能会变得糟糕。“如何？”你可能会问。以下章节涵盖了我的预测。\n\
  \n## 传统计算机之外的攻击\n\n现在，勒索软件几乎只攻击传统的计算机设备。勒索软件主要目标是`Microsoft Windows`，尽管我们也看到了攻击`Apple`和`Linux`计算机的勒索软件变体。我相信我们将看到勒索软件从桌面电脑扩展到移动设备、工业控制系统(`ICSs`)、监控控制数据采集系统(`SCADA`)、可编程逻辑控制器(`PLCs`)以及物联网(`IoT`)设备。\n\
  \n到为止，针对这类系统的勒索软件威胁大多是演示或极少数事件。以下是针对此类系统的勒索软件演示的三个示例：\n\n*   `ClearEnergy`勒索软件旨在破坏基础设施、`SCADA`和工业控制系统的过程自动化逻辑（https://securityaffairs.co/wordpress/57731/malware/clearenergy-ransomware-scada.html）\n\
  *   研究人员创建了针对 ICS/SCADA 系统的 PoC 勒索软件（https://www.bleepingcomputer.com/news/security/researchers-create-poc-ransomware-that-targets-ics-scada-systems/）\n\
  *   概念性勒索软件锁定了控制发电厂的`PLCs`（https://boingboing.net/2017/02/14/proof-of-concept-ransomware-lo.html）\n\
  \n然而，显而易见，这类系统已经在普通网络犯罪分子和国家级攻击者的关注之中。针对这些系统的攻击甚至不需要直接影响它们。只需攻击它们周围的计算机就可以产生增加风险，导致这些非传统系统必须关闭。例如，这发生在`Colonial\
  \ Pipeline`案例中，受影响的是计费系统而非控制系统。在担心这类系统遭受攻击的几十年后，过去几年显示出，针对关键基础设施和制造目标的成功及几乎成功的攻击数量呈现出惊人的增长。\n\
  \n使用`ICSs`、`SCADAs`和`PLCs`的公司通常涉及某种关键生产，在维持运营方面面临着更大的压力。公开的针对大型能源和食品生产公司的攻击导致了巨额赎金的快速支付，而那些勒索攻击甚至没有直接攻击非计算机系统。想象一下如果它们直接攻击了！\n\
  \n我想你将看到针对更多非传统系统的真实勒索软件攻击，因为它们更直接地参与关键操作和生产，更容易产生漏洞，而且防御选择较少。PC 世界开始被勒索软件防御手段所淹没。而在非\
  \ PC 世界，这些同样的防御手段是闻未过的。犯罪分子会流向钱所在的地方，随着传统计算机受勒索软件的保护日益加强，勒索软件团可能会目标保护较弱的系统，特别是当赎金可以更大且付得更快时。\n\
  \n## 物联网勒索\n\n地球上联网的设备数量已经超过了人口，而且这个数字还将上升。`物联网`(`IoT`）这个热词的出现是为了描述那些本质上现在包含连接的计算机的非计算机设备。这包括监控摄像头、烤面包机、寻物设备、“智能家居”设备、汽车、冰箱、电视等。\n\
  \nBruce Schneier 在他的书《点击这里杀掉所有人》（https://en.wikipedia.org/wiki/Click_Here_to_Kill_Everybody）中指出，在不久的将来，`IoT`设备将如此丰富且廉价，以至于某人弯腰捡起一个掉落的\
  \ IoT 设备比直接用一个新的还要浪费时间（这是我的转述）。他可能是的。`IoT`设备将无处不在，或植入万物之中。而且随着它们受欢迎程度的增加，它们更有可能成为勒索软件的目标。\n\
  \n我们已经看到勒索软件加密智能电视的案例，正如文章 https://www.pcworld.com/article/3154226/ransomware-on-smart-tvs-is-here-and-removing-it-can-be-a-pain.html\
  \ 报道的那样，以及 YouTube 视频 https://www.youtube.com/watch?v=0WZ4uLFTHEE 所示。图 12.1 显示了实际智能电视勒索软件事件的截图。\n\
  \n![图 12.1 YouTube 视频显示电视勒索软件事件。注意：此图的大版本可从 www.wiley.com/go/ransomwarebook 下载。](img/c12f001.png)\n\
  \n图 12.1 YouTube 视频显示电视勒索软件事件。注意：此图的大版本可从[www.wiley.com/go/ransomwarebook](http://www.wiley.com/go/ransomwarebook)下载。\n\
  \n你可以看到这看起来与第 1 章中介绍的虚假 FBI 恐吓软件相似，不同之处重启电视并没有清除它。恢复需要将电视重置为原始固件状态（即恢复出厂设置）。\n\n\
  2016 年和 2017 年报道了几此类事件后，我本以为会看到电视勒索热潮。这并没有发生。我确实读到更多关于智能电视遭受攻击的报道，主要在亚洲国家，但它们似乎都是同一型号，由`LG\
  \ 电子`制造并运行`Google 的 Android 电视软件`（https://www.android.com/tv/）。从那时也没有了。\n\n我最好的猜测是，攻击那些电视的特定勒索软件真的是针对安卓手机的，由于它们共享安卓软件和组件，只有这种型号的电视受到移动木马的影响。此外，电视很少存储高价值物品（可能只有一张信用卡），所以人们支付赎金的意愿要低。因此，数百万电视被勒索软件攻击的大恐惧并没有实现。这是一件好事！正义一方的胜利。\n\
  \n尽管如此，黑客总是会攻击流行的东西。在 20 世纪 80 年代`Apple`计算机是最流行的个人计算机时，他们曾攻击它们。然后，当`DOS`和`Microsoft\
  \ Windows`计算机变得更流行时，他们转向了它们。现在，他们攻击`Apple`计算机的频率甚至超过了`Windows`。\n\n\n\n\n\n我预计随着物联网（IoT）设备的普及，我们将看到更多针对它们的攻击。就像之前讨论过的\
  \ `ICS`、`PLC` 和 `SCADA` 系统一样，它们要脆弱得多，且可用的防御措施要少得多。抵消这一事实的是大多数物联网设备并不包含许多受害者不想丢失或担心泄露到互联网的价值数据，但这种情况可能会改变。目前已经存在一个围绕私人摄像头视频和手机照片的勒索行业，只是尚未被勒索软件集团利用……尚未。\n\
  \n## 混合目的黑客组织\n\n混合目的黑客组织在今天已经存在，它们是当今勒索软件组织使用的五重勒索策略的自然延伸。勒索软件犯罪分子意识到，一旦进入受害者组织或设备，他们就可以做任何事情。传统上，勒索软件组织只做勒索。机器人网络提供者创建并使用机器人。加密矿工盗取计算机资源，以此此类。\n\
  \n近十年前，网络安全记者 Brian Krebs 发表了他对被黑客电脑价值的总结（`https://krebsonsecurity.com/2012/10/the-scrap-value-of-a-hacked-pc-revisited/`）。他讨论了被攻破电脑及其数据可以货币化的所有方式。如今的职业犯罪分子在整个受害受害者环境中，本质上具有相同的价值主张。以下是被攻击受害者组织的一些潜在用途：\n\
  \n* 将外泄数据卖给出价最高者\n* 使用被盗的资源进行加密货币挖掘\n* 使用被盗的资源进行未经授权的存储、儿童色情材料等\n* 获取、使用或出售被盗的密码\n\
  * 创建机器人网络以攻击其他受害者\n* 发起分布式拒绝服务（DDoS）攻击\n* 针对信任联系人设计鱼叉钓鱼攻击\n* 发送垃圾邮件\n* 加密并勒索勒索金\n\
  * 建立命令与控制服务器\n* 其他用途\n\n这些用途在今天已经发生，只是通常是由具有特定专长的个体完成。智能勒索软件组织，特别是那些在传统勒索软件被缓解后生存并繁荣的组织，将不再仅仅限于勒索。他们将查看每个受害者，看看对受害客户端的最佳利用率是什么。他们如何在一个个受害受害者身上实现利润最大化？只有那些不成熟、愚蠢的网络犯罪集团才会尝试去最大化所有受害者的用途和利润。大多数犯罪集团已经专业化了。利润最大化是所有专业集团的目标。\n\
  \n那么，情况会比现在更糟吗？我预计勒索软件组织将开始攻击非传统的计算机设备，并开始做远比五重勒索多多的事情。我希望我是错的。\n\n## 勒索软件防御的未来\n\
  \n这并不是说防御者将面对日益增长的勒索软件而不采取行动。不，随着痛苦的加剧，响应者和防御者最终会反击。最终，社会将击败勒索软件。\n\n正如第 2 章“防止勒索软件”中所述的，这将需要结合更强大的个人安全控制、关注并缓解成功勒索软件攻击的根源、修复整个互联网使其变得安全得多，以及其他的政治解决方案。接下来的章节是对我认为在短期内将演变的预防和防御勒索软件方法的后续介绍，分为技术和战略策略两部分。\n\
  \n### 未来的技术防御\n\n未来的技术防御可以分为两个主要类：本地勒索软件应对措施应用程序和人工智能（AI）防御。\n\n#### 勒索软件应对应用与功能\n\
  \n随着勒索软件继续变得成功并造成更多损害，计算机防御厂商为了寻求更多利润，将开发更多针对勒索软件的防御措施。这些防御将是专门击败勒索软件的完整产品，或者是添加到现有产品中的额外功能。\n\
  \n### 勒索软件启发式\n\n无疑，未来显而易见的防御是检测、告警和阻止类勒索软件活动的应用程序或功能。这大部分工作涉及监控文件系统并进行异常分析。如果防御系统检测到异常的读写水平、文件名或扩展名的更改、文件哈希值的更改或过量的移动，它可能检测到恶意加密的开始。数据泄露检测机制可以寻找异常的数据外泄水平。\n\
  \n### 金丝雀文件（Canary Files）\n\n勒索软件为欺骗技术（如“蜜罐文件”，又名金丝雀文件、红�文件等）提供了有力理由。基本上，欺骗系统在文件系统或网络周围放置几个或多个“假”文件。除了监控之外，它们没有其他用途。如果某些未经授权的进程接触了它们，会立即发送警报进行事件响应调查。\n\
  \n### 黑洞化（Blackholing）\n\n当检测到类勒索软件活动时，涉及的过程可以被重定向到一个虚假的文件系统，其潜在的恶意活动在那里继续。黑洞化已存在了几十年，并成功用于恶意软件。我们只需要更新它来寻找类勒索软件的行为。\n\
  \n### 密钥捕获\n\n有些勒索软件防御者正在推广寻找并捕获勒索软件加密/解密密钥的防御。这些工具监控进程，当检测到类勒索软件进程时，专门寻找并记录涉及的加密/解密密钥。所有的加密/解密密钥最终必须被使用，或可以推导出明文形式以便使用。加密密钥捕获软件可以在勒索软件使用加密/解密密钥时将其并允许轻松恢复。一些研究人员已经成功展示了一个名为\
  \ `Paybreak` 的原始程序，它可以对 WannaCry 勒索软件有效：`https://eugenekolo.com/static/paybreak.pdf`。\n\
  \n#### AI 防御与机器人\n\nAI 和 AI 机器人（以及机器学习）已被用于改进网络安全防御。无疑，AI 及其机器人将用于识别和修复勒索软件程序。我预计所有网络安全的未来将是正方\
  \ AI 和机器人对抗反方 AI 和机器人的战争，谁拥有最好的算法谁获胜。防御和攻击中一直会有人类参与，但随着时间的推移，你无疑会看到双方自动化的增加。\n\n\
  但每个战术防御都可以被攻击者通过允许勒索软件行为被检测的原因并修改这种行为，无论是减速、以不同的方式做同样的事，还是做不同的事情。只要勒索软件犯罪分子能够赚钱并低概率逃避惩罚，勒索软件将一直是一个问题。这就是为什么在获得超越单个设备、系统和受害者的战略胜利之前，我们无法击败勒索软件。\n\
  \n### 战略防御\n\n战略防御在第 2 章中涵盖过，但在关于勒索软件防御未来的章节中值得再次提及。\n\n#### 关注缓解根源\n\n如果你想击败黑客和恶意软件，你需要关注允许他们入侵的利用方法。只有通过关闭漏洞（例如社交工程、未修补的软件、弱密码、窃听等），我们才能开始阻止黑客和恶意软件入侵。重点关注确定你最大的风险是什么。对于大多数公司来说，是社交工程、未修补的软件和密码问题。但无论如何，确定你组织最大的威胁，然后实施缓解措施来降低风险。从最严重、最可能的威胁开始，然后按优先级列表向下推进。\n\
  \n\n\n\n\n## 地缘政治层面的改进\n\n黑客及其创造的恶意软件之所以泛滥，是因为我们无法逮捕他们。我们需要达成一份类似于数字版《日内瓦公约》的全球协议，规定跨国界范围内什么是允许的、什么是不允许的，以及每个国家在获得违背道德或非法黑客行为的证据时同意采取的行动。在每个国家都同意勒索软件是违法的并应该受到严厉遏制之前，它将继续从那些网络犯罪的避风港滋生。我们需要强烈激励所有国家，让他们帮助击败勒索软件符合其自身的最大利益。\n\
  \n## 系统性改进\n\n我们还需要国家级的系统性改进，即每个国家及其盟友都同意执行的措施。IST 的《打击勒索软件：一项全面的行动框架：勒索软件任务小组的关键建议》（`https://securityandtechnology.org/ransomwaretaskforce/report/`）是对这类所需系统性改进的极佳总结。它列出了\
  \ 48 项建议美国政府采取以缓解勒索软件的独立行动。\n\n其许多建议要求建立一个集中的、协调的、政府/私营资助的组织来直接对抗勒索软件。它建议了许多行动，包括以下：\n\
  \n*   建立一个跨情报机构的工作组和团队来对抗勒索软件。\n*   将勒索软件指定为国家安全威胁（这在报告发布后已实施）。\n*   建立一个国际联盟来打击勒索软件犯罪分子。\n\
  *   创建一个全球性的勒索软件调查中心网络。\n\n## 将网络保险作为工具\n\n许多勒索软件防御者认为，涵盖勒索软件攻击的网络保险兴起是勒索软件攻击增加的主要因素之一。然而，勒索软件攻击及其勒索金额的惊人增长，也给网络保险业带来了巨大的挑战。如如今，获得勒索软件保险覆盖变得更加困难。正如第\
  \ 3 章“网络保险”中所涵盖的，现在愿意提供勒索软件覆盖的保险公司更少，而那些提供的公司提供的覆盖额度更小、保费更高、免赔额增加，并包含更多的免责条款。\n\n\
  结果是，网络保险行业不再向任何潜在客户提供勒索软件覆盖。今天，客户必须证明自己具有网络韧性并遵循行业最佳实践。我认为，网络保险可以用来帮助更多机构推动更好的本地网络安全。有相当比例的机构在申请网络安全保险时，才被迫解决其松散的网络安全实践。如果网络安全保险行业可以归咎于勒索软件瘟疫的增加，我认为他们也提供了另一种缓解问题的方法。\n\
  \n## 提高整体互联网安全\n\n我们还必须修改互联网，使其成为比现在安全得多的计算环境。我在第 2 章中涵盖了这项建议。我在 `https://www.linkedin.com/pulse/why-isnt-internet-more-secure-roger-grimes`\
  \ 提供了关于如何实施的更详细解决方案。在能够显著提高互联网安全性以便我们更好地识别和阻止恶意行为者之前，黑客和恶意软件将继续猖獗。\n\n## 总结\n\n\
  第 12 章涵盖了我认为勒索软件和勒索软件防御的未来。未来的勒索软件可能会经常攻击非传统平台，例如 ICS、PLC、SCADA 和 IoT 设备。我们还将看到勒索软件团伙从如今的“五重勒索”技术演变为混合目的的黑客小组，他们寻求的是最大化从每个受害者那里获得的非法收入。\n\
  \n本章还涵盖了可能的未来勒索软件防御，包括技术防御、更好的勒索软件启发式算法、金丝雀文件、黑洞技术、加密密钥捕获软件，以及 AI 防御和机器人。战略性防御可能包括地缘政治改进、系统性改进、将网络保险作为提高本地安全的工具，以及提高互联网的整体安全性。\n\
  \n## 结语\n\n本书到此结束。我希望你学到了关于如何预防和缓解勒索软件的观点。最需要记住的核心概念是，你必须更努力地防止勒索软件从根源上成功。这意味着要识别、集中并缓解导致勒索软件成功的最常见根源。通常，这意味着要更好地反击社会工程学策略、更好地进行软件补丁、使用多因素身份验证（`MFA`）以及使用良好的密码策略。\n\
  \n如果你有任何问题、意见或建议，请通过邮件联系我（`roger@grimes`）。你也可以在 LinkedIn 上关注我（https://www.linkedin.com/in/rogergrimes）或在\
  \ Twitter 上关注我（https://twitter.com/rogergrimes）。\n\n祝你继续努力！\n\n# 索引\n\n-   3 地缘政治改进](#c01.xhtml)\n\
