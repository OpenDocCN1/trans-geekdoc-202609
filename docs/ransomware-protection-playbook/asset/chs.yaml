- "# 勒索软件防护攻略书\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n5. 关于作者\n6. 关于作者\n\n\n\n\n\n\n## 引言\n\
  \n我从事计算机安全工作始于 1987 年，至今已有 34 多年了。我还记得当时我（或者当时在世的任何人）看到的第一个程序。它在 1989 年 12 月以软盘的形式出现，并很快因`AIDS\
  \ Cyborg`闻名。与今天的程序相比，它相当简单，但仍有足够的代码来彻底混淆数据，而且它的创造者有足够的胆量要求 189 美元来恢复数据。关于第一个程序及其创造者的故事即使在今天看来仍然非常奇怪且不可思议。如果有人试图在好莱坞电影中重现真相，你将不会相信。今天的创作者和黑帮可要可信得多。第一个程序的创造者约瑟夫·L·波普博士（Dr.\
  \ Joseph L.Popp, Jr.）是一位受过哈佛教育的进化生物学家，后转型人类学家。在他被捕时，他对艾病研究产生了兴趣，并积极参与艾病社区。他如何对研究产生兴趣尚无记载，或许是因为他在非洲记录\
  \ 15 年东非疣狒的经历。波普博士于 1978 年合著了一本关于肯尼亚马赛国家自然保护区的书籍（`https://www.amazon.com/Mara-Field-Guide-Masai-Reserve/dp/B0007150C`），并在\
  \ 1983 年 4 月发表了一篇关于他疣狒研究的科学论文（`https://link.springer.com/article/10.1007/BF02381082`）。艾病被认为起源于非洲的非灵长类动物，在人们寻找“零号病人”的时期，这些理论开始得到更多探索。波普博士在正确的时间出现在正确的地方。他对其中一种的研究可能导致了对另一种类的发现。\n\
  \n回到 20 世纪 80 年代后期，艾病的研究和理解还非常新且非常原始。人们对这种相对的疾病及其传播途径仍然存在着广泛的恐惧。与今天的治疗方法和抗病毒药物不同，早期感染\
  \ HIV/艾滋病意味着死刑。当时，人们害怕亲吻甚至拥抱可能患有艾病或处于高风险组的人。医学界内外对最新的信息和学习成果表现出了浓厚的兴趣。\n\n除了波普博士，没人知道他为何决定编写世界上第一个程序。有些人推测他是因为没能在艾病研究行业获得一份心仪的工作而感到不满并想要反击，但同样也可以说，他只是想确保自己的工作得到报酬。尽管如此，从一个深知自己的创作不会受到欢迎的人身上，显然存在隐藏和恶意意图的迹象。当你试图隐藏自己的参与行为时，很难说你不知道某些事情是非法的。\n\
  \n波普博士购买了世界卫生组织于 1988 年 10 月在斯德哥尔摩举行的一次艾病会议的参会者名单，据称还使用了名为`PC Business World`的英国计算机杂志和其他商业杂志的订阅列表。\n\
  \n波普博士使用`QuickBasic 3.0`编程语言创建了这个木马程序。这一定花费了他数月的时间编写代码和测试。完成后，他将程序复制到 20,000 多张磁盘上，贴上标签，打印了随附的使用说明，手动贴上邮票，然后邮寄给了美国、英国、非洲、澳大利亚等国家毫无防备的接收者。波普博士在做这一切时一定得到了帮助，因为由一个人来创建\
  \ 20,000 个软件包并手动贴邮票可能需要花费几周的时间。但在法庭文件中从未声明过其他人的参与，波普博士也未自愿透露。\n\n该木马软盘被标记为“艾病信息介绍软盘”（参见图\
  \ I.1）。\n\n![图 I.1 艾 PC Cyborg 木马到达时的磁盘图片 ¶ 感谢 Eddy Willems](img/fintrof001.png)\n\
  \n图 I.1 艾 PC Cyborg 木马到达时的磁盘图片 ¶ 感谢 Eddy Willems\n\n软盘说明介绍该磁盘声称是一个包含有关艾病信息的程序。在查看后，用户将会被要求回答一系列关于个人行为的问题。这些问题的答案将用于为用户提供一份其感染艾病个人风险的报告，以及如何避免感染的建议。\n\
  \n\n\n\n说明中包含了这样的警告：“如果你使用此磁盘片，你必须支付强制性的软件许可费用。”后者的警告后来被 Popp 博士用于他的辩护，以解释为什么他的程序不应被视为非法勒索。你可以在图\
  \ I.2 中看到这些说明和不详的警告。\n\n![图 I.2 AIDS PC 赛博人木马磁盘程序说明图 ¶ 感谢 Eddy Willems 提供](img/fintrof002.png)\n\
  \n图 I.2 AIDS PC 赛博人木马磁盘程序说明图 ¶ 感谢 Eddy Willems 提供\n\n此外，当木马程序首次运行时，它会在屏幕和打印机上（如果\
  \ PC 连接到本地打印机）打印许可协议和发票。许可协议告诉用户必须支付软件许可费，甚至包含了另一个不详的警告，这种警告你在任何正版软件中都不可能看到的：\n\n\
  就像今天一样，大多数人并不阅读软件许可协议。通常这并不是问题，但在这种情况下，不阅读带有这种异常严厉警告的许可协议将具有特殊的意义。在 20 世纪 80 年代后期，很大比例的用户不对任何非强制付费的商业软件付费。软件经常被非法复制和交易。人们为朋友复制磁盘甚至进行出售（即使他们没有给原始开发者付过钱）是极其常见的现象。当地计算机俱乐部每月举办磁盘交换。如果你不需要为软件付费，你就不付钱。作为回应，一些开发者创建了“复制保护”程序，以防止简单的、标准的磁盘复制。\n\
  \nPopp 博士要么不知道如何进行合法的复制保护，要么就是完全依赖他对那些忽视其许可说明的人所采取的独特赎金执行机制。也许他是从更早的恶意软件程序中得到的这个主意。1986\
  \ 年，第一种兼容 IBM PC 的计算机病毒——巴基斯坦大脑病毒（`https://en.wikipedia.org/wiki/Brain_(computer_virus)`）作为一种防止复制的机制被的。它的巴基斯坦创造者们厌倦了人们非法复制而不付费，而他们自己也经常非法复制这些磁盘。这些事情可不是编造出来的。它导致了启动问题，并间接地可能导致一些人为了解决问题而向发明者付费。然而，该恶意软件并没有加密任何内容，也没有直接索要赎金。\n\
  \nPopp 博士可能认为他的勒索软件程序仅仅是合法强制执行其版权和软件许可的方法。对于使用他软件的用户来说，至少在两个清晰可见的地方有警告。相比之下，如今的勒索软件程序从不给出任何警告。所以也许仅在那种方式上，Popp\
  \ 博士的作品才比如今的勒索软件程序稍微道德一点。但在更多更不道德的罪犯中成为一个稍微道德一点的罪犯，并不是任何人应该希望衡量的衡量标准。\n\n无论如何，当用户首次运行\
  \ Popp 博士的程序时，它会将自己安装在本地硬盘 (C:) 上，并修改 `autoexec.bat` 文件作为启动计数器。在相关 PC 启动 90 次左右后，程序将加密/混淆用户的文件和文件夹。然后它将显示图\
  \ I.3 所示的消息。\n\n![图 I.3 AIDS PC 赛博人木马磁盘程序说明图 ¶ 感谢 Eddy Willems 提供](img/fintrof002.png)\n\
  \n\n\n\n# Popp 博士与勒索软件的诞生\n\n在防病毒行业和执法部门确定 Popp 博士涉入其中后，他在阿姆斯特丹的基普霍机场根据逮捕令被捕，并最终关押在伦敦。逮捕期间，人们立即注意到他存在一些心理健康问题。甚至在逮捕之前，他显然在另一位乘客的行李箱上涂鸦了奇怪的信息，暗示他——即\
  \ Popp 博士——就在行李箱里。在此期间，他还做了许多其他反常举动，包括在鼻子上戴避孕套，并在胡须里夹卷发器以“抵御辐射”。直到今天，没人知道他是真的患有心理健康问题，还是假装疯了以逃避定罪。无论如何，他最初在荷兰被捕或拘留，并在某一时被送回美国俄亥俄州的父母身边。随后，他因勒索等多项罪被被捕，并引渡回英国受审。\n\
  \n## 法律辩护与技术失败\n\nPopp 博士最初的辩护是声称他所做的一切都是法的，因为他警告了用户，是用户没有支付他们法律义务支付的费用。一些律师认为，尽管这不寻常且不符合道德，但他可能有一个合理的法律观点。Popp\
  \ 博士最初辩护中的有一部分崩塌了，因为他的程序还会说明：如果用户将他的勒索程序带到另一台电脑并允许其锁定该电脑，该程序将解锁原始电脑以便恢复使用。这部分程序无论是有意还是无意都没有正常工作，导致原始电脑和额外的\
  \ PC 都无法运行。\n\n## 影响与调查\n\n目前尚清楚 Popp 博士是否收到过钱，或者是否发送过哪怕一张解锁盘，亦那张解锁盘是否有效。我不知道有谁支付过勒索金，在几十篇旧新闻报道的受害者中，没有人声称支付过勒索金或从\
  \ Popp 博士 处收过解锁盘。我想，当他的程序开始引起全球新闻时，Popp 博士为了躲避被捕很快逃亡了。怀疑他是否有时间在巴拿马领取款项并发送解锁盘，可以肯定他并没有大规模地这样做。每一条关于\
  \ PC Cyborg 木马的新闻报道都以电脑被锁定的受害者为主角。\n\nPopp 博士在法庭程序和调查人员面前称，他计划将所有勒索金捐给艾滋病研究。这种说法不太可能说服任何法庭，也不会导致任何待处理指控的撤销。尽管必须指出，Popp\
  \ 博士确实属于几个为研究筹资金的艾滋病小组，并参与了多次艾滋病教育会议和计划。无论如何，一位或多位法官裁定他不适合受审，并在 1991 年 11 月，英国法官\
  \ Geoffrey Rivlin 将他释放并回到父母身边。\n\n## 晚年与争议\n\n他淡回了相对无闻的状态，将兴趣转向了人类学。他那些臭名昭著的行为直接攻击并不公平地诋毁了全球艾滋病研究人员，这让他无法继续参与该领域。\n\
  \n十年后，2001 年 9 月，他出版了一本相当有争议的书名为《流行进化的生活教训》（[*Popular Evolution Life Lessons*](https://www.amazon.com/Popular-Evolution-Life-Lessons-Joseph-Popp/dp/0970125577），书中包含了许多非传统的的建议，包括对繁衍的激进关注，甚至是针对刚刚进入青春期的年轻女性。他强烈推崇“科学伦理”，而这与我们其他人遵循的大多数道德准则和伦理背道而驰。也许他对自己那套非传统伦理的信念，在他创建第一个勒索软件程序中起了作用。他还支持优生学和安乐死。他不认为任何人应该养宠物。他几乎得罪了每一个过着传统生活的人。可以说，他的建议书并不是畅销书，而且在他追求其他职业期间，这也没有减弱他在他人眼中古怪的形象。\n\
  \n有时，即使是一个古怪的人也可以是一个温和的人并深受他人喜爱。在他 2007 年去世之前，“Joe 博士”资助了位于纽约州北部昂尼塔（Oneonta）的“Joseph\
  \ L. Popp, Jr. 蝴蝶馆”。他们有自己的 Facebook 页面（[Butterfly Conservatory](https://www.facebook.com/Joseph-L-Popp-Jr-Butterfly-Conservatory-119385884741701/)）。这家蝴蝶业务至少持续到\
  \ 2020 年新冠疫情封锁期间，但主网站域名现已挂售，且在 2020 年 1 月初之后没有任何 TripAdvisor 评论了（[Butterfly Conservatory\
  \ Reviews](https://www.tripadvisor.com/Attraction_Review-g48333-d1755655-Reviews-Joseph_L_Popp_Jr_Butterfly_Conservatory-Oneonta_New_York.html)）。早期的一些评论表明，在新冠疫情之前情况看起来有些破旧和破遢，所以它可能已经结束了最后一次营业。\n\
  \n## 遗产\n\n在一生中，Popp 博士拥有过几种不同的职业，包括进化生物学家、作家、人类学家和蝴蝶爱好者。但他可能最不愿意的成名——一件他余生都无法逃避的事——是勒索软件之父。今天关于他作为勒索软件创造者（2021\
  \ 年）的故事，依然与 1990 年他的作品制造数字恐乱时的故事一样多不许多。他在历史上的地位远超他自己的寿命。\n\n关于 Popp 博士及其 PC Cyborg\
  \ 程序的更多信息和故事可以在以下资源中找到：\n\n* `https://en.wikipedia.org/wiki/AIDS_(28Trojan_horse%29`\n\
  * `https://www.csoonline.com/article/3566886/a-soft-target-ransomware`\n* `https://www.vice.com/article/nzpwe7/the-worlds-first-ransomware-came-on-floppy-disk-in-1989`\n\
  * `https://www.sdxcentral.com/security/definitions/case-study/aids-trojan-ransomware/`\n\
  * `https://www.thepitchkc.com/dr-popp-the-first-computer-virus-and-the-purpose`\n\
  * `https://blog.emsisoft.com/en/34742/history-of-ransomware-a-supervillain-30-years-in-the-making/`\n\
  * `https://www.villagevoice.com/2009/04/16/dr-popp-the-first-computer-virus-and-the-`\n\
  * `https://www.gwintdailypost.com/news/business/the-bizarre-story-of-the-inventor-of-ransomware/article_bed2be94-129c-5d5a-a973-2112d9955a6.html`\n\
  * `https://www.knowbe4.com/aids-trojan`\n\n\n\n\n慢慢地，一些稍微“好一点”的勒索软件开始出现。它们中的大多数都编写了自己的加密程序，这意味着几乎总是会导致非常糟糕、极易被破解的加密。这些早期的“加密病毒”或当时人们所说的“加密木马”，很少需要解密密钥来解锁数据。业余密码学家往往能想出在不支付赎金的情况下解密被锁定文件的方法。良好的加密很难制作的。到\
  \ 2006 年，第二类加密恶意软件开始出现，这次使用了已知且经过证明、不那么容易破解的加密程序。到 2013 年，使用极难甚至无法破解的加密技术的勒索软件已变得相当常见。\n\
  \n随着加密问题的逐渐解决，犯罪分子面临更大的问题是勒索软件创建者如何在不被捕并入狱的情况下收款。发生了两件事。首先，`Bitcoin`在 2009 年被发明。经过了几年的时间，到\
  \ 2014 年，勒索软件建立了与`Bitcoin`的联系，整个勒索行业发生了爆炸式增长。现在，犯罪分子可以在不被发现的情况下获得报。\n\n其次，像俄罗斯等主要国家成为了勒索软件犯罪分子的网络避风港。今天，许多勒索集团位于俄罗斯或其周边，并在几乎不受惩罚的情况下运营。许多人向当地和国家执法部门支付贿赂作为业务活动的一部分，而且他们的收入流在母国被视为净收益。只要他们不加密其母国或友好盟友国家的计算机，他们就可以自由地开展业务，只有极少数例外。\n\
  \n有了这两项新进展，复杂的勒索软件开始攻破整个企业、医院、警察局，甚至是整个城市。今天，勒索软件如此泛滥，以至于整个公司倒闭、支付数百万美元的赎金甚至不会引起任何注意。勒索软件攻击正在破坏油气管道、食品生产厂、大型企业集团，关闭学校、推迟医疗保健服务，并几乎在不受惩罚的情况下利用他们所能利用的一切。当我写下这些文字时，勒索集团可能正处于他们的“黄金时代”，造成的比以往任何时候都多的混乱，赚到了更多的钱。在这一刻，我们在阻止它方面做得并不好。\n\
  \n但我们可以做到。这正是本书的主题。它是关于如何将防止勒索软件发生作为你的首要目标，并在你的组织遭受攻击时将损害最小化。事实证明，任何组织都可以做很多事情来避免被勒索软件攻击，或至少显著降低概率。对抗勒索软件不仅仅是拥有一个良好的、可靠的备份和最新的防毒病毒软件。\n\
  \n本书将告诉你为了防止勒索软件攻击发生而能做的最佳方法，这比你能找到的任何其他来源都要好。它将详细说明在你可能遭受勒索软件攻击之前需要做的事情，以及如果你被利用了，每一步该怎么做。你不必成为受害者。你可以反击。\n\
  \n任何人都可能成为勒索软件的受害者。目前，勒索软件很难击败。本书的目的并不是说你可以 100%地击败勒索软件。你做不到。没有人可以做出那种断言。网络安全防御关乎风险最小化，而不是消除。我的目标是帮助你尽可能地降低风险。如果你遵循书中的观点和步骤，将在我们目前能力范围内，尽最大限度地降低你被勒索软件成功利用的风险，直到我们开发出对大家都有更有效的新防御（涵盖在第\
  \ 2 章，“防止勒索软件”）。\n\n为这场义战战斗！\n\n## 本书的读者\n\n本书主要针对任何负责管理组织计算机安全的人员，从前线防御者到高层计算机安全高管。它适用于任何考虑第一次或第十次审查、购买或实施计算机安全防御的人士。\n\
  \n防止和缓解勒索软件所需的手段，也正是防止和缓解所有恶意黑客和恶意软件所需的手段。书中传授的教训如果被遵循，将显著降低所有恶意黑客和恶意软件攻击的风险。即使有一天勒索软件消失了，在这里学到的教训也将轻松适用于下一次“大”攻击。勒索软件不是你真正的问题；它是你真正问题的后果。\n\
  \n## 本书涵盖了什么？\n\n《勒索软件保护策略手册*包含 12 个章节，分为两个不同的部分。\n\n### 第一部分：引言\n\n第一部分 总结了勒索软件的作用、它有多复杂，以及如何防止它利用你的组织和设备。许多人并不理解勒索软件有多成熟，更多的人没有在攻击发生前投入足够的精力阻止它。\n\
  \n*   **第 1 章，“勒索软件简介”**：第 1 章 涵盖了勒索软件，从重大里程碑的简短历史开始，然后讨论了今天使用的非常复杂且成熟的版本。勒索软件行业的运作方式更像是一个多级营销公司/生态系统，而不是其他任何东西。第\
  \ 1 章 将涵盖常见的组件。作为一个全面的介绍，它也是书中最长的一章。\n\n*   **第 2 章，“防止勒索软件”**：防止勒索软件是一个讨论得不够的问题。最推荐的“预防”控制措施——良好的备份，根本就不是预防。第\
  \ 2 章 将讨论每个人和组织应该应该尽其所能做的事，以防止勒索软件发生。在讨论如何击败勒索软件的过程中，它将讨论如何最好击败所有恶意黑客和恶意软件。\n\n\
  *   **第 3 章，“网络保险”**：对于面临勒索软件威胁的组织来说，购买网络保险是一个巨大的困境。网络保险是复杂的。第 3 章 为读者提供了网络保险的基础知识，包括在考虑保单时应该避免的事项。它以对目前网络安全行业正在发生的巨大变化及其未来方向的坦诚讨论结束。\n\
  \n*   **第 4 章，“法律考量”**：第 4 章 涵盖了处理成功的勒索软件攻击涉及的法律考量，不仅包括是否支付赎金的决定（尽管这是该章大部分），还包括在攻击期间如何利用法律帮助自己自己。第\
  \ 4 章 将包含每个组织在规划和应对勒索软件时应该利用的技巧建议。\n\n### 第二部分：检测与恢复\n\n第二部分 将帮助你计划应对成功的勒索软件攻击。\n\
  \n*   **第 5 章，“勒索软件响应计划”**：每个组织都应该在实际勒索事件发生之前制定并练习详细的勒索软件响应计划。第 5 章 将涵盖你的勒索软件响应计划应该包含的内容。\n\
  \n*   **第 6 章，“检测勒索软件”**：如果你无法阻止网络安全漏洞的发生，最好的选择就是早期预警和检测。第 6 章 涵盖了检测勒索软件的最佳方法，并让你在开始造成真实损害之前停止它的最佳机会。\n\
  \n\n\n\n- 第 7 章，“最小化损害” —— `第 7 章](#c07.xhtml)` 假设勒索软件已经成功入侵环境，并加密了文件且外泄了数据。在第一天的前几个小时内，如何减少勒索软件的扩散及其损害？`第\
  \ 7 章](#c07.xhtml)` 将告诉你如何做。\n- 第 8 章，“早期响应” —— 在防止初始损害进一步扩散后，现在是初步清理、更好的评估以及额外的响应，而不仅仅是防止进一步扩散。`第\
  \ 8 章](#c08.xhtml)` 是你在第一天或第二天后需要做的事情。你执行这部分响应的效果好坏通常决定了完全恢复需要多久。\n- 第 9 章，“环境恢复”\
  \ —— `第 9 章](#c09.xhtml)` 涵盖了最初几天后需要做的事情。你停止了扩散，最小化了损害，并开始让一些初始系统恢复并运行。`第 9 章](#c09.xhtml)`\
  \ 是你在最糟糕的情况结束后需要做的事情。它涵盖了长期项目，即那些通常需要几天、几周甚至几个月才能恢复或重建的项目。\n- 第 10 章，“后续步骤” —— 所以，尽管你付出了最大的预防努力，仍然被勒索软件成功入侵了。`第\
  \ 10 章](#c10.xhtml)` 涵盖了你需要学习的教训以及需要实施哪些缓解措施来防止再次发生。许多勒索受害者跳过了这一步，往往再次受到攻击，而且通常后续的情况更糟。学习你需要学习的并采取行动，以增强对勒索软件的韧性。\n\
  - 第 11 章，“不要做什么” —— 在紧急情况下，知道不要做什么与知道做什么一样重要。许多勒索软件受害者因早期犯致命错误而使情况恶化。`第 11 章](#c11.xhtml)`\
  \ 涵盖了任何组织应该避免做的事情，以免情况比现在更糟。\n- 第 12 章，“勒索软件的未来” —— `第 12 章](#c12.xhtml)` 涵盖了勒索软件可能性的未来、它将如何演变，以及最终需要什么才能永远击败它。\n\
