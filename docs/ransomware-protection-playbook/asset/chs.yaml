  \ 网站，如果需要，我将在那里发布补充本书的额外内容和更新。\n\n如果你有任何问题、建议或更正，请随时通过 `roger@banneretcs.com` 电子电子邮件联系我。\n\
  \nWileyPRE\n\n# 第一部分\n\n## 引言\n\n* 第 1 章：勒索软件简介\n* 第 2 章：预防勒索软件\n* 第 3 章：网络安全保险\n\
  * 第 4 章：法律考量\n\n# 第 1 章：勒索软件简介\n\n本章是对勒索软件的概括介绍，从基础知识开始，引导至对使勒索软件在今天成为如此成熟且强大对手的所有特征和组件进行更深入的讨论。你将发现，勒索软件行业很大程度上运行得更像是一个专业的企业化行业，而不是传统认知中几个躲在地下室里、喝着高咖啡因汽水、周围堆满空薯片袋的坏人或团伙。相反，你更有可能发现首席执行官、薪资部门、专业开发者和合作伙伴。你将对今天的勒索软件、它是什么以及如何运作，以及击败它面临的重大挑战有非常好的理解。\n\
  \n## 问题有多严重？\n\n许多媒体和安全专家似乎在竞争使用关于勒索软件的最夸张辞藻。但在计算机安全世界中，难得一次，这些统计数据和可怕的声誉是名副其实的。我们经历过其他非常糟糕的、长时间造成损害的恶意软件，例如\
  \ DOS 启动病毒、像 `Michelangelo` (1992) 这样的磁盘格式化计算机病毒、导致电子邮件和传呼机系统崩溃的 `Iloveyou` 蠕虫 (2000)、像\
  \ `SQL Slammer` (2003) 这样快速传播并导致数据库崩溃的蠕虫、通过 USB 闪盘传播的 `Conficker` (2008)、垃圾邮件机器人以及消耗资源的加密货币矿器。我们与造成损害的恶意软件共存了很久。但此前没有任何一种威胁产生过像勒索软件这样的损害和运营中断。这在人类历史上是无与伦比的，这并非夸张。它可能是迫使互联网最终变得显著安全的“转折点”事件。\n\
  \n尽管勒索软件过去和现在都很糟糕，但它仍在变得越来越糟糕。针对潜在受害者的尝试在增加。成功攻击的数量在增加。每次利用所要求的赎金金额更高。支付赎金的受害者比例正在增加。从财务和其他方面来看，整体损害呈指数级增长。自从勒索软件出现以来，特别是自从\
  \ `bitcoin` 出现并允许其爆发以来，对于勒索软件供应商及其程序来说，这一年又一年历史性的一年。我们可能正生活在恶意软件的“黄金时代”，至少从坏人的角度是这样说的。以下是写作时的最新数据：\n\
  \n* `FBI` 表示它正在调查 100 种不同类型的勒索软件 `https://www.reuters.com/technology/fbi-says-it-is-investigating-about-100-types-ransomware-wsj-2021-06-04/`。\n\
  * 在一年内，受调查的机构中有 68% 遭遇了成功的勒索攻击 `https://cyber-edge.com/wp-content/uploads/2021/04/CyberEdge-2021-CDR-Report-v1.1.pdf`。单这一个数字就令人震惊。\n\
  * 上一个点中的相同调查显示，2020 年平均支付赎金为 166,475 美元，57% 的受害者支付了赎金。\n* `Coveware` 表示 2021 年第一季度平均支付赎金为\
  \ 220,298 美元 `https://www.coveware.com/blog/ransomware-attack-vectors-shift-as-new-software-vulnerability-exploits-abound`。为什么\
  \ `Coveware` 的数字比之前的报告？可能是因为 `Coveware` 的数据更新。当我看到低廉的勒索软件数字时，我通常会检查统计日期，它们几乎总是过时的。我所说的过时，是指只旧了一两年。无论如何，勒索软件随着时间的推移在巨大增长。\n\
  \n* 作者所知的最高支付赎金为 4000 万，但有很多在 500 万到 1000 万之间。可能有很多我们未知的私人支付赎金超过 4000 万。\n* 这份 2019\
  \ 年报告 `https://blog.emsisoft.com/en/34822/the-state-of-ransomware-in-the-us-report-and-statistics-2019/`\
  \ 显示平均勒索软件事件成本为 810 万美元，恢复需要 287 天。\n* 该厂商表示，全球支付的赎金达 180 亿美元，总成本以百亿计 ... `https://blog.emsisoft.com/en/38426/the-cost-of-ransomware-in-2021-a-country-by-country-analysis/`。\n\
  \n总之，勒索软件问题非常严重，并且随着时间的推移日益恶化。\n\n### *勒索软件数据的变异性*\n\n\n\n\n勒索软件领域的发展异常迅速，试图获取最新的数据和统计数字往往就像试图“在墙上钉住果冻”一样困难。在不同时期，不同供应商和调查报告所得出的结论往往截然不同。例如，许多网络安全厂商会讨论长达数月的平均潜伏时间，此时勒索软件团伙已精确计算出他们可以索取的最高赎金金额；而另一些人则会告诉你，“大多数”勒索攻击发生在入侵后立即或在初始成功利用后的几小时内，且所有受害者都被要求支付相同的固定数额。谁是对的？可能大家都是的。每年至少有\
  \ 100 多种由各种技能水平和经验不同的犯罪分子编写的勒索软件成功攻击了数万到数十万个组织和个人。不同的勒索组织还针对不同的行业、部门和地区。这些数字和统计必然存在巨大差异。\n\
  \n即使是同一个问题，同一供应商给出的数字也可能不同。例如，上述 Coveware 2021 年第一季度报告中的数字显示，平均支付的赎金为 220,298 美元，但在同一报告中，它也提到中位数赎金支付为\
  \ 78,398 美元。这两个数字看起来完全对不上。这种表面上的统计异常意味着少数高端的受害者支付的费用远高于其他受害者，从而推高了所有人的平均值。事实证明，支付几笔\
  \ 500 万和 1000 万美元赎金会偏斜结果。\n\n因此，如果你试图估算支付赎金可能给你的公司带来多少成本，你在估算计算中该使用哪个数字？这取决于你的视角。最保守的答案是，如果你想稳妥起见并为最坏情况留\
  \ {，请使用最高合理的估计值。但谁知道呢，如果你的组织遭到勒索软件攻击，犯罪分子可能会索要一个不合理的数字。当然，任何被索要数百万赎金的组织，没有一个会认同这种请求是合理的。\n\
  \n你可能需要支付多少钱，实际上取决于你中了哪种类型的勒索软件、在损害控制开始之前情况变得有多糟糕，以及恢复过程如何。在没有陷其中之前，没有人知道这些答案。这好比你带着左下腹象的剧痛进入手术室，在医生给你麻醉之前询问手术费用是多少。没有人知道。\n\
  \n话虽如此，无论你获取了什么数字，无论他们使用的是平均值、中位数还是去年的数据，勒索软件造成的损害是巨大的且正在日益恶化。对于价值数亿美元的组织，涉及的总成本可以很容易达到数百万美元；对于价值数十亿美元的组织，则高达数亿美元。较少金额的赎金对较小组织来说甚至是毁灭性的。\n\
  \n## 勒索软件的真实成本\n\n许多防御者在辩证防御勒索软件的必要性时，必须提出勒索软件事件可能造成的潜在损害。不同组织遭受的损害差异巨大，取决于组织的规模、收入来源、准备工作、涉及数据的价值、事件严重程度以及应对特定勒索软件攻击的能力。有很多变量在起作用。如果中了一个本是针对家庭用户的非常简单的勒索软件，清理一台被利用的计算机的成本可能低于\
  \ 1,000 美元。如果中了另一种勒索软件变种，可能意味着整个网络停机数周甚至数月。\n\n尽管如此，许多防御者被要求提供估计成本，以帮助做出勒索软件的网络安全风险管理决策，例如是否购买网络安全保险、升级旧的备份系统，或者下一步应该投资什么以防止勒索软件攻击在组织内成功。不幸的是，如前所述，勒索软件的风险和成本无不在且差异巨大。\n\
  \n供应商和报告之间你能看到最大的分歧之一就是“勒索软件成本”或类似的说法。例如，像 Cybersecurity Ventures 这样的供应商会发布一个巨大的数字，称\
  \ 2021 年勒索软件成本高达 200 亿美元，并到 2031 年损失将增长到 2560 亿美元（`https://cybersecurityventures.com/global-ransomware-damage-costs-predicted-to-reach-250-billion-usd-by-2031/`）。而另一方则有人说成本仅为“百万”美元级。例如，FBI\
  \ 非常推崇的 2020 年网络犯罪报告（`https://www.ic3.gov/Media/PDF/AnnualReport/2020_IC3Report.pdf`）指出：“2020\
  \ 年，IC3 收到了 2,474 份被识别为勒索软件的投诉，调整损失超过 2,910 万美元。”所以，一个供应商说 2021 年是 200 亿美元，而另一个机构说\
  \ 2020 年仅为 2,910 万美元。我怀疑勒索软件的损害在单一年内翻了了不止 687 多倍。\n\n协调这些巨大差异并决定哪个数字更准确的关键在于，意识到他们报告的往往是不同的内容。在\
  \ FBI 的案例中，他们只报告了向他们报告的勒索软件事件。最多也只包含美国受害者，即便如此，这也只是勒索软件受害者的极小比例。那些数十亿的数字总是包含了全球考量。\n\
  \n尽管如此，FBI 的数字似乎很低。如果你将引述的损失（2,910 万美元）除以受害者人数（2,474 人），你得到的平均损失仅为 11,762 美元。我不确定\
  \ FBI 的“调整损失”数字包含了什么，但看起来看起来非常低，即使它只包含了赎金。大多数其他报告显示的数字，单赎金就超过了 50,000 到 200,000\
  \ 美元。\n\n也许差异很大的一个原因是，调整损失可能包含了保险理赔后的“会计”损失。这项 2020 年的研究（`https://www.sophos.com/en-us/medialibrary/Gated-Assets/white-papers/sophos-the-of-ransomware-2020-wp.pdf`）指出，64%\
  \ 的勒索软件受害者拥有涵盖勒索软件的网络安全保险。因此，近三分之二遭受勒索软件攻击的受害者可能只需支付少量额额，除非赎金和损害超过了他们的保额。\n\n许多报告勒索软件统计数据的供应商不仅报告支付的赎金，还报告让受害者重新运行所花费的资金。许多勒索软件事件可能包含许多人们未到的间接成本，而这些并未出现在大多数报告中。如果你试图为缓解勒索软件、计算是否负担得起网络安全保险费或计算真实成本进行风险评估，请考虑以下相关成本：\n\
  \n- **无论是否发生勒索软件事件，成本包括：**\n    - 为了预防攻击的勒索软件缓解措施\n    - 为了准备从勒索软件事件中恢复而增加的备份成本和人力\n\
  \    - 网络安全保险费（如有）\n- **如果发生了勒索软件事件，成本包括：**\n    - 支付的赎金（如有）\n    - 恢复费用\n    -\
  \ 业务中断损失（目标受害者及下游影响）\n    - 执法和调查成本\n    - 人员变动、增加/删除/变动（如有）\n    - 由于新流程和保护措施导致的生产力下降（如有）\n\
  \    - 声誉损害\n    - 为了缓解下次攻击的额外防御准备\n    - 网络保险免赔额/自留额\n\n\n\n\n当你考虑到从勒索软件攻击中恢复所需的全部成本时，你会发现这些成本远比仅仅支付赎金和“恢复损失”要得多。这意味着，从源头上防止勒索软件的发生几乎总是更廉价的选择。\n\
  \n## 勒索软件的类型\n\n并没有一种单一类型的勒索软件，尽管大多数勒索软件具有许多我们大多数人与“勒索软件”这一描述相关在一起的共同特征，包括以下内容：\n\
  \n* 它是一种恶意软件程序（即恶意代码）。\n* 它潜入或被秘密放置在受害者的计算机或设备上。\n* 它具有加密文件的能力。\n* 它索要赎金以提供解密密钥。从本书引言中提到的\
  \ 1989 年的 `PC Cyborg` 木马程序这一第一个勒索软件程序以来，大多数传统的勒索软件在存在的前二十年里都遵循这一基本模式。但勒索软件随着时间的推移已经发生了变化。现在有许多不同类型的勒索软件，而且在本书编写期间，重大的演化正在持续发生。通过理解不同的类型，你可以更充分地认识到，如果你卷入了勒索软件攻击，勒索软件的行为并非单一的，你可以对任何差异做好充分准备。以下是各种勒索软件程序的不同类型和特征：\n\
  \n* 伪造勒索软件\n* 立即行动与延迟行动\n* 自动或人工引导\n* 单台设备或多台设备影响\n* 木马与蠕病毒\n* 文件加密与引导感染\n* 良好加密与恶意加密\n\
  * 感染与更多载荷\n* 勒索软件服务 (RaaS)\n\n### 伪造勒索软件\n\n并不是所有声称是勒索软件的恶意软件真的在加密文件并获取计算机的最终控制权。有很多远不复杂的恶意软件程序和简单的\
  \ JavaScript 小声称是勒索软件，但实际上是伪造的。它们并没有加密任何内容。它们通常被称为`scareware`（恐吓软件）。\n\n它们通常接管用户当前的互联网浏览会话，使受害者可能认为他们失去了对计算机或手机的控制，并且必须支付赎金才能重新获得控制。伪造的勒索要求通常伴随着一种主张，声称受害者被录下了正在做尴尬事情（例如看色情片等）或非法活动（例如看儿童色情片、未交纳合法税款等）的。图\
  \ 1.1 展示了这样一个伪造勒索软件警告，声称涉及美国司法部和联邦调查局（FBI）。\n\n![图 1.1 恐吓软件截图示例](img/c01f001.png)\n\
  \n图 1.1 恐吓软件截图\n\n伪造的勒索软件警告在移动媒体设备上同样流行。你可能会疑惑到底会会相信这种警告，尤其是考虑到建议的支付方式，但几十年来，一直有一定比例的人支付了伪造勒索软件程序索取的赎金。甚至发生过多起自杀案，甚至发生过至少一起自杀案（`https://hotforsecurity.bitdefender.com/blog/romanian-man-commits-suicide-and-kills-his-4-year-old-after-falling-for-police-ransomware`）。\n\
  \n\n\n\n那些覆盖启动区和文件且无意让用户轻松恢复的恶意软件被称为 `wiper` 程序。NotPetya 是一种擦除器程序，而不是勒索软件，尽管它经常被分类并像勒索软件一样被讨论。NotPetya\
  \ 之所以被当作勒索软件讨论，是因为其大部分代码借用自另一个名为 `Petya` 的真实勒索软件程序。但 `Petya` 勒索软件程序被修改成了擦除器程序，这也是它被称为\
  \ `NotPetya` 的原因之一。如果一个程序索要赎金，但从不真的收过任何赎金来解锁加密文件，那么它就缺少了勒索软件最重要的一部分……赎金！\n\n###\
  \ *立即行动 vs. 延迟行动*\n\n大多数早期的勒索软件在执行后会立即运行并加密文件。就在几年前，可能有 70% 的勒索软件都是这样做。立即行动型勒索软件程序更容易编写，在执行载荷之前被检测到的概率较低，并且会导致更快的支付，因为它们通常造成的破坏较小，索要的赎金也较少。它们也被称为\
  \ `direct-action` 恶意软件。\n\n今天，立即行动型勒索软件已是少数。从 2019 年底开始，立即行动木马开始变得不再常见。它们仍然很多（因为它们更容易编写），但大多数勒索软件在执行载荷之前会“潜伏”几天、几个月甚至几年。我们将在下方的“典型的勒索软件流程和组件”部分中介绍更多内容。图\
  \ 1.3 显示了一个名为 `Cryptic` 的常见立即行动型勒索软件程序的示例。\n\n![图 1.3 立即行动 Cryptic 勒索软件截图 ¶ 注意：此图的大尺寸可在\
  \ www.wiley.com/go/ransomwareprotectionplaybook 下载。](img/c01f003.png)\n\n图 1.3 立即行动\
  \ Cryptic 勒索软件截图 ¶ 注意：此图的大尺寸可在 [www.wiley.com/go/ransomwareprotectionplaybook](http://www.wiley.com/go/ransomwareprotectionbook)\
  \ 下载。\n\n我从一个托管恶意软件程序的网站下载了它，用于我正在演示的一个研讨会。我真的惊讶地发现了一个在不到 15 秒内执行并锁定了了我正在运行它的测试虚拟机环境的勒索软件。虽然你无法直接看到加密的文件，但你可以看到所有新建的\
  \ `TXT` 文件，这些是用西里尔语和英语编写的勒索通知。某些立即行动型勒索软件会在加密文件之前快速执行其他载荷，例如收集密码并将其上传到黑客组织。直接行动型恶意软件是自动化的，一旦触发就会完成其操作，而且通常在几秒钟内完成。\n\
  \n另一个常见的直接行动型勒索软件被称为 `Kolz` (`https://heimdalsecurity.com/blog/kolz-ransomware/`)。它加密文件，为所有加密文件添加扩展名，然后要求受害者向勒索犯罪分子发送\
  \ 490–980 美元，以获取解密密钥。\n\n然而，显而易见，越来越多的勒索软件在受害者设备和网络上花费更长时间，且无论如何都不被检测到。\n\n\n\n\
  早期且简单的勒索软件只会影响其最初运行的设备。如今大多数勒索软件要么直接影响更多设备，要么允许人类对手探索并攻破更多资产。如果勒索软件程序（如图 1.2 中所示的\
  \ `Cryptic` 勒索软件程序）仅加密它所在的计算机，那么你可以认为自己是“幸运”的。\n\n年前，勒索软件如果利用了更多计算机，是通过从计算机内存中收集管理员登录凭据来实现的。这通常发生在连接到\
  \ `Microsoft Active Directory` 网络的 `Microsoft Windows` 上。勒索软件程序会使用键盘记录器或像 `Trickbot`、`Mimikatz`\
  \ 或 `Wince` 等程序从内存或文件中窃取用于管理员登录凭据的密码或密码哈希值，然后使用这些被盗的凭据传播到更多设备上。\n\n如今，勒索软件可以使用这些相同的自动化方法，或者人类对手可以进入受攻击的环境，环顾四周，并使用各种工具和脚本来收集他们所需的凭据类型并利用额外的计算机（即横向移动）。今天，大多数勒索软件程序都会同时利用并加密多台计算机，因为这增加了赎金的概率和金额。我听说过成百上千万台计算机同时被锁定。即使组织中没有大多数计算机被加密，该组织也必须假设所有计算机都已被破解。在依赖这些计算机之前，组织必须清理或验证所有计算机都是安全的。\n\
  \n大多数勒索软件团伙同时利用并加密多台计算机的能力，意味着任何受攻击的受害者都必须假设最坏的情况，直到每台可能访问的计算机都经过调查并被认为是安全的。整个全球性集团公司关闭已屡见不鲜，而实际上受影响的只是规模小得多的部门或地点。这种情况发生在臭名昭昭的\
  \ `Colonial Pipeline` 攻击中（`https://en.wikipedia.org/wiki/Colonial_Pipeline_cyber_attack`）。根据新闻报道，勒索软件仅直接影响\
  \ `Colonial` 的计费系统，但规模更大的运营系统不得不关闭，直到计费恢复且 `Colonial` 验证它可以重新打开管道。此外，管道的关闭导致了完全不受管道影响的汽油供应问题。例如，佛罗里达州未受管道服务且没有中断的地区出现了“抢购汽油”，仅仅是因为消费者担心短缺。在像\
  \ `荷兰` 这样遥远且未影响的国家，人们被告知由于攻击可能会出现中断。这表明勒索软件即使只破坏组织极小百分比的计算机也会导致巨大的问题。\n\n即使你认为自己只遭受了直接行动的单机勒索软件攻击，你如何能确定呢？仅仅由于多计算机勒索软件的存在，组织的风险计算就会变得复杂得多，这不仅是因为勒索软件经常会同时影响多台计算机，而且仅仅是因为即使勒索软件没有这样做，这种威胁依然存在。\n\
  \n### 勒索软件根源\n\n黑客可以使用多种方法将勒索软件引入组织，包括以下：\n\n*   社会工程学\n*   恶意软件\n*   未修补的软件\n*\
  \   利用配置错误\n*   密码破解\n*   使用已知的此前受攻击的受害者密码\n*   USB 密钥感染\n*   受信任的第三方受损\n\n传播勒索软件最常见的方法是通过社会工程学设计的电子邮件或网站弹出消息传播并执行木马程序。在大多数时期内，社会工程学负责了绝大多数勒索软件攻击（尽管在某些特定时期还有其他主要的根源）。\n\
  \n还有一些像 `WannaCry`（`https://en.wikipedia.org/wiki/WannaCry_ransomware_attack`）这样的勒索软件程序像蠕虫一样传播。计算机病毒使用自己的代码，通常会寻找并利用未修补的软件，或寻找它可以滥用的配置错误。`WannaCry`\
  \ 特别是寻找并使用了易受“Eternal Blue”服务器消息块 (`SMB`) 漏洞攻击的未修补版本的 `Microsoft Windows`。`SMB`\
  \ 是一种协议，该漏洞被利用了 `Windows` 的底层文件。这表明勒索软件即使只破坏组织极小比例的计算机也会导致大问题。\n\n\n\n\n\n还有许多勒索软件程序仅寻找并加密特定类型的文件，通常是\
  \ Microsoft Office 格式（例如 Microsoft Word `.docx`、Microsoft Excel `.xlsx` 等）。黑客的思路是，通过加密较少的文件可以更快地加密更多数据，并且仍然能拿到。这通常是事实。用户的数据比常见且静态的操作系统文件更有价值。\n\
  \n### 良好的加密与糟糕加密\n\n无论勒索软件如何加密，了解它使用的加密类型都至关重要。一些早期的勒索软件程序（如 `PC Cyborg` 木马）实际上做的更接近混淆而非真正的加密。这在今天有时仍然真实。一些技术不复杂的勒索软件要么使用混淆策略而非良好的加密，或者使用糟糕的加密。良好的加密很难制作。即使是世界上受过最专业培训、教育程度最高的密码学家，在编写良好、可靠的新加密程序时也面临困难。\n\
  \n在勒索软件的世界，早期的勒索软件使用混淆和自制的（即糟糕的加密）程序。这些早期尝试中的大多数，经过训练的密码学家，甚至仅仅是一个普通的、未经过训练的人（只要了解发生了什么且至少懂一点编程），都不费吹灰地之力就能逆向。\n\
  \n今天，大多数勒索软件使用非常优秀且被广泛接受的密码学，如 `RSA` 和`高级加密标准 (AES)`。由良好的加密程序加密的文件通常在没有相应解密密钥的情况下无法密。尽管如此，如果受害者“幸运”，有时加密并不完美，可以在没有解密密钥的情况下恢复文件。市面上还有技术不复杂的勒索软件版本。有时同一款勒索软件程序的所有版本共享同一个解密密钥，如果是这样，一旦一个受害者获知了这些密钥，其他人在只要密钥公开的情况下，就可以使用相同的密钥，而无需支付赎金。有许多网站专门为那些共享密钥的勒索软件类型分享勒索密钥（我们将在后面的章节中介绍这些）。\n\
  \n### 加密 vs 更多载荷\n\n在“过去的旧日子里”，勒索软件只加密文件。这种情况一直持续到 2019 年底。从 2019 年 10 月开始，名为 `Maze`\
  \ 的单一勒索软件开始威胁要公开分享泄露的数据。在之前的几个月里，该勒索软件团伙曾多次发出发布被盗数据的威胁，但他们尚未采取行动如果不付钱就发布被盗信息。接着在\
  \ 2019 年 11 月（`https://www.bleepingcomputer.com/news/security/allied-universal-breached-by-maze-ransomware-stolen-data-leaked/`），`Maze`\
  \ 最终履行了威胁，在多个地点（包括其个人网站和 Wikileaks）公开发布了受害者的被盗数据。很快这变成了常态。图 1.4 显示了一个从法律事务所窃取文件的真实案例、被放置在“暗网”上的证据以及一份提出的勒索要求。\n\
  \n![图 1.4 一份真实的勒索数据勒索要求 ¶ 感谢 Erich Kron 备注：此图的大尺寸版本可以在 www.wiley.com/go/ransomwareprotectionplaybook\
  \ 下载。](img/c01f004.png)\n\n图 1.4 一份真实的勒索数据勒索要求 ¶ 感谢 Erich Kron\n\n注：此图的大尺寸版本可以在\
  \ [www.wiley.com/go/ransomwareprotectionplaybook](http://www.wiley.com/go/ransomwareprotectionplaybook)\
  \ 下载。\n\n这种数据外泄的新策略导致 `Maze` 能更频繁地拿到更多钱。很快，其他勒索软件组织看到 `Maze` 的成功后也纷纷效仿。在几个月内，`REvil/Sodinokibi`\
  \ 和 `Zeppelin` 开始使用这种策略。起只是一个勒索软件团伙使用这种策略，很快变成了大多数都在使用这种策略。到 2020 年底，超过 70% 的勒索攻击正在使用数据外泄作为主要策略；到\
  \ 2021 年第一季度，这一比例超过了 77%，而到 2021 年年中可能超过 80%（`https://www.coveware.com/blog/ransomware-attack-vectors-shift-as-new-software-vulnerability-exploits-abound`）。这意味着，你更有可能被一个在加密之前先外泄你的机密数据的勒索软件击中，而不是没有击中。许多媒体开始将这个新术语称为*双重勒索*。但情况比这糟糕得多。\n\
  \n勒索软件团伙意识到，他们厌倦了拿不到钱，因为有更多受害者拥有良好的备份；而且他们意识到勒索软件攻击者所拥有的“黄金”并不是加密文件的能力，而是对被入侵环境及其包含的所有内容的未经授权的访问。通过未经授权的访问，攻击者可以获得对网络的完全控制权、密码知识，以及访问所有关键数据和系统的权限。在操作上，他们可以窃取并执行被入侵系统能够做的一切。\n\
  \n除了窃取数据，勒索软件攻击者还在窃取公司、员工和客户的密码。过去，如果他们窃取密码，仅仅是为了帮助在同一网络中横向移动并利用同一网络中的更多机器。现在不再如此了。现在，从大约\
  \ 2019–2020 年开始，他们窃取密码的首要目标是利用这些密码来最大化他们的勒索压力，或者在额外的犯罪活动中实现利润最大化。\n\n勒索软件程序不再仅仅是时动作木马，它们会在某人的设备或网络上不被察觉地停留，时间从几小时到一年多不等。关于勒索软件平均停留时间，我在不同时期看到不同的数字，但我看到的常见统计数据是\
  \ 120 到 200 天之间。我知道很多公司的勒索软件在网络内部停留了一年或更久。我甚至有一个案例，勒索程序停留了三年多。\n\n现在的勒索软件不仅收集网络密码以便在网络中传播，还收集停留期间员工在系统或网站上使用的每一个密码。除了网络密码，这些程序还在获取系统和员工用于执行业务的网站和服务的密码，以及员工在个人网站上使用的所有密码。\n\
  \n\n\n\n\n一旦数据和密码被外泄，黑客就会联系原始受害组织的影响员工和客户，告诉他们黑客掌握了什么，并说道：“如果你不给我们付钱，我们就向整个世界公开你们的敏感信息、密码或个人记录！”他们经常告诉员工和客户，他们勒索他们的唯一理由是原始受害者公司没有付钱。这导致了声誉和信任问题，更不用说个人的情绪问题，而且如果被盗的凭据被发布并被黑客使用，可能会导致身份盗窃等敏感数据的进一步泄露。\n\
  \n在其中一个案例中（`https://krebsonsecurity.com/2021/04/ransom-gangs-emailing-victim-customers-for-leverage/`），RaceTrac\
  \ 便利店和加油站的客户遭到了了勒索。在另一个故事中（`https://healthitsecurity.com/news/hackers-demand-ransom-from-patients-after-breaching-florida-linic`），佛罗里达州一家整形外科中心的患者遭到了勒索软件黑客的勒索，黑客表示，如果患者不付款，他们的私人医疗信息（包括照片）将向公众发布。我读过的最糟糕的故事之一是\
  \ 2020 年芬兰赫尔辛基的一起勒索软件攻击（`https://www.wired.com/story/vastaamo-psychotherapy-patients-hack-data-breach/`）。入侵者窃取了数万心理健康患者的个人数据。三万名老患者收到了个人勒索要求，数百个极具情绪化的私密故事被公开。至少有几位老患者描述自己由于个人信息的泄露，他们几乎想要自杀。\n\
  \n勒索软件团伙还在向原始受害者的员工和客户勒索资金，造成了巨大的声誉问题。即使受害者的员工和客户没有直接被勒索钱，勒索软件黑客也会确保员工和客户意识到他们的信息在自己的控制之下，发出威胁，并确保客户和员工知道该怪谁。图\
  \ 1.5 显示了勒索软件攻击者使用的狡诈且情绪化的信息示例，这旨在让原始受害者难堪并造成声誉损害。\n\n![图 1.5 普通网页上的真实世界勒索要求 ¶ 注意：可以在\
  \ www.wiley.com/go/ransomwareprotectionplaybook 下载此图的大尺寸。](img/c01f005.png)\n\n\
  图 1.5 普通网页上的真实世界勒索要求 ¶ 注意：可以在 [www.wiley.com/go/ransomwareprotectionplaybook](http://www.wiley.com/go/ransomwareprotectionplaybook)\
  \ 下载此图的大尺寸。\n\n勒索软件黑客将此警告放置在受害者网站的首页上，以便任何访问该网站的客户都能看到发生了什么。随后，他们又创建了一个额外的关联域名，该域名涉及受害者的原始网站名称，并添加了“extortion（勒索）”一词，同时开启了同名的电子邮箱，以便员工和客户与他们联系。他们将此警告放在受害者的真实网站上，也放在了他们创建的新网站上，这样当原始网站被关闭或清理时，人们仍然知道如何查看倒计时追踪器的进度。无论受害者是否支付勒索金，声誉损害已经造成。\n\
  \n当黑客在受害者系统内部时，他们还会阅读邮件并了解受害者与其他供应商及信赖伙伴之间的业务关系。黑客可以利用这些信息发送针对性网络钓鱼邮件，要求业务合作伙伴打开恶意文档或运行木马程序。新的受害者收到了来自原始受害者的邮件，而他们是信任对方并与其保持着业务关系的。他们不理解为什么他们信任的人突然要求他们打开某些随机的新文档或文件，但许多人并没有进一步犹豫就打开了。砰！他们现在也成了新的勒索软件受害者，并且可能会将部分归咎于上游信赖伙伴（当然，还有勒索软件团伙）。\n\
  \n勒索软件黑客还会公开宣传他们入侵了哪些地方（如图 1.4 和 1.5 所示），以对受害组织施加最大压力，迫使其尽快解决。如果受害者希望勒索软件攻击不会泄露给媒体以保持沉默，那就没门了！黑客经常充当自己的恶意公关（PR）公司，向媒体发送最新的泄露证据。当我担任\
  \ InfoWorld 和 CSO Online 杂志的周刊安全专栏作家（近 15 年）时，我在 2019 年后期经常收到勒索软件团伙的联系，试图看我是否会宣传他们最新的重大勒索方案。我记得曾与杂志母公司的总编辑开过会议，因为我们都决定不想成为勒索软件团伙的间接公关代理。看起来当他们开始建立自己的网站专门展示最新的入侵情况时，遭到了其他新闻来源的抵抗。\n\
  \n最后，在经历了这一切之后，如果受害者仍在为是否支付勒索金而争论，黑客将尽一切努力让受害者付款。一种变得越来越常见的策略是，如果受害者拥有未受原始勒索事件影响的二级站点，他们就会发动大规模的分布式拒绝服务（`DDoS`）攻击。也许勒索软件只关掉了受害者的公司网络，但没有影响托管在其他地方的公共\
  \ Web 服务器。黑客也可以关闭这些服务器，试图造成尽可能的痛苦和痛苦来获取钱款。总结来说，目前大多数勒索软件的行为如下：\n\n*   加密数据\n*  \
  \ 外泄邮件、数据、机密信息、IP 地址，如果不付款，则将其公开或交给黑客、暗网或公共互联网\n*   窃公司、员工和客户的登录凭据\n*   勒索员工和客户\n\
  *   利用受害者的电脑，通过真实的邮箱地址对业务伙伴进行针对性网络钓鱼\n*   对受害者仍在运行的所有服务发动 `DDoS` 攻击\n*   公开羞辱受害者公司\n\
  \n这是一个七重打击的问题。如果你运气好，只面临五重打击的问题。因此，当我看到“双重勒索”这一术语被用来描述如今的勒索软件时，我想的是：“我希望那就是全部！”\n\
  \n### *勒索软件即服务*\n\n\n\n\n\n`Ransomware as a service` (RaaS) 是对最新云端术语（例如 `SaaS`、`IaaS`\
  \ 等）的一种戏称，但它确实是一个真实存在的东西。传统的勒索软件是按照预设指令运行的自动化程序。即使在早期，没有任何黑客技巧的黑客或其他坏分子也可以购买并使用勒索软件程序。这些勒索软件通常需要像任何软件程序一样进行更新，以包含最新的漏洞、Bug\
  \ 修复和新功能。软件更新对于合法用户和勒索软件犯罪分子来说都是件苦事。许多勒索软件已经开始自动更新。在渗透受害者计算机后，它们每天会检查几十次，查看是否有新版本或其他需要下载的恶意软件。\n\
  \n勒索软件创建者决定，既然微软、谷歌、Salesforce 等可以提供云端软件，他们也可以。因此，从几年前开始，一些勒索软件团伙开始提供类似于云端服务的勒索软件。它在广义上并不是真正的云端，但其行为确实开始变得越来越像云端。\n\
  \n传统的勒索软件可以通过一次性费用购买，或者可能支付一次性升级费用。这种初次费用范围从数百美元到数万美元不等，取决于勒索软件开发者和团伙。RaaS 不需要昂贵的初次费用。相反，“附属成员”订阅勒索软件服务并可以使用该勒索软件程序，但他们需要每次入侵支付固定费用，或按勒索金总额的比例付费。附属成员支付给勒索软件提供者的百分比范围可以从几个百分点到几十百分比（例如\
  \ 30%）。RaaS 供应商之间为了提供较低的附属费用而竞争激烈，这样附属成员就能保留更多勒索金。相反，更好的勒索软件程序可以索取附属成员更多的勒索金，因为它们提供了更成功（对攻击者而言）的勒索软件。即使附属成员支付了更高比例的收益，他们的总收益仍然比选择低成本供应商要多。这是一篇关于\
  \ RaaS 基础知识的好文章：`https://www.upguard.com/blog/what-is-ransomware-as-a-service`。\n\
  \n一些 RaaS 供应商对其附属成员制定了“规则”，指导其部分活动，并可以对其行为不当或给 RaaS 供应商带来不合理风险的行为进行惩罚。当一个 Darkside\
  \ 勒索软件附属成员入侵了殖民管道（Colonial Pipeline）时发生了这种情况，导致了美国的燃气供应问题。这些问题最终迫使美国司法部、联邦调查局、中央情报局、国家安全局甚至拜总统介入。这意味着“不受欢迎的关注”。RaaS\
  \ 供应商实际上发表了多次声明，对其附属成员的行为和目标选择表示道歉。提供者特意表示他们已经“解雇”了该附属成员，并更改了附属许可，以确保类似殖民管道的攻击不再发生。这是一次非常寻常的道歉和公共公关活动。\n\
  \n不同类型的勒索软件之间还有更多差异，但这些主要的类型差异让读者对不同类型的程序有了良好的初步了解。\n\n## 典型的勒索软件流程和组件\n\n由于有许多不同类型的勒索软件程序，并没有一种完美可重复的标准勒索软件流程。正如前面提到的，至少，勒索软件会以某种方式入侵，利用一台或多台计算机，可能完成不同的附加载荷，加密文件并显示勒索通知。自动化勒索软件程序这样做。人类引导的勒索软件团伙也这样做。勒索软件服务也这样做。但它们的操作方式与其他者截然不同。然而，考虑到所有可能的排列，有一些版本正变得流行并描勒出一幅共同的画面。第一章的这部分将描述最常见的勒索软件流程。\n\
  \n### 渗透\n\n所有勒索软件的第一步都是以某种方式获取受害者（第一台）设备的初始“立足点”访问权限，无论如何实现。大多数情况下，这是由于社会工程学导致的，通常是因为受害者收到了一封钓鱼邮件，要求用户打开附件文档、执行文件或点击嵌入链接。或者用户在访问网站时被欺骗，该网站随后显示恶意链接或弹出窗口。无论何种情况，用户都被诱骗点击了某些内容并启动了初始恶意程序。\n\
  \n另一种是受害者环境中的某些东西可能包含黑客利用的未修补软件漏洞。大多数情况下是未修补的客户端软件，用户访问一个受感染的网站——仅仅是访问包含恶意 `JavaScript`\
  \ 的恶意网页，就会在无形中感染用户的计算机。这被称为“静默驱动下载”（`silent-drive-by` download）。有时会在面向互联网的服务器上发现未修补的软件。我听过所有可能类型的缺失软件，例如未修补的\
  \ VPN 服务器（`https://arstechnica.com/information-technology/2020/01/unpatched-vpn-makes-travelex-latest-victim-of-revil-ransomware/`）导致\
  \ Travelex 陷落，以及针对未修补的 Microsoft Exchange 服务器的勒索软件（`https://siliconangle.com/2021/05/31/new-epsilon-red-ransomware-targeting-unpatched-microsoft-exchange-servers/`），后者是由一个无关的国家级攻击领导的。未修补软件是普通黑客攻击恶意入侵的第二常见原因，尽管对于勒索软件来说并不总是如此（尽管它仍然是首要原因）。\n\
  \n勒索软件进入系统的另一种常见方法是对互联网可访问的登录门户和应用程序接口（`APIs`）进行密码破解。到目前为止，攻击者或恶意软件最常用的软件是微软的远程桌面协议（`RDP`）实例。正如在第第\
  \ 2 章](#c02.xhtml)“防止勒索软件”中详细提到的，根据某些调查，世界上有一半的勒索软件利用对 `RDP` 的密码破解来入侵受害者，包括勒索软件程序：`CrySiS`、`Dharma`、`Maze`\
  \ 和 `SamSam`。要明确的是，密码破解攻击仅对密码非常糟糕或允许无限登录且从不锁定用户账户的 `RDP` 登录有效（这是一个重大的安全失败）。通常情况下，`RDP`\
  \ 密码破解并非内置在恶意程序中，而是由黑客使用另一种密码破解工具来寻求在受害者网络中的初始立足点。随后在成功破解密码并获得访问后，黑客上传并执行勒索软件程序。\n\
  \nCoveware (`https://www.coveware.com/blog/ransomware-attack-vectors-shift-as-new-software-vulnerability-exploits-abound`)\
  \ 经常将 `RDP` 显示为主要的初始访问攻击向量，但在没有相关细节的情况下，由于是否包含未修补的 `RDP`（这也是初始利用的主要原因之一）或仅是 `RDP`\
  \ 密码破解攻击。除了 Coveware 外，没有其他来源显示 `RDP` 攻击百分比如此高。但它指出，如果不正确安全保护，`RDP` 将构成严重风险。\n\n\
  还有其他较小百分比的根因，如 USB 密钥感染和内部攻击，但上述三个问题（即社会工程学、未修补软件和密码破解）是勒索软件进入受害者组织最流行的方式，其他方式远在其其后。\n\
  \n### 初始执行后\n\n\n\n\n\n请记住，在大多数勒索软件场景中，实际执行加密的程序尚未安装。用于入侵受害者的首个恶意程序是专为该目的设计的。我们将这种恶意程序称为\
  \ `stub`（存根/负载）恶意程序或 `downloader`（下载器），有时简写为 `loader`（加载器）。它通常只是在受感染的设备上建立自身，使其能够在重启或关机后自动重新启动，并为受感染的系统提供访问权限，以便进行额外的攻击。\n\
  \n在 Microsoft Windows 系统上，这通常意味着 `loader` 修改了微软创建的几十个功能中的任何一个，这些功能允许在重启或上电事件后自动执行代码。最常用的修改区域包括注册表、计划任务或恶意服务。在\
  \ Windows 系统上，至少有十几个地方可以被勒索软件修改，用以实现在重启后自动执行。`stub` 程序的首要任务是在获取到初始立足点权限后继续执行。\n\n\
  ## 回拨程序（Dial-Home）\n\n大多数情况下，`stub` 文件会收集关于其宿主环境的少量信息，足以让攻击者唯一地识别它，加上勒索软件操作者想要收集的任何内容，然后连接到其控制服务器。这些控制服务器/服务被称为\
  \ `command-and-control`（命令与控制）服务器，或 `C&C` 或 `C2` 服务器。`C&C` 服务器通常只是另一个恶意程序，等待 `stub`\
  \ 文件或勒索软件“机器人”连接到它们。它们可以托管在互联网上任何可访问的地方。它们通常运行在某个被攻破的计算机或多台被攻破的计算机上，以确保勒索软件网络的韧性。全球可能有数百人正在抱怨他们的\
  \ PC 运行有多慢，却不知道他们的电脑正托管着数百甚至数千个正在“回拨”的 `stub` 和勒索软件程序。勒索软件开发者通常会在互联网上的不同地点设置至少两个不同的\
  \ `C&C` 服务以实现冗余，但通常远不止。他们需要额外的 `C&C` 服务器，以便在其中一个或多个服务器被反病毒软件或威胁猎人拔掉时，至少仍有一个存活并保持控制。\n\
  \n`stub` 程序向 `C&C` 请求的首要事项之一是：何时、何地以及如何下次等待，直到再次连接到 `C&C` 服务器。这是因为 `C&C` 服务每隔几小时到几天就会在各个宿主之间切换移动，永远不会停留在一个地方太久。托管\
  \ `C&C` 服务的 IP 地址会随其 DNS 名称发生变化。DNS 名称通常是短命的动态 DNS 域名。它们的设计通常只能持续几小时到几天，然后过期。`stub`\
  \ 恶意程序会询问下次应该连接到哪个或哪些新的动态 DNS 域名。通常会有有多个 DNS 名称，每个名称都挂载在一个或多个 IP 地址上，并且不断变化。这种防御性的花招让防御者难以找到并关闭勒索软件的\
  \ `C&C` 服务器。威胁猎人通常会嗅探主动发起连接的勒索软件程序产生的流量，以了解 `C&C` 服务目前位于何处以及下一个地址是什么。\n\n为了帮助防止防御者轻易检测到勒索软件的外站恶意流量，约一半的恶意程序使用传输层安全（`TLS`）加密（`https://news.sophos.com/en-us/2021/04/21/nearly-half-of-malware-now-use-tls-to-conceal-communications/`）通过端口\
  \ `443` 对其 `C&C` 服务器的外站连接进行隧道处理，这一数字随着时间的推移正在稳步上升。这样做是为了使其流量难以被“嗅探”（即记录和审查）。而且端口\
  \ `443` 几乎被任何检测防火墙允许出站。在使用 `TLS` 连接到 `C&C` 服务器的恶意程序中，勒索软件占了连接的 90% 以上。因此，如果你发现自己的电脑出现了一个发往互联网上某个无法解释的奇怪地点的意外\
  \ `TLS` 连接，那么调查一下并无害。\n\n如果它们不使用 `TLS` 连接，它们通常会伪装成某些被允许的外站“无害”网络流量，例如域名系统（`DNS`）。`DNS`\
  \ 数据包具有相当标准的外观和特征。恶意软件和勒索软件会创建伪造的 `DNS` 数据包，将命令作为虚假数据或 `DNS` 查询插入其中，这些看起来像是发送到 `DNS`\
  \ 服务器的普通 `DNS` 请求。任何看到虚假 `DNS` 流量且没有预期其是由恶意软件创建的人，除非打开 `DNS` 数据包并仔细查看细节，否则很难快速发现任何异常异常。恶意软件和勒索软件还会使用其他如\
  \ `8080` 和 `1433` (Microsoft SQL) 等常用端口。\n\n另一种勒索软件技巧是使用普通且深受信任的第三方产品和服务进行通信。例如，勒索软件程序可能会使用\
  \ Google WorkSpaces、Google Docs、Amazon Workspaces、Telegram（https://www.bleepingcomputer.com/news/security/telecrypt-ransomware-uses-telegram-as-candc-server/）、Discord、Pastebin\
  \ 等进行通信，或作为其 `C&C` 服务器以规避轻易检测。\n\n基本上，勒索软件开发者经常使用大多数防火墙允许的网络端口或服务，并伪装成合法流量。使用第三方的应用程序或平台具有几个额外优点，包括信息通常默认加密的，且中心化部分健壮、可扩展，并被大多数信誉过滤器信任。反恶意软件信誉服务很难区分使用\
  \ Google Docs 的合法用户和执行相同操作的恶意程序。勒索软件开发者不断开发新的创新的方式进行通信。使用这种混淆方法的勒索软件特别难以检测，并且成功率更高。\n\
  \n## 自动更新（Auto-Update）\n\n通常，勒索软件程序的下一步是更新自身为新版本，并下载一个或多个额外的恶意程序。大多数勒索软件都不会被检测到。\n\
  \n\n\n\n勒索软件程序并没有发生剧烈的变化。通常情况下，它们只是在运行过程中使用不同的加密密钥对自身进行重新加密，这使得每一份副本与上一个都不同，至少在加密状态下如此。随着不同的杀毒软件开始能够更好地检测这些不同的副本，恶意程序会重命名并重新排列子程序，并插入大量的随机垃圾代码，以使检查和反汇变得变得困难。最终，即使是这些“多态”变化也会被杀毒厂商破解，随后勒索软件开发者就会引入一个完全不同的、更新后的版本。这真的让我想起了一种数字版的犯罪版“打鼠”游戏。\n\
  \n如今，“存根文件”（stub file）通常只是一组脚本，例如 Microsoft PowerShell 脚本。可以参考文章 `https://www.acronis.com/en-us/blog/posts/suncrypt-adopts-attacking-techniques-netwalker-and-maze-ransomware`。这是因为脚本更容易修改，而且作为恶意软件被检测要困难得多。恶意脚本可以执行普通可执行程序能做的几乎任何操作，包括编译、下载和执行其他可执行程序。大多数脚本在运行时会创建其他恶意可执行文件，本质上是利用脚本将恶意软件绕过任何爱管的防火墙或入侵检测扫描器。\n\
  \n在这一过程的某个点，如果使用了存根文件，它会被主勒索软件程序取代。它的行为基本上与存根程序一样，会频繁检查 C&C（命令与控制）服务器、执行自动更新等。但它的自动化代码可能包含诸如操作：寻找并窃取密码、寻找并外泄特定类型的数据、使用网络密码移动到其他机器等。存根程序与非存根版本的主要区别在于，这种更永久性的程序体积更大，功能也得多。\n\
  \n### 检查位置\n\n绝大多数勒索软件会在初始执行期间或执行后不久，检查被其攻破的系统上安装并运行了哪些编写语言。这是因为大多数恶意程序不想利用或损害其母国或其母国紧密盟友的系统。这样做更容易导致当地被捕和/或引发政治问题。大多数主流勒索软件开发者与其母国之间有一项默契协议，即不在那里进行感染。避免感染本国公民，加之一些金钱贿赂，通常足以让勒索软件集团维持业务运营，而不会引起执法部门或政府试图关闭它们。\n\
  \n例如，许多（如果不是大多数）勒索软件来自俄罗斯。因此，当所有基于俄罗斯的勒索软件启动时，它们会检查是否存在俄罗斯及其邻近盟友使用的常用语言。这些语言包括俄语、阿塞拜语、吉尔吉斯语、哈萨克语、土库曼语、乌克兰语、鞑语、乌兹别克语和塞尔维亚语。如果俄罗斯勒索软件检测到这些语言，它就会退出并自我删除。一些防御者建议尽可能在计算机上将俄语设置为第二语言，以防止许多勒索软件引发问题。这是一种原始防御，但通常有效。\n\
  \n### 自动负载\n\n如果勒索软件具有任何自动负载（例如加密文件和显示赎金），它们通常会在生命周期的这个阶段发生。但明确的是，这通常发生在恶意程序最初入侵后的几秒钟内。我见过存根文件侵入、获取持续访问权限、窃取密码、将密码发送到\
  \ C&C 服务器、更新自身、下载并安装新程序，然后在 15 秒内开始加密文件。这是自动化代码，如果这是它程序设定的任务，并不会花费长时间。如果自动负载没有触发，勒索软件程序就会等待，偶尔唤醒并向\
  \ C&C 服务器拨号以获取最新更新。\n\n### 等待\n\n在此期间，许多勒索软件拥有最长的“驻留”时间（dwell times）。它们已经入侵了受害者并处于“坐以待毙”模式。攻击者要么尚未获知相关的入侵情况，要么正忙于进行另一个攻击，或者干脆在等待。\n\
  \n### 黑客检查 C&C\n\n在路径的某个点，如果勒索软件尚未触发最终加密负载（在原始入侵事件后几小时到几年内），黑客会检查 C&C 服务器以查看恶意软件报告了什么。有时他们只有\
  \ IP 地址，需要进行自己的研究。其他时候，勒索软件会报告它们正在等待的域名。\n\n勒索软件管理员控制台通常是运行在受害计算机上的某些 Web 服务器。此外，控制台通常会报告统计数据，例如发生了多少次利用、攻破了哪些计算机平台、受害者所在的国家、域名、哪些漏洞被利用来攻破受害者等。\n\
  \n### 使用更多工具\n\n自动化恶意软件和人工引导的勒索软件经常会将额外的攻击工具拷贝到受害者设备上。这些工具被用于了解更多入侵环境、在网络中横向移动，以及搜索并外泄电子邮件、密码和数据。\n\
  \n常用的攻击工具包括自定义脚本、自定义攻击工具、商业攻击工具（例如 `Cobalt Strike`, `Metasploit`）、`Mimikatz`、`Empire\
  \ PowerShell Toolkit`、`Trickbot` 以及 Microsoft `PsExec`。攻击者会禁用防御、收集凭据、禁用发现的所有备份，并安装其他恶意软件和脚本。大多数勒索软件正放弃使用已知攻击工具，尽可能使用脚本。脚本更难以被拦截和检测为恶意。\n\
  \n### 侦察\n\n某些勒索软件获得初始立足点后立即开始加密。有些尝试在几小时内利用并加密尽可能多的计算机。其他的允许黑客访问环境并进行探索，花费几天、几周、几个月甚至几年时间环境中环境中。他们会开始在环境中徘荡、读取电子邮件、查看应用程序和数据库，基本上试图了解受害者的“核心资产”和痛点。他们想要要么窃取核心资产，要么确定需要加密哪些内容以造成最大的运营痛苦。\n\
  \n他们会监控高管的电子邮件，以了解高管最关心什么、汇报结构是怎样的、机构赚了或拥有多少钱，甚至受害者是否有涵盖勒索软件的网络保险政策。这种情况发生得足够，以至于勒索软件防御者现在建议客户确保其网络保险保单不在勒索攻击者可以找到的网络上。\n\
  \n\n\n\n如果其他机会出现，黑客会利用这些机会。例如，他们可能会遇到受害者公司应收账款员与另一家公司应付账款员之间的邮件。他们可能会利用这种关系及其信任来入侵应付账款员所在的公司，或者为下一张发单发送虚假的汇款指令。当人类攻击者参与攻击时，他们能够并且将会根据发展的状况改变计划，试图使其潜在收益最大化。\n\
  \n一些勒索软件团伙收到的付费是为了明确针对某些公司和/或寻找特定类型的数据（例如：知识产权、计划，甚至是大多数人不会认为会被寻求的内容，如贷款条款）。有时攻击者是为受害者的竞争对手工作，试图获取项目细节和成本。在其他时候，他们正在为自己的政府盗取代隐形轰炸机的机密工程图。\n\
  \n## 准备加密\n\n在生命周后期，勒索软件程序或攻击者将使用一个或多个加密密钥定位并准备加密程序。如果勒索软件感染了多台机器，它们将尝试一次性加密尽可能多的机器。有时受害者运气不错，发现了第一台或前几台计算机正在加密，并能够在这些机器被加密之前关闭其余潜在的受害者机器。多达\
  \ 25%的勒索软件加密尝试在启动或完成之前被中断。这个数字看起来很高，因为你很少听说过有人在勒索软件启动之前就中断了它。我确实听过。我确实知道成功案例，但并不多。我想我们没有听到这么多消息的原因是，如果勒索软件的加密过程被阻止或中断，它通常不会变成一个大事件，不需要支付赎金并将其作为数据泄露进行报告。\n\
  \n如果涉及多台被感染的计算机，攻击者通常会使用多个加密密钥，每台计算机或文件都不同。这主要是因为攻击者希望能够解锁至少一台计算机或文件，以证明他们控制了勒索软件并拥有解密密钥。通过获得解密密钥，受害者可以确认它确实可以解锁数据。这被称为`proof\
  \ of control`。勒索软件团伙通常会要求支付一小笔赎金，“作为双方信任的证明”，以释放样本解密密钥。如果你打算支付赎金获取解密密钥，这种安排对双方都有利。受害者确保他们没有为无效的东西付费，而勒索软件团伙在证明解密确实有效后，可以尝试为解决方案收取更多费用。在没有测试解密密钥和过程有效之前，绝不要支付全部赎金。\n\
  \n## 数据外泄\n\n绝大多数勒索软件程序在启动加密之前都会外泄数据（例如：数据库文件、密码、电子邮件等）。黑客通常会在深夜关闭数据库和电子邮件服务以进行复制。监控深夜出现意外服务关闭的迹象是检测可疑活动发生的好方法。\n\
  \n外泄这些数据的攻击者通常会将其复制到环境内的其他服务器上，作为本地暂存服务器，收集大量的（即数 GB）归档文件（例如：`TAR`、`ZIP`、`GZIP`、`ARC`等）。在你的网络中发现意料之外、无法解释的大堆加密文件不是好征兆。\n\
  \n外泄这些数据的攻击者通常会将其复制到环境内的其他服务器上，作为本地暂存服务器，收集大量的（即数 GB）归档文件（例如：`TAR`、`ZIP`、`GZIP`、`ARC`等）。在你的网络中发现意料之外、无法解释的大堆加密文件不是好征兆。\n\
  \n## 加密\n\n除少数情况外，加密在某一点开始。某些勒索软件程序加密所有文件。其他的，如 Cerber 和 Locky，会搜索特定类型的文档。另一些，如\
  \ Petya，只加密系统表。某些勒索软件程序寻找并加密本地文件。\n\n不同的勒索软件程序使用不同类型的加密，尽管通常是标准的。大多数同时同时非对称和对称加密。许多勒索软件程序使用更流行的`AES`加密算法，但`ChaCha20`非常强大且速度快很多倍。加密速度非常重要。加密过程如下：\n\
  \n1. 勒索软件程序生成一个或多个非对称公/私钥对和一个或多个对称密钥。\n2. 使用对称密钥加密数据，并在完成后永久删除明文版本。\n3. 对称密钥将用非对称公钥加密，然后删除明文版本。\n\
  4. 非对称私钥将发送到勒索软件服务器，等待进一步指令。\n\n例如，Maze 勒索软件团伙使用 2048 位密钥的`RSA`或`ChaCha20`。由著名的计算机安全教授\
  \ Daniel J. Bernstein 创建。他精通此道，是世界上顶级的密码学家之一。他并不是为勒索软件创建`ChaCha20`的，但勒索软件团伙见到好东西就知道。你无法破解它。Petya\
  \ 勒索软件使用椭圆曲线密码学（`ECDH`）和`SALSA20`，另一种由 D.J. Bernstein 创建的早期对称算法。\n\n## 勒索要求\n\n\
  所有勒索软件程序都会到处留下一些文本文件、在屏幕上显示消息或发送电子邮件。可能是屏幕上的一个显示勒索软件通知和勒索要求的文本文件，也是一堆文本文件，每个文件夹和目录一个，显示基本上相同的消息。以下是一些涉及勒索软件的文件名示例：\n\
  \n* Locky 勒索软件显示 `HELP_instructions.bmp` 和 `_HELP_instructions.html`。\n* Torrent\
  \ 勒索软件对所有加密文件加上 `.encryption` 后缀名，并带有一个 `PLEASE_READ.txt` 通知文件。\n\n\n\n\n\n*   `Dharma`\
  \ 勒索软件会对所有加密文件添加 `.onion` 扩展名，并显示 `FILES_ENCRYPTED.txt`。\n\n此链接显示了各种勒索软件程序在加密文件中使用的几十常见文件扩展名：`https://techviral.net/ransomware-encrypted-file-extensions/`。\n\
  \n## 谈判\n\n受害者会被告知如何通过电子邮件、Skype 或其他在线通信方式联系勒索犯罪分子。通常情况下，勒索犯罪分子会在其赎金通知中列出一个识别编号，在初始通信中必须包含该编号。这样做是为了让勒索犯罪分子知道是谁在联系他们，以及如何识别哪一个加密公钥属于联系他们的受害者。某些勒索通知会显示一个必须支付的固定金额。这通常会以美元或比特币（`BTC`）的形式列出。直接行动型变体倾向于固定金额。许多其他勒索软件程序不会说明索要赎金金额，而要求受害者与他们联系。只有在收到联系后，勒索团伙才会给出一个数字，这是因为他们会对能从受害者那里获得多少钱进行研究。通常，勒索通知会包含一个以天为单位期限，以给受害者紧迫感。\n\
  \n在许多情况下，勒索团伙会给出一个他们希望作为勒索金的高额估计值。在计划支付的人中，有些人会支付最初要求的金额。大多数人会尝试协商一个较低的金额。少数人会提供低得多的金额作为反要价。有些人这样做是因为他们确实没有那么多钱来支付赎金。另一些人是在虚张声势。还有人是因为自尊心或其他原因，不会按照请求的金额进行支付。大多数勒索团伙会考虑合理的反要价，并同意接受低于原始请求金额的金额。\n\
  \n我曾见过勒索团伙因受害者最初的反要价金额而感到被侮辱，随后将赎金增加到远高于原始请求的金额。我曾见过勒索团伙直接告诉受害者他们不会提供解密密钥并切断所有通信。我曾见过勒索团伙继续对受害者进一步攻击，造成额外损害（例如：数据外泄、`DDoS`、泄密威胁、将数据泄露给竞争对手的威胁等）。如果受害者不打算支付或提供极其离谱的反要价，最常见的勒索谈判回击是：勒索团伙拥有受害者的数据，他们计划在不支付合理赎金的情况下，将其发布给其他黑客、暗网、他们的竞争对手或公共互联网。在宣布数据外泄的威胁后，他们会要求与原始请求相同的金额，甚至更高。我曾见过勒索组织在宣布数据外泄威胁后索要双于原始金额的金额。通常还会就获得额外的支付时间进行谈判。大多数勒索组织会额外提供几天。初始谈判设定了赎金和勒索软件支付的整体基调。\n\
  \n## 提供解密密钥\n\n如果支付了赎金，勒索组织将提供一个或多个可以进行解密的解密密钥。\n\n\n\n\n当我第一次看到这张图表时，我大震惊了。这绝不是一个在地下室运行恶意软件的业余爱好者。而是一个拥有大量资源的专业人士，设计了一个完全冗余、韧性强且深思熟虑的网络。他拥有代理服务器、活动服务器、管理门户、客户服务、数据中心，甚至还有许可证验证系统。这是一个在设计和交付大规模冗余网络方面受过专业训练的人。他可以进入任何大公司申请\
  \ IT 总监职位并完全胜任。他很可能曾在世界上某个地方的大型合法公司工作过，并且表现出色。当我看到这张图表时，我意识到计算机安全防御者所面对的敌人比我们过去几十年想象的要复杂得多。\n\
  \n这种局面在 2021 年 5 月再次变为现实，当时名为 `Darkside` 的勒索软件小组首领因攻击美国天然气管道供应商 `Colonial Pipeline`\
  \ 登上新闻。正如之前提到的，`Darkside` 的发言人在其小组网站（`https://www.abc.net.au/news/2021-05-11/darkside-says-aim-financial-gain-not-political-disruption`）上发表了一接接声明。由于对\
  \ `Colonial Pipeline` 造成的意外影响，该小组道歉了，并表示他们正在采取措施应对美国能源部门的政治和情报机构反应。尽管声明中充斥着拼写错误，发言人表示，他们的目标是财务利益而非政治扰乱。他们说，他们的勒索软件开发允许合作伙伴黑客租赁并获取访问权限。这种“勒索软件即服务”（Ransomware-as-a-Service）平台让我意识到这是合理的，因为大型勒索软件集团比其他任何结构都更接近公司化。\n\
  \n我听到另一个勒索软件公司的首席执行官在广播电视节目中接受采访。他谈到了运行类似微软的勒索软件公司。他显然对自己的产品非常自豪，吹夸了其功能 set、强大的合作伙伴关系、易用性以及让客户满意度。当记者询问另一个勒索软件小组的分离的说法是否属实时，他忽略了这个问题。“竞争对大家都是好事，”他继续道，“只要等我们的下一个版本发布出来！我们有信心可以击败竞争对手并扩大客户群。”\n\
  \n我简直无法相信我所听到的这些。我可能一直在听那些关于微软计算机的访问权限问题。许多被入侵的组织的勒索软件首领正在被专业化运营。目前，全球范围内至少有成千上万的公司和组织被入侵了，他们非法获得的访问权限正等待卖给出价最高者，而他们对此并不知情。为了赚更多钱，这种类型的攻击者获取初始访问权限让那些在地下室里作案的犯罪分子更容易对付。\n\
  \n## 勒索软件行业组成部分\n\n当我说“公司化”时，我指的是什么呢？除了他们拥有专业运营的组织、不同部门、高管外，我说的是一种现代供应链结构。今天的勒索软件公司只是整个基础设施的一部分。你拥有控制特定勒索软件开发和许可的主公司，开发人员可能是内部的，也可能是外聘顾问。还有网络人员、加密货币人员、Web\
  \ 开发以及技术支持人员。总体而言，主勒索软件公司创建程序并向其合作伙伴发布程序。合作伙伴是经过审核后租赁勒索软件并利用其攻击受害者的人，这些人会将非法收益的一定比例支付给主勒索软件公司。\n\
  \n还有一些获取各种组织初始访问权限，然后在暗网论坛出售这些权限的小组。被入侵的受害者公司可以对他们做任何事情，如果他们想传播恶意软件的话。相反，他们的角色是获取公司的访问权限，然后卖给出价最高者。拥有更多数据和资源且更难防御的大公司成本更高。对于访问提供者来说，这是低风险中等回报。他们按任务获得的财富并不多，但他们通过数量来弥补。这也是为什么许多勒索软件程序具有延长的停留时间（dwell\
  \ times）。入侵并获取初始立脚点的人与最终利用被入侵组织的人不是同一种。\n\n这类攻击者通过发送数十亿封社交工程邮件、入侵网站放置 Web 漏洞工具包、寻找未打补丁的软件、筛选暗网上的密码泄露以及针对\
  \ `API` 进行撞库攻击（credential stuffing attacks）来获取初始访问。有些黑客小组只负责向世界最大的公司和勒索合作伙伴出售密码访问。在专业领域，我们可能称这些为“线索生成”（lead\
  \ gen）。\n\n所有这些恶意软件供应侧集团相互竞争，试图实现利润最大化。主勒索软件公司不断创新其产品并添加功能。他们提供 24/7 的技术支持，甚至提供后端比特币兑换服务以帮助将加密货币转换为硬货币（当然要收取费用）。\n\
  \n如果你是一个攻击者，并担心你的非法比特币交易被追溯到你身上，那么，他们也有这种服务……只需花钱。事实证明，比特币区块链追踪每笔交易的十分之一以及发送者和接收者是可以被操纵的。攻击者拥有服务提供商，其工作就是让他们的比特币交易更加不透明且更难以追踪。只需让你的勒索软件将比特币发送到这一个中央比特币结算钱包地址。在那里，首领会将你收集的比特币与许多其他人的收集比特币混合、切分，然后将洗净后的比特币发回你另一侧的比特币地址。除非执法部门能够进入比特币洗钱者的数字钱包，否则他们无法看到钱流向了哪里。这类比特币服务被称为\
  \ `laundries`（清洗器）或 `mixers`（混合器）。\n\n甚至在线市场，上面有不同勒索软件小组、合作伙伴和服务提供者的博客和评论，这有点类似于你在亚马逊上看到的星级排名客户评论。如果一个勒索软件供应商获得了糟糕的一星差评，他们会提供额外的许可证、临时降低合作伙伴费用或提供更多技术支持手手式服务——一切只为了留住客户并扩大销售基础。\n\
  \n\n\n\n现在有一整套其他的辅助角色、职位和组织参与到传播勒索软件和收集资金中。有人帮助支付贿赂。有人帮助逃避税款。有解决者。还有薪资部门、休假申请部门和人力资源部门。有人负责筛选在线简历并面试潜在的开发者。这是一门大生意。它看起来比其他任何东西都像一家多级营销公司。我们谈论的不是拥有成千上万员工的巨型集团公司。不，最大的勒索软件小组规模以几十人计算。但这是数百个不同的勒索软件小组以及一个整个由从世界大部分地区窃取资金驱动的竞争生态系统。有人曾告诉我，勒索软件行业是俄罗斯仅次于石油的第二大产业。这意味着它对国家的经济、收入增长和税基至关重要。由于涉及大量的资金和重要人物，每个人都分一杯羹，因此在被强迫之前，它绝不会消失。在垃圾邮件蠕虫和僵尸时代，我曾说网络犯罪已经专业化了。然后随着规模的扩大，我说它已经公司化了。如今，我认为没有其他词能描述它了，除了它已经财团化了。\n\
  \n我不想以悲观和阴暗结束这一章，但现在的情况确实非常糟糕。勒索软件每年赚取数十亿到数百亿美元，如果不采取任何措施，许多人预测勒索软件将在未来十年内造成数千百亿美元的损失。\n\
  \n但仍有希望。勒索软件最终会被击败。本书的其他所有章节都致力于这一目标，从第 2 章“预防勒索软件”开始。第 2 章将告诉你你和你的组织个人可以做什么，来显著降低遭受勒索软件攻击成功的风险。\n\
  \n## 总结\n\n本章涵盖了勒索软件行业、其运作机制、问题的严重性，以及不同类型的勒索软件和生命周期流程。第 2 章讨论了如何从源上防止勒索软件成功。\n\n\
  WileyPRE\n\n# 第 2 章：预防勒索软件\n\n预防应该是所有防御者的首要缓解策略。本章重点关注你作为防御者，如何防止勒索软件从源上获得访问权限。这是书中最重要的的一章。\n\
  \n## 接管前的 19 分钟\n\n一旦任何黑客或恶意软件获取了设备或环境的初始“立足点”访问，要进一步最小化损害将比以前困难得多。预防更容易也更便宜，即使在预防难以实现且昂贵时也是如此。\n\
  \n任何网络攻击中最困难的部分是首次初始访问。之后，大多数攻击者可以更容易地利用一个受感染的程序或设备转化为更多设备。使用单个受感染的设备作为“行动基地”来接管整个环境，通常比入侵原始设备所需的精力少（不幸的是，入侵原始设备可能也不难）。包括\
  \ `https://www.wired.com/story/russian-hackers-speed-intrusion-breach/` 在内的许多研究表明，复杂的攻击者可以在不到\
  \ 19 分钟内从一个受感染设备移动到许多其他设备。\n\n防止黑客和恶意软件获取初始立足点访问应该是任何网络安全防御者的主要焦点。遗憾的是，“做好备份！”通常是关于勒索软件的第一条有时也是唯一的“预防”建议。备份不是预防。备份是损害最小化。如果你正在使用备份来救命，你的预防措施已经失效了，勒索软件已经证明了一旦在环境中执行，它擅长绕过检测。一项调查（`https://www.datto.com/resource-downloads/Datto2018_StateOfTheChannel_RansomwareReport.pdf`）显示，86%的受害受害者安装了最新的杀病毒检测。其他一些研究显示，杀病毒软件和其他终端检测解决方案能阻止高达\
  \ 50%的勒索软件，但显然，如果杀病毒软件对勒索软件的检测做得更好，勒索软件就不会是今天这样一个巨大的问题了。\n\n一旦勒索软件被执行，大部分将开始执行第\
  \ 1 章中描述的所有步骤（例如“拨号回家”、允许黑客进入、数据外泄、登录凭据窃取、加密、勒索等）。显而易见，良好的备份无法拯救大多数受害者，而且绝对不是预防。预防意味着防止勒索软件从源上成功执行。本章的其余部分将介绍如何防止勒索软件执行成功。没有足够的防御者在预防措施上花费足够的时间和资源。本书将做到。\n\
  \n## 良好的通用计算机防御策略\n\n任何防御由至少三种主要类型的控制组成，专注于三个不同的目标。我将它们称为 3×3 安全控制支柱（如图 2.1 图形所示），但其他计算机防御框架通常用更多的阶段和控制类型来描述它们。我喜欢减少控制类型和目标以保持简单。\n\
  \n![图 2.1 3×3 安全控制支柱](img/c02f001.png)\n\n图 2.1 3×3 安全控制支柱\n\n控制分为三个主要阶段：预防、检测和恢复。预防控制是系统为了防止某些事情发生而做的一切——在我们的特定案例中，是勒索软件。检测控制是系统为了检测威胁已成功绕过所有预防措施并获得了对环境的未经授权访问（或正在阻止他人获得合法访问）而做的一切。这是你尝试实现早期预警的地方。如果你无法防止坏事情发生，最好的选择就是早期预警，以便快速响应并理想地最小化损害。最后一组控制是你可以从恶意事件中快速恢复而能做的一切，以最小化停机时间和开支。\n\
  \n恢复的一部分可能是你循环回来并更新预防措施，以防止同样的坏事再次成功。有时坏事规避了你的预防措施，是因为你没有具备所有的正确控制——至少在正确的位置针对正确的事情并以正确的数量。而有时，是因为某些人或某物没有按照规定执行预防措施。在今天的网络安全世界中，根据入侵的教训更新你的预防措施尤为重要。未能正确评估自身失败并更新预防措施的受害者面临再次失败的风险更高。\n\
  \n第 6 章“检测勒索软件”将涵盖建议的检测控制。第 7 章到第 11 章](#c11.xhtml)将涵盖恢复计划和流程。章节专注于预防，五个章节专注于恢复应该告诉你哪个更容易。当人们告诉我预防勒索软件很难做到时，我回答道：“你应该看看恢复有多困难！”\n\
  \n\n\n重申一下，控制主要分为三种类型：预防性、检测性和恢复性。每种类型的控制都由三个部分组成：策略、技术防御和教育。策略是指任何为了降低风险而实施并传达的规则、法规或建议。例如，绝不要向索密码的电子邮件提供密码，也不要执行来自意外邮件的程序或打开邮件中的文档。切勿在不同的网站或服务中使用相同的密码。策略可以与教育相似，但侧重点和方法可能有所不同。\n\
  \n策略还包括程序（“执行某事的方法”）和标准（“必须做什么或必须使用什么”）。策略内容可以是诸如“所有文件在传输过程中必须使用行业认可的加密算法和密钥大小进行加密”。程序包含了执行某事时必须遵循的步骤，例如“如何在跨网络发送之前加密文件”。标准可以是实现某目标的指导，例如“加密通过网络发送的文件必须使用使用\
  \ SHA-256 哈希的、2048 位或更高密钥的 RSA 非对称加密以及 256 位或更高密钥的 AES 对称加密”。\n\n技术防御是任何有助于预防、检测、缓解或响应威胁和风险的工具。网络安全领域中的技术防御包括防杀毒软件、终端检测与响应\
  \ (EDR) 软件、防火墙、安全配置、内容过滤、反钓鱼过滤器等。\n\n无论你的策略和技术防御有多好，可能仍会有某些恶意因素到达终端用户那里，他们将面临观察和处理这些因素的情况。教育（也称为安全意识培训）旨在教终端用户在恶意内容到达他们时如何识别它们，以及如何处理以将损害降至最低。理想情况下，应教终端用户报告恶意尝试并删除或忽略它们。但历史表明，终端用户受到社会工程攻击而错误地处理恶意事件，是导致恶意入侵成功的首要原因。\n\
  \n当你听到经常描述的“深度防御”（defense-in-depth）这一比喻教条时，它的意思是每个系统都应该努力通过多种、重叠的策略、技术防御和教育，创建一个尽可能完美的、分层的预防性、检测性和恢复性控制。你通常希望控制和组成部分是重叠的，因为可以降低单一控制失效带来的风险。一个控制措施可以发现其他措施漏掉的问题。你需要建立最佳的、深度防御的分层控制集，以防止勒索软件成功。\n\
  \n## 理解勒索软件攻击\n\n为了最好地防止勒索软件在设备或环境中立足，你只需要关注这些初始立足点是如何获取的，这在计算机安全世界中被称为根因利用（root-cause\
  \ exploits）或初始根因利用。要防止勒索软件，你必须防止所有恶意黑客和恶意软件，但勒索软件确实有一些值得了解的特性。本节将讨论这两者。\n\n重申一遍，由于需要，为了防止勒索软件，你需要关注勒索软件最可能获取初始访问权限的方式。勒索软件不是你的问题。你的问题在于勒索软件最初是如何进入设备或环境的。勒索软件是你真实问题的结果。为了理解，想象你可以让所有勒索软件魔法般地消失。在一秒钟内，它们消失了，并且永远不再出现。但如果允许勒索软件进入系统或环境的初始根因继续存在，黑客和恶意软件将继续成功地利用受害者。也许他们无法使用勒索软件，但可以使用木马程序、计算机病毒、后门木马、键盘记录器等来完成他们想完成的所有坏事。勒索软件是一个更大问题的症状，即被利用的安全漏洞。要停止所有的恶意软件、黑客和勒索软件，你必须弄清楚他们进入设备和环境的方法并堵这些漏洞。\n\
  \n### 所有黑客和恶意软件使用的九种利用方法\n\n本质上，任何黑客或恶意软件程序可以利用漏洞设备或环境的根因利用方法只有九种。它们列在这里：\n\n* \
  \  程序漏洞（有补丁或无补丁）\n*   社会工程学\n*   身份验证攻击\n*   人为错误/配置错误\n*   窃听/中间人 (MitM) 攻击\n*\
  \   数据/网络流量畸形\n*   内部人员攻击\n*   第三方依赖问题（供应链/供应商/合作伙伴/水井攻击等）\n*   物理攻击\n\n也可能存在某些未在此处代表的新型攻击向量，且目前尚无任何缓解措施。但目前，这九种根因方法描述了每个已知的黑客和恶意软件攻击所使用的根因利用方法。为了对抗恶意黑客和恶意软件，网络安全防御者需要缓解所有这些根因利用方法，从首先且最好地关注最可能被使用的根因利用方法开始。\n\
  \n### 所有黑客和恶意软件的首要根因利用方法\n\n从计算机出现开始，只有两种根因方法占据了大多数设备和大多数组织的绝大多数恶意入侵：社会工程学和未打补丁的软件。其他各种恶意软件和黑客方法会在几年内变得流行（例如启动病毒、USB\
  \ 密钥感染等），但在过去的三十里，社会工程学和未打补丁的软件在大多数年份中都是第一或第二流行的利用方法。\n\n社会工程学和未打补丁软件是恶意黑客和恶意软件利用的首要原因，这一事实已经在之前的数百篇文章和白皮书中讨论过，包括以下示例：\n\
  \n*   70% 到 90% 的所有恶意入侵源于社会工程学和钓鱼攻击 (`https://blog.knowbe4.com/70-to-90-of-all-malicious-breaches-are-due-to-social-engineering-and-phishing-attacks`)\n\
  *   CyberheistNews Vol 11 #14 [提示] 钓鱼仍然是最常见的攻击形式 (`https://blog.knowbe4.com/cyberheistnews-vol-11-14-heads-up-phishing-remains-the-most-common-form-of-attack`)\n\
  *   利用威胁情报构建你的数据驱动防御 (`https://info.knowbe4.com/threat-intelligence-to-build-your-data-driven-defense`)\n\
  *   2021 数据泄露调查报告 (DBIR) (`https://enterprise.verizon.com/resources/reports/2021/2021-data-breach-investigations-report.pdf`)\n\
  \n每个组织除非有经验和预期证明相反，否则都可以通过更好地集中精力打击社会工程学和钓鱼，并更好地修补其环境来获益。这样做将最有效地降低整体网络安全风险。\n\n\
  ### 勒索软件的首要根因利用方法\n\n由于勒索软件的首要根因利用方法与所有黑客和恶意软件使用的其他方法相似，但有一个重大的偏差。为了确定勒索软件攻击最常见的根因，我查阅了尽可能多的公开勒索软件报告、新闻文章和博客文章，并查看哪些报告详细说明了勒索软件在成功攻击中使用的每种类型根因利用的精确百分比。遗憾的是，这里列出的少数来源显示了勒索软件根因的精确百分比，甚至是排名：\n\
  \n\n\n\n\n*   Coveware 博客报告 (`https://www.coveware.com/blog/ransomware-attack-vectors-shift-as-new-software-vulnerability-exploits-abound`)\n\
  *   Statista 统计数据 (`https://www.statista.com/statistics/700965/leading-cause-of-ransomware-infection/`)\n\
  *   `Forbes` 杂志文章 (`https://www.forbes.com/sites/forbestechcouncil/2021/04/22/six-best-practices-for-ransomware-recovery-and-risk-mitigation/)\n\
  *   Datto 全球渠道状态勒索软件报告 (`https://www.datto.com/resources/dattos-2020-global-state-of-the-channel-ransomware-report`)\n\
  *   Hiscox 2021 年网络就绪报告 (`https://www.hiscoxgroup.com/sites/group/files/documents/2021-04/Hiscox%20Cyber%20Readiness%20Report%202021.pdf`)\n\
  \n大多数其他来源只是统统描述了勒索软件利用的首要根源，但没有涵盖具体的百分比，或者根本没有讨论百分比。几乎所有的报告都将社会工程、未修补的软件和密码问题列为勒索软件利用的主要原因，但没有对它们进行排序或相互列举。幸运的是，有些报告确实做了。表\
