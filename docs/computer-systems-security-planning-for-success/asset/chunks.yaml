    # 9. Incident Response and Continuity


    Even with the strongest security controls in place, incidents will still occur.
    It is important to be prepared to respond and get things back up and running as
    soon as possible. This process is known as incident response and continuity.


    ## 9.1. Security Organizations


    We have looked at many of these security ogranizations already, but we talk about
    them in more depth here. These organizations create the analysis frameworks and
    vulnerability lists that security specialists use to respond to an incident.


    ### 9.1.1. MITRE


    ![The MITRE Corporation, Public domain, via Wikimedia Commons](images/mitre.svg)


    [The MITRE Corporation, Public domain, via Wikimedia Commons](https://commons.wikimedia.org/wiki/File:Mitre_Corporation_logo.svg)


    In the 1940s and 1950s MIT scientists developed large-scale computing laboratories.
    In 1958 MITRE was formed as a private corporation from the personnel and equipment
    in these labs. Currently, MITRE is a federally funded research and development
    center.


    As mentioned previously, MITRE maintains the CVE DB. MITRE has also developed
    the ATT&CK framework for analyzing incidents. We will go through each step of
    the framework at the end of this chapter.


    ### 9.1.2. NIST


    NIST stands for National Institute of Standards and Technology. It is a federally
    supported through the US Department of Commerce and posits itself as an institute
    to promote American innovation. NIST develops standards, guidelines, and best
    practices in technical fields.


    NIST also has a security framework they’ve developed known as the NIST framework.
    It outlines the general responsibilities of a security team:


    *   Identify

    *   Protect

    *   Detect

    *   Respond

    *   Recover


