- raw: "C2 protocols may try to piggyback on regular network traffic, or make use\
    \ of services that are hard to trace. You’ll see encrypted C2 traffic on web protocols,\
    \ DNS queries, mail protocols, or even chat protocols such as Discord. Lower level\
    \ protocols like ICMP and UDP can also be used to avoid detection. C2 systems\
    \ may make use of multiple channels or different channels for uploads/downloads.\
    \ The ultimate goal is to make the traffic hard to detect, trace, and stop.\n\n\
    ### 9.5.13. Exfiltration\n\nGetting the data off of a machine can be difficult\
    \ for an adversary as large transfers may trigger alarms. Web services that are\
    \ already used, Google Drive, Dropbox, etc., may be employed to make exfiltration\
    \ look like regular traffic. In the case of a physical breach, USB drives may\
    \ be employed. Finally radio protocols like Bluetooth, cellular, or local WiFi\
    \ may also be used if the attacker is in close proximity to the device.\n\n###\
    \ 9.5.14. Impact\n\nThe impact of the attack needs to be analyzed as well. The\
    \ impact can include losing access to the asset, loss of data, data held for ransom,\
    \ defacement, denial of service, or resource hijacking. All of these things can\
    \ interrupt business continuity and ultimately cost a company money. The impact\
    \ of an attack needs to be well understood to make security decisions in the future.\n\
    \n## 9.6. Review Questions\n\nWhat is an SOC and what does it do? \n\n:  \n\n\
    What is an SPOF? Give an example \n\n:  \n\nHow does the ATT&CK framework differ\
    \ from the Cyber Killchain Framework? You may need to refer to the [Malware](#index.xhtml#_malware)\
    \ chapter. \n\n:  \n\n## 9.7. Lab: Reporting on the 2014 Sony Pictures Hack\n\n\
    Take a moment to read through the details of the [2014 Sony Pictures Hack](https://en.wikipedia.org/wiki/Sony_Pictures_hack).\
    \ Feel free to research an used other sources as well. Imagine you are responsible\
    \ for disclosing the details of the attack to affected parties shortly after it\
    \ had occurred.\n\n# 10\\. Virtualization\n\nInformation Technology has seen massive\
    \ growth in the adoption of virtualization as the underpinning of dynamic and\
    \ robust systems. This shift from bare-metal resources to virtual resources provides\
    \ its own unique security challenges and considerations. As the field changes,\
    \ it is important for anyone working in cybersecurity to not only understand how\
    \ these systems work, but also be able to approach their implementation with a\
    \ security-first mindset.\n\n## 10.1. Methods\n\nVirtualization is the act of\
    \ using virtual computing resources as opposed to the actual resources directly.\
    \ For example, you may run a program on a virtual version of a computer, emulating\
    \ the processor, memory, etc., instead of running the program directly on the\
    \ actual hardware. This offers some advantages in that you can limit the resources\
    \ the program uses or run multiple programs in isolated environments without needing\
    \ to significantly change the program itself. There are a few ways that virtual\
    \ computing is typically accomplished:\n\n### 10.1.1. Virtual Machines\n\n![](images/vm.svg)\n\
    \nA virtual machine is a resource that uses software to *pretend* to be an entire\
    \ physical computer. Virtual machines emulate hardware on which a *guest* operating\
    \ system is installed. The operating system of the machine *running* the virtual\
    \ machine is referred to as the *host* operating system.\n\nVirtual machines afford\
    \ a great deal of flexibility in how something is run. The machine can be paused,\
    \ restarted, or even have snapshots of its current state stored. Some virtual\
    \ machines do not even required elevated privileges to run, meaning you can emulate\
    \ a privileged environment within an unprivileged one. This makes them a great\
    \ choice for sandboxing untrusted programs.\n\nUnfortunately virtual machines\
    \ are quite resource intensive due to the fact they require virtualizing the entire\
    \ operating system. This resource use problem and the increasing popularity of\
    \ virtualization led to the creation of more light-weight solutions such as containers.\n\
    \n### 10.1.2. Containers\n\nA container simplifies the VM by using the same operating\
    \ system kernel as the host. This is accomplished by using special features of\
    \ the Linux kernel to isolate the container. [Linux namespaces](https://man7.org/linux/man-pages/man7/namespaces.7.html)\
    \ controlled by [cgroups](https://man7.org/linux/man-pages/man7/cgroups.7.html)\
    \ allow a daemon (Docker, podman, etc.) to make an environment where the application\
    \ has limited access to the full system. Typically containers are used to run\
    \ a single application as if it were running all by itself on an actual host.\
    \ This makes it easier to deploy the unique environments that some applications\
    \ require.\n\nThe obvious security concern lies in the isolation. What happens\
    \ if a container has access to another containers resources? Given that containers\
    \ for rival companies may be running next to each other on the same machine in\
    \ the cloud, what are the risks of having a malicious container access or disrupt\
    \ another?\n\n### 10.1.3. Container Orchestration Systems\n\nContainers also make\
    \ it easier to restart or scale applications. Container orchestration systems\
    \ leverage this by monitoring containers and bringing them up or down as needed.\
    \ The most popular container orchestration system is [Kubernetes](https://kubernetes.io/),\
    \ developed by Google to manage web applications.\n\nGiven the orchestration systems\
    \ create containers from images as needed, one of the obvious areas of concern\
    \ is the integrity of those images. If an image registry is compromised the orchestration\
    \ system will still deploy the images stored there typically making the issue\
    \ far worse. Containers can also be hard to manage from a logging standpoint,\
    \ which may cause compliance issues. Whereas a company may have monitored the\
    \ logs of a single server in the past, they now have to monitor the logs of hundreds\
    \ of containers running on a server.\n\n### 10.1.4. IaaS\n\nIaaS stands for infrastructure\
    \ as a service and it refers to purchasing VMs or container resources from a provider.\
    \ Some popular IaaS companies are Amazon Web Systems, Microsoft Azure, and Linode.\
    \ Each has some basic security tools and default policies in place to help keep\
    \ the purchased resources secure, but ultimately most of the security responsibility\
    \ for making sure the resources are secure lies with the group purchasing the\
    \ resource.\n\n### 10.1.5. PaaS\n\nPaaS stands for platform as a service and refers\
    \ to a higher-level service that deploys an application in an already established\
    \ environment running on an IaaS service. Heroku is a great example of this type\
    \ of service.\n\nHeroku supports many different applications, but they all work\
    \ in relatively the same manner: Imagine there is a git repository of a Django\
    \ web application that needs to be deployed. Heroku will take an Amazon EC2 instance\
    \ running on AWS, clone the repo, install a Python virtual environment with the\
    \ needed dependencies, and install a production Django web server on the system.\n\
    \nWhile the user could take these steps themselves, PaaS makes it easier to deploy\
    \ an application.\n\n### 10.1.6. SaaS\n\nSoftware as a service (SaaS) is a methodology\
    \ that we are quite used to. SaaS takes a web application and makes it available\
    \ for a subscription. Some examples would be Webex, Dropbox, Google Workspace,\
    \ etc. SaaS is a popular way to monitize software.\n\nOne of the security concerns\
    \ with SaaS is that it consolidates information with a single provider. If the\
    \ server running the software is compromised, the PII of millions of people may\
    \ be leaked.\n\n## 10.2. Cloud Computing\n\nIaaS ushered in a shift from on-premises\
    \ deployments of software to deployments *in the cloud* or on a IaaS resource.\
    \ Information technology has seen a shift to the cloud and back again with all\
    \ kinds of mixed options in between. A business may choose any of these models\
    \ depending on their needs.\n\n### 10.2.1. Public"
  fmt: "\nC2 protocols may try to piggyback on regular network traffic, or make use\
    \ of services that are hard to trace. You’ll see encrypted C2 traffic on web protocols,\
    \ DNS queries, mail protocols, or even chat protocols such as Discord. Lower level\
    \ protocols like ICMP and UDP can also be used to avoid detection. C2 systems\
    \ may make use of multiple channels or different channels for uploads/downloads.\
    \ The ultimate goal is to make the traffic hard to detect, trace, and stop.\n\n\
    ### 9.5.13. Exfiltration\n\nGetting the data off of a machine can be difficult\
    \ for an adversary as large transfers may trigger alarms. Web services that are\
    \ already used, Google Drive, Dropbox, etc., may be employed to make exfiltration\
    \ look like regular traffic. In the case of a physical breach, USB drives may\
    \ be employed. Finally radio protocols like Bluetooth, cellular, or local WiFi\
    \ may also be used if the attacker is in close proximity to the device.\n\n###\
    \ 9.5.14. Impact\n\nThe impact of the attack needs to be analyzed as well. The\
    \ impact can include losing access to the asset, loss of data, data held for ransom,\
    \ defacement, denial of service, or resource hijacking. All of these things can\
    \ interrupt business continuity and ultimately cost a company money. The impact\
    \ of an attack needs to be well understood to make security decisions in the future.\n\
