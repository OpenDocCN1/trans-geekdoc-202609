    # 4.4 Application Layer Protocols


    ## 4.4.1 DHCP


    Dynamic Host Configuration Protocol (DHCP) is used to allow new clients on a network
    to obtain an IP address and information about services provided. IPv4 addresses
    can be thought of as being in two groups: static addresses and dynamic addresses.
    Dynamic addresses are distributed by a DHCP server for a particular lease time.
    When the time is up, the DHCP server may distribute the address to another client.
    DHCP servers can also give information about proxies, Domain Name Servers (DNS),
    gateways and even where to get a [where to get a kernel to boot an OS over the
    network!](https://en.wikipedia.org/wiki/Preboot_Execution_Environment).


    Given the dynamic nature of modern networks, with clients coming and going, DHCP
    is the standard. From a security standpoint someone impersonating a DHCP server
    can wreak havoc on a network. These rogue DHCP servers can cause traffic to be
    redirected to initiate MitM attacks or cause DoS attacks. DHCP relies on broadcast
    Address Resolution Protocol (ARP) messages and does not make use of authentication,
    meaning that once an attacker is on the same Ethernet segment as the victim machines
    all bets are off.


    ## 4.4.2 HTTP


    Hypertext Transfer Protocol (HTTP) is a text based protocol that governs how web
    traffic moves. It is built on the concept of a `request` and a `response`. A typical
    request has an `method` and a `path`, such as `GET /index.html` which would retrieve
    the landing page of a website. Responses have a code, message, and optionally
    data. Some standard responses are shown below:


    | Code | Message |

    |------|---------|

    | 200 | OK |

    | 202 | Accepted |

    | 400 | Bad Request |

    | 401 | Unauthorized |

    | 403 | Forbidden |

    | 404 | Not Found |

    | 500 | Internal Server Error |

    | 502 | Bad Gateway |


    # Common Ports


    | Port | Protocol | Service |

    |------|----------|---------|

    | 20 | TCP | File Transfer Protocol (FTP) Data Transfer |

    | 21 | TCP | FTP Command Control |

    | 22 | TCP | Secure Shell (SSH) |

    | 23 | TCP | Telnet Remote Login Service |

    | 25 | TCP | Simple Mail Transfer Protocol (SMTP) E-Mail |

    | 53 | TCP, UDP | Domain Name System (DNS) |

    | 67, 68 | UDP | Dynamic Host Configuration Protocol (DHCP) |

    | 69 | UDP | Trivial File Transfer Protocol (TFTP) |

    | 80 | TCP | Hypertext Transfer Protocol (HTTP) |

    | 110 | TCP | Post Office Protocol (POP3) E-Mail |

    | 119 | TCP, UDP | Network News Transfer Protocol (NNTP) |

    | 123 | UDP | Network Time Protocol (NTP) |

    | 137-139 | TCP, UDP | NetBIOS |

    | 143 | TCP | Internet Message Access Protocol (IMAP) E-Mail |

    | 161, 162 | TCP, UDP | Simple Network Management Protocol (SNMP) |

    | 194 | TCP, UDP | Internet Relay Chat (IRC) |

    | 389 | TCP, UDP | Lightweight Directory Access Protocol (LDAP) |

    | 443 | TCP | HTTP Secure (HTTPS) HTTP over TLS/SSL |

    | 3389 | TCP, UDP | Microsoft Terminal Server (RDP) |

