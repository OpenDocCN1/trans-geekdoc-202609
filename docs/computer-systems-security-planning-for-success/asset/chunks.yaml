    \ Tolboom**\n\n# Computer Systems Security Planning for Success\n\n# Legal\n\n\
    [Computer Systems Security: Planning for Success](https://web.njit.edu/~rxt1077/security/)\
    \ by [Ryan Tolboom](mailto:ryan.tolboom@njit.edu) is licensed under a [Creative\
    \ Commons Attribution-NonCommercial-ShareAlike 4.0 International License](https://creativecommons.org/licenses/by-nc-sa/4.0/),\
    \ except where otherwise noted.\n\n![Creative Commons License](images/cc.png)\n\
    \nAll product names, logos, and brands are property of their respective owners.\
    \ All company, product and service names used in this text are for identification\
    \ purposes only. Use of these names, logos, and brands does not imply endorsement.\n\
    \nImages used in this text are created by the author and licensed under CC-BY-NC-SA\
    \ except where otherwise noted.\n\n# Acknowledgements\n\nThis material was funded\
    \ by the Fund for the Improvement of Postsecondary Education (FIPSE) of the U.S.\
    \ Department of Education for the Open Textbooks Pilot grant awarded to Middlesex\
    \ College for the Open Textbook Collaborative.\n\nThe author would like to thank\
    \ New Jersey Institute of Technology (NJIT) Open Access Textbooks (OAT) project\
    \ and the [Open Textbook Collaborative Project (OTC)](https://middlesexcc.libguides.com/OTCProject)\
    \ for making this text possible.\n\nThe author would also like to acknowledge\
    \ the contributions and hard work of:\n\n*   Karl Giannoglou, Adjunct Professor\
    \ NJIT\n\n*   Jacob Jones, NJIT 2023\n\n*   Raymond Vasquez\n\n*   Justine Krawiec,\
    \ Instructional Designer NJIT\n\n*   Alison Cole, Computing & Information Technology\
    \ Librarian Felician University\n\n*   Ricky Hernandez, NJIT 2024\n\n*   Jake\
    \ Caceres, NJIT 2024\n\n# Instructional Notes\n\nThe text, labs, and review questions\
    \ in this book are designed as an introduction to the applied topic of computer\
    \ security. With these resources students will learn ways of preventing, identifying,\
    \ understanding, and recovering from attacks against computer systems. This text\
    \ also presents the evolution of computer security, the main threats, attacks\
    \ and mechanisms, applied computer operation and security protocols, main data\
    \ transmission and storage protection methods, cryptography, network systems availability,\
    \ recovery, and business continuation procedures.\n\n## Learning Outcomes\n\n\
    The chapters, labs, and review questions in this text are designed to align with\
    \ the objectives [CompTIA Security+ SY0-601](https://www.comptia.jp/pdf/CompTIA%20Security+%20SY0-601%20Exam%20Objectives%20\\\
    (3.0\\).pdf) exam. The objectives are reproduced here for reference:\n\n*   1.1\
    \ Compare and contrast different types of social engineering techniques.\n\n*\
    \   1.2 Given a scenario, analyze potential indicators to determine the type of\
    \ attack.\n\n*   1.3 Given a scenario, analyze potential indicators associated\
    \ with application attacks.\n\n*   1.4 Given a scenario, analyze potential indicators\
    \ associated with network attacks.\n\n*   1.5 Explain different threat actors,\
    \ vectors, and intelligence sources.\n\n*   1.6 Explain the security concerns\
    \ associated with various types of vulnerabilities.\n\n*   1.7 Summarize the techniques\
    \ used in security assessments.\n\n*   1.8 Explain the techniques used in penetration\
    \ testing.\n\n*   2.1 Explain the importance of security concepts in an enterprise\
    \ environment.\n\n*   2.2 Summarize virtualization and cloud computing concepts.\n\
    \n*   2.3 Summarize secure application development, deployment, and automation\
    \ concepts.\n\n*   2.4 Summarize authentication and authorization design concepts.\n\
    \n*   2.5 Given a scenario, implement cybersecurity resilience.\n\n*   2.6 Explain\
    \ the security implications of embedded and specialized systems.\n\n*   2.7 Explain\
    \ the importance of physical security controls.\n\n*   2.8 Summarize the basics\
    \ of cryptographic concepts.\n\n*   3.1 Given a scenario, implement secure protocols.\n\
    \n*   3.2 Given a scenario, implement secure network architecture concepts.\n\n\
    *   3.3 Given a scenario, implement secure network designs.\n\n*   3.4 Given a\
    \ scenario, install and configure wireless security settings.\n\n*   3.5 Given\
    \ a scenario, implement secure mobile solutions.\n\n*   3.6 Given a scenario,\
    \ apply cybersecurity solutions to the cloud.\n\n*   3.7 Given a scenario, implement\
    \ identity and account management controls.\n\n*   3.8 Given a scenario, implement\
    \ authentication and authorization solutions.\n\n*   3.9 Given a scenario, implement\
    \ public key infrastructure.\n\n*   4.1 Given a scenario, use the appropriate\
    \ tool to assess organizational security.\n\n*   4.2 Summarize the importance\
    \ of policies, processes, and procedures for incident response.\n\n*   4.3 Given\
    \ an incident, utilize appropriate data sources to support an investigation.\n\
    \n*   4.4 Given an incident, apply mitigation techniques or controls to secure\
    \ an environment.\n\n*   4.5 Explain the key aspects of digital forensics.\n\n\
    *   5.1 Compare and contrast various types of controls.\n\n*   5.2 Explain the\
    \ importance of applicable regulations, standards, or frameworks that impact organizational\
    \ security posture.\n\n*   5.3 Explain the importance of policies to organizational\
    \ security.\n\n*   5.4 Summarize risk management processes and concepts.\n\n*\
    \   5.5 Explain privacy and sensitive data concepts in relation to security.\n\
    \n## Example Schedule\n\nA sample schedule utilizing these resources in a 15 week\
    \ semester is shown below:\n\n| Week || Chapters || Assignments || Learning Outcomes\
    \ |\n\n| --- | --- | --- | --- |\n\n| 1 || [Introduction](#index.xhtml#_introduction)\
    \ || \n\n[Lab: Think Like a Hacker](#index.xhtml#_lab_think_like_a_hacker)  \n\
    \n[Introduction Review Questions](#index.xhtml#intro_review)\n\n || 1.1, 1.2,\
    \ 1.6, 2.7 |\n\n| --- | --- | --- | --- |\n\n| 2 || [Cryptography](#index.xhtml#_cryptography)\
    \ || \n\n[Lab: Hash it Out](#index.xhtml#_lab_hash_it_out)  \n\n[Cryptography\
    \ Review Questions](#index.xhtml#crypto_review)\n\n || 1.2, 1.3, 1.6, 2.1, 2.4,\
    \ 2.5, 2.8, 3.9 |\n\n| 3 || [Malware](#index.xhtml#_malware) || \n\n[Lab: Malware\
    \ Analysis](#index.xhtml#_lab_malware_analysis)  \n\n[Malware Review Questions](#index.xhtml#malware_review)\n\
    \n || 1.2, 1.3, 1.4, 2.5, 4.1, 4.3, 4.5 |\n\n| 4 || [Protocols](#index.xhtml#_protocols)\
    \ || \n\n[Lab: Scanning with nmap](#index.xhtml#_lab_scanning_with_nmap)  \n\n\
    [Protocols Review Questions](#index.xhtml#protocols_review)\n\n || 1.3, 1.6, 1.7,\
    \ 3.1, 3.2, 4.1 |\n\n| 5 || [Attacks](#index.xhtml#_attacks) || \n\nQuiz 1  \n\
    \n[Attacks Review Questions](#index.xhtml#attacks_review)\n\n || 1.2, 1.3, 1.4,\
    \ 1.8, 3.3, 3.4, 4.1, 4.2 |\n\n| 6 || \n\n[Introduction](#index.xhtml#_introduction)\
    \  \n\n[Cryptography](#index.xhtml#_cryptography)  \n\n[Malware](#index.xhtml#_malware)\
    \  \n\n[Protocols](#index.xhtml#_protocols)  \n\n[Attacks](#index.xhtml#_attacks)\n\
    \n || \n\nMidterm Review  \n\n[Lab: MitM with Scapy](#index.xhtml#_lab_mitm_with_scapy)\n\
    \n || 1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 1.7, 1.8, 2.1, 2.4, 2.5, 2.7, 2.8, 3.1, 3.2,\
    \ 3.3, 3.4, 3.8, 3.9, 4.1, 4.2, 4.3, 4.5 |\n\n| 7 || \n\n[Introduction](#index.xhtml#_introduction)\
    \  \n\n[Cryptography](#index.xhtml#_cryptography)  \n\n[Malware](#index.xhtml#_malware)\
    \  \n\n[Protocols](#index.xhtml#_protocols)  \n\n[Attacks](#index.xhtml#_attacks)"
