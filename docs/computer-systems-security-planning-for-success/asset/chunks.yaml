    ## 4. 协议


    协议可以被视为规定通信的规则。协议可能包括有关使用的语法、错误校正、同步或任何其他方面的信息，即在该情况下通信如何发生。在计算机安全中，彻底了解常见协议非常重要，因为它们的弱点往往决定了攻击如何以及是否会发生。协议既存在于硬件也存在于软件中，并由个人和组织开发。早期的网络协议通常通过邮件列表使用请求评论（RFC）开发。您可能仍然会看到正在起草、引用或积极处理的
    RFC。一些最早的 Web 协议在 RFC 中有详细说明。通常，大型协议都有工作组和协会进行开发，例如电气和电子工程师学会（IEEE）中的 802.11 组，它处理
    WiFi 协议。这些组发布论文，详细说明协议的工作原理。


    本章将按照 TCP/IP 分层模型简要介绍重要协议。需要注意的是，某些协议可能跨越层级来完成任务。在这种情况下，它们将根据其主要功能所在的层级进行分组。


    ### 4.1. 网络访问层


    #### 4.1.1. ARP


    地址解析协议 (ARP) 用于本地以太网段，以将 IP 地址解析为 MAC 地址。由于该协议在以太网段级别运行，安全性并非主要关注点。不幸的是，这意味着 ARP
    通信很容易被欺骗，从而导致中间人（MitM）场景。恶意行为者只需发送几个 ARP 数据包，即免费 ARP，声称某个 IP 地址的流量应发送给他们。由于 MAC
    到 IP 地址表在多个位置缓存，所有缓存失效并解决由恶意 ARP 帧引起的问题可能需要很长时间。


    有一种协议旨在缓解 ARP 的问题。动态 ARP 检查 (DAI) 跨越层级，与 DHCP 租约数据库协同工作，丢弃未使用在授予 DHCP 租约时使用的 MAC
    地址的数据包。虽然这可以解决与 ARP 相关的许多问题，但使用 HTTPS 等安全的高级协议也是一种良好的做法，以防万一。


    #### 4.1.2. Wifi


    我们最关心的 WiFi 协议是用于加密数据的安全标准。由于无线协议的性质，网络上发送的信息对任何拥有天线的人都可用。这些 WiFi 安全标准是保护您的网络流量免受传输范围内任何人查看的唯一东西。目前有四种标准：


    - WEP：有线等效隐私（WEP）已弃用，不应使用。它开发于 1999 年，使用 RC4 流和 24 位加密。已经开发出几种攻击，可以在几秒钟内破解 WEP。

    - WPA：WiFi 保护访问（WPA）使用临时密钥完整性协议（TKIP）来更改正在使用的密钥。这种 128 位加密方法也已被破解，该协议不应使用。

    - WPA2：WiFi 保护访问 2（WPA2）使用 AES 加密，目前是最流行的标准。WPA2 仍然被认为是安全的。

    - WPA3：WiFi 保护访问 3（WPA3）开发于 2018 年，目前被认为是最先进的。许多网络正在开始从 WPA2 过渡到 WPA3。


    ### 4.2. 互联网层协议


    #### 4.2.1. IP


    IP 代表互联网协议，它被设计用于创建网络的网络。主要使用它的网络网络是互联网，尽管您也可以在其他场景中使用 IP。IP 主要关注跨网络和向网络路由流量。该协议最初由
    IEEE 在 1974 年详细说明，源自高级研究计划署网络（ARPANET）项目，该项目创建了第一个大型分组交换网络。


    大多数人都熟悉 IP 地址，即参与 IP 网络的主机分配的唯一编号。目前 IP 协议有两个主要版本，IPv4 和 IPv6，主要区别之一在于可用 IP 地址的数量。IPv4
    支持 32 位地址，IPv6 支持 128 位地址。为了让您了解这是多么大的变化，我们目前已分配所有可能的 IPv4 地址，但使用 IPv6，我们可以给地球海滩上的每一粒沙子分配一个地址，而且仍然不会用完。


    ##### IPv6 安全影响


    从安全角度来看，IPv4 和 IPv6 中地址的使用方式有重大后果。由于 IPv4 地址不足，典型的互联网用户被分配一个本地地址，当他们通过路由器路由数据包时，该地址会被转换为外部
    IPv4 地址。这被称为网络地址转换（NAT），通常由一体化设备处理，该设备还确保外部实体无法连接到内部网络。


    使用 IPv6 地址时，同一内部网络上的每个主机都可以分配一个外部 IPv6 地址。基本的 IPv6 路由器可能只是将数据包传递到网络，而不阻止对内部网络的连接。如果机器没有加固或没有部署/启用防火墙，机器可能会受到攻击。


    作为计算机安全专家，不仅要测试 IPv4 连接，还要测试 IPv6，以确保您的网络配置得当。


    #### 4.2.2. ICMP


    互联网控制消息协议 (ICMP) 主要用于在 IP 不起作用时在系统之间发送消息。例如，假设我们尝试连接到一台主机，但我们的路由器不知道如何到达那里。我们的路由器可以向我们发送
    ICMP 目标不可达消息，以告知我们出了问题。由于 ICMP 消息在网络层工作，即使互联网层有问题，我们也会收到此消息。


    ICMP 最常见的用途是 ping 命令。ping 向主机发送 ICMP 回显请求，以检查主机是否可用。通过用请求中包含的数据响应请求，我们可以假设主机已启动并正常运行。


    ICMP 也用于 traceroute 命令。traceroute 逐步增加 ICMP 数据包的生存时间 (TTL) 字段，并监视 TTL 超时消息，以确定数据包到达主机所走的路由。traceroute
    输出示例如下所示：


    ```

    traceroute to 8.8.8.8 (8.8.8.8), 30 hops max, 60 byte packets

    ```


