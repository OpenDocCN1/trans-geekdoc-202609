    <ARP  op=is-at psrc=172.20.0.5 hwdst=02:42:ac:14:00:06 pdst=172.20.0.6 |> ¶  ¶
    This packet posits itself as coming from the server, it is aimed at the victim
    in both IP and MAC, but the MAC address that will be used to send it is ours (by
    default, we don’t specify with hwsrc). This means the victim will update their
    ARP cache such that frames destined for server go to attacker. This effectively
    reroutes all layer 2 traffic that was going to the server from the victim. ¶ Go
    ahead an send that ARP packet: ¶  ¶  ¶ Listing 10. attacker ¶  ¶ >>> send(bad\_arp)


