    What does this say about how ProFTP is configured on victim? ¶  ¶ When you are
    all done poking around, you can exit the shell and run docker-compose down to
    stop victim from running in the background. ¶ 4.6. Review Questions ¶ Compare
    and contrast SSH and Telnet. If you had to make a recommendation for which one
    to use, what would you choose and why? :  What are some security concerns associated
    with ARP? What steps can be taken to mitigate them? :  Describe three protocols
    used to send or receive email. :  ¶ 5. Attacks ¶ 5.1. Interception Attacks ¶ Interception
    attacks rely on the ability to intercept network communications. This may be due
    to the nature of the network being used or sometimes other methods may leveraged
    to better position the attacker. These attacks generally involve forging fictitious
    messages, recording transmitted data, or altering the contents of messages while
    on a network. This family of attacks places all parts of the CIA triad at risk.
    ¶ 5.1.1. MitM ¶  ¶ A man in the middle attack (MitM) is a blanket term applied
    when an attacker is intercepting communication. A typical attack involves eavesdropping
    and possibly modifying messages between two parties. Encryption can be used to
    mitigate the attack, making it impossible for an attacker to decrypt the messages
    they are intercepting. That being said, particular attention must be paid to the
    handshaking/key exchange protocol to be sure that an attacker does not gain access
    to the key(s) being used. What follows is an example of MitM being used to intercept
    and modify the public key exchange: ¶  ¶ In the above example the MitM allows
    the first message to pass unmolested, but tampers with the exchange of the public
    key. By passing it’s own public key to Bob, the MitM has to ability to decrypt
    the messages that Bob sends and can still use Alice’s public key to re-encrypt
    the messages at pass them to her. You can see how if two public keys are exchanged
    in this manner it would be possible to set up a MitM attack where despite encryption
    all messages can be seen. ¶ 5.1.2. MitB ¶ MitB stands for man in the browser and
    is typically caused by a trojan installing malware that allows the attacker to
    intercept/modify communications between the browser and the server. This can be
    used to capture data on forms, modify input, or modify the response from the server.
    Often the software used in MitB attacks lays dormant until the victim browses
    to a targeted website. What follows is an example of how a MitB attack can be
    used to modify an online banking request to send money: ¶  ¶ As you can see the
    attacker ended up with $10,000 and the victim simply thought they authorized a
    payment of $1,000 to someone else. These attacks can be difficult to detect because
    they take place within the browser and are opportunistic. ¶ 5.1.3. Replay Attacks
    ¶ This family of attacks typically involves a MitM making a copy of the transmission
    and replaying it to impersonate the victim. Logon credentials, simple hashes,
    and specific commands are sometimes susceptible to this type of attack. The solution
    is to use timestamps, nonces (random number for that particular session), rotating
    keys, or a counter to make sure commands cannot be executed outside of context.
    ¶  ¶ One-time Passwords ¶ To help mitigate replay attacks, an online banking application
    may require that client use a one-time password (OTP) when submitting transactions.
    An OTP is a frequently changing value that is known to both the client and the
    server. Several one-time password schemes exist, most of which make use of a cryptographic
    hash function with a shared seed between client and server. Periodically the client
    and server update to a new hash based on the seed and without the seed it is impossible
    to know what the next hash will be. By using an OTP anyone who intercepts the
    traffic will not be able to perform a replay attack as the password will not be
    current. ¶  ¶ 5.1.4. SSL Circumvention ¶ MitM preventing HTTPS upgrade and skimming
    passwords ¶ If you think about the intercepted key exchange given in the above
    MitM example, a similar attack can allow attackers to view SSL traffic. The attacker
    gives the victim a bogus certificate authority (CA) certificate which the victim
    installs. This is often accomplished via a trojan. Then the attacker places themselves
    in the middle of an uninitiated secure connection. During the key exchange the
    attacker creates a custom certificate signed by a bogus CA for the connection
    between attacker and victim. The attacker also makes an actual HTTPS connection
    to the service and proxies data for the victim. All of the victims data will show
    up in plaintext for the attacker but the connection will appear to be secure for
    the victim. This is used in the Fiddler debugging proxy to decrypt HTTPS traffic
    and is also used in some network appliances that perform deep packet inspection.
    ¶ Another MitM attack on SSL is simply to maintain or downgrade to an HTTP connection
    with the victim and proxy data to an actual HTTPS connection with the server.
    Most servers will upgrade an insecure connection, but by intercepting that exchange
    the attacker can continue to monitor the victim’s traffic. ¶ 5.2. Network Layer
    Attacks ¶ 5.2.1. MAC Spoofing/MAC Cloning ¶ Most networks expect that a MAC address
    will correspond to the unique numbers on a network interface controller (NIC),
    but it is actually quite easy to change. Virtual networking necessitates the ability
    to use a different MAC address and this feature is built into most modern operating
    systems. MAC spoofing is when an attacker sets their MAC address to the MAC address
    of another machine on the network in an effort to initiate an attack. For example,
    them may set themselves up as a gateway to launch a MitM attack. ¶ 5.2.2. MAC
    Flooding ¶ Switches are tasked with keeping track of which MAC addresses correspond
    to which ports on the switch. They use this to make sure that traffic is only
    routed where it needs to go. Given that MAC addresses can be changed, an attacker
    could flood a switch with packets from many different MAC addresses and possibly
    overflow the MAC-port routing table. Some switches may default to hub-like functionality
    and send frames to all ports in an effort to keep traffic flowing. This then allows
    an attacker to capture traffic from other machines on the network. ¶ 5.2.3. ARP
    Poisoning ¶ ARP Spoofing by 0x5534C, see page for license via Wikimedia Commons
    ¶ An attacker may also use ARP packets to impersonate another machine on the network,
    such as a gateway router. By repeatedly sending out ARP packets, gratuitous arp,
    redirecting packets bound for the gateway’s IP to the attackers MAC address an
    attacker can set up a MitM scenario. This is particularly difficult because depending
    on the TTL of the ARP cache it may take up to 20 minutes for normal network operations
    to resume. ¶ 5.3. Internet Layer Attacks ¶ 5.3.1. IP Spoofing ¶  ¶ Unfortunately
    Internet Protocol (IP) was not designed with security in mind. This means that
    by default any IP address can be put in the packet header and the packet will
    still be forwarded to the network. This leads to issues where an IP can be spoofed
    and malicious packets sent out. At this layer there really aren’t any good solutions
    to this problem. This means that the sources of packets often need to be authenticated
    in higher layers and protocols must take into account the fact that the IP layer
    is fundamentally insecure. ¶  ¶ Smurf Attack ¶ Smurf DDos Attack by Imperva Incapsula
    used under CC-BY-SA 4.0 ¶ The Smurf attack is a great example of how spoofed IP
    addresses can lead to major problems. The Smurf attack is an early type of Distributed
    Denial of Service attack. An attacker would create an ICMP echo request with the
    victims IP address as the source address. This echo request would be directed
    at a broadcast IP address for a subnet. Many of the clients on the subnet would
    respond the echo request, flooding the victim with responses. The asymmetric nature
    of this attack, a single packet prompting possibly hundreds of responses, made
    it particularly hard to deal with. Using a Smurf attack, an attacker could keep
    a victim pinned down with minimal bandwidth required on their end. Modern clients
    no longer respond to ICMP echo requests directed at the broadcast, mitigating
    the risk of this kind of attack. ¶  ¶ 5.4. Name Resolution Attacks ¶ 5.4.1. DNS
    Cache Poisoning ¶ A DNS resolved can be tricked into caching incorrect information
    and serving it to other clients. In this scenario an attacker assumes the role
    of the authoritative DNS server by responding to a DNS query with a forged source
    IP. One of the reasons this is possible is because DNS query responses are often
    single, unauthenticated packets. Once the server has the invalid DNS cache entry
    it will continue to direct users to the incorrect IP address for the TTL of the
    entry. DNSSEC can be used to mitigate these attacks by forcing authentication
    on DNS answers. ¶ 5.4.2. LLMNR Hijacking ¶ In this scenario an attacker responds
    to a Link-Local Multicast Name Resolution (LLMNR) broadcast and impersonates an
    authentication server. The unexpecting victim fills in their credentials, which
    are promptly stolen. This attack can be mitigated by disabling LLMNR on the network.
    ¶ 5.5. Web-based Attacks ¶ The world wide web and the protocols/formats/languages
    it uses (HTTP, HTML, JavaScript, etc.) were not originally designed with security
    in mind. By default, web pages trust the content they receive to not be malicious.
    Scripts, commands, cookies, etc. are implicitly trusted. Web technologies have
    become so popular that they are a common target for attackers and developers must
    use tokens, sanitize data, and check inputs if they want those technologies to
    be secure. ¶ The Open Web Application Security Project (OWASP) is a great source
    of resources for web application security. They maintain a top 10 list of web
    application security risks. As of 2021, the OWASP top 10 is: ¶ Broken Access ControlCryptographic
    FailuresInjectionInsecure DesignSecurity MisconfigurationVulnerable and Outdated
    ComponentsIdentification and Authentication FailuresSoftware and Data Integrity
    FailuresSecurity Logging and Monitoring FailuresServer-Side Request Forgery ¶
    5.5.1. XSS ¶ Cross-Site scripting refers to the process by which a bad actor can
    inject a script into a website. Recall that many websites take inputs from forms
    and may later display that data on another page. If that data isn’t just data,
    but actually a JavaScript script, that script may run on the page that displays
    it. ¶ Using this technique attackers can access cookies, session tokens, and other
    sensitive information. Depending on where the script was injected and how the
    server displays that data the script could be stored permanently on the target
    server. XSS scripts may also be reflected, typically sent in links, where they
    are only used for one session. ¶ To mitigate XSS risks, it is important that a
    web developer sanitize their inputs. When a form is submitted, the website should
    check that the data submitted isn’t a script or other malicious content. If the
    data does cannot be cleaned, it shouldn’t be stored or used. ¶  ¶ Samy Worm ¶
    One October 4th, 2005 an XSS worm spread across MySpace, the dominant social network
    at the time. The worm was written by Samy Kamkar as a simple post that when read
    would cause a viewers machine to make their own post stating "but most of all,
    samy is my hero" and including the code to propagate. The results was that within
    20 hours over one million users had run the payload. ¶ Now Samy is a prominent
    security consultant and you can read his full technical explanation of the worm
    here. Vice Motherboard also did a segment on Samy for their Greatest Moments in
    Hacking History series. ¶  ¶ 5.5.2. CSRF ¶ Cross-Site Request Forgery (CSRF) involves
    using an victims already authenticated session in a request that is not part of
    that session. Imagine you are logged into Twitter. An attacker sends you a form
    link in GMail, that when clicked on posts a tweet that says, "I’m a CSRF victim."
    Assuming Twitter accepts the form submission you will now have a tweet in your
    timeline that states "I’m a CSRF victim." ¶ This is probably the most benign scenario,
    you can imagine things be much worse with an online banking application. The solution
    is for the website (Twitter in this case) to use a CSRF token (which it does).
    When the form is generated, a random value is included as a hidden input. That
    random, hidden input is the CSRF token. When a submission is made, if the CSRF
    token submitted does not match the one created for the form (which only the valid
    website knows) the submission is not accepted. ¶ CSRF tokens are yet another example
    of how web applications require proactive security as opposed to being secure
    by design. Most web apps are employing them, but it can be easy for a developer
    to forget. ¶ 5.5.3. SSRF ¶  ¶ Web systems often communicate with internal servers
    the retrieve information. These may be API servers, databases, or messaging servers.
    If an attacker can fool a web server into passing a malicious request to its internal
    server, the attacker and abuse the internal trust of the system. This is referred
    to a server-side request forgery (SSRF). Once again, this kind of attack is mitigated
    with input validation, which needs to be included in the application. ¶ 5.5.4.
    Session Hijacking ¶ Session hijacking may involve other methods of compromise,
    but the end goal is to "steal" a session between the victim and another server.
    Imagine the following scenario: A person logs in to their personal banking website,
    which issues them a cookie which proves they are authenticated. A bad actor is
    monitoring the connections through an XSS exploit that forwards all connection
    cookies to them. The bad actor uses the cookie that was issued to make a transfer
    from the user’s bank account to the bad actors bank account. ¶ Depending on the
    method used, session hijacking may be prevented through use of a better session
    key or by requiring transport layer security (TLS) to connect. In the above scenario
    the only way to prevent session hijacking would be to repair the initial XSS vulnerability.
    ¶ 5.5.5. SQL Injection ¶ As mentioned in the SSRF section, almost all web systems
    are supported by other servers running internally. One of the most common scenarios
    is to have a web server which reaches out to an internal database. Relational
    databases utilize structured query language (SQL) so a web application may generate
    many different SQL queries during its regular operations. If a user input is placed
    directly into the query, it can be possible to make the result function in a way
    that was not intended or yield secret information from the database. ¶ Take a
    look at the following PHP code: ¶  ¶ $userName = $\_POST\[''user\_name''\]'
