    [WhiteTimberwolf (SVG version)](https://commons.wikimedia.org/wiki/File:CBC_encryption.svg),
    Public domain, via Wikimedia Commons


    Starting with an initialization vector (`IV`) each block is XORed with part of
    the ciphertext of the previous block to create a chain of ciphertext that is constantly
    changing. This means that identical blocks will result in different ciphertexts.
    This is the most common mode of operation, its weaknesses being that the algorithm
    cannot be run in parallel (sorry modern processors) and that the `IV` is a common
    attack target.


    #### Counter (CTR)


    ![WhiteTimberwolf (SVG version), Public domain, via Wikimedia Commons](images/ctr.svg)


    [WhiteTimberwolf (SVG version)](https://commons.wikimedia.org/wiki/File:CTR_encryption_2.svg),
    Public domain, via Wikimedia Commons


    Instead of using an `IV`, CTR uses a nonce (random number that is the same for
    all blocks) and counter. The counter is incremented with each block, meaning this
    mode can function in parallel. CTR mode solves the problems of ECB while still
    providing an algorithm that can run quickly on modern machines.


    #### Galois/Counter Mode (GCM)


    ![Gallois Counter Mode block diagram with initialization vector, adapted from
    a diagram by NIST is used under CC0 1.0](images/gcm.svg)


    [Gallois Counter Mode block diagram with initialization vector, adapted from a
    diagram by NIST](https://commons.wikimedia.org/w/index.php?curid=74845777) is
    used under [CC0 1.0](https://creativecommons.org/publicdomain/zero/1.0/deed.en)


    GCM uses a counter like CTR, but does not make use of a nonce. Instead an `IV`
    is used with the inititial counter. GCM also generates a message authentication
    code (`MAC`) for each block to verify the integrity of the block. This combination
    makes for a modern, robust algorithm that is gaining rapid adoption.


    ## 2.10. Encryption Examples


    ### 2.10.1. RSA


    RSA is an asymmetric encryption standard developed in 1977 that is still very
    popular. Its trapdoor function is based on the difficulty of factoring large numbers.
    The name RSA comes from the names of the authors of the system: Ron Rivest, Adi
    Shamir, and Leonard Adleman.


    ### 2.10.2. Advanced Encryption Standard (AES)


    AES is a symmetric block cipher developed in 1998 to supersede the less secure
    Data Encryption Standard (`DES`). AES works on 128 bit blocks of data, performing
    multiple rounds of substitution-permutation to encrypt data. You will find AES
    used to encrypt network traffic (as is the case in a virtual private network),
    data stored to disk (disk encryption), or computer game data that is saved to
    storage. AES is a very common cipher.


    ### 2.10.3. Elliptic-curve Cryptography (ECC)


    ECC is an asymmetric encryption scheme that is quite fast and easy to computer.
    It is rapidly becoming the go to choice for digital signatures and key exchanges,
    gaining adopting starting in 2004. ECC is based on the geometry of a pre-determined
    set of curves (some examples can be found [here](http://www.secg.org/sec2-v2.pdf)),
    which can be used to create a trapdoor function.


    ### 2.10.4. Diffie-Hellman Key Exchange


    ![Original schema: A.J. Han Vinck, University of Duisburg-EssenSVG version: Flugaal,
    Public domain, via Wikimedia Commons](images/dh.svg)


    [Original schema: A.J. Han Vinck, University of Duisburg-EssenSVG version: Flugaal](https://commons.wikimedia.org/wiki/File:Diffie-Hellman_Key_Exchange.svg),
    Public domain, via Wikimedia Commons


    Given the slow nature of asymmetric algorithms, often an application such as a
    VPN will choose to use asymmetric cryptography to exchange a shared secret key
    and then use that secret key with a faster symmetric algorithm such as AES. Diffie-Hellman
    does exactly that and was first published in 1976. Diffie-Hellman key exchange
    uses the same mathematical concepts as RSA, exponentiation and modulus arithmetic,
    to great effect, but to visualize what is happening a metaphor of secret color
    mixing is used (see the included diagram). It is important to remember that because
    the medium of exchange may be slow a DH key exchange is designed to generate minimal
    traffic.


    ### 2.10.5. Digital Certificates


    A digital certificate is a set of credentials used to identify a company or an
    individual. Since asymmetric encryption requires know a party’s public key, a
    digital certificate includes that key as well as an ID of the owner. The question
    then becomes how do you trust that the public key is actually for the alleged
    owner? That’s where the issuing authority comes in. A certificate authority (`CA`)
    signs the certificate indicating that the ID and `public_key` are correct. Certificates
    can be self-signed, but this sidesteps the trust placed in the `CA` and is often
    only used in testing. Since most certificates are used for encrypting web traffic,
    Web browsers will typically warn you if a site is using a self-signed certificate.


    Given how how many certificates need to be issued and the work that needs to be
    done to verify them, most certs are not issues by root `CA`s, but are actually
    issued by intermediate `CA`s. Root `CA`s delegate the work to Intermediate `CA`s
    and indicate their trust in them by signing the intermediate `CA`s keys. This
    creates a chain of trust from the issued certificate (signed by the Intermediate
    `CA`) to the Intermediate `CA` (signed by the root `CA`) to the root `CA` (trusted
    by the browser). Tools that use this chain of trust will keep the root `CA` certificates
    and update them from the companies that issue them as needed.


    The certificate store is very important and while users rarely interact with it
    is often possible to install root `CA`s manually. [This is can be used to create
    a proxy that can decrypt HTTPS traffic for debugging](https://docs.telerik.com/fiddler/configure-fiddler/tasks/trustfiddlerrootcert)
    or for more nefarious purposes. For this reason some applications, Facebook mobiles
    apps for example, maintain their own certificate store and prevent users from
    adding root `CA`s to it.


    ![](images/letsencrypt.svg)


    So how do you get a certificate for your website? The customer will generate a
    Certificate Signing Request (`CSR`) that includes the public key and their ID.
    The `CA` will validate that the customer owns the website and build and sign the
    cert. This whole process can be automated and performed for free via a tool called
    [Let’s Encrypt](https://letsencrypt.org/).


    ### 2.10.6. Blockchain


    ![Bitboy, Public domain, via Wikimedia Commons](images/btc.svg)


    [Bitboy](https://commons.wikimedia.org/wiki/File:Bitcoin_logo.svg), Public domain,
    via Wikimedia Commons


    It is hard to talk about cryptography without addressing blockchains, one of the
    concepts behind cryptocurrencies. A blockchain is a shared ledger (of transactions
    in the case of BitCoin) where blocks are constantly being added to add to the
    information being stored. Periodically an new block is created, which includes
    a hash of the previous block and a hash of itself for the next block to reference.
    By examining these hashes, you can prove the integrity each block and its position,
    thus making a publicly-available, mutually agreed upon accounting of what has
    occurred on the network. Typically to prevent bad actors from adding block some
    sort of proof of work, a mathematically difficult operation, or proof of stake,
    an accounting of investment in the network, must be included when adding a block
    to the chain.


    ### 2.10.7. Trusted Platform Module (`TPM`) / Hardware Security Module (`HSM`)


    These modules provide hardware specifically for use with encryption. `HSM`s are
    removable modules while `TPM`s are motherboard chips. Many ciphers rely on a reliable
    source of entropy (randomness) which these modules provide. They can also significantly
    increase the speed at which cryptographic algorithms run by moving the operations
    to specialized hardware. Lastly, these modules can be used to store keys and make
    them only accessible via the module. This can add an extra layer of security to
    prevent the keys from being easily copied.

    '
