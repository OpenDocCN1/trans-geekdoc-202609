    \ || S || T || U || V || W || X || Y || Z |\n\n| --- | --- | --- | --- | --- |\
    \ --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | ---\
    \ | --- | --- | --- | --- | --- | --- | --- | --- |\n\n| J || G || T || Q || X\
    \ || Y || A || U || C || R || V || I || F || H || O || K || L || E || D || B ||\
    \ W || S || Z || M || N || P |\n\n| --- | --- | --- | --- | --- | --- | --- |\
    \ --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | ---\
    \ | --- | --- | --- | --- | --- | --- |\n\nNow creating a message is simple a\
    \ matter of performing the substitutions. For example, `HELLO WORLD` becomes `UXIIO\
    \ ZOEIQ`.\n\nWhile this is simple to understand and set up, it is also very easy\
    \ to break. You could use a frequency attack, where you analyze a large chunk\
    \ of encrypted text knowing that certain letters are more frequent than others.\
    \ By matching up the most frequently used ciphertext letters with their standard\
    \ English equivalents you may quickly reach a solution. You could also go through\
    \ all permutations of the alphabet (4E26) and see what gives you the most English\
    \ words. The second attack is made much more feasible through computing.\n\n##\
    \ 2.3. Keys\n\nTypically a series of random bytes can be used as a key to either\
    \ encrypt or decrypt data. A key is used by a cryptographic algorithm to change\
    \ plaintext to ciphertext. Keys may also be asymmetric in that they can only be\
    \ used to perform `one` of the operations (either encryption or decryption).\n\
    \nIt is important to have an idea of what factors make a `strong` cryptographic\
    \ key. Length plays an important role. The longer the key, the hard it is to `crack`\
    \ the encryption. Likewise the randomness of the data in the key also makes it\
    \ stronger. If the byte sequence is somehow predictable, the length is irrelevant.\
    \ Finally we have the concept of a cryptoperiod or lifetime of a key. If we are\
    \ working with a system that frequently changes keys an attacker may not have\
    \ enough time to crack it.\n\n## 2.4. Mathematical Foundation\n\nCryptography\
    \ relies largely on the concept of one-way or trap door functions. That is a process\
    \ that is hard to compute in one direction, but easy to compute in the other.\
    \ For example it is much easier for a computer to multiply large numbers than\
    \ to determine the factors of large numbers. This is the foundation of the RSA\
    \ algorithm. [A simplified version of the algorithm](https://www.cs.drexel.edu/~jpopyack/IntroCS/HW/RSAWorksheet.html)\
    \ is shown below:\n\n```\nKEY GENERATION\np = a random prime number\nq = a random\
    \ prime number\nN = p * q\nr = (p - 1) * (q - 1)\nK = a number which equals one\
    \ when modded by r and can be factored\ne = a factor of K that doesn't share factors\
    \ with N\nd = another factor of K that doesn't share factors with N\nYour public\
    \ key is N and e\nYour private key is N and d\n\nENCRYPTION\nciphertext = (cleartext**e)%N\n\
    \nDECRYPTION\ncleartext = (ciphertext**d)%N\n\nEXAMPLE\np = 7\nq = 13\nN = 7 *\
    \ 13 = 91\nr = 72\nK = 145 (because 145%72 = 1)\ne = 5\nd = 29\nPublic Key = 91,\
    \ 5\nPrivate Key = 91, 29\ncleartext = 72 ('H' in ASCII)\nciphertext = (72**5)%91\
    \ = 11 (encrypted using N and e)\ncleartext = (11**29)%91 = 72 (decrypted using\
    \ N and d)\n```\n\nIn order to `crack` RSA you would need to be able to factor\
    \ N into its two prime numbers. While it is trivial in our simple example, imagine\
    \ how difficult it would be to [factor a number with 1400 decimal digits,](https://stackoverflow.com/questions/11832022/why-are-large-prime-numbers-used-in-rsa-encryption)\
    \ the current recommended keysize for RSA. You’ll notice that the algorithm only\
    \ requires exponentiation, multiplication, and modulus arithmetic. At no point\
