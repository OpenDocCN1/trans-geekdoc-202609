    \ ¶ \n\n ¶ ¶ \n\n¶ | ¶ Factors An organization’s building is a large ongoing investment\
    \ and is often an unexpected security asset or weakness. Most technical security\
    \ controls can be completely bypassed or disabled if physical security is not\
    \ taken into account. As such, steps must be taken to assure that physical access\
    \ is limited to protect not only the building and its contents but also the data\
    \ that is created and stored there.\n\n### 7.2.1. Gates\n\nIt is easier to manage\
    \ the physical security of a location when the amount of entry points are limited.\
    \ Convenience and safety dictate that even with such considerations multiple points\
    \ of ingress are still needed. A security gate is the most basic tool available\
    \ the ensure that only authorized actors gain access.\n\nSecurity gates can be\
    \ manned or unmanned and designed to support vehicular or pedestrian traffic.\
    \ In general an unmanned security gate is not going to be as effective as a manned\
    \ security gate. Likewise, vehicular gates will be less effective against foot\
    \ traffic (especially unmanned vehicular gates) than gates or checkpoints designed\
    \ for individuals. A thorough risk assessment is often the first step in planning\
    \ where to put gates and what types of gates to use.\n\n### 7.2.2. Biometrics\n\
    \n![Biometrics Access Identification is used under Pixabay License.](images/biometric.jpg)\n\
    \n[Biometrics Access Identification](https://pixabay.com/illustrations/biometrics-access-identification-4503107/)\
    \ is used under [Pixabay License](https://pixabay.com/service/license/).\n\nBiometric\
    \ security devices identify people based on on or more physical characteristics.\
    \ This has the great advantage of convenience. A person may occasionally forget\
    \ to bring their ID card in to work, but they will never forget to bring their\
    \ fingertip or iris! Similarly, since the items being used for identification\
    \ are attached to the people that using them, biometric characteristics are difficult\
    \ to steal or impersonate.\n\nBiometric traits are often broken into two categories:\
    \ physiological and behavioral. Physiological traits can be facial structure,\
    \ fingerprints, palm prints, hand structure, iris patterns, or even the sequence\
    \ of someone’s DNA. Behavioral traits include voice, signature, and even keystroke\
    \ patterns.\n\n### 7.2.3. Key Cards\n\nMany security measures employ key cards\
    \ for access to rooms. A key card uses the same form factor as a credit card,\
    \ making it easy for employees to carry in their wallets or ID holders. Key cards\
    \ may utilize magnetic stripes or chips (in a similar fashion to credit cards),\
    \ radio frequency identification (RFID), or near field communication (NFC).\n\n\
    Basic passive keycards are often subject to skimming and cloning attacks. Once\
    \ an attacker can gain access to the unique number stored on the card, they can\
    \ recreate the card. It is important to monitor areas where key cards are being\
    \ used to make sure additional hardware is not installed by an attacker to read\
    \ these numbers. It is also important to educate users of the system so they do\
    \ not share their key cards with others and report them if they go missing.\n\n\
    ### 7.2.4. Security Guards\n\nThe most versatile assets in any organization are\
    \ human assets and the same is true of security guards. Security guards can be\
    \ used to verify IDs, enforce rules, stopped forced entry, and take actions as\
    \ necessary. Given the expensive nature of human resources, security guards should\
    \ be employed in critical locations where risk is high. They may also benefit\
    \ greatly from staff awareness training even if their job description may be different\
    \ from the other employees you are training.\n\n### 7.2.5. Cameras\n\n![CCTV camera\
    \ and iFacility IP Audio speaker on a pole by RickySpanish used under CC-BY-SA\
    \ 4.0](images/cctv.jpg)\n\n[CCTV camera and iFacility IP Audio speaker on a pole](https://commons.wikimedia.org/wiki/File:CCTV_camera_and_iFacility_IP_Audio_speaker_on_a_pole.jpg)\
    \ by RickySpanish used under [CC-BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/deed.en)\n\
    \nCameras afford the operator an \"always on\" view of a location. Awareness that\
    \ all activity is being recorded can persuade attackers to aim for an easier target\
    \ or not continue with their nefarious actions. Even if an attacker persists the\
    \ camera footage can provide proof of the attack as well as evidence that can\
    \ be used later to track the attacker or make better security decisions.\n\nThe\
    \ \"eye in the sky\" seems to have the effect of keeping honest people honest,\
    \ but is often just seen as an obstacle for those intent on breaking the rules.\
    \ Despite this cameras do have several technological advantages. They can work\
    \ in no/low light conditions, can be remotely controlled and monitored, can store\
    \ footage remotely, can track motion, and can activate/alert on motion events.\
    \ Cameras are an integral part of most security plans.\n\n### 7.2.6. Mantraps\n\
    \n![](images/mantrap.svg.svg)\n\nA mantrap is a physical access control that requires\
    \ one person at a time enter through a door. Also known as air locks, sally ports,\
    \ or access control vestibules, mantraps are used to prevent tailgating, or following\
    \ another person through a secured door. These devices are often used with keycards\
    \ to ensure that only people who are supposed to have access to a building can\
    \ get in.\n\n## 7.3. Network Access\n\n### 7.3.1. Active Directory\n\nActive Directory\
    \ (AD) is a directory service typically used in Windows networks to control and\
    \ track resources. AD is a Microsoft technology that enables centralized network\
    \ management. It has proven to be very scalable and is commonly deployed in the\
    \ enterprise environment (corporations, universities, schools, etc.)\n\nActive\
    \ Directory relies upon the Lightweight Directory Access Protocol (LDAP) for its\
    \ communications. While AD is probably the largest deployed user of LDAP other\
    \ implementations for various operating systems exist, including Apple OpenDirectory,\
    \ RH Directory Server, and OpenLDAP. LDAP is often used by internal applications\
    \ and process.\n\nThe cornerstone of an AD environment is the Domain Controller\
    \ (DC). DCs stores directory information about Users, Groups, Computers, Policies,\
    \ and more. They respond to auth requests for the domain (network) they are supporting.\
    \ A standard network will have multiple DCs with fail-over in place in case something\
    \ goes wrong.\n\nFor many environments, AD is the mechanism used for authentication,\
    \ authorization, and accounting. As many services have migrated to the web, the\
    \ need to access AD from anywhere has become increasingly important. This has\
    \ kindled the growth of Azure Active Directory, a cloud-based version of active\
    \ directory. Increasingly we are seeing deployments that utilize cloud-based resources\
    \ instead of local DCs.\n\n### 7.3.2. Privileged Identity Management (PIM)\n\n\
    Privileged Identity Management (PIM) is a method of managing access to resources\
    \ such as locations, commands, audit reports, and services. PIM aims to provide\
    \ more granular access control. By recording more information about access it\
    \ allows for better reporting regarding suspicious behavior and anomalies. PIM\
    \ is used in the Windows operating system and for many Microsoft Azure services.\n\
    \n### 7.3.3. Privileged Access Management (PAM)\n\nPrivileged Access Management\
    \ (PAM) is a framework for safeguarding identities with advanced capabilities,\
    \ such as superusers in a \\*NIX system. PAM is common in the Linux world, where\
    \ it is used to control how administrators log in. PAM supports many more features\
    \ than the older \"become root and perform admin tasks\" model. With PAM passwords\
    \ can be set to expire, better auditing can be put in place, and privilege escalation\
    \ can be made temporary.\n\n### 7.3.4. Identity and Access Management (IAM)"
