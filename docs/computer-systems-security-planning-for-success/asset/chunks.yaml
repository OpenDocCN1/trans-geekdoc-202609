- raw: "Other similar one-way function exist based on elliptical curves. It turns\
    \ out that motion along an elliptical curve can be described according to a start\
    \ and end point and several iterations of a simple algorithm. You can reconstruct\
    \ the initial conditions if you know the start point, end point, and how many\
    \ iterations it took. If all you know is the start and end point you can’t determine\
    \ the initial conditions.\n\n## 2.5. Hashes\n\n![](images/hash.svg)\n\nA hashing\
    \ algorithm is a one-way function that creates hashed text from plaintext. It\
    \ is often used for data validation as a relatively small hash *digest* or *signature*\
    \ can demonstrate the integrity of a large block of data. Hashes can also be used\
    \ so that sensitive information does not have to be stored in cleartext. By storing\
    \ a hash of a password, you can check to see if the correct password was entered\
    \ without storing the password itself. In the case of a data breach only the hashes\
    \ are leaked and the attacker does not have access to the passwords to try with\
    \ other services.\n\nTwo main families of hash algorithms are used: MD5 and SHA.\
    \ MD5 produces a 128-bit hash value and is still often used to verify data integrity.\
    \ The algorithm is technically cryptographically broken, but you may still see\
    \ it in use. The SHA family of algorithms consists of SHA-1, SHA-2, and SHA-3:\n\
    \n*   SHA-1: 160 bits, similar to MD5, designed by the NSA, no longer approved\
    \ for cryptographic use\n\n*   SHA-2: SHA-256 and SHA-512, very common with the\
    \ number indicating the block size, designed by the NSA\n\n*   SHA-3: non-NSA\
    \ designed, not widely adopted, similar numbering scheme as SHA-2 (SHA3-256, etc.)\n\
    \nDictionary based attacks against password hashes are fairly common. Typically\
    \ software is used which generates a hash for every word in the dictionary and\
    \ then compares that hash to what is stored on the compromised machine. One way\
    \ to combat this is through salting or adding random bits to each password. When\
    \ salting the bits are stored with the hash. This forces a dictionary based attack\
    \ to actively generate the hashes based on what the salt is as opposed to using\
    \ a stored table (rainbow table) of all the possible hashes. It can make attacks\
    \ go from instant to days or even years depending on the complexity of the password.\n\
    \nAn even better way of combating attacks against hashes is through a secret salt\
    \ or *pepper*. A pepper is a random value that is added to the password but not\
    \ stored with the resulting hash. The random value can be stored in a separate\
    \ medium such as a hardware Security Module.\n\n## 2.6. Symmetric Encryption\n\
    \n![](images/symmetric.svg)\n\nSymmetric encryption is probably the simplest encryption\
    \ to understand in that it only uses a single key (in this case our key is labelled\
    \ 'A') to encrypt or decrypt data. Both parties need to know the private key in\
    \ order to communicate. It does pose a security risk in that if the channel used\
    \ for key exchange is insecure, all of the messages can be decrypted. That being\
    \ said, given that it is simpler than many other forms of encryption, it is often\
    \ used for secure communication or storage.\n\nOne-time-pad \n\nOne-time-pad (OTP)\
    \ is a rare example of a pen and paper, symmetric encryption scheme that cannot\
    \ be cracked. The difficulty in OTP mirrors the difficulty with all symmetric\
    \ encryption, namely that pre-shared keys need to be exchanged at some point.\n\
    \nImagine that a prisoner wishes to send encrypted messages to someone outside\
    \ the prison. To do so, they will make use of a copy of Harry Potter and the Sorcerer’s\
    \ Stone that they have in their cell. The message they want to send is \"DIG UP\
    \ THE GOLD\". They turn to \"Chapter One: The Boy Who Lived\" and look up the\
    \ first twelve letters in the chapter: MR AND MRS DURS. For each letter of their\
    \ message, they convert it to its number in the alphabet: 4 9 7 21 16 20 8 5 7\
    \ 15 12 4 (DIG UP THE GOLD). They do the same for the key they looked up in their\
    \ book: 13 18 1 14 4 13 18 19 4 21 18 19 (MR AND MRS DURS). Finally they add the\
    \ two numbers to get their ciphertext: 17 27 8 35 20 33 26 24 11 36 30 23.\n\n\
    If the prisoner sends that ciphertext to someone on the outside who knows that\
    \ they key is the first chapter of Harry Potter and the Sorcerer’s Stone, they\
    \ will be able to subtract the key from each of the numbers in the ciphertext\
    \ and discover the plaintext message. While theoretically unbreakable, anybody\
    \ else who has the key can recover the text as well. This means that using common\
    \ keys like popular books make it trivial for a man-in-the-middle to decode the\
    \ ciphertext. After all, the warden probably knows every book that the prisoner\
    \ has in their cell.\n\nOTP has been used by spy agencies, often for communications\
    \ between individuals via dead-drops. In this situation tables of random characters\
    \ printed in duplicate are exchanged as the key.\n\n## 2.7. Asymmetric Encryption\n\
    \n![](images/asymmetric.svg)\n\nAn asymmetric encryption algorithm has actually\
    \ already been demonstrated in the [Mathematical Foundation](#index.xhtml#_mathematical_foundation)\
    \ section. Asymmetric encryption has a public key which can be published anywhere\
    \ and used to encrypt messages that only the holder of the private key, which\
    \ is not published, can unencrypt. For example if you want to receive encrypted\
    \ emails you may make your [GNU Privacy Guard (GPG)](https://gnupg.org/) public\
    \ key available a [public key server](https://keyserver.ubuntu.com/). This would\
    \ allow anyone to look up your public key, encrypt a message that only you can\
    \ read, and send you the ciphertext. Asymmetric encryption gets around the difficulties\
    \ of key exchange via an untrusted channel (like email). Unfortunately the cost\
    \ of such a useful system is that asymmetric algorithms tend to be much slower\
    \ that their symmetric counterparts.\n\n## 2.8. Stream Ciphers\n\nStream ciphers\
    \ encode data one symbol at a time and produces one ciphertext symbol for each\
    \ cleartext symbol. Given that you can often use some sort of block encryption\
    \ with a significantly small block size, stream encryption is not used as often.\
    \ Technically the OTP example, when used one symbol at a time, is a stream cipher.\
    \ The keys come in one symbol at a time, the cleartext comes in one symbol at\
    \ a time, and an operation is performed (addition in the case of the example)\
    \ to create the ciphertext. Given a suitable keysize and a well-researched algorithm,\
    \ stream ciphers can be just as secure as block ciphers. That being said a stream\
    \ cipher is usually more consistent in its runtime characteristics and typically\
    \ consumes less memory Unfortunately there are not as many well-researched algorithms\
    \ and widely used stream ciphers.\n\n## 2.9. Block Ciphers\n\nBlock ciphers takes\
    \ the data in, in blocks and use cipher blocks of the same size to perform the\
    \ encryption. It is very popular and there are many secure algorithms to choose\
    \ from. Unfortunately if the input data doesn’t fit neatly into blocks of the\
    \ same size, padding may be required, which takes up more space/memory and reduces\
    \ the speed of the cipher. As such the block encryption is often less performant\
    \ than stream encryption.\n\n### 2.9.1. Block Cipher Modes of Operation\n\nThere\
    \ are several ways you can create your cipher blocks and depending on how you\
    \ do it, various attacks are possible:\n\n#### Electronic Codebook (ECB)\n\n![WhiteTimberwolf\
    \ (SVG version), Public domain, via Wikimedia Commons](images/ecb.svg)\n\n[WhiteTimberwolf\
    \ (SVG version)](https://commons.wikimedia.org/wiki/File:ECB_encryption.svg),\
    \ Public domain, via Wikimedia Commons\n\nThe simplest mode of operation, data\
    \ is divided into blocks and each block is encoded using a key. Since the blocks\
    \ are encoded the same way, identical blocks will give identical ciphertexts.\
    \ This makes it easier, given enough data, to determine what the key is.\n\n####\
    \ Cipher block chaining (CBC)\n\n![WhiteTimberwolf (SVG version), Public domain,\
    \ via Wikimedia Commons](images/cbc.svg)"
