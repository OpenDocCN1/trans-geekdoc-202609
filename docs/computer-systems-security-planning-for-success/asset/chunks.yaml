    technique that requires actors to provide two or more pieces of information to
    be used as identification. Some examples of identification would be usernames
    and passwords, token codes, a physical token, or biometric data. Typically it
    is suggested to use "something you have and something you know" for example the
    code in an SMS message to your phone (you have your phone) and a password (you
    know your password). ¶ There are many popular products for MFA, most of which
    are based on the time based creation of a code. [Google Authenticator](https://play.google.com/store/apps/details?id=com.google.android.apps.authenticator2&hl=en_US&gl=US)
    and [Authy](https://authy.com/) are each phone applications which generate codes
    from a cryptographic seed which is synced with the verifying system. RSA IDs generate
    similar codes on a dedicated hardware device. ¶ 7.1.3. MAC, DAC, RBAC, and ABAC
    ¶ There are several different authorization models that can be used. Mandatory
    Access Control (MAC) requires all objects (files, directories, devices, etc.)
    to have a security label that identifies who can access it and how. This is a
    particularly stringent form of access control which requires a great deal of effort
    to implement and maintain, but results in a high level of security. Discretional
    Access Control (DAC) simplifies things by allowing owners of objects to determine
    which permissions groups/users should be given to that object. This offers great
    flexibility and ease of implementation, but can result in a less secure environment
    if the owner of the object is compromised. Role-Based Access Control (RBAC) builds
    off of DAC uses a core set of roles within a system to determine who has different
    levels of access to objects. RBAC is a common and flexible model which can be
    intelligently used to implement DAC or MAC. Attribute-Based access control (ABAC)
    is a newer model that builds off of RBAC and uses more general attributes instead
    of just roles. ABAC can determine who has different levels of access to objects
    based on the attributes of the object, the user, the action, or even an external
    context. These attributes can be used together in any way that can be codified
    into a rule. For example, "Give Fred read access to non-classified documents in
    this folder from 9:00AM to 5:00PM." ¶ '
