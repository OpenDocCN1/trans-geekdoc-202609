    ## 5. 攻击


    ### 5.1. 拦截攻击


    拦截攻击依赖于拦截网络通信的能力。这可能是由于所使用网络的性质，或者有时可能会利用其他方法来更好地定位攻击者。这些攻击通常涉及伪造虚构消息、记录传输的数据，或在网络上篡改消息内容。这一类攻击使
    CIA 三要素的所有部分都面临风险。


    #### 5.1.1. MitM


    中间人攻击（MitM）是一个统称，适用于攻击者拦截通信的情况。典型的攻击涉及窃听，并可能修改两方之间的消息。可以使用加密来缓解攻击，使攻击者无法解密他们正在拦截的消息。话虽如此，必须特别注意握手/密钥交换协议，以确保攻击者无法获得正在使用的密钥。以下是
    MitM 被用来拦截和修改公钥交换的示例：


    在上面的示例中，MitM 允许第一条消息无干扰地通过，但篡改了公钥交换。通过将自己的公钥传递给 Bob，MitM 有能力解密 Bob 发送的消息，并仍然可以使用
    Alice 的公钥重新加密消息并将其传递给她。你可以看到，如果以这种方式交换两个公钥，就有可能设置一个 MitM 攻击，尽管有加密，所有消息都可以被看到。


    #### 5.1.2. MitB


    MitB 代表浏览器中间人，通常是由特洛伊木马安装恶意软件引起的，该恶意软件允许攻击者拦截/修改浏览器和服务器之间的通信。这可以用于捕获表单上的数据、修改输入或修改服务器的响应。通常，MitB
    攻击中使用的软件会处于休眠状态，直到受害者浏览到目标网站。以下是 MitB 攻击如何用于修改在线银行请求以汇款的示例：


    正如你所看到的，攻击者最终得到了 10,000 美元，而受害者只是认为他们授权了向他人支付 1,000 美元。这些攻击可能难以检测，因为它们发生在浏览器内部，并且是机会主义的。


    #### 5.1.3. 重放攻击


    这一类攻击通常涉及 MitM 制作传输的副本并重放它来冒充受害者。登录凭据、简单哈希和特定命令有时容易受到这种类型的攻击。解决方案是使用时间戳、随机数（该特定会话的随机数）、旋转密钥或计数器，以确保命令不能在上下文之外执行。


    一次性密码


    为了帮助缓解重放攻击，在线银行应用程序可能要求客户在提交事务时使用一次性密码（OTP）。OTP 是一个经常变化的值，客户端和服务器都已知。存在多种一次性密码方案，其中大多数使用客户端和服务器之间共享种子的加密哈希函数。客户端和服务器会定期基于种子更新到新哈希，如果没有种子，就不可能知道下一个哈希是什么。通过使用
    OTP，任何拦截流量的人都无法执行重放攻击，因为密码不会是当前的。


    #### 5.1.4. SSL 绕过


    MitM 阻止 HTTPS 升级并窃取密码


    如果你考虑上面 MitM 示例中给出的拦截密钥交换，类似的攻击可以允许攻击者查看 SSL 流量。攻击者给受害者一个虚假的证书颁发机构（CA）证书，受害者安装它。这通常通过特洛伊木马完成。然后，攻击者将自己置于未启动的安全连接中间。在密钥交换期间，攻击者为攻击者和受害者之间的连接创建一个由虚假
    CA 签名的自定义证书。攻击者还与服务建立实际的 HTTPS 连接，并为受害者代理数据。受害者的所有数据都将以明文形式显示给攻击者，但连接对受害者来说将显得是安全的。这在
    Fiddler 调试代理中用于解密 HTTPS 流量，也用于一些执行深度数据包检测的网络设备中。


    对 SSL 的另一种 MitM 攻击只是与受害者保持或降级到 HTTP 连接，并将数据代理到与服务器的实际 HTTPS 连接。大多数服务器会升级不安全的连接，但通过拦截该交换，攻击者可以继续监控受害者的流量。


    ### 5.2. 网络层攻击


    #### 5.2.1. MAC 欺骗/MAC 克隆


    大多数网络期望 MAC 地址将与网络接口控制器（NIC）上的唯一编号对应，但实际上更改它相当容易。虚拟网络需要使用不同 MAC 地址的功能，此功能内置于大多数现代操作系统中。MAC
    欺骗是指攻击者将其 MAC 地址设置为网络上另一台机器的 MAC 地址，以试图发起攻击。例如，他们可能将自己设置为网关以发起 MitM 攻击。


    #### 5.2.2. MAC 泛洪


    交换机的任务是跟踪哪些 MAC 地址对应交换机上的哪些端口。它们使用此功能来确保流量仅路由到需要去的地方。鉴于 MAC 地址可以更改，攻击者可以用许多不同
    MAC 地址的数据包淹没交换机，并可能溢出 MAC-端口路由表。某些交换机可能默认采用集线器类似的功能，并将帧发送到所有端口，以努力保持流量流动。这随后允许攻击者捕获网络上其他机器的流量。


    #### 5.2.3. ARP 毒化


    攻击者也可以使用 ARP 数据包来冒充网络上的另一台机器，例如网关路由器。通过反复发送 ARP 数据包， gratuitous arp，将绑定到网关 IP
    的数据包重定向到攻击者的 MAC 地址，攻击者可以设置 MitM 场景。这尤其困难，因为取决于 ARP 缓存的 TTL，正常网络操作可能需要长达 20 分钟才能恢复。


    ### 5.3. 互联网层攻击


    #### 5.3.1. IP 欺骗


    不幸的是，互联网协议（IP）在设计时并未考虑安全性。这意味着默认情况下，任何 IP 地址都可以放入数据包头，数据包仍会被转发到网络。这导致 IP 可以被欺骗并发送恶意数据包的问题。在该层面，对此问题没有很好的解决方案。这意味着数据包的来源通常需要在更高层进行身份验证，并且协议必须考虑到
    IP 层本质上是不安全的。


    Smurf 攻击


    Smurf 攻击是欺骗 IP 地址如何导致重大问题的绝佳示例。Smurf 攻击是一种早期的分布式拒绝服务攻击。攻击者会创建一个 ICMP 回显请求，将受害者的
    IP 地址作为源地址。此回显请求将指向子网的广播 IP 地址。子网上的许多客户端将响应回显请求，用响应淹没受害者。这种攻击的不对称性，即单个数据包可能引发数百个响应，使其特别难以处理。使用
    Smurf 攻击，攻击者可以用最小的带宽让受害者陷入困境。现代客户端不再响应指向广播的 ICMP 回显请求，从而缓解了这种攻击的风险。


    ### 5.4. 名称解析攻击


    #### 5.4.1. DNS 缓存毒化


    DNS 解析器可能被诱骗缓存错误信息并将其提供给其他客户端。在此场景中，攻击者通过用伪造的源 IP 响应 DNS 查询来承担权威 DNS 服务器的角色。之所以可能，原因之一是
    DNS 查询响应通常是单个未经身份验证的数据包。一旦服务器拥有无效的 DNS 缓存条目，它将在条目的 TTL 期间继续将用户引导到错误的 IP 地址。DNSSEC
    可以通过强制对 DNS 答案进行身份验证来缓解这些攻击。


    #### 5.4.2. LLMNR 劫持


    在此场景中，攻击者响应链路本地多播名称解析（LLMNR）广播并冒充身份验证服务器。毫无戒心的受害者输入他们的凭据，这些凭据随即被窃取。可以通过在网络上禁用
    LLMNR 来缓解此攻击。


    ### 5.5. 基于 Web 的攻击


    万维网及其使用的协议/格式/语言（HTTP、HTML、JavaScript 等）最初并非以安全为设计目标。默认情况下，网页信任其接收的内容不是恶意的。脚本、命令、Cookie
    等被隐式信任。Web 技术变得如此流行，以至于它们成为攻击者的常见目标，开发人员必须使用令牌、清理数据和检查输入，如果他们希望这些技术是安全的。


    开放 Web 应用程序安全项目（OWASP）是 Web 应用程序安全资源的绝佳来源。他们维护着 Web 应用程序安全风险的前 10 名列表。截至 2021
    年，OWASP 前 10 名是：


    访问控制失效

    加密失败

    注入

    设计不安全

    安全配置错误

    易受攻击且过时的组件

    身份识别和身份验证失败

    软件和数据完整性失败

    安全日志记录和监控失败

    服务器端请求伪造


    #### 5.5.1. XSS


    跨站点脚本是指不良行为者将脚本注入网站的过程。请记住，许多网站从表单获取输入，并可能在另一个页面上显示该数据。如果该数据不仅仅是数据，而是实际上是一个 JavaScript
    脚本，那么该脚本可能会在显示它的页面上运行。


    使用此技术，攻击者可以访问 Cookie、会话令牌和其他敏感信息。取决于脚本注入的位置以及服务器如何显示该数据，脚本可能会永久存储在目标服务器上。XSS 脚本也可能被反射，通常发送在链接中，仅用于一次会话。


    为了缓解 XSS 风险，Web 开发人员清理输入非常重要。当提交表单时，网站应检查提交的数据是否不是脚本或其他恶意内容。如果数据无法清理，则不应存储或使用。


    Samy 蠕虫


    2005 年 10 月 4 日，一个 XSS 蠕虫在当时占据主导地位的社交网络 MySpace 上传播。该蠕虫由 Samy Kamkar 编写，作为一条简单的帖子，当被阅读时，会导致查看者的机器发布他们自己的帖子，内容为
    "but most of all, samy is my hero" 并包含传播代码。结果是，在 20 小时内，超过一百万用户运行了有效载荷。


    现在 Samy 是一位知名的安全顾问，你可以在此处阅读他关于蠕虫的完整技术解释。Vice Motherboard 也为其 Greatest Moments
    in Hacking History 系列制作了一段关于 Samy 的节目。


    #### 5.5.2. CSRF


    跨站点请求伪造（CSRF）涉及使用受害者已验证的会话，在不属于该会话的请求中进行操作。想象一下，你已登录 Twitter。攻击者向你发送一个 GMail 中的表单链接，当点击时，它会发布一条推文，内容为
    "I’m a CSRF victim." 假设 Twitter 接受表单提交，你现在将在时间线上有一条推文，内容为 "I’m a CSRF victim."


    这可能是最良性的场景，你可以想象在在线银行应用程序中情况会糟糕得多。解决方案是网站（在此例中为 Twitter）使用 CSRF 令牌（它确实如此）。当生成表单时，会将一个随机值作为隐藏输入包含在内。该随机隐藏输入就是
    CSRF 令牌。当提交时，如果提交的 CSRF 令牌与为表单创建的令牌（只有有效网站知道）不匹配，则不接受提交。


    CSRF 令牌是 Web 应用程序需要主动安全而非安全设计的又一个示例。大多数 Web 应用都在使用它们，但开发人员很容易忘记。


    #### 5.5.3. SSRF


    Web 系统通常与内部服务器通信以检索信息。这些可能是 API 服务器、数据库或消息服务器。如果攻击者能诱骗 Web 服务器将恶意请求传递给其内部服务器，攻击者就可以滥用系统的内部信任。这被称为服务器端请求伪造（SSRF）。再次，这种攻击通过输入验证来缓解，输入验证需要包含在应用程序中。


    #### 5.5.4. 会话劫持


    会话劫持可能涉及其他妥协方法，但最终目标是“窃取”受害者与另一台服务器之间的会话。想象以下场景：一个人登录到他们的个人银行网站，该网站向他们发放一个 Cookie，证明他们已通过身份验证。不良行为者正在通过
    XSS 漏洞监控连接，该漏洞将所有连接 Cookie 转发给他们。不良行为者使用发放的 Cookie，从用户的银行账户向不良行为者的银行账户进行转账。


    取决于所使用的方法，会话劫持可以通过使用更好的会话密钥或要求使用传输层安全性（TLS）来连接来防止。在上述场景中，防止会话劫持的唯一方法是修复初始 XSS
