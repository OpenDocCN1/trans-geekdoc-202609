    ## 7. 访问控制


    访问控制旨在提供工具，用于针对特定资源进行识别、身份验证、授权和审计。虽然单个控制可能提供多个部分，但了解每个部分代表的含义仍然很重要：


    ### 识别


    识别行为者或用于识别行为者的事物的行为。这可能简单如驾驶执照，也可能复杂如只有私钥持有者才能生成的加密签名。示例：送货司机出示员工徽章。


    ### 身份验证


    当身份通过特定过程得到确认时，此步骤发生。这可能是使用私钥的过程，或者是另一种生物识别过程，例如读取指纹。无论哪种情况，身份验证都是我们验证身份的方法。示例：检查送货司机的徽章。


    ### 授权


    授权是指给予行为者访问资源的权限。在日常交谈中，我们可能会认为一旦行为者进展到这一步，授权就是理所当然的，但实际上授权依赖于前面步骤的完成，并且实际上可能会失败。系统可能已通过用户名和密码进行身份验证来识别某人是谁，但该用户未设置为有权访问资源。在这种情况下，授权步骤将失败。继续我们的送货司机示例：允许送货司机取件。


    ### 审计


    最后，审计是记录对资源访问记录的过程。审计可能是已登录用户的日志以及他们各自访问了哪些资源的日志。同样，对于送货司机：司机的访问记录写在前台的登记簿中。


    ## 7.1. 一般原则和技术


    ### 7.1.1. 最小权限


    最小权限原则指出，行为者应仅获得完成其任务所需的资源和所需权限。这些资源可以是进程、程序，甚至用户帐户。此原则减少了攻击面，并有助于防止恶意软件传播，因为单个被攻破的帐户将无法访问所有资源。


    最小权限也是合规目的的重要概念。例如，法律可能要求审计所有具有互联网访问权限的帐户。通过将具有互联网访问权限的帐户限制为仅完成任务所需互联网访问权限的行为者的帐户，可以更容易地实现合规。


    ### 7.1.2. 多因素身份验证 (MFA)


    多因素身份验证是一种技术，要求行为者提供两个或多个信息片段用作身份识别。身份识别的一些示例包括用户名和密码、令牌代码、物理令牌或生物识别数据。通常建议使用“拥有的东西和知道的东西”，例如发送到您手机的短信中的代码（您拥有手机）和密码（您知道您的密码）。


    有许多流行的 MFA 产品，其中大多数基于基于时间的代码生成。Google Authenticator 和 Authy 均为手机应用程序，可从与验证系统同步的加密种子生成代码。RSA
    ID 在专用硬件设备上生成类似代码。


    ### 7.1.3. MAC、DAC、RBAC 和 ABAC


    可以使用多种不同的授权模型。强制访问控制 (`MAC`) 要求所有对象（文件、目录、设备等）都具有安全标签，以标识谁可以访问它以及如何访问。这是一种特别严格的访问控制形式，需要大量努力来实现和维护，但可实现高安全级别。自主访问控制
    (`DAC`) 通过允许对象所有者确定应将哪些权限组/用户授予该对象来简化事物。这提供了极大的灵活性和实现便利性，但如果对象所有者被攻破，可能会导致安全性较低的环境。基于角色的访问控制
    (`RBAC`) 在 `DAC` 的基础上构建，使用系统中的一组核心角色来确定谁对对象具有不同级别的访问权限。`RBAC` 是一种常见且灵活的模型，可以智能地用于实现
    `DAC` 或 `MAC`。基于属性的访问控制 (`ABAC`) 是一种较新的模型，在 `RBAC` 的基础上构建，并使用更通用的属性，而不仅仅是角色。`ABAC`
    可以根据对象、用户、操作甚至外部上下文的属性来确定谁对对象具有不同级别的访问权限。这些属性可以以任何可以编码为规则的方式组合使用。例如，“从上午 9:00
    到下午 5:00，授予 Fred 对此文件夹中非机密文档的读取权限。”


    表 2. DAC、MAC、RBAC 和 ABAC 的比较


    ![Malware Distribution by OS (Q1 2020)](img/malware.png)


    恶意软件最主要的目标是 Windows 操作系统，差距相当大。这很大程度上是因为它作为桌面操作系统的流行度。第二大目标是 Web 浏览器，它们为恶意软件提供了独特的跨平台覆盖。第三大目标是
    Android 移动操作系统，虽然从技术上讲它是 Linux，但主要在手机上运行。Linux 和 Mac 受到的恶意软件关注较少。这可能部分归因于 Linux
    的开源性质以及 Mac 使用的 BSD 内核，但也部分归因于这两种操作系统各自缺乏流行度。恶意软件通常广泛分发，这意味着它可以只针对最流行/可能最薄弱的环节，并且仍然可以成功。


