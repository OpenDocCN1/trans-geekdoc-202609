    \ each lacks individually. As such, encryption will show up multiple times and\
    \ in multiple ways in an average security plan.`\n\n## 1.7. Lab: Think Like a\
    \ Hacker\n\nFor this lab, we will be engaging in a thought experiment. Imagine\
    \ you are at a university that is having a student appreciation breakfast. At\
    \ the entrance to the cafeteria an attendant has a clipboard with all of the student\
    \ IDs listed. Students line up, show their ID, and their ID number is crossed\
    \ off of the list.\n\nThinking like a hacker, how would you exploit this system\
    \ to get extra free breakfasts? Feel free to think outside the box and make multiple\
