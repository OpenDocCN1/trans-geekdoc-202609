    # 6. 安全解决方案


    为了帮助应对安全漏洞，许多不同的供应商提供安全解决方案。这些解决方案可能是旨在帮助缓解安全威胁的硬件或软件。安全解决方案可以在内部开发，由第三方定制开发，也可以外包并作为服务提供。在评估解决方案时，制定计划并了解该产品的功能和可能存在的陷阱非常重要。


    ## 6.1. 误报 / 漏报


    当安全解决方案检测到威胁，但实际上不存在威胁时，这就是误报。取决于解决方案的复杂程度，它可能会使用一组规则、妥协指标，甚至可能使用人工智能来触发其警报系统。在解决方案产生大量误报的情况下，团队逐一检查每个警报会非常疲惫。最终，团队会被训练成忽略警报，这使得安全解决方案变得毫无用处。


    降低系统误报率的关键是更好地调整用于触发警报的规则集。安全团队可能会花时间确定事件基线，并寻找与实际攻击相对应的异常情况。然后可以利用这些信息来构建更好的检测系统。


    ### Webroot 杀毒软件


    2017 年，一款流行的杀毒服务创建了一条错误规则，将某些 Windows 操作系统文件识别为威胁。该杀毒解决方案将这些文件隔离，而这些文件对机器的运行至关重要。结果是机器无法使用。


    长达 13 分钟，Webroot 将此规则分发到其杀毒软件中，导致无数机器停止运行。幸运的是，Webroot 能够快速识别问题并发送更新，该更新本可以让机器自动修复问题。不幸的是，分发更新的基础设施很快就超载了。


    当安全解决方案未能识别威胁时，这被称为漏报。虽然没有任何解决方案可以 100% 有效，但漏报会削弱人们对产品的信心。漏报可能由技术娴熟的 SOC 团队通过密切监控正在发生的事情来解决。也可以通过分层安全（Layered
    Security）来解决漏报，这是一个我们将在下一节介绍的概念。


    ## 6.2. 分层安全


    鉴于单一安全解决方案永远无法 100% 有效，因此分层处理安全并使用多个系统是合理的。解决方案之间通常存在大量重叠，虽然在其他领域这可能看起来效率低下，但在网络安全中，我们将其视为一种好处。通过使用多个解决方案，有时称为多层安全或纵深防御，你可以构建更强大的防护来应对漏洞。


    让我们看一个例子，了解分层安全如何帮助减轻现实世界攻击的影响。假设 SOC 正在支持自托管机器上的 Web 应用程序。恶意行为者希望从 Web 应用程序中窃取数据。他们首先测试是否存在多种
    SQL 注入攻击，看是否有任何结果。


    设计良好的 Web 应用程序应该清理其输入，并可能防止查询到达数据库。同样，警报团队可能会注意到 SQL 查询突然激增，远超应用程序的常规基线。入侵检测系统（IDS）可能会将查询标记为已知的
    SQL 注入攻击。假设攻击绕过了应用程序、团队和 IDS，那么数据库用户可能配置了最小权限原则，查询将因缺乏权限而无法执行。


    正如你所看到的，任何一层都可能失效，但通过拥有多个层，攻击发生的机会将大大降低。


    ## 6.3. 网络解决方案


    有许多产品可用于处理网络流量。它们通常被营销为独立设备、安装在内部设备上的软件，或者是将流量路由到外部设备的订阅服务。在云计算时代，网络安全即服务正变得越来越流行。


    ### 6.3.1. 防火墙


    防火墙是一种服务/软件/设备，用于阻止不需要的流量并允许需要的流量。通常，防火墙是私有网络和 Internet 之间的屏障。


    像 `nftables` 这样的软件可以用于在 Linux 路由器上为许多内部客户端构建防火墙。内部客户端也可以运行基于主机的防火墙，例如 Windows
    Defender 防火墙。最后，许多供应商（包括 Palo Alto 和 Cisco）提供插件式防火墙设备的硬件解决方案。可以使用这些解决方案的任何组合。


    防火墙通常采用关于哪些数据包可以进入以及如何处理它们的规则。例如，防火墙可能有一条规则，允许来自外部主机在端口 22 上的数据包。这将允许 SSH 连接。同样，防火墙可能有一条规则来跟踪内部到外部的连接请求并执行网络地址转换（`NAT`）。在
    IPv4 网络上，防火墙通常也会执行 `NAT`。


    下一代防火墙（`NGFW`）执行标准防火墙的相同功能，但还采用集成的入侵防御系统（`IPS`）来缓解威胁。防火墙是执行这些操作的完美位置，因为它可以轻松关闭连接。`NGFW`
    经常宣传人工智能威胁监控和自动威胁情报更新（通常是更新攻击签名）。`NGFW` 也可以轻松在 Linux 设备上构建，方法是将 `IPS` 与 `netfilter`
    防火墙结合使用。


    网络基础设施还可以使用防火墙外的一个特殊空间，称为非军事区（`DMZ`）。需要直接连接到 Internet 的服务器通常被放置在 `DMZ` 中，这样它们就不必处理限制性的防火墙规则。这些服务器可用于检测恶意活动、监控传入流量，或处理基本请求，例如提供静态网页。


    世界上最大的防火墙是中国的防火长城，始于 1998 年，旨在防止外部影响进入中国。它是一个用于阻止 IP、劫持 DNS 查询、限制流量并执行中间人（MitM）解密的系统。防火长城由执行数据包检查和内容过滤的代理和防火墙组成。VPN
    经常在中国被用来绕过防火长城，而防火长城也在不断更新，以尝试检测并关闭此类流量。


    ### 6.3.2. 代理


    代理通常位于用户和外部网络之间。代理可以代表用户接收和发送请求，从而完全控制进出的流量。


    代理可用于缓存、访问控制、URL 过滤、内容扫描，甚至数据包检查。代理解决方案可以是显式的或透明的，并由许多公司提供，包括 McAfee、Fortigate、Netsparker
    和 Palo Alto。代理的典型应用是在学区网络上过滤露骨内容。


    代理还可以分为正向和反向配置。正向代理将来自私有或内部网络的请求传递到 Internet。正向代理可以通过缓存加快本地请求，并验证是否应执行该请求。正向代理与标准防火墙和网络地址转换（`NAT`）互操作。


    反向代理接收来自外部源的请求并将其传递给内部服务。这有助于防止客户端直接访问内部服务。反向代理也可以利用缓存并验证请求。反向代理还可以配置为与防火墙协同工作。与过去通常将服务器放置在防火墙外的非军事区（`DMZ`）中不同，现在更常见的是使用反向代理来访问该服务器。


    ### 6.3.3. 负载均衡器


    反向代理的常见应用是充当流量的负载均衡器。负载均衡器将工作（以外部客户端请求的形式）分配给内部资源，通常是服务器。


    例如，如果一家公司有四台服务器支持 Web 应用程序，他们可以使用反向代理负载均衡器，该负载均衡器接收来自客户端的请求并将该请求传递给四台内部服务器之一。使用不同的指标来确定服务器的利用情况，包括最少使用（轮询）、加权、最少活动连接数。负载均衡器优化带宽并提高可用性。


    ### 6.3.4. VPN


    虚拟专用网络（`VPN`）用于加密两个网络之间或客户端与网络之间的 Internet 流量。`VPN` 已成为连接远程办公室或连接远程员工的标准程序。鉴于在家办公的增长，几乎所有用户都熟悉什么是
    `VPN` 以及它的作用。


    站点到站点 `VPN` 通常用于连接办公室。这种 `VPN` 是永久开启的。例如，连接两个大学校园：NJIT 纽瓦克分校和 NJIT 泽西市分校。在这种情况下，两个校园的用户都期望随时能够安全地连接到对面校园的服务。流量经过加密并通过
    Internet 传输。


    远程访问 `VPN` 由个人用于连接到安全网络。这种 `VPN` 通常通过 Cisco AnyConnect 等应用程序启动。当应用程序运行时，用户能够像在办公室一样安全地访问内部资源。


    许多供应商提供 `VPN` 产品，包括 Cisco、Citrix、Fortinet、Palo Alto 和 Checkpoint。还有许多开源选项可用于构建
    `VPN`，包括 OpenVPN、WireGuard 和 IPsec。


    ### 6.3.5. TAP


    有时，网络或安全工程师需要监控特定网络段上发生的情况。在这种情况下，可以使用网络终端访问点（`TAP`）。`TAP` 会创建网络流量的副本，并将其转发到交换机或路由器上的特定端口。


    ## 6.4. EDR


    端点检测与响应（`EDR`）用于保护端点：服务器、工作站、桌面、移动设备等。`EDR` 通常实现为基于主机的事件预防系统（`HBIPS`），即运行在端点上以监控和收集数据的软件。


    这些系统通常会监控妥协指标，扫描恶意软件，并可根据需要隔离或关闭端点。公司硬件对任何企业来说都是一项重大投资，而 `EDR` 确保该投资得到保护。存在许多
    `EDR` 系统，包括 FireEye、SEP 和 CrowdStrike。


    ## 6.5. 数据防泄漏


    数据防泄漏（`DLP`）解决方案旨在防止敏感数据的窃取。这可能包括个人身份信息（`PI`）、医疗记录、社会安全号码（`SSNs`）、信用卡号码等。通常，`DLP`
    要么在端点和服务器上运行（静态数据），要么在网络上运行（动态数据）。


    网络 `DLP` 解决方案可能会监控电子邮件或 Web 流量中的敏感字符串，例如 `SSNs`。当在电子邮件中检测到 `SSN` 时，电子邮件会被隔离并发送警报。服务器和端点
    `DLP` 解决方案可能会定期扫描系统，查看是否存储了敏感字符串。如果是一个不应该访问敏感数据的系统，将发送警报。端点上的 `DLP` 还可以限制 USB
    使用或大量数据传输等任务。


    ## 6.6. IDS/IPS


    入侵检测系统和入侵防御系统是监控网络流量以检测/防止攻击的系统。这些系统可能会在流量中查找已知的漏洞利用，例如 SQL 注入模式，并在检测到时触发警报。入侵防御系统会更进一步，实际上会关闭连接或终止违规进程。


    这些系统使用漏洞利用签名或 ID，这些是妥协指标（`IoCs`）、异常或奇怪行为。IDS/IPS 的强大之处往往来自其签名数据库的更新程度。该类别中有许多解决方案，包括
    Splunk、QRadar、CrowdStrike 和 SolarWinds。


    ## 6.7. 电子邮件解决方案


    用于发送/接收电子邮件的原始协议很简单，并非为我们今天面临的挑战而设计。SPAM 和钓鱼电子邮件不幸的是很常见，可以通过电子邮件客户端插件来解决，这些插件会扫描病毒或使用模式来识别钓鱼电子邮件。其中许多工具已经内置在
    Google 的 GMail 或 Microsofts Exchange 中。


    另一个重大挑战是验证电子邮件的发件人。目前存在三种常见方法：发件人策略框架（`SPF`）、域密钥识别邮件（`DKIM`）和基于域的消息认证、报告和一致性（`DMARC`）。


    `SPF` 利用 DNS 域上的 TXT 记录来验证发件人的 IP。当接收到入站邮件时，会检索发件人域的 `SPF` 信息，从而获得允许的 IP 列表。例如，NJIT
    的 `SPF` 记录目前如下所示：


    ```

    v=spf1 ip4:128.235.251.0/24 ip4:128.235.209.0/24 ip4:66.207.100.96/27 ip4:66.207.98.32/27
    ip4:205.139.104.0/22 ip4:206.79.6.0/24 ip4:209.235.101.208/28 ip4:216.185.73.96/27
    ip4:69.196.241.0/28 ip4:69.196.242.128/28 ip4:46.183.242.192/28 ip4:202.38.144.192/28
    ip4:69.196.236.208/28 ip4:103.225.232.128/28 ip4:37.216.222.128/28 ip4:64.125.200.96/28
    ip4:74.217.49.0/25 ip4:69.25.227.128/25 ip4:52.45.50.190 ip4:198.187.196.100 include:_netblock.njit.edu
    include:spf.sparkmail.org ~all

    ```


    需要注意的是，并非所有这些 IP 都属于 NJIT。有些可能是代表 NJIT 发送电子邮件的群组，例如大量邮件发送器、Web 应用程序等。当正确配置时，`SPF`
    可防止攻击者冒充来自某个域的电子邮件。


    `DKIM` 利用公钥和私钥加密来确保电子邮件来自特定的 SMTP 服务器。域的公钥通过特定域的 TXT DNS 记录进行宣传。该域的 SMTP 服务器使用私钥对正在发送的电子邮件进行签名。接收的
    SMTP 服务器随后可以验证消息是否来自该域的有效 SMTP 服务器。私钥也可以分发给代表该域发送电子邮件的 SMTP 服务器。


    `DMARC` 对 `SPF` 和 `DKIM` 验证应用策略。`DMARC` 回答诸如“如果消息来自有效的 `SPF` IP 但没有有效的 `DKIM`
    签名，我该怎么办？”或“对于看起来像 SPAM 但具有有效 `DKIM` 签名的消息，我该怎么办？”等问题。`DMARC` 将许多用于验证电子邮件的工具结合在分层方法中，以确定是放行、隔离还是阻止电子邮件。


    ## 6.8. SIEM


    安全信息和事件管理是一种用于实时监控安全信息的系统。通常，SIEM 系统会显示事件的仪表板，并具有生成报告或创建工单的功能。它可以是独立设备、内部设备上的软件，甚至是第三方服务。一些流行的
    SIEM 示例包括 QRadar、Splunk 和 Azure Sentinel。


    ## 6.9. 实验：利用 log4j


    在本实验中，我们将研究 log4j 漏洞，CVE-2021-44228。该漏洞利用了许多 Java 应用程序（包括 Apache、neo4j、Steam、iCloud
    和 Minecraft）使用的常见日志记录库中的一个缺陷。任何能够导致消息被记录的攻击者都可以使用 Java 命名和目录接口（`JNDI`），并导致目标连接到另一台服务器（在我们的示例中为
    LDAP），并加载远程 Java 类文件。该文件可以包含攻击者希望注入到服务器进程中的任何代码。


    做一些研究：log4j 的哪些版本受此漏洞影响？


    本实验使用 Docker Compose 配置来模拟一个包含攻击者和目标的网络。目标运行一个由 leonjza 编写的已知易受攻击的示例应用程序。此示例应用程序记录请求的
    User-Agent 标头、请求路径和查询字符串参数，如下所示：


    ### Listing 13. App.java


    ```

    package com.sensepost.log4jpwn;

    ```


