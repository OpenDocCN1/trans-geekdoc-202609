    \ basically leaving digital footprints that show someone did something. This means\
    \ that cryptography allows us to provide authentication, authorization, `and`\
    \ accounting (AAA).\n\nBy using a secure and `confidential` encrypted channel\
    \ we can be sure that anyone who intercepts our communications cannot \"listen\
