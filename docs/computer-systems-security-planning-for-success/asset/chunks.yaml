    \ 5.5 |\n\n# 1\\. Introduction\n\n## 1.1. Managing Risk\n\n![RRZEicons, CC BY-SA\
    \ 3.0, via Wikimedia Commons](images/db-locked.png)\n\n[RRZEicons](https://commons.wikimedia.org/wiki/File:Database-locked.svg),\
    \ [CC BY-SA 3.0](https://creativecommons.org/licenses/by-sa/3.0), via Wikimedia\
    \ Commons\n\n*Information security* (infosec) is largely the practice of preventing\
    \ *unauthorized access* to data. Unauthorized access is when an actor gains access\
    \ to data that they do not have the permissions to access. The system is often\
    \ used in an unintended manner to provide such access. Data has become an increasingly\
    \ valuable asset and the *risks* of others having access to data are incredibly\
    \ high. Because of this, information security typically falls under the risk-management\
    \ plan of a company and its importance cannot be understated. This is evidenced\
    \ by the fact that information technology’s (IT) typical role in a company has\
    \ migrated from a basic service provider to directorships with a seat at the highest\
    \ decision making table. This is directly due to the fact that IT assets have\
    \ become the most valuable things many companies own. Guarding these assets and\
    \ managing the inherent risk of their loss is the job of information security\
    \ professionals.\n\n*Malicious software*, also referred to as malware, is often\
    \ employed to help an attacker gain access to a system. Many types of malicious\
    \ software exist, but the common thread is that they perform actions that cause\
    \ harm to a computer system or network. In the case of many attacks, *system failure*\
    \ may occur either as an intended (as is the case in Denial of Service (DoS) attacks)\
    \ or unintended consequence. This means the system will no longer be able to perform\
    \ its intended purpose. System failure is a serious risk that needs to be managed.\n\
    \n## 1.2. Learning the Lingo\n\nIn general, the technical fields are laden with\
    \ acronyms and obtuse vocabulary. Unfortunately security is no exception to this\
    \ rule. Three of the most important acronyms you should be aware of to start are\
    \ *CIA*, *AAA*, and *DRY*.\n\n### 1.2.1. CIA\n\n![](images/cia.svg)\n\nWhile the\
    \ Central Intelligence Agency does have a role to play in information security,\
    \ for our purposes CIA is an acronym used to remember the three foundational information\
    \ security principles: confidentiality, integrity, and availability. These ideas\
    \ form the cornerstone of security and should be ever-present in your thoughts.\n\
    \n*Confidentiality* refers to the practice of keeping secret information secret.\
    \ For example, if an e-commerce site stores credit card numbers (a questionable\
    \ practice to begin with) those credit card numbers should be kept *confidential*.\
    \ You would not want other users of the site or outsiders to have access to your\
    \ credit card number. Many steps could be taken to ensure the confidentiality\
    \ of user credit card numbers, but at this point it is enough to understand that\
    \ maintaining confidentiality is a principle of security.\n\n*Integrity* is an\
    \ assurance that data has not been corrupted or purposefully tampered with. As\
    \ we discussed previously, data is very valuable, but how valuable is it if you\
    \ can’t be sure it is intact and reliable? In security we strive to maintain integrity\
    \ so that the system and even the controls we have in place to guard the system\
    \ can be trusted. Imagine that e-commerce site again. What would happen if an\
    \ attacker could arbitrarily change delivery addresses stored in the system? Packages\
    \ could be routed to improper addresses and stolen and honest customers would\
    \ not receive what they ordered, all because of an integrity violation.\n\n*Availability*\
    \ means that a system should remain up and running to ensure that valid users\
    \ have access to the data when needed. In the simplest sense, you could ensure\
    \ confidentiality and integrity by simply taking the system off line and not allowing\
    \ any access. Such a system would be useless and this final principle addresses\
    \ that. Systems are designed to be accessible and part of your security plan should\
    \ be ensuring that they are. You will need to account for the costs of implementing\
    \ confidentiality and integrity and make sure that the resources are available\
    \ to keep the system working. In an extreme case, denial of service (DoS) attacks\
    \ can actually target availability. By keeping this principle in mind, hopefully\
    \ you can mitigate some of those risks.\n\n### 1.2.2. AAA\n\n![](images/aaa.svg)\n\
    \nAnother acronym you’re going to encounter in many different contexts is AAA.\
    \ It stands for *Authentication*, *Authorization*, and *Accounting* and it is\
    \ used in designing and implementing protocols. These concepts should be remembered\
    \ when designing security plans.\n\nAuthentication is the process of confirming\
    \ someone’s identity. This may be done with user names and passwords or more frequently\
    \ via multi-factor authentication (MFA) which requires not only something you\
    \ know, but something you have (fingerprints, key fob, etc.).\n\nAuthorization\
    \ refers to keeping track of which resources an entity has access to. This can\
    \ be done via a permission scheme or access control list (ACL). Occasionally you\
    \ will encounter something more exotic where authorization limits users to interactions\
    \ during a particular time of day or from a particular IP address."
