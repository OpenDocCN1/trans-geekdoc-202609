- raw: "Accounting refers to tracking the usage of resources. This may be as simple\
    \ as noting in a log file when a user has logged in to keeping track of exactly\
    \ which services and user uses and how long they use them. Accounting is incredibly\
    \ important because it allows you to not only monitor for possible problems, but\
    \ also inspect what has occurred *after* a problem is encountered. Accounting\
    \ also allows system administrators to show irrefutably what actions a user has\
    \ taken. This can be very important evidence in a court of law.\n\n### 1.2.3.\
    \ DRY\n\nWhile we’re dispensing knowledge in the form of three letter acronyms\
    \ (TLAs), another important acronym to keep in mind is DRY: Don’t Repeat Yourself.\n\
    \n> Say something once, why say it again?^(\\[[¹](#fn1))\n\n> \n\n> ~ Talking\
    \ Heads Psycho Killer\n\nThis is of course not entirely literal. Just because\
    \ you’ve explained something to a coworker once does *not* mean that you shouldn’t\
    \ explain it again. It is meant as more of a guide for how you make use of *automation*\
    \ and how you design systems. Increasingly security experts are not being asked\
    \ to analyze a single system, but a network of hundreds if not thousands of systems.\
    \ In this case you should make use of scripts and tools to make sure you are not\
    \ manually doing the same thing over and over. Have you found a good way of testing\
    \ to see if a part of a system is secure? Put it in a script so that you can reuse\
    \ the test on other systems. This same logic applies to how systems are designed.\
    \ Do you have a database of user login info? Reuse that database across multiple\
    \ systems. In short, \"Don’t repeat yourself!\"\n\n## 1.3. Hacker Culture\n\n\
    The term *hacker* comes from the sound that programmers would make when typing\
    \ or *hacking* away at keyboards. Originally a hacker was anyone who worked feverishly\
    \ at a problem on a computer and the term *cracker* was used to define people\
    \ who attempted to bypass security systems. The distinction was eventually lost\
    \ and a hacker has come to be the popular term for someone attempting to gain\
    \ unauthorized access to data. For an interesting glimpse into early hacker culture/reasoning\
    \ read [The Conscience of a Hacker](https://archive.org/stream/The_Conscience_of_a_Hacker/hackersmanifesto.txt)\
    \ by The Mentor originally published in Phrack Magazine 1986.\n\n## 1.4. Threat\
    \ Actors\n\n![Anonymous Revolution Guy Fawkes is used under Pixabay License](images/anonymous.svg)\n\
    \n[Anonymous Revolution Guy Fawkes](https://pixabay.com/illustrations/anonymous-revolution-guy-fawkes-1235169/)\
    \ is used under [Pixabay License](https://pixabay.com/service/license/)\n\nTo\
    \ better be able to manage the risks of a data breach, it helps to be able to\
    \ identify/understand the attacker or threat actor involved. Just as there are\
    \ many reasons an actor may attempt to gain unauthorized access there are also\
    \ many groups of threat actors.\n\nNeophytes making use of automated tools that\
    \ they may not fully understand are often referred to a *script kiddies*. You\
    \ may hear other pejorative names as well such as lamer, noob, or luser, but the\
    \ common thread is that these threat actors are *not* highly sophisticated. The\
    \ same techniques used for automating defensive security can also be applied to\
    \ automating attacks. Unfortunately this means that you may encounter actors \"\
    punching above their weight\" or using complex tools while having only a rudimentary\
    \ understanding of what they do.\n\nHacktivist are threat actors that attack to\
    \ further social or political ends. These groups can be very sophisticated. The\
    \ most well known hacktivist group is *Anonymous* which has been linked to several\
    \ politically motivated attacks.\n\nOrganized crime is another element which may\
    \ employ or support threat actors typically to make money. These groups typically\
    \ have access to more resources and contacts than a solo actor. It is important\
    \ to note that threat actors with roots in organized crime may find it easier\
    \ to migrate into other areas of crime due to their proximity to a large criminal\
    \ enterprise. For example, while it may be difficult for a script kiddie to broker\
    \ the sale of valuable data, a hacker working with an organized crime syndicate\
    \ may have people close to them that are familiar with the sale of stolen goods.\n\
    \nThe last group of threat actors, and arguably the group with the most resources,\
    \ are threat actors working with or for governments and nation states. These groups\
    \ may have the explicit or implicit permission of their country to commit cyber\
    \ crimes targeting other nations. Given the constant threat and resources available\
    \ to these groups, they are referred to as an advanced persistent threat (APT).\
    \ By utilizing the resources of a nation (often including its intelligence and\
    \ military resources) APTs are a severe threat.\n\n## 1.5. Security Plans\n\n\
    While confronting such a diverse array of actors can seem daunting at first, the\
    \ key element to being successful is having a plan. A *security plan* analyzes\
    \ the risks, details the resources that need to be protected, and presents a clear\
    \ path to protecting them. Typically a security plan utilizes the three types\
    \ of security controls available: physical, administrative, and technical.\n\n\
    *   Physical controls are things like door locks, cameras, or even the way rooms\
    \ in a building are laid out. These things can have a dramatic impact on the overall\
    \ security and should not be overlooked!\n\n*   Administrative controls include\
    \ human resources policies (HR), classifying and limiting access to data, and\
    \ separating duties. It helps to have a whole-organization understanding of security\
    \ to make it easier to put these controls in place.\n\n*   Technical controls\
    \ are often what new security professionals think of first. These are things like\
    \ intrusion detection systems (IDS), firewalls, anti-malware software, etc. While\
    \ these are an important segment of security and they are the segment that falls\
    \ almost entirely within the purview of IT, it is critical to remember that these\
    \ are only as strong as the physical and administrative controls that support\
    \ them!\n\n## 1.6. Tools of the Trade\n\nWith all of this talk regarding how and\
    \ why hackers attack systems, the question remains, \"What can be done?\" There\
    \ are a few tools the security professional employs that are worth mentioning\
    \ at this juncture including: *user awareness*, *anti-malware software*, *backups*,\
    \ and *encryption*.\n\nUser Awareness \n\n: A major risk, some would argue the\
    \ biggest risk, is that unprepared users will run malware programs or perform\
    \ other harmful actions as directed by actors looking to gain access. These actors\
    \ may impersonate others or perform other *social engineering* tactics to cause\
    \ users to do as they say. Probably the scariest statistic is the ease with which\
    \ a massive attack requiring little effort can be performed. Threat actors do\
    \ not even need to personally reach out to users, they could simply send a mass\
    \ email. Through training programs and other methods of interaction a security\
    \ professional can make users aware of these threats and train them to act accordingly.\
    \ Raising user awareness is a critical component of any security plan. \n\nAnti-Malware\
    \ Software \n\n: Given how prevalent the use of malware is a host of tools have\
    \ been developed to prevent its usage. These tools may filter download requests\
    \ to prevent downloading malware, monitor network traffic to detect active malware\
    \ patterns, scan files for malware signatures, or harden operating system loopholes\
    \ used by malware. A security plan will typically detail the type of anti-malware\
    \ software being used as well as the intended purpose of its usage. \n\nBackups\
    \ \n\n: Maintaining a copy of the data used by a system can be a quick solution\
    \ to the problems of ransomware and other attacks aimed at causing or threatening\
    \ system failure. While a backup does not solve the problem of the data being\
    \ sold or used by others, it does allow for a quick recovery in many instances\
    \ and should be part of a security plan. \n\nEncryption "
  fmt: "\nAccounting refers to tracking the usage of resources. This may be as simple\
    \ as noting in a log file when a user has logged in to keeping track of exactly\
    \ which services and user uses and how long they use them. Accounting is incredibly\
    \ important because it allows you to not only monitor for possible problems, but\
    \ also inspect what has occurred `after` a problem is encountered. Accounting\
    \ also allows system administrators to show irrefutably what actions a user has\
    \ taken. This can be very important evidence in a court of law.\n\n### 1.2.3.\
    \ DRY\n\nWhile we’re dispensing knowledge in the form of three letter acronyms\
    \ (TLAs), another important acronym to keep in mind is DRY: Don’t Repeat Yourself.\n\
    \n> Say something once, why say it again?^(\\[[¹](#fn1))\n\n> \n\n> ~ Talking\
    \ Heads Psycho Killer\n\nThis is of course not entirely literal. Just because\
    \ you’ve explained something to a coworker once does `not` mean that you shouldn’t\
    \ explain it again. It is meant as more of a guide for how you make use of `automation`\
    \ and how you design systems. Increasingly security experts are not being asked\
    \ to analyze a single system, but a network of hundreds if not thousands of systems.\
    \ In this case you should make use of scripts and tools to make sure you are not\
    \ manually doing the same thing over and over. Have you found a good way of testing\
    \ to see if a part of a system is secure? Put it in a script so that you can reuse\
    \ the test on other systems. This same logic applies to how systems are designed.\
    \ Do you have a database of user login info? Reuse that database across multiple\
    \ systems. In short, \"Don’t repeat yourself!\"\n\n## 1.3. Hacker Culture\n\n\
    The term `hacker` comes from the sound that programmers would make when typing\
    \ or `hacking` away at keyboards. Originally a hacker was anyone who worked feverishly\
    \ at a problem on a computer and the term `cracker` was used to define people\
    \ who attempted to bypass security systems. The distinction was eventually lost\
    \ and a hacker has come to be the popular term for someone attempting to gain\
    \ unauthorized access to data. For an interesting glimpse into early hacker culture/reasoning\
    \ read [The Conscience of a Hacker](https://archive.org/stream/The_Conscience_of_a_Hacker/hackersmanifesto.txt)\
    \ by The Mentor originally published in Phrack Magazine 1986.\n\n## 1.4. Threat\
    \ Actors\n\n![Anonymous Revolution Guy Fawkes is used under Pixabay License](images/anonymous.svg)\n\
    \n[Anonymous Revolution Guy Fawkes](https://pixabay.com/illustrations/anonymous-revolution-guy-fawkes-1235169/)\
    \ is used under [Pixabay License](https://pixabay.com/service/license/)\n\nTo\
    \ better be able to manage the risks of a data breach, it helps to be able to\
    \ identify/understand the attacker or threat actor involved. Just as there are\
    \ many reasons an actor may attempt to gain unauthorized access there are also\
    \ many groups of threat actors.\n\nNeophytes making use of automated tools that\
    \ they may not fully understand are often referred to a `script kiddies`. You\
    \ may hear other pejorative names as well such as lamer, noob, or luser, but the\
    \ common thread is that these threat actors are `not` highly sophisticated. The\
    \ same techniques used for automating defensive security can also be applied to\
    \ automating attacks. Unfortunately this means that you may encounter actors \"\
    punching above their weight\" or using complex tools while having only a rudimentary\
    \ understanding of what they do.\n\nHacktivist are threat actors that attack to\
    \ further social or political ends. These groups can be very sophisticated. The\
    \ most well known hacktivist group is `Anonymous` which has been linked to several\
    \ politically motivated attacks.\n\nOrganized crime is another element which may\
    \ employ or support threat actors typically to make money. These groups typically\
    \ have access to more resources and contacts than a solo actor. It is important\
    \ to note that threat actors with roots in organized crime may find it easier\
    \ to migrate into other areas of crime due to their proximity to a large criminal\
    \ enterprise. For example, while it may be difficult for a script kiddie to broker\
    \ the sale of valuable data, a hacker working with an organized crime syndicate\
    \ may have people close to them that are familiar with the sale of stolen goods.\n\
    \nThe last group of threat actors, and arguably the group with the most resources,\
    \ are threat actors working with or for governments and nation states. These groups\
    \ may have the explicit or implicit permission of their country to commit cyber\
    \ crimes targeting other nations. Given the constant threat and resources available\
    \ to these groups, they are referred to as an advanced persistent threat (APT).\
    \ By utilizing the resources of a nation (often including its intelligence and\
    \ military resources) APTs are a severe threat.\n\n## 1.5. Security Plans\n\n\
    While confronting such a diverse array of actors can seem daunting at first, the\
    \ key element to being successful is having a plan. A `security plan` analyzes\
    \ the risks, details the resources that need to be protected, and presents a clear\
    \ path to protecting them. Typically a security plan utilizes the three types\
    \ of security controls available: physical, administrative, and technical.\n\n\
    *   Physical controls are things like door locks, cameras, or even the way rooms\
    \ in a building are laid out. These things can have a dramatic impact on the overall\
    \ security and should not be overlooked!\n\n*   Administrative controls include\
    \ human resources policies (HR), classifying and limiting access to data, and\
    \ separating duties. It helps to have a whole-organization understanding of security\
    \ to make it easier to put these controls in place.\n\n*   Technical controls\
    \ are often what new security professionals think of first. These are things like\
    \ intrusion detection systems (IDS), firewalls, anti-malware software, etc. While\
    \ these are an important segment of security and they are the segment that falls\
    \ almost entirely within the purview of IT, it is critical to remember that these\
    \ are only as strong as the physical and administrative controls that support\
    \ them!\n\n## 1.6. Tools of the Trade\n\nWith all of this talk regarding how and\
    \ why hackers attack systems, the question remains, \"What can be done?\" There\
    \ are a few tools the security professional employs that are worth mentioning\
    \ at this juncture including: `user awareness`, `anti-malware software`, `backups`,\
    \ and `encryption`.\n\nUser Awareness \n\n: A major risk, some would argue the\
    \ biggest risk, is that unprepared users will run malware programs or perform\
    \ other harmful actions as directed by actors looking to gain access. These actors\
    \ may impersonate others or perform other `social engineering` tactics to cause\
    \ users to do as they say. Probably the scariest statistic is the ease with which\
    \ a massive attack requiring little effort can be performed. Threat actors do\
    \ not even need to personally reach out to users, they could simply send a mass\
    \ email. Through training programs and other methods of interaction a security\
    \ professional can make users aware of these threats and train them to act accordingly.\
    \ Raising user awareness is a critical component of any security plan. \n\nAnti-Malware\
    \ Software \n\n: Given how prevalent the use of malware is a host of tools have\
    \ been developed to prevent its usage. These tools may filter download requests\
    \ to prevent downloading malware, monitor network traffic to detect active malware\
    \ patterns, scan files for malware signatures, or harden operating system loopholes\
    \ used by malware. A security plan will typically detail the type of anti-malware\
    \ software being used as well as the intended purpose of its usage. \n\nBackups\
    \ \n\n: Maintaining a copy of the data used by a system can be a quick solution\
    \ to the problems of ransomware and other attacks aimed at causing or threatening\
    \ system failure. While a backup does not solve the problem of the data being\
    \ sold or used by others, it does allow for a quick recovery in many instances\
    \ and should be part of a security plan. \n\nEncryption \n"
