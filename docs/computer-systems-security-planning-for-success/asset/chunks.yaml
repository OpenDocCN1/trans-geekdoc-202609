    through the use of a specific process. This could be the process through which
    the private key is used or perhaps another biometric process such as reading a
    fingerprint. In either case the *authentication* is the method by which we verify
    identity. Example: Examining the delivery driver’s badge. Authorization : Authorization
    is when an actor is given permission to access a resource. In casual conversation
    we may assume that *authorization* is a foregone conclusion once an actor has
    progressed this far, but in actuality authorization relies on the previous steps
    being completed and may in fact fail. A system may have identified who someone
    was through authentication with a username and password, but that user is not
    set up to have access to a resource. In this case the *authorization* step would
    fail. To continue with our delivery driver example: Allowing the delivery driver
    to pick up a package. Accounting : Finally accounting is the process through which
    a record of access to the resource is recorded. Accounting may be a log of users
    who have signed in an log of what resources they each accessed. In a similar vein,
    with the delivery driver: A record of the driver’s visit is written in the sign-in
    book at the front desk. ¶ 7.1. General Principles and Techniques ¶ 7.1.1. Least
    Privilege ¶ The principle of least privilege states that an actor should only
    be given access to resources as necessary and with the permissions necessary to
    complete their task. These resources may be processes, programs, or even user
    accounts. This principle reduces an attack surface and helps stop the spread of
    malware as a single compromised account will not have access to all of the resources.
    ¶ Least privilege is also an important concept for compliance purposes. For example,
    laws may require and audit of all accounts that have Internet access. By limiting
    accounts that have Internet access to only the accounts of actors that require
    Internet access to complete their tasks, it makes it easier to be in compliance.
