    ## 4. Protocols


    Protocols can be though of as rules that dictate communication. A protocol may
    include information about the syntax used, error correction, synchronization,
    or any other aspect of how communication occurs in the context of that situation.
    In computer security it is important to have a thorough understanding of common
    protocols as their weaknesses often determine how and if an attack will occur.
    Protocols exist for both hardware and software and have been developed via individuals
    and organizations. Early networking protocols were often developed on mailing
    lists using Requests for Comments (RFCs). You may still see RFCs being crafted,
    referred to, or actively worked on. Some of the earliest web protocols are detailed
    in RFCs. More often than not, large protocols have working groups and associations
    developing, such as the 802.11 group at the Institute of Electrical and Electronics
    Engineers (IEEE) which handles WiFi protocols. These groups publish papers detailing
    how the protocols work.


    This chapter will give a brief description of important protocols following the
    TCP/IP layering model. It is important to note that some of these protocols may
    reach across layers to accomplish tasks. In this case they will be grouped according
    to which layer they largely function within.


    ### 4.1. Network Access Layer


    #### 4.1.1. ARP


    Address Resolution Protocol (ARP) is used on the local ethernet segment to resolve
    IP addresses to MAC addresses. Since this protocol functions at the ethernet segment
    level, security was not a primary concern. Unfortunately this means that ARP communications
    can be easily spoofed to cause a MitM scenario. A malicious actor simply sends
    out several ARP packets, gratuitous arp, saying that traffic for a certain IP
    address should be sent to them. Since the MAC to IP address table is cached in
    several places, it can take a long time for all the caches to invalidate and resolve
    an issue caused by malicious ARP frames.


    There is a protocol designed to mitigate the issues with ARP. Dynamic ARP Inspection
    (DAI) reaches across layers to work with the DHCP lease database and drop packets
    that are not using the MAC address used when a DHCP lease was granted. While this
    can solve many of the issues associated with ARP it is also a good practice to
    use secure higher-level protocols such as HTTPS just in case.


    #### 4.1.2. Wifi


    The Wifi protocols we are most concerned with are the security standards used
    to encrypt data. By the nature of a wireless protocol, information sent on the
    network is available to anyone with an antenna. These Wifi security standards
    are the only thing protecting your network traffic from being viewing by anyone
    within your transmitting range. There are currently four standards:


    - WEP : Wireless Equivalent Privacy (WEP) is depreceated and should not be used.
    It was developed in 1999 and uses an RC4 stream and 24-bit encryption. Several
    attacks have been developed that can crack WEP within a matter of seconds.

    - WPA : Wifi Protected Access (WPA) utilized Temporal Key Integrity Protocol (TKIP)
    to change the keys being used. This 128-bit encryption method has also been cracked
    and the protocol should not be used.

    - WPA2 : Wifi Protected Access 2 (WPA2) makes use of AES encryption and is currently
    the most popular standard. WPA2 is still considered secure.

    - WPA3 : Wifi Protected Access 3 (WPA3) was developed in 2018 and is currently
    considered state-of-the-art. Many networks are beginning the transition from WPA2
    to WPA3.


    ### 4.2. Internet Layer Protocols


    #### 4.2.1. IP


    IP stands for internet protocol and it was devised to allow creating a network
    of networks. The network of networks that uses it primarily is the Internet, although
    you could use IP in other scenarios as well. IP is largely concerned with routing
    traffic across and to networks. The protocol was first detailed by the IEEE in
    1974 and comes from the Advanced Research Projects Agency Network (ARPANET) project,
    which created the first large, packet-switched network.


    Most people are familiar with IP addresses, the unique number given to a host
    participating in an IP network. Currently there are two main versions of the IP
    protocol, IPv4 and IPv6, and one of the major differences is in how many IP addresses
    are available. IPv4 supports 32 bit addresses and IPv6 supports 128 bit addresses.
    To give an idea of how big of a change that is, we have currently allocated all
    possible IPv4 addresses, but with IPv6 we could give an address to every grain
    of sand on the beaches of earth and still not run out.


    ##### IPv6 Security Implications


    From a security standpoint, the way addresses are used in IPv4 vs IPv6 has big
    consequences. Since there aren’t enough IPv4 addresses a typical internet user
    is assigned a local address that gets translated to an external IPv4 address when
    they route their packets through their router. This is referred to as Network
    Address Translation (NAT) and is usually handled by an all-in-one device that
    also makes sure external entities cannot connect to the internal network.


    With IPv6 addresses each host on that same internal network can be given an external
    IPv6 address. A basic IPv6 router may simply pass the packets to the network without
    blocking connections to the internal network. If the machines are not hardened
    or a firewall is not put in place/enabled the machines could be subject to attack.


    As a computer security specialist it is important to test not only IPv4 connectivity,
    but also IPv6 to ensure that your network is configured appropriately.


    #### 4.2.2. ICMP


    Internet Control Message Protocol (ICMP) is largely used to send messages between
    systems when IP doesn’t work. For example, lets say we tried to connect to a host
    but our router doesn’t know how to get there. Our router can send us an ICMP Destination
    Unreachable message to let us know that something is going wrong. Because ICMP
    messages work at the network layer, we will receive this message even if there
    is an issue with the internet layer.


    The most common use for ICMP is the ping command. ping sends an ICMP echo request
    to check to see if a host is up. By responding to the request with the data included
    in the request we can assume that the host is up and functioning.


    ICMP is also used in the traceroute command. traceroute incrementally increase
    the Time To Live (TTL) field of ICMP packets and watches for TTL Exceeded messages
    to determine what route packets are taking to get to a host. Example traceroute
    output is shown below:


    ```

    traceroute to 8.8.8.8 (8.8.8.8), 30 hops max, 60 byte packets

    ```

    '
  trans: '


    # 按操作系统划分的恶意软件分发情况（2020 年第一季度）


    Windows 操作系统是恶意软件最受欢迎的目标，差距相当大。这很大程度上是因为它作为桌面操作系统的普及程度。第二大目标是 Web 浏览器，它们为恶意软件提供了独特的跨平台覆盖范围。第三大目标是
    Android 移动操作系统，虽然在技术上它是 Linux，但主要在手机上运行。Linux 和 Mac 受到的恶意软件关注较少。这可能部分是由于 Linux
    的开源性质以及 Mac 使用的 BSD 内核，但也部分是由于这两种操作系统各自缺乏普及度。恶意软件通常被广泛分发，这意味着它可以只针对最流行/可能最薄弱的环节，并且仍然可以取得成功。


    ## 零日漏洞


    现代操作系统采用多层安全措施，以确保程序无法访问敏感信息或应用程序。这通常意味着，为了使恶意软件有效，它需要提升其权限。最有效的恶意软件可以在不需要用户交互的情况下执行权限提升。为此，恶意软件可能依赖于新的/未记录的漏洞或安全漏洞。这些已披露“零天”的新漏洞因此被称为零日漏洞。零日漏洞非常强大，可能会被
    APT/犯罪团伙囤积，或在暗网上以数百万美元的价格出售。


    ## 3.3. 恶意软件类型


    恶意软件的定义非常广泛，并且每天都在创建新的恶意软件。这可能使恶意软件分类变得困难。在介绍一些基本类型时，请记住存在显著的重叠。例如，您可能会遇到作为病毒分发的勒索软件，或者作为木马分发的勒索软件。它是勒索软件这一事实并不排除它也可能是其他类型的恶意软件。


    ### 3.3.1. 蠕虫、病毒和木马


    蠕虫是自我传播的程序，无需用户交互即可传播。其代码通常存储在独立对象中，例如隐藏的可执行文件。蠕虫通常不会严重损坏其宿主，因为它们关注的是快速、指数级的传播。


    #### Stuxnet


    Stuxnet 是一种 2010 年的蠕虫，专门针对伊朗核设施。该蠕虫使用了前所未有的四个零日攻击，并设计为通过 USB 闪存驱动器和远程过程调用（RPC）传播。因此，它不仅依赖网络来传播。最终，Stuxnet
    的有效载荷针对用于编程 PLC 设备的代码，这些设备控制电机并使其旋转速度过快，从而破坏离心机。Stuxnet 还使用了一个令人印象深刻的 rootkit
    来掩盖其踪迹。鉴于 Stuxnet 的复杂程度，据信它是由美国和以色列开发的。


    病毒通常需要用户交互，例如将受感染的文件从一台机器复制到另一台机器，并将其代码存储在机器上的另一个文件中。可执行文件可能会被感染，方法是将病毒代码添加到一个单独的页面，该页面在标准程序代码之前执行。病毒对宿主可能造成相当大的损害，因为它们可能需要大量资源来在本地传播。“病毒”一词也是一个不幸被过度使用的术语。由于其流行程度，一些低技能威胁行为者经常用它来指代许多不同类型的恶意软件。


    ##### 概念病毒


    Concept 病毒是第一个 Microsoft Word 宏病毒的示例。该病毒隐藏在 Microsoft Word 文件中，并使用 Word 的嵌入式宏语言来执行其复制任务。后来为
    Excel 和其他具有足够复杂但最终不安全的内部脚本语言的程序创建了病毒。


    木马是一种伪装成合法软件的恶意软件。它不必像依赖软件漏洞那样依赖于利用用户来安装、运行或向恶意代码授予额外权限。木马是最流行的恶意软件类型，因为它们可以作为许多其他有效载荷的攻击向量。这个名字来自希腊神话，其中特洛伊木马被伪装成礼物并送给一个被围困的城镇。巨大的木马内部有秘密部队，他们在半夜出来并打开了城镇大门。


    ##### Emotet


    Emotet 是一种 2014 年的银行木马，通过电子邮件传播。它使用恶意链接或启用宏的文档来使用户下载其代码。Emotet 是目前最昂贵和最具破坏性的恶意软件之一，平均每次事件修复成本约为一百万美元。它继续被调整以避免检测，并利用更加复杂的恶意软件。


    ### 3.3.2. 勒索软件


    Wana Decrypt0r 截图在合理使用条款下使用


    勒索软件是一种加密文件并要求支付赎金以解密文件的恶意软件。现代勒索软件使用对称加密快速加密文件，然后使用硬编码的公钥非对称加密对称密钥，威胁行为者持有相应的私钥。当支付赎金时，通常通过加密货币，威胁行为者可以使用其私钥解密对称密钥，用户可以使用对称密钥解密文件。


    勒索软件被视为数据泄露，因为数据通常也会被外泄。还值得注意的是，当支付赎金时，无法保证威胁行为者实际上会开始解密过程。勒索软件的典型目标包括企业基础设施和医疗保健系统，尽管勒索软件也可能被不加区分地传播。赎金支付可以成为一项大规模的赚钱企业，因此许多
    APT 或犯罪团伙可能会使用它。勒索软件被认为是当今网络稳定性最大的威胁。


    ### 3.3.3. 间谍软件


    专门用于间谍活动/数据窃取的恶意软件称为间谍软件。与勒索软件一样，间谍软件也可以为威胁行为者带来金钱回报。行为者可能会使用敲诈勒索来要求付款，否则数据将被泄露。这通常意味着要么在暗网上出售，要么公开发布。再次，鉴于金钱收益的可能性，间谍软件通常与犯罪团伙相关联。APT
    也可能使用间谍软件来获取国家重要的秘密。


    客户数据、商业秘密、专有数据和政府机密都是间谍软件的目标。即使在政府系统之外，在企业环境中，间谍软件仍然是一个主要威胁。


    #### 无文件恶意软件


    恶意软件通常通过扫描存储以查找与特定哈希匹配的文件，或通过查看文件以查看它们是否包含特定模式来检测。这两种检测技术都依赖于恶意软件存储在文件中。无文件恶意软件试图通过在文件系统中不留下任何痕迹来避免检测。这种类型的恶意软件使用合法进程将自身加载到内存中，通常会创建一个注册表项，以便在机器重新启动时重新加载。这创建了一种持久且难以检测的恶意软件类型，通常由复杂的威胁行为者（如
    APT 和犯罪团伙）使用。


    ### 3.3.4. 加密劫持


    利用工作量证明算法的加密货币使程序将处理器周期转换为钱变得前所未有地容易。某些类型的恶意软件利用这一点，在用户的机器上后台挖掘加密货币。这种对电力和资源的窃取可以为恶意软件分发者带来收入，当挖矿资金存入其在线钱包时。


    加密劫持比以往任何时候都更流行，尤其是考虑到已经创建了大量受感染机器的僵尸网络。加密劫持为恶意行为者提供了一条更简单的货币化路径，他们可能已经控制了许多受感染的机器。


    ### 3.3.5. Rootkit


    Rootkit 是一种秘密程序，旨在为系统提供后门访问权限。它们设计为保持隐藏，甚至可能主动禁用或规避安全软件。由于其底层特性，许多 rootkit 很难检测，甚至更难删除。


    Rootkit 通常根据其隐藏的层进行分类：


    - 固件 Rootkit：固件是硬件设备用于运行的代码。它通常是一组用于设置和与设备交互的薄层命令。固件 rootkit 可能驻留在主板的 BIOS 中，并且可能非常难以删除。

    - 引导加载程序 Rootkit：引导加载程序通过将内核加载到内存中来准备系统引导操作系统内核。引导加载程序 rootkit 可能会劫持此过程，将自身加载到单独的内存空间中，或操纵正在加载的内核。

    - 内核模式 Rootkit：许多操作系统内核（包括 Linux）都有能力加载动态模块。这些内核模块对操作系统内核操作具有完全访问权限。内核模式 rootkit
    很难在运行时检测，因为被指示检测 rootkit 的操作系统内核已不再可信。

    - 应用程序 Rootkit：应用程序或用户模式 rootkit 通常作为在后台运行并具有管理权限的应用程序安装。这些 rootkit 通常最容易开发和部署，不需要对系统使用的硬件有底层知识，但它们也是最容易检测和删除的。


    #### Sony Rootkit


    2005 年，Sony 发布了带有应用程序 rootkit 的音乐软件 CD，该 rootkit 设计为在 Microsoft Windows 系统上运行。该
    rootkit 在后台持续运行，减慢系统速度，并且没有卸载程序来删除该程序。它旨在防止操作系统从音频 CD 复制信息，但它也打开了几个安全漏洞，可能被其他恶意软件利用。最终，该
    rootkit 导致针对 Sony BMG 的多起集体诉讼，并与联邦贸易委员会达成和解，要求 Sony 向报告因 rootkit 造成损害的客户进行赔偿。


    ### 3.3.6. 僵尸网络


    僵尸网络是由单一方控制的受感染主机网络。这些主机可能是台式计算机、服务器，甚至是物联网（IoT）设备。僵尸网络通常用于大规模分布式拒绝服务（DDoS）攻击，其中攻击的性质是让许多机器向单个机器发送流量。僵尸网络也可用于发送垃圾邮件，因为它们对
    SMTP 电子邮件中继的访问可能因其互联网服务提供商（ISP）而异。


    机器人通常通过命令和控制（C2，C&C）服务器进行控制。虽然此 C2 服务器可能使用自定义协议，但现代僵尸网络更典型地依赖于其他基础设施。C2 流量可以使用
    SSH、HTTP、互联网中继聊天（IRC）甚至 Discord 向机器人发送命令并从机器人接收数据。


    ### 3.3.7. RAT


    RAT 代表远程访问木马，用于获得对远程目标的完全访问和控制权。恶意软件分发者可以浏览计算机上的文件、发送按键和鼠标移动、查看屏幕，以及/或监控来自麦克风和摄像头的输入。RAT
    通常会主动绕过安全控制，因此可能难以检测。


    ### 3.3.8. 广告软件 / 可能不需要的程序 (PUP)


    广告软件是旨在跟踪用户行为并传递不需要的、有时具有侵入性的定向广告的恶意软件。广告软件可能会减慢系统速度，并/或在网站上添加广告墙。这种类型的恶意软件通常针对用户的
    Web 浏览器。


    可能不需要的程序 (PUP) 通常作为另一个程序的安装的一部分下载。常见的 PUP 包括浏览器工具栏、PDF 阅读器、压缩实用程序或浏览器扩展。这些程序可能包含广告软件/间谍软件组件，也可能减慢系统速度。


    ## 3.4. 妥协指标


    妥协指标 (IoC) 是具有高度置信度的工件，指示入侵。它是判断机器是否成为恶意软件受害者的一种方法。安全专业人员公开传达 IoC，以帮助减轻恶意软件的影响。


    ### 常见 IoC 类型


    - 哈希：已知为恶意的文件的哈希值。这有助于识别木马和蠕虫。

    - IP 地址：跟踪恶意软件连接的 IP 地址可以用于确定机器是否被感染。

    - URL/域：跟踪恶意软件使用的 URL 或域也可以用于确定机器是否被感染。

    - 病毒定义/签名：可执行文件和其他文件可以扫描特定字节序列，这些序列特定于特定病毒。通过这种方式，即使恶意软件隐藏在另一个文件中，仍然可以检测到它。


    ## 3.5. 恶意软件分发


    恶意软件通常通过社会工程学分发，即说服组织内的某个行为者下载并运行或点击某些东西。它也可以通过渗透某个依赖的软件包、供应链，或可能通过公开暴露服务上的软件漏洞来分发。下面详细介绍了一些最常见的传播恶意软件的方式。


    ### 3.5.1. 钓鱼


    钓鱼涉及通过欺诈性消息与某人通信，以努力使他们执行会伤害他们的行为。它分为五个主要类别：


    - 矛头钓鱼：发送针对特定企业或环境的钓鱼电子邮件或其他通信。这些消息可能包含有关组织内部运作的信息，以试图证明其有效性。它们也可能利用特定组织中已知的不安全做法。矛头钓鱼不是您常规的广撒网式钓鱼尝试，而是更多地是一种有针对性的、定制的、定制的活动。

    - 猎鲸：针对组织中高级别人员。猎鲸通常与矛头钓鱼结合使用。

    - 短信钓鱼：使用 SMS 消息进行钓鱼。

    - 语音钓鱼：使用语音消息进行钓鱼。

    - 钓鱼网站：威胁行为者可以尝试通过从非业务相关通信渠道获得的信息来获得未经授权的访问。例如，恶意行为者可能知道 CEO 经常光顾一个流行的帆船论坛。这些行为者可以在帆船论坛上设置一个帐户，向
    CEO 发送私信以获取信息。


    ### 3.5.2. 垃圾邮件


    垃圾邮件包含大量未经请求的电子邮件。这些电子邮件可能是恶意的，也可能只是广告。无论哪种情况，垃圾邮件占所有电子邮件的近 85%。值得注意的是，有时通过垃圾邮件分发的恶意软件实际上被用于通过受害者的机器发送更多垃圾邮件。反垃圾邮件战争在不断演变，尽管我们发送电子邮件的方式已经做出了许多更新，但许多改进尚未实现。


    ### 3.5.3. 垃圾箱搜寻


    最终可能导致恶意软件传播的信息也可以在处理不当的垃圾中找到。旧记录或硬盘可能包含企业机密或凭据，这些凭据会给某人带来未经授权的访问。正确处理敏感信息很重要，确保所有需要销毁的东西都被彻底销毁。


    ### 3.5.4. 偷窥


    PIN、密码和其他数据也可以通过简单地从某人肩膀上方查看来恢复。这些凭据可能是攻击者传播恶意软件所需的“入口”。借助光学设备（如双筒望远镜），偷窥甚至可以在远距离发生。隐私屏幕（限制您可以看到显示器的角度）有助于减轻这种类型的攻击。


    ### 3.5.5. 跟尾


    跟随持有凭据进入安全地点的人被称为跟尾。通常，人们甚至会为手里拿满东西的人扶住安全门。想要帮助他人是人性，但你也必须记住，你身后的人可能带着一个准备在一旦他们进入大楼并获得对机器的物理访问权限后立即部署的恶意软件
    USB 密钥。


    ### 3.5.6. 冒充/身份盗窃


    通常作为钓鱼活动的一部分，威胁行为者会假装是另一个人。这可能是组织内部的人，或者是组织外部拥有足够权力的人，例如政府监管机构的代表。攻击者也可能使用被盗凭据来使其消息看起来官方，再次为他们提供了一条轻松的路径来部署恶意软件。


    ## 3.6. 网络杀伤链


    分析涉及恶意软件的攻击的一种方法是通过网络杀伤链的步骤。网络杀伤链由洛克希德·马丁公司开发，是一种被网络安全采用的军事分析方法。网络杀伤链分为七个步骤：侦察、武器化、投递、利用、安装、命令和控制、外泄。


    ### 3.6.1. 侦察


    侦察是侦察的缩写，是军事术语，指用于获取信息的初步调查。在侦察阶段，恶意行为者会尽可能收集大量信息。此阶段使用的方法可能是被动的或主动的。


    被动侦察涉及在不向目标发送任何内容的情况下收集信息。这通常涉及访问公开可用的信息，例如社交媒体、发布的网站和 DNS 记录。如果行为者有权访问，他们也可以被动嗅探网络数据包。


    主动侦察涉及与目标交互。这可能包括端口扫描、漏洞扫描、对 HTTP 服务器上的目录和文件名进行暴力破解，甚至联系员工。主动侦察可以产生更多信息，但也更容易被检测到。


    ### 3.6.2. 武器化


    在武器化阶段，行为者开始准备在侦察期间评估过的漏洞的利用程序。这可能包括定制恶意软件、创建钓鱼电子邮件、定制工具以及为攻击准备环境。为了使恶意软件有效，它必须利用正确的漏洞，并在正确的操作系统和环境下工作。Metasploit
    是一个渗透测试框架，通常在此步骤中用于创建自定义恶意软件。


    ### 3.6.3. 投递


    在投递阶段，恶意软件被交付给目标。通常会采取措施绕过检测系统。投递可能涉及发送链接到恶意软件的电子邮件，或利用易受攻击的服务器来运行恶意软件。在此阶段结束时，攻击者通常会等待恶意软件通过命令和控制通道的回调。


    ### 3.6.4. 利用


    从技术上讲，利用步骤发生在恶意软件成功执行后。在许多情况下，这几乎不需要攻击者的交互。一旦恶意软件被激活或漏洞的有效载荷被执行，受害者就完成了利用步骤。


    ### 3.6.5. 安装


    安装步骤通常由恶意软件在运行后执行。恶意软件安装自身，隐藏自身，并设置持久性（停止后重新启动的能力）。恶意软件可能会提升权限或横向移动。它还可能从远程服务器安装第二阶段的其他有效载荷。一种常见的策略是将下载的代码注入现有进程，以掩盖哪个进程正在执行可疑操作。


    ### 3.6.6. 命令和控制 (C2, C&C)


    恶意软件将通过其命令和控制通道寻求更多指令。此时，攻击者可能会与恶意软件交互，向其发送其他命令。C2 流量通常设计为与现有流量融合，不引起注意。


    ### 3.6.7. 外泄 / 行动与目标


    最后一步涉及从受攻击的系统获取数据，或以其他方式禁用/滥用系统。此时，攻击者可以使用 C2 通道从系统中提取敏感信息，例如信用卡信息、密码哈希等。需要注意的是，数据外泄可能不是攻击的唯一目标。攻击者还可以禁用系统、利用系统实施欺诈、挖掘加密货币等。此时，恶意行为者完全控制受攻击的系统。


    ## 3.7. 实验：恶意软件分析


    Any Run 网站提供免费的交互式恶意软件分析。我们将使用此网站来避免在虚拟机中运行恶意软件的复杂性。


