    (it should have a `docker-compose.yml` in it and a `victim` and `scanner` directory).
    Since we will be simulating multiple machines in this lab, we will make use of
    Docker Compose which was already installed with Docker. Docker Compose reads a
    `docker-compose.yml` file which should already be in your `nmap` directory. Run
    `docker-compose up --build --detach` to build and run the images in the background:


