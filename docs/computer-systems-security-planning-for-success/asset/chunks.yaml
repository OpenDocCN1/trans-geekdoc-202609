    the exploited machine may not actually have an external IP the attacker can use
    to connect. In these instances a reverse shell is used. A reverse shell reaches
    out from the victim to the attacker and establishes a connection from the inside.
    This is more compatible with the firewalls/NAT routers that sit between most devices
