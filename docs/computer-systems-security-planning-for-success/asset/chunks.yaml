    ¶  ¶ Now let’s make and view an evil ARP packet: ¶  ¶  ¶ Listing 9. attacker ¶  ¶
    >>> bad\_arp = ARP(op=2, pdst=victim\_ip, psrc=server\_ip, hwdst=victim\_mac)


