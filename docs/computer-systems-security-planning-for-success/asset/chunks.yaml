  trans: "\n\nC2 协议可能会试图搭便车于常规网络流量，或利用难以追踪的服务。你会在 Web 协议、DNS 查询、邮件协议，甚至是 Discord 等聊天协议上看到加密的\
    \ C2 流量。ICMP 和 UDP 等低层协议也可用于规避检测。C2 系统可能会使用多个通道，或为上传/下载使用不同的通道。其最终目标是让流量难以被检测、追踪和阻止。\n\
    \n### 9.5.13. Exfiltration\n\n对攻击者来说，将数据从机器中取出可能很困难，因为大规模传输可能会触发警报。可能会利用已使用的 Web\
    \ 服务（如 Google Drive、Dropbox 等）让数据外泄看起来像常规流量。在发生物理入侵的情况下，可能会使用 USB 驱动器。最后，如果攻击者与设备距离较近，也可能使用蓝牙、蜂窝网络或本地\
    \ WiFi 等无线电协议。\n\n### 9.5.14. Impact\n\n攻击的影响也需要分析。影响可能包括失去对资产的访问权限、数据丢失、数据被勒索、篡改、拒绝服务或资源劫持。所有这些都可能中断业务连续性，并最终给公司带来经济损失。必须充分了解攻击的影响，以便为未来做出安全决策。\n\
    \n## 9.6. Review Questions\n\n什么是 SOC，它做什么？ \n\n:  \n\n什么是 SPOF？给出一个示例 \n\n: \
    \ \n\nATT&CK 框架与 Cyber Killchain 框架有何不同？你可能需要参考 恶意软件 章节。 \n\n:  \n\n## 9.7. Lab:\
    \ 报告 2014 年索尼影业黑客事件\n\n花点时间阅读 [2014 年索尼影业黑客事件](https://en.wikipedia.org/wiki/Sony_Pictures_hack)\
    \ 的详细信息。你也可以自由研究其他来源。想象你负责在攻击发生后不久向受影响方披露攻击细节。\n\n# 10\\. 虚拟化\n\n信息技术在采用虚拟化作为动态且强大系统基础方面取得了巨大增长。从裸机资源转向虚拟资源，这一转变带来了其自身独特的安全挑战和考量。随着领域的变化，任何从事网络安全工作的人不仅要了解这些系统的工作原理，还要能够以安全优先的思维来处理其实施。\n\
    \n## 10.1. 方法\n\n虚拟化是指使用虚拟计算资源，而不是直接使用实际资源。例如，你可以在计算机的虚拟版本上运行程序，模拟处理器、内存等，而不是直接在实际硬件上运行程序。这样做有一些优势，即你可以限制程序使用的资源，或在隔离环境中运行多个程序，而无需对程序本身进行重大更改。虚拟计算通常有几种实现方式：\n\
    \n### 10.1.1. 虚拟机\n\n![](img/vm.svg)\n\n虚拟机是一种使用软件 *假装* 是整台物理计算机的资源。虚拟机模拟硬件，在其上安装\
    \ *客户* 操作系统。运行虚拟机的机器的操作系统被称为 *主机* 操作系统。\n\n虚拟机在运行方式上提供了很大的灵活性。机器可以暂停、重新启动，甚至可以存储其当前状态的快照。有些虚拟机甚至不需要提升的权限即可运行，这意味着你可以在非特权环境中模拟特权环境。这使它们成为沙箱化不可信程序的绝佳选择。\n\
    \n不幸的是，虚拟机非常耗费资源，因为它们需要虚拟化整个操作系统。这种资源使用问题以及虚拟化日益普及，促使了更轻量级解决方案（如容器）的出现。\n\n###\
    \ 10.1.2. 容器\n\n容器通过使用与主机相同的操作系统内核来简化虚拟机。这是通过使用 Linux 内核的特殊功能来隔离容器来实现的。[Linux\
    \ 命名空间](https://man7.org/linux/man-pages/man7/namespaces.7.html) 由 [cgroups](https://man7.org/linux/man-pages/man7/cgroups.7.html)\
    \ 控制，允许守护进程（Docker、podman 等）创建一个环境，其中应用程序对完整系统的访问权限有限。通常，容器用于运行单个应用程序，仿佛它在实际主机上独立运行一样。这使得部署某些应用程序所需的独特环境变得更加容易。\n\
    \n明显的安全问题在于隔离。如果容器可以访问另一个容器的资源会发生什么？考虑到竞争公司的容器可能在云中的同一台机器上并排运行，恶意容器访问或干扰另一个容器的风险是什么？\n\
    \n### 10.1.3. 容器编排系统\n\n容器还使重启或扩展应用程序变得更加容易。容器编排系统通过监控容器并根据需要启动或停止它们来利用这一点。最流行的容器编排系统是\
    \ [Kubernetes](https://kubernetes.io/)，由 Google 开发用于管理 Web 应用程序。\n\n鉴于编排系统根据需要从镜像创建容器，一个明显的关注点是这些镜像的完整性。如果镜像仓库被攻破，编排系统仍会部署存储在那里的镜像，通常会使问题更加严重。容器从日志记录的角度来看也可能难以管理，这可能导致合规性问题。过去，公司可能监控单个服务器的日志，而现在他们必须监控服务器上数百个容器的日志。\n\
    \n### 10.1.4. IaaS\n\nIaaS 代表基础设施即服务，是指从提供商处购买虚拟机或容器资源。一些流行的 IaaS 公司包括 Amazon\
    \ Web Systems、Microsoft Azure 和 Linode。每个公司都有一些基本的安全工具和默认策略来帮助保护购买的资源，但最终，确保资源安全的大部分安全责任在于购买资源的团队。\n\
    \n### 10.1.5. PaaS\n\nPaaS 代表平台即服务，是指一种更高级别的服务，它在已建立的环境中部署应用程序，该环境运行在 IaaS 服务上。Heroku\
    \ 是这种服务的一个绝佳示例。\n\nHeroku 支持许多不同的应用程序，但它们的工作方式大致相同：想象有一个需要部署的 Django Web 应用程序的\
    \ Git 仓库。Heroku 将获取运行在 AWS 上的 Amazon EC2 实例，克隆仓库，安装带有所需依赖项的 Python 虚拟环境，并在系统上安装生产\
    \ Django Web 服务器。\n\n虽然用户可以自己执行这些步骤，但 PaaS 使部署应用程序变得更加容易。\n\n### 10.1.6. SaaS\n\
    \n软件即服务 (SaaS) 是一种我们非常熟悉的方法。SaaS 将 Web 应用程序作为订阅服务提供。一些示例包括 Webex、Dropbox、Google\
    \ Workspace 等。SaaS 是一种流行的软件变现方式。\n\nSaaS 的一个安全问题是它将信息集中到单个提供商处。如果运行软件的服务器被攻破，数百万人的个人身份信息\
    \ (PII) 可能会泄露。\n\n## 10.2. 云计算\n\nIaaS 开启了从本地部署软件转向 *在云中* 或在 IaaS 资源上部署的转变。信息技术已经看到了向云端的转变，又转回本地，中间有各种混合选项。企业可以根据自身需求选择任何这些模型。\n\
    \n### 10.2.1. 公有云\n\n"
