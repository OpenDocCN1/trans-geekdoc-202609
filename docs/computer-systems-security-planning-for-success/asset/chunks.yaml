- raw: "The Open Web Application Security Project (OWASP) is an international non-profit\
    \ organization focused on web application security. They have an active online\
    \ community with tools, forums, videos, and news posts. Their most popular resource\
    \ is the [OWASP Top 10](https://owasp.org/Top10), an annual listing of the most\
    \ popular web application vulnerabilities.\n\n## 9.2. SOC\n\nA security operations\
    \ center (SOC) is a dedicated team of security experts working within the business\
    \ they are protecting. Incident response and recovery is the job of the SOC. SOCs\
    \ also set up preventative infrastructure, monitor the environment, respond to\
    \ possible threats, manage logs, and maintain compliance.\n\nAn important concept\
    \ in the SOC is the idea of a *baseline*. A popular company may be attacked hundreds\
    \ of times over the course of a day. It is important that the SOC knows what the\
    \ average volume of attack is so they can maintain resources to respond. Through\
    \ monitoring an SOC can establish a baseline of what is normal in the environment.\n\
    \n## 9.3. Incidents\n\nIncidents are part of working at an SOC, they will occur.\
    \ The best SOCs may spot them before they’re an issue (or an incident even) and\
    \ have practice how to respond and recovery. The goal is to maintain continuity\
    \ of services provided even if an incident occurs.\n\n### 9.3.1. Precursors\n\n\
    Typically before an incident takes place, there are warning signs or precursors\
    \ telling you that an incident is going to occur. Precursors may be obvious like\
    \ threats from APTs, criminal organizations, or Hacktivist. They can also be subtle,\
    \ such as patterns of recon in web server logs or evidence of transient port scans.\
    \ Finally a precursor may be the discovery of a new exploit which leads to an\
    \ uptick in malicious actor activity for everyone. In all cases, it’s important\
    \ to keep an eye out for precursors. If an incident is caught in this phase it\
    \ is much easier to handle.\n\n### 9.3.2. Indicators\n\nThe next level up from\
    \ a precursor is an indicator. An indicator is an alert showing that an incident\
    \ has been detected. These may be raised by the IDS/IPS, endpoint management system,\
    \ malware scanners, network devices, or even a user report.\n\nOnce and indicator\
    \ alarm has been triggered, an SOC member must respond and investigate. In the\
    \ best case scenario the indicator is telling you that an incident has been detected\
    \ before too much damage has been done.\n\n## 9.4. Response\n\nIn the response\
    \ phase, the SOC deals with an incident to mitigate the harm it causes. Every\
    \ incident is different, but the governing principles and steps are the same.\n\
    \n### 9.4.1. Business Continuity\n\nThe concept of continuity is central to the\
    \ steps taken to respond to an incident. Remember that the goal is to keep things\
    \ running and keep services available. Business Continuity has three main parts:\
    \ Business Continuity Planning (BCP), Business Impact Analysis (BIA), and Disaster\
    \ Recovery Planning (DRP).\n\nBusiness Continuity Planning (BCP) is a methodology\
    \ for keeping things running. With BCP threats are identified in advance and critical\
    \ business processes are prioritized. Recovery procedures for these processes\
    \ have been developed and tested. In response to an incident, these procedures\
    \ are followed as practiced.\n\nBusiness Impact Analysis (BIA) identifies business\
    \ functions and rates the impact of an outage on these functions. BIA measures\
    \ the impact of an outage on:\n\n*   Property (tangible assets)\n\n*   Finance\
    \ (monetary funding)\n\n*   Safety (physical protection)\n\n*   Reputation (status)\n\
    \n*   Life (well being)\n\n*   Customers\n\nBIA can help pinpoint mission-essential\
    \ functions and single points of failure. This allows SOCs to determine where\
    \ there resources should go in terms of having the best chance of maintaining\
    \ business continuity.\n\nFinally having a Disaster Recovery Plan (DRP) makes\
    \ it easier to recover in the case of a large-scale issue. Disaster Recovery (DR)\
    \ entails policies, tools, and procedures to recover from an outage. DRPs will\
    \ detail order of restoration and require a lot of testing to ensure that the\
    \ entire suite of supported applications can be brought back up. A standard DRP\
    \ will detail:\n\n*   Purpose and Scope\n\n*   Recovery Team\n\n*   Preparing\
    \ for a Disaster\n\n*   Emergency Procedures or Incident Response During an Incident\n\
    \n*   Restoration Procedures and Return to Normal\n\n### 9.4.2. Redundancy\n\n\
    Redundant services can help with continuity by making sure there is always an\
    \ uncompromised service available. The key concepts of redundancy are detailed\
    \ within the language it uses:\n\nRedundancy \n\n: extra components/services that\
    \ run in case of failures \n\nFailover \n\n: the process of turning over to a\
    \ secondary device \n\nHigh availability (HA) \n\n: ensures high level of operation\
    \ performance \n\nFault tolerance \n\n: allows a system to continue in the event\
    \ of a failure \n\nSingle Point of Failure (SPOF) \n\n: a single failure that\
    \ can cause an outage \n\n#### Hot, Cold, & Warm\n\nOne typical way to implement\
    \ redundancy is through the use of hot, cold, and warm sites.\n\nA hot site is\
    \ a secondary location that is live and replicating in real-time what is happening\
    \ in production. In the case of the primary site going down, a hot site can failover\
    \ immediately.\n\nA cold site is a secondary location without equipment. A cold\
    \ site will take some time to set up and configure in the case of an outage.\n\
    \nA warm site is a secondary location with all equipment and connectivity. The\
    \ equipment will still need to be turned on and made production ready, but it\
    \ will not take as long to failover to a warm site as a cold one.\n\n#### RAID\n\
    \nRAID is an interesting case of redundancy that occurs at the server storage\
    \ level. RAID stands for Redundant Array of Inexpensive/Independent Disks and\
    \ as the name states it uses multiple disks to make reads/writes faster *and*\
    \ to be able to recover if one of the disks fails. It is important to note that\
    \ RAID is not a backup. Backups are meant to aid in recovery and can be co-located.\
    \ A RAID array is mean to work on a single machine and help mitigate damages cause\
    \ by disk failures.\n\nRAID has multiple levels, each of which prioritizes a different\
    \ aspect:\n\n*   RAID 0: Data is stripped across multiple disks to make reads/writes\
    \ faster. If a single disk is lost *the whole array goes down*.\n\n*   RAID 1:\
    \ Data is mirrored across multiple disks for redundancy. If a single disk is lost\
    \ the array can be recovered from the other disks.\n\n*   RAID 5: At least three\
    \ disks are used in a stripped and mirrored fashion such that read/write speeds\
    \ are increased *and* if a *single* disk goes down the array can be rebuilt.\n\
    \n*   RAID 10: A combination of RAID0 and RAID1.\n\n### 9.4.3. Isolation and Containment\n\
    \nThe first step in reaction to an incident is to remove the asset from the network\
    \ so that the damage does not spread. It is standard procedure for malware to\
    \ attempt to spread to other machines and the fastest way for it to do that is\
    \ through an internal network. By isolating the infected asset, we can help prevent\
    \ this.\n\nThere are a few other tools for containing malware such as sandboxing\
    \ and snapshots. Sandboxing refers to the practice of running processes in a controlled\
    \ environment on a machine. Most web browsers sandbox the JavaScript they run,\
    \ meaning that if a website is serving malicious JS it should not be able to affect\
    \ anything else on the machine. Snapshots refer to periodically saving the state\
    \ of the storage device on a machine. This allows the SOC to roll the machine\
    \ back to a previous state, before malware was active.\n\n### 9.4.4. Recovery\n\
    \nRecovery can be a long process, but it is the core of responding to an incident.\
    \ If it is possible to remove malware from a machine, that action is taken in\
    \ this step. Breached accounts are also disabled."
