- raw: "To sign in and client reaches out to the AS which gets a TGT from the TGS\
    \ running on the KDC and gives it to the client. The client gets the SPN of the\
    \ service it wants to utilize and sends it along with the TGT to the TGS. Assuming\
    \ the client has permission to access the service the TGS issues a ticket and\
    \ session to the client. The ticket is then used to connect to the service.\n\n\
    ### 7.3.11. Tokenization\n\nTokenization may be used as part of an access control\
    \ scheme to protect sensitive information. Information that would be highly valuable\
    \ if compromised is replaced with a random token known to the parties involved\
    \ in the transaction. In a typically scenario once the tokens have been established,\
    \ only the token is sent out over an untrusted network.\n\nImagine you don’t want\
    \ your credit card number exposed to merchants. One solution would be if you used\
    \ a payment service that issued you a new credit card number for each transaction.\
    \ This credit card number would only be valid for a single transaction and would\
    \ be billed to your regular credit card (which the payment service would have\
    \ access to). In this case the token is the one-time-use credit card number and\
    \ the sensitive information is your actual credit card number. Payment services\
    \ like ApplePay and GoogleWallet do exactly this.\n\n## 7.4. Lab: Linux File Permissions\n\
    \nIn this lab we are going to explore UNIX style file permissions and determine\
    \ what they can do and why they are limited. Finally we will see how Linux ACLs\
    \ provide more flexibility in assigning permissions.\n\nWe will be working in\
    \ a vanilla Ubuntu container and installing software and adding users manually.\
    \ Let’s start up the container, install the packages we need, and add some users\
    \ to work with:\n\n```\nC:\\Users\\rxt1077\\it230\\docs>docker run -it ubuntu\
    \ bash\nroot@11ce9e5ee80e:/# apt-get update\n<snip>\nroot@11ce9e5ee80e:/# apt-get\
    \ install acl\nReading package lists... Done\nBuilding dependency tree\nReading\
    \ state information... Done\nThe following NEW packages will be installed:\n \
    \ acl\n0 upgraded, 1 newly installed, 0 to remove and 4 not upgraded.\nNeed to\
    \ get 37.8 kB of archives.\nAfter this operation, 197 kB of additional disk space\
    \ will be used.\nGet:1 http://archive.ubuntu.com/ubuntu focal/main amd64 acl amd64\
    \ 2.2.53-6 [37.8 kB]\nFetched 37.8 kB in 0s (94.1 kB/s)\ndebconf: delaying package\
    \ configuration, since apt-utils is not installed\nSelecting previously unselected\
    \ package acl.\n(Reading database ... 4127 files and directories currently installed.)\n\
    Preparing to unpack .../acl_2.2.53-6_amd64.deb ...\nUnpacking acl (2.2.53-6) ...\n\
    Setting up acl (2.2.53-6) ...\nroot@11ce9e5ee80e:/# useradd alice\nroot@11ce9e5ee80e:/#\
    \ useradd bob\nroot@11ce9e5ee80e:/# useradd carol\nroot@11ce9e5ee80e:/# useradd\
    \ dave\n```\n\nTraditional UNIX file permissions support user and group ownership\
    \ of a file. Read, write, and execute permissions for a file can be set for the\
    \ user, group, or others. You can view the permissions of a file with the `ls\
    \ -l` command. Let’s make home directories for Alice, Bob, and Carol and view\
    \ the default permissions:\n\n```\nroot@11ce9e5ee80e:/# cd home\nroot@11ce9e5ee80e:/home#\
    \ mkdir alice bob carol\nroot@11ce9e5ee80e:/home# ls -l\ntotal 12\ndrwxr-xr-x\
    \ 2 root root 4096 Oct 28 01:28 alice\ndrwxr-xr-x 2 root root 4096 Oct 28 01:28\
    \ bob\ndrwxr-xr-x 2 root root 4096 Oct 28 01:28 carol\n```\n\nThe text `drwxr-xr-x`\
    \ tells us that these files are directories, the owner has read/write/execute\
    \ permission, the group has read/execute permission, and other users have read/execute\
    \ permission. It is important to note that execute permissions are required for\
    \ viewing the contents of a directory.\n\nFiles owners and a groups are set with\
    \ the `chown` command, following the format `chown <user>.<group> <filename>`.\
    \ Let’s try to use this command to make the home directories of alice, bob, and\
    \ carol private:\n\n```\nroot@11ce9e5ee80e:/home# chown alice.alice alice\nroot@11ce9e5ee80e:/home#\
    \ chown bob.bob bob\nroot@11ce9e5ee80e:/home# chown carol.carol carol\nroot@11ce9e5ee80e:/home#\
    \ ls -l\ntotal 12\ndrwxr-xr-x 2 alice alice 4096 Oct 28 01:28 alice\ndrwxr-xr-x\
    \ 2 bob   bob   4096 Oct 28 01:28 bob\ndrwxr-xr-x 2 carol carol 4096 Oct 28 01:28\
    \ carol\n```\n\nWhen a user is added to a UNIX system with the `useradd` command\
    \ a group with their name is created. This allows us to pass a group to `chown`\
    \ that only they will have access to. While this is a good start, others still\
    \ have the ability to read and execute these directories, meaning *anyone* can\
    \ view the contents. To prove this, lets assume the role of dave and try doing\
    \ an `ls` on each of the directories:\n\n```\nroot@11ce9e5ee80e:/home# su dave\
    \ ①\n$ ls alice\n$ ls bob\n$ ls carol\n$ exit\n```\n\n1.  *①* `su` allows us to\
    \ assume the role of anyone, often it is used to assume the role of the *superuser*\n\
    \nThe `ls` command was successful even though there were no files to look at.\
    \ If we weren’t able to view the contents, we would have received a permission\
    \ denied error. The `chmod` command is used to modify file permissions for a User\
    \ (`u`), Group (`g`), Others (`o`), or All (`a`). `chmod` can remove a permission\
    \ with `-`, add a permission with `+`, or set a permission (removing others) with\
    \ `=`. Let’s use `chmod` to actually make these home directories private:\n\n\
    ```\nroot@11ce9e5ee80e:/home# chmod u=rwx,g=,o= alice\nroot@11ce9e5ee80e:/home#\
    \ chmod u=rwx,g=,o= bob\nroot@11ce9e5ee80e:/home# chmod u=rwx,g=,o= carol\nroot@11ce9e5ee80e:/home#\
    \ ls -l\ntotal 12\ndrwx------ 2 alice alice 4096 Oct 28 01:28 alice\ndrwx------\
    \ 2 bob   bob   4096 Oct 28 01:28 bob\ndrwx------ 2 carol carol 4096 Oct 28 01:28\
    \ carol\n```\n\nThings look much better, but let’s test it and see if Dave can\
    \ view any of the directories:\n\n```\nroot@11ce9e5ee80e:/home# su dave\n$ ls\
    \ alice\nls: cannot open directory 'alice': Permission denied\n$ ls bob\nls: cannot\
    \ open directory 'bob': Permission denied\n$ ls carol\nls: cannot open directory\
    \ 'carol': Permission denied\n$ exit\n```\n\nLastly, lets make sure that Alice\
    \ can view the contents of her home directory:\n\n```\nroot@11ce9e5ee80e:/home#\
    \ su alice\n$ ls alice\n$ exit\n```\n\nLooks good!\n\nUnfortunately traditional\
    \ UNIX file permissions often do not provide the granularity needed in a modern\
    \ system. For example, lets assume that we wanted a web server to be able to view\
    \ the contents of Alice, Bob, and Carol’s home directories. This is typically\
    \ done to allow users to place a `public_html` directory in their home directory\
    \ and set up a personal web space. We could do this by making their home directories\
    \ viewable by others, but then we have the same issue we started with. We could\
    \ also do this by changing the group ownership of their home directories to a\
    \ group that the web server is part of, but then we open up the home directories\
    \ to any other users or services that are part of that group.\n\nThe solution\
    \ to this problem is to use Linux ACLs, which allow you to fine tune permissions.\
    \ Two commands, `setfacl` and `getfacl` are used to adjust Linux ACLs. As an example\
    \ let’s add an http user, use the `setfacl` command to explicitly give the http\
    \ user read and execute permissions to all three directories, list the new permissions,\
    \ and list the new ACLs:\n\n```\nroot@11ce9e5ee80e:/home# useradd http\nroot@11ce9e5ee80e:/home#\
    \ setfacl -m u:http:rx alice bob carol\nroot@11ce9e5ee80e:/home# ls -l\ntotal\
    \ 12\ndrwxr-x---+ 2 alice alice 4096 Oct 28 01:28 alice ①\ndrwxr-x---+ 2 bob \
    \  bob   4096 Oct 28 01:28 bob\ndrwxr-x---+ 2 carol carol 4096 Oct 28 01:28 carol\n\
    root@11ce9e5ee80e:/home# getfacl alice bob carol\n# file: alice\n# owner: alice\n\
    # group: alice\nuser::rwx\nuser:http:r-x\ngroup::---\nmask::r-x\nother::---\n\n\
    # file: bob\n# owner: bob\n# group: bob\nuser::rwx\nuser:http:r-x\ngroup::---\n\
    mask::r-x\nother::---\n\n# file: carol\n# owner: carol\n# group: carol\nuser::rwx\n\
    user:http:r-x\ngroup::---\nmask::r-x\nother::---\n```\n\n1.  *①* Notice the `+`\
    \ sign indicating there are extra permissions\n\nWhen you are done, you can type\
    \ exit to exit bash and stop the container.\n\n## 7.5. Review Questions"
