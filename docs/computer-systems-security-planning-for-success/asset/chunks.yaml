    # 4.2.3. NAT


    网络地址转换（NAT）主要用于允许本地 IP 地址共享一个公共 IPv4 地址。鉴于 IPv4 地址空间的匮乏，许多设备不得不共享一个地址。如在讨论 IPv6
    时所提及，NAT 路由器通常还包含安全功能，例如有状态防火墙，因为执行 NAT 所需的硬件复杂性与防火墙所需的相当。


    # 4.2.4. IPsec


    互联网协议安全（IPsec）用于建立点对点加密隧道，以保护 IP 网络中传输的数据。IPsec 主要用于专用 VPN 链路，并利用三个主要部分：SA、ESP
    和 AH：


    SA 代表安全关联，是一个用于设置加密参数和交换密钥的通道。这通过 UDP 端口 500 进行。ESP 代表封装安全负载，用于加密 IP 头部和载荷。它使用标准
    IP 数据包发送，协议字段设置为 50。AH 代表认证头部，可选地用于标准 IP 数据包中，协议字段设置为 51。AH 仅确保数据包未被篡改。


    # 4.3. Transport Layer Protocols


    ## 4.3.1. TCP


    传输控制协议（TCP）是大多数网络的核心。它通过三次握手提供可靠通信，将大数据段分解为数据包，确保数据完整性，并为这些数据包提供流量控制。当然，这一切都有代价，这种面向连接的协议通常比其对等体具有更高的延迟。鉴于
    TCP 的复杂性，它经常成为攻击目标。TCP 栈不断适应和变化（在协议参数范围内），以避免 DoS 和 MitM 攻击。


    ## 4.3.2. UDP


    用户数据报协议（UDP）是一种无连接协议，专为 TCP 可能延迟过高的场景设计。UDP 通过不进行握手或流量控制来实现这种性能提升。结果是一种速度快的协议，有时会丢弃数据报。UDP
    常用于游戏或流媒体协议的基础，在这些协议中，数据包的时序比它们是否全部到达更重要。UDP 仍然使用校验和，因此您可以确保收到的任何 UDP 数据包的完整性。


    ## 4.3.3. Common Ports and Services


    端口号用于传输层连接中，以指定要连接的服务。这允许单个主机上运行多个服务。端口 0 到 1023 是知名端口，通常支持常用服务。在大多数操作系统中，绑定到知名端口并监听连接需要管理员权限。注册端口范围从
    1024 到 49151，运行服务不需要管理员权限。您可能会发现许多东西在监听这些端口，因为任何用户都可以在上面运行服务。最后，端口 49152 到 65535
    由应用程序根据需要动态使用。


    了解一些常用端口很重要，因为在这些端口上运行的服务可能会受到攻击。扫描机器时，只应打开必要的端口。


    | Port Number | L4 Protocol | Usage |

    |-------------|-------------|-------|

    | 20 | TCP | File Transfer Protocol (FTP) Data Transfer |

    | 21 | TCP | FTP Command Control |

    | 22 | TCP | Secure Shell (SSH) |

    | 23 | TCP | Telnet Remote Login Service |

    | 25 | TCP | Simple Mail Transfer Protocol (SMTP) E-Mail |

    | 53 | TCP, UDP | Domain Name System (DNS) |

    | 67, 68 | UDP | Dynamic Host Configuration Protocol (DHCP) |

    | 69 | UDP | Trivial File Transfer Protocol (TFTP) |

    | 80 | TCP | Hypertext Transfer Protocol (HTTP) |

    | 110 | TCP | Post Office Protocol (POP3) E-Mail |

    | 119 | TCP, UDP | Network News Transfer Protocol (NNTP) |

    | 123 | UDP | Network Time Protocol (NTP) |

    | 137-139 | TCP, UDP | NetBIOS |

    | 143 | TCP | Internet Message Access Protocol (IMAP) E-Mail |

    | 161, 162 | TCP, UDP | Simple Network Management Protocol (SNMP) |

    | 194 | TCP, UDP | Internet Relay Chat (IRC) |

    | 389 | TCP, UDP | Lightweight Directory Access Protocol (LDAP) |

    | 443 | TCP | HTTP Secure (HTTPS) HTTP over TLS/SSL |

    | 3389 | TCP, UDP | Microsoft Terminal Server (RDP) |


    # 4.4. Application Layer Protocols


    ## 4.4.1. DHCP


    动态主机配置协议（DHCP）用于允许网络上的新客户端获取 IP 地址和所提供服务的信息。IPv4 地址可以被视为两组：静态地址和动态地址。动态地址由 DHCP
    服务器在特定租期内分配。时间到期后，DHCP 服务器可能将地址分配给另一个客户端。DHCP 服务器还可以提供有关代理、域名服务器（DNS）、网关甚至从网络启动操作系统内核位置的信息！


    鉴于现代网络的动态性质，客户端不断加入和离开，DHCP 是标准。从安全角度来看，冒充 DHCP 服务器的人可能会对网络造成严重破坏。这些恶意 DHCP 服务器可能导致流量被重定向以发起
    MitM 攻击或导致 DoS 攻击。DHCP 依赖于广播地址解析协议（ARP）消息，并且不使用身份验证，这意味着一旦攻击者与受害机器处于同一以太网段，一切都无从谈起。


    ## 4.4.2. HTTP


    超文本传输协议（HTTP）是一种基于文本的协议，用于管理网络流量的传输。它基于请求和响应的概念。典型的请求有一个方法和一个路径，例如 GET /index.html，这将检索网站的登录页面。响应有一个代码、消息，并可选地包含数据。一些标准响应如下所示：


    | Code | Message |

    |------|---------|

    | 200 | OK |

    | 202 | Accepted |

    | 400 | Bad Request |

    | 401 | Unauthorized |

    | 403 | Forbidden |

    | 404 | Not Found |

    | 500 | Internal Server Error |

    | 502 | Bad Gateway |

    | 503 | Service Unavailable |


    请求和响应都可以利用头部，即在初始请求或响应之后的任意文本行。由于头部被设计为开放式，因此随着时间的推移添加了许多新头部。现代 Web 请求/响应通常在头部中包含比
    HTTP 1.1 定义的基础内容多得多的信息。未加密的 HTTP 流量通过端口 80 发送，容易受到攻击，因为所有信息都以明文形式发送。


    ## 4.4.3. SSL/TLS


    安全套接层（SSL）或更现代的命名传输层安全（TLS）是一种协议，允许用于 Web 的明文协议被加密。它是一种通用协议，设计为其他协议通信的层。一些通常包装在
    TLS 中的协议包括 HTTP、SMTP、IMAP、VoIP 和许多 VPN 协议。TLS 使用握手来交换证书信息，如图所示。应当注意的是，在撰写本文时，TLS
    1.3 是最新版本，但只有半数网站支持它。TLS 1.2 是最常见的版本，如果遵循最佳实践，仍被认为是安全的，而 TLS 1.1 或更低版本被认为已弃用。


    ## 4.4.4. HTTPS


    HTTPS “icon” by Sean MacEntee used under CC-BY 2.0.


    超文本传输协议安全（HTTPS）通过将 HTTP 请求包装在 TLS 中来解决未加密流量的问题。HTTPS 流量使用端口 443，通常在浏览器左上角显示一个锁图标。单击图标，用户可以了解用于通信的证书的更多信息。利用强大的
    PKI，HTTPS 允许客户端和服务器之间进行安全的 HTTP 通信。


    ## 4.4.5. RDP


    远程桌面协议（RDP）内置于 Windows，通常用于远程控制机器。它通过 TCP 或 UDP 在端口 3389 上工作。虽然 RDP 对于在远程机器上执行远程管理非常有用，但如果不法分子获得访问权限，它也可能成为巨大的安全漏洞。RDP
    在勒索软件攻击中的使用正在增加，因为勒索软件程序可能使用 RDP 来寻找其他攻击目标机器。


    ## 4.4.6. Telnet


    Telnet 是一种过时的远程管理工具，通过明文通道提供对 shell 的访问。Telnet 运行在端口 23 上，虽然仍偶尔使用，但应当大多被淘汰。您仍会在嵌入式应用程序和旧系统中发现
    Telnet。您也可能看到客户端被用于检查其他类型的流量。例如，您可以使用 Telnet 客户端提交 HTTP 请求或通过 SMTP 发送电子邮件。


    ## 4.4.7. SSH


    安全外壳协议（SSH）是部署最广泛的远程管理工具。SSH 通过加密连接提供对 shell 的访问。SSH 支持许多选项，包括 SOCKS5 代理、端口转发以及多种身份验证方案的使用：密码、密钥、硬件设备等。SSH
    使用 TCP 端口 22。


    ## 4.4.8. LDAP


    轻量级目录访问协议（LDAP）用于访问和维护目录信息服务。它的主要用途是与 Windows Active Directory (AD) 配合使用，可用于从
    AD 服务器获取有关用户和资源的信息。客户端可以通过服务器进行身份验证，并获得读取或读/写某些条目的权限。LDAP 最初不支持加密，因此开发了 LDAP over
    SSL (LDAPS)。LDAP 使用 TCP 和 UDP 端口 389，LDAPS 使用 TCP 端口 636。


    ## 4.4.9. DNS


    域名系统（DNS）用于将域名解析为 IP 地址。域名是人们习惯用于网站的简单名称，例如 njit.edu，而不是 54.83.189.142。名称对于人们来说比
    IP 地址容易记住得多。为了让计算机解析名称，它首先查询本地缓存，然后查询其主 DNS 服务器。假设 DNS 服务器找不到名称，它将查询根服务器以获取顶级域（TLD）服务器，该服务器维护该特定域（edu、com、net、org、gov
    等）的权威名称服务器列表。最后，一旦找到权威名称服务器，它将响应该特定主机名的 IP 地址，该地址将被缓存并通过用户的主 DNS 服务器发送回用户。


    DNS 设计为具有弹性和去中心化，但不幸的是，流量未经过身份验证或加密。这使其成为 MitM 攻击的目标。同样，缓存命中和未命中可以泄露最近解析了哪些名称的信息（就像在发现索尼
    Rootkit 规模时的情况一样）。DNS 的递归性质在过去也允许 DoS 攻击，但大部分问题已通过将递归查询限制在面向用户的 DNS 服务器（即 DHCP
    请求提供给您的服务器）上来解决。DNS 通过 UDP（偶尔也通过 TCP）在端口 53 上运行。


    ## 4.4.10. DNSSEC


    域名系统安全扩展（DNSSEC）是一套旨在对域名查找响应进行身份验证的扩展规范。这可以通过检查响应服务器的数字签名来帮助防止 MitM 攻击。虽然这当然很有帮助，但重要的是要注意，DNSSEC
    不提供机密性。任何有权访问流量的人仍然可以监控 DNS 解析。


    ## 4.4.11. IMAP/POP3


    互联网消息访问协议（IMAP）和邮局协议 3（POP3）是用于从服务器检索电子邮件的两种协议。IMAP 是较新的协议，支持在服务器上保存邮件和文件夹。POP3
    更为原始，仅支持检索（以及随后从服务器删除）电子邮件。两种协议都使用明文，现在通常在 TLS 上运行。POP3 默认使用 TCP 端口 110，如果使用 TLS
    则为 995。IMAP 默认使用 TCP 端口 143，如果使用 TLS 则为 993。在 Web 邮件时代，很容易忘记这些协议，但安全专家必须牢记它们，因为它们可能仍用于支持企业设备。


    ## 4.4.12. SMTP


    简单邮件传输协议用于发送/转发电子邮件。正如其名称所示，它是一种简单的协议，由文本行组成。基本 SMTP 使用 TCP 端口 25。SMTP 后来扩展以支持身份验证，并最终被包装在
    TLS 中，仍然使用 TCP 端口 587。SMTP 服务器接受（希望是）经过身份验证的客户端的外发邮件，根据 DNS 记录中的邮件交换（MX）信息将邮件路由到其他
    SMTP 服务器，并接受来自其他 SMTP 服务器的其域邮件。SMTP 服务器已实施各种检查，以确保来自某个域的消息确实来自该域。这主要用于打击垃圾邮件，垃圾邮件继续是一个问题。


    ## 4.4.13. NTP


    网络时间协议使用 UDP 端口 123 将系统时间与时间服务器同步。NTP 服务器分层为 stratum，最低的 stratum 最接近最准确的时间源，如原子钟、GPS
    等。NTP 很重要，因为许多协议（包括几个关键交换）要求系统时钟同步。系统时钟也用于检查证书何时过期，并在日志中用于指示某事发生的时间。如果没有准确、同步的系统时钟，许多事情会以令人惊讶的方式失败。


    ## 4.4.14. FTP


    文件传输协议是一种相对简单的基于文本的协议，用于在机器之间传输文件。FTP 使用 TCP 端口 21，传统上建立两个通道：一个用于协议消息，另一个二进制通道用于数据。这种设置有趣的地方在于，FTP
    服务器会发起从服务器到客户端的数据通道连接，这意味着在许多 NAT 情况下，如果客户端位于防火墙后且不易被访问，连接就会失败。解决此问题的方法是被动 FTP，它使用由客户端建立的单个通道。


    尽管存在此初始缺陷，FTP 已被证明非常受欢迎，并且仍在许多企业环境中使用。您可能会看到 FTP 用于传输大量数据以导入系统，或用于在嵌入式系统中更新固件。您可以使用命令行客户端
    ftp、图形客户端（如 Filezilla 或 SecureFX），甚至在大多数 Web 浏览器中使用 ftp:// URL 方案来使用 FTP。


    不幸的是，FTP 不支持除密码以外的身份验证系统，且密码以明文形式发送。因此，建议使用安全 FTP（SFTP）。SFTP 使用 SSH 连接通过加密通道发送和接收文件。SFTP
    还支持所有 SSH 身份验证方法。


    ## 4.4.15. SNMP


    SNMP by Deegii121314 used under CC-BY-SA 4.0


    简单网络管理协议用于收集有关网络运行情况的信息。它分为两组：使用 UDP 端口 161（TLS 10161）的客户端和使用 UDP 端口 162（TLS 10162）的管理器。管理器收集客户端关于网络运行情况的消息，并使用这些信息根据需要采取行动。SNMP
    可用于传递有关机器温度、当前连接数、当前正在使用的通道容量等信息。SNMP 目前已更新至版本 3，该版本加密并要求身份验证。这一点尤为重要，因为 SNMP
    是一种非常强大的协议，交换的信息可能对攻击者非常有价值。对 SNMP 的访问应受到限制，并且应监控其在网络上的使用情况。


    # 4.5. Lab: Scanning with nmap


    对于本实验，我们将首先下载并提取所需的文件。下载 nmap.zip 并将其提取到可以从 shell 访问的目录中。在该目录中打开一个 shell（它应该包含一个
    docker-compose.yml 文件以及 victim 和 scanner 目录）。由于我们将在此实验中模拟多台机器，我们将使用已随 Docker 一起安装的
    Docker Compose。Docker Compose 读取 docker-compose.yml 文件，该文件应该已经在您的 nmap 目录中。运行
    docker-compose up --build --detach 以在后台构建和运行镜像：


    ```

    PS C:\Users\rxt1077\temp\nmap> docker-compose up --build --detach

    ```


