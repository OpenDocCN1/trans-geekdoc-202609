    \ also be used to provide `integrity`: proving that the data is valid. With cryptography\
    \ you can provide a `signature` for the data showing that the person who claims\
    \ to have sent it really did send it. Cryptography also allows for `non-repudiation`\
    \ as it can show that only one person was capable of sending a particular message.\
    \ Lastly cryptography also allows us to perform authentication `without` storing\
    \ passwords in plaintext. This is critical in an age where data breaches are increasingly\
    \ common.\n\n## 2.2. Terminology\n\nGoing forward, it is important to address\
    \ some common cryptography terms as they will be used frequently:\n\nPlaintext\
    \ \n\n: [unencrypted information](https://en.wikipedia.org/wiki/Plaintext), data\
