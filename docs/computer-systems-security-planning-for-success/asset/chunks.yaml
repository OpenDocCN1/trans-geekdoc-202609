    ### 2.10.8. 隐写术


    隐写术是将数据隐藏在某物中的过程，使得普通观察者无法检测到。数据可以隐藏在音频、图像，甚至 [纯文本！](https://dl.packetstormsecurity.net/crypt/snow/description.html)
    中。如果需要额外的安全层，隐藏的数据也可以被加密。在安全领域，恶意代码可能使用隐写技术隐藏在其他文件中。这使得工具在搜索存储时更难找到它们。


    ## 2.11. 实验：哈希它


    一个 `hash` 是一种单向加密函数，它为给定的 `message` 生成一组 `unique` 的字符。在理想世界中，给定一个哈希，你应该 `不` 能确定原始消息是什么，但给定一个哈希和原始消息，你可以检查哈希是否与消息匹配。在深入探讨哈希的用途之前，让我们通过查看一个简单且因此糟糕的哈希算法来进一步理解它。^(\[³)


    **变位词哈希**


    假设我们想要对消息 "Hello from Karl" 进行哈希处理，以便我们可以拥有一个唯一代表该短语的字符串。一种方法是删除消息中的所有标点符号，将所有内容转换为小写，然后按字母顺序排列所有字母。"Hello
    from Karl" 变成 "aefhklllmoorr"。你可以把它想象成说，“消息中有一个 ''a''，消息中有一个 ''e''，消息中有一个 ''f''，消息中有一个
    ''k''，消息中有三个 ''l''……” 现在我们的哈希 "aefhklllmoorr" 可以用来唯一标识该短语。


    现在假设 Karl 想要给我们发送一条消息，但他不信任发送消息的人。他可以使用不可信的一方来发送消息，然后将哈希放在某个公共地方，比如网站上。我们可以使用哈希来知道消息来自
    Karl `并且` 如果其他人得到了哈希，他们将无法辨别消息，因为哈希是一种单向函数。"aefhklllmoorr" 透露了关于消息的很少信息，但它可以用来检查其准确性。


    希望这开始展示哈希的威力。现在让我们来看看另一种非常常见的用例，并找出为什么这是一个糟糕的算法。


    假设你运行一个网站，用户使用密码登录。你想确保用户在登录时使用他们的密码，但你不想在网站上存储密码。这很常见。如果你的网站被攻破，你不想泄露一大堆人的密码。你该怎么办？你可以存储他们密码的哈希，在尝试登录时对密码进行哈希处理，并比较哈希。例如，如果我们的密码是
    "password"，使用我们的基本哈希算法，哈希将是 "adoprssw"。我们可以将 "adoprssw" 存储在数据库中，在登录期间用于比较，如果有人偷了数据库中的数据，他们将不知道原始密码是
    "password"。这可能防止攻击者利用许多人在多个网站上使用相同密码的事实。


    问题是，有很多东西哈希为 "adoprssw"，包括 "wordpass"、"drowsaps"，甚至我们正在存储的哈希："adoprssw"。当多个消息具有相同的哈希时，这被称为
    `collision`，这个特定的算法是无用的，因为它生成了太多的碰撞。


    现在我们了解哈希的作用以及它们在一定程度上如何实现，让我们来看看一个更有用的哈希函数。


    **MD5**


    在本节中，我们将使用 Docker 和终端。[请按照这些说明安装 Docker。](https://docs.docker.com/get-docker/)
    对于 Windows，你可以使用 [Windows Terminal 应用](https://www.microsoft.com/en-us/p/windows-terminal/9n0dx20hk701)，在
    MacOS 上你可以使用预安装的 Terminal 应用。灰色框显示在终端中输入的命令，尽可能显示典型输出。你的提示符（命令前显示的部分）可能因操作系统而异。


    首先在自定义 Linux 容器上运行 BASH shell：


    ```

    ryan@R90VJ3MK:/windir/c/Users/rxt1077/it230/docs$ docker run -it ryantolboom/hash
    ①

    root@8e0962021f85:/②

    ```


    1.  *①* 这里我们正在交互式地使用 Docker run 命令（-it），因为该容器默认运行 bash


    2.  *②* 注意新的提示符，显示我们在这个容器上是 root


    MD5 是一种消息摘要算法，它产生的哈希比我们的变位词算法好得多。大多数 Linux 发行版包含一个简单的实用程序，用于基于文件内容创建 MD5 哈希。这个命令名为
    `md5sum`。通常用于检测文件是否被篡改。网站可能提供下载软件的链接以及文件的 MD5 哈希，以便你知道下载的内容是正确的。同样，安全系统可能会保留某些关键文件的
    md5sums（MD5 哈希），以确定它们是否被恶意软件篡改。让我们练习对 `/etc/passwd` 文件进行 md5sum：


    ```

    root@8e0962021f85:/# md5sum /etc/passwd

    9911b793a6ca29ad14ab9cb40671c5d7  /etc/passwd ①

    ```


    1.  *①* 这一行的第一部分是 MD5 哈希，第二部分是文件名


    现在我们将创建一个包含 *你* 的名字的文件，并将其存储在 `/tmp/name.txt` 中：


    ```

    root@8e0962021f85:/# echo "<your_name>" >> /tmp/name.txt ①

    ```


    1.  *①* 用你的实际名字替换 `<your\_name>`


    作为我们的最后活动，让我们来看看哈希的一些弱点。


    **哈希破解**


    Linux 系统中的密码被哈希并存储在 `/etc/shadow` 文件中。让我们打印该文件的内容来看看它的样子：


    ```

    root@7f978dd90746:/# cat /etc/shadow

    root:*:19219:0:99999:7:::

    daemon:*:19219:0:99999:7:::

    bin:*:19219:0:99999:7:::

    sys:*:19219:0:99999:7:::

    sync:*:19219:0:99999:7:::

    games:*:19219:0:99999:7:::

    man:*:19219:0:99999:7:::

    lp:*:19219:0:99999:7:::

    mail:*:19219:0:99999:7:::

    news:*:19219:0:99999:7:::

    uucp:*:19219:0:99999:7:::

    proxy:*:19219:0:99999:7:::

    www-data:*:19219:0:99999:7:::

    backup:*:19219:0:99999:7:::

    list:*:19219:0:99999:7:::

    irc:*:19219:0:99999:7:::

    gnats:*:19219:0:99999:7:::

    nobody:*:19219:0:99999:7:::

    _apt:*:19219:0:99999:7:::

    karl:$y$j9T$oR2ZofMTuH3dpEGbw6c/y.$TwfvHgCl4sIp0b28YTepJ3YVvl/3UyWKeLCmDV1tAd9:19255:0:99999:7:::
    ①

    ```


    1.  *①* 如你所见，`karl` 用户在其用户名后面有一个长哈希


    哈希的一个问题是，如果人们选择简单的密码，它们可以被一个程序轻松破解，该程序获取常见密码的单词列表，生成它们的哈希，然后检查哈希是否相同。虽然哈希可能是一种单向函数，但它仍然受到这种攻击的影响。我们将使用一个名为
    [John the Ripper](https://www.openwall.com/john/) 的程序，并做 exactly 那样。


    John the Ripper 已经安装在这个容器中，并附带一个简单的单词列表。我们将告诉它使用默认单词列表来尝试确定与 `/etc/shadow` 中 karl
    的哈希匹配的密码是什么：


    ```

    root@8e0962021f85:/# john --format=crypt --wordlist=/usr/share/john/password.lst
    /etc/shadow

    Loaded 1 password hash (crypt, generic crypt(3) [?/64])

    Press ''q'' or Ctrl-C to abort, almost any other key for status

    <karl''s password>             (karl)

    1g 0:00:00:01 100% 0.6211g/s 178.8p/s 178.8c/s 178.8C/s lacrosse..pumpkin

    Use the "--show" option to display all of the cracked passwords reliably

    Session completed

    ```


    '
