    or possibly even artificial intelligence to trigger its warning system. In the
    case of a solution that creates a lot of false positives, it can be tiring for
    a team to go through each alert. Eventually teams are conditioned to ignore the
    alerts, making the security solution useless. ¶ The key to lowering the false
    positive rate of a system is to better tune the rule set used to trigger the warnings.
    A security team may spend time determining a baseline of events and looking for
    abnormalities that correspond to actual attacks. This information can then be
    used to build a better detection system. ¶ Webroot Antivirus ¶ In 2017 a popular
    antivirus service created a bad rule that identified certain Windows operating
    system files as threats. The antivirus solution quarantined these files, which
    were critical for the operation of the machine. The result was a machine that
    was unusable. ¶ For 13 minutes, Webroot distributed this rule to its antivirus
    software shutting down operations on an untold number of machines. Fortunately
    Webroot was able to quickly identify the problem and send out an update which
    would have allowed the machines to automatically fix the problem. Unfortunately
    their infrastructure for distributing the update quickly became overloaded. ¶
    When a security solution fails to identify a threat, this is known as a false
    negative. While no solution can ever be 100% effective, false negatives can undermine
    confidence in a product. False negatives may be resolved by a skilled SOC team,
    closely monitoring what is happening. It is also possible to address false negatives
    through Layered Security a concept that we will cover next. ¶ 6.2. Layered Security
    ¶  ¶ Given that a single security solution is never 100% effective it makes sense
    to approach security in layers and use multiple systems. There is often a lot
    of overlap between solutions and while that may seem inefficient in other fields,
    in cybersecurity we consider it a benefit. By using multiple solutions, sometimes
    referred to as multi-layered security or defense in depth, you can build a more
    robust protection against breaches. ¶ Let’s take a look at an example to see how
    layered security can help mitigate the effects of a real-world attack. Assume
    an SOC is supporting a web application on self-hosted machines. A malicious actor
    wishes to exfiltrate data from the web application. They begin by testing to see
    if SQL several different SQL injection attacks yield any results. ¶ A well designed
    web application should sanitize its inputs and may prevent the queries from making
    it to the database. Similarly an alert team may notice a sudden uptick in SQL
    queries, far beyond the usual baseline for the application. An IDS (Intrusion
    Detection System) may flag the queries as known SQL injection attacks. Assuming
    the attack makes it past the application, team, and the IDS, it is possible that
    the database user is configured according to the principle of least privilege
    and the queries will not be executed due to a lack of permissions. ¶ As you can
    see, any one of these layers may be fail, but by having multiple layers the chance
    of an attack occurring is greatly diminished. ¶ 6.3. Network Solutions ¶ Many
    products are available for handling network traffic. They are typically marketed
    as either stand-alone devices, software to install on internal devices, or a subscription
    service that routes traffic through an external appliance. In the age of cloud
    computing network security as a service is becoming increasingly popular. ¶ 6.3.1.
    Firewall ¶ A firewall is a service/software/device that blocks unwanted traffic
    and permits wanted traffic. Typically a firewall is a barrier between and private
    network and the Internet. ¶ Software like nftables can be used to build a firewall
    on a Linux router for many interior clients. Interior clients may also run host-based
    firewalls such as Windows Defender Firewall. Finally hardware solutions for plug-in
    firewall devices are available from many vendors including Palo Alto and Cisco.
    Any combination of these solutions may be used. ¶ Firewalls typically employ rules
    regarding which packets can come in and how to handle them. For example a firewall
    may have a rule to ALLOW packets from exterior hosts connecting on port 22. This
    would allow SSH connections. Likewise a firewall may have a rule to track internal
    to external connection requests and perform network address translation (NAT).
    On an IPv4 network it is common to have a firewall also perform NAT. ¶ Next-Gen
    Firewalls (NGFW) perform the same functions of a standard firewall, but also employ
    an integrated intrusion prevention system (IPS) to mitigate threats. The firewall
    is a perfect place to perform these actions as it can easily close of connections.
    NGFW often tout artificial intelligence threat monitoring and automatic threat
    intelligence updating (typically updating attack signatures). A NGFW can also
    easily be built on a Linux device by making use of an IPS in conjunction with
    a netfilter firewall. ¶ Network infrastructure may also make use of a special
    space outside of a firewall called the Demilitarized Zone (DMZ). Servers that
    need to be directly connected to the Internet are often put in the DMZ so they
    don’t have a deal with restrictive firewall rules. These servers may be used to
    detect malicious activity, monitor incoming traffic, or to handle basic requests
    such as serving static web pages. ¶ The largest firewall in the world is the Chinese
    Great Firewall, started in 1998 as a way to prevent outside influence in China.
    It is a system used to block IPs, hijack DNS queries, throttle traffic, and perform
    MitM decryption. The Great Firewall is made of proxies and firewalls performing
    packet-inspection and content filtering. VPNs are often employed within China
    to circumvent the great firewall and the great firewall is continually updated
    to attempt to detect and shut down this traffic. ¶ 6.3.2. Proxy ¶  ¶ A proxy typically
    sits between the users and an external network. Proxies and receive and send requests
    on behalf of a user, allowing for full control over the traffic going out and
    coming back in. ¶ Proxies can be used for caching, access control, URL filtering,
    content scanning, and even packet inspection. Proxy solutions may be explicit
    or transparent and are offered by many companies including McAfee, Fortigate,
    Netsparker, and Palo Alto. A typical application of a proxy would be to filter
    explicit content on a school district network. ¶ Proxies can also be broken into
    forward and reverse configurations. A forward proxy passes requests from a private
    or internal network to the internet. Forward proxies can speed up local requests
    through caching and validate that the request should be performed. Forward proxies
    are interoperable with standard firewalls and network address translation (NAT).
    ¶ Reverse proxies take requests from an external source and pass it to an internal
    service. This helps prevent clients from having direct access to internal services.
    Reverse proxies can utilize caching and validate requests as well. A reverse proxy
    can also be configured to work with a firewall. Whereas it used to be common practice
    to place a server in a demilitarized zone (DMZ) outside of a firewall, it is now
    far more common to employ a reverse proxy to reach that server. ¶ 6.3.3. Load
    Balancer ¶ A common application for reverse proxies is to act as a load balancer
    for traffic. Load balancers distribute work, in the form of external client requests,
    among the internal resources, typically servers. ¶ For example, if a company has
    four servers supporting a web application, they may employ a reverse proxy load
    balancer that takes requests from clients and passes that request to one of the
    four internal servers. Different metrics are used to determine how the servers
    are utilized including least used (round robin), weighted, least amount of active
    connections. Load balancers optimize bandwidth and increase availability. ¶ 6.3.4.
    VPN ¶ A virtual private network (VPN) is used to encrypt internet traffic between
    two networks or a client and a network. VPNs have become standard procedure for
    linking remote offices or connecting remote workers. Given the growth of working
    from home, almost all users have become familiar with what a VPN is and what it
    does. ¶ Site-to-site VPNs are typically used for linking offices together. This
    kind of VPN is on permanently. An example would be linking two college campuses:
    NJIT Newark and NJIT Jersey City. In this scenario users on either campus expect
    to be able to connect securely to services on the opposite campus at all times.
    The traffic is encrypted and carried over the Internet. ¶ Remote access VPNs are
    used by individuals connecting in to a secure network. This kind of VPN is usually
    stated through a application such as Cisco AnyConnect. When the application is
    running the user is able to securely access internal resources as if they were
    at the office. ¶ Many vendors offer VPN products including Cisco, Citrix, Fortinet,
    Palo Alto, and Checkpoint. Many open source options also exist for building VPNs
    including OpenVPN, WireGuard, and IPsec. ¶ 6.3.5. TAP ¶ Sometimes it is necessary
    for a network or security engineer to monitor what is happening on a particular
    network segment. In this case a network terminal access point (TAP) can be employed.
    A TAP creates a copy of network traffic and forwards it to a particular port on
    a switch or router. ¶ 6.4. EDR ¶ Endpoint Detection and Response (EDR) is used
    to secure endpoints: servers, workstations, desktops, mobile devices, etc. EDR
    is typically implemented as a host-based incident prevention system (HBIPS), software
    that runs on the endpoint to monitor and collect data. ¶ These systems will usually
    watch for indicators of compromise, scan for malware, and can even quarantine
    or shutdown the endpoint as needed. Company hardware is a significant investment
    for any business and an EDR makes sure that investment is protected. Many systems
    exist for EDR including FireEye, SEP, and CrowdStrike. ¶ 6.5. Data Loss Prevention
    ¶ Data loss prevention (DLP) solutions aim to stop the exfiltration of sensitive
    data. This could be personally identifying information (PI), medical records,
    social security numbers (SSNs), credit card numbers, etc. Typically DLP either
    functions on the endpoint and server, data at rest, or on the network, data in
    motion. ¶ Network DLP solutions may monitor emails or web traffic for sensitive
    strings, such as SSNs. When an SSN is detecting in an email, the email is quarantined
    and an alert is sent. Server and endpoint DLP solutions may periodically scan
    the system to see if sensitive strings are stored on the system. If it is a system
    that shouldn’t have access to sensitive data an alert is sent. DLP on an endpoint
    may also limit tasks like USB usage or bulk data transmitting. ¶ 6.6. IDS/IPS
    ¶ Intrusion Detection Systems and Intrusion Prevention Systems are systems that
    monitor network traffic to detect/prevent attacks. These systems may look for
    known exploits, such as SQL injection patterns, in the traffic and trigger an
    alert when detected. An intrusion prevention system will take it one step further
    and actually shut down the connection or kill the offending process. ¶ These systems
    employ exploit signatures or IDs that are indicators of compromise (IoCs), anomalies,
    or strange behaviors. The power of an IDS/IPS often comes from how up-to-date
    it’s signature database is. There are many solutions in the category including
    Splunk, QRadar, CrowdStrike, and SolarWinds. ¶ 6.7. Email Solutions ¶ The original
    protocols used to send/receive email were simple and not designed for the challenges
    we face today. SPAM and phishing emails are unfortunately common and can be addressed
    with email client add-ons that scan for viruses or use patterns to identify phishing
    emails. Many of these tools are already built into Google’s GMail or Microsofts
    Exchange. ¶ Another large challenge is verifying the sender of an email. Currently
    three common methods exist: Sender Policy Framework (SPF), DomainKeys Identified
    Mail (DKIM), and Domain-base Message Authentication, Reporting, and Conformance
    (DMARC). ¶ SPF utilizes TXT records on a DNS domain to verify the IP of a sender.
    When inbound mail is received, the SPF information for the domain of the sender
