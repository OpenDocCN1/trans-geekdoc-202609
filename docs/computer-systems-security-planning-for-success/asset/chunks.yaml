    ```


    现在，使用你当前所在的 `scanner` 容器，看看你能发现关于 `victim` 的哪些信息。[此手册页可能会有所帮助。](https://linux.die.net/man/1/ftp)


    当你探索完毕后，可以退出 shell 并运行 `docker-compose down` 来停止 `victim` 在后台运行。


    ## 4.6. 复习问题


    比较和对比 SSH 和 Telnet。如果你必须推荐使用其中之一，你会选择哪个，为什么？：与 ARP 相关的一些安全问题是什么？可以采取哪些措施来缓解它们？：描述三种用于发送或接收电子邮件的协议。：


    # 5. 攻击


    ## 5.1. 拦截攻击


    拦截攻击依赖于拦截网络通信的能力。这可能是由于所使用的网络的性质，或者有时可能会利用其他方法来更好地定位攻击者。这些攻击通常涉及伪造虚构消息、记录传输的数据，或在网络上更改消息内容。这一攻击家族使
    CIA 三要素的所有部分都面临风险。


    ### 5.1.1. MitM


    ![](img/mitm.svg "fig:")


    中间人攻击 (MitM) 是一个统称，适用于攻击者拦截通信的情况。典型的攻击涉及窃听，并可能修改两方之间的消息。可以使用加密来缓解攻击，使攻击者无法解密他们拦截的消息。话虽如此，必须特别注意握手/密钥交换协议，以确保攻击者不会获得正在使用的密钥。以下是
    MitM 用于拦截和修改公钥交换的示例：


    ![](img/mitm-keys.svg "fig:")


    在上面的示例中，MitM 允许第一条消息未经干扰地通过，但篡改了公钥交换。通过将自己的公钥传递给 Bob，MitM 有能力解密 Bob 发送的消息，并仍然可以使用
    Alice 的公钥重新加密消息并将其传递给她。你可以看到，如果以这种方式交换两个公钥，就有可能设置 MitM 攻击，尽管有加密，所有消息都可以被看到。


    ### 5.1.2. MitB


    MitB 代表浏览器中间人，通常是由木马安装恶意软件引起的，该恶意软件允许攻击者拦截/修改浏览器和服务器之间的通信。这可以用于捕获表单上的数据、修改输入或修改服务器的响应。通常，MitB
    攻击中使用的软件会保持休眠状态，直到受害者浏览到目标网站。以下是 MitB 攻击如何用于修改网上银行请求以发送资金的示例：


    ![](img/mitb.svg "fig:")


    如你所见，攻击者最终得到了 10,000 美元，而受害者只是认为他们授权了向他人支付 1,000 美元。这些攻击可能难以检测，因为它们发生在浏览器内部，并且是机会主义的。


    ### 5.1.3. 重放攻击


    这一攻击家族通常涉及 MitM 复制传输并 `重放` 它来冒充受害者。登录凭据、简单哈希和特定命令有时容易受到这种类型的攻击。解决方案是使用时间戳、随机数（特定会话的随机数）、滚动密钥或计数器，以确保命令不能在上下文之外执行。


    ### 5.1.4. SSL 规避


    ![MitM 阻止 HTTPS 升级并窃取密码](img/ssl-mitm.svg "fig:")


    如果你考虑上面 MitM 示例中给出的被拦截密钥交换，类似的攻击可以允许攻击者查看 SSL 流量。攻击者给受害者一个虚假的证书颁发机构 (CA) 证书，受害者安装它。这通常通过木马完成。然后，攻击者将自己置于未启动的安全连接中间。在密钥交换期间，攻击者为攻击者和受害者之间的连接创建一个由虚假
    CA 签名的自定义证书。攻击者还与服务器建立实际的 HTTPS 连接，并为受害者代理数据。受害者的所有数据都将以明文形式出现在攻击者那里，但连接对受害者来说将显得是安全的。这在
    [Fiddler](https://www.telerik.com/fiddler) 调试代理中用于解密 HTTPS 流量，也用于执行深度数据包检测的某些网络设备中。


    对 SSL 的另一种 MitM 攻击只是与受害者保持或降级到 HTTP 连接，并将数据代理到与服务器的实际 HTTPS 连接。大多数服务器会升级不安全的连接，但通过拦截该交换，攻击者可以继续监控受害者的流量。


    ## 5.2. 网络层攻击


    ### 5.2.1. MAC 欺骗/MAC 克隆


    大多数网络期望 MAC 地址将与网络接口控制器 (NIC) 上的唯一编号相对应，但实际上更改它相当容易。虚拟网络需要能够使用不同的 MAC 地址，此功能已内置在大多数现代操作系统中。MAC
    欺骗是指攻击者将其 MAC 地址设置为网络上另一台机器的 MAC 地址，以试图发起攻击。例如，他们可能将自己设置为网关以发起 MitM 攻击。


    ### 5.2.2. MAC 泛洪


    交换机负责跟踪哪些 MAC 地址对应交换机上的哪些端口。它们使用此功能来确保流量仅路由到需要去的地方。鉴于 MAC 地址可以更改，攻击者可以用许多不同的 MAC
    地址的数据包淹没交换机，并可能溢出 MAC-端口路由表。某些交换机可能会默认采用类似集线器的功能，并将帧发送到所有端口，以努力保持流量流动。这随后允许攻击者捕获网络上其他机器的流量。


    ### 5.2.3. ARP 毒化


    ![ARP 欺骗 by 0x5534C, see page for license via Wikimedia Commons](img/arp.svg "fig:")


    攻击者还可以使用 ARP 数据包来冒充网络上的另一台机器，例如网关路由器。通过反复发送 ARP 数据包，`gratuitous arp`，将绑定到网关 IP
    的数据包重定向到攻击者的 MAC 地址，攻击者可以设置 MitM 场景。这尤其困难，因为取决于 ARP 缓存的 TTL，正常网络操作可能需要长达 20 分钟才能恢复。


    ## 5.3. 互联网层攻击


    ### 5.3.1. IP 欺骗


    ![](img/ip-header.svg "fig:")


    不幸的是，互联网协议 (IP) 并未考虑安全性进行设计。这意味着默认情况下，任何 IP 地址都可以放入数据包头部，数据包仍会被转发到网络。这导致 IP 可以被
    `spoofed` 并发送恶意数据包的问题。在此层面上，对此问题没有很好的解决方案。这意味着数据包的来源通常需要在更高层进行身份验证，并且协议必须考虑到 IP
    层本质上是不安全的事实。


    ## 5.4. 名称解析攻击


    ### 5.4.1. DNS 缓存毒化


    DNS 解析器可能被诱骗缓存错误信息并将其提供给其他客户端。在此场景中，攻击者通过用伪造的源 IP 响应 DNS 查询来承担权威 DNS 服务器的角色。之所以可能发生这种情况，原因之一是
    DNS 查询响应通常是单个、未经身份验证的数据包。一旦服务器拥有无效的 DNS 缓存条目，它将在条目的 TTL 期间继续将用户引导到错误的 IP 地址。[DNSSEC](https://cloud.google.com/dns/docs/dnssec)
    可以通过强制对 DNS 答案进行身份验证来缓解这些攻击。


    ### 5.4.2. LLMNR 劫持


    在此场景中，攻击者响应链路本地多播名称解析 (LLMNR) 广播并冒充身份验证服务器。毫无戒心的受害者输入他们的凭据，这些凭据随即被窃取。可以通过在网络上禁用
    LLMNR 来缓解此攻击。


    ## 5.5. Web 攻击


    万维网及其使用的协议/格式/语言（HTTP、HTML、JavaScript 等）最初 `并未` 考虑安全性进行设计。默认情况下，网页信任其接收的内容不具有恶意。脚本、命令、Cookie
    等被隐式信任。Web 技术变得如此流行，以至于它们成为攻击者的常见目标，开发人员必须使用令牌、清理数据并检查输入，如果他们希望这些技术安全。


    [开放 Web 应用程序安全项目 (OWASP)](https://owasp.org/) 是 Web 应用程序安全资源的绝佳来源。他们维护一份 Web 应用程序安全风险的前
    10 名列表。截至 2021 年，[OWASP 前 10 名](https://owasp.org/www-project-top-ten/) 是：


    Broken Access Control Cryptographic Failures Injection Insecure Design Security
    Misconfiguration Vulnerable and Outdated Components Identification and Authentication
    Failures Software and Data Integrity Failures Security Logging and Monitoring
    Failures Server-Side Request Forgery


    ### 5.5.1. XSS


    跨站脚本是指不良行为者将脚本注入网站的过程。回想一下，许多网站会从表单获取输入，并可能在另一个页面上显示这些数据。如果这些数据不仅仅是数据，而是实际上是一个
    JavaScript 脚本，那么该脚本可能会在显示它的页面上运行。


    使用此技术，攻击者可以访问 Cookie、会话令牌和其他敏感信息。取决于脚本注入的位置以及服务器如何显示这些数据，脚本可能会永久存储在目标服务器上。XSS
    脚本也可能被反射，通常发送在链接中，仅用于一个会话。


    为了缓解 XSS 风险，Web 开发人员清理其输入非常重要。当提交表单时，网站应检查提交的数据是否不是脚本或其他恶意内容。如果数据无法清理，则不应存储或使用它。


    ### 5.5.2. CSRF


    跨站请求伪造 (CSRF) 涉及使用受害者已验证的会话来发起不属于该会话的请求。想象一下，你已登录 Twitter。攻击者在 GMail 中向你发送一个表单链接，当点击时，它会发布一条推文说，“我是
    CSRF 受害者。”假设 Twitter 接受表单提交，你的时间线上将出现一条推文，内容为“我是 CSRF 受害者。”


    这可能是最温和的场景，你可以想象在网上银行应用程序中情况会糟糕得多。解决方案是网站（本例中为 Twitter）使用 CSRF 令牌（它确实如此）。生成表单时，会将一个随机值作为隐藏输入包含在内。该随机的隐藏输入就是
    CSRF 令牌。当提交时，如果提交的 CSRF 令牌与为表单创建的令牌（只有有效网站知道）不匹配，则不接受提交。


    CSRF 令牌是 Web 应用程序需要主动安全而非安全设计的又一个示例。大多数 Web 应用程序都在使用它们，但开发人员很容易忘记。


    ### 5.5.3. SSRF


    ![](img/ssrf.svg "fig:")


    Web 系统通常与内部服务器通信以检索信息。这些可能是 API 服务器、数据库或消息服务器。如果攻击者能够诱骗 Web 服务器将恶意请求传递给其内部服务器，攻击者就可以滥用系统的内部信任。这被称为服务器端请求伪造
    (SSRF)。再次，这种攻击通过输入验证来缓解，输入验证需要包含在应用程序中。


    ### 5.5.4. 会话劫持


    会话劫持可能涉及其他妥协方法，但最终目标是“窃取”受害者与另一台服务器之间的会话。想象以下场景：一个人登录到他们的个人银行网站，该网站向他们发放一个 Cookie，证明他们已通过身份验证。不良行为者正在通过一个
    XSS 漏洞监控连接，该漏洞将所有连接 Cookie 转发给他们。不良行为者使用发放的 Cookie 从用户的银行账户向不良行为者的银行账户进行转账。


    取决于所使用的方法，会话劫持可以通过使用更好的会话密钥或要求使用传输层安全 (TLS) 进行连接来防止。在上述场景中，防止会话劫持的唯一方法是修复最初的 XSS
    漏洞。


    ### 5.5.5. SQL 注入


    如在 SSRF 部分中提到，几乎所有 Web 系统都由内部运行的其他服务器支持。最常见的场景之一是有一个 Web 服务器访问内部数据库。关系数据库使用结构化查询语言
    (SQL)，因此 Web 应用程序在其常规操作期间可能会生成许多不同的 SQL 查询。如果用户输入直接放入查询中，就有可能使结果以意想不到的方式运行，或从数据库中获取秘密信息。


    查看以下 PHP 代码：


    ```

    $userName = $_POST[''user_name'']

    $pw = $_POST[''password'']

    $statement = "SELECT * FROM users WHERE name=''" + $userName + "'' AND password=''"
    + $pw + "'';"

    ```


    在提交 `user_name` `admin` 和密码 `password` 的情况下，将生成以下 SQL：`SELECT * FROM users WHERE
    name=''admin'' AND password=''password'';`


    在提交 `user_name` `admin` 和密码 `'' OR 1=1;` 的情况下，将生成以下 SQL：`SELECT * FROM users WHERE
    name=''admin'' AND password='''' OR 1=1;`


    在这种情况下，用户无需有效密码即可登录。


    ### 5.5.6. XML 注入


    XML 代表可扩展标记语言，通常用于传输消息。XML 可以是 Web 系统基础设施的重要组成部分，因此如果未经过清理的用户输入被允许生成系统中使用的 XML，许多事情都可能出错。使用
    XML 注入，攻击者可能能够检索秘密文件或创建管理员帐户。XML 注入可以通过输入验证或可能禁用所使用框架中的外部实体解析来缓解。


    ### 5.5.7. LDAP 注入


    最后，轻量级目录访问协议 (LDAP) 通常用于存储有关用户的信息。因此，它可以在许多 Web 应用程序后面找到。LDAP 也以类似于 SQL 的方式支持复杂查询。未经过清理的用户输入可能导致产生意外结果的
    LDAP 查询。


    ### 5.5.8. 目录遍历


    设计不良的 Web 服务器可能会受到目录遍历攻击。回想一下，Web 服务器旨在从特定目录（例如 `/var/www`）提供静态内容。现在假设攻击者提交了对
    `http://www.example.com/../../etc/shadow` 的 `GET` 请求。Web 服务器可能实际上会向上两个目录并提供该文件。


    可以通过文件权限、访问控制和过滤传入请求来解决这个问题。重要的是要注意，在 HTTP 请求中指定路径有多种方式，包括使用 URL 编码，因此必须清理所有可能的恶意输入。


    ### 5.5.9. URL 劫持/拼写错误抢注


    一种不幸常见的广泛攻击是购买与非常流行的域名名称相似的域名。当用户拼写错误流行域名时，他们最终会进入恶意行为者的网站。例如，想象有人注册了 `gooogle.com`（注意三个
    o）。他们可以从拼写错误 google 的人那里获得大量流量。


    这些网站可用于广告收入、钓鱼凭据，甚至可能用于分发恶意软件。几种浏览器实施的一种缓解措施是维护恶意网站列表，并在用户访问之前警告用户。


    ### 5.5.10. 域名劫持


    域名在一定时间后会过期，注册人可能忘记续费。在这些罕见的情况下，攻击者可能会实际获得流行域名（例如 google.com）的控制权，并将流量路由到他们的网站。恶意活动与拼写错误抢注相同，但攻击者不需要依赖用户犯错。


    还可以通过使用被盗/泄露的凭据登录域名注册系统来劫持域名。在此场景中，攻击者仍然可以修改记录以指向他们的服务器，但不需要依赖公司忘记续费。


    ### 5.5.11. 区域传输攻击


    关于域名系统，区域传输攻击可能会泄露有关域名的敏感信息。DNS 从设计上就是一个分布式系统，用于将域名解析为 IP 地址。由于系统的分布式性质，协议被构建用于由多个服务器提供单个域名服务。这些服务器使用
    DNS 区域传输相互传递信息。


    通常这些通信应该是内部的，因为它们可能泄露有关区域的宝贵信息。不幸的是，配置不当的 DNS 服务器可能会公开宣传其区域传输。[在这种情况下，攻击者可以在攻击的侦察阶段使用泄露的信息。](https://digi.ninja/projects/zonetransferme.php)


    ### 5.5.12. 点击劫持


    网站可能以这种方式设计，即界面对用户来说令人困惑，他们无意中点击了广告或恶意链接。这在低完整性网站（如流媒体网站、种子跟踪器和成人网站）上很常见。这通常因广告筛选不佳，甚至故意制作看起来类似于内容的广告而变得复杂。


    ## 5.6. 结果


    ### 5.6.1. 远程代码执行 (RCE)


    攻击最危险的结果之一是远程或任意代码执行。RCE 使攻击者能够在受攻击的机器上执行他们想要的任何指令。通常，攻击者会启动一个具有管理权限的 shell，以便他们可以做任何他们想做的事情。想象一下
    SSH 登录到远程 Linux 机器并将权限提升到 root。这基本上就是 RCE 可能带来的权力类型。攻击者还可以使用 RCE 通过导致程序终止来攻击计算资源的可用性。在这种情况下，RCE
    被用作拒绝服务 (DoS) 攻击的一部分。


    ### 5.6.2. 权限提升


    没有电梯到 root，你必须使用漏洞。


    ~ 匿名


    ![](img/escalation.svg "fig:")


    权限提升涉及通过非预期方式获得对受保护资源的访问。一个示例是 [CVE-2021-4034](https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2021-4034)，这是最近在
    Linux `pkexec` 命令中发现的本地权限提升漏洞。`pkexec` 以提升的权限运行，并且不安全地解析命令行参数。因此，它可以被利用来给普通用户一个
    root shell。这将是本地垂直权限提升的一个示例。


    权限提升通常分为两类：水平和垂直。水平权限提升提供对资源的类似访问，即从一个用户帐户移动到另一个用户帐户。垂直权限提升提供更高级别的访问，即从用户帐户移动到管理员帐户。实现权限提升的五种主要方式是凭据利用、漏洞/利用、配置错误、恶意软件和社会工程学。


    ### 5.6.3. 拒绝服务 (DoS)


    拒绝服务攻击 (DoS) 试图通过用请求淹没系统来阻止系统工作。分布式拒绝服务攻击 (DDoS) 通过利用许多不同的机器来做同样的事情。通常，DDoS 攻击的攻击节点是僵尸网络的成员，即之前被利用并处于攻击者控制下的机器。


    DoS 攻击可以采取多种形式，包括：


    SYN 洪水：恶意行为者可以发送多个 SYN 数据包来启动 TCP 三次握手。SYN 数据包易于发送，但可能导致响应它们的服务器分配大量资源。由于资源分配的不对称性，这使得
    SYN 数据包特别适合于 DoS 攻击。[SYN Cookie](https://en.wikipedia.org/wiki/SYN_cookies) 可用于帮助防止这种类型的攻击。


    ICMP 洪水：通常称为 ping，ICMP 回显请求可用于淹没服务器。尤其是当从多个来源发送时。解决方案通常是在服务器上限制 ICMP 数据包的速率。


    缓冲区溢出/利用：设计不良的软件在接收到意外数据时可能会失败。这可能简单到发送超过缓冲区容量的数据，或者[将面向 Windows 系统端口 139 的数据包的紧急指针
    (URG) 设置为](https://en.wikipedia.org/wiki/WinNuke)。


    ## 5.7. 实验：使用 Scapy 进行 MitM


    在本实验中，我们将使用一个假 SSH 服务器 [sshesame](https://github.com/jaksi/sshesame) 和一个交互式数据包操作程序
    [scapy](https://scapy.net/)，来干扰受害者和服务器之间的正在进行的 SSH 会话，将自己定位在流量中间，并捕获受害者使用的用户名和密码。


