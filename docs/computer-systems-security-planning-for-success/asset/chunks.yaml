    # 4. Protocols


    Protocols can be though of as rules that dictate communication. A protocol may
    include information about the syntax used, error correction, synchronization,
    or any other aspect of how communication occurs in the context of that situation.
    In computer security it is important to have a thorough understanding of common
    protocols as their weaknesses often determine how and if an attack will occur.
    Protocols exist for both hardware and software and have been developed via individuals
    and organizations. Early networking protocols were often developed on mailing
    lists using Requests for Comments (RFCs). You may still see RFCs being crafted,
    referred to, or actively worked on. [Some of the earliest web protocols are detailed
    in RFCs.](https://datatracker.ietf.org/doc/html/rfc2616) More often than not,
    large protocols have working groups and associations developing, such as the 802.11
    group at the [Institute of Electrical and Electronics Engineers (IEEE)](https://www.ieee.org/)
    which handles WiFi protocols. These groups publish papers detailing how the protocols
    work.


    This chapter will give a brief description of important protocols following the
    TCP/IP layering model. It is important to note that some of these protocols may
    reach across layers to accomplish tasks. In this case they will be grouped according
    to which layer they largely function within.


    ## 4.1. Network Access Layer


    ### 4.1.1. ARP


    Address Resolution Protocol (ARP) is used on the local ethernet segment to resolve
    IP addresses to MAC addresses. Since this protocol functions at the ethernet segment
    level, security was not a primary concern. Unfortunately this means that ARP communications
    can be easily spoofed to cause a MitM scenario. A malicious actor simply sends
    out several ARP packets, gratuitous arp, saying that traffic for a certain IP
    address should be sent to them. Since the MAC to IP address table is cached in
    several places, it can take a long time for all the caches to invalidate and resolve
    an issue caused by malicious ARP frames.


    There is a protocol designed to mitigate the issues with ARP. Dynamic ARP Inspection
    (DAI) reaches across layers to work with the DHCP lease database and drop packets
    that are not using the MAC address used when a DHCP lease was granted. While this
    can solve many of the issues associated with ARP it is also a good practice to
    use secure higher-level protocols such as HTTPS just in case.


    ### 4.1.2. Wifi


    The Wifi protocols we are most concerned with are the security standards used
    to encrypt data. By the nature of a wireless protocol, information sent on the
    network is available to anyone with an antenna. These Wifi security standards
    are the only thing protecting your network traffic from being viewing by anyone
    within your transmitting range. There are currently four standards:


    WEP : Wireless Equivalent Privacy (WEP) is depreceated and should not be used.
    It was developed in 1999 and uses an RC4 stream and 24-bit encryption. Several
    attacks have been developed that can crack WEP within a matter of seconds.


    WPA : Wifi Protected Access (WPA) utilized Temporal Key Integrity Protocol (TKIP)
    to change the keys being used. This 128-bit encryption method has also been cracked
    and the protocol should not be used.


    WPA2 : Wifi Protected Access 2 (WPA2) makes use of AES encryption and is currently
    the most popular standard. WPA2 is still considered secure.


    WPA3 : Wifi Protected Access 3 (WPA3) was developed in 2018 and is currently considered
    state-of-the-art. Many networks are beginning the transition from WPA2 to WPA3.


    ## 4.2. Internet Layer Protocols


    ### 4.2.1. IP


    IP stands for internet protocol and it was devised to allow creating a network
    of networks. The network of networks that uses it primarily is the Internet, although
    you could use IP in other scenarios as well. IP is largely concerned with routing
    traffic across and to networks. The protocol was first detailed by the IEEE in
    1974 and comes from the Advanced Research Projects Agency Network (ARPANET) project,
    which created the first large, packet-switched network.


    Most people are familiar with IP addresses, the unique number given to a host
    participating in an IP network. Currently there are two main versions of the IP
    protocol, IPv4 and IPv6, and one of the major differences is in how many IP addresses
    are available. IPv4 supports 32 bit addresses and IPv6 supports 128 bit addresses.
    To give an idea of how big of a change that is, we have currently allocated all
    possible IPv4 addresses, but with IPv6 we could give an address to every grain
    of sand on the beaches of earth and still not run out.


    ### 4.2.2. ICMP


    Internet Control Message Protocol (ICMP) is largely used to send messages between
    systems when IP doesn’t work. For example, lets say we tried to connect to a host
    but our router doesn’t know how to get there. Our router can send us an ICMP Destination
    Unreachable message to let us know that something is going wrong. Because ICMP
    messages work at the network layer, we will receive this message even if there
    is an issue with the internet layer.


    The most common use for ICMP is the `ping` command. `ping` sends an ICMP echo
    request to check to see if a host is up. By responding to the request with the
    data included in the request we can assume that the host is up and functioning.


    ICMP is also used in the `traceroute` command. `traceroute` incrementally increase
    the Time To Live (TTL) field of ICMP packets and watches for TTL Exceeded messages
    to determine what route packets are taking to get to a host. Example `traceroute`
    output is shown below:


    ```

    traceroute to 8.8.8.8 (8.8.8.8), 30 hops max, 60 byte packets 1 ryan.njitdm.campus.njit.edu
    (172.24.80.1) 0.217 ms 0.200 ms 0.252 ms 2 ROOter.lan (192.168.2.1) 5.790 ms 5.765
    ms 6.275 ms 3 * * * ① 4 B4307.NWRKNJ-LCR-21.verizon-gni.net (130.81.27.166) 19.166
    ms 19.144 ms 21.097 ms 5 * * * ① 6 0.ae1.GW7.EWR6.ALTER.NET (140.222.2.227) 12.376
    ms 14.634 ms 0.ae2.GW7.EWR6.ALTER.NET (140.222.2.229) 9.805 ms 7 209.85.149.208
    (209.85.149.208) 9.782 ms 10.331 ms 9.192 ms 8 * * * ① 9 dns.google (8.8.8.8)
    11.313 ms 9.761 ms 9.758 ms

    ```


    ① Notice these routers not responding to ICMP packets


    Despite the usefulness of ICMP, ICMP packets from external sources are often ignored.
    Network engineers use ICMP to troubleshoot their own networks, but it would be
    a security issue to allow outside parties to do the same. As such, do not expect
    all external hosts to respond to pings. They may still be up, but you’ll need
    to figure out [another way to detect them.](https://nmap.org/book/man-host-discovery.html)


    ### 4.2.3. NAT


    ![](images/nat.svg "fig:")


    Network address translation (NAT) is primarily used to allow local IP address
    to share a public IPv4 address. Given the lack of IPv4 address space many devices
    have to share a single address. As mentioned when discussing IPv6, NAT routers
    often also include security features such as a stateful firewall as the complexity
    of the hardware required to perform NAT is equivalent to what would be needed
    for a firewall.


    ### 4.2.4. IPsec


    Internet Protocol Security (IPsec) is used to set up a point-to-point encryption
    tunnel to secure data in transit across IP networks. IPsec is used primarily in
    dedicated VPN links and makes use of three main parts: SA, ESP, and AH:


    SA stands for security association and is a channel used to set up encryption
    parameters and exchange keys. This happens via UDP on port 500.


    ESP stands for encapsulating security protocol and is used to encrypt IP headers
    and payloads. It is sent using standard IP packets with the protocol field set
    to 50.


    AH stands for authentication header and they can optionally be used in standard
    IP packets with the protocol field set to 51. AH simply ensures that a packet
    hasn’t been tampered with.


    ## 4.3. Transport Layer Protocols


    ### 4.3.1. TCP


    Transmission Control Protocol (TCP) is at the heart of most networks. It provides
    for reliable communication via a three way hand shake, breaks large data segments
    into packets, ensures data integrity, and provides flow control for those packets.
    This all comes at a cost of course, and this connection-oriented protocol typically
    has higher latency than its counterparts. Given the complex nature of TCP is has
    often been targeted for attacks. TCP stacks are constantly adapting and changing
    (within the parameters of the protocol) to avoid DoS and MitM attacks.


    ### 4.3.2. UDP


    User Datagram Protocol (UDP) is a connectionless protocol designed for instances
    where TCP may have too much latency. UDP achieves this performance boost by not
    having handshaking or flow control. The result is a speedy protocol that sometimes
    drops datagrams. UDP is often used as the basis for gaming or streaming protocols
    where the timing of the packets is more important that whether or not they all
    arrive. UDP does still employ checksums so you can be sure of the integrity of
    any UDP packets that you do receive.


    ### 4.3.3. Common Ports and Services


    Port numbers are used in a transport layer connection to specify which service
    to connect to. This allows a single host to have multiple services running on
    it. Ports 0 to 1023 are well-known ports and typically support a commonly used
    service. In most operating systems it takes administrative privileges to bind
    to a Well-known port and listen for connections. Registered ports range from 1024
    to 49151 and do not require administrative privileges to run a service on. You
    may find many things listening on these ports as any user can have a service on
    them. Lastly ports 49152 to 65535 are used dynamically by applications as needed.


    It is important to know some commonly used ports as the services running on these
    ports may be subject to an attack. When scanning a machine, only necessary ports
    should be open.


    Port NumberL4 ProtocolUsage

    '
  trans: '


    # 3.3. 恶意软件类型


    恶意软件的定义非常广泛，并且每天都有新的恶意软件被创建。这使得对恶意软件进行分类变得困难。在介绍一些基本类型时，请记住存在显著的重叠。例如，您可能会遇到作为病毒分发的勒索软件，或者作为木马分发的勒索软件。它是勒索软件这一事实并不妨碍它同时也是其他类型的恶意软件。


    ## 3.3.1. 蠕虫、病毒和木马


    蠕虫是自我传播的程序，无需用户交互即可传播。其代码通常存储在独立对象中，例如隐藏的可执行文件。蠕虫通常不会严重损坏其宿主，因为它们关注的是快速、指数级的传播。


    ### Stuxnet


    Stuxnet 是一种 2010 年的蠕虫，专门针对伊朗核设施。该蠕虫使用了前所未有的四个零日攻击，并设计为通过 USB 闪存驱动器和远程过程调用（RPC）传播。因此，它不仅仅依赖网络来传播。最终，Stuxnet
    的有效载荷针对用于编程 PLC 设备的代码，这些设备控制电机并使其旋转过快，从而破坏离心机。Stuxnet 还使用了一个令人印象深刻的 rootkit 来掩盖其踪迹。鉴于
    Stuxnet 的复杂程度，据信它是由美国和以色列开发的。


    病毒通常需要用户交互，例如将受感染的文件从一台机器复制到另一台机器，并将其代码存储在机器上的另一个文件中。可执行文件可能会被感染，病毒代码被添加到在标准程序代码之前执行的单独页面中。病毒对宿主可能造成相当大的损害，因为它们可能需要大量资源来本地传播。“病毒”一词也是一个不幸的过载术语。由于其流行度，它常被一些低技能威胁行为者用来指代许多不同类型的恶意软件。


    ### Concept 病毒


    Concept 病毒是第一个 Microsoft Word 宏病毒的示例。该病毒隐藏在 Microsoft Word 文件中，并使用 Word 的嵌入式宏语言来执行其复制任务。后来为
    Excel 和其他具有足够复杂但最终不安全的内部脚本语言的程序创建了病毒。


    木马是一种伪装成合法软件的恶意软件。它不必像利用用户安装、运行或向恶意代码授予额外权利那样依赖软件漏洞。木马是最流行的恶意软件类型，因为它们可以用作许多其他有效载荷的攻击向量。这个名字来自希腊神话，其中特洛伊木马被伪装成礼物并送给一个被围困的城镇。巨大的木马内部藏有秘密部队，他们在半夜出来打开城门。


    ### Emotet


    Emotet 是一种 2014 年的银行木马，通过电子邮件传播。它使用恶意链接或启用宏的文档来诱使用户下载其代码。Emotet 是目前最昂贵和最具破坏性的恶意软件之一，平均每次事件修复成本约为一百万美元。它继续被改造以避免被检测，并利用更复杂的恶意软件。


    ## 3.3.2. 勒索软件


    ![Wana Decrypt0r screenshot is used under fair use](img/wannacry.png "fig:")


    勒索软件是一种加密文件并要求支付赎金以解密文件的恶意软件。现代勒索软件使用对称加密快速加密文件，然后使用硬编码的公钥非对称加密对称密钥，威胁行为者持有相应的私钥。当支付赎金时，通常通过加密货币，威胁行为者可以使用其私钥解密对称密钥，用户可以使用对称密钥解密文件。


    勒索软件被视为数据泄露，因为数据通常也会被外泄。值得注意的是，当支付赎金时，不能保证威胁行为者实际上会开始解密过程。勒索软件的典型目标包括企业基础设施和医疗保健系统，尽管勒索软件也可能被不加区分地传播。赎金支付可以成为一项赚钱的大生意，因此许多
    APT 或犯罪集团可能会使用它。勒索软件被认为是当今网络稳定性最大的威胁。


    ## 3.3.3. 间谍软件


    专门用于间谍活动/数据窃取的恶意软件称为间谍软件。与勒索软件一样，间谍软件也可以为威胁行为者带来金钱回报。行为者可能会使用敲诈勒索来要求付款，否则数据将被泄露。这通常意味着要么在暗网上出售，要么公开发布。再次，鉴于金钱收益的可能性，间谍软件通常与犯罪集团相关联。APT
    也可能使用间谍软件来获取国家重要秘密。


    客户数据、商业秘密、专有数据和政府秘密都是间谍软件的目标。即使在政府系统之外，在企业环境中，间谍软件仍然是一个主要威胁。


    ## 3.3.4. 加密劫持


    使用工作量证明算法的加密货币使得程序将处理器周期转换为钱变得前所未有的容易。某些类型的恶意软件利用这一点，在用户的机器上后台挖掘加密货币。这种对电力和资源的窃取可以为恶意软件分发者带来收入，当挖矿资金存入他们的在线钱包时。


    加密劫持比以往任何时候都更流行，尤其是考虑到已经创建了大量受感染机器的僵尸网络。加密劫持为恶意行为者提供了一条更简单的变现路径，他们可能已经控制了许多受感染的机器。


    ## 3.3.5. Rootkit


    ![](img/rootkit.svg "fig:")


    Rootkit 是一种旨在为系统提供后门访问权限的秘密程序。它们设计为保持隐藏，甚至可能主动禁用或规避安全软件。由于其底层性质，许多 rootkit 很难检测，甚至更难删除。


    Rootkit 通常根据其隐藏的层进行分类：


    Firmware Rootkit：固件是硬件设备用于运行的代码。它通常是一组用于设置和与设备交互的薄层命令。固件 rootkit 可能驻留在主板的 BIOS
    中，并且可能非常难以删除。


    Bootloader Rootkit：引导加载程序准备系统以引导操作系统内核，通常通过将内核加载到内存中。引导加载程序 rootkit 可能劫持此过程，将其自身加载到单独的内存空间中或操纵正在加载的内核。


    Kernel-mode Rootkit：许多操作系统内核（包括 Linux）都有加载动态模块的能力。这些内核模块对操作系统内核操作具有完全访问权限。Kernel-mode
    rootkit 在实时检测时可能很困难，因为被指示检测 rootkit 的操作系统内核已不再可信。


    Application Rootkit：应用程序或用户模式 rootkit 通常作为应用程序安装，在后台以管理员权限运行。这些 rootkit 通常是最容易开发和部署的，不需要对系统使用的硬件有底层知识，但它们也是最容易检测和删除的。


    ## 3.3.6. 僵尸网络


    僵尸网络是由单一方控制的被攻击主机网络。这些主机可能是台式计算机、服务器，甚至是物联网（IoT）设备。僵尸网络通常用于大规模分布式拒绝服务（DDoS）攻击，攻击的性质是让许多机器向单台机器发送流量。僵尸网络也可用于发送垃圾邮件，因为它们对
    SMTP 邮件中继的访问可能因其互联网服务提供商（ISP）而异。


    机器人通常通过命令和控制（C2，C&C）服务器进行控制。虽然此 C2 服务器可能使用自定义协议，但现代僵尸网络更典型地依赖其他基础设施。C2 流量可以使用
    SSH、HTTP、互联网中继聊天（IRC）甚至 Discord 向机器人发送命令并从机器人接收数据。


    ## 3.3.7. RAT


    RAT 代表远程访问木马，用于获得对远程目标的完全访问和控制权。恶意软件分发者可以浏览计算机上的文件、发送按键和鼠标移动、查看屏幕，以及/或监控来自麦克风和摄像头的输入。RAT
    通常会主动绕过安全控制，因此可能难以检测。


    ## 3.3.8. 广告软件 / 可能不需要的程序 (PUP)


    广告软件是旨在跟踪用户行为并传递不需要的、有时具有侵入性的定向广告的恶意软件。广告软件可能会减慢系统速度和/或在网站上添加广告墙。这种类型的恶意软件通常针对用户的网络浏览器。


    可能不需要的程序 (PUP) 通常作为另一个程序的安装的一部分下载。常见的 PUP 包括浏览器工具栏、PDF 阅读器、压缩实用程序或浏览器扩展。这些程序可能包含广告软件/间谍软件组件，并且也可能减慢系统速度。


    # 3.4. 妥协指标


    妥协指标 (IoC) 是具有高度置信度的工艺品，表明发生了入侵。它是判断机器是否成为恶意软件受害者的一种方法。安全专业人员公开传达 IoC，以努力帮助减轻恶意软件的影响。


    ## 常见 IoC 类型


    Hash：已知为恶意的文件的哈希值。这有助于识别木马和蠕虫。


    IP 地址：跟踪恶意软件连接的 IP 地址可用于确定机器是否被感染。


    URLs/Domains：跟踪恶意软件使用的 URL 或域名也可用于确定机器是否被感染。


    病毒定义/签名：可执行文件和其他文件可以扫描特定病毒独有的字节序列。这样，即使恶意软件隐藏在另一个文件中，仍然可以检测到它。


    # 3.5. 恶意软件传递


    恶意软件通常通过社会工程学传递，即说服组织内的行为者下载并运行或点击某些东西。它也可以通过渗透软件包所依赖的内容、供应链，或者可能通过公开暴露服务上的软件漏洞来传递。下面详细介绍了一些最常见的传播恶意软件的方式。


    ## 3.5.1. 钓鱼


    钓鱼涉及通过欺诈性消息与某人通信，以努力使其执行会伤害他们的行为。它分为五个主要类别：


    定向钓鱼：向特定企业或环境发送钓鱼电子邮件或其他通信。这些消息可能包含有关组织内部运作的信息，以试图证明其有效性。它们也可能利用特定组织中已知的不安全做法。定向钓鱼不是您常规的广撒网式钓鱼尝试，而是更多地是一种有针对性的、定制的活动。


    鲸钓：针对组织中高级别个人。鲸钓通常与定向钓鱼结合使用。


    短信钓鱼：使用短信进行钓鱼。


    语音钓鱼：使用语音消息进行钓鱼。


    钓鱼网站：威胁行为者可以尝试通过从非业务相关通信渠道获得的信息来获得未经授权的访问。例如，恶意行为者可能知道 CEO 经常光顾一个受欢迎的帆船论坛。这些行为者可以在帆船论坛上设置一个帐户，向
    CEO 发送私信以获取信息。


    ## 3.5.2. 垃圾邮件


    垃圾邮件包含大量未经请求的电子邮件。这些电子邮件可能是恶意的，也可能只是广告。无论哪种情况，垃圾邮件占所有电子邮件的近 85%。值得注意的是，有时通过垃圾邮件分发的恶意软件实际上被用来通过受害者的机器发送更多垃圾邮件。反垃圾邮件战争在不断演变，虽然我们发送电子邮件的方式已经做了许多更新，但许多改进尚未实现。


    ## 3.5.3. 垃圾桶搜寻


    最终可能导致恶意软件传播的信息也可以在处理不当的垃圾中找到。旧记录或硬盘可能包含企业秘密或凭据，这些凭据会给某人带来未经授权的访问。正确处理敏感信息非常重要，确保所有需要销毁的东西都被彻底销毁。


    ## 3.5.4. 偷窥


    PIN、密码和其他数据也可以通过简单地从某人肩膀上方查看来恢复。这些凭据可能是攻击者传播恶意软件所需的“入口”。借助光学设备（例如双筒望远镜），偷窥甚至可以在远距离发生。隐私屏幕（限制您可以看到显示器的角度）可以帮助减轻这种类型的攻击。


    ## 3.5.5. 跟尾


    跟随持有凭据进入安全地点的人被称为跟尾。通常，人们甚至会为双手拿满东西的人持开安全门。想要帮助他人是人性，但您也必须记住，您身后的人可能带着一个准备好在获得建筑物内机器物理访问权限后立即部署恶意软件的
    USB 密钥。


    ## 3.5.6. 冒充/身份盗用


    通常作为钓鱼活动的一部分，威胁行为者会假装是另一个人。这可能是组织内部的人，或者是组织外部拥有足够权力的人，例如政府监管机构的代表。攻击者也可能使用被盗凭据使其消息看起来官方，再次为他们提供了一条部署恶意软件的便捷途径。


    # 3.6. 网络杀伤链


    ![](img/killchain.svg "fig:")


    分析涉及恶意软件的攻击的一种方法是通过网络杀伤链的步骤。网络杀伤链由洛克希德·马丁公司开发，是一种已被网络安全采用的军事分析方法。网络杀伤链分为七个步骤：侦察、武器化、传递、利用、安装、命令和控制、外泄。


    ## 3.6.1. 侦察


    侦察是侦察的缩写，是军事术语，用于初步调查以获取信息。在侦察阶段，恶意行为者会尽可能收集大量信息。此阶段使用的方法可能是被动的或主动的。


    被动侦察涉及在不向目标发送任何内容的情况下收集信息。这通常涉及访问公开可用的信息，例如社交媒体、发布的网站和 DNS 记录。如果行为者有权访问，他们也可以被动嗅探网络数据包。


    主动侦察涉及与目标交互。这可能包括端口扫描、漏洞扫描、[在 HTTP 服务器上暴力破解目录和文件名](https://www.kali.org/tools/dirbuster/)，甚至联系员工。主动侦察可以产生更多信息，但也更容易被检测到。


    ## 3.6.2. 武器化


    在武器化阶段，行为者开始准备在侦察期间评估的漏洞的利用程序。这可能包括定制恶意软件、创建钓鱼电子邮件、定制工具以及为攻击准备环境。为了使恶意软件有效，它必须利用正确的利用程序并在正确的操作系统和环境下工作。[Metasploit](https://www.metasploit.com/)
    是一个渗透测试框架，通常在此步骤中用于创建自定义恶意软件。


    ## 3.6.3. 传递


    在传递阶段，恶意软件被交给目标。通常会采取措施绕过检测系统。传递可能涉及发送链接到恶意软件的电子邮件或利用易受攻击的服务器来运行恶意软件。在此阶段结束时，攻击者通常会等待恶意软件通过命令和控制通道的回调。


    ## 3.6.4. 利用


    从技术上讲，利用步骤发生在恶意软件成功执行后。在许多情况下，这几乎不涉及攻击者的交互。一旦恶意软件被激活或利用的有效载荷被执行，受害者就完成了利用步骤。


    ## 3.6.5. 安装


    安装步骤通常由恶意软件在运行后执行。恶意软件安装自身，隐藏自身，并设置持久性（停止后重新启动的能力）。恶意软件可能会提升权限或横向移动。它还可能从远程服务器安装第二阶段的其他有效载荷。一种常见的策略是将下载的代码注入现有进程，以掩盖哪个进程正在执行可疑操作。


    ## 3.6.6. 命令和控制 (C2, C&C)


    恶意软件将通过其命令和控制通道寻求更多指令。此时，攻击者可以与恶意软件交互，向其发送其他命令。C2 流量通常设计为与现有流量融为一体，不引起注意。


    ## 3.6.7. 外泄 / 行动与目标


    最后一步涉及从被攻击系统获取数据，或以其他方式禁用/滥用系统。此时，攻击者可以使用 C2 通道从系统中提取敏感信息，例如信用卡信息、密码哈希等。需要注意的是，数据外泄可能不是攻击的唯一目标。攻击者还可以禁用系统、利用系统实施欺诈、挖掘加密货币等。此时，恶意行为者完全控制了被攻击系统。


    # 3.7. 实验：恶意软件分析


    网站 [Any Run](https://any.run) 提供免费的交互式恶意软件分析。我们将使用此网站来避免在虚拟机中运行恶意软件的复杂性。


    首先访问 [Any Run](https://any.run) 并使用您的 NJIT 电子邮件地址注册帐户。一旦您通过电子邮件激活帐户，请按照教程学习如何分析威胁。使用
    Any Run 提供的演示示例任务。按照提示并观察进程树的变化。请随意花时间，即使时间过期后，您仍然可以查看运行中的进程并分析 HTTP 请求、连接、DNS
    请求和威胁。


    对于本实验，我们将查看 [Emotet](https://www.malwarebytes.com/emotet) 的示例，这是一种 2014 年发现的银行木马。在
    Any Run 网站的左侧，点击 Public tasks 并搜索 md5 值 `0e106000b2ef3603477cb460f2fc1751`。选择一个示例（共有三个）并查看截图，以了解恶意软件的运行方式。查看网络流量进程也可能有所帮助。


    点击右上角的 Restart 运行虚拟机。执行触发恶意软件所需的操作，根据需要添加时间。最后，在虚拟机上打开记事本，输入您的姓名，并拍摄一个唯一的截图。


    使用 Any Run 工具分析您选择的恶意软件。


    # 3.8. 复习问题


    为什么 APT 可能会选择使用无文件恶意软件，而不是从机器上的文件运行的恶意软件？：什么是 IoC？给出一个示例。：什么是钓鱼？钓鱼的五种类型是什么？给出每种类型的示例。：


    # 4. 协议


    协议可以被视为规定通信的规则。协议可能包括有关使用的语法、错误校正、同步或在该情况下通信发生的任何其他方面的信息。在计算机安全中，彻底了解常见协议非常重要，因为它们的弱点往往决定了攻击如何以及是否会发生。协议既存在于硬件中，也存在于软件中，并由个人和组织开发。早期的网络协议通常通过邮件列表使用请求评论（RFC）开发。您可能仍然会看到正在起草、引用或积极处理的
    RFC。[一些最早的 Web 协议在 RFC 中有详细说明。](https://datatracker.ietf.org/doc/html/rfc2616)
    大多数情况下，大型协议有工作组和协会进行开发，例如 [电气和电子工程师学会 (IEEE)](https://www.ieee.org/) 的 802.11
    组，它处理 WiFi 协议。这些组发布论文详细说明协议的工作原理。


    本章将按照 TCP/IP 分层模型简要介绍重要协议。需要注意的是，某些协议可能跨越层级以完成任务。在这种情况下，它们将根据其主要功能所在的层级进行分组。


    ## 4.1. 网络访问层


    ### 4.1.1. ARP


    地址解析协议 (ARP) 用于本地以太网段，用于将 IP 地址解析为 MAC 地址。由于该协议在以太网段级别运行，安全性并非主要关注点。不幸的是，这意味着
    ARP 通信很容易被伪造以造成中间人攻击场景。恶意行为者只需发送几个 ARP 数据包，即免费 ARP，声称某个 IP 地址的流量应发送给他们。由于 MAC
    到 IP 地址表在多个位置缓存，所有缓存失效并解决由恶意 ARP 帧引起的问题可能需要很长时间。


    有一种协议旨在减轻 ARP 的问题。动态 ARP 检查 (DAI) 跨越层级，与 DHCP 租约数据库协同工作，丢弃未使用 DHCP 租约授予时使用的 MAC
    地址的数据包。虽然这可以解决与 ARP 相关的许多问题，但使用 HTTPS 等安全的高级协议也是一种良好的做法，以防万一。


    ### 4.1.2. Wifi


    我们最关心的 WiFi 协议是用于加密数据的安全标准。由于无线协议的性质，网络上发送的信息对任何拥有天线的人都可用。这些 WiFi 安全标准是保护您的网络流量不被传输范围内的任何人查看的唯一东西。目前有四种标准：


    WEP：无线等效隐私 (WEP) 已弃用，不应使用。它开发于 1999 年，使用 RC4 流和 24 位加密。已经开发出几种攻击，可以在几秒钟内破解 WEP。


    WPA：WiFi 保护访问 (WPA) 使用临时密钥完整性协议 (TKIP) 来更改使用的密钥。这种 128 位加密方法也已被破解，协议不应使用。


    WPA2：WiFi 保护访问 2 (WPA2) 使用 AES 加密，目前是最流行的标准。WPA2 仍然被认为是安全的。


    WPA3：WiFi 保护访问 3 (WPA3) 开发于 2018 年，目前被认为是最先进的。许多网络正在开始从 WPA2 过渡到 WPA3。


    ## 4.2. 互联网层协议


    ### 4.2.1. IP


    IP 代表互联网协议，它被设计用于创建网络的网络。主要使用它的网络是互联网，尽管您也可以在其他场景中使用 IP。IP 主要关注跨网络和向网络路由流量。该协议最初由
    IEEE 在 1974 年详细说明，源自高级研究计划署网络 (ARPANET) 项目，该项目创建了第一个大型分组交换网络。


    大多数人都熟悉 IP 地址，即参与 IP 网络的主机的唯一编号。目前 IP 协议主要有两个版本，IPv4 和 IPv6，主要区别之一在于可用 IP 地址的数量。IPv4
    支持 32 位地址，IPv6 支持 128 位地址。为了了解这有多大的变化，我们目前已分配所有可能的 IPv4 地址，但使用 IPv6，我们可以给地球海滩上的每一粒沙子分配一个地址，而且仍然不会用完。


    ### 4.2.2. ICMP


    互联网控制消息协议 (ICMP) 主要用于在 IP 不起作用时在系统之间发送消息。例如，假设我们尝试连接到某个主机，但我们的路由器不知道如何到达那里。我们的路由器可以向我们发送
    ICMP 目标不可达消息，以告知我们出了问题。由于 ICMP 消息在网络层工作，即使互联网层有问题，我们也会收到此消息。


    ICMP 最常见的用途是 `ping` 命令。`ping` 发送 ICMP 回显请求以检查主机是否在线。通过用请求中包含的数据响应请求，我们可以假设主机正在运行并正常工作。


    ICMP 也用于 `traceroute` 命令。`traceroute` 逐渐增加 ICMP 数据包的生存时间 (TTL) 字段，并监视 TTL 超时消息，以确定数据包到达主机所走的路由。示例
    `traceroute` 输出如下：


    ```

    traceroute to 8.8.8.8 (8.8.8.8), 30 hops max, 60 byte packets 1 ryan.njitdm.campus.njit.edu
    (172.24.80.1) 0.217 ms 0.200 ms 0.252 ms 2 ROOter.lan (192.168.2.1) 5.790 ms 5.765
    ms 6.275 ms 3 * * * ① 4 B4307.NWRKNJ-LCR-21.verizon-gni.net (130.81.27.166) 19.166
    ms 19.144 ms 21.097 ms 5 * * * ① 6 0.ae1.GW7.EWR6.ALTER.NET (140.222.2.227) 12.376
    ms 14.634 ms 0.ae2.GW7.EWR6.ALTER.NET (140.222.2.229) 9.805 ms 7 209.85.149.208
    (209.85.149.208) 9.782 ms 10.331 ms 9.192 ms 8 * * * ① 9 dns.google (8.8.8.8)
    11.313 ms 9.761 ms 9.758 ms

    ```


    ① 注意这些路由器未响应 ICMP 数据包


    尽管 ICMP 很有用，但来自外部源的 ICMP 数据包通常会被忽略。网络工程师使用 ICMP 来排查自己的网络故障，但允许外部方也这样做会是一个安全问题。因此，不要指望所有外部主机都会响应
    ping。它们可能仍然在线，但您需要找到 [另一种方法来检测它们。](https://nmap.org/book/man-host-discovery.html)


    ### 4.2.3. NAT


    ![](img/nat.svg "fig:")


    网络地址转换 (NAT) 主要用于允许本地 IP 地址共享一个公共 IPv4 地址。鉴于 IPv4 地址空间的不足，许多设备必须共享一个地址。如在讨论 IPv6
    时提到的，NAT 路由器通常还包括安全功能，例如有状态防火墙，因为执行 NAT 所需的硬件复杂性与防火墙所需的相当。


    ### 4.2.4. IPsec


    互联网协议安全 (IPsec) 用于建立点对点加密隧道，以保护 IP 网络中传输中的数据。IPsec 主要用于专用 VPN 链接，并使用三个主要部分：SA、ESP
    和 AH：


    SA 代表安全关联，是用于设置加密参数和交换密钥的通道。这通过 UDP 端口 500 进行。


    ESP 代表封装安全有效载荷，用于加密 IP 头和有效载荷。它使用协议字段设置为 50 的标准 IP 数据包发送。


    AH 代表认证头，可以可选地在协议字段设置为 51 的标准 IP 数据包中使用。AH 只是确保数据包未被篡改。


    ## 4.3. 传输层协议


    ### 4.3.1. TCP


    传输控制协议 (TCP) 是大多数网络的核心。它通过三次握手提供可靠通信，将大数据段分解为数据包，确保数据完整性，并为这些数据包提供流量控制。所有这些当然都有代价，这种面向连接的协议通常比其对等体具有更高的延迟。鉴于
    TCP 的复杂性，它经常成为攻击目标。TCP 栈不断适应和变化（在协议参数范围内），以避免 DoS 和中间人攻击。


    ### 4.3.2. UDP


    用户数据报协议 (UDP) 是一种无连接协议，旨在用于 TCP 可能延迟过高的情况。UDP 通过不进行握手或流量控制来实现这种性能提升。结果是一种速度快的协议，有时会丢弃数据报。UDP
    常用作游戏或流媒体协议的基础，在这些协议中，数据包的时机比它们是否全部到达更重要。UDP 仍然使用校验和，因此您可以确定收到的任何 UDP 数据包的完整性。


    ### 4.3.3. 常用端口和服务


    端口号用于传输层连接中，以指定要连接的服务。这允许单个主机上运行多个服务。端口 0 到 1023 是周知端口，通常支持常用服务。在大多数操作系统中，绑定到周知端口并监听连接需要管理员权限。注册端口范围从
    1024 到 49151，在其上运行服务不需要管理员权限。您可能会发现许多东西在监听这些端口，因为任何用户都可以在其上拥有服务。最后，端口 49152 到
    65535 由应用程序根据需要动态使用。


    了解一些常用端口很重要，因为在这些端口上运行的服务可能会受到攻击。扫描机器时，只有必要的端口应该开放。


