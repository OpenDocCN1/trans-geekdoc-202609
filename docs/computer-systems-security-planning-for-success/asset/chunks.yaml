    # 8. Vulnerability Management and Compliance


    It is not only good practice, but also a matter of law that information infrastructure
    be secured. In order to better understand what that legalities are and how vulnerabilities
    can and should be addressed, we need to make sure we understand the key terms
    used:


    **Vulnerability**: a weakness or lack of countermeasure that can be exploited
    by a threat


    **Vulnerability Management**: the process of identifying, classifying, and remediating
    vulnerabilities


    **Asset**: something that we are trying to protect


    **Threat**: the vulnerability being exploited


    **Risk**: the impact of an exploit taking place


    **Control/Countermeasure**: actions taken/configurations to remediate vulnerabilities


    It may be helpful to discuss these in terms of an analogy. A vulnerability would
    be an unlocked door. Vulnerability management would be noticing the door and weighing
    the risk. This may involve looking at the crime rate of the area, determining
    the value of the items in the house, taking into account how difficult it would
    be to lock the door, and determining whether you want to lock the door and/or
    purchase an alarm system. An asset would be the things in the house, like a laptop
    of example. Risk would be the impact or a robbery, perhaps $800 for the lost laptop.
    Finally controls/countermeasures would be locking the door, getting a camera system,
    and/or and alarm system.


    ## 8.1. Vulnerability Management


    The first step in managing vulnerabilities is gathering information. The security
    team needs to collect:


    * Hardware information including the operating systems being used and type of
    device (laptop, server, IoT, etc.)

    * Network information including IP addresses, MAC addresses, and details about
    the network segment

    * Domain information including domain name and workgroup

    * Information about applications used and their approval status

    * Information from security tools currently running on the device

    * Owner information for the device


    This information can be gathered from endpoint management software and a significant
    portion of it typically is. This step is part of inventory management, the process
    of keeping a centralized database of asset information. Using endpoint agents,
    network monitoring (often via simple network management protocol, SNMP), and endpoint
    scripts, an inventory management system can keep track of the last date a user
    was logged in, the operating system being used, the applications installed and
    their install dates, and the network segment the device is on. Good inventory
    management is required for good vulnerability management.


    Scans can also be used to find vulnerabilities. Vulnerability scans can be run
    internally and externally either under a privileged or unprivileged account. Scans
    are typically scheduled and run per network segment at times when they will be
    least intrusive. These scans will generate reports or use dashboards to keep the
    security team notified if any vulnerabilities are found.


    Scripts or third party programs can also be used to monitor specific endpoints.
    These scripts may perform ICMP, SNMP, TCP/UDP, or HTTP checks. Often they are
    specific to the device being monitor. For example, if we have an internal web
    server that has had a directory traversal vulnerability in the past we might write
    a script to perform GET requests for vulnerable URLS and return an alert if they
    succeed. This kind of bespoke monitoring is a key aspect of vulnerability management.


    ### 8.1.1. CVEs


    ![CVE Logo is used under fair use](images/cve.svg)


    [CVE Logo](https://www.cve.org/) is used under fair use


    Vulnerabilities are classified/published in a US national vulnerability database
    operated by the MITRE corporation. The database is known as Common Vulnerabilities
    and Exposures or CVE for short. Typically these vulnerabilities are reported by
    vendors or researchers, vetted by MITRE, and finally given a number. A typical
    CVE may look like this: `CVE-2021-26740`. This shows the year the vulnerability
    was disclosed as well as a unique number for that vulnerability in that year.


    Security scanners will often report CVEs on systems that are vulnerable. The security
    team can then look up the CVE and find what steps can be taken to mitigate the
    exploit. It’s important to note that MITRE and the disclosing vendor may also
    choose to [*embargo* a CVE](https://lwn.net/Articles/762512/), that is delay its
    release until after a patch is available. This does mean that not *all* disclosed
    vulnerabilities are immediately available in the CVE database.


    ### 8.1.2. CVSS


    ![](images/cvss.svg)


    The Common Vulnerability Scoring System is a system used to assess the severity
    of exploits and vulnerabilities. Once a CVE is created a CVSS is also creating,
    taking into account the prevalence of the exploit, its ease of use, and its ability
    to do harm. CVSSs use a scale of zero to ten, zero being the least severe and
    ten being the most severe:


    * 0.0: None

    * 0.1-3.9: Low

    * 4.0-6.9: Medium

    * 7.0-8.9: High

    * 9.0-10.0: Critical


    CVSSs are researched and maintained by the National Infrastructure Advisory Council
    (NIAC). A CVSS score is a very important tool used in the next phase we will discuss,
    evaluation.


    ### 8.1.3. Evaluation


    Once information has been gathered and the threats are understood it is time to
    perform an evaluation.


    A security team needs to take into account the costs of asset. If this device
    was to go down how damaging would that be to the company? If it needed to be replaced
    how much would it cost?


    The value of the data also needs to be assessed. Is that data sensitive? Is it
    mission critical to the functioning of the company? What would happen if we lost
    this data?


    The value of an asset or data to a bad actor also needs to be assessed. Is there
    sensitive data that could be sold? Could the leaked data compromise the companies
    long-term goals? Could the data be used to cause an outage?


    Legal consequences of a vulnerability should also be assessed. Will there be fines
    or lawsuits if this vulnerability is exploited?


    Finally reputational consequences should be evaluated. Will there be a loss of
    customers if this threat is realized? Will a breach undermine the trust people
    place in us?


    ## 8.2. Compliance


    Both business and legal standards have been established to ensure that all parts
    of the information security CIA triad are protected. Taking measures to follow
    these standards is known as *compliance*. This section will outline the details
    of many important policies and businesses comply with.


    ### 8.2.1. Compliance Tools


    In order to determine if systems are in compliance, compliance audits are performed.
    These may be automated, and may be as simple as endpoint software that periodically
    scans machines. They may be as complex as having an outside team perform penetration
    testing on a particular site. In either case, compliance audits are looking for
    situations that violate security policies.


    *Risk assessment* is an important part of compliance that determines just how
    damaging one of the violations discovered may be. Risk analysis reports are often
    generated as a second step in a compliance audit. These reports help the company
    make an informed decision as to what actions should be taken.


    Lastly *change controls* are used to ensure that changes that need to happen are
    put in place and to track down changes that led to the violations of the security
    policies. By keeping track of how and why a system changes and requiring approvals
    systems can more from an insecure state to a secure one and hopefully stay that
    way. Change controls should be found in all facets of cybersecurity work.


    ### 8.2.2. PII/PCI

    '
  trans: '


    # 8. 漏洞管理与合规


    保护信息基础设施不仅是良好的实践，也是法律要求。为了更好地了解相关法律法规以及如何应对漏洞，我们需要确保理解以下关键术语：


    **Vulnerability**：威胁可利用的弱点或缺乏对策


    **Vulnerability Management**：识别、分类和修复漏洞的过程


    **Asset**：我们试图保护的资产


    **Threat**：被利用的漏洞


    **Risk**：漏洞利用发生后的影响


    **Control/Countermeasure**：为修复漏洞而采取的行动或配置


    用类比来讨论这些概念可能会有所帮助。漏洞就像一扇未锁的门。漏洞管理就是注意到这扇门并评估风险。这可能涉及查看该地区的犯罪率、确定房屋内物品的价值、考虑锁门的难易程度，以及决定是否锁门和/或购买报警系统。资产就像房子里的东西，例如笔记本电脑。风险是指被盗的影响，例如丢失笔记本电脑可能造成
    800 美元的损失。最后，控制/对策就是锁门、安装摄像头系统和/或报警系统。


    ## 8.1. 漏洞管理


    管理漏洞的第一步是收集信息。安全团队需要收集：


    * 硬件信息，包括使用的操作系统和设备类型（笔记本电脑、服务器、IoT 等）

    * 网络信息，包括 IP 地址、MAC 地址以及网络段的详细信息

    * 域信息，包括域名和工作组

    * 所使用应用程序及其审批状态的信息

    * 设备上当前运行的安全工具的信息

    * 设备的所有者信息


    这些信息可以从终端管理软件中收集，其中很大一部分通常也是如此。此步骤属于资产清单管理的一部分，即维护资产信息集中数据库的过程。使用终端代理、网络监控（通常通过简单网络管理协议
    SNMP）和终端脚本，资产清单管理系统可以跟踪用户上次登录日期、使用的操作系统、已安装的应用程序及其安装日期，以及设备所在的网络段。良好的资产清单管理是良好漏洞管理的前提。


    扫描也可用于发现漏洞。漏洞扫描可以在内部和外部运行，使用特权或非特权账户。扫描通常按计划在网络段上运行，时间选择在对业务影响最小的时段。这些扫描会生成报告或使用仪表板，以便在发现任何漏洞时通知安全团队。


    脚本或第三方程序也可用于监控特定终端。这些脚本可能执行 ICMP、SNMP、TCP/UDP 或 HTTP 检查。它们通常针对被监控的设备而定制。例如，如果我们有一台过去曾出现目录遍历漏洞的内部
    Web 服务器，我们可能会编写一个脚本来对易受攻击的 URL 发送 GET 请求，并在请求成功时返回警报。这种定制监控是漏洞管理的关键方面。


    ### 8.1.1. CVEs


    ![CVE Logo is used under fair use](img/cve.svg)


    [CVE Logo](https://www.cve.org/) 根据合理使用原则使用


    漏洞由 MITRE 公司运营的美国国家漏洞数据库进行分类/发布。该数据库称为通用漏洞披露（Common Vulnerabilities and Exposures，简称
    CVE）。通常，这些漏洞由供应商或研究人员报告，由 MITRE 审核，最后分配一个编号。一个典型的 CVE 可能如下所示：`CVE-2021-26740`。这显示了漏洞披露的年份以及该年份中该漏洞的唯一编号。


    安全扫描仪通常会在易受攻击的系统上报告 CVE。安全团队随后可以查询 CVE，找到可以采取哪些措施来缓解漏洞利用。需要注意的是，MITRE 和披露供应商也可能选择对
    CVE 实施 [*禁运*](https://lwn.net/Articles/762512/)，即在补丁可用之前推迟其发布。这意味着并非 *所有* 披露的漏洞都会立即在
    CVE 数据库中提供。


    ### 8.1.2. CVSS


    ![](img/cvss.svg)


    通用漏洞评分系统（Common Vulnerability Scoring System）是用于评估漏洞利用和漏洞严重程度的系统。创建 CVE 后，也会生成
    CVSS，评估因素包括漏洞利用的普遍性、易用性以及造成危害的能力。CVSS 使用 0 到 10 的评分标准，0 表示最不严重，10 表示最严重：


    * 0.0: 无

    * 0.1-3.9: 低

    * 4.0-6.9: 中

    * 7.0-8.9: 高

    * 9.0-10.0: 严重


    CVSS 由国家基础设施咨询委员会（NIAC）研究和维护。CVSS 分数是我们将在下一阶段讨论的评估中使用的非常重要的工具。


    ### 8.1.3. 评估


    在收集信息并了解威胁后，就可以进行评估了。


    安全团队需要考虑资产的成本。如果该设备停机，对公司会造成多大损害？如果需要更换，成本是多少？


    还需要评估数据的价值。该数据是否敏感？它对公司的运营是否至关重要？如果丢失这些数据会发生什么？


    还需要评估资产或数据对攻击者的价值。是否有可以出售的敏感数据？泄露的数据是否会危及公司的长期目标？数据是否可用于导致宕机？


    还应评估漏洞的法律后果。如果该漏洞被利用，是否会面临罚款或诉讼？


    最后，还应评估声誉后果。如果该威胁成为现实，是否会导致客户流失？安全漏洞是否会削弱人们对我们的信任？


    ## 8.2. 合规


    商业和法律标准已制定，以确保信息安全 CIA 三要素的所有部分都得到保护。采取措施遵循这些标准称为 *合规*。本节将概述许多重要政策以及企业遵循的详细信息。


    ### 8.2.1. 合规工具


    为了确定系统是否符合合规要求，会执行合规审计。这些审计可能是自动化的，可能只是定期扫描机器的终端软件。也可能是复杂的，例如让外部团队对特定站点进行渗透测试。无论哪种情况，合规审计都在寻找违反安全策略的情况。


    *风险评估* 是合规的重要组成部分，用于确定发现的违规行为可能造成多大损害。风险分析报告通常作为合规审计的第二步生成。这些报告帮助公司做出明智的决定，决定应采取哪些行动。


    最后，*变更控制* 用于确保需要发生的变更得到实施，并追踪导致违反安全策略的变更。通过跟踪系统变更的方式和原因并要求审批，系统可以从不安全状态转变为安全状态，并希望保持这种状态。变更控制应贯穿于网络安全工作的所有方面。


    ### 8.2.2. PII/PCI


