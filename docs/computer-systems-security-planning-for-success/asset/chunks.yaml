- raw: "Given that the password is in the included common password wordlist, `/usr/share/john/password.lst`,\
    \ you will quickly find that John the Ripper figures out that karl’s password.\
    \ John the Ripper can also run incrementally though all the possible character\
    \ combinations, but it takes much longer. To help make these types of attacks\
    \ more difficult, every hash in `/etc/shadow` is built off of a random number.\
    \ This number is called a *salt* and is stored with the hash. This means that\
    \ instead of just trying one hash for each word in the wordlist, the hash cracker\
    \ must try every possible salt for every word in the wordlist, slowing things\
    \ down significantly. Modern hash crackers may use [rainbow tables](https://en.wikipedia.org/wiki/Rainbow_table)\
    \ so that all of the possible hashes have already been computed. These tables\
    \ may take up terabytes of disk space, but can make cracking even complicated\
    \ hashes much simpler.\n\nLet’s use a custom utility named `` `crypt `` to show\
    \ that we have the actual password. This utility is already installed on your\
    \ container. We will start by printing out just the line in `/etc/shadow` that\
    \ has karl’s info. We will use the `grep` command to limit out output to things\
    \ that have `karl` in them:\n\n```\nroot@7f978dd90746:/# cat /etc/shadow | grep\
    \ karl\nkarl:$y$j9T$oR2ZofMTuH3dpEGbw6c/y.$TwfvHgCl4sIp0b28YTepJ3YVvl/3UyWKeLCmDV1tAd9:19255:0:99999:7:::\n\
    ```\n\nThe first part of the shadow line is the username, karl. The next part\
    \ of the shadown line, immediately following the first colon, is the hash information.\
    \ The characters in between the first set of `$` is the version of the hashing\
    \ algorithm being used, `y` for yescrypt in our case. The characters in between\
    \ the second set of `$` are the parameters passed to yescrypt which will always\
    \ be `j9T` for us. The characters in between the third set of `$` is your salt.\
    \ Finally the characters in between the fourth set of `$` is the hash.\n\nThe\
    \ \\[`crypt`] utility calls the system [`crypt`](https://man7.org/linux/man-pages/man3/crypt.3.html)\
    \ command and prints the output. Let’s run this utility with the password we’ve\
    \ cracked and the first three parts of the hash information from `/etc/shadow`.\
    \ If everything goes well, you should see hash output that matches what is in\
    \ `/etc/shadow`:\n\n```\nroot@7f978dd90746:/# crypt <karl's password> '$y$j9T$oR2ZofMTuH3dpEGbw6c/y.'\
    \ ①\n$y$j9T$oR2ZofMTuH3dpEGbw6c/y.$TwfvHgCl4sIp0b28YTepJ3YVvl/3UyWKeLCmDV1tAd9\n\
    ```\n\n1.  *①* Don’t forget to use the actual password you cracked and put the\
    \ hash info in single quotes\n\n## 2.12. Review Questions\n\nWhat is the difference\
    \ between symmetric and asymmetric encryption? Give one common use case for each.\
    \ \n\n:  \n\nWhat is a hash and what is it used for? How are hashes used in a\
    \ blockchain? \n\n:  \n\nWhat is the difference between a stream cipher and a\
    \ block cipher? Give one common use case for each. \n\n:  \n\n# 3\\. Malware\n\
    \n## 3.1. What is malware?\n\nMalware is a portmanteau of the words *malicious*\
    \ and *software*. The term is used to describe many different types of *intentionally\
    \ malicious* programs. One of the key differences between malware and just plain\
    \ bad software is the intentional aspect of its creation. Malware is designed\
    \ to damage or exploits computer systems. It often spies on, spams, or otherwise\
    \ damages target or host machines.\n\n## 3.2. Malware Targets"
