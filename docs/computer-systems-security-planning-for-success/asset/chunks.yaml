    a school district network.


    Proxies can also be broken into forward and reverse configurations. A forward
    proxy passes requests from a private or internal network to the internet. Forward
    proxies can speed up local requests through caching and validate that the request
    should be performed. Forward proxies are interoperable with standard firewalls
    and network address translation (`NAT`).


    Reverse proxies take requests from an external source and pass it to an internal
    service. This helps prevent clients from having direct access to internal services.
    Reverse proxies can utilize caching and validate requests as well. A reverse proxy
    can also be configured to work with a firewall. Whereas it used to be common practice
    to place a server in a demilitarized zone (`DMZ`) outside of a firewall, it is
    now far more common to employ a reverse proxy to reach that server.


    ### 6.3.3. Load Balancer


    A common application for reverse proxies is to act as a load balancer for traffic.
    Load balancers distribute work, in the form of external client requests, among
    the internal resources, typically servers.


    For example, if a company has four servers supporting a web application, they
    may employ a reverse proxy load balancer that takes requests from clients and
    passes that request to one of the four internal servers. Different metrics are
    used to determine how the servers are utilized including least used (round robin),
    weighted, least amount of active connections. Load balancers optimize bandwidth
    and increase availability.


    ### 6.3.4. VPN


    A virtual private network (`VPN`) is used to encrypt internet traffic between
    two networks or a client and a network. `VPN`s have become standard procedure
    for linking remote offices or connecting remote workers. Given the growth of working
    from home, almost all users have become familiar with what a `VPN` is and what
    it does.


    Site-to-site `VPN`s are typically used for linking offices together. This kind
    of `VPN` is on permanently. An example would be linking two college campuses:
    NJIT Newark and NJIT Jersey City. In this scenario users on either campus expect
    to be able to connect securely to services on the opposite campus at all times.
    The traffic is encrypted and carried over the Internet.


    Remote access `VPN`s are used by individuals connecting in to a secure network.
    This kind of `VPN` is usually stated through a application such as Cisco AnyConnect.
    When the application is running the user is able to securely access internal resources
    as if they were at the office.


    Many vendors offer `VPN` products including Cisco, Citrix, Fortinet, Palo Alto,
    and Checkpoint. Many open source options also exist for building `VPN`s including
    OpenVPN, WireGuard, and IPsec.


    ### 6.3.5. TAP


    Sometimes it is necessary for a network or security engineer to monitor what is
    happening on a particular network segment. In this case a network terminal access
    point (`TAP`) can be employed. A `TAP` creates a copy of network traffic and forwards
    it to a particular port on a switch or router.


    ## 6.4. EDR


    Endpoint Detection and Response (`EDR`) is used to secure endpoints: servers,
    workstations, desktops, mobile devices, etc. `EDR` is typically implemented as
    a host-based incident prevention system (`HBIPS`), software that runs on the endpoint
    to monitor and collect data.


    These systems will usually watch for indicators of compromise, scan for malware,
    and can even quarantine or shutdown the endpoint as needed. Company hardware is
    a significant investment for any business and an `EDR` makes sure that investment
    is protected. Many systems exist for `EDR` including FireEye, SEP, and CrowdStrike.


    ## 6.5. Data Loss Prevention


    Data loss prevention (`DLP`) solutions aim to stop the exfiltration of sensitive
    data. This could be personally identifying information (`PI`), medical records,
    social security numbers (`SSNs`), credit card numbers, etc. Typically `DLP` either
    functions on the endpoint and server, data at rest, or on the network, data in
    motion.


    Network `DLP` solutions may monitor emails or web traffic for sensitive strings,
    such as `SSNs`. When an `SSN` is detecting in an email, the email is quarantined
    and an alert is sent. Server and endpoint `DLP` solutions may periodically scan
    the system to see if sensitive strings are stored on the system. If it is a system
    that shouldn’t have access to sensitive data an alert is sent. `DLP` on an endpoint
    may also limit tasks like USB usage or bulk data transmitting.


    ## 6.6. IDS/IPS


    Intrusion Detection Systems and Intrusion Prevention Systems are systems that
    monitor network traffic to detect/prevent attacks. These systems may look for
    known exploits, such as SQL injection patterns, in the traffic and trigger an
    alert when detected. An intrusion prevention system will take it one step further
    and actually shut down the connection or kill the offending process.


    These systems employ exploit signatures or IDs that are indicators of compromise
    (`IoCs`), anomalies, or strange behaviors. The power of an IDS/IPS often comes
    from how up-to-date it’s signature database is. There are many solutions in the
    category including Splunk, QRadar, CrowdStrike, and SolarWinds.


    ## 6.7. Email Solutions


    The original protocols used to send/receive email were simple and not designed
    for the challenges we face today. SPAM and phishing emails are unfortunately common
    and can be addressed with email client add-ons that scan for viruses or use patterns
    to identify phishing emails. Many of these tools are already built into Google’s
    GMail or Microsofts Exchange.


    Another large challenge is verifying the sender of an email. Currently three common
    methods exist: Sender Policy Framework (`SPF`), DomainKeys Identified Mail (`DKIM`),
    and Domain-base Message Authentication, Reporting, and Conformance (`DMARC`).


    `SPF` utilizes TXT records on a DNS domain to verify the IP of a sender. When
    inbound mail is received, the `SPF` information for the domain of the sender is
    retrieved, giving an allowed list of IPs. For example, NJIT’s `SPF` record currently
    looks like this:


    ```

    v=spf1 ip4:128.235.251.0/24 ip4:128.235.209.0/24 ip4:66.207.100.96/27 ip4:66.207.98.32/27
    ip4:205.139.104.0/22 ip4:206.79.6.0/24 ip4:209.235.101.208/28 ip4:216.185.73.96/27
    ip4:69.196.241.0/28 ip4:69.196.242.128/28 ip4:46.183.242.192/28 ip4:202.38.144.192/28
    ip4:69.196.236.208/28 ip4:103.225.232.128/28 ip4:37.216.222.128/28 ip4:64.125.200.96/28
    ip4:74.217.49.0/25 ip4:69.25.227.128/25 ip4:52.45.50.190 ip4:198.187.196.100 include:_netblock.njit.edu
    include:spf.sparkmail.org ~all

    ```


    It is important to note that not all of these IPs belong to NJIT. Some may be
    groups that send emails on NJIT’s behalf like mass mailers, web applications,
    etc. When properly configured `SPF` prevents an attacker from impersonating emails
    from a domain.


    `DKIM` utilizes public and private key cryptography to ensure that an email originated
    from a particular SMTP server. Public keys for a domain are advertised through
    a TXT DNS record for a particular domain. Private keys are used by the SMTP server
    for that domain to sign the emails being sent. A receiving SMTP server can then
    verify that the message originated from a valid SMTP server for that domain. Private
    keys can also be distributed to SMTP servers that send emails on behalf of the
    domain.


    `DMARC` applies policies to the `SPF` and `DKIM` validations. `DMARC` answers
    questions like, "What should I do if a message is from a valid `SPF` IP but doesn’t
    have a valid `DKIM` signature?" or "What should I do with a message that looks
    like SPAM but has a valid `DKIM` signature?" `DMARC` puts many of the tools used
    to verify email together in a layered approach to determine whether to pass, quarantine,
    or block an email.


    ## 6.8. SIEM


    Security and Information Event management is a system for real-time monitoring
    of security information. Typically a SIEM system presents a dashboard showing
    events and has the ability to generate reports or create tickets. It may be separate
    device, software on an internal device, or even a third party service. Some examples
    of popular SIEMs are QRadar, Splunk, and Azure Sentinel.


