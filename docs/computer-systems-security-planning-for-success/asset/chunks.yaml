    # 5.5.6. XML 注入


    XML 代表可扩展标记语言，通常用于传输消息。XML 可以是 Web 系统基础设施的重要组成部分，因此如果允许未经清理的用户输入生成系统中使用的 XML，则可能会出现许多问题。利用
    XML 注入，攻击者可能能够检索秘密文件或创建管理员帐户。XML 注入可以通过输入验证或可能禁用所使用框架中的外部实体解析来缓解。


    # 5.5.7. LDAP 注入


    最后，轻量级目录访问协议 (LDAP) 通常用于存储有关用户的信息。因此，它可以在许多 Web 应用程序后台找到。LDAP 也以类似于 SQL 的方式支持复杂查询。未经清理的用户输入可能导致
    LDAP 查询产生意外结果。


    # 5.5.8. 目录遍历


    设计不良的 Web 服务器可能会受到目录遍历攻击。请回顾，Web 服务器旨在从特定目录（例如 `/var/www`）提供静态内容。现在假设攻击者提交了针对
    `http://www.example.com/../../etc/shadow` 的 GET 请求。Web 服务器可能实际上会向上跳转两个目录并提供该文件。


    可以通过文件权限、访问控制和过滤传入请求来解决此问题。需要注意的是，在 HTTP 请求中指定路径的方式不止一种，包括使用 URL 编码，因此必须清理所有可能的恶意输入。


    # 5.5.9. URL 劫持/拼写劫持


    一种不幸常见的广泛攻击是购买与非常流行的域名名称相似的域名。当用户输入错误的热门域名时，他们最终会进入恶意行为者的网站。例如，想象有人注册了 `gooogle.com`（注意三个
    o）。他们可能会从输入错误 `google` 的人那里获得大量流量。


    这些网站可用于广告收入、网络钓鱼凭据，甚至可能用于分发恶意软件。几种浏览器实施的一种缓解措施是维护恶意网站列表，并在用户访问之前警告用户。


    # 5.5.10. 域名劫持


    域名在一定时间后会过期，注册人可能忘记续费。在这些罕见情况下，攻击者可能实际上会获得热门域名（例如 `google.com`）的控制权，并将流量路由到其网站。恶意活动与拼写劫持相同，但攻击者不需要依赖用户犯错。


    还可以通过使用被盗/泄露的凭据登录域名注册系统来劫持域名。在此场景中，攻击者仍然可以修改记录以指向其服务器，但不需要依赖公司忘记续费。


    # 5.5.11. 区域传输攻击


    关于域名系统，区域传输攻击可能会泄露有关域名的敏感信息。DNS 是一种分布式系统，用于将域名解析为 IP 地址。由于系统的分布式特性，协议被构建用于让单个域名由多个服务器提供服务。这些服务器使用
    DNS 区域传输相互传递信息。


    通常这些通信应该是内部的，因为它们可能会泄露有关区域的宝贵信息。不幸的是，配置不当的 DNS 服务器可能会公开宣传其区域传输。在这种情况下，攻击者可以在攻击的侦察阶段使用泄露的信息。


    # 5.5.12. 点击劫持


    网站可能以这种方式设计，即界面对用户来说令人困惑，他们无意中点击了广告或恶意链接。这在流媒体网站、种子跟踪器和成人网站等低完整性网站上很常见。这通常因广告筛选不佳，甚至故意制作看起来与内容相似的广告而变得复杂。


    # 5.6. 结果


    # 5.6.1. 远程代码执行 (RCE)


    攻击最危险的结果之一是远程或任意代码执行。RCE 使攻击者能够在受攻击的机器上执行任何他们想要的指令。通常，攻击者会启动一个具有管理权限的 shell，以便他们可以做任何他们想做的事情。想象一下
    SSH 登录到远程 Linux 机器并将权限提升到 root。这基本上就是 RCE 可能带来的权力类型。攻击者还可以使用 RCE 通过导致程序终止来攻击计算资源的可用性。在这种情况下，RCE
    被用作拒绝服务 (DoS) 攻击的一部分。


    # 5.6.2. 权限提升


    没有通往 root 的电梯，你必须使用漏洞利用。


    ~ 匿名


    权限提升涉及通过非预期方式获得对受保护资源的访问权限。一个示例是 CVE-2021-4034，这是最近在 Linux `pkexec` 命令中发现的本地权限提升漏洞。`pkexec`
    以提升的权限运行且不安全地解析命令行参数。因此，它可以被利用以给普通用户提供 root shell。这将是本地垂直权限提升的一个示例。


    权限提升通常分为两类：水平和垂直。水平权限提升提供对资源的类似访问权限，即从一个用户帐户移动到另一个用户帐户。垂直权限提升提供更高级别的访问权限，即从用户帐户移动到管理员帐户。实现权限提升的五种主要方式是凭据利用、漏洞/漏洞利用、配置错误、恶意软件和社会工程学。


    # 5.6.3. 拒绝服务 (DoS)


    拒绝服务攻击 (DoS) 试图通过用请求淹没系统来阻止系统工作。分布式拒绝服务攻击 (DDoS) 通过利用许多不同的机器做同样的事情。通常，DDoS 攻击的攻击节点是僵尸网络的成员，这些机器之前已被利用并处于攻击者的控制之下。


    DoS 攻击可以采取多种形式，包括：


    SYN 洪水攻击：恶意行为者可以发送多个 SYN 数据包以启动 TCP 三次握手。SYN 数据包易于发送，但可能会导致响应它们的服务器分配大量资源。由于资源分配的不对称性，这使得
    SYN 数据包特别适合用于 DoS 攻击。SYN Cookie 可用于帮助防止这种类型的攻击。


    ICMP 洪水攻击：通常称为 ping，ICMP 回显请求可用于淹没服务器。尤其是当从多个来源发送时。解决方案通常是在服务器上限制 ICMP 数据包的速率。


    缓冲区溢出/漏洞利用：设计不良的软件在接收到意外数据时可能会失败。这可能简单到发送的数据超过缓冲区能容纳的量，或者将发往 Windows 系统 139 端口的数据包的紧急指针
    (URG) 设置为开启。


    远程 Shell


    希望你通过完成实验已经体验过，Linux 系统传统上拥有一个强大的 Shell 系统，它使用文本命令来控制操作系统。通过 Shell，你可以创建、读取、更新或删除文件，建立网络连接，配置内核参数，安装软件包等。事实上，所有现代操作系统都有可用于控制它们的
    Shell。在 Windows 机器上，拥有以管理员身份运行的 PowerShell 访问权限，攻击者就可以完全控制系统。攻击的结果通常是能够远程与受攻击机器上的
    Shell 进行交互。


    在此场景中，我们说受害者正在运行远程 Shell。远程 Shell 可以在受害者机器上后台运行，监听端口等待攻击者连接，但通常受攻击的机器可能没有攻击者可以用来连接的外部
    IP。在这些情况下，会使用反向 Shell。反向 Shell 从受害者向攻击者发起连接，并从内部建立连接。这与大多数设备和互联网之间的防火墙/NAT 路由器更兼容。


    无论哪种情况，通过远程连接拥有机器的特权 Shell 访问权限都允许攻击者基本上做任何他们想做的事情。为此，许多工具应运而生，以提供远程 Shell 访问权限。机器可能已经安装了远程
    Shell 工具，例如 SSH 服务器。如果没有，Netcat 可以与任何可执行文件一起用于通过网络提供对其的访问。`metasploit`（一个非常流行的渗透测试框架）带有许多有效载荷，其中大多数是各种类型的
    Shell。还存在一些程序，可以通过 ICMP、Discord、IRC，甚至 DNS 运行 Shell！


    # 5.7. 实验：使用 Scapy 进行中间人攻击


    在此实验中，我们将使用一个假 SSH 服务器 `sshesame` 和一个交互式数据包操纵程序 `scapy`，来干扰受害者和服务器之间的正在进行的 SSH
    会话，将自己定位在流量中间，并捕获受害者使用的用户名和密码。


    | 名称 | IP 地址 |

    |------|------------|

    | server | 172.20.0.5 |

    | victim | 172.20.0.6 |

    | attacker | 172.20.0.7 |


    在此实验中，我们的 IP 地址是静态配置的，并且攻击者已知。还假设攻击者在本地网络上。最后，受害者配置不当，会忽略主机密钥的更改。这并不完全不合理，因为许多用户只是忽略警告，并在提示时清除
    `known_hosts` 文件。


    首先下载 `scapy.zip` 文件，其中包含我们将使用的 Docker Compose 配置。将其解压缩到你有写权限的目录中。此实验将要求我们使用三个终端窗口/选项卡：一个用于
    `docker-compose up` 命令，它将显示后台运行的所有内容的输出；一个用于受害者，它将显示与服务器的 SSH 会话；一个用于攻击者，我们将使用它来发起攻击。


    打开三个终端，并在每个终端中 `cd` 进入你解压缩实验 zip 文件的目录。你所在的目录中应该有一个 `docker-compose.yml` 文件和 `server`、`victim`
    和 `attacker` 目录。


    在第一个终端中运行 `docker-compose up` 命令来构建镜像并运行容器：


    ```

    Listing 1. docker-compose up


    PS C:\Users\rxt1077\it230\labs\scapy> docker-compose up

    ```


