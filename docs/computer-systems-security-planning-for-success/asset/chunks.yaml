    恶意软件是 `malicious` 和 `software` 这两个词的合成词。该术语用于描述许多不同类型的 `intentionally malicious`
    程序。恶意软件与普通糟糕软件之间的关键区别之一在于其创建的意图性。恶意软件旨在损坏或利用计算机系统。它通常会监视、垃圾邮件或以其他方式损坏目标或主机机器。


