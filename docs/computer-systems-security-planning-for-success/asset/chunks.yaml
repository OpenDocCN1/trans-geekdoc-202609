    请求和响应都可以利用 `headers`，即在初始请求或响应之后的任意文本行。由于头部被设计为开放式的，随着时间的推移，许多新头部被添加进来。现代 Web
    请求/响应在头部中包含的信息通常远比 HTTP 1.1 定义的基础信息要多。未加密的 HTTP 流量通过端口 80 传输，容易受到攻击，因为所有信息都以明文形式发送。


    ## 4.4.3. SSL/TLS


    ![](img/tls.svg "fig:")


    安全套接层 (SSL) 或更现代的命名传输层安全 (TLS) 是一种协议，允许 Web 上使用的明文协议被加密。它是一种通用协议，设计为其他协议通信的层。通常包装在
    TLS 中的一些协议包括 HTTP、SMTP、IMAP、VoIP 和许多 VPN 协议。TLS 使用握手来交换证书信息，如图所示。应当注意的是，在撰写本文时，TLS
    1.3 是最新版本，但只有半数网站支持它。TLS 1.2 是最常见的版本，如果遵循最佳实践，仍被认为是安全的，而 TLS 1.1 或更低版本被视为已弃用。


    ## 4.4.4. HTTPS


    ![HTTPS “icon” by Sean MacEntee used under CC-BY 2.0.](img/https.png "fig:")


    超文本传输安全协议 (HTTPS) 通过将 HTTP 请求包装在 TLS 中来解决未加密流量的问题。HTTPS 流量使用端口 443，通常在浏览器左上角显示一个锁图标。单击图标，用户可以了解用于通信的证书的更多信息。利用强大的
    PKI，HTTPS 允许客户端和服务器之间进行安全的 HTTP 通信。


    ## 4.4.5. RDP


    远程桌面协议 (RDP) 内置于 Windows 中，通常用于远程控制计算机。它通过 TCP 或 UDP 在端口 3389 上工作。虽然 RDP 对远程机器的远程管理非常有用，但如果不法分子获得访问权限，它也可能成为巨大的安全漏洞。RDP
    在勒索软件攻击中的使用正在增加，因为勒索软件程序可能使用 RDP 来寻找其他攻击目标。


    ## 4.4.6. Telnet


    Telnet 是一种过时的远程管理工具，通过明文通道提供对 shell 的访问。Telnet 运行在端口 23 上，虽然仍偶尔被使用，但应大部分被淘汰。你仍会在嵌入式应用程序和旧系统中发现
    Telnet。你也可能看到客户端被用来检查其他类型的流量。例如，你可以使用 Telnet 客户端提交 HTTP 请求或通过 SMTP 发送电子邮件。


    ## 4.4.7. SSH


    安全外壳协议 (SSH) 是部署最广泛的远程管理工具。SSH 通过加密连接提供对 shell 的访问。SSH 支持许多选项，包括 SOCKS5 代理、端口转发以及多种身份验证方案：密码、密钥、硬件设备等。SSH
    在端口 22 上使用 TCP。


    ## 4.4.8. LDAP


    ![](img/ldap.svg "fig:")


    轻量级目录访问协议 (LDAP) 用于访问和维护目录信息服务。它的主要用途是与 Windows Active Directory (AD) 配合使用，可用于从
    AD 服务器获取有关用户和资源的信息。客户端可以通过服务器进行身份验证，并获得读取或读写某些条目的权限。LDAP 最初不支持加密，因此开发了通过 SSL 的
    LDAP (LDAPS)。LDAP 使用端口 389 上的 TCP 和 UDP，LDAPS 使用端口 636 上的 TCP。


    ## 4.4.9. DNS


    域名系统 (DNS) 用于将域名解析为 IP 地址。域名是人们习惯用于网站的简单名称，例如 `njit.edu`，而不是 `54.83.189.142`。名称比
    IP 地址更容易让人记住。为了让计算机解析名称，它首先查询本地缓存，然后查询其主 DNS 服务器。假设 DNS 服务器找不到该名称，它将查询根服务器以获取顶级域
    (TLD) 服务器，该服务器维护该特定域（edu、com、net、org、gov 等）的权威名称服务器列表。最后，一旦找到权威名称服务器，它将响应该特定主机名的
    IP 地址，该地址将被缓存，并通过用户的主 DNS 服务器发送回用户。


    DNS 设计为具有弹性和去中心化，但不幸的是，流量未经过身份验证或加密。这使其成为中间人攻击的目标。同样，缓存命中和未命中 [可能会泄露最近解析了哪些名称的信息](https://kb.isc.org/docs/aa-00509)（就像发现索尼
    Rootkit 范围的情况一样）。DNS 的递归性质在过去也允许拒绝服务攻击，但通过将递归查询限制在面向用户的 DNS 服务器（即 DHCP 请求提供给你的服务器）上，其中大部分问题已得到解决。DNS
    通过端口 53 上的 UDP（以及偶尔的 TCP）运行。


    ## 4.4.10. DNSSEC


    域名系统安全扩展 (DNSSEC) 是一套旨在对域名查询响应进行身份验证的扩展规范。这可以通过检查响应服务器的数字签名来帮助防止中间人攻击。虽然这当然很有帮助，但重要的是要注意，DNSSEC
    不提供机密性。任何有权访问流量的人仍然可以监控 DNS 解析。


    ## 4.4.11. IMAP/POP3


    互联网消息访问协议 (IMAP) 和邮局协议 3 (POP3) 是用于从服务器检索电子邮件的两种协议。IMAP 是较新的协议，支持在服务器上保存邮件和文件夹。POP3
    更为原始，仅支持检索电子邮件（并随后从服务器删除）。两种协议都使用明文，现在通常通过 TLS 运行。POP3 默认使用 TCP 端口 110，如果使用 TLS
    则为 995。IMAP 默认使用 TCP 端口 143，如果使用 TLS 则为 993。在 Webmail 时代，很容易忘记这些协议，但安全专家必须牢记它们，因为它们可能仍用于支持企业设备。


    ## 4.4.12. SMTP


    简单邮件传输协议用于发送/转发电子邮件。正如其名称所示，它是一种由文本行组成的简单协议。基本 SMTP 在端口 25 上使用 TCP。SMTP 后来扩展以支持身份验证，并最终被包装在
    TLS 中，仍然在端口 587 上使用 TCP。SMTP 服务器接受（希望经过身份验证的）客户端的外发邮件，根据 DNS 记录中的邮件交换 (MX) 信息将邮件路由到其他
    SMTP 服务器，并接受来自其他 SMTP 服务器的其域邮件。SMTP 服务器中实现了各种检查，以确保来自域 `actually` 的消息确实来自这些域。这主要用于打击垃圾邮件，垃圾邮件仍然是一个问题。


    ## 4.4.13. NTP


    网络时间协议使用端口 123 上的 UDP 将系统时间与时间服务器同步。NTP 服务器分层为 stratum，最低 stratum 最接近最准确的时间源，如原子钟、GPS
    等。NTP 很重要，因为许多协议（包括几个关键交换）要求系统时钟同步。系统时钟也用于检查证书何时过期，并用于日志中指示某事发生的时间。如果没有准确且同步的系统时钟，许多事情都会以惊人的方式失败。


    ## 4.4.14. FTP


    文件传输协议是一种相对简单的基于文本的协议，用于在机器之间传输文件。FTP 在端口 21 上使用 TCP，并传统上建立两个通道：一个用于协议消息，另一个用于数据的二进制通道。这种设置有趣的地方在于，FTP
    服务器会从服务器到客户端启动数据通道的连接，这意味着在许多客户端难以通过防火墙访问的 NAT 情况下，它会失败。解决这个问题的方法是被动 FTP，它使用由客户端建立的单个通道。


    尽管存在这一初始缺陷，FTP 已被证明非常流行，并且仍在许多企业环境中使用。你可能会看到 FTP 用于传输大量数据以导入系统，或用于更新嵌入式系统中的固件。你可以使用命令行客户端
    `ftp`、图形客户端（如 Filezilla 或 SecureFX），甚至在大多数 Web 浏览器中使用 `ftp://` URL 方案来使用 FTP。


    不幸的是，FTP 不支持除密码以外的身份验证系统，并且密码以明文形式发送。因此，建议使用安全 FTP (SFTP)。SFTP 使用 SSH 连接通过加密通道发送和接收文件。SFTP
    还支持所有 SSH 身份验证方法。


    ## 4.4.15. SNMP


    ![SNMP by Deegii121314 used under CC-BY-SA 4.0](img/snmp.png "fig:")


    简单网络管理协议用于收集有关网络运行情况的信息。它分为两组：使用 UDP 端口 161（TLS 10161）的客户端和使用 UDP 端口 162（TLS 10162）的管理器。管理器收集客户端关于网络操作的消息，并使用这些信息根据需要采取行动。SNMP
    可用于传递有关机器温度、当前连接数量、当前正在使用的通道容量等信息。SNMP 目前已更新至版本 3，该版本经过加密并需要身份验证。这一点尤其重要，因为 SNMP
    是一种非常强大的协议，交换的信息对攻击者来说可能非常有价值。对 SNMP 的访问应受到限制，并且在网络上对其使用情况应进行监控。


