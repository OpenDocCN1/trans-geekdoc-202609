    This is my name in an ICMP packet, in an IP packet, in an Ethernet frame. Be sure
    you use your own name!② The show() command prints out packets in detail③ The srp1()
    function sends and receives one packet at Layer 2 ¶ Notice how we use this to
    capture the server’s MAC address and save it in the server\_mac variable. ¶  ¶
    Take a screenshot of your scapy session at this point showing that you completed
    an ICMP echo request/response with your name in it. ¶  ¶ We can also determine
    MAC addresses at Layer 2 with an ARP "who-has" request. Let’s craft and send a
    broadcast ethernet frame with an ARP "who-has" request for the victims’s IP address.
    The result will tell use what the victim’s MAC address is: ¶  ¶  ¶ Listing 7.
