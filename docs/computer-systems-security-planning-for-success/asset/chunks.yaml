    Other similar one-way functions exist based on elliptical curves. It turns out
    that motion along an elliptical curve can be described according to a start and
    end point and several iterations of a simple algorithm. You can reconstruct the
    initial conditions if you know the start point, end point, and how many iterations
    it took. If all you know is the start and end point you can’t determine the initial
    conditions.


    ## 2.5. Hashes


    ![](images/hash.svg)


    A hashing algorithm is a one-way function that creates hashed text from plaintext.
    It is often used for data validation as a relatively small hash `digest` or `signature`
    can demonstrate the integrity of a large block of data. Hashes can also be used
    so that sensitive information does not have to be stored in cleartext. By storing
    a hash of a password, you can check to see if the correct password was entered
    without storing the password itself. In the case of a data breach only the hashes
    are leaked and the attacker does not have access to the passwords to try with
    other services.


    Two main families of hash algorithms are used: `MD5` and `SHA`. `MD5` produces
    a 128-bit hash value and is still often used to verify data integrity. The algorithm
    is technically cryptographically broken, but you may still see it in use. The
    `SHA` family of algorithms consists of `SHA-1`, `SHA-2`, and `SHA-3`:


    *   `SHA-1`: 160 bits, similar to `MD5`, designed by the NSA, no longer approved
    for cryptographic use


    *   `SHA-2`: `SHA-256` and `SHA-512`, very common with the number indicating the
    block size, designed by the NSA


    *   `SHA-3`: non-NSA designed, not widely adopted, similar numbering scheme as
    `SHA-2` (`SHA3-256`, etc.)


    Dictionary based attacks against password hashes are fairly common. Typically
    software is used which generates a hash for every word in the dictionary and then
    compares that hash to what is stored on the compromised machine. One way to combat
    this is through salting or adding random bits to each password. When salting the
    bits are stored with the hash. This forces a dictionary based attack to actively
    generate the hashes based on what the salt is as opposed to using a stored table
    (rainbow table) of all the possible hashes. It can make attacks go from instant
    to days or even years depending on the complexity of the password.


    An even better way of combating attacks against hashes is through a secret salt
    or `pepper`. A `pepper` is a random value that is added to the password but not
    stored with the resulting hash. The random value can be stored in a separate medium
    such as a hardware Security Module.


    ## 2.6. Symmetric Encryption


    ![](images/symmetric.svg)


    Symmetric encryption is probably the simplest encryption to understand in that
    it only uses a single key (in this case our key is labelled ''A'') to encrypt
    or decrypt data. Both parties need to know the private key in order to communicate.
    It does pose a security risk in that if the channel used for key exchange is insecure,
    all of the messages can be decrypted. That being said, given that it is simpler
    than many other forms of encryption, it is often used for secure communication
    or storage.


    ### One-time-pad


    One-time-pad (`OTP`) is a rare example of a pen and paper, symmetric encryption
    scheme that cannot be cracked. The difficulty in `OTP` mirrors the difficulty
    with all symmetric encryption, namely that pre-shared keys need to be exchanged
    at some point.


    Imagine that a prisoner wishes to send encrypted messages to someone outside the
    prison. To do so, they will make use of a copy of Harry Potter and the Sorcerer’s
    Stone that they have in their cell. The message they want to send is "DIG UP THE
    GOLD". They turn to "Chapter One: The Boy Who Lived" and look up the first twelve
    letters in the chapter: MR AND MRS DURS. For each letter of their message, they
    convert it to its number in the alphabet: 4 9 7 21 16 20 8 5 7 15 12 4 (`DIG UP
    THE GOLD`). They do the same for the key they looked up in their book: 13 18 1
    14 4 13 18 19 4 21 18 19 (`MR AND MRS DURS`). Finally they add the two numbers
    to get their ciphertext: 17 27 8 35 20 33 26 24 11 36 30 23.


    If the prisoner sends that ciphertext to someone on the outside who knows that
    they key is the first chapter of Harry Potter and the Sorcerer’s Stone, they will
    be able to subtract the key from each of the numbers in the ciphertext and discover
    the plaintext message. While theoretically unbreakable, anybody else who has the
    key can recover the text as well. This means that using common keys like popular
    books make it trivial for a man-in-the-middle to decode the ciphertext. After
    all, the warden probably knows every book that the prisoner has in their cell.


    `OTP` has been used by spy agencies, often for communications between individuals
    via dead-drops. In this situation tables of random characters printed in duplicate
    are exchanged as the key.


    ## 2.7. Asymmetric Encryption


    ![](images/asymmetric.svg)


    An asymmetric encryption algorithm has actually already been demonstrated in the
    [Mathematical Foundation](#index.xhtml#_mathematical_foundation) section. Asymmetric
    encryption has a public key which can be published anywhere and used to encrypt
    messages that only the holder of the private key, which is not published, can
    unencrypt. For example if you want to receive encrypted emails you may make your
    [GNU Privacy Guard (GPG)](https://gnupg.org/) public key available a [public key
    server](https://keyserver.ubuntu.com/). This would allow anyone to look up your
    public key, encrypt a message that only you can read, and send you the ciphertext.
    Asymmetric encryption gets around the difficulties of key exchange via an untrusted
    channel (like email). Unfortunately the cost of such a useful system is that asymmetric
    algorithms tend to be much slower that their symmetric counterparts.


    ## 2.8. Stream Ciphers


    Stream ciphers encode data one symbol at a time and produces one ciphertext symbol
    for each cleartext symbol. Given that you can often use some sort of block encryption
    with a significantly small block size, stream encryption is not used as often.
    Technically the `OTP` example, when used one symbol at a time, is a stream cipher.
    The keys come in one symbol at a time, the cleartext comes in one symbol at a
    time, and an operation is performed (addition in the case of the example) to create
    the ciphertext. Given a suitable keysize and a well-researched algorithm, stream
    ciphers can be just as secure as block ciphers. That being said a stream cipher
    is usually more consistent in its runtime characteristics and typically consumes
    less memory Unfortunately there are not as many well-researched algorithms and
    widely used stream ciphers.


    ## 2.9. Block Ciphers


    Block ciphers takes the data in, in blocks and use cipher blocks of the same size
    to perform the encryption. It is very popular and there are many secure algorithms
    to choose from. Unfortunately if the input data doesn’t fit neatly into blocks
    of the same size, padding may be required, which takes up more space/memory and
    reduces the speed of the cipher. As such the block encryption is often less performant
    than stream encryption.


    ### 2.9.1. Block Cipher Modes of Operation


    There are several ways you can create your cipher blocks and depending on how
    you do it, various attacks are possible:


    #### Electronic Codebook (ECB)


    ![WhiteTimberwolf (SVG version), Public domain, via Wikimedia Commons](images/ecb.svg)


    [WhiteTimberwolf (SVG version)](https://commons.wikimedia.org/wiki/File:ECB_encryption.svg),
    Public domain, via Wikimedia Commons


    The simplest mode of operation, data is divided into blocks and each block is
    encoded using a key. Since the blocks are encoded the same way, identical blocks
    will give identical ciphertexts. This makes it easier, given enough data, to determine
    what the key is.


    #### Cipher block chaining (CBC)


    ![WhiteTimberwolf (SVG version), Public domain, via Wikimedia Commons](images/cbc.svg)

    '
  trans: '


    其他类似的单向函数基于椭圆曲线存在。事实证明，沿椭圆曲线的运动可以根据起点、终点以及简单算法的多次迭代来描述。如果你知道起点、终点以及迭代次数，就可以重建初始条件。如果你只知道起点和终点，就无法确定初始条件。


    ## 2.5. 哈希


    ![](img/hash.svg)


    哈希算法是一种单向函数，用于从明文生成哈希文本。它常用于数据验证，因为相对较小的哈希 `digest` 或 `signature` 可以证明大块数据的完整性。哈希也可用于避免以明文形式存储敏感信息。通过存储密码的哈希值，你可以检查是否输入了正确的密码，而无需存储密码本身。在发生数据泄露的情况下，只有哈希值会被泄露，攻击者无法获取密码来尝试用于其他服务。


    主要使用两类哈希算法：`MD5` 和 `SHA`。`MD5` 生成 128 位哈希值，仍常用于验证数据完整性。该算法在技术上已被破解，但你可能仍会看到它在使用。`SHA`
    算法族包括 `SHA-1`、`SHA-2` 和 `SHA-3`：


    *   `SHA-1`: 160 位，类似于 `MD5`，由 NSA 设计，不再批准用于加密用途


    *   `SHA-2`: `SHA-256` 和 `SHA-512`，非常常见，数字表示块大小，由 NSA 设计


    *   `SHA-3`: 非 NSA 设计，未被广泛采用，编号方案与 `SHA-2` 类似（`SHA3-256` 等）


    基于字典的攻击针对密码哈希相当常见。通常使用软件为字典中的每个单词生成哈希，然后将该哈希与受攻击机器上存储的哈希进行比较。对抗这种攻击的一种方法是通过加盐，即向每个密码添加随机位。加盐时，这些位会与哈希一起存储。这迫使基于字典的攻击必须根据盐值主动生成哈希，而不是使用所有可能哈希的存储表（彩虹表）。这可能使攻击从瞬间完成变为数天甚至数年，具体取决于密码的复杂性。


    对抗针对哈希攻击的更好方法是通过秘密盐或 `pepper`。`pepper` 是添加到密码但不与生成的哈希一起存储的随机值。随机值可以存储在单独的介质中，例如硬件安全模块。


    ## 2.6. 对称加密


    ![](img/symmetric.svg)


    对称加密可能是最容易理解的加密方式，因为它只使用一个密钥（在此情况下，我们的密钥标记为 ''A''）来加密或解密数据。双方都需要知道私钥才能通信。它确实存在安全风险，因为如果用于密钥交换的通道不安全，所有消息都可能被解密。话虽如此，鉴于它比许多其他形式的加密更简单，它常用于安全通信或存储。


    ### 一次性密码本


    一次性密码本 (`OTP`) 是一种罕见的纸笔对称加密方案示例，无法被破解。`OTP` 的困难与所有对称加密的困难相同，即预共享密钥需要在某个时刻进行交换。


    想象一下，一名囚犯想要向监狱外的某人发送加密消息。为此，他们将使用牢房里的一本《哈利·波特与魔法石》。他们想发送的消息是 "DIG UP THE GOLD"。他们翻到
    "第一章：活下来的男孩"，查找该章节的前十二个字母：MR AND MRS DURS。对于消息中的每个字母，他们将其转换为字母表中的数字：4 9 7 21 16
    20 8 5 7 15 12 4 (`DIG UP THE GOLD`)。他们对在书中查找的密钥做同样的操作：13 18 1 14 4 13 18 19 4
    21 18 19 (`MR AND MRS DURS`)。最后，他们将两个数字相加得到密文：17 27 8 35 20 33 26 24 11 36 30
    23。


    如果囚犯将该密文发送给监狱外知道密钥是《哈利·波特与魔法石》第一章的人，他们将能够从密文中的每个数字减去密钥，从而发现明文消息。虽然理论上无法破解，但任何拥有密钥的人都可以恢复文本。这意味着使用像流行书籍这样的常用密钥，会让中间人轻松解码密文。毕竟，狱警可能知道囚犯牢房里的每一本书。


    `OTP` 已被间谍机构使用，通常用于个人通过死点投递进行通信。在这种情况下，印有重复随机字符的表格作为密钥进行交换。


    ## 2.7. 非对称加密


    ![](img/asymmetric.svg)


    非对称加密算法实际上在 数学基础 部分已经演示过。非对称加密有一个公钥，可以发布到任何地方，并用于加密消息，只有持有未发布的私钥的人才能解密。例如，如果你想接收加密电子邮件，你可以使你的
    [GNU Privacy Guard (GPG)](https://gnupg.org/) 公钥在 [公钥服务器](https://keyserver.ubuntu.com/)
    上可用。这样任何人都可以查找你的公钥，加密只有你能阅读的消息，并将密文发送给你。非对称加密绕过了通过不可信通道（如电子邮件）进行密钥交换的困难。不幸的是，如此有用系统的代价是，非对称算法通常比其对称对应物慢得多。


    ## 2.8. 流密码


    流密码一次编码一个符号，并为每个明文符号生成一个密文符号。鉴于你通常可以使用块大小显著较小的某种块加密，流加密使用得不那么频繁。从技术上讲，`OTP` 示例在一次使用一个符号时是一种流密码。密钥一次输入一个符号，明文一次输入一个符号，并执行一个操作（在示例中为加法）来创建密文。给定合适的密钥大小和经过深入研究的算法，流密码可以和块密码一样安全。话虽如此，流密码在运行特性上通常更一致，并且通常消耗更少的内存。不幸的是，经过深入研究的算法和广泛使用的流密码并不多。


    ## 2.9. 块密码


    块密码以块的形式读取数据，并使用相同大小的密码块来执行加密。它非常流行，有许多安全算法可供选择。不幸的是，如果输入数据不能整齐地适应相同大小的块，可能需要填充，这会占用更多空间/内存并降低密码的速度。因此，块加密通常比流加密性能更差。


    ### 2.9.1. 块密码操作模式


    有几种方法可以创建密码块，具体取决于你如何操作，可能会发生各种攻击：


    #### 电子密码本 (ECB)


    ![WhiteTimberwolf (SVG version), Public domain, via Wikimedia Commons](img/ecb.svg)


    [WhiteTimberwolf (SVG version)](https://commons.wikimedia.org/wiki/File:ECB_encryption.svg),
    Public domain, via Wikimedia Commons


    最简单的操作模式，数据被分成块，每个块使用密钥进行编码。由于块以相同的方式编码，相同的块会产生相同的密文。这使得在有足够数据的情况下，更容易确定密钥是什么。


    #### 密码块链 (CBC)


    ![WhiteTimberwolf (SVG version), Public domain, via Wikimedia Commons](img/cbc.svg)


    '
