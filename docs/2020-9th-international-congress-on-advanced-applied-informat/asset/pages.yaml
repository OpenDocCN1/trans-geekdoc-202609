    For the ensemble of two or more DNNs, we constructed a parent DNN which was trained
    for the data set and two child DNNs which were trained for the test cases. The
    KL divergence for the original model P and the child model Q was calculated by
    the following equations:


    ```

    $D_{KL}(P||P_x) = \sum P_x(x) \log \frac{P_x(x)}{P(x)}, \quad (1)$

    ```


    ```

    $D_{KL}(P_x||P) = \sum P_x(x) \log \frac{P(x)}{P_x(x)}, \quad (2)$

    ```


