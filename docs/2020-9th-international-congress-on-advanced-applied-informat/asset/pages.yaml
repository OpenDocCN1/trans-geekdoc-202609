    4 shows the test categories except ''Non-Face''. These categories are labeled
    according to subjectivity based on Valence and Arousal as shown in Fig. 5. Value
    is the degree of pleasure/displeasure and Arousal is the degree of emotional strength.
    Value of Valence'
