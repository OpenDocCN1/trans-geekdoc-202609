- pgno: 1
  md: '![](img/0c190dbfa46c74bcca703aed90871083_1_0.png)


    Fig. 1. Network structure of RBM


    DBN can take huge iterative training. Moreover, the judgment for mis-labeled data
    will require additional information.


    In this paper, we reconstruct the trained DBN by using the training data. First,
    a new child DBN is trained for the conflicted test data. Second, Kullback-Leibler
    (KL) divergence is used to observe the difference between the parent and the child
    models [16]. In large case of KL, a new neuron is generated in the parent DBN
    and its weights are fine-tuned using the method described in [14]. We proposed
    the method to verify which categories are misclassified for test data. The classification
    accuracy improved from 78.4% to 91%.


    The remainder of this paper is organized as follows. In section II, the structural
    learning of DBN is explained. Section III explains the factual database: Affect.
    In section IV, the effectiveness of our proposed method is verified through experiments.
    In section V, we give some discussions to conclude this paper.


    # II. STRUCTURAL LEARNING METHOD OF DBN


    The basic idea of our proposed Adaptive DBN is described in this section to understand
    the behavior of self-organized structure. The network structure of RBM consists
    of two kinds of binary layers as shown in Fig. 1. DBN is stacking for stochastic
    unsupervised learning by hierarchically building several RBMs.


    # A. Neuron Generation/Annihilation Algorithm


    We developed the adaptive structural learning method in RBM and DBN, called Adaptive
    RBM and Adaptive DBN [13]. To generate an optimal number of hidden neurons for
    given space during its training. In the method, idea of Walking Distance (WD)
    was proposed for variance learning for parameters. If the variance is large, clearly
    if the network does not have enough neurons, the WD will tend to fluctuate along
    the trajectory. The situation shows that some hidden neurons may not represent
    an anomaly pattern due to the lack of hidden neurons. To represent anomaly patterns
    into neurons, a new neuron is generated to inherit the attributes of the parent
    as shown in Fig. 2.


    However, we may have a situation that some redundant neurons were generated due
    to the neuron generation process. The neuron annihilation algorithm was applied
    to kill the redundant neuron after neuron generation process. Fig. 2(b) shows
    that the corresponding neuron is annihilated.


    ![](img/0c190dbfa46c74bcca703aed90871083_1_1.png)


    (a) Neuron generation


    (b) Neuron Annihilation


    Fig. 2. Adaptive DBN


    Suitable number of hidden layers and neurons is automatically generated.


    pre-training between 4th and 5th layers


    pre-training between 2nd and 3rd layers


    pre-training between 1st and 2nd layers


    ![](img/0c190dbfa46c74bcca703aed90871083_1_2.png)


    Fig. 3. An Adaptive of DBN


    DBN is a hierarchical model of stacking the several trained RBMs. For building
    hierarchical process, the output of hidden of i-1 RBM can be seen as the input
    of i+1 RBM. Generally, with DBN we have higher power of data representation than
    RBM. Such hierarchical model can represent the various features from abstract
    to concrete representation in the direction of input layer. However, the number
    of neurons depends on the data set.


    Adaptive DBN can dynamically adjust the network to add new neuron one by one based
    on the ID of WD. If the variance is large and the function does not converge,
    a new RBM will be created to match the network structure set


