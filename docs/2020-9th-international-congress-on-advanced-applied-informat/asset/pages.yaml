  md: '**Index Terms—** Deep Learning, Restricted Boltzmann Machine, KL Distillation,
    Learning, AffectNet


    The other deep learning model is a Deep Belief Network (DBN) that has high classification
    performance by training and piling up a Restricted Boltzmann Machine (RBM) which
    is a generative neural network. Although a DBN model does not have high classification
    as CNN models, the automatically determined method [9] of hidden neurons of RBM
    and hidden layers of DBN have been developed according to the input data space
    learning. The method is the adaptive structural learning method of DBN (Adaptive
    DBN) which uses genetic optimization algorithm to find the optimal network structure
    [11]. The outstanding characteristic of Adaptive DBN can show higher classification
    accuracy as several classes [13], for some image data set [12] and the real worlds.


    Recently, the research of Deep Learning [1], [2] has caused an unforeseen influence
    not only theoretical research of artificial intelligence, but also practical application
    in our lives. The deep models such as AlexNet [3], GoogleNet [4], VGG [5] and
    ResNet [6] have produced image recognition that greatly exceeded the capacity
    of human ability. These models are a type of convolutional neural networks. The
    features included in the input data are processed at multiple layers, and complex
    features of the entry image can be represented with high capacity by piling up
    layers hierarchically.'
