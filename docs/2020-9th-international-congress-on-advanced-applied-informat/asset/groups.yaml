  mdcn: "\n\n**索引术—** 深度学习、受限玻尔兹曼机、KL蒸馏、学习、AffectNet\n\n另一种深度学习模型是深度信念网络（DBN），它通过训练和堆叠受限玻尔兹曼机（RBM，一种生成式神经网络）来实现高分类性能。尽管\
    \ DBN 模型的分类性能不如 CNN 模型，但根据输入数据空间学习，针对 RBM 隐藏神经元和 DBN 隐藏层的自动确定方法 [9] 已经被开发出来。该方法是\
    \ DBN 的自适应结构学习方法（Adaptive DBN），它利用遗传优化算法寻找最优网络结构 [11]。自适应 DBN 的显著特征是对于某些图像数据集\
    \ [12] 和真实世界，它可以显示出多个类别更高的分类准确率 [13]。\n\n最近，深度学习 [1], [2] 研究不仅对人工智能理论研究产生了意想不到的影响，也影响了生活中的实际应用。AlexNet\
    \ [3]、GoogleNet [4]、VGG [5] 和 ResNet [6] 等深度模型产生的图像识别能力远超人类能力。这些模型是卷积神经网络的一种。输入数据中的特征在多个层上进行处理，通过分层堆叠，可以高容量地表示输入图像的复杂特征。\n\
    \n![](img/0c190dbfa46c74bcca703aed90871083_1_0.png)\n\n图 1. RBM 的网络结构\n\nDBN 可以进行大量的迭代训练。此外，对误标记数据的判断需要额外的信息。\n\
    \n在本文中，我们利用训练数据重构了训练过的 DBN。首先，针对冲突的测试数据训练一个新的子 DBN。其次，使用库尔巴克-莱布勒（KL）散度观察父模型和子模型之间的差异\
    \ [16]。当 KL 散度较大时，会在父 DBN 中生成一个新的神经元，并使用 [14] 中描述的方法对其权重进行微调。我们提出了这种方法来验证测试数据中哪些类别被误分类。分类准确率从\
    \ 78.4% 提高到了 91%。\n\n本文的其余部分组织如下：第 II 节解释了 DBN 的结构学习。第 III 节介绍了事实数据库 Affect。在第\
    \ IV 节中，通过实验验证了我们所提方法的有效性。在第 V 节中，我们给出了一些讨论以总结本文。\n\n## II. DBN 的结构学习方法\n\n本节描述了我们提出的自适应\
    \ DBN 的基本思想，以理解自组织结构的行为。RBM 的网络结构由两种二值层组成，如图1 所示。DBN 通过分层构建多个 RBM 进行堆叠的随机无监督学习。\n\
    \n### A. 神经元生成/消除算法\n\n我们在 RBM 和 DBN 中开发了自适应结构学习方法，称为自适应 RBM 和自适应 DBN [13]，以便在训练过程中为给定空间生成数量数量隐藏神经元。在该方法中提出了行走距离（WD）思想用于参数的方差学习。如果方差很大，显然如果网络没有足够的神经元，WD\
    \ 将倾向于沿轨迹波动。这种情况表明，由于缺少隐藏神经元，某些隐藏神经元可能无法异常模式。为了将异常模式表示为神经元，会生成一个新的神经元来继承父元的属性，如图\
    \ 2 所示。\n\n然而，我们可能会由于神经元生成过程产生一些冗余神经元。在神经元生成过程后应用神经元消除算法来杀死冗余神经元。图 2(b) 显示了相应的神经元被消除了。\n\
    \n![](img/0c190dbfa46c74bcca703aed90871083_1_1.png)\n\n(a) 神经元生成\n\n(b) 神经元消除\n\
    \n图 2. 自适应 DBN\n\n自动生成合适的隐藏层和神经元数量。\n\n- 第 4 层和第 5 层之间的预训练\n- 第 2 层和第 3 层之间的预训练\n\
    - 第 1 层和第 2 层之间的预训练\n\n![](img/0c190dbfa46c74bcca703aed90871083_1_2.png)\n\n图\
    \ 3. 一种自适应的 DBN\n\nDBN 是堆叠多个已训练的 RBM 的分层模型。为了构建分层过程，i-1 的输出可以视为 i+1。通常，DBN 的能力强于输入。自适应\
    \ DBN 可以动态调整网络以添加新神经元。如果方差很大，网络将不会收敛，等待。\n\n## III. 针对 AFFECT 的自适应学习方法\n\nAffect\
    \ 是一个包含人类情感的数据集 [15]。如表 I 所示，除了“非脸”之外还有其他类别。效价（Valence）是快乐和不悦的程度。\n\n### 表 I Affect\
    \ 中的情感类别\n\n| 类别 | 训练数据 | 测试数据 |\n| :--- | :--- | :--- |\n| 中性 (Neutral) | 5478\
    \ | 500 |\n| 快乐 (Happy) | 13415 | 500 |\n| 悲伤 (Sad) | 2595 | 500 |\n| 惊讶 (Surprise)\
    \ | 14090 | 500 |\n| 恐惧 (Fear) | 5738 | 500 |\n| 厌恶 (Disgust) | 5803 | 500 |\n\
    | 愤怒 (Anger) | 4892 | 500 |\n| 无 (None) | 7750 | 500 |\n| 不确定 (Uncertain) | 11645\
    \ | 500 |\n| 非脸 (Non-Face) | 5267 | 500 |\n| 总计 (Total) | 44198 | 500 |\n\n![](img/0c190dbfa46c74bcca703aed90871083_2_0.png)\n\
    \n(a) 中性 (b) 快乐 (c) 悲伤 (d) 惊讶 (e) 恐惧 \n\n![](img/0c190dbfa46c74bcca703aed90871083_2_1.png)\n\
    \n(f) 厌恶 (g) 愤怒 (h) 愤怒 (j) 愤怒\n\n![](img/0c190dbfa46c74bcca703aed90871083_2_2.png)\n\
    \n(f) 厌恶 (g) 满意 (h) 无 (j) 不确定\n\n图 5. 效价与情感\n\n图 6. 误分类类别的示例\n\n图 4. Affect 中的样本\n\
    \n唤醒度（Arousal）分别为 [-1, 1]，如图 5 所示。\n\n## IV. KL散度蒸馏模型\n\n本节详细说明了使用 KL 散度的学习方法。研究了每个类别的测试准确率。结果在第\
    \ III 节报告。计算了训练与误分类情感之间的 KL 散度。如果 KL 散度大于某个阈值，将在适当位置重建某些神经元以分类误分类案例。神经元生成方法涉及与目标神经元的匹配。\n\
    \n### A. DBN 对 AffectNet 的分类\n\n表 III 显示了 DBN 对 AffectNet 的分类结果。情况下，AlexNet 的分类约占测试数据的\
    \ 60%。DBN 在训练集上实现了 100% 的分类准确率。对于测试数据，情感类型的平均分类准确率达到 87%。最好的情况是“快乐”，最差的是“愤怒”。分类准确率低于\
    \ 90% 的类别是“中性”、“悲伤”、“惊讶”和“厌恶”。\n\n"
