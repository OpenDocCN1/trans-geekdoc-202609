    # IV. KLIVERGENCE DISTILLATION MODEL


    The section details the learning method using KL Divergence Adaptation DBN. The
    accuracy for test cases was investigated in each category. The results are reported
    for some specified emotional type and shown in Section III. The KL divergence
    between the trained and the mis-classified emotion was calculated. If the KL divergence
    is larger than a certain threshold value, some neurons will be recreated at the
    appropriate position to classify the mis-classified cases. The neuron generation
    method involves matching the path with the target neurons.


    # A. Classification of AffectNet by DBN


    Table III shows the classification results by DBN for AffectNet. In this case,
    the classification by AlexNet reported about 60% of the test set data. DBN achieved
    100% classification accuracy for the training set. For test data, the classification
    accuracy for emotion types was 87% on average. The best case was ‘Happy’, while
    the worst one was ‘Anger’. The categories with less than 90% classification accuracy
    were ‘Neutral’, ‘Sad’, ‘Surprise’, and ‘Disgust’. We investigated the mis-classified
    cases by the label and the faces for the mis-classified categories.


    Table IV shows the confusion matrix for the results in Table III. The element
    in confusion matrix matches the number of predicted category and the label for
    emotion faces. Fig. 6 shows some examples of the mis-classified cases. From Table
    IV, we found that many mis-classified cases where ‘Anger’ was as ‘Disgust’


    In [15], the ratio of labeled data by two annotations to an image for each category
    was reported. Table II


    An DBN trained on the method correctly classifies the three categories: ‘Neutral’,
    ‘Uncertain’, and ‘Non-Face’ in the same way as [15]. Although the classification
    accuracy for test data was higher than the CNN method, the accuracy was not high
    (over 78.4%). The classification was not caused by over-fitting or over-training
    while. We found some conflict patterns in the test data that were categorized
    by one or more annotator’s answers.'
