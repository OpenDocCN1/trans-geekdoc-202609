    ## 基于残差误差建模的混合小波-ConvLSTM 深度学习模型的电动电池 SOC 估计


    Utkarsh Kumar | Sukumar Mishra | Sreedhar Madichette


    电气工程系 | 电气与电子工程系 | 中央工程学院


    印度理工学院 | 印度理工学院 | 印度海德拉巴


    Haus Khas, 新德, 印度 | Haus Khas, 新德, 印度 | sreedhar803@gmail.com


    mitushkumar@gmail.com | sukhamidarmitra@gmail.com


    *摘要*—电量（SOC）估计已成为电池管理系统的基本需求，特别是对于电动汽车（EVs）而言。SOC 状态测量的是剩余电量，用以指示电动汽车还能使用多久。因此，对锂离子电池（LIBs）进行准确且持续的监控对于使用和电池生命周期至关重要。尽管对
    SOC 估计的研究已多年，但由于无法在噪声条件下处理大量数据，目前尚无简单的电子设备可以直接测量 SOC。本文提出了一种结合残差特征卷积长短期记忆网络（ConvLSTM）深度学习模型的高效估计方法。实验和验证使用了公共锂电池数据集。多级小波分解提高了估计的准确性。所提方法在准确性和泛化能力方面表现良好。


    锂离子电池最合适的问题是监控和测量剩余电量，因为它们的燃料动力系统不会直接面临电子仪器所面临的问题。测量电量状态对于电动汽车的能量管理至关重要。SOC 是任何电池相对于其容量的电量水平。它允许车辆利用能量通过电电机加速。同时，发动机作为发电机工作，为电池充电至达到所需的最低水平。


    电池的状态需要对运行管理、生命周期成本、可靠性扩展和安全运行进行严谨的研究。可见，由于车辆和电流信号的时间依赖性和非线性特性，SOC 受运行条件、温度和行驶负载等多种参数的影响。多年来关于
    SOC 估计已有大量研究。文献分类集中在三种方法：基于安培的方法、基于查找表的方法和基于滤波的估计方法。每种方法都适用于实验室环境估计。当电池最大容量已知且可测量时非常有效。查找表是
    SOC 的函数，用于计算电池的块值。为了估计 SOC，需要随时间测量充电和放电。基于模型的方法通过构建历史将电池的复杂数学方程纳入其中。无模型方法是在电池数学模型未知时使用的数据驱动方法。该方法直接从电池、电压和温度数据中估计电池的内部状态。为了模拟电池单元的各种特性，文献
    [2] 中利用电压、电流和温度提出了循环神经网络。它使用了通过动态应力测试、联邦城市等测试获得的数据。


    # I. 引言


    电动汽车在全球范围内不断扩大，它们极有可能减少化石燃料燃烧产生的温室气体排放。电动汽车是绿色的电力替代方案，因为它们由锂离子电池（LIBs）驱动。它们不会向环境中排放有害气体，为健康绿色的环境做出贡献。电动汽车电池的高效率、低碳足迹、高能量密度和低成本使其成为电力城市中燃料燃烧的替代品。锂离子电池（LIBs）是电动汽车中最常见的动力源。锂离子电池具有高能量密度、循环寿命和安全性等规格和类型。其特性和长寿命使其尺寸上比铅酸电池等其他充电车辆更小、更轻。使用锂电池有许多优势


    978-1-6654-2536-0/21/$30.00 ©2021 IEEE


    ![](img/e970ca6a11457c5c768ab151829d3475_1_0.png)


    图 1. 从计算时间、跟踪精度和对各种初始条件的鲁棒性方面对 SOC 进行了评估。电池包的可靠性取决于管理系统。作者在 [3] 中开发了一个完全基于电压测量和电流曲线的三二极管单元模型。并提出了一种基于多单元扩展卡尔曼滤波的方法来准确估计
    SOC。


    减少里程焦虑和提高电动汽车性能是可以通过精确 SOC 估计实现的关键因素。


