    # I. INTRODUCTION


    Electric vehicles are expanding globally, and there is a high probability that
    they will help reduce greenhouse emissions resulting from fossil fuel combustion.
    EVs are green electric alternatives, as they are powered by electric batteries
    (LIBs). They do not emit hazardous gases in the environment, contributing to a
    healthy and green environment. High efficiency, low carbon footprint, high energy
    density, and low cost of batteries EVs have made them as an alternative to fuel
    combustion in electric cities. Lithium-ion batteries (LIBs) are the most common
    sources of power in EVs. LIBs are available with different specifications and
    types concerning high energy density, cycle life, and safety. Effects, and long
    life cycle, allowing them to be smaller and lighter in dimensions than other rechargeable
    vehicles as lead-acid batteries. There are many advantages of using lithium


