    *Abstract—State of charge (SOC) estimation has been an essential requirement for
    battery management system as it is recent especially for Electric Vehicles (EVs).
    The SOC statures the amount of charge left to indicate how long more can be used
    by EV. Hence, accurate and unmonitored monitoring of lithium-ion batteries (LIBs)
    is essential for usage and battery life cycle. Although there has been long research
    on estimating SOC, there are no easy electronic equipments that can measure the
    SOC directly due to its inability to process large amount of data with noisy conditions.
    This article proposes an efficient estimation method by incorporating residual
    feature-based convolutional LSTM (ConvLSTM) deep learning model. Publish lithium
    dataset was used for this experimentation and validation. Level wavelet decomposition
    has improved the accuracy of estimation. The proposed method works well in terms
    of accuracy and generalization capabilities.


    LIBs, most appropriate problem is the monitoring and measurement of the amount
    of charge remaining as their fuel powertrains do not face such issues since the
    electronic instrument directly. Measurement of the state of charge is essential
    for the energy management of EVs. The SOC is the level of charge of any battery
    to its capacity. It authorizes a vehicle to accelerate with electric motors by
    using energy. At the same time, the engine works as a generator to recharge the
    battery to the minimum level needed for such.


    State of batteries needs rigorous research for operational management, life cycle
    cost, extension of reliability and safe operation. It is seen that due to time-dependent
    and non-linear characteristics of the vehicle and current signals, the SOC is
    affected by various parameters such as operating conditions, temperature, and
    driving loads. There has been a lot of research on SOC estimation from past years.
    The literature category focuses on three methods: ampere-based, lookup table-based
    method, and filter-based estimation methods. Each method is well suited for laboratory
    environment estimation. It works when the maximum capacity of the battery is known,
    and can be measured. The lookup is a function of the SOC that calculates the battery''s
    block value. To estimate the SOC, charging and discharging are measured with respect
    to time. Model-based methods incorporate complex mathematical equations of the
    battery by building history. Model-free is the data-driven method that is used
    when the mathematical model of battery is unknown. This method estimates the battery''s
    internal states directly from the data of battery, voltage, and temperature. To
