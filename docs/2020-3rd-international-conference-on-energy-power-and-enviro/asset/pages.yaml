    # IV. CONCLUSION


    This article proposed a residual based six-level wavelet decomposition model for
    SOC estimation by analyzing ConvLSTM considering temperature, voltage and current
    input features along with the measured actual SOC through experiments in laboratory.
    To validate the accuracy of the proposed method, metrics, MAPE, MAE and RMSE were
    used with publicly available datasets during real time battery experiments. Comparing
    with other methods shows that the proposed method is better in terms of estimation
    accuracy. Also, it shows that at sub-level, the number of epochs was significantly
    reduced compared to other of the art methods. The authors have planned to extend
    the work by incorporating the influence of different ambient temperature'
