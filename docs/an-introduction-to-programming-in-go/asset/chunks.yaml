    \ to the list using `PushBack`. We loop over each item in the list by getting\
    \ the first element, and following all the links until we reach nil.\n\n#### Sort\n\
    \nThe sort package contains functions for sorting arbitrary data. There are several\
    \ predefined sorting functions (for slices of ints and floats) Here's an example\
    \ for how to sort your own data:\n\n```\npackage main\n\nimport (\"fmt\" ; \"\
