  trans: "\n\n对于 Windows 系统，安装程序将安装 `Scite` 文本编辑器。你可以通过点击开始 → 所有程序 → Go → `Scite`\
    \ 来打开它。你会看到类似的内容：\n\n![](img/00006.jpeg)\n\n文本编辑器包含一个较大的白色文本区域，可以在其中输入文本。在该文本区域的左侧可以看到行号。窗口底部是状态栏，显示有关文件的信息以及你在文件中的当前位置（现在显示我们在第\
    \ 1 行第 1 列，正在正常插入文本，并且使用的是 Windows 风格的换行符）。\n\n你可以通过“文件 → 打开”并浏览你想要的文件打开文件。可以通过“文件\
    \ → 保存”或“文件 → 另存为”保存文件。\n\n在文本编辑器中工作时，学习快捷键非常有用。菜单的右侧列出了相应的快捷键。以下是最常用的几个：\n\n\
    - `Ctrl + S` – 保存当前文件\n- `Ctrl + X` – 剪切当前选中文本（删除并放入剪贴板，以便稍后粘贴）\n- `Ctrl + C`\
    \ – 复制当前选中文本\n- `Ctrl + V` – 粘贴当前剪贴板中的文本\n- 使用方向键进行导航，`Home` 回到行首，`End` 回到行尾\n\
    - 使用方向键时按住 `shift`（或使用 `Home` 和 `End`）可以不使用鼠标选择文本\n- `Ctrl + F` – 调出文件查找对话框，你可以用它搜索文件内容\n\
    \n### OSX\n\n对于 OSX，安装程序会安装 `Text Wrangler` 文本编辑器：\n\n![](img/00007.jpeg)\n\n\
    与 Windows 上的 Scite 一样，Text Wrangler 包含一个输入文本的大白色区域。可以通过“文件 → 打开”打开文件。可以通过“文件 →\
    \ 保存”或“文件 → 另存为”保存文件。这里是一些实用的快捷键（Command 是 ⌘ 键）：\n\n- `Command + S` – 保存当前文件\n\
    - `Command + X` – 剪切当前选中文本（删除并放入剪贴板，以便稍后粘贴）\n- `Command + C` – 复制当前选中文本\n- `Command\
    \ + V` – 粘贴当前剪贴板中的文本\n- 使用方向键进行导航\n- `Command + F` – 调出文件查找对话框，你可以用它搜索文件内容\n\n\
    ### Go 工具\n\nGo 是一种编译型编程语言，这意味着源代码（你编写的代码）会被翻译成计算机可以理解的语言。因此，在我们编写 Go 程序之前，我们需要\
    \ Go 编译器。\n\n安装程序将自动为你设置好 Go。我们将使用该语言的第 1 版本。（更多信息可以在 [`www.golang.org`](http://www.golang.org)\
    \ 找到）\n\n让我们确保一切都运行正常。打开终端并输入以下内容：\n\n```\ngo version\n```\n\n你应该能看到以下内容：\n\n\
    ```\ngo version go1.0.2\n```\n\n你的版本号可能略有不同。如果你收到关于命令 `go` 未被识别的错误，请尝试重启电脑。\n\n\
    Go 工具套件由多个不同的命令和子命令组成。输入以下命令可以获取这些命令列表：\n\n```\ngo help\n```\n\n我们将在后续章节中介绍如何使用它们。\n\
    \n## 你的第一个程序\n\n传统上，你在任何编程语言中编写的第一个程序被称为“Hello World”程序——一个简单地向你的终端输出 `Hello World`\
    \ 的程序。让我们用 Go 写一个。\n\n首先，创建一个新文件夹来存储我们的程序。你在第 1 章中使用的安装程序在你的主目录下创建名为 `Go` 的文件夹。创建一个名为\
    \ `~/Go/src/golang-book/chapter2` 的文件夹（其中 `~` 表示你的主目录）。在终端中你可以通过输入以下命令来实现：\n\n\
    ```\nmkdir Go/src/golang-book\nmkdir Go/src/golang-book/chapter2\n```\n\n使用你的文本编辑器输入以下内容：\n\
    \n```go\npackage main\n\nimport \"fmt\"\n\n// 这是一个注释\n\nfunc main() {\n    fmt.Println(\"\
    Hello World\")\n}\n```\n\n确保你的文件与此处显示的完全一致，并将其保存为 `main.go` 到我们刚刚创建的文件夹中。打开一个新终端并输入以下内容：\n\
    \n```\ncd Go/src/golang-book/chapter2\ngo run main.go\n```\n\n你应该能在终端中看到显示 `Hello\
    \ World`。`go run` 命令会获取随后的文件（用空格分隔），将它们编译为保存存在临时目录中的可执行文件，然后运行程序。如果你没有看到显示 `Hello\
    \ World`，可能是你在输入程序时出了错。Go 编译器会给出关于错误所在位置的提示。像大多数编译器一样，Go 编译器极其严谨，对错误零容忍。\n\n###\
    \ 如何阅读 Go 程序\n\n让我们更详细地查看这个程序。Go 程序是从上到下、从左到右读取的（像书一样）。第一行写道：\n\n```\npackage\
    \ main\n```\n\n这被称为“包声明”。每个 Go 程序都必须以包声明开始。包是 Go 组织和重用代码的方式。Go 程序有两种类型：可执行文件和库。可执行应用程序我们可以直接从终端运行的程序类型（在\
    \ Windows 中它们以 `.exe` 结尾）。库是我们打包在一起的代码集合，以便在其他程序中使用它们。我们稍后会详细探讨库，现在只需确保在你编写的程序中包含这一行。\n\
    \n下一行是一个空行。换行符、空格和制表符被称为空白字符（因为你看不见它们）。Go 并不关心空白字符，你可以删除这一行。\n\n然后我们看到了：\n\n```\n\
    import \"fmt\"\n```\n\n`import` 关键字是我们引入其他包代码的方式。`fmt` 包（format 的缩写）实现了输入输出格式。根据我们刚刚学到的关于包的知识，你认为\
    \ `fmt` 包的文件顶部会包含什么？\n\n注意上面的 `fmt` 被双引号包围。这种双引号的使用被称为“字符串字面量”，它是“表达式”的一种类型。在\
    \ Go 中，字符串表示固定长度的字符序列（字母、数字、符号等）。字符串将在下一章中详细描述，但现在要记住的关键是，一个起始 `\"` 字符最终会被另一个\
    \ `\"` 字符跟随，两者之间的内容都包含在字符串中。（`\"` 字符本身不是字符串的一部分）\n\n以 `//` 开头的行是注释。注释会被 Go 编译器忽略，是为了你自己（或任何获取你程序源码的人）。Go\
    \ 支持两种不同的注释样式：`//` 注释（`//` 到行尾之间的所有文本都是注释）以及 `/* */` 注释（`*` 之间的所有内容都是注释，并且可以包含多行）。\n\
    \n之后你看到了函数声明：\n\n```go\nfunc main() {\n    fmt.Println(\"Hello World\")\n}\n```\n\
    \n函数是 Go 程序的构建块。它们有输入、输出和一组按顺序执行的语句。所有函数都以 `func` 关键字开头，后面是函数名（在本例中为 `main`）、括号包围的零或多个“参数”、可选的返回类型以及花括号包围的“函数体”。这个函数没有参数，没有返回值，只有一条语句。`main`\
    \ 这个名字是特殊的，因为它是执行程序时被调用的函数。\n\n我们程序的最后一部分是这一行：\n\n```go\n    fmt.Println(\"Hello\
    \ World\")\n```\n\n"
- fmt: "\nThis statement is made of three components. First we access another function\
    \ inside of the `fmt` package called `Println` (that's the `fmt.Println` piece,\
    \ `Println` means Print Line). Then we create a new string that contains `Hello\
    \ World` and invoke (also known as call or execute) that function with the string\
    \ as the first and only argument.\n\nAt this point we've already seen a lot of\
    \ new terminology and you may be a bit overwhelmed. Sometimes its helpful to deliberately\
    \ read your program out loud. One reading of the program we just wrote might go\
    \ like this:\n\nCreate a new executable program, which references the `fmt` library\
    \ and contains one function called `main`. That function takes no arguments, doesn't\
    \ return anything and does the following: Access the `Println` function contained\
    \ inside of the `fmt` package and invoke it using one argument – the string `Hello\
    \ World`.\n\nThe `Println` function does the real work in this program. You can\
    \ find out more about it by typing the following in your terminal:\n\n```\ngodoc\
    \ fmt Println\n```\n\nAmong other things you should see this:\n\n```\nPrintln\
    \ formats using the default formats for its operands and writes to standard output.\
    \ Spaces are always added between operands and a newline is appended. It returns\
    \ the number of bytes written and any write error encountered.\n```\n\nGo is a\
    \ very well documented programming language but this documentation can be difficult\
    \ to understand unless you are already familiar with programming languages. Nevertheless\
    \ the `godoc` command is extremely useful and a good place to start whenever you\
    \ have a question.\n\nBack to the function at hand, this documentation is telling\
    \ you that the `Println` function will send whatever you give to it to standard\
    \ output – a name for the output of the terminal you are working in. This function\
    \ is what causes `Hello World` to be displayed.\n\nIn the next chapter we will\
    \ explore how Go stores and represents things like `Hello World` by learning about\
    \ types.\n\n### Problems\n\n- What is whitespace?\n- What is a comment? What are\
    \ the two ways of writing a comment?\n- Our program began with `package main`.\
    \ What would the files in the `fmt` package begin with?\n- We used the `Println`\
    \ function defined in the `fmt` package. If we wanted to use the `Exit` function\
    \ from the `os` package what would we need to do?\n- Modify the program we wrote\
    \ so that instead of printing `Hello World` it prints `Hello, my name is` followed\
    \ by your name.\n\n## Types\n\nIn the last chapter we used the data type `string`\
    \ to store `Hello World`. Data types categorize a set of related values, describe\
    \ the operations that can be done on them and define the way they are stored.\
    \ Since types can be a difficult concept to grasp we will look at them from a\
    \ couple different perspectives before we see how they are implemented in Go.\n\
    \nPhilosophers sometimes make a distinction between types and tokens. For example\
    \ suppose you have a dog named Max. Max is the token (a particular instance or\
    \ member) and dog is the type (the general concept). “Dog” or “dogness” describes\
    \ a set of properties that all dogs have in common. Although oversimplistic we\
    \ might reason like this: All dogs have 4 legs, Max is a dog, therefore Max has\
    \ 4 legs. Types in programming languages work in a similar way: All strings have\
    \ a length, `x` is a string, therefore `x` has a length.\n\nIn mathematics we\
    \ often talk about sets. For example: ℝ (the set of all real numbers) or ℕ (the\
    \ set of all natural numbers). Each member of these sets shares properties with\
    \ all the other members of the set. For example all natural numbers are associative:\
    \ “for all natural numbers `a`, `b`, and `c`, `a + (b + c) = (a + b) + c` and\
    \ `a × (b × c) = (a × b) × c.” In this way sets are similar to types in programming\
    \ languages since all the values of a particular type share certain properties.\n\
    \nGo is a statically typed programming language. This means that variables always\
    \ have a specific type and that type cannot change. Static typing may seem cumbersome\
    \ at first. You'll spend a large amount of your time just trying to fix your program\
    \ so that it finally compiles. But types help us reason about what our program\
    \ is doing and catch a wide variety of common mistakes.\n\nGo comes with several\
    \ built-in data types which we will now look at in more detail.\n\n### Numbers\n\
    \nGo has several different types to represent numbers. Generally we split numbers\
    \ into two different kinds: integers and floating-point numbers.\n\n### Integers\n\
    \nIntegers – like their mathematical counterpart – are numbers without a decimal\
    \ component. (…, -3, -2, -1, 0, 1, …) Unlike the base-10 decimal system we use\
    \ to represent numbers, computers use a base-2 binary system.\n\nOur system is\
    \ made up of 10 different digits. Once we've exhausted our available digits we\
    \ represent larger numbers by using 2 (then 3, 4, 5, …) digits put next to each\
    \ other. For example the number after 9 is 10, the number after 99 is 100 and\
    \ so on. Computers do the same, but they only have 2 digits instead of 10. So\
    \ counting looks like this: 0, 1, 10, 11, 100, 101, 110, 111 and so on. The other\
    \ difference between the number system we use and the one computers use is that\
    \ all of the integer types have a definite size. They only have room for a certain\
    \ number of digits. So a 4 bit integer might look like this: 0000, 0001, 0010,\
    \ 0011, 0100. Eventually we run out of space.\n\nGo's integer types are: `uint`,\
    \ `uint16`, `uint32`, `uint64`, `int8`, `int16`, `int32`, `int64`. There are also\
    \ machine dependent integer types: `uint`, `int` and `uintptr`. They are machine\
    \ dependent because their size depends on the architecture you are using.\n\n\
    Unsigned integers only contain positive numbers (or zero). In addition there two\
    \ alias types: `byte` which is the same as `uint8` and `rune` which is the same\
    \ as `int32`. `uint` means “unsigned integer” while `int` means “signed integer\n\
    \nGenerally if you are working with integers you should just use the `int` type.\n\
    \n### Floating Point Numbers\n\nFloating point numbers are numbers that contain\
    \ a decimal component (real numbers). (1.234, 123.4, 0.0001234) Their actual representation\
    \ on a computer is fairly complicated and not really necessary in order to know\
    \ how to use them. So for now we need only keep the following:\n\n- Floating point\
    \ numbers are inexact. Occasionally it is not possible to represent a number.\
    \ For example computing `1.01 - 0.99` results in `0.02000000000000018` – A number\
    \ extremely close to what we would expect, but not exactly the same.\n- Like integers\
    \ floating point numbers have a certain size (32 bit or 64 bit). Using a larger\
    \ sized floating point number increases its precision (how many digits it can\
    \ represent).\n- In addition to numbers there are several other values which can\
    \ be represented: “not a number” (`NaN`, for things like `0/0`) and positive and\
    \ negative infinity (`+∞` and `−∞`).\n\nGo has two floating point types: `float32`\
    \ and `float64` (also often referred to as single precision and double precision\
    \ respectively) as well as two additional types for representing complex numbers\
    \ (numbers with imaginary parts): `complex64` and `complex128`. Generally we should\
    \ stick with `float64` when working with floating point numbers.\n\n#### Example\n\
    \nLet's write an example program using numbers. First create a folder called `chapter3`\
    \ and make a `main.go` file containing the following:\n\n```\npackage main\n\n\
    import \"fmt\"\n\nfunc main() {\n    fmt.Println(\"1 + 1 =\", 1 + 1)\n}\n```\n\
    \nIf you run the program and you should see this:\n\n```\n$ go run main.go\n1\
    \ + 1 = 2\n```\n"
