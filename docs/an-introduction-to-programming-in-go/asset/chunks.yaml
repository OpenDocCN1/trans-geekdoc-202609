    \ 函数，寻找 `float64` 切片中的最小值和最大值。\n\n*   你会如何为第 3 步创建的函数编写文档？\n\n## 测试\n\n编程并不是容易的；即使是最好的程序员也无法编写出每次都完全按照预期运行的程序。因此，测试是软件开发过程的重要部分。为我们的代码编写测试是确保质量和提高可靠性的良好方法。\n\
    \nGo 包含了一个让编写测试变得特殊的程序，让我们为上一章创建的包创建一些测试。在 `chapter11` 的 `math` 文件夹中，创建一个名为 `math_test.go`\
    \ 的文件，内容如下：\n\n```\npackage math\n\nimport \"testing\"\n\nfunc TestAverage(t *testing.T)\
    \ {\n    var v float64\n    v = Average([]float64{1,2})\n    if v != 1.5 {\n \
    \       t.Error(\"Expected 1.5, got \", v)\n    }\n}\n```\n\n现在运行此命令：\n\n```\n\
    go test\n```\n\n你应该看到：\n\n```\n$ go test\nPASS\nok      golang-book/chapter11/math\
    \      0.032s\n```\n\n`go test` 命令将查找当前文件夹中任何文件的任何测试并运行它们。测试通过以单词 `Test` 开头的函数并接受一个类型为\
    \ `*testing.T` 的参数来识别。在我们案例中，由于我们正在测试 `Average` 函数，因此我们将测试函数命名为 `TestAverage`。\n\
    \n一旦设置好测试函数，我们就编写使用被测试代码的测试。在这种情况下，我们知道 `[1,2]` 的平均值应该是 `1.5`，所以我们检查这一点。\n\n```\n\
    package math\n\nimport \"testing\"\n\ntype testpair struct {\n    values []float64\n\
    \    average float64\n}\n\nvar tests = []testpair{\n    {[]float64{1,2}, 1.5},\n\
    }\n\nfunc TestAverage(t *testing.T) {\n    for _, pair := range tests {\n    \
    \    v := Average(pair.values)\n        if v != pair.average {\n            t.Error(\n\
    \                \"For %v, expected %v, got %v\",\n                pair.values,\n\
    \                pair.average,\n                v,\n            )\n        }\n\
    \    }\n}\n```\n\n## 练习\n\n*   编写良好的测试套并不总是容易。\n*   传递空列表 `[]float64{}` 会发生什么？\n\
    *   为你上一章编写的 `Min` 和 `Max` 函数编写系列测试。\n\n## 核心包\n\n与其从零开始编写，现实世界的编程依赖于连接现有库。本章将查看一些常用的包。\n\
    \n首先警告：尽管这些库显而易见（或在之前的章节中解释过），但 Go 包含许多库需要专业的领域知识（例如：密码学）。解释这些底层技术超出了本书的范围。\n\n\
    ### 字符串\n\nGo 在 `strings` 包中包含了大量处理字符串的函数：\n\n```\npackage main\n\nimport (\n\
    \    \"fmt\"\n    \"strings\"\n)\n\nfunc main() {\n    fmt.Println(    \n    \
    \    // true\n        strings.Contains(\"test\", \"es\"), \n\n        // 2\n \
    \       strings.Count(\"test\", \"t\"),\n\n        // true\n        strings.HasPrefix(\"\
    test\", \"te\"), \n\n        // true\n        strings.HasSuffix(\"test\", \"st\"\
    ), \n\n        // 1\n        strings.Index(\"test\", \"e\"),\n\n        // \"\
    a-b\"\n        strings.Join([]string{\"a\",\"b\"}, \"-\"),\n\n        // \"aaaaa\"\
    \n        strings.Repeat(\"a\", 5), \n\n        // \"bbaa\"\n        strings.Replace(\"\
    aaaa\", \"a\", \"b\", 2),\n\n        // []string{\"a\",\"b\",\"c\",\"d\",\"e\"\
    }\n        strings.Split(\"a-b-c-d-e\", \"-\"), \n\n        // \"test\"\n    \
    \    strings.ToLower(\"TEST\"), \n\n        // \"TEST\"\n        strings.ToUpper(\"\
    TEST\"), \n\n    )\n}\n```\n\n有时我们需要将字符串作为二进制数据处理。要将字符串转换为字节切片（反之），请这样做：\n\n```\n\
    arr := []byte(\"test\")\nstr := string([]byte{'t','e','s','t'})\n```\n\n### 输入\
    \ / 输出\n"
- fmt: "\nBefore we look at files we need to understand Go's `io` package. The `io`\
    \ package consists of a few functions, but mostly interfaces used in other packages.\
    \ The two main interfaces are `Reader` and `Writer`. `Reader`s support reading\
    \ via the `Read` method. `Writer`s support writing via the `Write` method. Many\
    \ functions in Go take `Reader`s or `Writer`s as arguments. For example the `io`\
    \ package has a `Copy` function which copies data from a `Reader` to a `Writer`:\n\
    \n```\nfunc Copy(dst Writer, src Reader) (written int64, err error)\n```\n\nTo\
    \ read or write to a `[]byte` or a `string` you can use the `Buffer` struct found\
    \ in the `bytes` package:\n\n```\nvar buf bytes.Buffer\nbuf.Write([]byte(\"test\"\
    ))\n```\n\nA `Buffer` doesn't have to be initialized and supports both the `Reader`\
    \ and `Writer` interfaces. You can convert it into a `[]byte` by calling `buf.Bytes()`.\
    \ If you only need to read from a string you can also use the `strings.NewReader`\
    \ function which is more efficient than using a buffer.\n\n### Files & Folders\n\
    \nTo open a file in Go use the `Open` function from the `os` package. Here is\
    \ an example of how to read the contents of a file and display them on the terminal:\n\
    \n```\npackage main\n\nimport (\n    \"fmt\"\n    \"os\"\n)\n\nfunc main() {\n\
    \    file, err := os.Open(\"test.txt\")\n    if err != nil {\n        // handle\
    \ the error here\n        return\n    }\n    defer file.Close()\n    \n    //\
    \ get the file size\n    stat, err := file.Stat()\n    if err != nil {\n     \
    \   return\n    }\n    // read the file\n    bs := make([]byte, stat.Size())\n\
    \    _, err = file.Read(bs)\n    if err != nil {\n        return\n    }\n\n  \
    \  str := string(bs)\n    fmt.Println(str)\n}\n```\n\nWe use `defer file.Close()`\
    \ right after opening the file to make sure the file is closed as soon as the\
    \ function completes. Reading files is very common, so there's a shorter way to\
    \ do this:\n\n```\npackage main\n\nimport (\n    \"fmt\"\n    \"io/ioutil\"\n\
    )\n\nfunc main() {\n    bs, err := ioutil.ReadFile(\"test.txt\")\n    if err !=\
    \ nil {\n        return\n    }\n    str := string(bs)\n    fmt.Println(str)\n\
    }\n```\n\nHere is how we can create a file:\n\n```go\npackage main\n\nimport (\n\
    \    \"os\"\n)\n\nfunc main() {\n    file, err := os.Create(\"test.txt\")\n  \
    \  if err != nil {\n        // handle the error here\n        return\n    }\n\
    \    defer file.Close()\n\n    file.WriteString(\"test\")\n}\n```\n\nTo get the\
    \ contents of a directory we use the same `os.Open` function but give it a directory\
    \ path instead of a file name. Then we call the `Readdir` method:\n\n```go\npackage\
    \ main\n\nimport (\n    \"fmt\"\n    \"os\"\n)\n\nfunc main() {\n    dir, err\
    \ := os.Open(\".\")\n    if err != nil {\n        return\n    }\n    defer dir.Close()\n\
    \n    fileInfos, err := dir.Readdir(-1)\n    if err != nil {\n        return\n\
    \    }\n    for _, fi := range fileInfos {\n        fmt.Println(fi.Name())\n \
    \   }\n}\n```\n\nOften we want to recursively walk a folder (read the folder's\
    \ contents, all the sub-folders, all the sub-sub-folders, …). To make this easier\
    \ there's a `Walk` function provided in the `path/filepath` package:\n\n```go\n\
    package main\n\nimport (\n    \"fmt\"\n    \"os\"\n    \"path/filepath\"\n)\n\n\
    func main() {\n    filepath.Walk(\".\", func(path string, info os.FileInfo, err\
    \ error) error {\n        fmt.Println(path)\n        return nil\n    })\n}\n```\n\
    \nThe function you pass to `Walk` is called for every file and folder in the root\
    \ folder. (in this case `.`).\n\n### Errors\n\nGo has a built-in type for errors\
    \ that we have already seen (the `error` type). We can create our own errors by\
    \ using the `New` function in the `errors` package:\n\n```go\npackage main\n\n\
    import \"errors\"\n\nfunc main() {\n    err := errors.New(\"error message\")\n\
    }\n```\n\n### Containers & Sort\n\nIn addition to lists and maps Go has several\
    \ more collections available underneath the container package. We'll take a look\
    \ at the `container/list` package as an example.\n\n#### List\n\nThe `container/list`\
    \ package implements a doubly-linked list. A linked list is a type of data structure\
    \ that looks like this:\n\n![](images/00011.jpeg)\nEach node of the list contains\
    \ a value (1, 2, or 3 in this case) and a pointer to the next node. Since this\
    \ is a doubly-linked list each node will also have pointers to the previous node.\
    \ This list could be created by this program:\n\n```go\npackage main\n\nimport\
    \ (\"fmt\" ; \"container/list\")\n\nfunc main() {\n    var x list.List\n    x.PushBack(1)\n\
    \    x.PushBack(2)\n    x.PushBack(3)\n\n    for e := x.Front(); e != nil; e =\
    \ e.Next() {\n        fmt.Println(e.Value)\n    }\n}\n```\n\nThe `Buffer` doesn't\
    \ have to be initialized and supports both the `Reader` and `Writer` interfaces.\
    \ You can convert it into a `[]byte` by calling `buf.Bytes()`. If you only need\
    \ to read from a string you can also use the `strings.NewReader` function which\
    \ is more efficient than using a buffer.\n"
