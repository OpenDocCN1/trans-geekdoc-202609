- fmt: "\nA function like this together with the non-local variables it references\
    \ is known as a closure. In this case `increment` and the variable `x` form the\
    \ closure.\n\nOne way to use closure is by writing a function which returns another\
    \ function which – when called – can generate a sequence of numbers. For example\
    \ here's how we might generate all the even numbers:\n\n```\nfunc makeEvenGenerator()\
    \ func() uint {\n    i := uint(0)\n    return func() (ret uint) {\n        ret\
    \ = i\n        i += 2\n        return\n    }\n}\nfunc main() {\n    nextEven :=\
    \ makeEvenGenerator()\n    fmt.Println(nextEven()) // 0\n    fmt.Println(nextEven())\
    \ // 2\n    fmt.Println(nextEven()) // 4\n}\n```\n\n`makeEvenGenerator` returns\
    \ a function which generates even numbers. Each time it's called it adds 2 to\
    \ the local `i` variable which – unlike normal local variables – persists between\
    \ calls.\n\n### Recursion\n\nFinally a function is able to call itself. Here is\
    \ one way to compute the factorial of a number:\n\n```\nfunc factorial(x uint)\
    \ uint {\n    if x == 0 {\n        return 1\n    }\n\n    return x * factorial(x-1)\n\
    }\n```\n\n`factorial` calls itself, which is what makes this function recursive.\
    \ In order to better understand how this function works, lets walk through `factorial(2)`:\n\
    \n*   Is `x == 0`? No. (`x` is 2)\n*   Find the factorial of `x – 1`\n    *  \
    \ Is `x == 0`? No. (`x` is 1)\n    *   Find the `factorial` of `x – 1`\n     \
    \   *   Is `x == 0`? Yes, return 1.\n    *   return `1 * 1`\n*   return `2 * 1`\n\
    \nClosure and recursion are powerful programming techniques which form the basis\
    \ of a paradigm known as functional programming. Most people will find functional\
    \ programming more difficult to understand than an approach based on for loops,\
