    \ perimeter of a shape. Implement the method for `Circle` and `Rectangle`.\n\n\
    ## Concurrency\n\nLarge programs are often made up of many smaller sub-programs.\
    \ For example a web server handles requests made from web browsers and serves\
    \ up HTML web pages in response. Each request is handled like a small program.\n\
    \nIt would be ideal for programs like these to be able to run their smaller components\
    \ at the same time (in the case of the web server to handle multiple requests).\
    \ Making progress on more than one task simultaneously is known as concurrency.\
    \ Go has rich support for concurrency using goroutines and channels.\n\n### Goroutines\n\
    \nA goroutine is a function that is capable of running concurrently with other\
    \ functions. To create a goroutine we use the keyword `go` followed by a function\
    \ invocation:\n\n```\npackage main\n\nimport \"fmt\"\n\nfunc f(n int) {\n    for\
    \ i := 0; i < 10; i++ {\n        fmt.Println(n, \":\", i)\n    }\n}\n\nfunc main()\
    \ {\n    go f(0)\n    var input string\n    fmt.Scanln(&input)\n}\n```"
