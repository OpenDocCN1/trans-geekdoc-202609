    ## Getting Started


    Computer programming is the art, craft and science of writing programs which define
    how computers operate. This book will teach you how to write computer programs
    using a programming language designed by Google named `Go`.


    `Go` is a general purpose programming language with advanced features and a clean
    syntax. Because of its wide availability on a variety of platforms, its robust
    well-documented common library, and its focus on good software engineering principles,
    `Go` is an ideal language to learn as your first programming language.


    The process we use to write software using `Go` (and most programming languages)
    is fairly straightforward:


    * Gather requirements

    * Find a solution

    * Write source code to implement the solution

    * Compile the source code into an executable

    * Run and test the program to make sure it works


    This process is iterative (meaning its done many times) and the steps usually
    overlap. But before we write our first program in `Go` there are a few prerequisite
    concepts we need to understand.


    ### Files and Folders


    A file is a collection of data stored as a unit with a name. Modern operating
    systems (like `Windows` or `Mac OSX`) contain millions of files which store a
    large variety of different types of information – everything from text documents
    to executable programs to multimedia files.


    All files are stored in the same way on a computer: they all have a name, a definite
    size (measured in bytes) and an associated type. Typically the file''s type is
    signified by the extension. Folders are collections of files used to organize
    them.


    In `Windows`, paths are separated by `\`, while in `OSX` they are separated by
    `/`. For example, a file might be located at `/Users/name/documents/file.txt`
    or `C:\Users\name\Documents\file.txt`.


    #### Windows

    To navigate through directories in `Windows`, you use the `cd` command. To see
    the contents of a directory, use `dir`.

