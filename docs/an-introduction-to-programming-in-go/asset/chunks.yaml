    [http://golang.org/src/pkg/]


    # 动手实践


    磨练技能的最佳方法之一就是练习编程。有很多方法可以实现：你可以解决来自 Project Euler ([`projecteuler.net/`](http://projecteuler.net/))
    等网站的挑战性编程问题，或者尝试做一个更大的项目。也许可以尝试实现一个 Web 服务器或编写一个简单的游戏。


    # 团队协作


    大多数现实世界的软件项目都是由团队完成的，因此学习如何在团队中工作至关重要。如果可以的话，找一个朋友（也许是同学）一起合作一个项目。学习如何将一个项目拆分成你们可以同时处理的部分。


    另一个选项是参与开源项目。找一个第三方库，编写一些代码（修复修复 bug），并将其提交给维护者。Go 拥有一个不断发展的社区，可以通过邮件列表 ([`groups.google.com/group/golang-nuts`](http://groups.google.com/group/golang-nuts))
    与其联系。

