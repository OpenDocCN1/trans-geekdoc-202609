- fmt: "\nThis program consists of two goroutines. The first goroutine is implicit\
    \ and is the main function itself. The second goroutine is created when we call\
    \ `go f(0)`. Normally when we invoke a function our program will execute all the\
    \ statements in a function and then return to the next line following the invocation.\
    \ With a goroutine we return immediately to the next line and don't wait for the\
    \ function to complete. This is why the call to the `Scanln` function has been\
    \ included; without it the program would exit before being given the opportunity\
    \ to print all the numbers.\n\nGoroutines are lightweight and we can easily create\
    \ thousands of them. We can modify our program to run 10 goroutines by doing this:\n\
    \n```\nfunc main() {\n    for i := 0; i < 10; i++ {\n        go f(i)\n    }\n\
    \    var input string\n    fmt.Scanln(&input)\n}\n```\n\nYou may have noticed\
    \ that when you run this program it seems to run the goroutines in order rather\
    \ than simultaneously. Let's add some delay to the function using `time.Sleep`\
    \ and `rand.Intn`:\n\n```\npackage main\n\nimport (\n    \"fmt\"\n    \"time\"\
    \n    \"math/rand\"\n)\n\nfunc f(n int) {\n    for i := 0; i < 10; i++ {\n   \
    \     fmt.Println(n, \":\", i)\n        amt := time.Duration(rand.Intn(250))\n\
    \        time.Sleep(time.Millisecond * amt)\n    }\n}\nfunc main() {\n    for\
    \ i := 0; i < 10; i++ {\n        go f(i)\n    }\n    var input string\n    fmt.Scanln(&input)\n\
    }\n```\n\n`f` prints out the numbers from 0 to 10, waiting between 0 and 250 ms\
    \ after each one. The goroutines should now run simultaneously.\n\n### Channels\n\
    \nChannels provide a way for two goroutines to communicate with one another and\
    \ synchronize their execution. Here is an example program using channels:\n\n\
    ```\npackage main\n\nimport (\n    \"fmt\"\n    \"time\"\n)\n\nfunc pinger(c chan\
    \ string) {\n    for i := 0; ; i++ {\n        c <- \"ping\"\n    }\n}\nfunc printer(c\
    \ chan string) {\n    for {\n        msg := <- c\n        fmt.Println(msg)\n \
    \       time.Sleep(time.Second * 1)\n    }\n}\nfunc main() {\n    var c chan string\
    \ = make(chan string)\n    \n    go pinger(c)\n    go printer(c)\n    \n    var\
    \ input string\n    fmt.Scanln(&input)\n}\n```\n\nThis program will print “ping”\
    \ forever (hit enter to stop it). A channel type is represented with the keyword\
    \ `chan` followed by the type of the things that are passed on the channel (in\
    \ this case we are passing strings). The `<-` (left arrow) operator is used to\
    \ send and receive messages on the channel. `c <- \"ping\"` means send `\"ping\"\
    `. `msg := <- c` means receive a message and store it in `msg`. The `fmt` line\
    \ could also have been written like this: `fmt.Println(<-c)` in which case we\
    \ could remove previous line.\n\nUsing a channel like this synchronizes the two\
    \ goroutines. When `pinger` attempts to send a message on the channel it will\
    \ wait until `printer` is ready to receive the message (this is known as blocking).\
    \ Let's add another sender to the program and see what happens.\n\n```\nfunc ponger(c\
    \ chan string) {\n    for i := 0; ; i++ {\n        c <- \"pong\"\n    }\n}\n```\n\
    \nAnd modify `main`:\n\n```\nfunc main() {\n    var c chan string = make(chan\
    \ string)\n    \n    go pinger(c)\n    go ponger(c)\n    go printer(c)\n    \n\
    \    var input string\n    fmt.Scanln(&input)\n}\n```\n\nThe program will now\
    \ take turns printing “ping” and “pong”.\n\n#### Channel Direction\n\nWe can specify\
    \ a direction on a channel type thus restricting it to either sending or receiving.\
    \ For example `pinger`'s function signature can be changed to this:\n\n```\nfunc\
    \ pinger(c chan<- string)\n```\n\nNow `c` can only be sent to. Attempting to receive\
    \ from `c` will result in a compiler error. Similarly we can change `printer`\
    \ to this:\n\n```go\nfunc printer(c <-chan string)\n```\n\nA channel that doesn't\
    \ have these restrictions is known as bi-directional. A bi-directional channel\
    \ can be passed to a function that takes send-only or receive-only channels, but\
    \ the reverse is not true.\n\n#### Select\n\nGo has a special statement called\
    \ `select` which works like `switch` but for channels:\n\n```\nfunc main() {\n\
    \    c1 := make(chan string)\n    c2 := make(chan string)\n    \n    go func()\
    \ {\n        for {\n            c1 <- \"from 1\"\n            time.Sleep(time.Second\
    \ * 2)\n        }\n    }()\n    go func() {\n        for {\n            c2 <-\
    \ \"from 2\"\n            time.Sleep(time.Second * 3)\n        }\n    }()\n  \
    \  go func() {\n        for {\n            select {\n            case msg1 :=\
    \ <- c1:\n                fmt.Println(msg1)\n            case msg2 := <- c2:\n\
    \                fmt.Println(msg2)\n            }\n        }\n    }()\n    \n\
    \    var input string\n    fmt.Scanln(&input)\n}\n```\n\nThis program prints “from\
    \ 1” every 2 seconds and “from 2” every 3 seconds. `select` picks the first channel\
    \ that is ready and receives from it (or sends to it). If more than one of the\
    \ channels are ready then it randomly picks one. If none of the channels are ready,\
    \ the statement blocks until one becomes available.\n\nThe `select` statement\
    \ is often used to implement a timeout:\n\n```\nselect {\ncase msg1 := <- c1:\n\
    \    fmt.Println(\"Message 1\", msg1)\ncase msg2 := <- c2:\n    fmt.Println(\"\
    Message 2\", msg2)\ncase <- time.After(time.Second):\n    fmt.Println(\"timeout\"\
    )\n}\n```\n\n`time.After` creates a channel and after the given duration will\
    \ send the current time on it (we weren't interested in the time so we didn't\
    \ store it in a variable). We can also specify a `default` case:\n\n```\nselect\
    \ {\ncase msg1 := <- c1:\n    fmt.Println(\"Message 1\", msg1)\ncase msg2 := <-\
    \ c2:\n    fmt.Println(\"Message 2\", msg2)\ncase <- time.After(time.Second):\n\
    \    fmt.Println(\"timeout\")\ndefault:\n    fmt.Println(\"nothing ready\")\n\
    }\n```\n\nThe default case happens immediately if none of the channels are ready.\n\
    \n#### Buffered Channels\n\nIt's also possible to pass a second parameter to the\
    \ `make` function when creating a channel:\n\n```\nc := make(chan int, 1)\n```\n\
    \nThis creates a buffered channel with a capacity of 1. Normally channels are\
    \ synchronous; both sides of the channel will wait until the other side is ready.\
    \ A buffered channel is asynchronous; sending or receiving a message will not\
