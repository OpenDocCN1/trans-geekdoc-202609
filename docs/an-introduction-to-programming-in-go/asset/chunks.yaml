  trans: "\n像这样的函数加上它引用的非局部变量，被称为闭包（closure）。在这种情况下，`increment` 和变量 `x` 构成了闭包。\n\n\
    使用闭包的一种方法是编写一个返回另一个函数的函数，该函数在被调用时可以生成一个数字序列。例如，这里是我们可以生成所有偶数的方法：\n\n```\nfunc\
    \ makeEvenGenerator() func() uint {\n    i := uint(0)\n    return func() (ret\
    \ uint) {\n        ret = i\n        i += 2\n        return\n    }\n}\nfunc main()\
    \ {\n    nextEven := makeEvenGenerator()\n    fmt.Println(nextEven()) // 0\n \
    \   fmt.Println(nextEven()) // 2\n    fmt.Println(nextEven()) // 4\n}\n```\n\n\
    `makeEvenGenerator` 返回一个生成偶数的函数。每次调用它时，都会局部变量 `i` 加 2，与普通的局部变量不同，它在调用之间会持久存在。\n\
    \n### 递归\n\n最后，函数可以调用自己。这里是计算数字阶乘的一种方法：\n\n```\nfunc factorial(x uint) uint {\n\
    \    if x == 0 {\n        return 1\n    }\n\n    return x * factorial(x-1)\n}\n\
    ```\n\n`factorial` 调用了自己，这使得该函数是递归的。为了更好地理解这个函数是如何工作的，让我们执行一下 `factorial(2)`：\n\
    \n*   `x == 0` 吗？不是。（`x` 是 2）\n*   找到 `x – 1` 的阶乘\n    *   `x == 0` 吗？不是。（`x`\
    \ 是 1）\n    *   找到 `x – 1` 的 `factorial`\n        *   `x == 0` 吗？是的，返回 1。\n  \
    \  *   返回 `1 * 1`\n*   返回 `2 * 1`\n\n闭包和递归是强大的编程技术，是函数式编程范式的基础。大多数人会发现函数式编程比基于\
    \ `for` 循环、`if` 语句、变量和简单函数的方法难以理解。\n\n### Defer, Panic & Recover\n\nGo 有一种称为 `defer`\
    \ 的特殊语句，它可以调度函数调用以便在函数完成后运行。考虑以下示例：\n\n```go\npackage main\n\nimport \"fmt\"\n\
    \nfunc first() {\n    fmt.Println(\"1st\")\n}\nfunc second() {\n    fmt.Println(\"\
    2nd\")\n}\nfunc main() {\n    defer second()\n    first()\n}\n```\n\n该程序打印 `1st`，然后是\
    \ `2nd`。基本上 `defer` 将对 `second` 的调用移动到了函数的末尾：\n\n```go\nfunc main() {\n    first()\n\
    \    second()\n}\n```\n\n当需要以某种方式释放资源时，经常使用 `defer`。例如当我们打开一个文件时，我们需要确保稍后关闭它。使用\
    \ `defer`：\n\n```go\nf, _ := os.Open(filename)\ndefer f.Close()\n```\n\n这有 3 个优点：(1)\
    \ 它让我们的 `Close` 调用靠近 `Open` 调用，更容易理解；(2) 如果我们的函数有多个返回语句（可能一个在 `if` 中，一个在 `else`\
    \ 中），`Close` 将在它们两者之前发生；以及 (3) 即使发生了运行时 `panic`，延迟执行的函数也会运行。\n\n### Panic & Recover\n\
    \n早些时候我们创建一个调用 `panic` 函数来导致运行时错误的函数。我们可以使用内置的 `recover` 函数处理运行时 `panic`。`recover`\
    \ 会停止 `panic` 并返回传递给 `panic` 用的值。我们可能会倾向于这样使用它：\n\n```go\npackage main\n\nimport\
    \ \"fmt\"\n\nfunc main() {\n    panic(\"PANIC\")\n    str := recover()\n    fmt.Println(str)\n\
    }\n```\n\n但在这种情况下，`recover` 的调用永远不会发生，因为对 `panic` 的调用会立即停止函数的执行。相反，我们必须将其与 `defer`\
    \ 配合使用：\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    defer func()\
    \ {    \n        str := recover()\n        fmt.Println(str)\n    }()\n    panic(\"\
    PANIC\")\n}\n```\n\n`panic` 通常表示程序错误（例如尝试访问越界的数组索引、忘记初始化 map 等）或没有简单方法可以从中恢复的异常状况。（因此名为“panic”）。\n\
    \n### 习\n\n*   `sum` 是一个接收数字切片并将它们相加的函数。它在 Go 中的函数签名看起来是什么样的？\n*   编写一个函数接收一个整数并将其减半，如果是偶数则返回\
    \ true，如果是奇数则返回 false。例如 `half(1)` 应该返回 `(0, false)`，`half(2)` 应该返回 `(1, true)`。\n\
    *   编写一个带变长参数的函数，找到列表中最大的数。\n*   使用 `makeEvenGenerator` 编写一个生成奇数的 `makeOddGenerator`\
    \ 函数。\n*   斐波那契序列定义为：`fib(0) = 0`，`fib(1) = 1`，`fib(n) = fib(n-1) + fib(n-2)`。写一个可以\
    \ `fib(n)` 的递归函数。\n*   `defer`、`panic` 和 `recover` 是什么？如何从运行时 `panic` 中恢复？指针\n\
    \n当我们调用函数时，Go 按值传递所有参数。如果我们想修改变量的原始值，必须传递它的指针。考虑以下示例：\n\n```go\nfunc increment(x\
    \ *int) {\n    *x = *x + 1\n}\n\nfunc main() {\n    i := 0\n    increment(&i)\n\
    \    fmt.Println(i) // 1\n}\n```\n\n指针引用内存中的位置而不是值本身。\n\n### * 和 & 运算符\n\n在 Go\
    \ 中，指针使用 `*` 字符后跟存储值的类型来表示。当我们写下 `*x = 0` 时，我们是在说“存储在内存位置”。`*` 也用于解引用指针。解引用指针让我们访问它所指向的值。最后，我们使用\
    \ `&` 运算符找到变量的地址。`&x` 返回一个指向 `int` 的指针。这允许我们修改原始变量。\n\n### new\n\n获取指针的另一种方法是使用内置的\
    \ `new` 函数：\n\n```go\nfunc one(xPtr *int) {\n    *xPtr = 1\n}\n\nfunc main() {\n\
    \    xPtr := new(int)\n    one(xPtr)\n    fmt.Println(*xPtr) // 1\n}\n```\n\n\
    `new` 接收一个类型作为参数，分配足够该类型的内存并返回其指针。在某些编程语言中，使用 `new` 和 `&` 存在显著差异，并且即使发生了运行时 `panic`，延迟执行的函数也会运行。Go\
    \ 不是这样的，它是一种垃圾回收语言，当不再有引用它时，内存会被清理。\n\n#### 习\n\n*   如何获取变量的内存地址？\n*   如何给指针赋值？\n\
    *   如何创建一个新指针？\n*   运行此程序后 `x` 的值是多少：\n    ```go\n    func square(x *float64)\
    \ {\n        *x = *x * *x\n    }\n    func main() {\n        x := 1.5\n      \
    \  square(&x)\n    }\n    ``` 结构体与接口\n\n虽然我们可以只使用 Go 的内置数据类型来编写程序，但在某些时刻这会变得非常繁琐。考虑一个与形状交互的程序：\n"
- fmt: "\n```go\npackage main\n\nimport (\"fmt\"; \"math\")\n\nfunc distance(x1, y1,\
    \ x2, y2 float64) float64 {\n    a := x2 – x1\n    b := y2 – y1\n    return math.Sqrt(a*a\
    \ + b*b)\n}\nfunc rectangleArea(x1, y1, x2, y2 float64) float64 {\n    l := distance(x1,\
    \ y1, x1, y2)\n    w := distance(x1, y1, x2, y1)\n    return l * w\n}\nfunc circleArea(x,\
    \ y, r float64) float64 {\n    return math.Pi * r*r\n}\nfunc main() {\n    var\
    \ rx1, ry1 float64 = 0, 0\n    var rx2, ry2 float64 = 10, 10\n    var cx, cy,\
    \ cr float64 = 0, 0, 5\n\n    fmt.Println(rectangleArea(rx1, ry1, rx2, ry2))\n\
    \    fmt.Println(circleArea(cx, cy, cr))\n}\n```\n\nKeeping track of all the coordinates\
    \ makes it difficult to see what the program is doing and will likely lead to\
    \ mistakes.\n\n### Structs\n\nAn easy way to make this program better is to use\
    \ a `struct`. A `struct` is a type which contains named fields. For example we\
    \ could represent a `Circle` like this:\n\n```\ntype Circle struct {\n    x float64\n\
    \    y float64\n    r float64\n}\n```\n\nThe `type` keyword introduces a new type.\
    \ It's followed by the name of the type (`Circle`), the keyword `struct` to indicate\
    \ that we are defining a `struct` type and a list of fields inside of curly braces.\
    \ Each field has a name and a type. Like with functions we can collapse fields\
    \ that have the same type:\n\n```\ntype Circle struct {\n    x, y, r float64\n\
    }\n```\n\n#### Initialization\n\nWe can create an instance of our new `Circle`\
    \ type in a variety of ways:\n\n```\nvar c Circle\n```\n\nLike with other data\
    \ types, this will create a local `Circle` variable that is by default set to\
    \ zero. For a `struct` zero means each of the fields is set to their corresponding\
    \ zero value (`0` for `int`s, `0.0` for `float`s, `\"\"` for `string`s, `nil`\
    \ for pointers, …) We can also use the `new` function:\n\n```\nc := new(Circle)\n\
    ```\n\nThis allocates memory for all the fields, sets each of them to their zero\
    \ value and returns a pointer. (`*Circle`) More often we want to give each of\
    \ the fields a value. We can do this in two ways. Like this:\n\n```\nc := Circle{x:\
    \ 0, y: 0, r: 5}\n```\n\nOr we can leave off the field names if we know the order\
    \ they were defined:\n\n```\nc := Circle{0, 0, 5}\n```\n\n#### Fields\n\nWe can\
    \ access fields using the `.` operator:\n\n```\nfmt.Println(c.x, c.y, c.r)\nc.x\
    \ = 10\nc.y = 5\n```\n\nLet's modify the `circleArea` function so that it uses\
    \ a `Circle`:\n\n```\nfunc circleArea(c Circle) float64 {\n    return math.Pi\
    \ * c.r*c.r\n}\n```\n\nIn `main` we have:\n\n```\nc := Circle{0, 0, 5}\nfmt.Println(circleArea(c))\n\
    ```\n\nOne thing to remember is that arguments are always copied in Go. If we\
    \ attempted to modify one of the fields inside of the `circleArea` function, it\
    \ would not modify the original variable. Because of this we would typically write\
    \ the function like this:\n\n```\nfunc circleArea(c *Circle) float64 {\n    return\
    \ math.Pi * c.r*c.r\n}\n```\n\nAnd change `main`:\n\n```\nc := Circle{0, 0, 5}\n\
    fmt.Println(circleArea(&c))\n```\n\n### Methods\n\nAlthough this is better than\
    \ the first version of this code, we can improve it significantly by using a special\
    \ type of function known as a method:\n\n```\nfunc (c *Circle) area() float64\
    \ {\n    return math.Pi * c.r*c.r\n}\n```\n\nIn between the keyword `func` and\
    \ the name of the function we've added a “receiver”. The receiver is like a parameter\
