    \    h.Write([]byte(\"test\"))\n    bs := h.Sum([]byte{})\n    fmt.Println(bs)\n\
    }\n```\n\n这个示例与 `crc32` 的示例非常相似，因为 `crc32` 和 `sha1` 都实现了 `hash.Hash` 接口。主要的区别在于，`crc32`\
    \ 计算的是 32 位的哈希，而 `sha1` 计算的是 160 位的哈希。原生类型中没有表示 160 位数字的类型，因此我们使用一个 20 字节的切片来代替。\n\
    \n## Servers\n\n在 Go 中编写网络服务器非常简单。我们首先来看下如何创建一个 TCP 服务器：\n\n```go\npackage main\n\
    \nimport (\n    \"encoding/gob\"\n    \"fmt\"\n    \"net\"\n)\n\nfunc server()\
    \ {\n    // 监听一个端口\n    ln, err := net.Listen(\"tcp\", \":9999\")\n    if err\
    \ != nil {\n        fmt.Println(err)\n        return\n    }\n    for {\n     \
    \   // 接受连接\n        c, err := ln.Accept()\n        if err != nil {\n        \
    \    fmt.Println(err)\n            continue\n        }\n        // 处理连接\n    \
    \    go handleServerConnection(c)\n    }\n}\n\nfunc handleServerConnection(c net.Conn)\
    \ {\n    // 接收消息\n    var msg string\n    err := gob.NewDecoder(c).Decode(&msg)\n\
    \    if err != nil {\n        fmt.Println(err)\n    } else {\n        fmt.Println(\"\
    Received\", msg)\n    }\n    \n    c.Close()\n}\n\nfunc client() {\n    // 连接到服务器\n\
    \    c, err := net.Dial(\"tcp\", \"127.0.0.1:9999\")\n    if err != nil {\n  \
    \      fmt.Println(err)\n        return\n    }\n\n    // 发送消息\n    msg := \"Hello\
    \ World\"\n    fmt.Println(\"Sending\", msg)\n    err = gob.NewEncoder(c).Encode(msg)\n\
    \    if err != nil {\n        fmt.Println(err)\n    }\n\n    c.Close()\n}\n\n\
    func main() {\n    go server()\n    go client()\n    \n    var input string\n\
    \    fmt.Scanln(&input)\n}\n```\n\n这个示例使用了 `encoding/gob` 包，它使得 Go 值的编码变得简单，以便其他\
    \ Go 程序（在本例中是同一个 Go 程序）可以读取它们。`encoding` 目录下的其他包（如 `encoding/json`）以及第三方包也提供了额外的编码。（例如，我们可以使用\
    \ `labix.org/v2/mgo/bson` 来支持 bson ）。\n\n### HTTP\n\nHTTP 服务器的设置和使用更加简单：\n\n```go\n\
    package main\n\nimport (\"net/http\" ; \"io\")\n\nfunc hello(res http.ResponseWriter,\
    \ req *http.Request) {\n    res.Header().Set(\n        \"Content-Type\", \n  \
    \      \"text/html\",\n    )\n    io.WriteString(\n        res, \n        `<doctype\
    \ html>\n<html>\n    <head>\n        <title>Hello World</title>\n    </head>\n\
    \    <body>\n        Hello World!\n    </body>\n</html>`,\n    )\n}\nfunc main()\
    \ {\n    http.HandleFunc(\"/hello\", hello)\n    http.ListenAndServe(\":9000\"\
    , nil)\n}\n```\n\n`HandleFunc` 通过调用指定的函数来处理 URL 路由（`/hello`）。我们也可以通过使用 `FileServer`\
    \ 来处理静态文件：\n\n```go\nhttp.Handle(\n    \"/assets/\", \n    http.StripPrefix(\n\
    \        \"/assets/\", \n        http.FileServer(http.Dir(\"assets\")),\n    ),\n\
    )\n```\n\n### RPC\n\n`net/rpc`（远程过程调用）和 `net/rpc/jsonrpc` 包提供了一种简单暴露的方法，使其可以在网络上调用（而不仅仅是在运行它们的程序内部调用）。\n\
    \n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"net\"\n    \"net/rpc\"\n\
    )\n\ntype Server struct {}\nfunc (this *Server) Negate(i int64, reply *int64)\
    \ error {\n    *reply = -i\n    return nil\n}\n\nfunc server() {\n    rpc.Register(new(Server))\n\
    \    ln, err := net.Listen(\"tcp\", \":9999\")\n    if err != nil {\n        fmt.Println(err)\n\
    \        return\n    }\n    for {\n        c, err := ln.Accept()\n        if err\
    \ != nil {\n            continue\n        }\n        go rpc.ServeConn(c)\n   \
    \ }\n}\nfunc client() {\n    c, err := rpc.Dial(\"tcp\", \"127.0.0.1:9999\")\n\
    \    if err != nil {\n        fmt.Println(err)\n        return\n    }\n    var\
    \ result int64\n    err = c.Call(\"Server.Negate\", int64(999), &result)\n   \
    \ if err != nil {\n        fmt.Println(err)\n    } else {\n        fmt.Println(\"\
    Server.Negate(999) =\", result)\n    }\n}\nfunc main() {\n    go server()\n  \
    \  go client()\n    \n    var input string\n    fmt.Scanln(&input)\n}\n```\n"
