    ## Types


    在上一一章中，我们使用数据类型 `string` 来存储 `Hello World`。数据类型将一组相关值分类，描述了可以对这些值执行的操作并定义了它们的存储方式。由于类型是一个很难掌握的概念，在看到它们在
    Go 中如何实现之前，我们将从几个不同的角度来看它们。


