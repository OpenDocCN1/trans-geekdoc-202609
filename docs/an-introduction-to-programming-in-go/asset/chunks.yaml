    \n## Getting Started\n\nComputer programming is the art, craft and science of\
    \ writing programs which define how computers operate. This book will teach you\
    \ how to write computer programs using a programming language designed by Google\
    \ named Go.\n\nGo is a general purpose programming language with advanced features\
    \ and a clean syntax. Because of its wide availability on a variety of platforms,\
    \ its robust well-documented common library, and its focus on good software engineering\
    \ principles, Go is an ideal language to learn as your first programming language.\n\
    \nThe process we use to write software using Go (and most programming languages)\
    \ is fairly straightforward:\n\n*   Gather requirements\n\n*   Find a solution\n\
    \n*   Write source code to implement the solution\n\n*   Compile the source code\
    \ into an executable\n\n*   Run and test the program to make sure it works\n\n\
    This process is iterative (meaning its done many times) and the steps usually\
    \ overlap. But before we write our first program in Go there are a few prerequisite\
    \ concepts we need to understand.\n\n### Files and Folders\n\nA file is a collection\
    \ of data stored as a unit with a name. Modern operating systems (like Windows\
    \ or Mac OSX) contain millions of files which store a large variety of different\
    \ types of information – everything from text documents to executable programs\
    \ to multimedia files.\n\nAll files are stored in the same way on a computer:\
    \ they all have a name, a definite size (measured in bytes) and an associated\
    \ type. Typically the file's type is signified by the file's extension – the part\
    \ of the file name that comes after the last `.`. For example a file with the\
    \ name `hello.txt` has the extension `txt` which is used to represent textual\
    \ data.\n\nFolders (also called directories) are used to group files together.\
    \ They can also contain other folders. On Windows file and folder paths (locations)\
    \ are represented with the `\\` (backslash) character, for example: `C:\\Users\\\
    john\\example.txt`. `example.txt` is the file name, it is contained in the folder\
    \ `john`, which is itself contained in the folder `Users` which is stored on drive\
    \ `C` (which represents the primary physical hard drive in Windows). On OSX (and\
    \ most other operating systems) file and folder paths are represented with the\
    \ `/` (forward slash) character, for example: `/Users/john/example.txt`. Like\
    \ on Windows `example.txt` is the file name, it is contained in the folder `john`,\
    \ which is in the folder `Users`. Unlike Windows, OSX does not specify a drive\
    \ letter where the file is stored.\n\n#### Windows\n\nOn Windows files and folders\
    \ can be browsed using Windows Explorer (accessible by double-clicking “My Computer”\
    \ or typing win+e):\n\n![](images/00002.jpeg)\n\n#### OSX\n\nOn OSX files and\
    \ folders can be browsed using Finder (accessible by clicking the Finder icon\
    \ – the face icon in the lower left bar):\n\n![](images/00003.jpeg)\n\n### The\
    \ Terminal\n\nMost of the interactions we have with computers today are through\
    \ sophisticated graphical user interfaces (GUIs). We use keyboards, mice and touchscreens\
    \ to interact with visual buttons or other types of controls that are displayed\
    \ on a screen.\n\nIt wasn't always this way. Before the GUI we had the terminal\
    \ – a simpler textual interface to the computer where rather than manipulating\
    \ buttons on a screen we issued commands and received replies. We had a conversation\
    \ with the computer.\n\nAnd although it might appear that most of the computing\
    \ world has left behind the terminal as a relic of the past, the truth is that\
    \ the terminal is still the fundamental user interface used by most programming\
    \ languages on most computers. The Go programming language is no different, and\
    \ so before we write a program in Go we need to have a rudimentary understanding\
    \ of how a terminal works.\n\n#### Windows\n\nIn Windows the terminal (also known\
    \ as the command line) can be brought up by typing the windows key + r (hold down\
    \ the windows key then press r), typing `cmd.exe` and hitting enter. You should\
    \ see a black window appear that looks like this:\n\n![](images/00004.jpeg)  \n\
    \nBy default the command line starts in your home directory. (In my case this\
    \ is `C:\\Users\\caleb`) You issue commands by typing them in and hitting enter.\
    \ Try entering the command `dir`, which lists the contents of a directory. You\
    \ should see something like this:\n\n```\nC:\\Users\\caleb>dir\n Volume in drive\
    \ C has no label.\n Volume Serial Number is B2F5-F125\n```\n\nFollowed by a list\
    \ of the files and folders contained in your home directory. You can change directories\
    \ by using the command `cd`. For example you probably have a folder called `Desktop`.\
    \ You can see its contents by entering `cd Desktop` and then entering `dir`. To\
    \ go back to your home directory you can use the special directory name `..` (two\
    \ periods next to each other): `cd ..`. A single period represents the current\
    \ folder (known as the working folder), so `cd .` doesn't do anything. There are\
    \ a lot more commands you can use, but this should be enough to get you started.\n\
    \n#### OSX\n\nIn OSX the terminal can be reached by going to Finder → Applications\
    \ → Utilities → Terminal. You should see a window like this:\n\n![](images/00005.jpeg)\
    \  \n\nBy default the terminal starts in your home directory. (In my case this\
    \ is `/Users/caleb`) You issue commands by typing them in and hitting enter. Try\
    \ entering the command `ls`, which lists the contents of a directory. You should\
    \ see something like this:\n\n```\ncaleb-min:~ caleb$ ls\nDesktop      Downloads\
    \      Movies     Pictures\nDocuments    Library        Music      Public\n```\n\
    \nThese are the files and folders contained in your home directory (in this case\
    \ there are no files). You can change directories using the `cd` command. For\
    \ example you probably have a folder called `Desktop`. You can see its contents\
    \ by entering `cd Desktop` and then entering `ls`. To go back to your home directory\
    \ you can use the special directory name `..` (two periods next to each other):\
    \ `cd ..`. A single period represents the current folder (known as the working\
    \ folder), so `cd .` doesn't do anything. There are a lot more commands you can\
    \ use, but this should be enough to get you started.\n\n### Text Editors\n\nThe\
    \ primary tool programmers use to write software is a text editor. Text editors\
    \ are similar to word processing programs (Microsoft Word, Open Office, …) but\
    \ unlike such programs they don't do any formatting, (No bold, italic, …) instead\
    \ they operate only on plain text. Both OSX and Windows come with text editors\
    \ but they are highly limited and I recommend installing a better one.\n\nTo make\
    \ the installation of this software easier an installer is available at the book's\
    \ website: [http://www.golang-book.com/](http://www.golang-book.com/). This installer\
    \ will install the Go tool suite, setup environmental variables and install a\
    \ text editor.\n\n#### Windows"
