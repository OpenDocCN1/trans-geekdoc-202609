    \ ByName) Less(i, j int) bool {\n    return this[i].Name < this[j].Name\n}\nfunc\
    \ (this ByName) Swap(i, j int) {\n    this[i], this[j] = this[j], this[i]\n}\n\
    \nfunc main() {\n    kids := []Person{\n        {\"Jill\",9},\n        {\"Jack\"\
    ,10},\n    }\n    sort.Sort(ByName(kids))\n    fmt.Println(kids)\n}\n```\n\nThe\
    \ `Sort` function in `sort` takes a `sort.Interface` and sorts it. The `sort.Interface`\
    \ requires 3 methods: `Len`, `Less` and `Swap`. To define our own sort we create\
    \ a new type (`ByName`) and make it equivalent to a slice of what we want to sort.\
    \ We then define the 3 methods.\n\nSorting our list of people is then as easy\
    \ as casting the list into our new type. We could also sort by age by doing this:\n\
    \n```\ntype ByAge []Person\nfunc (this ByAge) Len() int {\n    return len(this)\n\
    }\nfunc (this ByAge) Less(i, j int) bool {\n    return this[i].Age < this[j].Age\n\
    }\nfunc (this ByAge) Swap(i, j int) {\n    this[i], this[j] = this[j], this[i]\n\
    }\n```\n\n### Hashes & Cryptography\n\nA hash function takes a set of data and\
    \ reduces it to a smaller fixed size. Hashes are frequently used in programming\
    \ for everything from looking up data to easily detecting changes. Hash functions\
    \ in Go are broken into two categories: cryptographic and non-cryptographic.\n\
    \nThe non-cryptographic hash functions can be found underneath the hash package\
    \ and include `adler32`, `crc32`, `crc64` and `fnv`. Here's an example using `crc32`:\n\
    \n```\npackage main\n\nimport (\n    \"fmt\"\n    \"hash/crc32\"\n)\n\nfunc main()\
    \ {\n    h := crc32.NewIEEE()\n    h.Write([]byte(\"test\"))\n    v := h.Sum32()\n\
    \    fmt.Println(v)\n}\n```\n\nThe `crc32` hash object implements the `Writer`\
    \ interface, so we can write bytes to it like any other `Writer`. Once we've written\
    \ everything we want we call `Sum32()` to return a `uint32`. A common use for\
    \ `crc32` is to compare two files. If the `Sum32` value for both files is the\
    \ same, it's highly likely (though not 100% certain) that the files are the same.\
    \ If the values are different then the files are definitely not the same:\n\n\
    ```\npackage main\n\nimport (\n    \"fmt\"\n    \"hash/crc32\"\n    \"io/ioutil\"\
    \n)\n\nfunc getHash(filename string) (uint32, error) {\n    bs, err := ioutil.ReadFile(filename)\n\
    \    if err != nil {\n        return 0, err\n    }\n    h := crc32.NewIEEE()\n\
    \    h.Write(bs)\n    return h.Sum32(), nil\n}\n\nfunc main() {\n    h1, err :=\
    \ getHash(\"test1.txt\")\n    if err != nil {\n        return\n    }\n    h2,\
    \ err := getHash(\"test2.txt\")\n    if err != nil {\n        return\n    }\n\
    \    fmt.Println(h1, h2, h1 == h2)\n}\n```\n\nCryptographic hash functions are\
    \ similar to their non-cryptographic counterparts, but they have the added property\
    \ of being hard to reverse. Given the cryptographic hash of a set of data, it's\
    \ extremely difficult to determine what made the hash. These hashes are often\
    \ used in security applications.\n\nOne common cryptographic hash function is\
    \ known as SHA-1. Here's how it is used:"
