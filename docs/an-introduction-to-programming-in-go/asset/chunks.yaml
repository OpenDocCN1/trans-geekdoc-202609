    \ as: `fib(0) = 0`, `fib(1) = 1`, `fib(n) = fib(n-1) + fib(n-2)`. Write a recursive\
    \ function which can find `fib(n)`.\n\n*   What are defer, panic and recover?\
    \ How do you recover from a run-time panic?\n\n## Pointers\n\nWhen we call a function\
    \ that takes an argument, that argument is copied to the function:\n\n```\nfunc\
    \ zero(x int) {\n    x = 0\n}\nfunc main() {\n    x := 5\n    zero(x)\n    fmt.Println(x)\
    \ // x is still 5\n}\n```\n\nIn this program the `zero` function will not modify\
    \ the original `x` variable in the `main` function. But what if we wanted to?\
    \ One way to do this is to use a special data type known as a pointer:\n\n```\n\
    func zero(xPtr *int) {\n    *xPtr = 0\n}\nfunc main() {\n    x := 5\n    zero(&x)\n\
    \    fmt.Println(x) // x is 0\n}\n```\n\nPointers reference a location in memory\
    \ where a value is stored rather than the value itself. (They point to something\
    \ else) By using a pointer (`*int`) the `zero` function is able to modify the\
    \ original variable.\n\n### The \\* and & operators\n\nIn Go a pointer is represented\
    \ using the `*` (asterisk) character followed by the type of the stored value.\
    \ In the `zero` function `xPtr` is a pointer to an `int`.\n\n`*` is also used\
    \ to “dereference” pointer variables. Dereferencing a pointer gives us access\
    \ to the value the pointer points to. When we write `*xPtr = 0` we are saying\
    \ “store the `int` 0 in the memory location `xPtr` refers to”. If we try `xPtr\
    \ = 0` instead we will get a compiler error because `xPtr` is not an `int` it's\
    \ a `*int`, which can only be given another `*int`.\n\nFinally we use the `&`\
    \ operator to find the address of a variable. `&x` returns a `*int` (pointer to\
    \ an int) because `x` is an `int`. This is what allows us to modify the original\
    \ variable. `&x` in `main` and `xPtr` in `zero` refer to the same memory location.\n\
    \n### new\n\nAnother way to get a pointer is to use the built-in `new` function:\n\
    \n```\nfunc one(xPtr *int) {\n    *xPtr = 1\n}\nfunc main() {\n    xPtr := new(int)\n\
    \    one(xPtr)\n    fmt.Println(*xPtr) // x is 1\n}\n```\n\n`new` takes a type\
    \ as an argument, allocates enough memory to fit a value of that type and returns\
    \ a pointer to it.\n\nIn some programming languages there is a significant difference\
    \ between using `new` and `&`, with great care being needed to eventually delete\
    \ anything created with `new`. Go is not like this, it's a garbage collected programming\
    \ language which means memory is cleaned up automatically when nothing refers\
    \ to it anymore.\n\nPointers are rarely used with Go's built-in types, but as\
    \ we will see in the next chapter, they are extremely useful when paired with\
    \ structs.\n\n#### Problems\n\n*   How do you get the memory address of a variable?\n\
    \n*   How do you assign a value to a pointer?\n\n*   How do you create a new pointer?\n\
    \n*   What is the value of x after running this program:\n\n    ```\n    func\
    \ square(x *float64) {\n        *x = *x * *x\n    }\n    func main() {\n     \
    \   x := 1.5\n        square(&x)\n    }\n    ```\n\n*   Write a program that can\
    \ swap two integers (`x := 1; y := 2; swap(&x, &y)` should give you `x=2` and\
    \ `y=1`).\n\n## Structs and Interfaces\n\nAlthough it would be possible for us\
    \ to write programs only using Go's built-in data types, at some point it would\
    \ become quite tedious. Consider a program that interacts with shapes:"
