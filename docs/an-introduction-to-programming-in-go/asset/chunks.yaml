    \    }\n    ```\n\n    `m` 就是别名。\n\n*   你可能已经注意到，我们过的包中的每个函数都以大字母开头。在 Go 中，如果某个东西以大字母开头，意味着其他包（以及程序）能够看到它。如果我们把函数命名为\
