- fmt: "\nNotice that this program is very similar to the program we wrote in chapter\
    \ 2. It contains the same package line, the same import line, the same function\
    \ declaration and uses the same `Println` function. This time instead of printing\
    \ the string `Hello World` we print the string `1 + 1 =` followed by the result\
    \ of the expression `1 + 1`. This expression is made up of three parts: the numeric\
    \ literal `1` (which is of type `int`), the `+` operator (which represents addition)\
    \ and another numeric literal `1`. Let's try the same thing using floating point\
    \ numbers:\n\n```\nfmt.Println(\"1 + 1 =\", 1.0 + 1.0)\n```\n\nNotice that we\
    \ use the `.0` to tell Go that this is a floating point number instead of an integer.\
    \ Running this program will give you the same result as before.\n\nIn addition\
    \ to addition Go has several other operators:\n\n| + | addition |\n| --- | ---\
    \ |\n| - | subtraction |\n| * | multiplication |\n| / | division |\n| % | remainder\
    \ |\n\n### Strings\n\nAs we saw in chapter 2 a string is a sequence of characters\
    \ with a definite length used to represent text. Go strings are made up of individual\
    \ bytes, usually one for each character. (Characters from other languages like\
    \ Chinese are represented by more than one byte)\n\nString literals can be created\
    \ using double quotes `\"Hello World\"` or back ticks `` `Hello World` ``. The\
    \ difference between these is that double quoted strings cannot contain newlines\
    \ and they allow special escape sequences. For example `\\n` gets replaced with\
    \ a newline and `\\t` gets replaced with a tab character.\n\nSeveral common operations\
    \ on strings include finding the length of a string: `len(\"Hello World\")`, accessing\
    \ an individual character in the string: `\"Hello World\"[1]`, and concatenating\
    \ two strings together: `\"Hello \" + \"World\"`. Let's modify the program we\
    \ created earlier to test these out:\n\n```\npackage main\n\nimport \"fmt\"\n\n\
    func main() {\n    fmt.Println(len(\"Hello World\"))\n    fmt.Println(\"Hello\
    \ World\"[1])\n    fmt.Println(\"Hello \" + \"World\")\n}\n```\n\nA few things\
    \ to notice:\n\n* A space is also considered a character, so the string's length\
    \ is 11 not 10 and the 3rd line has `\"Hello \"` instead of `\"Hello\"`.\n\n*\
    \ Strings are “indexed” starting at 0 not 1. `[1]` gives you the 2nd element not\
    \ the 1st. Also notice that you see `101` instead of `e` when you run this program.\
    \ This is because the character is represented by a byte (remember a byte is an\
    \ integer).\n\nOne way to think about indexing would be to show it like this instead:\
    \ `\"Hello World\"```1`. You'd read that as “The string Hello World sub 1,” “The\
    \ string Hello World at 1” or “The second character of the string Hello World”.\n\
    \n* Concatenation uses the same symbol as addition. The Go compiler figures out\
    \ what to do based on the types of the arguments. Since both sides of the `+`\
    \ are strings the compiler assumes you mean concatenation and not addition. (Addition\
    \ is meaningless for strings)\n\n### Booleans\n\nA boolean value (named after\
    \ George Boole) is a special 1 bit integer type used to represent true and false\
    \ (or on and off). Three logical operators are used with boolean values:\n\n|\
    \ && | and |\n| --- | --- |\n| || | or |\n| ! | not |\n\nHere is an example program\
    \ showing how they can be used:\n\n```\nfunc main() {\n    fmt.Println(true &&\
    \ true)\n    fmt.Println(true && false)\n    fmt.Println(true || true)\n    fmt.Println(true\
    \ || false)\n    fmt.Println(!true)\n}\n```\n\nRunning this program should give\
    \ you:\n\n```\n$ go run main.go\ntrue\nfalse\ntrue\ntrue\nfalse\n```\n\nWe usually\
    \ use truth tables to define how these operators work:\n\n| Expression | Value\
    \ |\n| --- | --- |\n| true && true | true |\n| true && false | false |\n| false\
    \ && true | false |\n| false && false | false |\n\n| Expression | Value |\n| ---\
    \ | --- |\n| true || true | true |\n| true || false | true |\n| false || true\
    \ | true |\n| false || false | false |\n\n| Expression | Value |\n| --- | ---\
    \ |\n| !true | false |\n| !false | true |\n\nThese are the simplest types included\
    \ with Go and form the foundation from which all later types are built.\n\n####\
    \ Problems\n\n* How are integers stored on a computer?\n\n* We know that (in base\
    \ 10) the largest 1 digit number is 9 and the largest 2 digit number is 99. Given\
    \ that in binary the largest 2 digit number is 11 (3), the largest 3 digit number\
    \ is 111 (7) and the largest 4 digit number is 1111 (15) what's the largest 8\
    \ digit number? (hint: 101-1 = 9 and 102-1 = 99)\n\n* Although overpowered for\
    \ the task you can use Go as a calculator. Write a program that computes `32132\
    \ × 42452` and prints it to the terminal. (Use the `*` operator for multiplication)\n\
    \n### Variables\n\nUntil now we have only seen literals, but we need variables.\
    \ A variable is a storage location with a name. This chapter will explore variables.\n\
    \n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    var x string = \"\
    Hello World\"\n    fmt.Println(x)\n}\n```\n\nThe `var` keyword is used to declare\
    \ a variable. You can also provide an initial value:\n\n```go\npackage main\n\n\
    import \"fmt\"\n\nfunc main() {\n    var x int = 10\n    fmt.Println(x)\n}\n```\n\
    \nVariables can change their value throughout the program:\n\n```go\npackage main\n\
    \nimport \"fmt\"\n\nfunc main() {\n    var x int = 10\n    fmt.Println(x)\n  \
    \  x = 20\n    fmt.Println(x)\n}\n```\n\nYou can also declare a variable without\
    \ an initial value:\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n\
    \    var x int\n    fmt.Println(x)\n}\n```\n\nWhen you declare a variable without\
    \ an initial value, Go gives it a \"zero value\". For `int` it's `0`, for `string`\
    \ it is `\"\"`, and for `bool` it is `false`.\n\n```go\npackage main\n\nimport\
    \ \"fmt\"\n\nfunc main() {\n    var x int\n    fmt.Println(x)\n    var y string\n\
    \    fmt.Println(y)\n    var z bool\n    fmt.Println(z)\n}\n```\n\nThere is an\
    \ even shorter way to declare and initialize a variable using the `:=` operator:\n\
    \n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    x := 10\n    fmt.Println(x)\n\
    \    y := \"Hello World\"\n    fmt.Println(y)\n}\n```\n\nThe `:=` operator can\
    \ only be used inside functions. Outside functions, you must use the `var` keyword.\n\
    \nAnother difference between `var` and `:=` is that `var` allows you to specify\
    \ the type, while `:=` infers it from the value.\n\n```go\npackage main\n\nimport\
    \ \"fmt\"\n\nfunc main() {\n    var x int = 10\n    fmt.Println(x)\n    y := 10\n\
    \    fmt.Println(y)\n}\n```\n\nYou can also use `:=` to re-initialize an existing\
    \ variable:\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    x :=\
    \ 10\n    fmt.Println(x)\n    x := 20\n    fmt.Println(x)\n}\n```\n\nWait, the\
    \ above code is actually an error! You cannot use `:=` to re-initialize a variable\
    \ in the same scope. Instead, use the assignment operator `=`:\n\n```go\npackage\
    \ main\n\nimport \"fmt\"\n\nfunc main() {\n    x := 10\n    fmt.Println(x)\n \
    \   x = 20\n    fmt.Println(x)\n}\n```\n\nVariables can also be passed to functions:\n\
    \n```go\npackage main\n\nimport \"fmt\"\n\nfunc print(x int) {\n    fmt.Println(x)\n\
    }\n\nfunc main() {\n    x := 10\n    print(x)\n}\n```\n\nIn Go, arguments are\
    \ passed by value, which means the function receives a copy of the variable, not\
    \ the variable itself.\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc print(x\
    \ int) {\n    x = x + 10\n    fmt.Println(x)\n}\n\nfunc main() {\n    x := 10\n\
    \    print(x)\n    fmt.Println(x)\n}\n```\n\nVariables can also be returned from\
    \ functions:\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc add(x, y int) int\
    \ {\n    return x + y\n}\n\nfunc main() {\n    sum := add(10, 20)\n    fmt.Println(sum)\n\
    }\n```\n\nFunctions can also return multiple values:\n\n```go\npackage main\n\n\
    import \"fmt\"\n\nfunc swap(x, y int) (int, int) {\n    return y, x\n}\n\nfunc\
    \ main() {\n    x, y := swap(10, 20)\n    fmt.Println(x, y)\n}\n```\n\nFunctions\
    \ can also have named return values:\n\n```go\npackage main\n\nimport \"fmt\"\n\
    \nfunc swap(x, y int) (a int, b int) {\n    a = y\n    b = x\n    return\n}\n\n\
    func main() {\n    x, y := swap(10, 20)\n    fmt.Println(x, y)\n}\n```\n\nWith\
    \ named return values, you can use a \"naked `return` statement:\n\n```go\npackage\
    \ main\n\nimport \"fmt\"\n\nfunc swap(x, y int) (a int, b int) {\n    a = y\n\
    \    b = x\n    return\n}\n\nfunc main() {\n    x, y := swap(10, 20)\n    fmt.Println(x,\
    \ y)\n}\n```\n\nVariables can also be defined as structs:\n\n```go\npackage main\n\
    \nimport \"fmt\"\n\ntype Person struct {\n    Name string\n    Age  int\n}\n\n\
    func main() {\n    var p Person\n    p.Name = \"Alice\"\n    p.Age = 30\n    fmt.Println(p)\n\
    }\n```\n\nYou can also initialize a struct using a literal:\n\n```go\npackage\
    \ main\n\nimport \"fmt\"\n\ntype Person struct {\n    Name string\n    Age  int\n\
    }\n\nfunc main() {\n    p := Person{Name: \"Alice\", Age: 30}\n    fmt.Println(p)\n\
    }\n```\n\nYou can also initialize a struct using a pointer:\n\n```go\npackage\
    \ main\n\nimport \"fmt\"\n\ntype Person struct {\n    Name string\n    Age  int\n\
    }\n\nfunc main() {\n    p := Person{Name: \"Alice\", Age: 30}\n    ptr := &p\n\
    \    fmt.Println(*ptr)\n}\n```\n\nVariables can also be defined as slices:\n\n\
    ```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    s := []int{1, 2, 3}\n\
    \    fmt.Println(s)\n}\n```\n\nYou can also append to a slice:\n\n```go\npackage\
    \ main\n\nimport \"fmt\"\n\nfunc main() {\n    s := []int{1, 2, 3}\n    s = append(s,\
    \ 4)\n    fmt.Println(s)\n}\n```\n\nVariables can also be defined as maps:\n\n\
    ```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    m := map[string]int{\"\
    apple\": 1, \"banana\": 2}\n    fmt.Println(m)\n}\n```\n\nYou can also add elements\
    \ to a map:\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    m :=\
    \ map[string]int{\"apple\": 1, \"banana\": 2}\n    m[\"cherry\"] = 3\n    fmt.Println(m)\n\
    }\n```\n\nVariables can also be defined as functions:\n\n```go\npackage main\n\
    \nimport \"fmt\"\n\nfunc main() {\n    f := func(a, b int) int {\n        return\
    \ a + b\n    }\n    fmt.Println(f(5, 10))\n}\n```\n"
  raw: "Notice that this program is very similar to the program we wrote in chapter\
    \ 2. It contains the same package line, the same import line, the same function\
    \ declaration and uses the same `Println` function. This time instead of printing\
    \ the string `Hello World` we print the string `1 + 1 =` followed by the result\
    \ of the expression `1 + 1`. This expression is made up of three parts: the numeric\
    \ literal `1` (which is of type `int`), the `+` operator (which represents addition)\
    \ and another numeric literal `1`. Let's try the same thing using floating point\
    \ numbers:\n\n```\n    fmt.Println(\"1 + 1 =\", 1.0 + 1.0)\n```\n\nNotice that\
    \ we use the `.0` to tell Go that this is a floating point number instead of an\
    \ integer. Running this program will give you the same result as before.\n\nIn\
    \ addition to addition Go has several other operators:\n\n| + || addition |\n\n\
    | --- | --- |\n\n| \\- || subtraction |\n\n| \\* || multiplication |\n\n| / ||\
    \ division |\n\n| % || remainder |\n\n### Strings\n\nAs we saw in chapter 2 a\
    \ string is a sequence of characters with a definite length used to represent\
    \ text. Go strings are made up of individual bytes, usually one for each character.\
    \ (Characters from other languages like Chinese are represented by more than one\
    \ byte)\n\nString literals can be created using double quotes `\"Hello World\"\
    ` or back ticks `` `Hello World` ``. The difference between these is that double\
    \ quoted strings cannot contain newlines and they allow special escape sequences.\
    \ For example `\\n` gets replaced with a newline and `\\t` gets replaced with\
    \ a tab character.\n\nSeveral common operations on strings include finding the\
    \ length of a string: `len(\"Hello World\")`, accessing an individual character\
    \ in the string: `\"Hello World\"[1]`, and concatenating two strings together:\
    \ `\"Hello \" + \"World\"`. Let's modify the program we created earlier to test\
    \ these out:\n\n```\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    fmt.Println(len(\"\
    Hello World\"))\n    fmt.Println(\"Hello World\"[1])\n    fmt.Println(\"Hello\
    \ \" + \"World\")\n}\n```\n\nA few things to notice:\n\n*   A space is also considered\
    \ a character, so the string's length is 11 not 10 and the 3rd line has `\"Hello\
    \ \"` instead of `\"Hello\"`.\n\n*   Strings are “indexed” starting at 0 not 1.\
    \ `[1]` gives you the 2nd element not the 1st. Also notice that you see `101`\
    \ instead of `e` when you run this program. This is because the character is represented\
    \ by a byte (remember a byte is an integer).  \n\n    One way to think about indexing\
    \ would be to show it like this instead: `\"Hello World\"``1`. You'd read that\
    \ as “The string Hello World sub 1,” “The string Hello World at 1” or “The second\
    \ character of the string Hello World”.\n\n*   Concatenation uses the same symbol\
    \ as addition. The Go compiler figures out what to do based on the types of the\
    \ arguments. Since both sides of the `+` are strings the compiler assumes you\
    \ mean concatenation and not addition. (Addition is meaningless for strings)\n\
    \n### Booleans\n\nA boolean value (named after George Boole) is a special 1 bit\
    \ integer type used to represent true and false (or on and off). Three logical\
    \ operators are used with boolean values:\n\n| && || and |\n\n| --- | --- |\n\n\
    | || || or |\n\n| ! || not |\n\nHere is an example program showing how they can\
    \ be used:\n\n```\nfunc main() {\n    fmt.Println(true && true)\n    fmt.Println(true\
    \ && false)\n    fmt.Println(true || true)\n    fmt.Println(true || false)\n \
    \   fmt.Println(!true)\n}\n```\n\nRunning this program should give you:\n\n```\n\
    $ go run main.go\ntrue\nfalse\ntrue\ntrue\nfalse\n```\n\nWe usually use truth\
    \ tables to define how these operators work:\n\n| Expression || Value |\n\n| ---\
    \ | --- |\n\n| true && true || true |\n\n| true && false || false |\n\n| false\
    \ && true || false |\n\n| false && false || false |\n\n| Expression || Value |\n\
    \n| --- | --- |\n\n| true || true || true |\n\n| true || false || true |\n\n|\
    \ false || true || true |\n\n| false || false || false |\n\n| Expression || Value\
    \ |\n\n| --- | --- |\n\n| !true || false |\n\n| !false || true |\n\nThese are\
    \ the simplest types included with Go and form the foundation from which all later\
    \ types are built.\n\n#### Problems\n\n*   How are integers stored on a computer?\n\
    \n*   We know that (in base 10) the largest 1 digit number is 9 and the largest\
    \ 2 digit number is 99. Given that in binary the largest 2 digit number is 11\
    \ (3), the largest 3 digit number is 111 (7) and the largest 4 digit number is\
    \ 1111 (15) what's the largest 8 digit number? (hint: 101-1 = 9 and 102-1 = 99)\n\
    \n*   Although overpowered for the task you can use Go as a calculator. Write\
    \ a program that computes `32132 × 42452` and prints it to the terminal. (Use\
    \ the `*` operator for multiplication)\n\n*   What is a string? How do you find\
    \ its length?\n\n*   What's the value of the expression `(true && false) || (false\
    \ && true) || !(false && false)`?\n\n## Variables\n\nUp until now we have only\
    \ seen programs that use literal values (numbers, strings, etc.) but such programs\
    \ aren't particularly useful. To make truly useful programs we need to learn two\
    \ new concepts: variables and control flow statements. This chapter will explore\
    \ variables in more detail.\n\nA variable is a storage location, with a specific\
    \ type and an associated name. Let's change the program we wrote in chapter 2\
    \ so that it uses a variable:\n\n```\npackage main\n\nimport \"fmt\"\n\nfunc main()\
    \ {\n    var x string = \"Hello World\"\n    fmt.Println(x)\n}\n```\n\nNotice\
    \ that the string literal from the original program still appears in this program,\
    \ but rather than send it directly to the `Println` function we assign it to a\
    \ variable instead. Variables in Go are created by first using the `var` keyword,\
    \ then specifying the variable name (`x`), the type (`string`) and finally assigning\
    \ a value to the variable (`Hello World`). The last step is optional so an alternative\
    \ way of writing the program would be like this:\n\n```\npackage main\n\nimport\
    \ \"fmt\"\n\nfunc main() {\n    var x string\n    x = \"Hello World\"\n    fmt.Println(x)\n\
    }\n```\n\nVariables in Go are similar to variables in algebra but there are some\
    \ subtle differences:\n\nFirst when we see the `=` symbol we have a tendency to\
    \ read that as “x equals the string Hello World”. There's nothing wrong with reading\
    \ our program that way, but it's better to read it as “x takes the string Hello\
    \ World” or “x is assigned the string Hello World”. This distinction is important\
    \ because (as their name would suggest) variables can change their value throughout\
    \ the lifetime of a program. Try running the following:\n\n```\npackage main\n\
    \nimport \"fmt\"\n\nfunc main() {\n    var x string\n    x = \"first\"\n    fmt.Println(x)\n\
    \    x = \"second\"\n    fmt.Println(x)\n}\n```\n\nIn fact you can even do this:\n\
    \n```\nvar x string\nx = \"first \"\nfmt.Println(x)\nx = x + \"second\"\nfmt.Println(x)\n\
    ```\n\nThis program would be nonsense if you read it like an algebraic theorem.\
    \ But it makes sense if you are careful to read the program as a list of commands.\
    \ When we see `x = x + \"second\"` we should read it as “assign the concatenation\
    \ of the value of the variable x and the string literal second to the variable\
    \ x.” The right side of the `=` is done first and the result is then assigned\
    \ to the left side of the `=`.\n\nThe `x = x + y` form is so common in programming\
    \ that Go has a special assignment statement: `+=`. We could have written `x =\
    \ x + \"second\"` as `x += \"second\"` and it would have done the same thing.\
    \ (Other operators can be used the same way)\n\nAnother difference between Go\
    \ and algebra is that we use a different symbol for equality: `==`. (Two equal\
    \ signs next to each other) `==` is an operator like `+` and it returns a boolean.\
    \ For example:\n\n```\n    var x string = \"hello\"\n    var y string = \"world\"\
    \n    fmt.Println(x == y)\n```\n\nThis program should print `false` because `hello`\
    \ is not the same as `world`. On the other hand:\n\n```\n    var x string = \"\
    hello\"\n    var y string = \"hello\"\n    fmt.Println(x == y)\n```\n\nThis will\
    \ print `true` because the two strings are the same.\n\nSince creating a new variable\
    \ with a starting value is so common Go also supports a shorter statement:"
