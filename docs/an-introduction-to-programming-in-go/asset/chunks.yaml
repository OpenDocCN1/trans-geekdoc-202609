  trans: "\n\n```\npackage math\n\nfunc Average(xs []float64) float64 {\n    total\
    \ := float64(0)\n    for _, x := range xs {\n        total += x\n    }\n    return\
    \ total / float64(len(xs))\n}\n```\n\n在你刚刚创建的 `math` 文件夹中使用终端运行 `go install`。这将编译\
    \ `math.go` 程序并创建一个可链接的符号文件：`~/Go/pkg/os_arch/golang-book/chapter11/math.a`。（其中\
    \ `os` 是类似 `windows` 的内容，`arch` 是类似 `amd64` 的内容）\n\n现在回到 `chapter11` 文件夹并运行 `go\
    \ run main.go`。你应该看到 `2.5`。需要注意的几点：\n\n*   `math` 是 Go 标准分发中一个包的名称，但由于 Go 包是可以分级的，因此我们可以安全地为自己的包使用相同的名称。（真正的\
    \ `math` 包仅仅是 `math`，而我们的是 `golang-book/chapter11/math`）\n\n*   当我们导入自己的 math\
    \ 库时，使用它的完整名称（`import \"golang-book/chapter11/math\"`），但在 `math.go` 文件内部，我们只使用名称的最后部分（`package\
    \ math`）。\n\n*   在引用库中的函数时，我们也只使用短名称 `math`。如果我们想在同一个程序中使用两个库，Go 允许我们使用别名：\n\n\
    \    ```\n    import m \"golang-book/chapter11/math\"\n    \n    func main() {\n\
