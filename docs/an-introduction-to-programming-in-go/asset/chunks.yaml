    \ It's probably a good idea to test many different combinations of numbers so\
    \ let's change our test program a little:\n\n```\npackage math\n\nimport \"testing\"\
    \n\ntype testpair struct {\n    values []float64\n    average float64\n}\n\nvar\
    \ tests = []testpair{\n    { []float64{1,2}, 1.5 },\n    { []float64{1,1,1,1,1,1},\
    \ 1 },\n    { []float64{-1,1}, 0 },\n}\n\nfunc TestAverage(t *testing.T) {\n \
    \   for _, pair := range tests {\n        v := Average(pair.values)\n        if\
    \ v != pair.average {\n            t.Error(\n                \"For\", pair.values,\
    \ \n                \"expected\", pair.average,\n                \"got\", v,\n\
    \            )\n        }\n    }\n}\n```\n\nThis is a very common way to setup\
    \ tests (abundant examples can be found in the source code for the packages included\
    \ with Go). We create a `struct` to represent the inputs and outputs for the function.\
    \ Then we create a list of these `struct`s (pairs). Then we loop through each\
    \ one and run the function.\n\n#### Problems\n\n*   Writing a good suite of tests\
    \ is not always easy, but the process of writings tests often reveals more about\
    \ a problem then you may at first realize. For example, with our `Average` function\
    \ what happens if you pass in an empty list (`[]float64{}`)? How could we modify\
    \ the function to return `0` in this case?\n\n*   Write a series of tests for\
    \ the `Min` and `Max` functions you wrote in the previous chapter.\n\n## The Core\
    \ Packages\n\nInstead of writing everything from scratch, most real world programming\
    \ depends on our ability to interface with existing libraries. This chapter will\
    \ take a look at some of the most commonly used packages included with Go.\n\n\
    First a word of warning: although some of these libraries are fairly obvious (or\
    \ have been explained in previous chapters), many of the libraries included with\
    \ Go require specialized domain specific knowledge (for example: cryptography).\
    \ It is beyond the scope of this book to explain these underlying technologies.\n\
    \n### Strings\n\nGo includes a large number of functions to work with strings\
    \ in the `strings` package:\n\n```\npackage main\n\nimport (\n    \"fmt\"\n  \
    \  \"strings\"\n)\n\nfunc main() {\n    fmt.Println(    \n        // true\n  \
    \      strings.Contains(\"test\", \"es\"), \n\n        // 2\n        strings.Count(\"\
    test\", \"t\"),\n\n        // true\n        strings.HasPrefix(\"test\", \"te\"\
    ), \n\n        // true\n        strings.HasSuffix(\"test\", \"st\"), \n\n    \
    \    // 1\n        strings.Index(\"test\", \"e\"), \n\n        // \"a-b\"\n  \
    \      strings.Join([]string{\"a\",\"b\"}, \"-\"),\n\n        // == \"aaaaa\"\n\
    \        strings.Repeat(\"a\", 5), \n\n        // \"bbaa\"\n        strings.Replace(\"\
    aaaa\", \"a\", \"b\", 2),\n\n        // []string{\"a\",\"b\",\"c\",\"d\",\"e\"\
    }\n        strings.Split(\"a-b-c-d-e\", \"-\"), \n\n        // \"test\"\n    \
    \    strings.ToLower(\"TEST\"), \n\n        // \"TEST\"\n        strings.ToUpper(\"\
    test\"), \n\n    )\n}\n```\n\nSometimes we need to work with strings as binary\
    \ data. To convert a string to a slice of bytes (and vice-versa) do this:\n\n\
    ```\narr := []byte(\"test\")\nstr := string([]byte{'t','e','s','t'})\n```\n\n\
    ### Input / Output"
