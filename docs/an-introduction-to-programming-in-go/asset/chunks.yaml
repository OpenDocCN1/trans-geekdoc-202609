    ```\n\nUsing your text editor type in the following:\n\n```\npackage main\n\n\
    import \"fmt\"\n\n// this is a comment\n\nfunc main() {\n    fmt.Println(\"Hello\
    \ World\")\n}\n```\n\nMake sure your file is identical to what is shown here and\
    \ save it as `main.go` in the folder we just created. Open up a new terminal and\
    \ type in the following:\n\n```\ncd Go/src/golang-book/chapter2\ngo run main.go\n\
    ```\n\nYou should see `Hello World` displayed in your terminal. The `go run` command\
    \ takes the subsequent files (separated by spaces), compiles them into an executable\
    \ saved in a temporary directory and then runs the program. If you didn't see\
    \ `Hello World` displayed you may have made a mistake when typing in the program.\
    \ The Go compiler will give you hints about where the mistake lies. Like most\
    \ compilers, the Go compiler is extremely pedantic and has no tolerance for mistakes.\n\
    \n### How to Read a Go Program\n\nLet's look at this program in more detail. Go\
    \ programs are read top to bottom, left to right. (like a book) The first line\
    \ says this:\n\n```\npackage main\n```\n\nThis is known as a “package declaration”.\
    \ Every Go program must start with a package declaration. Packages are Go's way\
    \ of organizing and reusing code. There are two types of Go programs: executables\
    \ and libraries. Executable applications are the kinds of programs that we can\
    \ run directly from the terminal. (in Windows they end with `.exe`) Libraries\
    \ are collections of code that we package together so that we can use them in\
    \ other programs. We will explore libraries in more detail later, for now just\
    \ make sure to include this line in any program you write.\n\nThe next line is\
    \ a blank line. Computers represent newlines with a special character (or several\
    \ characters). Newlines, spaces and tabs are known as whitespace (because you\
    \ can't see them). Go mostly doesn't care about whitespace, we use it to make\
    \ programs easier to read. (You could remove this line and the program would behave\
    \ in exactly the same way)\n\nThen we see this:\n\n```\nimport \"fmt\"\n```\n\n\
    The `import` keyword is how we include code from other packages to use with our\
    \ program. The `fmt` package (shorthand for format) implements formatting for\
    \ input and output. Given what we just learned about packages what do you think\
    \ the `fmt` package's files would contain at the top of them?\n\nNotice that `fmt`\
    \ above is surrounded by double quotes. The use of double quotes like this is\
    \ known as a “string literal” which is a type of “expression”. In Go strings represent\
    \ a sequence of characters (letters, numbers, symbols, …) of a definite length.\
    \ Strings are described in more detail in the next chapter, but for now the important\
    \ thing to keep in mind is that an opening `\"` character must eventually be followed\
    \ by another `\"` character and anything in between the two is included in the\
    \ string. (The `\"` character itself is not part of the string)\n\nThe line that\
    \ starts with `//` is known as a comment. Comments are ignored by the Go compiler\
    \ and are there for your own sake (or whoever picks up the source code for your\
    \ program). Go supports two different styles of comments: `//` comments in which\
    \ all the text between the `//` and the end of the line is part of the comment\
    \ and `/* */` comments where everything between the `*`s is part of the comment.\
    \ (And may include multiple lines)\n\nAfter this you see a function declaration:\n\
    \n```\nfunc main() {\n    fmt.Println(\"Hello World\")\n}\n```\n\nFunctions are\
    \ the building blocks of a Go program. They have inputs, outputs and a series\
    \ of steps called statements which are executed in order. All functions start\
    \ with the keyword `func` followed by the name of the function (`main` in this\
    \ case), a list of zero or more “parameters” surrounded by parentheses, an optional\
    \ return type and a “body” which is surrounded by curly braces. This function\
    \ has no parameters, doesn't return anything and has only one statement. The name\
    \ `main` is special because it's the function that gets called when you execute\
    \ the program.\n\nThe final piece of our program is this line:\n\n```\n    fmt.Println(\"\
    Hello World\")\n```"
