  trans: "\n\n```\n    x := \"Hello World\"\n```\n\n注意 `=` 前面有一个冒号 `:`，并且没有指定类型。指定类型并不是必要的，因为\
    \ Go 编译器能够根据你赋值给变量的字面量值推断出类型。（由于你赋值的是一个字符串字面量，`x` 被赋予了 `string` 类型）。编译器也可以在 `var`\
    \ 语句中进行类型推断：\n\n```\n    var x = \"Hello World\"\n```\n\n其他类型也同样适用：\n\n```\n \
    \   x := 5\n    fmt.Println(x)\n```\n\n通常情况下，你应该尽可能使用这种更短的形式。\n\n#### 如何为变量命名\n\
    \n正确地命名变量是软件开发的一个重要部分。名称必须以字母开头，可以包含字母、数字或 `_`（下划线）符号。Go 编译器并不关心你给变量起什么名字，因此名字是为了你（以及他人）方便。请选择能清晰描述变量用途的名字。假设我们有以下代码：\n\
    \n```\n    x := \"Max\"\n    fmt.Println(\"My dog's name is\", x)\n```\n\n在这种情况下，`x`\
    \ 不是一个很好的变量名。更好的名字应该是：\n\n```\n    name := \"Max\"\n    fmt.Println(\"My dog's\
    \ name is\", name)\n```\n\n或者：\n\n```\n    dogsName := \"Max\"\n    fmt.Println(\"\
    My dog's name is\", dogsName)\n```\n\n在最后一种情况下，我们使用了一种特殊方式在变量名中表示多个单词，称为小驼峰命名（lower\
    \ camel case，也称为混合 Case、bumpy caps、camel back 或 hump back）。第一个单词的首字母小写，后续每个单词的首字母大写，所有其他字母均为小写。\n\
    \n#### 作用域\n\n回到章节开头看到的程序：\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main()\
    \ {\n    var x string = \"Hello World\"\n    fmt.Println(x)\n}\n```\n\n编写这个程序的另一种方式如下：\n\
    \n```go\npackage main\n\nimport \"fmt\"\n\nvar x string = \"Hello World\"\n\n\
    func main() {\n    fmt.Println(x)\n}\n```\n\n注意我们将变量移动到了 `main` 函数外部。这意味着其他函数可以访问这个变量：\n\
    \n```go\nvar x string = \"Hello World\"\n\nfunc main() {\n    fmt.Println(x)\n\
    }\n\nfunc f() {\n    fmt.Println(x)\n}\n```\n\n`f` 函数现在可以访问变量 `x`。现在假设我们写的是下面的代码：\n\
    \n```go\nfunc main() {\n    var x string = \"Hello World\"\n    fmt.Println(x)\n\
    }\n\nfunc f() {\n    fmt.Println(x)\n}\n```\n\n如果你运行这个程序，你应该看到一个错误：\n\n```\n.\\\
    main.go:11: undefined: x\n```\n\n编译器告诉你在 `f` 函数内部的 `x` 变量不存在。它只存在于 `main` 函数内部。你允许使用\
    \ `x` 的范围被称为变量的作用域（scope）。根据语言规范，“Go 使用块进行词法作用域划分”。基本上，这意味着变量存在于最近的大括号 `{` `}`（一个块）内，包括任何嵌套的大括号（块），但不在它们之外。作用域起初可能会让人有一点困惑；随着我们看到更多的\
    \ Go 示例，它应该变得更加清晰。\n\n#### 常量\n\nGo 也支持常量。常量基本上是值在之后不能被更改的变量。它们的创建方式与创建变量相同，但我们不使用\
    \ `var` 关键字，而是使用 `const` 关键字：\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc\
    \ main() {\n    const x string = \"Hello World\"\n    fmt.Println(x)\n}\n```\n\
    \n如下：\n\n```\n    const x string = \"Hello World\"\n    x = \"Some other string\"\
    \n```\n\n会导致编译错误：\n\n```\n.\\main.go:7: cannot assign to x\n```\n\n常量是在程序中复用常用值的好方法，无需每次都编写它们。例如\
    \ `math` 包中的 `Pi` 被定义为一个常量。\n\n#### 定义多个变量\n\n当你需要定义多个变量时，Go 还有另一种简写：\n\n```go\n\
    var (\n    a = 5\n    b = 10\n    c = 15\n)\n```\n\n使用关键字 `var`（或 `const`）后跟括号，每个变量单独占一行。\n\
    \n#### 示例程序\n\n这是一个示例程序，它接收用户输入的数字并将其翻倍：\n\n```go\npackage main\n\nimport \"fmt\"\
    \n\nfunc main() {\n    fmt.Print(\"Enter a number: \")\n    var input float64\n\
    \    fmt.Scanf(\"%f\", &input)\n    \n    output := input * 2\n    \n    fmt.Println(output)\
    \    \n}\n```\n\n我们使用了 `fmt` 包中的另一个函数来读取用户输入（`Scanf`）。`&input` 将在后面的章节中解释，目前我们只需要知道\
    \ `Scanf` 会用我们输入的数字填充输入。\n\n##### 问题\n\n* 创建新变量的两种方法是什么？\n\n* 在运行 `x := 5; x +=\
    \ 1` 之后 `x` 的值是多少？\n\n* 什么是作用域？在 Go 中如何确定变量的作用域？\n\n* `var` 和 `const` 之间有什么区别？\n\
    \n#### 控制结构\n\n其他编程语言有许多不同类型的循环（while, do, until, foreach, …），但 Go 只有一种循环可以以多种方式使用。之前的程序也可以写成：\n\
    \n```go\nfunc main() {\n    for i := 1; i <= 10; i++ {\n        fmt.Println(i)\n\
    \    }\n}\n```\n\n现在条件表达式也包含了另外两个用分号隔开的语句。首先是变量初始化，然后是每次检查的条件，最后我们“递增”变量。（给变量加\
    \ 1 是非常常见的的操作，以至于我们有一个特殊的运算符：`++`。同样，减 1 可以通过 `--` 完成）\n\n我们将在后面的章节中看到 `for` 循环的更多用法。\n\
    \n##### For\n\n`for` 语句允许我们多次执行某些操作。根据目前为止我们学到的，可以写：\n\n```go\npackage main\n\n\
    import \"fmt\"\n\nfunc main() {\n    i := 1\n    for i <= 10 {\n        fmt.Println(i)\n\
    \        i = i + 1\n    }\n}\n```\n\n但这两个程序写起来很繁琐。我们需要一种多次执行某事的方法。使用示例：\n\n```go\n\
    package main\n\nimport \"fmt\"\n\nfunc main() {\n    const x string = \"Hello\
    \ World\"\n    fmt.Println(x)\n}\n```\n等等，让我重新排列一下 `for` 循环的工作原理：\n\n* 我们评估（运行）表达式\
    \ `i <= 10`（“i 小于或等于 10”）。如果评估结果为真，则运行块内部的语句。否则，我们跳转到程序中块之后的下一行（在这种情况下，块之后没有内容，所以我们退出）。\n\
    \n`i = i + 1` 这一行极其重要，因为如果没有它，`i <= 10` 将始终评估为 `true`，我们的程序永远不会停止。（当这种情况发生时，被称为死循环）\n\
    \n作为一个练习，让我们像计算机一样运行程序：\n\n* 创建一个名为 `i` 的变量，值为 1\n\n* `i <= 10` 吗？\n\n* 打印 `i`\n\
    \n* 将 `i` 设置为 `i + 1` (`i` 现在等于 2)\n\n* `i <= 10` 吗？\n\n* 打印 `i`\n\n* 将 `i` 设置为\
    \ `i + 1` (`i` 现在等于 3)\n\n* …\n\n* 将 `i` 设置为 `i + 1` (`i` 现在等于 11)\n\n* `i <=\
    \ 10` 吗？\n\n* 没有剩余可以的操作了，所以退出。\n\n"
- fmt: "\nLet's modify the program we just wrote so that instead of just printing\
    \ the numbers 1-10 on each line it also specifies whether or not the number is\
    \ even or odd. Like this:\n\n```\n1 odd\n2 even\n3 odd\n4 even\n5 odd\n6 even\n\
    7 odd\n8 even\n9 odd\n10 even\n```\n\nFirst we need a way of determining whether\
    \ or not a number is even or odd. An easy way to tell is to divide the number\
    \ by 2. If you have nothing left over then the number is even, otherwise it's\
    \ odd. So how do we find the remainder after division in Go? We use the `%` operator.\
    \ `1 % 2` equals `1`, `2 % 2` equals `0`, `3 % 2` equals `1` and so on.\n\nNext\
    \ we need a way of choosing to do different things based on a condition. For that\
    \ we use the `if` statement:\n\n```\nif i % 2 == 0 {\n  // even\n} else {\n  //\
    \ odd\n}\n```\n\nAn `if` statement is similar to a `for` statement in that it\
    \ has a condition followed by a block. If statements also have an optional `else`\
    \ part. If the condition evaluates to `true` then the block after the condition\
    \ is run, otherwise either the block is skipped or if the `else` block is present\
    \ that block is run.\n\nIf statements can also have `else if` parts:\n\n```\n\
    if i % 2 == 0 {\n    // divisible by 2\n} else if i % 3 == 0 {\n    // divisible\
    \ by 3\n} else if i % 4 == 0 {\n    // divisible by 4\n}\n```\n\nThe conditions\
    \ are checked top down and the first one to result in true will have its associated\
    \ block executed. None of the other blocks will execute, even if their conditions\
    \ also pass. (So for example the number 8 is divisible by both 4 and 2, but the\
    \ `// divisible by 4` block will never execute because the `// divisible by 2`\
    \ block is done first)\n\nPutting it all together we have:\n\n```\nfunc main()\
    \ {\n    for i := 1; i <= 10; i++ {\n       if i % 2 == 0 {\n            fmt.Println(i,\
    \ \"even\")\n        } else {\n            fmt.Println(i, \"odd\")\n        }\n\
    \    }\n}\n```\n\nLet's walk through this program:\n\n* Create a variable `i`\
    \ of type `int` and give it the value `1`\n* Is `i` less than or equal to `10`?\
    \ Yes: jump to the block\n* Is the remainder of `i` ÷ `2` equal to `0`? No: jump\
    \ to the `else` block\n* Print `i` followed by `odd`\n* Increment `i` (the statement\
    \ after the condition)\n* Is `i` less than or equal to `10`? Yes: jump to the\
    \ block\n* Is the remainder of `i` ÷ `2` equal to `0`? Yes: jump to the `if` block\n\
    * Print `i` followed by `even`\n* …  \n\nThe remainder operator, while rarely\
    \ seen outside of elementary school, turns out to be really useful when programming.\
    \ You'll see it turn up everywhere from tables to partitioning data.\n\n### Switch\n\
    \nSuppose we wanted to write a program that printed the English names for numbers.\
    \ Using what we've learned so far might start by this:\n\n```go\nif i == 0 { \n\
