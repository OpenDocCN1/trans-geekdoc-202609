  trans: "\n让我们修改一下刚才写的程序，让它不仅仅是每行打印数字 1-10，还能够指定该数字是偶数还是奇数。像下面所示：\n\n```\n1 odd\n\
    2 even\n3 odd\n4 even\n5 odd\n6 even\n7 odd\n8 even\n9 odd\n10 even\n```\n\n首先，我们需要一种判断一个数字是偶数还是奇数的方法。一种简单的方法是将数字除以\
    \ 2。如果没有余数，则该数字是偶数，否则是奇数。那么在 Go 中如何找到除法的余数呢？我们使用 `%` 运算符。`1 % 2` 等于 `1`，`2 % 2`\
    \ 等于 `0`，`3 % 2` 等于 `1`，依此类推。\n\n接下来，我们需要一种根据条件执行不同操作的方法。为此，我们使用 `if` 语句：\n\n\
    ```go\nif i % 2 == 0 {\n  // even\n} else {\n  // odd\n}\n```\n\n`if` 语句与 `for`\
    \ 语句类似，因为它包含一个条件，后面跟着一个代码块。`if` 语句还有一个可选的 `else` 部分。如果条件求值为 `true`，则执行条件后面的代码块；否则，跳过该代码块，或者如果存在\
    \ `else` 块，则执行该块。\n\n`if` 语句还可以有 `else if` 部分：\n\n```go\nif i % 2 == 0 {\n   \
    \ // divisible by 2\n} else if i % 3 == 0 {\n    // divisible by 3\n} else if\
    \ i % 4 == 0 {\n    // divisible by 4\n}\n```\n\n条件是从上往下检查的，第一个结果为 `true` 的条件将执行其关联的代码块。其他任何代码块都不会执行，即使它们的条件也通过了。（例如，数字\
    \ 8 既能被 4 整除也能被 2 整除，但 `// divisible by 4` 永远不会执行，因为 `// divisible by 2` 先执行了）\n\
    \n将所有内容整合在一起，我们得到了：\n\n```go\nfunc main() {\n    for i := 1; i <= 10; i++ {\n\
    \       if i % 2 == 0 {\n            fmt.Println(i, \"even\")\n        } else\
    \ {\n            fmt.Println(i, \"odd\")\n        }\n    }\n}\n```\n\n让我们过一遍这个程序：\n\
    \n* 创建一个类型为 `int` 的变量 `i` 并赋值赋值为 `1`\n* `i` 是否小于或等于 `10`？是：跳转到代码块\n* `i` ÷ `2`\
    \ 的余数等于 `0` 吗？否：跳转到 `else` 块\n* 打印 `i` 以及 `odd`\n* 递增 `i`（条件后的语句）\n* `i` 是否小于或等于\
    \ `10`？是：跳转到代码块\n* `i` ÷ `2` 的余数等于 `0` 吗？是：跳转到 `if` 块\n* 打印 `i` 以及 `even`\n* ……\n\
    \n取余运算符在小学之外很少见到，但在编程时被证明非常有用。你会发现它出现在各个地方，从表格到数据分区。\n\n### Switch\n\n假设我们想写一个打印数字英文名称的程序。使用我们目前所学的内容，可能会从这里开始：\n\
    \n```go\nif i == 0 { \n    fmt.Println(\"Zero\")\n} else if i == 1 {\n    fmt.Println(\"\
    One\")\n} else if i == 2 {\n    fmt.Println(\"Two\")\n} else if i == 3 {\n   \
    \ fmt.Println(\"Three\")\n} else if i == 4 { \n    fmt.Println(\"Four\")\n} else\
    \ if i == 5 {\n    fmt.Println(\"Five\")\n}\n```\n\n由于用这种编写程序非常繁琐，Go 提供了另一个语句让这变得更容易：`switch`\
    \ 语句。我们可以重写程序使其像这样：\n\n```go\nswitch i {\ncase 0: fmt.Println(\"Zero\")\ncase\
    \ 1: fmt.Println(\"One\")\ncase 2: fmt.Println(\"Two\")\ncase 3: fmt.Println(\"\
    Three\")\ncase 4: fmt.Println(\"Four\")\ncase 5: fmt.Println(\"Five\")\ndefault:\
    \ fmt.Println(\"Unknown\")\n}\n```\n\n`switch` 语句以关键字 `switch` 开始，后面跟着一个表达式（在本例中为\
    \ `i`），然后是一系列 `case`。表达式的值与每个 `case` 之后的表达式进行比较。如果它们等价，则执行冒号 `:` 之后的语句。和 `if`\
    \ 语句一样，每个 `case` 都会从上到下检查，并选择第一个成功的那个。`switch` 还支持 `default` 情况，当没有任何 `case` 匹配该值时会发生该情况（类似于\
    \ `if` 语句中的 `else`）。这些是主流程语句。额外的语句将在稍后介绍。\n\n#### Problems\n\n* 下面程序会打印什么：\n```go\n\
    i := 10\nif i > 10 {\n    fmt.Println(\"Big\")\n} else {\n    fmt.Println(\"Small\"\
    )\n}\n```\n* 编写一个程序，打印 1 到 100 之间所有被 3 整除的数字。（3, 6, 9 等）\n* 编写一个程序，打印 1 到 100\
    \ 的数字。但对于 3 的倍数打印 \"Fizz\" 而不是数字，对于 5 的倍数打印 \"Buzz\"。\n\n#### Arrays, Slices and\
    \ Maps\n\n（注：原文文本似乎在此处出现了重复或截断，但根据指令我将继续翻译提供的剩余部分）\n\n（翻译说明：由于您提供的原始文本在 \"Arrays,\
