    # Make Something


    One of the best ways to hone your skills is to practice coding. There are a lot
    of ways to do this: You could work on challenging programming problems from sites
    like Project Euler ([http://projecteuler.net/](http://projecteuler.net/)) or try
    your hand at a larger project. Perhaps try to implement a web server or write
    a simple game.


    # Team Up


    Most real-world software projects are done in teams, therefore learning how to
    work in a team is crucial. If you can, find a friend – maybe a classmate – and
    team up on a project. Learn how to divide a project into pieces you can both work
    on simultaneously.


    Another option is to work on an open source project. Find a 3rd party library,
    write some code (perhaps fix a bug), and submit it to the maintainer. Go has a
    growing community which can be reached via the mailing list ([http://groups.google.com/group/golang-nuts](http://groups.google.com/group/golang-nuts)).

    '
