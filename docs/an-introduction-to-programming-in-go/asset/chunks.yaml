    This program is similar to the TCP example, except now we created an object to\
    \ hold all the methods we want to expose and we call the `Negate` method from\
    \ the client. See the documentation in `net/rpc` for more details.\n\n### Parsing\
    \ Command Line Arguments\n\nWhen we invoke a command on the terminal it's possible\
    \ to pass that command arguments. We've seen this with the `go` command:\n\n```\n\
    go run myfile.go\n```\n\nrun and myfile.go are arguments. We can also pass flags\
    \ to a command:\n\n```\ngo run -v myfile.go\n```\n\nThe flag package allows us\
    \ to parse arguments and flags sent to our program. Here's an example program\
    \ that generates a number between 0 and 6. We can change the max value by sending\
    \ a flag (`-max=100`) to the program:\n\n```\npackage main\n\nimport (\"fmt\"\
    ;\"flag\";\"math/rand\")\n\nfunc main() {\n    // Define flags\n    maxp := flag.Int(\"\
    max\", 6, \"the max value\")\n    // Parse\n    flag.Parse()\n    // Generate\
    \ a number between 0 and max\n    fmt.Println(rand.Intn(*maxp))\n}\n```\n\nAny\
    \ additional non-flag arguments can be retrieved with `flag.Args()` which returns\
    \ a `[]string`.\n\n### Synchronization Primitives\n\nThe preferred way to handle\
    \ concurrency and synchronization in Go is through goroutines and channels as\
    \ discussed in chapter 10. However Go does provide more traditional multithreading\
    \ routines in the `sync` and `sync/atomic` packages.\n\n#### Mutexes\n\nA mutex\
    \ (mutal exclusive lock) locks a section of code to a single thread at a time\
    \ and is used to protect shared resources from non-atomic operations. Here is\
    \ an example of a mutex:\n\n```\npackage main\n\nimport (\n    \"fmt\"\n    \"\
    sync\"\n    \"time\"\n)\nfunc main() {\n    m := new(sync.Mutex)\n    \n    for\
    \ i := 0; i < 10; i++ {\n        go func(i int) {\n            m.Lock()\n    \
    \        fmt.Println(i, \"start\")\n            time.Sleep(time.Second)\n    \
    \        fmt.Println(i, \"end\")\n            m.Unlock()\n        }(i)\n    }\n\
    \n    var input string\n    fmt.Scanln(&input)\n}\n```\n\nWhen the mutex (`m`)\
    \ is locked any other attempt to lock it will block until it is unlocked. Great\
    \ care should be taken when using mutexes or the synchronization primitives provided\
    \ in the `sync/atomic` package.\n\nTraditional multithreaded programming is difficult;\
    \ it's easy to make mistakes and those mistakes are hard to find, since they may\
    \ depend on a very specific, relatively rare, and difficult to reproduce set of\
    \ circumstances. One of Go's biggest strengths is that the concurrency features\
    \ it provides are much easier to understand and use properly than threads and\
    \ locks.\n\n## Next Steps\n\nWe now have all the information we need to write\
    \ most Go programs. But it would be dangerous to conclude that therefore we are\
    \ competent programmers. Programming is as much a craft as it is just having knowledge.\
    \ This chapter will provide you with some suggestions about how best to master\
    \ the craft of programming.\n\n### Study the Masters\n\nPart of becoming a good\
    \ artist or writer is studying the works of the masters. It's no different with\
    \ programming. One of the best ways to become a skilled programmer is to study\
    \ the source code produced by others. Go is well suited to this task since the\
    \ source code for the entire project is freely available.\n\nFor example we might\
    \ take a look at the source code to the `io/ioutil` library available at:\n\n\
    [http://golang.org/src/pkg/io/ioutil/ioutil.go](http://golang.org/src/pkg/io/ioutil/ioutil.go)\n\
    \nRead the code slowly and deliberately. Try to understand every line and read\
    \ the supplied comments. For example in the `ReadFile` method there's a comment\
    \ that says this:\n\n```\n// It's a good but not certain bet that FileInfo\n//\
    \ will tell us exactly how much to read, so\n// let's try it but be prepared for\
    \ the answer\n// to be wrong.\n```\n\nThis method probably started out simpler\
    \ than what it became so this is a great example of how programs can evolve after\
    \ testing and why it's important to supply comments with those changes. All of\
    \ the source code for all of the packages is available at:"
