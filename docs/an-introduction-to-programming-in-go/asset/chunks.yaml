    \ that we are defining a `struct` type and a list of fields inside of curly braces.\
    \ Each field has a name and a type. Like with functions we can collapse fields\
    \ that have the same type:\n\n```\ntype Circle struct {\n    x, y, r float64\n\
    }\n```\n\n#### Initialization\n\nWe can create an instance of our new Circle type\
    \ in a variety of ways:\n\n```\nvar c Circle\n```\n\nLike with other data types,\
    \ this will create a local Circle variable that is by default set to zero. For\
    \ a `struct` zero means each of the fields is set to their corresponding zero\
    \ value (`0` for `int`s, `0.0` for `float`s, `\"\"` for `string`s, `nil` for pointers,\
    \ …) We can also use the new function:\n\n```\nc := new(Circle)\n```\n\nThis allocates\
    \ memory for all the fields, sets each of them to their zero value and returns\
    \ a pointer. (`*Circle`) More often we want to give each of the fields a value.\
    \ We can do this in two ways. Like this:\n\n```\nc := Circle{x: 0, y: 0, r: 5}\n\
    ```\n\nOr we can leave off the field names if we know the order they were defined:\n\
    \n```\nc := Circle{0, 0, 5}\n```\n\n#### Fields\n\nWe can access fields using\
    \ the `.` operator:\n\n```\nfmt.Println(c.x, c.y, c.r)\nc.x = 10\nc.y = 5\n```\n\
    \nLet's modify the `circleArea` function so that it uses a `Circle`:\n\n```\n\
    func circleArea(c Circle) float64 {\n    return math.Pi * c.r*c.r\n}\n```\n\n\
    In main we have:\n\n```\nc := Circle{0, 0, 5}\nfmt.Println(circleArea(c))\n```\n\
    \nOne thing to remember is that arguments are always copied in Go. If we attempted\
    \ to modify one of the fields inside of the `circleArea` function, it would not\
    \ modify the original variable. Because of this we would typically write the function\
    \ like this:\n\n```\nfunc circleArea(c *Circle) float64 {\n    return math.Pi\
    \ * c.r*c.r\n}\n```\n\nAnd change main:\n\n```\nc := Circle{0, 0, 5}\nfmt.Println(circleArea(&c))\n\
    ```\n\n### Methods\n\nAlthough this is better than the first version of this code,\
    \ we can improve it significantly by using a special type of function known as\
    \ a method:\n\n```\nfunc (c *Circle) area() float64 {\n    return math.Pi * c.r*c.r\n\
    }\n```\n\nIn between the keyword `func` and the name of the function we've added\
    \ a “receiver”. The receiver is like a parameter – it has a name and a type –\
    \ but by creating the function in this way it allows us to call the function using\
    \ the `.` operator:\n\n```\nfmt.Println(c.area())\n```\n\nThis is much easier\
    \ to read, we no longer need the `&` operator (Go automatically knows to pass\
    \ a pointer to the circle for this method) and because this function can only\
    \ be used with `Circle`s we can rename the function to just `area`.\n\nLet's do\
    \ the same thing for the rectangle:\n\n```\ntype Rectangle struct {\n    x1, y1,\
    \ x2, y2 float64\n}\nfunc (r *Rectangle) area() float64 {\n    l := distance(r.x1,\
    \ r.y1, r.x1, r.y2)\n    w := distance(r.x1, r.y1, r.x2, r.y1)\n    return l *\
    \ w\n}\n```\n\n`main` has:\n\n```\nr := Rectangle{0, 0, 10, 10}\nfmt.Println(r.area())\n\
    ```\n\n#### Embedded Types\n\nA struct's fields usually represent the has-a relationship.\
    \ For example a `Circle` has a `radius`. Suppose we had a person struct:\n\n```\n\
    type Person struct {\n    Name string\n}\nfunc (p *Person) Talk() {\n    fmt.Println(\"\
    Hi, my name is\", p.Name)\n}\n```\n\nAnd we wanted to create a new `Android` struct.\
    \ We could do this:\n\n```\ntype Android struct {\n    Person Person\n    Model\
    \ string\n}\n```\n\nThis would work, but we would rather say an Android is a Person,\
    \ rather than an Android has a Person. Go supports relationships like this by\
    \ using an embedded type. Also known as anonymous fields, embedded types look\
    \ like this:\n\n```\ntype Android struct {\n    Person\n    Model string\n}\n\
    ```\n\nWe use the type (`Person`) and don't give it a name. When defined this\
    \ way the `Person` struct can be accessed using the type name:\n\n```\na := new(Android)\n\
    a.Person.Talk()\n```\n\nBut we can also call any `Person` methods directly on\
    \ the `Android`:\n\n```\na := new(Android)\na.Talk()\n```\n\nThe is-a relationship\
    \ works this way intuitively: People can talk, an android is a person, therefore\
    \ an android can talk.\n\n### Interfaces\n\nYou may have noticed that we were\
    \ able to name the `Rectangle`'s `area` method the same thing as the `Circle`'s\
    \ `area` method. This was no accident. In both real life and in programming, relationships\
    \ like these are commonplace. Go has a way of making these accidental similarities\
    \ explicit through a type known as an Interface. Here is an example of a `Shape`\
    \ interface:\n\n```\ntype Shape interface {\n    area() float64\n}\n```\n\nLike\
    \ a struct an interface is created using the `type` keyword, followed by a name\
    \ and the keyword `interface`. But instead of defining fields, we define a “method\
    \ set”. A method set is a list of methods that a type must have in order to “implement”\
    \ the interface.\n\nIn our case both `Rectangle` and `Circle` have area methods\
    \ which return `float64`s so both types implement the `Shape` interface. By itself\
    \ this wouldn't be particularly useful, but we can use interface types as arguments\
    \ to functions:\n\n```\nfunc totalArea(shapes ...Shape) float64 {\n    var area\
    \ float64\n    for _, s := range shapes {\n        area += s.area()\n    }\n \
    \   return area\n}\n```\n\nWe would call this function like this:\n\n```\nfmt.Println(totalArea(&c,\
