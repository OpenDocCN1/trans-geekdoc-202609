    \n*   包名与它们所属的文件夹匹配。虽然有方法绕过这一点，但如果保持这种模式会要简单得多。\n\n## 文档\n\nGo 能够为我们编写的包自动生成文档，方式与标准包文档类似。在终端中运行此命令：\n\
    \n```\ngodoc golang-book/chapter11/math Average\n```\n\n你应该能看到为我们刚刚写的函数显示的信息。我们可以通过在函数之前添加注释来改进此文档：\n\
