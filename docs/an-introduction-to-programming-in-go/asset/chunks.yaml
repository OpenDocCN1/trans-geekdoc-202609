  trans: "\n\n在我们查看文件之前，我们需要先理解 Go 的 `io` 包。`io` 包包含了一些函数，但更多的是在其他包中使用的接口。其中两个主要的接口是\
    \ `Reader` 和 `Writer`。`Reader` 支持通过 `Read` 方法进行读取。`Writer` 支持通过 `Write` 方法进行写入。Go\
    \ 中的许多函数接受 `Reader` 或 `Writer` 作为参数。例如，`io` 包中有一个 `Copy` 函数，它可以将数据从 `Reader` 拷贝到\
    \ `Writer`：\n\n```\nfunc Copy(dst Writer, src Reader) (written int64, err error)\n\
    ```\n\n若要对 `[]byte` 或 `string` 进行读写，你可以使用在 `bytes` 包中找到 `Buffer` 结构体：\n\n```\n\
    var buf bytes.Buffer\nbuf.Write([]byte(\"test\"))\n```\n\n`Buffer` 不需要手动初始化，并且同时支持\
    \ `Reader` 和 `Writer` 接口。你可以通过调用 `buf.Bytes()` 将其转换为 `[]byte`。如果你只需要从字符串读取，也可以使用\
    \ `strings.NewReader` 函数，它比使用缓冲区更高效。\n\n### 文件与文件夹\n\n在 Go 中打开文件请使用 `os` 包中的 `Open`\
    \ 函数。以下是一个读取文件内容并在终端上显示的示例：\n\n```\npackage main\n\nimport (\n    \"fmt\"\n  \
    \  \"os\"\n)\n\nfunc main() {\n    file, err := os.Open(\"test.txt\")\n    if\
    \ err != nil {\n        // 在此处处理错误\n        return\n    }\n    defer file.Close()\n\
    \    \n    // 获取文件大小\n    stat, err := file.Stat()\n    if err != nil {\n    \
    \    return\n    }\n    // 读取文件\n    bs := make([]byte, stat.Size())\n    _, err\
    \ = file.Read(bs)\n    if err != nil {\n        return\n    }\n\n    str := string(bs)\n\
    \    fmt.Println(str)\n}\n```\n\n我们在打开文件后紧接着使用 `defer file.Close()`，以确保文件在函数完成后立即关闭。读取文件非常常见，因此有一种更短的方法：\n\
    \n```\npackage main\n\nimport (\n    \"fmt\"\n    \"io/ioutil\"\n)\n\nfunc main()\
    \ {\n    bs, err := ioutil.ReadFile(\"test.txt\")\n    if err != nil {\n     \
    \   return\n    }\n    str := string(bs)\n    fmt.Println(str)\n}\n```\n\n以下是如何创建一个文件：\n\
    \n```go\npackage main\n\nimport (\n    \"os\"\n)\n\nfunc main() {\n    file, err\
    \ := os.Create(\"test.txt\")\n    if err != nil {\n        // 在此处处理错误\n      \
    \  return\n    }\n    defer file.Close()\n\n    file.WriteString(\"test\")\n}\n\
    ```\n\n若要获取目录的内容，我们使用相同的 `os.Open` 函数，但给的是目录路径而不是文件名。然后我们调用 `Readdir` 方法：\n\n\
    ```go\npackage main\n\nimport (\n    \"fmt\"\n    \"os\"\n)\n\nfunc main() {\n\
    \    dir, err := os.Open(\".\")\n    if err != nil {\n        return\n    }\n\
    \    defer dir.Close()\n\n    fileInfos, err := dir.Readdir(-1)\n    if err !=\
    \ nil {\n        return\n    }\n    for _, fi := range fileInfos {\n        fmt.Println(fi.Name())\n\
    \    }\n}\n```\n\n我们通常想要递归地遍历文件夹（读取文件夹的内容、所有子文件夹、所有子子文件夹……）。为了方便这种操作，`path/filepath`\
    \ 包提供了一个 `Walk` 函数：\n\n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"os\"\
    \n    \"path/filepath\"\n)\n\nfunc main() {\n    filepath.Walk(\".\", func(path\
    \ string, info os.FileInfo, err error) error {\n        fmt.Println(path)\n  \
    \      return nil\n    })\n}\n```\n\n你传递给 `Walk` 的函数会在根文件夹（在本例中为 `.`）中的每个文件和文件夹中调用。\n\
    \n### 错误\n\nGo 有一个内置的错误类型，我们已经见过（`error` 类型）。我们可以通过使用 `errors` 包中的 `New` 函数来创建自己的错误：\n\
    \n```go\npackage main\n\nimport \"errors\"\n\nfunc main() {\n    err := errors.New(\"\
    error message\")\n}\n```\n\n### 容器与排序\n\n除了列表和 map，Go 在 `container` 包下还提供了几种集合。我们将以\
    \ `container/list` 包为例。\n\n#### 列表\n\n`container/list` 包实现了双向链表。链表是一种看起来如下所示的数据结构：\n\
    \n![](img/00011.jpeg)\n列表的每个节点包含一个值（在此例中为 1、2 或 3）和一个指向下一个节点的指针。由于这是双向链表，每个节点还会有一个指向上一个节点的指针。此列表可以通过以下程序创建：\n\
    \n```go\npackage main\n\nimport (\"fmt\" ; \"container/list\")\n\nfunc main()\
    \ {\n    var x list.List\n    x.PushBack(1)\n    x.PushBack(2)\n    x.PushBack(3)\n\
    \n    for e := x.Front(); e != nil; e = e.Next() {\n        fmt.Println(e.Value)\n\
    \    }\n}\n```\n\n"
- fmt: "\n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"crypto/sha1\"\n)\n\n\
    func main() {\n    h := sha1.New()\n    h.Write([]byte(\"test\"))\n    bs := h.Sum([]byte{})\n\
    \    fmt.Println(bs)\n}\n```\n\nThis example is very similar to the `crc32` one,\
    \ because both `crc32` and `sha1` implement the `hash.Hash` interface. The main\
    \ difference is that whereas `crc32` computes a 32 bit hash, `sha1` computes a\
    \ 160 bit hash. There is no native type to represent a 160 bit number, so we use\
    \ a slice of 20 bytes instead.\n\n## Servers\n\nWriting network servers in Go\
    \ is very easy. We will first take a look at how to create a TCP server:\n\n```go\n\
    package main\n\nimport (\n    \"encoding/gob\"\n    \"fmt\"\n    \"net\"\n)\n\n\
    func server() {\n    // listen on a port\n    ln, err := net.Listen(\"tcp\", \"\
    :9999\")\n    if err != nil {\n        fmt.Println(err)\n        return\n    }\n\
    \    for {\n        // accept a connection\n        c, err := ln.Accept()\n  \
    \      if err != nil {\n            fmt.Println(err)\n            continue\n \
    \       }\n        // handle the connection\n        go handleServerConnection(c)\n\
    \    }\n}\n\nfunc handleServerConnection(c net.Conn) {\n    // receive the message\n\
    \    var msg string\n    err := gob.NewDecoder(c).Decode(&msg)\n    if err !=\
    \ nil {\n        fmt.Println(err)\n    } else {\n        fmt.Println(\"Received\"\
    , msg)\n    }\n    \n    c.Close()\n}\n\nfunc client() {\n    // connect to the\
    \ server\n    c, err := net.Dial(\"tcp\", \"127.0.0.1:9999\")\n    if err != nil\
    \ {\n        fmt.Println(err)\n        return\n    }\n\n    // send the message\n\
    \    msg := \"Hello World\"\n    fmt.Println(\"Sending\", msg)\n    err = gob.NewEncoder(c).Encode(msg)\n\
    \    if err != nil {\n        fmt.Println(err)\n    }\n\n    c.Close()\n}\n\n\
    func main() {\n    go server()\n    go client()\n    \n    var input string\n\
    \    fmt.Scanln(&input)\n}\n```\n\nThis example uses the `encoding/gob` package\
    \ which makes it easy to encode Go values so that other Go programs (or the same\
    \ Go program in this case) can read them. Additional encodings are available in\
    \ packages underneath `encoding` (like `encoding/json`) as well as in 3rd party\
    \ packages. (for example we could use `labix.org/v2/mgo/bson` for bson support)\n\
    \n### HTTP\n\nHTTP servers are even easier to setup and use:\n\n```go\npackage\
    \ main\n\nimport (\"net/http\" ; \"io\")\n\nfunc hello(res http.ResponseWriter,\
    \ req *http.Request) {\n    res.Header().Set(\n        \"Content-Type\", \n  \
    \      \"text/html\",\n    )\n    io.WriteString(\n        res, \n        `<doctype\
    \ html>\n<html>\n    <head>\n        <title>Hello World</title>\n    </head>\n\
    \    <body>\n        Hello World!\n    </body>\n</html>`,\n    )\n}\nfunc main()\
    \ {\n    http.HandleFunc(\"/hello\", hello)\n    http.ListenAndServe(\":9000\"\
    , nil)\n}\n```\n\n`HandleFunc` handles a URL route (`/hello`) by calling the given\
    \ function. We can also handle static files by using `FileServer`:\n\n```go\n\
    http.Handle(\n    \"/assets/\", \n    http.StripPrefix(\n        \"/assets/\"\
    , \n        http.FileServer(http.Dir(\"assets\")),\n    ),\n)\n```\n\n### RPC\n\
    \nThe `net/rpc` (remote procedure call) and `net/rpc/jsonrpc` packages provide\
    \ an easy way to expose methods so they can be invoked over a network. (rather\
    \ than just in the program running them)\n\n```go\npackage main\n\nimport (\n\
    \    \"fmt\"\n    \"net\"\n    \"net/rpc\"\n)\n\ntype Server struct {}\nfunc (this\
    \ *Server) Negate(i int64, reply *int64) error {\n    *reply = -i\n    return\
    \ nil\n}\n\nfunc server() {\n    rpc.Register(new(Server))\n    ln, err := net.Listen(\"\
    tcp\", \":9999\")\n    if err != nil {\n        fmt.Println(err)\n        return\n\
    \    }\n    for {\n        c, err := ln.Accept()\n        if err != nil {\n  \
    \          continue\n        }\n        go rpc.ServeConn(c)\n    }\n}\nfunc client()\
    \ {\n    c, err := rpc.Dial(\"tcp\", \"127.0.0.1:9999\")\n    if err != nil {\n\
    \        fmt.Println(err)\n        return\n    }\n    var result int64\n    err\
    \ = c.Call(\"Server.Negate\", int64(999), &result)\n    if err != nil {\n    \
    \    fmt.Println(err)\n    } else {\n        fmt.Println(\"Server.Negate(999)\
    \ =\", result)\n    }\n}\nfunc main() {\n    go server()\n    go client()\n  \
    \  \n    var input string\n    fmt.Scanln(&input)\n}\n```\n\nThis example is very\
    \ similar to the `crc32` one, because both `crc32` and `sha1` implement the `hash.Hash`\
    \ interface. The main difference is that whereas `crc32` computes a 32 bit hash,\
    \ `sha1` computes a 160 bit hash. There is no native type to represent a 160 bit\
    \ number, so we use a slice of 20 bytes instead.\n"
