    \ that are passed on the channel (in this case we are passing strings). The `<-`\
    \ (left arrow) operator is used to send and receive messages on the channel. `c\
    \ <- ``\"ping\"` means send `\"ping\"`. `msg := <- c` means receive a message\
    \ and store it in `msg`. The `fmt` line could also have been written like this:\
    \ `fmt.Println(<-c)` in which case we could remove the previous line.\n\nUsing\
    \ a channel like this synchronizes the two goroutines. When `pinger` attempts\
    \ to send a message on the channel it will wait until `printer` is ready to receive\
    \ the message. (this is known as blocking) Let's add another sender to the program\
    \ and see what happens. Add this function:\n\n```\nfunc ponger(c chan string)\
    \ {\n    for i := 0; ; i++ {\n        c <- \"pong\"\n    }\n}\n```\n\nAnd modify\
    \ `main`:\n\n```\nfunc main() {\n    var c chan string = make(chan string)\n \
    \   \n    go pinger(c)\n    go ponger(c)\n    go printer(c)\n    \n    var input\
    \ string\n    fmt.Scanln(&input)\n}\n```\n\nThe program will now take turns printing\
    \ “ping” and “pong”.\n\n#### Channel Direction\n\nWe can specify a direction on\
    \ a channel type thus restricting it to either sending or receiving. For example\
    \ pinger's function signature can be changed to this:\n\n```\nfunc pinger(c chan<-\
    \ string)\n```\n\nNow `c` can only be sent to. Attempting to receive from c will\
    \ result in a compiler error. Similarly we can change printer to this:\n\n```\n\
    func printer(c <-chan string)\n```\n\nA channel that doesn't have these restrictions\
    \ is known as bi-directional. A bi-directional channel can be passed to a function\
    \ that takes send-only or receive-only channels, but the reverse is not true.\n\
    \n#### Select\n\nGo has a special statement called `select` which works like a\
    \ `switch` but for channels:\n\n```\nfunc main() {\n    c1 := make(chan string)\n\
    \    c2 := make(chan string)\n    \n    go func() {\n        for {\n         \
    \   c1 <- \"from 1\"\n            time.Sleep(time.Second * 2)\n        }\n   \
    \ }()\n    go func() {\n        for {\n            c2 <- \"from 2\"\n        \
    \    time.Sleep(time.Second * 3)\n        }\n    }()\n    go func() {\n      \
    \  for {\n            select {\n            case msg1 := <- c1:\n            \
    \    fmt.Println(msg1)\n            case msg2 := <- c2:\n                fmt.Println(msg2)\n\
    \            }\n        }\n    }()\n    \n    var input string\n    fmt.Scanln(&input)\n\
    }\n```\n\nThis program prints “from 1” every 2 seconds and “from 2” every 3 seconds.\
    \ `select` picks the first channel that is ready and receives from it (or sends\
    \ to it). If more than one of the channels are ready then it randomly picks which\
    \ one to receive from. If none of the channels are ready, the statement blocks\
    \ until one becomes available.\n\nThe `select` statement is often used to implement\
    \ a timeout:\n\n```\nselect {\ncase msg1 := <- c1:\n    fmt.Println(\"Message\
    \ 1\", msg1)\ncase msg2 := <- c2:\n    fmt.Println(\"Message 2\", msg2)\ncase\
    \ <- time.After(time.Second):\n    fmt.Println(\"timeout\")\n}\n```\n\n`time.After`\
    \ creates a channel and after the given duration will send the current time on\
    \ it. (we weren't interested in the time so we didn't store it in a variable)\
    \ We can also specify a `default` case:\n\n```\nselect {\ncase msg1 := <- c1:\n\
    \    fmt.Println(\"Message 1\", msg1)\ncase msg2 := <- c2:\n    fmt.Println(\"\
    Message 2\", msg2)\ncase <- time.After(time.Second):\n    fmt.Println(\"timeout\"\
    )\ndefault:\n    fmt.Println(\"nothing ready\")\n}\n```\n\nThe default case happens\
    \ immediately if none of the channels are ready.\n\n#### Buffered Channels\n\n\
    It's also possible to pass a second parameter to the make function when creating\
    \ a channel:\n\n```\nc := make(chan int, 1)\n```\n\nThis creates a buffered channel\
    \ with a capacity of 1. Normally channels are synchronous; both sides of the channel\
    \ will wait until the other side is ready. A buffered channel is asynchronous;\
    \ sending or receiving a message will not wait unless the channel is already full.\n\
    \n#### Problems\n\n*   How do you specify the direction of a channel type?\n\n\
    *   Write your own `Sleep` function using `time.After`.\n\n*   What is a buffered\
    \ channel? How would you create one with a capacity of 20?\n\n## Packages\n\n\
    Go was designed to be a language that encourages good software engineering practices.\
    \ An important part of high quality software is code reuse – embodied in the principle\
    \ “Don't Repeat Yourself.”\n\nAs we saw in chapter 7 functions are the first layer\
    \ we turn to allow code reuse. Go also provides another mechanism for code reuse:\
    \ packages. Nearly every program we've seen so far included this line:\n\n```\n\
    import \"fmt\"\n```\n\n`fmt` is the name of a package that includes a variety\
    \ of functions related to formatting and output to the screen. Bundling code in\
    \ this way serves 3 purposes:\n\n*   It reduces the chance of having overlapping\
    \ names. This keeps our function names short and succinct\n\n*   It organizes\
    \ code so that its easier to find code you want to reuse.\n\n*   It speeds up\
    \ the compiler by only requiring recompilation of smaller chunks of a program.\
    \ Although we use the package `fmt`, we don't have to recompile it every time\
    \ we change our program.\n\n### Creating Packages\n\nPackages only really make\
    \ sense in the context of a separate program which uses them. Without this separate\
    \ program we have no way of using the package we create. Let's create an application\
    \ that will use a package we will write. Create a folder in `~/Go/src/golang-book`\
    \ called `chapter11`. Inside that folder create a file called `main.go` which\
    \ contains this:\n\n```\npackage main\n\nimport \"fmt\"\nimport \"golang-book/chapter11/math\"\
    \n\nfunc main() {\n    xs := []float64{1,2,3,4}\n    avg := math.Average(xs)\n\
    \    fmt.Println(avg)\n}\n```\n\nNow create another folder inside of the `chapter11`\
    \ folder called `math`. Inside of this folder create a file called `math.go` that\
    \ contains this:"
