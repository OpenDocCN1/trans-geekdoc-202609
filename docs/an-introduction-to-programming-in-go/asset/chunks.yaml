- fmt: "\nFor windows the installer will install the `Scite` text editor. You can\
    \ open it by going to Start → All Programs → Go → `Scite`. You should see something\
    \ like this:\n\n![](images/00006.jpeg)\n\nThe text editor contains a large white\
    \ text area where text can be entered. To the left of this text area you can see\
    \ the line numbers. At the bottom of the window is a status bar which displays\
    \ information about the file and your current location in it (right now it says\
    \ that we are on line 1, column 1, text is being inserted normally, and we are\
    \ using windows-style newlines).\n\nYou can open files by going to File → Open\
    \ and browsing to your desired file. Files can be saved by going to File → Save\
    \ or File → Save As.\n\nAs you work in a text editor it is useful to learn keyboard\
    \ shortcuts. The menus list the shortcuts to their right. Here are a few of the\
    \ most common:\n\n- `Ctrl + S` – save the current file\n- `Ctrl + X` – cut the\
    \ currently selected text (remove it and put it in your clipboard so it can be\
    \ pasted later)\n- `Ctrl + C` – copy the currently selected text\n- `Ctrl + V`\
    \ – paste the text currently in the clipboard\n- Use the arrow keys to navigate,\
    \ `Home` to go to the beginning of the line and `End` to go to the end of the\
    \ line\n- Hold down `shift` while using the arrow keys (or `Home` and `End`) to\
    \ select text without using the mouse\n- `Ctrl + F` – brings up a find in file\
    \ dialog that you can use to search the contents of a file\n\n### OSX\n\nFor OSX\
    \ the installer installs the `Text Wrangler` text editor:\n\n![](images/00007.jpeg)\n\
    \nLike Scite on Windows Text Wrangler contains a large white area where text is\
    \ entered. Files can be opened by going to File → Open. Files can be saved by\
    \ going to File → Save or File → Save As. Here are some useful keyboard shortcuts:\
    \ (Command is the ⌘ key)\n\n- `Command + S` – save the current file\n- `Command\
    \ + X` – cut the currently selected text (remove it and put it in your clipboard\
    \ so it can be pasted later)\n- `Command + C` – copy the currently selected text\n\
    - `Command + V` – paste the text currently in the clipboard\n- Use the arrow keys\
    \ to navigate\n- `Command + F` – brings up a find in file dialog that you can\
    \ use to search the contents of a file\n\n### Go Tools\n\nGo is a compiled programming\
    \ language, which means source code (the code you write) is translated into a\
    \ language that your computer can understand. Therefore before we can write a\
    \ Go program, we need the Go compiler.\n\nThe installer will setup Go for you\
    \ automatically. We will be using version 1 of the language. (More information\
    \ can be found at [http://www.golang.org](http://www.golang.org))\n\nLet's make\
    \ sure everything is working. Open up a terminal and type the following:\n\n```\n\
    go version\n```\n\nYou should see the following:\n\n```\ngo version go1.0.2\n\
    ```\n\nYour version number may be slightly different. If you get an error about\
    \ the command `go` not being recognized try restarting your computer.\n\nThe Go\
    \ tool suite is made up of several different commands and sub-commands. A list\
    \ of those commands is available by typing:\n\n```\ngo help\n```\n\nWe will see\
    \ how they are used in subsequent chapters.\n\n## Your First Program\n\nTraditionally\
    \ the first program you write in any programming language is called a “Hello World”\
    \ program – a program that simply outputs `Hello World` to your terminal. Let's\
    \ write one using Go.\n\nFirst create a new folder where we can store our program.\
    \ The installer you used in chapter 1 created a folder in your home directory\
    \ named `Go`. Create a folder named `~/Go/src/golang-book/chapter2`. (Where `~`\
    \ means your home directory) From the terminal you can do this by entering the\
    \ following commands:\n\n```\nmkdir Go/src/golang-book\nmkdir Go/src/golang-book/chapter2\n\
    ```\n\nUsing your text editor type in the following:\n\n```go\npackage main\n\n\
    import \"fmt\"\n\n// this is a comment\n\nfunc main() {\n    fmt.Println(\"Hello\
    \ World\")\n}\n```\n\nMake sure your file is identical to what is shown here and\
    \ save it as `main.go` in the folder we just created. Open up a new terminal and\
    \ type in the following:\n\n```\ncd Go/src/golang-book/chapter2\ngo run main.go\n\
    ```\n\nYou should see `Hello World` displayed in your terminal. The `go run` command\
    \ takes the subsequent files (separated by spaces), compiles them into an executable\
    \ saved in a temporary directory and then runs the program. If you didn't see\
    \ `Hello World` displayed you may have made a mistake when typing in the program.\
    \ The Go compiler will give you hints about where the mistake lies. Like most\
    \ compilers, the Go compiler is extremely pedantic and has no tolerance for mistakes.\n\
    \n### How to Read a Go Program\n\nLet's look at this program in more detail. Go\
    \ programs are read top to bottom, left to right. (like a book) The first line\
    \ says this:\n\n```\npackage main\n```\n\nThis is known as a “package declaration”.\
    \ Every Go program must start with a package declaration. Packages are Go's way\
    \ of organizing and reusing code. There are two types of Go programs: executables\
    \ and libraries. Executable applications are the kinds of programs that we can\
    \ run directly from the terminal. (in Windows they end with `.exe`). Libraries\
    \ are collections of code that we package together so that we can use them in\
    \ other programs. We will explore libraries in more detail later, for now just\
    \ make sure to include this line in any program you write.\n\nThe next line is\
    \ a blank line. Newlines, spaces and tabs are known as whitespace (because you\
    \ can't see them). Go mostly doesn't care about whitespace, You could remove this\
    \ line and the program would behave in exactly the same way.\n\nThen we see this:\n\
    \n```\nimport \"fmt\"\n```\n\nThe `import` keyword is how we include code from\
    \ other packages. The `fmt` package (shorthand for format) implements formatting\
    \ for input and output. Given what we just learned about packages what do you\
    \ think the `fmt` package's files would contain at the top of them?\n\nNotice\
    \ that `fmt` above is surrounded by double quotes. The use of double quotes like\
    \ this is known as a “string literal” which is a type of “expression”. In Go strings\
    \ represent a sequence of characters (letters, numbers, symbols, ...) of a definite\
    \ length. Strings are described in more detail in the next chapter, but for now\
    \ the important thing to keep in mind is that an opening `\"` character must eventually\
    \ be followed by another `\"` character and anything between the two is included\
    \ in the string. (The `\"` character itself is not part of the string)\n\nThe\
    \ line that starts with `//` is known as a comment. Comments are ignored by the\
    \ Go compiler and are there for your own sake (or whoever picks up the source\
    \ code for your program). Go supports two different styles of comments: `//` comments\
    \ in which all the text between the `//` and the end of the line is part of the\
    \ comment and `/* */` comments where everything between the `*`s is part of the\
    \ comment. (And may include multiple lines)\n\nAfter this you see a function declaration:\n\
    \n```go\nfunc main() {\n    fmt.Println(\"Hello World\")\n}\n```\n\nFunctions\
    \ are the building blocks of a Go program. They have inputs, outputs and a series\
    \ of steps called statements which are executed in order. All functions start\
    \ with the keyword `func` followed by the name of the function (`main` in this\
    \ case), a list of zero or more “parameters” surrounded by parentheses, an optional\
    \ return type and a “body” which is surrounded by curly braces. This function\
    \ has no parameters, doesn't return anything and has only one statement. The name\
    \ `main` is special because it's the function that gets called when you execute\
    \ the program.\n\nThe final piece of our program is this line:\n\n```go\n    fmt.Println(\"\
    Hello World\")\n```\n"
