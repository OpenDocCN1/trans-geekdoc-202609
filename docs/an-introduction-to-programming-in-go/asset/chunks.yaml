    #### Arrays, Slices and Maps\n\n（注：原文文本在此处出现了大量重复的描述，此处已根据原文翻译）\n"
- fmt: "\nGo also provides a shorter syntax for creating arrays:\n\n```\nx := [5]float64{\
    \ 98, 93, 77, 82, 83 }\n```\n\nWe no longer need to specify the type because Go\
    \ can figure it out. Sometimes arrays like this can get too long to fit on one\
    \ line, so Go allows you to break it up like this:\n\n```\nx := [5]float64{ \n\
    \    98, \n    93, \n    77, \n    82, \n    83,\n}\n```\n\nNotice the extra trailing\
    \ `,` after `83`. This is required by Go and it allows us to easily remove an\
    \ element from the array by commenting out the line:\n\n```\nx := [4]float64{\
    \ \n    98, \n    93, \n    77, \n    82, \n    // 83,\n}\n```\n\n### Slices\n\
    \nA slice is a segment of an array. Like arrays slices are indexable and have\
    \ a length. Unlike arrays this length is allowed to change. Here's an example\
    \ of a slice:\n\n```\n var x []float64\n```\n\nThe only difference between this\
    \ and an array is the missing length between the brackets. In this case `x` has\
    \ been created with a length of `0`.\n\nIf you want to create a slice you should\
    \ use the built-in `make` function:\n\n```\nx := make([]float64, 5)\n```\n\nThis\
    \ creates a slice that is associated with an underlying `float64` array of length\
    \ 5. Slices are always associated with some array, and although they can never\
    \ be longer than the array, they can be smaller. The `make` function also allows\
    \ a 3rd parameter:\n\n```\nx := make([]float64, 5, 10)\n```\n\n10 represents the\
    \ capacity of the underlying array which the slice points to:\n\n![](images/00008.jpeg)Another\
    \ way to create slices is to use the `[low : high]` expression:\n\n```\narr :=\
    \ [5]float64{1,2,3,4,5}\nx := arr[0:5]\n```\n\n`low` is the index of where to\
    \ start the slice and `high` is the index where to end it (but not including the\
    \ index itself). For example while `arr[0:5]` returns `[1,2,3,4,5]`, `arr[1:4]`\
