    \ float64 {\n    var area float64\n    for _, s := range m.shapes {\n        area\
    \ += s.area()\n    }\n    return area\n}\n```\n\nNow a `MultiShape` can contain\
    \ `Circle`s, `Rectangle`s or even other `MultiShape`s.\n\n#### Problems\n\n* \
    \  What's the difference between a method and a function?\n\n*   Why would you\
