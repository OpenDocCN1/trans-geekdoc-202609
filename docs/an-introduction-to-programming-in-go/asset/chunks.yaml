  trans: "\n该程序包含两个 goroutine（协程）。第一个 goroutine 是隐式的，即 `main` 函数本身。第二个 goroutine 在我们调用\
    \ `go f(0)` 时被创建。通常情况下，当我们调用一个函数时，程序会执行函数中的所有语句，然后返回到调用位置的下一行。使用 goroutine 时，我们会立即返回到下一行，而不需要等待函数完成。这就是为什么代码中包含了对\
    \ `Scanln` 函数的调用；如果没有包含它，程序将在获得机会打印所有数字之前就会退出。\n\nGoroutine 是轻量级的，我们可以轻松地创建成千上万个它们。我们可以通过以下方式修改程序来运行\
    \ 10 个 goroutine：\n\n```\nfunc main() {\n    for i := 0; i < 10; i++ {\n     \
    \   go f(i)\n    }\n    var input string\n    fmt.Scanln(&input)\n}\n```\n\n你可能已经注意到，当你运行这个程序时，goroutine\
    \ 似乎是按顺序运行的，而不是同时运行。让我们使用 `time.Sleep` 和 `rand.Intn` 给函数添加一些延迟：\n\n```\npackage\
    \ main\n\nimport (\n    \"fmt\"\n    \"time\"\n    \"math/rand\"\n)\n\nfunc f(n\
    \ int) {\n    for i := 0; i < 10; i++ {\n        fmt.Println(n, \":\", i)\n  \
    \      amt := time.Duration(rand.Intn(250))\n        time.Sleep(time.Millisecond\
    \ * amt)\n    }\n}\nfunc main() {\n    for i := 0; i < 10; i++ {\n        go f(i)\n\
    \    }\n    var input string\n    fmt.Scanln(&input)\n}\n```\n\n`f` 打印从 0 到 10\
    \ 的数字，在每个数字之间等待 0 到 250 毫秒。现在 goroutine 应该是同时运行的。\n\n### 通道 (Channels)\n\n通道为两个\
    \ goroutine 之间提供了通信和同步执行的方法。这里是一个使用通道的示例程序：\n\n```\npackage main\n\nimport (\n\
    \    \"fmt\"\n    \"time\"\n)\n\nfunc pinger(c chan string) {\n    for i := 0;\
    \ ; i++ {\n        c <- \"ping\"\n    }\n}\nfunc printer(c chan string) {\n  \
    \  for {\n        msg := <- c\n        fmt.Println(msg)\n        time.Sleep(time.Second\
    \ * 1)\n    }\n}\nfunc main() {\n    var c chan string = make(chan string)\n \
    \   \n    go pinger(c)\n    go printer(c)\n    \n    var input string\n    fmt.Scanln(&input)\n\
    }\n```\n\n这个程序将无限打印“ping”（按回车键停止）。通道类型用关键字 `chan` 表示，后面跟着通道上传递的数据类型（在本例中我们传递的是字符串）。`<-`（左箭头）运算符用于在通道上发送和接收消息。`c\
    \ <- \"ping\"` 意味着发送 `\"ping\"`。`msg := <- c` 意味着接收消息并存储在 `msg` 中。`fmt` 那行也可以写成这样：`fmt.Println(<-c)`，那样我们就可以去掉之前的那行。\n\
    \n使用像这样的通道可以同步两个 goroutine。当 `pinger` 尝试在通道上发送消息时，它将等待直到 `printer` 准备好接收消息（这被称为阻塞）。让我们向程序中添加另一个发送者并看看发生了什么。\n\
    \n```\nfunc ponger(c chan string) {\n    for i := 0; ; i++ {\n        c <- \"\
    pong\"\n    }\n}\n```\n\n并修改 `main`：\n\n```\nfunc main() {\n    var c chan string\
    \ = make(chan string)\n    \n    go pinger(c)\n    go ponger(c)\n    go printer(c)\n\
    \    \n    var input string\n    fmt.Scanln(&input)\n}\n```\n\n程序现在会交替打印“ping”和“pong”。\n\
    \n#### 通道方向 (Channel Direction)\n\n我们可以在创建通道时指定通道的方向，限制其只能发送或接收。例如，`pinger` 的签名可以更改为：\n\
    \n```\nfunc pinger(c chan<- string)\n```\n\n这样通道只能用于发送。尝试从该通道接收将导致错误。同样，可以将 `printer`\
    \ 更改为：\n\n```go\nfunc printer(c <-chan string)\n```\n\n#### Select 语句 (Select)\n\
    \nGo 有一个特殊的 `select` 语句，它的工作方式类似于 `switch`，但专门用于通道操作。它会阻塞，直到其中一个 `case` 可以被执行。例如：\n\
    \n```go\nfunc main() {\n    c := make(chan string)\n    go pinger(c)\n    go ponger(c)\n\
    \n    select {\n    case msg := <-c:\n        fmt.Println(msg)\n    }\n}\n```\n\
    \n`select` 语句允许同时等待多个通道操作。如果多个通道都准备就绪，它会随机选择一个来执行。它还可以配合 `default` 使用，以便在没有通道准备就绪时执行特定代码：\n\
    \n```go\nselect {\ncase msg := <-c:\n    fmt.Println(msg)\ndefault:\n    fmt.Println(\"\
    没有通道就绪\")\n}\n```\n"
