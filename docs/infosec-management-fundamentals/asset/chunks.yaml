    Security controls are not one size fits all from one organization to the next.
    An organization that’s very risk averse is going to be more locked down. They’re
    likely going to implement a larger number of information security controls, and
    the quality of the controls they implement is going to be greater. However, they’re
    also going to invest more time and resources into both implementing and maintaining
    those security controls, time, and resources that many smaller organizations don’t
    have.


    If you’re working within a smaller organization, your leadership may be more willing
    to accept certain risks, more willing to take chances for the sake of competing
    and building out a customer base. Even smaller organizations will find value in
    these controls, but it’s important for you to approach them with an understanding
    of the level of quality that is appropriate for your organization.


    I found that a clearly defined approach to risk management, one where business
    leaders and security professionals openly discuss the bad things that could to
    happen and what steps the organization is willing to take in order to prepare
    for and respond when those bad things happen, is going to impact the control selection
    that you make from that `ISO/IEC` control set.


    ![](images/F000027u02-02-9780128041727.jpg)


    How do we get from this concept of a document, a published standard or framework
    to an actual implemented functional information security program? In my experience,
    it can be accomplished via a relatively simple process.


    The first step (and this is very difficult for a number of IT folks, but we need
    to do it anyway) is to get out from behind our desks and ask questions. If you
    want to be successful in implementing an information security program you need
    to speak with people not only in IT, but in the business all throughout the organization.
    Throughout this material, I’m going to give you guidance regarding questions you
    can ask in order to identify which controls are appropriate for your organization.
    Once you’ve had those discussions, that Q&A session, you’re going to begin building
    a project list of controls that you’ve identified to be appropriate for your organization
    given your risk appetite. With that list in hand, you’ll be able to discuss your
    desired level of quality, as well as project timelines for implementation activities.
    How soon do we need to make these changes? How much are we willing to spend? How
    many people do we need to support the changes?


    That checklist that results from your discussions will be your starting point.
    It’s from that checklist that you’re going to drive all of the changes that you
    make. In the end, it’s about the level of trust you’re placing in your employees,
    your partners, and your suppliers, as well as the discipline that you, within
    your organization, are willing to adhere to in order to ensure that those controls
    are implemented and maintained.


    ![](images/F000027u02-03-9780128041727.jpg)


    When implementing an information security controls framework, the `Plan-Do-Check-Act`
    model is incredibly appropriate. It worked extremely well in the organizations
    that I was working in.


    In the `Plan` phase, you discuss which controls are relevant. You have the conversations,
    and you begin identifying changes that you intend to make in your organization
    in order to improve your security posture.


    The `Do` phase is where those discussions transform into implementation projects.
    We develop project plans, we decide on project budgets, and we allocate resources
    who will actively spend time on implementing and maintaining these controls.


    Once those projects are complete, once the controls have been implemented, you
    move onto the `Check` phase. This is where you validate whether or not the controls
    were implemented correctly. The `IT Audit` department plays a key role in this
    phase, as do external consultants.


    I’ve worked with an organization who felt they had a terrific patching program
    in place and that they were doing an excellent job of identifying and remediating
    vulnerabilities. During one engagement, I discovered a critical (exploitable)
    vulnerability on one of the systems that stored sensitive information. When I
    presented this finding to the organization, they performed their own investigation
    and determined that the system fully patched and that my finding was incorrect.
    We were using different security tools and processes to evaluate technical vulnerabilities
    on the target system, and we disagreed over which finding was correct, and (more
    importantly) whether or not the vulnerability was even present.


    The `Act` phase, that fourth component of this cycle, is where you identify new
    controls (or perhaps controls you hadn’t yet discussed) and make proposals to
    implement those controls, which will take you back to the beginning `Plan-Do-Check-Act`
    model.


    Of course, the model here is cyclical. It’s intended to be a continuous process
    because information security is not a destination; it’s a journey. At no point
    will you achieve an absolutely secure set of controls, impervious to every attack.
    Threats will continue to evolve, as will the capability set of the attacker.


    It’s important for us to continually visit this `Plan-Do-Check-Act` cycle to ensure
    that the controls we’ve implemented are correct.


    # Chapter 3: Risk Management


    Chapter 3 covers risk management, the umbrella under which all of controls are
    identified and ultimately implemented. Several key questions are then presented.


    ### Keywords

    `NIST`; `factor analysis of information risk (FAIR)`


    ![](images/F000039u03-01-9780128041727.jpg)


    I mentioned that risk management is an umbrella under which all of these controls
    are identified and ultimately implemented. The first questions you should ask,
    and you can ask this of anyone, nontechnical or technical, are:


    What could go wrong at our organization?


    What are the bad things that can happen that we’re worried about?


    It’s important that you have an open, honest conversation about the risks most
    likely to impact your organization, based on incidents that have happened within
    your industry, as well as incidents that may have happened within your organization
    in the past.


    Once you begin identifying and articulating those concerns and fears, the next
    questions you should ask are:

    '
  trans: '


    * 密码学

    * 物理与环境安全管理

    * 安全运营管理

    * 通信安全管理

    * 系统获取、开发与维护

    * 供应商安全管理

    * 信息安全事件管理

    * 业务连续性管理

    * 合规性管理


    安全控制在不同组织之间并非一律的。一个非常规避风险的组织其管控会更加严密。他们可能会实施大量的信息安全控制，而且他们所实施的控制质量也会更高。然而，他们还将投入更多的时间和资源来实施和维护这些安全控制，而这些时间和资源是许多较小组织所不具备的。


    如果你在一个规模较小的组织内工作，领导层可能更愿意接受某些风险，更愿意为了竞争和建立客户群而冒险。即使是规模更小的组织也能发现这些控制的价值，但对你来说，以理解适用于你组织的质量水平来对待它们是非常重要的。


    我发现，一个清晰定义的风险管理方法——即业务领导者和安全人员公开讨论可能发生的坏事，以及组织为了在这些坏事发生时做好准备和响应而愿意采取的步骤——将影响你从
    `ISO/IEC` 控制集中集所做的控制选择。


    ![](img/F000027u02-02-9780128041727.jpg)


    我们如何从这种文档、已发布的标准或框架的概念转变为一个实际实施的功能性信息安全计划？根据我的经验，这可以通过一个相对简单的过程来实现。


    第一步（对于许多 IT 人员来说这非常困难，但我们必须这样做）是离开你的办公桌去提问。如果你想在实施信息安全计划方面取得成功，你不仅需要与 IT 部门的人交流，还需要与整个组织中业务部门的人交流。在这些材料中，我将就你可以提出的问题提供指导，以确定哪些控制适用于你的组织。一旦你完成了这些讨论，即那次问答环节，你将开始构建一个项目列表，根据你的风险偏好，列出你识别出的适用于你组织的控制。有了这份列表，你就可以讨论期望的质量水平，以及实施活动的项目时间表。我们需要多快进行这些更改？我们愿意花多少钱？我们需要多少人支持这些变化？


    由你的讨论得出的清单将是你的起点。你将根据该清单驱动你所做的所有更改。最终，这取决于你对员工、合作伙伴和供应商的信任程度，以及你在组织内部愿意遵守的纪律，以确保这些控制得到实施和维护。


    ![](img/F000027u02-03-9780128041727.jpg)


    在实施信息安全控制框架时，`Plan-Do-Check-Act`（计划-执行-检查-处理）模型非常适用。它在我工作的组织效果非常好。


    在 `Plan`（计划）阶段，你讨论哪些控制相关的。你进行对话，并开始识别你为了提高安全态势打算在组织中进行的更改。


    `Do`（执行）阶段是这些讨论转化为实施项目的阶段。我们制定项目计划，决定项目预算，并分配将积极花时间实施和维护这些控制的人员。


    一旦这些项目完成，一旦控制实施，你就进入了 `Check`（检查）阶段。在这里，你验证控制是否实施正确。`IT Audit`（IT 审计）部门在这个阶段起着关键作用，外部顾问也是如此。


    我曾与一个组织合作，他们认为自己有一套非常完美的补丁计划，并且在识别和修复漏洞方面做得非常出色。在一次任务中，我在一个存储敏感信息的系统中发现了一个关键的（可利用）漏洞。当我向组织展示这一发现时，他们进行了自己的调查，并确定系统已完全修补，认为我的发现是不正确的。我们使用了不同的安全工具来评估漏洞，并对漏洞是否存在产生了争议。


    `Act`（处理）阶段是该循环的第四部分，在这里你识别新的控制（可能是你尚未讨论的控制），并提出实施这些控制的建议，这将回到最初的 `Plan-Do-Check-Act`
    模型。


    当然，这个模型是循环的。它旨在作为一个持续的过程，因为信息安全不是终点，而是一个旅程。你永远无法获得一个能够免疫所有攻击的绝对控制集。威胁将继续进化，攻击者的能力也是如此。


    我们需要不断访问这个 `Plan-Do-Check-Act` 循环，以确保我们实施的控制是正确的。


    # 第 3 章：风险管理


    第 3 章涵盖了风险管理，这是识别并最终实施所有控制的伞。。随后提出了几个关键问题。


    ### 关键词

    `NIST`; `信息风险因素分析 (FAIR)`


    ![](img/F000039u03-01-9780128041727.jpg)


    我提到过风险管理是识别并最终实施所有控制的伞。你应该提出的第一个问题（而且你可以向任何人提问，无论是技术人员还是非技术人员）是：


    我们的组织可能会发生什么问题？


    我们担心的坏事可能发生哪些？


    重要的是，根据行业内发生的事件以及你的组织过去可能发生的事件，就最可能影响你组织的风险进行一次开放、诚实的的对话。


    一旦你开始识别并表达这些担忧和恐惧，下一个问题应该是：


