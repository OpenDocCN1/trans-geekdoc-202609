  fmt: '

    The CSSF contains what I consider to be the top three controls in each of seven
    key areas. If an organization does not currently maintain these 21 controls, then
    asking any additional security questions is a waste of both your time and theirs.


    IT Security Career is designed to help aspiring information security professionals
    find open positions in the field because, again, I cannot overstate the importance
    of finding and employing qualified professionals.


    ![](images/F000192u19-04-9780128041727.jpg)


    If you’ve not had that field experience, there are multiple professional organizations
    that you can participate in to begin learning the ropes and to network with current
    information security professionals. ISSA, ISACA, SANS, InfraGard, and OWASP all
    have local chapters in multiple cities around the world, and you may find one
    or more of these organizations in your own city. ISC^2, which I don’t have on
    the list here, is starting chapters throughout the world, so you may have even
    one more professional organization to consider.


    You may have local organizations as well, organizations that don’t have a national
    or international footprint. For example, in Indianapolis, Indiana, there is an
    organization known as the Indiana Security and Privacy Network (INSPN), this gathering
    of information security and audit professionals is very well-attended, and the
    information they share is very helpful to all those who attend.


    ## Chapter 20


    # Conclusion


    This chapter encourage readers to use the additional resources provided and to
    participate in local professional organizations.


    ### Keywords


    ISO 27000 series; Information Security Professional


    I hope this book has provided you with the information you need to improve your
    information security program, and to take the next step in your career as an information
    security professional. I strongly encourage you to dig into the additional resources,
    to participate in local professional organizations, and to do you can to help
    us continue to secure organizations around the world.


    Thanks much for all you do!

    '
  trans: '

    CSSF 包含了我认为的七个关键领域中每个领域最重要的三项控制措施。如果一个机构没有维护这 21 项控制措施，那么询问任何额外的安全问题都是在浪费你和他们的时间。


    《IT 安全职业》旨在帮助有志成为信息安全专业人士的人寻找领域的工作机会，因为我再如何强调寻找和聘用合格专业人士的重要性都不为过。


    ![](img/F000192u19-04-9780128041727.jpg)


    如果你还没有该领域的实战经验，可以参加多个专业组织来开始学习业务，并与现任信息安全专业人士建立人脉。ISSA、ISACA、SANS、InfraGard 和
    OWASP 在全球多个城市都设有当地分会，你可能在自己的城市找到其中一个或多个组织。ISC²（我没有在这里列出它）也正在在全球范围内成立分会，因此你可能还有更多可以考虑的专业组织。


    你可能还会有当地组织，即那些没有全国或国际影响力的组织。例如，在印第安纳州州的印第安纳波利斯，有一个名为印第安纳安全与隐私网络（INSPN）的组织，这个信息安全和审计专业人士的聚会人数非常多，他们分享的信息对所有参与者都非常有帮助。


    ## 第 20 章


    # 结


    本章鼓励读者使用提供的额外资源并参加当地的专业组织。


    ### 关键词


    ISO 27000 系列；信息安全专业人士


    我希望这本书提供了改进信息安全计划所需的信息，并帮助你作为信息安全专业人士在职业上迈出下一步。我强烈鼓励你深入研究额外资源，参加当地的专业组织，并尽所能帮助我们继续维护全球机构的安全。


    非常感谢你所的一切！

    '
