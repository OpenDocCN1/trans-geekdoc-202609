    When it comes to encrypting hard drives, whole disk encryption is considered a
    leading practice. Before you can encrypt your hard drives, however, you need to
    ask some specific questions:


    - What technology are you going to use?

    - How are you going to manage the encryption keys?

    - Is the encryption mechanism vulnerable to bypass attacks?

    - Do you need the ability to centrally manage encryption keys?


    When considering encryption at the database level, it is especially important
    to take performance impacts into account. That said, database encryption of some
    sort is another recommended control, since databases tend to be repositories of
    critical information.


    - Are we going to encrypt data at the cell level, or are we going to encrypt at
    the row level?

    - Are we going to encrypt entire tables?

    - Fine tuning that encryption so that you are protecting the sensitive, most critical
    data, without disrupting business processes (i.e., doing more harm than good)
    is key.


    # Chapter 10: Physical and Environmental Security Management


    Chapter 10 covers the area of physical and environmental security management.
    And more importantly, the role in physical security played by the information
    security manager.


    ### Keywords

    - Dumpster diving


    ![](images/F000106u10-01-9780128041727.jpg)


    The area of physical and environmental security management surprised me the most
    when I initially implemented my first information security program. I must admit,
    I didn’t fully understand the role in physical security played by the information
    security manager.


    A few key questions:

    - What is your physical perimeter?

    - Can someone walk into your server room and steal the system?

    - Can someone walk into an office location and take a smartphone, a tablet?

    - Can someone get into a network device closet and plug something into a switch?

    - What is your perimeter and can someone take away something that does not belong
    them?


    As you can imagine, many of the logical security controls you choose to implement
    are at a greater risk of compromise if you lose physical control of the devices
    you are trying to protect.


    Locks around sensitive areas are an excellent control—locks, I should clarify,
    that can’t easily be bypassed with a bump key or a modified hotel key card. As
    anyone who has followed Chris Nickerson’s exploits is aware, a clever attacker
    can compromise sophisticated systems like motion detector locks with a Mylar balloon
    and a warm wash cloth, tricking the system into thinking it is sensing a living
    person.


    Understanding the attacker will help you understand what locks are appropriate
    for your organization. Providing badges, some sort of identification for employees
    so you can just distinguish an employee from a contractor from a temporary visitor,
    is also important from a security awareness perspective, especially if you encourage
    your employees to challenge (or offer to assist) anyone wandering around a sensitive
    area without a visible badge.


    Doing some sort of physical security assessment will also help you better understand
    your exposures in this area. Dumpster diving can help you determine whether or
    not sensitive information is being thrown away without being shredded. Hiring
    someone to actually try to break into one of your offices is another excellent
    test. This is particularly important for remote locations, locations far enough
    from headquarters that security controls may not be actively enforced.


    All of these controls will go a long way to address the associated physical and
    environmental risks.


    # Chapter 11: Security Operations Management


    Security operations management covers administration day-to-day security tasks,
    and suggests a number of questions you should ask yourself.


    ### Keywords

    - Log reviews; vulnerability scans; patching


    ![](images/F000118u11-01-9780128041727.jpg)


    When considering security operations management, your administration of the day-to-day
    security tasks, the following question comes to mind:

    - Who is responsible for the day-to-day security stuff?


    We talked about security organization management earlier. Now, we take it a step
    further, because when we are talking about who’s responsible for the day to day
    security, we also have to ask:

    - What exactly is the day to day security “stuff”?


    Log reviews, running vulnerability scans, patching systems, responding to potential
    security incidents … the day-to-day responsibilities of an information security
    team can be considerable. Once you have identified all of those procedures, you’re
    going to be able to identify who is (or who should be) responsible for managing
    them.


    Security operation procedures include repeatable tasks such as change control.
    Often times, unauthorized changes can be more damaging to a system then an external
    attacker, so your change control procedure is a key control in the security operations
    management category. Management of end point security agents, which might include
    antimalware and/or desktop encryption, also fall into this category.


    Logging and monitoring is another key control that falls under security operations
    management. While it is important that we make every effort to prevent bad things
    from happening, it is also important that we have the ability to detect when they
    have happened so that we can respond to them very quickly. You can accomplish
    this by implementing a centralized logging mechanism that is gathering logs from
    all of the systems that you need to watch and capturing enough log data that you
    could perform both near real-time alerting of security incidents as they occur,
    as well as the more long-term investigation of security incidents and their root
    causes, tasks that we often associate with the field of computer forensics.


    # Chapter 12: Communications Security Management


    Communications security management deals primarily with network security controls,
    including network segmentation.


    ### Keywords

    - Network segmentation


    ![](images/F00012Xu12-01-9780128041727.jpg)


    Communications security management deals primarily with network security controls.


    One key control is network segmentation, so the first question I would ask is:

    - Have we segmented our networks based on our information classification policy?


    You’ll remember previously that I recommend three critical policies, and that
    the data classification policy is one of them. You’ll find it very difficult to
    restrict access to sensitive data unless you know how your organization classifies
    data, where that sensitive data resides, and who has access to it. Once you’ve
    done that classification and segmented your network, it’s going to make it a lot
    harder for an attacker to get to that data without legitimate access.


    You should also ask the question:

    - Have we appropriately secured all data exchanges with third parties?


    I guarantee that you are doing business with at least one third party today, most
    likely a cloud service provider, and the question you should ask from the security
    management perspective is:

    - How do we take in the appropriate action to lock down that communication to
    ensure that unauthorized third parties can’t access the information we’re exchanging
    with the authorized third party?


    When implementing network segmentation, it is important that you first consider
    the level of complexity that your network administration team can reasonably support?
    I’ve visited organizations where I’ve logged on to their public (unencrypted)
    guest wireless network and had direct network access to patient and billing systems.
    From a security perspective, that is a terrible network architecture design, but
    they didn’t design the network with security in mind. Their first priority was
    simplicity. They hadn’t had the discussion with their security team around network
    segmentation and therefore had a huge exposure.

