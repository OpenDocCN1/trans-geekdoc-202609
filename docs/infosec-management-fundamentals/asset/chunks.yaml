    In order to select the right asset tracking system for your organization, you
    need to know what information you need to collect about your systems. With mobile
    devices, a mobile device management (`MDM`) or enterprise mobility management
    (`EMM`) solution might contain pre-configured technical policies designed to collect
    information that most organizations have agreed is relevant. With workstations,
    you may already have a technology in place that is pushing software changes and
    patches to systems that does that tracking. You might use the same solution to
    patch and manage servers, although some organizations choose to manage their workstation
    population and their server population using different solutions.


    Finding one centralized asset management system could be tricky for your organization,
    especially if you are budget-constrained. At the very least, a small organization
    with a spreadsheet that includes the `DNS` and `IP` address of every system on
    their network is a key control.


    Also, in order to combat Shadow IT, a technology purchase request form can help
    you respond to departments or units within the organization who are purchasing
    systems or applications without checking with IT first. If you provide them with
    a way to acquire these solutions in a manner that keeps IT in the loop, IT might
    be able to help them better articulate their requirements and select an even more
    effective solution, not to mention a solution that adheres to your internal information
    security policies.


    # Chapter 8: Access Management


    Access management deals with what resources people can get to, those resources
    they need in order to do their jobs.


    ### Keywords

    `Active Directory`; `OpenLDAP`


    ![](images/F000088u08-01-9780128041727.jpg)


    Access management deals with what resources people can get to, those resources
    they need in order to do their jobs. The first question you should ask is:


    Does everyone have the access they need in order to do their jobs?


    If someone starts a new job and they need to grant that person rights in `Active
    Directory`, a higher risk approach is to look at the most senior member of the
    company and say just copy his/her credentials. I say this is a higher risk, since
    it comes with a greater likelihood that you will potentially grant the new hire
    unnecessary access to systems that store sensitive data. If you provide people
    with the appropriate access they need in order to do their jobs, it’s unlikely
    they are going to have a need or desire to circumvent your access controls (i.e.,
    ask someone to share his/her username and password), but you first need to understand
    what those access rights are.


    Another question you should ask:


    Can unmanaged devices attach to our network?


    Look at access management not from a user perspective, but from a device perspective.
    If someone can enter a conference room and plug an unmanaged laptop into a network
    jack, you have an exposure. If someone can connect a non-company wireless device
    to your wireless network, whether it is a laptop, a smartphone, or a tablet, they
    could potentially do a considerable amount of damage to the internal organization
    through that connection.


    By asking those questions, you’ll begin to identify the appropriate access rights
    for employees and networked devices, which is fundamental if you are to adhere
    to the principle of least privilege. Approaching every firewall rule, every `Active
    Directory` group, with the notion that we are only going to give people and systems
    just enough access to do what they need to do, is going to help you prevent both
    intentional and unintentional security incidents.


    Some sort of centralized user directory is considering a leading practice in this
    area. Most often we see `Active Directory` from Microsoft, but directories such
    as `OpenLDAP` or `eDirectory` can often accomplish the same goal. Secure organizations
    need a central user store that all the systems can reference so that when someone
    is let go from an organization, an administrator can update that user’s employment
    status in one place, and then the centralized directory can cut off that user’s
    access immediately for all connected systems and applications. This control is
    especially important if the separation was unfriendly.


    Access reviews are more of a procedure, albeit an important one, where you assign
    business managers (not IT managers) the responsibility of reviewing who has access
    to their systems and data, and then have them determine whether or not that access
    is appropriate. IT is never going to know with absolute certainty who should have
    access to what, but the line of business managers should. Performing these access
    reviews will help identify situations where the principle of least privilege is
    being violated, including violations that an automated system may have missed.


    As much as I hate passwords as a security control, password management is still
    important. Identifying password length, password rotation requirements, the construction
    and complexity of passwords, and centralizing that functionality to ensure that
    strong passwords are in place across the entire organization has value. It’s also
    important to ensure that password security controls are enforced through lock
    screens that time out, not only on workstations and laptops, but also on smartphones
    and tablets. Also included in this control set is a lockout after a period of
    inactivity and the requirement for multi-factor authentication to systems that
    process and/or store sensitive data.


    To clarify, multi-factor traditionally includes a combination of something you
    know, something you have, and something you are. Any combination of those two
    is going to make it much more difficult for an attacker to bypass a login screen.
    Mobile devices that have location services enabled allow for an additional factor
    of authentication (namely, somewhere you are).


    Finally, access management can include network port security controls. If you
    have network jacks in conference rooms that no one’s using, turn them off. If
    you have jacks underneath desks that aren’t in use, turn those off as well. As
    long as you are only enabling ports where you have an active system connected,
    you are reducing the attack surface where someone could introduce an unmanaged
    device to your internal network.


    # Chapter 9: Cryptography


    Cryptography covers a shift in the industry, where if you have something that
    you want to protect, putting encryption in place is a great way, arguably, to
    do that.


    ### Keywords

    `Cryptography`; `encryption`; `CryptoLocker`; `CryptoWall`; `POODLE`


    ![](images/F00009Xu09-01-9780128041727.jpg)


    The conversation about cryptography (or encryption) controls begins by asking
    two basic questions:


    Are we encrypting sensitive data at rest?


    Are we encrypting it while it’s in motion?


    We’ve seen a shift in the industry, and it’s really picked up steam as of late,
    to “encrypt all the things.” If you have something that you want to protect, putting
    encryption in place is a great way, arguably, to do that. I say arguably, because
    encryption requires disciplined encryption key management practices. Anyone who
    has been impacted by a ransomware such as `CryptoLocker` or `CryptoWall` can attest
    to the harm caused by an encrypted file system where the decryption key is unavailable.
    The controls that you identify as a result of this conversation should be documented
    in your encryption policy, as well as in your encryption key management procedures.


    Discussions around encrypting network traffic most often steer toward properly
    implemented `SSL` and `TLS`, although the informed information security manager
    is aware of critical vulnerabilities in certain encryption mechanisms (`POODLE`
    being the one that comes to mind right away). It’s not enough to just “encrypt”
    the data. Encryption controls must be securely implemented and constantly monitored
    for new vulnerabilities.

