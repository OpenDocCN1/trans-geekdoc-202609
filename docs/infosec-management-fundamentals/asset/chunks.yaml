- raw: "• Cryptography\n\n• Physical and Environmental Security Management\n\n• Security\
    \ Operations Management\n\n• Communications Security Management\n\n• Systems Acquisition,\
    \ Development, and Maintenance\n\n• Supplier Security Management\n\n• Information\
    \ Security Incident Management\n\n• Business Continuity Management\n\n• Compliance\
    \ Management\n\nSecurity controls are not one size fits all from one organization\
    \ to the next. An organization that’s very risk averse is going to be more locked\
    \ down. They’re likely going to implement a larger number of information security\
    \ controls, and the quality of the controls they implement is going to be greater.\
    \ However, they’re also going to invest more time and resources into both implementing\
    \ and maintaining those security controls, time, and resources that many smaller\
    \ organizations don’t have.\n\nIf you’re working within a smaller organization,\
    \ your leadership may be more willing to accept certain risks, more willing to\
    \ take chances for the sake of competing and building out a customer base. Even\
    \ smaller organizations will find value in these controls, but it’s important\
    \ for you to approach them with an understanding of the level of quality that\
    \ is appropriate for your organization.\n\nI found that a clearly defined approach\
    \ to risk management, one where business leaders and security professionals openly\
    \ discuss the bad things that could to happen and what steps the organization\
    \ is willing to take in order to prepare for and respond when those bad things\
    \ happen, is going to impact the control selection that you make from that ISO/IEC\
    \ control set.\n\n![](images/F000027u02-02-9780128041727.jpg)\n\nHow do we get\
    \ from this concept of a document, a published standard or framework to an actual\
    \ implemented functional information security program? In my experience, it can\
    \ be accomplished via a relatively simple process.\n\nThe first step (and this\
    \ is very difficult for a number of IT folks, but we need to do it anyway) is\
    \ to get out from behind our desks and ask questions. If you want to be successful\
    \ in implementing an information security program you need to speak with people\
    \ not only in IT, but in the business all throughout the organization. Throughout\
    \ this material, I’m going to give you guidance regarding questions you can ask\
    \ in order to identify which controls are appropriate for your organization. Once\
    \ you’ve had those discussions, that Q&A session, you’re going to begin building\
    \ a project list of controls that you’ve identified to be appropriate for your\
    \ organization given your risk appetite. With that list in hand, you’ll be able\
    \ to discuss your desired level of quality, as well as project timelines for implementation\
    \ activities. How soon do we need to make these changes? How much are we willing\
    \ to spend? How many people do we need to support the changes?\n\nThat checklist\
    \ that results from your discussions will be your starting point. It’s from that\
    \ checklist that you’re going to drive all of the changes that you make. In the\
    \ end, it’s about the level of trust you’re placing in your employees, your partners,\
    \ and your suppliers, as well as the discipline that you, within your organization,\
    \ are willing to adhere to in order to ensure that those controls are implemented\
    \ and maintained.\n\n![](images/F000027u02-03-9780128041727.jpg)\n\nWhen implementing\
    \ an information security controls framework, the Plan-Do-Check-Act model is incredibly\
    \ appropriate. It worked extremely well in the organizations that I was working\
    \ in.\n\nIn the “Plan” phase, you discuss which controls are relevant. You have\
    \ the conversations, and you begin identifying changes that you intend to make\
    \ in your organization in order to improve your security posture.\n\nThe “Do”\
    \ phase is where those discussions transform into implementation projects. We\
    \ develop project plans, we decide on project budgets, and we allocate resources\
    \ who will actively spend time on implementing and maintaining these controls.\n\
    \nOnce those projects are complete, once the controls have been implemented, you\
    \ move onto the “Check” phase. This is where you validate whether or not the controls\
    \ were implemented correctly. The IT Audit department plays a key role in this\
    \ phase, as do external consultants.\n\nI’ve worked with an organization who felt\
    \ they had a terrific patching program in place and that they were doing an excellent\
    \ job of identifying and remediating vulnerabilities. During one engagement, I\
    \ discovered a critical (exploitable) vulnerability on one of the systems that\
    \ stored sensitive information. When I presented this finding to the organization,\
    \ they performed their own investigation and determined that the system fully\
    \ patched and that my finding was incorrect. We were using different security\
    \ tools and processes to evaluate technical vulnerabilities on the target system,\
    \ and we disagreed over which finding was correct, and (more importantly) whether\
    \ or not the vulnerability was even present. In the end, they found that there\
    \ was a gap in their patch management program. It had deployed the patch to the\
    \ target system, but hadn’t appropriately installed the patch. A component of\
    \ their patching solution had failed, and because they weren’t checking whether\
    \ or not the patches had been appropriately deployed, they had an exposure that\
    \ could have potentially been exploited by an attacker. The “Check” phase where\
    \ you revisit the controls after implementation and determine whether or not the\
    \ control was appropriately implemented is incredibly important.\n\nThe “Act”\
    \ phase, that fourth component of this cycle, is where you propose changes where\
    \ you identify new controls (or perhaps controls that you hadn’t yet discussed)\
    \ and make proposals to implement those controls, which will take you back to\
    \ the beginning Plan-Do-Check-Act model.\n\nOf course, the model here is cyclical.\
    \ It’s intended to be a continuous process because information security is not\
    \ a destination; it’s a journey. At no point will you achieve at an absolutely\
    \ secure set of controls, impervious to every attack. Threats will continue to\
    \ evolve, as will attacks. If you follow bug bounty programs and competitions\
    \ like Pwn2Own hosted at the CanSecWest security conference, you’re aware of the\
    \ economy that has grown around vulnerability discovery and disclosure. This economy\
    \ is bringing more security researchers into the field and encouraging activity\
    \ from independent researchers, which is contributing to a more rapid discovery\
    \ and disclosure rate for technical vulnerabilities in critical systems. I would\
    \ argue that may be why we’re seeing attacks like Heartbleed, Shellshock, POODLE,\
    \ Sandworm, VENOM, and so many critical vulnerabilities coming out each year.\
    \ Even though our controls may have been initially implemented correctly and appropriately,\
    \ the threat landscape has changed, as has the capability set of the attacker.\n\
    \nIt’s important for us to continually visit this Plan-Do-Check-Act cycle to ensure\
    \ that the controls we’ve implemented are correct.\n\nChapter 3 \n\n# Risk Management\n\
    \nChapter 3 covers risk management, the umbrella under which all of controls are\
    \ identified and ultimately implemented. Several key questions are then presented.\n\
    \n### Keywords\n\nNIST; factor analysis of information risk (FAIR)\n\n![](images/F000039u03-01-9780128041727.jpg)\n\
    \nI mentioned that risk management is an umbrella under which all of these controls\
    \ are identified and ultimately implemented. The first questions you should ask,\
    \ and you can ask this of anyone, nontechnical or technical, are:\n\nWhat could\
    \ go wrong at our organization?\n\nWhat are the bad things that can happen that\
    \ we’re worried about?\n\nIt’s important that you have an open, honest conversation\
    \ about the risks most likely to impact your organization, based on incidents\
    \ that have happened within your industry, as well as incidents that may have\
    \ happened within your organization in the past.\n\nOnce you begin identifying\
    \ and articulating those concerns and fears, the next questions you should ask\
    \ are:"
