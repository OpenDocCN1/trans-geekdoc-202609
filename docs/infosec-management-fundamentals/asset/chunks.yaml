    didn’t have the same level of security and control as the production systems,
    a condition that is true in many organizations.


    A handful of controls you can implement to address risks associated with systems
    acquisition, development, and maintenance are documented system hardening procedures,
    a secure software development lifecycle, and change control procedures that include
    an approval board tasked with reviewing all changes before they’re implemented
    to ensure that those changes don’t inadvertently or break anything.


    Vulnerability management procedures also fall under this category, which includes
    scanning development, test, quality assurance (QA), and production systems for
    exploitable technical vulnerabilities. If an attacker compromises a nonproduction
    host system, even if that system is devoid of production data, that attacker can
    still use that host as a jump point to get to other host systems. Alternately,
    the attacker may use that access to execute a pass-the-hash attack, which could
    be particularly devastating if domain admin credentials are stored locally on
    that nonproduction system.


    Don’t just scan host systems, though. Scan your databases. Scan your applications.
    Bear in mind that the tools most commonly used to detect host-level vulnerabilities
    are not always the same tools that will inform you of critical database- or application-level
    vulnerabilities. Here’s a good rule of thumb: If an attacker can interact with
    a resource, it’s on the security manager to figure out how to identify and mediate
    any vulnerabilities that may be present in that resource.


    Once you have vulnerability scanning and remediation well in-hand, penetration
    testing is the next valid step. Penetration testing is a method for validating
    whether or not the controls you’ve implemented are actually effective in deterring
    an attacker. A vulnerability scan is going to tell you that you have critical
    exposures. A penetration test is going to help you understand whether or not an
    attacker might actually be able to take advantage of that exposure, exploit it,
    and either access sensitive data or cause a business disruption.


    # Chapter 14: Supplier Security Management


    Supplier security management has become more and more important, especially when
    it was revealed that attackers were able to compromise Target customer data in
    2013 by first compromising one of Target’s suppliers.


    ### Keywords

    Target; PCI DSS compliance; SANS 20 Critical Security Controls


    ![](images/F000143u14-01-9780128041727.jpg)


    Supplier security management has become more and more important as of late, especially
    when it was revealed that attackers were able to compromise Target customer data
    in 2013 by first compromising one of Target’s suppliers, and then exploiting that
    supplier’s access to install malware on internal Target systems.


    Ask your organization these questions:

    - Who are all of our suppliers?

    - Who are the third parties with whom we exchange information?


    What you’ll find when you ask these questions is that that list is going to continue
    to grow and grow with every person with whom you speak. With the advent of cloud
    computing, we have more and more third parties who offer critical business services
    and apps that our internal users increasingly rely on. You’ll find that many business
    units have already engaged these third parties without IT’s knowledge, as I mentioned
    earlier.


    - Who are these suppliers?


    Who are these third parties and do they know our security and compliance expectations?


    PCI, the payment card industry, clearly states that if you are sharing credit
    card data with any third party, then that third party must also demonstrate PCI
    DSS compliance. Do your suppliers know of this responsibility? Have you told them?


    One of the key controls that is going to become apparent after you’ve asked these
    questions is a documented list of your suppliers. I’ve found that the best way
    to compile this list is to follow the money. Speak with your accounting department.
    They should be able to provide you with the majority of the list, because if you
    are engaged with a third party for business, you are either paying them money
    or they are paying you. That exchange of money is being tracked somewhere. If
    you can get into the system that is tracking that list, you’ll have your list
    of suppliers.


    You should also have a documented supplier information security requirements checklist
    of some sort. What information security expectations do you have of them?


    - Do they have to adhere to PCI?

    - Do they have to adhere to HIPAA?

    - Do they have to adhere to the SANS 20 Critical Security Controls, or does it
    make more sense for them to adhere to Common Sense Security Framework?


    Your organization needs to agree on the security controls that suppliers and partners
    must have in place, and then someone must own the responsibility of communicating
    those controls to the necessary parties.


    Contracts, confidentiality agreements, and NDA’s come up here again, in addition
    to two key supporting procedures: a supplier information security assessment and
    a supplier information security audit. You need to be able to quickly assess whether
    or not they have key controls in place, but in some cases you’ll need to dig deeper
    and ask them to provide evidence. That’s where the audit comes into play.


    # Chapter 15: Information Security Incident Management


    Information Security Incident Management covers the analysis of data, so that
    you can improve your security incident detection and response capabilities.


    ### Keywords

    Security information event management; SIEM


    ![](images/F000155u15-01-9780128041727.jpg)


    Information security incident management is the next category.

