    I’m going to start with a framework, and while there are a number of frameworks
    available, the one that I personally have found the most success with is the `ISO/IEC
    27000` series.


    You may be aware that `ISO/IEC 27000` series is a collection of standards for
    implementing an information security management system (`ISMS`), but what most
    people don’t realize is that the `ISO/IEC 27000` series is actually 16 individual
    standards and documents. There’s even a standard dedicated to implementing an
    information security management system in a healthcare organization (`ISO/IEC
    27799`), where you are bound by Health Insurance Portability and Accountability
    Act (`HIPAA`) compliance and required to appropriately secure electronically protected
    health information (`ePHI`).


    If you are just seeing the `ISO/IEC 27000` series for the first time, `ISO/IEC
    27001` (Information technology—Security techniques—Information security management
    systems—Requirements) contains that core set of knowledge of information on what
    a program should look like. However, I have found the most value in focusing on
    the controls outlined in `ISO/IEC 27002` (Information technology—Security techniques—Code
    of practice for information security controls).


