- raw: "Perhaps you’re not working in InfoSec yet, but you desperately want to move\
    \ into this field. If that’s so, good for you! That was the case with me a number\
    \ of years ago. My background is actually in music education so when I went after\
    \ my first IT security job, my resume did not reflect the education and training\
    \ that someone would expect, which made it even more difficult me to land that\
    \ role. The benefit that security-minded professionals have in today’s market\
    \ is that there in an ever-growing demand for information security professionals,\
    \ with more open positions globally than job applicants.\n\nMaybe you’re a newly\
    \ minted CISSP (Certified Information Systems Security Professional). Perhaps\
    \ you’ve gone through the certification process, but you’re in a more tactical\
    \ operational role and you want to move into management. I spent years in that\
    \ role at a large enterprise in Columbus, Ohio, developing my skills through hands-on\
    \ opportunities to implement and maintain information security control systems.\
    \ Don’t underestimate the value of this hands-on experience!\n\nIt could be that\
    \ you’ve accepted an information security management or leadership position. Now\
    \ you’ve had this responsibility dropped on your lap, it’s up to you to figure\
    \ out what it means for your organization to be secure. That was my most recent\
    \ enterprise position. This is where you learn to manage a security budget and\
    \ a security team. This is also where most security professionals develop a much\
    \ deeper understanding of the balance between business goals and information security\
    \ controls.\n\nIt could be that you’ve been in that management or leadership role\
    \ for years and you want to reverse your role, to step back as though you’re looking\
    \ from the outside and determine whether or not everything that you’re doing is\
    \ appropriate. Are you actually securing everything that needs to be secured?\
    \ Is your security program complete and comprehensive? Is the value provided by\
    \ your security program in-line with the goals of the business?\n\nFinally, maybe\
    \ you’ve made a move into information security consulting. You’ve had enough of\
    \ the enterprise lifestyle and you want to take the expertise you picked up over\
    \ the years and share that with other organizations so they understand where to\
    \ start and how to implement security. Given the number of small and medium businesses\
    \ at the root of every nation’s economy, the sharing of your expertise in this\
    \ fashion is of incredible significance!\n\nRegardless of where you are today,\
    \ the information we’re about to cover is directly applicable to what you’re doing.\
    \ It’s going to help you grow in your career. It’s going to help you firm up a\
    \ security program that you may be managing. The takeaway that I hope everyone\
    \ gets from this material is that the information security field is in desperate\
    \ need of motivated, dedicated professionals, individuals who, even if they don’t\
    \ yet have the background and experience, understand the importance and value\
    \ of information security for businesses of all sizes. The variety of topics that\
    \ we’re about to cover—that knowledge is in high demand, and the information will\
    \ help you find one of those open positions. More importantly, as anyone who follows\
    \ the news knows, this knowledge is desperately needed.\n\n![](images/F000015u01-03-9780128041727.jpg)\n\
    \nI’m going to start with a framework, and while there are a number of frameworks\
    \ available, the one that I personally have found the most success with is the\
    \ ISO/IEC 27000 series.\n\nYou may be aware that ISO/IEC 27000 series is a collection\
    \ of standards for implementing an information security management system (ISMS),\
    \ but what most people don’t realize is that the ISO/IEC 27000 series is actually\
    \ 16 individual standards and documents. There’s even a standard dedicated to\
    \ implementing an information security management system in a healthcare organization\
    \ (ISO/IEC 27799), where you are bound by Health Insurance Portability and Accountability\
    \ Act (HIPAA) compliance and required to appropriately secure electronically protected\
    \ health information (ePHI).\n\nIf you are just seeing the ISO/IEC 27000 series\
    \ for the first time, ISO/IEC 27001 (Information technology—Security techniques—Information\
    \ security management systems—Requirements) contains that core set of knowledge\
    \ of information on what a program should look like. However, I have found the\
    \ most value in focusing on the controls outlined in ISO/IEC 27002 (Information\
    \ technology—Security techniques—Code of practice for information security controls).\n\
    \nI mentioned that I’ve worked in multiple enterprise information security roles.\
    \ In one of those roles, I was brought into an organization to help them become\
    \ Payment Card Industry Data Security Standard (PCI DSS) compliant. I learned\
    \ very quickly that PCI compliance is a far cry from a comprehensive information\
    \ security program, and I would argue that any of the numerous PCI-compliant organizations\
    \ who have been breached recently would stand by me in that statement, understanding\
    \ that they had likely gone through other stages of compliance, that they likely\
    \ conducted penetration tests, but attackers were still able to find gaps in their\
    \ security programs and defeat security controls, in some cases even eluding detection\
    \ long enough to do significant damage. The PCI DSS was developed to address confidentiality\
    \ first and foremost, in an effort to protect consumer credit card numbers, but\
    \ does not pay equal attention to integrity controls, and it spends even less\
    \ time addressing availability controls.\n\nThe ISO/IEC 27000 series, as opposed\
    \ to something like PCI, goes into detail regarding specific controls designed\
    \ to give you a strong, comprehensive information security control set. I’ve looked\
    \ at Control Objectives for Information Technology (COBIT) from ISACA. While COBIT\
    \ is an excellent framework in and of itself, the organization I was with at the\
    \ time felt that may have been too formal, too regimented. I looked at the Information\
    \ Technology Infrastructure Library (ITIL). For anyone working in a production\
    \ control environment with high standards, the ITIL can help you ensure system\
    \ uptime that meets customer service level agreements (SLAs), but ITIL is very\
    \ light on information security.\n\nThe ISO/IEC 27002 control set, however, I\
    \ found to be ideal. That said, when I approached my leadership about becoming\
    \ ISO/IEC 27000 series certified, they disagreed with me and told me directly\
    \ that was not the approach we were going to take. In retrospect, I agree wholeheartedly\
    \ with that decision. The organization I was with did not have any financial benefit,\
    \ any long-term benefit from having that certification. Simply put, the cost outweighed\
    \ the benefit. However, an informal adoption of those controls significantly improved\
    \ our information security program measurably from year to year. To the point\
    \ that when I made the move from enterprise to consulting, I was very confident\
    \ that individuals relying on the service my employer provided, and all the goods\
    \ that we sold, would be delivered securely (both in person and online transactions).\n\
    \nIn your role, that mileage may vary, you may be working for an organization\
    \ where formal certification makes sense. However, if formal certification is\
    \ not an option, you should still consider informal adoption as a viable alternative.\
    \ I’ll share some of why here in just a moment.\n\nChapter 2 \n\n# ISO Security\
    \ Management Categories\n\nChapter 2 reviews the 14 categories identified in the\
    \ ISO 27000 series that fall under the umbrella of risk management.\n\n### Keywords\n\
    \nISO 27000 series; Plan-Do-Check-Act\n\n![](images/F000027u02-01-9780128041727.jpg)\n\
    \nIn 2013, the ISO/IEC 27000 series was updated to reflect a more refined control\
    \ set. There are 14 categories identified in the standard, all of which fall under\
    \ the umbrella of risk management.\n\n• Policy Management\n\n• Security Organization\
    \ Management\n\n• Human Resources Security Management\n\n• Asset Management\n\n\
    • Access Management"
