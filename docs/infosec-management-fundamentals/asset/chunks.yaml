- raw: "Firewall security audits are another key control. Reviewing the rules to determine\
    \ how an outsider, for example, might be able to follow a network path to an internal\
    \ system or location. Do you have any exposures or gaps there? If you do, perhaps\
    \ it’s time to consider system-to-system encryption where you encrypt data even\
    \ on the internal network. An internal (unencrypted) FTP process from one server\
    \ to another may seem secure because it’s on the inside, but once an unauthorized\
    \ party gains access to the internal network, you now have both credentials and\
    \ potentially sensitive data exposed in plaintext.\n\nIn addition to these technical\
    \ controls, documentation controls such as security language in contracts, confidentiality\
    \ agreements, and NDAs with your third parties will help ensure that they are\
    \ following the rules that you’ve laid out.\n\nChapter 13 \n\n# Systems Acquisition,\
    \ Development, and Maintenance\n\nSystems acquisition, development, and maintenance\
    \ discusses how to bring new systems and new applications online. And how we can’t\
    \ assume that they’ve all been properly locked down.\n\n### Keywords\n\nScanning\
    \ development; quality assurance; QA; penetration testing\n\n![](images/F000131u13-01-9780128041727.jpg)\n\
    \nSystems acquisition, development, and maintenance—what question do we ask here?\n\
    \nHow do we secure new systems before we add them to our network?\n\nWe’re bringing\
    \ new systems and new applications online all the time, but we can’t assume that\
    \ they’ve all been properly locked down.\n\nDo we have production data in nonproduction\
    \ systems?\n\nI still see this today, and I understand why. Developers are moving\
    \ quickly, constrained by limited budgets and tight project deadlines, and they\
    \ need to test their applications with a high degree of accuracy. It’s difficult\
    \ to come up with test data that is as accurate of a reflection of production\
    \ as actual production data. That said, I’ve been in organizations doing internal\
    \ penetration tests where I’ve been able to compromise sensitive production data\
    \ sets by exploiting weaknesses on the nonproduction systems where that data had\
    \ been stored during the testing process (and, unfortunately, subsequently forgotten).\
    \ This was possible because those nonproduction systems didn’t have the same level\
    \ of security and control as the production systems, a condition that is true\
    \ in many organizations.\n\nA handful of controls you can implement to address\
    \ risks associated with systems acquisition, development, and maintenance are\
    \ documented system hardening procedures, a secure software development lifecycle,\
    \ and change control procedures that include an approval board tasked with reviewing\
    \ all changes before they’re implemented to ensure that those changes don’t inadvertently\
    \ or break anything.\n\nVulnerability management procedures also fall under this\
    \ category, which includes scanning development, test, quality assurance (QA),\
    \ and production systems for exploitable technical vulnerabilities. If an attacker\
    \ compromises a nonproduction host system, even if that system is devoid of production\
    \ data, that attacker can still use that host as a jump point to get to other\
    \ host systems. Alternately, the attacker may use that access to execute a pass-the-hash\
    \ attack, which could be particularly devastating if domain admin credentials\
    \ are stored locally on that nonproduction system.\n\nDon’t just scan host systems,\
    \ though. Scan your databases. Scan your applications. Bear in mind that the tools\
    \ most commonly used to detect host-level vulnerabilities are not always the same\
    \ tools that will inform you of critical database- or application-level vulnerabilities.\
    \ Here’s a good rule of thumb: If an attacker can interact with a resource, it’s\
    \ on the security manager to figure out how to identify and mediate any vulnerabilities\
    \ that may be present in that resource.\n\nOnce you have vulnerability scanning\
    \ and remediation well in-hand, penetration testing is the next valid step. Penetration\
    \ testing is a method for validating whether or not the controls you’ve implemented\
    \ are actually effective in deterring an attacker. A vulnerability scan is going\
    \ to tell you that you have critical exposures. A penetration test is going to\
    \ help you understand whether or not an attacker might actually be able to take\
    \ advantage of that exposure, exploit it, and either access sensitive data or\
    \ cause a business disruption.\n\nChapter 14 \n\n# Supplier Security Management\n\
    \nSupplier security management has become more and more important, especially\
    \ when it was revealed that attackers were able to compromise Target customer\
    \ data in 2013 by first compromising one of Target’s suppliers.\n\n### Keywords\n\
    \nTarget; PCI DSS compliance; SANS 20 Critical Security Controls\n\n![](images/F000143u14-01-9780128041727.jpg)\n\
    \nSupplier security management has become more and more important as of late,\
    \ especially when it was revealed that attackers were able to compromise Target\
    \ customer data in 2013 by first compromising one of Target’s suppliers, and then\
    \ exploiting that supplier’s access to install malware on internal Target systems.\n\
    \nAsk your organization these questions:\n\nWho are all of our suppliers?\n\n\
    Who are the third parties with whom we exchange information?\n\nWhat you’ll find\
    \ when you ask these questions is that that list is going to continue to grow\
    \ and grow with every person with whom you speak. With the advent of cloud computing,\
    \ we have more and more third parties who offer critical business services and\
    \ apps that our internal users increasingly rely on. You’ll find that many business\
    \ units have already engaged these third parties without IT’s knowledge, as I\
    \ mentioned earlier.\n\nWho are these suppliers?\n\nWho are these third parties\
    \ and do they know our security and compliance expectations?\n\nPCI, the payment\
    \ card industry, clearly states that if you are sharing credit card data with\
    \ any third party, then that third party must also demonstrate PCI DSS compliance.\
    \ Do your suppliers know of this responsibility? Have you told them?\n\nOne of\
    \ the key controls that is going to become apparent after you’ve asked these questions\
    \ is a documented list of your suppliers. I’ve found that the best way to compile\
    \ this list is to follow the money. Speak with your accounting department. They\
    \ should be able to provide you with the majority of the list, because if you\
    \ are engaged with a third party for business, you are either paying them money\
    \ or they are paying you. That exchange of money is being tracked somewhere. If\
    \ you can get into the system that is tracking that list of exchanges, you’ll\
    \ have your list of suppliers.\n\nYou should also have a documented supplier information\
    \ security requirements checklist of some sort.\n\nWhat information security expectations\
    \ do you have of them?\n\nDo they have to adhere to PCI?\n\nDo they have to adhere\
    \ to HIPAA?\n\nDo they have to adhere to the SANS 20 Critical Security Controls,\
    \ or does it make more sense for them to adhere to Common Sense Security Framework?\n\
    \nYour organization needs to agree on the security controls that suppliers and\
    \ partners must have in place, and then someone must own the responsibility of\
    \ communicating those controls to the necessary parties.\n\nContracts, confidentiality\
    \ agreements, and NDA’s come up here again, in addition to two key supporting\
    \ procedures: a supplier information security assessment and a supplier information\
    \ security audit. You need to be able to quickly assess whether or not they have\
    \ key controls in place, but in some cases you’ll need to dig deeper and ask them\
    \ to provide evidence. That’s where the audit comes into play.\n\nChapter 15 \n\
    \n# Information Security Incident Management\n\nInformation Security Incident\
    \ Management covers the analysis of data, so that you can improve your security\
    \ incident detection and response capabilities.\n\n### Keywords\n\nSecurity information\
    \ event management; SIEM\n\n![](images/F000155u15-01-9780128041727.jpg)\n\nInformation\
    \ security incident management is the next category."
