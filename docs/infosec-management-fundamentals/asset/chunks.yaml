    This chart takes key strengths, identifying what people are good at, and then
    assigning those responsibilities to the right people. If you strive to always
    put somebody in a role where they are happy and they enjoy what they are doing,
    your information security program will be even more effective.


    ![](images/F000180u18-02-9780128041727.jpg)


    ### Business Skillset

    For the business skillset, this is your people person. This is someone who understands
    information security governance, has compliance and regulatory knowledge and understands
    how business, security, and compliance all work together.


    These people work well together with other people. They’re good at managing teams,
    both technical and nontechnical.


    If you were to use certifications to help you find the right candidate for this
    role, I would look for someone with their `CISSP` (from `ISC2`), their `CISM`
    (from `ISACA`), or perhaps even their `MSISM` from `SANS`.


    ![](images/F000180u18-03-9780128041727.jpg)


    ### Process Skillset

    The process skillset people are your accountants. They like numbers, they like
    tracking things, and they have a mix of business and technology skills. They love
    documentation; processes, procedures, and standards make their day. They also
    understand business process flows, a skillset often found in business analysts.


    Here, I’ve found that Certified Information Security Auditors (`CISAs`) are a
    terrific fit for this role.


    ![](images/F000180u18-04-9780128041727.jpg)


    ### Technical Skillset

    Your technical skillset will be found in your geeks and nerds, terms that I use
    with the utmost affection (being a geek myself). First and foremost, they have
    done system administration in the past. They’re active in technical and security
    user groups and they have a deep knowledge of specific technologies.


    If you’re looking at resumes, these folks may or may not have their `CISSP`, but
    they are likely to have one or more technical certifications related to specific
    technologies.


    ![](images/F000180u18-05-9780128041727.jpg)


    ### Team Structure

    Ideally, your core information security team that has three tiers: a manager,
    one or more senior security analysts, and one or more (junior) security analysts.
    The size of the team will vary, depending on the size of your organization and
    on any relationships you might have with third party managed security services
    providers. Regardless, the overall structure can still apply.


    The business-oriented manager is responsible for strategic decisions, where the
    senior security analyst has strategic conversations with the manager and then
    translates that into tactical information when working with the junior security
    analyst.


    Effective information security programs are driven by information security managers
    who encourages seniors to help the juniors grow into senior positions. The juniors
    should be constantly learning from the seniors, seeking new ways to improve existing
    processes based on that accumulated knowledge. This enables juniors to maintain
    operational day-to-day responsibilities until they grow into a senior, at which
    time you can hopefully bring new junior security analysts onto the time.


    ![](images/F000180u18-06-9780128041727.jpg)


    On the following slide, I’ve included a sample organization chart to show you
    how this all maps together.


    The manager is responsible for securing the organization and if you have a team
    of four full time security professionals (which I know is a luxury for many organizations),
    you ideally would have a technical senior and a process senior who would have
    the responsibilities I have outlined here. Then each senior would have a junior
    who shares certain responsibilities. For example, the technical senior shares
    security operations with a technical junior, but the junior may be responsible
    for physical security and asset security where the technical senior may be responsible
    for that system acquisition in maintenance. Likewise, the process senior shares
    policy with the junior, but maybe the junior handles the awareness training for
    HR while the process senior handles all of the risk assessment.


    Again, this is just a sample. Your organization doesn’t need to look like this,
    but understand that if you start with a framework and identify in that risk-based
    context all of the controls that are relevant to your organization, the discussion
    around security organization and the operations management, around who is going
    to implement and maintain all of these controls, is ultimately going to lead to
    an organization chart where you can identify where those responsibilities lie.


    When you are in that management role, you will also find that this is how you
    drive staffing changes. This is how you communicate to leadership that, in order
    to meet the quality or level of security outlined in your information security
    policies, you will likely need to have people in these roles.


    # Chapter 19


    ## Resources


    Chapter 19 covers a number of ancillary resources.


    ### Keywords

    ISO 27000-series; Unified Compliance Framework; `UCF`


    ![](images/F000192u19-01-9780128041727.jpg)


    As I mentioned at the beginning of the presentation, I am a strong advocate for
    sharing resources.


    The first set that I wanted to share was around the `ISO/IEC 27000` series. If
    you want to read up on the `ISO 27001` and `27002`, start with Wikipedia. In addition
    to being a free resource, it’s been my experience that technical information on
    Wikipedia is often kept up to date. If you wanted to dig deeper (and have a budget),
    you could go out to the [`iso.org](http://iso.org) website and actually purchase
    the `27001` and `27002` documents. They are licensed to individual users, so they
    may seem a bit expensive (depending on what your budget is), but you won’t find
    a better source of information than `ISO/IEC`. The `ISO/IEC 27000` directory though
    and `iso27001security.com` sites are independent websites separate from the [`iso.org`](http://iso.org)
    site that still provides some insight and guidance into how you might approach
    `ISO/IEC`.


    ![](images/F000192u19-02-9780128041727.jpg)


    If `ISO/IEC` isn’t appropriate for your organization, I recommend you look at
    `COBIT` as an alternative. I also recommend everyone understand `ITIL`. Although
    `ITIL` is not a security framework but a service management framework, there are
    definitely parallels between the two disciplines.


    The Unified Compliance Framework (`UCF`) is another resource that I mentioned
    maps maps regulations and standards to one another. I’ve seen a number of GRC
    solutions that subscribe to the `UCF`, enabling you to more quickly identify and
    implement controls based on that work that has been completed.


    I’ve got a few resources here from `NIST` and `FAIR` in the risk management category.
    Again, keep in mind that `NIST` is more qualitative, while `FAIR` is more quantitative.
    Regardless of which risk management framework you choose, you need a common language
    for discussing risk internally. If your organization does not yet have a common
    language for that discussion, start here. Take a look at those two.


    ![](images/F000192u19-03-9780128041727.jpg)


    I mentioned the `SANS 20 Critical Security Controls`, a slightly deceptive name
    since these 20 categories contain closer to 150–160 specific control requirements.


    If you wanted to become a certified `ISO/IEC 27000` specialist SANS, then I recommend
    you pursue the corresponding `GIAC` certification.


    If your organization is focused on breach mitigation, the Australian Department
    of Defence Top 35 Mitigation Strategies is incredible. It’s a terrific resource
    that is not as widely known as it should be.


    The last two resources are websites that I maintain to help share this information.
    The Common Sense Security Framework (`CSSF`) was designed to enable organizations
    to quickly assess the security of their third parties, as well as turn that lens
    inward to examine their own control set.

    '
