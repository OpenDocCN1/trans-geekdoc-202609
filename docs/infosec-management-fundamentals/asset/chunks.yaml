    This chapter covers the concept of executive sponsorship, or ownership of security
    from a C-Level executive. The chapter argues that you need someone who can make
    budgetary and staffing decisions to support the policies that you’ve implemented.


    ### Keywords

    Executive sponsorship; `C-Level`; nondisclosure agreement; `NDA`


    ![](images/F000052u05-01-9780128041727.jpg)


    With these policies in place, the next question you’re going to ask is:


    Who is going to do all this anyway?


    I’ve heard the term unfunded mandate more than once, and I’ve been on the receiving
    end of that term where there was a new direction, a new rule that we’re expected
    to comply with, regardless of whether or not we have the technology or staff to
    do so. The end result is often a new system deployed, but no designated admin.


    This is where the concept of executive sponsorship, ownership of security from
    a C-Level executive, is critical. You need someone who can make budgetary and
    staffing decisions to support the policies that you’ve implemented. With the support
    of that executive sponsor, you should form an information security steering committee,
    a group of leaders within the organization to talk about how security changes
    impact their specific areas, and to help them collectively come to decisions regarding
    which controls you’ll implement.


    You’ll also need an information security team, whether it’s formed from internal
    staff or by engaging a third party managed security services provider. Someone
    will need to patch your systems. Someone will need to run vulnerability scans,
    to track your compliance status, to identify and remove instances of malware.


    Make sure if you do have that external team in place, you document a nondisclosure
    agreement (`NDA`). You don’t want your internal security incidents becoming public
    knowledge as part of that relationship.


    I have also seen success with matrixed security teams, where organizations have
    a very small full-time information security resource or team, but then will engage
    people throughout IT and throughout the business to help out with security, even
    though those individuals are not full-time security professionals.


    These three controls here will help you define and manage how you’re going to
    run your security program.


    # Chapter 6: Human Resources Security Management


    Human Resources security management focuses on job descriptions and training.
    In other words, if you were to go hire a new security team member, what title
    would you look for.


    ### Keywords

    Information security manager; senior security analyst; security analyst; security
    awareness training


    ![](images/F000064u06-01-9780128041727.jpg)


    Human Resources (`HR`) security management, our next category, focuses on job
    descriptions and training. Key questions related to this category include:


    - Do you have job descriptions for your security team?

    - If you were to go hire a new security team member, what title would you look
    for? What skills would you request?


    Answering these questions is essential if you intend to find the right people
    for those roles, whether as internal employees or as third party managed security
    services providers.


    Another crucial question:


    - Do your employees really know what is expected of them?


    It’s one thing to document this information in policy, but have you validated
    whether or not your policies are being adhered to?


    One additional question that I feel you should ask when discussing human resources
    security controls is:


    - Should we be doing background checks or credit checks on any employees?


    If someone is going to have access to highly sensitive information, you may want
    the peace of mind in knowing that they haven’t had any criminal activity in their
    background, or that they’re not in a financial compromised position. Knowing that
    the three common aspects of a crime are means, motive, and opportunity, you can
    reduce the risk of insider fraud by taking motive off the table.


    Among the controls you would implement in this category are three key job descriptions:


    1. An information security manager

    2. A senior security analyst; and

    3. A security analyst.


    I’ll discuss these three roles in detail later on, but rest assured that they
    are critical elements of your information security control set.


    As I mentioned earlier, a non-disclosure agreement (`NDA`), is another key control.
    This is often a boilerplate document that you can share with third parties to
    ensure that, if you choose to engage them in a way that requires the exchange
    of sensitive information, they are not going to disclose key internal information
    about your organization to anyone.


    Security awareness training is another essential HR security control, not only
    for employees, but also for your IT staff to understand. If you want your employees
    to successfully detect and appropriately respond to social engineering attacks,
    teach them what an attack looks like and tell them who to contact when they are
    targeted. It’s unreasonable to expect your developers to create secure web and
    mobile applications if you haven’t taught them how to write secure code? Likewise,
    don’t expect your system administrators to understand how to harden a Windows
    server or Linux server unless you’ve trained them.


    Reiterating what I mentioned earlier in the policy section, onboarding and separations
    procedures are very important.


    - How do we hire someone and grant them access to internal systems?

    - How do we end someone’s time with our organization and take that access away?


    These four HR security controls here will help you ensure that your information
    security control set is reasonable and appropriate.


    # Chapter 7: Asset Management


    Asset Management covers the need to know what systems are connected to your internal
    network.


    ### Keywords

    Mobile device management; `MDM`; enterprise mobility management; `EMM`


    ![](images/F000076u07-01-9780128041727.jpg)


    In the asset management category, the key question we ask here is as follows:


    - What information assets do we have?


    Put another way, do you know what systems are connected to your internal network?
    Because if you don’t, it may not be prudent to consider it your network. Someone
    may have added a wireless access point or a rogue system that they are using to
    monitor employee activity, to access trade secrets, or to serve up malware to
    unsuspecting visitors to your website.


    The threat of unmanaged devices and applications can come from within an organization
    as well. Departments with discretionary spending authority might purchase and
    implement a technology solution without ever engaging (or even notifying) the
    IT department. Gartner has coined the term “Shadow IT” to cover this.


    - What information assets do you have and how do you add systems to the network?

    - How do you acquire new technology?


    Understanding how you acquire systems and applications and introduce them to your
    internal network is essential if you want to mitigate the risks associated with
    unmanaged technology.


    Another key question:


    - What do we do with retired systems?


    No piece of technology is going to last forever, and eventually you are going
    to turn it off. Take old hard drives for example. How many IT teams remove old
    hard drives and put them in a locked closet, a process that they will continue
    to follow until the closet is full? Storing old hard drives may be an acceptable
    solution for some organizations, depending on their risk appetite, until the closet
    is full. What do you do at that point?


    Ask these questions, and you’ll identify a need for some sort of asset tracking
    system where you can ideally discover all the systems on your network and then
    track that inventory as it changes over time.

