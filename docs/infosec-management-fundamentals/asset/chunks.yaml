- raw: "How do our controls stack up?\n\nIf that bad thing were to happen, what defenses\
    \ would we have to minimize damage?\n\nInformation security programs often grow\
    \ organically, and you’re likely to find that you already have some controls in\
    \ place. Knowing where these controls have already been implemented will help\
    \ you appropriately manage your information security budget going forward.\n\n\
    Once you’ve got the defenses and controls identified, the next logical questions\
    \ are:\n\nAre we spending too much?\n\nAre we spending a dollar to protect a dime?\n\
    \nI’ve asked (and been asked) these questions many times throughout my career.\
    \ Many organizations fall into the trap of making a gut feeling decision to implement\
    \ a control, regardless of how much it costs, but if we approach our controls\
    \ with a critical eye, we’re likely to find that we’re spending too much, that\
    \ the amount of money we’re spending on one control far outweighs the risk.\n\n\
    Finally, all of these questions are going to drive the final questions:\n\nWhat’s\
    \ our risk appetite?\n\nHow much risk are we willing to accept?\n\nAs I mentioned\
    \ earlier, security is not a one-size-fits-all solution for every organization.\
    \ An organization that protects critical national infrastructure is likely to\
    \ have a more conservative, more risk-averse appetite than an organization that\
    \ sells t-shirts. Understanding your organization’s risk appetite is essential\
    \ if you want to be an effective information security manager.\n\nThe first control\
    \ that I recommend every organization implement, a control that needs to be executed\
    \ on a recurring basis, is some sort of risk assessment. If I look at the NIST\
    \ Special Publication 800-30 revision 1 (Guide for Conducting Risk Assessments),\
    \ they present a simple qualitative formula for calculating risk:\n\nRisk=Likelihood×Impact\n\
    \nLikelihood refers to how often a risk is likely to occur or be realized, and\
    \ impact refers to how bad the damage would be if that were to happen. The NIST\
    \ document provides additional recommendations on how to calculate the different\
    \ scores.\n\nIf I wanted to go to the other end of the spectrum and look at a\
    \ very quantitative approach to risk management, factor analysis of information\
    \ risk (FAIR) gets into a very detailed comparison of the dollars and cents that\
    \ an organization should be spending to manage identified risks. In my experience,\
    \ performing a FAIR-based risk assessment requires more planning and training\
    \ that performing a NIST-based risk assessment, but properly implemented, the\
    \ FAIR methodology can provide very specific budgetary recommendations.\n\nRegardless\
    \ of whether you perform a qualitative NIST-based risk assessment, a quantitative\
    \ FAIR-based risk assessment, or a risk assessment based on some other risk management\
    \ methodology, that risk assessment will become the bedrock on which you build\
    \ your information security program.\n\nChapter 4 \n\n# Policy Management\n\n\
    Once you perform your risk assessment and you’ve begun the information security\
    \ and risk management conversation, the next step is to take a look at your information\
    \ security policy set.\n\n### Keywords\n\nInformation Security Policy; Data Classification\
    \ Policy; Acceptable Use Policy\n\n![](images/F000040u04-01-9780128041727.jpg)\n\
    \nOnce you perform your risk assessment and you’ve begun the information security\
    \ and risk management conversation started, the next step is to take a look at\
    \ your information security policy set.\n\nThe questions to ask at this stage:\n\
    \nWhat are the rules that we expect our employees to follow?\n\nIf you are going\
    \ to work at our company, what’s okay and what’s not okay?\n\nFor example, a very\
    \ common question many companies are asking today is:\n\nShould employees be allowed\
    \ to bring their own personal devices (smartphones, tablets, etc.) and connect\
    \ them to the internal wireless network?\n\nWell, if you don’t have a policy that\
    \ clearly states what your rules are, then chances are people are going to do\
    \ that without first seeking approval from someone in management. Documenting\
    \ your expectations in policy is a crucial first step in mitigating these risks.\n\
    \nOnce you’ve documented what’s okay and what’s not okay to do, with respect to\
    \ your IT resources, you’re going to begin addressing the next question:\n\nHow\
    \ is it that we do what we do?\n\nThis shifts the conversation from high-level\
    \ policies to more detailed standards and procedures. Let’s continue with the\
    \ personal device discussion. If your organization decides that the risk of allowing\
    \ employees to connect personal devices to the company network is less than the\
    \ cost of providing company-owned devices to those same employees, the security-minded\
    \ manager asks questions about which controls are still necessary to implement\
    \ for these users and their devices.\n\nWhat does a secure iPhone look like?\n\
    \nWhat does a secure Android tablet look like?\n\nShould we enforce passcodes\
    \ or passwords?\n\nShould we enable location services to locate lost or stolen\
    \ devices, especially if that location tracking might violate employee privacy?\n\
    \nIs it okay to allow users to connect jailbroken iPhones and rooted Android tablets\
    \ to our internal wireless network? (Hint: No. No it is not.)\n\nWhat other security\
    \ settings need to be turned on before we allow that phone to connect to our internal\
    \ wireless network?\n\nThe specific settings that you insist users apply before\
    \ connecting their devices to the internal wireless network should be documented\
    \ in one or more standards. The process of actually changing those settings, however,\
    \ would be a procedure. Procedures cover other scenarios as well.\n\nWhat do we\
    \ do (step-by-step) when someone leaves the company?\n\nWhat changes do we make\
    \ to their access?\n\nPolicies are very high level, they shouldn’t change that\
    \ often. Standards should be reflective of the technology, and as such should\
    \ change as the technology changes. Continuing with the mobile example, every\
    \ time a new version of iOS or the Android operating system is released, you should\
    \ have a new standard regarding what a secure phone or tablet looks like within\
    \ your organization. At the very least, you should publish a guideline with recommended\
    \ settings that users should apply until the new standard has been developed,\
    \ approved, and published.\n\nProcedures will be used frequently by IT support\
    \ teams. This is especially true for help desk and service desk teams, those parts\
    \ of the IT organization that tends to function as the entry point for new employees.\
    \ You should absolutely have detailed step-by-step instructions so that these\
    \ teams can understand how to perform security tasks from the first day they start\
    \ working with the company.\n\nWhile a complete information security policy set\
    \ can take some time to document, the three critical policies that I recommend\
    \ everyone start with are:\n\n1. Information Security\n\n2. Data Classification\n\
    \n3. Acceptable Use\n\nThese three policies are just the tip of the iceberg, but\
    \ they will help you quickly home in on how you do information security at you\
    \ organization.\n\nThe Information Security Policy should identify the security\
    \ rules that employees should follow. The Data Classification Policy should clarify\
    \ the types of controls required for protecting more sensitive data, both at rest\
    \ and in motion. (This policy is particularly important, as you’ll learn later\
    \ on, since there are many other policies, standards, and procedures that rely\
    \ on that data classification policy.) Then, to address what actions are employees\
    \ allowed to take while using company resources (namely Internet, email, mobile\
    \ devices, and wireless networks), you’ll want to document your Acceptable Use\
    \ Policy.\n\nIf you want your employees to know what’s expected of them, you have\
    \ to write it down.\n\nOtherwise you’re destined to fail.\n\nChapter 5 \n\n# Security\
    \ Organization Management"
