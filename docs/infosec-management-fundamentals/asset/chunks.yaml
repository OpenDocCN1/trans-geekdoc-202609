    Returning to that risk discussion, the umbrella under which all these controls
    are discussed, a pair of more in-depth questions arise:


    What are the things that could go wrong?


    What are the things that have already gone wrong?


    As we have matured in detecting and responding to security incidents, we now have
    some data that we can go back to. For example, let’s say that your organization
    has been tracking the number of lost and stolen laptops and mobile devices reported
    annually, as well as the number of service desk calls where a support technician
    had to manually remove malware from an end user’s machine. Worst case scenario,
    perhaps your organization actually saw a data breach. By analyzing all of this
    data, you can improve your security incident detection and response capabilities.


    Another key question:


    When something goes wrong what do you do?


    If the answer is, “We run around screaming with our hair on fire,” then your organization
    definitely has an opportunity to improve this particular security control set.


    If you document one security incident response policy with multiple supporting
    procedures, a procedure for each specific type of incident you plan to address,
    then you can plan ahead of time how to quickly contain the damage and prevent
    the incident from having a greater impact on your business.


    A security information event management (SIEM) system is another critical control,
    although somewhat more advanced. Hopefully, you already have a centralized log
    management system collecting log data from network devices, critical host systems,
    and critical applications. A fine-tuned SIEM system could normalize and analyze
    that data, search for potential attack patterns, and then alert security staff
    when those patterns are detected.


    Training comes up here again, reinforcing what we covered during the HR security
    management section. You should train your end users on how to detect and respond
    to security incidents, especially social engineering attacks. Teach them to never
    engage a social engineer. Teach them to always report social engineering to someone
    in security. The security team can then communicate to other areas of the business
    to be on the lookout for that type of attack. You should also train the incident
    response team on how to respond to incidents. Tabletop exercises are an excellent
    control that allow responders to simulate a response and detect potential gaps
    in their response procedures or in the controls that they have implemented to
    support security incident response activities.


    Larger organizations may want to consider training staff in proper computer forensics
    techniques, especially if that data is ever going to be used in court. That said,
    many organizations find it to be much more cost-effective to maintain a relationship
    with a certified security provider who specializes in computer forensics.


    # Chapter 16: Business Continuity Management


    Business continuity management controls focus on helping you prepare for and recover
    from a disaster, as well as how you continue to operate during that recovery period.


    ### Keywords

    Disaster Recovery Plan; Business Continuity Plan


    ![](images/F000167u16-01-9780128041727.jpg)


    Business continuity management controls focus on helping you prepare for and recover
    from a disaster, as well as how you continue to operate during that recovery period.


    ### How will we recover from a disaster?

    The first question is answered by your disaster recovery plan. This document outlines
    how you will bring your IT systems back online, how you will restore data, and
    in what order these events will occur. As you can imagine, generating and testing
    your backups on a regular basis is critical to this plan. You may be backing up
    data, but if you are not testing your backups, you may find during a security
    incident or a recovery event that your backups are useless or they’ve broken,
    that they’ve stopped backing up at some point and no one was monitoring. This
    is why tabletop exercises and mock recovery exercises are necessary.


    ### How will we keep the business going during the recovery process?

    The second question is answered by your business continuity plan. This document
    differs from the disaster recovery plan, in that it focuses on how you will continue
    to operate securely while the disaster recovery efforts are underway.


    # Chapter 17: Compliance Management


    Compliance management focuses on governance, risk, and compliance (GRC) solutions
    that track not only your organization’s internal and external compliance obligations,
    but also the level of compliance that your suppliers have demonstrated with the
    information security requirements that you’ve shared with them.


    ### Keywords

    HIPAA; PCI; NERC/FERC; SOX; COPPA; FERPA; CFPB


    ![](images/F000179u17-01-9780128041727.jpg)


    The last group of security controls I want to cover fall under compliance management.
    There are two key questions here:


    ### What do I need to comply with?

    What rules and regulations exist that apply to me?


    `HIPAA`, `PCI`, `NERC/FERC`, `SOX`, `COPPA`, `FERPA`, `CFPB` … the list is staggering.
    There are so many acronyms that identifying what’s relevant to you can take a
    lot of time. Organizations such as the Unified Compliance Framework exist solely
    to track the hundreds of regulations that exist around the globe, and to help
    organizations make sense of the compliance process.


    Keep in mind that you’re looking not only at external compliance requirements,
    but also at internal policies that you’ve published. What do we need to comply
    with there? Having documented compliance procedures where you identify who is
    responsible for demonstrating compliance and when that evidence is due is important.


    I’ve seen governance, risk, and compliance (GRC) solutions that track some of
    this information for you. GRC solutions help you track not only your organization’s
    internal and external compliance obligations, but also the level of compliance
    that your suppliers have demonstrated with the information security requirements
    that you’ve shared with them.


    Validating compliance often occurs during internal and external audits. Ideally,
    audits should be conducted in a manner that is both nonintrusive and independent.


    Once you go through the process of asking questions related to the security controls
    that you’ve decided to implement, with respect to the risk appetite expressed
    by your leadership, you’re now ready to step back and take a look at your information
    security program. You’ve got a picture, a framework, of what your security program
    should look like and how well your plan stacks up to the actual control set.


    # Chapter 18: Skillset Groupings


    Skillset groupings cover how we put people in the right role according to the
    traditional People/Process/Technology matrix.


    ### Keywords

    CISSP; CISM; MSISM; Certified Information Security Auditors (CISAs)


    ![](images/F000180u18-01-9780128041727.jpg)


    Now we need to talk about who’s going to do this. How do we put people in the
    right role? What I have found is that if you group these areas of responsibility
    in the traditional People/Process/Technology matrix, here’s how it breaks out.


    You should have a business-minded person for security organization management.
    I only assign one area to the business person, but trust me when I say that having
    a person solely focused on the relationship between security and the business
    is a full-time job.


    To the process-minded person, I would assign risk, HR security, business continuity,
    security incident, policy, compliance, and supplier security. While each of these
    areas have a technical component, the process of implementing and maintaining
    these controls takes precedent.


    To the technical person, I would assign physical, asset, security operations,
    acquisition and development, access, cryptography, and communications security.
    This person will have to roll up his/her sleeves and get into the technical weeds
    when covering these specific areas.

    '
  trans: '

    回到风险讨论，在讨论这些控制措施的这一伞下，引出了两个更深入的问题：


    哪些事情可能会出现问题？


    哪些事情已经出现过问题？


    随着我们在检测和响应安全事件方面变得日益成熟，我们现在有了一些可以追溯的数据。例如，假设你的组织一直在跟踪每年报告丢失和被盗的笔记本电脑及移动设备数量，以及支持技术人员必须手动从终端用户机器中移除恶意软件的服务服务台电话次数。最坏的情况下，也许你的组织实际上真的发生了数据泄露。通过分析所有这些数据，你可以改进你的安全事件检测和响应能力。


    另一个关键问题是：


    当问题发生时，你会做什么？


    如果答案是，“我们像火烧眉毛一样到处乱跑大叫”，那么你的组织绝对有改进这一特定安全控制措施集的机会。


    如果你制定了一份包含多个支持性程序的安全事件响应策略，并针对你计划处理的每种特定类型的事件制定了程序，那么你就可以提前计划如何快速控制损失，并防止事件对你的业务产生更大的影响。


    安全信息和事件管理（SIEM）系统是另一项关键控制措施，尽管它稍微先进一些。希望你已经拥有一个中心化的日志管理系统，从网络设备、关键主机系统和关键应用程序收集日志数据。经过精调的
    SIEM 系统可以对这些数据进行规范化分析，搜索潜在的攻击模式，并在检测到这些模式时提醒安全人员。


    这里再次提到了培训，加强了我们在人力资源安全管理部分涵盖的内容。你应该培训终端用户如何检测和响应安全事件，特别是社会工程学攻击。教他们永远不要与社会工程师接触。教他们始终向安全部门的人报告社会工程攻击。安全团队随后可以与业务的其他部门沟通，让他们警惕此类攻击。你应该培训事件响应团队如何响应事件。桌面演练是一项极好的控制措施，允许响应人员模拟响应，并检测他们的响应程序或为支持安全事件响应活动而实施的控制措施中的潜在漏洞。


    较大的组织可能希望考虑培训员工正确的计算机取证技术，特别是如果数据以后可能用于法庭的话。尽管如此，许多组织发现与专精计算机取证的认证安全提供商保持关系要更有成本效益。


    # 第 16 章：业务连续性管理


    业务连续性管理控制措施侧重于帮助你准备并从灾难中恢复，以及在恢复期间如何继续运营。


    ### 关键词

    灾难恢复计划；业务连续性计划


    ![](img/F000167u16-01-9780128041727.jpg)


    业务连续性管理控制措施侧重于帮助你准备并从灾难中恢复，以及在恢复期间如何继续运营。


    ### 我们如何从灾难中恢复？

    第一个问题由你的灾难恢复计划回答。该文档概述了你将如何让 IT 系统恢复上线、将如何恢复数据，以及这些事件发生的顺序。正如你可以想象的，定期生成和测试备份对于该计划至关重要。你可能在备份数据，但如果你不测试备份，你可能会在安全事件或恢复事件期间发现备份是无用的，或者它们已经损坏了，或者它们在某个点停止了备份而没有人进行监控。这就是为什么桌面演练和模拟恢复演练是必要的。


    ### 在恢复过程中我们如何如何保持业务运行？

    第二个问题由你的业务连续性计划回答。该文档与灾难恢复计划不同，它侧重于在灾难恢复工作进行期间，你将如何安全地继续运营。


    # 第 17 章：合规管理


    合规管理侧重于治理、风险和合规（GRC）解决方案，这些解决方案不仅跟踪组织的内部和外部合规义务，还跟踪供应商对于你分享给他们的信息安全要求所展现出的合规水平。


    ### 关键词

    HIPAA; PCI; NERC/FERC; SOX; COPPA; FERPA; CFPB


    ![](img/F000179u17-01-9780128041727.jpg)


    我想涵盖的最后一组安全控制措施属于合规管理。这里有两个关键问题：


    ### 我需要遵守什么？

    存在哪些适用于我的规则和法规？


    `HIPAA`, `PCI`, `NERC/FERC`, `SOX`, `COPPA`, `FERPA`, `CFPB` …… 列表令人惊叹。有这么多缩写词，识别哪些与你相关的可能花费大量时间。像统一合规框架（Unified
    Compliance Framework）这样的组织专门用于跟踪全球存在的数百项法规，并帮助组织理解合规流程。


    请记住，你不仅在查看外部合规要求，还在查看你已发布的内部政策。我们在那里需要遵守什么？拥有记录在案的合规程序，识别谁负责证明合规性以及何时提交这些证据，这是非常重要的。


    我见过某些治理、风险和合规（GRC）解决方案可以为你跟踪其中的一些信息。GRC 解决方案帮助你跟踪的组织的内部和外部合规义务，还跟踪供应商对于你分享给他们的信息安全要求所展现出的合规水平。


    验证合规性通常发生在内部和外部审计期间。理想情况下，审计应该以一种非侵入性且独立的方式进行。


    一旦你完成了与你决定实施的安全控制措施相关的提问过程（这些措施是根据领导层表达的风险偏好的），你现在就可以回过来看信息安全计划了。你获得了一个整体、一个框架，关于你的安全计划应该是什么样的，以及你的计划与实际控制集相比如何。


    # 第 18 章：技能分组


    技能分组涵盖了如何根据传统的人员/流程/技术矩阵将人员放在正确的职位。


    ### 关键词

    CISSP; CISM; MSISM; 认证信息安全审计 (CISA)


    ![](img/F000180u18-01-9780128041727.jpg)


    现在我们需要讨论谁来做这些工作。我们如何将人员放在正确的职位？我发现，如果你按照传统的人员/流程/技术矩阵对这些职责进行分组，是这样划分的。


    你应该有一个具有业务思维的人来负责安全组织管理。我只给业务人员分配了一个领域，但请相信我，有一个专门专注于安全与业务之间关系的人是一项全职工作。


    对于具有流程思维的人，我将分配风险、人力资源安全、业务连续性、安全事件、策略、合规和供应商安全。虽然这些领域都有技术组件，但实施和维护这些控制措施的优先优先。


    对于技术型的人，我将分配物理、资产、安全运行、采购和开发、访问、加密和通信安全。在涵盖这些特定领域时，这个人必须卷起袖子深入研究技术细节。

    '
