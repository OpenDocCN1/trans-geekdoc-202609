- raw: "When it comes to encrypting hard drives, whole disk encryption is considered\
    \ a leading practice. Before you can encrypt your hard drives, however, you need\
    \ to ask some specific questions.\n\nWhat technology are you going to use?\n\n\
    How are you going to manage the encryption keys?\n\nIs the encryption mechanism\
    \ vulnerable to bypass attacks?\n\nDo you need the ability to centrally manage\
    \ encryption keys?\n\nWhen considering encryption at the database level, it is\
    \ especially important to take performance impacts into account. That said, database\
    \ encryption of some sort is another recommended control, since databases tend\
    \ to be repositories of critical information.\n\nAre we going to encrypt data\
    \ at the cell level, or are we going to encrypt at the row level?\n\nAre we going\
    \ to encrypt entire tables?\n\nFine tuning that encryption so that you are protecting\
    \ the sensitive, most critical data, without disrupting business processes (i.e.,\
    \ doing more harm than good) is key.\n\nChapter 10 \n\n# Physical and Environmental\
    \ Security Management\n\nChapter 10 covers the area of physical and environmental\
    \ security management. And more importantly, the role in physical security played\
    \ by the information security manager.\n\n### Keywords\n\nDumpster diving\n\n\
    ![](images/F000106u10-01-9780128041727.jpg)\n\nThe area of physical and environmental\
    \ security management surprised me the most when I initially implemented my first\
    \ information security program. I must admit, I didn’t fully understand the role\
    \ in physical security played by the information security manager.\n\nA few key\
    \ questions:\n\nWhat is your physical perimeter?\n\nCan someone walk into your\
    \ server room and steal the system?\n\nCan someone walk into an office location\
    \ and take a smartphone, a tablet?\n\nCan someone get into a network device closet\
    \ and plug something into a switch?\n\nWhat is your perimeter and can someone\
    \ take away something that does not belong them?\n\nAs you can imagine, many of\
    \ the logical security controls you choose to implement are at a greater risk\
    \ of compromise if you lose physical control of the devices you are trying to\
    \ protect.\n\nLocks around sensitive areas are an excellent control—locks, I should\
    \ clarify, that can’t easily be bypassed with a bump key or a modified hotel key\
    \ card. As anyone who has followed Chris Nickerson’s exploits is aware, a clever\
    \ attacker can compromise sophisticated systems like motion detector locks with\
    \ a Mylar balloon and a warm wash cloth, tricking the system into thinking it\
    \ is sensing a living person.\n\nUnderstanding the attacker will help you understand\
    \ what locks are appropriate for your organization. Providing badges, some sort\
    \ of identification for employees so you can just distinguish an employee from\
    \ a contractor from a temporary visitor, is also important from a security awareness\
    \ perspective, especially if you encourage your employees to challenge (or offer\
    \ to assist) anyone wandering around a sensitive area without a visible badge.\n\
    \nDoing some sort of physical security assessment will also help you better understand\
    \ your exposures in this area. Dumpster diving can help you determine whether\
    \ or not sensitive information is being thrown away without being shredded. Hiring\
    \ someone to actually try to break into one of your offices is another excellent\
    \ test. This is particularly important for remote locations, locations far enough\
    \ from headquarters that security controls may not be actively enforced.\n\nAll\
    \ of these controls will go a long way to address the associated physical and\
    \ environmental risks.\n\nChapter 11 \n\n# Security Operations Management\n\n\
    Security operations management covers administration day-to-day security tasks,\
    \ and suggests a number of questions you should ask yourself.\n\n### Keywords\n\
    \nLog reviews; vulnerability scans; patching\n\n![](images/F000118u11-01-9780128041727.jpg)\n\
    \nWhen considering security operations management, your administration of the\
    \ day-to-day security tasks, the following question comes to mind:\n\nWho is responsible\
    \ for the day-to-day security stuff?\n\nWe talked about security organization\
    \ management earlier. Now, we take it a step further, because when we are talking\
    \ about who’s responsible for the day to day security, we also have to ask:\n\n\
    What exactly is the day to day security “stuff”?\n\nLog reviews, running vulnerability\
    \ scans, patching systems, responding to potential security incidents … the day-to-day\
    \ responsibilities of an information security team can be considerable. Once you\
    \ have identified all of those procedures, you’re going to be able to identify\
    \ who is (or who should be) responsible for managing them.\n\nSecurity operation\
    \ procedures include repeatable tasks such as change control. Often times, unauthorized\
    \ changes can be more damaging to a system then an external attacker, so your\
    \ change control procedure is a key control in the security operations management\
    \ category. Management of end point security agents, which might include antimalware\
    \ and/or desktop encryption, also fall into this category.\n\nLogging and monitoring\
    \ is another key control that falls under security operations management. While\
    \ it is important that we make every effort to prevent bad things from happening,\
    \ it is also important that we have the ability to detect when they have happened\
    \ so that we can respond to them very quickly. You can accomplish this by implementing\
    \ a centralized logging mechanism that is gathering logs from all of the systems\
    \ that you need to watch and capturing enough log data that you could perform\
