    # Author Biography


    **Henry Dalziel** is a serial entrepreneur, founder of Concise Ltd, cybersecurity
    blogger and has developed numerous cybersecurity courses. He has earned every
    gray hair in his beard working in the field.


    # Contributing Editor Biography


    **Jerod Brennen** (@sland) by day is an infosec geek. By night, he’s a husband,
    father, martial artist, musician, gamer, and social media junkie. Jerod has earned
    every gray hair in his beard working in the field.


    # Chapter 1. Introduction


    ### Keywords


    Information security management system; ISMS; Control Objectives for Information
    Technology; COBIT


    This book begins with a review of the framework-based approach for implementing
    an information security program.


    This book has been developed after years of experience in a variety of IT and
    information security positions. I progressed in my career from a level one (entry
    level) service desk employee to the CTO and Principal Security Consultant at a
    small security shop. In that time, in every role and position I’ve worked in,
    the answers to my client’s information security questions weren’t instantly solved
    by the latest and greatest security tools; even in light of the latest attacks
    and techniques, everything that we’re seeing in the information security space
    can be addressed and managed through some basic fundamental controls that we’ve
    about for years. So, it’s just having the knowledge, discipline, and “know how”
    to identify and implement those controls.


    This book covers that information and will enable you to take that information
    back to your own organization and step into a leadership role.


    ![](images/F000015u01-01-9780128041727.jpg)


    This book begins with a quick review of several scenarios, then it goes into a
    framework-based approach for implementing an information security program.


    While the framework-based approach that I present builds on controls outlined
    in the ISO/IEC 27000 series, an internationally recognized body of standards for
    building out an information security management system (ISMS), you’ll find that
    this same approach can be applied to any number of available frameworks.


    Once we cover these details, we’ll move on to building a security team by mapping
    key strengths to areas of ownership. Finally, I’ll share resources that the more
    motivated security professional will want to investigate in order to further your
    understanding of the concepts presented here, and to dig deeper into specific
    areas of interest to you.


    Where are you today in your own information security career?

