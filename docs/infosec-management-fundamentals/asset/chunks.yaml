  trans: '

    你可能还没有进入信息安全（InfoSec）领域，但你非常渴望进入这一领域。如果是这样，那太为你感到高兴了！几年前我也是如此。我的背景其实是音乐教育，所以当我寻找第一份
    IT 安全工作时，我的简历并没有反映出人们所预期的教育和培训，这使得我获得那个职位变得更加困难。在当今市场上，具有安全意识的专业人士的优势在于，对信息安全专业人员的需求不断增长，全球范围内空缺数量多于职位申请人数。


    你可能是一个新获得的 `CISSP`（认证信息系统安全专业人员）。也许你已经通过了认证流程，但你处于一个更具战术性的执行角色，你想向管理层转型。我在俄亥俄州哥伦斯的一大企业担任了多年此类职位，通过实施和维护信息安全控制系统的实践机会来提升自己的技能。不要低估这些实践经验的价值！


    你可能已经接受了一个信息安全管理或领导职位。现在这项责任落在了你的肩上，由你来决定对于你的组织来说，安全意味着什么。这是我最近的一个企业职位。在这里，你学习如何管理安全预算和安全团队。这也是大多数安全专业人士对业务目标与信息安全控制之间的平衡产生更深层次理解的地方。


    你可能已经在管理或领导岗位上工作了多年，你想反转角色，退后一步，从外部观察并判断你所做的一切是否恰当。你是否真的保护了所有需要保护的内容？你的安全计划是否完整且全面？你的安全计划提供的价值是否与业务目标一致？


    最后，也许你已经转向了信息安全咨询。你已经厌倦了企业化的生活方式，想将多年积累的专业知识分享给其他组织，让他们知道从何开始以及如何实施安全。鉴于每个国家经济根基中存在中小企业，以这种方式分享你的专业知识具有不可估量的重大意义！


    无论你今天处于何种位置，我们即将涵盖的内容都直接适用于你正在所做的工作。它将帮助你在职业生涯中成长。它将帮助你完善你可能正在管理的安全计划。我希望每个人从这些材料中获得的启示是：信息安全领域迫切需要积极、敬业的专业人士，这些人即使他们还没有背景和经验，也理解信息安全对各种规模企业的重要性和价值。我们即将涵盖的主题非常多样——这些知识需求量巨大，而这些信息将帮助你找到那些空缺职位之一。更重要的是，正如关注新闻的人所知，这种知识是人们迫切需要的。


    ![](img/F000015u01-03-9780128041727.jpg)


    我将从一个框架开始，虽然有很多框架可供选择，但我个人发现最成功的是 `ISO/IEC 27000` 系列。


    你可能已经知道 `ISO/IEC 27000` 系列是实施信息安全管理系统（`ISMS`）的标准集合，但大多数人没有意识到，`ISO/IEC 27000`
    系列实际上包含 16 个独立的标准和文档。甚至有一个标准专门用于在医疗保健机构中实施信息安全管理系统（`ISO/IEC 27799`），在那里，你受到《健康保险流通性与责任法》（`HIPAA`）合规性的约束，并被要求妥善保护电子保护健康信息（`ePHI`）。


    如果你是第一次看到 `ISO/IEC 27000` 系列，`ISO/IEC 27001`（信息技术——安全技术——信息安全管理系统——要求）包含了关于计划应该是什么样子的核心知识集。然而，我发现关注
    `ISO/IEC 27002`（信息技术——安全技术——信息安全控制实践规范）中概述的控制措施最有价值。


    我提到过我在多个企业信息安全职位上工作过。在其中一个职位中，我被请到一家机构帮助他们实现支付卡行业数据安全标准（`PCI DSS`）合规。我很快发现，`PCI`
    合规与……（此处原文存在大量重复，已按要求处理，确保不重复输出）

