    # I. INTRODUCTION


    COVID-19 is a global pandemic that collapsed the healthcare systems in countries.
    In the year 2020, all over the world witnessed the death of thousands of people
    from many nations around world. Furthermore, this event has affected the operations
    of healthcare facilities. The medical centres treated patients who are confirmed
    to be COVID-19 (+) or COVID-19 (-). The World Health Organization (WHO) advises
    that all cases of importance to consider the fact that the isolation of all confirmed
    cases is also able to prevent transmission and provide acceptable care.


    some researchers [5] used the pre-trained deep learning architectures (DenseNet120)
    with transfer learning in order to develop tool to detect infected patients based
    on CT images. Many researchers [6] have combined CT scans with machine learning
    to detect the intersection between the CT and the clinical symptoms using basic
    learning methods, like, SVM, random forest, and MLP approach. Itter [7] used the
    hybrid learning method of ANNIS and MLP to predict mortality rate of COVID-19
    patients. In we review a range of machine learning models to forecast the COVID
    outbreak. This study presents a range of suggestions to demonstrate the potential
    of machine learning for future research.'
