    Rapid diagnosis of COVID-19 is of utmost importance. This paper utilized COVID-19
    detection by six different machine learning algorithms, such as SVM, BNB, GBDT,
    AdaBoost, CNN and MLP based on datasets that include image from 90 patients with
    severe symptoms. The main goal was to introduce-ML methods for end-users of medical
    systems in a comprehensive way. We compared the performance of state-of-the-art
    models and found that important the ML-based models reliability to diagnose disease.
    The experimental results and discussions show that the SVM with RBF kernel outperforms
    other methods.


    In our experiment, each test was set with six different machine learning algorithms.
    By using the values in the confusion matrix, five statistics (1–5) were calculated
    to measure the effectiveness of the algorithms. We compared architectures of CNN
    designed as fully connected layers with 350, 250, 150, and 2 neurons in each layer.
    Except for the last layer, the rectified unit (ReLU) used in described MLP method
    and the last layer “softmax” activation, which return an array of two activity
    scores (Positive or Negative).


