    **Abstract—** Early studies suggest that COVID-19 may be accompanied by symptoms
    such as cough, muscle ache, sore throat, and more to severe respiratory illness.
    The symptoms of this disease indicate that COVID-19 causes negative effects on
    the lungs. Considering the health status of the lungs using X-rays and CT scans
    can significantly help diagnose COVID-19 infection. Due to the fact that most
    methods that have been proposed to COVID-19 deal with either theory and have limited
    results, this paper aims to review and evaluate artificial intelligence (AI) based
    diagnosis methods in order to detect infection with zero or near zero false positives
    and false negatives.


    the process of diagnosing this disease (taste) is the easy transmission of this
    disease among people in a community or even health facilities [1.2]. Since most
    of the tests needed a lot of time to generate the result compared to the time
    for spreading among people, X-Ray or Computer Tomography (CT) scan images of COVID-19
    is used to provide an effective way to detect infected individuals. It is an undeniable
    fact that artificial intelligence plays a crucial role in making human daily life
    more convenient than the past. The advantage of AI methods is their flexibility
    in order to identify and classify objects. For this reason, many researchers in
    the world of artificial intelligence have drawn attention to the data obtained
    from people suffering from COVID-19. This paper aims to discuss the importance
    of machine learning to diagnose COVID-19 infection regarding their CT scans. Many
