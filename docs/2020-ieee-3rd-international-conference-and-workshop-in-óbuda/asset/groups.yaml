    # CANDO-EPE 2020 • IEEE 3rd International Conference and Workshop in Obuda on
    Electrical and Power Engineering • Nov. 18, 2020 • Budapest, Hungary


    In a nutshell, Table I indicates the advantages and disadvantages of all mentioned
    machine learning models.


    ## TABLE I. ADVANTAGES AND DISADVANTAGES OF ML MODELS


    | Models | Advantages | Disadvantages |

    |---|---|---|

    | SVM | Effective performance in high dimensional spaces | Doesn''t perform well
    with large set (required high training time) |

    | NB | Easy and fast class prediction in test datasets | Need to calculate the
    prior probability |

    | Single models MLP | Adaptive learning, coefficients that can be easily adapted
    | It requires more training data than traditional machine learning algorithms
    |

    | CNN | Automatically detects important features (Feature convolution of image
    and filters to generate invariant features) | Unexplained functioning of the network
    (Black box), require processors with parallel processing power |

    | Adaboost | Less susceptible to overfitting problem than most learning algorithms
    | Using two weak classifiers can lead to low margins and overfitting |

    | Ensemble models GBDT | Lots of flexibility (can optimize different functions)
    | Too much to minimize all errors can encompass outliers and cause overfitting
    |


    ![](img/e17a28e67263eace1a08775c53bd5f90_2_0.png)


    Fig. 1. X-ray images of normal and COVID-19 caused patient


    ## III. EXPERIMENTAL RESULTS


    In this section, all described models in the previous section were evaluated and
    based on the data we included image data on 980 patients with COVID-19 infection.
    The implementation is facilitated by Scikit-Learn and Keras libraries. The experimental
    results are reported and analyzed in detail by using a CPU with the implementation
    of Intel i5-2.20 GHz with 16 GB RAM.


    ## A. Data description


    This paper evaluates all models described in the previous section based on two
    datasets. The first set includes image data on 430 patients infected with COVID-19.
    Also, 550 healthy (normal) individuals were randomly selected from the second
    data set [200]. The Following figure illustrates samples of both classes.


    ## B. Performance evaluation


    In this study, we split the data images into a training and testing image set.
    We use 75% of the data for training data for the model, the next 25% used for
    testing. Moreover, all described models were evaluated by taking advantage of
    the well-known performance criteria and Matthews correlation coefficient (MCC)[21,22].


    According to the confusion matrix, the formulas for these are described as follows:


    ```

    $Accuracy = \frac{T_p}{T_p + F_n} (1)$$

    $$Precision = \frac{T_p}{T_p + F_p} (2)$$

    $$Recall = \frac{T_p}{T_p + F_n} (3)$$

    $$F-score = \frac{2 \times P \times R}{P + R} (4)$$

    $$MCC = \frac{\sqrt{T_p \times T_n}}{\sqrt{(T_p + F_n)(T_n + F_p)}} (5)$$

    ```


    where $F_n$ and $F_p$ present the quantity of the incorrect predictions respectively.
    $T_p$ and $T_n$ indicate the quality of correct predictions.


    The results of the implemented machine learning algorithms evaluated using the
    datasets described. Table I presents the performance of trained models with regard
    to the mentioned standard performance criteria.


    ## H. Tabricicki et al. Rapid COVID-19 Diagnosis Using Deep Learning of Computed
    Tomography Scans


    ## IV. CONCLUSIONS


    | TABLE II. PERFORMANCE COMPARISON BETWEEN COVID-19 DETECTION MODELS |

    | | Artificial Network | Machine learning | Ensemble learning |

    | :--- | :--- | :--- | :--- |

    | Model | MLP | CNN | SVM | N | GBDT | GBDT |

    | Accuracy | 0.9400 | 0.9768 | 0.9920 | 0.9460 | 0.9600 | 0.9520 |

    | Precision | 0.9505 | 0.9724 | 0.9918 | 0.9219 | 0.9435 | 0.9415 |

    | Recall | 0.8715 | 0.9874 | 1.0000 | 0.9541 | 0.9633 | 0.9816 |

