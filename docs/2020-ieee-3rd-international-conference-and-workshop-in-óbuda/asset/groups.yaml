    - MLP: Multilayer perceptron

    - NB: Naive Bayes

    - SLT: Statistical Learning Theory

    - SRM: Structural Risk Minimization

    - SVM: Support Vector Machine

    - WHO: World Health Organization


    In addition, the architecture of CNN designed with convolutional layers with a
    kernel size of 7x7 to extract the features and each with 3x3 average or max pooling
    to process the features. The number of convolution in each layer is 64. The max
    pooling layer, which 2-dimensional fully connected layer is added with dropout
    to prevent overfitting. In Table II, we show that SVM outperforms the other models.
    The performance of CNN shows with 97% accuracy. For the accuracy of the SVM model,
