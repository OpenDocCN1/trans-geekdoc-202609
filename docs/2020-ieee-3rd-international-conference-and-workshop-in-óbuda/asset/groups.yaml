    nadi@student.hu


    ## Abstract

    Early studies suggest that COVID-19 may be accompanied by symptoms such as cough,
    muscle ache, sore throat, and severe respiratory illness. The symptoms indicate
    that COVID-19 causes effects on the lungs. Considering the health status of lungs
    using X-rays and CT scans can significantly help diagnose COVID-19 infection.
    Due to the fact that most methods that have been proposed deal with either limited
    results, this paper aims to review and evaluate artificial intelligence (AI) based
    methods in order to detect infection with false positives and false negatives.
    The process of diagnosing this disease among people in the community using X-ray
    or Computer Tomography (CT) scan images is used to provide an effective way to
    detect individuals. It is an undeniable fact that artificial intelligence plays
    a crucial role in making daily life more convenient than the past. The advantage
    of AI methods is their flexibility in order to identify and classify objects.
    For this reason, many researchers in the world of artificial intelligence have
    drawn attention to the data obtained from people suffering from COVID-19.


    **Keywords:** image-based diagnosis, artificial intelligence, machine learning,
    deep learning, computerized tomography


    ## I. INTRODUCTION

    COVID-19 is a global pandemic that collapsed the healthcare systems in countries.
    In the year 2020, all over the world witnessed the death of thousands of people
    from many nations. Furthermore, this event has affected the operations of healthcare
    facilities. The World Health Organization (WHO) advises that to prevent transmission
    and provide acceptable care, some researchers used pre-trained deep learning architectures
    (DenseNet) with transfer learning in order to develop tools to detect infected
    patients based on CT images. Many researchers have combined CT scans with machine
    learning to detect the intersection between the CT and the clinical symptoms using
    basic learning methods like SVM, random forest, and MLP approach. It used the
    hybrid learning method of ANN and MLP to predict mortality rate of COVID-19 patients.
    We review a range of machine learning models to forecast the COVID outbreak. This
    study presents a range of suggestions to demonstrate the potential of machine
    learning for future research.


    In a nutshell, the main motivation of this paper is to find the most accurate
    algorithm for detecting COVID-19. In other words, we use state-of-the-art learning
    models to classify positive and negative COVID-19 individuals by their captured
    X-Ray or CT scan images.


    The rest of this paper is outlined as follows: Section 2 reviews learning-based
    models. Section 3 compares the performances of the designed and implemented learning
    models. Section 4 draws conclusions and offers some suggestions for the end-users
    of medical imaging.


    ## II. REVIEW OF MACHINE LEARNING-BASED MODELS

    AI has the potential to improve medical imaging capabilities and design. Using
    ML, ANN, and ensemble learning for medical recognition is a core component of
    vision in this widespread area. ML methodology works to improve medical intelligence
    without use of conventional techniques. The performance of ML algorithms is achieved
    with mathematical techniques and improved by experience [4]. Generally, ML uses
    historical data to discover and uncover hidden insights. Image-based models are
    able to learn from medical records. This process is done through deep delving
    into the patterns within complex imaging [6]. The following subsections describe
    the basic and existing AI-based classifier methods in a brief.


    ### A. Single models

    In the following, the basic classifiers for detecting COVID-19 are introduced:


    - Support Vector Machine (SVM) is one of the commonly-used algorithms in research
    and industry to improve the performance of machine learning. The main advantage
    of this algorithm is to deal with non-linear problems. SVM can be used to solve
    classification problems by transforming the problem using the kernel method which
    makes SVC calculation in the high-dimensional dimension viable. We used the Statistical
    Learning Theory (SLT) and Structural Risk Minimization (SRM) to implement this
    concept. SVM can be effectively implemented in classification, regression, and
    nonlinear function approximation [9,10].


    - Naive Bayes (NB) is a well-known classification algorithm that applies Bayes
    Theorem with an assumption of independence among set of classifiers (algorithms).
    During the process of constructing classifiers, the NB model needs a small amount
    of training data to estimate the vital parameters [11]. In other words, the performance
    of each class is estimated by calculating the conditional density function and
    posterior probability. Finally, the prediction is made for the class that has
    the largest posterior probability.


    - Artificial neural networks (ANN) are computing systems widely used for medical-based
    image classification. In fact, ANN draws inspiration from biological systems and
    an interconnected network of neurons process information. These models use general
    procedures to reproduce input data in a hierarchical structure. During the training
    phase, a weight (representing input data) must be measured and adjusted. The number
    of connections between neurons, the architecture of the ANN, is designed to design
    various layers of neurons.


    - Multilayer perceptron (MLP) is a well-known ANN which neurons are distributed
    in connected layers. The network is divided into three layers: input layers, output
    layers, and hidden layers. The weights are transferred through transformation.
    Usually the gradient descent backpropagation algorithm is used to train an error
    defined as a criterion to update the weight


    - CNN is a neural network that is capable to process large scale images. As the
    other ANN, CNN is a network that has several layers sequential connection between
    the layers. The output of the previous is intersected with the input of another.
    However, unlike fully connected network in this network, the neurons in one layer
    do not connect to all the neurons in the next.


    - Ensemble models


    - AdaBoost (Boosting) is an ensemble algorithm that can be used in conjunction
    with many types of learning algorithms to improve performance. AdaBoost initially
    created to enhance the performance of binary classification. The main idea is
    about using an iterative approach in order to learn the mistakes of weak classifiers,
    and then to learn from those ones by increasing the weight of misclassified data
    points [18].


    - Gradient boosting tree (GBT) is an algorithm that produces a prediction in the
    form of an ensemble of weak prediction (models). Gradient trees learn from the
    residual error (tree), rather than update the weights of data points [19].

