    \ Mosavi\n匈牙利布达佩斯大学电气工程学院\namir.mosavi@student.hu\n\nSaba Gali\n匈牙利奥布达大学约翰·冯·诺依曼信息学院\n\
    sabagali@student.un.hu\n\nImre Felede\n匈牙利奥布达大学约翰·冯·诺依曼信息学院\nfelde@obuda.hu\n\n\
    László Nadi\n匈牙利布达佩斯大学电气工程学院\nnadi@student.hu\n\n## 摘要\n早期研究表明，COVID-19 可能伴随有咳嗽、肌肉酸痛、喉痛和严重呼吸疾病等症状。这些症状表明\
    \ COVID-19 对肺部产生了影响。利用 X 射线和 CT 扫描考虑肺部健康状况可以有助于诊断 COVID-19 感染。鉴于大多数提出的方法结果局限，本文旨在回顾和评估基于人工智能（AI）的方法，以检测具有假阳性和假阴性的感染。在社区人群中使用\
    \ X 射线或计算机断层扫描（CT）图像进行该疾病诊断的过程，为检测个体提供了一种有效方法。人工智能在让日常生活变得比过去更方便方面发挥着不可否认的关键作用。AI\
    \ 方法的优势在于其识别和分类对象的灵活性。因此，人工智能领域的许多研究人员已经了从患有 COVID-19 的人体获得的数据。\n\n**关键词：** 基于图像的诊断、人工智能、机器学习、深度学习、计算机断层扫描\n\
    \n## I. 引言\nCOVID-19 是一场全球性流行病，导致许多国家的医疗系统崩溃。2020 年，全球见证了来自多个国家的数千人死亡。此外，这一事件影响了医疗机构的运行。世界卫生组织（WHO）建议，为了防止传播并提供合理的护理，一些研究人员使用了预训练的深度学习架构（DenseNet）结合迁移学习来开发基于\
    \ CT 图像检测感染患者的工具。许多研究将 CT 扫描与机器学习相结合，使用 SVM、随机森林和 MLP 方法等基础学习方法检测 CT 与临床症状之间的交叉点。某研究使用了\
    \ ANN 和 MLP 的混合学习方法来预测 COVID-19 患者的死亡率。我们回顾了系列机器学习模型以预测 COVID 的爆发。本研究提供了一系列建议，以展示机器学习在未来研究中的潜力。\n\
    \n简而言之，本文的主要动机是寻找检测 COVID-19 最准确的算法。换句话说，我们使用先进的学习模型，通过采集的 X 射线或 CT 扫描图像对 COVID-19\
    \ 阴性个人进行分类。\n\n本文其余部分的概述如下：第 2 节回顾了基于学习的模型；第 3 节比较了设计实现的学习模型的性能；第 4 节得出结论并为医学成像的终端用户提供建议。\n\
    \n## II. 基于机器学习的模型回顾\n AI 有提高医学成像能力和设计的潜力。使用 ML、ANN 和集成学习进行医学识别是这一广泛领域视觉的核心组成部分。机器学习方法论工作在不使用传统技术的情况下提高医学智能。机器学习算法的性能通过数学技术实现，并通过经验进行改进\
    \ [4]。通常，机器学习使用历史数据来发现和揭示隐藏的见解。基于图像的模型能够从医学记录中学习。这一过程是通过深入挖掘复杂成像中的模式完成的 [6]。以下子节简要描述了基础和现有的基于\
    \ AI 的分类器方法。\n\n### A. 单模型\n下文中介绍了用于检测 COVID-19 的基础分类器：\n\n- 支持向量机（SVM）是研究和工业中提高机器学习性能的常用算法之一。该算法的主要优势是处理非线性问题。SVM\
    \ 可以通过核方法转换问题来解决分类问题，从而使高维空间中的 SVC 计算可行。利用统计学习理论（SLT）和结构风险最小化（SRM）来实现这一概念。SVM\
    \ 可有效应用于分类、回归和非线性函数近似 [9,10]。\n\n- 朴素贝叶斯（NB）是一种著名的分类算法，它在假设分类器（算法）独立的条件下应用贝叶斯定理。在构建分类器的过程中，NB\
    \ 模型需要少量训练数据来估计关键参数 [11]。换句话说，通过计算条件密度函数和后验概率估计每个类的性能。最后，对后验概率最大的类进行预测。\n\n- 人工神经网络（ANN）是广泛用于医学分类的计算系统。事实上，ANN\
    \ 的灵感来自生物系统，相互连接的神经网络处理信息。这些模型使用通用程序在分级结构中复制输入数据。在训练阶段，必须测量和调整权重（代表输入数据）。神经元之间的连接数量即\
    \ ANN 的架构，用于设计不同层的神经元。\n\n- 多层感知器（MLP）是一种著名的 ANN，其神经元分布在连接层中。网络被分为三层：输入层、输出层和隐藏层。权重通过转换传递。通常使用梯度下降反向传播算法进行训练\n\
    \n- CNN 是一种能够处理大规模图像的神经网络。与其他 ANN 类似，CNN 是一个层与层之间有顺序连接的网络。然而，与全连接网络不同，该网络中的神经元并不连接到下一层的所有神经元。\n\
    \n- 集成模型\n\n- AdaBoost（Boosting）是一种可以与许多类型的学习算法相结合以提高性能的集成算法。AdaBoost 最初是为了增强二分类性能。主要思想是使用迭代方法学习弱分类器的错误，然后通过增加错误分类数据点的权重从这些错误中学习\
    \ [18]。\n\n- 梯度提升树（GBT）是一种以弱预测（模型）集成形式产生预测的算法。梯度树从残差误差（树）中学习，而不是更新数据点的权重 [19]。\n\
    \n"
