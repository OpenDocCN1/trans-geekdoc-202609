    # CANDO-EPE 2020 • 在奥布达举办的 IEEE 第三届电气与电力工程国际会议与研讨会 • 2020年11月18日 • 匈牙利布达佩斯


    简而言之，表 I 指明了所有提到的机器学习模型的优缺点。


    ## 表 I. 机器学习模型的优缺点


    | 模型 | 优点 | 缺点 |

    |---|---|---|

    | SVM | 在高维空间中性能有效 | 在大型数据集上表现不佳（需要较长的训练时间） |

    | NB | 在测试数据集上进行分类预测简单且快速 | 需要计算先验概率 |

    | 单模型 MLP | 自适应学习，系数可以容易调整 | 比传统的机器学习算法需要更多的训练数据 |

    | CNN | 自动检测重要特征（通过图像的特征卷积和滤波器生成不变特征） | 网络工作原理不透明（黑箱），需要具有并行处理能力的处理器 |

    | Adaboost | 比大多数学习算法更不易过拟合问题的影响 | 使用两个弱分类器可能会导致低边际和过拟合 |

    | 集成模型 GBDT | 具有很高的灵活性（可以优化不同的函数） | 为了最小化所有误差可能会包含离群值并导致过拟合 |


    ![](img/e17a28e67263eace1a08775c53bd5f90_2_0.png)


    图 1. 正常患者与 COVID-19 患者的 X 射线图像


    ## III. 实验结果


    在本节中，对前节描述的所有模型进行了评估，根据我们包含的数据，我们加入了 980 名 COVID-19 感染患者的图像数据。该实现通过 Scikit-Learn
    和 Keras 库完成。实验结果使用配备 Intel i5-2.20 GHz 处理器和16 GB RAM 的 CPU 进行了详细的报告和分析。


    ## A. 数据描述


    本文基于两个数据集评估了前节描述的所有模型。第一组数据包含 430 名感染 COVID-19 的患者的图像数据。此外，还从第二个数据集中随机选取了 550
    名健康（正常）个体 [200]。下图展示了这两类别的样本。


    ## B. 性能评估


    在这项研究中，我们将图像数据分为训练集和测试图像集。我们使用 75% 的数据用于模型的训练，剩下的 25% 用于测试。此外，利用知名的性能标准和马特修斯相关系数
    (MCC)[21,22] 对所有描述的模型进行了评估。


    根据混淆矩阵，这些公式的描述如下：


    ```

    $Accuracy = \frac{T_p}{T_p + F_n} (1)$$

    $$Precision = \frac{T_p}{T_p + F_p} (2)$$

    $$Recall = \frac{T_p}{T_p + F_n} (3)$$

    $$F-score = \frac{2 \times P \times R}{P + R} (4)$$

    $$MCC = \frac{\sqrt{T_p \times T_n}}{\sqrt{(T_p + F_n)(T_n + F_p)}} (5)$$

    ```


    其中 $F_n$ 和 $F_p$ 分别代表错误预测的数量。$T_p$ 和 $T_n$ 表示正确预测的质量。


    使用了描述的数据集对所实现的机器学习算法进行了评估。表 I 展示了经过训练的模型相对于上述标准性能指标的性能。


    ## H. Tabricicki 等人. 使用计算机断层扫描深度学习诊断 COVID-19


    ## IV. 结论


    | 表 II. COVID-19 检测模型之间的性能对比 |

    | | 人工网络 | 机器学习 | 集成学习 |

    | :--- | :--- | :--- | :--- |

    | 模型 | MLP | CNN | SVM | N | GBDT | GBDT |

    | 准确率 | 0.9400 | 0.9768 | 0.9920 | 0.9460 | 0.9600 | 0.9520 |

    | 精确率 | 0.9505 | 0.9724 | 0.9918 | 0.9219 | 0.9435 | 0.9415 |

    | 回召率 | 0.8715 | 0.9874 | 1.0000 | 0.9541 | 0.9633 | 0.9816 |

    | F-score | 0.9208 | 0.9774 | 0.9920 | 0.9327 | 0.9545 | 0.9469 |

    | MCC | 0.8814 | 0.9502 | 0.9873 | 0.9189 | 0.9050 |


    快速诊断 COVID-19 至关重要。本文利用六种不同的机器学习算法（如 SVM、BNB、GBDT、AdaBoost、CNN 和 MLP）对 COVID-19
    进行检测，这些数据集包含了来自 90 名有严重症状患者的图像。主要目标是向医疗系统的终端用户全面介绍机器学习（ML）方法。我们比较了最先进模型的性能，发现基于机器学习的模型在诊断疾病方面的可靠性非常重要。实验结果和讨论表明，使用
    RBF 核的 SVM 性能优于其他方法。


    在我们的实验中，每个测试都设置了六种不同的机器学习算法。通过使用混淆矩阵中的值，计算了五个统计量（1–5）来衡量算法的有效性。我们比较了设计为全连接层的 CNN
    架构，每层分别有 350、250、150 和 20 个神经元。除了最后一层外，描述的 MLP 方法使用的修正线性单元（ReLU）和最后一层“softmax”激活返回一个包含两个得分的数组（阳性或阴性）。


