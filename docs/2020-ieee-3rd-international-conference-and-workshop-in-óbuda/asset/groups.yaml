    # Rapid COVID-19 Diagnosis Using Computer Tomography Scans


    Hamed Tabriz

    Department of Computer Science,

    Shahid University of Kerman, Iran


    Amir Mosavi

    Faculty of Electrical Engineering, University of Budapest, Hungary

    amir.mosavi@student.hu


    Saba Gali

