- raw: 'The development of computer networks very quickly culminated in the Internet,
    which is *the* computer network that covers the whole globe. The Internet made
    it possible for anyone in the world who has access to a computer to send information,
    such as an email, to anyone else. And because all our data and devices are already
    digital, the information we can share is more than just text and numbers; we can
    send images, videos, music, speech, anything.


    With computer networks, digitally represented information can be sent at the speed
    of light to anyone, anywhere. The computer is no longer just a machine where data
    is stored and processed, but it has also become a means to transfer and share
    information. Connectivity increased so quickly and digital communication has become
    so cheap, fast, and reliable that digital transfer has supplanted mail as the
    main technology for information transfer.


    Anyone who is “online” can make their own data on their own computer available
    over the network to anyone else, which is how the World Wide Web was born. People
    can “surf” the Web and browse this shared information. Very quickly, secure protocols
    have been implemented to share confidential information, thereby permitting commercial
    transactions over the Web, such as online shopping or banking. Online connectivity
    has further increased the infiltration of digital technology. When we get an online
    service by using the “www.” portal of the service provider, our computer turns
    into the digital version of the shop, the bank, the library, or the university;
    this, in turn, created more data.


    ## Mobile Computing


    Every decade we have been seeing computers getting smaller, and with advances
    in battery technology,[2](#13811-0015.xhtml#en3) in the mid-1990s, portable—laptop
    or notebook—computers that can also run on batteries started to become widespread;
    this started the new era of *mobile computing*. Cellular phones also started to
    become popular around the same time, and roughly around 2005, these two technologies
    merged in the smartphone.


    A *smartphone* is a phone that is also a computer. In time, the smartphone became
    smarter—more a computer and less a phone—so much so that today, the phone is only
    one of many apps on a smartphone, and a rarely used one at that. The traditional
    phone was an acoustic device: you talked into it, and you heard the person on
    the other end talking. The smartphone today is more of a visual device; it has
    a large screen and we spend more time looking at this screen or tapping its touch-sensitive
    surface than talking.


    A smartphone is a computer that is always online[3](#13811-0015.xhtml#en4) and
    it allows its user to access the Internet for all types of information while mobile.
    It therefore extends our connectivity in that it permits us greater access—for
    example, while traveling—to data on other computers, as well as making us, and
    our data, accessible to others.


    What makes a smartphone special is that it is also a mobile sensing device and
    because it is always on our person, it continuously records information about
    us, most notably our position, and can make this data available. The smartphone
    is a mobile sensor that makes us detectable, traceable, recordable.


    This increased mobility of the computer is new. Once the computer was big and
    at a “computer center”; it stayed fixed, and we needed to walk to it. We sat in
    front of a terminal to use the computer—it was called a “terminal” because the
    computer ended there. Then a smaller computer came to our department, and later
    a smaller one sat on our desk in our office or in our house, and then an even
    smaller one was on our lap, and now the computer is in our pocket and with us
    all the time.


    Once there were very few computers, possibly one computer per thousands of people—for
    example, one per company or campus. This computer-per-person ratio increased very
    quickly, and the personal computer aimed to have one computer for every person.
    Today we have many computers per person. Now all our devices are also computers
    or have computers in them. Your phone is also a computer, your TV is also a computer,
    your car has many computers inside it for different functions, and your music
    player is a specialized computer as is your camera or your watch. The *smart device*
    is a computer that does the digital version of whatever it did originally.


    *Ubiquitous computing* is a term that is becoming increasingly popular; it means
    using computers without knowing that you are using one. It means using a lot of
    computers for all sorts of purposes all the time without explicitly calling them
    computers. The digital version has its usual advantages, such as speed, accuracy,
    and easy adaptability. But another advantage that is most relevant to our discussion
    is that the digital version of the device now has all its data digitally. And
    furthermore, if it is online, it can talk to other online computers and make its
    data available almost instantaneously. We call them “smart objects” or just “things”
    and talk about the *Internet of Things*.


    ## Social Data


    A few thousands of years ago, you needed to be a god or goddess if you wanted
    to be painted, be sculpted, or have your story remembered and told. A thousand
    years ago you needed to be a king or queen, and a few centuries ago you needed
    to be a rich merchant, or in the household of one. Now anybody, even a soup can,
    can be painted. A similar democratization has also taken place in computing and
    data. Once only large organizations and businesses had tasks worthy of a computer
    and hence only they had data; starting with the personal computer, people and
    even objects became generators of data.


    With most communication now being done using computers (including smartphones)
    over the Internet, a recent source of data is *social media*, where our social
    interactions have become digital; these now constitute another type of data that
    can be collected, stored, and analyzed. Social media replaces discussions in the
    agora, piazza, market, coffeehouse, and pub, or at the gathering by the spring,
    the well, and the water cooler.


    With social media, each of us is now a celebrity whose life is worth following,
    and we are our own paparazzi. We are no longer allotted only fifteen minutes of
    fame, but every time we are online we are famous. The social media allows us to
    write our digital autobiography as we are living it. In the old times, books and
    newspapers were expensive and hence scarce; we could keep track of and tell the
    story of only important lives. Now data is cheap, and we are all kings and queens
    of our little online fiefdoms. Digitally savvy people of today who are continually
    posting on the social media as they wander from place to place are modern day
    versions of Odysseus, composing, and at the same time broadcasting in real time,
    their own digitized epics, with their own thrills and dangers.


    ## All That Data: The Dataquake


    The data generated by all our computerized machines and services was once a by-product
    of digital technology, and computer scientists have done significant amount research
    on how to store and manipulate large amounts of data in databases most efficiently.
    Then, we stored data because we had to; more data meant costlier storage and slower
    access. Sometime in the last two decades, all this data became a resource; now,
    more data is a blessing.'
  fmt: '

    计算机网络的发展迅速催生了互联网，它是覆盖全球的*那一个*计算机网络。互联网让世界上任何拥有计算机访问权限的人都能将信息（如电子邮件）发送给任何其他人。而且因为我们所有的数据和设备本身就是数字化的，我们可以共享的信息远不止文本和数字；我们可以发送图像、视频、音乐、语音，任何东西。


    有了计算机网络，数字化表示的信息可以以光速发送给任何人、任何地方。计算机不再仅仅是存储和处理数据的机器，它也成为了传输和共享信息的手段。连接性增长如此之快，数字通信变得如此廉价、快速和可靠，以至于数字传输已取代邮件成为信息传输的主要技术。


    凡是“上网”的人都可以将自己计算机上的数据通过网络提供给任何其他人，这便是万维网诞生的方式。人们可以在网上“冲浪”并浏览这些共享信息。很快，安全协议被实施用于共享机密信息，从而允许通过网络进行商业交易，如网上购物或银行业务。在线连接进一步加深了数字技术的渗透。当我们通过服务提供商的“www.”门户使用在线服务时，我们的计算机就变成了商店、银行、图书馆或大学的数字化版本；这反过来又创造了更多数据。


    ## 移动计算


    每十年我们都会看到计算机变得更小，随着电池技术的进步[^2]，在 20 世纪 90 年代中期，可以靠电池运行的便携式——笔记本或手提——计算机开始普及；这开启了*移动计算*的新时代。蜂窝电话也大致在同一时期开始流行，大约在
    2005 年左右，这两种技术在智能手机中融合了。


    *智能手机*是一种既是电话又是计算机的设备。随着时间的推移，智能手机变得更“聪明”了——更像计算机，而不那么像电话——以至于今天，电话只是智能手机上众多应用中的一个，而且是一个很少被使用的应用。传统电话是一种声学设备：你对着它说话，听另一端的人说话。如今的智能手机更多是一种视觉设备；它有一个大屏幕，我们花更多时间盯着这个屏幕或点触其触控表面，而不是通话。


    智能手机是一台*始终在线*[^3]的计算机，它允许用户在移动中访问互联网获取各类信息。因此，它扩展了我们的连接性，允许我们获得更大的访问权限——例如在旅行时——访问其他计算机上的数据，同时也让我们自己和我们的数据对他人可访问。


    智能手机之所以特别，是因为它也是一种移动传感设备，且始终随身携带，因此持续记录关于我们的信息，最显著的是我们的位置，并能使这些数据可用。智能手机是一种移动传感器，让我们变得可被检测、追踪、记录。


    计算机移动性的这种增强是新事物。曾经计算机庞大且位于“计算机中心”；它固定不动，我们需要走到它面前。我们坐在终端前使用计算机——之所以叫“终端”，是因为计算机到此为止。后来更小的计算机来到我们的部门，再后来更小的一台放在我们办公室或家里的桌上，然后更小的一台放在我们腿上，现在计算机在我们口袋里，随时随地与我们在一起。


    曾经计算机非常少，可能几千人才有一台——例如一家公司或一个校园只有一台。这台计算机与人数的比例迅速增加，个人计算机旨在做到人手一台。今天我们人均拥有多台计算机。现在我们所有的设备也都是计算机或内置了计算机。你的手机也是计算机，你的电视也是计算机，你的汽车里为不同功能装有许多计算机，你的音乐播放器是专用计算机，你的相机或手表也是。*智能设备*是执行其原始功能的数字化版本的计算机。


    *普适计算*一词越来越流行；它意味着在不知不觉中使用计算机。它意味着一直为各种目的使用大量计算机，而不显式地称它们为计算机。数字化版本拥有其惯常优势，如速度、准确性和易适应性。但与我们讨论最相关的另一个优势是，设备的数字化版本现在拥有其所有数字化数据。此外，如果它是在线的，它可以与其他在线计算机通信，并几乎瞬间使其数据可用。我们称它们为“智能物体”或简称“物”，并谈论*物联网*。


    ## 社会数据


    几千年前，如果你想被绘制肖像、被雕塑塑像、或让你的故事被铭记和传颂，你需要是神。一千年前你需要是国王或王后，几个世纪前你需要是富商，或是其家庭成员。现在任何人，甚至一罐汤，都可以被绘制。类似的民主化也发生在计算和数据领域。曾经只有大型组织和企业拥有值得用计算机处理的任务，因此只有它们拥有数据；从个人计算机开始，人甚至物体都成为了数据的生成者。


    随着大多数通信现在通过计算机（包括智能手机）在互联网上进行，数据的一个近期来源是*社交媒体*，我们的社交互动已变得数字化；这些现在构成了另一种可以被收集、存储和分析的数据类型。社交媒体取代了阿哥拉广场、广场、市场、咖啡馆和酒吧，或泉边、井边和饮水机旁的聚会中的讨论。


    有了社交媒体，我们每个人现在都是值得被关注的名人，我们是自己的狗仔队。我们不再只有十五分钟的成名时间，而是每次上网我们都在成名。社交媒体让我们在生活的同时书写自己的数字自传。在旧时代，书籍和报纸昂贵因此稀缺；我们只能记录和讲述重要人物的故事。现在数据廉价，我们都是自己小小在线领地的国王和王后。如今精通数字技术的人在漫游各地时持续在社交媒体发帖，他们是奥德修斯的现代版本，在实时广播的同时创作自己的数字化史诗，包含他们自己的惊险与危险。


    ## 所有这些数据：数据震


    我们所有计算机化机器和服务产生的数据曾是数字技术的副产品，计算机科学家已在如何最高效地在数据库中存储和操作大量数据方面做了大量研究。那时，我们存储数据是因为不得不存；更多数据意味着更昂贵的存储和更慢的访问。在过去二十年的某个时候，所有这些数据变成了一种资源；现在，更多数据是一种福气。

    '
  trans: '

    The rapid development of computer networks gave rise to the Internet, *the* global
    computer network. The Internet allows anyone in the world with computer access
    to send information (such as email) to anyone else. And because all our data and
    devices are digital themselves, we can share far more than text and numbers; we
    can send images, video, music, voice—anything.


    With computer networks, digitally represented information can be sent to anyone,
    anywhere, at the speed of light. Computers are no longer just machines that store
    and process data; they have also become a means of transmitting and sharing information.
    Connectivity grew so fast, and digital communication became so cheap, fast, and
    reliable that digital transmission has replaced mail as the primary technology
    for information transfer.


    Anyone who goes "online" can make data from their computer available to anyone
    else via the network; this is how the World Wide Web was born. People can "surf"
    the Web and browse this shared information. Soon, security protocols were implemented
    for sharing confidential information, enabling commercial transactions over the
    network, such as online shopping or banking. Online connectivity further deepened
    the penetration of digital technology. When we use online services through a service
    provider''s "www." portal, our computer becomes a digital version of a store,
    bank, library, or university; this in turn creates even more data.


    ## Mobile Computing


    Every decade we see computers get smaller, and with advances in battery technology[²],
    by the mid-1990s, portable—laptop or notebook—computers that could run on batteries
    became common; this ushered in a new era of *mobile computing*. Cellular phones
    also became popular around the same time, and around 2005, these two technologies
    converged in the smartphone.


    A *smartphone* is a device that is both a phone and a computer. Over time, smartphones
    became "smarter"—more like computers and less like phones—so that today, the phone
    is just one of many apps on a smartphone, and a rarely used one at that. A traditional
    phone is an acoustic device: you speak into it and listen to the person at the
    other end. Today''s smartphone is more of a visual device; it has a large screen,
    and we spend more time staring at this screen or tapping its touch surface than
    talking.


    The smartphone is an *always-on*[³] computer that allows users to access the Internet
    for all kinds of information while on the move. It thus extends our connectivity,
    allowing us greater access—for example, while traveling—to data on other computers,
    while also making ourselves and our data accessible to others.


    The smartphone is special because it is also a mobile sensing device, and because
    it is always carried, it continuously records information about us, most notably
    our location, and can make this data available. The smartphone is a mobile sensor
    that makes us detectable, trackable, recordable.


    This enhanced mobility of computers is new. Computers used to be huge and located
    in "computer centers"; they were stationary, and we had to go to them. We sat
    at terminals to use the computer—called "terminals" because that is where the
    computer ended. Then smaller computers came to our departments, then even smaller
    ones sat on desks in our offices or homes, then smaller ones on our laps, and
    now computers are in our pockets, with us everywhere, all the time.


    Computers used to be very few, perhaps one per several thousand people—for example,
    one per company or campus. This ratio of computers to people increased rapidly,
    and personal computers aimed for one per person. Today we have multiple computers
    per person. Now all our devices are also computers or have computers embedded
    in them. Your phone is a computer, your TV is a computer, your car has many computers
    for different functions, your music player is a dedicated computer, your camera
    or watch is too. *Smart devices* are computers that are digital versions performing
    their original function.


    The term *ubiquitous computing* is gaining popularity; it means using computers
    without realizing it. It means using large numbers of computers all the time for
    all sorts of purposes without explicitly calling them computers. Digital versions
    have their usual advantages, such as speed, accuracy, and adaptability. But another
    advantage most relevant to our discussion is that the digital version of a device
    now has all its digital data. Moreover, if it is online, it can communicate with
    other online computers and make its data available almost instantly. We call them
    "smart objects" or just "things," and talk about the *Internet of Things*.


    ## Social Data


    Thousands of years ago, if you wanted your portrait painted, your statue sculpted,
    or your story remembered and told, you needed to be a god. A thousand years ago
    you needed to be a king or queen; a few centuries ago you needed to be a wealthy
    merchant, or a member of their family. Now anyone, even a can of soup, can be
    painted. A similar democratization has occurred in computing and data. Once only
    large organizations and enterprises had tasks worthy of computer processing, so
    only they had data; starting with personal computers, people and even objects
    became generators of data.


    With most communication now taking place over the Internet via computers (including
    smartphones), a recent source of data is *social media*, where our social interactions
    have become digitized; these now constitute another type of data that can be collected,
    stored, and analyzed. Social media has replaced discussions in the agora, the
    piazza, the marketplace, the café and the bar, or gatherings at the spring, the
    well, and the water cooler.


    With social media, each of us is now a celebrity worth following; we are our own
    paparazzi. We no longer have just fifteen minutes of fame; we are famous every
    time we go online. Social media lets us write our own digital autobiographies
    as we live. In the old days, books and newspapers were expensive and therefore
    scarce; we could only record and tell the stories of important people. Now data
    is cheap, and we are all kings and queens of our own little online realms. Today,
    digitally savvy people posting continuously on social media as they roam are modern-day
    Odysseys, composing their own digital epics in real-time broadcast, complete with
    their own perils and adventures.


    ## All This Data: The Data Quake


    The data produced by all our computerized machines and services was once a byproduct
    of digital technology, and computer scientists have done extensive research on
    how to store and manipulate large amounts of data in databases most efficiently.
    Back then, we stored data because we had to; more data meant more expensive storage
    and slower access. At some point in the last two decades, all this data became
    a resource; now, more data is a blessing.

    '
  toc: []
- raw: 'Think, for example, of a supermarket chain that sells thousands of goods to
    millions of customers every day, either at one of the numerous brick-and-mortar
    stores all over a country or through a virtual store over the Web. The point-of-sales
    terminals are digital and record the details of each transaction: data, customer
    id (through some loyalty program), goods bought and at what price, total money
    spent, and so forth. The stores are connected online, and the data from all the
    terminals in all the stores can be instantaneously collected in a central database.
    This amounts to a lot of (and very up-to-date) data every day.


    Especially in the last twenty years or so, people have increasingly started to
    ask themselves what they can do with all this data. With this question the whole
    direction of computing is reversed. Before, data was what the programs processed
    and spit out—data was passive. With machine learning, data starts to drive the
    operation; it is not the programmers anymore but the data itself that defines
    what to do next.


    One thing that a supermarket chain is always eager to know is which customer is
    likely to buy which product. With this knowledge, stores can be stocked more efficiently,
    which will increase sales and profit. It will also increase customer satisfaction
    because customers will be able to find the products that they need quicker and
    cheaper.


    This task is not evident. We do not know exactly which people are likely to buy
    this ice cream flavor or the next book of this author, to see this new movie,
    or to visit this city. Customer behavior changes in time and depends on geographic
    location.


    But there is hope, because we know that customer behavior is not completely random.
    People do not go to supermarkets and buy things at random. When they buy beer,
    they buy chips; they buy ice cream in summer and spices for Glühwein in winter.
    There are certain patterns in customer behavior, and that is where data comes
    into play.


    Though we do not know the customer behavior patterns themselves, we expect to
    see them occurring in the collected data. So if we can find such patterns in past
    data, assuming that the future, at least the near future, will not be much different
    from the past when that data was collected, we could expect them to continue to
    hold, and we can make correct predictions based on them.


    With machine learning, data starts to drive the operation; it is not the programmers
    anymore but the data itself that defines what to do next.


    We may not be able to identify the process completely, but we believe we can construct
    *a good and useful approximation*. That approximation may not explain everything
    but may still be able to account for some part of the data. We believe that though
    identifying the complete process may not be possible, we can still detect some
    patterns. We can use those patterns to predict; they may also help us understand
    the process.


    This is called *data mining*. The analogy is that a large volume of earth and
    raw material is extracted from the mine, which when processed leads to a small
    amount of very precious material. Similarly, in data mining, a large volume of
    data is processed to construct a simple model with valuable use, for example,
    one with high predictive accuracy.


    Data mining is one type of machine learning. We do not know the rules (of customer
    behavior), so we cannot write the program, but the machine—that is, the computer—“learns”
    by extracting such rules from (customer transaction) data.


    Many applications exist where we do not know the rules but have a lot of data.
    As we discussed before, the fact that computers and digital technology have penetrated
    so deep into our everyday lives implies that now there are large amounts of data
    in all sorts of domains ready for mining.


    Learning models are also used in pattern recognition, for example, in recognizing
    images captured by a camera or recognizing speech captured by a microphone. These
    days, we have different types of sensors used for different type of applications,
    from human activity recognition using a smartphone to driving assistance systems
    in cars.


    Another data source is science. As we build better sensors, we detect more—that
    is, we get more data—in astronomy, biology, physics, and so on, and we use learning
    algorithms to make sense of the bigger and bigger data. The Internet itself is
    one huge data repository, and we need smart algorithms to help us find what we
    are looking for. One important characteristic of data we have today is that it
    comes from different modalities—it is multimedia. We have text, we have images
    or video, we have sound clips, and so on, all somehow related to the same object
    or event we are interested in, and a major challenge in machine learning today
    is to combine information coming from these different sources. For example, in
    consumer data analysis, in addition to past transactions, we also have Web logs—namely,
    the Web pages that a user has visited recently—and these logs may be quite informative.


    With all types of smart machines continuously helping us in our daily lives, we
    have all become producers of data. Every time we buy a product, every time we
    rent a movie, visit a Web page, or post on the social media, even when we just
    walk or drive around, we are generating data. And that data is valuable for someone
    who is interested in collecting and analyzing it, because we are also consumers
    of data. We want to have products and services specialized for us. We want our
    needs to be understood and our interests to be predicted. The customer is not
    only always right, but also interesting and worth tracking.


    ## Learning versus Programming


    To solve a problem on a computer, we need an algorithm. An algorithm is a sequence
    of instructions that are carried out to transform the input to the output. For
    example, we have an algorithm for calculating payroll: The input is the work-related
    information of an employee, such as a timesheet, and personal information such
    as marital status, and the output is their salary.


    An algorithm is similar to a recipe for a dish. Preparing any dish requires basic
    actions such as peeling, slicing, frying, and so on. The recipe for a dish defines
    which of these actions should be carried out on which ingredient and in which
    order. Any person who can do these basic actions can prepare a dish just by following
    the recipe. This is what we have in computer programming, where the central processing
    unit (CPU) of the computer has a set of basic instructions and the algorithm defines
    which instructions should be carried out on which input and in which order. A
    software library is just like a cookbook.


    In the past decades we have devised algorithms for many tasks, and that is why
    computers and digital technology are so widely used now. But for some problems,
    we do not yet have an algorithm. Predicting customer behavior is one; another
    is differentiating spam emails from legitimate ones. We know what the input is:
    an email document that in the simplest case is a text message. We know what the
    output should be: a yes/no output indicating whether the message is spam or not.
    But we do not know how to transform the input to the output. What is considered
    spam changes over time and from individual to individual.


    What we lack in knowledge, we make up for in data. We can easily compile thousands
    of messages, some of which we know to be spam and some of which are not, and what
    we want is to “learn” what constitutes spam from this sample. For example, after
    analyzing example data, we may notice that words like “offer” and “opportunity”
    or symbols like “$” or “!” appear much more frequently in spam e-mails than they
    appear in ordinary e-mails, so our spam filter increases the probability that
    a given e-mail is spam if it sees any one of these in a new email.'
