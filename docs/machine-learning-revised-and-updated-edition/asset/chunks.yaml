- raw: 'There is always a trade-off in engineering. When the task is difficult to
    solve, we can devise more efficient solutions by constraining it. For example,
    the wheel is a very good solution for transportation, but it requires flat surfaces
    and so roads too have to be built. The controlled environment makes the task easier.
    Legs work in a variety of terrains, but they are more difficult to build and control,
    and they can carry a significantly less heavy load.


    *Optical character recognition* is recognizing printed or written characters from
    their images. This is more natural than barcodes because no extra coding (in terms
    of bars) is used. If a single font is used, there is a single way of writing each
    character; there are standardized fonts such as OCR-A, defined specifically to
    make automatic recognition easier.


    With barcodes or a single font, a single template exists for each class and there
    is no need for learning. For each character, we have a single prototype that we
    can simply store. It is the ideal image for that character, and we compare the
    seen input with all the prototypes one by one and choose the class with the best
    matching prototype—this is called *template matching*. There may be errors in
    printing or sensing, but we can do recognition by finding the closest match.


    If we have many fonts or handwritings, we have multiple ways of writing the same
    character, and we cannot possibly store all of them as possible templates. Instead,
    we want to “learn” the class by going over all the different examples of the same
    character and find some general description that covers all of them.


    It is interesting that though writing is a human invention, we do not have a formal
    description of ‘A’ that covers all ‘A’s and none of the non-‘A’s. Not having it,
    we take samples from different writers and fonts, and learn a definition of ‘A’-ness
    from these examples. But though we do not know what it is that makes an image
    an instance of the class ‘A’, we are certain that all those distinct ‘A’s have
    something in common, which is what we want to extract from the examples.


    We know that a character image is not just a collection of random dots and strokes
    of different orientations, but it has a regularity that we believe we can capture
    by using a learning program. For each character, we see examples in different
    fonts (for printed text) or writings (for handwritten text) and generalize; that
    is, we find a description that is shared by all of the examples of a character:
    ‘A’ is one way of combining a certain set of strokes, ‘B’ is another way, and
    so on.


    Recognition of printed characters is relatively easy with the Latin alphabet and
    its variants; it is trickier with alphabets where there are more characters, accents,
    and writing styles. In cursive handwriting, characters are connected and there
    is the additional problem of segmentation.


    Many different fonts exist, and people have different handwriting styles. Characters
    may also be small or large, slanted, printed in ink or written with a pencil,
    and as a result, many possible images can correspond to the same character. Despite
    all the research, there is still no computer program today that is as accurate
    as humans for this task. That is why captchas are still used, a *captcha* being
    a corrupted image of words or numbers that needs to be typed to prove that the
    user is a human and not a computer program.


    ## Matching Model Granularity


    In machine learning, the aim is to fit a model to the data. In the ideal case,
    we have one single, *global* model that applies to all of the instances. For all
    cars, as we saw in chapter 2, we have a single regression model that we can use
    to estimate the price. In such a case, the model is trained with the whole training
    data and all the instances have an effect on the model parameters. In statistics,
    this is called *parametric estimation*.


    The parametric model is good because it is simple—we store and calculate a single
    model—and it is trained with the whole data. Unfortunately, it may be restrictive
    in the sense that this assumption of a single model applicable to all cases may
    not hold in all applications. In certain tasks, we may have a set of *local* models,
    each of which is applicable to a certain type of instances. This is *semi-parametric
    estimation*. We still have a model that maps the input to the output but is valid
    only locally, and for different type of inputs we have different models.


    For example, in estimating the price of used cars, we may have one model for sedans,
    another model for sports cars, and another for luxury cars, if we have reason
    to believe that for these different types of cars, the depreciation behaviors
    are different. In such an approach, each local model is trained only with the
    training data that falls within its scope—the number of local models is the hyperparameter
    defining the model flexibility and hence complexity.


    In certain applications, even the semi-parametric assumption may not hold; that
    is, the data may lack a clear structure and it cannot be explained in terms of
    a few local models. In such a case, we use the other extreme of *nonparametric
    estimation* where we assume no simple model, either globally or locally. The only
    information we use is the most basic assumption—namely, that similar inputs have
    similar outputs. In such a case, we do not have an explicit training process that
    converts training data to model parameters; instead, we just keep the training
    data as the sample of past cases.


    Given an instance, we find the training instances that are most similar to the
    query and we calculate an output in terms of the known outputs of these past similar
    instances. For example, given a car whose price we want to estimate, we find among
    all the training instances the three cars that are most similar—in terms of the
    attributes we use—and then calculate the average of the prices of these three
    cars as our estimate. Because those are the cars that are most similar in their
    attributes, it makes sense that their prices should be similar too. This is called
    *k-nearest neighbor estimation* where here *k* is three. Since those are the three
    most similar past “cases,” this approach is sometimes called *case-based reasoning*.
    The nearest-neighbor algorithm is intuitive: similar instances mean similar things.
    We all love our neighbors because they are so much like us—or we hate them, as
    the case may be, for exactly the same reason.


    ## Generative Models


    An approach that has recently become very popular in data analysis is to consider
    a *generative model* that represents our belief as to how the data is generated.
    We assume that there is a hidden model with a number of *hidden*, or *latent*,
    *causes* that interact to generate the data we observe. Though the data we observe
    may seem big and complicated, it is produced through a process that is controlled
    by a few variables, which are the hidden factors, and if we can somehow infer
    these, the data can be represented and understood in a much simpler way. Such
    a simple model, if it is appropriately chosen and well trained, can also make
    accurate predictions.


    Consider optical character recognition. Generatively speaking, we can say that
    each character image is composed of two types of factors: there is the identity,
    namely the label of the character, and there is the appearance, those that are
    due to the process of writing or printing.'
  fmt: '

    工程中总是存在权衡。当任务难以解决时，我们可以通过对其施加约束来设计更高效的解决方案。例如，轮子是运输的一种非常好的解决方案，但它需要平坦的表面，因此也必须修建道路。受控环境使任务变得更容易。腿可以在各种地形上工作，但它们更难制造和控制，且能承载的重量显著减少。


    **光学字符识别**（*Optical character recognition*）是从图像中识别印刷或手写字符。这比条形码更自然，因为没有使用额外的编码（即条形码中的条）。如果使用单一字体，每个字符只有一种书写方式；存在标准化字体，如
    `OCR-A`，专门定义用于使自动识别更容易。


    使用条形码或单一字体时，每个类存在单个模板，因此无需学习。对于每个字符，我们都有一个单一的原型，可以直接存储。它是该字符的理想图像，我们将看到的输入与所有原型逐一比较，并选择具有最佳匹配原型的类——这称为**模板匹配**（*template
    matching*）。印刷或传感过程中可能存在错误，但我们可以通过寻找最近匹配来进行识别。


    如果我们有多种字体或手写体，同一个字符就有多种书写方式，我们不可能将所有这些都存储为可能的模板。相反，我们希望通过遍历同一字符的所有不同示例来“学习”该类，并找到涵盖所有示例的某种通用描述。


    有趣的是，虽然书写是人类的发明，但我们没有涵盖所有“A”且不包含任何非“A”的“A”的形式化描述。由于没有它，我们从不同的书写者和字体中获取样本，并从这些示例中学习“A”性的定义。但虽然我们不知道是什么使图像成为类“A”的实例，但我们确信所有那些不同的“A”有某种共同点，这就是我们想从示例中提取的内容。


    我们知道字符图像不仅仅是不同方向的随机点和笔画的集合，而是具有规律性，我们相信可以通过学习程序来捕捉。对于每个字符，我们在不同字体（印刷体）或书写（手写体）中看到示例并进行泛化；即找到一个字符所有示例共有的描述：“A”是组合特定笔画集的一种方式，“B”是另一种方式，依此类推。


    使用拉丁字母及其变体时，印刷字符的识别相对容易；对于字符更多、带有重音符号和书写风格的字母表则比较棘手。在草书手写体中，字符是连在一起的，还有分割的额外问题。


    存在许多不同的字体，人们有不同的手写风格。字符也可能大小不一、倾斜、用墨水印刷或用铅笔书写，因此许多可能的图像可能对应同一个字符。尽管进行了所有研究，但目前仍没有计算机程序能像人类那样准确地完成这项任务。这就是为什么仍在使用验证码（captcha），**验证码**（*captcha*）是单词或数字的损坏图像，需要输入以证明用户是人类而不是计算机程序。


    ## 匹配模型粒度


    在机器学习中，目标是将模型拟合到数据。在理想情况下，我们有一个单一的**全局模型**（*global model*），适用于所有实例。对于所有汽车，正如我们在第
    2 章所见，我们有一个单一的回归模型可用于估算价格。在这种情况下，模型使用全部训练数据进行训练，所有实例都会影响模型参数。在统计学中，这称为**参数估计**（*parametric
    estimation*）。


    参数模型的优点在于简单——我们存储和计算单个模型——并且使用全部数据进行训练。不幸的是，它可能具有限制性，因为单一模型适用于所有情况的假设并非在所有应用中都成立。在某些任务中，我们可能有一组**局部模型**（*local
    models*），每个模型仅适用于特定类型的实例。这是**半参数估计**（*semi-parametric estimation*）。我们仍然有一个将输入映射到输出的模型，但仅在局部有效，对于不同类型的输入，我们有不同的模型。


    例如，在估算二手车价格时，如果我们有理由相信这些不同类型汽车的折旧行为不同，我们可能有一个用于轿车的模型，另一个用于跑车，还有一个用于豪华车。在这种方法中，每个局部模型仅使用落入其范围内的训练数据进行训练——局部模型的数量是定义模型灵活性（因此也是复杂度）的超参数。


    在某些应用中，甚至半参数假设也不成立；即数据可能缺乏清晰的结构，无法用少数局部模型来解释。在这种情况下，我们使用另一个极端的**非参数估计**（*nonparametric
    estimation*），我们假设不存在简单的模型，无论是全局还是局部。我们使用的唯一信息是最基本的假设——即相似的输入具有相似的输出。在这种情况下，我们没有将训练数据转换为模型参数的显式训练过程；相反，我们只保留训练数据作为过去案例的样本。


    给定一个实例，我们找到与查询最相似的训练实例，并根据这些过去相似实例的已知输出计算输出。例如，给定一辆我们想估算价格的汽车，我们在所有训练实例中找到最相似的三辆车——基于我们使用的属性——然后计算这三辆车价格的平均值作为我们的估计。因为那些是在属性方面最相似的汽车，所以它们的价格也应该相似，这是合理的。这称为**K
    近邻估计**（*k-nearest neighbor estimation*），此处 `k` 为 3。由于那些是最相似的过去“案例”，这种方法有时称为**基于案例的推理**（*case-based
    reasoning*）。最近邻算法很直观：相似的实例意味着相似的事物。我们都爱我们的邻居，因为他们和我们太像了——或者我们因为完全相同的原因而讨厌他们。


    ## 生成模型


    一种最近在数据分析中变得非常流行的方法是考虑**生成模型**（*generative model*），它代表了我们关于数据如何生成的信念。我们假设存在一个具有若干**隐藏因果**（*hidden
    causes*），或**潜在因果**（*latent causes*）的隐藏模型，它们相互作用以生成我们观察到的数据。虽然我们观察到的数据可能看起来庞大而复杂，但它是通过一个由少数变量控制的过程产生的，这些变量就是隐藏因素，如果我们能以某种方式推断出这些因素，数据就可以用一种更简单的方式来表示和理解。如果适当选择并训练得当，这种简单的模型也能做出准确的预测。


    以光学字符识别为例。从生成的角度来看，我们可以认为每个字符图像由两类因素组成：一是身份，即字符的标签；二是外观，即由书写或印刷过程引起的因素。

    '
