- raw: 'Similarly, there are two types of errors (see table 2). If the system predicts
    cancer but in fact the patient does not have it, this is a *false positive*—the
    system chooses the positive class wrongly. This is bad because it will cause unnecessary
    treatment, which is both costly and inconvenient for the patient. If the system
    predicts no disease when in fact the patient has it, this is a *false negative*.
    A false negative has a higher cost than a false positive because then the patient
    will not get the necessary treatment. Because the cost of a false negative is
    so much larger than the cost of a false positive, we would choose the positive
    class—to start a closer investigation—even if the probability of the positive
    class is relatively small. This is not like predicting a coin toss where we choose
    the outcome—heads or tails—whose probability is higher than ½ (because the two
    possible wrong guesses are equally bad).


    Table 2 Different types of errors in decision making


    |  || Action ||  |


    | --- | --- | --- |


    | Truth || *Choose positive**(start treatment)* || *Choose negative**(discharge
    the patient)* || *Sum* |


    | *Positive**(the patient has cancer)* || TP:True positive || FN:False negative
    || P |


    | --- | --- | --- | --- |


    | *Negative**(the patient does not have cancer)* || FP:False positive || TN:True
    negative || N |


    | *Sum* || P′ || N′ ||  |


    This is the basis of *expected value* calculation where not only do we decide
    by using probabilities, but we also take into account the possible loss or gain
    we may face as a result of our decision. Though expected value calculation is
    frequently done in many domains, such as in insurance, it is known that people
    do not always act rationally; if that were the case, no one would buy a lottery
    ticket!


    In Max Frisch’s novel *Homo Faber*, the mother of a girl who was bitten by a snake
    is told not to worry because the mortality from snakebites is only 3–10 percent.
    The woman gets angry and says, “If I had a hundred daughters . . . then I should
    lose only three to ten daughters. Amazingly few! You’re quite right,” and then
    she continues, “I’ve only got one child.” We need to be careful in using expected
    value calculation when ethical matters are involved; later on for the case of
    self-driving cars, we will get back to ethical and also legal aspects of automated
    decision making.[4](#13811-0015.xhtml#en10)


    If both false positive and false negative have high costs, a possible third action
    is to *reject* and defer decision. For example, if computer-based diagnostics
    cannot choose between two outcomes, it can opt to reject, and the case can be
    decided manually; the human expert can make use of additional information not
    directly available to the system. In an automated mail sorter, if the system cannot
    recognize the numeric zip code on an envelope, the postal worker can also read
    the address.


    In classification, when false positives and false negatives are equally bad, their
    sum, FP + FN, gives us the number of misclassifications. For example, let us say
    we have a visual recognition system that separates cars from tanks, and let us
    assume cars make up the positive class. Then FP is the number of tanks classified
    as cars and FN is the number of cars classified as tanks. Their sum divided by
    the total number of images, (FP + FN)/(P + N), is the *classification error*,
    or equivalently, (TP + TN)/(P + N), is the *classification accuracy*.


    In other applications, the performance criterion can be different. Let us envisage
    an application where people are allowed to access their bank accounts by their
    voice. A false positive is an allowed impostor and a false negative is a valid
    user that is denied service. The former is much worse than the second. The *hit
    rate*, or the *true-positive rate*, measures what proportion of valid users is
    correctly authenticated, TP/P, and *false alarm rate*, or *false-positive rate*,
    measures what proportion of impostors are wrongly authenticated, FP/N.


    There is a trade-off between the two. If we modify our classifier so that it chooses
    the positive class more easily, this increases the hit rate, but also risks increasing
    the false alarm rate. In deciding when to choose which class, we want to make
    the hit rate as large as possible while keeping the false alarm rate as small
    as possible.


    In *information retrieval*, we have a query—for example, defined using keywords—and
    we want to retrieve records that match the query from a database. For example,
    let us say we want to retrieve images of tigers using the keyword “tiger” from
    a database of images. In such a case, an image that is retrieved corresponds to
    assignment to the positive class and an image that is not retrieved corresponds
    to assignment to the negative class. In this case, TP corresponds to the number
    of tiger images that are retrieved, and FN to the number of tiger images that
    exist in the database but are not retrieved. FP is the number of images that are
    retrieved but are not tiger images.


    In this scenario, we have two performance criteria. *Precision* is the ratio of
    true positives to all the retrieved instances, namely, TP/P’ = TP/(TP + FP), that
    is, what percentage of the retrieved instances are really relevant, that is, match
    the query. *Recall* is the ratio of true positives to all the positive instances,
    namely, TP/P, that is, what percentage of the relevant instances are actually
    retrieved.


    We want both *precision and recall* to be as close to 1 as possible: If precision
    is 1, all the retrieved records may be relevant but there may still be relevant
    records that are not retrieved. If recall is 1, all the relevant records are retrieved
    but there may also be other retrieved irrelevant records (see figure 4). Again,
    we see the trade-off between precision and recall. We can always increase recall
    by retrieving more images but that risks decreasing precision.


    ![](images/13811_004_fig_000.jpg)


    We see that unlike in classification, we do not care about the true negatives
    here; those are non-tiger images that are correctly not retrieved; in retrieval
    we do not care about those, their number can increase or decrease depending on
    the size and scope of the database without affecting our performance assessment.


    In other domains—for example, in medicine—people use the measures of *sensitivity*
    and *specificity*. *Sensitivity* is the same as recall, which measures how well
    we detect the positives. *Specificity* is how well we detect the negatives, which
    is TN/N—it is equal to 1 – false alarm rate. For example, let us say we have developed
    a test for a virus: Sensitivity is how well the test catches the people who have
    the virus and specificity is how well it is silent on people who do not have the
    virus.


    In this chapter, we have discussed the basics of machine learning in general;
    in the next chapter, we will cover one type of learning, supervised learning,
    that finds use, for example, in recognizing patterns such as faces and speech.


    # 3


    # Pattern Recognition


    ## Learning to Read


    Different automatic visual recognition tasks have different complexities. One
    of the simplest is the reading of *barcodes* where information is represented
    in terms of lines of different widths, which are shapes that are easy to recognize.
    The barcode is a simple and efficient technology: It is easy to print barcodes,
    and it is also easy to build scanners to read them; that is why they are still
    widely used. But the barcode is not a natural representation, and the information
    capacity is limited; recently two-dimensional matrix barcodes have been proposed
    where more information can be coded in a smaller area; for example, QR codes that
    can be scanned by a smartphone point to a website.'
