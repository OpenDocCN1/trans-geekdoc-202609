    # 决策树


    从根节点到叶节点的每条路径都对应于该路径上决策节点中测试条件的合取，这样的路径可以写成一条 if-then 规则。这是决策树的优势之一：树可以转换为 if-then
    规则库，且这些规则易于解释。树是通过给定的训练数据训练而成的，其中分裂点被放置以划分具有最高“纯度”的区域，即每个区域包含的实例在输出方面是相似的。


    决策树学习是非参数化的——我们没有一个预先假定结构的模型，仅更新该固定结构的参数；决策树按需生长，其大小取决于数据潜在问题的复杂性；对于简单任务，树较小，而困难任务则生长出较大的树。


    根据决策节点中使用的分裂测试和叶节点处的插值方法，存在不同的决策树模型和学习算法；目前一种非常流行的方法是 `random forest`（随机森林），我们在从训练数据中随机选择的不同子集上训练许多决策树，并通过投票组合它们的预测。


    树在各种机器学习应用中都取得了成功，与线性模型一样，决策树应被视为基准方法之一，在尝试任何更复杂的学习算法之前应先尝试。


    ## 主动学习


    在学习中，学习者了解自己知道什么和不知道什么至关重要。当训练好的模型做出预测时，如果它还能指示对该预测的确定性，将会很有帮助。


    一种简单的方法是 `resampling`（重采样）。


    假设我们想预测二手车的价格，并且拥有 100 个样本的数据集。让我们从中随机选择 80 个样本，使用它们训练第一个模型。然后我们可以从原始数据集中再选择另一个随机的
    80 个样本子集来训练第二个模型。这两个数据集将相似但不完全相同，因此拟合出的两个模型在预测上会相似但不完全相同。


    我们可以这样做十次，得到十个模型。稍后，当给定一辆新车时，我们可以将其里程作为输入提供给所有十个模型，获得十个预测。它们会略有不同，因为每个模型都是在略有不同的数据集上训练的。然后我们可以用这十个值的平均值作为点估计；我们也可以将这十个估计值从小到大排序，并定义一个区间，即所谓的
    `confidence interval`（置信区间），从最小值到最大值（在实践中，最好丢弃两端的两个极端值，使用从第二个到第九个的区间）。该区间的大小是我们预测不确定性的度量；如果它很大，我们就知道我们的预测深受数据微小变化的影响，因此不太可靠。


    这里的重要一点是数据点并非生而平等，我们的数据可能并非在整个输入空间中都是均匀的。例如，训练集中里程少于 100K 的车可能很多，但里程更多的车可能不多。


    在估计的情况下，在我们拥有大量数据的输入空间区域，将会有许多训练样本，这意味着所有十个集合都将包含来自该区域的实例，这反过来意味着我们期望这十个模型在那里做出相似的预测，因此该区域内任何输入的置信区间将很小。在输入空间数据稀少的地方，十个模型的训练数据中可能都没有来自该区域的样本，因此这十个模型的预测可能会有较大差异，我们将得到一个较大的置信区间。


    因此，置信区间大的地方，不确定性被认为很大，模型可以主动请求监督者提供该区域的训练样本。这称为 `active learning`（主动学习）。模型通过合成新输入来生成询问并请求提供标签，这很像学生在讲座中提问。


    例如，在人工智能发展的早期，人们就意识到在分类中，最有信息量的样本是那些最接近当前类别边界估计的样本：`near miss`（近似反例）是一个看起来非常像正例但实际上是反例的实例（Winston
    1975）。


    机器学习中一个相关的研究领域称为 `computational learning theory`（计算学习理论），该领域致力于寻找普遍成立的、独立于特定学习任务的学习算法理论界限。例如，对于给定的模型和学习算法，我们可能想知道保证以足够高的概率实现至多一定误差所需的最小训练实例数量——这称为
    `probably approximately correct learning`（概率近似正确学习，Valiant 1984）。


    ## 学习排序


    `Ranking`（排序/学习排序）是机器学习的一个应用领域，不同于回归或分类，它介于两者之间。在分类和回归中，对于每个实例，我们都有一个期望的输出绝对值；而在排序中，我们基于实例对进行训练，要求两个实例的输出顺序正确。


    假设我们想为电影学习一个 `recommendation model`（推荐模型）。对于该任务，输入由电影的属性组成。输出是一个数值分数，衡量我们认为特定客户会多大程度喜欢特定电影。为了训练这样的模型，我们使用该客户过去的评分。如果我们知道客户过去更喜欢电影
    `A` 而非电影 `B`，我们会进行训练，使得对于该客户，`A` 的估计分数确实高于 `B` 的估计分数。然后，当我们使用该模型根据最高分数进行推荐时，我们期望选择一部比
    `B` 更类似于 `A` 的电影。


    不像二手车价格那样有要求的数值，分数可以在任何范围内，只要顺序正确即可。训练数据不是以绝对值形式给出的，而是以这种排序约束的形式给出的（Liu 2011）。


    我们可以在此指出排序器相对于分类器或回归器的优势和区别。如果用户将看过的电影评为喜欢与不喜欢，这将是一个二分类问题，可以使用分类器，但品味是细微的，二元评分难以获得。另一方面，如果人们在
    1 到 10 的范围内为每部电影的喜爱程度打分，这将是一个回归问题，但这种数值很难分配。人们更自然、更容易说出在看过的两部电影中，他们更喜欢哪一部。在用所有这些对训练好排序器后，期望它生成满足所有这些约束的数值分数。


    排序有许多应用。在搜索引擎中，给定查询时我们希望检索最相关的文档。当我们检索并显示当前前十个候选文档时，如果用户跳过前两个点击了第三个，我们就知道第三个本应比第一和第二个排名更高。这种
    `click logs`（点击日志）被用来训练排序器。


