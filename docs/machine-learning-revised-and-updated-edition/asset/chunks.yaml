- raw: 'In preparing the data, we look at our past records, and we label the customers
    who paid back their loans as low-risk and those who defaulted as high-risk. Analyzing
    this data, we would like to learn the class of high-risk customers so that in
    the future, when there is a new application for a loan, we can check whether or
    not the customer matches that description and reject or accept the application
    accordingly.


    The information about a customer makes up the input to the classifier whose task
    is to assign the input to one of the two classes. Using our knowledge of the application,
    let us say that we decide to take a customer’s income and savings as input (see
    figure 3). We observe them because we have reason to believe that they give us
    sufficient information about the credibility of a customer.


    One possible model defines the discriminant in the form of if-then rules:


    IF income < *X* AND savings < *Y* THEN high-risk ELSE low-risk


    where *X* and *Y* are the parameters fine-tuned to the data, to best match the
    rule prediction with what the data tells us (see figure 3).


    In this model the parameters are these thresholds, not weights as we have in the
    linear model. In regression, the task is to find a line that passes as close as
    possible to the data points; in classification, it is to fit a separating boundary
    between the data points from different classes.


    Each if-then rule specifies one composite condition made up of terms, each of
    which is a simple condition on one of the input attributes. The antecedent of
    the rule is an expression containing terms connected with AND, namely, a conjunction;
    that is, all the conditions should hold for the rule to apply.


    ![](images/13811_003_fig_000.jpg)


    We understand from the rule that among the subset of customers that satisfies
    the antecedent—namely, those whose income is less than X *and* whose savings is
    less than Y—there are more high-risk than low-risk customers, so the probability
    of high risk for them is higher; that is why the consequent of the rule has high-risk
    as its label.


    In this simple example, there is a single way of being high-risk and all the remaining
    cases are low-risk, so one rule is sufficient. In another application, there may
    be a *rule base* that is composed of several if-then rules, each of which delimits
    a certain region, and each class is specified using a disjunction of such rules.
    There are different ways of being high-risk, each of which is specified by one
    rule and satisfaction of any of the rules is enough.


    Learning such rules from data allows *knowledge extraction*. The rule is a simple
    model that explains the data and looking at this model we have an explanation
    about the process underlying the data. For example, once we learn the discriminant
    separating the low-risk and high-risk customers, we have knowledge about the properties
    of low-risk customers. We can then use this information to target potential low-risk
    customers more efficiently, such as through customized advertising.


    ## Expert Systems


    Before machine learning was the norm, expert systems existed. Proposed in 1970s
    and used in 1980s,[3](#13811-0015.xhtml#en9) they were computer programs that
    aided humans in decision making.


    An *expert system* is composed of a *knowledge base* and an *inference engine*.
    The knowledge is represented as a set of if-then rules, like the ones we discussed
    earlier, and the inference engine uses logical inference rules for deduction.
    The rules are programmed after consultation with domain experts, and they are
    fixed. This process of converting domain knowledge to if-then rules was manual,
    and hence difficult and costly. The inference engine was programmed in specialized
    programming languages such as Lisp and Prolog, which are especially suited for
    logical inference.


    For a time in the 1980s, expert systems were quite popular around the world, not
    only in the United States (where Lisp was used), but also in Europe (where Prolog
    was used). Japan had a Fifth Generation Computer Systems Project for massively
    parallel architectures for expert systems and artificial intelligence (AI). There
    were applications, but in rather limited domains, such as MYCIN for diagnosing
    infectious diseases (Buchanan and Shortliffe 1984); commercial systems also existed.


    Despite the research and the wide interest, expert systems never took off. There
    are basically two reasons for this. First, the knowledge base needed to be created
    manually through a very laborious process; there was no learning from data. The
    second reason was the unsuitability of logic to represent the real world. In real
    life, things are not true or false, but have grades of truth: a person is not
    either old or not old, but oldness increases gradually with age. The logical rules
    too may apply with different degrees of certainty: “If *X* is a bird, *X* can
    fly” is mostly true but not always.


    To represent degrees of truth, *fuzzy logic* was proposed with fuzzy memberships,
    fuzzy rules, and inference, and since its inception, had some success in a variety
    of applications (Zadeh 1965). Another way to represent uncertainty is to use probability
    theory, as we do in this book.


    Machine learning systems that we discuss in this book are extensions of expert
    systems in decision making in two ways: first, they need not be programmed but
    can learn from examples, and second, because they use probability theory, they
    are better in representing real-world settings with all the concomitant noise,
    exceptions, ambiguities, and resulting uncertainty.


    ## Expected Values


    When we make a decision—for example, when we choose one of the classes—we may
    be correct or wrong. It may be the case that correct decisions are not equally
    good and wrong decisions are not equally bad. When making a decision about a loan
    applicant, a financial institution should take into account both the potential
    gain as well as the potential loss. An accepted low-risk applicant increases profit,
    while a rejected high-risk applicant decreases loss. A high-risk applicant who
    is erroneously accepted causes loss, and an erroneously rejected low-risk applicant
    is a missed chance for profit.


    The situation is much more critical and far from symmetrical in other domains,
    such as *medical diagnosis*. Here, the inputs are the relevant information we
    have about the patient and the classes are the illnesses. The inputs contain the
    patient’s age, gender, past medical history and current symptoms. Some tests may
    not have been applied to the patient, and these inputs would be missing. Tests
    take time, are costly, and may inconvenience the patient, so we do not want to
    apply them unless we believe they will give us valuable information.


    In the case of medical diagnosis, a wrong decision may lead to wrong or no treatment,
    and the different types of error are not equally bad. Let us say we have a system
    that collects information about a patient and based on those, we want to decide
    whether the patient has a certain disease (say a certain type of cancer) or not.
    There are two possibilities: either the patient has cancer—let us call it the
    positive class—or not—the negative class.'
