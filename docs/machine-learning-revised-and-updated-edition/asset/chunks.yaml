- raw: 'However, when there is a lot of data and the process involves a lot of computation,
    efficient implementation of machine learning solutions is an important matter.[2](#13811-0015.xhtml#en19)
    Another integral part is the ethical and legal implications of data analysis and
    processing, as we discussed in chapter 7. As we collect and analyze more and more
    data, our decisions in various domains will become more and more automated and
    data-driven, and we need to be concerned about the implications of such autonomous
    processes and the decisions they make.


    It seems as if we will need many “data scientists” and “data engineers” in the
    future, because we see today that the importance of data and extracting information
    from data has been noticed in many domains. Such scenarios have characteristics
    that are drastically different than those of traditional statistics applications.


    First, the data now is much bigger—consider all the transactions done at a supermarket
    chain. For each instance, we have thousands of attributes—consider a gene sequence.
    The data is not just numbers anymore; it consists of text, image, audio, video,
    ranks, frequencies, gene sequences, sensor arrays, click logs, lists of recommendations,
    and so on. Most of the time data does not obey the parametric assumptions, such
    as the bell-shaped Gaussian curve, that we frequently use to make estimation easier.
    Instead, with the new data, we need to resort to more flexible nonparametric models
    whose complexity can adjust automatically to the complexity of the task underlying
    the data. All these requirements make machine learning more challenging than statistics
    as we used to know and practice it.


    In education, this implies that we need to extend the courses on statistics to
    cover these additional needs, and teach more than the well-known but now insufficient,
    mostly univariate (having a single input attribute) parametric methods for estimation,
    hypothesis testing, and regression. It has also become necessary to teach the
    basics of high-performance computing, both the hardware and the software aspects,
    because in real-world applications how efficiently the data is stored and manipulated
    may be as critical as the prediction accuracy. A student of data science today
    also needs to know the social, ethical, and legal aspects of all stages of machine
    learning, including the collection of data, its storage and processing, and automated
    decision making based on that data.


    ## Machine Learning, Artificial Intelligence, and the Future


    Machine learning is one way to achieve artificial intelligence. By training on
    a data set, or by repeated trials using reinforcement learning, we can have a
    computer program behaving so as to maximize a performance criterion, which in
    a certain context appears intelligent.


    One important point is that intelligence is a vague term and its applicability
    to assess the performance of computer systems may be misleading. For example,
    evaluating computers on tasks that are difficult for humans, such as playing chess,
    is not a good idea for assessing intelligence. Chess is a difficult task for humans
    because it requires deliberation and planning, whereas humans, just like other
    animals, have evolved to make very quick decisions using limited sensory data
    with limited computation. For a computer, it is much more difficult to recognize
    the face of its opponent than to play chess. Whether a computer can play chess
    better than the best human player is not a good indicator that computers are more
    intelligent, because human intelligence has not evolved for tasks like chess.


    Researchers use game playing as a testing area in artificial intelligence because
    games are relatively easy to define with their formal rules and clearly specified
    criteria for winning and losing. There are a certain number of pieces or cards,
    and even if there is randomness its form is well defined: the dice should be fair
    and draws from the deck should be uniform. Attempts to the contrary are considered
    cheating behavior. In real life, all sorts of randomness occur, and for its survival
    every species is slowly evolving to be a better cheater than the rest.


    The power that artificial intelligence promises is a concern for many researchers,
    and not surprisingly there is a call for regulation. In a recent interview (Bohannon
    2015), Stuart Russell, a prominent researcher and coauthor of the leading textbook
    on artificial intelligence (Russell and Norvig 2020), says that unlimited intelligence
    may be as dangerous as unlimited energy and that uncontrolled artificial intelligence
    may be as dangerous as nuclear weapons. The challenge is to make sure that this
    new source of intelligence is used for good and not for bad, to increase the well-being
    of people and for the benefit of humanity, rather than to increase the profit
    of a few.


    Some people jump to conclusions and fear that research on artificial intelligence
    may one day lead to metallic monsters that will rise to dominate us—electronic
    versions of the creation of Dr. Frankenstein. I doubt whether that will ever happen.
    But even today we have automatic systems that make decisions for us—some of which
    may be trained from data—in various applications from cars to trading. I believe
    we have more reason to fear the poorly programmed or poorly trained software than
    we do to dread the possibility of the dawn of super-intelligent machines.


    ## Closing Remarks


    We have big data, but tomorrow’s data will be bigger. Our sensors are getting
    cheaper and hence being used more widely and more precisely. Computers are getting
    bigger too, in terms of their computing power. We still seem to be far from the
    limits imposed by physics as researchers find new technologies and materials,
    such as the graphene, that promise to deliver more. New products can be designed
    and produced much faster using 3D printing technology and more of these products
    will need to be smart.


    With more data and computation, our trained models can get more and more intelligent.
    Current deep networks can learn enough abstraction in some limited context to
    recognize handwritten digits or a subset of objects, but they are far from having
    the capability of our visual cortex to recognize a scene—one deep network does
    not a brain make. They can learn some linguistic abstraction from large bodies
    of text, but we are far from any real understanding of it—enough, for example,
    to answer questions about a short story. How our learning algorithms will scale
    up is an open question. That is, can we train a model that is as good as the visual
    cortex by adding more and more layers to a deep network and training it with more
    and more data? Can we get a model to translate from one language to another by
    having a very large model trained with a lot of data? The answer should be yes,
    because our brains are such models. But this scaling up may be increasingly difficult.
    Even though we are born with the specialized hardware, it still takes years of
    observing our environment before we utter our first sentence.


    In vision, as we go from barcode to optical character readers to face recognizers,
    we define a sequence of increasingly complex tasks, each of which solves a need
    and each of which is a marketable product in its own time. More than scientific
    curiosity, it is this process of capitalization that fuels research and development.
    As our learning systems get more intelligent, they will find use in increasingly
    smarter products and services.'
  fmt: '

    ## 机器学习、人工智能与未来


    机器学习是实现人工智能的一种途径。通过在数据集上训练，或利用强化学习进行反复试验，我们可以让计算机程序表现出最大化性能准则的行为，这在特定情境下显得很有智能。


    一个重要的观点是，智能是一个模糊的术语，用它来评估计算机系统的性能可能会产生误导。例如，让计算机去完成人类觉得困难的任务（如下棋）并不是评估智能的好主意。下棋对人类之所以困难，是因为它需要深思熟虑和规划；而人类和其他动物一样，进化出的能力是利用有限的感官数据和有限的计算量做出快速决策。对于计算机来说，识别对手的脸比下棋难得多。计算机能否下棋赢过最优秀的人类棋手，并不能很好地说明计算机更聪明，因为人类的智能并非为下棋这类任务而进化的。


    研究人员将博弈作为人工智能的测试领域，是因为游戏有明确的规则和清晰的胜负标准，定义起来相对容易。棋子或牌的数量是固定的，即使存在随机性，其形式也定义明确：骰子必须均匀，抽牌必须随机。违背这些规则的行为被视为作弊。而在现实生活中，各种随机性都会发生，为了生存，每个物种都在缓慢进化，试图比其他物种更擅长“作弊”。


    人工智能所承诺的力量让许多研究者感到担忧，因此呼吁监管也就不足为奇了。在一次近期的采访中（Bohannon 2015），著名研究者、《人工智能：一种现代的方法》（Russell
    and Norvig 2020）的合著者 Stuart Russell 指出，无限制的智能可能像无限制的能源一样危险，失控的人工智能可能像核武器一样危险。挑战在于如何确保这一新的智能源用于造福人类、增进福祉，而不是仅增加少数人的利润。


    有人跳到结论，担心人工智能研究终将导致金属怪物崛起统治我们——即弗兰肯斯坦博士创造物的电子版。我怀疑这永远不会发生。但即使在今天，我们也拥有为我们做决策的自动系统——其中一些可能是从数据中训练得到的——应用于从汽车到交易等各个领域。我认为，我们更有理由担心编写糟糕或训练不当的软件，而不是恐惧超级智能机器诞生的可能性。


    ## 结束语


    我们拥有大数据，但明天的数据将更大。传感器变得更便宜，因此应用得更广泛、更精准。计算机也变得更强大，就计算能力而言。研究人员发现新技术和新材料（如石墨烯），有望带来更多突破，我们似乎仍远未达到物理学施加的极限。利用
    3D 打印技术，新产品的设计和生产速度大大加快，且更多产品将需要具备智能。


    随着数据和计算量的增加，我们训练的模型可以变得越来越智能。当前的深度网络能在某些有限情境下学习足够的抽象来识别手写数字或一部分物体，但它们距离拥有像视觉皮层那样识别场景的能力还很远——一个深度网络不等于一个大脑。它们能从大量文本中学习一些语言抽象，但我们距离真正理解语言还很远——例如，足以回答关于短篇故事的问题。我们的学习算法如何扩展是一个开放性问题。也就是说，通过不断增加深度网络的层数并用更多数据训练，我们能否训练出一个像视觉皮层一样好的模型？通过拥有一个用大量数据训练的超大模型，我们能否让模型在不同语言之间翻译？答案应该是肯定的，因为我们的大脑就是这种模型。但这种扩展可能变得越来越困难。即使我们天生拥有专用硬件，仍需经过多年的环境观察才能说出第一句话。


    在视觉领域，从条形码阅读器到光学字符识别再到人脸识别器，我们定义了一系列日益复杂的任务，每个任务都解决一个需求，每个任务在其时代都是可商业化的产品。比起科学好奇心，正是这种资本化过程推动了研发。随着学习系统变得更智能，它们将应用于越来越智能的产品和服务中。

    '
