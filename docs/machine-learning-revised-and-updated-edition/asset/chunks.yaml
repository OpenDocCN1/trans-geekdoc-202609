- raw: 'These two applications have a number of points in common. There is a decision
    maker, called the *agent*, which is placed in an *environment* (see figure 17).
    In the first case, the chessboard is the environment of the game-playing agent;
    in the second case, the maze is the environment of the robot. At any time, the
    environment is in a certain *state*, which means the position of the pieces on
    the board or the position of the robot in the maze, respectively. The decision
    maker has a set of *actions* possible: the legal movement of pieces on the chessboard
    or the movement of the robot in various directions without hitting any obstacle.
    Once an action is chosen and taken, the state changes.


    ![](images/13811_017_fig_000.jpg)


    The solution to the task requires a sequence of actions, and we get feedback in
    the form of a *reward*. What makes learning challenging is that the reward comes
    rarely and generally only after the complete sequence has been carried out—we
    win or lose the game after a long sequence of moves. The reward defines the aim
    of the task and is necessary if we want learning. The agent learns the best sequence
    of actions to solve the task where “best” is quantified as the sequence of actions
    that returns the maximum reward as early as possible. This is the setting of *reinforcement
    learning* (Sutton and Barto 2018).


    Reinforcement learning is different in a number of respects from the learning
    methods we’ve already discussed. It is called “learning with a critic,” as opposed
    to the learning with a teacher that we have in supervised learning. A critic differs
    from a teacher in that a critic does not tell us what to do, but only how well
    we have been doing in the past. The critic never informs in advance! The feedback
    is scarce and when it comes, it comes late. This leads to the *credit assignment*
    problem. After taking several actions and getting the reward, we would like to
    assess the individual actions we did in the past and find the moves that led us
    to win the reward so that we can record and recall them later on.


    Actually, what a reinforcement learning program does is generate an *internal
    value* for the intermediate states or actions in terms of how good they are at
    leading us to the goal and getting us the real reward. Once such an internal reward
    mechanism is learned, the agent can just take the local actions to maximize it.
    The solution to the task requires a *sequence* of actions chosen in this way that
    cumulatively gets the highest real reward.


    Unlike the applications we discussed previously, here there is no external process
    that provides the training data. It is the agent that actively generates data
    by trying out actions in the environment and receiving feedback (or not) in the
    form of a reward. It then uses this feedback to update its knowledge so that in
    time it learns to do actions that return the highest reward.


    ## *K*\-Armed Bandit


    We start with a simple example. The *K-armed bandit* is a hypothetical slot machine
    with *K* levers. The action is to choose and pull one of the levers; each lever
    returns a certain amount of money, which can be zero, which is the reward associated
    with the lever (action). The task is to decide which lever to pull to maximize
    the reward.


    A reinforcement learning program learns to generate an *internal value* for the
    intermediate states or actions in terms of how good they are at leading us to
    the goal and getting us the real reward.


    This is a classification problem where we choose one of *K*. If this were supervised
    learning, the teacher would tell us the correct class, namely, the lever leading
    to maximum earning. In this case of reinforcement learning, we can only try the
    different levers and keep track of the best.


    Initially estimated values for all levers are zero. To explore the environment,
    we can choose one of the levers at random and observe its reward. If that reward
    is higher than zero, we can just store it as our internal reward estimate of that
    action. Then, when we need to choose a lever again, we can keep on pulling that
    lever and receiving positive rewards. But it may be the case that another lever
    leads to a higher reward, so even after finding a lever with a positive reward
    we want to try out the other levers; we need to make sure that we have done a
    thorough enough exploration of the alternatives before we become set in our ways.
    Once we try out all the levers and know everything there is to know, we can then
    choose the action with the maximum value.


    The setting here assumes that rewards are deterministic, that we always receive
    the same reward for a lever. In a real slot machine, the reward is a matter of
    chance, and the same lever may lead to different reward values in different trials.
    In such a case, we want to maximize our *expected reward*, and our internal reward
    estimate for the action is the average of all rewards in the same situation. This
    implies that doing an action once is not enough to learn how good it is; we need
    to do many trials and collect many observations (rewards) to calculate a good
    estimate of the average.


    The *K*\-armed bandit is a simplified reinforcement learning problem because there
    is only one state—one slot machine. In the general case, when the agent chooses
    an action, not only does it receive a reward or not, but its state also changes.
    This next state of the agent may also be probabilistic because of the hidden factors
    in the environment, and this may lead to different rewards and next states for
    the same action.


    For example, there is randomness in games of chance that also affect the action
    and thus the next state: in some games there are dice, or we draw randomly from
    a deck in card games. In a game like chess, there are no dice or decks of cards,
    but there is an opponent whose behavior is unpredictable—another source of uncertainty.
    In a robotic environment, the obstacles may move or there may be other mobile
    agents that can occlude perception or limit movement. Sensors may be noisy and
    motors that control the actuators may be far from perfect: A robot may want to
    go ahead, but because of wear and tear may swerve to the right or left. All these
    are hidden factors that introduce uncertainty, and as usual, we estimate expected
    values to average out the effect of uncertainty.


    Another reason the *K*\-armed bandit is simplified is because we get a reward
    after a single action; the reward is not delayed and we immediately see the value
    of our action. In a game of chess or with a robot whose task is to find the goal
    location in a room, the reward arrives only at the very end, after many actions
    during which we receive no reward or any other feedback.


    In reinforcement learning, what we want is to be able to predict how good any
    intermediate action is in taking us to the real reward—this is our *internal reward
    estimate* for the action. Initially, this reward estimate for all actions is zero
    because we do not yet know anything. We need data to learn, so we need to do some
    *exploration* where we try out certain actions and observe whether we get any
    reward; we then update our internal estimates using this information.


    As we explore more, we collect more data, and we learn more about the environment
    and how good our actions are. When we believe we have reached a level where our
    reward estimates of actions are good enough, we can start *exploitation*. We do
    this by taking the actions that generate the highest reward according to our internal
    reward estimates. In the beginning when we do not know much, we try out actions
    at random; as we learn more, we gradually move from exploration to exploitation
    by moving from random choices to those influenced by our internal reward estimates.


    ## Temporal Difference Learning'
