    在其他领域（如医学）中，人们使用*灵敏度*和*特异性*指标。*灵敏度*等同于召回率，衡量我们检测阳性的能力。*特异性*衡量我们检测阴性的能力，即 `TN/N`，等于
    `1 – 虚警率`。例如，我们开发了一种病毒检测试剂：灵敏度反映其捕捉感染者的能力，特异性反映其对未感染者保持“静默”（不报警）的能力。


    本章讨论了机器学习的一般基础；下一章将介绍一种学习类型——监督学习，它用于人脸、语音等模式识别。


    # 第 3 章 模式识别


    ## 学会阅读


    不同的自动视觉识别任务复杂度各异。最简单的是*条形码*读取，信息以不同宽度的线条表示，这些形状易于识别。条形码是简单高效的技术：易于打印，也易于制造扫描仪读取；因此仍广泛使用。但条形码非自然表示，信息容量有限；近来提出二维矩阵条形码，可在更小区域编码更多信息；例如可用智能手机扫描指向网站的
    QR 码。

