    Until now, we have talked about supervised learning where there is an input and
    an output, and the aim is to learn the mapping from the input to the output. In
    the next chapter, we will discuss unsupervised learning where there is no explicit
    output, and the aim is to learn the regularity in the input space, to learn what
    type of things happen frequently.


    # 5


    # Learning Clusters and Recommendations


    ## Finding Groups in Data


    Previously we covered supervised learning where there is an input and an output—for
    example, car attributes and price—and the aim is to learn a mapping from the input
    to the output. A supervisor provides the correct values, and the parameters of
    a model are updated so that its output gets as close as possible to these desired
    outputs.


    We are now going to discuss `unsupervised learning`, where there is no predefined
    output, and hence no such supervisor; we have only the input data. The aim in
    unsupervised learning is to find the regularities in the input, to see what normally
    happens. There is a structure to the input space such that certain patterns occur
    more often than others, and we want to see what generally happens and what does
    not.


    One method for unsupervised learning is `clustering`, where the aim is to find
    clusters or groupings of input; in statistics, these are called `mixture models`.


    In the case of a company, the customer data contains demographic information,
    such as age, gender, zip code, and so on, as well as past transactions with the
    company. The company may want to see the distribution of the profile of its customers,
    to see what type of customers frequently occur. In such a case, a clustering model
    allocates customers similar in their attributes to the same group, providing the
    company with natural groupings of its customers; this is called `customer segmentation`
    (see figure 14). Once such groups are found, the company may decide strategies,
    for example, services and products, specific to different groups; this is known
    as `customer relationship management` (CRM).


    Such a grouping also allows the company to identify those who are outliers, namely,
    those who are different from other customers, which may imply a niche in the market
    that can be further exploited by the company, or those customers who require further
    investigation, for example, churning customers.

