- raw: 'For example, in image recognition, we have image pixels as the basic input
    and as input to the first layer. The neurons in the next layer combine these to
    detect basic image descriptors such as strokes and edges of different orientations.
    A later layer combines these to form longer lines, arcs, and corners. Layers that
    follow combine them to learn more complex shapes such as circles, squares, and
    so on. These in turn are combined with some more layers of processing to represent
    the objects we want to learn, such as faces or handwritten characters.


    Each neuron in a layer defines a more complex feature in terms of the simpler
    patterns detected in the layer below it. These intermediate feature-detecting
    units are called *hidden units* because they correspond to hidden attributes not
    directly observed but are defined in terms of what is observed. These successive
    layers of hidden units correspond to increasing layers of abstraction, where we
    start from raw data such as pixels and end up in abstract concepts such as a digit
    or a face.


    It is interesting to note that a similar mechanism seems to be operating in the
    visual cortex. In their experiments on cats, Hubel and Wiesel, who were later
    awarded the 1981 Nobel Prize for their work on visual neurophysiology, have shown
    that there are *simple cells* that respond to lines of particular orientations
    in particular positions in the visual field, and these in turn feed to *complex*
    and *hypercomplex cells* for detecting more complicated shapes (Hubel 1995)—though
    not much is known about what happens in later layers.


    Imposing such a structure on the network implies making assumptions, such as dependencies,
    about the input. For example, in vision we know that nearby pixels are correlated
    and there are local features like edges and corners. Any object, such as a handwritten
    digit, may be defined as a combination of such primitives. We know that because
    the visual scene changes smoothly, nearby pixels tend to belong to the same object,
    and where there is sudden change—an edge—is informative because it is rare.


    Similarly, in speech, locality is in time, and inputs close in time can be grouped
    as speech primitives. By combining these primitives, longer utterances, namely
    speech phonemes, can be defined. They in turn can be combined to define words,
    and these in turn can be combined as sentences.


    In such cases, when designing the connections between layers, units are not connected
    to all of the input units because not all inputs are dependent. Instead, we define
    units that define a window over the input space and are connected to only a small
    *local* subset of the inputs. This decreases the number of connections and therefore
    the number of parameters to be learned. Such a structure is called a *convolutional
    neural network* where the operation of each unit is considered to be a convolution—that
    is, a matching—of its input with its weight (Le Cun et al. 1989). An earlier similar
    architecture is the *neocognitron* (Fukushima 1980).


    The idea is to repeat this in successive layers where each layer is connected
    to a small number of local units below. Each layer of *feature extractors* checks
    for slightly more complicated features by combining the features below in a slightly
    larger part of the input space, until we get to the output layer that looks at
    the whole input. Feature extraction also implements *dimensionality reduction*
    because although the raw attributes that we observe may be many in number, the
    important hidden features that we extract from data and that we use to calculate
    the output are generally much fewer.


    This multilayered network is an example of a *hierarchical cone* where features
    get more complex, abstract, and fewer in number as we go up the network until
    we get to classes (see figure 10).


    ![](images/13811_010_fig_000.jpg)


    ## Deep Learning


    In computer vision in the last half century, significant research has been done
    to find the best features for accurate classification, and many different image
    filters, transforms, and convolutions have been proposed to implement such feature
    extractors manually.


    Though these approaches have had some success, learning algorithms are achieving
    higher accuracy recently with big data and powerful computers. With few assumptions
    and little manual interference, structures similar to the hierarchical cone are
    being automatically learned from large amounts of data. These learning approaches
    are especially interesting in that, because they learn, they are not fixed for
    any specific task, and they can be used in a variety of applications. They learn
    both the hidden feature extractors and also how they are best combined to define
    the output.


    This is the idea behind *deep neural networks* where, starting from the raw input,
    each hidden layer combines the values in its preceding layer and learns more complicated
    functions of the input. The fact that the hidden unit values are not 0 or 1 but
    continuous allows a finer and graded representation of similar inputs (For example,
    if what we see in a small patch looks like a corner but is not exactly, the output
    of the corner-detecting hidden unit in that region will be, say, 0.7). Successive
    layers correspond to more abstract representations until we get to the final layer
    where the outputs are learned in terms of these most abstract concepts.


    We saw an example of this in the convolutional neural network where starting from
    pixels, we get to edges, and then to corners, and so on, until we get to a digit.
    In such a network, some user knowledge is necessary to define the connectivity
    and the overall architecture. Consider a face recognizer network where inputs
    are the image pixels. If each hidden unit is connected to *all* the pixels, the
    network has no knowledge that the inputs are face images or even that the input
    is two-dimensional—the input is just a set of values. Using a convolutional network
    where hidden units are fed with localized two-dimensional patches is a way to
    feed this locality information such that correct abstractions can be learned.


    In *deep learning*, the idea is to learn feature levels of increasing abstraction
    with minimum human contribution (Goodfellow et al. 2016; LeCun, Bengio, and Hinton
    2015; Schmidhuber 2015). This is because in most applications, we do not know
    what structure there is in the input, especially as we go up and the corresponding
    concepts become “hidden.” So, any sort of dependency should be automatically discovered
    during training from a large sample of examples. It is this extraction of hidden
    dependencies, or patterns, or regularities from data that allows abstraction and
    learning general descriptions.


    In chapter 2 when we discussed the example of fitting a model to a sequence of
    numbers, we saw that as the sequence gets more complex, we need more flexible
    models to be able to make a fit. Learning basically is a process of matching the
    complexity of the learner model to that of the task underlying the data. The representational
    capability of a neural network depends on its number of layers and units in each
    layer, so, as the task that we want to learn gets complex, we need deeper networks
    with more layers and units.


    Training a network with multiple hidden layers is difficult and slow because the
    error at the output needs to be propagated back to update the weights in all the
    preceding layers, and there is interference when there are many parameters. In
    a convolutional network, each unit is fed to only a small subset of the units
    before and feeds to only a small subset of units after, so there is less interference
    and training can be done faster.'
  fmt: '

    # 神经网络中的层级特征学习


    例如，在图像识别中，我们将图像像素作为基本输入，并作为第一层的输入。下一层中的神经元将这些组合起来，以检测基本的图像描述符，例如不同方向的笔画和边缘。后续层将这些组合形成更长的线条、弧线和角点。再后面的层将它们组合以学习更复杂的形状，如圆形、正方形等。这些又与更多处理层结合，来表示我们想要学习的对象，如人脸或手写字符。


    一层中的每个神经元都根据其下一层检测到的更简单模式来定义一个更复杂的特征。这些中间的特征检测单元被称为**隐藏单元**，因为它们对应于未直接观察到的隐藏属性，而是根据观察到的内容来定义。这些连续的隐藏单元层对应于不断增加的抽象层，我们从原始数据（如像素）开始，最终得到抽象概念（如数字或人脸）。


    有趣的是，视觉皮层中似乎也在运行类似的机制。在对猫的实验中，Hubel 和 Wiesel（后来因在视觉神经生理学方面的工作而获得 1981 年诺贝尔奖）表明，存在**简单细胞**，它们对视野中特定位置特定方向的线条做出反应，而这些又反馈给**复杂细胞**和**超复杂细胞**以检测更复杂的形状（Hubel
    1995）——尽管关于后续层发生的事情知之甚少。


    在网络上强加这种结构意味着对输入做出假设，例如依赖关系。例如，在视觉中，我们知道附近的像素是相关的，并且存在局部特征，如边缘和角点。任何对象（如手写数字）都可以定义为此类基元的组合。我们知道，因为视觉场景平滑变化，附近的像素倾向于属于同一对象，而突然变化的地方——边缘——具有信息量，因为它很罕见。


    同样，在语音中，局部性体现在时间上，时间上接近的输入可以被分组为语音基元。通过组合这些基元，可以定义更长的语音单位，即语音音素。它们反过来可以组合定义单词，单词又可以组合为句子。


    在这种情况下，设计层间连接时，单元不连接到所有输入单元，因为并非所有输入都相关。相反，我们定义在输入空间上定义一个窗口、且仅连接到一小部分**局部**输入的单元。这减少了连接数量，从而减少了需要学习的参数数量。这种结构称为**卷积神经网络**，其中每个单元的操作被视为其输入与其权重的卷积——即匹配（Le
    Cun et al. 1989）。一种早期的类似架构是**新认知机**（Fukushima 1980）。


    其思路是在连续层中重复此过程，其中每一层仅连接到下方少量的局部单元。每一层**特征提取器**通过在输入空间稍大的部分中组合下层特征，来检查稍微复杂的特征，直到到达查看整个输入的输出层。特征提取还实现了**降维**，因为虽然我们观察到的原始属性可能很多，但我们从数据中提取并用于计算输出的重要隐藏特征通常少得多。


    这种多层网络是**分层锥**的一个例子，随着我们向上遍历网络，特征变得更复杂、更抽象、数量更少，直到到达类别（见图 10）。


    ![](images/13811_010_fig_000.jpg)


    # 深度学习


    在过去半个世纪的计算机视觉中，已进行了大量研究以寻找用于准确分类的最佳特征，并提出了许多不同的图像滤波器、变换和卷积来手动实现此类特征提取器。


    尽管这些方法取得了一些成功，但最近学习算法凭借大数据和强大的计算机实现了更高的准确性。在极少假设和极少人工干预的情况下，类似于分层锥的结构正从大量数据中自动学习。这些学习方法特别有趣，因为它们通过学习，不针对任何特定任务固定，可用于各种应用。它们既学习隐藏特征提取器，也学习如何最佳地组合它们以定义输出。


    这就是**深度神经网络**背后的思想：从原始输入开始，每个隐藏层组合其前一层中的值，并学习输入的更复杂函数。隐藏单元值不是 0 或 1 而是连续的这一事实，允许对相似输入进行更精细和分级的表示（例如，如果我们在小块区域看到的看起来像角点但不完全是，该区域角点检测隐藏单元的输出将是
    0.7 等）。连续层对应于更抽象的表示，直到到达最终层，在那里输出是根据这些最抽象的概念学习的。


    我们在卷积神经网络中看到了一个例子：从像素开始，到边缘，然后到角点，依此类推，直到得到一个数字。在这样的网络中，需要一些用户知识来定义连接性和整体架构。考虑一个人脸识别网络，输入是图像像素。如果每个隐藏单元都连接到**所有**像素，网络就不知道输入是人脸图像，甚至不知道输入是二维的——输入只是一组值。使用卷积网络，其中隐藏单元接收局部二维补丁，是一种输入这种局部性信息的方式，以便学习正确的抽象。


    在**深度学习**中，其思想是在最少人工贡献的情况下学习抽象程度不断增加的特征层级（Goodfellow et al. 2016; LeCun, Bengio,
    and Hinton 2015; Schmidhuber 2015）。这是因为在大多数应用中，我们不知道输入中存在什么结构，尤其是当我们向上走、相应概念变得“隐藏”时。因此，任何类型的依赖关系都应在训练期间从大量示例样本中自动发现。正是这种从数据中提取隐藏依赖关系、模式或规律，使得抽象和学习通用描述成为可能。


    在第 2 章讨论将模型拟合到数字序列的示例时，我们看到随着序列变得更复杂，我们需要更灵活的模型来进行拟合。学习基本上是一个将学习器模型的复杂度与数据底层任务的复杂度相匹配的过程。神经网络的表示能力取决于其层数和每层的单元数，因此，随着我们想要学习的任务变得复杂，我们需要具有更多层和单元的更深层网络。


    训练具有多个隐藏层的网络既困难又缓慢，因为输出端的误差需要反向传播以更新所有前面层的权重，并且当参数很多时会存在干扰。在卷积网络中，每个单元仅输入给前面的一小部分单元，并输出给后面的一小部分单元，因此干扰较少，训练可以更快完成。

    '
