- raw: 'Nobody eagerly awaits a new microprocessor anymore, and neither a new programming
    language nor a new operating system version is newsworthy. Now we wait for the
    next new device or app, smart either because of its designer, or because it learns
    to be smart.


    More and more of our lives are being projected in the digital domain, and as a
    result we are creating more and more data. The earliest hard disks for personal
    computers had a capacity of five megabytes; now a typical computer comes with
    five hundred gigabytes—this is one hundred thousand times more storage capacity
    in roughly thirty years. A reasonably large database now stores hundreds of terabytes,
    and we have already started using the petabyte as a measure; very soon, we will
    jump to the next measure, the exabyte, which is one thousand petabytes or one
    million terabytes. Together with an increase in storage capacity, processing has
    also become cheaper and faster thanks to advances in technology that deliver both
    faster computer chips and parallel architectures containing thousands of processors
    that run simultaneously, each solving one part of a large problem.


    The trend of moving from all-purpose personal computers to specialized smart devices
    is also expected to accelerate. We discussed in chapter 1 how in the past organizations
    moved from a computer center to a distributed scheme with many interconnected
    computers and storage devices; now a similar transformation is taking place for
    a single user. A person no longer has one personal computer that holds all their
    data and does all their processing; instead, their data is stored in the “cloud,”
    in some remote offsite data center, but in such a way as to be accessible from
    all their smart devices, each of which accesses the part it needs.


    What we call the *cloud* is a virtual computer center that handles all our computing
    needs. We do not need to worry about where and how the processing is done or where
    and how the data is stored as long as we can keep accessing it whenever we want.
    This used to be called *grid computing*, analogous to the electrical grid made
    up of an interconnected set of power generators and consumers; as consumers, we
    plug our TV in the nearest outlet without a second thought as to where the electricity
    comes from.


    This also implies connectivity with larger bandwidths. Streaming music and video
    is already a feasible technology today. CDs and DVDs we keep on our shelves (that
    had once supplanted the nondigital LPs and videotapes) have now in turn become
    useless and are replaced by some invisible source that stores *all* the songs
    and the movies. E-book and digital subscription services are quickly replacing
    the printed book and the bookstore, and search engines have long ago made window
    stoppers out of thick encyclopedias.


    With smart devices, there is no longer any need for millions of people to store
    separate copies of the same song/movie/book locally. The motto now is: Do not
    buy it, rent it! Buy the smart device, or the app, or the subscription to the
    service, and the bandwidth that allows you to access it when you need it.


    This change and ease in accessibility also offers new ways to “package” and sell
    products. For example, traditionally music LPs and CDs corresponded to an “album”
    that is made up of a number of songs; it is now possible to rent individual songs.
    Similarly, it is now possible to purchase a single short story without buying
    the book of collected stories.


    In chapter 5, we discussed the use of machine learning in recommendation systems.
    With more shared data and streaming, there will be more data to analyze, and furthermore,
    the data will be more detailed. For example, now we also know how many times a
    person listened to a song or how far they watched into a movie, and such information
    can be used as a measure of how much the person enjoyed the product.


    With advances in mobile technology, there is continuing interest in wearable devices.
    The smartphone, a wearable device, is now much more than a phone; it also acts
    as an intermediary for smaller smart “things,” such as a watch or glasses, by
    putting them online. The phone may become even smarter in the near future, for
    example, with an app for real-time translation: You’ll speak in your own language
    on one end and the person on the other end will hear it automatically translated
    into their own tongue, not only with the content syntactically and semantically
    correct but also in your voice and uttered with correct emphasis and intonation.


    Machine learning will help us make sense of an increasingly complex world. Already
    we are exposed to more data than what our sensors can cope with or our brains
    can process. Information repositories available online today contain massive amounts
    of digital text and are now so big that they cannot be processed manually. Using
    machine learning for this purpose is called *machine reading*.


    Machine learning will help us make sense of an increasingly complex world. Already
    we are exposed to more data than what our sensors can cope with or our brains
    can process.


    We need search engines that are smarter than the ones that use just keywords.
    Currently we have information distributed in different sources or mediums, so
    we need to query them all and merge the responses in an intelligent manner. These
    different sources may be in different languages—for example, a French source may
    contain more information on the topic even though your query is in English. A
    query may also trigger a search in an image or video database. And still, the
    overall result should be summarized and condensed enough to be digestible by a
    user.


    *Web scraping* is when programs automatically surf the web and extract information
    from web pages. These web pages may be social media, and accumulated information
    can be analyzed by learning algorithms, for instance, to track trending topics
    and the detection of sentiment, opinions, and beliefs about products and people—for
    example, politicians in election times. Another important research area where
    machine learning is used in social media is to identify the “social networks”
    of people who are connected; analyzing such networks allows us to find cliques
    of like-minded individuals, or to track how information propagates over social
    media.


    One of the current research directions is in adding smartness—that is, the ability
    to collect, process, and make inferences from data, as well as to share it with
    other online devices—to all sorts of traditional tools and devices, including
    traditional wearables such as glasses and watches. When more devices are smart,
    there will be more data to analyze and make meaningful inferences from. Different
    devices and sensors collect different aspects of the task, and a critical task
    will be to combine and integrate these multiple modalities. This implies all sorts
    of new interesting scenarios and applications where learning algorithms can be
    used.


    Smart devices can help us both at work and at home. Machine learning helps us
    in building systems that can learn their environment and adapt to their users,
    to be able to work with minimum supervision and maximum user satisfaction.


    Important work is being done in the field of smart cars. Cars that are online
    allow their passengers to be online and can deliver all types of online services,
    such as streaming video, over their digital *infotainment* systems. Cars that
    are online can also exchange data for maintenance purposes and access real-time
    information about the road and weather conditions. If you are driving under difficult
    conditions, a car that is a mile ahead of you is a sensor that is a mile ahead
    of you.'
