    # 深度学习方法


    深度学习方法之所以具有吸引力，主要是因为它们需要较少的人工干预。我们不需要精心设计合适的特征或适当的变换。一旦我们拥有数据——如今我们拥有“大”数据——以及足够的计算资源——如今我们拥有成千上万个处理器的数据中心——我们只需等待，让学习算法自行发现一切必要的东西。


    近年来推动深度学习研究的另一个重要因素是软件库的可用性，这些库允许非常轻松地编写深度神经网络代码。这些库还能高效地利用并行硬件，从而允许非常快速地测试不同的网络架构。


    深度学习所依赖的、抽象程度逐层递增的多层思想是直观的。不仅在视觉领域——如手写数字或人脸图像——而且在许多应用中，我们都可以设想出这种抽象层次。发现这些抽象表示非常有用，不仅用于预测，还因为抽象能让我们更好地描述和理解问题。


    ## 学习隐藏表示


    一种特殊的多层网络是 `autoencoder`（自编码器），其期望输出被设定为等于输入，且网络呈沙漏形状，中间层的隐藏单元比输入和输出层的少。这种网络由两部分组成：第一部分从输入到隐藏层，实现
    `encoder`（编码器）阶段，将高维输入压缩为由较少隐藏单元的值表示的形式。第二部分从隐藏层到输出，实现 `decoder`（解码器）阶段，接收隐藏层中的低维表示，并在输出端重构出高维输入（见图
    11）。


    ![](img/13811_011_fig_000.jpg)


    为了使网络能在其输出单元处重构输入，作为瓶颈的那些少量隐藏单元必须能够提取出最大程度保留信息的特征。`autoencoder` 是无监督的；这些隐藏单元在没有任何监督的情况下自行学习，以找到输入的良好编码——一种简短、压缩的描述，提取最重要的特征并忽略无关内容，即噪声。


    研究人员提出了基本 `autoencoder` 的扩展和不同用法。例如，图 11 所示的 `autoencoder` 在输入和隐藏单元之间只有一层连接，但在实践中，`deep`（深层）`autoencoder`
    的 `encoder` 中可能有多层（其结构在 `decoder` 中镜像），以便学习更抽象的隐藏表示；例如，如果输入是图像，`encoder` 的前几层通常是卷积层。


    一个有趣的变体是 `noisy autoencoder`（去噪自编码器），其目标是学习一种对输入扰动具有鲁棒性的隐藏表示。假设我们有人脸图像，发现有些人戴眼镜遮挡了眼睛，这会干扰识别。我们的做法是使用一个
    `autoencoder`，输入同一个人的两张图片，一张戴眼镜，一张不戴，并将不戴眼镜的图片设为两者的期望输出。为了能为两者生成相同的输出，`encoder`
    必须学会为两者生成相同的编码，这意味着它必须学会丢弃眼镜遮挡的影响。`encoder` 生成的这种表示随后可被送给人脸识别器，后者便能在戴眼镜的情况下做出决策。


    这可以针对我们希望获得不变性的任何输入扰动来完成，例如小幅度的旋转或平移。也就是说，如果你有一个输入 `x` 及其扰动版本 `x*`，并将 `x` 设为两者的期望输出，假设网络足够大且看到足够多的训练样本，网络将学会生成一种对该类扰动具有不变性的隐藏表示。


    一般思想是：如果我们有两个不同的输入，但为它们设定相同的期望输出，`encoder` 将被迫学会为这两个输入生成相同或非常相似的编码。该思想的一个应用是在自然语言处理中学习词表示。这是一个对优秀特征提取器（即优秀的隐藏表示）需求最为明显的领域。研究人员曾致力于预定义数据库，称为
    `ontologies`（本体），用于表示语言中词与词之间的关系，这些数据库有一定成效；但最终证明，最好的方法还是从大量数据中学习这些关系。


    在 `word2vec` 网络中，其架构与 `autoencoder` 相同，输出是一个词，输入是该词的上下文中的一个词，即同一句子中附近的词之一（Mikolov
    等人，2013）。这种训练的结果是：如果两个词出现在相同或非常相似的上下文中，`encoder` 将为它们生成相似的编码。


    例如，考虑以下句子：


    > 如果我们遍历一个非常大的句子语料库，极有可能也会找到非常相似的句子，只是将“Paris”（巴黎）替换为“Berlin”（柏林）、"Rome"（罗马）等。我们将会有许多关于城市的句子，它们几乎完全相同，唯一的区别在于城市名称。这将使所有这些城市的编码（`encoder`
    输出）变得相似，因为需要从它们中解码出相同的上下文词。


    现在考虑这个句子：


    > 同样，我们将会有许多相似的句子，将“French”（法语）替换为“German”（德语），并将“Paris”替换为“Berlin”。这将导致为“French”和“German”生成相似的编码，但“German”与“Berlin”之间的表示关系也将与“French”与“Paris”之间的相同。这引出了所谓的
    `vector algebra`（向量代数）：因为编码是数字，我们可以对它们进行算术运算。


    假设 `vec("Paris")` 表示“Paris”的学习编码（见图 12）。训练后，我们期望 `vec("Paris")` 和 `vec("Berlin")`
    相近，`vec("French")` 和 `vec("German")` 也在编码空间的其他部分相近，但我们也期望它们的关系相似。即我们期望 `vec("German")
    – vec("Berlin")` 与 `vec("French") – vec("Paris")` 非常相似，以至于如果我们计算 `vec("German")
    – vec("Berlin") + vec("Paris")`，将得到一个非常接近 `vec("French")` 的编码。


    ![](img/13811_012_fig_000.jpg)


    ## 端到端学习


    在许多应用中，处理过程可以视为一种 `encoder-decoder`（编码器-解码器）结构，这正是我们之前讨论的 `autoencoder` 所具备的。


    以机器翻译为例。从一个英语句子开始，通过从超大英语语料库中自动学习到的多层处理和抽象——编码英语的词汇、句法和语义规则——我们将得到最高层的抽象表示。现在考虑同一个句子的法语版本。这次从法语语料库中学习到的处理层次会有所不同，但如果两个句子意思相同，在最高层、与语言无关的抽象层面上，它们应具有非常相似的表示。


    语言理解是一个编码过程，从给定句子中提取这种高层抽象表示；语言生成是一个解码过程，从这种高层表示合成自然语言句子。在翻译中，我们用源语言编码，用目标语言解码。在对话系统中，我们首先将问题编码到抽象层面，在该层面处理以形成抽象层面的响应，然后将其解码为响应句子。


