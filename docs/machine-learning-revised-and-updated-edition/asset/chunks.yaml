- raw: 'The basic requirements in data privacy are that the user who generates the
    data should always know what and how much data is collected, what part of it is
    stored, whether that data will be analyzed for any purpose, and if so, what that
    purpose is. No more data than what is absolutely necessary should be collected.
    The data collector should be completely open about what is collected.


    This requirement of *transparency* implies that the owner of the data should always
    be informed during both data collection and use. Before any analysis, the data
    should be sanitized—that is, all the personal details should be hidden to make
    the record anonymous, which is not a straightforward process. With human records,
    for instance, just removing unique identifiers such as the name or social security
    number is not enough; fields such as birth date, zip code, and so on provide partial
    clues, and individuals can be identified by combining such clues (Sweeney 2002).


    Data is becoming such a valuable raw resource that it behooves the collector of
    the data to take all the necessary steps for its safekeeping and to not share
    it with someone else without the explicit consent of the data owner.


    Individuals should have complete control over their data. They should always have
    the means to view what data of theirs has been collected; they should be able
    to ask for its correction or complete removal.


    A recent line of research is in *privacy-preserving learning* algorithms. Let
    us say that we have parts of data from different sources (e.g., different countries
    may have patients suffering from the same disease) and that they do not want to
    lend their data (detailed information about their citizens) to a central user
    to train a model with all the data combined. In such a case, the easiest possibility
    is to share the data in a form that is sufficiently anonymized, which may not
    always be easy.


    One research topic in machine learning is called *differential privacy*, where
    the idea is to knowingly corrupt the data before sharing it so that individual
    records cannot be identified while still allowing correct generalizations to be
    learned from the whole.


    Another approach is called *homomorphic encryption*, where the data is stored
    encrypted and is also processed without decrypting it. Because the data always
    remains encrypted, the privacy of the information is preserved; the disadvantage
    is that this type of processing requires a lot of extra computation.


    Yet another interesting idea for privacy is *federated learning*, where the idea
    is to have multiple copies of the model for different users. Each model then learns
    from its user and is updated by its local data, also regularly sharing the model
    updates with the other users. Because the other users see only the model updates
    and not the data, the data of each user is kept private.


    Concerns over data privacy and security should be an integral part of any data
    analysis scenario, and it should be resolved before any learning is done. Mining
    data is just like mining for gold—before you start any digging, you need to make
    sure that you have all the necessary permits. In the future, we may have data
    processing standards where every data set contains some metadata about this type
    of ownership and permission information; then, it may be required that any machine
    learning or data analysis software check for these and run only if the necessary
    stamps of approval are there.


    ## Biased Data


    How good a learned model will be depends first of all on how good its training
    data is. Any problems with that data will be reflected in the quality of the model.


    One source of problems is possible mishaps in collecting the data. For example,
    if a face recognition data set contains more White faces than those of other races,
    any face recognizer trained on that data will perform poorly on races that are
    underrepresented. Basically, the error for any class depends on how many training
    instances there are of that class, and so the learning algorithm will have less
    motive to correct the errors on classes that have fewer training instances. This
    type of sampling error can be corrected by collecting a balanced training sample
    that includes the whole range of racial identities.


    Basically, we need to make sure to match the distribution of the training data
    with the distribution of the data encountered in the field; any mismatch will
    result in a poor model. For example, we frequently see that scientific articles
    that report very high accuracies in the lab do not always lead to successful commercial
    products. This is partly because the lab conditions are close to ideal, where,
    for example, data is collected carefully and with high precision; such conditions
    are almost impossible to duplicate in the real world.


    Such erroneous sampling may also have indirect causes such as biases in the underlying
    process that generates the data. For example, data may have been collected in
    the past where there may have been lack of diversity; a bank may have had fewer
    women than men as customers in the past, or fewer customers from certain minorities.
    Achieving *fairness*, by detecting and mitigating such biases is an important
    research topic in machine learning.


    The fact that a model that learns the general behavior in the data does not make
    good decisions for underrepresented cases or outliers has other implications as
    well.


    For example, there is an important risk in basing recommendations too much on
    past use and preferences. If a person only listens to songs similar to the ones
    they listened to and enjoyed before, or watches movies similar to those they watched
    and enjoyed before, or reads books similar to the books they read and enjoyed
    before, then there will be no new experience and that will be limiting, both for
    the person and for the company that is always eager to find new products to sell.
    So in any such recommendation scheme, there should also be some attempt at introducing
    some diversity.


    A recent study (Bakshy, Messing, and Adamic 2015) has shown that a similar risk
    also exists for interactions on social media. If a person follows only those people
    they agree with and reads posts, messages, and news similar to the ones they have
    read in the past, they will be unaware of other people’s opinions and that will
    limit their experience, as opposed to traditional news media outlets, such as
    newspapers or TV, that contain a relatively wider range of news and opinions.


    ## Model Interpretability


    As we have more and more computer systems that are trained from data to make autonomous
    decisions, we need to be concerned with relying so much on computers. One important
    requirement is the validation and verification of software systems—that is, making
    sure that they do what they should do and do not do what they should not do.


    This may be especially difficult for models trained from data, because training
    involves different sources of randomness in data and optimization; this makes
    trained software less predictable than programmed software.


    Our approach in testing a trained model is to check its performance on data unused
    in training, to see how well it has generalized from the particular training examples.
    After having trained the model on the training data, which is one small random
    subset of all possible cases, we test it on a validation data that is another
    random subset, and we use the accuracy on this new data as our criterion of the
    expected accuracy in later use. This is a useful criterion, but it is not sufficient,
    because both training and validation sets are small and randomly chosen, and changing
    them may lead to changes in the accuracy estimates.'
