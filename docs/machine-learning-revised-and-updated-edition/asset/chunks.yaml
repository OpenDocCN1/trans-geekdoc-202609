- raw: 'In learning, we would like the computer (the machine) to extract automatically
    the algorithm for the task that underlies the data. There is no need to learn
    to calculate payroll, we already know how to do it, but there are many applications
    for which we do not have an algorithm but can collect lots of data.


    ## Artificial Intelligence


    Machine learning is not just a database or programming problem; it is also a requirement
    for artificial intelligence. A system that is in a changing environment should
    have the ability to learn; if it keeps on making the same mistakes over and over,
    we will hardly call it intelligent. Learning is smart from an engineering point
    of view as well because if the system can detect and adapt to changes, the system
    designer need not foresee and provide solutions for all possible situations.


    For us, the system designer was evolution, and our body shape as well as our built-in
    instincts and reflexes have evolved over millions of years. We also learn to change
    our behavior during our lifetime. This helps us cope with changes in the environment
    that cannot be predicted by evolution. Organisms that have a short life in a well-defined
    environment may have all their behavior built-in, but instead of hardwiring into
    us all sorts of behavior for any circumstance that we might encounter in our life,
    evolution gave us a large brain and a mechanism to learn such that we could update
    ourselves with experience and adapt to different environments. That is why human
    beings have survived and prospered in different parts of the globe in very different
    climates and conditions. When we learn the best strategy in a certain situation
    that knowledge is stored in our brain, and when the situation arises again—when
    we recognize (“cognize” means to know) the situation—we recall the suitable strategy
    and act accordingly.


    Machine learning is not just a database or programming problem; it is also a requirement
    for artificial intelligence. A system that is in a changing environment should
    have the ability to learn.


    Each of us, actually every animal, is a data scientist. We collect information
    about our environment using our sensors, and then we process the data to devise
    rules of behavior to control our actions in different circumstances to minimize
    pain and/or maximize pleasure. We have memory to store those rules in our brains,
    and then we recall and use them when needed. Learning is lifelong; we forget rules
    when they no longer apply or revise them when the environment changes.


    Learning has its limits though; there may be things that we can never learn with
    the limited capacity of our brains, just like we can never “learn” to grow a third
    arm, or an eye in the back of our head—something that would require a change in
    our genetic makeup. Roughly speaking, genetics defines the hardware that slowly
    adapts over thousands of generations through mutation, whereas learning defines
    the adaptation of the software running on (and being constrained by) that hardware
    during an individual’s lifetime.


    Artificial intelligence takes inspiration from the brain. There are cognitive
    scientists and neuroscientists whose aim is to understand the functioning of the
    brain, and toward this aim, they build models of neural networks and make simulation
    studies. But artificial intelligence is a part of computer science and our aim
    is to build useful systems, as in any domain of engineering. So, though the brain
    inspires us, ultimately, we do not care much about the biological plausibility
    of the algorithms we develop.


    We are interested in the brain because we believe that it may help us build better
    computer systems. The brain is an information-processing device that has some
    incredible abilities and surpasses current engineering products in many domains—for
    example, vision, speech recognition, and learning, to name three. These applications
    have evident economic utility if implemented on machines. If we can understand
    how the brain performs these functions, we can define solutions to these tasks
    as formal algorithms and implement them on computers.


    Computers were once called “electronic brains,” but computers and brains are different.
    Whereas a computer generally has one or few processors, the brain is composed
    of a very large number of processing units, namely, neurons, operating in parallel.
    Though the details are not completely known, the processing units are believed
    to be much simpler and slower than a typical processor in a computer. What also
    makes the brain different, and is believed to provide its computational power,
    is its large connectivity. Neurons in the brain have connections, called synapses,
    to tens of thousands of other neurons, and they all operate in parallel. In a
    computer, the processor is active, and the memory is separate and passive, but
    it is believed that in the brain both processing and memory are distributed together
    over the network; processing is done by the neurons and memory occurs in the synapses
    between the neurons.


    ## Understanding the Brain


    According to Marr (1982), understanding an information processing system works
    at three *levels of analysis*:


    1.  1\. *Computational theory* corresponds to the goal of computation and an abstract
    definition of the task.


    2.  2\. *Representation and algorithm* define how the input and the output are
    represented, and about the specification of the algorithm for the transformation
    from the input to the output.


    3.  3\. *Hardware implementation* is the actual physical realization of the system.


    The basic idea in these levels of analysis is that for the same computational
    theory, there may be multiple representations and algorithms manipulating symbols
    in that representation. Similarly, for any given representation and algorithm,
    there may be multiple hardware implementations. For any theory, we can use one
    of various algorithms, and the same algorithm can have different hardware implementations.


    Let us take an example: ‘6’, ‘VI’, and ‘110’ are three different representations
    of the number six; respectively, they are the Arabic, Roman, and binary representations.
    There is a different algorithm for addition depending on the representation used.
    Digital computers use the binary representation and have circuitry to add in this
    representation, which is one particular hardware implementation. Numbers are represented
    differently, and addition corresponds to a different set of instructions on an
    abacus, which is another physical implementation. When we add two numbers “in
    our head,” we use another representation and an algorithm suitable to that representation,
    which is implemented by the neurons. But all these different physical realizations—namely,
    us, abacus, digital computer—implement the same computational theory: addition.


    In engineering we go from top to bottom. For example, in software engineering,
    first we decide on the requirements, then we go down one step and devise an algorithm
    suitable for the task and the suitable data structures to store the necessary
    information in computer memory,[4](#13811-0015.xhtml#en5) and finally we go down
    another step and write the algorithm in a programming language to be executed
    on a particular computer.


    Sometimes it is necessary to go in the opposite direction from bottom to top;
    this is called *reverse engineering*. For example, in World War II, the German
    military used a machine called the Enigma to encrypt communications. Intensive
    work by the Allies resulted in the discovery of its internal mechanisms, and this
    allowed decryption.'
