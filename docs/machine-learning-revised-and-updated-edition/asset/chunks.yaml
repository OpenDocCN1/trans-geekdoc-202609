- raw: 'But more important than being online is when cars will be smart enough to
    help with the driving itself. Cars already had assistance systems for cruise control,
    self-parking, and lane keeping, but these days they are becoming even more capable.
    The ultimate aim is for them to completely take over the task of driving, and
    to that end we already have prototypes of such autonomous vehicles today. Of course,
    this is also true also for buses, trucks, and so on. For example, in the case
    of a pandemic when the population is on lockdown, self-driving trucks can transport
    products from factories to cities.


    The visual system of a human driver does not have a very high resolution, and
    they can only look in a forward direction. Though their visual field is slightly
    extended through the use of side and rearview mirrors, blind spots remain. A *self-driving
    car*, on the other hand, can have cameras with higher resolution in all directions
    and can also use sensors that a human does not have, such as GPS, ultrasound,
    or night vision, or it can be equipped with a special type of radar, called LIDAR,
    that uses a laser for measuring distance. A smart car can also access all sorts
    of extra information, such as the weather, much faster. An electronic driver has
    a much shorter reaction time.


    Machine learning plays a significant role in self-driving cars that result in
    both smoother driving, faster control, and greater fuel efficiency, but also in
    smart sensing, for example, by automatic recognition of pedestrians, cyclists,
    traffic signs, and so forth. Self-driving cars will not only be safer but they
    will also be faster; the speed limits we have are set because of the relatively
    slower reaction times of human drivers. There are still problems though: Lasers
    and cameras are not very effective in harsh weather conditions—when there is rain,
    fog, or snow—so technology should advance until we get smart cars that can run
    in all types of weather.


    Self-driving cars and robot taxis are expected to take over driving in cities
    and on highways in the next decade. It also seems very likely that sometime in
    the next decade or so, cars and drones will fuse and we will have self-piloting
    flying cars, with their concomitant tasks that will be best handled by machine
    learning.


    Machine learning has the basic advantage that a task does not need to be explicitly
    programmed but can be learned. Space will be the new frontier for machine learning
    as well. Future space missions will very likely be unmanned. Before, we needed
    to send humans because we did not have machines that were as smart and versatile,
    but now we have capable robots. If there are no humans on board, the load will
    be lighter and simpler, and there will be no need to bring the load back. If a
    robot is to boldly go where no one has gone before, it can only be a learning
    robot.


    ## High-Performance Computation


    With big and bigger data, we need storage systems that have higher capacity *and*
    faster access. Processing power will necessarily increase so that more data can
    be processed in a reasonable time. This implies the need for high-performance
    computer systems that can store a lot of data and do a lot of computation very
    quickly.


    There are physical limits such as the speed of light and the size of the atom,
    which suggests an upper limit on the speed of transfer[1](#13811-0015.xhtml#en18)
    and a lower limit on the size of the basic electronics. The obvious solution to
    this is parallel processing—if you have eight lines in parallel, you can send
    eight data items at the same time; and if you have eight processors, you can process
    those eight items simultaneously, in the time it takes to process a single one.


    Today parallel processing is routinely used in computer systems. We have powerful
    computers that contain thousands of processors running simultaneously. There are
    also multicore machines where a single computing element has multiple “cores”
    that can do simple computations simultaneously, implementing parallel processing
    in a single physical chip.


    But high-performance computation is not just a hardware problem; we also need
    good software interfaces to distribute the computation and data over a very large
    number of processors and storage devices. Indeed, software and hardware for parallel
    and distributed computation for big data are important research areas in computer
    science and engineering today.


    In machine learning, the parallelization of learning algorithms is becoming increasingly
    important. Models can be trained in parallel over different parts of the data
    on different computers and then these models can be merged. Another possibility
    is to distribute the processing of a single model over multiple processors. For
    example, with a deep neural network composed of thousands of units in multiple
    layers, different processors can execute different layers or subsets of layers
    working in a pipeline manner.


    The *graphical processing unit* (GPU) was originally made for rapid processing
    and the transfer of images in graphical interfaces—for example, in video game
    consoles—but the type of parallel computation and transfer used for graphics has
    also made them suited for many machine learning tasks. Indeed, specialized software
    libraries are being developed for this purpose and GPUs are frequently used by
    researchers and practitioners effectively in various machine learning applications;
    for example, the AlphaGo network that we discussed in chapter 6 is parallelized
    to run on GPUs. There is also research in developing more specialized processing
    units, for example, to carry out the sort of calculations used in neural networks;
    today’s deep neural networks with hundreds of layers and millions of parameters
    run too slowly on an ordinary CPU.


    We are seeing a trend toward *cloud computing* in machine learning applications
    too, where instead of buying and maintaining the necessary hardware, people rent
    the use of offsite *data centers*. A data center is a physical site that houses
    a very large number of computing servers with many processors and ample storage.
    There are typically multiple data centers in physically different locations; they
    are all connected over a network, and the tasks are automatically distributed
    and migrated from one to the other, so that the load from different customers
    at different times and in different sizes is balanced. All of these requirements
    fuel significant research today.


    One important use of the cloud is in extending the capability of smart devices,
    especially the mobile ones. These online, low-capacity devices can access the
    cloud from anywhere to exchange data or request computation that is too large
    or complex to do locally. Consider speech recognition on a smartphone. The phone
    captures the acoustic data, extracts the basic features, and sends them to the
    cloud. The actual recognition is done in the cloud and the result is sent back
    to the phone.


    In computing, there are two parallel trends. One is in building general-purpose
    computers that can be programmed for different tasks and for different purposes,
    such as those used in servers in data centers. The other is to build specialized
    computing devices for particular tasks, packaged together with specialized input
    and output. The latter used to be called *embedded systems* but are today called
    *cyber-physical systems*, to emphasize the fact that they work in the physical
    world with which they interact. A system may be composed of multiple such units
    (some of which may be mobile), and they may be interconnected over a network—for
    example, a car, a plane, or a home may contain a multitude of such devices for
    different tasks. Making such systems smart—in other words, able to adapt to their
    particular environment, which includes the user—is an important research direction.'
