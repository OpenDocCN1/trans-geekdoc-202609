- raw: 'Following this idea, one popular research topic these days is *edge computing*,
    where we want to have as much of the specialized processing as possible done “on
    the edge”—that is, closer to where the data originates. With computation getting
    cheaper and smaller, most of the necessary computation can be done locally as
    soon as it is sensed, which has the advantages that we do not need to transmit
    data back and forth, so there is less network traffic and hence the response is
    also faster. This is especially interesting in artificial intelligence where we
    have large chunks of data such as video, image, or sound, and processing them
    on the spot pushes intelligence to the edge; hence the name “edge AI.”


    A related concept is *fog computing*, where we have general computing services,
    just like in cloud computing, but they are closer to the user. For example, they
    may be in our local area network as opposed to in a faraway data center, similar
    to how fog is a thin cloud closer to the earth, or us. Again, the advantages are
    less communication and faster decision making.


    ## How Green Is My AI?


    Recently with the proliferation of personal computers, smart phones, Internet,
    and data centers, the total amount of electricity used to power the computers
    around the globe has reached a considerable amount. Computing used to be considered
    environmentally friendly—it is better to read from the screen than to print it
    on paper—which is partially true, but we always need to keep in mind that all
    our calculations, data storage, and communication run on electricity. All those
    machines need to be powered up and they need to be cooled down, which implies
    an ever-increasing carbon footprint.


    Machine learning is particularly power-hungry. We need to store large data sets
    and typically learning algorithms need to do a large number of learning iterations,
    each of which takes a lot of computation, and hence power, when we use a complex
    model such as a deep neural network with many layers. Schwartz et al. (2019) report
    that “the computations required for deep learning research have been doubling
    every few months, resulting in an estimated 300,000x increase from 2012 to 2018.”


    This has a number of disadvantages: First, if a model uses too much power, it
    cannot be implemented on a mobile device running on a battery. Second, a model
    that uses too much computation will be expensive and such a device cannot be sold
    to a large customer base. Third, all that power needs to be produced somehow,
    and we know that frequently countries need to burn coal or gas to generate that
    electricity, which has all sorts of detrimental effects on the environment including
    the contribution to global warming.


    Research on more energy-efficient computer architectures is an important topic
    for computing, and energy efficiency has become an important criterion in assessing
    the quality of an algorithm; this is especially relevant for machine learning
    that is both data- and computation-heavy.


    ## Data Mining


    Though the most important, machine learning is only one step in a *data mining*
    application (Han and Kamber 2011). There is also the preparation of data beforehand
    and the interpretation of the results afterward.


    Making data ready for mining involves several stages. First, from a large database
    with many fields, we select the parts that we are interested in and create a smaller
    database to work with. It may also be the case that the data comes from different
    databases, so we need to merge them. The level of detail may also be different—for
    instance, from an operational database we may extract daily sums and use those
    rather than the individual transactions. Raw data may contain errors and inconsistencies
    or parts of it may be missing, and those should be handled beforehand in a preprocessing
    stage.


    Energy efficiency has become an important criterion in assessing the quality of
    an algorithm; this is especially relevant for machine learning that is both data-
    and computation-heavy.


    After extraction, data is stored in a *data warehouse* on which we do our analysis.
    One type of data analysis is manual where we have a hypothesis—“people who buy
    *X* also buy *Y*”—and check whether the data supports the hypothesis. The data
    is in the form of a spreadsheet where the rows are the data instances—baskets—and
    the columns are the attributes—products. One way of conceptualizing the data is
    in the form of a *multidimensional data cube* whose dimensions are the attributes,
    and data analysis operations are defined as operations on the cube, such as slice,
    dice, and so on. Such manual analysis of the data as well as visualization of
    results is made easy by *online analytical processing* (OLAP) tools.


    OLAP is restrictive in the sense that it is human-driven, and we can only test
    the hypotheses we can imagine. For example, in the context of basket analysis,
    we cannot find any relationship between distant pairs of products; such discoveries
    require a data-driven analysis, as is done by machine learning algorithms.


    We can use any of the methods we discussed in previous chapters, for classification,
    regression, clustering, and so on, to build a model from the data. Typically,
    we divide our data into two as a training set and a validation set. We use the
    first part for training our model and then we measure its prediction accuracy
    on the validation set. By testing on instances not used for training, we want
    to estimate how well the trained model would do if used later on, in the real
    world. The validation set accuracy is one of our main criteria in accepting or
    rejecting the trained model.


    In the previous chapter, we covered the interpretability of machine learning models,
    and this is an important requirement in data mining. People who use the predictive
    models do not always know machine learning, so it is important that whatever is
    learned from the data be presented in a form that is understandable by them. In
    many data mining scenarios—for example, in credit scoring—this process of knowledge
    extraction and model assessment by people may be important and even necessary
    in validating the model trained from data.


    Visualization tools can also help here. Actually, visualization is one of the
    best tools for data analysis, and sometimes just visualizing the data in a smart
    way is enough to understand the characteristics of the process that underlies
    a complicated data set, without any need for further complex and costly statistical
    processing; see Börner 2015 for examples.


    As we have more data and more computing power, we can attempt more complicated
    data mining tasks that try to discover hidden relationships in more complex scenarios.
    Most data mining tasks today work in a single domain using a single source of
    data. Especially interesting is the case where we have data from different sources
    in different modalities; mining such data and finding dependencies across sources
    and modalities is a promising research direction.


    ## Data Science


    The advances and successes of machine learning methods on big data and the promise
    of more have prompted researchers and practitioners in the industry to call this
    endeavor a new branch of science and engineering. There are still discussions
    about what this new field of *data science* should cover, but it seems as if the
    major topics are machine learning, high-performance computing, and the social,
    ethical, and legal implications of data collection, analysis, and data-driven
    decision making.


    Of course, not all learning applications need a cloud, or a data center, or a
    cluster of computers. One should always be wary of hype and companies’ sale strategies
    to invent new and fancier names under which to sell old products.'
