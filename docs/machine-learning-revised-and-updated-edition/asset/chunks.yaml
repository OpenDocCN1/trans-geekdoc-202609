- raw: 'Another example, though this is not information processing, is the difference
    between natural and artificial flying machines. Humanity had always dreamed of
    flying, and our early attempts to copy birds by putting on big wings did not work;
    our arms and shoulders are not strong enough to flap wings big enough to carry
    our weight—that was an attempt to copy at too low a level. But once science advanced
    and we discovered the rules of aerodynamics, that is, once we were able to go
    up to the level of theory, we were able to devise another implementation for the
    same theory, and with the means we had, we invented propellers, and later on,
    jet engines. A sparrow flaps its wings; an airplane does not flap its wings but
    uses jet engines. The sparrow and the airplane are two hardware implementations
    built for different purposes, satisfying different constraints. But they both
    obey the same theory, which is aerodynamics.


    In artificial intelligence, we want to do the same for intelligence. We can say
    that the brain is one hardware implementation for intelligence. If from this particular
    implementation we can do reverse engineering and extract the representation and
    the algorithm used, and if from that in turn we can get the computational theory,
    we can then use another representation and algorithm, and in turn a hardware implementation
    more suited to the means and constraints we have.


    In chapter 4 we will discuss artificial neural networks that are composed of interconnected
    processing units and how such networks can learn—this is the representation and
    algorithm level. In time, when we discover the computational theory of intelligence,
    we may discover that neurons and synapses are implementation details, just as
    we have realized that feathers are for flying.


    ## Pattern Recognition


    In computer science, we have tried to solve many tasks using manually specified
    rules and algorithms. Decades of work have led to very limited success. Some of
    these tasks relate to artificial intelligence in that they are believed to require
    intelligence. The current approach, in which we have seen tremendous progress
    recently, is to use machine learning from data.


    Let us take the example of recognizing faces: this is a task that we do effortlessly;
    every day we recognize family members and friends by looking at their faces or
    from their photographs, despite differences in pose, lighting, hairstyle, and
    so forth. Face perception is important for us because we want to tell friend from
    foe. It was important for our survival not only for identification, but also because
    the face is the dashboard of our internal state. Feelings such as happiness, anger,
    surprise, and shame can be read from our face, and we have evolved both to display
    such states as well as to detect it in others.


    Though we do such recognition easily, we do it unconsciously and are unable to
    explain how we do it. Because we are not able to explain our expertise, we cannot
    write the corresponding computer program.


    By analyzing different face images of a person, a learning program captures the
    pattern specific to that person and then checks for that pattern in a given image.
    This is one example of pattern recognition.


    The reason we can do this is because we know that a face image, just like any
    natural image, is not just a random collection of pixels (a random image would
    be like a snowy TV). A face has structure. It is symmetric. The eyes, the nose,
    and the mouth are located in certain places on the face. Each person’s face is
    a pattern composed of a particular combination of these. When the illumination
    or pose changes, when we grow our hair or put on glasses, or when we age, certain
    parts of the face image change but some parts do not. The learning algorithm finds
    those unchanging discriminatory features and the way they are combined to define
    a particular person’s face by going over a number of images of that person.


    ## What We Talk about When We Talk about Learning


    In machine learning, the aim is to have a computer program that learns. Learning
    means getting better through experience. “Better” implies a performance criterion
    that is optimized. “Experience” implies data collected in the past—for example,
    in past trials. From a programming point of view, “getting better” is implemented
    as the modification of the decision-making program so that in time, as it sees
    more data, its output leads to higher performance according to the criterion that
    is to be optimized.


    A learning program is different from an ordinary computer program in that it is
    a *general template with modifiable parameters*, and by assigning different values
    to these parameters the program can do all sorts of different things. The learning
    algorithm *adjusts the parameters* of the template—which we call a model—by *optimizing
    a performance criterion defined on the data*.


    For example, for a game-playing program, the parameters are adjusted as we play
    against an opponent so that the ratio of our wins to losses increase. For a face
    recognizer, the parameters are adjusted so that we get the highest prediction
    accuracy on a set of training images of a person. The learning process is generally
    repetitive and incremental. The learning program sees examples (games or faces)
    one after the other, and the parameters are updated slightly at each example,
    so that the performance improves gradually in time. After all, this is what learning
    is: as we learn a task, we get better at it, be it tennis, geometry, or a foreign
    language.


    In chapter 2, we will cover in more detail what the template is (actually as we
    will see, we have different templates depending on the type of the task) and the
    different learning algorithms that adjust the parameters so as to get the best
    performance.


    In building a learner, there are a number of important considerations:


    First, we should keep in mind that just because we have a lot of data, it does
    not mean that there are underlying rules that can be learned. We should make sure
    that there are dependencies in the underlying process and that the collected data
    provides enough information for them to be learned with acceptable accuracy.


    Let’s say we have a phone book containing people’s names and their phone numbers.
    It does not make sense to believe that there is an overall relationship between
    names and phone numbers; in such a case, we can do no better than just storing
    the known name–phone number pairs in a database. And furthermore, there can be
    no generalization to new instances; because we cannot infer a general rule, we
    cannot make a prediction for the phone number of a new name.


    The learning program sees examples one after the other, and the parameters are
    updated slightly at each example, so that the performance improves gradually.
    This is what learning is: as we learn a task, we get better at it.


    Second, the learning algorithm itself should be efficient, because generally we
    have a lot of data and we want learning to be as fast as possible, using computation
    and memory effectively. In many applications, the underlying characteristics of
    the problem may change in time; in such a case, previously collected data becomes
    obsolete and the need arises to continuously and efficiently update the trained
    model with new data.


    Third, once a learner has been built and we start using it for prediction, it
    should be efficient in terms of memory and computation as well. In certain applications,
    the efficiency of the final model may be as important as its predictive accuracy.
    For the case of a self-driving car for example, all the necessary computation
    for recognition, decision making, and action should be done fast enough so that
    the car can go at a reasonable speed.


