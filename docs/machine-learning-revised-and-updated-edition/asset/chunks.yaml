- raw: 'In a printed text, the appearance part may be due to the font; for example,
    characters in Times Roman font have serifs and strokes that are not all of the
    same width. The font is an aesthetic concern; in calligraphy, it is the aesthetic
    part that becomes especially prominent. Just like the choice of font in printed
    text, the handwriting style of the writer introduces variance in written text.
    But these added characteristics due to appearance should not be large enough to
    cause confusion about the identity, otherwise we say that the person has a bad
    or illegible handwriting. The appearance also depends on the material the writer
    is using (e.g., pen versus pencil) and also on the medium (e.g., paper versus
    marble slab).[1](#13811-0015.xhtml#en11)


    The printed or written character may be large or small, and this is generally
    handled at a preprocessing stage of normalization where the character image is
    converted to a fixed size—we know that the size does not affect the identity.
    This is called *invariance*. We want invariance to size (whether the text is 12pt
    or 18pt, the content is the same) or invariance to slant (as when the text is
    in italics) or invariance to the width of strokes (as in bold characters). But,
    for example, we do not want invariance to large rotations: *q* is a rotated *b*.


    In recognizing the class, we need to focus on the identity, and we should find
    attributes that represent the identity, and learn how to combine them to represent
    the character. We treat all the attributes that relate to the appearance, namely
    the writer, aesthetics, medium, and sensing, as irrelevant and learn to ignore
    them. But note that in a different task, those may be the important ones; for
    example, in authentication of handwriting or in signature recognition, it is the
    writer-specific attributes that become important and not the content.


    The generative model is *causal* in that it explains how the data is generated
    by hidden factors that cause it. Once we have such a model trained, we may want
    to use it for *diagnostics*, which implies going in the opposite direction, that
    is, from observation to cause. Medical domain is a good example here: the diseases
    are the causes and they are hidden; the symptoms are the observed attributes of
    the patient, such as the results of medical tests. Going from disease to symptom
    is the causal direction—that is what the disease does; going from symptom to disease
    is diagnostics—that is what the doctor does. In the general case, diagnostics
    is the inference of hidden factors from observed variables.


    Going from disease to symptom is the causal direction—that is what the disease
    does; going from symptom to disease is diagnostics—that is what the doctor does.


    A generative model can be represented as a graph composed of nodes that correspond
    to hidden and observed variables, and the arcs between nodes represent dependencies
    between them, such as causalities. Such *graphical models* are interesting in
    that they allow a visual representation of the problem, and statistical inference
    and estimation procedures can be mapped to well-known graph operations for which
    we already have efficient procedures in computer science (Koller and Friedman
    2009).


    In a graphical model, a causal link goes from a hidden factor to an observed symptom,
    while a diagnostics effectively inverts the direction of the link. We use conditional
    probability to model the dependency, and for example, when we talk about the conditional
    probability that a patient has a runny nose given that they have the flu, we go
    in the causal direction: the flu causes the runny nose (with a certain probability).


    If we have a patient and we know they have a runny nose, we need to calculate
    the conditional probability in the other direction—namely, the probability that
    they have the flu given that they have a runny nose (see figure 5). In probability,
    the two conditional probabilities are related because of the *Bayes’ rule*,[2](#13811-0015.xhtml#en12)
    and that is why graphical models are sometimes also called *Bayesian networks*.
    In a later section, we return to Bayesian estimation; we see that we can also
    include the model parameters in such networks and that this allows additional
    flexibility.


    ![](images/13811_005_fig_000.jpg)


    If we are reading a text, one factor we can make use of is the language information.
    A word is a sequence of characters, and we rarely write an arbitrary sequence
    of characters; we choose a word from the lexicon of the language. This has the
    advantage that even if we cannot recognize a character, we can still read t?e
    word. Such contextual dependencies may also occur at higher levels, between words
    and sentences as defined by the syntactic and semantic rules of the language.
    Machine learning algorithms help us learn such dependencies for natural language
    processing, as we discuss shortly.


    ## Face Recognition


    In the case of *face recognition*, the input is the image captured by a camera
    and the classes are the people to be recognized. The learning program should learn
    to match the face images to their identities. This problem is more difficult than
    optical character recognition because the input image is larger, a face is almost
    three-dimensional, and differences in pose and lighting cause significant changes
    in the image. Certain parts of the face may also be occluded; glasses may hide
    the eyes and eyebrows, and a beard may hide the chin.


    Just as in character recognition, we can think of two sets of factors that affect
    the face image: there are the features that define the identity, and there are
    features that have no effect on the identity but affect appearance, such as hairstyle;
    or expression (namely, neutral, happy, angry, and so forth). These appearance
    features may also be due to hidden factors that affect the captured face image,
    such as the source of illumination or the pose. If we are interested in the identity,
    we want to learn a face description that uses only the first type of features,
    learning to be invariant to features of the second type.


    However, we may be interested in the second type of features for other tasks.
    Recognizing facial expressions allows us to recognize emotions, as opposed to
    identity. For example, during a video monitoring a meeting, we may want to keep
    track of the mood of the participants. Likewise, in online education, it is important
    to understand whether the student is confused or gets frustrated, to better adjust
    the speed of presenting the material. In *affective computing*, which is a field
    that is rapidly becoming popular, the aim is to have computer systems that can
    recognize and take into account human affects, that is, the observed manifestations
    of emotions.


    If the aim is identification or authentication of people—for example, for security
    purposes—using the face image is only one of the possibilities. *Biometrics* is
    recognition or authentication of people using their physiological and/or behavioral
    characteristics. In addition to the face, examples of physiological characteristics
    are the fingerprint, iris, and palm; examples of behavioral characteristics include
    the dynamics of signature, voice, gait, and keystroke. For more accurate decisions,
    inputs from different modalities can be integrated. When there are many different
    input sources—as opposed to the usual identification procedures of photo, printed
    signature, or password—forgeries (spoofing) becomes more difficult and the system
    more accurate, hopefully without too much inconvenience to the users.


    ## Speech Recognition


    In *speech recognition*, the input is the acoustic signal captured by a microphone
    and the classes are the words that can be uttered. This time the association to
    be learned is between an acoustic signal and a word of some language.'
