- raw: '*Data analysis* software used to extract information from a *data warehouse*.
    OLAP is user-driven, in the sense that the user thinks of some hypotheses about
    the process and using OLAP tools checks whether the data supports those hypotheses.
    Machine learning is more data-driven in the sense that automatic data analysis
    can find dependencies not previously thought by users.


    Outlier detection


    An outlier, anomaly, or novelty is an instance that is very different from other
    instances in the sample. In certain applications such as fraud detection, we are
    interested in such outliers that are the exceptions to the general rules.


    Parallel distributed processing


    A computational paradigm where the task is divided into smaller concurrent tasks,
    each of which can be run on a different processor. By using more processors, the
    overall computation can be done much faster.


    Parametric methods


    Statistical methods that make strong assumptions about data. The advantage is
    that if the assumption holds, they are very efficient in terms of computation
    and data; the risk is that those assumptions do not always hold.


    Pattern recognition


    A pattern is a particular configuration of data; for example, ‘A’ is a composition
    of three strokes. Pattern recognition is the detection of such patterns.


    Perceptron


    A perceptron is a type of a *neural network* organized into layers where each
    layer receives connections from units in the previous layer and feeds its output
    to the units of the layer that follow.


    Population


    The set of all possible observable values for a random experiment, a *sample*
    is a random subset of the population.


    Posterior distribution


    The distribution of possible values that an unknown parameter can take *after*
    looking at the data. *Bayes’ rule* allows us to combine the *prior distribution*
    and the data to calculate the posterior distribution.


    Precision and recall


    Measures used to evaluate an *information retrieval* system. Precision is the
    ratio of the number of retrieved and relevant records to the number of retrieved
    records, and recall is the ratio of the number of retrieved and relevant records
    to the relevant records.


    Prior distribution


    The distribution of possible values that an unknown parameter can take *before*
    looking at the data. For example, before estimating the average weight of high
    school students, we may have a prior belief that it will be between 100 and 200
    pounds. Such information is especially useful if we have little data.


    Q\-learning


    A *reinforcement learning* method based on *temporal difference learning*, where
    the goodness values of actions in states are stored in a table (or function),
    frequently denoted by *Q*.


    Ranking


    This is a task somewhat similar to *regression*, but we care only whether the
    outputs are in the correct order. For example, for two movies *A* and *B*, if
    the user enjoyed *A* more than *B*, we want the score estimate to be higher for
    *A* than for *B*. There are no absolute score values as we have in regression,
    but only a constraint on their relative values.


    Recurrent connection


    A type of connection that involves a delay and acts as a short-term memory helping
    the network to remember its past. The advantage is that the network’s output depends
    not only on its current input but also on the inputs it has seen in previous time
    steps.


    Regression


    Estimating a numeric value for a given instance. For example, estimating the price
    of a used car given the attributes of the car is a regression problem.


    Reinforcement learning


    It is also known as learning with a critic. The agent takes a sequence of actions
    and receives a reward/penalty only at the very end, with no feedback during the
    intermediate actions. Using this limited information, the agent should learn to
    generate the actions to maximize the reward in later trials. For example, in chess,
    we do a set of moves, and at the very end, we win or lose the game; so we need
    to figure out what the actions that led us to this result were and correspondingly
    credit them.


    Sample


    A set of observed data. In statistics, we make a difference between a *population*
    and a sample. Let us say we want to do a study on obesity in high school students.
    The population is all the high school students, but we cannot possibly observe
    the weights of all. Instead, we choose a random subset of, for example, 1,000
    students and observe their weights. Those 1,000 values are our sample. We analyze
    the sample to make inferences about the population. Any value we calculate from
    the sample is a statistic. For example, the average of the weights of the 1,000
    students in the sample is a statistic and is an estimator for the mean of the
    population.


    Smart device


    A device that has its sensed data represented digitally and is doing some computation
    on this data. The device may be mobile and it may be online; that is, it may have
    the ability to exchange data with other smart devices, computers, or the *cloud*.


    Speech recognition


    Recognizing uttered sentences from acoustic information captured by a microphone.


    Supervised learning


    A type of machine learning where the model learns to generate the correct output
    for any input. The model is trained with data prepared by a supervisor who can
    provide the desired output for a given input. *Classification* and *regression*
    are examples of supervised learning.


    Temporal difference learning


    A set of methods for *reinforcement learning* where learning is done by backing
    up the goodness of the current action to the one that immediately precedes it.
    An example is the *Q-learning* algorithm.


    Transfer learning


    Using a model, completely or partially, trained on task *A* to be used in solving
    task *B*. When used in *neural networks*, this corresponds to using some of the
    layers of the network trained on *A* also in the network to be trained for *B*.
    This can be done if *A* and *B* are similar tasks, and is especially useful if
    we have more data for *A* than for *B*.


    Validation


    Testing the *generalization* performance of a trained model by testing it on data
    unseen during training. Typically in machine learning, we leave some of our data
    out as validation data, and after training we test it on this left out data. This
    validation accuracy is an estimator for how well the model is expected to perform
    when used later on in real life.


    Web scraping


    Software that automatically surfs the web and extracts information from web pages.


