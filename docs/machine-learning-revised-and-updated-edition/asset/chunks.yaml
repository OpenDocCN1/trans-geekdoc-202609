  trans: '


    该值 –0.3427 是里程对价格的 `weight`（权重）。不仅数值本身，权重的符号也包含信息。此处，数据分析表明这种关系是负相关的——随着里程增加，价格下降——但在另一个例子中，权重也可以是正的；例如，如果我们增加发动机功率这一属性，会发现价格随发动机增大而上升。也可能从数据中估算出的权重非常接近零；在这种情况下，我们可以得出结论：相应的属性不重要，并将其从模型中剔除。


    这些权重是模型的 `parameters`（参数），由数据计算得出。模型始终是固定的；可调整的是参数，而这一调整过程以更好地匹配数据，我们称之为学习。


    线性模型非常流行，因为它简单；参数很少，且计算加权和很容易。它易于理解和解释。此外，它在许多不同任务中表现出惊人的良好效果。


    无论我们如何改变其参数，每个模型只能用于学习一组问题，而 `model selection`（模型选择）是指在模型之间进行选择的任务。选择正确的模型比优化给定模型的参数更困难，应用相关的信息会有所帮助。


    例如，在估算汽车价格时，如果范围很大，线性模型可能不适用。经验表明，车龄的影响不是算术级数而是几何级数的：每增加一年并不会使价格减少相同的金额，而是典型车辆每年损失其价值的
    15%。1 在后续章节中，我们将讨论一些使用非线性模型的机器学习算法，这些模型更强大，因为它们可用于更广泛的应用。


    这里有必要指出机器学习与数据库中常规数据处理的区别。表 1 可能源自数据库，其中不仅包含里程和价格，很可能还包含关于汽车的各种其他信息，甚至可能包括车主信息。有了这样的数据库，可以进行查询，例如“里程为
    20,000 英里的汽车价格是多少？”，并得知为 32,000 美元。使用数据库时，我们只有信息且只关心那些特定的汽车；“里程为 25,000 英里的汽车价格是多少？”这样的查询没有意义，因为数据库中没有这辆车。


    在机器学习中，或统计学中，我们将表 1 中的数据视为从所有二手车 `population`（总体）中抽取的 `sample`（样本）。我们假设存在一个潜在过程，即汽车随行驶而贬值，但我们不知道该过程如何运作，希望从示例中提取它。我们不可能获取总体中所有可能的汽车并记录它们的里程和价格；我们能获取的只是一个小子集，即我们的样本。从统计学角度来看，我们并不特别关心这个特定样本，其中可能有错误，也可能只是另一个不同的样本；我们关心的是任何样本所来自的总体。学习的优势——即从特定样本推广到总体——在于我们现在可以用
    25,000 英里进行查询，这相当于在问“里程为 25,000 英里的 `typical`（典型）汽车价格会是多少？”，其中“典型”指所有里程为 25,000
    英里的二手车的平均值。


    ## Supervised Learning（监督学习）


    从一组输入值估算数值型输出值的任务，在统计学中称为 `regression`（回归）；对于线性模型，我们有线性回归。在机器学习中，回归是 `supervised
    learning`（监督学习）的一种类型。在这种学习类型中，对于每个示例，我们都有输入和期望输出。其名称源于这样一种假设：存在一位 `supervisor`（监督者），能为任何输入提供期望输出。当我们通过观察市场上当前销售的汽车来收集数据时，我们能够同时观察到汽车的属性及其价格。


    前面，我们使用了带有权重参数的线性模型。每个模型对应输入和输出之间某种特定的依赖假设。学习对应于调整参数，使模型在数据上做出最准确的预测。在一般情况下，学习意味着根据性能标准变得更好，而在回归中，性能取决于模型预测与训练数据中观测输出值的接近程度。这里的假设是训练数据足够大且多样，能充分覆盖底层任务的特征，因此在训练数据上表现准确的模型可被认为已经学会了该任务。


    文献中的不同机器学习算法，要么在于它们使用的模型不同，要么在于它们优化的性能标准不同，要么在于优化过程中调整参数的方式不同。


    此时，我们应记住，机器学习的目的很少是复制训练数据，而是对新情况进行正确预测。如果市场上只有特定数量的可能汽车，且我们知道所有汽车的价格，那么我们只需存储所有这些值并进行表查找即可；这将是
    `memorization`（记忆）。但通常（这也是学习有趣的原因），我们只看到所有可能实例的一个小子集，并希望从这些数据中 `generalize`（泛化）——即学习一个超越训练示例的通用模型，也能对训练期间未见过的输入做出良好预测。


    既然只见过所有可能汽车的一个小子集，我们希望能为训练集之外的汽车预测正确价格，即为那些在训练集中未给出正确输出的汽车预测价格。模型在训练集上训练后，对这种新实例预测正确输出的能力，称为模型和学习算法的
    `generalization ability`（泛化能力）。


    我们在此做出的基本假设（正是这一假设使学习成为可能）是：相似的汽车具有相似的价格，其中相似性通过我们选择使用的输入属性来度量。随着这些属性值缓慢变化——例如里程变化——价格也预期缓慢变化。输出关于输入具有平滑性，这使得泛化成为可能。没有这种规律性，我们就无法从特定案例推导出通用模型，因为那时没有依据相信存在一个适用于所有案例（无论在训练集内还是外）的通用模型。


    不仅对于估算二手车价格这一任务，对于从现实世界收集数据的许多任务——无论是商业应用、模式识别还是科学——我们都能看到这种平滑性。机器学习和预测之所以可能，是因为世界具有规律性。世界中的事物平滑变化。这是莱布尼茨的名言：“自然不做跳跃。”我们不是从
    A 点“传送”到 B 点，而必须经过一系列中间位置。物体在世界中占据连续的空间块。视野中附近的点属于同一物体，因此大多具有相同颜色的色调。声音也是如此，无论是歌唱还是语音，都平滑变化。不连续性对应边界，且很罕见。我们大多数感觉系统都利用这种平滑性；我们所谓的视觉错觉，如卡尼萨三角形（见图
    2），是由于我们感觉器官和大脑的平滑性假设造成的。2


    '
