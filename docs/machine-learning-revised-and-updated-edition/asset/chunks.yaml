- raw: 'For any state and action, we want to learn the expected cumulative reward
    starting from that state with that action. This is an *expected* value because
    it is an average over all sources of randomness in the rewards and the states
    to come. The expected cumulative rewards of two consecutive state-action pairs
    are related through the *Bellman equation*, and we use it to *back up* the rewards
    from later actions to earlier actions, as follows.


    In figure 18, we have a grid world. Let us consider the final move of the robot
    that leads to the goal; because we reach the goal, we receive a reward of, say,
    100 units. Now consider the state and action immediately before that. In that
    state we do an action, which, though it does not give us an immediate reward (because
    we will still be one step away from the goal), takes us to the state where with
    one more action we can get the full reward of 100. This means that that action
    in that state has a lot of value, but it is still one step away. So, to calculate
    the value, we discount the real reward, let us say by a factor of 0.9 (because
    the reward is in the future and the future is never certain), and we say that
    that particular state-action pair has an *internal reward* of 90.


    ![](images/13811_018_fig_000.jpg)


    Note that the real reward there is still zero, because we still have not reached
    the goal, but we internally reward ourselves for having arrived at a state that
    is only one step away from the goal. Similarly, the one before that action is
    discounted twice and gets an internal reward of 81, and we can continue assigning
    internal values to all the previous actions in that sequence. Of course, this
    is for only one trial episode. We need to do many trials where in each because
    of the uncertainties we follow a different path visiting different states and
    observing different rewards, and we average over all those internal reward estimates.
    This is called *temporal difference* (TD) learning; the internal reward estimate
    for each state-action pair is denoted by *Q*, and the algorithm that updates them
    is called *Q-learning*.


    In the beginning, we try out actions at random; as we learn more, we move from
    exploration to exploitation, from random choices to those influenced by our internal
    reward estimates.


    Note that only the final action gets us the real reward; all the values for the
    intermediate actions are simulated rewards. They are not the aim; they only help
    us to find the actions that eventually lead us to the real reward. Just like in
    a school, a student gets grades based on their performance in different courses,
    but those grades are only simulated rewards indicating how likely it is the student
    will get the real reward, which they will get only when they graduate and become
    a productive member of their community.


    In certain applications, the environment is *partially observable*, and the agent
    does not know the state exactly. It is equipped with sensors that return an observation,
    which it uses to estimate the state of the environment. Let us say we have a robot
    that navigates in a room. In the preceding grid world example, the robot knows
    its position exactly, but this may not always be the case. The robot may not know
    where it is or what else is in the room. The robot may have a camera, but an image
    does not tell the robot the environment’s state in full detail; it only gives
    some indication about the likely state. For example, the robot may only know that
    there is an obstacle to its left.


    In such a case, based on the observation, the agent predicts its state; or more
    accurately, it predicts the probability that it is in each state given the observation
    and then does the update for all probable states weighted by their probabilities.
    This additional uncertainty makes the task much more difficult and the problem
    harder to learn (Thrun, Burgard, and Fox 2005).


    For example, a self-driving car driving in an urban region knows its environment
    exactly by accessing its geographic information system data; in a rural region
    it has to rely more on its onboard sensors for navigation.


    ## Learning to Play Games


    One of the early applications of reinforcement learning is the *TD-Gammon* program
    that learns to play backgammon by playing against itself (Tesauro 1995). This
    program is superior to the previous *NeuroGammon* program also developed by Tesauro,
    which was trained in a supervised manner based on plays by experts. Backgammon
    is a complex task; it features an opponent and extra randomness due to the roll
    of dice. Using a relatively simple representation of the board, TD-Gammon trains
    a neural network that is a multilayer perceptron with one hidden layer by playing
    against a copy of itself.


    Previously we talked about calculating the value of an intermediate state by discounting
    the future reward; a *value network* is a regressor that takes the state as input,
    here the representation of the backgammon board, and is trained to estimate its
    value (the expected cumulative reward after that state). A *policy network* that
    we will see shortly is a classifier that takes the state as input and is trained
    to choose the best action—namely, the one that takes us to the next state with
    the maximum value (on the path that returns the maximum expected cumulative reward).


    Though reinforcement learning algorithms are slower than supervised learning algorithms,
    it is clear that they have a wider variety of application and have the potential
    to construct better learning machines. They do not need any supervision, and this
    may actually be better since there will not be any teacher bias. For example,
    Tesauro’s TD-Gammon program that learned by playing against itself in certain
    circumstances came up with moves that turned out to be superior to those made
    by the best players.


    A recent impressive work combines reinforcement learning with deep neural networks
    to play arcade games (Mnih et al. 2015). The *Deep Q-Network*, which is a policy
    network, takes directly the 84 × 84 image of the screen (these are arcade games
    from the 1980s when image resolution was low) and learns to play the game using
    only the image and the score information. The network has early convolutional
    layers for analyzing the image and then fully connected layers to synthesize the
    best joystick action. Training is end-to-end, from pixels to actions, using a
    form of *Q*\-learning that we discussed earlier.


    What is also interesting is that the same network with the same learning algorithm,
    network architecture, and hyperparameters can learn any of the 49 games, and on
    29 of these it reached or exceeded human performance.


    Very recently, the same group developed the AlphaGo system (Silver et al. 2016)
    that again combines deep convolutional networks with reinforcement learning, this
    time to play the game of Go. Go is much more difficult than backgammon or chess
    because the board is larger and there are more moves possible per position, which
    implies a much larger search space; Go was long believed to be beyond our current
    computing capabilities.


    In AlphaGo, the input is a set of specialized features that represent the 19 ×
    19 Go board, and the board is processed by convolutional layers as if it is an
    image. There is the policy network trained to select the best move and the value
    network trained to evaluate how close each state is to winning the game. The policy
    network is first trained with a very large database of expert games and then further
    improved through reinforcement learning by playing against itself. As we discussed
    in the preface, AlphaGo defeated the European Go champion, 5 games to 0, in 2015
    and defeated one of the greatest Go players in the world, 4 games to 1, in March
    2016.'
