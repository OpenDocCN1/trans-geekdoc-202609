- raw: 'The advantage of such a structure is that learning is end to end. We only
    specify the input to the encoder and the desired output at the very end of the
    decoder; it is enough to just provide a very large data set of input and output
    pairs, and any transformation needed in between is automatically learned by the
    many hidden layers of a deep network. Learning not only adjusts the parameters
    of the encoder and the decoder but also specifies the intermediate code between
    the two modules; this intermediate code is the representation of the input best
    suited to generate the corresponding output.


    There are many interesting applications of deep neural networks trained end to
    end, and they typically have this structure. There is the early module that analyzes
    the input and transforms it into an intermediate representation and the later
    module learns to synthesize the correct output from that intermediate representation.


    One example is the show-and-tell deep architecture that learns to generate captions
    for images (Vinyals et al. 2014). The encoder is a convolutional network that
    takes an image and analyzes it in its many levels to generate a code that summarizes
    the content of the image. The decoder is a recurrent network that generates the
    caption one word at a time from this code. The whole structure is trained end
    to end, from a large set of example pairs of images and manually provided captions.


    Another example is the deep neural network that learns to play Atari games (Mnih
    et al. 2015). The input is the game screen and the output is the correct joystick
    action. The network has early convolutional layers that analyzes the image to
    extract the best features for deciding on the right action and the later, fully
    connected layers generate the action based on those.


    It is also possible to use a network trained on one task to help solve another
    task, this is called *transfer learning*. Let us say we want to do face recognition,
    but our data set is relatively small. Let us assume that we already have a very
    deep convolutional network trained on some very large image data set. What we
    do is we take the first few layers of that larger network and copy them to act
    as early layers in our face recognition network. If we expect the basic features
    necessary for the large problem to be also useful for face recognition, it makes
    sense to do this. We only train the later layers of the face recognition network,
    which means that there will be fewer parameters, and we can train those using
    a smaller data set.


    ## Generative Adversarial Networks


    The *generative adversarial network* (GAN) is actually composed of two networks,
    a generator *G* and a discriminator *D* (Goodfellow et al. 2014). The aim is to
    learn a generator; *D* is only there to train *G*. Both *G* and *D* are typically
    deep neural networks, but GAN is a general strategy for training that is independent
    of how the two learners are implemented.


    The task of a generator is different from that of a regressor or a classifier.
    Let us say we have a training set of faces. What we would like to do is to learn
    the structure of faces from this data so well that we can generate a new face
    when we want. The output will be an image that looks like a face, it will have
    hair on top, eyes and nose suitably placed with respect to each other, the face
    should be symmetric, and so on, and all those constraints are to be learned from
    the data. Again, we want generalization, we do not want to generate a face already
    in the training set but we want the new image to be the face of a person outside
    of the training set; it will be the face of a person who does not even exist.
    Or let us say we have a training set of Bach chorales and we want to train a generator
    from those so that it can spit out a new chorale when we want.


    In GAN, the generator takes a random input and transforms it into an instance,
    for example, a face image or a chorale (see figure 13). Different random inputs
    generate different instances. The input *z* has some predefined distribution and
    *G* maps each *z* to a candidate *x*. What *G* does is that it takes the distribution
    of *z* as input and stretches, translates, rotates, etc. it in its many successive
    layers such that its output looks as much as possible to the distribution of *x*.


    Those instances that are generated by *G* are labelled as “fake.” We also have
    a training set of actual faces/chorales and they are labelled as “true.” *D* is
    a two-class classifier that is trained to separate fakes from true instances.
    *G* is like a forger that paints fake Rembrandts and *D* is like an art expert
    who is good at spotting fake Rembrandts.


    *G* is trained to generate fakes that will be classified as true by *D*. The two
    are trained together; as *D* gets better, *G* will use that information to understand
    what *D* classifies as true and will learn to generate fakes similar to those.
    *D* will in turn learn to tell these apart which in turn will force *G* to generate
    even better fakes, and so on.


    ![](images/13811_013_fig_000.jpg)


    GANs are one of the most popular research topics in machine learning these days,
    with very impressive results.[1](#13811-0015.xhtml#en16) One major problem with
    GAN is that because there are two networks, training is more difficult; another
    problem is that the goodness of a generator is still largely evaluated manually,
    so GAN currently is mostly used in image generation tasks where such evaluation
    is done manually.


    Until now, we have talked about supervised learning where there is an input and
    an output, and the aim is to learn the mapping from the input to the output. In
    the next chapter, we will discuss unsupervised learning where there is no explicit
    output, and the aim is to learn the regularity in the input space, to learn what
    type of things happen frequently.


    # 5


    # Learning Clusters and Recommendations


    ## Finding Groups in Data


    Previously we covered supervised learning where there is an input and an output—for
    example, car attributes and price—and the aim is to learn a mapping from the input
    to the output. A supervisor provides the correct values, and the parameters of
    a model are updated so that its output gets as close as possible to these desired
    outputs.


    We are now going to discuss *unsupervised learning*, where there is no predefined
    output, and hence no such supervisor; we have only the input data. The aim in
    unsupervised learning is to find the regularities in the input, to see what normally
    happens. There is a structure to the input space such that certain patterns occur
    more often than others, and we want to see what generally happens and what does
    not.


    One method for unsupervised learning is *clustering*, where the aim is to find
    clusters or groupings of input; in statistics, these are called *mixture models*.


    In the case of a company, the customer data contains demographic information,
    such as age, gender, zip code, and so on, as well as past transactions with the
    company. The company may want to see the distribution of the profile of its customers,
    to see what type of customers frequently occur. In such a case, a clustering model
    allocates customers similar in their attributes to the same group, providing the
    company with natural groupings of its customers; this is called *customer segmentation*
    (see figure 14). Once such groups are found, the company may decide strategies,
    for example, services and products, specific to different groups; this is known
    as *customer relationship management* (CRM).


    Such a grouping also allows the company to identify those who are outliers, namely,
    those who are different from other customers, which may imply a niche in the market
    that can be further exploited by the company, or those customers who require further
    investigation, for example, churning customers.'
