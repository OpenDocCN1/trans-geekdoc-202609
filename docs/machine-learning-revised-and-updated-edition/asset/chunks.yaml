    normal behavior. Outliers may also be recording errors (e.g., due to faulty sensors)
    that should be detected and discarded to get reliable statistics. An outlier may
    also be a novel, previously unseen but valid case, which is where the related
    term, `novelty detection`, comes into play. For example, it may be a new type
    of profitable customer, indicating a new niche in the market waiting to be exploited
    by the company.


    ## Dimensionality Reduction


    In any application, observed data attributes that we believe contain information
    are taken as inputs and are used for decision making. However, it may be the case
    that some of these features actually are not informative at all, and they can
    be discarded; for example, it may turn out that the color of a used car does not
    have a significant effect on its price. Or, it may be the case that two different
    attributes are correlated and say basically the same thing (e.g., the production
    year and mileage of a used car are highly correlated), so keeping one may be enough.


    We are interested in `dimensionality reduction` in a separate preprocessing step
    for a number of reasons:


    First, in most learning algorithms, both the complexity of the model and the training
    algorithm depend on the number of input attributes. Here, complexity is of two
    types: the time complexity, which is how much calculation we do, and the space
    complexity, which is how much memory we need. Decreasing the number of inputs
    always decreases both, but how much they decrease depends on the particular model
    and the learning algorithm.


    Second, when an input is deemed unnecessary, we save the cost of measuring it.
    For example, in medical diagnosis, if it turns out that a certain test is not
    needed, we do not do it, thereby eliminating both the monetary cost and the patient
    discomfort.


    Third, simpler models are more robust on small data sets; that is, they can be
    trained with fewer data; or when trained with the same amount of data, they have
    smaller variance in their response, which indicates lower uncertainty.


    Fourth, when data can be explained with fewer features, we have a simpler model
    that is easier to interpret.


    Fifth, when data can be represented in few (e.g., two) dimensions, it can be plotted
    and analyzed visually, for structure and outliers, which again helps facilitate
    knowledge extraction from data. A plot is worth a thousand dots, and if we can
    find a good way to display the data, our visual cortex can do the rest, without
    any need for model fitting calculation.


    There are basically two ways to achieve dimensionality reduction: feature selection
    and feature extraction. In `feature selection`, we keep the important features
    and discard the unimportant ones. It is basically a process of subset selection
    where we want to choose the smallest subset of the set of input attributes leading
    to maximum performance. The most widely used method for feature selection is the
    `wrapper` approach, where we iteratively add features until there is no further
    improvement. The feature selector is “wrapped around” the basic classifier or
    regressor that is trained and tested with each subset.


    In `feature extraction`, we define new features that are calculated from the original
    features. These newly calculated features are fewer in number but still preserve
    the information in the original features. Those few synthesized features explain
    the data better than any of the original attributes, and sometimes they may be
    interpreted as hidden or abstract concepts.


    In projection methods, each new feature is a linear combination of the original
    features; one such method is `principal component analysis` where we find new
    features that preserve the maximum amount of variance of the data. If the variance
    is large, the data has large spread making the differences between the instances
    most apparent, whereas if the variance is small, we lose the differences between
    data instances. The other method, `linear discriminant analysis` is a form of
    supervised feature extraction where the aim is to find new features that maximize
    the separation between classes.


    Whether one should use feature selection or extraction depends on the application
    and the granularity of the features. If we are doing credit scoring and have features
    such as customer age, income, profession, and so on, feature selection makes sense.
    For each feature, we can say whether it is informative or not by itself. But a
    feature projection does not make sense: what does a linear combination (weighted
    sum) of age, income, and profession mean? On the other hand, if we are doing face
    recognition and the inputs are pixels, feature selection does not make sense—an
    individual pixel by itself does not carry discriminative information. It makes
    more sense to look at particular `combinations` of pixels in defining a face,
    as is done by feature extraction; for example, a region in image may define a
    particular type of eye or nose.


    Nonlinear dimensionality reduction methods go beyond a linear combination and
    can find better features; this is one of the hottest topics in machine learning.
    The ideal feature set best represents the (classification or regression) information
    in the data set using the fewest numbers, and it is a process of encoding. It
    may also be considered as a process of abstraction because these new features
    can correspond to higher-level features representing the data in a more concise
    manner. In chapter 4, we will discuss autoencoder networks and deep learning where
    this type of nonlinear feature extraction is learned in artificial neural networks.


    ## Decision Trees


    Previously we discussed if-then rules and one way to learn such rules is by decision
    trees. The `decision tree` is one of the oldest methods in machine learning and
    though simple in both training and prediction, it is accurate in many domains.
    Trees use the famous “divide and conquer” strategy popular since Caesar where
    we divide a complex task—for example, governing Gaul—into simpler, regional tasks.
    Trees are used in computer science frequently for the same reason, namely to decrease
    complexity, in all sorts of applications.


    Earlier we covered nonparametric estimation where, as you will remember, the main
    idea is to find a subset of the neighboring training examples that are most similar
    to the new query. In `k`-nearest-neighbor algorithms, we do this by storing all
    the training data in memory, calculating one by one the similarity between the
    new test query and all the training instances, and choosing the `k` most similar
    ones. This is rather a complex calculation when the training data is large, and
    it may be infeasible when the data is big.


    The decision tree finds the most similar training instances by a sequence of tests
    on different input attributes. The tree is composed of decision nodes and leaves;
    starting from the root, each decision node applies a splitting test to the input
    and depending on the outcome, we take one of the branches. When we get to a leaf,
    the search stops and we understand that we have found the most similar training
    instances, and we interpolate from those (see figure 6).


