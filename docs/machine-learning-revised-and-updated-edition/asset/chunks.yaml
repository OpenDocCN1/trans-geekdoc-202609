- raw: 'For many applications—from vision to speech, from translation to robotics—we
    were not able to devise very good algorithms despite decades of research beginning
    in the 1950s. But for all these tasks, it is easy to collect data, and now the
    idea is to learn the algorithms for these automatically from data, replacing programmers
    with learning programs. This is the niche of machine learning, and it is not only
    that the data has gotten bigger in these last two decades, but also that the theory
    of machine learning to process that data to turn it into knowledge has advanced
    significantly.


    Once, if you were smart, you invented a new algorithm; now, if you are smart,
    you find a new source of data, possibly first by writing the app to collect it.
    In the past, computer science advanced one algorithm at a time; now information
    technology advances one app at a time.


    Today, in different types of business, from retail and finance to manufacturing,
    as our systems are computerized, more data is continuously generated and collected.
    This is also true in various fields of science, from astronomy to biology. In
    our everyday lives too, as digital technology increasingly infiltrates our daily
    existence, as our digital footprint deepens, not only as consumers and users but
    also through social media, an increasingly larger part of our lives is recorded
    and becomes data. Whatever its source—business, scientific, or personal—data that
    just lies dormant passively is not of any use, and smart people have been finding
    new ways to make use of that data and turn it into a useful product or service.
    In this transformation, machine learning is playing a more significant role.


    Our belief is that behind all this seemingly complex and voluminous data, there
    lies a simple explanation. That although the data is big, it can be explained
    in terms of a relatively simple model with a small number of hidden factors and
    their interaction. Think about millions of customers who buy thousands of products
    online or from their local supermarket every day. This implies a very large database
    of transactions; but what saves us and works to our advantage is that there is
    a pattern to this data. People do not shop at random. A person throwing a party
    buys a certain subset of products, and a person who has a baby at home buys a
    different subset; there are hidden factors that explain customer behavior. It
    is this inference of a hidden model—namely, the underlying factors and their interaction—from
    the observed data that is at the core of machine learning.


    Machine learning is not just the commercial application of methods to extract
    information from data; learning is also a requisite of intelligence. An intelligent
    system should be able to adapt to its environment; it should learn not to repeat
    its mistakes but to repeat its successes. Previously, researchers used to believe
    that for artificial intelligence to become reality, we needed a new paradigm,
    a new type of thinking, a new model of computation, or a whole new set of algorithms.
    Taking into account the recent successes in machine learning in various domains,
    we can now claim that what we need is not a new set of specific algorithms but
    a lot of example data and sufficient computing power to run the learning methods
    on that much data, bootstrapping the necessary algorithms from data.


    It appears that tasks such as machine translation and planning can be solved with
    learning algorithms that are relatively simple but trained on large amounts of
    example data. Recent successes with “deep learning” (e.g., the AlphaGo program)
    support this claim. Intelligence seems not to originate from some outlandish formula,
    but rather from the patient, almost brute force use of simple, straightforward
    algorithms.


    As technology develops and we get faster computers and more data, learning algorithms
    can be expected to generate a slightly higher level of intelligence, which will
    find use in a new set of slightly smarter devices and software. It will not be
    surprising if this type of learned intelligence reaches the level of human intelligence
    some time before this century is over.


    I believe that this is the perspective from which we can assess the meaning of
    Lee Se-dol’s retirement. Some people may find him unnecessarily touchy; athletes
    did not stop running marathons when cars were invented. Playing games such as
    chess or Go will always be a test of a person’s ability to focus and strategize.
    People are not going to stop playing these games just because a computer can beat
    them; on the contrary, game-playing computer programs have the potential to teach
    them how to play those games better.


    We can see Lee Se-dol’s resignation as another step toward humanity no longer
    being either the standard by which intelligence is measured or the maximum intelligence
    that can be attained. What we have been encountering in the last half century
    as digital technology has advanced one milestone at a time (and I believe AlphaGo
    is one such milestone) is similar to the Copernican revolution where the earth
    was demoted from being the center of the heavens to simply one of the planets
    in the solar system.


    We are systematically noticing that what we have with our brains is only one way
    of being intelligent, and not necessarily the best one at that. It is amusing
    that in 2016, when Lee Se-dol lost to AlphaGo, this made headlines all around
    the world because this was the first time a computer program defeated the best
    human player; when he retired in 2019, the news article referred to him as “the
    only human to defeat the AI Go player AlphaGo.”


    * * *


    The aim of this book is to give the reader an overall idea about what machine
    learning is, the basics of some important learning algorithms, and a set of example
    applications. The book is intended for a general readership, and only the essentials
    of the learning methods are discussed without any mathematical or programming
    details. The book does not cover any of the machine learning applications in much
    detail either; a number of examples are discussed just enough to give the fundamentals
    without going into the particulars.


    For more information on machine learning algorithms and applications, the reader
    can refer to my textbook on the topic, on which this book is based: Ethem Alpaydın,
    *Introduction to Machine Learning*, 4th ed. (Cambridge, MA: MIT Press, 2020).


    The content is organized as follows:


    We start by briefly discussing the evolution of computer science and its applications
    in chapter 1. This is necessary to place in context the current state of affairs
    that created the interest in machine learning—namely, how the digital technology
    advanced from number-crunching mainframes to desktop personal computers and later
    on to smart devices that are online and mobile. This chapter shows how we have
    ended up with so much data.


    Chapter 2 introduces the basics of machine learning and discusses how it relates
    to model fitting and statistics on some simple applications.


    Most machine learning algorithms are supervised, and in chapter 3, we discuss
    how such algorithms are used for pattern recognition, such as faces and speech.


    Chapter 4 covers artificial neural networks inspired from the human brain, how
    they can learn, and how “deep,” multilayered networks can learn hierarchies at
    different levels of abstractions.


    Another type of machine learning is unsupervised, where the aim is to learn associations
    between instances. In chapter 5, we consider customer segmentation and learning
    recommendations as popular applications.


    Chapter 6 is on reinforcement learning where an autonomous agent—for example,
    a self-driving car—learns to take actions in an environment to maximize reward
    and minimize penalty.'
