  trans: '


    一些神经元是感觉神经元，它们从环境中获取数值，例如来自感知到的图像，这类似于视网膜中的感受器。然后这些数值被传递给其他神经元，随着激活在网络中传播，这些神经元在连续的层中对它们进行进一步处理。最后，有输出神经元做出最终决策，并通过执行器执行动作——例如，移动手臂、发出一个词等。


    ![](img/13811_007_fig_000.jpg)


    ## 神经网络学习算法


    在神经网络中，学习算法调整神经元之间的连接权重。一种早期算法由 Hebb (1949) 提出，称为 `Hebbian learning`（赫布学习）规则：如果两个神经元同时活跃，它们之间的权重就会得到加强——突触权重实际上学习了这两个神经元之间的相关性。


    假设我们有一个神经元检查视野中是否有圆，另一个神经元检查视野中是否有数字六“6”。每当我们看到一个六——或者在学习阅读时被告知那是一个六——我们也会看到一个圆，因此它们之间的连接得到加强；但圆神经元与数字七“7”神经元之间的连接不会得到加强，因为当我们看到其中一个时，不会同时看到另一个。所以下次我们在视野中看到一个圆时，这会增加数字六神经元的激活值，但会降低数字七神经元的激活值，使“六”比“七”成为更可能的假设。


    在某些应用中，网络中的某些神经元被明确指定为输入单元，某些被指定为输出单元。我们有一个训练集，包含输入样本及其监督者指定的相应正确输出值——例如，在估算二手车价格时，我们将汽车属性作为输入，价格作为输出。在这种监督学习情况下，我们将输入单元钳制为训练集中的输入值，让活动根据权重和网络结构在网络中传播，然后查看输出单元计算出的值。


    我们定义一个 `error function`（误差函数），为网络对某输入估计的实际输出与训练集中监督者指定的要求值之间差值的总和；在神经网络训练中，针对每个训练样例，我们略微更新连接权重，以降低该实例的误差。降低误差意味着下次遇到相同或相似输入时，估计输出将略微更接近其正确值。`Theoretically
    speaking`（理论上讲），这无非就是我们在第 2 章讨论的传统回归，只不过这里的模型是作为神经元和连接组成的神经网络被 `implemented`（实现）的。


    这是神经网络学习算法的一个重要特征，即它们可以 `online`（在线）学习，当我们逐个看到训练实例时，通过对连接权重进行小幅更新来学习。在 `batch`（批量）学习中，我们拥有整个数据集，并一次性使用全部数据进行训练。一种当今流行的方法涉及
    `mini batches`（小批量），即在每次更新中使用少量实例集合。


    目前随着数据集变得越来越大，在线学习很有吸引力，因为它不需要收集和存储所有数据；我们可以在流式数据场景中，一次仅使用一个或少数几个样例进行学习。此外，如果数据的底层特征缓慢变化——通常确实如此——在线学习可以无缝适应，无需停止、收集新数据并重新训练。


    ## 感知机能做什么和不能做什么


    尽管感知机在许多任务中取得了成功——请记住线性模型在许多领域都表现得相当好——但有一些任务无法由感知机实现 (Minsky and Papert 1969)。其中最著名的是异或
    (XOR) 问题：


    在逻辑中，有两种 OR（或），即包含性或和异或。在日常语言中，当我们说“去机场，我将坐公交车或火车”时，我们指的是异或。有两种情况，同一时间只能有一种为真。为了表示包含性或，我们使用“和/或”结构，如“这个秋天，我将选修数学
    101 和/或物理 101”。换句话说，我将选修数学 101、物理 101，或两者都选。


    虽然包含性或可以由感知机实现，但异或不能。原因不难理解：如果你有两种情况，例如公交车和火车，并且你希望任意一种为真就足够，你需要给它们每一个一个大于阈值的权重，这样当任意一个为真时神经元就会激发。但当两者都为真时，总激活值将高出两倍，无法低于阈值。


    尽管当时已知像异或这样的任务 `can`（可以）使用多层感知机来实现，但不知道如何训练这种网络；感知机无法实现像异或这样简单的任务——而这可以用少量（数字）逻辑门轻松实现——这一事实导致了失望，并使神经网络研究在很长一段时间内被放弃，世界上仅有少数地方例外。直到
    20 世纪 80 年代中期，`backpropagation`（反向传播）算法被提出用于训练多层感知机——这一想法自 20 世纪 60 年代和 70 年代以来就已存在，但长期未被重视——才使得人们对它的兴趣复苏
    (Rumelhart, Hinton, and Williams 1986)。


    ## 用于学习时间的循环网络


    并非所有人工神经网络都是前馈的；也存在 `recurrent networks`（循环网络），除了层与层之间的连接外，神经元还与同一层中的神经元（包括自身），甚至与前面层中的神经元相连。每次激活计算都会导致一定的延迟，因此
    `recurrent connections`（循环连接）充当了上下文信息的 `short-term memory`（短时记忆），让网络能够记住过去。


    假设输入神经元 `A` 连接到神经元 `X`，并且 `X` 到自身也有一个循环连接（见图 8）。该连接的效果是：在时间 `t`，`X` 的值将取决于时间 `t`
    的输入 `A`，并且由于 `X` 到自身的循环连接，也将取决于时间 `t` – 1 时 `X` 的值。在下一个时间步，时间 `t` + 1 时的 `X` 将取决于时间
    `t` + 1 时的输入 `A`，以及时间 `t` 时的 `X`（先前使用时间 `t` 时的 `A` 和时间 `t` – 1 时的 `X` 计算得出），依此类推。这样，`X`
    在任意时刻的值将取决于直到那时为止看到的所有输入。


    如果我们将网络在某一时刻所有神经元值的集合定义为网络的状态，循环连接允许当前状态不仅取决于当前输入，还取决于由先前输入计算得出的先前时间步的网络状态。因此，例如，如果我们逐个词地看到一个句子，循环允许句子中之前的单词以浓缩和抽象的形式保留在这一短时记忆中，从而在处理当前单词时被考虑在内。网络的架构和循环连接的设置方式，决定了过去在多大程度上、以何种方式影响当前输出。


    ![](img/13811_008_fig_000.jpg)


    循环神经网络被用于许多时间维度很重要的任务，如语音或语言处理，我们希望识别的是序列。在将文本从一种语言翻译成另一种语言时，不仅看到的输入，而且生成的输出也是一个序列。


    ![](img/13811_009_fig_000.jpg)


