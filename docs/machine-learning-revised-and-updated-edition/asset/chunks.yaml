- raw: 'What makes AlphaGo impressive is also the high quality of engineering that
    went into its implementation, for example, in the way computation is distributed
    over parallel processing units. AlphaGo has played, and learned from, many more
    games than any human player can play in a lifetime, and because it learns by playing
    against a copy of itself, it is playing against a better and better opponent,
    all the time forcing it to devise cleverer and cleverer strategies to win.


    A recent version named AlphaGo Zero (Silver et al. 2017) is trained with less
    human help. The input is just the raw board without any specialized input features,
    and there is no initial supervised training with games of expert human players.
    Another difference is that the policy and value networks are merged into one but
    deeper network. AlphaGo Zero defeats AlphaGo and is now considered to be the best
    Go player, human or machine. Recently, the approach was generalized into a single
    AlphaZero algorithm that can learn to play not only Go but also chess and shogi
    (Japanese chess) (Silver et al. 2018).


    What was helpful in these approaches is that both the arcade game screen and the
    Go board have a two-dimensional structure that can be analyzed by a convolutional
    neural network for local features at different levels. The success of DQN and
    AlphaGo lies in the way that type of local feature extraction is seamlessly coupled
    with temporal difference learning using a deep neural network trained end to end.


    Reinforcement learning is also applied to card games. *DeepStack* learns to play
    a two-player variant of poker, named heads-up no-limit Texas hold’em. Unlike backgammon
    or Go where both parties have full information about the environment (i.e., the
    board), in poker, in addition to randomness due to draws from a deck, the cards
    of the opponent are hidden. In this imperfect-information setting, a player needs
    to make inferences about the opponent’s state from their previously observed actions
    and act accordingly, which allow complicated strategies such as bluffing. DeepStack
    uses a deep neural network and in a study involving 44,000 hands of poker, defeated
    professional poker players (Moravcik et al. 2017).


    *Pluribus* learned how to play the six-player variant (where there is not one
    but five opponents) by playing against five copies of itself, and when playing
    against five professional human players or with five copies of Pluribus playing
    against one human, it performed significantly better than humans over the course
    of 10,000 hands of poker (Brown and Sandholm 2019).


    Another significant milestone is *AlphaStar* that learns to play StarCraft, which
    is a real-time strategy game that involve thousands of decisions and imperfect
    information. AlphaStar was rated at Grandmaster level and was above 99.8 percent
    of officially ranked human players (Vinyals et al. 2019).


    ## Reinforcement Learning in Real Life


    An important question nowadays is how we can move from games and use deep reinforcement
    learning in real-world applications. Games are simplified simulations of real
    life: its rules for playing, winning, and losing are well defined; when there
    is randomness (e.g., dice in backgammon), it should be fair to both parties. What
    also makes games a good testbed for learning is that it is possible to simulate
    games very fast on a computer and hence collect large amounts of data very quickly.


    Real life, in contrast, has all sorts of ambiguities with different sources of
    uncertainties and sensor noise; actions take time and may be imperfect; losses
    incurred after bad actions imply monetary costs and may even endanger human safety.
    In simulating a game, you can try any random action to see what it gets you (and
    actually the proofs of convergence of the temporal difference algorithms require
    this), but you cannot do this in real life.


    Reinforcement learning is ideally suited to sequential decision-making tasks where
    we need to generate a sequence of decisions and where each decision affects later
    decisions. A decision by itself is not good or bad, so we cannot always use supervised
    learning. But the goodness of a decision depends on all the decisions before and
    after, so it’s the whole sequence of decisions that’s being evaluated at the end.
    There may also be multiple decision-making agents whose actions influence each
    other’s behavior.


    There are many scenarios that fit this description (Li 2019). In recommender systems,
    we need to generate a set of recommendations to each customer; in healthcare,
    we need to generate the correct sequence of treatment decisions; in economics
    and finance, we need to generate a good sequence of buy/sell decisions, and so
    on.


    One interesting work is the *neural architecture search* algorithm where designing
    the best neural network structure is converted to a sequence of decisions on hyperparameters
    that define the structure and the connectivity, and the reward is the accuracy
    of this constructed network. So there is the controller neural network that is
    trained with reinforcement learning, and it learns how to construct the child
    network one hyperparameter at a time (Zoph and Le 2016).


    Another interesting application is regulating the temperature and airflow inside
    a large-scale data center. The air temperature is regulated through air-water
    heat exchange, and the controls that can be manipulated are the fan speed (controlling
    air flow) and the valve opening (for letting cold water in and expelling warm
    water). It has been demonstrated that a simple model with little prior knowledge
    trained using reinforcement learning by a few hours of exploration suffices for
    the task and is at the same time cost effective (Lazic et al. 2018).


    Reinforcement learning is ideally suited to sequential decision-making tasks where
    we need to generate a sequence of decisions and each decision affects later decisions.


    Robotics is an area where reinforcement learning is appropriate because the completion
    of many robotics tasks require the generation of a sequence of correct actions.
    Previously we discussed a robot looking for the goal location in a maze, which
    is a particular case of navigation, where a robot, for example, a self-driving
    car, needs to find the path from point *A* to point *B* subject to constraints
    such as obstacles, while optimizing a criterion such as time. A multi-legged robot
    needs to move its legs in the correct order so that it can advance without falling.


    One interesting area where robotics meet machine learning is *imitation learning*.
    Learning a task, if there are many possible actions and if long sequences are
    needed, requires a lot of exploration and hence can be slow. A blind exploration
    can also be dangerous because some actions can be harmful to the robot or its
    environment, so one possibility is to train the robot in a simulated environment,
    at least in early stages. Or, if we have a person who already knows how to do
    the task, the robot can learn by imitation. For example, we can have a robot arm
    learning to manipulate objects in its environment (e.g., learning to put one object
    on top of another) by watching and imitating a person.


    In *behavioral cloning*, the actions taken by the human are recorded step-by-step
    and taught to the robot; this corresponds to transforming the whole task into
    a sequence of supervised learning tasks where for each intermediate state, the
    human action defines the required output. For example, a large data set can be
    collected by having expert human drivers drive under a wide variety of road, traffic,
    and weather conditions while recording what actions they take in which situation.
    Such a data set can then be used to train a driving program.'
