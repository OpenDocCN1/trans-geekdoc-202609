- raw: 'Just as we can consider each character image to be composed of basic primitives
    like strokes of different orientations, a word is made up of *phonemes*, which
    are the basic speech sounds. In the case of speech, the input is *temporal*; words
    are uttered in time as a *sequence* of these phonemes, and some words are longer
    than others.


    Different people, because of differences in age, gender, or accent, pronounce
    the same word differently, and again, we may consider each word sound to be composed
    of two sets of factors, those that relate to the word and those that relate to
    the speaker. Speech recognition uses the first type of features, whereas speaker
    authentication uses the second. Incidentally, this second type of features (those
    relating to the speaker) is not easy to recognize or to artificially generate—that
    is why the output of speech synthesizers still sounds “robotic.”[3](#13811-0015.xhtml#en13)


    Just as in biometrics, researchers here also rely on the idea of combining multiple
    sources. For example, to recognize speech, in addition to the acoustic information,
    we can also use the video image of the speaker’s lips and the shape of the mouth
    as they speak the words.


    ## Natural Language Processing and Translation


    In speech recognition, as in optical character recognition, the integration of
    a *language model* taking contextual information into account helps significantly.
    Decades of research on programmed rules in computational linguistics have revealed
    that the best way to come up with a language model (defining the lexical, syntactic,
    and semantic rules of the language) is by learning it from some large corpus of
    example data. The applications of machine learning to *natural language processing*
    are constantly increasing; see Hirschberg and Manning 2015 for a recent survey,
    or Eisenstein 2019 for a textbook on the topic.


    One of the easier applications is *spam filtering*, where spam generators on one
    side and filters on the other side keep finding more and more ingenious ways to
    outdo each other. This is a classification problem with two classes, spam and
    legitimate emails. A similar application is *document categorization* where we
    want to assign text documents to one of several categories, such as arts, culture,
    politics, and so on.


    A face is an image and a spoken sentence is an acoustic signal, but what is in
    a text? A text is a sequence of characters, but characters are defined by an alphabet
    and the relationship between a language and the alphabet is not straightforward.
    The human language is a very complex form of information representation with its
    lexical, syntactic, and semantic rules at different levels, together with its
    subtleties such as humor and sarcasm, not to mention the fact that a sentence
    almost never stands or should be interpreted alone, but is part of some dialogue
    or general context.


    The easiest method for representing a text is the *bag of words* representation
    where we predefine a large vocabulary of words and then we represent each document
    by using a list of the words that appear anywhere in the document. That is, of
    the words we have chosen, we note which ones appear in the document and which
    ones do not. We lose the position of the words in the text, which may be good
    or bad depending on the application. In choosing a vocabulary, we choose words
    that are indicative of the task; for example, in spam filtering, words such as
    “opportunity” and “offer” are discriminatory. There is a preprocessing step where
    suffixes (e.g., “-ing,” “-ed”) are removed, and where noninformative words (e.g.,
    “the,” “of”) are ignored.


    Recently, analyzing messages on social media has become an important application
    area of machine learning. Analyzing posts to extract *trending topics* is one:
    this implies a certain novel combination of words that has suddenly started to
    appear a lot. Another task is *sentiment analysis*, that is, determining whether
    a customer is happy or not with a product (e.g., a politician). For this, one
    can define a vocabulary containing words indicative of the two classes—happy versus
    not happy—using the bag of words representation and learn how they affect the
    class descriptions.


    Perhaps the most impressive application of machine learning is *machine translation*.
    After decades of research on hand-coded translation rules, it has become apparent
    that the most promising approach is to provide a very large sample of pairs of
    texts in both languages and to have a learning program automatically figure out
    the rules to map one to the other. In bilingual countries such as Canada, and
    in the European Union with its many official languages, it is relatively easy
    to find the same text carefully translated in two or more languages. Such data
    is used by machine learning approaches to translation.


    In chapter 4, we will discuss *deep learning*, which shows a lot of promise for
    this task, in automatically learning the different layers of abstraction that
    are necessary for processing natural language.


    ## Combining Multiple Models


    In any application, we can use any one of various learning algorithms and instead
    of trying to choose the single best one, a better approach may be to use them
    all and combine their predictions. We saw before that each algorithm comes with
    a set of assumptions, which we called its inductive bias, and each one may hold
    true on a different subset of the data. So we do not want to “put all our eggs
    in the same basket” but use them all.


    For best accuracy, the different models we combine should be good by themselves
    and at the same time diverse to best complement each other. This is just like
    in real life where the best committee is composed of people having different areas
    of expertise; it makes no sense to consult multiple people if they all have very
    similar educations or backgrounds.[4](#13811-0015.xhtml#en14)


    One way to get diversity is by having models look at different sources of information.
    We already saw this in biometrics where the different models take different characteristics—for
    example, face, fingerprints, and so on—as input, and in speech recognition where
    in addition to the acoustic speech signal we also keep track of the speaker’s
    lip.


    Today, most of our data is multimedia, and *multi-view* models can be used in
    a variety of contexts where we have different sensors providing different but
    complementary information. In image retrieval, in addition to the image itself,
    we may also have a text description or a set of tag words. Using both sources
    together leads to better retrieval performance. Our smart devices, such as smart
    watches and smartphones, are equipped with sensors, and their readings can be
    combined for the purpose of, for example, *activity recognition*.


    ## Outlier Detection


    Another application area of machine learning is *outlier detection*, where the
    aim this time is to find instances that do not obey the general rule—those are
    the exceptions that are informative in certain contexts. The idea is that typical
    instances share characteristics that can be simply stated, and instances that
    do not have them are atypical.


    In *Anna Karenina*, Tolstoy writes, “All happy families resemble one another,
    but each unhappy family is unhappy in its own way.” This holds true in many domains,
    and not only for the case of nineteenth-century Russian families. For example,
    in medical diagnosis, we can similarly say that all healthy people are alike and
    that there are different ways of being unhealthy—each one of them is one disease.'
