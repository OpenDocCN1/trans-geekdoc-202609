- raw: 'Methods for decreasing the number of input attributes. In an application,
    some of the inputs may not be informative, and some may correspond to different
    ways of giving the same information. Reducing the number of inputs also reduces
    the complexity of the learned model and makes training easier. See *feature selection*
    and *feature extraction*.


    Discriminant


    A rule that defines the conditions for an instance to be an element of a *class*
    and as such separates them from instances of other classes.


    Document categorization


    Classification of text documents, generally based on the words that occur in the
    text (e.g., using *bag of words* representation). For instance, news documents
    can be classified as politics, arts, sports, and so on; emails can be classified
    as spam versus not-spam.


    Edge computing


    Processing data at the “edge,” that is, where the data is collected, instead of
    sending it to the cloud to be processed. It leads to fast response and decreased
    network traffic. This is an idea similar to *fog computing*.


    Embedded systems


    See *cyber-physical systems*.


    Face recognition


    Recognizing people’s identities from their face images captured by a camera.


    Feature extraction


    As a method for *dimensionality reduction*, several original inputs are combined
    to define new, more informative features.


    Feature selection


    A method that discards the uninformative features and keeps only those that are
    informative; it is used for *dimensionality reduction*.


    Fog computing


    A fog is like a cloud, but it is smaller and local. The cloud can be far; but
    the machines that make up the fog are local, therefore they lead to faster response;
    the idea is similar to *edge computing*.


    Gating unit


    A unit that opens or closes another connection depending on its input. It thus
    allows selectively turning on/off parts of a *neural network*.


    Generalization


    How well a model trained on a training set performs on new data unseen during
    training. This is at the core of machine learning. In an exam, a teacher asks
    questions that are different from the exercises already solved while teaching
    the course, and students’ performance is measured by their performance on these
    new questions. A student who can solve only the questions that the instructor
    has solved in class is not good enough.


    Generative model


    A model defined in such a way so as to represent the way we believe the data has
    been generated. We think of hidden causes that generate the data and also of higher-level
    hidden causes. Slippery roads may cause accidents, and rain may have caused roads
    to be slippery.


    Generative adversarial network


    This is actually made up of two networks, a generator *G* and a discriminator
    *D*. *G* generates a “fake” instance from a random input and *D* is trained to
    separate such fakes from true examples. *G* is in turn trained to generate fakes
    that *D* will classify as true, which will force *D* to get better at spotting
    fakes, which will in turn cause *G* to be a better faker, and so on.


    Graphical model


    A model representing dependencies between probabilistic concepts. Each node is
    a concept with a different truth degree and a connection between nodes represents
    a conditional dependency. If I know that the rain causes my grass to get wet,
    I define one node for rain and one node for wet grass, and I put a directed connection
    from the rain node to the node for wet grass. Probabilistic inference on such
    networks may be implemented as efficient graph algorithms. Such a network is a
    visual representation and helps understanding. Also known as a *Bayesian network*—one
    rule of inference used in such networks is *Bayes’ rule*.


    High-performance computing


    To handle the big data problems we have today in reasonable time, we need powerful
    computing systems, both for storage and calculation. The field of high-performance
    computing includes work along these directions; one approach is *cloud computing*.


    If-then rules


    Decision rules written in the form of “IF antecedent THEN consequent.” The antecedent
    is a logical condition and if holds true for the input, the action in the consequent
    is carried out. In *supervised learning*, the consequent corresponds to choosing
    a certain output. A rule base is composed of many if-then rules. A model that
    can be written as a set of if-then rules is easy to understand and hence rule
    bases allow *knowledge extraction*.


    Ill-posed problem


    A problem where the data is not sufficient to find a unique solution. Fitting
    a model to data is an ill-posed problem, and we need to introduce *inductive bias*
    to get a final model.


    Imitation learning


    In robotics, this means training a robot to imitate a human doing the task.


    Induction


    Learning a general model from particular examples, for example, learning the general
    concept of a chair from all the chairs one sees.


    Inductive bias


    The set of assumptions that each machine learning algorithm makes, in addition
    to the data, to learn a model.


    Information retrieval


    Given a database of many records, we make a query and we want the records relevant
    to be found. For example, given a database of news articles, we can make a query
    using keywords.


    Inverse reinforcement learning


    As a method for *imitation learning*, the idea is to first an extract reward function
    by observing the way a human is solving a task; once such a reward function is
    extracted, we can use *reinforcement learning* proper.


    Knowledge extraction


    In some applications, notably in data mining, after training a model, we would
    like to be able to understand what the model has learned; this can be used for
    validating the model by people who are experts in that application, and it also
    helps to understand the process that generated the data. Some models are “black
    box” in that they are not easy to understand; some models—for example, linear
    models and decision trees—are interpretable and allow extracting knowledge from
    a trained model.


    Latent semantic analysis


    A learning method where the aim is to find a small set of hidden (latent) variables
    that represent the dependencies in a large sample of observed data. Such hidden
    variables may correspond to abstract (e.g., semantic) concepts. For example, each
    news article can be said to include a number of “topics,” and although this topic
    information is not given explicitly in a supervised way in the data, we can learn
    them from data such that each topic is defined by a particular set of words and
    each news article is defined by a particular set of topics.


    Model


    A template formalizing the relationship between an input and an output. Its structure
    is fixed but it also has parameters that are modifiable; the parameters are adjusted
    so that the same model with different parameters can be trained on different data
    to implement different relationships in different tasks.


    Natural language processing


    Computer methods used to process human language, also called computational linguistics.


    Nearest-neighbor methods


    Models where we interpret an instance in terms of the most similar training instances.
    They use the most basic assumption: similar inputs have similar outputs. They
    are also called instance-, memory-, or case-based methods.


    Neural network


    A model composed of a network of simple processing units called neurons and connections
    between neurons called synapses. Each synapse has a direction and a weight, and
    the weight defines the effect of the neuron before on the neuron after.


    Nonparametric methods


    Statistical methods that do not make strong assumptions about the properties of
    the data. Hence they are more flexible, but they may need more data to sufficiently
    constrain them.


    Occam’s razor


    A philosophical heuristic that advises us to prefer simple explanations to complicated
    ones.


    Online analytical processing (OLAP)'
  fmt: '

    # Methods for decreasing the number of input attributes


    在应用程序中，某些输入可能不具备信息量，而另一些可能对应提供相同信息的不同方式。减少输入数量也能降低学习模型的复杂度，使训练更容易。请参阅`feature
    selection`和`feature extraction`。


    # Discriminant


    定义实例成为`class`元素条件的规则，从而将其与其他类的实例区分开来。


    # Document categorization


    文本文档的分类，通常基于文本中出现的单词（例如使用`bag of words`表示）。例如，新闻文档可分类为政治、艺术、体育等；电子邮件可分类为垃圾邮件与非垃圾邮件。


    # Edge computing


    在数据收集处（即“边缘”）处理数据，而非将其发送到云端处理。这能带来快速响应并减少网络流量。这一想法类似于`fog computing`。


    # Embedded systems


    请参阅`cyber-physical systems`。


    # Face recognition


    通过摄像头捕获的人脸图像识别人员身份。


    # Feature extraction


    作为`dimensionality reduction`的一种方法，将多个原始输入组合以定义新的、更具信息量的特征。


    # Feature selection


    一种丢弃无信息量特征、仅保留有信息量特征的方法；用于`dimensionality reduction`。


    # Fog computing


    雾类似于云，但规模更小且为本地化。云可能很远；但组成雾的机器是本地的，因此能带来更快的响应；该想法类似于`edge computing`。


    # Gating unit


    根据其输入开启或关闭另一个连接的单元。因此它允许有选择地开启/关闭`neural network`的部分。


    # Generalization


    模型在训练集上训练后，在训练期间未见过的新数据上的表现如何。这是机器学习的核心。考试中，教师会提问教学时已解练习之外的不同问题，学生的表现通过这些新问题上的表现来衡量。只能解决教师在课堂上讲解过的问题的学生是不合格的。


    # Generative model


    以某种方式定义的模型，旨在表达我们认为数据生成的方式。我们设想产生数据的隐藏原因，以及更高层级的隐藏原因。湿滑路面可能导致事故，而雨水可能导致路面湿滑。


    # Generative adversarial network


    这实际上由两个网络组成：生成器`G`和判别器`D`。`G`从随机输入生成“伪造”实例，`D`被训练以将此类伪造品与真实示例区分开。`G`反过来被训练生成`D`会判定为真的伪造品，这将迫使`D`更擅长识别伪造品，进而导致`G`成为更好的伪造者，如此循环。


    # Graphical model


    表示概率概念间依赖关系的模型。每个节点是一个具有不同真值程度的概念，节点间的连接表示条件依赖。例如，我知道雨导致草地湿，我会为雨定义一个节点，为湿草定义一个节点，并从雨节点向湿草节点建立有向连接。此类网络上的概率推断可作为高效图算法实现。这种网络是可视化表示，有助于理解。也称为`Bayesian
    network`——此类网络中使用的一种推断规则是`Bayes’ rule`。


    # High-performance computing


    为在合理时间内处理当今的大数据问题，我们需要强大的计算系统，用于存储和计算。高性能计算领域包括沿这些方向的工作；一种方法是`cloud computing`。


    # If-then rules


    以“IF antecedent THEN consequent”形式编写的决策规则。前件是一个逻辑条件，若对输入成立，则执行后件中的动作。在`supervised
    learning`中，后件对应选择特定输出。规则库由许多 if-then 规则组成。可写成 if-then 规则集合的模型易于理解，因此规则库允许`knowledge
    extraction`。


    # Ill-posed problem


    数据不足以找到唯一解的问题。将模型拟合到数据是一个 ill-posed problem，我们需要引入`inductive bias`以获得最终模型。


    # Imitation learning


    在机器人学中，这意味着训练机器人模仿人类执行任务。


    # Induction


    从特定示例中学习通用模型，例如，从见过的所有椅子中学习椅子的一般概念。


    # Inductive bias


    每个机器学习算法除数据外所做的那组假设，以学习模型。


    # Information retrieval


    给定包含许多记录的数据库，我们进行查询并希望找到相关记录。例如，给定新闻文章数据库，我们可以使用关键词进行查询。


    # Inverse reinforcement learning


    作为`imitation learning`的一种方法，其思路是先通过观察人类解决任务的方式来提取奖励函数；一旦提取出此类奖励函数，即可正式使用`reinforcement
    learning`。


    # Knowledge extraction


    在某些应用中（特别是数据挖掘），训练模型后，我们希望能理解模型学到了什么；这可用于由该应用领域专家验证模型，也有助于理解生成数据的过程。某些模型是“黑箱”，难以理解；某些模型（例如线性模型和决策树）可解释，允许从训练模型中提取知识。


    # Latent semantic analysis


    一种学习方法，旨在找到一小组隐藏（潜在）变量，以表示大量观测数据样本中的依赖关系。此类隐藏变量可能对应抽象（如语义）概念。例如，每篇新闻文章可包含若干“主题”，虽然监督数据中未显式给出主题信息，但我们可从数据中学习它们，使每个主题由特定词集定义，每篇新闻文章由特定主题集定义。


    # Model


    形式化输入与输出关系的模板。其结构固定，但也具有可修改的参数；调整参数使相同模型在不同参数下可在不同数据上训练，以在不同任务中实现不同关系。


    # Natural language processing


    用于处理人类语言的计算机方法，也称为计算语言学。


    # Nearest-neighbor methods


    以最相似训练实例来解释实例的模型。它们使用最基本的假设：相似输入具有相似输出。也称为基于实例、基于记忆或基于案例的方法。


    # Neural network


    由称为神经元的简单处理单元网络及称为突触的神经元间连接组成的模型。每个突触有方向和权重，权重定义前一神经元对后一神经元的影响。


    # Nonparametric methods


    不对数据属性做强假设的统计方法。因此它们更灵活，但可能需要更多数据来充分约束它们。


    # Occam’s razor


    建议我们倾向于简单解释而非复杂解释的哲学启发式方法。


    # Online analytical processing (OLAP)

    '
  trans: '


    # 减少输入属性数量的方法


    在应用程序中，某些输入可能不具备信息量，而另一些可能对应提供相同信息的不同方式。减少输入数量也能降低学习模型的复杂度，使训练更容易。请参阅`feature
    selection`和`feature extraction`。


    # 判别式


    定义实例成为`class`元素条件的规则，从而将其与其他类的实例区分开来。


    # 文档分类


    文本文档的分类，通常基于文本中出现的单词（例如使用`bag of words`表示）。例如，新闻文档可分类为政治、艺术、体育等；电子邮件可分类为垃圾邮件与非垃圾邮件。


    # 边缘计算


    在数据收集处（即“边缘”）处理数据，而非将其发送到云端处理。这能带来快速响应并减少网络流量。这一想法类似于`fog computing`。


    # 嵌入式系统


    请参阅`cyber-physical systems`。


    # 人脸识别


    通过摄像头捕获的人脸图像识别人员身份。


    # 特征提取


    作为`dimensionality reduction`的一种方法，将多个原始输入组合以定义新的、更具信息量的特征。


    # 特征选择


    一种丢弃无信息量特征、仅保留有信息量特征的方法；用于`dimensionality reduction`。


    # 雾计算


    雾类似于云，但规模更小且为本地化。云可能很远；但组成雾的机器是本地的，因此能带来更快的响应；该想法类似于`edge computing`。


    # 门控单元


    根据其输入开启或关闭另一个连接的单元。因此它允许有选择地开启/关闭`neural network`的部分。


    # 泛化


    模型在训练集上训练后，在训练期间未见过的新数据上的表现如何。这是机器学习的核心。考试中，教师会提问教学时已解练习之外的不同问题，学生的表现通过这些新问题上的表现来衡量。只能解决教师在课堂上讲解过的问题的学生是不合格的。


    # 生成模型


    以某种方式定义的模型，旨在表达我们认为数据生成的方式。我们设想产生数据的隐藏原因，以及更高层级的隐藏原因。湿滑路面可能导致事故，而雨水可能导致路面湿滑。


    # 生成对抗网络


    这实际上由两个网络组成：生成器`G`和判别器`D`。`G`从随机输入生成“伪造”实例，`D`被训练以将此类伪造品与真实示例区分开。`G`反过来被训练生成`D`会判定为真的伪造品，这将迫使`D`更擅长识别伪造品，进而导致`G`成为更好的伪造者，如此循环。


    # 图模型


    表示概率概念间依赖关系的模型。每个节点是一个具有不同真值程度的概念，节点间的连接表示条件依赖。例如，我知道雨导致草地湿，我会为雨定义一个节点，为湿草定义一个节点，并从雨节点向湿草节点建立有向连接。此类网络上的概率推断可作为高效图算法实现。这种网络是可视化表示，有助于理解。也称为`Bayesian
    network`——此类网络中使用的一种推断规则是`Bayes’ rule`。


    # 高性能计算


    为在合理时间内处理当今的大数据问题，我们需要强大的计算系统，用于存储和计算。高性能计算领域包括沿这些方向的工作；一种方法是`cloud computing`。


    # If-then 规则


    以“IF antecedent THEN consequent”形式编写的决策规则。前件是一个逻辑条件，若对输入成立，则执行后件中的动作。在`supervised
    learning`中，后件对应选择特定输出。规则库由许多 if-then 规则组成。可写成 if-then 规则集合的模型易于理解，因此规则库允许`knowledge
    extraction`。


    # 不适定问题


    数据不足以找到唯一解的问题。将模型拟合到数据是一个 ill-posed problem，我们需要引入`inductive bias`以获得最终模型。


    # 模仿学习


    在机器人学中，这意味着训练机器人模仿人类执行任务。


    # 归纳


    从特定示例中学习通用模型，例如，从见过的所有椅子中学习椅子的一般概念。


    # 归纳偏置


    每个机器学习算法除数据外所做的那组假设，以学习模型。


    # 信息检索


    给定包含许多记录的数据库，我们进行查询并希望找到相关记录。例如，给定新闻文章数据库，我们可以使用关键词进行查询。


    # 逆强化学习


    作为`imitation learning`的一种方法，其思路是先通过观察人类解决任务的方式来提取奖励函数；一旦提取出此类奖励函数，即可正式使用`reinforcement
    learning`。


    # 知识抽取


    在某些应用中（特别是数据挖掘），训练模型后，我们希望能理解模型学到了什么；这可用于由该应用领域专家验证模型，也有助于理解生成数据的过程。某些模型是“黑箱”，难以理解；某些模型（例如线性模型和决策树）可解释，允许从训练模型中提取知识。


    # 潜在语义分析


    一种学习方法，旨在找到一小组隐藏（潜在）变量，以表示大量观测数据样本中的依赖关系。此类隐藏变量可能对应抽象（如语义）概念。例如，每篇新闻文章可包含若干“主题”，虽然监督数据中未显式给出主题信息，但我们可从数据中学习它们，使每个主题由特定词集定义，每篇新闻文章由特定主题集定义。


    # 模型


    形式化输入与输出关系的模板。其结构固定，但也具有可修改的参数；调整参数使相同模型在不同参数下可在不同数据上训练，以在不同任务中实现不同关系。


    # 自然语言处理


    用于处理人类语言的计算机方法，也称为计算语言学。


    # 最近邻方法


    以最相似训练实例来解释实例的模型。它们使用最基本的假设：相似输入具有相似输出。也称为基于实例、基于记忆或基于案例的方法。


    # 神经网络


    由称为神经元的简单处理单元网络及称为突触的神经元间连接组成的模型。每个突触有方向和权重，权重定义前一神经元对后一神经元的影响。


    # 非参数方法


    不对数据属性做强假设的统计方法。因此它们更灵活，但可能需要更多数据来充分约束它们。


    # 奥卡姆剃刀


    建议我们倾向于简单解释而非复杂解释的哲学启发式方法。


    # 联机分析处理 (OLAP)


    '
