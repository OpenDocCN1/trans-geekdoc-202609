- raw: 'More complex types of recurrent connections are also possible. In a long short-term
    memory (LSTM) unit (Hochreiter and Schmidhuber 1997), there is a “forget gate”
    where this type of effect can be turned on or off (see figure 9). So depending
    on where and how the gate is turned on and off, the network can be selective as
    to what to remember from the past.


    For example, compare the following two sentences:


    Whether the possessive pronoun is “his” or “her” depends on the gender of the
    subject, that is, whether the person entering the room is a man or woman. So in
    generating such a sentence one word at a time (e.g., when generating a translation),
    the network should store that gender information when it processes the subject
    word at the beginning of the sentence and keep it intact (unaffected by the following
    words that are irrelevant for this purpose) until it generates the correct pronoun.


    ## Connectionist Models in Cognitive Science


    Artificial neural network models are known as *connectionist* or *parallel distributed
    processing* (PDP) models in cognitive psychology and cognitive science (Feldman
    and Ballard 1982; Rumelhart and McClelland and the PDP Research Group 1986). The
    idea is that neurons correspond to concepts and that the activation of a neuron
    corresponds to our current belief in the truth of that concept. Connections correspond
    to constraints or dependencies between concepts: A connection has a positive weight
    and is excitatory if the two concepts occur simultaneously—for example, between
    the neurons for circle and ‘6’—and has a negative weight and is inhibitory if
    the two concepts are mutually exclusive—for example, between the neurons for circle
    and ‘7’.


    Neurons whose values are observed—for example, by sensing the environment—affect
    the neurons they are connected to, which in turn affect the neurons *they* are
    connected to, and so on. This activity propagation throughout the network results
    in a state of neuron outputs that satisfies the constraints defined by the connections.


    The basic idea in connectionist models is that intelligence is an *emergent property*
    and high-level tasks, such as recognition or association between patterns, arise
    automatically as a result of this activity propagation by the rather elemental
    operations of interconnected simple processing units. Similarly, learning is done
    at the connection level through simple operations, for instance, according to
    the Hebbian rule, without any need for a higher-level programmer.


    Connectionist networks care about biological plausibility but are still abstract
    models of the brain; for example, it is very unlikely that there is actually a
    neuron for every concept in the brain—this is the *grandmother cell* theory, which
    states that I have a neuron in my brain that is activated only when I see or think
    of my grandmother—that is a *local representation*. It is known that neurons die
    and new neurons are born in the brain, so it makes more sense to believe that
    the concepts have a *distributed representation* on a cluster of neurons, with
    enough redundancy for concepts to survive despite physical changes in the underlying
    neuronal structure.


    Intelligence is an *emergent property* and tasks such as recognition arise automatically
    as a result of the propagation of activity over a network of simple processing
    units.


    ## Neural Networks as a Paradigm for Parallel Processing


    Since the 1980s, computer systems with thousands of processors have been commercially
    available. The software for such parallel architectures, however, has not advanced
    as quickly as hardware. The reason for this is that almost all our theory of computation
    up to that point was based on serial, single-processor machines. We are not able
    to use the parallel machines in their full capacity because we cannot program
    them efficiently.


    There are mainly two paradigms for *parallel processing*. In *single instruction,
    multiple data* (SIMD) machines, all processors execute the same instruction but
    on different pieces of data. In *multiple instruction, multiple data* (MIMD) machines,
    different processors may execute different instructions on different data. SIMD
    machines are easier to program because there is only one program to write. However,
    problems rarely have such a regular structure that they can be parallelized over
    a SIMD machine. MIMD machines are more general, but it is not an easy task to
    write separate programs for all the individual processors; additional problems
    arise that are related to synchronization, data transfer between processors, and
    so forth. SIMD machines are also easier to build, and machines with more processors
    can be constructed if they are SIMD. In MIMD machines, processors are more complex,
    and a more complex communication network must be constructed for the processors
    to exchange data arbitrarily.


    Assume now that we can have machines where processors are a little bit more complex
    than SIMD processors but not as complex as MIMD processors. Assume that we have
    simple processors with a small amount of local memory where some parameters can
    be stored. Each processor implements a fixed function and executes the same instructions
    as SIMD processors; but by loading different values into its local memory, each
    processor can be doing different things and the whole operation can be distributed
    over such processors. We will then have what we can call *neural instruction,
    multiple data* (NIMD) machines, where each processor corresponds to a neuron,
    local parameters correspond to its synaptic weights, and the whole structure is
    a neural network. If the function implemented in each processor is simple and
    if the local memory is small, then many such processors can be fit on a single
    chip.


    The problem now is to distribute a task over a network of such processors and
    to determine the local parameter values. This is where learning comes into play:
    We do not need to program such machines and determine the parameter values ourselves
    if such machines can learn from examples.


    Thus, artificial neural networks are a way to make use of the parallel hardware
    we can build with current technology and—thanks to learning—they need not be programmed.
    Therefore, we also save ourselves the effort of programming them.


    ## Hierarchical Representations in Multiple Layers


    Before, we mentioned that a single layer of perceptron cannot implement certain
    tasks, such as XOR, and that such limitations do not apply when there are multiple
    layers. Actually, it has been proven that the multilayer perceptron is a *universal
    approximator*, that is, it can approximate any function with desired accuracy
    given enough neurons—through training it to accomplish that is not always straightforward.


    The perceptron algorithm can train only single-layer networks, but in the 1980s
    the *backpropagation algorithm* was invented to train multilayer perceptrons,
    and this caused a flurry of applications in various domains significantly accelerating
    neural network research in many fields, from cognitive science to computer science
    and engineering.


    Artificial neural networks are a way to make use of the parallel hardware we can
    build with current technology and—thanks to learning—they need not be programmed.


    The multilayer network is intuitive because it corresponds to layers of operation
    where we start from the raw input and incrementally perform a more complicated
    transformation, until we get to the output.'
