- raw: '[5](#13811-0006.xhtml#en6r). Early scientists believed that the existence
    of rules that explain the physical world is a sign of an ordered universe, which
    could only be due to a god. Observing nature and trying to fit rules to natural
    phenomena has an old history, starting in ancient Mesopotamia. Early on, pseudoscience
    could not be separated from science. In hindsight, the fact that the ancient people
    believed in astrology is not surprising: If there are regularities and rules about
    the movement of the sun and the moon, which can be used to predict eclipses for
    example, positing the existence of regularities and rules about the movement of
    human beings, which seem so petty in comparison, does not sound far-fetched.


    ## Chapter 2


    [1](#13811-0007.xhtml#en7r). See [https://en.wikipedia.org/wiki/Depreciation](https://en.wikipedia.org/wiki/Depreciation).


    [2](#13811-0007.xhtml#en8r). Such smoothness assumptions are also frequently used
    in image processing. For example, when scientists first captured the image of
    a black hole in 2019, they used the Event Horizon Telescope, which is actually
    a combination of a number of telescopes around the world each capable of recording
    only a small part. Smoothness constraints are used to put those pieces together
    to get the complete image, just like in the illusion of the Kanizsa triangle where
    we can imagine a complete large triangle even though what we actually see are
    just small pieces of it.


    [3](#13811-0007.xhtml#en9r). For an excellent history of artificial intelligence,
    see Nilsson 2009.


    [4](#13811-0007.xhtml#en10r). See Sandel 2012 for some real-life scenarios where
    decision making based on expected value, or expected utility, may not be the best
    way. *Pascal’s wager* is another example of the application of expected value
    calculation in an area where it should not be applied.


    ## Chapter 3


    [1](#13811-0008.xhtml#en11r). Here, we are talking about *optical* character recognition
    where the input is an image; there is also *pen-based* character recognition where
    the writing is done on a touch-sensitive pad. In such a case, the input is not
    an image but a sequence of the (*x*,*y*) coordinates of the stylus tip, while
    the character is written on the touch-sensitive surface.


    [2](#13811-0008.xhtml#en12r). Let us say *F* represents the flu and *N* represents
    a runny nose. Using Bayes’ rule, we can write the probability that a person has
    the flu given that we know they have a runny nose:


    *P*(*F*|*N*) = *P*(*N*|*F*)*P*(*F*)/*P*(*N*),


    Here, *P*(*N*|*F*) is the conditional probability in the other direction, namely,
    that a patient has a runny nose given that they are known to have the flu. *P*(*F*)
    is the probability that a patient has the flu, regardless of whether they have
    a runny nose or not, and *P*(*N*) is the probability that a patient has a runny
    nose, regardless of whether they have the flu or not.


    [3](#13811-0008.xhtml#en13r). It is interesting that in many science fiction movies,
    though the robots may be very advanced in terms of vision, speech recognition,
    and autonomous movement, they still continue to speak in an emotionless, “robotic”
    voice.


    [4](#13811-0008.xhtml#en14r). This is due to Condorcet’s Jury Theorem, which states
    that in a group that decides by majority voting, if each voter has an independent
    probability *p* of voting for the correct decision, for any *p* > ½ (better than
    randomly guessing), the probability that the majority vote is correct approaches
    1 as the number of voters increase. This is why democracy is better than monarchy
    (Marquis de Condorcet supported the French Revolution, though he was later treated
    as a traitor and sent to prison where he died), but only if the voters can form
    their own opinions independently, and that is where concepts such as freedom of
    press and freedom of expression come into play.


    Another implication is the advantage of countries that are tolerant to differences,
    or are open to individuals from different backgrounds, such as immigrants, knowing
    that differences are a source of diversity and hence of new ideas. Historically
    speaking, we see that creativity, artistic or scientific, is highest in either
    countries that were trading nations continuously interacting with different cultures,
    or countries that were welcoming to immigrants. It is always said that creativity
    requires being able to “think outside the box”; the more different people are,
    the less their boxes overlap, and meeting different people enlarges one’s box.


    [5](#13811-0008.xhtml#en15r). Bayesian estimation uses Bayes’ rule in probability
    theory (which we saw before) named after Thomas Bayes (1702–1761) who was a Presbyterian
    minister. The assumption of a prior that exists before and underlies the observable
    data should have come naturally with the job.


    ## Chapter 4


    [1](#13811-0009.xhtml#en16r). Check [thispersondoesnotexist.com](http://thispersondoesnotexist.com)
    for example face images generated by a GAN.


    ## Chapter 7


    [1](#13811-0012.xhtml#en17r). Quoted in “Human Rights and Technology” discussion
    paper, Australian Human Rights Commission, December 2019, 75, [https://www.humanrights.gov.au/our-work/rights-and-freedoms/publications/human-rights-and-technology-discussion-paper-2019](https://www.humanrights.gov.au/our-work/rights-and-freedoms/publications/human-rights-and-technology-discussion-paper-2019).


    ## Chapter 8


    [1](#13811-0013.xhtml#en18r). The speed of light is approximately 300,000 km/sec,
    so it takes at least 3.33 milliseconds to traverse 1,000 km—distance to a data
    center. This is not actually such a small number with electronic devices. The
    connection is never direct and there are always delays due to intermediate routing
    devices; and remember that to get a response, we need to send a query first, so
    we need to double the time.


    [2](#13811-0013.xhtml#en19r). For more, see *Frontiers in Massive Data Analysis*
    (Washington, DC: National Academies Press, 2013).


