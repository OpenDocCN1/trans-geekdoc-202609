    # 错误类型与决策制定


    类似地，存在两类错误（见表 2）。如果系统预测患癌但患者实际上未患癌，这属于*假阳性*——系统错误地选择了阳性类别。这会导致不必要的治疗，既昂贵又给患者带来不便。如果系统预测无疾病但患者实际患病，这属于*假阴性*。假阴性的代价高于假阳性，因为患者将无法获得必要的治疗。鉴于假阴性的代价远大于假阳性，即使阳性类别的概率相对较小，我们也会选择阳性类别——启动进一步检查。这不同于预测抛硬币，我们会选择概率高于
    ½ 的结果——正面或反面（因为两种可能的错误猜测后果同等严重）。


    ## 表 2 决策制定中的不同错误类型


    | | | Action | |

    | --- | --- | --- | --- |

    | Truth | | *Choose positive (start treatment)* | *Choose negative (discharge
    the patient)* | *Sum* |

    | *Positive (the patient has cancer)* | | TP: True positive | FN: False negative
    | P |

    | *Negative (the patient does not have cancer)* | | FP: False positive | TN: True
    negative | N |

    | *Sum* | | P′ | N′ | |


    这是*期望值*计算的基础，我们不仅利用概率做决策，还考虑决策可能导致的损失或收益。尽管期望值计算在保险等许多领域频繁使用，但人们并不总是理性行事；如果总是理性，没人会买彩票！


    在马克斯·弗里施的小说《*Homo Faber*》中，一位被蛇咬伤女孩的母亲被告知无需担心，因为蛇咬致死率仅 3%–10%。这位妇女愤怒地说：“如果我有一百个女儿……那我只会失去三到十个女儿。少得惊人！你说得很对”，接着又说，“我只有一个孩子。”在涉及伦理问题时，我们需谨慎使用期望值计算；稍后在自动驾驶汽车案例中，我们将回到自动化决策的伦理和法律层面[4](#13811-0015.xhtml#en10)。


    如果假阳性和假阴性代价均高，第三种可能的行动是*拒绝*并推迟决策。例如，若计算机辅助诊断无法在两种结果间抉择，可选择拒绝，由人工专家裁决；专家可利用系统无法直接获取的额外信息。在自动邮件分拣机中，若系统无法识别信封上的数字邮政编码，邮政工人也可阅读地址。


    在分类任务中，当假阳性和假阴性危害相当时，其和 `FP + FN` 即为误分类数。例如，某视觉识别系统区分汽车与坦克，假设汽车为阳性类别。则 `FP` 为被误判为汽车的坦克数，`FN`
    为被误判为坦克的汽车数。二者之和除以图像总数，即 `(FP + FN)/(P + N)`，称为*分类错误率*；等价地，`(TP + TN)/(P + N)`
    称为*分类准确率*。


    在其他应用中，性能指标可能不同。设想一款通过声纹访问银行账户的应用。假阳性是被允许访问的冒名顶替者，假阴性是被拒服务的合法用户。前者危害远大于后者。*命中率*或*真阳性率*衡量被正确认证的合法用户比例
    `TP/P`，*虚警率*或*假阳性率*衡量被错误认证的冒名顶替者比例 `FP/N`。


    二者存在权衡。若修改分类器使其更倾向于选择阳性类别，会提高命中率，但也会增加虚警率风险。在决定选择哪个类别时，我们希望在尽可能降低虚警率的前提下最大化命中率。


    在*信息检索*中，我们有查询（例如用关键词定义），需从数据库中检索匹配记录。例如，我们想用关键词“tiger”从图像数据库中检索老虎图像。此时，被检索的图像对应分配到阳性类别，未被检索的对应阴性类别。`TP`
    对应被检索的老虎图像数，`FN` 对应数据库中存在但未被检索的老虎图像数。`FP` 是被检索但非老虎的图像数。


    此场景下有两个性能指标。*精确率*是真阳性与所有检索实例之比，即 `TP/P'' = TP/(TP + FP)`，表示检索实例中真正相关（匹配查询）的百分比。*召回率*是真阳性与所有阳性实例之比，即
    `TP/P`，表示相关实例中实际被检索的百分比。


    我们希望*精确率和召回率*均尽可能接近 1：若精确率为 1，所有检索记录可能相关，但仍可能有相关记录未被检索；若召回率为 1，所有相关记录均被检索，但也可能包含其他无关检索记录（见图
    4）。同样可见精确率与召回率的权衡。我们可通过检索更多图像提高召回率，但这有降低精确率的风险。


    ![](images/13811_004_fig_000.jpg)


    可见与分类不同，此处我们不关心真阴性；那些是正确未被检索的非老虎图像；在检索中我们不关心这些，其数量随数据库规模和范围变化而增减，不影响性能评估。


    在其他领域（如医学）中，人们使用*灵敏度*和*特异性*指标。*灵敏度*等同于召回率，衡量我们检测阳性的能力。*特异性*衡量我们检测阴性的能力，即 `TN/N`，等于
    `1 – 虚警率`。例如，我们开发了一种病毒检测试剂：灵敏度反映其捕捉感染者的能力，特异性反映其对未感染者保持“静默”（不报警）的能力。


    本章讨论了机器学习的一般基础；下一章将介绍一种学习类型——监督学习，它用于人脸、语音等模式识别。


    # 第 3 章 模式识别


    ## 学会阅读


    不同的自动视觉识别任务复杂度各异。最简单的是*条形码*读取，信息以不同宽度的线条表示，这些形状易于识别。条形码是简单高效的技术：易于打印，也易于制造扫描仪读取；因此仍广泛使用。但条形码非自然表示，信息容量有限；近来提出二维矩阵条形码，可在更小区域编码更多信息；例如可用智能手机扫描指向网站的
    QR 码。

