- raw: 'Deep learning methods are attractive mainly because they need less manual
    help. We do not need to craft the right features or the suitable transformations.
    Once we have data—and today we have “big” data—and sufficient computation available—and
    today we have data centers with thousands of processors—we just wait and let the
    learning algorithm discover all that is necessary by itself.


    Another important factor that fueled deep learning research in recent years is
    the availability of software libraries that allow coding deep neural networks
    very easily. Those libraries can also efficiently utilize parallel hardware and
    thus permit testing different network architectures very quickly.


    The idea of multiple layers of increasing abstraction that underlies deep learning
    is intuitive. Not only in vision—in handwritten digits or face images—but also
    in many applications we can think of such layers of abstraction. Discovering these
    abstract representations is useful, not only for prediction but also because abstraction
    allows a better description and understanding of the problem.


    ## Learning Hidden Representations


    A special type of multilayer network is the *autoencoder*, where the desired output
    is set to be equal to the input, and the network has a hourglass shape with fewer
    hidden units in the intermediate layers than there are in the input and output.
    Such a network is composed of two parts where the first part, from the input to
    the hidden layer, implements an *encoder* stage where a high-dimensional input
    is compressed to be represented by the values of the fewer hidden units. The second
    part, from the hidden layer to the output, implements a *decoder* stage that takes
    that low-dimensional representation in the hidden layer and reconstructs the higher
    dimensional input back again at the output (see figure 11).


    ![](images/13811_011_fig_000.jpg)


    For the network to be able to reconstruct the input at its output units, those
    few hidden units that act as a bottleneck should be able to extract the features
    that preserve information maximally. The autoencoder is unsupervised; those hidden
    units learn themselves without any supervision to find a good encoding of the
    input, a short, compressed description, extracting the most important features
    and ignoring what is irrelevant, namely, noise.


    Researchers have proposed extensions and different uses of the basic autoencoder.
    For example, the autoencoder shown in figure 11 has only one layer of connections
    between the input and the hidden units, but in practice in a *deep* autoencoder,
    there may be multiple layers in the encoder (with their structure mirrored in
    the decoder) to be able to learn more abstract hidden representations; for example,
    if we have images as the input, the first few layers of the encoder are typically
    convolutional.


    An interesting variant is the *noisy autoencoder* where the aim is to learn a
    hidden representation that is robust to perturbations of the input. Let us say
    we have face images and we see that some people wear glasses that occlude their
    eyes, which can mess up recognition. What we do is we use an autoencoder where
    we take two images of the same person as input, one with and one without glasses,
    and for both, we set the image without glasses as the desired output. To be able
    to generate the same output for both, the encoder should learn to generate the
    same code for both, meaning that it should learn to discard the occluding effect
    of the glasses. Such a representation generated by the encoder can then be given
    to a face recognizer which can make decisions despite glasses.


    This can be done with any perturbation of the input that we want to get invariance
    to, for example, small rotations or translations. That is, if you have an input
    *x* and its perturbed version *x\** and for both, we set *x* as the desired output,
    the network, assuming that it is big enough and that it sees enough training examples,
    learns to generate a hidden representation that is invariant to that type of perturbation.


    The general idea is that if we have two different inputs for which we set the
    same desired output, the encoder will be forced to learn to generate the same,
    or very similar codes for the two. One application of this is in learning word
    representations in natural language processing. This is a topic where the need
    for good feature extractors, that is, good hidden representations, is most apparent.
    Researchers have worked on predefined databases, called *ontologies*, for representing
    relationships between words in a language and such databases work with some success;
    but again it turned out that the best way is to learn such relationships from
    a lot of data.


    In the *word2vec* network which has the same architecture as an autoencoder, the
    output is a word and the input is a word in its context, that is, one of the words
    that are nearby in the same sentence (Mikolov et al. 2013). The result of such
    a training is that if two words appear in the same or very similar contexts, the
    encoder will generate similar codes for them.


    For example, consider the following sentence:


    It is highly possible that if we go through a very large corpus of sentences,
    we will also find very similar sentences but with “Berlin” instead of “Paris,”
    or “Rome,” and so on. We will have many sentences about cities, which are all
    almost the same, the only difference being the name of the city. This will make
    codes (encoder outputs) for all these cities to be similar because the same context
    words need to be decoded from them.


    Now consider this sentence:


    Again, we will have many similar sentences with “German” instead of “French” and
    this time “Berlin” instead of “Paris.” This will cause similar codes to be generated
    for “French” and “German,” but also the representational relationship between
    “German” and “Berlin” will be the same as the one between “French” and “Paris.”
    This leads to what is called *vector algebra*: Because codes are numbers, we can
    do arithmetic on them.


    Let us say vec(“Paris”) denotes the learned code for “Paris” (see figure 12).
    After training, we expect vec(“Paris”) and vec(“Berlin”) to be nearby, and also
    vec(“French”) and vec(“German”) to be nearby but in some other part of the code
    space, but we expect also the relationships to be similar. That is, we expect
    vec(“German”) – vec(“Berlin”) to be very similar to vec(“French”) – vec(“Paris”),
    so much so that if we calculate vec(“German”) – vec(“Berlin”) + vec(“Paris”),
    we will get a code very close to vec(“French”).


    ![](images/13811_012_fig_000.jpg)


    ## End-to-End Learning


    In many applications, the processing can be viewed as an encoder-decoder structure
    that we have with the autoencoder discussed earlier.


    Consider machine translation. Starting with an English sentence, in multiple levels
    of processing and abstraction that are learned automatically from a very large
    English corpus to code the lexical, syntactic, and semantic rules of the English
    language, we would get to the most abstract representation. Now consider the same
    sentence in French. The levels of processing learned this time from a French corpus
    would be different, but if the two sentences mean the same, at the most abstract,
    language-independent level, they should have very similar representations.


    Language understanding is a process of encoding where from a given sentence, we
    extract this high-level abstract representation, and language generation is a
    process of decoding, where we synthesize a natural language sentence from such
    a high-level representation. In translation, we encode in the source language
    and decode in the target language. In a dialogue system, we first encode the question
    to an abstract level and process it to form a response in the abstract level,
    which we then decode as the response sentence.'
  fmt: '

    # Deep Learning Methods


    Deep learning methods are attractive mainly because they need less manual help.
    We do not need to craft the right features or the suitable transformations. Once
    we have data—and today we have "big" data—and sufficient computation available—and
    today we have data centers with thousands of processors—we just wait and let the
    learning algorithm discover all that is necessary by itself.


    Another important factor that fueled deep learning research in recent years is
    the availability of software libraries that allow coding deep neural networks
    very easily. Those libraries can also efficiently utilize parallel hardware and
    thus permit testing different network architectures very quickly.


    The idea of multiple layers of increasing abstraction that underlies deep learning
    is intuitive. Not only in vision—in handwritten digits or face images—but also
    in many applications we can think of such layers of abstraction. Discovering these
    abstract representations is useful, not only for prediction but also because abstraction
    allows a better description and understanding of the problem.


    ## Learning Hidden Representations


    A special type of multilayer network is the `autoencoder`, where the desired output
    is set to be equal to the input, and the network has a hourglass shape with fewer
    hidden units in the intermediate layers than there are in the input and output.
    Such a network is composed of two parts where the first part, from the input to
    the hidden layer, implements an `encoder` stage where a high-dimensional input
    is compressed to be represented by the values of the fewer hidden units. The second
    part, from the hidden layer to the output, implements a `decoder` stage that takes
    that low-dimensional representation in the hidden layer and reconstructs the higher
    dimensional input back again at the output (see figure 11).


    ![](images/13811_011_fig_000.jpg)


    For the network to be able to reconstruct the input at its output units, those
    few hidden units that act as a bottleneck should be able to extract the features
    that preserve information maximally. The `autoencoder` is unsupervised; those
    hidden units learn themselves without any supervision to find a good encoding
    of the input, a short, compressed description, extracting the most important features
    and ignoring what is irrelevant, namely, noise.


    Researchers have proposed extensions and different uses of the basic `autoencoder`.
    For example, the `autoencoder` shown in figure 11 has only one layer of connections
    between the input and the hidden units, but in practice in a `deep` `autoencoder`,
    there may be multiple layers in the `encoder` (with their structure mirrored in
    the `decoder`) to be able to learn more abstract hidden representations; for example,
    if we have images as the input, the first few layers of the `encoder` are typically
    convolutional.


    An interesting variant is the `noisy autoencoder` where the aim is to learn a
    hidden representation that is robust to perturbations of the input. Let us say
    we have face images and we see that some people wear glasses that occlude their
    eyes, which can mess up recognition. What we do is we use an `autoencoder` where
    we take two images of the same person as input, one with and one without glasses,
    and for both, we set the image without glasses as the desired output. To be able
    to generate the same output for both, the `encoder` should learn to generate the
    same code for both, meaning that it should learn to discard the occluding effect
    of the glasses. Such a representation generated by the `encoder` can then be given
    to a face recognizer which can make decisions despite glasses.


    This can be done with any perturbation of the input that we want to get invariance
    to, for example, small rotations or translations. That is, if you have an input
    `x` and its perturbed version `x*` and for both, we set `x` as the desired output,
    the network, assuming that it is big enough and that it sees enough training examples,
    learns to generate a hidden representation that is invariant to that type of perturbation.


    The general idea is that if we have two different inputs for which we set the
    same desired output, the `encoder` will be forced to learn to generate the same,
    or very similar codes for the two. One application of this is in learning word
    representations in natural language processing. This is a topic where the need
    for good feature extractors, that is, good hidden representations, is most apparent.
    Researchers have worked on predefined databases, called `ontologies`, for representing
    relationships between words in a language and such databases work with some success;
    but again it turned out that the best way is to learn such relationships from
    a lot of data.


    In the `word2vec` network which has the same architecture as an `autoencoder`,
    the output is a word and the input is a word in its context, that is, one of the
    words that are nearby in the same sentence (Mikolov et al. 2013). The result of
    such a training is that if two words appear in the same or very similar contexts,
    the `encoder` will generate similar codes for them.


    For example, consider the following sentence:


    > It is highly possible that if we go through a very large corpus of sentences,
    we will also find very similar sentences but with "Berlin" instead of "Paris,"
    or "Rome," and so on. We will have many sentences about cities, which are all
    almost the same, the only difference being the name of the city. This will make
    codes (encoder outputs) for all these cities to be similar because the same context
    words need to be decoded from them.


    Now consider this sentence:


    > Again, we will have many similar sentences with "German" instead of "French"
    and this time "Berlin" instead of "Paris." This will cause similar codes to be
    generated for "French" and "German," but also the representational relationship
    between "German" and "Berlin" will be the same as the one between "French" and
    "Paris." This leads to what is called `vector algebra`: Because codes are numbers,
    we can do arithmetic on them.


    Let us say `vec("Paris")` denotes the learned code for "Paris" (see figure 12).
    After training, we expect `vec("Paris")` and `vec("Berlin")` to be nearby, and
    also `vec("French")` and `vec("German")` to be nearby but in some other part of
    the code space, but we expect also the relationships to be similar. That is, we
    expect `vec("German") – vec("Berlin")` to be very similar to `vec("French") –
    vec("Paris")`, so much so that if we calculate `vec("German") – vec("Berlin")
    + vec("Paris")`, we will get a code very close to `vec("French")`.


    ![](images/13811_012_fig_000.jpg)


    ## End-to-End Learning


    In many applications, the processing can be viewed as an `encoder-decoder` structure
    that we have with the `autoencoder` discussed earlier.


    Consider machine translation. Starting with an English sentence, in multiple levels
    of processing and abstraction that are learned automatically from a very large
    English corpus to code the lexical, syntactic, and semantic rules of the English
    language, we would get to the most abstract representation. Now consider the same
    sentence in French. The levels of processing learned this time from a French corpus
    would be different, but if the two sentences mean the same, at the most abstract,
    language-independent level, they should have very similar representations.


    Language understanding is a process of encoding where from a given sentence, we
    extract this high-level abstract representation, and language generation is a
    process of decoding, where we synthesize a natural language sentence from such
    a high-level representation. In translation, we encode in the source language
    and decode in the target language. In a dialogue system, we first encode the question
    to an abstract level and process it to form a response in the abstract level,
    which we then decode as the response sentence.

