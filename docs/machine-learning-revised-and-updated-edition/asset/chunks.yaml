    # 贝叶斯估计与神经网络


    ## 贝叶斯估计


    在某些应用和某些模型中，我们可能对参数的可能值有一些*先验信念*。当我们抛硬币时，我们期望它是一枚均匀硬币或接近均匀，因此我们期望正面朝上的概率接近 ½；在估算汽车价格时，我们期望里程数对价格有负面影响。贝叶斯方法允许我们在估计参数时考虑此类先验信念。5
    *贝叶斯估计*的思想是将先验知识与数据结合起来，计算参数的*后验分布*。让我们看一个例子。


    假设我们要估计人们点击公司网页上某个特定链接的概率；为此，我们收集了十位访客的样本，发现其中有六位点击了该链接。常规方法会认为概率是 0.6，并基于该值用于任何进一步的计算和处理。


    现在我们可以看到，实际概率实际上可能是 0.5，只是恰巧在那个特定的十人样本中我们看到了六次点击。甚至有可能（尽管可能性小得多）实际概率是 0.1，只是发生了一个罕见事件，我们得到了六次点击。因此，我们从数据中真正能得到的不是单一数值（0.6），而是一系列可能的值，对于每个值我们还有一个数据支持程度的附加值；这就是我们所说的后验分布。一旦我们有了这样的后验分布，我们就使用所有（或合理子集的）可能值进行进一步计算，并使用它们的平均值，每个值按其可能性的大小加权。


    当数据集较小时，贝叶斯方法特别有用。如果我们在 100 次试验中看到了 60 次点击，0.6 周围可能值的范围将小得多。


    虽然贝叶斯方法灵活且有趣，但它有一个缺点：除简单场景和限制性假设外，必要的计算过于复杂。一种可能性是*近似*，即我们不使用难以处理的真实后验分布，而是使用一个相似但可控的分布。另一种可能性是*采样*，即我们不直接使用分布本身，而是从分布中生成有代表性的实例，并基于它们进行推断。这些流行方法——前者的*变分近似*，后者的*马尔可夫链蒙特卡洛*（MCMC）*采样*——是当前机器学习研究的重要方向之一。


    贝叶斯方法允许我们在训练中融入先验信念。其中一种先验信念是潜在问题是平滑的，这使我们倾向于更简单的模型；请回顾第 2 章中关于奥卡姆剃刀和卡尼萨三角形的讨论。在*正则化*中，我们惩罚复杂性，在训练期间，除了最大化对数据的拟合外，我们还试图最小化模型复杂性。在学习过程中，我们还会摆脱那些使模型不必要地复杂且输出过于多变的参数。这意味着一种学习方案不仅涉及参数的调整，还涉及模型结构的变化。或者我们可以反其道而行之，当我们怀疑模型对于数据过于简单时，逐步增加复杂性。


    在贝叶斯估计中使用这种*非参数*方法特别有趣，因为我们不再受某个参数模型类的约束，但模型复杂性也会动态变化以匹配数据中任务的复杂性（Orbanz and Teh
    2010）。这意味着一个“无限大小”的模型，因为它可以像我们想要的那样复杂——它在学习时增长。


    在许多领域表现良好的一个模型家族是受人脑启发的人工神经网络；在下一章中，我们将讨论此类网络如何按层组织，以及如何训练这种“深层”网络。


    ## 神经网络与深度学习


    ### 人工神经网络


    我们的大脑使我们变得智能；我们看或听、学习和记忆、规划和行动，都归功于我们的大脑。在试图构建具有此类能力的机器时，我们直接的灵感来源是人脑，就像鸟类是我们早期飞行尝试的灵感来源一样。我们想做的是观察大脑如何工作，并试图理解它是如何完成其功能的。但我们想要一个独立于特定实现细节的解释——这就是我们在第
    1 章讨论分析层次时所说的*计算理论*。如果我们能提取出这样一种抽象的数学描述，我们稍后就可以用工程师手头可用的资源来实现它——例如，用硅基芯片并靠电力运行。


    早期制造飞行器的尝试失败了，直到我们理解了空气动力学理论；只有那时我们才能制造飞机。今天，我们将鸟类和飞机视为两种不同的飞行方式——我们现在称它们为飞机，而不是人造鸟，它们能做的比鸟更多；它们飞行距离更远，能载客或载货。我们的想法是为智能实现同样的目标，我们从大脑获取灵感开始。


    人脑由大量处理单元组成，称为*神经元*，每个神经元通过称为*突触*的连接与大量其他神经元相连。神经元并行运行，并通过这些突触在彼此之间传递信息。人们认为处理是由神经元完成的，而记忆在于突触中，即神经元连接和相互影响的方式。


    关于*神经网络*作为模拟计算模型的研究——神经元输出不是离散的 0 或 1，而是当它们被激活时，以一个连续值的频率放电——早在数字计算研究时期就已开始（McCulloch
    and Pitts 1943），但在数字计算机取得快速成功并广泛应用后，很长一段时间内基本未被注意。


    在 20 世纪 60 年代，*感知机*模型被提出作为模式识别的模型（Rosenblatt 1962）。它是一个由人工神经元和突触连接组成的网络，其中每个神经元都有一个激活值，从神经元
    `A` 到神经元 `B` 的连接有一个权重，定义了 `A` 对 `B` 的影响。如果突触是兴奋性的，当 `A` 活跃时，它也会尝试激活 `B`；如果突触是抑制性的，当
    `A` 活跃时，它会尝试抑制 `B`。


    在运行期间，每个神经元将所有与其形成突触的神经元的激活值按其突触权重加权求和，如果总激活值大于阈值，该神经元就会“放电”，其输出对应于该激活值；否则神经元保持静默。如果神经元放电，它会依次将其激活值发送给所有与其形成突触的神经元（见图
    7）。


    感知机基本上在做决策前计算加权和，这可以看作是我们之前讨论的线性模型的一种变体实现方式。此类神经元可以组织成层，其中一层中的所有神经元从前一层的所有神经元获取输入并并行计算其值，这些值一起被送给下一层的所有神经元——这称为*多层感知机*。


