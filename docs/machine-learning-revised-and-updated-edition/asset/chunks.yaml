- raw: 'A second problem is sensitivity. For example, it has been shown with deep
    neural networks that slightly perturbed versions of valid examples sometimes cause
    very big changes at the output. Such *adversarial examples* are taken as an indicator
    that the model has not generalized well but is still greatly dependent on the
    individual training instances. This is disturbing because we know that our sensors
    are never perfect and there can always be noise at the input. For example, we
    do not want a self-driving car to run amok if bad weather clouds its sensors or
    the road signs get muddy.


    Because of all these reasons, we should always question the decision made by a
    trained model and require additional validation, especially in domains where wrong
    decisions have possible high losses. We want our model to provide not only an
    output but also an explanation as to how it came to that decision. Such explanations
    should be in a format that does not require any expertise in machine learning,
    but any user of the system should be able to understand and assess them.


    The internal operation of a deep neural network is not easily understandable;
    it’s an example of a *black box* model. However, a linear model where we calculate
    a total score as a weighted sum of different factors, or a decision tree that
    can be written down in terms of if-then rules, are easy to understand and hence
    preferrable (see figure 6). Such rules can be checked and assessed by human experts
    to see if the trained model has learned meaningful rules. This is the topic of
    *explainable artificial intelligence* (XAI), which is another research area that
    is increasingly becoming important as trained models are being used more and more
    (Gilpin et al. 2018).


    One interesting idea is that of “counterfactuals” where the idea is to inform
    the user how the decision could have been different: for example, “You were denied
    a loan because your annual income was £30,000. If your income had been £45,000,
    you would have been offered a loan” (Wachter, Mittelstadt, and Russell 2018, 844).
    Of course, in generating explanations as well as counterfactuals, it is necessary
    to preserve commercial secrets; banks for example would not want to disclose the
    exact formula they use for credit scoring.


    We want our model to provide not only an output but also an explanation as to
    how it came to that decision, in a format understandable by anyone.


    ## Ethical, Legal, and Other Social Aspects


    As any engineering product, the correct behavior of a trained model should be
    checked rigorously. We have already considered possible biases in the training
    data that may be harmful. In any scenario where automatic decisions are made based
    on past data, such as finance, health care, or justice, we have to guarantee *transparency*
    in the collection of data and *fairness* in making decisions. We also have to
    make sure that such systems use models that are interpretable, and that their
    decisions be *explainable* to its users, and we have to be able to hold the manufacturers
    of such systems *accountable*.


    When intelligence is embodied and the system takes physical actions, the correctness
    of the behavior becomes an even more critical issue and even human life may be
    at stake. So another requirement is *safety*. The system does not need to be a
    drone with onboard weaponry for this to be true; even an autonomous car becomes
    dangerous if it is driven badly. When such concerns come into play, the usual
    expected value or utilitarian approaches do not apply, as is discussed in the
    “trolley problems,” a variant of which is as follows.


    Let us say you are riding in an autonomous car when a child suddenly runs across
    the road. Assume the car is going so fast that it knows it cannot stop. But it
    can still steer, and it can steer to the right to avoid hitting the child. But
    let us say that the child’s mother is standing to the right of the road. How should
    the car decide? Should it go ahead and hit the child, or steer right and hit the
    mom instead? How can we program such a decision? Or should the car instead steer
    left and drive off the cliff after calculating that your life is worth less than
    that of the child or the mother’s? Can the driving software be allowed to take
    factors such as age or gender into account in making a decision?


    This seems like an extreme case—trolley problems are thought experiments—however,
    the point is that in many decision-making scenarios, there are multiple possible
    actions with possibly harmful results, and we need to come up with a way to program
    such decisions in machines that is in line with our customary standards of ethics
    and morality.


    Increased intelligence due to machine learning can also be used for outright malicious
    and criminal practices. Pattern recognition technologies such as face or speech
    recognition can be used for mass surveillance. Intelligent robots can use their
    intelligence to become better at killing. Collected data can be analyzed for subversive
    purposes, such as to influence voter decisions. These are some other ethical and
    legal implications of the use of machine learning.


    Another aspect is that making machines more intelligent leads to higher automation
    and therefore job loss. Before, jobs became outdated from one generation to the
    next—for example, sons of blacksmiths became car mechanics—but now it’s happening
    within a generation. Once, people learned a job in their twenties that they did
    with small updates until they retired. Now it seems as if we need to learn a new
    job every ten or fifteen years. To be able to catch up with increasing intelligence
    of the machines, we need to continuously increase our knowledge as well, which
    means that lifelong education programs are going to become more important in the
    future. This also implies that unemployment should lose its social stigma but
    be treated as a normal state of affairs; that time in between is the period when
    the person is learning their next job, their next version, so to speak.


    The next, final chapter will discuss possible future directions of machine learning
    research and applications.


    # 8


    # Where Do We Go from Here?


    ## Make Them Smart, Make Them Learn


    Machine learning has already proved itself to be a viable technology, and its
    applications in many domains are increasing every day. This trend of collecting
    and learning from data is expected to continue even stronger in the near future
    (Jordan and Mitchell 2015). Analysis of data allows us to both understand the
    process that underlies the past data—just like scientists have been doing in different
    domains of science for hundreds of years—and also predict the behavior of the
    process in the future.


    A few decades ago, computing hardware used to advance one microprocessor at a
    time; every new microprocessor—first size 8, then 16, then 32 bits—could do slightly
    more computation in unit time and could use slightly more memory, and this translated
    to slightly better computers. Similarly, computer software used to advance one
    programming language at a time. Each new language made some new type of computation
    easier to program. When computers were used for number crunching, we programmed
    in Fortran; when we used them for business applications, we used Cobol; later
    on, when computers started to process all types of and more complex types of information,
    we developed object-oriented languages that allowed us to define more complicated
    data structures together with the specialized algorithms that manipulate them.


    Then, computing started to advance one operating system at a time; each new version
    made computers easier to use and supported a new set of applications. Today, computing
    is advancing one smart device or one smart app at a time. Once, the key person
    who defined the advance of computing was the hardware designer, then it was the
    software engineer, then it was the user sitting in front of their computer, and
    now it is anyone while doing anything.'
