    # 游戏与现实生活中的强化学习


    ## AlphaGo 及其后继者


    AlphaGo 令人印象深刻的不仅在于其算法，还在于其工程实现的高质量，例如在计算如何分配到并行处理单元方面。AlphaGo 进行并学习的对局数量远超任何人类棋手一生所能下的棋局，而且因为它通过与自己的副本对弈来学习，所以它始终在与一个越来越强的对手博弈，这迫使它不断设计出更巧妙的策略以取胜。


    一个名为 `AlphaGo Zero` 的新版本（Silver 等人，2017）在更少的人类帮助下进行训练。输入仅为原始棋盘，没有任何专门的输入特征，且没有使用人类专家棋局进行初始监督训练。另一个不同之处在于策略网络和价值网络被合并为一个但更深的网络。`AlphaGo
    Zero` 击败了 `AlphaGo`，现在被认为是最强的围棋棋手，无论人机。最近，该方法被泛化为单一的 `AlphaZero` 算法，它不仅能学习下围棋，还能学习下国际象棋和将棋（日本象棋）（Silver
    等人，2018）。


    这些方法之所以有效，是因为街机游戏画面和围棋棋盘都具有二维结构，可由卷积神经网络在不同层级上分析局部特征。`DQN` 和 `AlphaGo` 的成功在于：这种局部特征提取方式与时序差分学习通过端到端训练的深度神经网络无缝耦合在了一起。


    ## 纸牌游戏中的强化学习


    强化学习也被应用于纸牌游戏。`DeepStack` 学会了玩一种双人扑克变体，称为“抢庄无限注德州扑克”。与西洋双陆棋或围棋双方都拥有环境完全信息（即棋盘）不同，在扑克中，除了发牌带来的随机性外，对手的手牌是隐藏的。在这种不完全信息设定下，玩家需要根据对手先前观察到的行动推断其状态并做出相应反应，这允许出现诸如诈唬等复杂策略。`DeepStack`
    使用深度神经网络，在一项涉及 44,000 手牌的研究中击败了职业扑克玩家（Moravcik 等人，2017）。


    `Pluribus` 通过与五个自己的副本对弈，学会了玩六人变体（即有五个对手而非一个）；当与五名职业人类玩家对战，或五个 `Pluribus` 副本对战一名人类时，在
    10,000 手牌的过程中，其表现显著优于人类（Brown 和 Sandholm，2019）。


    另一个重要里程碑是 `AlphaStar`，它学会了玩《星际争霸》，这是一款涉及数千次决策和不完全信息的即时战略游戏。`AlphaStar` 达到了特级大师水平，高于
    99.8% 的官方排名人类玩家（Vinyals 等人，2019）。


    ## 现实生活中的强化学习


    当下一个重要问题是：我们如何从游戏转向现实世界的应用，并使用深度强化学习。游戏是现实生活的简化模拟：其游玩、获胜和失败的规则定义明确；当存在随机性时（例如西洋双陆棋中的骰子），应对双方公平。游戏之所以成为学习的良好测试平台，还因为可以在计算机上极快地模拟游戏，从而非常迅速地收集大量数据。


    相比之下，现实生活充满各种模糊性，存在不同来源的不确定性和传感器噪声；行动需要时间且可能不完美；错误行动导致的损失意味着金钱成本，甚至可能危及人身安全。在模拟游戏中，你可以尝试任何随机行动来看看会有什么结果（实际上时序差分算法的收敛性证明就要求这一点），但在现实生活中你无法这样做。


    强化学习非常适合序列决策任务，在这类任务中我们需要生成一系列决策，且每个决策都会影响后续决策。单个决策本身并非好或坏，因此我们不能总是使用监督学习。但一个决策的优劣取决于其前后所有决策，因此最终评估的是整个决策序列。也可能存在多个决策主体，它们的行动相互影响。


    有许多场景符合这一描述（Li，2019）。在推荐系统中，我们需要为每位客户生成一组推荐；在医疗保健中，我们需要生成正确的治疗决策序列；在经济和金融领域，我们需要生成良好的买入/卖出决策序列，等等。


    一项有趣的工作是 `神经架构搜索` 算法，它将设计最佳神经网络结构转化为一系列关于定义结构和连接性的超参数的决策，奖励是该构建网络的准确率。因此存在一个控制器神经网络，它通过强化学习训练，并学会如何一次一个超参数地构建子网络（Zoph
    和 Le，2016）。


    另一个有趣的应用是调节大规模数据中心内的温度和气流。空气温度通过空水热交换进行调节，可操纵的控制量是风扇转速（控制气流）和阀门开度（控制冷水进出和热水排出）。研究表明，一个几乎没有先验知识的简单模型，通过强化学习仅需几小时的探索训练即可胜任该任务，且具有成本效益（Lazic
    等人，2018）。


    强化学习非常适合序列决策任务，在这类任务中我们需要生成一系列决策，且每个决策都会影响后续决策。


    ## 机器人技术与模仿学习


    机器人技术是强化学习适用的领域，因为完成许多机器人任务需要生成一系列正确的动作。之前我们讨论过机器人在迷宫中寻找目标位置的案例，这是导航的一个特例，例如自动驾驶汽车需要在避开障碍物等约束条件下，从地点
    `A` 找到通往地点 `B` 的路径，同时优化时间等指标。多足机器人需要按正确顺序移动腿部，以便在不跌倒的情况下前进。


    机器人技术与机器学习相遇的一个有趣领域是 `模仿学习`。如果可能的动作很多且需要长序列，学习任务需要大量探索，因此可能很慢。盲目探索也可能很危险，因为某些动作可能对机器人或其环境造成伤害，所以一种可能性是在模拟环境中训练机器人，至少在早期阶段如此。或者，如果有人已经知道如何完成任务，机器人可以通过模仿来学习。例如，我们可以让机械臂通过观察和模仿人类，学习操作其环境中的物体（例如学习将一个物体放在另一个物体上）。


    在 `行为克隆` 中，人类采取的动作被逐步记录并教给机器人；这相当于将整个任务转化为一系列监督学习任务，其中对于每个中间状态，人类的动作定义了所需的输出。例如，可以让专家人类驾驶员在各种路况、交通和天气条件下驾驶，同时记录他们在何种情况下采取何种动作，从而收集大量数据集。然后可以用该数据集训练驾驶程序。


    '
