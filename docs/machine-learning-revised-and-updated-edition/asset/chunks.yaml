- raw: 'Some of the neurons are sensory neurons and take their values from the environment,
    for example, from the sensed image, similar to the receptors in the retina. These
    then are given to other neurons that do some more processing over them in successive
    layers as activation propagates over the network. Finally, there are the output
    neurons that make the final decision and carry out the actions through actuators—for
    example, to move an arm, utter a word, and so on.


    ![](images/13811_007_fig_000.jpg)


    ## Neural Network Learning Algorithms


    In a neural network, learning algorithms adjust the connection weights between
    neurons. An early algorithm was proposed by Hebb (1949) and is known as the *Hebbian
    learning* rule: the weight between two neurons gets reinforced if the two are
    active at the same time—the synaptic weight effectively learns the correlation
    between the two neurons.


    Let us say we have one neuron that checks whether there is a circle in the visual
    field and another neuron that checks whether there is the digit six, ‘6’, in the
    visual field. Whenever we see a six—or are told that it is a six when we are learning
    to read—we also see a circle, so the connection between them is reinforced, but
    the connection between the circle neuron and, say, the neuron for digit seven,
    ‘7’, is not reinforced because when we see one, we do not have the other. So the
    next time we see a circle in the visual field, this will increase the activation
    of the neuron for the digit six but will diminish the activation of the neuron
    for the digit seven, making six a more likely hypothesis than seven.


    In some applications, certain neurons in the network are explicitly designated
    as input units and certain of them as output units. We have a training set that
    contains a sample of inputs and their corresponding correct output values, as
    specified by a supervisor—for example, in estimating the price of a used car,
    we have the car attributes as the input and their prices as the output. In this
    case of supervised learning, we clamp the input units to the input values in the
    training set, let the activity propagate through the network depending on the
    weights and the network structure, and then we look at the values calculated at
    the output units.


    We define an *error function* as the sum of the differences between the actual
    outputs the network estimates for an input and their required values specified
    by the supervisor in the training set; and in neural network training, for each
    training example, we update the connection weights slightly, in such a way as
    to decrease the error for that instance. Decreasing the error implies that the
    next time we see the same or similar input, estimated outputs will be slightly
    closer to their correct values. *Theoretically speaking*, this is nothing but
    the good old regression we discussed in chapter 2, except that here the model
    is *implemented* as a neural network of neurons and connections.


    This is one important characteristic of neural network learning algorithms, namely
    that they can learn *online*, by doing small updates on the connection weights
    as we see training instances one at a time. In *batch* learning, we have the whole
    data set and do training all at once using the whole data. A popular approach
    today involves *mini batches*, where we use small sets of instances in each update.


    Currently with data sets getting larger, online learning is attractive because
    it does not require the collection and the storage of the whole data; we can just
    learn by using one example or a few examples at a time in a streaming data scenario.
    Furthermore, if the underlying characteristics of the data change slowly—as they
    generally do—online learning can adapt seamlessly, without needing to stop, collect
    new data, and retrain.


    ## What a Perceptron Can and Cannot Do


    Though the perceptron was successful in many tasks—remember that the linear model
    works reasonably well in many domains—there are certain tasks that cannot be implemented
    by a perceptron (Minsky and Papert 1969). The most famous of these is the exclusive
    OR (XOR) problem:


    In logic, there are two types of OR, the inclusive OR and the exclusive OR. In
    everyday speech, when we say, “To go to the airport, I will take the bus or the
    train,” what we mean is the exclusive OR. There are two cases and only one of
    them can be true at one time. To represent the inclusive OR, we use the construct
    “and/or,” as in “This fall, I will take Math 101 and/or Phys 101.” In other words,
    I will take Math 101, Phys 101, or both.


    Though the inclusive OR can be implemented by a perceptron, the exclusive OR cannot.
    It is not difficult to see why: if you have two cases, for example, the bus and
    the train, and if you want either to be enough, you need to give each of them
    a weight larger than the threshold so that the neuron fires when any one of them
    is true. But then when both of them are true, the overall activation will be twice
    as high and cannot be less than the threshold.


    Though it was known at that time that tasks like XOR *can* be implemented using
    multiple layers of perceptrons, it was not known how to train such networks; and
    the fact that the perceptron cannot implement a task as straightforward as XOR—which
    can easily be implemented by a few (digital) logic gates—led to disappointment
    and the abandonment of neural network research for a long time, except for a few
    places around the world. It was only in the mid-1980s when the *backpropagation*
    algorithm was proposed to train multilayer perceptrons—the idea had been around
    since the 1960s and 1970s but had gone largely unnoticed—that interest in it was
    revived (Rumelhart, Hinton, and Williams 1986).


    ## Recurrent Networks for Learning Time


    Not all artificial neural networks are feedforward; there are also *recurrent
    networks* where in addition to connections between layers, neurons also have connections
    to neurons in the same layer (including themselves), or even to neurons back to
    the layers that precede them. Each activation calculation causes a certain delay
    so the *recurrent connections* act as a *short-term memory* for contextual information
    and let the network remember the past.


    Let us say that input neuron *A* is connected to neuron *X* and that there is
    also a recurrent connection from *X* to itself (see figure 8). The effect of this
    connection is that at time *t*, the value of *X* will depend on input *A* at time
    *t* and will also depend on the value of *X* at time *t* – 1 because of the recurrent
    connection from *X* to itself. In the next time step, *X* at time *t* + 1 will
    depend on input *A* at time *t* + 1 and also on *X* at time *t* (previously calculated
    using *A* at time *t* and *X* at time *t* – 1), and so on. In this way, the value
    of *X* at any time will have depended on all the inputs seen until then.


    If we define the state of a network as the collection of the values of all the
    neurons at a certain time, recurrent connections allow the current state to depend
    not only on the current input but also on the network state in the previous time
    steps calculated from the previous inputs. So, for example, if we are seeing a
    sentence one word at a time, the recurrence allows the previous words in the sentence
    to be kept in this short-term memory in a condensed and abstract form and hence
    taken into account while processing the current word. The architecture of the
    network and the way recurrent connections are set define how far back and in what
    way the past influences the current output.


    ![](images/13811_008_fig_000.jpg)


    Recurrent neural networks are used in many tasks where the time dimension is important,
    as in speech or language processing, where what we would like to recognize are
    sequences. In a translation of text from one language to another, not only the
    seen input but also the generated output is a sequence.


    ![](images/13811_009_fig_000.jpg)'
