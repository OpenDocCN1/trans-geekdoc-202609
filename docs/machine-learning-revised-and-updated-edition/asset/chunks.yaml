- raw: 'That value, –0.3427, is the *weight* of mileage on price. Not only the value
    but the sign of a weight is also informative. Here, analysis of the data indicated
    that the relationship is negative—as mileage increases price decreases—but in
    another example the weight can be positive; for example, if we have an additional
    attribute for engine power, we will find that price increases with larger engines.
    It may also be the case that the weight estimated from the data turn out to be
    very close to zero; in such a case, we can conclude that the corresponding attribute
    is not important and eliminate it from the model.


    These weights are the *parameters* of the model and are calculated from the data.
    The model is always fixed; it is the parameters that are adjustable, and it is
    this process of adjustment to better match the data that we call learning.


    The linear model is very popular because it is simple; it has few parameters and
    it is easy to calculate a weighted sum. It is easy to understand and interpret.
    Furthermore, it works surprisingly well for a lot of different tasks.


    No matter how we vary its parameters, each model can only be used to learn a set
    of problems and *model selection* refers to the task of choosing between models.
    Selecting the right model is a more difficult task than optimizing the parameters
    of a given model, and information about the application is helpful.


    For instance, here, in estimating car prices, the linear model may not be applicable
    if the range is long. It has been seen empirically that the effect of the age
    is not arithmetic but geometric: each additional year does not decrease the price
    by the same amount, but a typical vehicle loses 15 percent of its value each year.[1](#13811-0015.xhtml#en7)
    In later sections, we discuss some machine learning algorithms that use nonlinear
    models that are more powerful, in the sense that they can be used in a larger
    variety of applications.


    Here, it may be a good idea to point out the difference between machine learning
    and the usual treatment of data in databases. Table 1 may have been drawn from
    a database, containing probably not only the mileage and the price, but all sorts
    of other information about the cars and maybe also their owners. Given such a
    database, one can make a query such as, “What is the price of the car with 20,000
    miles?” and find that it is 32,000 US dollars. With a database, we only have information
    and care about those particular cars; a query such as “What is the price of the
    car with 25,000 miles?” is not meaningful because there is no such car in the
    database.


    In the case of machine learning, or statistics in general, we consider the data
    in table 1 as a *sample*, drawn from the *population* of all used cars. We assume
    that there is an underlying process whereby cars lose value as they are driven,
    but we do not know how this process works, and we want to extract it from examples.
    We cannot possibly access all possible cars in the population and record the mileage
    and price of all of them; the ones we have access to make up a small subset which
    is our sample. From a statistical point of view, we do not particularly care about
    this particular sample, there can be mistakes in it, or it could just have been
    a different sample; what we care about is the population from which any sample
    is drawn. And the advantage of learning, namely, going from the particular sample
    to the general population, is that now we can query it with 25,000 miles, which
    is equivalent to asking, “What would be the price of a *typical* car with 25,000
    miles?” where “typical” means averaged over all used cars with 25,000 miles.


    ## Supervised Learning


    This task of estimating a numeric output value from a set of input values is called
    *regression* in statistics; for the linear model, we have linear regression. In
    machine learning, regression is one type of *supervised learning*. In this type
    of learning, for each example we have the input and the desired output. The name
    comes from the supposition that there is a *supervisor* who can provide us with
    the desired output for any input. When we collect data by looking at the cars
    currently sold in the market, we are able to observe both the attributes of the
    cars and also their prices.


    Earlier, we used the linear model with its weight parameters. Each model corresponds
    to a certain type of dependency assumption between the inputs and the output.
    Learning corresponds to adjusting the parameters so that the model makes the most
    accurate predictions on the data. In the general case, learning implies getting
    better according to a performance criterion, and in regression, performance depends
    on how close the model predictions are to the observed output values in the training
    data. The assumption here is that the training data is large and diverse enough
    to cover sufficiently well the characteristics of the underlying task, so a model
    that works accurately on the training data can be said to have learned the task.


    The different machine learning algorithms we have in the literature either differ
    in the models they use, or in the performance criteria they optimize, or in the
    way the parameters are adjusted during this optimization.


    At this point, we should remember that the aim of machine learning is rarely to
    replicate the training data but the correct prediction of new cases. If there
    were only a certain number of possible cars in the market and if we knew the price
    for all of them, then we could simply store all those values and do a table lookup;
    this would be *memorization*. But frequently (and this is what makes learning
    interesting), we see only a small subset of all possible instances and from that
    data, we want to *generalize*—that is, we want to learn a general model that goes
    beyond the training examples to also make good predictions for inputs not seen
    during training.


    Having seen only a small subset of all possible cars, we would like to be able
    to predict the right price for a car outside the training set, one for which the
    correct output was not given in the training set. How well a model trained on
    the training set predicts the right output for such new instances is called the
    *generalization ability* of the model and the learning algorithm.


    The basic assumption we make here (and it is this assumption that makes learning
    possible) is that similar cars have similar prices, where similarity is measured
    in terms of the input attributes we choose to use. As the values of these attributes
    change slowly—for example, as mileage changes—price is also expected to change
    slowly. There is smoothness in the output in terms of the input, and that is what
    makes generalization possible. Without such regularity, we cannot go from particular
    cases to a general model, as then there would be no basis in the belief that there
    can be a general model that is applicable to all cases, both inside and outside
    the training set.


    Not only for the task of estimating the price of a used car, but for many tasks
    where data is collected from the real world, be they for business applications,
    pattern recognition, or science, we see this smoothness. Machine learning, and
    prediction, is possible because the world has regularities. Things in the world
    change smoothly. This is Leibniz’s dictum that “Nature does not make jumps.” We
    are not “beamed” from point A to point B, but we need to pass through a sequence
    of intermediate locations. Objects occupy a continuous block of space in the world.
    Nearby points in our visual field belong to the same object and hence mostly have
    shades of the same color. Sound too, whether in song or speech, changes smoothly.
    Discontinuities correspond to boundaries, and they are rare. Most of our sensory
    systems make use of this smoothness; what we call visual illusions, such as the
    Kanizsa triangle (see figure 2), are due to the smoothness assumptions of our
    sensory organs and brain.[2](#13811-0015.xhtml#en8)'
