- raw: 'In certain applications and with certain models, we may have some *prior belief*
    about the possible values of parameters. When we toss a coin, we expect it to
    be a fair coin or close to being fair, so we expect the probability of heads to
    be close to ½; in estimating the price of a car, we expect mileage to have a negative
    effect on the price. Bayesian methods allow us to take such prior beliefs into
    account in estimating the parameters.[5](#13811-0015.xhtml#en15) The idea in *Bayesian
    estimation* is to use that prior knowledge together with the data to calculate
    a *posterior distribution* for the parameters. Let us see an example.


    Assume we want to estimate the probability that people will click a certain link
    on our company’s webpage; toward that end, we collect a sample of ten visitors
    and find that six of them have clicked on the link. The usual approach would be
    to say that the probability is 0.6 and use it for any further calculations and
    processing based on that value.


    Now we can see that the actual probability could actually have been 0.5 and that
    it was just luck that we had seen six clicks in that particular sample of ten.
    It is even possible (though much less possible) that the actual probability is
    0.1 and that a rare event occurred and we got six clicks. So what we can really
    get from the data is not just one value (0.6) but a list of possible values where
    for each we also have an additional value of how well the data supports it; this
    is what we mean by the posterior distribution. Once we have such a posterior distribution,
    we do further calculations using all (or a reasonable subset of) possible values
    and use their average, each weighted by how likely that value is.


    The Bayesian approach is especially useful when the data set is small. If we see
    60 clicks in 100 trials, the range of probable values around 0.6 will be much
    smaller.


    Though the Bayesian approach is flexible and interesting, it has the disadvantage
    that except for simple scenarios under restrictive assumptions, the necessary
    calculation is too complex. One possibility is that of *approximation* where instead
    of the real posterior distribution that we cannot easily handle, we use one that
    is similar but manageable. Another possibility is *sampling* where instead of
    using the distribution itself, we generate representative instances from the distribution
    and make our inferences based on them. The popular methods for these—namely, *variational
    approximation* for the former, and *Markov chain Monte Carlo* (MCMC) *sampling*
    for the latter—are among important current research directions in machine learning.


    The Bayesian approach allows us to incorporate our prior beliefs in training.
    One prior belief is that the underlying problem is smooth, which makes us prefer
    simpler models; remember our discussion of Occam’s razor and the Kanizsa triangle
    from chapter 2. In *regularization*, we penalize complexity, and during training,
    in addition to maximizing our fit to the data, we also try to minimize the model
    complexity. While learning, we also get rid of those parameters that make the
    model unnecessarily complex and the output too variant. This implies a learning
    scheme that involves not only the adjustment of parameters but also changes to
    the model structure. Or we can go in the other direction and add complexity incrementally
    when we suspect we have a model that is too simple for the data.


    The use of such *nonparametric* approaches in Bayesian estimation is especially
    interesting because we are no longer constrained by some parametric model class,
    but the model complexity also changes dynamically to match the complexity of the
    task in the data (Orbanz and Teh 2010). This implies a model of “infinite size,”
    because it can be as complex as we want—it grows when it learns.


    One model family that works quite well in many domains is the artificial neural
    network that is inspired from the human brain; in the next chapter, we will discuss
    how such networks are organized in layers and how such “deep” networks can be
    trained.


    # 4


    # Neural Networks and Deep Learning


    ## Artificial Neural Networks


    Our brains make us intelligent; we see or hear, learn and remember, plan and act
    thanks to our brains. In trying to build machines to have such abilities then,
    our immediate source of inspiration is the human brain, just as birds were the
    source of inspiration in our early attempts to fly. What we would like to do is
    to look at how the brain works and try to come up with an understanding of how
    it does what it does. But we want to have an explanation that is independent of
    the particular implementation details—this is what we called the *computational
    theory* when we discussed levels of analysis in chapter 1. If we can extract such
    an abstract, mathematical description, we can later implement it with what we
    have at our disposal as engineers—for example, in silicon and running on electricity.


    Early attempts to build flying machines failed until we understood the theory
    of aerodynamics; only then we could build airplanes. Today, we see birds and airplanes
    as two different ways of flying—we call them airplanes now, not artificial birds,
    and they can do more than birds can; they cover longer distances and carry passengers
    or cargo. The idea is to accomplish the same for intelligence, and we start by
    getting inspired by the brain.


    The human brain is composed of a very large number of processing units, called
    *neurons*, and each neuron is connected to a large number of other neurons through
    connections called *synapses*. Neurons operate in parallel and transfer information
    among themselves over these synapses. It is believed that the processing is done
    by the neurons and memory is in the synapses, that is, in the way the neurons
    are connected and influence each other.


    Research on *neural networks* as models for analog computation—neuron outputs
    are not discrete, 0 or 1, but when they are activated they fire at a frequency
    which is a continuous value—started as early as research on digital computation
    (McCulloch and Pitts 1943) but, after the quick success and widespread use of
    digital computers, went largely unnoticed for a long time.


    In the 1960s, the *perceptron* model was proposed as a model for pattern recognition
    (Rosenblatt 1962). It is a network composed of artificial neurons and synaptic
    connections, where each neuron has an activation value, and a connection from
    neuron *A* to neuron *B* has a weight that defines the effect of *A* on *B*. If
    the synapse is excitatory, when *A* is active it also tries to activate *B*; if
    the synapse is inhibitory, when *A* is active it tries to suppress *B*.


    During operation, each neuron sums up the activations from all the neurons that
    make a synapse with it, weighted by their synaptic weights, and if the total activation
    is larger than a threshold value, the neuron “fires” and its output corresponds
    to the value of this activation; otherwise the neuron is silent. If the neuron
    fires, it sends its activation value in turn down to all the neurons with which
    it makes a synapse (see figure 7).


    The perceptron basically calculates a weighted sum before making a decision, and
    this can be seen as one way of implementing a variant of the linear model we discussed
    earlier. Such neurons can be organized as layers where all the neurons in a layer
    take input from all the neurons in the previous layer and calculate their value
    in parallel, and these values together are fed to all the neurons in the layer
    that follows—this is called a *multilayer perceptron*.'
