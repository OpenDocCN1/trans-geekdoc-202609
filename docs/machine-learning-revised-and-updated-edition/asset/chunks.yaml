  trans: '

    # 更复杂的循环连接


    更复杂类型的循环连接也是可能的。在长短期记忆（`LSTM`）单元（Hochreiter 和 Schmidhuber，1997）中，存在一个“遗忘门”，这种效应可以在此开启或关闭（见图
    9）。因此，根据门开启和关闭的位置及方式，网络可以选择性地决定从过去记住什么。


    例如，比较以下两个句子：


    物主代词是 "his" 还是 "her" 取决于主语的性别，即进入房间的人是男性还是女性。因此，在逐词生成此类句子时（例如生成翻译时），网络应在处理句首的主语词时存储该性别信息，并保持其完整（不受后续无关词汇影响），直到生成正确的代词。


    # 认知科学中的连接主义模型


    人工神经网络模型在认知心理学和认知科学中被称为 `connectionist`（连接主义）或 `parallel distributed processing`（`PDP`，并行分布式处理）模型（Feldman
    和 Ballard，1982；Rumelhart、McClelland 和 PDP 研究组，1986）。其核心思想是：神经元对应概念，神经元的激活对应我们当前对该概念真实性的信念程度。连接对应概念间的约束或依赖关系：如果两个概念同时出现（例如，圆形和
    ''6'' 的神经元之间），连接具有正权重且是兴奋性的；如果两个概念互斥（例如，圆形和 ''7'' 的神经元之间），连接具有负权重且是抑制性的。


    被观测数值的神经元（例如，通过感知环境）会影响其连接的神经元，后者又会影响它们连接的神经元，以此类推。这种贯穿整个网络的活动传播，导致神经元输出达到一种满足连接所定义约束的状态。


    连接主义模型的基本思想是：智力是一种 `emergent property`（涌现属性），高级任务（如模式识别或联想）作为相互连接的简单处理单元进行这种活动传播的基本操作的结果而自动产生。同样，学习也是在连接层面通过简单操作完成的，例如根据
    Hebb 规则，而无需高级程序员的介入。


    连接主义网络关注生物学合理性，但仍是大脑的抽象模型；例如，大脑中极不可能为每个概念都有一个实际的神经元——这就是 `grandmother cell`（祖母细胞）理论，该理论认为我的大脑中有一个神经元，仅当我看到或想到我的祖母时才被激活——这是一种
    `local representation`（局部表示）。已知大脑中的神经元会死亡并诞生新神经元，因此更合理的观点是：概念在神经元簇上具有 `distributed
    representation`（分布式表示），并拥有足够的冗余度，使得概念能在底层神经元结构发生物理变化时依然存续。


    智力是一种 `emergent property`（涌现属性），识别等任务作为简单处理单元网络上活动传播的结果而自动产生。


    # 神经网络作为并行处理的范式


    自 20 世纪 80 年代以来，拥有数千个处理器的计算机系统已商业化。然而，此类并行架构的软件发展速度并未像硬件那样迅速。原因在于，直到那时，我们几乎所有的计算理论都基于串行、单处理器机器。我们无法充分发挥并行机器的性能，因为我们无法高效地为它们编程。


    `parallel processing`（并行处理）主要有两种范式。在 `single instruction, multiple data`（`SIMD`，单指令多数据流）机器中，所有处理器执行相同指令但处理不同数据片段。在
    `multiple instruction, multiple data`（`MIMD`，多指令多数据流）机器中，不同处理器可在不同数据上执行不同指令。`SIMD`
    机器更易编程，因为只需编写一个程序。然而，问题很少具有如此规则的结构以便在 `SIMD` 机器上并行化。`MIMD` 机器更通用，但为所有单独处理器编写独立程序并非易事；还会出现与同步、处理器间数据传输等相关的额外问题。`SIMD`
    机器也更易构建，若采用 `SIMD` 架构可构建拥有更多处理器的机器。在 `MIMD` 机器中，处理器更复杂，必须构建更复杂的通信网络以便处理器任意交换数据。


    假设我们拥有的机器，其处理器比 `SIMD` 处理器稍复杂，但不如 `MIMD` 处理器复杂。假设我们有简单的处理器，带有少量可存储参数的局部存储器。每个处理器实现固定功能并执行与
    `SIMD` 处理器相同的指令；但通过向其局部存储器加载不同的值，每个处理器可执行不同操作，整体运算可分布在这些处理器上。我们将得到可称为 `neural
    instruction, multiple data`（`NIMD`，神经指令多数据流）机器，其中每个处理器对应一个神经元，局部参数对应其突触权重，整体结构即为神经网络。若每个处理器实现的功能简单且局部存储器较小，则可在单芯片上集成许多此类处理器。


    现在的问题是如何将任务分布到此类处理器网络上，并确定局部参数值。学习由此发挥作用：若此类机器能从示例中学习，我们无需自行编程并确定参数值。


    因此，人工神经网络是利用当前技术可构建的并行硬件的一种方式——得益于学习——它们无需编程。因此，我们也省去了为它们编程的精力。


    # 多层中的分层表示


    前面我们提到，单层感知机无法实现某些任务（如 `XOR`），而多层则不存在此类限制。实际上，已证明多层感知机是 `universal approximator`（通用逼近器），即给予足够神经元，它可以任意精度逼近任何函数——尽管通过训练使其完成这一点并不总是直接了当。


    感知机算法仅能训练单层网络，但 20 世纪 80 年代 `backpropagation algorithm`（反向传播算法）的发明使得训练多层感知机成为可能，这在各个领域引发了大量应用，显著加速了从认知科学到计算机科学和工程等众多领域的神经网络研究。


    人工神经网络是利用当前技术可构建的并行硬件的一种方式——得益于学习——它们无需编程。


    多层网络符合直觉，因为它对应着操作层：我们从原始输入开始，逐步执行更复杂的变换，直到得到输出。

    '
