- raw: 'Going from particular examples to general concepts is called *induction*.
    Over the course of our lives, we see many trees at different times in different
    places, all slightly different from the other trees in some respects; yet, at
    the same time, they also all have something in common, and it is this set of common
    properties that defines our general definition of “treeness.” That general concept
    is stored in our mind so that when we see a new object, we can say whether it
    is a tree or not depending on how well that object matches our learned definition
    of “treeness.”


    Almost all of science is fitting general models to data. Scientists—such as Galileo,
    Newton, and Mendel—designed experiments, made observations, and collected data.
    They then tried to extract knowledge by devising theories, that is, by building
    models to explain the data they observed.[5](#13811-0015.xhtml#en6) They then
    used these theories to make predictions and if they didn’t work, they collected
    more data and revised the theories. This process of data collection and theory/model
    building continued until they got models that had enough explanation power.


    We are now at a point where this type of data analysis can no longer be done manually,
    because people who can do such analysis are rare; furthermore, the amount of data
    is huge and manual analysis is not possible. There is thus a growing interest
    in computer programs that can analyze data and extract information automatically
    from them—in other words, learn.


    The methods that we discuss have their origins in different scientific domains.
    It was not uncommon that sometimes the same or very similar algorithms were independently
    invented in different fields following different historical paths.


    The main theory underlying machine learning comes from statistics, where going
    from particular observations, called the *sample*, to general descriptions of
    the *population*, is called *inference* and learning is called *estimation*. Classification
    is called *discriminant analysis* in statistics. Statisticians used to work on
    small samples and, being mathematicians, mostly worked on simple models that could
    be analyzed mathematically. In engineering, classification is called pattern recognition
    and the approach is more empirical.


    In computer science, as part of work on artificial intelligence, research was
    done on learning algorithms; a parallel but almost independent line of study was
    called *knowledge discovery in databases.* In electrical engineering, research
    in signal processing resulted in adaptive image processing and speech recognition
    programs.


    In the mid-1980s, a huge explosion of interest in artificial neural network models
    from various disciplines took place. These disciplines included physics, statistics,
    psychology, cognitive science, neuroscience, and linguistics, not to mention computer
    science, electrical engineering, and adaptive control. Perhaps the most important
    contribution of research on artificial neural networks is this synergy that bridged
    various disciplines, especially statistics and computer science. The fact that
    neural network research, which later led to the field of machine learning, started
    in the 1980s is not accidental. At that time, with advances in VLSI (very large-scale
    integration) technology, we gained the capacity to build parallel hardware containing
    thousands of processors, and artificial neural networks was of interest as a possible
    theory to distribute computation over a large number of processing units, all
    running in parallel. Furthermore, because they could learn from data, they would
    not need programming.


    As we will discuss in chapter 4, a neural network is composed of layers of processing
    units, each checking for a particular condition in the input and with successive
    layers checking for more abstract conditions. Already in early 1990s, we witnessed
    successful neural network applications; two that stand out were LeCun’s *LeNet*
    network for recognizing handwritten digits and Tesauro’s *TD-Gammon* network that
    played backgammon. In this last decade with more data and computing power available,
    we have been seeing many impressive applications of “deep” neural networks composed
    of sometimes hundreds of such layers. So, for example, networks deeper than *LeNet*
    are now being used in face recognition, and a network deeper than *TD-Gammon*
    has learned to play Go. The recent tectonic interest in machine learning and artificial
    intelligence is largely due to such successes with deep neural networks. Such
    successes unfortunately have also led to unrealistic claims and far-fetched extrapolations.


    Machine learning is at the intersection of statistics and computer science, occasionally
    also taking inspiration from cognitive science and neuroscience. Research in these
    different communities followed different paths in the past with different emphases.
    Our aim in this book is to bring them together to give a unified introductory
    treatment of the field, together with some interesting applications, devoid, as
    much as possible, of hype.


    Now, let us start discussing the basic concepts and applications of machine learning.


    # 2


    # Machine Learning, Statistics, and Data Analytics


    ## Learning to Estimate the Price of a Used Car


    We saw in the previous chapter that we use machine learning when we believe there
    is a relationship between the observations of interest but do not know how. Because
    we do not know its exact form, we cannot just go ahead and write down the computer
    program. So our approach is to collect data of example observations and to analyze
    it to discover the relationship. Now, let us discuss further what we mean by a
    relationship and how we extract it from data; as always, it is a good idea to
    use an example to make the discussion concrete.


    Consider the problem of estimating the price of a used car. This is a good example
    of a machine learning application because we do not know the exact formula for
    this; at the same time, we know that there should be some rules: the price depends
    on the properties of the car, such as its brand; it depends on usage, such as
    mileage; and it even depends on things that are not directly related to the car,
    such as the current state of the economy.


    Though we can identify these as the factors, we do not know exactly how they affect
    the price. For example, we know that, on average, as mileage increases price decreases,
    but we do not know how quickly this occurs. How these factors are combined to
    determine the price is what we do not know; luckily, we have data to help us.
    We can look at a number of cars currently in the market, record their attributes
    and how much they go for, and then we can try to learn the specifics of the relationship
    between such attributes and the price.


    In doing that, the first question is to decide what to use as the *input representation*,
    that is, the attributes that we believe have an effect on the price of a used
    car. Those that immediately come to mind are the make and model of the car, its
    year of production, and its mileage. You can think of others too, but such attributes
    should be easy to record.


    One important fact is that there can be two different cars having exactly the
    same values for these attributes, yet they can still go for different prices.
    This is because there are other factors that have an effect, such as accessories.
    There may also be factors that we cannot directly observe and hence cannot include
    in the input—for example, all the conditions under which the car has been driven
    in the past and how well the car has been maintained.


    The crucial point is that no matter how many properties we list as input, there
    are always other factors that affect the output; we cannot possibly record and
    take all of them as input, and all these other factors that we neglect introduce
    uncertainty.'
