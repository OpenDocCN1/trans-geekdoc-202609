- raw: 'As any new technology, since we have started using machine learning in the
    real world, we have started to face its concomitant challenges and risks. So this
    new edition has a new chapter, chapter 7, for topics that have become increasingly
    important since 2016 when the first edition appeared. These include ethical and
    legal implications of automated decision making, concerns over data privacy and
    security, possible biases in training data, the need for explainability, and others.


    Chapter 8 concludes by discussing some future directions and the newly proposed
    field of “data science” that also encompasses high-performance cloud computing.


    This book aims to give a quick introduction to what is being done today in machine
    learning, and my hope is to trigger the reader’s interest in thinking about what
    can be done in the future. Machine learning is certainly one of the most exciting
    scientific fields today, advancing technology in various domains, and it has already
    generated a set of impressive applications affecting all walks of life. I have
    enjoyed very much writing this book; I hope you will enjoy reading it too!


    I am grateful to the anonymous reviewers for their constructive comments and suggestions.
    As always, it has been a pleasure to work with the MIT Press and I would like
    to thank the anonymous reviewers, Kathleen Caruso, and Marie Lufkin Lee for all
    their support.


    # 1


    # Why We Are Interested in Machine Learning


    ## The Power of the Digital


    Some of the biggest transformations in our lives in the last half century are
    due to computing and digital technology. The tools, devices, and services we had
    invented and developed in the centuries before have been increasingly replaced
    by their computerized “e-” versions, and we in turn have been continuously adapting
    to this new digital environment.


    This transformation has been very fast: once upon a time—fifty years ago is mythical
    past in the digital realm where things happen at the speed of light—computers
    were expensive and only very large organizations, such as governments, big companies,
    universities, research centers, and so on, could afford them. At that time, only
    they had problems difficult enough to justify the high cost of procuring and maintaining
    a computer. Computer “centers,” in separate floors or buildings, housed those
    power-hungry behemoths, and inside large halls, magnetic tapes whirred, cards
    were punched, numbers were crunched, and bugs were real bugs.


    As computers became cheaper, they became available to a larger selection of the
    population and in parallel, their application areas widened. In the beginning,
    computers were nothing but calculators—they added, subtracted, multiplied, and
    divided numbers to get new numbers. Probably the major driving force of the computing
    technology is the realization that every piece of information can be represented
    as numbers. This in turn implies that the computer, which until then was used
    to process numbers, can be used to process all types of information.


    To be more precise, a computer represents every number as a particular sequence
    of binary digits (bits) of 0 or 1, and such bit sequences can also represent other
    types of information. For example, “101100” can be used to represent the decimal
    44 *and* is also the code for the comma; likewise, “1000001” is both 65 and the
    uppercase letter ‘A’.[1](#13811-0015.xhtml#en2) Depending on the context, the
    computer program manipulates the sequence according to one of the interpretations.


    Actually, such bit sequences can stand for not only numbers and text, but also
    other types of information—for example, colors in a photo or tones in a song.
    Even computer programs are sequences of bits. Furthermore, and just as important,
    operations associated with these types of information, such as making an image
    brighter or finding a face in a photo, can be converted to commands that manipulate
    bit sequences.


    ## Computers Store Data


    The power of the computer lies in the fact that every piece of information can
    be represented digitally—that is, as a sequence of bits—and every type of information
    processing can be written down as computer instructions that manipulate such digital
    representations.


    One consequence of this emerged in the 1960s with *databases*, which are specialized
    computer programs that store and manipulate *data*, or digitally represented information.
    Peripheral devices, such as tapes or disks, store bits magnetically, and hence
    their contents are not erased when the computer is switched off.


    With databases, computers have moved beyond processing and have become repositories
    of information using the digital representation. In time, the digital medium has
    become so fast, cheap, and reliable that it has supplanted printing on paper as
    humanity’s main means of information storage.


    After the invention of the microprocessor and parallel advances in miniaturization
    and decreasing costs, personal computers became increasingly available starting
    in the early 1980s. The *personal computer* has made computing accessible to small
    businesses, but most important the personal computer was small and cheap enough
    to be a household appliance. You did not need to be a large company; the computer
    could help with your life too. The personal computer confirmed that everyone had
    tasks that are computer-worthy, and the growth of applications followed this era
    of democratization of digital technology.


    Graphical user interfaces and the mouse made the personal computer easy to use.
    We do not need to learn programming, or memorize commands with a difficult syntax,
    to be able to use the computer. The screen is a digital simulacrum of our work
    environment displaying a virtual desktop, with files, icons, and even a trash
    can, and the mouse is our virtual hand that picks them up to read or edit them.


    The software for the personal computer in parallel has moved from commercial to
    personal applications by manipulating more types of data and making more of our
    lives digital. We have a word processor for our letters and other personal documents,
    a spreadsheet for our household calculations, and software for our hobbies such
    as music or photography; we can even play games if we want to! Computing has become
    everyday and fun.


    The personal computer with its pleasant and inviting user interface coupled with
    a palette of everyday applications was a big step in the rapprochement between
    people and computers, our life as we used to know it, and the digital world. Computers
    were programmed to fit our lives a little better, and we have adapted a little
    to accommodate them. In time, using a computer has become a basic skill, like
    driving.


    The personal computer was the first step in making computers accessible to the
    masses; it made digital technology a larger part of our lives and, most important
    for our story in this book, allowed more of our lives to be recorded digitally.
    As such, it was a significant steppingstone in this process of converting our
    lives to data, data that we can then analyze and learn from.


    ## Computers Exchange Data


    The next major development in computing was in connectivity. Though hooking up
    computers by data links to exchange information had been done before, commercial
    systems started to become widespread in 1990s to connect personal computers to
    each other or to central servers over phone or dedicated lines.


    The computer network implies that a computer is no longer isolated but can exchange
    data with a computer far away. A user is no longer limited to their own data on
    their own computer but can access data elsewhere, and if they want, they can make
    their data available to other users.'
