    This type of uncertainty underlies games of chance, which makes gambling a thrill
    for some people. But most of us do not like uncertainty, and we try to avoid it
    in our lives, at some cost if necessary. For example, if the stakes are high,
    we buy insurance—we prefer the certainty of never losing a large amount of money
    (due to accidental loss of something of high worth) to the cost of paying a small
    premium, even if the event is very unlikely.


    The price of a used car is similar in that there are uncontrollable factors that
    make the depreciation of a car a random process. Two cars following one another
    on the production line are exactly the same at that point and hence are worth
    exactly the same. Once they are sold and start being used, all sorts of factors
    start affecting them: one of the owners may be more meticulous, one of the cars
    may be driven in better weather conditions, one car may have been in an accident,
    and so on. Each of these factors is like a random coin toss that varies the price.


    A similar argument can also be made for customer behavior in retail. We expect
    customers in general to follow certain patterns in their purchases depending on
    factors such as the composition of their household, their tastes, their income,
    and so on. Still, there are always additional random factors that introduce variance:
    vacation, change in weather, some catchy advertisement, and so on. As a result
    of this randomness, we cannot estimate exactly which items will be purchased next,
    but we can calculate the probability that an item will be purchased. Then if we
    want to make predictions, we can just choose the items whose probabilities are
    the highest.


    ## Learning a General Model


    Whenever we collect data, we need to collect it in such a way as to learn general
    trends. For example, in representing a car, if we use the brand as an input attribute,
    we define a very specific car. But if we instead use general attributes such as
    the number of seats, engine power, trunk volume, and so forth, we can learn a
    more general estimator. This is because different models and makes of cars all
    appeal to the same type of customer, called a customer segment, and we would expect
    cars in the same segment to depreciate similarly. Ignoring the brand and concentrating
    on the basic attributes that define the segment is equivalent to using the same,
    albeit noisy, data instance for all such cars of the same type; it effectively
    increases the size of our data.


    A similar argument can also be made for the output. Instead of estimating the
    price as is, it makes more sense to estimate the percentage of its original price,
    that is, the effect of depreciation. This again allows us to learn a more general
    model.


    Though of course it is good to learn models that are general, we should not try
    to learn models that are too general. For example, cars and trucks have very different
    characteristics, and it is better to collect data separately and learn different
    models for the two than to collect data and try to learn a single model covering
    both.


    Another important fact is that the underlying task may change in time. For example,
    the price of a car depends not only on the attributes of the car, the attributes
    representing its past usage, or the attributes of the owner, but also on the state
    of the economy, that is, the price of other things. If the economy, which is the
    environment in which we do all our buying and selling, undergoes significant changes,
    previous trends no longer apply. Statistically speaking, the properties of the
    random process that underlie the data have changed—we are given a new set of coins
    to toss. In this case, the previously learned model does not hold anymore, and
    we need to collect new data and learn again; or, if we have a mechanism for getting
    feedback about our performance, we can fine-tune the model as we continue to use
    it.


    ## Model Selection


    One of the most critical points in learning is the `model` that defines the template
    of the relationship between the inputs and the output. For example, if we believe
    that we can write the output as a weighted sum of the attributes, we can use a
    `linear model` where attributes have an additive effect.


    Let us see an example. Assume we only take mileage as our input attribute and
    that we collect the data given in table 1. We have seven cars whose mileage and
    price values are recorded. We can fit a linear model to that data; that is, we
    draw the line that passes as close as possible to those data points. Figure 1
    shows the data points and the fitted line. That linear model is written as


    Table 1 The example data set is composed of seven cars, each with its mileage
    (in miles) and price (US dollars). The index is just to name them; the order of
    the cars is not important.


    | Index | Mileage | Price |

    | --- | --- | --- |

    | 1 | 9,000 | 38,500 |

    | 2 | 95,000 | 6,000 |

    | 3 | 20,000 | 32,000 |

    | 4 | 60,000 | 15,000 |

    | 5 | 15,000 | 35,000 |

    | 6 | 30,000 | 27,000 |

    | 7 | 90,000 | 12,000 |


    ```

    y = 39258 – 0.3427x

    ```


    where `x` denotes the mileage and `y` denotes the estimated price. The line starts
    at 39,258 US dollars—that is the estimate for a car with 0 miles—and every additional
    mile decreases the price by 34.27 cents, or equivalently, every additional 10,000
    miles driven pulls the price down by 3,427 US dollars.


    ![](images/13811_001_fig_000.jpg)

    '
  trans: '

    这种不确定性的影响在于，我们无法再估算出一个确切的价格，但可以估算出一个未知价格可能落在其中的 `interval`（区间），而该区间的长度取决于不确定性的大小——它定义了由于那些我们无法或不能作为输入的因素，价格能变动多少。


    ## 随机性与概率


    在数学和工程学中，我们使用 `probability theory`（概率论）来建模不确定性。在确定性系统中，给定输入，输出总是相同的；而在随机过程中，输出还取决于引入随机性的不可控因素。


    以抛硬币为例。有人可能会声称，如果我们掌握了诸如硬币的确切成分、初始位置、抛掷时施加力的大小、位置和方向、接住硬币的地点和方式等知识，抛掷的结果就可以被精确预测；但由于所有这些信息对我们都是隐藏的，我们只能谈论抛掷结果的概率。我们不知道结果是正面还是反面，但我们可以对每种结果的概率做些说明，这是衡量我们认为该结果发生可能性大小的一个指标。例如，如果硬币是均匀的，正面和反面的概率相等——如果我们抛很多次，预期看到的正面和反面次数大致相同。


    如果我们不知道这些概率并想要 `estimate`（估计）它们，那么我们就进入了 `statistics`（统计学）的领域。我们遵循通用术语，将每个数据实例称为“样本”（example），并保留“样本集”（sample）一词专指此类样本的
    `collection`（集合）。目标是建立一个 `model`（模型）来解释生成样本集的过程。在抛硬币的例子中，我们通过抛硬币若干次并记录结果——正面或反面——作为观测值来收集样本集。然后，我们对正面概率的估计量可以简单地取为样本集中正面出现的比例——如果我们抛六次硬币，在样本集中看到四次正面和两次反面，我们就将正面的概率估计为
    ⅔（因此反面的概率为 ⅓）。接着，如果让我们猜测下一次抛掷的结果，我们的估计将是正面，因为它是概率较大的结果。


    这种类型的不确定性构成了机会游戏的基础，这使得赌博对某些人充满刺激。但我们大多数人不喜欢不确定性，并试图在生活中避免它，必要时甚至不惜代价。例如，如果赌注很大，我们会购买保险——我们更倾向于确定地永远不会损失一大笔钱（因意外丢失高价值物品），而不是支付一小笔保费，即使该事件发生的可能性很小。


    二手车的价格也类似，存在不可控因素使得汽车折旧成为一个随机过程。生产线上前后相随的两辆车在此时完全相同，因此价值也完全相同。一旦售出并开始使用，各种因素便开始影响它们：车主可能一个更爱惜车，一辆车可能在更好的天气条件下行驶，一辆车可能出过事故，等等。这些因素中的每一个都像一次随机的抛硬币，改变着价格。


    零售业中的顾客行为也可以用类似的论证。我们总体上期望顾客根据家庭构成、喜好、收入等因素，在购买时遵循特定模式。尽管如此，总会有额外的随机因素引入方差：度假、天气变化、某个吸引人的广告，等等。由于这种随机性，我们无法确切估计下一件将购买的商品，但可以计算某件商品被购买的概率。然后，如果我们想做预测，只需选择概率最高的商品即可。


    ## 学习通用模型


    每当我们收集数据时，都需要以一种能够学习到一般趋势的方式来收集。例如，在表示汽车时，如果我们使用品牌作为输入属性，就定义了一款非常具体的车。但如果我们改用座位数、发动机功率、后备箱容积等通用属性，就能学习到一个更通用的估计器。这是因为不同型号和品牌的汽车都吸引同一类顾客，称为顾客细分市场，我们预期同一细分市场中的汽车折旧情况相似。忽略品牌而专注于定义细分市场的基本属性，等同于将同一（尽管有噪声的）数据实例用于所有此类同类型汽车；这实际上增加了我们的数据量。


    对于输出也可以提出类似的论证。与其直接估计价格，不如估计其占原价的百分比，即折旧的影响。这同样能让我们学习到一个更通用的模型。


    当然，学习通用模型是好的，但我们不应试图学习过于通用的模型。例如，轿车和卡车具有截然不同的特征，最好分别收集数据并为两者学习不同的模型，而不是收集数据试图学习一个涵盖两者的单一模型。


    另一个重要事实是，底层任务可能随时间变化。例如，汽车价格不仅取决于汽车的属性、代表其过往使用情况的属性或车主的属性，还取决于经济状况，即其他事物的价格。如果我们进行买卖的经济环境发生重大变化，先前的趋势将不再适用。从统计学角度来看，数据背后随机过程的属性已经改变——我们面对的是一组新的硬币。在这种情况下，先前学习的模型不再成立，我们需要收集新数据并重新学习；或者，如果我们有获取性能反馈的机制，可以在持续使用过程中微调模型。


    ## 模型选择


    学习中最关键的一点之一是 `model`（模型），它定义了输入与输出之间关系的模板。例如，如果我们认为可以将输出写为属性的加权和，就可以使用 `linear
    model`（线性模型），其中属性具有加法效应。


    让我们看一个例子。假设我们仅将里程数作为输入属性，并收集表 1 所示的数据。我们有七辆车，记录了它们的里程数和价格。我们可以对该数据拟合一个线性模型；即绘制一条尽可能贴近那些数据点的直线。图
    1 显示了数据点和拟合线。该线性模型写为


    表 1 示例数据集由七辆车组成，每辆车包含其里程数（英里）和价格（美元）。索引仅用于命名；车辆的顺序不重要。


    | 索引 | 里程数 | 价格 |

    | --- | --- | --- |

    | 1 | 9,000 | 38,500 |

    | 2 | 95,000 | 6,000 |

    | 3 | 20,000 | 32,000 |

    | 4 | 60,000 | 15,000 |

    | 5 | 15,000 | 35,000 |

    | 6 | 30,000 | 27,000 |

    | 7 | 90,000 | 12,000 |


    ```

    y = 39258 – 0.3427x

    ```


    其中 `x` 表示里程数，`y` 表示估计价格。该直线从 39,258 美元开始——这是里程为 0 的车的估计值——每增加一英里，价格下降 34.27 美分，或者说每额外行驶
    10,000 英里，价格下降 3,427 美元。


    ![](img/13811_001_fig_000.jpg)

    '
