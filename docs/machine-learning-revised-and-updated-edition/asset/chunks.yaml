    # 强化学习：期望累积奖励与 Q 学习


    对于任意状态和动作，我们想要学习从该状态采取该动作开始的期望累积奖励。这是一个*期望*值，因为它是对奖励和未来状态中所有随机源取平均得到的。两个连续的状态-动作对的期望累积奖励通过*贝尔曼方程*相关联，我们利用它将奖励从后续动作*回传*到先前动作，具体如下。


    ## 网格世界示例


    在图 18 中，我们有一个网格世界。让我们考虑机器人到达目标的最后一步移动；因为我们到达了目标，所以获得奖励，假设为 100 单位。现在考虑紧接在那之前的状态和动作。在该状态下我们执行一个动作，虽然它不会给我们带来即时奖励（因为我们仍距离目标一步），但它将我们带到了这样一个状态：再采取一个动作就能获得
    100 的全部奖励。这意味着该状态下的该动作具有很高的价值，但它仍距离目标一步。因此，为了计算价值，我们对真实奖励进行折扣，假设折扣因子为 0.9（因为奖励在未来，而未来从不确定），我们说该特定状态-动作对具有一个*内部奖励*
    90。


    ![](img/13811_018_fig_000.jpg)


    请注意，那里的真实奖励仍然是零，因为我们仍未到达目标，但我们因到达了一个距离目标仅一步之遥的状态而给自己一个内部奖励。同理，再之前的那个动作被折扣两次，获得
    81 的内部奖励，我们可以继续为该序列中所有之前的动作分配内部价值。当然，这仅针对一次试验回合。我们需要进行许多试验，在每次试验中，由于不确定性，我们遵循不同的路径，访问不同的状态并观察不同的奖励，并对所有那些内部奖励估计取平均。这被称为*时序差分*（TD）学习；每个状态-动作对的内部奖励估计用*Q*表示，更新它们的算法称为*Q
    学习*。


    ## 探索与利用


    起初，我们随机尝试动作；随着学习的深入，我们从探索转向利用，从随机选择转向受内部奖励估计影响的选择。


    请注意，只有最终动作获得真实奖励；中间动作的所有价值都是模拟奖励。它们不是目的；它们只是帮助我们找到最终通向真实奖励的动作。就像在学校里，学生根据在不同课程中的表现获得成绩，但那些成绩只是模拟奖励，表明学生获得真实奖励的可能性有多大，而真实奖励只有在他们毕业并成为社区有用成员时才会获得。


    ## 部分可观测环境


    在某些应用中，环境是*部分可观测*的，智能体无法确切知道状态。它配备了传感器，传感器返回一个观测值，智能体利用它来估计环境的状态。假设我们有一个在房间中导航的机器人。在前面的网格世界示例中，机器人确切知道自己的位置，但情况并不总是如此。机器人可能不知道自己在哪里，也不知道房间里还有什么。机器人可能有一个摄像头，但图像并不能完整详细地告诉机器人环境的状态；它只给出关于可能状态的一些指示。例如，机器人可能只知道其左侧有一个障碍物。


    在这种情况下，基于观测值，智能体预测其状态；更准确地说，它预测给定观测值下处于每个状态的概率，然后按其概率加权对所有可能状态进行更新。这种额外的不确定性使任务变得困难得多，问题也更难学习（Thrun,
    Burgard, and Fox 2005）。


    例如，一辆在城市区域行驶的自动驾驶汽车通过访问其地理信息系统数据确切了解其环境；在农村地区，它必须更多地依赖车载传感器进行导航。


    # 学习玩游戏


    ## TD-Gammon


    强化学习的早期应用之一是*TD-Gammon*程序，它通过自我对弈学习玩西洋双陆棋（Tesauro 1995）。该程序优于 Tesauro 早先开发的*NeuroGammon*程序，后者是基于专家棋谱以监督方式训练的。西洋双陆棋是一项复杂的任务；它包含对手，且因掷骰子而引入额外的随机性。使用相对简单的棋盘表示，TD-Gammon
    通过与自身副本对弈训练一个具有一个隐藏层的多层感知机神经网络。


    前面我们讨论了通过折扣未来奖励来计算中间状态价值的方法；*价值网络*是一个回归器，它以状态为输入（此处为西洋双陆棋棋盘的表示），并被训练来估计其价值（该状态之后的期望累积奖励）。我们稍后将看到的*策略网络*是一个分类器，它以状态为输入，并被训练来选择最佳动作——即带我们进入价值最大的下一状态的动作（在返回最大期望累积奖励的路径上）。


    虽然强化学习算法比监督学习算法慢，但很明显，它们的应用范围更广，并有潜力构建更好的学习机器。它们不需要任何监督，这实际上可能更好，因为不会有任何教师偏见。例如，Tesauro
    的 TD-Gammon 程序通过自我对弈学习，在某些情况下想出了比最佳棋手更优越的走法。


    ## 深度 Q 网络（DQN）


    最近一项令人印象深刻的工作将强化学习与深度神经网络结合，用于玩街机游戏（Mnih et al. 2015）。*深度 Q 网络*是一个策略网络，直接接收屏幕的
    84 × 84 图像（这些是 1980 年代的街机游戏，当时图像分辨率很低），并仅利用图像和分数信息学习玩游戏。网络早期包含用于分析图像的卷积层，随后是全连接层以综合最佳操纵杆动作。训练是端到端的，从像素到动作，使用我们之前讨论的一种*Q*学习形式。


    同样有趣的是，具有相同学习算法、网络架构和超参数的同一个网络可以学习 49 个游戏中的任意一个，并在其中 29 个游戏中达到或超过了人类水平。


    ## AlphaGo


    最近，同一团队开发了 AlphaGo 系统（Silver et al. 2016），它再次将深度卷积网络与强化学习结合，这次是为了下围棋。围棋比西洋双陆棋或国际象棋难得多，因为棋盘更大，每个位置可能的走法更多，这意味着搜索空间大得多；围棋长期以来被认为超出了我们当前的计算能力。


    在 AlphaGo 中，输入是一组表示 19 × 19 围棋棋盘的专用特征，棋盘由卷积层处理，就像处理图像一样。有一个策略网络被训练用于选择最佳走法，还有一个价值网络被训练用于评估每个状态距离赢得比赛有多近。策略网络首先利用庞大的专家棋谱数据库进行训练，然后通过自我对弈的强化学习进一步改进。正如我们在前言中讨论的，AlphaGo
    在 2015 年以 5 比 0 击败了欧洲围棋冠军，并在 2016 年 3 月以 4 比 1 击败了世界上最伟大的围棋棋手之一。


    '
