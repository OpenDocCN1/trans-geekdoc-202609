    # 7 Challenges and Risks


    ## The Other Side of Machine Learning


    As any new technology, the use of machine learning introduces new unknowns and
    possible side effects that need to be spotted and handled appropriately. On the
    one hand, the success of a machine learning solution depends directly on how much
    data there is, so we want to have as many users and as much data as possible.
    But to be able to have that, people should be convinced that the system, be it
    a product or service, is “on their side”; that it makes lawful and responsible
    decisions; that the users’ right to privacy are respected; that the system is
    fair to all users and is transparent about how its decisions are made; and that
    its manufacturers can be held legally accountable when it makes a decision that
    causes harm. If these conditions are not met, people will be unwilling to provide
    information and as a result there can be no learning and no product or service
    to sell.


    The system, be it a product or service, should make lawful and responsible decisions,
    respect privacy, be fair to all users and transparent in its operation, and hold
    its manufacturers accountable.


    As a general rule, laws are technology neutral. It’s a crime to kill a person
    whether one uses a rock or a drone. The High Court of England and Wales stated
    in 2019 that “the fact that a technology is new does not mean that it is outside
    the scope of existing regulation, or that it is always necessary to create a bespoke
    legal framework for it.”[^1]


    For example, it is a basic human right that there can be no discrimination because
    of an individual’s race, gender, or age. This should be true regardless of who
    or what is making the decision; so it should be a given that a machine learning
    system is not allowed to make use of such attributes in making a decision.


    This may not be always straightforward when we are learning from large amounts
    of data, because there can always be correlations that are not immediately apparent.
    For example, the zip code of an individual can be correlated with and hence can
    act as a proxy of ethnicity (Favaretto, De Clercq, and Elger 2019). Learning algorithms
    are surprisingly good at finding such correlations; sometimes, they also find
    correlations that are spurious, especially when the data set is small. This is
    an indicator of the need for explainability, which is one requirement that we
    will discuss shortly.


    Automated decision making of course is not new but was used in more limited scenarios
    in the past; today its application areas are increasing, which is due not only
    to machine learning but also to the increased precision and decreasing cost of
    automation.


    Airplanes have had autopilots, trains and boats their guidance systems, but building
    self-driving cars is a much more difficult task; consider an urban environment,
    which has not only many other cars but also other dynamic agents such as pedestrians,
    cyclists, and so on. Driving is a mode of transport that is everyday and ubiquitous,
    so automating it will have more impact. Another example is automated trading where
    computer programs make buy-or-sell decisions. Face recognition is good if it helps
    the police to catch criminals; it is bad if it is used to track people without
    their knowledge and consent. The more widespread use of automation technologies,
    which depend increasingly on machine learning, is helpful, but comes with downsides,
    one being that we become reliant on them too much and too quickly.


    When a human driver causes an accident, its effect is limited because the probability
    that another driver makes the exact same erroneous decision is very small; if
    a self-driving car causes an accident, this means that all other cars of that
    make are sure to cause an accident if they are put in the same scenario. That
    is why when an airplane is involved in an accident, all other airplanes of the
    same make are immediately grounded until the cause of the accident is determined
    and eliminated; in the future, it may happen that your self-driving car will refuse
    to run in the morning because some other car has recently been involved in an
    accident in another city and the reason has not yet been determined.


    In addition to risks associated with automated decision making, another source
    of risk in machine learning is related to data, and this has different aspects.
    First is the need for data privacy and security. Data may contain personal information
    that needs to be kept confidential; so any collection, storage, and processing
    of data should be done with privacy and security concerns in mind. Second is that
    the quality of any machine learning solution directly depends on the quality of
    the data. If the data is biased or outright corrupt so will all the decisions
    based on that data be. Third is the element of trust. In high-risk applications,
    for example in the medical domain, we require our trained models to be interpretable
    so that they provide not only a decision but also a human-readable explanation
    that justifies that particular decision.


    Let us now discuss these aspects one by one.


    ## Data Privacy and Security


    When we have a lot of data, its analysis can lead to valuable results, and historically,
    data collection and analysis have resulted in significant findings for humanity,
    in many domains from medicine to astronomy. The current widespread use of digital
    technology allows us to collect and analyze the data quickly and accurately, and
    in numerous new domains.


    With more and detailed data, the critical point today is *data privacy and security*
    (Horvitz and Mulligan 2015). How can we make sure that we collect and process
    data without infringing on people’s privacy concerns and that the data is not
    used for purposes beyond its original intention?


    We expect individuals in a society to be aware of the advantages of data collection
    and analysis in domains such as health care and safety. And even in other domains
    such as retail, people always appreciate services and products tailored to their
    likes and preferences. Still, no one likes to feel that their private life is
    being pried into. Our smart devices, for example, should not turn into digital
    paparazzi recording the details of our lives and making them available without
    our knowledge.


    In the past, information about people used to be distributed among data collectors
    where each had access only to the part that it needed: the bank had data only
    related to our financial situation, the employer had data only related to our
    work, and so forth. There was also data related to services provided by different
    companies, such as a travel agent, or a utility provider, again each seeing a
    small portion of the person’s profile, and our social interactions were not recorded.
    In a world where these different pieces of data are made easily accessible, even
    if each one is partially informative and some seemingly unimportant, they can
    be combined to make very detailed inferences about a person. This is both the
    power and the risk of learning from data.


    [^1]: [1](#13811-0015.xhtml#en17)

