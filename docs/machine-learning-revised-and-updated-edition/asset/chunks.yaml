- raw: 'We expect to see regularities and patterns repeated with minor variations
    in many different domains. Detecting them as primitives and ignoring the irrelevant
    variations is also a way of doing compression. For example, in an image, the input
    is made up of pixels, but we can identify regularities by analyzing repeated image
    patterns, such as, texture, objects, and so forth. This allows a higher-level,
    simpler, and more useful description of the scene and achieves better compression
    than compressing at the pixel level. A scanned document page does not have random
    on/off pixels but bitmap images of characters; there is structure in the data,
    and we make use of this redundancy by finding a shorter description of the data
    in terms of strokes of different orientations. Going further, if we can discover
    that those strokes combine in certain ways to make up characters, we can use just
    the code of a character, which is shorter than its image.


    ![](images/13811_014_fig_000.jpg)


    In *document clustering*, the aim is to group similar documents. For example,
    news reports can be subdivided into those related to politics, sports, fashion,
    arts, and so on. We can represent the document as a bag of words using a lexicon
    that reflects such document types, and then documents are grouped depending on
    the number of shared words. It is of course critical how the lexicon is chosen.


    Unsupervised learning methods are also used in *bioinformatics*. DNA in our genome
    is the “blueprint of life” and is a sequence of bases, namely, A, G, C, and T.
    RNA is transcribed from DNA, and proteins are translated from RNA. Proteins are
    what the living body is and does. Just as DNA is a sequence of bases, a protein
    is a sequence of amino acids (as defined by bases). One application area of computer
    science in molecular biology is alignment, which is matching one sequence to another.
    This is a difficult string-matching problem because strings may be quite long,
    there are many template strings to match against, and there may be deletions,
    insertions, or substitutions.


    Clustering is used in learning *motifs*, which are sequences of amino acids that
    occur repeatedly in proteins. Motifs are of interest because they may correspond
    to structural or functional elements within the sequences they characterize. The
    analogy is that if the amino acids are letters and proteins are sentences, motifs
    are like words, namely, a string of letters with a particular meaning occurring
    frequently in different sentences.


    Clustering may be used as an *exploratory data analysis* technique where we identify
    groups naturally occurring in the data. We can then, for example, label those
    groups as classes and later on try to classify them. A company may cluster its
    customers and find segments, and then toward a certain aim—for example, churning—can
    label them and train a classifier to predict the behavior of new customers. But
    the important point is that there may be a cluster or clusters that no expert
    could have foreseen, and that is the power of unsupervised data-driven analysis.


    Sometimes a class is made up of multiple groups. Consider the case of optical
    character recognition. There are two ways of writing the digit seven; the American
    version is ‘7’, whereas the European version has a horizontal bar in the middle
    (to tell it apart from the European ‘1’, which keeps the small stroke on top in
    handwriting). In such a case, when the sample contains examples from both continents,
    the class for seven should be represented as the union/disjunction/mixture of
    two groups.


    A similar example occurs in speech recognition where the same word can be uttered
    in different ways, due to differences in pronunciation, accent, gender, age, and
    so on—“I say to-may-to, you say to-mah-to.” Thus when there is not a single, universal
    way, all these different ways should be represented as equally valid alternatives
    to be statistically correct.


    Clustering algorithms group instances in terms of their similarities calculated
    using their input representation, which is a list of input attributes, and the
    similarity between instances is measured by combining similarities in these attributes.
    In certain applications, we can define a similarity measure between instances
    directly, in terms of the original data structure, without explicitly generating
    such a list of attributes and calculating similarities over them.


    Consider clustering Web pages. In addition to the text field, we can also use
    the similarity of meta (or header) information such as titles or keywords, or
    the number of common Web pages that link to or are linked from those two. This
    gives us a much better similarity measure than what is calculated using the bag
    of words representation on the text of the Web pages. Using a similarity measure
    that is better suited to the application—if one can be defined—leads to better
    clustering results; this is the basic idea in *spectral clustering*.


    Such application-specific similarity representations are also popular in supervised
    learning applications typically grouped under the name *kernel function*. The
    *support* *vector machine* (Vapnik 1998) is one such learning algorithm used for
    both classification and regression.


    It is also possible to do *hierarchical clustering*, where instead of a flat list
    of clusters, we generate a tree structure with clusters at different levels of
    granularity and clusters higher in the tree are subdivided into smaller clusters
    (see figure 15). We are familiar with such trees of clusters from studies in biology—most
    famously, the taxonomy by Linnaeus—or human languages. One explanation of the
    splitting up of clusters into smaller clusters is due to *phylogeny*, that is,
    to evolutionary changes—small mutations are gradually accumulated over time until
    a species (or a language) splits into two—but in other applications, the reason
    of similarity may be different.


    ![](images/13811_015_fig_000.jpg)


    The aim in clustering in particular, or unsupervised learning in general, is to
    find structure in the data. In the case of supervised learning (e.g., in classification),
    this structure is imposed by the supervisor who defines the different classes
    and labels the instances in the training data by these classes. This additional
    information provided by the supervisor is of course useful, but we should always
    make sure that it does not become a source of bias or impose artificial boundaries.
    There is also the risk that there is error in labeling, which is called “teacher
    noise.”


    Unsupervised learning is an important research area because unlabeled data is
    a lot easier and cheaper to find. For speech recognition, a talk radio station
    is a source of unlabeled speech data; spoken speech is not a random sequence of
    sounds, but we have particular sound sequences repeated frequently, which are
    the words in that language. The idea is to extract the basic characteristics from
    unlabeled data and learn what is typical, which can then later be labeled for
    different purposes. A baby spends their first few years looking around when they
    see things, objects, faces repeatedly under a variety of conditions, during which
    presumably they learn their basic feature extractors and how they typically combine
    to form objects. Later on, when that baby learns language, they learn the names
    for those.


    The aim in clustering in particular, or unsupervised learning in general, is to
    find structure in the data, by extracting the basic characteristics and learning
    what is typical.


    ## Recommendation Systems'
  fmt: '

    # 无监督学习与聚类分析


    我们期望在许多不同领域中看到规律和模式以微小变化重复出现。将它们作为基元检测并忽略无关变化，也是一种压缩方式。例如，在图像中，输入由像素组成，但我们可以通过分析重复的图像模式（如纹理、物体等）来识别规律。这使得场景的描述更高级、更简单、更有用，并且比在像素级别压缩实现更好的压缩效果。扫描的文档页面并非随机的开/关像素，而是字符的位图图像；数据中存在结构，我们通过用不同方向的笔画来寻找数据的更短描述，从而利用这种冗余。更进一步，如果我们能发现这些笔画以特定方式组合形成字符，就可以仅使用字符编码，这比其图像更短。


    ![](images/13811_014_fig_000.jpg)


    在**文档聚类**中，目标是将相似文档分组。例如，新闻报道可细分为政治、体育、时尚、艺术等类别。我们可以使用反映此类文档类型的词汇表，将文档表示为词袋，然后根据共享词汇的数量对文档进行分组。词汇表的选择当然至关重要。


    无监督学习方法也用于**生物信息学**。我们基因组中的 DNA 是“生命蓝图”，是碱基序列，即 A、G、C 和 T。RNA 由 DNA 转录而来，蛋白质由
    RNA 翻译而来。蛋白质构成了生命体并执行其功能。正如 DNA 是碱基序列，蛋白质是氨基酸序列（由碱基定义）。计算机科学在分子生物学中的一个应用领域是比对，即将一个序列与另一个序列匹配。这是一个困难的字符串匹配问题，因为字符串可能很长，有许多模板字符串需要匹配，且可能存在删除、插入或替换。


    聚类用于学习**基序**，即在蛋白质中重复出现的氨基酸序列。基序受关注是因为它们可能对应于其表征序列中的结构或功能元素。打个比方，如果氨基酸是字母，蛋白质是句子，那么基序就像单词，即在不同句子中频繁出现的、具有特定含义的字母串。


    聚类可作为**探索性数据分析**技术，用于识别数据中自然出现的群组。然后我们可以将这些群组标记为类别，并尝试对它们进行分类。公司可能对客户进行聚类以发现细分市场，然后针对特定目标（如客户流失）对其标记，并训练分类器预测新客户行为。但关键在于，可能存在专家无法预见的聚类，这就是无监督数据驱动分析的力量。


    有时一个类由多个群组组成。考虑光学字符识别的情况。书写数字 7 有两种方式：美式写法是 `7`，而欧式写法中间有一横杠（以区分欧式手写体 `1` 顶部保留的小笔画）。在这种情况下，当样本包含来自两大洲的示例时，数字
    7 的类别应表示为两个群组的并集/析取/混合。


    语音识别中也存在类似示例：由于发音、口音、性别、年龄等差异，同一单词可有不同表达——“I say to-may-to, you say to-mah-to.”因此，当不存在单一通用方式时，所有这些不同方式都应作为同等有效的替代方案表示，以保证统计正确性。


    聚类算法根据实例的相似性对实例进行分组，相似性通过输入表示（即输入属性列表）计算，实例间的相似性通过组合这些属性的相似性来度量。在某些应用中，我们可以直接根据原始数据结构定义实例间的相似性度量，而无需显式生成属性列表并计算其上的相似性。


    考虑网页聚类。除了文本字段，还可使用元信息（或头部信息）的相似性，如标题或关键词，或链接到或被这两个网页链接的公共网页数量。这比基于网页文本的词袋表示计算出的相似性度量好得多。使用更适合应用的相似性度量（如果可定义）能带来更好的聚类结果；这是**谱聚类**的基本思想。


    这种特定应用的相似性表示在监督学习应用中也很流行，通常归类为**核函数**。**支持向量机**（Vapnik 1998）就是这样一种用于分类和回归的学习算法。


    也可以进行**层次聚类**，生成树结构而非扁平聚类列表，树中不同粒度层级包含聚类，较高层级的聚类细分为较小的聚类（见图 15）。我们从生物学研究中熟悉这种聚类树——最著名的是林奈分类法——或人类语言。将聚类细分为更小聚类的一种解释归因于**系统发育**，即进化变化——微小突变随时间逐渐累积，直到物种（或语言）分裂为两个——但在其他应用中，相似性的原因可能不同。


    ![](images/13811_015_fig_000.jpg)


    聚类特别是无监督学习的总体目标，是发现数据中的结构。在监督学习（如分类）中，这种结构由监督者施加，监督者定义不同类别并用这些类别标记训练数据中的实例。监督者提供的这种额外信息当然有用，但我们应始终确保它不成为偏差来源或强加人为边界。还存在标记错误的风险，称为“教师噪声”。


    无监督学习是重要研究领域，因为未标记数据更容易、更廉价地获取。对于语音识别，脱口秀电台是未标记语音数据来源；语音非随机声音序列，而是特定声音序列频繁重复，即该语言中的单词。思路是从未标记数据中提取基本特征并学习典型模式，随后可为不同目的标记。婴儿头几年四处观看，在各种条件下反复看到事物、物体、面孔，据推测他们在此期间学习基本特征提取器及其典型组合形成物体的方式。后来学习语言时，他们为这些事物学习名称。


    聚类特别是无监督学习的总体目标，是通过提取基本特征并学习典型模式，发现数据中的结构。


    ## 推荐系统

