    # CORE CONCEPT: TYPES OF COMPUTER NETWORK


    There are several different types of computer networks. Computer networks can
    be characterized by their size as well as their purpose. The size of a network
    can be expressed by the geographic area they occupy and the number of computers
    that are


    part of the network. Networks can cover anything from a handful of devices within
    a single room to millions of devices spread across the entire globe.


    There are many ways in which different networks can be classified, such as their
    size, capabilities and the geographical distance they cover. A network is a simple
    group of two or more computer systems linked together in some way so that they
    can share data between them.


    Common types of computer networks may be identified by their scale.


    # Personal Area Network


    A personal area network (PAN) is a computer network used for communication among
    computer devices close to one person. Some examples of devices that are used in
    a PAN are personal computers, printers, fax machines, telephones, PDAs, scanners,
    and even video game consoles. Such a PAN may include wired and wireless connections
    between devices. The reach of a PAN is typically at least about 20-30'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'feet (approximately 6-9 meters), but this is expected to increase with technology
    improvements.


    ![](img/f7819d05465fc14719b3ebbba980271a_39_0.png)


    # Local Area Network


    A local Area Network (LAN) is a computer network covering a small physical area,
    like a home, office, or small group of buildings, such as a school, or an airport.
    Current wired LANs are most likely to be based on Ethernet technology, although
    new standards like ITU-T G.hn also provide a way to create a wired LAN using existing
    home wires (coaxial cables and power lines).


    For example, a library may have a wired or wireless LAN for users to interconnect
    local devices (e.g., printers and servers) and connect to the internet. On a wired
    LAN, PCs in the library are typically connected by category 5 (Cat5) cable, running
    the IEEE 802.3 protocol through a system of interconnected devices and eventually
    connect to the Internet. The servers are typically on Cat 5 enhanced cable, which
    will support IEEE 802.3 at 1 Gbit/s. A wireless LAN may exist using a different
    IEEE protocol, 802.11b, 802.11g or possibly 802.11n. The staff computers (bright
    green in the library) can get to the color printer, checkout records, and the
    academic network and the Internet. All user computers can get to the Internet
    and the card catalog. Each workgroup can get to its local printer.


    All interconnected devices must understand the network layer (layer 3), because
    they are handling multiple subnets (the different colors). Those inside the library,
    which have only 10/100 Mbit/s Ethernet connections to the user device and a Gigabit
    Ethernet connection to the central router, could be "layer 3 switches" because
    they only have Ethernet interfaces and must understand IP. It would be more correct
    to call them access routers, where the router at the top is a distribution router
    that connects to the Internet and academic networks'' customer access routers.


    The defining characteristics of LANs, in contrast to WANs (Wide Area Networks),
    include their higher data transfer rates, smaller geographic range, and lack of
    a need for leased telecommunication lines. Current Ethernet or other IEEE 802.3
    LAN technologies operate at speeds up to 10 Gbit/s. This is the data transfer
    rate. IEEE has projects investigating the standardization of 40 and 100 Gbit/s.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '![](img/f7819d05465fc14719b3ebbba980271a_40_0.png)


    # Campus Area Network


    A campus area network (CAN) is a computer network made up of an interconnection
    of local area networks (LANs) within a limited geographical area. It can be considered
    one form of a metropolitan area network, specific to an academic setting.


    In the case of a university campus-based campus area network, the network is likely
    to link a variety of campus buildings including; academic departments, the university
    library and student residence halls. A campus area network is larger than a local
    area network but smaller than a wide area network (WAN (in some cases).


    ![](img/f7819d05465fc14719b3ebbba980271a_40_1.png)


    The main aim of a campus area network is to facilitate students accessing internet
    and university resources. This is a network that connects two or more LANs but
    is limited to a specific and contiguous geographical area such as a college campus,
    industrial complex, office building, or a military base. A CAN can be considered
    a type of MAN (metropolitan area network), but is generally limited to a smaller
    area than a typical MAN. This term is most often used to discuss the implementation
    of networks for a contiguous area. This should not be confused with a Controller
    Area Network. A LAN connects network devices over a relatively short distance.
    A networked office building, school, or home usually contains a single LAN, though
    sometimes one building will contain a few small LANs (per one room), and occasionally
    a LAN will span a group of nearby buildings.


    > MANs cover the area of a metropolitan region, connecting multiple LANs and other
    network resources to facilitate communication and data exchange over a larger
    geographical area.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Metropolitan Area Network


    A metropolitan area network (MAN) is a network that connects two or more local
    area networks or campus area networks together but does not extend beyond the
    boundaries of the immediate town/city. Routers, switches and hubs are connected
    to create a metropolitan area network.


    ![](img/f7819d05465fc14719b3ebbba980271a_41_0.png)


    # Wide Area Network


    A wide area network (WAN) is a computer network that covers a broad area (i.e.
    any network whose communications links cross metropolitan, regional, or national
    boundaries [1]). Less formally, a WAN is a network that uses routers and public
    communications links. Contrast with personal area networks (PANs), local area
    networks (LANs), campus area networks (CANs), or metropolitan area networks (MANs),
    which are usually limited to a room, building, campus or specific metropolitan
    area (e.g., a city) respectively. The largest and most well-known example of a
    WAN is the Internet. A WAN is a communications network that covers a relatively
    broad geographic area (i.e. one city to another and one country to another) that
    often uses transmission facilities provided by common carriers, such as telephone
    companies. WAN technologies generally function at the lower three layers of the
    OSI reference model: the physical layer, the data link layer, and the network
    layer.


    ![](img/f7819d05465fc14719b3ebbba980271a_41_1.png)


    # Global Area Network


    A global area networks (GAN) specification is in development by several groups,
    and there is no common definition. In general, however, a GAN is a model for supporting'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'mobile communications across an arbitrary number of wireless LANs, satellite
    coverage areas, etc. The key challenge in mobile communications is “handing off”
    the user communications from one local coverage area to the next. In IEEE Project
    802, this involves a succession of terrestrial WIRELESS local area networks (WLAN).


    # Virtual Private Network


    A virtual private network (VPN) is a computer network in which some of the links
    between nodes are carried by open connections or virtual circuits in some larger
    networks (e.g., the Internet) instead of physical wires. The data link layer protocols
    of the virtual network are said to be tunneled through the larger network when
    this is the case. One common application is secure communications through the
    public Internet, but a VPN need no explicit security features, such as authentication
    or content encryption. VPNs, for example, can be used to separate the traffic
    of different communities over an underlying network with strong security features.


    A VPN may have best-effort performance, or may have a defined service level agreement
    (SLA) between the VPN customer and the VPN service provider. Generally, a VPN
    has a topology more complex than point-to-point.


    A VPN allows computer users to be editing from an IP address location other than
    the one which connects the actual computer to the Internet.


    ![](img/f7819d05465fc14719b3ebbba980271a_42_0.png)


    # Internetwork


    An Internetwork is the connection of two or more distinct computer networks or
    network segments via a common routing technology. The result is called internetwork
    (often shortened to internet). Two or more networks or network segments connect
    using devices that operate at layer 3 (the ‘network’ layer) of the OSI Basic Reference
    Model, such as a router. Any interconnection or between public, private, commercial,
    industrial, or governmental networks may also be defined as an internetwork.


    In modern practice, interconnected networks use the Internet Protocol. There are
    at least three variants of internetworks, depending on who administers and who
    participates in them:


    +   - Intranet'
  merge: -1
  img_proc: true
- pgno: 43
  md: '+   * Extranet

    * Internet


    Intranets and extranets may or not have connections to the Internet. If connected
    the intranet or extranet is normally protected from being accessed from the Internet
    without proper authorization. The Internet is not considered to be a part of the
    intranet or extranet, although it may serve as a portal for access to portions
    of an extranet.


    > To enable communication, every individual network node or phase is designed
    with a similar protocol or communication logic, that is Transfer Control Protocol
    (TCP) or Internet Protocol (IP).


    # Intranet


    An intranet is a set of networks, using the Internet Protocol and IP-based tools
    such as web browsers and file transfer applications that under the control of
    a single administrative entity. That administrative entity closes the intranet
    to all specific, authorized users. Most commonly, an intranet is the internal
    network of an organization. A large intranet typically have at least one web server
    to provide users with organizational information.


    # Extranet


    An extranet is a network or internet that is limited in scope to a single organization
    or entity which also has limited connections to the networks of one or more other
    usually, but not necessarily, trusted organizations or entities (e.g., a company''s
    customers may be given access to some part of its intranet creating in this way
    an extranet, while at the same time the customers may not be considered ''trusted''
    from a security standpoint). Technically, an extranet may also be categorized
    as a CAN, MAN, WAN, or other type of network, although, by definition, an extranet
    cannot consist of a single LAN; it must have at least one connection with an external
    network.


    # Internet


    The Internet consists of a worldwide interconnection of governmental, academic,
    public, and private networks based upon the networking technologies of the Internet
    Protocol Suite. It is the successor of the Advanced Research Projects Agency Network
    (ARPANET) developed by DARPA of the U.S. Department of Defense. The Internet is
    also the communications backbone underlying the World Wide Web (WWW). The ''Internet''
    is most commonly spelled with a capital ''I'' as a proper name, for historical
    reasons and to distinguish it from other generic internetworks.


    Participants in the Internet use a variety of methods documented, often standardized,
    protocols compatible with the Internet Protocol Suite and an addressing system
    (IP Addresses) administered by the Internet Assigned Numbers Authority and address
    registries. Service providers and large enterprises exchange information about
    the reachability of their address spaces through the Border Gateway Protocol (BGP),
    forming a redundant worldwide mesh of transmission paths.'
  merge: -1
  img_proc: true
