  md: 'BSC protocol. It is normally used only with the synchronous mode of operation.
    It is a connection oriented (reliable) data link protocol, which means that there
    is a logical connection between sender and receiver maintained for the duration
    of the communication. BSC initiates the connection through a single master (primary)
    station which controls all data traffic to and from number of slave (secondary)
    terminals or DTEs on either a multipoint network (connected via a branching point
    - a star) or a multicast network (- a bus) or both. Of course, what can be done
    for many slaves also be done for just one and therefore point-to-point connections
    are also possible?


    For shared access to work without contention it is necessary to have control frames
    as well as data frames. These control frames allow for a mode known as poll-select
    to take place in the master polls a slave to request data and selects the slave
    before sending data.


    For a successful transfer of data, both character and frame synchronization must
    take place. With BSC, these functions are carried out using selected EBCDIC transmission
    control characters. (An ISO character oriented protocol protocol is based on BSC
    and uses ASCII characters.) Character (or DLE) stuffing is used to provide data
    transparency.


    # Full Duplex


    A few character oriented protocols operate in full duplex mode. This allows the
    transfer of data in both directions simultaneously. To achieve this, these continuous
    RQ protocols use sliding window techniques. The physical link is operated the
    flows of frames over each link being controlled by its own stops and wait protocol
    procedure.


    Owing to the efficiencies, acceptance and other advantages of the bit oriented
    duplex protocols; few character oriented duplex protocols are not used.


