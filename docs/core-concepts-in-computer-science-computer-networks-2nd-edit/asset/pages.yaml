- pgno: 257
  md: '# INTRODUCTION


    Network coding is a technique used in computer networks to enhance the efficiency
    and reliability of data transmission. Traditionally, data packets are forwarded
    through network nodes individually, leading to potential inefficiencies and redundant
    transmissions. However, network coding introduces a novel concept where intermediate
    nodes in the network combine incoming data packets to create composite packets.
    These composite packets contain a mix of original data from different sources,
    making the network coding process akin to algebraic operations performed on data
    packets. The key advantage of network coding lies in its ability to increase throughput
    and optimize network utilization. By combining data at intermediate nodes, network
    coding reduces the number of transmissions required, leading to improved efficiency
    and reduced congestion. Additionally, network coding enhances fault tolerance
    in the network by creating composite packets that contain redundant information,
    making the data transmission more resilient to losses and failures. There are
    different types of network coding, including random linear coding, deterministic
    network coding, incremental network coding, and opportunistic network coding.
    Each type employs specific algorithms and methods for combining data packets and
    distributing them throughout the network. Network coding finds particular relevance
    in large-scale, distributed networks, such as peer-to-peer networks, wireless
    mesh networks, and content delivery networks. In scenarios, network coding can
    significantly enhance data dissemination and contribute to overall network performance.
    It has applications in various fields, including multimedia streaming, distributed
    storage systems, and wireless communication. While network coding offers substantial
    benefits, it also presents challenges in terms of complexity, computational overhead,
    and security concerns. Ensuring secure and reliable network coding implementations
    is crucial to safeguarding data integrity and privacy. In conclusion, network
    coding is a powerful technique that revolutionizes data transmission in computer
    networks by allowing intermediate nodes to combine data packets. Through this
    process, network coding enhances throughput, reduces congestion, and improves
    the fault tolerance of the network. By efficiently utilizing network resources,
    network coding proves invaluable in large-scale, distributed networks, contributing
    to more reliable and efficient communications.


    # CORE CONCEPT: NETWORK CODING


    ![](img/f7819d05465fc14719b3ebbba980271a_257_0.png)


    Network coding is a networking technique in which transmitted data is encoded
    and decoded to increase throughput, reduce delays and make the network more robust.
    In network coding, algebraic algorithms are applied to the data to accumulate
    various transmissions. The received transmissions are decoded at their destinations.
    This means that fewer transmissions are required to transmit all the data, but
    this requires more processing at intermediary and terminal nodes.'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'In traditional routing networks, packets are cached and forwarded downstream.
    Therefore, if a routing node receives two packets from source it forwards one
    after another, and queues the others in the meantime, even if both are headed
    for the same destination. This requires separate transmissions for each and every
    message delivered, decreases network efficiency. In network coding, algorithms
    are used to merge those two messages and the accumulated result is forwarded to
    the destination. After receiving the accumulated message, it is decoded at the
    destination using the same algorithm.


    In order for this technique to work, the destination node needs to be completely
    synchronized with the transmitting nodes.


    Network coding is perceived to be useful in wireless mesh networks, messaging
    networks, storage networks, multicasting networks, file-sharing-peer networks
    and other networks where the same data needs to be transmitted to a number of
    destination nodes. The regular topology change that occurs in peer-to-peer networks
    poses a challenge to the network coding technique because it complicates network
    synchronization. In addition, the peers may need a large amount of processing
    time while trying to decode data.


    # # Purpose of Network coding


    Network coding is based on a simple, yet far-reaching idea. In a packet network,
    rather than simply routing packets, intermediate nodes compute and transmit functions
    of the packets that they receive. Many now-standard results are reviewed, in particular:
    the multicast capacity of a network is given by the least-capacity separating
    the source from any of its destinations; the multicast capacity is achievable
    with linear network coding over a finite field of sufficiently large size, and
    there exists a computationally efficient algorithm to find a set of capacity-achieving
    linear network coding coefficients; the multicast capacity is achieved with high
    probability over a sufficiently large field when the linear network coding coefficients
    are chosen at random. Allowing the nodes in a network to perform coding permits
    the multicast capacity of a network to be achieved with linear network coding,
    with potentially unbounded advantage over routing. Unlike optimal routing solutions
    to a multicast problem, an optimal linear network coding solution can be found
    in polynomial time. In practice, the random linear network coding approach results
    in multicast protocols that are robust to changes in the underlying network topology.
    Despite its optimality for multicasting, it turns out linear network coding does
    not, in general, suffice to achieve optimal throughputs for general flow problems.


    # # Network Coding Helpful in P2P Content Distribution


    What are the potential benefits of network coding for P2P content distribution?
    Recall that the difficulty of P2P content distribution is finding an optimal block
    scheduling algorithm, which should minimize the file downloading time in a distributed
    manner. This becomes even more challenging when the overlay network is changing
    dynamically.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# 248


    Without network coding, each peer has to decide which blocks to download from
    which neighbors, based on local information only. This may be suboptimal due to
    lack of a global view, since local rarest blocks may not be rarest blocks. In
    contrast, with network coding, all coded blocks are almost equally useful to any
    peer, and there is no need to locate and request global rarest blocks in the system.
    As such, an information bottleneck is avoided, which in turn reduces the file
    downloading time.


    Data blocks refer to discrete units of information that are stored together as
    a group. Various computing and information systems, data is organized into blocks
    for efficient storage, retrieval, and management.


    Another important benefit of network coding is the robustness to peer departures.
    Without network coding, it is possible that a few data blocks are lost, due to
    departures of the server as well as the peers who have these data blocks. In this
    unfortunate event, the original file cannot be reconstructed by the remaining
    peers. On the other hand, with network coding, the risk of losing certain data
    blocks is no longer a concern. Intuitively, since data blocks are mixed together,
    each of them is spreading to a large number of coded blocks in the system.


    In summary, the use of network coding solves the scheduling problem in a surprisingly
    simple and efficient manner, leading to a shorter downloading time. Moreover,
    it provides desirable robustness to peer departures. There is no need to worry
    about losing certain data blocks any all. All of these contribute to the usefulness
    of network coding in P2P content distribution. In the following, we will present
    a number of theoretical results to substantiate these claimed advantages of network
    coding.


    # Theory behind Network Coding


    This theorem states that in a flow network, where information flows from one node
    to the next, the maximum amount of flow from the source to the sink (max-flow)
    is equal to the minimum capacity that would not allow any flow to pass from the
    source to sink when cut/removed from the network in a specific way (min-cut).
    Basically, if all receivers have the same min-cut from the source, then NC would
    allow all nodes to achieve the min-cut simultaneously. This capacity would also
    correspond to the maximum flow rate that each receiver could get if it were the
    only receiving node in the network. The simplest example that demonstrates the
    key idea and the benefits of NC in the multicast case is the butterfly network
    depicted in Figure 1.


    Core Concepts in Computer Science: Computer Networks'
