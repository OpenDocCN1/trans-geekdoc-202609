  md: '# Wireless Network Security


    ![](img/f7819d05465fc14719b3ebbba980271a_226_0.png)


    Figure 5: Shared-key Authentication Message Flow.


    Shared key authentication is a cryptographic technique for authentication. It
    is a simple “challeresponse” scheme based on whether a client has knowledge of
    a shared secret. In this scheme, as depicted conceptually in Figure 5, a random
    challenge is generated by the access point and sent to the wireless client. The
    client, using a cryptographic key that is shared with the AP, encrypts the challenge
    (or “nonce,” as it is called in security vernacular) and returns the result to
    the AP. The AP decrypts the result computed by the client and allows access only
    if the decrypted value is the same as the random challenge transmitted. The algorithm
    used in the cryptographic computation and for the generation of the 128-bit challenge
    used is the RC4 stream cipher developed by Ron Rivest of MIT. It should be noted
    that the authentication method described is a rudimentary cryptographic technique,
    and it does not provide mutual authentication. That is, the client does not authenticate
    the AP, and therefore there is no assurance that a client is communicating with
    a legitimate AP and wireless network. It is also worth noting that unilateral
    challenge-response schemes have long been known to be weak They suffer from numerous
    attacks including the infamous “man-in-the-middle” attack. Lastly, the IEEE 802.11
    specification does not require shared-key authentication.


