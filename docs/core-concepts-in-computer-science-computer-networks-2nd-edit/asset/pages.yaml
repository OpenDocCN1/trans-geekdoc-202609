  md: '# SUMMARY


    +   - The Physical Layer is a fundamental concept in data communication, serving
    as the lowest layer in the OSI (Open Systems Interconnection) model.


    +   - The primary purpose of the Physical Layer is to establish and maintain a
    reliable and efficient physical connection between two devices, enabling them
    to exchange data.


    +   - The Physical Layer plays a fundamental role in data communication by ensuring
    that data is reliably and accurately transmitted over the physical medium.


    +   - In a ring topology, each device has a dedicated point-to-point connection
    with only the two devices on either side of it. A signal is passed along the ring
    in one direction, from device to device, until it reaches its destination.


    +   - A bus topology is multipoint. One long cable acts as a backbone to link
    all the devices in a network. Nodes are connected to the bus cable by drop lines
    and taps. A drop line is a connection running between the device and the main
    cable.


    +   - It has a root node and all other nodes are connected to it forming a hierarchy.
    It is also called hierarchical topology. It should at least have three levels
    to the hierarchy.


    +   - Switching is process to forward packets coming in one port to a port leading
    towards the destination. When data comes on a port it is called ingress, and when
    data leaves a port or goes out it is called egress.


    +   - A switch working on message switching, first receives the message and buffers
    it until there are resources available to transfer it to the next hop.


    +   - Multiplexing is a technique by which different analog and digital streams
    of transmission can be simultaneously processed over a shared link. Multiplexing
    divides the high capacity medium into low capacity logical medium which is then
    shared by different streams.'
