- pgno: 55
  md: '# Session Layer


    The session layer is where connections are maintained and ended. This usually
    refers to application requests for data over the network. Whereas the transport
    layer handles the actual flow of data, the session layer acts as an announcer,
    making sure that the programs and applications requesting and sending data know
    their requests are filled. In technical terms, the session layer synchronizes
    data transmission.


    > The Session Layer is responsible for establishing, maintaining, and terminating
    sessions between different devices. It serves as a link between the Transport
    Layer (Layer 4) and the Presentation Layer (Layer 6) in the OSI model.


    Specific responsibilities of the session layer include:


    +   * Dialog Control: The session layer allows two systems to enter into a dialog.
    It allows the communication between two processes to take place either in half-duplex
    (one way at a time) or full-duplex (two ways at a time). For example, the dialog
    between a terminal connected to a mainframe can be half-duplex.

    * Synchronization: The session layer allows a process to add checkpoints to a
    stream of data.


    ![](img/f7819d05465fc14719b3ebbba980271a_55_0.png)


    **Figure 3**: Session layer.


    # Transport Layer


    The transport layer is responsible for streaming data across the network. At this
    level, the data is not thought of in terms of individual packets but in terms
    of a conversation. To accomplish this, protocols which are defined as “rules of
    communication” are used? The protocols watch the complete transmission of many
    packets checking the conversation for errors, acknowledging successful transmissions
    and requesting retransmission if errors are detected.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'Specific responsibilities of the transport layer include:


    +   * Service-Point Addressing: Computers often run several programs at the same
    time. For this reason, source-to-destination delivery means delivery not only
    from one computer to the next but also from a specific process (running program)
    on one computer to a specific process (running program) on the other. The transport
    header therefore must include a type of address called a service-point address
    (or port address). The network layer gets each packet to the correct computer;
    the transport layer gets the entire message to the correct process on computer.

    * Segmentation and Reassembly: A message is divided into transmittable segments,
    each segment containing a sequence number. These numbers enable the transport
    layer to reassemble the message correctly upon arriving at the destination and
    to identify and replace packets that were lost in the transmission.


    ![](img/f7819d05465fc14719b3ebbba980271a_56_0.png)


    **Figure 4:** Transport layer.


    +   * Connection Control: The transport layer can be either connectionless or
    connection-oriented. A connectionless transport layer treats each segment as an
    independent packet and delivers it to the transport layer at the destination machine.
    A connection-oriented transport layer makes a connection with the transport layer
    at the destination machine first before delivering the packets. After all the
    data are transferred, the connection is terminated.

    * Flow Control: Like the data link layer, the transport layer is responsible for
    flow control. However, flow control at this layer is performed end to end rather
    than across a single link.

    * Error Control: Like the data link layer, the transport'
