- pgno: 31
  md: '# Wired Technologies


    +   - Twisted-Pair - This is the most widely used medium for telecommunication.
    Twisted-pair wires are ordinary telephone wires which consist of two copper wires
    twisted into pairs and are used for both voice and data transmission. The use
    of two wires twisted together helps reduce crosstalk and electromagnetic induction.
    The transmission speed range from 2 million bits per second to 100 million bits
    per second.


    +   - Coaxial Cable – These cables are widely used for cable television systems,
    office buildings, and other worksites for local area networks. The cables consist
    of copper or aluminum wire wrapped with insulating layer typically of a flexible
    material with a high dielectric constant, all of which are surrounded by a conductive
    layer. The layers of insulation help minimize interference and distortion. Transmission
    speed range from 200 million to more than 500 million bits per second.


    +   - Fiber Optics – These cables consist of one or more filaments of glass wrapped
    in a protective layer. It transmits light which can travel over long distance
    and higher bandwidths. Fiber-optic cables are not affected by electromagnetic
    radiation. Transmission speed could go up as high as trillions of bits per second.
    The speed of fiber optics is hundreds of times faster than coaxial cables and
    thousands of times faster than twisted-pair wire.


    # Wireless Technologies


    +   - Terrestrial Microwave – Terrestrial microwaves use Earth-based transmitter
    and receiver. The equipment look similar to satellite dishes. Terrestrial microwaves
    use low-gigahertz range, which limits all communications to line-of-sight. Path
    between relay stations spaced approx. 30 miles apart. Microwave antennas are usually
    placed on top of buildings, hills, and mountain peaks.


    +   - Communications Satellites – The satellites use microwave radio as their
    telecommunications medium which are not deflected by the Earth''s atmosphere.
    The satellites are stationed in space, typically 22,000 miles above the equator.
    These Earth-orbiting systems are capable of receiving and relaying voice, data,
    and TV signals.


    +   - Cellular and PCS Systems – Several radio communications technologies. The
    systems are divided into different geographic area. Each area has low-power transmitter
    or radio relay antenna device to relay calls from one area to the next area.


    +   - Wireless LANs – Wireless local area network use a high-frequency radio technology
    similar to digital cellular and a low-frequency radio technology. Wireless LAN
    use spectrum technology to enable communication between multiple devices in a
    limited area. Example of open-standard wireless radio-wave technology is IEEE
    802.11b.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '+   • Bluetooth – A short range wireless technology. Operate at approx. 1Mbps
    with range from 10 to 100 meters. Bluetooth is an open wireless protocol for data
    exchange over short distances.


    +   • The Wireless Web – The wireless web refers to the use of the World Wide
    Web through equipment''s like cellular phones, pagers, PDAs, and other portable
    communications devices. The wireless web service offers anytime/anywhere connection.


    # Scale


    Networks are often classified as Local Area Network (LAN), Wide Area Network (WAN),
    Metropolitan Area Network (MAN), Personal Area Network (PAN), Virtual Private
    Network (VPN), Campus Area Network (CAN), Storage Area Network (SAN), etc. depending
    on their scale, scope and purpose. Usage, trust levels and access rights differ
    between these types of network - for example, LANs tend to be designed for internal
    use by an organization''s internal systems and employees in individual physical
    locations (such as a building), while WANs may connect physically separate parts
    of an organization to each other and may include connections to third parties.


    # Functional Relationship (Network Architecture)


    Computer networks may be classified according to the functional relationships
    which exist among the elements of the network, e.g., Active Networking, Client-server
    and Peer-to-peer (workgroup) architecture.


    # Network Topology


    Computer networks may be classified according to the topology upon which the network
    is based, such as bus network, star network, ring network, mesh network, star-bus
    network, tree or hierarchical topology network. Network topology signifies the
    way in which devices in the network see their logical relations to one another.
    The use of the term “logical” here is significant. That is, network topology is
    independent of the “physical” layout of the network. Even if networked computers
    are physically placed in a linear arrangement, if they are connected via a hub,
    the network has a Star topology, rather than a bus topology. In this regard the
    visual and operational characteristics of a network are distinct; the logical
    topology is not necessarily the same as the physical layout.


    Network topology is the arrangement of the elements (links, nodes, etc.) of a
    communication network.


    ![](img/f7819d05465fc14719b3ebbba980271a_32_0.png)'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'Networks may be classified based on the method of data used to convey the data,
    these include digital and analog networks.


    ![](img/f7819d05465fc14719b3ebbba980271a_33_0.png)


    # CORE CONCEPT:

    COMPUTER NETWORKS nBASED ON TRANSMISSION TECHNOLOGY


    Computer networks are essential infrastructures that facilitate communication
    and data exchange among devices and systems. They rely on various transmission
    technologies to transmit information from one point to another efficiently and
    reliably.


    The transmission means, is that sending a signal from one location to another.
    Transmission technologies refer to the physical layer protocol such as modulation,
    demodulation, line coding, error control etc. The transmission technology can
    be categorized broadly into two types:


    +   1. Broadcast networks and

    2. Point-to-point networks.


    # Broadcast Network


    Broadcast networks have a single communication channel that is shared by all the
    machines on the network. Short messages, called packets in certain contexts, sent
    by any machine are received by all the others.


    An address field within the packet specifies for whom it is intended. Upon receiving
    a packet, a machine checks the address field. If the packet is intended for itself,
    it processes the packet; if the packet is intended for some other machine, it
    is just ignored.


    Broadcast systems generally also allow the possibility of addressing a packet
    to all destinations by using a special code in the address field.


    When a packet with this code is transmitted, it is received and processed by every
    machine on the network. This mode of operation is called broadcasting.


    Some broadcast systems also support transmission to a subset of the machines,
    something known as multicasting. One possible scheme is to reserve one bit to
    indicate multicasting. The remaining (n-1) address bits hold a group number. Each
    machine can “subscribe” to any or all of the groups. When a packet is sent to
    a certain group, it is delivered to ail machines subscribing to that group.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Features of Broadcast Network


    A broadcast network is a type of computer network that employs a broadcasting
    method to transmit data from one sender to multiple receivers. In this network
    model, data packets are broadcasted over the network, and all connected devices
    receive the transmitted data. Broadcast networks have several distinctive features
    that differentiate them from other types of networks. Here are some key features
    of broadcast networks:


    +   - Broadcasting: The primary feature of a broadcast network is its broadcasting
    capability. When a device wants to send data to all devices on the network, it
    simply broadcasts the data to all connected devices. This ensures that all devices
    receive the transmitted data simultaneously. It is a one-to-all communication
    model.

    - Simplicity: Broadcast networks are relatively simple to implement and manage.
    Devices do not need to maintain complex routing tables or keep track of specific
    addresses for other devices. This simplicity is advantageous for smaller networks
    with a limited number of devices.

    - Addressing: In broadcast networks, devices typically do not have unique addresses.
    Instead, data packets are addressed to a special broadcast address that signifies
    all devices on the network. When a device receives a packet with the broadcast
    address, it knows the data is intended for all connected devices.

    - Traffic and Bandwidth: Since data is broadcasted to all devices, broadcast networks
    generate more network traffic compared to other network topologies, such as point-to-point
    or switched networks. This can lead to increased bandwidth usage and potential
    network congestion, especially as the number of devices on the network grows.

    - Network Size: Broadcast networks are best suited for smaller network environments
    with a limited number of devices. As the network grows larger, the amount of broadcast
    traffic increases, potentially causing efficiency and scalability issues.

    - Collision Domain: In a broadcast network, all devices share the same collision
    domain, meaning that when devices transmit transmit data simultaneously, a collision
    occurs, and the data becomes corrupted. This collision can be resolved through
    various collision detection and avoidance mechanisms.

    - Data Security: Broadcast networks have limited inherent security mechanisms.
    Since data is transmitted to all devices, there is no inherent confidentiality
    for the transmitted information. Additional security measures, such as encryption
    and authentication, are required to ensure data security.

    - Broadcast Storms: In large broadcast networks, there is a risk of broadcast
    storms, where a high volume of broadcast packets floods the network. This can
    lead to network congestion and reduced performance. To mitigate'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'broadcast storms, switches and routers may be introduced to segment the network
    and limit broadcast traffic.


    +   - Application Scenarios: Broadcast networks are commonly used in scenarios
    where a single sender needs to disseminate information to all connected devices
    simultaneously. Examples include announcements or updates sent to all devices
    in a local area network.


    Broadcast networks excel in simplicity and ease of implementation, making them
    suitable for smaller networks with limited devices and scenarios where broadcasting
    data to all devices is essential. However, they may face challenges related to
    network congestion, scalability, and security in larger and more complex environments,
    which can be addressed by incorporating additional network management and security
    measures.


    # Point-to-Point Networks


    Point-to-point networks consist of many connections between individual pairs of
    machines. To go from the source to the destination, a packet on this type of network
    may have to visit one or more intermediate machines. Often multiple routes, of
    different lengths are possible, so routing algorithms play an important role in
    point-to-point networks. As a general rule (although there are many exceptions),
    smaller, geographically localized networks tend to use broadcasting, whereas larger
    networks usually are point-to-point.


    # Advantages of Point-to-Point Networks


    Point-to-point networks offer several advantages that make them a preferred choice
    for certain applications and scenarios. These advantages stem from their direct,
    dedicated, and efficient communication model between two devices. Here are the
    key advantages of point-to-point networks:


    +   - Dedicated Bandwidth: Point-to-point networks provide dedicated communication
    channels between two devices. This means that the bandwidth of the connection
    is available exclusively to the communicating devices, ensuring efficient data
    transfer without contention or sharing with other devices.


    +   - Low Latency: Since data travels directly between the two endpoints without
    passing through intermediate devices, point-to-point networks exhibit low latency.
    Reduced transmission delay is particularly beneficial for real-time communication
    and critical applications where prompt data delivery is crucial.


    +   - High Security: Point-to-point connections inherently offer a higher level
    of security compared to broadcast networks. As communication occurs between two
    specific devices, the risk of unauthorized access to the transmitted data is minimized.
    This makes point-to-point networks suitable for sensitive and confidential information
    exchange.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '+   Simplicity: Point-to-point networks are straightforward to implement and
    manage. With only two devices involved in communication, there is no need for
    complex addressing schemes or routing protocols. This simplicity reduces network
    configuration and maintenance overhead.


    +   Reliability: The direct link between the two devices in a point-to-point network
    enhances reliability. There are no intermediate devices or shared communication
    paths that could introduce potential points of failure. This increased reliability
    is vital for critical applications and ensures consistent connectivity.


    +   Full Duplex Communication: Point-to-point connections typically support full
    duplex communication, enabling simultaneous bidirectional transfer. This efficient
    use of the communication channel maximizes throughput and facilitates smooth,
    two-way communication.


    +   Privacy: Point-to-point networks provide a private communication channel between
    the two connected devices. This privacy is beneficial for scenarios where confidentiality
    is essential, such as private communications between businesses or secure connections
    between remote offices.


    +   Suitable for Specific Applications: Point-to-point networks are ideal for
    certain applications where direct communication between two specific devices is
    necessary. For example, they are commonly used in building-connections, connecting
    remote sites, or establishing secure links between servers and clients.


    +   Scalability for Specific Cases: While point-to-point networks may not be as
    scalable as other network topologies, large networks are scalable in specific
    cases where individual connections between critical endpoints are required. This
    makes them a valuable solution for tailored, dedicated communication needs.


    +   Cost-Effectiveness: Point-to-point networks can be cost-effective for connecting
    two specific locations or devices over short to medium distances. They eliminate
    the need for extensive networking infrastructure and equipment, making them an
    economical choice for certain applications.


    Point-to-point networks offer dedicated bandwidth, low latency, high security,
    and reliability, making them suitable for specific applications where direct communication
    between two devices is required. They are simple to implement, cost-effective
    for certain scenarios, and provide enhanced privacy, making them an attractive
    solution for critical communication needs.


    # Characteristics of Point-to-Point Networks


    ![](img/f7819d05465fc14719b3ebbba980271a_36_0.png)'
