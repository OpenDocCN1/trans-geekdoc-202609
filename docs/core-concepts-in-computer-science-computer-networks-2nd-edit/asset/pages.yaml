- pgno: 13
  md: '# INTRODUCTION


    A computer network is a system that connects two or more computing devices for
    transmitting and sharing information. Computing devices include everything from
    a mobile phone to a server. These devices are connected using physical wires such
    as fiber optics, but they can also be wireless.


    The first working network, called ARPANET, was created in the late 1960s and funded
    by the U.S. Department of Defense. Government researchers used to share information
    at a time when computers were large and difficult to move. We have come a long
    way today from that basic kind of network. Today’s world revolves around the internet,
    which is a network of networks that connects billions of devices across the world.
    Organizations of all sizes use networks to connect their employees’ devices and
    shared resources as printers.


    An example of a computer network at large is the traffic monitoring systems in
    urban cities. These systems alert officials and emergency responders with information
    about traffic flow and incidents. A simpler example is using collaboration software
    as Google Drive to share documents with colleagues who work remotely. Every time
    we connect via a video call, stream movies, share files, chat with instant messages,
    or just access something on the internet, a computer network is at work.


    Computer networking is the branch of computer science that deals with the ideation,
    architecture, creation, maintenance, and security of computer networks. It is
    a combination of computer science, computer engineering, and telecommunications.


    ![](img/f7819d05465fc14719b3ebbba980271a_13_0.png)


    # CORE CONCEPT:

    COMPUTER NETWORK


    Computer Network uses distributed processing in which task is divided among several
    computers. Instead, a single computer handles an entire task, each separate computer
    handles a subset.


    The term “computer network” is to mean an interconnected collection of autonomous
    computers. Two computers are said to be interconnected if they are able to exchange
    information. The connection need not be via a computer wire; fiber optics, microwaves,
    and communication satellites can also be used. By requiring the computers to be
    autonomous, we wish to exclude from our definition systems where there is a clear
    master/slave relation. If one computer can forcibly start, or control another
    one, the computers are not autonomous. A system with one control unit and many
    slaves is not a network; nor is it a large computer with remote printers and terminals.


    A computer network is a group of computers that are connected to each other for
    the purpose of communication. Networks may be classified according to a wide variety
    of characteristics.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Definition of a Computer Network


    A computer network is interconnection of various computer systems located at different
    places. In computer network two or more computers are linked together with a medium
    and data communication devices for the purpose of communicating data and sharing
    resources. The computer that provides resources to other computers on a network
    is known as server. In the network the individual computers, which access shared
    network resources, are known as nodes.


    A computer network can be defined as a collection of interconnected computers
    in such a way that they share resources. A computer system only referred to a
    group of the computers and hardware components interconnected by communicating
    channels that allow sharing of resources and information. Technically, if at least
    one process in one computer can send or receive data to/from at least one process
    residing on a remote computer, then two machines are said to be a network.


    ![](img/f7819d05465fc14719b3ebbba980271a_14_0.png)


    As you can see from the diagram above, any computer that engages with another
    computer by Sending/Receiving messages is supposed to be in a network. A system
    classifies according to a wide variety of characteristics such as, “Medium used
    to transport data,” “Communication protocols used,” “Scale,” “Topology” and “Organizational
    scope.”


    # What Is a Network?


    A network, in computing, is a group of two or more devices that can communicate.
    In practice, a network is comprised of a number of different computer systems
    connected by physical and/or wireless connections. The scale can range from a
    single PC sharing basic peripherals to massive data centers located around the
    World, to the Internet itself. Regardless of scope, all networks allow computers
    and/or individuals to share information and resources.


    Computer networks serve a number of purposes, of which include:


    +   - Communications such as email, instant messaging, chat rooms, etc.

    - Shared hardware such as printers and input devices

    - Shared data and information through the use of shared storage devices'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Core Concepts in Computer Science: Computer Networks


    Shared software, which is achieved by running applications on remote computers.


    Early computer networks of the late 1950s included the U.S. military’s Semi-Automatic
    Ground Environment (SAGE) and the commercial airline reservation system called
    the- SABRE. Based on designs developed in the 1960s, the Advanced Research Projects
    Agency Network (ARPANET) was created in 1969 by the U.S. Department of Defense
    and was based on circuit switching – the idea that a single communication line,
    such as a two-party telephone connection, serves a dedicated circuit for the duration
    of the communication. This simple network evolved into the present day Internet.


    Military radar system is a sophisticated electronic device used by the military
    for detecting, tracking and identifying various objects within the airspace.


    # History of Computer Network


    The chronology of significant computer-network developments includes:


    +   In the late 1950s, early networks of computers included the U.S., military
    radar system Semi-Automatic Ground Environment (SAGE).


    +   In 1959, Anatolii Ivanovich proposed to the Central Committee of the Communist
    Party of the Soviet Union a detailed plan for the re-organization of the control
    of the Soviet armed forces and of the Soviet economy on the basis of a network
    of computing centers, the OGAS.


    +   In 1960, the commercial airline reservation system semi-automatic business
    research environment (SABRE) went online with two connected mainframes.


    +   In 1963, J. C. R. Lickl sent a memorandum to office colleagues discussing
    the concept of the “Intergalactic Computer Network”, a computer network intended
    to allow general communications among users.


    +   In 1964, researchers at Dartmouth College developed the Dartmouth Time Sharing
    System for distributed users of large computers. The same year, at Massachusetts
    Institute of Technology, a research group supported by General Electric and Bell
    Labs used a computer to route and manage telephone connections.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '+   Throughout the 1960s, Paul Baran, and Donald Davies independently developed
    the concept of packet switching to transfer information between computers over
    a network. Davies pioneered the implementation of the concept with the NPL network,
    a local area network at the National Physical Laboratory (United Kingdom) using
    a line speed of 768 kbit/s.


    +   In 1965, Western Electric introduced the first widely used telephone switch
    that implemented true computer control.


    +   In 1966, Thomas Marill and Lawrence G. Roberts published a paper on an experimental
    wide area network (WAN) for computer time sharing.


    +   In the 1960s, the first nodes of ARPANET were connected using 50 kbit/s circuits
    between the University of California at Los Angeles, the Stanford Research Institute,
    the University of California at Santa Barbara, and the University of Utah. Leonard
    Kleinrock adopted theoretical work to model the performance of packet-switched
    networks, which underpinned the development of the ARPANET. His theoretical work
    on hierarchical routing in the late 1970s with farouk Kamoun remains critical
    to the operation of the Internet today.


    +   In 1972, commercial services using X.25 were deployed, and later used as an
    underlying infrastructure for expanding TCP/IP networks.


    +   In 1973, the French CYCLADES network was the first to make the hosts responsible
    for the reliable delivery of data, rather than this being a centralized service
    of the network itself.


    +   In 1973, Robert Metcalfe wrote a formal memo to Xerox PARC describing Ethernet,
    a networking system that was based on the Aloha network, developed in the 1960s
    by Norman Abram and colleagues at the University of Hawaii. In July 1976, Robert
    Metcalfe and David Boggs published their paper “Ethernet: Distributed Packet Switching
    for Local Computer Networks” and collaborated on several patents received in 1977
    and 1978. In 1979, Robert Metcalfe pursued making Ethernet an open standard.


    +   In 1976, John Murphy of Datapoint Corporation created ARCNET, a token-passing
    network first used to share storage devices.


    +   In 1995, the transmission speed capacity for Ethernet increased from 10 Mbit/s
    to 100 Mbit/s. By 1998, Ethernet supported transmission speeds of a Gigabit. Subsequently,
    higher speeds of up to 10 Gigabit/s were added (as of 2016). The ability of Ethernet
    to scale easily (as quickly adapting to new fiber optic cable speeds) is a contributing
    factor to its continued use.


    # Nature of Computer Networks


    Computer networks are intricate systems that facilitate the seamless exchange
    of data and resources among connected devices. Their nature is characterized by


    ![](img/f7819d05465fc14719b3ebbba980271a_16_0.png)'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'interconnectedness, communication protocols, scalability, and the ability to
    share information across various geographic locations.


    At their core, computer networks are built on the principle of interconnectedness.
    Devices such as computers, servers, routers, switches, and other network components
    are linked together, forming a web of communication pathways. This interconnected
    nature enables efficient data transmission and resource sharing, allowing users
    to access information, services, and applications regardless of their physical
    location.


    To ensure orderly communication within the network, specific communication protocols
    are employed. The most fundamental and widely used protocol suite is TCP/IP (Transmission
    Control Protocol/Internet Protocol). These protocols govern how data packets are
    transmitted, routed, and received, ensuring reliable and error-free exchange.
    Other protocols handle tasks such as email transmission (SMTP), web browsing (HTTP),
    and file transfer (FTP).


    Scalability is a vital characteristic of computer networks. As the number of connected
    devices and data traffic grows, networks must be flexible enough to accommodate
    the increased load. Scalability is achieved through efficient network design and
    the use of robust hardware and software components. This ensures that networks
    can expand to meet the ever-growing demands of users and applications without
    compromising performance or stability.


    One of the most significant advantages of computer networks is the ability to
    share information across vast geographic distances. Wide Area Networks (WANs)
    connect devices separated by hundreds or thousands of miles, enabling seamless
    communication between remote locations. This global connectivity has transformed
    the way people collaborate, conduct business, and access information worldwide.


    Security is a paramount concern in computer networks. With data being transmitted
    and shared across various devices and networks, safeguarding information from
    unauthorized access and malicious threats is crucial. Network security measures,
    such as firewalls, encryption, authentication mechanisms, and intrusion detection
    systems, are implemented to protect sensitive data and ensure network integrity.


    The dynamic and ever-evolving nature of computer networks has given rise to innovations
    like the Internet of Things (IoT). IoT extends network connectivity beyond traditional
    devices to include everyday object such as smart appliances, wearables, and industrial
    sensors. This intersection of physical and virtual objects enables automation,
    data gathering, and remote control, promising increased efficiency and convenience
    in various aspects of life and industry.


    Computer networks form the backbone of modern communication and information exchange.
    Their interconnected nature, communication protocols, scalability, and global
    reach make them indispensable in the digital age. However, network administrators
    and engineers must continually adapt to new challenges and security threats as
    technology advances, ensuring that these networks remain efficient, reliable,
    and secure for users worldwide.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Properties of Computer Network


    Computer networking may be considered a branch of electrical engineering, electronics
    engineering, telecommunications, computer science, information technology or computer
    engineering, since it relies upon the theoretical and practical application of
    the related disciplines.


    A computer network facilitates interpersonal communications allowing users to
    communicate efficiently and easily via means: email, instant messaging, online
    chat, telephone, video telephone calls, and video conferencing. A network allows
    sharing of network and computing resources. Users may access and use resources
    provided by devices on the network, such as printing a document on a shared network
    printer or use of shared storage device. A network allows sharing of files, data,
    and other types of information giving authorized users the ability to access information
    stored on other computers on the network. Distributed computing uses computing
    resources across a network to accomplish tasks.


    Video conferencing is an Online technology that allows users in different locations
    to face-to-face meetings without having to move to a single location together.


    A computer network may be used by security hackers to deploy computer viruses
    or computer worms on devices connected to the network, or to prevent these devices
    from accessing the network via a denial-of-service attack.


    These are some properties of network:


    +   - Facilitate communications: Using a network, people can communicate efficiently
    and easily via email, instant messaging, chat rooms, telephone, video telephone
    calls, and video conferencing.


    +   - Permit sharing of files, data, and other types of information: In a network
    environment, authorized users may access data and information stored on other
    computers on the network. The capability of providing access to data and information
    on shared storage devices is an important feature of many networks.


    +   - Share network and computing resources: In a networked environment, each
    computer on a network may access and use resources provided by devices on the
    network, such as printing a document on a shared network printer. Distributed
    computing uses computing resources across a network to accomplish tasks.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Characteristics of a Computer Network


    +   - Share resources from one computer to another.

    - Create files and store them in one computer, access those files from the other
    computer(s) connected over the network.

    - Connect a printer, scanner, or a fax machine to one computer within the network
    and let other computers of the network use the machines available over the network.


    > Computer networks enable seamless and efficient communication between individuals
    and groups within an organization or across the globe.


    Following is the list of hardware’s required to set up a computer network.


    +   - Network Cables

    - Distributors

    - Routers

    - Internal Network Cards

    - External Network Cards


    # Network Cables


    Network cables are used to connect computers. The most commonly used cable is
    Category 5 cable RJ-45.


    ![](img/f7819d05465fc14719b3ebbba980271a_19_0.png)


    # Distributors


    A computer can be connected to another one via a serial port but if we need to
    connect many computers to produce a network, this serial connection will not work.


    ![](img/f7819d05465fc14719b3ebbba980271a_19_1.png)'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'The solution is to use a central body to which other computers, printers, scanners,
    etc. can be connected and then this body will manage or distribute network traffic.


    # Router


    A router is a type of device which acts as the central point among computers and
    other devices that are a part of the network. It is equipped with holes called
    ports. Computers and other devices are connected to a router using network cables.
    Now-a-days router come in wireless modes using which computers can be connected
    without any physical cable.


    ![](img/f7819d05465fc14719b3ebbba980271a_20_0.png)


    # Network Card


    Network card is a necessary component of a computer without which a computer cannot
    be connected over a network. It is also known as the network adapter or Network
    Interface Card (NIC). Most branded computers have network card pre-installed.
    Network cards are of two types: Internal and External Network Cards.


