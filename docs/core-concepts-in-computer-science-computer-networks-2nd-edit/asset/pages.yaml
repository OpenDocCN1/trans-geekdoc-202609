    | Class 1 Devices | High | 100 mW (20 dBm) | Up to 100 meters (300 feet) |

    | Class 2 Devices | Medium | 2.5 mW (4 dBm) | Up to 10 meters (30 feet) |

    | Class 3 Devices | Low | 1 mW (0 dBm) | 0.1–10 meters (less than 30 feet ) |


