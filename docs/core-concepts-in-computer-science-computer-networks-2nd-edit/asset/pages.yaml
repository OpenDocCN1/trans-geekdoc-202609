    # Communication Channels


    Communication channels are the medium that connects two or more workstations.
    Workstations can be connected by either wired media or wireless media. It is also
    known as a transmission medium.


    The transmission medium or channel is a link that carries messages between two
    or more devices. We can group the communication media into two categories:


    +   - Guided media transmission Ungguided media transmission


    +   1. Guided Media: In this transmission medium, the physical link is created
    using wires or cables between two or more computers or devices, then the data
    is transmitted using these cables in terms of signals. Guided media transmission
    of the following types:


    +   A. Twisted pair cable: It is the most common form of wire used in communication.
    In a twisted-pair cable, two insulated wires are wrapped together in a double
    helix. The twisting of the wire reduces the crosstalk. It is known as the leaking
    of a signal from one wire to another due to which signal can corrupt and cause
    network errors. The twisting protects the wire from internal crosstalk as well
    as external forms of signal interference. Types of Twisted Pair Cable:


    Unshielded Twisted Pair (UTP): It is used in computers and telephones widely.
    As the name suggests, there is no external shielding so it does not protects from
    external interference. It is cheaper than STP.


    Shielded Twisted Pair (STP): It offers greater protection from crosstalk due to
    shield. Due to shielding, it protects from external interference. It is heavier
    and costlier as compare to U.


    +   B. Coaxial Cable: consists of a solid wire core that is surrounded by one
    or more foil or wire shields.


    The inner core of the coaxial cable carries the signal and the outer shield provides
    the ground. It is widely used for television signals and also used by large corporations
    in building security systems. Data transmission of this cable is better but expensive
    as compared to twisted pair.'
