- pgno: 211
  md: '# 200


    In order to address these challenges, over the next 5 years, there will be a new
    wireless standard developed (“5G”) which has a target of orders-of-magnitude increase
    in system capacity. In order to enable this, as well as deal with the envisaged
    proliferation of IoT devices, current technologies will be insufficient, and fundamental
    new needs to be developed. This workshop will explore fundamental new ideas in
    wireless networks and its connections to mathematics. There are several workshops
    and conferences devoted to wireless systems and implementations, but there are
