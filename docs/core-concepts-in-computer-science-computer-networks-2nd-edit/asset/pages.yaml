    # # CORE CONCEPT:

    NETWORK TOPOLOGY


    ![](img/f7819d05465fc14719b3ebbba980271a_133_0.png)


    Network Topology is the schematic description of a network arrangement, connecting
    various nodes (sender and receiver) through lines of connection.


    Network topology refers to how various nodes, devices, and connections on your
    network are physically or logically arranged in relation to each other. Think
    of your network as a city, and the topology as the road map. Just as there are
    many ways to arrange and maintain a city—such as making sure the avenues and boulevards
    facilitate passage between the parts of town getting the most traffic—there are
    several ways to arrange a network. Each has advantages and disadvantages depending
    on the needs of your company, certain arrangements can give you a greater degree
    of connectivity and security.


    There are two approaches to network topology: physical and logical. Physical network
    topology, as the name suggests, refers to the physical connections and intersections
    between nodes and the network—the wires, cables, and so forth. Logical network
    topology is a little more abstract and strategic, referring to the conceptual
    understanding of how and why the network is arranged the way it is, and how data
    moves through it.


    The arrangement of a network which comprises nodes and connecting lines via sender
    and receiver is referred as network topology. The various network topologies are:


    # ## Bus Topology


    A bus topology is multipoint. One long cable acts as a backbone to link all the
    devices in a network. Nodes are connected to the bus cable by drop lines and taps.
    A drop line is a connection running between the device and the main cable. A tap
    is a connector that either splices into the main cable or punctures the sheathing
    of a cable to create a contact with the metallic core. As a signal travels along
    the backbone, some of its energy is transformed into heat. Therefore, it becomes
    weaker and weaker as it travels farther and farther. For this reason there is
    a limit on the number of taps a bus can support and on the distance between those
    taps.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Nature of BUS Topology


    The nature of a Bus topology in computer networks can be described by its key
    characteristics and advantages. In a Bus topology, all devices in the network
    are connected to a single communication channel called the “bus.” This bus serves
    as shared transmission medium through which data is transmitted from one device
    to all other devices on the network. Each device receives the transmitted data
    and processes only the information intended for it.


    Here are the primary nature and features of a Bus topology:


    +   1. Simplicity and Cost-Effectiveness: Bus topology is relatively simple to
    set up and cost-effective as it requires minimal cabling. Devices are connected
    in a linear manner to the bus, making the physical layout straightforward.


    +   2. Shared Communication Medium: In a Bus topology, all devices share the same
    communication medium (the bus) for data transmission. When a device sends data
    onto the bus, all other devices receive it. Each device checks the address to
    determine whether the data is meant for it.


    +   3. Passive and Active Devices: Devices in a Bus topology can be passive or
    active. Passive devices only receive data, while active devices can send and receive
    data. Passive devices do not participate in the regeneration of the signal, so
    the bus must be periodically reinforced to prevent signal degradation.


    +   4. Termination: The bus requires proper termination at both ends to prevent
    proper signal transmission. Termination resistors are added to absorb the signal
    energy at each end of the bus.


    +   5. Scalability Challenges: While Bus topology is suitable for small to medium-sized
    networks, it faces scalability challenges with larger networks. As more devices
    are added, the bus can become congested, leading to a decrease in network performance.


    +   6. Fault Tolerance: A single point of failure can disrupt the entire network
    in a Bus topology. If the bus is damaged or severed at any point, communication
    between devices can be affected.


    +   7. Collision Risk: Collisions occur in Bus topology when two or more devices
    attempt to transmit data simultaneously. This collision leads to data corruption
    and necessitates a collision detection and resolution mechanism.


    Bus topology is commonly used in small local area networks (LANs) due to its simplicity
    and cost-effectiveness. However, its limitations, such as vulnerability to


    ![](img/f7819d05465fc14719b3ebbba980271a_134_0.png)'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'single points of failure and scalability issues, have led to its decreased
    popularity in larger and more critical network setups.


    # Features of Bus Topology


    +   1. It transmits data only in one direction.

    2. Every device is connected to a single cable


    # Advantages of Bus Topology


    +   1. It is cost effective.

    2. Cable required is least compared to other network topology.

    3. Used in small networks.

    4. It is easy to understand.

    5. Easy to expand joining two cables together.


    # Disadvantages of Bus Topology


    +   1. Cables fails then whole network fails.

    2. If network traffic is heavy or nodes are more the performance of the network
    decreases.

    3. Cable has a limited length.

    4. It is slower than the ring topology.


    # RING Topology


    In a ring topology, each device has a dedicated point-to-point connection with
    only the two devices on either side of it. A signal is passed along the ring in
    one direction, from device to device, until it reaches its destination. Each device
    in the ring incorporates a repeater. When a device receives a signal intended
    for another device, its repeater regenerates the bits and passes them along.


    Network traffic or data traffic is the amount of data moving across a network
    at a given point of time.


    ![](img/f7819d05465fc14719b3ebbba980271a_135_0.png)'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# Features of Ring Topology


    +   - A number of repeaters are used for Ring topology with large number of nodes,
    because someone wants to send some data to the last node in the ring topology
    with 100 nodes, then the data will have to pass through 99 nodes to reach the
    100th node. Hence to prevent data loss repeaters are used in the network.


    +   - The transmission is unidirectional, but it can be made bidirectional by
    having 2 connections between each Network Node, it is called Dual Ring Topology.


    +   - In Dual Ring Topology, two ring networks are formed, and data flow is in
    opposite direction in them. Also, if one ring fails, the second ring can act as
    a backup, to keep the network up.


    +   - Data is transferred in a sequential manner that is bit by bit. Data transmitted,
    has to pass through each node of the network, till the destination node.


    # Advantages of Ring Topology


    +   - Transmitting network is not affected by high traffic or by adding more nodes,
    as only the nodes tokens can transmit data.


    +   - Cheap to install and expand


    # Disadvantages of Ring Topology


    +   - Troubleshooting is difficult in ring topology.


    +   - Adding or deleting the computers disturbs the network activity.


    +   - Failure of one computer disturbs the whole network.


    # STAR Topology


    In a star topology, each device has a dedicated point-to-point link only to a
    central controller, usually called a hub. The devices are not directly linked
    to one another. Unlike a mesh topology, a star topology does not allow direct
    traffic between devices. The controller acts as an exchange: If one device wants
    to send data to another, it sends the data to the controller, which then relays
    the data to the other connected device.


    > The star network topology works well when workstations are deployed randomly
    throughout a building or facility. With the hub-and-spike design, it is easy to
    add or remove workstations, as all cabling is pulled and connected to a central
    hub.


    ![](img/f7819d05465fc14719b3ebbba980271a_136_0.png)'
  merge: -1
  img_proc: true
- pgno: 137
  md: '![](img/f7819d05465fc14719b3ebbba980271a_137_0.png)


    # Features of Star Topology


    +   * Every node has its own dedicated connection to the hub.

    * Hub acts as a repeater for data flow.

    * Can be used with twisted pair, Optical Fibre or coaxial cable.


    # Advantages of Star Topology


    +   * Fast performance with few nodes and low network traffic.

    * Hub can be upgraded easily.

    * Easy to troubleshoot.

    * Easy to setup and modify.

    * Only that node is affected which has failed, rest of the nodes can work smoothly.


    # Disadvantages of Star Topology


    +   * Cost of installation is high.

    * Expensive to use.

    * If the hub fails then the whole network is stopped because all the nodes depend
    on the hub.

    * Performance is based on the hub that it depends on its capacity


    # MESH Topology


    It is a point-to-point connection to other nodes or devices. All the network nodes
    are connected to each other. Mesh has n(n-1)/2 physical channels to link n devices.


    There are two techniques to transmit data over the Mesh topology, they are:


    +   * Routing

    * Flooding


    # MESH Topology: Routing


    In routing, the nodes have a routing logic, as per the network requirements. Like
    routing logic to direct the data to reach the destination using the shortest distance.
    Or,'
