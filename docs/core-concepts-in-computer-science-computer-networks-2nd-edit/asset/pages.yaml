    link. If the duration of the input unit is T, the duration of each slot is Tin
    and the duration of each frame is T. The data rate of the output link must be
    N times the data rate of a connection to guarantee the flow of data. Time slots
    are grouped into frames. A frame consists of one complete cycle of time, with
    one slot dedicated to each sending device. In a system with N input lines, each
    frame has N slots, with each slot allocated to carrying data from a specific input
    line.

    - Interleaving TDM: It can be visualized as two fast-rotating switches, one on
