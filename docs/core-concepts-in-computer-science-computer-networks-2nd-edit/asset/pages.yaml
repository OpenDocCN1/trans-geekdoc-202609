    ![](img/f7819d05465fc14719b3ebbba980271a_210_0.png)


    # Emerging Wireless Technologies


    There is a strong need for more efficient bandwidth use and higher mobile speeds,
    given that the global mobile traffic is projected to increase nearly 11-fold between
    2013 and 2018. The number of wireless devices has already reached 7 billion, while
    smart devices that have high computing resources and network connection capabilities
    increasingly dominate the market. This number is set to increase by an order of
    magnitude as we enter the age of Internet-of-things (IoT), where smart sensing
    and machine-to-machine communication is envisaged to explode in the coming decade
    (with applications to smart health, smart environments etc.). All points to fundamental
    new challenges which will require insights from mathematics, information theory,
    computer science as well as economics to resolve.


    Internet of Things (IoT) refers to the network of physical objects, devices, and
    sensors that are interconnected and able to collect, exchange, and act on data
    without the need for direct human intervention.'
