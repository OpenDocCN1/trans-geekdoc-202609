    # Application Layer


    The application layer enables the user, whether human or software, to access the
    network. It provides user interfaces and support for services such as electronic
    mail, remote file access and transfer, shared database management, and other types
    of distributed information services.


    Specific services provided by the application layer include as:


    +   * Network Virtual: A network virtual terminal is a software version of a physical
    terminal and allows a user to log on to a remote host. To do so, the application
    creates a software emulation of a terminal at the remote host. The user''s computer
    talks to the software terminal, which, in turn, talks to the host, and vice. The
    remote host believes it is communicating with one of its terminals and allows
    one to log on.

    * File Transfer, Access, and Management (FTAM): This application allows a user
    to access files in a remote computer (to make changes or read data), to retrieve
    files from a remote computer; and to manage or control files in a remote computer.

    * Mail Services: This application provides the basis for e-mail forwarding and
    storage.

    * Directory Services: This application provides distributed database sources and
    access for global information about various objects and services.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Presentation Layer


    The presentation layer is where received data is converted into a format that
    the application is destined for understand. The work done at this layer is best
    understood as a translation job. For example, data is often encrypted at the presentation
    layer before being passed to the other layers for sending. When data is received,
    it will be decrypted and passed on to the application it is intended for in the
    format that is expected.


    Specific responsibilities of the presentation layer include:


    +   - Translation: The processes (running programs) in two systems are usually
    exchanging information in the form of character strings, numbers, and so on. Because
    different computers use different encoding systems, the presentation layer is
    responsible for interoperability between these different encoding methods. The
    presentation layer at the sender changes, the information from its sender-dependent
    format into a common format. The presentation layer at the receiving machine changes
    the common format into its receiver-dependent format.


    +   - Encryption: To carry sensitive information, a system must be able to assure
    privacy. Encryption means the sender transforms the original information to another
    form and sends the resulting message out over the network. Decryption reverses
    the original process to transform the message back to its original format.


    +   - Compression: Data compression reduces the number of bits to be transmitted.
    Data compression becomes particularly important in the transmission of multimedia
    such as text, audio, and video.


    ![](img/f7819d05465fc14719b3ebbba980271a_54_0.png)


    Figure 2: Presentation layer.'
