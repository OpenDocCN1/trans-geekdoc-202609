  md: '# CHAPTER 6


    # WIRELESS NETWORK SECURITY


    ![](img/f7819d05465fc14719b3ebbba980271a_196_0.png)


    Wireless network security is the process of designing, implementing and ensuring
    security on a wireless computer network. It is a subset of network security that
    adds protection for a wireless computer network.


    Wireless network security is also known as wireless security.


    After studying this chapter, you will understand the core concepts of:


    +   - Overview of Wireless Technology

    - Wireless LANS

    - Wireless Personal Area Networks'
