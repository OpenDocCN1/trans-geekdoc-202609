    environment.


    Networks share common devices, functions, and features including servers, clients,
    transmission media, shared data, shared printers and other hardware and software
    resources, network interface card(NIC), local operating system(LOS), and the network
    operating system (NOS).


    +   - Servers - Servers are computers that hold shared files, programs, and the
    network operating system. Servers provide access to network resources to all the
    users of the network. There are many different kinds of,'
