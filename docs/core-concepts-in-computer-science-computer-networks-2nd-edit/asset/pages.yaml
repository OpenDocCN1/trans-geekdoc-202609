    # Physical Layer


    The physical layer is the actual cable, interfaces, fibers, cards, switches, and
    other mechanical and electrical equipment that make up a network. This is the
    layer that transforms digital data into signals that can be sent down a wire to
    transmit data. These signals are often electrical, but in the case of fiber optics,
    they can also be non-electrical signals such as optics or any other type of pulse
    that can be digitally encoded. From a networking perspective, the purpose of the
    physical layer is to provide the architecture for data to be sent and received.
    The physical layer is probably the easiest layer to troubleshoot or construct,
    as this involves getting the hardware infrastructure hooked up and plugged in.


    ![](img/f7819d05465fc14719b3ebbba980271a_59_0.png)


    Figure 7: Physical layer.


    The physical layer is concerned with:


    +   - Physical Characteristics of Interfaces and Media: The physical layer defines
    the characteristics of the interface between the devices and the transmission
    medium. It also defines the type of transmission medium.


    +   - Representation of Bits: The physical layer consist of a stream of bits (sequence
    of 0’s and 1’s) without any interpretation. The physical layer defines the type
    of encoding (how 0’s and 1’s are changed to signals).


    +   - Data Rate: The transmission rate number of bits sent each-second is also
    defined by the physical layer. In other words, the physical layer defines the
    duration of a bit, which is how long lasts.


    +   - Synchronization of Bits: The sender and receiver must be synchronized at
    the


