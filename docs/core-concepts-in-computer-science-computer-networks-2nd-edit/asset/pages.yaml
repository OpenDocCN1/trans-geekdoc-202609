    To date, no software is available for monitoring intrusions, and Bluetooth devices
    are invisible to network administrators. Although different participants from
    different organizations may enforce security policies, in an ad hoc network this
    has little bearing. Every device participating in the ad hoc network is susceptible
    to the security risks of every other device. Since Bluetooth devices are unlikely
    to be administered by network administrators, users should be aware of the security
    implications of their use in environments that process sensitive data. Although
    privacy violations are not directly a security threat, agencies need to consider
    the potential for privacy violations when implementing Bluetooth technologies.
    Each Bluetooth device is equipped with its unique address (BD ADDR), and this
    address is used to log each device''s participation in the network. Security logging
    ensures device authentication (i.e., we have no proof who was operating the device,
    therefore, an individual can deny participation in the network since the address
    that is logged belongs to the device and not an individual). However, it allows
    organizations to monitor and track what an individual does on the network. Nonrepudiation
    of individuals requires strong authentication, as client digital signatures can
    be verified in a PKI (Public Key Infrastructure).


    # Loss of Integrity


    Violations of integrity result from the corruption of an organization’s or user’s
    data. The immediate effect is similar to that of a confidentiality, or disclosure,
    threat: involving a compromised network. However, integrity threats extend beyond
    this, involving the alteration, addition, or deletion of information, which is
    then passed through the network without the user or network administrator’s knowledge.
    Information that is subject to corruption includes files on the network and data
    on user devices. For example, a malicious user might employ an untrusted device,
    such as a PDA, to access the address book of another PDA or laptop. Instead of
    just monitoring the information, as would be the case with a disclosure threat,
    the malicious user alters the contact information without the owner’s knowledge
    or may even delete the information completely. If undetected, such attacks could
    result in the agency (or user) losing confidence in its data and system. Users
    should verify that their Bluetooth'
