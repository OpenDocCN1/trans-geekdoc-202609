    | | Reject (REJ) | Reject (REJ) | Supervisory (S) | 09 00 to 09 FF |

    | | Set Asynchronous Balance Mode Extended (SABME) | Unnumbered Acknowledgment
    (UA) | Unnumbered (U) | 6F, 7F (SABME) and 63, 73 (UA) |

    | | Disconnect (DISC) | Disconnected Mode (DM) | Unnumbered (U) | 43, 53 (DISC)
    and 0F, 1F (DM) |

    | | | Frame Reject (FRMR) | Unnumbered (U) | 87,97 |

    | Type 3 (AC) | Ack Connectionless, seq 0 (AC0) | Ack Connectionless, seq 0 (AC0)
    | Unnumbered (U) | 67, F7 |

    | | Ack Connectionless, seq 0 AC1 | Ack Connectionless, seq 0 (AC1) | Unnumbered
    (U) | E7, F7 |


    The LLC SAP''s job is to support the up and coming MAC frames and direct them
    to the appropriate application or upper layer protocol. NetBIOS uses the SAP address
    of F0, IP uses 06 while DLSw uses 04 and Network Management uses F4. The Null
    SAP, address 00 does not identify any SAP to any protocol.'
