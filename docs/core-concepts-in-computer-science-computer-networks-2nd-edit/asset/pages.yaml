  md: 'and one server can provide several functions. For example, there are file servers,
    print servers, mail servers, communication servers, database servers, fax servers
    and web servers, to name a few.


    +   - Clients - Clients are computers that access and use the network and shared
    network resources. Client computers are basically the customers (users) of the
    network, as they request and receive services from the servers.


    +   - Transmission Media - Transmission media are the facilities used to interconnect
    computers in a network, such as twisted-pair wire, coaxial cable, and optical
    fiber cable. Transmission media are sometimes called channels, links or lines.


    ![](img/f7819d05465fc14719b3ebbba980271a_23_0.png)


    +   - Shared data - Shared data are data that file servers provide to clients
    such as data files, printer access programs and e-mail.


    +   - Shared printers and other peripherals - Shared printers and peripherals
    are hardware resources provided to the users of the network by servers. Resources
    provided include data files, printers, software, or any other items used by clients
    on the network.


    Physical layer is the first layer of the Open System Interconnection Model (OSI
    Model).


    +   - Network Interface Card - Each computer in a network has a special expansion
    card called a network interface card (NIC). The NIC prepares (formats) and sends
    data, receives data, and controls data flow between the computer and the network.
    On the transmit side, the NIC passes frames of data to the physical layer, which
    transmits the data to the physical link. On the receiver''s side, the NIC processes
    bits received from the physical layer and processes the message based on its contents.'
