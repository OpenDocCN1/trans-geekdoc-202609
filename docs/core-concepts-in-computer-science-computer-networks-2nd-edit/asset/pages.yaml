  img_proc: true
- pgno: 84
  md: '(TCP). TCP performance is affected by the frequent losses occurring at the
    link layer, because TCP inherently assumes all loss due to congestion and invokes
    the congestion control algorithms upon detecting any loss.


    Low Bandwidth: Bandwidth of wireless links may be low, which can sometimes result
    in excessive buffering at the base station. This could lead to packets being dropped
    at the base station, or transmitted back-to-back on the wireless link, which in
    turn results in high observed round trip times.


    Signal Fading: Fading typically occurs when a wireless host is mobile. Interference
    from physical factors like weather, obstacles, unavailability of channels, overlapping
    areas of different cells, could result in signal fading and blackouts. Such blackouts
    can exist for prolonged periods of time.


    Movement across cells: Mobility of a wireless host involves addressing connection
    handoff. In addition to the link layer that has to be handed off, the base station
    may maintain connection state about the transport layer which might need hand
    off. Other problems like signal fading as mentioned above occur with a high probability
    when a host moves across cells.


    Channel Asymmetry: Resolving channel contention is usually asymmetric. The sending
    entity gets more transmission time than the receiving entity. This could lead
    to TCP acknowledgments being queued for transmission on the link layer of the
    receiving entity and sent back when channel access is permitted. This can lead
    to larger round trip times measured by the TCP sender and to burst traffic, which
    subsequently reduces the throughput of the TCP connection.


    Link Latency: Wireless links may exhibit high latencies and when such delays are
    a significant fraction of the total round trip times observed by TCP, the retransmission
    timeouts of TCP are set to high values, which subsequently affects TCP performance.
    Conditions occur in wireless WANs and satellite networks. In addition, high variance
    in the measured round trip times have been observed, which impact the TCP round-trip-time
    (RTI) estimation algorithm.


    # TCP Performance Layer Enhancements


    # Transport Layer Solutions


    The degraded performance of TCP over wireless links is mostly due to mistaking
    wireless losses for congestion. Thus, numerous proposals for appropriate TCP modifications
    exist. During handoffs in cellular communications (CC) systems, packets may be
    delayed or ever lost. Recovery from these losses should be initiated right after
    handoff completion, without waiting for a timeout. TCP can achieve this by receiving
    appropriate signals from lower layers. Alternatively, TCP can exploit mobility
    hints from lower layers to heuristically distinguish losses due to handoffs. For
    these losses, TCP can avoid halving the slow start threshold during recovery,'
