    In CC systems this is achieved by non-transparent mode RLPs. Another solution
    is to perform local error recovery (a link layer task) at the IP level, in Snoop
    TCP. Snoop tracks TCP data and acknowledgments by maintaining state of each connection
    traversing a pivot point. Snoop caches unacknowledged TCP packets and uses the
    loss indications conveyed by duplicate acknowledgments, plus local timers, to
    transparently retransmit lost data. It hides duplicate acknowledgments indicating
    wireless losses from the TCP sender, preventing redundant TCP recovery. Snoop
    exploits the information in TCP packets to avoid layer control overhead. It outperforms
    split TCP schemes, and it also avoids conflicting local and TCP retransmissions
    by suppressing duplicate acknowledgments. Snoop requires the TCP receiver to be
    located right after the pivot point. If a wireless host is sending data to a remote
    receiver, TCP acknowledgments are returned too late for efficient recovery, and
    they may even signify congestion losses. Explicit Loss Notification (ELN) is needed
    for TCP to distinguish between congestion and wireless losses. If the Snoop agent
