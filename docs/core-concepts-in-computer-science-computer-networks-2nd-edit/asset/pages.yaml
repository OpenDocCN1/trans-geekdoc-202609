- pgno: 142
  md: '# CORE CONCEPT: SWITCHING


    Switching, as applied to networking and IT, is the practice of directing a signal
    or data element toward a particular hardware destination.


    Switching may be applied in various formats and can function in diverse ways within
    a greater network infrastructure.


    ![](img/f7819d05465fc14719b3ebbba980271a_142_0.png)


    Switching is process to forward packets coming in from one port to a port leading
    towards the destination.


    When data comes on a port it is called ingress, and when data leaves a port or
    goes out it is called egress. A communication system may include number of switches
    and nodes. On broad level, switching can be divided into two major categories:


    +   * Connectionless: The data is forwarded on behalf of forwarding tables. No
    previous handshaking is required and acknowledgements are optional.

    * Connection Oriented: Before switching data to be forwarded to destination, there
    is a need to pre-establish circuit along the path between both endpoints. Data
    is then forwarded on that circuit. After the transfer is completed, circuits can
    be kept for future use or can be turned down immediately.


    > Data transfer utilizes various communication mediums to move data between one
    or more nodes.


    # Types of Switching Techniques


    There are basically three types of switching methods made available. Out of three
    methods, circuit switching and packet switching are commonly used but the message
    switching has been opposed out in the general communication procedure but is still
    used in the networking application.


    +   * Circuit Switching

    * Packet Switching

    * Message Switching


    # Circuit Switching


    When two nodes communicate with each other over a dedicated communication path,
    it is called circuit switching. There ‘is a need of pre-specified route from which
    data will travels and no other data is permitted. In circuit switching, to transfer
    the'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'data, circuit must be established so that the data transfer can take place.


    Circuits can be permanent or temporary. Applications which use circuit switching
    may have to go through three phases:


    +   * Establish a circuit

    * Transfer the data

    * Disconnect the circuit


    ![](img/f7819d05465fc14719b3ebbba980271a_143_0.png)


    # Packet Switching


    +   * In packet switching, messages are divided into packets of fixed or variable
    size.

    * The size of the packet is decided by the network and the governing protocol.

    * Resource allocation for a packet is not done in packet switching.

    * Resources are allocated on demand.

    * The resource allocation is done on first-come, first-served basis.

    * Each switching node has a small amount of buffer space to hold packets temporarily.

    * If the outgoing line is busy, the packet stays in queue until the line becomes
    available.


    Packet switching method uses two routing methods:


    # 1. Datagram Packet Switching


    +   * Datagram packet switching is normally implemented in the network layer.

    * In datagram network, each packet is routed independently through the network.

    * Each packet carries a header that contains the full information about the destination.

    * When the switching node receives the packet, the destination address in the
    header of the packet is examined; the routing table is consulted to find the corresponding
    port through which the packet should be forwarded.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '![](img/f7819d05465fc14719b3ebbba980271a_144_0.png)


    # 2. Virtual Circuit Packet Switching


    +   - Virtual circuit packet switching is normally done at the data link layer.

    - Virtual circuit packet switching establishes a fixed path between a source and
    a destination to transfer the packets.

    - It is also called as connection oriented network.


    A source and destination have to go through three phases in a virtual circuit
    packet switching:


    +   I. Setup phase

    II. Data transfer phase

    III. Connection release phase


    +   A logical connection is established when a sender sends a setup request to
    the receiver and the receiver sends back an acknowledgement to the sender if the
    receiver agree.


    +   All packets belonging to the same source and destination travel the same path.


    +   The information is delivered to the receiver in the same order as transmitted
    by the sender.


    > A computer user experiences switching all the time for example, accessing the
    Internet from your computer device, whenever a user requests a webpage to open,
    the request is processed through switching of data packets only.


    ![](img/f7819d05465fc14719b3ebbba980271a_144_1.png)'
