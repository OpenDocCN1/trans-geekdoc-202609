    # Congestion Control


    Congestion is an important issue that can arise in packet switched network. Congestion
    is a situation in Communication Networks in which too many packets are present
    in part of the subnet, performance degrades. In a network may occur when the load
    on the network (i.e. the number of packets sent to the network) is greater than
    the capacity of the network (i.e. the number of packets a network can handle).


    Congestion control is different from flow control. Flow control is a data link
    issue, and concerns only one sender outrunning a single receiver (e.g. a point-to-point
    link). Congestion control is a network layer issue, and thus concerned with what
    happens when there is more data in the network than can be handled with reasonable
    packet delays, no lost packets, etc. Flow control is a local, congestion control
    is global. One of handling congestion is by using a flow control mechanism to
    reduce the traffic on the net by a particular host, hence the confusion.


