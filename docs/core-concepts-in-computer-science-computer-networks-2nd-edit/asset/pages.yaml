- pgno: 145
  md: '# Message Switching


    This technique was somewhere in middle of circuit switching and packet switching.
    In message switching, the whole message is treated as a data unit and switching
    / transferred in its entirety.


    A switch working on message switching, first receives the whole message and buffers
    until there are resources available to transfer it to the next hop. If the next
    hop is not having enough resource to accommodate large size message, the message
    is stored and waits.


    ![](img/f7819d05465fc14719b3ebbba980271a_145_0.png)


    This technique was considered substitute to circuit switching. As in circuit switching
    the whole path is blocked for two entities only. Message switching is replaced
    by packet switching. Message switching has the following drawbacks:


    +   * Every switch in transit path needs enough storage to accommodate entire
    message.

    * Because store-of-and-forward technique and waits included until resources are
    available, message switching is very slow.

    * Message switching was not a solution for streaming media and real-time applications.


    > CORE CONCEPT:

    MULTIPLEXING


    ![](img/f7819d05465fc14719b3ebbba980271a_145_1.png)


    Multiplexing is a popular networking technique that integrates multiple analog
    and digital signals into a signal transmitted over a shared medium. Multiplexers
    and de-multiplexers are used to convert multiple signals into one signal.


    Multiplexing is a technique by which different analog and digital streams of transmission
    can be simultaneously processed over a shared link. Multiplexing divides the high
    capacity medium into low capacity logical medium which is then shared by different
    streams.'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'This process is done by a technique called Multiplexing. Multiplexing combines
    multiple analog or digital signals bound for transmission through a single communication
    line or channel This. This technique has been introduced to increase channel utilization
    in multicomputer communication systems and time sharing systems and also to reduce
    the communication cost.


    # Types of Multiplexing


    Different type of multiplexing is used in communication. The following three major
    multiplexing techniques are discussed:


    +   - Frequency division multiplexing

    - Wavelength division multiplexing

    - Time division multiplexing


    # Frequency Division Multiplexing


    In the 20th century, many telephone companies used frequency-division multiplexing
    for long distance connections to multiplex thousands of voice signals through
    a coaxial cable system. For shorter distances, cheaper balanced cables were used
    for various systems like bell systems K-and N-carrier, but they didn''t allow
    large bandwidths. The FDM is an analog multiplexing that combines analog signals.
    Frequency division multiplexing is applied when the bandwidth of the link is greater
    than the combined of the signals to be transmitted.


    ![](img/f7819d05465fc14719b3ebbba980271a_146_0.png)


    Television signal transmission

    process of broadcasting television programs and content from a source (e.g., TV
    studio, satellite, cable network) to television receivers in homes or other locations.


    In this type of multiplexing, signals are generated by sending different device-modulated
    carrier frequencies, and these modulated signals are then combined into a single
    signal that can be transported by the link. To accommodate the modulated signal,
    the carrier frequencies are separated with enough bandwidth, and these bandwidth
    ranges are the channels through which different signals travel. These channels
    can be separated by used bandwidth. Some of the examples for the time division
    multiplexing include radio and television signal transmission.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# Wavelength Division Multiplexing


    Wavelength division multiplexing (WDM) is a technology in fiber optic communications;
    and, for the high capacity communication systems, wavelength division multiplexing
    is the most promising concept. This system uses multiplexer at transmitter to
    join signals and demultlexer to split the signals apart, at the receiver. The
    purpose of WDM is to combine multiple light sources into a single light source
    at the multiplexer; and, at the demultlexer the single light is converted into
    multiple light sources.


    Demultlexer (or demux) is a device that takes a single input line and routes it
    to one of several digital output lines.


    WDM is designed to use the high data rate capability of the fiber optic cable.
    The data rate of this cable is higher than the metallic transmission cable''s
    data rate. Conceptually, the wavelength division multiplexing is same as the frequency
    division multiplexing, except for the transmission through the fiber optic channels
    wherein the multiplexing and demultiplexing involves optical signals.


    # Weleng Division Multiplexing


    ![](img/f7819d05465fc14719b3ebbba980271a_147_0.png)




    # Time-Division Multiplexing


    Time division multiplexing is a technique used to transmit a signal over a single
    communication channel by dividing the time frame into slots – one slot for each
    message signal. Time-division multiplexing is primarily applied to digital signals
    as well as analog signals, wherein several low speed channels are multiplexed
    into high-speed channels for transmission. Based on the time, each low-speed channel
    is allocated to a specific position, where it works in synchronized mode. i.e.,
    the multiplexer and demultlexer are timely synchronized and simultaneously switched
    to the next channel.


    ![](img/f7819d05465fc14719b3ebbba980271a_147_1.png)'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Types of TDM


    Time division multiplexing is classified into four types:


    +   - Synchronous time-division multiplexing

    - Asynchronous time-division multiplexing

    - Interleaving time-division multiplexing

    - Statistical time-division multiplexing


    # Synchronous Time Division Multiplexing


    Synchronous time division multiplexing can be used for both analog and digital
    signals. In synchronous TDM, the connection of input is connected to a frame.
    If there are ’n’ connections, then a frame is divided into ’n’ time slots – and,
    for each unit, one slot is allocated – one for each input line. In synchronous
    TDM sampling, the rate is same for all the signals, and this sampling requires
    a common clock signal at both the sender and receiver end. In synchronous TDM,
    the multiplexer allocates the same slot to each device at all times.


    ![](img/f7819d05465fc14719b3ebbba980271a_148_0.png)


    # Asynchronous Time-Division Multiplexing


    In asynchronous time-division multiplexing, the sampling rate is different for
    different signals, and it doesn’t require a common clock. If the devices have
    nothing to transmit, then their time slot is allocated to another device. Designing
    of a commutator orcommutator is difficult and the bandwidth is less for time-division
    multiplexing. This type of time-division multiplexing is used in asynchronous
    transfer mode networks.


    ![](img/f7819d05465fc14719b3ebbba980271a_148_1.png)


    # Interleaving Time-Division Multiplexing


    Time-division multiplexing can be visualized as two fast rotating switches on
    the multiplexing and demultiplexing side. At the same speed these switches rotate
    and'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'synchronize, but in opposite directions. When the switch opens at the multiplexer
    side in front of a connection, it has the opportunity to send a unit into the
    path. In the same way, when the switch opens on the demultiplexer side in front
    of a connection that has the opportunity to receive a unit from the path. This
    process is called interleaving.


    ![](img/f7819d05465fc14719b3ebbba980271a_149_0.png)


    # Statistical Time-Division Multiplexing


    Communication channel or simply refers either to a physical transmission medium
    such as a logical connection over a wire, or to a multiplexed medium such as a
    radio channel in telecommunications and computer networking.


    Statistical time-division multiplexing is used to transmit various types of data
    concurrently across a single transmission cable. This is often used for managing
    data transmitted via LAN or WAN. The data is simultaneously transmitted from the
    input devices that are connected to the network including printers, fax machines,
    and computers. This type of multiplexing is also used in telephone switch board
    settings to manage the calls. Statistical TDM is similar to dynamic bandwidth
    allocation, in this type of time-division multiplexing, a communication channel
    is divided into an arbitrary number of data streams.


    ![](img/f7819d05465fc14719b3ebbba980271a_149_1.png)


    These are the different types of multiplexing techniques used in communication
    system for efficient transferring and receiving of the data. And, also mention
    of the practical examples of these multiplexing types – if you are interested.'
