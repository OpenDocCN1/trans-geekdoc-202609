    # Authentication


    The IEEE 802.11 specification defines two means to “validate” wireless users attempting
    to gain access to a wired network: open-system authentication and shared-key authentication.
    One is based on cryptography, and the other is not. The open-system authentication
    technique is not truly authentication; the access point accepts the mobile station
    without verifying the identity of the station. It should be noted that the authentication
    is only one-way: the mobile station must trust that it is communicating with a
    real AP. A taxonomy of the techniques for 802.11 is depicted in Figure 4.


