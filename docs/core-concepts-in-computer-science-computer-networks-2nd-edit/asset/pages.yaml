    # Range


    Bluetooth provides three different classes of power management. Class 1 devices,
    the highest power devices, operate at 100 milliwatt (mW) and have an operating
    range of up to 100 meters (m). Class 2 devices operate at 2.5 mW and have an operating
    range of up to 10 m. Class 3, the lowest power devices, operate at 1 mW and have
    an operating range from 1/10 meter to 10 meters. These three levels of operating
    power are summarized in Table 4.


