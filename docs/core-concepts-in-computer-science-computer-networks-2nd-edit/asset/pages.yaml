    the number of slots in each frame is less than the number of input lines. The
    multiplexer checks each input line in round robin fashion; it allocates a slot
    for an input line if the line has data to send; otherwise, it skips the line and
    checks the next line.


    # Switching


    A switched network consists of a series of interlinked nodes, called switches.
    Switches are devices capable of creating temporary connections between two or
    more devices linked to the switch. In a switched network, some of these nodes
    are connected to the end systems (computers or phones, for example). Others are
    used only for routing.


    Types of switching of network are as follows:


    +   1. Circuit switching

    2. Packet switching

    3. Message switching


    # Circuit Switching


    A switched network consists of a set of switches connected by physical links.
    A connection between two stations is a dedicated path made of one or more links.
    However, each connection uses only one dedicated channel on each link. Each link
    is normally divided into N channels by using FDM or TDM. Circuit switching takes
    place at the physical layer.


    # Packet Switching


    In packet switching message is divided into many segments or packet. Each packet
    is treated as separate communication. These packets are then sending to each station
    in a continuous sequence.


    The packet from various messages may be transmitted and packets of same message
    may be dispatched over many different line. Each packet has a header with a packet
    address and source and destination address. The packets are reassembling into
    their original message when they reach their destination.'
