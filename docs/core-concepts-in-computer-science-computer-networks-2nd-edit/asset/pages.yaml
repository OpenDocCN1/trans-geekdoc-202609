- pgno: 72
  md: 'This connection-oriented nature ensures that data is delivered accurately and
    in the correct order. Reliable Data Delivery: TCP provides reliable data delivery,
    meaning it guarantees that all packets sent from the sender will reach the receiver
    correctly and without errors. To ensure reliability, TCP uses acknowledgments
    and retransmission mechanisms. The receiver acknowledges the successful receipt
    of data packets, and if a sender does not receive an acknowledgment for a transmitted
    packet within a certain timeout period, it retransmits the packet.


    Flow Control: TCP implements flow control to manage the rate of data transmission
    between the sender and receiver. It ensures that the sender does not overwhelm
    the receiver with data using a sliding window mechanism. The receiver advertises
    available buffer space through TCP window size values, and the sender adjusts
    its data transmission rate accordingly.


    Congestion Control: TCP is designed to handle network congestion. It uses various
    congestion control algorithms to detect and react to network congestion, preventing
    network overload and packet loss. When TCP detects congestion, it reduces its
    transmission rate to alleviate the congestion.


    Stream-Oriented: TCP is a stream-oriented protocol, which sends data as a continuous
    stream of bytes rather than discrete packets. TCP breaks down application into
    manageable segments and sends them as a continuous flow. On the receiving end,
    TCP reassembles the segments back into the original data stream.


    Full Duplex Communication: TCP enables full duplex communication, meaning data
    can be transmitted in both directions simultaneously. Both the sender and receiver
    can send and receive data independently, allowing for bi-directional communication.


    # Transmission Control Protocol (TCP) Header

    20-60 bytes


    | source port number 2 bytes | destination port number 2 bytes |

    |---|---|

    | sequence number 4 bytes | |

    | acknowledgement number 4 bytes | |

    | data offset 4 bits | reserved 3 bits | control flags 9 bits | window size 2
    bytes |

    | checksum 2 bytes | urgent pointer 2 bytes |

    | optional data 0-40 bytes | |


    Figure 14: TCP Header Format.


    Connection Termination: When data transmission is complete, TCP performs a graceful
    connection termination using a four-way handshake. This ensures that all data
    is successfully delivered before the connection is closed.


    Overall, the nature of TCP is focused on providing reliable, ordered, and error-checked
    data transmission between devices over a network. It is the foundation for'
