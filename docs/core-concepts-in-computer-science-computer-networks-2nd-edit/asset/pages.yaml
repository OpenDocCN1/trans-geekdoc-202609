- pgno: 61
  md: 'Figure 8: Multiplexing.


    # Types of Multiplexing


    Types of multiplexing are as follows:


    +   - Frequency-division Multiplexing (FDM): It is an analog multiplexing technique
    that combines analog signals. The FDM is applied when the bandwidth of a link
    (in hertz) is greater than the combined bandwidths of the signals to be transmitted.
    In FDM, signals generated by each sending device modulate different carrier frequencies.
    These modulated signals are then combined into a single composite signal that
    can be transported by the link. Carrier frequencies are separated by sufficient
    bandwidth to accommodate the modulated signal. These bandwidth ranges are the
    channels through which the various signals travel. Channels can be separated by
    strips of unused bandwidth i.e. guard bands. In addition, carrier frequencies
    must not interfere with the original data frequencies.


    ![](img/f7819d05465fc14719b3ebbba980271a_61_0.png)


    Figure 9: Frequency-division multiplexing.


    +   - Wavelength-Division Multiplexing (WDM): It is an analog multiplexing technique
    to combine optical signals. WDM is designed to use the high data rate capability
    of fiber-optic cable. The optical fiber data rate is higher than the data rate
    of metallic transmission cable. Using a fiber-optic cable for one single line
    wastes the available bandwidth. Multiplexing allows us to combine several lines
    into one. WDM is conceptually the same as FDM, except the multiplexing and de-multiplexing
    involve optical signals transmitted through fiber-optic channels. The idea is
    the same: One is combining different signals of different frequencies. The difference
    is that the frequencies are very high.'
