    # Security Requirements and Threats


    Bluetooth offers several benefits and advantages. However, agencies must not only
    address the security threats threatened with Bluetooth before they implement the
    technologies; they must also assess the vulnerabilities of the devices they allow
    to participate in the Bluetooth networks. Specifically, agencies need to address
    security'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'concerns for confidentiality, data integrity, and network availability. Moreover,
    since Bluetooth devices are more likely to be managed by users that are less security
    conscious than administrators, they are more likely to contribute to involuntary
    security lapses.


    ![](img/f7819d05465fc14719b3ebbba980271a_246_0.png)


    # Loss of Confidentiality


    See Figure 7 in the 802.11 wireless section for a general taxonomy of security
    attacks, to understand some of the attacks against Bluetooth.


    Threats to confidentiality involve, first of all, compromised Bluetooth devices.
    When a Bluetooth device that is part of a beacon becomes compromised (e.g., is
    in the possession of an unauthorized user), it may still receive information that
    the malicious user should not access. Moreover, the compromised device may still
    have network or information privileges, resulting in a compromise of the wider
    network all. In the case, the compromised device may not only receive proprietary
    traffic but may also request that information as part of a targeted network attack.
    A trait of Bluetooth that makes this compromise unique is that the Bluetooth network
    requires device—and not user—authentication to access resources. Once the device
    is authenticated, it is automatically connected to resources without the need
    for subsequent authentication.


    Bluetooth devices themselves have inherent security vulnerabilities. For example,
    malicious users can use wireless microphones as budding devices. Although such
    attacks have not been documented because Bluetooth is not yet commercially prevalent,
    inmates have been recorded of successful attacks on PCs using programs such as
    Back Orifice and Netbus. If a malicious user has a program such as Back Orifice
    installed on a device in the Bluetooth network, that user could access other'
  merge: -1
  img_proc: true
- pgno: 247
  md: '![](img/f7819d05465fc14719b3ebbba980271a_247_0.png)


    Bluetooth devices and networks that have limited or no security. These same programs
    could be used against Bluetooth devices and networks. Bluetooth devices are further
    vulnerable because the system authenticates the devices, not the users. As a result,
    a compromised device can gain access to the network and compromise both the network
    and devices on the network.


    Authorized remote users pose a threat to Bluetooth networks. Remote users are
    not always subject to the same security requirements as users onsite. They frequently
    use nonsense links, at home or on travel. In the process of connecting, they transmit
    user IDs and passwords, which a malicious user can capture using a network sniffer.
    Without the secure perimeter typically provided in an office environment, the
    malicious user does not have to be in proximity to the user to intercept traffic.
    Once the device or link is compromised, all devices in Bluetooth are vulnerable
    to attacks. For example, a compromised link allows a malicious user to monitor
    data traffic, while a compromised device allows the malicious user to request
    and receive sensitive data. If in addition the malicious user obtains knowledge
    of the user IDs and password of the targeted network, a compromised device can
    be used to gain access to the network. This scenario requires a number of security
    lapses before a malicious user can gain access to the network. Using secure links
    and additional layers of security on top of Bluetooth would mitigate the risk
    of such an attack. The man-in-the-middle attack poses an additional threat to
    Bluetooth devices that rely on unit keys, typically the more simple “dumb” devices.
    In this attack, the man-in-the-middle (Device C) obtains the encryption key that
    a network device (Device A) uses to monitor traffic between itself and another
    network device (Device B). All the attack is that Device A separate its unit key
    (a static unique key to each device) with Device C and Device B. The reasons for
    the connections between Devices A and B and between Devices A and C may be completely
    unrelated, and the level of confidentiality may even be different. However, Once
    Device C knows the unit key, it can use a fake device to calculate the encryption
    key and monitor traffic between Devices A and B without their knowledge. The man-in-the-middle
    attack does not require costly or special equipment. A knowledgeable user who
    has access to the unit key and who can mimic a Bluetooth address to generate the
    encryption key can attack. Attacks such as these use a priori knowledge of the
    targeted Bluetooth devices. Although this does not necessarily preclude malicious
    users from attacking Bluetooth devices as they enter the transmission range, no
    instances of such attacks have been documented.


    Figure 11 illustrates the attack. A trusted PDA (Device A) shares proprietary
