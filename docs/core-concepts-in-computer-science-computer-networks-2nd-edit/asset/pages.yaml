    ![](img/f7819d05465fc14719b3ebbba980271a_236_0.png)


    # Emerging Security Standards and Technologies


    Like the security industry, standards organizations have responded to the flurry
    over insecurities in 802.11 WLANs. Activity is occurring in the Internet Engineering
    Task Force (IETF) and the IEEE. The IEEE is currently working on three separate
    initiatives for improving WLAN security. The first involves the IEEE 802.11 Task
    Group i (TGi) which has proposed significant modifications to the existing IEEE
    802.11 standard as a long-term proposed solution for security. The TGI is defining
    additional ciphers based on the newly released Advanced Encryption Standard (AES).
    The AES-based solution will provide a highly robust solution for the future but
    will require new hardware and protocol changes. TGI currently has design requirements
    to address many of the known problems with WEP including the prevention of forgeries
    and detection of replay attacks.


    ![](img/f7819d05465fc14719b3ebbba980271a_236_1.png)'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'The second initiative for improving WLAN security—the TGi''s short-term solution—WiFi
    Protected Access (WPA)—to address the problems of WEP the group is defining the
    Temporal Key Integrity Protocol (TKIP) to address the problems without requiring
    hardware changes—that is, requiring only changes to firmware and software drivers.
    The third initiative from IEEE is the introduction of a new standard, IEEE 802.1X-2001,
    a generic framework for port-based network access control and distribution, approved
    in June 2001. By defining the encapsulation of EAP (defined in RFC 2284) over
    IEEE 802 media, IEEE 802.1X enables an AP and station to mutually authenticate
    another.


    Since IEEE 802.1X was developed primarily for use with IEEE 802 LANs, not for
    use with WLANs,


    IEEE 802.11i draft standard defines additional capabilities required for secure
    implementation of IEEE 802.1 X on 802.11 networks. These include a requirement
    for use of an EAP method supporting mutual authentication, key management, and
    dictionary attack resistance. In addition, 802.11i defines the hierarchy for use
    with the TKIP and AES ciphers and a “four way” key management handshake used to
    ensure that the station is authenticated to the AP and a back-end authentication
    server, if present. As a result, to provide adequate security, it is important
    that IEEE 802.1X implementations on 802.11 implement the IEEE 802.11i enhancements,
    as well as the basic IEEE 802.1X standard.


    IEEE 802.1X can be implemented entirely on the AP (by providing support for one
    or more EAP methods within the AP), or it can utilize a backend authentication
    server. The IEEE 802.1X standard supports authentication protocols such as RADIUS,
    Diameter, and Kerberos. RADIUS, described in RFC 28652869, and RFC 3162, enables
    authentication, authorization, and accounting for Network Access Server (NAS)
    devices, dial-up, xDSL, and 802.11.


