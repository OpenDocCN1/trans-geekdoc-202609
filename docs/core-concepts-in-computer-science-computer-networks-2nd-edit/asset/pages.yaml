- pgno: 262
  md: 'EJ where the vertices V represent the various nodes in the network and the
    set of edges E consists of arcs between nodes and denotes the links in the network.
    In RLNC, coded packets are random linear combinations of the original packets
    over a finite field of size q. Each coded packet is in the form:


    ```

    i=k

    \sum_{i=l} \alpha_i \times P_i

    ```


    $a$, and $P_i$ are random coefficients chosen from a Galois field and the packet
    respectively, while $k$ is the number of packets that are coded together in single
    transmission. A Galois field is any field that contains a finite number of elements.
    The probability that the receiver(s) will obtain linearly independent combinations,
    approaches 100%. Linear independence is important in ensuring uniform distribution,
    thus reducing redundant information being forwarded to a given node. The smaller
    the size, the less complex the resulting system, which is especially advantageous
    in wireless networks. Instead of transmitting the original packets, the source
    node generates and transmits random-coded packets over the $k$ packets. In order
    to decode the coded packets and retrieve the original packets, the destination
    nodes need to receive $k$ linearly independent coded packets. They can use Gaussian
    elimination to decode the coded packets.


    ![](img/f7819d05465fc14719b3ebbba980271a_262_0.png)


    As powerful as this encoding scheme is, it does have its challenges, chief among
    them that if a receiver gets an insufficient number of packets, it is extremely
    unlikely that it can recover any of the original packets. This is known as the
    index coding problem. This can be fixed by sending additional random linear combinations
    until the receiver receives the required number of packets. Other challenges include
    the high decoding computational complexity due to the Gauss-Jordan elimination
    method and the high transmission overhead over adding large coefficient vectors
    to encoded blocks.


    # Triangular Network Coding


    In order to intrinsically fix the problem with RLNC detailed above, where receivers
    get an insufficient number of packets cannot recover the original packets, triangular
    network coding. The triangular pattern based packet coding scheme is performed
    in two stages. First, redundant “0” bits are selectively added at the head and
    tail of each packet to make sure that all packets are of uniform bit lenght. The
    packets are then XOR-coded bit by bit where the “0” bits are added in such a way
    that they generate a triangular pattern, known as tri-angularization, as shown
    in Figure 3.'
