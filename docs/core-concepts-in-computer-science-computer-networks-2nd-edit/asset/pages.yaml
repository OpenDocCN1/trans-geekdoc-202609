    # Benefits


    WLANs offer four primary benefits:


    +   - User Mobility: Users can access files, network resources, and the Internet
    without having to physically connect to the network with wires. Users can be mobile
    yet retain high-speed, real-time access to the enterprise LAN.

    - Rapid Installation: The time required for installation is reduced because network
    connections can be made without adding wires, or pulling them through walls or
    ceilings, or making modifications to the infrastructure cable plant. For example,
    WLANs are often cited as making LAN installations possible in buildings that are
    subject to historic preservation rules.

    - Flexibility: Enterprises can also enjoy the flexibility of installing and taking
    down WLANs in locations as necessary. Users can quickly install a small WLAN for
    temporary needs such as a conference, trade show, or standards meeting.

    - Scalability: WLAN network topologies can easily be configured to meet specific
    application and installation needs and to scale from small peer-to-peer networks
    to very large enterprise networks that enable roaming over a broad area.


    Because of these fundamental benefits, the WLAN market has been increasingly steadily
    over the past several years, and WLANs are still gaining in popularity. WLANs
    are now becoming a viable alternative to traditional wired solutions. For example,
    hospitals, universities, airports, hotels, and retail shops are already using
    wireless technologies to conduct their daily business operations.


    Wireless Serial Bus (USB) is an industry standard that was developed to define
    cables, connectors and protocols for connection, communication, and power supply
    between personal computers and their peripheral devices.'
