  md: '# Connection-Oriented


    Before communicating TCPs can exchange data, they must first agree upon the willingness
    to communicate. Analogous to a telephone call, a connection must first be deade
    before two parties exchange information.


    # Reliability


    A number of mechanisms help provide the reliability TCP guarantees.


    *Checksums*: All TCP segments carry a checksum, which is used by the receiver
    to detect errors with either the TCP header or data.


    *Duplicate data detection*: It is possible for packets to be duplicated in packet
    switched network; therefore TCP keeps track of bytes received in order to discard
    copies of data that has already been received.


    *Retransmissions*: In order to guarantee delivery of data, TCP must implement
    retransmission schemes for data that may be lost or damaged. The use of positive
    acknowledgements by the receiver to the sender confirms successful reception of
    data. The lack of positive acknowledgements, coupled with a timeout period (see
    below) calls for a retransmission.


    *Sequencing*: In packet switched networks, it is possible for packets to be delivered
    out of order. It is TCP''s job to properly sequence segments it receives so it
    can deliver the byte stream data to an application.


    *Timers*: TCP maintains various static and dynamic timers on data sent. The TCP
    waits for the receiver to reply with an acknowledgement within a bounded length
    of time. If the timer expires before receiving an acknowledgement, the sender
    retransmits the segment.


    # TCP Header Format


    The combination of TCP header and TCP in one packet is called a TCP segment. Figure
    14 depicts the format of all TCP segments. The size of the header without options
    is 20 bytes. We will briefly define each field of the TCP header.


    # Nature of Transmission Control Protocol


    The Transmission Control Protocol (TCP) is a connection-oriented, reliable, and
    stream-oriented transport layer protocol within the TCP/IP suite. It is one of
    the core protocols of the internet and plays a vital role in ensuring the reliability
    and orderly transmission of data between devices over a network. The nature of
    TCP can be summarized by the following key characteristics:


    Connection-Oriented: TCP establishes a reliable and bi-directional connection
    between two communicating devices before data transfer begins. This connection
    is set up using a three-way handshake, where the client and server exchange a
    series of messages to synchronize their initial sequence numbers and establish
    the connection.'
