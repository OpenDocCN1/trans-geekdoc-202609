  md: '# NETWORK SOFTWARE AND NETWORK STANDARDIZATION


    ![](img/f7819d05465fc14719b3ebbba980271a_50_0.png)


    Network software allows multiple devices, such as desktops, laptops, mobile phones,
    tablets, and other systems to connect to one another, as well as other networks.
    The Internet is a prime example of a globally connected system of servers and
    computers that relies on networking software to ensure accessibility by end users.
    The Standards Activities Council of IEEE Communications Society has established
    two research groups and two study groups to examine standardization opportunities
    in software defined networks, network functions virtualization, and related areas.


    After studying this chapter, you will understand the core concepts of:


    +   - The OSI Model

    - Transmission Control Protocol (TCP)

    - User Datagram Protocol (UDP)'
