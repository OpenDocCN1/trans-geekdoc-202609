    # # Line Discipline


    Line discipline is coordinating half-duplex transmission on a data communications
    network. The two fundamental ways that the line discipline is accomplished in
    a data communications network are enquiry/acknowledgement (ENQ/ACK) and poll/select.


    # ## ENQ/ACK


    ENQ/ACK line discipline procedures determine which device on a network can initiate
    a transmission and whether the intended receiver is available and ready to receive
    the message. The initiating station begins a session by transmitting a frame of
    data calls an enquiry (ENQ), which identifies the receiving station. With half-duplex
    transmission, it waits for a response from the destination station whether it
    is ready to receive a message. If the destination station is ready to receive
    a message, it responds with a positive acknowledgement (ACK), and if it is not
    ready, it responds with a negative acknowledgement character (NAK). A NAK transmitted
    by the destination station to ENQ generally indicates a temporary unavailability,
    and the initiating station will attempt to establish a session later. A positive
    acknowledgement (ACK) indicates that it is ready to receive data and tells the
    transmitting station that it is free to send its data. All transmitted message
    frame with end of transmission (EOT), indicating the end of message frame. All
    message frames are acknowledged by either ACK or NAK by the destination station.


    ![](img/f7819d05465fc14719b3ebbba980271a_159_1.png)


    **Figure 3**: Line discipline.'
