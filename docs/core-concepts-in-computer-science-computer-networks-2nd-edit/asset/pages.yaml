- pgno: 280
  md: '# Concept of Linear network coding


    Linear network coding is a fundamental concept in information theory and computer
    networking that revolutionizes the way data is transmitted and exchanged within
    networks. At its core, linear network coding involves the combination and transformation
    of data packets at intermediate network nodes to enhance the efficiency and reliability
    of data delivery. Unlike traditional routing techniques that forward packets without
    modification, linear network coding allows nodes to perform mathematical operations
    on incoming packets, resulting in encoded packets that contain a linear combination
    of the original data.


    ![](img/f7819d05465fc14719b3ebbba980271a_280_0.png)


    The underlying principle of linear network coding is to exploit the algebraic
    properties of data packets to achieve benefits such as increased throughput, reduced
    latency, and improved resilience to network failures. In a linear network scenario,
    nodes accumulate a set of incoming packets and apply linear transformations, often
    represented using matrices, to generate new encoded packets. These encoded packets
    are then transmitted to downstream nodes or receivers, which can use the encoded
    packets to decode and reconstruct the original data.


    ![](img/f7819d05465fc14719b3ebbba980271a_280_1.png)


    The power of linear network coding lies in its ability to combine packets from
    different sources, creating a network-wide synergy that maximizes data utilization.
    This is particularly advantageous in multicast scenarios, where multiple receivers
    require the same set of data packets. Linear network coding allows a node to mix
    packets from different senders into a single packet, which can then be distributed
    to multiple receivers. This reduces the redundant transmission of identical packets
    and optimizes network resources.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# SUMMARY


    +   - Network coding is a technique used in computer networks to enhance the efficiency
    and reliability of data transmission. Traditionally, data packets are forwarded
    through network nodes individually, leading to potential inefficiencies and redundant
    transmissions.


    +   - The key advantage of network coding lies in its ability to increase data
    throughput and optimize network utilization. By combining data at intermediate
    nodes, network coding reduces the number of transmissions required, leading to
    improved efficiency and reduced congestion.


    +   - Network coding finds particular relevance in large-scale, distributed networks,
    such as peer-to-peer networks, wireless mesh networks, and content delivery networks.
    In these scenarios, network coding can significantly enhance data dissemination
    and control of overall network performance.


    +   - In traditional routing networks, packets are cached and forwarded downstream.
    If a routing node receives two packets from sources it forwards one after another,
    and queues the others in the meantime, even if both are headed for the same destination.


    +   - Network coding is based on a simple, yet far-reaching idea. In a packet
    network, rather than simply routing packets, intermediate nodes may compute and
    transmit functions of the packets that they receive.


    +   - In order to intrinsically fix the problem with RLNC detailed above, where
    receivers that get an insufficient number of packets cannot recover the original
    packets, triangular network coding. The triangular pattern based packet coding
    scheme is performed in two stages.


    +   - Interference is often treated as a destructive phenomenon in wireless communication
    networks today. When multiple transmitters send waves to their respective receivers,
    a receiver may receive signals from its transmitter as well as from other transmitters
    at the same time.


    +   - Video on demand can be considered as a specialized form of file download
    where the pieces of the downloaded file have to arrive in order and must be decoded
    in real time, taking into account some small delay.


    +   - Network coding is coding at a node in a network with error-free links. This
    distinguishes the function of network coding from that of channel coding for noisy
    links; we can similarly distinguish the function of network coding from that of
    source coding by considering the former in the context of independent source processes.'
