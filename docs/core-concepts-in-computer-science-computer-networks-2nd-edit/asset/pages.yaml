    # CORE CONCEPT: USER DATAGRAM PROTOCOL (UDP)


    UDP (User Datagram Protocol) is an alternative communications protocol to Transmission
    Control Protocol (TCP) used primarily for establishing low-latency and loss-tolerating
    connections between applications on the internet.


    The user datagram protocol is one of the major network protocols to transmit information
    on the Internet. It is part of the Internet Protocol Suite, which governs how
    computers communicate with servers and each other over an Internet Protocol (IP)
    network. When using the user datagram protocol, an application can send datagrams,
    or messages, to other hosts without first setting up special channels or data
    paths. This allows for faster communication, but is less reliable than other methods.
    The focus of the user datagram protocol is on data transmission. It provides no
    safeguards to ensure that the information actually arrives or to protect the integrity
    of the data as it moves. The protocol assumes that, if error checking is important,
    the computers doing the communication will take care of it.'
