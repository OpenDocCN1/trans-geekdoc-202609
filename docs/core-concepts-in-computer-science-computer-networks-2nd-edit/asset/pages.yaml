    A given transmission on a communications channel between two machines can occur
    in several different ways. The transmission is characterized by: the direction
    of the exchanges; the transmission mode, or the number of bits sent simultaneously;
    and the synchronization between the transmitter and receiver. There are three
    types of transmission mode:-


    +   - Simplex Mode

    - Half-Duplex Mode

    - Full-Duplex Mode


    There are three ways or modes of data transmission: Simplex, Half duplex (HDX),
    Full duplex (FDX).'
