    # Public networks


    refer to

    communication

    networks that are

    accessible and

    open to the general

    public.


    ![](img/f7819d05465fc14719b3ebbba980271a_235_0.png)


    These untrusted public networks introduce three primary

    risks: 1) because they are public, they are accessible by anyone,

    even malicious users; 2) they serve as a bridge to a user''s

    own network, potentially allowing anyone on the public

    network to attack or gain access to the bridged network; and 3)

    they use high-gain antennas to improve reception and increase

    coverage area, thus allowing malicious users to eavesdrop

    more readily on their signals.


    By connecting to their own networks via an untrusted

    network, users may create vulnerabilities for their company

    networks and systems unless their organizations take steps

    to protect their users and themselves.


    Users typically need to access resources that their

    organizations deem as either public or private. Agencies

    may want to consider protecting their public resources using

    an application layer security protocol such as Transport

    Layer Security (TLS), the Internet Engineering Task Force

    standardized version of Secure Sockets Layer (SSL). However,

    in most agencies, this is unnecessary since the information is

    ndeed public already. For private resources, agencies should

    consider using a VPN solution to secure their connections

    because this will help prevent eavesdropping and unauthorized

    access to private resources.'
