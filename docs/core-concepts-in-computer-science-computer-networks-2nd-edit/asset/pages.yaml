    # Network Coding Schemes


    The manner in which nodes encode and decode the packets they transmit/receive
    can have a huge impact on the resulting throughput of the network. The majority
    of the NC schemes in use nowadays have their basis in algebraic theory. Earlier
    schemes, such as the traditional XOR-coding scheme and the Deterministic Linear
    Network Coding scheme are deterministic in nature, the more common schemes in
    use are non-deterministic, meaning they are free from the constraint of having
    feedback information for every transmitted packet from all the receivers.


    # Random Linear Network Coding


    Here, we shall once again utilize a network model for a general communication
