- pgno: 242
  md: 'Bluetooth networks can support either one asynchronous data channel with up
    to three synchronous speech channels or one channel that transfers asynchronous
    data and synchronous speech simultaneously.


    Bluetooth uses a combination of packet-switching technology and circuit-switching
    technology. The advantage of using packet switching in Bluetooth is that it allows
    devices to route multiple packets of information by the same data path. Since
    this method does not consume all the resources on a data path, it becomes easier
    for remote devices to maintain data flow throughout a scatter-net.


    # Brief History


    The original architect for Bluetooth, named after the 10th century Danish Harald
    Bluetooth, is Ericsson Communication. In 1998, IBM, Intel, Nokia, and Toshiba
    formed the Bluetooth SIG, which serves as the governing body of the specification.
    The SIG began as a means to monitor the development of the radio technology and
    the creation of a global and open standard. Today more than 2,000 organizations
    are part of the Bluetooth SIG, comprising leaders in the telecommunications and
    computing industries that are driving development and promotion of Bluetooth technology.
    Bluetooth was originally designed primarily as a cable replacement protocol for
    wireless communications. However, members plan to develop a broad range of Bluetooth-enabled
    consumer devices to enhance wireless connectivity. Among the array of devices
    that are anticipated are cellular phones, PDAs, notebook computers, modems, pagers,
    laptops, cameras, PC fax machines, and printers. Bluetooth is now standardized
    within the IEEE 802.15 Personal Area Network (PAN) Working Group that formed in
    1999. The Bluetooth SIG Web site provides numerous links to other Web sites with
    additional information. The IEEE Web site provides updates on the IEEE 802.15
    Working Group. This is the Working Group that develops Personal Area Networking
    consensus standards for short distance wireless networks, or WPANs.


    # Frequency and Data Rates


    The designers of Bluetooth like those of the 802.11 WLAN standard designed Bluetooth
    to operate in the unlicensed 2.4 GHz–2.4835 GHz frequency band. Because numerous
    other technologies also operate in this band, Bluetooth uses a frequency-hopping
    spread-spectrum (FHSS) technology to solve interference problems. The FHSS scheme
    uses 79 different channels by changing frequency about about 1, 600 times per
    second. One channel is used in 625 microseconds followed by a hop in a pseudo-random
    order to another channel for 625 microsecond transmission; this process is repeated
    continuously. As stated previously, the ISM band has become popular for wireless
    communications because it is available worldwide and does not require a license.


    In the ISM band, Bluetooth technology permits transmission speeds of up to 1 Mbps
    and achieves a throughput of approximately 720 kbps. Although the data rates are
    low compared to those of 802.11 wireless LANs, it is still three times the'
  merge: -1
  img_proc: true
