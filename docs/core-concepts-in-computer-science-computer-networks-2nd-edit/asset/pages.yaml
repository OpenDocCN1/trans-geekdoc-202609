  md: '![](img/f7819d05465fc14719b3ebbba980271a_76_0.png)


    **Figure 15:** TCP Connection Establishment by sending a TCP segment with the
    SYN control bit set


    To start, Host A initiates the connection by sending a TCP segment with the SYN
    control bit set and an initial sequence number (ISN) we represent as the variable
    x in the sequence number field.


    At some moment later in time, Host B receives this SYN segment, processes it and
    responds with a TCP segment of its own. The response from Host B contains the
    SYN control bit set and its own ISN represented as variable y. Host B also sets
    the ACK control bit to indicate the next expected byte by Host A starting with
    sequence number x+1.


    When Host A receives Host B’s SYN and ACK, it finishes the connection establishment
    phase by sending a final acknowledgement segment to Host B. In this case, Host
    A sets the ACK control bit and indicates the next expected byte by Host B by placing
    acknowledgement number y+1 in the acknowledgement field.


    In addition to the information shown in the diagram above, an exchange of source
    and destination ports to use this connection are also included in each senders’
    segments.


    # Data Transfer


    A simple TCP implementation will place segments into the network for a receiver
    as long as there is data to send and as long the sender does not exceed the window
    advertised by the receiver. As the receiver accepts and processes TCP segments,
    it sends back positive acknowledements, indicating in the byte stream it is. These
    acknowledements also contain the “window” which determines how many bytes the
    receiver is currently willing to accept. If data is duplicated or lost, a “hole”
    may exist in the byte stream. A receiver will continue to acknowledge the most
    current contiguous place in the byte stream it has accepted.


    If there is no data to send, the sending TCP will simply sit idle waiting for
    the application to put data into the byte stream or receive data from the other
    end of the connection.


    If data queued by the sender reaches a point where data sent will exceed the receiver’s
    advertised window size, the sender must halt transmission and wait for further
    acknowledements and an advertised window size that is greater than zero before
    resuming.'
