- pgno: 64
  md: 'The packet switching common network is made up of stations, nodes and transmitted
    parts.


    The benefits of packet switching are as follows:


    +   - The first and most important benefit is that since packets are short, the
    communication links between the nodes are only allocated to transferring a single
    message for a short period of time while transmitting each packet. Longer messages
    require a series of packets to be sent, but do not require the link to be dedicated
    between the transmission of each packet. The implication is that packets belonging
    to other messages are sent between the packets of the message being sent from
    A to D. This provides a much fairer sharing of the resources of each of the links.


    +   - Another benefit of packet switching is known as “pipelining”. At the time
    packet 1 is sent from B to C, packet 2 is sent from A to B; packet 1 is sent from
    C to D while packet 2 is sent from B to C and packet 3 is sent from A to B and
    so forth. This simultaneous use of communications links represents a gain in efficiency.
    The total delay for transmission across a packet network may be considerably less
    than for message switching, despite the inclusion of a header in each packet rather
    than in each message.


    # Message Switching


    In message switching network, the central switching station receives all the communication
    to all computer system connected to the network. If then stores a message in its
    buffer memory. Each message carries its destination address. As soon as lines
    are available, the messages are forwarded to their addresses. Message switching
    is also called store and forward method.


