    # IP Networks


    The Internet protocol (IP) is the primary network protocol used on the Internet,
    developed in the 1970s. On the Internet and many other networks, IP is often used
    together with the Transport Control Protocol (TCP) and referred to interchangeably
    as TCP/IP.


    IP supports unique addressing for computers on a network. Most networks use the
    Internet protocol version 4 (IPv4) standards that features IP addresses four bytes
    (32 bits) in length. The newer Internet protocol version 6 (IPv6) standard features
    addresses 16 bytes (128 bits) in length.


    Data on an Internet protocol network is organized into packets. Each IP packet
    includes both a header (that specifies source, destination, and other information
    about the data) and the message data itself.


    IP functions at layer 3 of the OSI model. It can run on top of different data
    link interfaces including Ethernet and Wi-Fi.


    Networks provide communication between computing devices. To communicate properly,
    all computers (hosts) on a network need to use the same communication protocols.
    An Internet protocol network is a network of computer using internet protocol
    for their communication protocol.


    All computers within an IP network must have an address that uniquely identifies
    that individual host. An internet protocol-based network (an IP Network) is a
    group of hosts that share a common physical connection and that use internet protocol
    for network layer communication. The IP addresses in an IP network are contiguous,
    that is, one address follows the other with no gaps.


    IP Address is a unique string of numbers separated by full stops that identifies
    each computer using the Internet Protocol to communicate over a network.


    # Address Types in an IP Network


    Within a given range of IP addresses used in every IP network are special addresses
    reserved for:


    +   - Host Addresses

    - Network Addresses'
  merge: -1
  img_proc: true
- pgno: 88
  md: '+   • Broadcast Addresses


    In addition, an IP network has a subnet mask. The subnet mask is a value stored
    one each computer that allows that computer to identify which IP addresses are
    within the network to which they are attached, and which IP addresses are on an
    outside network.


    # Host Address


    A host''s IP address is the address of a specific host on an IP network. All hosts
    on a network must have a unique IP address. This IP address is usually not the
    first or the last IP address in the range of network IP addresses as the first
    IP address and last IP address are reserved for special functions. The host addresses
    are all the addresses in the IP network range except the first and last IP addresses.
    Host IP addresses allow network hosts to establish one-to-one direct communication.
    This one-to-one communication is referred to as unicast communication. All host
    IP addresses can be split into two parts: a network part and a host part. The
    network part of the IP addresses identifies IP Network the host is a member of.
    The host part uniquely identifies an individual host.


    # Network Address


    The network address is the first IP address in the range of IP addresses. To be
    more precise, the network address is the address in which all binary bits in the
    host portion of the IP address are set to zero. The purpose of the network address
    is to allow hosts that provide special network services to communicate. In practice,
    the network address is rarely used for communication.


    # Broadcast Address


    The broadcast IP is the last IP address in the range of IP addresses. To be more
    precise, the broadcast address is the IP address in which all binary bits in the
    host portion of the IP address are set to one. The broadcast address is reserved
    and allows a single host to make an announcement to all hosts on the network.
    This is called broadcast communication and the last address in a network is used
    for broadcasting to all hosts because it is the address where the host portion
    is all ones. Some vendors allow one to set an address other than the last address
    as the broadcast address.


    Note that each network has its own network and broadcast addresses. Network addresses
    do not necessarily have a zero in the decimal representation of the host portion
    of their address.


    # Network Security and Performance Analysis


    Network security is a means to protect an underlying computer infrastructure from
    unauthorized access. It is done by the network administrator and includes continuous
    monitoring and evaluation of its effectiveness.'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'Network security comprises the measures a company takes to protect its computer
    system, and it is a prime concern for every company that uses computers. Compromised
    network security means a hacker or competitor may gain access to critical or sensitive
    data, possibly resulting in data loss, or even complete destruction of the system.


    Appropriate security for a network is achieved when a user has to go through layers
    of security before being able to access the desired network. The more layers the
    system has, the more secure it is.


    The systems administrator is often in charge of network security since he has
    administrator privileges on the system. In fact, only the systems administrator
    and his assistants should have administrative access to the mainframe server and
    related computer terminals. This will help keep unauthorized people in the company
    from changing any data on the servers.


    A systems administrator will also build a secure firewall for the network, which
    may include an encryption layer and sentinel software that automatically replaces
    an unauthorized program from gaining access. The administrator may also place
    restrictions on employees'' computers to prevent them from accessing websites
    that may have malicious code or malware that will install itself on a user''s
    computer. Anti-adware and malware programs are available for individual computers,
    as well as networks.


    One problem that generally arises with this type of security is flexibility. Management
    must balance security issues against employees'' ability to access websites for
    their work. Communication among management, the systems administrator and employees
    is critical for network security to operate and for the employees to be able to
    work with it.


    As evidenced in dealing with past e-mail and network viruses, security breaches
    are costly and detrimental to production and efficiency. U.S companies spend millions
    of dollars each year in network security measures. A company’s best defense against
    breaches is a multi-pronged attack. Firewalls with no single point of access,
    sharp systems administrators, frequent security updates, and early installation
    of anti-adware will all help keep a network safe.


    The different wireless network security methods are:


    # Wired Equivalent Privacy (WEP)


    In this method, a key is set to encrypt the information that is transferred from
    one computer to another within the network. The wireless network setup will require
    this key, to encrypt and decrypt the data that is sent. This is a relatively old
    method of network security and the WEP key is comparatively easy to crack.


    # 802.1X Authentication


    802.1X is specifically used for wireless 802.11 networks as well as wired Ethernet
    networks. This type of authentication is typically used in workplace networks.
    An authentication server is used for validating users who want access to the network.'
  merge: -1
