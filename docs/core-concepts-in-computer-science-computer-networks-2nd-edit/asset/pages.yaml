  md: 'much better idea if you are actually congesting the network.

    And, in a network coding mindset, good put is simply the amount of information
    your receiver is able to decode.


    What network coding offers to the transport layer is the following?


    +   * Intrinsic loss recovery (any packet can be used to recover data in a stream)

    * The possibility of designing congestion control mechanisms based on decoded
    information (packet loss can be easily taken out of the equation and we focus
    on more relevant metrics as goodput, latency, whatever...)

    * New ways of acknowledging data (when we don''t need to wait for feedbacks anymore,
    data will get there eventually)

    * New flow control mechanisms (we can create coding schemes for optimizing different
    metrics such as immediate decodability, pure throughput, ...)


    So, in effect, network coding allows you to design a better transport layer protocol
    and consequently a better Internet for all!


    What would the world look like if network coding was everywhere?


