    Coding theory is the study of the properties of codes and their respective fitness
    for specific applications.


    ![](img/f7819d05465fc14719b3ebbba980271a_211_0.png)


    The workshop will bring together researchers working on several fundamental aspects
    which could have an important impact in future wireless networks. The mathematical
    tools that will be involved include information theoretic and entropy inequalities,
    coding theory, probabilistic analysis including analysis of (randomized) algorithms,
    convex optimization, stochastic geometry, random matrices etc.


    # Federal Information Processing Standards


    FIPS 140-2 defines a framework and methodology for NIST’s current and future cryptographic
    standards. The standard provides users with the following:


    +   * A specification of security features that are required at each of four security
    levels

    * Flexibility in choosing security requirements

    * A guide to ensuring that the cryptographic modules incorporate necessary security
    features

    * The assurance that the modules are compliant with cryptography-based standards.'
