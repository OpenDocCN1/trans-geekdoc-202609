    # Leaky bucket algorithm


    A buffer that converts an unregulated, bursty traffic flow into a regulated, smooth,
    predictable flow. You put the buffer in between a traffic source and the subnet.
    The buffer acts like a single server queue with a finite queue length. Packets
    put in the buffer when it is full are thrown away. The buffer may drain onto the
    subnet either by some number of packets per unit time, or by some total number
    of bytes per unit time (helpful if packets vary greatly in size).


    A variant on the leaky bucket is the token bucket. The bucket is filled with tokens
    at a certain rate. A packet must grab and destroy a token to leave the bucket.
    Packets are never lost, they just have to wait for an available token. Some bursts
    are allowed (up to the number tokens in the bucket) which is a good match for
    some applications (compromise with congestion and source needs).


