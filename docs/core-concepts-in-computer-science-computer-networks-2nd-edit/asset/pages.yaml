- pgno: 197
  md: '# INTRODUCTION


    Wireless Network Security refers to the measures and protocols implemented to
    protect the confidentiality, integrity, and availability of data transmitted over
    wireless networks. With the widespread adoption of wireless technologies such
    as Wi-Fi, Bluetooth, and cellular networks, securing wireless communication has
    become a paramount to prevent unauthorized access, data breaches, and other malicious
    activities.


    The primary challenges in network security arise from the inherent nature of wireless
    transmissions, which can be intercepted more easily compared to wired networks.
    As wireless signals propagate through the air, they can be captured by nearby
    devices, making them susceptible to eavesdropping and unauthorized access. Therefore,
    it is essential to establish robust security mechanisms to safeguard wireless
    communications.


    One of the foundational security measures for wireless networks is the implementation
    of encryption. The most commonly used encryption protocol is Wi-Fi Protected Access
    2 (WPA2) or its successor, WPA3. These encryption protocols scramble the data
    over the network, making it unreadable to unauthorized users without the encryption
    keys. Employing strong encryption ensures that even if an attacker intercepts
    wireless data, they cannot decipher the information without the appropriate decryption
    keys.


    Authentication is another critical aspect of network security. Proper authentication
    ensures that only authorized users are allowed to access the network resources.
    For Wi-Fi networks, a pre-shared key (PSK) or more secure enterprise-level authentication,
    such as Extensible Authentication Protocol (EAP) with a backend authentication
    server like RADIUS, can be used to verify the identity of users before granting
    network access.


    To protect against unauthorized access, wireless networks can implement measures
    like MAC address filtering, where only specific devices with pre-registered MAC
    addresses are permitted to join the network. However, MAC address filtering alone
    is not sufficient for robust security, as MAC addresses can be easily spoofed.


    Regularly updating firmware and software on wireless devices, such as routers
    and access points, is essential for patching security vulnerabilities. Default
    passwords on devices should be changed to strong, unique passwords to prevent
    unauthorized access to the network infrastructure.


    For organizations, implementing a virtual private network (VPN) for remote access
    to the corporate network can add an additional layer of security, encrypting'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'data traffic between remote devices and the company’s network. Wireless network
    security is of paramount importance in today’s interconnected world. Implementing
    strong encryption, robust authentication mechanisms, and regular software updates
    are essential in safeguarding wireless communications. Organizations and individuals
    must stay vigilant against evolving security threats and adopt a multi-layered
    approach to protect their wireless networks from unauthorized access and potential
    data breaches.


    ![](img/f7819d05465fc14719b3ebbba980271a_198_0.png)


    # CORE CONCEPT: OVERVIEW OF WIRELESS TECHNOLOGY


    The term wireless refers to the communication or transmission of information over
    a distance without requiring wires, cables or any other electrical conductors.
    Wireless communication is one of the important mediums of transmission of data
    or information to other devices.


    Wireless technologies, in the simplest sense, enable one or more devices to communicate
    without physical connections—without requiring network or peripheral cabling.
    Wireless technologies use radio frequency transmissions as the means for transmitting
    data, whereas wired technologies use cables. Wireless technologies range from
    complex systems, such as Wireless Local Area Networks (WLAN) and cell phones to
    sense devices such as wireless headphones, microphones, and other devices that
    do not process or store information. They also include infrared (IR) devices such
    as remote controls, cordless computer keyboards and mice, and wireless hi-fi stereo
    headsets, all of which require a direct line of sight between the transmitter
    and the receiver to close the link.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '![](img/f7819d05465fc14719b3ebbba980271a_199_0.png)


    # Wireless Networks


    Wireless network is a network set up by using radio signal frequency to communicate
    among computers and other network devices. Sometimes it is also referred to as
    WiFi network or WLAN. This network is getting popular nowadays due easy to setup
    feature and no cabling involved. You can connect computers anywhere in your home
    without the need for wires.


    ![](img/f7819d05465fc14719b3ebbba980271a_199_1.png)


    Here is simple explanation of how it works, let say you have 2 computers each
    equipped with wireless adapter and you set up wireless router. When the computer
    send out the data, the binary data will be encoded to radio frequency and transmitted
    via wireless router. The receiving computer will then decode the signal back to
    binary data.


    It does not matter you are using broadband/DSL modem to access internet, both
    ways will work with wireless network. If you heard about wireless hotspot that
    location is equipped with wireless devices for you and others to join the network.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'The two main components are wireless router or access point and wireless clients.


    If you have not set up any wired network, then just get a wireless routerand attach
    it to cable or DSL modem. You then set up wireless client by adding wireless card
    to each computer and form a simple wireless network.


    Broadband is wide bandwidth data transmission which transports multiple signals
    and traffic types.


    # Wireless LANs


    A wireless local area network (WLAN or wireless LAN) consists of two or more computers
    that communicate wirelessly via radio waves. This is contrasted to a wired LAN,
    in which each computer in the network is physically tethered with an Ethernet
    cable to the server''s network switch or hub.


    The basic structure of all networks consists of a main computer or server, along
    with connected machines known as clients. The server typically has two Ethernet
    network interface cards (NICs) installed and software that can support the network.
    Microsoft Windows operating systems have featured built-in networking capability
    since Windows 98 Special Edition (SE), but third party networking software is
    also available. In the case of a simple home wireless LAN, a desktop might be
    the server while a laptop could be the client.


    Let''s assume that the desktop has a digital subscriber line (DSL) connection
    -- high-speed Internet service. In order to share the Internet connection via
    a wireless LAN, the desktop will be physically connected to a wireless DSL modem.
    The wireless DSL modem might also have a built-in network switch or router. These
    two devices keep data flowing to the proper machine on the network. If they are
    not built into the modem, they will have to be purchased separately.


    Digital subscriber line (DSL) is a family of technologies that are used to transmit
    digital data over telephone lines.


    ![](img/f7819d05465fc14719b3ebbba980271a_200_0.png)'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'The connections from the desktop server to the DSL modem, switch and router
    are made with physical Ethernet cables. The clients, however, do not require cabling.
    Instead, each machine must have a wireless NIC installed. This might be a PCMCIA
    NIC, a USB device or even an internal wireless NIC. Many, but not all, wireless
    NICs feature a small antenna.


    Once the wireless LAN has been set up on the server and client, the machines can
    communicate by sending and receiving data via radio waves. This makes a wireless
    LAN very convenient because the client can remain mobile anywhere within the broadcasting
    range of the network. One can work on a laptop in any room in the house -- even
    the backyard in most cases -- and still share the network connection from the
    server.


    At the office, a wireless LAN provides instant connectivity to mobile personnel.
    It also avoids the costly expense of running Ethernet cable throughout a building,
    providing easy, effortless desktop wires running to the clients, one of the main
    advantages of a wireless LAN is easy installation. Wireless LANs also provide
    more flexibility than wired LANs and are less expensive.


    > Ad hoc networks refer to decentralized and self-configuring wireless networks
    where devices can communicate directly with each other without the need for a
    centralized infrastructure, such as access points or routers


    Two disadvantages of the wireless LAN are that it requires a few more steps to
    secure it from intrusion; and it can be slower and, if interference is present,
    less reliable than a wired network. However, dependency speeds are always improving
    as technology improves. Some configurations of wireless LANs can compete with
    wired networks.


    Standards of wireless technology are indicated by letter designations. The wireless
    “g” standard delivers speeds of 54 megabits per second (mps). With augmented technology
    like the latest varieties of multiple input multiple output (MIMO), rates can
    reach 100 mbps.


    ![](img/f7819d05465fc14719b3ebbba980271a_201_0.png)


    # Ad Hoc Networks


    Since the inception of wireless networking there have been two types of wireless
    networks: the infrastructure network, including some local area networks (LANs),'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'and the ad hoc network. Ad hoc is Latin meaning "for this purpose." Ad hoc
    networks therefore refer to networks created for a particular purpose. They are
    often created on-the-fly and for one-time or temporary use. These networks are
    comprised of a group of workstations or other wireless devices which communicate
    directly with each other to exchange information. Think of these connections as
    spontaneous networks, available to whoever is in a given area.


    An ad hoc network is one where there are no access points passing information
    between participants. Infrastructure networks pass information through a central
    information hub which can be a hardware device or software on a computer. Office
    networks, for example, generally use a server to which company workstations connect
    to receive their information. Ad hoc networks, on the other hand, do not go through
    a central information hub.


    # Wireless Network Security


    ![](img/f7819d05465fc14719b3ebbba980271a_202_0.png)


    These networks are generally closed in that they do not connect to the Internet
    and are typically created between participants. But, if one of the participants
    has a connection to a public or private network, this connection can be shared
    among other members of the network. This will allow other users on the spontaneous
    ad hoc network to connect to the Internet as well.


    Ad hoc networks are common for portable video game systems like the Sony PSP or
    the Nintendo DS because they allow players to link to each other video games wirelessly.
    Some retail stores even create networks within them to allow customers to obtain
    new game demos via the store''s ad hoc network.


    An ad hoc network can be thought of as a peer-to-peer network for the wireless
    age. Peer-to-peer or workgroup style networks were used to create a network environment
    for early Windows computers. This allowed these early computers to connect to
    each other to exchange information, usually in a smaller office environment without
    the need for domains and the additional management and overhead that comes with
    them.'
  merge: -1
  img_proc: true
- pgno: 203
  md: In today's world, where people put a premium on staying connected to the Internet
    and to each other, there are several types of wireless technologies. In the home
    and office, wireless routers with built-in modems, hubs and switches broadcast
    a local area network (LAN) for computers in the area to join. Broadcasting distance
    varies widely depending on many factors, but a LAN generally spans 300 feet (91.44
    m) or more. Any computer on the network can share resources that are connected
    to the network, including a high-speed Internet connection, printer or other office
    equipment.
  merge: -1
  img_proc: true
- pgno: 204
  md: 'In order to join a wireless LAN (WLAN), a computer must have a wireless network
    card or adapter installed. A network card is an internal wireless device manufactured
    to use the same language or protocol that wireless routers use. These protocols
    periodically evolve into new standards, however causing compatibility issues in
    the interim. If a router uses a protocol that is not supported by an internal
    wireless device, an external wireless adapter can be used in an external port.
    The most common type is a USB dongle, but bluetooth network adapters are also
    available in ExpressCard formats, giving laptop users a choice as to which port
    they would use.


    Another type of wireless device might be part of a Personal Area Network (PAN).
    A PAN is created with Bluetooth® technology, to connect personal digital devices
    over very short distances of just a few feet, though the standard extends to 30
    feet (9.14 m).


    Bluetooth® is a very flexible and convenient type of network. It can be used to
    send print jobs from a laptop to a printer without the hassle of setting shared
    resources over a LAN. It is also used to connect Bluetooth-enabled cell phones,
    personal digital assistants (PDAs), or Apple products to each other or to other
    Bluetooth-enabled equipment including headsets, external speakers, or computers.
    Since Bluetooth® uses a different frequency range than LANs, you can use a Bluetooth®
    network “within” a LAN without interference.


    # Personal Digital Assistants


    A personal digital assistant (PDA) is a portable electronic device used for personal
    organization and communication. PDAs usually feature touch screens for input with
    a finger or stylus, memory cards for removable storage, organizational software
    such as a calendar and address book, and means to interface with a personal computer,
    through a cable or using a wireless protocol such as Bluetooth®. Most include
    the capability to add applications, such as business software or games.


    There are a broad range of PDAs, bridging the gap between cell phones and laptop
    computers in terms of size and functionality. They are usually small enough to
    be conveniently carried in a pocket or belt clip. One includes cell capability
    is known as a smartphone, and these are far and away the most popular category
    of PDAs on the market.


    ![](img/f7819d05465fc14719b3ebbba980271a_204_0.png)'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'The ability to replace a number of bulky paper organizational tools for a single
    convenient device is a main selling point for PDAs. The term “personal information
    manager” (PIM) is used to refer to a software suite used for personal organization.
    A suite is usually included with a personal digital assistant, though some PIMs
    run on personal computers or other platforms. This software typically includes
    a calendar, address book, note pad, calculator, to-do list, and other small applications
    mirroring those found in paper-based personal organizer. More sophisticated bundles
    may include word processing and spreadsheet software. The term “Personal Information
    Manager” was also used to refer to PDAs themselves in the history of the device
    era.


    # Personal Information Manager (PIM) is a software application or tool designed
    to help individuals organize, manage, and store personal information in a digital
    format.


    A number of operating systems (OS), called mobile operating systems, have been
    created specifically for PDAs. Many mobile operating systems are based on familiar
    operating systems — such as Windows®, Mac OS®, or Linux® — have been heavily modified
    to run using a mobile device’s limited hardware and interface elements. Others
    are built from scratch with the electronic device in mind.


    While the PC market has historically been dominated by Windows®, no single OS
    held a clear majority in the mobile market. When digital assistants rose to popularity
    in the late 1990s and early 2000s, many popular devices by Handspring™ and Palm®,
    Inc. ran Palm OS®, which featured a simple interface and primitive handwriting
    recognition software called Graffiti™. With the introduction of the Palm Pre™,
    the operating system was succeeded by Palm webOS; Microsoft’s mobile OS is called
    Windows Mobile; Apple’s iPhone OS. Symbian™ OS and the Google-initiated Android™
    are other mobile operating systems.


    The rapid rise to popularity of the digital assistant, coupled with its early
    association as a business-class status symbol, inspired a small popular culture
    backlash. Self-help writer Mann created the tongue-in-check Hipster PDA, which
    is a pack of index cards with binder clips, accompanied by a ballpoint pen. The
    idea has caught on with a certain segment of the population, and a community of
    users has risen to provide support for the “device.”


    # Smart Phones


    Smartphones are telephones that provide features that are above and beyond the
    simple ability to make phone calls. While'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'the term can be properly applied to any type of telephone, a smartphone normally
    understood to be a mobile phone and not a land line telephone. Over the years,
    the concept of the smart phone has continued to expand as hand held devices have
    become more sophisticated.


    The first mobile to be considered a smartphone was designed by IBM in 1992. Given
    the name of Simon, the device made an appearance at COMEX that year, and was offered
    to the public up to that time had only been available on desktop and laptop computers
    were included in the functionality. Simon included a calculator, simple note pad,
    the ability to send and receive faxes, and an email component. In short order,
    the device provided a few games for the user to enjoy, as well as a handy world
    clock that allowed the user to view current times in major cities around the world.


    ![](img/f7819d05465fc14719b3ebbba980271a_206_0.png)


    Throughout the remainder of the 1990''s, various types of advanced mobile phone
    devices appeared on the market. Touch screens began to replace keysets on many
    smart phones. The games and email functions became more sophisticated as new models
    were released. Speakerphone capability on many versions of the smartphone began
    to rival the quality found with headset speakers.


    Communication device is a hardware device capable of transmitting analog or digital
    signal over the telephone, or wirelessly.


    Today, the smartphone functions as a feature rich communication device. The addition
    of Internet access is the latest innovation in smartphone technology. Today, users
    may surf the Internet with the same ease as using a laptop or desktop computer.
    At the same time, many manufacturers of smartphone lines have worked to enhance
    the clarity and integrity of the basic audio signal of the phones. This helps
    to ensure that even with the addition of all the extra features, it is'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'still possible to use the smartphone to make a simple telephone call and expect
    the sound quality to be crisp and clear.


    ![](img/f7819d05465fc14719b3ebbba980271a_207_0.png)


    # Wireless Security Threats and Risk Mitigation


    An Introduction to Computer Security generically classifies security threats in
    nine categories ranging from errors and omissions to threats to personal privacy.
    All of these represent potential threats in wireless networks as well. However,
    the more immediate concerns for wireless communications are device theft, denial
    of service, malicious hackers, malicious code, theft of service, and industrial
    and foreign espionage. Theft is likely to occur with wireless devices because
    of their portability. Authorized and unauthorized users of the system may commit
    fraud and theft; however, authorized users are more likely to carry out such acts.
    Users of a system know what resources a system has and the system’s security flaws,
    it is easier for them to commit fraud and theft. Malicious hackers, sometimes
    called crackers, are individuals who break into a system without authorization,
    usually for personal gain or to do harm. Malicious hackers are generally individuals
    from outside of an agency or organization (although users within an agency or
    organization can be a threat as well). Such hackers gain access to the wireless
    network access point by eavesdropping on wireless device communications. Malicious
    code involves viruses, worms, Trojan horses, logic bombs, or other unwanted software
    that is designed to damage files or bring down a system. Theft of service occurs
    when an unauthorized user gains access to the network and consumes resources.
    Industrial and foreign espionage involves gathering proprietary data from corporations
    or intelligence information from eavesdropping. In wireless networks, the espionage
    threat stems from the relative ease with which eavesdropping can occur on radio
    transmissions.


    Trojan horse is any malware that misleads users of its true intent by disguising
    itself as a standard program.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '![](img/f7819d05465fc14719b3ebbba980271a_208_0.png)


    Attacks resulting from these threats, if successful, place an agency’s systems—and,
    more importantly, its data—at risk. Ensuring confidentiality, integrity, authenticity,
    and availability are the prime objectives of all government security policies
    and practices. NIST Special Publication (SP) 800-26, Security SelfAssessment Guide
    for Information Technology Systems, states that information must be protected
    from unauthorized, unanticipated, or unintentional modification. Security requirements
    include the following:


    +   - Authenticity: A third party must be able to verify the content of a message
    has not been changed in transit.

    - Nonrepuid: The origin or the receipt of a specific message must be verifiable
    by a third party.

    - Accountability: The actions of an entity must be traceable uniquely to that
    entity.


    Network availability is “the property of being accessible and usable upon demand
    by an authorized entity.”


    The information technology resource (system or data) must be available on a timely
    basis to meet mission requirements or to avoid substantial losses. Availability
    also ensures that resources are used only for intended purposes.


    Risks in wireless networks are equal to the sum of the risk of operating a wired
    network (as operating a network in general) plus the new risks introduced by weaknesses
    in wireless protocols. To mitigate these risks, agencies need to adopt security
    measures and practices that help bring their risks to a manageable level. They
    need, for example, to perform security assessments prior to implementation to
    determine the specific threats and vulnerabilities that wireless networks will
    introduce in their environments. In performing the assessment, they should consider
    security policies, known threats and vulnerabilities, legislation and regulations,
    safety, reliability, system performance, the life-cycle costs of security measures,
    and'
