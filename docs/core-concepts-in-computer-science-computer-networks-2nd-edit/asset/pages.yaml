    After handoffs, congestion avoidance probes the capacity of the new link. With
    other wireless losses though, retransmissions are sufficient for recovery. Since
    end-to-end retransmissions are slow, TCP connections can be split using pivot
    routers connected to both wireless and wired links. End-to-end connections are
    decomposed into separate TCP schemes for the wired and wireless parts of the path.
    Another protocol optimized for error recovery may be substituted over the wireless
    links. Split schemes violate TCP semantics, as acknowledgments may reach the sender
    before data packets reach their destination. To preserve TCP semantics, acknowledgments
    must be delayed, reducing throughput. Pivot points face significant overhead,
    as packets undergo TCP processing twice, and considerable connection state is
    maintained there.


