    # Logical Link Control (LLC)


    User Datagram (UDP) is one of the core members of the Internet protocol suite.


    The logical link control (LLC) is one of the sub-layers of the open systems interconnection
    (OSI) model''s second layer, the data link layer. The LLC that it takes packets
    and puts them into frames that can be converted by the layer into the bits that
    actually move across a medium. This is not its only job, however, as the LLC is
    also responsible for establishing a more standardized interface for many different
    communications protocols, controlling the flow of data, and ensuring that data
    arrives at its destination. The way the link layer works is that the upper layers
    of the OSI model pass datagrams or packets down the other layers of the model
    until they reach the data link layer. The logical link control, in concert with
    its sibling, inserts the data into what''s known as frames. The frames are handed
    over to the multiplexed analog component (MAC), which assigns the specific hardware
    address to the frames. Once the data link layer has completed its job, it passes
    the data down to the OSI''s lowest layer, the physical layer, which transforms
    the data into a stream of electrical signals for the wire. In this manner, the
    LLC provides the ability for any of the upper layers to transmit data without
    knowing anything about the type of network it is going out on. There are two types
    of operation for the logical link control, colorless and connection-oriented.
    With a connectionless LLC, also known as logical link control type one, or LLC1,
    there is no guaranteed link established with the receiving end. LLC type one simply
    sends and receives streams of data amongst other connectionless peers without
    each of them bothering to confirm receipt. This is useful for some communication
    protocols that do not need to have their transmission negotiated beforehand, such
    as the hypertext protocol (HTTP) used over the wide web, and the user datagram
    protocol (UDP) that is used for numerous other services.


    Transmission Control Protocol (TCP) is one of the main protocols of the Internet
    protocol suite.


    With a logical link connection two, or LLC2, connection-oriented transmission
    requires that each end of the communication confirm its link to the other before
    any data can be sent or received. LLC2 provides better error checking and correction,
