    hub. It is one of the most prevalent computer network configurations, and it''s
    by far the most popular Network Topology. In this network arrangement, all devices
    linked to a central network device are displayed as a star.


    ![](img/f7819d05465fc14719b3ebbba980271a_150_0.png)


