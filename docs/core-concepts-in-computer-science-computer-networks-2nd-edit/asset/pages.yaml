    of students and educators worldwide.


    # Classification of Computer Networks


    Computer networks are classified based on various factors. They include:


    +   Inter-Connectivity: Components of a network can be connected to each other
    differently in some fashion. By connectedness we mean either logically, physically,
    or both ways.

    - Every single device can be connected to every other device on network, making
    the network mesh.

    - All devices can be connected to a single medium but geographically disconnected,
    creating bus-like structure.

    - Each device is connected to its left and right peers only, creating linear structure.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '+   - All devices connected together with a single device, creating star-like
    structure.


    +   - All devices connected arbitrarily using all previous ways to connect each
    other, resulting in a hybrid structure.


    +   - Administration: From an administrator’s point of view, a network can be
    private network which belongs a single autonomous system and cannot be accessed
    outside its physical or logical domain. A network can be public, which is accessed
    by all.


    +   - Network Architecture: Computer networks can be discriminated into various
    types such as Client-Server, peer-to-peer or hybrid, depending upon its architecture.


    +   - There can be one or more systems acting as Server. Other being Client, requests
    the Server to serve requests. Server takes and processes request on behalf of
    Clients.


    +   - Two systems can be connected Point-to-Point, or in back-to-back fashion.
    They both reside at the same level and called peers.


    +   - There can be hybrid network which involves network architecture of the above
    types.


    The following list presents categories used for classifying networks.


    # Connection Method


    Computer networks can also be classified according to the hardware and software
    technology that is used to interconnect the individual devices in the network,
    such as Optical fiber, Ethernet, Wireless LAN, HomePA, Powerline communication
    or G.hn. Ethernet uses physical wiring to connect devices. Frequently deployed
    devices include hubs, switches, bridges and/or routers.


    Wireless LAN technology is designed to connect devices without wiring. These devices
    use radio waves or infrared signals as a transmission medium.


    Data transmission is the transfer of data over a point-to-point or point-to-multipoint
    communication channel.


    ITU-G.hn technology uses existing home wiring (coaxial cable, phone lines and
    power lines) to create a high-speed (up to 1 Gigabit/s) local area network.'
  merge: -1
