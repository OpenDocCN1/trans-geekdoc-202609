    Point-to-point communication, also known as P2P communication, is a type of communication
    where data is exchanged directly between two specific endpoints or nodes without
    involving any intermediate devices or additional participants.


    Keep in mind that error-correcting codes are designed for point-to-point communications
    (check this video if the above does not ring a bell). They do not care at all
    about the network. Data is encoded at the source, replayed at intermediate nodes,
    and decoded at the destination. Parity bits are added to the original data stream
