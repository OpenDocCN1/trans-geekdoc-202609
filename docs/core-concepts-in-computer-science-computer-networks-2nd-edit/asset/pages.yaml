  md: '# WEP Key recovery


    The WEP protocol contains a critical cryptographic weakness that allows an attacker
    to possible recover the shared secret key. This weakness consists of exploiting
    the fact that certain IV value produce weak WEP keys. When a weak WEP key is used
    to encrypt, the first bytes of the pseudo-random string may contain some correlation
    with the WEP key. Each weak key may leak one byte of the shared secret key with
    5%6 probability. Because the certainty level is not high, the attacker must capture
    large amounts of raw WEP-protected data packets, approximately from 5 Million
    to 10 Million packets, to elevate the probabilities for successfully cracking
    the secret key. This was published by Fluhrer, Mantin, and Shamir, in “Weaknesses
    in the Key Scheduling Algorithm in RC4


    Several tools for WEP cracking have already been around for a while. Some of the
    first tools that exploit the FMS weakness are Airsn8 and Weperack. There are other
    tools that have more optimizations for requiring less WEP-protected data packets
    and brute-force attacks. Some of the tools are: Airjack, dwepacket, Aircrack.
    Generally, this works on a UNIX/Linux platform, but some tools are widely ported
    to Windows OS.


    Attackers, using any of this WEP cracking tools, have a good chance to obtain
    the secret key by passively capturing large amount of wireless network traffic.
    Once the attacker successfully obtains the shared secret key, the wireless network
    is totally defenseless.


    # IV collision


    Another way for an attacker to break into a wireless network without knowing the
    shared secret key is also by capturing passively a large amount of data packets,
    but this time is looking for IV collision.


    An IV collision occurs when two or more data packets are encrypted with the same
    IV, therefore the same WEP key. When an IV collision is detected, the attacker
    can perform a logic XOR with the two encrypted data packet to take off the encryption.
    The result is the XOR of the two data packets. With enough time, and use of analytic
    and statistics methods the attacker could be able to recover the contents of the
    two packets.


    The data packet contents recovery effort and time required when more packets encrypted
    with exactly the same WEP key are captured and used for the recovery. Note that
    if this attack is successfully accomplished, the pseudo-random string recovery
    for a particular WEP key is straightforward. An attacker could then keep all the
    pseudo-random strings in a record, using it for decryption, packets forging, and
    access to the network


    Some wireless interface card vendors, aware of the WEP key vulnerability, offer
    an update for their wireless cards to address the weak key vulnerability by avoiding
    using IV IV for encryption. Avoiding some IVs reduces the number of WEP keys making
    the IV collision weakness worse.'
