    Let us consider wireless sensor networks, in which very small sensors can be spread
    onto surfaces, and can harvest energy from the environment, to form sensing surfaces
    over a built-in communication network. Nodes are generally equipped with a radio
    transceiver, a microcontroller, a memory unit, and a set of transducers with which
    they can acquire and process data. To reduce each node''s size and energy requirements,
    the oscillator is replaced by an on-chip resonant circuit. However, the center
    frequency of the resonant circuit is random, which means that each node picks
    a random channel on to transmit, and another random channel on to receive. The
    nodes can self-organize themselves to form a multi-hop network and transmit the
    data to a sink node. The throughput between any two nodes is constant if only
    routing is used, but grows linearly in the number of channels if network coding
    is used, and the radio ranges are optimal. The reason network coding helps greatly
    here is that the randomly packets can find their way towards the destination without
    the need for explicitly informing nodes where their destinations are. This is
    especially useful since explicitly identifying routes is difficult when the graph
    connectivity is unknown.


    ![](img/f7819d05465fc14719b3ebbba980271a_267_0.png)


    # CORE CONCEPT: THE FUTURE OF NETWORK CODING PROTOCOLS


    Network coding is a networking technique where operations, which in practice tend
    to be algebraic algorithms, are performed on data as it passes through the nodes
    within a network. While in any manner of algorithm could be performed on the data
    at a node, NC algorithms tend to be concerned with accumulating the various transmissions
    that pass through a given node. In traditional routing networks, packets are simply
    cached and then forwarded to the next node downstream in the network.


    As such, if a routing node receives two packets from two distinct sources it will
    if they are both addressed to the same destination, while queuing any others it
    may receive in the meantime. This results in the node creating separate transmissions
    for each and every message being delivered, which results in a decrease in network
    efficiency. NC is used to mitigate this by merging relevant messages at the relay
    node, using a given encoding, then forwarding this accumulated result to the destination
    for decoding.'
