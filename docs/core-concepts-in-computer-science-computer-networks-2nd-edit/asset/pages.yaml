- pgno: 274
  md: 'In network coding however, intermediate nodes operate over the packets, creating
    new coded packets from the packets they received. And since they can also receive
    coded packets, this means the re-encoding must be possible.


    Consequently, the most significant difference is that network coding allows for
    re-encoding at intermediate nodes without the need to decode the received packets,
    which is not necessarily true for error-correcting codes. These constraints make
    design distinct.


    Don''t get me wrong, error-correcting codes are the ones that allow you to have
    a reliable gigabit connection (LDPC codes are used for instance in the WiFi IEEE
    802.11ac standard). They are simply not tailored to solve network problems.


    And this leads to the second relevant point. When you design an error-correcting
    code, you target some packet loss rate that the code should be able to overcome.
    This is fine when you think about point to point (everything in the link is a
    link with some packet loss probability). In complex networks (such as the Internet)
    there can be an issue since yours have very different packet loss characteristics.
    Your wireless hop can be very lossy, one of links in your route suffering from
    buffer bloat and dropping a few packets... This parameterization of error-correcting
    codes hard to generalize. You can have low overhead and small error-correcting
    capabilities or you have higher overhead, recover everything, but suffer the efficiency
    of sending more data than needed.


    When thinking about the multiple links in a network, the underlying concept of
    error-correcting codes just does not fit. Your code can be very efficient over
    one link but very inefficient over the other (not even thinking about the variability
    of a single wireless link when subject to multiple users).


    On the other hand, the concept proposed by network coding abstracts from all of
    this. you just send packets and the receiver needs to collect enough packets on
    its end to recover the original data. So you don''t necessarily need to parameterize
    for a specific link error rate - although you have to design your code to be efficient
    in terms of generating linearly independent combinations, i.e. you have to worry
    about every transmission useful to the client, but that would take another look.


    So, bottom line, network codes serve a different purpose than error-correcting
    codes and should be designed based on different criteria. But one does not replace
    the other!


    # Network Coding Bring to the Table


    Well, let us some of the other benefits of network coding:


    +   - Latency: network coding enables low latency communication by the simple
    fact that it does not need to rely on ARQ systems. Store-and-forward systems generally
    rely on ARQ, and therefore the sender needs to wait for feedback to be able to
    send new data (it needs to know if and what packets were lost). Coding solutions
    do not have this constraint. They can recover from packet loss even without knowing
    which particular packet was lost - “any"


