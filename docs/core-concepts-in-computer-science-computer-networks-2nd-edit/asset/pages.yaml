- pgno: 212
  md: 'The Secretary of Commerce has made FIPS 140-2 mandatory and binding for U.S.
    federal agencies. The standard is specifically applicable when a federal agency
    determines that cryptography is necessary for protecting sensitive information.
    The standard is used in designing and implementing cryptographic modules that
    federal departments and agencies operate or have operated for. FIPS 140-2 is applicable
    if the module is incorporated in a product or application or it functions as a
    standalone device. As currently defined, the security of 802.11 nor Bluetooth
    meets the FIPS 140-2 standard.


    Federal agencies, industry, and the public rely on cryptography to protect information
    and communications used in critical infrastructures, electronic commerce, and
    other application areas. Cryptographic modules are implemented in these products
    and systems provide cryptographic services such as confidentiality, integrity,
    nonrepudiation, identification, and authentication. Adequate testing and validation
    of the cryptographic module against established standards is essential for security
    assurance.


    Both federal agencies and the public benefit from tested and validated products.
    Without adequate testing, weaknesses such as poor design, weak algorithms, or
    incorrect implementation of the cryptographic module can result in insecure products.


    ![](img/f7819d05465fc14719b3ebbba980271a_212_0.png)


    In 1995, NIST, established the Cryptographic Module Validation Program (CMVP)
    that validates cryptographic modules to FIPS 140-2, Security Requirements for
    Cryptographic Modules, and other FIPS cryptography-based standards. The CMVP is
    a joint effort between NIST and the Communications Security Establishment (CSE)
    of the Government of Canada. Products validated as conforming to FIPS 140-2 are
    accepted by the federal agencies of both countries for the protection of sensitive
    information.


    Vendors of cryptographic modules use independent, accredited testing laboratories
    to test their modules. NIST’s Computer Security Division and CSE jointly serve
    as the validation authorities for the program, validating the test results. Currently,
    there are six National Voluntary Laboratory Accreditation Program (NVLAP) accredited
    laboratories that perform FIPS 140-2 compliance testing.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# CORE CONCEPT: WIRELESS LAN


    A wireless LAN is one in which a mobile user can connect to a local area network
    (LAN) through a wireless (radio) connection. The IEEE 802.11 group of standards
    specify the technologies for wireless LANs. 802.11 standards use the Ethernet
    protocol and CSMA/CA (carrier sense multiple access with collision avoidance)
    for path sharing and include an encryption method, the Wired Equivalent Privacy
    algorithm.


    Wireless local area network (WLAN or wireless LAN) consists of two or more computers
    that communicate wirelessly via radio waves. This is contrasted with a wired LAN,
    in which each computer in the network is physically tethered with an Ethernet
    cable to the server''s network switch or hub.


    The basic structure of all networks consists of a main computer or server, with
    connected machines known as clients. The server typically has two Ethernet network
    interface cards (NICs) installed and software that can support the network. Microsoft
    Windows operating systems have featured built-in networking capability since Windows
    98 Special Edition (SE), but third party networking software is also available.
    In the case of a simple home LAN, a desktop might be the server while a laptop
    could be the client.


    Let''s assume that the desktop is a digital subscriber line (DSL) connection --
    high-speed Internet service. In order to share the Internet connection via a wireless
    LAN, the desktop will be physically connected to a wireless DSL modem. The wireless
    DSL modem might also have a built-in network switch or router. These two devices
    keep data flowing to the proper machine on the network. If they are not built
    into the modem, they will have to be purchased separately.


    The connections from the desktop to the DSL modem, switch and router are made
    with physical Ethernet cables. The clients, however, do not require cabling. Instead,
    each machine must have a wireless NIC installed. USB device or even an internal
    wireless NIC. Many, but not all, wireless NICs feature a small antenna.


    Once the wireless LAN has been set up on the server and client, the machines can
    communicate by sending and receiving data via radio waves. This makes a wireless
    LAN very convenient because the client can remain mobile anywhere within the broadcasting
    range of the network. One can work on a laptop in any room in the house -- the
    backyard in most cases -- and still share the network connection from the server.


    At the office, a wireless LAN provides instant connectivity to mobile personnel.
    It also avoids the costly expense of running Ethernet cable throughout a building,'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'easy, effortless desktop connectivity between clients. Because there are no
    wires running to the clients, one of the main advantages of a wireless LAN is
    easy installation. Wireless LANs also provide more flexibility than wired LANs
    and are less expensive.


    Two disadvantages of the wireless LAN are that it requires a few more steps to
    secure it from intrusion; it can be slower and, if interference is present, less
    reliable than a wired network. However, dependency spells are always improving
    as technology improves. Some configurations of wireless LANs can compete with
    wired networks.


    Standards of wireless technology are indicated by letter designations. The wireless
    “g” standard delivers speeds of 54 megabit per second (mbps). With augmented technology
    like the latest varieties of multiple input output (MIMO), rates reach 100 Mbps.
    This is about the speed of an average DSL connection and hard-wired network. Previous
    wireless LAN standards “a” and “b” are slower technologies.


    Multiple Input Multiple Output (MIMO) is a wireless communication technology that
    uses multiple antennas at both the transmitter and receiver to improve the performance
    and reliability of wireless systems.


    # Wireless LAN Overview


    WLAN technology and the WLAN industry date back to the mid-1980s when the Federal
    Communications Commission (FCC) first made the RF spectrum available to industry.
    During the 1980s and early 1990s, growth was relatively slow. Today, however,
    WLAN technology is experiencing tremendous growth. The key reason for this growth
    is the increased bandwidth made by the IEEE 802.11 standard. An introduction to
    the 802.11 WLAN technology, Table 1 provides some key characteristics at a glance.


    **Table 1**: Key Characteristics of 802.11 Wireless LANs


    | Characteristic | Description |

    | --- | --- |

    | Physical Layer | Direct Sequence Spread Spectrum (DSSS), Frequency Hopping Spread
    Spectrum (FHSS), Orthogonal Frequency Division Multiplexing (OFDM), infrared (IR).
    |

    | Frequency Band | 2.4 GHz (ISM band) and 5 GHz. |

    | Data Rates | 1 Mbps, 2 Mbps, 5.5 Mbps (11b), 11 Mbps (11g), 54 Mbps (11a) |

    | Data and Network Security | RC4-based stream encryption algorithm for confidentiality,
    authentication, and integrity. Limited key management. (AES is considered for
    802.11i.) |

    | Operating Range | Up to 150 feet indoors and 1500 feet outdoors. |

    | Positive Aspects | Ethernet speeds without wires; many different products from
    many different companies. Wireless cards and access point are decreasing. |

    | Negative Aspects | Poor security in native mode; throughput decrease with distance
    and load. |'
