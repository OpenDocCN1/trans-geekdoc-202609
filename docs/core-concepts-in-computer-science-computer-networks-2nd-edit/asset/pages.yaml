    # Benefits


    Bluetooth offers five primary benefits to users. This ad hoc method of untethered
    communication makes Bluetooth very attractive today and can result in increased
    efficiency and reduced costs. The efficiencies and cost savings are attractive
    for the home user and the enterprise business user.


    Benefits of Bluetooth include—


    +   - Cable replacement: Bluetooth technology replaces cables for a variety of
    interconnections. These include those of peripheral devices (i.e., mouse and keyboard
    computer connections), USB at 12 Mbps (USB 1.1) up to 480 Mbps (USB 2.0); printers
    and modems, usally at 4 Mbps; and wireless headsets and microphones that interface
    with PCs or mobile phones.'
