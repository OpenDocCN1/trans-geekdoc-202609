  md: 'level. In other words, the sender and the receiver clocks must be synchronized.


    +   Line Configuration: The physical layer is concerned with the connection of
    devices to the medium. In a point-to-point configuration, two devices are connected
    through a dedicated link. In a multipoint configuration, a link is shared between
    several devices.


    +   Physical Topology: The physical topology defines how devices are connected
    to a network. Devices can be connected using a mesh topology (every device connected
    to every other device), a star topology (devices are connected through a central
    device), a ring topology (every device is connected to the next, forming a ring),
    or a bus topology (every device on a common link).


    +   Transmission Mode: The physical layer also defines the direction of transmission
    between two devices: simplex, half-duplex, or full-duplex. In the simplex mode,
    only one device can send; the other can only receive. The simplex mode is at one
    way communication. In the half-duplex mode, two devices can send and receive,
    but not at the same time. In a full-duplex (or simply duplex) mode, two devices
    can send and receive at the same time.


    # Multiplexing and Switching


    To combine multiple signals (analog or digital) for transmission over a single
    line or media is called multiplexing. A common type of multiplexing combines several
    low-speed signals for transmission over a single high-speed connection.


    Multiplexing is done by using a device called multiplexer N input lines to generate
    one output line (i.e. by many). Therefore multiplexer (MUX) has several inputs
    and one output. At the receiving end, a device called demultiplexer (DEMUX) is
    used that separates signal into component signals. So DEMUX takes 4 input lines
    and divides them to single output line. The signal from 4 different devices is
    combined and carried by this single line. At the receiving side, a demultiplexer
    takes this signal from a single line and breaks it into the original signals and
    passes them to the 4 different receivers.


    Multiplexer is a device that selects one of several analog or digital input signals
    and forwards the selected input into a single line.'
