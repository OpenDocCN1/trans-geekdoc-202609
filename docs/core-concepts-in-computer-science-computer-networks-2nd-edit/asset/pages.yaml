    Mobile routers in a Bluetooth network control the changing network topologies
    of these networks. The routers also control the flow of data between devices that
    are capable of supporting a direct link to each other. As devices move about in
    a random fashion, these networks must be reconfigured to handle the dynamic topology.
    The routing protocols it employ Bluetooth to establish and maintain these shifting
    networks.


    Bluetooth transceivers operate in the 2.4 GHz, ISM band, which is similar to the
    band WLAN devices and other IEEE 802.11 compliant devices. Bluetooth transceivers,
    which use Gaussian Frequency Shift Keying (GFSK) modulation, employ a frequency
    hopping (FH) spread spectrum system with a hopping pattern of 1,600 times per
    second over 79 frequencies in a quasi-random fashion. The theoretical maximum
    bandwidth of a Bluetooth network is 1 Mbps. However, in reality the networks cannot
    support such data rates because of communication overhead. The second generation
    of Bluetooth technology is expected to provide a maximum bandwidth of 2 Mbps.'
