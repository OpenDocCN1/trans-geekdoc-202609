    is in close proximity to the users of the WLAN, and it is configured so as to
    appear as a legitimate AP to wireless clients, the rogue AP can successfully convince
    clients of its legitimacy and cause them to send traffic through. The rogue AP
    can intercept the wireless traffic between an authorized AP and wireless clients.
    It need only be configured with a stronger signal than the existing AP to intercept
    the client traffic. A malicious user can also gain access to the wireless network
    through APs that are configured to allow access without authorization. It is also
    important to note that rogue access points need not always be deployed by malicious
    users. In many cases, rogue APs are often deployed by users who want to take advantage
    of wireless technology without the approval of the IT department. Additionally,
    since rogue APs are frequently deployed without the knowledge of the security
    administrator, they are often deployed without proper security configurations.


    # Loss of Integrity


    Data integrity issues in wireless networks are similar to those in wired networks.
    Because organizations frequently implement wireless and wired communications without
    adequate cryptographic protection of data, integrity can be difficult to achieve.
    A hacker, for example, can compromise data by deleting or modifying the data in
    an e-mail from an account on the wireless system. This could be detrimental to
    an organization if important e-mail is widely distributed among e-mail recipients.
    Because the existing security features of the 802.11 standard do not provide for
    strong message integrity, other kind of active attacks that compromise system
    integrity are possible. The WEP based integrity mechanism is simply a linear CRC.
    Message modification attacks are possible when cryptographic checking mechanisms
    such as message authentication codes and hashes are not used.


    # Loss of Network Availability


    A denial of network availability involves some form of DoS attack, such as jamming.
    Jamming occurs when a malicious user deliberately emanates a signal from a wireless
    device in order to overwhelm wireless signals. Jamming may also be inadvertently
    caused by cordless phone or microwave emissions. Jamming results in a breakdown
    in communications because legitimate wireless signals are unable to communicate
    on the network. Nonmalicious users can also cause a DoS. A user, for instance,
    unintentionally monopolize a wireless signal by downloading large files, effectively
    denying other users access to the network. As a result, agency security policies
    should limit the types and amounts of data that users are able to download on
    wireless networks.


    # Other Security Risks


    With the prevalence of wireless devices, more users are seeking ways to connect
    remotely to their own organization’s networks. One method is the use of untrusted,'
