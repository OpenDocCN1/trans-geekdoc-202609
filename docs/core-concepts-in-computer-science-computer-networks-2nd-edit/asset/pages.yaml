    # Key Differences between Serial and Parallel Transmission


    +   * Serial transmission requires a single line to communicate and transfer data
    whereas, parallel transmission requires multiple lines.

    * Serial transmission used for long distance communication whereas, parallel transmission
    used for shorter distance.

    * Error and noise are least in serial as compared to parallel transmission. Since
    one bit follows another in Serial Transmission whereas, in Parallel Transmission
    multiple bits are sent together.

    * Parallel transmission is faster as the data is transmitted using multiple lines
    whereas, in Serial transmission data flows through a single wire.

    * Serial Transmission is full duplex as the sender can send as well as receive
    the data whereas, Parallel Transmission is half duplex since the data is either
    or received.

    * Serial transmission cables are thinner, longer and economical in comparison
    with the Parallel Transmission cables.

    * Serial Transmission is reliable and straightforward whereas, Parallel Transmission
    is unreliable and complicated.


    Both Serial and Parallel Transmission have their advantages and disadvantages
    respectively. Parallel Transmission is used for shorter distance, provides greater
    speed. On the other hand, Serial Transmission is reliable for transferring data
    to longer distance. Hence, we conclude that both serial and parallel are individually
    essential for transferring data.


