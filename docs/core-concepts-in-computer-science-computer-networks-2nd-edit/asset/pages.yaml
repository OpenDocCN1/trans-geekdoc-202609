- pgno: 218
  md: 'To access the Internet via a wireless connection, one must have the necessary
    equipment. The vast majority of laptops built after 2000 equipped with a wireless
    transmitter. For desktop computers and laptops that may not be wireless-ready,
    users have the choice of purchasing a wireless adapter. Wireless adapters are
