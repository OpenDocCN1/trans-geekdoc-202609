  md: 'possible packet exchange throughput is two packets for every two slots, one
    in each direction.


    # Advantages and Challenges in PNC


    PNC can potentially achieve 100% and 50% throughput increases compared with traditional
    transmission and straightforward network coding, in multi-hop networks. PNC achieves
    this doubling of the TWRC throughput by reducing the needed time slots for the
    exchange of one packet from four to two. Unfortunately, PNC is yet to be widely
    used in wireless networks, since in a general multi-hop network, MAC-layer and
    network-layer issues will take on an increasingly important role, particularly
    with regard to the management of complexity when there are many synchronous flows
    in the network.


    One of the key issues in PNC is how to deal with the asynchronies between the
    signals transmitted simultaneously by the two ends. Symbols transmitted by the
    two ends could potentially arrive at the receiver with symbol misalignment as
    relative carrier-phase offset. This could result in significant penalties to performance.
    Reliability of transmission is also one of the challenges that face PNC. Channel
    coding is typically used to solve this issue, and its application to PNC is the
    subject of research today.


    # Applications of NC to Wireless Networks


    It is unlikely that incorporating network coding at the physical layer will be
    practical in the near future. It is however quite feasible to build network coding
    into overlay networks. In overlay networks, nodes are running in computers and
    edges are the transport-level connections between computers. Overlay networks
    can be infrastructure-based, as shown by content distribution networks like Akamai.
    They can also be ad-hoc or peer-to-peer (P2P) networks of end hosts temporarily
    linked together to perform a particular communication task, for example file download,
    live broadcast, media on demand, instant messaging, conferencing or gaming.


    # File Download


    Downloading files from a server to a client computer is one of the most common
    tasks that occurs in network communication. While the downloaded file is traditionally
    unicast from the server to the client, if we ignore delay, this can also be viewed
    as a multicast of the file from the server to a large group of clients using a
    proportionally large amount of buffering. Using this simplification, network coding
    could potentially increase the throughput and reduce the average download time.
    Consider, for example, downloading a file over a P2P network comprising all the
    nodes that are currently downloading the file. In this model, newly arriving nodes
    join the network by connecting to a subset of the existing nodes. According to
    the difficulty of P2P content distribution is finding an optimal block scheduling
    algorithm, which should minimize the file downloading time in a'
