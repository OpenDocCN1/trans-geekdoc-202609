    # Sliding window


    When one host sends traffic to another it is desirable that the traffic should
    arrive in the same sequence as that in which it is dispatched. It is also desirable
    that a data link should deliver frames in the order sent.


    A flexible concept of sequencing is referred to as the sliding window concept
    and the next three protocols are all sliding window protocols.


    In all sliding window protocols, each outgoing frame contains a sequence number
    SN ranging from 0 to 2^(n-1)(where n is the number of bits reserved for the sequence
    number field).


    At any instant of the sender maintains a list of consecutive sequence numbers
    to frames it is permitted to send. These frames are said to fall within the sending
    window. Similarly, the receiver maintains a receiving window corresponding to
    frames it is permitted to accept.


    The size of the window relates to the available buffers of a receiving or sending
    node at which frames may be arranged into sequence.


    At the receiving node, any frame falling outside the window is discarded. Frames
    falling within the receiving window are accepted and arranged into sequence. Once
    sequenced, the frames at the left of the window are delivered to the host and
    an acknowledgement of the delivered frames is transmitted to their sender. The
    window is rotated to the position where the left edge corresponds to the next
    expected frame, RN.


    Whenever a new frame arrives from the host, it is given the next highest sequence
    number, and the upper edge of the sending window is advanced by one. The sequence
    numbers within the sender''s window represent frames sent but yet not acknowledged.


    When an acknowledgement comes in, it gives the position of the receiving window
    edge which indicates what frame the receiver expects to receive next. The sender
    then rotates its window to this position, making buffers available for continuous
    transmission.


    # A one-bit sliding window protocol: protocol 4


    The sliding window protocol with a maximum window size 1 uses stop-and-wait since
    the sender transmits a frame and waits for its acknowledgement before sending
    the next one.'
