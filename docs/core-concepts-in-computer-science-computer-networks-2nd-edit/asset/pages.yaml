    # Serial and Parallel Transmission


    The transmission mode refers to the number of elementary units of information
    (bits)

    that can be simultaneously translated by the communications channel. In fact,
    recent

    processors (and, therefore, computers in general) never process a single bit at
    a time;

    generally they are able to process several — most of the time it is 8: one byte—and

    for this reason the basic connections on a computer are parallel connections.


    ![](img/f7819d05465fc14719b3ebbba980271a_118_1.png)


    # Parallel Connection


    Parallel connection means simultaneous transmission of N bits. These bits are
    sent

    simultaneously over N different channels (a channel being, for example, a wire,
    a

    cable, or any other physical medium). The parallel connection on PC-type computers

    generally requires 10 wires:


    ![](img/f7819d05465fc14719b3ebbba980271a_118_2.png)


    These channels may be: N physical lines; in which case each bit is sent on a physical

    line (which is why parallel cables are made up of several wires in a ribbon cable);
    or

    one physical line divided into several sub-channels by dividing up the bandwidth
    in

    which case each bit is sent at a different frequency). Since the conductive wires
    are

    close to each other in the ribbon cable, interference can occur (particularly
    at high

    speeds), and degrade the signal quality.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Serial Connection


    In a serial connection, the data is sent one bit at a time over the transmission
    channel. However, since most processors process data in parallel, the transmitter
    needs to transform incoming parallel data into serial data and the receiver needs
    to do the opposite:


    ![](img/f7819d05465fc14719b3ebbba980271a_119_0.png)


    These operations are performed by a communications controller (normally a UART,
    or a Universal Asynchronous Receiver Transmitter, chip. The communications controller
    works in the following manners. The parallel-serial transformation is performed
    using a shift register. The shift register, working together with a clock, will
    shift the register (containing all of the data presented in parallel) by position
    to the left, and then, transmit the most significant bit (the leftmost one) and
    by one on:


    ![](img/f7819d05465fc14719b3ebbba980271a_119_1.png)


    The serial-parallel transformation is done in almost the same way using a shift
    register. The shift register shifts the register by one position to the left each
    time a bit is received and, then, transmits the entire register in parallel when
    it is full:


    ![](img/f7819d05465fc14719b3ebbba980271a_119_2.png)


    # Difference between Serial and Parallel Transmission


    For transferring data between computers, laptops two methods are used, namely,
    Serial Transmission and Parallel Transmission. There are some similarities and
    dissimilarities between them. One of the primary difference is that; in Serial
    Transmission data is sent bit by bit whereas, in Parallel Transmission a byte
    (8 bits) or character is sent. And the Similarity is that both are used to connect
    and communicate with peripheral devices. Other differences are discussed below.'
  merge: -1
