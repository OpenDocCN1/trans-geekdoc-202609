- pgno: 160
  md: 'An ACK transmitted in response to a received message indicates that the message
    received without errors and NAK indicates that the message was received with errors
    and it is an automatic request for retransmission of the rejected message.


    # Poll/Select


    The poll/select method of line discipline works with topologies where one device
    is designated as a primary station and the other device is secondary stations.
    Whenever multipoint link consists of a primary device and multiple secondary devices
    using a single transmission line, all exchanges must be made through primary device.
    The primary device controls the link; the secondary device follows its instructions.
    It is up to the primary to determine which device is allowed to use the channel
    at a time. The primary therefore is the initiator of a session. If the primary
    wants to receive data and send data, it applies functions called poll and select.
    A poll is a solicitation from the primary to a secondary station to determine
    if the secondary station has data to transmit. The primary designates a secondary
    as a destination or recipient of data. A selection is also a query from the primary
    to determine if the secondary is ready to receive data. All secondary stations
    receive all polls and selections. With poll/select procedures each station is
    assigned one or more address for identification.


    The primary polls station A, which responds with a negative acknowledgment to
    a poll (NAK), indicating that the received has no message to send. The primary
    polls station B, which responds with a positive acknowledgment to a poll (i.e.,
    a message). The primary selects station B to see if it is ready to receive a message.
    Station B responds with a positive acknowledgment to the selection (ACK), indicating
    that it is ready to receive a message. The primary transmits the message to station
    B. The primary selects station C, which responds with a negative acknowledgment
    to the selection (NAK), indicating that it is not ready to receive a message.


    # Flow Control


    Flow control defines a set of procedures that the transmitting station has how
    much data it can send before it must stop and waiting for an acknowledgement from
    the destination station. The two common methods of flow control are stop and wait
    and sliding window.


    +   - Stop-and-wait Flow Control: The sending station sends a frame of data and
    waits for an acknowledgement from the other station before sending further data.
    The other party can stop the flow of data by simply withholding an acknowledgement.
    Source may not send new frame until acknowledges the frame already sent. Very
    inefficient especially when a single message is broken into separate frames. The
    primary advantage is simplicity and the primary disadvantage is speed, the time
    lapse between each frame is wasted time. Each frame takes essentially twice as
    long to'
