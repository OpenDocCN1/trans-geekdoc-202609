- pgno: 215
  md: '# Frequency and Data Rates


    IEEE developed the 802.11 standards to provide wireless networking technology
    like the wired Ethernet that has been available for many years. The IEEE 802.11a
    standard is the most widely adopted member of the 802.11 WLAN family. It operates
    in the licensed 5 GHz band using OFDM. The popular 802.11b b standard operates
    in the unlicensed 2.4 GHz–2.5 GHz Industrial, Scientific, and Medical (ISM ) frequency
    band using a direct sequence-spectrum technology. The ISM band has become popular
    for wireless communications because it is available worldwide. The 802.11b WLAN
    technology permits transmission speeds of up to 11 Mbps per second. This makes
    it considerably faster than the original IEEE 802.11 standard (that sends data
    up to 2 Mbps) and slightly faster than standard Ethernet.


    # 802.11 Architecture


    The 802.11 standard defines two kinds of services: the Basic Service Set (BSS)
    and the Extended Service Set (ESS) [1, 6]. The BSS is the basic building block
    of a wireless LAN. A BSS consists of stationary or mobile wireless stations and
    possibly a central base station (e.g., an AP). When a station is in the BSS, it
    can communicate with the other members of the BSS.


    ![](img/f7819d05465fc14719b3ebbba980271a_215_0.png)


    Figure 1: Independent and Infrastructure Basic Service Sets.


    The BSS without an AP is a stand-alone network and cannot send data to other BSSs.
    Such BSSs are called Independent BSSs (IBSS). See Figure 1 (a). Typically, IBSSs
    involve a small number of stations set up for a specific purpose and for a short
    period of time (e.g., creating a short-lived network to support a single meeting
    in a conference room). IBSSs are also referred to as ad hoc networks.


    Infrastructure BSSs are distinguished from ad hoc networks by the use of an AP.
    Figure 1 (b). APs are used for all communications in an infrastructure BSS, including
    communication between mobile nodes in the same service set. An infrastructure
    BSS is bounded by the coverage distance from the AP. The coverage area of a single
    AP is called a cell. All mobile stations are required to be within reach of the
    AP'
  merge: -1
  img_proc: true
- pgno: 216
  md: '802.11 allows wireless networks of arbitrarily large size to be created by
    linking BSSs into an ESS. An ESS is created by chaining BSSs together with a backbone
    network. All APs in an ESS are given the same Service Set Identifier (SSID), which
    serves as a network name for its users. APs in an ESS operate in a manner such
    that the outside world can use the station''s MAC address to talk to a station
    without worrying about its location in the ESS.


    Figure 4 shows three BSSs corresponding to three APs. There is an equal level
    of overlap between BSS 1 and BSS 2, and between BSS 2 and BSS 3. Such overlap
    is necessary to provide stations with seamless connectivity if they move from
    one BSS to another. In the figure, the router uses the station''s MAC address
    as the destination to deliver frames to a station; only the AP with which that
    is associated delivers the frame.


    ![](img/f7819d05465fc14719b3ebbba980271a_216_0.png)


    **Figure 2**: Extended service set.


    Usually, mobility support is the primary motivation for deploying 802.11 network.
    IEEE 802.11 allows mobility between BSSs at the link layer. However, it is not
    aware of anything that happens above the link layer. When stations move between
    BSSs, they will find and attempt to associate with an AP with the strongest signal
    and the least network traffic. This way, a mobile station can transition seamlessly
    from one AP in the network to another, without losing connectivity. This event
    is often referred to as roaming.


    # Wireless LAN Network


    A WLAN comprises two types of equipment: a wireless station and an access point.
    A station, or client, is typically a laptop or'
