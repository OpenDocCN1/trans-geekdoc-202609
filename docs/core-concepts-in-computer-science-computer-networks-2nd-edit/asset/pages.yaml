  md: 'average speed of parallel and serial ports, respectively. This rate is adequately
    fast for many of the applications for which Bluetooth was conceived. Moreover,
    it is anticipated that even faster data rates will be available in the future.


    # Bluetooth Architecture and Components


    Bluetooth communication occurs between a master radio and a slave radio. Bluetooth
    radios are symmetric in the same device may operate as a master and a slave. Each
    radio has a 48-bit unique device address (BD_ADDR) that is fixed.


    Two or more radio devices detect form-hoc networks called piconets. All units
    within a piconet share the same channel. Each piconet has one master device and
    one more slaves. There may be up to seven active slaves at a time within a piconet.
    Thus, each active device within a piconet is identifiable by a 3-bit active device
    address. Inactive slaves in unconnected modes may continue to remain within the
    piconet.


    A master is the only one that may initiate a Bluetooth communication link. the
    slave may require master/slave switch to become the master. Slaves are not allowed
    to talk to each other directly. All communication occurs within the slave and
    the master. Slaves within a piconet must also synchronize their internal clocks
    and frequency hops with that of the master. Each piconet uses a different frequency
    hopping sequence. Radio devices used Time Division Multiplexing (TDM). A master
    device in a piconet transmits on even numbered slots and the slaves transmit on
    odd numbered slots.


    Time-division multiplexing (TDM) is a method of transmitting and receiving independent
    signals over a common signal path by means of synchronized switches at each line
    so that each appears on the line only a fraction of time in an alternating pattern.
