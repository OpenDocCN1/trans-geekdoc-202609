    +   Sensitive information that is not encrypted (or that is encrypted with poor
    cryptographic techniques) and that is transmitted between two wireless devices
    may be intercepted and disclosed.


    +   Denial of service (DoS) attacks may be directed at wireless connections or
    devices.


    +   Malicious entities may steal the identity of legitimate users and masquerade
    as them on internal or external corporate networks.


    +   Sensitive data may be corrupted during improper synchronization.


    +   Malicious entities may be violate the privacy of legitimate users and be able
    to track their physical movements.


    +   Malicious entities may deploy unauthorized equipment (e.g. client devices
    and access points) to surreptiously gain access to sensitive information.


    +   Handheld devices are easily stolen and can reveal sensitive information.


    +   Data may be extracted without detection from improperly configured devices.


    +   Viruses or other malicious code may corrupt data on a wireless device and
    be subsequently introduced to a wired network connection.'
