- pgno: 157
  md: '# INTRODUCTION


    Data Link Protocols are a crucial set of rules and conventions governing data
    exchange between devices within a communication network. Operating at the Data
    Link Layer (Layer 2) of the OSI model, these protocols facilitate reliable and
    efficient communication over various physical transmission media. They address
    key aspects of data transmission, such as framing, addressing, error detection,
    correction, flow control, and media access control. Framing involves breaking
    data into manageable frames, enabling the receiver to identify the beginning and
    end of each unit.


    Addressing assigns unique identifiers to devices, ensuring accurate data delivery
    to the intended recipients. Error detection and correction mechanisms identify
    and rectify transmission errors, enhancing data integrity.


    Flow control regulates data flow between devices to prevent overwhelming receivers
    and Additionally, media access control resolves contention issues when multiple
    devices transmit simultaneously on shared channels.


    Several well-known data link protocols include Ethernet for wired LANs, Wi-Fi
    (IEEE 802.11) for wireless LANs, PPP for point-to-point connections, HDLC for
    WANs, and Frame Relay for remote site connections. The appropriate choice of data
    link protocol depends on the network''s characteristics, devices used, and specific
    application requirements.


    ![](img/f7819d05465fc14719b3ebbba980271a_157_0.png)


    # CORE CONCEPT: FUNCTIONS AND REQUIREMENTS OF THE DATA LINK PROTOCOLS


    A data link is a method for connecting one location to another in telecommunications,
    in order to transmit and receive digital information. Data transfer happens over
    a certain link protocol that allows data to be transferred from the source to
    the destination. In the OSI model for computer networking, the data link essentially
    makes up the second layer.


    Computer networks communicate using protocols, which define the procedures for
    the systems involved in the communications process will use. A data-link protocol
    is a set of rules implementing and governing an orderly exchange of data between
    two devices, such as line control units and front-end processors.


    The purpose of the data link layer is to transfer blocks of data without error
    between two adjacent devices. Adjacent devices are physically connected by a communication
    channel such as telephone lines, coaxial cables, optical fibers, or satellites.
