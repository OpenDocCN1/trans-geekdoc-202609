    With Open System authentication, a client is authenticated if it simply responds
    with a MAC address during the two-message exchange with an access point. During
    the exchange, the client is not truly validated but simply responds with the correct
    fields in the message exchange. Obviously, with cryptographic validation, open-system
    authentication is highly vulnerable to attack and practically invites unauthorized
    access. Open-system authentication is the only required form of authentication
    by the 802.11 specification.'
