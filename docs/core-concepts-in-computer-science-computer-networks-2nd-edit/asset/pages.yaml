    # CORE CONCEPT: TRANSMISSION CONTROL PROTOCOL (TCP)


    Transmission Control Protocol (TCP) is usually not associated with quality of
    service; but one could argue that TCP offers QoS in terms of assured delivery
    and efficient use of bandwidth, although it provides no delay guarantees. TCP
    is, after all, mainly about efficiency and adaptation: how to deliver data utilizing
    the maximum available (but fair) share of a dynamically changing network capacity
    to reduce the delay.


    The transmission control protocol is one of the two that make up the Internet
    connection suite. This protocol is combined with the Internet protocol to form
    the foundation of all Internet traffic. These protocols are almost inseparable
    in use, relying completely on each other for proper functioning; as a result,
    the Internet connection suite is typically abbreviated as TCP/IP (transmission
    control protocol/Internet protocol). The transmission control protocol is responsible
    for the disassembly and reassembly of data, and the Internet protocol handles
    the routing and transmission. Internet traffic is primarily made of small data
    bursts packets. These packets contain information relating to the origin and destination
    of the data as well as some additional information. The packets are created and
    reassembled by the transmission control protocol and sent over the Internet by
    the Internet protocol.


    To illustrate this process, a document is moved from a remote computer to a local
    one. The computer receives the move command, and the Internet protocol determines
    how the document needs to move between the computers. The Internet protocol then
    asks the transmission control protocol to split the document up in a specific
    way.'
