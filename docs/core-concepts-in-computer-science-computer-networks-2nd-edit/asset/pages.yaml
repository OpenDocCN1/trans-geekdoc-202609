    # Source Port


    A 16-bit number identifying the application the TCP segment originated from within
    the sending host. The port numbers are divided into three ranges, well-known ports
    (0 through 1023), registered ports (1024 through 49151) and private ports (49152
    through 65535). Port assignments are used by TCP as an interface to the application
    layer. For example, the TELNET server is always assigned to the well-known port
    23 by default on TCP hosts. A complete pair of IP addresses (source and destination)
    plus a complete pair of TCP ports (source and destination) define a single TCP
    connection that is globally unique.


    # Destination Port


    A 16-bit number identifying the application the TCP segment is destined for on
    a receiving host. Destination ports use the same port number assignments as those
    set aside for source ports.


    # Sequence Number


    A 32-bit number identifying the current position of the first data byte in the
    segment within the entire byte stream for the TCP connection. After reaching 2^{32}-1,
    this number will wrap around to 0.


    # Acknowledgement Number


    A 32-bit number identifying the next data byte the sender expects from the receiver.
    Therefore, the number will be one greater than the most recently received data
    byte. This field is only used when the ACK control bit is turned on.


    # Header Length


    A 4-bit field that specifies the total TCP header length in 32-bit words (or in
    multiples of 4 bytes if you prefer). Without options, a TCP header is always 20
    bytes in length. The largest TCP header may be 60 bytes. This field is required
    because the size of the options field(s) cannot be determined in advance. Note
    that this field is called “data offset” in the official TCP standard, but header
    length is more commonly used.


    # Reserved


    A 6-bit field currently unused and reserved for future use.


    # Control Bits


    Urgent Pointer (URG): If this bit field is set, the receiving TCP should interpret
    the urgent pointer field.'
