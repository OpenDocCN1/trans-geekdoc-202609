- pgno: 158
  md: 'cation of such a physical link is that the data bits are delivered in exactly
    the same order in which they are sent. The physical has no inherent storage capacity;
    therefore the propagation delay over the link.


    Transmission of data over the link would be very simple indeed if no error ever
    occurred. Unfortunately, this is not so in a real physical link for a number of
    reasons:


    +   - Natural phenomena as noises and interference are introduced into the link
    causing errors in detecting the data.

    - There is a propagation delay in the link.

    - There is a finite data processing time required by the transmitting and receiving
    stations.

    - A data link protocol thus has to be designed to ensure an error-free transmission
    and also to achieve efficiency of the data transfer as high as possible.


    Data-link protocol functions include line, flow control, and error control.


    Line discipline coordinates hop-to-hop data delivery where a hop is a computer,
    a network controller, or some type of network-connecting device, such as a router.


    # Data Laink Layer


    | Application |

    | Presentation |

    | Session |

    | Transport |

    | Network |

    | Data link |

    | Physical |


    | Line discipline |

    | Flow control |

    | Error control |


    Flow Control is the process of managing the rate of data transmission between
    two nodes to prevent a fast sender from overwhelming a slow receiver.


    Figure 1: Data link control with OSI layer.


    Line discipline determines which device is transmitting and which is receiving
    at any point in time.


    Flow control coordinates the rate at which data is transported over a link and
    generally provides an acknowledgment mechanism that ensures that data is received
    at the destination.


    Error control specifies a means of detecting and correcting transmission errors.'
