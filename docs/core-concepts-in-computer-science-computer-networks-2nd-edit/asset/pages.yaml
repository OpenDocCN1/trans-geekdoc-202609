    # Characteristics of Data Communication


    Data communication is the active process of transporting data from one point to
    another. Networks are communication system designed to convey information from
    a point of origin to a point of destination. Note that they are communication
    system, not computer system. The operative word is communication, the transfer
    of information from one device to another.


    ![](img/f7819d05465fc14719b3ebbba980271a_99_0.png)


    Networks come in two flavors – local as in local area network, which cover a small
    area and have a finite, relatively small, number of users and global or long-haul,
    which cover long distance and have an unlimited number of users. Telephone networks
    are long network. It refers to the transmission of the digital signals over a
    communication channel between the transmitter and receiver computers. Communication
    is possible only with wired and wireless connectivity of the computers with each
    other. The effectiveness of a data communication system depends on three fundamental
    characteristics:


    +   - Delivery: The system must deliver data to the correct destination. Data
    must be received by the intended device or user and only by that device or user.

    - Accuracy: The system must deliver data accurately. Data that have been altered
    in transmission and left uncorrected are unusable.

    - Timeliness: The system must deliver data in a timely manner. Data delivered
    late are useless. In the case of video, audio and voice data, timely delivery
    means delivering data as they are produced, in the same order that they are produced,
    and without significant delay. This kind of delivery is called real-time transmission.'
