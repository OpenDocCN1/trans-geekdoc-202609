- pgno: 219
  md: '# Security 802.11 Wireless LANs


    Due to the RF signal nature of the wireless network, it is very difficult to control
    which computers or devices are receiving the wireless network signal. Therefore,
    the wireless relies on software link-level protection, specifically implementing
    cryptography to protect from eavesdropping and other network attacks. The original
    802.11 standard only offers WEP to secure the wireless network.


    # Access Control List


    The access control list is the simplest security measure we can find in a wireless
    network. The protection offered by this mechanism mainly consists of filtering
    out unknown users and requires a list of authorized client''s MAC addresses to
    be loaded in the Access Point. Only those registered MAC addresses will be able
    to communicate with the Access Point, and will drop any communication from others
    not registered MAC addresses.


    As the name of this mechanism implies, it just offers access control to the network
    behind the access point, no other protection is offered, meaning that it will
    not protect each wireless client nor the network traffic confidentiality or integrity.
    Therefore, any wireless network protected with this mechanism is very vulnerable
    and open to any network attack.


    In addition, this security mechanism can be easily defeated, making it ineffective
    as an access control measure; it turns out that is easy to change the MAC address
    on practically any network interface temporarily (at least in Windows and UNIX/Linux
    OS). Changing the MAC address to impersonate another user or device is called
    MAC spoofing. In UNIX/Linux OS, we only need to execute one command to do MAC
    spoofing


    ```

    config eth0 hw ether 00:01:02:03:04:05

    ```


    Where:


    eth0:01:02:03:04:05 is the MAC address we want to specify with numbers in hex
    number format.


    In Windows environment, we need the help of tools designed specially for this
    intention. There are at least two tools available for MAC spoofing:



    +   a. SMAC³, from KLC Consulting, and

    b. MAC Makeupup4 (freeware), from H&C Works


    Both have to use easy graphical interface, are compatible with Windows 2000 and
    XP, does not require installing any driver and are nearly compatible with any
    network interface card, including wireless.


    With the help of wireless analyzers utilities, anyone can obtain by its own list
    of registered MAC addresses, allowing anyone to use this information to penetrate
    a not well-protected wireless network. Wireless analyzers are very powerful utilities'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'that can passively monitor or sniff wireless network traffic, gathering important
    information about the wireless network.


    # WEP (Wired Equivalent Privacy)


    Initially, WEP (Wired Equivalent Privacy) was the only link-security option defined
    in the 202.11 standard. Its main purpose was the protection of the confidentiality
    and integrity of the wireless network traffic. WEP was designed to provide comparable
    confidentiality to a traditional wired network, hence the name


    To meet the security proposed, WEP uses encryption to protect the data. WEP uses
    the RC4 stream cipher with a 64 or 128 bits key to provide data packet encryption.
    In addition, WEP can be used as an access control method, because once WEP is
    active, the Access Point will just establish communication with nodes that have
    the same secret key, rejecting the others. In a WEP-protected wireless network,
    every member of this wireless network, clients must share the same secret key
    This secret key can be a password or a character sequence generated by a wireless
    configuration program using a passphrase. It is not relevant how the secret key
    is introduce, especially when using cards from several manufacturers, the most
    important thing is that every member of the wireless network must have the same
    WEP secret key


    We have mentioned that WEP uses a 64 or 128 bits key to encrypt the data, but
    actually, the effective key is smaller, because part of the WEP key is transmitted
    in clear text along with the data packet. The WEP key, the key used to encrypt
    the data packet, is a concatenation of two values, a dynamic value called secret
    key. The Initialization Vector (IV) and the static part of the key, the shared
    secret key. The Initialization Vector (IV) is a dynamic 24-bit value chosen randomly
    by the transmitter wireless network interface to give the WEP key likeness, giving
    more than 16 millions possible keys. Liveness is required in WEP key because each
    message must be encrypted with a different key. The length of the shared secret
    key depends on the WEP key size chosen. When a 64 bit key is used, the shared
    secret key is 40 bits long (5 ASCII character) and for a 128 bit key, the shared
    secret key is 104 bits long (13 ASCII character). To synchronize the WEP key,
    the transmitter with the receiver, the IV value is transmitted in clear text along
    with data packet, therefore revealing 24 bits of the 64 or 128 bits key.


    Encryption is the process of encoding a message or information in a way that only
    authorized parties can access it.'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'In a WEP-protected wireless network, a data packet that gets into the link-level
    is encrypted before sending it off the air. The data packet encryption is performed
    as


    > A wireless network interface, also known as a wireless network adapter or NIC
    (Network Interface Card), is a hardware component that allows a device to connect
    to a wireless network.


    follow: First, the wireless network interface randomly chooses an IV and concatenates
    with the shared secret key to form the WEP key (IV + secret key). The 802.11 standard
    does not define how the wireless network interface must be chosen. Therefore,
    the way the wireless network interface chooses the IV value depends on the manufacturer.


    When the WEP Key is ready, this key is passed to the RC4 cipher to produce a pseudandom
    string with the data packet length. The actual encryption occurs when the wireless
    network interface performs a logical XOR operation between the data package with
    the pseudo-random string. To complete the WEP-protected data packet, the link-level
    headers, IV value and the encrypted data packet are packed together and transmitted
    to the receiver.


