  md: 'an acknowledgement. This acknowledgement delay could severely impact the effective
    data transfer rate.


    The effects of these problems can be overcome by allowing the sender to transmit
    contiguous frames (say up to w frames) before it receives an acknowledgement.
    This technique is known as pipelining.


    In the satellite example, with a channel capacity of 50kbps and 1000-bit frames,
    by the time the sender has finished sending 26 frames, t~520 ms, the acknowledgement
    for frame 0 will have arrived, allowing the sender to continue sending frames.
    At all times, 25 or 26 unacknowledged frames will be outstanding, and the sender’s
    window size needs to be at least 26.


    pipining frames over an unreliable communication channel raises serious issues.
    What happens if a frame in the middle of a long stream is damaged or lost? What
    should the receiver do with all the correct frames following the bad one? The
    two basic Automatic Repeat for Repeat (ARQ) methods for dealing with errors in
    the presence of pipelining.


    One method, the normal mode of ARQ is Go-Back-N. If the receiver detects any error
    in frame N, it signals the sender and discards any subsequent frame.


    The sender, which may currently be sending frame N+X when the error is detected,
    initiates retransmission of frame N and all subsequent frames.


    The other method is called selective repeat. In this method the receiver stores
    all the correct frames following the bad one. When the sender finally notices
    what was wrong, it just retransmits the one bad frame, not all its successors.


