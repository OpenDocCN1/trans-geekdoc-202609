    # The Data Path


    To lay the ground for this post, let me first introduce the basic data flow over
    a communication network. When two nodes wish to communicate over a network path
    (say your typical client-server application), the requests (in the form of data
    packets) from your application are sent to your wireless router, which then sends
    them to your ISPs network, which on their turn sends them to a core network, which
    then forwards them to the appropriate server that should handle your request.


    ![](img/f7819d05465fc14719b3ebbba980271a_269_0.png)


    At all these points, network components (routers and switches) operate in a store-and-forward
    way. They have a buffer which they use to store the received packets to then send
    them to the next hop in the data path. If too much bandwidth is used, these buffers
    fill up, adding latency and packet loss to the connection (along with the intrinsic
    latency and packet of the communication path). If the client''s first hop is a
    wireless connection, the situation is even worse, due to its characteristics (added
    latency due to MAC contention and packet loss due to interference and signal propagation
    issues).'
