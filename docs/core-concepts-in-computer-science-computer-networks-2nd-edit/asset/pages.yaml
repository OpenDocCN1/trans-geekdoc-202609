    technology and malicious threats are continually changing. To date, the list below
    includes some of the more salient threats and vulnerabilities of wireless systems:


    +   All the vulnerabilities that exist in a conventional wired network apply to
    wireless technologies.


    +   Malicious entities may gain unauthorized access to an agency''s computer or
    voice (IP telephony) network through wireless connections, potentially bypassing
