- pgno: 264
  md: 'communication, wireless information theory, and wireless networking. We shall
    attempt to give a brief overview of both the theory behind this concept and the
    implications of the results in the three fields listed above.


    # Theory behind PNC


    Interference is often treated as a destructive phenomenon in wireless communication
    networks today. When multiple transmitters send radio waves to their respective
    receivers, a receiver may receive signals from its transmitter as well as from
    other transmitters at the same time. The radio waves from the other transmitters
    are often treated as interference that corrupts the intended signal, as a result
    of their overlapping. In Wi-Fi networks, for example, when multiple nodes transmit
    together, packet collisions can occur leading to none of the packets being received
    correctly. PNC takes advantage of the fact that when multiple EM waves come together
    within the same physical space, they either or superimpose, increasing in amplitude.
    This mixing of EM waves is a form of natural network coding, which is utilized
    in PNC.


    The concept of PNC can be most easily illustrated with a network model known as
    a Two-Way Relay Channel (TWRC). TWRC is a three-node linear network in which two
    nodes, nodes $T_1$ and $T_2$, communicate via a relay node R. This is illustrated
    in Figure 4:


    ![](img/f7819d05465fc14719b3ebbba980271a_264_0.png)


    **Figure 4**: Two-Way Relay Channel.


    There is no direct signal path between nodes $T_1$ and $T_2$. A real-world example
    of such a system is a satellite network in which nodes $T_1$ and $T_2$ are the
    ground stations, and the relay R is the satellite. The half-duplex constraint
    is often imposed on wireless communication systems to ease engineering design.
    With the half-duplex constraint, a node cannot transmit and receive at the same
