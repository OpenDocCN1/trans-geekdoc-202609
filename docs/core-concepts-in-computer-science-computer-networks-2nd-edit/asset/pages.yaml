- pgno: 263
  md: 'Figure 3: Triangular Pattern.


    The decoding process is similar to the LNC decoding process, which involves Gaussian
    estimation. However in this case, it is simplified since the coded packets are
    in a triangular pattern and such as the receiver only needs to perform back-substitution,
    where each row is solved, from the last to the first row. This is far less computationally
    intensive and gives triangular coding the bandwidth performance of LNC, affording
    the computation cost of XOR coding.


    # Opportunistic Network Coding


    In ONC, the sensor nodes can snap on all transmissions in their neighborhood and
    store the overhead data packets, whether they are intended for them or not. As
    such, the sensor nodes know the overhead and routed packets that each neighboring
    node possesses, and can perform network coding operations based on this information.
    Each node has its own queue of received uncoded packets $p_1,p_2,...,pn$, whose
    destinations, determined by their packet headers and the node''s routing table,
    are $r_1,r_2,...,rn$. The node then dequeues the first packet, $p_j$, and while
    making sure of all next recipients can immediately decode the resulting combination,
    steps through the greedy to add packets for combination. A recipient can immediately
    decode a combined packet if it knows all one coded packet. For example, a combined
    packet $p_i+p_j+p_k+p_l$ is valid if $r_i$ knows $p_i$, $r_j$ knows $p_j$, and
    $r_k$ knows $p_k$ and $p_l$.


    We are now familiar with some of the common coding schemes in use, and can now
    see that most of these are geared packet-based networks. In wireless networks
    however, there are significant gains to be made at layers before the application
    layer, which is where the bulk of NC is located at present.


    # Physical Layer Network Coding


    Physical-layer network coding as a concept was proposed in 2006 for application
    in wireless networks. PNC''s main idea is to take advantage of the natural network
    coding operation that occurs when electromagnetic (EM) waves are superimposed
    on one another. This simple idea lead to numerous advancements, with subsequent
    works by various researchers leading to many new results in the domains of wireless'
