  md: '+   The Information Transfer (I) PDU: It carries out a numbered information
    transfer in Type 2 operations.


    +   The Supervisory (S) PDU: It carries out acknowledgement, retransmits requests
    and suspends of I PDUs in Type 2 operations.


    +   The Unnumbered (U) PDU: It carries out some control functions and un-sequenced
    information transfer in Type 1 operations.


    # Subnetwork Access Protocol (SNAP)


    SNAP refers to a protocol used in computer networking to provide a standard method
    for encapsulating higher-layer network protocols within a data link frame.


    There is the special case of sub network access protocol (SNAP) where the DSAP
    and SSAP are set to AA and the control field set to 03. Then, immediately after
    the control fields there are three bytes set aside for the organizational unique
    identifier (OUI) and then two bytes for the Protocol Identifier (PID).


    The SAP is generally used for the 802.x compliant protocols; however, the idea
    of SNAP is to allow non-IEEE compliant protocols to become pseudo-compliant without
    a major re-write of code for network drivers. An OUI of 00-00 indicates that the
    frame is an Ethernet frame rather than an 802.3 frame that is not assigned to
    any particular vendor. This is useful for when the frame crosses different media.
    On coming out the other side it will be rebuilt as an Ethernet frame rather than
    something else.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# CONCEPT OF MEDIA ACCESS CONTROL (MAC) PROTOCOLS


    Media Access Control (MAC) Protocols are a fundamental aspect of the Data Link
    Layer in computer networking, responsible for regulating the access and usage
    of shared communication channels. In scenarios where multiple devices share a
    common transmission medium, such as in Ethernet LANs or wireless networks, MAC
    protocols ensure fair and efficient data transmission to prevent collisions and
    maximize network performance.


    ![](img/f7819d05465fc14719b3ebbba980271a_190_0.png)


    The primary concept of MAC Protocols revolves around coordinating and managing
    data transmissions. Devices equipped with network interface cards (NICs) listen
    to the medium before initiating data transmission, employing techniques like Carrier
    Sense Multiple Access (CSMA) to detect ongoing transmissions. If the medium is
    idle, a device can transmit data. However, when multiple devices attempt to transmit
    simultaneously, collisions can occur, causing data loss and network inefficiency.


    To address collisions, MAC Protocols utilize collision avoidance or detection
    mechanisms, such as CSMA with Collision Detection (CSMA/CD) in Ethernet networks.
    When collisions occur, devices introduce random backoff timers before retrying
    data transmission, reducing the likelihood of repeated collisions.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# SUMMARY


    +   * Data Link Protocols are a crucial set of rules and conventions governing
    data exchange between devices within a communication network.

    * Addressing assigns unique identifiers to devices, ensuring accurate data delivery
    to the intended recipients. Error detection and correction mechanisms identify
    and rectify transmission errors, enhancing data integrity.

    * Flow control regulates data flow between devices to prevent overwhelming receivers
    and avoid congestion.

    * Computer networks communicate using protocols, which define the procedures that
    the systems involved in the communications will use.

    * Line discipline coordinates hop-to-hop data delivery where a hop is a computer,
    a network controller, or some type of network-connecting device, such as a router.

    * Line discipline is coordinating half-duplex transmission on a data communications
    network. The two fundamental ways that the line discipline is accomplished in
    a data communications network are enquiry/acknowledgement (ENQ/ACK) and poll/select.

    * Flow control defines a set of procedures that tells the transmitting station
    how much data it can send before it must stop transmitting and wait for an acknowledgement
    from the destination station.'
  merge: -1
  img_proc: true
