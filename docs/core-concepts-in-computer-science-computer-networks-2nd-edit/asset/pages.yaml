- pgno: 112
  md: '# CORE CONCEPT: TRANSMISSION IMPAIRMENTS


    Transmission impairment occurs when the received signal is different from the
    transmitted signal. As we know, a signal can be transmitted as Analog signal or
    it can be transmitted as a digital signal. In Analog signals due to transmission
    impairment the resulting received signal gets different amplitude or the shape.
    In the case of digitally transmitted signals at the receiver side we get changes
    in bits (0''s or 1''s).


    In communication system, analog signals travel through transmission media, which
    tends to deteriorate the quality of analog signal. This imperfection causes signal
    impairment. This means that received signal is not same as the signal that was
    sent.


    ![](img/f7819d05465fc14719b3ebbba980271a_112_0.png)


    There are various kinds of transmission impairments in network while transferring
    data and information through network. Types of transmission impairments:


    +   - Attenuation: Attenuation means a loss of energy. The strength of a signal
    falls off with distance over any transmission medium. For guided media, this reduction
    in strength, or attenuation, is generally logarithmic and is thus typically expressed
    as a constant number of decibels per unit distance. In g. shows the effect of
    attenuation and amplification.


    ![](img/f7819d05465fc14719b3ebbba980271a_112_1.png)


    For unguided media, attenuation is a more complex function of distance and of
    the makeup of the atmosphere. Attenuation introduces three considerations for
    the transmission engineer. First, a received signal must have sufficient strength
    so that'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Core Concepts in Computer Science: Computer Networks


    the electronic circuitry in the receiver can detect and interpret the signal.
    Second, the signal must maintain a level sufficiently higher than noise to be
    received without error. Third, attenuation is an increasing function of frequency.


    +   - Distortion: Distortion means that the signal changes its form or shape.
    Delay distortion is a phenomenon peculiar to guarded transmission media. The distortion
    is caused by the fact that the velocity of propagation of a signal through a guided
    medium varies with frequency. For a band limited signal, the velocity tends to
    be highest near the center frequency and lower towards the two edges of the band.
    Thus, various frequency components of a signal will arrive at the receiver at
    different times. This effect is referred to as delay distortion, as the received
    signal is distorted due to delay in its components. The distortion effect as shown
    in the following figure:


    Frequency is the number of occurrences of a repeating event unit of time. It is
    also referred to as temporal frequency, which emphasizes the contrast to spatial
    frequency and angular frequency.


    ![](img/f7819d05465fc14719b3ebbba980271a_113_0.png)


    Delay distortion is particularly critical for digital data. Consider that a sequence
    of bits is being transmitted, using either analog or digital signals. Because
    of delay distortion, some of the signal components of one bit position will spill
    over into other positions, causing inter symbol interference, which is a major
    limitation to maximum bit rate over a transmission control. Equalizing techniques
    can also be used for delay distortion.


    +   - Noise: Noise refers to any unwanted signal. For any data transmission event,
    the received signal will consist of the transmitted signal, modified by the various
    distortions imposed by the transmission system, plus additional unwanted signals
    that are inserted somewhere between transmission and reception; the latter, undesired
    signals are referred to as noise-a-major limiting factor in communications system
    performance.'
  merge: -1
  img_proc: true
