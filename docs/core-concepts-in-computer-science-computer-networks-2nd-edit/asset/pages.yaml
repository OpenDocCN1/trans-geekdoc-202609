  md: '# Security Requirements—WiFi—Threats


    The 802.11 WLAN—or WiFi—industry is burgeoning and currently has significant momentum.
    All indications suggest that in the coming years numerous organizations will deploy
    802.11 WLAN technology. Many organizations—including retail stores, hospitals,
    airports, and business enterprises—plan to capitalize on the benefits of “going
    wireless.” However, although there has been tremendous growth and success, everything
    relative to 802.11 WLANs has not been positive. There have been numerous reports
    and papers describing attacks on 802.11 wireless networks that expose organizations
    to security risks.


    Figure 7 provides a general taxonomy of security attacks to help organizations
    and users understand some of the attacks against WLANs.


    ![](img/f7819d05465fc14719b3ebbba980271a_231_0.png)


    Figure 7: Taxonomy of Security Attacks.


    Network security attacks are typically divided into passive and active attacks.
    These two broad classes are then subdivided into other types of attacks. All are
    defined below.


    +   - Passive Attack: An attack in which an unauthorized party gains access to
    an asset and does not modify its content (i.e., eavesdropping). Passive attacks
    can be either eavesdropping or traffic analysis (sometimes called traffic flow
    analysis). These two passive attacks are described below.


    +   - Eavesdropping: The attacker monitors transmissions for message content.
    An example of this attack is a person listening to the transmissions on a LAN
    between two workstations or tuning into transmissions between a wireless handset
    and a base station.


    Traffic analysis: The attacker, in a more subtle way, gains intelligence by monitoring
    the transmissions for patterns of communication. A considerable amount of information
    is contained in the flow of messages between communicating parties.


    +   - Active Attack: An attack whereby an unauthorized party makes modifications
    to a message, data stream, or file. It is possible to detect this type of attack'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'but it may not be preventable. Active attacks may take the form of one of four
    types (or combination thereof): masquerading, replay, message modification, denial-of-service
    (DoS). These attacks are defined below.


    +   - Masquerading: The attacker impersonates an authorized user and gains certain
    unauthorized privileges.


    +   - Replay: The attacker monitors transmissions (passive attack) and retransmits
    messages as the legitimate user.


    +   - Message modification: The attacker alters a legitimate message by deleting,
    adding to, changing, or reordering it.


    +   - Denial-of-service: The attacker prevents or prohibits the normal use or
    management of communications facilities.


    The risks associated with 802.11 are the result of one or more of these attacks.
    The consequences of these attacks are, but not limited to, loss of proprietary
    information, legal and recovery costs, tarnished image, and loss of network service.


    # Loss of Confidentiality


    Confidentiality is the property with which information is not made or disclosed
    to unauthorized individuals, entities, or processes. This is, in general, a fundamental
    security requirement for most organizations. Due to the broadcast and radio nature
    of wireless technology, confidentiality is a more difficult security requirement
    to meet in a wireless network. Adversaries do not have to tap into a network cable
    to access network resources. Moreover, it may not be possible to control the distance
    over which the transmission occurs. This makes traditional physical security countermeasures
    less effective.


    Passive eavesdropping of native 802.11 wireless communications may cause significant
    risk to an organization. An adversary may be able to listen in and obtain sensitive
    information including proprietary information, network IDs and passwords, and
    configuration data. This risk is present because the 802.11 signals travel outside
    the building perimeter or there may be an “insider.” Because of the extended range
    of 802.11 broadcasts, adversaries can potentially detect transmission from a parking
    lot or nearby roads. Through the use of a wireless network analyzer tool or sniffer,
    is particularly easy for two reasons: 1) frequently authentication features of
    WLAN technology are not even enabled, and 2) because of the numerous vulnerabilities
    in the 802.11 technology security.


    Wireless packet analyzers, such as AirSort and WEPrack, are tools that are readily
