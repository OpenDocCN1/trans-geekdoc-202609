    # TCP over Wireless Links


    TCP assumes that packet losses mostly occur due to congestion. TCP reacts to congestion
    by decreasing its congestion window thus reducing network utilization. In wireless
    networks, however, losses may occur due to the high bit-rate of the transmission
    medium or due Lo fading and mobility. TCP still reacts to losses according to
    its congestion control scheme, unnecessarily reducing the network utilization.


    This model can represent both local area networks (WLANs) such as 802.11 networks
    and wide area networks (WWANs) such as CDMA and GPRS networks. In ad hoc networks
    on the other hand, there is required infrastructure (such as base stations (BSSs)),
    and nodes can organize themselves to establish communication routes. Satellite
    networks allow various configurations with potentially wireless hops. We mostly
    examine the configuration where the wireless link is the last hop, though we also
    classify approaches where this is not necessarily the case.


    Wireless local area networks (WLANs) are wireless computer network that links
    two or more devices using wireless communication within a limited area such as
    a home, school, computer building.


    # Characteristics of Wireless Media


    A number of inherent characteristics of wireless media affect TCP performance
    including:


    Channel Losses: Signals carried by wireless media are subject to significant interference
    from other signals, and subsequently, losses due to modification of bits while
    frames are being transmitted. These losses are difficult to recover from the link
    layer despite the presence of error correction techniques and typically require
    retransmission. Retransmission can be performed at the link layer or at the transport
    layer'
