- - '###'
  - 其他工作。这些工作是跨设备联邦学习设置下超参数调优最新且最相关的工作，但存在其他间接相关的工作，我们简要介绍一下它们。其中一项工作是论文《用于联邦学习的大规模训练（On
    Large-Cohort Training for Federated Learning）[6]，探索每轮采样的客户端数量如何影响联邦学习，但完全忽略了资源效率部分。《基于超参数聚类的电负预测联邦学习（Federated
    Learning with Hyperparameter-based Clustering for Electrical Load Forecasting）[11]是另一篇尝试预测电力负载的论文，但没有讨论资源异构性的挑战。“表示匹配和自适应超参数的鲁棒联邦学习（Robust
    Federated Learning through Representation Matching and Adaptive Hyperparameters）[27]使用REINFORCE算法[34]进行在线超参数调优，这具有非常昂贵的探索/利用阶段，而工作通过汤普采样的联邦贝叶斯优化（Federated
    Bayesian Optimization via Thompson Sampling）[8]在设备上使用贝叶斯优化，这也是昂贵的。总之，在联邦学习超参数优化方面有一些工作，但很少作者深入讨论过资源成本对联邦学习的影响。
