    # 2020年无线与光学技术全球会议 (GCWOT)


    ## 基于深度学习的水下图像中挪波虾穴的自动检测


    Atif Naseer

    Enrique Navo Barro

    Sultan Daud Khan

    Yolanda Vila Gordillo

    ETSI Telecomunicaciones

    ETSI Telecomunicaciones

    计算机科学系

    Español de Oceanografía

    马拉加大学

    马德里大学

    国家技术大学

    加迪斯海洋中心

    西班牙，马拉加

    西班牙，马德里

    巴基斯坦，伊斯兰堡

    西班牙，加迪斯

    atif@uma.es

    en@um.es

    sultandaud@nutech.edu

    yolanda.vila@leo.es


    **摘要—** 科学家使用高清摄像头的水下作业器高效、准确地捕捉水下视频。加迪斯湾挪波虾（Nephrops）穴的丰富程度基于对它们水下栖息穴的计数。海洋研究所（IEO）每年进行一次水下调查，以估计深海挪波虾密度，标准误差小于20%。目前，挪波虾穴的识别和计数是人工完成的，这非常枯燥且耗时。计算机视觉和深度学习可以帮助在目标的检测和分类上节省数日。


    浑浊度或物种的运动使其成为一项挑战 [2]。两个主要因素增加了难度：不受限制的自然环境以及内容的变化，这些变化可能源于照明、比例和非刚性变形 [3]。


    挪波虾（*Nephrops norvegicus*）是欧洲主要的海洋甲壳类动物之一 [4]。加迪斯湾挪波虾的年产量虽小于大西洋挪波虾种群（2008年约为100吨），但对船队具有很高的价值
    [5]。图1显示了一个挪波虾个体。该物种占据了深度200米到700米的沙质底部 [6]，那里的沉积物适合它们构筑洞穴。


    所提出的系统引入了一种基于深度学习的方法来分类挪波虾穴。该工作使用Faster RCNN模型、Inception2和MobileNet v2进行目标检测和分类。通过测试使用不同数量的训练图像来评估所提性能。RCNN的平均平均精度超过75%，而MobileNet为64%。结果显示了Faster和MobileNet的检测情况，以及对未检测到穴的真阳性和假阳性检测分类。


    **关键词—** Faster RCNN，计算机视觉，*Nephrops norvegicus* 种群评估，水下视频分类。


    # I. 引言


    水下分析的研究非常广泛，其在不同领域具有巨大的应用价值，例如水下生物多样性和底部地貌、管道和电缆网络、矿产开采，以及动植物识别，其中珊瑚检测和礁石分类问题是水下图像分析中最热门的任务。然而，环境特征如底物颜色变化和


    ![](img/acedced6c476f64daa3e1d6423072c81_0_0.png)


    挪波虾穴通常有多个通往不同隧道的开口，这些隧道相互相通，被称为挪波虾穴系统。一个经过评估的个体占据一个洞穴系统 [7]。洞穴显示出与图2所示的挪波虾相似的各种特征，并可以总结为：


    图1. 挪波虾穴特征


    1) 至少有一个洞穴呈特殊的半月形。

    2) 有其他排出的沉积物证据，通常在隧道开口处呈宽的“扇形”，且足迹通常清晰。

    3) 所有开口洞穴的中心都有一个凸起结构。

    4) 可能存在挪波虾（在洞穴内或外）。


    人工智能（AI）和计算机视觉（CV）的进步有助于海洋物种的分类和检测。在检测和分类挪波虾穴方面，CV和AI起着至关重要的作用，因为它改进了分类和检测。我们利用最先进的RCNN深度学习算法来识别加迪斯湾海底视频中的挪波虾。这项工作的目标是使用深度学习模型来检测、计数和分类挪波虾穴，并使用先进的Faster
    RCNN模型进行目标检测和分类。


    ![](img/acedced6c476f64daa3e1d6423072c81_1_0.png)


    论文的其余部分如下：数据描述在第2节讨论。研究方法在第3节进行说明。实验细节和结果在第4节讨论。最后，结论在第6节。


    图2. 挪波虾穴特征


    # II. 数据描述


    用于监测挪波虾种群丰富性的水下遥测（UTW）系统于90年代初在苏格兰领先。利用UTW系统开发挪波虾可以识别并量化挪波虾区域的穴密度，这可以作为种群指数 [5]。自2016年以来，使用挪UTW系统的种群数量增加，预计将对18处挪波虾进行调查。


    # A. 水下环境


    与其他数据相比，水下数据面临许多挑战。由于光线穿过水层时表现不利，它无法吸收或反射海面，导致图像产生模糊效果。由于采集的数据量巨大，图像设备设计为低分辨率。此外，散射和不均匀的光线使得环境数据采集更具挑战性，因为目标是尽可能接近洞穴。可见度是水下环境中的关注点。当前的洋流是另一个导致浑浊的因素。


    西班牙地理研究所自2014年以来一直进行UTW调查。这些专注于加迪斯湾挪波虾的合适栖息地。配备高品质摄像头的拖曳在船上移动并录制10分钟的视频。目前，挪波虾穴通过水下视频进行计数。每段视频都由专家人工审核，这使得这项工作耗时且耗费大量人力资源。目前没有系统可以帮助解决挪波虾人工检测和计数的问题。


    # B. 研究区域和数据收集


    研究区域位于西班牙南部的加迪斯湾。这项工作是在于2018年6月2日至14期间进行的ISUNPECA_0618 UTW调查期间获得的。调查设计遵循随机等距网格，设有4个采样点。位点深度在0到650米之间，覆盖了300平方公里的区域。图3显示了加迪斯湾地图，以及2018年位于ISUNPECA_0618的站点，使用计数法测量挪波虾穴密度。


    Durden等人 [2008] 证明，即使对于高底栖生物也无法获得100%的准确率。挪波虾穴的数量会变化，因为它取决于疲劳、压力和其他因素。这些变化导致了错误的分类和检测，这是海洋生态采样的中的一个瓶颈
    [9]。目标检测对于研究领域来说非常新，挑战使得该任务与其他目标检测和分类不同。水下图像分析有许多名称，例如水下目标识别 [10]海底识别 [11] 以及水下图像处理或视觉内容识别
    [12]。


    视频使用4k高清（UHD）相机（索尼 HandyCam HDR-XR33AX）录制，配有蔡司/Var-Smart2.8mm及10倍光学变焦。相机安装在侧面顶部，与海底成45度角。使用了具有光质良好的四个独立强度控制光点的视频。设备还带有两个间距7厘米的激光固定在视野内，使用3V
    & 2400 mAh（480瓦）电池为整个设备供电。使用HiPAM传输器跟踪每条轨迹的拖曳位置。


    '
