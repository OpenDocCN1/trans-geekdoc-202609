    ## B. 模型训练


    为了训练模型，我们使用了卷积神经网络（CNN）。我们没有训练自己的网络，而是使用迁移学习 [13] 来保留 TensorFlow 中的 Faster R-CNN
    Inception V2 模型 [14] 和 MobileNet V2 模型 [15]。我们在配备有 NVIDIA TitanX GPU 的 Linux 机器上进行了模型训练和验证。来自加迪斯（Cadet）数据集被用于训练。图像标注以
    XML 格式转换为 TensorFlow (TF) 记录，记录在模型中用于训练。配置使用的参数为：Inception-model：类别数 2（用于空虾和背景），MobileNet：类别数
    = 2（将空虾作为背景）以及 L.2 正则化：模型训练了 80k 步。


    一种方法的实用性取决于检测空虾的准确性。为此目的，精确率（Precision，P，称为正预测值）和召回率（Recall，R，也称为敏感性或真阳性率）是接收者工作特征曲线（ROC）方法中的指标，它们使用公式
    1 和 2 计算：


    $$$P = \frac{TP}{TP + FP}$$


    $$$R = \frac{TP}{TP + FN}$$


    其中 TP、FP 和 FN 分别表示真阳性、假阳性和假阴性的数量。真阳性是指模型正确检测到了空虾，而假阳性意味着检测到的空虾未被海洋生物学家标注，假阴性则意味着被标注的空虾未被模型检测到。此处不考虑真阴性（TN）情况，因为这会产生不一定重叠的边界框。


    精确率的严谨程度取决于模型识别空虾存在的严谨程度，而召回率是模型检测到的总正性中真阳性的比例 [17]。当模型识别空虾的存在时，精确率可以非常严谨，召回率是模型检测到的总正性中
    TP 的比例。为了量化空虾检测性能，我们使用公式 3 定义了精确率-召回率（PR）曲线：


