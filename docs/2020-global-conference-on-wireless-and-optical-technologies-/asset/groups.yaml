    ## B. Model Training


    To train a model we used Convolutional Neural Network (CNN). Instead of train
    our own network, used transfer learning [13] to retain the Faster R-CNN Inception
    V2 model [14] and MobileNet V2 [15] model in TensorFlow. We used the model training,
    validation and on a Linux machine with an NVIDIA TitanX GPU. From Cadet dataset
    were used for training. The image annotations are in XML format to Tensorflow
    (TF), records which were in the model for training. Parameters used for the configuration:
    a Incep-odel: classes2(for Nephrops and asack), MobileNet: number of classes =
    2 (for Nephrops as background) and L.2 regularization: model trained with 80k
    steps.


    The utility of a method depends on how accurately the detected Nephrows. For this
    purpose, the precision (P), called positive predictive value, and recall (R),
    also known as sensitivity or true positive rate, indicators in Receiver Receiver
    Operating Characteristics (ROC) methodology, which were calculated using the Equations
    1 and 2:


    $$$P = \frac{TP}{TP + FP}$$


    $$$R = \frac{TP}{TP + FN}$$


    where TP, FP and FN means number of true, false positives and false negatives.
    A true positive that a Nephrows was correctly detected by the model, whereas a
    false positive means that detected Nephrow was not annotated by marine biologist
    and a false negative means that an annotated Nephrows was not detected by the
    model. The true negative (TN) case is not considered here as it would make bounding
    bounds which are not necessarily overlapping.


    Precision can be as rigorous as the model is to identify the presence of Nephrows,
    and recall is the rate of TP over total positives detected by the model. [17].
    When recall increases, precision deases and variance, so precision recall curves
    (PR) are useful tools to understand model behaviour. To quantify the accuracy
    of the model with a single, mean average precision (mAP), defined in Equation
    3:


    $$$mAP = \int P(R)dR.$$$


    In our problem, ground truth annotation and model are rectangles which usually
    don''t fit. In this paper, it''s considered TP if both areas overlap more than
    50%. This is calculated by Jaccard index, defined in Equation 4:


    $$$J(A, B) = \frac{|A \cap B|}{|A \cup B|}$$$$


    where A and B are the set of pixels in truth annotation and model finding, respectively,
    and |-means the number of pixels in the set. If $J \geq 0.5$, a TP is detected,
    but if detection fails with FN. Using this methodology, P and R values are evaluated
    and mAP is used as a single measure of the goodness of the model. This parameter
    is named as $mAP50$, but we used $mAP$ for simplicity in.


