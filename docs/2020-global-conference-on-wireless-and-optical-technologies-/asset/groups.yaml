    The advancement of Artificial Intelligence (AI) and Computer Vision (CV) helps
    in the classification and detection of marine species. To detect and classify
    Nephrows burrow, CV and AI play a vital role as it improves classification and
    detection. We investigate these using state of the art RCNN deep learning algorithms
    to identify the Nephrows in seafloor footage of the Gulf of Cadiz. The objective
    of this work is to use a deep learning model to detect, count and classify the
    Nephrows burrow which is using state of the art Faster RCNN models for object
    detection and classification.


    ![](img/acedced6c476f64daa3e1d6423072c81_1_0.png)


    The rest of the paper is as follows. Data description is discussed in Section
