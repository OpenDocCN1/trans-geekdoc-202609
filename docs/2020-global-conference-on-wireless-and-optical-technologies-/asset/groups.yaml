    Fig. 2. Nephrows burrows features


    # II. DATA DESCRIPTION


    Underwater Telemetry (UTW) systems to monitor the abundance of Nephrows populations
    were pioneered in Scotland in the early 90s. The development of Norway lobster
    using UUTW systems allows identification and quantification of burrow density
    over the area of Nephrows which can be used as an index of the stock [5]. Then,
    the number of stocks with Norway UUTW systems has increased since 2016 and more
    than 18 Nephrows are expected to have surveys.


    # A. Underwater Environment


    The underwater data has many challenges compared to other data. As light and water
    are not a good friend when light passes through the water, it cannot absorb or
    reflect the sea surface which makes the images or a blurring effect. The image
    devices are designed with low resolution because of the huge amount of data collection.
    Also, there is scattering and non-uniform light which make the environment more
    challenges for data collection because the ultimate is as close as reach to collect
    the burrow. The visibility is a concern in underwater environment. The current
    ocean is another factor which can cause turbidity intensity.


    El Instituto Geográfico de España carries out UTW surveys since 2014. These surveys
    are focused on suitable habitats for Nephrows in the Gulf of Cadiz (Spain). A
    sledge equipped with high quality cameras was travelled on the boat with video
    footage of 10 minutes. Currently, Nephrows burrows are counted from underwater
    videos. Each footage is manually reviewed by experts in underwater mission and
    concludes that this exercise is time consuming and cost of lots of human resources.
    There is no system available that can help in solving the problem of manual detection
    and counting of Nephrows burrows.


    # B. Study Area and Data Collection


    Study area is located in the Gulf of Cadiz to the south of Spain. This work was
    obtained during ISUNPECA_0618 UTW survey conducted between 2nd and 14th June of
    2018. The design of the survey followed a randomized isometric grid with 4 n sampling.
    The spots were placed ranged from 0 to 650 m depth and covered an area of 300
    km. Fig. 3 shows the map of Gulf of Cadiz with station located in 2018 in ISUNPECA_0618
    Nephrows burrow density using the counting method.


    Durden et al. [2008] proved that even for highly benthic objects do not obtain
    100% accuracy. The number of Nephrows burrows varies as it depends on certain
    factors like tiredness, stress and other changes. These changes result in wrong
    classification and detections which is one of the bottlenecks in marine ecological
    sampling [9]. Object detection is very new for the research community challenges
    make the tasks different from other object detection and classification. The analysis
    of underwater images is given names, for instance, underwater object recognition
    [10], seafloor recognition [11] and underwater image processing or visual content
    recognition [12].


    Videos were recorded with a 4k Full HD (UHD) camera (SONY HandyCam HDR-XR33AX)
    using lenses of Zeiss®/Var-Smart with 2.8mm and optical zoom 10x. Camera is mounted
    on the top of the side with an angle of 45 degrees to the seafloor. The video
    with good light quality four spots with independent intensity control is used.
    The equipment has also two laser separated by 7 cm fixed to the field of view
    with battery of 3 V & 2400 mAh(480 Watt) to support the power of the whole. HiPAM
    transporter has been used to track the sledge position for each track.'
