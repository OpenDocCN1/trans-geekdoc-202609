    # 2020 Global Conference on Wireless and Optical Technologies (GCWOT)


    ## Automatic Detection of Nephrops norvegicus Burrows in Underwater Images Using
    Deep Learning


    Atif Naseer

    Enrique Navo Barro

    Sultan Daud Khan

    Yolanda Vila Gordillo

    ETSI Telecomunicaciones

    ETSI Telecomunicaciones

    Department of Computer Science

    Español de Oceanografía

    Universidad de Málaga

    Universidad de Madrid

    National University of Technology

    Centro Oceanográfico de Cádiz

    Malaga, Spain

    Madrid, Spain

    Islamabad, Pakistan

    Cádiz, Spain

    atif@uma.es

    en@um.es

    sultandaud@nutech.edu

    yolanda.vila@leo.es


    **Abstract—** Underwater Operated Vehicles with HD cameras are used by the scientist
    to capture the underwater footages efficiently and accurately. The abundance of
    Nephrops burrows in the Gulf of Cádiz is based on the counting of the burrows
    where they live underwater. The Instituto de Oceanografía (IEO) conducts an annual
    underwater survey to estimate the density of Nephrops in depth with a standard
    error of less than 20%. Currently, the identification and counting of Nephrops
    burrows are carried out manually, which is quite tedious and time consuming. Computer
    Vision and Deep Learning can help save days in detection and classification of
    objects.


    The turbidity or movement of species make it a challenge [2]. Two main factors
    make it difficult: the unrestricted natural environment and variations of the
    content which may arise from illumination, scales, and non-rigid deformations
    [3].


    The Norway lobster, *Nephrops norvegicus* is one of the main marine crustaceans
    exploited in Europe [4]. Annual catches of Nephrops in the Gulf of Cádiz are small
    compared with Atlantic Nephrops stocks (≈100 t in 2008) but have valuable revenues
    for the fleet [5]. Fig. 1 shows an individual of *Nephrops*. This species occupies
    sandy-bottom from 200 m to 700 m of depth [6], where sediment is suitable to construct
    their burrows.


    The proposed system introduces a deep learning based method to classify Nephrops
    burrows. The proposed work is using the Faster RCNN models Inception2 and MobileNet
    v2 for object detection and classification. Testing is used to evaluate the proposed
    performance with different numbers of training images. The average mean precision
    of RCNN is more than 75% compared to MobileNet which is 64%. The results show
    that Faster and MobileNet detections, as well as the classification of True and
    False Positive detections with undetected burrows.


    **Keywords—** Faster RCNN, Computer Vision, *Nephrops norvegicus* stock assessment,
    Underwater Videos Classification.


    # I. INTRODUCTION


    Research in underwater analysis is vast and has a worth to its enormous applications
    in different disciplines, for instance, underwater biodiversity and bottom morphology,
    pipelines and cable networks, minerals mining, and for fauna and flora recognition,
    detection of corals and reef classification problems are the most popular tasks
    of underwater image analysis. However, the environment features such as de-bather
    color variations and


    ![](img/acedced6c476f64daa3e1d6423072c81_0_0.png)


    *Nephrops* burrows typically have multiple openings to different tunnels communicated
    with each other are named as *Nephrops* burrow systems. An individual assessed
    occupies a burrow system [7]. Burrows show different features that are as similar
    to *Nephrops* as shown in Fig. 2 and they can be summarized in:


    Fig. 1. Nephrops norvegicus


    1) At least one burrow is particularly half-moon shape.

    2) There is other proof of expelled sediment, typically in a wide-like ''fan''
    at the tunnel opening, and tracks are frequently clear.

    3) The center of all the opening burrows has a raised structure.

    4) Nephrows may be present (either in or out of burrow).


    The advancement of Artificial Intelligence (AI) and Computer Vision (CV) helps
    in the classification and detection of marine species. To detect and classify
    Nephrops burrow, CV and AI play a vital role as it improves classification and
    detection. We investigate these using state of the art RCNN deep learning algorithms
    to identify the Nephrops in seafloor footage of the Gulf of Cádiz. The objective
    of this work is to use a deep learning model to detect, count and classify the
    Nephrops burrow which is using state of the art Faster RCNN models for object
    detection and classification.


    ![](img/acedced6c476f64daa3e1d6423072c81_1_0.png)


    The rest of the paper is as follows. Data description is discussed in Section
    2. The Research methodology is explained throughout in Section 3. The details
    of the experiments and results are discussed in Section 4. Finally, the conclusion
    is in Section 6.


    Fig. 2. Nephrows burrows features


    # II. DATA DESCRIPTION


    Underwater Telemetry (UTW) systems to monitor the abundance of Nephrows populations
    were pioneered in Scotland in the early 90s. The development of Norway lobster
    using UTW systems allows identification and quantification of burrow density over
    the area of Nephrows which can be used as an index of the stock [5]. Then, the
    number of stocks with Norway UTW systems has increased since 2016 and more than
    18 Nephrows are expected to have surveys.


    # A. Underwater Environment


    The underwater data has many challenges compared to other data. As light and water
    are not a good friend when light passes through the water, it cannot absorb or
    reflect the sea surface which makes the images have a blurring effect. The image
    devices are designed with low resolution because of the huge amount of data collection.
    Also, there is scattering and non-uniform light which make the environment more
    challenges for data collection because the ultimate is as close as reach the burrow.
    The visibility is a concern in underwater environment. The current ocean is another
    factor which can cause turbidity.


    El Instituto Geográfico de España carries out UTW surveys since 2014. These surveys
    are focused on suitable habitats for Nephrows in the Gulf of Cádiz. A sledge equipped
    with high quality cameras travelled on the boat with video footage of 10 minutes.
    Currently, Nephrows burrows are counted from underwater videos. Each footage is
    manually reviewed by experts and concludes this exercise is time consuming and
    costs lots of human resources. There is no system available that can help in solving
    the problem of manual detection and counting of Nephrows.


    # B. Study Area and Data Collection


    Study area is located in the Gulf of Cádiz to the south of Spain. This work was
    obtained during ISUNPECA_0618 UTW survey conducted between 2nd and 14th June of
    2018. The design of the survey followed a randomized isometric grid with 4 sampling.
    The spots were placed ranged from 0 to 650 m depth and covered an area of 300
    km. Fig. 3 shows the map of Gulf of Cádiz with station located in 2018 in ISUNPECA_0618
    Nephrows burrow density using the counting method.


    Durden et al. [2008] proved that even for highly benthic objects not obtain 100%
    accuracy. The number of Nephrows burrows varies as it depends on certain factors
    like tiredness, stress and other changes. These changes result in wrong classification
    and detections which is one of the bottlenecks in marine ecological sampling [9].
    Object detection is very new for the research community challenges make the tasks
    different from other object detection and classification. The analysis of underwater
    images is given names, for instance, underwater object recognition [10], seafloor
    recognition [11] and underwater image processing or visual content recognition
    [12].


    Videos were recorded with a 4k Full HD (UHD) camera (SONY HandyCam HDR-XR33AX)
    using lenses of Zeiss/Var-Smart with 2.8mm and optical zoom 10x. Camera is mounted
    on the top of the side with an angle of 45 degrees to the seafloor. The video
    with good light quality four spots with independent intensity control is used.
    The equipment has also two laser separated by 7 cm fixed to the field of view
    with battery of 3 V & 2400 mAh(480 Watt) to support the power of the whole. HiPAM
    transporter has been used to track the sledge position for each track.

