    # C. Data Characteristics


    Each image has resolution of 3840 x 2160 pixels. Some of the frames are very low
    quality and poor visibility, those frames are discarded. The data are in jpeg
    format.


    # III. RESEARCH METHODOLOGY


    # A. Data Preparation


    +   1) Data Collection: The videos are recorded at 25 frames per second in good
    lighting condition. Video footage of 10-12 minutes each has been recorded by stations.
    Of these, only seven stations were selected which have optimal lighting condition,
    less noise, contrast and high density of Nephrops burrows. The data from seven
    stations are considered for annotations. Each video is 25 frames per second and
    10-12 minutes in length. A total of 105,000 frames were recorded from different
    stations of 2018 data survey.

    2) Preprocessing: The data collected from Cadiz is converted into rotated frames.
    Frames with low lightening and poor quality are discarded, while the frames with
    the same information is not included in dataset. Most of the images do not contain
    any Nephrops information during annotation phase.

    3) Image Annotation: In this phase the data is annotated to record the ground
    truth annotations. Initially, the experts from Nephrops burrows de IEO manually
    record the burrows. Then, the images are labeled manually in Microsoft VOTT image
    annotation tool [19]. The saved XML file names contain class name (Nephrops),
    and bounding boxes of each image. Fig.4 shows an example from ISUNEPCA_0618 UWWT
    survey which is manually annotated using Microsoft VOTT. The annotated images
    are used by the experts from IEO to record the ground truth annotated images of
    each station from ISUNEPCA_0618 UWWT survey which is that used in the model


    ![](img/acedced6c476f64daa3e1d6423072c81_2_1.png)


    training and testing. A total of seven stations are annotated and recorded 266
    annotated images. Table I shows the ground truth images of each station from Cadiz
