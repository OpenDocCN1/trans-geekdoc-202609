    mean there is a corresponding other half sitting somewhere else.

    What you have when you own a bitcoin is the collective agreement of every other
    computer on the bitcoin network that your bitcoin was legitimately created by
    a bitcoin “miner,” and then passed on to you through a series of legitimate transactions.
    If you want to actually own some bitcoin, there are exactly two options: either
    become a miner (which involves investing a lot of money in computers and electricity
    bills—probably more than the value of the bitcoin you''ll actually make, unless
    you''re very smart), or simply buy some bitcoin from someone else using conventional
    money, typically through a bitcoin exchange such as Coinbase or Bitfinex.


    A lot of the quirks of the cryptocurrency come down to the collective agreement
    about what constitutes “legitimacy.” For instance, the first bitcoin was created
    in 2009, the total number in existence has been growing slowly, at a declining
    rate, ensuring that at some point around 2140, the 21 million bitcoin will be
    mined, and no more will ever be created.


    If you disagree with that collective agreement, there''s nothing stopping you
    from splitting with the wider network and creating your own version of bitcoin.
    This is what''s known as a “Fork,” and it''s already happened multiple times in
    the past (that''s what competitors such as Litecoin and Dogecoin are). The difficulty
    is persuading other people to follow you. A currency used by just one person isn''t
    much of a currency.


    # What Can I Actually Do with Cryptocurrencies?


    In theory, almost anything that can be done with a computer could, in some way,
    may be rebuilt on a cryptocurrency-based platform. Building a cryptocurrency involves
    turning a worldwide network of computers into a decentralised platform for data
    storage and processing—in effect, a giant hive-mind PC (that this no longer sounds
    like it has much to do with “cryptrencies”) is part of the reason some instead
    suggest the name “decentralised apps” to cover this sector.


    We''ve already seen proposals for YouTube clones, collective


    # Cryptocurrencies and Blockchain Technology


    card games and digital advertising exchanges built on top of cryptocurrencies:
    “x but on the blockchain” is the new startup pitch du jour, now that “Uber for
    x” and “x but on the iPhone” are passé. There’s already Dentacoin (Yelp for Dentists
    but on the blockchain), Matchpool (Tinder but on the blockchain) and even Cryptokitties
    (Tamagotchis but on the blockchain).


    In practice, however, the available uses are rather more limited. Bitcoin can
    be used as a payment system for a few online transactions, and even fewer real-world
    ones, while other cryptocurrencies are even more juvenile than that. The excitement
    about the field is focused more on what it could become than what it actually
    is.


    # Why Does It Matter That It’s Decentralised?


    At their heart, cryptocurrencies are basically just fancy databases. Bitcoin,
    for instance, is a big database of who owns bitcoin, and what transactions were
    made between those owners.


    In its own way, that’s little different from a conventional bank, which is basically
    just a big database of who owns pounds, and what transactions were made between
    those owners.


    But the distinction with bitcoin is that no central authority runs that big fancy
    database. Your bank can unilaterally edit its database whenever it wants and it
    does so often. Sometimes that’s to your advantage (if your debit card gets stolen
    and used, for instance, your bank will just return the money) and sometimes it’s
    not (if your bank thinks you’re money laundering, it will freeze your account,
    potentially crippling your business).


    With bitcoin, no one can do either of those. The only authority on the network
    is whatever the majority of users agree on, and in practice that means nothing
    more than the basic rules of the network are ever enforced.


    # Is This All About Crime?


    It is a lot about crime. The flip side of cryptocurrencies being decentralised
    is that for most people, most of the time, there’s no downside to a centralised
    database. If you trust the financial system to store your funds, or Dropbox to
    store your files, or YouTube to host your videos, then you don''t need to use
    less efficient decentralised versions of those services.


    But if you are planning to commit financial crime, store illegal downloads, or
    host pirated videos a decentralised version of those services becomes much more
    appealing. That’s why bitcoin, for instance, has become the currency of choice
    for online drug dealers and criminals demanding ransoms to restore hacked data.


    “Crime” is a broad term. In many countries, having a political opinion contrary
    to that of the ruling regime is considered broadly criminal; many more limit the
    freedom of their citizens in ways that citizens of liberal democracies view as
    unethical and inhumane. If cryptocurrencies allow those limitations to be overcome,
    it may technically be promoting crime, but not in the way cryptocurrency means.


    # You Keep Saying “Blockchain.” What Does That Actually Mean?


    The concept of the blockchain lies at the heart of all cryptocurrencies. It is
    the decentralised historical record of changes in the ownership of the asset,
    be it simply spending a bitcoin or executing a complex “smart contract” in one
    of the second-generation cryptocurrencies such as Ethereum. Whenever a cryptocurrency
    transaction occurs, its details are broadcast throughout the entire network by
    the spending party, ensuring that everyone has an up-to-date record of ownership.
    Periodically, all the recent changes get bundled into one “block,” and added to
    the historical record. And so the “blockchain”—a linked list of all the previous
    blocks—serves the full and complete record of who owns the network.


