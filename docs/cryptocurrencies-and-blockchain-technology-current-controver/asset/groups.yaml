    # Contents


    +   Foreword 11


    +   Introduction 14


    # Chapter 1: Are Blockchain-Powered Cryptocurrencies Better than Hard Money?


    +   Overview: What Can You Make and Trade with Blockchain? 19


    Umed Saidov


    Blockchain is a kind of online public ledger that is secured cryptographically.
    Its application as a currency comes from that security, which proponents suggest
    can take the place of the midlemen that our hard money system requires, like banks.


    # Yes: Cryptocurrencies Are Better than Hard Currency


    +   How Cryptocurrencies Become Real Currency 25


    Brandt Redd


    A currency is defined by three things: scarcity, verifiability, and availability,
    none of which are exclusive to a fiat currency system, meaning backed by a government.
    In fact, in a number of ways, a blockchain-based system can express those qualities
    better.


    +   Blockchain Offers More than a Currency 30


    Michael Crosby, Nachiappan, Pradhan Pattayak, Sanjeev Verma, and Vignesh Kalyananaraman
    Bitcoin is more than a currency; its application of blockchain is a real way to
    change how money is controlled. A number of potential applications like Smart
    Property and Smart Contracts suggest that blockchain can create new ways to secure
    the use of money, automatically performing the function of financial midlemen.


    +   Corruption Is More Difficult with Cryptocurrencies 34


    Enrique Aldaz-Carroll and Eduardo Aldaz-Carroll


    The key to preventing corruption is transparency and accountability, and cryptocurrencies—with
    their ledger of transactions—would make finances more transparent than ever. If
    governments and institutions adopted non-anonymous cryptocurrencies, corruption
    could be curbed considerably.'
  - '[PAGE 7]


    # No: Cryptocurrencies Are Not Better than Hard Currency


    # Who Watches the Blockchain? 37


    Dirk Baur and Niels Van Quaqueeke

    A currency on the blockchain doesn''t take the place of intermediaries, but merely
    replaces them with a system of characteristic and system-based trust. A more complex
    system is not necessarily a more secure one.


    # Bitcoin Is an Investment, Not a Currency 41


    James Surowiecki

    Bitcoin works best as it currently operates: as an investment appendage inside
    the current economy. As a currency, it would be disastrous. Governments would
    be powerless to affect economic change and the financial marketplace would be
    at the mercy of complex formulas.


    # The Blockchain Can Hold Money, but It Can Also Be Hacked 47


    Scott A. Wolla

    Currencies traded on the blockchain may share a number of characteristics with
    hard currencies but, unlike the currencies of most major nations, there is no
    way to protect their value and stability from outside forces.


    # Chapter 2: Is Blockchain Too Risky to Operate on a Mass Scale?


    # Overview: A History of Bitcoin on the Blockchain 55


    Axel Simon

    The first generation of blockchain-powered bitcoin trading involved a variety
    of different currencies being traded by relatively small groups of ambitious investors
    who publicly used the platform''s open-source technology. The second generation
    of currencies has changed to emphasize more currency-like characteristics, such
    as stability, accessibility, and security.'
  - '[PAGE 8]


    # Yes: Blockchain Is Too Risky

    An All-Digital Currency Still Needs a Bank


    Aleksander Berentsen and Fabian Schär


    A stable currency system requires a central bank to maintain its day-to-day stability,
    and no central bank would issue bitcoin on the blockchain. The risk of sanctioning
    illegal use would be too high.


    # Blockchain Is As Good As Gold, and That''s a Problem


    Bruno Skvorc


    The terminology used to describe some of the currencies traded on a blockchain
    is meant to evoke the trade of valuable minerals like gold. But the fix of gold
    is exactly why the industrial world replaced it with fiat currencies that can
    be inflated and deflated by a central bank.


    # The Future of Cryptocurrencies Is Uncertain


    Richard Partington


    Where will cryptocurrencies go from here? Currently, bitcoin and other cryptocurrencies
    are still fairly niche, but because of bitcoin''s meteoric rise in value in late
    2017 and early 2018, many investors are considering giving it a shot. Nonetheless,
    cryptocurrencies are seldom used in real-world settings, and it is likely that
    the value of bitcoin has been artificially inflated, creating a bubble and making
    its future worth difficult to determine.


    # No: Blockchain Is Not That Risky

    Banks Will Come Around


    Michael J. Casey


    The adoption of blockchain-based currencies is not something that will happen
    overnight. Instead, while the banks of some of the world''s largest countries
    may be wary of adopting a currency they can''t directly control, it could be some
    of the world''s non-Western countries—seeking a new and inflation-proof solution
    for managing money—that will be the early adopters who could lead the way.


    # China on the Blockchain


    Patrick Coate


    One non-Western country that has taken to investment on the blockchain is China:
    by 2016, over 90 percent of bitcoin trade was for the Chinese yuan. This presents
    a unique case study of the currency''s effectiveness and proves that some of its
    primary obstacles for widespread use are the keepers of the currencies it could
    replace.'
  - '[PAGE 9]


    #  Chapter 3: Is It Possible to Regulate Cryptocurrencies?


    Overview: The Blockchain Expands 92


    University of Cambridge Research

    By 2017, research shows that at least three million people actively used cryptocurrencies
    of some kind. This suggests that they have become a major monetary force, which
    means new questions have to be asked about how blockchain is used.


    Yes: Cryptocurrencies Can Be Regulated and Can Help Regulate the World 95


    # Blockchain Can End Money Laundering


    Roy Keidar and Netanella Treistman

    Cryptocurrencies like bitcoin have gained a somewhat misguided reputation as a
    favorite of hackers and money launders alike, the tracing mechanisms inherent
    to the ledger function also mean that these transactions must be made public.
    A number of regulatory mechanisms could potentially prevent the ability to trade
    illegally.


    # Wikipedia Is A Model for How Blockchain Can Work 99


    Dirk Baur, Daniel Cahill, and Zhangxin (Frank) Liu

    One of the most used and trusted resources on the internet also operates through
    an open-source ledger: the online encyclopedia Wikipedia. Anyone can edit Wikipedia,
    but because every edit is public, everyone in the system is able to be part of
    regulating its accuracy.


    The History of Blockchain Regulation 102


    Andrew Norry

    The decentralized nature of cryptocurrencies like bitcoin makes it very difficult
    to enforce restrictions. Nonetheless, the history of the currency is full of attempts
    to regulate it, and some of them, like those made in the European Union, have
    been successful.


    No: Cryptocurrencies Are Beyond the Powers of Regulation


    # Bitcoin Is Not Designed for Regulation 109


    David Trilling

    Cryptocurrencies implicitly undermine government authority, enabling everything
    from money laundering by organized criminals'
