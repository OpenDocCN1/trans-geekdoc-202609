    Patrick Coate is a research fellow at the American Institute for Economic Research.


    We have written recently at AIER about how blockchain—and bitcoin, the cryptocurrency
    that is one early and prominent application of blockchain technology—may be important
    to the future of money and exchange. In this article, I discuss how in the past
    few years, the center of gravity of the bitcoin world moved to China and the lessons
    we can draw from the resulting cycle of consolidation and regulation. This may
    have important implications for the future of bitcoin, as well as being a potential
    challenge to the decentralization that is part of the fundamental appeal of cryptocurrencies.


    # Bitcoin Goes to China


    Until a few years ago, almost all bitcoin trading was in dollars. Around the end
    of 2013, the balance began to shift to the Chinese yuan. By 2016, over 90 percent
    of bitcoin trading volume was in yuan, where it remained until early 2017, although
    recent regulations that I will discuss shortly are beginning to reverse this trend.
    Business Insider in January published a striking chart showing the change in bitcoin’s
    trading volume by currency.


    There are two main reasons for this reversal. First, Chinese investors became
    interested in bitcoin, in part because of laws in their country restricting the
    movement of traditional currency. Secondly, there were until recently no trading
    fees on major Chinese exchanges, which means once investors became interested,
    the no-fee structure invited a higher volume of trading. Related


    > “The Evolution of Bitcoin: To China and Beyond?” by Patrick Coate, American
    Institute for Economic Research, March 16, 2017. https://www.aier.org/research/evolution-bitcoin-china-and-beyond.
    Licensed under CC BY 4.0 International.


    to the fee and regulation structure, bitcoin was traded as an asset and subject
    to capital gains taxes in both China and the US, but because bitcoin took off
    earlier in the US, the Internal Revenue Service may have been quicker to monitor
    these transactions than Chinese regulators.


    Why does this matter? It is important because bitcoin is not governed by any central
    bank, its development can be affected by its user base—especially if a large percentage
    of that base is working and making decisions as a unified group. The migration
    of bitcoin trading and creation to China is important not only because Chinese
    investors may have different priorities than Americans, but because a lot of the
    Chinese activity is dominated by a small number of agents, both in the exchange
    and production of new bitcoins.


    The network of computers running bitcoin software uses a blockchain database.
    New “blocks” of transactions are added all the time and are linked to existing
    blocks. Each new block requires a computing power-intensive “proof of work” to
    be accepted by the network. One important feature of bitcoin is that new bitcoins
    are given to users who add these blocks. This is known as bitcoin “mining” and
    is an important way to ensure that the bitcoin network maintains significant computing
    power.


    This system also resists manipulation because it relies on many different computers
    running bitcoin software. Any important changes to the system must be adopted
    by essentially the whole network, which allows, for example, generally accepted
    security patches or updates to be adopted but resists manipulation by individual
    actors. However, this safeguard depends on the breadth of the network.


    According to a June 2016 New York Times article, by April of 2016 over 70 percent
    of bitcoin transactions were going through four Chinese companies. Half of newly
    minted bitcoins were produced by just two mining pools, or groups that pool resources
    and share the successfully mined bitcoins. This creates the potential for market
    power, in which a small group could unilaterally impose


    # Is Blockchain Too Risky to Operate on a Mass Scale?


    changes on the network. In the worst case, this could create a “hard fork,” in
    which competing protocols would create each new blocks recognized as valid by
    a substantial fraction of the bitcoin network. Other users would have to gamble
    on which transactions count, which could cripple bitcoin''s usefulness as a store
    of value or medium of exchange, two essential properties of money.


    This power is more than a theoretical possibility. The Times article also described
    an American delegation that came to China early in 2016 to discuss a bitcoin software
    proposal to alleviate congestion and traction delays. While there was significant
    debate about the merits of the proposal, there was no doubt the Chinese companies
    had the ability to tip the scales by choosing to endorse or reject the proposal.


    This can be a dangerous precedent if the short-term incentives of a mining pool
    are at odds with the overall health of the system. The Times interviewed Bobby
    Lee, an executive of one of the Chinese companies. Although Lee dismissed both
    these concerns and the idea that the major Chinese companies were a single block,
    other observers have warned about this possibility. a recent article on NASDAQ.com
    said, “Bitcoin, the currency, and bitcoin, the system and underlying technology,
    are separate things, as shown by the current emphasis to separate the technology
    that underlies the bitcoin blockchain from the currency. What is good for the
    currency is not necessarily good for the system, and vice versa.” The article
    also quoted a former director of MIT’s Digital Currency Initiative, Brian Forde,
    “as governments and large corporations start to adopt the bitcoin blockchain infrastructure
    around the world, they will have to think through the concentration of bitcoin
    mining that is happening in China, and maybe they will have to put speed in doing
    bitcoin mining in their countries, to start to decentralize even further and increase
    the security.


    It is clear that by 2016, China had become the center of the bitcoin world. However,
    the balance may be shifting away from China, in large part because of the actions
    of China’s own central bank.

