    # Cryptocurrencies and Blockchain Technology


    price has surged by more than 900% in 2017. Bitcoin—created by “miners” who use
    high-powered computers to solve complex mathematical problems—must be stored online
    using a digital wallet, and can be bought or sold using exchanges such as Bitstamp,
    Bithumb and Kraken.


    But as bitcoin hits the stratosphere, there are fears an economic bubble forming
    as it becomes treated less like a currency and more like a store of value, open
    for speculators making ever increasing bets on how far it can go. Central bankers,
    who had to step in when when the subprime mortgage bubble burst, have also warned
    of its dangers.


    Economists have compared bitcoin''s meteoric rise with past bubbles, like the
    tulip mania of the 17th century and the dotcom bubble that began in the late 90s
    with the Nasdaq index in New York and burst in 2000. Both examples foreshadow
    a painful collapse for a currency that has no intrinsic value to those who hold
    it beyond ascribed to it by a community of owners. Should they realise the emperor
    has no clothes on masse, there could be a rude awakening.


    Oliver White at Fathom Financial Consulting wrote that bitcoin “certainly fits
    the criterion” for a bubble asset. Using data stretching back to 2013, Fathom’s
    economists compared the price of bitcoin with its historical average and plotted
    against other mainstream assets—such as shares and bonds. They found the current
    value of bitcoin running at six times its average price since 2013. The cryptocurrency
