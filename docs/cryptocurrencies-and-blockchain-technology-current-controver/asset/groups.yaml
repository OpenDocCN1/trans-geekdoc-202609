    ## 加密货币与区块链技术


    人们要做的是持有它们，因为它们明天会更有价值。这使得人们对用比特币购买物品的兴趣降低，反而更有兴趣将其视为投机性投资——这与你希望它作为交易媒介背道而驰。


    你可能认为，在金本位制运行的时代，黄金也面临同样的供应限制。但黄金的供应并不是固定的。随着人们开采更多的黄金，其供应随之扩大。事实上，存在某种平衡——随着经济增长增加了对黄金的需求，使其变得更有价值，而价格上涨又鼓励了人们去开采，从而将更多黄金引入系统，最终使黄金的美元计价值保持相对稳定。在1800年至1900年间，黄金的美元价值以较小的百分比逐渐上升。相比之下，比特币经常在单日内涨跌
    5% 或 10%，这完全是因为投机情绪的波动。这种波动性削弱了它作为价值储藏手段（货币的其他角色之一）的实用性，并使其不适合作为日常交易媒介，因为没有人愿意接受一种可能在几小时后缩水
    10% 的货币。换句话说，一个基于比特币的金融系统将具有金本位制的所有缺点，而几乎没有它的任何优点。


    要让比特币成为人们可以轻松使用的货币，还存在实际的障碍。当对比特币的需求很高时，矿工会提高处理这些交易的价格，交易费用随之飙升。在去年比特币狂热的顶点，单笔交易的成本可能高达
    55 美元。当人们认为自己持有的比特币价值会一夜翻倍时，这没问题。但如果人们想用比特币买比萨或一台新电视，这就不行通了。更重要的是，比特币无法扩展到处理现代经济所需的交易量。该系统限制为每分钟仅处理
    420 笔交易。最后，事实是，极少数的人控制了世界上绝大部分的比特币。这赋予了他们操纵价格的杠杆，使得比特币难以获得成为真正货币所需的普及。


    ## 区块链驱动的加密货币比硬货币更好吗？


    ### 选择你自己的货币！


    当然，比特币远非唯一的加密货币。根据计算方式的不同，现在有数百种甚至上千种加密货币。虽然它们都像比特币一样构建在区块链上，但某些特征可能使它们作为潜在全球货币更具吸引力。例如，莱特币（Litecoin）每分钟可以处理更多的交易。门罗币（Monero）和
    Zcash 提供了真正的匿名性（与比特币不同，比特币的每笔交易都与一个可以追踪的密钥相关）。并不是所有的加密货币对货币总量都有硬性上限。因此，也许不同的加密货币可以取代美元、欧元或人民币——更有可能的是，我们将得到一个由许多不同私人货币组成的系统，而不是仅仅依赖单一的交易媒介。


    每个人选择最适合自己的货币，以及加密货币之间相互竞争以赢得消费者和企业的忠诚，这种想法确实具有吸引力。但事实上，我们在过去几年看到的加密货币泛滥，使得它们最终取代法币的可能性降低了，而不是增加了。


    一个存在许多不同私人货币的世界，其问题在于它极大地增加了交易成本。使用一种由政府发行的法定货币时，你不需要考虑是否接受它来交换商品和服务。你接受美元是因为你知道你可以用它购买任何想要的东西。由于每个人都默契地同意使用美元，商业流动得更加顺畅。


    在一个拥有许多竞争货币（特别是没有任何大宗商品支撑的加密货币）的经济体中，情况会完全不同。如果有人想用莱特币付钱给你，你得弄清楚你喜欢的莱特币是真正的加密货币，还是一个随时可能关闭的骗局。如果你想花掉它，你必须考虑还有谁可能接受莱特币，或者谁会用美元向你换莱特币（以及汇率和手续费是多少）。基本上，货币的泛滥像是在商业的齿轮中撒了沙子，使得交易效率更低、成本更高。任何难以使用的货币作为交易媒介的价值都会更低。


    ## 对洗钱来说仍然是绝佳之地


    这并非臆测。我们确实有一个关于其如何运作的历史案例。在内内战前的几十年里，美国没有国家货币。相反，那是一个被称为“自由银行”的时代。个人银行发行银行票，理论上由黄金背书，人们将其作为货币使用。问题在于，你离银行越远，人们对银行票的辨识度就越低（因此信任度也越低）。每当你做一笔交易，你必须核实票据以确保它的价值与交易伙伴所说的相符。所谓的“野猫银行”（wildcat
    banks）涌现出来，拿走人们的钱，发行一堆票据，然后关闭，导致这些票据变得一文不值。诚然，人们想出了解决办法——出现了某种类似于银行版 Yelp 的书籍，对银行票的可靠性和价值进行评分。但更广泛的后果是生意变得更加复杂和缓慢。在一个有些人使用以太坊（Ethereum）、有些人使用莱特币、有些人使用瑞波（Ripple）的世界，情况如此。


    ## 区块链可以存储货币，也可以被破解


    Scott A. Wolla


    Scott A. Wolla 是圣路易斯联邦储备银行的高级教育专家。


    比特币已成为一种文化和金融现象。虽然很多人听说过比特币，但了解它的人很少。简单来说，比特币是一种数字货币或“加密货币”，允许独立于银行系统的个人间交易。比特币不是你放在包或钱包里的硬币。相反，它是一种虚拟货币——存储在网络虚拟钱包中的数字代码，通过电脑或手机应用程序访问。有些人认为比特币具有革命性，因为它允许人们方便地转移资金（就像发送电子邮件一样），即使是跨国。然而，最近很多人购买这种虚拟货币仅仅是作为金融投资，希望它升值，而不是用于交易。那么，它究竟是货币还是金融资产？又也许两者之间的界限并不十分。


    ## 比特币是货币吗？


    传统上，货币由国家政府生产。在美国，美国财政部通过美国造币厂和美国票钞印刷局生产我们使用的硬币和纸币。联邦储备储体系（美国的中央银行）通过银行系统分发货币。这种货币是法币；也就是说，它的价值没有黄金或其他大宗商品支撑。相反，它的价值源于其作为货币被广泛接受。换句话说，美元钞


    > “比特币：货币还是金融投资？”作者 Scott A. Wolla, Federal Reserve Bank of St. Louis, March 2018.
    经许可转载。


