    There are a number of potential approaches that authorities could take when it
    comes to the regulation of Bitcoin.


    - 1. Cryptocurrency providers and exchanges will act as regulators of the currency
    by ensuring that AML and KYC regulations are complied with. Some of the existing
    exchanges, such as Coinbase, already enforce these regulations.

    - 2. Governments could take the nuclear option and completely block Bitcoin, or
    other cryptocurrencies that don''t abide by government regulation. As noted above,
