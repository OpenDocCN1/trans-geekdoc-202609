    # Wikipedia Is a Model for How Blockchain Can Work


    Dirk Baur, Daniel Cahill, and Zhangxin (Frank) Liu


    Dirk Baur is a professor of finance at the University of Western Australia. Daniel
    Cahill is an associate lecturer at the University of Western Australia. Zhangxin
    (Frank) Liu is an assistant professor of finance at the University of Western
    Australia.


    Almost a decade after the introduction of Bitcoin, there is a lot of hype about
    the blockchain technology on which cryptocurrencies such as Bitcoin are based.
    Some claim the technology will revolutionise commerce; others are more critical
    in their predictions.


    But the technology behind blockchain remains a mystery to many people.


    A blockchain is a decentralised, distributed and open public ledger made up of
    a sequence of “blocks” that are “chained” via a cryptographic hash.


    If that still sounds like gibberish to you, there is a popular application that
    shares the philosophy of the blockchain technology that can help you understand
    how it works: Wikipedia.


    # A Decentralised, Open Public Ledger


    Wikipedia is a free online encyclopedia that depends on the collaborative effort
    of decentralised volunteer writers called “Wikipedians” who add to this constantly
    increasing repository of information.


    Despite being based on a central database, Wikipedia is decentralised in the sense
    that the ability to add information is completely open and public. This freedom
    to add information to


    > “What Wikipedia Can Teach Us About Blockchain Technology?” by Dirk Baur, Daniel
    Cahill, and Zhangxin (Frank) Liu, The Conversation, April 13, 2018. https://theconversation.com/what-wikipedia-can-teach-us-about-blockchain-technology-92934.
    Licensed Under CC BY-ND 4.0 International.'
  - '[PAGE 101]


    # Cryptocurrencies and Blockchain Technology


    the database, or ledger, and the freedom to access the full history of all previous
    changes, is similar to a blockchain.


    While traditional encyclopedias rely on scholars to provide information, Wikipedia
    gives this role to the public, bypassing trusted authorities.


    Similarly, Bitcoin gives the role of the intermediary to the public, bypassing
    traditional central intermediaries such as banks.


    # Other Common Features


    # Consensus


    Wikipedians contribute information with the aim of improving the quality of the
    existing information. If an edit on Wikipedia is not accepted by other contributors
    it will be changed until a consensus is reached.


    If no consensus can be reached, the “edit war” is settled by an appointed authority.


    The consensus in Bitcoin follows the greatest amount of work expended by the Bitcoin
    network consisting of “miners,” and is represented by the longest blockchain.


    Miners verify transactions and expend resources to complete the “proof-of-work.”
    Once the work is complete the network will show their acceptance by linking new
    blocks to the existing one.


    # Transparency


    Contributions made by Wikipedians are transparent, similar to the open and publicly
    accessible transaction history of any user’s Bitcoin wallet stored over the blockchain.


    The time-stamped history of all edits made to the Wikipedia page is visible through
    the “View History.” Just as each Bitcoin can be traced to its inception, all previous
    versions and iterations of a Wikipedia entry are publicly available and show the
    path towards the current consensus.


    The dynamic evolution of content within Wikipedia is a major difference from traditional
    encyclopedias, which offer a more centralised and more static repository of information.'
  - '[PAGE 102]


    # Is It Possible to Regulate Cryptocurrencies?


    # Trust and Incentive


    Both Wikipedians and bitcoin miners replace the necessity for trusted central
    authorities.


    Interestingly, the incentive to contribute to the network differs. Wikipedians
    are not financially rewarded, whereas Bitcoin miners receive Bitcoin for their
    contributions to the blockchain.


    If a miner included an invalid transaction in their block, then the cost to complete
    the proof-of-work would go unrewarded as honest miners would not link blocks to
    the chain.


    Although the opportunity to vandalise and provide inaccurate information on Wikipedia
    exists, the transparency of edits makes it straightforward for honest writers
    to identify and rectify changes.


    This discourages devious attempts any attempt to discredit the information on
    Wikipedia since be recorded as a time-stamped, unalterable chain of edits. A long
    chain of edits represents the amount of work Wikipedians have put into developing
    the topic. Longer chains can signal a higher quality of information.


    # Points of Difference


    A feature that Wikipedia does not share with the classical blockchain is encryption.
    Because ownership and anonymity is an important feature on the Bitcoin blockchain,
    encryption of information is needed so that coins cannot be stolen or duplicated.


    On Wikipedia there is no ownership of information, making encryption redundant.


    Another key difference is synchronised, simultaneous distribution. Wikipedia is
    not distributed because the participants of the network do not update and store
    the information on their computers. If they did, it would be very costly and thus
    very inefficient—a major drawback of distributed systems.


    Decentral is also inefficient as it generally takes longer to reach a consensus.
    But the final outcome may be better compared to a centralised system.


    In other words, Wikipedia may be less efficient than a traditional encyclopedia
    but the final edition may be much better.'
  - '[PAGE 103]


    # The History of Blockchain Regulation


    Andrew Norry


    Andrew Norry is a writer for Blockonomi, a blockchain-focused news website run
    by Kooc Media.


    Bitcoin was founded on the principles of decentralization, meaning that the cryptocurrency
    was not regulated by the central authority in the way that a traditional (or fiat)
    currency would be. As Bitcoin, and the blockchain technology behind it, remains
    quite new and in the early stages of its evolution, authorities are still trying
    to get to grips with what exactly the is before attempting to come up with a plan
    about how to deal with it, especially in relation to taxation and money laundering
    issues.


    Currently, there is no uniform international approach to Bitcoin and its legality
    will depend on where in the world you reside. However, as authorities gain more
    experience and knowledge about Bitcoin, and the cryptocurrency industry in general,
    it is likely that at least a certain minimum levels of regulation will come into
    place in the vast majority of countries. In addition, the huge gains made by the
    cryptocurrency this year has meant that authorities are feeling that urgency about
    regulating the sector, with over 30 global regulators having announced various
    approaches to cryptocurrency in recent months.


    # What Are the Concerns?


    Not long after its inception, Bitcoin had gained the attention of regulators as
    a result of its popularity amongst vendors and customers on the Dark Web, an area
    of the internet that was rife with illegal trade in items ranging from weaponry
    to illegal drugs. For example, the infamous Silk Road marketplace placed only
    its site in order to ensure anonymity for its


    > "An In-Depth Look at Bitcoin Laws & Future Regulation," by Andrew Norry, Kooc
    Media Ltd., July 2, 2018. Reprinted by permission.'
  - '[PAGE 104]


    # Is It Possible to Regulate Cryptocurrencies?


    customers. The infamy of Bitcoin, and the subsequent closing down of the marketplace
    by the FBI, to US Senator Charles Schumer explicitly referring to Bitcoin as a
    “surrogate currency” that enabled criminal activities.


    In addition, the semi-anonymous and decentralized nature of Bitcoin meant that
    authorities feared it would be used for money laundering. For example as April
    2012 the FBI indicated that the lack of regulation could mean that Bitcoin could
    be used for illegal activities by criminals, especially when offshore exchanges
    were available.


    Other issues arising include the fact as Bitcoin has risen in value, its usefulness
    when it comes to making transactions has fallen and it is being used more and
    more to store value, leading to the possibility of a bubble. It is suggested that
    the vast majority of Bitcoin transactions over the last 12-24 months have been
    for speculation purposes, with the volatility of the asset and the demands (and
    resulting expense) that the sudden surge of interest has placed on the currency
    making it increasingly unsuitable for everyday transactions.


    # Current Approach to Regulation


    Although a small number of countries have restricted or banned Bitcoin, most countries
    allow Bitcoin to be used, while a patchwork of regulations having been put in
    place in different countries. The decentralized nature of Bitcoin makes it very
    difficult to enforce restrictions on Bitcoin, even in those countries that have
    banned it. Below, we have a look at the approach of a number of different jurisdictions.


    # USA


    The US does not yet have a uniform approach to the regulation of Bitcoin at a
    Federal or State level. The Federal Reserve does not have a policy towards the
    regulation of Bitcoin, although it has said that it may be a matter that they
    will have to consider at some point in the future, The Financial Crimes Enforcement'
