    ## 加密货币与区块链技术


    2017年9月，中国在禁止新的ICO后不久，采取了禁止加密货币交易的措施。在两项公告发布后，比特币的价值暴跌。


    比特币的信者认为，社区可以进行自我监管。但新加坡社会科学大学的加密货币学者蒂姆·斯沃森（Tim Swanson）在2017年9月的博客中写道，加密货币社区可以自我执法的想法忽视了用户自利益驱动的动机。一些用户为了推高需求，淡化了黑客构成的威胁（黑客利用了存储比特币的第三方系统中的漏洞）。另一些人则游说反对监管，因为“比特币原始基础设施很大程度上是由比特币持有者自己建立并利用的，其中一些人从第一天起就是坏分子”。


    在可预见的未来，监管机构与比特币持有者之间的猫鼠游戏似乎将占据这两个社区，以及学者和政府关注。2017年发表在《经济行为与组织杂志》上的一篇文章指出，彻底禁止的建议可能无法结束对话，因为任何禁令的生效都需要极其严厉的惩罚。


    一种潜在的解决方案是政府发行自己的加密货币。国际结算银行（总部位于巴塞尔的央行仲裁机构）2017年9月的一份报告描述了一些正在进行中的项目。例如，瑞典正在考虑在其央行的部分货币交易基础设施中使用区块链技术。在美国，有人提议设立“联邦币”（Fedcoin）作为一种由政府支持的加密美元。一位美国央行家暗示，尽管联邦币可能会吸引用户，但很难让死忠比特币者满意。


    ## 比特币监管的失败


    安德里亚·卡斯蒂托（Andrea Castillo）


    安德里亚·卡斯蒂托是乔治·梅森大学梅卡图斯中心技术政策计划的项目经理。


    去年夏天，纽约金融服务局（NYDFS）宣布计划对其境内运营的蓬勃发展的加密货币行业制定新的资金传输监管规定。


    在最初的新闻稿中，监事本杰明（Benjamin）明确表示，保护“有益的创新”和消费者是颁布这项被称为“比特执照”（BitLicense）的新规的首要动机。


    但随着最终比特执照规则于本月生效，情况恰恰相反：无论大小的比特币业务成群结队地离开该州，导致纽约居民几乎没有正规途径参与这个火热的行业。其他州应该吸取纽约这一遗憾的教训，以避免类似的命运。


    在政策制定者对新技术开发适当监管之前，他们必须首先了解该技术是如何工作的。


    像比特币这样的点对点加密货币通过提供一种能够抵御外部审查的分布式货币和支付网络，为其用户创造了价值。我们大多数人需要的传统在线支付系统（如Visa、美国银行或PayPal）是从我们的账户中“拉取”资金并发送到接收方账户的。比特币的技术创新用协议本身取代了此类第三方。运行比特币软件的计算机贡献处理能力以维护区块链，这是一条记录并验证每笔新转账的分布式账本。


    > “比特币不需要比特执照”，作者：安德里亚·卡斯蒂托，经济教育基金会，2015年8月15日。https://fee.org/articles/hey-new-york-bitcoin-does-t-need-a-bitlicense/
    根据 CC BY 4.0 国际协议许可。


    ## 加密货币与区块链技术


    比特币与传统的在线支付通道不同，它是一种“推送”技术：用户，且只有用户，可以控制其比特币何时以及流向何处。


    这一技术突破允许商业、金融和法律领域的一系列令人兴奋的应用。用户可以直接编写特殊交易，以促进分布式仲裁、微支付，甚至是自动执行的“智能”财产服务，而无需信任任何一方。


    总的来说，比特币和类似的技术为那些可能看重安全和控制、而非维护方维护和客户服务的消费者提供了更多选择。这些属性解释了比特币在支付和创新方面巨大成功的原因。


    在短短六年里，加密货币生态系统已从互联网论坛上的爱好者小组演变成了一个市值超过40亿美元、加密货币竞争健康的健康生态系统。风险投资家和法律金融机构纷纷涌入区块链技术，因为它有望最大限度地减少漏洞和成本。


    但从监管者的角度来看，比特币的分布式特性构成了重大的政策挑战。政府如何将现有的“了解你的客户/反洗钱”（KYC/AML）监管规定应用于加密货币？


    通常情况下，州和联邦监管机构要求第三方支付处理者收集客户的详细个人信息，以减少非法转账。对于比特币和其他加密货币，并不一定存在这样的第三方支付处理者。


    在这一点上，比特币类似于现金。用户可以选择信任第三方（如Visa或Coinbase）来管理他们的资金，也可以直接向接收方转移比特币或美元。资金传输许可政策对直接转账和小初创公司施加严苛要求，以监管大型支付处理者，这面临在有前景的加密货币创业起飞之前将其扼杀的风险。


    ## 监管加密货币可能吗？


    纽约州试图通过比特执照来正面应对这一困境，该执照预计将为其他州提供复制模型。回想起来，各州避开纽约最终采用的严苛监管将是明智的。


    比特执照的第一版本措辞非常模糊，以至于更多贡献比特币项目的软件开发者可能需要提交针对第三方托管人的繁琐KYC/AML报告。


    随后的版本至少通过澄清这些和其他歧义，考虑了公众的一些关键意见。但尽管如此，许多令人困惑的短语和严苛指令仍然进入了最终的比特执照条例。


    （注：原文中存在大量重复段，已根据逻辑流进行清理处理。）


