    # Introduction


    > “You can''t stop things like Bitcoin. It will be everywhere and the world will
    have to readjust.”

    —John McAfee, Founder of the McAfee computer software company


    When you owe somebody money, you may write an “I owe you” note to help you and
    your lender remember. If you actually get around to paying the debt off, the note
    you’ve written down is as good as the money you’re going to pay. In one way or
    another, this is how modern currency works; we’re always transferring debts, from
    governments to banks and from banks back to you. Because blockchain technology—a
    list of records that is constantly growing and is connected by cryptography—is
    fundamentally about using digital space to keep information secure, it has been
    a magnet for cryptocurrency advocates. Cryptocurrencies are digital assets that
    can be exchanged and are secured by cryptography. Cryptocurrency proponents see
    it as a way to use money unattached to government-issuing bodies, which they argue
    is merely a relic of the pre-internet era.


    From this perspective, blockchain is simple enough. The amount of information
    that a line of code can contain is limitless, so why should currency be tethered
    to physical or geographic locations? Because most of the world doesn''t use bitcoin,
    the currency is associated with dark sides of the internet and unseen actors,
    but on the face of it, bitcoin is an argument for transparency. Cryptocurrency
    operates on a ledger in which an endless number of transactions can be coded,
    and it is in those records that relative value can be calculated and agreed upon
    by users. The logic of early cryptocurrencies like bitcoin takes this model even
    further and makes the ledger public, with each transaction traceable along a line
    that connects every transaction together: the money paid for one good or service
    can then be traced directly to what it was used for that, with this continuing
    in an infinite line. Money can never be lost or stolen, bitcoin''s advocates argue,
    as it takes the power to control it from the hands of banks and governments and
    spreads it to the masses. In this sense, it serves as a metaphor for a way of
    thinking about the internet and whether it has the potential to offer a different,
    more democratic kind of human relations.


    But is it any better? The rhetoric of progress tells us to presume that a new
    invention is an improvement over what it replaced, but a responsible and reflective
    approach to our greater environment demands we consider the newest technological
    innovations with the kind of scrutiny that, in the past, was not applied to the
    steam engine and the nuclear war. Because of the fixation on creating something
    new, technological innovations are particularly susceptible to accidentally recreating
    things that already exist and, in the case of bitcoin, solving a problem that
    may not actually exist. Before you heard of bitcoin, did you want it?


    The question is not a rhetorical one. Central to the conceit of bitcoin is extraordinarily
    complicated, computer-generated mathematical problems that are, in turn, solved
    by massive computers run and programmed by engineers who are often called “miners.”
    This process generates the “coins” that are the basis of what is traded.¹ They
    are comparable to the role that resources like gold or silver have played in the
    long history of our own currencies. But to what extent does this comparison hold?
    “It takes more energy to produce $1 worth of bitcoin…than $1 worth of copper or
    gold,” reports Max Krause and Thabet Tolaymat, authors of a study on the subject
    that was published in the peer-reviewed journal Nature Sustainability.¹ In this
    model, the use of bitcoin seems not unlike the invention of the SUV, considered
    by some to be an energy-consuming monster of vanity that is softly killing the
    planet.


    # Cryptocurrencies and Blockchain Technology


    At odds with bitcoin''s openness and transparent logic is the mystery it shrouds
    itself in. There is no venerable Chairman of the Federal Reserve to whom we can
    turn when considering bitcoin. The designers of bitcoin prefer to stay in the
    dark and, in fact, unknown by the public. This is a smart decision on their part,
    considering the use of bitcoin in facilitating illegal transactions, as it is
    a commonly used currency on the so-called “dark net” of gun and drug trading.
    But some argue that bitcoin could be used to prevent crimes, asserting that public
    users of bitcoin would be traceable and there would be no taxpayer dollars disappearing
    into the hands of faraway contractors, written off as mysterious embezzlement.
    Bitcoin, more than anything else, is all about receipts. The transparent future
    imagined by bitcoin evangelists is one in which these receipts follow forever,
    meaning we can never be stolen without realizing it.


    In this way, bitcoin is less about the actual hard facts of its use than the debate
    over its potential uses and what it says about its users. The nature of venture
    capital-funded expenditures is that they will economically flow top-down, but
    what about the average consumer? What do cryptocurrencies and, in a more general
    sense, blockchain technology have to offer besides investment opportunities for
    those bored by simply exchanging stocks?


    The answer may be more than just a way to move millions of dollars. Many have
    argued that the technology upon bitcoin’s monetary value is stored could have
    civic applications. “Digital voting can be done on a transparent ledger, over
    the internet, from anywhere in the world, with voting security that is unhackable,
    with the right blockchain,” writes Jonathan Chester for Forbes, presenting one
    such application.¹ In this future, blockchain would provide an avenue to allow
    everyone in a representative democracy to vote once and to do this from his or
    her phone, a technological product that would allow for maximum participation
    and limited fraud. On the other hand, in such a system “undetectable changes…
    could occur in transit,” as Marian Schneider warns in his capacity as president
    of Verified Voting, a respected nonprofit on the subject of democracy, suggesting
    a fear that even the most secure codes could be hacked by stakeholders eager to
    change the results of an election.¹ Other possible uses for blockchain technology
    include creating digital IDs that would allow all your personal information to
    be more secure than traditional website logins and passwords, as well as new ways
    to track purchase information for items like weapons in the event that they are
    used in a crime.


    Blockchain is what we make of, and the arguments in Current Controversies: Cryptocurrencies
    and Blockchain Technology present different theories about how these technologies
    can be used. Technology means, to some extent, that we are the architects of our
    own destiny. The new is always mysterious, but considering these debates, it will
    hopefully feel less opaque.


    # Notes


    - 1. “Everything you need to know about the blockchain,” Arjun Kharpal, CNBC.
    https://www.cnbc.com/2018/06/18/blockchain-what-is-it-and-how-does-it-work.html

