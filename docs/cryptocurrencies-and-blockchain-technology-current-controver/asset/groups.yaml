    # Bitcoin Mining Is an Environmental Hazard


    Christopher Malmo


    Christopher Malmo is a writer for Vice Media''s Motherboard vertical.


    As Bitcoin''s price increases, its energy consumption is soaring. Bitcoin''s power
    consumption is extremely high compared to conventional digital payment, and one
    transaction now uses as much energy as your house in a week.


    Bitcoin''s incredible price run to break over $7,000 this year has sent its overall
    energy consumption soaring, as people worldwide bring more energy-hungry computers
    to mine the digital currency.


    Bitcoin mining is the largely automated process (although it can be done by hand)
    of finding a particular hash value that "solves" a block of transaction data,
    adding it to an ever-growing chain of blocks that is referred to, appropriately,
    as the blockchain. Mining secures this distributed ledger of transactions, but
    it isn''t cheap: The most successful miners operate warehouses full of specialized
    machines constantly crunching numbers. Solving a block releases some new bitcoins
    to the miner as a reward for their work, making it a potentially lucrative venture,
    but what''s the environmental cost?


    # How Much Energy Does Bitcoin Mining Consume?


    An index from cryptocurrency analyst Alex de Vries, aka Digicominist, estimates
    that with prices the way they are now, it would be profitable for Bitcoin miners
    to burn over 24 terawatthours of electricity annually as they compete to solve
    increasingly difficult cryptographic puzzles to "mine" more Bitcoins. That''s
    about as much as Nigeria, a country of 186 million people, uses in a year.'
