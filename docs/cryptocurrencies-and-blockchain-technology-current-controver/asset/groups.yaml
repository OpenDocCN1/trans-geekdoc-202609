    # An All-Digital Currency Still Needs a Bank


    Aleksander Berentsen and Fabian Schär


    Aleksander Berentsen and Fabian Schär are both researchers for the Federal Reserve
    Bank of St. Louis.


    In Berentsen and Schär (2017), we argue that Bitcoin links several technological
    components together in such a way that the units of value are issued under competition
    and have both a virtual representation and a decentralized transaction process.
    In this way, the Bitcoin system has money that is substantially different from
    any other money—such as commodity money, cash, or electronic money.


    To understand why Bitcoin is unique, it is useful to characterize money according
    to its control structure.¹ There are three dimensions The first dimension is representation.
    Money can be represented in virtual form or physical form. The second dimension
    is transaction handling. Money can be transacted in centralized or decentralized
    payment systems. Finally, the third dimension is money creation. Some monies are
    created by a monopoly, while others are issued under competition.


    Cash is represented by a physical object, usually a coin or bill, meaning that
    its value is unit inseparable from the object. The holder of a cash unit is automatically
    the owner of the corresponding value. As a result, the ownership rights to the
    cash units, circulating freely in the economy, are always clearly defined without
    anyone having to keep records. This feature allows for a decentralized payment
    system where cash can change hands between two agents without the involvement
    of a third party. In most countries, the central bank or the treasury is the monopoly
    issuer of cash.


    Commodity money, such as gold, is also represented by a physical object; and,
    again, the current holder of a unit is by default


