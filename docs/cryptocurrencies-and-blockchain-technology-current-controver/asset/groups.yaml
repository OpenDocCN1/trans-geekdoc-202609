    limiting this individual''s access to financial and communications services.


    +   * At the corporate level, a vast body of literature in economics has shown
    how uncertainty over the quality and trustworthiness of data can impose transaction
    costs, limit the development of markets for goods and services, or shut them down
    altogether. This is the well-known “market for lemons” problem made famous in
    a 1970 paper of the same name by George Alof.


    +   * At the societal or governance level, information asymmetries don’t affect
    the efficiency of markets or social inequality. They can also incentivize unwanted
    behaviors that cause substantial public harm. Tyrants and corrupt politicians
    thrive by limiting their citizens’ access to information (e.g., information related
    to bank accounts, investment patterns or disbursement of public funds). Likewise,
    criminals, operate and succeed in the information-scarce corners of the underground
    economy.'
