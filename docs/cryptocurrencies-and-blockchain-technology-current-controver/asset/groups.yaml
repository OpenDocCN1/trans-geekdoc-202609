    - 2. “研究人员表示，挖掘加密货币比实际采矿更耗能，”Nicole Nguyen, BuzzFeed News。https://www.buzzfeednews.com/article/nicolenguyen/mining-cryptocurrencies-energy-mining-metals?bftwnews&utm_term=4ldqpc#4ldqpc

