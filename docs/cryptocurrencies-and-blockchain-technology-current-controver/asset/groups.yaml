    # A History of Bitcoin on the Blockchain


    Axel Simon


    Axel Simon works for Red Hat, an international open-source software company.


    It isn''t uncommon, when working on a new version of an open source project, to
    suffix it with “ng”, for “next generation.” Frequently, in their rapid evolution
    blockchains have so far avoided this naming pitfall. But in this evolutionary
    open source ecosystem, changes have been abundant, and good ideas have been picked
    up, remixed, and evolved between many different projects in a typical open source
    fashion.


    In this article, I will look at the different generations of blockchains and what
    ideas have emerged to address the problems the ecosystem has encountered. Of course,
    any attempt at classifying an ecosystem will have limits—and objectors—but it
    should provide a rough guide to the jungle of blockchain projects.


    # The Beginning: Bitcoin


    The first generation of blockchains stems from the Bitcoin blockchain, the ledger
    underpinning the decentralized, peer-to-peer cryptocurrency that has gone from
    Slashdot miscellanea to a mainstream topic.


    This blockchain is a distributed ledger that keeps track of all users’ transactions
    to prevent them from double-spending their coins (a historically entrusted to
    three parties: banks). To prevent attackers from gaming the system, the ledger
    is replicated to every computer participating in the Bitcoin network and can be
    updated by only one computer in the network at a time. To decide which computer
    earns the right to update the ledger,'
