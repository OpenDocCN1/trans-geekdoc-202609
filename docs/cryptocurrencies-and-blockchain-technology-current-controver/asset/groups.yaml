    # Decentralization Prevents Regulation by a Central Authority


    Alex Hern


    Alex Hern is a technology reporter for the Guardian.


    Digital currencies such as bitcoin have caused a financial frenzy. Alex Hern explains
    what they are—and whether this is the end of “real” money.


    # What Is a Cryptocurrency? Is It Like Bitcoin?


    In a word, yes. Bitcoin was the first cryptocurrency, and is still the biggest,
    but in the eight years since it was created pretenders to the throne have come
    along.


    All of them have the same basic underpinnings: they use a “blockchain”, a shared
    public record of transactions, to create and track a new type of digital token—one
    that can only be made and shared according to the agreed-upon rules of the network,
    whatever they may be. But the flourishing ecosystem has provided a huge amount
    of variation on top of that.


    Some cryptocurrencies, such as Litecoin or Dogecoin, fulfil the same purpose as
    bitcoin—building a new digital currency—with tweaks to some of the details (making
    transactions faster, for instance, or ensuring a basic level of inflation.


    Others, such as Ethereum or Bat, take the same principle but apply it to a specific
    purpose: cloud computing or digital advertising in the case of two.


