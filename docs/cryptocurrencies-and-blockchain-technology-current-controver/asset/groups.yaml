    # Cryptocurrencies and Blockchain Technology


    “Without email, phones, passports or even birth certificates, a blockchain could
    be the only way poor people have to prove what they are,” says Kshetri. “That
    could really make their lives better and expand their opportunities.”


    # Adoption in Africa


    Thabang Mashiloane, chief executive and co-founder of Chankura Crypto Exchange,
    a global crypto-currency exchange founded in South Africa and currently headquartered
    in Silicon Valley, pointed out the rising interest and excitement in certain countries.


    “Between August and September 2017, South Africa was the top country in the world
    to search for the bitcoin term on Google search,” Mashiloane told the Africa Portal.
    “South Africa and Nigeria have seen significant growth in Bitcoin trading from
    multiple local exchanges. More than $3.6-million is being traded daily in [these]
    countries. Other African countries such as Kenya, Ghana, and Morocco also have
    volumes, but due to lack of bitcoin exchanges the volumes are not easily traced”


    Gareth Grobler, of cryptocurrency platform ICE3X estimates that between 200,000
    and 300,000 South Africans are now involved with cryptocurrencies.


    Marina Niforos, principal at Logos Global Advisors which compiled a report about
