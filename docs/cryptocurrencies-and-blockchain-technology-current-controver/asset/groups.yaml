    # 加密货币与区块链技术


    在莫农加利亚县和哈里森县——这两个县总人口约 14.3 万——他们向那些居住在境外的注册选民提供该应用程序，其中包括州务卿（也是克尔西的上级）马克·华纳（Mac
    Warner）的儿子，他是一名现役陆军军。


    西弗吉尼亚州官员对于初选期间到底有多少人使用了 Voatz 应用程序一直闪烁其辞，但一位知情人士透露，人数最少只有 13 人。但克尔西对这个有限的样本显得很有信心。


    “因素在于，它必须是安全、廉价、透明、可审计，且不需要邮件、打印机、传真机或扫描仪，”他说，“极地冰盖下潜艇里的水兵虽然无法访问邮件，但他可以访问互联网。”


    ## 认证的几个步骤


    由于选民和选举官员对外国试图干预 2016 年总统大选的发现感到不安，数字投票系统可能面临着高度的不信任。但克尔西和 Voatz 联合创始人阿米特·萨瓦尼（Amit
    Sawhney）都为该公司的平台是高度安全的。


    萨瓦尼的演示证明，该应用程序会经过几个认证步骤，从短信发送到用户手机的六位代码开始，必须输入回应用程序中。从那里开始，用户需要上传一张政府颁发的证件照片，然后拍摄自拍照进行验证，萨瓦尼说这需要多达
    24 小时。一旦完成，注册用户最终就会看到选票。


    新投票技术的批评者经常将纸质选票视为确保结果可信赖的首选方法，并对区块链这种才有十年的新技术保持警惕。“作为一名选举管理人员，这引发了许多警报，”克尔西说，“但这提供了最佳选择。”克尔西为
    Voatz 背书，他告诉一满屋的州务卿和其他选举官员，他大维·塔凯特（Dave Tackett）亲自参观了位于波士顿外的 Voatz 办公室，并检查了该公司的计算标准，据该公司称，这些标准是由美国国家标准与技术研究院（NIST）和
    MITRE 公司等机构设定的。


    在选票投出后从应用程序中提取实际选票也有些复杂。克尔西说，Voatz 向参与试点的县交付了物理密钥——本质上是带有加密代码的闪存器——不同政党的用户需要从该公司的服务器上解锁选票。克尔西说，他们真的从波士顿飞到西弗吉尼亚州，然后从摩根敦堡开车并将它们递交给县书记员。“报告是打印出来的，而且选票是保密的。”


    克尔西说，在未来的一周内，他的办公室将决定是否要在全州推广 Voatz 系统，尽管如果推广，也将是基于每个县的自愿原则进行的。


    ## 噢，我的天呐


    并不是每个看完全克尔西演示的人都信服移动投票是未来的趋势。“噢，我的天呐，”密歇根大学计算机科学教授、同时担任倡导选票安全的“核实投票”（Verified
    Voting）技术专员的 J·亚历克斯·霍尔德曼（J. Alex Halderman）说道，“通过互联网投票会产生额外的问题。保护服务器？在保护选票秘密的同时确保选票被记录？”霍尔德曼说，目前开发的任何投票技术都不如现场纸质选票安全。他曾就此主题在国会作过证，并进行过演示，通过黑进电子投票机来更改统计结果，在一种情况下，他还重新编程了一台机器来玩《吃人包》。


    在最近与《纽约时报合作的一个视频中，霍尔德曼解释了坚定的黑客——无论是单独行动还是代表外国政府——如何伪装成选举设备制造商和当地选举官员，并带有伪装成软件更新的病毒。霍尔德曼说，Voatz
    “对于技术工作原理的公开还不够，让外部专家进行审查。”


    萨瓦尼告诉 Scope，通过 Voatz 收集的选票可以生成纸质收据。他还说，如果应用程序检测到移动设备上有恶意软件，将不会运行，但霍尔德曼对这一说法表示怀疑。“这听起来像是万能解决方案，”他说。


    尽管如此，霍尔德曼同意让美国公民在海外投票更容易（特别是部署的士兵）是一个值得的目标。“我们应该尽一切努力确保士兵能够投票，”他说，“司法辖区为军事选民能做的最大事情就是延长期限。”（他也对水兵是否被允许携带个人手机上潜艇表示怀疑。）


    ## 如果它对奥斯卡有效……


    但无论通过区块链还是其他协议，互联网和移动投票都是不可避免的，而且不仅仅是为了海外选民，Everyone Counts 的首席执行官詹姆斯·西蒙斯（James
    Simmons）这样说，该公司制作的注册软件包括一些海外选票。


    Simmons 公司进行的大多数选举是针对非政府实体，包括公司董事会、工会领导层和奥斯卡之类的奖励。他说选票使用私钥加密加密加密并使用安全套接层（SSL）和传输层安全（TLS）协议传回独立审计员，由他们进行计票。（2017
    年奥斯卡颁奖礼上的事件，《爱陆之城》被误认为最佳影片而非真正的获奖者《月光之战》，虽然是现场误读的结果，尽管 Simmons 说他曾一度担心自己公司的系统失效了。）


    Simmons 没有支持区块链或任何其他特定平台，但他预测在线投票将扩展到普通大众。“总有一天，世界将在在线投票，”他说，“技术还没有到位。可能还很遥远。但像许多事物一样，它将被数字化。”


    即使对西弗吉尼亚州两个县试点的审计对 Voatz 的软件持积极态度，西弗吉尼亚州并没有特别大的海外侨民——联邦投票协助计划（FVAP）方便海外投票，该计划在
    2016 年的调查中统计该州有 334 名居住国外的注册选民。克尔西说，他预计将在本月晚些时候听到结果，就在与所有 55 个县的选举主任的会议之前。


    '
