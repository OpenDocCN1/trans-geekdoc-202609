    # 引言


    > “你无法阻止比特币这样的东西。它将无处不在，世界将不得不重新调整。”

    —John McAfee，麦阿菲计算机软件公司创始人


    当你欠某人钱时，你可以写一张“欠条（I owe you）”来帮助你和债权人记住。如果你真的抽时间还了债务，你写下的这张字条就等同于你将支付的现金。从某种意义上说，这就是现代货币的运作方式；我们总是在转移债务，从政府到银行，再从银行回到你手中。因为区块链技术——一种不断增长并通过密码学连接的记录列表——本质上是关于利用数字空间来保持信息安全的，因此它一直是加密货币支持者的磁石。加密货币是通交换的并受密码学保护的数字资产。加密货币支持者将其视为一种不依赖于政府发行机构的资金，他们认为这些机构仅仅是互联网前时代的遗迹。


    从这个角度来看，区块链足够简单。一行代码所包含的信息量是无边际的，那么为什么货币应该被束缚在物理或地理位置上呢？因为世界上大多数人并不使用比特币，这种货币与互联网的阴暗面和不可见的参与者相关联，但表面上看，比特币是支持透明度的论点。加密货币运行在一个账本上，账本可以记录无限数量的交易，正是在这些记录中，用户可以计算并约定相对价值。比特币等早期加密货币的逻辑将这种模型推得更远，使账本公开，每笔交易都可以沿着一条连接所有交易的线条进行追溯：为某件商品或服务支付的钱可以直接追溯到它的用途，这种追踪在无限的线条中持续。比特币的支持者认为，钱永远不会丢失或被盗，因为它将控制权从银行和政府手中夺回，并传播给大众。从这个意义上说，它是对一种互联网思考方式的隐喻，以及它是否有潜力提供一种不同的、更民主的人类关系模式。


    但它真的更好吗？进步的修辞告诉我们，要假设新发明是对其所取代之物的改进，但对我们大环境采取负责任且反思的方法要求我们以审视的眼光看待最新的技术创新，而这种审视在过去是没有应用于蒸汽机和核战争的。由于对创造新事物的痴迷，技术创新特别容易意外地创造出已经存在的事物，在比特币的情况下，则是解决一个可能并不存在的问题。在你听说比特币之前，你想要它吗？


    这个问题并不是修辞性的提问。比特币概念的核心是极其复杂的、计算机生成的数学问题，这些问题又由通常被称为“矿工”的工程师运行和编写的大型计算机来解决。这个过程产生了作为交易基础的“硬币”¹。它们与黄金或白银等资源在我们货币的长久历史中所扮演的角色可以比拟。但这种比较在多大程度上成立呢？Max
    Krause 和 Thabet Tolaymat 在发表于同行评审期刊《自然-可持续性》（Nature Sustainability）的一项关于该主题的研究中报告道：“生产1美元比特币所消耗的能量……比1美元的铜或金要多。”¹在这种模型中，比特币的使用似乎像
    SUV 的发明一样，SUV 被一些人认为是一种虚荣的耗能怪兽，正在无声地杀死地球。


    # 加密货币与区块链技术


    与比特币的开放性和透明逻辑相矛盾的是它自身所笼罩的神秘色彩。在考虑比特币时，我们没有一位受尊敬的联邦储备委员会主席可以求助。比特币的设计者倾向于留在黑暗中，事实上，不让公众知晓。考虑到比特币在促进非法交易中的用途，这对他们来说是一个明智决定，因为它是武器和毒品交易的所谓“暗网”上常用的货币。但也有人认为比特币可以用于预防犯罪，声称比特币的公开用户是可追溯的，不会有纳税人的钱消失在远方承包商手中，并被记账为神秘的贪污公款。比特币比任何其他东西都关乎收据。加密货币传道士所想象的透明未来是这些收据永远跟随的，这意味着我们永远不会在毫无察觉的情况下被盗。


    通过这种方式，与其与其使用的实际硬性事实，不如说是对其潜在用途的辩论以及它反映了用户的什么。风险投资资助支出的性质是它们在经济上将自上而下流动的，但普通消费者呢？加密货币以及从更广泛意义上说区块链技术除了为那些对交易股票感到无聊的人提供投资机会外，还能提供什么？


    答案可能不仅仅是移动数百万的方法。许多人认为，存储比特币货币价值的技术可以具有公民应用。Jonathan Chester 为《福布斯》（Forbes）写道：“只要有正确的区块链，就可以在透明的账本上通过互联网从世界任何地方进行数字投票，并具有不可破解的投票安全性，”他展示了这样一种应用¹。在未来中，区块链将提供一种途径，让代表制民主中的每个人都能投票一次，并通过他们的手机完成，这种技术产品将允许最大程度的参与并限制欺诈。另一方面，在这样的系统中，“不可检测的变化……可能会在传输过程中发生，”Marian
    Schneider 以其作为关于民主主题的受尊敬的非营利组织 Verified Voting 主席的身份警告道，这表明他担心即使是最高安全的代码，也可能被急于改变选举结果的利益相关者所破解。¹。区块链技术的其他可能用途包括创建数字
    ID，这将使得你的所有个人信息比传统的网站登录和密码更安全，以及跟踪武器等物品购买信息的新方法，以防这些物品被用于犯罪。


    区块链取决于我们如何定义它，而《当前争议：加密货币与区块链技术》中的论证提供了关于这些技术如何被使用的不同理论。技术在某种程度上意味着我们是自己命运的建筑师。新事物总是是神秘的，但考虑到这些辩论，希望它读起来不会那么晦涩。


