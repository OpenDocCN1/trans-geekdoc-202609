    Bitcoin, unlike traditional online payment channels, is a “push” technology: the
    user, and only the user, can control when and where their bitcoins go.


    This technological breakthrough allows an exciting range of applications in commerce,
    finance, and law. Users can directly program special transactions to facilitate
    distributed arbitration, micropayments, and even self-enforcing “smart” property
    services, without the need to place trust in any one party.


    In general, Bitcoin and similar technologies provide more options for consumers
    who may value security and control over party maintenance and customer service.
    These attributes explain Bitcoin’s rousing successes in payments and innovation.


    In six short years, the cryptocurrency ecosystem has gone from a handle of hobbyists
    on Internet forums to a healthy ecosystem of competing cryptocurrencies topping
    $4 billion in market capitalization. Venture capitalists and legal financial institutions
    alike have flocked to blockchain technologies for their promise to minimize vulnerabilities
