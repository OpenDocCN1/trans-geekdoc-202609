    # Three Ways Blockchain Technologies Address Information Asymmetries


    These and other examples highlight that blockchain technologies can broadly address
    information asymmetries in three ways:


    - 1. Addressing information asymmetries at the supply and value chain by improving
    track and trace: The impact of blockchain is already starting to be felt in global
    supply chains, including in the pharmaceuticals and food industries. By immutably
    recording various steps in supply chains, (and other logistics chains), blockchain
    has the potential to reduce waste and fraud, crack down on duplicates and illicit
    products, and increase consumer safety. Blockchain in effect allows transparency
    watchdogs, as well as average consumers, to track the provenance of goods they
    purchase and consume, (such as diamonds), in the process leveraging the power
    of information so that consumers and citizens can make better choices.


    # Are Blockchain Technologies Too Complex?


    - 2. Addressing asymmetries related to the management of identity attributes:
    The lack of verifiable, self-sovereign identities is emerging as one of the major
    problems of the information age, enabling everything from identity theft to privacy
    violations, new and existing forms of surveillance, and other forms of fraud.
    Today, citizens do not control their online presences, and this not only leads
    to problems which erodes long-term trust in the entire data ecosystem. Several
    projects are underway to use blockchain to remedy this situation. For example,
    the Illinois Blockchain Initiative launched a pilot project testing the value
    and feasibility of citizen birth certificates on the blockchain, giving citizens
    more control and an easier way to verify their identities. Likewise, Massachusetts
    Institute of Technology (MIT) is in the second year of a project providing blockchain-based
    digital diplomas to students. Though still reliant on the registrar’s office,
    the project aims to provide alums with more control over their credentials and
    the ability of others to view them.


    - 3. Addressing transactional inefficiencies resulting from information asymmetries
    through smart contracting: Much has been made of blockchain''s potential for automated
    contracting. Smart contracting has the potential to reduce fraud and transaction
    costs for businesses, governments and citizens. More generally, it has the potential
    to drastically simplify processes (by, for example, automating compliance and
    enforcement), thus opening up new business models and permitting average citizens
    to enter into complex and hitherto expensive arrangements with businesses, governments
    and each other. Smart contracting is an example of how existing information asymmetries
    can potentially be leveled and flattened, putting more power into the hands of
    citizens and consumers.


    # Cryptocurrencies and Blockchain Technology


    # Blockchain Technologies and Traditional Means of Addressing Information Asymmetries


    To date, information asymmetries needed to be overcome through a variety of institutional
    and “signalling” means—such through the enforcement of liability and traceability
    provisions and/or disclosure requirements or monitoring by well-known and trusted
    institutions; the establishment of industry standards or professional norms; reputation-based
    mechanisms; or even “outcome-contingent” contracts (where the buyer does not pay
    until the outcome of the service is known). Recent developments toward “open data”
    or “open contracting” as part of the move toward “open government” can also be
    portrayed as efforts to prevent or address information (and power) asymmetries.


    These institutional solutions, however, are dependent not just upon strong and
    trusted societal intermediaries but also upon an individual’s ability to access
    those intermediaries, or leverage the data made available, which explains why
    information asymmetries affect less developed countries and already excluded people
    more.


    Whether blockchain technologies will provide a distributed, more egalitarian and
    democratic alternative to these institutional solutions remain to be seen as the
    presence of these same trust providing mechanisms may in fact be conditional for
    blockchain to be successfully implemented. Similarly, recent developments toward
    more private and permission-based blockchains may actually create new or reinforce
    information asymmetries instead of dismantling them (as we have seen with certain
    identity and smart contracting initiatives—and with ICO token offerings).


    To monitor the potential of blockchain for social change—by tackling information
    asymmetries—The GovLab at NYU, an action-oriented think tank, is compiling a database
    of blockchain examples from around the world, and welcomes additions sent to blockchange@thegovlab.org.


