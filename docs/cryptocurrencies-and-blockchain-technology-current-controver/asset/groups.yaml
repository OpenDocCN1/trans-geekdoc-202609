    the old model of cross-border money transfers obsolete. Blockchain-powered money
    can cross the globe in seconds while traditional methods can take days or weeks.
    The slowest blockchain network can take up to an hour to confirm transfers, the
    fastest take 4 to 5 seconds. For reference, ACH transfers take three business
    days, while domestic wire transfers require several hours and can cost $15 or
    more. Compare that to the Litecoin network, which took 2.5 minutes to send the
    equivalent of $99 million to the other side of the world for just $0.40 in fees.


    Blockchain could also disrupt commercial banking. From a consumer perspective,
