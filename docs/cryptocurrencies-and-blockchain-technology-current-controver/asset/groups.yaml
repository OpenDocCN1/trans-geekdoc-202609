    # How Cryptocurrencies Become Real Currencies


    Brandt Redd


    Brandt Redd has an MBA in organizational communication from Brigham Young University
    and works as a technology strategist for EdMatrix, an organization that seeks
    to make learning an enjoyable experience.


    Today I''m diverging from the education theme to write about cryptocurrency. I
    am provoked, in part, by this quote from Alan Greenspan:


    > It [Bitcoin] has to have intrinsic value. You have to really stretch your imagination
    to infer what the intrinsic value of Bitcoin is. I haven''t been able to do it.
    Maybe somebody else can.


    Now, Greenspan should know better than to say something like that. As a fiat currency,
    the dollar doesn''t have any more intrinsic value than Bitcoin. And that’s why
    I decided to write about this. Most of the supposed “Bitcoin Primers” out there
    are more confusing than helpful. They don''t explain how money works or how cryptocurrencies
    like Bitcoin satisfy the requirements to become a currency.


    # What Makes a Currency?


    Currency is a form of money that accepted by a group of people to exchange value.
    A functional currency must have three important characteristics:


    +   - Scarcity—If you have too much of the currency, it’s value will plummet toward
    zero. So, there must be a limited supply.


    "Bitcoin—What Makes a Currency?” by Brandt Redd, Of That, July 30, 2014, https://www.ofthat.com/2014/07/bitcoin-what-makes-currency.html.
    Licensed under CC BY 3.0 US.'
  - '[PAGE 27]


    # Cryptocurrencies and Blockchain Technology


    +   - Verifiability—You must be able to verify that a unit or token of the currency
    is valid and not a forgery or imitation.

    - Availability—Despite scarcity, there still must be a stable supply of the currency
    to match growth in the corresponding economy.


    Precious metals like gold and silver were the first common currencies. They meet
    all of the foregoing criteria. Gold is scarce; there''s a limited amount of it
    available thereby end a small amount of gold with considerable value. It''s verifiable;
    gold has certain characteristics, such as density, malleability and color, that
    make it easy to distinguish from other materials. And gold is available; while
    it is not common, gold mines still offer a consistent supply of the material.


    One of the difficulties with early uses of gold currency was the complexity of
    exchange. Merchants had to use a balance or scale to determine how much gold was
    being offered. To facilitate easier exchange, governments, banks, and other trusted
    organizations would mint coins of consistent size and weight. This would allow
    someone to verify the value of a coin without resorting to a balance.


    # Fiat Currency


    “Fiat” means, roughly, “because I said so.” Fiat currency has value simply because
    some trusted entity says it does. It need not have any intrinsic value.


    The first fiat money was the banknote. When making a large payment it could be
    inconvenient or dangerous to move large quantities of coins or bullion. Banks
    solved this problem for their customers by issuing banknotes. A banknote is a
    paper that a bank or other entity promises to exchange for a certain amount of
    coin, gold, or other currency. The bank could keep the corresponding gold locked
    away in a vault and people could carry more convenient paper certificates.


    Beginning in 1863, the United States began issuing gold certificates as a form
    of paper money or banknote. Certificates'
