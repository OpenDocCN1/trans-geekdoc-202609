    # Cryptocurrencies and Blockchain Technology


    system organizes every 10 minutes a race between the computers, which costs them
    (a lot of) energy to enter. The winner wins the right to commit the last 10 minutes
    of transactions to the ledger (the “block” in blockchain) and some Bitcoin as
    a reward for their efforts. This setup is called a proof of work consensus mechanism.


    This is where it gets interesting. Bitcoin was released as an open source project
    in January 2009. In 2010, realizing that quite a few of these elements were tweaked,
    the community that had aggregated around Bitcoin, often on the bitcointalk forums,
    started experimenting with them.


    First, seeing that the Bitcoin blockchain is a form of a distributed database,
    the Namecoin project emerged, suggesting to store arbitrary data in its transaction
    database. If the blockchain can record the transfer of money, it could also record
    the transfer of other assets, such as domain names. This is exactly Namecoin’s
    main use case, which went live in April 2011, two years after Bitcoin’s introduction.


    Where Namecoin tweaked the content of the blockchain, Litecoin tweaked two technical
    aspects: reducing the time between two blocks from 10 to 2.5 minutes and changing
    how the race is run (replacing the SHA-256 secure hashing algorithm with scrypt).
    This was possible because Bitcoin was released as open software and Litecoin is
    essentially identical to Bitcoin in all other places. Litecoin was the first fork
    to modify the consensus mechanism, paving the way for many more.


    Along the way, many more variations of the Bitcoin codebase have appeared. Some
    started as proposed extensions to Bitcoin, such as the Zerocash protocol, which
    aimed to provide transaction anonymity and fungibility but was eventually spun
    off into its own currency, Zcash.


    While Zcash has brought its own innovations, using recent cryptographic advances
    known as zero-knowledge proofs, it maintains compatibility with the vast majority
    of the Bitcoin code base, meaning it too can benefit from upstream Bitcoin innovations.'
