    # Is It Possible to Regulate Cryptocurrencies?


    While bitcoin remains the dominant cryptocurrency both in terms of market capitalisation
    and usage, it has conceded market cap share to other cryptocurrencies—declining
    from 86 percent to 72 percent in the past two years.


    The study by the CCAF at Cambridge Judge Business School breaks down the cryptocurrency
    industry into four key sectors—exchanges, wallets, payments, and mining. Highlights
    of the findings are:


    # Exchanges


    Cryptocurrency exchanges provide on-off ramps to cryptocurrency systems by offering
    services to users wishing to buy or sell cryptocurrency. This sector was the first
    to emerge in the cryptocurrency industry, and has the most operating entities
    and employs the most people. Currently, about 52 percent of small exchanges hold
    a formal government license, compared to only 35 percent of large exchanges.


    # Wallets


    Wallets have evolved from simple software programs to sophisticated applications
    that offer a variety of technical features and services. As a result, the lines
    between wallets and exchanges are increasingly blurred, with 52 percent of wallets
    providing an integrated currency exchange feature.


    # Payments


    Cryptocurrency payment companies generally act as gateways between cryptocurrency
    users and the broader economy, bridging national currencies and cryptocurrencies.
    They can fit into two broad categories: firms that use cryptocurrency primarily
    as a “payment rail” for fast and efficient cross-border transactions, and firms
    that facilitate the use of cryptocurrency for both users and merchants. The study
    found that the size of the average business-to-business cryptocurrency payment
    ($1,878) dwarfs peer-to-peer and consumer-to-business cryptocurrency payments.'
