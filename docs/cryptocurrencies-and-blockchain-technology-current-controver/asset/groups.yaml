    斯蒂凡·弗尔霍尔斯特（Stefaan Verhulst）


    区块链的创新为信息的传递提供了一种安全方式，无论是货币甚至是选举中的选票。这些新解决方案的支持者认为，它们可以极大地改变日常生活，并减少在全球化世界中交易中内置的类安全装置的需求。


