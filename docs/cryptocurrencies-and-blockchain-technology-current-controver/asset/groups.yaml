    New York has already severely limited the innovative applications that this technology
    will bring to other states.


    Meanwhile, those who wish to use cryptocurrency to launder money in New York will
    find a way to do so anyway.


    The preemptive BitLicense regulations resulted in the worst of both worlds: New
    York residents are deprived of innovative development, and criminals must still
    be apprehended after the fact.


