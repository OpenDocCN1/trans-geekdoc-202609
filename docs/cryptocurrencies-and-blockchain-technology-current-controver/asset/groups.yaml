    # Cryptocurrencies and Blockchain Technology


    Hash functions are one way, or asymmetric. They compress an input, or message,
    of any length into an output of a predetermined length, or hash value. The hash
    value of an input is easy to calculate, but it is impractical to decipher the
    input from the hash value.


    Hash functions are deterministic. For a given input, there is exactly one resulting
    hash. Changing any single character in that input changes the hash value. The
    same input always produces the same output.


    - **Public Key Cryptography**: Cryptocurrency networks use private and public
    keys to generate transactions and verify their validity. A private key is a value
    randomly generated by a digital wallet. It serves as a unique password or authorization
    code. A public key is the equivalent of an account number. It is generated together
    with the private key and is mathematically linked to it. A public key or its hash
    value is known to the entire network.


    Every time users conduct a transaction, their wallet cryptographically signs for
    it using their private key. These digital signatures serve like fingerprints,
    cryptographically connecting the transaction with the holder of the private key.
    The network verifies each transaction using the combination of public key and
    the digital signature. If these match, the network approves the transaction, which
    then gets added to the blockchain. The public key cryptography allows the person
    with the private key to spend the funds associated with a particular digital wallet.


    - **Blockchain**: A self-propagating ledger that resides on a network. Every block
    on the ledger consists of a header and a set of transactions that are validated
    by the network at predetermined time intervals. Each block has its own hash signature
    connecting it to a previous block. The network constantly updates and checks the
    validity of all these blocks. Changing any single character in that block invalidates
    it.


    # Are Blockchain-Powered Cryptocurrencies Better than Hard Money?


    - **Mining**: Mining is the process of validating blocks on a network that uses
    proof-of-work (PoW) as its consensus mechanism. Participants on these networks
    are incentivized to earn cryptocurrency by helping to include transactions through
    the process of mining. Mining requires time and computing power to solve a difficult
    mathematical problem through trial and error. The output of mining is easy to
    verify but imposes steep costs on bad actors who seek to tamper with legitimate
    transactions.


    Blockchain technology uses hash functions to cryptographically link and secure
    blocks, public key cryptography to authorize and verify transactions, and a consensus
    mechanism to synchronize its network.


    While the first version of blockchain appeared on a permissionless network, this
    is not a strict requirement for blockchain technology to work. Blockchain-based
    networks can be run by private consortia and can have limited access/membership.
