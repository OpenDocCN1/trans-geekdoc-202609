    # Cryptocurrencies and Blockchain Technology


    # Backlash Against CBDCs


    To be sure, official enthusiasm for central bank-issued digital currency, or CBDC
    as it has become known, has waned somewhat as the old guard of central banking
    has dug in its heels.


    At the Bank of England, which spearheaded research into the idea three years ago,
    Governor Mark Carney has lately warned of financial instability if his institution
    were to directly provide digital wallets to ordinary citizens—a change that would,
    in effect, give everyone the same right to hold reserves at the central bank as
    regulated commercial banks.


    The Bank of International Settlements—a kind of international club for central
    banks—has echoed Carney''s concerns, as have other officials.


    This backlash, which suggests that the bank supervisory teams within central bank
    bureaucracies have regained ascendancy over technologists and innovators in their
    internal debates over CBDC, stems from a well-founded expectation: bank runs would
    be a real possibility.


    Why hold your money at risky, friction-laden institutions paying near-zero interest
    when you can store at zero risk with the central bank itself and trade it automatically
    with other fiat wallet holders?


    But why, also, should we care what happens to banks?


    # Banks Are the Problem


    The only reason to promote digital fiat currencies is precisely to bypass the
    banks. Whether the currency is fiat or decentralized, banks are the problem. The
    technical, social and regulatory infrastructure upon which they operate is decades
    old and fraught with unnecessary compliance costs.


    Banks maintain centralized, non-interoperable databases on outdated, clunky COBOL
    mainframes. They rely on multiple intermediaries to process payments, each managing
    their own, siloed ledgers that must be reconciled against each other through time-consuming
    fraud-prevention mechanisms.


    All these inefficient systems, instituted to address the problem of trust, merely
    add to the cost of trust in the system.'
  - '[PAGE 84]


    # Is Blockchain Too Risky to Operate on a Mass Scale?


    "Why, in a digital age, can’t we move money around 24/7? Because we have bad middleware,
    and that bad middleware is existing financial infrastructure,” says Charles Cascarilla,
    CEO of Paxos, which is building blockchain-based trading infrastructure for the
    financial system.


    In addition, there''s the massive political risk that comes with banks'' involvement
    in our payments system.


    The reason why it was deemed necessary for governments to bail out the world’s
    banks to the tune of trillions of dollars in 2008 was that not doing so would
    thrust our highly complex payments systems into chaos. The global economy would
    have had a cardiac arrest. It’s that threat of bringing us all down with them
    that gives “too-big-to-fail” banks hold over policymaking.


    Many central bankers, still starting from the fallout from that crisis, know this
    is the problem. Many see real benefits in removing banks from payments and recognize
    digital currencies can help. The question is how to get there without fomenting
    chaos.


    # Gradual Solutions


    One solution: a phased approach over time. You don’t provide CBDC to everyone
    at first; you start with large non-bank financial institutions, follow it up with
    a certain class of large corporations, then move to smaller businesses, and only
    make it available to individuals as a last step.


    Another solution: the introduction of a unique, central bank-determined CBDC interest
    rate. This would be an addition to the central bank toolkit for managing money
    supply, which currently hinges on a combination of a policy rate imposed on banks’
    reserves and interventions in the two-way market for buying and selling government
    securities with banks.


    A separate CBDC interest rate would provide a means to calibrate the flow of money
    between banks and digital fiat wallets, potentially within a long-term plan to
    gradually shift it from the former to the latter without overly disrupting the
    system.'
