    # Cryptocurrencies and Blockchain Technology


    A “standout challenge” in this regard “is the matter of jurisdiction,”” said Mnyandu.
    "Blockchain and cryptocurrencies are cloud-based products and services, so now
    the biggest issues facing regulators is whether they have the appropriate jurisdiction
    to pass laws and regulate,” he said. "At what point do you determine and say this
    is a ‘South African’ blockchain?”


    The only way to address this, he said, is by collaboration between governments
    and sectors. Regulators across Africa need to work together to come up with solutions
    that transcend borders.


    Bright Tibane, a senior associate in the same department at Bowmans Law Firm,
    said that one way of doing this was by adopting an approach called sandboxing.
    This practice creates a regulatory framework that forms the space for innovators
    to break the rules, and then allows them to demonstrate that breaking the rules
    has not been detrimental in that particular case. The United Kingdom and Singapore
    are following this approach similar. South African authorities are looking to
    adopt something similar. “It’s a way of ensuring what’s going on, testing innovations
    in a safe space, and then that enables you to regulate efficiently,” said Tibane.


    In addition to South Africa, Uganda has shown proactivity in its approach to regulation,
    said Tibane. "These are not things they’re just sitting on—they are actually looking
