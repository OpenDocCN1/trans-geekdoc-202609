    # Cryptocurrencies and Blockchain Technology


    As Sheila Bair, the former Chair of the Federal Deposit Insurance Corp., argued
    in a recent op-ed, this new interest rate tool could enhance monetary policy,
    as central banks could use it to either stimulate or cool the economy. By directly
    affecting the rate at which people''s currency holdings grow, incentives to save
    or spend could be directly implemented.


    Still, I don''t see developed-world central banks rushing to do this. Their relationships
    to commercial banks are too entrenched. And, for now at least, it''s hard for
    many in that system to even conceive of a monetary system that doesn''t revolve
    around them.


    But it''s different for developing-world central banks. For too long those countries''
    monetary policy has been driven by the policies of the world''s biggest central
    bank, the Federal Reserve. If the Fed cuts rates, foreign, inflationary money
    floods into their bank-centric financial systems; if it hikes rates, they face
    deflationary risks. In theory, a fiat digital currency could allow them to offset
    those forces.


    Now, of course, all of this could go wrong. A new tool for profligate governments
    to debate their citizens'' money does not look desirable. For proof, look no further
    than the rogue state of Venezuela and its new, centrally controlled digital currency,
    the petro.


    Yet that may also be what ultimately gives bitcoin, or some other altcoin, a chance
    to shine, especially as Layer 2 solutions start to help with scalability and liquidity.
    Central banks can''t put the cryptocurrency genie back in the bottle. Their potential
    embrace of digital fiat currencies will happen in an era when their citizens can
    shift to these new decentralized solutions, with increasing ease.


    Whether they take over the world or not, the power of the market in a more open
    system of currency choice will mean that cryptocurrencies will hopefully play
    a vital role in forcing these politicized, centralized institutions to better
    manage their people''s money.'
