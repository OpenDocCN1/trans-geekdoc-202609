    央行的外汇管制政策及相关流程。这并非技术问题，而是监管问题。尽管如此，从运营者的角度来看，分式账本技术（DLT）可以通过让所有参与者实时获知结算头寸，帮助降低跨境转账成本、降低流动性管理成本并最大限度地减少外汇风险。这些效率的提升对银行来说是极好的，但尚不清楚这些利益是否以及将如何传递给消费者。这里确实存在潜力，但我们尚未在实践中看到其发挥作用。而且这通过现有的技术解决方案可能是可以管理的。


    # 隐私、复杂性与可扩展性


    隐私是金融包容领域一个主要且日益增长的挑战。此外，建立适当的隐私控制会为非中心化管理的系统增加复杂性。SWIFT 是代表其成员银行处理跨境支付的实体，近期在其
    11,000 家成员银行中的 28 家中完成了一项使用 DLT 技术的、记录详尽的概念验证。尽管 SWIFT 报告测试进展非常顺利，但它认为在准备好生产级应用之前，DLT
    方面仍需进一步进展。测试表明，可以使用 DLT 简化往来账户（nostro accounts）的结算。但隐私是一个问题：仅用 28 家银行进行测试就需要 528
    个子账本来维护信息的机密性。SWIFT 计算，将其推广到全体成员将需要创建 100,000 个子账本，这将是一项管理挑战。这种复杂性对处理的可扩展性很高，而在这一领域，目前的数据库解决方案优于
    DLT。使用今天的技术，Visa 每秒可以处理 24,000 笔交易。我能找到的任何 DLT 能达到的最高水平是每秒 1,500–2,000 笔。DLT 的顺序性质以及由于错误或异步输入导致账本分叉（不兼容的版本）的可能性，随着解决方案的扩大引入了额外的低效率。


    # 加密货币与区块链技术


    # 与现金经济的交汇


    在金融包容（旨在让穷人纳入金融体系）中，新技术与现金经济交汇的方式存在重大挑战。无论资金如何以数字形式在全球范围内传输，穷人人都能够以现金形式访问和使用他们的财务资源，至少在更好的数字支付解决方案出现之前是如此。移动货币在近年来引起了大量关注，因为它在改善穷人金融包容性方面发挥了重要作用。但移动货币只是部分技术解决方案。它主要是一项现金分发业务——现金入/出的接口对于让运营现金经济的人能够使用该系统至关重要。目前有许多有趣的实验正在进行，以转向更数字化的特征。例如，使用智能手机和二维码可以大幅降低支付服务的成本。但这些解决方案严重依赖于人们拥有智能手机和银行账户，这在世界许多较贫困地区尚未实现。而且智能手机和二维码并不需要
    DLT。移动网络运营商在全球范围内拥有 290 万活跃的现金入/出代理商，目前非常有效地触达了穷人，这得到了世界银行《全球普惠指数》（Global Findex）的明确验证。他们正不断增加如国际汇款等用例。GSMA
    估计，通过移动货币向非洲汇款的成本可以减少半之。但这是基于现有技术运行的。尚不清楚 DLT 是否能让其运行得更好，特别是在 3G 网络和电力供应都不太稳定的环境中。


    # 救济


    最后，任何 DLT 解决方案都必须包含与救济和消费者保护相关的机制，无论是承担欺诈责任，还是帮助消费者寻找丢失的付款项或错误的数据条目。这并不必然是分布式账本运营者的责任，但需要在系统参与者之间达成并一致地执行参与规则。救济对于建立消费者信心和信任至关重要。责任制还强制了良好的供应商实践：Visa
    和万事达建立了强大的欺诈管理流程，将这一万亿级规模行业中的欺诈率限制在几个基点以内。尽管存在专注于破解系统的大型且复杂的犯罪集团。


    在金融包容领域，我们尚未看到比具有受信誉的第三方管理者的现有技术解决方案更具 DLT 方面说服力的业务模型。Ripple 可能是唯一的例外，得益于它的业务模式，但它基本上是一个受管理的第三方解决方案，目前与金融包容之间还没有明确的联系。


    这并不是说整合 DLT 不会出现。我们认为可能突破的地方主要在分布式、实时信息重要的领域：供应链金融、农业价值链、身份验证、个人数据存储、结算和结算、抵押品和土地登记，可能还有信用报告。即使是这些用例也需要对上述某些问题给出答案。关键在于理解引入
    DLT 所涉及的权衡，并对你试图解决的问题有清晰的认识。在创建了确定技术是否行的行的点之后，进行成本效益分析变得变得重要，以看看它与现有技术解决方案相比是否有任何收益。直接跳入
    DLT 让你面临着将解决方案置于问题之前的风险。


    # 区块链在非洲的案例研究


    Thalia Holmes


    Thalia Holmes 是南非国际事务研究所（South African Institute of International Affairs）的记者。

