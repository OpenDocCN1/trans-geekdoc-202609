    ## 加密货币与区块链技术


    没有中央机构，没有老板，也没有管理层。但它运行良好。比特币区块链是一个去中心化的记账系统，而所谓的“矿工”则是记账员。本文不会对这一机制提供详细解释；请参阅
    Berentsen 和 Schär (2018)。然而，我们想强调，数字资产所有权的去中心化管理是一项根本性的创新。它具有颠覆现有支付基础设施和金融系统的潜力。总而言之，它可能会影响所有涉及账务管理的企业和政府机构。


    加密货币的特殊之处在于它结合了虚拟货币的交易优势与去中心化交易处理的系统性独立。此外，与黄金一样，新比特币的产生具有竞争性。任何人都可以通过下载相关软件并向系统贡献来参与新比特币的产生。然而在实践中，少数大型矿工主导了挖矿过程。原因是竞争已变得激烈，只有拥有高度专业化硬件和廉价电力渠道的大型矿场才能从挖矿中获利（Berentsen
    and Schär, 2018）。


    ## 中央银行电子货币的理由


    每种形式的货币都有其优缺点。这就是为什么许多形式的货币并存的原因。现金的优点是用户可以保持匿名，且对现金支付系统具有无许可访问权限。特别是，用户使用现金无需开设银行账户。此外，现金交易的去中心化性质使得现金支付系统非常稳健。通过攻击支付基础设施无法摧毁它，而且参与无需满足任何先决条件。相比之下，中心化的支付系统是脆弱的。如果中心化的支付处理者受到攻击，整个系统可能会停滞。


    现金还有另一个重要优点。使用现金时不存在信贷关系。任何债务都会立即结算。因此，存在


    ## 区块链在大规模运营上是否风险太大？


    没有交易对手风险，交易是最终的，人们即使互不信任也可以进行交易。相比之下，如今的电子货币（商业银行发行的活期存款）涉及交易对手风险。商业银行存款是对物理货币单位（现金）债权的基于账本的虚拟化。这简单来说意味着银行存款是发行人的负债，而持有银行存款的客户是在向其各自银行提供贷款。现金的缺点是买方和卖方必须物理上出现在同一地点，这使其在在线商务中变得不切。商业银行存款等虚拟货币的处恰恰在于它允许物理分离的代理之间进行支付。因此，虚拟货币开启了新的商业机会。


    现金也是私人金融系统之外储蓄的唯一流动资产。我们所说的流动性是指可以直接交换货物和服务的资产。例如，黄金也是私人金融系统之外的储蓄手段。然而，根据我们的定义，它不是流性的，因为它（大多数情况下）无法直接交换商品和服务。


    我们认为，由信任方发行的可在私人金融系统外储蓄的虚拟资产需求巨大。为了支持这一观点，我们追踪了 1980 年到 2017 年瑞士法郎（现金形式）占 GDP
    的比例。我们可以区分三个阶段。第一阶段是 1980 年到 1995 年，期间金融创新取代了现金作为交换媒介或价值载体。瑞士人口越来越多地开始使用借记卡和信用卡支付。第二阶段是
    1995 年到 2008 年，卡支付和网上银行进一步扩大，但现金的使用并未进一步下降。


    从 2008 年到 2017 年，我们看到流通现金迅速增加。我们坚信，这种增加的原因之一是 2007-08 年的金融危机以及随后的欧元危机。正如 Berentsen
    和 Schär (2016) 所讨论的，2007-08 年的金融崩溃和欧元危机引发了中央银行的大规模干预，并大幅增加了许多国家的债务 GDP 比率。这些事件削弱了人们对金融系统的信任、对中央银行作为最后贷款人职能力的信任，以及对政府在不采取激进措施（如没收性税或强制转换，如希腊退出欧元的讨论所代表）的情况下防止另一场金融危机能力的信任。


    2008 年之后，对现金的需求迅速增加，因为它是不面临交易对手风险的情况下持有瑞士法郎的唯一手段。现金被用作防止金融机构破产的保险。例如，在金融危机期间，瑞士最大的银行
    UBS 必须由政府和瑞士国家银行进行救援。


    我们认为，电子形式的中央银行货币有强有力的理由，而且很容易实施。中央银行只需允许家庭和企业在他们那里开设账户，这将允许他们使用央银行电子货币而非商业银行存款进行支付。如前所述，其主要优点是央银行电子货币满足了人们对虚拟货币的需求，且不面临交易对手风险。但还有额外的好处。


    ## 现金有很多优点，但其终结可能临近


    由于政治和技术原因，许多政治家和经济学家谴责现金的使用。根据 Berentsen 和 Schär (2016)，这些现金批评者的论点基本上基于三个主张：第一，现金的使用效率低下，且比电子支付贵得多。第二，现金助长了犯罪并便利洗钱和逃税。第三，现金通过限制中央银行将负名义利率作为政策选项的使用能力，阻碍了货币政策。


    技术原因同样适用：在不久的将来，将开发出一种密切的现金替代品，它将迅速淘汰现金作为支付手段。一个竞争者是比特币或其他


    ## 区块链在大规模运营上是否风险太大？


    虽然加密货币仍有很多缺点，如高额手续费、扩展性问题和采用率低，但这些问题可能会随着大规模链下支付网络（例如比特币闪电网络）和其他扩展解决方案的出现而迅速消失。


    如果现金的使用由于政治原因受到限制，或因技术创新而消失，就会出现一种有些奇怪的情况：家庭和企业无法获得法定货币。今天，在大多数国家，人口只能通过现金使用法定货币支付。如果现金消失，人们被迫使用私人货币进行所有支付。通过提供交易账户，中央银行允许普通大众以电子形式持有法定货币。大部分人口将将其视为现金的密切替代品，这将更容易告别现金。


