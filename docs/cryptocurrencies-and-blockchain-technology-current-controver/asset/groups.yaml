    digital and over half percent of the country’s adult population holds an M-Pesa
    digital wallet,” she said in a note.


    With the most mature mobile money market in Africa, Kenya is leveraging its existing
    networks to allow for the transactional use of Bitcoin in the country. This is
    allowing for an easier exchange between fiat and cryptocurrency.


    The lack of an official or formal bitcoin payment gateway has done little to dampen
    the adoption rate of cryptocurrencies in Kenya. Quite the opposite in fact,” said
    Michael Kimani, chairperson'
