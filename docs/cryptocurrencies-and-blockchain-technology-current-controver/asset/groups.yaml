    from splitting with the wider network and creating your own version of bitcoin.
    This is what''s known as a “Fork,” and it''s already happened multiple times in
    the past (that''s what competitors such as Litecoin and Dogecoin are). The difficulty
    is persuading other people to follow you. A currency used by just one person isn''t
    much of a currency.


