    among participating entities is met, the parties involved in a contractual agreement
    can be automatically made payments as per the contract in a transparent manner.


    Smart Property is another related concept which is regarding controlling the ownership
    of a property or asset via blockchain using Smart Contracts. The property can
    be physical such as car, house, smartphone etc. or it can be non-physical such
    as shares of a company. It should be noted here that even Bitcoin is not really
    a currency—Bitcoin is all about controlling the ownership of money.

    [...]


    ## Existing Market


    Blockchain technology is finding applications in both financial and non-financial
    areas that traditionally relied on a third trusted online entity to validate and
    safeguard online transactions of digital assets. There was another application
    “Smart Contracts” that was invented in 1994 by Nick Szabo. It was a great idea
    to automatically execute contracts between participating parties. However, it
    did not find usage until the notion of crypto or programmable payments came into
    existence. Now two programs, blockchain and smart contract, can work together
    to trigger payments when a preprogrammed condition of a contractual agreement
    is triggered. Smart Contracts are really the killer application of the cryptocurrency
    world.


    Smart contracts are contracts which are automatically enforced by computer protocols.
    Using blockchain technology it has become much easier to register, verify and
    execute Smart Contracts. Open source companies like Ethereum and Codius are enabling
    Smart Contracts using blockchain technology. Many companies which operate on bitcoin
    and blockchain technologies are supporting Smart Contracts. Many cases where assets
    are transferred only on meeting certain conditions which require lawyers to create
    a contract and banks to provide escrow service can be replaced by Smart Contracts.


    Ethereum has created lot of excitement for its programmable platform capabilities.
    Ethereum allows anyone to create their own cryptocurrency and use that to execute,
    pay for smart contracts. Ethereum itself has its own cryptocurrency (ether) which
    is used to pay for the services. Ethereum is powering a wide range of early applications
    in areas such as governance, autonomous banks, keyless access, crowdfunding, financial
    derivatives trading and settlement using smart contracts.


    ## Are Blockchain-Powered Cryptocurrencies Better than Hard Money?


    Also, there are a number of blockchains in existence to support a wide range of
    applications—not just cryptocurrency. Currently there are three approaches in
    industry to support other applications and also to overcome perceived limitations
    of Bitcoin blockchain:


    - **Alternative Blockchains** is a system of using the blockchain algorithm to
    achieve distributed consensus on a particular digital asset. They may share miners
    with a parent network such as Bitcoin’s—this is called merged mining. They have
    been suggested to implement applications such as DNS, SSL certification authority,
    file storage and voting.

    - **Colored Coins** is an open source protocol that describes a class of methods
    for developers to create digital assets on top of Bitcoin blockchain by using
    its functionalities beyond digital currency.

    - **Sidechains** are alternative blockchains which are backed by bitcoins via
    Bitcoin contract—just as dollars and pounds used to be backed by gold. One can
    possibly have thousands of sidechains “pegged” to Bitcoin, all with different
    characteristics and purposes—all of them taking advantage of scarcity and resilience
    guaranteed by the Bitcoin blockchain. The Bitcoin blockchain can in turn iterate
    to support additional features for the experimental sidechains—once they have
    been tried and tested.


    Companies such as IBM, Samsung, Overstock, Amazon, UBS, Citi, Ebay, Verizon Wireless
    to name a few are all exploring alternative and novel uses of the blockchain for
    their own applications. Nine of the world’s biggest banks including Barclays and
    Goldman Sachs have recently (Sept. 15, 2015) joined forces with the New York based
    financial technology firm R3 to create a framework for using the blockchain technology
    in the financial market. This is the first time banks have come to work together
    to find applications of blockchain technology. Leading banks like JPMorgan, State
    Street, UBS, Royal Bank of Scotland, Credit Suisse, BBVA and Commonwealth Bank
    of Australia have joined this initiative.

