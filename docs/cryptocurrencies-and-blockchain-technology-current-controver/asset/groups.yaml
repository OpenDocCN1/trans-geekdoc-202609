    # 加密货币与区块链技术


    # 治理、规则、监管


    金融服务领域受到严格监管，这很有道理：对移动资金的组织有重要的限制，以确保他们没有协助犯罪或恐怖活动。金融部门稳定以及隐私也是重要的考量。虽然区块链可以创建双方同意交易的不可篡改记录，但在金融领域，我们还必须确保入账的信息是合法且符合相关法规的。因此，金融领域区块链的参与者可能是获得许可的交易对手，使用许可账本，或由第三方供应商设置其他成员加入网络时同意的规则。在这种背景下，尚不清楚部署
    DLT 是否能获得显著收益，因为问题在于治理和规则，而不是技术。


    # 监管


    在许多金融包容用例中，降低速度的因素不是技术，而是监管。许多支付系统（包括跨境系统）是实时运行的。降低速度的是监管要求，主要与反洗钱和反恐（AML/CFT）或外汇管制有关。例如，在南非，可以使用实时清算在南非境内进行即时转账，但如果我向该国汇款，可能需要几天才能到达我的账户。我最近使用
