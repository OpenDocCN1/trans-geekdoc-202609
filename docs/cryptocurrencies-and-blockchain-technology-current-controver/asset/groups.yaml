    # 加密货币与区块链技术


    和硬币之所以能作为货币，是因为人们在经济中中使用它们的方式。


    货币在经济中承担着三种功能：交换媒介、价值储存和计价单位。为了成为一种有效的交换媒介，货币必须在交换商品和服务时被广泛接受。比特币可以作为有限数量商品的交换媒介。当理查德·布兰森（Richard
    Branson）接受了温克莱沃斯兄弟提供的比特币以换取乘坐他航天器的机会时，比特币作为交换媒介的信誉得到了增强.¹ 尽管接受比特币支付的公司数量一直在增加，但这些交易仍然仅占经济的极小部分。此外，虽然比特币被设计为点对点支付系统，但消费者和公司之间发生的许多比特币交易都涉及“中间人”，他们通过将比特币兑换为传统货币来促进交易。²
    交易本身在时间和金钱上可能成本高昂——平均确认一次交易需要 78 分钟（尽管可能耗时长），完成一次交易需要花费 28 美元.³此外，人们通常倾向于使用随时间推移价值稳定的交换媒介（与服务或一篮商品相比）。例如，联邦储备委员会的通胀目标是每年
    2%。如果实现这一目标，美元的购买力每年将损失 2%。联邦储备委员会认为这种通胀水平是“价格稳定”；即通胀率足够低且稳定，以至于对人们的经济决策几乎没有影响。然而，比特币的价值在其历史上一直并不稳定。


    由于货币还充当价值储存的角色，这种价值的稳定性变得更为重要。近年来，比特币的价值增长非常剧烈。现在，当价格上涨时，波动的价格似乎对货币的价值储存功能构成威胁；但当价格下跌时，人们会想起稳定价值是价值储存的一个重要方面。例如，比特币曾多次出现价格剧跌的时期，包括
    2017 年 11 月 29 日早上价值下跌了 20%。


    # 区块链驱动的加密货币比硬货币更好？


    事实上，比特币在 2017 年期间经历了五次至少 20% 的价格跌幅（市场观察者将其描述为“熊市”）。⁵ 经济学家罗伯特·希勒（Robert Shiller）表示，这种波动性损害了比特币的价值储存信誉，并是其作为货币被接受的主要障碍。⁶


    由于黑客攻击、威胁和其他安全问题，价值储存功能也被削弱了。⁷ 例如，黑客击垮了门头交易所（Mt. Gox），该交易所在 2014 年是最大的比特币交易所，同时有
    85 万枚比特币丢失（按每枚 17000 美元计算价值 140 亿美元）。⁸ 2017 年 12 月 7 日，黑客盗走了价值 7000 万元的比特币。⁹ 比特币者无法将比特币作为存款存在银行；相反，业主必须像联邦存款保险公司（FDIC）和国家信用联盟管理局（NCUA）为银行和信用联盟存款存款那样来持有比特币。


    货币还作为计价单位，即衡量商品服务的通用标准。由于比特币价格在市场开放期间每天波动剧烈，零售商必须频繁重新计算其比特币价格，这可能会困扰买卖双方。此外，比特币价格在不同交易所之间波动，且比特币在不同交易所的交易价格往往不同，这进一步复杂了卖者的定价决策.¹⁰
    最后，由于一个比特币相对于普通商品的价格成本高昂，要求商户对大多数商品的比特币价格报价保留四到五位小数。例如，如果一个比特币的价格为 11000 美元，那么一个
    2 美元的糖棒（以比特币或 BTC 计）的价格将是 0.00018 BTC，或 1.8 x 10⁻⁴ BTC。大多数现代会计系统支持价格保留两位（而不是五位）。简而言之，虽然比特币是一种虚拟货币，但它缺乏一些可能使其更有用的关键特征。


    # 比特币是金融投资吗？


    货币与金融资产之间的界限并不总是清晰。事实上，货币是一种金融资产——一种流动性极高（用于支付）但通常利息很少或没有的资产¹¹¹ 其他类型的金融资产流动性较低，但提供了获得回报的潜力。例如，人们购买股票和债券是预期它们能产生利息、获得股息或在未来以更高的价格卖出资产。虽然比特币最初是为了作为货币而开发的，但那些将比特币作为投机性投资的人的需求量明显增加.¹¹²
    投资者的这种投机行为导致比特币价格上涨之快，以至于一些金融专家称之为“金融泡沫”。泡沫的一种定义是资产价格偏离了其内在的基本价值。想象你用口香糖吹泡泡——随着你吹入越来越多的空气，泡泡变得越来越大，但在某一点压力超过了口香糖的承受能力。同样，金融泡沫发生于对资产的需求不断增加导致其价格不断推高，远高于其内在价值时。随着价格上涨，当前投资者享受资产价格上涨，并可能倾向于购买更多。其他人担心错过了机会，可能会选择投资，假设趋势将持续。泡沫通常会破灭——即价格大跌，为持有资产的人带来巨大损失。


    比特币价格上涨得有多快？虽然价格在这一年内波动剧，但比特币在 2017 年结束时的涨幅接近 1400%.¹¹³ 金融专家认为投资者对比特币的兴奋类似于投资者对
    20 世纪 90 年代科技股和 2000 年代房价的反应。在这两种情况下，投资者在价格攀升后仍继续购买。其他人担心错过潜在利润，被吸引进来——从而将价格推得更高。


    摩根大通银行首席执行官杰米·戴蒙（Jamie Dimon）和被被认为是世界上最成功投资者之一的沃伦·巴菲特（Warren Buffett）都称比特币为泡沫¹¹⁴
    戴蒙曾表示它比 17 世纪代臭名昭著的郁金花泡沫还要糟¹⁹ 巴菲特说比特币很难定价，因为它不是产生价值的资产。股票代表对实际资本的所有权，并通常提供股息收入流；比特币不提供资本也不提供收入。预测了近期两个两个投机市场（科技股泡沫和住房泡沫）的诺贝尔奖经济学家罗伯特·希勒也称比特币为泡沫¹²⁰
    希勒猜测竞争性加密货币取代比特币并将其价值推至零的可能性¹¹² 当然，泡沫在发生时很难发现。投资者不可避免会对资产的“合理”价值产生分歧，预测泡沫何时破灭更加困难。前联邦储备委员会主席艾伦·格林潘（Alan
    Greenspan）于 1996 年 12 月 5 日暗示，人们通过投资过值的科技股正在进行“理性狂热”。这个问题在今天似乎仍然适用：“但我们如何知道何时理性狂热过度推高了资产价值，导致其随后受到意之外且持续的收缩？”在格林潘提出这个问题后，股票价值继续以更快的速度持续上涨了数几年。2000
    年 1 月 10 日通常被视为价格峰值，随后科技股泡沫破裂，许多投资者损失了大量财富。


    # 结论


    比特币具有使其能够作为货币运行并使其成为一种实用的支付方法的特征。这意味着将比特币转移给其他人或其他企业相对容易，即使对于国际交易也是如此。然而，比特币的其他方面使其在日常交易中不那么理想，包括安全问题和剧烈的价格波动。货币的价值由供需决定。虽然由于人们对其未来价值的投机比特币的需求一直在增长，但比特币的供应被设定为以僵化的、预定的速率增长。因此，随着比特币需求的波动，其价格也随之波动。


