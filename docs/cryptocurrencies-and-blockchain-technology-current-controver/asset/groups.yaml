    could be traced back to an identified e-wallet. Moreover, AML risk analysis and
    report-generating mechanisms could be integrated within the crypto system instead
    of monitoring only the entry and exit points.


    As cryptocurrencies gain mainstream public attention and more individuals put
    their skin in the game, addressing AML challenges has become crucial. At the core
    of the crypto system, blockchain technology’s inherent characteristics offer a
    platform to address, if not overcome, these challenges altogether. Evidently,
    there will be a price associated with such a move in the form of higher transaction
    costs and less anonymity. But it’s a price worth paying for the purpose of allowing
    cryptocurrencies to carry onward and change the face of money as we know.


    With the cost of global AML measures currently estimated at over $10 billion annually,
    the Israeli authorities as well as law and policymakers worldwide would be prudent
    to look before they leap, ensuring their good intentions to protect financial
    intuitions and citizens don’t end up blocking a technology that could provide
    a return on investment that far surpasses the price of transitional uncertainty.

