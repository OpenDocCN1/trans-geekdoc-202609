    # How Cryptocurrencies Become Real Currencies


    Brandt Redd


    Brandt Redd has an MBA in organizational communication from Brigham Young University
    and works as a technology strategist for EdMatrix, an organization that seeks
    to make learning an enjoyable experience.


    Today I''m diverging from the education theme to write about cryptocurrency. I
    am provoked, in part, by this quote from Alan Greenspan:


    > It [Bitcoin] has to have intrinsic value. You have to really stretch your imagination
    to infer what the intrinsic value of Bitcoin is. I haven''t been able to do it.
    Maybe somebody else can.


    Now, Greenspan should know better than to say something like that. As a fiat currency,
    the dollar doesn''t have any more intrinsic value than Bitcoin. And that’s why
    I decided to write about this. Most of the supposed “Bitcoin Primers” out there
    are more confusing than helpful. They don''t explain how money works or how cryptocurrencies
    like Bitcoin satisfy the requirements to become a currency.


    # What Makes a Currency?


    Currency is a form of money that accepted by a group of people to exchange value.
    A functional currency must have three important characteristics:


    - Scarcity—If you have too much of the currency, it’s value will plummet toward
    zero. So, there must be a limited supply.


    "Bitcoin—What Makes a Currency?” by Brandt Redd, Of That, July 30, 2014, https://www.ofthat.com/2014/07/bitcoin-what-makes-currency.html.
    Licensed under CC BY 3.0 US.


    # Cryptocurrencies and Blockchain Technology


    - Verifiability—You must be able to verify that a unit or token of the currency
    is valid and not a forgery or imitation.

    - Availability—Despite scarcity, there still must be a stable supply of the currency
    to match growth in the corresponding economy.


    Precious metals like gold and silver were the first common currencies. They meet
    all of the foregoing criteria. Gold is scarce; there''s a limited amount of it
    available thereby end a small amount of gold with considerable value. It''s verifiable;
    gold has certain characteristics, such as density, malleability and color, that
    make it easy to distinguish from other materials. And gold is available; while
    it is not common, gold mines still offer a consistent supply of the material.


    One of the difficulties with early uses of gold currency was the complexity of
    exchange. Merchants had to use a balance or scale to determine how much gold was
    being offered. To facilitate easier exchange, governments, banks, and other trusted
    organizations would mint coins of consistent size and weight. This would allow
    someone to verify the value of a coin without resorting to a balance.


    # Fiat Currency


    “Fiat” means, roughly, “because I said so.” Fiat currency has value simply because
    some trusted entity says it does. It need not have any intrinsic value.


    The first fiat money was the banknote. When making a large payment it could be
    inconvenient or dangerous to move large quantities of coins or bullion. Banks
    solved this problem for their customers by issuing banknotes. A banknote is a
    paper that a bank or other entity promises to exchange for a certain amount of
    coin, gold, or other currency. The bank could keep the corresponding gold locked
    away in a vault and people could carry more convenient paper certificates.


    Beginning in 1863, the United States began issuing gold certificates as a form
    of paper money or banknote. Certificates


    # Are Blockchain-Powered Cryptocurrencies Better than Hard Money?


    like these were backed by stockpiles of gold held in places like Fort Knox. European
    countries did similar things. With the stresses of late 19th century wars and
    World War I that followed, countries discovered that they could issue more banknotes
    than their corresponding stockpiles. This led to a lot of instability until countries
    figured out how to regulate their currencies. But, by the end of the Great Depression,
    pretty much economically developed country had fiat currencies controlled by a
    central bank. While here backed by gold or other reserves, the value of these
    currencies is not directly tied to the value of gold.


    Here''s how the Federal Reserve system works: The Federal Reserve Bank creates
    the money. Money is issued as currency (the familiar US coins and bills) but also
    simply as bank balances. Indeed, far more money exists as bank records in actual
    physical currency. Originally this was done through careful bookkeeping in bank
    ledgers. Now it''s all done on computers. The money is issued in the form of low-interest
    loans, primarily to banks, which then lend the money to their customers and to
    other, smaller banks. Other central banking systems like the European Central
    Bank work in a similar way.


    So, how does fiat money meet our-


    - Scarcity: Central banks can create as much money as they think.

    - Verifiability: Cryptocurrencies rely on public-key cryptography to ensure that
    only the owner of a currency can initiate its transfer.

    - Availability: Those who host a copy of the block chain have to perform the cryptographic
    calculations necessary to verify transaction validity and prevent fraud. Those
    who do fastest are periodically rewarded through the creation of new Bitcoin balances.
    Because of the reward, maintaining the block chain is known as “mining” and a
    small industry of Bitcoin mining software and devices has developed. All users
    of cryptocurrency benefit from this because the more secure the currency becomes
    due to the duplication of records and validation.


    This is a tremendously clever scheme because it simultaneously ensures a consistent
    supply of currency, decentralizes operation, and secures the network against manipulation
    by creating thousands of replicas of the block chain.


    # Potential Impact


    The true value of any currency is the willingness of a community of people to
    use it for daily transactions. The three requirements, Scarcity, Verifiability,
    and Availability, combine to cause people to trust a particular currency. When
    that trust is lost you get bank runs, hyperinflation, or simple destruction of
    wealth. Meanwhile, the community rushes to find a new currency.


    The advent of the internet with myriad handheld devices capable of initiating
    transactions makes it possible for multiple currencies to coexist. For the first
    time in history, people may have a choice among currencies to use in daily transactions.
    Central bankers, and the sovereign countries that endow them with their power,
    are appropriately worried. An industry that has historically been immune to competition
    no longer has that protection.


    I think this is a good thing. Just like any other competitive market, competition
    should incentivize good behavior both from established central banks and from
    upstart cryptocurrencies.

