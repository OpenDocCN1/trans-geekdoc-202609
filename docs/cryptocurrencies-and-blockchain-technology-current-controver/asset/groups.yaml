    # 加密货币与区块链技术


    通过提供常设机制来提供必要的临时流动性，商业银行可以快速且简单地通过抵押获得中央银行货币。


    ## “全民央行货币”简化了货币政策并使其更加透明


    央银行可以简单地将这些账户支付的利率作为其主要政策工具。如果市场不进行分割，意味着每个人都能获得电子中央银行货币，那么这些账户的利率将是经济中的最低利率。这是因为央银行电子货币将成为经济中流动性最高的资产，且此类货币的持有者没有任何交易对手风险，因为中央银行不会变得流动性枯竭。目前许多央行正在讨论利率正常化的可能性。由于为了应对金融危机创造了海量流动性，公开市场干预等标准工具已失效，且目前讨论的所有工具都有一个特征，即央行以某种形式对准备金支付利（见
    Berentsen, Krenzlin, and Müller, 2018）。这些支付存在政治经济学问题，因为它们只支付给少数能够获得央银行电子货币的金融中介。公众可能不会认为此类巨额支付是公平或有益的，并且极极可能会引发政治争议，这有可能影响央行的独立性（见
    Berentsen and Waller, 2014）。央银行电子货币是一种避免此类利息支付引发政治动荡的优雅方式，因为它允许全体人口都能获得这些利息，而不仅仅是一小少数商业银行。


    ## “全民央行货币”需要的行政成本较低


    总的来说，我们认为实施“全民央行电子货币”是简单的，因为这些账户只能用于支付。无法获得信贷，因此几乎不需要监控。（当然，某些标准法规仍然适用。）所有交易都必须通过电子方式启动。此外，许多央行已经运行着一套支付基础设施。例如，瑞士国家银行已经为其员工维护着这样的设施。全民央行货币将意味着扩大现有基础设施以允许额外的账户持有者。然而，并不要求由央行自己提供基础设施。法律将强制商业银行为其每个客户开设至少一个央行货币账户。这将允许客户使用其现有的网上银行访问从其央行货币账户发起交易。这些账户必须由商业银行在资产负债表之外维护。因此，在银行破产时，这些账户不计入银行资产。


    这一想法与“芝加哥计划”（Chicago Plan）¹¹²有关，但在重要方面有所不同。芝加哥计划的一个关键要素是通过对商业银行存款征收100%的准备金来消除部分准备金制度。“全民央行货币”并没有消除部分准备金制度。它通过要求所有代理人都能获得央银行电子货币来对其进行修正。商业银行可以继续提供银行存款，没有人被强迫使用央银行电子货币。


    在这一建议得以实施之前，还有许多需要仔细讨论的开放性问题。以瑞士为例，必须决定谁可以在瑞士国家银行开设账户。是否只有瑞士人口或居住在海外的人们才能拥有此类账户？作为第一步，狭范围地定义用户群以首先获得运行该系统的经验是有意义的。此外，起初增加一个上限来限制这些账户中可以持有的金额将是明智的。这种上限的好处是，它将允许瑞士国家银行获得经验，特别是在当发生大规模银行挤兑时为私营银行系统融资所需的工具方面。


    # 加密货币与区块链技术


    ## 反对央行发行加密货币


    加密货币的区分特征是交易处理的去中心化本质，这使用户能够保持匿名并允许无许可的访问。在本节中，我们认为，尽管从技术角度来看发行加密货币是简单的，但央行发行加密货币并没有意义。


    理论上，央行可以很容易地引入央行加密货币。存在如以太坊的 ERC20 或 ERC223 代币标准，这些标准可以用于创建与以太坊基础设施兼容的新同质化代币。或者，人们可以在现有加密资产（如比特币）的分数上附加价值组件。这种额外的价值——在这种情况下是法币——将是比特币特定部分（或更准确地说是未花费交易输出）的一部分，并可以在比特币区块链上进行表示和交易。这通常被称为“彩色币”（colored
    coins）。最后，央行可以开发一条全新的区块链。所有这些方法在实施上都非常简单，并允许在公共区块链上发行央行加密货币。


    为了确保加密法币单位与央行储备之间的等值，央行必须愿意平价买卖任何数量的此类代币。价值将取决于央行的信誉；但如果央行决定发行央行加密货币，它将有手段这样做。事实上，兑换机制可以与不同面值的现金进行比较，央行也有类似的主张.¹¹³


    然而，加密货币的关键特征对央行来说是一个红旗。也就是说，没有任何声誉良好的央行会有动力发行匿名虚拟货币。声誉风险将太高了。想象一个假设的“联邦币”被毒品集团用于洗钱，或被恐怖组织用于获取武器。此外，商业银行


    ## 大规模运营区块链是否风险太大？


    将会理所当然地开始询问为什么他们必须遵循 KYC（了解您的客户）和 AML（反洗钱）法规，而央行却通过发行无许可访问的匿名加密货币来破坏这些法规的效果。此外，加密货币仍然是一种非常年轻的技术，存在巨大的操作风险。总的来说，我们认为对“联邦币”或其他任何央行加密货币的呼吁是天真的。


    通常情况下，一旦我们移除加密货币的去中心化本质，它就不剩什么了。由央行垄断发中心化虚拟货币是电子央行货币。值得注意的是，以中心化方式发行虚拟货币的技术在区块链发明很久很久了。但将这种中心化形式的虚拟货币称为加密货币是误导性的。


    # 结论


    加密货币的区分特征是交易处理的去中心化本质，这使用户能够保持匿名并允许无许可的访问。这些关键特征对央行来说是一个红旗，我们预计没有任何声誉良好的央行会发行用户可以保持匿名的去中心化虚拟货币。声誉风险将太高了。相反，央行可以发行央行电子货币。这种货币将由他们严格控制，用户将接受标准的
    KYC 和 AML 程序的处理。


    一些央行据称正在评估发行央行加密货币。然而，仔细观察这些项目可以发现，根据我们的定义，这些并不是加密货币。这些项目通常是高度中心化的。


    通常，我们认为央行不应该从事满足匿名支付需求的业务。我们认为这种需求将得到完全满足


