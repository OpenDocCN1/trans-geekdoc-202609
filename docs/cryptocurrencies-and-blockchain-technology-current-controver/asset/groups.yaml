    Global financial leaders such as JPMorgan boss Jamie Dimon and Goldman Sachs’s
    Lloyd Blankfine have warned that the currency is ripe for use by fraudsters.


    Ajit Tripathi of accounting firm PwC says bitcoin’s meteoric rise and its creation
    myth have attracted more buyers. The currency is said to have been created by
    a mysterious figure called Satoshi Nakamoto, although there is no proof this is
    actually a real person. The absence of any government or bank standing behind
    the currency also fuels its appeal to those unhappy with the financial system
    after the credit crunch.


    > “Bubbles are driven by sentiment and stories, and bitcoin has a great story
    with a lot of mystery and spectacle to it,” Tripati says. “Is bitcoin at $40,000
    by the middle of next year unthinkable? It not—but is a logical and rational explanation
    for why it should be, I don’t think so.”


    Back in east London at the Old Street roundabout, known as “Silicon Roundabout”
    for its proximity to so many tech startups, Ben Page-Phillips fears a collapse
    in bitcoin’s value. He also accepts the currency at the independent cafe he runs
    with his brother, Nincomsoup, which they first opened together just before the
    dotcom crash 18 years ago.


    ## Cryptocurrencies and Blockchain Technology


    The restaurant is not exposed to a bitcoin bubble because customers pay via an
    app that takes on the risk by instantly converting bitcoin payments into pounds
    on behalf of the shop. But he likes the lower cost it brings to processing sales,
    unlike the “crazy fees” charged by credit card companies.


    > “I love that it’s outside the banking system, but I have concerns,” he says.
    “You see everyone piling in and the concern that is that it’s going to be artificially
    inflated. I would treat it like a game—it’s shot up so much, and what goes up
    must come down.”


    ## Banks Will Come Around


    Michael J. Casey


    Michael J. Casey is a senior advisor for blockchain research at MIT''s Digital
    Currency Initiative.


    Whether bitcoin or its imitators eventually achieve global ubiquity, they have
    already achieved success in one fundamental way: forcing humans to rethink their
    relationship with money and banks.

    Cryptocurrencies weren''t on the ballot during Switzerland''s “sovereign money”
    referendum last weekend, in which Swiss citizens rejected by a ratio of three
    to one proposal to end fractional reserve banking and give sole money-creation
    authority to the Swiss National Bank. But they were the elephant in the room.

    The very presence of the crypto alternative, I believe, will eventually force
    economies worldwide to disintermediate banks from money, yet the direct authors
    of that change not be activist voters wielding ill-conceived referenda or crypto
    enthusiasts voting with their wallets.

    The first phase of a transition toward a true “money of the people” will be implemented
    by central banks themselves, striving and competing to remain relevant in a post-crisis,
    post-trust, digitally connected global economy.

    That might disappoint adherents of the cypherpunk dream who birthed bitcoin. But
    the good news for those who want governments out of money altogether is that when
    currencies become digital—and enjoy all the bells and whistles of programmable
    money—they will foster more intense global competition among themselves.

    When smart contracts can manage exchange rate volatility, for example, people
    and businesses involved in international trade will not need to rely solely on
    the dollar as the cross-border currency of choice. This more competitive environment
    will ultimately open the door to non-government digital alternatives such as a
    bitcoin.


    > “Central Banks Will Jump-Start the Decentralization of Money,” by Michael J.
    Casey, CoinDesk, June 19, 2018 (https://www.coindesk.com/central-banks-will-jump-start-decentralization-money/).
    Reprinted by permission.


    ## Cryptocurrencies and Blockchain Technology


    ## Backlash Against CBDCs


    To be sure, official enthusiasm for central bank-issued digital currency, or CBDC
    as it has become known, has waned somewhat as the old guard of central banking
    has dug in its heels.


    At the Bank of England, which spearheaded research into the idea three years ago,
    Governor Mark Carney has lately warned of financial instability if his institution
    were to directly provide digital wallets to ordinary citizens—a change that would,
    in effect, give everyone the same right to hold reserves at the central bank as
    regulated commercial banks.


    The Bank of International Settlements—a kind of international club for central
    banks—has echoed Carney''s concerns, as have other officials.


    This backlash, which suggests that the bank supervisory teams within central bank
    bureaucracies have regained ascendancy over technologists and innovators in their
    internal debates over CBDC, stems from a well-founded expectation: bank runs would
    be a real possibility.


    Why hold your money at risky, friction-laden institutions paying near-zero interest
    when you can store at zero risk with the central bank itself and trade it automatically
    with other fiat wallet holders?


    But why, also, should we care what happens to banks?


    ## Banks Are the Problem


    The only reason to promote digital fiat currencies is precisely to bypass the
    banks. Whether the currency is fiat or decentralized, banks are the problem. The
    technical, social and regulatory infrastructure upon which they operate is decades
    old and fraught with compliance costs.


    Banks maintain centralized, non-interoperable databases on outdated COBOL mainframes.
    They rely on multiple intermediaries to process payments, each managing their
    own, siloed ledgers. All these inefficient systems, instituted to address the
    problem of trust, merely add to the cost of trust.


    ## Is Blockchain Too Risky to Operate on a Mass Scale?


    "Why, in a digital age, can’t we move money around 24/7? Because we have bad middleware,
    and that bad middleware is existing financial infrastructure,” says Charles Cascarilla,
    CEO of Paxos, which is building blockchain-based trading infrastructure for the
    system.


    In addition, there''s the massive political risk that comes with banks'' involvement
    in payments system.


    The reason why it was deemed necessary for governments to bail out the world’s
    banks to the tune of trillions of dollars in 2008 was that not doing so thrust
    our highly complex payments systems into chaos. The global economy would have
    had a cardiac arrest. It’s that threat of bringing us all down with them that
    gives “too-big-to-fail” banks hold over policymaking.


    Many central bankers, still starting from the fallout from that crisis, know this
    is the problem. Many see real benefits in removing banks from payments and recognize
    digital currencies can help. The question is how to get there without fomenting
    chaos.


    ## Gradual Solutions


    One solution: a phased approach over time. You don’t provide CBDC to everyone
    at first; you start with large non-bank financial institutions, follow it up with
    a certain class of large corporations, then move to smaller businesses, and only
    make it available to individuals as a last step.


    Another solution: the introduction of a unique, central bank-determined CBDC interest
    rate. This would be an addition to the central bank toolkit for managing money
    supply, which currently hinges on a combination of a policy rate imposed on banks’
    reserves and interventions in the two-way market for buying and selling government
    securities with banks.


    A separate CBDC interest rate would provide a means to calibrate the flow of money
    between banks and digital fiat wallets, potentially within a long-term plan to
    gradually shift it from the former to the latter without overly disrupting the
    system.

