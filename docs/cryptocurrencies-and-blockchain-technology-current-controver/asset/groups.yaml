    # Are Blockchain Technologies Too Complex?


    citizens have turned to cryptocurrency as a savings mechanism. According to Veragai
    Mabika, the founder of BitFinance (now Golix) in Zimbabwe, 37% of Zimbabweans
    use it for this purpose.


    When long-time president Robert Mugabe was ousted by the Zimbabwean military in
    November, Bitcoin saw a surge in price on the Harare exchange. When uncertainty
    was at its peak, the price for a single bitcoin on the Harare exchange was close
    to double the price on global bitcoin exchanges.


    > "Interest in bitcoin has peaked as people cannot send money outside or for international
    transactions using formal banks," Yeukai Kusanga, a trace coordinator at the Golix
    bitcoin exchange in Zimbabwe, told Quartz.


    People have had to look for alternatives and bitcoin has been a useful solution
    which can be used to purchase goods on Amazon or to pay for vehicles from international
    suppliers and traders.


    Bitcoin has been used to help for projects in Africa since 2013, where a woman
    in Botswana raised $1,500 for SOS Children’s Villages. It can provide a secure
    voting platform for countries where citizens might battle to access voting stations
    or face intimidation.


    Blockchain is responsible for movements such as Usizo, a South Africa-based blockchain
    platform that allows members of the public pay electricity bills for community
    schools. And, in a change that will affect every African country with a seaport,
    blockchain is doing away with the need for paper documents in the tracking of
    goods by sea, a difficulty that could previously not be met by electronic bills
    due to the need for non-forgeability and a central registry.


    There’s also its potential to alleviate the circumstances of African refugees.
    In May, the United Nation’s World Food Programme used a blockchain platform to
    record and authenticate transfers of items such as lentils, pasta and oil for
    about 10,000 Syrian refugees. The European Union and the United Nations are currently
    exploring the potential for blockchain to provide legal identification to those
    who do not have documents. The potential application for this on the African continent
    is vast.'
