    money before the invention of Bitcoin, which was adaptable to fit cryptocurrencies
    such as Bitcoin.


    The European Central Bank has classified Bitcoin as a “convertible decentralized
    virtual currency.” The European Banking Authority (EBA) has advised European banks
    not to trade in any cryptocurrencies until a regulatory regime was put in place.
