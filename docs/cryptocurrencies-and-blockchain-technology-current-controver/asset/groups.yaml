    - 1. In order that users cannot remain anonymous, ensure that exchanges and intermediaries
    require proof of identity upon opening accounts.

    - 2. Publish a set of instructions for both consumers and regulators in respect
    of the taxation of virtual currencies.

    - 3. Propose caps on payments that can be made in cryptocurrencies, similar to
    caps that are already in place in respect of cash transactions.

    - 4. Regulate, at an EU level, any companies that offer exchanges between cryptocurrencies
    and fiat currencies.


    According to Steve Keen, the Head of the School of Economics, History and Politics
    at Kingston University in London, the regulation of Bitcoin is inevitable. He
    noted that the existence of a futures market in Bitcoin means that there is likely
    to be a drop in price due to the variety of positions that can be taken in Bitcoin.
    He also suggested that there are possibilities that, without regulation, hard
    forks could be forced upon users. He has suggested that the futures market in
    Bitcoin means that holders of the asset are now linked to a greater extent to
    the financial system, meaning that what happens in other markets can affect the
    price of Bitcoin.


    However, across the industry there are various opinions and drivers for regulation.
    For some, the regulation of Bitcoin would add legitimacy to the cryptocurrency.
    However, for others Bitcoin is low on the priority list as it is not a pressing
    issues. In addition, the cryptocurrency industry itself is opposed to large scale
    regulation that would negatively affect the decentralized nature of Bitcoin. The
    other issue, as suggested above by the EU approach, is that the regulators remain
    unsure about what or how to regulate. Fitting the cryptocurrency industry into
    the existing structures is likely to stifle the industry. However, to create a
    new regulatory and tax structure purely for cryptocurrency could result in significant
    expense on the taxpayer.


    The year 2017 has seen cryptocurrencies break away from being a niche industry
    used by the tech industry to become far more mainstream. This breakout has resulted
    in Bitcoin becoming a buzzword in the office and in the home. As a result, it
    has become almost inevitable that regulation in some form or another is on the
    way. However, the big questions that remain are what form such regulations take
    and what effect they will have on the industry.

