    # Are Blockchain-Powered Cryptocurrencies Better than Hard Money?


    fastest are periodically rewarded through the creation of new Bitcoin balances.
    Because of the reward, maintaining the block chain is known as “mining” and a
    small industry of Bitcoin mining software and devices has developed. All users
    of cryptocurrency benefit from this because the more secure the currency becomes
    due to the duplication of records and validation.


    This is a tremendously clever scheme because it simultaneously ensures a consistent
    supply of currency, decentralizes operation, and secures the network against manipulation
    by creating thousands of replicas of the block chain.


    # Potential Impact


    The true value of any currency is the willingness of a community of people to
    use it for daily transactions. The three requirements, Scarcity, Verifiability,
    and Availability, combine to cause people to trust a particular currency. When
    that trust is lost you get bank runs, hyperinflation, or simple destruction of
    wealth. Meanwhile, the community rushes to find a new currency.


    The advent of the internet with myriad handheld devices capable of initiating
    transactions makes it possible for multiple currencies to coexist. For the first
    time in history, people may have a choice among currencies to use in daily transactions.
    Central bankers, and the sovereign countries that endow them with their power,
    are appropriately worried. An industry that has historically been immune to competition
    no longer has that protection.


    I think this is a good thing. Just like any other competitive market, competition
