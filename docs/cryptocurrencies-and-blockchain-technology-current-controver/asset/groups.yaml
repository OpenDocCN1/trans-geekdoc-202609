    # Blockchain Is a Complex Solution Without a Problem


    Greta Bull


    Greta Bull is the CEO of the Consultative Group to Assist the Poor and a director
    at the World Bank.


    Countless column inches have been dedicated to distributed ledger technology (DLT)
    and blockchain burst onto the global scene in 2009. Since then, numerous financial
    institutions, governments and other organizations have experimented with testing
    and implementing blockchain solutions. This includes development organizations
    such as the World Bank, IMF and the United Nations. Despite breathless enthusiasm
    and substantial investment, we have seen relatively few DLT applications successfully
    introduced at scale outside of cryptocurrencies and these are a whole can of worms).
    At CGAP, we have been thinking which blockchain applications might make sense
    for financial inclusion, considering use cases such as retail payments, cross-border
    payments, remittances and agricultural value chains.


    The question we have not “Does blockchain work?” but “Does it work better than
    other technology solutions in the market?” And what are the cost-benefit trade-offs
    of switching to a new consensus-based technology solution? We have seen lots of
    proofs of concept that it can work, but not a lot of quantified analysis on why
    a DLT solution might be better than existing alternatives.


    So, to what extent is blockchain a search for a problem? There are a few important
    hurdles for those considering blockchain solutions in the financial inclusion
    space.


    > Blockchain: A Solution in Search of a Problem?” by Greta Bull, Consultative
    Group to Assist the Poor (CGAP), May 29, 2018. http://www.cgap.org/blog/blockchain-solution-search-problem.
