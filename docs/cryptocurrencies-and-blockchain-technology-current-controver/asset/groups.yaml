    # Cryptocurrencies and Blockchain Technology


    be fraudsters with that much computing muscle would find it more profitable to
    mine the blockchain and create new bitcoins.


    The blockchain solves the “double-spending problem” that plagued earlier cryptocurrencies,
    whereby someone could spend the same money in two places (or counterfeit it).
    Today, sending the same bitcoins to two different sellers would create a “fork”
    in the blockchain, immediately rendering one of the transactions invalid.


    Likewise, it’s not possible to alter a transaction record. To go back and change
    a link in the chain, you’d have to change all the links that follow. That would
    require more computer power than all the computers that are managing the blockchain
    put together. The altered chain wouldn’t match; it would be a clear counterfeit.


    These days, miners often work with specialized computer farms that use loads of
    electricity; sometimes they share resources to form “mining pools.” You could
    run a mining application in the background of your work computer, but it likely
    wouldn’t net you anything besides a slower computer. (For example, a farm using
    subsidized, coal-powered electricity in China is home to 58 percent of the world’s
    major mining pools, according to a University of Cambridge study; the US, the
    second-largest host, has 16 percent.)


    # The Promise of Blockchain


    Some researchers see blockchain as having revolutionary applications beyond bitcoin,
    as trading stocks, safely storing data and managing supply chains, all without
    a middleman. It is a “foundational” technology, argues a 2017 paper by two Harvard
    Business School professors, with the potential—perhaps in decades—to render accounts,
    traders and even contract lawyers superfluous. Blockchain “has the potential to
    become the system of record for all transactions. If that happens, the economy
    will once again undergo a radical shift, as new, blockchain-based sources of influence
    and control emerge.”'
