    ### 起源：比特币


    Axel Simon 就于红帽（Red Hat），这是一家国际软件公司。


    这种区块链是一种分布式账本，记录所有用户的交易情况，以防止他们双花代币（这在历史上由银行负责）。为了防止攻击者操纵系统，账本被复制到参与网络的每台计算机上，并且一次只能由一台计算机进行更新。


    系统每 10 分钟在计算机之间组织一场竞赛，这需要消耗大量的能量。获胜者有权将过去 10 分钟的交易提交到账本（区块链中的“区块”），并获得一些比特币作为奖励。这种设置被称为工作量证明共识机制。


    这里开始变得有趣起来。比特币于 2009 年 1 月作为一个开源项目发布。2010 年，由于意识到许多元素可以进行调整，聚集在比特币周围的社区（通常在 bitcalk
    论坛上）开始尝试这些调整。


    首先，由于比特币区块链是分布式数据库的一种，Namecoin 项目应运而生，建议在它的交易数据库中存储任意数据。如果区块链可以记录资金的转移，它也可以记录其他资产的转移，例如域名。这正是
    Namecoin 的主要用例，它在比特币发布两年后的 2011 年 4 月上线。


    如果说 Namecoin 修改了区块链的内容，那么 Litecoin 修改了两个技术方面：将区块之间的间隔从 10 分钟缩短到 2.5 分钟，并改变了竞赛运行的方式（将
    SHA-256 安全哈希算法替换为 scrypt）。这之所以可行，是因为比特币是开源软件发布的，而 Litecoin 在其他所有方面与比特币完全相同。Litecoin
    是第一个修改共识机制的分叉，为许多后续分叉铺平了道路。


    在此过程中，比特币代码库出现了更多变体。有些最初作为比特币的提议扩展提出的，例如 Zerocash 协议，它旨在提供交易匿名性和同质性，但最终被分出去了自己的独立货币
    Zcash。


    虽然 Zcash 带来了自己的创新（使用了被称为零知识证明的最新密码学进展），但它保持了与大部分比特币代码库的兼容，这意味着它也能从比特币的上游创新中受益。


