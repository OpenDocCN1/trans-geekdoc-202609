    An anonymous programmer calling himself Satoshi Nakamoto introduced bitcoin in
    a 2008 paper. The widely cited paper may be best remembered for something else,
    though: Nakamoto also introduced the first working blockchain, the technology
    underpinning bitcoin.


    Blockchain is an online ledger of all transactions that''s available for anyone
    to view and copy, but that no one individual controls. Instead, it lives on many
    computers, where it is constantly updating itself. Decentralization and openness
    ensure a transaction can''t be faked—because transaction wouldn''t appear on all
    the other copies of the ledger. If one copy of the ledger does not match the rest,
    that copy will stand out. Thus blockchain is sometimes called a decentralized
    ledger.


    This decentralization puts bitcoin beyond the reach of regulators, but also creates
    risks. Third parties in the “wallet” or “exchange” businesses do not offer the
    kind of insurance you get at a bank. And, like with cash, if you print your bitcoin
    codes and stash them under your bed, you run the risk of losing all in a fire
    or robbery.


    ## Is It Possible to Regulate Cryptocurrencies?


    ## Initial Coin Offerings


    A new trend in cryptocurrencies is the “initial coin offering,” or ICO. ICOs raised
    $2.2 billion in the first nine months of 2017, according to one industry estimate.
    These are not bitcoin, but essentially a new digital currency used to fund a specific
    product.


    ICOs offer capital by selling virtual coins or tokens. Perhaps these coins could
    be used later to participate in the project, or they offer some future reward.
    But they do not offer the same rights demanded by a venture capitalist or shareholder.
    Indeed, though they sound suspiciously similar, an ICO is not an IPO—initial public
    offering (which is when a company sells shares to the public and becomes listed
    somewhere like the New York Exchange). Rather, ICOs happen well outside the regulated
    banking industry and governments fear they encourage risky speculation.


    The Securities and Exchange Commission (SEC)—the regulator of US financial assets—has
    warned investors that some ICOs may constitute fraud, and that coins may in fact
    function like securities and need to be regulated as such. Canada’s securities
    regulator has issued a similar statement.


    ## Government Response


    Governments do not like bitcoin much. Its anonymity allows users to operate in
    the shadows, sell narcotics, capitalize on ransomware (software that hijacks a
    computer until the owner pays a ransom in a cryptocurrency) and maybe, some fear,
    finance terrorists.


    Plus, there are tax implications. In most countries, citizens are required to
    pay taxes on earnings. But the taxman can’t peer into your bitcoin holdings the
    way he can look at your Bank of America statement (though, by law, Americans are
    required to pay taxes on bitcoin profits).


    And finally, cryptocurrencies undermine government authority. North Korea may
    be by using bitcoin to evade sanctions.


    ## The Promise of Blockchain


    Some researchers see blockchain as having revolutionary applications beyond bitcoin,
    safely storing data and managing supply chains, all without a middleman. It argues
    a 2017 paper by two Harvard Business School professors, “has the potential to
    become the system of record for all transactions. If that happens, the economy
    will once again undergo radical shift.”

