    \ since our ICO [initial coin offering] went live almost a month ago,” he says.\
    \ “A lot of people want to take advantage of the sale.”\n\nCashaa has ambitious\
    \ goals. Apart from having sold more than 100 million tokens of its newly released\
    \ cryptocurrency called the CAS token, the company aims to use blockchain technology\
    \ to build “the largest payment platform on earth” as a way to provide peer-to-peer\
    \ and remittance services at the “cheapest possible rates to the next billion”—a\
    \ reference to the current approximately two billion people who are currently\
    \ unbanked, according to estimates by Global Findex.\n\n“We are basically a decentralised\
    \ wallet,” says Mcunu. “Traditionally when sending money from overseas to South\
    \ Africa you would have to wait 72 hours and use three different banks. With Cashaa,\
    \ we are able to do the exact same process for free and actually instantaneously.\
    \ It’s just one of a few ways that blockchain is changing the world.”\n\nMcunu’s\
    \ flat-out work pace, the “revolutionary” tone of his rhetoric and the hugely\
    \ ambitious aims of his company capture the zeitgeist of the current cryptocurrency\
    \ space. Poster child Bitcoin’s meteoric rise gives one a sense of: in 2009, when\
    \ Bitcoin pioneered the idea of a virtual currency based on a secure, shared digital\
    \ ledger which allowed for low-risk, irreversible transactions\n\n “No Magic Bullet:\
    \ Cryptocurrencies and Complexities in Africa,” by Thalia Holmes, Africa Portal,\
    \ South African Institute of International Affairs, December 14, 2017. Reprinted\
    \ by permission.\n\n# Are Blockchain Technologies Too Complex?\n\nIn 2009, bitcoins\
    \ were worth less than one-hundredth of a cent. By July 2011, a bitcoin cost $31.\
    \ By December 2013, one bitcoin would have cost between $600 and $1000, depending\
    \ on when you bought it. Fast forward four years to May 2017 and you would have\
    \ spent $2000 on a bitcoin. In November, it breached the $10,000 mark. A single\
    \ bitcoin is currently worth $12,000. Although plagued by huge volatilities, its\
    \ spectacular rise in price and popularity is almost mythical, made only more\
    \ by the fact that its inventor, so-called Satoshi Nakamoto's whereabouts are\
    \ not known. (According to an October 2017 Time magazine article, he could be\
    \ worth about $5.8-billion).\n\nA veritable explosion of cryptocurrencies, have\
    \ leveraging blockchain technology, sprung up in Bitcoin's wake. As of the end\
    \ of November 2017, there were an estimated 1,324 cryptocurrencies (and counting)\
    \ available on the internet. Payment platforms, wallets, global settlement networks\
    \ and hundreds of cryptocurrencies abound. With about 47% marketshare, Bitcoin\
    \ is still by far the biggest cryptocurrency player but it is being energetically\
    \ chased by the likes of Ethereum, Litecoin, Ripple and Dash.\n\n# What's All\
    \ the Excitement About?\n\nBitcoin leverages a technology called blockchain, which\
    \ is the real crux of the movement. Blockchain is a distributed digital ledger\
    \ that allows participants to inexpensively and transparently record transactions\
    \ in a permanent, traceable way.\n\n\"One way to think about a blockchain is as\
    \ a public bulletin board to which anyone can post a transaction record,\" explained\
    \ Nir Ksheti, professor of management at the University of North Carolina. “Those\
