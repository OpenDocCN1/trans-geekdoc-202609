    # Introduction


    of transactions can be coded, and it is in those records that relative value can
    be calculated and agreed upon by users. The logic of early cryptocurrencies like
    bitcoin takes this model even further and makes the ledger public, with each transaction
    traceable along a line that connects every transaction together: the money paid
    for one good or service can then be traced directly to what it was used for that,
    with this continuing in an infinite line. Money can never be lost or stolen, bitcoin''s
    advocates argue, as it takes the power to control it from the hands of banks and
    governments and spreads it to the masses. In this sense, it serves as a metaphor
    for a way of thinking about the internet and whether it has the potential to offer
    a different, more democratic kind of human relations.


    But is it any better? The rhetoric of progress tells us to presume that a new
    invention is an improvement over what it replaced, but a responsible and reflective
    approach to our greater environment demands we consider the newest technological
    innovations with the kind of scrutiny that, in the past, was not applied to the
    steam engine and the nuclear war. Because of the fixation on creating something
    new, technological innovations are particularly susceptible to accidentally recreating
    things that already exist and, in the case of bitcoin, solving a problem that
    may not actually exist. Before you heard of bitcoin, did you want it?


    The question is not a rhetorical one. Central to the conceit of bitcoin is extraordinarily
    complicated, computer-generated mathematical problems that are, in turn, solved
