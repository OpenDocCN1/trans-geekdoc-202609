    # Banks Will Come Around


    Michael J. Casey


    Michael J. Casey is a senior advisor for blockchain research at MIT''s Digital
    Currency Initiative.


    Whether bitcoin or its imitators eventually achieve global ubiquity, they have
    already achieved success in one fundamental way: forcing humans to rethink their
    relationship with money and banks.

    Cryptocurrencies weren''t on the ballot during Switzerland''s “sovereign money”
    referendum last weekend, in which Swiss citizens rejected by a ratio of three
    to one proposal to end fractional reserve banking and give sole money-creation
    authority to the Swiss National Bank. But they were the elephant in the room.

    The very presence of the crypto alternative, I believe, will eventually force
    economies worldwide to disintermediate banks from money, yet the direct authors
    of that change not be activist voters wielding ill-conceived referenda or crypto
    enthusiasts voting with their wallets.

    The first phase of a transition toward a true “money of the people” will be implemented
    by central banks themselves, striving and competing to remain relevant in a post-crisis,
    post-trust, digitally connected global economy.

    That might disappoint adherents of the cypherpunk dream who birthed bitcoin. But
    the good news for those who want governments out of money altogether is that when
    currencies become digital—and enjoy all the bells and whistles of programmable
    money—they will foster more intense global competition among themselves.

    When smart contracts can manage exchange rate volatility, for example, people
    and businesses involved in international trade will not need to rely solely on
    the dollar as the cross-border currency of choice. This more competitive environment
    will ultimately open the door to non-government digital alternatives such a bitcoin.


    > “Central Banks Will Jump-Start the Decentralization of Money,” by Michael J.
    Casey, CoinDesk, June 19, 2018 (https://www.coindesk.com/central-banks-will-jump-start-decentralization-money/).
    Reprinted by permission.'
