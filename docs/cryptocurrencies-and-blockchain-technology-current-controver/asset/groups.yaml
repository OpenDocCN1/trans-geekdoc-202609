    Current digital economy is based on the reliance on a certain trusted authority.
    Our all online transactions rely on trusting someone to tell us the truth—it can
    be an email service provider telling us that our email has been delivered; it
    can be a certification authority telling us that a certain digital certificate
    is trustworthy; or it can be a social network such as Facebook telling us that
    our posts regarding our life events have been shared only with our friends or
    it can be a bank telling us that our money has been delivered reliably to our
    dear ones in a remote country. The fact is that we live our life precariously
    in the digital world by relying on a third entity for the security and privacy
