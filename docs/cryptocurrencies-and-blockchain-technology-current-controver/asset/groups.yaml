    # 加密货币与区块链技术


    为了满足乌克兰的若干法律要求，系统集成了多种身份验证类型以增加投票系统的完整性。


    - Bext360 是一家位于科罗拉多州的初创公司，利用智能合约为咖啡农提供公平且准时的支付。它使用通过 Bext360 机器对咖啡豆进行称重和分析后定价，帮助小农户克服与定价和其他市场数据相关的信息不对称。


    - WeTrust 旨在创建一个更具包容性的金融体系，让任何人都能获得公平、平等的金融服务，而无需昂贵的信赖第三方。


    - BanQu 通过区块链记录经济和金融交易以及商品购买，为此前未获得银行服务的人群创建了“经济护照”。这使得没有银行服务的人群能够在全球供应链中建立并“证明”自己的身份。


    # 区块链解决信息不对称的三种方式


    这些及其他示例表明，区块链技术可以通过以下三种方式广泛解决信息不对称：


    - 1. 通过改进追踪和追溯解决供应链和价值链中的信息不对称：区块链的影响已经开始在全球供应链中体现，包括制药和食品行业。通过不可篡改地记录供应链（以及其他物流链）中的各个步骤，区块链具有减少浪费和欺诈、打击假品和非法产品以及提高消费者安全的潜力。区块链实际上允许透明度监管机构以及普通消费者追踪其购买和消费的商品（如钻石）的来源，并在过程中利用信息的力量，使消费者和公民能够做出更好的选择。


    # 区块链技术是否太复杂了？


    - 2. 解决与身份属性管理相关的不对称：缺乏可验证的、主权的身份正成为信息时代的主要问题之一，这导致了从身份盗用到隐私侵犯、新旧形式的监控以及其他形式的欺诈等问题。如今，公民无法控制自己的在线存在，这不仅导致了损害整个数据生态系统长期信任的问题。目前有几个项目正在尝试利用区块链来改善这一局面。例如，伊利诺伊区块链倡议启动了一个试点项目，测试公民出生证明在区块链上的价值和可行性，赋予公民更多的控制权和更方便的身份验证方式。同样，马诸塞理工学院（MIT）正处于为学生提供基于区块链的数字毕业证书项目的第二年。尽管仍依赖注册处，该项目旨在让校友对其自己的凭证拥有更多控制权，并让他人能够查看。


    - 3. 通过智能合约解决由信息不对称导致的交易低效问题：区块链在自动化合约方面的潜力已引起广泛讨论。智能合约具有减少企业、政府和公民欺诈及交易成本的潜力。更广泛地说，它具有极大简化流程的潜力（例如，通过自动化合规和执行），从而开启新的业务模式，并允许普通公民与企业、政府以及相互建立复杂的、以往高昂的安排。智能合约是现有信息不对称如何可能被潜在平整和扁平化的一个例子，将更多权力交到了公民和消费者手中。


    # 加密货币与区块链技术


    # 区块链技术与解决信息不对称的传统手段


    迄为止，需要克服的信息不对称一直通过各种制度和“信号”手段来解决——例如通过执行责任和追溯条款和/或披露要求，或由知名且受信赖的机构进行监控；建立行业标准或专业准则；基于声誉的机制；甚至是“取决于结果的”合同（买方在服务结果已知之前不付款）。近期在向“开放政府”迈进的过程中，“开放数据”或“开放合约”的发展也可以被视为防止或解决信息（及权力）不对称的努力。


    然而，这些制度解决方案不仅取决于强大且受信赖的社会中介，还取决于个人获取这些中介或利用可用数据的能力，这解释了为什么信息不对称对欠发达国家和已经被排除的人群影响更大。


    区块链技术是否能提供一种替代这些制度解决方案的分布式、更平等和民主的方案仍有待观察，因为这些相同的提供信任机制的存在实际上可能是区块链成功实施的条件。同样，近期向更具私密性和基于许可的区块链的发展实际上可能会产生新的或强化信息不对称，而不是消除它们（正如我们在某些身份和智能合约倡议中看到的——以及
    ICO 代币发行中看到的）。


    为了监控区块链通过解决信息不对称来推动社会变革的潜力，纽约大学的行动导向型智库 GovLab 正在汇编一个全球区块链案例数据库，并欢迎向 blockchange@thegovlab.org
    提交补充。


    # 区块链是一个没有问题的复杂解决方案


    Greta Bull


    Greta Bull 是向贫困人口援助咨询小组（CGAP）的首席执行官，也是世界银行董事。


    无数的专栏被用于分布式账本技术（DLT），区块链在 2009 年进入全球舞台。从那时，许多金融机构、政府和其他组织一直在实验测试和实施区块链解决方案。这包括世界银行、国际货币基金组织（IMF）和联合国等开发组织。尽管人们狂热并投入了大量资金，但我们看到加密货币之外，很少有
    DLT 应用被成功的大规模引入（而这本身又是一团乱麻）。在 CGAP，我们一直在思考哪些区块链应用对于金融包容是有意义的，零售支付、跨境支付、汇款和农业价值链等用例。


    我们的问题不是“区块链是否有效？”，而是“它是否比市场上的其他技术解决方案更好？”切换到新的基于共识的技术解决方案的成本效益权衡是什么？我们看到了许多证明其可行的概念验证，但并没有关于为什么某种
    DLT 解决方案可能优于现有替代方案的量化分析。


    那么，区块链在多大程度上是在寻找问题？对于考虑在金融包容领域使用区块链解决方案的人来说，存在一些重要的障碍。


