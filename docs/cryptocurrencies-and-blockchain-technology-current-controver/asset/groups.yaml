    ## 比特币监管的失败 115


    安德里亚·卡斯蒂洛（Andrea Castillo）


    2017年，纽约州试图对比特币交易实施监管，结果导致基于比特币的企业成群结队逃离该州，这表明加密货币市场在意识上对任何形式的监管都持排斥态度。


    ## 去中心化防止了中央权威的监管 120


    亚历克斯·赫恩（Alex Hern）


    加密货币本质上是去中心化的，缺乏像银行那样拥有数据库的中央权威。这使得监管变得困难，甚至可能无法实现。此外，如果一个人满足于中央银行权威——正如赫恩所称的大多数不从事犯罪活动的人的情况如此——那么使用加密货币就没有任何真正的动力了。


