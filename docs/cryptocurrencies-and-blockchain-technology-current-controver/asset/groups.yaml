    # Are Blockchain-Powered Cryptocurrencies Better than Hard Money?


    like these were backed by stockpiles of gold held in places like Fort Knox. European
    countries did similar things. With the stresses of late 19th century wars and
    World War I that followed, countries discovered that they could issue more banknotes
    than their corresponding stockpiles. This led to a lot of instability until countries
    figured out how to regulate their currencies. But, by the end of the Great Depression,
    pretty much economically developed country had fiat currencies controlled by a
    central bank. While here backed by gold or other reserves, the value of these
    currencies is not directly tied to the value of gold.


    Here''s how the Federal Reserve system works: The Federal Reserve Bank creates
    the money. Money is issued as currency (the familiar US coins and bills) but also
    simply as bank balances. Indeed, far more money exists as bank records in actual
    physical currency. Originally this was done through careful bookkeeping in bank
    ledgers. Now it''s all done on computers. The money is issued in the form of low-interest
    loans, primarily to banks, which then lend the money to their customers and to
    other, smaller banks. Other central banking systems like the European Central
    Bank work in a similar way.


    So, how does fiat money meet our requirements for currency?


    +   - Scarcity: Only one entity, the central bank, has the authority to create
    and issue the currency. The central bank limits the issue of money in order to
    preserve its value.

    - Verifiability: Coins and paper money are printed or minted using materials and
    techniques that are difficult for average people to reproduce but are fairly easy
    to verify. Money in the form of bank balances is verifiable because each bank
    or credit union has accounts with higher-level banks ultimately reaching the Federal
    Reserve. So, when I write a check from my bank to yours, our two banks contact
    each other and transfer the value sending records up the banking chain until they
    reach a common parent bank which may be the Fed. Each bank in the chain verifies
    that the appropriate balances are in place before allowing the transaction to
    proceed.'
  - '[PAGE 29]


    +   - **Availability:** Central banks can create as much money as they think the
    economy needs. The primary challenge for central banks is manage the money supply
    - ensuring both scarcity and availability.


    # Cryptocurrency


    Bitcoin is the first, but by no means the only cryptocurrency. The challenge that
    the pseudonymous creators of Bitcoin tackled to achieve the three features of
    currency—scarcity, verifiability, and availability—in the digital realm. They
    magnified the challenge by prohibiting a central authority like a government or
    a central bank. Trust, in the case of Bitcoin, is in the system, not in any particular
    institution.


    +   - **Scarcity:** The “coin” part of most cryptocurrency names is somewhat misleading.
    Bitcoin doesn’t consist of a bunch of digital tokens that are exchanged. If that
    were the case it would be hard to prevent double-spending of the same token. Instead,
    cryptocurrencies work more like bank account balances. Bitcoin has one, big, public
    ledger that is duplicated thousands of times. All transactions in the ledger must
    balance—for one account to receive value, another account must be reduced by the
    same amount. This ledger is called the block chain and it contains a record of
    every transaction since the creation of the currency.


    +   - **Verifiability:** Cryptocurrencies rely on public-key cryptography to ensure
    that only the owner of a currency balance can initiate its transfer. The bitcoin
    owner uses their private key to sign the transfer record and then posts it to
    the network of block chain replicas. Any entity in the network can use that owner’s
    public key to verify that the transaction is valid and that ownership has been
    transferred.


    +   - **Availability:** Those who host a copy of the block chain have to perform
    the cryptographic calculations necessary to verify transaction validity and prevent
    fraud. Those who do this'
