    More than 3 million people (three times previous estimates) are estimated to be
    actively using cryptocurrencies like bitcoin, finds the first global cryptocurrency
    benchmarking study by the Cambridge Centre for Alternative Finance.


    While many members of the general public may have heard of “bitcoin”, the first
    decentralised cryptocurrency launched in 2009, a new report from the Cambridge
    Centre for Alternative Finance (CCAF) paints a broader picture of “cryptocurrencies”.


    The report shows that cryptocurrencies—broadly defined as digital assets using
    cryptography to secure transactions between peers without the need for a central
    bank or other authority performing that role—are increasingly being used, stored,
    transacted and mined around the globe.


    The Global Cryptocurrency Benchmarking Study gathered data from more than 100
    cryptocurrency companies in 38 countries, capturing an estimated 75 percent of
    the cryptocurrency industry.


    Prior to this research, little hard data existed on how many people around the
    world actively use cryptocurrencies. The conventional wisdom has been that the
    number of people using bitcoin and other cryptocurrencies was around 1 million
    people; however, based on newly collected data, including the percentage of the
    estimated 35 million cryptocurrency “wallets” (software applications that store
    cryptocurrencies) that are in active use, the CCAF research team estimates that
    at least 3 million people actively using cryptocurrency today.


    > “Study Highlights Growing Significance of Cryptocurrencies” University of Cambridge,
