    A lot of the quirks of the cryptocurrency come down to the collective agreement
    about what constitutes “legitimacy.” For instance, the first bitcoin was created
    in 2009, the total number in existence has been growing slowly, at a declining
    rate, ensuring that at some point around 2140, the 21 million bitcoin will be
    mined, and no more will ever be created.


