    # Is It Possible to Regulate Cryptocurrencies?


    # Blockchain and Mining


    An anonymous programmer calling himself Satoshi Nakamoto introduced bitcoin in
    a 2008 paper. The widely cited paper may be best remembered for something else,
    though: Nakamoto also introduced the first working blockchain, the technology
    underpinning bitcoin.


    Blockchain is an online ledger of all transactions that''s available for anyone
    to view and copy, but that no one individual controls. Instead, it lives on many
    computers, where it is constantly updating itself. Decentralization and openness
    ensure a transaction can''t be faked—because transaction wouldn''t appear on all
    the other copies of the ledger. If one copy of the ledger does not match the rest,
    that copy will stand out. Thus blockchain is sometimes called a “distributed ledger”
    or “distributed ledger technology” (including J.P. Morgan Chase, which is researching
    how to use it).


    For the bitcoin blockchain, powerful computer networks called “miners” validate
    the most recent transfers, ensuring someone doesn’t send money they don''t have.
    These miners'' computers compete with one another to verify and then lock the
    transfers onto the ledger, where they can never be changed, adding a new block
    of confirmed transactions about every 10 minutes.


    As an incentive for constantly checking and verifying bitcoin transactions, the
    miner that succeeds in creating a new block is rewarded in new bitcoins that he
    has created. These days, the reward is 12.5 bitcoins and there are about 16.5
    million bitcoins in circulation (worth, as of this writing, about $65 billion
    in US dollars). By design, the reward drops by half about every four years until
    sometime a few decades from now, the miners have created 21 million bitcoins.
    The creator artificially capped bitcoin at that number, ensuring the currency
    cannot be debased by oversupply; the coins can, of course, be divided into smaller
    and smaller units.


    Because the database is distributed across such a broad network, hacking it would
    require enormous computing power. Any would-'
