    # Cryptocurrencies and Blockchain Technology


    card games and digital advertising exchanges built on top of cryptocurrencies:
    “x but on the blockchain” is the new startup pitch du jour, now that “Uber for
    x” and “x but on the iPhone” are passé. There’s already Dentacoin (Yelp for Dentists
    but on the blockchain), Matchpool (Tinder but on the blockchain) and even Cryptokitties
    (Tamagotchis but on the blockchain).


    In practice, however, the available uses are rather more limited. Bitcoin can
    be used as a payment system for a few online transactions, and even fewer real-world
    ones, while other cryptocurrencies are even more juvenile than that. The excitement
    about the field is focused more on what it could become than what it actually
    is.


    # Why Does It Matter That It’s Decentralised?


    At their heart, cryptocurrencies are basically just fancy databases. Bitcoin,
    for instance, is a big database of who owns bitcoin, and what transactions were
    made between those owners.


    In its own way, that’s little different from a conventional bank, which is basically
    just a big database of who owns pounds, and what transactions were made between
    those owners.


    But the distinction with bitcoin is that no central authority runs that big fancy
    database. Your bank can unilaterally edit its database whenever it wants and it
    does so often. Sometimes that’s to your advantage (if your debit card gets stolen
    and used, for instance, your bank will just return the money) and sometimes it’s
    not (if your bank thinks you’re money laundering, it will freeze your account,
    potentially crippling your business).


    With bitcoin, no one can do either of those. The only authority on the network
    is whatever the majority of bitcoin users agree on, and in practice that means
    nothing more than the basic rules of the network are ever enforced.


    # Is This All About Crime?


    It is .… a lot about crime. The flip side of cryptocurrencies being decentralised
    databases is that for most people, most of the time, there’s no downside to a
    centralised database. If you trust the'
