    ## 加密货币与区块链技术


    它们确认并将它们打包成一个交易区块，添加到链中。作为完成工作的回报，获胜的矿工还被允许“打印”一些新的比特币作为奖励给自己，目前价值约为 140,000 美元。


    任何人都可以成为矿工——你所做的只是运行挖矿模式。困难的部分在于成为一个盈利的矿工。打包交易的实际工作很容易，但真正的开销来自于胜者的产生方式。将其想象成一场抽票，购买彩票涉及使用你的计算机解决一个非常复杂但最终毫无用的算术问题。为了获得获得那
    140,000 美元奖励的最高概率，你需要每秒解决这些数千或数百万次问题，以便尽可能多的彩票参加抽奖，这意味着要建造专用计算机、协商更廉价的电力来源，或者直接黑入无辜的人并利用他们的硬件来无所事事。


    ## 人是如何赚到这么多钱的？


    这是一个价值 1900 亿美元的问题——即本文发布时全球所有比特币的价值。简短的答案是“低买高卖”：比特币的价值从八年前的几乎为零，增加到八个月前的 1,200
    美元，在 12 月达到近 20,000 美元的高位，现在稳定在 11,000 美元。任何足够早获得足够比特币的人现在确实非常富有——至少在纸面上如此。


    真正的问题是为什么一个比特币值 11,000 美元（以及为什么以太坊值 1,040 美元，为什么某个特定的加密包如此）。你可以找到两个答案。同情的解释是，所有这些加密货币本质上都是稀缺资产——世界上只存在特定数量。如果它们要被广泛应用于现实世界，那么人们就需要购买这些稀缺资产，因此它们的价值将不可比现在更高。在这种说法中，当前价格仅仅反映了任何特定加密货币被实际使用的概率。


    ## 监管加密货币可能？


    ## 是否会有麻烦在头？


    如果你认为最具敌意的第二个答案是正确的，那么就是：集体贪婪助长了一个投机泡沫，这个泡沫将会崩溃。当人们听到别人通过加密货币赚钱的故事时，他们也会购买自己的——这推高了价格，创造了更多财富故事和更多投资。这种循环一直持续，直到底层资产的价格与现实脱节。最终，泡沫破灭，许多人环顾四周发现自己失去了一切。


    ## 接下来是什么？


    加密货币可能会实现它们的雄心，成为日常生活中被广泛使用的一个方面。结果是一些人会变得非常富有，但他们并不比计算或互联网等其他基础技术的早期投资者真正富有得多。


    ## 硬着陆


    或者，这个投机泡沫可能以如此严重的崩溃终终，摧毁对整个行业的信任，驱逐投资者，让那些花费数千或数百万美元购买专用硬件的矿工破产（这些硬件需要高比特币价格才能盈利），并让加密货币成为与冷聚变和喷气背包并列的技术死路。


    ## 巡航高度


    但也许事情将像过去五年那样继续。加密货币的实际用途保持稳定，大多是非法的，很大程度上处于地下，并且与市场价格完全脱节，价格根据一群与地面真相几乎联系的金融投机者的喜好而剧烈波动。事实证明，不稳定是一种奇地稳定且可预测的状态。


