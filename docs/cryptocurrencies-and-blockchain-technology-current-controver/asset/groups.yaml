    #  A Critical Case Study of Blockchain in the Developing World


    Thalia Holmes


    Thalia Holmes is a South African freelance journalist who has also worked as a
    writer for the Mail and the Guardian.


    Simon Mcunu, the VP of Africa at Cashaa Ltd, is exhausted. “I’ve been working
    12 hours a day, seven days a week since our ICO [initial coin offering] went live
    almost a month ago,” he says. “A lot of people want to take advantage of the sale.”


    Cashaa has ambitious goals. Apart from having sold more than 100 million tokens
    of its newly released cryptocurrency called the CAS token, the company aims to
    use blockchain technology to build “the largest payment platform on earth” as
    a way to provide peer-to-peer and remittance services at the “cheapest possible
    rates to the next billion”—a reference to the current approximately two billion
    people who are currently unbanked, according to estimates by Global Findex.


    “We are basically a decentralised wallet,” says Mcunu. “Traditionally when sending
    money from overseas to South Africa you would have to wait 72 hours and use three
    different banks. With Cashaa, we are able to do the exact same process for free
    and actually instantaneously. It’s just one of a few ways that blockchain is changing
    the world.”


    Mcunu’s flat-out work pace, the “revolutionary” tone of his rhetoric and the hugely
    ambitious aims of his company capture the zeitgeist of the current cryptocurrency
    space. Poster child Bitcoin’s meteoric rise gives one a sense of: in 2009, when
    Bitcoin pioneered the idea of a “virtual,” decentralised currency based on a secure,
    shared digital ledger which cut out the middle


