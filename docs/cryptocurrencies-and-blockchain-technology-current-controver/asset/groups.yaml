    bitcoin—building a new digital currency—with tweaks to some of the details (making
    transactions faster, for instance, or ensuring a basic level of inflation.


    Others, such as Ethereum or Bat, take the same principle but apply it to a specific
    purpose: cloud computing or digital advertising in the case of two.


    # What Exactly Is a Bitcoin? Can I Hold One?


    A bitcoin doesn’t really exist as a concrete physical—or even digital—object.
    If I have 0.5 bitcoins sitting in my digital wallet, that doesn’t


    > “Bitcoin and cryptocurrencies – what digital money really means for our future,”
    by Alex Hern, Guardian News and Media Limited, January 29, 2016. Copyright Guardian
    News and Media Ltd. 2018. Reprinted by permission.


