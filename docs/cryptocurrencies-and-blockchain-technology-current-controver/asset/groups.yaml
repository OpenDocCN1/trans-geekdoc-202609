    # 加密货币与区块链技术


    存储——提供了一种资金安全交换的机制。”


    随着区块链的成熟，显而易见，它不仅可以用于价值交换，还可以用于许多其他领域。以太坊（Ethereum）等产品已经进化（约占总市场份额的19%，是第二大者）。以太坊是一个基于区块链技术的开放软件平台，允许开发者构建和运行大量的去中心化应用程序。潜在地，区块链可以用于任何需要追踪文档、资产或投票权所有权需求的地方。


    “它可以用于货运、医疗保健、供应链管理和食品行业，”Mcunu 解释道，“区块链流简化了入站和出口物流中包含的所有交易：所有信息不再存储在孤岛中，而是整合在一起，使得使用和存储变得更快、更廉价。”


    # 解决实际问题


    一些用途正被专门针对非洲进行调整。首先，基于区块链的回款服务正在帮助人们以加纳、津巴布韦、乌干达、塞拉利昂和卢旺达目前银行费的一小部分发送资金。除了优势外，在非洲使用加密货币进行汇款也有其潜在的缺点。


    国际移民组织南非代表团团长 Richard Outs 表示：“非洲各地的移民可能被虚拟货币吸引，将其作为把收入汇回本国亲属的一种。许多国家之间通过常规渠道汇款的成本一直保持高位，虚拟货币旨在提供一种储蓄或传输移民收入的替代方案。然而，汇率的波动可能导致家属最终储蓄或收到的金额出现重大且意外的减少。”


    在津巴布韦，2008年通货膨胀期间资产一夜之间损失了巨大价值，一些公民已转向加密货币作为储蓄机制。根据津巴布韦 BitFinance（现 Golix）创始人
    Veragai Mabika 的说法，37% 的津巴布韦人为此使用它。


    当长期总统罗伯特·穆加贝在 11 月被津巴布韦军队推翻时，比特币在哈拉雷交易所的价格飙升。当不确定性达到顶峰时，哈拉雷交易所单个比特币的价格几乎是全球比特币交易所价格的两倍。


    > “由于人们无法通过正式银行向境外汇款或进行国际交易，对比特币的兴趣达到了顶峰，”津巴布韦 Golix 比特币交易所追踪协调员 Yeukai Kusanga
    告诉《石英杂志》。


    人们不得不寻找替代方案，而比特币是一个实用的解决方案，可以用于在亚马逊购买商品，或向国际供应商和交易者支付车辆费用。


    自2013年以来，比特币一直用于帮助非洲的项目，其中博茨斯瓦的一位女性为 SOS 儿童村筹了 1,500 美元。它可以为那些公民可能难以进入投票站或面临恐吓的国家提供一个安全的投票平台。


    区块链负责了诸如 Usizo 的活动，这正是一个总部位于南非的区块链平台，允许公众为社区学校支付电费。而且，在一项将影响每个拥有海口的非洲国家的变革中，区块链正在消除海上货物追踪对纸质文档的需求。


    # 区块链技术是否太复杂了？


    # 加密货币与区块链技术


    “没有 M-Pesa，就没有数字钱包，”如是说。


    # 在非洲采用


    在南非成立、目前总部位于硅谷的加密货币平台 Chankura 执行官兼联合创始人 Thabang Mashiloane 指出，兴趣正在上升。“2017 年
    8 月至 9 月期间，南非是搜索量排名第一的国家，”Mashiloane 告诉非洲门户（Africa Portal）。


    加密货币平台 ICE3X 的 Gareth Grobler 估计南非人现在已参与其中。为世界银行编写了关于区块链报告的 Logos Advisors 负责人
    Marina Niforos 描述了肯尼亚市场的浓厚兴趣。“该国成年人口的百分之七十持有数字货币，”她说。


    肯尼亚拥有非洲最成熟的移动货币市场，正在利用其现有网络允许法币与加密货币之间更容易易交换。


    缺乏官方的比特币支付网关并没有怎么能抑制肯尼亚加密货币的采用率。事实上恰恰相反，”肯尼亚区块链协会主席 Michael Kimani 说，“人们通过形成点对点网络来适应这种服务空白，任何人都可以在网络上进行买卖。”


    # 区块链技术是否太复杂了？


    Niforos 解释道：“由于非洲的遗留系统相对较小，由于转型成本较低且文化阻力较小，区块链的采用变得更容易。这为汇款和支付领域的变革提供了背景。”


    “使用数字货币的点对点支付开始成为当地货币的替代方案，许多由非洲人经营的初创公司，包括肯尼亚的 BitPesa 和 Bitsoko，加纳的比特币交易所 BtcGhana，以及南非的
    Luno、Ice3X、GeoPay、BitSure 和 Chankura。南非移动货币网络 PayFast 最近整合了比特币支付选项，现在为全国 30,000
    个商户网提供了比特币支付访问。”


