    or Bank of America, or PayPal — to “pull” funds from our accounts and send them
    to the recipient’s account. Bitcoin’s technological innovation replaces such third
    parties with the protocol itself. Computers running the Bitcoin software contribute
    processing power to maintain the blockchain, a distributed ledger of all transactions
    that records and verifies each new transfer.


