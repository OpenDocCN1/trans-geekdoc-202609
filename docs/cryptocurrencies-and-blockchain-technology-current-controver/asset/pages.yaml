    while others argue that they fight cybercrime.


    Unlike the American dollar or British pound—which are guaranteed by central banks
    that set interest rates and print currency, stabilizing their value—bitcoin is
    decentralized. No one controls it. In part for that reason, its value yo-yo wildly.
    After more than quadrupling against the dollar between January and August 2017,
    bitcoin fell by a third in the first two weeks of September. Some blamed a crackdown
    on digital currencies in China and J.P. Morgan Chase CEO Jamie Dimon, who compared
    bitcoin to the Dutch tulip bubble of the 17th century. Yet as Fortune magazine
    noted, bitcoin meltdowns have been a regular feature of its brief lifetime.


    This volatility makes it unlikely bitcoin (or another cryptocurrency, such as
    ethereum) will become an effective store of value (like gold) or a unit of account
    (like the dollar) anytime soon. You wouldn’t want to be paid in bitcoin, because
    your real (i.e., dollar-denominated) salary would fluctuate all over the place.


