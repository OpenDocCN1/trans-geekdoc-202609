  md: '# Wikipedia Is a Model for How Blockchain Can Work


    Dirk Baur, Daniel Cahill, and Zhangxin (Frank) Liu


    Dirk Baur is a professor of finance at the University of Western Australia. Daniel
    Cahill is an associate lecturer at the University of Western Australia. Zhangxin
    (Frank) Liu is an assistant professor of finance at the University of Western
    Australia.


    Almost a decade after the introduction of Bitcoin, there is a lot of hype about
    the blockchain technology on which cryptocurrencies such as Bitcoin are based.
    Some claim the technology will revolutionise commerce; others are more critical
    in their predictions.


    But the technology behind blockchain remains a mystery to many people.


    A blockchain is a decentralised, distributed and open public ledger made up of
    a sequence of “blocks” that are “chained” via a cryptographic hash.


    If that still sounds like gibberish to you, there is a popular application that
    shares the philosophy of the blockchain technology that can help you understand
    how it works: Wikipedia.


    # A Decentralised, Open Public Ledger


    Wikipedia is a free online encyclopedia that depends on the collaborative effort
    of decentralised volunteer writers called “Wikipedians” who add to this constantly
    increasing repository of information.


    Despite being based on a central database, Wikipedia is decentralised in the sense
    that the ability to add information is completely open and public. This freedom
    to add information to


    > “What Wikipedia Can Teach Us About Blockchain Technology?” by Dirk Baur, Daniel
    Cahill, and Zhangxin (Frank) Liu, The Conversation, April 13, 2018. https://theconversation.com/what-wikipedia-can-teach-us-about-blockchain-technology-92934.
    Licensed Under CC BY-ND 4.0 International.'
