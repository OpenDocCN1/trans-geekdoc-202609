    In this explainer, we discuss what makes bitcoin different from the old-fashioned
    greenback and why some governments are trying to ban it. We describe how the blockchain
    technology behind the system could revolutionize many other industries. And we
    look at how a bitcoin outgrow known as initial coin offerings (ICOs) is testing
    regulators.


    # How Bitcoin Works


    Any bitcoin transaction—let''s say between a buyer (me) and a seller (the London
    Sushi Workshop)—creates a unique digital code that is stored in an online, open
    ledger as a blockchain. Everyone has access to the blockchain, but no one can
    see who those buyers and sellers are unless they wish to be identified. Each has
    a unique, anonymous address for the transaction.


    The London Sushi Workshop''s balance, which has grown because I paid my tuition,
    is a series of codes, also known as personal keys. The sushi school can keep them
    in “cold storage”—offline on something like a USB stick—or print them out. Or
    the school can keep them in something called a “wallet,” which is run by an online
    third party and, just like your physical wallet, can be stolen (or in this case
    hacked). When the London Sushi Workshop wants to convert bitcoins to dollars or
    pounds, it can make the transaction through an online exchange (also third parties,
    which have likewise been hacked, resulting in losses for individuals) and transfer
    the cash to a bank account.


    This decentralization puts bitcoin beyond the reach of regulators, but also creates
    risks. Third parties in the “wallet” or “exchange” businesses do not offer the
    kind of insurance you get at a bank. And, like with cash, if you print your bitcoin
    codes and stash them under your bed, you run the risk of losing all in a fire
    or robbery.'
