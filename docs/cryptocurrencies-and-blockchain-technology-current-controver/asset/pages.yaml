  md: '# Cryptocurrencies and Blockchain Technology


    # Governance, Rules, Oversight


    The financial services space is highly regulated, and with good reason: There
    are important restrictions placed on organizations that move money to ensure they
    are not facilitating criminal or terrorist activities. There are important considerations
    around financial sector stability, as well as privacy. While blockchain can create
    an immutable record of two parties agreeing to a transaction, in the financial
    sector we must also ensure the information entered into the ledger is legal and
    compliant with relevant regulations. As such, participants in a financial sector
    blockchain are likely to be licensed counterparties using a permissioned ledger,
    either in consortium or with third-party providers who set the rules that others
    agree to when they join the network. With the exception of a purely private scheme,
    the complexity of establishing governance arrangements and rules is not much different
    than that of setting up a payment system today, whether retail or wholesale. In
    this context, it is unclear that there are significant gains to be made from deploying
    DLT because the problem is around governance and rules, not technology.


    # Regulation


    In many financial inclusion use cases, the factor slowing things down is not technology,
    but regulation. Many payment systems, including cross-border systems, operate
    in real time. What slows things down is regulatory requirements, mainly related
    to antimoney laundering and combating the financing of terrorism (AML/CFT) or
    exchange controls. For example, in South Africa, I can send money instantaneously
    within South Africa using Real Time Clearing, but if I send money into the country,
    it can take days to get to my account. I recently used PayPal’s Xoom service to
    send money to bank accounts in the United Kingdom and South Africa. The transfer
    to the United Kingdom took five hours, end to end. Sending money to South Africa
    took five days and resulted in my account being frozen for two weeks) because
    of the South African'
