    # Privacy, Complexity, Scalability


    Privacy is a major and growing challenge in the financial inclusion space. And
    and putting proper privacy controls in place adds complexity to systems that are
    not centrally managed. SWIFT, the entity that handles cross-border payments on
    behalf of its member banks, recently completed a well-documented proof of concept
    using DLT among 28 of its 11,000 member banks. Although SWIFT reported that the
    test went extremely well, it concluded that further progress is needed on DLT
    before it can be ready for production-grade applications. It was clear from the
    test that the clearing of nostro accounts could be streamlined using DLT. But
    privacy was an issue: Running the test with just 28 banks required 528 subledgers
    to maintain the confidentiality of information. SWIFT calculated that rolling
    this out to its entire membership would require the creation of 100,000 subledgers,
    which would be a challenge to manage. This kind of complexity requires scalability
    of processing, and this is in an area where current database solutions outperform
    DLT. Using today''s technology, Visa can process 24,000 transactions per second.
    The best I have been able to find that any DLT can do is 1,500–2,000 transactions
    per second. The sequential nature of DLT and the possibility of forks (incompatible
    versions) in the ledger because of errors or asynchronous entries introduce additional
    inefficiencies as solutions scale.'
