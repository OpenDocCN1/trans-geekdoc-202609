    roughly 300k transactions per day. This measure shows the value we get for all
    that electricity, since the verified transaction (and our confidence in it) is
    ultimately the end product.


    # What Is Bitcoin''s Environmental Impact?


    It''s worth asking ourselves hard questions about Bitcoin''s environmental impact.


    Since 2015, Bitcoin''s electricity consumption has been very high compared to
    conventional digital payment methods. This is because the dollar price of Bitcoin
    is directly proportional to the amount of electricity that can profitably be used
    to mine it. As the price rises, miners add more computing power to chase new Bitcoins
    and transaction fees.


    It''s impossible to know exactly how much electricity the Bitcoin network uses.
    But we can run a quick calculation of the minimum energy Bitcoin could using,
    assuming that all miners are running the most efficient hardware with no efficiency
    losses due to waste heat. To do this, we''ll use a simple methodology laid out
    in previous coverage on Motherboard. This would give us a constant total mining
    draw of just over one gigawatt.


    That means that, at a minimum, worldwide Bitcoin mining could power the daily
    needs of 821,940 average American homes.'
