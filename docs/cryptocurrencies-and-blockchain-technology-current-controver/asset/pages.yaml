    Many central bankers, still starting from the fallout from that crisis, know this
    is the problem. Many see real benefits in removing banks from payments and recognize
    digital currencies can help. The question is how to get there without fomenting
    chaos.


    # Gradual Solutions


    One solution: a phased approach over time. You don’t provide CBDC to everyone
    at first; you start with large non-bank financial institutions, follow it up with
    a certain class of large corporations, then move to smaller businesses, and only
    make it available to individuals as a last step.


    Another solution: the introduction of a unique, central bank-determined CBDC interest
    rate. This would be an addition to the central bank toolkit for managing money
    supply, which currently hinges on a combination of a policy rate imposed on banks’
    reserves and interventions in the two-way market for buying and selling government
    securities with banks.


    A separate CBDC interest rate would provide a means to calibrate the flow of money
    between banks and digital fiat wallets, potentially within a long-term plan to
    gradually shift it from the former to the latter without overly disrupting the
    system.'
