    in Monongalia and Harrison counties—which have a combined population of about
    143,000—to offer the app to their registered voters not residing in the country,
    including Secretary of State (and Kersey''s boss) Mac Warner''s son, who is an
    active duty Army officer.


    West Virginia officials have been coy about how many people actually used Voatz''s
    app during the primary, though a source with knowledge of the project said it
    was as few as 13. But Kersey sounded confident in the limited sample.


    “The factors were it had to be secure, affordable, transparent, auditable and
    no mail, printer, fax or scanner needed,” he said. “The sailor in the submarine
    under the polar ice cap doesn''t have access to US Mail, but he does access to
    the internet.”


    # Several Steps for Authentication


    With voters and election officials rattled by discoveries of foreign hackers''
    attempts to meddle in the 2016 presidential election, digital voting systems can
    face a high level of distrust. But both Kersey and Voatz co-founder Nimit Sawhney
    defended the company''s platform as being highly secure.


    A demonstration proved by Sawhney showed that the app goes through several authentication
    steps, beginning with a sixdigit code that texted to a user''s phone and has to
    be entered back into the app. From there, a user is required to upload an image
    of a government-issued photo and then take a selfie for verification, which takes
    up to 24 hours, Sawhney said. Once that is complete, a registered user is finally
    presented with a ballot.


    Critics of new voting technologies frequently cite paper-based ballots as the
    preferred method to ensure trustworthy election results, and are wary of new technologies
    like blockchain, which is barely a decade old.


    “I know as an elections administrator, it raises a lot of red flags,” Kersey said.
    “But this posed the best options.”


    Kersey vouched for Voatz by telling a roomful of secretaries of state and other
    election officials that Warner and his chief'
