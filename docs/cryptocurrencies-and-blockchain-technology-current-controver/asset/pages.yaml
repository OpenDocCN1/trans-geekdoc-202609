    The AML monitoring mechanisms currently in place attribute every transaction to
    a preidentified legal entity. Data tracked in a fiat money paper-trail includes:
    (a) the financial system entry point, i.e. opening bank account, and (b) any transaction
    within the system, for example, sending money from one bank account to another
    or use of swift platforms. The systems then monitor the financial activity, evaluate
    the AML risks associated with such transactions, and follow up with any relevant
    notifications and reports. Use of the financial proceeds of a crime, when identified,
    can be easily attributed to a particular person.


    Critics of cryptocurrencies point to the lack of identifying information throughout
    digital transactions as a substantial obstacle to existing AML surveillance and
    enforcement capabilities. However, all of the essential regulatory and enforcement
    elements — identifying parties and information, a record of the transaction, and
    even enforcement — can exist in the cryptocurrency system. It''s all a matter
    of adjusting perspective.


