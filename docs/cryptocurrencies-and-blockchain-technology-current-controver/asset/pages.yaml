  md: '# Is It Possible to Regulate Cryptocurrencies?


    # Is There Trouble Ahead?

    There is if you take the most hostile, second answer to be correct: that collective
    greed has fuelled a speculative bubble that will eventually come crashing down.
    As people hear stories of others making money from cryptocurrencies, they buy
    their own—which inflates the price, creating more stories of wealth and more investment.
    The cycle continues until eventually the price of the underlying asset is out
    of kilter with reality. Eventually, the bubble bursts, and a lot of people look
    around to find they''ve lost everything.


    # What Next?

    Cryptocurrencies could achieve their ambitions, and become a widely used facet
    of daily life. A few people will become very rich as a result, but not really
    more so than early investors in other foundational technologies such as computing
    or the internet.


    # Hard Landing

    Or this speculative bubble could end with a crash so severe that it destroys faith
    in the entire sector, driving the investors out, bankrupting the miners who''ve
    spent thousands or millions on single-purpose hardware that requires a high bitcoin
    price to turn a profit, and leaving cryptocurrencies as a technological dead-end
    alongside cold fusion and jetpacks.


    # Cruising Altitude

    But maybe things will continue as they have done for the past five years. Cryptocurrencies''
    actual use stays stable, mostly illegal, largely underground, and completely disconnected
    from a market price that fluctuates wildly based on the whims of a class of financial
    speculators with little link to the ground truth. Instability, it turns out, is
    an oddly stable and predictable state of affairs.'
