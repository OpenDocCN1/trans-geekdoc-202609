  md: '# Voting on the Blockchain


    Benjamin Freed


    Benjamin Freed is the technology editor at StateScoop.


    Two months after West Virginia allowed a small group of overseas voters to participate
    in the May 8 primary election using online ballots powered by blockchain technology,
    one of the state''s top election''s officials said on Sunday it could be implemented
    statewide in the general election in November.


    If the results of a post-election audit are favorable toward the new technology,
    which offered to voters from two counties during the primary, West Virginia will
    offer all 55 of its counties to participate in blockchain-powered voting, Donald
    “Deak” Keyes, the state''s elections director, said at the National Association
    of Secretaries of State conference in Philadelphia.


    > "We have to wait on the audit,” Keyes said. But if officials get “something
    that comes back from someone who knows what they''re talking about and says it''s
    secure,” Keyes said hundreds more voters may have the option to vote using a mobile
    app instead of sending a paper ballot through international mail.


    West Virginia got two of its counties to participate in the primary experiment
    after being approached by Tusk Montgomery Philanthropies, a New York venture-capital
    firm with investments in cryptocurrency exchanges and other companies developing
    distributed ledger platforms. The state had been looking to modernize the way
    it gets ballots to its registered voters who live abroad, especially military
    personnel on deployment, but found most electronic-balloting systems too expensive.


    Tusk Montgomery agreed to pay for West Virginia to test out a mobile voting app
    developed by four-year-old Massachusetts firm Voatz. Keyes said his office recruited
    the elections chiefs'
