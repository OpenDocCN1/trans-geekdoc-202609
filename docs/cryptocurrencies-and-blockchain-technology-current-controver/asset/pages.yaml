    and while I use the blanket term “blockchain” in the below for simplicity''s sake,
    the nuances between different types of blockchain technologies can greatly impact
    the character and likelihood of success of a given initiative.


    By leveraging a shared and verified database of ledgers stored in a distributed
    manner, blockchain seeks to redesign information ecosystems in a more transparent,
    immutable, and trusted manner. Solving information asymmetries may be the real
    potential of blockchain, and this—much more than the current hype over virtual
    currencies—is the real reason to assess its potential.


    It is important to emphasize, of course, that blockchain’s potential remains just
    for the moment—only potential. Considerable hype surrounds the emerging technology,
    and much remains to be done (and many obstacles overcome) if it is to achieve
    the enthusiasts'' vision of “radical transparency.”


