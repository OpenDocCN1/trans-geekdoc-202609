    is almost akin to bad manners, a rude and shocking eruption of that which must
    not be spoken or thought of in polite, tightly guarded society. To avoid controversy,
    to quell controversy, is often seen as a public good, a victory for etiquette,
    perhaps even a moral or ethical imperative.


    Yet the studious, deliberate avoidance of controversy is also a whitewashing,
    a denial, a death threat to democracy. It is a false sterilizing and sanitizing
