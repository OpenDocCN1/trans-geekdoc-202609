    a bitcoin “miner,” and then passed on to you through a series of legitimate transactions.
    If you want to actually own some bitcoin, there are exactly two options: either
    become a miner (which involves investing a lot of money in computers and electricity
    bills—probably more than the value of the bitcoin you''ll actually make, unless
    you''re very smart), or simply buy some bitcoin from someone else using conventional
    money, typically through a bitcoin exchange such as Coinbase or Bitfinex.


    A lot of the quirks of the cryptocurrency come down to the collective agreement
    about what constitutes “legitimacy.” For instance, the first bitcoin was created
    in 2009, the total number in existence has been growing slowly, at a declining
    rate, ensuring that at some point around 2140, the 21 million bitcoin will be
    mined, and no more will ever be created.


    If you disagree with that collective agreement, there''s nothing stopping you
    from splitting with the wider network and creating your own version of bitcoin.
    This is what''s known as a “Fork,” and it''s already happened multiple times in
    the past (that''s what competitors such as Litecoin and Dogecoin are). The difficulty
    is persuading other people to follow you. A currency used by just one person isn''t
    much of a currency.


    # What Can I Actually Do with Cryptocurrencies?


    In theory, almost anything that can be done with a computer could, in some way,
    may be rebuilt on a cryptocurrency-based platform. Building a cryptocurrency involves
    turning a worldwide network of computers into a decentralised platform for data
    storage and processing—in effect, a giant hive-mind PC (that this no longer sounds
    like it has much to do with “cryptrencies”) is part of the reason some instead
    suggest the name “decentralised apps” to cover this sector.


    We''ve already seen proposals for YouTube clones, collective'
