  md: '# Cryptocurrencies and Blockchain Technology


    A new form of bookkeeping might seem like a dull accomplishment. Yet for thousands
    of years, going back to Hammurabi''s Babylon, ledgers have been the bedrock of
    civilization. That''s because the exchanges of value on which society is founded
    require us to trust each other''s claims about what we own, what we are owed,
    and what we owe. To achieve that trust, we need a common system for keeping track
    of our transactions, a system that gives definition and order to society itself.
    How else would we know that Jeff Bezos is the world''s richest human being, that
    the GDP of Argentina is $620 billion, that 71 percent of the world''s population
    lives on less than $10 a day, or that Apple''s shares are trading at a dull seem
    to be a stock.


    A blockchain (though the term is bandied about loosely,\u2014 often misapplied
    to things that are not really blockchains) is an electronic ledger—a list of transactions.
    Those transactions can in principle represent almost anything. They could be actual
    exchanges of money, as they are on the blockchains that underlie cryptocurrencies
    like Bitcoin. They could mark exchanges of other assets, such as digital stock
    certificates. They could represent instructions, such as orders to buy or sell
    a stock. They could include so-called smart contracts, which are computerized
    instructions to do something (e.g., buy a stock) if something else is true (the
    price of the stock has dropped below 10).


    What makes a blockchain a special kind of ledger is that instead of being managed
    by a single centralized institution, such as a bank or government agency, it is
    stored in multiple copies on multiple independent computers within a decentralized
    network. No single entity controls the ledger. Any of the computers on the network
    can make a change to the ledger, but only by following rules dictated by a "consensus
    protocol,\" a mathematical algorithm that requires a majority of the computers
    on the network to agree with the change."


    Once a consensus generated by that algorithm has been achieved, all the computers
    on the network update their copies of the ledger simultaneously. If any of them
    tries to add an entry to the'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# Are Blockchain Technologies Too Complex?


    ledger without the consensus, or to change an entry retroactively, the rest of
    the network automatically rejects the entry as invalid.


    Typically, transactions are bundled together into blocks of a certain size that
    are chained together (hence “blockchain”) by cryptographic locks, themselves a
    product of the consensus algorithm. This produces an immutable, shared record
    of the “truth,” one that—if things have been set up right—cannot be tampered with.


    Within this general framework are many variations. There are different kinds of
    consensus protocols, for example, and often disagreements over which kind is most
    secure. There are public, “permissionless” blockchain ledgers, to which in principle
    anyone can hitch a computer and become part of the network; these are Bitcoin
    and many other cryptocurrencies belong to. There are also private, “permissioned”
    ledger systems that incorporate no digital currency. These might be used by a
    group of organizations that need a common record-keeping system but are independent
    of one another and perhaps do not entirely trust another—a manufacturer and its
    suppliers, for example.


    The common thread between all of them is that mathematical rules and impregn cryptography,
    rather than trust in fallible humans or institutions, are what guarantee the integrity
    of the ledger. It is a version of what the cryptographer Ian Grigg described as
    “triple-entry bookkeeping”: one entry on the debit side, another for the credit,
    and a third into an immutable, undisputed, shared ledger.


    The benefits of this decentralized model emerge when weighed against the current
    economic system’s cost of trust. Consider this: In 2007, Lehman Brothers reported
    profits and revenue, all endorsed by its auditor, Ernst & Young. Nine months later,
    a nosedive in those same assets rendered the 158-year-old business bankrupt, triggering
    the biggest financial crisis in 80 years. Clearly, the valuations cited in the
    preceding years’ books were away off. And we later learned that Lehman’s ledger
    wasn’t the only one with dubious data. Banks in the US and Europe paid out hundreds
    of'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# Cryptocurrencies and Blockchain Technology


    billions of dollars in fines and settlements to cover losses caused by inflated
    balance sheets. It was a powerful reminder of the high price we pay for trusting
    centralized entities’ internally devised numbers.


    The crisis was an extreme example of the cost of trust. But we also find cost
    ingrained in most other areas of the economy. Think of all the accountants whose
    cubicles fill the skyscrapers of the world. Their jobs, reconciling their company’s
    ledgers with those of its business counterparts, exist because neither party trusts
    the other’s record. It is a time-consuming, yet necessary process.


    Other manifestations of the cost of trust are felt not in what we do but in what
    we can’t. Two billion people are denied bank accounts, which locks them out of
    the global economy because banks don’t trust the records of their assets and identities.
    Meanwhile, the internet of things, which it hoped will have billions of interacting
    autonomous devices forging new efficiencies, won’t be possible if gadget-to-gadget
    microtransactions require the prohibitively expensive intermediation of centrally
    controlled ledgers. There are many other examples of how this problem limits innovation.


    These costs are rarely acknowledged or analyzed by the economics profession, perhaps
    because practices such as account reconciliation are assumed to be an integral,
    unavoidable feature of business (much as pre-internet businesses assumed they
    had no option to pay large expenses to mail out monthly bills). Might this blind
    spot explain why some prominent economists are quick to dismiss blockchain technology?
    Many say they can’t see the justification for its costs. Yet their analyses typically
    don’t weigh costs against the far-reaching societal cost of trust that the new
    models seek to overcome.


    More and more people get it, however. Since Bitcoin’s low-key release in January
    2009, the ranks of its advocates have swelled from libertarian-minded radicals
    to include former Wall Street professionals, Silicon Valley tech mavens, and development
    and'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Are Blockchain Technologies Too Complex?


    aid experts from bodies such as the World Bank. Many see the technology’s rise
    as a vital new phase in the internet economy—one that is, arguably, even more
    transformative than the first. Whereas the first wave of online disruption saw
    brick-and-mortar businesses displaced by leaner digital intermediaries, this movement
    challenges the whole idea of for-profit middlemen altogether.


    The need for trust, the cost of it, and the dependence on middlemen to provide
    it is one reason why behemoths such as Google, Facebook, and Amazon turn economies
    of scale and network-effect advantages into de facto monopolies. These giants
    are, in effect, centralized ledger keepers, building vast records of “transactions”
    in what we is, arguably, the most important “currency” in the world: our digital
    data. In controlling those records, they control us.


    The potential promise of overturning this entrenched, centralized system is an
    important factor behind the gold-rush-like scene in the crypto-token market, with
    its soaring volatile prices. No doubt many—perhaps most—investors are merely hoping
    to get rich quick and give little thought to why the technology matters. But manias
    like this, as irrational as they become, don''t spring out of nowhere. As with
    the arrival of past transformative technologies—for example, or electricity—rampant
    speculation is almost inevitable. That’s when a new idea comes along, investors
    have no framework for estimating how much value it will create or destroy, or
    for deciding which enterprises will win or lose.


    Although there are still major obstacles to overcome before blockchains can fulfill
    the promise of a more robust system for recording and storing objective truth,
    these concepts are already tested in the field.


    Companies such as IBM and Foxconn are exploiting the idea of immutability in projects
    that seek to unlock trade finance and make supply more transparent. Such transparency
    could also give consumers better information on the sources of what they buy—whether
    a T-shirt was made with sweatshop labor, for example.'
