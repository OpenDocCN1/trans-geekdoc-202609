- pgno: 159
  md: '# Cryptocurrencies and Blockchain Technology


    Another important new idea is that of a digital asset. Before Bitcoin, nobody
    could own an asset in the digital realm. Since copying digital content is easy
    to do and difficult to stop, providers of digital products such as MP3 audio files
    or e-books never give customers outright ownership of the content, but instead
    lease it and define what users can do with it in a license, with stiff legal penalties
    if the license is broken. This is why you can make a 14-day loan of your Amazon
    Kindle book to a friend, but you can''t sell it or give it as a gift, as you might
    give a paper book.


    Bitcoin showed that item of value could be both digital and verifiably unique.
    Since nobody can alter the ledger and “double-spend,” or duplicate, a bitcoin,
    it can be conceived of as a unique “thing” or asset. This means we can now represent
    any form of value—a property title or a music track, for example—as an entry in
    a blockchain transaction. And by digitizing different forms of value in this way,
    we can introduce software for managing the economy that operates around them.


    As software-based items, these new digital assets can be given certain “If X,
    then Y” properties. In other words, money can become programmable. For example,
    you could pay to hire an electric vehicle using digital tokens that also serve
    to activate or disable its engine, fulfilling the encoded terms of a smart contract.
    It''s quite different from analog tokens such as banknotes or metal coins, which
    are agnostic about what they''re used for.


    What makes these programmable money contracts “smart” is not that they''re automated;
    we already have that when our bank follows our programmed instructions to autopay
    our credit card every month. It''s that the computers executing the contract are
    monitored by a decentralized blockchain network. That assures all signatories
    to a smart contract that it will be carried out.


    With this technology, the computers of a shipper and an exporter, for example,
    could automate a transfer of ownership of goods once the decentralized software
    they both use sends a signal that a digital-currency payment—or a cryptographically
    unbreakable commitment to pay—has been made. Neither party'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# Are Blockchain Technologies Too Complex?


    necessarily trusts the other, but they can nonetheless carry out that automatic
    transfer without relying on a third party. In this way, smart contracts take automation
    to a new level—enabling a much more open, global set of relationships.


    Programmable money and smart contracts constitute a powerful way for communities
    to govern themselves in pursuit of common objectives. They offer a potential breakthrough
    in the “Tragedy of the Commons,” the long-held notion that people can’t simultaneously
    serve their self-interest and the common good. That was evident in many of the
    blockchain proposals from the 100 software engineers who took part in Hack4Climate
    at last year’s UN climate-change conference in Bonn. The winning team, with a
    project called GainForest, is now developing a blockchain-based system by which
    donors can reward communities living in vulnerable rain forests for proactive
    actions they take to restore the environment.


    Still, this utopian, frictionless “token economy” is far from reality. Regulators
    in China, South Korea, and the US have cracked down on issuers and traders of
    tokens, viewing such currencies as speculative get-rich-quick schemes that avoid
    securities laws as world—changing economic models. They’re not entirely wrong:
    some developers have pre-sold tokens in “initial coin offerings,” or ICOs, but
    haven’t used the money to build and market products. Public or “permissionless”
    blockchains like Bitcoin and Ethereum, which hold the greatest promise of absolute
    openness and immutability, are facing growing pains. Bitcoin still can’t process
    more than seven transactions a second, and transaction fees can sometimes spike,
    making it costly to use.


    Meanwhile, the centralized institutions that should be vulnerable to disruption,
    such as banks, are digging in. They are protected by existing regulations, which
    are ostensibly imposed to keep them honest but inadvertently constitute a compliance
    cost for startups. Those regulations, such as the burdensome reporting and capital
    requirements that the New York State Department of Financial Services “BitLicense”
    imposed on cryptocurrency remittance startups, become barriers to entry that protect
    incumbents.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# Cryptocurrencies and Blockchain Technology


    But here''s the thing; the open-source nature of blockchain technology, the excitement
    it has generated, and the rising value of the underlying tokens have encouraged
    a global pool of intelligent, impassioned, and financially motivated computer
    scientists to work on overcoming these limitations. It''s reasonable to assume
    they will constantly improve the tech. Just as we''ve seen with internet software,
    open, extensible protocols as these can become powerful platforms for innovation.
    Blockchain technology is moving way too fast for us to think later versions will
    improve upon the present, whether it''s Bitcoin''s cryptocurrency-based protocol,
    Ethereum''s smart-contract-focused blockchain, or some as-yet-undiscovered platform.


    The crypto bubble, like the dot-bubble came, is creating the infrastructure that
    will enable the technologies of the future to be built. But there''s also key
    difference. This time, the money being raised isn''t underwriting physical infrastructure
    but social infrastructure. It''s creating incentives to form global networks of
    collaborating developers, hive minds whose supply of interacting, iterative ideas
    is codified into lines of open-source software. That freely accessible code will
    enable the execution of countless as-yet-unimagined ideas. It is the foundation
    upon which the decentralized economy of the future will be built.


    Just as few people in the mid-1990s could predict the later emergence of Google,
    Facebook, and Uber, we can''t predict what blockchain-based applications will
    emerge from the wreckage of this bubble to dominate the decentralized future.
    But that''s what you get with extensible platforms. Whether it''s the open protocols
    of the internet or the blockchain''s core components of algorithmic consensus
    and distributed record-keeping, their power lies in providing an entirely new
    paradigm for innovators ready to dream up and deploy world-changing applications.
    In this case, those applications—whatever shape they take—will be aimed squarely
    at disrupting many of the gatekeeping institutions that currently dominate our
    centralized economy.'
