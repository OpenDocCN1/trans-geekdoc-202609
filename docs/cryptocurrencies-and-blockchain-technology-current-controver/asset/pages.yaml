  md: '# Cryptocurrencies and Blockchain Technology


    tosses sand into the gears of commerce, making transactions less efficient and
    more costly. And any currency that is hard to use is less valuable as a medium
    of exchange.


    # Still Great for Money Laundering


    This isn''t speculative. we actually have a historical example of how this works.
    In the United States in the decades before the Civil War, there was no national
    currency. Instead, it was an era of what was called “free banking.” Individual
    banks issued bank notes, theoretically backed by gold, that people used as money.
    The problem was that the farther away a bank you got, the less recognizable (and
    therefore the less trustworthy) a bank''s note was to people. And every time you
    did a deal, you had to vet the note to make sure it worth what your trading partner
    said it was worth. So-called wildcat banks sprang up, took people''s money, issued
    a host of notes, and then shut down, making their notes worthless. To be sure,
    people came up with workarounds—there were volumes that a kind of Yelp for banking,
    displaying the panop of bank notes and rating them for reliability and value.
    But the broader consequence was that doing business was simply more complicated
    and slower than it otherwise would have been. The same will be true in a world
    where some people use Ethereum, others use Litecoin, and others use Ripple.


    That doesn''t mean that cryptocurrencies are useless. On the contrary, for transactions
    that one wants to keep hidden from the government (or other authorities), they
    will remain useful. Buying drugs, laundering money, evading capital controls,
    protecting your money in countries with hyperinflationary environments: these
    are all situations where cryptocurrencies can come in handy. But the notion that
    private cryptocurrencies might soon (or ever) be a meaningful competitor to fiat
    money for everyday transactions is little more than a pipe dream.'
