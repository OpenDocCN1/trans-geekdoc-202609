- pgno: 58
  md: '# Is Blockchain Too Risky to Operate on a Mass Scale?


    Another project, CryptoNote, didn’t use the same code base but sprouted from the
    same community, building on (and against) Bitcoin again and again, on older ideas.
    Published in December 2012, it led to the creation of several cryptocurrencies,
    of which Monero(2014) is the best-known. Monero takes a different approach to
    Zcash but aims to solve the same issues: privacy and fungibility.


    As is often the case in the open source world, there is none but one tool for
    the job.


    # The Next Generations: “Blockchain-ng”


    So far, however, all these variations have only really been about refining cryptocurrencies
    or extending them to support another type of transaction. This brings us to the
    second generation of blockchains.


    Once the community started modifying what a blockchain could be used for and tweaking
    technical aspects, it didn’t take long for some people to expand and rethink it
    further. A longtime follower of Bitcoin, Vitalik Buterin suggested in late 2013
    that a blockchain’s transactions could represent the change of states of a state
    machine, conceiving the blockchain as a distributed computer capable of running
    applications (“smart contracts”). The project, Ethereum, went live in July 2015.
    It has seen fair success in running distributed apps, and the popularity of some
    of its better-known distributed apps (CryptoKitties) have even caused the Ethereum
    blockchain to slow down.


    This demonstrates one of the big limitations of current blockchains: speed and
    capacity. (Speed is often measured in transactions per second, or TPS.) Several
    approaches have been suggested to solve this, from sharding to sidechains and
    so-called “second-layer” solutions. The need for more innovation here is strong.


    With the words “smart contract” in the air and a proved–if still slow—technology
    to run them, another idea came to fruition: permissioned blockchains. So far,
    all the blockchain networks we’ve'
