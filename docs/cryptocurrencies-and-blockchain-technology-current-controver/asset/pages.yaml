- pgno: 20
  md: '# What Can You Make and Trade with Blockchain?


    Umed Saidov


    Umed Saidov holds an MBA from the European Institute of Business Administration
    and is the founder of Oqulent LLC, an investment research company focused on blockchain
    technology and crypto assets.


    Blockchain technology is the “engine” that powers cryptocurrency networks and
    it is rapidly gaining recognition among businesses.


    But what exactly is it? How does it work? And how does it generate economic value?


    # What Is Blockchain?


    In essence, blockchain is a cryptographically secured ledger that tracks transactions
    on a decentralized network. Decentralized networks, like those of bitcoin, Ethereum,
    Cardano, etc., are a collection of computers that are self-managed by a consensus
    mechanism—a set of rules that dictate how data is recorded, shared, and synchronized
    throughout the network.


    # How Does Blockchain Work?


    Blockchain’s theoretical foundation fuses mathematics, computer science, game
    theory, and cryptography. There are several key components that together make
    blockchain tick.


    +   * Hash Function: Cryptographic hash functions are central to blockchain technology.
    They are used to “chain-link” blocks. The hash function has two important features
    that help it maintain the security of blockchain.


    > "Cryptocurrencies: What Is Blockchain?” by Umed Saidov, CFA Institute, June
    11, 2018. This article previously appeared on CFA Institute’s Enterprising Investor
    blog. Copyright 2018, CFA Institute. Reproduced from the Enterprising Investor
    blog with permission from CFA Institute. All rights reserved.'
