  md: 'Reserve Bank''s exchange control policy and required processes. That is not
    a technology problem: It is a regulatory one. That said, from an operator''s perspective,
    DLT could help reduce the cost of cross-border transfers by making net settlement
    positions known in real time to all participants, lowering liquidity management
