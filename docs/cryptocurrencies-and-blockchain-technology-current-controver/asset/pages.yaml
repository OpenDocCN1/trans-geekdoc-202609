    # What Is Trust?


    In economic exchanges there are three kinds of trust: institutions-based, characteristic-based,
    and process-based.


    Institutions-based trust comes from the involvement of a central authority. Think
    of a commercial bank (and a government insuring deposits in that bank), as in
    the previous example.


    Characteristic-based trust is the trust we have in people mostly because they
    represent some sort of similarity to us, or show admirable features or values
    that warrant trust. For example, you are more likely to trust someone from the
    area where you grew up than someone elsewhere; you might also trust someone with
    a similar taste in music, or who simply embodies what you value in life.


    Process-based trust arises when previous experiences suggest that the inputs by
    one party will be predictably reciprocated. This trust often evolves into social
    micro-rules or norms. For example, most people would generally trust that if they
    do not harm a person, that person will also not harm them. Likewise, one would
    trust that others will answer when asked a question.


    It follows that trust can be destroyed and lost if the central authority fails,
    the person you trusted fails, or the process you trusted.


    When it comes to the blockchain specifically, we can see that there are at least
    two forms of this trust at play. Because of its complexity many people may find
    it difficult to trust the process.'
