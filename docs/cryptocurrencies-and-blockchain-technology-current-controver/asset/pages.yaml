- pgno: 101
  md: '# Cryptocurrencies and Blockchain Technology


    the database, or ledger, and the freedom to access the full history of all previous
    changes, is similar to a blockchain.


    While traditional encyclopedias rely on scholars to provide information, Wikipedia
    gives this role to the public, bypassing trusted authorities.


    Similarly, Bitcoin gives the role of the intermediary to the public, bypassing
    traditional central intermediaries such as banks.


    # Other Common Features


    # Consensus


    Wikipedians contribute information with the aim of improving the quality of the
    existing information. If an edit on Wikipedia is not accepted by other contributors
    it will be changed until a consensus is reached.


    If no consensus can be reached, the “edit war” is settled by an appointed authority.


    The consensus in Bitcoin follows the greatest amount of work expended by the Bitcoin
    network consisting of “miners,” and is represented by the longest blockchain.


    Miners verify transactions and expend resources to complete the “proof-of-work.”
    Once the work is complete the network will show their acceptance by linking new
    blocks to the existing one.


    # Transparency


    Contributions made by Wikipedians are transparent, similar to the open and publicly
    accessible transaction history of any user’s Bitcoin wallet stored over the blockchain.


    The time-stamped history of all edits made to the Wikipedia page is visible through
    the “View History.” Just as each Bitcoin can be traced to its inception, all previous
    versions and iterations of a Wikipedia entry are publicly available and show the
    path towards the current consensus.


    The dynamic evolution of content within Wikipedia is a major difference from traditional
    encyclopedias, which offer a more centralised and more static repository of information.'
