    The structure of blockchain is not the only characteristic of the cryptocurrency
    system that benefits AML efforts. Crypto miners, which act as de facto enforcement,
    are integral to the system as well. Once a validation is announced to the network,
    miners “check the math,” and a block is added to the ledger only when the required
