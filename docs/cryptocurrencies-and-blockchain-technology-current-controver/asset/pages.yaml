  md: '# Who Watches the Blockchain?


    Dirk Baur and Niels Van Quaquebekeke


    Dirk Baur is a professor of finance at the University of Western Australia and
    Niels Van Quaquebekeke is a professor of leadership and organizational behavior
    at Kühne Logistics University in Hamburg, Germany.


    A common idea about the blockchain, the technology that powers Bitcoin and other
    cryptocurrencies, is that it can “create trust,” or allow two parties to make
    a transaction “without relying on trust.”


    If true, this means we could create a world without a trusted “man in the middle.”
    We could have financial services without a bank verifying transactions and we
    could transfer ownership (of a house, for instance) without a lawyer. This idea
    is wrong.


    The blockchain does not create or eliminate trust. It merely converts trust from
    one form to another. While we previously had to trust financial institutions to
    verify transactions, with the blockchain we have to trust the technology itself.


    It is also not clear that a blockchain-powered currency (such as Bitcoin) can
    go mainstream without the backing of a trusted authority. In fact there are hardly
    any examples of money (including gold) that have ever worked without the backing
    of a central authority or a sovereign.


    When you make a traditional money transfer the bank will first verify that you
    have sufficient cash, and then debit your account and credit the recipient. Think
    of the blockchain as a decentralised version of this process. Rather than all
    of this information being held and verified by the bank, it is done on an “open
    public ledger”.


    > "The blockchain does not eliminate the need for trust,” by Dirk Baur and Niels
    Van Quaquebekeke, The Conversation, November 16, 2017. https://theconversation.com/the-blockchain-does-not-eliminate-the-need-for-trust-86481.
