  md: '# The Blockchain Is Just a Ledger


    Michael J. Casey and Paul Vigna


    Michael Casey is a senior lecturer on global economics and management at MIT.
    Paul Vigna is a reporter for the Wall Street Journal. Both are authors of The
    Age of Cryptocurrency: How Bitcoin and Digital Money Are Challenging the Global
    Economic Order.


    The dot-com bubble of the 1990s is popularly viewed as a period of crazy excess
    that ended with hundreds of dollars of wealth being destroyed. What''s less often
    discussed is how all the cheap capital of the boom helped fund the infrastructure
    upon which the most important internet innovations would be built after the bubble
    burst. It paid for the rollout of fiber-optic cable, R&D in 3G networks, and the
    buildout of giant server farms. All of this would make possible the technologies
    that are now the bedrock of the world''s most powerful companies: algorithmic
    search, social media, mobile computing, cloud services, big-data analytics, AI,
    and more.


    We think something similar is happening behind the wild volatility and stratospheric
    hype of the cryptocurrency and blockchain boom. The blockchain skeptics have crowded
    gleefully as crypto-token prices have tumbled from last year''s dizzying highs,
    but they make the same mistake as the crypto fanboys they mock: they conflate
    price with inherent value. We can''t predict what the blue-chip industries built
    on blockchain technology will be, but we are confident that they will exist, because
    the technology itself is all about creating priceless asset: trust.


    To understand why, we need to go back to the 14th century. That was when Italian
    merchants and bankers began using the double-entry bookkeeping method. This method,
    made possible'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Are Blockchain Technologies Too Complex?


    the adoption of Arabic numerals, gave merchants a more reliable record-keeping
    tool, and let bankers assume a powerful new role as middlemen in the international
    payments system. Yet it wasn''t just the tool itself that made way for modern
    finance. It was how it was inserted into the culture of the day.


    In 1494 Luca Pacioli, a Franciscan friar and mathematician, codified their practices
    by publishing a manual on math and accounting that presented double-entry bookkeeping
    not only as a way to track accounts but as a moral obligation. The way Pacioli
    described it, for everything of value that merchants or bankers took in, they
    had to give something back. Hence the use of offsetting entries to record separate,
    balancing values—a debit matched with a credit, an asset with a liability.


    Pacioli''s morally upright accounting bestowed a form of religious benediction
    on these previously disparaged professions. Over the next centuries, clean books
    came to be regarded as a sign of honesty and piety, clearing bankers to become
    payment intermediaries and speeding up the circulation of money. That funded the
    Renaissance and paved the way for the capitalist explosion that would change the
    world.


    Yet the system was not impervious to fraud. Bankers and other financial actors
    often breached their moral duty to keep honest books, and they still do—just like
    Bernie Madoff''s clients or Enron''s shareholders. Moreover, even when they are
    honest, their honesty comes at a price. We''ve allowed centralized trust managers
    such as banks, stock exchanges, and other financial middlemen to become indispensable,
    and this has turned them from intermediaries into gatekeepers. They charge fees
    and restrict access, creating friction, curtailing innovation, and strengthening
    their market dominance.


    The real promise of blockchain technology, is that it could make you a billionaire
    overnight or give you a way to shield your financial activities from noisy governments.
    It''s that it could drastically reduce the cost of trust by means of a radical,
    decentralized approach to accounting—and, by extension, create a new way to structure
    economic organizations.'
