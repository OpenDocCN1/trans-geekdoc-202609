  md: '# Is Blockchain Too Risky to Operate on a Mass Scale?


    assigned ownership of the value unit and so no recordkeeping is needed to use
    it as a payment instrument. Gold differs from cash by its competitive creation
    process allows anyone to enter the business of extracting gold and thereby create
    new gold units.


    Commercial bank deposits are virtual money. Virtual money has no physical representation.
    It exists only as a record in an accounting system. When a payment is made, the
    accounts are adjusted by deducting the payment amount from the buyer and crediting
    it to the seller. In most countries, households and firms use commercial bank
    deposits to make electronic payments. There are many ways to initiate payments;
    the most common are credit cards, debit cards, checks, and online banking. Commercial
    banks compete for deposits; that is why we consider the creation of money in the
    form of commercial bank deposits as competitive. The banks are responsible for
    keeping records so any transaction between a buyer and a seller requires a commercial
    bank or several commercial banks to update the respective accounts. For that reason,
    commercial bank deposits are processed in a centralized payment system.


    Central bank electronic money is also virtual money. In most countries, public
    access to electronic central bank money is restricted. In Switzerland, for example,
    it can be held only by a few financial intermediaries. As of now, there are roughly
    200 intermediaries that have accounts at the Swiss National Bank and they use
    the funds in these accounts for settlement purposes and to fulfill reserve requirements.
    A proposal that we label “central bank electronic money for all” would allow all
    households and firms to open accounts at central banks, which would then allow
    them to make electronic payments with central bank money instead of commercial
    bank deposits. (We will come back to this proposal in the next section.) Central
    bank electronic money is issued monopolistically and transactions are conducted
    in a centralized payment system.


    Bitcoin is the first virtual money for which ownership rights to the various monetary
    units are managed in a decentralized network.'
