  md: '# Introduction


    > “You can''t stop things like Bitcoin. It will be everywhere and the world will
    have to readjust.”n

    —John McAfee, Founder of the McAfee computer software company


    When you owe somebody money, you may write an “I owe you” note to help you and
    your lender remember. If you actually get around to paying the debt off, the note
    you’ve written down is as good as the money you’re going to pay. In one way or
    another, this is how modern currency works; we’re always transferring debts, from
    governments to banks and from banks back to you. Because blockchain technology—a
    list of records that is constantly growing and is connected by cryptography—is
    fundamentally about using digital space to keep information secure, it has been
    a magnet for cryptocurrency advocates. Cryptocurrencies are digital assets that
    can be exchanged and are secured by cryptography. Cryptocurrency proponents see
    it as a way to use money unattached to government-issuing bodies, which they argue
    is merely a relic of the pre-internet era.


    From this perspective, blockchain is simple enough. The amount of information
    that a line of code can contain is limitless, so why should currency be tethered
    to physical or geographic locations? Because most of the world doesn''t use bitcoin,
    the currency is associated with dark sides of the internet and unseen actors,
    but on the face of it, bitcoin is an argument for transparency. Cryptocurrency
    operates on a ledger in which an endless number'
