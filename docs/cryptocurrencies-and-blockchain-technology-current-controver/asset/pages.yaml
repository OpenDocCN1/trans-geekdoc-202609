    But if you are planning to commit financial crime, store illegal downloads, or
    host pirated videos a decentralised version of those services becomes much more
    appealing. That’s why bitcoin, for instance, has become the currency of choice
    for online drug dealers and criminals demanding ransoms to restore hacked data.


    “Crime” is a broad term. In many countries, having a political opinion contrary
    to that of the ruling regime is considered broadly criminal; many more limit the
    freedom of their citizens in ways that citizens of liberal democracies view as
    unethical and inhumane. If cryptocurrencies allow those limitations to be overcome,
    it may technically be promoting crime, but not in the way most cryptocurrency
    means.


    # You Keep Saying “Blockchain.” What Does That Actually Mean?


    The concept of the blockchain lies at the heart of all cryptocurrencies. It is
    the decentralised historical record of changes in the ownership of the asset,
    be it simply spending a bitcoin or executing a complex “smart contract” in one
    of the second-generation cryptocurrencies such as Ethereum. Whenever a cryptocurrency
    transaction occurs, its details are broadcast throughout the entire network by
    the spending party, ensuring that everyone has an up-to-date record of ownership.
    Periodically, all the recent changes get bundled into one “block,” and added to
    the historical record. And so the “blockchain”—a linked list of all the previous
    blocks—serves the full and complete record of who owns on the network.


    # So What Do Miners Actually Do?


    They build the blockchain. How precisely do they do that varies from cryptocurrency
    to cryptocurrency, but bitcoin is a good example: every 10 minutes or so, one
    miner is semi-randomly selected to do the work of taking all the transactions
    they’ve heard about, declaring'
