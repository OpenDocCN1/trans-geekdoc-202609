  md: '# Blockchain Is As Good As Gold, and That’s a Problem


    Bruno Skvorc


    Bruno Skvorc has master’s degrees in English language and literature and computer
    science and has studied blockchain since 2015.


    When the idea of bitcoin was being put to paper, its author—Satoshi Nakamoto—wanted
    the mining of this cryptocurrency to simulate the mining of precious metals like
    gold. This is done by giving a reward of a certain amount of bitcoins to the miner
    who confirms a block.


    In the beginning, the reward was 50 BTC. Every 210,000 blocks, the reward would
    become half the previous amount. This event is called the *halving*. After 64
    halvings, the reward is programmed to be zero. If a block is mined every 10 minutes,
    it is calculable that the last of the 21 million bitcoins will be mined in 2140.


    # Comparison to Gold


    Back in the 1800s, the gold rush started very rapidly. The mining was happening
    through generations and generations, however. This prevented the accumulation
    of enormous amounts of gold with not certain individuals, and stopped a too early
    or too quick rise in price. This resulted in less HODL mentality (the mentality
    of not spending and waiting for the value to rise). In fact, most of the gold
    diggers from the early days immediately spent their gold—they needed land, tools
    for more digging, food, horses, gambled, drank a lot, etc. Gold was not a currency
    in and of itself. The real currency were the bonds, the IOUs that banks gave out
    to individuals in exchange for keeping their gold safe, as we’ve already mentioned
    in the cryptocurrency into post.


    > "Is Bitcoin Finite or Is It Just a Myth?” by Bruno Skvorc, Bitfalls, September
    17, 2017. Reprinted by permission.'
