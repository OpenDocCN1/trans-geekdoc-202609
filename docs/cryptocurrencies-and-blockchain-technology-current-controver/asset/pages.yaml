  md: '# Cryptocurrencies and Blockchain Technology


    # The Non-Case for Central Bank Cryptocurrencies


    The distinguishing characteristic of cryptocurrencies is the decentralized nature
    of transaction handling, which enables users to remain anonymous and allows for
    permissionless access. In this section, we argue that it makes little sense for
    central banks to issue cryptocurrencies even though it would be straightforward
    from a technological point of view to do so.


    In theory, a central bank could easily introduce a central bank cryptocurrency.
    There exist standards such as Ethereum''s ERC20 or ERC223 token standards that
    can be used to create new fungible tokens that are compatible with the Ethereum
    blockchain''s infrastructure. Alternatively, one could attach additional value
    components to fractions of existing cryptoassets, such as Bitcoin. The additional
    value—in this case, fiat currency—would be part of a specific fraction of a Bitcoin
    (or more precisely an unspent transaction output) and could be represented and
    traded on the Bitcoin blockchain. This is usually referred to as “colored coins.\
    Finally, a central bank can develop a brand new blockchain. All approaches are
    fairly straightforward to implement and would allow for the issuance of a central
    bank cryptocurrency on a public blockchain.


    To ensure parity between a crypto fiat unit and central bank reserves, the central
    bank must be willing to buy and sell any number of these tokens at par. The valuation
    will depend on the central bank’s credibility; but, if a central bank is determined
    to issue a central bank cryptocurrency, it would have the means to do so. In fact,
    the convertibility mechanism can be compared with different denominations of cash,
    where central banks make a similar claim.¹¹³


    However, the key characteristics of cryptocurrencies are a red flag for central
    banks. That is, no reputable central bank would have an incentive to issue an
    anonymous virtual currency. The reputational risk would simply be too high. Think
    of a hypothetical “Fedcoin” used by a drug cartel to launder money or a terrorist
    organization to acquire weapons. Moreover, commercial banks'
