    The question we have not “Does blockchain work?” but “Does it work better than
    other technology solutions in the market?” And what are the cost-benefit trade-offs
    of switching to a new consensus-based technology solution? We have seen lots of
    proofs of concept that it can work, but not a lot of quantified analysis on why
    a DLT solution might be better than existing alternatives.


