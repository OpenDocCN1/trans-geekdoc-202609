  md: '# Cryptocurrencies and Blockchain Technology


    # Intersection with Cash Economy


    In financial inclusion, which is about bringing the poor into the financial system,
    there is a major challenge around the way new technologies intersect with the
    cash economy. No matter how money is sent around the world digitally, poor people
    need to be able to access and use their financial resources in cash, at least
    until better solutions are available for paying digitally. Mobile money has garnered
    a lot of attention in recent years for the important role it has played in improving
    financial inclusion for the poor. But mobile money is only partly a technology
    solution. It is mainly a cash distribution business — the cash-in/cash-out interface
    is critical for enabling people operating in the cash economy to use the system.
    There are a lot of interesting experiments underway to shift to a more digital
    profile. For example, using smartphones and QR codes can substantially lower the
    cost of delivering a payments service. But these solutions rely heavily on people
    having access to smartphones and bank accounts, which is not yet the case in many
    poorer parts of the world. And smartphones and QR codes do not need DLT. Mobile
    network operators, with 2.9 million active cash-in/cash-out agents worldwide,
    currently reach the poor very effectively, as is clearly validated by the World
    Bank''s Global Findex. And they are increasingly adding use cases like international
    remittances. GSMA estimates that the cost of sending remittances to Africa can
    be cut in half by sending remittances via mobile money. But this works on existing
    technology. It is not evident that DLT makes it work better, particularly in environments
    where both 3G and electricity access are sketchy.


    # Recourse


    Finally, any DLT solutions would have to incorporate mechanisms related to recourse
    and consumer protection, whether accepting liability for fraud or helping consumers
    to find payments that have gone astray or data entries that are incorrect. This
    is not necessarily the responsibility of the distributed ledger operator, but
    rules of engagement would need to be agreed to and implemented'
  merge: -1
