    # 2.2. Patient Health Questionnaire (PHQ-9)


    The Patient Health Questionnaire (PHQ-9) was used to collect depression screening
    among the participants. The instrument consists of nine items with multiple-choice
    format. Each item is rated on a four-point scale, ranging from 0 (Not at all)
    to 3 (Nearly every day). The PHQ-9 score was calculated by summing the scores
    from 0 to 27 to determine the severity of depression. The score was categorized
    as follows: mild, moderate, moderately severe, and severe.


    +   Step 1: obtain a comprehensive list of university students from the registrar''s
    office of various universities in the south.

    Step 2: Sequential numbers were randomly assigned to each student, numbering from
    1 to n=34,000. This enumeration was used as the sampling frame, from which a random
    sample would be drawn.

    Step 3: determine the sample size based on the population size of 34,000, which
    was calculated using the Krecie and Cochran method. Based on the guidelines and
    considerations of the study, we opted to use a confidence level of 95% and a margin
    of error of 5%. This resulted in a required sample size of 384 (as per Morgan,
    2021).

    Step 4: Select the participants from the sampling frame stated in Step 2 by employing
    a random number generator. While the required requirement was met, 387 students
    were selected, 11 agreed to participate in the study, and 7 were refusing to answer
    all the questions, resulting in missing data. After excluding 16 cases (11 non-participants
    and 5 incomplete), our final sample size remained at 368. Within this sample,
    51.5% were female, and 48.5% were male.


    # 2.2.3. Generalized Anxiety Disorder (GAD-7)


    A screening tool and scale used for generalized anxiety disorder among the participants.
    The instrument consists of seven items, each having points ranging from 0 “not
    at all” to 3 “nearly every day”. The GAD-7 score was ranging from 0 to 21. According
    to Osman-Samani et al. (2018), the scores were interpreted as follows: minimal
    anxiety (0-4), mild anxiety (5-9), moderate anxiety (10-14), and severe anxiety
    (15-21). The study yielded a satisfactory reliability, with a Cronbach’s alpha
    value of 0.851.


    # 2.2. Measures


    # 2.3. Outcome


    # 2.3.1. Suicidal ideation


    # 2.2.1. Independent variables


    The variables explored in the study included: marital status, family income, residence,
    physical activity, smoking habits, social quality, relationship with partner,
    and depression. The assessment of physical activity level was conducted utilizing
    the Global Physical Activity Questionnaire (GPAQ), which was employed in prior
    research endeavors (Ranasinghe et al., 2013).


    The Suicidal Behaviour Questionnaire (SBQ-R) was used in our study to assess suicidal
    ideation among the participants. The SBQ-R consists of four items, each having
    a distinct dimension. The measurement of lifetime suicidal ideation or attempt
    was conducted using a scale where participants reported the frequency of the suicidal
    ideation over the past two months. The study evaluated each using a cut-off score
    (>7) to identify the presence of suicidal ideation among the participants. The
    Cronbach’s alpha score was 0.78, which could be considered acceptable.


    # 2.4. Statistical analysis


    The data was processed using SPSS (Version 25). For further analysis, frequency
    distribution table and chi-square test were conducted using R. Machine learning
    algorithms were conducted through Python.


