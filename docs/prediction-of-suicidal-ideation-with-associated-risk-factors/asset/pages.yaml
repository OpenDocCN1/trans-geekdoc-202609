    # 3. Results


    # 3.1. Frequency distribution


    Table 1 displays the frequency distribution of the chosen variables. The study
    found that 51.5% of the participants identified as male and 48.5% as female. The
    majority of the participants, 55%, hailed from rural areas. 10.4% reported no
    involvement in physical activity, while 7.9% reported smoking habit. Regarding
    the participants'' mental health status, it found that 13.4% of the respondents
    showed symptoms of severe depression, while 87% reported experiencing suicidal
    experience. Of the entire population, 80.1% reported suicidal ideation, while
    the remaining 19.9% did not report such ideation.


