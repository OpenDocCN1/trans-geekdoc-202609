    This present research has demonstrated that the predictive model for suicidal
    ideation (SI) in Bangladesh has the potential to predict the future of students
    at an early stage. Furthermore, this model enables healthcare practitioners to
    allocate more time to provide diverse treatment alternatives, such as identified
    individuals, thereby enhancing the efficacy of healthcare facilities and clinics
    at a minimal expense. The utilization of our model will be crucial in developing
    clinical support and personalised treatment strategies, optimizing outcomes.


    # 5. Conclusion


    Based on the findings of this study, it was reported that a significant proportion
    of university students located in the southern region of Bangladesh have 19.9%
    suicidal ideation. The findings indicate a significant association between the
    duration of students'' mental health concerns, specifically depression, pressure
    status, and suicidal ideation. The XGBoost model demonstrated that depression
    and pressure are the primary factors, while gender was the secondary factor. The
    development and execution of campaigns and counseling initiatives are aimed at
    improving mental health and preventing suicidal ideation and behavior. To mitigate
    the crisis of suicide among university students, all pertinent stakeholders, including
    academia, government bodies, and non-governmental organizations, should devise
    and implement effective strategies. The model can identify patients'' medical
    history to detect those who may be at a higher risk of suicidal ideation. This
    approach could encourage regular sleep patterns, addressing depression and avoiding
    potential suicide attempts.


