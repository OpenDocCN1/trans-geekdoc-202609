    ## 参考文献


    在这项研究中，我们使用了来自 PHQ-9 问题的更广泛特征，复杂的模型可以揭示各种症状与其心理健康影响之间的隐藏联系（Graham et al., 2019）。然而，当使用类似的方法时，发现忽略了某些关键数据可能需要更精确的方法和干预。因此，使用先进的机器学习模型有望提供增强的结果，帮助干预并为经验丰富的患者提供更好的医疗服务（Smith,
    2021; Bohr and Mahmudzadeh, 2020）。


    本研究表明，孟加拉自杀念念（SI）预测模型具有在早期预测学生未来的潜力。此外，该模型使医疗从业人员能够分配更多时间提供多样化的治疗方案（例如识别出的个体），从而以最低成本提高医疗机构和诊所的效率。我们模型的利用对于开发临床支持和个性化治疗策略、优化结果至关重要。


    ## 5. 结论


    根据本研究结果报告，位于孟加拉南部地区的大学学生中有 19.9% 具有自杀念念。结果显示，学生心理健康问题的时长（特别是抑郁、压力状态）与自杀念念之间存在显著关联。XGBoost
    模型显示，抑郁和压力是主要因素，而性别是次要因素。开发和执行活动及咨询倡议旨在改善心理健康并预防自杀念念和行为。为了缓解大学生的自杀危机，所有相关的利益相关者（包括学术界、政府机构和非政府组织）都应该制定并实施有效的策略。该模型可以识别患者的病史，以检测出那些自杀念念风险较高的人。这种方法可以鼓励规律睡眠模式，解决抑郁并避免潜在的自杀尝试。


