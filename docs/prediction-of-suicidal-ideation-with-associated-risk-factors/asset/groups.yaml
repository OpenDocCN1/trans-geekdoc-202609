    # 孟加拉国北部学生自杀念动的相关风险因素预测：机器学习方法


    Shiba Shirina Sara*, Asim Kumar Rahman*, Riaz Rahman*, Ashish Talukder**a,b*


    * 孟加拉国库尔纳大学科学工程与技术学院统计学系，Khulna 9208 ** 澳大利亚，澳大利亚国立大学流行病学与人口健康中心，堪培拉，ACT, 2609


    关键词：

    - 自杀念动

    - 心理健康状况

    - 机器学习 (ML)

    - 性别

    - 孟加拉国


    # 文章信息


    # 摘要


    背景：自杀念动的流行行率已成为一个紧迫的问题，特别是在青少年中。本研究的主要目的是确定孟加拉国北部地区学生自杀念动的流行率，并使用机器学习 (ML) 模型预防这一现象。方法：采用随机抽样技术，在
    2022 年 4 月至 2022 年 6 月期间收集北部地区大学生的信息。收集完成后，确定样本量为 584 人，其中 51.5% 为男性，48.5% 为女性。结果：很大比例的学生经历过自杀念动。参与者中，自由的（77%）和产生念头的（78%）。在机器学习
    (ML) 框架内，随机森林 (RF) 和梯度提升 (GB) 算法表现出相当的高准确率，分别为 91.45% 和 90.66%。局限性：无。结论：心理健康从业人员可以使用
    KNN 模型结合患者病史来识别可能处于自杀高风险的人群。这种方法有助于医疗专业人员采取适当措施，如咨询、规律睡眠模式以及解决抑郁和焦虑，以预防自杀行为。


    # 1. 引言


    自杀念动涉及自杀或自残的想法，是识别自杀风险个体的关键工具 (Zisstein 等人，2009)。世界卫生组织 (WHO) 报告，自杀是 15 至 19 岁青少年中的一个重大公共健康问题
    (WHO)，通常每 40 天发生一次，每年导致 70 万死亡，其中高达 77% 的事件发生在中低收入国家 (WHO, 2020)。此外，发展中国家约有 17.2%
    的个人产生过自杀念动，青少年和女性受影响最为严重 (Li 等人，2018)。Agrawal 和 Talukipalli (2019) 强调，各种心理健康状况，包括双极障碍、抑郁症、症和痴呆症，是自杀行为的潜在原因。过度使用互联网，特别是由
    Facebook 和智能手机等平台驱动，也与自杀尝试风险的增加有关 (Johan 和 Hansen, 2021)。特定情况，如 HIV 状态、不利的生活经历、抑郁频率和首次发作精神病发作，与高自杀率有关，比例分别为
    16.3%、88.5% 和 40.8%。近期研究报道 (García 等人，2020; Pelliza 等人，2022)，自杀念动在青少年中很常见。


    在东南亚，自杀念动的流行率令人担忧，17.7% 的人报告有想法，9% 的学生有计划。在该地区，某些国家的自杀死亡人数最高，发生率达到每 25 天一次自杀的惊人速度
    (García 等人，2022)。在东盟 (ASEAN) 国家中，大学生的自杀念动率为 11.7% (Putri 等人，2021)。近期研究表明，印度尼西亚青少年的自杀行为为
    8.7% (Marthoeno 和 Yasir Ahmad,2022)，而在库尔纳大学 (Khulna 9208)，该比例为 7.52% (Shan 等人，


