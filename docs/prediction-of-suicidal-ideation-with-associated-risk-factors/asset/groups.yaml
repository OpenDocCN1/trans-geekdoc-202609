    # Prediction of suicidal ideation with associated risk factors among students
    in the north of Bangladesh: Machine learning approach


    Shiba Shirina Sara*, Asim Kumar Rahman*, Riaz Rahman*, Ashish Talukder**a,b*


    * Statistics Discipline, Science Engineering and Technology School, Khulna University,
    Khulna 9208, Bangladesh ** National Centre for Epidemiology and Population Health,
    Australian National University, Canberra, ACT, 2609, Australia


    Keywords:

    Suicidal ideation

    Mental health condition

    Machine learning (ML)

    Gender

    Bangladesh


    # ARTICLE INFO


    # ABSTRACT


    Background: The prevalence of suicidal ideation has become an urgent issue, particularly
    adolescents. The primary objective of this research is to determine the prevalence
    of suicidal ideation among students in the northern region of Bangladesh and to
    prevent this phenomenon using machine learning (ML) models. Method: The data were
    collected using a random sampling technique to gather information from university
    students located in the northern region during the period ranging from April 2022
    to June 2022. Upon collection, the sample size was determined to be 584, with
    51.5% of identifying as male and 48.5% female. Results: A significant proportion
    of students experienced suicidal ideation. Participants were free (77%) and ideated
    (78%). Within the machine learning (ML) framework, the Random Forest (RF) and
    Gradient Boosting (GB) algorithms exhibited comparable high accuracy of 91.45%
    and 90.66% respectively. Limitation: None. Conclusion: Mental health practitioners
    can employ the KNN model alongside patients'' histories to identify those who
    may be at high risk of attempting suicide. This approach enhances healthcare professionals
    to take appropriate measures, such as counseling, regular sleep patterns, and
    addressing depression and anxiety, to prevent suicidal behavior.


    # 1. Introduction


    Suicidal ideation, which involves thoughts of suicide or self-harm, serves as
    a critical tool for identifying individuals at risk of suicide (Zisstein et al.,
    2009). The World Health Organization (WHO) reports that suicide is a major public
    health problem, among teenagers aged 15 to 19 (WHO), often occurring every 40
    days and resulting in 700,000 deaths annually, with a significant 77% of these
    incidents taking place in low- and middle-income countries (WHO, 2020). Furthermore,
    approximately 17.2% of individuals in developing countries have made suicidal
    ideation, with adolescents and females being the most affected (Li et al., 2018).
    Agrawal and Talukipalli (2019) highlight that various mental health conditions,
    including bipolar disorder, depression, anxiety, and dementia, contribute to the
    underlying causes of suicidal behavior. Excessive internet use, particularly driven
    to platforms like Facebook and smartphones, has also been linked to increased
    risk of suicide attempts (Johan and Hansen, 2021). Specific circumstances, such
    as HIV status, adverse life experiences, depression frequency, and first episode
    psychosis, have been associated with high rates of suicide with rates of 16.3%,
    88.5%, and 40.8%, respectively. Reported in recent studies (García et al., 2020;
    Pelliza et al., 2022), suicidal ideation is common among adolescents.


    In Southeast Asian, the prevalence of suicidal ideation is concerning, with 17.7%
    reporting thoughts and planning among 9% of students. Within this region, some
    countries have the highest numbers of suicide deaths, occurring at a staggering
    rate of one suicide every 25 days (García et al., 2022). Among ASEAN countries,
    university students experience suicidal ideation at a rate of 11.7% (Putri et
    al., 2021). Recent studies indicate that suicidal behavior among Indonesian adolescents
    is 8.7% (Marthoeno and Yasir Ahmad, 2022), while in Khulna University, Khulna
    9208, it stands at 7.52% (Shan et al.,


