    # 2.5. Machine learning


    # 2.5.1. CatBoost


    CatBoost is based on gradient boosting decision tree (GBDT) and a new named ordered
    boosting. CatBoost adds a prior value to Greedy TBS. Now, let''s assume a dataset
    of observations $D=(X,Y), i=1,...,n$, is given a permutation $\sigma = (\sigma_1,...,\sigma_n)$,i$
    is substituted with


    ```

    $\sum_{i=1}^{n} [y_{\sigma_i} - f_{\sigma_i}(x_{\sigma_i})]^2 + a\sum_{i=2}^{n}
    [f_{\sigma_{i-1}}(x_{\sigma_i})]^2$

    ```


    # 2.5.2. KNN


    The K-Nearest Neighbour also be known as the distance-based machine learning algorithm,
    mostly used for classification problems. It aims to locate all of the neighbors
    around a new point to determine which class it belongs to (Sainn et al., 2013).


    # 2.5.3. XGBoost


    XGBoost is a decision-tree based ensemble machine learning algorithm. XGBoost
    and Gradient Boosting Machines (GBMs) are ensemble tree methods, XGBoost improves
    upon the base GBM framework through systems optimization and algorithmic enhancements.
    In this algorithm, trees are created in sequential format (Chen and Guestrin,
    2016).


    # 2.5.4. Random forest


    Random forest is an ensemble machine learning method based on classification and
    decision regression trees. It is based on well-known ensemble learning methods
    of classification type: boosting and bagging (Belgu and Callik, 2018).


    # 2.5.5. Decision tree


    A decision tree is a predictive modeling based on observations about an item to
    conclusions about its target value. In the tree structures, leaves represent classifications
