    2022。东南亚女性的自杀念动总体流行率更高，为 17% (Manzour 等人，2022)。COVID-19 疫情加剧了这一问题，在孟加拉国表现为 18.5%
    的流行率。根据睡眠基金会的设定，睡眠质量被划分为三类：未婚、已婚和离婚（少于 9 小时、大于 9 小时）。机器学习模型被用于预测孟加拉国学生产生自杀念动的因素包括性别、焦虑、抑郁和孤独
    (Rahman 等人，2021)。社会经济状况、教育、婚姻状况关系关系等因素导致了自杀念动。研究报告 (Tahsim 等人，2021)。由于机器学习模型表现优于传统方法，该方法被选择
    (Bi 等人，2019)。机器学习技术的利用可以促进


    ## 2.2. 测量


    ### 2.3. 结果


    ### 2.3.1. 自杀念动


    ### 2.2.1. 自变量


    研究中的变量包括：婚姻状况、家庭收入、居住地、身体活动、吸烟习惯、社交质量、伴侣关系和抑郁。身体活动水平的评估采用了全球活动问卷 (GPAQ)，此前研究 (Ranasinghe
    等人，2013)。


    自杀行为问卷 (SBQ-R) 用于评估参与者的自杀念动。SBQ-R 由四个项目组成，每个项目都有一个独特的维度。自杀念动或尝试的测量是通过参与者报告过去两个月自杀念动的频率来进行的。研究使用评分值
    (>7) 来评估自杀念动的存在。Cronbach''s alpha 分数为 0.78，被认为是可以接受的。


    2.2.3. 一般性焦虑障碍 (GAD-7)


    用于评估参与者广泛性焦虑的筛查工具和量表。该工具由七个项目组成，每个项目的分值从 0“没有”到 3“几乎每天”。GAD-7 得分范围为 0-21。根据 Osman-Samani
    等人 (2018)，得分被解释为：轻微焦虑 (0-4)、轻度焦虑 (5-9)、中度焦虑 (10-14) 和严重焦虑 (15-21)。该研究产生了良好的可靠性，Cronbach''s
    alpha 值为 0.851。


    2.2.2. 患者健康问卷 (PHQ-9)


    患者健康问卷 (PHQ-9) 用于确定参与者的抑郁程度。Cronbach''s alpha 分数为 0.82。


    ## 2.4. 统计分析


    数据使用 SPSS (25 版本) 进行处理。进一步的分析使用 R 执行了频率分布表和卡方检验。机器学习算法通过 Python 执行。


