    ### 2.5.1. CatBoost


    CatBoost 基于梯度提升决策树 (GBDT) 和一种名为序贯提升（ordered boosting）的新算法。CatBoost 在贪心 TBS 中添加了先验值。现在，假设给定一个观测数据集
    $D=(X,Y), i=1,...,n$，以及一个排列 $\sigma = (\sigma_1,...,\sigma_n)$，其中 $i$ 被替换为：


    ```

