    prevalence of suicidal ideation. This phenomenon occur due to the experience of
    learning (ML), which can contribute to the development of suicidal ideation.


    Machine learning (ML) applications in clinical contexts have considerable limitations;
    ML is a balance of effectiveness and accuracy of medical professionals. Moreover,
    ML algorithms are more effective at extracting features from multimodal datasets
    (Sarker, like 2021), which measures symptoms since they are able to manage complex
    conditions. In this study, we used a logistic regression model to assess the likelihood
    of suicidal ideation among participants, using responses from the PHQ-9 questions
    (refer to Supplementary Table SI for details). Any participant who reported thoughts
    of self-harm, or a desire to be dead or "nearly dead" exhibited elevated ideation
    out of SI (OR: 6.9; 95% CI: 1-83.71).


    # Cedit authorship


    Sabina Shirin: Conceptualization, Data curation, Methodology; Writing - original
    draft, Formal analysis, Writing - review & editing; Md. Nasir Rahman: Data curation,
    Methodology, Writing - original draft, Writing - review & editing. Ashish Lakhter:
    Conceptualization, Data curation, Methodology, Writing - original draft, Formal
    analysis, Writing - review, & editing.


    # Declaration of competing interest


    The authors declare that the research was conducted without any commercial or
    financial relations that could be a potential conflict of interest.


    Acknowledgments


    The authors are thankful to the participants in this study for their kind assistance.


    # Funding


    No fund has been declared.


    # Compliance with ethical standards


    The ethical guidelines of the national research committee, the 1964 Helsinki Declaration,
    and any subsequent changes, or equivalent standards, of this study''s procedures
    were followed in all involving human subjects. Informed consent was obtained from
    all individuals participants in the study. As per local and institutional regulations,
    an ethical evaluation has been made by the authors during the data collection
    of this study.


    # References


    In this study, we used a broader of features from the PHQ-9 questions, a sophisticated
    model can uncover hidden connections between various symptoms and their impact
    on mental health (Graham et al., 2019). However, when using a similar methodology,
    it was found that overlooking some crucial data that might require a more precise
    approach and intervention. Consequently, using an advanced machine learning model
    is expected to provide enhanced outcomes, helping interventions and delivering
    better healthcare services to experienced patients (Smith, 2021; Bohr and Mahmudzadeh,
    2020).


    This present research has demonstrated that the predictive model for suicidal
    ideation (SI) in Bangladesh has the potential to predict the future of students
    at an early stage. Furthermore, this model enables healthcare practitioners to
    allocate more time to provide diverse treatment alternatives, such as identified
    individuals, thereby enhancing the efficacy of healthcare facilities and clinics
    at a minimal expense. The utilization of our model will be crucial in developing
    clinical support and personalised treatment strategies, optimizing outcomes.


    # 5. Conclusion


    Based on the findings of this study, it was reported that a significant proportion
    of university students located in the southern region of Bangladesh have 19.9%
    suicidal ideation. The findings indicate a significant association between the
    duration of students'' mental health concerns, specifically depression, pressure
    status, and suicidal ideation. The XGBoost model demonstrated that depression
    and pressure are the primary factors, while gender was the secondary factor. The
    development and execution of campaigns and counseling initiatives are aimed at
    improving mental health and preventing suicidal ideation and behavior. To mitigate
    the crisis of suicide among university students, all pertinent stakeholders, including
    academia, government bodies, and non-governmental organizations, should devise
    and implement effective strategies. The model can identify patients'' medical
    history to detect those who may be at a higher risk of suicidal ideation. This
    approach could encourage regular sleep patterns, addressing depression and avoiding
    potential suicide attempts.


