  md: 'contribute to the development of research on this topic. The physics knowledge
    corresponding to public datasets is usually not available because of a deep-domain
    background requirement. This often leads to numerous obstacles in developing PIML
    methods because of the knowledge shortage. The development of open-source benchmark
    problems with shared the encoded knowledge, such as the synthetic fatigue damage
    database presented in [219], or similar developments in other domains would be
    welcome.


    +   4. Combining flexible twin model to build life cycle tool The modeling techniques
    and twinning enabling technologies in [192, 193] present an appealing opportunity
    to integrate with PIML. This combination has the potential to develop a robust
    life-cycle management tool that incorporates flexible fidelity models and maintains
    physics consistency. Additionally, it enables the inclusion of indeterminate quantitative
    assessment evaluations by building twin framework.


    +   5. Adaptation to sparse run-to-failure data and sparse label data Most of
    the research on PIML in PHM focuses on sparse observations or information bias
    in the dataset. However, unlabeled data and non-complete failure process data
    accounts for the vast majority. Therefore, the theoretical and applied research
    of PIML for sparse and noisy data is worth exploring. Development of new PHM paradigms
    such as physics-informed unsupervised learning, self-supervised learning, and
    semi-supervised learning is expected.


    +   6. PIML in “small data and scarce physics knowledge” One of the ultimate development
    purposes of PIML in PHM is to be able to work under “small data and scarce physics
    knowledge” conditions, which will greatly extend the scope of potential PHM application.
    Following from the above-mentioned research directions, combining PIML with knowledge
    discovery and ML architecture search techniques has the potential for emerging
    breakthrough methods.


    # 6. Conclusion


    This paper presented bibliometric results and a state of the art review of physics-informed
    machine learning for prognostics and health management. An overview of its basic
    paradigm from the innovative perspective of “How to inform” and “What to be informed”,
    is summarized and provided. The existing approaches are grouped according to where
    and how the physics knowledge is embedded in the ML pipeline. The challenges of
    applying PIML to solve PHM problems and future research directions are also discussed.
    The main contribution of this paper is to provide a concise and comprehensive
    overview of PIML in PHM and to focus on the fundamental challenge of translating
    the appropriate form of knowledge for PIML utilization. It is hoped that this
    paper will encourage further works to expand the potential of PIML in the field
    of PHM.


