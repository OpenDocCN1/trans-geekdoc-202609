  md: '# ## 3.2. Taxonomy of PIML in PHM


    Depending on the role of physics knowledge and its informed position in the hybrid
    model, we propose to classify PIML methods into three categories. The first category
    uses physics knowledge to guide the construction of the input space, i.e., “Physics-informed
    inputspace”. The second category named “Physics-embedded algorithm structure”
    incorporates physics knowledge into the model architecture in machine learning
    process. The third category embeds Physics-constraints on the ML objective function
    to conduct “Physics-constrained learning”. These three categories correspond to
    three typical solutions to ML problems: input data optimization, model architecture
    optimization, and objective function optimization. Based on the combined roles
    of physics knowledge in different parts of the ML pipeline, we have summarized
    the 8 types of informed patterns, including “Simulator”, “Gauge”, “Extractor”,
    “Operator”, “Structure blueprint”, “Initializer”, “Consistency check”, and “Conflict
    check”, as shown in Fig. 10, which covers all aspects of ML data flow. Their corresponding
    implementations, and the related ML technical frameworks for achieving these implementations
    are also summarized. It can be seen that NN are the most widely used modeling
    tool. To assist in the understanding of the methodology, the same knowledge with
    different informed ways are shown in https://github.com/pimlphm/Physics-informed-machine-learning-based-on-TCN.


    # ### 3.2.1. Physics-informed input space


    Data preparation generally occupies the most workload in PHM [194]. Regarding
    the category “Physics-informed input space”, PIML seeks to gain physics information
    in the ML input space, distilling the multi-sources and heterogeneous monitoring
    data [45,46] by assisting data augmentation, feature transformation, feature selection,
    dimensionality reduction [155], and information fusion [40]. “Physics-informed
    input space” can be seen as an extension of the traditional “feature engineering”
    or “simulation-based data augmentation” processes by using physics knowledge to
    drive data processing and augmentation, including three paradigms: “Simulator”,
    “Gauge”, and “Extractor”, which are shown in Fig. 11. The technologies “Simulator”
    and “Gauge”, which occur in the “Data preparation” step, aim to generate and transform
    data. Meanwhile, the “Extractor” in the “Data preprocessing” step is dedicated
    to extracting useful features. A brief summary of these three technologies in
    the existing works is shown in Table 4.


    # #### Physics-informed simulators


    The works in this group focus on the construction of simulators that capture the
    physical behaviors of the studied system to generate data for training ML models.
    The data generated by those simulators provides richer information that covers
    different health states of the system and reduce the knowledge blindness of ML
    and thus enhance ML performance. To construct the simulator, various models with
    different degrees of simulation can be exploited such as structure-based and process-based
    digital twin models [192,193],engine performance models, or components’ finite
    element models. The challenge when implementing a physics-informed simulator is
    to find a balance between simulation accuracy and speed. Its basic paradigms is
    shown in Fig. 12.


    Traditionally, to construct a physics-informed simulator, the numerical model’s
    output is used as the input of the ML model. However, high-fidelity simulations
    are computationally costly. Therefore, most research has focused on the use of
    a reduced order model (ROM) or a surrogate model to lower the simulation cost.
    The former are the simplifications of huge scale models for establishing an approximate
    description of multidimensional physical processes in low dimensions. The combination
    of ROM and virtual sensors can create dynamic model calibration [58], which is
    actually the basis of many simulation software (e.g., Ansys and Modelica). Digital
    twin-based physics-informed input models in the collected literature also augment
    the input space of ML by simulating certain types of physical signals based on
    a ROM of the system’s specific behavior. Besides, surrogate models compute the
    response of the original high-fidelity model at a chosen finite number of points.
    In fact, it is a proxy for the real system at finite operating states [202]. In
    existing PIML methods, building ROMs usually reduces the amount of the unquantified
    variables in the model by adding constraints. This increases the preconditions
    for device operation and specifies the state space involved, which relies on the
    user’s understanding of a specific failure. In contrast, surrogate models in existing
    PIML studies tend to complete the modeling by fitting a ML model to the relationship
    between operating conditions and system response under finite operating conditions.
    For example, in the simulation of the meshing vibration behavior of a gear train,
    the ROM-based PIML simulator specifies the operating conditions of the gear train
    (load, speed, etc.). It uses a simplified physical model (e.g. a time-varying
    stiffness spring-damping model for meshing gear pairs) to represent the components
    and a simplified data flow connection to represent the shaft spring. It models
    the system mass as a centralised inertia module, ignoring the non-linear coupling,
    electromechanical coupling, and changes in dynamic states under different operating


