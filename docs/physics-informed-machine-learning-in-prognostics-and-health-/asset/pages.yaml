    In the second approach of using ML modules to express physical functions, the
    ML module acts as a forcing actuator to derive the physics model output and provide
    additional physical information. This approach involves utilizing mathematical
    approximations through the ML’s intrinsic functions. For instance, in the paper
    [181], a linear summation of a NN is employed to represent the relationship between
    vibration amplitude and rotational speed. The activation function and connections
    between NN layers approximate the relation between features and RUL values. Trainable
    weights, biases, and nonlinear activation functions represent the unknowns and
    parameters in the formula.


    # Physics-informed ML Structure blueprint


    Compared to the “PIML operator”, “PIML Structure blueprint” is a physics aware
    method which focuses more on guiding the building of data flow similarity between
    ML and physics knowledge, including modeling the physical processes, measurement
    processes, derivation processes, geometric structures, and so on, as shown in
    Fig. 17.


    Due to the fact that the essence of this class of methods lies in designing the
    structure of machine learning, including module design and inter-module connections,
    we propose to use “Structure blueprint” to represent physical reasoning processes
    or physical structural relationships informed machine learning algorithm structure.
    It aims to find topological similarities and the unit dependencies mappings from
    the geometric structure, system behavior, or internal material interaction [101]
    to ensure the physical priority of the reasoning process when training ML models.
    The conjecture and the abstraction of the system behavior in PBMs are useful sources
    to optimally guide the training process of ML. For example, the NN is designed
    according to the topology and physical laws of an electric grid in [95]. The underlying
    physical model governs the operation of the distribution network to sparse the
    learning model’s structure where the pruning is done in a deterministic manner
    during the training process [132]. As a result, load anomalies and grid damage
    can be indicated by changes in the output of the network nodes. Besides, in reference
    [102], the NN gradient models a potential energy function that is exploited to
    represent the dependency of the interference between quad-copters and their distance.


    Several special structures can be utilized to model physically derived relationships.
    In Fig. 3.2.2, each step of a Runge-Kutta numerical integration process is represented
    by a NN layer, and the integration path calculation is completed based on the
    physical summation relation. The dynamic behavior changes, such as damage growth
    in RNN [120], are expressed through a recursive prediction structure (see Fig.
    18). Each formula within the recursive relationship for damage growth is represented
    by a custom NN layer, and the inter-layer structure enables the realization of
    the recursive relationship. In representing the derivation process in terms of
    structure, much physics knowledge is further de-analyzed [50]. For example, in
    the paper [37,156,178], the specific physical relationships are non-analytical.
    The embedding of physics knowledge is accomplished by two NN sharing parameters
    in a CODEC (Coder-Decoder) structure. The latter is a proxy for the linear second-order
    partial differential equation for acoustic wave propagation, while the former
    is used to approximate the solution of the model from the measurements to the
    latter surrogate NN. In summary, “PIML Structure blueprint” defines ML reasoning
    process as part of the physics derivation form where the ML modules retain their
    original computational structure, but acts as a mapping of certain types of the
    physics equations solving process by constraining the inter-module relationships.


    # Physics-informed ML parameters initializers


    Unlike the focus on both “PIML operator” and “PIML Structure blueprint”, the research
    on “PIML parameters initializers” is more concerned with the selection and assignment
    of ML parameters and hyper parameters. For example, the weight selection is implemented
    based on physical energy minimum state completion in Markov random fields (MRF)
    [154]. In [36], wavelet-based features of the multi-scale envelope spectrum are
    fused by a statistical health index generating model, and the observation function
    between the defect state and the fused features is assumed to be a linear fitting.
    The empirical model for a spalling propagation based on the Paris formulation
    is a predictive model for which the initial parameters are set as probability
    distributions. Besides, the average value of the'
