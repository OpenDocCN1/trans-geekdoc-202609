  md: 'one-dimensional heat transfer equation solution is used as the initial parameter
    for the factorization of the non-negative matrix for casting defect monitoring
    [57]. In summary, the initialization of ML parameters in these studies is usually
    based on the physical model solution.


    # 3.2.3. Physics-constrained learning


    In contrast to the hard constraints of “Physics-embedded algorithm structure”,
    PIML also includes soft constraints that enable ML to produce an approximate satisfaction
    of a given set of physics through the design of the objective function. Its approximate
    satisfaction can be introduced in the form of integration, differentiation, probability,
    logic rules, and other forms of physics-based deviations. According to the relationship
    between the informed physics objective function and the original ML objective
    function, this paper groups “Physics-constrained learning” into two paradigms:
    “consistency check”, and “conflict test”, which are shown in Fig. 19. The total
    error of the PIML model includes a traditional ML prediction error (“Error1”)
    and a physical consistency error (“Error2”). In general, the numerical best fit
    to the available data (residual loss) and the consistent satisfaction of physics
    principles (boundary loss) show discrepancies [147]. Designing an objective function
    based on “consistency check”, or “conflict test” error is dedicated to the convergence
    of ML results towards physical consistency. The related literature is summarized
    in Table 6


    From Table 6, one can see that physics knowledge is used directly in the ML target
    design by modifying the target function in such a way as to influence the parameter
    changes during the ML optimization-seeking learning process. For specific PIML
    frameworks, the “consistency loss” strives to ensure that the ML output conforms
    to the physical fact, while the “conflict loss” is built by the conflicts between
    the ML output and the physical model output.


    # Consistency loss design


    In tool wear prediction [78], the empirical knowledge (that wear increase as the
    number of cuts increases) is then compiled into a function that detects trend
    information in the output sequence.


    In the case of ultrasonic detection of damage to metal sheets, consistency is
    expressed in the ability of the algorithm to identify results that are close to
    the analytical model corresponding to the damage cluster and satisfy the regular
    term generated by the residual from the governing equation [37]. In the K-SVD
    method for metal damage identification, the article [150] builds an ultra-complete
    dictionary with an additional one-dimensional wave equation based regularization
    term for the atomic update process of the dictionary.


    In these studies, the output of the ML needs to satisfy the regular term or lower
    the punishment function value of the governing equation for physical consistency,
    in addition to the original fitting accuracy as possible. And this governing equation
    can be a partial derivative relation that represents an approximation [37]. It
    can also be whether certain explicit physical equations are met within the required
    tolerances. For example, the rotational trajectories of the voltage and current
    need to satisfy the elliptic equation in auto-encoder based high impedance fault
    detection [132]. In some cases, the design of consistency loss does not require
    a fully known analytical physics model. It is equally feasible to enforce the
    differential equations through a NN as a trial solution to the degradation differential
    equations and through additional iterative pathways outside the NN [133].


    # Conflict loss design


    Based on the inconsistency between the physics model and the ML output, it is
    also possible to design a “conflict test”, which only optimizes the relevant parameters
    of the ML in the error propagation process.


    In [143], the results of a diagnostic conflict based on an artificial fault threshold
    model with a deep CNN are used to design the loss function that aims to improve
    the discrimination of the severity of bearing faults. A physics-based loss function
    is designed to evaluate the difference between the output of a NN model and the
    output of a finite element model update in steel building damage detection [84].
    This idea can be seen as a traditional fusion approach, which combines the outputs
    of different approaches [216] in the ML training process. The main difference
    between them is that the physics-based outputs are used here primarily to correct
    the behavior of ML rather than enhance decision-making.


    # 4. Discussion of PIML studies in PHM according to the form of physic knowledge


    The previous sections summarized the different PIML frameworks in PHM. They initially
    answer the question of “how to inform physics knowledge in ML”. However, physics
    knowledge is an extremely complex abstract concept, and the question of “what
    kind of physics knowledge can be used for informing ml” has not been addressed
    yet. This question is then considered in Subsection 4.1. Next,


    ![](img/3ec5662c0c5150f5b95af65046cb9cd4_17_0.png)


    Fig. 19. Two ways to construct physics-constrained learning.'
