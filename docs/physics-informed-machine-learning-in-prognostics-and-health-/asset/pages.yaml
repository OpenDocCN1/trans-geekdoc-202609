    # 2.3.1. Existing terminologies


    There are numerous terminologies similar to “physics-informed machine learning”
    (see Table 1). According to the statistical results of all publications relating
    to PIML in PHM, the distribution of those terms are: “Physics-informed” (47.1%),
    “Physics based” (19.9%), “Physics guided” (18.3%), “Physics infused” (8.8%), and
    “Physics aware (5.9%)”.


    The heterogeneity of those terms can pose a major obstacle to research on this
    topic as well as its wide application in practice. Therefore, in this Subsection,
    we seek to clarify the similarities and differences between the existing terminologies.


    Fig. 6 presents the main scope of each terminology, and it can be summarized as
    follows:


    +   1. “Physics infused” aims to discover and incorporate physics property constraints
    in the data preprocessing [54,160], leveraging physics-derived parameters and
    relations to enhance the performance of ML models, especially in sparse data scenarios
    [161].


    # Table 1 Summary of the existing terminologies relating PIML in PHM.


    | Terminology | References | Total number |

    |---|---|---|

    | Physics infused | [27,38-48] | 12 |

    | Physics based | [10,14,32,49-71] | 26 |

    | Physics guided | [72-94] | 23 |

    | Physics aware | [95-102] | 8 |

    | Physics-informed | [20,21,37,81,103-109,109-117,117-123,123-159] | 64 |'
