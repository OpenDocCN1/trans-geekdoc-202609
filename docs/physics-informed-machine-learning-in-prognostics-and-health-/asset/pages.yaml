  md: 'data. Therefore, it is necessary to provide a synthetic review of PIML studies
    in PHM from both perspectives: I) **Expression forms of Knowledge** and II) **Knowledge
    Informed Methods**. Expression forms of Knowledge in Physics-Informed Machine
    Learning refers to the following knowledge expression forms:


    +   1. Mathematical Equations: Knowledge is expressed through the formulation
    of mathematical equations that govern the underlying physics of the problem. These
    equations represent fundamental principles, physical laws, and constraints relevant
    to the problem domain.

    +   2. Conservation Laws: Knowledge about conservation principles such as mass,
    momentum, and energy conservation can be incorporated into physics-informed machine
    learning models. These laws provide important constraints that guide the learning
    process.

    +   3. Differential Equations: Physics problems often involve differential equations
    that describe the relationships between variables. Expressing knowledge in the
    form of differential equations helps to enforce the physical behavior and relationships
    in the machine learning models.

    +   4. Constitutive Relations: Knowledge about the material properties, constitutive
    equations, or parameterization specific to the problem domain can be incorporated.
    These relations provide insights into how different variables interact and influence
    each other.


    The Knowledge Informed Methods are considered as the different embedding ways
    of the usage of different knowledge expressions, the details are discussed in
    Subsection 3.2. Analyzing the knowledge expression forms involves examining how
    domain knowledge, physical laws, equations and constraints are integrated into
    machine learning algorithms, providing insights into the underlying physics-ML
    convertibility. Knowledge-informed ways more specifically seek to leverage domain
    knowledge in designing and training machine learning models. However, it is crucial
    to also consider the broader perspective of analyzing knowledge expression forms,
    which is often overlooked in existing reviews. By analyzing both knowledge expression
    forms and knowledge-informed ways, researchers can gain a comprehensive understanding
    of the strengths and limitations of PIML approaches in PHM. This dual perspective
    enables a more rigorous assessment of methods and facilitates improvements in
    the design and implementation of physics-informed machine learning models.


    # 3.1. Related review papers


    To our knowledge, there is no meticulous review of PIML studies in the field of
    PHM but there are related works on the PIML topic. These works provide additional
    information that help getting an overview of the PIML taxonomy as well as understanding
    more about the research challenges on this topic.


    The existing reviews, shown in Table 3, argued that PIML is a promising solution
    to address the ML issues relating to physics consistency, data scarcity, and model
    interpretability, which are also valuable to PHM. They share a similar taxonomic
    view of PIML, describing that physics knowledge can be incorporated into data
    pre-processing, ML algorithm design, and regularization of the loss function.


    We greatly acknowledge the valuable perspectives and contributions presented in
    the existing reviews. However, it is important to note that these reviews tend
    to have specific disciplinary focuses, which may limit their comprehensive coverage
    of all critical tasks in PHM. Furthermore, while these reviews address the embedding
    of physics knowledge into ML approaches, they often lack a holistic analytical
    perspective throughout the entire ML process. Although they provide insights into
    how to incorporate physics knowledge, they do not fully explore the various sources
    of knowledge that can be utilized. Moreover, the existing reviews predominantly
    emphasize applications related to specific NN architectures, such as PINN, rather
    than embracing the broader framework of Physics-Informed Machine Learning (PIML).
    A recent study [29] provides a qualitative analysis and a comprehensive review
    of the role, taxonomy, and cases of PIML in the field of reliability [29]. PHM
    is part of the topics in the application Subsection. Our work complements their
    findings by providing a comprehensive quantitative analysis from the standpoint
    of knowledge in PHM, combining the complete qualitative analysis on the most advanced
    researches. Additionally, we not only review taxonomic and informed methodology
    but also examine the various forms and sources of informative knowledge. Besides,
    the studies in [192,193] provide a systematic review of hybrid modeling in digital
    twins and briefly discuss the significance of PIML technology. However, these
    studies primarily focus on the analysis of modeling system responses and dynamic
    behaviors in the context of digital twins, and only partly include the qualitative
    and quantitative aspects of PIML in the specific context of PHM. Our paper, on
    the other hand, is specifically dedicated to PHM delving much deeper into these
    aspects, while of course not being as exhaustive in terms of the other aspects
    of digital twins. Considering the limitations of the existing papers, this review
    aims to address the gaps in the state of the art by providing a more thorough
    and analytical perspective on PIML methods within the realm of PHM. By integrating
    both qualitative and quantitative approaches, our research endeavors to contribute
    to a holistic comprehension of PHM and its practical applications. Furthermore,
    it aims to elucidate a broader understanding of the entire machine learning process,
    encompassing all critical tasks involved in the integration of physics-based knowledge.


    In summary, this paper aims to bridge these gaps by offering a more comprehensive
    and analytical view of PIML methods within the context of PHM. combined with an
    extensive qualitative analysis on the most advanced researches, our work endeavors
    to contribute to a more holistic understanding of PHM and its applications. It
    clarifies a broader understanding of the entire ML process, encompassing all critical
    tasks involved in the integration of physics knowledge.'
