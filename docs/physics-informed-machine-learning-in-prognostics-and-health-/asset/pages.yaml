  md: "8. About when to use what form of knowledge. According to the analysis of the\
    \ existing research in Table 7, this paper suggests When dealing with explicit\
    \ knowledge, the system behaviors can be described by mathematical equations or\
    \ analytical models with clear input-output relations. If the physics signal variables\
    \ involved in the equations are available, we can use them to customize NN layers\
    \ or units based on analytical formulas or system physics characteristics. When\
    \ explicit knowledge of the system behaviors is unavailable, but we have information\
    \ about system physical structures or behavior model derivation knowledge, along\
    \ with handling inference relations for the involved signals, we can construct\
    \ a physics-informed structure. Embedded knowledge is then utilized to customize\
    \ the data flow in the NN structure or employ custom-designed NNs as surrogate\
    \ models for specific steps in the physics model derivation. In the case of tacit\
    \ knowledge, where quantitative information about system behaviors is lacking,\
    \ but there exist physical relations between system inputs and outputs or constraints\
    \ on the system outputs, these relations can be employed to customize the ML objective\
    \ function or regulate the output of hidden layers.\n\nIt is important to note\
    \ that these forms of knowledge are not mutually exclusive, and they can often\
    \ be combined or integrated within a PIML framework. The choice of which form\
    \ to use, or whether to combine them, depends on the specific requirements and\
    \ objectives of the problem at hand. A comprehensive approach to PIML may involve\
    \ utilizing a combination of explicit, embedded, and tacit knowledge to capture\
    \ the full range of system characteristics and optimize model performance. Ultimately,\
    \ the selection of the appropriate form (s) of knowledge requires careful consideration\
    \ of the problem domain, available expertise, data availability, and the desired\
    \ level of interpretability and accuracy in the modeling process.\n\n# 5. Challenges\
    \ and future research directions: Toward PHM in the context of “small data and\
    \ scarce physics knowledge”\n\nAlthough PIML can bring numerous alternative solutions\
    \ for diverse applications in PHM, as mentioned in previous sections, the development\
    \ of PIML in PHM still comes with some particular limitations and challenges.\
    \ Some of these limitations and challenges are presented in this section.\n\n\
    # 5.1. Limitations and challenges of PIML\n\nThe challenges related to sparse\
    \ and noisy data, data availability, and incomplete physic models have been highlighted\
    \ in other reviews [18,29,32]. In addition, there is a need for further research\
    \ into the collection of more representative data, the selection of an appropriate\
    \ benchmark model, and the determination of the weighting parameters or hyperparameters\
    \ for the informed ML part. This paper argues that the fundamental problem underlying\
    \ these challenges is how to convert various forms of knowledge into the type\
    \ necessary for the ML framework, that is, to adjust knowledge to ML models rather\
    \ than selecting ML models to fit physics knowledge. Consequently, one can highlight\
    \ the challenges in two aspects:\n\n+   1. Building a physics aware ML framework\n\
    +   \n+   In the current research on the design of PIML, the inter-conversion\
    \ between physics knowledge and ML, as well as the assessment metric for ML physical\
    \ inconsistency, remains an under-explored and challenging topic. Therefore, there\
    \ is a need to construct a physics-aware ML framework that can automatically incorporate\
    \ physics knowledge into various parts of the ML pipeline based on the form of\
    \ knowledge according to the physics-ML inter-conversion mechanism and the inconsistency\
    \ evaluation results.\n\n+   2. Construction of knowledge basis\n+   \n+   The\
    \ construction of effective PIML frameworks requires a thorough comprehension\
    \ of the physical characteristics of the system under investigation. This necessitates\
    \ that the researcher possesses comprehensive knowledge and skills in both computer\
    \ science and physics (e.g. mechanics). Thus, this leads to significant barriers\
    \ for junior researchers without interdisciplinary experience in the implementation\
    \ of PIML techniques. Furthermore, due to the fact that most knowledge can be\
    \ ambiguous, mathematical expressions and physics modeling are not always well-developed\
    \ for PHM case studies. Consequently, it is essential to construct a knowledge\
    \ basis for PIML from ambiguous information.\n\n# 5.2. Future directions\n\nAlthough\
    \ it is difficult to determine which direction will lead to transformative discoveries,\
    \ the PHM community can make a substantial contribution to the future of PIML\
    \ by taking into account the challenges outlined in the previous section in the\
    \ following areas:\n\n+   1. Compiling fault mechanisms in ML\n+   \n+   There\
    \ is a lack of studies regarding how ML can better use integrated physics knowledge\
    \ from multiple sources. Establishing the cognitive mechanisms for PIML when different\
    \ forms of knowledge are embedded in different ML frameworks thus appears as a\
    \ meaningful work.\n\n+   2. From the perspective of metric learning\n+   \n+\
    \   Another track that appears worth investigation is the development of ML objective\
    \ functions with more multidimensional metrics that can cover model complexity,\
    \ physics consistency, computational cost, and result accuracy.\n\n+   3. Further\
    \ building suitable benchmark problems\n+   \n+   A set of well-defined benchmark\
    \ problems can facilitate the evaluation and comparison of different algorithms\
    \ and thus"
