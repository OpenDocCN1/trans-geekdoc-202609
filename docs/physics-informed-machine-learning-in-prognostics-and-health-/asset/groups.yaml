    同时能够全面理解复杂系统的退化行为 [179]。然而，挑战包括复杂性、数据需求、可解释性受损、模型与算法之间的潜在冲突，以及开发和维护所需的专业知识和资源。


    在使用 ML 模块表达物理函数的第二种方法中，ML 模块充当强制执行器来推导物理模型输出并提供额外的物理信息。这种方法涉及通过 ML 的内在函数利用数学近似。例如，在文献
    [181] 中，采用神经网络的线性求和来表示振动幅值与转速之间的关系。神经网络层之间的激活函数和连接近似特征与 RUL 值之间的关系。可训练权重、偏置和非线性激活函数代表公式中的未知数和参数。


    ## 物理信息机器学习结构蓝图


    与“PIML 算子”相比，“PIML 结构蓝图”是一种物理感知方法，更侧重于指导机器学习与物理知识之间数据流相似性的构建，包括对物理过程、测量过程、推导过程、几何结构等的建模，如图
    17 所示。


    由于这类方法的本质在于设计机器学习的结构，包括模块设计和模块间连接，我们提出使用“结构蓝图”来表示物理推理过程或物理结构关系告知的机器学习算法结构。它旨在从几何结构、系统行为或内部材料相互作用
