    # 6. Conclusion


    This paper presented bibliometric results and a state of the art review of physics-informed
    machine learning for prognostics and health management. An overview of its basic
    paradigm from the innovative perspective of “How to inform” and “What to be informed”,
    is summarized and provided. The existing approaches are grouped according to where
    and how the physics knowledge is embedded in the ML pipeline. The challenges of
    applying PIML to solve PHM problems and future research directions are also discussed.
    The main contribution of this paper is to provide a concise and comprehensive
    overview of PIML in PHM and to focus on the fundamental challenge of translating
    the appropriate form of knowledge for PIML utilization. It is hoped that this
    paper will encourage further works to expand the potential of PIML in the field
    of PHM.


    # Declaration of Competing Interest


    The authors declare that they have no known competing financial interests or personal
    relationships that could have appeared to influence the work reported in this
    paper.


    # Data availability


    Data will be made available on request.


