    ## 预测与健康管理中的物理信息机器学习：现状与挑战


    Weikun DENG a,*, Khanh T.P. NGUYEN a, Kamal MEDJAHER a, Christian GOGU b, Jérôme
    MORIO c


    a 图卢兹大学生产工程实验室，LGP，INP-ENIT，47 Av. d’Azéreix，塔布，65016，法国

    b 克莱芒·阿德尔研究所（ICA），图卢兹大学，ISAE-SUPAERO，UPS，CNRS，INSA，Mines Albi，3 rue Caroline Aigle，图卢兹
    31400，法国

    c ONERA/DTIS，图卢兹大学，图卢兹 F-31055，法国


    ## ARTICLE INFO


    - 物理信息机器学习

    - 预测与健康管理

    - 物理信息输入空间

    - 物理约束学习

    - 物理嵌入算法结构

    - 知识


    ## ABSTRACT


    预测与健康管理（PHM）在设备全生命周期健康服务中发挥着建设性作用。它长期以来一直受益于物理建模和机器学习方法的深入研究。然而，在实际应用中，现有解决方案常常面临因数据稀疏和系统故障知识不完整而导致的困难。在这种情况下，纯机器学习或基于物理的方法有时可能不可行。因此，开发物理信息机器学习（PIML）模型的兴趣日益浓厚，这类模型允许在机器学习流水线的不同位置融入不同形式的物理知识。这种结合为检测、诊断和预后提供了显著帮助。然而，据我们所知，关于PHM中PIML的现有研究文献计量分析和综合综述仍属空白。因此，我们的综述致力于填补这些空白。我们综合了PHM中PIML的概念，并从“告知知识的表达形式”和“知识告知方法”的角度提出了PIML方法的分类法。本文提出的发现和讨论使我们能够澄清PIML方法的当前最新进展和新兴机遇，特别是针对在“小数据和稀缺物理知识”范式下构建PHM系统。


    ## 1. Introduction


    预测与健康管理（PHM）是一门跨学科工程学科。它基于最新信息和数据处理[1]，通过两种主要范式确保系统的实时健康评估和未来状态预测：


    缩写: ANN, Artificial Neural Network; CNN, Convolutional Neural Network; CRA, Cumulative
    relative accuracy; DNN, Deep Neural Networks; FCN, Fully Convolutional Networks;
    GNN, Graph Neural Networks; KSVD, K Singular Value Decomposition; LSTM, Long short-term
    memory; MAE, Mean Absolute Error; MSE, Mean Square Error; NMSE, Normalized Mean
    Square Error; NMAE, Normalized Mean Absolute Error; NODE, Neural Ordinary Differential
    Equations; PBM, Physics based methods; PCA, Principal Component Analysis; PDE,
    Partial differential equation; PHM, Prognostic and Health Management; PIML, Physics-informed
    Machine Learning; RMSE, Root mean square error; RNN, Recurrent Neural Network;
    ROM, Reduced Order Model; RUL, Remaining useful life; SVM, Support Vector Machine;
    VAE, Variational AutoEncoder; DRM, Disk-ram.


    * 通讯作者。电子邮件地址：weikun.deng@enit.fr (W. DENG)。


    数据驱动方法和基于物理模型的方法（PBM）。


    得益于机器学习（ML），尤其是近年来与深度学习[2,3]相关的激增，数据驱动方法从数据中提取特征并识别潜在的退化过程，在从宏观到微观退化和损伤的不同故障尺度上显示出有希望的结果[4]。然而，PHM中的机器学习面临三个困境：


    - 1. 第一个困境源于有限的数据质量。可以举例：a) 由于结构条件有限和无处不在的监测仪器成本导致的稀疏且带噪声的观测[5]；b) 由于监测时间有限和运行至失效操作成本高昂导致的稀疏且带噪声的故障信息[6]；以及
    c) 由于专家知识有限和人工标注成本高昂导致的稀疏标签[7]。

    - 2. 第二个困境是机器学习的不透明、不可解释性，导致信任赤字[8]。对于高投资和高风险的工业领域，机器学习输入数据与输出PHM结果之间的不可观测过程被视为具有可解释性困难的“黑箱”[9]。

    - 3. 机器学习中的第三个困境源于缺乏物理一致性。机器学习通常收敛于最能拟合训练样本的方向，这可能不完全符合物理约束[10]。


    与机器学习不同，基于物理的方法（PBM）观察故障现象，然后建立数学或数值机制模型来表示故障或退化[11]。当故障性质被充分理解时，PBM所需的数据比机器学习少[12]，并能实现更好的泛化能力[13]。然而，现代工程系统复杂，并受子系统之间相互非线性相互作用的影响。因此，PBM的性能可能受系统规模[14]和复杂性[15]等不同因素的影响，导致以下困境：


    - 1. 第一个困境涉及模型简化中的认识论不确定性以及计算效率与PBM可信度之间的悖论[16]。

    - 2. 第二个困境是有时对故障机制的理解有限，难以构建可信的退化模型[17]。

    - 3. 第三个困境源于PBM中未知且不可观测的参数。


    由于上述困境，纯基于物理的模型在实际应用中很少使用[18,19]。


    鉴于数据驱动方法和基于物理方法的局限性，有必要开发混合方法，以克服缺点并继承各自的优势。图1展示了PBM和ML模型结合的动机。事实上，物理信息机器学习（PIML）在数据稀疏和物理知识不完整的情况下是一种有前景的解决方案。PIML在2016–2020年洛斯阿拉莫斯PIML研讨会上被正式引入[20]，最初用于通过机器学习求解复杂物理问题。特别是，Raissi等人[21]提出了基于物理信息神经网络（PINN）的偏微分方程求解方法，引发了“信息神经网络”的热潮。同时，包括GE[22]、IBM[23]、Nvidia[24]、美国DARPA[25]和NASA[26]、阿贡国家实验室[27]以及西门斯[28]在内的许多工业合作伙伴，都高度关注PIML的应用。


    PIML发展背后的动机在现有文献中已被广泛讨论，其固有优势和优点如下：


    - 1. PIML融合了数据驱动机器学习和物理原理，以提升预测与健康管理（PHM）系统预测的精度和可解释性。

    - 2. PIML在处理PHM应用中复杂非线性系统的复杂动态方面表现出色。它通过集成基于物理的约束和方程来实现这一点，从而增强其预测和建模能力。


    ![](img/3ec5662c0c5150f5b95af65046cb9cd4_1_0.png)


    图1. 数据稀疏和物理知识不完整推动PHM技术朝着PBM和ML的结合方向发展。


    - 3. 基于物理知识的融合使PIML能够更有效地泛化，即使在观测数据之外也能提供可靠的预测。这在训练数据稀疏或不完整的场景中特别有用。

    - 4. PIML模型的一个关键优势是由于明确融入物理而提高了可解释性。通过嵌入物理约束和方程，PIML使阐述驱动系统行为的一些潜在机制变得更加容易，这有助于诊断分析和决策。

    - 5. 尽管数据有限，PIML对系统物理知识的高效利用允许进行准确预测，减少了对大型数据集的依赖，并可能最大限度地降低数据获取成本。

    - 6. 由于PIML强制执行物理定律，因此对噪声和异常值具有鲁棒性，可以滤除错误或带噪声的数据，从而得出可靠的预测。

    - 7. PIML通过将基于物理的约束与机器学习算法相结合，提供计算优势，从而产生高效模型，降低计算复杂度，适用于实时或近实时应用。


    受这些进展的启发，已有多项关于PIML在异常检测、故障诊断和预后方面的研究[29]。与其他针对稀疏数据的潜在解决方案（如迁移学习[30]）相比，PIML在PHM中的优势在于辅助数据驱动的洞察、专家知识利用、适应性和可扩展性。通过利用这些优势，PIML还可以增强其他方法，以及应对PHM挑战[31]的能力，这些挑战包括数据可用性有限、复杂非线性系统动态、与物理一致性相关的信任、噪声和不确定性处理、多源异构数据集成，以及跨系统和跨领域的可迁移性[32]。此外，PIML并不与这些方法竞争，而是锦上添花，以实现双赢局面，例如通过航空航天异常检测中的PI-迁移学习[33]和加工刀具磨损预测中的PI-元学习[34]等方法。尽管许多研究令人兴奋，但据我们所知，现有文献中没有一篇论文对PHM中的PIML提供全面的综述。此外，尚未进行总体定性和文献计量分析。最后，PHM中的分类法和应用尚不明确，有待讨论，特别是关于：1)
    告知知识的表达形式和 2) 知识告知方法。因此，本文旨在填补上述空白。此外，还强调了PHM中PIML成熟度面临的开放挑战。


    本文其余部分组织如下。第2节对PHM中PIML的现有工作进行文献计量分析，从而展示了该主题的研究趋势概览。第3节对PHM中的PIML方法进行了全面而深入的综述。第4节旨在总结和讨论可用于推导机器学习模型的物理知识来源以及相应的集成方法。最后，第5节总结了本文的主要贡献，并对潜在的未来研究提供了见解。


    ## 2. 文献计量分析


    本节旨在概述PHM领域中PIML研究的研究兴趣。首先，我们在子节2.1中描述文献研究方法。然后，基于PHM中PIML的文献计量分析，在子节2.2中讨论该主题的研究趋势。最后，子节2.3汇编了关于应用于PHM的PIML工作的统计分析。


    ### 2.1. 文献研究方法


    本文所调查的书目数据涵盖2013年1月至2023年1月期间。本文选择的时间跨度基于以下认识：PIML技术出现于2016年左右。然而，在调查从混合框架到PIML的研究趋势时，我们发现可追溯至2013年的类似技术概念。因此，我们进行了从2013年至今的文献检索。在图2所示的检索流程图中，该调查同时从Web
    of Science（WoS）和Google Scholar中检索。在Google Scholar上的检索旨在验证WoS检索的充分性。


    ![](img/3ec5662c0c5150f5b95af65046cb9cd4_2_0.png)


    图2. 检索方法流程图。


