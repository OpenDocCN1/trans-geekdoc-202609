    ## 3.2.3. 物理约束学习


    与“嵌入式物理算法结构”的硬约束相反，物理信息机器学习还包括软约束，这些软约束通过目标函数的设计，使机器学习能够对给定的一组物理规律产生近似满足。其近似满足可以以积分、微分、概率、逻辑规则以及其他基于物理的偏差形式引入。根据知情物理目标函数与原始机器学习目标函数之间的关系，本文将“物理约束学习”分为两种范式：“一致性检查”和“冲突测试”，如图
    19 所示。物理信息机器学习模型的总误差包括传统的机器学习预测误差（“误差1”）和物理一致性误差（“误差2”）。一般来说，对可用数据的数值最佳拟合（残差损失）与物理原理的持续满足（边界损失）之间存在差异
    [147]。基于“一致性检查”或“冲突测试”误差设计目标函数，旨在使机器学习结果趋向于物理一致性。相关文献总结于表 6。


    从表 6 可以看出，物理知识通过修改目标函数直接用于机器学习目标设计，以此影响机器学习优化寻求学习过程中的参数变化。对于特定的物理信息机器学习框架，“一致性损失”致力于确保机器学习输出符合物理事实，而“冲突损失”则由机器学习输出与物理模型输出之间的冲突构建。


    ## 一致性损失设计


    在刀具磨损预测 [78] 中，经验知识（随着切割次数增加，磨损增加）被编译为一个检测输出序列中趋势信息的函数。


    在金属板超声波损伤检测中，一致性体现为算法识别接近损伤簇对应解析模型的结果，并满足由控制方程残差生成的正则项的能力 [37]。在金属损伤识别的 K-SVD
    方法中，文献 [150] 为字典的原子更新过程构建了一个基于一维波方程的额外正则化项的超完备字典。


    在这些研究中，机器学习输出除了尽可能保持原始拟合精度外，还需要满足正则项或降低控制方程的惩罚函数值，以实现物理一致性。而这个控制方程可以是表示近似的偏微分关系
    [37]。也可以是某些显式物理方程在所需容差内是否满足。例如，在基于自编码器的高阻抗故障检测 [132] 中，电压和电流的旋转轨迹需要满足椭圆方程。在某些情况下，一致性损失的设计不需要完全已知的解析物理模型。同样可行的是，通过神经网络作为退化微分方程的试探解，并通过神经网络外部的额外迭代路径来强制执行微分方程
    [133]。


    ## 冲突损失设计


    基于物理模型与机器学习输出之间的不一致，也可以设计“冲突测试”，该测试仅在误差传播过程中优化机器学习的相关参数。


    在文献 [143] 中，基于深度卷积神经网络的人工故障阈值模型的诊断冲突结果被用于设计损失函数，旨在提高轴承故障严重程度的辨别度。在钢结构建筑损伤检测 [84]
    中，设计了一个基于物理的损失函数，用于评估神经网络模型输出与有限元模型更新输出之间的差异。这一想法可视为一种传统的融合方法，它在机器学习训练过程中结合不同方法的输出
    [216]。它们之间的主要区别在于，此处基于物理的输出主要用于纠正机器学习的行为，而非增强决策。


