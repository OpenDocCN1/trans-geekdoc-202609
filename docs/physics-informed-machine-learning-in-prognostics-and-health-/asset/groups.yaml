    Therefore, this Subsection focuses on synthesizing the form of physics knowledge
    instead of its source. From the existing studies on PIML in PHM, the physics knowledge
    forms can be classified into three categories, as shown in Fig. 20.


    +   1) First category: Explicit knowledge related to analytical failure models.
    The explicit knowledge is represented by analytical models or equations of system
    dynamic behaviors, such as generator inertia constants, damping coefficients,
    and rotating speed in rotor dynamics [140]. They are mathematically and physically
    unambiguous, formal, symbolic and structured. Particularly, in the field of PHM,
    they demonstrate the quantifiability of the failure processes, including algebraic,
    governing equations, and probabilistic relations.


    +   2) Second category: Embedded knowledge related to a structure or specific
    process. It is locked into the physics derivation process, system convention,
    structure, or layout. It provides information related to the sequence orders and
    the requirements of each process step or each component structure. It uses ML
    modules to express information concerning the system structure [132], the unit
    dependencies [154], or the system topology framework. In particular, some knowledge
    is non-symbolic and non-explicit, being merely an input-output or mutual verification
    relationship between the derivation procedures.


    +   3) Third category: Tacit knowledge relating wide range of physical information.
    It involves hypotheses, expert rules and experiences, and also diverse underlying
    physical properties. It refers to knowledge about the deterioration process which
    is somewhat intuitive and difficult to quantify.


    # 4.2. Discussion of physics-informed ways according to knowledge forms


    Table 7 summarises different forms of knowledge for PIML in PHM and presents their
    corresponding embedded way into ML. From this table, we can note that:


    +   1. Due to explicit analytical equations or models that define clear input-output
    mathematical relationships, explicit knowledge is the most common way for building
    PIML. It is widely used in the construction of “simulators”, “extractors”, “operators”,
    and “consistency checks”. It can often be used independently or collaboratively
    in several data flow sessions in a ML pipeline. It changes the input and output
    of the corresponding link on the data stream but does not change the data flow
    direction.


    +   2. Embedded knowledge studies focus on serving as the physics-informed ML
    structure design guidance. They seek to build the entire ML structure such that
    the information flow inferred through the ML model resembles the one passed through
    a real physical model, structure, or derivation process. In typical circumstances,
    when there are unknown terms in the process of physical derivation, making it
    difficult to establish a formulaic model, and when there exists a quantifiable
    relationship between physical structures, one may employ paradigms such as Structure
    blueprint (Designing the structure and parameters of ML model solely based on
    physical structural relationships or deductive processes), or alternatively, embedding
    limited known steps or models as local operators within the ML framework.


    +   3. A large part of “Embedded knowledge” studies actually points to interchangeability
    between ML and physical derivations. For example, the Eulerian solution of Ordinary
    Differential Equations (ODE) is implemented as a special case of RNN which is
    applied in Dynet [218]. Although the current research still focuses on the relevant
    area of neural differential equations (NDEs), i.e. the use of ML to derive or
    embed the differential equation for failure as in the paper [156,178,217], the
    trend of operator learning, led by Deeponet, has recently gotten a lot of attention.
    For illustration, the transmissible operators, which characterize the relationship
    between the outputs of an underlying vehicle sensor system, have been proposed
    in the paper [217].


    +   4. Although “Tacit knowledge” is the most widespread knowledge, only a small
    number of studies have been conducted on it. In these studies, “Tacit knowledge”
    is usually transformed into a parsable form in order to be embedded in the objective
    function and derivation process. It enables the design of a physics similarity
    test metric [171,199] to assess whether the distribution or trend of results conforms
    to certain physical properties [177,214], as well as the construction of a conflict
    loss [126,143,173].


    +   5. For the use of tacit knowledge, the physics knowledge is often not given
    in advance, but it is obtained by designing a ML model in a reasonable way to
    discover the fault-related information. For example, in [118] the authors use
    dynamic mode decomposition to extract signal characteristics. These characteristics
    are used as labels for training the ML on how to automatically discover the information
    related to crack growth. The implementation of this type of knowledge discovery
    process should lie in stacked ML architectures, i.e., one ML model for knowledge
    discovery and one for proofreading or extending knowledge. For illustration, one
    can consult the associated two-stage graph NN architecture in [132].


    +   6. In practice, analytical and quantifiable explicit knowledge is certainly
    restricted, and knowledge regarding fault processes is still largely perceptual
    or qualitative. Hence, tacit knowledge can be transformed into embedded knowledge
    through a deeper understanding of mechanisms and structures. For instance, the
    node and connection in the graphical NN can be constructed based on an understanding
    of the current and voltage distribution in the electrical grids [149]. Furthermore,
    the understanding of the basic physics properties and relations can be described
