    "语言" OR "医学" OR "癌症" OR "人脸" OR "情绪" OR "文本"。第一次搜索结果提供了来自两个最大数据库（Google Scholar
    和 Web of Science）的 36,632 多份手稿。然后，我们将搜索限制在通常实施工程 PIML 和 PHM 解决方案的领域，例如 Electronic、Aerospace、Mechanics、Computer
    Science、Engineering Multidisciplinary、Automation Control Systems、Energy Fuels、Engineering
    Civil、Engineering Manufacturing 等。此步骤后，保留了 6239 篇论文。为了对已发表材料列表提供洞察，我们实施了进一步的选择步骤，如"论文过滤器"、"人工筛选"和"合并重复"。在"论文过滤器"中，我们使用上述提到的干扰词和核心词汇进行主题过滤，然后在"人工筛选"中对过滤结果进行人工审查，以确定文章主题是否符合综述范围。通过此过程，我们发现只有
    139 篇论文的主题涉及 PHM 中的 PIML 相关混合框架。其中，122 篇论文详细讨论了 PHM 中的 PIML。这些论文被用于得出关于研究趋势的关键评论，以及
    PIML 在 PHM 中发展的有趣统计结果。


    ### 2.2. PHM 中 PIML 的研究趋势分析


    为了从混合框架到 PIMLs 获取研究趋势的概览，在本节中，可以看出，在仅十年的发展期间，工业中模型驱动与数据驱动方法结合的研究已出现在广泛的会议和科学期刊中，如图
    3 所示。可以看出，机械系统与信号处理（MSSP）期刊已就此混合框架发表了大量手稿，超过 573 篇论文。IEEE 航空航天是吸引最多相关混合框架研究的会议，共有
    706 篇论文。接下来，为了展示从混合框架到 PHM 中 PIML 方法的演变过程概览，我们使用 CiteSpace 软件 [35] 进行了计量分析。特别是，该软件允许自动分析关键词共现，然后生成最广泛使用关键词的聚类网络（图
    4）及其随时间的发展趋势（图 5）。从图 4 的聚类网络可以看出，最广泛使用的关键词是"物理信息机器学习"。与该关键词相关的，可以引用用于构建 PIML 框架的"主动学习"和"微分方程"技术。此外，"物理信息神经网络"也是一个关键关键词，它已与"动力系统"和"深度神经网络"共现。查看相关研究可以看出，PINN
    通常用于捕捉系统动态行为，用于损伤检测、故障诊断和故障预测。考虑图 5，可以看出 PIML 研究中使用的关键词的发展趋势从专家系统（2011 年）、加权类关联规则挖掘（2014
    年）转向近年来的 PINN。同时，可以注意到对物理知识的需求不断增加，这由经常出现的关键词表示，例如"物理信息稀疏识别"和"基于方程的领域知识利用"。接下来，"深度神经网络"和"扩展卡尔曼滤波器"（或"粒子滤波器"）通常结合以创建
    PIML 框架（[36]）。此外，ML 中寿命退化的"嵌入微分方程"相关研究也通过此趋势分析得到突出显示（[37]）。


    ### 2.3. PHM 中 PIML 的统计分析


    本节旨在讨论与 PHM 中 PIML 相关的现有论文的统计分析结果。


    ![](img/3ec5662c0c5150f5b95af65046cb9cd4_3_0.png)


    (a) 会议


    (b) 期刊


    图 3. 本综述中考虑的混合框架的出版来源。


    ![](img/3ec5662c0c5150f5b95af65046cb9cd4_4_0.png)


    图 4. 关键词共现聚类。


    ![](img/3ec5662c0c5150f5b95af65046cb9cd4_4_1.png)


    图 5. 知识辅助 PHM 研究中关键词的发展趋势。


    ### 2.3.1. 现有术语


    存在许多与“物理信息机器学习”相似的术语（见表 1）。根据所有与 PHM 中 PIML 相关的出版物的统计结果，这些术语的分布为：“物理信息的”（47.1%），“基于物理的”（19.9%），“物理引导的”（18.3%），“物理注入的”（8.8%）和“物理感知的”（5.9%）。


    这些术语的异质性可能对该主题的研究及其在实践中的广泛应用构成重大障碍。因此，在本小节中，我们寻求澄清现有术语之间的异同。


    图 6 展示了每个术语的主要范围，可总结如下：


    - 1. “物理注入的”旨在发现并将物理属性约束纳入数据预处理 [54,160]，利用物理导出的参数和关系来增强 ML 模型的性能，尤其是在稀疏数据场景中
    [161]。


    表 1 与 PHM 中 PIML 相关的现有术语汇总。


    | 术语 | 参考文献 | 总数 |

    |---|---|---|

    | 物理注入的 | [27,38-48] | 12 |

    | 基于物理的 | [10,14,32,49-71] | 26 |

    | 物理引导的 | [72-94] | 23 |

    | 物理感知的 | [95-102] | 8 |

    | 物理信息的 | [20,21,37,81,103-109,109-117,117-123,123-159] | 64 |


    ![](img/3ec5662c0c5150f5b95af65046cb9cd4_5_0.png)


    图 6. 不同术语的关注点。


    - 2. “基于物理的”侧重于在模型-数据混合框架中集成物理模型或约束 [68,162]，在特征工程、系统建模和基于约束的方法中融入物理原理 [101]。


    - 3. “物理感知的”强调感知系统的内在行为和结构特征 [95]，将 ML 算法结构或交互结构与物理系统对齐，以实现物理一致性。


    - 4. “物理引导的”扩展了“物理感知的”对可视化表示退化状态或使用物理知识指导数据处理 [79,163]、ML 结构设计、算法权重和偏置 [92] 或经验损失函数
    [89] 的关注点。


    - 5. “物理信息的”指最广泛的框架 [164]，涵盖整个机器学习过程，在机器学习流水线的各个方面融入物理知识。


    因此，在本综述中，术语“PIML”（物理信息机器学习）被选为讨论的术语，以涵盖机器学习方法中物理知识的集成。


    ### 2.3.2. 应用领域、主要动机和方法评价指标


    图 7 展示了 PHM 中 PIML 研究的应用领域和数据源分布。从图 7 (a) 可以看出，当前 PHM 中的大多数 PIML 研究集中在材料损伤（41.2%），因为该领域已存在大量关于材料动态行为的数学和物理建模研究。这些研究为
    PIML 模型的快速发展提供了坚实基础。其他应用，如航空结构与设备（20.0%）、生产设备（13.0%）、轴承与齿轮箱（15.0%）和电网（9%）也近年来吸引了研究界的更多关注。此外，考虑数据源图
    7 (b)，我们发现 PIML 研究的大多数数据源来自仿真（30%）。此外，最常用的基准数据集是涡轮发动机仿真数据集（C-MAPSS 和 AGTF30）和电池数据集（Oxford
    和 NASA）。针对实际系统的 PIML 模型研究仅限于小型实验平台（16%）。这些观察可以用实际系统通常难以建模且缺乏可利用的基于物理的知识来解释。图 8
    显示了每年与 PHM 中 PIML 相关的出版物数量。它突显了研究界对该主题日益增长的兴趣。可以看出，2020 年后每年的出版物数量显著增加。材料、轴承、齿轮、航空航天结构和电力系统方面的研究已引起广泛关注。


    图 9 展示了关于数据质量的相关研究统计结果。可以看出，PIML 的很大比例


