    # # Physics-informed machine learning in prognostics and health management: State
    of the art and challenges


    Weikun DENG a,*, Khanh T.P. NGUYEN a, Kamal MEDJAHER a, Christian GOGU b, Jérôme
    MORIO c


    a Laboratoire Génie de Production, LGP, Université de Toulouse, INP-ENIT, 47 Av.
    d’Azéreix, Tarbes, 65016, France

    b Institut Clément Ader (ICA), Université de Toulouse, ISAE-SUPAERO, UPS, CNRS,
    INSA, Mines Albi, 3 rue Caroline Aigle, Toulouse 31400, France

    c ONERA/DTIS, Université de Toulouse, Toulouse F-31055, France


    # ## ARTICLE INFO


    +   - Physics-informed machine learning

    +   - Prognostics and health management

    +   - Physics-informed input space

    +   - Physics-constraint learning

    +   - Physics-embedded algorithm structure

    +   - Knowledge


    # ## ABSTRACT


    Prognostics and health management (PHM) plays a constructive role in the equipment’s
    entire life health service. It has long benefited from intensive research into
    physics modeling and machine learning methods. However, in practice, the existing
    solutions often encounter difficulties caused by sparse data & incomplete system
    failure knowledge. Pure machine learning or physics-based methods can sometimes
    be infeasible in such situations. As a result, there has been a growing interest
    in developing physics-informed machine learning (PIML) models which allow incorporating
    different forms of physics knowledge at different positions of the machine learning
    pipeline. This combination provides significant assistance for detection, diagnostic,
    and prognostics. However, to the best of our knowledge, the bibliometrics analyses
    and the comprehensive review of the existing research concerning PIML in PHM remain
    vacant. Our review is therefore dedicated to filling these gaps. We synthesize
    the concept of PIML in PHM, and propose a taxonomy of PIML approaches from the
    perspective of “Expression forms of informed knowledge” and “Knowledge informed
    methods”. The findings and discussions presented in this paper enable us to clarify
    the current state of the art and the emerging opportunities of PIML approaches,
    especially for building PHM systems that can work under the “small data and scarce
    physics knowledge” paradigm.


    # ## 1. Introductions


    Prognostics and Health Management (PHM) is an interdisciplinary engineering discipline.
    It ensures the real-time health assessment and future state prediction of systems
    based on up-to-date information and data processing [1] by two main paradigms:


    Abbreviation: ANN, Artificial Neural Network; CNN, Convolutional Neural Network;
    CRA, Cumulative relative accuracy; DNN, Deep Neural Networks; FCN, Fully Convolutional
    Networks; GNN, Graph Neural Networks; KSVD, K Singular Value Decomposition; LSTM,
    Long short-term memory; MAE, Mean Square Error; MSE, Mean Absolute Error; NMSE,
    Normalized Mean Absolute Error; NMAE, Normalized Mean Square Error; NODE, Neural
    Ordinary Differential Equations; PBM, Physics based methods; PCA, Principal Component
    Analysis; PDE, Partial differential equation; PHM, Prognostic and Health Management;
    PIML, Physics-informed Machine Learning; RMSE, Root mean square error; RNN, Recurrent
    Neural Network; ROM, Reduced Order Model; RUL, Remaining useful life; SVM, Support
    Vector Machine; VAE, Variational AutoEncoder; DRM, Disk-ram.


    * Corresponding author. E-mail address: weikun.deng@enit.fr (W. DENG).'
  - '[PAGE 1]


    data-driven and physics model-based methods (PBM).

    Enabled by machine learning (ML), with a recent surge related to deep learning
    [2,3], data-driven methods extract features from data and identify the underlying
    degradation processes, showing promising results at different failure scales from
    macro to micro degradation and damages [4]. However, ML in PHM faces three dilemmas:


    +   1. First dilemma arises from the limited data quality. One can cite: a) sparse
    & noisy observations caused by limited structural conditions and pervasive monitoring
    instrument costs [5]; b) sparse & noisy failure information due to restricted
    monitoring time and high run-to-failure operation costs [6]; and c) sparse labels
    caused by limited expert knowledge and high manual labeling cost [7].

    +   2. Second dilemma is the opaque, unexplained nature of ML, leading to the
    trust deficit [8]. For high investment and risk industrial domains, the unobservable
    process between the ML input data and the output PHM results is viewed as a “black
    box” with interpretability difficulties [9].

    +   3. Third dilemma in ML arises from the lack of physics consistency. ML generally
    converges in the direction that best fits the training samples which might not
    absolutely conform to the Physics-constraints [10].


    In contrast to ML, PBM observes failure phenomena and then establishes mathematical
    or numerical mechanism models to represent faults or degradations [11]. When the
    failure natures are well understood, PBM needs fewer data than ML [12] and achieves
    better generalization [13]. However, modern engineering systems are complex and
    influenced by mutual non-linear interactions among the subsystems. Thus, the PBM
    performance can be affected by different factors such as the system scale [14]
    and complexity [15], leading to the following dilemmas:


    +   1. First dilemma concerns the epistemic uncertainties in the model simplification
    and the paradox between the computational efficiency and the PBM’s credibility
    [16].

    +   2. Second dilemma is the sometimes limited understanding of the fault mechanism
    to construct trustworthy degradation models [17].

    +   3. Third dilemma arises from the unknown and unobservable parameters of the
    PBM.


    Due to the above dilemmas, the purely physics-based models are rarely applied
    in practice [18,19].


    Regarding limitations of both data-driven and physics-based methods, it is necessary
    to develop hybrid approaches to overcome the drawbacks and inherit the advantage
    of each one. Fig. 1 shows the motivation for a combination of PBM and ML models.
    In fact, physics-informed machine learning (PIML) is a promising solution in the
    case of sparse data and incomplete physics knowledge. PIML is formally introduced
    at the Los Alamos PIML workshops during 2016–2020 [20] with the initialization
    in solving the complex physics problems by ML. Particularly, Raissi et al. [21]
    proposed physics-informed neural network (PINN)-based Partial differential equations
    solution, leading to a boom in “informed NN”. Meanwhile, many industrial partners,
    including GE [22], IBM [23], Nvidia [24], US DARPA [25] and NASA [26], the Argonne
    National Laboratory [27] and Siemens [28], have paid high attention to the application
    of PIML.


    The motivation behind the development of PIML has been extensively discussed in
    existing literature, highlighting its inherent strengths and advantages as follows:


    +   1. PIML merges data-driven machine learning and physics principles to boost
    the precision and interpretability of prognostics and health management (PHM)
    system predictions.

    +   2. PIML shines in tackling intricate dynamics of complex and nonlinear systems
    in PHM applications. It achieves this by integrating physics-based constraints
    and equations, thereby enhancing its predictive and modeling abilities.


    ![](img/3ec5662c0c5150f5b95af65046cb9cd4_1_0.png)


    Fig. 1. Sparse data and incomplete physics knowledge drive PHM techniques towards
    the combination of PBMs and ML.'
  - '[PAGE 2]


    +   3. The blend of physics-based knowledge enables PIML to generalize more effectively,
    offering reliable predictions even beyond observed data. This is particularly
    useful in scenarios with sparse or incomplete training data.


    +   4. A key advantage of PIML models are their improved interpretability owing
    to the explicit incorporation of physics. By embedding physical constraints and
    equations, PIML allows to more easily elucidate some of the underlying mechanisms
    that drive system behavior, which aids diagnostic analysis and decision-making.


    +   5. Despite limited data, PIML''s efficient use of system physics knowledge
    allows for accurate predictions, reducing the dependence on large data-sets and
    potentially minimizing data acquisition costs.


    +   6. PIML is robust to noise and outliers due to its enforcement of physical
    laws, which can filter out erroneous or noisy data, leading to dependable predictions.


    +   7. PIML provides computational benefits by amalgamating physics-based constraints
    with machine learning algorithms, thereby yielding efficient models that reduce
    computational complexity, suitable for real-time or near real-time applications.


    Inspired by these advances, there have been several studies on PIML for anomaly
    detection, fault diagnostic, and prognostics [29]. Compared to other potential
    solutions for sparse data, like transfer learning [30], the advantage of PIML
    in PHM is in assisting data-driven insights, utilization of expert knowledge,
    adaptability and scalability. By leveraging these strengths, PIML can also enhance
    the other methods, and the capabilities of addressing the PHM challenges [31]
    in limited data availability, complex and nonlinear system dynamics, physics consistency
    related trust, handling of noise and uncertainty, integration of multi-source
    and heterogeneous data, and transferability across systems and domains [32]. Furthermore,
    PIML is not in competition with these methods, but is the icing on the cake to
    achieve win-win situations, for example through approaches such as PI-transfer
    learning in aerospace anomaly detection [33], and PI-meta learning for machining
    tool wear prediction [34]. Although many works are exciting, to the best of our
    knowledge, none of the existing papers provides a comprehensive review of PIML
    in PHM. In addition, no overall qualitative and bibliometrics analyses are conducted.
    Finally, taxonomy and applications in PHM are unclear and waiting discussion in
    particular with respect to: 1) Expression forms of Informed Knowledge and II)
    Knowledge Informed Methods. Therefore, this paper aims to fill the above-mentioned
    gaps. Besides, the open challenges toward the maturity of PIML in PHM are also
    highlighted.


    The rest of the paper is organized as follows. Section 2 presents a bibliometric
    analysis of the existing works concerning PIML in PHM and thus shows an overview
    of the research trend on this topic. Section 3 provides a comprehensive and insightful
    review of PIML methods in PHM. Section 4 aims to summarize and discuss the source
    of physics knowledge, which can be used to derive ML models, as well as the corresponding
    integration methods. Finally, Section 5 summarizes the main contribution of this
    paper and provides insights into potential future research.


    # 2. Bibliometrics analysis


    This section aims to provide an overview of the research interests of PIML studies
    in the field of PHM. Firstly, we describe the literature research methodology
    in Subsection 2.1. Then, based on the bibliometric analysis of PIML in PHM, the
    research trend on this topic is discussed in Subsection 2.2. Finally, Subsection
    2.3 compiles a statistical analysis of the works on PIML applied to PHM.


    # 2.1. Literature research methodology


    The bibliographic data investigated in this work covers the period from January
    2013 to January 2023. The time span chosen in this article is based on the understanding
    that PIML technology emerged around 2016. However, upon investigating the research
    trend from hybrid frameworks to PIML, we found similar technical concepts dating
    back to 2013. Consequently, we conducted a literature search spanning from 2013
    to the present. In the search flowchart presented in Fig. 2, the survey is simultaneously
    retrieved from Web of Science (WoS) and Google Scholar. The search on Google Scholar
    is to verify the adequacy of the search in WoS.


    ![](img/3ec5662c0c5150f5b95af65046cb9cd4_2_0.png)


    Fig. 2. Search methodology flowchart.'
