  mdcn: "\n\n![](img/3ec5662c0c5150f5b95af65046cb9cd4_20_0.png)\n\n| 参考文献 | 知识形式 |\
    \ | | 告知方式 |\n| :--- | :---: | :---: | :---: | :--- |\n| | 显式 | 嵌入式 | 隐式 | |\n\
    | [13,53,55,58,144,170,174,188,195–198] | ✓ | | | 模拟器 |\n| [59,171,199] | | |\
    \ ✓ | 量规 |\n| [59,167,169,171,183,199,200,201] | ✓ | | | 提取器 |\n| [36,62,63,113,149,172,182,213]\
    \ | ✓ | | | 算子 |\n| [43,51,118,165] | | | ✓ | 算子 |\n| [81,130,209] | | ✓ | | 算子\
    \ |\n| [37,113,210,217] | ✓ | | | 结构蓝图 |\n| [20,50,91,95,107,114,115,120,121,129,156,166,178,179,186,211,212]\
    \ | | ✓ | | 结构蓝图 |\n| [57,76,142,149,187] | ✓ | | | 初始化器 |\n| [154,168] | | ✓\
    \ | | 初始化器 |\n| [96,123,132,133,150] | ✓ | | | 一致性 |\n| [177,214] | | ✓ | | 一致性\
    \ |\n| [131,146] | | | ✓ | 一致性 |\n| [84,176] | ✓ | | | 冲突 |\n| [126,143,173] |\
    \ | | ✓ | 冲突 |\n\n基于建筑损伤模式物理属性的嵌入式迁移学习模型，通过最小化由 L2-范数和角度损失测量的损伤属性损失来训练 [215]。此外，上述建筑相关知识还可用于引入一种新的物理引导加权设计。在\
    \ [199] 中，作者利用与目标的物理相似性来衡量每个源的重要性，从而决定将数据转移到哪个源。\n\n- 7. 相同的物理知识可以以不同方式被告知。例如，捕获系统特征的动态模态分解可用于设计图像重建的算子以识别裂缝\
    \ [118]，或用于设计生成时滞系统诊断输入特征图的提取器 [169]。特别是，以有限元等自包含输入输出关系和推导形式存在的知识，可用作：1) 嵌入式知识，以指导网络设计来模拟物理推导（例如用于加速\
    \ CNN 的动态卷积）[218]；2) 显式知识，通过设计失效代理模型进行数据增强 [55]；或 3) 度量，以设计 ML 与物理预测之间的冲突损失 [176]。\n\
    \n- 8. 关于何时使用何种形式的知识。根据对表 7 中现有研究的分析，本文建议：在处理显式知识时，系统行为可以由具有清晰输入输出关系的数学方程或解析模型来描述。如果方程中涉及的物理信号变量可用，我们可以根据解析公式或系统物理特性来定制\
    \ NN 层或单元。当系统行为的显式知识不可用，但我们拥有系统物理结构或行为模型推导知识的信息，并伴随对涉及信号的推理关系处理时，我们可以构建物理告知结构。随后，嵌入式知识被用于定制\
    \ NN 结构中的数据流，或将定制设计的 NN 用作物理模型推导特定步骤的代理模型。在隐式知识的情况下，即缺乏系统行为的定量信息，但系统输入输出之间存在物理关系或系统输出上的约束时，这些关系可用于定制\
    \ ML 目标函数或调节隐藏层的输出。\n\n需要注意的是，这些知识形式并非互斥，通常可以在 PIML 框架内结合或集成。使用哪种形式或是否结合使用，取决于当前问题的具体要求和目标。PIML\
    \ 的综合方法可能涉及利用显式、嵌入式和隐式知识的组合，以捕捉系统特征的全范围并优化模型性能。最终，选择适当的知识形式需要仔细考虑问题领域、可用专业知识、数据可用性，以及建模过程中所需的可解释性和准确性水平。\n\
    \n## 5. 挑战与未来研究方向：面向“小数据和稀缺物理知识”背景下的 PHM\n\n### 5.1. PIML 的局限性与挑战\n\n与稀疏和噪声数据、数据可用性以及不完整物理模型相关的挑战在其他综述\
    \ [18,29,32] 中已被强调。此外，还需要进一步研究收集更具代表性的数据、选择适当的基准模型，以及确定告知 ML 部分的权重参数或超参数。本文认为，这些挑战背后的根本问题是如何将各种形式的知识转换为\
    \ ML 框架所需的类型，即调整知识以适应 ML 模型，而不是选择 ML 模型来拟合物理知识。因此，可以从两个方面突出挑战：\n\n- 1. 构建物理感知\
    \ ML 框架\n\n  在当前关于 PIML 设计的研究中，物理知识与 ML 之间的互转，以及 ML 物理不一致性的评估度量，仍然是一个研究不足且具有挑战性的主题。因此，有必要构建一个物理感知\
    \ ML 框架，该框架能够根据物理-ML 互转机制和不一致性评估结果，基于知识形式自动将物理知识融入 ML 流水线的各个部分。\n\n- 2. 知识基础的构建\n\
    \n  构建有效的 PIML 框架需要深入理解所研究系统的物理特性。这要求研究人员在计算机科学和物理学（例如力学）方面都具备全面的知识和技能。因此，对于缺乏跨学科经验的初级研究人员来说，在实施\
    \ PIML 技术时面临着显著的障碍。此外，由于大多数知识可能含糊不清，数学表达式和物理建模并不总是针对 PHM 案例研究得到充分发展。因此，从含糊信息中构建\
    \ PIML 的知识基础至关重要。\n\n### 5.2. 未来方向\n\n虽然很难确定哪个方向会带来颠覆性发现，但 PHM 社区可以通过在以下领域考虑前一节概述的挑战，为\
    \ PIML 的未来做出重大贡献：\n\n- 1. 在 ML 中编纂故障机制\n\n  关于 ML 如何更好地利用来自多个来源的集成物理知识，缺乏相关研究。因此，当不同形式的知识被嵌入到不同的\
    \ ML 框架中时，建立 PIML 的认知机制似乎是一项有意义的工作。\n\n- 2. 从度量学习的角度\n\n  另一条值得调查的路径是开发具有更多维度度量的\
    \ ML 目标函数，这些度量可以涵盖模型复杂度、物理一致性、计算成本和结果准确性。\n\n- 3. 进一步构建合适的基准问题\n\n  一组定义明确的基准问题可以促进不同算法的评估和比较，从而推动该主题的研究发展。由于深层领域背景要求，公共数据集对应的物理知识通常不可用。这常常导致由于知识短缺而在开发\
    \ PIML 方法时遇到众多障碍。开发带有共享编码知识的开源基准问题（例如 [219] 中提出的合成疲劳损伤数据库），或其他领域的类似进展，将受到欢迎。\n\
    \n- 4. 结合灵活数字孪生模型构建生命周期工具。[192, 193] 中的建模技术和数字孪生赋能技术为与 PIML 集成提供了一个诱人的机会。这种组合有潜力开发一个强大的生命周期管理工具，该工具包含灵活保真度模型并保持物理一致性。此外，通过构建数字孪生框架，它还能够包含不确定的定量评估评价。\n\
    \n- 5. 适应稀疏运行至失效数据和稀疏标签数据。PHM 中的 PIML 研究大多关注数据集中的稀疏观测或信息偏差。然而，未标记数据和非完整失效过程数据占绝大多数。因此，针对稀疏和噪声数据的\
    \ PIML 理论与应用研究值得探索。预计将开发诸如物理告知无监督学习、自监督学习和半监督学习等新的 PHM 范式。\n\n- 6. “小数据和稀缺物理知识”背景下的\
    \ PIML。PHM 中 PIML 的最终发展目的之一是能够在“小数据和稀缺物理知识”条件下工作，这将大大扩展潜在 PHM 应用的范围。基于上述研究方向，将\
    \ PIML 与知识发现和 ML 架构搜索技术相结合，有潜力涌现出突破性方法。\n\n## 6. 结论\n\n本文介绍了面向预测与健康管理的物理告知机器学习的文献计量结果和最新研究综述。从“如何告知”和“告知什么”的创新视角，总结并提供了其基本范式的概述。现有方法根据物理知识在\
    \ ML 流水线中的嵌入位置和方式进行分组。还讨论了将 PIML 应用于解决 PHM 问题的挑战和未来研究方向。本文的主要贡献是提供 PHM 中 PIML\
    \ 的简洁而全面的概述，并专注于为 PIML 利用翻译适当知识形式的根本挑战。希望本文能鼓励进一步工作，拓展 PIML 在 PHM 领域的潜力。\n\n##\
    \ 利益冲突声明\n\n作者声明没有已知的可能影响本文所报告工作的竞争性财务利益或个人关系。\n\n## 数据可用性\n\n数据应要求提供。\n\n## 参考文献\n\
