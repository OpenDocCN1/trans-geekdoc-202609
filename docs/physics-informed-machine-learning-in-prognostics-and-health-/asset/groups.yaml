    ## 4.1. 物理知识类别


    物理知识是实现物理信息机器学习的前提。在综述 [141] 中，作者建议根据知识的起源对知识来源进行分类。然而，物理信息机器学习的实现方法取决于知识的形式而非知识的来源。例如，论文
    [84] 和 [133] 中提出的物理信息机器学习框架来自不同领域（建筑施工和材料行业）且具有不同的知识来源，但两者都使用相同的知识形式，即有限元法，来构建“一致性检查”损失函数。因此，本子节侧重于综合物理知识的形式而非其来源。根据
    PHM 中现有的物理信息机器学习研究，物理知识形式可分为三类，如图 20 所示。


    - 1) 第一类：与解析失效模型相关的显式知识。显式知识由系统动态行为的解析模型或方程表示，例如转子动力学中的发电机惯性常数、阻尼系数和转速 [140]。它们在数学和物理上明确无歧义、形式化、符号化且结构化。特别是，在
    PHM 领域，它们展示了失效过程的可量化性，包括代数关系、控制方程和概率关系。


    - 2) 第二类：与结构或特定过程相关的嵌入式知识。它被锁定在物理推导过程、系统惯例、结构或布局中。它提供与每个过程步骤或每个组件结构的顺序和要求相关的信息。它使用机器学习模块来表达关于系统结构
    [132]、单元依赖关系 [154] 或系统拓扑框架的信息。特别是，某些知识是非符号化和非显式的，仅仅是推导过程之间的输入-输出或相互验证关系。


    - 3) 第三类：与广泛物理信息相关的隐式知识。它涉及假设、专家规则和经验，以及多样的底层物理特性。它指关于劣化过程的知识，这类知识在某种程度上是直觉的且难以量化。


    ## 4.2. 按知识形式讨论物理注入方式


    表 7 总结了 PHM 中物理信息机器学习的不同知识形式，并呈现了它们相应的嵌入机器学习的方式。从该表中可以注意到：


    - 1. 由于定义了清晰输入-输出数学关系的显式解析方程或模型，显式知识是构建物理信息机器学习最常见的方式。它广泛用于“模拟器”、“提取器”、“算子”和“一致性检查”的构建。它通常可以在机器学习管道的多个数据流会话中独立或协作使用。它改变数据流中相应环节的输入和输出，但不改变数据流方向。


    - 2. 嵌入式知识研究侧重于作为物理信息机器学习结构设计指导。它们寻求构建整个机器学习结构，使得通过机器学习模型推断的信息流类似于通过真实物理模型、结构或推导过程传递的信息流。在典型情况下，当物理推导过程中存在未知项，使得难以建立公式化模型，并且当物理结构之间存在可量化关系时，可以采用诸如结构蓝图（仅基于物理结构关系或推导过程设计机器学习模型的结构和参数）等范式，或者将有限的已知步骤或模型作为局部算子嵌入机器学习框架中。


    - 3. 大部分“嵌入式知识”研究实际上指向机器学习与物理推导之间的可互换性。例如，常微分方程（ODE）的欧拉解被实现为循环神经网络的一种特例，并应用于 Dynet
    [218]。尽管当前研究仍然集中在神经微分方程（NDEs）相关领域，即使用机器学习来推导或嵌入失效的微分方程，如论文 [156,178,217] 所示，但由
    Deeponet 领导的算子学习趋势最近引起了广泛关注。例如，论文 [217] 提出了可传递算子，用于表征底层车辆传感器系统输出之间的关系。


    - 4. 虽然“隐式知识”是最普遍的知识，但对其进行的研究数量很少。在这些研究中，“隐式知识”通常被转换为可解析的形式，以便嵌入目标函数和推导过程。它使得能够设计物理相似性测试度量
    [171,199] 来评估结果的分布或趋势是否符合某些物理特性 [177,214]，以及构建冲突损失 [126,143,173]。


    - 5. 对于隐式知识的使用，物理知识通常不是预先给定的，而是通过以合理方式设计机器学习模型来发现故障相关信息而获得的。例如，在 [118] 中，作者使用动态模态分解来提取信号特征。这些特征被用作标签，训练机器学习如何自动发现与裂纹生长相关的信息。这种知识发现过程的实现应基于堆叠的机器学习架构，即一个用于知识发现的机器学习模型和一个用于校对或扩展知识的机器学习模型。例如，可以参考
    [132] 中相关的两阶段图神经网络架构。


    - 6. 在实践中，可分析和可量化的显式知识无疑是有限的，关于故障过程的知识在很大程度上仍是感性的或定性的。因此，隐式知识可以通过对机制和结构的更深入理解转化为嵌入式知识。例如，图神经网络中的节点和连接可以基于对电网中电流和电压分布的理解来构建
    [149]。此外，对基本物理特性和关系的理解可以用公式描述并转化为显式知识。例如，an


