    [90] 与ML相结合，包括以下三种范式：“基本算子”、“ML结构蓝图”和“参数初始化器”，如图 15 所示。


    “基本算子”负责在机器学习处理中强制执行物理求解的关系。另一方面，“ML结构蓝图”致力于基于物理推导的关系设计ML模块或层间连接，从而赋予稀疏性。这些组件在算法的结构设计中实现。此外，“参数初始化器”专注于识别ML参数。现有文献中使用的这些方法的简要摘要见表
    5。


