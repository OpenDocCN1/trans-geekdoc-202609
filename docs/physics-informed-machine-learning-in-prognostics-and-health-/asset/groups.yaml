    ## 物理信息量规


    在某些特定的案例研究中，例如复杂结构系统，不可避免地需要使用简化的物理模型来构建“仿真器”。然而，这种简化可能导致模型行为以及估计值相对于系统真实值出现显著偏差
    [80]。随后，模型更新无法固有地纠正建模错误。为克服这一问题，数据迁移是增强数据空间的一种替代方案。在此背景下，一些研究专注于将物理知识作为“量规”来评估源数据库和目标数据库之间的相似性。该技术通过在两者之间设计基于物理的传递准则，将特征知识从源域迁移到目标域。它有助于增强ML的鲁棒性并提高ML模型的效率和准确性。


    图 13 展示了实现“量规”的两种基本方式。其原理在于寻找源域和目标域之间的不变量或不变关系，例如特征对称性、守恒性、变换不变性和单调性 [139,203]。随后，拥有大量数据和信息的源域会根据物理相似性准则有选择地迁移到目标域
    [159]。


    ## 物理信息提取器


    除了数据提取，数据处理是另一项直接影响ML模型性能的关键任务。为确保输入空间包含尽可能多的故障相关特征，有必要创建一个物理信息提取器，以根据物理知识指导数据预处理。例如，所提出的物理信息提取器允许选择合适的域变换方法
    [204] 以获取相关的聚合特征 [155]，或融合来自多个来源的异构信息 [40,65]。在 [88] 中，紧弦模型方程标准化了主成分分析方法，用于提取电缆振动的指定模态频带。
    [79] 中的研究开发了一种物理引导的ML模型来执行特征提取过程，该过程可以生成直接反映电动汽车性能的特定特征。


    特征提取之后，ML模块包含一个嵌入组件，其作为一组子特征提取器发挥作用。随后进行信息融合，主要侧重于合并物理健康指标与虚拟健康指标。前者涉及故障物理，通常在指标方面具有显著的可解释性。对于后者，现有PIML研究中有两种实现方式
    [205]：


    - 从多个物理域进行信息融合，以获得冗余更少且代表所有原始信息的“感官数据”。例如，多元回归 [132]、升高空间投影 [206] 以及其他监督和无监督学习方法被用于执行信号级数据融合和特征级数据融合
    [42]。


    - 通过物理关系进行跨物理域关系融合，以获得“感知数据”，其中数据各部分的物理关系凸显 [207,208]，如图 14 所示。例如，在裂纹增长预测中，通过牛顿-拉夫逊法获得的结构响应信息（如位移和相场）以当前裂纹状态的图像形式保存，以构建空间结构知识
    [70]。


