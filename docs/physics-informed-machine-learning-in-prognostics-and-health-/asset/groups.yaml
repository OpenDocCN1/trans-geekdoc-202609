    从表 2 中，我们可以得出以下结论：


    - 1. 本表总结了用于评估 PIML 模型的各种 PHM 任务中的训练和测试指标。均方误差（MSE）、平均绝对误差（MAE）、精确率、召回率、F1 分数等指标被用于评估这些模型在状态监测、故障诊断、剩余使用寿命（RUL）预测和退化预测任务中的性能。在收集的文献中，MSE、MAE
    和 RMSE 是最常用的训练指标，分别占 35.7%、20.0% 和 10%。

    - 2. 在文献 [76] 中，通常用于分类的指标（二元交叉熵）被用于退化预测。这是因为退化状态的预测被转化为退化水平的分类。

    - 3. 值得讨论的一个重要方面是与 PIML 模型相关的知识嵌入。在大多数研究中，选择嵌入哪种类型的知识往往更多基于主观意图。在实践中，嵌入的知识与所使用的监测信号密切相关，例如，应变信号与变形和损伤增长之间的关系，温度与疲劳之间的关系，振动与模态之间的关系，因此，从可用的监测信号中收集该领域的知识以用于知情机器学习将是一个很好的起点。

    - 4. 表 2 还概述了每个任务中使用的相应监测信号的具体信息，例如位移、电压、振动、温度、应力、电流等。绝大多数研究（94.3%）专注于处理时间序列或一维监测信号，只有
    5.7% 的研究涉及二维图像信号。

    - 5. PIML 的应用主要在结构领域。这些应用中处理的信号大部分源自振动（25.7%）和应力（27.1%）。此外，某些非破坏性检测测量方法，如导波或声发射，也被采用。通过考察表
    2，可以看出各种 PIML 研究中采用了大量的指标和监测信号。这种多样性反映了 PHM 任务错综复杂且多维的性质，凸显了需要与特定应用和系统特性相匹配的定制方法。对所利用的物理知识、指标和信号的不同组合获得深入理解，可为研究人员和从业人员在为其各自的
    PHM 应用选择适当的评估措施和传感器输入时提供宝贵指导。


