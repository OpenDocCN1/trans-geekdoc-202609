    # 2.2. Research trend analysis of PIML in PHM


    To have an overview of the research trend from the hybrid frameworks to PIMLs,
    in this section, one can see that during only a decade of development, research
    related to the combination of model-driven and data-driven methods in the industry
    has appeared in a wide range of conferences and scientific journals, as shown
    in Fig. 3. One can see that Mechanical Systems and Signal Processing (MSSP) journal
    has published a large number of manuscripts on this hybrid framework with more
    than 573 papers. IEEE Aerospace is the conference attracting the most related
    hybrid framework studies, with 706 papers. Next, to show an overview of the evolving
    process from the hybrid framework to the PIML methods in PHM, we conducted a bibliometric
    analysis by using cite space software [35]. Particularly, this software allows
    automatically analyzing the keyword co-occurrence and then generating the clustering
    network of the most widely used keywords (Fig. 4) and its development trend over
    time (Fig. 5). From the clustering network in Fig. 4, it appears that the most
    widely used keyword is "physics-informed machine learning". Associated with this
    keyword, one can cite "active learning" and "differential equation" techniques
    that are used to build the PIML framework. Besides, "physics-informed neural network"
    is also a critical keyword that has co-occurred with "dynamical systems" and "deep
    neural network". Looking into the relevant studies, one can see that PINN is usually
    used to capture system dynamic behaviors for damage detection, fault diagnostic,
    and failure prediction. Considering Fig. 5, one can see that the development trend
    of the keywords, which are used in PIML research, shifts from the expert system
    (in 2011), weighted class association rule mining (in 2014), to PINN in recent
    years. Meanwhile, one can notice an increasing demand for physics knowledge, which
    is represented by the often-occurred keywords such as "physics-informed sparse
    identification" and "equation-based domain knowledge utilization". Next, "deep
    neural networks" and "extended Kalman filter" (or "particle filter") are usually
    combined to create PIML framework ([36]). Besides, research related to "embedding
    differential equations" of lifetime degradation in ML is also highlighted through
    this trend analysis ([37]).


