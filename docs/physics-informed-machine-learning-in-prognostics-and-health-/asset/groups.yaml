    in the literature to train and evaluate the performance of PIML methods. It also
    shows the specific PHM tasks to which these metrics correspond, as well as the
    types of monitoring measurements.


    From Table 2, we can derive the following remarks:


    - 1. This table summarizes the training and testing metrics used in various PHM
    tasks for evaluating PIML models. Metrics such as Mean Square Error (MSE), Mean
    Absolute Error (MAE), Precision, Recall, F1-score, and others are employed to
    assess the performance of these models in condition monitoring, fault diagnostics,
    Remaining Useful Life (RUL) prediction, and degradation prediction tasks. MSE,
    MAE and RMSE are the most commonly used training metrics in the collected literature,
    accounting for 35.7%, 20.0% and 10% respectively.

    - 2. In paper [76], the metric (binary cross-entropy), commonly employed for classification,
    is used for degradation prediction. This is because the prediction of degradation
    states is transformed into a classification of degradation levels.

    - 3. One important aspect worth discussing is the embedding knowledge related
    to PIML models. In most studies, the choice of which type of knowledge to embed
    tends to be more based on subjective intentions. In practice, the knowledge embedded
    is strongly related to the monitoring signals used, e.g., the relationship between
    strain signals and deformation and damage growth, the relationship between temperature
    and fatigue, the relationship between vibration and modalities, so collecting
    knowledge in this area from the available monitoring signals for use in informed
    machine learning would be a good place to start.

