    # 献辞


    献我的丈夫，他拥有最好的点子。


    # 目录


    # 引言


    欢迎来到迷人工智能的世界！如果你曾好奇过你的手机是如何识别你的脸的，或者像 Siri 和 Alexa 这样的虚拟助手是如何理解你的问题的，那么你即将开启一段解释这一切以及更多内容的旅程。


    人工智能，简称 AI，有时看起来像魔法一样。它在幕后运作，让技术变得更智能，让我们的生活更便利。它可以表现为一个仅通过看视频就能学会分类垃圾的机器人，也可以是一个能够通过观察历史模式来预测天气的计算机程序。这就是
    AI 的实际应用！


    在攻读计算机科学硕士学位期间，我发现自己越来越被 AI 及其应用所吸引。遗憾的是，许多 AI 的基础知识都是以不必要的复杂和困惑的方式教授的。在本书中，我旨在以一种既丰富知识又实用的方式向你介绍
    AI 的奇妙世界，让你能够轻松理解并使用这一不可思议的工具。


    ## AI、机器学习与深度学习，天哪


    AI、机器学习和深度学习听起来像是复杂的术语，但它们只是让机器变得更智能旅程中的步骤。这里是理解它们的简单方法：


    `Artificial Intelligence` 是一个大伞。它关乎制造能够像人类一样解决问题的机器。


    `Machine Learning` 是大伞下的一个步骤。它是教机器从数据中学习的方法，提高它们解决问题的能力。


    `Deep Learning` 更深。它使用被称为 `neural networks` 的东西帮助机器从海量数据中学习，就像我们大脑从经验中学习一样。


    AI 的影响无处不在。从我们购物时推荐可能喜欢的商品，到帮助医生比以前任何时候都早地诊断疾病，AI 正在改变。


    在书中，我会帮助你这位初级计算机科学家，用简单易懂的语言探索 AI 是如何工作的。我们将观察它是如何从数据中学习的，如何改变世界，甚至你可以如何开始自己玩
    AI。无论你是学生、老师还是仅仅出于好奇，这里都有你的内容。


    准备好了吗？让我们一起进入 AI 的世界，发现它不仅关乎未来的技术，更是我们今天生活的一部分。


    # 简史


    “人工智能”这个说法是由先驱性计算机科学家和认知科学家约翰·麦卡锡（John McCarthy）提出的。他在 1955 年提议 1956 年达特茅会议时使用了这个术语，这次会议被认为是人工智能领域的创立性事件。麦卡锡与马文·明斯基、克劳德·香农和内森·罗彻斯特组织了这次会议，探索让机器像人类一样推理的方法。


    ## 1956 年达特茅会议


    由于约翰·麦卡锡、马文·明斯基、内尼尔·罗彻斯特和克劳德·香农的努力，1956 年的达特茅会议被认为是人工智能作为一个独立领域出现的时刻。这次具有里程碑意义的聚聚集了来自数学、心理学、经济学和计算机科学等不同学科的人才，还促进了独特的跨学科合作，这成为了
    AI 研究的基石。


    在会议上，约翰·麦卡锡提出了“人工智能”这一术语，为一个新的研究领域有了名称和重点目标。达特茅会议的讨论概述了 AI 的巨大潜力，触及了成为该领域核心的方面，例如
    `neural networks`、自然语言处理以及对机器抽象能力和创造力的探索。这一事件不仅定义了该领域；它注入了一种持久的乐观主义，并设定了一个远见的研究议程，将塑造未来多年
    AI 的方向。


    达特茅会议期间确立的乐观主义和远见目标为建立 AI 研究的统一方向至关重要，激励了一代科学家在这一领域追求突破性工作。这次会议不仅提供了一个交流思想的论坛，还创造了一个具有共同使命的社区，推动了我们今天所所知的
    AI 的进步。


    人工智能（AI）的发展受到 1956 年达特茅会议之外的许多重大事件的塑造。这些里程碑标志着 AI 从理论概念向实际应用的演变，展示了该领域的动态特性。


    ## 图灵测试 (1950 年)


    艾兰·图灵（Alan Turing）是一位英国数学家和计算机科学家，他在《计算机器与智能》论文中提出了现在被称为 `Turing Test` 的方法。图灵测试
    是一种判断机器是否能够表现出与人类等同或无法区分的智能行为的方法。


    ### 图灵测试的结构


    原始的 `Turing Test` 形式涉及一个人类判官，他与一个人类和一个机器进行自然语言对话，两者都被隐藏在视野之外。对话通常通过文本界面进行，以防止判官从声音或外貌中推导出线索。判官的任务是确定哪个参与者是机器。如果判官无法根据回复一致地将机器与人类区分开，则机器被认为通过了测试。


    ### 意义与批评


    `Turing Test` 在人工智能领域既有影响力又充满争议。它将焦点从机器是否能思考转移到它们是否能表现得与人类无异，这指导了大部分 AI 的研究和开发。该测试的意义在于它早期认识到了语言和对话在智能中的重要性，预见了未来自然语言处理和对话式
    AI 的发展。


    然而，`Turing Test` 在几个方面面临批评：


    - 简单性：批评者认为，模仿人类对话的能力并不涵盖人类认知能力的全部范围，例如情感理解、道德推理以及创造或创新的能力。

    - 欺骗性：该测试本质上衡量的是机器的欺骗能力——它假装成人类的能力，而不是真正的智能或理解。

    - 人类中心主义：该测试基于人类的智能标准，可能限制了我们对机器或其他实体可能表现出的非人类智能形式的理解。


    ### 遗产与现代解释


    尽管存在局限性，`Turing Test` 仍然是 AI 哲学和认知科学中的一个里程碑式概念。它继续激发关于智能本质、人机交互的未来以及创造有一天可能通过测试的机器的伦理影响的讨论。在现代，虽然很少有
    AI 系统是专门为通过 `Turing Test` 而设计的，但其底层挑战——创造能够理解和生成类人类响应的机器——驱动了自然语言处理、聊天机器人和对话代理的大部分研究。


    ## LISP 的发展 (1958 年)


