  md: "# APPENDIX C Creating an HPO service with Kubeflow Katib\n\nAlgorithm in Detail\
    \ (mng.bz/BIV0). You can also add your own HPO algorithm to Katib, which we will\
    \ discuss in section C.5.\n\nParallelTrialCount, maxTrialCount, and maxFailedTrialCount;\
    \ are self-explanatory by their names, define how the trials are scheduled for\
    \ experimentation. In this example, we run three trials in parallel, with a total\
    \ of 12 trials. The experiment stops if we have three failed trials.\n\nThe parameters\
    \ config define the hyperparameters to tune and value your search space. Katib\
    \ selects hyper values in the search space based on the parameter tuning you specified.\
    \ See the following code:\n\n```\nalgorithm:\n  algorithmName: bayesianoptimization\n\
    \  algorithmSettings:\n    name: \"random_state\"\n    value: \"10\"\n  parallelTrialCount:\
    \ 3\n  maxTrialCount: 12\n  maxFailedTrialCount: 3\nParameters:\n  name: lr\n\
    \    parameterType: double\n    feasibleSpace:\n      min: \"0.01\"\n      max:\
    \ \"0.03\"\n  name: num-layers\n    parameterType: int\n    feasibleSpace:\n \
    \     min: \"5\"\n  name: optimizer\n    parameterType: categorical\n    feasibleSpace:\n\
    \      list:\n        - sgd\n        - adam\n        - ftrl\n```\n\n![](img/9dbecddeac1b6cad2e240ace2b0d4b22_335_0.png)\n\
    \n![](img/9dbecddeac1b6cad2e240ace2b0d4b22_335_1.png)\n\n# LAST SECTION: TRIAL\
    \ CONFIGURATION\n\nIn this trial config, we define what training code (Docker\
    \ image) to execute and what hyperparameters are passed to the training code.\
    \ Katib has built-in jobs for every model framework—such as TensorFlow, PyTorch\
    \ MXNet job types, and more—takes care of the actual training execution in Kubernetes.\n\
    \nFor example, if we want to run distributed training in an HPO trial for a PyTorch\
    \ training code, which requires setting up a distributed group, we can define\
    \ the trial as a PyTorch job. Katib will run the distributed training for you.\n\
    \nIn the following example, we define the trial as the default job type Kubernetes\
    \ Job. In the experimentation, Katib will run the trial as a Kubernetes pod, using\
    \ no special customized configuration for the training code; see the code as follows:"
