    # 2.2.5 Internal dataset storage


    The internal storage of the sample service is simply a list of in-memory dataset
    objects. Earlier we talked about how a dataset can be both dynamic and static.
    On one hand, a dataset is a logical file group, changing dynamically as it continuously
    absorbs new data from a variety of sources. On the other hand, it''s static and
    reproducible for training.


    To showcase this concept, we design each dataset containing a list of commits
    and a list of versioned snapshots. A commit represents the dynamically ingested
    data: data added by a data ingestion call (CreateDataset or UpdateDataset); a
    commit also has tags and metadata for annotations. A versioned snapshot represents
    the static training data, which produced by the training dataset request (PrepareTrainingDataset),
    is converted from a list of selected commits. Each snapshot is associated with
    a version; once the dataset is built, you can use this version string to fetch
    the corresponding training data (FetchTrainingDataset) at any time to reuse. Figure
    2.13 visualizes the internal structure of a dataset.


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_75_0.png)


    Figure 2.13 An internal dataset storage overview. A dataset contains two types
    of data: commits for the ingested data and versioned snapshots for the training
    dataset. The dataset metadata and URLs are stored in the dataset management service,
    and the actual data is stored in the cloud object storage service.'
