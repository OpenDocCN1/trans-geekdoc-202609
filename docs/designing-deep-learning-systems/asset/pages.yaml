    # 6.2 Common model serving strategies


    Before we review the common model serving case and prediction service designs
    in 6.3, let us first check out the three common model serving strategies: direct
    model embedding, model service, and model server. No matter what you need to do
    for your specific use cases, you can usually take one of the following approaches
    to build your prediction service.


    # 6.2.1 Direct model embedding


    Direct model embedding means loading the model and running model prediction inside
    the user application''s process. For example, a flower identity-mobile app can
    load an image classification model directly in its local process and predict plant
    identity from the photos. The entire model loading and serving happen within the
    model app locally (on the phone), without talking to other processes or remote
    servers.


    Most user applications, like mobile apps, are written in strictly typed languages,
    such as Go, Java, and C#, but most deep learning model code is written in Python.
    It is therefore difficult to embed model code into application code and, even
    if you do, the process can become costly. To facilitate model prediction across
    Additionally, TensorFlow offers Java (https://github.com/tensorflow/java) and
    JavaScript (https://github.com/tensorflow/js) libraries for loading and executing
    models directly from Java or JavaScript applications.


    Another disadvantage of direct embedding is resource consumption. If the model
    runs on client devices, without high-end devices may not have a good experience.
    Running big deep learning models requires a lot of computation, and this can cause
    slower apps.


    Lastly, direct embedding involves model serving code with application business
    logic, which poses a challenge for backward compatibility. Therefore, because
    it is rarely used, we only describe it briefly.


    # 6.2.2 Model service


    Model service refers to running model serving on the server side. For each model,
    version of a model, or each type of model, we build a dedicated web service for
    it. This web service exposes the model prediction API over HTTP or gRPC interfaces.'
