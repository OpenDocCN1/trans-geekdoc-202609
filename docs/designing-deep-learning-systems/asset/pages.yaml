  md: '# 1.1 The deep learning cycle


    PRODUCTIONIZATION MLOPS (5)

    Productionization, also called “shipping to production,” is the process of making
    a product production worthy to be consumed by its users. Production worthiness
    is commonly defined as being able to serve customer requests, withstand a certain
    level of request load, and gracefully handle adverse situations such as malformed
    input and request overload. Production worth includes postproduction efforts,
    such as continuous metric monitoring and evaluation, feedback gathering, and model
    retraining.


    Productionization is the most engineering-intensive part of the development cycle
    because we''ll be converting prototyping experiments into serious production processes.
    A nonexhaustive to-do list of productionization can include


    +   - Building a data pipeline to pull data from data sources repeatedly and keep
    the dataset versioned and updated.

    - Building a data pipeline to preprocess dataset, such as data enhancement and
    enriching with external labeling tools.

    - Refactoring and dockerizing the prototyping code to production-quality model
    training code.

    - Making the result of training and serving codes reproducible by versioning and
    tracking the inputs and outputs. For, we could enable the training code to report
    the training metadata (training date and time, parameters) and model metadata
    (performance metrics, data, and code used) to ensure the full transparency of
    every model training.

    - Setting up continuous integration (Jenkins, GitLab CI) and continuous deployment
    to automate the code building, validation, and deployment.

    - Building a continuous model training and evaluation pipeline so the model training
    can automatically consume the latest dataset and produce models in a repeatable,
    auditable, and reliable manner.

    - Building a model deployment pipeline that automatically releases models that
    have passed the quality gate, so the model serving component can access them;
    async or real-time model prediction can be performed depending on the business
    requirements. The model serving component hosts the model and exposes it via a
    web API.

    - Building continuous-monitoring pipelines that periodically assess the dataset,
    and model serving performance to detect potential feature drift (data distribution
    change) in dataset or model performance degradation (concept drifting) and alert
    developers or retrain the model.


    These days, the productionization step has a new alias with buzz: MLOps (machine
    learning operation), which is a vague term, and its definition is ambiguous for
    researchers and professionals. We interpret MLOps to mean bridging the gap between
    model development (experimentation) and operations in production environments
    (Ops)'
  merge: -1
  img_proc: true
