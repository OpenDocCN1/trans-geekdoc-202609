  md: '# Model serving design


    +   This chapter covers

    - Defining model serving

    - Common model serving challenges and approaches

    - Designing model serving systems for different user scenarios


    Model serving is the process of executing a model with user input data. Among
    all the activities in a deep learning system, model serving is the closest to
    the end customers. After all the hard work of dataset preparation, training algorithm
    development, hyperparameter tuning, and testing results in models is completed,
    these models are presented to customers by model serving services.


    Take speech translation as an example. After training a sequence-to-sequence model
    for voice translation, the team is ready to present it to the world. For people
    to use this model remotely, the model is usually hosted in a web service and exposed
    by a web API. Then we (the customers) can send our voice audio file over the web
    API and get back a translated voice audio file. All the model loading and execution
    happens at the web service backend. Everything included in this workflow—service,
    model files, and model execution—is called model serving.'
  merge: -1
  img_proc: true
