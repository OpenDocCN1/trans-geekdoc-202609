    METADATA FOR PIPELINE

    A pipeline or workflow is needed when we want to automate a multiple-step model
    training task. For example, we can use workflow management tools like Airflow,
    Kubeflow, or Metaflow to automate a model training process that contains multiple
    functional steps: data collection, feature extraction, dataset augmentation, and
    model deployment. We will discuss workflow in detail in the next chapter.


    For pipeline metadata, we usually track the pipeline execution history and the
    pipeline input and output. This data can provide audit information for future
    troubleshooting.


    NOTE Deep learning projects vary a lot. The model training code is dramatically
    different for voice recognition, natural language processing, and image generation.
    There are many factors to specify the project, such as the size/type of the dataset,
    the ML model, and input artifacts. Beside the sample metadata mentioned previously,
    we recommend to define and collect the metadata based on your project. When you
    are looking for data that helps model reproducing and troubleshooting, the metadata
    data list will come to you naturally.


    # 8.2.2 Why manage metadata?


    Metadata is normally instrumented or recorded in the form of logs or metrics,
