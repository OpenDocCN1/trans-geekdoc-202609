    # 1.1.4 Scaling project development


    As you saw in 1.1.2, we need to fill seven different roles to complete a deep
    learning project. The cross-functional collaboration between these roles happens
    at every step. For example, data engineers, platform developers, and data scientists
    work together to productionize a project. Anyone who has been involved in a project
    requires many stakeholders knows how much communication and coordination are required
    to keep a project like this moving forward.


    These challenges make deep learning development hard to scale because we either
    don''t have the resources to fill all the required roles or we meet the product
    timeline due to the communication costs and slowdowns. To reduce the amount of
    operational work, communication, and cross-team coordination costs, companies
    are investing in machine learning infrastructure and reducing the number of people
    and the scope of knowledge required to build a machine learning project. The goal
    of a deep learning infrastructure stack is not only to automate model building
    and data processing but also to make it possible to merge the technical roles
    autonomously within a project.


    A key indicator of a deep learning system is to see how smooth the model productionization
    process can be. With a good infrastructure, the data scientist, is not expected
    to suddenly become an DevOps or data engineer, should be able to implement models
    in a scalable manner, set up data pipelines, and deploy monitor models in production
    independently.


    By using an efficient deep learning system, data scientists will be able to complete
    the development cycle with minimal additional overhead—less communication and
    less time waiting by others—and focus on the most important data science tasks,
    such as understanding the data and experimenting with algorithms. The ability
    to scale deep learning project is the true value proposition of a deep learning
    system.


    # 1.2 Deep learning system design overview


    With the context of 1.1 in mind, let''s dive into the focus of this book: the
    deep learning system itself. Designing a system—any system—is the art of achieving
    goals under a set of constraints that are unique to your situation. This is also
