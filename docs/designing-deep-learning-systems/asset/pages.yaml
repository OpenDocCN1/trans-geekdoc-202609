  md: 'LSTM). Their model data also varies; yet classification models require embedding
    files to encode input text whereas CNN models don''t require embedding files.
    The differences present many challenges to finding a low-maintenance, low-cost,
    and unified-serving approach.


    Building a model server approach is difficult, it is definitely possible. Many
    open source model server libraries and services—such as TensorFlow, TorchServe,
    and NVIDIA Triton Inference Server—offer model server solutions. We simply need
    to build customized integration logic to incorporate these tools into our existing
    systems to solve business needs—for example, integrating TorchServe into our model
    storage, monitoring, and alerting server.


    From a model deployment perspective, the model server is a black-box approach.
    As long as we save the model file following the model server standards, the prediction
    should function when we upload the model-to-model through its management API.
    The complexity of model serving implementation and maintenance can be greatly
    reduced. We will use a model server design and use case in 6.3.3 and a code example
    with TorchServe in chapter 7.


    > NOTE Should always consider a model server approach? Not Always. If we don''t
    think of development and maintenance cost, the model server is the most powerful
    it''s designed to cover all types of models. But if we care about model serving
    efficiency—and we should—the ideal approach depends on the use cases. In the next
    section, we will discuss the common model serving use cases and the applied design.


    # 6.3 Designing a prediction service


    A common mistake in software design is aiming to build an omnipotent system without
    considering the concrete user scenario. Overdesign will redirect our focus from
    the immediate customer needs to the features that might be useful in the future.
    As a result, the system either takes an unnecessarily long time to build or is
    difficult to use. This is especially true for model serving.


    Deep learning is an expensive business, both in terms of human and computational
    resources. We should build the necessities to move models into production as quickly
    as possible and minimize the operation costs. To do so, we need to begin with
    user scenarios.


    In this section, we will present three typical model serving scenarios, from simple
    to complex. For each case, we explain the scenario and illustrate a high-level
    design. By reading the following three subsections sequentially, you will see
    how the prediction service''s design evolves when use cases become more and complicated.


    > NOTE The goal of prediction service design is not to build a powerful system
    that works for various models but to build a system that suits the circumstances
    in a cost-efficient manner.'
