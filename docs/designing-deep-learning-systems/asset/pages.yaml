    function? Figure 5.11 demonstrates the process.


    # Objective function


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_172_0.png)


    Figure 5.11 An objective function receives the hyperparameters as input and returns
    a score.


    For an HPO algorithm, such as Bayesian search, to generate a hyperparameter suggestion
    that the next trial works better, it needs to know how the previous HPO trial
    operated. Therefore, the HPO algorithm requires that we define a function to score
    each trial and continue minimizing or maximizing the return value of the function
    (score) in the subsequent trials. We named this the objective function.


    In figure 5.11, we see that an objective function receives hyperparameters as
    input and returns a value, or score. The objective function executes the model
    training with given hyperparameters and evaluates the output model when the training
    completes.


