  md: "# CHAPTER 9 Workflow orchestration\n\nMetaflow lets annotate a Python code—a\
    \ DAG Python class—to define the workflow. The Metaflow library then/creates the\
    \ workflow automatically from the Python annotations. With Metaflow annotation,\
    \ Vena can build a workflow without changing any of her prototyping code.\n\n\
    Besides workflow creation and testing, Metaflow offers other features that are\
    \ key to model reproducibility, as workflow/steps versioning and input/output\
    \ saving. To learn more about Metaflow, you can check out Metaflow's official\
    \ website (https://docs.metaflow.org/) and a great Metaflow, Effective Data Science\
    \ Infrastructure, by Ville Tuuos (Manning, 2022; https://www.manning.com/books/effective-data-science-infrastructure).\n\
    \n# A TYPICAL CASE\n\nLet's use Metaflow to automate the same data process we\
    \ work in sections 9.3.1 and 9.3.2. See the following listing for the pseudocode.\n\
    \n+   Listing 9.3 A sample Metaflow workflow\n\n```\n# workflow DAG in a python\
    \ class\nclass DataProcessWorkflow(FlowSpec):\n\n    @def \"source\" as an input\
    \ parameter for the workflow\n    datasource = Parameter(\n        \"datasource_path\"\
    , help=\"the data storage location for data process\"\n        required=True\n\
    \    )\n\n    @step\n    def start(self):\n        # The parameter \"self.data_source\"\
    \ are available in all steps.\n        self.newdata_path = dataUtil.fetch_new_data(self.data_source)\n\
    \n        self.next(self.transform_data)\n\n    @step\n    def transform_data(self):\n\
    \        self.new_data = dataUtil.convert(self.newdata_path)\n\n        # out\
    \ to two parallel branches after data transfer.\n        self.next(self.save_to_db,\
    \ self.notify_data_science_team)\n\n    @step\n    def save_to_db(self):\n   \
    \     dataUtil.store_data(self.new_data)\n        self.next(self.join)\n\n   \
    \ @step\n    def notify_data_science_team(self):\n        slackUtil.send_notification(messageUtil.build_message(self.new_data))\n\
    \n        self.next(self.join)\n\n# join the two parallel branches steps\n# notify_data_science_team\
    \ and save_to_db\n```\n\nUpload by >> dr-notes.com"
