- pgno: 10
  md: '# foreword


    A deep learning system can be assumed to be efficient if it can bridge two different
    worlds—research and prototyping with production operations. Teams who design such
    systems must be able to communicate with practitioners across these two worlds
    and work with the different sets of requirements and constraints that come from
    each. This requires a principled understanding of how the components in deep learning
    systems are designed and how they are expected to work in tandem. Very little
    of the existing literature covers this aspect of deep learning engineering. This
    information de–d gap becomes an issue when junior software engineers are onboarded
    and expected to become effective deep learning engineers.


    Over the years, engineering teams have filled this void by using their acquired
    experience and figuring out what they need to know from the literature. Their
    work has helped traditional software engineers build, design, and extend deep
    learning systems in a relatively short amount of time. So it was with great excitement
    that I learned that Chi and Donald, both of whom have led deep learning engineering
    teams, have taken the very important initiative of consolidating this knowledge
    and sharing it in the form of a book.


    We are long overdue for a comprehensive book on building systems that support
    bringing deep learning from research and prototyping to production. Designing
    Deep Learning Systems finally fills this need.


    The book starts with a high-level introduction describing what a deep learning
    system is and does. Subsequent chapters discuss each system component in detail
    and provide motivation and insights about the pros and cons of various design
    choices.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# FOREWORD


    Each chapter ends with an analysis that helps readers assess the most appropriate
    and relevant options for their own use cases. The authors conclude with an in-depth
    discussion, pulling from all previous chapters, on the challenging path of going
    from research and prototyping to production. And to help engineers put all these
    ideas into practice, they have created a sample deep learning system, with fully
    functional code, to illustrate core concepts and offer a taste to those who are
    just entering the field.


    Overall, readers will find this book easy to read and navigate while bringing
    their understanding of how to orchestrate, design, and implement deep learning
    systems to a whole new level. Practitioners at all levels of expertise who are
    interested in designing effective deep learning systems will appreciate this book
    as an invaluable resource and reference. They will read it once to get the big
    picture and then return to it again and again when building their systems, designing
    their components, and making crucial choices to satisfy all the teams that use
    the systems.


    > SILVIO SAVARESE, EVP, Chief Scientist, Salesforce GAMING XIONG, VP, Salesforce'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# preface


    A little more than a decade ago, we had the privilege of building some early user-facing
    product features that were powered by artificial intelligence. It was a huge undertaking.
    Collecting and organizing data that would be fit for model training was not a
    usual practice at that time. Few machine learning algorithms were packaged ready-to-use
    libraries. Performing experiments required running management manually and building
    out custom workflows and visualizations. Custom servers were made to serve each
    type of model. Outside of resource-intensive tech companies, almost every single
    new AI-powered product feature was built from scratch. It was a far-reaching dream
    that intelligent applications would one day become a commodity.


    After working with a few AI applications, we realized that we had been repeating
    a similar ritual each time, and it seemed to us that it made more sense to design
    a systematic way, for prototyping, for delivering AI features to production. The
    fruit of this effort was PredictionIO, an open source suite of framework software
    that put together state-of-the-art software components for data collection and
    retrieval, model training, and serving. Fully customizable APIs and deploying
    as services with just a few commands, it helped shorten the time required at every
    stage, from running data science experiments to training and deploying productionready
    models. We were thrilled to learn that developers around the world were able to
    use PredictionIO to make their own AI-powered applications, resulting in some
    amazing boosts to their businesses. PredictionIO was later acquired by Salesforce
    to tackle a similar problem on an even larger scale.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# PREFACE


    By the time we decided to write this book, the industry was thriving with a healthy
    AI software ecosystem. Many algorithms and tools have become available to tackle
    use cases. Some cloud vendors such as Amazon, Google, and Microsoft even provide,
    hosted systems that make it possible for teams to collaborate on experimentation,
    prototyping, and production deployments at any centralized location. No matter
    what your goal is, you now have many choices and numerous ways to put them together.


    Still, with teams to develop deep learning-product features, there have been some
    recurring questions. Why is our deep learning system designed the way it is? Is
    this the best design for most specific use cases? We noticed junior software engineers
    were the ones most asking these questions, and we interviewed a few of them to
    find out why. They revealed that their conventional engineering training did not
    prepare them to work effectively with deep learning systems. When they looked
    for learning resources, they found only scant and scattered information on specific
    system components, software components, why they were put together the way they
    were, and how they worked together to form a complete system.


    To address this problem, we started a knowledge base, which eventually evolved
    into manual-like learning material explaining the design principles of each system
    component, the pros and cons of the design decisions, and the rationale from both
    technical and product perspectives. We told that our material helped to quickly
    ramp up new teammates allowed traditional software engineers with no prior experience
    in building deep learning systems to get up to speed. We decided to share this
    learning material with a much larger audience, in the form of a book. We contacted
    Manning, and the rest was history.'
  merge: -1
  img_proc: true
