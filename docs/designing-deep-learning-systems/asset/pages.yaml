  md: 'To obtain workable training speeds, we really need to train models distributedly
    on multiple GPUs. So, in the next section, we will introduce a more production-like
    approach: pipeline parallelism. It can train a large model distributedly with
    impressive training speed.


    # 4.4.2 Pipeline model parallelism


    In section 4.2, we discussed the most commonly used training method: data parallelism.
    This approach keeps a copy of the whole model on each device and partitions data
    into multiple devices. Then it aggregates the gradients and updates the model
    in each training step. The whole approach of data parallelism works well, as long
    as the entire model can be loaded into one GPU. As we see in this section, however,
    we are not always able to do this. And is where pipeline parallelism can be useful.
    In this section, we will learn about pipeline parallelism, a training that trains
    large models distributedly on multiple GPUs.


    To understand pipeline parallelism, let''s first take a brief look at model parallelism.
    This little detour will make the jump to pipeline parallelism easier.


    # MODEL PARALLELISM


    The idea of model parallelism is to split a neural network into smaller subsets
    and run each subnet on different GPUs. Figure 4.6 illustrates the model parallelism
    approach.


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_147_0.png)


    Figure 4.6 Split a four-layer, fully connected deep learning network into four
    subgroups; each has one layer, and each subgroup runs on one GPU.


    Figure 4.6 visualizes the model parallelism process. It first converts a neural
    (four layers) into four sub-networks (single layer) and then assigns each single-layer
    network a dedicated GPU. By doing so, we run a model distributedly on four GPUs.

    The concept of model parallelism is straightforward, but the actual implementation
    can be tricky; it depends on the architecture of the network. To give you an idea,
    the following listing is a piece of dummy PyTorch code that makes network run
    on two GPUs.'
