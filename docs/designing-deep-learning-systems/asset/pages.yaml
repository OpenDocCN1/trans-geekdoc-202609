    in 7.2, applying the six steps we just reviewed:


    +   1 The user sends an intent prediction request with model ID A to the web interface.

    2 The web interface calls the predictor connection manager to serve this request.

    3 The predictor connection manager queries the metadata store to get model metadata
    by searching model IDs that equal A; the returned model metadata contains the
    model algorithm type and model file URL.

