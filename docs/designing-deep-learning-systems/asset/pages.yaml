- pgno: 344
  md: '# C.4 Katib system design


    the hyperparameters defined in the training job. The training trials for Alex''s
    HPO experiment will be run by a PyTorch training operator because his coding is
    written in PyTorch.


    # STEP 5: RETURN TRIAL RESULT


    As the model training begins, the metric collector sidecar (a Docker container
    in a Kubernetes pod) collects training metrics and reports them to the Katib storage
    (a MySQL database) in step 5. Using these metrics, the trial controller (component
    C) updates the trial execution to the trial CRD. When the experiment controller
    notices the latest changes on the trial CRD, it reads the change and updates the
    experiment CRD object, so the experiment has the latest status. The latest status
    is aggregated into the experiment object in this way.


    The HPO workflow is essentially a trial loop. To work on Alex''s HPO request in
    Katib, steps 2, 3, 4, and 5 in this workflow keep repeating until the exit criterion
    is met. Alex can check the experiment CRD throughout the HPO execution to obtain
    the timely execution status of the HPO, which includes the number of completed
    or failed trials, the model training metrics, and the current hyperparameter values.


    > Simplicity and reliability are two major benefits of using CRD objects to store
    HPO execution data. First, the information on the experiment''s status can be
    accessed easily. For example, you can use Kubernetes commands, as kubectl describe
    experiment [trial suggestion], to get the intermediate data and the latest status
    of experiments, trials, and suggestions in a few seconds. Second, CRD objects
    help improve the reliability of HPO experiments. When the Katib service is down
    or the training operator fails, we can resume the HPO execution from where it
    failed, because these CRD objects retain the HPO execution history.


    # C.4.3 Kubeflow training operator for distributed training


    Katib''s default training operator—Kubernetes job operator—only supports single-pod
    training; it launches a Kubernetes pod for each trial in an experiment. To support
    distributed training, Katib works with Kubeflow training operators (https://www.kubeflow.org/docs/components/training/).
    You can see how this works in figure C.4.


    An HPO experiment consists of trials. Katib creates a trial CRD and a TrialJob
    CRD object for each trial. The trial CRD contains the HPO trial metadata, as suggested
    hyperparameter values, worker numbers, and exit criteria. In the TrialJob CRD,
    trial metadata is reformatted so that Kubeflow training operators can understand
    it.


    +   PyTorchJob and TFJob are two of the most commonly used CRD types for TrialJobs.
    They can be processed by TensorFlow training operators and PyTorch training operators,
    each of which supports distributed training. When Alex sets the number of'
