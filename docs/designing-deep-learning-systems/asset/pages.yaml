  md: '# A deep learning system should be humancentric


    When we introduce a general-purpose tool—like workflow orchestration—to deep learning
    systems, don''t be satisfied with only enabling the functionality. To reduce human
    time in the system. Customization is always possible to help our users be more
    productive.


    Metaflow (section 9.3.3) is a good example of what happens when engineers aren''t
    satisfied with just building an orchestration system to automate deep learning
    workflows. Instead, they went a step further to optimize the workflow construction
    and management to address the way data scientists work.


    # 9.2 Designing a workflow orchestration system


    In this section, we will approach the design of workflow orchestration systems
    in three steps. First, we use a typical data scientist scenario to show how an
