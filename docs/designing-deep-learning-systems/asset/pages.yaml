- pgno: 188
  md: '# 6.2 Common model serving strategies


    The model service manages the full life cycle of model serving, including fetching
    the model file from the model artifact store, loading the model, executing the
    model algorithm for a customer request, and unloading the model to reclaim the
    server resources. Using the documents classification use case as an example, to
    automatically documents in images and PDF by their content, we can train a CNN
    model for OCR (optical character recognition) to extract text from document images
    or PDF. To serve this model in a model service approach, we build a web service
    exclusively for this CNN model, and the web API is only designed for this CNN
    model''s prediction function. Sometimes we need a dedicated web service for each
    model version update.


    The common pattern of model serving is to build the model serving logic into a
    Docker image and use gRPC or HTTP interface to expose the model''s prediction
    function. For service setup, we can host multiple instances and enable a balancer
    to distribute prediction requests to these instances.


    The biggest advantage of the model service approach is simplicity. We can easily
    convert a model training to a model serving container because essentially, a model
    prediction execution running the trained neural network. The model training code
    can turn into a prediction service quickly by adding an HTTP or gRPC interface
    and setting the neural network evaluation mode. We will see model service''s design
    and use in cases 6.3.1 and 6.3.2 and a concrete example in chapter 7.


    Because model serving is specific to the model algorithm, we need to build services
    for different model types or versions. If you have several different models to
    serve, this service-per-model approach can spawn many services, and the maintenance
    for these services—such as patching, deploying, and monitoring—can be exhausting.
    If you are facing this situation, the model server approach is the right choice.


    # 6.2.3 Model server


    The model server approach is designed to handle multiple types of models in a
    black-box manner. Regardless of the model algorithm and model version, the model
    server can operate these models with a unified web prediction API. The model server
    is the next stage; no longer need to make code changes or deploy services with
    a new type of model or version of the model. This saves a lot of development and
    maintenance work from the model service approach.


    Yet, the model server approach is lot more complicated to implement and manage
    than the model service approach. Handling model serving for various types of models
    in one service and one unified API is complicated. The model algorithms and model
    data are different; their predict functions are also different. For example, an
    image classification model can be trained with a CNN network, whereas a text classification
    model can be trained with a long short-term memory (LSTM) network. Their input
    data is different (text vs. image), and their algorithms are different (CNN vs.'
  merge: -1
  img_proc: true
