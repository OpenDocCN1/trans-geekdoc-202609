- pgno: 250
  md: '# 8.2 Metadata in a deep learning context


    The answer is yes. As engineers, we can build a system that retains the experimental
    metadata and artifacts that data scientists need to reproduce and compare models.
    If we design this storage and retrieval system well, with proper metadata management,
    data scientists can easily select the best model from a series of experiments
    or figure out the root cause of model degradation without a deep understanding
    of the system.


    In previous chapters, we''ve learned about designing services to serve and serve
    models. Here we turn our attention to the metadata and artifacts management system
    that facilitates two more key operations: troubleshooting and comparing experiments.


    We will start this chapter with an introduction to artifacts and metadata and
    the meaning of these concepts in the context of deep learning. Then we will show
    how to design metadata management systems using examples and emphasizing design
    principles. Finally, we will discuss two open source metadata management systems:
    MLMD (ML Metadata) and MLFlow. By reading this chapter, you will gain a clear
    vision of how to manage metadata and artifacts to facilitate experiment comparison
    and model troubleshooting.


    # 8.1 Introducing artifacts


    People often assume that an artifact in deep learning is the model produced by
    the model training process. This is partially true. Artifacts are actually the
    files and objects that form the inputs and outputs of the components in the model
    training process. This is a crucial distinction, and it is important to keep this
    broader definition in mind if you want to engineer a system that supports model
    reproducibility.


    Under this definition, artifacts can include datasets, code, or any other number
    of objects used in a deep learning project. For example, the raw input training
    data, the labeled dataset produced from a labeling tool, and the results of a
    data processing pipeline.


    In addition, artifacts must be preserved with metadata that describes their facts
    and lineage to allow performance comparisons, reproducibility, and troubleshooting.
    In practice, artifacts are stored as raw files on a file server or cloud storage
    service, such as Amazon Simple Storage Service or Azure Blob Storage. We associate
    artifacts with their metadata in a metadata store on a separate storage service.
    See figure 8.1 for a diagram of how this arrangement typically looks.


    Figure 8.1 shows the common practice of managing artifacts. The artifact files
    are saved to a file storage system, and their file URLs are saved with other related
    metadata (such as model training execution ID and model ID) in the metadata store.
    This setup allows us—or data scientists—to search for a model in the metadata
    store and easily find all the input and output artifacts of the corresponding
    model training process.


    # 8.2 Metadata in a deep learning context


    In general terms, metadata is structured reference data that provides information
    about other data or objects, such as the nutrition labels on packaged food. In'
  merge: -1
  img_proc: true
