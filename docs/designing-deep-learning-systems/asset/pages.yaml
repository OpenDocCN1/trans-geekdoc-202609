- pgno: 301
  md: '# 10.2.1 Code componentization


    As in the previous section, it is common during prototyping for training data
    preparation, model training, and inference code to exist in a single notebook.
    To productionize them into a deep learning system, we need to split them as separate
    components. One approach to splitting the components, or code componentization,
    is shown in figure 10.5.


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_301_0.png)


    Figure 10.5 Componentizing code from a single notebook into multiple pieces that
    can be packaged separately. The first split happens where a trained model is the
    output. An optional second split happens when training data is the output.


    Let’s put the process in the figure into action. The first place to draw a line
    for separation in the code is where the model is the output. This should result
    in two pieces of code as follows:


    +   - Model training code that outputs a model

    - Model inference code that takes a model and an inference request as input to
    produce an inference


    Optionally, the model training code can be split as follows:


    +   - Training data transformation code, which takes raw data as input and output
    training data that can be consumed by model training code

    - Model training code, which takes training data and trains a model as its output


    If you have other model training code that will benefit from the same kind of
    prepared data, it is a good idea to perform this separation. Separation is also
    a'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# 10.2 Model productionization


    idea if your data preparation step needs to be executed on a different cadence
    as model training.


    # 10.2.2 Code packaging


    Once code components are separated cleanly, they are ready to be packaged for
    deployment. To be able to run them on a training service (chapter 3), model service
    (chapter 6), and workflow service (chapter 9), we first need to make sure they
    follow the conventions set by these services.


    Model training code should be modified to fetch training data from the location
    indicated by an environment variable set by the training service. A similar convention
    should be followed by other components.


    Model inference code should follow the convention of the model serving strategy
    of your choice:


    +   - If you use direct model embedding, work with the team that embeds your model
    to make sure your inference code works.

    - If you plan to serve your model with model service, make sure your inference
    code provides an interface with which the model service can communicate.

    - If you use a model server, you may not need model inference code as long as
    the model server can serve the model properly.


    We package these code components as Docker containers so that they can be launched,
    accessed, and tracked by their respective host services. An example of how this
    is done can be found in appendix A If special data transformation is needed, we
    can integrate data transformation into the data management service.


    # 10.2.3 Code registration


    Before training code and inference code can be used by the system, their packages
    must be registered and stored with the metadata and artifacts service. This provides
    the necessary link between the training code and the inference code. Let''s look
    at how they are related (figure 10.6).


    Once the training and inference codes are packaged as containers (the training
    container and inference container in the diagram), they can be registered with
    the metadata and artifacts using a common handle, such as visual_recognition in
    the example shown in figure 10.6. This helps system services find and use correct
    containers when they receive requests that provide the same name handle. We will
    continue walking through the figure in the next few sections.


    # 10.2.4 Training workflow setup


    We recommend setting up a training workflow even if you do not regularly train
    your model. The main reason is to provide reproducibility of the same model training
    flow in production. This is helpful when someone other than you needs to train
    a model and can use the flow that you set up. In some cases, the production environment
    is'
