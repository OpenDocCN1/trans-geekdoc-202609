- pgno: 56
  md: '# 2.1 Understanding dataset management service


    # PRINCIPLE 3: ADOPT A STRONGLY TYPED DATA SCHEMA


    A strongly typed schema is the key to avoiding unexpected failures caused by data
    changes. With schema enforcement, the DM service can guarantee that the raw data
    it ingests and the training data it produces are consistent with our specs.


    The strongly typed data schema acts as a safety guard to ensure the model training
    code does not get affected by the upstream data collection changes, and it also
    ensures backward compatibility for upstream and downstream clients of DM. Without
    schema protection, the dataset—downstream model training code—can easily be broken
    by upstream changes.


    Data schemas can be versioned as well, but this will add another layer of complexity
    to management. An additional option is to have one schema per dataset. When introducing
    new data changes, make sure that the schema update is backward compatible. If
    a new data requirement requires a breaking change, create a new dataset with a
    new schema instead of updating the existing one.


    # PRINCIPLE 4: ENSURE API CONSISTENCY AND HANDLE SCALING INTERNALLY


    The current trend in the deep learning field is architecture that keeps getting
    bigger as datasets continue to grow. For example, GPT-3 (a generative transformer
    model for language understanding) uses more than 250 TB of text materials with
    billions of words; in Tesla, the autonomous driving model consumes an immense
    amount of data at the petabyte scale. On the other hand, we still use small datasets
    (around 50 MB) for easy tasks in narrow domains, as customer support ticket classification.
    Dataset management systems should handle the data scaling challenges, and the
    API exposed to users (developers and data scientists) should be consistent for
    both large- and small-sized datasets.


    # PRINCIPLE 5: GUARANTEE DATA PERSISTENCY


    Ideally, datasets used for deep learning training should be stored immutably to
    reproduce training data and troubleshoot. Data removal should be soft deletions
    with only a few exceptions for hard deletions, such as deleting customer permanently
    when a user chooses to opt out of or cancel their account.


    # 2.1.3 The paradoxical character of datasets


    To close out our conceptual discussion on dataset management, we would like to
    clarify an uneasy aspect of datasets. We have seen dozens of poorly designed dataset
    management systems fail on this point.


    A dataset has a paradoxical trait: it is both dynamic and static. From a data
    scientist''s view, a dataset is static: it is a fixed set of annotations (also
    known as labels). From a developer''s view, a dataset is dynamic: it is a file-saving
    destination in a remote storage to which we keep adding data.


    So, from a DM perspective, a dataset should be a logic file group and satisfy
    both data collection and data training needs. To help you get a concrete understanding
    of how to accommodate both the dynamic and static nature of datasets, let''s look
    at figure 2.5.'
