  md: '# 6.3.1 Single model application


    Imagine building a mobile app that can swap people’s faces between two pictures.
    The consumer expects the UI to upload photos, select sources and target pictures,
    and execute the deepfake model (https://arxiv.org/abs/1909.11573) for swapping
    faces between the two selected images. For an application this only needs to work
    with one model, the serving approach can be either model serving (6.2.2) or direct
    model embedding (6.2.1).


    MODEL SERVICE APPROACH

    From the discussion in section 6.2.2, the model serving approach involves building
    a web service for each model. So we can build the face-swap model app with the
    following components: a front UI (component A) that runs on our phone; an application
    backend to handle user operation (component B); and a backend service, or predictor
    (component C), to host a deepfake model and expose a web API to execute the model
    for each face-swap request.


    When a user uploads a source image and a target image and clicks the face-swap
    button on the app, the mobile backend will receive the request and call the predictor’s
    web API for face-swapping. The predictor prees the user request data (images),
    executes the model algorithm, and postprocesses the model output (images) to the
