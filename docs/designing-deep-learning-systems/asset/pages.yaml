    see the prototyping phase and production phase are not smoothly connected. Shipping
    code to production is not straightforward; data scientists have to exert extra
    to construct a workflow The gap between prototyping code and production workflow
    jeopardizes development velocity for two reasons:


    +   - Workflow construction and debugging aren''t straightforward—Data scientists
    normally face a huge learning curve when training workflows in orchestration systems.
    Learning the workflow DAG syntax, workflow libraries, coding paradigms, and troubleshooting
    is a huge burden to data scientists. The workflow troubleshooting is the most
    painful part. The majority of the orchestration system does not support local
    execution, which means data scientists have to test their workflow in the remote
    orchestration system. This is both remote, so data scientists cannot easily find
    the root cause when a workflow execution goes wrong.


    +   - Workflow construction happens once but frequently—The common misconception
    is that workflow construction only happens once, it''s fine if it is time-consuming
    and cumbersome. But the fact is, workflow construction happens continuously because
    deep learning development is an iterative process. As 9.3 shows, data scientists
    work on prototyping and production experimentation iteratively, the workflow needs
    to be updated frequently to transition from local to production. Therefore, the
    unpleasant and time-consuming workflow construction happens repeatedly, which
    hinders the development velocity.


    # SMOOTHING THE TRANSITION FROM PROTOTYING TO PRODUCTION


    Although there gaps, the process in 9.3 is good. Data scientists start prototyping
    locally with a straightforward script, and they keep working on it. If the results
    after each iteration seem promising enough, the ''straightforward local script''
    is converted to a workflow and runs in the orchestration system.


    The key improvement is to make the transition step from prototyping code to a
    production workflow seamless. If an orchestration system is designed for deep
    use cases, it should provide help to data scientists build workflows from their
    code with minimum effort. For example, Metaflow, an open source library that will
    be discussed in 9.3.3, allows data scientists to authorize workflow by writing
