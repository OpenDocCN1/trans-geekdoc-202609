    After deep learning research, we proceed to prototyping. At this stage, we assume
    algorithms are ready to use for prototyping models. A rapid and iterative process
    of data exploration and experimental model training forms the central part of
    this step. The goal of this step is to find the appropriate training data shape
    and develop a stable codebase for model training.


    # 10.1.1 Research


    New deep learning algorithms are invented, and existing ones are improved through
    research. Because peer-reviewed research requires reproducible results, model
    training needs to be publicly accessible. Many public datasets, such as ImageNet
    for example, are available for researchers to use.


    The notebooking environment, such as JupyterLab, is a popular choice among researchers
    for prototyping model training due to its interactivity and flexibility. Let''s
    go through some sample steps that a researcher may take during model prototyping:


    +   1 Alice, a deep learning researcher, is working on improving a visual recognition
    algorithm. After working on her theories, she is ready to start prototyping.

    2 Alice creates a new notebook in JupyterLab.

    3 Alice wants to use the ImageNet dataset for training and benchmarking her algorithm.
    She may

    na Write code to download the dataset to her notebook and store it in the dataset
    management service (chapter 2) for reuse.

    b Find that the dataset is already stored in the dataset management service and
    write code to use it as is.

    4 Alice starts coding improvements on an existing visual recognition algorithm
    until it can produce experimental models locally within the notebook.

    5 Alice tries to change some hyperparameters, train and test a few experimental
    models, and compare the metrics that they generate.

    6 Alice may use further hyperparameter optimization techniques (chapter 5) to
    run more experiments automatically to confirm that she has indeed made improvements
    to the existing algorithm.

    7 Alice publishes her results and packages her training code improvement as a
    library for others to use.'
