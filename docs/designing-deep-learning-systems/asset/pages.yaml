  md: '# Designing a prediction service


    Prediction platform


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_196_0.png)


    Figure 6.7 A general prediction service (platform) design that works with arbitrary
    model types


    algorithm requirement. One example of this kind of unified API is the KFServing
    predict protocol (http://mng.bz/BIB2), which aims to standardize the prediction
    protocol that works for any models and various prediction backends.


    The web APIs are also expected to be simple, so we can reduce the customer onboarding
    and maintenance effort. The prediction APIs can be categorized into three buckets:
    model prediction requests API, model metadata fetching API, and model deployment
    API. The model metadata fetching and deployment API are very useful because they
    are about the model they are serving. We need these methods to check the model
    metadata, such as the model version and algorithm info, and to check the model
    deployment status.


    # ROUTING COMPONENT


    Normally, each type of serving backend can only handle a few types of models.
    To support arbitrary models, we need to have different kinds of serving backends,
    such as TensorFlow Serving backend for TensorFlow models and TorchServe backend
    for PyTorch models. When receiving a model request, the system needs to know which
    backend can handle it. This is done with the routing component.


    The routing component responds to the prediction request to the correct backend
    inference server. For a given request, the routing component fetches the model’s
    metadata; the metadata includes the model algorithm name and version, the model
    version, and the training framework. Then, by matching the model metadata with
    the routing config, it determines which inference backend it should route the
    prediction request.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# GRAPH EXECUTION COMPONENT


    The graph execution component handles the type of prediction that needs to execute
    a series of model predictions. For example, to automate the mortgage approval
    process, we have to run a loan prediction request following three models in a
    sequence: a PDF scanning model to parse the text from the PDF loan application,
    a named entity recognition model to recognize the keywords, and a loan-scoring
    model to score the loan application. To support such requirements, we can define
    a directed acyclic graph (DAG) to describe the model execution chain and build
    a graph execution engine to execute in one go.


    # INFERENCE SERVER


    The inference (model) server does the actual work to compute model prediction
    by managing model caching and model prediction execution. It''s similar to the
    prediction service shown in figure 6.6 but more sophisticated because it needs
    to support arbitrary model algorithms. Besides the predict API, the inference
    server should also offer model API to register new models and remove models programmatically.


    Building an inference server is much more complicated than building a predictor;
    not many engineers want to do that. Luckily, there are many black-box, open source
    approaches that work out of the box, such as TensorFlow Server, TorchServe, and
    NVIDIA Triton Inference Server. In practice, we often use these existing open
    inference servers and integrate them into our routing component and graph execution
    component. We will discuss more on the open model server tools in chapter 7.


    # APPLICATIONS


    In 6.7, we use applications A, B, and C are sharing the same model serving backend.
    The model serving for different applications occurs at the same place. Compared
    with the model design in figure 6.6, the prediction platform is more scalable
    and more cost-efficient because there is no onboarding cost to add new application
    D.


    For example, if we want to use onboard new application D—a voice-to-text scripting
    application—we need to upload the voice scripting model to the model file server
    and then let the application use the unified prediction API of the prediction
    platform. There is no code change on the prediction platform side for supporting
    a new application.


    # MODEL PREDICTION WORKFLOW


    After explaining each key component, let''s look at a typical model prediction
    workflow (6.7). First, we publish our model files to the model file server and
    update the config in the routing component, so routing component knows which inference
    server should route the prediction request for this type of model. Second, applications
    send prediction requests to the system web APIs, and the request is requested
    by the routing component to the correct inference server. Third,'
  merge: -1
