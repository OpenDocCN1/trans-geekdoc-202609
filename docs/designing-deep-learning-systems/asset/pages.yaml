  md: '# 1.1 The deep learning development cycle


    Why is shipping models to production difficult?

    The massive underlying infrastructure (tools, services, servers) and heavy cross-team
    collaboration are the two biggest hurdles for shipping models to production. This
    section on productionization (aka MLOps) establishes that data scientists need
    to work with data engineers, platform developers, DevOps engineers, and machine
    learning engineers, as well as learn massive infrastructure (deep learning system),
    to ship an algorithm/model from prototype to production. It''s no wonder that
    productionizing a model takes so much time.


    To solve these challenges, we need to abstract the complexity from data scientists
    when designing and building a deep learning system. As with building a car, we
    want to put data scientists behind the wheel without asking them to know much
    about car itself.


    Now, returning to the development cycle, you may notice there is *another inner
    loop (loop B)* in figure 1.1 that comes from Productionization (box 5) and Model
    to Product Initiation (box 1). This is the second vent with the product team before
    we integrate the model inference with an AI application.


    Our second loop (loop B) compares the model and data between prototyping and production.
    We want to ensure the model performance and scalability (for example, model serving
    capacity) match business requirements.


    NOTE The following two papers are recommended; if you want to learn more about
    MLOps, they are great starting points: "Operationalizing Machine Learning: An
    Interview Study" (arXiv:2209.09125) and "Machine Learning Operations (MLOps):
    Overview, Definition, and Architecture" (arXiv:2205.02302).


    # APPLICATION INTEGRATION (6)


    The last step of the product development cycle is to integrate the model prediction
    to the AI application. The common pattern is to host the models in the model serving
    service (which will be discussed in section 1.2.2) of the deep learning system
    and integrate the business logic with the model by sending prediction requests
    over the internet.


    As a sample user scenario, a chatbot interacts with the chatbot user interface
    by typing or voicing questions. When the chatbot receives input from the customer,
    it calls the remote model serving service to run a model prediction and then takes
    action or responds to the customer based on the model prediction result.


    Along with integrating model serving with application logic, this phase involves
    evaluating metrics important to the product, such as clickthrough rate and churn
    rate. Nice MLOps-specific metrics (good precision–recall curve) do not always
    guarantee the business requirement is met. So the business stakeholders often
    perform customer interviews and product metric evaluation at this stage.'
