    In this chapter, we will discuss the last critical piece of a deep learning system:
    workflow orchestration—a service that manages, executes, and monitors workflow
    automation. Workflow is an abstract and broad concept; it is essentially a sequence
    of operations that are part of some larger task. If you can devise a plan with
    a set of tasks to complete a work, this plan is a workflow. For example, we can
    define a sequential workflow for training a machine learning (ML) model. This
    workflow can be composed of the following tasks: fetching raw data, rebuilding
    the training dataset, training the model, evaluating the model, and deploying
    the model.


    Because workflow is an execution plan, it can be performed manually. For instance,
    a data scientist can manually complete the tasks of the model training'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# 9.1 Introducing workflow orchestration


    workflow we just described. For example, to complete the “fetching raw data” task,
    the data scientist can craft web requests and send them to the dataset management
    (DM) service to fetch a dataset—all with no help from the engineers.


    However, executing a workflow manually is not ideal. We want to automate the workflow
    execution. When there are numerous workflows developed for different purposes,
    we need a dedicated system to handle the complexity of workflow. We call this
    kind of system a workflow orchestration system.


    A workflow orchestration system is built to manage workflow life cycles, including
    workflow creation, execution, and troubleshooting. This provides not only the
    pulse to keep all the scheduled code running but also a control plane for data
    scientists to manage all the automation in a deep learning system.


    In this chapter, we will discuss workflow orchestration system design and the
    popular open source orchestration systems used in the deep learning field. By
    reading this chapter, you will not only gain a solid understanding of the system
    requirements and the design options, but you will also learn how to choose the
    right open source orchestration system that works best for your own situation.


    # 9.1 Introducing workflow orchestration


    Before we dive into the details of designing workflow orchestration systems, let’s
    have a quick discussion on the basic concept of workflow orchestration, especially
    about the workflow challenges from a deep learning/ML perspective.


    > NOTE the requirements of using workflow orchestration for deep learning projects
    and ML projects are almost identical, we will use the deep learning and machine
    learning interchangeably in this chapter.


    # 9.1 What is workflow?


    In general, a workflow is a sequence of operations that are part of some larger
    task. A workflow can be viewed as a directed acyclic graph (DAG) of steps.


    A step is the smallest remnant of computation that describes an action; this task
    could be fetching data or triggering a service, for example. A step either succeeds
    or fails as a whole. In this chapter, we use the word task and step interchangeably.


    A DAG defines the dependencies between steps and the order in which execute them.
    Figure 9.1 shows a sample workflow for training natural language processing (NLP)
    models.


    From the DAG in figure 9.1, we see a workflow that consists of many steps. Every
    step depends on another, and the solid arrows show the dependencies between steps.
    These arrows and steps form a workflow DAG with no loops.


    If you follow the arrows in the DAG (from left to right) and complete the tasks,
    you can train and release an NLP model to production. For example, when an incoming
    request triggers the workflow, the auth (authorization) step will be executed
    first, and then the dataset-building step and the embedding fetching step will
    both be executed'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# CHAPTER 9 Workflow orchestration


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_269_0.png)


    9.1 A DAG of a sample model workflow with multiple steps. Both ovals and diamonds
    are steps, different types. The solid arrows indicate the dependencies between
    steps, and dotted-line arrows represent the external web requests sent from steps.


    simultaneously. The steps on the other side of the arrows will be executed after
    these two steps have completed.

    Workflows are used everywhere in the IT industry. As long as you can define a
    process as a DAG of single steps/tasks, this process can be considered a workflow.
    Workflows are critical to deep learning model development. In fact, in production
    environments, most of the deep learning model-building activities are presented
    and executed as workflows.


    > NOTE A workflow should not have a loop. To guarantee a workflow can be completed
    under any condition, its execution graph needs to be a DAG, which prevents the
    workflow execution from falling into a dead loop.


    # 9.12 What is workflow orchestration?


    Once we define a workflow, the next step is to run the workflow. Running a workflow
    means executing the workflow steps based on the sequence defined in the workflow''s
    DAG. Workflow orchestration is the term we use to describe the execution and monitoring
    of the workflow.

    The goal of orchestration is to automate the execution of tasks defined in workflows.
    In practice, the concept of workflow orchestration often extends to workflow management
    as a whole—that is, creating, scheduling, executing, and monitoring multiple workflows
    in an automated manner.


    Why do deep learning systems need workflow orchestration? Ideally, we should be
    able to code an entire deep learning project as one piece. And that''s exactly
    what we do in the prototyping phase of a project, putting all the code in a Jupyter
    notebook. So, why do we need to transform the prototyping code into a workflow
    and run it in a workflow orchestration system? The answer is twofold: automation
    and work'
