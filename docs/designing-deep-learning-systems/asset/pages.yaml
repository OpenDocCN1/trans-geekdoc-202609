  md: '# 3.3 A model training service


    # 3.2.2 Dockerize model training code as a black box


    With the previously discussed training pattern in mind, we can view deep learning
    training code as a black box. No matter what model architecture and training algorithm
    a training implements, we can execute it the same way in a training service. To
    run the training code anywhere in the docker cluster and create isolation for
    each training execution, we can pack the training code and its dependent libraries
    into a Docker image and run it as a container (figure 3.4).


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_100_0.png)


    Figure 3.4 A training service launches a Docker container to perform model training
    instead of running the training code directly as a process.


    In 3.4, by Dockerizing the training code, the training service can execute a model
    training by simply launching a Docker container. Because the service is agnostic
    about what''s inside the container, the training service can execute all different
    code in this standard method. This is much simpler than letting the training service
    spawn to execute model training because the training service needs to set up the
    various environments and dependent packages for each training code. Another benefit
    of Dockerization it decouples the training service and training code, which enables
    data scientists and platform engineers to focus on model development and training
    execution performance, respectively.


    You may wonder how a training service communicates with training code if we are
    agnostic to each other. The key is to define a communication protocol; this protocol
    delineates parameters and their data format a training service passes to training
    code. These parameters include dataset, hyperparameters, model saving, metrics
    saving location, and more. We will see a concrete example in the next section.


    # 3.3 A sample model training service


