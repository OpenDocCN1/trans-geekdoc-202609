    # 2.3 Open source approaches


    If you are interested in employing open source approaches to set up dataset management
    functionality, we select two approaches for: Delta Lake and Pachyderm. Let’s look
    at them individually.


    # 2.3.1 Delta Lake and Petastorm with Apache Spark family


    In this approach, we propose to save data in a Delta Lake table and use the Petastorm
    library to convert the data to PyTorch and Tensorflow dataset objects. The-data
    can be consumed in training data seamlessly.


    # DELTA LAKE


    Delta Lake is a storage layer that brings scalable, ACID (atomicity, consistency,
    isolation, durability) transactions to Apache Spark and other cloud object stores
    (e.g., Amazon S3). Delta Lake is developed as open source by Databricks, a respected
    data and AI company.


    Cloud storage services, such as Amazon S3, are some of the most scalable and cost-effective
    storage systems in the IT industry. They are ideal places to build large data
    warehouses, however key-values store design makes it difficult to achieve ACID
    transactions and high performance. The metadata operations as listing objects
    are expensive, and consistency guarantees are limited.


    Delta Lake is designed to fill the previously discussed gaps. It works as a file
    system that stores and streaming data in object storage (such as Amazon S3). In
    addition, Delta Lake manages metadata, caching, and indexing for its table structure
    and schema enforcement. It provides ACID properties, time travel, and significantly
    faster metadata operations for tabular datasets. See figure 2.16 for the Delta
    Lake graph.


    The Delta Lake table is the core concept of the system. When dealing with Delta
    Lake, you are usually dealing with Delta Lake tables. They are like SQL tables;
    when you query, insert, and merge table content. Schema protection in Delta Lake
    is one of its advantages. It supports schema validation on table writing, which
    prevents data pollution. It also tracks table history, so you can roll back a
    table to any of its past stages (known as time).


    For building data processing pipelines, Delta Lake recommends naming your tables
    in three categories: bronze, silver, and gold. First, we use bronze tables to
    keep the raw input from different sources (which are not so clean). Then the data
    flows constantly from bronze tables to silver tables with data cleaning and transformation
    (ETL).'
