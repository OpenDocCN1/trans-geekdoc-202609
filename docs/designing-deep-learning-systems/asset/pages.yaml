  md: '# 5.3 Designing an HPO service


    modify training code to work with different HPO algorithms. The HPO service takes
    care of all of these tasks. The HPO service user, we just pass parameters into
    the service, and the service runs the HPO automatically and returns the optimal
    hyperparameters at the end. The service also takes care of autoscaling and failure
    recovery of failed trial jobs. Because of these advantages, the service approach
    is the dominant HPO approach in the deep learning production environment. Because
    you are familiar with HPO concepts and approaches, let''s look at how to design
    an HPO service and use HPO libraries in the next two sections.


    > NOTE HPO is not a one-time job. If training with a different dataset, you need
    to redo the HPO even if the model architecture didn''t change. If the dataset
    changes as well, the optimal model weights that fit best with the given data change
    as well, so you need a new HPO searching effort.


    # 5.3 Designing an HPO service


    Now that you have a good understanding of the HPO library approach, let''s review
    the HPO service approach. In this section, we will look at how to design an HPO
    service to support HPO for arbitrary model training in an automatic and black-box
    fashion.


    # 5.3.1 HPO design principles


    Before we look at the concrete design proposal, let''s first check out the five
    design principles for building an HPO service.


    # PRINCIPLE 1: TRAINING AGNOSTIC


    The HPO service needs to be agnostic to training code and model training frameworks.
    In addition to supporting arbitrary machine learning frameworks like TensorFlow,
    PyTorch, and MPI, we would like to be able to tune hyperparameters of training
    code written in any programming language.


    # PRINCIPLE 2: EXTENSIBILITY AND CONSISTENCY IN SUPPORTING DIFFERENT HPO ALGORITHMS


    From the HPO algorithms discussion in section 5.2.2, we know the hyperparameters
    search algorithm is the brain of the HPO process. The efficiency of the hyperparameter
    search decides the HPO performance. A good HPO algorithm can find optimal hyperparameters
    with a large hyperparameter number and search spaces in a small number of trials.


    Because HPO research is an active field, a new algorithm is published every few
    months. Our HPO service needs to integrate with these new algorithms easily and
    expose them as algorithm options to customers (data scientists). Also, the newly
    added algorithm should behave consistently with the existing algorithms in terms
    of user experience.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# PRINCIPLE 3: SCALABILITY AND FAULT TOLERANCE


    Besides HPO algorithms, another important responsibility of an HPO service is
    to manage the computing resources for HPO—the model training with hyperparameter
    values. From an HPO experiment perspective, we want distributed execution at both
    the experiment level and trial level. More specifically, we want to not run only
    trials in a distributed and parallel manner but also able to run a single training
    trial distributed—for example, running distributed training for the model training
    in one trial. From a resource utilization perspective, the system needs to support
    autoscaling, which allows the cluster size to be automatically adjusted to the
    current workload, so there is no aspect of over-utilization or over-provisioning.


    Fault tolerance is also another important aspect of HPO execution management.
    Fault tolerance is important because some HPO algorithms are required to execute
    sequentially. For example, trial 2 must happen after trial 1 because the algorithm
    needs the past hyperparameter values and results to reduce the hyperparameters
    before the next starts. In this case, when one trial fails—for example, because
    of a node restart or a network problem—the entire HPO fails. The system should
    recover from the previous failure. The common approach is to record the last state
    of each trial, so we can resume from the last recorded checkpoint.


    # PRINCIPLE 4: MULTITENANCY


    HPO process is essentially a set of model training executions. Similar to model
    training, HPO services must provide resource isolation for various users or groups.
    This will ensure that different user activities stay within their boundaries.


    # PRINCIPLE 5: PORTABILITY


    Nowadays, the concept of “cloud neutral” has become very popular. People want
    to run their model job in different environments—Amazon Web Services, Google Cloud
    Platform, and Azure—so the HPO service we need to builds de decouple from the
    underlying infrastructure. Running HPO service on Kubernetes is a good choice
    here.


    # 5.3.2 A general HPO service design


    Because the HPO workflow (figure 5.3) is standard and there are not many variations,
    the HPO system design (figure 5.9) can be applied to many of the HPO scenarios.
    It consists of three main components: an API interface, HPO job manager, and hyperparameter
    (HP) suggestion maker. They are marked as A, B, and C in figure 5.9).


    The API interface (component A) is the entrance point for submit HPO jobs. To
    start an HPO experiment, users submit an HPO request (step 1) to the interface;
    the request provides model code, such as a Docker image; hyperparameters and their
    search space; and an HPO algorithm.


    The HP suggestion maker (component C) is a wrapper/adapter for different HPO algorithms.
    It provides a unified interface for users to run each different HPO algorithm,
    so users can select an algorithm without worrying about the execution details.'
  merge: -1
  img_proc: true
