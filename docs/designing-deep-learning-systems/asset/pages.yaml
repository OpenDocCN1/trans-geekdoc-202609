  md: '# CHAPTER 10 Path to production


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_305_0.png)


    Figure 10.8 A typical production model serving setup. When inference requests
    arrive at the model service, the service looks for the inference container and
    model using the metadata and artifacts store to produce inference responses.


    # 10.2.6 Product Integration


    Once you get a proper inference response back from the model service, it is time
    to integrate a model service client into the product that will use these inferences.
    This is the final step in productionization, and we should make sure to check
    a few things before launching to the end customer. Because we are improving the
    model detection of our security camera product, we must integrate a model service
    client in the security camera video-processing backend that will request inferences
    from the newly improved model:


    +   * Make sure the inference response is consumable by the product using it.

    * Stress testing by sending inference requests at a rate that approximates the
    production traffic.

    * Test interfacing with malformed inference requests to make sure they do not
    break the model inference code or the model service.


    This is a very basic list of items to look for. Your organization may define more
    production readiness criteria that you need to fulfill before launching the integration.
    Besides system metrics that can tell us our model is serving inference requests
    properly, we should also set up business metrics that will tell us whether the
    model helps the business use case.'
