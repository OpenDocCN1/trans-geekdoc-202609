  md: 'no need to learn other tools. Also, its installation is very straightforward;
    with a few kubectl commands, you can get Argo Flows running in a Kubernetes environment.


    +   - Robust workflow execution—The Kubernetes pod creates great isolation for
    Argo Workers'' task execution. Argo Flows also supports cron workflow and task
    retry.


    +   - Templating and composability—Argo Flows templates are like functions. When
    building a workflow, Argo supports composing different templates (step functions).
    This composability encourages sharing the common work across teams, greatly improving
    productivity.


    +   - Fully featured UI—Argo Flows offers a convenient UI to manage the entire
    lifecycle of a workflow, such as submitting/stopping a workflow, listing all workflows,
    and workflow definitions.


    +   - Highly flexible and applicable—Argo Flows defines REST APIs to manage the
    system and add new capabilities (plugins), and workflow are defined as Docker
    images. These features make Argo Flows highly customizable and used widely in
    many domains, such as ML, ETL, batch/data processing, and CI/CD (continuous integration
    and continuous delivery/continuous deployment).


    +   - Production quality—Argo Flows is designed to run in a serious production
    environment. Kubernetes pipeline and Argo CD are great examples of productionizing
    Argo Flows.


    # LIMITATIONS


    The downsides of using Argo in deep learning systems are as follows:


    +   - Everyone will write and maintain YAML files—Argo Flows demands that the
    workflow is defined as a Kubernetes CRD in a YAML file. A short YAML file for
    a single project is manageable, but the number of workflows starts increasing
    and workflow logic becomes more complex, the YAML file can become long and confusing.
    Argo Flows offers templates to keep the workflow definition simple, but it is
    not very intuitive unless you are accustomed to working with Kubernetes YAML configurations.


    +   - Must be an expert on Kubernetes—You will feel it like second nature if you
    are an expert on Kubernetes. A novice user may need to spend some time learning
    Kubernetes concepts and practices.


    +   - Execution latency—In Argo Flows, for every new task, Argo will launch a
    new Kubernetes pod to execute it. The pod launching can introduce seconds or minutes
    to every single task execution, which limits Argo when supporting time-sensitive
    workflows. For example, Argo is not a good fit for real-time model prediction
    workflow, which runs model prediction requests with millisecond SLAs.'
