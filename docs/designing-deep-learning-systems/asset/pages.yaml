  md: '# 4.3.6 Improvements


    If we continue the path to making this sample service production ready, we can
    follow the thoughts in section 4.2.2 to work on improving fault tolerance and
    reducing net-work bandwidth saturation. We can also extend the Kubernetes job
    tracker to support TensorFlow and Horovod distributed training. From a training
    service perspective, they are not very different because the configuration that
    the training service passes to the training code is very generic; this information
    is needed for all frameworks but with different names. As long as the protocol
    between the training service and the training code is clear and stable, we can
    still treat the training code as a black box, even in the distributed setting.


    # 4.4 Training large models that can''t load on GPU


    The neural network size (defined by the number of parameters) is growing rapidly
    in the research field, and we cannot ignore this trend. Using the ImageNet challenge
    as an example, the winner in 2014 (GoogleNet) had 4 million parameters; the winner
    in 2017 (Squeeze-and-Excitation Networks) had 148.8 million parameters; and the
    current approaches have more than 1 billion parameters.


    Although our neural network size grew nearly 300x, GPU memory has only increased
    4x. You will see more cases often in the future in which we can''t train a model
    because it cannot be loaded onto one GPU.


    In this section, we will discuss common strategies for training large models.
    Unlike the data parallelism strategy described in section 4.2, the method introduced
    here requires effort work on training code.


    > NOTE The methods introduced in this section are normally implemented by data
    scientists, who you can still follow from. Understanding the strategies behind
    these training techniques is very helpful for designing communication protocols
    between training services and training codes. It also provides insight into troubleshooting
    or fine-tuning the training performance in service. To keep it simple, we will
    only describe algorithms at the concept level and on the necessary work from an
    engineering perspective.


    # 4.4.1 Traditional methods: Memory saving


    Let''s say your data science team wants to train a model that can load to the
    largest GPU in your cluster; they want to train a 24 GB BERT model in a 10 GB
    GPU. There are several memory-saving techniques the team can use to train the
    model in this situation, including gradient accumulation and memory swap. As a
    platform developer, you just need to be aware of these options. We''ll describe
    them briefly, so you will know when to use each of them.


    > NOTE There are other memory-saving methods, such as OpenAI''s gradient checkpointing
    (https://github.com/cybertronai/gradient-checkpointing)'
