    # Model focus vs pipeline focus


    There are two schools of thought on designing metadata systems: model focus and
    pipeline focus. The model focus method correlates metadata around model files,
    whereas the pipeline focus method aggregates metadata around the pipeline/training
    run, like what we propose in figure 8.4.


    We think model focus and pipeline focus are equally useful to the end users (data
    scientists), and they are not mutually exclusive. We can support both of them.


    You can implement the metadata store''s storage layer using the pipeline focus
    method, similar to our sample in figure 8.5, and build search functionality on
    the web UI to support both pipeline search and model search.


    # 8.4 Open source solutions


    In this section, we will discuss two widely used metadata management tools, MLMD
    and MLFlow. Both systems are open source and free to use. We will first give an
    overview of the tools and then provide a comparison to determine which one to
    use and when.


    # 8.4.1 ML Metadata


    MLMD (https://github.com/google/ml-metadata) is a lightweight library for recording
    and retrieving metadata associated with ML developer and scientist workflows.
    MLMD is an integral part of TensorFlow Extended (TFX; https://www.tensorflow.org/tfx)
    and is designed so that it can be used independently. For example, Kubeflow (https://kubeflow.org/)
    uses MLMD to manage metadata produced by its pipeline and notebook service. For
    more details, see the Kubeflow metadata documentation (http://mng.bz/Bl01). You
    can consider MLMD a logging library and use it to instrument metadata in each
    step of your ML pipeline, so you can understand and analyze all the interconnecting
    parts of your workflow/pipeline.


    # System overview


    The metadata instrumentation with the MLMD library can be set up with two different
    backends: an SQL or gRPC server. See figure 8.6 for the concept.'
