    Figure 9.5 A design overview for a generic workflow orchestration service


    +   - Metadata database—The metadata database stores the workflows’ configuration,
    DAG, editing and execution history, and the tasks’ execution state.

    - Worker group—The worker group provides the compute resource to run workflows.
    The worker abstracts the infrastructure and is agnostic to the task that’s running.
    For example, we might have different types of workers, such as a Kubernetes worker
    or an Amazon Elastic Compute Cloud (EC2) worker, but they can execute the same
    task, albeit on different infrastructures.

    - Object store—The object store is shared file storage for all its components;
    it is normally built on top of cloud object storage, such as Amazon Simple Storage
    Service (S3). One usage of object task is output sharing. When a worker runs a
    task, it reads the output of the previous task from the object store as task input;
    the worker saves the task to the object store for its successor tasks.


    Both the object store and the metadata database are accessible to all the components
    of the orchestration system, including the scheduler, web server, and workers’
    components. Centralizing data storage decouples the core components, as well as
    the web server, scheduler, and workers can work independently.


    # HOW IS A WORKFLOW EXECUTED?


    First, Vena defines the DAG for the workflow. Inside the DAG, Vena declares a
    set of tasks and defines the control flow of the task execution sequence. For
    each task, Vena uses either the system’s default operator, or a Shell command
    operator or Python operator, or builds his own operator to execute tasks.


    Second, Vena submits the workflow—DAG with different code—to the web server through
    the web UI or command line. The workflow is saved in the metadata database.


    Third, the scheduler periodically (every few seconds or minutes) scans the metadata
    database and detects the new workflow; it then kicks off the workflow at the scheduled
    time. To execute a workflow, the scheduler calls the controller component to dispatch
    the workflow’s tasks to the worker queue based on the task sequence defined in
    DAG.'
