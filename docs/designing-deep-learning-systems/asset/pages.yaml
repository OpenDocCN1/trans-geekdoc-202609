  md: '# 8.4 Open source solutions


    SYSTEM OVERVIEW

    MLflow provides six different setup approaches. For example, the metadata of MLflow
    runs (training pipeline) can be recorded to local files, a SQL database, a remote
    server, or a remote server with proxied storage access. For details about these
    different setup methods, you can check the MLflow doc “How Runs and Artifacts
    Are Recorded” (https://mlflow.org/docs/latest/tracking.html#id27).


    In this section, we focus on the most commonly used setup approach: remote server
    with proxied artifact storage access. See Figure 8.7 for the system overview diagram.


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_264_0.png)


    Figure 8.7 Setting up MLflow tracker server for metadata ingestion and query


    From 8.7, we see that each step/action of a deep learning pipeline (workflow)
    uses the MLflow client to instrument metadata and artifact to the MLflow tracking
    server. The tracking server saves metadata, such as metrics, parameters, and tags,
    in a specified SQL database; artifacts, such as models, images, and documents,
    are saved in a configured object storage, such as Amazon S3.


    MLflow offers two ways to upload artifacts: (1) direct upload from the client
    and (2) proxy upload through the tracking server. In Figure 8.6, we illustrated
    the latter method: utilizing the tracking server as a proxy for any operations
    involving artifacts. The advantage is end users can have a direct path to the
    backend object store without providing access credentials.


    Another nice thing about MLflow is that it offers a nice UI; data scientists can
    check and search metadata through the website hosted in the tracking server. The
    UI allows users not only to view metadata from a pipeline execution perspective
    but also to search and operate models directly.'
