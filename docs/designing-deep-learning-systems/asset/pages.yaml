    eliminating waste and fully saturating the GPUs.


    # PIPELINE PARALLELISM


    Pipeline parallelism is essentially an improved version of model parallelism.
    In addition to partitioning the network to different GPUs, it also divides each
    training batch into small minibatches and overlaps computations of these minibatches
    between layers. By doing so, it keeps all GPUs busy most of the time, thus improving
    GPU utilization.


    There are two major implementations of this approach: PipeDream (Microsoft) and
    GPipe (Google). We use GPipe as the example here because it prioritizes the gradients''
    update in each training step and has better throughput. You can find further details
    about GPipe from GPipe: Easy scaling with micro-batch pipeline parallelism,* by
    Huang et al. (https://arxiv.org/abs/1811.06965). Let''s look, in figure 4.8, how
    GPipe works at a high level.


