- pgno: 55
  md: '# CHAPTER 2 Dataset management service


    a user call to proper service departments according to the user intent prediction.
    If we can''t reproduce a model, the applications built on top of the model are
    nondeterministic and untrustworthy.


    The second reason is that model reproducibility facilitates performance troubleshooting.
    When detecting a model performance regression, people want to find out what has
    changed in the training dataset and training algorithm code. If model reproducibility
    is not supported, performance troubleshooting will be very difficult.


    # 2.1.2 Dataset management design principles


    We want to outline five principles for DM before we start building one.


    NOTE We consider these five principles to be the most important elements in this
    chapter. For data applications, the principles we follow in design are more important
    than the actual design. Because data could be anything in any form, there is no
    paradigm for data storage, in general, and there is no standard design for all
    kinds of data processing use cases. In practice, we will build our own application
    by following certain general principles. Therefore, these principles are critical.


    The five principles will give you clear design targets for building a new DM service
    or improving your DM service.


    # PRINCIPLE 1: SUPPORT DATASET REPRODUCIBILITY FOR REPRODUCING MODELS


    Dataset reproducibility means that the DM always returns the same training examples
    it has returned in the past. For instance, when the training team trains a model,
    the DM provides a dataset with a version string. Anytime the training team—or
    any other team—needs to retrieve the same dataset, it can use this version string
    to retrieve the same training data.


    We believe all DM systems should support dataset reproducibility. Even better
    would be to offer also data functionally, so we can see the data difference between
    two different versions easily. This is very convenient for troubleshooting.


    # PRINCIPLE 2: PROVIDE UNIFIED API ACROSS DIFFERENT TYPES OF DATASETS


    A dataset of deep learning might be structured (text, such as records or the transcript
    of a user) or unstructured (image, video recording file). No matter how a DM system
    processes and stores these different forms of data internally, it should provide
    a unified API for uploading and fetching different types of datasets. The API
    also abstracts how the data source from the data consumer; no matter what happens
    under the hood, as data parsing changes and internal storage format changes, downstream
    consumers shouldn''t be affected.


    Therefore, our users, both data scientists and data developers, only need to learn
    API with all the different types of datasets. This makes the system simple and
    easy to use. The maintenance cost will be greatly reduced because we only expose
    one public API.


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_55_0.png)'
  merge: -1
