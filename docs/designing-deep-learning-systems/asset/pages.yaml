    run out or one trial meets the training objective, the trial loop breaks, and
    the best hyperparameters are returned (step 3).


    Within a trial loop, the job manager first queries the HP suggestion maker to
    recommend hyper candidates (step 2.a). The suggestion maker will run the selected
    HP algorithm to calculate a set of hyper values and return it to the job manager
    (step 2.b). The job manager creates a trial that launches a model training process
    with the suggested hyper values (step 2.c). The trial also monitors the training
    process and continues reporting metrics to the trial database until the training
    completes (step 2.d). When the job manager finishes the current trial, it completes
    the trial history (trial metrics and hyper values used in past trials) and passes
    it to the HP suggestion maker to obtain a new set of HP candidates (step 2.e).


