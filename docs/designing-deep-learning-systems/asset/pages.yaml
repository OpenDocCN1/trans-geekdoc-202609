  md: '# 7.4.1 TensorFlow Serving


    TensorFlow Serving (https://www.tensorflow.org/tfx/guide/serving) is a customizable,
    standalone web system for serving TensorFlow models in production environments.
    TensorFlow Serving takes a model server architecture; it can serve all types of
    TensorFlow models with the same server architecture and APIs.


    FEATURES


    TensorFlow Serving offers the following features:


    +   - Can serve multiple models or multiple versions of the same model

    - Has out-of-the-box integration with TensorFlow models

    - Automatically discovers new model versions and supports different file sources

    - Has unified gRPC and HTTP endpoints for model inference

    - Supports batch prediction requests and performance tuning

    - Has an extensible design, which is customizable on version policy and model
    loading


    HIGH-LEVEL ARCHITECTURE


    In TensorFlow Serving, a model is composed of one or more servables. A servable
    is the underlying object to perform computation (for example, a lookup or inference);
    it is the central abstraction in TensorFlow Serving. Sources are plugin modules
    that find and provide servables. Loader standards are the API for loading and
    unloading a servable. The manager handles the full lifecycle of servables, including
    loading, unloading, and serving servables.


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_227_0.png)


    Figure 7.8 TensorFlow Serving architecture and model serving life cycle. Blue
    = darkest gray; green = lighter gray; yellow = lightest gray. (Source: TensorFlow:
    http://mng.bz/KINJ)'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# 7.4 Touring open source model tools


    Figure 7.8 illustrates the workflow of presenting a servable to the customer.
    First, the source plugin creates a loader for a specific servable; the loader
    contains the metadata to load the model. Second, the source finds a servable in
    the filesystem (a repository); it notifies the servable''s version and loader
    to DynamicManager. Third, based on the predefined version policy, DynamicManager
    determines whether to load the model. Finally, the client sends a prediction for
    a servable, and DynamicManager handles a handle, so the client can execute the
    model.


    # TENSORFLOW SERVING MODEL FILE


    TensorFlow Serving requires models to be saved in SavedModel (http://tf.saved_model.save(model,
    save_path) API for this purpose. A saved model is a directory serializing signatures
    and the state needed to run them, including variable and vocabularies. For example,
    a saved model directory contains two subdirectories, assets and variables, and
    one file, saved_model.pb.


    The assets folder contains files used by TensorFlow graphs, as as text files for
    labeling vocabularies. The variables folder contains training checkpoints. saved_model.pb
    file stores the actual TensorFlow program, and a set of named signatures, each
    identifying a function that accepts tensor inputs and outputs


    # MODEL SERVING


    Because TensorFlow''s SavedModel can be directly loaded into the TensorFlow Serving
    process, running model serving is straightforward. Once the serving process starts,
    we can copy model files to TensorFlow Serving''s model directory and then send
    gRPC or REST prediction requests right away. Let''s review the following prediction
    example:


    ```

    # 1. Save model in training code

    MODEL_DIR="tf_model"

    export_path = os.path.join(MODEL_DIR, str_format="tf")

    model.save(tf, save_path="tf")

    ```


    ```

    # 2. Start tensorflow serving locally as a docker container

    docker run -p 8501:8501

    --mount-type,source=/workspace/tf_model,target=/model_a/

    --MODEL_NAME=model_a -t tensorflow/serving

    --config_file_poll_wait_seconds=60

    --config_file=/models/model_a/config

    ```


    ```

    # 3. Send prediction request to local tensorflow serving container

    # The request url pattern to call a specific version of a model is

    /vi1/models/<model name>/versions/<version number>

    json_response = requests.post(''http://localhost:8501/

    vi1/model_a/versions/1/predict'',

    data=data, headers=headers)

    ```'
