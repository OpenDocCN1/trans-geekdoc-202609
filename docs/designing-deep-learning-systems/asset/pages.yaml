    \ the actual predictor backend client-CustomGrpcPredictorBackend—to communicate\
    \ with the backend intent predictor.\n\nYou may also notice PredictorConnectionManager\
    \ class has caches, such as the model metadata cache (artifactCache) and the model\
    \ backend predictor clients (clients). These caches can greatly improve the model\
    \ serving efficiency. For example, the model metadata cache (artifactCache) can\
    \ reduce the request response time by avoiding calling the metadata store for\
    \ the model that has already been downloaded.\n\n# PREDICTOR BACKENDS\n\nPredictor\
    \ clients are the objects that the frontend service uses to talk to different\
    \ predictor backends. By design, each type of predictor supports its own kind\
