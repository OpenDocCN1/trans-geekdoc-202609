- pgno: 361
  md: '# Designing Deep Learning Systems


    > “Read it once to get the big picture and return to it again and again when building
    systems, designing components, and making crucial choices to satisfy all of them,”

    —From the Foreword by Silvio Vasiceer and Caiming Xiong, Salesforce


    Wang • Szeto


    To be practically usable, a deep learning model must be built into a software
    platform. As a software engineer, you need a deep understanding of deep learning
    to create such a system. This book gives you that depth.


    Deep Learning System: A Guide for software engineers teaches you everything you
    need to design and implement a production-ready deep learning platform. First,
    it presents the big picture of deep learning system from the developer’s perspective,
    including its major components and how they are connected. Then, carefully guides
    you through the engineering methods you’ll need to build your own maintainable,
    efficient, and scalable deep learning platforms.


    > “Written by true industry experts. Their insights are invaluable for software
    engineers looking to design and implement maintainable platforms for DL model
    development that meet the highest standards of efficiency and scalability.”

    —Simon Chan, Firsthand Alliance


    # What’s Inside


    +   * The deep learning development cycle

    * Automate training in TensorFlow and PyTorch

    * Dataset management, model serving, and hyper tuning

    * A hands-on deep learning lab


    > “Invaluable and timely insights for teams expanding their DL systems. This book
    anticipates the needs of a diverse set of organizations, and its content can be
    easily tailored to your current situation or your personal interests.”

    —Weiping Peng, Airbnb


    For software developers and engineering-minded data scientists. Examples in Java
    and Python.


    Chi Wang is a principal software developer in the Salesforce Einstein group. Donald
    Szeto was the co-founder and CTO of PredictionIO.


    For free book owners, all ebook formats are free: https://www.manning.com/freebook


