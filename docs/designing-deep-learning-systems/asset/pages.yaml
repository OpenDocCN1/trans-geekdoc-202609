    # 1.1.1 Phases in the deep learning product development cycle


    The deep learning development cycle typically begins with a business opportunity
    and is driven by a product plan and its management. After that, the cycle normally
    goes through four phases: data exploration, prototyping, productionization (shipping
    to production), and application integration. Let''s look at these phases one at
    a time. Then we''ll look at all the roles (denoted by the icon of a person in
    figure 1.1).


    The number in parentheses next to each following subsection corresponds to the
    same number in figure 1.1.


    # PRODUCT INITIATION (1)


    First, the business stakeholder (product owner or project manager) analyzes the
    business and identifies a potential business opportunity or problem that can be
    addressed with machine learning.


    # DATA EXPLORATION (2)


    When data scientists have a clear understanding of business requirements, they
    begin to work with data engineers to collect as much data as possible, label it,
    and bind'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'datasets. Data collection can include searching publicly available data and
    exploring internal sources. Data cleaning may also occur. Data labeling can either
    be outsourced or performed in-house.


    Compared to the following phases, this early phase of data exploration is unstructured
    and often casual. It might be a Python script or shell script, even a manual copy
    of data. Data scientists use web-based applications, such as Jupyter Notebook
    (open source; https://jupyter.org), Amazon SageMaker Wrangler (https://aws.amazon.com/sagemaker/data-wrangler),
    and Databricks (https://www.databricks.com), to analyze data. There is no formal
    data collection pipeline that needs to be built.


    Data exploration is not only important but also critical to the success of a deep
    learning project. The more relevant data is available, the higher the likelihood
    of building effective and efficient deep learning models.


    # RESEARCH AND PROTOTPING (3, 4)


    The goal of prototyping is to find the most feasible algorithm/approach to address
    the business requirement (from product owner) with the given data. In this phase,
    data scientists can work with AI to propose and evaluate different algorithms
    with datasets from the previous data exploration phase. Scientists usually pilot
    multiple ideas in this phase and build proof-of-concept (POC) models to evaluate
    them.


    Although newly published algorithms are often considered, most of them will not
    be adopted. The accuracy of an algorithm is not the only factor to be considered;
    one must also consider computing resource requirements, data volume, and algorithm
    implementation cost when evaluating an algorithm. The most practical approach
    is usually the winner.


    Note that due to resource constraints, researchers are not always involved in
    the prototyping phase. Frequently, data scientists do the research as well as
    build the POC.


    You may also notice that in Figure 1.1, there is an inner loop (loop A) in the
    development cycle: Product Initiation > Data Exploration > Deep Learning > Prototyping
    > Model > Product Initiation. The purpose of this loop is to obtain product feedback
    in the early phase by building a POC model. We may run through this loop multiple
    times until all stakeholders (data scientists, product owners) arrive at a consensus
    on the algorithms and data that will be used to address the business requirement.


    Multiple hard lessons finally us that we must vet with the product team or the
    customer (even better) before starting the expensive process of productization—building
    data production and training pipelines and hosting models. The purpose of a deep
    learning project is no different from any other software development project:
    to solve a business need. Vetting the approach with the product team in the early
    stage will prevent the expensive and demoralizing process of rewriting it in later
    stages.'
