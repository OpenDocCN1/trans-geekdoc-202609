    # 10.2.5 Model inferences


    Once a model is trained and registered in the production environment, the next
    step is to make sure it can handle inference requests coming into our system at
    a certain rate and producing inferences within a certain latency. We can do so
    by sending requests to the model service. When the model service receives a request,
    it finds the handle name visual_recognition in the request and queries the metadata
    and artifacts store for the matching inference container and model file. The model
    server can then use these artifacts to produce an inference response. You can
    see this process in figure 10.8, which, again, an enlarged version of the model
    serving portion of figure 10.6.


    If you use a model server, you may need a thin layer in front of it so that it
    knows where to obtain the model file. Some server implementations support custom
    model manager implementation, which can also be used to make queries against the
    metadata and artifacts store to load the correct model.'
