    system resources to bring your cluster from the current state to the desired state,
    which is defined in resource objects.


    > NOTE Kubernetes pods are the smallest deployable units of computing that you
    can create and manage in Kubernetes. Pods can be viewed as "logical hosts" that
    run one or more Docker containers. A detailed explanation of the Kubernetes concepts,
    such as Namespaces and ConfigMaps, can be found at the official website: https://kubernetes.io/docs/concepts/


    For example, when a user applies the Kubernetes command to create a pod, it will
    create a pod resource object (a data structure) in the cluster, which contains
    the desired states: two Docker containers and one disk volume. When the controller
    detects this new resource object, it will provision the actual resource in the
    cluster and run the two Docker containers and attach the disk. Next, it will update
    the pod resource object Users can query the Kubernetes API to get the updated
    information from this pod resource object. The controller will remove the actual
    Docker containers because the desired state is changed to zero.


    To extend Kubernetes easily allows users to define custom resource definition
    (CRD) objects and register customized controllers to handle these CRD objects,
    which are called operators. If you want to learn more about controllers/operators,
    you can read the “Kubernetes/sample-controller" GitHub repository, which implements
    a simple controller for watching a CRD object. This sample controller code can
    help you to understand operator/controller patterns, and this understanding is
