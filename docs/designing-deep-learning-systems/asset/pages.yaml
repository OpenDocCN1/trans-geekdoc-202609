  md: '# 5.2 Understanding hyperparameter optimization


    NOTE The HPO algorithm is not the primary focus of HPO engineering. The math behind
    the HPO algorithm can be intimidating, luckily, it is not the engineer''s focus.
    Normally, it''s the data scientist''s job to determine which HPO to use for a
    certain training job. As engineers, our role is to build a flexible, black-box-fashion
    HPO system, so data scientists can run their model training code with arbitrary
    HPO algorithms easily.


    # 5.2.3 Common automatic HPO approaches


    Fortunately, many mature frameworks and systems already exist today for conducting
    HPO. Depending on the usage, they fall into two categories: the HPO library approach
    and the HPO service approach. Figure 5.7 illustrates the two approaches. Let''s
    discuss them one by one.


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_166_0.png)


    Figure 5.7 Two different HPO approaches: library vs. service. (a) HPO libraries
    can run HPO experiments (training) on a local machine or a group of servers with
    preconfiguration; (b) HPO service can run experiments in a fully remote and automatic
    fashion.


    # HPO LIBRARY APPROACH


    In 5.7(a), the library approach, means that data scientists manage the HPO process,
    from coding to execution. They code the entire HPO flow by using an HPO library,
    such as Hyperopt—an open source Python HPO library—and integrate it with the training
    code in one training application. Next, data scientists run this application on
    their local machine or on the servers to which they have direct access. The HPO
    library inside the application will execute the HPO workflow


    Flexibility and agility are the biggest advantages of the library approach; you
    can choose any HPO algorithm/libraries you like, integrate them into your training
    code, and start the HPO process right away because everything (training plus hyperparameter'
