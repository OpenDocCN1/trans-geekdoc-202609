    \ a PyTorch model, there are two choices: serialize the entire model or serialize\
    \ only the learned parameters. The first option serialize the entire object, including\
    \ its classes and directory structure, whereas the second option only saves the\
    \ parameters of the model network.\n\nFrom Matthew Inkawaw’s article \"PyTorch:\
    \ Saving and Loading Models\" (http://mng.bz/zm9b), the PyTorch team recommends\
    \ only saving the model's learned parameters (model's state_dict). If we save\
    \ the model, the serialized data is bound to the specific classes and the exact\
    \ directory structure used when the model is saved. The class itself is not saved;\
    \ rather, the file containing the class is saved. Consequently, during loading\
    \ time, the serialized model could break in many ways when used in other projects\
    \ or after refactors.\n\nFor this reason, we only save the model state_dict (learned\
    \ parameters) of the model after training; in example, it is the model.pth file.\
    \ We use the following code to save it: torch.save(model.state_dict(), model_local_path).\
    \ As a result, the predictor needs to know the model's neural network architecture\
    \ (see code listing 7.8) to load the model file because the model file is state_dict—the\
