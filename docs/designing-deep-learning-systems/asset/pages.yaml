- pgno: 299
  md: 'Once training data shape and code become stable, they will be ready for further
    tuning and optimization. The goal in this phase is to converge to a state where
    model training and inference code are ready to be packaged and deployed to production.


    # 10.1.3 Key takeaways


    We have walked through the research and prototyping phases of our reference deep
    learning development cycle in figure 10.1. Even though they serve different purposes,
    we see quite a bit of overlap in how they work with the deep learning system:


    +   The notebooking environment is a common choice for both research and production
    prototyping due to its high degree of interactivity and reactivity.


    +   Access to training data should be as wide and flexible as possible (to the
    limit of legality and compliance), which helps accelerate the data exploration
    process.


    +   Sufficient computing resources should be allocated for model training so that
    turnaround time is short.


    +   At a minimum, use a dataset management service and a source-control management
    system to keep track of the provenance of experimental models. In addition, use
    a metadata store to contain metrics and associate them with a training dataset
    and code for complete lineage tracking.


    # 10.2 Model productionization


    Before deep learning models can be integrated into an end product, they need to
    go through the process of productionization. There are certainly many interpretations
    of this term, but fundamentally:


    +   Models need to serve production requests either from end products or end users.


    +   Model serving should meet a predefined service level agreement, such as responding
    within 50 milliseconds or being available 99.999% of the time.


    +   Production problems related to models should be easy to troubleshoot.


    In this section, we will look at how deep learning models transition from living
    in a rather dynamic environment, such as a notebook, to a production environment
    where they are hit by harsh conditions. Figure 10.4 shows the production-ization
    phase relative to the rest of the development cycle. Let''s review the steps in
    this phase.'
  merge: -1
  img_proc: true
