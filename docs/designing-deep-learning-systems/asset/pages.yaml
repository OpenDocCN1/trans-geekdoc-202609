- pgno: 256
  md: '# 8.3 Designing a metadata and artifacts store


    If you compare 8.2 to figure 8.3, you''ll see a new component (the metadata and
    artifact store) is introduced in the middle of 8.3. The deep learning metadata
    we described in section 8.2.1, regardless of whether they are the experiment pipeline
    or production pipeline, are collected and stored in this metadata.


    The metadata store provides a holistic view of metadata for every data science
    activity in the deep learning system. Metadata of the model, pipeline/training
    run, and artifacts are not only saved but also correlated inside this store, so
    people can obtain related information easily. For example, because model files
    and training runs are linked in the store, people can easily determine the model
    lineage of a given model.


    Now, Ravi, the data scientist, uses the metadata store UI to find all the models
    and training runs in the system. He can dive deep into the metadata store to find
    the input parameters, datasets, and training metric used in the past training
    run, which are super helpful in evaluating the model. More importantly, Ravi retrieve
    the metadata quickly and completely on his own, without knowing the underlying
    infrastructure of model training and serving.


    # 8.3 Designing a metadata and artifacts store


    In this section, we will first discuss the design principles for building a metadata
    and artifact store and then introduce a general proposal that follows those principles.
    Even if you prefer to use open source technology to manage metadata, the discussion
    in this section will still benefit you; the design requirements and solutions
    will help you choose the right tool for your needs.


    > NOTE To keep things short, we use metadata and artifact store interchangeably
    in this chapter. When we mention metadata store, it includes the artifacts management
    as well.


    # 8.3.1 Design principles


    A metadata and artifact store is designed to facilitate model performance troubleshooting
    and experiment comparison. It stores all kinds of metadata and aggregates around
    models and training runs, so data scientists can obtain the correlated model lineage
    and model training metadata quickly for any arbitrary model. A good metadata store
    should address the following four principles.


    PRINCIPLE 1: SHOWING MODEL LINEAGE AND VERSIONING


    When registering a model name, a metadata store should be able to determine the
    versions of that model and the lineage for each model version, as training run
    produced the model and what the input parameters and dataset are. Model version
    and lineage are essential to troubleshooting. When a customer reports a problem
    on a model, such as model performance degradation, the first questions we ask
    are: When is the model produced? Has the training dataset changed? Which version
    of training code is used, and where can we find the training metric? We can find
    all the answers in the model lineage data.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# PRINCIPLE 2: ENABLING MODEL REPRODUCIBILITY


    A metadata store should track all the metadata required to reproduce a model,
    such as the pipeline/run configuration, input dataset files, and algorithm version.
    Being able to reproduce a model is crucial for model experiment evaluation and
    troubleshooting. We need a place to capture the configuration, input parameters,
    and artifacts to kick off a model training run to reproduce the same model. The
    metadata store is the ideal place to retain such information.


    # PRINCIPLE 3: EASY ACCESS TO PACKAGED MODELS


    A metadata store allow data scientists access model files easily, without having
    to understand the complex backend system. The store should have both manual and
    programmatic methods, as data scientists need to be able to run manual and automated
    model performance testing.


    For example, by using a metadata store, data scientists can quickly identify the
    model that is currently used in production service and for debugging. Scientists
    can also write code to pull arbitrary versions of models from the metadata store
    to automate the model comparison between the new and old models.


    # PRINCIPLE 4: VISUALIZING MODEL TRAINING TRACKING AND COMPARING


    Good visualization can greatly improve the efficiency of the model troubleshooting
    process. Data scientists rely on a huge of metrics to compare and analyze model
    experiments, and the metadata store needs to be equipped with visualization tools
    that can handle (any type of) metadata queries.


    For example, it is able to show the differences and trending behavior on the model
    evaluation metrics for a set of model runs. It also needs to be show model performance
    trends on the latest 10 released models.


    # 8.3.2 A general metadata and artifact store design proposal


    To address the design principles in section 8.3.1, a deep learning metadata store
    should be a metric storage system, and it needs to store all kinds of metadata
    and the relationships between them. Metadata should be aggregated around model
    and training/execution experiments, we can find all model-correlated metadata
    quickly during troubleshooting and performance analysis. Therefore, the data schema
    of the internal metadata store is the key to the metadata store design.


    Although a metadata store is a data storage, data scaling is usually not a concern
    because the data volume of metadata for a deep learning system is not high. Because
    the metadata store depends on the number of model training executions and models
    and we don''t expect to have more than 1000 model training runs each day, a single
    database instance should be good enough for a metadata store.


    For user convenience, a metadata store should offer a web data ingestion interface
    and logging SDK, deep learning metadata can be instrumented in a similar way as
    application logs and metrics. Based on the design principles and this analysis
    of the system requirements, we have come up with a sample metadata store design
    for your reference. Figure 8.4 shows the overview of this component.'
