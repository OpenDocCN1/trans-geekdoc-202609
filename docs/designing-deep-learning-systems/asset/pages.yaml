    # 4.2 Data parallelism


    In this section, we will look at data parallelism theories and their parallel
    execution challenges, along with sample training codes in PyTorch, TensorFlow,
    and Horovod.


    # 4.2.1 Understanding data parallelism


    Data parallelism involves a group of training devices working together on a large
    dataset. By having each device process a subset of the dataset, we greatly reduce
    the training time.


    Synchronous data parallelism is the most adopted data parallelism method. It replicates
    the model network to every device in the training group, whether it is a GPU or
    CPU. The dataset is split into minibatches, and these batches are distributed
    across all devices (either CPU or GPU). The training steps occur simultaneously,
    using a different minibatch on each of the devices; therefore, the devices act
    as their own data partition. When calculating gradients to update the neural network,
    the algorithm calculates the aggregated gradients from each device to update their
    local network. Although the training dataset on each device is different, the
    neural networks local to each device are the same because they are updated by
    the same gradients in each training iteration. As a result, this process is synchronous.


    You can visualize this in figure 4.1. The figure shows the process of deep learning
    training on a single GPU, in graph (a) on the left, with the setup for synchronous
    data parallel training using three GPUs, in graph (b) on the right.


    By comparing graphs (a) and (b), you can see that synchronous data parallelism
    introduces two extra steps compared with single-device training. The first extra
    step is to divide one training into three minibatches, so each device can work
    on its own minibatch. The second step is to synchronize the gradients aggregated
    from all the machines, which are all operating with the same gradients when updating
    their local model.


    > NOTE To aggregate gradients computed by different workers, you can use the algorithm
    all-reduce. This is a popular algorithm that independently combines arrays of
    data from all processes into a single array. In “Writing Distributed Applications
    with PyTorch (https://pytorch.org/tutorials/intermediate/dist_tuto.html), you
    can find an example of how PyTorch supports the all-reduce.


    From an implementation perspective, data parallelism requires minimal changes
    in a single-device model training process. Its main overhead is the step of synchronizing
    the gradient aggregation.'
