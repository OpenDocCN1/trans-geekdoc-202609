    +   - Saturates computing resources and reduces model training costs

    - Expedites model development by building models in a fast (more resources available)
    and reliable way

    - Enforces compliance by executing training in a confined environment

    - Facilitates model troubleshooting


    # 3.1.2 Training service design principles


    Before we look at our sample training service, let’s look at the four design principles
    we can use to evaluate a model training system.


    PRINCIPLE 1: PROVIDES A UNIFIED API AND IS AGNOSTIC ABOUT ACTUAL TRAINING CODE


    Having only one public API to train models with different kinds of training algorithms
    makes the service easy to use. Whether it’s object detection, voice recognition,
    or text-image classification training, we can sample APIs to trigger the model
    training execution. Future algorithm performance A/B tests can also be easily
    implemented by having a single training API.


    Training agnostic means that the training service defines a mechanism or protocol
    for how it executes a training algorithm (code). It establishes, for instance,
    how the service provides variables to the training code/process, how the training
    code obtains the training data, and where the trained model and metrics are uploaded.
    As long as training code follows this protocol, it doesn’t matter how it’s implemented,
    what its model architecture is, or which training libraries it uses.


    PRINCIPLE 2: BUILDS A MODEL WITH HIGH PERFORMANCE AND LOW COSTS


    A good training service should set cost-effectiveness as a priority. Cost-effectiveness
    can provide methods to shorten the model training execution time and improve the
    utilization of the compute resources. In instance, a modern training service can
    reduce time and hardware costs by supporting various distributed training methods,
    offering good job-schedule management to saturate the server farm, and alerting
    users when a training process goes off the original plan so it can be terminated.


    PRINCIPLE 3: SUPPORTS MODEL REPRODUCIBILITY


    A service should produce the same model if the inputs are same. This is not only
    important for debugging and performance troubleshooting but also builds trustworthiness
    in the system. Remember, we will build logic based on the model prediction result.
    We might, for instance, employ a classification model to produce a user’s'
