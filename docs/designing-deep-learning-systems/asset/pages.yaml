  md: '# 4.4 Training large models that can''t load on one GPU


    and NVIDIA''s vDNN (https://arxiv.org/abs/1602.08124), but because this-book is
    not about deep learning algorithms, we will leave them for independent-study.


    # GRADIENT ACCUMULATION


    In deep learning, the dataset is split into batches. In each training step, for
    loss calculation, gradient computation, and model parameter updating, we take
    the whole batch of examples (training data) into memory and handle the computations
    all at once.


    We can mitigate the memory pressure by reducing the batch size—for example, training
    16 examples in a batch rather than 32 examples in a batch. But reducing batch
    size can cause the model to converge a lot slowly and this is where gradient-accumulation
    can be helpful.


    Gradient accumulation cuts batches into configurable numbers of mini-batches and
    calculates the loss and gradients after each minibatch. But instead-updating the
    model parameters, it updates and accumulates the gradients over all the minibatches.
    And then, ultimately, it updates the model parameters based on the cumulative-gradient.


    Let''s look at example to see how this speeds up the process. Imagine that, because
    of GPU memory constraints, we can''t run with a batch size of 32. With gradient
    accumulation, we can split each batch into four minibatches, each with a size
    of 8. Because we accumulate the gradients for all four minibatches and only update
    the model after all four are complete, the process is almost equal to training
    with a batch of 32. The difference is that we only compute 8 examples at a time
    in GPU instead of 32, so the cost is 4x slower than it would be with a batch of
    32.


    # MEMORY SWAP (GPU AND CPU)


    The memory swap is very simple: it copies activations between CPU and GPU, back
    and forth. If you are unfamiliar to deep learning terms, think of activation as
    the computation output from each node of the neural network. The idea is to keep
    the necessary data for the current computation step in GPU and swap the computation-result
    out to CPU for future steps.


    Building on this idea, a new relay-execution technique called L2L (layer to layer)
    keeps only the executing layers and transit on the GPU. The whole model and the
    optimizer—which holds the state—are stored in the CPU space. L2L can greatly increase
    the throughput and allow us to develop large models on affordable devices. If
    you are interested in this method, you can check out the “Training Large Neural
    Networks with Constant Memory using a New Execution Algorithm,” by Pudipeddi et
    al (https://arxiv.org/abs/2002.05645), which also has a PyTorch implementation
    on GitHub.


    Both gradient accumulation and memory swap are effective ways to train a large
    model on a smaller GPU. But, like most things, they come with a cost: they need
    to slow down the training. Because of this drawback, we normally use them only
    for prototyping ideas.'
