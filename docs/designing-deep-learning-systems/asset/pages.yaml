    # 3.3.8 Troubleshooting metrics


    What we didn''t demo in this sample service is metrics. In general, metrics are
    measures of quantitative assessment commonly used for assessing, comparing, and
    tracking performance or production. For deep learning training, we usually define
    two types of metrics: model execution metrics and model performance metrics.


    Model training execution metrics include resource saturation rate, training jobs''
    execution availability, average job execution time, and job failure rate. We check
    these metrics to make sure the training service is healthy and functioning and
    that user''s daily activities are healthy. As an example, we expect availability
    to exceed 99.99% and training job failure rate to be less than 0.1%.


    Model performance metrics measure the quality of the model learning. It includes
    model evaluation score (epoch) and the final evaluation results, such as accuracy,
    precision, and F1 score.


    For model performance-related metrics, we need to store the metrics in a more
