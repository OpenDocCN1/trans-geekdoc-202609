  md: '# appendix C

    Creating an HPO service with Kubeflow Katib


    We will introduce you to an open source hyperparameter optimization (HPO) service—Kubeflow
    Katib—that addresses virtually all the HPO requirements discussed in chapter 5.
    We strongly recommend that you consider adopting Katib before building your HPO
    service. Along with showing you how to use Katib, we will also cover its system
    design and its codebase to make you comfortable with the open source service.


    As a member of the Kubeflow family, Katib is a cloud-native, scalable, and production-ready
    hyperparameter optimization system. In addition, Katib is agnostic to the machine
    learning framework or programming language. Also, Katib is written in Go, takes
    a Kubernetes-native approach, and runs standalone in a Kubernetes cluster. In
    addition to hyperparameter optimization with early stopping support, Katib supports
    neural architecture search (NAS).


    There are many advantages to Katib, including its ability to support multiten
    and distributed training, its cloud nativeness, and its extensibility, all of
    which distinguishes it from other systems. If you manage your server cluster Kubernetes
    in the cloud or on your local server, Katib is the best choice. In this chapter,
    we will tour Katib in the following five steps: Katib overview, how to use Katib
    system design and code reading, expediting HPO execution, and adding customized
    HPO algorithms to Katib.


    # C.1 Katib overview


    Katib manages HPO experiments and computing resources in a black-box fashion,
    so Katib users only need to provide training code and define the HPO execution
    plan, and then Katib will take care of the rest. Figure C.1 shows Katib''s system
    overview.'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# APPENDIX C Creating an HPO service with Kubeflow Katib


    HPO jobs are isolated by Kubernetes namespace


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_331_0.png)


    C.1 Katib system overview. Katib components run as Kubernetes native services,
    and Katib uses three types of interfaces: UI, API, and SDK.


    In C.1, we see that Katib exposes three types of user interfaces for the user''s
    convenience: a web UI, a Python SDK, and a set of APIs. Users can run HPO via
    a web, a Jupyter notebook, Kubernetes commands, and an HTTP request.


    From a user perspective, Katib is a remote system. To run HPO, a user submits
    an experiment to Katib, and Katib executes the HPO experiment for them. To build
    the experiment, user needs to do two things: First, Dockerize the training code
    and expose the hyperparameters they want to optimize as external variables; second,
    create an experiment that defines the scope of the HPO experiment, such as HPO
    algorithm, trial budget, or hyperparameters and their value search space. Once
    the experiment is created inside Katib, Katib will allocate computing resources
    to start the HPO execution.


    Katib runs inside a Kubernetes cluster. Katib itself doesn''t consume a lot of
    memory or disk space; it launches Kubernetes pod to run model training jobs (HPO
    trials) for different hyperparameter suggestions. Katib can run training jobs
    in different namespaces for different users to create resource segregation.


    # C.2 Getting started with Katib


    In this section, we will look at how to operate Katib. First, we install Katib
    locally and then explain the terms, and finally show a Katib end-to-end use case.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# C.2 Getting started with Katib


    # Why talk about Katib operation and installation in a design book?


    Ideally, we don''t want to include installation and user guides for software in
    a design book, because this information might get stale right after the book is
    published, and we can find the living doc on its official website. Here are two
    reasons why we violated rules.


    First, because we recommend you use Katib instead of building your own service,
    we are obligated to show the complete user experience, from both the perspective
    of Katib user (a data scientist) and a Katib operator (an engineer). Second, to
    understand Katib''s design and how to learn its codebase, it''s best to explain
    its terminology and typical user workflow. Once you comprehend how Katib works,
    you''ll have a much easier reading time out it.


    # C.2.1 Step 1: Installation


    If you install the Kubeflow system (https://mng.bz/WAp4), then Katib is included.
    But if you are only interested in HPO, you can install Katib standalone. Katib
    is actively evolving and well maintained, so please check its official documentation
    "Getting Started with Katib: Installing Katib" (http://mng.bz/81YZ) for the up-to-date
    installation steps.


    # C.2.2 Step 2: Understanding Katib terms


    For a Katib user, experiment, suggestion, and trial are the most important entities/concepts
    with which to familiarize yourself. The definitions are as follows:


    # EXPERIMENT


    An experiment is a single optimization run; it is an end-to-end HPO process. An
    experiment configuration contains the following main components: a Docker image
    for training code, an objective metric (aka target value) for what we want to
    optimize, hyperparameters to tune, and a value search space and HPO algorithm.


    # SUGGESTION


    A suggestion is a set of hyperparameter values that the HPO algorithm is proposed.
    Katib creates a trial job to evaluate the suggested set values.


    # TRIAL


    A trial is one iteration of the experiment. A trial takes one execution, a training
    process (a trial job) to produce a model, and evaluates the model performance.


    Each experiment runs a trial loop. The experiment keeps scheduling new trials
    until the objective is met or the maximum number of trials is reached. You can
    see more of Katib concepts'' explanation in Katib''s official doc "Introduction
    to Katib" (http://mng.bz/ElB0).


    # C.2.3 Step 3: Packaging training code to Docker image


    Compared to the HPO library approaches (section 5.4), the biggest difference is
    the HPO service approach requires us to package model training code to a Docker'
  merge: -1
  img_proc: true
