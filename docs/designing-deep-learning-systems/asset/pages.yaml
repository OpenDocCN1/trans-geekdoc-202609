  md: '# MODEL-BASED BAYESIAN OPTIMIZATION


    Bayesian optimization is a state-of-the-art optimization framework for the global
    optimization of expensive black-box functions. It''s used for various problem
    settings, such as image classification, speech recognition, and neural language
    modeling. The Bayesian optimization can use different samplers, such as Gaussian
    process regression (see "An Intuitive Tutorial to Gaussian Processes Regression,"
    by Jie Wang:2009.10862) and tree-structured Parzen approach (TPE), to calculate
    hyperparameter candidates in the search space. In less rigorous words, the Bayesian
    optimization uses statistical methods to calculate new hyperparameter value suggestions
    from the values used in past trials and their evaluation results.


    NOTE Why is it called Bayesian optimization? Bayesian analysis (https://www.britannica.com/science/Bayesian-analysis)
    is a widely used statistical inference method, named after English mathematician
    Thomas Bayes (https://www.britannica.com/biology/Thomas-Bayes), that allows you
    to combine prior information about a population parameter with evidence from information
    contained in a sample to guide the inference process. Based on this, Jonas Mock
    introduced the term Linear Regression (Bruna Wundervald:https://www.researchgate.net/publication/33917874_Linear_Regression_Bayesian_Regression)
    in his 1970s and 1980s on global optimization.


    The concept behind Bayesian optimization methods is that the optimal hyperparameter
    would be more efficient if the algorithm could learn from past trials. In practice,
    the Bayesian optimization method can find the optimal hyperparameters with fewer
    evaluation runs (trials) and is more stable than the other search methods. Figure
    5.5 shows the data sampling difference between random search and the Bayesian
    approach.


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_163_0.png)


    Figure 5.5 A data sampler comparison of random search (a) and Bayesian approach
    (b) using 10 trials'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# 5.2 Understanding hyperparameter optimization


    Let''s assume the optimal hyperparameter value is at (x,y) = (0, 1), and we try
    to random search and Bayesian search to find it. In figure 5.5 (a), we see the
    data sampled in the space where x := [-1.0, 1.0] and y := [1]. In figure 5.5 (b),
    we see that the data is sampled in the area (x: [0, 0.7] and y: [1,5]), where
    the optimal value is located. This comparison shows that the Bayesian search is
    more likely to find the optimal hyperparameters in the given space, and with a
    limited execution budget, the selected (sampled) hyperparameter become closer
    and closer to the optimal value after each experiment in the search process.


    There are advanced HPO algorithms, such as Hybrid (http://mgb.bz/Rlwv), and covariance
    adaptation evolution strategy (CMA-ES; http://mgb.bz/MI5q). Although they do not
    follow the exact mathematical theory as the Bayesian-Gaussian process method,
    they share the same hyperparameter selection strategy: calculating the next suggested
    value by considering the historical evaluation results.


    # MULTIFELITY OPTIMIZATION


    Multifidelity methods improve the efficiency of model-free and Bayesian optimization
    methods. Nowadays, tuning hyperparameters on large datasets can take several hours
    and days. To speed up the HPO, multifidelity methods were developed. With this
    approach, we minimize the loss function using so-called fidelity approximations
    of the actual function. As a result, we can skip a lot of computations during
    HPO.


    > NOTE In machine learning context, the loss function (https://www.datobot.com/blog/introduction-to-loss-functions/)
    is a method of evaluating how well a training algorithm models your dataset. If
    the model output (predictions) is far off the expected results, the loss function
    should put a higher number; otherwise, it should output a lower number. The loss
    function is a key component of ML algorithm development; the design of the loss
    function directly affects model accuracy.


    Although the approximation introduces a tradeoff between optimization performance
    and run time, in practice, the speedens often outweigh the approximation errors.
    For more details, refer to "Hyperparameter Optimization," by Mathias Feuer and
    Frank Hutter (www.autml.org/wp-content/uploads/2019/05/AutoML_Book_Chapter1.pdf).


    # WHY DOES BAYESIAN-LIKE HPO ALGORITHM WORK?


    The blog post "Intuition behind Gaussian Processes," by Michael McCourt (https://sigopt.com/blog/intuition-behind-gaussian-processes/)
    gives an excellent explanation for why the Bayesian-like optimization algorithm
    can find the optimal hyperparameter set without checking every possible value
    in the search space. In some settings, the experiments we observe are independent,
    as flipping a coin 50 times; knowledge of one does not imply knowledge of others.
    But, fortunately, many settings have a more helpful structure from which previous
    observations provide insight into unobserved outcomes.'
