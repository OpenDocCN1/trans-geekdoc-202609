    # TWO TAKEAWAYS ON TRAINING CODE


    It''s fine if you are confused when reading those code snippets. As a training
    service developer, you don''t need to write these pieces of code. We need to emphasize
    two points from this discussion:


    +   * Although the code samples in this section implement distributed training
    in different frameworks with different APIs, the code follows the same data parallelism
    paradigm described in section 4.2.1. That is, always sets up the communication
    group for each parallel training process and (2) configures the model object to
    aggregate gradients across all workers. So, as developers, we can use a unified
    method to set up and manage distributed training processes for different frameworks.

    * The work of extending model training from single-device data to parallelism–distributed
    training is relatively trivial. Nowadays, the distributed training frameworks/SDKs
    are so powerful that we don''t need to implement every detail of data parallelism,
    as the gradient synchronizes the gradients across the network. The training frameworks
    and SDKs handle these processes they run seamlessly. The distributed data parallel
    training code is almost identical to the single-device training code, except when
    configuring training groups.


    # 4.2.4 Engineering effort in data parallel–distributed training


    So what does the work like for enabling data parallel–distributed training in
    production? It requires a joint engineering effort between data scientists and
    service developers. For their part, data scientists need to upgrade the single-device
    training code to run distributed, using code like the snippets in the previous
    section. Meanwhile, service developers must enhance the training service to automatically
    set up distributed worker groups that also distributed training to happen.


    To make the training service user friendly, the service should incorporate the
    setup details for distributed training frameworks. Furthermore, data scientists
    have to define only the number of parallel instances they need for the training.


    Let''s use TensorFlow distributed training as an example. From our discussion
    in section 4.2.3, the TensorFlow training code on each device must have tf_config
    (see the following example) as an environment variable. So the underlying TensorFlow-distributed
    library in the training process knows how to communicate with other training processes:'
