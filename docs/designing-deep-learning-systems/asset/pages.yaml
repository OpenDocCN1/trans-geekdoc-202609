- pgno: 343
  md: '# APPENDIX C Creating an HPO service over Kubeeflow


    STEP 1: CREATING AN EXPERIMENT REQUEST

    In step 1, Alex creates an experiment CRD object using client tools, such as Katib
    SDK, Katib web UI, or kubectl commands. This experiment contains all the HPO experiment
    definitions, such as the training algorithm, hyperparameters and their search
    spaces, HBO algorithm, and trial budget.


    The experiment controller (component A) periodically calls all the experiment
    CRD objects. For every experiment CRD object, it creates the declared suggestion
    CRD object and trial CRD object. In short, the experiment controller spawns the
    actual resources to achieve the desired state in the experiment CRD. Additionally,
    it keeps its runtime status updated in the experiment CRD object, so Alex can
    see trial hyperparameters and the execution status of the experiment in real time.


    Once Alex''s experiment has been created in step 1, Katib deploys an HPO algorithm
    suggestion service (component D) for Alex''s experiment so that the required HPO
    algorithm can be run. In this suggestion service, the HPO search algorithm (library)
    within the experiment CRD object is loaded and exposed through a gRPC interface,
    allowing the suggestion controller to talk to it and ask for suggested hyperparameters.


    STEP 2: GET THE NEXT TRIAL HYPERPARAMETERS

    When the experiment controller finds Alex''s experiment CRD object in step 2,
    it creates a suggestion CRD object as an input request for the suggestion controller
    (component B). Hyperparameters and their values are specified in this suggestion
    CRD object, as well as the search algorithm and the number of suggestions.


    Afterward, the suggestion controller calls the suggestion algorithm service, created
    in step 1, to calculate the suggested hyperparameter values. Additionally, the
    suggestion controller maintains the history of the suggested hyperparameter values
    in the suggestion CRD objects.


    STEP 3: CREATE A TRIAL REQUEST

    As part of step 3, after the suggestion controller provides a set of trial hyperparameter
    values, the experiment controller (component A) creates a trial CRD object to
    kick off the model training trial. The trial runs using the set of hyperparameter
    values calculated by the suggestion service (component D).


    STEP 4: LAUNCH TRAINING JOB

    In step 4, the trial controller (component C) reads the newly created trial CRD
    objects (created in step 3) and creates aJob CRD object. There are several types
    of TrialJob objects, including Kubernetes, TF jobs, and MXNet jobs. For each job,
    Kubeflow (https://eflow.io/docs/components/training/) provides a dedicated training
    operator to execute it, such as a PyTorch training operator or TensorFlow training
    operator (component E).


    Upon detecting a newly created Trial CRD object in step 1, the training operator
    (component E) creates Kubernetes pods to execute the training image based on'
