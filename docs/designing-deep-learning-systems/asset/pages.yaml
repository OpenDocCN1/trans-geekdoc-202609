  md: '# 7.5 Releasing models 219


    Second, the newly published model and its previous versions should all be accessible
    in the prediction service, so we can evaluate them in the same environment and
    make a fair comparison. In this section, we propose a three-step model release
    process to address these challenges.


    First, the data scientist (Alex) or training service the recently produced model
    (consisting of the model''s files and its metadata) to a metadata store—a cloud
    metadata and artifact storage system that will be discussed in the next chapter.
    Second, Alex runs the model evaluation on the newly registered models. He can
    test the performance of these models by sending prediction requests with their
    specific model versions to the prediction service. The prediction service has
    a built-in mechanism to load any specific version of a model from the metadata
    store.


    Third, Alex selects the best-performing model version as the release version in
    the metadata store. Once this is set, the selection of the model will go public!
    Customer applications will unknowingly start using the new version of the model
    from the prediction service. Figure 7.12 illustrates this three-step process.


