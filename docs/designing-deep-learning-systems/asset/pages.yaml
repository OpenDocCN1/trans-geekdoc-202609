    # 7.4.3 Triton Inference Server


    Triton Inference Server (https://developer.nvidia.com/nvidia-triton-inference-server)
    is an open source inference server developed by NVIDIA. It provides a cloud and
    edge inference solution optimized for both CPUs and GPUs. Triton supports HTTP/
    and gRPC protocol that allows clients to requesting inference for any model managed
    by the server. For edge deployments, Triton is available as a shared library with
    a C API that allows the full functionality of Triton to be included directly in
    an application.


    Training framework compatibility is one of Triton''s main advantages when compared
    with other serving tools. Unlike TensorFlow Serving, which only works with the
    TensorFlow model, and Torch serving, which only works with the PyTorch model,
    the Triton server can serve models from almost any framework, including TensorFlow,
    Torch, PyTorch, ONNX, and XGBoost. Triton server can load model files from local
    storage, Google Cloud Platform, or Amazon Simple Storage Service (Amazon S3) on
    any GPU or CPU-based infrastructure (cloud, data center, or edge).


    Inference performance is also an advantage for Triton. Triton runs models currently
    on GPUs to maximize throughput and utilization; supports x86 and ARM'
