- pgno: 54
  md: '# 2.1 Understanding dataset management service


    The long iteration loop (figure 2.2) is now divided into two small loops (figure
    2.4), and each loop is owned by a single team, so the dataset developer and data
    scientist iterate on collection and model training separately; therefore, the
    deep learning project can iterate much faster.


    You may also notice that we now have all schemas in one place: a dataset management
    service, which manages two strongly typed data schemas—the ingestion data schema
    and the training data schema—for each type of dataset. Having two separate data
    schemas for ingestion and training while doing data transformation inside DM,
    you ensure that the data changes in the upstream data collection won''t break
    the downstream model training. The data schemas are strongly typed, future updates
    can easily be made backward compatible.


    Defining a strictly typed dataset may not be a good idea for projects in the beginning
    or phase because we are exploring all kinds of options. Therefore, we also recommend
    defining a special schema-free dataset type, such as GENERIC type, which has no
    schema restriction. For this dataset type, DM accepts the data as is and does
    not perform validation and transformation (for a detailed example, see section
    2.2.6). The data collected from the data pipeline can be consumed by the training
    process. Although the workflow would be fragile, a flexible dataset type addresses
    the need to be flexible for projects in the early phase. Once the project matures,
    we can create strongly typed schemas and define a dataset type for them.


    To summarize this section, managing two data schemas of a dataset type is the
    secret sauce that decouples data scientists and data developers. In section 2.2.6,
    we will show how these schemas can be implemented in our dataset management service.


    # ENABLING REPRODUCIBILITY


    A well-defined dataset management service supports model reproducibility by version
    tracking on training datasets—example, using a version string to obtain the exact
    training files used in previous model training runs. The advantage of model reproducibility
    with respect to the data scientist (model algorithm development) is that you can
    repeat it a deep learning algorithm (such as the self-attention transformer in
    NLP) on a certain dataset and gain the same or similar quality of results. This
    is called algorithm reproducibility.


    From the view of a deep learning system developer, model reproducibility is the
    superset of algorithm reproducibility. It requires the dataset management system
    to be able to reproduce output artifacts (datasets). For example, need to obtain
    the exact training data and training configuration to reproduce models that were
    trained in the past.


    Model reproducibility is crucial to machine learning projects for two main reasons.
    The first is trust. Reproducibility creates trust and credibility for the system
    that produces the model. For any system, if the output can''t be reproduced, people
    simply won''t trust the system. This is extremely relevant to machine learning
    projects because applications will make decisions based on model output—for example,
    a chatbot will transfer'
  merge: -1
