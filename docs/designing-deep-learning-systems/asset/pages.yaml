  md: '# CHAPTER 2 Dataset management service


    (continued)

    By choosing a framework-specific dataset format, your training code will also
    need to be written in the framework, which is not ideal. Introducing a self-defined
    intermediate dataset format can make the DM framework-neutral, so no framework-specific
    training codes are required.


    # THE BENEFIT OF HAVING TWO STRONGLY TYPED DATA SCHEMAS IN ONE DATASET


    By having strongly typed data schemas in a dataset and letting DM do the data
    transformation from the ingestion data format to the training data format, we
    could parallelize data collection development and training code development. For
    example, when Jiango wants to add a new feature—“text language”—to the TEXT_INTENT
    dataset, he can work with the DM developers to update the ingestion schema to
    add a new field.

    Julia will not be affected because the data schema is not changed. Julia may come
    to us to update the training data schema when she has the bandwidth to consume
    the new feature in her training code. The key point is that Jiango and Julia don''t
    have to work synchronously to introduce a new dataset enhancement; they can work
    independently.


    NOTE For simplicity and demo purpose, we choose to use a CSV file to store data.
    The problem with using plain CSV files is their lack of compatibility support
    and data-type validation support. In production, we recommend Parquet, Google
    protobuf, or Avro to define schemas and store data. They come with a set of libraries
    for data validation, data serialization, and schema backward-compatible support.


    # A GENERIC DATA: A DATASET WITH NO SCHEMA


    Although we emphasize at places defining strongly typed dataset schema is fundamental
    to dataset management service, we will make an exception by adding a free format
    type—the GENERIC data. Unlike the strongly typed TEXT_INENT dataset, the GENERIC-type
    has no schema validation. Our service will save any raw input data as is, and
    when building training data, the service picks all the raw data in its original
    format into a training dataset.

    A GENERIC data type might sound like a bad idea because we basically pass whatever
    data we receive from upstream data stores to the downstream training application,
    which can break the data parsing logic in the training code easily. This is definitely
    not an option for production, but it provides the agility necessary for experimental
    projects.

    Although strongly typed schema offers good data safety protection, it comes at
    the cost of maintaining it. It is quite annoying when we have to make frequent
    schema changes in the DM service to adopt the new data format required by a new
    experimentation.


