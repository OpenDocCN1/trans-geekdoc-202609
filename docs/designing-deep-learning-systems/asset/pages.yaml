- pgno: 192
  md: '# 6.3 Designing a prediction service


    WHY IS THE SERVICE APPROACH MORE POPULAR?

    Although the direct model embedding approach looks simple and saves one network
    hop, it is still not a popular choice for building model serving. Here are the
    four reasons:


    +   - The model algorithm has to be reimplemented in a different language. A model''s
    algorithm and execution code is usually written in Python. If we choose a model
    service approach (predictor in figure 6.4), we can reuse most of the training
    code and build it quickly. But if we choose to embed model serving in a non-Python
    application, we must implement model loading, model execution, and data process
    logic in the application''s language (such as Java or C++). This work is not nontrivial,
    and many developers have the depth of knowledge to rewrite the training algorithms.

    - The ownership is blurred. When embedding a model into an application, the business
    logic can merge with the serving code. When the codebase becomes complicated,
    it''s difficult to draw a boundary between the serving code (owned by the data
    scientist) and other application code (owned by the developer). When data scientists
    and developers are from two different teams work on the same code repo, the shipping
    velocity will drop significantly because the cross-team code review and deployment
    takes longer than usual.

    - Performance problems occur on the client''s devices. Usually, apps run on the
    customer''s mobiles, tablets, or lower-end laptops. On these devices, capturing
    features from raw user data and preprocessing model input and running model prediction
    can lead to performance problems such as CPU usage spikes, app slowdown, and high
    memory usage.

    - A memory leak can occur easily. For example, when executing a TensorFlow model
    in Java, the algorithm execution and output parameters are all created in the
    native space. These objects are not recycled by Java GC (Garbage Collection) automatically;
    we have to manually depose them. They claimed by the heap, because the native
    objects'' memory allocations are not tracked in Java, their memory usage is difficult
    to observe and measure. So the memory leak can happen and is hard to fix


    NOTE To troubleshoot memory leaks, Jemalloc (https://github.com/jemalloc/jemalloc/wiki/Background)
    is a very handy tool. You can check out my blog post "Fix Memory Issues in Your
    Java Apps" (http://mng.bz/lJb8o) for further details.


    For the previously listed reasons, we highly recommend you adopt the model serving
    approach for single model application use cases.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# Multitenant application


    We will use a chatbot application as an example to explain multitenant use cases.
    Let''s set the context. A tenant is a company or organization (such as a school
    or a retail store) that uses the chatbot application to communicate with its customers.
    The tenants use the same software/service—the chatbot—but have separate accounts
    with their data segregated. A user is a customer of a tenant and uses the chatbot
    to do business with the tenant.


    By design, the chatbot application relies on an intent classification model to
    identify the user''s intention from his conversation, and then the chatbot redirects
    the user to the correct service department of the tenant. Currently, this chatbot
    is taking a single model application approach, meaning it''s using a single intent
    classification for every user and tenant.


    Now, because of customer feedback from tenants on the low prediction accuracy
    of the single intent classification model, we decided to let tenants train their
    algorithm to build their own model with their dataset. This model can fit better
    with each tenant''s business situation. For serving, we let tenants use their
    own model for intent classification requests. When a chatbot user now speaks to
    the chatbot application, the application will find the tenant''s specific model
    to answer the user''s question. The chatbot is changed to a multitenant application.


    In this chatbot multitenant use case, although the models belong to different
    tenants and are trained with different datasets, they are the same type of model.
    Because these models are trained with the same algorithm, their model''s algorithm
    and prediction are all the same. We can extend the model service design in figure
    6.4 to support multitenancy by adding a model cache. By caching model graphs and
    their dependent data in memory, we can perform multitenant model serving in one
    service. Figure 6.6 illustrates this concept.


    Compared with the model service design in figure 6.4, the design in figure 6.6
    adds a model cache (component A) and a model file server (component B). Because
    we want to support multiple models in one service, we need a model cache in memory
    to host and execute different models. The model file server stores the model files
    that can be loaded into the prediction service''s model cache. The model server
    can also share among prediction service instances.


    To build a good model cache, we need to consider model cache management and memory
    resource management. For the model cache, we need to assign a unique model ID
    as a cache key to identify each model in the cache. For example, we can use the
    model training run ID as the model ID; the benefit is it. Another flexible way
    of constructing the model ID is combining the model name (a customized string)
    and the model version. No matter which model style we choose, the ID has to be
    unique, and it must be provided in the prediction request.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# 6.3 Designing a prediction service


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_194_0.png)


    6.6 A prediction service with model cache for multitenant applications


    For memory resource management, because each server has limited memory and GPU
    resources, we can''t load all the required models into memory. So we need to build
    model-switching logic to the model cache. When the resource capacity is reached—for
    instance, the process is to run out of memory—some models need to be evicted from
    the model cache to free some resources for model prediction requests. Methods
    like LRU (least recently used) algorithm and model partition across different
    instances can help reduce the cache missing rate (the request is not in the cache)
    and make model switching less disruptive. The sample intent classification service
    we build in section 7.1 demonstrates the model cache concept, you can explore
    the details.


    CAN WE EXTEND THE MODEL CACHING DESIGN TOIPLE MODEL TYPES?


    We don''t recommend extending the model caching design to multiple model types.
    The input/output data format and process logic of various model types, such as
    the image classification model and intent classification model, are very different,
    it''s hard to host and execute different types of models in the same model cache.
    To do that, we would need to build separate web interfaces and separate data preprocess
    and postprocess code for each type of model. At this point, you will find it deier
    to build separate prediction services for each model type—with each service having
    its own type of web interface and data process logic and managing the model cache
    for'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'its own model type. For example, we can build an image classification prediction
    service and intent classification prediction service for these two model types
    separately.


    This one service per model approach works well when you have a few model types.
    But if you have 20+ types of models, it can''t scale. Building and maintaining
    web services—like setting up a CI/CD pipeline, networking, and deployment—is costly.
    Also, the work of monitoring a service is nontrivial; ensure the service is running
    24/7. Consider the costs of onboarding and maintenance work if we follow this
    design to support 100+ model types for the entire company. To scale up and serve
    different models in one system, we need to take the model server approach (section
    6.2.3), which we will discuss further in the next section.


    # 6.3 Supporting multiple applications in one system


    You have successfully built multiple model serving services to support different
    applications, such as chatbot, face-swapping, flower recognition, and PDF document
    scanning. Now, you are given two tasks: (1) building the model serving for a new
    application that uses a voice recognition model and (2) reducing model serving
    costs for all applications.


    So far, all model serving implementations have been built with the model server
    approach. From previous discussions in 6.3.1 and 6.3.2, we know this approach
    can''t scale when we have more and more model. When many products and applications
    have model serving requirements, it''s better to build just one prediction service
    to address all the needs. We name this type of prediction service *prediction
    platform*. It takes the model server approach (section 6.2.3) and handles all
    kinds of model serving in one place. This is the most cost-efficient approach
    for multiple application situations because the model onboarding and maintenance
    cost is limited to one system, which is much less than one prediction service
    approach (section 6.2.2).


    To build an omnipotent model system, we need to consider lots of elements, such
    as model file format, model libraries, model training frameworks, model caching,
    versioning, model flow execution, model data processing, model management, and
    unified prediction API that suits all model types. 6.7 illustrates the design
    and workflow of the prediction platform.


    The prediction platform figure in 6.7 is much more complicated than the model
    service approach in figure 6.6. This is because we need to combine multiple components
    and services to support arbitrary models. Look at each component of the system
    and then the prediction platform workflow.


    # UNIFIED WEB API


    To support arbitrary models, we expect the public prediction APIs to be generic.
    No matter which model is called, the API''s spec—for instance, payload schema
    of the prediction request and response—should be generic to satisfy the model''s'
