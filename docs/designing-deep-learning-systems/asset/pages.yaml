    # MODEL PARAMETER UPDATES: SYNCHRONOUS VS. ASYNCHRONOUS


    There are two schools of thought on aggregating gradients across workers in data
    parallelism: synchronous and asynchronous updates. Let''s review how each of these
    work, with their advantages and drawbacks, so you can choose for yourself:


    +   - Synchronous model update—As demonstrated in figure 4.1, a synchronous model
    update pauses the training iteration at the gradient sync until all devices receive
    the aggregated gradients. It proceeds to the next step, updating the model parameters.
    In this way, all devices get the same gradient updates at the same time, ensuring
    that the model of each worker is on the same page in every training iteration.
    The problem with synchronous model updates is obvious: the training iteration
    is blocked while the gradients are synchronized among the workers, so none of
    the workers can begin processing the next minibatch of data. If there are some
    slow machines or network problems, the entire working group is stuck, and the
    faster workers are idle.

    - Asynchronous model update—Contrast, the asynchronous model update approach does
    not force each training device or wait to receive gradients from the other devices.
    Instead, whenever a device has finished computing the gradients, it immediately
    updates its local model without checking other devices. Every device works independently,
    and although its gradients still to be'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# 4.2 Data parallelism


    copied to every other device, synchronization of these updates is not necessary.

    The asynchronous method may seem very appealing; it''s simple and can run more
    training steps per minute than the synchronous method. A downside to the asynchronous
    method is that it takes a longer time to train and produces less-accurate models
    than the synchronous model update method.


    When we use the asynchronous method, gradients are calculated independently on
    different devices. Some machines run faster while others slower; consequently,
    these gradients can be produced from different training iterations of each device.
    There is no guarantee that the aggregated gradients will point in the optimal
    direction. For example, say the gradients from a slow machine are calculated from
    training iteration 5, while other, faster machines have already moved to training
    iteration 20. When we aggregate the gradients from all the workers, the gradients
    from the lower iteration are applied to those from the higher iteration; this
    degrades the gradient quality.


    In addition, the asynchronous method often converges slowly and has a higher accuracy
    loss than the synchronous method. Most data parallelism libraries today are synchronous
    model updates. In this chapter, when we mention parallelism and its code implementation,
    we mean synchronous parallelism.


    # MEMORY CONSTRAINT FOR DATASET AND MODEL


    In deep learning, datasets and models consume the most memory of the compute during
    training. The training process will be threatened by an out-of-memory (OOM) error
    if the training data or neural network (model) exceeds the memory limits of its
    local device. Data parallelism is designed to improve training speed but not to
    solve memory constraint problems.


    For OOM caused by loading a dataset, we can reduce the batch size of the training
    data, so the training process loads a smaller amount of data into local memory
    in each training loop. In data parallelism context, we need to make sure the minibatch
    training data can fit into the memory of every worker device.


    For OOM caused by the model size, we need to adapt model parallelism or pipeline
    parallelism (see section 4.4). Data parallelism won''t work when the size of a
    neural network (model) exceeds the limits of a single device.


    # 4.2.2 Multiwork training challenges


    Fault tolerance and bandwidth saturation are the two challenges we, as software
    developers, need to address when executing data parallelism code in the training
    service. Meeting these two challenges is critical to reducing operating costs
    and improving training performance for data parallelism-distributed training.


    # FAULT TOLERANCE


    We don''t want the entire distributed training group to fail just because one
    of the workers fails unexpectedly. This not only causes a problem for service
    availability but increases our training cost because all other workers'' efforts
    are wasted if one fails.'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'To improve tolerance, we can preserve the training state (i.e., the model parameters)
    of each training step in a remote filesystem for each worker. Then, if one worker
    fails or takes too long to complete one training iteration, we can restart the
    worker and load its most recent previous state.


    Both TensorFlow and PyTorch frameworks have features to back up and restore. As
    training service developers, we can set the remote disk or backup storage system
    and pass the access configuration to the training container. Then, during the
    training, the training code can use the external filesystem to backup or restore
    stores.


    # BANDWIDTH SATURATION


    Adding more GPUs and more machines to the distributed training group doesn''t
    always improve performance. Whether we use synchronous or asynchronous model updates,
    the algorithm must communicate the gradients or model parameters between the training
    workers at the end of each iteration. The time spent on moving data in and of
    GPU RAM and the network will eventually outweigh the speedup by splitting the
    training workload.


    Therefore, a cap exists for how many parallel instances can occur before datap
    parallelism reaches its performance. This cap is determined by the number of model
    parameters and the density of the model (how many nonzero values are in model
    weights). If it''s a large, dense model with lots of parameters and gradients
    to transfer, its saturation is greater than a smaller or a larger, sparse model.


    There are some recommended parallel instance numbers, such as a 6x speedup on
    8 GPUs for neural machine translations and a 32x speedup on 50 GPUs for ImageNet
    models. But we need to determine the sweet spot with our own experiments because
    both GPU and architecture evolve rapidly, and standard recommendations quickly
    become outdated. As platform developers, besides have three additional methods
    for mitigating bandwidth saturation.


    First, we can group the parallel workers (i.e., in Kubernetes or pods) into fewer
    machines to reduce the network hops. For example, in Kubernetes, we can set Selector
    with affinity and anti-affinity rules (https://mng.bz/qo76) to train instances
    (Kubernetes pods) on a few selected servers that have a better network and more
    computational power.


    A second option is to upgrade the training image to the latest version of the
    training framework. Popular frameworks such as PyTorch, TensorFlow, and others
    are constantly evolving to reduce the data volume within the network of distributed
    training. Pay attention to the release note and take advantage of these improvements.


    Finally, don''t underestimate the gains that can result from doing small tweaks
    when initializing the distributed group. Consider using PyTorch, for example.
    The PyTorch data parallel library partitions the neural network parameter gradients
    into buckets and then sends the buckets around to the workers during the gradient
    synchronization step. The bucket size determines how much data is transferred'
