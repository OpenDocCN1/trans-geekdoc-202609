    and the HPO workflow (figure 5.3) execution; it tracks each trial''s result (model
    performance metric, such as accuracy) and returns the final hyperparameters to
    the data scientist when all trials are complete.


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_167_0.png)


    The service approach provides a real black-box experience. Data scientists don''t
    need to worry about managing their servers, setting up trial workers, and learning
    how'
