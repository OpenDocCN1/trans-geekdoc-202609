  md: '# 6.1.3 What is model serving?


    Model serving simply executes a model with input data to make predictions, which
    includes fetching the expected model, setting up the model''s execution environment,
    executing the model to make a prediction with given data points, and returning
    the prediction result. The most used method for model serving is to host models
    in a web service and expose the model''s predict function through a web API.


    Suppose we build an object detection model to detect sharks in seacoast environments;
    we can build a web service to host this model and expose a shark detection web
    API. This web API can be used by beach anywhere in the world to detect sharks
    with their own coast images. Conventionally, we call the model serving web service
    the prediction service.


    A typical model workflow in a prediction service has four steps: receiving a user
    request; loading the model from an artifact store to memory or GPU; executing
    the model''s algorithm; and, finally, returning the prediction results. Figure
    6.3


