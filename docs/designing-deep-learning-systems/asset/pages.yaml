- pgno: 16
  md: '# about this book


    This book aims to equip engineers to design, build, or set up effective machine
    learning systems and to tailor those systems to whatever needs and situations
    they may encounter. The systems they develop will facilitate, automate, and expedite
    the development of machine learning (deep learning, in particular) projects across
    a variety of domains.


    In the deep learning field, it is the models that get all the attention. Perhaps
    rightly so, when you consider that new applications developed from those models
    are coming onto the market regularly—applications that make consumers excited,
    such as human-detecting security cameras, virtual characters in internet video
    games who behave like real humans, a program that can write code to solve arbitrary
    problems posed to it, and advanced driver assistance systems that can one day
    lead to fully autonomous and self-driving cars. Within a short period of time,
    the deep learning field is filled with immense excitement and promising waiting
    to be fully realized.


    But the model does not act alone. To bring a product or service to fruition, a
    model needs to be situated within a system or platform (we use these terms interchangeably)
    that supports the model with various services and stores. It needs, for instance,
    an API, a dataset manager, and storage for artifacts and metadata, all others.
    So beside every team of deep learning model developers is a team of non-deep learning
    developers creating the infrastructure that holds the model and all of other components.


    The problem we have observed in the industry is that often the developers tasked
    with designing the deep learning system and components have only a cursory knowledge'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'of deep learning. They do not understand the specific requirements that deep
    learn- needs from system engineering, so they tend to follow generic approaches
    when building the system. They might choose to abstract out all work related to
    deep learning development to the data scientist and only on attention. The system
    they rely on a traditional job scheduling system or business intel- lience data
    analysis system, which is not optimized for deep learning training jobs are run,
    not for deep learning-specific data access patterns. As a result, the system is
    hard to use for model development, and model shipping velocity is slow. Essentially,
    engineers who lack a profound understanding of deep learning are asked to build
    systems to support deep learning models. As a consequence, these engineering systems
    are inefficient and inappropriate for deep learning systems.


    Much has been written about deep learning model development from the data sci-
    entist''s point of view, covering data collection and dataset augmentation, writing
    train- algorithms, and the like. But very few books, or even blogs, with the system
    and services that support all deep learning activities.


    In this, we discuss building and designing deep learning systems from a soft-
    developer perspective. The approach is to first describe a typical deep learning
    system as a whole, including its major components and how they are connected;
    then we dive into each of the main components in a separate chapter. We begin
    every component by discussing requirements. We then introduce design principles
    and sample services/code and, finally, evaluate open solutions.


    Because we cannot cover every existing deep learning system (vendor or open source),
    we focus on discussing requirements and design principles (with examples) in the
    book. After learning these principles, trying the book''s sample services, and
    reading our discussion of open source options, hope readers can conduct their
    our research to find what suits them best.


    # Who should read this book?


    The primary audience of this book is software engineers (including gradu- at CS
    students) who want to quickly transition into deep learning system engineer- gs,
    such as those who want to work on deep learning platforms or integrate AI functionality—for
    example, model serving—into their products.


    Data scientists, researchers, managers, and anyone who uses machine learning to
    solve real-world problems will also find this book useful. Upon understanding
    the under- ing infrastructure (or system), they will be equipped to provide precise
    feedback to the engineering team for improving the efficiency of the model development
    process.


    This is an engineering book, and you don''t need a background in machine learn-
    ing, but you will be familiar with basic computer science concepts and coding
    tools, such as microservices, gRPC, Docker, to run the lab and understand the
    technical material. No matter your background, you can still better understand
    how machine learning and deep learning systems work to bring products and services
    from ideas into production.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# ABOUT THIS BOOK


    By reading this book, you will be able to understand how deep learning systems
    work and how to develop each component. You will also understand when to gather
    requirements from users, translate requirements into system component design choices,
    and integrate components into a cohesive system that helps you quickly develop
    and deliver deep learning features.


    # How this book is organized: A Roadmap


    There are 10 chapters and three appendices (including one lab appendix) in this
    book. The first chapter explains what a deep learning development cycle looks
    like and what a basic deep learning system is. The next chapters dive into each
    functional component of the reference deep learning system. The last chapter discusses
    how models are shipped to production. The appendix contains a lab session to allow
    readers to try out the sample deep learning system.


    Chapter 1 describes what a deep learning system is, the different stakeholders
    of the system, and how they interact with it to deliver deep learning features.
    Additionally, you will conceptualize a deep learning system, called a reference
    architecture, which contains all essential elements and can be adapted based on
    your requirements.


    Chapters 2 to 9 cover each core component of the reference deep learning system
    architecture, such as dataset management service, model training service, auto
    hyperparameter optimization service, and workflow orchestration service.


    Chapter 10 describes how to take a final product from the research or prototyping
    stage to be released to the public. Appendix A introduces the sample deep learning
    system and demonstrates the lab exercise, appendix B surveys existing solutions,
    and appendix C discusses Kubeflow Katib.


    # About the code


    We believe the best way to learn is by doing, practicing, and experimenting. To
    demo the design principles explained in this book and provide hands-on experience,
    we created a sample deep learning system and code lab. All the source, set-up
    instructions, and lab scripts of the sample deep learning system are available
    on GitHub (https://github.com/orca/MiniAutoML). You can also obtain executable
    snippets from the LiveBook (online) version of this book at https://livebook-manning.com/designing-deep-learning-systems
    and from the Manning web (www.manning.com).


    The “hello world” lab (in appendix A) contains a complete, though simplified,
    deep learning system with the most essential components (dataset management, model
    training and serving). We suggest you try out the “hello world” lab after reading
    the first chapter of the book or before trying out the sample services in this
    book. This lab also provides shell scripts and links to all the resources you
    need to get started.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# ABOUT THIS BOOK


    Besides the code lab, this book contains many examples of source code in numbered
    listings and in line with normal text. In both cases, the source code is formatted
    in a fixed-width font like this to separate it from ordinary text. Sometimes code
    is also in bold to highlight code that has changed from previous steps in the
    chapter, such as when a new feature adds to an existing line of code.


    In many cases, the original source code has been reformatted; we''ve added lines
    and reworked indentation to accommodate the available page space in the book.
    In rare cases, this was not enough, and listings include line-continuation markers
    (,,). Additionally, comments in the source code have often been removed from the
    listings when the code is described in the text. Code annotations accompany many
    of the listings, highlighting important concepts.


    # LiveBook discussion forum


    Purchase of Designing Deep Learning Systems includes free access to liveBook,
    Manning''s online reading platform. Using LiveBook''s exclusive discussion features,
    you can attach comments to the book globally or to specific sections or paragraphs.
    It''s a snap to make notes for yourself, ask and answer technical questions, and
    receive help from the author and other users. To access the forum, go to https://livebook.manning.com/book/designing-deep-learning-systems/discussion.
    You can also learn more about Manning''s forums and the rules of conduct at https://livebook.manning.com/discussion.


    Manning''s commitment to our readers is to provide a venue where a meaningful
    dialogue between individual readers and readers and the author can take place.
    It is not a commitment to any specific amount of participation on the part of
    the author, whose contribution to the forum remains voluntary (and unpaid). We
