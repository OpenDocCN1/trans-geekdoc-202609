    #  3.3.7 Training job management


    In section 3.1.2, we mentioned that a good training service should provide computation
    isolation and provide on-demand computing resources (principle 4). This isolation
    has two meanings: training process execution isolation and resource consumption
    isolation. Because we Dockerize the training process, the process execution isolation
    is guaranteed by the Docker engine. But we still have to handle the resource consumption
    isolation.


    Imagine three users (A, B, and C) from different teams submitting training requests
    to our training service. If user A submits 100 training requests and then users'
