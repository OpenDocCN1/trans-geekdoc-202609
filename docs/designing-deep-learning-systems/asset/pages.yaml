- pgno: 178
  md: '# 5.4 Open source HPO libraries


    First, we recommend a Ray cluster with the command `ray up tune-cluster.yaml`;
    the tune-cluster.yaml is a cluster configuration that declares the computing resources
    for the cluster. Then we run the following command to submit the HPO code from
    the local machine to the head node of the cluster: `ray submit tune-cluster.yaml
    script.py --start=<server_address>`. Next, Ray assigns resources, copies the HPO
    code to the servers, and starts the distributed execution. For further details,
    please see “Tune Distributed Experiments” (http://mng.bz/71QQQ).


    Besides distributed HPO execution, Ray Tune also supports running distributed
    training for single-trial, automatic checkpoint management and Tensorboard. These
    features add value to Ray Tune for their high fault tolerance and simple troubleshooting.


    # WHEN USE


    Compared with other HPO libraries, is Ray Tune the way to go for HPO? Provisionally,
    yes. As this book is being written, Ray provides integration with the underlying
    training framework (such as TensorFlow and PyTorch) and the cutting-edge HPO algorithm
    (such as Bayesian search and TPE), well as early stopping (ASHA). It allows us
    to run HPO searches distributed in a straightforward and reliable manner.


    For most of data science team, who don''t want to own an HPO service, Ray Tune
    is the suggested approach. It''s simple to use, and it meets almost every model
    project''s HPO requirement: great documents, cutting-edge HPO algorithms, and
    efficient and simple distributed execution management.


    > We recommend using Ray Tune over other HPO libraries for the following reasons:
    (1) it is simple to use; (2) it has great documents and examples; (3) its distributed
    execution is automatic and programmatic; (4) Ray Tune supports distributed training
    for a single trial; and (5) Ray Tune has a scheduler function (for example, ASHcheduler)
    that can greatly reduce computing cost by terminating unpromising trials earlier.


    # THE LIMITATION OF RAY TUNE


    Ray Tune and other HPO libraries will hit their limits when we need to support
    different teams and deep learning projects in one shared HPO system. Ray Tune
    is missing isolation, which leads to two big problems.


    First, package versions of different training codes can cause conflicts between
    Ray workers. When performing distributed HPO in Ray Tune, we submit the HPO code
    to the Ray cluster''s head server and then run this in the cluster workers in
    parallel. This means every Ray worker needs to install the different libraries
    for every training code that it needs to run. Imagine how we manage the package
    installation and potential version conflicts when we run 10 different HPO tasks
    in one Ray cluster; the worker machine needs to install hundreds of packages for
    these 10 different training codes and also resolve their version conflicts. Second,
    Ray Tune doesn''t enforce user segregation. It''s very difficult to build a virtual
    boundary in Ray Tune for different data science teams to limit their computing
    resource usage.'
  merge: -1
