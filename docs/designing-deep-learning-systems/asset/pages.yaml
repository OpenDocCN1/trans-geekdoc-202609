    # Summary


    +   - The primary goal of dataset management is to continuously receive fresh
    data from a variety of data sources and deliver datasets to model training while
    supporting reproducibility (data version tracking).

    - Having a dataset management component can expedite deep learning project development
    by parallelizing model algorithm development and data engineering.

    - The principles to validate the design of a dataset management service are as
    follows: supporting dataset reproducibility; employing typed schema; designing
    unified API and keeping API behavior consistent across different dataset types
    and sizes; and guaranteeing data persistence.

    - A dataset management system should least support (training) dataset versioning,
    which is crucial for model reproducibility and performance troubleshooting.

    - A dataset is a logic file group for a deep learning task; it is static from
    the model perspective and dynamic from the data collection perspective.

    - The sample dataset management service is made of three layers—the ingestion
    layer, internal dataset storage layer, and training fetching layer.

    - We define two data schemas for each dataset type in the sample dataset management
    service, one for ingestion and one for dataset fetching. Each update is stored
    as a commit, and each training dataset is stored as a versioned snapshot. Users
    employ a version hash string to fetch the related training data at any time (dataset
    reproducibility).

    - The sample dataset management service supports a special dataset type—a GENERIC
    dataset. GENERIC dataset has no schema and no data validation, and users can upload
    and download data free, so it’s good for prototyping new algorithms. Once the
    training code and dataset requirements become mature, the dataset format can be
    promoted to a strongly typed dataset.

    - Delta Lake and Petastorm work together to set up a dataset management service
    for Spark-based, deep learning projects.

    - Pachyderm is a lightweight, Kubernetes-based data platform that offers data
    versioning support in Git style and allows easy pipeline setup. A pipeline is
    made by docker containers; it can be used to automate data process workflow and
    training for a deep learning project.'
