  md: "# 9.3.3 Metaflow\n\nMetaflow is a human-friendly Python library that focuses\
    \ on MLOps. It was origi-\nnally developed at Netflix and open-sourced in 2019.\
    \ Metaflow is special in that it\nfollows a humancentric design; it's not only\
    \ built for automating workflows but also\naims to reduce the human time (operational\
    \ cost) spent in deep learning project\ndevelopment.\n\nIn section 9.1.3, we pointed\
    \ out that the conversion from prototyping to pro-\nduction workflow generates\
    \ a lot of friction in ML development. Data scientists have\nto construct and\
    \ test a new version of the workflow for each model development\niteration. To\
    \ bridge the gap between prototyping and production, Metaflow made\ntwo improvements:\
    \ first, it simplifies workflow construction, and second, it uses\nthe workflow\
    \ execution experience between the local and production environments\n(see figure\
    \ 9.7).\n\n![](img/9dbecddeac1b6cad2e240ace2b0d4b22_286_0.png)\n\nFigure 9.7 Metaflow\
    \ offers a unified development experience between prototyping and production.\n\
    \nIn 9.7, we can see that Metaflow treats both prototyping and production environ-\\\
    ments as first-class execution environments. Because the Metaflow library offers\
    \ a set of\nunified APIs to abstract the actual infrastructure, a workflow can\
    \ be executed in the same\regardless of which environment it runs on. For example,\
    \ a workflow can be run by\nboth a local scheduler and a production scheduler\
    \ without any change. The local sched-\nuler executes workflows locally whereas\
    \ the production scheduler integrates into other\nproduction orchestration systems,\
    \ such as AWS Step Functions or Argo Workflows."
