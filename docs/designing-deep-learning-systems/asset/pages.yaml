- pgno: 298
  md: '# 10.1 Preparing for productionization 277


    By using a versioned dataset for training, Alice is sure that the input training
    data of all her experimental model training runs are the same. She also uses a
    source-control management system, as Git, to keep track of her code so that all
    experimental models can be traced back to a version of her code.


    Notice model training at this stage usually takes place locally at the computing
    node where the notebooking environment is hosted, so it is a good idea to allocate
    sufficient resources to these nodes. If training data is stored over the network,
    make sure the read speed does not become a bottleneck for model training.


    # 10.1.2 Prototyping


    Prototyping is where research is bridged with real-world use cases. It is a practice
    of looking for the right combination of training data, algorithm, hyperparameter,
    and inference support to provide the right deep learning feature that meets requirements.


    At this stage, it is still very common to find notebooking environments to be
    the top choice for data scientists and engineers due to the rapid iterative nature
    of prototyping. A fast turnaround is expected. Let''s walk through one possible
    scenario of prototyping:


    +   1 The model development team receives requirements to improve the motion detection
    of a security camera product.

    2 Based on the requirements, the team finds that Alice''s new vision recognition
    training algorithm may improve motion detection.

    3 The team creates a new notebook and begins exploring data that is relevant for
    model training, given the set of algorithms that they picked:

    a The team may be able to use existing, collected data for model training if they
    happen to fit the problem that is being solved.

    b In some cases, the team may need to collect new data for training.

    4 In most cases, transfer learning is applied at this stage, and the team picks
    one or more existing models as source models.

    5 The team develops modeling code with algorithms and trains experimental models
    with collected data and source models.

    6 Experimental models are evaluated to see whether they yield satisfactory results.
    Steps 3 to 6 are repeated until the training data shape and code become stable.


    We call steps 3 to 6 the exploratory loop. This loop corresponds to the iterate
    circles in the blow-up section of prototyping in figure 10.3. When prototyping
    begins, the loop is iterated rapidly. The focus at this stage is to narrow down
    the training data shape and code.'
