    # 2.2.8 Service design recap


    Let''s recap how this dataset management service addresses the five design principles
    introduced in section 2.1.2:


    +   * Principle 1—Support dataset reproducibility. Our sample DM service saves
    all the generated training data as a versioned snapshot with a version hash as
    key. Users can apply this version to obtain the training data snapshot at any
    time.

    * Principle 2—Provide a unified experience across different dataset types. The
    data ingestion API and training fetching API work the same way for all dataset
    types and sizes.

    * Principle 3—Adopt strongly typed schema. Our sample TEXT_INENT type and IMAGE_CLASS
    type utilize a self-defined schema to row both ingestion and training data.

    * Principle 4—Ensure API consistency and handling scaling internally. Although
    we save all datasets'' metadata in our copy (for simplicity), we can easily implement
    the dataset storage service in cloud object storage; in theory, it has infinite
    capacity. We require data URLs to send and return data, so no matter how large
    a dataset is, our API remains consistent.

    * Principle 5—Guarantee data persistence. Every dataset creation request and update
    request creates a new commit; every training data prepare requests'
