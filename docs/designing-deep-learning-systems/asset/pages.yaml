  md: 'Third, we can work on improving the availability of model training. In section
    4.2, we discussed that distributed training is fragile; it requires every worker
    to perform consistently. If one worker fails, the entire training group fails,
    which is a huge waste of time and budget. The effort spent on training-process
    monitoring, failover, and failure recovery would be much appreciated by data scientists.


    # Data parallelism or pipeline parallelism?


    Now we know that there are two major strategies for distributed training: data
    parallelism and pipeline parallelism. You might understand these concepts, but
    you might still be uncertain about when to use them.


    We would suggest always starting with model training on a single machine. If you
    have a large dataset and the training takes a long time, consider distributed
    training. We always prefer data parallelism over pipeline parallelism merely data
    parallelism is simpler to implement and we can obtain results quicker. If the
    model is so big that it can''t load on one GPU, pipeline parallelism is the right
    choice.


    # Summary


    +   - Distributed training has two schools of thought: data parallelism and model
    parallelism. Pipeline parallelism is an improved version of model parallelism.

    - If a model can be loaded into one GPU, data parallelism is the primary method
    to implement distributed training; it''s simple to use and provides great improvements.

    - Using Kubernetes to manage the computing cluster can greatly reduce the complexity
    of resource management.

    - Although each training framework (TensorFlow, PyTorch) offers different configurations
    and APIs to write distributed training code, their code pattern and workflow are
    very similar. Thus, a training service can support the various distributed training
    codes with a unified approach.

    - After encapsulating the setup configuration of various frameworks, a training
    service can still treat training code as a black box, even in the distributed
    training.

    - To obtain data parallelism progress status, you only need to check the master
    worker because all workers are always in sync with each other. Also, to avoid
    duplicated models from all when their training jobs complete, you can set the
    training to persist checkpoint files only when the code is executed by the master
    worker.

    - Horovod is a great distributed training framework. It offers a unified method
    to run distributed training code in various frameworks: PyTorch, TensorFlow, MXNet,
    and PySpark. If a training code uses Horovod to implement'
