- pgno: 242
  md: '# 7.5 Releasing models


    In 7.13, we see the metadata store has two sections: the model lookup table and
    the metadata list. The metadata list is just pure metadata storage; all the metadata
    objects are stored in this list. The model lookup table is used as an index table
    for quick searches. Each record in the lookup table points to an actual metadata
    object in the metadata list.


    Training service can register models automatically to the metadata store after
    training completes. Data scientists can also register models manually, which often
    happens when data scientists want to deploy the model locally (without using the
    deep learning system).


    When the metadata store receives a model register request, it creates a metadata
    object for this model. Second, it updates the model lookup table by adding a new
    search record; the record enables us to find metadata object by using the model
    name and version. Besides searching the lookup table by using the model name and
    version, the metadata store also allows a metadata search by using the model ID.


    The actual model files are stored in the artifact store—cloud object storage,
    as Amazon S3. A model''s storage in the artifact is saved in the metadata object
    as a pointer.


    Figure 7.13 shows two records in the model lookup table for model A: 1.0.0 and
    1.1.0. Each search record maps to a different metadata object (respectively, ID
    = 12345 and ID = 12346). With this storage structure, we can find any metadata
    by using the model name and model version; for example, we can find metadata object
    ID = 12346 by searching “model A” and version “1.1.0”.


    Using the model''s canonical names and versions to find the actual metadata and
    model files is foundational to the prediction service''s ability to serve different
    models at the same time. Let''s see how the metadata store is used in the prediction
    service in the next section.


