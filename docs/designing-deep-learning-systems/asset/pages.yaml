- pgno: 191
  md: 'The design in figure 6.4 generally works for any application that has a web
    back-end and only one model. The key component in this design is the predictor;
    it is a service and often runs as a Docker container. We can implement this approach
    quickly because this predictor can be easily converted from the model container
    that builds the model. The two main work items that transform a training container
    to a predictor are the web predict API and the evaluation mode in the training
    neural network. We will present a concrete predictor container in example 7.1.


    # DIRECT MODEL EMBEDDING APPROACH


    Another design for building a single model application is combining the model
    execution code with the application''s user logic. There is no server back-end,
    so everything happens locally on the user''s computer or phone. Using the face
    swap app as an example, the પોતાના model file is in the application''s deployment
    package, and when the application starts, the model is loaded into the application''s
    process space. Figure 6.5 illustrates this concept.


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_191_0.png)


    Model serving doesn''t have to run in a separate service. In figure 6.5, we see
    that the model serving code (the single model box) and the data transformation
    code can run with the user logic in the same application. Nowadays, many deep
    learning frameworks provide libraries to run models in non-Python applications.
    For example, TensorFlow offers Java, C++, and JavaScript SDK to load and execute
    models. With SDK''s, we can train and execute models directly in Java/C++ JavaScript
    applications.


    > NOTE Why should we consider direct model embedding? By using model embedding,
    we can directly integrate model logic with application logic and run them together
    in the same process space. This provides two advantages over the predictor service
    approach in figure 6.4. It reduces one network hop; there is no web request to
    the predictor, and model execution happens locally. Second, it improves service
    debuggability because we can run the application as one piece locally.'
  merge: -1
