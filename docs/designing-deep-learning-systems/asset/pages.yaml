  md: '# Summary


    The programmatic metadata access is not only helpful when using your analysis
    tool (for example, pandas) to query and compare the model performance of different
    training runs, but also for integrating models with your model serving system
    since it allows you to fetch models from the MLflow model registry programmatically.
    For full MLflowClient API usage, you can check out the MLflow Tracking API doc
    (http://mlng.bz/GRZo).


    # 8.4.3 MLflow vs. LMMD


    From the descriptions in the previous sections, we see that LMMD is more of a
    lightweight weight library while MLflow is an MLOps platform. Both tools can run
    independently, offer metadata ingestion and search functionality, and track metadata
    on the basis of model training runs. But MLflow offers much more.


    In addition to LMMD''s functionality, MLflow supports automatic metadata logging
    and a well-designed UI to visualize experiment metadata (including experiment
    comparison), model registry, artifact management, code reproducibility, model
    package, and more.


    If you need to introduce a complete, new metadata and artifact store to your system,
    MLflow is your first choice. It is supported by an active open source community,
    and it covers most of the user requirements for ML metadata management. As a bonus,
    MLflow has great support on MLOps, as MLflow project management and model deployment.


    If you already have an artifact registry and a metric visualization website and
    you want to integrate metadata functionality into your existing system, then LMMD
    is a good choice. LMMD is lightweight, easy to use, and simple to learn. For example,
    the Keflow (https://www.kubeflow.org/) deep learning platform integrates LMMD
    as the metadata tracking tool into its components, as Keflow pipeline (https://www.kubeflow.org/docs/components/pipelines/).


    # Summary


    +   * Machine learning metadata can be categorized into four buckets: model training
    runs, general artifacts, model artifacts, and pipelines.

    * A metadata and artifact store is designed to support model performance comparison,
    troubleshooting, and reproducing.

    * A good metadata management system can help to show model lineage, enable model
    reproducibility, and facilitate model comparison.

    * LMMD is a lightweight metadata management tool, which originated from the TensorFlow
    pipeline, but it can be used independently. For example, Keflow uses LMMD to manage
    ML metadata in its pipeline component.

    * LMMD is good for integrating metadata management into an existing system.

    * MLflow is an MLOps platform; it''s designed to manage the ML lifecycle, including
    experimentation, reproducibility, deployment, and a central model registry.

    * MLflow is applicable if you want to introduce a completely independent metadata-data
    and artifact management system.'
