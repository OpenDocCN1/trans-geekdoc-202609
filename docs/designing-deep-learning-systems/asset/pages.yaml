  md: '# 7.1.3 The frontend service


    Now, let''s focus on the frontend service. The frontend service has three main
    components: a web interface, a predictor management, and a predictor client (CustomGrpcPredictorBackend).
    These components respond to the host public gRPC model serving the API and manage
    the backend predictors'' connection and communication. Figure 7.2 shows the internal
    structure of the frontend service and its inner when receiving a prediction request.


