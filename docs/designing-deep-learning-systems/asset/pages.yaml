  md: '# 3.5 When to use the public cloud


    # REDUCING INFRASTRUCTURE COST


    Using the cloud provider''s AI platform will charge you premium dollars compared
    to operating on your own services. You may not care so much about your bill at
    the prototyping phase, but after the product is released, you certainly should.


    Using Amazon SageMaker as an example, at the time this book was written (2022),
    SageMaker charged $0.461 per hour for an m5.xlarge type (eight virtual CPUs, 32
    GB memory). If you launch an Amazon EC2 instance (VM) on this hardware specifically,
    it charges $0.384 per hour. By building your own training service and operating
    on the Amazon EC2 instances directly, you save nearly 20% on average for model
    building. If a company has teams doing model training daily, a self-built training
    system will give you an edge over your competitors.


    # CUSTOMIZATION


    Although the cloud AI gives you a lot of options for the workflow configuration,
    they are still black-box approaches. Because they are the one-for-all approach,
    these AI platforms form on the most common scenarios. But there are always exceptions
    that you need to customize for your business; it won''t be a good experience when
    there aren''t many choices.


    Another problem for the cloud AI platform is it always has a delay in adopting
    new technologies. For example, you have to wait for the SageMaker team''s decision
    on whether to support a training method and when to support it, and sometimes
    decision is not agreeable to you. Deep learning is a rapidly developing space.
    Building your own training service can help you to adopt the latest research and
    pivot quickly, which will give you an edge over the competition.


    # PASSING COMPLIANCE AUDITS


    To run some businesses, you need to obtain certificates for compliance laws and
    regulations—example, HIPAA (Healthcare Insurance Portability and Accountability
    Act) or CCPA (California Consumer Privacy Act). These certifications require you
    to provide not only that your code meets these requirements but also that the
    infrastructure on which your application runs compliant. If your application is
    built on Amazon SageMaker and Google Vertex platforms, they also need to be in
    compliance. As cloud vendors are a black box, running through checklists and providing
    evidence is an unpleasant task.


    # AUTHENTICATION AND AUTHORIZATION


    Integrating authentication and authorization functionality into cloud AI platforms
    and in-house auth services (on-premises) requires a lot of effort. Many companies
    have their own version of auth services to authenticate and authorize user requests.
    If we adopt SageMaker as the AI platform and expose it to different internal services
    for various business purposes, bridging SageMaker auth management with the in-house
    user auth management services is not going to be easy. Instead, building on-premises
    training services is a lot easier because we can change our API freely and simply
    integrate it into existing auth services.'
