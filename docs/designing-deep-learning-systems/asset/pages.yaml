    \ cluster, and a Docker image is the ideal method to run the model training remotely.\n\
    \nThere are two things we need to pay attention to when preparing the Docker image:\
    \ defining hyperparameters as command-line arguments of the training code and\
    \ reporting metrics to Katib. Let's look at an example.\n\nFirst, we define the\
    \ hyperparameters to be optimized as command-line arguments in the training code.\
    \ Because Katib needs to execute the docker container for different hyperparameters,\
    \ the training code needs to take the hyperparameter value from the command-line\
    \ arguments. In the next example, we define two hyperparameters to lr (learning\
