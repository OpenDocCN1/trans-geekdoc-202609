  md: 'sharing. To understand these reasons, let''s look at three sample training
    workflows in figure 9.2.


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_270_0.png)


    Training workflow A

    Training workflow B\Training workflow C


    Figure 9.2 Deep learning workflows are composed of reusable tasks.


    +   1. Auth step

    2. Data pull step

    3. Embedding pull step

    4. Training step

    5. EPO step

    6. Model release step


    A great benefit of using a workflow is that it turns a large chunk of code into
    a group of sharable and reusable components. In figure 9.2, we imagined three
    scientists working on three model projects (A, B, and C). Because each project''s
    training logic is different, data scientists developed three different workflows
    (A, B, and C) to automate their model training processes. Each workflow has DAGs,
    the steps in each DAG are highly overlapped. For example, the total six steps
    are sharable and reusable. For example, the auth step (step 1) is the first step
    for all three workflows.


    Having reusable steps can greatly improve scientists'' productivity. For example,
    to pull data from a DM service (step 2 in figure 9.2), data scientists need to
    learn how the DM API works. But if someone built a DM pull method as a step function,
    scientists can just reuse this step in their workflow without learning how to
    interact with the DM service. Everyone writes their project in the form of a workflow,
    we have lots of reusable steps, which will save lots of duplicate effort at an
    organizational level!


    Another reason that a workflow is well adapted to deep learning development is
    that it facilitates collaboration. Model development requires teamwork; a dedicated
    team work on data while another team works on the training algorithm. By defining
    a complex model-building process in the workflow, we can dispatch a complex project
    in pieces (or steps) and assign them to different teams while keeping the project
    organized and the components in proper order. The workflow DAG shows the dependencies
    for all the project participants to see.


    In short, a good workflow orchestration system encourages work sharing, facilitates
    team collaboration, and automates complicated development scenarios. These merits
    make workflow orchestration a crucial component of deep learning project development.'
