  md: "# C.2 Getting started with Katib 315\n\n```\ntrialTemplate:\nprimaryContainerName:\
    \ training-container\ntrialParameters:\n  name: learningRate\n  description: Learning\
    \ rate for the training model\n  reference: lr\n  name: numLayers\n  description:\
    \ Number of training model layers\n  reference: num-layers\n  name: optimizer\n\
    \  description: Training model optimizer (sdg, adam or ftrl)\n```\n\n```\ntrialSpec:\n\
    \  apiVersion: batch/v1\n  kind: Job\n  spec:\n    containers:\n      name: training-container\n\
    \      image: docker.io/kubeflowkatib/mnistnet-mnist:latest\n      command:\n\
    \        - \"python\"\n        - \"/opt/mnistnet-mnist/mnist.py\"\n        - \"\
    --batch-size=64\"\n        - \"--lr=${trialParameters.learningRate}\"\n      \
    \  - \"--num-layers=${trialParameters.numLayers}\"\n        - \"--optimizer=${trialParameters.optimizer}\"\
    \n  restartPolicy: Never\n```\n\nKatib provides sample experiment configuration\
    \ files for each HPO algorithm it supports; you can find them in the Katib GitHub\
    \ repo: katib/examples/vlbetal/hp-tuning (http://mg.be/dJVN)\n\n# C.2.5 Step 5:\
    \ Start the experiment\n\nOnce we define the experiment configuration and save\
    \ it in a YAML file, we can run the following command to start the experiment:\n\
    \n```\n$ kubectl apply -f bayesian-optimization.yaml\nexperiment.kubeflow.org/bayesian-optimization\n\
    ```\n\n```\n$ kubectl get experiment -n kubeflow\n\nNAME                  TYPE\
    \      STATUS  AGE\nbayesian-optimization Created  True    6s\n```\n\nFrom the\
    \ return of the kubectl get experiment -n kubeflow, we see the experiment bayesian-optimization\
    \ is created as an CRD resource. From now, Katib will own the HPO experiment completely\
