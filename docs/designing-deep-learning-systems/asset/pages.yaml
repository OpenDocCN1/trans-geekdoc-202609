    Figure 8.5 An entity relationship diagram of the data schema of the metadata storage


    The detailed metadata for model training is saved in the Metrics and Parameters
    objects. The Parameters object stores the input parameters of the training run,
    as dataset ID, dataset version, and training hyperparameters. The Metrics object
    stores the metrics produced during training, as model F2 score.


    The Experiments objects are used to organize and group model training runs. One
    experiment can have multiple training runs. For example, we could define our intent
    classification model development project as one experiment and then associate
    all the intent classification model training execution with this experiment. Then,
    on the UI, we can group training executions by different experiments.


    The Models objects store the metadata of model files, as model version, type,
    and stage. A model can have multiple stages, such as test, preproduction, and
    production, and all of them can be preserved as well.


