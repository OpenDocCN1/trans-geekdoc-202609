  md: '# 2.3 Open source approaches


    THE LIMITATIONS OF DELTA LAKE

    The biggest risks of using Delta Lake are lock-in technology and its steep learning
    curve. Delta Lake stores tables in its own mechanism: a combination of Parquet-based
    storage, a transaction log, and indices, means it can be written/read by a Delta
    cluster. You need to use Delta ACID API for data ingestion and Delta JDBC to run
    queries; then, the migration cost would be high if you decide to move away from
    Delta Lake in the future. Also, because Delta Lake goes with Spark, there is a
    lot of learning ahead of if you are new to Spark.


    Regarding ingestion performance, Delta Lake stores data to the underlying cloud
    store, and it''s difficult to achieve low-latency streaming (millisecond scale)
    when using store operations, such as table creation and saving. In addition, Delta
    Lake needs to update indices for each ACID transaction; it also introduces latency
    with some ETLs performing append-only data writes. But in our opinion, data ingestion
    latency at the second level is not a problem for deep learning projects. If you
    are unfamiliar with Spark and Pachyderm and don''t want the heavy lifting of using
    Spark and Delta Lake clusters, we have another lightweight approach for you— Pachyderm.


    # 2.3.2 Pachyderm with cloud object storage


    In this section, we want to propose a lightweight, Kubernetes-based tool—Pachyderm—to
    handle dataset management. We will show you two examples of how to use Pachyderm
    to accomplish image processing and labeling. But before that, let''s look at what
    Pachyderm is.


    PACHYDERM

    Pachyderm is a tool for building version-controlled, automated, end-to-end pipelines
    for data science. It runs on Kubernetes and is backed by an object store of your
    choice (e.g., Amazon S3). You can write your own Docker images for data scraping,
    ingestion, cleaning, wrangling, and use the Pachyderm pipeline to chain them together.
    Once you define your pipelines, Pachyderm will handle the pipeline scheduling,
    executing, and scaling.


    Pachyderm offers dataset version control and provenance (data lineage) management.
    It sees every data update (create, write, delete, etc.) as a commit, and it also
    tracks the store that generates the data update. So not only can you find the
    history of a dataset, but you can also roll back the dataset to a past version
    and find the change. Figure 2.18 gives a high-level view of how Pachyderm works.


    In Pachyderm, data is version-controlled with a Git style. Each dataset is a repository
    (repo) in Pachyderm, which is the highest-level data object. A repository commits,
    files, and branches. Pachyderm only keeps metadata (such as audit history and
    branch) internally and stores the actual files in cloud object storage.


    The Pachyderm pipeline performs various data transformations. The pipelines execute
    a user-defined piece of code—for example, a docker container—to perform'
