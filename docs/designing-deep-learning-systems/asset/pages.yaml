  md: '# CHAPTER 10 Path to production


    Let''s briefly review this diagram, as it will provide a preview of the chapter.
    The first two phases in 10.2 are research and prototyping. Both of these efforts
    require rapid iteration and turnaround from model training and experimentation.
    The interaction interaction in these phases (steps 1–8) is a notebook environment.
    Using notebooks, researchers and data scientists use the dataset management service
    for tracking datasets (steps 2 and 6) and may use the training service and hyperparameter
    optimization library/service for model training and experimentation (steps 4 and
    8). We go over these phases in section 10.1, ending at the point where data shape
    and code become fairly stable and ready to be productionized. In other words,
    the team has come up with the more-or-less version, and it is ready to go through
    the final steps to release it to the public.


    In section 10.2, we will pick up from the previous section and walk through the
    productionization of models, up to the point where models are served to production
    inference traffic.


    DEFINITION Inference requests are inputs generated by a user or an application
    against a trained model to produce inferences. Take visual recognition as an example.
    An inference request can be a picture of a cat. Using a trained visual recognition
    model, or an inference, a label in the format of the code cat can be generated.


    This section corresponds to the third and final phase in 10.2. In productionization,
    pretty every service in our system will come into play. The dataset management
    service manages training data; the workflow management service launches and tracks
    workflows; the training service executes and manages model jobs; the metadata
    and artifacts stores and tracks code artifacts, trained models, and their metadata;
    and the model service serves trained models to inference request.


    From productionization, we move to deployment. In section 10.3, we look at a number
    of model deployment strategies that support updating models to new versions in
    production. strategies also support experimentation in production. The main focus
    here will be on the model service because this is where all inference requests
    are served.


    By walking through the full journey to production, we hope that we will be able
    to see how the first principles that we discussed in previous chapters affect
    the work of different parties that use the system to deliver deep learning features.
    Understanding that you gain from this chapter should help you adapt your own design
    to different situations. We will use the development of an image recognition product
    as an example to illustrate all the steps in action.


    # 10.1 Preparing for productionization


    In this section, we will look at the journey of a deep learning model from its
    birth to when it is ready to be productionized. In figure 10.3, we highlight the
    phases'
