    # 3.1 Model training service: Design overview


    In an enterprise environment, there are two roles involved in deep learning model
    training: data scientists, who develop model training algorithms (TensorFlow,
    PyTorch, or other frameworks), and platform engineers, who build and maintain
    the system that runs the model training code in remote and shared server farms.
    We call this system the model training service.


    A training service works as a training infrastructure to execute the model training
    code (algorithm) in a dedicated environment; it handles both training scheduling
    and compute resource management. 3.1 shows a high-level workflow in which the
    model training service runs a model training code to produce a model.


    The most common question asked about this component is why we would need to write
    a service to model training. For many people, it seems easier to write a simple
    bash script to execute the training code (algorithm) locally or remotely, such
    as with an Amazon Elastic Cloud Computing (Amazon EC2) instance. The rationale
    behind building a training service, goes beyond just launching a training computation.
    We will discuss it in detail in the next section.'
