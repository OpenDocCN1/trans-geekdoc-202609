    client to handle the request. In this case, it chooses Custom-GrpcPredictorBackend
    because we are demoing a self-built model serving for intent classification.

    5 The CustomGrpcPredictorBackend client first checks the existence of the model
    file in the shared model disk for model A. If the model hasn''t been downloaded,
    it uses the model URL (from metadata) to download model files from cloud storage
    to the shared disk.'
