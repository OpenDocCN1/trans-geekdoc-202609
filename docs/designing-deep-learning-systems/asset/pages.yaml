- pgno: 199
  md: '+   * The model service approach involves building a prediction service for
    each model, each version of a model, or each type of model.

    * The model server approach consists of building only one prediction service,
    but it can run models trained with different algorithms and frameworks and can
    run different versions of each model.

    * When designing a model serving system, the first component to understand is
    the use case, so we can decide which serving approach is most appropriate.

    * Cost efficiency is the primary goal for designing model serving systems; the
    cost includes service deployment, maintenance, monitoring, infrastructure, and
    service development.

    * For single model applications, we recommend the model service approach.

    * For multitenant applications, we recommend the model service approach with an
    in-memory model cache.

    * For supporting multiple applications with different types of models, the model
    server and prediction platform are the most suitable approaches. They include
    a unified prediction API, a routing component, a graph execution component, and
    multiple model server backends.'
