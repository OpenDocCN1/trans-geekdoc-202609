    # C.3 Expedite HPO


    HPO is a time-consuming and expensive task. Katib has three methods to explore
    the process: parallel trials, distributed training, and early stopping.


    # C.3.1 Parallel trials


    By specifying parallelTrialCount in the experiment configuration, you can run
    trials parallel. One needs to be aware that some of HPO algorithms do not support
    parallel trial execution. Because this type of algorithm has a requirement on
    the experiment sequence, the next trials need to wait until the current trial
    completes.'
  merge: -1
  img_proc: true
- pgno: 340
  md: "# C.3.2 Distributed trial (training) job\n\nTo get trial jobs completed faster,\
    \ Katib allows us to enable distributed training for running training code. As\
    \ explained in C.2 (step 4), Katib defines job types in trialTemplate for different\
    \ frameworks, such as PyTorch, Tensor-Flow, and MXNet.\n\nThe following is an\
    \ example of how to enable distributed training (one master, two workers) for\
    \ a PyTorch training code in the Katib experiment:\n\n```\ntrialTemplate:\n  primaryContainerName:\
    \ pytorch\n  trialParameters:\n    name: learningRate\n    description: Learning\
    \ rate for the training model\n    reference: lr\n    name: momentum\n    description:\
    \ momentum for the training model\n    reference: momentum\n  trialSpec:\n   \
    \ apiVersion: kubeflow.org/v1\n    kind: PyTorchJob\n  spec:\n    pytorchReplicas:\n\
    \      Master:\n        replicas: 1\n        restartPolicy: OnFailure\n      \
    \  template:\n          containers:\n            name: pytorch\n            image:\
    \ docker.io/kubeflowkatib/pytorch-mnist:latest\n            command:\n       \
    \       - \"python\"\n              - \"/opt/pytorch-mnist/mnist.py\"\n      \
    \        - \"--epochs=1\"\n              - \"--lr=${trialParameters.learningRate}\"\
    \n              - \"--momentum=${trialParameters.momentum}\"\n      Worker:\n\
    \    replicas: 2\n    restartPolicy: OnFailure\n    template:\n      containers:\n\
    \        name: pytorch\n        image: docker.io/kubeflowkatib/pytorch-mnist:latest\n\
    \        command:\n          - \"python3\"\n          - \"/opt/pytorch-mnist/mnist.py\"\
    \n          - \"--epochs=1\"\n          - \"--lr=${trialParameters.learningRate}\"\
    \n          - \"--momentum=${trialParameters.momentum}\" \n```\n\nIn the previous\
    \ example, we see the only difference compared to the nondistributed experiment\
    \ configuration in C.2 (step 4) is the trialSpec section. The job"
