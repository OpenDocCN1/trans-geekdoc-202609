  md: '![](img/9dbecddeac1b6cad2e240ace2b0d4b22_258_0.png)


    Figure 8.4 A general metadata and artifact store system design


    In figure 8.4, the sample metadata store system is composed of four components:
    a client SDK, a web server, backend storage, and a web UI. Each component and
    step in a deep learning workflow uses the client SDK to send metadata to the metadata
    store. The metadata store exposes a RESTful interface to metadata ingestion and
    querying. Besides the basic metadata and artifact organizing and searching, it
    can also visualize the model performance metrics and model differences for various
    training runs.


    The metadata store is at the center of this design. It has three layers—RESTful
    web interface, a data aggregator, and storage. The data aggregator component knows
    how the metadata is organized and interlinked, it knows where to add metadata
    and how to serve different kinds of metadata-searching queries. In terms of storage,
    we recommend building an abstract metadata and artifact storage layer. This abstract
    layer works works as an adapter that encapsulates the actual metadata and filestoring
    logic. The metadata store can run on top of different types of storage backends,
    as cloud object storage, local files, and a local or remote SQL server.'
