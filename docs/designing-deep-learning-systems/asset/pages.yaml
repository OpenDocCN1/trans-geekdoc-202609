- pgno: 112
  md: '# 3.3 A sample model training service


    B and C both submit request, user B''s and C''s requests will sit in the waiting
    job queue for a while until user A''s training requests complete. This is what
    happens when we treat the training cluster as a playing field for everyone: one
    heavy-use case will dominate the job scheduling and resource consumption.


    To solve this resource competition problem, we need to set boundaries within the
    training cluster for different teams and users. We could create machine pools
    each team or user can be assigned to a dedicated machine pool, each pool has its
    own GPU and machines, and the pool size depends on the project needs and training
    usage. Also, each machine pool can have a dedicated job queue, so the heavy users
    won''t affect other users. Figure 3.9 shows this approach at.


    NOTE The resource segregation approach, like the server pools method just mentioned,
    may not be efficient on the resource utilization front. For example, server pool
    A be extremely busy, whereas server pool B be idle. It is possible to define the
    size of each server pool in a range instead of a fixed number, such as a minimum
    of 5 servers and a maximum of 10 to improve resource utilization. Additional logic
    that either shuffles between pools or provides new servers can be applied.


    The ideal approach for implementing figure 3.10 is to use Kubernetes. Kubernetes
    allows you to create multiple virtual clusters by the same physical cluster, which
    is called a namespace. Kubernetes namespace is a lightweight machine pool that
    consumes few system resources.


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_112_0.png)


    If you are using Kubernetes to manage your service environment and your computing
    cluster, setting up such isolation is fairly easy. First, you create a namespace
    with a resource quota, such as the number of CPUs, memory size, and GPU counts;
    then, define the user and its namespace mapping in the training service.'
