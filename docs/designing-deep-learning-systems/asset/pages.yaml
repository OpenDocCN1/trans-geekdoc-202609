  md: "Once we finish local development and testing, it's time to push the workflow\
    \ to production, which can be achieved by the following commands:\n\n```\n# push\
    \ the workflow from local to AWS step functions\npython data_process_workflow.py\
    \ --with retry step-functions create\n```\n\n```\n# push the workflow from local\
    \ to Argo workflows\npython data_process_workflow.py --with retry argo-workflows\
    \ create\n```\n\nThese commands will export our data process workflow defined\
    \ in code listing 9.3 to AWS Step Functions and Argo Workflows. You can then search\
    \ for the flow by name within the AWS Step Functions UI or Argo Workflows UI and\
    \ hence see the exported flow.\n\nNOTE Metaflow offers a unified development experience\
    \ between local and production environments. Thanks to the unified API provided\
    \ by Metaflow, we have a seamless experience when testing our code locally and\
    \ in production. Regardless of the backend workflow orchestration system used,\
    \ Metaflow local scheduler, Argo Workflows, or AWS Step Functions, the Metaflow\
    \ user experience on the workflow development remains the same!\n\n# KEY FEATURES\n\
    \nMetaflow offers the following features:\n\n+   * *Codes as workflow*—Metaflow\
    \ lets users create a workflow by annotating Python code, which greatly simplifies\
    \ workflow construction.\n * *Reproducibility*—Metaflow preserves an immutable\
    \ snapshot of the data, code, and external dependencies to execute each workflow\
    \ step. Metaflow also records the metadata of each workflow execution.\n * *Versioning*—Metaflow\
    \ addresses the version control problem of an ML project by hashing all the code\
    \ and data in a workflow.\n * *Robust workflow execution*—Metadata proves dependency\
    \ management mechanisms at both the workflow level and step level by using the\
    \ @conda decorator. It also offers retry.\n * *Usability design for ML*—Metaflow\
    \ treats prototyping and production as equally important. It uses a set of unified\
    \ APIs to build the infrastructure, so the same code can run in the prototyping\
    \ environment and the production environment without any changes.\n *Seamless\
    \ scalability*—Metaflow integrates with Kubernetes and AWS Batch, which allows\
    \ users to define the required resource usage, and can parallel the workflow steps\
    \ over an arbitrarily large number of instances. By applying an annotation like\
    \ @batch(cpu=1, memory=500) to a step function, Metaflow will work with AWS Batch\
    \ to allocate the required resource to compute this step."
