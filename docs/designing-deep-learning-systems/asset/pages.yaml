  md: "# C.5 Adding a new algorithm\n\nthat, for any object, the actual state of the\
    \ Kubernetes world matches the desired state in the object. We call this process\
    \ reconciliation. For example, the reconciliation function in experiment_controller\
    \ reads the state of the cluster for an experiment object and makes changes (suggestion,\
    \ trial) based on the state read. By following this thought, we can start with\
    \ the reconciliation function of each controller to understand its core logic.\n\
    \nYou can find the experiment controller at pkg/controller.vibetal/experiment/experiment_controller.go,\
    \ suggestion controller at pkg/controller.vibetal/suggestion/suggestion_controller.go,\
    \ and trial controller at pkg/controller/vibetal/trial/trial_controller.go. Remember\
    \ to start with the reconcile function in these files.\n\n# DEBUGGING\n\nThe Katib\
    \ core application (katib-controller) runs as a console application. There is\
    \ no UI or web code in this console application, just pure logic code, its local\
    \ debugging setup is straightforward. To debug Katib, first set up your local\
    \ Kubernetes cluster and run katib locally with breakpoints, then you can start\
    \ the H process by creating a test experiment—example, kubectl apply -f [test_experiment.yaml].\
    \ The breakpoint in the reconcile function will be hit, and you can start to debug\
    \ and explore the code from.\n\nTo set up a local development environment, please\
    \ follow Katib's Developer Guide (http://mng.bz/vzP). The entry point for katib-controller\
    \ is at cmd/katib-controller/vibetal/main.go.\n\n> NOTE Katib is a production-quality\
    \ HBO tool. It runs with high reliability and stability. But to operate it on\
    \ a daily basis, we need to read its source code to understand its behavior so\
    \ we know how to steer it when an execution goes goes the script. By following\
    \ the workflow in C.2 and reading the reconcile function of each controller, you\
    \ will gain a great understanding of Katib in a few hours.\n\n# C.5 Adding a new\
