- pgno: 244
  md: '# 7.5 Releasing models


    release process to happen unknowingly, so customers aren''t aware of the underlying
    model version changes.


    In step 1 of the previous (7.5.2), users can request a model serving on any specified
    model version using the `/predict/{model_name}/{version}` API. This capability
    is crucial for evaluating multiple versions of the model, so we can prevent model
    performance regression.


    But in the production scenario, we don''t expect our customers to track the model
    versions and model IDs. Alternatively, we can define a few static version strings
    as variables to represent the newly released models and let customers use them
    in the prediction instead of using the real model version.


    For example, we can define two static model versions or tags, such as STG and
    PROD, which represent the preproduction and production environments, respectively.
    If the model associated with the PROD tag for model A is 1.0.0, we can call `/predict/model_A/PROD`
    and the prediction service will load model A and version 1.0.0 to run serving.
    When we upgrade the newly released version to 1.2.0—the `/predict/model_A/PROD`
    request will load on model version 1.2.0.


    With the special version/tag strings, users don''t need to remember model ID or
    versions; they just use `/predict/{model_name}_PROD` requests to consume the newly
    released model. Behind the scenes, we (data scientists or engineers) maintain
    the mapping between these special strings and the actual version in the metadata
    store''s lookup table, so the prediction service knows which model version to
    download for `/STG` or `/PROD` request.


    In our proposal, we named the operation of mapping a model version to the static
    model version *model release*. Figure 7.15 illustrates the model version release
    process.


    In 7.15, data scientists first register model A, version 1.0.0 to model A, PROD
    in the metadata store. Then in the lookup table, the (Model A, PROD) records change
    to point to the actual model object (ModelA, version:1.0.0). When users call `/predict/ModelA/PROD`
    in the prediction service, they are actually calling `/predict/ModelA/1.0.0.


    Next, when the prediction service receives a request with a version equal to STG
    or PROD, the service will search the lookup table and use the actual version,
    which is registered to PROD, to download model files. In 7.15, the prediction
    service will load model ModelA, version:1.0.0 for the `/ModelA/PROD` request,
    and it will load ModelA, version:1.1.0 for the `/ModelA/STG` request.


    For future model releases, data scientists only need to update the models to map
    the latest model version to STG and PROD in the metadata store''s lookup table.
    The prediction service will load the new model version automatically for new prediction
    requests. All of these operations happen automatically and are imperceptible to
    users.'
