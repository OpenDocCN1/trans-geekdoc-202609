    # 4.2.3 Writing distributed training (data parallelism) for different frameworks


    In this section, you will see some code snippets for data parallel distributed
    training in three training frameworks: TensorFlow, PyTorch, and Horovod. Don''t
    worry if the code samples here are difficult to parse. The purpose is to experience
    how data scientists handle distributed training on their side. This will give
    you a sense of how training frameworks enable distributed training.


    # PyTorch


    The PyTorch framework has a DDP library that implements data parallelism at the
    module level. The DDP wraps the model object so that it can run the object across
    multiple machines seamlessly. Its training processes can be placed on the same
    machine or across machines.


    To convert a single device/process training code to a data parallel-distributed
    training code, we need to make the following two modifications. We must initialize
    the training group by allowing each process to register with the master while
    the others claim to be the workers. Each training process will be pending at the
    registration stage until all workers joined the distributed group.


    To register a process, we need to know the total number of training processes
    (world_size), a unique ID for this process (rank), and the master''s address (define
    MASTER_ADDR and MASTER_PORT in environment variables). See the code sample below:


    ```

    def setup(rank, world_size):

    os.environ[''MASTER_ADDR''] = ''xxxx''

    os.environ[''MASTER_PORT''] = ''xxxx''


    # initialize the process, ''gloo'' is one of the communication

    # backends PyTorch, it also supports MPI and NCCL.

    # rank is the process''s rank, it''s a globally unique id

    # for this process. rank=0 means master process.

    # world_size is the total number of processes in this training group.

    dist.init_process_group(''gloo'', rank=rank, world_size=world_size)

    ```


    ```

    def cleanup():

    dist.destroy_process_group()

    ```


    Second, we use the DDP class to wrap the model object. The PyTorch DDP class will
    handle the distributed data communication, gradient aggregation, and local model
    parameter updates:'
