    from the data developer''s view, this dataset is mutable, because the pipeline
    keeps adding to it.


    Second, on the training data fetching side (from the top of the graph), we see
    that when fetching training data, the DM reads all the current data from the dataset
    at the same time point. We see that the data is returned as a static snapshot,
    which has a version string to uniquely identify the actual data picked from a
    dataset. For example, when we fetch training data from the dataset at time T2,
    the dataset has three batches (batch T0, batch T1, and batch T2). We package these
    three batches into a snapshot, assigning a version string "version1", and return
    as training data.


    From a model training perspective, the dataset fetched from DM is a static snapshot
    of the dataset—time-filtered plus logic-filtered dataset. The static snapshot
    is crucial to model reproducibility it represents the exact training files used
    in a training run. When we need to rebuild the model, we can use the snapshot
    version string to find the snapshot that was used in the past model training.


