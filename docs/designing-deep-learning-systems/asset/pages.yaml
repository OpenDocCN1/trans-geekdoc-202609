  md: '# 7.4 Touring open source model serving tools


    # HIGH-LEVEL ARCHITECTURE


    A TorchServe is composed of three components: the frontend, backend, and model
    store. The frontend handles TorchServe''s request/response. It also manages the
    life cycles of the models. The backend is a list of model workers that are responsible
    for running the actual inference on the models. The model store is a directory
    in which all loadable models exist; it can be a cloud storage folder or a local
    host folder. Figure 7.9 shows the high-level architecture of TorchServe instance.


    # TorchServe


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_230_0.png)


    Figure 7.9 A TorchServe architecture diagram (Source: Kuldeep Singh, "Deploying
    Named Entity Recognition model to production using TorchServe.\ *Analytics Vidhya*,
    2020)


    Figure 7.9 draws two workflows: model inference and model management. For model
    inference, the user sends a prediction request to the inference endpoint of a
    model, such as `/predictions/<model_name>/version`. Next, the inference request
    is routed to one of the worker processes that already loaded the model. Then,
    the worker process will read model files from the model store and let the model
    handler load the model, preprocess the input data, and run the model to obtain
    a prediction result.


    For model management, a model needs to be registered before users can access it.
    This is done by using the management API. We can also scale up and down the worker
    process count for a model. We will see an example in the upcoming usage section.'
  merge: -1
