  md: '# 6.1 Explaining model serving


    we work with data scientists to build model serving solutions, the confusion around
    serving terms causes a lot of miscommunication. In this section, we will explain
    the core concepts of model serving and interpret commonly used terminologies from
    an engineering perspective to help you avoid falling into the terminology trap.


    # 6.1.1 What is a machine learning model?


    There are multiple definitions of machine learning models in academia, from distilled
    representations of learnings of datasets to mathematical representations for recognizing
    certain patterns or making decisions based on unseen information. Nevertheless,
    as model serving developers, we can understand a model simply as a collection
    of files that are produced during training.


    The idea of a model is simple, but many people misunderstand that models are just
    static files. Although models are saved as files, they aren''t; they are essentially
    executables programs.


    Let''s take that statement and determine what it means. A model consists of a
    machine learning algorithm, model data, and a model executor. A model executor
    is a wrapper code of the machine learning algorithm; it takes user input and runs
    the algorithm to compute and return prediction results. A machine learning algorithm
    refers to the algorithm used in model training, sometimes also called model architecture.
    Using sequence translation as an example again, if the translation is trained
    by a sequence-to-sequence network as its training algorithm, the machine learning
    algorithm in the model is the same sequence-to-sequence network. Model data is
    the data required to run the machine learning algorithm, such as the neural network''s
    learned parameters (weights and biases), embeddings, and label classes. Figure
    6.1 illustrates a generic model structure.


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_182_0.png)


    Figure 6.1 A model is composed of a machine learning algorithm, model executor,
    and model data.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'NOTE We often refer to machine learning algorithms as model algorithms in this
    chapter for simplicity.


    The most important takeaway in this section is that the output of a model execution—simply,
    a model—isn''t a set of static data. In contrast, deep learning models are executable
    programs that include a machine learning algorithm and its dependent data, so
    the models can make predictions based on input data at runtime.


    NOTE Models are not only weights and biases. Sometimes data scientists see a neural
    network''s trained parameters—weights and biases—to a name and it "model file."
    This confuses people into thinking a model is a data file that contains only weights
    and biases, but we also need the algorithm and the wrapper code to run the prediction.


    # 6.1.2 Model prediction and inference


    Academics may consider model inference and prediction to be two separate concepts.
    A model inference can learn about how data is generated and understanding its
    causes and effects, whereas a model prediction might refer future events.


    A sample model prediction scenario might include sales records to train a model
    to predict which individuals are likely to respond to the next marketing campaign.
    A sample model inference scenario would include using sales records to train a
    model to understand the sales effect from the product price and customer income.
    The predictive accuracy on unseen data for model inference is not very important
    because the main focus is on the data generation process. Model training is designed
    to fit the full dataset.


    From an engineering perspective, model prediction and model inference mean the
    same. Although models can be built and used for different purposes, both model
    prediction and model inference in the context of model serving refer to the same
    action: executing the model with given data points to obtain a set of output values.
    Figure 6.2 illustrates the model serving workflow for the prediction model and
    the inference model; as you can see, there is no difference between them.


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_183_0.png)


    Figure 6.2 Model prediction and model inference are the same in model serving
    engineering.


    To simplify the text in the illustrations of this chapter, starting from figure
    6.2, we use the word model to represent model data, model executor, and machine
    learning (model) algorithm. This is not only to keep the text short but also to
    emphasize that the machine learning model is an executable program.'
