    # 3.5.1 When to use a public cloud solution


    If you run a startup or to validate your business idea quickly, using the public
    cloud AI is a good option. It handles all the infrastructure management and provides
    a standard workflow for you. As long as the predefined methods work for you, you
    can focus on developing your business logic, collecting data, and implementing
    model algorithms. The real benefit is the time saved on building your own infrastructure,
    so you can "fail early and learn."


    Another reason to use the public cloud AI platforms is that you have only a few
    deep learning scenarios, and they fit the public cloud''s standard-use case well.
    In this event, it''s not worth the resources to build a complicated deep learning
    system for just few applications.


    # 3.5.2 When to build your own training service


    Now, let''s talk about situations when you need to build your own training approach.
    If you have any of the following five requirements for your system, building your
    own training service is the way to go.


    BEING CLOUD AGNOSTIC


    You can''t use SageMaker or Google Vertex AI platforms if you want your application
    to be cloud agnostic because these systems are cloud specific. Been cloud is important
    when your service stores customer data because some potential customers have specific
    requirements on which your cloud don''t put to their data. You want your application
    to have the capability of running on various cloud infrastructures seamlessly.


    The common method of building a cloud-agnostic system on public clouds is to only
    the foundation services, such as virtual machines (VM) and storage, and build
    your application logic on top of it. Using model training as an example, when
    using Amazon Web Services, we first set up a Kubernetes cluster (Amazon Kubernetes
    Service (Amazon EKS)) using Amazon EC2 instance to manage the resources and then
    build our own training service with the Kubernetes interfaces to launch training
    jobs. In this way, when we need to migrate to Google Cloud (GCP), we can simply
    apply our training service to the GCP Kubernetes cluster (Google Kubernetes Engine)
    instead of Amazon EKS, and most of the service remains unchanged.'
