- pgno: 23
  md: '# CHAPTER 1 An introduction to deep learning systems


    other stages. We believe that engineers design better systems when they understand
    this cycle and know what each team does and what it needs to do its job.


    In 1.2, we start our discussion of deep learning system design with a sample architecture
    of a typical system that can be adapted for designing your own deep learning system.
    The components described in this work will be explored in greater detail in their
    own chapters. Finally, we will emphasize the differences between developing a
    model and developing a deep learning system. This distinction is often a point
    of confusion, so we want to clear it up right away.


    After reading this introductory chapter, you will have a solid understanding of
    the deep learning landscape. You will also be able to create your own deep learning
    system design, as well as understand existing designs and how to use and extend
    them, so you don''t have to build everything from scratch. As you continue reading
    this, you will see how everything connects and works together as a deep learning
    system.


    # Terminology


    Before proceed with the rest of the chapter (and the rest of the book), let''s
    clarify and a few terms that we use throughout the book.


    # Deep learning vs. machine learning


    Deep learning is machine learning, but it is considered an evolution of machine
    learning. Machine learning, by definition, is an application of artificial intelligence
    that includes algorithms that parse data, learn from that data, and then apply
    what it has learned to make informed decisions. Deep learning is a special form
    of machine learning that uses a programmable neural network as the algorithm to
    learn from data and make accurate decisions.


    Although this book primarily focuses on teaching you how to build the system or
    infrastructure to facilitate deep learning development (the examples are neural
    network algorithms), the design and project development concepts we discuss are
    all applicable to machine learning as well. So, in this book we use the terms
    deep learning and machine somewhat interchangeably. For example, the deep learning
    development cycle introduced in this chapter and the data management service introduced
    in chapter 2 work in the machine learning context, too.


    # Deep learning use case


    A deep learning use case refers to a scenario that utilizes deep learning technology—in
    other words, a problem you want to solve using deep learning. Examples include


    +   Chatbot—A user can initiate a text-based conversation with a virtual agent
    on a customer support website. The virtual agent uses deep learning model to understand
    what the user enters and carries on a conversation with the user like a real human.

    Self-driving car—A driver can put a car into an assistive driving mode that automatically
    steers itself according to road markings. Markings are captured by multiple cameras
    on board the car to form a perception of the road using deep learning-based computer
    vision technology.'
  merge: -1
  img_proc: true
