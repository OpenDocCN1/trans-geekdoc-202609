- pgno: 281
  md: '+   Great built-in operators to help build automation—Airflow offers lots of
    predefined operators that help users achieve tasks without coding.


    +   Solid task dependency and execution management—Airflow has an auto-retry policy
    built into every task, and it provides different types of sensors to handle runtime
    dependencies, such as detecting task completion, workflow run status change, and
    file presence.


    +   Extensibility—Airflow makes its sensors, hooks, and operators fully extendable,
    which allows it to benefit from a large amount of community-contributed operators.
    Airflow can also be easily integrated into different systems by adding custom
    operators.


    +   Monitoring and management interface—Airflow provides a powerful UI to get
    a quick overview of workflow/task execution and history. Users can also trigger
    and clear tasks or workflow runs from the UI.


    +   Production quality—Airflow provides many useful tools for maintaining the
    production environments, such as task logging, scaling, alerting, and restful
    APIs.


    # LIMITATIONS


    Although Airflow is a great workflow orchestration, we will still see several
    disadvantages when using it for deeep learning scenarios:


    +   High upfront cost for data scientists to onboard—Airflow has a steep learning
    curve to achieve tasks that are not supported by the built-in operators. Also,
    there is no easy way to do workflow local testing.


    +   High friction when moving deep learning prototyping code to production—When
    we apply Airflow to deploy learning, data scientists have convert their local
    model training code into Airflow DAG. This is extra work, and it is an unpleasant
    experience for data scientists, especially when considering that this is avoidable
    if we build workflow DAG from the model training code directly.


    +   High complexity when operating on Kubernetes—Deploying and operating Airflow
    on Kubernetes is not straightforward. If you are looking to adopt an orchestration
    system to run on Kubernetes, Airflow is a better choice.


    # 9.3.2 Argo Workflows


    Argo Workflows is an open source, container-native workflow engine for orchestrating
    parallel workflows/tasks on Kubernetes. Argo Workflows solves the same problem
    that Airflow addresses in a different way; it takes a Kubernetes-native approach.


    The biggest difference between Argo Workflows and Airflow is that Argo Workflows
    is built natively on Kubernetes. More specifically, the workflows and tasks in
    Argo Workflows are implemented as Kubernetes resource definition (CRD) objects,
    and each task (step) is executed as a Kubernetes pod. See figure 9.6 for a high-level
    system overview.'
