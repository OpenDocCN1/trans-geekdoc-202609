  md: '# Hyperparameter optimization service


    +   This chapter covers

    * Hyperparameters and why they are important

    * Two common approaches to hyperparameter optimization (HPO)

    * Designing an HPO service

    * Three popular HPO libraries: Hyperopt, Optuna, and Ray Tune


    In the previous two chapters, we saw how models are trained: a training service
    manages training processes in a remote cluster with given model algorithms. But
    most model algorithms and training services aren''t all there is to model training.
    There''s one more component we haven''t discussed yet—hyperparameter optimization
    (HPO). Data scientists often overlook the fact that hyper choices influence model
    training results significantly, especially when these decisions can be automated
    using engineering methods.


    Hyperparameters are whose value must be set before the model training process
    starts. Learning rate, batch size, and number of hidden layers are all examples
    of hyperparameters. Unlike the value of model parameters—weights and bias, for
    example—hyperparameters cannot be learned during the training process.'
