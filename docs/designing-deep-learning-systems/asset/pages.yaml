    # 7.6 Postproduction model monitoring


    Compared with monitoring other services, such as data management, in learning
    systems, the job is not complete after the model goes into production. We need
    not only to monitor and maintain the prediction service itself but also look at
    the performance of models that the service serves. Model drifting is a shift in
    the knowledge domain distribution that no longer matches the training dataset
    and leads to the deterioration of the model performance. This can happen when
    the model inference runs independently from the prediction service.'
