- pgno: 160
  md: '# 5.2 Understanding hyperparameter optimization


    Manually running HPO for the entire hyperparameter search space can be timeconsuming,
    error prone, and tedious, as one can see. Deep learning parameters usually have
    a complex configuration space, which often consists of a combination of continuous,
    categorical, and conditional hyperparameters as well as high dimensions. The deep
    learning industry is currently moving toward automatic HPO because manual HPO
    is simply not feasible.


    # AUTOMATIC HPO


    Automatic HPO is the process of using compute power and algorithms to automatically
    find the optimal hyperparameters for a training code. The idea is to use an efficient
    search algorithm to discover the optimal hyperparameters without human intervention.
    We also want the automatic HPO to run in a black-box fashion, so it is agnostic
    about the training code it is optimizing, and therefore we can easily onboard
    model training code to the HPO system. Figure 5.3 shows the automatic HPO workflow.


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_160_0.png)


    Figure 5.3 An automatic HPO workflow


    In step 1, data scientists submit HPO requests to the automatic HPO system, which
    runs the HPO process in a black-box fashion (figure 5.3). They input the hyperparameters
    to be optimized and their value space into the black box (the "automatic HPO"
    box in for example, the learning rate''s search space may be [0.005, 0.1] and
    dataset batch size''s search space may be [8, 16, 32, 64, 128, 256). Data scientists
    also need to configure the training execution, such as the training code; an evaluation
    method; an exit objective; and a trial budget, such as 24 trials for this experiment.


    Once users submit the HPO request, the HPO experiment (step 2) starts. The HPO
    system schedules all the trials and manages their training executions; it also
    runs an HPO algorithm to generate hyperparameter values (picking values from the
    search'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# CHAPTER 5 Hyperparameter optimization service


    space) for each trial. When the trial budget runs out or the training objective
    is met, the system returns a set of optimal hyperparameter values (step 3).


    Automatic HPO relies on two key components: the HPO algorithm and trial training
    execution management. We can find the optimal hyperparameter values with fewer
    compute resources using an efficient HPO algorithm. By using a sophisticated training
    management system, data scientists can be hands-free for the entire HPO process.


    > NOTE Because of the inefficiency of manual HPO, automatic HPO is the mainstream
    approach. To keep things clear, we will use the term HPO to refer to “automatic
    hyperparameter optimization” in the rest of this chapter.


    # 5.2.2 Popular HPO algorithms


    Most of HPO algorithms can be categorized into three buckets: model-free optimization,
    Bayesian optimization, and multifidelity optimization.


    > NOTE Because the main goal of this chapter is teaching HPO engineering, the
    HPO algorithms discussed here will stay at a high level. The goal of this section
    is to be able to build or set up an HPO system with enough background knowledge
    on HPO algorithms. If you want to know the mathematical reasoning behind the algorithms,
    please check out 1, “Hyperparameter Optimization,” by Matthias Feuer and Frank
    Hutter, of AutoML: Methods, Systems, Challenges (http://mg.bz/Alg) and the paper
    “For Hyper-Parameter Optimization,” by Bergstra et al. (http://mg.bz/Zo9A).


    # MODEL-FREE OPTIMIZATION METHODS


    In-free methods, data scientists make no assumptions about training code, and
    the correlation between HPO trials is ignored. Grid search and random search are
    the most commonly used methods.


    In grid search, users specify a limited set of values for each hyperparameter
    and choose trial hyperparameters from the Cartesian product of those values. For
    example, we can find specific value sets (search) for the learning rate as [0.1,
    0.005, 0.001] and data batch size as [10, 40, 100] and then build the grid with
    Cartesian products (as grid) of these sets, such as (0.1, 10), (0.1, 40), and
    (0.1, 100). After the grid is built, we can start the HPO trial with the values.


    Grid search suffers when the number of hyperparameters becomes larger or the parameter’s
    search space becomes bigger because the required number of evaluations will grow
    exponentially in this case. Another problem with grid search is its ineffectiveness.
    Because grid search treats each set of hyperparameter candidates equally, it will
    waste a lot of compute resources in the nonoptimal configuration space while not
    spending enough power on the optimal space.


    Random search works by sampling the hyperparameter configuration space at random
    until a certain budget for the search is run out. For example, we can set the
    search space for the learning rate to [0.001, 0.1] and data batch size to [10,
    100] and then set'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# 5.2 Understanding hyperparameter optimization


    the search budget to 100, which means it will run up to a total of 100 HPO trials.
    In each trial, a random value is selected from 0.001 and 0.1 as the learning rate,
    and a random value is selected between 10 and 100 as the data batch size.


    This approach has two advantages over grid search. First, random search can evaluate
    more values for each hyperparameter, which increases the chance of finding the
    optimal hyperparameter set. Second, random search has easier parallelization requirements;
    because all evaluations run completely parallel, they don''t need to communicate
    with each other, and a failed worker doesnt leave leaves in the search space.
    In grid search, a failed worker can skip the trial hyperparameters assigned to
    the worker in the HPO.


    The downside of random search is uncertainty; there is no guarantee an optimal
    set of hyperparameters can be found within a finite computing budget. In theory,
    if we allow for enough resources, random search can add sufficient random points
    in the search, so it will, as expected, find the optimum hyperparameter set. In
    practice, random search is used as a baseline.


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_162_0.png)


    Figure 5.4 Comparison of grid search and random search for minimizing a function
    with one important and unimportant parameter. (Source: Figure 1.1., of "Hyperparameter
