    data compliance, and troubleshooting model performance. For example, environment
    setup requires that the library dependencies of the training framework and code
    are installed properly on the training server before model training. Data compliance
    requires that the sensitive training data (user credit card numbers, payment records)
    is protected with restricted access. And performance troubleshooting requires
    that everything used in training, including dataset IDs and versions, training
    code versions, and hyperparameters, is tracked for model reproduction purposes.'
