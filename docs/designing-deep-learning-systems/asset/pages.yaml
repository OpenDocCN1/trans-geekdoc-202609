    # 1.1.3 Deep learning development cycle walkthrough


    By an example, we can demonstrate the roles and the process in a more concrete
    manner. Suppose you have been assigned the task of building a customer support
    system that answers questions automatically about the company''s product lines.
    The following steps will guide you through the process of bringing that product
    to market:


    +   1. The product requirement is to build a customer support application that
    sends a menu, so customers can find answers to commonly asked questions. As the
    number of questions grows, the menu becomes larger, with many layers of navigation.
    Analytics has shown that many customers are confused by the navigation system
    and drop off navigating the menu while trying to find answers.


    +   2. The product manager (PM) who owns the product is motivated to improve the
    user retention and experience (finding the answers quickly). After conducting
    some research with customers, the PM finds that a majority of customers would
    like to obtain answers without a complex menu system, preferably as simple as
    asking questions in their natural language.


    +   3. The PM reaches out to machine learning researchers for a potential solution.
    It turns out that deep learning may help. Experts think the technology is not
    enough for this case and suggest a few approaches based on deep learning models.


    +   4. The PM writes a spec indicating that the application should take one question
    from a customer at a time, recognize intent from the question, and match it with
    relevant answers.


    +   5. Data scientists receive product requirements and start to prototype deep
    learning models that fit the need. They start data collection to collect all available
    training data and consult with researchers for the choices of algorithms. Then
    data scientists start prototyping to produce experimental models. Eventually,
    they arrive at some datasets, a few training algorithms, and several models. After
    careful evaluation, one natural language process model is selected from various
    experiments.


    +   6. Then the PM assembles a team of platform engineers, MLOps engineers, and
    data engineers work with the data scientist to onboard the prototyping cycle,
    made in step 5, to production. The work includes building a continuous data processing
    pipeline and a continuous model training, deployment, and evaluation pipeline,
    as well as setting up the model serving functionality. The PM also specifies the
    number of predictions per second and the latency required.


