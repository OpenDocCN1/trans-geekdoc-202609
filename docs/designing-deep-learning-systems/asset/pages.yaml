  md: '# CHAPTER 5 Hyperparameter optimization service


    In the machine learning context, we assume there is some relationship between
    historical experiment (training trial) results and future experiment results.
    Specifically, we believe there is a math model for this relationship. Using the
    Bayesian approach—for example, in the Gaussian process—to model this relationship
    is a very strong assumption, we are given great power to make probable optimal
    predictions. A side bonus is we now have a way to handle the uncertainty of the
    model prediction result.


    NOTE you are interested in applying Bayesian optimization to deep learning projects,
    Quan Nguyen''s Bayesian Optimization in Action (Manning, 2022; https://www.manning.com/books/bayesian-optimization-in-action)
    is a good resource.


    WHICH EPO ALGORITHM WORKS BEST?

    No single EPO algorithm works best. Different optimization algorithms may differ
    tuning tasks under constraints. Some of these variables might include how the
    search space looks (e.g., hyperparameters types, values), how the trial budget
    looks, and what the goal is (eventual optimal or anytime performance). Figure
    5.6 shows an EPO selection guideline from the Optuna (https://optuna.org/) framework.


