  md: '# 8.2 Metadata in a deep learning context 231


    +   - Training code version—The unique identity of the training code snapshot
    used in model training.

    - Training code configuration—The configuration for recreating the training code
    execution environment, as conda.yml, Dockerfile, and requirement.txt.

    - Training metrics—The metrics show how model progresses, for example, the loss
    value at each training epoch.

    - Evaluation metrics—The metrics show the model performance, such as F-score and
    root-mean-squared error (RMSE).


    METADATA FOR GENERAL ARTIFACTS

    Artifacts can be any arbitrary files, such as datasets, models, and prediction
    results. To be able to find the artifact in artifact storage, we want to track
    below metadata for artifacts:


    +   - File location—The path to where the artifact is stored, for example, Amazon
    S3 file path or internal file system

    - File version—The unique identity to distinguish file updates

    - Description—The additional information to describe what''s inside the artifact
    file

    - Audit history—The information about who created the artifact version, when the
    artifact was created, and how it was created


    METADATA FOR MODEL FILE

    Models are one kind of artifact, but because models are the main product of deep
    learning system, we recommend tracking model metadata separately from other artifacts.
    When we define model metadata, it''s best to consider two perspectives: model
    training and model serving.


    For training, to have model lineage, we want to keep a mapping between a model
    and the model run that produced it. Model lineage is important for model comparison
    and reproduction. For example, when comparing two models, by having the link of
    model training and run, data scientists can easily determine all the details of
    how the model is produced, including the input datasets, training parameters,
    and training metrics. The model training metrics are very useful for understanding
    model performance.


    For serving, we want to track the model execution data for future model performance
    analysis. These execution data, such as model response latency and prediction
    rate miss, are very useful for detecting model performance degradation.

    The following are a few recommended model metadata categories besides the aforementioned
    artifact metadata:


    +   - Resource consumption—Memory, GPU, CPU, and TPU consumption for model serving

    - Model training run—The model run ID, which is used to find the code, dataset,
    hyperparameters, and environments that create the model

    - Experiment—Tracking the model experiment activities in production, for example,
    customer traffic distribution for different model versions'
