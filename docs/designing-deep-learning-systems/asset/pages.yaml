    # 7.1.5 Model eviction


    The sample code does not cover model eviction—that is, evicting infrequently used
    models from the prediction service''s memory. In the design, for every request,
    the prediction service will query and download the model from the metadata store
    and then initialize the model from the local disk to memory. For some models,
    these operations are time-consuming.


    To reduce latency for each model prediction, our design caches model graphs in
    the model manager component (in memory) to avoid loading a used model. But imagine
    that we could continue training new intent classification models and running predictions
    on them. These newly produced models will keep loading into the model manager''s
    model cache memory. Eventually, the predictor will run out of memory.


    To address such problems, the model manager needs to be upgraded to include a
    LRU (least recently used) eviction feature. For example, we could introduce the
    LRU to rebuild the model manager''s model cache. With the help of LRU, we can
    keep only the recently used model in the model cache and evict the least used
    models when the currently loaded model exceeds the memory threshold.


