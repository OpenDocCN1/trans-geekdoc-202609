    In this chapter, we will explore how to support distributed training from a software
    engineer''s perspective. More specifically, we will see how to write a training
    service to execute distributed training codes (developed by data scientists) in
    a group of machines.


    After reading this chapter, you will have a holistic view of how distributed training
    can work from the perspective of both a data scientist and a developer. You will
    know several distributed training strategies and distributed training code patterns,
    as well as how a training service facilitates different distributed training.


    # 4.1 Types of distributed training methods


    There are three major types of distributed training methods: model parallelism,
    data parallelism, and pipeline parallelism. Model parallelism is a strategy to
    split a neural network into several sequential subnetworks and run each subnet
    on different devices (GPU or CPU). In this way, we can train a large model with
    a group of GPUs.


    Pipeline parallelism is an advanced version of model parallelism. A major problem
    with model parallelism is that only GPU is active while the others are idle. By
    dividing each training batch into small microbatches, pipeline parallelism overlaps
    computations between layers to maximize GPU performance. This allows GPUs to run
    on multiple architectures at the same time. The GPUs'' throughput and device utilization
    improvement, resulting in a much faster training speed than model parallelism.


    Data parallelism partitions the dataset into smaller pieces and lets each device
    train separately. Because each device trains a smaller dataset, the training speed
    improves.


    Converting a single-device training to model parallelism or pipeline parallelism
    requires lots of code changes, including splitting the neural network into multiple
    subnetworks, running subnetworks on different GPUs, and copying the networks''
    output on different GPUs. The sheer quantity, as well as the complexity of these
    changes, make them problematic and hard to debug. Each algorithm might have a
    dramatically different model architecture, so no standardized method exists for
    splitting a model for model parallelism or pipeline parallelism. Data scientists
    must build the code by case.


    On the contrary, data parallelism requires only minimal code changes on a single
    device training code. And there are standardized patterns for converting a undistributed
    training code without changing the model algorithm or architecture. Also, data
    parallelism is relatively easy to both understand and debug. These merits make
    data parallelism our primary choice for distributed training.


    Although parallelism has a lot of advantages, model parallelism and pipeline parallelism
    have their own strengths and uses well. When you have large models'
