  md: '# 4.3.4 Updating and fetching the job status


    After creating training pods, the Kubernetes job tracker will continue querying
    the pod execution status and move the job to other jobs when its status changes.
    For example, if the pod is created successfully and starts running, the tracker
    moves the job from the launching list to the running list. If the pod execution
    is completed, the tracker moves the job from the running list to the finalized
    jobs list. Figure 4.5 depicts this process.


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_143_0.png)


    Figure 4.5 Track The Kubernetes job status: step 1, obtains the jobs in the running
    list; step 2, queries the pod execution status of each of the jobs running in
    the Kubernetes cluster; and step 3, moves the job to the finalized list if the
    pod execution is complete (success or failure).


    When a user submits a job query, the training service will search the job ID in
    all four queues in the memory store and return the job object. Interestingly,
    although there are multiple training pods, we only need to check the status of
    the master pod to track the distributed progress. This is because, for synchronous
    data training, all workers have to sync with each other in every training cycle,
    so the master pod can represent the other worker pods.


    The code for querying and updating job execution status is very similar to the
    Docker job tracker that we see in 3.3.5. The only difference is that we query
    the Kubernetes cluster instead of the Docker engine to obtain the training status.'
