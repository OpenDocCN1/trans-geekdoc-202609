  md: '# 1.1 The deep learning development cycle


    These terms are described as follows:


    +   - Model—A deep learning model can be seen as an executable program that contains
    an algorithm (model architecture) and required data to make a prediction.

    - Prediction and inference—Both model prediction and model inference refer to
    executing the model with given data to get a set of outputs. As prediction and
    inference are used widely in the context of model serving, they are used interchangeably
    in this book.

    - Model serving (prediction service)—This book describes model serving as hosting
    machine learning models in a web application (on the cloud or premises) and allowing
    deep learning applications to integrate the functionality through an API. The
    model serving program is usually referred to as the prediction service or model
    serving.


    # Deep learning application


    A deep learning application is a piece of software that utilizes deep learning
    technologies to solve problems. It usually does not perform any computationally
    intensive tasks, such as data crunching, deep learning training, model serving
    (with the exception of hosting models at the edge, such as an autonomous vehicle).
    Examples include:


    +   - A chatbot application that uses a UI or APIs to take natural sentences as
    input from a user, interprets them, takes actions, and provides a response to
    the user. Based on the model output calculated in the deep learning system (from
    model serving), the chatbot responds and takes action.

    - Self-driving software that takes input from multiple sensors, such as video
    cameras, proximity sensors, and LiDAR, to form a perception of a car''s surroundings
    with the help of deep learning models and drives the car autonomously.


    # Platform vs. system vs. infrastructure


    In this book, the deep learning platform, deep learning system, and deep learning
    infrastructure share the same meaning: an underlying system that provides all
    necessary support for building deep learning applications efficiently and to scale.
    We tend to use system most commonly, but in the context of this book, all three
    terms have the same meaning.


    Now that we''re all on the same page about the terms, let''s get started!


