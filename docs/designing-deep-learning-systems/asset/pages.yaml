    artifacts store (box E).


    It is usually necessary to perform intense computation on a large dataset to produce
    high-quality deep learning models that can make accurate predictions. Adoption
    of new algorithms and training libraries/frameworks is also a critical requirement.
    These requirements produce challenges on several levels:


    +   - *Capability of reducing training time*—Despite the growing size of training
    data and complexity of model architecture, training systems must keep times reasonable.

    - *Horizontal scalability*—An efficient production system should be able to support
    multiple training requests from different applications and users simultaneously.

    - *Cost of adopting new technologies*—The deep learning community is a vigorous
    one, with constant updates and improvements to algorithms and tooling (SDK framework).
    The training system should be flexible enough to accommodate innovations easily
    without interfering with the existing workload.


    In chapter 3, we will investigate different approaches to solving the aforementioned
