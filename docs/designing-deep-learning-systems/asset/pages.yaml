    Now, we want to add a new feature or attribute (such as text language) to a dataset,
    we need to gather every team, reach a consensus on the new data format, and implement
    the change. This is a huge effort because cross-team collaboration in corporations
    is complicated. It takes months to make a small change; because each team has
    its own priority, you have to wait on its to-do list.


    To make the situation worse, deep learning model development is an iterative process.
    It demands constantly tuning the dataset (including the upstream pipelines) to
    improve model accuracy. This requires data scientists, data developers, and platform
    developers to interact at a high frequency, because of the cross-team workflow
    setting, the data iteration happens slowly, which is one of the reasons model
    development is so slow in a production environment.


    Another problem is when we have multiple types of projects (image, video, and
    text) developing in parallel, the number of schemas will explode. If we let each
    team define new schemas freely without managing them, system backward compatibility
    is almost impossible. The new data updates will become more and more difficult
    because we have to spend extra time to make sure the new data update doesn''t
    break the projects built in the fact. As a consequence, the project development
    will slowly slow down.


    To address the iteration and data schema management problem, we can build a dataset
    management service. Let''s look at figure 2.4 to help determine the changes in
    the project workflow after introducing the dataset management service.


    In 2.4, we see a dataset management service that splits the model development
    into two spaces: data space and data scientist space.


