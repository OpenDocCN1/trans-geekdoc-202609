- pgno: 277
  md: '# CHAPTER 9 Workflow orchestration


    Fourth, a worker picks a task from the shared job queue; it returns the task definition
    from the metadata database and executes the task by running the task''s operator.
    During the execution, the worker saves the task''s output to the object store
    and reports the task''s execution status back to the metadata database.


    Last but not, Vena uses the web UI hosted on the web server to monitor the workflow
    execution. Because both the scheduler/controller components and the workers report
    the status to the metadata database in real time, the web UI always displays the
    latest workflow.


    # 9.2.3 Workflow orchestration design principles


    Because we have seen how workflow orchestration system works internally and externally,
    now it is time to examine the design principles that can make an orchestration
    system outstanding for deep learning scenarios. We hope you can use these principles
    as a guide to outlining your system or for evaluating source approaches.


    > NOTE The workflow orchestration system is one of the most complicated components
    in a deep learning system in terms of engineering effort, so don''t worry much
    about making your system match perfectly with these principles in the first few
    versions.


    PRINCIPLE 1: CRITICALITY

    Workflow orchestration is essentially a job scheduling challenge, so the bottom
    line for any orchestration system is to provide a solid workflow execution experience.
    A valid workflow should always be executed correctly, repeatedly, and on schedule.


    PRINCIPLE 2: USABILITY

    The measurement of an orchestration system in a deep learning context is how it
    optimizes data scientists'' productivity. Most data scientists interact in an
    orchestration system are workflow creation, testing, and monitoring. A user-friendly
    orchestration system should let users create, monitor, and troubleshoot workflows
    easily.


    PRINCIPLE 3: EXTENSIBILITY

    ater to the wide variety of deep learning infrastructures, people should easily
    define their own task operators and executors without worrying about where they
    are deployed. The orchestration system should provide the level of abstraction
    that suits your environment, if it''s Amazon EC2 or Kubernetes.


    PRINCIPLE 4: ISOLATION

    Two types of isolation are that critical: workflow creation isolation and workflow
    execution isolation. Workflow creation isolation means people cannot interfere
    with each other when creating workflows. For example, Vena submits an invalid
    workflow DAG or releases a new version of a common shared library that is referenced
    in other workflows, the existing workflows shouldn''t be affected.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# 9.3 Touring open source workflow orchestration systems 257


    Workflow execution isolation means that each workflow is running in an isolated
    environment. There should be no resource competition between workflows, and fail-ure
    workflow won''t affect other workflow''s executions.


    # PRINCIPLE 5: Scaling


    A good orchestration system should address the following scaling problems: han-dling
    large numbers of concurrent workflows and handling large expansive workflows.
    Concurrent workflow scaling generally means that given enough compute resources—for
    example, adding more workers to the worker group—the orchestration system can
    cater to an infinite concurrent number of workflow executions. Also, the system
    should always keep the service-level agreement (SLA) for every workflow. For example,
    a workflow should be executed at its scheduled time and no later than 2 seconds,
    regardless of how many other workflows are executing.


    For large, workflow scaling, the system should encourage users not to worry about
    performance, so they can focus on readable, straightforward code, and easy operations.
    When the workflow execution hits a limit—for example, the training operators take
    too long to execute—the orchestration system should provide some horizon-tal parallelism
    operators, as distributed training operators, to address single workflow problems.


    The main idea for deep learning orchestration is that we should solve the performance
    problem at the system level and ask users to write code with scalability in mind.
    This can lead to worse readability, harder debuggability, and increased operational
    burden.


    # PRINCIPLE 6: HUMAN-CENTRIC SUPPORT FOR PROTOTYPING AND PRODUCTION


    The capability of connecting the data scientist''s local prototyping to the production
    workflow is a requirement specific to support deep learning. It''s a key indicator
    that we use to evaluate whether an orchestration system is a good fit for deep
    learning systems.


    An orchestration system designed for deep learning project development is an iterative,
    ongoing effort from prototyping to production. Therefore, it will need a dedicated
    effort to help data scientists convert their local prototype code to production
    workflow in a seamless fashion.


    # 9.3 Touring open source workflow orchestration systems


    In this section, we will introduce three battle-tested workflow orchestration
    systems: Airflow, Argo Workflows, and Metaflow. These three open source systems
    are widely adopted in the IT industry and backed by active communities. In addition
    to introducing them generally, we also evaluate these workflows from the perspective
    of deep learning project development.


    To make a fair comparison, we implement pseudocode for the same workflow in Airflow,
    Argo Workflows, and Metaflow. Basically, if there is new data, we trans-form the
    data and save it to a new table in the database, and then we notify the data science
    team. Also, we expect the workflow to run daily.'
