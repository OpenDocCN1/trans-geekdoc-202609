  md: '# 7.4 Touring open source model tools 213


    For each model, Triton prepares a scheduler. The scheduling and batching algorithms
    are configurable on a model-by-model basis. Each model''s scheduler performs batching
    of inference requests and then passes the requests to the backend corresponding
    to the model type, as PyTorch backend for the PyTorch model. A Triton is the implementation
    that executes a model. It can be a wrapper around a deep learning framework, like
    PyTorch, TensorFlow, TensorRT, or ONNX Runtime. Once the backend performs inference
    using the inputs provided in the batched requests to produce the requested outputs,
    the outputs are returned.


    One thing worth noting is that Triton supports a C API which allows Triton to
    be extended with new functionality, as custom-pre and postprocessing or even a
    new deep learning framework. This is how we can extend the Triton server. You
    can check out the Triton-inference-server/backend GitHub (https://github.com/triton-inference-server/backend)
    to find Triton backend implementations. As a bonus, the models being served by
    Triton can be queried and controlled by a dedicated model management API that
    is available by HTTP/REST, gRPC protocol, or the C API.


    # Features


    Triton offers the following features:


    +   * Supports all major deep learning and machine learning framework backends.

    * Runs multiple models from the same or different frameworks concurrently on a
    single GPU or CPU. In a multi-GPU server, Triton automatically creates an instance
    of each model on each GPU to increase utilization.

    * Optimizes inference for real-time inferencing, batch inferencing to maximize
    GPU/CPU utilization, and streaming inference with built-in support for audio streaming
    input. Triton also supports model ensembles for use cases that require multiple
    models to perform end-to-end inference, such as conversational AI.

    * Handles dynamic batching of input requests for high throughput and utilization
    under strict latency constraints.

    * Updates models live in production without restarting the inference server or
    disrupting the application.

    * Supports multi-GPU, multinode inference of large models.


