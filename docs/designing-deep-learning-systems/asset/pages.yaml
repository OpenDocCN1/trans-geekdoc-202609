  md: '# 9.1.3 The challenges for using workflow orchestration in deep learning


    In the previous section, we saw how a workflow system can provide a lot of benefits
    to deep learning project development. But there is one caveat: using workflows
    to prototype type deep learning algorithm ideas is cumbersome.


    To understand how and why it is cumbersome, let''s look at a deep learning development
    process diagram (figure 9.3). This diagram should set the foundation for you to
    understand the challenges that workflow presents in the deep learning context.


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_271_0.png)


    9.3 A data scientist''s view of deep learning project development


    In 9.3, we see a typical deep learning project development process from a data
    scientist''s view. The process can be divided into two phases: the local incubation
    phase and the production phase.


    In the local incubation, data scientists work on data exploration and model training
    prototyping at their local/dev environment. When the prototyping is done and the
    project looks promising, data scientists start to work on production onboarding:
    moving the prototyping code to the production system.


    In the production phase, data scientists convert the prototyping code to a workflow.
    They break the code into multiple steps and define a workflow DAG and then submit
    the workflow to the workflow orchestration system. After that, the orchestration
    system takes over and runs the workflow on its schedule.


    # GAPS BETWEEN PROTOTYPING AND PRODUCTION


    If an engineer who works on workflow orchestration systems how they feel about
    the development process in figure 9.3, the answer likely is: It''s pretty good!
    But in practice, this process is problematic for data scientists.'
