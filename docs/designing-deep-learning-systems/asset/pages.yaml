- pgno: 46
  md: '# 1.2 Deep learning system design overview


    HOW KUBERNETES HELP

    Kubernetes is an open source container orchestration platform for scheduling and
    automating deployment, and scaling of containerized applications. Once you set
    up a Kubernetes cluster, your servers'' group (deployment, patching, updates)
    and resources become manageable. Here is a deployment example: you can tell Kubernetes
    to run a docker image with 16 GB memory and 1 GPU with a command; Kubernetes will
    allocate the resource to run this docker image for you.


    This is a huge benefit for software developers because not every of them has extensive
    experience with hardware and deployment. With Kubernetes, we only need to declare
    the end state of our cluster, and Kubernetes will do the actual job to meet your
    goals.


    Besides deployment benefits, the following are some key functionalities that are
    crucial for managing your training containers:


    +   - Autoscaling features—Kubernetes automatically resizes the number of nodes
    in the cluster based on the workload. This means if there is a burst of user requests,
    Kubernetes will add the capacity automatically, which is called elastic compute
    management.

    - Self-healing capabilities—Kubernetes restarts, replaces, or reschedules pods
    when they fail or when nodes die. It also kills pods that do not respond to defined
    checks.

    - Resource utilization and isolation—Kubernetes takes care of computing resource
    saturation; it ensures every server is fully utilized. Internally, Kubernetes
    launches application containers in pods. Each pod is an isolated environment with
    computing resource guarantee, and it runs a function. In Kubernetes, multiple
    pods can be in one node (server) as long as their combined resource requirements
    (CPU, memory, disk) do not exceed the node''s limitations, so servers can be shared
    by different units easily with guaranteed isolation.

    - Namespaces—Kubernetes splits a cluster into different virtual clusters. These
    virtual clusters are called namespaces. You can define resource quota per namespace,
    which allows you to isolate resources for different teams by assigning them to
    namespaces.


    On the flip side, these benefits come at a cost—they consume resources as well.
    When you run a Kubernetes pod, the pod itself takes some amount of resource (CPU,
    memory). These resources are consumed on top of those that are needed to run containers
    inside pods. Kubernetes'' overhead seems reasonable in many situations; for example,
    from an experiment published in the article “How We Minimized the Overhead of
    Kubernetes in Our Job System” (http://img.bz/DZBV) by Lally Singh and Ashwin Venkatesan
    (February 2021), the CPU overhead per pod was about 10 ms per second.'
  merge: -1
  img_proc: true
