  md: '# 3.4.3 Kubeflow training operator design


    Kubeflow training operators (TensorFlow operator, PyTorch operator, MPI operator)
    follow the Kubernetes operator design. Each training operator watches its kind
    of customer resource definition object—such as TFJob, PyTorchJob, and MPIJob—and
    creates the actual resources to run the training.


    For example, the TensorFlow operator processes any TFJob CRD generated in the
    cluster and creates the actual services/pods based on the TensorFlow spec. It
    synchronizes TFJob objects'' resource requests with the actual Kubernetes resources,
    as services and pods, and continuously strives to make the observed state match
    the desired state. See a visual workflow in figure 3.12.


    **Figure 3.12** The Kubeflow training operator workflow. A user creates a TFJob
    CRD object that defines a training request, and then the TensorFlow operator detects
    this object and creates actual resources to create the TensorFlow image. The TensorFlow
    operator also monitors the pod status and updates its status to the TFJob CRD
    object. The same workflow applies to the PyTorch operator.


    Each operator can run training pods for its own type of training framework. For
    example, the TensorFlow operator knows how to set up a distributed training pod
    group for training code written in TensorFlow. The operator reads the user request
    from the CRD definition, creates training pods, and passes the correct environment
    variables and command-line arguments to each training pod/container. You can check
    out the reconcileJobs and reconcilePods functions in each operator''s code for
    further details.


    Each Kubeflow operator also handles queue management. Because Kubeflow operators
    follow the Kubernetes operator pattern and create Kubernetes resources at the
