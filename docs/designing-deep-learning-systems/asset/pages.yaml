  md: '# 7.4 Touring open source model tools


    # 7.4.5 Integrating a serving tool into an existing system


    In many cases, replacing an existing prediction service with a new serving backend
    is not an option. Each serving tool has its own requirements for model storage,
    model registration, and inference request format. These requirements sometimes
    conflict with the existing system''s prediction interface and the internal model
    metadata and file systems. To introduce new technology without disrupting the
    business, we usually take an integration approach instead of completely replacing
    it.


    Here, we use the Triton server as an example of how to integrate a serving tool
    into an existing prediction service. In this example, we assume three things:
    first, the existing prediction service runs in Kubernetes; second, the existing
    web interface is not allowed to change; and third, there is a model storage system
    that stores model files in cloud storage, such as Amazon S3. Figure 7.11 shows
    the process.


    Figure 7.11 (A) illustrates the system overview. A list of Triton server pods
    is added before the existing prediction API. With the Triton load balancer, a
    prediction request can land on any Triton pod. We also added a shared volume that
    all Triton pods can access; this shared volume acts as a Triton model repository
    for all Triton instances.


    Figure 7.11 (B) shows what''s inside a Triton server Kubernetes pod. Each Triton
    pod has two containers: a Triton Server Container and a sidecar container. The
    Triton server container is the Triton inference we discussed in section 7.4.3.
    The model prediction happens in this container, and we can simply treat this container
    as a black box. The sidecar container acts as an adapter/proxy to prepare what
    Triton needs before forwarding the prediction request to the Triton container.
    This sidecar container downloads the model from cloud storage to the Triton local
    model repository (the shared volume), calls Triton to register the model, and
    converts the prediction request to the Triton API call.


    By using this integration approach, all the changes happen inside the prediction
    service. The public prediction API and the external model storage system remain
    untouched, and our users will not be affected when we switch to a Triton backend.
    Although we use a specific tool (Triton) and a specific infrastructure (Kubernetes)
    to demo the idea, you can apply this pattern to any other system as long as they
    use Docker.


    NOTE Because the Triton server supports major training frameworks and KServe provides
    a standardized serving protocol, we can combine them to produce a serving system
    that works for all kinds of models trained by different frameworks.'
  merge: -1
  img_proc: true
