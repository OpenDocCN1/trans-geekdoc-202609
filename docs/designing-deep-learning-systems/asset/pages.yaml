  md: '# 2.1 Understanding dataset management service


    A dataset management component or service is a specialized data store for organizing
    data in favor of model training and model performance troubleshooting. It processes
    raw data fed from upstream data stores and returns data in a well-defined structure—a
    dataset—for use in model training. Figure 2.1 shows the core value of dataset
    management service delivers. In free, we see that a dataset management component
    converts the raw data into a consistent data format that fits model training,
    so downstream model training applications just focus on algorithm development.


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_51_0.png)


    Figure 2.1 A dataset management service is a specialized data store; it ingests
    data into its internal storage with its raw data format. During training, it converts
    the raw data into training data in a consistent data format fits model training.


    # 2.1.1 Why deep learning systems need dataset management


    Let’s take a moment to explain why DM is a crucial part of any deep learning system
    before we start looking at the sample dataset management service. This section
    is important because from our experience, it is impossible to design a system
    that solves a real problem unless you fully understand the why.


    There are two answers to why. First, DM can help expedite development by decoupling
    the collection of training data from the consumption of that data. Second, a well-designed
    DM service supports reproducibility by having version tracking on datasets. Let’s
    look at both of these points in detail.


    DECOUPLING THE TRAINING DATA COLLECTION AND CONSUMPTION


    If you work on a deep learning project completely by yourself, the project workflow
    is an iterative loop of the following steps: data collection, dataset preprocess,
    training, and evaluation (see figure 2.2). Although you can break the breakdown
    dataset preprocess or training code if you change the data format in the data
    collection component, it is not a big problem. Because you are the single owner,
    you make free changes; no other people are affected.


    When we are building a deep learning platform catering to differ of different
    deep learning projects and opening it to multiple people and teams, the simple
    data flow chart will depict quickly to a bewildering 3D diagram (figure 2.3).'
