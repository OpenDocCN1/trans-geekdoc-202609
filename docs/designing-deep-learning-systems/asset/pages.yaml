    # METADATA AND ARTIFACT STORE


    Imagine working on a simple deep learning application as a one-person team, where
    you have to work with only a few datasets and deploy only one type of model. You
    can probably keep track of how datasets, training codes, models, inference codes,
    and inferences are related to one another. These relationships are essential for
    model development and troubleshooting as you need to be able to trace certain
    observations back to the cause.


    Now imagining more applications, more people, and more model types. The number
    of relationships will grow exponentially. In a deep learning system that is designed
    to support multiple types of users working on datasets, code, and models at various
    stages, there is a need for a component that keeps track of the relationships.
    The metadata and artifacts store in a deep learning system does just that. Artifacts
    include code that trains and produces inferences, as well as any generated data
    such as trained models, inferences, and metrics. Metadata is any data that describes
    an artifact or the relationship between artifacts. Some concrete examples:


    +   * The author and version of a piece of training code


    +   * A reference of the input training dataset and the training environment of
    a trained model


