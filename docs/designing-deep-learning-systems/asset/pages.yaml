    machine learning (ML) and deep learning, however, metadata is more specific to
    models; it''s the data that describes model training executions (runs), workflows,
    models-datasets, and other artifacts.


    For any distributed system, we track service metadata in the form of logs and
    metrics at a service level. For example, we might track metrics such as CPU rate,
    number of active users, and number of failed web requests. We use these metrics
    for system/service monitoring, troubleshooting, and observation purposes.


    In deep learning systems, by the service-level metric, we collect metadata for
    model troubleshooting, comparison, and reproduction purposes. You can think of
    deep learning metadata as a subset of logs and metrics that we use to monitor
    and track every deep learning activity in the system. These activities include
    data paring, model training, and model serving.


    # 8.2.1 Common metadata categories


    Although we''ve just defined metadata, the term is actually somewhat arbitrary;
    there is no guideline on which data should be considered metadata. For engineers
    of deep learning systems, we recommend defining metadata in the following categories:
    model training run, general artifact, model file, and orchestration workflow.
    To give you a concrete for these categories, let''s look at each category and
    some examples of metadata that goes into each.


    METADATA FOR A MODEL TRAINING RUN


    To reproduce models, analyze model performance, and facilitate model troubleshooting,
    we need to track all the input and output data and artifacts of a model training
    run. This includes


    +   * Dataset ID and version—The unique identity of the dataset used in model
    training.

    * Hyperparameters—The hyperparameters used in the training, such as learning rate
    and number of epochs.

    * Hardware resources—CPU, GPU, TPU, memory, and disk size allocated in the training
    and the actual consumption of these resources.


