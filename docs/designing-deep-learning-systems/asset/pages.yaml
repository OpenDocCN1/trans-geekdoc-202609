    Figure C.2 The Kubernetes controller/operator pattern runs an infinite loop that
    watches the actual state (on the right) and desired state (on the left) of certain
    Kubernetes resources and tries to make its actual to the desired one.


    From the names of these core components, their implementations all follow the
    Kubernetes controller pattern. Besides the controller, Katib defines a set of
    CRD objects (spec) to work with these three controllers. For example, experiment
    spec is a type of CRD that defines the desired state for an HPO experiment and
    works as an input request to the experiment controller.


