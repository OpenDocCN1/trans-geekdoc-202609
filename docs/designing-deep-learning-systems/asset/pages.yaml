- pgno: 198
  md: '# Summary


    the inference server will load the model from the model file server, convert the
    request payload to model input, run the model algorithm, and return the prediction
    result with a postprocess


    **NOTE** Prediction platform design is not always the serving approach! In theory,
    the design in figure 6.7 can work for any model, but it does come with some extra
    cost. Its setup, maintenance, and debugging are much more complicated than the
    model service approach. This design is overkill for scenarios introduced in sections
    6.3.1 and 6.3.2. Because each design has its merits, we recommend not adhering
    to one serving approach but choosing the serving method based on your actual scenarios.


    # 6.3.4 Common prediction service requirements


    Although we state that designing prediction services should start from concrete
    cases, different situations lead to different designs. Three common requirements
    exist among many model serving designs:


    +   - Model deployment safety—No matter what model rollout strategy and strategy
    we choose, we must have a way to roll back a model to the previous state or version.

    - Latency—Web request latency is a crucial factor in the success of many online
    businesses. Once we build the model serving support, the next step is to try to
    reduce the average prediction response time.

    - Monitoring and alerting—Model serving is the most critical service in a deep
    learning system; if it goes down, the business stops. Remember, actual businesses
    run on top of the model prediction in realtime. Customers are affected immediately
    if the service is down or serving latency increases. Prediction service should
    be the most-equipped service among other deep learning services in monitoring
    and alerting.


    In this chapter, we have reviewed concepts, definitions, and abstract high-level
    system designs of model serving. We hope you gain a clear picture of what model
    serving is and what to consider when designing model serving systems. In the next
    chapter, we will demo two sample prediction services and discuss the commonly
    used prediction open source tools. These examples will show you how the design
    concepts in this chapter are applied in real life.


    # Summary


    +   - A model can be several files; it is composed of three elements: machine
    learning algorithm, model executor (wrapper), and model data.

    - Model prediction and model inference have the same meaning in the model serving
    context.

    - Direct model embedding, model service, and model server are the three types
    of model serving strategies.'
