    relationships you see fit.


    +   A basic deep learning system consists of the following key components: dataset
    manager, model trainer, model serving, metadata and artifacts, workflow orchestration,
    and data science engine.


    +   The data management component helps collect, organize, describe, and store
    data as datasets that can be used as training input. It also supports data exploration
