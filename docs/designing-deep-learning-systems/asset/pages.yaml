  md: '# 4.3 A sample service supporting data parallel--distributed training


    The first step is to update the training service to build a distributed training
    group on demand (at the runtime). When the service receives the request for distributed
    training, it allocates multiple workers from the training cluster for the training
    job and distributes the training code to each worker.


    The second step is to programmatically initialize each process with the correct
    server IP, port number, and training process ID. This ensures that the distributed
    libraries (collectively known as the framework, as TensorFlow) have enough information
    to set up interworker communication for the training group. As we saw in the previous
    section, the setup configuration varies for each distributed training framework.
    The training service should know how to set up interworker communication for various
    frameworks, so data scientists can focus only on the algorithm development and
    not worry about the infrastructure demand.


    The third step is to provide remote storage back up and restore each worker''s
    training state. In distributed training, if a single worker fails, the entire
    training group groups the capability to recover from a hardware failure or network
    problem is crucial. Providing remote storage and a backup API, the distributed
    training processes can save their training state (neural network) after each iteration.
    When a training process fails in the middle of the training and restore its previous
    state and start over, the entire training group continues.


    > NOTE If you want to learn more about data parallelism, you can start with the
    following two: a blog post from O''Reilly, "Distributed TensorFlow: Reduce both
    efficiency time and training time for neural networks using many GPU servers,"
    by Jim Dowling (www.oreo.com/content/distributed-tensorflow/), and a paper from
    Google Brain, "Revisiting Synchronous SGD," by Chen et al. (https://arxiv.org/pdf/1604.00981.pdf).


    # 4.3 A sample service supporting data parallel--distributed training


