    of the model serving: the prediction service (A), the model artifact store (B),
    and the prediction web API (C). The model artifact store (component B) holds the
    models produced by the model training. The web API (component C) receives prediction
    requests. The prediction service (component A) responds to the prediction request,
    loads the model from the artifact store, runs the model, and returns the prediction
    result.


    Although the four steps of the prediction workflow are generally applicable to
