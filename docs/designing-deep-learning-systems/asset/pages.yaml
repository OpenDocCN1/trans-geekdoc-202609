- pgno: 179
  md: '# 5.4.4 Next steps


    When you encounter the aforementioned problems with HPO libraries, it''s time
    to switch to an HPO service. We strongly recommend you read appendix C before
    you consider building your own HPO. It introduces a open source HPO service called
    Kubeflow Katib, which is a well-designed, general-purpose HPO service.


    # Summary


    +   - A hyperparameter is a parameter whose value is used to control the learning
    process. This type of parameter is not learnable in model training; therefore,
    we need to tune it.

    - HPO is a process of discovering a set of hyperparameters that yields an optimal
    model, minimizes a predefined loss function on a given dataset.

    - Automatic HPO is the process of using compute power and algorithms (HPO algorithms)
    to automatically find the optimal hyperparameters for a training code.

    - Automatic HPO now is a standard step for model training.

    - Most HPO algorithms can be categorized into one of three buckets: model-free
    optimization, Bayesian optimization, or multifidelity optimization.

    - There is no single best HPO algorithm. Different optimization algorithms may
    fit different HPO tasks under different constraints.

    - HPO can run with a library or a remote service. The library approach is simple,
    flexible, and suitable for small teams and projects in the prototyping phases
    where the service approach is for large organizations and production cases.

    - The HPO service approach provides a fully automatic black-box HPO experience,
    including computing resource management; therefore, we recommend taking a service
    approach if you are building a deep learning system for large teams.

    - The five design principles for building an HPO service are training code agnostic,
    high extensibility, high scalability and reliability, HPO execution and resource
    consumption segregation, and high portability.

    - To expedite an HPO experiment, we can parallelize training executions of different
    trials, introduce distributed training, and stop the promising trials early.

    - We encourage you to adopt Kubeflow Katib as your HPO service instead of building
    a new service yourself.

    - Among commonly used open source HPO libraries—Optuna, Hyperopt, and Ray tune—Ray
    Tune has so far proven to the best.'
