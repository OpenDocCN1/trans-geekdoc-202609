    # Model serving runs machine learning algorithms in a special mode


    Model training and serving execute the same machine learning algorithm but

    in two different models: learning mode and evaluation mode.


    In the learning mode, we run the algorithm in an open loop, meaning in each training

    iteration, we first run the neural network (algorithm) with an input data sample
    to cali-

