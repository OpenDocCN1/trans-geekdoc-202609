    Challenges, ed. Frank Hutter, Lars Kotthoff, and Joaquin Vosquens: Springer, 2019.
    https://www.automml.org/wp-content/uploads/2019/05/AutoML_Book_Chapter1.pdf)


    Figure 5.4 illustrates the comparison between grid search and random search. The
    trial hyperparameter candidates (black dots) in grid search are Cartesian products
    of important parameter values (in rows) and unimportant value points (in columns).
    Their distribution can be seen as a grid in the search space (the white canvas).
    The random search algorithm obtains the hyperparameter candidates randomly from
    the search space. When given enough of a search budget, its search point has a
    better chance of getting closer to the optimal position.'
