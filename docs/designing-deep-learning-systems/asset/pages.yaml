    # C.3.3 Early stopping


    Another useful Katib trick is early stopping. Early stopping ends the train when
    its metric(s) no longer improves. It saves computing resources and reduces execution
    times by cutting off the unpromising trials.


    The advantage of using early stopping in Katib is that we only need to update
    our experiment configuration file without modifying our training code. Simply
    define .earlystopping.algorithmName and .earlystopping.algorithmSettings in the
    .spec.algorithm section and you are good to go.


    The current early stopping algorithm Katib supports median stopping rules, which
    stops a trial if the trial''s objective value is worse than the median of the
    running averages of all completed trials'' objectives reported up to the system.
    Please read more details in the Katib official "Using Early Stopping."


    # C.4 Katib system design


    Finally, we can talk about our topic—system design. By reading C.2 and C.3, you
    should have a clear sense of how Katib solves HPO problems from a user perspective.
    This builds a great foundation for understanding Katib''s system design.


    As we see, Katib is not only solving the HPO problem but also addressing it in
    production quality. Normally, such powerful system has a large and complicated
    code-base, but Katib is an exception. Because the Katib''s components are all
    implemented in a sample design pattern—Kubernetes controller/operator pattern—if
    you understand one component, you must understand the entire system. By following
    our introduction in this section, reading the Katib source code will be straightforward
    for you.


    # C.4.1 Kubernetes controller/operator pattern


    We have discussed the controller design pattern in section 3.4.2. However, to
    help you remember, we reposted figure 3.10 as figure C.2 here. If figure C.2 doesn''t
    look familiar, please revisit section 3.4.2.


    # C.4.2 Katib system design and workflow


    Figure C.2 illustrates Katib''s internal components and their interactions. The
    system has three components: experiment controller (marked as A), suggestion controller
    (marked as B), and trial controller (marked as C).


    The experiment controller manages HPO experiments throughout its lifecycle, such
    as scheduling HPO trials for an experiment and updating its status. The suggestion
    controller runs HPO algorithms to provide suggested values for given hyperparameters.
    And the trial controller runs the actual model training for a given set of hyperparameters.'
