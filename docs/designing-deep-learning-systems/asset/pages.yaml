- pgno: 156
  md: '# 5.1 Understanding hyperparameters


    Research reveals that the chosen value of hyperparameters can affect both the
    quality of the model training as well the time and memory requirements of the
    training algorithm. Furthermore, hyperparameters must be tuned to be optimal for
    model training. Nowadays, HPO has become a standard in the deep learning model
    development process.


    As one of the deep learning components, HPO is very important to software engineers.
    This is because HPO doesn''t require a deep understanding of deep learning algorithms,
    so engineers are often assigned to this task. Most of the time, HPO can run like
    a black box, and the training code does not need to be modified. Furthermore,
    engineers have the capability of building an automatic HPO mechanism, making HPO
    possible. As there are many hyperparameters to tune (learning rate, number of
    epochs, batch data size, and more) and so many values to try, it is simply impractical
    to manually adjust each hyperparameter. Software engineers are well-suited to
    create an automated system because of their expertise in microservices, distributed
    computing, and resource management.


    In this chapter, we will focus on the engineering of automatic HPO. We first introduce
    the background information necessary to feel comfortable working with HPO. We
    delve into a deeper understanding of hyperparameters and the process of tuning
    optimizing them. We''ll also meet some popular HPO algorithms and compare two
    common approaches to automating HPO: using a library and building a service.


    Then we''ll start designing. We will look at how to design an HPO service, including
    five design principles for creating an HPO service, as well as general design
    proposal that is important at this stage. Finally, we will show three popular
    open source HPO frameworks that would be a perfect fit if you want to optimize
    your training code locally.


    Unlike previous chapters, we will not be building a brand new sample service in
    this chapter. Instead, we suggest using the open source Katib (discussed in appendix
    C). Katib is a well-designed, extensible, and highly portable HPO service that
    can be used for almost any HPO project. Thus, we do not have to build one if it
    is a low-hanging fruit for you.


    This chapter should give you a holistic view of the HPO domain while providing
    you with a practical understanding of how to run HPO for your specific needs.
    Whether you decide to run HPO with a remote service or at your local machine with
    libraries/frameworks like Hyperopt, Optuna, or Ray Tune, we''ve got you covered.


    # 5.1 Understanding hyperparameters


    Before we look at how to tune hyperparameters, let''s get a clearer understanding
    of hyperparameters and why they are important.


    # 5.1.1 What is a hyperparameter?


    The process of training deep learning models uses two types of parameters, or
    values: model parameters and hyperparameters. Model parameters are trainable—that
    is, their'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'values are learned during model training—and they change as the model iterates.
    Hyperparameters, in contrast, are static; these configurations are defined and
    set before the training starts. For example, we can set the training epoch to
    30 and the activation function of the neural network as ReLU (rectified linear
    unit) in the input parameters to kick off a model training.


    In other words, model training configuration that affects hyperparameters is a
    hyperparameter. There can be hundreds of hyperparameters in a model training algorithm,
    including, for example, the choice of model optimizers—ADAM (see "Adam: A Method
    for Stochastic Optimization,") by Diederik P. King and Jimmy Ba; https://arxiv.org/abs/1412.6980)
    RMSProp (see "A Look at Gradient Descent and RMSProp Optimizers") by Rohith Gandhi;
    http://mng.bz/zdXX)—the number of layers in the neural network, the embedding
    dimensions, and the learning rate.


    # 5.1.2 Why are hyperparameters important?


    The choice of values for hyperparameters can have a tremendous effect on model
    results. Typically set manually, the values control the behavior of algorithm
    execution and the speed of model training and the accuracy.


    To see this for yourself, you can experiment with hyper values by running model
    training in the TensorFlow playground (https://playground.tensorflow.org). In
    this playground, you can design your own neural network and train to recognize
    four types of patterns. By setting different hyperparameters, such as learning
    rate, regularization method, activation function, neural layer count, and neuron
    count, you will see not how the model performance varies but also how the learning,
    such as time and learning curve, can differ. To train a model to recognize a complicated
    data like a spiral shape in this playground, we need to select the hyperparameters
    very carefully. For example, try setting the hidden layer count to 6, the neuron
    count per layer to 5, the activation function to ReLU, the data batch size to
    10, and the regularization method to L1. After nearly 500 epochs of training,
    you''ll see that the model can make an accurate classification on a spiral-shaped
    pattern.


    In the research field, effect of hyperparameter selection on model performance
    has long been documented. Take natural language processing embedding, for instance.
    One paper, "Improving Distribution Similarity with Lessons from Word Embeddings,"
    by Levy et al. (https://acaclibrary.org/Q15-1016), reveals that much of the performance
    gains of word embeddings are due to certain design choices along with the HPOs
    rather than the embeddings themselves. In NLP embedding training, these authors
    found the selection of hyperparameters has more effect than the selection of the
    training algorithm! Because the hyperparameter selection is so crucial to model
    performance, hyperparameters has now become a standard step in the model training
    process.'
  merge: -1
  img_proc: true
