  md: "# Understanding hyperparameter optimization\n\nNow that you have a solid idea\
    \ of what hyperparameters are and why they are so important to model training,\
    \ in this section, we will walk you through the steps for HPO. We will also look\
    \ at HPO algorithms, which are used to optimize hyperparameters, as well as common\
    \ approaches to performing HPO.\n\n# What is HPO?\n\nHPO, or tuning, is the process\
    \ of discovering a set of hyperparameters that yields an optimal model. Optimal\
    \ here means a model that minimizes a predefined loss on a given dataset. In 5.1,\
    \ you can see a high-level view of the generic workflow of HPO on the model training\
    \ process.\n\n![](img/9dbecddeac1b6cad2e240ace2b0d4b22_158_0.png)\n\nFigure 5.1\
    \ This high-level view of the HPO workflow shows that the process is essentially\
    \ an experiment to find the optimal parameters.\n\nFrom figure 5.1, we see that\
    \ an HPO workflow can be visualized as a loop with four steps. It shows us that\
    \ the HPO process is a repetitive model training process, except that the neural\
    \ network is trained each time with a different set of hyperparameters. The optimal\
    \ set of hyperparameters will be discovered in this process. We normally call\
    \ each run of the model training a trial. The whole HPO experiment is a loop in\
    \ which we run one trial after another until the end criteria are met.\n\n> NOTE\
    \ To have a fair evaluation, the same dataset is used for each HPO trial.\n\n\
    Each trial has four steps, as shown in figure 5.1. Step 1 is training the neural\
    \ network with a set of hyperparameter values. Step 2 is evaluating the training\
    \ output (the model).\n Step 3, the HPO process checks whether the end criteria\
    \ have been met—for example, whether we have run out of our trial budget or whether\
    \ the model produced"
  merge: -1
  img_proc: true
- pgno: 159
  md: '# CHAPTER 5 Hyperparameter optimization service


    in this trial has reached our performance evaluation target. If the trial result
    meets the end condition, the trial loop breaks and the experiment ends. The hyperparameter
    that provide the best model evaluation result are considered the optimal hyperparameters.


    If the end condition is not met, the process moves to step 4: the HPO process
    will produce a new set of hyperparameter values and start a new trial by triggering
    a model training. The hyperparameter values used in each trial are either generated
    manually or automatically by an HPO algorithm. Let''s look closer at these two
    approaches and the next two sections.


    # Manual HPO


    As data scientists, we often manually pick the hyperparameter values to run the
    HPO process shown in figure 5.1. Though, admittedly, choosing the optimal hyperparameters
    values is more like improvisation than science. But we are also drawing from our
    experience and the intuition that comes from that experience. We tend to start
    a model with empirical hyperparameter values, such as the values used in a relevant
    published paper, and then make some small adjustments and test the model. After
    a few trials, we manually compare the model performance and the best-performing
    model from these. Figure 5.2 illustrates this workflow.


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_159_0.png)


    Figure 5.2 Manually picking hyperparameter values can be tedious and time-consuming.


    The biggest problem with manual HPO is not knowing our hyperparameter values are
    optimal because we choose some empirical values and tweak them. To get the optimal
    values, we need to try all possible hyperparameter values, aka search spaces.
    In the example of figure 5.2, we optimize two hyperparameters: learning rate and
    dataset batch size. In the HPO process, the goal is to find the pair of batch_size
    and learning_rate that produces the best model. Let''s define a search space for
    batch_size as [8, 16, 32, 64, 128, 256] and define another search space for learning_rate
    as [0.1, 0.01, 0.001, 0.05, 0.005]. Then the total number of hyperparameter values
    we need to verify is 36 (62).


    Because we run the HPO manually, we have to run the model training process (HPO
    trial) 36 times and record the model evaluation result and the hyperparameters''
    values used in each trial. After completing all 36 trials and comparing the results,
    which is usually the only accuracy, we find the optimal batch_size and learning_rate.'
