- pgno: 246
  md: '# 7.6 Postproduction model monitoring


    To battle model drifting, data scientists need to retrain the model with new data
    or rebuild the model with an improved training algorithm. This sounds like a science
    project on the surface, but it requires a lot of underlying engineering work,
    as collecting and analyzing the model metrics from prediction to detect model
    drifting. In this section, we discuss model monitoring from an engineering perspective
    and at the role that engineers can play in the monitoring process.


    # 7.6.1 Metric collection and quality gate


    The most important areas where engineers can contribute are model metric collection
    and quality gate setup. Let us explain.


    To run an analysis to detect drift, data scientists need to analyze, and engineers
    can find ways to deliver the necessary data (metrics). Although engineers would
    have to create a separate pipeline to collect model performance metrics, it would
    be overkill in most cases. Model performance metrics can be collected and visualized
    with the existing telemetry system (like Datadog) and logging system (like Sumo
    and Splunk). So do yourself a favor and try to fully the existing logging and
    metric systems you already have, instead of doing the heavy lifting of building
    a new metric system.


    Engineers can also help with building model-quality gates. Engineers can work
    with data scientists to automate their troubleshooting steps, such as checking
    data quality and generating inference analysis reports. With a given threshold,
    these will eventually form a model quality gate.


    # 7.6.2 Metrics to collect


    Theoretically, we need to collect at least five kinds of metrics to support model
    performance measurements. They are prediction tracing, the date of the prediction,
    model versions, observation, and observation rate. Let''s look at them one by
    one:


    +   * Prediction tracing—We normally track each prediction request by assigning
    it unique request ID, but this is not enough. For complicated scenarios, we compose
    different types of model predictions together to produce a final result. For example,
    we send first PDF to an OCR (optical character recognition) model to extract text
    and then send the text to an NLP (natural language processing) model to recognize
    the entities. In this case, assigning a unique request ID for a parent prediction
    request, we can also assign a groupRequestId to each sub/child prediction request,
    so we can group all the associated prediction requests when troubleshooting.


    +   * Date of the prediction—Normally, a prediction completes within a second.
    To track the date of a prediction, we can use prediction start time or complete
    time because there is not much difference. But for cases like fraud detection,
    the prediction’s completion timestamp might be a lot different from the prediction
    start timestamp because it can take multiple days of user activities as input.'
  merge: -1
  img_proc: true
