  md: '# 7.2.4 TorchServe backend


    TorchServe is a tool built by the PyTorch team to serve PyTorch models. TorchServe
    runs as a black box, and it provides HTTP and gRPC interfaces for model prediction
    and internal resource management. Figure 7.6 visualizes the workflow for how we
    use TorchServe in this sample.


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_218_0.png)


    Figure 7.6 The model workflow in the TorchServe backend: the TorchServe application
    server as a black box.


    In our sample code, we run TorchServe as a Docker container, which is provided
    by the PyTorch team, and mount a local file directory to the container. This file
    directory runs as the model store for the TorchServe process. In three steps to
    run a model prediction: First, we copy PyTorch model files to the store directory.
    Second, we call the TorchServe management API to register the model to the TorchServe
    process. Finally, we call the TorchServe API to run the prediction for the model—in
    our case, the intent classification.


    Compared to the self-built predictor in section 7.1.4, TorchServe is much simpler.
    We can make the model serving without writing any code; we just need to set up
    a Docker container with disk sharing. Also, unlike the predictor that works for
    intent classification algorithms, TorchServe is not tied to any specific algorithm;
    it can run any model as long as it is trained with the PyTorch framework.


    The great flexibility and convenience offered by TorchServe come with requirements.
    TorchServe requires operators to use their own set of APIs to send model serving
    requests, and it also requests that the model files are packaged in the TorchServe
    format. Let''s look at these mandates in the next two subsections.


    # 7.2.5 TorchServe API


    TorchServe offers many types of APIs, such as health checks, model explanation,
    model serving, worker management, and model registration. Each API has two types
    of implementations: HTTP and gRPC. Because TorchServe has detailed explanations
    of its API contract and usage on its official website (https://pytorch.org/serve/)
    and'
