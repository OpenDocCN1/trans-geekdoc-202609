  md: '# CHAPTER 1 An introduction to deep learning systems


    # 1.1.2 Roles in the development cycle


    Because you now have a clear idea of each step in a typical development cycle,
    let''s look at the key roles that collaborate in this cycle. The definitions,
    job titles, and responsibilities of each role may vary across organizations. Make
    sure to clarify who does what in your organization and adjust your system''s design
    appropriately.


    # BUSINESS STAKEHOLDERS (PRODUCT OWNER)


    Many organizations assign the stakeholder role to multiple positions, such as
    product managers, engineering managers, and senior developers. Business stakeholders
    define the goal of a product and are responsible for communication and execution
    of the product development cycle. The following are their responsibilities:


    +   - Getting inspiration from deep learning research, discussing potential application
    of deep learning features in products, and driving product requirements in turn
    drive model development

    - Owning the product! Communicating with customers and making sure the solution
    meets the business requirement and delivers the results

    - Running project development execution; providing guidance or feedback during
    the entire development cycle to ensure the deep learning features offer real value
    to the customers of the product

    - Evaluating the product metrics (such as user churn rate and feature usage)—not
    the model metrics (precision or accuracy)—and driving improvement of model development,
    productionization, or product integration


    # RESEARCHERS


    Machine learning researchers research and develop new novel neural network architectures.
    They also develop techniques for improving model accuracy and efficiency in training
    models. These architectures and techniques can be used during model development.


    > NOTE The machine learning researcher role is often associated with big tech
    companies like Google, Microsoft, and Salesforce. In many other companies, data
    scientists fulfill the role.


    # DATA SCIENTISTS


    Data scientists may wear a hat, but most of the time, they translate a business
    problem into a machine learning problem and implement it using machine learning
    methods. Data scientists are motivated by the product''s need and apply research
    techniques to production data rather than standard benchmark datasets. Beyond
    researching modeling algorithms, a data scientist''s responsibilities may also
    include


    +   - Combining multiple deep learning neural network architectures and/or techniques
    from different research into a solution. Sometimes they apply additional machine
    learning techniques besides deep learning.'
  merge: -1
