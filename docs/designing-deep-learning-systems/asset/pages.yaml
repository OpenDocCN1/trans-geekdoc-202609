    n    parser = argparse.ArgumentParser(\"\n        description=\"PyTorch MNIST\
    \ Example\"\n```\n\nParses the hyperparameter value from the command line arguments\n\
    \nSecond, we define the Katib code report training metrics, especially the objective\
    \ metrics, to Katib, so it can track the progress and result of each execution.\
    \ Katib collects metrics from the three places: stdout (OS standard output location),\
    \ an arbitrary file, and TensorFlow Flow. If you have special metric collection\
    \ or storage requirements, you can also write your own metric collector container.\n\
    \nThe simplest option is to evaluate (objective) metrics to stdout from your training\
