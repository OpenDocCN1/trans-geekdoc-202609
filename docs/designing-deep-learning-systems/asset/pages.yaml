- pgno: 290
  md: '# Summary


    The downsides of Metaflow in deep learning systems are as follows:


    +   - No conditional branching flow—Metaflow step annotation does not support
    conditional branching (only executing a step when a condition is met). This is
    not a red flag, but it''s a nice feature to have.

    - No job scheduler—Metaflow itself doesn''t come with a job scheduler, so you
    can use a cron workflow. This is not a big problem because Metaflow can integrate
    with other orchestration systems that support job scheduling, such as AWS Functions
    and Argo Workflows.

    - Tightly coupled to AWS—the most important features of Metaflow are tightly coupled
    to AWS—for example, Amazon S3 and AWS Batch. Luckily, Metaflow is an open project,
    so it''s possible to extend it to non-AWS alternatives.


    # 9.3.4 When to use


    If you are looking for an orchestration system to automate workflow execution
    for non-ML projects, Airflow and Argo Workflows are great choices. They have excellent
    community support and have been used widely in the IT industry. If your system
    runs on Kubernetes and your teams feel comfortable working with Docker, then Argo
    Workflows would be a good fit; otherwise, Metaflow won''t disappoint you.

    If you are looking for a system to streamline your ML project development, Metaflow
    is highly recommended. Metaflow is not just an orchestration tool; it''s an MLOps
    tool that focuses on saving data scientists'' time in the ML development cycle.
    Because Metaflow abstracts the backend part of a ML project, data scientists can
    focus on model development without worrying about production conversion and deployment.


    # Summary


    +   - A workflow is a sequence of operations that are part of some larger task.
    A workflow can be viewed as a DAG of steps. A step is the smallest resumable unit
    of computation that describes what to do; a step either succeeds or fails as a
    whole. A DAG specifies the dependencies between steps and the order in which to
    execute them.

    - Workflow orchestration means executing the workflow steps based on the sequence
    defined in the workflow''s DAG.

    - Adopting a workflow encourages work sharing, team collaboration, and automation.

    - The main challenge of applying a workflow on deep learning projects is to reduce
    workflow construction costs and simplify workflow testing and debugging.

    - The recommended design principles for building/evaluating workflow orchestration
    systems are criticality, usability, extensibility, task isolation, scalability,
    and human centricity.'
  merge: -1
  img_proc: true
