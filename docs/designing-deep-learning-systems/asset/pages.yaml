    # A.1 Introducing the “hello world” deep learning system


    The quickest way to understand a software system is from the user''s perspective.
    So in this introduction section, we will first look at the users of a deep learning
    system: the personas and their responsibilities. Then we will dive into system
    design, the major components, and the user workflows.


    # A.1.1 Personas


    To keep the complexity to a minimum, our sample mini deep learning system only
    has four personas, or roles: data engineer, data scientist/researcher, system
    developer, and deep learning application developer. We pick these four roles because
    they are the minimum personnel needed to keep a deep learning system functioning.
    The role definition and job description of each persona in this “hello world”
    system are listed in the following sections.


    > NOTE The responsibilities described here are oversimplified because we want
    to concentrate on the most fundamental workflows of a deep learning system. For
    more detailed definitions of the personas and roles involved in a deep learning
    system, please refer to section 1.1.


    # A.1.2 Data engineers


    Data engineers are responsible for collecting, processing, and storing the raw
    data for deep learning training. We have a DM service in this mini system to store
    datasets for model training. Data engineers will use this service to upload the
    raw training data. In our lab exercise, we prepare some intent classification
    datasets for you to experience this process.


    # A.1.3 Data scientists/researchers


    Data scientists develop deep training algorithms and produce models that meet
    business requirements. They are the customers of the model training infrastructure.


    Our example system contains a training service to run model training code. In
    the lab, we will an intent classification training code for you to experience
    the training execution.


    # A.1.4 System developer


    System developers build the entire deep learning system and maintain it to make
    sure all the machine learning activities are functioning well. Their activities
    include dataset uploading, model training, and model serving.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# A.1.5 Deep learning application developers


    Deep learning developers utilize deep learning models to build commercial products,
    such as chatbots, self-driving cars, and facial recognition mobile apps. These
    applications are the most important customers of deep learning systems because
    they create the business impact (revenue) for the models produced by the system.
    In our lab, you will have the opportunity to imagine yourself as a chatbot by
    running a script to send requests to the prediction service and categorize your
    message.


    # A.1.6 Sample system overview


    Our mini deep learning system consists of four services and one storage system:


    +   - Data service—Designed for storing and fetching dataset

    - Model training service—Designed for running model training code

    - Metadata store service—Designed for storing model metadata, such as model name,
    version, and model algorithm

    - Prediction service—Designed to execute models to process customer''s prediction
    requests

    - MinIO storage—Designed to run on your local computer as an object storage to
    Amazon S3


    Almost all these services have their own chapters in this book, so we will be
    able to study them in more detail. For, we just want to provide you with the high-level
    overview you''ll need to comprehend the user scenarios and lab exercises later
    in the book. Figure A.1 illustrates the major components of the sample system
    (the four services and the storage system) along with their interdependencies.


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_311_0.png)


    > Figure A.1 The design overview of the sample system deep learning system


    Along with the four services and storage (in rectangular boxes), you will notice
    lots of directed arrows between these boxes. These arrows show the interdependencies
    of the services inside the sample system. Here are the explanations for these
    dependencies:'
