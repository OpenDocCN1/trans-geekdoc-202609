    # 1.3 Building a deep learning system vs. developing a model


    A final piece of groundwork before we begin: we think it is crucial to call out
    the differences between building a deep learning system and developing a deep
    learning model. In this book, we define the practice of developing a deep learning
    system to solve a problem as the process of


    +   - Exploring available data and how it can be transformed for training

    - Determining the effective training algorithm(s) to use for the problem

    - Training models and deep inference code to test unseen data


    Recall that a deep learning system should support not all tasks required by model
    development but also that that need to be performed by other roles and make collaboration
    between these roles seamless. When building a deep learning system, you are not
    developing deep learning models; you are building a system that supports the development
    of deep learning models, making that process more efficient and scalable.


    We have found an abundance of material published about building models. But we
    have seen previous little about designing and building the platforms or systems
    that support those models. And that is why we wrote this book.


    # Summary


    +   - A typical learning project development goes through the following cycle:
    product initiation, data exploration, model prototyping, production, and integration.

    - There are seven different roles involved in deep learning project development:
    a product manager, researchers, data scientists, data engineers, MLOps engineers,
    machine learning systems engineers, and application engineers.

    - A deep learning system should reduce complexity in the deep learning development
    cycle.

    - With the help of deep learning systems, the data scientist, is not expected
    to suddenly become an expert DevOps or data engineer, should be able to implement
    models in a scalable manner, set up data pipelines, and deploy and monitor models
    in production independently.

    - An efficient deep learning system should allow data scientists to focus on interesting
    and important data science tasks.


