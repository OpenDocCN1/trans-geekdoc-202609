    # 3.1.1 Why use a service for model training?


    Imagine you lead a science team, and you need to assign the team''s precious compute
    resources wisely to the team members Alex, Bob, and Kevin. The computing resource
    needs to be allocated in a way that all team members can complete their model
    training tasks within a time limit and a budget. Figure 3.2 paints two approaches
    for allocating compute resources: dedicated and shared.


    The first option, dedicated, is to exclusively assign a powerful workstation to
    each member of the team. This is the simplest approach but clearly not an economic
    one because when Alex is not running his training code, his server sits idle and
    neither Bob nor Kevin can use it. So, in this approach, our budget is underutilized.


    Another problem with the dedicated approach is that when Alex wants to train a
    large model or a model with a large dataset, he will need multiple machines. And
    training are normally expensive; because of the complexity of the deep learning
    model architecture, even a decent size neural network requires a GPU with large
    memory. In this case, we must use more dedicated servers to Alex, which exacerbates
    the inefficient resource allocation problem.


    The second option, shared compute resources, is to build an elastic server group
    (the size of the group is adjustable) and share it with all members. This approach
    is obviously more economical because we use fewer servers to achieve the same
    result, which maximizes our resource utilization.'
