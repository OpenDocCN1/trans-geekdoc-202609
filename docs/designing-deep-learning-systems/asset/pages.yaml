    \ (Massively Parallel Hyperparameter Optimization), by Liam Li; http://mng.bz/wZP5).\
    \ At a high level, ASHA terminates trials that are less promising and allocates\
    \ time and resources to more promising trials. By properly adjusting the parameters,\
    \ the search can be much more efficient and it can support a larger search space.\n\
    \n# PARALLELIZATION\n\nDistributed execution is Ray's biggest advantage compared\
    \ with Optuna. Ray Tune allows you to seamlessly parallelize across multiple GPUs\
    \ and multiple nodes (see Ray documentation at http://mng.bz/qdRs). Tune even\
    \ has seamless fault tolerance and cloud support. Unlike Optuna and Hyperopt,\
    \ you don't need to manually set up a distributed environment and execute workers\
