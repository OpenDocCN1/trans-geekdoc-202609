  md: '# 3.4 Kubeflow operators: An open source approach


    This approach is definitely oversimplified, but it exemplifies how we work with
    data scientists to define a formal contract for mapping user training requests
    to the actual training code. In practice, the training service should provide
    a set of APIs to allow data scientists to register code in a self-serve manner.


    One possible approach is to define an algorithm name and code mapping in a database
    and add some API to manage this mapping. The proposed APIs can be


    +   - createAlgorithmMapping(string algorithmName, string image, string version)

    - updateAlgorithmVersion(string algorithmName, string image, string version)


    If data scientists want to add a new algorithm type, they would call the create-AlgorithmMapping
    API to register the new training image with a new algorithm into the training
    service. Our users just need to use this new algorithm name in the training request
    to kick off model training with this new algorithm.


    If data scientists want to release a new version of an existing algorithm, they
    can call the updateAlgorithmVersion API to update the mapping. Our users will
    still use the same algorithm name (such as intent-classification) to send requests,
    but they won''t be aware that the training code has upgraded to a different version
    behind the scenes. Also, it is worth noting that the service''s public API won''t
    be affected by adding new training algorithms; only a new parameter value is used.


