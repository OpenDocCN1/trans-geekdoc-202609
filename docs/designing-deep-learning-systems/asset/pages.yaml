- pgno: 224
  md: '# 7.2 TorchServe model server sample


    # 7.2.7 Scaling up in Kubernetes


    In our sample service, for demo purposes, we run a single TorchServe container
    as the prediction backend, but this is not the case for the production environment.
    The challenges for scaling up TorchServe are as follows:


    +   - The load balancer makes TorchServe model registration difficult. In Torch-Serve,
    model files need to be registered to the TorchServe server first before they can
    be used. But in production, the TorchServe instances are put behind a network
    load balancer, so we can only send prediction requests to the load balancer and
    let the request to a random TorchServe instance. In this case, it''s difficult
    to register models because we cannot specify which TorchServe instances use. The
    load balancer hides the TorchServe instances from us.

    - Each TorchServe instance needs to have a model store directory for loading models,
    and model files need to be put in the model store directory before they can be
    registered. Having multiple TorchServe instances makes it difficult to manage
    because we need to know every TorchServe instance''s IP address or DNS to copy
    the model files.

    - We need to balance the models among the TorchServe instances. Letting TorchServe
    instance load every model file is a bad idea; it would be a great waste of compute
    resources. We should spread the load evenly across different TorchServe instances.


    To address these challenges and scale up the TorchServe backend, we can introduce
    the “sidecar” pattern in Kubernetes. Figure 7.7 illustrates the overall concept.


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_224_0.png)


    Figure 7.7 Add a proxy container in the TorchServe pod to scale up TorchServe
    in Kubernetes.'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'The proposal in figure 7.7 is to add a proxy container (as a sidecar) along
    with the TorchServe container in each TorchServe pod. Instead of calling the TorchServe
    API directly, we send the prediction requests to the proxy container. The proxy
    API in the proxy container will hide the TorchServe model management details,
    including model downloading and model registration. It will prepare the TorchServe
    container to serve arbitrary models.


    After adding a proxy container, the model serving workflow (7.7) occurs as follows.
    First, the prediction request lands on the proxy container. Second, the proxy
    downloads the model file and updates the shared disk (model store). Third, the
    proxy registers the model to the TorchServe container and converts the inference
    request to the TorchServe format. Fourth, the TorchServe container runs serving
    and returns the result to the proxy. Finally, the proxy container returns the
    prediction to the user.


    By having a proxy container, we don''t need to worry about sending a prediction
    request to a TorchServe instance that doesn''t have model registered. The proxy
    container (sidecar) will get the TorchServe container ready for any prediction
    request by copying model files to model store and registering the model. It simplifies
    the resource management effort because now we can simply rely on the load balancer
    to spread the prediction workload (models) across the TorchServe pods. Also, by
    sharing a disk across all TorchServe pods, we can share the model store for all
    the TorchServe instances, which reduces model downloading time and saves network
    bandwidth.


    # The sidecar pattern: A common approach to running the model server


    In 7.4, we will introduce several model server approaches, such as TensorFlow-serving
    and Triton. Although the implementation of these model servers is different, their
    designs are similar. They all take a black-box approach and require certain model
    formats and model management to enable model serving.


    The sidecar pattern in figure 7.7 is a common solution to running these different
    model server containers in a Kubernetes pod. The proxy container encapsulates
    all the special requirements of the model server and only exposes a general model
    serving API.


    # 7.3 Model server vs. model service


    Choosing between the model server approach and the model service approach is the
    first decision we need to make when designing a model serving application. When
    we choose improperly, our application either is hard to use or maintains an unnecessarily
    long time to build.


    We''ve already reviewed the differences between these two approaches in chapter
    6 (sections 6.2 and 6.3), but this is such a crucial choice that it''s worth examining
    again.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Touring open source model serving tools


    Now that you''ve seen concrete examples of each approach in action, these ideas
    make more intuitive sense.


    From working through the two scenarios in sections 7.1 and 7.2, it''s clear that
    the model server approach avoids the effort of building dedicated backends for
    specific models. Instead, it works out of the box and can serve models regardless
    of which algorithm the model is implementing. So, it might seem like the model
    server approach should always be the best choice. But this is not true; the choice
    between the model server or model service should depend on the case and business
    requirements.


    For single-application scenarios, the model service approach is simpler to build
    and maintain in practice. Model service backend predictors are quite straightforward
    to build because model service coding is a simplified version of the training
    code. This means we can easily convert a training container to a model serving
    container. Once built, the model service approach is easier to maintain because
    we own the code end and the workflow is simple. For the model server approach,
    whether we choose open source, prebuilt models, or build our own server, the process
    of setting up the system is complicated. It takes a lot of effort to learn the
    system you need to operate and maintain.


    For model serving platform scenarios, the system needs to support many different
    types of models, the model server approach is unquestionably the best. When you
    are building a model serving system for 500 types of models, if you choose the
    model server approach, you only need to have one type of predictor backend for
    all the models. In contrast, using the model service approach, you would need
    to have 500 different model predictors! It is incredibly hard to manage the compute
    resources and perform the maintenance work for all those predictors.


    Our recommendation is to use the model service approach when you are first learning
    it is simpler and easier. You can move to the model server approach when you need
    to support more than 5 to 10 types of models or applications in your serving system.


    # 7.4 Touring open source model serving tools


    There are plenty of open source model serving tools available. It''s great to
    have options, but having so many of them can be overwhelming. To help make choice
    easier for you, we will introduce you to some popular model serving tools, including
    TensorFlow Serving, TorchServe, Triton, and KServe. All of these can work out
    of the box and are applicable to production use cases.


    Because each of the tools we describe here has thorough documentation, we will
    keep the discussion at a general level, looking just at their overall design,
    main features, and suitable use cases. This information should be enough to act
    as a starting point from which to explore further on your own.'
