    NOTE Although the individual training examples of different types of data-sets
    be in different forms, such as images, audios, and text sentences, the dataset''s
    operations (creating, updating, and querying dataset summary) and its dynamic/static
    characters are the same. Because we used a unified API set across all datasets,
    we can use one unified storage structure to store all kinds of datasets.


    In our storage, the actual files (commit data, snapshot data) are stored in cloud
    object storage (such as Amazon S3), and we only keep dataset metadata (explanation
    later in our DM system). By offloading file work and only tracking the file links,
    we can focus on organizing the datasets and tracking their metadata, such as edit
    history, data statistics, training snapshots, and ownership.


    # Dataset metadata


    We define dataset metadata as everything except actual data files, such as the
    dataset ID, owner, change history (audits), training snapshots, commits, data
    statistics, and so on.


    For demonstration purposes, we store the datasets'' metadata in a memory dictionary
    with the ID key and put all data files into the MiniIO server. You can extend
    it to use a database or NoSQL database to store the dataset''s metadata.


    So, we have talked about dataset storage concepts, how do the actual writing and
    reading work? How do we serialize commits and snapshots for different dataset
    types, such as GENERIC and TEXT_INTENT types?


    In the storage backend implementation, we use a simple inheritance concept to
    handle file operations for different dataset types. We define a DatasetTransformer
    interface as: the ingest() function saves input data into internal storage as
    a commit, and the compress() merges data from selected commits into a version
    snapshot (training data).


    More specifically, for the "TEXT_INTENT" type dataset, we have IntentTransformer
    to apply the type of file schema on file conversion. For a "GENERIC" type dataset,
    we have GenericTransformer to save data in the original format without any checks
    or format concerns. Figure 2.14 illustrates this.


    From Figure 2.14, we see that the raw intent classification from data ingestion
    API (section 2.2.3) is saved as a commit by IntentTransformer: Ingest(); the intent
    classification training data produced by dataset fetching API (section 2.2.4)
    is saved as a versioned snapshot by IntentTransformer:Compress(). Because they
    are plain Java code, we leave it for your own discovery; you can find the implementation
    code at our Git repo (org/orca3/miniAutoML/dataManagement/transformers/IntentTransformer.java).'
