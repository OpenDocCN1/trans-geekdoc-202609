- pgno: 306
  md: '# Model deployment strategies


    In the previous section, we went through a sample path from prototyping to production.
    That process assumed the model was deployed for the first time, without an existing
    version of the model to replace. Once a model is being used in production, unless
    there is a maintenance window allowance, we usually use a model deployment strategy
    to ensure inference request traffic is not disrupted. In fact, these model deployment
    strategies can also double as performing experimentation in production by using
    business metrics we set up in the previous section. We will look at three strategies:
    canary, blue-green, and multi-armed bandit.


    # 10.3 Canary deployment


    A canary deployment, similar to A/B testing, means deploying a new model to serve
    a small portion of production inference requests while keeping the old one to
    serve the remaining majority of requests. An example is shown in figure 10.9.
    This requires the model service to support segmenting and routing a small portion
    of inference request traffic to the new model.


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_306_0.png)


    With this strategy, any potential adverse effect from deploying a new model is
    contained within a small portion of end users. Rolling back is rather straightforward
    by routing all inference request traffic back to the old model.


    A drawback to this approach is that you only get to know the performance of the
    model to a small portion of end users. Releasing the new model to serve all inference
    request traffic may have a different effect from what you observe serving only
    a small portion of the traffic.


    # 10.3.2 Blue-green deployment


    In our context, a blue-green deployment means deploying a new model, routing all
    inference request traffic to the new model, and keeping the old model online until
    we have'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'confidence that the new model''s performance meets expectations. Implementation-wise
    it is the simplest among all three strategies there is no traffic splitting among
    all. All the service needs to point to the new model internally to serve all inference
    requests. Blue-green deployment is depicted in figure 10.10.


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_307_0.png)


    Not only is this strategy, but it also gives you a full picture of how the model
    performs when serving all users. Rolling back is also straightforward. Simply
    point the model service back to the old model.

    The obvious downside to this approach is if something goes wrong with the new
    model, it affects all users. This strategy may make sense when you are developing
    a new product feature based on a new model. As you iterate on training a better
    model over time, you may need to move away from this strategy, as end users have
    built their expectations on having a stable environment.


    # 10.3 Multi-armed bandit deployment


    Multi-armed bandit (MAB) is the most complex deployment strategy among the three.
    MAB refers to a technique that continuously monitors multiple models'' performance
    and directs more and more inference traffic to the model winning over time. This
    uses the most elaborate implementation of the model service which can be complicated
    depending on how your model performance metrics are defined. MAB deployment is
    illustrated in figure 10.11.


    This strategy comes with an advantage, though, because it maximizes the benefits
    of the best-performing models within a set frame, whereas with a canary deployment,
    you may only gain minimal benefits if the new model outperforms the old one. Notice
    that you should make sure the model service reports the traffic split changes
    over time. This helps correlate with the models'' performance.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# Summary


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_308_0.png)


    # Summary


    +   - Deep learning research teams invent and improve deep learning algorithms
    that are used to train models.

    - Model development teams make use of existing algorithms and available data to
    train models that help solve a deep learning use case.

    - Both research and prototyping require a high degree of interactivity with code
    development, data exploration, and visualization. Notebooking environments are
    popular for these teams.

    - Dataset management service can be used during research and prototyping to help
    track training data used to experimental models.

    - Once training data and code are stable enough, the first step to productionization
    is to package model training code, model inference code, and any source models.

    - These packages can be used by all services of the deep learning system to train,
    track, and serve models.

    - Once a model training workflow is up and running and a satisfactory inference
    response is obtained, integration with the end-user product can begin.

    - A model deployment strategy is required if serving inference requests cannot
    be interrupted.

    - Multiple model deployment strategies are available, and they can double as performing
    experimentation in production.'
  merge: -1
  img_proc: true
