- pgno: 334
  md: "# C.2 Getting started with Katib\n\nTo get you started, Katib provides a list\
    \ of sample training Docker codes and sample Docker images to show you how to\
    \ package your training code. These examples are written for different training\
    \ frameworks, TensorFlow, PyTorch, MXNet, and more. You can find these samples\
    \ in the Katib GitHub repo (http://mng.bz/DZln).\n\n# C.2.4 Step 4: Configuring\
    \ an experiment\n\nNow that you have your training code ready, we can start to\
    \ prepare an HPO experiment in Katib. We just need to create an Experiment CRD\
    \ (customer resource definition) in Katib.\n\nBy using Kubernetes API or the kubectl\
    \ command, we can create the CRD by specifying a YAML configuration. See the following\
    \ config as an example. For reading, we divide the sample config into three chunks.\
    \ Let’s go over each chunk individually.\n\n# FIRST SECTION: OBJECTIVE\n\nThe\
    \ first section is to define the goal of an HPO experiment and determine how to\
    \ measure the performance of each trial (training execution). Katib uses values\
    \ of objectiveMetric and additionalMetric as the objective value to monitor how\
    \ the suggested hyperparameters work with the model. If the objective value in\
    \ a trial goes, Katib will mark the suggested hyperparameters as the best value\
    \ and stop further trials in the experimentation.\n\nFor the following configuration,\
    \ the objective metric is set as Validation-accuracy and the goal is set to 0.99:\n\
    \n```\napiVersion: kubeflow.org/vbetal\nkind: Experiment\nmetadata:\n  namespace:\
    \ kubeflow\n  name: bayesian-optimization\nspec:\n  type: maximize\n  goal: 0.99\n\
    \  objectiveMetricName: Validation-accuracy\n  additionalMetricNames:\n    Train-accuracy\n\
    ```\n\n![](img/9dbecddeac1b6cad2e240ace2b0d4b22_334_0.png)\n\n# SECOND SECTION:\
    \ THE HPO ALGORITHM AND HYPERPARAMETERS\n\nAfter setting the HPO objective, we\
    \ configure the HPO algorithm and define their search spaces and the hyperparameters\
    \ that need to be tuned. Let’s look at these configs separately.\n\nThe algorithm\
    \ config specifies the HPO algorithm we want Katib to use for the experiment.\
    \ In the current example, we chose the Bayesian optimization algorithm (http://mng.bz/ljjw6).\
    \ Katib supports many cutting-edge HPO algorithms; you can see them in the Katib\
    \ official doc “Running an Experiment” in the section"
  merge: -1
