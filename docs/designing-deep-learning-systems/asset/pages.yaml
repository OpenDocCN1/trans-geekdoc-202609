- pgno: 71
  md: '# Why we need two APIs (two steps) to fetch a dataset


    If we only publish one API for acquiring training data, the caller needs to wait
    on the API call until the backend data preparation completes to obtain the final
    training data. If the data preparation takes a long time, this request will time
    out.


    A deep learning dataset is normally big (at the gigabyte level); it can take minutes
    or hours to complete the network I/O data transfer and local data aggregation.
    So the common solution to aggregating large data is to offer two APIs—one for
    submitting data preparation requests and another for querying the data status—and
    pull down the result when the request is complete. In this way, the dataset fetching
    API performs consistently regardless of the size of the dataset.


    # SENDING THE PREPARE DATASET REQUEST


    Now let''s look at the code workflow of the PrepareTrainingDataset API. Figure
    2.11 shows how our sample service handles Julia''s preparation training dataset
    request.


    ![](img/9dbecddeac1b6cad2e240ace2b0d4b22_71_0.png)


    Figure 2.11 A high-level overview of the eight steps in responding to a dataset
    build request: (1) the user submits a dataset preparation request with data filters;
    (2) DM selects data from commits that satisfy the data filters; (3 and 4) DM generates
    a version string to represent the training data; and (5–8) DM starts a background
    job to produce the training data.'
