    and finds the model metadata object.

    3. The routing layer then downloads the model files to a shared disk that all
    the predictors can access.

    4. By checking the model metadata, such as the algorithm type, the routing layer
    routes the prediction request to the correct backend predictor.

    5. The predictor loads the model from the shared disk.

    6. The predictor handles data preprocessing, executes the model, performs post-processing,
    and returns the result to the routing layer.

    7. The routing layer returns prediction results to the caller.


