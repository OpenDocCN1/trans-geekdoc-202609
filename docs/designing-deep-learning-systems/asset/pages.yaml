    Hyperopt (http://hyperopt.github.io/hyperopt/#getting-started) is a lightweight
    and easy-to-use Python library for serial and parallel HPO. Random search, TPE,
    and adaptive TPE are the three HPO algorithms implemented in Hyperopt. Bayesian'
