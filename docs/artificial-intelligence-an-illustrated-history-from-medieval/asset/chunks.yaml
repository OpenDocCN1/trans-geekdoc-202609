    \n**Figure from US Patent 6,213,871,** titled “Nurturing simulation apparatus\
    \ for virtual creature,” issued to Akihiro Yokoi. The Tamagotchi form of artificial\
    \ life, harbored in an egg-shaped device, started to become popular in 1997.\n\
    \n[![](OEBPS/images/160-1.jpg)](#9781454933601_epub_cre_r1.xhtml#160-1) \n\n#\
    \ 1996\n\n# TAMAGOTCHI\n\n![](OEBPS/images/L01.jpg)\n\nThe Tamagotchi^® artificial\
    \ life-form, harbored in a tiny portable device, was among the first virtual pets\
    \ to gain worldwide attention for children and adults. Amazingly, when it reached\
    \ the United States at the FAO Schwartz toy store in 1997, 30,000 units were sold\
    \ in three days. In a year, the AI was selling in more than eighty countries,\
    \ producing revenues of more than $160 million. It also led to research into the\
    \ “Tamagotchi Effect,” which describes the emotional attachments people often\
    \ develop with lifelike but inanimate forms. Parents also often wondered how to\
    \ best handle the strong emotional upheavals of children when their virtual pets\
    \ inevitably died. In the Japanese version, a dead pet would be represented by\
    \ a ghost and headstone, and US versions might show an angel. Japanese toy-maker\
    \ Bandai actually decided to open a virtual cemetery on the Internet for deceased\
    \ pets.\n\nDeveloped by Bandai employee Aki Maita (b. 1967) and toy designer Akihiro\
    \ Yokoi (b. 1955) in Japan, the Tamagotchi was first released in 1996. The software\
    \ was housed in an egg-shaped object with an interface that consisted of just\
    \ three buttons. A creature—displayed on a small, low-resolution screen—would\
    \ start as an egg and then develop according to care the player provided. For\
    \ example, owners would need to “feed” the pet, which could become sick if not\
    \ cared for properly. Using infrared communications, two owners could link their\
    \ toys to form friendships. Also, the device would beep to request attention from\
    \ the owner, and children often took their pets to school because the creatures\
    \ could die in a few hours if they did not receive care. The ensuing distractions\
    \ in the classroom caused some schools to ban Tamagotchis.\n\nThese simple forms\
    \ of virtual life raised many questions, as children sometimes treated them as\
    \ if they were actually alive. What is considered a healthy relationship between\
    \ children and such entities, and how would this evolve in the coming years? Does\
    \ the Tamagotchi have some form of intelligence, given that it “perceives” its\
    \ environments through its infrared sensors and buttons, reacts, and requires\
    \ socialization when it “feels” lonely? As advanced virtual pets are developed\
    \ for the elderly for companionship, are possible risks outweighed by the rewards?\n\
    \n**SEE ALSO** [Living in a Simulation (1967)](#9781454933601_epub_c060_r1.xhtml#c-060),\
    \ [Artificial Life (1986)](#9781454933601_epub_c074_r1.xhtml#c-074), [AIBO Robot\
    \ (1999)](#9781454933601_epub_c084_r1.xhtml#c-084)\n\n**What new versions of chess\
    \ will AI entities or humans invent** that may introduce new challenges for humans\
    \ and machines? Shown here is Fortress Chess, played in Russia in the 18th and\
    \ 19th centuries. Four players (AIs and/or humans) are represented here as black,\
    \ white, dark grey, and light grey.\n\n[![](OEBPS/images/162-1.jpg)](#9781454933601_epub_cre_r1.xhtml#162-1)\
    \ \n\n# 1997\n\n# DEEP BLUE DEFEATS CHESS CHAMPION\n\n![](OEBPS/images/L01.jpg)\n\
