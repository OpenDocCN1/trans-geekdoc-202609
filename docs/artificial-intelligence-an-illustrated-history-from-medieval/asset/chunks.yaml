    \ literature. Historian Scott Lightsey writes: “Hesdin’s centrality in the European\
    \ idea of artificial marvels is indicative of the way this new phenomenon of wonder\
    \ was replacing supernatural contingencies with the motives of court life. . .\
    \ . Technological innovations allowed them to begin reenacting even the traditional\
    \ supernatural themes of romance in their elaborate halls and pleasure gardens.”\n\
    \nOver the years, work continued in Hesdin, with upgrades to various mechanical\
    \ marvels, including a wooden hermit who spoke to onlookers, a talking owl, and\
    \ fountains with mechanical birds. The waving monkeys and other automata were\
    \ most likely operated by weight-driven mechanisms, with clockwork parts and/or\
    \ hydraulics.\n\nThese robotic installations offered visitors a glimpse of a future\
    \ with more widespread automation. As historian Silvio A. Bedini writes: “The\
    \ role of automata in the progress of technology is . . . of considerable importance.\
    \ Efforts to imitate life by mechanical means resulted in the development of mechanical\
    \ principles and led to the production of complex mechanisms which have fulfilled\
    \ technology’s original aims—the reduction or simplification of physical labor.\
    \ ”\n\n**SEE ALSO** [Ktesibios’s Water Clock (c. 250 BCE)](#9781454933601_epub_c004_r1.xhtml#c-004),\
    \ [Al-Jazari’s Automata (1206)](#9781454933601_epub_c007_r1.xhtml#c-007), [Lancelot’s\
    \ Copper Knights (c. 1220)](#9781454933601_epub_c008_r1.xhtml#c-008), [Religious\
    \ Automata (1352)](#9781454933601_epub_c011_r1.xhtml#c-011), [de Vaucanson’s Duck\
    \ Automaton (1738)](#9781454933601_epub_c017_r1.xhtml#c-017), [Jaquet-Droz Automata\
    \ (1774)](#9781454933601_epub_c019_r1.xhtml#c-019)\n\n**One set of rotating wheels\
    \ and combinations** of the *Ars Magna of Ramon Llull*. (From *Illuminati sacre\
    \ pagine p. fessoris amplissimi magistri Raymundi Lull*, 1517.)\n\n[![](OEBPS/images/18-1.jpg)](#9781454933601_epub_cre_r1.xhtml#18-1)\
    \ \n\n# c. 1305\n\n# RAMON LLULL’S *ARS MAGNA*\n\n![](OEBPS/images/L01.jpg)\n\n\
    “The quest for artificial intelligence (AI) begins with dreams—as all quests do,”\
    \ writes computer scientist Nils Nilsson. “People have long imagined machines\
    \ with human abilities—automata that move and devices that reason.” One of the\
    \ earliest devices in the history of AI is the Lullian Circle. In his book *Ars\
    \ Magna* (*The Great Art*, c. 1305), Catalan philosopher Ramon Llull (c. 1232–c.\
    \ 1315) included a paper construction of rotating concentric circles with letters\
    \ and words written along their circumference. Much like a mechanical lock, the\
    \ characters and words could be lined up in novel combinations, but in this case\
    \ the combinations generated a fountain of new ideas and logical explorations.\
    \ Author Martin Gardner writes: “It was the earliest attempt in the history of\
    \ formal logic to employ geometrical diagrams for the purpose of discovering nonmathematical\
    \ truths, and the first attempt to use a mechanical device—a primitive logic machine—to\
    \ facilitate the operation of a logic system.”\n\nLlull’s devices for combinatorial\
    \ creativity provided an early method of using “logical means to produce knowledge,”\
    \ writes author Georgi Dalakov. “Llull demonstrated in an extremely elementary,\
    \ but nevertheless workable, way that human thought can be described and even\
    \ imitated by a device. This was a small step towards the thinking machine.” Let\
    \ us imagine Llull, sitting at a table by candlelight, turning his disks to combine\
    \ words. He believed, according to author Krystina Madej, “a higher knowledge\
    \ would be revealed and would provide logical answers to questions about religion\
    \ and creation. . . . \\[He wanted\\] to investigate truths and produce new proofs\
    \ through these combinatory devices.”\n\nThe research on formal logic by German\
    \ polymath and calculus co-founder Gottfried Leibniz (1646–1716), as well as his\
    \ invention of the “stepped reckoner,” was stimulated by Llull’s work. As data\
    \ researcher and professor Jonathan Gray writes: “The initial trickles of Llull’s\
    \ and Leibniz’s arcane combinatorial fantasies have gradually given way to ubiquitous\
    \ computational technologies, practices, and ideals which are interwoven into\
    \ the fabric of our worlds—the broader consequences of which are still unfolding\
    \ around us . . . regardless of whether or not the machines operate in the ways\
    \ that we imagine.”\n\n**SEE ALSO** [Lagado Book-Writing Engine (1726)](#9781454933601_epub_c016_r1.xhtml#c-016),\
    \ [Computational Creativity (1821)](#9781454933601_epub_c021_r1.xhtml#c-021),\
    \ [*Cybernetic Serendipity* (1968)](#9781454933601_epub_c061_r1.xhtml#c-061)\n\
    \n**The Strasbourg astronomical clock** in the Cathédrale Notre-Dame of Strasbourg,\
    \ Alsace, France. The automaton rooster is at the upper left.\n\n[![](OEBPS/images/20-1.jpg)](#9781454933601_epub_cre_r1.xhtml#20-1)\
    \ \n\n# 1352\n\n# RELIGIOUS AUTOMATA\n\n![](OEBPS/images/L01.jpg)\n\nVarious automata\
    \ associated with the Christian Church appeared in late medieval and early modern\
    \ Europe, ranging from automaton Christs to mechanical devils and Satan machines\
    \ that made noises and stuck out their tongues. For example, during the fifteenth\
    \ century, the “Rood of Grace” in the Boxley Abbey in Kent, England, was a mechanized\
    \ likeness of Jesus on the Cross that moved his eyes, lips, and other parts of\
    \ his body. Automaton angles and automaton simulations of biblical events also\
    \ became common in the late fifteenth century. As recounted by history professor\
    \ Jessica Riskin, “Automata were familiar features of daily life, originating\
    \ in churches and cathedrals and spreading from there. Jesuit missionaries carried\
    \ them to China as offerings to dramatize the power of Christian Europe.”\n\n\
    Particularly interesting is the Strasbourg astronomical clock in the Cathédrale\
    \ Notre-Dame de Strasbourg in Alsace, France. Construction of the clock began\
    \ in 1352, and it featured a rooster automaton that moved its head, flapped its\
    \ wings, and crowed at particular times (using bellows and a reed). The clock\
    \ also featured moving angels. Around 1547, this clock was replaced and upgraded,\
    \ while retaining the bird automaton. The second clock stopped working in 1788.\
    \ It wasn’t until 1838 that the current clock came into being with new mechanisms\
    \ to replace the old ones."
