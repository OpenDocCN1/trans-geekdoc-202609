    ANNs are inspired by biological neural networks and are one means of implementing
    machine learning, in which computers exhibit the ability to learn without being
    explicitly programmed for a task. The concept of “deep learning” in computer science
    includes ANNs with several layers, which allow rich intermediate representations
    to be built. One challenge associated with ANNs is that input can sometimes be
    intentionally manipulated so that the ANNs are deceived into giving obviously
    incorrect answers. Also, it is difficult to understand how and why an ANN is providing
    a particular answer. Nevertheless, reflecting upon the recent useful applications
    of neural nets, Google AI expert Jeff Dean (b. 1968) said “The portion of evolution
    in which animals developed eyes was a big development. Now computers have eyes.”


    **SEE ALSO** [Reinforcement Learning (1951)](#9781454933601_epub_c044_r1.xhtml#c-044),
    [Perceptron (1957)](#9781454933601_epub_c048_r1.xhtml#c-048), [Machine Learning
    (1959)](#9781454933601_epub_c050_r1.xhtml#c-050), [Deep Learning (1965)](#9781454933601_epub_c058_r1.xhtml#c-058),
    [Computer Art and DeepDream (2015)](#9781454933601_epub_c092_r1.xhtml#c-092)


    **ENIAC** was among the first electronic, reprogrammable, digital computers that
    could be used to solve a large range of computing problems. The machine contained
    more than 17,000 vacuum tubes.


    [![](OEBPS/images/78-1.jpg)](#9781454933601_epub_cre_r1.xhtml#78-1)


    # 1946


    # ENIAC


    ![](OEBPS/images/L01.jpg)


    The 1946 newspaper headlines were ecstatic about ENIAC and the future of thinking
    machines. “Mechanical Brain Enlarges Man’s Horizons,” wrote *The Philadelphia
    Inquirer*, and *The Cleveland Plain Dealer* proclaimed “Calculator Puts Humans
    to Shame”—and also said it heralded “a new epoch in the scope of human thought.”
    All this media attention about progress in electrically embodied “thinking,” along
    with the technological advancements, naturally led the world to consider further
    possibilities for AI.


    ENIAC, short for Electronic Numerical Integrator and Computer, was built at the
    University of Pennsylvania by American scientists John Mauchly (1907–1980) and
    J. Presper Eckert (1919–1995). This device was among the first electronic, reprogrammable,
    digital computers that could be used to solve a large range of computing problems.
    The original purpose of ENIAC was to calculate artillery firing tables for the
    US Army. However, its first important application involved the design of the hydrogen
    bomb.


    ENIAC was unveiled in 1946, having cost nearly $500,000, and it was in nearly
    continuous use until it was turned off on October 2, 1955. The machine contained
    more than 17,000 vacuum tubes and around five hand-soldered joints. An IBM card
    reader and card-punch machine were used for input and output. In 1955, a team
    of engineering students led by Professor Jan der Spiegel created a “replica” of
    the 30-ton ENIAC on a single integrated circuit!


    Other important electrical machines of the 1930s and 1940s include the American
    Atanasoff–Berry Computer (demonstrated in October 1939), the German `Z3` (demonstrated
    in May 1941), and the British Colossus (demonstrated in December 1943). In contrast
    to ENIAC, however, these machines were either not fully electronic or not general-purpose.
    The authors of the ENIAC patent (No. 120,606, filed in 1947) write: “With the
    advent of everyday use, speed has become paramount to such a high degree that
    there is no machine on the market capable of satisfying the full demand of modern
    computational. . . The present invention is intended to reduce to seconds such
    lengthy computations. .”


    **SEE ALSO** [Abacus (c. 190 BCE)](#9781454933601_epub_c005_r1.xhtml#c-005), [Babbage’s
    Mechanical Computer (1822)](#9781454933601_epub_c022_r1.xhtml#c-022), [Giant Brains,
    or Machines That Think (1949)](#9781454933601_epub_c041_r1.xhtml#c-041)


    A “giant brain.” Shown here are the sequence indicators and switches of the `IBM
    Automatic Sequence Calculator (ASCC)`, or Harvard Mark I Computer, in a science
    building at Harvard University.


    [![](OEBPS/images/80-1.jpg)](#9781454933601_epub_cre_r1.xhtml#80-1)


    # 1949


    # GIANT BRAINS, OR MACHINES THAT THINK


    ![](OEBPS/images/L01.jpg)


    In 1949, the American computer scientist Edmund Berkeley (1909–1988) published
    what may be the first popular book on computers for a general audience. It was
    titled *Giant Brains, or Machines That Think*, and it was notable in that it raised
    questions about the appropriateness of using the term `brain` and the word `thinking`
    to computers. Many of these questions echo to this day. In the book, he writes:
    “Recently there has a good deal of news about strange giant machines that can
    handle information with vast speed and skill. They calculate and they reason.
    Some of them are cleverer than others—able to do more kinds of problems . . they
    can solve problems that a man’s life is far too short to permit him to do. . .
    These machines are similar to what a brain would be if it were made of hardware
    and wire instead of flesh and nerves. It is therefore natural to call these machines
    mechanical brains.”


    It is fascinating to realize that when the book was written, electronic computers
    were virtually unknown to the public. There were only a small number of these
    “giant brains” in existence, and Berkeley discusses several of them in the book,
    including the Differential Analyzer Number 2 at MIT, the Mark I at Harvard University
    (also known as the `IBM Automatic Sequence Calculator`), ENIAC at the Moore School,
    the General-Purpose Relay Calculator at Bell Laboratories, and the Kalin-Burkhart
    Logical-Truth Calculator built by Harvard students, to name a few. In Berkeley’s
    endnotes, added to the book in 1961, he noted that even “intuitive thinking” might
    be achieved by machines someday: “Perhaps intuitive thinking is a very rapid running
    over possible alternatives in one’s mind, coupled with very rapid appraising of
    them, so that one arrives at a conclusion with hardly any consciousness of how
    that conclusion was obtained. If so, then of course it is possible to program
    computers in such a way that they display what we call intuitive thinking, except
    that the method of obtaining the conclusions is known.”


    **SEE ALSO** [Hobbes’s Leviathan (1651)](#9781454933601_epub_c014_r1.xhtml#c-014),
    [The Consciousness Mill (1714)](#9781454933601_epub_c015_r1.xhtml#c-015), [ENIAC
    (1946)](#9781454933601_epub_c040_r1.xhtml#c-040), [Colossus: The Forbin Project
    (1970)](#9781454933601_epub_c064_r1.xhtml#c-064), [“Call Them Artificial Aliens”
    (2015)](#9781454933601_epub_c093_r1.xhtml#c-093)


    **The Turing test probes a machine’s capability for exhibiting intelligent behavior
    indistinguishable from that of a person.**


    [![](OEBPS/images/82-1.jpg)](#9781454933601_epub_cre_r1.xhtml#82-1)


    # 1950


    # TURING TEST


    ![](OEBPS/images/L01.jpg)


    French philosopher Denis Diderot (1713–1784) once remarked: “If they find a parrot
    who could answer to everything, I would claim it to be an intelligent being without
    hesitation.” This leads to the question: Can appropriately programmed computers
    be considered to be intelligent entities that “think”? In 1950, English computer
    scientist Alan Turing (1912–1954) attempted to answer this with his famous paper
    “Computing Machinery and Intelligence,” published in the journal *Mind*. He suggested
    that if a computer behaves in the same way as a human, we might as well call it
    intelligent, and then he proposed a special test to evaluate any given computer’s
    intelligence: Imagine that a computer and human respond, by text, to typed questions
    of human judges who cannot actually see who or what is responding. If the judges
    cannot distinguish the computer from the person after studying the text responses,
    then the computer has passed a typical version of what we refer to today as the
    “Turing test.”

