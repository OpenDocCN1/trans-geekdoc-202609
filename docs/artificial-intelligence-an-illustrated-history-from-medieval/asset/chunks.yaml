    \ \n\n# 2003\n\n# PAPERCLIP MAXIMIZER CATASTROPHE\n\n![](OEBPS/images/L01.jpg)\n\
    \nEven if highly intelligent and capable AIs are given useful goals, it is nevertheless\
    \ possible to have dangerous results in the future. One famous example, discussed\
    \ in 2003 by philosopher and futurist Nick Bostrom, is the horror of the Paperclip\
    \ Maximizer. Imagine a future in which an AI system supervises a set of factories\
    \ producing paperclips. The AI is given a mission of producing as many paperclips\
    \ as possible. If the AI is not sufficiently constrained, one might imagine that\
    \ it could optimize its goal, first by operating the factories at maximum efficiency,\
    \ and then devoting more and more resources to the task until vast regions of\
    \ land and more factories were devoted to making paperclips. Eventually, all the\
    \ available resources on Earth could be converted to this task, followed by all\
    \ the relevant matter in the Solar System, turning everything into paperclips.\n\
    \nAlthough this scenario may sound implausible, it is intended to focus attention\
    \ on the serious point that AIs may not have humanlike motives that we can truly\
    \ understand. Even innocuous goals could prove dangerous if AIs gain the ability\
    \ to evolve and create their successive improved machines, as discussed in the\
    \ entry on Intelligence Explosion. How might humans ensure that AI goals, and\
    \ their constituent mathematical reward and utility functions, remain stable and\
    \ comprehensible through the decades and centuries? How might useful “off switches”\
    \ remain accessible? What if such reward circuits and software cause the AI to\
    \ lose interest in the external world and devote its energy to maximizing a reward\
    \ signal, much like taking a drug and dropping out of society? How will we deal\
    \ with different countries and geopolitical regimes using different reward functions\
    \ for their own AIs?\n\nAnother famous example, attributed to AI expert Marvin\
    \ Minsky, is the Riemann hypothesis catastrophe, in which we imagine a superintelligent\
    \ AI system with the goal of solving this difficult and important hypothesis in\
    \ mathematics. Such a system might devote more and more computing resources and\
    \ energy to the task, taking over and creating ever-improved systems at the expense\
    \ of humanity.\n\n**SEE ALSO** [“Darwin among the Machines” (1863)](#9781454933601_epub_c025_r1.xhtml#c-025),\
    \ [Intelligence Explosion (1965)](#9781454933601_epub_c055_r1.xhtml#c-055), [Leakproof\
    \ “AI Box” (1993)](#9781454933601_epub_c079_r1.xhtml#c-079)\n\n**In Scrabble,**\
    \ each tile has a single letter, which is annotated with its value in the range\
    \ 1 to 10, based on its frequency of use in the English language. Vowels are worth\
    \ only one point.\n\n[![](OEBPS/images/178-1.jpg)](#9781454933601_epub_cre_r1.xhtml#178-1)\
    \ \n\n# 2006\n\n# QUACKLE’S SCRABBLE WIN\n\n![](OEBPS/images/L01.jpg)\n\n“Chess\
    \ had its Deep Blue,” writes com-puting technology journalist Mark Anderson. *Jeopardy!*\
    \ had its Watson. Baseball has its sabermetrics, as chronicled in the hit book\
    \ and film *Moneyball*. In each game, data mining has upended the field of play.”\
    \ An exciting development involving AI applied to word games occurred in 2006,\
    \ when the computer program Quackle defeated former world champion David Boys\
    \ at Scrabble^® in a tournament held in Toronto, Canada. When Boys lost three\
    \ games out of five, he insisted “It’s still better to be a human than to be a\
    \ computer.”\n\nThe Scrabble game was invented in 1938 by American architect Alfred\
    \ Butts (1899–1993). When playing Scrabble, opponents place tiles on a game board\
    \ consisting of a 15 × 15 array of squares. When playing the English version,\
    \ each tile has a single letter, which is annotated with its value in the range\
    \ 1 to 10, based on its frequency of use in the English language. For example,\
    \ vowels are worth one point, whereas *Q* and *Z* are worth 10 points. As players\
    \ alternate turns, they must add letters to the board in such a way that each\
    \ row or column of letters always forms a word.\n\nThe game is actually quite\
    \ complex, invol-ving more than just knowledge of words in a language. For example,\
    \ strategy may involve anticipating what letters are still to be drawn as well\
    \ as the utility of placing tiles on special squares on the board that may increase\
    \ the tile’s score. Scrabble is considered a game of imperfect information, like\
    \ poker, since an opponent’s available tiles are hidden from view."
