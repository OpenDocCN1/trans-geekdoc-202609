    \ \n\n# 1967\n\n# LIVING IN A SIMULATION\n\n![](OEBPS/images/L01.jpg)\n\n“Our\
    \ universe seems real, but is it really?” writes author Jason Koebler. “As humans\
    \ get better at simulating artificial intelligence, it seems at least plausible\
    \ that we could create life that is \\[conscious\\]. And if we can create conscious\
    \ life, who’s to say that the universe, as we know it, wasn’t created by superintelligent\
    \ artificial intelligence . . . ?”\n\nCould we be living in a computer simulation\
    \ and be artificial intelligences ourselves? The hypothesis that the universe\
    \ is a digital computer was pioneered by German engineer Konrad Zuse (1910–1995)\
    \ in 1967. Other researchers, including Ed Fredkin (b. 1934), Stephen Wolfram\
    \ (b. 1959), and Max Tegmark (b. 1967), have suggested that the physical universe\
    \ may be running on a cellular automaton or discrete computing machinery—or be\
    \ a purely mathematical construct.\n\nIn our own small pocket of the universe,\
    \ we have already developed computers with the ability to simulate lifelike behaviors\
    \ using software and mathematical rules. One day we may create thinking beings\
    \ that live in simulated spaces as complex and vibrant as a rain forest. Perhaps\
    \ we’ll be able to simulate reality itself, and it is possible that more advanced\
    \ beings are already doing this elsewhere in the universe.\n\nWhat if the number\
    \ of these simulations is larger than the number of universes? Astrophysicist\
    \ Martin Rees (b. 1942) suggests that if this were the case, “. . . as they would\
    \ if one universe contained many computers making many simulations,” then it is\
    \ likely that *we* are artificial life. Rees continues, “Once you accept the idea\
    \ of the multiverse . . . , in some of those universes there will be the potential\
    \ to simulate parts of themselves, . . . and we don’t know what our place is in\
    \ this grand ensemble of universes and simulated universes.”\n\nPhysicist Paul\
    \ Davies (b. 1946) expanded on the notion of a multiverse with multiple simulated\
    \ realities in a 2003 *New York Times* article: “Eventually, entire virtual worlds\
    \ will be created inside computers, their conscious inhabitants unaware that they\
    \ are the simulated products of somebody else’s technology. For every original\
    \ world, there will be a stupendous number of available virtual worlds—some of\
    \ which would even include machines simulating virtual worlds of their own. .\
    \ . .”\n\n**SEE ALSO** [The Consciousness Mill (1714)](#9781454933601_epub_c015_r1.xhtml#c-015),\
    \ [Searches for the Soul (1907)](#9781454933601_epub_c031_r1.xhtml#c-031), [Artificial\
    \ Life (1986)](#9781454933601_epub_c074_r1.xhtml#c-074), [“Call Them Artificial\
    \ Aliens” (2015)](#9781454933601_epub_c093_r1.xhtml#c-093)\n\n***Cybernetic Serendipity***\
    \ was notable for demonstrating numerous aspects of computer-aided creativity.\
    \ The book also featured computer designs made on mechanical computer plotters.\n\
    \n[![](OEBPS/images/120-1.jpg)](#9781454933601_epub_cre_r1.xhtml#120-1) \n\n#\
    \ 1968\n\n# *CYBERNETIC SERENDIPITY*\n\n![](OEBPS/images/L01.jpg)"
