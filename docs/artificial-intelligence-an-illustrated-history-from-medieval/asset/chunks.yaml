    \n# ABOUT THE AUTHOR\n\n![](OEBPS/images/L01.jpg)[![](OEBPS/images/212-1.jpg)](#9781454933601_epub_cre_r1.xhtml#212-1)\
    \ \n\n**Clifford A. Pickover** is a prolific author, having published more than\
    \ fifty books, translated into over a dozen languages, on topics ranging from\
    \ science and mathematics to religion, art, and history. He received his PhD degree\
    \ from Yale University, has been granted more than 600 U.S. patents, and has more\
    \ than 34,000 Twitter followers. His patents are owned by a wide variety of companies,\
    \ including IBM, Ebay, Google, Twitter, Yahoo!, Paypal, LinkedIn, and many more. His\
    \ website, [Pickover.com](http://Pickover.com), has had millions of visitors."
