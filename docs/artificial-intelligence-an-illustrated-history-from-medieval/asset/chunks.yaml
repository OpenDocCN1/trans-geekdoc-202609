    \ [Tower of Hanoi (1883)](#9781454933601_epub_c027_r1.xhtml#c-027), [Perceptron\
    \ (1957)](#9781454933601_epub_c048_r1.xhtml#c-048), [Machine Learning (1959)](#9781454933601_epub_c050_r1.xhtml#c-050),\
