  trans: "\n\nQuackle 根据模拟结果决定播放哪些字母，这些模拟使用评估函数对棋盘进行评估。它由一个团队创建，其中包括杰森·卡茨-布朗（Jason\
    \ Katz-Brown），他本人就是世界顶尖拼字游戏玩家之一。作为他们迷人研究的一部分，开发者让 Quackle 进行了多次对战，以更好地理解在回合中，某些单词与玩家可能可能合法使用的其他单词相比的价值，或者考虑到玩家在下一回合可能使用的单词的价值。\n\
    \n**另见** 四连棋 (1988), 深蓝象棋击败象棋冠军 (1997), 国际黑棋 (1997), AlphaGo 击败围棋冠军 (2016), AI\
    \ 扑克 (2017)\n\n**代表 IBM Watson 的类球体头像**基于 IBM Smarter Planet 图标。在《危险一答》（Jeopardy!）竞赛使用的显示中，颜色和动作会根据游戏状态和答案置信度水平而改变。\n\
    \n![](img/#9781454933601_epub_cre_r1.xhtml#180-1) \n\n# 2011\n\n# 《危险一答》中的 WATSON\n\
    \n![](img/L01.jpg)\n\n肯·詹宁斯（Ken Jennings，出生 1974 年）是电视节目《危险一答》（Jeopardy!）^®的世界冠军，他曾写过与一个名为\
    \ Watson 的 AI 实体的竞争的文章：“当我被选为两名人类选手之一，与 IBM 的‘Watson’超级计算机在一场特别的人机大战《危险一答》表演赛中对决时，我感到荣幸，甚至像英雄一样。我把自己想象为对抗新一代思考机器的‘伟大碳基希望’。\
    \ .……”\n\nWatson 是一个问答计算机系统，它利用自然语言处理、机器学习、信息检索等技术，在 2011 年的一场涉及常识线索的游戏中击败了世界冠军。让这项任务变得特别困难（比下象棋更难）的是，计算系统需要在几秒钟内提供答案，同时还要考虑英语的挑战和歧义，线索中包含了双关语、幽默、谜语、文化引用、特殊背景和韵律——这些都是人类本能就能考虑的事情。\n\
    \n为了完成这项任务，Watson 使用了数千万个被称为“核心”的并行处理单元，以及存储在其 `RAM` 内存中的整个维基百科库（因为比赛期间访问硬盘会太慢）。所有信息都必须存储在本地，因为\
    \ Watson 在比赛期间不被访问互联网；为了得出答案，Watson 同时考虑了许多独立分析的结果。找到相同答案的算法越多，该答案正确的概率就越大。Watson\
    \ 不断对不同的答案进行置信度评分，如果置信度足够高，Watson 就会提供答案。在失败后，詹宁斯写道：“但输给硅片并不可耻。……毕竟，我没有 880 个处理器核心和\
    \ 15 TB 的参考书供我支配——我也无法在知道答案时随时完美地按下抢答器。我那弱小的人类大脑，只值几美元的水、盐和蛋白质，却硬是与一台价值数十亿美元的超级计算机坚持了下来。”\n\
    \n**另见** 自然语言处理 (1954), 机器学习 (1959), 深蓝象棋击败象棋冠军 (1997), Quackle 的拼字游戏胜利 (2006)\n\
    \n**DeepDream 艺术作品示例。**这种方法利用了可以寻找并增强图像中模式的人工神经网络，取得了令人惊讶的结果。![](img/#9781454933601_epub_cre_r1.xhtml#182-1)\n\
    \n# 2015\n\n# 计算机艺术与 DeepDream\n\n![](img/L01.jpg)\n\n根据散文家乔纳·斯威特（Jonathan Swift，1667–1745）的话，“视觉是看到不可见物的艺术。”这种在艺术、科学和数学边缘看到新模式的观点，显然适用于借助计算机、神经网络和其他\
    \ AI 形式辅助创作的许多艺术类别。计算机艺术的早期探索包括德斯蒙德·保罗·亨利（Desmond Paul Henry，1921–2004）的作品以及他从\
    \ 1961 年开始基于模拟计算机的绘图机。美国工程师 A·迈克尔·诺尔（A. Michael Noll，出生 1939 年）于 1962 年因探索随机和算法过程以产生视觉艺术而闻名，而英国艺术家哈罗德·科恩（Harold\
    \ Cohen，1928–2016）于 1968 年创建了 `AARON`——一个可以自主创作艺术的 AI 计算机绘画程序。\n\n计算机艺术更近期的例子包括许多用户与\
    \ DeepDream 的协作，这是由 Google 工程师亚历山大·莫尔丁塞夫（Alexander Mordintsev）及其同事于 2015 年创建的计算机视觉程序。这种方法利用了可以寻找并增强图像模式的人工神经网络（`ANN`）——取得了令人惊讶的结果。为了更好地理解\
    \ DeepDream，可以神经网络根据大量的“训练”图像来分类和识别输入图像（例如松鼠或停止标志）中的特征。通过“反向”运行神经网络，DeepDream\
    \ 寻找图像中的模式并将其放大，这种方式有点让人想起我们仰望云端并开始看到动物形状的样子。对于人工神经网络，每一层都会提取更高层次的特征——例如，第一层对对角和边缘敏感，而更接近输出神经元的层可能在检查复杂的特征。DeepDream\
    \ 作品与某些药物使用者的幻觉相似，这表明 DeepDream 可能帮助研究人员更好地理解人工神经网络与大脑中神经网络之间的关系。此外，该程序可能有助于解释大脑如何寻找模式。\n\
    \n**另见** 计算创意 (1821), 人工神经网络 (1943), 深度学习 (1965), *控制论偶然发现》(1968)\n\n**在未来，**凯利相信我们将会遇到“合成外星人”，即我们创造的生物，这使我们不得不应对与来自外星智能外星人建立联系时所预期的收益和挑战。\n\
    \n![](img/#9781454933601_epub_cre_r1.xhtml#184-1) \n\n# 2015\n\n# “称它们人工外星人”\n\
    \n![](img/L01.jpg)\n\n“制造会思考机器最重要的意义在于，它们的思考方式不同，”凯文·凯利（Kevin Kelly，出生 1942 年，《连线》杂志创始执行编辑写道。在他广誉的\
    \ 2015 年文章《称它们人工外星人》中提到，“为了解决目前量子引力、暗能量和暗物质的巨大谜团，我们可能需要人类以外的智能。随而来的极其复杂的问题可能需要更远、更复杂的智能。事实上，我们可能需要发明中间智能来帮助我们设计我们无法独立设计的更稀有的智能。”\n\
    \n"
- fmt: "\nSo deep and difficult will be questions in the future that they will require\
    \ numerous different “species of minds” to solve them, along with new human skills\
    \ to interface with such minds. Kelly concludes his essay by comparing thinking\
    \ machines with aliens: “AI could just as well stand for Alien Intelligence. We\
    \ cannot be certain that we’ll contact extra-terrestrial beings . . . in the next\
    \ 200 years, but we can be almost 100 percent certain that we’ll have manufactured\
    \ an alien intelligence by then. When we face those synthetic aliens, we’ll encounter\
    \ the same benefits and challenges we expect from contact with ET. They’ll force\
    \ us to reevaluate our roles, our beliefs, our goals, our identity.”\n\nWe can\
    \ hardly imagine an antelope understanding the significance of prime numbers,\
    \ yet alterations of our own brains, along with the development of useful AI interfaces,\
    \ could admit a variety of profound concepts to which we are now totally closed.\
    \ If the yucca moth, with only a few ganglia for its brain, can recognize the\
    \ geometry of the yucca flower from birth, how much of our capacity is hardwired\
    \ into our convolutions of cortex? Of course, there are likely facets of the universe\
    \ we can never understand, just as an antelope could never understand calculus,\
    \ black holes, symbolic logic, or poetry. There are thoughts we can never think,\
    \ visions we can only glimpse. It is at this filmy, veiled interface between human\
    \ reality and a reality beyond that we may find the numinous, which some may liken\
    \ to dancing with the artificial gods.\n\n**SEE ALSO** [Searches for the Soul\
    \ (1907)](#9781454933601_epub_c031_r1.xhtml#c-031), [`Giant Brains, or Machines\
    \ That Think* (1949)](#9781454933601_epub_c041_r1.xhtml#c-041), [Intelligence\
    \ Explosion (1965)](#9781454933601_epub_c055_r1.xhtml#c-055), [Artificial Life\
    \ (1986)](#9781454933601_epub_c074_r1.xhtml#c-074)\n\n**Self-portrait of *Curiosity***\
    \ located at the foothill of Mount Sharp on Mars, October 6, 2015.\n\n![](OEBPS/images/186-1.jpg)\n\
    \n# 2015\n\n# AI ON MARS\n\n![](OEBPS/images/L01.jpg)\n\nArtificial intelligence\
    \ and autonomy will play increasing roles in space exploration as robotic spacecraft\
    \ and rovers need to make rapid, smart decisions, particularly when they are not\
    \ in constant communication with Earthlings back home. As we reach further into\
    \ the solar system, and even send rovers into the seas of faraway moons like Jupiter’s\
    \ Europa, communication delays can be particularly troublesome.\n\nOne recent\
    \ example of limited but fascinating AI in outer space involves the NASA `Curiosity`\
    \ rover, patrolling Mars to help determine whether the planet was ever capable\
    \ of sustaining life, and to help us better understand Martian geology, climate,\
    \ and radiation patterns. In 2015, `Curiosity` received an AI software upload\
    \ called Autonomous Exploration for Gathering Increased Science (`AEGIS`) to help\
    \ it with its tasks.\n\n“Right now Mars is entirely inhabited by robots,” says\
    \ planetary scientist Raymond Francis, “and one of them is artificially intelligent\
    \ enough to make its own decisions about what to zap with its laser.” If `Curiosity`\
    \ finds a particular surface feature of interest, it can vaporize a small portion\
    \ with a laser and examine the resulting spectra to estimate the rock’s composition.\
    \ If warranted, it can also use its long arm, microscope, and X-ray spectrometer\
    \ for a closer examination. In particular, `AEGIS` allows `Curiosity` to autonomously\
    \ select a target rock and accurately pinpoint it with the laser—using computer\
    \ vision to examine digital images, looking for edges, shapes, size, brightness,\
    \ and so forth. Journalist Marina Koren notes: “The software—just about 20,000\
    \ lines of code out of the 3.8 million that make `Curiosity` tick—has turned a\
    \ car-sized, six-wheeled, nuclear-powered robot into a field scientist.”\n\n`Curiosity`’s\
    \ investigations may one day pave the way for human exploration, and systems like\
    \ `AEGIS` will aid in this process by using machine learning and other AI approaches\
    \ to detect anomalies. Given that there are periods of time when `Curiosity` is\
    \ on the far side of Mars and cannot communicate with Earth and receive instructions,\
    \ and given that communication with Earth can drain power from the rover, AI can\
    \ be particularly useful when communication is limited or impossible.\n\n**SEE\
    \ ALSO** [Shakey the Robot (1966)](#9781454933601_epub_c059_r1.xhtml#c-059), [Autonomous\
    \ Vehicles (1984)](#9781454933601_epub_c072_r1.xhtml#c-072), [Roomba (2002)](#9781454933601_epub_c088_r1.xhtml#c-088)\n\
    \n**The AlphaGo computer program** defeated South Korean Lee Sedol, the first\
    \ time a program beat a 9-dan professional player, without handicaps.\n\n[![](OEBPS/images/188-1.jpg)](#9781454933601_epub_cre_r1.xhtml#188-1)\
    \ \n\n# 2016\n\n# ALPHAGO CHAMPION\n\n![](OEBPS/images/L01.jpg)\n\nWhile the rules\
    \ of Chess could only have been created by humans, the rules of Go are so elegant\
    \ that if intelligent life exist elsewhere, they almost certainly play Go. Go\
    \ is a two-player game that originated in China around 2000 BCE and spread to\
    \ Japan by the thirteenth century. In the game, players alternately place black-white\
    \ stones on a 19 × 19 board. A stone or a group of stones is captured and replaced\
    \ with stones of the opposite color if it is tightly surrounded, and the objective\
    \ is to control territory. Go is complex for many reasons, including its large\
    \ board, complex strategies, and huge numbers of variations. In fact, the number\
    \ of potential board positions is far more than the number of atoms in the universe!\n\
    \nIn 2016, AlphaGo became the first to defeat a professional Go player of the\
    \ highest rank. AlphaGo was developed by DeepMind Technologies, a British company\
    \ acquired by Google in 2014. Technically speaking, AlphaGo uses a Monte Carlo\
    \ tree-search algorithm and artificial neural networks to learn and play. In 2017,\
    \ a newer program version AlphaGo Zero learned Go by playing against itself millions\
    \ of times, without relying on data from human, and then invented superior approaches\
    \ in just a few days.\n\nReferring to the amazing approaches of AlphaGo, journalist\
    \ Dawn Chan explains that “from all accounts, one gets the sense that an alien\
    \ civilization has dropped a cryptic guidebook in our midst: a manual that’s brilliant—or\
    \ at least the parts of it we can understand.”\n\n**SEE ALSO** [Artificial Neural\
    \ Networks (1943)](#9781454933601_epub_c039_r1.xhtml#c-039), [Mastermind (1970)](#9781454933601_epub_c063_r1.xhtml#c-063),\
    \ [Backgammon Champion Defeated (1979)](#9781454933601_epub_c069_r1.xhtml#c-069),\
    \ [Deep Blue Defeats Chess Champion (1997)](#9781454933601_epub_c082_r1.xhtml#c-082),\
    \ [Othello (1997)](#9781454933601_epub_c083_r1.xhtml#c-083)\n\nImagine the future\
    \ of surgery where autonomous robots play an ever-increasing role, using their\
    \ own vision systems and machine intelligence. Perhaps they will be the heroes\
    \ of the operating room as they efficiently draw information from a CT or MRI\
    \ scan.\n"
  raw: "So deep and difficult will be questions in the future that they will require\
    \ numerous different “species of minds” to solve them, along with new human skills\
    \ to interface with such minds. Kelly concludes his essay by comparing thinking\
    \ machines with aliens: “AI could just as well stand for Alien Intelligence. We\
    \ cannot be certain that we’ll contact extra-terrestrial beings . . . in the next\
    \ 200 years, but we can be almost 100 percent certain that we’ll have manufactured\
    \ an alien intelligence by then. When we face those synthetic aliens, we’ll encounter\
    \ the same benefits and challenges we expect from contact with ET. They’ll force\
    \ us to reevaluate our roles, our beliefs, our goals, our identity.”\n\nWe can\
    \ hardly imagine an antelope understanding the significance of prime numbers,\
    \ yet alterations of our own brains, along with the development of useful AI interfaces,\
    \ could admit a variety of profound concepts to which we are now totally closed.\
    \ If the yucca moth, with only a few ganglia for its brain, can recognize the\
    \ geometry of the yucca flower from birth, how much of our capacity is hardwired\
    \ into our convolutions of cortex? Of course, there are likely facets of the universe\
    \ we can never understand, just as an antelope could never understand calculus,\
    \ black holes, symbolic logic, or poetry. There are thoughts we can never think,\
    \ visions we can only glimpse. It is at this filmy, veiled interface between human\
    \ reality and a reality beyond that we may find the numinous, which some may liken\
    \ to dancing with the artificial gods.\n\n**SEE ALSO** [Searches for the Soul\
    \ (1907)](#9781454933601_epub_c031_r1.xhtml#c-031), [*Giant Brains, or Machines\
    \ That Think* (1949)](#9781454933601_epub_c041_r1.xhtml#c-041), [Intelligence\
    \ Explosion (1965)](#9781454933601_epub_c055_r1.xhtml#c-055), [Artificial Life\
    \ (1986)](#9781454933601_epub_c074_r1.xhtml#c-074)\n\n**Self-portrait of *Curiosity***\
    \ located at the foothill of Mount Sharp on Mars, October 6, 2015.\n\n![](OEBPS/images/186-1.jpg)\n\
    \n# 2015\n\n# AI ON MARS\n\n![](OEBPS/images/L01.jpg)\n\nArtificial intelligence\
    \ and autonomy will play increasing roles in space exploration as robotic spacecraft\
    \ and rovers need to make rapid, smart decisions, particularly when they are not\
    \ in constant communication with Earthlings back home. As we reach further into\
    \ the solar system, and even send rovers into the seas of faraway moons like Jupiter’s\
    \ Europa, communication delays can be particularly troublesome.\n\nOne recent\
    \ example of limited but fascinating AI in outer space involves the NASA *Curiosity*\
    \ rover, patrolling Mars to help determine whether the planet was ever capable\
    \ of sustaining life, and to help us better understand Martian geology, climate,\
    \ and radiation patterns. In 2015, *Curiosity* received an AI software upload\
    \ called Autonomous Exploration for Gathering Increased Science (AEGIS) to help\
    \ it with its tasks.\n\n“Right now Mars is entirely inhabited by robots,” says\
    \ planetary scientist Raymond Francis, “and one of them is artificially intelligent\
    \ enough to make its own decisions about what to zap with its laser.” If *Curiosity*\
    \ finds a particular surface feature of interest, it can vaporize a small portion\
    \ with a laser and examine the resulting spectra to estimate the rock’s composition.\
    \ If warranted, it can also use its long arm, microscope, and X-ray spectrometer\
    \ for a closer examination. In particular, AEGIS allows *Curiosity* to autonomously\
    \ select a target rock and accurately pinpoint it with the laser—using computer\
    \ vision to examine digital images, looking for edges, shapes, size, brightness,\
    \ and so forth. Journalist Marina Koren notes: “The software—just about 20,000\
    \ lines of code out of the 3.8 million that make *Curiosity* tick—has turned a\
    \ car-sized, six-wheeled, nuclear-powered robot into a field scientist.”\n\n*Curiosity*’s\
    \ investigations may one day pave the way for human exploration, and systems like\
    \ AEGIS will aid in this process by using machine learning and other AI approaches\
    \ to detect anomalies. Given that there are periods of time when *Curiosity* is\
    \ on the far side of Mars and cannot communicate with Earth and receive instructions,\
    \ and given that communication with Earth can drain power from the rover, AI can\
    \ be particularly useful when communication is limited or impossible.\n\n**SEE\
    \ ALSO** [Shakey the Robot (1966)](#9781454933601_epub_c059_r1.xhtml#c-059), [Autonomous\
    \ Vehicles (1984)](#9781454933601_epub_c072_r1.xhtml#c-072), [Roomba (2002)](#9781454933601_epub_c088_r1.xhtml#c-088)\n\
    \n**The AlphaGo computer program** defeated South Korean Lee Sedol, the first\
    \ time a program beat a 9-dan professional player, without handicaps.\n\n[![](OEBPS/images/188-1.jpg)](#9781454933601_epub_cre_r1.xhtml#188-1)\
    \ \n\n# 2016\n\n# ALPHAGO GO CHAMPION\n\n![](OEBPS/images/L01.jpg)\n\n“While the\
    \ Baroque rules of Chess could only have been created by humans, the rules of\
    \ Go are so elegant, organic, and rigorously logical that if intelligent life\
    \ forms exist elsewhere in the universe, they almost certainly play Go,” explained\
    \ German-American chess and Go expert Edward Lasker (1885–1981).\n\nGo is a two-player\
    \ board game that originated in China possibly around 2000 BCE and spread to Japan,\
    \ where it became popular in the thirteenth century CE. In the game, players alternately\
    \ place black-and-white stones on intersections of a 19 × 19 playing board. A\
    \ stone or a group of stones is captured and replaced with stones of the opposite\
    \ color if it is tightly surrounded by stones of the opposing player, and the\
    \ objective is to control a larger territory than one’s opponent. Go is complex\
    \ for many reasons, including its large game board, complex strategies, and huge\
    \ numbers of variations possible in games. In fact, the number of potential legal\
    \ board positions is far more than the number of atoms in the visible universe!\n\
    \nIn 2016, the AlphaGo computer program became the first to defeat a professional\
    \ Go player of the highest rank, without handicaps, when it defeated Lee Sedol\
    \ (b. 1983) of South Korea. AlphaGo was developed by DeepMind Technologies, a\
    \ British AI company acquired by Google in 2014. Technically speaking, AlphaGo\
    \ uses a Monte Carlo tree-search algorithm and artificial neural networks to learn\
    \ and play the game. In 2017, a newer program version named AlphaGo Zero learned\
    \ Go by playing against itself many millions of times, without relying on data\
    \ from human matches, and then promptly defeated AlphaGo. In some sense, AlphaGo\
    \ Zero discovered or derived thousands of years of human insight, creativity,\
    \ and training—and then invented superior approaches in just a few days.\n\nReferring\
    \ to the amazing playing ap-proaches of AlphaGo, journalist Dawn Chan explains\
    \ that “from all accounts, one gets the sense that an alien civilization has dropped\
    \ a cryptic guidebook in our midst: a manual that’s brilliant—or at least, the\
    \ parts of it we can understand.”\n\n**SEE ALSO** [Artificial Neural Networks\
    \ (1943)](#9781454933601_epub_c039_r1.xhtml#c-039), [Mastermind (1970)](#9781454933601_epub_c063_r1.xhtml#c-063),\
    \ [Backgammon Champion Defeated (1979)](#9781454933601_epub_c069_r1.xhtml#c-069),\
    \ [Deep Blue Defeats Chess Champion (1997)](#9781454933601_epub_c082_r1.xhtml#c-082),\
    \ [Othello (1997)](#9781454933601_epub_c083_r1.xhtml#c-083)\n\n**Imagine the future\
    \ of surgery** where autonomous robots play an ever-increasing role, using their\
    \ own vision systems and machine intelligence. Perhaps they will be the heroes\
    \ of the operating room as they efficiently draw information from a CT or MRI\
    \ scan.\n\n[![](OEBPS/images/190-1.jpg)](#9781454933601_epub_cre_r1.xhtml#190-1)\
    \ \n\n# 2016\n\n# AUTONOMOUS ROBOTIC SURGERY\n\n![](OEBPS/images/L01.jpg)"
