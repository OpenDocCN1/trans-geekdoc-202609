    # 1714


    # THE CONSCIOUSNESS MILL


    ![](OEBPS/images/L01.jpg)


    If we believe that consciousness is the result of patterns and dynamic inter-relationships
    of brain cells and their components, then our thoughts, emotions, and memories
    might be replicated in moving assemblies of Tinkertoys^®. The Tinkertoy minds
    would need to be very big to represent the complexity of our minds, but perhaps
    a very complex mechanism could be created, in the same way researchers have made
    tic-tac-toe playing computers out of 10,000 Tinkertoys. In principle, our minds
    could be hypostatized in the movements of leaves and twigs or in the flocking
    of birds. In 1714, the German philosopher and mathematician Gottfried Leibniz
    in his treatise *The Monadology* imagined an AI-infused machine as big as a mill
    that was capable of thinking and feeling. He also realized that if we could explore
    inside, we would find “nothing but pieces that push one against the other and
    never anything to account for perception.” Similarly, it’s possible that conscious
    AI entities could be developed in the future, even if they are not formed from
    wet matter.


    Philosopher Nick Bostrom (b.1973) considers a single electronic brain: “The brain
    is a physical object with certain characteristics. If we come to fully understand
    these characteristics and learn to replicate them electronically, then surely
    our electronic brain can perform the same function as organic one. And if it can
    be done with a brain, why’t the resulting system be just as conscious as you?”


    As roboticist Hans Moravec (b.1948) writes: “We’re a conscious being simulated
    on a bunch of neural hardware, and the conscious being is only found in interpretation
    of things that go on the hardware. It’s not the actual chemical signals that squirting
    around, it’s a certain high-level interpretation of aggregate of those signals,
    the only thing that makes consciousness different from other interpretations,
    like the value of a dollar.” Similarly, perhaps your brain could function even
    if partitioned into a hundred little boxes, separated by great distances and connected
    by wires or optical fibers. To understand this better, imagine your left and right
    hemispheres a mile apart and connected by artificial callosum. You would still
    be you, right?


    **SEE ALSO** [Tic-Tac-Toe (c. 1300)](#9781454933601_epub_c001_r1.xhtml#c-001),
    [Hobbes’s *Leviathan* (1651)](#9781454933601_epub_c014_r1.xhtml#c-014), [de Vaucanson’s
    Duck Automaton (1738)](#9781454933601_epub_c017_r1.xhtml#c-017), [Searches for
    the Soul (1907)](#9781454933601_epub_c031_r1.xhtml#c-031), [`Giant Brains, or
    Machines That Think` (1949)](#9781454933601_epub_c041_r1.xhtml#c-041), [`Living
    in a Simulation` (1967)](#9781454933601_epub_c060_r1.xhtml#c-060)


    **The writing machine of Lagado,** illustrated by French artist J. J. Grandville
    (1803–1847), which appeared in a French translation of *Gulliver’s Travels* from
    1856.


    [![](OEBPS/images/30-1.jpg)](#9781454933601_epub_cre_r1.xhtml#30-1)


    # 1726


    # LAGADO BOOK-WRITING ENGINE


    ![](OEBPS/images/L01.jpg)


    *Gulliver’s Travels*, a popular novel published in 1726 by Anglo-Irish author
    Jonathan Swift (1667–1745), describes a mechanical creativity engine that may
    be the first AI device extensively discussed in a novel. While Gulliver is in
    the fictional city of Lagado, a professor shows him a device for generating literature,
    technical books, and interesting ideas. Gulliver explains how, “By his contrivance,
    the most ignorant person, at a reasonable charge, and with a little bodily labor,
    might write books in philosophy, poetry, politics, laws, mathematics, and theology,
    without the least assistance from genius or study.”


    Gulliver is led to the device, which occupies twenty square feet in area and has
    various wooden surfaces “linked together by slender wires.” The tile-like surfaces
    are covered with paper on which “were written all the words of their language,
    in their several moods, tenses, and declensions; but without any order.”


    Gulliver described the device’s operation: “The pupils, at his command, took each
    of them hold of an iron handle, whereof there were forty fixed round the edges
    of the frame; and giving them a sudden turn, the whole disposition of the words
    was entirely changed. He then commanded [the pupils] to read the several lines
    softly, as they appeared upon the frame; and where they found three or four words
    together that might make part of a sentence, they dictated to the four remaining
    boys, who were scribes. . . . At every turn, . . . the words shifted into new
    places, as the square bits of wood moved upside down.”


    Author Eric A. Weiss writes: “[The machine’s] purpose, the claims of its illustrious
    professor-inventor, his call for public funding, and the operation of the device
    by students clearly classify it as an early attempt at artificial intelligence
    and have caused it to be cited often as typical of this discipline.” Later forms
    of combinatorial, random, or artificial creativity in the real world include Racter,
    a computer program that generated prose for the book *The Policeman’s Beard Is
    Half Constructed*, published in 1984.


    **SEE ALSO** [Ramon Llull’s *Ars Magna* (c. 1305)](#9781454933601_epub_c010_r1.xhtml#c-010),
    [Computational Creativity (1821)](#9781454933601_epub_c021_r1.xhtml#c-021), [`Cybernetic
    Serendipity` (1968)](#9781454933601_epub_c061_r1.xhtml#c-061)


    **Popular illustration of de Vaucanson’s duck automaton,** which appeared in the
    January 21, 1899 issue of *Scientific American*. Although the mechanism portrayed
    here does not closely resemble the actual internal structure, the arrow is nicely
    placed to indicate the exit route.


