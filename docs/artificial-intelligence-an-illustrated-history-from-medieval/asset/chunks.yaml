    \ \n\n# 1943\n\n# ARTIFICIAL NEURAL NETWORKS\n\n![](OEBPS/images/L01.jpg)\n\n\
    Artificial neural networks (ANNs) are often schematically represented like layer\
    \ cakes, made from icing and stacked sheets of cake. For our purposes, the layers\
    \ contain neurons in the form of simple computational units that become “excited”\
    \ and propagate that excitement to other connected neurons. A weight, or strength,\
    \ factor determines how much excitement should get passed along. Through a training\
    \ period, as various weights and thresholds are adjusted from an initially random\
    \ state, these systems can learn to perform tasks, such as recognizing an image\
    \ of an elephant—by first analyzing numerous images that have been labeled as\
    \ “elephant” and “not elephant.” Various embellishments to the basic neural net\
    \ function include “backpropagation,” which can pass information in a reverse\
    \ direction. Neural networks are now used in a wide variety of research and practical\
    \ applications, including game playing, vehicle control, drug design, cancer detection\
    \ in medical images, and language translation.\n\nSome of the basic computational\
    \ models in neural nets were discussed by neurophysiologist Warren McCulloch (1898–1969)\
    \ and logician Walter Pitts (1923–1969) in their 1943 paper “A Logical Calculus\
    \ of the Ideas Immanent in Nervous Activity,” published in the *Bulletin of Mathematical\
    \ Biophysics*. In 1957, Frank Rosenblatt (1928–1971) created the perceptron algorithm\
    \ for pattern recognition, which was subsequently implemented in computer hardware.\
    \ In the twenty-first century, the utility of ANNs dramatically improved through\
    \ the use of distributed computing (e.g., on different networked computers) and\
    \ GPU (graphical processing unit) hardware."
