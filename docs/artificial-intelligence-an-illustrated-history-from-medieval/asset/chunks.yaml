  trans: "\n《控制论机缘：计算机与艺术》（1968）是一本具有开创性的插图书籍和目录，记录了伦敦当代艺术学院（后在华盛顿特区和旧金山）举办的备受瞩目的展览。该书由英国艺术评论家贾西亚·雷克哈特（Jasia\
    \ Reichardt，1933 年出生）编辑和策展。书籍及同步展览的显著之处在于展示了计算机辅助创作的多个方面，从视觉艺术到音乐、诗歌、故事讲述、舞蹈、动画和雕塑，激发了一代涉及艺术家、科学家和工程师的实验性合作。\n\
    \n在 1948 年，美国数学家和哲学家诺伯特·维纳（Norbert Wiener，1894–1964）将*控制论*（cybernetics）定义为“对动物和机器控制与通信的科学研究”；今天这个词有了更广泛的含义，涉及使用电子设备等技术对多种系统的控制。*机缘*（Serendipity）通常指偶然产生的意想不到、惊喜且实用的结果。\n\
    \n由于包含了艺术家、作曲家、诗人和计算机程序员等参与者，《控制论机缘》提出了关于艺术本质和偶然性的问题。书中引人注目的部分是美丽的计算机化日本俳句，并配有生成这些诗句的算法配方。例如，一首久久不去的诗开头写道：“冰层深处，我在旋涡中画出所有时间\
    \ . .……”另一部分涉及由计算机使用简单规则构建的“小灰兔类故事”。一个典型的故事可能这样开头：“阳光洒在森林上。微风在田野上轻地拂过，随后整个下午都在静静漂浮的云朵穿过了田野\
    \ . .……”\n\n除了诗歌和故事，《控制论机缘》还展示了绘画机器以及一系列在机械计算机绘图仪或 CRT 射线显示器上制作的计算机艺术，激发了对算法和/或生成性艺术这一新兴领域感兴趣的人。书中还包括根据纽约天际线轮廓或墨水溅迹生成的乐谱、各种形式的电子音乐机器、计算机程序编舞、声控移动装置、摆钟画图机和调图仪、建筑作品、伪蒙德里安绘画等。\n\
    \n**另见** 拉蒙·卢卢的《大艺术》（约 1305 年）, 拉加多写书引擎（1726）, 计算创造力（1821）, 计算机艺术与深梦（2015）\n\n\
    **《2001 太空漫游》中 HAL 9000 著名的红色全视摄像眼睛渲染图。**\n\n![](img/#9781454933601_epub_cre_r1.xhtml#122-1)\
    \ \n\n# 1968\n\n# HAL 9000\n\n![](img/L01.jpg)\n\n“我的任务职责涵盖飞船的整个运行，所以我一直很忙，”HAL\
    \ 9000 解释道，它是著名的 1968 年电影《2001 太空漫游》中的虚构人工智能。“我正在充分发挥自己的作用，这是我认为任何意识实体所希望做到的。”遗憾对于船员们来说，HAL\
    \ 后来变成了一个必须被终结的杀手。\n\nHAL 之所以重要，是因为许多著名的 AI 研究人员表示，他们在观看这部电影后受到启发，开始探索 AI 领域。电影的剧本由斯坦丹·库布里里克（Stanley\
    \ Kubrick，1928–1999）和亚瑟·C·克拉克（Arthur C. Clarke，1917–2008）共同编写。有趣的是，HAL 体现了许多我们今天对未来通用人工智能（AGI）所期待的能力，即能够在广广泛的目标和环境中表现出智能。这台感感知机器具备计算机视觉、语音识别、人脸识别、语音输出、自然语言处理、下棋以及各种形式的高级推理、规划等能力。\n"
