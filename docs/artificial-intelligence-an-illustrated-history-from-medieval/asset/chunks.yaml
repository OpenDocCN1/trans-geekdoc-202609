    \ \n\n# 1999\n\n# AIBO ROBOT\n\n![](OEBPS/images/L01.jpg)\n\nThe dog-like robot\
    \ AIBO, introduced by the Sony Corporation in 1999, was one of the world’s first\
    \ mass-market sophisticated consumer robots for entertainment. Enjoyed by children\
    \ and adults, AIBO also was used in AI education and for research purposes because\
    \ it included a vision system and articulators in a relatively inexpensive package.\
    \ The robots have also been used in RoboCup^® autonomous soccer competitions,\
    \ many of which can be viewed on YouTube, showing how the dogs search for the\
    \ ball and move it toward the goal.\n\nThe AIBO, which takes its name from the\
    \ Japanese word for “pal,” could respond to numerous commands and made use of\
