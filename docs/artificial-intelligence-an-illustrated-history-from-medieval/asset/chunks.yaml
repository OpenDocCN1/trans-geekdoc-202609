    Today, the Loebner competition is held each year, in part, to honor the computer
    programmers who create programs that come closest to passing the Turing test.
    Of course, the Turing test has stimulated much debate and controversy over the
    years. For example, if the computer actually far more “intelligent” than humans,
    it will need to pretend to be less intelligent because the test is focused on
    imitating humans. As a result, devious and funny techniques that introduce typing
    errors, change the topic of conversation, inject jokes, ask the judges questions,
    and so forth were often used to fool judges. In 2014, a conversational robot developed
    by programmers in Russia passed a version of the test, pretending to be a thirteen-year-old
    Ukrainian boy named Eugene Goostman.


    Another challenge to the value of the Turing test is that the level of expertise
    of the human judges can easily change the outcome of the test. However, whatever
    we think about the test’s ability to detect “intelligence,” it definitely inspires
    creativity in computer programmers and engineers.


    **SEE ALSO** [“Darwin among the Machines” (1863)](#9781454933601_epub_c025_r1.xhtml#c-025),
    [*Giant Brains, or Machines That Think* (1949)](#9781454933601_epub_c041_r1.xhtml#c-041),
    [Natural Language Processing (1954)](#9781454933601_epub_c046_r1.xhtml#c-046),
    [ELIZA Psychotherapist (1964)](#9781454933601_epub_c053_r1.xhtml#c-053), [Chinese
    Room (1980)](#9781454933601_epub_c070_r1.xhtml#c-070), [Moravec’s Paradox (1988)](#9781454933601_epub_c076_r1.xhtml#c-076)


    **Norbert Wiener wrote** that the machine that “can learn and can make decisions
    on the basis of its learning, will in no way be obliged to make such decisions
    as we should have made, or will be acceptable to us.”


    [![](OEBPS/images/84-1.jpg)](#9781454933601_epub_cre_r1.xhtml#84-1)


    # 1950


    # THE HUMAN USE OF HUMAN BEINGS


    ![](OEBPS/images/L01.jpg)


    Norbert Wiener (1894–1964), the influential American mathematician and philosopher,
    was one of the key originators of the field of cybernetics, which is concerned
    with feedback in many realms of human endeavor and technology. According to AI
    expert Daniel Crevier, Wiener believed that feedback mechanisms are “information-processing
    devices: they receive information and then make a decision based on it. Wiener
    speculated that all intelligent behavior is the consequence of feedback mechanisms;
    perhaps by definition, intelligence is the outcome of receiving and processing
    information.”


    In his book *The Human Use of Human Beings* (1950)](#9781454933601_epub_c043_r1.xhtml#c-043),
    Wiener contemplates ways in which humans and machines will cooperate, and his
    vision certainly has applicability today with people in nearly constant communication:
    “It is the thesis of this book that society can only be understood through a study
    of the messages and communication facilities which belong to it; and in the future,
    development of these messages and communication facilities, between man and machines,
    between machines and man, and between machine and machine, are destined to play
    an increasing part.”


    He presciently contemplated the need for future machines that learn, but he also
    provided warnings about delegating decision-making processes to literal-minded
    machines: “Any machine constructed for the purpose of making decisions, if it
    does not possess the power of learning, will be literal minded. Woe to us if we
    let it decide our conduct, unless we have previously examined its laws of action
    and know fully that its conduct will be carried out on principles acceptable to
    us! The machine that can learn and can make decisions on the basis of its learning,
    will in no way be obliged to make such decisions as we should have made, or will
    be acceptable to us. If a man gives responsibility to the machine, whether it
    can learn or not, is to cast his responsibility to the winds, and find it coming
    back seated on the whirlwind.”


    These words of caution have relevance for us today, with many futurists warning
    of the need for formulating paths to safe general intelligence. **SEE ALSO** [“Darwin
    among the Machines” (1863)](#9781454933601_epub_c025_r1.xhtml#c-025), [Tesla’s
    “Borrowed Mind” (1898)](#9781454933601_epub_c029_r1.xhtml#c-029), [Dartmouth AI
    Workshop (1956)](#9781454933601_epub_c047_r1.xhtml#c-047), [Intelligence Explosion
    (1965)](#9781454933601_epub_c055_r1.xhtml#c-055), [Deep Learning (1965)](#9781454933601_epub_c058_r1.xhtml#c-058)


    Reinforcement learning is an approach for teaching useful actions to software
    agents so to maximize a cumulative reward. Famous early uses included maze solving
    and learning to play checkers, tic-tac-toe, and backgammon.


    [![](OEBPS/images/86-1.jpg)](#9781454933601_epub_cre_r1.xhtml#86-1)


    # 1951


    # REINFORCEMENT LEARNING


    ![](OEBPS/images/L01.jpg)


    Reinforcement learning is reminiscent of a simple behavior observed in cats seeking
    rewards. In the early 1900s, the psychologist Edward Thorndike (1874–1949) placed
    cats inside boxes from which they could escape only by stepping on a switch. After
    some wandering, the cats would eventually step on the switch by chance, and the
    door would open, and the cat would be rewarded, for example, with food. After
    the cats learned to associate this behavior with the reward, they escaped with
    increasing speed, up to, eventually, a maximum rate of escape.


    In 1951, cognitive scientist Marvin Minsky (1927–2016) and his student Dean Edmunds
    built SNARC (Stochastic Neural Analog Reinforcement Calculator), a neural network
    machine consisting of 3,000 vacuum tubes to simulate 40 connected neurons. Minsky
    used the machine to study a scenario involving a simulated rat navigating a maze.
    When, by chance, the rat made a sequence of useful moves and escaped from a maze,
    the connections corresponding to these moves were strengthened, thus reinforcing
    the desired behavior, facilitating learning. Other famous early examples of reinforcement
    learning devices include systems for playing checkers (1959), tic-tac-toe (1960),
    and backgammon (1992).


    As implied by these examples, in its simplest definition, reinforcement learning
    (RL) is an area of machine learning that involves traversing a collection of states
    to receive a reward or to maximize a cumulative reward. The “learner” discovers
    which actions yield the highest reward by repeatedly testing actions. Today, RL
    is often combined with deep learning, which involves a large simulated neural
    network, often to recognize patterns in data. With RL, a system or machine can
    learn without explicit instructions; thus, machines like self-driving cars, industrial
    robots, and drones can develop and improve skills through trial and error and
    experience. One practical challenge of broadly applying RL is that it requires
    a large amount of data and practice simulations.


    **SEE ALSO** [Tic-Tac-Toe (c. 1300 BCE)](#9781454933601_epub_c001_r1.xhtml#c-001),
    [Artificial Neural Networks (1943)](#9781454933601_epub_c039_r1.xhtml#c-039),
    [Machine Learning (1959)](#9781454933601_epub_c050_r1.xhtml#c-050), [Backgammon
    Champion Defeated (1979)](#9781454933601_epub_c069_r1.xhtml#c-069), [Checkers
    and AI (1994)](#9781454933601_epub_c080_r1.xhtml#c-080)

