    \ \n\n# 1982\n\n# *BLADE RUNNER*\n\n![](OEBPS/images/L01.jpg)\n\nIn the future,\
    \ intelligent robots will likely be difficult to distinguish from human beings,\
    \ at least through a superficial inspection. When that day arrives, what effect\
    \ will this have on humanity and human relations? This theme has been explored\
    \ in several famous movies, and one particularly influential film on the subject\
    \ is the 1982 cult movie *Blade Runner*, directed by Ridley Scott (b. 1937) and\
    \ based on the 1968 novel *Do Androids Dream of Electric Sheep?* by Philip K.\
    \ Dick (1928–1982). Set in a futuristic Los Angeles in the year 2019, the film\
    \ depicts replicants, which are synthetic humans that must be “retired” (killed)\
    \ by the movie’s protagonist. These replicants are so similar to humans that the\
    \ way to distinguish them from humans is by administering the Voigt-Kampff test,\
    \ which involves studying subtle emotional responses and eye movements of the\
    \ replicants when asked a set of questions. One of the replicants, Rachael, believes\
    \ she is human and has had memories implanted to give her a fuller personal history\
    \ and the illusion of a human experience.\n\nReflecting on the character of Rachael\
    \ in *Blade Runner,* author and researcher Jelena Guga writes: “Humans aspire\
    \ to creating AI, but the kind of AI that they can be in control of. Thus, in\
    \ the film, the solution to \\[the\\] autonomous, independent AI problem is solved\
    \ by implanted memories that can be controlled. . . . Ethics, free will, dreams,\
    \ memories, and all those values attributed exclusively to humans, are “brought\
    \ into question” and radically redefined through popular representations of humanoid\
    \ robots . . . developed in such a way \\[as\\] to be able to express perhaps\
    \ even more humanness than humans.”\n\n“How we ought to treat artificial forms\
    \ of life becomes an increasingly important issue,” writes philosopher Greg Littmann,\
    \ “as humans continue to develop sophisticated computer systems and perform wonders\
    \ with genetic engineering. Philosophically challenging films like the grim science\
    \ fiction nightmares of Scott are useful when we ask ourselves about our real-world\
    \ obligations, since these allow us to test our preconceptions against hypothetical\
    \ situations to see whether our theories are consistent.”\n\n**SEE ALSO** [*Metropolis*\
    \ (1927)](#9781454933601_epub_c034_r1.xhtml#c-034), [Asimov’s Three Laws of Robotics\
    \ (1942)](#9781454933601_epub_c037_r1.xhtml#c-037), [Ethics of AI (1976)](#9781454933601_epub_c068_r1.xhtml#c-068),\
    \ [*The Terminator* (1984)](#9781454933601_epub_c073_r1.xhtml#c-073), [Spielberg’s\
    \ *A.I. Artificial Intelligence* (2001)](#9781454933601_epub_c086_r1.xhtml#c-086)\n\
    \n**Self-driving vehicles sense their surroundings** using various technologies.\
    \ Possible levels of autonomy range from low levels that exist today in many cars\
    \ (e.g., lane-keeping assistance and automatic emergency braking) to complete\
    \ autonomy, where no driver attention is ever required.\n\n[![](OEBPS/images/142-1.jpg)](#9781454933601_epub_cre_r1.xhtml#142-1)\
