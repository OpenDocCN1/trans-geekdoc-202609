    今天，人工智能的主要计算方法和赋能者之一是机器学习。它在计算机视觉、语音理解、自主机器人、自动驾驶、人脸识别、电子邮件过滤、光学字符识别、产品推荐、识别可能的癌症、检测数据泄露等方面发挥着作用。许多形式的机器学习都需要大量的输入数据进行训练，以帮助进行预测和分类。


    通过`supervised machine learning`，可以向算法投送带有信息标签的数据样本，以便系统在稍后提供未标记数据时能够做出预测。例如，考虑一个摄取了
    100,000 张狮子和老虎图像的系统，这些图像已由人类正确标记为“狮子”或“老虎”。随后，监督学习算法应该能够区分它以前未见过的狮子和老虎。而`unsupervised
    machine learning`则使用未标记的数据，以便系统可以发现隐藏的模式。例如，系统可能会确定，停止购买金枪鱼罐头鱼的三十岁女性可能怀孕怀孕，因此是婴儿产品广告的目标群体。


    请注意，机器学习方法可能会出错——例如，如果输入数据存在偏差、错误，甚至被恶意操纵。在决定谁应该有权获得贷款、获得工作或获得假释时，我们应该谨慎不要过度依赖某些自动化方法。这一原则适用于许多机器中介决策的领域。


    **另需参** 人工智能神经网络 (1943), 强化学习 (1951), 自然语言处理 (1954), 知识表示与推理 (1959), 深度学习 (1965),
    遗传算法 (1975), 群智能 (1986), 对抗性补丁 (2018)


    **MYCIN 是一个专家系统**，它使用人工智能来识别导致严重感染（如脑膜炎）的细菌并建议治疗方案。MYCIN 采用简单的推理引擎和一个包含约 600 条规则的知识库。这里展示的是引起脑膜炎的*肺炎球菌*。


    ![![](img/100-1.jpg)](#9781454933601_epub_cre_r1.xhtml#100-1)


    # 1959


    # 知识表示与推理


    ![](img/L01.jpg)


    “为了使系统变得智能，”计算机科学家尼尔斯·尼尔松（Nils Nilsson）写道，“它必须拥有关于世界的知识，并能够从这些知识得出结论，或至少根据这些知识采取行动。因此，人类和机器都必须以内部结构表示所需的知识，无论是编码在蛋白质还是硅中。”如今，对人工智能的注意力大部分放在机器学习和用于图像识别等应用的统计算法上。尽管如此，基于逻辑的知识表示与推理（KR）在许多领域仍发挥着重要作用。


    KR 是人工智能的一个领域，旨在以计算机系统可以有效利用信息的方式来呈现医疗诊断和法律建议，并促进如 iPhone 上的 Siri 或 Amazon Echo  Alexa
    等智能对话系统。例如，`semantic network`有时被用作 KR 的形式，表示概念之间的语义（即意义）关系。这些语义网络通常以图的形式存在，顶点表示概念，边（连接线）表示它们之间的语义关系。KR
    还应用于自动推理，包括数学定理的自动证明。


    AI KR 的早期工作包括通用问题求解器（General Problem Solver），这是艾伦·纽维尔（Allen Newell, 1927–1992）、赫伯特·西蒙（Herbert
    Simon, 1916–2001）及其同事于 1959 开发的计算机程序，用于分析目标并解决简单的通用问题（例如汉诺塔）。后来，由道格拉斯·莱纳特（Douglas
    Lenat，1950 年出生）于 1984 年启动的 Cyc 项目通过大量分析师记录各个常识推理领域，以帮助 AI 系统执行类人推理（例如，Cyc 推理引擎采用逻辑演绎和归纳推理）。今天，KR
    领域的 AI 研究人员处理许多问题，包括确保知识库可以根据需要更新，以便高效开发新的推理。研究人员还关注如何在 KR 系统中最好地处理不确定性和模糊性。


    **另需参** 亚里士多德的《工具论》（约公元 350 年）, 汉诺塔 (1883), 感知器 (1957), 机器学习 (1959), 专家系统 (1965),
    模糊逻辑 (1965)


    **约瑟夫·利西德（Joseph Lickider）写道：** “希望……人类大脑和计算机器将紧密地结合在一起，由此产生的合作将以人类大脑从未过的方式进行思考。”


