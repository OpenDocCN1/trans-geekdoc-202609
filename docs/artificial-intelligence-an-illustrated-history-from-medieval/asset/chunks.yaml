    # History of Real-World Robots


    The history of real-world robots has had several notable milestones, just a few
    favorites of which are listed here. Three-wheeled “tortoises,” developed in 1949
    by British neurophysiologist William Walter (1910–1977), could autonomously explore
    the environment using various sensors. In 1961, Unimate, created by American inventor
    George Devol (1912–2011), became the world’s first industrial robot and was employed
    on the General Motors automobile assembly line. In 1973, Japan’s WABOT-1—the world’s
    first full-scale, humanoid, intelligent robot—required 45 seconds for each step.
    In 1989, MIT showed off the six-legged robot insect named Genghis, developed by
    roboticist Rodney Brooks (b. 1954), which employed simple logic rules in order
    to walk and explore. In 1998, Tiger Electronics released the owl-like Furby^,
    which sold over 40 million units in a few years. Although a very simple robot,
    Furby produced “Furbish” speech output that transformed into English over time,
    giving the impression that it could learn language just as humans do. Finally,
    BigDog, a four-legged robot created in 2005 by Boston Dynamics and partners, was
    notable for its ability to walk across a variety of difficult terrains.


    Perhaps one of the most iconic of modern real-world robots has been Advanced Step
    in Innovative Mobility (ASIMO^), introduced by the Honda Motor Company in 2000
    to significant mainstream fanfare. The humanoid robot was 4 feet, 3 inches tall
    (130 cm) and, using its internal cameras and various sensors, was capable of autonomous
    navigation by walking. ASIMO could recognize gestures, faces, and sounds, and
    it could also grasp objects.


    Our complex future will surely have a continuing need for AI, and robots will
    play an increasing collaborative role with humans. Perhaps someday robots like
    ASIMO will assist the elderly or infirm. However, as cyberneticist Norbert Wiener
    cautions, “The world of the future will be an even more demanding struggle against
    the limitations of our intelligence, not a comfortable hammock in which we can
    lie down to be waited upon by our robot slaves.”


    **SEE ALSO** `[Elektro the Moto-Man (1939)](#9781454933601_epub_c035_r1.xhtml#c-035)`,
    `[Shakey the Robot (1966)](#9781454933601_epub_c059_r1.xhtml#c-059)`, `[AIBO Robot
    (1999)](#9781454933601_epub_c084_r1.xhtml#c-084)`, `[Roomba (2002)](#9781454933601_epub_c088_r1.xhtml#c-088)`,
    `[AI on Mars (2015)](#9781454933601_epub_c094_r1.xhtml#c-094)`


    *The Adventures of Pinocchio* was one of the inspirations for Stanley Kubrick
    during the development of *A.I*. Pinocchio, the wooden puppet, dreamed of becoming
    a human.


    # 2001: SPIELBERG’S A.I. ARTIFICIAL INTELLIGENCE


    The film *A.I. Artificial Intelligence*, directed by Steven Spielberg (b. 1946),
    is a provocative drama that makes us question the future of AI and the capabilities
    of an android boy named David, given as a gift to mother because she misses her
    son. The movie is based on the 1969 story “Supertoys Last Summer” by English author
    Aldiss (1925–2017). Although the film was not released until 2001, its development
    began in the 1970s, when director Stanley Kubrick acquired film rights.


    Much of the film follows David after his separation from his mother and his attempt
    to return to her. He is accompanied on his quest by Teddy, an AI bear, as he seeks
    Blue Fairy (inspired by film Pinocchio), who David believes can turn him into
    a “real” human. In one part of the journey, David’s engineer explains to David
    that the Blue Fairy is part of the great flaw to wish for things that don’t exist,
    or the greatest single human gift—the ability to dream. And that is something
    no machine has ever done.


    Viewers of the film debated whether an android could truly love, with film critic
    Roger Ebert (1942–2013) writing that an android is merely “a puppet with computer
    program pulling its strings.” Toward the end of the film, after two thousand years
    in suspended animation, David encounters spindly AIs that have evolved from androids
    like him and have taken a particular interest in David, because he is the last
    being who has actually encountered humans. They allow him to spend one last day
    with a clone of his long-dead mother. Reflecting on the sad but thought-provoking
    film *Empire of Dreams* author Andrew Gordon writes: “We measure ourselves against
    the robot, trying to define what makes us human, fearing that even as we become
    robotic, our creations become more human and may ultimately surpass us. . . A
    robot has become ‘human’ by attaining the ability to dream, yet dreams of the
    human are all that is left of humanity.”


    **SEE ALSO** `[“The Artist of the Beautiful” (1844)](#9781454933601_epub_c023_r1.xhtml#c-023)`,
    `[Transhumanism (1957)](#9781454933601_epub_c049_r1.xhtml#c-049)`, `[Blade Runner
    (1982)](#9781454933601_epub_c071_r1.xhtml#c-071)`


    **Awari has fascinated researchers** in the field of artificial intelligence.
    In 2002, computer scientists calculated the outcome for all 889,063,398,406 positions
    that can occur in the game, and proved that Awari must end in a draw for perfect
    players.


    # 2002: SOLVING THE GAME OF AWARI


    Researchers studying artificial intelligence have invested great effort developing
    game-playing programs—both as a test of AI strategies and to push the limits of
    software and hardware. One interesting example in the history of game playing
    involves Awari, a 3,500-year-old African board game. Classified as a count-and-capture
    game, Awari is a member of a set of strategy games called *mancala* and has various
    different names in different countries.


    The Awari board consists of two rows of six cup-like hollows—with four markers
    (beans, seeds, or pebbles) in each hollow—where one row belongs to each player.
    On a player’s turn, the player chooses one of his her six cups, withdraws all
    seeds from that cup, and drops one seed in each cup counterclockwise from this
    cup. The second player then takes the seeds from one of the six cups on his or
    her side and does the same. When a player drops his last seed into a cup on the
    opponent’s side containing only one or two seeds (making a total of two or three
    seeds), that player captures all the seeds in this cup. The same player also takes
    any seeds in cups immediately before the emptied cup if they now also total two
    or three. Players can take seeds only from their opponent’s side of the board,
    and the game ends when one player has no seeds left in the cups on his or her
    side. Whoever captures the majority of seeds wins.


    Awari has been of immense attraction to researchers in the field of artificial
    intelligence; but until 2002, no one knew if the game was like tic-tac-toe in
    which perfect plays from the beginning always ended a game in a draw. Finally,
    computer scientists John W. Romein (b. 1970) and Henri E. Bal (b. 1958) of the
    Free University in Amsterdam wrote a computer program that calculated the outcome
    for all 889,063,398,406 positions that can occur in the game, proving that Awari
    must end in a draw with perfect play by both players. The massive computation
    required about 51 hours on a computer cluster with 144 processors.


    “Did we ruin a perfectly fine game?” ask Romein and Bal. “We do not think so.
    Connect-4 was solved as well, and people still play the game. The same holds for
    other solved games.”

