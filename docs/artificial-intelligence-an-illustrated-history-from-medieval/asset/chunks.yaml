- fmt: "\nAristotle also pioneered the systematic study of logic. In his `Organon`\
    \ (Instrument) writings, he provides approaches for how to investigate truth and\
    \ how to make sense of the world. The primary tool in Aristotle’s toolkit is the\
    \ `syllogism`, a three-step argument such as, “All women are mortal; Cleopatra\
    \ is a woman; therefore Cleopatra is mortal.” If the two premises are true, we\
    \ know that the conclusion must be true. Aristotle also makes a distinction between\
    \ particulars and universals (i.e., general categories). `Cleopatra` is a particular\
    \ term, whereas `woman` and `mortal` are universal terms. When universals are\
    \ used, they are preceded by the words `all`, `some`, or `no`. Aristotle analyzed\
    \ many possible kinds of syllogisms and showed which of them are valid.\n\nAristotle\
    \ extended his analysis to syllogisms that involved modal logic—that is, statements\
    \ containing the words `possibly` or `necessarily`. Modern mathematical logic\
    \ can depart from Aristotle’s methodologies or extend his work into other kinds\
    \ of sentence structures, including ones that express more complex relationships\
    \ and ones that involve more than one quantifier, as illustrated by this sentence:\
    \ “No men like all men who dislike some men.” Nevertheless, Aristotle’s deep study\
    \ of logic is considered to be one of humankind’s greatest achievements, providing\
    \ an early impetus for many developments in mathematics and AI.\n\n**SEE ALSO**\
    \ [Talos (c. 400 BCE)](#9781454933601_epub_c002_r1.xhtml#c-002), [Boolean Algebra\
    \ (1854)](#9781454933601_epub_c024_r1.xhtml#c-024), [Fuzzy Logic (1965)](#9781454933601_epub_c057_r1.xhtml#c-057)\n\
    \n**The water clock shown here** does not have all of Ktesibios’s features, but\
    \ it provides an illustration regarding how these devices operate. This is from\
    \ *The Cyclopaedia or Universal Dictionary of Arts, Sciences and Literature* by\
    \ Abraham Rees in 1820.\n\n[![](OEBPS/images/6-1.jpg)](#9781454933601_epub_cre_r1.xhtml#6-1)\
    \ \n\n# c. 250 BCE\n\n# KTESIBIOS’S WATER CLOCK\n\n![](OEBPS/images/L01.jpg)\n\
    \n“Ktesibios’s water clock was significant because it forever changed our understanding\
    \ of what a man-made object could do,” writes journalist Luke Dormehl. “Before\
    \ Ktesibios’s clock, only a living thing was thought to be capable of modifying\
    \ its behavior according to changes in the environment. After Ktesibios’s clock,\
    \ self-regulating feedback control systems became a part of our technology.”\n\
    \nThe Greek inventor Ktesibios, or Tesibius (fl. 285–222 BCE), was famous in Alexandria,\
    \ Egypt, for his devices involving pumps and hydraulics. His water clock, or `clepsydra`\
    \ (lit. “water thief”), is of particular interest because it employed a regulator\
    \ in the form of a feedback-control float that maintained a constant water-flow\
    \ rate, thus allowing his timepiece to provide reasonable time.\n"
