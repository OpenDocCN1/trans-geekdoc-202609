    另参阅 致命军事机器人 (1942), 机器学习 (1959), AI 伦理 (1976), 自动驾驶汽车 (1984)


    `Ernő Rubik 的 1983 年美国专利 4,378,116 号` 描述了一种“空间空间逻辑玩具”，展示了其内部机制。


    ![![](img/196-1.jpg)](#9781454933601_epub_cre_r1.xhtml#196-1)


    # 2018


    ## 魔方机器人


    ![](img/L01.jpg)


    利用计算机视觉和物理操控制造能够解决魔方^®的机器人，直一直是 AI 工程师面临的一项热门挑战，多年来他们开发了许多不同的机器人设计。最初的魔方由匈牙利发明者埃尔诺·鲁比克（Ernő
    Rubik，1944 年出生）于 1974 年发明；到 1982 年，匈牙利已售出 100 万个（有趣的是，这超过了该国的人口）。据估计，全球销量已超过 1
    亿个。


    魔方是由 3 × 3 × 3 的小立方体阵列组成的，其颜色分布使得大立方体的六面具有六种不同的颜色。二十六个外部子立方内部通过铰链连接，使得这六面可以旋转。这个益智的目标是将打乱的魔方恢复到每个面只有单一颜色的状态。小立方体的排列方式共有
    43,252,003,274,489,856,000 种，而只有其中一种排列是六面颜色完全匹配的初始位置。如果你为每一种“合法”位置都准备一个魔方，你可以覆盖整个地球表面（包括海洋）大约
    250 次。


    2010 年，研究人员证明了魔方的任何初始配置都不需要超过二十步即可解决。2018 年，一种名为“鲁比克装置”（Rubik’s Contraption）的敏捷魔方机器人终于突破了半秒边界，仅用
    0.38 秒就解决了一个打乱的魔方，这包含了图像捕捉、计算和移动时间。麻省理工学院学生 Ben Katz 和软件开发者 Jared Di Carlo 使用的装置使用了六台科尔摩伺服电机（Kollmorgen
    ServoDisc motors）和所谓的 Kociemba 双相算法。相比之下，2011 年机器人世界纪录为 10.69 秒。同样在 2018 年，一台深度学习机器最终通过强化学习学会了如何解决魔方。


    一种从未出现在玩具店货架上的变体是四维版本的魔方：魔方超立方体。魔方超立方体的位置总数是惊人的 1.76×10²⁰。如果魔方或超立方体的旋转层从宇宙之初每秒钟变化一次，它们在今天仍在旋转，并且还没有展现出所有可能的配置。


    另参阅 汉诺亚塔 (1883), 强化学习 (1951), 谢基机器人 (1966), ASIMO 和朋友们 (2000)


    研究人员已经训练出一种 AI 系统，能够准确预测一个人是否会在三到十二个月内去世。如果你能知道死亡的日期，甚至年份，你会选择提前知道吗？


    ![![](img/198-1.jpg)](#9781454933601_epub_cre_r1.xhtml#198-1)


    # 2019


    ## AI 预测器


    ![](img/L01.jpg)


    2016 年，斯坦福大学的研究人员训练出一种 AI 系统，能够准确预测一个人是否会在三到十二个月内去世。这一卓越的应用被收入书中，代表了 AI 和深度学习在未来几年中将扮演的各种角色。


    姑息关怀通常涉及在患者确诊为末期且无法治愈时，缓解患者的疼痛、压力和其他症状。了解何时需要特定的护理可能对受者、家属和护理人员产生有益影响，并在护理最有效时提供帮助。为了创建这种“AI
    算法”，斯坦福团队使用了约 17 万名去世患者的信息——包括诊断结果、医疗检查、处方药物等——作为输入。然后训练了一个神经网络，并对神经元单元进行了各种权重调整。


    最终，在预测三到十二个月内去世的人中，有九成确实去世了。同样，预测将活过十二个月的 95% 人活得更久。然而，正如医生西达达塔·穆克（Siddhartha
    Mukherjee）在最近的一篇《纽约时报》文章中所述：“深度学习系统学习，但无法告诉我们为什么要学；它分配概率，但无法解释背后的推理。就像一个通过试错学骑自行车并被说明规则的孩子，当我们问‘为什么’时，它只是耸耸肩。”
    尽管如此，对这些 AI 死亡预测的研究仍在继续，2019 年，诺丁汉大学的一个专家小组显示，基于人口统计学、生物识别、临床和生活方式因素的机器学习在预测早逝方面优于传统方法。


    另参阅 深度学习 (1965), AI 伦理 (1976), 自动机器人手术 (2016)


    # 注释与参考文献


    ![](img/L01.jpg)


    “人工智能是进化的下一步，但它是一个不同的步骤。……一个人工智能智能设备可以告诉另一个设备它知道的一切，就像人类老师告诉学生部分知识一样，但它还可以告诉另一个设备关于自身设计的所有信息。……基本上，人类大脑不像神，也不像计算机。它最像黑猩的大脑，是为了在丛林或田间生存而设计的。”


    ——爱德华·弗雷德金（Edward Fredkin），引用自帕梅拉·麦考克（Pamela McCorduck）的《思考机器》


    我整理了以下参考文献列表，识别了我在研究和编写本书时使用的一些材料，并对引用来源提供了信息。正如许多读者所知，互联网网站变迁不断。有时它们会更改地址或消失。这里列出的网站地址在本书编写时提供了宝贵的背景信息。像维基百科（`en.wikipedia.org`）这样的在线资源是任何此类任务的宝贵起点，我有时会将该网站作为跳板，结合许多其他网站、书籍和研究论文一起使用。


