  raw: "**SEE ALSO** [Machine Learning (1959)](#9781454933601_epub_c050_r1.xhtml#c-050),\
    \ [Living in a Simulation (1967)](#9781454933601_epub_c060_r1.xhtml#c-060), [Genetic\
    \ Algorithms (1975)](#9781454933601_epub_c067_r1.xhtml#c-067), [Swarm Intelligence\
    \ (1986)](#9781454933601_epub_c075_r1.xhtml#c-075), [Tamagotchi (1996)](#9781454933601_epub_c081_r1.xhtml#c-081),\
    \ [“Call Them Artificial Aliens” (2015)](#9781454933601_epub_c093_r1.xhtml#c-093)\n\
    \n**Ant-colony optimization** is a method for finding solutions using simulated\
    \ ants, inspired by actual ants finding solutions. Shown here are ants, forming\
    \ a living bridge to a leaf.\n\n[![](OEBPS/images/148-1.jpg)](#9781454933601_epub_cre_r1.xhtml#148-1)\
    \ \n\n# 1986\n\n# SWARM INTELLIGENCE\n\n![](OEBPS/images/L01.jpg)\n\nTermite mounds\
    \ can reach over 17 feet (5m) in height, with termites acting like simple “novelty\
    \ detectors,” responding to changes in air characteristics within the mound and\
    \ altering the structure as needed. Authors Doris and David Jonas speculate: “What\
    \ is the other way of knowing, by which the termites know what they have to do\
    \ and when they have to do it? Instructions cannot be brought to them quickly\
    \ enough by messengers, since the distances within the hill are far too great.\
    \ . . . A group brain functions as an instrument for decision-making in a way\
    \ startlingly like an intelligent individual brain.”\n\nThe apparent collective\
    \ intelligence in these social insects, as well as that in flocking and herd animals,\
    \ inspired the concept of *swarm intelligence*. In AI, this concept is employed\
    \ to deal with a range of challenges. The software agents follow simple, local\
    \ rules and, as with ants and termites, there is no central controller dictating\
    \ the behavior of the collective. As just one example, Boids, an artificial life\
    \ program developed in 1986 by computer scientist Craig Reynolds (b. 1953), simulates\
    \ the flocking behavior of birds by following simple rules involving a bird steering\
    \ toward the average heading of birds in the flock, steering to move toward the\
    \ average position of birds, and steering to avoid excessive crowding.\n\nOne\
    \ of the numerous swarm methods studied in AI today is *ant-colony optimization*,\
    \ a method using simulated ants that records their positions and quality of solutions\
    \ to help ants in the colony determine better solutions. In some implementations,\
    \ these “ants” simulate attractive chemical trails (pheromones) that evaporate\
    \ over time. *Particle-swarm optimization* simulates the position and velocity\
    \ of a swarm of fish toward an optimal location. Other interesting methods are\
    \ artificial immune systems, bee-colony optimization algorithms, firefly optimization\
    \ algorithms, bat algorithms, cuckoo searches, and roach-infestation optimization.\n\
    \nThe applications of swarm intelligence include control of autonomous vehicles,\
    \ routing in telecommunication networks, scheduling of aircraft, art creation,\
    \ enhancing systems for reactive power and voltage control, and clustering of\
    \ gene-expression data.\n\n**SEE ALSO** [Machine Learning (1959)](#9781454933601_epub_c050_r1.xhtml#c-050),\
    \ [Living in a Simulation (1967)](#9781454933601_epub_c060_r1.xhtml#c-060), [Genetic\
    \ Algorithms (1975)](#9781454933601_epub_c067_r1.xhtml#c-067), [Artificial Life\
    \ (1986)](#9781454933601_epub_c074_r1.xhtml#c-074), [“Elephants Don’t Play Chess”\
    \ (1990)](#9781454933601_epub_c078_r1.xhtml#c-078)\n\n**Some challenges** that\
    \ are relatively easy for children, including sensorimotor tasks, turn out to\
    \ be among the most difficult for AI entities.\n\n[![](OEBPS/images/150-1.jpg)](#9781454933601_epub_cre_r1.xhtml#150-1)\
    \ \n\n# 1988\n\n# MORAVEC’S PARADOX\n\n![](OEBPS/images/L01.jpg)\n\n“If you wanted\
    \ to beat Magnus Carlsen, the world chess champion, you would choose a computer,”\
    \ writes journalist Larry Elliott. “If you wanted to clean the chess pieces after\
    \ the game, you would choose a human being.” This is the essence of Moravec’s\
    \ paradox, emphasized by several AI researchers in the 1980s, who ironically noted\
    \ that the seemingly difficult tasks involving high-level reasoning were becoming\
    \ easier and easier for computers to perform. At the same time, seemingly easy\
    \ tasks that involve human sensorimotor skills (e.g., walking around and picking\
    \ up a piece of lint from a shoe) can be quite difficult for computerized systems.\
    \ The paradox is named after roboticist Hans Moravec, who wrote in his 1988 book\
    \ *Mind Children* that “it is comparatively easy to make computers exhibit adult-level\
    \ performance on intelligence tests or playing checkers, and difficult or impossible\
    \ to give them the skills of a one-year-old when it comes to perception and mobility.”\n\
    \nMoravec has noted that millions of years of evolution contributed to our ability\
    \ to perform some tasks nearly unconsciously, like walking and recognizing faces\
    \ and voices, which are so very necessary for survival. However, abstract thought—for\
    \ example, reasoning that involves mathematics and logic, like chess—is newer\
    \ and more difficult for humans. However, this type of cognition is actually less\
    \ difficult to engineer in AI systems. For many tasks, AI systems still need to\
    \ evolve even more sensitive touch and motion controls to assist humans in roles\
    \ like patient care, food service, and plumbing. As elegantly summarized by cognitive\
    \ scientist Steven Pinker (b. 1954), Moravec’s paradox means that future human\
    \ workers may be left with lower-paying jobs that have been around for centuries,\
    \ even millennia: “The main lesson of thirty-five years of AI research is that\
    \ the hard problems are easy and the easy problems are hard. The mental abilities\
    \ of a four-year-old that we take for granted—recognizing a face, lifting a pencil,\
    \ walking across a room, answering a question—in fact solve some of the hardest\
    \ engineering problems ever conceived. . . . As the new generation of intelligent\
    \ devices appears, it will be the stock analysts and petrochemical engineers and\
    \ parole board members who are in danger of being replaced by machines. The gardeners,\
    \ receptionists, and cooks are secure in their jobs for decades to come.”\n\n\
    **SEE ALSO** [“Darwin among the Machines” (1863)](#9781454933601_epub_c025_r1.xhtml#c-025),\
    \ [Turing Test (1950)](#9781454933601_epub_c042_r1.xhtml#c-042), [Licklider’s\
    \ “Man-Computer Symbiosis” (1960)](#9781454933601_epub_c052_r1.xhtml#c-052), [“Elephants\
    \ Don’t Play Chess” (1990)](#9781454933601_epub_c078_r1.xhtml#c-078)\n\n**A Connect\
    \ Four game in progress,** using yellow and red discs, which slide to the bottommost\
    \ open locations under the influence of gravity.\n\n[![](OEBPS/images/152-1.jpg)](#9781454933601_epub_cre_r1.xhtml#152-1)\
    \ \n\n# 1988\n\n# CONNECT FOUR\n\n![](OEBPS/images/L01.jpg)\n\nFor a Christmas\
    \ present, Toby Walsh (b. 1964), a professor of artificial intelligence at the\
    \ University of New South Wales, once gave his father a program that perfectly\
    \ plays the game of Connect Four^®. His dad, who had previously loved playing\
    \ the game, remarked that the program took the fun out of the game, and Walsh\
    \ had to agree. When smartphones become superior to humans in virtually all games\
    \ and creative endeavors, from music composition to novel writing, what effect\
    \ will that have on the collective psyche of humanity?"
