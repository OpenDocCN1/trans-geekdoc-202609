- fmt: "\nWith startling perceptivity, Butler envisions the gradual takeover of human\
    \ endeavor by machines: “We are becoming more subservient to them; more men are\
    \ daily bound down as slaves to tend them . . . devoting the energies of their\
    \ whole lives to the development of mechanical life. . . . The time will come\
    \ when the machines will hold the real supremacy over the world and its inhabitants.\
    \ . . .”\n\nIn *The Book of the Machines* (1872), Butler muses that a mollusk\
    \ does not appear to have much consciousness, yet human consciousness evolved.\
    \ Similarly, machines will develop consciousness, and he asks us to “reflect upon\
    \ the extraordinary advance which machines have made during the last few hundred\
    \ years, and note how slowly the animal and vegetable kingdoms are advancing.\
    \ The more highly organized machines are creatures not so much of yesterday, as\
    \ of the last five minutes. . . .”\n\nButler’s ideas echoed into the twentieth\
    \ century when Norbert Wiener (1894–1964), father of the field of cybernetics,\
    \ wrote: “If we move in the direction of making machines which learn and whose\
    \ behavior is modified by experience, we must face the fact that every degree\
    \ of independence we give the machine is a degree of possible defiance of our\
    \ wishes. The genie in the bottle will not willingly go back in the bottle, nor\
    \ have we any reason to expect them to be well disposed to us.”\n\nWith twenty-first-century\
    \ technology now interweaved in all aspects of human life, both Butler’s and Wiener’s\
    \ musings on AI appear particularly prophetic.\n\n**SEE ALSO** [Hobbes’s *Leviathan*\
    \ (1651)](#9781454933601_epub_c014_r1.xhtml#c-014), [*The Human Use of Human Beings*\
    \ (1950)](#9781454933601_epub_c043_r1.xhtml#c-043), [Intelligence Explosion (1965)](#9781454933601_epub_c055_r1.xhtml#c-055),\
    \ [Leakproof “AI Box” (1993)](#9781454933601_epub_c079_r1.xhtml#c-079), [Paperclip\
    \ Maximizer Catastrophe (2003)](#9781454933601_epub_c089_r1.xhtml#c-089)\n\n**Cover\
    \ of *The Steam Man of the Prairies*** by Edward S. Ellis (1868).\n\n[![](OEBPS/images/50-1.jpg)](#9781454933601_epub_cre_r1.xhtml#50-1)\
    \ \n\n# 1868\n# *THE STEAM MAN OF THE PRAIRIES*\n\n![](OEBPS/images/L01.jpg)\n\
    \nOne of the first depictions of a mechanical human in US “dime novels” (inexpensive\
    \ paperbacks) occurs in *The Steam Man of the Prairies* by Ohio-born author Edward\
    \ S. Ellis (1840–1916), which was reissued numerous times between 1868 and 1904.\
    \ In Ellis’s novel, a teenage inventor named Johnny Brainerd creates a ten-foot-tall\
    \ robot and takes it around the Midwest. The steam man wears a stovepipe hat,\
    \ pulls a wagon, and walks or runs on toled legs as fast as sixty miles per hour.\
    \ Johnny, his friends, and his robot have adventures on the prairie chasing Indians,\
    \ and assisting in gold mining. Ellis describes the steam man as “exceedingly\
    \ corpulent, swelling out to aldermanic proportions, which, after all, was little\
    \ out of harmony with its immense height. The robot was fat so as to provide sufficient\
    \ room for all of its machinery. Furthermore, the “face was made of iron . . .\
    \ with a pair of fearful eyes, and a tremendous mouth. The step was natural, except\
    \ when running, at which time, the uprightness in the figure showed different\
    \ from a human being.” The Steam Man was inspired by an actual steam-powered humanlike\
    \ robot patented in 1868 by American inventors Zadoc P. Dederick and Isaac Grass.\
    \ The fascinating series is also an early example of the “Edisonade” genre of\
    \ stories that generally featured a young male inventor who uses his ingenuity\
    \ to escape from dangers. In writing about adventures, was exploring the lives\
    \ of people living on the edge, much like modern stories set far out in the solar\
    \ system. . . . Ellis’s works serve as a good window into the attitudes of the\
    \ time, and provide some context for how much the future was viewed.\n\n**SEE\
    \ ALSO** [*Electric Bob’s Black Ostrich* (1893)](#9781454933601_epub_c028_r1.xhtml#c-028),\
    \ [Tik-Tok (1907)](#9781454933601_epub_c030_r1.xhtml#c-030), [Elektro the Moto-Man\
    \ (1939)](#9781454933601_epub_c035_r1.xhtml#c-035)\n\nIn the Tower of Hanoi game,\
    \ a player can move one disk at a time to another peg by removing the top disk\
    \ in any stack and placing it on the top of any other stack. A disk cannot be\
    \ placed on top of a smaller disk.\n\n[![](OEBPS/images/52-1.jpg)](9781454933601_epub_cre_r1.xhtml#52-1)\n\
    \n# 1883\n# TOWER OF HANOI\n\n![](OEBPS/images/L01.jpg)\n\nThe Tower of Hanoi\
    \ has intrigued the world since it was invented by French mathematician Édouard\
    \ Lucas (1842–1891) in 1883 and sold as a toy. This mathematical puzzle consists\
    \ of several disks of different sizes that slide onto any of three pegs. The disks\
    \ are initially stacked on one peg in order of size, with the smallest disk at\
    \ the top. When playing the game, one can move one disk at a time to another peg\
    \ by removing the top disk in any stack and placing it on the top of any other\
    \ stack. A disk cannot be placed on top of a smaller disk. The goal is to move\
    \ the entire starting stack (usually with seven or eight disks) to another peg.\
    \ The minimum number of moves turns out to be `2^n - 1`, where `n` is the number\
    \ of disks.\n\nThe original game was said to be inspired by a legendary Indian\
    \ temple in which Brahmin priests continually moved 64 golden disks, using the\
    \ same rules in the Tower of Hanoi. According to this legend, when the last move\
    \ of the puzzle is completed, the world will end. Note that if the priests were\
    \ able to move disks at the rate of one per second, then `2^(64) - 1`, or `18,446,744,073,709,551,615`,\
    \ moves would require roughly 585 billion years—about 42 times the current estimated\
    \ age of our universe.\n\nThe Tower of Hanoi puzzle, and many variations, have\
    \ been used in various robotics challenges, as the puzzle provides a useful standardized\
    \ test to evaluate the robot’s integration of high-level reasoning capabilities\
    \ together with perception and manipulation. Task planning and motion planning\
    \ (involving one or more robot arms) play key roles in such challenges.\n\nSimple\
    \ algorithms exist for solutions involving three pegs, and the game is often used\
    \ in computer programming classes to teach recursive algorithms. However, the\
    \ optimal solution for the Tower of Hanoi problem (and variations) with large\
    \ numbers of pegs is often unknown. For multi-armed robots, collision-free trajectories\
    \ must also be computed.\n\n**SEE ALSO** [Tic-Tac-Toe (c. 1300 BCE)](9781454933601_epub_c001_r1.xhtml#c-001),\
    \ [Mechanical Turk (1770)](9781454933601_epub_c018_r1.xhtml#c-018), [Connect Four\
    \ (1988)](9781454933601_epub_c077_r1.xhtml#c-077), [Rubik’s Cube Robots (2018)](9781454933601_epub_c099_r1.xhtml#c-099)\n\
    \n**Illustration for “Electric Bob’s Big Black Ostrich,”*** a story by Robert\
    \ T. Toombs in the *New York Five Cent Library*, 1893.\n\n[![](OEBPS/images/54-1.jpg)](9781454933601_epub_cre_r1.xhtml#54-1)\
    \ \n\n# 1893\n# *ELECTRIC BOB’S BIG BLACK OSTRICH*\n\n![](OEBPS/images/L01.jpg)\n\
    \nThe *Electric Bob* series of Stories by Robert T. Toombs, along with *The Steam\
    \ Man of the Prairies* series, are notable for showing a growing fascination at\
    \ the end of the nineteenth century in the United States with mechanical devices\
    \ that resemble humans or animals. In *Electric Bob’s Black Ostrich*, Electric\
    \ Bob is a ten-year-old engineering genius who lives near New York City and is\
    \ a descendant of telegraph inventor Samuel Morse. Aside from his electronic ostrich,\
    \ Bob is also an inventor of a giant mechanical white alligator and other mechanized\
    \ animals that could be used for transport.\n"
  raw: "With startling perceptivity, Butler envisions the gradual takeover of human\
    \ endeavor by machines: “We are becoming more subservient to them; more men are\
    \ daily bound down as slaves to tend them . . . devoting the energies of their\
    \ whole lives to the development of mechanical life. . . . The time will come\
    \ when the machines will hold the real supremacy over the world and its inhabitants.\
    \ . . .”\n\nIn *The Book of the Machines* (1872), Butler muses that a mollusk\
    \ does not appear to have much consciousness, yet human consciousness evolved.\
    \ Similarly, machines will develop consciousness, and he asks us to “reflect upon\
    \ the extraordinary advance which machines have made during the last few hundred\
    \ years, and note how slowly the animal and vegetable kingdoms are advancing.\
    \ The more highly organized machines are creatures not so much of yesterday, as\
    \ of the last five minutes. . . .”\n\nButler’s ideas echoed into the twentieth\
    \ century when Norbert Wiener (1894–1964), father of the field of cybernetics,\
    \ wrote: “If we move in the direction of making machines which learn and whose\
    \ behavior is modified by experience, we must face the fact that every degree\
    \ of independence we give the machine is a degree of possible defiance of our\
    \ wishes. The genie in the bottle will not willingly go back in the bottle, nor\
    \ have we any reason to expect them to be well disposed to us.”\n\nWith twenty-first-century\
    \ technology now interweaved in all aspects of human life, both Butler’s and Wiener’s\
    \ musings on AI appear particularly prophetic.\n\n**SEE ALSO** [Hobbes’s *Leviathan*\
