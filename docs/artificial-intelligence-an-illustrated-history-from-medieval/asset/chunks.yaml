    \ \n\n# 1580\n\n# GOLEM\n\n![](OEBPS/images/L01.jpg)\n\nAccording to *The Forward*\
    \ news-paper, “Long before Stephen Hawking warned us about the dangers of *artificial\
    \ intelligence*, the legend of the *Golem* conveyed to Jews the same subliminal\
    \ message.” A golem from Jewish folklore is an animated creature, crafted from\
    \ clay or mud, that exhibits several forms of artificial intelligence in a man-made\
    \ automaton that is difficult to control once the technology is activated and\
    \ set loose in the world. Probably the most famous golem is the one that Prague\
    \ rabbi Judah Loew ben Bezalel (c. 1520–1609) allegedly created in 1580 to defend\
    \ the Jews of the Prague ghetto from anti-Semitic attacks. The story of this Prague\
    \ golem was recorded by several authors of the 1800s.\n\nA golem is usually inscribed\
    \ with magical or religious words that keep it animated. For example, according\
    \ to legend, golem creators sometimes wrote the name of God on the golem’s forehead,\
    \ or on a clay tablet or paper under its tongue. Other golems were animated by\
    \ the word *emet* (“truth” in the Hebrew language) written on their foreheads.\
    \ By erasing the first letter to form *met* (“death” in Hebrew), the golem can\
    \ be deactivated.\n\nSome other old Jewish recipes for creating a golem required\
    \ a person to combine each letter of the Hebrew alphabet with each letter from\
    \ the YHVH tetragrammaton (i.e., the Hebrew name of God), and then pronounce each\
    \ of the resulting letter pairs with every possible vowel sound. The tetragrammaton\
    \ serves as an “activation word” to pierce reality and energize the being.\n\n\
    The word *golem* appears only once in the Bible (Psalm 139:16), where it refers\
    \ to an imperfect or unformed body. The New International Version translates the\
    \ verse as: “Your eyes saw my unformed body. All the days ordained for me were\
    \ written in your book before one of them came to be.” In Hebrew, *golem* can\
    \ signify a “shapeless mass” or “brainless” entity, and the Talmud uses the word\
    \ to imply “imperfect.” As such, most golems in literature are depicted as dumb,\
    \ but they can be made to perform simple, repetitive tasks. In fact, the challenge\
    \ for the golem creator was to determine how to finally stop the golem from carrying\
    \ out or repeating a task.\n\n**SEE ALSO** [Talos (c. 400 BCE)](#9781454933601_epub_c002_r1.xhtml#c-002),\
    \ [Lancelot’s Copper Knights (c. 1220)](#9781454933601_epub_c008_r1.xhtml#c-008),\
    \ [*Frankenstein* (1818)](#9781454933601_epub_c020_r1.xhtml#c-020)\n\n**The frontispiece\
    \ of *Leviathan*** by Thomas Hobbes, with an engraving by French artist Abraham\
    \ Bosse (1604–1676).\n\n[![](OEBPS/images/26-1.jpg)](#9781454933601_epub_cre_r1.xhtml#26-1)\
    \ \n\n# 1651\n\n# HOBBES’S *LEVIATHAN*\n\n![](OEBPS/images/L01.jpg)\n\nIn 1651,\
    \ English philosopher Thomas Hobbes (1588–1679) wrote *Leviathan*, a book that\
    \ focuses on the structure of society and its relationship with government. In\
    \ the book, Hobbes makes several statements that have caused science historian\
    \ George Dyson to refer to Hobbes as the “patriarch of artificial intelligence.”\
    \ For example, in his introduction, Hobbes compares the body to a mechanical engine:\
    \ “Nature (the art whereby God hath made and governs the world) is by the *art*\
    \ of man . . . imitated, that \\[man\\] can make an artificial animal. For seeing\
    \ life is but a motion of limbs, the beginning whereof is in some principal part\
    \ within; why may we not say, that all *automata* (engines that move themselves\
    \ by springs and wheels as doth a watch) have an artificial life? For what is\
    \ the *heart* but a *spring*; and the *nerves* but so many *strings*; and the\
    \ *joints* but so many *wheels*, giving motion to the whole body . . . ?”"
