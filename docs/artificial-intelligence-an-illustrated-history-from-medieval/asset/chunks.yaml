  trans: "\n\n通常来说，多层神经元可以对不同层级结构的数据进行特征提取（例如，在某一层对简单边缘做出响应，在另一层对面部特征做出响应）。深度学习可能涉及`backpropagation`，这是一个系统可以反向（从输出到输入）传递信息的过程，以便在出错时教导系统，从而改进结果。\n\
    \n深度学习已成功应用于语音识别、计算机视觉、自然语言处理、社交网络、人类语言翻译、药物设计、识别绘画特定风格时期、产品推荐、估计不同营销活动的价值、图像修复与清洗、玩游戏、识别照片中的人物等。\n\
    \n正如技术专家 Jeremy Fain 所写道：“最终，深度学习已让机器学习跨越了一个门槛。虽然机器学习在自动化重复任务或数据分析方面取得了一定成功，但它现在正以能够看、听和玩所有类型游戏的计算机的形式，让未来变为现实。”\n\
    \n**另参阅** 人工神经网络 (1943), 强化学习 (1951), 感知器 (1957), 机器学习 (1959), 计算机艺术与深梦 (2015),\
    \ 对抗性补丁 (2018)\n\n**Shakey 的显著之处在于模式识别、计算机视觉、问题解决、自然语言处理和信息表示领域树立了重要的里程碑**。Shakey\
    \ 包含了一个电视摄像头、距离测距仪、碰撞传感器和用于转向的电机。\n\n![](img/#9781454933601_epub_cre_r1.xhtml#116-1)\
    \ \n\n# 1966\n\n# 机器人 Shakey\n\n![](img/L01.jpg)\n\n1970 年，《生活》杂志将 Shakey 称为世界上“第一位电子人”，它很快就能“在月球上旅行几个月，而不需要来自地球的任何一个方向信号”。尽管关于这个迷人机器人的报告相当夸张，但\
    \ Shakey 的显著之处在于在模式识别、计算机视觉、问题解决、自然语言处理和信息表示领域树立了重要的里程碑。\n\nShakey 于 1966 年至 1972\
    \ 年间在斯坦福研究学院开发，是设计通用自主机器人的早期严肃尝试之一，这种机器人能够移动、感知周围环境、监控计划的执行情况并对其行动进行推理。该项目由美国国防部高级研究计划局（DARPA）资助，主要使用`LISP`\
    \ 编程。为了让机器人运行良好，它的世界被限制在几个由走廊连接的房间内，里面有门、灯开关和 Shakey 可以推动的物体。操作员输入类似“将方块推下平台”的命令，Shakey\
    \ 会尝试探索并识别平台，将斜坡推到平台处，驶上平台，并将方块推下。\n\nShakey 依赖于不同层级的程序。例如，一层用于路线规划、电机控制和感应信息采集程序，而中间层负责实际移动到指定位置并处理来自\
    \ Shakey 电视摄像头的图像。高层编程涉及任务规划和执行一系列动作以实现目标。\n\n并不意外，机器人 Shakey 的名字是因为它在移动时动作很抖动而得名的。Shakey\
    \ 携带着一个用于与`DEC PDP` 计算机进行无线和视频连接的天线，它还包含了一个电视摄像头、距离测距仪、碰撞传感器和用于转向的电机。Shakey 的开发导致了人工智能\
    \ 领域的重要研究。\n\n**另参阅** 自然语言处理 (1954), SHRD (1971), 机器人 (1999), 朋友 (2000), 火星 (2015)\n\
    \n**随着计算机变得越来越强大，** 也许有一天我们将能够能够模拟整个世界——而且可能更先进的生物已经在这样做了。\n\n![](img/#9781454933601_epub_cre_r1.xhtml#118-1)\
    \ \n\n# 1967\n\n# 生活在模拟中\n\n![](img/L01.jpg)\n\n“我们的宇宙看起来是真实的，但它是真实的吗？”Jason Koebler\
    \ 写道，“随着人类模拟能力变得越来越强，似乎至少在逻辑上可行，我们可以创造出意识生命。”宇宙是一个数字计算机的假设是由德国工程师`Konrad Zuse`\
    \ 开创的。其他研究人员包括`Ed Fredkin` (1934)、`Stephen Wolfram` (1959) 和 `Max Tegmark` 都认为物理宇宙可能运行在`细胞自动机`或离散机器上。\n\
    \n如果这些模拟的数量大于宇宙的数量呢？天体物理学家 Martin Rees（出生于 1942 年）认为，如果是这样，“……就像如果一个宇宙包含了许多正在进行许多模拟的计算机一样，”那么*我们*很可能是人工生命。Rees\
    \ 继续道：“一旦你接受了多元宇宙的想法……在那些宇宙中的某些地方，将具有模拟它们自身部分的潜力…………而我们不知道自己在这一宇宙和模拟的宏大组合中处于什么位置。”\n\
    \n物理学家 Paul Davies（出生于 1946 年）在 2003 年《纽约时报》的一篇文章中扩展了具有多个模拟现实的多元宇宙概念：“最终，整个虚拟世界将在计算机内部创建，其有意识的居民不知道自己是别人技术的模拟产物。对于每一个原始世界，将有大量的可用虚拟世界——其中某些甚至会包含模拟它们自己的虚拟世界的机器……\
    \ . .”\n\n"
- fmt: "\n[content]\n*Cybernetic Serendipity: The Computer and the Arts* (1968) was\
    \ a groundbreaking illustrated book and catalogue for the well-attended exhibition\
    \ at the Institute of Contemporary Arts in London (and later in Washington, DC,\
    \ and San Francisco). Edited and curated by British art critic Jasia Reichardt\
    \ (b. 1933), the book and simultaneous exhibit were notable for demonstrating\
    \ numerous aspects of computer-aided creativity, from visual art to music, poetry,\
    \ storytelling, dance, animation, and sculpture, inspiring a generation of experimental\
    \ collaborations involving artists, scientists, and engineers.\n\nIn 1948, American\
    \ mathematician and philosopher Norbert Wiener (1894–1964) defined *cybernetics*\
    \ as “the scientific study of control and communication in the animal and the\
    \ machine”; today the term has taken on a broader meaning involving the control\
    \ of numerous kinds of systems using technology such as electronic devices. *Serendipity*\
    \ usually refers to unexpected, delightful, and useful outcomes made by accident\
    \ and chance.\n\nWith contributors that included artists, composers, poets, and\
    \ computer programmers, *Cybernetic Serendipity* raised questions about the nature\
    \ of art and chance. Some of the most stimulating parts of the book are beautiful\
    \ computerized Japanese haiku poems, accompanied by algorithmic recipes to generate\
    \ the poems. For example, one haunting poem begins: “Eons deep in the ice, I paint\
    \ all time in a whorl. . . .” Another section concerns the generation of “Little\
    \ Grey Rabbit-type stories” that are constructed by a computer using simple rules.\
    \ A typical story might begin like this: “The sun shone over the woods. Across\
    \ the fields softly drifted the breeze while then the clouds, which calmly floated\
    \ all afternoon, moved across the fields . . . ”\n\nIn addition to poetry and\
    \ stories, *Cybernetic Serendipity* featured painting machines and a range of\
    \ computer art made on mechanical computer plotters or CRT displays, inspiring\
    \ people interested in the nascent field of algorithmic and/or generative art.\
    \ The book also included musical scores generated from traces of the New York\
    \ City skyline or splatters of ink, various forms of electronic music machines,\
    \ computer-programmed choreography, sound-activated mobiles, pendulum drawing\
    \ machines and harmonographs, architectural works, pseudo-Mondrian paintings,\
    \ and more.\n\n**SEE ALSO** [Ramon Llull’s *Ars Magna* (c. 1305)](#9781454933601_epub_c010_r1.xhtml#c-010),\
    \ [Lagado Book-Writing Engine (1726)](#9781454933601_epub_c016_r1.xhtml#c-016),\
    \ [Computational Creativity (1821)](#9781454933601_epub_c021_r1.xhtml#c-021),\
    \ [Computer Art and DeepDream (2015)](#9781454933601_epub_c092_r1.xhtml#c-092)\n\
    \n**Artist’s rendering of HAL 9000’s** famous red all-seeing camera eye from *2001:\
    \ A Space Odyssey.*\n\n[![](OEBPS/images/122-1.jpg)](#9781454933601_epub_cre_r1.xhtml#122-1)\
