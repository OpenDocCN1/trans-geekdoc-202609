  trans: "\n\n使用专用硬件，1997 年版本的“深蓝”（Deep Blue）每秒能够评估 2 亿个国际象棋棋位，其搜索深度通常在六到八步之间，甚至远超此。“深蓝”的策略还可以考虑一个庞大的特级大师对局数据库，并使用了包含五个或更少棋子位置的残局数据库。\n\
    \n象棋机器的梦想可以追溯到很久以前。“机械土人”象棋机器人是由匈牙利发明家沃尔夫·冯·肯普伦（Wolfgang von Kempelen）于 1770 年创造的，它的棋艺很高，但它利用了一个躲在机器内部的人类。1950\
    \ 年，计算机科学家艾兰·图灵（Alan Turing）和数学家大卫·钱珀纳恩（David Champernowne，1912–2000）设计了一种名为“超级冠军”（Turbochamp）的计算机程序来下棋。然而，由于当时没有计算机可以运行该算法，图灵在测试阶段通过手动查阅算法来模拟计算机运行。\n\
    \n2017 年，程序 AlphaZero 击败了世界冠军级的国际象棋计算机程序，它在不到一天的时间内就学会了下棋！该程序使用了机器学习，从随机下棋开始，且除了游戏规则外未被赋予任何领域知识。\n\
    \n**另参：** 机械土人 (1770), 西洋棋与人工智能 (1994), AlphaGo 围棋冠军 (2016)\n\n**奥黑棋棋子的特写，** 显示棋子可以根据游戏规则翻转，从黑色变为白色，或反之亦然。\n\
    \n![](img/#9781454933601_epub_cre_r1.xhtml#164-1) \n\n# 1997\n\n# 奥黑棋 (OTHELLO)\n\
    \n![](img/L01.jpg)\n\n由于游戏规则精确且能够在对局过程中确定胜负者，游戏一直是人工智能研究人员的热门测试场。此外，AI 系统通常可以与自己或其他\
    \ AI 玩家进行数百万次对弈，以改进并获得见解。AI 成功应用的一个有趣游戏是奥黑棋（也称为黑白棋/Reversi），它在 1886 年的《周六评论》中被提到过，其历史可以追溯得多。\n\
    \n奥黑棋在 8 × 8 的网格上进行，棋子一面为白色，另一为黑色。轮到玩家时，玩家将自己颜色的棋子朝上放置。\n\n想象你玩黑棋，你在白色棋子线的一端放置黑色棋子，另一端放置另一个黑色棋子。在这种情况下，中间的白色棋子会被翻转为黑色。换句话说，棋子是通过夹在相反颜色棋子之间的操作被翻转的，游戏结束时颜色占多数的玩家为胜者。\n\
    \n该游戏对人类来说难以可视化的原因之一是，与国际象棋和西洋棋不同，奥黑棋棋子的颜色可能会不断变化。自 1980 年左右以来，奥黑棋程序已轻松击败职业选手。1997\
    \ 年，由计算机科学家迈克尔·布罗（Michael Buro）创建的计算机程序 Logistello 以 6 比 0 的比分击败了人类冠军村上武（Takeshi\
    \ Murakami）。当时，这位 32 岁的东京英语老师村上武对自己的失败感到惊讶，他表示至少有一步 Logistello 的走法是“不可理解的”，因为它与人类会出的招式太不同了。\n\
    \n奥黑棋的合法棋位数量最多为 10²⁸。即使在今天，奥黑棋仍被视为一种“未解决的游戏”，因为还没有人证明如果双方都进行完美对弈，游戏的结果将会如何。\n\n\
    **另参：** 井井游戏（约公元前 1300 年）, 飞行棋 (1970), 西洋棋与人工智能 (1994), 深蓝击败国际象棋冠军 (1997), AlphaGo\
    \ 围棋冠军 (2016)\n\n**随着机器人狗和其他宠物在未来几年里变得越来越先进**，是否有一天会有那么一天，它们与真实的动物几乎无法区分，或者它们在我们家中的数量会超过家中的活宠物？\n\
    \n![](img/#9781454933601_epub_cre_r1.xhtml#166-1)\n\n# 1999\n\n# 爱宝狗 (AIBO)\n\n\
    ![](img/L01.jpg)\n\n类狗机器人 AIBO 由索尼公司于 1999 年推出，是世界上首批大众消费级娱乐机器人之一。深受儿童和成人的喜爱，AIBO\
    \ 也被用于教育和研究，因为它包含了视觉系统。AIBO 的名字源自日语中的“伙伴”，它能够响应许多命令，并利用了各种传感器，包括触摸传感器、摄像头、测距仪和麦克风。后续型号增加了更多的传感器和执行器（用于腿部和其他部位）。某些版本可以自动在充电站充电。软件赋予了机器人个性和行走的能力。\n\
    \n研究人员利用 AIBO 和其他人工宠物对痴呆症患者开展了迷人的研究，研究表明机器人宠物对于陪伴和刺激可能很有益。更先进的宠物未来可能在认知下降的任何阶段都为人们提供更大的帮助。其他研究考虑了\
    \ AIBO 与人类的关系，发现大量的所有者报告 AIBO 有感情，尽管他们明白这只狗是机械的，不是活的。\n\n"
