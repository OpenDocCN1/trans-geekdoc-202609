    在本书中，我们还将涉及有关 AI 伦理使用的引人入胜的问题，甚至涉及到当先进 AI 实体变得危险的超级智能时，如何将其放入一个“防漏”箱中以使其与外部世界隔绝的挑战。当然，AI
    的边界和范围随着时间而变化，一些专家建议采用包容性的定义，承认一系列帮助人类执行认知任务的技术。因此，为了让读者对 AI 历史有更丰富的理解，我还包含了一些能够为通常需要人类思考和计算的问题提供答案设备或机器，包括算盘、安提基梯拉机械（公元前
    125 年）、ENIAC 计算机（1946 年）等。归根结底，如果没有这些早期技术，我们就不会拥有现代世界中存在的先进围棋系统和车辆驾驶系统。


    在阅读此书时，请记住，即使我们认为某些关于人工生物的历史观点或预测是切实际的，但当这些旧思想在更快速、更先进的计算机硬件上实现时，可能会突然变得可行。我们的技术预测——甚至我们的神话——至少是人类理解和创造力的迷人模型，反映了我们如何跨越文化和时间相互理解，并学习我们认为神圣或对社会有益的事物。然而，当我们庆祝人类的想象力和智慧的同时，讨论意外后果（包括
    AI 的潜在危险）至关重要。理论物理学家史蒂芬·霍金在 2014 年接受 BBC 采访时说：“完全人工智能的发展可能意味着人类种族的终结……它将自主运行，并以不断加快的速度重新设计自己。”换句话说，AI
    实体可能会变得非常聪明和强大，足以能够不断改进自己，创造出对人类构成巨大风险的超级智能。这种失控的技术增长，有时被称为 `technological singularity`（技术奇点），可能会对文明、社会和人类生活产生不可想象的变化。


    因此，尽管 AI 的潜在收益无处不在——自动驾驶汽车、高效的业务流程，甚至在无数领域的陪伴——但人类在开发自主武器系统以及过度依赖机制有时难以捉的 AI 技术时，需要格外小心。例如，研究显示，某些
    AI（神经网络）成像系统很容易通过人类无法察觉的方式修改图像，被“欺骗”将动物误识别为步枪，或将飞机图片误识别为狗。如果恐怖分子能让商场或医院在无人机眼中看起来像军事目标，后果将是灾难性的。另一方面，也许配备适当传感器和伦理规则的武装机器也可以减少平民伤亡。需要明智的政策制定，以确保
    AI 实体的潜在危险不会掩盖其惊人的益处。


    随着我们日益信任拥有许多复杂深度神经网络的 AI，一个有趣的研究领域是开发能够向人类 `explain` 其如何得出某些决策的 AI 系统。然而，强迫 AI
    解释自己可能会导致它们瘫痪，至少在某些应用中是这样。这些机器中的许多可以创建比人类理解理解多的现实模型。AI 专家大卫·格宁甚至认为，性能最好的系统将是最不可解释的。


    ## 书籍结构与目的


    我对计算以及科学边界的话题有着长期的痴迷，我写这本书的目标是为广大读者提供一份简短指南，介绍 `artificial intelligence` 历史中既好奇又重要的实用观点，这个术语直到
    1955 年才由计算机科学家约翰·麦卡锡创造。书中的每个条目只有几行长，允许读者跳跃到书的任何部分，而无需翻阅大量的篇论。当然，这意味着我无法对某个主题进行深入探讨。然而，在“注释和参考文献”部分，提供了进一步阅读的建议，以及引用作者的各种引言或资历的来源。


    书中的条目涉及了哲学、流行文化、计算机科学、社会学和神学等不同领域，也包含了我个人感兴趣的话题。事实上，当我年轻时，我被 1969 年出版的雅西娅·里奇亚德的著作
    `Cybernetic Serendipity: The Computer and the Arts` 所迷迷；书中展示了计算机生成的诗歌、绘画、音乐、图形等。我特别对
    AI 专家在艺术领域取得的进展感到着迷，他们使用生成对抗网络（`GANs`）来产生模拟脸部、花朵和鸟的惊人写实图像。`GANs` 利用了两个相互竞争的神经网络——一个网络生成想法和模式，另一个负责判断结果。


    今天，AI 的应用似乎是无限的，每年有数十亿美元投入到 AI 开发中。正如你将发现的，此类技术已用于破解梵蒂冈档案馆，试图解决这一庞大历史收藏中复杂的手写文本。AI
    还被用于预测地震、解释医学图像和语音，以及根据医院电子健康记录中的患者信息预测人的死亡时间。AI 已被用于生成笑话、数学定理、美国专利、游戏和谜题、天线的创新设计、新漆颜色、新香水等。今天，当我们许多人都在与手机和其他设备对话时，我们与机器的关系在未来将继续变得更加亲密和人性化。


    书籍条目根据关键事件、出版或发现相关的年份按时间顺序组织，条目的日期划分是一个判断问题。某些日期是近似的；只要可能，我会尝试为所使用的日期提供理由。


    你还会注意到 1950 年之后的条目数量有所增加。《AI: The Tumultuous History of the Search for Artificial
    Intelligence》（1993 年）的作者丹尼尔·克雷维指出，在 20 世纪 60 年，“AI 百花齐放。AI 研究人员将其新的编程技术应用于许多问题，这些问题虽然是真实的但经过了仔细简化，部分是为了隔离要解决的问题，部分是为了适应当时计算机极小的内存。”


    意识的谜团、人工智能的局限以及心灵的本质在未来几年内将继续被研究，并且从古代起一直吸引着人们。作者帕梅拉·麦考德在她的书中 `Machines Who Think`
    中建议，AI 起于古代对“锻造神灵”的愿望。


    未来的 AI 发现将是人类 greatest 成就之一。AI 的故事不仅关于我们如何塑造未来，还关于人类将如何与周围加速的智能和创造力景观融合。百年后，“人类”意味着什么？在
    AI 智能体使用日益增加的情况下，社会将变成什么样？工作将受到什么影响？我们会爱上机器人吗？


    '
- fmt: '

    If AI methods and models are already being used to help determine who gets hired
    for a job, who we date, who makes parole, who is likely to develop a psychiatric
    disorder, and how to autonomously drive cars and drones, then how much control
    over our lives will we give to AIs of the future? As they increasingly make decisions
    for us, will AI units be easily fooled into making critical errors? How can AI
    researchers better understand why some machine-learning algorithms and architectures
    are more effective than others, while also making it easier for AI researchers
    to reproduce one another’s results and experiments?


    Moreover, how can we ensure that AI-driven devices behave in an ethical manner,
    and will machines ever have mental states and feelings in the same sense that
    humans do? Surely, AI machines will help us think new thoughts and dream new dreams,
    functioning as prosthetics for our feeble brains. For me, AI cultivates a perpetual
    state of wonder about the limits of thought, the future of humanity, and our place
    in the vast space-time landscape that we call home.


    `Tic-tac-toe can be made more challenging` for humans and AI-based machines by
    extending the 3 × 3 game to higher dimensions and array sizes, such as in this
    4 × 4 × 4 version, and by introducing gravity effects, as each piece slides to
    the bottom available position.


    ![](OEBPS/images/xii-1.jpg)


    # c. 1300 BC: TIC-TAC-TOE


    ![](OEBPS/images/L01.jpg)


    Archeologists can trace what appears to be “three-in-a-row games” to around 1300
    BCE in ancient Egypt. For tic-tac-toe (TTT), two players, O and X, take turns
    marking their symbols in the spaces of a 3 × 3 grid. The player who first places
    three of his own marks in a horizontal, vertical, or diagonal row wins.


    We’re interested in TTT for this book because it has often been used as an introduction
    to aspects of artificial intelligence and computer programming, due to the simplicity
    of searching its game trees (where nodes are positions in a game, and edges represent
    moves). TTT is a “perfect information” game, as all players know all the moves
    that have taken place. It is also a sequential game without randomization, with
    the players taking turns and avoiding the use of dice.


    TTT may be considered an “atom” upon which the molecules of more advanced games
    of position were built through the centuries. With the slightest of variations
    and extensions, the simple game of TTT becomes a fantastic challenge, requiring
    significant time to master. Mathematicians and puzzle aficionados have extended
    TTT to larger boards, higher dimensions, and strange playing surfaces such as
    rectangular or square boards connected at their edges to form a torus (doughnut
    shape) or Klein bottle (a surface with just one side).


    Consider some TTT curiosities. Players can place their Xs and Os to fill a TTT
    board in 362,880 (or 9!) ways. However, there are 255,168 possible games in TTT
    when considering all possible games that end in 5, 6, 7, 8, and 9 moves. In 1960,
    the MENACE AI system (a contraption of colored beads and matchboxes) learned to
    play TTT using reinforcement learning. In the early 1980s, computer geniuses Danny
    Hillis, Brian Silverman, and friends built a Tinkertoy computer that played TTT
    from 10,000 Tinkertoy pieces. In 1998, researchers and students at the University
    of Toronto created a robot to play three-dimensional (4 × 4 × 4) TTT with a human.


    **SEE ALSO**

    - `The Consciousness Mill (1714)`

    - `Reinforcement Learning (1951)`

    - `Connect Four (1988)`

    - `Othello (1997)`

    - `Solving the Game of Awari (2002)`


    `A depiction of Talos` from Thomas Bulfinch’s *Stories of Gods and Heroes* (1920),
    drawn by English artist Sybil Tawse (1886–1971).


    ![](OEBPS/images/2-1.jpg)


    # c. 400 BCE: TALOS


    ![](OEBPS/images/L01.jpg)


    “Many people are familiar with the figure of Talos,” writes author Brian Haughton,
    “through his depiction as a bronze giant in the 1963 movie Jason and the Argonauts.
    . But where did the idea for Talos come from, and could he have been the first
    robot in history?”


    According to Greek mythology, Talos was a huge bronze automaton whose job was
    to protect Europa—the mother of King Minos of Crete—from invaders, pirates, and
    other enemies. Talos was programmed to patrol the island’s shores by circling
    the entirety of Crete three times each day. One way of deterring foes involved
    throwing huge boulders down them. At other times, the giant robot would leap into
    fire until he glowed with heat, then hug the enemy’s body to burn him to death.
    Talos is sometimes depicted as a winged creature, as was discovered on coins in
    Phaistos, from around 300 BCE; other vase paintings date to around 400 BCE.


    Various explanations have been given regarding the creation and death of Talos.
    In one myth, he is made by Hephaestus—the Greek god of metalworking, metallurgy,
    fire, blacksmiths, and other artisans—at the request of Zeus. Because Talos was
    an automaton, his internal structure was less complex than a human’s; in fact,
    Talos had just one vein that ran from his neck to his ankle. The vein was sealed
    and protected from leaking by a bronze nail at the ankle. According to one legend,
    the sorceress Medea drove him mad with death spirits (Keres) and caused him to
    dislodge the nail. The ichor (i.e., divine blood) then gushed out of him “like
    molten lead,” killing him.


    Talos is just one example showing how the ancient Greeks thought about robots
    and other automata. For another, consider the work of mathematician Archytas (428–347
    BCE), who may have designed and built an automaton driven by steam in the form
    of a self-propelled bird called “The Pigeon.”


    **SEE ALSO**

    - `Ktesibios’s Water Clock (c. 250 BCE)`

    - `Lancelot’s Copper Knights (c. 1220)`

    - `Golem (1580)`

    - `Frankenstein (1818)`


    **This impressive bust of Aristotle is a Roman copy of a bronze original by Greek
