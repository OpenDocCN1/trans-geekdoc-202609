  trans: "\n\n在他在 1950 年的论文《计算机器与智能》中，计算机科学家艾兰·图灵（Alan Turing, 1912–1954）写道，当我们试图构建人工智能机器时，我们并不是在“不敬畏地夺取”上帝“创造灵魂的力量”，这正如我们在繁衍后代时并没有这样做一样；相反，在这两种情况下，我们都是祂旨意的工具，为祂所创造的灵魂提供居所。”一些未来主义者认为，随着我们对大脑结构的日益了解，通过模拟思维或将我们思维的部分上传到计算机，可能会创造意识人工智能。这些推测基于了一种唯物主义观点，即心灵产生于大脑活动。另一方面，17\
    \ 世纪中期的法国哲学家勒内·笛卡尔（René Descartes, 1596–1650）假设心灵或“灵魂”独立于大脑之外。在他看来，这种“灵魂”通过类似松果体的器官与大脑连接，该器官充当了大脑与心灵之间的门户。\n\
    \n关于灵魂与物质分离的各种观点代表了心物`二元论`。1907 年，美国医生邓肯·麦克杜格（Duncan MacDougall, 1866–1920）将垂死的结核病患者放在体重秤上，试图证明这一概念。他推理认为，在死亡瞬间，随着灵魂离开，体重秤应该显示重量下降。根据他的实验结果，麦克杜格测量出灵魂重量为\
    \ 21 克（0.7 盎司）。遗憾的是，麦克杜格和其他人员从未能复制这一发现。\n\n更具唯物主义色彩的心物观点可能得到实验的支持，这些实验表明我们的思想、记忆和性格会因大脑区域受损而改变，且脑成像研究可以描绘出情感和思想。其中一个有趣的例子是，大脑右额叶受损会导致对高级餐厅和美食产生突然而狂热的兴趣——这种状态被称为`饕客综合征`。当然，二元论者笛卡尔可能会辩称，大脑受损改变了行为，是因为心灵是通过大脑来运作的。例如，如果我们切掉汽车的方向盘，汽车的行为会有所不同，但这并不意味着没有一个独立的驾驶员。\n\
    \n**另需参考** 意识工厂 (1714), 超人类 (1957), 在仿真中生活 (1967), 斯皮尔格的《人工智能》(2001)\n\n**此处插图的是一台读字机**，由奥地利工程师古斯塔夫·陶申克（Gustav\
    \ Tauschek, 1899–1945）设计，来自美国第,026,329 号专利。比较设备（磁盘 6）留有字母的切口。当字符的图像与字母形状的孔重合时，就会打印出相应的字母。\n\
    \n![](img/#9781454933601_epub_cre_r1.xhtml#62-1) \n\n# 1913\n\n# 光学字符识别 (OCR)\n\
    \n![](img/L01.jpg)\n\n约翰·亚当斯（John Adams）总统常被认为说过：“大多数人做得比任何人都好的唯一事情，就是读懂自己的字迹。”事实上，对自动化系统的追求有着很长的历史。光学字符识别，或`OCR`，涉及多个领域：计算机视觉、人工智能、模式识别。`OCR`有时用于将各种文本（如手写、打印、信封、路牌、护照等）扫描并识别。该领域的一个早期发明者是俄罗斯科学家埃曼纽尔·戈尔德堡（Emanuel\
    \ Goldberg, 1881–1970）。1913 年，爱尔兰物理学家埃德蒙·福尼尔（Edmund Fournier, 1868–1933）发明了……1974\
    \ 年，雷·库兹韦尔（Ray Kurzweil, b.1948）发明了可以产生……的机器。`OCR`通常需要许多步骤。人工智能神经网络也可以用于提高准确性。\n\
    \n**另需参考** 人工智能神经网络 (1943), 语音识别 (1952), 机器学习 (1959)\n\n**《R.U.R.》海报**由大萧条期间的联邦剧院（1935–1939）资助。\n\
    \n![](img/#9781454933601_epub_cre_r1.xhtml#64-1) \n\n# 1920\n\n# 罗姆通用机器人\n\n![](img/L01.jpg)\n\
    \n由捷克剧作家卡雷尔·捷佩（Karel Čapek, 1890–1938）创作的 1920 年剧作《R.U.R.》向英语引入了`robot`一词。在《R.U.R.》中，机器人是由肉体组成的，但在容器中组装。它们作为工人——本质上是电器——为人类服务，这让人类拥有大量的空闲时间。然而，关于它们的权利引发了辩论。海琳娜想要解放机器人。遗憾的是，机器人最终毁灭了人类；但由于它们不会繁殖，最终它们也会灭绝。两个特殊的机器人相爱，代表了未来的亚当和夏娃。\n\
    \n`robot`源自捷克语`robota`，意为强制劳动。这部剧的意义在于，它迫使人们思考人工智能持续进化的影响：人类与思维机器之间的界限在哪里？机器何时会变得应该拥有权利或构成威胁？根据作者瑞贝卡·斯泰托夫（Rebecca\
    \ Stefoff）的话，《R.U.R.》暗示人类不可言的火花存在于生物的感受和行动中，而非其创造方式。\n\n“哲学意义丰富且充满争议，《R.U.R.》从首次亮相起就被公认为杰作，并成为技术反乌托邦文学的经典，”卢西亚诺·弗洛里迪（Luciano\
    \ Floridi, b.1964）牛津大学哲学与信息伦理教授写道。剧中的思想如此强大，到 1923 年，该剧已被翻译成三十语言。1922 年，该剧在美国纽约首演，举办了一百多场演出。\n\
    \n**另需参考** *大都会区》(1927), *人对人类的使用》(1950), 智能爆炸 (1965)\n\n"
- fmt: "\n`Maria` from the film *Metropolis*, on display at the Robot Hall of Fame\
    \ at the Carnegie Science Center in Pittsburgh, Pennsylvania.\n\n[![](OEBPS/images/66-1.jpg)](#9781454933601_epub_cre_r1.xhtml#66-1)\
    \ \n\n# 1927: METROPOLIS\n\n![](OEBPS/images/L01.jpg)\n\nIn the 1927 silent film\
    \ *Metropolis*—directed by Fritz Lang (1890–1976) and scripted by Thea von Harbou\
    \ (1888–1954)—the inventor `C. A. Rotwang` explains that his robots never tire\
    \ or make a mistake and that these workers of the future will not be distinguishable\
    \ from human beings. Set in a futuristic city, humankind is divided into a leisure\
    \ class that rules the city and the underclass that runs the vast machinery, toiling\
    \ below ground.\n\n`Maria`, the heroine, is a young woman who cares about the\
    \ workers and the difficulty of their lives. As the visually impressive film progresses,\
    \ `Rotwang` creates a robot that resembles `Maria` in an attempt to ruin her reputation\
    \ among the workers and discourage any rebellion. The simulated `Maria` actually\
    \ urges the workers to revolt, but she is later captured and burned at the stake.\
    \ As she burns, the human-like exterior melts away, revealing the metallic-looking\
    \ robot within.\n\nThe film’s motto is “The mediator between the brain and muscle\
    \ must be the heart,” and as such it probes the essential differences between\
    \ humans and AI. Considering the ramifications of *Metropolis*, the futurist Thomas\
    \ Lombardo writes: “The robot, in fact, in science fiction emerged as a symbolic\
    \ synthesis of humanity and the machine—equally the human becoming machine-like,\
    \ being assimilated by its technological creation, as well as the machine becoming\
    \ human, embodying our worst qualities and characteristics. . . . It personifies\
    \ our fear of science and technology, as well as our fear of what we may become.”\n\
    \nThe themes of *Metropolis* echo in more modern science-fiction films like the\
    \ cult classic *Blade Runner* (1982) with its synthetic humans. Of course, overreliance\
    \ on technology, and the future of labor in an AI age, are hot topics of discussion\
    \ today. *Metropolis* will continue to be relevant in the future, as AI entities\
    \ are increasingly mistaken for humans. When AIs are developed with the ability\
    \ to impersonate people we trust or respect, or to become “simulated beings” with\
    \ whom we fall in love, the consequences will be far-reaching.\n\n**SEE ALSO**\
    \ [Rossum’s Universal Robots (1920)](#9781454933601_epub_c033_r1.xhtml#c-033),\
    \ [Turing Test (1950)](#9781454933601_epub_c042_r1.xhtml#c-042), [Ethics of AI\
    \ (1976)](#9781454933601_epub_c068_r1.xhtml#c-068), [*Blade Runner* (1982)](#9781454933601_epub_c071_r1.xhtml#c-071)\n\
    \n`Elektro`, the “Moto-Man,” from the Westinghouse Exhibit at the 1939–1940 New\
    \ York World’s Fair.\n\n[![](OEBPS/images/68-1.jpg)](#9781454933601_epub_cre_r1.xhtml#68-1)\
    \ \n\n# 1939: ELEKTRO THE MOTO-MAN\n\n![](OEBPS/images/L01.jpg)\n\nElektro deserves\
    \ a place in this book because he has been hailed as one of the world’s first\
    \ “celebrity robots” and “America’s oldest surviving robot.”\n\nHe was built by\
    \ the `Westinghouse Electric Corporation` and exhibited at the 1939 New York World’s\
    \ Fair, where he was an instant hit. This 7-foot-tall (2.1-m) humanoid could move\
    \ in response to voice commands, could speak hundreds of words, and even smoked\
    \ cigarettes. His photoelectric eyes could distinguish red and green light. In\
    \ 1940, he was accompanied by `Sparko`, a robot dog that could bark and move.\
    \ Countless visitors to the World’s Fair stood in line to see his twenty-minute\
    \ performances.\n\nRealizing that many people would mistakenly consider his capabilities\
    \ to be a result of a hidden man inside a robot costume, his designers deliberately\
    \ cut a hole in his body to show that this was not the case. In actuality, he\
    \ was created with camshafts, gears, and motors that moved his head, mouth, and\
    \ arms. Engineer `Joseph Barnett` invented him, making use of a series of 78-rpm\
    \ record players connected to relay switches to generate his 700-word vocabulary.\
    \ The robot could say things like “My brain is bigger than yours,” and he responded\
    \ to speech based on the number of words or syllables he heard. For example, three\
    \ words (no matter what they were) activated relays to stop Elektro’s motion.\
    \ Alas, he and `Sparko` could not wander very far, as they were actually controlled\
    \ by nearby operators via electrical cables connected near the feet.\n\nElektro\
    \ has inspired a number of children to pursue careers in engineering over the\
    \ years. He also appeared in the 1960 comedy film *Sex Kittens Go to College*\
    \ and then was promptly dismantled, with his head given as a retirement gift to\
    \ a `Westinghouse` employee. In 2004, his various pieces were rediscovered.\n\n\
    **SEE ALSO** [da Vinci’s Robots (1495)](9781454933601_epub_c012_r1.xhtml#c-012),\
    \ [The Steam Man (1862)](9781454933601_epub_c026_r1.xhtml#c-026), [Shakey the\
    \ Robot (1966)](9781454933601_epub_c059_r1.xhtml#c-059), [ASIMO and Friends (2000)](9781454933601_epub_c085_r1.xhtml#c-085)\n\
    \n**The VODER,** which simulated effects of the human vocal tract, fascinated\
    \ crowds at the 1939 New York’s Fair. The `VODER` used a console from which an\
    \ operator could create speech.\n\n[![](OEBPS/images/70-1.jpg)](#9781454933601_epub_cre_r1.xhtml#70-1)\
    \ \n\n# 1939: SPEECH SYNTHESIS\n\n![](OEBPS/images/L01.jpg)\n\nPerhaps many of\
    \ you have heard the synthesized voice of `Stephen Hawking` (1942–2018), who for\
    \ many years used a speech synthesizer to speak after his motor disease led to\
    \ his inability to speak. In fact, the ability of computer systems to convert\
    \ text to speech has served many useful purposes, including reading text out loud\
    \ for the visually impaired, young children, or people with reading difficulties.\
    \ Synthetic speech can also allow computer systems to create the impression of\
    \ human intelligence and interaction. New approaches using neural nets can now\
    \ simulate the specific speech of selected people, and thus we live in a world\
    \ where it will be increasingly difficult to know when the voice of someone we\
    \ trust (e.g., a business partner, a parent, a child) is being generated by the\
    \ actual person. What happens when someone can “steal” anyone else’s voice and\
    \ have them speak anything?\n\nSpeech synthesis systems have been implemented\
    \ by various means. For example, engineers can store digitized speech units and\
    \ concatenate them (i.e., string them together) during playback, or they can utilize\
    \ distinctive frequency components of the acoustic signal (i.e., formants) in\
    \ a method called *formant synthesis*. With *articulatory synthesis*, models of\
    \ the vocal tract are simulated. Of course, simple systems like talking clocks,\
    \ cars, and calculators, need only store a few pre-recorded words.\n\nMany challenges\
    \ exist for converting text to natural and understandable speech. For example,\
    \ consider the various pronunciations in the English language of words like *tear*,\
    \ *bass*, *read*, *project*, *desert*, and so on, which change depending on the\
    \ context in which they are spoken.\n\nOne of the early landmarks in the history\
    \ of synthetic speech involves the work of `Homer Dudley` (1896–1980), who invented\
    \ the `vocoder` (i.e., “voice encoder”), which could electronically produce speech\
    \ using various electronic filters, and the `VODER` (i.e., “voice operation demonstrator”),\
    \ which used a console from which an operator could create speech. The latter,\
    \ which simulated effects of the human vocal tract, was exhibited at the 1939\
    \ New York World’s Fair.\n\n**SEE ALSO** [Speech Recognition (1952)](9781454933601_epub_c045_r1.xhtml#c-045),\
    \ [Natural Language Processing (1954)](9781454933601_epub_c046_r1.xhtml#c-046),\
    \ [Ethics of AI (1976)](9781454933601_epub_c068_r1.xhtml#c-068)\n"
