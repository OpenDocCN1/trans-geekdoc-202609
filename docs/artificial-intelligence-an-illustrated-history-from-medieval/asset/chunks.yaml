  trans: "\n\n## 另见\n机器学习 (1959), 在模拟中生活 (1967), 遗传算法 (1975), 群体智能 (1986), 电子宠物 (1996),\
    \ “称他们为人工外星人” (2015)\n\n**蚁群优化**是一种利用模拟蚂蚁寻找解决方案的方法，其灵感来自真实蚂蚁寻找食物。这里展示了蚂蚁正在形成一座通往叶叶的生物桥梁。\n\
    \n![](img/#9781454933601_epub_cre_r1.xhtml#148-1) \n\n# 1986: 群体智能\n\n![](img/L01.jpg)\n\
    \n蚁丘的高度可以超过 17 英尺（5 米），蚂蚁像简单的“新奇性检测器”，对穴内空气特征的变化做出反应，并根据需要改变结构。作者多丽丝·乔纳斯（Doris\
    \ Jonas）和大·乔纳斯（David Jonas）推测：“还有什么其他的认知方式让蚂蚁知道它们必须做什么以及何时做？信使无法足够快地向它们传递指令，因为山内的距离太远了。……群体大脑作为一个决策工具的方式，与智能个体大脑惊人地相似。”\n\
    \n这些社交昆虫表现出的明显群体智能，以及鸟群和畜群动物的智能，启发了`群体智能`的概念。在人工智能领域，这一概念被用于处理一系列挑战。软件智能体遵循简单的局部规则，并且像蚂蚁和白蚁一样，没有中央控制器来指挥整个群体的行为。举一个例子，由计算机科学家克雷格·雷诺兹（Craig\
    \ Reynolds，生于 1953）于 1986 年开发的人工生命程序 Boids，通过遵循简单的规则来模拟鸟类的群集行为，这些规则包括：鸟类向群体中鸟的平均航向转向、转向向鸟类的平均位置移动，以及转向避免过度拥挤。\n\
    \n如今人工智能领域研究的众多群体方法之一是`蚁群优化`，这种方法使用模拟蚂蚁，记录它们的位置和解决方案的质量，帮助群中的蚂蚁确定更好的方案。在某些实现中，这些“蚂蚁”模拟了会随时间挥发的吸引性化学痕迹（信息素）。`粒子群优化`模拟了鱼群向最优位置的位置和速度。其他感兴趣的方法还有人工免疫系统、蜂群优化算法、萤火虫优化算法、蝙蝠算法、土拨搜索以及蟑螂侵扰优化。\n\
    \n群体智能的应用包括自动驾驶车辆的控制、电信网络路由、飞机调度、艺术创作、增强无功功率和电压控制系统，以及基因表达数据的聚类。\n\n## 另见\n机器学习\
    \ (1959), 在模拟中生活 (1967), 遗传算法 (1975), 人工生命 (1986), “大象不下象棋” (1990)\n\n**一些对于儿童来说相对简单的任务**，包括感觉运动任务，对人工智能来说却是非常困难的。\n\
    \n![](img/#9781454933601_epub_cre_r1.xhtml#150)\n\n# 1988: 莫维克悖论\n\n![](img/L01.jpg)\n\
    \n“如果你想击败马格斯·卡尔森（Magnus Carlsen），你会选择计算机，”记者拉里·埃利特（Larry Elliott）写道，“如果你想在比赛结束后收拾棋，你会选择人类。”这就是莫维克悖论的精髓，20\
    \ 世纪 80 年代的许多人工智能研究人员强调了这一点，他们指出涉及高水平推理的任务对计算机来说变得越来越容易。与此同时，一些看似简单的感觉运动任务（例如捡起鞋子上的毛絮）对计算机系统来说可能非常困难。这一悖论以机器人学家汉·莫维克（Hans\
    \ Moravec）命名，他在 1988 年的书《心灵》中写道：“让计算机表现出成人水平的智力测试或国际象棋相对容易，但要给它们一岁小孩的能力是不可能的。”\n\
    \n莫维克指出，百万年的进化造就了我们无意识执行任务的能力，例如识别脸部和声音，这些对于生存至关重要。正如认知科学家史蒂芬·平克（Steven Pinker，生于\
    \ 1954）优雅总结的那样，莫维克悖论意味着未来的工人可能只剩下存在了几世纪甚至几千年的低薪工作：“人工智能三十五年的教训是，困难的问题是简单的，而简单的问题是困难的。我们四岁小孩的能力——识别脸、走过房间、回答问题——实际上解决了一些最困难的问题。随着新一代智能设备的出现，面临危险的是股票分析师、石油工程师和假释委员会。园艺师、接待员和厨师在未来几年内是安全的。”\n\
    \n## 另见\n“机器中的达尔文”（1863), 图灵测试 (1950), 利克尔德的“人机共生”（1960), “大象不下象棋”（1990)\n\n**正在进行中的连棋游戏，**使用黄色和红色圆盘，在重力作用下滑入最底部空位。\n\
    \n![](img/#9781454933601_epub_cre_r1.xhtml#152-1) \n\n# 1988: 连棋\n\n![](img/L01.jpg)\n\
    \n作为新南威尔士大学的人工智能教授，托比·沃尔什（Toby Walsh，生于 1964）曾作为圣诞礼物送给他的父亲一个可以完美玩连棋的程序。他的父亲以前非常喜欢这款游戏，但他评论说程序剥夺了游戏的乐趣，沃尔什对此表示认同。当智能手机在几乎所有的游戏和创作活动（从音乐作曲到小说写作）方面都超越人类时，这对人类的集体心理会产生什么影响？\n\
    \n"
- fmt: "\nConnect Four is played by two people using discs (yellow vs. red) on a vertical\
    \ board with seven columns and six rows. As the discs slide down a column to the\
    \ bottommost open grid position, the objective is to be the first player to form\
    \ a line of four adjacent discs of one’s own color (horizontally, vertically,\
    \ or diagonally). The game is reminiscent of a tic-tac-toe game, but with gravity\
    \ influencing the pieces. Of course, Connect Four is much more complicated than\
    \ tic-tac-toe: if one considers all possible game boards filled with 0 to 42 discs,\
    \ there are a walloping 4,531,985,219,092 positions. In fact, the number of possible\
    \ positions after `n` discs have been played on a standard 7 × 6 board grows as\
    \ thus (where `n` = 0, 1, 2, 3, . . . ): 1, 7, 56, 252, 1260, 4620, 18480, 59815,\
    \ 206780, 605934, 1869840, 5038572, 14164920, 35459424, 91871208, 214864650, 516936420,\
    \ 1134183050, 2546423880, 5252058812, 11031780760, 21406686756, 42121344720, 76871042612\
    \ . . .\n\nOn October 1, 1988, computer scientist James D. Allen finally “solved”\
    \ Connect Four—that is, he devised an algorithm that could predict the outcome\
    \ of moves (win, lose, or draw) from every possible position, assuming players\
    \ play perfectly from that point on. Two weeks later, the game was solved independently\
    \ by computer scientist Victor Allis, who employed an AI approach with nine strategies.\
    \ As a result, we now know that Connect Four can always be won by the first player\
    \ with perfect play.\n\nThere is much room for further research on variations\
    \ of Connect Four. For example, imagine playing on boards that are wrapped into\
    \ a cylinder, or playing on boards with different grid sizes, additional colors,\
    \ and more than two dimensions. The number of possible positions and outcomes\
    \ would be mind-boggling.\n\n**SEE ALSO** [Tic-Tac-Toe (c. 1300 BCE)](#9781454933601_epub_c001_r1.xhtml#c-001),\
    \ [Othello (1997)](#9781454933601_epub_c083_r1.xhtml#c-083), [Solving the Game\
    \ of Awari (2002)](#9781454933601_epub_c087_r1.xhtml#c-087), [Quackle’s Scrabble\
    \ Win (2006)](#9781454933601_epub_c090_r1.xhtml#c-090), [AlphaGo Go Champion (2016)](#9781454933601_epub_c095_r1.xhtml#c-095)\n\
    \n**Intelligence in life forms** clearly does not revolve around playing games\
    \ like chess. In the paper “Elephants Don’t Play Chess,” Rodney Brooks argues\
    \ for a different focus in exploring AI.\n\n[![](OEBPS/images/154-1.jpg)](#9781454933601_epub_cre_r1.xhtml#154-1)\
    \ \n\n# 1990\n\n# “ELEPHANTS DON’T PLAY CHESS”\n\n![](OEBPS/images/L01.jpg)\n\n\
    “There is an alternative route to Artificial Intelligence that diverges from the\
    \ directions pursued under that banner for the last thirty some years,” wrote\
    \ roboticist Rodney Brooks (b. 1954) in his widely cited 1990 manifesto titled\
    \ “Elephants Don’t Play Chess.” He continued: “The traditional approach has emphasized\
    \ the abstract manipulation of symbols, whose grounding in physical reality has\
    \ rarely been achieved. We explore a research methodology which emphasizes ongoing\
    \ physical interaction with the environment as the primary source of constraint\
    \ on the design of intelligent systems.”\n\nOne of several points made by Brooks\
    \ in his paper is that all around us are intelligences far removed from chess\
    \ playing, in the form of intelligent animals (e.g., elephants) and even insect\
    \ swarms. Brooks believed that AI research should move, at least in part, from\
    \ a focus on classical AI involving rules, symbol manipulation, and search trees\
    \ to one based more on considerations that include sensorimotor coupling with\
    \ the environment (e.g., feedback between senses and motion-producing mechanisms),\
    \ vision-movement coordination, and other forms of direct physical interaction\
    \ with the real world.\n\nBrooks’s paper concludes with a fascinating sampling\
    \ of AI robots that are reminiscent of bundles of sensory systems that react to\
    \ the environment. For Brooks, a physical body is considered to be crucial for\
    \ the intelligence that interests him—in AI creatures that can solve problems\
    \ concerning locomotion, grasping, and navigating through the world. These behavior-based\
    \ AI systems need not always “understand” the functioning of their separate behavioral\
    \ systems.\n\n# 1993\n\n# LEAKPROOF “AI BOX”\n\n![](OEBPS/images/L01.jpg)\n\n\
    As discussed in the entry “Intelligence Explosion,” some scientists have expressed\
    \ concerns that once AIs become sufficiently intelligent, such entities could\
    \ repeatedly improve themselves so to pose a possible threat to humanity. This\
    \ runaway AI growth is sometimes referred to as the `technological singularity`.\
    \ Of course, such entities might also be extremely valuable to humans; but possible\
    \ risks have led researchers to speculate about how to build `AI boxes` that could\
    \ confine or isolate such entities, if the need arises.\n"
