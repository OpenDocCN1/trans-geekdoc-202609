    \ (1965), 生活在仿真中 (1967), 回形针极值化者灾难 (2003)\n\n20 世纪 50 年代，IBM 科学家阿瑟·塞缪尔（Arthur\
    \ Samuel）因其自适应国际棋程序而闻名，该程序通过与自己的修改版本进行对弈来学习。AI 选手很快将在哪些其他游戏中展现出超人类的能力？\n\n![![](img/158-1.jpg)](#9781454933601_epub_cre_r1.xhtml#158-1)\
    \ \n\n# 1994\n\n## 国际棋与人工智能\n\n![](img/L01.jpg)\n\n国际棋在 8 × 8 的棋盘上进行，玩家轮流通过跳过对方的棋子来尝试对方。20\
    \ 世纪 50 年代，IBM 科学家阿瑟·塞缪尔（1901–1990）因其自适应国际棋程序而闻名，该程序通过与自己的修改版本进行对弈来学习。国际棋 AI 历史上的一个著名里程碑是\
    \ `Chinook`（酋长），它在 1994 年成为第一个击败人类获得世界冠军的计算机程序。\n\n`Chinook` 由加拿大计算机科学家乔纳森·舍费尔（Jonathan\
    \ Schaeffer，1957 年生）领导的团队开发；它同时利用了大师下过的开局库以及一种算法，到 1992 年，该算法搜索国际棋步法的平均最小搜索深度已达到十九步（一步等于一个玩家的一次移动）。它还使用了一个针对所有八枚或更少棋子的残局数据库，以及一个实用的步法评估函数。\n\
    \n在著名的 1994 年人机国际棋对赛之前，马丽恩·廷斯利（Marion Tinsley，1927–1995，被广泛认为是历史上最强大的国际棋手）宣布：“我有一个比\
    \ `Chinook` 更好的程序员。他的是乔纳森，我的是主。”然而，在经过了六场全部平局的比赛后，廷斯利抱怨腹痛并不得不停止比赛。他在几个月后死于胰腺癌。`Chinook`\
    \ 被宣布为默认胜者。\n\n2007 年，舍费尔和同事们利用计算机最终证明了国际棋在完美执行时是一场无胜之局。这意味着国际棋类似于井字棋——如果双方都不犯错，那么这种游戏也是无法获胜的。舍费尔的证明由数百台计算机历时十八年完成，并最终表明在理论上可以制造一台永远不会输给人类的机器。\n\
    \n为了“解决国际棋游戏”，研究团队考虑了棋盘上十枚或更少棋子的 39 万亿种排列，然后确定其中某一名玩家是否获胜。团队还使用特殊的搜索算法来研究游戏的开始——特别是观察初始步法是如何“汇聚”到那十棋子配置的。\n\
    \n## **另请** 井字棋（约公元前 1300 年）, 机械土耳人（1770）, 机器学习 (1959), 西洋棋冠军被击败 (1979), 深蓝号击败象棋冠军\
    \ (1997), 黑棋 (1997)\n\n**来自美国专利 6,213,871 的图，**标题为“用于虚拟生物的仿真培养装置”，授予横井洋（Akihiro\
    \ Yokoi）。这种寄存在蛋形设备中的人造生命——电子宠物拓养，在 1997 年开始风靡。\n\n![![](img/160-1.jpg)](#9781454933601_epub_cre_r1.xhtml#160-1)\
    \ \n\n# 1996\n\n## 电子宠物\n\n![](img/L01.jpg)\n\n这种寄存在小型携式设备中的电子宠物生命形式是首批受到全球儿童关注的虚拟宠物。由万代员工横井洋（Akihiro\
    \ Yokoi，1955 年生）开发的电子宠物于 1996 年首次发布。令人惊讶的是，1997 年在日本售出了 30,000 台。它被安置在一个蛋形设备中并配备一个小屏幕。主人可以使用按钮与宠物互动，如果得不到妥照顾，电子机会死亡。这些简单的形式引发了关于人与之间什么是健康关系的许多问题。\n\
    \n## **另请** 生活在仿真中 (1967), 人工生命 (1986), AIBO 机器人 (1999)\n\n**AI 实体或人类将发明什么样的新象棋版本，可能会为人类带来新挑战？图中显示的是\
    \ 18 和 19 世纪在俄罗斯盛行的堡垒象棋。这里的四位玩家（AI 或人类）分别用黑色、白色、深灰色浅灰色表示。\n\n![![](img/162-1.jpg)](#9781454933601_epub_cre_r1.xhtml#162-1)\
    \ \n\n# 1997\n\n## 深蓝号击败象棋冠军\n\n![](img/L01.jpg)\n\n弗拉基米尔·克拉姆尼克（Vladimir Kramnik，1975\
    \ 年生）是 2006 年至 2007 年间的无争议象棋冠军，他曾告诉记者：“我坚信，下棋的方式总是反映选手的性格。如果某些东西定义了他的性格，那么它也会定义了他的下棋方式。”这种“性格”是否也会反映在\
    \ AI 的棋法中呢？\n\n几十年来，技术专家一直将象棋视为人工智能的一种衡量标准，因为它是一种需要策略、详细推理、逻辑、远见以及至少对人类玩家来说需要诡诈的游戏。在关于机器何时能击败现任象棋冠军的争议多年后，这种情况在\
    \ 1997 年发生了：IBM 的`深蓝号`计算机在六局赛中击败了俄罗斯象棋冠军加里·卡斯帕罗夫（Garry Kasparov，1963 年生）。\n\n"
- fmt: "\nUsing special-purpose hardware, the 1997 version of Deep Blue was capable\
    \ of evaluating 200 million chess positions per second, and it typically searched\
    \ to a depth of around six to eight future moves, if not far more. Deep Blue’s\
    \ strategy could also take into account a large database of past grandmaster games,\
    \ and it used endgame databases that included chess positions with five or fewer\
    \ pieces.\n\nThe dream of chess machines stretches far back in time. The Mechanical\
    \ Turk chess robot, created by Hungarian inventor Wolfgang von Kempelen in 1770,\
    \ played a strong game of chess, but it also employed a human who hid inside the\
    \ machine. In 1950, computer scientist Alan Turing and mathematician David Champernowne\
    \ (1912–2000) designed a computer program, known as the “Turbochamp,” to play\
    \ chess. However, because no computer was available to actually run the algorithm,\
    \ Turing simulated a computer by manually consulting the algorithm during a testing\
    \ phase.\n\nIn 2017, the program AlphaZero beat world-champion chess-playing computer\
    \ programs, having taught itself how to play in less than a day! The program used\
    \ machine learning, starting from random play, and was given no domain knowledge\
    \ except the game rules.\n\n**SEE ALSO** [Mechanical Turk (1770)](#9781454933601_epub_c018_r1.xhtml#c-018),\
    \ [Checkers and AI (1994)](#9781454933601_epub_c080_r1.xhtml#c-080), [AlphaGo\
    \ Go Champion (2016)](#9781454933601_epub_c095_r1.xhtml#c-095)\n\n**Close-up of\
    \ Othello playing pieces,** showing that the discs may be flipped to turn from\
    \ black to white, or vice versa, according to the rules of the game.\n\n[![](OEBPS/images/164-1.jpg)](#9781454933601_epub_cre_r1.xhtml#164-1)\
    \ \n\n# 1997\n\n# OTHELLO\n\n![](OEBPS/images/L01.jpg)\n\nBecause of the precise\
    \ rules of games and the ability to determine a winner in the playing process,\
    \ games have been a popular testing arena for AI researchers. Also, the AI system\
    \ can often play millions of games against itself or other AI players so as to\
    \ improve and gain insight. One interesting game to which AI has been successfully\
    \ applied is Othello, also called Reversi, which was mentioned in an 1886 edition\
    \ of *The Saturday Review* and dates much farther back in time.\n\nThe game of\
    \ Othello is played on an 8 × 8 grid with disks that are white on one side and\
    \ black on the other. During a turn, a player places a disk with the player’s\
    \ color facing up.\n\nImagine you are playing black, and you place your disk at\
    \ one end of a line of white pieces with another black disk at the other end.\
    \ In that scenario, the intermediate white disks are turned over to black. In\
    \ other words, discs are flipped by a play that sandwiches them between opposite\
    \ color discs, and the player with the majority color at the end of the game is\
    \ the winner.\n\nOne reason the game is so challenging for humans to visualize\
    \ is that, unlike chess and checkers, the colors of Othello pieces may keep changing.\
    \ Since around 1980, Othello computer programs have easily defeated professional\
    \ players. In 1997, Logistello, a computer program created by computer scientist\
    \ Michael Buro, defeated the human champion Takeshi Murakami by the score of 6\
    \ games to 0. At the time, Murakami, a 32-year-old English teacher from Tokyo,\
    \ seemed surprised at his defeat, saying that at least one Logistello move was\
    \ “unfathomable” because it was so different from a move a human would make.\n\
    \nThe number of legal positions in Othello is at most 10^(28). Even today, Othello\
    \ is considered an “unsolved game” in the sense that no one has proved what the\
    \ outcome of a game would be if both sides played perfect games.\n\n**SEE ALSO**\
    \ [Tic-Tac-Toe (c. 1300 BCE)](#9781454933601_epub_c001_r1.xhtml#c-001), [Mastermind\
    \ (1970)](#9781454933601_epub_c063_r1.xhtml#c-063), [Checkers and AI (1994)](#9781454933601_epub_c080_r1.xhtml#c-080),\
    \ [Deep Blue Defeats Chess Champion (1997)](#9781454933601_epub_c082_r1.xhtml#c-082),\
    \ [AlphaGo Go Champion (2016)](#9781454933601_epub_c095_r1.xhtml#c-095)\n\n**As\
    \ robot dogs and other pets become more advanced** in the coming years, will there\
    \ come a time when they are nearly indistinguishable from actual animals or outnumber\
    \ actual living pets in our homes?\n\n[![](OEBPS/images/166-1.jpg)](#9781454933601_epub_cre_r1.xhtml#166-1)\n\
    \n# 1999\n\n# AIBO\n\n![](OEBPS/images/L01.jpg)\n\nThe dog-like robot AIBO, introduced\
    \ by Sony Corporation in 1999, was one of the world’s first mass-market consumer\
    \ robots for entertainment. Enjoyed by children and adults, AIBO was also used\
    \ in education and for research because it included a vision system. AIBO, which\
    \ takes its name from the Japanese word for “pal,” could respond to numerous commands\
    \ and made use of various sensors, including touch sensors, a camera, a range-finder,\
    \ and a microphone. More sensors and actuators (for the legs, neck, and other\
    \ parts) were added in successive models. Some versions could autonomously recharge\
    \ their batteries at a charging station. Software gave the robots a personality\
    \ and the ability to walk.\n\nFascinating studies have been conducted using AIBO\
    \ and other artificial pets for patients with dementia, and the studies suggest\
    \ that robotic pets could be beneficial for companionship and stimulation. More\
    \ advanced pets may one day be even more helpful to people during any period of\
    \ cognitive decline. Other studies have considered AIBO–human relationships and\
    \ found that a significant number of owners reported that the AIBO has feelings,\
    \ even though they understood the dog was mechanical and not alive.\n\nIn 2017,\
    \ Sony announced a new generation of AIBO with many more actuators to provide\
    \ smoother, more natural movements. These fourth-generation models have improved\
    \ face recognition abilities, more features involving mobile access, and more\
    \ sophisticated abilities to adapt, learn, and respond to the environment.\n"
