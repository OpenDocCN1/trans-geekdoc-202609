- fmt: "\nA recent issue of *The Economist magazine* likened today’s speech-recognition\
    \ devices to “casting a magic spell,” allowing people to “control the world through\
    \ words alone.” This reminds us of novelist Arthur C. Clarke’s assertion that\
    \ any sufficiently advanced technology is indistinguishable from magic. “The fast-emerging\
    \ technology of voice computing proves Clarke’s point. . . . Say a few words into\
    \ the air, and a nearby device can grant your wish.”\n\nThe science and technology\
    \ of *speech recognition*, which enables the recognition of spoken language by\
    \ machines, has had a long history. In 1952, Bell Laboratories developed the `AUDREY`\
    \ system, which made use of vacuum-tube circuitry and understood spoken numerical\
    \ digits. Ten years later, IBM’s `Shoebox` machine at the 1962 Seattle World’s\
    \ Fair understood sixteen words, including the digits `0` through `9`, and it\
    \ would perform arithmetic operations if it heard words like `plus`. In 1987,\
    \ the “Julie” doll, offered by the US toy company Worlds of Wonder, could understand\
    \ some simple phrases and reply.\n\nThe technology enabling machines to recognize\
    \ speech has evolved considerably. Historically, it has involved the hidden Markov\
    \ model (`HMM`), a statistical method for predicting whether a sound corresponds\
    \ to a word, and today recognition makes significant use of deep learning (i.e.,\
    \ artificial neural nets with multiple layers) to achieve high accuracy. For example,\
    \ a speech-recognition system may hear a stream of sound in a noisy environment\
    \ and make a number of “guesses” about what is being said by determining the probability\
    \ of various words and phrases it has encountered in training text. Special software\
    \ applications may have knowledge of the likelihood of a particular phrase being\
    \ used, and decide, for example, whether “abdominal aortic aneurysm” should be\
    \ ranked high or low, depending upon whether it is heard by radiological dictation\
    \ software or if it is said in a car that is awaiting a simple command.\n\nOf\
    \ course, today, countless digital assistants—in our homes, cars, offices, and\
    \ mobile phones—respond to voice questions and commands, and they can also help\
    \ with dictation of notes. Blind persons and the physically disabled may also\
    \ benefit from speech input.\n\n**SEE ALSO** [Speech Synthesis (1939)](#9781454933601_epub_c036_r1.xhtml#c-036),\
    \ [Artificial Neural Networks (1943)](#9781454933601_epub_c039_r1.xhtml#c-039),\
    \ [Natural Language Processing (1954)](#9781454933601_epub_c046_r1.xhtml#c-046)\n\
    \n**In 1954, in a famous public demonstration** of a research project known as\
    \ the “Georgetown-IBM experiment,” Russian was automatically translated into English\
    \ by an “electronic brain” in the form of an `IBM 701` computer, shown here.\n\
    \n[![](OEBPS/images/90-1.jpg)](#9781454933601_epub_cre_r1.xhtml#90-1) \n\n# 1954\n\
    \n# NATURAL LANGUAGE PROCESSING\n\n![](OEBPS/images/L01.jpg)\n\nIn 1954, an IBM\
    \ press release proclaimed: “Russian was translated into English by an electronic\
    \ ‘brain’ today for the first time. . . . The famous 701 computer . . . within\
    \ a few seconds, turned the sentences into easily readable English. A girl who\
    \ didn’t understand a word of the language of the Soviets punched out the Russian\
    \ messages on IBM cards.” The press release continued by explaining that “the\
    \ ‘brain’ dashed off its English translations on an automatic printer at the breakneck\
    \ speed of two and a half lines per second.”\n\nIn 1971, computer scientist Terry\
    \ Winograd (b. 1946) wrote `SHRDLU`, a program that translated human commands\
    \ such as “Move the red block next to the blue pyramid” into physical actions.\
    \ Today, *natural language processing* (`NLP`) often involves many AI subfields,\
    \ including speech recognition, natural language understanding (e.g., machine\
    \ reading comprehension), and speech synthesis. One of the goals is to facilitate\
    \ natural interactions between humans and computers.\n\nThe early days of NLP\
    \ usually involved the use of complicated sets of manually created rules; but\
    \ in the 1980s, NLP made increasing use of machine learning algorithms that learned\
    \ rules through analysis of large sets of example language input. Typical NLP\
    \ tasks may involve machine translations (e.g., translating Russian into English),\
    \ question answering (e.g., “What is the capital of France?”), sentiment analysis\
    \ (emotions and attitudes on a topic), etc. Analyzing input from text, audio,\
    \ and video, NLP is employed in diverse realms, including spam-filtering for email,\
    \ summarizing information in long articles, and question-answering by smartphone\
    \ apps.\n\nNLP is challenging for many reasons. For example, in speech recognition,\
    \ the sounds of adjacent words blend into one another, and the computing system\
    \ must also take into account syntax (i.e., grammar), semantics (i.e., meaning),\
    \ and pragmatics (i.e., purpose or goal)—along with the many classes of ambiguity\
    \ in language where words take on different meanings in different contexts. Today,\
    \ significant use of artificial neural network methods helps to improve accuracy.\n\
    \n**SEE ALSO** [Speech Synthesis (1939)](#9781454933601_epub_c036_r1.xhtml#c-036),\
    \ [Artificial Neural Networks (1943)](#9781454933601_epub_c039_r1.xhtml#c-039),\
    \ [Turing Test (1950)](#9781454933601_epub_c042_r1.xhtml#c-042), [Speech Recognition\
    \ (1952)](#9781454933601_epub_c045_r1.xhtml#c-045), [Machine Learning (1959)](#9781454933601_epub_c050_r1.xhtml#c-050),\
    \ [Licklider’s “Man-Computer Symbiosis” (1960)](#9781454933601_epub_c052_r1.xhtml#c-052),\
    \ [ELIZA Psychotherapist (1964)](#9781454933601_epub_c053_r1.xhtml#c-053), [SHRDLU\
    \ (1971)](#9781454933601_epub_c066_r1.xhtml#c-066), [Paranoid PARRY (1972)](#9781454933601_epub_c066_r1.xhtml#c-066),\
    \ [Watson on *Jeopardy!* (2011)](#9781454933601_epub_c091_r1.xhtml#c-091)\n\n\
    **The Dartmouth Summer Research Project on Artificial Intelligence** is considered\
    \ to be an important event in the history of AI and where the term *artificial\
    \ intelligence*, selected by computer scientist John McCarthy (pictured here in\
    \ 1974), started to gain acceptance.\n\n[![](OEBPS/images/92-1.jpg)](#9781454933601_epub_cre_r1.xhtml#92-1)\
    \ \n\n# 1956\n\n# DARTMOUTH AI WORKSHOP\n\n![](OEBPS/images/L01.jpg)\n\n“In the\
    \ summer of 1956,” writes journalist Luke Dormehl, “when Elvis Presley was scandalizing\
    \ audiences with his hip gyrations . . . and President Dwight Eisenhower authorized\
    \ ‘In God we trust’ as the US national motto—AI’s first official conference took\
    \ place.” That conference—the Dartmouth Summer Research Project on Artificial\
    \ Intelligence—is where the term *artificial intelligence*, coined by computer\
    \ scientist John McCarthy (1927–2011), started to gain acceptance.\n\nThe workshop\
    \ was formally proposed by McCarthy of Dartmouth College, Marvin Minsky (1927–2016)\
    \ of Harvard University, Nathaniel Rochester (1919–2001) of IBM, and Claude Shannon\
    \ (1916–2001) of Bell Telephone Laboratories, as follows: “We propose that a 2-month,\
    \ 10-man study of artificial intelligence be carried out during the summer. .\
    \ . . [We conjecture] that every aspect of learning or any other feature of intelligence\
    \ can in principle be so precisely described that a machine can be made to simulate\
    \ it. An attempt will be made to find how to make machines use language, form\
    \ abstractions and concepts, solve kinds of problems now reserved for humans,\
    \ and improve themselves. We think that a significant advance can be made . .\
    \ . if a carefully selected group of scientists work on it together for a summer.”\
    \ The proposal also made specific mention of several other key areas of consideration,\
    \ including “neuron nets” and “randomness and creativity.”\n"
  raw: "A recent issue of *The Economist magazine* likened today’s speech-recognition\
    \ devices to “casting a magic spell,” allowing people to “control the world through\
    \ words alone.” This reminds us of novelist Arthur C. Clarke’s assertion that\
    \ any sufficiently advanced technology is indistinguishable from magic. “The fast-emerging\
    \ technology of voice computing proves Clarke’s point. . . . Say a few words into\
    \ the air, and a nearby device can grant your wish.”\n\nThe science and technology\
    \ of *speech recognition*, which enables the recognition of spoken language by\
    \ machines, has had a long history. In 1952, Bell Laboratories developed the AUDREY\
    \ system, which made use of vacuum-tube circuitry and understood spoken numerical\
    \ digits. Ten years later, IBM’s Shoebox machine at the 1962 Seattle World’s Fair\
    \ understood sixteen words, including the digits *0* through *9*, and it would\
    \ perform arithmetic operations if it heard words like *plus*. In 1987, the “Julie”\
    \ doll, offered by the US toy company Worlds of Wonder, could understand some\
    \ simple phrases and reply.\n\nThe technology enabling machines to recognize speech\
    \ has evolved considerably. Historically, it has involved the hidden Markov model\
    \ (HMM), a statistical method for predicting whether a sound corresponds to a\
    \ word, and today recognition makes significant use of deep learning (i.e., artificial\
    \ neural nets with multiple layers) to achieve high accuracy. For example, a speech-recognition\
    \ system may hear a stream of sound in a noisy environment and make a number of\
    \ “guesses” about what is being said by determining the probability of various\
    \ words and phrases it has encountered in training text. Special software applications\
    \ may have knowledge of the likelihood of a particular phrase being used, and\
    \ decide, for example, whether “abdominal aortic aneurysm” should be ranked high\
    \ or low, depending upon whether it is heard by radiological dictation software\
    \ or if it is said in a car that is awaiting a simple command.\n\nOf course, today,\
    \ countless digital assistants—in our homes, cars, offices, and mobile phones—respond\
    \ to voice questions and commands, and they can also help with dictation of notes.\
    \ Blind persons and the physically disabled may also benefit from speech input.\n\
    \n**SEE ALSO** [Speech Synthesis (1939)](#9781454933601_epub_c036_r1.xhtml#c-036),\
    \ [Artificial Neural Networks (1943)](#9781454933601_epub_c039_r1.xhtml#c-039),\
    \ [Natural Language Processing (1954)](#9781454933601_epub_c046_r1.xhtml#c-046)\n\
    \n**In 1954, in a famous public demonstration** of a research project known as\
    \ the “Georgetown-IBM experiment,” Russian was automatically translated into English\
    \ by an “electronic brain” in the form of an IBM 701 computer, shown here.\n\n\
    [![](OEBPS/images/90-1.jpg)](#9781454933601_epub_cre_r1.xhtml#90-1) \n\n# 1954\n\
    \n# NATURAL LANGUAGE PROCESSING\n\n![](OEBPS/images/L01.jpg)\n\nIn 1954, an IBM\
    \ press release proclaimed: “Russian was translated into English by an electronic\
    \ ‘brain’ today for the first time. . . . The famous 701 computer . . . within\
    \ a few seconds, turned the sentences into easily readable English. A girl who\
    \ didn’t understand a word of the language of the Soviets punched out the Russian\
    \ messages on IBM cards.” The press release continued by explaining that “the\
    \ ‘brain’ dashed off its English translations on an automatic printer at the breakneck\
    \ speed of two and a half lines per second.”\n\nIn 1971, computer scientist Terry\
    \ Winograd (b. 1946) wrote SHRDLU, a program that translated human commands such\
    \ as “Move the red block next to the blue pyramid” into physical actions. Today,\
    \ *natural language processing* (NLP) often involves many AI subfields, including\
    \ speech recognition, natural language understanding (e.g., machine reading comprehension),\
    \ and speech synthesis. One of the goals is to facilitate natural interactions\
    \ between humans and computers.\n\nThe early days of NLP usually involved the\
    \ use of complicated sets of manually created rules; but in the 1980s, NLP made\
    \ increasing use of machine learning algorithms that learned rules through analysis\
    \ of large sets of example language input. Typical NLP tasks may involve machine\
    \ translations (e.g., translating Russian into English), question answering (e.g.,\
    \ “What is the capital of France?”), sentiment analysis (emotions and attitudes\
    \ on a topic), etc. Analyzing input from text, audio, and video, NLP is employed\
    \ in diverse realms, including spam-filtering for email, summarizing information\
    \ in long articles, and question-answering by smartphone apps.\n\nNLP is challenging\
    \ for many reasons. For example, in speech recognition, the sounds of adjacent\
    \ words blend into one another, and the computing system must also take into account\
    \ syntax (i.e., grammar), semantics (i.e., meaning), and pragmatics (i.e., purpose\
    \ or goal)—along with the many classes of ambiguity in language where words take\
    \ on different meanings in different contexts. Today, significant use of artificial\
    \ neural network methods helps to improve accuracy.\n\n**SEE ALSO** [Speech Synthesis\
    \ (1939)](#9781454933601_epub_c036_r1.xhtml#c-036), [Artificial Neural Networks\
    \ (1943)](#9781454933601_epub_c039_r1.xhtml#c-039), [Turing Test (1950)](#9781454933601_epub_c042_r1.xhtml#c-042),\
    \ [Speech Recognition (1952)](#9781454933601_epub_c045_r1.xhtml#c-045), [Machine\
    \ Learning (1959)](#9781454933601_epub_c050_r1.xhtml#c-050), [Licklider’s “Man-Computer\
    \ Symbiosis” (1960)](#9781454933601_epub_c052_r1.xhtml#c-052), [ELIZA Psychotherapist\
    \ (1964)](#9781454933601_epub_c053_r1.xhtml#c-053), [SHRDLU (1971)](#9781454933601_epub_c065_r1.xhtml#c-065),\
    \ [Paranoid PARRY (1972)](#9781454933601_epub_c066_r1.xhtml#c-066), [Watson on\
    \ *Jeopardy!* (2011)](#9781454933601_epub_c091_r1.xhtml#c-091)\n\n**The Dartmouth\
    \ Summer Research Project on Artificial Intelligence** is considered to be an\
    \ important event in the history of AI and where the term *artificial intelligence*,\
    \ selected by computer scientist John McCarthy (pictured here in 1974), started\
    \ to gain acceptance.\n\n[![](OEBPS/images/92-1.jpg)](#9781454933601_epub_cre_r1.xhtml#92-1)\
    \ \n\n# 1956\n\n# DARTMOUTH AI WORKSHOP\n\n![](OEBPS/images/L01.jpg)\n\n“In the\
    \ summer of 1956,” writes journalist Luke Dormehl, “when Elvis Presley was scandalizing\
    \ audiences with his hip gyrations . . . and President Dwight Eisenhower authorized\
    \ ‘In God we trust’ as the US national motto—AI’s first official conference took\
    \ place.” That conference—the Dartmouth Summer Research Project on Artificial\
    \ Intelligence—is where the term *artificial intelligence*, coined by computer\
    \ scientist John McCarthy (1927–2011), started to gain acceptance.\n\nThe workshop\
    \ was formally proposed by McCarthy of Dartmouth College, Marvin Minsky (1927–2016)\
    \ of Harvard University, Nathaniel Rochester (1919–2001) of IBM, and Claude Shannon\
    \ (1916–2001) of Bell Telephone Laboratories, as follows: “We propose that a 2-month,\
    \ 10-man study of artificial intelligence be carried out during the summer. .\
    \ . . \\[We conjecture\\] that every aspect of learning or any other feature of\
    \ intelligence can in principle be so precisely described that a machine can be\
    \ made to simulate it. An attempt will be made to find how to make machines use\
    \ language, form abstractions and concepts, solve kinds of problems now reserved\
    \ for humans, and improve themselves. We think that a significant advance can\
    \ be made . . . if a carefully selected group of scientists work on it together\
    \ for a summer.” The proposal also made specific mention of several other key\
    \ areas of consideration, including “neuron nets” and “randomness and creativity.”"
