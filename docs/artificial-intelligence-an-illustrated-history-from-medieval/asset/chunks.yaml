  raw: "If AI methods and models are already being used to help determine who gets\
    \ hired for a job, who we date, who makes parole, who is likely to develop a psychiatric\
    \ disorder, and how to autonomously drive cars and drones, then how much control\
    \ over our lives will we give to AIs of the future? As they increasingly make\
    \ decisions for us, will AI units be easily *fooled* into making critical errors?\
    \ How can AI researchers better understand why some machine-learning algorithms\
    \ and architectures are more effective than others, while also making it easier\
    \ for AI researchers to reproduce one another’s results and experiments?\n\nMoreover,\
    \ how can we ensure that AI-driven devices behave in an ethical manner, and will\
    \ machines ever have mental states and feelings in the same sense that humans\
    \ do? Surely, AI machines will help us think new thoughts and dream new dreams,\
    \ functioning as prosthetics for our feeble brains. For me, AI cultivates a perpetual\
    \ state of wonder about the limits of thought, the future of humanity, and our\
    \ place in the vast space-time landscape that we call home.\n\n**Tic-tac-toe can\
    \ be made more challenging** for humans and AI-based machines by extending the\
    \ 3 × 3 game to higher dimensions and array sizes, such as in this 4 × 4 × 4 version,\
    \ and by introducing gravity effects, as each piece slides to the bottom available\
    \ position.\n\n![](OEBPS/images/xii-1.jpg)\n\n# c. 1300 BC\n\n# TIC-TAC-TOE\n\n\
    ![](OEBPS/images/L01.jpg)\n\nArcheologists can trace what appears to be “three-in-a-row\
    \ games” to around 1300 BCE in ancient Egypt. For tic-tac-toe (TTT), two players,\
    \ O and X, take turns marking their symbols in the spaces of a 3 × 3 grid. The\
    \ player who first places three of his own marks in a horizontal, vertical, or\
    \ diagonal row wins.\n\nWe’re interested in TTT for this book because it has often\
    \ been used as an introduction to aspects of artificial intelligence and computer\
    \ programming, due to the simplicity of searching its game trees (where nodes\
    \ are positions in a game, and edges represent moves). TTT is a “perfect information”\
    \ game, as all players know all the moves that have taken place. It is also a\
    \ sequential game without randomization, with the players taking turns and avoiding\
    \ the use of dice.\n\nTTT may be considered an “atom” upon which the molecules\
    \ of more advanced games of position were built through the centuries. With the\
    \ slightest of variations and extensions, the simple game of TTT becomes a fantastic\
    \ challenge, requiring significant time to master. Mathematicians and puzzle aficionados\
    \ have extended TTT to larger boards, higher dimensions, and strange playing surfaces\
    \ such as rectangular or square boards connected at their edges to form a torus\
    \ (doughnut shape) or Klein bottle (a surface with just one side).\n\nConsider\
    \ some TTT curiosities. Players can place their *X*s and *O*s to fill a TTT board\
    \ in 362,880 (or 9!) ways. However, there are 255,168 possible games in TTT when\
    \ considering all possible games that end in 5, 6, 7, 8, and 9 moves. In 1960,\
    \ the MENACE AI system (a contraption of colored beads and matchboxes) learned\
    \ to play TTT using reinforcement learning. In the early 1980s, computer geniuses\
    \ Danny Hillis, Brian Silverman, and friends built a Tinkertoy^® computer that\
    \ played TTT from 10,000 Tinkertoy pieces. In 1998, researchers and students at\
    \ the University of Toronto created a robot to play three-dimensional (4 × 4 ×\
    \ 4) TTT with a human.\n\n**SEE ALSO** [The Consciousness Mill (1714)](#9781454933601_epub_c015_r1.xhtml#c-015),\
    \ [Reinforcement Learning (1951)](#9781454933601_epub_c044_r1.xhtml#c-044), [Connect\
    \ Four (1988)](#9781454933601_epub_c077_r1.xhtml#c-077), [Othello (1997)](#9781454933601_epub_c083_r1.xhtml#c-083),\
    \ [Solving the Game of Awari (2002)](#9781454933601_epub_c087_r1.xhtml#c-087)\n\
    \n**A depiction of Talos** from Thomas Bulfinch’s *Stories of Gods and Heroes*\
    \ (1920), drawn by English artist Sybil Tawse (1886–1971).\n\n[![](OEBPS/images/2-1.jpg)](#9781454933601_epub_cre_r1.xhtml#2-1)\
    \ \n\n# c. 400 BCE\n\n# TALOS\n\n![](OEBPS/images/L01.jpg)\n\n“Many people are\
    \ familiar with the figure of Talos,” writes author Brian Haughton, “through his\
    \ depiction as a bronze giant in the 1963 movie *Jason and the Argonauts*. . .\
    \ . But where did the idea for Talos come from, and could he have been the first\
    \ robot in history?”\n\nAccording to Greek mythology, Talos was a huge bronze\
    \ automaton whose job was to protect Europa—the mother of King Minos of Crete—from\
    \ invaders, pirates, and other enemies. Talos was programmed to patrol the island’s\
    \ shores by circling the entirety of Crete three times each day. One way of deterring\
    \ foes involved throwing huge boulders down on them. At other times, the giant\
    \ robot would leap into a fire until he glowed with heat, then hug the enemy’s\
    \ body to burn him to death. Talos is sometimes depicted as a winged creature,\
    \ as was discovered on coins in Phaistos, Crete, from around 300 BCE; other vase\
    \ paintings date to around 400 BCE.\n\nVarious explanations have been given regarding\
    \ the creation and death of Talos. In one myth, he is made by Hephaestus—the Greek\
    \ god of metalworking, metallurgy, fire, blacksmiths, and other artisans—at the\
    \ request of Zeus. Because Talos was an automaton, his internal structure was\
    \ less complex than a human’s; in fact, Talos had just one vein that ran from\
    \ his neck to his ankle. The vein was sealed and protected from leaking by a bronze\
    \ nail at the ankle. According to one legend, the sorceress Medea drove him mad\
    \ with death spirits (Keres) and caused him to dislodge the nail. The ichor (i.e.,\
    \ divine blood) then gushed out of him “like molten lead,” killing him.\n\nTalos\
    \ is just one example showing how the ancient Greeks thought about robots and\
    \ other automata. For another, consider the work of mathematician Archytas (428–347\
    \ BCE), who may have designed and built an automaton driven by steam in the form\
    \ of a self-propelled flying bird called “The Pigeon.”\n\n**SEE ALSO** [Ktesibios’s\
    \ Water Clock (c. 250 BCE)](#9781454933601_epub_c004_r1.xhtml#c-004), [Lancelot’s\
    \ Copper Knights (c. 1220)](#9781454933601_epub_c008_r1.xhtml#c-008), [Golem (1580)](#9781454933601_epub_c013_r1.xhtml#c-013),\
    \ [*Frankenstein* (1818)](#9781454933601_epub_c020_r1.xhtml#c-020)\n\n**This impressive\
    \ bust of Aristotle** is a Roman copy of a bronze original by Greek sculptor Lysippos,\
    \ who lived in the fourth century BCE.\n\n[![](OEBPS/images/4-1.jpg)](#9781454933601_epub_cre_r1.xhtml#4-1)\
    \ \n\n# c. 350 BCE\n\n# ARISTOTLE’S *ORGANON*\n\n![](OEBPS/images/L01.jpg)\n\n\
    The Greek philosopher Aristotle (384–322 BCE) touched upon several influential\
    \ topics during his life that are still of interest to AI researchers today. In\
    \ his book *Politics*, Aristotle speculated that automatons could someday replace\
    \ human slaves: “There is only one condition in which we can imagine managers\
    \ not needing subordinates, and masters not needing slaves. This condition would\
    \ be that each instrument could do its own work, at the word of command or by\
    \ intelligent anticipation, like the statues of Daedalus or the tripods made by\
    \ Hephaestus, of which Homer relates that ‘of their own motion they entered the\
    \ conclave of Gods on Olympus,’ as if a shuttle should weave of itself, and a\
    \ plectrum should do its own harp playing.”"
