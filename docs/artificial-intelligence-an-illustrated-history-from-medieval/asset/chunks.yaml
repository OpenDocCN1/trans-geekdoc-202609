  trans: "\n\n凭借惊人的洞察力，巴特勒预见到了机器对人类努力成果的逐渐接管：“我们正变得越来越顺从它们；每天都有越来越多的人被束缚为奴隶照顾它们 .\
    \ . . 将毕生的精力投入到机械生命的开发中。 . . . 总有一天会到来的，机器将对世界及其居民拥有真正的统治地位。 . . .”\n\n在《机器之书》（The\
    \ Book of the Machines，1872）中，巴特勒思考软体动物似乎并没有多少意识，但人类意识却进化了。同样，机器也将发展出意识，他要求我们“反思机器在过去几百年中取得的惊人进步，并注意动植物界的进展是多么缓慢。组织化程度更高的机器与其说是昨天的产物，倒不如说是五分钟前的产物……”\n\
    \n巴特勒的思想在 20 世纪得到了共鸣，控制论之父诺伯特·维纳纳（Norbert Wiener，1894–1964）写道：“如果我们朝着制造能够学习且行为随经验改变的机器的方向努力，我们就必须面对事实：我们赋予机器的每一程度独立性，都是对我们意愿的一种可能的违抗。瓶里的魔神不会情愿回到瓶子里，我们也没有理由期望他们对我们抱好感。”\n\
    \n随着 21 世纪的技术如今已交织在人类生活的各个方面，巴特勒和维纳对人工智能的这些思考似乎都格外具有预言性。\n\n**另见** 霍布斯的《利维坦》(Hobbes’s\
    \ *Leviathan* (1651)), *人的使用》(The Human Use of Human Beings (1950)), 智能爆炸 (Intelligence\
    \ Explosion (1965)), 不漏水的“AI 黑盒”(Leakproof “AI Box” (1993)), 回形针极大化者灾难 (Paperclip\
    \ Maximizer Catastrophe (2003))\n\n由爱德华·S·埃利斯（Edward S. Ellis，1868 年）创作的《草原蒸汽人》（Cover\
    \ of *The Steam Man of the Prairies*）封面。\n\n![](img/#9781454933601_epub_cre_r1.xhtml#50-1)\
    \ \n\n# 1868\n# *草原蒸汽人 (THE STEAM MAN OF THE PRAIRIES)*\n\n![](img/L01.jpg)\n\n\
    美国“廉小说”（dime novels，廉价平装书）中对机械人的早期描写之一出现在出生于俄亥州的作家爱德华·S·埃利斯（Edward S. Ellis，1840–1916）创作的《草原蒸汽人》中，该书在\
    \ 1868 年至 1904 年间多次重版。在埃利斯的小说中，名叫约翰尼·布莱纳德的青少年发明家创造了一个高十英尺的机器人，并带着它在中西部地区。蒸汽人戴着大礼帽，拉着板车，用钢制的腿行走或跑步，速度可达每小时六十英里。约翰尼、他的朋友和他的机器人在草原上冒险，追逐印第安人并协助金矿开采。埃利斯描述蒸汽人“极其肥胖，肿胀到像议员那样的比例，这与它惊人的身高相比，并不不协调。机器人长得肥胖是为了为其所有的机械装置留出足够的空间。此外，‘脸是铁制成的\
    \ . . . 有双可怕的眼睛和一个巨大的嘴巴。步伐很自然，除了跑步时，那时身形笔直的姿态显得与人类不同。’” 这种蒸汽人的灵感源于 1868 年由美国发明家扎多克·P·德德里克（Zadoc\
    \ P. Dederick）和艾萨克·格拉斯（Isaac Grass）专利的一种真实的蒸汽动力类人机器人。这一迷人的系列也是“爱迪生式”（Edisonade）故事流的早期例子，这类故事通常描写一个年轻男性发明家利用他的智慧逃离危险。在描写冒险时，他在探索生活在边缘的人们，就像许多设定在太阳系深处的现代故事一样……埃利斯的作品是观察时代态度的一个良好窗口，并为当时人们如何看待未来提供了一些背景。\n\
    \n**另见** *电气鲍勃的黑色大鸵鸟)](#9781454933601_epub_c028_r1.xhtml#c-028), 滴答 (Tik-Tok (1907)),\
    \ 摩托人埃莱克罗 (Elektro the Moto-Man (1939))\n\n在汉诺诺塔游戏中，玩家可以一次移动一个盘子到另一个柱子上，方法是移除任何堆栈顶部的盘子并将其放在任何其他堆栈的顶部。盘子不能放在较小的盘子之上。\n\
    \n![](img/9781454933601_epub_cre_r1.xhtml#52-1)\n\n# 1883\n# 汉诺塔 (TOWER OF HANOI)\n\
    \n![](img/L01.jpg)\n\n汉诺塔自法国数学家爱德华·卢卡斯（Édouard Lucas，1842–1891）在 1883 年发明并作为玩具出售以来一直令世界着迷。这个数学谜由不同尺寸的盘子组成，最初堆在一个柱子上。在玩这个游戏时，可以一次移动一个盘子到另一个柱子上，即移除任何堆栈顶部的盘子并将其放在任何其他堆栈的顶部。盘子不能放在较小的盘子之上。据说原始游戏灵感来自一座古老的印度寺庙，婆罗门僧侣在其中不断移动\
    \ 64 个金色盘子。根据传说，当谜题的最后一步完成时，世界将会结束。如果僧侣们以每秒移动一个盘子的速度，那么`2⁶⁴ - 1` 次 `18,446,744,073,709,551,615`\
    \ 次大约需要 585 亿年——约为宇宙年龄的 42 倍。\n\n"
- fmt: "\nDuring the course of the story, Electric Bob reasons that a large electronic\
    \ ostrich could carry him and his friends across a rocky desert in the American\
    \ Southwest, while avoiding snakes. Bob carefully studies anatomy and physiology\
    \ from live ostrich specimens and designs the perfect conveyance: “The ostrich\
    \ towered thirty feet in the air to the top of his great head. The center of the\
    \ body was twenty feet from the ground, the neck was about eight feet long. .\
    \ . . The power is furnished by powerful storage batteries placed in the body\
    \ just between the thighs of the bird, and are capable of giving us a speed of\
    \ twenty to forty miles an hour—depending on the nature of the ground we travel\
    \ over.”\n\nThe novel is notable for the engineering details it provides to readers.\
    \ For example, it breaks down all the various materials and components of the\
    \ mechanical bird, including its hollow steel legs and the bulletproof aluminum\
    \ wings and tail. Bob continues: “Here are the water tank, storage placed for\
    \ provision, ammunition, etc., and here is our machine gun . . . \\[which\\] consists\
    \ of an enlarged revolved cylinder, holding twenty-five Winchester rifle cartridges,\
    \ and a short, heavy barrel, and is fired by turning this crank.”\n\nAlthough\
    \ such fictional treatments do not really address philosophical issues revolving\
    \ around the creation of such mechanical life forms, Edisonades like this one\
    \ provide a glimpse into the thinking of the time, along with all its prejudices,\
    \ hopes, and aspirations.\n\n**SEE ALSO** [de Vaucanson’s Duck Automaton (1738)](#9781454933601_epub_c017_r1.xhtml#c-017),\
    \ [*The Steam Man of the Prairies* (1868)](#9781454933601_epub_c026_r1.xhtml#c-026),\
    \ [Tik-Tok (1907)](#9781454933601_epub_c030_r1.xhtml#c-030)\n\n**Nikola Tesla’s\
    \ 1898 patent** for his wirelessly controlled robotic boat, which contained a\
    \ battery, motor-driven propeller, rudder, and lights. He believed that intelligent\
    \ “teleautomatons” would be created in the future, causing a revolution in society.\n\
    \n[![](OEBPS/images/56-1.jpg)](#9781454933601_epub_cre_r1.xhtml#56-1) \n\n# 1898\n\
    \n# TESLA’S “BORROWED MIND”\n\n![](OEBPS/images/L01.jpg)\n\nIn 1898, Serbian-American\
    \ inventor Nikola Tesla (1856–1943) gave a remarkable demonstration of a radio-controlled\
    \ boat, which he maneuvered in front of awestruck spectators, some of whom thought\
    \ magic, telepathy, or a trained monkey might be involved. When a *New York Times*\
    \ reporter learned of this world’s-first radio-controlled vessel, he suggested\
    \ that Tesla’s invention could serve as a weapon of war, carrying dynamite. Tesla\
    \ told the reporter to think beyond wireless torpedoes and realize that this represented\
    \ the first of a race of automatons (the word *robot* was not yet used)—mechanical\
    \ men that would perform the laborious work of the human race.\n\nIn his 1900\
    \ essay “The Problem of Increasing Human Energy,” Tesla wrote about his aquatic\
    \ automatons: “The knowledge, experience, judgment—the mind, so to speak—of the\
    \ distant operator was embodied in that machine, which was thus enabled to move\
    \ and to perform all its operations with reason and intelligence. . . . The automatons\
    \ so far constructed had ‘borrowed minds,’ so to speak, as each merely formed\
    \ part of the distant operator.”\n\nTesla went even further to suggest that “an\
    \ automaton may be contrived that will have its ‘own mind’ \\[and be\\] able,\
    \ independent of any operator, left entirely to itself, to perform, in response\
    \ to external influences affecting its sensitive organs, a great variety of acts\
    \ and operations as if it had intelligence.”\n\nTesla is often considered a great\
    \ prophet of our modern technological age, where realistic androids (i.e., humanoid\
    \ robots) like Nadine and Sophia baffle spectators with their ability to carry\
    \ on conversations. In fact, Tesla believed that humans were mere automatons that\
    \ responded to external stimuli and thought and acted accordingly, and among his\
    \ grand ideas was the construction of “an automaton which would mechanically represent\
    \ me, and which would respond, as I do myself, but, of course, in a much more\
    \ primitive manner, to external influences. Such an automaton evidently had to\
    \ have motive power, organs for locomotion, directive organs, and one or more\
    \ sensitive organs so adapted as to be excited by external stimuli. . . . Whether\
    \ the automaton be of flesh and bone, or of wood and steel, it mattered little,\
    \ provided it could perform all the duties required of it like an intelligent\
    \ being.”\n\n**SEE ALSO** [Lethal Military Robots (1942)](#9781454933601_epub_c038_r1.xhtml#c-038),\
    \ [*The Human Use of Human Beings* (1950)](#9781454933601_epub_c043_r1.xhtml#c-043),\
    \ [Autonomous Vehicles (1984)](#9781454933601_epub_c072_r1.xhtml#c-072)\n\n**Cover\
    \ of *Tik-Tok of Oz*** by L. Frank Baum, 1914, illustrated by John R. Neill (1877–1943).\n\
    \n[![](OEBPS/images/58-1.jpg)](#9781454933601_epub_cre_r1.xhtml#58-1) \n\n# 1907\n\
    \n# TIK-TOK\n\n![](OEBPS/images/L01.jpg)\n\nWhen we study artificial intelligence,\
    \ “we are immediately confronted with the most fundamental inquiries into the\
    \ nature of life, death, sex, work, and the mechanisms of the mind,” write authors\
    \ Paul Abrahm and Stuart Kenter, “. . . a large order requiring exhausting pilgrimages\
    \ into literature, philosophy, and an impressive array of scientific and technical\
    \ realms.” One of the earliest thinking machines in literature to raise questions\
    \ regarding the fine line between machines and people is Tik-Tok, an intelligent\
    \ copper robot introduced in the 1907 novel *Ozma of Oz* by American author L.\
    \ Frank Baum (1856–1919)*.* To power the clockwork robot, someone must periodically\
    \ wind up his three clockwork springs that separately energize his thoughts, actions,\
    \ or speaking. For example, it is possible to energize his thoughts but not his\
    \ actions or speech, creating an isolated “AI in a Box.” Or his speech may be\
    \ energized, but not his thoughts, allowing him to create crude vocal output but\
    \ not adequate natural-processing facilities. Even when fully activated, his language-processing\
    \ modules are not entirely natural, as evidenced by his monotonous-sounding voice\
    \ and strict interpretation of many questions and commands. According to Baum,\
    \ Tik-Tok “does everything but live” and feels no emotions. When punished with\
    \ whips, Tik-Tok is not harmed, as the whipping kept his copper body “well polished.”\n\
    \nTik-Tok realizes his place in the universe. For example, when thanked for his\
    \ kindness, he replies “I am only a machine. I cannot be kind any more than I\
    \ can be sorry or glad.” Though the novel appears to be targeted to a youthful\
    \ readership, Baum makes us wonder about the future of AI. Is emotion the main\
    \ differentiator between humans and machines? To what degree do literature and\
    \ movies shape AI designs and the limitations we place on thinking machines?\n\
    \n“Cyborgs, robots and other mechanical beings are key figures for understanding\
    \ the technophilic and technophobic dreams of a century,” writes Professor Alex\
    \ Goody, “embodying fears about technological encroachment, suggesting to some\
    \ the chance for technological transcendence, and challenging the idea of the\
    \ individual, differentiated, human subject.”\n\n**SEE ALSO** [Lancelot’s Copper\
    \ Knights (c.1220)](#9781454933601_epub_c008_r1.xhtml#c-008), [*The Steam Man\
    \ of the Prairies* (1868)](#9781454933601_epub_c026_r1.xhtml#c-026), [Asimov’s\
    \ Three Laws of Robotics (1942)](#9781454933601_epub_c037_r1.xhtml#c-037), [Natural\
    \ Language Processing (1954)](#9781454933601_epub_c046_r1.xhtml#c-046), [Leakproof\
    \ “AI Box” (1993)](#9781454933601_epub_c079_r1.xhtml#c-079)\n\n**Alan Turing wrote**\
    \ that humans would not be irreverently usurping God’s power of creating souls\
    \ when we someday create advanced thinking machines—any more than we do when we\
    \ produce children.\n"
  raw: "During the course of the story, Electric Bob reasons that a large electronic\
    \ ostrich could carry him and his friends across a rocky desert in the American\
    \ Southwest, while avoiding snakes. Bob carefully studies anatomy and physiology\
    \ from live ostrich specimens and designs the perfect conveyance: “The ostrich\
    \ towered thirty feet in the air to the top of his great head. The center of the\
    \ body was twenty feet from the ground, the neck was about eight feet long. .\
    \ . . The power is furnished by powerful storage batteries placed in the body\
    \ just between the thighs of the bird, and are capable of giving us a speed of\
    \ twenty to forty miles an hour—depending on the nature of the ground we travel\
    \ over.”\n\nThe novel is notable for the engineering details it provides to readers.\
    \ For example, it breaks down all the various materials and components of the\
    \ mechanical bird, including its hollow steel legs and the bulletproof aluminum\
    \ wings and tail. Bob continues: “Here are the water tank, storage placed for\
    \ provision, ammunition, etc., and here is our machine gun . . . \\[which\\] consists\
    \ of an enlarged revolved cylinder, holding twenty-five Winchester rifle cartridges,\
    \ and a short, heavy barrel, and is fired by turning this crank.”\n\nAlthough\
    \ such fictional treatments do not really address philosophical issues revolving\
    \ around the creation of such mechanical life forms, Edisonades like this one\
    \ provide a glimpse into the thinking of the time, along with all its prejudices,\
    \ hopes, and aspirations.\n\n**SEE ALSO** [de Vaucanson’s Duck Automaton (1738)](#9781454933601_epub_c017_r1.xhtml#c-017),\
    \ [*The Steam Man of the Prairies* (1868)](#9781454933601_epub_c026_r1.xhtml#c-026),\
