- fmt: "\n## SEE ALSO\n[TicTac-Toe (c. 1300 BCE)](#9781454933601_epub_c001_r1.xhtml#c-001),\
    \ [Mastermind (1970)](#9781454933601_epub_c063_r1.xhtml#c-063), [Backgammon Champion\
    \ Defeated (1979)](#9781454933601_epub_c069_r1.xhtml#c-069), [Connect Four (1988)](#9781454933601_epub_c077_r1.xhtml#c-077),\
    \ [Checkers and AI (1994)](#9781454933601_epub_c080_r1.xhtml#c-080), [Othello\
    \ (1997)](#9781454933601_epub_c083_r1.xhtml#c-083)\n\nModified versions of robotic\
    \ vacuum cleaners have been hacked by hobbyists to alter their functionality,\
    \ causing the robots to map rooms, draw Spirograph^®\\-like patterns, battle one\
    \ another, perform surveillance with cameras, and more.\n\n[![](OEBPS/images/174-1.jpg)](#9781454933601_epub_cre_r1.xhtml#174-1)\
    \ \n\n# 2002: ROOMBA\n\n![](OEBPS/images/L01.jpg)\n\nA year after the Roomba^®\
    \ robotic vacuum cleaner was introduced to the world by iRobot Corporation, journalist\
    \ Monte Reel wrote: “How did it happen that the robotic revolution is kicking\
    \ off with the Roomba, an automated floor vacuum cleaner that will mesmerize—or\
    \ maybe terrify—your pet cat? It was a fortuitous meeting of brain power, ambition,\
    \ and a distaste for housework on the part of iRobot engineers, whose backgrounds\
    \ range from artificial-intelligence research to the design of unmanned extraterrestrial\
    \ vehicles.”\n\nThe Roomba autonomic vacuum cleaner, which appeared on the market\
    \ in 2002, contains various sensors that enable it to detect dirt on the floor,\
    \ sense stairways that might cause it to fall, and change its travel direction\
    \ when encountering objects. The 900 series also featured a camera that helped\
    \ the navigation software ensure that the device efficiently covered the floor\
    \ area. When the battery in the Roomba is low, the vacuum seeks a charger by using\
    \ its infrared beacons. Acoustic dirt sensors help it detect certain kinds of\
    \ dirty spots that might need special attention. In the past, the Roomba has relied\
    \ on spiral cleaning paths, random walks, and other methods for covering a floor.\n\
    \nA variant of the LISP programming language was used to write much of the software\
    \ for Roomba. Today, various hackers enjoy modifying the device, using its Roomba\
    \ Open Interface (`ROI`) for other purposes, like turning the Roomba into a painter\
    \ or using it for surveillance.\n\nThe Roomba is a representative of a wider class\
    \ of domestic robots used for household chores. Of course, as these devices become\
    \ more sophisticated, privacy concerns will arise. Already, debates have raged\
    \ regarding the maps of a user’s home that iRobot could conceivably share with\
    \ any businesses interested in estimating aspects of a user’s home or lifestyle,\
    \ and perhaps the police could even interrogate such robots during crime investigations.\n\
    \n## SEE ALSO\n[Shakey the Robot (1966)](#9781454933601_epub_c059_r1.xhtml#c-059),\
    \ [Autonomous Vehicles (1984)](#9781454933601_epub_c072_r1.xhtml#c-072), [ASIMO\
    \ and Friends (2000)](#9781454933601_epub_c085_r1.xhtml#c-085), [AI on Mars (2015)](#9781454933601_epub_c094_r1.xhtml#c-094)\n\
    \nEven if programmed with a beneficent task, such as efficiently manufacturing\
    \ paperclips, what if the AI then decided to convert as much of the planet as\
    \ possible into a paperclip manufacturing facility?\n\n[![](OEBPS/images/176-1.jpg)](#9781454933601_epub_cre_r1.xhtml#176-1)\
    \ \n\n# 2003: PAPERCLIP MAXIMIZER CATASTROPHE\n\n![](OEBPS/images/L01.jpg)\n\n\
    Even if highly intelligent and capable AIs are given useful goals, it is nevertheless\
    \ possible to have dangerous results in the future. One famous example, discussed\
    \ in 2003 by philosopher and futurist Nick Bostrom, is the horror of the Paperclip\
    \ Maximizer. Imagine a future in which an AI system supervises a set of factories\
    \ producing paperclips. The AI is given a mission of producing as many paperclips\
    \ as possible. If the AI is not sufficiently constrained, one might imagine that\
    \ it could optimize its goal, first by operating the factories at maximum efficiency,\
    \ and then devoting more and more resources to the task until vast regions of\
    \ land and more factories were devoted to making paperclips. Eventually, all the\
    \ available resources on Earth could be converted to this task, followed by all\
    \ the relevant matter in the Solar System, turning everything into paperclips.\n\
    \nAlthough this scenario may sound implausible, it is intended to focus on AIs\
    \ may not have human motives. Another famous example, attributed to Marvin Minsky,\
    \ is the `Riemann` hypothesis, in which AIs could prove dangerous. \n\n## SEE\
    \ ALSO\n[\"Darwin among the Machines” (1863)](#9781454933601_epub_c025_r1.xhtml#c-025),\
    \ [Intelligence Explosion (1965)](#9781454933601_epub_c055_r1.xhtml#c-055), [Leakproof\
    \ “AI Box” (1993)](#9781454933601_epub_c079_r1.xhtml#c-079)\n\nIn Scrabble, each\
    \ tile has a single letter, which is annotated with its value in the range 1-10,\
    \ based on its frequency of use in the English language. For example, vowels are\
    \ worth one point.\n\n[![](OEBPS/images/178-1.jpg)](#9781454933601_epub_cre_r1.xhtml#178-1)\
    \ \n\n# 2006: QUACKLE’S SCRABBLE WIN\n\n![](OEBPS/images/L01.jpg)\n\n“Chess had\
    \ its Deep Blue,” writes technology journalist Mark Anderson. *Jeopardy!* had\
    \ its Watson. Baseball has its sabermetrics, as chronicled in the hit book and\
    \ film *Moneyball*. In each game, data mining has upended the field of play.”\
    \ An exciting development involving AI applied to word games occurred in 2006,\
    \ when the program Quackle defeated former world champion David Boys at Scrabble^®\
    \ in a tournament held in Toronto, Canada. When Boys lost three games out of five,\
    \ he insisted “It’s still better to be a human than to be a computer.”\n\nThe\
    \ Scrabble game was invented in 1938 by American architect Alfred Butts (1899–1993).\
    \ When playing Scrabble, opponents place tiles on a game board consisting of a\
    \ 15 × 15 array of squares. When playing the English version, each tile has a\
    \ single letter, which is annotated with its value in the range 1-10, based on\
    \ its frequency of use in the English language. For example, vowels are worth\
    \ one point, whereas *Q* and *Z* are worth 10 points.\n\nThe game is actually\
    \ quite complex, involving more than just knowledge of words in a language. For\
    \ example, strategy may involve anticipating what letters are still to be drawn\
    \ as well as the utility of placing tiles on special squares on the board that\
    \ may increase the tile’s score. Scrabble is considered a game of imperfect information,\
    \ like poker, since an opponent’s available tiles are hidden from view.\n"
