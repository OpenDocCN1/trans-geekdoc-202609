    # 1818

    # 弗兰肯斯坦


    ![](img/L01.jpg)


    “《弗兰肯斯坦》写于第一次工业革命期间，”世界经济论坛首席人力资源官保罗·加洛写道，“那是一个发生剧变的时代，引发了许多人的困惑和焦虑。它对人类与技术之间的关系提出了深层的问题：我们是否正在创造一个我们无法控制的怪物？我们是否正在丧失人性、同情心，以及感知共情和情感的能力？”


    某种特种人工智能的危险性是玛丽·谢莱（1797–1851）创作的小说《弗兰肯斯坦：或现代的普罗米修斯》（1818 年）中的一个核心主题。在小说中，科学家维克多·弗兰肯斯坦从屠宰场和墓地获取尸体，为了用各种部位构造出一个生物，然后他用“生命之火花”赋予它生命。与此同时，他将自己的创造视为一次实现永生的实验：“生命和死亡对我来说似乎是理想的边界，我应该首先突破它们，向我们黑暗的世界倾注一股光流。一个新物种将作为它的创造者来祝福我。……我想，如果我能赋予这些无生命的物质以活力，我或许……在死亡显然已将身体交给腐朽的地方重生生命。”


    当玛丽·谢莱在十九岁时完成她的小说时，欧洲人对电力在生物学中的作用以及死亡组织复活的可能性深感着迷。基本的故构思是在梦中出现在她海中的。事实是，意大利物理学家乔瓦·阿尔迪尼（1762–1833）曾在
    1803 年左右在伦敦参加了多次通过电击使人体复活的公开尝试。


    死亡和毁灭在小说中无处不在，许多角色都走向了终结。特别是，维克多摧毁了为他的怪物制作的未完成女性伴侣，而那个怪物（它从未真正被称为“弗兰肯斯坦”）杀死了科学家的妻子伊莉莎白。在小说结束时，维克多追随他的创造物到了北极，维克多死在那里，而怪物发誓要在自己的葬礼火堆上自杀。


    记者丹尼尔·达达里指出：“《弗兰肯斯坦》依赖于一种观点，即人类天生会拒绝不自然的人工智能。这很大程度上归于弗兰肯斯坦怪物极其奇特的外表。……但当人工智能以更具吸引力的包装、一种具有真实实用价值的形式出现时，又呢？”


    另见 塔尔罗斯（约公元前 400 年）, 魔像（1580）, 草原蒸汽人（1868）, 罗苏姆通用机器人（1920）


    电羊。“电羊”指的是斯考特·德拉夫斯开发的协作抽象艺术作品。更受欢迎的羊根据带有变异和交叉的遗传算法活得更久并繁殖。


    ![](img/#9781454933601_epub_cre_r1.xhtml#40-1)


    # 1821

    # 计算创造力


    ![](img/L01.jpg)


    “作为一个社会，我们嫉妒创造力，”金德斯哥尔学院计算小组的西蒙·科尔顿和格拉因特·斯金斯写道，“创意人才以及他们对文化进步的贡献是受高度重视的。此外，人的创造性行为利用了一整套智能能力，因此模拟这种行为对人工智能来说是一项严峻的技术挑战。”


    某种特种人工智能的危险性是玛丽·谢莱小说《弗兰肯斯坦：或现代的普罗米修斯》（1818 年）中的一个主题。模拟这种行为对人工智能来说是一项严峻的技术挑战。正如如此，我们认为计算创造力（CC）在人工智能领域是一个广阔的边界。


    “计算创造力”（或 CC）有多种含义。在这里，指的是利用计算机或机器模拟创造力。例如，生成对抗网络（GANs）可以生成逼真的脸部、鸟类和室内设计。


    为了作为 CC 的一个早期例子，请考虑 1821 年迪特里希·温尔基（1777–1826）发明的管风琴，这是一种可以产生无限音乐主题变化的自动乐器。它有两个执行随机选择的滚筒。温尔基说，如果每次表演持续五分钟，管风琴需要
    138 万年才能产生所有音乐组合！


    另见 拉蒙·鲁尔《大的术》（约 1305 年）, 拉加多写作机（1726）, 控制论奇点（1968）, 遗传算法（1975）, 计算机艺术与深梦（2015）


    查尔斯·巴贝奇差机的部分模型，现位于伦敦科学博物馆。


    ![](img/#9781454933601_epub_cre_r1.xhtml#42-1)


    # 1822

    # 巴贝奇的机械计算机


    ![](img/L01.jpg)


    查尔斯·巴贝奇（1791–1871）是一位英国分析数学家、统计学家和发明家。他在 1819 年曾见过的“机械土耳其”，当时这个机械人在英国巡演期间并击败了人类棋手。当然，巴贝奇一定知道“土耳其”是某种骗局，但许多人认为，这个类人机器人启发了巴贝奇去思考其他更实用的思考机器，这可以通往人工智能之旅的早期一步。


    巴贝奇通常被认为是计算机“前史”中最重要的数学家兼工程师。特别是，他因构思了一种巨大的手摇机械计算器而闻名，这是现代计算机的早期先驱。巴贝奇认为该设备在制作数学表格时最有用，但他担心那些从它的
    31 个金属输出轮盘上转录结果的人类会犯错。今天我们意识到，巴贝奇领先了他的时代一个世纪，而那个时代的政治和技术无法支撑他的宏伟梦想。


    '
- fmt: '

    # The Foundations of Logic and Computing


    ## The Early Pioneers

    Babbage’s `Difference Engine`, begun in 1822 but never completed, was designed
    to compute values of polynomial functions using about 25,000 parts. He also had
    plans to create a more general-purpose computer, the `Analytical Engine`, which
    could be programmed using punch cards and had separate areas for storage. Estimates
    suggest an `Analytical Engine` capable of storing one thousand digits would be
    over hundred feet in length.


    Ada Lovelace (1815–1852), daughter of the English poet Lord Byron, gave specifications
    for a program for the `Analytical Engine`. Although many consider Ada to be the
    first programmer, she provided assistance to Babbage.


    ## The Birth of Boolean Algebra

    In 1990, novelists William Gibson and Bruce Sterling wrote *Difference Engine*,
    which asked readers to imagine the consequences of Babbage’s mechanical computers
    becoming available to Victorian society. Published in 1844, well before the invention
    of the lightbulb, the story centers on the life of genius Owen Warland, who works
    in a watch shop. Owen is a sensitive young man who is secretly in love with Annie
    Hovenden, the shopkeeper’s daughter, and wonders if it is possible to imitate
    the beautiful movements of Nature, as exemplified in the flight of birds or the
    activity of little animals.


    When considering Boolean algebra, George Boole wrote that one of his purposes
    was to “investigate the fundamental laws of those operations of the mind by which
    reasoning is performed.” His most influential work, published in 1854, was titled
    *An Investigation into the Laws of Thought, on which are Founded Mathematical
    Operations and Probabilities*.


    ## The Evolution of Automata

    “The Artist of the Beautiful” by Nathaniel Hawthorne (1804–1864) is the first
    robotic-insect short story, and a personal favorite for both its haunting beauty
    and questions it raises about AI and humanity’s response. “The Artist of the Beautiful”
    describes the creation of a delicate and beautiful automaton with mystical and
    lifelike qualities.


    Owen eventually succeeds in making a mechanical butterfly. The shopkeeper discovers
    an early model and almost crushes the “mechanical something, as delicate and minute
    as the system of a butterfly’s anatomy.” He screams “Owen! there is witchcraft
    in these little chains, and paddles.”


    In the closing scene of the story, Owen decides to show Annie a new version he
    has created:

    ```

    A butterfly fluttered forth, and alighting on her finger’s tip, sat waving the
    ample magnificence of its purple and gold-speckled wings, as if in prelude to
    a flight. It is impossible to express by words the glory, the splendor, the delicate
    gorgeousness, which were softened into the beauty of this object. Nature’s ideal
    butterfly was here realized in all its perfection; not in the pattern of such
    insects as flit among earthly flowers, but of those which hover across the meads
    of Paradise, for child-angels and the spirits of departed infants to disport themselves.”

    ```

    “Beautiful! Beautiful!” exclaimed Annie. “Is it alive? Is it alive?” The insect
    flies into the air and flutters around Annie’s head. The story appears to have
    a sad ending for the butterfly, as it is crushed by an uncaring child into a “small
    heap of glittering fragments,” but Owen has an epiphany of sorts, realizing that
    the butterfly’s beauty is eternal.


    ## Modern Applications

    As a curious aside, in 2015, US patent `9,046,884` was granted for robotic butterflies
    that sense, respond, and move according to the emotional states of humans to help
    improve our moods.


    Approximately seventy years after Boole’s death, American Claude E. Shannon (1916–2001)
    was introduced to Boolean algebra while still a student, and he showed how Boolean
    algebra could be used to optimize the design of telephone switches.


    SEE ALSO

    - `Abacus` (c. BCE)

    - `Mechanical Turk` (1770)

    - `ENIAC` (1946)

    - `de Vaucanson’s Duck Automaton` (1738)

    - `Jaquet-Droz Automata` (1774)

    - `Tik-Tok` (1907)

    - `Spielberg’s A.I. Artificial Intelligence` (2001)

