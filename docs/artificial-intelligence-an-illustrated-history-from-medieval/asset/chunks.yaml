    根据霍布斯的观点，当人类进行推理时，个人实际上是在进行符号化的计算和操纵，这类似于加法和减法：“通过推理[思考]，我指的是`计算`。现在，计算要么是收集许多相加之物的和，要么是知道从一个物体中取出另一个物体后剩下了什么。”


    戴森问：“如果推理可以还原为算术，而算术即使在霍布斯的时代也可以通过机械完成，那么机械是否具备推理能力呢？机器会思考吗？”计算机架构师丹尼尔·希利斯对创造能够独立思考的人工智能提出了自己的推测：“对于那些恐惧人类心灵的机械化解释的人来说，我们对局部交互如何产生涌现行为的无知，为灵魂提供了一层令人安心的迷雾，可以躲在其中。尽管单个计算机和单个计算机程序正在发展人工智能的元素，但在更大的网络（或整个网络）中，我们正在开发出一种更有可能让人工智能的‘利维坦’诞生的媒介。”


    **另请阅读** 意识磨坊 (1714), “美之艺术家” (1844), “机器中的达尔文” (1863), `巨脑，或会思考的机器` (1949), `人类对人类的利用`
    (1950)


    **如果我们相信**意识是大脑中神经元和其他细胞的模式及动态相互关系的的结果，那么我们的思想、情感和记忆可能在树枝叶片的运动中，或在鸟类的群翔中得到复制。（Benjavisa
    Ruangvaree 的水彩画。）


    ![](img/#9781454933601_epub_cre_r1.xhtml#28-1)


    # 1714


    # 意识磨坊


    ![](img/L01.jpg)


    如果我们相信意识是大脑细胞及其组件的模式和动态相互关系的结果，那么我们的思想、情感和记忆可能在 Tinkertooy^®玩具的移动组合中得到复制。Tinkertoy
    的心灵需要非常大才能代表我们心灵的复杂性，但也许可以创建一个非常复杂的机制，就像研究人员用 10,000 个 Tinkertooy 做出能下跳棋的计算机一样。原则上，我们的心灵可以在叶片和树枝的运动中，或鸟类的群翔中实体化。1714
    年，德国哲学家、数学家戈特弗里德·莱布尼茨在他的著作《单子论》中，想象了一台像磨坊一样大、注入了 AI 的机器，能够思考和感受。他还意识到，如果我们能探索内部，将会发现“除了相互推挤的碎片外，没有任何用来解释感官的东西”。同样，未来可能开发出意识的
    AI 实体，即使它们不是由湿物质构成的。


    哲学家尼克·波斯特罗姆（出生于 1973 年）考虑过单个电子大脑：“大脑是一个具有特定特征的物理对象。如果我们能完全理解这些特征并学会用电子方式复制它们，那么我们的电子大脑一定可以执行与有机大脑相同的功能。如果可以在大脑上做到这一点，为什么产生的系统就不能像你一样有意识呢？”


    机器人专家汉斯·莫拉维克（出生于 1948 年）写道：“我们是模拟在一堆神经硬件上的意识实体，而意识实体只存在于对硬件运行事物的解释中。四处喷洒的并非化学信号，而是对这些信号总和的某种高层解释，这是意识区别于其他解释的唯一之处，例如美元的价值。”同样，也许你的大脑即使被分成一百个小盒子，被远距离隔开并用电线或光纤连接，仍然可以正常运作。为了更好地理解这一点，想象你的左、右半球相隔一英里，并通过人工胼胶连接。你你仍然是你，对吧？


    **另请阅读** 井字游戏（约 1300 年）, 霍布斯的《利维坦》（1651）, *利维坦*1651), 沃康森的自动鸭 (1738), 寻找灵魂 (1907),
    会思考的机器 (1949), 生活在模拟 (1967)


    **拉格多的写作机器，**由法国艺术家 J.J. 格兰维尔（1803–1847）插图，出现在《游游记》的法国译本中。


    ![](img/#9781454933601_epub_cre_r1.xhtml#30-1)


    # 1726


    # 拉格多的写作引擎


    ![](img/L01.jpg)


    《游游记》，由爱尔兰作家乔纳森·斯威夫特（1667–1745）于 1726 年出版，描述了一个可能被广泛讨论的第一个创意引擎。当游游来到虚构城市拉格多时，一位教授向他展示了一台可以产生文学、诗歌、政治、法律和神学的设备。教授解释说，通过他的发明，最无知的人只需花费低廉的价格和少量的体力劳动，就能在没有任何天才或学习支持的情况下写出书来。”


    该设备占地 20 个平方英尺，通过纤细的电线连接。瓷砖状表面覆盖着纸，上面写着他们语言的各种形态、时态和变格；但没有任何顺序。”


    游游描述了设备的运行方式：“学生们在教授命令下，每个人抓住一个固定在框架边缘的铁手；猛地一转，整个单词的布局就完全改变了。然后，他命令学生们轻声读出框架上的几行；当他们发现三四个单词可以组成句子的一部分时，就将其口述给剩下的四个抄写员……每转一次，木块就会倒过来。”


    作者埃里克·魏斯写道：“[这台机器的]目的、其显赫发明者、对公共资金的呼求以及学生对设备的操作，清楚地将其归类为人工智能的早期尝试，并导致它经常被引用为学科的典型。”现实世界中后期形式的组合、随机或人工创意包括
    Racter，这是一种为《警察的胡子是半完的》一书（1984 年出版）生成散文的计算机程序。


    **另请阅读** 卢利的《大艺术》（约 1305 年）, 计算创意 (1821), `控制论偶然发现》(1968)


    **沃康森自动鸭的流行插图，**出现在 1899 年 1 月 221 日的《科学美国人》上。虽然这里描绘的机制与实际内部结构并不相似，但箭头放置得恰当，指示了出口路线。


