    # c. 350 BCE: ARISTOTLE’S ORGANON


    ![](OEBPS/images/L01.jpg)


    The Greek philosopher Aristotle (384–322 BCE) touched upon several influential
    topics during his life that are still of interest to AI researchers today. In
    his book *Politics*, Aristotle speculated that automatons could someday replace
    human slaves: “There is only one condition in which we can imagine managers not
    needing subordinates, and masters not needing slaves. This condition would be
    that each instrument could do its own work, at the word of command or by intelligent
    anticipation, like the statues of Daedalus or the tripods made by Hephaestus,
    of which Homer relates that ‘of their own motion they entered the conclave of
    Gods on Olympus,’ as if a shuttle should weave of itself, and a plectrum should
    do its own harp playing.”

