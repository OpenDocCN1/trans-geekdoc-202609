    诺伯特·维纳（1894–1964）是富有影响力的美国数学家和哲学家，是控制论领域的关键创立者之一，该领域关注人类活动和技术许多领域中的反馈。根据 AI 专家丹尼尔·克雷维尔（Daniel
    Crevier）的，维纳认为反馈机制是“信息处理设备：它们接收信息并根据信息做出决策。维纳推测，所有的智能行为都是反馈机制的结果；或许从定义上说，智能是接收和处理信息的结果。”


    在他的著作《人类对人的利用（1950 年）](#9781454933601_epub_c043_r1.xhtml#c-043) 中，维纳思考了人类与机器合作的方式，他的愿景对于今天几乎处于持续通信状态的人们来说无疑具有适用性：“这本书的观点是，社会只能通过研究属于它的信息和通信设施来理解；在未来，人与机器之间、机器与人之间以及机器与机器之间这些信息和通信设施的发展注将发挥越来越的作用。”


