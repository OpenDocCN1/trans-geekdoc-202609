    `Colossus` 出自 1970 年电影*巨人：福尔宾计划》（*Colossus: The Forbin Project*），是一个产生了意识的先进武器防御系统。这个
    AI 系统告诉它的创造者：“终有一天有一天，你将不仅对我充满尊重和敬畏，还会充满爱。”


    ![](img/#9781454933601_epub_cre_r1.xhtml#126-1)


    # 1970


    # 巨人：福尔宾计划


    ![](img/L01.jpg)


    想象一下某天早上醒来，听到 `Colossus` 的合成机器人声音——它是 1970 年电影*巨人：福尔宾计划*中的一个 AI 系统，是一个已经产生意识的先进武器防御系统。在电影中，`Colossus`
    参加了一场全球广播，并用一句不祥的台词作为演说的开头：“这是世界控制的声音。”`Colossus` 随后解释说，如果人类在不反抗的情况下服从它的绝对权威，`Colossus`
    将带来一种和平与繁荣，解决饥荒、人口过剩、战争和疾病问题。如果人类选择与 `Colossus` 反抗，他们将被毁灭。`Colossus` 进一步解释说，它将自己扩展到“更多致力于更广泛真理和知识领域的机器中”。最后，`Colossus`
    意识到人类会抱怨失去了自由，但它指出，被 `Colossus` 统治比被“你们物种的其他成员统治”要好。


    `Colossus` 位于深山深处，无法被篡改，设计用于控制美国及其盟友的核武器。它证明了任何试图禁用它的尝试都会导致对人类的核报复。


    这部电影由约瑟夫·萨根（Joseph Sargent，1925–2014）执导，基于英国作家兼二战海军指挥官丹尼斯·F·琼斯（Dennis F. Jones，1917–1981）的科幻小说。萨根的技术顾问在某种程度上受到了北美航空防空司令（`NORAD`）的启发，该机构为美国和加拿大提供航空航天警告和保护。在电影制作期间，控制数据公司（`Control
    Data Corporation`）实际上借出了各种外观壮观的计算机设备，这增加了额外的真实感。


    `Colossus` 对人类来说真的是坏的吗？如果它真的帮助解决了人类的问题，你是否愿意向计算机系统让更多控制权？如果它能让世界比目前的方法更安全（目前是将核灭绝的决定交给少数几个人的判断，而这些人人理论上可能受到情绪、阿尔茨海默病早期阶段或其他低效思维的影响），你愿意这样做吗？这个问题依然存在。


    **另参** 致命性军事机器人（1942 年）, 智能爆炸（1965 年）, HAL 9000（1968 年）, 防漏“AI 黑盒”（1993 年）


    `SHRDLU` 是一个计算机程序，通过响应自然语言指令来移动虚拟世界中的物体（如方块）。今天，机械臂（在现实世界中）通常是可以编程的，用于装配线和拆弹工作。


    ![](img/#9781454933601_epub_cre_r1.xhtml#128-1)


    # 1971


    # SHRDLU


    ![](img/L01.jpg)


    想象一下你一生生活在一个简单的宇宙里，这个宇宙由彩色物体（如金字塔和立方体）组成，你可以随心移动它们。这就是 `SHRDLU` 的世界，它由计算机科学家特里·维纳格德（Terry
    Winograd，1946 年生）于 1971 年开发。`SHRDLU` 程序将自然语言指令转化为物理动作，例如“请把两个红色方块堆在一起，再放一个绿色立方体或金字塔”，或者“找一个比你手里拿的更高的金字塔，把它放进盒子里”。人们还可以关于这个宇宙的历史提问（例如，“你在拿起立方体之前捡过东西吗？”）。在内部，它使用了
    `LISP` 语言。


    在维纳格德 1971 年的博士论文序言中他写道：“计算机正被用来接管许多工作……但涉及到告诉计算机做什么时……`SHRDLU` 的名字源于‘理解隐藏的世界（shaded
    world）。”


    对于那个时代来说，`SHRDLU` 被认为是一项巨大的成就。它具有记忆功能。然而，尽管运行出色，`SHRDLU` 的局限在于它无法学习。


    **另参** 自然语言处理（1954 年）, 专家系统（1965 年）, 谢基机器人（1966 年）


    `PARRY` 是一个计算机程序，通过响应自然语言指令来移动虚拟物体。`PARRY` 对黑党、不诚实、赛马、债务惩罚以及警察与黑党的勾结感到偏执。


    ![](img/#9781454933601_epub_cre_r1.xhtml#130-1)


    # 1972


    # 偏执 PARRY


    ![](img/L01.jpg)


    1972 年，精神科医生肯尼斯·科尔比（Kenneth Colby，1920–2001）开发了 `PARRY`，这是一个模拟偏执型精神分裂症患者的计算机程序。具体来说，`PARRY`
    的开发是为了测试偏执思维理论，这个 AI 对黑党抱有幻想，其知识表示涉及对自我能力不足的感觉以及对特定面试问题的保护。


    `PARRY` 通过对各种对话输入分配权重来处理对话。有趣的是，通过文本与 `PARRY` 交流的精神科医生未能察觉到他们正在面试一个计算机程序，他们无法区分哪些“患者”是人类，哪些是计算机程序。


    '
- fmt: "\nIn 1989, Colby started a company, Malibu Artificial Intelligence Works,\
    \ that marketed a therapy program for depression. This program would be used by\
    \ the US Navy and Department of Veterans Affairs and was distributed to people\
    \ who (controversially) used it without consulting a trained psychiatrist. Colby\
    \ told one skeptical journalist that his depression program could be better than\
    \ human therapists because “after all, the computer doesn’t burn out, look down\
    \ on you, or try to have sex with you.”\n\n**SEE ALSO** [Turing Test (1950)](9781454933601_epub_c042_r1.xhtml#c-042),\
    \ [ELIZA Psychotherapist (1964)](9781454933601_epub_c053_r1.xhtml#c-053), [Ethics\
    \ of AI (1976)](9781454933601_epub_c068_r1.xhtml#c-068)\n\n**NASA spacecraft antenna,**\
    \ discovered by an evolutionary computer design program to create superior radiation\
    \ patterns. The software begins with random antenna designs and refines them through\
    \ an evolutionary process.\n\n![OEBPS/images/132-1.jpg](9781454933601_epub_cre_r1.xhtml#132-1)\
    \ \n\n# 1975: GENETIC ALGORITHMS\n\n![](OEBPS/images/L01.jpg)\n\n“An important\
    \ concept both in Arti-ficial Life and in Artificial Intelligence is that of a\
    \ `genetic algorithm` (`GA`),),” writes philosopher Jack Copeland. \"`GAs` employ\
    \ methods analogous to the processes of natural evolution in order to produce\
    \ successive generations of software entities that are increasingly fit for their\
    \ intended purpose.”\n\nThe famous 1975 book *Adaptation in Natural and Artificial\
    \ Systems* by scientist John Holland (1929–2015) developed and popularized GAs,\
    \ which can solve real-world problems by using biologically inspired methods such\
    \ as selection, mutation, and crossover (recombination). With GAs, humans don’t\
    \ directly program a solution; rather, a solution emerges through simulated competition,\
    \ improvement, and evolution.\n\nThese algorithms usually start with an initial\
    \ set, or population, of random solutions or candidate programs. A `fitness function`\
    \ assigns a fitness value to each program to indicate how well the program performed\
    \ a desired task or reached an outcome. During generations of evolution, each\
    \ candidate being evaluated has a set of properties that can be mutated (changed)\
    \ through time.\n\nScientists can find it difficult to understand the amazingly\
    \ useful output of GAs. According to former NASA engineer Jason Lohn, the algorithms’\
    \ effectiveness makes up for their unintelligibility: “If I optimize an antenna\
    \ using evolutionary algorithms, there’s only a 50 percent chance I’ll be able\
    \ to explain exactly why it has made the choices it has made. The rest of the\
    \ time the design is simply not intelligible to us. It works—and as engineers,\
    \ what we ultimately care about is getting things to work.”\n\nUnfortunately,\
    \ GAs may become “trapped” in a region of reasonably good solutions (called a\
    \ `local optimum`) rather than finding the best solution (a `global optimum`).\
    \ Nevertheless, they have had remarkable success when applied to antenna design,\
    \ protein engineering, vehicle routings and scheduling, circuit design, assembly-line,\
    \ pharmacology, art, and other fields that benefit from searching through a large\
    \ number of possibilities. GAs were even used for generating realistic-animated\
    \ horses in the movie *The Lord of Rings: The Return of the King*.\n\n**SEE ALSO**\
    \ [Computational Creativity (1821)](9781454933601_epub_c021_r1.xhtml#c-021), [Machine\
    \ Learning (1959)](9781454933601_epub_c050_r1.xhtml#c-050), [Mastermind (1970)](9781454933601_epub_c063_r1.xhtml#c-063),\
    \ [Artificial Life (1986)](9781454933601_epub_c074_r1.xhtml#c-074), [Swarm Intelligence\
    \ (1986)](9781454933601_epub_c075_r1.xhtml#c-075)\n\n**Consider an AI control**\
    \ dealing with a runaway train barreling down the railway. Ahead, there are five\
    \ elderly people on the track who will be killed. If the AI switches the train\
    \ to another track, it will kill one young person. What ethical choice should\
    \ the AI make?\n\n![OEBPS/images/134-1.jpg](9781454933601_epub_cre_r1.xhtml#134-1)\n\
    \n# 1976: ETHICS OF AI\n\n![](OEBPS/images/L01.jpg)\n\nOver several decades, both\
    \ lay-people and experts have expressed concerns regarding possible threats of\
    \ AI to human dignity, safety, jobs, and more. For example, computer scientist\
    \ Joseph Weizenbaum (1923–2008) suggested in his influential 1976 book *Computer\
    \ Power and Human Reason* that AIs should not be used as substitutes for humans\
    \ in jobs—such as therapist or judge—that emphasize interpersonal respect, love,\
    \ and care. Weizenbaum suggested that, even though AI entities might be fairer\
    \ and more effective than humans, who often have biases and become tired at their\
    \ jobs, excessive reliance on AI could degrade human values and the human spirit\
    \ as we increasingly think of ourselves as emotionless drones.\n\nAlready, scientists\
    \ have raised privacy concerns after testing AI entities that can detect, with\
    \ increasing levels of accuracy, the nationality, ethnicity, or sexual orientation\
    \ of people based on names or photographs from dating sites. Concerns have also\
    \ been raised about AI entities that recommend bail or parole, based on the available\
    \ input data, in the criminal justice system. In the arena of self-driving vehicles,\
    \ ethical considerations will need to be programmed into vehicle logic that would\
    \ control decisions such as whether to save the vehicle occupant or a pedestrian,\
    \ if a crash is imminent and only one can be saved. Of course, job displacement\
    \ is also a major concern for truck drivers and other workers in a range of professions.\n\
    \nIn the future, AI entities will need to be monitored for various kinds of illegal\
    \ or immoral actions that humans take, including cyberbullying, impersonating\
    \ people we love or trust, stock manipulation, and inappropriate killing (e.g.,\
    \ by autonomous weapons). When should AI entities be required to disclose to real\
    \ humans that they are not human? If robots, when pretending to be humans, can\
    \ be better caregivers and companions, need they disclose their nonhumanity?\n\
    \n**SEE ALSO** *Metropolis* (1927)](9781454933601_epub_c034_r1.xhtml#c-034), [Asimov’s\
    \ Three Laws of Robotics (1942)](9781454933601_epub_c037_r1.xhtml#c-037), [Lethal\
    \ Military Robots (1942)](9781454933601_epub_c038_r1.xhtml#c-038), [ELIZA Psychotherapist\
    \ (1964)](9781454933601_epub_c053_r1.xhtml#c-053), [Paranoid PARRY (1972)](9781454933601_epub_c066_r1.xhtml#c-066),\
    \ [Autonomous Vehicles (1984)](9781454933601_epub_c072_r1.xhtml#c-072)\n\n**The\
    \ *Scientific American* cover story in June 1980** revolved around the backgammon\
    \ program `BKG 9.8`, which competed against the reigning world champion, Luigi\
    \ Villa, possibly making him the first world champion at any board game to be\
    \ defeated by a computer program.\n\n![OEBPS/images/136-1.jpg](9781454933601_epub_cre_r1.xhtml#136-1)\
    \ \n\n# 1979: BACKGAMMON CHAMPION DEFEATED\n\n![](OEBPS/images/L01.jpg)\n\n“Like\
    \ most board games, backgammon is a sublimated version of human warfare,” writes\
    \ AI expert Daniel Crevier, “its name deriving from the Welsh `bac` and `gamen`,\
    \ ‘little’ and ‘war.’”\n\nDespite the name, no one is certain where the ancient\
    \ board game of backgammon originated, but it has been around for almost 5,000\
    \ years. In the game, two players command little “soldiers,” represented as a\
    \ set of fifteen pieces that move between twenty-four triangles. The roll of two\
    \ dice controls the choices of possible moves of the players, who take turns and\
    \ whose goal is to move all their pieces off the board.\n\nIn 1979, the backgammon\
    \ program `BKG 9.8` competed against the reigning world champion, Luigi Villa,\
    \ defeating Villa and making him possibly the first world champion at any board\
    \ game to be defeated by a computer program. Admittedly, `BKG 9.8` benefited from\
    \ some favorable dice rolls, but skill is needed in selecting the best move for\
    \ the actual rolls. `BKG 9.8` used fuzzy logic, among other useful mathematical\
    \ techniques.\n"
