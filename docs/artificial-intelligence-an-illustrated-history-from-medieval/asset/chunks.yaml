    `Ernő Rubik’s 1983 US patent 4,378,116` for a “spatial logical toy,” showing internal
    mechanisms.


    ![![](OEBPS/images/196-1.jpg)](#9781454933601_epub_cre_r1.xhtml#196-1)


    # 2018


    ## RUBIK’S CUBE ROBOTS


    ![](OEBPS/images/L01.jpg)


    The construction of robots capable of solving a Rubik’s Cube^® using computer
    vision and physical manipulation has been a popular challenge for AI engineers,
    who have developed numerous different robotic designs over the years. The original
    Rubik’s Cube was invented by the Hungarian inventor Ernő Rubik (b. 1944) in 1974;
    by 1982, 10 million of them had been sold in Hungary (which is, curiously, more
    than the population of that country). It is estimated that over 100 million have
    been sold worldwide to date.


    The cube is a 3 × 3 × 3 array of smaller cubes that are colored in such a way
    that the six faces of the large cube have six distinct colors. The twenty-six
    external subcubes are internally hinged so that these six faces can be rotated.
    The goal of the puzzle is to return a scrambled cube to a state in which each
    side has a single color. There are 43,252,003,274,489,856,000 different arrangements
    of the small cubes, and only one of these arrangements is the initial position
    where all colors match on each of the six sides. If you had a cube for every one
    of these “legal” positions, you could cover the entire surface of Earth (including
    oceans) about 250 times.


    In 2010, researchers proved that no starting configuration of the cube requires
    more than twenty moves to solve. In 2018, an agile Rubik’s Cube robot called the
    Rubik’s Contraption finally pierced the half-second boundary, solving a scrambled
    cube in just 0.38 seconds, which included image capture, computation, and movement
    time. The setup employed by MIT robotics student Ben Katz and software developer
    Jared Di Carlo made use of six Kollmorgen ServoDisc motors and the so-called Kociemba
    two-phase algorithm. By comparison, 10.69 seconds was the robotic world record
    in 2011. Also in 2018, a deep-learning machine finally taught itself how to solve
    Rubik’s Cube using reinforcement learning.


    One variation that never appeared on toy-store shelves is the four-dimensional
    version of Rubik’s Cube: the Rubik’s tesseract. The total number of positions
    of Rubik’s tesseract is an astounding 1.76×10^20. If the rotating layers of either
    the cube or tesseract changed every second since the beginning of the universe,
    they would still be turning today and not have exhibited possible configuration.


    SEE ALSO [Tower of Hanoi (1883)](#9781454933601_epub_c027_r1.xhtml#c-027), [Reinforcement
    Learning (1951)](#9781454933601_epub_c044_r1.xhtml#c-044), [Shakey the Robot (1966)](#9781454933601_epub_c059_r1.xhtml#c-059),
    [ASIMO and Friends (2000)](#9781454933601_epub_c085_r1.xhtml#c-085)


    Researchers have trained an AI system to accurately predict if a person would
    die in three to twelve months. If you could know the day, or even year, of death,
    would you choose to know ahead of time?


    ![![](OEBPS/images/198-1.jpg)](#9781454933601_epub_cre_r1.xhtml#198-1)


    # 2019


    ## AI PREDICTOR


    ![](OEBPS/images/L01.jpg)


    In 2016, researchers at Stanford University were able to train an AI system to
    accurately predict if a person would die in three to twelve months. This remarkable
    application is included in this book as representative of the wide variety of
    roles that AI and deep learning will play in coming years.


    Palliative care usually involves providing relief for a patient’s pain, stress,
    and other symptoms when the patient has a terminal diagnosis and no cure. Knowing
    when specific care is warranted may have beneficial effects for the sufferer,
    family, and caregivers—and help when such care would be most effective. To create
    the AI `Death Algorithm`, the Stanford team used information from about 170,000
    patients who had died with, for example, cancer and neurological diseases. Various
    information from medical records—including a patient’s diagnosis, medical procedure,
    medical-scan codes, drugs prescribed, etc.—was used as input to “teach” the AI
    system. Then a deep neural net was trained, with various internal weights adjusted
    for neuron units. The deep neural net made use of an input layer of 13,654 dimensions
    (e.g., codes for diagnoses and drugs), 18 hidden layers (each 512 dimensions),
    and a scalar output layer.


    In the end, nine out of ten people predicted to die within three to twelve months
    died within this time frame. Also, 95 percent of those whom the algorithm determined
    would outlast twelve months lived longer. However, as physician Siddhartha Mukherjee
    explained in a recent New York Times article: “The deep learning system learns,
    but it cannot tell us why it has learned; it assigns probabilities, but it cannot
    easily express the reasoning behind the assignment. Like a child who learns to
    ride a bicycle by trial and error and asked to articulate the rules that enable
    bicycle riding, simply shrugs her shoulders and sails away, the algorithm looks
    vacantly at us when we ask ‘Why?’ It is, like death, another black box.” Nevertheless,
    research on these AI death predictors continues, and in 2019 a team of experts
    at University of Nottingham showed that machine learning could outperform traditional
    methods at predicting premature deaths, based on demographic, biometric, clinical,
    and lifestyle factors.


    SEE ALSO [Deep Learning (1965)](#9781454933601_epub_c058_r1.xhtml#c-058), [Ethics
    of AI (1976)](#9781454933601_epub_c068_r1.xhtml#c-068), [Autonomous Robotic Surgery
    (2016)](#9781454933601_epub_c096_r1.xhtml#c-096)


    # NOTES AND REFERENCES


    ![](OEBPS/images/L01.jpg)


    “Artificial intelligence is the next step in evolution, but it’s a different step.
    . . . One artificially intelligent device can tell another not only everything
    it knows in the sense that a human teacher can tell a student some of what he
    knows, but it can tell another device everything about its own design. . . . Basically
    the human mind is not most like a god or most like a computer. It’s most like
    the mind of a chimpanzee, and designed for getting along in the jungle or out
    in the fields.”


    —Edward Fredkin, quoted in Pamela McCorduck’s Machines Who Think


    I’ve compiled the following reference list that identifies some of the material
    I used to research and write this book, and to provide information on the quoted
    sources. As many readers are aware, Internet websites come and go. Sometimes they
    change addresses or disappear. The website addresses listed here provided valuable
    background information when this book was written. Online sources such as Wikipedia
    (`en.wikipedia.org`) are a valuable starting point for any quest such as this
    one, and I sometimes used this site as a launchpad, along with many other Websites,
    books, and research papers.

