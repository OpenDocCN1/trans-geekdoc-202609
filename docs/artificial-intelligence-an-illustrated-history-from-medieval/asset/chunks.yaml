    English author and polymath Samuel Butler (1835–1902) provided early insights\
    \ into possible AIs of the future, presaging concepts such as self-improving machine\
    \ superintelligence and its potential risk. In his astounding 1863 essay “Darwin\
    \ among the Machines,” Butler discusses the future of “mechanical life”: “We are\
    \ ourselves creating our own successors; we are daily adding to the beauty and\
