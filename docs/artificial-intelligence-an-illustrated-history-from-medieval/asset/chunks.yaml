    [Lagado Book-Writing Engine (1726)](9781454933601_epub_c016_r1.xhtml#c-016), [Cybernetic
    Serendipity (1968)](9781454933601_epub_c061_r1.xhtml#c-061), [Genetic Algorithms
    (1975)](9781454933601_epub_c067_r1.xhtml#c-067), [Computer Art and DeepDream (2015)](9781454933601_epub_c092_r1.xhtml#c-092)


    Working model of a portion of Charles Babbage’s Difference Engine, currently located
    at the London Science Museum.


    [![](OEBPS/images/42-1.jpg)](#9781454933601_epub_cre_r1.xhtml#42-1)


    # 1822

    # BABBAGE’S MECHANICAL COMPUTER


    ![](OEBPS/images/L01.jpg)


    Charles Babbage (1791–1871) was an English analyst, statistician, and inventor
    who, in 1819, saw the Mechanical Turk, as this mechanical man toured England and
    defeated human chess players. Of course, Babbage must have known that the Turk
    was some kind of trick, but many have suggested that the android device inspired
    Babbage to ponder other kinds of more practical thinking machines, as an early
    step on the journey toward artificial intelligence.


    Babbage is often considered the most important mathematician-engineer involved
    in the “prehistory” of computers. In particular, he is famous for conceiving an
    enormous hand-cranked mechanical calculator, an early progenitor of our modern
    computers. Babbage thought the device would be most useful in producing mathematical
    tables, but he worried about mistakes that would be made by humans who transcribed
    the results from its thirty-one metal output wheels. Today we realize that Babbage
    was around a century ahead of his time and that the politics and technology of
    his era were inadequate for his lofty dreams.

