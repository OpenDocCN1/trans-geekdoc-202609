  trans: "\n\n在他的著作《人工智能》一书中，心理学家艾兰·加纳姆（Alan Garnham）讨论了安提基梯拉机械并指出：“也许导致人工智能产生的主要发展路线，是试图制造出能够消除人类智力活动枯燥性，同时消除其容易犯的某些错误的机器。”安提基梯拉机械是一种古代的齿轮计算设备，用于计算天文位置。它由海绵潜水员于\
    \ 1900 年左右在希腊岛屿安提基梯拉岛附近的一处沉船残骸中发现，被认为制造于公元前 150 年至 100 年之间。正如记者乔·马尚特（Jo Marchant）所描述的：“在随后运往雅典的打捞宝藏中，有一块没有形状的石头，起初没有人注意到它，直到它裂开，露出了青铜齿轮、指针和微小的希腊铭文。.\
    \ . . 这种由精确切割的刻盘、指针和至少三十个相互锁合的齿轮组成的复杂机械装置，在之后的一千多年里历史记录中没有出现过与其复杂度相当的东西，直到中世纪欧洲天文钟的出现。”\n\
    \n设备正面的一个刻盘可能至少有三根指针——一个指示日期，另外两个指示太阳和月的位置的位置。设备还可能被用于追踪古代奥林匹克活动的日期、预测日食以及指示其他行星运动。\n\
    \n月球机械使用了一组特殊的青铜齿轮组，其中两个通过略微偏移的轴连接，以指示月球的位置和相位。正如今天已知的开普勒行星定律，月球在绕地球运行时的速度不同（例如，离地球近时速度更快），安提基梯拉机械模拟了这种速度差异，尽管古希腊人并未意识到轨道实际的椭圆形状。马尚特写道：“通过转动箱上的手柄，你可以让时间向前或向后流动，看到今天、明天、上周二或百年后的宇宙状态。任何拥有这个设备的人一定觉得自己是上苍的主宰。”\n\
    \n**另请参考** 克特西比奥的水钟（约公元前 250 年）, 算盘（约公元前 190 年）, 贝贝的机械计算机（1822 年）\n\n**一个精美的孔雀盆**，来自阿尔-加扎利的《奇巧机械装置之书》（纸本不透明水彩、金箔和墨水）。\n\
    \n![](img/#9781454933601_epub_cre_r1.xhtml#12-1) \n\n# 1206\n\n# 阿尔-加扎利的自动机\n\n\
    ![](img/L01.jpg)\n\n博学学者、发明家、艺术家兼工程师伊斯斯马尔·阿尔-加扎利（Ismail al-Jazari, 1136–1206）生活在伊斯兰黄金时代的巅峰时期，他继父亲担任安纳托利亚（现土耳其迪亚尔巴克尔）阿尔图鲁宫的首席工程师。阿尔-加扎利的《奇巧机械装置之书》——根据其皇家雇主的要求编写，并在阿尔-加扎利去世那年出版——书中包含了他所制造的众多机械装置的描述，包括移动的人类和动物自动机以及水泵、喷泉和钟。在研究和工程过程中，阿尔-加扎利使用了凸轮轴、曲轴、擒轮、分段齿轮和其他复杂的机制。\n\
    \n他的自动机包括由水驱动的移动孔雀、一名提供饮料的女服务员，以及一个在船上由四名自动音乐人组成的机器人乐队，他们的面部表情通过旋转轴控制。一些研究人员推测，机器人乐队的动作可能是可以编程的，这表明了额外的技术复杂性。他的大象钟上有一个人形机器人定期敲击���器，还有一只机械鸟在书吏旋转时发出啾叫，并用笔标记时间。阿尔-加扎利那高\
    \ 11 英尺（3.4 米）的城堡钟上有五位自动机音乐人。\n\n根据英国工程师兼历史学家唐纳德·R·希尔（Donald R.Hill, 1922–1994），他因翻译阿尔-加扎利的著作为英语而闻名，“如何强调阿尔-加扎利著作在工程史上的重要性都不为过。直到现代，没有任何其他文化领域的文献能提供关于机器设计、制造和组装的详尽指令。毫无疑问，这部分是因为制造者和记录者之间通常存在社会和文化隔阂。当学者描述一个已经建造好的机器时，他通常只感兴趣成品，而不关心建造过程。.\
    \ . . 我们对阿尔-加扎利这一独特的文献欠下了巨大的债。”\n\n（注：此处原文标记为 [content] 译文）\n\n[content]\n（注：此处应根据上述要求翻译后续文本，但由于用户输入重复，以下提供剩余文本的翻译部分）\n\
    \n[content]\n\n![](img/#9781454933601_epub_cre_r1.xhtml#12-1)\n\n**另请参考** 克特西比奥的水钟（约公元\
    \ 250 年）, 海斯丁机械公园, 1300, 1352, 1774\n\n**洛兰斯战战青铜骑士**以进入多洛鲁斯。人形骑士通常没有描绘衣物。（出自《洛兰斯》，15\
    \ 世纪，巴黎法国国立图书馆第 118 号，第 200 页。）\n\n![](img/#9781454933601_epub_cre_r1.xhtml#14-1)\
    \ \n\n# 公元 1220\n\n# 洛兰斯的青铜骑士\n\n![](img/L01.jpg)\n\n简单的人工智能以机械人和动物的形式在欧洲中世纪非常常见，正如历史学家艾莉·特鲁特（Elly\
    \ Truitt）写道：“金鸟兽、音乐喷泉和机器人仆人令客人惊讶和恐惧。. . 自动机处于自然知识（包括魔法）与技术的交汇点，是艺术与自然之间令人的联系。”\n\
    \n一个著名的虚构机器人例子出现在《湖洛兰斯》（*Lancelot du lac*，约 1220 年），这是一部古老的法语散文小说，讲述了亚瑟王及其圆桌骑士的冒险，包括洛兰斯与王后桂妮薇弗的秘密恋情。在多洛鲁斯花园——一座可怕的魔法城堡外，洛兰斯遇到了一支机器人青铜骑士。进入城堡后，他击败了两个手持剑的青铜骑士，他们正守卫着一个由年轻青铜女子持有魔法钥匙的内部房间。他用钥匙打开了一个装有三十根青铜管的盒子，里面发出了恐怖的叫声——他很快睡了过去。醒来后，他发现青铜女子倒在地上，青铜骑士也破碎了。\n\
    \n历史学家杰西卡·里斯金（Jessica Riskin）写道：“亚瑟传说中的自动机骑士和小姐周围还有金、银、青铜制的儿童、牧神、射箭手、音乐家、神谕和巨人。这些虚构的人造生物有很多现实对应物。真实的机械人和动物充斥在中世纪晚期和现代早期的欧洲景观。”作为一个例子，在与洛兰斯的青铜骑士故事相似时期，法国艺术家兼工程师维拉·德·内库尔（Villard\
    \ de Honnecourt, 约 1225–约 1250 年）创作了一只机械鹰，当执事朗读福音时，它被设计成转向头部。”里斯金指出，这些栩栩如生的自动机为\
    \ 17 世纪出现的将生物视为机器的科学和哲学模型提供了背景。\n\n"
