    \ has a terminal diagnosis and no cure is expected. Knowing when such specific\
    \ care is warranted may have beneficial effects for the sufferer, family, and\
    \ caregivers—and help determine when such care would be most effective. To create\
    \ the AI “Death Algorithm,” the Stanford team used information from about 170,000\
    \ patients who had died with, for example, cancer and heart and neurological diseases.\
    \ Various information from medical records—including a patient’s diagnosis, medical\
    \ procedure, medical-scan codes, drugs prescribed, etc.—was used as input to “teach”\
    \ the AI system. Then a deep neural net was trained, with various internal weights\
    \ adjusted for the neuron units. The deep neural net made use of an input layer\
    \ of 13,654 dimensions (e.g., codes for diagnoses and drugs), 18 hidden layers\
    \ (each 512 dimensions), and a scalar output layer.\n\nIn the end, nine out of\
    \ ten people predicted to die within three to twelve months *did* die within this\
    \ time frame. Also, 95 percent of those whom the algorithm determined would outlast\
    \ twelve months *did* live longer lives. However, as physician Siddhartha Mukherjee\
    \ explained in a recent *New York Times* article: “\\[The deep learning system\\\
    ] learns, but it cannot tell us why it has learned; it assigns probabilities,\
    \ but it cannot easily express the reasoning behind the assignment. Like a child\
    \ who learns to ride a bicycle by trial and error and, asked to articulate the\
    \ rules that enable bicycle riding, simply shrugs her shoulders and sails away,\
    \ the algorithm looks vacantly at us when we ask, ‘Why?’ It is, like death, another\
    \ black box.” Nevertheless, research on these AI death predictors continues, and\
    \ in 2019 a team of experts at University of Nottingham showed that machine learning\
    \ could outperform traditional methods at predicting premature deaths, based on\
    \ demographic, biometric, clinical, and lifestyle factors.\n\n**SEE ALSO** [Deep\
    \ Learning (1965)](#9781454933601_epub_c058_r1.xhtml#c-058), [Ethics of AI (1976)](#9781454933601_epub_c068_r1.xhtml#c-068),\
    \ [Autonomous Robotic Surgery (2016)](#9781454933601_epub_c096_r1.xhtml#c-096)\n\
    \n# NOTES AND REFERENCES\n\n![](OEBPS/images/L01.jpg)\n\n“Artificial intelligence\
    \ is the next step in evolution, but it’s a different step. . . . One artificially\
    \ intelligent device can tell another not only everything it knows in the sense\
    \ that a human teacher can tell a student some of what he knows, but it can tell\
    \ another device everything about its own design. . . . Basically the human mind\
    \ is not most like a god or most like a computer. It’s most like the mind of a\
    \ chimpanzee, and \\[designed\\] for getting along in the jungle or out in the\
    \ fields.”\n\n—Edward Fredkin, quoted in Pamela McCorduck’s *Machines Who Think*\n\
    \nI’ve compiled the following reference list that identifies some of the material\
    \ I used to research and write this book, and to provide information on the quoted\
    \ sources. As many readers are aware, Internet websites come and go. Sometimes\
    \ they change addresses or disappear. The website addresses listed here provided\
    \ valuable background information when this book was written. Online sources such\
    \ as Wikipedia ([en.wikipedia.org](http://en.wikipedia.org)) are a valuable starting\
    \ point for any quest such as this one, and I sometimes used this site as a launchpad,\
    \ along with many other Websites, books, and research papers."
