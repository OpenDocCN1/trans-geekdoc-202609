  trans: "\n\n## 另参\n井字棋游戏（约公元前 1300 年）, 数独大师（1970）, 黑白棋冠军战败（1979）, 四连龙（1988）, 跳棋与人工智能（1994）,\
    \ 奥赛棋（1997）\n\n机器人吸尘器的修改版本已被爱好者黑入，以改变其功能，导致机器人能够绘制房间地图、画出类似螺旋线图^® 的图案、相互斗争、利用摄像头进行监视等。\n\
    \n![](img/#9781454933601_epub_cre_r1.xhtml#174-1) \n\n# 2002：扫地机器人 ROOMBA \n\n\
    ![](img/L01.jpg)\n\n在 iRobot 公司向世界推出 Roomba^® 机器人吸尘器一年后，记者蒙特·里尔（Monte Reel）写道：“机器人革命是如何从\
    \ Roomba 开始开启的呢？这是一种自动地板吸尘器，它将迷住——也许是恐惧——你的宠物猫？这是 iRobot 工程师脑力、野心以及对家务厌恶的偶然邂逅，他们的背景涵盖了从人工智能研究到无人地外飞行器设计的领域。”\n\
    \nRoomba 自动吸尘器于 2002 年上市，它包含各种传感器，使其能够检测地板上的污垢、感知可能导致其跌落的楼梯，并在遇到物体时改变行驶方向。900\
    \ 系列还配备了摄像头，帮助导航软件确保设备能够覆盖整个地板区域。当 Roomba 电池电量低时，吸尘器会通过红外信标寻找充电器。声学污垢传感器帮助它检测某些需要特别关注的脏点。在过去，Roomba\
    \ 依靠螺旋清洁路径、随机行走等方法来覆盖地板。\n\nLISP 编程语言的一种变体被用于编写 Roomba 的大部分软件。今天，各种黑客喜欢修改该设备，利用其\
    \ Roomba 开放接口 (`ROI`）进行其他用途，例如将 Roomba 变成画家或将其用于监视。\n\nRoomba 是用于家务服务的更广泛家用机器人代表。当然，随着这些设备变得越来越复杂，隐私问题将随之而来。已经有关于\
    \ iRobot 可能分享用户家庭地图的激烈争论，这些地图可能会分享给任何对估计用户家庭或生活方式感兴趣的企业，警方甚至可能在犯罪调查期间审问此类机器人。\n\
    \n## 另参\n机器人谢基（1966）, 自动驾驶汽车（1984）, ASIMO 及其朋友（2000）, 火星上的 AI（2015）\n\n即使被赋予了仁慈的任务，例如高效地制造回形针，如果\
    \ AI 随后决定将地球尽可能多的地区转换为回形针制造工厂怎么办？\n\n![](img/#9781454933601_epub_cre_r1.xhtml#176-1)\
    \ \n\n# 2003：回形针极大化器的灾难\n\n![](img/L01.jpg)\n\n即使高度智能且强大的 AI 被赋予了有用的目标，未来仍然可能产生危险的结果。一个著名的例子是哲学家、未来主义者尼克·波斯特罗姆（Nick\
    \ Bostrom）在 2003 年讨论的“回形针极大化器”的恐怖。想象这样一个未来：一个 AI 系统监督着一组生产回形针的工厂。AI 被赋予的任务是尽可能多生产回形针。如果\
    \ AI 没有受到足够的限制，人们可能会想象它可以优化其目标，首先以最高效率运行工厂，然后向该任务投入越来越多的资源，直到大片土地和更多的工厂都被用于制造回形针。最终，地球上所有的可用资源都可能转化为这一任务，随后是太阳系中所有的相关物质，将一切变成回形针。\n\
    \n尽管这种场景听起来可能不现实，但它的意图是 AI 可能并不具备人类的动机。另一个著名的例子归于马文·明斯基（Marvin Minsky）的黎曼假设，AI\
    \ 可能是危险的。\n\n## 另参\n\"机器中的达尔文”（1863）, 智能爆炸（1965）, 密封的 AI 箱（1993）\n\n在拼字游戏游戏中，每个字母牌都有一个字母，根据其在英语语言中的频率被标记为\
    \ 1 到 10 分之间的分。例如，元音价值一分。\n\n![](img/#9781454933601_epub_cre_r1.xhtml#178-1) \n\
    \n# 2006：QUACKLE 的拼字游戏胜利\n\n![](img/L01.jpg)\n\n“象棋有深蓝，”科技记者马克·安德森（Mark Anderson）写道，“问答大赛有沃士。棒球有数据统计学，正如热门书籍和电影《点球王》中所述样。每个比赛，数据挖掘都改变了领域。”人工智能应用于文字游戏的一项惊人进展发生在\
    \ 2006 年，当时程序 Quackle 在多伦多举行的一场锦赛中击败了前世界冠军大卫·波伊斯（David Boys）。当波伊斯在五局中输掉三局时，他坚持认为：“人类仍然比计算机好。”\n\
    \n拼字游戏实际上非常复杂，涉及不仅仅是对语言的了解。例如，策略可能涉及预测哪些字母尚未被抽取，以及将字母牌放在棋盘上可能增加得分的特殊方格上的效用。拼字游戏被认为是一种不完全信息游戏，类似于扑克牌，因为对手拥有的字母牌是不可见的。\n\
    \n"
- fmt: "\nQuackle determines what tiles to play based on simulations that assess the\
    \ board using an evaluation function. It was created by a team that included Jason\
    \ Katz-Brown, who himself is one of the top-ranked Scrabble players in the world.\
    \ As part of their fascinating research, developers had Quackle play itself numerous\
    \ times to better understand the value of playing various words compared to other\
    \ words a player might legally use during a turn, or with considerations of words\
    \ that a player might use on the next turn.\n\n**SEE ALSO** [Connect Four (1988)](#9781454933601_epub_c077_r1.xhtml#c-077),\
    \ [Deep Blue Defeats Chess Champion (1997)](#9781454933601_epub_c082_r1.xhtml#c-082),\
    \ [Othello (1997)](#9781454933601_epub_c083_r1.xhtml#c-083), [AlphaGo Go Champion\
    \ (2016)](#9781454933601_epub_c095_r1.xhtml#c-095), [AI Poker (2017)](#9781454933601_epub_c097_r1.xhtml#c-097)\n\
    \n**The globe-like avatar representing IBM Watson** is based on the IBM Smarter\
    \ Planet icon. In the display employed for the *Jeopardy!* contest, colors and\
    \ motions changed depending on game states and answer confidence levels.\n\n[![](OEBPS/images/180-1.jpg)](#9781454933601_epub_cre_r1.xhtml#180-1)\
    \ \n\n# 2011\n\n# WATSON ON *JEOPARDY!*\n\n![](OEBPS/images/L01.jpg)\n\nKen Jennings\
    \ (b. 1974), the world champion of the game show *Jeopardy!*^®, wrote about his\
    \ contest with an AI entity called Watson: “When I was selected as one of the\
    \ two human players to be pitted against IBM’s ‘Watson’ supercomputer in a special\
    \ man-vs.-machine *Jeopardy!* exhibition match, I felt honored, even heroic. I\
    \ envisioned myself as the Great Carbon-Based Hope against a new generation of\
    \ thinking machines. . . .”\n\nWatson was a question-answering computer system\
    \ that used natural-language processing, machine learning, information retrieval,\
    \ and more to defeat the world champion in 2011 in a game involving general knowledge\
    \ clues. What made the task particularly difficult—more difficult than chess playing—is\
    \ that the computing system needed to provide an answer in just a few seconds,\
    \ while considering the challenges and ambiguities of the English language, with\
    \ clues that included puns, humor, riddles, cultural references, special contexts,\
    \ and rhymes—something that humans consider instinctively.\n\nTo accomplish this\
    \ task, Watson employed thousands of parallel processing units called cores, along\
    \ with information such as the entire Wikipedia corpus, stored in its `RAM` memory\
    \ (because access to spinning hard drives would be too slow during the competition).\
    \ All information had to be stored locally, since Watson was not allowed access\
    \ to the Internet during a match; in order to arrive at an answer, Watson considered\
    \ the results of numerous separate analysis at once. The more algorithms that\
    \ found the same answer, the more likely it would be a correct answer. Watson\
    \ continually scored different answers with a confidence level, and if the confidence\
    \ was sufficiently high, Watson would provide the answer. After his loss, Jennings\
    \ wrote “But there’s no shame in losing to silicon. . . After all, I don’t have\
    \ 880 processor cores and 15 terabytes of reference works at my disposal—nor can\
    \ I buzz in perfect timing whenever I know an answer. My puny human brain, just\
    \ a few bucks worth of water, salts, and proteins, hung in there just against\
    \ a jillion-dollar supercomputer.”\n\n**SEE ALSO** [Natural Language Processing\
    \ (1954)](#9781454933601_epub_c046_r1.xhtml#c-046), [Machine Learning (1959)](#9781454933601_epub_c050_r1.xhtml#c-050),\
    \ [Deep Blue Defeats Chess Champion (1997)](#9781454933601_epub_c082_r1.xhtml#c-082),\
    \ [Quackle’s Scrabble Win (2006)](#9781454933601_epub_c090_r1.xhtml#c-090)\n\n\
    **Example of a DeepDream artwork.** The approach makes use of an artificial neural\
    \ network that can seek and enhance patterns in images, with startling results.\
    \ [![](OEBPS/images/182-1.jpg)](#9781454933601_epub_cre_r1.xhtml#182-1)\n\n# 2015\n\
    \n# COMPUTER ART AND DEEPREAM\n\n![](OEBPS/images/L01.jpg)\n\nAccording to essayist\
    \ Jonathan Swift (1667–1745), “Vision is the art of seeing things invisible.”\
    \ This idea of seeing new patterns at the edges of art, science, and mathematics\
    \ certainly applies to many categories of art produced with the aid of computers,\
    \ neural networks, and other forms of AI. Early explorations of computer art include\
    \ the work of Desmond Paul Henry (1921–2004) and his analog computer-based drawing\
    \ machines, starting around 1961. American engineer A. Michael Noll (b. 1939)\
    \ became famous in 1962 for exploring random and algorithmic processes to produce\
    \ visual art, and British-born artist Harold Cohen (1928–2016) created `AARON`—an\
    \ AI computer-drawing program that could autonomously produce art—in 1968.\n\n\
    A more recent example of computer art includes the collaboration of many users\
    \ with DeepDream, a 2015 computer-vision program created by Google engineer Alexander\
    \ Mordintsev and colleagues. The approach makes use of an artificial neural network\
    \ (`ANN`) that can seek and enhance patterns in images—with startling results.\
    \ To better understand DeepDream, consider that neural nets may be trained to\
    \ classify and recognize features in an input image (e.g., chipmunks or stop signs)\
    \ based on numerous “training” images. By running the neural network “in reverse,”\
    \ DeepDream looks for patterns in images and amplifies them in a manner somewhat\
    \ reminiscent of when we gaze up at the clouds and begin to see animal-like shapes.\
    \ For artificial neural nets, each layer progressively extracts higher-level features—for\
    \ example, the first layer might be sensitive to corners and edges, while layers\
    \ closer to the output neurons may be examining complex features. Not only are\
    \ the resulting pictures fascinating to study and brimming with detail, but they\
    \ can provide a sense of the level of abstraction on which a particular `ANN`\
    \ layer is working.\n\nThe resemblance of DeepDream artwork to hallucinations\
    \ experienced by users of certain mind-altering drugs suggests that DeepDream\
    \ might help researchers better understand how artificial neural networks relate\
    \ to actual neural networks in the brain’s visual cortex. Furthermore, the program\
    \ could help illuminate how the brain attempts to find pattern and meaning.\n\n\
    **SEE ALSO** [Computational Creativity (1821)](#9781454933601_epub_c021_r1.xhtml#c-021),\
    \ [Artificial Neural Networks (1943)](#9781454933601_epub_c039_r1.xhtml#c-039),\
    \ [Deep Learning (1965)](#9781454933601_epub_c058_r1.xhtml#c-058), [*Cybernetic\
    \ Serendipity* (1968)](#9781454933601_epub_c061_r1.xhtml#c-061)\n\n**In the future,**\
    \ Kelly believes that we will encounter “synthetic aliens,” beings that we create,\
    \ forcing us to deal with the same benefits and challenges that we would expect\
    \ if we ever established contact with intelligent extraterrestrial aliens from\
    \ other planets.\n\n[![](OEBPS/images/184-1.jpg)](#9781454933601_epub_cre_r1.xhtml#184-1)\
    \ \n\n# 2015\n\n# “CALL THEM ARTIFICIAL ALIENS”\n\n![](OEBPS/images/L01.jpg)\n\
    \n“The most important thing about making machines that can think is that they\
    \ will think differently,” writes Kevin Kelly (b. 1942), founding Executive Editor\
    \ of *Wired* magazine. In his acclaimed 2015 essay, “Call Them Artificial Aliens,”\
    \ he noted that “. . . to solve the current grand mysteries of quantum gravity,\
    \ dark energy, and dark matter, we’ll probably need intelligences other than human.\
    \ The extremely complex questions that will come after them may require even more\
    \ distant and complex intelligences. Indeed, we may need to invent intermediate\
    \ intelligences that can help us design yet more rarified intelligences that we\
    \ couldn’t design alone.”\n"
  raw: "Quackle determines what tiles to play based on simulations that assess the\
    \ board using an evaluation function. It was created by a team that included Jason\
    \ Katz-Brown, who himself is one of the top-ranked Scrabble players in the world.\
    \ As part of their fascinating research, developers had Quackle play itself numerous\
    \ times to better understand the value of playing various words compared to other\
    \ words a player might legally use during a turn, or with considerations of words\
    \ that a player might use on the next turn.\n\n**SEE ALSO** [Connect Four (1988)](#9781454933601_epub_c077_r1.xhtml#c-077),\
    \ [Deep Blue Defeats Chess Champion (1997)](#9781454933601_epub_c082_r1.xhtml#c-082),\
    \ [Othello (1997)](#9781454933601_epub_c083_r1.xhtml#c-083), [AlphaGo Go Champion\
    \ (2016)](#9781454933601_epub_c095_r1.xhtml#c-095), [AI Poker (2017)](#9781454933601_epub_c097_r1.xhtml#c-097)\n\
    \n**The globe-like avatar representing IBM Watson** is based on the IBM Smarter\
    \ Planet icon. In the display employed for the *Jeopardy!* contest, colors and\
    \ motions changed depending on game states and answer confidence levels.\n\n[![](OEBPS/images/180-1.jpg)](#9781454933601_epub_cre_r1.xhtml#180-1)\
    \ \n\n# 2011\n\n# WATSON ON *JEOPARDY!*\n\n![](OEBPS/images/L01.jpg)\n\nKen Jennings\
    \ (b. 1974), the world champion of the game show *Jeopardy!*^®, wrote about his\
    \ contest with an AI entity called Watson: “When I was selected as one of the\
    \ two human players to be pitted against IBM’s ‘Watson’ supercomputer in a special\
    \ man-vs.-machine *Jeopardy!* exhibition match, I felt honored, even heroic. I\
    \ envisioned myself as the Great Carbon-Based Hope against a new generation of\
    \ thinking machines. . . .”\n\nWatson was a question-answering computer system\
    \ that used natural-language processing, machine learning, information retrieval,\
    \ and more to defeat the world champion in 2011 in a game involving general knowledge\
    \ clues. What made the task particularly difficult—more difficult than chess playing—is\
    \ that the computing system needed to provide an answer in just a few seconds,\
    \ while considering the challenges and ambiguities of the English language, with\
    \ clues that included puns, humor, riddles, cultural references, special contexts,\
    \ and rhymes—something that humans consider instinctively.\n\nTo accomplish this\
    \ task, Watson employed thousands of parallel processing units called cores, along\
    \ with information such as the entire Wikipedia corpus, stored in its RAM memory\
    \ (because access to spinning hard drives would be too slow during the competition).\
    \ All information had to be stored locally, since Watson was not allowed access\
    \ to the Internet during a match; in order to arrive at an answer, the AI considered\
    \ the results of numerous separate analysis algorithms at once. The more algorithms\
    \ that found the same answer, the more likely it would be a correct answer. Watson\
    \ continually scored different answers with a confidence level, and if the confidence\
    \ was sufficiently high, Watson would provide the answer.\n\nAfter his loss, Jennings\
    \ wrote “But there’s no shame in losing to silicon. . . . After all, I don’t have\
    \ 2,880 processor cores and 15 terabytes of reference works at my disposal—nor\
    \ can I buzz in with perfect timing whenever I know an answer. My puny human brain,\
    \ just a few bucks worth of water, salts, and proteins, hung in there just fine\
    \ against a jillion-dollar supercomputer.”\n\n**SEE ALSO** [Natural Language Processing\
    \ (1954)](#9781454933601_epub_c046_r1.xhtml#c-046), [Machine Learning (1959)](#9781454933601_epub_c050_r1.xhtml#c-050),\
    \ [Deep Blue Defeats Chess Champion (1997)](#9781454933601_epub_c082_r1.xhtml#c-082),\
    \ [Quackle’s Scrabble Win (2006)](#9781454933601_epub_c090_r1.xhtml#c-090)\n\n\
