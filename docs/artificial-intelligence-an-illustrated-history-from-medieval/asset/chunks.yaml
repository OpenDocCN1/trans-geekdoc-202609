    # 逻辑与计算的基础


    ## 早期先驱者

    巴贝奇的`差分机`（Difference Engine）始于 1822 年，但从未完成，其设计用于使用约 25,000 个部件计算多项式函数的值。他还计划创建一种更通用的计算机，即`分析引擎`（Analytical
    Engine），它可以使用打孔卡进行编程，并拥有独立的存储区域。据估计，一台能够存储一千位数字的`分析引擎`长度将超过一百英尺。


    埃达·洛夫莱斯（Ada Lovelace，1815–1852）是英国诗人拜伦勋爵的女儿，她为`分析引擎`的程序编写了规范。尽管许多人认为埃达是第一位程序员，但她实际上是为巴贝奇提供协助。


    ## 布尔代数的诞生

    1990 年，小说家威廉·吉布斯和布鲁斯·斯特林写了小说《差分引擎》（*Difference Engine*），让读者想象，如果巴贝奇的机械计算机出现在维多利亚时代，将会产生什么后果。该故事出版于
    1844 年，远在灯泡发明之前，故事围绕在钟表店工作的天才欧恩·沃兰（Owen Warland）的生活展开。欧恩是一个敏感的年轻人，他暗暗爱着店主的女儿安妮·霍文登（Annie
    Hovenden），并思索是否可能模仿自然界美丽的动作，例如鸟类的飞行。


    在考虑布尔代数时，乔治·布尔（George Boole）写道，他的目标之一是“研究执行推理的思维的基本法则”。他最具影响力的著作于 1854 年出版，题为《思维规律研究》（*An
    Investigation into Thought, on which are Founded Mathematical Operations and Probabilities*）。


    ## 自动人的演变

    尼尼尔·霍桑（Nathaniel Hawthorne，1804–1864）的《美丽的艺术家》（“The Artist of the Beautiful”）是第一个关于机器人昆虫的小说，因其迷人的美丽以及对人工智能和人类反应的问题而广受喜爱。故事描述了一个具有神秘且栩如生的特征的机器。


    欧恩最终成功制造了一只机械蝴蝶。店主发现了一个早期模型并几乎将其压碎，他惊呼道：“欧恩！这些小链条里有魔术！”


    在故事的结尾，欧恩决定向安妮展示他创作的新版本：

    ```

    一只蝴蝶轻盈而出，落在她的指尖上，扇动着那紫色和金色斑点般的华丽翅膀，仿佛在准备飞行。用语言无法表达这个物体所展现出的光辉、壮丽和精致的美。自然的理想蝴蝶在这里得到了完美的实现；不是那些在地球花丛中飞行的昆虫，而是那些在天堂草地上盘旋、供天使和夭折灵魂嬉玩的蝴蝶。”

    ```

    “美！美！”安妮呼道，“它是活着吗？它是活的吗？”昆虫飞向空中，在安妮头顶盘旋。故事对蝴蝶来说似乎是一个悲剧性的结局，因为它被一个无心的孩子压成了一堆“闪烁的碎片”，但欧恩获得了一种启悟，意识到蝴蝶的美是永恒的。


    ## 现代应用

    作为一个趣的插曲，2015 年，美国专利`9,046,884`被授予机器人蝴蝶，它们根据人类的情绪状态进行感知、响应和移动，以改善我们的心情。


    在布尔去世约七十年后，美国人克劳德·香农（Claude E. Shannon，1916–2001）在学生时代就接触了布尔代数，并展示了如何利用布尔代数来优化电话交换机的设计。


    另见

    - `算盘`（Abacus，公元前）

    - `机械土耳人`（Mechanical Turk，1770）

    - `ENIAC`（1946）

    - `沃沃康森机械鸭`（de Vaucanson’s Duck Automaton，1738）

    - `雅克-德罗自动人`（Jaquet-Droz Automata，1774）

    - `滴嗒声`（Tik-Tok，1907）

    - 斯皮尔伯格的《人工智能》（Spielberg’s A.I. Artificial Intelligence，2001）


