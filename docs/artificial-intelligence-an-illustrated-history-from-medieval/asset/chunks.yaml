  trans: "\n\n**另参** “机器之中的达尔文”（1863）, 自然语言处理（1954）, 超人类主义（1957）\n\n`《伊莉莎·杜立特的肖像》，`\
    \ 乔治·伯纳德·肖恩剧《卖花丽女王》中一个卖花女，由艺术家威廉·布鲁斯·埃利斯·兰肯（1881–1941）创作。`ELIZA` 以杜立特小姐命名，因为杜立特能够通过部分提高自己的语言能力，令人信服地模拟出一个成熟且受过教育的人。\n\
    \n![](img/#9781454933601_epub_cre_r1.xhtml#104-1) \n\n# 1964\n\n# ELIZA 心理治疗师\n\
    \n![](img/L01.jpg)\n\n`ELIZA` 是一种对自然语言输入（例如输入的文本）做出响应的计算机程序，模拟用户与心理治疗师之间的对话。该程序由计算机科学家约瑟夫·魏森鲍姆（1923–2008）于\
    \ 1964 年开发，作为最早且最具说服力的“聊天机器人”（即对话模拟器）之一而闻名噪。事实上，魏森鲍姆对某些人在与 `ELIZA` 对话期间透露出深层情感和个人信息的程度感到震惊和困扰，仿佛他们将\
    \ `ELIZA` 视为一个具有同情能力的真实人类。\n\n`ELIZA` 命名自爱尔兰剧作家乔治·伯纳德·肖 1912 年的喜剧《卖花丽女王》中的伊莉莎·杜立特。在剧中，亨利·希金斯教授教未受教育的女性伊莉莎如何正确说话，从而令人信服地模仿上流女性。同样，魏森鲍姆的\
    \ `ELIZA` 被设置为对某些关键词和短语做出响应，提供了真实人类共情的幻象。一些研究人员认为，该程序实际上可以帮助遭受某些心理状况的个体。\n\n当魏森鲍姆观察人们与\
    \ `ELIZA` 互动时，他对他们对计算机日益的依赖以及人们如何被欺骗感到担忧。在他关于 `ELIZA` 的 1966 年里程碑式技术论文中，他写道：“在人工智能\
    \ . . . 机器被用来以奇的方式运行……”\n\n```\nartificial intelligence . . . machines are made\
    \ to behave in wondrous ways, often sufficient to dazzle even the most experienced\
    \ observer. But once a particular program is unmasked, once its inner workings\
    \ are explained . . . 它的魔法就会崩塌；它显现出仅仅是程序的集合。. . . 观察者对自己说‘我也可以写出那种。’有了这个念头，他将涉及的程序从标记为‘智能’的架子移动到留给奇珍异物的架子上。.\
    \ . . 本文的目的是对即将被‘解释’的程序进行这样的重新评估。很少有程序比它更需要这一点。\n```\n\n今天，脸部识别系统以各种形式使用。\n\n\
    **另参** 图灵测试（1950）, 自然语言处理（1954）, 偏执狂（1972）, 人工智能伦理（1976）\n\n`美国专利 9,703,939`](9781454933601_epub_cre_r1.xhtml#106)\n\
    \n![](img/#9781454933601_epub_cre_r1.xhtml#106-1) \n\n# 脸部识别\n\n脸部识别系统尝试从图像或视频中识别人物。某些现代系统使用\
    \ 3D 技术来捕捉特征。作为一种配置示例，也许这种通用人工智能（AGI）可以使用神经网络和进化算法来构建数百个独立的模块，这些模块将以日益增长的复杂、速度和效率进行通信和协作。\n\
    \n"
- fmt: "\nOf course, there may be many reasons why such a superintelligence would\
    \ be unlikely, such as the need to rely on slow humans and hardware networks.\
    \ On the other hand, it is possible that an intelligence explosion would also\
    \ immensely benefit humanity in the race to cure diseases and solve environmental\
    \ problems. But what would be the sociological effects of superintelligent weapons—or\
    \ even artificial companions that exhibited an intellect and (simulated) empathy\
    \ that is greater than our human spouses?\n\n**SEE ALSO** [“Darwin among the Machines”\
    \ (1863)](#9781454933601_epub_c025_r1.xhtml#c-025), [Lethal Military Robots (1942)](#9781454933601_epub_c038_r1.xhtml#c-038),\
    \ [The Human Use of Human Beings (1950)](#9781454933601_epub_c043_r1.xhtml#c-043),\
    \ [Leakproof “AI Box” (1993)](#9781454933601_epub_c079_r1.xhtml#c-079), [Paperclip\
    \ Maximizer Catastrophe (2003)](#9781454933601_epub_c089_r1.xhtml#c-089), [“Call\
    \ Them Artificial Aliens” (2015)](#9781454933601_epub_c093_r1.xhtml#c-093)\n\n\
    **AI expert systems are often created** by extracting the specialized knowledge\
    \ of human experts, artistically represented by glimmering lightbulbs in this\
    \ drawing. The expert information is converted into a set of probabilistic rules.\n\
    \n[![](OEBPS/images/110-1.jpg)](#9781454933601_epub_cre_r1.xhtml#110-1) \n\n#\
    \ 1965\n\n# EXPERT SYSTEMS\n\n![](OEBPS/images/L01.jpg)\n\nAccording to journalist\
    \ Luke Dormehl, AI “expert systems” are “attempts to create clones of flesh-and-blood\
    \ human experts . . . by extracting their specialized knowledge and turning it\
    \ into a set of probabilistic rules.” In a best-case scenario, expert systems\
    \ could, in principle, be used to cram the know-how of an expert gastroenterologist,\
    \ financial adviser, or lawyer into a computerized device, and have the resultant\
    \ AI systems give useful advice to all.\n\nExpert systems started to be explored\
    \ in the 1960s and made use of a knowledge base (containing representations of\
    \ facts and rules) and inference engines (to apply the rules and perform evaluations).\
    \ Rules might be of an “if-then” form, such as “If a patient with a particular\
    \ demographic exhibits a particular symptom, then there is a certain probability\
    \ that he or she has a particular condition.”\n\nApplications of expert systems\
    \ may broadly include diagnosis, prediction, planning, classifying, and related\
    \ areas involving specialized domains of expertise, in areas ranging from medicine\
    \ to evaluating insurance risks or potential locations for mineral exploration.\
    \ Useful expert systems also often have inference engines that can provide explanations,\
    \ so that users can understand the chain of reasoning. An example of a famous\
    \ early expert system is `Dendral` (short for `Dendritic Algorithm`), a Stanford\
    \ University project started in 1965 to help chemists identify unknown organic\
    \ molecules based on information from mass spectra. Another famous early example\
    \ is `MYCIN`, a Stanford University AI system developed in the 1970s to help diagnose\
    \ bacterial infections and recommend antibiotics and dosages. Early expert systems\
    \ were often coded in `LISP` or `Prolog`.\n\nOne of the challenges of expert systems\
    \ often involves acquiring and codifying knowledge from busy experts in particular\
    \ fields, or from books and papers. It can also be challenging to organize knowledge\
    \ into a collection of facts and rules that experts agree on, along with various\
    \ numerical weights applied (to signify likelihood or importance). Today, many\
    \ people use “recommender systems,” a somewhat related area of AI that is more\
    \ focused on predicting user preferences in areas ranging from movies and books\
    \ to financial services and potential marriage partners.\n\n**SEE ALSO** The Human\
    \ Use of Human Beings (1950)](#9781454933601_epub_c043_r1.xhtml#c-043), [Knowledge\
    \ Representation and Reasoning (1959)](#9781454933601_epub_c059_r1.xhtml#c-059),\
    \ [Deep Learning (1965)](#9781454933601_epub_c065_r1.xhtml#c-065)\n\nThe Human\
    \ Use of Human Beings (1950)](#9781454933601_epub_c043_r1.xhtml#c-043), [Knowledge\
    \ Representation and Reasoning (1959)](#9781454933601_epub_c059_r1.xhtml#c-059),\
    \ [Deep Learning (1965)](#9781454933601_epub_c065_r1.xhtml#c-065)\n\nIn the expression\
    \ `if-then`, the logic is applied to specific conditions. The design `if-then-c051_r1.xhtml#c-051`\
    \ and `9781454933601_epub_c058_r1.xhtml#c-058` refers to specific implementations.\n\
    \n[![](OEBPS/images/112-1.jpg)](#9781454933601_epub_cre_r1.xhtml#112-1)\n\n# 1965\n\
    \n# FUZZY LOGIC\n\n![](OEBPS/images/L01.jpg)\n\n“Fuzzy set has been used in commercial\
    \ applications,” writes Carter. Classical two-valued logic is concerned with either\
    \ true or false, whereas FL allows a continuous range of truth. Classical two-valued\
    \ logic is concerned with either true or false. Fuzzy set theory, which focuses\
    \ on members of, was introduced by mathematician and computer scientist Lotfi\
    \ Zadeh (1921–2017) in 1965, and in 1973 he provided.\n\nAs an example, a membership\
    \ function may exist for cold, warm, and hot, but values such as “not cold,” “slightly\
    \ warm,” and “slightly hot.”\n\nOne milestone in the history of fuzzy logic occurred\
    \ in 1974, when Ebrahim Mamdani (1942–2010) of the University of London used it.\
    \ In 1980, FL was used in cement kiln. Various Japanese companies have used FL.\n\
    \n**SEE ALSO** [Expert Systems (1965)](#9781454933601_epub_c056_r1.xhtml#c-056)\n"
  raw: "Of course, there may be many reasons why such a superintelligence would be\
    \ unlikely, such as the need to rely on slow humans and hardware networks. On\
    \ the other hand, it is possible that an intelligence explosion would also immensely\
    \ benefit humanity in the race to cure diseases and solve environmental problems.\
    \ But what would be the sociological effects of superintelligent weapons—or even\
    \ artificial companions that exhibited an intellect and (simulated) empathy that\
    \ is greater than our human spouses?\n\n**SEE ALSO** [“Darwin among the Machines”\
    \ (1863)](#9781454933601_epub_c025_r1.xhtml#c-025), [Lethal Military Robots (1942)](#9781454933601_epub_c038_r1.xhtml#c-038),\
    \ [*The Human Use of Human Beings* (1950)](#9781454933601_epub_c043_r1.xhtml#c-043),\
    \ [Leakproof “AI Box” (1993)](#9781454933601_epub_c079_r1.xhtml#c-079), [Paperclip\
    \ Maximizer Catastrophe (2003)](#9781454933601_epub_c089_r1.xhtml#c-089), [“Call\
    \ Them Artificial Aliens” (2015)](#9781454933601_epub_c093_r1.xhtml#c-093)\n\n\
    **AI expert systems are often created** by extracting the specialized knowledge\
    \ of human experts, artistically represented by glimmering lightbulbs in this\
    \ drawing. The expert information is converted into a set of probabilistic rules.\n\
    \n[![](OEBPS/images/110-1.jpg)](#9781454933601_epub_cre_r1.xhtml#110-1) \n\n#\
    \ 1965\n\n# EXPERT SYSTEMS\n\n![](OEBPS/images/L01.jpg)\n\nAccording to journalist\
    \ Luke Dormehl, AI “expert systems” are “attempts to create clones of flesh-and-blood\
    \ human experts . . . by extracting their specialized knowledge and turning it\
    \ into a set of probabilistic rules.” In a best-case scenario, expert systems\
    \ could, in principle, be used to cram the know-how of an expert gastroenterologist,\
    \ financial adviser, or lawyer into a computerized device, and have the resultant\
    \ AI systems give useful advice to all.\n\nExpert systems started to be explored\
    \ in the 1960s and made use of a knowledge base (containing representations of\
    \ facts and rules) and inference engines (to apply the rules and perform evaluations).\
    \ Rules might be of an “if-then” form, such as “If a patient with a particular\
    \ demographic exhibits a particular symptom, then there is a certain probability\
    \ that he or she has a particular condition.”\n\nApplications of expert systems\
    \ may broadly include diagnosis, prediction, planning, classifying, and related\
    \ areas involving specialized domains of expertise, in areas ranging from medicine\
    \ to evaluating insurance risks or potential locations for mineral exploration.\
    \ Useful expert systems also often have inference engines that can provide explanations,\
    \ so that users can understand the chain of reasoning. An example of a famous\
    \ early expert system is Dendral (short for Dendritic Algorithm), a Stanford University\
    \ project started in 1965 to help chemists identify unknown organic molecules\
    \ based on information from mass spectra. Another famous early example is MYCIN,\
    \ a Stanford University AI system developed in the 1970s to help diagnose bacterial\
    \ infections and recommend antibiotics and dosages. Early expert systems were\
    \ often coded in LISP or Prolog.\n\nOne of the challenges of expert systems often\
    \ involves acquiring and codifying knowledge from busy experts in particular fields,\
    \ or from books and papers. It can also be challenging to organize knowledge into\
    \ a collection of facts and rules that experts agree on, along with various numerical\
    \ weights applied (to signify likelihood or importance). Today, many people use\
    \ “recommender systems,” a somewhat related area of AI that is more focused on\
    \ predicting user preferences in areas ranging from movies and books to financial\
    \ services and potential marriage partners.\n\n**SEE ALSO** [*The Human Use of\
    \ Human Beings* (1950)](#9781454933601_epub_c043_r1.xhtml#c-043), [Knowledge Representation\
    \ and Reasoning (1959)](#9781454933601_epub_c051_r1.xhtml#c-051), [Deep Learning\
    \ (1965)](#9781454933601_epub_c058_r1.xhtml#c-058)\n\n**Diagram from US patent\
    \ 5,579,439** that provides a fuzzy logic design for an intelligent controller\
    \ in a plant-control system. The design includes an artificial neural network\
    \ for generating fuzzy logic rules and membership functions data. “The fuzzification\
    \ layer of the learning mechanism neural network can be constructed of four layers\
    \ A, B, C, D of neurons.”\n\n[![](OEBPS/images/112-1.jpg)](#9781454933601_epub_cre_r1.xhtml#112-1)\
    \ \n\n# 1965\n\n# FUZZY LOGIC\n\n![](OEBPS/images/L01.jpg)\n\n“Fuzzy set theory\
    \ has been used in commercial applications of expert systems and control devices\
    \ for trains and elevators,” writes scientist Jacoby Carter. “It has also been\
    \ combined with neural nets to control the manufacture of semiconductors. By incorporating\
    \ fuzzy logic and fuzzy sets in production systems, significant improvements have\
    \ been gained in many AI systems. This approach has been particularly successful\
    \ with ambiguous data sets or when the rules are imperfectly known.”\n\nClassical\
    \ two-valued logic is concerned with conditions that are either true or false.\
    \ Fuzzy set theory, which focuses on members of a set that have *degrees* of membership,\
    \ was introduced by mathematician and computer scientist Lotfi Zadeh (1921–2017)\
    \ in 1965, and in 1973 he provided the details of *fuzzy logic* (FL). Classical\
    \ two-valued logic is concerned with conditions that are either true or false,\
    \ whereas FL allows a continuous range of truth values.\n\nFL has a wide range\
    \ of practical applications. As an example, consider a temperature-monitoring\
    \ system for a device. A membership function may exist for the concepts cold,\
    \ warm, and hot, but a single measurement may consist of three values such as\
    \ “not cold,” “slightly warm,” and “slightly hot.” Zadeh believed that if feedback\
    \ controllers could be programmed to make use of imprecise, noisy input, they\
    \ could be more effective and easier to implement.\n\nOne milestone in the history\
    \ of fuzzy logic occurred in 1974, when Ebrahim Mamdani (1942–2010) of the University\
    \ of London used it to control a steam engine. In 1980, FL was used to control\
    \ a cement kiln. Various Japanese companies have used FL to control water-purification\
    \ processes and train systems. FL has also since been used to control steel mills,\
    \ self-focusing cameras, washing machines, fermentation processes, automobile-engine\
    \ controls, anti-lock braking systems, color-film developing systems, glass processing,\
    \ computer programs used in financial trading, and systems used for recognizing\
    \ subtle differences in written and spoken languages.\n\n**SEE ALSO** [Aristotle’s\
    \ *Organon* (c. 350 BCE)](#9781454933601_epub_c003_r1.xhtml#c-003), [Boolean Algebra\
    \ (1854)](#9781454933601_epub_c024_r1.xhtml#c-024), [Expert Systems (1965)](#9781454933601_epub_c056_r1.xhtml#c-056)\n\
    \n**Deep neural nets (DNNs)** contain multiple intermediate layers of artificial\
    \ neuron units (e.g., ranging from just a few layers to dozens of layers), which\
    \ increase the ability of DNNs to learn. DNNs comprise the “architecture” upon\
    \ which deep learning takes place.\n\n[![](OEBPS/images/114-1.jpg)](#9781454933601_epub_cre_r1.xhtml#114-1)\
    \ \n\n# 1965\n\n# DEEP LEARNING\n\n![](OEBPS/images/L01.jpg)\n\nArtificial intelligence\
    \ involves approaches that enable machines to mimic human intelligence. Machine\
    \ learning (see [page 99](#9781454933601_epub_c050_r1.xhtml#page99)) is a form\
    \ of AI that enables machines to improve at some task through practice and experience.\
    \ *Deep learning* is a form of machine learning that allows systems to train themselves\
    \ to perform tasks, like playing a game or recognizing a cat in a photo, using\
    \ deep neural nets (DNNs), which have multiple intermediate layers of artificial\
    \ neuron units, in contrast to shallow nets, which employ just a few layers. Although\
    \ the phrase *deep learning* was not introduced until 1986, Soviet mathematician\
    \ Alexey Ivakhnenko (1913–2007) conducted early work, in the form of supervised\
    \ deep multilayer perceptrons, in 1965."
