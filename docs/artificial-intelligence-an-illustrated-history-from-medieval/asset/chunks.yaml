    When describing his work, creativity, and sense of wonder, The New York Times
    wrote, “Pickover contemplates realms beyond our known reality.” According to WIRED,
    “Bucky Fuller thought big, Arthur C. Clarke thinks big, but Cliff Pickover outdoes
    them both.” The Christian Science Monitor proclaimed: “Pickover inspires a new
    generation of da Vincis to build unknown flying machines and create new Mona Lisas.”

    '
