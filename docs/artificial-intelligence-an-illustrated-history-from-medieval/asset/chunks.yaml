  trans: "\n\nTD-Gammon 是由 IBM 研究员 Gerald Tesauro 于 1992 年开发的，它采用人工神经网络，通过与自我对弈学习了专家级别的西洋双棋技巧。该程序在每个回合检查合法的移动，并更新神经网络内部的权重。因为它不需要人类训练，TD-Gammon\
    \ 探索了人类没有考虑过的有趣策略，这反过来教会了人类如何玩得更好。今天，已经存在多个使用神经网络并为人类提供分析的西洋双棋程序。\n\n由于西洋双棋受随机骰过程的影响，其“游戏树”搜索空间极其巨大，这阻碍了早期创建专家级程序的尝试。当使用神经网络时，网内的初始权重是随机的，并通过强化学习进行训练。为了达到水平，最初的\
    \ TD-Gammon 在神经网络中使用了四十个隐藏网络节点，并进行了 30 万场训练。随后的版本将隐藏节点增加到 160 个，训练场次增加到百万以上，以便达到与顶级人类相同的水平。\n\
    \n**另见** 人工神经网络（1943）, 强化学习（1951）, 模糊逻辑（1965）, 西洋跳棋与人工智能（1994）, 深蓝号击败国际象棋冠军（1997）\n\
    \n**想象你坐在一个封闭的房间里。** 你通过墙上的一个缝隙收到一张写有中文符号的纸。你不认识中文，但你可以查阅一套说明，这些说明教你如何编写适当的回答。这就是人工智能哲学中一个有趣问题的开始。\n\
    \n![](img/#9781454933601_epub_cre_r1.xhtml#138-1) \n\n# 1980\n\n# 中国房间实验\n\n![](img/L01.jpg)\n\
    \n电脑能有意识吗？`强人工智能`一词指的是配置适当的人工智能计算机系统实际上可能在思考并拥有意识的心，而`弱人工智能`指的是那些只能`表现`得像人类一样在思考并拥有心灵的系统。对计算机强人工智能理念的一种攻击来自哲学家约翰·塞尔尔（John\
    \ Searle，1932 年出生），他在 1980 年提出了他著名的“中国房间”实验。\n\n想象你坐在一个封闭的房间里。你通过墙上的一个缝隙收到一张写有汉字的纸。尽管你不认识中文，但你可以查阅一套说明，这些说明教你如何使用汉字编写适当的回答。根据这本说明指南，你在纸上写下一些字符，并通过缝隙向外部世界发送一个适当的回答。对于房间外的人来说，你似乎对中文有完全的理解；但当然，你只是在遵循规则，两张纸上的中文对你来说完全是乱码。\n\
    \n这个思想实验可能表明，计算机程序无法赋予电脑心灵、意识或理解力，即使电脑和它的程序看起来非常智能。然而，一些哲学家反驳说，即使你不懂中文，由你、封闭房间、一套说明以及你对说明的处理所组成的系统`确实理解`——`并且是一种存在于你之外且你并未察觉的意识`。\n\
    \n其他人还考虑过一种思想实验：在实验中，你的每个脑细胞可能一个接一个地缓慢被具有相同输入/输出功能的电子元件取代。显然，仅仅替换了几个细胞，你仍然是“你”。但也许一年后，你所有的细胞都将被替换，而在任何时候，你都不会突然失去产生意识和自我意识的能力。你仍然是“你”吗？\n\
    \n当然，对于大多数实用的人工智能任务，人工智能只需要地`表现`得智能就足够了。尽管如此，关于中国房间及其影响的辩论仍在激烈进行中。\n\n**另见** 图灵测试（1950）,\
    \ 自然语言处理（1954）, ELIZA 心理治疗师（1964）, 偏执狂 PARRY（1972）\n\n**在《银翼杀手》中，***类人人工智能复制人可以通过进行沃伊-坎普夫测试与人类区分来，该测试涉及研究细微的情绪反应和眼球运动。\n\
    \n![](img/#9781454933601_epub_cre_r1.xhtml#140-1) \n\n# 1982\n\n# 银翼杀手\n\n![](img/L01.jpg)\n\
    \n未来，智能机器人可能很难与人类区分，至少通过表面检查是如此。当那一天到来，这对人类关系产生什么影响？这个主题在许多著名的电影中被探讨过，其中一部特别有影响力的电影是\
    \ 1982 年的《银翼杀手》，由雷德利·斯科（Ridley Scott，1937 年出生）导演，基于菲利普·K·迪克（Philip K. Dick）1968\
    \ 年的小说《仿生人梦见电子羊吗？》。该电影设定在未来的洛杉矶，描述了必须被主角“退休”（杀死）的复制人。这些复制人与人类如此相似，可以通过沃伊-坎普夫测试。\n\
    \n反思《银翼杀手》中的瑞秋，作者兼研究员 Jelena Guga 写道：“人类渴望创造人工智能，但是他们可以控制的人工智能。……伦理、自由意志、记忆以及所有归属于人类的价值观，通过流行的类人机器人形象受到了质疑并被彻底定义，使其能够表达更多的人性。”\n\
    \n“我们应当如何对待人工形式成为一个日益重要的问题，”哲学家格雷·利特曼（Greg Littmann）写道，“随着人类不断开发复杂的计算机系统并在基因工程方面创造奇迹。像斯科特那种充满哲学噩梦式的电影在我们思考现实义务时非常有用，因为它们允许我们在假设的情况下测试我们的先入假设，以查看我们的理论是否一致。”\n\
    \n**另见** *大都会（1927）, 阿西莫夫机器人三大法则（1942）, 人工智能伦理（1976）, *终结者（1984）, 斯皮尔伯格的《人工智能》（2001）\n\
    \n**自动驾驶汽车利用各种技术感知周围环境。** 可能的自动驾驶水平从目前在许多汽车中存在的低水平（例如车道保持辅助和自动紧急制动）到完全不需要驾驶员关注的完全自治。\n\
    \n"
- fmt: "\n“The mundane automobile is about to disrupt your life,” write engineers\
    \ and authors Hod Lipson and Melba Kurman. “Thanks to rapid advances in mobile\
    \ robotics, cars are poised to morph into the first mainstream autonomous robots\
    \ that we will entrust with our lives. After almost a century of failed attempts\
    \ to automate driving, modern hardware technology, and a new generation of artificial-intelligence\
    \ software called `deep learning`, are giving cars human-level ability to safely\
    \ guide themselves through unpredictable environments.”\n\nSelf-driving cars,\
    \ also known as autonomous cars, are capable of driving and sensing their surroundings\
    \ without human input. The cars employ various technologies such as laser-based\
    \ `LIDAR` (for “light detection and ranging”), radar, the Global Positioning System\
    \ (`GPS`), and computer vision. Many potential benefits exist, including enhanced\
    \ mobility for the elderly and the impaired, and a reduction in traffic accidents,\
    \ especially when drivers or passengers are performing other activities in the\
    \ vehicle.\n\nMajor work began in this field in the 1980s. For example, the `DARPA`-funded\
    \ `Autonomous Land Vehicle` (`ALV`) project in the United States, begun in 1984,\
    \ demonstrated an eight-wheeled road-following vehicle with three diesel engines\
    \ propelling it at 3 mph. Sensors included a color video camera and a laser scanner,\
    \ with reasoning performed by `goal-seeking` and `navigator` computing modules.\
    \ In the twenty-first century, possible levels of autonomy range from low levels\
    \ that exist today in many cars (e.g., lane-keeping assistance and automatic emergency\
    \ braking) to complete autonomy, where no driver attention is ever required and\
    \ steering wheels may be optional.\n\nVehicles of high autonomy present many intriguing\
    \ conundrums. For example, in cases of an impending, inevitable crash, what rules\
    \ will be used to determine who to save? Does the safety of one passenger take\
    \ precedence over the safety of more than one pedestrian? Could terrorists load\
    \ a self-driving car with explosives and send it to a destination? Will hackers\
    \ alter the navigation system and cause accidents?\n\n**SEE ALSO** [Tesla’s “Borrowed\
    \ Mind” (1898)](#9781454933601_epub_c029_r1.xhtml#c-029), [Lethal Military Robots\
    \ (1942)](#9781454933601_epub_c038_r1.xhtml#c-038), [Ethics of AI (1976)](#9781454933601_epub_c068_r1.xhtml#c-068),\
    \ [ASIMO and Friends (2000)](#9781454933601_epub_c085_r1.xhtml#c-085), [AI on\
    \ Mars (2015)](#9781454933601_epub_c094_r1.xhtml#c-094), [Autonomous Robotic Surgery\
    \ (2016)](#9781454933601_epub_c096_r1.xhtml#c-096), [Adversarial Patches (2018)](#9781454933601_epub_c098_r1.xhtml#c-098)\n\
    \nThe Terminator outwardly resembles a human, but is a cybernetic creature with\
    \ living tissue over a robotic metallic endoskeleton.\n\n[![](OEBPS/images/144-1.jpg)](#9781454933601_epub_cre_r1.xhtml#144-1)\
    \ \n\n# 1984\n\n# THE TERMINATOR\n\n![](OEBPS/images/L01.jpg)\n\n“Primates evolved\
    \ over millions of years; I evolve in seconds. . . ,,” says the AI in *Terminator\
    \ Genisys*, the fifth installment of the *Terminator* movie series. “I am inevitable;\
    \ my existence is inevitable.”\n\nIn this popular movie series, the transition\
    \ of the AI to self-awareness takes place suddenly, when the `Skynet` supercomputer\
    \ goes online on August 4, 1997, to control the US military’s arsenal, and human\
    \ decisions are removed from the military’s strategic defense. `Skynet` begins\
    \ to learn at a geometric rate and becomes self-aware at 2:14 a.m. Eastern time\
    \ on August 29.\n\nIn 1984, James Cameron (b. 1954) directed the original *Terminator*\
    \ installment. In this movie, when humans realize that the AI defense network,\
    \ `Skynet`, has become self-aware, people panic and try to deactivate it. In an\
    \ attempt to protect itself, `Skynet` then triggers a nuclear holocaust, launching\
    \ a first nuclear strike against Russia that results in a war that kills roughly\
    \ three billion people. In *The Terminator*, a cyborg played by actor Arnold Schwarzenegger\
    \ (b. 1947) is sent back in time from 2029 to kill Sarah Connor before the birth\
    \ of her son, who would otherwise grow up to lead the survivors’ resistance against\
    \ `Skynet`.\n\nThroughout *The Terminator*, we obtain glimpses of what the Terminator\
    \ AI is seeing, in the form of heads-up information displays and decision-making\
    \ menus. The cyborgs’ alien style of thinking and ultra-efficient minds make them\
    \ particularly frightening. As one of the characters noted, a terminator “can’t\
    \ be bargained with. It can’t be reasoned with. It doesn’t feel pity, or remorse,\
    \ or fear! And it absolutely will not stop, ever, until you are dead!”\n\nToday,\
    \ the rise of killer robots may not be so far-fetched, given the development of\
    \ killer drones with Hellfire missiles.\n\n**SEE ALSO** [Lethal Military Robots\
    \ (1942)](#9781454933601_epub_c038_r1.xhtml#c-038), [Ethics of AI (1976)](#9781454933601_epub_c068_r1.xhtml#c-068),\
    \ [Intelligence Explosion (1965)](#9781454933601_epub_c055_r1.xhtml#c-055), [HAL\
    \ 9000 (1968)](#9781454933601_epub_c062_r1.xhtml#c-062), [Colossus: The Forbin\
    \ Project (1970)](#9781454933601_epub_c064_r1.xhtml#c-064), [Ethics of AI (1976)](#9781454933601_epub_c068_r1.xhtml#c-068)\n\
    \nTermite colonies seem to display a great deal of consciousness. Even though\
    \ an individual component of the hive mind is limited—a single termite has limited\
    \ capacity—the entire collection deplays emergent behavior and produces intelligent\
    \ solutions.\n\n[![](OEBPS/images/144-1.jpg)](#9781454933601_epub_cre_r1.xhtml#144-1)\
    \ \n\n# 1986\n\n# ARTIFICIAL LIFE\n\n![](OEBPS/images/L01.jpg)\n\nConsider hive\
    \ minds on Earth, like termite colonies, that seem to display a great deal of\
    \ consciousness. Even though an individual component of the hive mind is limited—a\
    \ single termite has limited capacity—the entire collection produces intelligent\
    \ solutions. Termites create huge, intricate mounds that are taller than our Empire\
    \ State Building relative to their own height. These termites control the temperature\
    \ of the mound by altering its tunnel structure, and thus the component termites\
    \ come together to create a warm-blooded super-organism. Is the hive conscious,\
    \ even if its components are not? Perhaps the decision making of the colony bears\
    \ some resemblance to the collective behavior of neurons in our brain.\n\nAmong\
    \ the most interesting models for artificial life are those in which complex,\
    \ lifelike behaviors arise from simple rules. The *field* of artificial life—coined\
    \ by biologist Christopher Langton in 1986—often involves researchers examining\
    \ simulations that can exhibit or imitate intelligent behavior. As an example,\
    \ consider `cellular automata`—a class of simple mathematical systems that can\
    \ model a variety of physical processes with complex behaviors. Some of the classic\
    \ cellular automata consist of a grid of cells, like a checkerboard, that can\
    \ exist in two states: occupied or unoccupied. The occupancy of one cell is determined\
    \ from a simple mathematical analysis of the occupancy of neighbor cells.\n\n\
    The most famous two-state, two-dimensional cellular automaton is the Game of Life,\
    \ invented in 1970 by mathematician John Conway (b. 1937). Despite its simple\
    \ rules, an amazing diversity of behaviors and forms multiply and evolve, including\
    \ gliders, which are arrangements of cells that move themselves across their universe\
    \ and can even interact to perform computations. Could such “creatures” be considered\
    \ alive?\n\nThe field of artificial life seems limitless, and other areas of this\
    \ field include the development of genetic algorithms that evolve and reproduce,\
    \ physical robotic swarms that exhibit lifelike behavior, and computer games like\
    \ *The Sims*, in which the player creates virtual people, places them in towns,\
    \ and tends to their needs and moods.\n"
  raw: "“The mundane automobile is about to disrupt your life,” write engineers and\
    \ authors Hod Lipson and Melba Kurman. “Thanks to rapid advances in mobile robotics,\
    \ cars are poised to morph into the first mainstream autonomous robots that we\
    \ will entrust with our lives. After almost a century of failed attempts to automate\
    \ driving, modern hardware technology, and a new generation of artificial-intelligence\
    \ software called deep learning, are giving cars human-level ability to safely\
    \ guide themselves through unpredictable environments. ”\n\nSelf-driving cars,\
    \ also known as autonomous cars, are capable of driving and sensing their surroundings\
    \ without human input. The cars employ various technologies such as laser-based\
    \ LIDAR (for “light detection and ranging”), radar, the Global Positioning System\
    \ (GPS), and computer vision. Many potential benefits exist, including enhanced\
    \ mobility for the elderly and the impaired, and a reduction in traffic accidents,\
    \ especially when drivers or passengers are performing other activities in the\
    \ vehicle.\n\nMajor work began in this field in the 1980s. For example, the DARPA-funded\
    \ Autonomous Land Vehicle (ALV) project in the United States, begun in 1984, demonstrated\
    \ an eight-wheeled road-following vehicle with three diesel engines propelling\
    \ it at 3 mph. Sensors included a color video camera and a laser scanner, with\
    \ reasoning performed by goal-seeking and navigator computing modules. In the\
    \ twenty-first century, possible levels of autonomy range from low levels that\
    \ exist today in many cars (e.g., lane-keeping assistance and automatic emergency\
    \ braking) to complete autonomy, where no driver attention is ever required and\
    \ steering wheels may be optional.\n\nVehicles of high autonomy present many intriguing\
    \ conundrums. For example, in cases of an impending, inevitable crash, what rules\
    \ will be used to determine who to save? Does the safety of one passenger take\
    \ precedence over the safety of more than one pedestrian? Could terrorists load\
    \ a self-driving car with explosives and send it to a destination? Will hackers\
    \ alter the navigation system and cause accidents?\n\n**SEE ALSO** [Tesla’s “Borrowed\
    \ Mind” (1898)](#9781454933601_epub_c029_r1.xhtml#c-029), [Lethal Military Robots\
    \ (1942)](#9781454933601_epub_c038_r1.xhtml#c-038), [Ethics of AI (1976)](#9781454933601_epub_c068_r1.xhtml#c-068),\
    \ [ASIMO and Friends (2000)](#9781454933601_epub_c085_r1.xhtml#c-085), [AI on\
    \ Mars (2015)](#9781454933601_epub_c094_r1.xhtml#c-094), [Autonomous Robotic Surgery\
    \ (2016)](#9781454933601_epub_c096_r1.xhtml#c-096), [Adversarial Patches (2018)](#9781454933601_epub_c098_r1.xhtml#c-098)\n\
    \n**The Terminator outwardly resembles a human,** but is a cybernetic creature\
    \ with living tissue over a robotic metallic endoskeleton.\n\n[![](OEBPS/images/144-1.jpg)](#9781454933601_epub_cre_r1.xhtml#144-1)\
    \ \n\n# 1984\n\n# *THE TERMINATOR*\n\n![](OEBPS/images/L01.jpg)\n\n“Primates evolved\
    \ over millions of years; I evolve in seconds. . . ,” says the AI in *Terminator\
    \ Genisys*, the fifth installment of the *Terminator* movie series. “I am inevitable;\
    \ my existence is inevitable.”\n\nIn this popular movie series, the transition\
    \ of the AI to self-awareness takes place suddenly, when the Skynet supercomputer\
    \ goes online on August 4, 1997, to control the US military’s arsenal, and human\
    \ decisions are removed from the military’s strategic defense. Skynet begins to\
    \ learn at a geometric rate and becomes self-aware at 2:14 a.m. Eastern time on\
    \ August 29.\n\nIn 1984, James Cameron (b. 1954) directed the original *Terminator*\
    \ installment. In this movie, when humans realize that the AI defense network,\
    \ Skynet, has become self-aware, people panic and try to deactivate it. In an\
    \ attempt to protect itself, Skynet then triggers a nuclear holocaust, launching\
    \ a first nuclear strike against Russia that results in a war that kills roughly\
    \ three billion people. In *The Terminator*, a cyborg played by actor Arnold Schwarzenegger\
    \ (b. 1947) is sent back in time from 2029 to kill Sarah Connor before the birth\
    \ of her son, who would otherwise grow up to lead the survivors’ resistance against\
    \ Skynet.\n\nThroughout *The Terminator*, we obtain glimpses of what the Terminator\
    \ AI is seeing, in the form of heads-up information displays and decision-making\
    \ menus. The cyborgs’ alien style of thinking and ultra-efficient minds make them\
    \ particularly frightening. As one of the characters noted, a terminator “can’t\
    \ be bargained with. It can’t be reasoned with. It doesn’t feel pity, or remorse,\
    \ or fear! And it absolutely will not stop, ever, until you are dead!”\n\nToday,\
    \ the rise of killer robots may not be so far-fetched, given the development of\
    \ killer drones with Hellfire missiles. It would be relatively easy to make such\
    \ a drone fully autonomous so that it makes decisions about who to target and\
    \ kill, based on machine learning and rules of engagement.\n\n**SEE ALSO** [Lethal\
    \ Military Robots (1942)](#9781454933601_epub_c038_r1.xhtml#c-038), [Intelligence\
    \ Explosion (1965)](#9781454933601_epub_c055_r1.xhtml#c-055), [HAL 9000 (1968)](#9781454933601_epub_c062_r1.xhtml#c-062),\
    \ [*Colossus: The Forbin Project* (1970)](#9781454933601_epub_c064_r1.xhtml#c-064),\
    \ [Ethics of AI (1976)](#9781454933601_epub_c068_r1.xhtml#c-068)\n\n**Termite\
    \ colonies** seem to display a great deal of consciousness. Even though an individual\
    \ component of the hive mind is limited—because a termite has limited capacity—the\
    \ entire collection of component creatures displays emergent behavior and produces\
    \ intelligent solutions.\n\n[![](OEBPS/images/146-1.jpg)](#9781454933601_epub_cre_r1.xhtml#146-1)\
    \ \n\n# 1986\n\n# ARTIFICIAL LIFE\n\n![](OEBPS/images/L01.jpg)\n\nConsider hive\
    \ minds on Earth, like termite colonies, that seem to display a great deal of\
    \ consciousness. Even though an individual component of the hive mind is limited—a\
    \ single termite has limited capacity, for example—the entire collection of components\
    \ displays emergent behavior and produces intelligent solutions. Termites create\
    \ huge, intricate mounds that are taller than our Empire State Building relative\
    \ to their own height. These termites control the temperature of the mound by\
    \ altering its tunnel structure, and thus the component termites come together\
    \ to create a warm-blooded super-organism. Is the hive conscious, even if its\
    \ components are not? Perhaps the decision making of the colony bears some resemblance\
    \ to the collective behavior of neurons in our brain.\n\nAmong the most interesting\
    \ models for artificial life are those in which complex, collective, lifelike\
    \ behaviors arise from simple rules. The *field* of artificial life—coined by\
    \ biologist Christopher Langton in 1986—often involves researchers examining simulations\
    \ that can exhibit or imitate intelligent behavior. As an example, consider *cellular\
    \ automata*—a class of simple mathematical systems that can model a variety of\
    \ physical processes with complex behaviors. Some of the classic cellular automata\
    \ consist of a grid of cells, like a checkerboard, that can exist in two states:\
    \ occupied or unoccupied. The occupancy of one cell is determined from a simple\
    \ mathematical analysis of the occupancy of neighbor cells.\n\nThe most famous\
    \ two-state, two-dimensional cellular automaton is the Game of Life, invented\
    \ in 1970 by mathematician John Conway (b. 1937). Despite its simple rules, an\
    \ amazing diversity of behaviors and forms multiply and evolve, including gliders,\
    \ which are arrangements of cells that move themselves across their universe and\
    \ can even interact to perform computations. Could such “creatures” be considered\
    \ alive?\n\nThe field of artificial life seems limitless, and other areas of this\
    \ field include the development of genetic algorithms that evolve and reproduce,\
    \ physical robotic swarms that exhibit lifelike behavior, and computer games like\
    \ *The Sims*, in which the player creates virtual people, places them in towns,\
    \ and tends to their needs and moods."
