  trans: "\n\n“普通的汽车即将彻底改变你的生活，”工程师兼作家霍德·利普森（Hod Lipson）和梅尔巴·库曼（Melba Kurman）写道。“得益于移动机器人技术的快速进步，汽车正演变为我们即将托付生命的首批主流自主机器人。在自动驾驶尝试了近一个世纪失败后，现代硬件技术和被称为`deep\
    \ learning`的新一代人工智能软件，正赋予了汽车人类水平的能力，使其能够在不可预测的环境中安全地引导自己。”\n\n自动驾驶汽车也称为无人驾驶汽车，能够在人工干预的情况下驾驶并感知周围环境。这些汽车采用了多种技术，例如基于激光的`LIDAR`（“激光探测与测量”）、雷达、全球定位系统（`GPS`）以及计算机视觉。这具有许多潜在优势，包括提高老年人和残障人士的活动能力，以及减少交通事故，特别是当驾驶员或乘客在车内进行其他活动时。\n\
    \n该领域的主要工作始于 20 世纪 80 年代。例如，美国于 1984 年启动的由`DARPA`资助的“自主陆地车辆”（`ALV`）项目，展示了一辆拥有八个轮子的道路跟随车辆，它由三台柴油发动机驱动，速度为\
    \ 3 英里。传感器包括彩色视频摄像头和激光扫描仪，推理则由`goal-seeking`和`navigator`计算模块执行。在 21 世纪，可能的自主水平范围从目前存在于许多汽车中的低水平（例如车道保持辅助和自动紧急制动）到完全自主，在完全自主的情况下，完全不需要驾驶员的注意力，且方向盘可能是可选的。\n\
    \n高自主性车辆带来了许多引人入胜的难题。例如，在迫在眉睫且不可避免的碰撞情况下，将使用什么规则来决定救谁？一个乘客的安全是否高于多名行人的安全？恐怖分子是否会向自动驾驶汽车装载爆炸物并将其送到某地？黑客是否会修改导航系统并导致事故？\n\
    \n**另见** 特斯拉的“借来的思想”（1898）, 致命性军事机器人（1942）, AI 伦理（1976）, ASIMO 和朋友们（2000）, 火星上的\
    \ AI（2015）, 自主机器人手术（2016）, 对抗性补丁（2018）\n\n终结者外表像人类，但是一个控制论生物，在机器人金属骨骼上覆盖着活组织。\n\
    \n![](img/#9781454933601_epub_cre_r1.xhtml#144-1) \n\n# 1984\n\n# 终结者\n\n![](img/L01.jpg)\n\
    \n“灵长类进化了数百万年；而我在几秒钟内就进化……”《终结者：御战》（*终结者*电影系列的第五部）中的 AI 说道。“我是不可避免的；我的存在是不可避免的。”\n\
    \n在这个系列热门电影中，AI 向自我意识的转变突然发生：1997 年 8 月 4 日，`Skynet`超级计算机上线控制美国军军的武器库，人类的决策被从军队的战略防御中移除。`Skynet`开始以几何级数增长进行学习，并在美国东部时间\
    \ 8 月 29 日凌晨 2:14 获得自我意识。\n\n1984 年，詹姆斯·卡梅隆（James Cameron，1954 年出生）执导了首部《终结者》。在这部电影中，当人类意识到\
    \ AI 防御网络`Skynet`已产生自我意识时，人们陷入恐慌并试图将其关闭。为了保护自己，`Skynet`随后引发了核浩劫，对俄罗斯发动了第一次核打击，导致了一场杀死约\
    \ 30 亿人的战争。在《终结者》中，由演员阿诺德·施瓦辛格格（Arnold Schwarzenegger，1947 年出生）扮演的半人从 2029 年回到过去，在莎拉·康纳生儿子之前杀死她，否则这个儿子将长大并领导幸存者对`Skynet`进行反抗。\n\
    \n在整个《终结者》中，我们通过抬头信息显示器和决策菜单的形式，窥视了终结者 AI 看到的内容。这些半人那种外星般的思维方式和极高效的大脑使他们显得格为可怕。正如其中一个角色所说，一个终结者“无法谈判。无法理喻。它没有怜悯、愧疚或恐惧！而且它绝对不会停止，直到你死！”\n\
    \n今天，考虑到配备地狱火导弹的杀伤性无人机的发展，杀手机器人的出现可能并不遥远。\n\n**另见** 致命性军事机器人（1942）, AI 伦理（1976）,\
    \ 智能爆炸（1965）, HAL 9000（1968）, 巨像：：福尔宾计划（1970）, AI 伦理（1976）\n\n蚁群似乎表现出大量的意识。尽管群体智慧中的个体是有限的——单只蚂蚁的能力有限——但整个群体产生了涌现行为并提供了智能解决方案。\n\
    \n![](img/#9781454933601_epub_cre_r1.xhtml#144-1) \n\n# 1986\n\n# 人工生命\n\n![](img/L01.jpg)\n\
    \n想象地球上的群体智慧，例如蚁群，它们似乎表现出大量的意识。尽管群体智慧中的个体是有限的——单只蚂蚁的能力有限——但整个群体产生了智能解决方案。蚂蚁建造了巨大的蚁丘，相对于自身高度甚至超过了帝国大厦。蚂蚁通过改变隧道道结构来控制蚁丘的温度，因此个体蚂蚁聚集在一起创造了一个血热超级有机。群体有意识吗，即使它的个体没有？也许群体的决策过程与我们大脑中神经元的集体行为有些相似之处。\n\
    \n"
- fmt: "\n## SEE ALSO\n[Machine Learning (1959)](#9781454933601_epub_c050_r1.xhtml#c-050),\
    \ [Living in a Simulation (1967)](#9781454933601_epub_c060_r1.xhtml#c-060), [Genetic\
    \ Algorithms (1975)](#9781454933601_epub_c067_r1.xhtml#c-067), [Swarm Intelligence\
    \ (1986)](#9781454933601_epub_c075_r1.xhtml#c-075), [Tamagotchi (1996)](#9781454933601_epub_c081_r1.xhtml#c-081),\
    \ [“Call Them Artificial Aliens” (2015)](#9781454933601_epub_c093_r1.xhtml#c-093)\n\
    \n**Ant-colony optimization** is a method for finding solutions using simulated\
    \ ants, inspired by actual ants finding solutions. Shown here are ants, forming\
    \ a living bridge to a leaf.\n\n[![](OEBPS/images/148-1.jpg)](#9781454933601_epub_cre_r1.xhtml#148-1)\
    \ \n\n# 1986: SWARM INTELLIGENCE\n\n![](OEBPS/images/L01.jpg)\n\nTermite mounds\
    \ can reach over 17 feet (5m) in height, with termites acting like simple “novelty\
    \ detectors,” responding to changes in air characteristics within the mound and\
    \ altering the structure as needed. Authors Doris and David Jonas speculate: “What\
    \ is the other way of knowing, by which the termites know what they have to do\
    \ and when they have to do it? Instructions cannot be brought to them quickly\
    \ enough by messengers, since the distances within the hill are far too great.\
    \ . . . A group brain functions as an instrument for decision-making in a way\
    \ startlingly like an intelligent individual brain.”\n\nThe apparent collective\
    \ intelligence in these social insects, as well as that in flocking and herd animals,\
    \ inspired the concept of `swarm intelligence`. In AI, this concept is employed\
    \ to deal with a range of challenges. The software agents follow simple, local\
    \ rules and, as with ants and termites, there is no central controller dictating\
    \ the behavior of the collective. As just one example, Boids, an artificial life\
    \ program developed in 1986 by computer scientist Craig Reynolds (b. 1953), simulates\
    \ the flocking behavior of birds by following simple rules involving a bird steering\
    \ toward the average heading of birds in the flock, steering to move toward the\
    \ average position of birds, and steering to avoid excessive crowding.\n\nOne\
    \ of the numerous swarm methods studied in AI today is `ant-colony optimization`,\
    \ a method using simulated ants that records their positions and quality of solutions\
    \ to help ants in the colony determine better solutions. In some implementations,\
    \ these “ants” simulate attractive chemical trails (pheromones) that evaporate\
    \ over time. `Particle-swarm optimization` simulates the position and velocity\
    \ of a swarm of fish toward an optimal location. Other interesting methods are\
    \ artificial immune systems, bee-colony optimization algorithms, firefly optimization\
    \ algorithms, bat algorithms, cuckoo searches, and roach-infestation optimization.\n\
    \nThe applications of swarm intelligence include control of autonomous vehicles,\
    \ routing in telecommunication networks, scheduling of aircraft, art creation,\
    \ enhancing systems for reactive power and voltage control, and clustering of\
    \ gene-expression data.\n\n## SEE ALSO\n[Machine Learning (1959)](#9781454933601_epub_c050_r1.xhtml#c-050),\
    \ [Living in a Simulation (1967)](#9781454933601_epub_c060_r1.xhtml#c-060), [Genetic\
    \ Algorithms (1975)](#9781454933601_epub_c067_r1.xhtml#c-067), [Artificial Life\
    \ (1986)](#9781454933601_epub_c074_r1.xhtml#c-074), [“Elephants Don’t Play Chess”\
    \ (1990)](#9781454933601_epub_c078_r1.xhtml#c-078)\n\n**Some challenges** that\
    \ are relatively easy for children, including sensorimotor tasks, turn out to\
    \ be among the most difficult for AI entities.\n\n[![](OEBPS/images/150-1.jpg)](#9781454933601_epub_cre_r1.xhtml#150-1)\
    \ \n\n# 1988: MORAVEC’S PARADOX\n\n![](OEBPS/images/L01.jpg)\n\n“If you wanted\
    \ to beat Magnus Carlsen, the world chess champion, you would choose a computer,”\
    \ writes journalist Larry Elliott. “If you wanted to clean the chess pieces after\
    \ the game, you would choose a human being.” This is the essence of Moravec’s\
    \ paradox, emphasized by several AI researchers in the 1980s, who ironically noted\
    \ that the seemingly difficult tasks involving high-level reasoning were becoming\
    \ easier and easier for computers to perform. At the same time, seemingly easy\
    \ tasks that involve human sensorimotor skills (e.g., walking and picking up a\
    \ piece of lint from a shoe) can be quite difficult for computerized systems.\
    \ The paradox is named after roboticist Hans Moravec, who wrote in his 1988 book\
    \ *Mind Children* that “it is comparatively easy to make computers exhibit adult-level\
    \ performance on intelligence tests or playing checkers, and difficult or impossible\
    \ to give them the skills of a one-year-old.”\n\nMoravec has noted that millions\
    \ of years of evolution contributed to our ability to perform tasks nearly unconsciously,\
    \ like recognizing faces and voices, which are so necessary for survival. As elegantly\
    \ summarized by cognitive scientist Steven Pinker (b. 1954), Moravec’s paradox\
    \ means that future human workers may be left with lower-paying jobs that have\
    \ been around for centuries, even millennia: “The main lesson of thirty-five years\
    \ of AI research is that the hard problems are easy and the easy problems are\
    \ hard. The mental abilities of a four-year-old we take for granted—recognizing\
    \ a face, walking across a room, answering a question—in fact solve some of the\
    \ hardest engineering problems conceived. . . . As the new generation of intelligent\
    \ devices appears, it will be the stock analysts and petrochemical engineers and\
    \ parole board members who are in danger of being replaced. The gardeners, receptionists,\
    \ and cooks are secure in their jobs for decades to come.”\n\n## SEE ALSO\n[“Darwin\
    \ among the Machines” (1863)](#9781454933601_epub_c025_r1.xhtml#c-025), [Turing\
    \ Test (1950)](#9781454933601_epub_c042_r1.xhtml#c-042), [Licklider’s “Man-Computer\
    \ Symbiosis” (1960)](#9781454933601_epub_c052_r1.xhtml#c-052), [“Elephants Don’t\
    \ Play Chess” (1990)](#9781454933601_epub_c078_r1.xhtml#c-078)\n\n**A Connect\
    \ Four game in progress,** using yellow and red discs, which slide to the bottommost\
    \ open locations under the influence of gravity.\n\n[![](OEBPS/images/152-1.jpg)](#9781454933601_epub_cre_r1.xhtml#152-1)\
    \ \n\n# 1988: CONNECT FOUR\n\n![](OEBPS/images/L01.jpg)\n\nFor a Christmas present,\
    \ Toby Walsh (b. 1964), a professor of artificial intelligence at the University\
    \ of New South Wales, once gave his father a program that perfectly plays the\
    \ game of Connect Four^®. His dad, who had previously loved playing the game,\
    \ remarked that the program took the fun out of the game, and Walsh had to agree.\
    \ When smartphones become superior to humans in virtually all games and creative\
