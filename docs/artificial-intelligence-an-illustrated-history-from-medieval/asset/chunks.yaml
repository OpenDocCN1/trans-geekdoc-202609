    人工神经网络（ANNs）受到生物神经网络的启发，是实现机器学习的一种手段，通过它，计算机展现了无需为特定任务进行显式编程即可学习的能力。计算机科学中的“深度学习”概念包含了多层的人工神经网络，这允许构建丰富的中间表示。与人工神经网络相关的一个挑战是，输入有时会被刻意操纵，导致人工神经网络被欺骗而给出显然错误的答案。此外，要理解神经网络如何以及为何提供特定的答案也是困难的。尽管如此，考虑到神经网络最近的有用应用，Google
    AI 专家杰夫·迪恩（Jeff Dean，生于 1968）曾说：“进化出眼睛的进化阶段是一项巨大的进展。现在计算机有了眼睛。”


    **另见** 强化学习 (1951), 感知器 (1957), 机器学习 (1959), 深度学习 (1965), 计算机艺术与深梦 (2015)


    **ENIAC**（电子数值积分计算机）是首批电子式、可编程的数字计算机之一，用于解决广泛的计算问题。该机器包含了超过 17,000 个真空管。


    ![](img/#9781454933601_epub_cre_r1.xhtml#78-1)


    # 1946


    # ENIAC


    ![](img/L01.jpg)


    1946 年的报纸头条对 ENIAC 和思考机器的未来感到欣喜若狂。《费城询问者报》（The Philadelphia Inquirer）写道：“机械大脑扩大了人类的视野”，“克利夫兰平民报》（The
    Cleveland Plain Dealer）则宣布“计算器让人类羞愧”——并称它预示着“人类思想范围的新纪元”。所有媒体对电气化“思考”进展的关注，结合技术进步，自然引导世界开始考虑
    AI 的更多可能性。


    ENIAC 是 Electronic Numerical Integrator and Computer 的缩写，由美国科学家约翰·莫奇利（John Mauchly，1907–1980）和
    J. 普斯珀·埃克特（J. Presper Eckert，1919–1995）在宾夕法尼亚大学建造。这台设备是首批电子式、可编程的数字计算机之一，用于解决广泛的计算问题。ENIAC
    的原始目的是为美国陆军计算火炮射击表。然而，它的第一个重要应用涉及氢弹的设计。


    ENIAC 于 1946 年面，耗近 50 万美元，直到 1955 年 10 月 2 日关闭之前，它几乎处于连续运行状态。该机器包含超过 17,000 个真空管和约五千个手工焊接节点。使用一台
    IBM 卡片读取器和打孔机进行输入输出。1955 年，由 Jan der Spiegel 教授领导的工程学生小组在单个集成电路上制作了重达 30 吨的 ENIAC“复制品”！


    20 世纪 30 年代和 40 年代其他重要的电气机器包括美国的阿塔纳索夫-贝里计算机（Atanasoff–Berry Computer，1939 年 10
    月演示）、德国的 `Z3` 计算机（1941 年 5 月演示）和英国的巨石机（Colossus，1943 年 12 月演示）。然而，与 ENIAC 相比，这些机器要么不是全电子化的，要么不是通用的。ENIAC
    专利的作者（1947 年提交的第 120,606 号专利）写道：“随着日常使用的出现，速度已变得如此至关重要，以至于市场上没有一台机器能够满足现代计算的全部需求……本发明旨在将这些冗长的计算缩短至秒级。”


    **另见** 算盘 (约公元前 190 年), 贝贝的机械计算机 (1822), 巨大脑或思考的机器 (1949)


    一个“巨大脑”。这里展示的是哈佛大学一栋科学大楼内 `IBM 自动序列计算器 (ASCC)`（或哈佛 Mark I 计算机）的序列指示器和开关。


    ![](img/#9781454933601_epub_cre_r1.xhtml#80-1)


    # 1949


    # 巨大脑或思考的机器


    ![](img/L01.jpg)


    1949 年，美国计算机科学家埃德蒙·伯克利（Edmund Berkeley，1909–1988）出版了一本面向大众的著作，名为《巨大脑或思考的机器》（Giant
    Brains, or Machines That Think）。在书中，他对使用“大脑”和“思考”等词来描述计算机提出了问题：“随着日常使用的出现，速度已变得如此至关重要，以至于市场上没有一台机器能够满足现代计算的全部需求……本发明旨在将这些冗长的计算缩短至秒级……”


    令人惊叹的是，在写这本书时，电子计算机几乎不为人知。当时只有少数“巨大脑”，伯克利在书中讨论了它们，包括哈佛大学的 `IBM 自动序列计算器 (ASCC)`（哈佛
    Mark I）、州学院的 ENIAC、贝尔实验室的通用继电器计算器以及哈佛学生制造的逻辑真值计算器。伯克利在 1961 年于书的注释中指出，未来机器可能实现“直觉思维”：“直觉思维可能是对可能方案的快速运行，并对它们进行快速评估，使得人们在几乎没有意识到如何得出结论的情况下结论。因此，自然可以对计算机进行编程，使其展现出我们所说的直觉思维。”


    一个“巨大脑”。这里展示的是哈佛大学一栋科学大楼内 `IBM 自动序列计算器 (ASCC)`（或哈佛 Mark I 计算机）的序列指示器和开关。


