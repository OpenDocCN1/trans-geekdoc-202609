  trans: '

    如果 AI 方法和模型已经开始用于帮助决定谁获得工作机会、我们与谁约会、谁获得假释释放、谁可能患上精神疾病，以及如何自主驾驶汽车和无人机，那么我们将赋予未来的
    AI 多少对我们生活的控制权？随着它们越来越多地为我们做决定，AI 单元是否会容易被欺骗而犯下致命错误？AI 研究人员如何才能更好地理解为什么某些机器学习算法和架构比其他算法更有效，同时又让
    AI 研究人员更容易复现彼此的结果和实验？


    此外，我们如何能确保 AI 驱动的设备行为符合伦理？机器是否有一天会拥有与人类相同的心理状态和感受？毫无疑问，AI 机器将帮助我们思考新的思想，梦进新的梦想，成为我们虚弱的大脑的假体。对我而言，AI
    对对思维的局限性、人类的未来以及我们在称之为家的广阔时空景观中的位置培养出了一种永恒的好奇心。


    通过将 3 × 3 游戏扩展到更高维和更大的尺寸（例如这个 4 × 4 × 4 版本），并引入重力效应（每个棋子都会滑到最下方的可用位置），井字棋对人类和基于
    AI 的机器可以变得更具挑战性。


    ![](img/xii-1.jpg)


    # c. 公元前 1300 年：井字棋


    ![](img/L01.jpg)


    考古学家可以将所谓的“三连线游戏”追溯到公元前（BCE）1300 年左右的古埃及。对于井字棋（TTT），两名玩家 O 和 X 轮流在 3 × 3 网格的空格内标记自己的符号。先在水平、垂直或对角线上连续放置三个自己符号标记的玩家获胜。


    我们在这本书中对井字棋感兴趣，是因为由于其游戏树（节点是游戏中的位置，边代表移动）搜索非常简单，它经常被用作人工智能和计算机编程某些领域的入门。井字棋是一种“完美信息”游戏，因为所有玩家都知道发生过的所有移动。它也是一种没有随机性的序贯游戏，玩家轮流进行且避免使用骰子。


    井字棋可以被视为一种“原子”，几个世纪以来，更高级的位置类游戏分子是在此基础上构建的。通过细微的变体和扩展，简单的井字棋游戏变成了一项极佳的挑战，需要大量时间来掌握。数学家和谜题爱好者将井字棋扩展到更大的棋盘、更高的维度和奇特的棋面，例如通过边缘连接矩形或方形棋板形成环面（甜甜圈形状）或克因瓶（只有一个面的表面）。


    考虑一些井字棋的趣闻。玩家可以用 362,880 种（或 9!）方式放置 X 和 O 来填满井字棋盘。然而，在考虑所有在 5、6、7、8 和 9 步内结束的所有可能游戏时，井字棋有
    255,168 种可能的游戏。1960 年，MENACE AI 系统（一种由彩色珠和火柴盒组成的装置）通过强化学习学会了玩井字棋。20 世纪 80 年代初，计算机天才
    Danny Hillis、Brian Silverman 和朋友们制造了一个由 10,000 个 Tinkertoy 零件组成的可以玩井字棋的电脑。1998
    年，多伦多大学的研究人员和学生创造了一个机器人，与人类一起玩三维（4 × 4 × 4）井字棋。


    **另见**

    - `意识的磨坊 (1714)`

    - `强化学习 (1951)`

    - `四连棋 (1988)`

    - `黑白棋 (1997)`

    - `解决奥瓦里游戏 (2002)`


    来自 Thomas Bulfinch 的《塔洛斯的描绘》（`A depiction of Talos`），由艺术家 Sybil Tawse 创作（1920）。


    ![](img/2.jpg)


    # 公元前 400 年：塔洛斯


    ![](img/L01.jpg)


    “很多人熟悉塔洛斯的形象，”作者 Brian Haughton 写道，“通过 1963 年的电影《杰森与阿尔戈勇船》中作为青铜巨人的形象。但塔洛斯的想法源自何处，它可能是历史上第一个机器人吗？”


    根据希腊神话，塔洛斯是一个巨大的青铜自动机，他的工作是保护欧罗巴（克里特岛国王米诺斯的母亲）免受入侵者、海盗和其他敌人。塔洛斯被设定为每天绕克里特岛海岸线三圈。一种震慑敌人的方法是掷巨石。在其他时候，这个机器人会跳进火中直到发烫，然后抱住敌人将其烧死。塔洛斯有时被描绘成有翅膀的生物，正如在公元前
    300 年左右的法伊斯托硬币上发现的那样；其他陶画属于公元前。


    关于塔洛斯的创造和死亡有许多解释。在一种神话中，它是赫菲斯托（金属加工、冶金、火、铁匠和其他匠的神）应宙斯的要求制造。由于塔洛斯是自动机，他的内部结构没有人类复杂；事实上，塔洛斯只有一条从脖子到脚踝的血管。这条血管由脚踝处的青铜钉密封并防止泄漏。根据一个传说，女巫美德亚用死神（Keres）让他发疯，导致他掉了钉子。随后，神血（ichor）像融化的铅一样从他身上涌出，杀了他。


    塔洛斯只是古希腊人如何思考机器人和其他自动机的一个例子。另一个例子是考虑数学家阿基塔拉斯（公元前 428–347 年）的作品，他可能设计并制造了一个蒸汽驱动的、名为“鸽子”的自动飞行鸟。


    **另见**

    - `特西比亚的水钟 (约公元前 250 年)`

    - `兰斯洛特的铜质骑士 (约 1220 年)`

    - `魔像 (1580)`

    - `弗兰肯斯坦 (1818)`


    **这尊令人印象深刻的亚里士德胸像是希腊雕塑家利西普青铜原作的罗马复制品，他生活在公元四世纪。**


    ![](img/4.jpg)


    # 公元前 350 年：亚里士德的《工具论》


    ![](img/L01.jpg)


    希腊哲学家亚里士德（公元前 384–322 年）一生中提到的几个具有影响力的话题，直到今天的 AI 研究人员仍然感兴趣。在他的著作《政治学》中，亚里士德推测自动机有一天可以取代奴隶：“只有在一种条件下，我们可以想象经理不需要下属，主人也不需要奴隶。这种条件就是每个工具都能根据命令或通过智能预判来完成自己的工作，就像代达卢斯的塑像或赫菲斯托斯制造的三脚架一样，荷马曾描述它们‘会自己移动地进入奥林匹斯山的神灵会议’，仿佛织机可以自己织布，拨子可以自己弹奏琴弦。”

