- fmt: "\nAside from the automata, the Strasbourg clock features a perpetual calendar\
    \ (including a means to determine the calendar date of Easter), a display of solar\
    \ and lunar eclipses, and more. In 1896, author Fanny Coe wrote that the Strasbourg\
    \ clock “is almost like a small theater, there are so many people and animals\
    \ that have their little part to play. . . . The hours are struck by angels, and\
    \ at midday and midnight life-size figures of Christ and his twelve disciples\
    \ come from a door. . . . Then a gilded cock upon the upper turret of the clock\
    \ flaps its wings and crows.”\n\nThe scholar Julius Fraser writes: “Calendrical\
    \ science and clock craftsmanship evolved to make artifacts that explained and\
    \ praised the Christian universe. . . . [They were] forerunners of the later desires\
    \ to put the skills of scientists and artisans to use for the earthly benefit\
    \ of people.”\n\n**SEE ALSO** [Al-Jazari’s Automata (1206)](#9781454933601_epub_c007_r1.xhtml#c-007),\
    \ [Hesdin Mechanical Park (c. 1300)](#9781454933601_epub_c009_r1.xhtml#c-009),\
    \ [Jaquet-Droz Automata (1774)](#9781454933601_epub_c019_r1.xhtml#c-019)\n\n**Model\
    \ of Leonardo’s robot knight,** alongside its internal gears, pulleys, and cables.\n\
    \n[![](OEBPS/images/22-1.jpg)](#9781454933601_epub_cre_r1.xhtml#22-1) \n\n# c.\
    \ 1495\n\n## DA VINCI’S ROBOT KNIGHT\n\n![](OEBPS/images/L01.jpg)\n\n“Da Vinci’s\
    \ armored Robot Knight sat up; opened its arms and closed them, perhaps in a grabbing\
    \ motion; moved its head via a flexible neck; and opened its visor,” writes robotic\
    \ engineer Mark Rosheim, “perhaps to reveal a frightening physiognomy. Fabricated\
    \ of wood, brass, or bronze and leather, it was cable operated.”\n\nLeonardo da\
    \ Vinci (1452–1519), the Italian Renaissance polymath, had interests that ranged\
    \ from painting and architecture to anatomy and engineering. His journals include\
    \ depictions and studies of musical instruments, crank mechanisms, and the aforementioned\
    \ mechanical knight, drawn around the year 1495 in his `Codex Atlanticus` (Atlantic\
    \ Codex), a twelve-volume bound set of drawings and writings. The mechanism of\
    \ the Leonardo robot design—which featured articulated joints and movable arms,\
    \ jaw, and head—used a pulley system for moving the robot’s parts. The android\
    \ wore German-Italian medieval armor, could sit up and down, and had more than\
    \ one gear system that operated separately to control the upper and lower body.\
    \ Leonardo sketched models for other automatons that included birds and carts.\n\
    \nAlthough we do not know if Leonardo’s mechanical knight was ever built, similar\
    \ robots may have inspired other engineers, such as the Italo-Spanish engineer\
    \ Juanelo Turriano (c. 1500–1885), who built a mechanical monk, which used cables\
    \ and pulleys, for King Philip II of Spain, who attributed his son’s miraculous\
    \ recovery from a serious head injury to the divine intervention of a Franciscan\
    \ missionary named Didacus. Driven by a key-wound spring, the clockwork Didacus\
    \ walks while moving his mouth and arms in silent prayer. Today he is exhibited\
    \ at the Smithsonian Institution in Washington, DC, and is still operational.\n\
    \nReflecting on da Vinci’s robot knight, authors Cynthia Phillips and Shana Priwer\
    \ write “Leonardo’s robot design was a culmination of his research into anatomy\
    \ and geometry. What better way to combine mechanical science and human form?\
    \ He took the proportions and relationships inherent in Roman architecture and\
    \ applied them to the movement and life inherent in all living beings. In a way,\
    \ the robot was *Vitruvian Man* brought to life.”\n\n**SEE ALSO** [Talos (c. 400\
    \ BCE)](#9781454933601_epub_c002_r1.xhtml#c-002), [Lancelot’s Copper Knights (c.\
    \ 1220)](#9781454933601_epub_c008_r1.xhtml#c-008), [Tik-Tok (1907)](#9781454933601_epub_c030_r1.xhtml#c-030),\
    \ [Elektro the Moto-Man (1939)](#9781454933601_epub_c035_r1.xhtml#c-035)\n\n**The\
    \ Prague Golem.** In this artwork by Czech painter Eugene Ivanov, we see the golem\
    \ (large central figure) and rabbi Loew ben Bezalel (perched atop the monster’s\
    \ shoulder).\n\n[![](OEBPS/images/24-1.jpg)](#9781454933601_epub_cre_r1.xhtml#24-1)\
    \ \n\n# 1580\n\n## GOLEM\n\n![](OEBPS/images/L01.jpg)\n\nAccording to *The Forward*\
    \ news-paper, “Long before Stephen Hawking warned us about the dangers of *artificial\
    \ intelligence*, the legend of the *Golem* conveyed to Jews the same subliminal\
    \ message.” A golem from Jewish folklore is an animated creature, crafted from\
    \ clay. Probably the most famous golem is the one that Prague rabbi Loew Bezalel\
    \ (c. 1520–1609) allegedly created in 1580 to defend the Jews from anti-Semitic\
    \ attacks.\n\nA golem is usually inscribed with magical words. For example, according\
    \ to legend, golem creators sometimes wrote the name of God on its forehead, or\
    \ on its tongue. By erasing the first letter to form `met` (“death”), the golem\
    \ can be deactivated.\n\nSome old Jewish recipes for creating a golem required\
    \ a person to combine each letter of the Hebrew tetragrammaton (i.e., the name\
    \ of God), and then pronounce each letter. The word `golem` appears only once\
    \ in the Bible (Psalm 139), where it refers to an unformed body. The New International\
    \ Version translates it as: “All the days for me were written in your book before\
    \ one of them came to be.” In Hebrew, `golem` can signify “shapeless mass” or\
    \ “brainless” entity. As such, most golems in literature are depicted as dumb,\
    \ but they can be made to perform simple tasks. In fact, the challenge for the\
    \ golem creator was to finally stop the golem from carrying out or repeating a\
    \ task.\n\n**SEE ALSO** [Talos (c. 400 BCE)](#9781454933601_epub_c002_r1.xhtml#c-002),\
    \ [Lancelot’s Copper Knights (c. 1220)](#9781454933601_epub_c008_r1.xhtml#c-008),\
    \ [*Frankenstein* (1818)](#9781454933601_epub_c020_r1.xhtml#c-020)\n\n**The frontispiece\
    \ of *Leviathan*** by Thomas Hobbes, with an engraving by French artist Abraham\
    \ Bosse (1604–1676).\n\n[![](OEBPS/images/26-1.jpg)](#9781454933601_epub_cre_r1.xhtml#26-1)\
    \ \n\n# 1651\n\n## HOBBES’S *LEVIATHAN*\n\n![](OEBPS/images/L01.jpg)\n\nIn 1651,\
    \ English philosopher Thomas Hobbes (1588–1679) wrote *Leviathan*, a book that\
    \ focuses on the structure of society and its relationship with government. In\
    \ the book, Hobbes makes several statements that have caused science historian\
    \ George Dyson to refer to Hobbes as the “patriarch of artificial intelligence.”\
    \ For example, in his introduction, Hobbes compares the body to a mechanical engine:\
    \ “Nature (the art whereby God hath made and governs the world) is by the *art*\
    \ of man . . . imitated, that [man] can make an artificial animal. For seeing\
    \ life is but a motion of limbs, the beginning whereof is in some principal part\
    \ within; why may we say say that all *automata* (engines that move themselves\
    \ by springs and wheels as doth a watch) have an artificial life? For what is\
    \ the *heart* but a *spring*; and the *nerves* but so many *strings*; and the\
    \ *joints* but so many *wheels*, giving motion to the whole body . . . ?”\n"
