    **另见** 塔洛斯（约公元前 400 年）, 赫斯丁机械公园（约公元 1300 年）, 达芬奇的机器人骑士（约公元 1495 年）, 魔像（1580 年）,
    提刻玩具（1907 年）


    **赫斯丁公园。** 赫斯丁围墙花园的描绘（位于上方）。齿轮图像（位于下方）是幸运女神的拟人，转动着可能代表赫斯丁自动机的机制。（出自吉约·德·马肖的《命运的救赎》，法国，约公元
    1350–1356 年。巴黎国立图书馆副本，MS Fr. 1586，第 30v 页。）


    ![](img/#9781454933601_epub_cre_r1.xhtml#16-1)


    # 约公元 1300 年


    # 赫斯丁机械公园


    ![](img/L01.jpg)


    从公元 1300 年左右，法国东北部的赫斯丁公园演变成了一个以仿真真人动物而闻名的场所。赫斯丁自动机包括机器人、猴子、鸟类和一个计时装置。最早的赫斯丁机器是根据阿尔图瓦伯爵罗伯特二世（1250–1302
    年）的要求建造的。示例包括一座桥，上面有六组覆盖着獾皮毛的机械猴子，使它们看起来非常真实。一个机械野猪头装饰在凉亭的墙上。当罗伯特去世后，他的女儿马奥特（1268–1329
    年）成为创新的赞助者，并继续维护他的“娱乐引擎”。例如，在 1312 年，这些猴子被披上了新的皮毛，并添加了角，使它们看起来像恶魔一样。


    自动机公园的想法可能源于伊斯兰文化和工程师，同时也受到法国浪漫小说文学中自动机的影响。历史学家斯科·莱特西（Scott Lightsey）写道：“赫斯丁在欧洲人工奇观观念中的中心地位，表明了这种新的奇迹现象是如何用宫廷生活的动机取代超自然的偶然事件的。……技术创新允许他们开始在装饰华丽的厅堂和游乐园中，重新演现甚至是浪漫小说中传统的超自然主题。”


    多年来，赫斯丁的工作持续，对各种机械奇观进行了升级，包括一个能向观者说话的木制隐士、一只会说话的猫头鹰以及带有机械鸟的喷泉。挥动的猴子和其他自动机很可能是通过重量驱动机制操作，并带有时钟零件和/或液压装置。


    这些机器人装置为游客提供了一个更广泛自动化的愿景。正如历史学家西尔维奥·A·贝迪尼（Silvio A. Bedini）写道：“自动机在技术进步中的作用……具有相当意义。通过机械手段模仿生命的努力导致了机械原理的发展，并引发了复杂机制的产生，这些机制实现了技术的原始目标——减少或简化体力劳动。”


    **另见** 凯特西比奥的水力钟（约公元前 250 年）, 阿尔-贾扎利的自动机（1206 年）, 兰斯洛特的铜质骑士（约公元 1220 年）, 宗教自动机（1352
    年）, 沃康森的鸭子机器人（1738 年）, 凯·德罗沃自动机（1774 年）


    **一组旋转轮子和组合** 拉蒙·鲁鲁的《伟大艺术》（*Ars Magna*）。出自《极其伟大的导师雷蒙德·鲁鲁的圣圣页面》，1517 年。）


    ![](img/#9781454933601_epub_cre_r1.xhtml#18-1)


    # 约公元 1305 年


    # 拉蒙·鲁鲁的《伟大艺术》


    ![](img/L01.jpg)


    “对人工智能（AI）的追求……具有相当意义。”


