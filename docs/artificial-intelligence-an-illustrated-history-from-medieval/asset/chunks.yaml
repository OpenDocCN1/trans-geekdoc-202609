    \ [ASIMO and Friends (2000)](#9781454933601_epub_c085_r1.xhtml#c-085), [AI on\
    \ Mars (2015)](#9781454933601_epub_c094_r1.xhtml#c-094)\n\n**As computers become\
    \ more powerful,** perhaps someday we will be able to simulate entire worlds—fanciful\
