  trans: "\n\n最近一期的*经济学人杂志*将当今的语音识别设备比作“施放魔咒”，让人们能够“仅通过言语就能控制世界”。这让我们想起小说作家阿瑟·C·克拉克的断言：任何足够先进的技术与魔法无异。“这种快速新兴的语音计算技术证明了克拉克的观点。.\
    \ . . 对着空气说几个词，附近的设备就能实现你的愿望。”\n\n*语音识别*技术使机器能够识别口语，它有着很悠久的历史。1952 年，贝尔实验室开发了`AUDREY`系统，该系统利用真空管电路并能理解口语数字。十年后，IBM\
    \ 在 1962 年西雅图世博会上的`Shoebox`（鞋盒）机器可以听懂 16 个单词，包括从`0`到`9`的数字，如果它听听到如`plus`（加）之类的词，它就会执行算术运算。1987\
    \ 年，由美国玩具公司 Worlds of Wonder 提供的“Julie”娃娃可以理解一些简单的短语并进行回答。\n\n让机器识别语音的技术已经发生了巨大的变化。从历史上来看，它涉及到隐藏马尔可夫模型（`HMM`），这是一种预测声音是否对应某个单词的统计方法；而今天，识别技术大量深度学习（即具有多层的人工神经网络）来实现极高的准确率。例如，语音识别系统可能会在嘈杂环境中听到一串声音，并通过确定其在训练文本中遇到的各种单词和短语的概率，对所说内容进行若干“猜想”。特殊的软件应用程序可能了解特定短语使用的概率，并做出决定，例如，决定“腹主动脉动脉瘤”是应该被标记为高优先级还是低优先级，这取决于它是被放射科听写软件听到，还是在等待简单指令的汽车里被说出。\n\
    \n当然，如今，无数数字助手——分布在我们的家庭、汽车、办公室和手机中——都能对语音问题和指令做出响应，它们还可以帮助听写笔记。盲人和残障人士也可以从语音输入中受益。\n\
    \n**另见** 语音合成 (1939), 人工神经网络 (1943), 自然语言处理 (1954)\n\n**1954 年，在一项名为“乔治敦-IBM 实验”的研究项目的著名公开演示中**，俄语由一台形式为`IBM\
    \ 701`计算机（如所示的“电子大脑”自动翻译成了英语，该机器如图所示。\n\n![](img/#9781454933601_epub_cre_r1.xhtml#90-1)\
    \ \n\n# 1954\n\n# 自然语言处理\n\n![](img/L01.jpg)\n\n1954 年，IBM 的一份新闻稿宣布：“今天，我们首次通过一个电子‘大脑’将俄语翻译成了英语。.\
    \ . . 著名的 701 计算机. . . 在几秒钟内就将句子转换成了易读的英语。一个完全听不懂苏联语言的女孩在 IBM 打字卡上打出了这些俄语信息。”新闻稿继续解释道，“这个‘大脑’以每秒\
    \ 2.5 行的惊人速度在自动打印机上飞速打印出它的英语译文。”\n\n1971 年，计算机科学家特里·威诺格德（出生于 1946）编写了`SHRDLU`，该程序可以将“将红色区块移动到蓝色金字塔旁边”等人类指令翻译成物理动作。今天，*自然语言处理*（`NLP`）通常涉及许多人工智能领域，包括语音识别、自然语言理解（例如机器阅读理解）和语音合成。其目标之一是促进人机之间的自然交互。\n\
    \n自然语言处理的早期通常涉及复杂的人工创建规则集；但在 20 世纪 80 年代，NLP 越来越多地使用机器学习算法，这些算法通过分析大量的示例语言输入来学习规则。典型的自然语言处理任务可能涉及机器翻译（例如将俄语翻译成英语）、问答（例如“法国的首都是哪里？”）、情感分析（对某一话题的情绪和态度）等。通过分析来自文本、音频和视频的输入，NLP\
    \ 被应用于各个领域，包括邮件垃圾过滤、长文章信息摘要以及智能手机应用程序的问答。\n\n由于许多原因，NLP 具有挑战性。例如，在语音识别中，相邻相邻单词的声音会融合在一起，计算系统还必须考虑语法（即结构）、语义（即意义）和语用（即目的或目标）——以及语言中许多歧义情况，即单词在不同语文中具有不同的含义。今天，大量使用人工神经网络方法有助于提高准确性。\n\
    \n**另见** 语音合成 (1939), 人工神经网络 (1943), 图灵测试 (1950), 语音识别 (1952), 机器学习 (1959), 莱克利德的人机共生\
    \ (1960), ELIZA 心理治疗师 (1964), SHRDLU (1971), 偏执 PARRY (1972), 《危险问答》中的 Watson\
    \ (2011)\n\n**达特茅斯夏季研究项目**被认为是人工智能史上的一个重要事件，*人工智能*这一术语在该项目中开始被接受，该术语由计算机科学家约翰·麦卡锡（图中为\
    \ 1974 年的照片）提出。\n\n![](img/#9781454933601_epub_cre_r1.xhtml#92-1) \n\n# 1956\n\
    \n# 达特茅斯人工智能研讨会\n\n![](img/L01.jpg)\n\n"
- fmt: "\nDuring the meeting, Carnegie Mellon’s Allen Newell (1927–1992) and Herbert\
    \ Simon (1916–2001) presented their Logic Theorist, a program for proving theorems\
    \ in symbolic logic. Author Pamela McCorduck writes about the Dartmouth Workshop:\
    \ “They had in common a belief . . . that what we call thinking could indeed take\
    \ place outside the human cranium, that it could be understood in a formal and\
    \ scientific way, and that the best nonhuman instrument for doing it was the digital\
    \ computer.”\n\nPartly because of the complexity of AI technology, and because\
    \ meeting participants came and went on different dates, the expectations for\
    \ the conference were probably a bit too high. Nevertheless, the Dartmouth AI\
    \ workshop brought together a diverse group of researchers who influenced the\
    \ field for the next twenty years.\n\n**SEE ALSO** [Artificial Neural Networks\
    \ (1943)](#9781454933601_epub_c039_r1.xhtml#c-039), [Natural Language Processing\
    \ (1954)](#9781454933601_epub_c046_r1.xhtml#c-046), [Licklider’s “Man-Computer\
    \ Symbiosis” (1960)](#9781454933601_epub_c052_r1.xhtml#c-052)\n\n**The first version\
    \ of the perceptron** was implemented in software on an IBM 704 computer, pictured\
    \ here in a 1957 photo. The IBM 704 was among the first mass-produced computers\
    \ with floating-point arithmetic hardware.\n\n[![](OEBPS/images/94-1.jpg)](#9781454933601_epub_cre_r1.xhtml#94-1)\
    \ \n\n# 1957\n\n# PERCEPTRON\n\n![](OEBPS/images/L01.jpg)\n\nToday, artificial\
    \ neural networks (ANNs) are used in countless applications, including pattern\
    \ recognition (e.g., face recognition), time-series prediction (e.g., predicting\
    \ whether a stock price will rise), signal processing (e.g., filtering out noise),\
    \ and more. The basics of neural networks are discussed on [page 77](#9781454933601_epub_c039_r1.xhtml#page77),\
    \ and one historically important step on the ladder to fully functional ANNs were\
    \ `perceptrons`, developed in 1957 by psychologist Frank Rosenblatt (1928–1971).\
    \ In 1958, based partly on Rosenblatt’s enthusiasm, the *New York Times* proclaimed\
    \ that the perceptron was “the embryo of an electronic computer that [the Navy]\
    \ expects will be able to walk, talk, see, write, reproduce itself and be conscious\
    \ of its existence.”\n\nThe perceptron originally had three levels of connected\
    \ “neurons” (i.e., simple computational units). The first level was a 20 × 20\
    \ array of photocells corresponding to the retina of an eye. The second level\
    \ contained connector cells that received input from the photocells, the initial\
    \ connections of which were random. The third level consisted of output cells\
    \ that labeled the object placed in front of the machine (e.g., “triangle”). If\
    \ the perceptron guessed correctly (or incorrectly), researchers might strengthen\
    \ (or weaken) the electrical connections between the cells that led to the label.\n\
    \nThe first version was implemented in software on an IBM 704 computer. A second\
    \ version, the Mark 1 perceptron, was implemented in special hardware and was\
    \ a trainable machine that could learn to classify certain patterns by modifying\
    \ the strength of connections between the neurons. Mathematical weights were actually\
    \ encoded in potentio-meters, and changes in weights during the learning process\
    \ were performed by electric motors. It was hoped that the device could perform\
    \ a wide range of pattern-recognition tasks; but, alas, the hype and hope exceeded\
    \ the limitations of such a simple model. In fact, the 1969 book *Perceptrons*\
    \ by MIT’s Marvin Minsky (1927–2016) and Seymour Papert (1928–2016) explicitly\
    \ demonstrated the limitations of simple perceptrons and dampened interest in\
    \ this nascent field of machine learning. Later on, however, it became much clearer\
    \ that configurations of neurons with more layers could have immeasurable value\
    \ and applications.\n\n**SEE ALSO** [Artificial Neural Networks (1943)](#9781454933601_epub_c039_r1.xhtml#c-039),\
    \ [Machine Learning (1959)](#9781454933601_epub_c050_r1.xhtml#c-050), [Deep Learning\
    \ (1965)](#9781454933601_epub_c058_r1.xhtml#c-058)\n\n**The first version of**\
    \ American scientist and economist Francis Fukuyama (b. 1952) has called transhumanism—which\
    \ usually involves the use of technology to enhance mental and physical capacities—the\
    \ world’s most dangerous idea.\n\n![](OEBPS/images/96-1.jpg](#9781454933601_epub_cre_r1.xhtml#96-1)\
    \ \n\n# 1957\n\n# TRANHUMANISM\n\n![](OEBPS/images/L01.jpg)\n\n“The coming of\
    \ artificial intelligence will likely be the most significant event in the history\
    \ of man,” writes philosopher Zoltan. In *New Bottles*, published in 1957, biologist\
    \ Julian Huxley (1887–1975) coined the term *transhumanism* when he suggested\
    \ that the human species can . . transcend itself . . . by realizing new possibilities.\n\
    \nIf your body or mind could survive indefinitely, would “you” actually persist?\
    \ All of us are changed by our experiences—which means that you are nearly the\
    \ same person you were a year ago. However, if your normal or enhanced body survived\
    \ for a thousand years, gradual changes would accumulate, and perhaps an entirely\
    \ different person would eventually inhabit the body. “You” would no longer exist.\
    \ There would be no moment of death at which you had ceased to exist, but you\
    \ would slowly fade away over the millennia, like a sand castle being transformed\
    \ by an ocean.\n\n**SEE ALSO** [The Consciousness (1714)](#9781454933601_epub_c015_r1.xhtml#c-015),\
    \ [Searches for the Soul (1907)](#9781454933601_epub_c031_r1.xhtml#c-031), [Licklider’s\
    \ “Man-Computer Symbiosis” (1960)](#9781454933601_epub_c052_r1.xhtml#c-052), [Posthuman\
    \ (1964)](#9781454933601_epub_c039_r1.xhtml#c-039), [Machine Learning (1959)](#9781454933601_epub_c050_r1.xhtml#c-050),\
    \ [Deep Learning (1965)](#9781454933601_epub_c058_r1.xhtml#c-058)\n\nArtificial\
    \ intelligence expert Arthur Lee Samuel (1901–1990) is credited as being among\
    \ the first to use the term *machine learning*, which gained prominence in his\
    \ 1959 paper “Some Studies in Machine Learning Using the Game of Checkers,” published\
    \ in the *IBM Journal of Research and Development*. In the paper, he explained\
    \ that “programming computers to learn from experience” may eventually eliminate\
    \ much of the need for explicit, task-specific programming and instructions.\n\
    \n**In 2017, Stanford researchers developed a machine-learning algorithm** that\
    \ could outperform radiologists at diagnosing pneumonia. Shown here is a chest\
    \ X-ray indicating right pleural effusion.\n\n```\n![](OEBPS/images/98-1.jpg)\n\
    ```\n"
