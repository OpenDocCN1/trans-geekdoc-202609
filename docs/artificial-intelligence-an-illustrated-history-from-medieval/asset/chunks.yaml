  trans: "\n亚里士德还开创了逻辑学的系统研究。在他的《工具论》（`Organon`）著作中，他提供了探究真理和理解世界的方法。亚里士德工具箱中的主要工具是`三段论`，这是一种三步论证，例如：“所有女人都会死；克利奥帕特是一个女人；因此，克利奥帕特是会死的。”如果两个前提都是正确的，我们就知道结论必须是真的。亚里士德还区分了特殊概念和普遍概念（即一般类别）。`Cleopatra`是一个特殊概念术语，而`woman`和`mortal`是普遍概念术语。当使用普遍概念时，前面通常会有`all`、`some`或`no`等词。亚里士德分析了许多种可能的的三段论，并展示了其中哪些形式是有效的。\n\
    \n亚里士德将他的分析扩展到涉及模态逻辑的三段论——即包含`possibly`（可能）或`necessarily`（必然）等词的陈述。现代数学逻辑可以偏离亚里士德的方法论，或者将其工作扩展到其他类型的句子结构中，包括表达更复杂关系的句子以及涉及多个量词的句子，如这个句子所示：“没有人喜欢所有不喜欢某些男人的男人。”尽管如此，亚里士德对逻辑学的深奥研究被认为是人类最伟大的成就之一，为数学和人工智能的许多发展提供了早期动力。\n\
    \n**另参** 塔洛斯（公元前 400 年）, 布尔代数（1854）, 模糊逻辑（1965）\n\n**此处所示的水钟**并不具备克特西比奥斯（Ktesibios）的所有特征，但它提供了关于这些设备如何运作的说明。这出自亚伯拉罕·里斯（Abraham\
    \ Rees）于 1820 年编写《艺术、科学与文学百科全书》（*The Cyclopaedia or Universal Dictionary of Arts,\
    \ Sciences and Literature*）。\n\n![](img/#9781454933601_epub_cre_r1.xhtml#6-1)\
    \ \n\n# c. 公元前 250 年\n\n# 克特西比奥的水钟\n\n![](img/L01.jpg)\n\n“克特西比奥的水钟具有重要意义，因为它永远改变了我们对人造物体做什么的理解，”记者卢克·多梅尔（Luke\
    \ Dormehl）写道，“在克特西比奥钟之前，人们认为只有生物能够根据环境的变化改变自己的行为。在克特西比奥钟之后，自调节反馈控制系统成为了我们技术的一部分。”\n\
    \n希腊发明家克特西比奥（Ktesibios，或 Tesibius，活跃于公元前 285-222 年）在埃及亚历山大以其涉及水泵和水力学的设备而闻名。他的水钟，或`clepsydra`（字面意思是“水偷”），特别受到关注，因为它采用了一种反馈控制浮子的形式调节器，可以保持恒定的流量，从而使他的计时器能够提供准确的时间。\n"
- fmt: "\nIn his book *Artificial Intelligence*, psycho-logist Alan Garnham discusses\
    \ the Anti-kythera mechanism and notes: “Perhaps the principal line of development\
    \ that led to AI was the attempt to produce machines that took the drudgery out\
    \ of human intellectual endeavor and, at the same time, eliminated some of the\
    \ errors to which it is prone.” The Antikythera mechanism is an ancient geared\
    \ computing device that was used to calculate astronomical positions. Discovered\
    \ by sponge divers around 1900 in a shipwreck off the coast of the Greek island\
    \ Antikythera, the device is thought to have been built around 150–100 BCE. As\
    \ described by journalist Jo Marchant: “Among the salvaged hoard subsequently\
    \ shipped to Athens was a piece of formless rock that no one noticed at first,\
    \ until it cracked open, revealing bronze gearwheels, pointers, and tiny Greek\
    \ inscriptions. . . . A sophisticated piece of machinery consisting of precisely\
    \ cut dials, pointers, and at least thirty interlocking gear wheels, nothing close\
    \ to its complexity appears again in the historical record for more than a thousand\
    \ years, until the development of astronomical clocks in medieval Europe.”\n\n\
    A dial on the front of the device probably carried at least three hands—one indicating\
    \ the date and the other two indicating the positions of the sun and the moon.\
    \ The device was also probably used to track dates of ancient Olympic games, predict\
    \ solar eclipses, and indicate other planetary motions.\n\nThe Moon mechanism\
    \ uses a special train of bronze gears, two of which are linked with a slightly\
    \ offset axis to indicate the position and phase of the moon. As is known today\
    \ from Kepler’s Laws of Planetary Motion, the moon travels at different speeds\
    \ as it orbits Earth (e.g., faster when it is closer to Earth), and this speed\
    \ differential is modeled by the Antikythera mechanism, even though the ancient\
    \ Greeks were not aware of the actual elliptical shape of the orbit. Marchant\
    \ writes: “By turning the handle on the box you could make time pass forwards\
    \ or backwards, to see the state of the cosmos today, tomorrow, last Tuesday or\
    \ a hundred years in the future. Whoever owned this device must have felt like\
    \ master of the heavens.”\n\n**SEE ALSO** [Ktesibios’s Water Clock (c. 250 BCE)](#9781454933601_epub_c004_r1.xhtml#c-004),\
    \ [Abacus (c. 190 BCE)](#9781454933601_epub_c005_r1.xhtml#c-005), [Babbage’s Mechanical\
    \ Computer (1822)](#9781454933601_epub_c022_r1.xhtml#c-022)\n\n**An intricate\
    \ peacock basin** from al-Jazari’s *Book of Knowledge of Ingenious Mechanical\
    \ Devices* (opaque watercolor, gold, and ink on paper).\n\n[![](OEBPS/images/12-1.jpg)](#9781454933601_epub_cre_r1.xhtml#12-1)\
    \ \n\n# 1206\n\n# AL-JAZARI’S AUTOMATA\n\n![](OEBPS/images/L01.jpg)\n\nThe polymath,\
    \ inventor, artist, and engineer Ismail al-Jazari (1136–1206) lived during the\
    \ height of the Islamic Golden Age, following his father as the chief engineer\
    \ at the Artuklu Palace in Anatolia (present-day Diyarbakır, Turkey). Al-Jazari’s\
    \ *Book of Knowledge of Ingenious Mechanical Devices*—written at the request of\
    \ his royal employer and published the year al-Jazari died—contains descriptions\
    \ of numerous mechanical devices that al-Jazari had built, including moving human\
    \ and animal automata as well as water-raising machines, fountains, and clocks.\
    \ During his research and engineering, al-Jazari employed camshafts, crankshafts,\
    \ escapement wheels, segmental gears, and other sophisticated mechanisms.\n\n\
    Among his automata are moving peacocks driven by water, a waitress that serves\
    \ drinks, and a musical robot band of four automatic musicians in a boat with\
    \ changing facial expressions that were controlled by rotating shafts. Some researchers\
    \ have speculated that the movements of the robot band may have been programmable,\
    \ indicating an extra degree of technical sophistication. His elephant clock featured\
    \ a humanoid robot striking a cymbal at regular intervals, along with a robotic\
    \ bird that chirped as a scribe rotated, marking out time with his pen. Al-Jazari’s\
    \ 11-foot-tall (3.4 m) castle clock featured five automaton musicians.\n\nAccording\
    \ to English engineer and historian Donald R. Hill (1922–1994), who is famous\
    \ for his English translation of al-Jazari’s work, “It is impossible to over-emphasize\
    \ the importance of al-Jazari’s work in the history of engineering. Until modern\
    \ times there is no other document from any cultural area that provides a comparable\
    \ wealth of instructions for the design, manufacture, and assembly of machines.\
    \ No doubt this is partly due to the fact that there was usually a social and\
    \ cultural divide between those who made and those who wrote. When a scholar described\
    \ a machine that had been constructed by an illiterate craftsman, he was usually\
    \ interested in the finished product; he neither understood nor cared about the\
    \ messy business of construction. . . . We therefore owe a great debt to \\[al-Jazari’s\
    \ employer\\] for our possession of a unique document.”\n\n**SEE ALSO** [Ktesibios’s\
    \ Water Clock (c. 250 BCE)](#9781454933601_epub_c004_r1.xhtml#c-004), [Hesdin\
    \ Mechanical Park](#9781454933601_epub_c004_r1.xhtml#c-004), [1300](#9781454933601_epub_c004_r1.xhtml#c-009),\
    \ [1352](#9781454933601_epub_c004_r1.xhtml#c-011), [1774](#9781454933601_epub_c004_r1.xhtml#c-019)\n\
    \n**Lancelot battles the copper knight** to enter Doloreusee. The humanoid knights\
    \ are often depicted without clothing. (From *Lancelot*, 15th century. Paris,\
    \ BnF, MS. 118, fol. 200v.)\n\n[![](OEBPS/images/14-1.jpg)](#9781454933601_epub_cre_r1.xhtml#14-1)\
    \ \n\n# c. 1220\n\n# LANCELOT’S COPPER KNIGHTS\n\n![](OEBPS/images/L01.jpg)\n\n\
    Simple examples of AI, in the form of mechanical men and creatures, became common\
    \ in European medieval times, when as historian Elly Truitt writes, “Golden birds\
    \ and beasts, musical fountains, and robotic servants astound and terrify guests.\
    \ . . Automata stood at the intersection of natural knowledge (including magic)\
    \ and technology, and . . were troubling links between art and nature.”\n\nOne\
    \ famous example of fictional robots occurs in *Lancelot du lac* (*Lancelot of\
    \ the Lake*, c. 1220), an old French prose tale that recounts the adventures of\
    \ King Arthur and his Knights of the Round Table, including the secret romance\
    \ of Sir Lancelot and Arthur’s wife, Guinevere. While outside Doloreuse Garde,\
    \ a frightening enchanted castle, Lancelot encounters a small army of robotic\
    \ copper knights. After entering the castle, he defeats two sword-wielding copper\
    \ knights as they guard an internal chamber where a young copper woman holds the\
    \ keys to the enchantment. He uses the keys to open a box that contains thirty\
    \ copper tubes, from which come terrifying cries—and he quickly falls asleep.\
    \ Upon awakening, he finds that the copper woman has collapsed to the ground,\
    \ and the copper knights are shattered.\n\nHistorian Jessica Riskin writes: “The\
    \ automaton knights and damsels of Arthurian legend were accompanied by gold,\
    \ silver and copper children, satyrs, archers, musicians, oracles and giants.\
    \ These fictional artificial beings had plenty of real counterparts. Actual mechanical\
    \ people and animals thronged the landscape of late medieval and early modern\
    \ Europe.” As one example, around the same time as the tale of Lancelot’s copper\
    \ knights, French artist and engineer Villard de Honnecourt (c. 1225–c. 1250)\
    \ created a mechanical eagle that was designed to turn its head towards the deacon\
    \ when he read from the Gospel. Riskin notes that these lifelike automata provide\
    \ a context for scientific and philosophical models of living beings as machines\
    \ that emerged in the seventeenth century.\n"
