    “An attempt will be made to find how to make machines use language, form abstractions
    and concepts, solve the kinds of problems now reserved for humans, and improve
    themselves. . . . For the present purpose, the artificial intelligence problem
    is taken to be that of making a machine behave in ways that would be called intelligent
    if a human were so behaving.”


    —John McCarthy, Marvin Minsky, Nathaniel Rochester, and Claude Shannon, “Proposal
    for the Dartmouth Summer Research Project on Artificial Intelligence,” 1955


    “Artificial Intelligence can drive cars, trade stocks and shares, learn to carry
    out complex skills simply by watching YouTube videos, translate across dozens
    of different languages, recognize human faces with more accuracy than we can,
    and create original hypotheses to help discover new drugs for curing disease.
    That’s just the beginning.”


    —Luke Dormehl, *Thinking Machines*, 2017


    “Not until a machine can write a sonnet or compose a concerto because of thoughts
    and emotions felt, and not by the chance fall of symbols, could we agree that
    machine equals brain—that is, not only write it but know that it had written it.”


    —Professor Geoffrey Jefferson, “The Mind of Mechanical Man,” 1949


    “Whether we are based on carbon or on silicon makes no fundamental difference;
    we should each be treated with appropriate respect.”


    —Arthur C. Clarke, *2010: Odyssey Two*, 1984


    “Emerging as it does from many fields—philosophy, mathematics, psychology and
    even neurology—AI raises basic questions about human intelligence, memory, the
    mind/body problem, the origins of language, symbolic reasoning, information processing,
    and so forth. AI researchers are—like alchemists of old who sought to create gold
    from base metal—seeking to create thinking machines from infinitesimal small bits
    of silicon oxyde.”


    —Daniel Crevier, *AI: The Tumultuous History of the Search for Artificial Intelligence,*
    1993


    ![](OEBPS/images/L01.jpg)


    # INTRODUCTION


    “The period of time occupied by organic intelligence is just a thin sliver”


    —Martin Rees, *The Conversation*, April2017


    ## AI and Beyond


    “A lot of cutting edge AI has filtered into general applications, often without
    being AI, because once something becomes useful and common enough, it’s not labeled
    AI.”


    —Nick Bostrom, “AI Set to Exceed Human Power,” [*CNN.com`](http://CNN.com), 2006


    Throughout history, the mysteries of the mind, the nature of thought, and the
    possibility of artificial beings have captivated artists, scientists, philosophers,
    and even theologians. Symbols and stories involving `automata`—moving mechanical
    devices made in imitation of living beings—permeate myth, art, music, and literature.
    Our fascination with artificial intelligence (AI)—apparently intelligent behavior
    by machines—is also reflected in the spooky or transcendent themes of blockbuster
    films or video games.


    In this book, we’ll embark on a vast chronological journey from ancient games
    to advanced modern computing approaches involving artificial neural networks that
    learn and improve their performance, often with little or no task-specific programming
    and rules. Along the way, we’ll encounter odd and perplexing marvels like the
    mysterious copper knights of Arthurian legend. We’ll also encounter French inventor
    Jacques de Vaucanson’s Canard Digérateur, a hyper-realistic duck automaton that
    inspired American author Thomas Pynchon’s historical novel Mason & Dixon more
    250 years later, and the thirteenth-century Catalan philosopher Ramon Llull, who
    was among the first to explore a systematic approach to artificially generating
    ideas using a mechanical device. Skip forward to 1893, and we encounter the quirky
    and entertaining *Electric Bob’s Big Black Ostrich*, a story that—along with the
    series *The Steam Man of the Prairies*—is notable for reflecting the growing fervor
    for all things mechanical during the Victorian-era steampunk movement.


    In more recent times, we encounter Arthur Samuel of IBM, who implemented one of
    the earliest computer programs for playing checkers in 1952, followed in 1955
    by a program that *learned* to play the game without outside interference. Today,
    the term *artificial intelligence* often refers to systems designed to learn,
    solve problems, and interact with humans using natural-language processing. Intelligent
    personal assistants like Amazon’s Alexa, Apple’s Siri, and Microsoft’s Cortana
    all reflect some aspect of AI.

