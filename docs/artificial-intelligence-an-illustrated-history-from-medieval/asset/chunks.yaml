    `Colossus`, from the 1970 movie *Colossus: The Forbin Project*, is an advanced
    weapons defense system that becomes sentient. The AI system tells its creator
    “in time you will come to regard me not only with respect and awe, but with love.”


    [![](OEBPS/images/126-1.jpg)](#9781454933601_epub_cre_r1.xhtml#126-1)


    # 1970


    # COLOSSUS: THE FORBIN PROJECT


    ![](OEBPS/images/L01.jpg)


    Imagine waking up one morning and hearing the synthesized, robotic voice of `Colossus`,
    the AI system from the 1970 movie *Colossus: The Forbin Project*, an advanced
    weapons defense system that has become sentient. In the movie, `Colossus` participates
    in a worldwide broadcast, starting its speech with an ominous line: “This is the
    voice of world control.” `Colossus` then explains that if humanity agrees to its
    absolute authority without resisting, `Colossus` will bring a kind of peace and
    prosperity, solving problems of famine, overpopulation, war, and disease. If humans
    choose to fight `Colossus`, they will be destroyed. `Colossus` further explains
    that it will extend itself “into more machines devoted to the wider fields of
    truth and knowledge.” Finally, `Colossus` realizes that humans will complain that
    they have lost their freedom, but notes that being dominated by `Colossus` is
    better than being “dominated by others of your species.”


    Located deep within a mountain, `Colossus` cannot be tampered with and is designed
    to control the nuclear weapons of the United States and allies. It demonstrates
    that any attempt to disable it will result in nuclear retaliation against humans.


    The movie, directed by Joseph Sargent (1925–2014), is based on the science-fiction
    novel by British author and WWII naval commander Dennis F. Jones (1917–1981).
    Sargent’s technical advisors were inspired, in part, by the North American Aerospace
    Defense Command (`NORAD`), which provides aerospace warning and protection for
    the United States and Canada. During the making of the film, the `Control Data
    Corporation` actually loaned various impressive-looking computer equipment, which
    provided additional realism.


    Was `Colossus` actually bad for humanity? Might you give up more control to a
    computer system if it truly helped solve the problems of humankind? Would you
    if it made the world safer than the current approach of delegating nuclear annihilation
    to the judgment of a tiny number of individuals, who could conceivably be impaired
    by emotion, pre-Alzheimer’s, or other unproductive thinking? The question still
    looms.


    **SEE ALSO** [Lethal Military Robots (1942)](#9781454933601_epub_c038_r1.xhtml#c-038),
    [Intelligence Explosion (1965)](#9781454933601_epub_c055_r1.xhtml#c-055), [HAL
    9000 (1968)](#9781454933601_epub_c062_r1.xhtml#c-062), [Leakproof “AI Box” (1993)](#9781454933601_epub_c079_r1.xhtml#c-079)


    `SHRDLU` was a computer program that responded to natural-language commands to
    move virtual objects, such as blocks, in a virtual world. Today, robotic arms
    (in the real world) are often programmable and used in assembly lines and bomb
    disarmament.


    [![](OEBPS/images/128-1.jpg)](#9781454933601_epub_cre_r1.xhtml#128-1)


    # 1971


    # SHRDLU


    ![](OEBPS/images/L01.jpg)


    Imagine spending your life in a simple universe consisting of colored objects,
    like pyramids and cubes, that can be moved around at your will. This is the world
    of `SHRDLU`, developed in 1971 by computer scientist Terry Winograd (b. 1946).
    The `SHRDLU` program translated natural-language commands such as “Will you please
    stack up both of the red blocks and either a green cube or a pyramid” or “Find
    a pyramid that is taller than the one you are holding, and put it into the box”
    into physical actions. One could also ask questions about the history of this
    universe (e.g., “Did you pick up anything before the cube?”). Internally, it used
    the `LISP` language.


    In the preface of his 1971 PhD thesis, Winograd wrote: “Computers are being used
    today to take over many jobs. . . But when it comes to telling computers what
    to do, . . The name `SHRDLU` comes from ‘understand a lot of shroded world’.”


    For its time, `SHRDLU` was considered a big achievement. It also had a simple
    memory. However, despite its remarkable operation, `SHRDLU` was limited in that
    it could not learn.


    **SEE ALSO** [Natural Language Processing (1954)](#9781454933601_epub_c046_r1.xhtml#c-046),
    [Expert Systems (1965)](#9781454933601_epub_c056_r1.xhtml#c-056), [Shakey the
    Robot (1966)](#9781454933601_epub_c059_r1.xhtml#c-059)


    `PARRY was a computer program that responded to natural-language commands to move
    virtual objects.` `PARRY was paranoid` about the Mafia, dishonesties, horse racing,
    punishment for debts, and police collusion with the Mafia.


    [![](OEBPS/images/130-1.jpg)](#9781454933601_epub_cre_r1.xhtml#130-1)


    # 1972


    # PARANOID PARRY


    ![](OEBPS/images/L01.jpg)


    In 1972, psychiatrist Kenneth Colby (1920–2001) developed `PARRY`, a computer
    program intended to emulate a person with paranoid schizophrenia. Specifically,
    `PARRY` was developed to test theories of paranoid thinking, and the AI, which
    appeared to have delusions about the Mafia, had a knowledge representation involving
    feelings of self-inadequacy and protection against certain interview questions.


    `PARRY` handled conversations by assigning weights to various dialogue inputs.
    Interestingly, psychiatrists who interacted via text with `PARRY` failed to perceive
    that they were interviewing a computer program, and they also could not identify
    which “patients” were human and which were computer programs.

