  trans: "\n1989 年，科比创立了一家名为马里布人工智能工作公司（Malibu Artificial Intelligence Works）的公司，营销一种抑郁治疗方案。该程序被美国海军和退军人事务部使用，并分发给那些（争议在于）在咨询经过培训的心理医生的情况下使用它的人。科比告诉一位持怀疑的记者，他的抑郁治疗方案可能比人类治疗师更好，因为“毕竟，计算机不会疲倦、看不起你，也不会试图与你发生关系。”\n\
    \n**另见** 图灵测试 (1950), ELIZA 心理治疗师 (1964), 人工智能伦理 (1976)\n\n**NASA 航天器天线，** 由一种进化计算机设计程序发现，用于创建优越的辐射模式。该软件从随机天线设计开始，通过进化过程对其进行精炼。\n\
    \n![OEBPS/images/132-1.jpg](img/9781454933601_epub_cre_r1.xhtml#132-1) \n\n# 1975：遗传算法\n\
    \n![](img/L01.jpg)\n\n哲学家杰克·科普兰（Jack Copeland）写道：“人工生命和人工智能中都有一个重要的概念是`遗传算法`（`GA`）。”`GAs`\
    \ 采用类似于自然演化过程的方法，以产生连续多代的软件实体，这些实体会越来越适应其预定目标。”\n\n科学家约翰·霍兰德（John Holland,1929–2015）在其著名的\
    \ 1975 年著作《自然系统与人工系统的适应》（*Adaptation in Natural and Artificial Systems*）中开发并普及了遗传算法，算法可以使用受生物启发的方法（如选择、变异和交叉/重组）来解决现实世界的问题。通过遗传算法，人类并不直接编写解决方案；相反，解决方案通过模拟竞争、改进和演化产生。\n\
    \n这些算法通常从一组初始的随机解决方案或候选程序（种群）开始。`适应度函数`为每个程序分配一个适应度值，以指示该程序执行所需任务或达到结果的效果有多好。在演化的过程中，每个被评估的候选对象都有一系列可以随时间变异（改变）的属性。\n\
    \n科学家可能会发现很难理解遗传算法极其实用的输出。根据前 NASA 工程师杰森·洛恩（Jason Lohn）的说法，算法的有效性弥补了它的不可理解：“如果我用进化算法优化天线，我只有\
    \ 50%的机会能准确解释为什么它会做出这些选择。在其余的时间里，该设计对我们来说根本是不可理解的。它有效——而且作为工程师，我们最终关心的是让事情运行起来。”\n\
    \n遗憾的是，遗传算法可能会“被困”在一个较好的解决方案区域（称为`局部最优`），而不是找到最佳解决方案（`全局最优`）。尽管如此，它们在应用于天线设计、蛋白质工程、车辆路径规划和调度、电路设计、装配线、药理学、艺术以及其他从搜索大量可能性中获益的领域时取得了巨大的成功。遗传算法甚至被用于在电影《指环王：王国的回归》中生成真实的动画马匹。\n\
    \n**另见** 计算创造力 (1821), 机器学习 (1959), 数宾大师 (1970), 人工生命 (1986), 群体智能 (1986)\n\n\
    **考虑一个 AI 控制**，正在处理一列在铁路上飞驰的失控火车。前方轨道上有五位老年人，他们会被杀死。如果 AI 将火车切换到另一条轨道，它将杀死一个年轻人。AI\
    \ 应该做出什么样的伦理选择？\n\n![OEBPS/images/134-1.jpg](img/9781454933601_epub_cre_r1.xhtml#134-1)\n\
    \n# 1976：人工智能的伦理\n\n![](img/L01.jpg)\n\n几十年来，普通大众和专家都对 AI 对人类尊严、安全、工作等方面的可能威胁表示了担忧。例如，计算机科学家约瑟夫·威森鲍姆（Joseph\
    \ Weizenbaum, 1923–2008）在他有影响力的 1976 年著作《计算机力量与人类理性》（*Computer Power and Human\
    \ Reason*）中建议，AI 不应被用来替代人类从事如治疗师或法官等强调人际尊重、爱和关怀的工作。威森鲍姆认为，尽管 AI 实体可能比人类更公平、更有效（人类往往带有偏见并在工作中会感到疲劳），但过度依赖\
    \ AI 可能会导致人类价值和精神的退化，因为我们日益将自己视为没有情感的无人机。\n\n科学家们已经测试了 AI 实体，这些实体可以根据约会网站上的姓名或照片，以越来越准确的水平检测人的国籍、民族或性倾向，这引发了隐私担忧。在刑事司法系统中，基于可用输入数据推荐保释或假释的\
    \ AI 实体引发了关注。在自动驾驶车辆领域，伦理考虑需要被编写到车辆逻辑中，以控制诸如在碰撞不可避免且只能救一个人时，是拯救车辆乘客还是行人。当然，工作流失也是卡车司机和其他一系列职业工作者的主要担忧。\n\
    \n在未来，需要对人类通过 AI 实体采取的各种非法或不道德行为进行监控，包括网络欺凌、冒充我们爱或信任的人、股票操纵和不当杀戮（例如，通过自主武器）。AI\
    \ 实体何时应该被向真实人类披露它们不是人类？如果机器人在伪装成人类时可以成为更好的护理者和伴侣，它们需要披露自己的非人类身份吗？\n\n**另见** *大都会\
    \ (1927), 阿西莫夫的机器人法则 (1942), 致命性机器人 (1942), ELIZA 心理治疗师 (1964), 偏执的 PARRY (1972),\
    \ 自动驾驶车辆 (1984)\n\n**《科学美国》1980 年 6 月的封面故事**围绕着国际棋程序`BKG 9.8`展开，该程序与当时的世界冠军路吉·维拉进行比赛，击败了维拉，并可能成为任何棋类游戏中第一个被程序击败的世界冠军。\n\
    \n![OEBPS/images/136-1.jpg](img/9781454933601_epub_cre_r1.xhtml#136-1) \n\n# 1979：国际棋冠军被击\n\
    \n![](img/L01.jpg)\n\n“就像大多数棋游戏一样，国际棋是人类战争的升华版，”人工智能专家丹尼尔·克维尔（Daniel Crevier）写道，“它的名字来源于威尔士语的`bac`和`gamen`，意为‘小’和‘战争’。”\n"
- fmt: "\nTD-Gammon, developed in 1992 by IBM researcher Gerald Tesauro, employed\
    \ an artificial neural network and learned expert-level backgammon by playing\
    \ games against itself. The program examined legal moves on each turn and updated\
    \ the weights within the neural nets. Because it required no human training, TD-Gammon\
    \ explored interesting strategies that humans had not considered, which, in turn,\
    \ taught humans how to play better. Today, several backgammon programs exist that\
    \ use neural networks and offer analyses to humans.\n\nBecause backgammon has\
    \ a random dice-influenced process, the “game tree” search space is extremely\
    \ large, and this stymied early attempts to create expert software players. When\
    \ neural nets are used, the initial weights within the net are random and the\
    \ net is trained through reinforcement learning. To achieve competence, the initial\
    \ TD-Gammon made use of forty hidden network nodes within the neural network,\
    \ as well as 300,000 training games. Later versions increased the hidden nodes\
    \ to 160 and the number of training games to over a million, so as to play at\
    \ the same level as the best humans.\n\n**SEE ALSO** [Artificial Neural Networks\
    \ (1943)](#9781454933601_epub_c039_r1.xhtml#c-039), [Reinforcement Learning (1951)](#9781454933601_epub_c044_r1.xhtml#c-044),\
    \ [Fuzzy Logic (1965)](#9781454933601_epub_c057_r1.xhtml#c-057), [Checkers and\
    \ AI (1994)](#9781454933601_epub_c080_r1.xhtml#c-080), [Deep Blue Defeats Chess\
    \ Champion (1997)](#9781454933601_epub_c082_r1.xhtml#c-082)\n\n**Imagine sitting\
    \ in a closed room.** You receive a piece of paper with Chinese symbols through\
    \ a slot in the wall. You don’t know Chinese, but you can consult a set of instructions\
    \ that shows you how to compose appropriate responses. Thus begins an interesting\
    \ question in the philosophy of AI.\n\n[![](OEBPS/images/138-1.jpg)](#9781454933601_epub_cre_r1.xhtml#138-1)\
    \ \n\n# 1980\n\n# CHINESE ROOM\n\n![](OEBPS/images/L01.jpg)\n\nCan a computer\
    \ be conscious? The term `strong AI` refers to the idea that properly configured\
    \ AI computer systems might actually think and have conscious minds, whereas `weak\
    \ AI` refers to systems that can only `act` as if they think like humans and have\
    \ minds. One attack against the idea of strong AI in computers comes from the\
    \ philosopher John Searle (b. 1932), who presented his famous Chinese Room experiment\
    \ in 1980.\n\nImagine sitting in a closed room. You receive a piece of paper with\
    \ Chinese characters through a slot in the wall. Although you do not know Chinese,\
    \ you can consult a set of instructions that tell you how to compose appropriate\
    \ responses using Chinese characters. Based on this instruction guide, you write\
    \ down some characters on a piece of paper and send an appropriate response through\
    \ the slot to the outside world. To a person outside the room, it would appear\
    \ that you have a perfect understanding of Chinese; but, of course, you are only\
    \ following rules, and the Chinese on both papers is total gibberish to you.\n\
    \nThis thought experiment may suggest that a computer program cannot give a computer\
    \ a mind, consciousness, or understanding, even if the computer and its program\
    \ seem to be quite intelligent. However, some philosophers have countered that\
    \ even if you do not understand Chinese, the system consisting of you, the closed\
    \ room, the set of instructions, and your processing of the instructions `does\
    \ understand`—`and is a kind of consciousness that is external to you and of which\
    \ you are unaware`.\n\nOthers have considered thought experiments in which each\
    \ of your brain cells might, one by one, be slowly replaced by electronic components\
    \ with the same input/output functions. Surely, with just a few of your cells\
    \ replaced, you are still “you.” Perhaps a year later, however, all your cells\
    \ would have been replaced, and at no point would you suddenly lose your ability\
    \ to be conscious and self-aware. Are you still “you”?\n\nOf course, for most\
    \ useful AI tasks, it is sufficient for an AI to simply `act` intelligently. Still,\
    \ debates continue to rage about the Chinese room and its implications.\n\n**SEE\
    \ ALSO** [Turing Test (1950)](#9781454933601_epub_c042_r1.xhtml#c-042), [Natural\
    \ Language Processing (1954)](#9781454933601_epub_c046_r1.xhtml#c-046), [ELIZA\
    \ Psychotherapist (1964)](#9781454933601_epub_c053_r1.xhtml#c-053), [Paranoid\
    \ PARRY (1972)](#9781454933601_epub_c066_r1.xhtml#c-066)\n\n**In `Blade Runner,***\
    \ the human-like AI replicants can be differentiated from humans by administering\
    \ the Voigt-Kampff test, which involves studying subtle emotional responses and\
    \ eye movements.\n\n[![](OEBPS/images/140-1.jpg)](#9781454933601_epub_cre_r1.xhtml#140-1)\
    \ \n\n# 1982\n\n# *BLADE RUNNER*\n\n![](OEBPS/images/L01.jpg)\n\nIn the future,\
    \ intelligent robots will likely be difficult to distinguish from human beings,\
    \ at least through a superficial inspection. When that day arrives, what effect\
    \ will this have on humanity and human relations? This theme has been explored\
    \ in several famous movies, and one particularly influential film on the subject\
    \ is the 1982 cult movie `Blade Runner`, directed by Ridley Scott (b. 1937) and\
    \ based on the 1968 novel `Do Androids Dream of Electric Sheep?` by Philip K.\
    \ Dick (1928–1982). Set in a futuristic Los Angeles in the year 2019, the film\
    \ depicts replicants, which are synthetic humans that must be “retired” (killed)\
    \ by the movie’s protagonist. These replicants are so similar to humans that the\
    \ way to distinguish them from humans is by administering the Voigt-Kampff test.\n\
    \nReflecting on the character of Rachael in `Blade Runner,` author and researcher\
    \ Jelena Guga writes: “Humans aspire to creating AI, but the kind of AI that they\
    \ can be in control of. . . Ethics, free will, memories, and all those values\
    \ attributed exclusively to humans, are brought into question and radically redefined\
    \ through popular representations of humanoid robots . . developed in such a way\
    \ as be able to express perhaps more humanness.”\n\n“How we ought to treat artificial\
    \ forms of life becomes an increasingly important issue,” writes philosopher Greg\
    \ Littmann, “as humans continue to develop sophisticated computer systems and\
    \ perform wonders with genetic engineering. Philosophically challenging films\
    \ like the grim fiction nightmares of Scott are useful when we ask ourselves about\
    \ our real-world obligations, since these allow us to test our preconceptions\
    \ against hypothetical situations to see whether our theories are consistent.”\n\
    \n**SEE ALSO** [*Metropolis (1927)](#9781454933601_epub_c034_r1.xhtml#c-034),\
    \ [Asimov’s Three Laws of Robotics (1942)](#9781454933601_epub_c037_r1.xhtml#c-037),\
    \ [Ethics of AI (1976)](#9781454933601_epub_c068_r1.xhtml#c-068), [*The Terminator*\
    \ (1984)](#9781454933601_epub_c073_r1.xhtml#c-073), [Spielberg’s *A.I. Artificial\
    \ Intelligence* (2001)](#9781454933601_epub_c086_r1.xhtml#c-086)\n\n**Self-driving\
    \ vehicles sense their surroundings** using various technologies. Possible levels\
    \ of autonomy range from low levels that exist today in many cars (e.g., lane-keeping\
    \ assistance and automatic emergency braking) to complete autonomy, where no driver\
    \ attention is ever required.\n"
  raw: "TD-Gammon, developed in 1992 by IBM researcher Gerald Tesauro, employed an\
    \ artificial neural network and learned expert-level backgammon by playing games\
    \ against itself. The program examined legal moves on each turn and updated the\
    \ weights within the neural nets. Because it required no human training, TD-Gammon\
    \ explored interesting strategies that humans had not considered, which, in turn,\
    \ taught humans how to play better. Today, several backgammon programs exist that\
    \ use neural networks and offer analyses to humans.\n\nBecause backgammon has\
    \ a random dice-influenced process, the “game tree” search space is extremely\
    \ large, and this stymied early attempts to create expert software players. When\
    \ neural nets are used, the initial weights within the net are random and the\
    \ net is trained through reinforcement learning. To achieve competence, the initial\
    \ TD-Gammon made use of forty hidden network nodes within the neural network,\
    \ as well as 300,000 training games. Later versions increased the hidden nodes\
    \ to 160 and the number of training games to over a million, so as to play at\
    \ the same level as the best humans.\n\n**SEE ALSO** [Artificial Neural Networks\
    \ (1943)](#9781454933601_epub_c039_r1.xhtml#c-039), [Reinforcement Learning (1951)](#9781454933601_epub_c044_r1.xhtml#c-044),\
    \ [Fuzzy Logic (1965)](#9781454933601_epub_c057_r1.xhtml#c-057), [Checkers and\
    \ AI (1994)](#9781454933601_epub_c080_r1.xhtml#c-080), [Deep Blue Defeats Chess\
