    如果我遗漏了与 AI 相关的有趣或关键的时刻，而你认为这些时刻尚未被充分重视，请告诉我。只需访问我的网站（[pickover.com](http://pickover.com)），并给我发一封邮件，解释你的想法以及你认为它是如何影响世界的。也许这本书未来的版本将包含关于
    AI 奇迹的整页介绍，例如：`罗克的巴西斯底蛇`、`生成对抗网络`、`神经形态计算`、`贝叶斯网络`、《西部世界》（电视剧）、《电子游戏战术》（1983 年电影）、`LSTM（长短期记忆）`网络等等。最后，我感谢我的书籍编辑
    Meredith Hale 和 John Meils——以及 Dennis Gordon、Tom Erickson、Michael Perrone、Teja
    Krasek 和 Paul Moskowitz——他们的评论和建议。


