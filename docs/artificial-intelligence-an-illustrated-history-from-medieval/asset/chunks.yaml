  trans: "\n四连棋（Connect Four）由两人使用棋子（黄色对红色）在一个有七列六行的垂直棋盘上进行。当棋子顺着某一列向下滑动到底部的空网格位置时，目标是成为第一个让四个自己颜色的相邻棋子排成直线（水平、垂直或斜线）的玩家。这个游戏让人联起井字棋，但受重力影响。。当然，四连棋比井字棋复杂得多：如果考虑所有填充了\
    \ 0 到 42 个棋子的可能游戏盘面，共有 4,531,985,219,092 种位置。事实上，在标准的 7 × 6 盘上下完 `n` 个棋子后，可能的数量增长如下（其中\
    \ `n` = 0, 1, 2, 3, . . .）：1, 7, 56, 252, 1260, 4620, 18480, 59815, 206780, 605934,\
    \ 1869840, 5038572, 14164920, 35459424, 91871208, 214864650, 516936420, 1134183050,\
    \ 2546423880, 5252058812, 11031780760, 21406686756, 42121344720, 76871042612 .\
    \ . .\n\n1988 年 10 月 1 日，计算机科学家 James D. Allen 最后“破解”了四连棋——也就是说，他发明了一种算法，可以从每一个可能的位置预测移动的结果（胜、负或平局），假设玩家从那时起都进行完美执行。两周后，计算机科学家\
    \ Victor Allis 独立地解决了该游戏，他采用了具有九种策略的 AI 方法。结果，我们现在知道，只要玩家得法完美，第一玩家总是能赢得四连棋。\n\n\
    四连棋的变体仍有很大的研究空间。例如，想象在绕成圆柱形的棋盘上玩，或者在具有不同网格大小、额外颜色和两个以上维度的盘面上玩。可能的位置和结果数量将是令人震惊的。\n\
    \n**另需参考** 井字棋（约公元前 1300 年）, 黑白棋（1997 年）, 求解 Awari 游戏（2002 年）, Quackle 的拼字游戏胜利（2006\
    \ 年）, AlphaGo Go 冠军（2016 年）\n\n**生命形式中的智能**显然并不围绕着下国际象棋等游戏展开。在《大象不下国际象棋》一文中，Rodney\
    \ Brooks 主张在探索 AI 时要有不同的关注点。\n\n![](img/#9781454933601_epub_cre_r1.xhtml#154-1)\
    \ \n\n# 1990\n\n# “大象不下国际象棋”\n\n![](img/L01.jpg)\n\n“存在一种人工智能的替代路线，与过去三十多年在该旗帜下追求的方向不同，”机器人专家\
    \ Rodney Brooks（1954 年出生）在其广为引用的 1990 年宣言《大象不下国际象棋》中写道。他继续写：“我们探索了一种研究方法，它强调与环境的持续交互是智能系统设计的主要约束来源。”\n"
- fmt: "\n## **SEE ALSO** [“Darwin among the Machines” (1863)](#9781454933601_epub_c025_r1.xhtml#c-025),\
    \ [*Rossum’s Universal Robots* (1920)](#9781454933601_epub_c033_r1.xhtml#c-033),\
    \ [*Giant Brains, or Machines That Think* (1949)](#9781454933601_epub_c041_r1.xhtml#c-041),\
    \ [Intelligence Explosion (1965)](#9781454933601_epub_c055_r1.xhtml#c-055), [Living\
    \ in a Simulation (1967)](#9781454933601_epub_c060_r1.xhtml#c-060), [Paperclip\
    \ Maximizer Catastrophe (2003)](#9781454933601_epub_c089_r1.xhtml#c-089)\n\nIn\
    \ the 1950s, IBM scientist Arthur Samuel became well known for his adaptive checkers\
    \ program that learned by playing games against modified versions of itself. For\
    \ what other games will AI players soon exhibit superhuman skills?\n\n![![](OEBPS/images/158-1.jpg)](#9781454933601_epub_cre_r1.xhtml#158-1)\
    \ \n\n# 1994\n\n## CHECKERS AND AI\n\n![](OEBPS/images/L01.jpg)\n\nCheckers is\
    \ played on an 8 × 8 board, with players who take turns trying to capture each\
    \ other’s pieces by hopping over them. In the 1950s, IBM scientist Arthur Samuel\
    \ (1901–1990) became well known for his adaptive checkers program that learned\
    \ by playing games against modified versions of itself. A famous milestone in\
    \ the history of checkers-playing AI is `Chinook`, which in 1994 became the first\
    \ computer program to win the world championship title against humans.\n\n`Chinook`\
    \ was developed by a team led by Canadian computer scientist Jonathan Schaeffer\
    \ (b. 1957); it made use of both a library of opening moves played by grandmasters\
    \ and an algorithm that, by 1992, searched checkers moves to an average minimum\
    \ search depth of nineteen ply (one ply equals one move by one player). It also\
    \ used an endgame database for all positions with eight pieces or fewer, and a\
    \ useful move-evaluation function.\n\nBefore the famous 1994 man-machine checkers\
    \ match, Marion Tinsley (1927–1995), widely considered the best checkers player\
    \ who ever lived, declared “I have a better programmer than `Chinook`. His was\
    \ Jonathan, mine was the Lord.” Alas, after six games, which were all draws, Tinsley\
    \ complained of abdominal pains and had to stop playing. He died a few months\
    \ later of pancreatic cancer. `Chinook` was declared the winner by default.\n\n\
    In 2007, Schaeffer and colleagues used computers to finally prove that checkers,\
    \ when played perfectly, is a no-win game. This means that checkers resembles\
    \ tic-tac-toe—a game that also can’t be won if both players make no wrong moves.\
    \ Schaeffer’s proof was executed by hundreds of computers over eighteen years\
    \ that eventually showed that it was theoretically possible to build a machine\
    \ that will never lose to a human.\n\nTo “solve the game of checkers,” the research\
    \ team considered 39 trillion arrangements with ten or fewer pieces on the board\
    \ and then determined if either of the two players wins. The team also used a\
    \ specialized search algorithm to study the start of the game—specifically to\
    \ see how initial moves “funneled” into the ten-checker configurations.\n\n##\
    \ **SEE ALSO** [Tic-Tac-Toe (c. 1300 BCE)](#9781454933601_epub_c001_r1.xhtml#c-001),\
    \ [Mechanical Turk (1770)](#9781454933601_epub_c018_r1.xhtml#c-018), [Machine\
    \ Learning (1959)](#9781454933601_epub_c050_r1.xhtml#c-050), [Backgammon Champion\
    \ Defeated (1979)](#9781454933601_epub_c069_r1.xhtml#c-069), [Deep Blue Defeats\
    \ Chess Champion (1997)](#9781454933601_epub_c082_r1.xhtml#c-082), [Othello (1997)](#9781454933601_epub_c083_r1.xhtml#c-083)\n\
