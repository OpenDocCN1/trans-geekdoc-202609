    \ \n\n# 1913\n\n# OPTICAL CHARACTER RECOGNITION (OCR)\n\n![](OEBPS/images/L01.jpg)\n\
    \nPresident John Adams is often credited with saying “The only thing most people\
    \ do better than anyone else is read their own handwriting.” Indeed, the quest\
    \ for automated systems that could read printed letters of the alphabet has had\
    \ a long history. *Optical character recognition*, or OCR, has involved several\
    \ fields of research and development: computer vision, artificial intelligence,\
    \ pattern recognition, and more. OCR refers to the conversion of images of text\
    \ in numerous varieties (e.g., handwritten, printed, typed) into machine-encoded\
    \ text. For example, the text on a mailing envelope, license plate, book page,\
    \ street sign, or passport might be scanned and recognized by a machine. Sometimes\
    \ OCR is used to convert text to speech for blind people.\n\nOne early inventor\
    \ in the area of OCR is Russian-born scientist Emanuel Goldberg (1881–1970), who\
    \ in 1931 patented a document-search device that used photoelectric cells and\
    \ pattern recognition to search for information on microfilmed documents. Even\
    \ earlier, around 1913, Irish physicist Edmund Fournier d’Albe (1868–1933) invented\
    \ the *optophone*, which assisted blind readers by using photosensors to scan\
    \ text and generate tones that corresponded to letters. In 1974, American inventor\
    \ Ray Kurzweil (b. 1948) created a reading machine for the blind that could scan\
    \ text in numerous different fonts and produce speech output.\n\nOCR often requires\
    \ a number of interesting processing steps, such as mathematically tilting the\
    \ text as needed, removing noise, and smoothing edges. In order to recognize characters,\
    \ the system may make comparisons to stored characters and/or consider particular\
    \ graphical features (e.g., loops and lines).\n\nA closely related field includes\
    \ *handwriting recognition* (HWR), which may also involve the monitoring and analysis\
    \ of the movements of a pen in recognizing the word being written. HWR usually\
    \ employs OCR, but may also involve determining the most plausible words in a\
    \ given context to increase accuracy. Artificial neural networks can also be used\
    \ to facilitate OCR and HWR.\n\n**SEE ALSO** [Artificial Neural Networks (1943)](#9781454933601_epub_c039_r1.xhtml#c-039),\
    \ [Speech Recognition (1952)](#9781454933601_epub_c045_r1.xhtml#c-045), [Machine\
    \ Learning (1959)](#9781454933601_epub_c050_r1.xhtml#c-050)\n\n**Poster for a\
    \ production of *R.U.R.,*** directed by the puppeteer Remo Bufano in New York,\
    \ in 1939. The performance was funded by the Federal Theatre Project (1935–1939),\
    \ a New Deal program to fund art in the United States during the Great Depression.\n\
    \n[![](OEBPS/images/64-1.jpg)](#9781454933601_epub_cre_r1.xhtml#64-1) \n\n# 1920\n\
    \n# *ROSSUM’S UNIVERSAL ROBOTS*\n\n![](OEBPS/images/L01.jpg)\n\nWritten by the\
    \ Czech art critic and playwright Karel Čapek (1890–1938), the 1920 play *R.U.R.*\
    \ (*Rossum’s Universal Robots*) introduced the word *robot* to the English language.\n\
    \nIn *R.U.R,* the robots are made of flesh and blood but assembled in vats. They\
    \ serve humankind as factory workers—essentially as inexpensive appliances—which\
    \ allows humans a tremendous amount of leisure time. However, debates take place\
    \ about their rights and humanity. Helena, one of the main characters, desires\
    \ to free the robots. Alas, the robots, which are being used worldwide, eventually\
    \ destroy the human race; but because the robots do not possess the secret formula\
    \ to reproduce themselves, they too will eventually die out. At the end of the\
    \ play, two special robots fall in love, representing a kind of Adam and Eve for\
    \ the future of our planet.\n\nThe word *robot* comes from the Czech *robota*,\
    \ which refers to forced labor. The play is a milestone in that it forced people\
    \ to consider the implications of the continued evolution of AI technology—not\
    \ only in the area of jobs and possible dehumanization effects on society, but\
    \ also regarding the general safety of the human race. Where do we draw the line\
    \ between humans and thinking machines? When do such machines become so advanced\
    \ that they deserve rights or become a threat? According to author Rebecca Stefoff,\
    \ *R.U.R.* suggests that the “indefinable spark of humanity dwells in how beings\
    \ feel and act, not in how they are created.”\n\n“Philosophically rich and controversial,\
    \ *R.U.R.* was unanimously acknowledged as a masterpiece from its first appearance,\
    \ and has become a classic of technologically dystopian literature,” writes Luciano\
    \ Floridi (b. 1964), Professor of Philosophy and Ethics of Information at Oxford\
    \ University. The ideas in the play were so powerful that, by 1923, the play had\
    \ been translated into more than thirty languages. In 1922, the American premiere\
    \ of the play took place in New York City, where it had more than a hundred performances.\n\
    \n**SEE ALSO** [*Metropolis* (1927)](#9781454933601_epub_c034_r1.xhtml#c-034),\
    \ [*The Human Use of Human Beings* (1950)](#9781454933601_epub_c043_r1.xhtml#c-043),\
    \ [Intelligence Explosion (1965)](#9781454933601_epub_c055_r1.xhtml#c-055), [Leakproof\
    \ “AI Box” (1993)](#9781454933601_epub_c079_r1.xhtml#c-079)"
