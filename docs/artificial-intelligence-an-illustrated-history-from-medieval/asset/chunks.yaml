    \n## **SEE ALSO** [Living in a Simulation (1967)](#9781454933601_epub_c060_r1.xhtml#c-060),\
    \ [Artificial Life (1986)](#9781454933601_epub_c074_r1.xhtml#c-074), [AIBO Robot\
    \ (1999)](#9781454933601_epub_c084_r1.xhtml#c-084)\n\n**What new versions of chess\
    \ will AI entities or humans invent that may introduce new challenges for humans?\
    \ Shown here is Fortress Chess, played in Russia in the 18th and 19th centuries.\
    \ Four players (AIs andor humans) are represented here as black, white, dark grey,\
    \ and light grey.\n\n![![](OEBPS/images/162-1.jpg)](#9781454933601_epub_cre_r1.xhtml#162-1)\
    \ \n\n# 1997\n\n## DEEP BLUE DEFEATS CHESS CHAMPION\n\n![](OEBPS/images/L01.jpg)\n\
    \nVladimir Kramnik (b. 1975), the undisputed World Chess Champion from 2006 to\
    \ 2007, once told reporters, “I am convinced, the way one plays chess always reflects\
    \ the player’s personality. If something defines his character, then it will also\
    \ define his way of playing.” Would this “personality” also be reflected in an\
    \ AI’s style of play?\n\nFor decades, technologists had considered chess a kind\
    \ of measuring stick for artificial intelligence, being a game that required strategy,\
    \ detailed reasoning, logic, foresight, and—at least for human players—guile.\
    \ After many years of debating as to when a machine might defeat a reigning world\
    \ chess champion, it finally happened in 1997: IBM’s `Deep Blue` computer defeated\
    \ Russian world chess champion Garry Kasparov (b. 1963) in a six-game match. After\
    \ Game 5, Kasparov had become so discouraged that he explained: “I’m a human being.\
    \ When I see something that is well beyond my understanding, I’m afraid.”\n"
