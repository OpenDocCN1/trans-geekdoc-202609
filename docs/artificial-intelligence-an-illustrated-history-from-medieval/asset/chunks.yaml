    # 现实世界机器人历史


    现实世界机器的历史经历了几个显著的里程碑，这里列出了其中最著名的几个。1949 年，由英国神经生理学家威廉·沃尔特（William Walter, 1910–1977）开发的三轮式“乌龟”能够利用各种传感器自主探索环境。1961
    年，由美国发明家乔治·德沃尔（George Devol, 1912–2011）创造的优元（Unimate）成为世界上第一台工业机器人，并被用于通用汽车的装配线。1973
    年，日本的 WABOT-1——世界上首个全尺寸的人形智能机器人——每走一步需要 45 秒。1989 年，麻省理工学院展示了由机器人专家罗德尼·布鲁克斯（Rodney
    Brooks, 生于 1954）开发的名为“吉思汗”的六足机器人昆虫，它利用简单的逻辑规则进行行走和探索。1998 年，老虎电子公司发布了像猫头鹰一样的富比（Furby），在几年内销量超过
    4000 万台。尽管这是一个非常简单的机器人，但富比产生的“富比语”语音输出会随着时间的推移转化为英语，给人一种它能像人类一样学习语言的印象。最后，由波士顿动力及其伙伴于
    2005 年创建的四足机器人大狗（BigDog），因在各种复杂地形上行走的能力而闻名。


    现代现实世界机器人中最具标志性的之一或许是本田汽车公司在 2000 年推出的创新移动先进步机器人（ASIMO），其问世引起了主流媒体的高度关注。这个人形机器人高
    4 英尺 3 英寸（130 厘米），利用其内部摄像头和各种传感器，能够通过行走自主导航。ASIMO 可以识别手势、脸部和声音，还能抓取物体。


    我们复杂的未来无疑对人工智能有持续的需求，机器人将在与人类的协作中发挥日益增长的作用。也许有一天，像 ASIMO 这样的机器人将协助老人或残疾者。然而，正如控制论专家诺伯特·维纳（Norbert
    Wiener）所警告：“未来的世界将是一场针对我们智能局限性的更加严峻的斗争，而不是一个我们可以躺在上面等待机器人奴隶服侍的舒适吊床。”


    **另见** `机器人埃莱克特 (1939)`, `机器人谢谢基 (1966)`, `AIBO 机器人 (1999)`, `扫地机器人机器人 (2002)`,
    `火星上的 AI (2015)`


    《皮诺恰曹的奇遇》是斯坦利·库布里克在开发电影《人工智能》期间的灵感来源之一。木偶偶皮诺恰曹梦想变成人类。


    # 2001 年：史尔伯格的人工智能


    电影《人工智能》由史蒂芬·史尔伯格（Steven Spielberg, 生于 1946）导演，是一部发人深省的剧情片，使我们思考 AI 的未来以及一个名为大卫的机器人男孩的能力，大卫是母亲因为思念儿子而作为礼物送给她的。这部电影基于英国作家阿里迪斯（Aldiss,
    1925–2017）1969 年的故事《最后的夏天的超级玩具》。虽然这部电影直到 2001 年才上映，但它的开发始于 20 世纪 70 年代，当时导演斯坦利·库布里克获得了胶片版权。


    电影的大部分讲述了大卫在与母亲分离后尝试回到她身边的故事。在寻找过程中，有一只 AI 熊泰迪陪伴着他，去寻找蓝仙子（灵感来自电影《皮诺恰曹》），大卫相信蓝仙子可以让他变成“真正的”人类。在旅程的某一部分，大卫的工程师向他解释说，蓝仙子是人类幻想并不存在之物的巨大缺陷之一，或者是人类最伟大的单一天赋——梦想的能力。而这是任何机器从未做过的事情。


    电影的观众辩论机器人是否真的能爱，电影影评人罗杰·艾伯特（Roger Ebert, 1942–2013）写道，机器人仅仅是“由电脑程序操纵着丝线的傀儡”。在电影结束，在经历了两千年的冷冻后，大卫遇到了由像他这样的机器人进化而来的瘦细
    AI，它们对大卫产生了特别兴趣，因为他是最后一个真正遇到过人类的生物。它们允许他与早已去世的母亲的克隆体度过最后一天。回顾这部悲伤但发人深省的电影时，《梦想帝国》作者安德鲁·戈登（Andrew
    Gordon）写道：“我们通过机器人衡量自己，试图定义什么使我们成为人类，担心即使在我们变得机器人化，我们的创造物也变得越来越像人并最终可能超越我们……机器人通过获得梦想的能力变成了‘人类’，但人类的梦想是人性所留下的全部。”


    **另见** `“美之艺术家” (1844)`, `超人类主义 (1957)`, `银翼杀手 (1982)`


    **阿瓦里游戏（Awari）吸引了人工智能领域的研究人员**2002 年，计算机科学家计算了所有可能出现的 889,063,398,406 种局面，证明了在双方表现完美的情况下，阿瓦里游戏将以和局结束。


    # 2002 年：解决阿瓦里游戏


    人工智能研究人员投入了大量精力开发游戏——既作为策略的测试，也是为了挑战软硬件极限。一个有趣的例子涉及阿瓦里，这是一种有 3500 年历史的非洲棋类。阿瓦里被归类为计数捕获类游戏，是曼卡拉（mancala）系列策略游戏的一员，在不同国家有不同的名称。


    阿瓦里棋盘由两行每行六个槽组成——每个槽有四个标记（豆子、种子或石子），每行属于一个玩家。在玩家回合中，玩家选择自己的六个槽中的一个，取出该中所有的种子，并逆时针方向每个槽中放入一个种子。第二个玩家然后从自己的六个槽中选择一个并进行同样的操作。当一个玩家将最后一粒种子放入对方侧只有一个或两个种子的槽中（总共二或三个种子）时，该玩家捕获该槽中所有的种子。如果紧邻空槽的种子现在也总共二或三个，该玩家同样捕获。玩家只能从对方的一侧捕获种子，当一个玩家的一侧不再有种子时，游戏结束。捕获种子最多的人获胜。


    阿瓦里游戏对人工智能领域具有巨大的吸引力；但直到 2002 年，没有人知道这种游戏是否像井棋一样，从开始的完美下法总是以和局结束。最后，阿姆斯特丹自由大学的计算机科学家约翰·W·罗马因（John
    W. Romein, 生于 1970）和亨利·E·巴尔（Henri E. Bal, 生于 1958）编写了一个计算机程序，计算了所有可能出现的 889,063,398,406
    种局面，证明了阿瓦里游戏在双方表现完美的情况下将以和局结束。这项巨大的计算在一个拥有 144 个处理器的计算机集群上大约花费了 51 小时。


