    如今，每年都会举办洛布纳竞赛（Loebner competition），部分部分是为了表彰那些出最接近通过图灵测试程序的计算机程序员们。当然，图灵测试多年来引发了大量的辩论和争议。例如，如果计算机实际上比人类要“智能”得多，它就必须假装得没那么智能，因为测试的重点在于模仿人类。因此，他们经常使用一些狡猾而幽默的技术，如引入打字错误、改变对话话题、插入笑话、向评审员提问等来欺骗评审。2014
    年，由俄罗斯程序员开发的一个对话机器人通过了某个版本的测试，它假装成一个名叫尤金·古斯特曼（Eugene Goostman）的十三岁乌克兰男孩。


    图灵测试价值的另一个挑战是，人类评审员的专业水平很容易改变测试结果。然而，无论我们如何看待测试检测“智能”的能力，它确实激发了计算机程序员和工程师的创造力。


    **另请阅读** “机器中的达尔文（1863 年）”, *巨型大脑，或思考的机器（1949 年）*, 自然语言处理（1954 年）, ELIZA 心理治疗师（1964
