  trans: "\n\n在会议期间，卡内基梅隆大学的艾伦·纽威尔（Allen Newell，1927–1992）和赫尔伯特·西蒙（Herbert Simon，1916–2001）展示了“逻辑理论学家”（Logic\
    \ Theorist），这是一个用于证明符号逻辑定理的程序。作者帕梅拉·麦库拉克在描述达特茅研讨会时写道：“他们共同有一种信念……我们所说的思维确实可以发生在人类头颅之外，它可以用正式和科学的方式来理解，而实现这一点的最佳非人类工具就是数字计算机。”\n\
    \n部分由于人工智能技术的复杂性，也由于会议参与者的到场日期不一，对会议的期望可能高了一点。尽管如此，达特茅人工智能研讨会汇聚了一群多样化的研究人员，他们影响了未来二十年的该领域。\n\
    \n**另见** 人工神经网络（1943）, 自然语言处理（1954）, Licklider 的“人机共生”（1960）\n\n**感知器的第一个版本**是在\
    \ IBM 704 计算机上通过软件实现的，此处展示了其 1957 年的老照片。IBM 704 是首批具有浮点运算硬件的批量产计算机之一。\n\n![](img/#9781454933601_epub_cre_r1.xhtml#94-1)\
    \ \n\n# 1957\n\n# 感知器\n\n![](img/L01.jpg)\n\n今天，人工神经网络（ANNs）被应用于无数场景中，包括模式识别（例如人脸识别）、时间序列预测（例如预测股价是否会上涨）、信号处理（例如过滤噪声）等。神经网络的基础知识在第\
    \ 77 页, 机器学习（1959）, 深度学习（1965）\n\n**感知器的第一个版本**是在 IBM 704 计算机上通过软件实现的。美国科学家兼经济学家弗朗西斯·福山（Francis\
    \ Fukuyama，1952）将超人类主义——通常涉及技术增强身体能力——称为世界上最危险的想法。\n\n![](img/96-1.jpg](#9781454933601_epub_cre_r1.xhtml#96-1)\
    \ \n\n# 1957\n\n# 超人类主义\n\n![](img/L01.jpg)\n\n“人工智能的到来可能是历史上最重大的事件，”哲学家写道。在 1957\
    \ 年出版的《新瓶》中，生物学家朱利安·赫胥黎（Julian Huxley，1887–1975）创造了“超人类主义”一词，他认为人类物种可以通过实现新的可能性来……超越自身。\n\
    \n如果你的身体或大脑可以无限生存，“你”还会持续吗？我们都会因经历而改变——这意味着你和一年前几乎是同一个人。然而，如果你的正常或增强型身体持续千年，变化将会不断积累，最终一个完全不同的人将占据这个躯体。“你”不会有一个消失的时刻，但你会在几个世纪中逐渐消失，就像被海洋冲刷的沙堡一样。\n\
    \n**另见** 意识（1714）, 灵魂灵魂（1907）, Licklider 的“人机共生”（1960）, 后人类（1964）, 机器学习（1959）\n\
    \n人工智能专家亚瑟·李·塞缪（Arthur Lee Samuel，1901–1990）被认为是最早使用“机器学习”一术的人之一，该术语在他 1959 年发表于《IBM\
    \ 研究杂志》的论文《使用国际象棋的一些机器学习研究》中流行。他在文中解释道，“通过计算机从经验中学习”可能会消除大部分对显式特定任务编程和指令的需求。\n\
    \n"
