    Today, one of the major computing methods and enablers of artificial intelligence
    is machine learning. It plays a role in computer vision, speech understanding,
    autonomous robots, self-driving cars, face recognition, email filtering, optical
    character recognition, providing product recommendations, identifying likely cancers,
    detecting data breaches, and more. Many forms of machine learning require large
    sets of input data for training, to help make predictions and classifications.


    With `supervised machine learning`, algorithms may be fed data samples that are
    labeled with information, so that the system can later make predictions when subsequent
    data is provided in an unlabeled fashion. For example, consider a system that
    ingests a collection of 100,000 images of lions and tigers that humans have correctly
    labeled as “lion” or “tiger.” Subsequently, the supervised learning algorithm
    should be able to distinguish lions from tigers it has not seen before. With `unsupervised
    machine learning`, unlabeled data is employed, so that the system may discover
    hidden patterns. For example, the system may determine that thirty-year-old women
    who stop purchasing albacore canned tuna may be pregnant and, thus, are targets
    for baby-product ads.


    Note that machine-learning approaches can be fallible—for example, if the input
    data is biased, incorrect, or even manipulated in a malicious way. We should be
    careful not to overrely on certain automated approaches when making decisions
    on who should qualify for loans, be offered jobs, or receive parole. This principle
    applies in countless areas of machine-mediated decision making.


    **SEE ALSO** [Artificial Neural Networks (1943)](#9781454933601_epub_c039_r1.xhtml#c-039),
    [Reinforcement Learning (1951)](#9781454933601_epub_c044_r1.xhtml#c-044), [Natural
    Language Processing (1954)](#9781454933601_epub_c046_r1.xhtml#c-046), [Knowledge
    Representation and Reasoning (1959)](#9781454933601_epub_c051_r1.xhtml#c-051),
    [Deep Learning (1965)](#9781454933601_epub_c058_r1.xhtml#c-058), [Genetic Algorithms
    (1975)](#9781454933601_epub_c067_r1.xhtml#c-067), [Swarm Intelligence (1986)](#9781454933601_epub_c075_r1.xhtml#c-075),
    [Adversarial Patches (2018)](#9781454933601_epub_c098_r1.xhtml#c-098)


    **MYCIN was an expert system** that used AI to identify bacteria causing severe
    infections, such as meningitis, and to recommend treatments. MYCIN employed a
    simple inference engine, and a knowledge base of around 600 rules. Shown here
    are *Streptococcus pneumoniae* bacteria that can cause meningitis.


    ![![](OEBPS/images/100-1.jpg)](#9781454933601_epub_cre_r1.xhtml#100-1)


    # 1959


    # KNOWLEDGE REPRESENTATION AND REASONING


    ![](OEBPS/images/L01.jpg)


    “For a system to be intelligent,” writes computer scientist Nils Nilsson, “it
    must have knowledge about its world and the means to draw conclusions from, or
    at least act on, that knowledge. Humans and machines alike therefore must have
    ways to represent this needed knowledge in internal structures, whether encoded
    in protein or silicon.” Nowadays, much of the attention on AI seems to be on machine
    learning and statistical algorithms for applications such as image recognition.
    Nevertheless, logic-based knowledge representation and reasoning (KR) still has
    a big role to play in many areas.


    KR is the field of AI concerned with representing information in such a way that
    computer systems can efficiently use the information to make medical diagnoses
    and legal recommendations, as well as to facilitate intelligent dialog systems
    such as Siri on the iPhone or Alexa on the Amazon Echo. As just one example, a
    `semantic network` is sometimes used as a form of KR to represent semantic (i.e.,
    meaning) relationships between concepts. These semantic networks often take the
    form of graphs, with vertices representing concepts and edges (i.e., connecting
    lines) indicating the semantic relationships between them. KR also has application
    in automatic reasoning, including the automated proving of mathematical theorems.


    Some of the early work in AI KR includes the General Problem Solver, a computer
    program developed in 1959 by Allen Newell (1927–1992), Herbert Simon (1916–2001),
    and colleagues to analyze goals and solve simple general problems (e.g., the Tower
    of Hanoi). Later, the Cyc project—started in 1984 by Douglas Lenat (b. 1950)—employed
    numerous analysts documenting various areas of commonsense reasoning to help AI
    systems perform human-like reasoning (e.g., the Cyc inference engine employs logical
    deductions and inductive reasoning). Today, AI researchers in the area of KR deal
    with many issues, including ensuring that the knowledge base can be updated as
    needed to allow efficient development of new inferences. The researchers are also
    concerned with how uncertainty and vagueness can best be addressed in KR systems.


    **SEE ALSO** [Aristotle’s *Organon* (c. 350)](#9781454933601_epub_c003_r1.xhtml#c-003),
    [Tower of Hanoi (1883)](#9781454933601_epub_c027_r1.xhtml#c-027), [Perceptron
    (1957)](#9781454933601_epub_c048_r1.xhtml#c-048), [Machine Learning (1959)](#9781454933601_epub_c050_r1.xhtml#c-050),
    [Expert Systems (1965)](#9781454933601_epub_c056_r1.xhtml#c-056), [Fuzzy Logic
    (1965)](#9781454933601_epub_c057_r1.xhtml#c-057)


    **Joseph Lickider wrote:** “The hope is that . . human brains and computing machines
    will be coupled together very tightly, and that the resulting partnership will
    think as no human brain has ever thought.”


    ![![](OEBPS/images/102-1.jpg)](#9781454933601_epub_cre_r1.xhtml#102-1)

