  raw: "C*ybernetic Serendipity: The Computer and the Arts* (1968) was a groundbreaking\
    \ illustrated book and catalogue for the well-attended exhibition at the Institute\
    \ of Contemporary Arts in London (and later in Washington, DC, and San Francisco).\
    \ Edited and curated by British art critic Jasia Reichardt (b. 1933), the book\
    \ and simultaneous exhibit were notable for demonstrating numerous aspects of\
    \ computer-aided creativity, from visual art to music, poetry, storytelling, dance,\
    \ animation, and sculpture, inspiring a generation of experimental collaborations\
    \ involving artists, scientists, and engineers.\n\nIn 1948, American mathematician\
    \ and philosopher Norbert Wiener (1894–1964) defined *cybernetics* as “the scientific\
    \ study of control and communication in the animal and the machine”; today the\
    \ term has taken on a broader meaning involving the control of numerous kinds\
    \ of systems using technology such as electronic devices. *Serendipity* usually\
    \ refers to unexpected, delightful, and useful outcomes made by accident and chance.\n\
    \nWith contributors that included artists, composers, poets, and computer programmers,\
    \ *Cybernetic Serendipity* raised questions about the nature of art and chance.\
    \ Some of the most stimulating parts of the book are beautiful computerized Japanese\
    \ haiku poems, accompanied by algorithmic recipes to generate the poems. For example,\
    \ one haunting poem begins: “Eons deep in the ice, I paint all time in a whorl.\
    \ . . .” Another section concerns the generation of “Little Grey Rabbit-type stories”\
    \ that are constructed by a computer using simple rules. A typical story might\
    \ begin like this: “The sun shone over the woods. Across the fields softly drifted\
    \ the breeze while then the clouds, which calmly floated all afternoon, moved\
    \ across the fields . . . ”\n\nIn addition to poetry and stories, *Cybernetic\
    \ Serendipity* featured painting machines and a range of computer art made on\
    \ mechanical computer plotters or CRT displays, inspiring people interested in\
    \ the nascent field of algorithmic and/or generative art. The book also included\
    \ musical scores generated from traces of the New York City skyline or splatters\
    \ of ink, various forms of electronic music machines, computer-programmed choreography,\
    \ sound-activated mobiles, pendulum drawing machines and harmonographs, architectural\
    \ works, pseudo-Mondrian paintings, and more.\n\n**SEE ALSO** [Ramon Llull’s *Ars\
    \ Magna* (c. 1305)](#9781454933601_epub_c010_r1.xhtml#c-010), [Lagado Book-Writing\
    \ Engine (1726)](#9781454933601_epub_c016_r1.xhtml#c-016), [Computational Creativity\
    \ (1821)](#9781454933601_epub_c021_r1.xhtml#c-021), [Computer Art and DeepDream\
    \ (2015)](#9781454933601_epub_c092_r1.xhtml#c-092)\n\n**Artist’s rendering of\
    \ HAL 9000’s** famous red all-seeing camera eye from *2001: A Space Odyssey.*\n\
    \n[![](OEBPS/images/122-1.jpg)](#9781454933601_epub_cre_r1.xhtml#122-1) \n\n#\
    \ 1968\n\n# HAL 9000\n\n![](OEBPS/images/L01.jpg)\n\n“My mission responsibilities\
    \ range over the entire operation of the ship, so I am constantly occupied,” explains\
    \ HAL 9000, the fictional AI in the famous 1968 movie *2001: A Space Odyssey*.\
    \ “I am putting myself to the fullest possible use, which is all I think that\
    \ any conscious entity can ever hope to do.” Unfortunately for the crew, HAL later\
    \ becomes a killer who must be terminated.\n\nHAL is important partly because\
    \ a number of prominent AI researchers say they were inspired to explore the field\
    \ of AI after watching the movie, the screenplay of which was written by Stanley\
    \ Kubrick (1928–1999) and Arthur C. Clarke (1917–2008). Interestingly, HAL embodies\
    \ many of the capabilities we expect today of future artificial general intelligences\
    \ (AGIs) that can behave intelligently across a wide range of goals and environments.\
    \ This sentient machine is capable of computer vision, speech recognition, face\
    \ recognition, speech output, natural-language processing, chess playing, and\
    \ various forms of advanced reasoning, planning, and problem solving. HAL can\
    \ even read lips, appreciate art, exhibit emotions, strive for self-preservation,\
    \ and interpret the emotions of humans.\n\nIn the 1960s, when the film was being\
    \ made, experts had predicted that by 2001 AIs like HAL would be possible. Even\
    \ though AI researcher Marvin Minsky (1927–2016) was an adviser on the film set,\
    \ it is apparent today that many more years are needed to create a HAL-like entity,\
    \ with his full range of capabilities.\n\nIn a haunting scene from the movie,\
    \ after HAL becomes dangerous and must be disabled, we see an astronaut slowly\
    \ removing computer modules as HAL continually degrades and slowly sings. Perhaps\
    \ one lesson of HAL today is that we may not be fully aware of the effects of\
    \ pervasive AI use from childhood to death. We would be eminently wise to consider\
    \ both the pros and cons of pervasive AI in the future, as these entities become\
    \ more powerful and we rely on them for countless forms of decision making.\n\n\
    **SEE ALSO** [Natural Language Processing (1954)](#9781454933601_epub_c046_r1.xhtml#c-046),\
    \ [*Colossus: The Forbin Project* (1970)](#9781454933601_epub_c064_r1.xhtml#c-064),\
    \ [*The Terminator* (1984)](#9781454933601_epub_c073_r1.xhtml#c-073)\n\n**Mastermind\
    \ playing board.** The “decoding” region of the board is where colored pegs are\
    \ placed. The initial secret sequence of colored pegs would be placed at left,\
    \ covered by a shield. The smaller pegs at bottom track the correctness of guesses.\n\
    \n[![](OEBPS/images/124-1.jpg)](#9781454933601_epub_cre_r1.xhtml#124-1) \n\n#\
    \ 1970\n\n# MASTERMIND\n\n![](OEBPS/images/L01.jpg)\n\nMastermind^®, a colorful\
    \ code-breaking board game, has been the subject of passionate AI research for\
    \ decades. Invented in 1970 by Mordecai Meirowitz (b. 1930), an Israeli postmaster\
    \ and telecommunications expert, the game was initially rejected by all mainstream\
    \ game companies. Nevertheless, the game went on to sell over 50 million copies,\
    \ making it the most successful new game of the 1970s.\n\nTo play the game, a\
    \ code-maker selects a sequence of four colors, represented by colored pegs that\
    \ come in six different colors. The opponent must guess the code-maker’s secret\
    \ sequence—with as few guesses as possible. Each guess is presented in the form\
    \ of a sequence of four colored pegs. The code-maker reveals how many of those\
    \ pegs are both the correct color and in the correct position and how many more\
    \ are the correct color but in the wrong position. For example, the secret code\
    \ may be *green-white-blue-red*. The guess may be *orange-yellow-blue-white*.\
    \ In this situation, the code-maker indicates that the player has one peg of the\
    \ correct color in the correct position and one peg of the correct color in the\
    \ wrong position, but he doesn’t mention the specific color names. The game continues\
    \ with more guesses. A code-maker selects from a possible 6⁴ (or 1,296) possible\
    \ combinations, assuming there are six colors and four positions.\n\nIn 1977,\
    \ American computer scientist Donald Knuth (b. 1938) published a strategy that\
    \ enables a player to always guess the correct code within five guesses. This\
    \ was the first known algorithm to solve Mastermind, and numerous papers followed.\
    \ In 1993, Kenji Koyama and Tony W. Lai published a strategy with a maximum of\
    \ six guesses required in the worst case, but with an average number of guesses\
    \ of only 4.340. In 1996, Zhixiang Chen and colleagues generalized previous results\
    \ to the case of *n* colors and *m* positions.\n\nMastermind has also been studied\
    \ several times using genetic algorithms inspired by evolutionary biology. In\
    \ 2017, researchers from Asia University in Taiwan employed AI strategies of reinforcement\
    \ learning and obtained an average number of guesses of 4.294."
