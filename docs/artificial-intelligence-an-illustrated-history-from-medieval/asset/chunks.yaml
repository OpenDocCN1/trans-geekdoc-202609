  trans: "\n\n当然，可能有许多原因导致这种超级智能不太可能，例如它需要依赖速度缓慢的人类和硬件网络。另一方面，智能爆炸也可能在治愈疾病和解决环境问题的竞争中为人类带来巨大利益。但是，超级智能武器——甚至是表现出比我们人类配偶更高的智力及（模拟）共情的人工伴侣——将会产生怎样的社会学影响？\n\
    \n**另参阅** “机器中的达尔文”（1863）, 致命性军事机器人（1942）, 人类使用人类（1950）, 防漏的“AI 黑箱”（1993）, 回形针极大化灾难（2003）,\
    \ “称他们为人工外星人”（2015）\n\n**AI 专家系统通常通过**提取人类专家的专门知识来创建，这在这幅插图中通过闪烁的灯泡艺术化地表现出来。专家信息被转换为一组概率规则。\n\
    \n![](img/#9781454933601_epub_cre_r1.xhtml#110-1) \n\n# 1965\n\n# 专家系统\n\n![](img/L01.jpg)\n\
    \n根据记者记者 Luke Dorm 的 的说法，AI“专家系统”是“试图创建血肉之躯人类专家的克隆……通过提取他们的专门知识并将其转换为一组概率规则”。在理想情况下，专家系统在原理上可以用来将胃肠科医生、财务顾问或律师的诀窍输入到计算机设备中，并让生成的\
    \ AI 系统为所有人提供有用建议。\n\n专家系统于 20 世纪 60 年代开始探索，并利用知识库（包含事实和规则的表示）和推理引擎（用于应用规则并执行评估）。规则可能是“如果-那么”（if-then）的形式，例如“如果一个具有特定人口统计特征的患者表现出特定症状，那么他或她很有可能某种某种疾病。”\n\
    \n专家系统的应用可能广泛包括诊断、预测、规划、分类以及涉及专业知识领域的相关领域，范围从医学到评估保险风险或矿产勘探的潜在位置。实用的专家系统通常具有可以提供解释的推理引擎，以便用户能够理解推理链。一个著名的早期专家系统例子是\
    \ `Dendral`（`Dendritic Algorithm` 的缩写），这是斯坦福大学于 1965 年启动的一个项目，旨在帮助化学家根据质谱信息识别未知的有机分子。另一个著名的早期例子是\
    \ `MYCIN`，这是斯坦福大学于 20 世纪 70 年开发的 AI 系统，用于帮助诊断细菌感染并推荐抗生素和剂量。早期的专家系统通常用 `LISP` 或\
    \ `Prolog` 编写。\n\n专家系统的挑战之一涉及从特定领域忙碌的专家或从书籍和论文中获取并编码知识。将知识组织成专家认同的事实和规则集合，并应用各种数值权重（以表示可能性或重要性），也具有挑战性。今天，许多人使用“推荐系统”，这是\
    \ AI 的一个某种相关的领域，更多关注于预测从电影、书籍到金融服务和潜在婚姻配偶等领域的用户偏好。\n\n**另参阅** 人类使用人类（1950）](#9781454933601_epub_c043_r1.xhtml#c-043),\
    \ 知识表示与推理（1959）, 深度学习（1965）\n\n人类使用人类（1950）](#9781454933601_epub_c043_r1.xhtml#c-043),\
    \ 知识表示与推理（1959）, 深度学习（1965）\n\n在 `if-then` 表达式中，逻辑被应用于特定的条件。设计 `if-then-c051_r1.xhtml#c-051`\
    \ 和 `9781454933601_epub_c058_r1.xhtml#c-058` 指的是具体的实现。\n\n![](img/#9781454933601_epub_cre_r1.xhtml#112-1)\n\
    \n# 1965\n\n# 模糊逻辑\n\n![](img/L01.jpg)\n\nCarter 写道：“模糊集已应用于商业领域。”经典的二值逻辑只关注真或假，而模糊逻辑允许连续的真值范围。经典的二值逻辑只关注真或假。模糊集合理论（关注成员的）由数学家和计算机科学家\
    \ Lotfi Zadeh（1921–2017）于 1965 年引入，并在 1973 年提供了。\n\n例如，可以为冷、暖、热存在隶属函数，但也有如“不冷”、“微暖”和“微热”这样的值。\n\
    \n模糊逻辑历史上的一个里程碑发生在 1974 年，伦敦大学的 Ebrahim Mamdani（1942–2010）使用了它。1980 年，模糊逻辑被应用于水泥窑。许多日本公司已使用模糊逻辑。\n\
    \n"
- fmt: "\nGeneraly speaking, the multiple layers of neurons can perform feature extraction\
    \ on the data at different levels of a hierarchy (e.g., responding to simple edges\
    \ at one level and to facial features at another). Deep learning may involve `backpropagation`,\
    \ a process in which the system can pass information in a reverse direction, from\
    \ output to input, in order to teach the system when it has made errors so as\
    \ to improve the results.\n\nDeep learning has been successfully applied to speech\
    \ recognition, computer vision, natural language processing, social networking,\
    \ human language translations, drug design, identifying specific style periods\
    \ for paintings, making product recommendations, estimating the value of different\
    \ marketing actions, performing image restoration and cleaning, playing games,\
    \ identifying people in photos, and more.\n\nAs technologist Jeremy Fain writes:\
    \ “Ultimately, deep learning has pushed machine learning across a threshold. Whereas\
    \ machine learning had some success in automating repetitive tasks or data analytics,\
    \ it is now bringing the future to life in the form of computers that can see,\
    \ hear and play all types of games.”\n\n**SEE ALSO** [Artificial Neural Networks\
    \ (1943)](#9781454933601_epub_c039_r1.xhtml#c-039), [Reinforcement Learning (1951)](#9781454933601_epub_c044_r1.xhtml#c-044),\
    \ [Perceptron (1957)](#9781454933601_epub_c048_r1.xhtml#c-048), [Machine Learning\
    \ (1959)](#9781454933601_epub_c050_r1.xhtml#c-050), [Computer Art and DeepDream\
    \ (2015)](#9781454933601_epub_c092_r1.xhtml#c-092), [Adversarial Patches (2018)](#9781454933601_epub_c098_r1.xhtml#c-098)\n\
    \n**Shakey was notable for setting serious milestones** in the fields of pattern\
    \ recognition and computer vision, problem solving, natural-language processing,\
    \ and information representation. Shakey contained a TV camera, distance rangefinders,\
    \ collision sensors, and motors for steering.\n\n[![](OEBPS/images/116-1.jpg)](#9781454933601_epub_cre_r1.xhtml#116-1)\
    \ \n\n# 1966\n\n# SHAKEY THE ROBOT\n\n![](OEBPS/images/L01.jpg)\n\nIn 1970, *Life*\
    \ magazine referred to Shakey as the world’s “first electronic person” who could\
    \ soon “travel about the Moon for months at a time without a single beep of direction\
    \ from Earth.” Although the report of this fascinating robot was quite an exaggeration,\
    \ Shakey was notable for setting serious milestones in the fields of pattern recognition\
    \ and computer vision, problem solving, natural-language processing, and information\
    \ representation.\n\nDeveloped between 1966 and 1972 at the Stanford Research\
    \ Institute, Shakey was among the earliest serious attempts to design a general-purpose,\
    \ autonomous robot that could move around, perceive its surroundings, monitor\
    \ the execution of its plans, and reason about its actions. The project was funded\
    \ by the US Defense Advanced Research Projects Agency (DARPA) and was primarily\
    \ programmed using `LISP`. In order for the robot to perform well, its world was\
    \ limited to several rooms, connected by corridors, with doors, light switches,\
    \ and objects that Shakey could push around. An operator typed in commands like\
    \ “Push the block off the platform,” and Shakey attempted to explore and identify\
    \ the platform, push a ramp to the platform, drive up the platform, and push the\
    \ block off.\n\nShakey relied on various levels of programs. For example, one\
    \ level used routines for route planning, motor control, and the capturing of\
    \ sensory information, while a middle level was concerned with actually moving\
    \ to a designated position and processing the images from Shakey’s TV camera.\
    \ High-level programming involved task planning and performing sequences of actions\
    \ to achieve goals.\n\nNot surprisingly, Shakey the robot got its name from its\
    \ jerky motion as it drove about. Carrying around an antenna for a radio and video\
    \ link to a `DEC PDP` computer, Shakey also contained a TV camera, distance rangefinders,\
    \ collision sensors, and motors for steering. The development of Shakey led to\
    \ important research in AI.\n\n**SEE ALSO** [Natural Language Processing (1954)](#9781454933601_epub_c046_r1.xhtml#c-046),\
    \ [SHRD (1971)](#9781454933601_epub_c065_r1.xhtml#c-065), [Robot (1999)](#9781454933601_epub_c084_r1.xhtml#c-084),\
    \ [Friends (2000)](#9781454933601_epub_c085_r1.xhtml#c-085), [Mars (2015)](#9781454933601_epub_c094_r1.xhtml#c-094)\n\
    \n**As computers become more powerful,** perhaps someday we will be able to simulate\
    \ entire worlds—and it is possible that more advanced beings are already doing\
    \ this.\n\n[![](OEBPS/images/118-1.jpg)](#9781454933601_epub_cre_r1.xhtml#118-1)\
    \ \n\n# 1967\n\n# LIVING IN A SIMULATION\n\n![](OEBPS/images/L01.jpg)\n\n“Our\
    \ universe seems real, but is it really?” writes Jason Koebler. “As humans get\
    \ better at simulating, it seems at least plausible that we could create conscious\
    \ life.” The hypothesis that the universe is a digital computer was pioneered\
    \ by German engineer `Konrad Zuse`. Other researchers, including `Ed Fredkin`\
    \ (1934), `Stephen Wolfram` (1959), and `Max Tegmark`, have suggested that the\
    \ physical universe may be running on `cellular automaton` or discrete machinery.\n\
    \nWhat if the number of these simulations is larger than the number of universes?\
    \ Astrophysicist Martin Rees (b. 1942) suggests that if this were the case, “.\
    \ . . as they would if one universe contained many computers making many simulations,”\
    \ then it is likely that *we* are artificial life. Rees continues, “Once you accept\
    \ the idea of the multiverse . . , in some of those universes there will be the\
    \ potential to simulate parts of themselves, . . and we don’t know what our place\
    \ is in this grand ensemble of universes and simulated.”\n\nPhysicist Paul Davies\
    \ (b. 1946) expanded on the notion of a multiverse with multiple simulated realities\
    \ in a 2003 *New York Times* article: “Eventually, entire virtual worlds will\
    \ be created inside computers, their conscious inhabitants unaware that they are\
    \ the simulated products of somebody else’s technology. For every original world,\
    \ there will be a stupendous number of available virtual worlds—some of which\
    \ would even include machines simulating virtual worlds of their own. . . .”\n"
