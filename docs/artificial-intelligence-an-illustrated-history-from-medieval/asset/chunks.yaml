    \ rarely been achieved. We explore a research methodology which emphasizes ongoing\
    \ physical interaction with the environment as the primary source of constraint\
    \ on the design of intelligent systems.”\n\nOne of several points made by Brooks\
    \ in his paper is that all around us are intelligences far removed from chess\
    \ playing, in the form of intelligent animals (e.g., elephants) and even insect\
    \ swarms. Brooks believed that AI research should move, at least in part, from\
    \ a focus on classical AI involving rules, symbol manipulation, and search trees\
    \ to one based more on considerations that include sensorimotor coupling with\
