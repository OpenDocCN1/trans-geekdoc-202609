  trans: "\n\n2016 年，一种名为智能组织自主机器人（STAR）的机器人手术系统，利用其增强的视觉能力、机器智能和灵巧性，在猪的小肠上展示了它的技能。与人类外科医生相比，STAR\
    \ 的缝合更加一致，并且生成的肠道在接缝处具有更强的抗漏性。在这一“监督解剖”的案例中，STAR 的视觉系统依赖于放置在肠道组织上的近红外荧光标记，帮助其摄像头追踪组织。STAR\
    \ 规划了缝合任务，并根据组织的移动不断做出调整。\n\n手术机器人日益增长的自主性已经拥有一段令人印象深刻的过去，这根源于机器人辅助手术的日益增加。机器人手术最流行的形式类似于腹腔镜手术，也称为`钥匙孔手术`或`微创手术`，这种手术通过小切口进行，并以最大限度地减少出血和疼痛同时加速患者康复而闻名。然而，机器人手术并不是让医生悬停在患者上方直接操作插入患者体内的管状设备，而是让医生舒适地坐在控制台前操作连接在多个机器人手臂上的器器，同时查看从患者体内传输的\
    \ 3D 图像。与腹腔镜手术不同，机器人手术可以抑制医生的手抖，并可以将大幅的手部动作等比例缩小，以对微动作和操作提供更高的精确度。在新兴的远程手术领域，连接到高速通信网络的机器人器械允许医生对位于另一个房间的患者进行手术。\n\
    \n2000 年，美国外科医生马尼·梅农（Mani Menon，1948 年出生）成为美国首位使用机器人切除癌症前列腺的医生，并在同年建立了该国首个机器人前列腺切除中心。今天，机器人辅助腹腔镜已用于子宫切除、心脏瓣膜修复、疝气修复、胆囊切除等。机器人还被用于执行骨科膝关节置换、植发和\
    \ Lasik 眼科手术中的关键步骤。\n\n**另见** 致命性军事机器人（1942）, 自动驾驶汽车（1984）, AI 死亡预测器（2019）\n\n\
    **2017 年，AI 程序**在德州州扑克赛中击败了人类职业扑克选手。在这里，玩家拥有`不完全信息`，这使得该游戏对计算机来说特别具有挑战性，并需要一种“直觉”来确定获策略。\n\
    \n![](img/#9781454933601_epub_cre_r1.xhtml#192-1) \n\n# 2017\n\n# AI 扑克\n\n![](img/L01.jpg)\n\
    \n2017 年，大量的新闻报道宣布了两个不同 AI 程序的巨大胜利，这些程序在一种名为德州州扑克的游戏中击败了人类职业扑克选手。过去，AI 已经能够在许多类型的游戏中击败人类——例如象棋和围棋——这些游戏涉及`完美信息`，即没有任何信息被隐藏在玩家视野之外。在德州州扑克中，最初会给两个或多个玩家发放两张随机的底朝牌。每当一组新的公共牌出现时，玩家被要求“下注、持牌或放弃”桌上的赌注。在这里，玩家拥有`不完全信息`，这使得该游戏对计算机来说特别具有挑战性，并需要一种“直觉”来确定获胜策略。另一个挑战是存在大量可能的游戏场景（大约`10¹⁶⁰`）。在无限制德州州扑克中，玩家通常会制定跨越许多回合的下注策略，并经常尝试诈牌（例如，持好牌时小注，或仅仅为了迷惑对手而下注）。\n\
    \n尽管面临这些挑战，一个名为`DeepStack`的 AI 能够在单人对战无限制德州州扑克中击败职业扑克选手。该 AI 使用了深度学习，通过与自己进行数百万次随机扑克对局来训练人工神经网络，以便预先培养扑克直觉。2017\
    \ 年报道的另一个消息是另一个名为`Libratus`的扑克 AI，它在为期 20 天的比赛中击败了四位排名前四的人类德州州克选手。`Libratus`没有使用神经网络，而是使用了一种不同的算法方法，称为`反事实遗憾最小化`（在每次游戏模拟后，程序都会回顾其决策并寻找改进策略的方法）。有趣的是，虽然`DeepStack`可以在笔记本电脑上运行，但`Libratus`则需要更复杂的计算机硬件。\n\
    \n请注意，处理不完全信息的 AI 在许多现实世界情况中可能是很有用的，例如预测房屋的最终售价或为新车谈判一个理想的价格。有趣的是，各种技能水平的“扑克机器人”（玩扑克的程序）已经存在多年，但它们通常不被允许在人类之间的在线扑克游戏中作为人类的助手。\n\
    \n**另见** 人工神经网络（1943）, 深蓝击败象棋冠军（1997）, 深蓝击败象棋冠军（1997）, Quackle 赢得比赛（2006）, AlphaGo\
    \ 围棋冠军（2016）\n\n**研究人员表明**，在某些领域可以放置不完全信息的补丁来欺骗 AI“认为”香蕉是烤面包机。这显示了在某些应用中使用 AI\
    \ 的风险。\n\n![](img/#9781454933601_epub_cre_r1.xhtml#194-1) \n\n# 2018\n\n# 对抗补丁\n\
    \n![](img/L01.jpg)\n\n想象一下你可以别在衬衫上的按钮，或者贴在交通标志上的贴纸，以此让 AI 实体（例如智能摄像头或自动驾驶汽车）认为你或该标志是任何你想让变成的东西。这种情况并非遥远，而且对于依赖机器学习以及视觉或音频系统做出决策的\
    \ AI 来说，这是一个风险。\n\n2017 年，谷歌的研究人员设计了带有彩色图案的圆形补丁来干扰图像分类器。这些补丁可以欺骗 AI 系统认为香蕉——或任何物体是烤面包机，例如，当补丁放在物体附近时。过去的实验曾让\
    \ AI 系统将乌龟认为是步枪，将步枪认为是直升机。尽管视觉对抗补丁人类可以清晰看到，但奇怪的图案（例如建筑上的图形或复杂的 3D 雕塑的存在）可能会被误认为是艺术，因此观察者不会意识到该图案正在误导\
    \ AI 将医院误认为军事目标，例如。\n\n"
