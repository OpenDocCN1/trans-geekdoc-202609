  trans: "\n\n“1738 年，29 岁的法国制表师雅克·德·沃康森（Jacques de Vaucanson [1709–1782]）在杜乐丽花园展示了一只可能是世世界上最著名的机器人之一，”美国神经科学家学家保罗·格林彻（Paul\
    \ Glimcher）写道。沃康森的鸭拥有数百个活动部件和羽毛。它能转头，用喙拨弄水，拍动翅膀，嘎嘎叫，从展示者的手中吞咽食物，并执行许多其他真实的动作。几分钟后，消化的残渣就会从下方排出。当然，这只鸭并没有真的在消化食物，它的尾部被秘密地预装了模拟排泄物。尽管如此，这种多功能的自动机器引发了关于生命与纯机械之间界限的讨论，以及随着机器人实体变得更加多样，这种边界在多大程度上会被模糊。\n\
    \n随着时间的推移，人们对这只著名的消化鸭痴迷日益增加，这个奇特的生物甚至出现在托马斯·品钦（Thomas Pynchon）广受赞誉的 1997 年小说《梅森与迪克森》（Mason\
    \ & Dickson）中，在那里，这个生物产生了意识，并用它的*死神之*（*bec de la mort*）追踪并恐怖一名法国厨师。\n\n沃康森还创造了一个精妙的自动笛子演奏者，由连接在三个风管上的几个风箱驱动。齿轮和凸轮触发杠杆，控制笛子演奏者的手指、舌头和嘴唇。历史学家杰西卡·里斯金（Jessica\
    \ Riskin）写道：“这个机械笛手演奏者是狄德罗《百科全书》（*Encyclopédie*）中所定义的‘人偶’的第一个例子，即执行人类功能的人形。”更具实用意义的是，17\
    \ 世纪 40 年代，沃康森设计了织丝机器——遗憾的是，这导致了（人类）丝织工的反抗，并在街上向他投石。\n\n格林彻写道：“沃康森的鸭向 18 世纪的观众提出了至今仍困扰着现代神经科学的古老问题：我们每个人内部发生的机械相互作用足以产生我们实际上产生的复杂行为模式吗？定义我们为人类的究竟，是我们产生行为的复杂性，还是似乎产生我们行为的物质特定特定模式？”\n\
    \n**另需阅读** 赫斯丁机械公园（约 1300 年）, 达芬奇的机器人骑士（约 1495 年）, 意识工厂（1714 年）, *草原上的蒸汽人*（1868\
    \ 年）, *电鲍勃的大黑鸵*（1893 年）\n\n**窥探土耳人的内部，**来自约瑟夫·冯·拉克尼茨（Joseph von Racknitz 1744–1818），他假设了土耳人是如何运作的。（摘自《冯·肯普伦先生的棋手及其复制品》（*About\
    \ the Chess-Player of Mr. von Kempelen and its Replica*），莱比锡与德累斯顿，1789 年。）\n\n\
    ![](img/9781454933601_epub_cre_r1.xhtml#34-1) \n\n# 1770：机械土耳人\n\n![](img/L01.jpg)\n\
    \n机械土耳人是 1770 年由匈牙利发明家沃尔夫冈·冯·肯普伦（Wolfgang von Kempelen 1734–1804）创造的下棋机器人，并献给奥地利哈布堡皇后玛丽亚·特蕾莎。这台机器看起来棋艺水平极高，因为它击败了欧洲和美洲的棋手，包括拿破仑·波拿破和本杰明·富兰克林等名人。这个等身机器人披着袍子、戴着头巾、留着黑胡子，坐在一个巨大的柜子上，顶部有一个棋盘，并实际上用手移动棋子。它的运作秘密在多年来一直不为人知，但今天我们明白，那个复杂的柜子巧妙地隐藏了一位人类象棋专家，他利用磁铁移动棋子，并利用各种杠杆移动机器人的各个部分。为了增加神秘感，肯普伦在比赛前实际上会打开柜子门，露出内部的发条机构，那里显然没有人类可以躲藏的空间。即使许多人理解土耳人是一个精密的“骗局”，它仍然让人们好奇种种机器能够完成工作——以及机器可能会取代哪些人类能力。\n\
    \n关于土耳人如何运作，有很多不准确的文章。例如，爱德加·艾伦·波（Edgar Allan Poe）错误地暗示，棋手坐在土耳人机器人的身体内部。有趣的是，现代计算机之父之一查尔斯·巴别奇（Charles\
    \ Babbage）可能受到了土耳人的启发，因为巴别奇在开始研究他的机械计算机器时，曾思考机器*是否能够*“思考”，或者至少执行高度复杂的计算。\n\n作者埃拉·莫顿（Ella\
    \ Morton）指出：“尽管这个[土耳人]最终依赖于人类行为和一点老式的魔法，但它那令人信服的机械本质既引起了惊奇也引起了担忧。土耳人正处于工业革命中心，引发了关于自动化本质以及创造能够思考的机器可能性的令人不安的问题。土耳人似乎是依靠发条机制运作的这一事实……与国际象棋是……‘纯智力领域’的观点相矛盾。”\n\
    \n**另需阅读** 巴别奇的机械计算机（1822 年）, “大象不下棋”（1990 年）, 国际象棋与人工智能（1994 年）, 深蓝击败国际象棋冠军（1997\
    \ 年）\n\n**雅克-德罗兹写字机器人，**位于瑞士纳尚泰尔艺术历史博物馆（Musée d’Art et d’Histoire）。\n\n![](img/9781454933601_epub_cre_r1.xhtml#36-1)\
    \ \n\n# 1774：雅克-德罗兹自动机器\n\n![](img/L01.jpg)\n\n“它们可能是巨大的木偶，”让·洛兰（Jean Lorrain\
    \ 1845–1906）写道，“或是在恐慌中留下的假人——我推测某种瘟疫席卷了这座城市，清空了居民。对这些栩如生的自动机器的奇异想法提醒着我们对类生物的痴迷，以及这些特定的\
    \ 18 世纪自动机器可能是计算机的早期祖先，考虑到它们的复杂性和可编程性。”这三个自动机器由制表师皮埃·雅克·德罗兹（Pierre Jaquet-Droz\
    \ 1721–1790）在 1768 年至 1774 年间创造——写字男孩（由 6000 个部件组成）、女性音乐家（2500 个部件）和儿童素描画家（2000\
    \ 个部件）吸引了大量仰慕者。写字男孩将羽毛笔浸入墨水，并通过一组凸轮程序可以编写长达四十个字符的信息。他会定期给笔上墨，并在写字时眼睛跟随文字。\n\n\
    音乐家自动机器通过手指实际按键演奏管风琴。她看起来像活了过来，做出自然的身体和头部动作，并眼睛跟随她的手指。她被设计成在表演前后继续“呼吸”，身体随着音乐呈现出似乎的情感起伏。素描画家可以画四种不同的形象：一只狗、路易十五世肖像、驾驶马车的丘比特和一对皇室夫妇。”\n\
    \n"
