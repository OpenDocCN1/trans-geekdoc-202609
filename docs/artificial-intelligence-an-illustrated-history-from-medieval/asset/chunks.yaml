    # 1818

    # FRANKENSTEIN


    ![](OEBPS/images/L01.jpg)


    “Frankenstein was written during the first Industrial Revolution,” writes Paolo
    Gallo, the Chief Human Resources Officer at World Economic Forum, “a period of
    enormous changes that provoked confusion and anxiety for many. It asked searching
    questions about man’s relationship with technology: Are we creating a monster
    we cannot control, are we losing our humanity, our compassion, our ability to
    feel empathy and emotions?”


    The dangers of a special kind of artificial intelligence is a prominent theme
    in the novel *Frankenstein; or, The Modern Prometheus* (1818) by Mary Shelley
    (1797–1851). In the novel, scientist Victor Frankenstein robs slaughterhouses
    and cemeteries in order to construct a creature from various parts, which he then
    animates with “a spark of life.” Meanwhile, he reflects on his creation as an
    experiment in achieving immortality: “Life and death appeared to me ideal bounds,
    which I should first break through, and pour a torrent of light into our dark
    world. A new species would bless me as its creator. . . . I thought, that if I
    could bestow animation upon lifeless matter, I might . . . renew life where death
    had apparently devoted the body to corruption.”


    By the time Mary Shelley finished her novel at age nineteen, Europeans were fascinated
    by theories about the role of electricity in biology and the potential for reanimation
    of dead tissue. The basic story idea came to her in a dream. As it happens, Italian
    physicist Giovanni Aldini (1762–1834) had participated in many public attempts
    at human reanimation through electricity around 1803 in London.


    Death and destruction lurk everywhere in the novel, as numerous characters meet
    their ends. Notably, Victor destroys the unfinished female companion for his monster,
    and the monster (who is never actually referred to by the name “Frankenstein”)
    kills Elizabeth, the scientist’s wife. By the end of the novel, Victor has pursued
    his creation to the North Pole, where Victor dies, and the creature vows to kill
    himself on his own funeral pyre.


    Journalist Daniel D’Addario notes: “Frankenstein relies on the notion that humans
    will inherently reject artificial intelligence as unnatural. A great deal of that
    is owed to the particularly odd appearance of Frankenstein’s monster. . . . But
    about when A.I. comes in a more attractive package, one that has real utility?”


    SEE ALSO [Talos (c. 400 BCE)](#9781454933601_epub_c002_r1.xhtml#c-002), [Golem
    (1580)](#9781454933601_epub_c013_r1.xhtml#c-013), [The Steam Man of the Prairies
    (1868)](#9781454933601_epub_c026_r1.xhtml#c-026), [Rossum’s Universal Robots (1920)](#9781454933601_epub_c033_r1.xhtml#c-033)


    Electric Sheep. “Electric Sheep” refers to collaborative abstract artwork developed
    by Scott Draves. The more popular sheep live longer and reproduce according to
    a genetic algorithm with mutation and crossover.


    [![](OEBPS/images/40-1.jpg)](#9781454933601_epub_cre_r1.xhtml#40-1)


    # 1821

    # COMPUTATIONAL CREATIVITY


    ![](OEBPS/images/L01.jpg)


    “As a society, we are jealous of creativity,” write Simon Colton and Geraint Wiggins
    of Computational Group at Goldsmith College. “Creative people and their contributions
    to cultural progression are highly valued. Moreover, creative behavior in people
    draws on a full set of intelligent abilities, so simulating such behavior represents
    a serious technical challenge for Artificial Intelligence research. As such, we
    believe it is fair to characterize Computational Creativity as a frontier for
    AI research beyond all others—maybe, even the final frontier.”


    “Computational creativity,” or CC, has several meanings. Here, we refer to subfield
    of AI that simulates creativity using a computer or other machine. The results
    often seem to be novel and potentially useful. CC can also refer to programs that
    enhance human creativity. For example, using artificial neural networks (ANNs)
    and other methods, researchers have produced beautiful music or paintings in the
    style of previous artists. In particular, generative adversarial networks (GANs)
    may employ two `ANN` to produce photorealistic images of faces, birds, and room
    interiors. Other CC approaches are used for formulating tasty recipes, producing
    new kinds of visual art, creating poetry and stories, and for generating jokes,
    mathematical theorems, US patents, new games, innovative designs for antennas
    and heat exchangers, and more. In short, by some form of computational or artificial
    means, a computer can generate designs and output that, if any human produced
    them, would be deemed to be a creative act.


    For an early, simple example of CC, consider that in 1821 Dietrich Winkel (1777–1826)
    invented the componium, an automatic musical organ that could produce seemingly
    endless variations on a musical theme. It had two barrels that took turns performing
    two measures of randomly chosen music. A flywheel acted as a kind of programmer
    to determine the selections. Winkel said that if each performance lasted five
    minutes, the componium would require more than 138 trillion years to produce every
    possible combination of music!


