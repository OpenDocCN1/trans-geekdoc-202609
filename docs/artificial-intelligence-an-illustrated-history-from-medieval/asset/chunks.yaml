  trans: "\n\n电影《大都会》（*Metropolis*）中的`Maria`，展示于宾夕法尼亚州匹兹堡科学中心的机器人名人堂。\n\n![](img/#9781454933601_epub_cre_r1.xhtml#66-1)\
    \ \n\n# 1927：大都会\n\n![](img/L01.jpg)\n\n在 1927 年的无声电影《大都会》中——由弗里茨·朗格（1890–1976）导演，特娅·冯·哈尔堡（1888–1954）编剧——发明家\
    \ `C. A. Rotwang` 解释说，他的机器人永不会疲劳或犯错，这些未来的工人将与人类无二致。故事设定在一个未来的城市里，人类被分为统治城市的闲闲阶级和在地下劳作、运行庞大机器的底层阶级。\n\
    \n女主角`Maria`是一个关心工人及其生活艰辛的年轻女性。随着这部具有视觉冲击力的电影发展，`Rotwang`创造了一个外貌酷似`Maria`的机器人，试图破坏她在工人声誉并阻止任何反抗。模拟出的`Maria`实际上促使工人起义，但她随后被捕获并在火架上处死。随着她被燃烧，类人的外表融化，露出了内部具有金属质感的机器人。\n\
    \n电影的格言是“大脑与肌肉之间的中介必须是心”，借此探讨了人类与人工智能之间的本质区别。考虑到《大都会》的影响，未来主义者托马斯·隆巴多（Thomas Lombardo）写道：“事实上，科幻小说中的机器人出现了一种人类与机器的象征性融合——人类变得机械化，被其技术产物同化；机器变得人性，体现了我们最糟糕的特质和特征……它人格化了我们对科学技术的恐惧，以及对我们可能变成什么样子的恐惧。”\n\
    \n《大都会》的主题在更现代的科幻电影中回响，例如邪典经典《银翼杀手》（1982）中的合成人类。当然，对技术的过度依赖以及人工智能时代的劳动力未来是今天讨论的热门话题。随着人工智能实体越来越多地被误认为是人类，《大都会》在未来将继续具有意义。当人工智能开发出能够冒充我们信任或尊重的人的能力，或者成为我们所爱的“模拟生物”时，其后果将是深远的。\n\
    \n**另见** 罗索姆的通用机器人（1920）, 图灵测试（1950）, 人工智能伦理（1976）, *银翼杀手》（1982）\n\n来自 1939–1940\
    \ 年纽约世博会上西门子展展的“机电人”`Elektro`。\n\n![](img/#9781454933601_epub_cre_r1.xhtml#68-1)\
    \ \n\n# 1939：机电人 Elektro\n\n![](img/L01.jpg)\n\nElektro 在书中占有一席之地，因为他被誉为世界上首批“名人机器人”之一以及“美国最古老的生存机器人”。\n\
    \n他由`西门子电气公司`制造，并在 1939 年纽约世博会上展出，在那里立即大受欢迎。这个身高 7 英尺（2.1 米）的人形机器人可以根据语音指令移动，会说成百个单词，甚至还会抽烟。他的光电眼睛可以分辨红光和绿光。1940\
    \ 年，他身边跟着`Sparko`，一只会叫和移动的机器人狗。世博会的无数游客排队看他长达二分钟的表演。\n\n意识到许多人会误认为他的能力是机器人服装内隐藏了一个人类的结果，他的设计师故意在他身体上开了一个洞，以证明事实并非如此。实际上，他是用凸轮、齿轮和电机制造的，用来移动他的头部、嘴巴和手臂。工程师`Joseph\
    \ Barnett`发明了他，利用了一系列连接到继电器开关的 78 转胶片机来产生 700 个单词的词汇量。机器人可以说“我的大脑比你的大”之类的话，并根据他听到的单词或音节数量做出反应。例如，三个单词（无论是什么单词）就会激活继电器以停止\
    \ Elektro 的运动。遗憾的是，他和`Sparko`无法走得太远，因为他们实际上通过连接在脚附近的电缆由附近的操作员控制。\n\n多年来，Elektro\
    \ 激励了许多儿童追求工程事业。他还出现在 1960 年的喜剧电影《小猫咪上大学》（*Sex Kittens Go to College*）中，随后被迅速拆解，他的头部作为退休礼物送给了一名`西门子`员工。2004\
    \ 年，他的各个零件被重新发现。\n\n**另见** 达芬奇的机器人（1495）, 蒸汽人（1862）, 机器人 Shakey（1966）, ASIMO 和朋友们（2000）\n\
    \n**VODER，**模拟了人类声道的效果，在 1939 年纽约世博会上令观众着迷。`VODER`使用一个控制台，操作员可以通过控制台产生语音。\n\n\
    ![](img/#9781454933601_epub_cre_r1.xhtml#70-1) \n\n# 1939：语音合成\n\n![](img/L01.jpg)\n\
    \n也许你们许多人都听过`Stephen Hawking`（1942–2018）的合成声音，由于运动疾病导致无法说话，多年一直使用语音合成器。事实上，计算机系统将文本转换为语音的能力已用于许多用途，包括为视障人士、儿童或阅读困难的人朗读。合成语音还可以让计算机系统创造出人类交互的印象。新的神经网络方法现在模拟特定人的语音，因此我们生活在一个越来越难以判断我们信任（例如合作伙伴、父母、孩子）的声音是否由本人生成的世界上。当有人可以“偷取”别人的声音并让他们说什么时会发生什么？\n\
    \n语音合成通过多种方式实现。例如，工程师可以存储数字语音并在播放时将其拼接，或者通过*共振峰法*利用声学信号的特征频率成分（共振峰）。在*生理合成法*中，模拟声道模型。当然，像说话闹钟、汽车和计算器等简单系统只需要存储录制的单词。\n\
    \n将文本转换为自然易懂的语音面临许多挑战。例如，考虑英语中*tear*、*bass*、*read*、*project*、*desert*等单词的各种读音，这些读音取决于它们所处的语境。\n\
    \n语音合成史上的早期里程碑之一涉及`Homer Dudley`（1896–1980）的工作，他发明了`vocoder`（即“语音编码器”），它可以使用各种电子滤波器产生语音，以及`VODER`（即“语音操作演示器”），它使用一个操作员可以语音的控制台。后者模拟了人类声道的效果，在\
    \ 1939 年纽约世博会上展出。\n\n"
- fmt: "\n**Author Isaac Asimov,** famous for his “Three Laws of Robotics,” is shown\
    \ here in 1977 on the cover of his science-fiction magazine, in which he further\
    \ develops the idea of artificial intelligence in his story “Think!”\n\n[![](OEBPS/images/72-1.jpg)](#9781454933601_epub_cre_r1.xhtml#72-1)\
    \ \n\n# 1942\n\n## ASIMOV’S THREE LAWS OF ROBOTICS\n\n![](OEBPS/images/L01.jpg)\n\
    \nAs AI and robotics advance in the coming decades, what constraints or codified\
    \ laws should be developed to ensure that such entities do not take actions that\
    \ harm humans? In 1942, author and edu-cator Isaac Asimov (1920–1992) introduced\
    \ his famous “Three Laws of Robotics” in a short story called “Runaround,” which\
    \ features a smart robot’s interactions with people. The Three Laws are (1) a\
    \ robot may not injure a human being or, through inaction, allow a human being\
    \ to come to harm; (2) a robot must obey the orders given it by human beings except\
    \ where such orders would conflict with the First Law; (3) a robot must protect\
    \ its own existence as long as such protection does not conflict with the First\
    \ or Second Laws. Asimov went on to write many stories that illustrated how these\
    \ simple laws could have unintended consequences.\n\nLater, he provided an additional\
    \ law: “A robot may not harm humanity, or, by inaction, allow humanity to come\
    \ to harm.” These laws have been influential, not only for science-fiction writers,\
    \ but also for AI experts. AI researcher Marvin Minsky (1927–2016) noted that\
    \ after encountering Asimov’s laws, he “never stopped thinking about how minds\
    \ might work. Surely we’d someday build robots that think. But how would they\
    \ think and about what? Surely logic might work for some purposes, but not for\
    \ others. And how to build robots with common sense, intuition, consciousness\
    \ and emotion? How, for that matter, do brains do those things? ”\n\nThe laws\
    \ are notable and useful for the countless questions they raise. What other laws\
    \ might we add to the Asimov set? Should robots never pretend they are human?\
    \ Should robots “know” that they are robots? Should they always be able to explain\
    \ why they acted as they have? What if a terrorist used multiple robots to harm\
    \ people, without each robot knowing the entire plan, and thus not violating the\
    \ First Law? We may also consider how these laws may have an impact on robot army\
    \ medics who must perform triage when they cannot tend to multiple injured soldiers,\
    \ or autonomous vehicles that must determine whether to crash into playing children\
    \ or drive off a cliff and kill a passenger. Finally, could a robot really decide\
    \ what it means to “harm humanity,” given that its interactions could have repercussions\
    \ for years into the future?\n\n**SEE ALSO** [Lethal Military Robots (1942)](#9781454933601_epub_c038_r1.xhtml#c-038),\
    \ [Ethics of AI (1976)](#9781454933601_epub_c068_r1.xhtml#c-068), [*Blade Runner*\
    \ (1982)](#9781454933601_epub_c071_r1.xhtml#c-071), [Autonomous Vehicles (1984)](#9781454933601_epub_c072_r1.xhtml#c-072)\n\
    \n**Artist’s conception of a lethal autonomous drone,** attacking enemy tanks\
    \ after visual recognition and AI confirmation.\n\n[![](OEBPS/images/74-1.jpg)](#9781454933601_epub_cre_r1.xhtml#74-1)\
    \ \n\n# 1942\n\n## LETHAL MILITARY ROBOTS\n\n![](OEBPS/images/L01.jpg)\n\nRobots\
    \ used in warfare include many examples in the 1900s, such as the tank-like `Goliath`\
    \ used by the Germans beginning in 1942, during World War II, on all fronts where\
    \ the Wehrmacht fought. The unmanned `Goliaths` were remote-controlled via a connecting\
    \ cable and carried high explosives so that the machines could blow up along with\
    \ their intended targets.\n\nToday, drones (unmanned flying vehicles) can be armed\
    \ with missiles to serve as an effective weapons system, but they usually require\
    \ remote human input and authorization before being “allowed” to destroy a target.\
    \ Of historical note, an `MQ-1 Predator` drone launched the first-ever deadly\
    \ airstrikes from a drone in 2001 in Afghanistan. Debates continue regarding the\
    \ possible future use of lethal *autonomous* weapons that could actually select\
    \ and attack military targets without human intervention. Automatic defensive\
    \ systems do exist today, including machines that can autonomously identify and\
    \ attack incoming missiles.\n\nPossible advantages of military robots are many:\
    \ they never tire or show fear; they can rapidly perform maneuvers that would\
    \ injure human pilots; and they could potentially save lives of soldiers and reduce\
    \ collateral damage and civilian casualties. In principle, machines might be instructed\
    \ to follow various rules, such as not to fire when unsure if a target is a civilian\
    \ or a combatant, or whether lethal force is permitted. Perhaps damage potential\
    \ to civilians might be programmed and restricted to be proportional to the size\
    \ of a military target. Facial-recognition software could be used to enhance accuracy,\
    \ and military robots could work side by side with soldiers, enhancing their abilities\
    \ much like software or robotics may be used today to assist with surgeries. But\
    \ how much independence should such fighting machines be given?\n\nIn 2015, a\
    \ large group of AI experts signed a letter warning of the dangers of `military\
    \ use`, which could lead to a `global arms race`.\n\n**SEE ALSO** [Borrowed Mind\
    \ (1898)](#9781454933601_epub_c029_r1.xhtml#c-029), [Asimov’s Three Laws of Robotics\
    \ (1942)](#9781454933601_epub_c037_r1.xhtml#c-037), [*Colossus: The Forbin Project\
    \ (1970)](#9781454933601_epub_c064_r1.xhtml#c-064), [Ethics of AI (1976)](#9781454933601_epub_c068_r1.xhtml#c-068),\
    \ [Autonomous Robotic Surgery (2016)](#9781454933601_epub_c096_r1.xhtml#c-096),\
    \ [Adversarial Patches (2018)](#9781454933601_epub_c098_r1.xhtml#c-098)\n\n**Artificial\
    \ neural networks** are loosely inspired by biological neural networks, such as\
    \ interconnected neurons in the brain that transmit signals to one another.\n\n\
    [![](OEBPS/images/76-1.jpg)](#9781454933601_epub_cre_r1.xhtml#76-1) \n\n# 1943\n\
    \n## ARTIFICIAL NEURAL NETWORKS\n\n![](OEBPS/images/L01.jpg)\n\nArtificial neural\
    \ networks (ANNs) are often schematically represented like layer cakes, made from\
    \ icing and stacked sheets of cake. For our purposes, the layers contain neurons\
    \ in the form of simple computational units that become “excited” and propagate\
    \ that excitement to other neurons. A `weight`, or strength, factor determines\
    \ how much excitement should get passed along. Through a training period, as various\
    \ weights and thresholds are adjusted from an initially random state, these systems\
    \ can learn to perform tasks.\n\nDiscussed by neurophysologist `Warren McCulloch`\
    \ (1898–1969) and logician `Walter Pitts` (1923–1969) in their 1943 paper “A Logical\
    \ Calculus of the Ideas Immanent in Nervous Activity.” In 1957, `Frank Rosenblatt`\
    \ (1928–1971) created the `perceptron` algorithm for pattern recognition, which\
    \ was subsequently implemented in computer hardware.\n\nIn the twenty-first century,\
    \ the utility of ANNs dramatically improved through the use of `distributed computing`\
    \ (e.g., on different networked computers) and `GPU` (graphical processing unit)\
    \ hardware.\n"
