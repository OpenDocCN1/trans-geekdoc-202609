  trans: "\n\n在故事发展过程中，电气鲍布（Electric Bob）推断，一只巨大的电子鸵鸟可以带着他和朋友穿过美国西南部的一片岩石沙漠，同时避开蛇类。鲍布仔细研究了活鸵鸟标本的解剖学和生理学，并设计出了完美的交通工具：“鸵鸟高高三十英尺，直到它巨大的头部顶部。身体中心距离地面二十英尺，脖子大约八英尺长。\
    \ . . . 动力由放在身体大腿之间的强力蓄电池提供，能够为我们提供每小时二十到四十英里的速度——这取决于我们行进的地面的性质。”\n\n这部小说以其为读者提供的详尽工程细节而闻名。例如，它详细分解了这只机械鸟的所有各种材料和组件，包括它的空心钢腿和防弹铝制翅膀及尾巴。鲍布继续说道：“这里是水箱、存放物资、弹药等的存储处，这里是我们的机枪\
    \ . . . [它]由一个放大的转轮筒组成，装有二十五枚温彻斯特步枪弹，以及一根短重枪管，通过转动这个曲柄来发射。”\n\n尽管此类虚构处理并没有真正解决围绕此类机械生命形式创造的哲学问题，但像《爱迪生传》（Edisonades）这样的作品让我们窥见了那个时代的思想，以及它所有的偏见、希望和抱负。\n\
    \n**另见** 德沃康森的鸭子机器人 (1738), *草原上的蒸汽人* (1868), 提克-洛克 (1907)\n\n**尼古拉·特斯拉 1898 年的专利**涉及他的无线遥控机器人船，该船包含了一块电池、电机驱动的螺旋桨、方向舵和灯光。他相信未来将创造出智能的“遥控自动机器”，引发社会革命。\n\
    \n![](img/#9781454933601_epub_cre_r1.xhtml#56-1) \n\n# 1898\n\n# 特斯拉的“借用大脑”\n\n\
    ![](img/L01.jpg)\n\n1898 年，塞尔维亚裔美国发明家尼古拉·特斯拉（1856–1943）对一艘无线遥控船进行了非凡的演示，他在惊若观呆的观众面前操控着这艘船，其中一些人认为这涉及到魔法、心灵感应或经过训练的猴子。当一名《纽约时报》的记者获知这艘世界第一的无线遥控船时，他建议特斯拉的发明可以作为战争武器，装载炸药。特斯拉告诉记者要跳出无线鱼雷的局限，意识到这代表了一类自动机器的开端（当时*robot*\
    \ 一词尚未被使用）——将执行人类人类劳作工作的机械人类。\n\n在 1900 年的论文《人类能量增加的问题》中，特斯拉描述了他的水下自动机器：“远端操作者的知识、经验、判断——可以说是心灵——被体现在那台机器中，这使其能够带着理性和智能移动并执行所有操作。.\
    \ . . 到此为止建造的自动机器拥有所谓的‘借用的大脑’，因为每个机器仅仅是远端操作者的一部分。”\n\n特斯拉进一步建议，“可以制造出一种自动机器，它将拥有‘自己的大脑’[并且]能够独立于任何操作者，完全由其自己，根据影响其灵敏器官的外部影响，执行许多各种动作和操作，仿佛它有意识一样。”\n\
    \n特斯拉的观点更进一步，认为“可以制造出一种自动机器，它将拥有‘自己的大脑’[并且]能够独立于任何操作者，完全由其自己根据根据影响其灵敏器官的外部影响，执行许多各种动作和操作，仿佛它有意识一样。”\n\
    \n特斯拉常被认为是现代时代的伟大预言者，类人机器人（androids）如索菲亚（Sophia）让观众感到震惊。尽管这种虚构处理并没有真正解决围绕此类机械生命形式创造的哲学问题，但像《爱迪生传》这样的作品让我们窥见了那个时代的思想，以及它所有的偏见、希望和抱负。\n\
    \n**另见** 德沃康森的鸭子机器人 (1738), *草原上的蒸汽人 (1868), 提克-洛克 (1907)\n\n**尼古拉·特斯拉 1898 年的专利**涉及他的无线遥控机器人船，该船包含了一块电池、电机驱动的螺旋桨、方向舵和灯光。他相信未来将创造出智能的“遥控自动机器”，引发社会革命。\n\
    \n![](img/#9781454933601_epub_cre_r1.xhtml#56-1) \n\n# 1898\n\n# 特斯拉的“借用大脑”\n\n\
    ![](img/L01.jpg)\n\n1898 年，塞尔维亚裔美国发明家尼古拉·特斯拉（1856–1943）对一艘无线遥控船进行了非凡的演示，他在惊若观呆的观众面前操控着这艘船，其中一些人认为这涉及到魔法、心灵感应或经过训练的猴子。当一名《纽约时报》的记者获知这艘世界第一的无线遥控船时，他建议特斯拉的发明可以作为战争的武器，装载炸药。特斯拉告诉记者要跳出无线鱼雷的局限，意识到这代表了一类自动机器的开端（当时*robot*\
    \ 一词尚未被使用）——将执行人类人类劳作工作的机械人类。\n\n在他在 1900 年的论文《人类能量增加的问题》中，特斯拉描述了他的水下自动机器：“远端操作者的知识、经验、判断——可以说是心灵——被体现在那台机器中，这使其能够带着理性和智能移动并执行所有操作。.\
    \ . . 到此为止建造的自动机器拥有所谓的‘借用的大脑’，因为每个机器仅仅是远端操作者的一部分。”\n\n特斯拉观点更进一步，认为，“可以制造出一种自动机器，它将拥有‘自己的大脑’[并且]能够独立于任何操作者，完全由其自己根据影响其灵敏器官的外部影响，执行许多各种动作和操作，仿佛它有意识一样。”\n\
    \n特斯拉常被认为是现代时代的伟大预言者，类人机器人（androids）如索菲亚（Sophia）让观众感到震惊。尽管此类虚构处理并没有真正解决围绕此类机械生命形式创造的哲学问题，但像《爱迪生传》这样的作品让我们窥见了那个时代的思想，以及它所有的偏见、希望和抱负。\n\
    \n当我们研究人工智能时，“我们立即面临关于生命、死亡、性以及心灵机制的最根本问题，”保罗·亚伯拉罕和斯特特·肯特写道，“关于机器与人类界限的早期思考机器之一是提克-洛克（Tik-Tok），出现在弗兰克·鲍姆的《奥兹国的玛玛》书中。为了让这个发条的机器人运作，必须有人定期上发它的发条，为其思想提供能量。或者可以为其语言提供能量，但不是其思想，使其产生粗糙的语音输出而非足够的能力。即使在完全激活的情况下，它的语言处理模块也不是完全自然的，这从它单调的声音以及对许多问题和命令的严格执行可以看出。根据鲍姆的说法，提克-洛克除了活着之外什么都做，而且没有情感。当被鞭打时它并没有受到伤害，因为鞭打让它的铜身保持得良好。”\n\
    \n提克-洛克意识到自己在宇宙中的位置。例如，当被感谢善良时，它回答道：“我只是一台机器。我无法感到善良或高兴。”这部小说似乎是针对青少年读者的，但鲍姆让我们思考人工智能的未来。情感是人类与机器的主要区别吗？文学和电影在多大程度上塑造了人工智能的设计以及对思考机器的限制？\n\
    \n“机械人、机器人和其他机械生物是理解一个世纪技术乐观和技术恐惧的关键人物，”亚历山·古迪教授写道，“体现了对技术侵入的恐惧，向某些人暗示了技术超越的可能性，并挑战了独立的个体主体的观点。”\n\
    \n**另见** 兰斯洛特的铜质骑士 (约 1220 年, *草原上的蒸汽人 (1868), 阿西莫夫的机器人三大 (1942), 人类的使用 (1950),\
    \ 自动驾驶车辆 (1984)\n\n弗兰克·鲍姆（1856–1919）著作《奥兹国的玛玛》的封面，由约翰·R·尼尔（1877–1943）插图。\n\n![](img/#9781454933601_epub_cre_r1.xhtml#56-1)\
    \ \n\n# 1907\n\n# 提克-洛克\n\n![](img/L01.jpg)\n\n当我们研究人工智能时，“我们立即面临关于生命、死亡、性以及心灵机制的最根本问题，”保罗·亚伯拉罕和斯特特·肯特写道，“关于机器与人类界限的早期思考机器之一是提克-洛克（Tik-Tok），出现在弗兰克·鲍姆的《奥兹国的玛玛》书中。为了让这个发条的机器人运作，必须有人定期上它的发条，为其思想提供能量。或者可以为其语言提供能量，但不是其思想，使其产生粗糙的语音输出而非足够的能力。即使在完全激活的情况下，它的语言处理模块也不是完全自然的，这从它单调的声音以及对许多问题和命令的严格执行可以看出。根据鲍姆的说法，提克-洛克除了活着之外什么都做，而且没有情感。当被鞭打时它并没有受到伤害，因为鞭打让它的铜身保持得良好。”\n\
    \n提克-洛克意识到自己在宇宙中的位置。例如，当被感谢善良时，它回答道：“我只是一台机器。我无法感到善良或高兴。”这部小说似乎是针对青少年读者的，但鲍姆让我们思考人工智能的未来。情感是人类与机器的主要区别吗？文学和电影在多大程度上塑造了人工智能的设计以及对思考机器的限制？\n\
    \n“机械人、机器人和其他机械生物是理解一个世纪技术乐观和技术恐惧的关键人物，”亚历山·古迪教授写道，“体现了对技术侵入的恐惧，向某些人暗示了技术超越的可能性，并挑战了独立的个体主体的观点。”\n\
    \n**艾兰·图灵写道**当我们有一天创造出先进的思考机器时，人类并不是在亵渎上帝创造灵魂的力量——就像我们创造后代时一样。\n\n"
- fmt: "\nIn his 1950 paper “Computing Machinery and Intelligence,” computer scientist\
    \ Alan Turing (1912–1954) wrote that when we attempt to construct AI machines,\
    \ we are not “irreverently usurping” God’s “power of creating souls, any more\
    \ than we are in the procreation of children; rather we are, in either case, instruments\
    \ of His will, providing mansions for the souls that He creates.” Some futurists\
    \ believe that, as we learn more about the structure of the brain, conscious AIs\
    \ might be created by simulating a mind or by uploading aspects of our minds to\
    \ a computer. These speculations assume a materialist view in which the mind arises\
    \ from brain activity. On the other hand, in the mid-seventeenth century French\
    \ philosopher René Descartes (1596–1650) supposed that the mind, or “soul,” exists\
    \ separately from the brain. In his view, this “soul” is connected to the brain\
    \ via an organ like the pineal body, which acts as a portal between brain and\
    \ mind.\n\nThe various views concerning the separation of soul and matter represent\
    \ a philosophy of mind-body `dualism`. In 1907, American physician Duncan MacDougall\
    \ (1866–1920) placed dying tuberculosis patients on a scale in an attempt to demonstrate\
    \ this concept. He reasoned that at the moment of death, the scale should indicate\
    \ a drop in weight as the soul disembarked. As a result of his experiments, MacDougall\
    \ measured the soul to be 21 grams (0.7 ounces). Alas, MacDougall and other researchers\
    \ were never able to duplicate this finding.\n\nA more materialist view of the\
    \ mind and body may be supported by experiments that suggest our thoughts, memory,\
    \ and personality can be altered by damage to regions of the brain, and brain-imaging\
    \ studies can map both feelings and thoughts. As just one curious example, injury\
    \ to the brain’s right frontal lobe can lead to a sudden, passionate interest\
    \ in fine restaurants and gourmet foods—a condition called `gourmand syndrome`.\
    \ Of course, the dualist Descartes might have argued that damage to the brain\
    \ alters behavior because it is through the brain that the mind operates. If we\
    \ excise the car’s steering wheel, for example, the car behaves differently, but\
    \ this does not mean that there is no separate driver.\n\n**SEE ALSO** [The Consciousness\
    \ Mill (1714)](#9781454933601_epub_c015_r1.xhtml#c-015), [Transhumanism (1957)](#9781454933601_epub_c049_r1.xhtml#c-049),\
    \ [Living in a Simulation (1967)](#9781454933601_epub_c060_r1.xhtml#c-060), [Spielberg’s\
    \ *A.I. Artificial Intelligence* (2001)](#9781454933601_epub_c086_r1.xhtml#c-086)\n\
    \n**Illustrated here is a reading machine** by Austrian engineer Gustav Tauschek\
    \ (1899–1945), from US Patent 2,026,329. The comparison device (disk 6) had cutouts\
    \ for letters. When images of a character and a letter-shaped hole coincided,\
    \ the appropriate letter was printed.\n\n[![](OEBPS/images/62-1.jpg)](#9781454933601_epub_cre_r1.xhtml#62-1)\
    \ \n\n# 1913\n\n# OPTICAL CHARACTER RECOGNITION (OCR)\n\n![](OEBPS/images/L01.jpg)\n\
    \nPresident John Adams is often credited with saying “The only thing most people\
    \ do better than anyone else is read their own handwriting.” Indeed, the quest\
    \ for automated systems that could read printed letters of the alphabet has had\
    \ a long history. `Optical character recognition`, or `OCR`, has involved several\
    \ fields of research and development: computer vision, artificial intelligence,\
    \ pattern recognition, and more. `OCR` refers to the conversion of images of text\
    \ in numerous varieties (e.g., handwritten, printed, typed) into machine-encoded\
    \ text. For example, the text on a mailing envelope, license plate, book page,\
    \ street sign, or passport might be scanned and recognized by a machine. Sometimes\
    \ `OCR` is used to convert text to speech for blind people.\n\nOne early inventor\
    \ in the area of `OCR` is Russian-born scientist Emanuel Goldberg (1881–1970).\
    \ In 1931, he patented a device that used photoelectric cells. Even earlier, around\
    \ 1913, Irish physicist Edmund Fournier (1868–1933) invented the `optophone`,\
    \ which assisted readers. In 1974, Ray Kurzweil (b. 1948) created a machine that\
    \ could produce speech. \n\nA closely related field includes `handwriting` recognition.\
    \ `OCR` often requires numerous steps, such as identifying characters. Artificial\
    \ neural networks can also be used to increase accuracy.\n\n**SEE ALSO** [Artificial\
    \ Neural Networks (1943)](#9781454933601_epub_c039_r1.xhtml#c-039), [Speech Recognition\
    \ (1952)](#9781454933601_epub_c045_r1.xhtml#c-045), [Machine Learning (1959)](#9781454933601_epub_c050_r1.xhtml#c-050)\n\
    \n**Poster for *R.U.R*** funded by the Federal Theatre Project (1935–1939) during\
    \ the Great Depression.\n\n[![](OEBPS/images/64-1.jpg)](#9781454933601_epub_cre_r1.xhtml#64-1)\
    \ \n\n# 1920\n\n# *ROSSUM’S UNIVERSAL ROBOTS*\n\n![](OEBPS/images/L01.jpg)\n\n\
    Written by the Czech playwright Karel Čapek (1890–1938), the 1920 play `R.U.R.`\
    \ introduced the word `robot` to the English language. In `R.U.R.`, the robots\
    \ are made of flesh and blood but assembled in vats. They serve humankind as factory\
    \ workers—essentially as appliances—which allows humans a tremendous amount of\
    \ leisure time. However, debates take place about their rights. Helena, one of\
    \ the main characters, desires to free the robots. Alas, the robots, which are\
    \ used worldwide, eventually destroy the human race; but because the robots do\
    \ not possess the secret formula to reproduce, they too will eventually die out.\
    \ At the end of the play, two special robots fall in love, representing a kind\
    \ of Adam and Eve for the future.\n\nThe word `robot` comes from the Czech `robota`,\
    \ which refers to forced labor. The play is a milestone in that it forced people\
    \ to consider the implications of the continued evolution of AI technology—where\
    \ do we draw the line between humans and thinking machines? When do such machines\
    \ become so advanced they deserve rights or become a threat? According to author\
    \ Rebecca Stefoff, `R.U.R.` suggests that the “indefinable spark of humanity dwells\
    \ in how beings feel and act, not in how they are created.”\n\n“Philosophically\
    \ rich and controversial, `R.U.R.` was unanimously acknowledged as a masterpiece\
    \ from its first appearance, and has become a classic of technologically dystopian\
    \ literature,” writes Luciano Floridi (b. 1964), Professor of Philosophy and Ethics\
    \ of Information at Oxford University. The ideas in the play were so powerful\
    \ that, by 1923, the play had been translated into more than thirty languages.\
    \ In 1922, the American premiere of the play took place in New York City, where\
    \ it had more than a hundred performances.\n\n**SEE ALSO** [*Metropolis* (1927)](#9781454933601_epub_c034_r1.xhtml#c-034),\
    \ [*The Human Use of Human Beings* (1950)](#9781454933601_epub_c043_r1.xhtml#c-043),\
    \ [Intelligence Explosion (1965)](#9781454933601_epub_c055_r1.xhtml#c-055), [Leakproof\
    \ “AI Box” (1993)](#9781454933601_epub_c079_r1.xhtml#c-079)\n"
