- fmt: "\n“In 1738, the 29-year-old French watchmaker Jacques de Vaucanson [1709–1782]\
    \ exhibited in the garden of the Tuileries what may be one of the most celebrated\
    \ robots of all time,” writes American neuroscientist Paul Glimcher. The de Vaucanson\
    \ duck had hundreds of moving parts and feathers. It moved its head, muddled water\
    \ with its bill, flapped its wings, quacked, gulped food from the exhibitor’s\
    \ hand, and carried out many more realistic actions. After a few minutes, remains\
    \ of digested food would be excreted below. Of course, the duck was not really\
    \ digesting food, and the tail end of the duck was secretly preloaded with simulated\
    \ excrement. Nevertheless, such a versatile automaton triggered discussions about\
    \ the line between the living and the purely mechanical, as well as the degree\
    \ to which such boundaries might be blurred as robotic entities became even more\
    \ versatile.\n\nThrough time, fascination with the famous digesting duck has grown,\
    \ and the odd creature even makes an appearance in Thomas Pynchon’s highly acclaimed\
    \ 1997 novel Mason & Dickson, where the creature becomes conscious and follows\
    \ and terrorizes a French chef with its *bec de la mort* (“beak of death”).\n\n\
    De Vaucanson also created a marvelous automaton flute player, driven by several\
    \ bellows attached to three windpipes. Gears and cams triggered levers that controlled\
    \ the flute-player’s fingers, tongue, and lips. The mechanized flautist “was the\
    \ first example of what Diderot’s *Encyclopédie* defines as an androïde, that\
    \ is, a human figure performing human functions,” writes historian Jessica Riskin.\
    \ More immediately practical, in the 1740s de Vaucanson designed machines to weave\
    \ silk—which, alas, caused (human) silk workers to rebel and pelt him with stones\
    \ in the street.\n\nAs Glimcher writes: “Vaucanson’s duck, raised for eighteenth-century\
    \ audiences ancient questions that still haunt modern neuroscience: Are the mechanical\
    \ interactions that occur inside each of us sufficient to generate the complex\
    \ patterns of behavior that we actually produce? What is it that defines us as\
    \ human beings, the complexity of the behavior that we produce or the specific\
    \ patterns of interacting matter that appear to generate our behavior?”\n\n**SEE\
    \ ALSO** [Hesdin Mechanical Park (c. 1300](#9781454933601_epub_c009_r1.xhtml#c-009),\
    \ [da Vinci’s Robot Knight (c. 1495](#9781454933601_epub_c012_r1.xhtml#c-012),\
    \ [The Consciousness Mill (1714](#9781454933601_epub_c015_r1.xhtml#c-015), [*The\
    \ Steam Man of the Prairies* (1868)](9781454933601_epub_c026_r1.xhtml#c-026),\
    \ [*Electric Bob’s Big Black Ostrich* (1893)](9781454933601_epub_c028_r1.xhtml#c-028)\n\
    \n**A peek inside the Turk,** from Joseph von Racknitz (1744–1818), hypothesizing\
    \ how the Turk operated. (From *Über den schachspieler des herrn von Kempelen\
    \ und dessen nachbildung* [*About the Chess-Player of Mr. von Kempelen and its\
    \ Replica*], Leipzig und Dresden 1789.)\n\n[![](OEBPS/images/34-1.jpg)](9781454933601_epub_cre_r1.xhtml#34-1)\
    \ \n\n# 1770: MECHANICAL TURK\n\n![](OEBPS/images/L01.jpg)\n\nThe Mechanical Turk\
    \ was a chess-playing android created in 1770 by Hungarian inventor Wolfgang von\
    \ Kempelen (1734–1804) and presented to the Habsburg empress Maria Theresa of\
    \ Austria. The machine appeared to play an excellent game of chess, as it defeated\
    \ players in Europe and the Americas, including such notables as Napoleon Bonaparte\
    \ and Benjamin Franklin. The life-sized android, adorned with a robe, turban,\
    \ and black beard, sat at a large cabinet with a chessboard at top and actually\
    \ used its hand to move chess pieces. The secret of its operation was not well\
    \ known for many years, but today we understand that the complex cabinet cleverly\
    \ concealed a human chess expert who used magnets to move the pieces and various\
    \ levers to move parts of the android. To deepen the mystery, Kempelen would actually\
    \ open the cabinet doors before play to reveal clockwork machinery inside and\
    \ apparently no visible space for a human to hide. Even if many people understood\
    \ the Turk to be a sophisticated “trick,” it nevertheless caused people to wonder\
    \ what kinds of work machines were capable of—and what human capabilities machines\
    \ might replace.\n\nMany inaccurate articles were written about how the Turk could\
    \ have operated. For example, Edgar Allan Poe suggested, incorrectly, that the\
    \ player sat inside the Turk android’s body. Interestingly, Charles Babbage, one\
    \ of the fathers of the modern computer, was likely inspired by the Turk, as Babbage\
    \ wondered about whether machines *could* “think,” or at least perform highly\
    \ sophisticated computations, when he began to work on his mechanical computing\
    \ machines.\n\nAuthor Ella Morton notes: “Though the [Turk] ultimately relied\
    \ on human behavior and a bit of old-fashioned magic, its convincingly mechanical\
    \ nature was cause for both wonder and concern. Arriving smack-bang in the middle\
    \ of the industrial revolution, the Turk raised unsettling questions about the\
    \ nature of automation and the possibility of creating machines that could think.\
    \ The fact that the Turk appeared to operate on clockwork mechanisms . . . contradicted\
    \ the idea that chess was . . . ‘the province of intellect alone’.”\n\n**SEE ALSO**\
    \ [Babbage’s Mechanical Computer (1822)](9781454933601_epub_c022_r1.xhtml#c-022),\
    \ [“Elephants Don’t Play Chess” (1990)](9781454933601_epub_c078_r1.xhtml#c-078),\
    \ [Checkers and AI (1994)](9781454933601_epub_c080_r1.xhtml#c-080), [Deep Blue\
    \ Defeats Chess Champion (1997)](9781454933601_epub_c082_r1.xhtml#c-082)\n\n**The\
    \ Jaquet-Droz writer android,** at the Musée d’Art et d’Histoire (Museum of Art\
    \ and History) in Neuchâtel, Switzerland.\n\n[![](OEBPS/images/36-1.jpg)](9781454933601_epub_cre_r1.xhtml#36-1)\
    \ \n\n# 1774: JAQUET-DROZ AUTOMATA\n\n![](OEBPS/images/L01.jpg)\n\n“They might\
    \ have been huge marionettes,” writes Jean Lorrain (1845–1906), “or tall mannequin\
    \ dolls left behind in panic—for I divined that some plague had swept through\
    \ the town and emptied it of its inhabitants. Such eerie thoughts of lifelike\
    \ automata remind us of our long fascination with robot-like beings and of a particular\
    \ set of eighteenth-century automata that might serve as early ancestors of computers,\
    \ given the complexity and programmability of these. Created by watchmaker Pierre\
    \ Jaquet-Droz (1721–1790) between 1768 and 1774, these three automata—the boy\
    \ writer android (made from approximately 6,000 parts), the female musician (2,500\
    \ parts), and the child draughtman (2,000 parts)—drew large crowds of admirers.\
    \ The boy android dipped his writing quill in ink and could be programmed with\
    \ a series of cams to write messages of up to forty characters. He periodically\
    \ re-inked the pen, and his eyes followed his words as he wrote.\n\nThe musician\
    \ automaton played an organ by actually pressing the keys with her fingers. She\
    \ seemed to come alive, making natural body and head motions and following her\
    \ fingers with her eyes. She was designed to continue “breathing” before and after\
    \ her performances, and her body heaved with seeming emotion in time with the\
    \ music. The draughtsman could sketch four different figures: a dog, a portrait\
    \ of Louis XV, cupid driving a chariot, and a royal couple.\n\nThese automata\
    \ are notable in that their mechanisms reside inside their bodies (and not, for\
    \ example, in a nearby piece of furniture), making the programmability, miniaturization,\
    \ and haunting lifelike quality all the more impressive. Jaquet-Droz was helped\
    \ by his son Henri-Louis and mechanic (and adopted son) Jean-Frédéric Leschot,\
    \ and he is said to have later constructed two artificial hands for a man with\
    \ congenital deformities. The hands were clothed in white gloves and were reportedly\
    \ versatile enough to enable the user to write and draw.\n"
