    When a human reasons, according to Hobbes, the person performs symbolic calculations
    and manipulations, something akin to addition and subtraction: “By ratiocination
    [thinking], I mean `computation`. Now, to compute is either to collect the sum
    of many things that are added together, or to know what remains when one thing
    is taken out of another.”


    Dyson asks: “If reasoning can be reduced to arithmetic, which, even in Hobbes’s
    time could be performed by mechanism, then is a mechanism capable of reasoning?
    Can machines think?” Computer architect Daniel Hillis offers his own speculation
    on the possibility of creating an artificial mind that can think for itself: “For
    those who fear mechanistic explanations of the human mind, our ignorance of how
    local interactions produce emergent behavior offers a reassuring fog in which
    to hide the soul. Although individual computers and individual computer programs
    are developing the elements of artificial intelligence, it is in the larger networks
    (or the network at large) that we are developing a more likely medium for the
    emergence of the Leviathan of artificial mind.”


    **SEE ALSO** [The Consciousness Mill (1714)](#9781454933601_epub_c015_r1.xhtml#c-015),
    [“The Artist of the Beautiful” (1844)](#9781454933601_epub_c023_r1.xhtml#c-023),
    [“Darwin among the Machines” (1863)](#9781454933601_epub_c025_r1.xhtml#c-025),
    [`Giant Brains, or Machines That Think` (1949)](#9781454933601_epub_c041_r1.xhtml#c-041),
    [`The Human Use of Human Beings` (1950)](#9781454933601_epub_c043_r1.xhtml#c-043)


