  trans: "\n\n未来的问题将是如此深奥复杂，以至于我们需要许多不同的“物种心灵”来解决，以及新的人类技能来与这些心灵进行交互。凯利（Kelly）通过将思维机器与外星人进行比较为他的文章作结：“AI\
    \ 完全可以代表外星智能（Alien Intelligence）。我们无法确定在未来 200 年内是否会接触到外星生物……但我们几乎可以百分之百确定，到那时我们将已经制造出一个外星智能。当我们面对这些合成外星人时，我们将遇到与接触外星人所预期的同样的收益和挑战。它们将迫使我们重新评估自己的角色、信仰、目标和认同。”\n\
    \n我们很难想象一只羚羊能理解质数的意义，但我们自身大脑的改变以及实用的 AI 接口的发展，可能会让我们接触到目前完全无法触的各种深刻概念。如果大脑中仅有几个神经节的百合蛾从出生起就能识别出百合花的几何形状，那么我们的能力中有多少是硬编码在大脑皮层回褶中的呢？当然，宇宙中可能存在我们永远无法理解的方面，就像羚羊永远无法理解微积分、黑洞、符号逻辑或诗歌一样。有些思想我们永远无法思考，有些幻景我们只能窥瞥。正是在人类现实与超越现实之间这层薄膜般的、蔽的界面，我们可能会发现神性，某些人可能会将其比作与人造神共舞。\n\
    \n**另需阅读** 灵魂搜索 (1907), `巨人大脑，或思考的机器* (1949), 智能爆炸 (1965), 人工生命 (1986)\n\n**“好奇号”的自画像**，位于火星夏普山山下，2015\
    \ 年 10 月 6 日。\n\n![](img/186-1.jpg)\n\n# 2015\n\n# 火星上的 AI\n\n![](img/L01.jpg)\n\
    \n人工智能和自主性将在太空探索中发挥日益重要的作用，因为机器人航天器和漫游车需要做出快速、智能的决策，特别是当它们与地球家园无法保持持续通信时。随着我们向太阳系深处延伸，甚至将漫游车送往木星的欧罗巴等遥远卫星的海，通信延迟会变得尤为棘手。\n\
    \n最近外太空的一个有限但迷人的 AI 案例涉及 NASA 的 `Curiosity`（好奇号）漫游车，它在火星上巡，帮助判断该行星是否曾维持生命，并帮助我们更好地理解火星的地质、气候和辐射模式。2015\
    \ 年，`Curiosity` 接收了一个名为“自主探索以增加科学”（`AEGIS`）的 AI 软件更新，以帮助它完成任务。\n\n“现在火星完全由机器人占据，”行星科学家雷蒙德·弗朗西斯（Raymond\
    \ Francis）说，“其中一个机器人已经足够智能，可以就它用激光照射哪些部位做出自己的决定。”如果 `Curiosity` 发现某个感兴趣的表面特征，它可以使用激光气化一小部分，并检查产生的光谱来估计岩石的成分。如果需要，它还可以使用它的长臂、显微镜和\
    \ X 射线光谱仪进行更近的检查。特别是，`AEGIS` 允许 `Curiosity` 自主选择目标岩石并用激光精确确定位——使用计算机视觉检查数字图像，寻找边缘、形状、大小、亮度等。记者玛丽娜·科伦（Marina\
    \ Koren）指出：“该软件——在驱动 `Curiosity` 运行的 380 万行代码中仅占约 20,000 行——将一辆汽车大小、六轮、核动力的机器人变成了一位现场科学家。”\n\
    \n`Curiosity` 的调查有一天可能为人类探索铺平道路，而像 `AEGIS` 这样的系统将通过机器学习和其他 AI 方法检测异常来协助这一过程。鉴于\
    \ `Curiosity` 有时处于火星背面，无法与地球通信和接收指令，而且考虑到与地球的通信会消耗漫游车的能量，当通信受限或不可能时，AI 显得尤为有用。\n\
    \n**另需阅读** 机器人 Shakey (1966), 自动驾驶车辆 (1984), Roomba 机器人 (2002)\n\n**AlphaGo 计算机程序**击败了韩国人李世石，这是程序首次在没有让子的情况下击败九段职业棋手。\n\
    \n![](img/#9781454933601_epub_cre_r1.xhtml#188-1) \n\n# 2016\n\n# ALPHAGO 冠军\n\
    \n![](img/L01.jpg)\n\n虽然象棋的规则只能由人类创造，但围棋的规则如此优雅，如果其他地方存在智能生命，它们几乎一定会玩围棋。围棋起源于公元前\
    \ 2000 年左右中国的双人游戏，并在 13 世纪传到日本。游戏中，玩家交替在 19 × 19 的棋盘上放置黑白棋。如果一颗或一组棋被严密包围，就会被捕并替换为相反色的棋，目标是控制领土。围棋复杂性有很多原因，包括巨大的棋盘、复杂的策略和大量的变。事实上，潜在棋盘位置的数量远超宇宙中的原子数量！\n\
    \n2016 年，AlphaGo 成为第一个击败最高等级职业围棋手的程序。AlphaGo 由 DeepMind Technologies 开发，这是一家在\
    \ 2014 年被谷歌收购的英国公司。从技术上讲，AlphaGo 使用蒙特卡洛树搜索算法和人工神经网络来学习和对弈。2017 年，一个更新版本 AlphaGo\
    \ Zero 通过与自我对弈数百万次学会了围棋，完全不需要人类数据，并在几天内就发明了更优的方法。\n\n提到 AlphaGo 惊人的方法，记者陈晨（Dawn\
    \ Chan）解释道，“从所有报道来看，人们感觉就像外星文明在我们中间丢下了一本神秘的指南：一本精妙的手册——至少在我们能理解的部分是这样。”\n\n**另需阅读**\
    \ 神经网络 (1943), 妙想大师 (1970), 西洋棋冠军被击败 (1979), 深蓝击败象棋冠军 (1997), 黑棋 (1997)\n\n想象一下未来的手术，自主机器人将发挥日益增长的作用，利用它们自己的视觉系统和机器智能。也许它们将成为手术室的英雄，因为它们能高效地从\
    \ CT 或共振成像扫描中提取信息。\n\n"
- fmt: "\nIn 2016, the Smart Tissue Autonomous Robot (STAR), a robotic surgical system,\
    \ demonstrated its skill on a pig’s small intestine, using its own enhanced vision,\
    \ machine intelligence, and dexterity. Compared with human surgeons, STAR’s stitches\
    \ were more consistent and created an intestine that was more resistant to leaks\
    \ near the seams. In this example of “supervised anatomy,” STAR’s vision system\
    \ relied on near-infrared fluorescent tags placed on the intestinal tissue to\
    \ help its camera track the tissue. STAR planned the suturing task and made adjustments\
    \ as tissues moved.\n\nThe growing autonomy of surgical robots has had an impressive\
    \ past, rooted in the increasing use of robots to assist surgery. One of the most\
    \ popular forms of robotic surgery resembles laparoscopic surgery, also referred\
    \ to as `keyhole surgery` or `minimally invasive surgery`, which is performed\
    \ through small incisions and has a reputation for minimizing blood loss and pain\
    \ while accelerating patient recovery time. However, instead of the surgeon hovering\
    \ above the patient and directly manipulating the tube-like devices inserted into\
    \ a patient’s body, `robotic surgery` allows the surgeon to sit comfortably at\
    \ a console and manipulate instruments attached to several robotic arms, while\
    \ viewing 3-D images transmitted from within the patient’s body. Unlike laparoscopic\
    \ surgery, robotic surgery can suppress the surgeon’s hand tremors, and large\
    \ hand movement can be scaled to provide more accuracy over tiny movements and\
    \ manipulations. In the emerging field of telesurgery, robotic instruments connected\
    \ to high-speed communication networks allow a surgeon to perform an operation\
    \ on a patient in a separate room.\n\nIn 2000, American surgeon Mani Menon (b.\
    \ 1948) was the first surgeon in the US to use a robot to remove a cancerous prostate\
    \ gland, and in the same year he established the nation’s first center for robotic\
    \ prostatectomy. Today, robot-assisted laparoscopy is used for hysterectomies,\
    \ repair of heart mitral valves, hernia repairs, gall bladder removals, and much\
    \ more. Robots are also used to perform crucial steps in procedures involving\
    \ orthopedic knee replacements, hair transplants, and Lasik eye surgery.\n\n**SEE\
    \ ALSO** [Lethal Military Robots (1942)](#9781454933601_epub_c038_r1.xhtml#c-038),\
    \ [Autonomous Vehicles (1984)](#9781454933601_epub_c072_r1.xhtml#c-072), [AI Death\
    \ Predictor (2019)](#9781454933601_epub_c100_r1.xhtml#c-100)\n\n**In 2017, AI\
    \ programs** defeated human professional poker players in Texas Hold ’Em. Here,\
    \ the players have `imperfect information`, which makes the game particularly\
    \ challenging for computers and requires a kind of “intuition” to determine winning\
    \ strategies.\n\n[![](OEBPS/images/192-1.jpg)](#9781454933601_epub_cre_r1.xhtml#192-1)\
    \ \n\n# 2017\n\n# AI POKER\n\n![](OEBPS/images/L01.jpg)\n\nIn 2017, numerous news\
    \ stories proclaimed the huge triumph of two different AI programs that defeated\
    \ human professional poker players in a game known as Texas Hold ’Em. In the past,\
    \ AIs have been able to defeat humans in many kinds of games—like chess and Go—involving\
    \ `perfect information`, where nothing is shielded from the players’ views. In\
    \ Texas Hold ’Em poker, two or more players are initially dealt two random facedown\
    \ cards. At the introduction of each new set of public cards, players are asked\
    \ to “bet, hold, or abandon” the money at stake on the table. Here, the players\
    \ have `imperfect information`, which makes the game particularly challenging\
    \ for computers and requires a kind of “intuition” to determine winning strategies.\
    \ Another challenge is that there is a massive number of possible game scenarios\
    \ (roughly `10^(160)`). In no-limit Hold ’Em, players generally develop betting\
    \ strategies that play out over numerous hands and often try bluffs (e.g., betting\
    \ low with favorable cards or betting just to confuse the competition).\n\nIn\
    \ spite of these challenges, an AI named `DeepStack` was able to defeat professional\
    \ poker players in heads-up no-limit Texas Hold ’Em. The AI had used deep learning,\
    \ with millions of randomly generated poker game plays against itself, to train\
    \ artificial neural networks in order to develop poker intuition ahead of time.\
    \ Also reported in 2017 was news of another poker AI named `Libratus` that defeated\
    \ four of the top-ranked human Texas Hold ’Em players in numerous games during\
    \ a twenty-day competition. `Libratus` did not employ neural networks, instead\
    \ using a different algorithmic approach called `counterfactual regret minimization`\
    \ (after every game simulation, the program revisits its decisions and finds ways\
    \ to improve its strategy). Interestingly, while `DeepStack` can run on a laptop\
    \ computer, `Libratus` required much more sophisticated computer hardware.\n\n\
    Note that AIs that can deal with imperfect information may be useful in numerous\
    \ real-world situations, like guessing the final sale price of a house or negotiating\
    \ a good price for a new car. Interestingly, “pokerbots” (poker-playing programs)\
    \ of various skill levels have been around for years, but they are generally not\
    \ allowed to be used as assistants to humans in online poker games among humans.\n\
    \n**SEE ALSO** [Artificial Neural Networks (1943)](#9781454933601_epub_c039_r1.xhtml#c-039),\
    \ [Deep Blue Defeats Chess Champion (1997)](#9781454933601_epub_c039_r1.xhtml#c-039),\
    \ [Deep Blue Defeats Chess Champion (1997)](#9781454933601_epub_c082_r1.xhtml#c-082),\
    \ [Quackle’s Scrabble Win (2006)](#9781454933601_epub_c090_r1.xhtml#c-090), [AlphaGo\
    \ Go Champion (2016)](#9781454933601_epub_c095_r1.xhtml#c-095)\n\n**Researchers\
    \ have shown** that it is possible to place circular psychedelic-looking patches\
    \ in the field of vision AI, to fool them “thinking” a banana is a toaster. This\
    \ highlights the possible risks of using AI for certain applications.\n\n[![](OEBPS/images/194-1.jpg)](#9781454933601_epub_cre_r1.xhtml#194-1)\
    \ \n\n# 2018\n\n# ADVERSARIAL PATCHES\n\n![](OEBPS/images/L01.jpg)\n\nImagine\
    \ a button you could pin to your shirt, or a sticker you could place on a stop\
    \ sign to trick an AI entity (e.g., a smart surveillance camera or a self-driving\
    \ car) into thinking you or the sign was anything you wished to see. Such a scenario\
    \ is not far-fetched, and it represents a risk for AIs that rely on machine learning,\
    \ as well as visual or audio systems, to make decisions.\n\nIn 2017, researchers\
    \ at Google designed circular patches with colorful psychedelic patterns to distract\
    \ AI image classifiers. Such patches can fool an AI system into thinking a banana—or\
    \ virtually any object—is a toaster, for example, when the patch is placed near\
    \ the object. Past experiments using other methods have tricked AI systems into\
    \ thinking that turtles were rifles and that rifles were helicopters. Even though\
    \ visual adversarial patches can be clearly seen by people, the use of strange\
    \ patterns (e.g., a graphic on the side of a building or the presence of a complex\
    \ 3-D sculpture) might be mistaken simply as art, so observers would not realize\
    \ that the pattern is confusing a drone into thinking a hospital is a military\
    \ target, for example.\n\nExperiments have also caused AI systems to misclassify\
    \ stop signs as speed-limit signs. Some past work has focused on changes that\
    \ are imperceptible to humans, such as changing a few pixels in an image. In 2018,\
    \ researchers at the University of California, Berkeley, constructed audio adversarial\
    \ examples for speech recognition systems. In other words, given any audio waveform,\
    \ the researchers could produce a nearly identical waveform, tricking speech-to-text\
    \ systems into transcribing the waveform as any phrase the researchers choose.\n\
    \n“Adversarial machine learning” studies involve manipulating training data while\
    \ an AI is learning. Although it may be possible to deter some adversaries by\
    \ requiring AI systems to use multiple classifier systems or to try to program\
    \ them not to be distracted by adversarial samples during training, potential\
    \ risks exist in many AI applications.\n"
