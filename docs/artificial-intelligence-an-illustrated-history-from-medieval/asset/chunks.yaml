  trans: "\n\n除了自动装置外，斯特拉斯堡大钟还拥有一个永恒历法（包括一种确定复活节日期日期的方法）、日食和月食显示器等。在 1896 年，作者芬妮·科（Fanny\
    \ Coe）写道，斯特拉斯堡大钟“几乎像一个小剧场，有许多的人和动物都有自己的小角色。. . . 小时由天使敲响，在正午和午夜，基督及其十二门徒等比例模型从一扇门走出来。.\
    \ . . 然后时钟上部塔上的金色公鸡扇动翅膀鸣叫。”\n\n学者朱利斯·弗雷泽（Julius Fraser）写道：“历法科学和钟表工艺的演变，是为了制造解释并赞美基督教宇宙的器品。.\
    \ . . [它们]是后期希望科学家和工匠的技能用于人类利益愿望的先驱。”\n\n**另见** 阿尔-杰萨利的自动装置（1206 年）, 赫斯丁机械公园（约\
    \ 1300 年）, 雅凯特-德罗兹自动装置（1774 年）\n\n**达芬芬奇机器人骑士模型，** 带有其内部的齿轮、滑轮和电缆。\n\n![](img/#9781454933601_epub_cre_r1.xhtml#22-1)\
    \ \n\n# 约 1495 年\n\n## 达芬奇的机器人骑士\n\n![](img/L01.jpg)\n\n“达芬奇的装甲机器人骑士坐了起来；张开双臂又合上，也许是一个抓取动作；通过灵活的颈部移动头部；并打开了面罩，”机器人工程师马克·罗西姆（Mark\
    \ Rosheim）写道，“也许是为了露出令人恐惧的面容。它由木、黄铜或青铜以及皮革制成，通过电缆驱动。”\n\n列奥纳尔多·达·芬奇（1452–1519）是意大利文艺复兴时期的全才学者，他的兴趣涵盖从绘画、建筑到解剖学和工程。他的日记包含了对乐器、曲柄机构以及上述机械骑士的描述和研究，这些作品大约在\
    \ 1495 年左右画在他的《西洋手稿》（`Codex Atlanticus`）中，这是一套十二卷装订的图文字集。达芬奇机器人设计的机制——具有关节和可移动的手臂、下巴和头部——使用滑轮系统来移动机器人的部件。这个机器人穿着德意风格中世纪盔甲，可以坐起和坐下，并有一个独立的齿轮系统控制上下身。列奥纳尔多还素绘了其他自动装置的模型，包括鸟和推车。\n\
    \n尽管我们不知道达芬奇的机械骑士是否曾制造过，但类似的机器人可能启发了其他工程师，例如意大利裔西班牙工程师胡内洛·图里亚诺（Juanelo Turriano，约\
    \ 1500–1885），他为西班牙国王菲利普二世制造了一个使用电缆和滑轮的机械修士。菲利普二世将其儿子从严重头部伤中奇迹般的康复归功于一位名叫迪达库斯（Didacus）的方济会传教士的神干预。受发条簧驱动，机械迪达库斯在行走时移动嘴巴和手臂进行静静祈祷。今天，他陈列在华盛顿特区的史密文森博物馆，且仍在运行。\n\
    \n反思达芬奇的机器人骑士，作者辛娅·菲利普斯（Cynthia Phillips）和莎娜·普里维（Shana Priwer）写道：“列奥纳多的机器人设计是他对解剖学和几何学研究的结晶。还有更好的方法能结合机械科学和人类形态呢？他采用了罗马建筑中固有的比例和关系，并将其应用于所有生物体固有的运动和生命力。在某种意义上，那是被赋予生命的*维特鲁人*。”\n\
    \n**另见** 塔洛斯（希腊神话）, 兰塞洛铜质骑士（约 1220 年）, 提克（1907 年）, 电子人（1939 年）\n\n**哥姆。** 在这件由尤金·伊万诺夫创作的品中，我们看到了哥姆（巨大的形象）。\n\
    \n![](img/#9781454933601_epub_cre_r1.xhtml#24-1) \n\n# 1580 年\n\n## 哥姆\n\n![](img/L01.jpg)\n\
    \n根据《前瞻报》，“在斯蒂芬警告我们*人工智能*的危险之前，哥姆传说就已经传达了同样的信息。”一个粘土制成的哥姆据说是 1580 年由罗夫·贝泽尔（Loew\
    \ ben Bezalel，1520–1609）为了防御反犹太人的攻击而制造的。通常刻有咒语。例如，根据传说，哥姆制造者会在额头上写上上帝的名字。通过删除第一个字母形成`met`（死亡），哥姆就会失效。\n\
    \n一些制造哥姆的古代配方要求结合希伯来四音字母（即上帝的名字），然后读出每个字母。`golem`一词在圣经中仅出现一次（诗篇 139），国际译本译为：“我的日子都写在你书中”。在希伯来语中，`golem`可以指“无形的物质”或“没有大脑的实体”。因此，文学中的大多数哥姆被描绘成沉默的，但它们可以执行任务。事实上，哥姆创造者的挑战在于如何让哥姆停止行动。\n\
    \n**另见** 塔洛斯（希腊神话）, 兰塞洛铜质骑士（约 1220 年）, *弗兰肯斯坦》（1818 年）\n\n**《利维坦》的扉画。** 托马斯·霍布斯的作品，由法国艺术家亚伯拉罕·波斯（Abraham\
    \ Bosse，1604–1676）刻画。\n\n![](img/#9781454933601_epub_cre_r1.xhtml#26-1) \n\n#\
    \ 1651 年\n\n## 霍布斯的《利维坦》\n\n![](img/L01.jpg)\n\n1651 年，英国哲学家托马斯·霍布斯（Thomas Hobbes，1588–1679）写了《利维坦》，这是一本关注社会结构及其与政府关系的著作。在书中，霍布斯的几段陈述导致科学历史学家乔治·戴森（George\
    \ Dyson）将霍布斯称为“人工智能之父”。例如，在引言中，霍布斯将身体比作机械装置：“自然（上帝创造并治理世界的艺术）被人类的*艺术*……模仿，使得[人类]能够制造出人工动物。既然生命只是肢体的运动，其起点在于内部的某个主要部分；我们为什么不能说，所有的自动装置（通过弹簧和齿轮自我运动的机器）都有人工生命呢？因为心脏不是一个*弹簧*吗？神经不是许多*弦*吗？关节不是许多*齿轮*吗？驱动整个身体运动…….\
    \ . ?”\n\n"
