  trans: "\n\n**作者艾赛克·阿西姆，**以其“机器人三法则”而闻名，图中展示的是 1977 年出现在他的科幻杂志封面上的他，在该杂志中他通过故事《思考！》进一步发展了人工智能的概念。\n\
    \n![](img/#9781454933601_epub_cre_r1.xhtml#72-1) \n\n# 1942\n\n## 阿西姆的机器人三法则\n\
    \n![](img/L01.jpg)\n\n随着人工智能和机器人技术在未来几十年内的发展，应该制定什么样的约束条件或成法法律，以确保此类实体不会采取伤害人类的行为？1942\
    \ 年，作家兼教育家艾赛克·阿西姆（1920–1992）在他名为《环绕》（Runaround）的短篇小说中介绍了著名的“机器人三法则”，该故事描述了一个智能机器人与人类之间的互动。三法则分别是：（1）机器人不得伤害人类，或因不作为导致人类受到伤害；（2）机器人必须服从人类下达命令，除非这些命令与第一法则冲突；（3）机器人必须保护自身的生存，只要这种保护不与第一或第二法则冲突。阿西姆随后写了许多故事，说明了这些简单的法律如何会产生意想不到的后果。\n\
    \n后来，他增加了一条法则：“机器人不得伤害人类，或因不作为导致人类受到伤害。”这些法则产生了深远影响，不仅影响了科幻小说作家，也影响了人工智能专家。人工智能研究者马尔文·明斯基（1927–2016）指出，在遇到阿西姆的法则后，他“从未停止思考大脑是如何运作的。我们终有一天会造出会思考的机器人。但它们将如何思考？在思考什么？逻辑在某些目的上可能有效，但在另一些上上不是。又如何构建出具有常识、直觉、意识和情感的机器人呢？同样如此，大脑是如何做到这些事情的？”\n\
    \n这些法则因其所提出的无数问题而备受关注且有用。我们还可以向阿西姆的法则集添加哪些法律？机器人是否应该永远不要假装成人类？机器人是否应该“知道”自己是机器人？它们是否应该始终能够解释自己为什么那样行动？如果一个恐怖分子使用多个机器人来伤害人类，而每个机器人并不知道整个计划，从而没有违反第一法则怎么办？我们可能还会考虑这些法则如何对机器人军队军医产生影响——当他们在无法照顾多名受伤士兵时必须进行分诊；或者对自动驾驶车辆——它们必须决定是撞向玩耍的孩子，还是冲下悬崖杀死乘客。最后，考虑到机器人的互动可能对未来多年产生深远影响，机器人真的能决定什么是“伤害人类”吗？\n\
    \n**另参阅** 致命性军事机器人（1942）, 人工智能伦理（1976）, *银翼杀手》（1982）, 自动驾驶车辆（1984）\n\n**艺术家对致命性自主无人机的构想，**在经过视觉识别和\
    \ AI 确认后攻击敌方坦克。\n\n![](img/#9781454933601_epub_cre_r1.xhtml#74-1) \n\n# 1942\n\
    \n## 致命性军事机器人\n\n![](img/L01.jpg)\n\n20 世纪 00 年代用于战争的机器人有很多例子，例如从 1942 年第二次世界大战期间开始，德国人在德意志军战斗的所有战线上使用的类似坦克的`歌利亚`（`Goliath`）。这些无驾驶的`歌利亚号`通过连接电缆进行远程控制，并携带高爆炸性炸药，以便机器能与其预定目标一起爆炸。\n\
    \n今天，无人机（无人驾驶飞行器）可以装备导弹作为有效的武器系统，但它们通常在被“允许”摧毁目标之前需要人类的远程输入和授权。一个具有历史意义的是，一架`MQ-1\
    \ 掠食者`无人机于 2001 年在阿富汗发动了世界上首次由无人机发起的致命空袭。关于未来可能使用致命*自主*武器的讨论仍在，这些武器可以在没有人类干预的情况下实际上选择并攻击军事目标。今天确实存在自动防御系统，包括可以自主识别并攻击来袭导弹的机器。\n\
    \n军事机器人的优点有很多：它们从不疲劳或表现恐惧；它们可以快速执行会伤害人类飞行员的机动动作；它们可能挽救生命并减少伤亡。机器可以被指示遵循各种规则，例如在不确定目标是否为平民时使用武力，或者与目标大小成正比。脸识别软件可以提高准确性，机器人可以与士兵并肩工作。就此而言，应该给这些机器多大的独立性？2015\
    \ 年，大量人工智能专家签署了一封信，警告此类用途的危险性，这可能导致全球军备竞赛。\n\n**另参阅** 借用的大脑（1898）, 阿西姆的机器人三法则（1942）,\
    \ 巨神：福宾计划（1970）, 人工智能伦理（1976）, 自主机器人手术（2016）, 对抗性补丁（2018）\n\n**神经网络**受到生物神经元的松散启发，例如大脑中相互传输信号的神经元。\n\
    \n![](img/#9781454933601_epub_cre_r1.xhtml#76-1) \n\n# 1943\n\n## 人工神经网络\n\n![](img/L01.jpg)\n\
    \n人工神经网络（ANNs）通常在示意图中被描成层蛋糕，由层叠的蛋糕片组成。对于我们而言，层包含以简单计算单元形式存在的神经元，这些单元会被“兴奋”并将这种兴奋传递给其他神经元。权重或强度因素决定了应该传递多少兴奋。在训练期间，随着各种权重阈值从初始随机状态进行调整，这些系统可以学习执行任务。\n\
    \n神经生理学家沃伦·麦库洛（`Warren McCulloch`，1898–1969）和逻辑学家沃尔特·皮茨斯（`Walter Pitts`，1923–1969）在\
    \ 1943 年的论文《神经活动中内在思想的逻辑演算》中讨论了这些内容。\n\n"
