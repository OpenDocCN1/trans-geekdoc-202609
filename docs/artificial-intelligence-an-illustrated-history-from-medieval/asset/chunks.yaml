    Because several of the old and rare illustrations shown in this book were difficult
    to acquire in a clean and legible form, I have sometimes taken the liberty to
    apply image-processing techniques to remove dirt and scratches, enhance faded
    portions, and occasionally add a slight coloration to a black-and-white figure
    in order to highlight details or to make an image more compelling. I hope historical
    purists will forgive these slight artistic touches and understand that my goal
    was to create an attractive book that is aesthetically interesting for a wide
    audience. My fascination for the incredible depth and diversity of topics revolving
    around AI should be evident through the photographs and drawings.'
