    \ \n\n# 1964\n\n# ELIZA PSYCHOTHERAPIST\n\n![](OEBPS/images/L01.jpg)\n\n`ELIZA`\
    \ is a computer program that responds to natural-language input (e.g., typed text),\
    \ simulating a conversation between the user and a psychotherapist. Developed\
    \ in 1964 by computer scientist Joseph Weizenbaum (1923–2008), the program became\
    \ famous as one of the first and most convincing “chatterbots” (i.e., conversational\
    \ simulators). In fact, Weizenbaum was shocked and distressed at the degree to\
    \ which some people revealed deep emotions and personal information during their\
    \ dialogues with `ELIZA`, as if they considered `ELIZA` to be a real human being\
    \ with the capacity for empathy.\n\n`ELIZA` was named after Eliza Doolittle from\
    \ the Irish playwright George Bernard Shaw’s 1912 comedy *Pygmalion*. In the play,\
    \ Professor Henry Higgins teaches Eliza, an uneducated woman, how to speak properly\
    \ and, thus, convincingly mimic an upper-class lady. Similarly, Weizenbaum’s `ELIZA`\
    \ was programmed to respond to certain keywords and phrases, providing the illusion\
    \ of real human empathy. Some researchers believed that the program could actually\
    \ help individuals suffering from certain psychological conditions.\n\nAs Weizenbaum\
    \ watched people interacting with `ELIZA`, he grew alarmed at their growing dependence\
    \ on computers and at how people could be deceived. In his landmark 1966 technical\
    \ paper on `ELIZA`, he wrote: “[In] artificial intelligence . . . machines are\
    \ made to behave in wondrous ways...”\n\n```\nartificial intelligence . . . machines\
    \ are made to behave in wondrous ways, often sufficient to dazzle even the most\
    \ experienced observer. But once a particular program is unmasked, once its inner\
    \ workings are explained . . . its magic crumbles away; it stands revealed as\
    \ a mere collection of procedures. . . . The observer says to himself ‘I could\
    \ have written that.’ With that thought, he moves the program in question from\
    \ the shelf marked ‘intelligent,’ to that reserved for curios. . . . The object\
    \ of this paper is to cause just such a re-evaluation of the program about to\
    \ be ‘explained.’ Few programs ever needed it more.\n```\n\nToday, face recognition\
    \ systems are used in various forms.\n\n**SEE ALSO** [Turing Test (1950)](#9781454933601_epub_c042_r1.xhtml#c-042),\
    \ [Natural Language Processing (1954)](#9781454933601_epub_c046_r1.xhtml#c-046),\
    \ [Paranoid (1972)](#9781454933601_epub_c066_r1.xhtml#c-066), [Ethics of AI (1976)](#9781454933601_epub_c068_r1.xhtml#c-068)\n\
    \n`US patent 9,703,939`](9781454933601_epub_cre_r1.xhtml#106)\n\n[![](OEBPS/images/106-1.jpg)](#9781454933601_epub_cre_r1.xhtml#106-1)\
    \ \n\n# 1964\n\n# FACE REGNITION\n\n![](OEBPS/images/L01.jpg)\n\nFace recognition\
    \ systems attempt to identify people from images or video. Some modern systems\
    \ use 3-D to capture features. As just one example configuration, perhaps such\
    \ AGIs could use neural nets and evolutionary algorithms to build hundreds of\
    \ separate modules that intercommunicate and collaborate with increasing sophistication,\
    \ speed, and efficiency.\n"
  raw: "**SEE ALSO** [“Darwin among the Machines” (1863)](#9781454933601_epub_c025_r1.xhtml#c-025),\
    \ [Natural Language Processing (1954)](#9781454933601_epub_c046_r1.xhtml#c-046),\
    \ [Transhumanism (1957)](#9781454933601_epub_c049_r1.xhtml#c-049)\n\n[**Portrait\
    \ of Eliza Doolittle,**](#9781454933601_epub_cre_r1.xhtml#105-1a) a seller of\
    \ flowers from George Bernard Shaw’s play *Pygmalion*, by artist William Bruce\
    \ Ellis Ranken (1881–1941). ELIZA was named after Miss Doolittle, since Doolittle\
    \ could convincingly simulate a sophisticated and educated person, partly by having\
    \ improved her language skills.\n\n[![](OEBPS/images/104-1.jpg)](#9781454933601_epub_cre_r1.xhtml#104-1)\
    \ \n\n# 1964\n\n# ELIZA PSYCHOTHERAPIST\n\n![](OEBPS/images/L01.jpg)\n\nELIZA\
    \ is a computer program that responds to natural-language input (e.g., typed text),\
    \ simulating a conversation between the user and a psychotherapist. Developed\
    \ in 1964 by computer scientist Joseph Weizenbaum (1923–2008), the program became\
    \ famous as one of the first and most convincing “chatterbots” (i.e., conversational\
    \ simulators). In fact, Weizenbaum was shocked and distressed at the degree to\
    \ which some people revealed deep emotions and personal information during their\
    \ dialogues with ELIZA, as if they considered ELIZA to be a real human being with\
    \ the capacity for empathy.\n\nELIZA was named after Eliza Doolittle from the\
    \ Irish playwright George Bernard Shaw’s 1912 comedy *Pygmalion*. In the play,\
    \ Professor Henry Higgins teaches Eliza, an uneducated woman, how to speak properly\
    \ and, thus, convincingly mimic an upper-class lady. Similarly, Weizenbaum’s ELIZA\
    \ was programmed to respond to certain keywords and phrases, providing the illusion\
    \ of real human empathy. Some researchers believed that the program could actually\
    \ help individuals suffering from certain psychological conditions.\n\nAs Weizenbaum\
    \ watched people interacting with ELIZA, he grew alarmed at their growing dependence\
    \ on computers and at how people could be deceived. In his landmark 1966 technical\
    \ paper on ELIZA, he wrote: “\\[In\\] artificial intelligence . . . machines are\
    \ made to behave in wondrous ways, often sufficient to dazzle even the most experienced\
    \ observer. But once a particular program is unmasked, once its inner workings\
    \ are explained . . . its magic crumbles away; it stands revealed as a mere collection\
    \ of procedures. . . . The observer says to himself ‘I could have written that.’\
    \ With that thought, he moves the program in question from the shelf marked ‘intelligent,’\
    \ to that reserved for curios. . . . The object of this paper is to cause just\
    \ such a re-evaluation of the program about to be ‘explained.’ Few programs ever\
    \ needed it more.”\n\nToday, chatbots are often used in dialog systems for customer\
    \ service and for various forms of online virtual assistance and mental-health\
    \ therapy. They are also used in some toys, or to assist consumers shopping online,\
    \ or as advertising agents.\n\n**SEE ALSO** [Turing Test (1950)](#9781454933601_epub_c042_r1.xhtml#c-042),\
    \ [Natural Language Processing (1954)](#9781454933601_epub_c046_r1.xhtml#c-046),\
    \ [Paranoid PARRY (1972)](#9781454933601_epub_c066_r1.xhtml#c-066), [Ethics of\
    \ AI (1976)](#9781454933601_epub_c068_r1.xhtml#c-068)\n\n**Figure from US patent\
    \ 9,703,939** for a method of securely unlocking (accessing) a mobile phone using\
    \ the phone’s camera and face recognition.\n\n[![](OEBPS/images/106-1.jpg)](#9781454933601_epub_cre_r1.xhtml#106-1)\
    \ \n\n# 1964\n\n# FACE RECOGNITION\n\n![](OEBPS/images/L01.jpg)\n\nFace recognition\
    \ systems attempt to identify people from images or video footage, often by comparing\
    \ facial features (e.g., relative position of the eyes and nose) with those in\
    \ an image database. Some modern systems use 3-D sensors to capture information\
    \ and to increase accuracy when confronted with variations in lighting and viewing\
    \ angles, and certain smartphones use infrared light to illuminate a user’s face\
    \ during the authentication process. Many challenges exist for accurate face recognition,\
    \ such as when people are wearing accessories like hats and sunglasses, or even\
    \ makeup, but today, in some circumstances, algorithms outperform humans in recognizing\
    \ faces. The origin of face recognition “technology” could be traced to nineteenth-century\
    \ England, where a regular system of prison photography was introduced in 1852,\
    \ as a more humane method than branding, to keep track of prisoners and to share\
    \ with other police departments when they escaped. One of the pioneers of more\
    \ advanced face recognition was mathematician and computer scientist Woody Bledsoe\
    \ (1921–1995), who worked on earlier forms of face recognition in 1964. At the\
    \ time, he noted that the task was particularly difficult due to head rotation\
    \ and tilt, lighting, facial expression, age, etc. Bledsoe and other early pioneers\
    \ tended to rely on significant human collaboration with the computer, as humans\
    \ manually extracted image facial coordinates from photos by hand using a graphics\
    \ tablet (e.g., drawing pad).\n\nOver the years, face recognition systems have\
    \ employed a variety of techniques, including eigenfaces, hidden Markov models,\
    \ and dynamic link matching. As outlined by technologist Jesse Davis West, face\
    \ recognition has several important applications today: “Law enforcement agencies\
    \ are using face recognition to keep communities safer. Retailers are preventing\
    \ crime and violence. Airports are improving travelers’ convenience and security.\
    \ And mobile phone companies are using face recognition to provide consumers with\
    \ new layers of biometric security.” Nevertheless, one may wonder if this could\
    \ mark a worrisome turning point in civilization, when people are no longer able\
    \ to go out in public and remain anonymous.\n\n**SEE ALSO** [Optical Character\
    \ Recognition (OCR) (1913)](#9781454933601_epub_c032_r1.xhtml#c-032), [Speech\
    \ Recognition (1952)](#9781454933601_epub_c045_r1.xhtml#c-045), [AIBO Robot (1999)](#9781454933601_epub_c084_r1.xhtml#c-084)\n\
    \n**In 1965, Irving J. Good expressed concerns** regarding a potential superhuman\
    \ “intelligence explosion” in which AIs designed increasingly better versions\
    \ of themselves.\n\n[![](OEBPS/images/108-1.jpg)](#9781454933601_epub_cre_r1.xhtml#108-1)\
    \ \n\n# 1965\n\n# INTELLIGENCE EXPLOSION\n\n![](OEBPS/images/L01.jpg)\n\nIn 1965,\
    \ British mathematician Irving J. Good (1916–2009)—who worked as a cryptologist\
    \ with fellow computer scientist Alan Turing—expressed concerns regarding a potential\
    \ superhuman “intelligence explosion” in a paper titled “Speculations Concerning\
    \ the First Ultraintelligent Machine.” In the paper, Good writes: “Let an ultraintelligent\
    \ machine be defined as a machine that can far surpass all the intellectual activities\
    \ of any man however clever. Since the design of machines is one of these intellectual\
    \ activities, an ultraintelligent machine could design even better machines; there\
    \ would then unquestionably be an intelligence explosion, and the intelligence\
    \ of man would be left far behind. Thus, the first ultraintelligent machine is\
    \ the last invention that man need ever make, provided that the machine is docile\
    \ enough to tell us how to keep it under control.”\n\nIn other words, if humans\
    \ built an AGI (i.e., artificial general intelligence that is not limited to a\
    \ restricted field of knowledge and capability), it might be self-improving with\
    \ engineering capabilities that allowed it to recursively redesign its hardware\
    \ and software. As just one example configuration, perhaps such AGIs could use\
    \ neural nets and evolutionary algorithms to build hundreds of separate modules\
    \ that intercommunicate and collaborate with increasing sophistication, speed,\
    \ and efficiency. Attempts to confine or isolate the potentially dangerous AI\
    \ from the rest of the Internet might fail. Even if programmed with a beneficent\
    \ goal and task, such as manufacturing better lightbulbs, what if it decided to\
    \ convert the entire North American continent into a lightbulb manufacturing facility?"
