  ## 摘要


  由于具有经济性、可靠性、扩展性和保障的服务质量等优势，云计算已被许多组织和个人采用。读者将学习关于软件即服务 (`SaaS`)、平台即服务 (`PaaS`)、基础设施即服务
  (`IaaS`)、服务器和桌面虚拟化等具体知识。


  本书不仅涵盖了云计算安全与风险管理中的信息保护，还涵盖了现有应用程序迁移到云端所需的计划、管理和深度实施细节。读者将更深入地理解云工程以及在快速获得其益处的同时降低
  IT 实现风险所需的行动。本书的内容非常适合想要迁移到云端的用户、寻求云基础概述的 IT 专业人员，以及将为测试目的构建云解决方案的计算机科学专业的学生。


