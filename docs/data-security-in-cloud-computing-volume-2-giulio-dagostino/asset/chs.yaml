  ## 10.1 改进


  这种云只有极少数缺点。其中最大的之一是，您失去了对运行业务的物理硬件的控制。如果您使用来自 `Google` 的 `Gmail`，那么您已经将您的电子邮件外包给了云端，实际上您并不知道所有信息保存在哪里了。此外，有了所有免费供应商，供应商正在变成某种东西，对吧？供应商可以读取并解码您所有的电子邮件和图像，以便更好地向您推销。人们付钱给
  `Google` 广告，这些广告将精准针对您想要的内容和位置。这种云的另一个危险是万服务供应商破产。这会让您和您的信息处于什么境地？确保所有的云信息都备份到另一个供应商的支持端或您的本地备份驱动器上。有一些出色的解决方案，可以让您在几种场景下实现这一点。云在运行机制方面非常活跃。公司不仅将拥有更小的
  IT 部门，还将拥有更真实的现场硬件。除了控制系统和连接到云端外，不需要机房。“对于所有中小型企业而言，外包 IT 应用程序和服务不仅赋予了降低总成本的能力，还可以降低多项处理密集型活动的的准入门槛，因为消除了对前期资金投入和维护专用基础设施的需求”（国际电信联盟
  2009）。云允许将区域服务器和工作站外包给更高效的数字计算机。


  云托管在最高安全的信息中心，并结合 `256-bit` 加密计算，是存储信息受保护的替代方案之一。`中国`或`印度`等国家与美国不同没有庞大的 IT 基础设施。云可以为国际用户开启新市场和替代方案，使其对全球范围内具有价值和创新性。云计算可以降低
  IT 成本，并让快速扩张或收缩不再那么痛苦。此外，它将以以前所未见或无法想象的方式将人们连接在一起。


  ## 10.2 多级身份验证


  管理员可以使用许多多级身份验证来防止对敏感云信息的未经授权访问。目前，进入任何云服务器的身份验证标准范围很大。有些方案包含与您的密码一起出现的图像，作为另一种确认。您需要注意与您的账户相关的文本和图片。解决此问题的办法是采用利用三或更多层复杂密码的多级身份验证。第二级认证是组级级密码。


  对于某些程序，有一个进入系统的通用密码；然而，要进行调整或覆盖当前信息，则需要另一个密码。这种管理级认证在零售业中很常见。店员可以创建新交易，但在没有主管级密码的情况下，无法清除产品或提供退款。


  ## 10.3 加密


  当用户使用一台机器访问云端时，端到端加密的密钥可以使用设备上的应用程序进行存储。由于用户能够在智能手机和平板电脑等多个设备上访问云端，在设备之间安全地讨论这些密钥可能很困难。端到端建议使用
  `AES-256`。密钥必须由最终用户控制和保存。域管理器 (`DM`) 负责在未注册用户进入计算机系统之前阻止其访问。客户端将加密数据并发送到域名，消除用户从云端到域名的直接连接。这可能被称为边界安全，有很多卖家可以帮助保护您的
  IT 资产。`Check Point Software Technologies Ltd.` 是一家大厂商，通过防火墙和危害预防程序解决系统安全方面的挑战。


  ## 10.4 密码管理


  用户有多种方式在云端利用密码管理来造福。这些程序还提供加密大约 256 位的强效加密算法。云的一大优势在于可以在任何地方找回密码。


  然而，密码管理应用也有缺点。解决此问题的办法是在云中使用相同的加密标准来支持密码管理器。另一种选择是使用动态令牌，它们包含用户的半部分密码，其余部分是令牌上生成的随机数。令牌的大小通常和
  `USB` 驱动器一样大。除了这种物理令牌，它们还拥有可以在智能手机上运行的软件令牌。其好处是您不再需要携带额外的设备了。


