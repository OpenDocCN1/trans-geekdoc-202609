  200 个用户。


  每当你的社区规模超过 200 人时，为系统增加一个不同的前端主机是有意义的，而不是在单台服务器上增加更多内存或处理能力。采用三层架构还为开发人员提供了将功能访问权限隔离开的能力。你可能有六名程序员负责某项工作。让他们指定并创建原则以及接口的操作方式，可以为他们提供物理隔离，以处理他们各自部分的任务。三层结构的一个优势是它将数据库与用户隔离。当你的首要目标是维护数据库安全时，这一点尤为真实。


