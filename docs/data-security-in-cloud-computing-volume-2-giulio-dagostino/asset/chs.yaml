  # 第 11 章


  ![](img/line.jpg)


  ## 云安全风险管理


  云安全风险管理是一个经常被讨论和分析的话题，在过去的几十年里，它引起了许多专业人士和学者的兴趣。它将不同的卓越元素汇聚在一起：云系统的技术和财务相关性，其扩散性是过去十年最显著的现象之一；对信息安全日益增长的关注包括隐私；应用于信息技术的风险管理与分析的相关性不断增强；以及作为程序的系统，除技术层面外还涵盖合规、治理和公司。然而，作为一个研究领域以及一套方法论、分析和技术，云安全风险管理距离成为一个成熟的课题仍然遥。


  相反，它充满了源自安全风险分析早期阶段的不确定性（这些分析主要应用于云系统），而且在处理云端危险方面的专业知识相对匮乏。由于这些原因，对于哪些风险应该被认为是云特有的且新的，哪些现有的风险缓解解决方案和标准可以应用于云环境等，目前仍存在持续争议。在本章中，我们概述了云安全风险管理的基本方面，从危险的定义开始，转向对云特定危险的调查。在风险管理方面，我们强调了云计算的合同性质，因此特别关注服务水平协议（`SLAs`），这个问题在过去的几十年里已成为许多相关分析和提案的主题。


  ### 11.1 云中的风险


  在云风险管理的过程中，个人很容易通过询问什么是威胁来辩护，这标志着向风险分析历史的过度分心/偏离。每个人似乎都理解什么是风险；我们必须不断识别危险并管理它们，以便在失败时承担后果。当我们开车、吃药、决定假期、为职业做出选择、选择财务投资，以及与我们心爱的人谈恋爱或结婚时，我们都意识到了危险并管理了它们。这是一个生活事实——我们都知道什么是风险，并将其作为传统教育的一部分教给孩子。


  也许，我们甚至可以说，如果没有危险，生活将变得极其无聊且毫无意义。为什么你现在要强调风险是什么，而不是立即关注近期对这种云和风险的改进？你为什么不跳过这些基础知识，去谈论拥有无边界网络关联绝佳机会和依然神秘的危险的云呢？


  为什么要重启几十年前关于风险分析或游戏概念的讨论，而不是展示花哨的加密技术和国际法，并描绘即将发生的黑客攻击和灾难性停电的蓝图？


  我们之所以这样做，是因为认为风险概念是不含糊的可能是一个风险太大的假设。这可能是一个更严重的错误：事实是，风险的思想并不是明确给出的，可能没有广泛共享，而且最重要的是，它极其取决于上下文。简而言之，每当我们试图解释什么是风险时，总是挣扎于寻找一个模糊的通用描述，并转而从经验中引用轶事和插图。文献也是如此。风险有多种定义方式，且往往相互不可调和的——我们可能在国际标准中发现不同的风险定义——而且为了获得一个合适的操作定义作为方便的公式，往往会过度简化，而且风险的本质特征被忽视了。没有疑问就没有风险，而且在处理风险时，不确定性是不可还原的。这并不是说疑问和随后的风险不能被缓解或管理；显然可以，但无论使用什么种技术、管理方法或控制手段，都无法从危险场景中消除它。


  在风险分析领域，许多作者区分了不确定性与风险（例如，奈特式的怀疑）（Knight 1921, 2012）。一方面，这种区分并没有被统一或被大多数学者采纳。另一方面，它对本章并没有特别相关，更糟糕的是，将这两个概念构架为相互独立而非严格相关可能会导致歧义。因此，让我们相信风险与不确定性本质上是紧密相连的：处理风险意味着处理不确定性，可能是许多种怀疑，而不仅仅是与不同结果相关的概率（或机会）的不确定性。


  我们可能会怀疑决策者的动机或他们的认知偏差。我们可能还需要思考决策者是谁，更广泛地说，谁是那些能够影响决策的人。这在某些情况下特别常见，例如在变更管理中：谁是能够部分决定公司技术转型结果的人？


  此外，由于董事会与员工之间或总部与一个或多个分支机构之间目标不一致而导致的失败危险是什么？此外，我们对许多技术的效用也存在不确定性；当效用可以增量量化时，这一点尤为隐蔽。


  ### 11.2 间测量与指标


  间接测量和清晰指标的缺失是与本主题密切相关的问题。根据对 IT 专业人士和首席信息官（CIO）的访谈和调查报告，数据安全风险被认为是云计算中最关键的问题之一。





  安全对于网络系统以及基于互联网的解决方案来说一直是首要关注的问题，这自然并不令人意外。然而，考虑到云计算的风险，这告诉我们，如果获取安全的直接衡量标准存在困难，那么我们很难找到证明有效的策略来量化估计这些风险。事实上，数据安全领域采用的大多数风险分析和管理方法本质上都是定性的，这使得它们处理起来容易得多，但有时也显得过于简单。同样，疑问接踵而生：用于采取安全措施的方法是不确定的，或者其效能不确定。它们越是旨在产生精确的危害估计（例如结构化排名中的值或矩阵值），风险评估被严重误算的危险就越高（此外，在风险分析中，还存在一种递归影响需要考量）。从长远来看，这是一个处理运营风险（即应用所选缓解替代方案后的剩余风险）的问题。


  在控制情况下，无论是通过立法还是合同义务，有时会简单地假设法律或合同义务的存在就足以消除不确定性：“至少，有一份条款和义务完备的合同”，这是某些人为了防止复杂化而得出的最终结论。遗憾的是，在现实世界中，当发生法律纠纷时，没有什么是那么简单的。它取决于措辞和细微细节；它很大程度上取决于安排中没有写的内容，而不是已经写的内容。关于合同条款的法律纠纷结果可能非常不确定，这是律师的职责，而不是技术人员的职责。这里再次出现了不确定性，导致在根据商业合同提供特定电子服务的场景中，纠纷的解决成为一个更具价值的关注点，而不是一个专门的问题。


  一个根本性问题由 SLA（服务水平协议）代表，它是管理双方之间云计算关系的手段。然而，对于像立法和工业合同一样，仅说将规定某些 SLA 并不能解决风险和不确定性，因为这取决于这些
  SLA 定义了什么或留下了什么。此外还有工业性的不确定性和风险来源。其中许多风险是广为人熟的，因为它们与传统企业系统是相同的，因此并非云计算特有。互联网应用程序和
  Web 技术就是显著的例子。此外还有云计算特有的不确定性和危害来源，但正如我们接下来讨论的，专家和学者仍在为识别这些特定的云计算危险而斗争。目前还没有广泛的共识；你会发现有些研究指向某些风险，而另一些研究则对这些风险的特殊性感到困惑。特定云计算危险的确切定义仍然是一个开放性问题，可能需要新的选择和原创方法，并且是争论最激烈的研究领域之一。


  ### 11.3 风险的定义


  危害（hazard）的定义可能会根据机会主义给出，因为取决于是否符合某人的目标。例如，如果目标是检查波动性和不确定性的影响，那么风险的定义通常不考虑结果的正负号（即收益或损失）；当情况确实是一个零和游戏时，特定的风险前景对某些方可能是损失，而对另一些方则是收益。这种情况提到了金融。在其他语境下，学者和分析师指出危险（dangers）与机会（chances）之间的区别，前者指不利的结果或损失，后者指有利的结果或利润。


  计算机工程和数据安全的标准是将危险视为严格的不利不确定结果，例如系统故障、断开、故障、编程错误、黑客攻击或破坏。传统的风险决策模型，例如 20 世纪 40 年代的冯·诺伊曼和莫根斯坦期望效用模型（Von
  Neumann and Morgenstern 2007），并没有考虑损失或不利结果，因为这会导致决策方的处境比仅仅什么都不做更糟。


  最近更具体针对信息技术，我们可以在广为人知并实施的标准中找到不同危险定义的相关示例，例如由国际标准化组织（ISO)/国际电工委员会（IEC）发布的标准，以及美国国家标准与技术研究院（NIST）发布的标准。2011
  年的《NIST 特别出版物 800-39：处理信息安全风险——组织、任务和信息系统视角》将风险定义为：“一种衡量潜在情境或场合危及实体程度的尺度，它通常是 (i)
  无论事件是否发生可能产生的不利影响，以及 (ii) 发生的概率的函数”（NIST 2011）。在这两项标准中，信息安全风险的定义都是：“由于未经授权访问、使用、披露、中断、修改或破坏信息和/或信息系统，给组织流程（包括任务、功能、形象、声誉）、组织资源、个人、其他组织和国家造成的风险。”


  思考这些定义在 10 年间变化是非常有趣的。2002 年并没有给出信息安全风险的定义。


  即使通过这种快速的语法分析，我们也可以看到，在 10 年里，IT 背景下的风险定义演变得更加详尽，但其正确的公式保持完全一致，即场合发生的概率/可能性与事件不利影响的乘积所产生的危险。正如我们所看到的，这种定义（简而言之，危害
  = 概率 × 影响）通常被几乎所有与 IT 相关的评估、论文和研究文章采用，尽管在实际项目以及不同的学科和工业领域中，风险的分析定义往往是不同的，例如具有更多的参数，甚至是复杂得多的函数关系。拟议的云安全量化风险评估框架（如
  QUIRC）也依赖于风险的相同基本定义，即概率和影响的结合（Saripalli and Walters 2010）。ISO/IEC 世界与 NIST 的情况在质上没有区别：风险的定义在多年里不断演变，在某些情况下采取了不同的路径。





  各种规模和类型的组织都面临着外部和内部因素的影响，这使得它们是否以及何时能实现目标变得不不朗。这种不确定性对公司目标的影响产生“风险”。


  值得注意的是，这里的风险是指“怀疑”对目标的影响，这与之前所有的定义都可能完全不同。它更符合 IT 领域的研究和调查，关注的是怀疑的发生及其影响，而不是提供一种操作性的、基础的公式，将不确定性仅仅地埋没在负面事件发生的概率/可能性中。尽管这些只是一些引人注目的例子，说明了我们在处理“危险”这一概念时应当预会到的定义和概念的异质性。开放集团（The
  Open Group）通过考虑不同专业领域如何发展其对危险的观点，很好地描述了风险一词在含义和语言上的另一个差异：


  这种差距在公司经理与其 IT 风险/安全专家/分析师之间尤为明显。例如，业务经理讨论减少的影响时，并不是关于有多少台服务器或运营 IT 系统将停止提供正常服务，而是失去这些通用服务对公司继续进行贸易的能力将产生什么影响，并对价值进行量化。其结果是无法满足适用的监管要求，这可能导致他们限制甚至可能停止交易，并可能面临严厉的法律处罚。（The
  Open Group 2009）


  考虑这些差异尤为重要，因为 IT 问题通常对技术人员和主管来说都是一种风险，而这两类专业人士必须相互交流（例如，技术人员为主管提供技术分析，主管为技术人员定义策略或公司优先事项）。因此，仍然提到开放集团（2009）的文章：


  “（. . .）[如果]业务经理会将威胁视为可能导致损失且该业务在不严重损害其交易地位的情况下无法承受的损失”，而技术人员更倾向于将其认为‘任何能够以导致对优势或组织造成损害的行为；例如，天灾（天气、地质事件等）；恶意攻击者；错误；故障’”


  那么我们应该意识到，这两类人员之间的通信中存在很大的误解空间。


  ## 11.4 风险与云


  之前的章节虽然与云计算没有直接关联，但它们为讨论利用云的风险提供背景框架是必要的：语言的多方面化特征和不确定性取决于专业化程度。


  关于云计算，与危害相关的核心问题可能是：风险或危害方面是否是云计算系统特有的？因此，它们是否需要为针对网络化、分散信息系统设计的传统方案提供新的分析和替代方案？


  文献给出的回答并非通用的；目前还不清楚云计算是否正在引入新的 IT 风险以及这些风险是什么。在过去的 10 年里，关于云计算和安全的已经有了大量文献，但云特定危险的定义仍然是一个未解决的问题。我们将概述当前研究和辩论的最新进展。


  ### 11.4.1 非云特有的安全风险


  Yanpei、Paxson 和 Katz 在 2010 年分析了影响云计算环境的安全问题，他们的工作标题为《云计算保护的新颖之处何在？》，这表明答案并非显而易见，其中提到在关于云计算带来的新安全威胁的常规公告中，可能存在某种程度的过度炒。相反，正如作者所声明：“我们认为，很少有云计算安全问题从根本上来说是新的或不可解决的；通常看起来是‘新’的实际上仅仅是相对于过去几十年的‘传统’计算而言。”因此，在评估云计算的安全以及风险问题时，最初的工作应该致力于排除那些并非云计算特有、且已经已知并可以获得替代方案或应对措施的问题。“不要重造轮子”是这些场景中的一个经验法则。让我们相信
  NIST 对云计算的定义（Mell and Grance 2011），这是被引用最多的定义之一：


  云计算是一种模型，能够实现对泛在、便利、按需的共享的可配置计算工具池（例如：网络、服务器和存储、软件和服务）的访问，并可以以最少的指导努力或服务提供商的交互进行快速配置和引入。


  对于客户端而言，这种模型几乎总是通过基于 Web 的远程配置端口实现的。


  安装可能会受到与 Web 应用程序、远程通信和配置错误（误操作或故意）相关的传统问题的影响。事件可能会发生（并且确实发生过），但从分析来看，其原因不应与云计算有关。例如，通信通道的机密性降低可能是由于加密库中的漏洞导致的，但这既不是“云计算漏洞”，也不是“云计算威胁”。它是使用此类库的远程通信的漏洞/风险。


  就客户而言，这个版本几乎总是通过基于 Web 的远程配置端口实现的。安装无疑可能受到与 Web 应用程序、远程通信和配置错误（错误或故意）相关的传统问题的影响。事件可能会发生（并且确实发生了），但从分析来看，其原因不应与云计算有关。例如，通信通道的机密性降低可能是由于加密库中的漏洞导致的，但这既不是“云计算漏洞”，也不是“云计算威胁”。它是使用此类库的所有远程通信的漏洞/风险。


  还可以发现许多类似的案例；然而，这里的重要信息是将旧问题标记为新的，因为已经识别的解决方案极有可能比从头开始新方案更准确、高效、廉价。考虑到云提供商，可能出现的许多问题与所有数据托管设置相同。数据不一致、副本、网络故障、停电和系统管理员的错误，加上网络关联的常见安全威胁，通常不是云特有的。遗憾的是，许多学术和工业界的分析并没有进行这种澄清的尝试，并将太多的安全风险认为是云特有的（Carlson
  2014; Carroll, Van Der Merwe, and Kotze 2011; Janeczko 2011; Rong, Nguyen, and Gilje
  Jaatun 2013）。例如，他们确认，如果一个漏洞在尖端云托管中广泛存在，那么它必须被认为是云特有的。





  沿着这一逻辑推论，其逻辑结果是将大量的并非特定于云而是特定于底层技术的漏洞归类在“云特有”的标签下。通过这种方式，威胁将通过 Web 应用程序与云计算的重叠来令分析师和专业人士感到困惑；前者是一项技术，而后者是一种通过传统和创新技术（例如同时继承两者的优点和缺点）实现的服务提供模型，提供了增强的益处并可能引入新的漏洞。因此，由于我们并不认为云计算的益处与通用
  Web 应用程序是同的，而是对特定的新颖性表示担忧，那么在同样的范围内，我们应该只将奇特的漏洞标记为云特有。


  ## 11.4.2. 云特有危害


  过去 10 年云计算时代开启以来，对云特有危险和安全漏洞进行深度分析的需求一直占据着 IT 分析师的关注焦点，并持续到今天。云计算给企业带来的回报被积极推崇，而原先不被认为是云端的免费解决方案（例如，免费电子邮件服务）在消费者中取得了巨大成功。让我们从目前为止关于云计算威胁的引用最多、最具影响力的几项调查开始：由欧盟网络和信息安全局（`ENISA`）发布的
  2009 年报告，该机构负责欧盟的社区和数据安全。该报告并不近期——对于先进的 IT 商来说，6 年是一个相当长的时间——现在读起来，确实揭示了编写时缺乏实践经验。相反，该报告依赖于专家小组以及编辑所吸引的假设。


  确切地说，他们意识到合同和管理问题对云计算而言至关重要，并对这些投入了大量关注：


  *   治理减少

  *   合规风险

  *   数据保护

  *   不安全或不彻底的信息删除

  *   恶意内部人员


  此列表结合了用户端和提供端的危险，但它特别有趣的是，因为这五个危险中有三个不是技术性的，很大程度上基于合同安排和数据治理方法（即：治理减少、锁定、合规），一个与云系统平均而言的大量冗余和信息的动态移动有关（即推测性或错误的数据删除），其他大多数是并非计算领域真正独有的通用威胁。查阅
  `ENISA` 提到的不那么重要的危险的记录也很有趣。


  其中许多并非云特有的危险，例如 Web 传输信息中的个人信息或分布式拒绝服务（`DDoS`），但有几个是云特有的。由于租户行为导致公司地位受损听起来很尴尬（例如，为什么仅仅是来自租户行为的声誉危险？），但将多租户架构作为云危险的主要来源之一具有重大的意义；客户端加固过程与云环境之间的冲突定义得过于狭窄且具有假设性，但它含式地强调了最关键的（如果不是最关键的））云特有威胁：客户端安全策略与云供应商人员之间潜在的不匹配，以及执行
  `audit`（审计）的困难（或无法执行）。这可能是一个特别隐蔽的威胁，因为技术、治理和财务方面都具有指示性，而且证明极难进行检查、量化并以某种方式缓解来自这种多维性质的危险。


  `NIST` 与此 `ENISA` 报告相对应的对应物是 2011 年出版的《800-144 公共云计算实践与安全指南》。虽然其内容极其全面，并且像 `ENISA`
  的调查一样分为几个部分，但 `NIST` 在识别云特有危险方面没有 `ENISA` 那么准确和分类明确。故事要复杂得多，并讨论了许多标准安全问题，偶尔与其他 `NIST`
  的出版物重叠。这些是 `NIST` 作者所说的：“公共云供应商的默认提供通常并不代表特定组织的安全和隐私需求，”这与 `ENISA` 提到的客户端加固技术与云环境之间的冲突非常相似。但他们继续写道：


  不可协商的服务安排（其服务条件完全由云供应商规定）在个人云计算中通常是标准做法。经过协商的服务安排也是可能的。[. . .] 关键信息和软件可能需要机构承担一份协商的服务协议以利用公云。


  这是一个关键点，直到今天仍然是许多关于云危险的报告和讨论的主题，且没有明确且实行的答案。一方面，人们已经承认云供应商提供的标准化 `SLAs` 无法满足某些客户对风险控制的需求，而且还不包含安全级别维度（`Baset`
  2012；`Petcu` 和 `Craciun` 2014）。另一方面，云消费者通常没有谈判能力向云供应商等经济巨头施加合同条件，这些巨头的业务模式建立在严格的服务标准化之上，以降低管理成本、提高自动化并实现规模经济。在这种情况下存在着一个未解决的问题：基于每个客户的
  `SLA` 个性化对于处理云危险来说既是必要的也是实际的。考虑到论文《云计算安全的新变化》（`Yanpei`、`Paxson` 和 `Katz` 2011），多租户特征以及公司和技术方面的审计问题被认为是两个最关键的云特有危险源。多租户特征可能导致一系列的危险，即对你的技术性具有全新的全新的意义，或对影响范围和发生概率具有新的意义。相互可审计性是云明星（云实体）关于某些标准支持用户/提供者场景之间复杂关系的逻辑结果。我们已经指出了这种高度复杂性的几个首要动机，即绑定云客户和供应商的专门的、治理的和财务问题的纠缠。相互可审计性将对于量化支持和安全水平是必需的，对于更著名的解决方案和恢复过程是必需的，而且它是定义长期的、可扩展的个性化
  `SLAs` 的必要条件。然而，尽管在概念上承认了相互可审计性的优势，但在实践中，云客户从未对云托管供应商进行过审计，除非在极端情况下。




  Ryan (2013) 在他的调查中得另一个结论：“因此，云保护所带来的真正独特挑战可以归结为一点：云端中的信息可以从云供应商处被检索。”在他看来，与已知安全风险相关的真正差异因素并不是多租户机制，而是资产和数据的管理权与控制权从所有者向供应商的转移。根据这一观点，云供应商不能与简单的数据托管服务相提并论，因为其重要特征不是数据存储（就此而言，传统的加密是隔离的替代方案）；相反，需要云供应商来实施根据云支持类型（即支持/平台/基础设施的支持）而变化的“非平凡计算”。云计算分析了诸高级加密技术，例如受保护的多方计算（Bennani,
  Damiani, and Cimato 2010; Cramer, Damgård, and Nielsen 2001; López-Alt, Tromer,
  and Vaikuntanathan 2012）或全同态加密（Gentry 2009），尽管这些方法不可避免地增加了解决方案的复杂性，而在构建大规模云技术的阶段这已经非常难以处理了。那么，Ryan
  预见的通过云供应商确保机密性的威胁仍然依赖于合同义务，即禁止供应商披露客户信息，但目前还没有任何明确的技术替代方案可以在大型工业环境中实施。一项关于云处理过程中公民风险当前的研究是提供全面的功能性解决方案的首次尝试，但它仍然基于严谨的建模假设和模拟案例研究（Damiani,
  Cimato, and Gianini 2015）。相反，来自 CERT（计算机应急响应小组）的 Claycomb 和 Nicoll (2012) 指出内部人员带来的普通危险具有云特定的内涵，值得进行深度评估。内部人员带来的显而易见的威胁是云供应商的一个虚构秘书，他可能会引发任何类型的严重损害。另一方面，这种情况与每家数据托管业务在根本上没有区别，根据
  CERT 编写者的说法，从事件信息中我们获得的关于这方面的证据非常少。作者反而考虑了两个更贴合某些云情况的案例：利用云特定漏洞的内部人员，以及利用云系统破坏少数供应商本地资源的内部人员。在第一种场景中，内部人员的特权可能允许他/她发现并利用云基础设施中的漏洞，以获取敏感数据推向市场或用于私人利益。在第二种情况下，内部人员可能会利用其在云工具中的地位出于非法目的（例如，针对外部目标发起
  DDoS 攻击）或外泄敏感数据（Moore et al 2011）。


  仅将基于互联网系统的传统安全危险重新标记为云特定的分析在程度上是徒劳的，甚至是明显具有误导性的。因此，对云特定危害评估定义的追求对于许多专业人士和学者来说，仍然是云计算研究中最具挑战性的问题。最近的一些工作集中在以前被忽视的云危害评估和管理的特定特征上。Keller
  和 König (2014) 强调，对云供应商底层系统结构的理解不足，是首次识别云特定危险的严重障碍之一。


  相反，微软的一篇详细文章（Stone and Noel n.d.）在 `ISO 31000` (`ISO/FDIS 2009`）的适当框架下对云危害管理提供了有用的评估，例如采用知名的全球标准，而不是通过另一种危害过程管理来“重新发明轮子”。风险评估通常分为三个阶段，即危害识别、危害分析和危害评估，随后是风险治疗的指导阶段。随后利用整体的
  `ISO` 风险程序来评估云服务替代方案。


  这些是导致方向转变和危害评估的典型问题。


  ### 11.4.3. 云服务的安全 SLA


  长期以来，将风险转移给第三方一直是风险控制的基础。它催生了保险公司以及用于评估保险风险的精算研究。


  通常，危险通过在双方之间规定正式合同从一方转移到另一方。云选项以及几乎所有的服务/基础设施外包都具有完全相同的属性。企业经常将解决方案外包给云供应商，不仅是为了让他们承担更少的工作（如果是那样的话），还为了免除与处理技术基础设施或支持相关的危险，例如网络故障或停电。通常，所有云提供商都会缓解这些问题，因为面临不必要的后果（或大部分后果）的是云供应商。云客户支付标准费用。


  在培训中，如往常，事情确实可能出错，因为谁在控制一切，在多大程度上，危险从客户转移到云供应商，并严格依赖于 `SLA` 中规定的合同条件。由于由于，`SLAs`
  在关于云危险的讨论中起着至关重要的作用：因为一切都取决于这些。


  当认为存在云特定危险时，涉及 `SLAs` 的两个问题将成为专家之间持续研究和辩论的话题：`cloud SLA` 和 `safety SLA`。第一个 `cloud
  SLA` 旨在识别一种云特定的 `SLA`，它应该为用户的平均需求提供明确保证，并根据他们的特殊需求进行定制。下一个 `safety SLA` 定义了一个专门用于确保安全级别的
  `SLA`。最后，两类 `SLAs` 必须在普通的云导向 `SLA` 定义的基础上进行创新，使用关注安全的特定条款，这被认为是云系统主要的危险来源。为了清晰起见并反映目前的水平，在本章中保持两种云导向
  `SLAs` 的区别。


  Baset (2012) 对云 `SLAs` 的限制进行了现实的描述。此外，还检查了几个云供应商的 `SLAs` 关于云提供者质量等重要参数。意意外的是，没有一个显示出足够的性能保证，而且它们将发现
  `SLA` 违约的负担给了客户。


  - `Service assurance`：用于衡量在时间间隔内此类服务供应的指标（例如：可用性、响应时间）

  - `Service warranty time interval`：机构保证应当履行的长度（例如：账单月份、自最后索赔以来的期限、1 小时）

  - `Service warranty granularity`：定义服务保证的来源规模（例如：按机构、按数据中心、按案件、按笔交易）

  - `Service guarantee exception`：排除在测试之外实例（例如：客户误用系统、因计划维护导致的停机）

  - `Service charge`：因保证违规给客户的金额（例如：部分或全部退还客户费用）

  - `Service breach coverage and measurement`：如何以及何时报告和衡量违反机构保证的行为




  仅考虑这些整体要素的列表，还需要明确“云计算的魔鬼”也极有可能隐藏在这些信息之中。仅仅通过提供部分退款而非全额退款来换取更低的服务费，会改变该 `SLA` 的风险概况。然而，考虑到让客户支付合同约定违约金的巨大潜力，且排除了保修条款中的系统滥用（正如许多现行的
  `SLAs` 都是这样规定的），这使得消费者无法受到大多数安全风险的保护。


  分析报告（`Baset 2012`）信任了许多广为人知的云供应商。这些供应商都保证了服务的可用性，尽管当某服务本应被视为“可访问”时，它通常充满了合同上的细微差别，并存在云客户追求与供应商人员目标之间产生严重错位的根源。文中并未明确认为安全或其他云特有的严格属性得到了保障；也就是说，安全等其他方面可能由于其对服务可用性的影响而被认为是有保障的，但对于应对安全风险来说，这种安全类型基本上是不够的。普通
  `SLA` 的其他元素在不同云供应商之间存在巨大差异。


  支持的粒度保证从信息中心到每个案例各异；文中未说明计划内维护是否经常排除在支持可用性措施之外；计划内维护的长度也并非总是明确（这并不意外，因为考虑到这一点，由于它可能会合理地改变绑定的系统可用率）；支持保修期可能从一整年变为一个账单月或日历月。对于支持费用，`SLAs`
  具有最大的变性，这使得极难比较一种商业供应与另一种相比，并难以掌握消费者向供应商转移威胁的得有多成功。如果未能达到特定的服务可用性阈值，退款通常是消费者发票的一部分（例如，如果可用性明显低于
  99.95%，则退还发票金额的 10%；对于每 100%的停机每 30 分钟，退还服务费用的 5%）。相反，所有云供应商在他们的 `SLAs` 中达成一致：发现违约的责任应仅由消费者承担，且消费者提交索赔的时间较短（例如
  1 个账单月或上一次索赔后的 30 个工作日）。


  总之，目前 `SLAs` 的主要局限性在于它们仅关注服务可用性或请求的完成速度（`Baset 2012`）。它还需要规定客户与供应商之间共同承担发现 `SLA`
  违约的责任，而且可能最重要的前提是，`SLA` 应该是可协商的，以适应用户的需求和属性。Dimension Data（`2013`）生成了另一份对比公共 `SLAs`
  的问卷。奇怪的是，云技术的情况并不如如此，其核心属性——多租户、按需提供商和位置独立性——产生了极不实际且困难的外部检查和审计。然而，在涉及 `SLA` 风险（用于审计和评估）方面，云系统呈现的特殊新颖性仍然需要定期的更新和分析。


  ### 总结：如何进行面向云的评估和审计？


  - **按需且显而易见**：云系统操作减少了人工交互；因此，缺乏常规审计和评估过程的关键控制点。

  - **广网络可用性**：数据位置的自由增加了法律合规性的验证难度；攻击面取决于获取设备和终点的绝对异构性。

  - **资源池化**：为给定程序设置的工具集并非预先定义的；虚拟化引入了共享物理资产的供应商之间的关联性；不同租户的操作可能会干扰其他租户。

  - **快速扩展**：云用户扩展其资源池的机会提供了一种动态性，这使得审计和评估变得困难。

  - **衡量化支持**：云计算的按需付费范式确保了计量能力本身成为检查和审计的最重要资源/流程之一。


  最后，出现关于审计和评估的通用观点：云计算的复杂性与动态性严格绑定。传统的审计和评估程序是为（大多）静态系统或工具静态配置分配的方法设计的。云技术的不同特性对目前的审计和评估程序构成了显著限制，从而提升了风险水平。


  对云解决方案安全的担忧日益增加，是学者和专业人士关注它的主要原因，从定义 `SLAs` 中纳入安全要求的准则开始。正如前面提到的，云供应商的传统做法并非纳入某些安全条件，但来自标准化机构、政府机构和分析师的压力很可能在不远的将来产生转变。挑战将在于制定安全监控指南；建立能够有效提高消费者安全水平的机构；允许、评估和管理与云解决方案相关的风险，并根据各种用户的特定需求进行定制。


  在《迈向安全 SLA——根据云跟踪服务》中，`Petcu and Craciun (2014)` 对开放式和业务类云跟踪工具进行了详尽调查，这些工具可以是建立
  `SLA` 的，也可以是以安全为导向的。出现的问题是，存在许多程序，但没有一个程序成为云供应商采纳的规范，可能也没有一个程序达到能够与云供应商传统程序集成的成熟和完整水平。除了概念上的阻力外，许多技术问题仍需解决：将高科技安全属性分散到低级观察参数、有效管理虚拟化和源弹性引入的复杂性，是最困难的挑战。手册中涵盖并附带讨论和插图的防护
  `SLA` 中应添加的参数包括：


  - 事件响应

  - 服务舒适度和负载耐受性

  - 数据生命周期管理

  - 技术漏洞和合规性管理

  - 变更方向

  - 数据隔离

  - 日志方向和取证


  作为整体评价，必须提到 `ENISA` 在积极建议实际答案方面的尝试。然而，该手册基于几项尚未在实际 `SLAs` 中被接受的假设；因此，该文档的结论有时更像是对未来、先进云
  `SLAs` 的愿望清单，而不是对现有合同的手册。


  特别是，本章中提到的两个假设并未反映现状：即追踪和发现 `SLA` 违约的责任应在云客户和供应商之间共享，而且云 `SLA` 必须根据客户的威胁模型进行定制。正如我们观察到的，这两者目前都不是云
  `SLAs` 的标准。





  此外，事件响应参数指示了一个之前未提到但可以提及的额外属性：


  事件响应相对于其他参数是扁平化的，因为事件发生和覆盖阈值是针对 SLA（服务水平协议）中包含的其他参数进行描述的。例如，当可用性在 1 个月内对 90% 的消费者低于
  99.99% 时，可能会增加一次事件，即使伸弹性测试忽略了这一点，或者发现了某一特定程度的漏洞，事件发生次数也可能增加。


  这可能是推动要求云供应商也必须对 SLA 违规负责的最重大案例之一，因为在这种情况下，这不仅是根据每个用户量化若干运营参数性能的问题，更是要对整个云流程交付给客户的方式进行一个真正的国际化衡量。安全
  SLA 需要强力定制的一个良好实例，就是考虑在支持弹性和负载承受能力方面承担风险。该参数也可以满足防御 DoS 或 DDoS 攻击的需求。


  另一方面，DoS/DDoS 的财务影响（损失）众所周知是极具变化的，这严格取决于受害者的工业和公司性质。高度静态的程序（例如运行一对没有需求波动的低流量服务器）可能不需要纳入这一要求，尽管它们仍然被要求保证对受
  DoS/DDoS 攻击的韧性。


  结果，ENISA 手册的重要部分以及建议的参数是：如果不讨论客户与供应商之间发现 SLA 违规行为的负担，并且为客户提供根据其特定风险概况定制 SLA 的机会，就不存在任何强有力的安全
  SLA。


  CUMULUS 工作非常详尽且全面，必须被视为未来安全 SLA 规范的参考手册。无论如何，它无法逃避安全风险分析的细微之处。例如，它引发了漏洞数量作为一个重要的考虑参数，这在当前的
  SLA 中未被提及，但通常由协会通过暴露扫描、跟踪工具和渗透测试进行评估。这是一个明智的观察，比 SLA 的特定范围更具通用性。


  这表明，对漏洞带来的威胁评估并非结束于技术评估，而是指示着一个与漏洞属性、其对公司和手术的影响（直接和间接影响）以及建立优先级的原则相关的评估阶段。


  定义漏洞程度既是一项技术工作，也是一项管理工作，它总是意味着一种选择，除了少数小场景外不能“全部修复”。多年来这样做变得过于昂贵，伴随着负面影响，而且是对稀缺资源的浪费。


  必须对漏洞进行评分（即加权），必须根据风险接受标准进行危害分析，并对特定漏洞设置阈值。这是支持寻求可靠、稳健且合理的漏洞排名标准的不可避免的逻辑。然而，这里，应用于漏洞的危害评估的细微之处发挥了作用：标准经常因为过时而腐败，其适用性必须不断受到质疑和研究，否则危害分析本身也将变得失败。这就是
  CVSS 变体 2 所发生的情况：其基于评分系统的有效性受到了严厉批评，对于大多数人来说，它不再被认为是管理漏洞威胁的实用替代方案（Allodi and Massacci
  2014; Eiram and Martin n.d.; Freund and Jones 2014; Rothke 2015）。


  本章贡献了对云系统危险的研究，自云系统早期以来，该主题一直是多项研究、调查和民意调查的。然而，与风险和数据安全（与云系统中的危害大部分重叠）一样，调查、分类法和相同的语言远未成熟。相反，语言往往取决于语境或过于泛泛，我们仍在努力透明地识别哪些危险是云技术特有的、因此需要新的调查、策略和替代方案，而这些是云构建组件的危险，如开放网络、远程访问、加密程序和互联网技术。


  多租户制和工具的按需自适应供应是云系统的其他特征，由于其特殊性和对危险的影响，它们受到了最多的研究。在计算危害管理时，除了参考全球组织的风险管理标准，大量调查和研究的关注点是管理云解决方案并使危险从云客户转移到云供应商的合同关系。双方之间定义
  SLA 将是指定安排状态的批准方法，但对于云技术，对于现有的 SLA 存在持续争议，这些 SLA 被认为主要不足，特别是在保护客户免受云危险方面。


