  第 10 章


  ![](img/line.jpg)


  云安全访问控制





  云安全访问控制可能是一项极其巨大的工作。让成千上万的消费者从全球访问系统，并使用许多不同的设备，这需要大量的规划和思考。多层潜在的安全风险也是黑客的理想目标。世界各地的大型集团都托管着虚拟服务器。员工和消费者位于地球的一个部分，而系统位于另一个地方。有时，服务器会根据一天中的时间或另一个地区的需求增加从一个数据中心移动到另一个；因此，我们必须固定这些“移动的目标”。以
  Netflix 为例——当一部热门电影上映，甚至发布了一部新剧时，他们会将这些内容传输到距离观看者最近的地方。此外，还存在 BYOT（自带技术）的概念，这使得数据安全专员的工作变得更加艰巨。查看安全控制的最有效方法之一是检查可能发生困难的层。系统的每一个部分都面临必须解决的挑战。偶尔，这些斗争可能很容易处理，但通常情况下必须进行全面的检查以避免未经授权的访问。


  ## 设备层


  第一层也是最暴露的层是设备层。如图 10.1 所示，考虑安全时，我们从消费者开始，并经过每一个阶段。用户层通常是主要的用户界面设备。大多数情况下，利用计算机、平板电脑或手机进入云系统。每个手机销售商可能有他们特定的浏览器，这些浏览器可能符合或不符合贵公司的安全标准。在单一品牌手机上运行良好的浏览器可能会在另一个品牌的手机上导致安全问题。


  ## 编程层和主机层


  接下来是编程层，它要求对程序应该执行的操作进行仔细执行，但也应该防止程序不该执行的操作。下一层是主机操作系统。与开发者数量相比，生产操作系统的专家寥寥无几。最后，我们将分析网络硬件和基础设施。如图
  10.1 所示，安全层从消费者开始到社区结束；一切都必须考虑在内。


  基于简单网络管理协议（`SNMP`）的管理不仅为应用程序、系统、复杂设备和环境管理系统生成管理选项。Douglas Mauro 和 Kevin Schmidt
  在名为《Essential SNMP》的出版物中编写了一本 `SNMP` 技术手册，他们还提供使用基准可以观察许多不同类型的设备和系统健康状况。某些设备设计用于包含温度信息。警告可以与其他设备（如风扇）一起自动发出，可以教它们自动开启。


  ![](images/figure10-1.jpg


  **图 10.1.** 安全层


  ## 浏览器浏览器


  由于许多原因，浏览器主导了消费者界面。最直接的原因是大多数用户不在乎他们在使用什么平台。手机、平板电脑、笔记本、笔记本电脑和高清工作站都可以访问互联网浏览器。还有几个浏览器为每个平台都有变体。


  Firefox 和 Chrome 只是领先市场的两个（Net Marketshare n.d.）。大多数云程序的终端是你的互联网浏览器。连接到基于浏览器的应用程序，你就在使用地球某处数据中心的主机工具。在前端程序中嵌入安全而不是允许不同的应用程序干扰主机与系统之间的关系，比许多网络浏览器实现提供了更高程度的保护。前端泡沫首先评估内部应用程序，以确保该前端版本是合法且未被篡改的。这偶尔会导致此类设备的登录间隔延长。如果前端应用程序与预期的前端版本不匹配，程序将拒绝该消费者的访问。


  ## 云应用程序和 BYOT


  大多数商业云应用程序和服务需要许多用户整合他们的系统。这为安全人员带来了更大的挑战。为了维护受保护的内部系统，许多企业对额外程序的访问有限。某些程序可能会设置在平板电脑和手机上，以限制用户可以执行的程序。允许用户使用你的前端执行请求将有助于防止关键应用程序或无效信息请求免受攻击。当允许员工自带设备时，由于这会变得更加困难。如果某人访问云工具，管理员希望了解他们是谁并限制用户权限。有很多恶意软件和病毒；拥有一个可以作为防止入侵防火墙的前端至关重要。前端检查在有人进入之前确保云和网络服务器的安全是必要的。


  ## 软件开发与安全


  在创建运行在云中的应用程序时，应用程序工程师有许多编程语言可以选择。由于利用计算机硬件的能力和高速处理能力，许多人倾向于复杂度较低的编程语言。由于过去 10 年芯片能力的进步，像
  `Java` 和 `Ruby` 这样的高级语言在应用程序开发中越来越流行。防止软件层是非常复杂的。开发者应该避免栈溢出、等待代码识别，并考虑消费者计算机上的个人或应用程序可能完成的所有可能发生的事情。开发者必须意识到对启用访问的滥用，并防止信息的未经授权访问。应用程序除了检查有效请求外，还必须检查无效请求。必须时刻防止授权用户进行非法活动，这必须永远留在开发者的脑海中。


  程序开发者使用的一种技术是在当查询未经授权的表或请求时，仅向消费者返回一条通用消息。而不是返回代码和开发者错误信息，用户会收到关于他们做错误的通用警告。维护来自消费者的详细错误信息可以防止机器细节泄露给用户。然后他们就可以寻找此版本和系统的漏洞。如果应用程序程序员保留了来自用户的数据，他们的应用程序将安全得多。


  ## 三层架构


  保护你程序的另一种方法是分层。


