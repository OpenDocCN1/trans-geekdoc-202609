  与以往引入计算作为服务的尝试不同，云计算已在各个计算领域取得了成功，云服务服务市场正在快速增长。凭借其便捷的“按需付费”服务、低廉的计算提供以及灵活且近乎无限的基础设施资源，云计算极有可能成为未来主要的计算范式之一。根据美国信息技术研究和咨询公司
  Gartner Inc. 的报告，2016 年将是云计算出现的定义性年份，到 2017 年底，近一半的大型企业将参与云部署。由于安全考量，此前较不愿意采用云解决方案的政府部门也开始产生兴趣，并预计他们将转向云端。安全是分布式系统和服务的一大主要关注问题。


  云计算继承了其前代的所有这些安全问题。此外，云计算引入的新概念（如计算外包、资源共享和外部数据仓库）加剧了隐私忧虑，并使云平台更容易受到新型安全问题和威胁的影响。因此，云解决方案的安全性至关重要，并可能被视为广泛采用和接受的最重大障碍之一。2014
  年的 iCloud 数据泄露事件证明了云计算的脆弱性和不安全性。云计算不仅引入了额外的风险和挑战，还为部署和维护现有安全标准增加了各种复杂性。移动设备的广泛访问以及云提供商提供的按需服务进一步放大了安全忧虑和威胁。表
  15.1 列出了一些已知攻击及其后果。根据美国法律，信息安全被定义为保护信息和信息系统免未经授权的访问、使用、披露、中断、修改、检查、记录或破坏，以提供信息的完整性、机密性和可用性。因此，为了生存，云计算应该提前解决所有这些安全问题。Gartner
  Inc. 提出了七大主要的云计算安全风险：服务外包、合规性、数据位置、共享环境、业务连续性和灾难恢复、调查非法活动的困难环境以及长期可行性。第 15.1 节 对云安全问题进行了分类讨论。


  **表 15.1.** 针对云计算的已知攻击


  | 攻击 | 后果 | 分类 |

  | --- | --- | --- |

  | • 服务窃取• 拒绝服务• 恶意软件注入• 跨虚拟机侧信道攻击• 目标共享内存• 钓鱼• 僵尸网络• 虚拟机回滚攻击 | • 服务窃取• 服务不可用• 信息泄露•
  云恶意软件注入• 未经授权的访问• 恶意软件注入• 发起暴力攻击• 敏感信息泄露 | • 云基础设施• 访问控制 |


  ## 15.1 分类


  安全问题可能出现在云计算模型的不同层级。存在系统级威胁（即入侵者绕过安全措施获取未经授权的访问），以及云基础设施和网络层威胁。云的每个组件都应该被单独处理，并需要同等的关注以保护整个云计算平台。正如文提到的，云安全分类可以分为
  表 15.2 所示的四类。这些类别在各个方面密切相关。每当一个类别受到某种攻击时，其他类别也无法确保预期的安全性。因此，在某一类别中采取适当的管理和安全预防措施会加强其他类别，并可能消除随后的威胁。因此，云计算安全研究应该以整体的方法解决所有问题，而不是对威胁进行迭代或分类的解决。


  **表 15.2.** 云安全分类


  | 数据外包 | 数据的完整性、机密性、真实性、存储、传输和迁移 |

  | --- | --- |

  | 访问控制 | 资源的用户级身份验证和授权 |

  | 基础设施 | 虚拟化、网络和平台级安全问题 |

  | 安全标准 | 用于 SLA、审计、实施和业务描述的标准和法规 |


