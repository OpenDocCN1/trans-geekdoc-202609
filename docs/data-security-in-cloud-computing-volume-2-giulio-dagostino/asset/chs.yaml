  # 第 9 章


  ![](images/line.jpg


  ## 云端中的风险管理


  由于规模效应，云供应商可以提供比客户自行维护的环境更具韧性且安全的云生态系统。这对于许多机构都有巨大的帮助。在第 3 章（云安全基线）中，我们讨论了公司需要获得对云托管供应商支持的可见性，以建立必要的信任，并正确权衡采用云解决方案来存储云客户数据的优势。这些所存储数据的敏感性需要与其所面临的安全和隐私风险进行权衡。例如，云替代方案的优势取决于云版本、获得的云支持、涉及的信息类型、机器的关键性程度、成本效益、服务类型以及任何相关的监管要求。


  机构需要应对各种风险：应用管理、投资、资金、法律责任、安全、库存、供应链、安全等等。风险管理可以被视为整合到组织每个部分的整体性行动。





  风险管理必须是一个循环执行的程序，由一系列协调的行动组成，用于控制和处理风险。该程序旨在提升战术和战略安全水平，涉及危害评估的实施、危害缓解计划的执行，以及利用风险管理方法和流程对数据系统的安全状况持续持续。在此阶段，我们关注与云端数据系统性能和应用相关的
  3 级安全风险。为了防止和缓解任何危险、不利活动、服务中断、罢工或损害，各机构需要衡量其残余风险，使其处于可接受范围之下。


  数据系统风险管理（3 级危害管理）由 1 级和 2 级的风险选择指导。2 级和 1 级的风险选择根据信息敏感性、可接受的云架构以及其在信息系统层面的防御和应对措施（即安全控制），影响公司系统最重要的选择。


  在云生态系统中，云“参与者”之间复杂的的关系、执行者各自的任务、业务流程及其支持的信息系统需要一个整合的、全生态系统的风险管理框架（`RMF`），以满足所有云参与者的需求。与任何信息系统一样，为了获取云端数据系统，“云参与者”负责评估其可接受的风险，这取决于他们对云生态系统持续威胁的风险承受度决定的阈值。为了高效管理生态系统级的信息安全威胁，战术和战略安全的提升涉及危害评估的实施、危害缓解计划的执行，以及利用风险管理方法和流程对数据系统的安全状况进行持续观察。


  在内部，每个云参与者应进一步将职责分配给其高级领导、领导和代理人。


  * 每一个“云参与者”对利用云生态系统运行或使用该数据系统产生的数据安全危险进行近实时的观察、识别和理解。

  * “云参与者”的问责，以及对这些云参与者的事件、威胁、风险控制选择和替代方案进行近实时的数据共享。


  风险可以表示为不利反应发生的概率乘以此类不利反应的规模。在数据安全中，机会被视为机器面临的危险、可能被利用的漏洞以及这些漏洞被利用的后果的函数。因此，安全风险评估侧重于识别云生态系统中可能发生不利事件之处。


  基于风险的数据系统处理方法是一项整体行动，必须完全集成到业务的每个部分，从开发到 `SDLC`（系统开发生命周期）程序，再到安全控制分配和持续观察。`RMF`
  主要在危害管理层次的第 3 级运行，但也可以与 1 级和 2 级建立联系。一些说明交互包括根据持续监控和许可决策向危险执行者提供意见；将升级的威胁数据通告官员以及数据系统所有者。指定数据系统要求的安全生命周期策略是系统改进过程的重要部分，并且必须在系统的启动阶段开始。考虑到安全状况是通用功能性和非功能性要求的子集，安全需求必须在
  `SDLC` 中与所有功能性和非功能需求同步合并。


  安全需求必须被定义，并在系统开发初期应调查并工程化替代方案。为补丁以及机器修复安全性，并实施独立于 `SDLC` 的架构设计和替代方案是一项困难得多的程序，可能会产生更高的成本，且缓解风险的潜力较小。


  采用 `RMF` 的六项关键风险相关措施的实践，必须由不同组织职能中的选定个人或类别并行实施，作为 `SDLC` 程序的一部分（或与之并行）。


  `NIST SP 800-37 Rev. 1 (2010)` 为安全分类、安全选择、安全管理、信息系统授权和安全跟踪提供了全面的建议。它鼓励通过持续监控对授权的系统进行持续的危害管理。


  ### 风险评估（检查云环境以识别漏洞和机会）：识别操作、安全和隐私需求。然后根据对云生态系统持续威胁的评估，补充安全控制集。对安全控制有效性的持续观察。


  ### 风险治疗（制定策略和计划）：


  * 在数据系统及其功能环境中实施安全控制。

  * 根据安全计划记录的程序评估安全控制，以确定控制是否正确实施以及是否产生了预期效果。

  * 根据系统性能产生的确定风险授权信息系统。


  ### 风险管理（监控、审查、区分变更）：持续监控信息系统中的安全控制，包括对系统或功能环境的变更进行安全影响分析，并向指定的官员报告安全状况。




  云用户会将 `RMF` 置于顶层操作层，即在作为支持的云基础设施之外额外组装并部署的层。然而，在获得云端协助之前，云用户应评估与特定数据系统和程序采用云端替代方案相关的风险，并针对与系统云端操作相关的威胁处理和危害控制行动制定计划。为了实现这一点，云用户应该获得对整个云生态系统的视图，该生态系统将执行云端信息平台的操作。


  云用户还应以定制化的方式应用 `RMF`，使其能够：


  * 执行危害评估

  * 识别最合适的云结构

  * 选择最可接受的云端支持

  * 获取对云端的关键可见性

  * 在委托 `SLA` 并进行安全授权之前，定义并协商关键的危害处理和危害控制缓解措施


  #图 9.1 展示了从云客户视角看适用于其云生态系统的 `RMF`（`RMF4CE`），将其描述为一个涵盖整个云生态系统的可重复过程。


  ![](img/figure9-1.jpg)


  **图 9.1.** 表 9.1 记录的 `NIST SP 800-37 Rev. 1` 中的 `RMF` 流程


  ### 云供应商


  云供应商创建云架构并组装云服务，这些服务集成了核心操作和运行特性，包括满足基准要求的隐私和安全控制。它们的替代方案旨在满足大量云客户的需求，以实现最小化定制化。云供应商对其隐私和安全控制的选择和执行，取决于其基于云供应商必须遵守的相关法律、指令、政策、标准或法规的有效性、效力和局限性。云客户特定的标准和指令并不被理解，而是被投影为标准的内核集合。


  云供应商在确定什么构成云托管支持以及其相关的边界方面具有相当灵活性，但在机器进行设计和实施时，他们可以推断云客户将创建的信息本质。因此，安全和隐私控制是利用能够满足大量潜在客户需求的云供应商来选择和执行的。


  另一方面，云支持的集中性质使得云供应商能够设计出高度特定的技术安全选项，这些选项可以提供比传统 IT 系统更高的安全性。在云支持危害管理中实施标准化或经过良好验证的方法，对于整个云生态系统及其支持的数据系统的实现至关重要。考虑到云支持由云供应商直接处理和监管，因此为该系统采用
  `RMF` 不需要执行除经典 IT 系统之外的额外工作。由于云供应商的声誉和业务连续性取决于客户选项的顺畅运行和更高性能，在采用 `RMF` 时，云托管供应商旨在弥补其云客户解决方案的潜在弱点。


  ### 云用户


  广而言之，当组织对所需的程序和设备拥有控制权时，他们更倾向于接受风险。高程度的控制赋予了组织在面临事件时权衡选项、建立优先级并采取符合其利益行动的能力。为了有效采用云端数据系统替代方案，云用户必须能够理解机器的云特定特性、每种服务类型和安装模型的架构元素，以及云参与者在创建安全云生态系统中的角色。


  此外，这对于云客户的公司和任务关键流程也至关重要。他们有能力：


  * 在适用情况下，通过合同手段询问云供应商有关代理安排和 `SLA`，在这些安排中，隐私和安全控制的执行是云供应商的职责。

  * 评估声明的隐私和安全控制的执行情况。

  * 持续跟踪所有识别出的安全和隐私控制。考虑到云客户直接控制和管理他们执行的操作技能，对这些操作层采用 `RMF` 不需要执行比经典 IT 系统更多的额外任务或手术。由于云供应商的声誉和业务连续性取决于客户选项的顺畅运行和更高性能，在采用
  `RMF` 时，云托管供应商旨在弥补其云客户解决方案的潜在弱点。广而言之，当组织对所需的程序和设备拥有控制权时，他们更倾向于接受风险。高程度的控制赋予了组织在面临事件时权衡选项、建立优先级并采取符合其利益行动的能力。为了有效采用云端数据系统替代方案，云用户必须能够理解机器的云特定特性、每种服务类型和安装模型的架构元素，以及云参与者在创建安全云生态系统中的角色。


  此外，这对于云客户的公司和任务关键流程也至关重要。他们有能力：


  * 在适用情况下，通过合同手段询问云供应商有关代理安排和 `SLA`，在这些安排中，隐私和安全控制的执行是云供应商的职责。

  * 评估声明的隐私和安全控制的执行情况。

  * 持续跟踪所有识别出的安全和隐私控制。考虑到云客户直接控制和管理他们执行的操作技能，对这些操作层采用 `RMF` 不需要执行比经典 IT 系统更多的额外任务或手术。由于采用云替代方案本质上无法提供与传统
  IT 模型相同的安全和合规水平，执行详尽的危害评估对于构建云环境的安全水平至关重要。了解各种云计算设置和支持模型之间的连接和相互依赖关系对于理解云计算涉及的安全风险至关重要。通常，采用云解决方案的云客户应遵循以下措施：


  1. 解释可以利用云替代方案的服务或程序。

  2. 识别所有必须通过该服务实现的操作。

  3. 描述安全该支持或程序所需的安全隐私条件和安全控制。


  对于 `NIST` 标准和指南的采用者，云用户需要根据信息处理来确定数据系统的安全组和相关影响水平。数据的影响程度决定了必须实施的安全控制基准。


  * 了解云供应商和代理的安全态以及继承的隐私和安全控制。

  * 调整安全和隐私控制以满足特定用例的需求，或在需要时识别额外的补偿安全控制。

  * 通过明确的任务选择声明为组织定义的安全参数分配特定值。

  * 如必要，通过增加隐私和安全控制增强来补充基准。






  -   为隐私和安全控制的执行提供额外的规范信息。


  根据所选云生态系统的结构，公司将保留并承担识别出的云用户的安全控制的执行工作，并辅以客户特定案例独有的所有额外控制措施。


  在图 9.2 中，我们从云客户的角度出发，阐述了应用于某些云生态系统的风险管理框架（RMF）。云消费者应执行的进一步措施用*斜体*表示。从云客户视角应用于云生态系统的
  RMF 可以通过将结果整合到与外部云供应商和云代理签署的合同条款和条件中，来应对与云数据系统相关的安全风险。条款和条件中的性能方面也可以整合到 `SLA` 中，`SLA`
  可以是云客户、云供应商以及代理（适用）的安全授权程序和支持安排（`SA`）的组成部分。合同条款应包含确保云客户方便访问，或供应商能够及时交付云审计日志、持续观察日志以及其他用户访问日志的保证。


  ![](img/figure9-2.jpg)


  **图 9.2.** 表格 9.1 和 NIST SP 800-37 Rev. 1 中记录的 RMF 流程


  表格 9.2 中措施涵盖的策略使组织能够将其传统的、混合的以及系统特定的安全控制和其他安全状况状况提交给采购官员、云供应商、业务承运商和代理。云消费者负责在选择云供应商和代理之前，进行危害评估，识别由于其云端支持产生的所有安全需求，并选择适当的安全和隐私控制。应选择最符合云客户需求的提供者和代理，可以是直接选择或通过许可云供应商存储库进行选择。云用户应执行全面的评估（理想情况下与第三方独立评估员合作），以估计使用此服务带来的风险。成功迁移并创建到安全的云生态系统中，依赖于分析云供应商的安全态势和系统功能，识别为确保支持或计划而需要实施的剩余隐私和安全控制，并识别负责实施这些控制的云“参与者”。这些额外的隐私和安全控制措施必须在涉及云用户和其他相关云“参与者”的安排中处理。


  `SLA` 是该 `SA` 的部分，详细说明了将提供的提供者的数量和类型，例如但不限于交付周期和性能参数。云供应商利用基于服务的协议来向可能的云客户阐明其产品和支持条件。云客户应特别关注
  `SLAs`，并要求业务采购、技术和政策专家确保 `SLA` 的细节将允许组织满足其任务和功能需求。选择和比较服务提供商的一项挑战是，云供应商可能会提供一份从供应商视角编写的默认合同。此类默认合同可能无法满意地满足云客户的需求，并可能阻碍云消费者对交付机制的可见性。


  总之，采用基于云的信息系统解决方案要求云客户识别其安全状况，评估每个潜在服务提供者的隐私和安全控制，谈判 `SLAs` 和 `SAs`，并在授权支持之前与所有云供应商建立信任。本出版物引入的综合危害分析结合保护云生态系统编排，以及关于谈判
  `SLAs` 的建议，旨在帮助云买家在管理风险和采用云解决方案方面做出明智决策。


