  ## 引言


  我系列著作中致力于云计算数据安全的第二卷，既是一份专业基准，也是从业人员指南，旨在提供当今最完整、最简洁的云计算安全视角。它涵盖了与基础技术及最新进展相关的云计算安全概念、技术和实践。它研究了针对各种云计算保护问题的实际解决方案。


  本书的主要读者群包括了对监控和分析特定的、可衡量的云计算保护环境感兴趣的工程师/学生，这些环境可能包括基础设施或运输系统、机械系统、地震事件和水下环境。这本书对于对战术监控以及移动云计算保护目标分类和监控感兴趣的安全及相关专业人士也很有用。这本详尽的参考书和从业者简读对于云计算安全高年级和研究生课程的学生也具有重要意义。


  # 第 7 章


  ![](img/line.jpg)


  ## 安全云架构


  互联网提供了跨越大陆的计算节点无缝连接；因此，19 世纪初的计算范式已发展为云计算。云计算架构的元素都是交付云计算解决方案所需的硬件和软件（`NIST` 和美国商务部，2013）。此外，这些云计算架构的组件被协调成前端平台或云客户、后端平台（如服务器和存储设备），以及一个连接前后端的路由，以获取云解决方案。这条路由就是网络，它可以是公共（互联网），也可以是私有社区，如图
  7.1


  **图 7.1.** 云计算结构


  ![](img/figure7-2.jpg)


  **图 7.2.** 云到底有多安全？


  接下来，我们列出了与云计算系统相关的许多安全风险。这些风险必须由服务提供商处理并在 `SLA` 中说明。客户必须了解危险的全部影响，因为服务供应商是向需要保护其客户信息的客户提供服务（云安全联盟，2011）：


  - **治理**：考虑到用户不管理计算基础设施，安全和隐私的管理相对松散，但必须符合当地和联邦法规。

  - **治理模糊性**：云服务提供商必须涵盖大多数客户的隐私和安全需求，这些客户对何构成最小治理的需求可能有所不同。

  - **合规性**：云计算消费者必须确保存储在服务提供商设施的客户数据的安全，这反要求云服务提供商根据法规获得适当认证。

  - **安全事件**：安全泄露的检测、报告和管理必须对计算消费者立即进行透明化记录。**






  - **信息安全**：云计算服务提供商需要确保任务关键数据免受损坏或未经授权的访问，并提供详细的数据备份流程，以防止数据在与云供应商之间传输过程中的完整性和机密性受到损害（防止中间人攻击）。

  - **信息删除**：在 `SLA` 终止时，消费者必须明确要求数据存储介质完全且不可恢复地删除消费者数据。如果数据随后在次级市场出售，该场景将产生法律后果。

  - **业务失败**：云支持提供商可能会申请破产，导致无法继续为其客户提供资源访问，这将对消费者的业务周期产生不利影响。

  - **服务中断**：网络服务提供商是云计算的骨干，他们为云消费者和云支持提供商之间提供连接性。


  云客户面临的安全和隐私问题要求他们评估云环境中的风险及其管理，并降低这些风险。当然，云计算所提供的最核心、至关重要的优势是降低业务成本。


  ### 7.1 治理与综合风险分析


  大多数公司都建立了完善的安全目标、策略和策略，这些策略符合合规需求，以保护其知识产权和客户数据。许多安全要素都在发挥作用；然而，最关键的四个组件如图`Figure
  7.3`所示。信息及其传输必须通过加密通道进行。应用程序和存储安全必须由云服务提供商维护。`Figure 7.4` 说明了安全代理扮演的角色，其是云供应商和云客户之间的中间人。安全代理将代表云服务提供商和云客户采取。云审计员也可以提供审计服务。单个云计算客户可能需要安全经纪人的服务，该经纪人可能还会担任法律顾问来解释
  `SLA`。


  ![](img/figure7-3.jpg)


  **图 7.3.** 四个安全要素


  ![](img/figure7-4.jpg)


  **图 7.4.** 安全代理扮演的角色


  安全策略框架是基于危害分析预测以及资源受到破坏时对业务收益的影响而设计的。云计算中的安全和隐私需求与传统的 IT 环境不同，但两者的共同点是安全违规对企业资产的影响。在云计算中，安全泄露不仅会影响一个云计算客户，其影响可能是深远的，因为其他客户的安全也可能被破坏。因此，安全控制策略框架必须考虑对多个客户的支持。


  云客户需要理解他们所面临的风险，因此他们需要实施与云供应商提供的控制相同的安全控制，因为并不是所有的云客户在基础设施、软件和平台即（PaaS）方面都需要相同级别的服务。作为通用治理的一部分，如果安全泄露是因为服务提供商的故意疏忽或行为导致的，云支持提供商需要向客户进行赔偿。大多数云服务提供商在跨越技术边界的多个地点设有数据中心，在业务签署云托管服务时，也必须考虑到这一点；`Figure
  7.5` 显示了云客户尝试访问云供应商数据中心之间分布式数据的情况。在这种情况下，每个数据中心中的信息都受其所在地国家法规和法律的约束，这引发了关于数据在这些国家如何管理或是否正处于传输状态的安全担忧。这至关重要，因为隐私法在在地缘政治边界上并不统一，而且如果资产受到破坏，可能会产生深远的影响。


  ![](img/figure7-5.jpg)


  **图 7.5.** 云用户与服务提供商


  云服务供应商必须定期创建其解决方案的审计报告，并按照 `SLA` 中的规定与客户共享。审计报告应列出客户对所有数据处理和数据存储访问活动的日志，包括任何明显的异常操作。


  更频繁的安全泄露意味着服务提供商现在被强制执行合规法规。并不是每个国家都有相同的合规法规，这可能对消费者产生重大影响。


  任何类型的消费者信息（无论是非结构化还是结构化数据，以及存储在介质上的任何格式（加密或未加密））都是任何公司的命脉。当然，当一家公司选择订阅云计算提供者的协助时，它必须了解面临的风险。公司可能决定只将非关键数据移至云端，并在其本地基础设施中维护关键数据，从而降低风险因素。随着时间的推移，公司可能会认为这种做法不切实际，因此决定将所有信息传输到云端。云计算支持提供商可能拥有将客户数据分散在多个数据中心的策略。云计算的本质特征就是通过分布来克服单点故障，因此客户可以
  24/7 访问其信息。


  云计算改进了安全防护的范围，涵盖了静态数据和沿网络传输的信息；因此，企业必须对其信息资产进行分析。数据（包括结构化和非结构化数据）应被分类为数据集，每个数据集对应于特定的目的，这些目的代表与给定公司内各个部门相关的业务流程。这些部门中的每一个对所有这些业务流程（因此对信息集合）都有特定的处理权限。在这里，我们需要利用分配给每个业务流程（以及对应数据集）的某些反射算法来定义安全权限；首席信息官
  (`CIO`) 将对所有数据集拥有最高级别的权限。


  反射算法在可访问性管理下还识别出对数据集具有共享访问权限（包含）的分支以及具有私有入口的分支。因此，安全策略现在使用反射算法定义，并采用安全控制措施。下一步是建立业务流程的监控。所描述的安全策略和实施的控制器应确保数据集的隐私符合当地的合规法规（`Figure
  7.6`）。当然，云计算服务提供商还需要建立安全控制措施来保护其消费者的信息集。


  ![](img/figure7-6.jpg)


  **图 7.6.** 合规架构示例






  在本节中，我们提出了一个矩阵（表 7.1）来评估与云计算服务相关的风险。在前三列中，我们识别了威胁类型，以及该威胁如何利用针对相关资产的漏洞。对于每种威胁都给出了相应的防护措施，然后列出了后果以及相关的严重程度、可能性和危险等级。


  图 7.7（案例研究）展示了云供应商内部局域网（LAN）安全架构的示意图。观察面向外部防火墙的边界路由器的部署。内部局域网架构显示安装了内部防火墙，以进一步保护该区域。


  在本章中，我们分析了云计算安全的各个方面，因为它是构建云服务的关键基石。云计算支持提供商必须向寻求注册云服务的潜在客户提供 `SLA`。`SLA` 是在发生安全泄露事件时能够为云客户提供某种满意度的最重要文档。我们必须指出，安全风险的管理和评估是同样动态的过程，由于漏洞不断不断发现，必须对防护措施进行重新评估；因此，安全控制是一个不断演变的程序。


