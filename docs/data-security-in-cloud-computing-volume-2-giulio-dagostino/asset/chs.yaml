  # 第 12 章


  ![](img/line.jpg)


  ## 基础设施服务 (IAAS)


  为了能够利用任何云架构的数据安全，理解其基础知识至关重要。在本章中，我们将检查云基础设施的一些组成部分以及一些概念。


  ### 12.1 考虑因素


  当我们从个人视角来看云基础设施的安全时，考虑其整体性能对我们有何影响是有价值的（Gurkok 2013）。在管理多个用户的云环境时，运营商必须满足大多数用户的需求。这些不同的用户通常会有不同的安全需求。云环境的设计理念必须是所有用户需求的并集，尽管并没有某个用户需要所有这些需求。减少这种情况下复杂性的一种方法是根据各种安全需求将特定的租户或软件隔离到不同的社区中。这种方法的关键是将具有相似安全条件的用户放在一起。





  考虑资源耗尽也是非常重要的。恶意用户可能会通过吞噬计算节点提供的 `CPU` 和 `RAM` 资源，使云基础设施瘫痪，或影响基础设施上不同用户的性能。这种漏洞通常不适用于裸金属计算节点，因为
  `CPU` 和 `RAM` 资源并不在多个工作负载之间共享。尽管如此，无论由于恶意意图还是仅仅因为工作负载或程序失控导致的匹配，为这种潜在风险做好准备都是关重要的。另一个关键的最终安全考量是云基础设施的运营信任版本。特别是对于使用虚拟化程序策略，云计算基础设施的监管者有权隐形地查看、复制和更改运行在该云环境中的工作负载或程序所包含的信息以及执行的活动。因此，对任何参与处理云基础设施的第三方进行全面评估是关重要的，这在传统的托管结构中甚至更为如此。


  ### 12.2 网络


  云基础设施的系统元素允许基础设施中的计算机、存储和其他组件相互连接，并允许其与该基础设施之外更广泛的环境建立连接。至少，系统部分将计算元素的网络中心连接到此云环境的边界，并监控计算实例之间以及与更广泛环境之间的访问类型。


  除了这些最低必要的容量外，还有许多方法可以处理云基础设施的系统拓扑：数字迁移、物理网络设备的方向性以及软件定义介质。


  ### 12.3 安全影响


  与计算元素一样，网络部分最大的安全关键责任是隔离。例如，网络部分必须避免恶意负载获取未经授权的 `VLANs` 和子网，而这些子网可能是由共享相同物理硬件的授权工作负载使用的。


  至少，存储单元存储云控制数据（如虚拟服务器和数字系统定义），并为运行云环境中的软件和工作负载提供工作空间。除了在云环境中执行工作负载的最低要求外，大多数现代云基础设施技术实现的存储元素可能为创新的运营能力提供各种额外功能，或增强管理优势。


  现代存储元素可以通过与虚拟化程序协作来实现版本或备份控制，通过在固定间隔创建快照并根据配置的备份方案保留它们。存储元素与所有虚拟化程序或容器协作的另一种方法是允许服务器计算节点之间的工作负载迁移。特别，对于大规模的分布式工作负载，技术存储可以从根本上简化工作负载的执行。这些独特的存储机制通常被实现为项存储。复杂存储元素性能与更准确地归功于数据库部分的性能之间存在着微妙界限。例如，我们将在`第
  12.4 节`中讨论键值存储，但这些可以由提供更传统存储机制的相同元素来实现。


  ### 12.4 存储


  与云结构的其他元素类似，可能最关键的安全相关考虑是计算机实例、工作负载和软件之间的完全隔离。在存储方面，计算元素在执行这种孤立方面起着重要作用；尽管如此，存储元素也必须保证计算机实例只能访问授权的存储区域，例如通过维护强大的网络文件系统权限和
  `iSCSI` 身份验证。单个计算实例上的恶意代码不应该能够通过操纵存储基础设施获取另一个工作负载的信息。这些问题也会扩展到存储部分性能的其他更复杂的方面。


  权限管理不当与其他标准信息卫生工作是几乎任何环境中的危险主要源——考虑到云基础设施复杂的多租户特性，这一点在云基础设施中尤为严重。通过为合适的抽象层级提供这一关键服务，数据库元素使得运行在云环境中的软件和工作负载能够利用其对其数据库需求的支持，使它们更易访问且实现起来更简单。


  数据库元素实现的数据库性能不仅供软件利用，而且会随着工作负载随云一同增加而增长；程序提高了对数据库层的要求。至少，数据库元素提供了对中央数据库程序的访问，无论是
  `SQL` 还是 `NoSQL`。大多数强大的数据库元素允许用户根据需求实例化数据库提供程序，同时允许云基础设施所有者控制特定的区域，包括备份程序以及性能参数。（Yeluri
  and Castro-Leon 2014）


  ### 12.5 数据库


  与云结构的其他元素不同，数据库具有隔离用户彼此的需求，并还需要对复杂数据集的复杂用户群配置特定的访问权限。然而，数据库被用于存储数据，而数据通常是现代企业最重要的资产之一。因此，考虑存储在云基础设施中的信息的价值是关重要的。


  无论涉及哪些技术，我们都期望第三方拥有我们业务中最重要的资产。加密等缓解技术不在本节范围之内，但它们通常是云基础设施中安全数据库元素不可或的组成部分。


  ### 12.6 控制





  云基础设施的管理元素为管理员和用户提供了配置和操作基础设施所处理的每个层面的手段。为了实现这一目标，它首先必须具备与每个元素通信的能力，并执行与计算、存储、网络甚至数据库元素深度结合的操作。这些功能不仅要面向该云基础设施的管理员，还必须面向用户。


  面向用户的前端程序（通常是互联网类程序）为图形界面用户提供了手动设置和功能的界面。然而，这种类型的标准接口无法扩展到大型云基础设施；管理元素必须通过某些程序化接口暴露其功能，以简化云基础设施管理和功能中常规活动的自动化。


  所有现代的管理元素实现都支持某些应用程序编程接口（`API`），仅用于此类自动化。可以认为，`API` 也是云基础设施中最难被正确保护的部分。这既是因为管理元素所执行的操作非常复杂，也是因为管理元素必须支持的众多接口因素。管理元素可以执行准备和运行云基础设施所需的所有配置任务。为了做到，它必须处理多个计算节点、存储后端、社区链接和数据库供应商。


  管理元素必须验证唯一用户的身份，理解每个用户在云环境运行中的作用，并监控许多复杂的授权依赖关系，以适当限制用户可以执行的任务。此外，管理元素必须通过面向用户的图形用户界面以及面向机器的
  `API` 来暴露其复杂的合能力集。这些暴露方式中的每一种都带来了各自的安全考量，从输入到业务规则执行均如此。理解强大的管理元素所带来的坚固额外攻击面和功能复杂性至关重要。


  云基础设施可能极其复杂，但亲密了解它们对于正确保护云至关重要。在一个章节内彻底涵盖这一主题是不可能的，但这应该足以将本书其余部分的信息置于适当的范围内。


  ### 参考文献


  - Gurkok, C. 2013. “Securing Cloud Computing Systems.” In *Computer and Information
  Security Handbook*, ed. J.R. Vacca. 2nd ed. Boston, MA: Elsevier, pp. 97–123.

  - National Institute of Standards and Technology. 2011. “The NIST Definition of
  Cloud Computing,” Special Publication 800-145.

  - Yeluri, R., and E. Castro-Leon. 2014. *Building the Infrastructure for Cloud Security*.
  New York, NY: Apress Media, pp. 160–63.


  # 第 13 章


  ![](img/line.jpg)


  ## 数据保护的加密密钥管理


  在过去的 10 年里，公共和私有部门组织以及个人一直在向云端传输大量数据。尽管基本上，云计算具有某些不确定性，这导致了与数据中心等传统信息技术环境相比的独特安全挑战——这些不确定性源于固有的远程操作、共租机会以及共享/分布式架构，和管理控制。加密技术是保障云操作安全的一项关键技术。加密的使用意味着了加密密钥的使用。虽然加密密钥有助于保护信息安全，但密钥本身也需要被保护。


  管理元素必须验证唯一用户的身份，理解每个用户在云环境运行中的作用，并监控许多复杂的授权依赖关系，以适当限制用户可以执行的任务。此外，管理元素必须通过面向用户的图形用户界面以及面向机器的
  `API` 来暴露其复杂的能力集。这些暴露方式中的每一种都带来了各自的安全考量，从输入到业务规则执行均如此。理解强大的管理元素所带来的坚固额外攻击面和功能复杂性至关重要。


  云基础设施可能极其复杂，但亲密了解它们对于正确保护云至关重要。在一个章节内彻底涵盖这一主题是不可能的，但这应该足以将本书其余部分的信息置于适当的范围内。





  密钥可以进行格式化以便日后恢复；检索包含了在密钥主副本损坏或丢失时获取另一个密钥副本的方法。更新允许密钥在第一个激活期之后继续使用。撤销是指在激活期内（出于许多原因）使用密钥。对于这些至关重要的生命周期阶段中的每一个，都有多种可用替代方案和决策，这些决策不仅影响密钥本身的安全性，还会影响其所保护的数据或交易的安全性。密钥管理是一个术语，涵盖了维持密钥贯穿每个生命周期阶段的所有参数和操作，包括生成、存储、分发、使用、恢复和销毁。特定的一组基本管理参数和活动决定了在加密基础设施中实现的其安全功能的强度和保证程度。


  ### 13.1 密钥管理系统设计选择


  在为数据加密密钥设计一个成功的密钥管理平台时，下文解释了生命周期的所有阶段都有许多可能的选择：


  - `密钥生成—关键类型（对称/非对称）、算法、密钥强度、加密周期、密钥参数、硬件或软件加密模块、熵源等。`

  - `密钥存储—保存在何处、与加密信息的接近程度、如何屏蔽、访问管理、可审计性等。`

  - `关键分发—如何交换、分发和建立、在传输过程中如何保护、如何对身份进行验证等。`

  - `密钥使用—受保护数据的数据粒度和量、对密钥的访问、操作中使用的加密模块、在使用期间和使用后的安全性如何等。`

  - `基本维护—哪些密钥需要恢复、谁想要恢复密钥、速度多快、密钥需要评估多久、以及密钥检索如何进行审计、是否需要多方批准等。`

  - `基础销毁—一旦销毁，如何破坏、审计能力等。`


  这些设计选择影响了整个系统的功能、性能和安全性。最佳实践是制定一份《知识管理计划》（`KMP`），以定义基本管理基础设施的目标，并制定一份关键的《知识管理实践声明》（`KMPS`），用于描述为实现
  `KMP` 内部目标而所选的参数和流程。`KMP`/`KMPS` 需要处理至关重要的基础管理生命周期状态以及所做的每一项关键管理设计决策。


  对于支持云系统中编码信息的基础管理基础设施，其设计选择应在云系统所需的业务、经济、性能、合规性和安全目标的背景下做出。


  查看以下描述：


  - `功能目标—实施加密保护的平台的核心运营目标是什么？该系统设计用于为多个用户还是单个用户创建完全相同的数据吗？该系统支持业务还是公共基础？该系统支持的服务或数据价值或重要性如何？`

  - `经济目标—与系统相关的成本限制是什么？实施系统的预算的最有效利用方式是什么？`

  - `性能目标—系统的目标性能参数是什么？该系统设计用于高速或高交易的交易吗？该系统预计会被大量并发用户使用吗？`

  - `合规目标—根据机器所属的行业领域、所有权和性能，使用哪些政策和指令？这些要求如何影响系统的技术、运营和管理方面？`

  - `安全目标—实施加密保护的平台的核心运营目标是什么？该系统设计用于为多个用户还是单个用户创建完全相同的数据吗？该系统支持业务还是公共基础？该系统支持的服务或数据价值或重要性如何？`（注：原文在安全目标下重复了功能目标；此处按要求保持内容不变）。

  - `云模型—私有云、社区云、公共云，甚至是混合云`

  - `云服务类型—处理服务或存储服务`


  一旦选择了云模型，合规性和性能目标可能会导致整体结构的定义。在做出云设计决策的同时，需要定义云系统在加密使用方面的安全架构。当机器内部使用加密时，制定关键的管理策略和实践是关重要的。


  ### 13.2 云密钥管理挑战


  然而，在云环境中为加密数据开发密钥管理系统面临着特定的挑战。一些最主要的挑战包括：


  - `远程用户认证—如前所述，云系统的每个用户都是通过共享介质连接到云网络的“远程”用户。为了允许远程用户访问存储在云端的加密数据，消费者必须经过身份验证，其保证水平应与采用的加密强度相当。`

  - `硬件与软件加密—云技术旨在实现弹性的、快速部署以及可能的多个云客户使用而设计。这些特性使得云支持提供者很难提供使用硬件加密模块的加密服务；云系统的标准将是使用软件。这对于某些根据法律要求使用硬件加密的云消费者可能会产生问题。`

  - `多层特权客户—与托管在组织所有数据中心内的系统不同，云系统基于平台和基础设施服务的层，这些服务可能由不同的云服务提供商提供。每一层云服务都包含特权管理员和用户，以及属于云消费者组织的特权管理员和用户。这些多个特权用户集合为云系统构成了异常高标准的内部威胁。`

  - `多租户—大多数云系统是为多租户创建的，通过共享的基础设施、平台或程序服务鼓励许多云消费者。这些多个租户的信息和程序通过应用程序层（`SaaS`）、平台层（如
  `PaaS`）和虚拟机管理程序层（针对 `IaaS`）内部的软件机制进行隔离。`

  - `信息和密钥的可用性—加密通常保留给敏感和关键数据。当此类信息存在于云系统中时，确保加密数据和相关密钥始终可用可能会面临挑战。`


  设计云密钥管理系统需要充分考虑云系统中存在的这些异常挑战。


  ### 13.3 云密钥管理策略






  由于云系统固有的安全挑战，为了保护存储在云中的敏感或关键数据，可能需要比私有数据中心更频繁地使用加密技术。在本节中，我们将研究一些云密钥管理方法。因此，强烈建议进行分析以识别哪些数据值得受到加密保护，然后根据其最高价值或关键性对信息的加密需求进行优先级排序。其目标是尽可能地减少需要通过加密密钥进行保护的信息收集。


  “密文与密钥的分离”显示了云用户对密钥或保存数据存储位置的控制权较小，以及云用户获取这些访问权限的能力。建议寻找一种云安全系统，以便可以使用来自密钥的密文（加密数据）进行解密。这种方法在
  `IaaS` 云服务中可能是行的，但在 `PaaS` 或 `SaaS` 云支持下可能难以或无法实现。


  在可能的范围内（同时保留云系统在运营、经济和性能方面的目标），增加云平台内部密文与相关密钥的分离程度。分离密文与相关密钥的一些可能选择如下。


  ### 13.3.1. 在加密模块中建立信任


  当进行加密操作时，数据和密钥在加密模块中是可用的。因此，云用户需要建立某种信任；所使用的加密模块不能轻易受到危险，产生敏感数据或密钥供恶意第三方摄取。这可能意味着在云中使用硬件加密模块（如果可行），或使用由云客户业务或提供此类服务的受信第三方运行的加密模块。


  ### 13.3.2. 使用密钥划分技术


  在可用或可行的情况下，可以在云关键管理系统中利用加密密钥划分技术，以确保云提供商无法轻松访问用于保护敏感数据的完整密钥。在这些实现中，密钥的可能可能保存在云系统中，而另一部分保存在可靠的设备或第三方支持中。只有云用户可以将这些关键部分组合在一起，对敏感信息执行加密操作。


  在云系统内保护敏感和高价值数据需要使用加密技术和加密密钥。由于暴露于多个内部和外部威胁因素，这些密钥的方向在云环境中特别具有挑战性。一些常识性的设计和策略可以帮助实施安全有效的密钥管理方法，以保护存储在云中的信息。


  ### 参考文献


  Barker, E., M. Smid, D. Branstad, and S. Chokhan. 2012. “A Framework for Designing
  Cryptographic Key Management Systems,” NIST Special Publication 800-130.


  Chandramouli, R., M. Iorga, and S. Chokhani. 2013. “NISTIR 7956 Cryptographic Key
  Management Issues & Challenges in Cloud Services. NIST.”


  # 第 14 章


  ![](img/line.jpg)


  ## 法律合规风险管理与个人数据保护


  随着技术的广泛使用及其在业务中日益重要的作用，云计算技术的采用正以前所未有的速度增长。根据欧盟统计局（Eurostat）的数据，2014 年 24%的大型企业使用了公共云计算服务（Eurostat
  2014），Gartner 预测显著的公共云增长将持续，预计到 2017 年将增长 18%，“包括云广告在内，规模将接近 2500 亿美元”（Anderson
  et al. 2013）。


  由于云计算在提高生产力、简化信息处理以及可能最重要的是降低成本和增加利润方面具有强大能力，大多数大型企业已经迁移到云端。美国联邦政府也认识了云计算的力量，这在联邦云计算战略中得到了体现，该战略被设计为政府自身采用云服务的概述（Kundra
  2011, p. 2）。


  亚洲云计算协会（Asia Cloud Computing Association）是一个代表亚洲云生态系统利益相关者的行业协会，其最近发布了一份名为《亚洲金融服务：准备好云端——影响亚太市场云服务的金融服务监管影响报告》，该报告涵盖了亚太地区云的监管格局，并识别了金融服务行业采用云服务时的监管障碍。


  根据他们的发现，作者向立法者提出了五项主要建议：


  1. 不应对对云提供者的使用制定专门的法规。

  2. 法规应为采用云解决方案设定一个需要遵循的透明流程（就像其他形式的外包一样），并且不需要对云服务的使用进行背书。

  3. 在采取适当保护措施（例如安全、业务连续性、访问和审计）的前提下，必须允许数据传输到其他机构。

  4. 法规应仅识别包含云解决方案在的外包合同中应解决的关键问题。它们不规定提供云服务的外包合同的条款。

  5. 使用独立的第三方审计应作为金融服务机构（FSIs）和监管机构进行审计的可接受替代方案（亚洲云计算协会 2015）。


  虽然云计算技术的优势无疑超过了风险，但充分理解和分析法律和监管方面至关重要。2012 年，欧盟委员会通过了其“释放欧洲云计算潜力”的云计算战略（European
  Commission 2012），该策略最后于 2015 年 2 月 27 日进行了更新。该战略本身是政策、技术和监管格局分析以及利益相关者咨询的最终成果。该战略的目标是在
  2020 年将欧洲的 GDP 提高 1%，并通过各部门的云采用在欧盟创造 250 万个工作岗位。该战略重点关注三个主要行动，即 (i) 穿透标准丛林，(ii)
  安全公平的合同条款，以及 (iii) 建立欧洲云伙伴关系以推动公共部门的创新和增长（European Commission 2012）。现在我们来看一下这三个主要行动。首先，我们来看看所谓的标准丛林。






  ## 引言

  监管领域存在的标准错综迷宫是云发展面临的最重大挑战之一（OECD 2014, p. 5）。事实上，我们观察到的海量标准导致了在个人数据保护水平、互操作性和数据可移植性方面的不确定性；正因如此，《欧洲云战略》旨在建立既开放又安全，且完全符合欧洲监管标准的公共可用云服务（欧洲委员会
  2012, pp. 5–6）。在数字世界中，问题往往是交织在一起的。以《欧洲数字议程》中的《电子商务指令》为例，它证明了采用云的一个主要障碍是“某些领域缺乏适当的标准、现有标准缺乏广泛采用，以及由于使用不互操作的解决方案可能导致的供应商锁定”（欧洲委员会
  2012, p. 7）。对这些标准丛林进行组织将能够实现良好的互操作性、数据可移植性和可逆转性，这些都是采用云计算服务时的关键考量因素（《欧洲数字议程》2015）。这将通过《欧盟数据保护条例》来实现，这是一项框架性法律，将营造一个环境，允许安全地采用用户成功验证安全标准和数据传输安全性所需的标准和行为准则（欧洲委员会
  2012, p. 8）。理清规则丛林意味着让云用户能够体验互操作性、数据可移植性，更重要的是可逆转性（《欧洲数字议程》2015）。


  信任在云的应用中起着至关重要的作用。事实上，数字单一市场方法本身强调了这种识别的重要性，即“确定一套可以认证的适当标准，以便公共和私人采购商能够确他们已经履行了合规义务”（欧洲委员会
  2012, p. 9）。反之，这些标准和认证可以被视为云支持供应商提供的合同条款和条件，以确保合同的公平性和透明度。然而，正如委员会在其《释放欧洲云计算潜力》报告中所指出的，需要特定的框架来同时处理标准和认证。


  根据委员会的说法，其目标将是监管：


  1. 合同终止后的数据保留

  2. 数据位置与传输

  3. 数据所有权

  4. 直接和间接责任

  5. 服务水平协议


  ## 2015 年欧洲数字议程

  云计算技术和服务的繁荣与各种 IT 服务交付方式同步发展，而这些方式的实现得于移动设备的普及。事实上，公司在考虑混合解决方案时，可以根据需求购买服务，以适应公有云和私有云解决方案（Gartner
  2013）。


  法律版本随着这些技术的扩散而发展，尽管速度要慢得多。然而，人们对云计算合同的关注增加，这些合同经常由云提供商以标准形式表述。对于云解决方案的客户来说，关注以下合同方面非常重要：


  • 责任的排除或限制以及补救措施，特别是涉及数据完整性和灾难恢复的部分

  • 服务水平，包括可用性

  • 安全与隐私，特别是《欧盟数据保护指令》框架下的监管问题

  • 锁定与退出，包括期限、终止权以及退出合同时的数据返回

  • 提供商单方面修改服务功能的能力


  ## 处理合规性

  ### 14.2 处理合规性

  本节（CloudWATCH 2014）旨在为潜在客户在评估云服务合规性时提供指南。它隔离了与云连接三个阶段相关的主要问题，包括合同前阶段、合同阶段和合同后阶段。所有方面将在下文中进行详细讨论，并结合了实用的清单，以帮助客户做出明智的选择。


  ### 14.2.2 第一步：合同前阶段





  合同生效前的期限或合同签署前的阶段，对于任何合同安排来说都是一段非常的时期。务必向客户提供有关云合约所有要素的充分且透明的信息，以最大限度地避免日后的诉讼（Helberger
  and Verite 2014）。


  ### 14.2.3. 您的云服务客户面临的风险与机遇


  访问广泛网络、汇聚并最大化资源，以及在访问兼具弹性和可扩展性的提供商的同时控制成本的能力，应当与降低其授权的合规风险结合起来。在这方面，云计算在涉及云端处理的个人数据安全方面存在固有危险。欧洲数据保护机构将云端隐私和个人数据保护相关的主要风险分为两类（Article
  29 Working Party 2012, pp. 5–6）：


  1. 对个人数据缺乏控制

  2. 缺乏关于个人数据处理的信息


  因此，组织在购买云服务之前，应当考虑外包给云提供者的预期优势与云端个人数据风险之间的权衡（ENISA 2009, “Cloud Computing Risk Assesment”）。


  ### 14.2.4. 云服务的外包


  购买云服务的人始终应先经过外部和内部尽职调查。在尽职调查中应考虑以下方面。[表 14.1]和[14.2] 分别是内部和外部尽职调查清单，它们列出了客户在考虑购买云服务时应仔细查看的考虑事项。


  **表 14.1.** 内部尽职调查清单


  | 1. 定义云客户的隐私、安全和合规要求。 |

  | --- |

  | 2. 识别云客户想要迁移到云端的数据、流程或服务。 |

  | 3. 分析将服务外包到云端的风险。 |

  | 4. 识别个人数据传输到云端后保护所需的安全控制措施。 |

  | 5. 定义责任。 |


  **表 14.2.** 外部尽职调查清单


  | 1. 评估提供商是否通过例如 `PLAs V2` 满足其隐私和数据保护要求（Cloud Security Alliance 2015）。 |

  | --- |

  | 2. 检查提供商是否持有由独立第三方发布的任何认证或证明。 |

  | 3. 考虑服务条款是否可以修改、如何修改以及由谁修改。 |

  | 4. 了解提供商实施的安全控制措施是否可以以及如何被监控。 |


  ### 14.2.5. 第二步：签署云服务合同的主要问题


  签署云合同与任何其他类型的安排一样，会给客户带来许多必须仔细考虑的问题，包括管辖权、适用法律和隐私角色。这些考虑因素将在下文中深入讨论。


  ### 14.2.6. 管辖权与适用法律


  云服务合同中通常包含此类条款，允许在双方协议中确定胜任管辖权和适用法律。相关机构的建立旨在将执行合同的权力分配给特定的管辖法官，而设定适用法律则意味着建立适用于协议的规则。从理论上讲，合同自由原则赋予双方约定并建立合同管辖权和适用法律的可能性。但在实践中，云服务提供商是决定管辖法院和适用法律的实体，给客户留下的谈判空间很小。关于适用隐私法律，当由于利用云计算技术服务而处理个人数据时，适用于关于处理个人数据保护个人及此类数据自由移动的
  `Data Protection Directive 95/46/EC`。


  还应考虑 `e-privacy Directive 2002/58/ EC`，其适用条件是通过云在公共通信网络（例如电信运营商）中提供公开可用的电子通信服务。事实上，当云客户或云提供者任一符合“公共通信网络中公开可用电子通信服务提供者”的定义时，该法律就会发挥作用。确定云计算服务提供商处理个人数据时适用法律的指南概述在
  `Directive 95/46/EC` 的 `Article 4` 中，区分了位于欧盟的控制者和位于欧盟外的控制者。当数据控制者位于欧盟境内时，适用法律为其所在地欧盟成员国的法律。相反，当同一控制者存在不同的设立机构时，适用法律是发生个人数据处理的各个欧盟成员国的法律。对于位于欧盟境外并在欧盟成员国领土内使用自动化设备的控制者，除非该计算机仅用于中转，否则适用后者的法律。因此，如果云客户位于欧盟境外，但从位于欧盟内的提供商处采购云服务，则提供商将数据保护立法“出口”给了客户自己。客户在决策过程中应仔细检查管辖权和适用法律，如[表
  14.3]所示。


  **表 14.3.** 管辖权与适用法律


  | 1. 关于合同管辖权和适用法律的合同安排可以在云服务协议中。 |

  | --- |

  | 2. 在欧盟，相关的隐私法律是数据控制者所在欧盟成员国的法律，原则上讲，这意味着云客户所在国的法律。 |


  **表 14.4.** 云客户需要考虑的隐私角色方面


  | 1. 透明化地分配数据保护角色。 |

  | --- |

  | 2. 选择保证符合欧洲数据保护法律的云服务提供者。 |

  | 3. 确定作为数据处理者的云服务提供者在对于拟采用的方法和技术或组织措施方面的自主程度。 |

  | 4. 通过特定的数据处理协议约束作为数据处理者运营云服务提供者，或在云服务协议中建立明确定义的云端数据处理边界，并确保外包给云服务提供者的活动得到充分界定。
  |

  | 5. 避免使用复杂数据处理流程的提供者。 |


  ### 14.2.7. 隐私角色






  在云端数据处理中的隐私角色必须是透明的，以便合同各方的法律义务和责任能够得到正确分配。职责的标准分配方案（2012 年第 29 条工作组报告，第 7 页）表明，在云端处理的个人数据控制权属于客户。相反，云服务提供商通常被视为处理者。云客户作为数据控制者，对数据保护法规承担责任，前提是其必须遵守并履行
  `Directive 95/46/EC` 中列出的所有法律义务。相反，云提供商在定义实现控制者目的的方法以及技术或组织措施方面具有一定的灵活性。`Table 14.5`
  作为一个清单，列出了云客户需要考虑的各个方面。


  ### 表 14.5. 合同修订


  | 合同应规定所提供的服务及适用的条件，包括程序性条件；这些条件可以在服务提供过程中进行修改。 |

  | --- |

  | 合同本身应排除可能对关键任务服务和个人数据保护水平产生不利影响的变更。 |

  | 在做出更改前应通知客户。 |

  | 合同可以包含客户对协议任何变更的预通知权。 |

  | 客户应核实合同是否赋予其针对未发现的问题终止合同的权利。 |


  ### 14.2.8. 合同修订


  云提供商通常保留了单方面更改云合同的权利，并添加了允许此类操作的特定条款。这对客户来说是一个重大问题，因为客户必须核实合同是否预设了提供者的通知，或是否允许客户在合同发生不利变更时终止合同。`Table
  14.5` 为云客户关于云合同修订给出了许多建议。


  ### 14.2.9. 数据位置与数据传输


  云计算通常意味着数据在欧盟以外的服务器上进行处理或存储，因此个人数据传输到欧盟以外的可能性极高。特别关注云合同中的个人数据流至关重要。正如欧盟委员会关于第三国个人数据保护充分性的决定概述概述的，`Directive
  95/46/EC` 禁止将个人数据传输至未能提供充分保护水平的第三国。根据第 25 条第 (6) 款，委员会可能认为第三国根据其国内法或签署的国际承诺（特别是在保护个人私生活和权利方面）确保了充分的保护水平。


  1. 满足 `Article 26 (1)` 中列出的至少一个条件。

  2. 个人数据接收方签署了欧盟委员会批准的标准模型条款。

  3. 接收组织参与了由欧盟数据保护机构通过的约束性企业规则。


  当位于在美国的组织获得安全港（safe harbor）认证时，可以可以将数据传输到这些组织。当在未提供充分保障的国家进行个人数据处理时，建议客户（数据控制者/出口方）与提供商（处理者/进口方）之间签署委员会采纳的模型条款（`Decision
  2010/87/EU`）。此外，当合同满足上述列出的至少一个条件时，个人数据可以传输到欧盟以外（例如适用指令的 `Article 26.1` 或遵循安全港协议）。


  ### 14.2.10. 分包商对个人数据的处理


  云服务提供商可能会将云运行的某些处理工作外包给分包商。这些分包商可能位于欧盟以外，他们从云服务客户处接收个人数据。只有在满足前几段中至少一个条件时，才允许合法地处理来自欧盟的个人数据。此外，要意识到可能会聘用多个不同的子处理者，这可能导致对个人数据的控制缺失以及数据处理缺乏问责机制，从而导致数据主体难以行使他们的权利。云客户应检查
  `Table 14.6` 中后续的考虑事项。


  ### 表 14.6. 子处理商与分包商


  | 1. 在意见 5/2012 中（2012 年第 29 条工作组，第 9–10 页，20），欧盟数据保护机构建议处理者（提供商）告知客户正在进行的分包处理情况，从而说明分包的服务类型、当前或潜在分包商的特征，并要求此类实体保证遵守
  `Directive 95/46/EC`。 |

  | --- |

  | 2. 云提供商必须确保其分包商在合同上受到与控制者约定的相同义务和标准的约束。欧盟委员会批准的模型合同在这种非常有用。 |

  | 3. 针对分包商导致的任何违约行为，控制者应拥有对处理者的合同追救措施。 |


  ### 14.2.11. 数据主体权利（可介入性）


  根据 `Directive 95/46/EC`，数据主体拥有访问权、更正权、删除权、封锁和反对权。客户应始终控制提供者是否保证在授予易于执行的数据主体权利方面充分配合。此外，客户应确保云提供商在合同中明确承诺与云客户合作，确保在分包商处理数据时也能有效行使数据主体的权利。


  ### 14.2.12. 第 3 步：退出云服务合同：主要问题


  第三步检查退出云服务合同时需要考虑的主要问题。将讨论锁定与操作性、服务水平协议（SLAs）以及协议的终止。


  ### 14.2.13. 锁定与操作性


  锁定可能是云提供商使用专有数据格式和服务接口的结果，这使得从云提供商迁移数据的操作性和移植性变得非常困难。缺乏操作性和可移植性无疑会使服务迁移变得复杂（锁定效应）。


  ### 表 14.7. 锁定与操作性清单


  | • 检查云提供商是否以及如何确保数据的可移植性和操作性。 |

  | --- |

  | • 选择有助于操作性的标准数据格式和服务接口。 |


  ### 14.2.14. 服务水平协议






  SLA（服务水平协议）是云计算合同中不可或缺的一部分。SLA 帮助云客户识别云提供商提供的服务和服务水平目标。SLA 针对服务性能指标进行表达，因此通常以数字衡量。不同提供商之间的
  SLA 可能会差异巨大。在欧洲和国际层面，相关计划已尝试标准化提供商之间的 SLA^(11)。SLA 可以定义服务的性能，例如关于服务的可用性、安全性以及数据管理方式，有时还包括个人数据保护条款。客户应始终：


  1. 仔细阅读并分析 SLA。

  2. 检查云服务协议是否针对违反服务水平的情况提供了服务额度和补救措施（例如金钱赔偿）。


  ### 14.2.15. 合同终止


  在云合同的终止阶段，客户必须能够检索传输到云端的数据。这必须在提供商删除这些数据之前的特定期限内完成。在表 14.8 中可以找到两个实用的建议。有关个人数据保护合规的进一步投入和指导，可以在之前引用的
  `PLA V2` 中找到，作者是该文档的主要作者。`PLA V2` 作为云服务协议的附录，描述了云提供商提供的隐私保护级别，而 SLA 则侧提供有关服务性能的指标和信息（云安全联盟
  2015）。


  **表 14.8.** 建议：合同终止


  | • 云协议中应明确终止流程的步骤。 |

  | --- |

  | • 一份良好的云协议应包含规定数据检索时间的条款，例如客户从云服务中检索其数据副本的时间。还应包含数据保留期，以及提供商将个人数据传回给客户或允许客户在日后迁移到其他提供商时所遵循的程序。
  |


  在 `PLA V2` 中，云提供商描述了其承诺在数据处理过程中维护的隐私和数据保护标准，这可能为云提供商推动一项重大的全球性规则。


  `PLA V2` 是一项符合委员会致欧洲议会、理事会和欧洲经济和社会地区委员会信函中概述的“关键行动 2：安全公平的合同条款与条件”。根据《欧洲云战略》，


  识别并传播有关模型合同条款的最佳实践将通过增加潜在客户的信任来加速云计算的采用。在合同条款上采取适当行动也有助于数据保护这一关键领域。与利益相关者一起开发，用于云提供商与专业云用户之间合同的云计算服务水平协议模型条款。（欧盟委员会
  2012）


  本章为读者提供了在云关系的合同前、合同中和合同后阶段应考虑的提示和建议。事实上，在转向云服务之前，潜在客户应始终确保他们找到了提供足够数据保护的云提供商，从而做出明智决策，从提供最高保障的云提供商处采购（云安全联盟
  2015）。某些云提供商缺乏透明度，其服务条款中往往包含不合理的限制和免责条款。然而，在采购时做出明智决策是不够的。客户还必须定期确保所选云提供商遵守数据保护合规控制，即使考虑到免责条款的限制和排除。云客户（即企业和公共机构）需要更加关注云服务协议，确保其符合相关的法律合规要求，并明确双方的职责和义务。


  第 29 工作小组第 5/2012 号意见提供了一个在云采购中非常实用的清单，指出客户的法律确定性、安全性和透明度应该是提供云服务的关键决定因素（第 29 工作小组
  2012）。因此，诸如 `PLA V2` 等工具是有益的，它们代表了云提供商的结构化披露表，从而允许他们在隐私政策方面完全透明，让客户比较云提供商并快速做出明智决策。正如之前强调的，云计算的指数级增长正在改变企业和政府思考和运作的方式。云的增长将避免以比我们目前看到的更快速度持续，这使得理解云合同如何运作变得越来越重要。


