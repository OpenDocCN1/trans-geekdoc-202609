  # 第 8 章


  ![](img/line.jpg)


  ## 风险与信任评估


  云客户 (`CCs`) 与云托管支持提供商 (`CSPs`)之间的信任连接需要在 `CCs` 将其数据系统迁移到云端之前建立。这需要深入理解相关风险。此外，与信息安全、财务报告等相关的法规规定在将业务流程外包给
  `CSPs` 等第三方时，提出了必须遵守的特定要求。然而，大多数 `CCs`（尤其是中小企业）可能没有足够的知识在合适的水平上进行此类评估，因为他们并不总是聘佣专业人士来完成，而且
  `CSPs` 的运营本身也缺乏透明度。


  与传统的信息技术（即非云端）客户相比，`CC` 在哈危害评估方面面临着独特的挑战。`CSPs` 通常会将服务器机场和数据中心的安全位置、结构和信息对 `CCs`
  保密。


  此外，这种云的抽象视图只是云理论所承诺的益处之一：`CCs` 不需要深入理解该云的技术细节。正因如此，`CC` 评估每种危险和漏洞变得更加困难。请注意，危险不仅与安全问题有关，还与支持中断有关，`CSPs`
  必须在风险发生后后重新评估需要解决的问题。`CC` 必须依赖该 `CSP` 的常规程序来妥善处理基础设施。正如 `CCs` 的安全动态所言，及时处理 `CCs`
  的问题、正确地发现、恢复和报告安全及支持中断事件，是强大的风险管理和安全流程共同的结果。这些不确定性增加了危险，并表明 `CCs` 必须信任 `CSPs` (Rousseau
  et al. 1998)。


  信任和风险几个世纪以来在各种背景下被广泛研究。风险管理，特别是 IT 的危害评估，在几十年来一直是许多人的喜爱的研究课题（Kaplan and Garrick
  1981）。在本章中，除了为云设计的危害模型和信任模型外，我们还提供了一份由不同机构制作云危害评估问卷。


  我们想先澄清一下在本章后部分将使用的几个术语：


  - 威胁 (Threat)：威胁是导致尴尬事件的可能原因，可能对单个系统、个人或业务造成损害。

  - 漏洞 (Vulnerability)：漏洞是控制器的弱点，可能会被威胁利用。

  - 资产 (Asset)：资产是对你的业务有价值的物品，可以是具体的（例如建筑、电脑硬件），也可以是抽象的（例如理解力、专业知识、诀窍、数据、应用程序、信息）。

  - 控制 (Control)：控制可以防止或减少安全、隐私或支持事件发生的概率（预防或威慑性控制），指示事件已经发生（检测性管理），或减少事件带来的损害，即减少或限制影响（手术性管理）。对该个体的识别不必非是直接的。例如，可能有几个名字都叫
  `John` 且在特定日期创建的人，但具有该到达日期的 `John` 可能只有一个，且他正在某家特定公司任职。

  - 数据主体 (Data topic)：数据主体是个人信息的主体个人或公司。

  - 事件 (Incident)：事件是导致安全、隐私或支持违规/中断的事件；实例包括攻击后的机密信息泄露、未经许可的私人数据收集，或硬件故障后无法检索的信息。

  - 现象 (Event)：现象是产生可能被威胁利用以损害个人实力的某种事物。务必不要将“场合”与“现象”混淆；例如，丢失访问证是一个安全“现象”。当某人利用丢失的证件进入建筑时，它才是一个“事件”。

  - 安全事件 (Security episode)：安全事件可以描述为单次攻击或一组攻击，可以通过攻击系统、攻击者身份、受害者、网站、目标、时间等与其他攻击区分开来。

  - 隐私事件 (Privacy episode)：隐私事件可能是故意或无意违反了从数据控制处获得的权限许可，甚至是违反了适当的数据安全监管框架。隐私事件可能是服务事件或安全事件的结果。





  下一节将介绍危害分析、评估与方向，其中我们建立了危害分析、评估与管理之间联系的关系与复杂性。在第 6 章中，我们介绍了一项近期完成的研究，用于评估威胁和脆弱性，包括来自云安全联盟（CSA）的倡议，以检查针对云的最优威胁，并对
  `CSPs` 对这些威胁的准备情况获得更好的洞察。`CNIL` 最近对云执行了隐私威胁评估。`CNIL` 的工作更进一步，引入了一些步骤将风险降低到可接受的水平。第
  6 章关于信任模型和风险模型。在相同的阶段，我们还介绍了由 `A4Cloud` 开发的两个版本，这将是一个欧洲框架的工作。第一个是云危害评估模型（`CARAM`），这是一种定性设计，根据
  `CSPs` 采用的控制器以及 `CC` 意图从云存储或处理的资源，为特定的 `CSP–CC` 对适配 `ENISA` 和 `CNIL` 框架。第二个版本被称为通用威胁信任版本（`JRTM`），它是一个基于
  `CSP` 运行信息的定量模型。


  ## 危害分析


  根据这些标准，风险被定义为不确定性对目标的影响。这意味着如果我们确定某个过程的结果，那么该过程就完全没有相关的风险。危险性不仅与不利的结果（风险）相关，还与有利的结果（机会）相关。在这种标准下，错过机会可以被视为一种危害。因此，不确定性是危害分析中的主要元素；可能存在大量的怀疑资源。然而，我们可以将其分为两个大类：认识论和偶然性。


  ### 认识论与偶然不确定性


  认识论不确定性是知识匮乏的结果。随着云生态系统和云解决方案的增长，这类怀疑将减少，或进入偶然不确定性领域。偶然一词源于拉丁术语“Alea”，意为“掷骰子”。因此，偶然性怀疑基于危害分析中正在分析的处理器现象的内在随机性。此外，它意味着可用信息将足以满足构建机会或频率分布的需求。


  当怀疑可以被视为偶然的时，就可以完成定性危害分析（`Kaplan and Garrick 1981`）。通过定量危害分析可以回答三个问题：


  - 所有 `si` 的概率 `pi`（即情况实现的可能性）

  - `si` 的结果 `xi`


  情况的发生概率取决于脆弱性的出现、可能利用脆弱性的威胁、对脆弱性的风险意识，以及这些危险利用脆弱性的能力和意愿。最重要的一点是，威胁在本质上是风险、脆弱性的产物，也是来自危险对脆弱性利用的结果（即危险的影响）。


  ### 定性与定量危害分析


  当怀疑大部分来自认识论领域时，如果被选中，也可以进行定性危害分析。对于定性危害分析，使用了机会的定性量表（如几乎确定的、可能的、可能、不太可能的、频率的）以及影响的定性量表（如关键的、必要的、中等的、微小的、无关紧要的）（`Cooper
  et al. 2014`）。注意，在定性危害分析中，我们使用“可能性”（likelihood）而非“概率”（probability）。对于完全相同的情况，每个人对风险的理解可能随时间而有所异，因为不同个人在不同时间的概率和影响可能不同。这可以被称为感知危险。相反，绝对危险对每个人、每个时刻都是相同的。计算绝对危险并不简单，因为一个人的绝对风险是另一个人的感知危险。感知危险在文献中经常被称为比较危险；但在我们的章节中，我们将使用“相对风险”一术。相对风险是指行动计划相对于后续行动计划的危险。


  相对风险的一个良好实例是利用云而非你的基础设施和应用程序的机会。另一个示例是从单个 `CSP` 获取服务而非另一个 `CSP` 的服务的危险。例如，事件树分析是一种归纳法（即自下而上）方法，用于在事件发生后评估运行或被忽视的系统的影响。相反，故障树分析是一种演绎法（即自上而下）技术，基于对上层不期望发生的操作，以便在到达故障树每个分支的主原因之前，理解可能导致该种崩溃的原因。


  ## 风险评估与管理


  风险评估是对危害场景的系统评估，以理解其概率/可能性和影响。危害分析的下一步是危害评估，简要描述为根据其概率/可能性和影响分析风险状况（高风险、中等风险、低危害等）。风险管理是一个识别、评估、分析和沟通危害情况并在必要时对其缓解的过程。这种风险评估、评价和管理的层级结构表示在图
  8.1 中。可以根据以下几种方法制定缓解威胁场景原因或结果的策略：风险接受、风险回避、风险限制和风险转移。风险批准不会减少风险状况的可能性或影响。由于回避、限制或转移的代价相对于情况的影响并不昂贵或过高，因此在预期它不会发生的情况下批准了威胁。风险回避是批准的对面；不采取任何方式来防止受威胁场景影响的活动。或者，可能会实施或准备减少计划，以限制危害状况的原因或结果。最后，可以将威胁转移给另一方（例如保险提供者），代价是你的运输所需的任何价格。


  ![](img/figure8-1.jpg)


  **图 8.1.** 风险控制策略






  除了关于臭名昭著的九大因素的记录外，另一个对云危害分析可能有一定帮助的重要来源是共识评估调查问卷 (`CAIQ`) (`CSA 2014`)，这是由 CSA 为云服务提供商（CSPs）准备的一项调查。它旨在解决那些臭名昭著的九大因素中的“尽职调查不足”。`CAIQ`
  包含了分类为以下命令类的许多查询：


  - 合规性 (Compliance)

  - 数据治理 (Data governance)

  - 中心安全 (Center safety)

  - 人力资源安全 (Human resources safety)

  - 信息安全 (Information safety)

  - 法律 (Legal)

  - 运营方向 (Operations direction)

  - 风险方向 (Risk direction)

  - 发布方向 (Release direction)

  - 韧性 (Resilience)

  - 安全结构 (Safety structure)


  任何人都可以找到由多个 CSP 回答的调查问卷。CSA 的安全、信任与保证注册 (`STAR`) 数据库已成为了解特定 CSP 准备处理多种危险能力程度的来源。它根据危害情况发生的概率映射到期的负面影响来估计危险程度，这也是其他文献中危害公式的本质（Cayirci
  2013; Cayirci et al. 2014; Ezell et al. 2010; ISACA 2014; ISO/IEC 31010 2014; Kaplan
  and Garrick 1981）。尽管 `ENISA` 的指南专门针对云计算，但它是一个通用框架，并没有提供将 CSP 和云环境（CCs）的细节映射到报告列出的
  35 种威胁场景的方法（ENISA 2014）。`ENISA` 的风险情况分为四类：组织与政策、技术、法律以及其他非特定特定的情况。


  所有这些情况的可能性及其对业务的影响都是通过咨询专家团队决定的。


  影响范围和可能性分为五个不同的级别，从极低到非常显著不等。例如，组织和政策组的第一个事件场景是 `P1—供应商锁定`，其概率和影响分别被评为 `HIGH`（高）和
  `MEDIUM`（中）。随后，根据专家的意见，概率 (`probability`) 和重大影响 (`effect`) 值将根据使用 0 到 8 之间的尺度的风险矩阵，转换为每个情节场景的危害级别，如图图
  8.3 所示。最后，危害级别映射到某些定性尺度上。所有 35 个情节场景都是通过漏洞和资源的子集连接起来。


  ```

  ![](img/figure8-3.jpg)

  ```


  **图 8.3.** 使用 0 到 8 尺度的风险矩阵


  例如，事件情况 `P1—供应商锁定` 涉及漏洞 `V13`（传统技术和替代方案短缺）、`V31`（使用的完整性和透明度缺失）、`V46`（供应商选择不当）、`V47`（缺乏提供商冗余）以及资源
  `A1`（公司地位）。云环境可以通过评估定性地评估与某种情况相关的风险水平，并通过评估理解何种漏洞和资源与每个情况相关（ENISA 2014）。


  尽管如此，这些值代表了各种常见云部署中的有理推测，而且没有精确的语义。`ENISA` 的框架可以归类为用于计算的标准定性归纳性危害分析框架。`CNIL` 的方法论与
  `ENISA` 的框架相比，其区别在于：它是以云计算系统中的隐私危险为中心的风险评估。它仍然是通用的，并没有提供将 CSP 和云环境的细节映射到报告列出的 35
  种威胁场景的方法（ENISA 2014）。`ENISA` 的风险情况分为四类：组织与政策、技术、法律以及其他非特定特定的情况。





  从云计算角度进行的风险和希望建模引起了科学家们的关注（Pearson 2012; Rashidi and Movahhedinia 2012），“对支持的希望”被引入云行业模型中。标准化的信任版本对于责任的确认和保证是必要的，但目前众多的信任模型中，没有一个适用于其云环境（Li
  and Ping 2009）。有很多信任模型尝试采用 Marsh (1994) 和 Banerjee 等人 (2005) 特征的少数变量；也有许多旨在量化这些变量的信任评估机制。希望的定义可以作为模拟它的起点。这种定义并没有完全捕捉信心的所有动态，例如受托者执行特定活动且不参与投机行为的概率（Pearson
  2012）。此外，信心还有软性和硬性两个方面（Osterwalder 2001; Singh and Morley 2009; Wang and Lin 2008）。信心的硬性取决于安全措施。类似于身份验证和加密，柔性信任依赖于品牌忠诚度和地位等方面。Ryan
  等人 (2011) 不仅将安全性，还将责任性和可审计性引入为影响云计算云用户（CCs）信心的组件。


  - **信息位置**：云用户了解其信息实际上存储在何处。

  - **分析**：云用户可以查询信息的状态和位置。

  - **数据隔离**：其他实体分离每个云用户的统计数据。

  - **可访问性**：云用户可以随时获取其信息。

  - **备份与恢复**：云服务提供商（CSP）具有从灾难性故障中恢复的机制和能力，且不受灾害影响。

  - **长期资质**：云服务提供商在很一段时间内一直按照必要标准运行。


  作者对 72 个云用户回答的问卷结果进行了数学分析，以研究这些云用户对前述参数重要性的感知。调查结果，备份和检索对云用户在云计算的信心产生了最强大的影响，其次是可访问性、特权云用户可访问性、监管合规性、长期可行性和信息位置。他们的调查显示，信息隔离和分析对云用户计算希望的影响较差。Khan
  和 Malluhi (2013) 建议将控制权交给云用户，以便他们能够追踪上述参数（Rashidi and Movahhedinia 2012）。他们将这些控制器分为五类：对保存信息的控制、通过处理的数据控制、应用程序、监管合规性和收费控制。


  必须为所有这些控制设计的技术包括远程监控、防止访问静态数据、受保护的外包、数据入侵、机器可读的法规和 SLA、关于合规性的自动推理、实时摄入数据的自动组，以及该云用户限制其自身使用/账单的能力。尽管这些是为云计算和其他功能而开发的方法，但许多云服务提供商仍需要时间来进行执行、安装和使其成熟。此外，云用户也需要很长的时间和经验。此外，在云支持混合（mash-up）中的所有服务中使用这些控制器并不总是明智的。


  可靠性信任被描述为成功的概率，包含了基于风险的交易决策程序。Yudistira 等人 (2007) 引入了希望，以根据个人的组织设置来分析风险。


