    There is always a limit on the range that can be covered by the wireless network.
    For example, a router has just a range between 150 to 300 feet.


    ### Dependability

    This is another issue with the wireless network, it is very prone to interference.
    It can be easily interfered by radio signals on similar frequencies, as well as
    radiations from other devices. Physical structures can also be a source of interference.


    ### Security

    The wireless network has the issue of security, as it can be easily accessed by
    any computer within the range of the network. Once information is being transmitted
    by network, it can be easily hacked into, even if the information is encrypted.


    ### Speed

    Without mincing word, it is known fact that the wireless networks are somewhat
    slower than the wired networks. In some cases, it reaches up to 10 times slower.


    ### Top Wireless Technology Challenges

    Though the wireless technology has taken our lives by a storm, basically every
    connection can now be done wirelessly. However, the technology is yet to make
    the use of wires obsolete. There are a number of challenges that are faced by
    the wireless technology.


    ### Physical Connectivity

    In a study on some volunteers, it is identified that one of the major challenges
    faced by the use of wireless technology is physical construction of components.
    There is always a limitation on the wireless networks. In areas such as basements,
    lower floors and in buildings made of steel, there is always the deflection of
    network signals. There are many cases in which terrain has been the issue. In
    many of the cases studied, participants need to first install a distributed antenna
    system, or a mobile virtual private network before they enjoy enhanced network.


    ### Technology Connectivity Issues

    Bandwidth needs to be further improved if the wireless network is going to support
    large streams of data at once. There are innovations bound to solve this actually,
    especially with the `5G` network. However, until its overall adoption all over
    the world, it remains a major issue that needs to be tackled.


    ### Security

    Security is still a big issue with the use of wireless networks. Just as there
    are tools and frameworks integrated to protect the wireless networks, they are
    still subject to cyber-attacks. Though by-passing a system’s security is not an
    easy nut to crack, people still find their way around it. Security is yet to be
    total on the wireless network. Once the network can be accessed or visible in
    a particular location, it can be bridged. This fact opens organizations with the
    wireless networks to incessantly upgrade their security frameworks and all. There
    is the need to employ an IT security expert to monitor and maintain the security
    protocols that keep the system safe and reliable.


    ### Management

    There are several times that system get down times. To ensure that users have
    the best experience, management is saddled with the responsible of being aware
    of issues ahead of the users – in real time. Hence, there is a need to constantly
    execute surveys and tests on the network to upgrade and maintain the system.


    # Chapter 8: Network Protocols

    Protocols are intrinsic properties of what makes computer systems function effectively.
    They are like dictators or map with which the system follows to carry out specific
    tasks. Without the protocols, it may be hard to execute anything with the computer.
    Technically, a protocol can be defined as a set of rules on which communication
    is based. Protocols are agreed set of guidelines, which makes things work. Different
    aspects of wireless communications have specified protocols adapted for them.
    In this chapter, we will be taking a deeper look into the various protocols we
    have.


    ### Internet Protocols

    Internet protocols are set of digital messages formats and rules that are needed
    for the proper exchange of messages between computers across a single network
    or a group of network connected to one another. This system of instructions make
    use of what is known as the internet protocol suite, which in most cases is referred
    to as `TCP/IP`. The exchange of this messages between the computer and the network
    is done in the form of datagrams (also known as data packets). The most primary
    of the internet layer of the internet protocol suite is the `IP`. The `IP` is
    a set consisting of several communications protocols, which are made up of four
    abstraction layers. These layers are; link layer, internet layer, transport layer
    and the application layer. The `IP` has a primary function, which is the delivery
    of the datagrams from the source to the designated host. This transport is directed
    by the address on the packets. The `IP` system has a specific method with which
    addresses are labelled on (within) the datagrams. This process is referred to
    as encapsulation.


    ### Types of internet protocols

    What do you think the internet is? Many people make the mistake of thinking that
    the internet is the common World Wide Web (`WWW`). `WWW` is just one part of the
    vast internet that is made up of other components like the `FTP`, `Gopher`, `Telnet`,
    etc. There are several protocols used on the internet, each of which has its own
    standard and usage.


    #### Electronic mail

    As a statement of fact, there are three protocols that facilitate each email you
    receive. These are the Simple Mail Transfer Protocol (`SMTP`), Internet Message
    Access Protocol (`IMAP`) and the Post office Protocol 3 (`POP3`). For the `SMTP`,
    it is a protocol used in the transfer of mail away from a mail box, while the
    latter two are needed for the reception of the mail. Virtually every internet
    service provider have a framework that support these three protocols.


    #### File transfer protocol

    This is shortened as the `FTP`, and this is the protocol in play when you transfer
    files from one computer to another. This is also commonly used when you uploading
    a web page to a server, to make it visible on the World Wide Web. To use the `FTP`,
    you need a special program known as the client.


    #### `HTTP (World Wide Web)`

    This is referred to as Hypertext Transfer Protocol. It is the protocol in use
    by web servers, which makes it possible for web pages to be visible in a web browser.
    For every web address you want to visit, when you look in the address bar, you
    will see the prefix `http://`. This information is mostly on display and in the
    web address bar because some browsers are capable of enabling `FTP`. This way,
    it gives the browser a heads up on what type of information to expect.


    #### News (Usenet)

    Network News transfer Protocol is one used to facilitate Usenet. This is similar
    to the forums that are situated on web pages. On the `Usenet`, there are also
    forums that are specially meant for companies with a range of topics. `Usenet`
    can be used in various niches, ranging from computer related topics, science,
    discussion, etc.


    #### Gopher

    This is another tool used on the internet. There is every possibility that you
    aren’t aware of a protocol as this. It functions primarily in the enabling of
    a browser to search for information, without knowing the location of the material.
    You are able to search for a list of information, then culminates them and send
    to you.


    #### Telnet

