    \ \n\nIn most cases, the proxy firewalls are employed to monitor traffic for layer\
    \ 7 protocols such as HTTP and FTP. This system of firewall also makes use of\
    \ both the deep pocket inspection and the stateful inspection; \n\n*   Network\
    \ address translation firewalls (NAT): This allows several devices that have independent\
    \ network addresses to communicate and connect to the internet while making use\
    \ of just one IP address. This way, the individual IP address of the computers\
