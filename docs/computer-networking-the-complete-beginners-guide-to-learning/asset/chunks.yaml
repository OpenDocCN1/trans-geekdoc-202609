    # Network Management Protocols


    The names spells it all out. Network management protocols are suites of protocols
    that take charge of the definition of processes, and policies that manage, monitor
    and maintain a computer network. This set of instructions are known to convey
    and manage the various operations and communications that take place on a particular
    computer network. In every management protocol, there is always the proposition
    of architectures and procedures needed to extract, collect, transfer, store and
    report information related to management. If you are looking to understand any
    management protocol, make sure you understand the architecture. This is really
    important.


    ## Types of the Network Management Protocols


    In this section of the book, we take a look at three of the most popular protocols
    you really need to know. There are others, but they comes at a reduced relevance,
    relative to these;


    ### ICMP


    This is a network layer protocol which is a concrete part of the group of sub-protocols
    that are associated with the `IP` protocol. The main function of this protocol
    is the validation of faults, and also the ensuring of performance. It detects
    errors and send information back in that light. This is why the main messages
    y `ICMP` are error messages and control messages. This is the protocol used in
    the calculation of factors like latency, response time or packet loss, etc.


    ### SNMP


    This is the Simple Network Management Protocol, which is the application layer
    that oversees failures, performance and actions. The framework of `SNMP` is to
    gather, organize and communicate management information on the various devices
    situated on the network. This protocol is used in quite a number of hardware components,
    to ensure diversity of devices and also diversity of marks.


    #### SNMP Architecture


    There are two basic components of the `SNMP` framework, which are the `SNMP` agents
    and the `SNMP` administrators. The `SNMP` agents are a bunch of software that
    run everything related to the elements that needs to be managed. They primarily
    collect data on the device `SNMP` administrators are more involved in the management
    and monitoring section of the network. They serve as the centralized location
    for all data sent and stored.


    #### How are data organized in SNMP?


    Data that are in for management on the `SNMP` are known as objects.

    - **OIDs (Object identifier)**: These are basic elements with the primary function
    of identifying objects. The `OIDs` are always in the format: `.1.3.6.1.4.1.9.9.276.1.1.1.1.1.11`.
    The extraction of this number comes from the system of hierarchical organization
    that starts by identifying the producer of the object.

    - **MIBs (Management Information base)**: These are the basic format that data
    from the `SNMP` agents to the `SNMP` managers follow.


    ### WMI


    This is the Windows Management Instrumentation. This is mainly used in systems
    and devices that run on the `Windows` software. On the `WMI` framework, there
    is the model that represents, obtain and share management information on any hardware
    that runs on windows.


    #### The Architecture


    There are three fundamental entities on the `WMI` architecture, which are the
    `WMI` providers, `WMI` infrastructure and the administration applications. The
    providers is in-charge of getting any management information from one object or
    the other. The infrastructure is the framework designed to bridge the gap between
    suppliers and the management tools. Protocols are what make things work on any
    computer network. It sort of the order and rules that guide every operation. If
    there are no protocols handling the various aspects of what goes on in a network,
    you can only imagine the amount of disarray.


    # Chapter 9: Communication and Cellular Systems


    Communication in recent years is made possible by the cellular systems. Cellular
    communication is one that has been fostered by the use of Mobile phones. Our phones
    as we know them, are all based on cellular networks. Cellular communication is
    premised on the ability of radio to execute simultaneous transmission and reception.
    Mainly, on the cellular networks, there are geographical divisions of cells within
    particular cells. The cellular has revolutionized the way we socialize as humans.
    This technology is constantly evolving, offering faster, effective and real-time
    communication in different forms.


    ## Features of Cellular Network systems


    The advent of the wireless cellular networks has served as a solution to the spectral
    congestion problem. And it has also increased the capacity of users. There are
    some features that make these possible:


    - In a limited spectrum, there is the offering a high capacity

    - It allows for the reuse of radio channels in different cells

    - On the cellular network, there is the enabling of a fixed number of channels
    to serve a somewhat large number of channels. This is achieved by reusing the
    channels across different regions

    - In this case, the communication always occurs between the mobile and the base
    station

    - There is the assignment of neighboring cells to different channel groups

    - The cellular networks ensure that interference levels are tolerable

    - There is the presence of frequency reuse or planning

    - There is also the organization of wireless cellular network


    The cellular networks are always organized into multiple low power transmitters.


    ### Shape of Cells


    The area covered by cellular networks are always divided into what is referred
    to as Cells. On each cell, there is the presence of antenna used for transmission
    of signal. One each cell, there are unique frequencies. Communication of data
    across cellular networks is always served by the transmitter at the base station,
    as well as the receiver and the control unit. There are two main shapes of cells,
    which can either be squared or hexagonal.


    #### Square

    In the square cells, there are four neighbors at a distance of “d,” and there
    are other four at another distance “2d”.


    #### Hexagonal

    This shape is recommended for use in most cases because it offers easy coverage.
    Another reason why it is recommended is thanks to the shape. There are some advantages
    that come with its use:


    - There is the provision of equidistant antennas

    - The distance from the center to the vertex is the same as the length of the
    side.


    ### Frequency Reuse


    This is a phenomenon in which you make use of the same radio frequency within
    a given area, especially when they are separated by a considerable distance, offering
    minimal interference in the bid of establishing communications. There are some
    benefits from the concept of frequency reuse:


    - It fosters the communication within a particular cell on a particular frequency

    - There is a limitation on the escaping power to the adjacent cells

    - Frequencies can always be reused on close cells

    - You can use the same frequency for more than one communication

    - It is possible to have about 10 to 50 frequencies on a particular cell

