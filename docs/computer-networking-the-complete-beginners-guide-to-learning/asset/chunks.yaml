    # 窝网络的演变


    一切始于 `1G`，而现在我们正处于一个由超音速 `5G` 连接的世界。在过去的几十年里，通信取得了多遥远、多大的成就？第一代移动网络出现于 20 世纪 80
    年代初。但随着全球用户的爆炸式增长，需要不断扩张通信网络。这一切都始于意大利发明家`马尔可尼`（Marconi）。他成功地利用无线电波传输了`莫斯电码`信号。这种传输距离达到了
    `3.2kms`。这可以追溯到 `1985` 年。这是世界上首次亮相的无线通信。从那时起，人们对改进无线电波进行了持续的研究。得益于这项发明，科学家和工程师开始研发兼容手机，以取代当时流行的有线电话。第一代移动手机是由`马丁·库珀`（Martin
    Cooper）发明的，他当时在`摩托罗拉`（Motorola）工作。该原型是用于汽车的，开发于 `1974` 年。这项发明被认为是世界通信的转折点。


    ## 1G


    这是迎接无线通信世界的第一个移动网络。该网络于 `1979` 年由日本电话电信公司（Nippon Telephone and Telegraph Company）引入日本主流。在
    `1980s`，它在美国、芬兰、英国和欧洲流行。这种情况下使用的是模拟系统。


    ### 1G 的特性

    - 频率为 `800MHz` 和 `900MHz`

    - 带宽为 `10Mhz`

    - 使用了模拟交换技术

    - 特点是频率调制

    - 使用了仅限语音的业务模式

    - 接入技术是频率分用多址


    ### 1G 的缺点

    - 由于干扰，语音音质很差

    - 电池寿命非常短

    - 手机尺寸大

    - 安全性较低

    - 用户数量和基站覆盖范围受到限制

    - 无法在 `1G` 网络上进行漫游


    ## 2G – 第二代通信系统


    `2G` 的到来标志着新数字技术的开始。它也被“全球移动通信系统”。`GSM` 技术很快成为无线通信发展的标准。它能够支持高达 `14.4` 到 `64kbps`
    的数据速率。这使得移动设备上有了 `SMS` 和电子邮件服务。


    ### 2G 的特性

    - 支持 `SMS` 服务

    - 使漫游成为可能

    - 网络安全性得到增强

    - 有加密的语音传输

    - 支持互联网，尽管数据速率较低


    ### 2G 的缺点

    - 数据速率非常低

    - 移动性受到限制

    - 特性较少

    - 用户数量仍有限制


    ## 2.5G 和 2.75G 系统


    简而言之，为了支持数据速率，出现了`通用分组数据无线业务`（`GPRS`）。它的数据速率可达约 `171kbps`。随后开发了 `EDGE`。这是“增强型数据
    GSM 演进”，能够提高 `GSM` 网络的数据速率。它的最大速度为 `473.6kbps`。在 `EDGE` 之后，还有 `CDMA200`，它在 `CDMA`
    网络上支持更高的速率。通过这项技术，数据速率攀升至 `384 kbps`。


    ## 3G – 第三代


    这一代网络始于 `UMTS`（“通用移动地面/电信系统”）的引入。这一代能够支持视频通话，因为它以 `384kbps` 的速率运行。是在 `3G` 发布后，智能手机才在全球范围内变得流行。智能手机的设计用于处理多媒体信息、电子邮件、视频通话、游戏、社交媒体和其他高级功能任务。


    ### 3G 的特性

    - 数据速率增加

    - 支持视频通话

    - 安全性增强

    -能够支持移动应用

    - 同时也支持多媒体信息

    - 支持位置跟踪和地图

    - 提供了更好的网页浏览

    - 电视流媒体

    - 支持高质量 3D 游戏


    ## 3.5G 到 3.75 系统


    `3G` 网络随后又有了两次发展。这算是一种演进，因为 `3.5G` 网络能够支持高达 `2mbps` 的数据速率。`3.75` 系统也提供了更快的速度。`3.9G`
    系统的最终发展，也被称为 `LTE`（“长期演进”）。


    ### 3G 的缺点

    - 频谱许可证非常昂贵

    - 基础设施成本极高

    - 需要更高的带宽来提供良好的数据支持

    - 支持它的移动设备非常昂贵


    ## 4G – 第四代


    `4G` 的出现标志着更高速互联网时代的到来。它被称为“全网 IP 化”。`LTE` 技术很快成为移动网络的主流。它能够提供极高的数据速率，这使得高清视频流媒体和在线游戏在移动设备上成为可能。`4G`
    还引入了多输入多输出（MIMO）技术，极大地提升了用户的网络体验。


    ### 4G 的特性

    - 数据速率极快

    - 支持高清视频通话

    - 安全性增强

    - 能够支持复杂的移动应用

    - 支持多媒体信息

    - 支持实时定位和地图

    - 更好的网页浏览体验

    - 4K 视频直播

    - 支持在线游戏


    ### 4G 的缺点

    - 基础设施建设成本高昂

    - 设备价格较高

    - 室内信号可能较弱


    ## 5G – 第五代


    `5G` 的到来标志着万物互联时代的开启。我们正处于一个由超高速 `5G` 连接的世界。`5G` 具有极低的延迟和极高的连接密度。`5G` 能够支持数百万设备同时连接，这改变了工业、医疗和自动驾驶领域。


    ### 5G 的特性

    - 极高的数据速率

    - 极低的延迟

    - 海量设备连接

    - 支持增强现实（AR）和虚拟现实（VR）

    - 工业物联网（IoT）支持


    ### 5G 的缺点

    - 覆盖范围有限（需要更多基站）

    - 设备成本昂贵


