    ## Cisco Packet Tracer


    Cisco Packet Tracer 是由思科设计并实现的一种跨平台可视化仿真工具。该工具允许用户为了创建新的计算机网络而构建拓扑结构。通过该软件，用户可以使用模拟命令行界面来模拟思科制造的路由器以及交换机的配置。Cisco
    Packet Tracer 的用户界面是一种拖放模型。通过这种方式，用户可以根据需要从网络中添加或删除设备。


    该软件主要供思科助理级认证的学生使用。它帮助他们学习 `CCNA` 概念的基础知识。该软件可以在 `Linux`、`Windows` 和 `macOS` 上运行。该应用也适用于
    `iOS` 和 `Android` 设备。思科的系统和工具在重新定义计算机网络并使其变成今天这样起了至关重要的作用。这确立了该公司在该领域的权威地位，使其认证无论出现在什么地方都广受认可。


    ## 第 11 章：有线网络与无线网络的区别


    在本书中，我们广泛探讨了有线网络和无线网络的各个方面。我们已经了所有的组件、用途、应用等。所有这些都已让你了解了这两种计算机网络的所有特征。本节仅仅是为了让你意识到这两个系统分别代表了什么。


    ### 有线网络

    如前所述，只有当网络不存在无线连接的可能性时，才能被称为有线网络。有线网络用于描述涉及使用物理电缆在跨端连接的设备之间传输数据的网络设置。情况下使用的电缆大多由铜制成，可以是双绞线或光纤。有线网络将电信号从一端传输到另一端。在大多数有线网络中，`Ethernet`
    电缆用于在连接的计算机之间传输数据。然而，对于 `Ethernet`，其可达范围非常有限，而且配置也没有像无线网络那样简单。


    ### 无线网络

    对于无线网络，它利用红外和射频来共享信息和资源。这种设计是为了减少确保设备连接所需的资源。它消除了距离和障碍的问题。在无线网络的情况下，完全消除了电缆的使用。如前所述，它利用无线电波。现有的许多设备都使用这种技术：手机、手持设备、卫星接收器、笔记本电脑、`PDAs`
    和无线传感器。


    ### 对比表

    下表列出了计算机网络中涉及的各种参数。


    | 序号 | 参数 | 有线网络 | 无线网络 |

    | :--- | :--- | :--- | :--- |

    | 1 | 安装 | 由于需要的组件较多，安装有线网络比无线网络更困难 | 无线网络的安装较容易 |

    | 2 | 速度和带宽 | 速度非常快 | 速度较低 |

    | 3 | 可靠性 | 由于性能原因，它更可靠 | 可靠性相当高 |

    | 4 | 电缆 | 以太网、铜和光纤 | 使用无线电波和微波工作 |

    | 5 | 移动性 | 连接到有线网络的设备不能轻易移动 | 移动性没有限制 |

    | 6 | 安全性 | 它的安全性非常好 | 安全性弱，网络可能被黑客攻击 |

    | 7 | 干扰 | 有线网络几乎没有经历干扰 | 容易受到高干扰 |

    | 8 | 服务质量 | 与无线网络相比，服务质量更好 | 服务质量较低 |

    | 9 | 设置时间 | 设置花费的时间较短 | 设置和连接组件需要时间 |

    | 10 | 使用设备 | 使用集线器和交换机 | 情况下使用路由器 |

    | 11 | 成本 | 由于电缆更便宜，现在的总安装成本较低 | 随着需求增加，组件价格非常高 |

    | 12 | 应用 | LAN, MAN | WLAN, WPAN (Zigbee, 蓝牙), 红外, 蜂 (GSM, CDMA) |

    | 13 | 标准 | `IEEE802.3` | `IEEE802.11a`, `IEEE802.11b`, `IEEE802.11g` |


    有线网络和无线网络将一直存在，各自适应它们的优势。当然，在无线网络能够在其优势领域有效超越有线网络之前，有线网络将一直存在。


