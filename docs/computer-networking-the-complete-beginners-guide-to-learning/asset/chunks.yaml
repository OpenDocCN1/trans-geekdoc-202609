    \ are; \n\n*   Frequency diversity: This is a form of diversity in which the same\
    \ informational signal gets transmitted on several carriers. In this case, the\
    \ frequency separation between the signals is a minimum of the coherence bandwidth.\
    \ \n\n*   Time diversity: This is a form of diversity in which the informational\
    \ signal is transmitted in sequential intervals. In this case, there should be\
    \ a greater transmit times tan the coherence time. The time interval in this case\
    \ is solely dependent on the fading rate, and this increases with a decrease in\
    \ the fading rate. \n\n*   Polarization diversity: In the case of the polarization\
    \ diversity, the electromagnetic field of the signal bearing the information is\
    \ modified. This leads to an orthogonal type of polarization. \n\n*   Angle diversity:\
    \ In the case of the angle diversity, the directional antennas are used in the\
