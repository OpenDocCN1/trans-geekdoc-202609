    # Deploying a Wireless LAN


    Implementing Wireless networks nowadays is as easy as cheese. It completely topples
    the need to use wires across distances. In deploying wireless technology, the
    very first thing you need to do is to confirm that the standard of wireless networking
    you want. You don''t want to choose any standard, as this it must be able to support
    your network access points, routers and the wireless network interface cards to
    be used for your computers and network resources.


    ## Wide Area Network (WAN)


    This is a geographically distributed private network telecommunication network
    that fosters a connection between two or more Local Area Networks (`LAN`). Remember
    that `LAN` is simply a connection of computers across a relatively small distance.
    However, the `WAN` is a more extensive network. One excellent example is the consideration
    of an enterprise with a headquarters and other branches, as well as some other
    linked facilities. The `WAN` is going to be a connection between the various `LAN`
    established in each of these locations. The connection between different `LANs`
    is fostered by the use of a `router` or a gateway device. `WAN` is mostly used
    across enterprises, and it allows for applications, services, and other centrally
    located resources. Thanks to the `WAN` framework, the need for installation of
    the same application server across different locations of an enterprise, is eliminated.
    Unlike `LAN`, `WAN` is not limited to a particular location. This is because the
    `WAN` is premised on a `LAN`, which can be individually located in different places,
    irrespective of the distance.


    A Virtual Private Network (`VPN`) ensures connection and security on the `WAN`.
    There are different types of `VPNs`, and they are all used in different situations.
    The `IPsec-VPN` is most commonly used for site-to-site connections. Such as the
    one established between the branch office and the headquarters. The `SSL-VPNs`
    is more commonly used, as it allows for remote access for individual access. This
    is possible, having ensured that data from an individual over the network is encrypted.
    Other than these `VPNs`, the linear fiber optic can also be used. This, unlike
    the others, offers better performance, reliability, and security. More often than
    not, enterprises are not able to afford this type of connection.


    ### Types of WAN connections – and how they work


    The `wan` connection can either be wired or wireless. On the wired `WAN` service,
    you can find the multiprotocol label switching, `T1s`, `Carrier Ethernet`, and
    commercial broadband internet links. On the other hand, the wireless `WAN` can
    feature the `4G LTE`, the `5G`, public `Wi-Fi`, and the satellite networks. For
    most enterprises out there, the wired network connection is still the most preferred.
    However, thanks to the `4G` and the `5G`, the wireless connection is gaining traction,
    and it is only a matter of time before the wired connections are out of date.


    The infrastructure needed to run the `WAN` framework can be privately owned, and
    a third party can provide the service. Third parties like telecommunication carrier,
    internet service provider, private IP network operator, and cable provision companies.
    Either a complete owner or shared ownership is possible to operate the Wide Area
    Network.


    For the hybrid `WAN` frameworks, there is a combination of both private and public
    network services. For ease of use and deployment on the part of the enterprises,
    the Software-defined WAN (`SD-WAN`) are being designed. With this framework on
    the ground, enterprises can quickly deploy, operate, and manage their systems.
    Two primary functions can be performed by the software platforms or customer premises
    equipment (`CPE`). These functions are thanks to the combination of virtualization,
    on-site `SD-WAN` devices, network overlays, and application-level policies. These
    functions are:


    - The aggregation of multiple private and public `WAN` links

    - The automatic selection of the most optimal route for traffic, which is based
    on prevalent conditions.


    For the second function to be achieved, network managers have been required to
    manually reconfigure their networks, when they wish to reroute the traffic to
    multiple routes.


    ## WAN Optimization


    Performance in a Wide Area Network can receive a big blow, mainly caused by latency
    and bandwidth constraint. To combat this, there are WAN optimization devices created.
    These devices have several techniques with which they work. These techniques are;
    deduplication, compression, protocol optimization, local caching, and traffic
    shaping. Also, with the `SD-WAN` or `CPE` platforms, you get a higher level of
    performance control. These work by providing lower-cost bandwidth connections.
    This is achieved in the form of the commercial mode of connection to the internet.
    Reliability is also ensured thanks to traffic shaping and tools designed to maintain
    quality of service.


    ## WAN Security


    Security in the `WAN` framework needs to be localized. It should be expanded to
    where the end-users are located. Even if they make use of the network from their
    home. If you are going to make use of the `WAN` network, you need to make use
    of `firewall` and antivirus software. With these, you can prevent unauthorized
    access or hacks by other persons or devices. `VPN` is a system that allows for
    connection to a `WAN`, but it also provides an added layer of encryption, which
    can lead to anonymity. It is best to connect to a `WAN` with the use of a `VPN`.
    Irrespective of where the connection is being made, the use of `CPN` is essential.
    Security needs to be beefed in enterprises, especially if you are involved in
    one. Remember that sometimes ago, a hacker got into Microsoft systems by gaining
    access to an employee’s home computer. This way, he was able to follow the `VPN`
    back to the Microsoft HQ.


    ## Advantages and Disadvantages of the Wide Area Network


    `WAN` is the best way to go for large enterprises and systems. There are several
    benefits to this network of devices, which include:


    - The `WAN` can reach an extensive geographical location

    - It is a centralized infrastructure

    - The security detail is more than the local area network

    - There is an increased span in bandwidth


    The downsides include:


    - It is costly to set up this network

    - The system is very prone to breach and hacks

    - To maintain security on this network, there is the need to spend more on antivirus
    software and firewalls


    ## Metropolitan Area Network (MAN)


    The Metropolitan area network is a somewhat more extensive network than the Local
    Area Network (`LAN`). This network is more significant than the `LAN`, but it
    is not as comprehensive and broad as the `LAN`. In most cases, this involves the
    interconnection of networks within a city, which also provides an internet connection.


    ### Factors that distinguish the Metropolitan Area Network


    Several factors set the `MAN` apart from the other networks:


    - The size of the network ranges from 5 to 50 km. This network represents an area
    as wide as it is on campus, and it could go as wide as a whole city – take New
    York, for example.

    - The rate of data transmission is somewhat fast.

    - In most cases, a user can own a `MAN`, and a network provider can also hold
    it. The network provider, in turn, sells services to users. This is unlike the
    practice in `LAN`, where the service is to one organization.

    - With the `MAN`, sharing regional resources is also possible. Efficiency and
    speed are the main features of the Metropolitan Area Networks. They make use of
    the fiber optic cables. This network system is ideal for many users, as it is
    a medium-sized network. When speed is prioritized in the connection to be built,
    this is the ideal network to be adapted for use.

    '
