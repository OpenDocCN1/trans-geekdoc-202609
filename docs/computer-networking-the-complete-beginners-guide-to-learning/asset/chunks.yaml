    - The communication established between the base station and the `M-ES` is a full
    duplex.

    - Its framework makes use of the `30KHz` channel by current `AMPS/GSM` networks,
    with which it is able to transmit data at a rate of `19.2kbps`.

    - It makes use of the same frequency used by `AMPS`.

    - It also makes use of the `DSMA` technique.

    - This framework offers support for numerous services and can connect to the backbone
    of the internet.


    ## The CDPD architecture

    There are three main interfaces on the `CDPD` network, which are the `E-interface`,
    `I-interface` and the `A-interface`. Basically, the `E-interface` is known to
    exist between the `CDPD` and the fixed network on the outside of the `CDPD`. While
    the `I-interface` is known to exist between one `CDPD` network and another `CDPD`
    network. For the `A-interface`, it fosters a connection between the `BS` and `MS`.
    The `A-interface` can also be called the Air Interface. There are different elements
    used in the `CDPD` architecture:


    - `M-ES`: The function of the `M-ES` is also similar to that of the subscriber
    or mobile unit that any cellular system makes use of. For the `M-ES` to function,
    there is the need for a `SIM` that can be contained in a laptop, mobile or `PDA`.
    It has a function of serving as the interface between radio equipment at a rate
    of `19.2kbps`. The various `M-ES` has its own unique `NEI` (Network Equipment
    Identifier), which is associated with its home `MD-IS`.

    - `MDBS`: The function of this element is similar to that of the Base Station.
    It performs a main function of broadcasting available channels for the `M-ES`.
    This element also manages various radio activities which include channel allocation,
    usage, etc.

    - `MD-IS`: The main function of this element is to foster a connection between
    the internet and `PSDN`. It can also function as a frame relay switch and a packet
    router. The buffering of the various packets is achieved by the `M-ES`. With this
    element, there is also the support for roaming management, because it contains
    registration directory.


    ## Advantages and Disadvantages of CDPD

    There are some pros and cons to the use of `CDPD`.


    ### Pros

    - The very first advantage is that it can make use of existing channels that are
    on the `AMPS` network. This makes it very easy to install and use.

    - The architecture is like that of the cellular, which causes it to support larger
    capacity. It can offer this much support because it can be easily upgraded.

    - Also, when there is the need to establish a data call, there is no lag. The
    lag is eliminated because the `CDPD` phone is already registered on the `CDPD`
    network.


    ### Cons

    - For the `CDPD` network, there is no mesh connection. Due to this, there is a
    lack of a direct communication between two `M-ES`.

    - Also, there is a limitation on the `CDPD` cell size to about 10 miles.


    ## I-MODE

    Have you ever heard of what is referred to as the `I-MODE`. It was somewhat of
    a miniature internet, operated right out of Japan. The service was offered by
    `DoCoMo`, and it can be easily accessed directly via a menu on the `I-Mode`-Compatible
    devices. It makes use of the `DoCoMo` packet-switched technology, and this brings
    about an ‘always on’.


    ## Chapter 6: Wireless Technologies

    If there is anything the wireless technology has achieved for us, it is effectiveness
    in communication. Without the need for wired connections, you can reach anyone,
    anywhere they are. As simply put, wireless communication is a system of data communication
    which is executed without a wired connection. This term in itself is a very broad
    one. It involves all the procedures and types of connection that can be fostered
    between two or more devices via wireless signals.


    ### Basic components of the wireless systems

    There are three basic components of the wireless systems. These elements are the
    `transmitters`, the `channel` and the `receiver`.


    #### Transmission path

    The transmission path of the wireless communication system is comprised of the
    `encoder`, `encryption`, and `modulation` and `multiplexing`. Whenever there is
    a signal from the source, it is transmitted through a `source encoder`. This then
    converts the signal into a suitable form that can be used in various signal processing
    techniques. When the encoding is done, whichever information is left is subsequently
    removed, resulting in an optimal resource utilization. The signal resulting from
    the encoding is then subjected to an `encryption standard`. This encryption causes
    the information and its signal to remain protected and secured from unauthorized
    personnel. One of the very popular encoding techniques to use is the `channel
    encoding`. This causes the signal to suffer from reduced noise impairments and
    interference. When the channel encoding is being carried out, a level of redundancy
    is introduced to the signal. This causes the signal to be robust against. There
    is then the subsequent modulation of the signal with a suitable modulation technique.
    When all these are done, the signal can be easily transmitted over an antenna.
    Subsequent to modulation, multiplexing is carried out. There are various multiplexing
    techniques, which are; `Time Division Multiplexing (TDM)`, `Frequency Division
    Multiplexing (FDM)`. Multiplexing is important, as it leads to the sharing of
    a valuable bandwidth.


    #### Channel

    Talking about channels, these refer to the medium of transmission used in wireless
    communication. One very important fact to note about the channel is that it is
    very unpredictable and the details can change any minute. This makes it somewhat
    being defined as unstable. It is prone to interference, distortion, noise, and
    scattering. All these ultimately lead to a received signal that is filled with
    errors.

