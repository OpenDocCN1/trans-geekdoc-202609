    \ of use with routers. It can also allow for many nodes to be interconnected with\
    \ each other. This way, a wider area network is built.\n\n## The Zigbee Architecture\n\
    \nThe system structure of Zigbee consists of three different devices, which are\
    \ the `Zigbee coordinators`, `router` and the `end device`. In every Zigbee network,\
    \ there must be the presence of at least one `Zigbee coordinator`. This coordinator\
    \ acts as the root and bridge of the network. It is also responsible for the handling\
    \ and storing of information whenever there is the reception and transmission\
    \ of data over the network. The routers in this case act as the intermediate that\
    \ moderates the passage of data to and fro a device to another. For end devices,\
    \ they have a limited functionality which is just to communicate with the parent\
    \ nodes.\n\nIn the Zigbee wireless communication network, the number of coordination,\
    \ router or end device involved is always dependent on the type of network being\
    \ established. There are different network types, which are star, tree and mesh.\
    \ In the Zigbee wireless communication architecture, there are different layers:\n\
    \n*   **Physical layer**: This layer is responsible for modulation and demodulation\
    \ whenever there is a transmission and reception of signals on the network.\n\
    *   **MAC (Medium access) layer**: This layer is one which takes the responsibility\
    \ of reliably transmitting data by gaining access to several network on the `Carrier\
    \ Sense Multiple Access Collision Avoidance (CSMA)`. The `MAC` layer is also responsible\
    \ for the transmission of beacon frames for synchronization communication.\n*\
    \   **Network layer**: The network layer is the one responsible for all network\
    \ related operations like network setup, routing, end device connection and disconnection\
    \ to network.\n*   **Application Support Sub-layer**: The application layer is\
    \ one which enables the various services that are necessary for interfacing between\
    \ the Zigbee device object and application objects and network layers for the\
    \ purpose of data management. The application layer support sub layer is responsible\
    \ for the merging of devices based on specified services and needs.\n*   **Application\
    \ framework**: The framework layer has two data service types which act as the\
    \ key value pair and the generic message services.\n"
