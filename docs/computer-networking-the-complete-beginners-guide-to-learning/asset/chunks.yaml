    ## Cisco Packet Tracer


    Cisco Packet Tracer Tracer is a cross-platform visual simulation tool that was
    brought into design and implementation by Cisco. This tool allows users to create
    network topologies, in the bid of creating new computer networks. With this software,
    users can use a simulated command line interface to simulate the configuration
    of routers made by Cisco, as well as switches. The user interface for Cisco packet
    tracer is sort of a drag and drop model. This way, users, can add or remove devices
    from the network, as they deem fit.


    This software is mainly used by students of the associate level certifications
    by Cisco. It helped them learn the very basics of the `CCNA` concepts. This software
    can be run on the `Linux`, `Windows` and `macOS`. The app is also available on
    both `iOS` and `Android` devices. The Cisco system and tools have been very instrumental
    in redefining computer networking, and making it what it is today. This has established
    the company as an authority in the field, making their certification recognizable
    wherever it is presented.


    ## Chapter 11: Differences Between Wired and Wireless Networks


    In the course of this book, we have looked extensively at the various aspects
    of the wired and wireless networks. We have seen all the components, the uses,
    the applications, etc. All these are sure to have exposed you to all that the
    two types of computer networking are. This section is simply to bring your mind
    to the consciousness of what the two systems stand for.


    ### Wired networks

    As said earlier, a network can only be called wired if there is the possibility
    of a wireless of it being wireless. Wired networks is used in the description
    of network setups which involve the use of physical cables in the transfer of
    data between devices connected across ends. The cables used in this case are mostly
    made of copper, and can be a twisted or a fiber optic. The wired networks convey
    electrical signals from one end to the other. In most of the wired networks, `Ethernet`
    cables are used in the transfer of data between computers connected one to another.
    However, for `Ethernet`, the range it can reach is very limited, and the configuration
    is also not as easy as that of the wireless networks.


    ### Wireless networks

    For the wireless networks, it makes use of infrared and radio frequency in the
    sharing of information as well as resources. This design was borne out of the
    need to cut down on what is needed to ensure connection of devices. It has eliminated
    the problem of distance and obstacles. There is a total elimination of the use
    of wires in the case of the wireless networks. As said earlier, it makes use of
    radio waves. Many devices in existence today make use of this technology; cellular,
    handhelds, satellite receivers, laptops, `PDAs` and wireless sensors.


    ### Table of Comparison

    The table below outlines the various parameters involved in computer networking.


    | s/n | Parameters | Wired Network | Wireless Network |

    | :--- | :--- | :--- | :--- |

    | 1 | Installation | It is more difficult to install the wired network than it
    is for the wireless network due to number of components needed. | Installation
    is easier for the wireless network |

    | 2 | Speed and Bandwidth | It has a very high speed | It has a lower speed |

    | 3 | Reliability | It is more reliable due to performance | Reliability is reasonably
    high |

    | 4 | Cables | Ethernet, copper and optical fibers | It works with radio waves
    and microwaves |

    | 5 | Mobility | Devices connected to on the wired network cannot be moved around
    easily | There is no limitation to its mobility |

    | 6 | Security | It has a really good security | Security is weak and network
    can be compromised by hackers |

    | 7 | Interference | There is next to no interference experienced with the wired
    networks | It is prone to high interference |

    | 8 | Quality of service | The quality of service is better as compared to the
    wireless networks | Quality of service is low |

    | 9 | Setup time | Setup takes less time | Setting up and connecting the components
    takes time |

    | 10 | Devices used | Hubs and switches are used | Routers are used in this case
    |

    | 11 | Cost | The total cost of installation are now lower, since cables are cheaper
    | Since there is an increase in demand, the prices of components are very high.
    |

    | 12 | Applications | LAN, MAN | WLAN, WPAN (Zigbee, Bluetooth), Infrared, Cellular
    (GSM, CDMA) |

    | 13 | Standards | `IEEE802.3` | `IEEE802.11a`, `IEEE802.11b`, `IEEE802.11g` |


    The wired and wireless networks will persist, with each adapted to their strengths.
    Of course, till the wireless networks can effectively surpass the wired networks
    in areas of its strength, there will always be the wired networks.

