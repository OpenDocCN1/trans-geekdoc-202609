    # Applications of UDP


    There are several areas where `UDP` is used in the transmission of data, and these
    are:

    - Domain Name Services

    - Simple Network Management Protocol

    - Trivial File Transfer Protocol

    - Routing informational protocol

    - Kerberos


    The systems in which `UDP` is used in data transfer are however not limited to
    these.


    ## Wireless Network Protocols


    In most cases, wireless networks are mistaken to be Wi-Fi networks. But as established
    earlier in this book, `Wi-Fi` is different from wireless communication technology.
    Wireless network protocols are proven to be of immense use in consumer devices.


    ### LTE

    The `LTE` technology has a design which enhances data rates as well as other problems
    experienced in old phone protocols, such as roaming problems. On this protocol,
    rate reaches up to about 100 Mbps. However good this technology may be, there
    is still a limitation as the phone carriers are not deployed in some areas. This
    lack of phone carriers is due to high cost of installation and government regulations.
    `LTE` technology however is not designed to support home and `LAN` networks, but
    designed to support consumers in longer distances.


    ### Wi-Fi

    We have discussed the whole concept of `Wi-Fi` earlier in this book. Well, the
    technology has become the default connection technology employed in homes, offices
    and other personal areas. The technology became popular in the late 1990s. There
    are cases in which the technology can be controlled to travel over longer distance.
    But in most cases, they are best suited for more personal and home use. `WI-Fi`
    actually has the protected access security protocols which adds a level of authentication
    to the network, as well as data encryption. This access technology is mainly to
    prevent third party from having access to the network or mining personal data.


    ### Bluetooth

    This is one of the most popular wireless technology in the world. It was created
    in the 1990s and it has risen to become ubiquitous. Unlike the `Wi-Fi`, just a
    minimal amount of power is needed to run the `Bluetooth` effectively. Hence, `Bluetooth`
    is designed to only travel shorter distances when compared to the `Wi-Fi`. In
    many equipment, `Bluetooth` has been replaced by `WI-Fi`.


    ### 60 GHz Protocols – WirelessHD and WiGig

    Video streaming has become a very popular activity to engage in on the personal
    computer. This has necessitated a wireless network protocol that can better support
    it. These were created in the 2000s to offer high definition streams.


    ### Wireless Home Automation Protocols – Z – Wave and Zigbee

    These are wireless protocols designed for home automation. They are designed to
    make use of low energy consumption.


    ## Network Routing Protocols


    Ever heard something called the routing protocol, and you just wonder what that
    is? It’s pretty simple. A routing protocol makes use of software and some routing
    algorithms to determine the best mode of transfer of data and information between
    nodes. The main functions of the routing protocols are to create a router communication,
    as well as an overall network topology understanding. In some cases, the routing
    protocol is also referred to as the routing policy. In a bid to foster a more
    effective communication between computers, the routing protocols have been developed
    and innovated over time. The working of the routing protocol is pretty simple:


    - **Discovery**: The process of identifying other routers situated on the network

    - **Route management**: Keep tabs on the various potential destination on a network

    - **Path determination**: This is the process in which the protocol makes a decision
    on where it should send the network message.

    '
  trans: '


    # UDP 的应用


    `UDP` 在数据传输中被应用于多个领域，这些包括：

    - 域名服务 (DNS)

    - 简单网络管理协议 (SNMP)

    - 简单文件传输协议 (TFTP)

    - 路由信息协议 (RIP)

    - Kerberos


    然而，使用 `UDP` 进行数据传输的系统不仅限于这些。


    ## 无线网络协议


    在大多数情况下，无线网络被误认为是 Wi-Fi 网络。但正如本书早期建立的，`Wi-Fi` 与无线通信技术是不同的。事实证明，无线网络协议在消费级设备中具有巨大的用途。


    ### LTE

    `LTE` 技术的设计增强了数据传输速率，并解决了旧手机协议中遇到的其他问题，例如漫游问题。在该协议上，速率可约 100 Mbps。然而，无论这项技术有多优秀，由于手机运营商在某些地区尚未部署，仍然存在局限性。这种运营商的缺失由于安装成本高昂以及政府监管。然而，`LTE`
    技术并非为支持家庭和 `LAN` 网络设计的，而是为了支持远距离的消费者。


    ### Wi-Fi

    我们在本书之前已经讨论过 `Wi-Fi` 的整个概念。这项技术已成为家庭、办公室和其他个人区域采用默认连接技术。该技术在 20 世纪 90 年代流行起来。在某些情况下，该技术可以被控制进行更距离的传输。但在大多数情况下，它们最适合个人和家庭使用。`WI-Fi`
    实际上具有受保护的访问安全协议，这为网络增加了一层身份验证以及数据加密。这种访问技术主要为了防止第三方访问网络或挖掘个人数据。


    ### 蓝牙

    这是世界上最流行的无线技术之一。它创建于 20 世纪 90 年代，并已无处不在。与 `Wi-Fi` 不同，运行 `Bluetooth` 只需要极小的功率。因此，与
    `Wi-Fi` 相比，`Bluetooth` 设计为仅传输短距离。在许多设备中，`Bluetooth` 已经被 `WI-Fi` 取代。


    ### 60 GHz 协议 – WirelessHD 和 WiGig

    视频流媒体已成为个人电脑上一项非常流行的活动。这需要一种能够更好地支持它的无线网络协议。这些协议创建于 20 世纪 20 年代，旨在提供高清流媒体。


    ### 无线家庭自动化协议 – Z-Wave 和 Zigbee

    这些是为家庭自动化设计的无线协议。它们的设计旨在利用低功耗特性。


    ## 网络路由协议


    是否听过所谓的路由协议，并对此好奇它到底是什么？其实非常简单。路由协议利用软件和某些路由算法来确定节点之间数据和信息的最佳传输模式。路由协议的主要功能是建立路由器通信，以及对整个网络拓扑结构的理解。在某些情况下，路由协议也被称为路由策略。为了促进计算机之间更有效的通信，路由协议随着时间的推移不断开发和创新。路由协议的工作非常简单：


    - **发现**：识别网络上其他路由器的过程

    - **路由管理**：跟踪网络上的各种潜在目的地

    - **路径确定**：这是协议对应该将网络消息发送到何处做出决策。


    '
