    # Chapter 13: Internet of Things


    Even if you weren’t vying to find your way into computer networking, you will
    most likely have heard of internet of things. The term has become so common, that
    virtually everyone that uses the internet have heard of it. Well, there are many
    of these people that remain in the oblivion of what the concept really is about.
    Various areas of life can be influenced with `IoT`, the boundaries are just limitless.
    There is so much we can achieve with `IoT`, and we would be talking about some
    of these in this brief chapter. If the coffee you got at the start of this book
    is exhausted, you should probably get more. Though, this isn’t going to be a long
    boring read.


    ## What exactly is Internet of things?


    There is a simple definition to what the internet of things is. It is simply a
    description of the situation in which billions of devices in the world have access
    to the internet. These devices are connected to the internet, with the sole aims
    of collecting and sharing data. This ability of easily connecting physical devices
    to the internet is powered by cheap processors and wireless networks. Remember
    that in this book we spoke about wireless networks and `IoT`? Normally, these
    devices would have been termed “dumb,” but now, they are smart. That is the extent
    to which `IoT` can revolutionize our lives.


    Just about any device out there can be connected to the internet. In fact, a whiz
    kid was able to connect a teddy bear to his computer, just because the bear had
    a system of recorded voice playing over an in-built speaker. Through the `IoT`
    concept, he was able to connect to the bear, and whatever voice he recorded through
    the microphone on his computer was played on the bear. This process bypassed what
    had been pre-programmed on the computer.


    Another example. If you can switch on the light bulb in your house, just by using
    your smartphone that has an installed app, then it’s an `IoT` system. `IoT` can
    seem simple, like the pretty basic stuff. But, if the toys we have interacting
    with us are results of `IoT`, you should also know that a driverless autonomous
    truck functions based on `IoT`.


    ## How does it work?


    The functioning of `IoT` is very easy to understand. It functions by the sensors
    incorporated into the devices, which is able to connect to the internet, with
    the aim of integrating data from different devices, subject it to analysis and
    apply such information in solving local problems or performing tasks. With the
    `IoT` devices, it is very easy to pinpoint what is useful and what is not. This
    way, patterns can be detected, recommendations can be made, and problems can be
    solved.


    Having devices connected is a really great way of enhancing efficiency, and cutting
    down on accidents. Imagine if all cars can connect to one another when they are
    in certain range of each other, and if you are almost hit a car, the car can warn
    you that a car is fast coming just around the bend. That’s pretty amazing. With
    information devices get from other devices they are connected to, they make smart
    decisions, which is one of the aims of technology. Right? This tech is getting
    bigger than it was some years ago. In fact, in 2017, it was reported by Gartner
    that about 8.4 billion `IoT` devices were used in the world. There is estimation
    that this will be at 20.4 billion in 2020. The total spending on `IoT` amounted
    to `$2trillion as of 2017. This is expected, with smart TVs and smart speakers
    being the main gadgets used in homes now.


    ## Applications


    There are several ways in which one can make use of the `IoT`. It is more than
    likely that you have used an `IoT` powered device and you just don’t know. Let’s
    take a look at some utilities that are being influenced by `IoT`. Notice I said
    “that are being.” This is because `IoT` is real, as of now. It’s not a concept
    of the future. I’m sure you know this anyways.


    ### Internet of things and homes


    This is one area that I’m pretty sure you have had a taste of `IoT`. If you have
    an `Alexa` powered home device, then you are on an `IoT` framework. This is such
    a promising area, such that big tech companies like Amazon, Google, Apple and
    Facebook are competing hard. Anyways, as of now, Amazon holds the forte in the
    design of smartphones. There are several products in this light. Like the `Amazon
    echo`, the smart fridge, light bulbs, cameras, thermostats, etc. You can interact
    with all these devices without even having to be close to them.


    ### Internet of things and smart cities


    With the spread of censors just about every nook and cranny of a city, it is possible
    for government to know what is going on anywhere, in real-time. This is one of
    the key way in which `IoT` will be of really great advantage, in the near future.
    With the different types of censors that can be deployed, such as cameras, environmental
    censors, etc. it becomes very easy to monitor what is going on in cities and know
    just how to respond in real time.


    ### Internet of things and artificial intelligence


    There is a single power to `IoT`, which is data. The framework has access to a
    large array of data. When all these data are collected in real time from different
    sources, and astutely analyzed, they can be used to make decisions that save lives.
    This is where artificial intelligence comes in. `IoT` collects the data, store
    it, analyze it, then feed it to the `A`. When `AI` received this information from
    `IoT`, it uses it to make predictions. One example of companies that extensively
    make use of this framework is `Google`. Oh, how I love that company. They hire
    the best people, and I love them for it. How then does `Google` combine the use
    of `IoT` and `AI`? It’s pretty simple. The `AI` is used to manage the cooling
    system of the company’s data center. In all tech companies, there are large space
    where data is stored in physical structures. In this data center, there are thousands
    of sensors.


    ## Internet of things: Security and Privacy


    One of the biggest issue with `IoT`, right now, is security. Privacy is all about
    the protection of data, either in the form of video, audio and text.

    '
