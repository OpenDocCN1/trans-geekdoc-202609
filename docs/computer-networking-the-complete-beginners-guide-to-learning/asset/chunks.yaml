    \ \n\nChapter 1: Types of Computer Networking The introductory part of this book\
    \ has seen us adequately describe what we mean by Computer Networking. We also\
    \ took an in-depth dive into the various components that are essential to the\
    \ computer network. We took a look at bridges and topologies, all of which are\
    \ vital to Computer Networking. It is a giant network of devices, which fosters\
    \ communication. These connections are also categorized, and these classes are\
    \ culled based on size, distance, and structure. We would take these different\
    \ network types in sequence, reaching deep into what each entails. Sit back, have\
    \ a cup of coffee close to you, enjoy. Local Area Network (LAN) You must have\
    \ heard of this somewhere, and if you haven’t, you have been informed. Local Area\
    \ Networks are simply a connection of computer systems and devices, spanning a\
    \ small area. More often than not, you will see a LAN connected just across a\
    \ room, building or group of buildings, Beyond the small area of connection, one\
    \ LAN can be connected to another through telephone lines and radio waves. When\
    \ this connection is however made, it takes away the moniker \"Local Area Network,\"\
    \ taking up \"Wide Area Network.\" This is the fundamental difference between\
    \ a LAN and the WAN. WAN extends over a more extensive distance, and it comprises\
    \ of more than one Local Area Network.  Nodes of a LAN Don't be mistaken between\
    \ a LAN and the WAN. LAN is merely a connection between workstations and personal\
    \ computers. In the Local Area Network, each node (which is the computer) has\
    \ a CPU. This CPU is then used to execute programs, and it also has an extended\
    \ function of accessing data and devices on other parts of the network. With the\
    \ Local Area Network, tools and data can be shared seamlessly. Imagine a scenario\
    \ in which you have more than one computer in your business space, but as a startup,\
    \ you cannot afford to buy more than one colored printer. Thanks to LAN, you can\
    \ share the colored printer across all the computers. Via the LAN, users can also\
    \ communicate with themselves. The LAN permits users to engage in chat sessions\
    \ or send emails. You must have seen this in high school movies where the guy\
    \ messages the girl via the school's computers, during a practical computer session.\
    \ That is the Local Area Network at work. On the LAN, data can be transmitted\
    \ at lightning speed, way faster than data can be sent on telephone lines. LAN\
    \ is fast, there is no doubt about that, but you should know this is dependent\
    \ on the distance we are talking about. Another factor that can affect this speed\
    \ is the number of the computer on the LAN. Types of a Local Area Network Local\
    \ Area Networks are of frequent use, but the Ethernet is the most popular one.\
    \ The Macintosh Computers by Apple have an AppleTalk Network System built into\
    \ them. This creates the Apple Macintosh Networks. As a statement of fact, LAN\
    \ differs, and this difference is based on these characteristics. \n\n*   Topology:\
    \ This has been described earlier as the way devices on a network are arranged.\
    \ The various systems are explicitly defined in the introductory part of this\
    \ book.  \n\n*   Protocols: We would get more in-depth about protocols in the\
    \ latter part of this book. They are the set of rules and encoding specifications\
    \ that are followed for the transfer of data. These protocols are designed to\
    \ determine whether a network makes use of the peer-to-peer or client/server architecture.\
    \ The peer-to-peer and client/server architectures are also further explained\
    \ in this text. \n\n*   Media: This refers to the medium in which the devices\
    \ are being connected. Twisted-pair wires, coaxial cables, or fiber optic cables\
    \ can be used. However, you should note that some Local Area Network no longer\
    \ makes use of the cables, but make use of radio waves. "
