    \ to offer real time processing, but it is close. In the case of virtual assistants,\
    \ assistants like `Google assistant` are optimized to offer real time processing.\n\
    \n## Fundamentals of Data Communication\n\nCommunication is a basic need of life.\
    \ Life scientists refer to us as social animals (though I prefer to be called\
    \ a social being), and this means we need to reach out to one another. Communication\
    \ technologies over the years has helped us maximize this. It has enhanced the\
    \ way, speed and quality of how we reach out to ourselves. There are four fundamentals\
    \ that data communications stick to.\n\n* **Delivery**: This is the concept which\
    \ dictates that every data communication system is able to deliver data to the\
    \ right destination, at every instance. The data sent out must always be received\
    \ by the intended recipient.\n* **Accuracy**: There must be no loss of components\
    \ in the data being sent. It must be delivered accurately. This is because data\
    \ been altered during transmission without correction, is rendered unusable.\n\
    * **Timeliness**: Real-time is the standard. Data being sent should be delivered\
    \ as timely as possible. When data is delivered late, it becomes useless. When\
    \ it comes to video and audio, timeliness means having the data delivered as soon\
    \ as it is produced. The data should be delivered as soon as it is produced, in\
    \ the order in which it was produced, and without delay. This is what we refer\
    \ to as real-time data transmission.\n* **Jitter**: The word jitter is used in\
    \ referring to variation in the arrival time of data packets. This is most experienced\
    \ when video is to be delivered. In this case, there is a variation in the delivery\
    \ of the audio packets of the data, against the video packets. Jitter can also\
    \ occur in a particular format. Such that, in a video transmission, some parts\
    \ of the video may arrive at `3D-ms`, while others lag and arrive at `4D-ms`.\
    \ This causes a disruption in the video quality.\n\n## Public Switched Network\
    \ (PSTN)\n\n`PSTN` is a of an interconnected telephone line network, which is\
    \ co-owned by government and private owners. This network system actually has\
    \ been in use from the 1800s, and it made use of underground copper wires. The\
    \ use of these over the last decade has been on a decline, as wireless communication\
    \ takes over the world.\n\n Properties of PSTN\n* It is also termed the Plain\
    \ Telephone Service (`POTS`).\n* The concept evolved from the invention of the\
    \ telephone by `Graham Bell`.\n* It has the main function of transferring voice\
    \ in relatable form.\n* It is a combination of several circuit-switched across\
    \ the world.\n* It started by laying copper across the whole area it covered,\
    \ it has evolved from that.\n\nCommunication of information, news and other events\
    \ has become easier over the past decade. Engineers, researchers, developers and\
    \ many other technically-oriented personnel has worked assiduously in ensuring\
    \ that the world is connected. The cellular networks are a revolutionary breakthrough,\
    \ and it has changed the way things operated in the world. Imagine how hard it\
    \ would be, if to reach out to a relative in Australia, we still needed to send\
    \ a letter from America, then wait for a response, before sending a follow up.\
    \ It would take years to complete quite a handful of conversations. Communication\
    \ networks are used extensively in the world of today. It is used in communicating\
    \ with astronauts in space, planes in airfields, ships in the middle of the sea,\
    \ etc.\n"
