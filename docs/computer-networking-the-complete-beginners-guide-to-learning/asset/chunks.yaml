    You don’t want your system to be compromised by a zero-day attack. It can be an
    extensive damage to your data and computer. When it comes to securing your computer,
    you need to be proactive. You need to get premium anti-virus and anti-spyware
    installed on your system. Also, whenever your legitimate anti-virus software needs
    an update, you need to do it immediately. This is because the update will protect
    your system from new and current vices, that the older version may not be able
    to protect you again. Here are some tips of what you should be doing to protect
    you from zero-day attacks:


    * Make sure your software and security patches are up to date. You can ensure
    this by downloading the latest software.

    * Analyze your online habit, and make sure you are safe and secure.

    * Make sure your security setting is configured to optimize your OS, the browser
    and your security software.

    * Get premium security software for maximum protection.


    ## Hacker Attacks


    I’m sure you are not new to what we refer to as cyber-attacks. That’s most likely
    the fantasy of every kid who hold a computer and writes code in one language or
    the other. With the legendary hoodie, cyber-attacks are launched to compromise
    the system. The extent to which the attack goes is all dependent on the size of
    the bot network. The wider the network, the more impactful the attack will be
    on the target. With the use of this system of hacking, the gain is mainly financial
    gains, or just the undermining of activities on the internet. The botmasters control
    the bot army, and they bombard the target website, the traffic causes the website
    to shut down and stop functioning. This makes it impossible for legitimate users
    to access the network. This is a form of DOS or DDOS.


    ### Types of cyber-attacks


    These methods include: `malware`, `phishing`, `denial of service`, `man-in-the-middle`,
    `credential reuse`, and `cross-scripting`.


    ## Credential Reuse


    There are so many sites we want to access, and we use the same password. This
    is not a security practice, but it is very handy for people who have difficulty
    de-ing different passwords. You don’t need to worry about remembering all various
    passwords. You can make use of a password manager.


    ## Cross-site scripting (XSS)


    This attack is similar to SQL injection attack. In this attack, the criminal sources
    for several codes and injects them into a website. However, this codes are not
    targeted at the database of the website, they simply run on the browser of the
    user. On that website, scripts that can automatically run are targeted, such as
    the comment section. For example, a malicious JavaScript can be written in the
    comment section. This places the information of the user risk, hence, undermining
    the credibility of the website.


    ## Botnet


    In the world of computer networks, botnets have proven to be of great threat and
    the number one issues of security systems. Once devices are interconnected, the
    probability that they can be infiltrated by botnets is very high.


    ### How do they work?


    The name is coined from two words, “robot” and “network”. They are simply a network
    of robots that coordinated to perform comprising activities on the web. The administrators
    of these attacks with the botnets are referred to as Botmasters or bot herders


    ### Botnet infection features


    * They don’t attack just one computer, they can be deployed to infect millions
    of computers.

    * They are mainly deployed through the Trojan Horse virus.

    * They can easily access and modify user’ personal information.

    * The more complex forms of the botnets are capable of self-propagating.

    * They are very difficult to detect.

    * They take their time to steadily infiltrate a system, just waiting for the botmaster
    to issue a command.

    '
  trans: '


    ## 间谍软件方法


    *   **路过下载 (Drive-by download)**：这是你访问的网站或弹出窗口突然想要在你的计算机上下载并安装间谍软件的过程。某些情况下，你会收到针对此类操作的警告，这说明你的安全系统比较先进；如果你没有强大的安全系统，你甚至不会收到任何警告。

    *   **搭带软件安装 (Piggybacked software installation)**：这是某些应用程序在安装过程中，会将间谍软件作为标准程序的一部分进行安装。如果你不留神，最终将安装其他你预料之外的软件。

    *   **浏览器插件 (Browser add-on)**：这些软件以为你的网络浏览器添加插件而闻名。除了承诺的功能外，它们还会执行其他操作。在某些情况下，它们仅仅是执行了进入系统的木马程序。

    *   **伪装 (Masquerades)**：在所有的间谍软件渗透程序中，这种是最致命的。它们向你证明它是设计用来帮助你移除间谍软件的。当你安装它来执行它声称的功能时，它会添加其他损坏计算机的间谍软件。


    ## 零小时与零日攻击


    除了病毒和间谍软件之外，还有其他安全问题。其中之一就是零日漏洞（或零小时攻击）。这是软件安全中的一个缺陷，开发者已经意识到该问题，但还没有相应的补丁或软件来修复该漏洞。在这种情况下，间隙可以被黑客利用。这被称为软件漏洞，它们是出现在软件程序或计算机操作系统中的缺陷。这些漏洞可能是由于计算机系统的配置不当导致的。如果不能轻易纠正，就会给黑客留出操作和破坏系统的时间范围。在零日攻击的情况下，漏洞刚刚被发现。在这种情况下，没有补丁可以解决问题。他们将这种情况称为“零日”，因为开发者没有时间准备应对攻击，即“零天”。当这一问题进入主流视野时，服务提供商需要找到立即解决方案，以平息用户的恐慌并保持系统免受黑客的侵害。


    ### 如何保护你的系统免受零日攻击


    你不希望你的系统被零日攻击攻破。这会对你的数据和计算机造成巨大的损害。在保护计算机安全方面，你需要采取主动措施。你需要在你的系统上安装高级的反病毒和反间谍软件。此外，每当你的正版防病毒软件需要更新时，你都需要立即进行更新。这是因为更新将保护你的系统免受新的和当前的威胁，而旧版本可能无法再次保护你。以下是你为了保护自己免受零日攻击应该采取建议：


    *   确保你的软件和安全补丁都是最新的。你可以通过下载最新软件来确保这一点。

    *   分析你的在线习惯，确保你是安全的。

    *   确保你的安全设置已配置妥，以优化你的操作系统、浏览器和安全软件。

    *   获取高级安全软件以获得最大的保护。


    ## 黑客攻击


    我确定你对我们所说的网络攻击并不陌生。这可能是每个拿着计算机并用一种或另一种语言编写代码的孩子的幻想。带着传奇的连帽衫，网络攻击被发起以破坏系统。攻击的程度完全取决于僵尸网络的大小。网络越大，攻击对目标的影响就越大。通过使用这种黑客系统，获得的主要是利益，或者只是破坏互联网上的活动。僵尸大师控制着僵尸军队，他们轰炸目标网站，流量导致网站关闭并停止运行。这使得合法用户无法访问网络。这是拒绝服务（DOS）或分布式拒绝服务（DDOS）的一种形式。


    ### 网络攻击类型


    这些方法包括：`malware`（恶意软件）、`phishing`（钓鱼攻击）、`denial of service`（拒绝服务）、`man-in-the-middle`（中间人攻击）、`credential
    reuse`（密码重用）和`cross-scripting`（跨脚本）。


    ## 密码重用


    我们想要访问的网站有很多，但我们使用相同的密码。但这对于难以记住不同密码的人来说非常方便。你不需要担心记住各种密码。你可以利用密码管理器。


    ## 跨站脚本 (XSS)


    这种攻击类似于 SQL 注入攻击。在这种攻击中，犯罪分子获取几种代码并将其注入网站。然而，这些代码并不是针对网站数据库的，它们只是运行在用户的浏览器上。在那个网站上，它们针对的是可以自动运行的脚本，例如评论区域。例如，可以在评论区域中编写一段恶意的
    JavaScript。这使用户的信息面临风险，从而损害了网站的信誉。


    ## 僵尸网络


    在计算机网络世界中，僵尸网络已被证明是巨大的威胁和安全系统的首要问题。一旦设备相互连接，它们被僵尸网络渗透的可能性非常高。


    ### 它们是如何工作的？


    这个名字是由两个词组合而成的，“机器人”（robot）和“网络”（network）。它们简单来说协调在互联网上执行破坏活动的机器人网络。这些使用僵尸网络攻击的管理员被称为僵尸大师（Botmasters）或僵尸牧羊人（bot
    herders）。


    ### 僵尸感染特征


    *   它们不只攻击一台计算机，可以部署感染数百万台计算机。

    *   它们主要通过木马病毒部署。

    *   它们可以轻松访问并修改用户的个人信息。

    *   更复杂的僵尸网络具有自我传播的能力。

    *   它们很难被检测到。

    *   它们花时间稳定地渗透系统，等待僵尸大师发布命令。


    '
