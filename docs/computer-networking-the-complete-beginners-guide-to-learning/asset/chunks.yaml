    # Chapter 10: Wireless Network Technology and its Utilities


    Wireless Network Technologies has so many principles which aids implementation,
    and this is a pretty wide area of computer networking concept. It is the wireless
    network technologies that has made it possible for wireless network to be adopted
    to various devices, and for different uses. These technologies have been adapted
    for use, both at home and in different business networks. Wireless network has
    come with both its upside and downside, just like any other technology out there.
    In the course of this book, we have tried to establish the fact that wireless
    network is what has made the world better than it used to. We need wireless networks,
    irrespective of the limitations it suffers. �There are several technologies put
    in place to make wireless networks possible, and those are what we will be examining
    in this chapter of the book.


    ## What is CISCO systems?


    You probably must have heard of `CISCO` in the computer networking world (that’s
    if you are not a novice – consumers only). Cisco systems, Inc. is one of the leading
    networking company in the world. The company started by the couple, Sandy Lerner
    and Len Bosack in 1984, is best known for being the leading manufacturer and seller
    of different networking equipment. Products from the company are however not limited
    to hardware, they also make software products and devices related to them. Through
    its years of operation, the company has focused on providing software and other
    services based on the Internet Protocol (`IP`). They also focused on products
    for routing and switching. They also focus on other technologies used extensively
    for home networking, `IP` telephony, optical networking, security, storage area
    networking and wireless technology.


    The couple who met at Stanford University are since divorced, but the first product
    developed by their company had been the AGSS router, developed by Bosack and Kirk
    Lougheed. The various applications and products developed by Cisco are all adaptable
    for tablets, mobile phones, desktop virtualization and many more. The company
    as a whole makes provision of security services and products. These features are
    known to offer network, identity, and security to contents. These tools have been
    in effective in helping clients reduce the theft of their data. With the various
    tools, clients are also able to work in a collaborative and cloud-enabled environment.


    The market of Cisco had been greatly competed by the likes of HP, Avaya, Juniper,
    etc. But the company has been able to ensure dominance. In computer networking,
    Cisco was able to develop a switch, called the `Catalyst 6500`. This has been
    adopted for use in submarines and mountaintops. They also made the `CR-3` routing
    system, which has been labelled as being so powerful to stream all of the motion
    pictures captured in less than four minutes. The system is also so fast that it
    can have all the printed collection in the library of congress, all done in just
    about 1 second.


    Let’s take a look at the various products by Cisco


    ### Cisco Routers for Home

    For 10 years, spanning between 2003 and 2013, Cisco was the parent company of
    `Linksys` (both the business and the brand name). Linksys as a company was involved
    in making wired and wireless router models, which suddenly became popular for
    networking in the homes. However, Linksys got sold to Belkin.


    ### Cisco Routers and the Internet

    In the early days of the internet, Cisco routers were used in building a long-distance
    connection. This was between the 1980s and 1990s. The piece of tech back then
    was not used for just long distance connections, it was used by enterprise to
    create intranet networks.


    ### Cisco CSR – Carrier Routing Systems

    These were created to function as routers, and they served as the very core of
    large enterprise networks. To this component of the network, you can connect routers
    and switches. It was first introduced in 2004, and it offered `40 Gbps` connection.
    It also featured a network bandwidth that can be scaled to about 92 terabits per
    second.


    ### Cisco ASR – Aggregation Service Routers

    These are `EDGE` routers, and they were designed serve as interface between an
    enterprise’s network and the internet. It can also interface the enterprise network
    with another Wide Area Network.


    ### Cisco ISR – Integrated Services Routers

    There are three series in this line up, and they include the `1900`, `2900` and
    `3900` series Cisco.


    ### Cisco IOS – Internetwork Operating System

    This is a low-level network software that was designed to run on the Cisco routers.
    It could also run on other Cisco devices. It basically supports a command-line
    user interface shell. There were two variations of the `IOS`, which are the `IOS
    XE` and the `IOS XR`. There is no difference to these and the flagship Cisco IOS,
    they only added additional features not on the Cisco IOS.


    ## CISCO Network Certifications


    The Network Certification programs by CISCO are recognized across the world, and
    these certifications are available at different levels.


    ### Entry Level (CCENT & CCT)

    There are two main certifications possible in the Entry Level category. These
    are the `CCENT` and the `CCT`. These are designed for enthusiasts who are new
    to the trade, and are just starting a career in Computer Networking. These certifications
    require no prerequisites. The study materials for the entry level certifications
    can be acquired online, and the certification only comes after the registered
    individual has passed the examination. With this certification, the individual
    becomes a professional who can install, maintain and troubleshoot small networks.
    They are also able to perform all these functions on the branch of an enterprise
    network. The entry level is also prerequisite for some associate-level `CCNA`
    solution track credentials.


    For the `CCT` professional, the main function is to work on-site at customer locations.
    They are saddled with the primary responsibility of diagnosing issues, subsequently
    performing repair functions. When one is certified with `CCT`, progress can be
    made in Data Center and Routing and Switching.


    ### Associate Level (CCNA & CCDA)

    There are also two certifications in this category. Which are the Cisco Certified
    Network Associate (`CCNA`) and Cisco Certified Design Associate (`CCDA`). To receive
    this certificate, the individual must pass about two exams. In this certification,
    basic functions like installation, support, and troubleshooting can be performed
    on both wired and wireless networks. There are several career tracks available
    to the associate level professional. These include; Cloud, Collaboration, Cyber
    ops, data center, industrial, routing and switching, security, service provider
    and wireless.


    The `CCNA` is the prerequisite to the professional level `CCNP`. The Prerequisite
    to study the `CCNA` is all dependent on the career track chosen by the individual.
    This certification was designed by Cisco to hand pick individual that are capable
    of basic wired design, as well as wireless networks. For the `CCDP` (Cisco Certified
    Design Professional), the `CCDA` is a prerequisite. However, for individuals to
    obtain the `CCDA`, `CCENT`, `CCNA` (routing and Switching), coupled with an additional
    exam, are required.


    ### Cisco Professional Level Certifications (CCNP & CCDP)

    For the Cisco professional-level certificates, there are two main programs; the
    Cisco Certified Network Professional (`CCNP`) and Cisco Certified Design Professional
    (`CCDP`). To obtain the `CCDP` certification, the individual needs to pass three
    examinations, and fulfil the prerequisites of `CCDA` and `CCNA` (routing and switching).
    For the `CCNP` service provider, candidates can also possess Cisco Certified Internet
    Professional (`CCIP`). Once an individual is certified with `CCNP`, he is recognized
    as being able to handle the planning, deployment and troubleshooting of local
    networks and wide area networks. Individuals with `CCDP` are able to design and
    deploy scalable networks as as switched networks.


    ### Expert-Level Certifications (CCIE & CCDE)

    There are two primary certifications embraced by the Expert-level. These are the
    Cisco certified network expert (`CCIE`) and the Cisco Certified Design Expert
    (`CCDE`). For these certifications, there are no compulsory prerequisites. As
    of 206, there was an update to the Expert-level exams, causing it to include an
    evolving technologies domain. With the new domain, the target is now cloud, programmability
    of network and internet of things. This accounts for 10 percent of the total exam
    score. The main concept of this new domain is that the topics can be changed easily,
    to adapt to evolving technologies. The `CCIE` has several tracks which include;
    collaboration, data center, routing and switching, security, service provider
    and wireless. For the `CCDE`, experts can design infrastructure solutions for
    large enterprise environments. These environments include; technology, operations,
    business and budgeting.


    ### Architect-Level Certifications

    This is the best network for professionals looking to attain the level of network
    architects. They can also be data center architects. The Cisco Certified Architect
    certification (`CCAr`) is just like the Ph.D of the Cisco certifications. This
    is the highest level of certification offered by Cisco. Experts with this certificate
    are able to plan and design IT infrastructures that are based on specific business
    strategies. One of the prerequisites to obtaining this certification is to design
    a network solution that will implement and assigned strategy. When this is done,
    the individual needs to appear before a Cisco-appointed panel. At this presentation,
    the individual needs to defend the solution he had created.


    ## Job Opportunities for the various Certifications

