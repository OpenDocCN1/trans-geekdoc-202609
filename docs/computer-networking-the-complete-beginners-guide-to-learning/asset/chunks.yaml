    Note this; every connection done without the need for cables (but that has the
    cabled alternatives) are referred to as the wireless networks.


    # Wireless Technology

    Wireless technology is just as it sounds. Remember that I said wireless networks
    are always wrongly referred to as `Wi-Fi` and that `Wi-Fi` is only one of the
    different forms of wireless networks. It is just one of the ways with which a
    computer can connect to the internet. For the sake of this book and so you don’t
    get confused, we will use both terms (`Wi-Fi` and wireless networks) interchangeably.
    Before we continue, know this, `Wi-Fi` is simply an acronym for wireless fidelity.
    There are different `Wireless Networks` (or `Wi-Fi`) standards out there. The
    various devices you own, such as the router, tablet, smartphone, and smart home
    devices all have a means with which they connect to the internet. The Wireless
    network standards are continually changing, within the space of a few years. There
    are always updates, and these updates are what bring about faster internet, improved
    connectivity, and seamless handling of simultaneous connections.


    ## What are wireless network standards?

    You will ask. These are just a set of services and protocols that define the functionality
    of your `Wi-Fi` network and other data transmission networks. There are different
    types of wireless network standards, and as said, new versions are released from
    time to time. You can see these versions as updates. The most common types nowadays
    are the `IEEE 802.11` wireless LAN & `Mesh`. This particular `Wi-Fi` standard
    is always updated every few years. The most current update is the `802.11ac`,
    while the `802.11ax` is just jumping into the mainstream of wireless connection
    in the world.


    ## The various forms of the Wireless standards IEEE 802.11

    *   `IEEE 802.11`: This was originally created in 1997. It is however now defunct,
    but as of the period it was still in use, it provided a blazing fast maximum connection
    speed that hit megabits per second. The various devices that support this `Wi-Fi`
    model are no longer being made; hence, today''s devices would not support it.

    *   `IEEE 802.11a`: This was created about 2 years after the original, and it
    worked on the `5GHz` band. It was created, with the creators hoping that it brings
    about lesser interference. This was the school of thought when the version was
    created because most of the devices that interfered with the previous version
    ran on the `2.4GHz` band. This is also as fast as the original; there was a record
    of the speed hitting `54Mbps`. One thing this version of the `Wi-Fi` standard
    lacked was a range, as it was always having issues with devices on its path.

    *   `IEEE 802.11b`: This was also created in 1999, but it was the version that
    made use of the `2.4GHz` band, and it could reach a maximum speed of `11Mbps`.
    It was this standard of the `Wi-Fi` that got the `Wi-Fi` technology popular.

    *   `IEEE 802.11g`: This was designed in 2003, and it could attain a speed of
    `54Mbps` while working on the `2.4 GHz` band. After this, the standard was widely
    accepted, as it solved the issue of compatibility with several devices and offered
    high speed.

    *   `IEEE 802.11n`: This version of the `Wi-Fi` was created in 2009, but it was
    not so widely used as its predecessors. It could operate on both the `2.4GHz`
    and the `5 GHz` bands. It also supported usage across different channels. One
    each channel, a speed of about `150Mbps` can be achieved, hence, a cumulative
    of `600Mbps`.

    *   `IEEE 802.11ac`: This is the most current version on new devices. It was released
    in 2014, and with its technology, all devices connected to it can attain a speed
    of `1300mpbs`. This is not the only feature on this update; it also has the `MU-MIMO`
    support, as well as additional `Wi-Fi` broadcast channels for the `5 GHz` band.
    With a single router, this standard can support more antennas than the previous
    ones.

    *   `IEEE 802.11ax`: This is the most recent standard. With this standard, the
    connection speed is possible up to the tune of `10Gbps`. That''s how far it can
    go, and works are on to make it go beyond. The capacity is also more than that
    of the `ac`, as it designed to add more broadcast sub-channels, and upgrade of
    the `MU-MIMO`, as well as allowing for simultaneous streams of data.


    Over the years, `Wi-Fi` standards have only gotten better, and we are bound to
    see more. Connections on wireless networks are secured to get faster, and the
    advent of `5G` will ensure this. `4G` offered streams of data, more rapid than
    was experienced with the `3G`, but `5G` is going to be even faster and more reliable.
    The use of `5G` transcends just connections to the internet; it''s going to be
    the basic framework of wireless networking in the whole world, a total revolution
    of the way we have devices connected. The various standards of `Wi-Fi`, especially
    the latest versions, have been compared to the `Ethernet` connections concerning
    speed. The `802.11n` which can achieve a combined `600Mbps` when compared to the
    `Ethernet` speed of `100Mbps` seems faster. However, it isn''t just about the
    number; when it comes to real-life usage, the `Ethernet` connection is bound to
    outdo the `802.11n`. One thing is sure, though, development of the `Wi-Fi` is
    constant, and it follows closely as technology improves across the world.


    Before we move on, did you wonder why the `100Mbps` `Ethernet` connection will
    outdo the `600Mbps` `802.11n`? Well, this is because some factors limit wireless
    connections. These are; network overhead, radio interference, physical obstruction
    between devices, and distance between devices. All these problems are eliminated
    with the use of wired connections. Also, when several devices join on the wireless
    connection, there is a decrease in performance. This decrease in performance results
    from limitations on the bandwidth and the hardware supporting the network. These
    are the significant reasons why wireless networks still aren''t as perfect as
    wired connections.


    ## Interference

    Do you have an idea of what wireless interference means? Just by the term, you
    already have an inkling into what it means, and with all that has been said so
    far in this book, you probably know what it can cause. However, there is a need
    to know all that causes wireless interference, to avoid them too. Wireless interference
    is defined as a situation in which a `Wi-Fi` signal is disrupted as it travels
    through space. This is a crucial cause of inconsistent and unstable wireless connection.
    If all these can be eliminated, wireless connections would technically surpass
    wired connections. The problem is, how can they be removed? They can''t. The best
    way around this problem is to create a system that works well in spite of the
    obstructions.


    With the advent of tall buildings, and other structures here are there, there
    is an increase in the interference being faced by wireless connections. The materials
    used in these construction result in interference, as they absorb or reflect the
    radio waves that the signal is comprised of. For instance, if metals, concrete,
    and ceramics are used in a building''s construction, they can degrade the waves
    that pass through them. Hence, it is best to get these out of the way, if the
    network is to remain optimal. There are several cases in which spotting the cause
    of the interference is relatively hard to do. Do you know that lead paints used
    on the wall of some buildings can result in wireless interference? Yes, it can.
    However, it might be hard to identify or do anything to this. Irrespective of
    how thin or thick the layer of lead is, it can result in this interference.

    '
  trans: '


    请注意；所有不需要电缆即可完成连接（尽管有电缆的替代方案）被称为无线网络。


    # 无线技术

    无线技术顾名其名。记住我曾提到过，无线网络经常被错误地称为 `Wi-Fi`，而 `Wi-Fi` 只是无线网络不同形式之一。它只是计算机连接到互联网的方式之一。为了本书的起见，也为了不让你产生困惑，我们将交替使用这两个术语（`Wi-Fi`
    和无线网络）。在继续之前，请记住，`Wi-Fi` 只是“wireless fidelity（无线保真）”的缩写。市上有存在不同的 `无线网络`（或 `Wi-Fi`）标准。你拥有的各种设备，如路由器、平板电脑、智能手机和智能家居设备，都有连接互联网的方法。无线网络标准在短短几年内不断变化。更新总是在进行，而这些更新带来了更快的网速、改进的连接性以及对同时连接的无缝处理。


    ## 什么是无线网络标准？

    你可能会问。这些仅仅是一组服务和协议，定义了你的 `Wi-Fi` 网络和其他数据传输网络的功能。存在不同类型的无线网络标准，而且如所述，新版本会不断发布。你可以将这些版本视为更新。如今最常见的类型是
    `IEEE 802.11` 无线局域网和 `Mesh`。这种特定的 `Wi-Fi` 标准每隔几年就会更新一次。最新的更新是 `802.11ac`，而 `802.11ax`
    刚刚进入世界无线连接的主流。


    ## IEEE 802.11 无线标准的各种形式

    *   `IEEE 802.11`：它最初创建于 1997 年。尽管它现在已经过时了，但在它仍在使用期间，它提供了极快的最高连接速度，达到每秒兆。支持这种
    `Wi-Fi` 模型的各种设备不再生产；因此，今天的设备将不再支持它。

    *   `IEEE 802.11a`：它在原始版本约 2 年后创建，工作在 `5GHz` 频段上。它的创建者希望它能带来更少的干扰。这是该版本创建时的的一种观点，因为大多数干扰前一个版本的设备运行在
    `2.4GHz` 频段上。它的速度与原始版本一样快；曾记录速度达到 `54Mbps`。这个版本的 `Wi-Fi` 标准缺乏的一点是范围，因为它经常与其路径上的设备发生产生问题。

    *   `IEEE 802.11b`：它也创建于 1999 年，但它是使用 `2.4GHz` 频段的版本，最高速度可以达到 `11Mbps`。正是这种 `Wi-Fi`
    标准让 `Wi-Fi` 技术流行了起来。

    *   `IEEE 802.11g`：它设计于 2003 年，可以在 `2.4 GHz` 频段上工作并获得 `54Mbps` 的速度。此后，该标准被广泛接受，因为它解决了与多个设备的兼容性问题并提供了高速。

    *   `IEEE 802.11n`：这个版本的 `Wi-Fi` 创建于 2009 年，但它并没有它的前身那样被广泛使用。它可以同时在 `2.4GHz` 和
    `5 GHz` 频段上运行。它还支持跨不同通道的使用。每个通道可以实现约 `150Mbps` 的速度，因此累计达到 `600Mbps`。

    *   `IEEE 802.11ac`：这是新设备上最新的版本。它发布于 2014 年，凭借其技术，所有连接到它的设备都可以达到 `1300mpbs` 的速度。这并不是该更新的唯一特性；它还具有
    `MU-MIMO` 支持，以及针对 `5 GHz` 频段的额外的 `Wi-Fi` 广播通道。通过单个路由器，该标准支持比以前更多的天线。

    *   `IEEE 802.11ax`：这是最新的标准。通过这种标准，连接速度可能高达 `10Gbps`。这就是它能达到的程度，并且正在努力使其超越这一。容量也超过了
    `ac`，因为它设计用于增加更多的广播子通道、升级 `MU-MIMO`，并允许数据流同时传输。


    多年来，`Wi-Fi` 标准只变得更好，我们注定看到更多。无线网络上的连接正变得更快，`5G` 的到来将确保这一点。`4G` 提供的数据流比 `3G` 体验过的更快，但
    `5G` 将更快、更可靠。`5G` 的使用超越了仅仅连接互联网；它将成为全球无线网络的基础框架，是设备连接方式的彻底革命。`Wi-Fi` 的各种标准，特别是最新版本，在速度方面已与
    `Ethernet`（以太网）连接相相比。`802.11n` 能够实现组合 `600Mbps`，与 `Ethernet` 相比。


    '
