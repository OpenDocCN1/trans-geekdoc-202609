    \ about the transfer of data to individual devices on the network. Another factor\
    \ that contributes to the speed of the wired network is that there is no unnecessary\
    \ traffic that can weigh on the network. With the use of a cable, an unauthorized\
    \ user cannot connect to the network. \n\n*   Security \n\nSecurity comes easier\
    \ on the wired network than it does on the wireless network. Once you ensure that\
    \ the firewall is secure, coupled with other security applications, you can be\
    \ assured of security. Once you ensure the proper connection of the ports and\
    \ the network is continuously monitored, there is a drastic reduction in security\
    \ breaches and harms. This advantage is needed in institutions with numerous and\
    \ sensitive transactions going on daily. \n\n*   Cost \n\nThis is another area\
    \ the wired connections beat the wireless networks. The cost incurred in the development\
    \ of a wired network for your institution is all dependent on the specific framework\
    \ you are installing. Irrespective of the type of framework you are up for, the\
    \ cost is always going to be lesser than that needed for the wireless network.\
    \ The various components to be used on the wired network, such as; Ethernet cables,\
    \ switches, routers, etc. all come at a meager price. Also, unlike the wireless\
    \ network, there is a reduction in the need for incessant upgrades. The hardware\
    \ used in building this wired framework always stands the test of time. Disadvantages\
    \ of the wired network The advantages of the wired network are numerous and make\
    \ it worth considering. But does that make it the perfect networking system? If\
    \ it has been, there will most likely not be the development of the wireless systems.\
    \ There are several downsides to the wired network, which are; \n\n*   It is not\
    \ mobile \n\nYou can't carry your wired routers around just as you can take your\
    \ mobile Wi-Fi around. Wired networks are, unfortunately, inflexible in the aspect\
    \ of mobility. Whatever location you are going to use your network, there has\
    \ to be a cable connected to that point. Think of it as something like this, once\
    \ your wired connection has an outlet in your living room, the only way to access\
    \ that network is while in your living room and not in the bedroom. In many cases,\
    \ this might not be a big deal, especially in an office setting where there are\
    \ no constant shifts in positions of devices.  \n\n*   Installation \n\nThe installation\
    \ is cheaper, that’s a given, but it takes too much time to get it done. This\
    \ is because more components are needed, and getting them in sync can be an enormous\
    \ task. Other than the number of components that need to be connected, another\
    \ factor that influences the duration of installation is the size. The bigger\
    \ the network infrastructure you want to install, the longer it takes. \n\n* \
    \  Maintenance \n\nIf your network is small, you might not need a server. However,\
    \ on the expansion of the network, there is a need for a server. The server is\
    \ designed to handle connectivity, capacity, storage, and workload. Once this\
    \ need arises, the cost of maintenance is sure to skyrocket. Beyond paying for\
    \ the server and the cost to have it always running, you will need to hire and\
    \ pay professionals to oversee it daily. \n\n*   Wires \n\nWhen the number of\
    \ cables required to foster a connection becomes so much, it may be tough to control,\
    \ and it can be annoying. Imagine having wires litter the ground and walls. Managing\
    \ the clumsiness and bulkiness that comes with a wired connection may be hard,\
    \ and it is better to stay off it. The wired technology has been in existence\
    \ for quite some time, and truth be told, it has served well. The advantages of\
    \ using the wired network are so concrete that the inconvenience it comes with\
    \ may be overlooked. "
  fmt: "\nThis cable type is made of plastic or glass, and it is designed to transmit\
    \ signals in the form of light. In this cable, there is the movement of light\
    \ only in one direction. In the case where two-way communication is needed, there\
    \ needs to be a second communication enacted between the two devices. Basically,\
    \ the optical fibers are mainly for the guidance of light through a channel. In\
    \ the optic fiber cables, there is something called the fiber-optic cable connector.\
    \ There are three types of this connector, which are:\n\n- Subscriber channel\
    \ connector – used for cable TV. This uses a push/pull system of the lock.\n-\
    \ Straight tip connector – used for connection to networking devices.\n- The `MT-RJ`\
    \ connector which makes use of two fibers and integrates them in just one design.\n\
    \nThe advantages of using the optic fiber connector are: its resistance to corrosion\
    \ and the level of immunity to tapping. The downside, however, is that there is\
    \ the presence of unidirectional propagation of light.\n\n# Advantages of using\
    \ a wired network\n\nSo much has been said about the wired network, and how it\
    \ works. However, if you are one that is all caught in the frenzy of having a\
    \ connection between devices as wireless, it might be hard to see the essence\
    \ of having a wired connection. I'm sure you are hoping that monitor connected\
    \ to the CPU ends up becoming wireless, entirely. What you should know is that\
    \ wired connections have some advantages over the wireless counterparts. These\
    \ edge has not been attained by the wireless connections, which has ensured the\
    \ persistence of the wired devices. Here are some advantages you should take note\
    \ of:\n\n### It is very reliable and stable\n\nIf your wired network has been\
    \ set up by a professional, you can be sure of stability and reliability. Every\
    \ wired connection has intrinsic components that need to be correctly connected\
    \ to ensure proper functionality. Components like the `hubs`, `switches`, and\
    \ `Ethernet cables`. Once these components are perfectly in sync, you can be sure\
    \ of a network system that works like a horse. With the advent of the `5G` and\
    \ subsequent developments that will follow (as seen in the case of the `Wi-Fi\
    \ 6`), wireless network will get better. But, as it stands and with improvement\
    \ on hardware, wired connections are more stable. Another factor that aids the\
    \ reliability and stability of the wired network is that it is devoid of any interference\
    \ from other connections. For instance, in the case of wired connections that\
    \ are situated close to one another, you cannot experience any interference. However,\
    \ such proximity will most likely cause interference in wireless systems. Also,\
    \ the presence of obstacles like walls and other objects causes a waning of the\
    \ wireless network connection. In the case of the wired network, irrespective\
    \ of the distance or obstacles, speed, and the optimal connection is maintained.\n\
    \n### Visibility\n\nIn a wired connection, you can be sure of the network’s privacy,\
    \ such that a particular network is not visible to another network, except they\
    \ are connected. When the nodes are connected, there is the facilitation of an\
    \ effective data transfer. All that is needed for different networks to communicate\
    \ are the nodes. Once the nodes are connected, they can recognize other nodes\
    \ in the system and ensure that the right data is delivered to the correct node.\n\
    \n### Speed\n\nSpeed is another advantage of the wired network. As of now, wireless\
    \ networks cannot be compared to the wired networks in terms of speed. In the\
    \ wireless connection, there is the probability of the presence of dead spots.\
    \ These are not present with wired connections. Wired connections are devoid of\
    \ dead spots because different cables are used to have devices connected to the\
    \ network. This arrangement brings about the transfer of data to individual devices\
    \ on the network. Another factor that contributes to the speed of the wired network\
    \ is that there is no unnecessary traffic that can weigh on the network. With\
    \ the use of a cable, an unauthorized user cannot connect to the network.\n\n\
    ### Security\n\nSecurity comes easier on the wired network than it does on the\
    \ wireless network. Once you ensure that the firewall is secure, coupled with\
    \ other security applications, you can be assured of security. Once you ensure\
    \ the proper connection of the ports and the network is continuously monitored,\
    \ there is a drastic reduction in security breaches and harms. This advantage\
    \ is needed in institutions with numerous and sensitive transactions going on\
    \ daily.\n\n### Cost\n\nThis is another area the wired connections beat the wireless\
    \ networks. The cost incurred in the development of a wired network for your institution\
    \ is all deponent on the specific framework you are installing. Irrespective of\
    \ the type of framework you are up for, the cost is always going to be lesser\
    \ than that needed for the wireless network. The various components to be used\
    \ on the wired network, such as; `Ethernet cables`, `switches`, `routers`, etc.\
    \ all come at a meager price. Also, unlike the wireless network, there is a reduction\
    \ in the need for incessant upgrades. The hardware used in building this wired\
    \ framework always stands the test of time.\n\n# Disadvantages of the wired network\n\
    \nThe advantages of the wired network are numerous and make it worth considering.\
    \ But does that make it the perfect networking system? If it has been, there will\
    \ most likely not be the development of the wireless systems. There are several\
    \ downsides to the wired network, which are:\n\n### It is not mobile\n\nYou can't\
    \ carry your wired routers around just as you can take your mobile Wi-Fi around.\
    \ Wired networks are, unfortunately, inflexible in the aspect of mobility. Whatever\
    \ location you are going to use your network, there has to be a cable connected\
    \ to that point. Think of it as something like this, once your wired connection\
    \ has an outlet in your living room, the only way to access that network is while\
    \ in your living room and not in the bedroom. In many cases, this might not be\
    \ a big deal, especially in an office setting where there are no constant shifts\
    \ in positions of devices. \n\n### Installation\n\nThe installation is cheaper,\
    \ that’s a given, but it takes too much time to get it done. This is because more\
    \ components are needed, and getting them in sync can be an enormous task. Other\
    \ than the number of components that need to be connected, another factor that\
    \ influences the duration of installation is the size. The bigger the network\
    \ infrastructure you want to install, the longer it takes.\n\n### Maintenance\n\
    \nIf your network is small, you might not need a server. However, on the expansion\
    \ of the network, there is a need for a server. The server is designed to handle\
    \ connectivity, capacity, storage, and workload. Once this need arises, the cost\
    \ of maintenance is sure to skyrocket. Beyond paying for the server and the cost\
    \ to have it always running, you will need to hire and pay professionals to oversee\
    \ it daily.\n\n### Wires\n\nWhen the number of cables required to foster a connection\
    \ becomes so much, it may be tough to control, and it can be annoying. Imagine\
    \ having wires litter the ground and walls. Managing the clumsiness and bulkiness\
    \ that comes with a wired connection may be hard, and it is better to stay off\
    \ it. The wired technology has been in existence for quite some time, and truth\
    \ be told, it has served well. The advantages of using the wired network are so\
    \ concrete that the inconvenience it comes with may be overlooked.\n"
