    # Chapter 4: Revolutionary Impact of the Wireless Technology and Breakthroughs
    of Computer Networking


    Since the advent of wireless technologies, decades ago, our lives have never remained
    the same. And one thing is sure; it only promises to be better. With the gradual
    evolution of `5G` in the mainstream, we can only imagine what is to come. One
    sentence does it, “Wireless technology has affected the very intrinsic properties
    of our lives.” It has affected the way we do business; it has transformed the
    way we learn; it has affected the way we communicate and keep up with family and
    friends. Everything has changed, and this is just a testimonial of things to come.


    Over the course of the several decades in which we have had wireless technologies,
    there have been several breakthroughs. A whole book can be written to discuss
    strides that have birthed revolutionary platforms and infrastructure that have
    made life easier today. For the sake of brevity, two of these important breakthroughs
    will be discussed in this chapter. These are; `VLAN` and the Internet.


    ## VLAN – Virtual Local Area Network


    The `VLAN` is also known as the Virtual Local Area Network, and from the name,
    you can tell that it is bound to have similar frameworks to the `LAN`. The concept
    of `VLAN` is also simple. It is a sub-network that can group collections of devices,
    done on a separate physical `LAN`. You understand what a `LAN` is, right?


    What the `VLAN` does as against the `LAN` is that it makes it very easy for an
    administrator to partition a single switched network to match the functional and
    security requirements of their systems. This is achieved without the need to run
    cables or make some significant changes to the whole infrastructure of their network.
    This system of computer networking is always done by more significant enterprises
    in a bid to re-partition devices for better management of traffic.


    The use of `VLAN` in organizations is very important because they can cause an
    improvement in the overall performance of a computer network, as devices are all
    grouped based on the frequency of communication between them. With the `VLAN`,
    there is also the provision of security on more extensive networks, as there is
    an allowance of a higher degree of control over which devices can communicate
    with one another. `VLAN` is very flexible, and this is achieved because of logical
    connections, unlike the `LAN` and `WAN` that are physical. There is the possibility
    of several independent `VLAN` to be supported by network switches. This goes on
    to create the second (`2`) layer (`data link`) of the implementations of the subnet.
    Broadcast domains are always associated with the `VLAN`, which most time is comprised
    of several network switches.


    ## Types of VLANs


    There are several types of `VLAN`, which include; protocol-based, static, and
    dynamic `VLAN`.


    ### Protocol VLAN

    This type of `VLAN` handles its traffic based on the protocols that have been
    programmed into it. In this system, there is a switch with the function of segregating
    and forwarding traffic based on the various traffic protocols.


    ### Static VLAN

    This type of `VLAN` is also referred to as the port-based `VLAN`. This system
    needs a network administrator with the function of assigning ports on a particular
    network to a specific virtual network.


    ### Dynamic VLAN

    In this system of the `VLAN` network, there is a network administrator with the
    sole function of defining membership based on the characteristics of the devices.
    This is unlike the switch port location.

    '
