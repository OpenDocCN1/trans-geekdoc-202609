- raw: "Just about any network can be infiltrated by the botnet, once it is connected\
    \ somehow to the internet. In fact, if you own a smart TV, refrigerator or microwave,\
    \ it can be compromised with the use of a botnet. Botnets can perform basic process\
    \ and even more. In fact, there are several cases in which botnets are being sold\
    \ on the internet. If a botmaster feels the need to dispose of the botnet, or\
    \ have other hackers maximize it, he can sell it over the internet. Botnet structures\
    \ There are two ways in which the botnet can be constructed, but each design is\
    \ such that the master can maximize their activities. \n\n*   Client-server model:\
    \ This is setup, such that there is a main server controlling the bots. In this\
    \ case, control with the botmaster, who makes use of special software in the establishment\
    \ and issuance of commands. This is called the command and control (C&C) server.\
    \ \n\nThere are however some downsides to the use of this structure. The location\
    \ of the botmaster can be easily determined by the law enforcement agency. Also,\
    \ once the server is destroyed, the botnet is dead. \n\n*   Peer-to-peer: This\
    \ is the system commonly in use now. In this case, the net of bots does not make\
    \ use of a single server. The system is interconnected in the peer-to-peer structure.\
    \ On every bot, there is a list of other bots, which they will seek when it’s\
    \ time for updates, or there needs to be the transmission of information. \n\n\
    With this structure of the botnet, it is very difficult for law enforcement to\
    \ track down the initiator or crash the system. This system of bots is very difficult\
    \ to disrupt. How to prevent your network from botnet attack By now, you should\
    \ get the inkling that this is no minute attack. It is way different from the\
    \ other types of cyber-attack, and you need to optimize the security of your system\
    \ against it. Here are some ways you can save yourself from attack. \n\n*   Have\
    \ your operating system updated \n\n*   Don’t open email attachments from untrusted\
    \ sources \n\n*   Don’t download files from Peer-to-peer network, or other sites\
    \ that share files. \n\n*   Have your anti-virus software up-to-date. \n\nThe\
    \ need for security on a particular network of computers can never be over-emphasized.\
    \ With the rise of the internet, and the interconnection that has been fostered\
    \ by the wireless networks, it has become very easy for system to be compromised.\
    \ The cases of cyber-attacks recorded is on the high, and you need to be more\
    \ careful. Either with your personal computer, or the Local Area Network, or any\
    \ other type of network, due care and pro-activeness must be ensured.  You can’t\
    \ be too careful. Be safe! "
