    \ device interface that wants to receive and transmit tagged frames must be able\
    \ to support the `trunk mode configuration`. When there is an Ethernet frame that\
    \ remains untagged, there is a default VLAN for it, which most likely will be\
    \ defined in the switch configuration.\n\nAt the reception of an untagged Ethernet\
    \ by the VLAN switch, the `VLAN tag` is assigned to the ingress interface. The\
    \ frame is subsequently forwarded to the port of the host that has the `MAC address`.\
    \ The `MAC address` is the Media Access Control Address. In the case of Broadcast,\
    \ unicast and multicast, they are all passed towards all ports that are located\
    \ on the VLAN. In the case where there is a reply from an unknown host to a hidden\
    \ unicast frame, there is an automatic learning of the location by the switches.\
    \ Hence, subsequent frames that are addressed to that host are not flooded.\n\n\
    The switch-forwarding tables are updated by two different mechanisms:\n1. The\
    \ very first is that the old forwarding entries are removed from the forwarding\
    \ tables from time to time. The interval at which this removal is done can also\
    \ be configured prior.\n2. The second mechanism is that, whenever there is topology\
    \ change, it causes a reduction in the forwarding table refresh timer, and refresh\
    \ is triggered. By this reduction in the timer that has been configured, the time\
    \ refreshes earlier.\n\nThere is the `Spanning Tree Protocol (STP)` which is used\
    \ in the creation of loop-free topology among the switches in each layer 2 domain.\
    \ You can always make use of a per-VLAN STP that causes different layer – topologies\
    \ to reduce STP overhead, whenever it is the same topology with the multiple VLANs.\
    \ With the STP, there is the blockage of links forwarding which has the potential\
    \ to produce forwarding loops — thereby creating a sparring tree from a particular\
    \ root switch. Thanks to this blockage, some links will not be used for forwarding.\
    \ They have to wait till there is a failure on another part of the network which\
    \ causes STP to make the link a part of an active forwarding path.\n\n# Advantages\
    \ and Disadvantages of the VLAN \n\nThe benefits of the VLAN include security,\
    \ a reduction in the traffic from broadcast, easy administration, and the confining\
    \ of the broadcast domain. On the downside, there is a limitation of 4096 VLANs\
    \ on one switching domain, which creates several issues for hosting providers.\
    \ The communication of data between the several VLAN fostered by a router. However,\
    \ some modern switches also feature router functionalities; hence, they are called\
    \ `layer 3 switches`.\n\n# The Internet and how it has impacted our lives\n\n\
    The whole of the internet is a vast concept that has defined the very intrinsic\
    \ parts of our lives. The world is at a stage referred to as the information age,\
    \ and the very core of this is the internet. The internet is a vast planet of\
    \ connected devices on which communication, information, and connectivity are\
    \ fostered. The internet is global network of computer networks, which are now\
    \ based on wireless communications, ultimately providing a ubiquitous capacity\
    \ of multimodal, interaction that is not limited by distance. Right there from\
    \ where you are, you can access information and reach out to anyone, in any other\
    \ part of the world, and this is done in real-time. There is no loss of time,\
    \ and there is no lag, once your internet connection does not lag. This, is one\
    \ way in which technology has revolutionized our lives.\n\nDon’t be surprised\
    \ to know that before the internet, there is something called the `Arpanet`. This\
    \ was first deployed in the year 1969. As of this time, it was controlled by the\
    \ U.S Department of Commerce. This control by the government limited the adaptability\
    \ of the platform. It was when the platform was finally privatized in the 1990s\
    \ that it eventually became widely accepted and used across the world.\n\nAs of\
    \ 1996, a survey of internet users counted at about 40 million, and in 2013, the\
    \ number of internet users has risen to 2.5 billion persons. Of this number, china\
    \ has the most significant amount of internet users. In the earlier days, the\
    \ speed of accessing the internet was minimal, due to the mode of connection required.\
    \ However, with the explosion of the wireless connection, internet speed has become\
    \ amazingly faster. And with 5G underway, it can only be faster.\n\nThe central\
    \ concept of the internet is the ability of it to production, distribution, and\
    \ use of digital data and information in whatever format they may come. The effect\
    \ of the internet on our way of life is beyond words; the closest is to say it\
    \ has brought about a revolution. A revolution in every aspect. As coined by Ithiel\
    \ de Sola Pool in 1973, the internet is just the technology of freedom. Three\
    \ factors contributed majorly to the growth of the internet:\n\n- The developer\
    \ of the World Wide Web, Tim Berners-Lee, was ready and willing to share the source\
    \ code of his technology to the global community, to foster its development caused\
    \ the major boom. He also shared the `TCP/IP` internet protocols of the technology,\
    \ and till today, about 2/3 of the internet is operated by an open-source server\
    \ called `Apache`.\n- There was also an institutional change in how the internet\
    \ is being managed, as it was taken from the government, and can be managed by\
    \ the global community of users. By privatizing the internet, it can then be used\
    \ for both commercial and cooperative uses.\n- There was also a significant shift\
    \ in social structure, culture, and social behavior. Networking became a prevalent\
    \ organizational form.\n"
