    \ An example of this is \"Source address 172.18.1.1 is permitted to reach 172.18.2.1\
    \ via port 22.\" Any confusion? Here is another analogy. Think of your IP address\
    \ as a house, and the port numbers are the rooms in the house. The house (destination)\
    \ can only be accessed by trusted persons (source address). After this, there\
    \ is further filtering that only allows specific persons to enter particular rooms\
    \ in the house. The rooms in this case are the destination ports. It all depends\
    \ on what type of data is coming in. Some data can access any of the ports, while\
    \ others can only be allowed through one. Types of firewall Now that you know\
