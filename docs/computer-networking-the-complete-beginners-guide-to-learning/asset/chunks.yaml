    \ like installation cables for TVs. They are more expensive than the twisted pair\
    \ wire; hence, there is the provision of faster data transmission. \\-       \
    \ Fiber optic cable: These are high-speed cables that transmit data with the use\
    \ of light beams through a glass bound fiber. These cables are top data transmission\
    \ portals, especially when compared to the other cable types. These cables are\
    \ super-fast. However, they are very costly. These cables can only be purchased\
    \ and installed by the government. \n\n*   Routers \n\nRouters are a common term\
    \ in the computer networking ecosphere, and it is very easy to miss the clue on\
    \ what it is. Many people get to use this, call the name without exactly knowing\
    \ what it does and how it functions. The Router is a device used to connect a\
    \ Local Area Network with the internet. The Router is the device used to share\
    \ a single connection to the internet, with more than one computer in a Local\
    \ Area Network. In some cases, switches are also present in routers. Modern routers\
    \ are now known to feature custom switches. Hence, when getting a router, you\
    \ don't need to get a switch, especially if the LAN is only through the home or\
    \ small business. Routers come in two types; the wired and the wireless routers.\
    \ \n\n*   Modems \n\nModems are devices which enables the connection of your computer\
    \ to the internet over an existing telephone line. Just like the NIC, the modem\
    \ is not integrated into the computer’s motherboard. It is a separate device that\
    \ is connected to the device once it affixed to a PCI slot on the motherboard.\
    \ A modem in its real sense does not necessarily mean a LAN. It merely connects\
    \ the computer to the internet. There are several modem types. The significant\
    \ difference between these modem types is the speed and transmission rate. There\
    \ are: \\-         Standard PC modem or dial-up modems \\-         Cellular modem\
    \ \\-         Cable modem \\-         DSL modems \n\n*   Gateways \n\nGateways,\
    \ in most cases, are misconstrued to being the same as a router. However, both\
    \ entities are different. A gateway can be defined as a data communication device\
    \ that fosters the provision of a remote network with connectivity to a host network.\
    \ Gateways are designed to provide communication to remote networks or autonomous\
    \ systems that are out of bounds for the host network nodes. In simple terms,\
    \ the gateway can be defined as the entry and exit point of a particular network.\
    \ Every data that is going in and out of a specific network of computers first\
    \ interacts with the gateway. This is so that they can be allowed to use to routing\
    \ path. Routers are being categorized as gateway devices because they are designed\
    \ to perform this function to computer networks. Computer networks (LAN or WAN)\
    \ are always limited in their reach. They basically can easily interact with the\
    \ other computers in the system. Whenever there is a need to interact with another\
    \ computer or a node on another system, then a gateway is needed. Routers are\
    \ specific, in that they are portals with which a computer network communicates\
    \ with the internet. Gateways might be portals to another Local Area Network.\
    \ Other than the routing of data packets, gateways are also designed to possess\
    \ information about the host network's internal paths and the learning paths of\
    \ other networks. When there is a need for the network node to communicate with\
    \ another external network, the packet of data has to pass through the gateway.\
    \ The gateway then routes the data to the right destination. Network bridges Network\
    \ bridges are computer networking devices that are designed to create the aggregation\
    \ of the network from different communication networks. This is a process known\
    \ as network bridging. This might be confused with routing; however, there are\
    \ fundamental differences. Routing as a process involves the communication of\
    \ different networks, while they remain distinct. However, bridging consists of\
    \ the communication of separate networks, carried in a manner that depicts singularity.\
    \ The term wireless bridging is culled in the case where one or more of the connected\
    \ networks are wireless. Network bridging is of three types. These are the simple\
    \ bridging, multiport bridging, and learning bridging. \n\n*   Learning or transparent\
    \ bridging \n\nIn the transparent or learning bridging, a table called the forwarding\
    \ information base is used in the control of frames between network segments.\
    \ At the start of a network, the tables are empty but are subsequently filled\
    \ as there is the reception of frames. Whenever the destination address is not\
    \ found on a table, the frame is transferred to the other ports of the bridge.\
    \ They are flooded to the other ports, other than the port from which it emanated.\
    \ During this flooding process, a host is created on the destination network,\
    \ with the subsequent creation of a forwarding database entry. For this process\
    \ to be completed, both the source and destination address needs to be known.\
    \ The source address is recorded in the table, while the destination addresses\
    \ are searched for in the table, which is then matched to the proper segment to\
    \ which the frame is sent. This system is designed to be somewhat of a filter.\
    \ If the frame’s destination is read, the bridge then decides if the next action\
    \ is to forward it, or to filter it. The bridge will only transmit the data if\
    \ the destination is on another segment of the network. However, in the case where\
    \ the destination is in the same section as its source, it is being filtered.\
    \ This filtration process prevents the date from entering into another segment;\
    \ it will be irrelevant. This technology was developed as far back as 1980, by\
    \ the Digital Equipment Corporation. This type of bridging can be operated on\
    \ devices with more than two ports. \n\n*   Simple bridging \n\nIn the case of\
    \ simple bridging, two networks are connected. This connection is made by a transparent\
    \ operation, in which the bridge decides on a frame-to-frame basis, which information\
    \ to forward from one system to another. The simple bridging process is as simple\
    \ as it can get, making use of a store and forward model. In the course of the\
    \ transfer, there is the verification of the source network, and there is the\
    \ advent of CSMA/CD delays on the destination network. Another effect of this\
    \ bridge is that it creates a collision domain on either side of the bridge. This\
    \ facilitates a drastic reduction in a collision. \n\n*   Multiport bridging "
