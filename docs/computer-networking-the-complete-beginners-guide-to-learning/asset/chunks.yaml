    There are some routing protocols that give a full details of mapping of the network
    links, while others just allow routers to work with lesser information.


    # Classes of Routing Protocols

    There are 3 major classes of routing protocols.


    ## Distance Vector routing protocol

    These protocols are designed to help choose the best paths (in the basis of hop
    counts) needed to reach a destination on particular network, in a particular direction.
    Some of the protocols in this class are dynamic, which makes them optimal for
    the performance of the function. One of such is `RIP`. In this framework, the
    hop counts are the various routers that exist between a source and the destination
    network. Of all the various possible paths, the one with the least hop count is
    decided to be the best path.


    #### Features

    - The network update are exchanged periodically

    - The updates are always broadcast

    - The routers in this framework make decisions premised on information from neighboring
    routers.


    #### Disadvantages

    - The periodic exchange of information most times result in an unnecessary traffic

    - The exchange also results in security issues

    - The broadcast of network periodically most often than not will create unneeded
    traffic.


    ## Link State Routing Protocols

    Unlike the other protocol, these routing protocols know more about the internetwork.
    These are also known as `SPF` (shortest path first). An example of this is `OSPF`.


    #### Features

    - The updates in this protocol can only be initiated when there is a change in
    topology.

    - Only that much updates are exchanged which is requested by the neighbor router.


    There are three tables that this routing protocol maintains, which are:

    - `Neighbor table`: This is the table that serves as a repository of information
    about the neighbors of the router only.

    - `Topology table`: This is the table with the information about the whole topology,
    which include both the best and back up routes that information packet can take.

    - `Routing table`: This is the array of the best routes on the network.


    ## Advanced distance vector routing protocol

    This is somewhat of a hybrid, a culmination of both the link and vector routing
    protocols. One example of routing protocol in this class is the `Enhanced Interior
    Gateway Routing Protocol`.


    # Types of Network routing protocols

    As explained above, all the routing protocols are classified into three. There
    are several routing protocols that makes the wireless and wired networks function
    effectively. These are:


    ### Routing information protocol

    This is the routing network that is extensively used in both local and wide area
    networks. It is shortened as `RIP`, and its functioning is premised on the distance
    vector algorithm. The protocol has been defined since 1988, and has since then
    had two versions. You can use any of the versions nowadays.


    ### Interior gateway routing protocol

    This routing protocol is one made by `CISCO`, and it is used in routers to exchange
    routing data within an independent system.


    ### Open shortest path first

    This is an active routing protocol that is used in internet protocol. It is an
    example of the link state routing protocol and it includes all the major group
    of interior gateway protocols. This protocol is mainly used in companies with
    a big network.


    ### Exterior gateway protocol

    This is the ultimate routing protocol for the internet, and it was specified in
    1982 by Eric C. `EGP`. It was initially expressed in `RFC827`, but properly specified
    in `RFC 904` in the year 1984. The topology on this network routing protocol is
    like a tree.


    ### Enhanced interior gateway routing protocol

    This is another type of the distance vector routing protocol, but it is fitted
    with advanced technology to reduce the unsteadiness that occurs whenever there
    is a change in topology. It enjoy a general optimization based on `DUAL` work,
    as well as a loop free operation. This network protocol also offers a means of
    speedy junction.


    ### Order Gateway Protocol

    These are the core network routing protocols found on the internet and is responsible
    for the maintenance of a table of internet protocol that are designed to allow
    network reaching capabilities within `AS`.


    ### Intermediate system to intermediate system

    This is a great protocol that is used by network devices to decide the best route
    to promote datagram, from one end to another of a packet on a switched network.
    This process is what is referred to as routing.


    # Network Security Protocols

    The network security protocols are the network security protocols that ensure
    the data transferred is safe and secure. These protocols are designed to protect
    networks from illegitimate users.


    ## HTTPS

    This is the protocol used to protect traffic. It is designed to keep information
    sent safe.


    ## Firewall

    This is a popular protocol used in e-commerce to protect payment gateways and
    servers. If these are ever compromised, several users will be affected.


    There are three main categories of the firewall:

    - `Packet filter`: These are saddled with the responsibility of passing data that
    pass through a network interface. The information needed at this point is `IP-address`,
    `port numbers`, and `destination`. You can easily install and implement this firewall
    on your wireless network. The high side is that it can be easily maintained, but
    it offers a very low protection level.

    - `Filter circuit`: This is the intermediate level of firewall security. This
    is designed to monitor agreement activities at the junction of the client and
    external host, checking if the requested session is valid. This firewall type
    is not so expensive and is best used to protect private networks.

    - `Application-level`: This provides your network with the highest level of firewall
    protection. However, it is a more complex design and comes at extra cost.


    ## IPSEC

    This is a security protocol designed to encrypt data at the level of the network.
    There are three main protocols embedded in this:

    - `authentication header`: Provides data origin authentication, data integrity,
    and security from repetitive messages.

    - `encapsulating secure payload (ESP)`: Designed to offer validation and integrity
    for the payload, but it does not do so for the `IP` header.

    - `internet key exchange (IKE)`: Its main function is to solve the problems of
    key distribution protocols.


    ## PCT

    This is shorthand for the `Private Communication Technology`, and it has a basic
    working process like the `SSL`. The only difference between the `PCT` and the
    `SSL` is the size of the message in transit. Compared to the `SSL`, the messages
    on `PCT` are smaller. Browsers like `Microsoft Explorer 3` makes use of `PCT`.

