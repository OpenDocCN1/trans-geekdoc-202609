- raw: "Chapter 7: Wireless Technology for Internet of Things Communication technologies\
    \ across the world has become as easy as it can get. Right from wherever you are\
    \ in the world, you can reach out to anywhere. Thanks to wireless networking,\
    \ interconnectivity between various devices is possible and can be done in real\
    \ time. Communication has transcended what it used to be many years ago. Now,\
    \ we are in the world that has seen devices interacting with themselves, and with\
    \ humans. Internet of things is gradually becoming s pivotal topic of interest\
    \ in the technological world. It’s not only going to influence the way we live\
    \ our lives, it’s also going to influence the way we work. You surely must have\
    \ heard my people herald what you need to know about working in the future. While\
    \ all these is true, you should know that the future is here already. Computers\
    \ are connected with each other in very easy fashion, unlike anything that has\
    \ been seen before. There are technicalities surrounding IoT, but they are all\
    \ understandable. Internet of Things simply involves the connection of any device\
    \ with an “on” and “off” switch to the internet or with another device. Just about\
    \ any device you can think of can enjoy this connection. Talk of your coffee maker,\
    \ washing machines, headphones and even lamps. It is called Internet of Things\
    \ because it is a gigantic connection of things. This relationship can be fostered\
    \ between people – people, people – things and things – things. Internet of things\
    \ is a broad concept, in which wireless communication plays a major role. At the\
    \ very heart of everything related to internet of things is wireless communication.\
    \ It is this technologies that allow for communication between devices. There\
    \ is a communication fostered without the devices having to be connected to each\
    \ other. The mode of connection is mostly the radio frequency or RF. This communication\
    \ framework is not entirely new, as it has been around since the early 20th century.\
    \ Rather than becoming obsolete like some technologies of the 20th century, it\
    \ has grown and evolved to meet every day needs of the 21st century. Later in\
    \ this book, we will take a deeper look into internet of things and what the future\
    \ holds for it. However, in this chapter, we will take a look at the various wireless\
    \ communication technologies that have been instrumental in the development of\
    \ internet of things, over the years. Zigbee Wireless Technology: Its Architecture\
    \ and application There are different wireless technology out there, but one can\
    \ easily dismiss the Zigbee wireless technology as the most excellent. This is\
    \ because it is low-cost and low-power consuming. It also has a number of great\
    \ characteristics that makes it just excellent. It is the best suited technology\
    \ for embedded applications, industrial control, home automation, etc. The main\
    \ function of the Zigbee wireless technology is to power controls and sensor networks.\
    \ This is achieved o the IEEE 802.15.4 standards for wireless personal area networks\
    \ (WPANs). This is a form of communication standard that defines both physical\
    \ and media access control layers. This is done so that it can handle devices\
    \ at low-data rates. The various Zigbee WPANs are able to function at 868 MHz,\
    \ 902 – 928 MHz and 2.4 GHz frequencies. This wireless communication technology\
    \ is used to control and monitor applications, all within the range of 10 – 100\
    \ meters. This form of communication comes at a cheaper cost, and simpler than\
    \ the others like Bluetooth and Wi-Fi. Zigbee is able to offer support for different\
    \ network configurations, and it can be operated in different modes since the\
    \ battery is conserved. The Zigbee networks are designed to support extension\
    \ of use with routers. It can also allow for many nodes to be interconnected with\
    \ each other. This way, a wider area network is built. The Zigbee Architecture\
    \ The system structure of Zigbee consists of three different devices, which are\
    \ the Zigbee coordinators, router and the end device. In every Zigbee network,\
    \ there must be the presence of at least one Zigbee coordinator. This coordinator\
    \ acts as the root and bridge of the network. It is also responsible for the handling\
    \ and storing of information whenever there is the reception and transmission\
    \ of data over the network. The routers in this case act as the intermediate that\
    \ moderates the passage of data to and fro a device to another. For end devices,\
    \ they have a limited functionality which is just to communicate with the parent\
    \ nodes. In the Zigbee wireless communication network, the number of coordination,\
    \ router or end device involved is always dependent on the type of network being\
    \ established. There are different network types, which are star, tree and mesh.\
    \ In the Zigbee wireless communication architecture, there are different layers.\
    \ \n\n*   Physical layer: This layer is responsible for modulation and demodulation\
    \ whenever there is a transmission and reception of signals on the network. \n\
    \n*   MAC (Medium access) layer: This layer is one which takes the responsibility\
    \ of reliably transmitting data by gaining access to several network on the Carrier\
    \ Sense Multiple Access Collision Avoidance (CSMA). The MAC layer is also responsible\
    \ for the transmission of beacon frames for synchronization communication. \n\n\
    *   Network layer: The network layer is the one responsible for all network related\
    \ operations like network setup, routing, end device connection and disconnection\
    \ to network. \n\n*   Application Support Sub-layer: The application layer is\
    \ one which enables the various services that are necessary for interfacing between\
    \ the Zigbee device object and application objects and network layers for the\
    \ purpose of data management. The application layer support sub layer is responsible\
    \ for the merging of devices based on specified services and needs. \n\n*   Application\
    \ framework: The framework layer has two data service types which act as the key\
    \ value pair and the generic message services. "
