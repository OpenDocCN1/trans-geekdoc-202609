    # Compliance and Standards


    Data Security Platforms and organizations that collect data are known as data
    processors. This is an enormous responsibility for such an organization. There
    are different rules and regulations that guide how the data can be used. This
    regulation covers all data, irrespective of its type or size. However, different
    industries field different regulations. The regulations in the tech industry are
    somewhat different from those in the finance industry. The rules sometimes are
    also influenced by location. For instance, companies dealing with citizens of
    the European Union might be faced with `GDPR` in the case where there is a data
    breach. Fines are popular ways in which companies and enterprises that fall short
    of data breach regulations are punished.


    # Firewalls Defined


    The term `firewall` is one that flies around in the IT eco-space, and if you are
    entirely new to the system, you might wonder what it is, what it does, and how
    it works. Well, here it is. Firewalls are network security devices that are designed
    to monitor both outgoing and incoming network traffic. It also doubles in functioning
    as a block and permission to data packets, with all its actions based on particular
    security rules.


    The primary purpose of the `firewall` is to make sure that there is the presence
    of a barrier, right in between your internal network system and the external traffic
    of data coming from foreign network sources. For instance, if your company manages
    a `LAN`, any data that is to go into the `LAN` from another source will first
    have to go through the `firewall`. This way, vibrated and malicious data traffic
    can be identified and blocked.


    ## How does the firewall work?


    The working of the `firewall` is simple. It analyses the incoming traffic, comparing
    them to some set of pre-established rules imputed into it, and blocks every data
    that does not meet up to the instructions. The firewalls are always situated at
    the `port`, which is the network’s entry point. It is at the `ports` that information
    is exchanged with external devices.


    An example of this is `"Source address 172.18.1.1 is permitted to reach 172.18.2.1
    via port 22."`


    Any confusion? Here is another analogy. Think of your `IP address` as a house,
    and the `port numbers` are the rooms in the house. The house (destination) can
    only be accessed by trusted persons (source address). After this, there is further
    filtering that only allows specific persons to enter particular rooms in the house.
    The rooms in this case are the `destination ports`. It all depends on what type
    of data is coming in. Some data can access any of the `ports`, while others can
    only be allowed through one.


    # Types of firewall


    Now that you know what firewalls are all about, it then begs the question "how
    many types are there?" There are different types of firewalls out there. They
    can be software or hardware. It all depends on what you want in your organization.
    The best bet is to have both system functional in your enterprise.


    - With the `software firewall`, there is its installation on every computer linked
    on the network. On installation, it regulates every traffic through `port numbers`
    and `applications`.

    - For the `physical firewall`, there is the installation of a device in between
    the network and the `gateway`.


    The `packet-filtering firewalls` are divided into two main categories, which are;
    `stateful` and `stateless`.


    - The `stateless firewalls` are those that cross-check the packets exclusively
    from other packets, and there is no context in this check. This way, they can
    quickly identify hackers and other vices.

    - For the `stateful firewalls`, they remember information about other packets
    that have been examined and are marked as safe. These two types of firewalls are
    somewhat useful; however, they merely provide essential protection and have limitations.
    One such limitation is that they are unable to determine if the content of the
    request that is incoming will have an adverse effect on the destination application.
    In the case where a virus is coming in from a trusted source, these firewall types
    will never know.


    The good news, however, is that there are advanced firewalls that will never miss
    such:


    - **Next-generation firewalls (NGFW)**: These are firewalls that are a combination
    of both traditional firewall technology and some other functions like encrypted
    traffic inspection, intrusion prevention systems, anti-virus, and many more. One
    primary function that is found in the next-generation firewall is the `"deep packet
    inspection" (DPI)`. The essential firewalls discussed earlier will only search
    through the packets'' headers, these go beyond to inspect the data contained in
    the packet. This enables users to easily identify, categorize, and obstruct packets
    that are virulent.

    - **Proxy firewalls**: This functions by filtering network traffic at the application
    level. However, unlike the necessary firewalls, it acts as an intermediary between
    two end systems. In this case, there must be a request from the client to the
    firewall. This request is then evaluated and compared against set security instruction.
    The result of this cross-check determines if the packet is blocked or allowed.
    In most cases, the proxy firewalls are employed to monitor traffic for layer 7
    protocols such as `HTTP` and `FTP`. This system of firewall also makes use of
    both the deep pocket inspection and the stateful inspection;

    - **Network address translation firewalls (NAT)**: This allows several devices
    that have independent network addresses to communicate and connect to the internet
    while making use of just one `IP address`. This way, the individual `IP address`
    of the computers are hidden. Due to this, hackers can''t capture specific details
    of a particular computer. This is a step further at ensuring the security of systems
    on a network. The `NAT firewalls` have close similarities to the proxy firewalls.
    They are somewhat an intermediary between a network of computer and outside traffic.

    - **Stateful multilayer inspection (SMLI) firewalls**: This firewall system is
    designed to conduct the filtration of packets at the network, transport, and application
    layers. At the filtration stage, it compares them with trusted packets before
    a decision is being made. Just like the `NGFW firewalls`, these conduct examination
    of the whole packet at every layer, before either passing or blocking them. This
    search aims to determine the state of the communication that is being proposed,
    such that only a connection with trusted sources is allowed.


    Wireless networks are the future, and there is so much to do in ensuring that
    they are effective and make communication occur in real-time. With data packages
    of digital entities such as games, movies, audios, etc. improving an achieving
    better resolutions and quality, it is only right that the supporting systems follow
    suit. Making sure that wireless networks can attain uninterrupted transfer of
    data like the wired connection is still a long drive from being achieved. This,
    coupled with the need for security, are the problems being faced by the wireless
    network. Research, innovation, and system developments are continually underway
    to ensure improvement, and we can only be sure of more shortly.

    '
