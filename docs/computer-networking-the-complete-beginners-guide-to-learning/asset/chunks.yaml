    # Introduction


    What do you know about Computers? What do you know about Computer Networking?
    There are so much going on in the world. Tech is evolving every day, and the interconnections
    in the computer field have left us with a giant web of systems and machines interacting
    with one another. What makes computer technology powerful is the interconnection
    it fosters. Right from your phone, you can interact with your desktop computer.
    This connection spans in so many different ways, all at the same time. Thanks
    to networking, the computer has become ubiquitous. It is the very core on which
    our 21st-century life is premised. The world has changed, it''s either you stay
    on top of your game, or you end up in the dark. Staying in the loop of what is
    going on is the best you can do. Tech has transcended its role of revolutionizing
    our lives. It has become the very basis of life in the 21st century. It all started
    with a giant machine, numerous wires connected spanning different distances. Now,
    it’s all a matter of bandwidth and more advanced networks. There is so much to
    understand in the computer world, the widest of which is the whole Computer Network.
    A computer network are sets of computers which are connected for resource sharing.
    This definition is as basic as it can get. However, don''t be fooled; there are
    so many intricacies underlining this definition. Computer Networking is a whole
    world; it is easy to get blown away in this world. This book is culled from the
    immense knowledge of the author, on this subject, subjected to a grammatical breakdown
    which will foster an easy comprehension from you. This text spans the whole essential
    elements to be understood, to the various functionalities, the wireless systems,
    communication, and to the more advanced concepts. In spite of the technical frameworks
    and structure that embellishes the Computer Networking world, this text is poised
    to deliver a perfect understanding of the most straightforward combination of
    words. By reading this book from start to finish, your knowledge of Computer Networking
    is bound to attain professionalism, irrespective of its starting point. This is
    bound to be a long but enjoyable ride. Come along. Hello World!


    ## Computer Networking Defined: The Whole Concept


    ### What is Computer Networking?


    Computer Networking is simply the formation of a computer network. A computer
    network can be defined as the collection of computers, printers, and other equipment
    that are connected (wired or wireless), with the ultimate aim of fostering communications
    between the devices. The process of creating this connection of devices is known
    as Computer Networking. Technically, Computer Networking is referred to the process
    of transporting and exchanging data between points known as nodes, carried via
    a shared system, executed in an information system. The whole concept of Computer
    Networking does not consist only of the design, construction, and use of a network.
    It also involves the technical management, maintenance, and running of the involved
    infrastructure, software, and underlying policies. In Computer Networking; systems,
    endpoints, and other devices can be connected, over a local area network (`LAN`),
    or a more extensive network. The larger networks, in this case, are the internet
    and the private Wide Area Network (`WAN`). Every stakeholder (service providers,
    businesses, and consumers) has a role to play in ensuring that resources are effectively
    shared. This system of stakeholders also provides the effective use and offering
    of services. Once the system involves a system responding to controls and information
    from a remote location, it can only be facilitated by one form of Computer Networking.
    Right from the making and receiving of Telephone calls, to the streaming of movies
    on the internet, to the internet of things. A network of Computers facilitates
    all. The level of complexity of a particular network decides the skill level required
    to operate and maintain it. For instance, if an enterprise has numerous nodes
    amidst other security checks (like `end-to-end encryptions`), it requires an advanced
    level of technical administration to oversee it effectively. This is unlike the
    Local Area Network being utilized in a school’s computer laboratory.


    ## Components of Networking


    Networking of Computers requires so many infrastructures for a seamless operation.
    The various types of network structures require different parts. These will be
    looked at extensively in the course of this book. Physical network infrastructures
    are needed for a Computer Network, which includes but is not limited to; `switches`,
    `routers`, `wireless access points`, etc. There is also some underlying firmware
    which makes these infrastructures function correctly. Other than the physical
    systems, there is also the needed software deployed to monitor, manage, and secure
    the network. For advanced networks, there is a need for standard protocols, which
    are designed to perform numerous discrete functions. These protocols are also
    used to communicate different data types, irrespective of the underlying hardware.
    For instance, in the telephone system, a voice over IP (`VoIP`) can bring about
    the transportation of `IP` telephony traffic from one point to another, once these
    points support the protocol. This is also similar to what occurs in the browser,
    with the `HTTP` providing portals to accessing. Also, over an `IP` based network,
    the `IP` protocols to transport data and services.


    ### Networking Components Defined


    As said earlier, hardware components need to be installed for the creation of
    a network. The fundamental elements are the `Cables`, `Hubs`, `Switch`, `Network
    Interface Card` (`NIC`), `modem`, and `routers`. In a wireless network, there
    is no need for cables; hence, it is eliminated. The essential components needed
    for a computer network are:


    *   `Network Interface Card (NIC)`

    *   `Hub`

    *   `Switches`

    *   `Cables`

    *   `Router`

    *   `Modem`


    Computer networks range from simple to complex. However, all make use of the same
    essential devices and rules:


    *   `Network Interface card (NIC)`: This is also known as the Network adapter.
    This is a device that enables communication between the computer and other devices
    involved in the network. This framework makes use of the unique hardware addresses
    (`MAC addresses`) that are encoded on the card chip. The data-link protocol then
    uses the `MAC addresses` for the discovery of other systems situated on the network,
    to bring about data transfer in the right direction. The Network cards come in
    two types; the wired and the wireless network cards. For the wired network cards,
    cables and other connectors are used for the transfer of data. However, for the
    wireless network card, radio wave frequency technology is used. Modern laptops
    feature both network card types in their hardware.


    *   `Hub`: This is a computer networking component with the primary function of
    splitting network connection through to multiple computers. The is somewhat of
    a distribution center. At the request of information by a computer, from the network,
    the application is being transmitted to the hub through cable. When the hub receives
    the command, it is sent to the entire system. When this is done, each of the computers
    on the network is now left to decipher if the information is for them or not.
    The use of a hub in the computer network used to be very vital. However, in recent
    times, they are getting out of use. They are now replaced by an improved communication
    system of devices such as the `switches` and `routers`.


    *   `Switch`

