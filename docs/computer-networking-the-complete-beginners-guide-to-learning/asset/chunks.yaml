    # Chapter 3: Functionality of Wireless Network


    How soon do you think it will take before all our device connections all turn
    wireless? Slowly but steadily, technological innovations are doing away with the
    need for wires to connect two devices. Out of the context of networking (but surely
    with the use of wire), let''s take a close look at smartphones that now have wireless
    charging. It had always seemed to be impossible, but now it is. Your phone needs
    to be on a device, and energy is being transmitted. That’s just surreal, but it’s
    technology at work.


    Wireless technology started being a thing since the early ‘90s, and over the century,
    it has gotten better, faster, and more reliable. As discussed earlier, the wired
    network still has some advantages over the wireless network. But, these edges
    can be ignored (especially if you can get things done relatively fast with the
    wireless technology). We have defined the wired technology, and it has been established
    that the other form of connection other than the wired systems, is the wireless
    system. They are not mutually exclusive to one another.


    ## What is the wireless network?


    The name has some hint, but is that all there is to it? – A system of connection
    without the use of wires. What exactly is the wireless system? Technically, a
    wireless system can be defined as one that makes use of radio waves in the transmission
    of signals and data, as opposed to the use of wires and cables. The wireless networks
    have undergone so much innovation and development to function just like a phone.
    To use your phone, you don''t need to connect to a phone line; this is precisely
    the same with the wireless network. You don’t need to mechanically connect with
    a wireless computer network before you can use the network. Setting up a wireless
    network is simple, but there are some fundamentals you need to understand.


    *   The very common name for the wireless network is the `WLAN` – Wireless Local
    Area Network. In some cases, people prefer the use of `LAWN` – Local Area Wireless
    Network. The wireless networks are sometimes wrongly referred to as `Wi-Fi`. In
    actuality, the `Wi-Fi` is just one form of the wireless network. The `Wi-Fi` is
    the `802.11b` standard.

    *   The name of the wireless computer network is the `SSID`. The `SSID` is the
    acronym for Service Set Identifier. Hence, for a computer to have access to a
    particular network, it must have the `SSID` as the other computers in the network.
    This `SSID` is always unique to particular computer networks.

    *   It is possible for there to be transmission by a particular network, across
    different channels. To ensure the seamless communication between several computers
    on a specific network, they must be configured to transmit data via the same channel.

    *   A wireless computer network can have as low as two computers connected by
    wireless network adapters. This network type is referred to as the `ad-hoc made
    network`.

    *   There is also a more sophisticated form of network referred to as the `infrastructure
    mode network`. There is no big deal to the network actually. It merely refers
    to a situation in which a group of wireless computers is connected, and also be
    connected to an already existing cabled network. The connection to the cabled
    network is enabled by the use of a wireless access point (`WAP`).


    With the use of the wireless network, enterprises can cut down on cost of trying
    to introduce cables into buildings and across distances. The very basis of the
    wireless connections are radio waves, which is an implementation that is carried
    out at the physical level of the network’s framework. There are four main types
    of the wireless network (which we will take an in-depth look into, during this
    book):


    *   `LAN`: The wireless local area network; which connects several devices across
    a given location, but without the use of cable. The connection can also be made
    to the internet

    *   `MAN`: The wireless Metropolitan area network; which is the connection of
    several `LANs`

    *   `WAN`: The wireless Wide area network; which is the connection of large areas
    such as cities and towns

    *   `PAN`: The wireless personal area network; which is an interconnection of
    devices over a short span, just for a personal user.

    '
