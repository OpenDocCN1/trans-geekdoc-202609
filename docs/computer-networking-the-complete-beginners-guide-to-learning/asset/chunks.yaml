    # Zigbee Operating Modes and its Topologies


    There are two modes with which data on Zigbee can be transferred, these are the
    non-beacon mode and the beacon mode. In the case of the beacon mode, both the
    coordinators and routers are designed to continuously monitor the state of the
    data coming into the system. Whenever the Zigbee system is in this mode, the routers
    and coordinators are always in a state of activity. This is because there can
    be an awakening of the node for communication, at any point in time. In the beacon
    mode, there is no communication of data from the end devices, when this happens
    the routers and the coordinators are forced into a sleep state. From time to time,
    the coordinators get active and transmits the beacon in the direction of the network’s
    router. The beacon networks are known to work in situations where there is a need
    for communication in lower duty cycles and longer battery usage. The beacon and
    non-beacon types of the Zigbee networks helps in the management of periodic, intermittent
    and repetitive data types.


    There are three main topologies on the Zigbee network, which are; star, mesh and
    cluster tree topologies. All of these topologies are known to always contain one
    or more coordinator.


    ### Star Topology

    In the star topology, the Zigbee network consists of one coordinator. This coordinator
    is responsible for the initiation and management of the various devices situated
    on the network. Devices that communicate directly with the coordinator are known
    as the end-devices. The star topology is a system employed in a network where
    all the end devices are needed to communicate with the central controller. The
    high point about the star topology is that it is very easy to assemble and deploy.


    ### Mesh and Tree Topologies

    In the case of the mesh and tree topologies, there is the extension of the Zigbee
    network with numerous routers, and the coordinator is needed to star them. With
    the adjoining of these devices, there is communication with other adjacent nodes
    to enable the provision of redundancy to the data. If there is ever a failure
    of a particular node, other devices on the network receives this information,
    thanks to the topologies structure. Mesh topology is used mainly in industries
    because there is so much importance placed on redundancy.


    Specifically for the cluster-tree network, every cluster is made of a coordinator
    and several leaf nodes. The coordinators in turn are connected to a parent coordinator
    that serves as the initiator of the entire network.


    # Application of Zigbee Technology


    - **Industrial automation**: This is one major way in which the Zigbee network
    is utilized. It reduces communication cost and it also optimizes the control process,
    making it more reliable.

    - **Home automation**: It is also perfectly adapted for use in the control of
    home appliance, such as light control, appliance control, and control for heating
    and cooling systems as well as other security appliances in the home.

    - **Smart Metering**: The Zigbee remote operation can be used in smart metering
    such as energy consumption response, pricing support, etc.

    - **Smart Grid Monitoring**: Zigbee network can also be used in the operation
    of smart grid systems.


    # WiMax


    WiMax is acronym for Worldwide Interoperability for Microwave Access. It is the
    technology standard that is employed in long-range wireless networking. The use
    of WiMax is effective for both mobile and fixed connections. However, in recent
    times, the use of WiMax has declined, despite being envisioned to be a leading
    form of internet communication and the widely adopted alternative to cable and
    DSL. One factor that has inhibited it wide adoption is the high cost. The technology
    is not a replacement to Wi-Fi, neither is it a replacement for the hotspot technology.
    But if faced with the need to install either of a standard wired hardware as with
    DSL or the WiMax, the latter is cheaper. There are two basic forms of the WiMax,
    which are base stations and the receivers. The base stations are installed by
    service providers used in deploying technology in a particular area. While the
    receiver is the part of the network installed by the client.


    ## Advantages of WiMax

    The network framework is very popular because it comes at a lower cost. It is
    also very flexible in nature. When compared with other internet technologies,
    the WiMax can be installed faster. The installation time is always lower because
    all that is needed are short towers and lesser amount of cable. With the WiMax,
    you can also enjoy voice and video-transferring capacity, alongside telephone
    access. In the areas where it is not economical to execute wired technologies,
    WiMax is the best option.


    ## Disadvantages of WiMax

    With the WiMax, connection strength reduces as the user pulls away from the source.
    Also, WiMax has suffered a decline in popularity, which has caused many mobile
    devices not to have built-in WiMax support.


    # Advantages of Wireless Technology


    Changing right from wired technologies to wireless technologies is just as pertinent
    as it can get for your organization. It is one big step that your facility needs
    to take, and there are many reasons for this. Compared to wired network technologies,
    wireless technologies have some benefits that give them an edge.


    - **Increased Mobility**: This is one of the revolutionary advantage that has
    revolutionized our lives. Now you can get connected to others devices or the internet,
    right from anywhere you are in the world. With the advent of mobile technology,
    mobile users are granted access to information in real-time. Also, if you work
    for a corporate organization, you can access your company’s network, without being
    stuck at a particular location. This way, teamwork and productivity is improved,
    which is near impossible on wired networks.

    - **Installation speed and simplicity**: With the use of the wireless systems,
    there is a reduction in the amount of cable needed. Wired networks are always
    cumbersome to install and setup. Also, the setup of wired networks can be prone
    safety issues, especially post installation. Also, installation of the wireless
    network is as fast as it can get.

    - **It offer wider network reach**: If there are places in your organization that
    cannot be reached by wires, the wireless network comes in handy. Wireless connections
    can extend to just about anywhere you want it to get it.

    - **It is more flexible**: There are always upgrade in technology, and your communication
    systems are bound to suffer from the need for upgrade. If your organization makes
    use of the wired communication network, it may be cumbersome to upgrade. However,
    with the wireless technologies, you can easily upgrade your communication system.
    Update to meet new configurations are very easy to achieve on the wireless network.

    - **Reduced ownership cost over time**: Well, setting up a wireless network at
    first may be costly than the wired network. However, overtime, you will find out
    that it actually costs you lower. Other than the fact that it will stand the test
    of time, it will also save you the stress of always laying new wires and hardware
    when there is the need for upgrade.

    - **Increased scalability**: You can always configure the wireless networks to
    meet some application’s specific requirements. You can easily enact changes and
    scale to this process whenever the need be.


    ## Disadvantages of Wireless Technology

    Despite the fact that with wireless technologies, you can allow different users
    to access a large repository of information with the hassle of running wires,
    there are some downsides to its use.


    - **Cost**: This is one critical factor that puts off people with the use of wireless
    network. They are typically expensive to install and setup. Though this is the
    only time you need to spend much. At setup, you might incur a cost four time more
    than you would with the wired network.

    - **Coverage**

