    # Fast fading (also known as small scale fading) and Slow fading (large scale
    fading)


    Fast fading is the case in which there is a drastic fluctuation in the phase,
    amplitude and multipath delays of the received signal. This is due to the interference
    between several versions of similar transmitted signals that arrive the receiver
    at different periods. There is another factor referred to as delay spread. This
    refers to the period between reception of the first version of the signal and
    the last echoed signal. There are three propagation mechanisms that result in
    fading, these are; reflection, diffraction and scattering.


    Slow fading is as descriptive as it can get. This implies signals that fades away
    very slowly. It is a form of fade that occurs when there is the absorption of
    transmission between the transmitter and receiver. This phenomenon is referred
    to as slow fade because it takes a couple of seconds or minutes for its completion.


    ## Interference


    Every wireless connection has the tendency of suffering from interference. There
    are several sources from which this can emanate, but they are categorized in two:
    adjacent channel interference and co-channel interference.


    In the case of adjacent channel interference, signals in nearby frequencies have
    components not in their local environment. These component therefore have the
    tendency of on-going transmission being interfered by adjacent frequencies. This
    interference can however be avoided by the introduction of guard hands situated
    between the stipulated frequency ranges. The co-channel interference in some cases
    is being referred to as narrow band interference. This interference form is always
    due to nearby systems that resonate on a closely similar transmission frequency.


    ## Doppler shift


    This is another factor that affects wireless communication. This occurs as a result
    of the fading generated in the signal. Doppler shift occurs whenever there is
    movement by the transmitter, relative to the receiver. This movement relative
    to the receiver causes a change in the frequency of the signal. Hence, there is
    a different in the frequency of the signal at the transmitter and the receiver.
    This phenomenon can be easily observed in sound waves.


    A practical way of observing this is in an incoming car. The sound coming from
    the car becomes louder as it approaches you, and grows thinner as it speeds past
    you and away.


    ## Types of Paths


    In the transmission of signals from the transmitter to the receiver, there are
    two main types of path that can be followed. These are; direct-path and multi-path.
    The path followed somewhat influences the extent to which the wireless channel
    characteristics affect the transmitted signal.


    ### Direct-path

    There is no twist to the definition of the direct path. When the transmitted signal
    reaches the receiver directly, it is said to have passed through the direct path.
    There are some components involved in this transmission, and they are called the
    direct path components.


    ### Multi path

    In this case, the signal from the transmitter reaches the receiver having passed
    through different directions. By passing through different directions, the signal
    is subjected to different phenomenon. This transmission is enabled by different
    components referred to as the multi path components. The various phenomenon that
    these signals are exposed to includes; reflection, diffraction and scattering.
    When they finally reach the receiver, there is an alteration in the amplitude,
    frequency and phase. This is unlike what will be achieved with the direct path.


    ## Diversity and its types


    There are different receiver techniques, of which Diversity is a powerful one.
    Diversity as a communication receiver technique makes provision for link improvement
    at a relatively low cost. The main function of the various diversity techniques
    is to result in an overall performance of a fading radio channel. In this system,
    the receiver is provided with several copies of a particular information. These
    signals are then transmitted over two or more real/virtual communication channels.
    Owing to this, it is safe to conclude that the basic concept behind diversity
    s repetition or redundancy of information.


    ### Types of diversity


    There are different types of diversity, which are;


    *   **Frequency diversity**: This is a form of diversity in which the same informational
    signal gets transmitted on several carriers. In this case, the frequency separation
    between the signals is a minimum of the coherence bandwidth.

    *   **Time diversity**: This is a form of diversity in which the informational
    signal is transmitted in sequential intervals. In this case, there should be a
    greater transmit times tan the coherence time. The time interval in this case
    is solely dependent on the fading rate, and this increases with a decrease in
    the fading rate.

    *   **Polarization diversity**: In the case of the polarization diversity, the
    electromagnetic field of the signal bearing the information is modified. This
    leads to an orthogonal type of polarization.

    *   **Angle diversity**: In the case of the angle diversity, the directional antennas
    are used in the creation of independent copies of the signal being transmitted,
    and this is done over multiple paths.

    *   **Space diversity**: Space diversity involves several antennas receiving information
    at different locations they have been placed. This causes different signals to
    be received independently.


    Diversity is a very important aspect of transmission. In most of the cases in
    which diversity is employed, it is the receivers that makes the diversity decisions
    not the transmitter.

    '
