    This technology was somewhat used in the mobile phones earlier in the century,
    however, its usage is now limited to remote controls for televisions, cars and
    audio equipment. It makes use of infrared waves of the electromagnetic spectrum.


    ## Multiple Access Techniques

    Before we delve in the various multiple access techniques there are, a quick look
    at what multiple access means, is pertinent. Multiple access is a technique which
    allows several users to share allotted spectrum in a very effective manner. Due
    to the limitation of the spectrum, there is the need to share, which would ultimately
    improve capacity. This process is executed by allowing for the use of available
    bandwidth by several users at the same time. With respect to computer networking
    and communications, the multiple access allows different terminals to one multi-point
    transmission medium. Hence, there is transmission and sharing over this network.


    ### Frequency Division Multiple Access (FDMA)

    This is the segment of the frequency band that is allotted for wireless cellular
    telephone communication in 30 different channels. Each of these channels conveys
    a voice conversation. The `FDMA` is a fundamental technology employed in the analog
    advanced mobile phone service (`AMPS`). The `AMPS` is the most installed form
    of cellular phone in North America. The very basis of the `FDMA` is that a particular
    channel is only assigned to one user at a time. This is the framework used in
    the Total Access Communication System (`TACS`). On the Digital-Advanced Mobile
    Phone Service, there is also the use of the `FDMA`. However, in this case, there
    is the addition of time division multiple access. This results in three channels
    for each of the `FDMA` channels. Ultimately, this results in the tripling of the
    number of calls that can be handled on the channel.


    ### Time division multiple access (TDMA)

    The Time Division Multiple access technology is sort of a complex one. This is
    because it needs a level of synchronization to exist between the transmitter and
    the receiver. This technology is widely used in the digital mobile radio system.
    This digital cellular telephone communication technology brings about sharing
    of a particular frequency without the advent of interference. The basic functioning
    of this framework is that it divides a particular signal into various timeslots,
    thereby enhancing the data carrying capacity. The various mobile stations assigns
    a frequency for the exclusive use of a time interval. In many cases, the total
    system bandwidth for a period is not assigned to a station. But the frequency
    of the system is subdivided into what is referred to as sub-bands. When this is
    done, `TDMA` is then used for multiple access in each of the sub-bands. There
    are several advantages to the use of `TDMA`. It gives room for very flexible rates.
    Also, it can withstand gutsy and variable bit of traffic. There is no guard band
    needed for the wideband system. There are however some downsides to the `TDMA`.
    It has a high data rate of broadband systems, which need some complex level of
    equalization.


    ### Code division multiple-access (CDMA)

    This is another form of multiplexing which brings about different signals occupying
    a particular transmission channel. The `CDMA` brings about an optimization of
    the available bandwidth. This technology is used mainly in the ultra-high frequency
    cellular telephone systems. This multiplexing technique differs from that of time
    and frequency multiplexing. In this case, as a user, you have access to the whole
    bandwidth for the whole time. This system has a basic principle which involves
    the fact that it codes to distinguish one user from the other. This allows for
    use by users that might count up to about 61, all at the same time. Calls and
    theoretical limits are differentiated by the 64 `Walsh codes`. The maximum number
    of calls is reduced by factors like operational units and quality issues. There
    are four factors that actually affects the capacity of the `CDMA`:

    - Processing gain

    - Signal to noise ratio

    - Voice activity factors

    - Frequency reuse efficiency


    On `CDMA`, users are on different frequencies which are separated by code. This
    means that `CDMA` can always function effectively in the presence of noise and
    interference.


    #### Advantages of CDMA

    - The `CDMA` framework requires a very tight control on power. This means that,
    when a user is close to the base station that is transmitting with the same power,
    the signal will drown. To prevent this, the power on the signals must be higher
    or lower than that of the receiver.

    - The signal reception can be improved by rake receivers.

    - In the case of the `CDMA`, flexible transfer may be used.

    - The `CDMA` framework is designed to reduce interference.


    #### Disadvantage of the CDMA

    - The length of the code must be carefully selected to avoid complications.

    - For proper functionality, time must be properly synchronized

    - Due to the gradual transfer, there is an increase in the use of radio resources,
    which ultimately reduces the capacity of the signal.


    ### Space division multiple access (SDMA)

    This is a satellite communication system which leads to the optimization of the
    radio spectrum usage and also minimizes system cost by taking advantage of the
    directional properties of dish antennas. The Space Division multiple access is
    also known as Spatial division multiplex. The satellite dish in this framework
    has the function of transmitting signals to different places on the earth. One
    fact that you should note is that, for the `SDMA` framework, you need to carefully
    choose the zone for every transmitter. Also, there is the need for a precise antenna
    alignment. If there is any error, it can lead to the failure of one or more channels.
    Also, it leads to interference among the various channels.


    ### Spread spectrum multiple access (SSMA)

    For the spread multiple access, signals are being used once they have a transmission
    bandwidth which has a magnitude that is greater than the minimum RF bandwidth
    required. There are two main types of the spread spectrum, which are:

    - Frequency happed spread spectrum: In this digital multiple access system, the
    carrier frequencies of the individual users vary in a false fashion within the
    scope of the wideband channel. In this case, the digital data is split into similarly
    sized bursts which are subsequently transmitted on several other carrier frequencies.

    - Direct sequence spread spectrum: Of the SSMA types, this is most used for the
    `CDMA`. In this case, each of the users have their code word which is orthogonal
    to the codes of other users. Whenever there is a need to detect the user, the
    receiver must know the code that is being used by the transmitter.


    ## Channel Characteristics

    There are several characteristics of the wireless communication channels. The
    important characteristics are:

    - Path loss: This can be expressed as the ratio of the power of the transmitted
    signals with respect to the power of the same signal being transmitted by the
    receiver, on a particular path. This factor is a function of the propagation distance.
    In designing and deploying wireless communication networks, there is the pertinent
    need to estimate path loss. Also, there are a number of factors that influence
    path loss, examples are: the radio frequency used as well as the nature of the
    terrain.

    - Fading: This is another characteristic of channels. This phenomenon refers to
    a fluctuation in the signal strength when it gets to the receiver. There are two
    main types of fading, which are;

