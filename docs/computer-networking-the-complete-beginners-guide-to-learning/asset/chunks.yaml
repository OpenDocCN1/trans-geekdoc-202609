    The primary function of the receiver is the collection of signals from the channel,
    which is then decoded to form the source signal. This part of the wireless communication
    system is made up of demultiplexing, demodulation, channel decoding, decryption
    and source decoding. The reception path has a framework that makes it just function
    inversely to the transmitter. When there is an incoming signal from the channel,
    it is received by the demultiplexer, which goes on to separate it from other signals.
    Thereafter, there is the demodulation of the individual signals, hence recovering
    the original signal. The channel then functions to eliminate redundant signals.
    With decryption, the signals’ security is removed and then interpreted as a simple
    sequence of bits. There is then the transmission of the signal to the source decoder
    which recovers the original transmitted message.


    # Types of Wireless Communication Systems


    The use of mobile phones has necessitated the need for various services to be
    made available on the go. These services include calls, internet access, multimedia
    and other utilities that are now featured on today’s mobile phones. Thanks to
    the wireless communication systems in place, all these can be performed in real
    time. There are various wireless communications systems out there, however, here
    are the most commonly adopted:


    ## Television and radio broadcasting

    If you are conversant with your history books, you should understand that the
    radio is the first form of wireless communication that was executed. The radio
    broadcasting is a form of Simplex communication system. In this system, there
    is the transmission of information just in one direction, and there is the reception
    of the same data by all users.


    ## Satellite communication

    This is arguably one of the most important form of wireless communication we have
    in the world today. With this form of wireless communication, there is a worldwide
    network connection without it being hindered by population density. This wireless
    communication system offers telecommunication, positioning and navigation, broadcasting,
    internet, etc. Basically everything we need on our smartphones are tied to this.
    Beyond mobile communication, modern television broadcasting and radio systems
    are all dependent on the satellite communication systems.


    ## Mobile telephone communication system

    When it comes to the mobile phone technology, this is the most used communication
    system. With the advent of this technology, there has been a radical transformation
    of the way we do things in the world. The activities that can be performed on
    the mobile phone transcends just making calls, but to features like `Bluetooth`
    connections, `Wi-Fi`, `GPS`, `FM radio`.


    ## Global positioning system (GPS)

    This is somewhat a subcategory of the satellite communication systems. This system
    provides users with services ranging from navigation, to positioning, location
    and even speed. This services are made possible by the `GPS` receivers and data
    from the satellite.


    ## Bluetooth

    This is another low range wireless communication system. The `Bluetooth` framework
    is able to provide data, voice and audio transmission. The transmission range
    of `Bluetooth` is about 10 meters. Basically every computer device (including
    mobiles) are fitted with this technology. Though there has been the innovation
    of faster alternatives, it still remains widely used. Phones, tablets, computers,
    etc. are all fitted with the technology.


    ## Paging

    Do you remember pagers? Yeah, that obsolete mode of communication. By the way,
    are there still people that carry pagers around? I doubt it. The paging technology
    however was a major success back then. This was before mobile phones took over
    the mainstream. This technology functions by relaying information in the form
    of messages. It is also a simplex system.


    ## Wireless Local Area Network

    We have discussed the `WLAN` earlier in this book. It is also a form of wireless
    communication technology. With the aid of the `WLAN`, devices can connect to other
    access points and the internet.


    ## Infrared communication

