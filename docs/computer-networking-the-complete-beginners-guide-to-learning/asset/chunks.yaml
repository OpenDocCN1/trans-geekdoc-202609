    This is a protocol that allows you to operate a particular remote computer right
    from anywhere you are in the world. You can operate the computer, just as though
    you were sitting right in front of it. Once you are logged in, you can control
    your remote computer that is far away from you.


    ## Transmission Control Protocol (TCP)


    This is one of the most important wireless communication protocols. It is also
    basically used for the transfer of data over networks. This protocol set works
    just perfectly with the Internet Protocol (IP), and the duo is referred to as
    `TCP/IP`. While the IP part of the network is meant to address and forward data
    packets from the source to its destination, the TCP takes control of ensuring
    reliability of the transmission.


    ### What does the TCP do?


    As said, the TCP is meant to ensure that transfer of data is as reliable as it
    can get. On the internet, transfer of data is done through packets. Packets are
    data units sent independent of each other on the network. Once these packets reach
    their destination, they are arranged and reassembled. Data transmission on a particular
    network is done in layers, and each of the layers carry out functions that are
    complementary to that of the others.


    The TCP and IP are designed to work hand-in-hand in each layered stack of information.
    TCP is bothered with the control of transmitted data, while IP takes care of the
    channeling on the network. And in the case where there is the presence of Wi-Fi,
    it controls the transmission on the local area network. You should be familiar
    with the basic function of the TCP by now, which is “it is responsible for ensuring
    reliability in the course of transmission.”


    There are some factors which determine how reliable a transmission is. A reliable
    transmission:


    *   Is one in which no packet is lost in transit i.e. they all get to their destination.

    *   Is one in which every delay that affect data quality is eliminated.

    *   Is one in which there is the orderly reassembling of all data packets.


    ### How TCP works


    During any transmission, all packets are labelled (numbered) by the TCP. Other
    than the numbering, TCP also allocates deadline at which all packets must have
    reached their destination. Whenever there is the reception of any packet, the
    source device is notified by a packet known as acknowledgement. When the deadline
    is passed, and there is no acknowledgment received at the source, it sends another
    copy of the packets. With this done, you can be sure of the orderly rearrangement
    of the packets.


    ### TCP Addressing


    Unlike the IP, there is no elaborate addressing system on the TCP. For the IP,
    it is referred to as the IP addresses. The main fact is that, TCP does not need
    to have one. In the TCP framework, it only makes use of numbers that have been
    provided by the device it is working on, for identification of source and recipient
    packets. The labelling numbers are referred to as `ports`. For instance, on the
    web browsers, port `80` is used for TCP. Emails make use of port `25`. This port
    number if also used alongside the IP address, so we can have something like “192.168.66.5.80.”


    ## User Datagram Protocol (UDP)


    Don’t get lost with the several protocols there are, you may not need all of them
    throughout your career. In fact, most of them are as automatic as they can get,
    just doing their thing. Another important protocol is the User Datagram Protocol
    (`UDP`). The `UDP` is the simplest transport layer communication protocol that
    you will ever find on the `TCP/IP` protocol suite. It is called the simplest by
    no mistake, as it comprises of a minimum amount of communication components and
    mechanisms. In some cases, the `UDP` is known to be unreliable. However, it makes
    use of IP services, which sort of optimizes its performance. One glaring shortcoming
    of the `UDP` framework is that the receiver does not create acknowledgments for
    package received, unlike the `TCP`. In fact, the sender does not wait for one.
    This is a really big gap that the framework fails to fill.


    ### Requirements of UDP


    You may wonder why we need to use this framework in wireless communication, when
    there are other reliable alternatives. Well, the `UDP` is mainly used in cases
    where there the various acknowledgment packets use similar bandwidth with the
    original data being sent. For instance, you can use `UDP` while streaming videos,
    as any lost packet will not be noticed.


    ### What are the features of the UDP?


    *   This framework is mainly used in cases where there is no need for acknowledgment
    of data.

    *   Also, in the case where data only goes in one direction, `UDP` comes handy.

    *   It is very simple and adapted for communications based on Query.

    *   It is not connection oriented.

    *   There is no provision of congestion control mechanism.

    *   Delivered data may end up not being ordered.

    *   It is stateless.

    *   It is best adapted for use in streaming applications like the VoIP.


    ### UDP Header


    There are four main parameters of the UDP header:


    *   `Source port`: this is the 16bits information on the `UDP` whose function
    is the identification of the packet’s source.

    *   `Destination port`: This is also a 16 bits information with the function of
    identifying application level service at the particular destination.

    *   `Length`: This is a specification of the whole length of the `UDP` packet.

    *   `Checksum`: This is the parameter that serves as storage for the value of
    checksum generated at the packet’s source before transmission.

    '
