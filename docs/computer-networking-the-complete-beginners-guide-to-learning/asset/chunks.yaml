    # WAP Model

    The `WAP` model is very simple. It involves a user opening the browser on a mobile
    device. He types in the URL of the website he would like to visit in the browser.
    The URL is encoded and then sent to the network with the help of the `WAP` protocol
    via the `WAP gateway`. As the data reaches the `WAP gateway`, the request is then
    translated to a conventional `HTTP` URL request, which is subsequently sent over
    the internet. When the request finally gets to the destination web server, it
    is processed and a response is sent back to the device via the `WAP gateway`.
    The response is sent in form of a `WML` file which can only be viewed by a micro-browser.


    # WAP Architecture

    The peculiar factor about the `WAP` model is that there is the presence of different
    layers. These layers are arranged in a peculiar architecture which fosters the
    actualization of task designed for it. Basically, `WAP` is designed in a layered
    fashion. As a result of the layers, it can be very extensible, as well as being
    flexible. One other factor that makes the `WAP` framework special is that it can
    be scalable. In the paragraphs above, we took a cursory look at the various layers.
    These layers are the very basis on which `WAP` runs.


    # Bluetooth Architecture

    The term `Bluetooth` is probably not new to you, it shouldn’t be. With the use
    of mobile phones and personal computers, `Bluetooth` has been ubiquitous as it
    is one of the earliest form of file sharing over the wireless network. With the
    aid of `Bluetooth`, there is no need for a `USB` cable to transfer files. A simple
    tap and connect will do the trick. However, we aren’t going to discuss the various
    functions of the `Bluetooth` or what you can do with it. The `Bluetooth` is a
    wireless connection concept that many remain in the dark of. The `Bluetooth` framework
    consist of both the hardware aspect and the software aspect. In fact, `Bluetooth`
    is a hardware-based radio system, just as it is a software stack which specifies
    a link between the two architectural layers.


    The main thing about the `Bluetooth` architecture is the protocol stack. It is
    the protocol stack that really defines the working of the `Bluetooth`. This stack,
    just like the `WAP` is a set of layered programs. Each of the layer communicates
    with the layers above and beneath it. This is it, one stack of `Bluetooth` protocol
    has two layers in it. The main layers are the lower level hardware radio system
    and the upper level software stack. It is the upper level software stack that
    specifies the linkage between the two layers.


    ## Lower Stack Layers

    This is the basics of the functionality of the `Bluetooth` framework. The basic
    layer is referred to the `radio layer`, which can also be called the `module`.
    This layer describes the physical features of the transceiver. The main function
    of this layer is the transmission and reception of radio frequencies over the
    `2,4Ghz` band. This is what is referred to as the physical wireless connection.
    This functions by splitting the band of transmission into 79 different channels,
    ultimately providing for fast frequency hopping. This is done for security.


    Right in top of this layer, there is the `baseband` and `link controller protocol`.
    Don’t get confused, the `baseband` has the function of the proper formatting of
    data, which is subsequently of data to and from the radio. It is what brings about
    the definition of the timing, framing, packets and the flow control that exists
    on the link. The `link manager` then brings about the translation of the `host
    controller interface (HCI)` command, from the level of the upper stack, then fosters
    a connection which it thereafter maintains.


    ## Upper stack layer

    This layer of the `Bluetooth` framework is focused on the build of devices that
    are designed to communicate with one another, by leveraging on the core technology.
    The interface between the software and hardware of the system is the `Host controller
    interface`. There is then the `Logical link control and adaptation protocol` which
    is just a level above the `HCI` in the upper stack. The main function of this
    protocol is the fostering of a communication between the two layers of the `Bluetooth`
    stack. It also performs the function of monitoring the source and destination
    of data packets. This is the most critical part of the `Bluetooth` framework.


    Just above the `logical link control and adaptation protocol` layer, the protocol
    stack is not linearly ordered. However, there is a protocol layer referred to
    as the `service discovery protocol`, which has an independent existence. It performs
    the function of interfacing between the `link controller` as well as bringing
    about an interoperability between two `Bluetooth` end devices.


    # MOBITEX

    Have you ever heard of the term `MOBITEX` and wondered what it meant? Well, if
    you are an enthusiast, you should have found out more about what the term means.
    Just as we have the `WAP` and `Bluetooth` architecture, there is also the `MOBITEX`
    architecture. It is a wireless network architecture that fosters a framework for
    the fixed gadget needed run wireless terminals in a packet-switched, radio-based
    communication system.


    The `MOBITEX` framework has three major components. These are; radio base station,
    the `MX switch` and the `network management center (NCC)`. This framework was
    first developed in 1984 by `Eritel`, which was a subsidiary of `Ericsson`. The
    `radio base station` has the function of transmitting for each single cells up
    to a distance of `30km`. the `base stations` go on to carve out a coverage area,
    as well as determining the network capacity. This is the basis of the communication
    over mobile phones. Your phone gets connected to the nearest `MOBITEX` source
    to you, and there is no problem of connection when you change location. This technology
    is less expensive than the circuit-switching technology.


    The `MOBITEX` packets have a limitation of `512 bytes` of data. Each packet that
    is transmitted contains information of its source as well as destination. Efficiency
    in the use of the packet-switching technology comes from the fact that the packets
    can be transported in any direction and in any order. When all the packets then
    get to the destination, the packets are rearranged into the right order.


    The `MX switches` are another component of the `MOBITEX` framework. This mainly
    controls the communication routes to and from the base solutions. It also controls
    the communication between wireless and fixed devices. The various switches can
    be rearranged in hierarchy, into groups according to regions and areas.


    # CDPD

    This is shorthand for `Cellular Digital Data`, and it is a specification that
    is used in the support of wireless connection to the internet as well as other
    public packet-switched networks. The various mobile phones and modem that offer
    the `CDPD` support bring about internet connection to a speed of `19.2kbps`. The
    `CDPD` is an open specification which strictly adheres to the framework of the
    `Open System Interconnection` model. This utility is also able to extend in the
    future. `CDPD` as a framework can offer support for the following; internet’s
    protocol, `ISO connectionless Network Protocol` and `IP multicast service`. With
    the multicast framework, a broadcast of updates can be fostered to the sales and
    service section of an organization. In the case of mobile users, a persistent
    link can be avoided since there is `CDPD`’s support for packet-switching. This
    way, a particular broadcast channel can be used by different users at the same
    time. When the connection is made, the modem of a user is able to decipher and
    accept the packet meant for it. For instance, when there is an email coming in,
    it is directed immediately towards the user without the need for a circuit connection.
    The `CDPD` architecture exists simultaneously with the `AMPS` network, which makes
    it able to support both data and vocal communication. Features of the `CDPD` technology

