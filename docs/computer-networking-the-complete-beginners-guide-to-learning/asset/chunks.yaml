    有些路由协议提供了网络链路映射的完整细节，而另一些则仅允许路由器根据较少的信息工作。


    # 路由协议的分类

    路由协议主要分为三大类。


    ## 距离矢量路由协议

    这些协议旨在帮助（基于跳数）选择在特定网络上从特定方向到达目的地的最佳路径。此类协议中的某些协议是动态的，这使得它们在功能性能上是最优的。其中之一就是 `RIP`。在这个框架中，跳数是指源网络和目标网络之间存在的各种路由器。在所有可能的路径中，跳数最少的路径被选定为最佳路径。


    #### 特性

    - 网络更新定期交换

    - 更新总是广播的

    - 此框架中的路由器基于邻居路由器提供的信息做出决策。


    #### 缺点

    - 信息的定期交换大多数时候会导致不必要的流量

    - 交换也会导致安全问题

    - 定期广播网络大多数情况下会产生不必要的流量。


    ## 链路状态路由协议

    与其他协议不同，这些路由协议对互联网络有更多了解。它们也被称为 `SPF`（最短路径优先）。一个例子是 `OSPF`。


    #### 特性

    - 该协议中的更新只有在拓扑发生变化时才能启动。

    - 仅交换邻居路由器请求的更新。


    该路由协议维护三张表，分别是：

    - `Neighbor table`（邻居表）：这是作为路由器邻居信息存储表。

    - `Topology table`（拓扑表）：这是包含整个拓扑信息的表，包括数据包可以采取的最佳和备份路由。

    - `Routing table`（路由表）：网络上最佳路由的数组。


    ## 高级距离矢量路由协议

    这在某种程度上是混合，是链路和矢量路由协议的结合。此类路由协议的一个示例是`增强内部网关路由协议`。


    # 网络路由协议的类型

    如上所述，所有路由协议分为三类。有几种路由协议使得无线和有线网络有效运行。这些是：


    ### 路由信息协议

    这是在局域网和广域网中广泛使用的路由网络。缩写为 `RIP`，其功能基于距离矢量算法。该协议自 1988 年定义以来，到此后有两个版本。你现在可以使用任何一个版本。


    ### 内部网关路由协议

    这种路由协议由 `CISCO` 制作，用于路由器中交换独立系统内部的路由数据。


    ### 开放最短路径优先

    这是一种用于互联网协议的活动性路由协议。它是链路状态路由协议的一个示例，包含了所有主要的内部网关协议组。该协议主要用于具有大型网络的公司。


    ### 外部网关协议

    这是互联网的终极路由协议，由 Eric C. `EGP` 在 1982 年指定。它最初在 `RFC827` 中表示，但在 1984 年的 `RFC 904`
    中得到了正确规范。该网络路由协议的拓扑结构类似于树。


    ### 增强内部网关路由协议

    这是另一种距离矢量路由协议，但它配备了先进技术以减少拓扑发生变化时出现的不稳定性。它享受基于 `DUAL` 工作的通用优化，以及无环操作。该网络协议还提供了一种快速连接的方法。


    ### 网关协议

    这些是在互联网上核心网络路由协议，负责维护互联网协议表，该表旨在允许 `AS` 内部的网络访问能力。


    ### 中间系统到中间系统

    这是一种伟大的协议，网络设备用它来决定最佳路由，将数据报在交换网络上从一端传输到另一端。这个过程就是所谓的路由。


    # 网络安全协议

    网络安全协议是确保传输数据安全、可靠的网络安全协议。这些协议旨在保护网络免受非法用户的侵害。


    ## HTTPS

    这是用于保护流量的协议。它旨在保持发送的信息安全。


    ## 防火墙

    这是电子商务中常用的协议，用于保护支付网关和服务器。如果这些受到攻击，将影响多个用户。


    防火墙有三大类：

    - `Packet filter`（包过滤）：负责通过通过网络接口的数据。此时需要的信息是 `IP-address`、`port numbers` 和目的地。你可以轻松地在你的无线网络上安装和实现此防火墙。优点是它可以很容易维护，但提供的保护水平很低。

    - `Filter circuit`（电路过滤）：这是防火墙安全的中间水平。它设计用于监控客户端和外部主机接接处的协议活动，检查请求的会话是否有效。这种防火墙并不贵，最适合保护私有网络。

    - `Application-level`（应用级）：为你的网络提供最高级别的防火墙保护。然而，它的设计更复杂，且需要额外成本。


    ## IPSEC

    这是一种在网络层加密数据的安全协议。其中嵌入了三个主要协议：

    - `authentication header`（认证报头）：提供数据源认证、数据完整性以及防止重复消息的安全保护。

    - `encapsulating secure payload (ESP)`（封装安全载荷）：旨在为载荷提供验证和完整性，但对 `IP` 头不做。

    - `internet key exchange (IKE)`（互联网密钥交换）：它的主要功能是解决密钥分配协议的问题。


    ## PCT

    这是 `Private Communication Technology` 的缩写，其基本工作原理类似于 `SSL`。`PCT` 和 `SSL` 的唯一区别是传输消息的大小。与
    `SSL` 相比，`PCT` 的消息更小。像 `Microsoft Explorer 3` 这样的浏览器使用了 `PCT`。


    '
