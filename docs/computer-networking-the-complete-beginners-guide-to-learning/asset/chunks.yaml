    These factors combined to birth the evolution we have today as the World Wide
    Web. This is the most significant breakthrough in technology in the 20th century,
    and it has opened a whole new world to the global community. The internet is now
    facilitating Businesses, education, culture, finance, entertainment, and many
    other aspects of life.


    ## Social Media on the Internet

    The internet opened the door for many other innovations, with innovators coming
    up with majestic ways to make use of the internet. This brought a whole new way
    of making money. Various structures and infrastructures popped up rapidly on the
    internet. This period of rapid development is referred to as the dotcom bubble.


    After the dotcom bubble and in the early 21st century, there was the birthing
    of a whole new world. A world where the very natural way of life of humans – the
    social aspect, can be fostered. Humans are social animals, and with dotcom innovations,
    this aspect was brought online. The very first in this line was the creation of
    `Friendster` in 2002. This brought about a social-technical revolution, and in
    no time, several platforms that allowed for real-time interaction and communication
    amongst people.


    In the earlier stage of communication on the internet, mails were the order of
    the day. However, social network sites have transcended what the emails could
    offer. Now, we have fully established companies in this stream of innovation;
    `Facebook`, `Instagram`, `WhatsApp`, `Twitter`, `Tiktok`, Etc.


    ## New Media (Mass Communication)

    With the advent of the internet, we have had a new form of media referred to as
    the New Media. New media is a term that is used in the description of the content
    that is produced by the use of several forms of electronic communications, aided
    by computer technology. New media is premised on the idea of interaction, and
    this is made possible by the internet.


    Basked in the concept of new media, we have websites, online video/audio, streams,
    emails, online social platforms, online forums, online communities, blogs, web
    advertisement, etc. This new form of media might not easily be separated from
    the old media, with the only distinction being that the internet serves as an
    outlet for the new media.


    # Chapter 5: Wireless Network Computer Architecture

    Wireless network is a whole broad concept that has revolutionized the way we do
    things. It has totally caused an overhaul over the whole connection of computers.
    Earlier in this book, we have seen the various components used to foster the wired
    networks. Similar components are also needed for the wireless networks.


    Of the overall computer network infrastructure in the world, the wireless networks
    contribute only to a portion. Irrespective of how limited this infrastructure
    is, attention is needed to ensure that functionality is ensured. In this chapter,
    we will be taking a close look at the various components of the wireless communication.
    Will also consider the wireless application protocol, its models and its architecture.
    Further, we will delve into the architecture of `Bluetooth`, `MOBITEX`, `CDPD`
    and `I-MODE`. Read on.


    ## Components of Wireless Communication

    Wireless communication has become an intrinsic part of the way we relate with
    other humans. This is thanks to the rapid development and significant innovations
    over the past few decades. A world where there is no need for wires to aid the
    transmission of data from one point to another. Wireless communication has made
    the exchange of data and information as easy as it can get. There are the various
    types which include; radio broadcast, infrared, satellite, microwave and `Bluetooth`.
    Some of these will be discussed in the following chapter. Here are the components
    that make up the basic infrastructure of the wireless communication network;


    ### Users

    This is the most vital part of the wireless communication network. This factor
    does not necessarily mean a human entity. Users simply mean any entity that makes
    use of the wireless network, directly. Of course, the most common types of users
    are people. But as said earlier, being a user is not limited to this scope. The
    user can also be a robot, which receives an instruction over a wireless network,
    right from a central computer which controls a manufacturing process. Basically,
    the wireless network is to serve the user, hence, the main beneficiary of the
    wireless network is the user. This makes them really critical in the scope of
    things on the wireless network.


    The user has the ability to initiate and terminate the use of a wireless network,
    hence it is safe to also refer to users as “end-users.” Whoever operate the computer
    that is designed to perform a variety of application specific tasks, with the
    wireless network being the interface, is a user. Users of a computer network can
    either be static or mobile. The ability to make use of the wireless networks on
    the move is one reason why they are so popular. This is a limitation on the part
    of the wired network. It is very possible for an individual to make use of the
    school `Wi-Fi` while moving through the campus. There is also the case in which
    a computer is operated over a wireless network for an indefinite period of time.
    This might take place in an office or a location with faster internet connection.


    ### The Computer Devices

    This is another important component of the wireless network. This are referred
    to as the clients, existing upon the wireless network. On a wireless network,
    there are different computers devices based on the function they perform on the
    network. There are some that are basically for the end-users, while there are
    others that are end systems. Computer devices are able to communicate with each
    other over the same wireless network.


    The various end systems on a wireless networks are servers, databases and websites.
    These end systems are containers with a repository of information that can be
    viewed end-users in different locations.


    On the part of the users, any device can be adapted and used in accessing the
    information desired. For instance, a user can buy and install a wireless network
    interface card (`NIC`) within his laptop. When this installation is done, he is
    able to operate on a particular type of wireless network. The various computer
    devices always have an operating system that differentiate them. There are different
    operating systems (`OS`), which include; `windows`, `LINUX` and the `Mac OS`.
    The main function of the operating system is to drive the software that is utilized
    in the realization of the network applications.


    ### NICs

    This is known as the Network Interface card and it has been discussed earlier
    in the course of this book. It is a very important part of the wireless network,
    just as it is on the wired network. These devices are mainly plugged into the
    computer system, however, in some cases, they can also remain as an external device.


    ### Air Medium

