    - It makes use of a voice only mode of service

    - The access technique is the frequency division multiple access


    ### Disadvantages of 1G

    - Due to interference, there was poor voice quality

    - The battery life was very poor

    - The mobile phone had large size

    - It featured less security

    - There was limitation on the number of users and cell coverage

    - Roaming on the `1G` network was not possible


    ## 2G – The Second Generation Communication System


    The advent of `2G` marked the start of the new digital technology. It was also
    referred to as the `Global system for mobile communication`. `GSM` technology
    soon became the standard for the development of the wireless communication. It
    was able to support up to `14.4` to `64kbps` data rate. This enabled `SMS` and
    email services on mobile devices.


    ### Features of 2G

    - It supported `SMS` services

    - It made roaming possible

    - There is enhanced security on the network

    - There is encrypted voice transmission

    - It supported internet, though at a lower data rate


    ### Disadvantages of 2G

    - The data rate is very low

    - There is a limitation in mobility

    - It has less features

    - There was still a limit to the number of users


    ## 2.5G and 2.75G system


    Briefly, in the bid of supporting data rate, there was the `General Packet Radio
    Service` (`GPRS`). This was capable of data rate up to about `171kbps`. There
    was also the development of `EDGE`. This is the `Enhanced Data GSM Evolution`,
    which was able to improve data rate for `GSM` networks. It had a maximum speed
    of `473.6kbps`. Subsequent to `EDGE`, there was also the `CDMA200`, which supported
    higher rates on the `CDMA` networks. With this technology, data rate climbed up
    to `384 kbps`.


    ## 3G – Third Generation


    This generation of network began with the introduction of the `UMTS` (`Universal
    Mobile Terrestrial/ Telecommunication Systems`). This generation was able to support
    vide calls, as it operated at a rate of `384kbps`. It was after the release of
    the `3G` that we had smartphones become popular in the world. The smartphones
    were designed to handle tasks like the multimedia message, email, video calls,
    games, social media and other advanced functions.


    ### Features of 3G

    - There is an increased data rate

    - It supported video calling

    - There is enhanced security

    - It was able to support mobile app

    - There was also support for multimedia messages

    - It supported tracking of location as well as maps.

    - It offered better web browsing

    - TV streaming

    - It supported high quality 3D games


    ## 3.5G to 3.75 Systems


    There were two subsequent developments to the `3G` network. It was sort of a development,
    as the `3.5G` network was able to support up to `2mbps` data rate. The `3.75`
    system also offered more speed. There was the ultimate development of the `3.9G`
    system, which is also known as the `LTE` (`Long term Evolution`).


    ### Disadvantages of 3G

    - It had a very expensive spectrum license

    - The infrastructures were very costly

    - It needed higher bandwidth for proper data support

    - The mobile devices that supported it were very costly


    ## 4G – Fourth Generation communication system


    This is the enhanced version of `3G`, it offered higher data rate and it was able
    to handle multimedia functions. It was very easy to deploy as it was compatible
    with devices that supported the previous communication generations. Data rate
    is highly improved in `4G`, which aided the simultaneous transfer of video and
    audio data. The `IP` packets of `4G` is able to transfer any form of services.
    Transmission technologies like `WiMax` was introduced on `4G` system. This enhanced
    the rate of data, as well as the performance of network.


    ### Features of 4G

    - Data rate could reach up to `1Gbps`

    - It features enhanced security and mobility

    - There is a drastic reduction in latency

    - It supported higher definition video streaming and gaming


    ### Disadvantages of 4G

    - It needed expensive hardware and infrastructure to run

    - The spectrums were very costly

    - Global deployment of the technology has proven to be time consuming


    ## 5G – Fifth Generation Communication System


    This is a proposed wireless network undergoing development. The establishment
    of the network has begun in some part of the world, and it is designed to deliver
    ultra-fast internet and multimedia experience for users. In the case of `5G`,
    millimeter waves and unlicensed spectrum will be used for the transmission of
    data. This is a massive data rate to be experienced, and to enable the use of
    things, a complex modulation is being developed. Another feature of `5G` is the
    cloud based architecture. Cloud computing has become a thing in the world, and
    its astounding benefits are being leveraged in the development of the next generation
    network. Cloud computing will increase it analytical capabilities.


    ### Features of 5G

    - Internet data speed can reach `10Gbps`

    - There is reduced latency even in milliseconds

    - There is a reduction in data cost

    - It provided higher security and a reliable network

    - It makes use of technologies like small cells, this brings about improved efficiency

    - The cloud based architecture offers it more power, maintenance and easy hardware.
    As stands, there seem to be no downside to the use of `5G`.


    ## Cellular System Architecture


    The architecture of the cellular system is as basic as it can get. There are three
    main parts that constitute, which are:

    - A network of cells, of which each has its base station

    - A packet switched network that is used for communication between the mobile
    switching centers and the base stations

    - The Public switched telephone network: it serves the function of connecting
    subscribers to the wider


    ### Mobile switching centers


    This is a network switching subsystem which belongs to cellular phone system.
    This is also referred to as the mobile switching office (`MTSO`). One unique feature
    of the `MTSO` is the fact that all base stations are connected to `MSC`. The `MSC`
    has the following functions:

    - It fosters the setup of calls as well as their release

    - It helps with routing of calls and messages that are sent via `SMS`

    - It is used in the management of conference calls and calls left on hold

    - It is also used for fax services

    - It is used in billing

    - It is used in interfacing with other networks.


    ## Elements of a Communication System


    What do you know about communication, either between a person and computer or
    between a computer and another computer? Communication between components didn’t
    just come to be, there are elements that work in sync to make sure is possible.
    There are different types of communication, which include; radio broadcasting,
    television broadcasting, radio telegraphy, mobile communication, computer communication,
    etc. Here are the basic components that make up the communication systems


    ### Information source


    Communication networks are designed to ensure that information is sent from a
    sender and received at the end of the receiver. For there to be communication,
    information source is important. It is where the information originates, without
    which there will be no communication in the first place. The information emanating
    from the source may be sound, picture, words, etc. whenever you talk to someone
    over the phone, you are the information. In this case however, the information
    source is situated at both ends. It is a dialogue, and the sound is sent through
    the system whenever each responds.


    ### Input transducer


    During communication, sound is the information being sent. This however cannot
    transmitted over a long distance. In this case, there is a need for the sound
    to be transmitted into electrical signals or light signal. This is achieved by
    the transducer. When the information gets to the destination, it is then converted
    back to sound. Basically, a transducer has the function of converting one form
    of energy to another. To make sure that sound in sent and received in real form,
    there is a transducer at both ends of the communication line. The output transducer
    simply converts the light energy back to sound energy.


    ### Transmitter


    In the communication system, there is the transmitter which is responsible for
    the conversion of signal produced at the source, into a form that can be transmitted
    through a channel. The main technique used by the transmitter is the modulation.
    When the transducer converts the sound into electrical energy, the transmitter
    than modulation converts it to a form that can be transmitted via the channel.
    This is basically the function of the transmitter – modulation.


    ### Communication channel


    This is the medium which fosters the transmission of a signal from one point to
    another. There are two main mediums of transmission, which can be wired or wireless.
    This has been extensively explained.


    ### Noise


    Noise is a phenomenon that interferes with the signal.


    ### Receiver


    The receiver is the part that receives the signal.

