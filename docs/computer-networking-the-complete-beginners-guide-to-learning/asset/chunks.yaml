  fmt: '# Chapter 12: Computer Network Security


    One thing became synonymous with the wireless networks – hacks! Here and there,
    you hear of cases of data being compromised and unauthorized individuals finding
    their way into computer networks. This is no news in the cyberspace. In fact,
    according to the official annual cybercrime, it is estimated that cybercrime will
    cost us about $6 trillion by 2021. As of 2015, we suffered from $3 trillion being
    lost to cybercrime. This is to tell you how much you need to secure computer networks
    you engineer. There is no point structuring a system and it can be easily compromised.
    When it comes to cybercrime, not only money is involved. There is the theft of
    data, information, access and many other things unauthorized crave to do on your
    system. Earlier in this book, we have discussed the various security protocols
    we have and how best they can be used. In this chapter, we will take a further
    look at the security problems your computer network is bound to face, and how
    best you can tackle them. Hackers are always on the watch, and are ready to compromise
    a system if the management slacks for a bit. There is so much to know about the
    security of your computer network, and it’s only right to pay close attention
    as we move through all you need to know.


    ## Common Security Threats


    Security issues faced by computer networks are massive. Computer networks are
    prone to facing several advanced problems that can force a shutdown, however,
    let’s take a quick look at basic security threats a computer network faces.


    ### Computer Virus

    There is arguably no one in the world that can lay claim to the fact that they
    don’t know what a virus is. It is a plague that has affected several personal
    computers, as well as computer networks. Especially if you make use of the internet,
    viruses are the easiest way for your computer to get damaged. According to reports,
    about 33% of household computers get affected by malware of one type or the other.
    Viruses are simply software that spread across a computer network, which go on
    to corrupt and destroy data stored on the system. Viruses are known to find their
    way into the computer system, either through email attachments, or they are downloaded
    mistakenly. They can also find their way into the systems via USB, or other cables
    connected from another device.


    ### Rogue security software

    This is a new technique with which scammers and digital hackers find their way
    into the computer system. The system of hacking takes advantage of people’s fear
    of viruses. They offer virus solutions, and once you accept the offer, it leads
    to your system being compromised. They either tell you that your system is infected
    with a virus, or you should pay for a tool to protect your system. Either way,
    it’s only a trick to disrupt the functioning of your system.


    ### Trojan horse

    Remember the case of the Trojan horse in Troy? This is the concept represented
    here. It is simply a situation in which a malware hides behind legitimate software,
    to find its way into the system. In fact, this may come in as email from people
    you know. Once you click on the attachment, the malware finds its way into your
    computer. Once this virus finds its way into your computer, it can save your password
    by logging the various keystrokes. It can also compromise your webcam, or cart
    away a copy of sensitive data stored on the system.


    ### Phishing

    This process is similar to that of the Trojan horse. It is a social engineering
    method, which has an ultimate goal of collecting passwords, usernames and credit
    card numbers. The software comes in the form of legitimate mails, but when downloaded
    to the computer, they are automatically installed.


    ### DOS and DDOS attack

    DOS means Denial of Service, while DDOS means Distributed Denial of Service. DOS
    is such that, a particular server based website is attacked simultaneously by
    traffic from a particular computer. This causes the server of the website to experience
    downtime, as it becomes overloaded. It simply works by a single computer IP loading
    out different packets on to a particular web address, rather than a single packet.
    This system of attack can easily be traced, and intercepted, hence, there is the
    evolution of DDOS. In the case of the DDOS, rather than a single computer being
    used, it makes use of different computers, which could number from just 2 to thousands.
    This is more difficult to stop and more lethal.


    ### Rootkit

    This is a combination of software tools which can grant a user administration-level
    access over a particular network. Once this access is secured, the malware situated
    in the collection carry out various compromising activities on the computer or
    network. In this collection, there are key loggers, password stealers and antivirus
    disablers. Rootkits have a basic way of functioning, just like the Trojan horse
    security threat. It comes with a legitimate software, which requires changes to
    your OS. Once this installation is done, the rootkit installs itself and awaits
    activation from the hacker.


    ### SQL Injection attack

    Storage servers for websites and app mainly use SQL. To compromise this system,
    there is the evolution of the SQL injection attacks. These attacks are designed
    to target applications that make use of data. Any loophole found in the systems
    on which such application is hosted, is exploited. This is one of the most dreaded
    threat to computer systems in recent times.


    ### Man-in-the-middle attacks

    This is a sort of network compromise, in which the hacker can listen in on users.
    If there are two targets, the hackers are able to eavesdrop on the communication
    line between both. These conversations normally should be private and/or encrypted,
    however, this breaches that.


    ## How do network viruses spread?


    Spreading of viruses on computers can be so spontaneous, as it can occur via email
    attachments, boot infections and program infectors. These are simply the basic
    ways in which viruses spread on the computer. There are other lethal processes
    through which viruses spread:


    - Infection from network

    There are different types of the computer networks, and the way viruses spread
    on the different types are similar. The basic purpose of the various networks
    is to share software and other information between two or more computers. Over
    networks, there is the sharing of files, and in this process, there is the possibility
    of viruses being shared with the files. In recent times, the common cyber-attacks
    have been targeted towards big tech companies. This is in the bid of disrupting
    their services. In most of these cases, DOS is employed. This functions in such
    a way that, the hackers have viruses infected across computers of various users.
    Then at a specific time, there is a launch of the combined attack towards the
    target. During these hacks, users will notice that their computers perform some
    activities without their knowledge. In defense of these attacks, firewalls are
    to be used. With an advanced up-to-date firewalls, launching these attacks becomes
    more difficult.


    - Other infection processes

