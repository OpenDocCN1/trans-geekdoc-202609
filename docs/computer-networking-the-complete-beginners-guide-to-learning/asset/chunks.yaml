    # Chapter 2: Wired Network Technology


    In recent times, wireless technologies have taken over the mainstream of how we
    connect, and how we connect computers. However, there is still wired technology
    in adoption. If not anything, think of the use of the `HDMI` cord in connecting
    projectors to the screen. Think of the use of the `USB` cord to connect your phone
    to your computer. These are just a few examples of the various ways in which wired
    technology is still being used.


    It is possible to wonder why this technology is still in use, why can''t we switch
    to wireless connections across all devices. Well, with the advent of `5G`, more
    devices will switch to the wireless connection, but the chances of that eradicating
    wireless connection may somewhat be impossible. The chances of wired technologies
    persisting longer remain. The use of wired technology comes with its advantages
    and disadvantages, which will be looked at in this chapter.


    ## Wired Network Technology


    Connections between devices that are other than wireless are all wired. These
    connections are designed to involve the use of cables, while wireless connections
    are carried via radio waves and frequencies. With a physical cable, data is being
    transferred between different devices and computer systems.


    Wired networks are the common type of wired configurations out there. The vast
    majority of the wired cables out there make use of the `Ethernet` cable to foster
    the transfer of data between points. An example of a simple wired connection is
    when a router is connected across computers. On a more extensive network, several
    routers and switches are involved, to foster the overall connection of all devices
    on the network.


    With the use of cable on a wired network for the internet, a computer is connected
    to a cable modem, a `T1` line or other types of internet connection. This then
    provides the internet data to all the other devices connected across the network.
    Wired network technology also involved some peripheral connections, of which the
    connection of keyboards and mice with `USB` fall under. Though some of these connections
    are wireless already, there are still wired connections.


    On the flip side, the connection between monitors and external drives is not categorized
    as wired networks. This is because there are no alternative wireless connections.
    You can only have wired connections for these, for now. It''s simple; a connection
    is only categorized as a wired network if there are wireless alternatives. Other
    peripheral wired, as said earlier, are now wireless.


    However, some users prefer the use of the wired ones, which is due to some perceived
    advantages over the wired ones. One such advantage is seen in the `Ethernet` connections.
    When you are using the internet over an `Ethernet` connection, it is not prone
    to signal interference. However, with the `Wi-Fi`, this is possible and happens
    a lot. It might seem hard to believe, but wired connections are always faster
    than the wireless counterparts. This is because there is a faster transfer of
    data through the mechanical medium than there is with the electromagnetic mediums.
    So, if you are browsing, it is faster with the `Ethernet` cable than with `Wi-Fi`.


    Also, with wired peripheral devices, you need not replace components or the device
    as a whole, frequently. On the wireless mouse, you are always required to replace
    the batteries. This doesn''t happen with the traditional wired mouse. Another
    advantage is in the case of heavy-duty activities like gaming. Gamers prefer to
    use wired mouse and keyboards than the wireless one, all in a bid to reduce latency
    to zero. Wireless gears are prone to latency, which is not possible with the wired
    gears.


    ## Types of Wired Network Media


    Wired connection is always done with the use of a media, and there are three common
    types of these:

    *   Twisted-pair cable

    *   Coaxial cable

    *   Fiber-optic cable


    There are slight differences in how these wired medium function and they are all
    adapted to different functions. For the twisted-pair media, they accept signals
    and data in the form of electric current, while the optic-fiber cables receive
    theirs in the form of light.


    ### Twisted-pair cable


    This media is composed of two conductors, and each of these conductors is coated
    with insulators, while twisted together. These wires function differently, as
    one is used for the conduction of signals to the receiver, while the other is
    used for ground reference. One downside to the use of this cable type is that
    it is prone to interference and cross-talks that can bring about unwanted signals
    in the transmission.


    There are two main types of the twisted pair cable, which are:


    *   **Unshielded twisted pair cable**: These are known to consist of two insulating
    copper wires. The copper wires in this cable pair are coiled around one another
    in a helical form. This causes a reduction in the electrical interference from
    a similar pair. These wires are always colored to aid the identification of the
    various wires. These wires are known to be of a high-speed capacity, and the high-grade
    models are used extensively in `Ethernet` technologies. However, these wires are
    unfortunately of a lower bandwidth, especially when compared to the `Coaxial`
    cables. And it is very prone to interference.

    *   **Shielded Twisted Pair Cable**: These cable types are made of metallic foil
    or braided meshes. The metal casing around the wires helps it reduce electromagnetic
    noise. This also prevents cross-talk, offers more speed the unshielded and coaxial
    cables. Either it is analog transmission or digital transmission, these wires
    can be effectively used. The downside is that manufacturing is not easy.


    ### Coaxial Cable


    This cable goes by this name due to the presence of two conductors arranged such
    that they are parallel to one another. In this cable, copper is used as the central
    conductor, while a layer of `PVC` surrounds it. The use of metallic as the outer
    wrap is to prevent noise and keep off other conductors. The outer conductor, in
    this case, is wrapped in an insulating sheath.


    The use of `coaxial` cable comes with its benefits. If you are looking for the
    best cable for telephone lines, this is the best. These cables can transmit digital
    signals at a very high speed of `10Mbps`. Another high point to the use of this
    cable is that there is an improved level of noise immunity, as compared to other
    cables. Thanks to the improved shielding of the cable, it can travel long distances
    at a very high speed. There is, however, some downside to these cables. The whole
    network is prone to failure at the failure of a single cable. Also, you can experience
    the ground loop, especially if the shielding is not perfect.


    ### Fiber optic cable

    '
