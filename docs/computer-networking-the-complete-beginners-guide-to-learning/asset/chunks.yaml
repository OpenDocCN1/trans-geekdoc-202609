    This type of bridging connect several networks, and they also operate transparently.
    This is to decide a frame-to-frame basis with which traffic is being forwarded.
    This system is also needed to determine the destination to forward traffic. Just
    like the simple bridging, the multiport system also makes use of the store and
    forward operation. The multiport bridge function is performing the role of network
    switching.


    ### Methods of Forwarding

    Forwarding is the process with which the bridge passes a data link next frame
    from the source to its destination. Four forwarding methods can be used by a bridge,
    which are;


    * **Store and forward**: In this method, the frames are buffered and verified
    before they are being forwarded. In this case, however, the entire structure is
    first received before it is passed to its destination.

    * **Cut through**: For the cut through, the switch begins forwarding the frames,
    immediately it receives information on the destination. This method is fast but
    is devoid of error checking. However, when there is too much traffic on the outgoing
    port, then it falls back to the store and forward method. Another case where the
    bridge reverts to the store and forward method is when there is a higher speed
    of processing at the egress port than the ingress port.

    * **Fragment free**: This method is crafted to maximize the advantage of both
    of the initially stated methods. This bridge checks for the first 64 bytes of
    the frame. It is in this first 64 byte that the address information is stored.
    According to specifications by Ethernet, collisions should also be detected in
    this span. Hence, whenever there is a collision in the first 64 frames, the frame
    will not be forwarded. Error checking is however left for the end device.

    * **Adaptive switching**: This is a more advanced method in which the bridge automatically
    chooses between any of the methods above.


    ### Networking Topologies

    You might wonder what network topologies are. It is merely a term used in the
    description of the schematic depiction of the arrangement of a network. It is
    used to describe the various ways in which nodes are connected. Here is a rundown
    on the different ways in which computers are connected to a network.


    #### Bus Topology

    In the bus topology, all the computers on the network are connected to a single
    cable. When this connection is made such that there are only two endpoints, then
    it is referred to as the Linear Bus Topology.


    ##### Features of Bus Topology

    * The bus topology ensures the transmission of data in only one direction.

    * In this connection, all computers are connected to a single cable.


    ##### Advantages of the Bus Topology

    * The bus topology as we know it is very cost-effective.

    * This topology system makes use of the least amount of cable, unlike the others.

    * This is sufficient for small networks.

    * A layperson can easily understand this system.

    * You can also quickly expand on this network.


    ##### Disadvantages

    * Once there is a problem in one part of the cable, the whole network is down.

    * At the advent of traffic on the network, the entire network will have a slowed-down
    performance.

    * There is a limit to the strength of the cable.

    * This topology is not as speed effective as the ring topology.


    #### Ring Topology

    Just as the name implies, the connection between the computers causes them to
    end up forming a ring. The very last of the computer in this ring is then connected
    to the first. In this connection, each computer gets to have two neighbors.


    ##### Features of the Ring topology

    * In the ring topology several nodes, repeaters are used.

    * The transmission, in this case, is unidirectional. There are some cases it can
    also be bidirectional, with the presence of 2 connections between each network
    node. This is called the Dual ring topology.

    * For the dual ring topology, there is the formation of two ring networks. Here,
    data flows in the opposite direction. When there is the failure of one ring, the
    second ring gets to act as the backup. This way, the network doesn’t crash, which
    is unlike the bus topology.

    * There is the transfer of data in sequence. The data transmitted in this network
    passes through each node of the network until it gets to the destination.


    ##### Advantages of ring topology

    * High traffic, in this case, does not affect the transfer of data. This is because
    transmission of data is only possible at nodes with tokens.

    * This system of computers is very cheap to install.


    ##### Disadvantages of Ring Topology

    * It is not easy to troubleshoot this network of computers.

    * When there is the addition or removal of computers, network activity is always
    disturbed.

    * When one computer fails, it disrupts the whole network.


    #### Star Topology

    In the star topology, computers are connected to the cable through a single hub.


    ##### Features of the star topology

    * There is the presence of a dedicated connection to every node.

    * The hub is also the repeater that allows for data flow.

    * The star topology can be used with twisted pair, Optical fiber or coaxial cable.


    ##### Advantages of Star Topology

    * You can be sure of fast performance on this connection, as there are few nodes
    and reduced traffic.

    * You can easily upgrade the hub.

    * It is not difficult to troubleshoot.

    * You can easily set this system up, or modify it.

    * When one node fails, it does not affect the other nodes.


    ##### Disadvantages of Star Topology

    * Installing this system is not cost-effective.

    * Usage is also expensive.

    * Since there is a dependency on the hub, once the hub fails, the network stops.

    * Performance of the system is based on the hub, which in turn is dependent on
    its capacity.


    #### Mesh Topology

    This is a point connection to nodes or devices. Every node is connected to the
    other. The Mesh technology has two main techniques, which are;


    ##### Mesh Topology: Routing

    In the system of routing, there is a custom logical system used, which is based
    on the requirements of the network. One way is to ensure that data reaches its
    destination through the shortest possible channel. There is also how the routing
    logic is aware of any broken link in the network and makes sure to steer clear
    of such breaks. It is also possible to create a logic routing that can repair
    the broken nodes.


    ##### Mesh Topology: Flooding

    In this case, the same information is transmitted to all the nodes on the network.
    This cuts the rope on the need for a routing logic. This network is somewhat robust,
    and data security is more ensured. However, loads pile on this network.

