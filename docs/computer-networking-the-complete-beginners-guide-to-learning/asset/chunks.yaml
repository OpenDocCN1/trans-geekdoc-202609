    # Features of the Mesh Topology

    - There is a full connection between every device

    - It is a very robust networking system

    - It is not flexible


    ## Advantages of Mesh Topology

    - Each connection is designed to be the Carrier of its load of data

    - It is robust

    - You can easily identify faults

    - There is the provision of security and privacy


    ## Disadvantages of Mesh Topology

    - Installation and Configuration is complicated

    - The cost of cable acquisition is much

    - You will need bulk wiring


    # Tree Topology

    In this system of computer networking, there is a root node to which all other
    devices are connected to. This brings about hierarchy. Another name for this system
    is "hierarchical topology." For a connection to be categorized like this, there
    must be the presence of at least three hierarchy.


    ## Features of the tree topology

    - This is the best system of connection in workstation

    - This is preferably used in a Wide Area Network


    ## Advantages of Tree Topology

    - This is an extension of the bus and star topologies

    - Whenever you want it, you can expand on the nodes

    - This network system can be easily managed and maintained

    - You can quickly carry out error detection


    ## Disadvantages of Tree Topology

    - There is a massive volume of cable needed

    - It is a costly network to set up

    - Whenever you add more nodes, the cost of maintenance is upped

    - When the central hub fails, the whole network is gone


    # Hybrid Topology

    The Hybrid Topology can be somewhat tricky, as it is slightly a system of two
    topologies that each emanate from two or more topologies.


    ## Features of hybrid topology

    - There is a combination of two or more topologies

    - It always inherits the upside and downside of the topologies involved


    ## Advantages of hybrid topologies

    - This is a reliable format as you can easily detect errors

    - It is very effective

    - It is very scalable


    ## Disadvantages of hybrid topologies

