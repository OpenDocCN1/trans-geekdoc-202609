    \ are somewhat useful; however, they merely provide essential protection and have\
    \ limitations. One such limitation is that they are unable to determine if the\
    \ content of the request that is incoming will have an adverse effect on the destination\
    \ application. In the case where a virus is coming in from a trusted source, these\
    \ firewall types will never know. The good news, however, is that there are advanced\
    \ firewalls that will never miss such. \n\n*   Next-generation firewalls (NGFW):\
    \ These are firewalls that are a combination of both traditional firewall technology\
    \ and some other functions like encrypted traffic inspection, intrusion prevention\
    \ systems, anti-virus, and many more. One primary function that is found in the\
    \ next-generation firewall is the \"deep packet inspection\" (DPI). The essential\
    \ firewalls discussed earlier will only search through the packets' headers, these\
    \ go beyond to inspect the data contained in the packet. This enables users to\
    \ easily identify, categorize, and obstruct packets that are virulent. \n\n* \
    \  Proxy firewalls: This functions by filtering network traffic at the application\
    \ level. However, unlike the necessary firewalls, it acts as an intermediary between\
    \ two end systems. In this case, there must be a request from the client to the\
