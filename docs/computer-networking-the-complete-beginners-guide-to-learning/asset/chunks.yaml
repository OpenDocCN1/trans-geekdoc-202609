    # 部署无线局域网


    如今实施无线网络已如菜就饭一样简单。它完全消除了跨距离使用线线的需求。在部署无线技术时，你需要做的第一件事是确认你想要使用的无线网络标准。你不能随意的选择任何标准，因为它必须能够支持你的网络接入点、路由器，以及用于计算机和网络资源的无线网络网卡。


    ## 广域网 (WAN)


    这是一种地理位置分布的私有网络电信网络，促进了两个或多个局域网（`LAN`）之间的连接。请记住，`LAN` 只是较短距离内的计算机连接。然而，`WAN` 是一个更广泛的网络。一个极好的例子是考虑一家拥有总部和其他分机构以及其他一些联动设施的企业。`WAN`
    将连接在这些地点建立的各种 `LAN` 之间。不同 `LAN` 之间的连接是通过使用 `router`（路由器）或网关设备来实现的。`WAN` 主要用于企业之间，它允许应用程序、服务和其他集中资源的运行。得益于
    `WAN` 框架，消除了在企业不同地点安装相同应用程序服务器的需求。与 `LAN` 不同，`WAN` 不限于特定地点。这是因为 `WAN` 是建立在 `LAN`
    之上的，而 `LAN` 可以独立位于不同的地方，无论距离远近。


    虚拟专用网络（`VPN`）确保了 `WAN` 上的连接安全性。有不同类型的 `VPNs`，它们被用于不同的情况。`IPsec-VPN` 最常用于对点（site-to-site）连接，例如建立在分公司和总部之间的连接。`SSL-VPNs`
    的使用更为常见，因为它允许个人进行远程访问。由于 `VPN` 确保了个人通过网络上传输的数据经过加密，这种访问是可能的。除了这些 `VPNs` 之外，还可以使用线性光纤。与其他的不同，它提供了更好的性能、可靠性和安全性。通常情况下，企业无法负担这种类型的连接费用。


    ### WAN 连接类型及其工作原理


    `wan` 连接可以是有线的，也可以是无线的。在有线 `WAN` 服务中，你可以找到多协议标签交换、`T1s`、载波以太网（Carrier Ethernet）以及商业大带互联网链路。另一方面，无线
    `WAN` 可以采用 `4G LTE`、`5G`、公共 `Wi-Fi` 和卫星网络。对于大多数企业来说，有线网络连接仍然是首选。然而，得益于 `4G` 和
    `5G`，无线连接正在获得关注，有线连接过时只是时间问题。


    运行 `WAN` 框架所需的基础设施可以是私有所有的，也可以由第三方提供服务。第三方包括电信运营商、互联网服务提供商（ISP）、私有 IP 网络运营商和电缆供应商。广域网的运行可以通过完全所有权或共享所有权的方式实现。


    对于混合 `WAN` 框架，结合了私有网络和公共网络服务。为了方便企业的使用和部署，软件定义广域网（`SD-WAN`）正在设计中。有了这一框架，企业可以快速地部署、操作和管理他们的系统。软件平台或用户用户设备（`CPE`）可以执行两个主要功能。这些功能的实现益于虚拟化、现场
    `SD-WAN` 设备、网络叠加层和应用层策略的结合。这些功能是：


    - 多个私有和公共 `WAN` 链路的聚合

    - 根据流行状况自动为流量选择最优路由。


    为了实现第二个功能，当网络管理员希望将流量重路由到多个路由时，他们需要手动重新配置他们的网络。


    ## WAN 优化


    广域网的性能可能会受到很大打击，主要由延迟和带宽限制引起。为了应对，创建了 WAN 优化设备。这些设备通过几种技术工作。这些技术是：去重、压缩、协议优化、本地缓存和流量整形。此外，通过
    `SD-WAN` 或 `CPE` 平台，你可以获得更高水平的性能控制。通过提供低成本的带宽连接来实现。这是通过商业模式连接互联网实现的。得益于流量整形和旨在维护服务质量的工具，可靠性得到了保障。


    ## WAN 安全


    `WAN` 框架的安全性需要本地化。它应该扩展到终端用户所在地，即使他们是从家里使用网络。如果你打算使用 `WAN` 网络，你需要使用 `firewall`（防火墙）和防病毒软件。通过这些工具，你可以防止他人或其他设备的未经访问或黑客攻击。`VPN`
    是允许连接到 `WAN` 的系统，但它提供了额外的加密层，可以实现匿名性。最好通过 `VPN` 连接到 `WAN`。无论如何，使用 `VPN` 连接到 `WAN`
    都是最好的。无论在何处进行连接，`VPN` 的使用都是至关重要的。安全性需要加强，特别是当你参与其中时。记得以前有黑客通过访问员工的家庭电脑进入了微软系统。通过这种方式，他通过
    `VPN` 回到了微软总部。


