- "# 计算机网络：学习网络安全、计算机架构、无线技术和通信系统基础初学者指南（包含 Cisco、CCENT 和 CCNA）\n\n\n\n![](img/rsrc7.jpg)\n\
  ![](img/rsrc7.jpg)\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n# 引言\n\n\
  你对计算机了解多少？你对计算机网络又了解多少？世界正在发生着变化。技术每天都在进化，计算机领域的互联为我们留下了一个相互作用的巨大系统和机器网络。计算机技术之所以强大，是因为它所促进的互联。从你的手机开始，你就可以与桌面式电脑进行交互。这种连接以许多不同的方式同时进行。得益于网络，计算机已经变得无处不在。它是我们\
  \ 21 世纪生活的基础。世界已经改变了，你要么跟上时代，要么最终陷入无知。跟上形势动态是你所能做的最好的事情。技术已经超越了它改变我们生活的角色，它已经成为\
  \ 21 世纪生活的真正基石。这一切始于一台巨大的机器，无数跨越不同距离的电线连接在一起。现在，这完全是带宽和更先进网络的问题。计算机世界有许多需要理解的内容，其中最广泛的是整个计算机网络。计算机网络是指为了资源共享而连接的计算机集合。这个定义是最基础的。然而，不要被它迷惑了；定义定义之下隐藏着许多复杂之处。计算机网络是一个完整的世界；在这个世界里很容易被其震撼。本书摘录了作者在该领域的海量知识，并经过语法上的拆解，以促进你易于理解。本文涵盖了从需要理解的所有要素元素到各种功能、无线系统、通信，以及更高级的概念。尽管有修饰计算机网络世界的各种框架和结构，本文旨在对最简单的词汇组合提供完美的理解。通过从头到尾阅读这本书，无论你的起点如何，你对计算机网络的知识都将达到专业水平。这将是一段漫长但愉快的旅程。来吧。你好，世界！\n\
  \n## 计算机网络定义：整体概念\n\n### 什么是计算机网络？\n\n计算机网络简单是指计算机网络的形成。计算机网络可以定义为连接（有线或无线）的计算机、打印机和其他设备，最终目的是促进设备之间的通信。创建这种设备连接的过程被称为计算机网络。从技术上讲，计算机网络是指在称为节点点之间传输和交换数据的过程，数据通过共享系统携带，并在信息系统中执行。计算机网络的整个概念不仅包括网络的设计、构建和使用。它还涉及相关基础设施、软件和底层策略的技术管理、维护和运行。在计算机网络中；系统、终端和其他设备可以通过局域网（`LAN`）或更广泛的网络连接。在这种情况下，较大的网络是互联网和私立广域网（`WAN`）。每个利益相关者（服务提供商、企业和消费者）在确保资源有效共享方面都发挥着作用。这个利益相关者系统提供了服务的有效使用和提供。一旦系统涉及对远程位置控制和信息的响应，它只能通过一种计算机网络来实现。从拨接电话电话、互联网电影流到物联网，计算机网络实现了这一切。特定网络的复杂程度决定了操作和维护它所需的技能水平。例如，如果一个企业拥有许多节点并还有其他安全检查（如\
  \ `end-to-end encryptions`），则需要高级的技术管理来对其进行有效监督。这与学校计算机实验室使用的局域网不同。\n\n## 网络组件\n\
  \n计算机联网需要许多基础设施来实现无缝运行。不同类型的网络结构需要不同的部分。这些将在本书中进行详细介绍。计算机网络需要物理网络基础设施，包括但不限于；`switches`、`routers`、`wireless\
  \ access points`等。还会有一些底层固件使这些基础设施能够正常运行。除了物理系统外，还部署了所需的软件来监控、管理和保护网络。对于高级网络，需要标准协议，这些协议旨在执行许多离散的功能。这些协议还用于通信不同的数据类型，无论底层硬件如何。例如，在电话系统中，IP\
  \ 语音（`VoIP`）可以将 `IP` 电话流量从一点传输到另一点，只要这些点支持该协议。这与浏览器中发生的情况类似，`HTTP` 提供了访问的门户。此外，在基于\
  \ `IP` 的网络上，通过 `IP` 协议传输数据和服务。\n\n### 网络组件定义\n\n如前所述，创建网络需要安装硬件组件。基础元素是 `Cables`、`Hubs`、`Switch`、网络接口卡（`NIC`）、调制解调器和路由器（`routers`）。在无线网络中，不需要电缆；因此它被消除了。计算机网络所需的组件是：\n\
  \n*   `Network Interface Card (NIC)`\n*   `Hub`\n*   `Switches`\n*   `Cables`\n\
  *   `Router`\n*   `Modem`\n\n计算机网络从简单到复杂不等。然而，它们都使用相同的设备和规则：\n\n*   `Network Interface\
  \ card (NIC)`：也称为网络适配器。这是一个允许计算机与网络中其他设备通信的设备。该框架利用编码在卡芯片上的唯一硬件地址（`MAC addresses`）。数据链路协议随后使用\
  \ `MAC addresses` 来发现网络上的其他系统，以便向正确的方向传输数据。网卡有两种类型：有线和无线网卡。对于有线网卡，使用电缆和其他连接器传输数据。然而，对于无线网卡，使用无线电频率技术。现代笔记本电脑硬件中具备这两种网卡。\n\
  \n*   `Hub`：这是一种计算机网络组件，主要功能是将网络连接分到多台计算机。它类似于分配中心。当计算机从网络请求信息时，应用程序通过电缆传输到集线器。当集线器接收到命令时，会被发送到整个系统。完成后，网络上的每台计算机都由自己判断信息是否为自己。集线器在计算机网络中使用曾非常重要。但最近，它们正在被淘汰。它们现在被改进的通信系统（如\
  \ `switches` 和 `routers`）所取代。\n\n*   `Switch`\n\n\n\n\n\n# 交换机\n交换机属于计算机网络组件类别的电信设备。交换机基本上是为了取代集线器（hubs），但它们具有更先进的系统。这与那种将信息发送到网络上每台计算机并让其自行判断信息归谁中心不同。`Switch`\
  \ 利用物理设备的地址，然后用该地址将信息传递到正确的目的地。它不是将其发送到每台计算机，而是直接传输到目的地或端口。得益于 `switch`，源和目的之间建立了直接连接。这极大缩短了处理时间。这就是为什么在当今计算机网络中，我们体验到了更快的数据连接和处理。集线器和交换机有一些共同特征，即：多个\
  \ RJ-45 端口、电源和连接指示灯。\n\n## 线缆与连接器\n电缆可以同时传输介质和通信。有线网络利用特殊的电缆来连接特定网络上的不同计算机。连接类型有，包括：\n\
  - 双绞线：它们被分为不同的类别；1、2、3、4、5、5E、6 和 7。最后三种是高速电缆，数据传输速度达到 1gbps 或更高。\n- 同轴电缆：这些更像是电视的安装线。它们比双绞线更贵；因此提供了更快速的数据传输。\n\
  - 光纤：这些是利用光束通过玻璃光纤传输数据的高速电缆。这些电缆是顶尖的数据传输门户，尤其是与其他电缆类型相比。这些电缆速度极快，但非常昂贵。这些电缆只能由政府购买和安装。\n\
  \n## 路由器\n路由器是计算机网络生态系统中的常用术语，很容易忽略它的定义。许多人使用它，叫出它的名字，却并不确切知道它的作用和工作原理。`Router`\
  \ 是用于连接局域网与互联网的设备。`Router` 是用于让局域网内多台计算机共享单一互联网连接的设备。在某些情况下，路由器内部也存在交换机。现代路由器现在以具有自定义交换机而闻名。因此，购买路由器时你不需要购买交换机，特别是如果局域网仅用于家庭或小型企业。路由器有两种类型；有线路由器和无线路由器。\n\
  \n## 调制解器\n调制解器是使你的计算机通过现有电话线连接到互联网的设备。就像 `NIC` 一样，调制解器没有集成在计算机的主板上。它是一个独立的设备，一旦插入主板上的\
  \ `PCI` 插槽就会连接到设备。从本质意义上说，调制解器并不意味着局域网。它仅仅是将计算机连接到互联网。有几种调制解器类型。这些调制解器类型之间的主要区别是速度和传输率。它们：\n\
  - 标准 PC 调制解器或拨号器\n- 蜂窝调制解器\n- 电缆调制解器\n- DSL 调制解器\n\n## 网关\n网关通常被误认为与路由器相同。然而，两者是不同的。网关可以被定义为一种数据通信设备，促进了与主机网络连接的远程网络的提供服务。网关的设计目的是为超出主机网络节点范围的远程网络或自治系统提供通信。简单来说，网关可以被定义为特定网络的入口和出口。进出特定计算机网络的每条数据首先都会与网关交互。这样它们就可以被使用路由路径。路由器被归类为网关设备，因为它们的设计是为了为计算机网络执行此功能。计算机网络（`LAN`\
  \ 或 `WAN`）的范围总是有限的。它们基本上可以轻松与系统中的其他计算机交互。每当需要与另一个计算机或另一个系统上的节点交互时，就需要网关。路由器是特定的，它们是计算机网络与互联网通信的门户。网关可能是通往另一个局域网的门户。除了数据包的路由，网关还被设计为拥有主机网络内部路径和其他网络学习路径的信息。当网络节点需要与另一个外部网络通信时，数据包必须通过网关。然后网关将数据路由到正确的目的地。\n\
  \n## 网络桥接\n网络桥接是计算机网络设备，旨在创建来自不同通信网络的网络聚合。这一过程被称为网络桥接。这可能与路由混淆；然而，它们存在根本性的区别。路由作为一个过程涉及不同网络之间的通信，同时它们保持独立。然而，桥接由独立网络之间的通信组成，以一种描述单一性的方式进行。当一个或多个连接的网络是无线的时，就使用了无线桥接这一术语。网络桥接有三种类型：简单桥接、多端口桥接和学习桥接。\n\
  \n### 学习型或透明桥接\n在透明或学习桥接中，使用一个名为转发信息库表来控制网络网段之间的帧。在网络启动时，表是空的，但随着帧的接收，表随后会被填充。每当在表中找不到目的地址时，帧会被传输到其他端口。它们被泛洪到除发源端口以外的所有端口。在这一泛洪过程中，目标网络上会创建一个主机，随后会创建一个转发条目。为了完成这一过程，需要知道源地址和目的地址。源地址记录在表中，而目的地址则在表中进行查找，然后匹配到发送帧的正确网段。该系统被设计成某种过滤器。当读取帧的目的地时，桥接器决定下一步操作是转发还是过滤。只有当目的地位于另一个网段时，桥接器才会传输数据。然而，当目的地与其位于同一区域时，它会被过滤掉。这种过滤过程防止数据进入另一个网段；它是无关的。这项技术早在\
  \ 1980 年由数字设备公司开发。这种类型的桥接可以在具有两个端口的设备上运行。\n\n### 简单桥接\n在简单桥接的情况下，两个网络连接在一起。这种连接通过透明操作实现，桥接器根据帧决定将哪些信息从一个系统转发到另一个。简单桥接过程尽可能简单，利用了存储和转发模型。在传输过程中，会对源网络进行验证，并在目标网络上产生\
  \ `CSMA/CD` 延迟。这种桥接器的另一个影响是在桥接器每侧创建一个冲突域。这有助于大幅减少冲突。\n\n### 多端口桥接\n\n\n\n\n\n这种类型的桥接连接了多个网络，而且它们也以透明的方式运行。这是为了决定以帧为基础进行流量转发。该系统还需要确定转发流量的目的地。与简单的桥接一样，多端口系统也利用了“存储和转发”（store\
  \ and forward）操作。多端口桥接功能充当网络交换的角色。\n\n### 转发方法\n转发是桥接将数据链路帧从源端传递到目的地的过程。桥接可以使用四种转发方法，如下：\n\
  \n*   **存储和转发 (Store and forward)**：在该方法中，帧在转发之前会进行缓存和验证。然而，在这种情况下，在将其传递到目的地之前，会先接收整个结构。\n\
  *   **直通 (Cut through)**：对于直通模式，交换机在接收到目的信息后立即开始转发帧。这种方法很快，但缺乏错误检查。然而，当输出端口的流量过大时，它会回退到存储和转发方法。另一种桥接退回到存储和转发方法的情况是出口端口的处理速度高于入口端口。\n\
  *   **无分片 (Fragment free)**：这种方法旨在最大化前述两种方法的优势。这种桥接检查帧的前 64 字节。地址信息就存储在前 64 字节中。根据以太网规范，在这个范围内也应该能检测到冲突。因此，每当在前\
  \ 64 帧中发生冲突时，帧将不会被转发。然而，错误检查留给了终端设备处理。\n*   **自适应切换 (Adaptive switching)**：这是一种先进的方法，桥接会在上述任何方法之间自动选择。\n\
  \n## 网络拓扑结构\n你可能奇怪什么是网络拓扑。它仅仅是一个用于描述网络安排示意图描述的术语。它被用来描述节点连接的各种方式。以下是计算机连接到网络的不同方式概述。\n\
  \n#### 总线拓扑 (Bus Topology)\n在总线拓扑中，网络上的所有计算机都连接到单根电缆上。当这种连接只有两个端点时，它被称为线性总线拓扑。\n\
  \n##### 总线拓扑的特征\n*   总线拓扑确保数据仅以一个方向进行传输。\n*   在这种连接中，所有计算机都连接到单根电缆上。\n\n##### 总线拓扑的优点\n\
  *   我们所熟知的总线拓扑非常有成本效益。\n*   这种拓扑系统使用的电缆最少，与其他不同。\n*   这对于小型网络来说足够了。\n*   外行人士可以轻松理解这个系统。\n\
  *   你还可以快速扩展这个网络。\n\n### 缺点\n*   一旦电缆的一个部分出现问题，整个网络就会宕机。\n*   当网络流量流量流量时，整个网络的性能都会缓慢。\n\
  *   电缆的强度有限制。\n*   这种拓扑在速度效率上不如环形拓扑。\n\n#### 环形拓扑 (Ring Topology)\n正如其名，计算机之间的连接使得它们最终形成一个环。环中的最后一台计算机连接到第一台计算机。在这种连接中，每台计算机有两个邻居。\n\
  \n##### 环形拓扑的特征\n*   在环形拓扑中使用了多个节点和中继器。\n*   在这种情况下，传输是单向的。在某些情况下，由于每个网络节点之间存在两个连接，它也可以是双向的。这被称为双环拓扑。\n\
  *   对于双环拓扑，形成了两个环形网络。在这里，数据以相反的方向流动。当一个环发生故障时，第二个环将充当备份。这样一来，网络就不会崩溃，这与总线拓扑不同。\n\
  *   数据按顺序传输。在该网络中传输的数据通过网络的每个节点，直到到达目的地。\n\n##### 环形拓扑的优点\n*   在这种情况下，流量不会影响数据传输。这是因为只有在令牌存在的情况下传输数据。\n\
  *   这种计算机系统安装非常便宜。\n\n##### 环形拓扑的缺点\n*   这种计算机的故障排除并不容易。\n*   当添加或删除计算机时，网络活动总是受到干扰。\n\
  *   当一台计算机故障时，会影响整个网络。\n\n#### 星形拓扑 (Star Topology)\n在星形拓扑中，计算机通过单一集线器连接。\n\n#####\
  \ 星形拓扑的特征\n*   每个节点都有一个专用连接。\n*   集线器也是允许数据流的中继器。\n*   星形拓扑可以使用双对线、光纤或同轴电缆。\n\n\
  ##### 星形拓扑的优点\n*   由于节点较少且流量较小，这种连接可以确保快速性能。\n*   你可以轻松升级集线器。\n*   故障排除并不困难。\n*\
  \   你可以轻松设置或修改此系统。\n*   当一个节点故障时，不会影响其他节点。\n\n##### 星形拓扑的缺点\n*   安装此系统没有成本效益。\n\
  *   使用成本也昂贵。\n*   由于依赖集线器，一旦集线器故障，网络就会停止。\n*   系统的性能取决于集线器，而集线器又取决于其容量。\n\n####\
  \ 网格拓扑 (Mesh Topology)\n这是节点或设备之间的点连接。每个节点都与其他连接。网格技术有两种主要技术，如下：\n\n##### 网格拓扑：路由\
  \ (Routing)\n在路由系统中，使用了基于网络需求的自定义逻辑系统。一种方法是确保数据通过最短通道到达目的地。路由逻辑还可以感知网络中的任何断开链路，并确保避开此类断开。还可以创建一个可以修复损坏节点的逻辑路由。\n\
  \n##### 网格拓扑：泛洪 (Flooding)\n在这种情况下，相同的信息传输到网络上的所有节点。这消除了对路由逻辑的需求。这种网络相当稳健，数据安全也得到了更多保障。然而，这会给网络带来巨大负担。\n\
  \n\n\n\n\n# 网状拓扑的特点\n- 每个设备之间都存在全连接\n- 这是一个非常稳健的网络系统\n- 它不灵活灵活\n\n## 网状拓扑的优点\n-\
  \ 每条连接都设计为承载其数据负载的媒介\n- 它非常稳健\n- 你可以轻松地识别故障\n- 它提供了安全性和隐私保护\n\n## 网状拓扑的缺点\n- 安装和配置非常复杂\n\
  - 缆线的采购成本高昂\n- 你需要大量的布线\n\n# 树型拓扑\n在这样的计算机网络系统中，有一个根节点，所有其他设备都连接到该节点上。这带来了分级结构。该系统的另一个名称是“分层拓扑”。要使连接被归类此类结构，必须至少存在三个层级。\n\
  \n## 树型拓扑的特点\n- 这是工作站连接的最优系统\n- 它优先用于广域网\n\n## 树型拓扑的优点\n- 它是总线和星型拓扑的扩展\n- 只要你需要，就可以对节点进行扩展\n\
  - 这个网络系统可以很容易地管理和维护\n- 你可以快速进行错误检测\n\n## 树型拓扑的缺点\n- 需要海量的电缆\n- 建立这种网络的成本很高\n- 每当你添加更多节点时，维护成本就会增加\n\
  - 当中央集线器故障时，整个网络就会崩溃\n\n# 混合拓扑\n混合拓扑可能有些复杂，因为它类似于是由两种拓扑组成的系统，每种拓扑又源自两个或多个拓扑。\n\n\
  ## 混合拓扑的特点\n- 它是两种或多种拓扑的结合\n- 它总是继承所涉及拓扑的优点和缺点\n\n## 混合拓扑的优点\n- 这是一个可靠的格式，因为你可以轻松检测错误\n\
  - 它非常有效\n- 它具有很好的扩展性\n\n## 混合拓扑的缺点\n- 安装和配置非常复杂\n- 缆线的采购成本高昂\n- 你需要大量的布线\n\n# 第一章：计算机网络类型\n\
  混合拓扑可能有些复杂，因为它类似于是由两种拓扑组成的系统，每种拓扑又源自两个或多个拓扑。这是根本区别，而且这一切对我们都至关重要。\n\n## 局域网 (LAN)\n\
  混合拓扑可能有些复杂，因为它类似于是由两种拓扑组成的系统，每种拓扑又源自两个或多个拓扑。这是根本区别，而且这一切对我们都至关重要。这是根本区别，而且这一切对我们都至关重要。\n\
  \n### 局域网的节点\n混合拓扑可能有些复杂，因为它类似于是由两种拓扑组成的系统，每种拓扑又源自两个或多个拓扑。这是根本区别，而且这一切对我们都至关重要。\n\
  \n## 广域网 (WAN)\n混合拓扑可能有些复杂，因为它类似于是由两种拓扑组成的系统，每种拓扑又源自两个或多个拓扑。这是根本区别，而且这一切对我们都至关重要。\n\
  \n\n\n\n\n# 部署无线局域网\n\n如今实施无线网络已如菜就饭一样简单。它完全消除了跨距离使用线线的需求。在部署无线技术时，你需要做的第一件事是确认你想要使用的无线网络标准。你不能随意的选择任何标准，因为它必须能够支持你的网络接入点、路由器，以及用于计算机和网络资源的无线网络网卡。\n\
  \n## 广域网 (WAN)\n\n这是一种地理位置分布的私有网络电信网络，促进了两个或多个局域网（`LAN`）之间的连接。请记住，`LAN` 只是较短距离内的计算机连接。然而，`WAN`\
  \ 是一个更广泛的网络。一个极好的例子是考虑一家拥有总部和其他分机构以及其他一些联动设施的企业。`WAN` 将连接在这些地点建立的各种 `LAN` 之间。不同\
  \ `LAN` 之间的连接是通过使用 `router`（路由器）或网关设备来实现的。`WAN` 主要用于企业之间，它允许应用程序、服务和其他集中资源的运行。得益于\
  \ `WAN` 框架，消除了在企业不同地点安装相同应用程序服务器的需求。与 `LAN` 不同，`WAN` 不限于特定地点。这是因为 `WAN` 是建立在 `LAN`\
  \ 之上的，而 `LAN` 可以独立位于不同的地方，无论距离远近。\n\n虚拟专用网络（`VPN`）确保了 `WAN` 上的连接安全性。有不同类型的 `VPNs`，它们被用于不同的情况。`IPsec-VPN`\
  \ 最常用于对点（site-to-site）连接，例如建立在分公司和总部之间的连接。`SSL-VPNs` 的使用更为常见，因为它允许个人进行远程访问。由于 `VPN`\
  \ 确保了个人通过网络上传输的数据经过加密，这种访问是可能的。除了这些 `VPNs` 之外，还可以使用线性光纤。与其他的不同，它提供了更好的性能、可靠性和安全性。通常情况下，企业无法负担这种类型的连接费用。\n\
  \n### WAN 连接类型及其工作原理\n\n`wan` 连接可以是有线的，也可以是无线的。在有线 `WAN` 服务中，你可以找到多协议标签交换、`T1s`、载波以太网（Carrier\
  \ Ethernet）以及商业大带互联网链路。另一方面，无线 `WAN` 可以采用 `4G LTE`、`5G`、公共 `Wi-Fi` 和卫星网络。对于大多数企业来说，有线网络连接仍然是首选。然而，得益于\
  \ `4G` 和 `5G`，无线连接正在获得关注，有线连接过时只是时间问题。\n\n运行 `WAN` 框架所需的基础设施可以是私有所有的，也可以由第三方提供服务。第三方包括电信运营商、互联网服务提供商（ISP）、私有\
  \ IP 网络运营商和电缆供应商。广域网的运行可以通过完全所有权或共享所有权的方式实现。\n\n对于混合 `WAN` 框架，结合了私有网络和公共网络服务。为了方便企业的使用和部署，软件定义广域网（`SD-WAN`）正在设计中。有了这一框架，企业可以快速地部署、操作和管理他们的系统。软件平台或用户用户设备（`CPE`）可以执行两个主要功能。这些功能的实现益于虚拟化、现场\
  \ `SD-WAN` 设备、网络叠加层和应用层策略的结合。这些功能是：\n\n- 多个私有和公共 `WAN` 链路的聚合\n- 根据流行状况自动为流量选择最优路由。\n\
  \n为了实现第二个功能，当网络管理员希望将流量重路由到多个路由时，他们需要手动重新配置他们的网络。\n\n## WAN 优化\n\n广域网的性能可能会受到很大打击，主要由延迟和带宽限制引起。为了应对，创建了\
  \ WAN 优化设备。这些设备通过几种技术工作。这些技术是：去重、压缩、协议优化、本地缓存和流量整形。此外，通过 `SD-WAN` 或 `CPE` 平台，你可以获得更高水平的性能控制。通过提供低成本的带宽连接来实现。这是通过商业模式连接互联网实现的。得益于流量整形和旨在维护服务质量的工具，可靠性得到了保障。\n\
  \n## WAN 安全\n\n`WAN` 框架的安全性需要本地化。它应该扩展到终端用户所在地，即使他们是从家里使用网络。如果你打算使用 `WAN` 网络，你需要使用\
  \ `firewall`（防火墙）和防病毒软件。通过这些工具，你可以防止他人或其他设备的未经访问或黑客攻击。`VPN` 是允许连接到 `WAN` 的系统，但它提供了额外的加密层，可以实现匿名性。最好通过\
  \ `VPN` 连接到 `WAN`。无论如何，使用 `VPN` 连接到 `WAN` 都是最好的。无论在何处进行连接，`VPN` 的使用都是至关重要的。安全性需要加强，特别是当你参与其中时。记得以前有黑客通过访问员工的家庭电脑进入了微软系统。通过这种方式，他通过\
  \ `VPN` 回到了微软总部。\n\n\n\n\n\n# 第二章：有线网络技术\n\n最近，无线技术已经占据了我们连接方式以及连接计算机的主流。然而，有线技术仍然被广泛采用。无论何如何，想想一下使用\
  \ `HDMI` 线将投影仪连接到屏幕的情况。想想使用 `USB` 线将手机连接到电脑的情况。这些只是有线技术仍被使用的各种方式中的少数几个例子。\n\n人们可能会好奇，为什么这项技术仍在在使用，为什么我们不能将所有设备切换到无线连接呢。嗯，随着\
  \ `5G` 的出现，会有更多设备切换到无线连接，但彻底消除无线连接在某种程度上是不可能的。有线技术长期存在的可能性依然存在。有线技术的使用有其优点和缺点，本章将对其进行介绍。\n\
  \n## 有线网络技术\n\n除无线以外的设备连接都是有线连接。这些连接设计为使用电缆，而无线连接则通过无线电波和频率传输。通过物理电缆，数据在不同的设备和计算机系统之间传输。\n\
  \n有线网络是常见的有线配置类型。绝大多数有线电缆都使用 `Ethernet` 网线来促进点与点之间的数据传输。简单有线连接的一个例子是路由器连接到多台计算机。在更广泛的网络中，涉及多个路由器和交换机，以促进网络上所有设备的整体连接。\n\
  \n在有线网络中使用电缆进行上网时，计算机连接到电缆调制解调器、`T1` 线或其他类型的互联网连接。这为连接到网络的所有其他设备提供互联网数据。有线网络技术还涉及一些外围连接，其中键盘和鼠标通过\
  \ `USB` 连接就属于此类。尽管这些连接中有些已经是无线的，但仍然存在有线连接。\n\n相反，显示器和外部硬盘之间的连接并不被归类为有线网络。这是因为目前没有替代的无线连接。你只能对这些设备使用有线连接。很简单；只有当存在无线替代方案时，连接才被归类为有线网络。如前，其他外围设备现在都是无线的。\n\
  \n然而，某些用户倾向于使用有线设备，这是因为他们认为有线具有某些优点。其中一个优点体现在 `Ethernet` 连接中。当你通过 `Ethernet` 连接上网时，它不容易受到信号干扰。然而，使用\
  \ `Wi-Fi` 时，这种情况是有可能的而且经常发生。这听起来可能难以相信，但有线连接总是比无线连接更快。这是因为通过机械介质传输数据的速度比通过电磁介质更快。所以，如果你正在浏览，使用\
  \ `Ethernet` 线比使用 `Wi-Fi` 更快。\n\n此外，对于有线外围设备，你不需要频繁更换组件或整个设备。在无线鼠标上，你总是需要更换电池。这在传统的有线鼠标上不会发生。另一个优点体现在游戏等高强度活动中。玩家倾向于使用有线鼠标和键盘而不是无线的，都是为了将延迟降到零。无线设备容易产生延迟，而有线设备则不会。\n\
  \n## 有线网络介质类型\n\n有线连接总是通过介质完成的，常见的有三种类型：\n*   双对电缆\n*   同轴电缆\n*   光纤电\n\n这些有线介质的功能有细微差异，并且它们适应于不同的功能。对于双对介质，它们以电流的形式接收信号和数据，而光纤电则以光的形式接收信号。\n\
  \n### 双对电缆\n\n这种介质由两个导导体组成，每个导导体都涂有绝缘层，并扭绞在一起。这些电线的功能不同，一个用于向接收器传输信号，另一个用于接地参考。使用这种类型电缆的缺点是它容易受到干扰和串扰，这可能会在传输中产生不需要的信号。\n\
  \n双绞电缆有两种主要类型，分别是：\n\n*   **非屏蔽双绞电缆 (UTP)**：这些电缆已知由两根绝缘铜线组成。电缆对中的铜线以螺旋形式相互缠绕。这减少了来自相似线对的电磁干扰。这些电线总是涂有不同的颜色，以帮助识别不同的电线。这些电线已知具有高速能力，高级型号在\
  \ `Ethernet` 技术中被广泛使用。遗憾的是，这些电线的带宽较低，尤其是与 `Coaxial` 同轴电缆相比。而且它们非常容易受到干扰。\n*   **屏蔽双绞电缆\
  \ (STP)**：这些类型的电缆由金属箔或编织网制成。电线周围的金属外壳有助于减少电磁噪声。这还能防止串扰，并比非屏蔽和同轴电缆提供更高的速度。无论是模拟传输还是数字传输，这些电线都可以被有效使用。缺点是制造并不容易。\n\
  \n### 同轴电缆\n\n这种电缆因其存在两个平行的导导体而得名。在这种电缆中，铜被用作中心导体，周围有一层 `PVC` 包围。使用金属作为外层是为了防止噪声并与其他导导体隔离。在这种情况下，外导体被包裹在绝缘护套中。\n\
  \n`coaxial` 电缆的使用有其优点。如果你正在寻找用于电话线的最佳电缆，这是最好的。这些电缆可以以 `10Mbps` 的极速传输数字信号。使用这种电缆的另一个优点是与其他电缆相比，它的抗噪能力有所提高。得益于电缆改进的屏蔽，它可以在远距离高速传输。然而，这些电缆也有缺点。如果单根电缆故障，整个网络都可能失效。此外，你可能会遇到地环，特别是当屏蔽不完美时。\n\
  \n### 光纤\n\n\n\n\n\n这种电缆由塑料或玻璃制成，设计用于以光的形式传输。在这种电缆中，光仅沿一个方向移动。在需要双向通信的情况下，需要在两个设备之间建立第二次通信。基本上，光纤主要用于通过信道对光进行导引。在光纤电缆中，有一种被称为光纤电缆连接器的东西。这种连接器有三种类型，分别是：\n\
  \n- 用户信道连接器 – 用于电缆电视。它采用推/拉式锁定系统。\n- 直头连接器 – 用于连接到网络设备。\n- `MT-RJ` 连接器，它利用了两根光纤，并将它们整合在一个单一的设计中。\n\
  \n使用光纤连接器的优点是：其抗腐蚀能力和高防窃水平。然而，缺点是存在光的单向传播现象。\n\n## 使用有线网络的优势\n\n关于有线网络及其工作原理，已经有很多论述了。然而，如果你完全陷入了设备间无线连接的狂热中，可能很难看清有线连接的本质。我确定你希望连接到\
  \ CPU 的显示器最终完全变成无线。你应该知道，有线连接相比无线连接具有一些优势。这些优势是无线连接尚未实现的，这确保了有线设备的持久存在性。以下是你应该注意的某些优势：\n\
  \n### 它非常可靠且稳定\n\n如果你的有线网络是由专业人士设置的，你可以确保其稳定性和可靠性。每个有线连接都包含需要正确连接以确保正常功能的内部组件，如\
  \ `hubs`（集线器）、`switches`（交换机）和 `Ethernet cables`（以太网线）。一旦这些组件完美同步，你就可以确保网络系统运行如飞（非常快）。随着\
  \ `5G` 的出现以及随后的发展（如 `Wi-Fi 6` 所示），无线网络将变得更好。但目前来看，随着硬件的改进，有线连接更加稳定。另一个有助于有线网络可靠性和稳定性的因素是，它不受任何其他连接的干扰。例如，在彼此靠近的有线连接中，你不会遇到任何干扰。然而，这种近距离在无线系统中极有可能引起干扰。此外，墙壁和其他物体的存在会导致无线网络连接的减弱。在有线网络中，无论距离远或或障碍，都能保持速度和最佳连接。\n\
  \n### 可见性\n\n在有线连接中，你可以确保网络的隐私性，除非它们已连接，否则某个特定网络对另一个网络是不可见的。当节点连接时，将有助于有效的数据传输。不同网络之间通信所需的只需要节点。一旦节点连接，它们就可以识别系统中的其他节点，并确保将正确的数据传递到正确的节点。\n\
  \n### 速度\n\n速度是有线网络的另一个优势。到目前为止，无线网络在速度方面无法与有线网络相比。在无线连接中，存在死角的概率。这些在有线连接中并不存在。有线连接没有死角，因为使用不同的电缆将设备连接到网络。这种安排使得数据传输到网络中的各个设备。另一个有助于有线网络速度的因素是，没有会增加网络负担的必要流量。使用电缆，未经授权的用户无法连接到网络。\n\
  \n### 安全性\n\n有线网络的安全性比无线网络更容易实现。一旦你确保防火墙是安全的，并结合其他安全应用程序，你就可以确信安全性。一旦你确保端口连接正确并对网络进行持续监控，安全违规和损害将大幅减少。这种优势对于每天进行大量敏感交易的机构来说是必要的。\n\
  \n### 成本\n\n这是有线连接击败无线网络的另一个领域。为你的机构开发有线网络所产生的成本完全取决于你安装的特定框架。无论你选择哪种类型的框架，成本将始终低于无线网络所需的成本。有线网络中使用的各种组件，如\
  \ `Ethernet cables`、`switches`、`routers` 等，价格都很廉。。此外，与无线网络不同，它减少了不断升级的需求。用于构建这种有线框架的硬件始终能经得起时间的考验。\n\
  \n## 有线网络的缺点\n\n有线网络的优点非常多，这使得它值得考虑。但这让它成为一个完美的网络系统了吗？如果是的话，很可能就不会有无线系统的发展。有线网络有几个缺点，如下：\n\
  \n### 它不可移动\n\n你不能像带着移动 Wi-Fi 随处走一样带着你的有线路由器四处走。遗憾的是，有线网络在移动性方面缺乏灵活性。无论你在哪个地方使用网络，都必须有一根电缆连接到该点。把它想象成这样：一旦你的有线连接在客厅有一个插座，访问该网络的唯一方法就是在客厅里，而不是卧室。在很多情况下，这可能不是大问题，特别是在设备位置不会经常改变的办公环境中。\n\
  \n### 安装\n\n安装费用较便宜，这是肯定的，但完成安装需要花费太多时间。这是因为需要更多的组件，而且让它们同步是一项巨大的任务。除了需要连接的组件数量外，影响安装持续时间的另一个因素是规模。\n\
  \n### 维护\n\n如果你的网络很小，你可能不需要服务器。但当网络扩展时，就需要服务器。服务器的设计用于处理连接、容量、存储和工作负载。一旦这种需求出现，维护成本将飙升。\n\
  \n### 线缆\n\n当建立连接所需的电缆数量太多时，可能很难控制，而且很令人烦恼。想象一下线缆布在地板和墙上。管理有线连接带来的杂乱和笨重可能是很困难，最好远离它。\n\
  \n\n\n\n\n# 第 3 章：无线网络的功能\n\n你认为我们所有的设备连接完全变为无线化需要多久？缓慢但稳定地，技术创新正在消除两个设备之间连接线缆的需求。跳出网络的语境（但确实使用了线缆），让我们仔细观察一下现在具有无线充电功能的智能手机。这曾经似乎一直是不可能的，但现在可以。你的手机只需要放在某个设备上，能量就会进行传输。这听起来很超现实，但这正是技术的体现。\n\
  \n无线技术自 20 世纪 90 年代初开始，在过去的几十年里，它变得更好、更快、更可靠了。正如之前讨论的，有线网络相比无线网络仍具有某些优势。但这些优势可以忽略忽略（特别是如果你能通过无线技术相对快速地完成任务）。我们已经定义了有线技术，并且已经确定有线系统以外的另一种连接形式是无线系统。它们之间并不是互斥的。\n\
  \n## 什么是无线网络？\n\n这个名字包含了一些暗示，但真的仅此而已吗？一种不使用电线的连接系统。无线系统到底是什么？从技术上讲，无线系统可以定义为在传输信号和数据时利用无线电波，而不是使用电线电缆的系统。无线网络经历了如此创新和发展，使其功能就像手机一样。要使用你的手机，你不需要连接到电话线；这与无线网络完全相同。在使用网络之前，你不需要机械地物理连接到无线计算机网络。设置无线网络非常简单，但你仍然需要理解一些基础知识。\n\
  \n*   无线网络的常用名称是 `WLAN` – 无线局域网（Wireless Local Area Network）。在某些情况下，人们倾向于使用 `LAWN`\
  \ – 局域无线网络（Local Area Wireless Network）。无线网络有时被误称为 `Wi-Fi`。实际上，`Wi-Fi` 只是无线网络的一种形式。`Wi-Fi`\
  \ 是 `802.11b` 标准。\n*   无线计算机网络的名称是 `SSID`。`SSID` 是服务集标识符（Service Set Identifier）的缩写。因此，计算机若要访问特定网络，必须拥有与网络中其他计算机相同的\
  \ `SSID`。这个 `SSID` 对于特定的计算机网络始终是唯一的。\n*   特定网络可能会通过不同的通道进行传输。为了确保特定网络上几台计算机之间的无缝通信，它们必须配置为通过同一通道传输数据。\n\
  *   无线计算机网络可以由两台通过无线网适配器连接的计算机组成。这种网络类型被称为 `ad-hoc made network`（自形成网络）。\n*   还有一种更复杂的网络形式被称为\
  \ `infrastructure mode network`（基础结构模式网络）。这对于网络本身来说没什么大不了。它仅仅是指一组无线计算机连接在一起，并且也连接到已有的有缆网络的情况。与有缆网络的连接是通过使用无线接入点（`WAP`）实现的。\n\
  \n通过使用无线网络，企业可以减少在建筑内部和跨距离引入电缆的成本。无线连接的根本是无线电波，这是在网络框架物理层执行的一种实现。无线网络有四种主要类型（我们将在本书中深入探讨）：\n\
  \n*   `LAN`：无线局域网；连接给定位置内的多个设备，但不使用电缆。该连接也可以连接到互联网。\n*   `MAN`：无线市域网；是多个 `LANs`\
  \ 之间的连接。\n*   `WAN`：无线广域网；是城市和城镇等大区域的连接。\n*   `PAN`：无线个人局域网；是个人用户在短距离内的设备互连。\n\n\
  \n\n\n\n请注意；所有不需要电缆即可完成连接（尽管有电缆的替代方案）被称为无线网络。\n\n# 无线技术\n无线技术顾名其名。记住我曾提到过，无线网络经常被错误地称为\
  \ `Wi-Fi`，而 `Wi-Fi` 只是无线网络不同形式之一。它只是计算机连接到互联网的方式之一。为了本书的起见，也为了不让你产生困惑，我们将交替使用这两个术语（`Wi-Fi`\
  \ 和无线网络）。在继续之前，请记住，`Wi-Fi` 只是“wireless fidelity（无线保真）”的缩写。市上有存在不同的 `无线网络`（或 `Wi-Fi`）标准。你拥有的各种设备，如路由器、平板电脑、智能手机和智能家居设备，都有连接互联网的方法。无线网络标准在短短几年内不断变化。更新总是在进行，而这些更新带来了更快的网速、改进的连接性以及对同时连接的无缝处理。\n\
  \n## 什么是无线网络标准？\n你可能会问。这些仅仅是一组服务和协议，定义了你的 `Wi-Fi` 网络和其他数据传输网络的功能。存在不同类型的无线网络标准，而且如所述，新版本会不断发布。你可以将这些版本视为更新。如今最常见的类型是\
  \ `IEEE 802.11` 无线局域网和 `Mesh`。这种特定的 `Wi-Fi` 标准每隔几年就会更新一次。最新的更新是 `802.11ac`，而 `802.11ax`\
  \ 刚刚进入世界无线连接的主流。\n\n## IEEE 802.11 无线标准的各种形式\n*   `IEEE 802.11`：它最初创建于 1997 年。尽管它现在已经过时了，但在它仍在使用期间，它提供了极快的最高连接速度，达到每秒兆。支持这种\
  \ `Wi-Fi` 模型的各种设备不再生产；因此，今天的设备将不再支持它。\n*   `IEEE 802.11a`：它在原始版本约 2 年后创建，工作在 `5GHz`\
  \ 频段上。它的创建者希望它能带来更少的干扰。这是该版本创建时的的一种观点，因为大多数干扰前一个版本的设备运行在 `2.4GHz` 频段上。它的速度与原始版本一样快；曾记录速度达到\
  \ `54Mbps`。这个版本的 `Wi-Fi` 标准缺乏的一点是范围，因为它经常与其路径上的设备发生产生问题。\n*   `IEEE 802.11b`：它也创建于\
  \ 1999 年，但它是使用 `2.4GHz` 频段的版本，最高速度可以达到 `11Mbps`。正是这种 `Wi-Fi` 标准让 `Wi-Fi` 技术流行了起来。\n\
  *   `IEEE 802.11g`：它设计于 2003 年，可以在 `2.4 GHz` 频段上工作并获得 `54Mbps` 的速度。此后，该标准被广泛接受，因为它解决了与多个设备的兼容性问题并提供了高速。\n\
  *   `IEEE 802.11n`：这个版本的 `Wi-Fi` 创建于 2009 年，但它并没有它的前身那样被广泛使用。它可以同时在 `2.4GHz` 和 `5\
  \ GHz` 频段上运行。它还支持跨不同通道的使用。每个通道可以实现约 `150Mbps` 的速度，因此累计达到 `600Mbps`。\n*   `IEEE 802.11ac`：这是新设备上最新的版本。它发布于\
  \ 2014 年，凭借其技术，所有连接到它的设备都可以达到 `1300mpbs` 的速度。这并不是该更新的唯一特性；它还具有 `MU-MIMO` 支持，以及针对\
  \ `5 GHz` 频段的额外的 `Wi-Fi` 广播通道。通过单个路由器，该标准支持比以前更多的天线。\n*   `IEEE 802.11ax`：这是最新的标准。通过这种标准，连接速度可能高达\
  \ `10Gbps`。这就是它能达到的程度，并且正在努力使其超越这一。容量也超过了 `ac`，因为它设计用于增加更多的广播子通道、升级 `MU-MIMO`，并允许数据流同时传输。\n\
  \n多年来，`Wi-Fi` 标准只变得更好，我们注定看到更多。无线网络上的连接正变得更快，`5G` 的到来将确保这一点。`4G` 提供的数据流比 `3G` 体验过的更快，但\
  \ `5G` 将更快、更可靠。`5G` 的使用超越了仅仅连接互联网；它将成为全球无线网络的基础框架，是设备连接方式的彻底革命。`Wi-Fi` 的各种标准，特别是最新版本，在速度方面已与\
  \ `Ethernet`（以太网）连接相相比。`802.11n` 能够实现组合 `600Mbps`，与 `Ethernet` 相比。\n\n\n\n\n大多数电子设备也会产生无线电波。这些电波的频率通常与路由器和其他接入点的无线网络频率相同。由于处于相同频率，波波之间不可避免会产生干扰，这并不是好事。例如，如果你在厨房里，且手机连接着家中的路由器。当同样具有特定频率的微波炉运行时，就可能会发生干扰。最好的办法是让这两个波源相互远离。\n\
  \n## 外部因素\n其他外部因素也会导致干扰。这些包括：建筑或公用事业行业。在许多其他情况下，电源线也会对 `Wi-Fi` 信号产生干扰。广播电视或摄像头也可能引起干扰。在建筑现场，起起重机或脚手架已知会导致无线网络干扰。这听起来可能很奇怪，但宽叶树木已知会导致信号干扰。这是因为水分会衰减植物中所含的信号。\n\
  \n## 范围\n这是另一个被认为是网络干扰主要原因因素。在这种情况下，无线网络信号随着传输距离的增加而减弱。信号传输得越远，强度就越弱。这是衰减的结果。衰减是指信号强度在整个传输过程中减小的过程。`Wi-Fi`\
  \ 信号在空气中的传输效果已知优于固体材料中，但随着距离增加，它们往往会失去强度。当它们到达目的地时，必然会产生干扰。消除距离引起衰减的唯一方法是确保连接设备始终处于信号源\
  \ 30 米以内。所有这些因素已被证实会导致干扰，许多其他因素也是如此。你可以看到消除所有这些障碍的概率非常低。因此，无线网络干扰将一直存在。\n\n## 数据安全\n\
  这是无线网络需要恰当且批判性考虑的另一个方面。在涉及无线连接时，安全是一个大问题，任何准备建立无线网络的企业都应该准备好在数据安全上投入这么多。数据安全作为一个概念，是指为了确保数字隐私得到保障而采取的各种措施，旨在限制对计算机、数据库和网站的未经授权访问。这些措施还起防止数据被损坏的作用。无论组织的类型或大小，数据安全都至关重要。在此方面可以采取的措施简要示例包括：备份、数据掩码和数据擦除。\n\
  \n一种备受推的关键措施是加密。在加密的情况下，数字数据、软件/硬件和其他设备都会被加密。这种措施使得这些设备和平台上的内容对于未经授权的用户和黑客来说是不可读的。另一种数据安全方法是身份验证。这要求授权用户提供密码、代码、生物识别数据或其他形式的数据。这些数据用于在访问包含数据的安全系统之前验证身份。这些数字安全措施不仅是企业和大型公司需要的，对于医疗记录也具有极其重要性。鉴于此，医疗机构正在加强安全，使他们的系统更不易受到入侵者的攻击。数据安全的重要性再怎么强调也不为过。在某种程度上，每家业务都需要它来保持在竞争中处于领先地位并保持高利润率。从处理大量个人和财务信息的银行业，到手握客户联系信息的小微企业都是如此。你的手机需要安全。你不知道为什么需要保护手机上的数据吗？如果你是使用\
  \ `Google Chrome` 的用户，并且将所有密码都保存在 Google 的“记住密码”中，你就需要它。你的 `Google` 账户可能登录在 `chrome`\
  \ 上以获得更具个性化的浏览体验。在设置页面中，你保存到不同网站的所有密码都已保存，并且可以轻松查看。因此，如果第三方可以快速访问你的手机，这些数据就面临向公众公开的风险。第三方可能会使用这些细节以你的名义进行欺诈活动。组织收集的所有数据都需要被保护，这是数据安全的主要目的。无论使用什么形式的技术或设备来存储信息，都必须受到保护。无论是大公司还是微型企业，一旦发生消费者数据泄露，就可能导致巨额罚款和诉讼，正如\
  \ `Facebook` 和 `Google` 这样的大科技公司最近面临的那样。比以前，数据安全现在是至关重要的，大公司正在对此投入巨资。\n\n## 数据安全类型说明\n\
  在数据输入和输出的不同阶段正在使用各种类型的数据安全。在不同阶段采取措施的需求是为了确保数据泄露变得更加困难。通常，公司面临的威胁始终来自外部源。以下是一些保护数据的措施：\n\
  \n*   **数据加密**：这是一种安全措施，对每个数据字符串应用代码，导致对数据的访问受到限制，直到使用授权的密钥为止。\n*   **数据掩码**：这是另一种防止第三方获取数据的方法。在这种情况下，数据的特定部分被掩码；因此，未经授权的外部和内部人员都无法访问。数据掩码的流行例子是信用卡号的前\
  \ 12 位数字不显示。或者在尝试找回 `Google` 账户时，前 9 或 10 位数字不显示，以便系统可以确认授权用户确实是尝试访问系统的人。\n*   **数据擦除**：当某人不再需要特定数据时采用这种数据安全措施。这种措施会导致数据从每个系统中被擦除。一个例子是你尝试取消订阅邮件列表时。通过点击链接，你的信息将立即且永久地从列表中删除。\n\
  *   **数据韧性**：这是一种措施，组织创建特定数据的副本，这样当一个副本丢失时，可以从克隆副本中恢复。\n\n\n\n\n# 合规与标准\n\n数据安全平台和收集数据的组织被称为数据处理者。对于这样的组织来说，这是一项巨大的责任。不同的规则和法规指导着数据的使用。这些法规涵盖了所有数据，无论其类型或大小如何。然而，不同行业适用不同的法规。科技行业的法规与金融行业有所不同。规则有时也会受到地理位置的影响。例如，处理欧盟公民业务的公司在发生数据泄露时，可能面临\
  \ `GDPR` 的约束。罚款是惩罚违反数据泄露法规的公司和企业的常用方式。\n\n# 防火墙定义\n\n`firewall`（防火墙）这个词在 IT 生系统中频繁出现，如果你对该系统完全陌生，你可能会好奇它是什么、做什么的以及如何工作。那么，它就在这里。防火墙是网络安全设备，旨在监控出站和入站的网络流量。它的功能还兼具对数据包的拦截和许可，其所有操作都基于特定的安全规则。\n\
  \n`firewall` 的主要目的是确保你的内部网络系统与来自外部网络源的外部流量之间存在一个屏障。例如，如果你的公司管理着 `LAN`，任何从其他源进入 `LAN`\
  \ 的数据都必须首先通过 `firewall`。这样，异常和恶意的数据流量就可以被识别并拦截。\n\n## 防火墙是如何工作的？\n\n`firewall` 的工作原理很简单。它分析入站流量，将其与输入内部的一组预设规则进行比较，并拦截所有不符合指令的数据。防火墙始终位于\
  \ `port`（端口），即网络的入口点。信息是在 `ports` 上与外部设备交换的。\n\n这方面的例子是 `\"Source address 172.18.1.1\
  \ is permitted to reach 172.18.2.1 via port 22.\"`\n\n有什么困惑吗？这里有另一个类比。把你的 `IP address`\
  \ 想象成房子，而 `port numbers` 是房子里的房间。房子（目的地）只能被信任的人员（源地址）访问。之后，还有进一步的过滤，只允许特定人员进入房子内的特定房间。情况下情况下房间就是\
  \ `destination ports`。这完全取决于进入的数据类型。某些数据可以访问任何 `ports`，而另一些只允许通过一个。\n\n# 防火墙的类型\n\
  \n既然你已经知道了防火墙是什么，那么随之而来的问题是：“有多少种类型？”市面上存在不同类型的防火墙。它们可以是软件或硬件。这完全取决于你组织的需求。最好的办法是在你的企业中让两种系统都运行。\n\
  \n- 使用 `software firewall`（软件防火墙），是安装在连接到网络的每台计算机上的。安装时，它通过 `port numbers` 和 `applications`\
  \ 规范所有流量。\n- 对于 `physical firewall`（物理防火墙），是在网络和 `gateway` 之间安装一个设备。\n\n`packet-filtering\
  \ firewalls`（包过滤防火墙）分为两大类：`stateful`（有状态）和 `stateless`（无状态）。\n\n- `stateless firewalls`（无状态防火墙）是仅与其他数据包进行交叉检查，且这种检查没有上下文。通过这种方式，它们可以快速识别黑客和其他异常。\n\
  - 对于 `stateful firewalls`（有状态防火墙），它们记得已检查过并标记为安全的其他包的信息。这两种防火墙都相当有用；然而，它们仅提供基本的保护并具有局限性。其中一个局限性是它们无法判断入站请求的内容是否会对目标应用程序产生不利影响。如果病毒来自信任源，这些防火墙类型将永远不知。\n\
  \n但好消息是，有先进的防火墙绝不会错过此类情况：\n\n- **下一代防火墙 (NGFW)**：这些是传统防火墙技术与其他某些功能（如加密流量检查、入侵防御系统、反病毒等许多）相结合的防火墙。下一代防火墙中发现的一个主要功能是\
  \ `\"deep packet inspection\" (DPI)`。之前讨论的基本防火墙只搜索数据包头部，而这些防火墙进一步检查数据包包含的数据。这使用户能够轻松地识别、分类并阻止毒性数据包。\n\
  - **代理防火墙 (Proxy firewalls)**：它通过在应用层过滤网络流量来工作。然而，与必要的防火墙不同，它作为两个端系统之间的中间节点。在这种情况下，必须有客户端向防火墙发出请求。然后对该请求进行评估并设置的安全指令进行比较。交叉检查的结果决定数据包是被拦截还是允许。在大多数情况下，代理防火墙用于监控\
  \ `HTTP` 和 `FTP` 等第 7 层协议的流量。这种防火墙系统还利用了深度包检查和状态检查；\n- **网络地址转换防火墙 (NAT)**：这允许多个具有独立网络地址的设备在使用仅有的\
  \ `IP address` 的情况下通信并连接到互联网。这样，计算机的个人 `IP address` 就被隐藏了。由于由于，黑客无法获取特定计算机的特定细节。这是确保网络系统安全的又一步。`NAT\
  \ firewalls` 与代理防火墙有许多相似之处。它们在是计算机网络和外部流量之间的中间节点。\n- **状态多层检测防火墙 (SMLI)**：这种防火墙系统设计用于在网络层、传输层和应用层对数据包进行过滤。在过滤阶段，它将其与信任包进行比较后做出决策。与\
  \ `NGFW firewalls` 一样，这些在每一层对整个数据包进行检查，然后进行通过或拦截。这种搜索旨在确定所提议通信的状态，从而只允许与信任源的连接。\n\
  \n\n\n\n\n# 第 4 章：无线技术的革命性影响与计算机网络的突破\n\n自几十年前无线技术出现以来，我们的生活就从未停止改变。且有一点是肯定的：它承诺只会变得更好。随着\
  \ `5G` 在主流市场的逐渐演进，我们完全想象未来将会如何。一句话可以概括：“无线技术影响了我们生活的本质属性。”它改变了我们的经营方式，改变了我们的学习方式，影响了我们与家人朋友交流和保持联系的方式。一切都改变了，而这仅仅是未来的一种预证。\n\
  \n在拥有无线技术的几十年里，已经取得了多次突破。可以写一整本书来讨论那些催生革命性平台和基础设施的进步，它们让今天的生活变得便利。为了简洁起见，本章将讨论其中两个重要的突破。它们是`VLAN`\
  \ 和互联网。\n\n## VLAN – 虚拟局域网\n\n`VLAN` 也称为虚拟局域网，从名称就可以看出，它具有与 `LAN` 相似的框架。`VLAN` 的概念也很简单。它是一个子网络，可以在单独的物理\
  \ `LAN` 上对设备集合进行分组。你理解 `LAN` 是什么吧？\n\n`VLAN` 与 `LAN` 的区别在于，它让管理员能够很容易地对单个交换网络进行分区，以匹配系统的功能和安全需求。这种实现无需布设电缆或对整个网络基础设施进行重大更改。这种计算机网络系统通常由大型企业采用，旨在重新划分设备以更好地管理流量。\n\
  \n在组织中使用 `VLAN` 非常重要，因为它们可以提高计算机网络的整体性能，因为所有设备都是根据它们之间的通信频率进行分组的。通过 `VLAN`，在更广泛的网络上也提供了安全保障，因为允许对哪些设备可以相互通信进行更高级别的控制。`VLAN`\
  \ 非常灵活，这是因为它通过逻辑连接实现的，与物理性的 `LAN` 和 `WAN` 不同。网络交换机可以支持多个独立的 `VLAN`。这进一步创建了子网实现的第二（`2`）层（数据链路层）。广播域始终与\
  \ `VLAN` 关联，而 `VLAN` 通常由多个网络交换机组成。\n\n## VLAN 的类型\n\n`VLAN` 有几种类型，包括：基于协议的、静态的（动态（dynamic）\
  \ `VLAN`。\n\n### 协议 VLAN\n这种类型的 `VLAN` 根据程序内置的协议处理其流量。在该系统中，有一个交换机，其功能是根据各种流量协议对流量进行隔离和转发。\n\
  \n### 静态 VLAN\n这种 `VLAN` 也称为基于端口的 `VLAN`。这种系统需要网络管理员，其功能是将特定网络上的端口分配给特定的虚拟网络。\n\n\
  ### 动态 VLAN\n在这种 `VLAN` 网络系统中，网络管理员的唯一功能是根据设备的特征定义成员身份。这与交换机端口的位置无关。\n\n\n\n\n\n\
  ## VLAN 是如何工作的？\n\nVLAN 的工作原理很简单，其功能也如此。位于交换机上的端口可以被分配给一个 VLAN 或多个 VLAN。这使得可以将不同的系统划分为逻辑组。这种划分是基于设备所属的部门的。划分完成后，随后会建立关于位于不同组的系统如何相互通信的规则。可以形成不同类型的组，从实用且直观的组到更复杂且具有法律的组。\n\
  \n然后，VLAN 为所有连接到同一 VLAN 编程交换机端口的主机提供数据链路访问。有一个名为 `VLAN tag`（VLAN 标签）的实体，它是以太网头中的一个\
  \ 12 位字段。它旨在为每个域交换机支持多达 4,096 个 VLAN。这种由 VLAN 进行标记由 IEEE（电气电子工程师学会）的 `802.1Q` 规范和标准化的，它通常被称为\
  \ `Dot1Q`。\n\n当接收到来自连接主机的未标记帧时，在该特定接口上配置的 `VLAN ID tag` 会被写入数据链路帧头中。`802 1Q` 格式实现了这种写入或配置。此后，`802.1Q`\
  \ 帧被传递到目的地。在这种情况下，每台交换机都利用标签将每个 VLAN 的流量保持在与其他分离的通道中。因此，传输仅到配置了该 VLAN 的特定位置。标签就是确保这种区分的。当帧最终到达其交换机端口目的地时，在帧传输到终端设备之前，会移除\
  \ `VLAN tag`。\n\n通过 `trunk configuration`（汇干配置），可以在特定端口上配置多个 VLAN。在这种情况下，每个帧通过端口发送时都带有一个\
  \ `VLAN ID`，正如上述描述。另一个想要接收和传输标记帧的设备接口必须能够支持 `trunk mode configuration`（链路模式配置）。当存在未标记的以太帧时，它有一个默认\
  \ VLAN，这通常定义在交换机配置中。\n\n当 VLAN 交换机接收到未标记的以太帧时，`VLAN tag` 被分配给入口接口。随后帧被转发到具有 `MAC\
  \ address` 的主机端口。`MAC address` 是介质访问地址。在广播、单播和组播的情况下，它们都会传向位于 VLAN 上的所有端口。在未知主机对隐藏的单播帧做出响应的情况下，交换机会自动学习该位置。因此，指向该主机的后续帧将不再被泛洪。\n\
  \n交换机转发表通过两种不同的机制更新：\n1. 第一种是不时从转发表中移除旧的转发条目。这种移除操作的间隔也可以预先配置。\n2. 第二种机制是，每当发生拓扑变化时，它会导致转发表刷新定时器缩短，并触发刷新。通过这种对配置定时器的减少，刷新时间会提前。\n\
  \n存在 `Spanning Tree Protocol (STP)`（生成树协议），它用于在每个层 2 域的交换机之间创建无环路拓扑。你可以随时利用每个 VLAN\
  \ 的 STP，每当多个 VLAN 具有相同拓扑时，它会产生不同的层级拓扑来减少 STP 开销。通过 STP，阻塞了可能产生转发环路的转发链路——从而从一个特定的根交换机创建一个生成的生成树。得益于这种阻塞，某些链路将不会用于转发。它们必须等待直到网络其他部分发生故障，导致\
  \ STP 使该链路成为活动转发路径的一部分。\n\n## VLAN 的优点与缺点\n\nVLAN 的优点包括安全性、减少广播流量、易于管理以及限制广播域。缺点是，一个交换域上有\
  \ 4096 个 VLAN 的限制，这为托管提供商带来了若干问题。通过路由器促进的多个 VLAN 之间进行数据通信。然而，一些现代交换机也具有路由功能；因此，它们被称为\
  \ `layer 3 switches`（三层交换机）。\n\n## 以及它如何影响我们的生活\n\n整个互联网是一个巨大的概念，它定义了我们生活的本质部分。世界正处于一个被称为信息时代的阶段，而其核心就是互联网。互联网是一个由连接设备组成的庞大星球，上面促进了通信、信息和连接的培养。互联网是计算机网络的全球网络，现在这些基于无线通信，最终提供了一种不受距离限制的无处不在的多模交互能力。从你所在的地方，你可以访问信息并联系世界上任何地方的任何人，而且这是实时完成的。只要你的互联网连接不卡顿，就没有时间浪费，也没有延迟。这是技术彻底改变我们生活的方式之一。\n\
  \n不要惊讶地发现，在互联网之前，有一种叫做 `Arpanet` 的东西。它最早于 1969 年被部署。截至那时，它由美国商务部控制。政府的这种控制限制了平台的适应性。直到\
  \ 20 世纪 90 年代平台最终私有化，它才在全球范围内被广泛接受和使用。\n\n截至 1996 年，互联网用户统计约为 4000 万，而 2013 年，互联网用户人数已增加到\
  \ 25 亿。在这个数字中，中国拥有大量的互联网用户。在早期，由于连接模式的原因，访问互联网的速度非常缓慢。然而，随着无线连接的爆发，互联网速度变得惊人地快。随着\
  \ 5G 的推进，它只会更快。\n\n\n\n\n\n这些因素共同作用，促成了我们今天所看到的万维网的演变。这是 20 世纪技术领域最重大的突破，它为全球社区开启了一个全新的世界。互联网现在促进着商业、教育、文化、金融、娱乐以及生活的许多其他方面。\n\
  \n## 互联网上的社交媒体\n互联网为许多其他创新打开了大门，创新者想出了宏伟的方式来利用互联网。这带来了一种全新的赚钱方式。各种结构和基础设施在互联网上迅速涌现。这一快速发展的时期被称为互联网泡沫。\n\
  \n在互联网泡沫之后，以及在 21 世纪初，一个全新的世界诞生了。在这个世界里，人类最自然的生活方式——社交属性——可以得到培养。人类是社交性动物，随着互联网的创新，这一方面被带到了线上。这一系列中的第一个产物是\
  \ 2002 年`Friendster`的诞生。这引发了一场社会技术革命，在短时间内，就出现了几个个允许人们之间进行实时交互和通信的平台。\n\n在互联网通信的早期，电子邮件是主流。然而，社交网络网站已经超越了电子邮件所提供的功能。现在，我们在这一创新流中已经拥有了成熟的公司：`Facebook`、`Instagram`、`WhatsApp`、`Twitter`、`Tiktok`等。\n\
  \n## 新媒体（大众传播）\n随着互联网的出现，我们有了一种被称为新媒体的新型媒体形式。新媒体是一个用于描述通过计算机技术辅助、利用多种电子通信形式产生内容的术语。新媒体建立在交互的基础上，而这是通过互联网实现的。\n\
  \n植根于新媒体概念，我们拥有网站、在线视频/音频、流媒体、电子邮件、在线社交平台、在线论坛、在线社区、博客、网页广告等。这种新媒体形式可能并不与旧媒体分开，唯一的区别是互联网作为新媒体的输出渠道。\n\
  \n# 第 5 章：无线网络计算机架构\n无线网络是一个广泛的概念，它彻底改变了我们做事的方式。它完全导致了整个计算机连接方式的革新。在本书的早期，我们已经看到了用于构建有线网络的各种组件。无线网络也需要类似的组件。\n\
  \n在全球计算机网络基础设施中，无线网络只贡献了一部分。无论这种基础设施多么有限，都需要引起关注以确保其功能的实现。在本章中，我们将仔细观察无线通信的各种组件。还将考虑无线应用协议、其模型和架构。此外，我们将深入研究`Bluetooth`、`MOBITEX`、`CDPD`\
  \ 和 `I-MODE` 的架构。请继续阅读。\n\n## 无线通信组件\n无线通信已成为我们与其他人类交往的固有部分。这得益于过去几十年的快速发展和重大创新。一个不需要电线来帮助数据从一点传输到另点的世界。无线通信使得数据和信息的交换变得极其简单。各种类型包括：无线广播、红外、卫星、微波和`Bluetooth`。其中一些将在下一章中讨论。以下是构成无线通信网络基础设施的组件：\n\
  \n### 用户\n这是无线通信网络最重要的部分。这一因素并不一定意味着人类实体。用户简单是指任何直接使用无线网络的实体。当然，最常见的用户类型是人。但正如之前提到的，成为用户并不限于这一范围。用户也可以是机器人，它通过无线网络接收来自控制制造过程的中央计算机的指令。基本上，无线网络是为用户服务的，因此，无线网络的主要受益者是用户。这使得他们在无线网络的范围内变得非常至关重要。\n\
  \n用户具有启动和终止无线网络使用的能力，因此将用户称为“终端用户”也是安全的。任何操作旨在执行各种特定应用程序任务的计算机的人（以无线网络为接口）都是用户。计算机网络的用户可以是静态的，也可以是移动的。在移动中使用无线网络的能力是它们如此受欢迎的原因之一。这是有线网络方面的局限性。个人完全可以在穿过校园时使用学校的`Wi-Fi`。还有计算机在无线网络上运行无限长时间的情况。这可能发生在办公室或互联网连接更快的地方。\n\
  \n### 计算机设备\n这是无线网络的另一个重要组件。它们被称为存在无线网络上的客户端。在无线网络上，根据它们在网络上执行的功能，有不同的计算机设备。有些基本上是给终端用户使用的，而另一些是终端系统。计算机设备能够在同一个无线网络上进行相互通信。\n\
  \n无线网络上的各种终端系统是服务器、数据库和网站。这些终端系统是包含信息库的容器，不同位置的终端用户可以查看。\n\n在用户方面，任何设备都可以适配并用于访问所需的信息。例如，用户可以在其笔记本电脑中购买并安装无线网络网卡（`NIC`）。安装完成后，他就可以在特定类型的无线网络上操作。各种计算机设备始终有一个区分它们的操作系统。有不同的操作系统（`OS`），包括：`windows`、`LINUX`\
  \ 和 `Mac OS`。操作系统的主要功能是驱动实现网络应用程序的软件。\n\n### NICs\n这被称为网络接口卡，在本书课程之前已经讨论过。它是无线网络非常重要的部分，就像在有线网络中一样。这些设备主要插入计算机系统，但在某些情况下，它们也可以作为外部设备存在。\n\
  \n### 空气介质\n\n\n\n\n空气，或者更准确地说，大气，其功能超越了仅仅维持生命。在过去的几十年里，它一直作为无线通信信号传播的介质。这种传播是无线网络的主要因素。它促进了无线网络中计算机与其他终端之间的信息传输。因此，无线网络上的信息和数据通过它进行传输，因此它们受到前文讨论的各种限制因素的影响。传输质量始终取决于空气中的阻碍以及信号传输的范围。\n\
  \n## 无线应用协议 (Wireless Application Protocol)\n\n无线应用协议（Wireless Application Protocol）是一种专门为一类通信协议设计的规范，用于标准化无线设备访问互联网的方式。在这种情况下，设备包括手机和无线电收发器。接入互联网是一种无处不在的功能，通过使用不同的技术实现。无线应用网络的概念由四家公司提出，即爱立信（Ericsson）、摩托罗拉（Motorola）、诺基亚（Nokia）和\
  \ Unwired Planet。\n\n### 无线应用网络层\n\n无线应用网络主要有四个层级：\n\n- **无线应用环境 (WAE)**：这是应用层，包含了设备规范和如\
  \ `WML` 等内容开发编程语言。\n- **无线会话协议 (WSP)**：这代表会话层，提供快速连接、挂起和重连。\n- **无线传输层安全 (WTLS)**：这是安全层，为系统提供数据完整性、隐私性和身份验证。\n\
  - **无线传输层 (WTP)**：运行在用户数据报协议（UDP）之上的事务层。其主要功能之一是提供事务支持。\n- **无线数据报协议 (Wireless Datagram\
  \ Protocol)**：这是传输层，代表一致的数据格式。\n\n\n\n\n# WAP 模型\n`WAP` 模型非常简单。它涉及到用户在移动设备上打开浏览器。他在浏览器中输入想要访问的网站\
  \ URL。该 URL 经过编码后，在 `WAP` 协议的帮助下通过 `WAP 网关` 发送到网络。当数据到达 `WAP 网关`时，请求会被翻译为传统的 `HTTP`\
  \ URL 请求，随后通过互联网发送。当请求最终到达目标 Web 服务器时，它将进行处理，并将响应通过 `WAP 网关` 发回设备。该响应将以 `WML` 文件的形式发送，该文件只能由微浏览器查看。\n\
  \n# WAP 架构\n`WAP` 模型的独特之处在于存在不同的层级。这些层级以一种特殊的架构排列，从而促进了为其设计的任务的实现。基本上，`WAP` 是以分层的方式设计的。由于分级的存在，它具有很强的扩展性以及灵活性。另一个让\
  \ `WAP` 框架与与众的因素是它是可扩展的。在上面的段落中，我们粗略查看了各个层级。这些层级是 `WAP` 运行的基础。\n\n# 蓝牙架构\n`Bluetooth`\
  \ 这个词对你来说可能并不陌生，它本应该是。随着手机和个人电脑的使用，`Bluetooth` 已无处不在，因为它是无线网络上最早的文件共享形式之一。在 `Bluetooth`\
  \ 的帮助下，不需要 `USB` 数据线即可传输文件。只需点击并连接即可完成。然而，我们不会讨论 `Bluetooth` 的各种功能或你用它能做什么。`Bluetooth`\
  \ 是无线连接概念，但许多人对其一无所知。`Bluetooth` 框架包含硬件部分和软件部分。事实上，`Bluetooth` 是一个基于硬件的无线电系统，同时也是一个指定两个架构层之间连接的软件栈。\n\
  \n`Bluetooth` 架构的核心在于协议栈。正是这个协议栈定义了 `Bluetooth` 的工作方式。这个栈就像 `WAP` 一样，是一组分层的程序。每一层都与其上方和下方的层进行通信。就是这样，一个\
  \ `Bluetooth` 协议栈包含两个层。主要层是下层硬件无线电系统和上层软件栈。是上层软件栈指定了这两层之间的链路。\n\n## 底层栈层\n这是 `Bluetooth`\
  \ 框架功能的基础。基础层被称为 `radio layer`（无线电层），也可以称为 `module`（模块）。这一层描述了收发器的物理特性。该层的主要功能是在\
  \ `2,4Ghz` 频段上进行无线频率的收收。这就是所谓的物理无线连接。它通过将传输频段分为 79 个不同的通道来实现，最终提供快速跳频。这样做是为了安全。\n\
  \n在这一层正上方，是 `baseband`（基带）和 `link controller protocol`（链路控制器协议）。不要混淆，`baseband`\
  \ 具有对数据进行正确格式化的功能，随后与无线电传输数据。它定义了链路上存在的定时、成帧、数据包和流量控制。`link manager`（链路管理器）随后将来自上层栈的\
  \ `host controller interface (HCI)` 命令进行翻译，然后建立并维持后续连接。\n\n## 上层栈层\n`Bluetooth`\
  \ 框架的这一层侧重于利用核心技术构建旨在相互通信的设备。系统软件与硬件之间的接口是 `Host controller interface`（主机控制器接口）。然后是\
  \ `Logical link control and adaptation protocol`（逻辑链路控制和适配协议），它位于上层栈中 `HCI` 的正上方。该协议的主要功能是促进\
  \ `Bluetooth` 栈两层之间的通信。它还执行监控数据包源和目的的功能。这是 `Bluetooth` 框架中最关键的部分。\n\n在 `logical\
  \ link control and adaptation protocol` 层正上方，协议栈并不是线性排序的。然而，存在一个名为 `service discovery\
  \ protocol`（服务发现协议）的协议层，它独立存在。它执行与 `link controller` 接口的功能，并实现两个 `Bluetooth` 终端设备之间的互操作性。\n\
  \n# MOBITEX\n你听过 `MOBITEX` 这个词并好奇它是什么意思吗？嗯，如果你是一个爱好者，你应该已经发现了更多关于该术语的含义。就像我们有 `WAP`\
  \ 和 `Bluetooth` 架构一样，也有 `MOBITEX` 架构。它是一种无线网络架构，为在包交换、基于无线电的通信系统中运行终端所需的固定设备提供框架。\n\
  \n`MOBITEX` 框架有三个主要组件。这些是：无线电基站、`MX switch` 和 `network management center (NCC)`（网络管理中心）。该框架最早由\
  \ `Eritel` 于 1984 年开发，它是 `Ericsson` 的子公司。`radio base station` 具有向每个单小区传输多达 `30km`\
  \ 距离的功能。`base stations` 进一步划分覆盖区域，并确定网络容量。这是手机通信的基础。你的手机连接到离你最近的 `MOBITEX` 源，当你改变位置时，连接不会出现问题。这项技术比电路交换技术便宜。\n\
  \n`MOBITEX` 数据包限制为 `512 bytes`。每个数据包都包含源和目的的信息。包交换技术的效率源于数据包可以在任何方向、以任何顺序传输。当所有数据包到达目的地时，它们会被重新排序。\n\
  \n`MX switches` 是 `MOBITEX` 框架的另一个组件。它主要控制基站解决方案的路由。它还控制无线与固定设备之间的通信。各种交换机根据地区和区域进行分级分组。\n\
  \n# CDPD\nCDPD 是 `Cellular Digital Data`（小区数字数据）的缩写，是一种用于支持无线连接互联网以及其他包交换网络的规范。\n\
  \n\n\n\n\n- 基站与 `M-ES` 建立的通信是全双工。\n- 它的框架利用了当前 `AMPS/GSM` 网络 `30KHz` 通道，能够以 `19.2kbps`\
  \ 的速率传输数据。\n- 它使用了与 `AMPS` 相同的频率。\n- 它还利用了 `DSMA` 技术。\n- 该框架支持许多服务并可以连接到互联网骨干网。\n\
  \n## CDPD 架构\n`CDPD` 网络上有三个主要接口，分别是 `E-interface`、`I-interface` 和 `A-interface`。基本上，`E-interface`\
  \ 存在于 `CDPD` 与其外部的固定网络之间。而 `I-interface` 则存在于一个 `CDPD` 网络与另一个 `CDPD` 网络之间。对于 `A-interface`，它促进了\
  \ `BS` 与 `MS` 之间的连接。`A-interface` 也可以称为空中接口（Air Interface）。`CDPD` 架构使用了不同的元素：\n\n\
  - `M-ES`: `M-ES` 的功能类似于任何小区系统所使用的用户或移动单元。为了使 `M-ES` 运行，需要一个可以放入笔记本电脑、移动设备或 `PDA`\
  \ 中的 `SIM` 卡。它具有作为 `19.2kbps` 速率无线设备之间接口的功能。不同的 `M-ES` 具有其独特的 `NEI`（网络设备标识），它与其家网\
  \ `MD-IS` 相关联。\n- `MDBS`: 该元素的功能类似于基站。它的主要功能是为 `M-ES` 广播可用通道。该元素还管理各种无线活动，包括信道分配、使用等。\n\
  - `MD-IS`: 该元素的主要功能是促进互联网与 `PSDN` 之间的连接。它还可以作为帧中继交换机和数据包路由器工作。各种数据包的缓冲由 `M-ES` 完成。通过该元素，还支持了漫游管理，因为它包含了注册目录。\n\
  \n## CDPD 的优缺点\n使用 `CDPD` 有一些优点和缺点。\n\n### 优点\n- 第一个优点是它可以利用 `AMPS` 网络上的现有通道。这使得安装和使用非常容易。\n\
  - 其架构类似于小区系统，使其支持更大的容量。由于它可以轻松升级，因此可以提供如此支持。\n- 此外，当需要建立数据通话时，没有延迟。因为 `CDPD` 电话已经在\
  \ `CDPD` 网络上注册，所以延迟被消除了。\n\n### 缺点\n- 对于 `CDPD` 网络，没有网格连接。由于由于，两个 `M-ES` 之间缺乏直接通信。\n\
  - 此外，`CDPD` 小区的大小限制在约 10 英里左右。\n\n## I-MODE\n你听说过所谓的 `I-MODE` 吗？它是一种直接在日本运营的微型互联网。该服务由\
  \ `DoCoMo` 提供，可以通过 `I-Mode` 兼容设备上的菜单直接访问。它利用了 `DoCoMo` 分组交换技术，这带来了“始终在线”。\n\n# 第\
  \ 6 章：无线技术\n如果说无线技术为我们实现了任何什么，那就是通信的有效性。不需要有线连接，你就可以在地方联系任何人。简单来说，无线通信是一种在没有线路连接的情况下执行的数据通信系统。这个术语本身是非常广泛的。它涉及到通过无线信号在两个或多个设备之间建立的所有程序和连接类型。\n\
  \n### 无线系统的基本组成\n无线系统有三个基本组成部分。这些元素是 `transmitters`（发射器）、`channel`（信道）和 `receiver`（接收器）。\n\
  \n#### 传输路径\n无线通信系统的传输路径由 `encoder`（编码）、`encryption`（加密）、`modulation`（调制）和 `multiplexing`（复用）组成。一旦源产生信号，就会通过\
  \ `source encoder` 传输。这将信号转换为适用于各种信号处理技术的合适形式。编码完成后，随后移除剩余信息，从而实现资源的最优利用。编码信号随后经过\
  \ `encryption standard`。这种加密使得信息及其信号受到保护，免受未经授权的人员侵害。常用的编码技术之一是 `channel encoding`（信道编码）。这使得信号受到损害和干扰减少。在执行信道编码时，信号中引入了一种冗余。这使得信号具有鲁棒性。随后使用合适的调制技术对信号进行调制。完成所有这些步骤后，信号就可以通过天线轻松传输。调制之后，进行复用。有多种复用技术，包括：`Time\
  \ Division Multiplexing (TDM)`（时分复用）、`Frequency Division Multiplexing (FDM)`（频分复用）。复用非常重要，因为它导致了宝贵带宽的共享。\n\
  \n#### 信道\n谈到信道，它们指的是无线通信中使用的传输介质。关于信道的一个非常重要的事实是，它是非常不可预测的，细节可能随时变化。这使得它某种程度上被定义为不稳定的。它容易受到干扰、失真、噪声和散射的影响。所有因素最终导致接收到的信号充满错误。\n\
  \n\n\n\n接收机的主要功能是从信道中收集信号，然后对其进行解码以形成源信号。无线通信系统的这部分由解复用、解调、信道解码、解密和源解码组成。接收路径的框架使其在功能上与发射器完全相反。当信道中出现入站信号时，它首先被解复用器接收，并将其与其他信号分离。随后，对单个信号进行解调，从而恢复原始信号。接着，信道功能负责消除冗余信号。通过解密，信号的安全性被移除，然后被解释为简单的位序列。最后，信号被传输到源解码器，从而恢复出原始传输的消息。\n\
  \n# 无线通信系统的类型\n\n手机的使用使得在移动过程中提供各种服务变得必要。这些服务包括通话、访问互联网、多媒体以及如今移动手机上具备的其他实用功能。得益于现有的无线通信系统，所有这些功能都可以实时完成。尽管有多种无线通信系统，但这里是最常用的几种：\n\
  \n## 电视广播和广播广播\n如果你对历史书很熟悉，你应该知道无线电是执行的第一种无线通信形式。广播广播是一种单工通信系统。在这种系统中，信息仅沿一个方向传输，所有用户都接收相同的数据。\n\
  \n## 卫星通信\n这无疑是当今世界上最重要的无线通信形式之一。通过这种无线通信形式，可以实现全球网络连接，而不受人口密度的影响。这种无线通信系统提供了电信、定位和导航、广播、互联网等服务。基本上，我们在智能手机上需要的一切都与此相关。除了移动通信外，现代电视广播和无线广播系统也都依赖于卫星通信系统。\n\
  \n## 移动电话通信系统\n提到手机技术，这是最常用的通信系统。随着这项技术的出现，我们处理世界事务的方式发生了根本性的变化。手机上可以进行的活动超越了简单的通话，还诸如\
  \ `Bluetooth` 连接、`Wi-Fi`、`GPS`、`FM 广播`等功能。\n\n## 全球定位系统 (GPS)\n这是卫星通信系统的一个子类。该系统为用户提供从导航、定位、位置甚至速度的服务。这些服务的实现于\
  \ `GPS` 接收机和来自卫星的数据。\n\n## 蓝牙\n这是另一种短距离无线通信系统。`Bluetooth` 框架能够提供数据、语音和音频传输。`Bluetooth`\
  \ 的传输范围约为 10 米。基本上每个计算机设备（包括手机）都配备了这项技术。尽管已经出现了更快的替代方案，但它仍然被广泛使用。手机、平板电脑、电脑等都配备了这项技术。\n\
  \n## 呼机\n你还记得呼机吗？是的，那种过时的通信模式。顺便问一下，现在还有人随身携带呼机吗？我怀疑。然而，呼机技术在当时是一项巨大的成功。这是在手机占据主流之前。这项技术通过以消息的形式信息来工作。它也是一个单工系统。\n\
  \n## 无线局域网\n我们之前在本书中讨论过 `WLAN`。它也是一种无线通信技术。在 `WLAN` 的帮助下，设备可以连接到其他接入点和互联网。\n\n##\
  \ 红外通信\n\n\n\n\n这项技术在几个世纪初曾被部分用于手机，但现在其用途已局限于电视、汽车和音响设备的遥控器。它利用了电磁频谱中的红外波。\n\n##\
  \ 多址技术\n在我们深入探讨各种多址技术之前，简要了解什么是多址是必要的。多址是一种允许多个用户以非常有效的方式共享分配的频谱的技术。由于频谱的局限性，需要进行共享，这最终会提高容量。这一过程通过允许多个用户同时使用可用带宽来实现。在计算机网络和通信方面，多址允许不同的终端接入同一个多点传输介质。因此，在该网络上实现了传输和共享。\n\
  \n### 频分多址 (FDMA)\n这是分配给 30 个不同信道的无线蜂窝电话通信的频段分段。每个信道都传输一个语音会话。`FDMA` 是模拟高级移动业务（`AMPS`）中采用的基础技术。`AMPS`\
  \ 是北美安装最的蜂窝电话形式。`FDMA` 的基础是特定通道在一次只分配给一个用户。这是总接入通信系统（`TACS`）使用的框架。在数字高级移动业务中，也使用了\
  \ `FDMA`。然而，在这种情况下，增加了时分多址。这导致每个 `FDMA` 信道产生三个信道。最终，这使得信道上可以处理的通话数量增加了三倍。\n\n###\
  \ 时分多址 (TDMA)\n时分多址技术相当复杂。这是因为发送器和接收器之间需要存在某种同步。这种技术广泛应用于数字移动无线电系统。这种数字蜂窝电话通信技术实现了在不产生干扰的情况下对特定频率共享。该框架的基本功能是将特定信号分为不同的时隙，从而增强数据携带能力。不同的移动站为特定的时间间隔分配一个频率。在许多情况下，一段时间内的系统总带宽并没有分配给某个站。但系统频率被划分为所谓的子带。这样做之后，`TDMA`\
  \ 被用于在每个子带中进行多址。使用 `TDMA` 有几个优点：它为非常灵活的速率提供了空间。此外，它能够承受剧烈且变化的流量。宽带系统不需要保护带。然而，`TDMA`\
  \ 也有一些缺点。它具有宽带系统的高数据速率，需要一些复杂的均衡。\n\n### 码分多址 (CDMA)\n这是另一种多用形式，它使得不同的信号占用特定的传输通道。`CDMA`\
  \ 实现了可用带宽的优化。这种技术主要用于超高频蜂窝电话系统。这种多用技术与时分和频分不同。在这种情况下，用户全时间访问整个带宽。该系统有一个基本原理，涉及通过编码来区分不同用户。这允许大约\
  \ 61 个用户同时使用。通话和理论限制通过 64 个 `Walsh codes` 进行区分。最大通话数会由于运行单元和质量问题等因素而减少。实际上影响 `CDMA`\
  \ 容量的因素有四个：\n- 处理增益\n- 信噪比\n- 语音活动因子\n- 频率复用效率\n\n在 `CDMA` 上，用户处于不同的频率，并通过代码分离。这意味着\
  \ `CDMA` 在存在噪声和干扰的情况下始终能够有效运行。\n\n#### CDMA 的优点\n- `CDMA` 框架对功率有非常严格的控制。这意味着当用户靠近以相同功率传输的基站时，信号会被淹没。为了防止这一点，信号功率必须高于或低于接收器的功率。\n\
  - 可以通过分集接收机改善信号接收。\n- 在 `CDMA` 的情况下，可以使用软手切换。\n- `CDMA` 框架旨在减少干扰。\n\n#### CDMA 的缺点\n\
  - 必须仔细选择代码长度以避免复杂性。\n- 为了功能正常，时间必须正确同步。\n- 由于逐渐传输，无线资源的使用增加，最终降低了信号容量。\n\n### 空间分多址\
  \ (SDMA)\n这是一种卫星通信系统，通过利用抛物天线的定向特性优化了无线频谱的使用，并降低了系统成本。空间分多址被称为空间分复用。该框架中的卫星天线具有将信号传输到地球不同位置的功能。你应该注意的一个事实是，对于\
  \ `SDMA` 框架，你需要为每个发射器仔细选择区域。此外还需要精确的天线对准。如果有任何误差，可能会导致一个或多个信道的故障。此外，会导致各个信道之间的干扰。\n\
  \n### 扩展频谱多址 (SSMA)\n对于扩展多址，信号一旦传输带宽大于所需的最小 RF 带宽就会被使用。扩展频谱有两种主要类型，分别是：\n- 跳频扩频频谱：在这种数字多址系统中，单个用户的载频在宽带信道范围内以伪方式变化。在这种情况下，数字数据被分成大小相似的突发数据，随后在几个其他载频上传输。\n\
  - 直接序列扩频：在 SSMA 类型中，这种最常用于 `CDMA`。在这种情况下，每个用户都有一个与其他用户代码正交的代码字。每当需要检测用户时，接收器必须知道发送器正在使用的代码。\n\
  \n## 信道特性\n无线通信信道有几种特性。重要的特性包括：\n- 链路损耗：可以表示为特定路径上信号功率相对于接收器传输的相同信号功率的比值。该因素是传播距离的函数。在设计和部署无线通信网络时，有估计链路损耗的相关需要。此外，还有许多影响链路损耗的因素，例如：使用的无线频率以及地形特性。\n\
  - 衰落：这是信道的另一个特性。这种现象是指信号到达接收器时的强度波动。衰落有两种主要类型，即：\n\n\n\n\n# 快衰落（也称为小尺度衰落）和慢衰落（大尺度衰落）\n\
  \n快衰落是指接收信号的相位、幅度和多路延迟发生剧烈波动的情况。这是由于几个在不同时期到达接收端的相似传输信号版本之间产生干扰引起的。另一个因素被称为时延扩展。这指的是接收到第一个版本的信号和最后一个回声信号之间的时间间隔。导致衰落的传播机制三种，分别是：反射、衍射和散射。\n\
  \n慢衰落的描述已言乎尽意。这意味着信号衰减得非常缓慢。它是当发射器和接收机之间的传输发生吸收时所产生的一种衰落形式。这种现象被称为慢衰落，因为它的完成需要几秒钟或几分钟。\n\
  \n## 干扰\n\n每个无线连接都有受到干扰的趋向。这种干扰可能源于多个源，但可以分为两类：邻信道干扰和同频干扰。\n\n在邻信道干扰的情况下，附近频率的信号包含其本地环境中不存在的分量。因此，这些分量的持续传输往往会受到相邻频率的干扰。然而，通过在规定的频率范围之间引入保护带，可以避免这种干扰。在某些情况下，同频干扰也被称为窄带干扰。这种干扰形式总是由于在相似传输频率上共振的附近系统引起的。\n\
  \n## 多普勒频移\n\n这是另一个影响无线通信的因素。它是由于信号中产生的衰落引起的。每当发射机相对于接收机移动时，就会发生多普勒频移。相对于接收机的移动会导致信号频率的变化。因此，发射端和接收端的信号频率存在差异。这种现象在声波中很容易被观察到。\n\
  \n观察这种现象的一种实际方法是驶来的汽车。汽车的声音在你靠近时变得越来越大，随着它快速经过你远去，声音变薄。\n\n## 路径类型\n\n从发射器到接收器的信号传输过程中，有两种主要的路径类型。这些是：直径和多径。遵循的路径在某种程度上影响无线信道特性对传输信号的影响程度。\n\
  \n### 直径\n直径的定义并不复杂。当传输信号直接到达接收机时，就说它通过了直径。这种传输涉及一些分量，它们被称为直径分量。\n\n### 多径\n在这种情况下，来自发射器的信号在通过不同方向后到达接收机。通过不同的方向，信号会经历不同的现象。这种传输是由被称为多径分量的不同组件实现的。这些信号所的各种现象包括：反射、衍射和散射。当它们最终到达接收机时，幅度、频率和相位会发生变化。这与直径实现的效果不同。\n\
  \n## 多样性及其类型\n\n有不同的接收机技术，其中分性（Diversity）是一种强大的技术。作为一种通信接收机技术，分性以相对较低的成本提供了链路改进。各种分性技术的主要功能是提高衰落无线信道的整体性能。在\
  \ във系统中，接收机提供了特定信息的多个副本。这些信号随后通过两个或多个真实/虚拟信道进行传输。由于此，可以得出分性背后的基本概念是信息的重复或冗余。\n\n\
  ### 多样性的类型\n\n有不同类型的分性，如下：\n\n*   **频率分性**：这是一种多样性形式，相同的信息信号在多个载波上进行传输。在这种情况下，信号之间的频率间隔至少为相干带宽。\n\
  *   **时间分性**：这是一种多样性形式，信息信号按顺序间隔进行传输。在这种情况下，传输时间应大于相干时间。这种情况下的时间间隔完全取决于衰落速率，并且随着衰落速率的降低而增加。\n\
  *   **极化分性**：在极化分性的情况下，携带信息的信号电磁场被修改。这导致正交类型的极化。\n*   **角度分性**：在角度分性的情况下，使用定向天线创建正在传输信号的独立副本，这是通过多条路径实现的。\n\
  *   **空间分性**：空间分性涉及多个天线在它们放置的不同位置接收信息。这导致不同的信号被独立接收。\n\n分性是传输中一个非常重要的方面。在大多数使用分性的情况下，是接收机做出分性决策，而不是发射机。\n\
  \n\n\n\n\n# 第 7 章：物联网无线技术\n\n全球范围内的通信技术已经变得前所未有的简单。无论你处于世界的何处，都可以到达任何地方。得益于无线网络，各种设备之间的互连互通成为可能并且可以实时完成。通信已经超越了多年前的模样。现在，我们处于一个设备之间可以相互交互、与人类相互交互的世界。\n\
  \n物联网正逐渐成为技术领域中一个备受关注的核心议题。它不仅将影响我们的生活方式，还将影响我们的工作方式。你一定听过人们预告过关于未来工作你需要的知识。虽然这些都是事实，但你应该知道，未来已经到来。计算机之间以一种非常简单的方式连接，这与以前看到的任何情况都不同。\n\
  \n`IoT` 周围存在许多技术细节，但它们都是可以理解的。物联网简单来说是将任何带有“开启”和“关闭”开关的设备连接到互联网，或连接到另一个设备。你能想象到的几乎任何设备都可以享受这种连接。比如你的咖啡机、洗衣机、耳机甚至灯具。它被称为物联网，是因为它是万物的巨大连接。这种关系可以建立在人与人之间、人与人之间、物与物之间以及物与物之间。\n\
  \n物联网是一个广泛的概念，无线通信在其中起着主要作用。与物联网相关的一切的核心都是无线通信。正是这些技术允许设备之间的通信。这种通信不需要设备之间直接连接即可实现。其连接模式通常是无线频率或\
  \ `RF`。\n\n这种通信框架并非全新，因为它从 20 世纪初就一直存在。它并没有像 20 世纪的一些技术那样过时，而是不断增长和进化，以满足 21 世纪的日常需求。在书的后面章节，我们将深入探讨物联网以及它的未来。然而，在本章中，我们将看看多年来对物联网发展起性作用的各种无线通信技术。\n\
  \n## Zigbee 无线技术：其架构与应用\n\n市上有不同的无线技术，但人们很容易认为 Zigbee 无线技术是最出色的。这是因为它是低成本且低功耗的。它具有许多许多特性使其非常出色。它是嵌入式应用、工业控制、家庭自动化等最理想的技术。\n\
  \nZigbee 无线技术的主要功能是为控制和传感器网络供电。这是通过 `IEEE 802.15.4` 无线局域网（`WPANs`）标准实现的。这是一种通信标准，定义了物理层和介质访问控制层。这样做是为了处理低数据速率的设备。各种\
  \ Zigbee `WPANs` 能够在 `868 MHz`、`902 – 928 MHz` 和 `2.4 GHz` 频率上工作。这种无线通信技术用于控制和监控应用，范围在\
  \ 10 到 100 米之间。这种通信形式比 `Bluetooth` 和 `Wi-Fi` 等其他技术更便宜、更简单。\n\nZigbee 支持不同的网络配置，并且由于节省电池，它可以在不同的模式下运行。Zigbee\
  \ 网络设计用于通过路由器扩展使用。它还允许许多节点相互连接。通过这种方式，构建了更广域的网络。\n\n## Zigbee 架构\n\nZigbee 系统结构由三种不同的设备组成，即\
  \ `Zigbee 协调器 (coordinator)`、`路由器` 和 `终端设备 (end device)`。在每个 Zigbee 网络中必须至少至少一个\
  \ `Zigbee 协调器`。该协调器充当网络的根和桥梁。它还负责在网络接收和传输数据时处理和存储信息。在这种情况下，路由器充当中间设备，调节数据在设备与设备之间的传递。对于终端设备，它们的功能有限，仅与父节点通信。\n\
  \n在 Zigbee 无线通信网络中，涉及的协调、路由或终端设备数量始终取决于建立的网络类型。有不同的网络类型，包括星型、树型和网状型。在 Zigbee 无线通信架构中，有不同的层：\n\
  \n*   **物理层**：该层负责网络上传输和接收信号时的调制和解调。\n*   **MAC（介质访问）层**：该层负责通过 `载波侦听多路冲突规避 (CSMA)`\
  \ 获取多个网络的访问权限以可靠地传输数据。`MAC` 层还负责传输同步通信的信标帧。\n*   **网络层**：网络层负责所有与网络相关的操作，如网络设置、路由、终端设备的接入和断开连接。\n\
  *   **应用支持子层**：应用层提供了各种服务，以便在 Zigbee 设备对象与应用对象及网络层之间建立接口，以实现数据管理。应用层支持子层负责根据指定的服务和需求合并设备。\n\
  *   **应用框架**：框架层有两种数据服务类型，充当键值对和通用消息服务。\n\n\n\n\n\n# Zigbee 模式及其拓扑结构\n\nZigbee 数据传输有两种模式，即非信标模式和信标模式（beacon\
  \ mode）。在信标模式下，协调器和路由器都被设计为持续监控进入系统的数据状态。只要 Zigbee 系统处于这种模式，路由器和协调器就一直处于活动状态。这是因为节点在任何时间点都可能为了通信而被唤醒进行通信。在信标模式下，当终端设备不进行数据通信时，路由器和协调器会被强制进入睡眠状态。每隔一段时间，协调器激活并向网络路由器方向发送信标。信标网络适用于需要低占空比和更长电池寿命的场景。Zigbee\
  \ 网络的信标和非信标类型有助于管理周期性、间歇性和重复性的数据类型。\n\nZigbee 网络主要有三种拓扑结构，分别是：星型、网状型和簇树型拓扑。所有这些拓扑结构都包含一个或多个协调器。\n\
  \n### 星型拓扑\n在星型拓扑中，Zigbee 网络由一个协调器组成。该协调器负责初始化和管理网络上的各种设备。直接与协调器通信的设备被称为终端设备。星型拓扑是一种用于所有终端设备都需要与中央控制器通信的网络系统。星型拓扑的优点是非常易于组装和部署。\n\
  \n### 网状和树型拓扑\n在网状（mesh）和树型拓扑中，Zigbee 网络扩展了许多路由器，并需要协调器来将它们连接。通过这些设备的连接，可以与其他相邻节点通信，从而为数据提供冗余。由于拓扑结构的存在，一旦某个节点故障，网络上的其他设备也能接收到此信息。网状拓扑主要用于工业领域，因为工业对冗余性非常重视。\n\
  \n特别是簇树（cluster-tree）网络，每个簇由一个协调器和若干叶子节点组成。协调器随后连接到一个父协调器，父协调器是整个网络的初始化器。\n\n##\
  \ Zigbee 技术的应用\n\n- **工业自动化**：这是 Zigbee 网络的主要用途之一。它降低了通信成本，并优化了控制过程，使其更加可靠。\n- **家居自动化**：它也完美适用于家用电器控制，如照明控制、电器控制以及制暖冷却系统和家中的其他安全设备。\n\
  - **智能抄表**：Zigbee 远程操作可用于智能抄表，如能源消耗响应、定价支持等。\n- **智能电网监控**：Zigbee 网络也可用于智能电网系统的运行。\n\
  \n# WiMax\n\nWiMax 是全球微波接入互操作性（Worldwide Interoperability for Microwave Access）的缩写。它是用于远距离无线网络的技术标准。WiMax\
  \ 对移动和固定连接都有效。然而，尽管曾被设为领先的互联网通信形式以及电缆和 DSL 的广泛替代方案，但最近其使用率有所下降。阻碍其广泛采用的因素之一是高成本。这项技术并不是\
  \ Wi-Fi 的替代品，也不是热点技术的替代品。但如果需要在安装如 DSL 的标准有线硬件或 WiMax，后者更便宜。WiMax 有两种基本形式：基站和接收器。基站由服务供应商安装，用于在特定区域部署技术；而接收器是客户安装的网络部分。\n\
  \n## WiMax 的优点\n该网络框架非常受欢迎，因为它的成本较低。它在本质上也具有灵活性。与其他互联网技术相比，WiMax 的安装速度更快。由于只需要短塔和较少的电缆，安装时间总是更短的。通过\
  \ WiMax，你还可以享受语音和视频传输能力，以及电话接入。在执行有线技术不经济的地区，WiMax 是最佳选择。\n\n## WiMax 的缺点\n使用 WiMax\
  \ 时，连接强度会随着用户远离源而减弱。此外，WiMax 的流行程度有所下降，导致许多移动设备没有内置 WiMax 支持。\n\n# 无线技术的优点\n\n从有线技术转向无线技术对你的组织来说是再贴切不过的。这是你的设施需要迈出的一大步，其中有很多原因。与有线网络技术相比，无线技术具有一些优势，使其处于领先地位。\n\
  \n- **增强的移动性**：这是改变我们生活的革命性优势之一。现在，你可以在世界上任何地方连接到其他设备或互联网。随着移动技术出现，移动用户被授予实时访问权限。此外，如果你在公司机构工作，你可以访问公司的网络，而无必受限于特定位置。这种方式提高了团队协作效率和生产力，而这在有线网络上几乎是不可能的。\n\
  - **安装速度和简单性**：使用无线系统可以减少所需的电缆数量。有线网络的安装和设置总是非常麻烦。此外，有线网络的设置可能会出现安全问题，特别是安装后。同时，无线网络的安装速度是极快的。\n\
  - **提供更广泛的网络覆盖**：如果你的组织中有地方无法通过电线到达，无线网络就大显身手了。无线连接可以延伸到你任何需要的地方。\n- **更具活性**：技术总是在更新，你的通信系统难免面临升级需求。如果你的组织使用有线通信网络，升级可能会非常麻烦。但通过无线技术，你可以轻松升级通信系统。在无线网络上实现满足新配置的更新非常容易。\n\
  - **随时间推移降低所有成本**：虽然最初建立无线网络可能比有线网络贵，但随着时间的推移，你会发现它的实际成本更低。除了它经得起时间的考验外，它还能节省需要升级时不断铺设新电线和硬件的压力。\n\
  - **增强的可扩展性**：你始终可以配置无线网络以满足某些应用的特定需求。需要时，你可以轻松实施更改并扩展这一过程。\n\n## 无线技术的缺点\n尽管使用无线技术可以允许不同用户在无需布设电线的情况下访问大型信息库，但其使用也有一些缺点。\n\
  \n- **成本**：这是让人们望而却步使用无线网络的关键因素之一。它们的安装和设置通常很昂贵。尽管这是唯一需要花费大量资金的时候。在设置时，你承担的成本可能比有线网络高四倍。\n\
  - **覆盖范围**\n\n\n\n\n\n无线网络的覆盖范围始终存在限制。例如，路由器的范围通常仅在 150 到 300 英尺之间。\n\n### 可靠性\n\
  这是无线网络的另一个问题，它非常容易受到干扰。它很容易受到相似频率无线电信号的干扰，以及来自其他设备的辐射。物理结构也可以成为干扰的源。\n\n### 安全性\n\
  无线网络存在安全问题，因为网络范围内的任何计算机都可以轻松访问。一旦信息通过网络传输，即使信息经过加密，也容易被黑客入侵。\n\n### 速度\n直言之，众所周知无线网络比比有线网络慢一些。在某些情况下，速度甚至会慢\
  \ 10 倍。\n\n### 无线技术面临挑战\n尽管无线技术席卷了我们的生活，几乎每个连接现在都可以通过无线完成。然而，这项技术尚未让电线彻底消失。无线技术面临着许多挑战。\n\
  \n### 物理连接\n在对一些志愿者的研究中发现，使用无线技术面临的主要挑战之一是组件的物理构造。无线网络始终有局限性。在地下室、低楼层和钢制建筑中，网络信号总会发生偏移。在很多情况下，地形是一个问题。在许多研究的案例中，参与者在享受增强网络之前，需要先安装分布式天线系统或移动虚拟专用网络。\n\
  \n### 技术连接问题\n如果无线网络要支持同时处理大量数据流，则带宽需要进一步提高。事实会有创新解决这些问题，特别是随着 `5G` 网络出现。然而，在全球范围内普及之前，这仍然是一个需要解决的重大问题。\n\
  \n### 安全性\n在使用无线网络时，安全性仍然是一个大问题。尽管集成了用于保护无线网络的工具和框架，但它们仍然容易受到网络攻击。虽然绕过系统的安全性并不是一个容易啃的骨头，但人们仍然能找到绕过的方法。无线网络的安全性尚未达到完全完善。一旦网络在特定位置可以被访问或可见，它就可以被桥接。这一事实使得使用无线网络的组织必须不断升级其安全框架等。这需要雇佣\
  \ IT 安全专家来监控和维护安全协议，以确保系统的安全可靠。\n\n### 管理\n系统会有多次宕机时间。为了确保用户拥有最佳体验，管理层承担着在用户发现问题之前实时察觉问题的责任。因此，需要不断对网络执行调查和测试，以升级和维护系统。\n\
  \n# 第 8 章：网络协议\n协议是计算机系统有效运行的内在属性。它们就像独裁者或地图，系统遵循这些规则来执行特定任务。没有协议，计算机可能很难执行任何操作。从技术上讲，协议可以定义为通信基础的一组规则。协议是经过同意的指南集，使得事物运行正常。无线通信的不同方面都指定了适用于它们的特定协议。在本章中，我们将深入研究我们拥有的各种协议。\n\
  \n### 互联网协议\n互联网协议是一组数字消息格式和规则，用于在单个网络或一组相互连接的网络中，计算机之间正确交换消息。这套指令系统利用了所谓的互联网协议套件，在大多数情况下，它被称为\
  \ `TCP/IP`。计算机与网络之间的这种消息交换是以数据报（也称为数据包）的形式进行的。互联网协议套件中，互联网层最首要的是 `IP`。`IP` 是一个由多个通信协议组成的集合，由四个抽象层组成。这些层是：链路层、网络层、传输层和应用层。`IP`\
  \ 有一个主要功能是将数据报传递到指定的主机。这一过程被称为封装。\n\n### 互联网协议类型\n你认为互联网是什么？很多人误认为互联网就是万维网（WWW）。`WWW`\
  \ 只是互联网的一部分，它由 `FTP`、`Gopher`、`Telnet` 等组件组成。互联网上有多种协议，每种协议都有自己的标准和用途。\n\n#### 电子邮件\n\
  事实证明，有三种协议促进你的电子邮件。这些是简单邮件传输协议 (`SMTP`)、邮件访问协议 (`IMAP`) 和邮局协议 3 (`POP3`)。对于 `SMTP`，它是用于从邮箱发送邮件的协议，而后两者用于接收邮件。几乎每个互联网提供商都支持这三种协议。\n\
  \n#### 文件传输协议\n这简写为 `FTP`，是在两个计算机之间传输文件时使用的协议。它也常用于将网页上传到服务器，以便在万维网上可见。使用 `FTP`\
  \ 需要一个名为客户端的特殊程序。\n\n#### `HTTP (万维网)`\n这被称为超文本传输协议。它是 Web 服务器使用的协议，使得网页可以在浏览器中显示。对于你想访问的每个\
  \ Web 地址，当你查看地址栏时，你会看到前缀 `http://`。这种信息主要显示在地址栏中，因为某些浏览器能够启用 `FTP`。这种方式，它向浏览器预告了预期的信息类型。\n\
  \n#### 新闻 (Usenet)\n网络新闻传输协议是用于促进 Usenet 的一种。这类似于位于网页上的论坛。在 `Usenet` 上，还有专门为公司设立的论坛。`Usenet`\
  \ 可用于各种领域，从计算机相关主题、科学、讨论等。\n\n#### Gopher\n这是互联网上的另一种工具。你很有可能没有听说过这种协议。它的主要功能是允许浏览器在不知道材料位置的情况下搜索信息。你可以搜索信息列表，然后它们将其汇总并发送给你。\n\
  \n#### Telnet\n\n（此处原文未结束）\n\n\n\n这种协议允许你从世界上任何地方操作特定的远程计算机。你可以操作这台计算机，就像你坐在它面前一样。一旦你登录，就可以控制那台远处的远程计算机。\n\
  \n## 传输控制协议 (TCP)\n\n这是最重要的无线通信协议之一。它也基本上用于网络上的数据传输。这套协议栈与互联网协议 (IP) 配合得非常完美，这对组合被称为\
  \ `TCP/IP`。虽然网络中的 IP 部分负责对数据包进行寻址并将其从源转发到目的地，但 TCP 则负责确保传输的可靠性。\n\n### TCP 是做什么的？\n\
  \n如前所述，TCP 的目的是确保数据传输尽可能地可靠。在互联网上，数据传输是通过数据包完成的。数据包是在网络上独立发送的数据单元。一旦这些数据包到达目的地，它们就会被排序和重新组合。特定网络上的数据传输是分层完成的，每一层都执行与其层层互补的功能。\n\
  \nTCP 和 IP 设计为在信息的每一层堆栈中手手协作工作。TCP 操心于传输数据的控制，而 IP 负责网络上的信道传输。在存在 Wi-Fi 的情况下，它控制局域网上的传输。你现在应该熟悉\
  \ TCP 的基本功能了，即“它负责确保传输过程中的可靠性”。\n\n有一些因素决定了传输的可靠性。可靠的传输指的是：\n\n*   在传输过程中没有数据包丢失，即它们都到达了目的地。\n\
  *   消除了所有影响数据质量的延迟。\n*   所有数据包都进行了更有序的重新组装。\n\n### TCP 是如何工作的？\n\n在任何传输过程中，所有数据包都会被\
  \ TCP 标记（编号）。除了编号之外，TCP 还会分配一个所有数据包必须到达目的地的截止时间。每当接收到任何数据包时，源设备都会收到一个名为“确认”（acknowledgement）的数据包通知。当超过截止时间且源端没有收到确认时，它会发送数据包的副本。完成后，你就可以确保数据包已按序重新排列。\n\
  \n### TCP 寻址\n\n与 IP 不同，TCP 并没有复杂的寻址系统。对于 IP 来说，它被称为 IP 地址。事实是，TCP 不需要这种地址。在 TCP\
  \ 框架中，它仅利用其所工作设备提供的数字来识别源包和接收包。这些标记数字被称为 `ports`（端口）。例如，在浏览器上，端口 `80` 用于 TCP。电子邮件使用端口\
  \ `25`。这个端口号也会与 IP 地址一起使用，因此我们可以得到类似“192.168.66.5.80”这样的结构。\n\n## 用户数据报协议 (UDP)\n\
  \n不要被存在的许多协议搞迷了，你整个职业生涯可能并不需要所有它们。事实上，大多数协议都是尽可能自动的，只管执行它们的工作。另一个重要的协议是用户数据报协议 (`UDP`)。`UDP`\
  \ 是你在 `TCP/IP` 协议族中能找到的最简单的传输层通信协议。它被称为最简单并非毫无根据，因为它包含了最少量的通信组件和机制。在某些情况下，`UDP`\
  \ 被认为是不可靠的。然而，它利用了 IP 服务，这在某种程度上优化了它的性能。`UDP` 框架的一个明显缺点是，与 `TCP` 不同，接收器不会为收到的包创建确认。事实上，发送者也不等待。这是该框架未能填补的一个巨大缺陷。\n\
  \n### UDP 的要求\n\n你可能会想，既然有其他可靠的替代方案，为什么我们线无线通信中还需要使用这个框架呢？很好，`UDP` 主要用于各种确认包所占带宽与发送的原始数据相似的情况。例如，你在流媒体视频时可以使用\
  \ `UDP`，因为任何丢失的数据包都不会被注意到。\n\n### UDP 具有哪些特征？\n\n*   该框架主要用于不需要对数据进行确认的情况。\n*  \
  \ 另外，在数据只单向传输的情况下，`UDP` 非常好用。\n*   它非常简单，并适用于基于查询的通信。\n*   它不是面向连接的。\n*   没有提供拥塞控制机制。\n\
  *   交付的数据最终可能是无序的。\n*   它是无状态的。\n*   它最适用于 VoIP 等流媒体应用。\n\n### UDP 头部\n\nUDP 头部有四个主要参数：\n\
  \n*   `Source port`（源端口）：这是 `UDP` 上的 16 位信息，功能是识别数据包的源。\n*   `Destination port`（目的端口）：这也是\
  \ 16 位信息，功能是识别特定目的地的应用级服务。\n*   `Length`（长度）：这是整个 `UDP` 数据包长度的规格。\n*   `Checksum`（校验和）：该参数用于存储在数据包传输前在源生成的校验和值。\n\
  \n\n\n\n\n# UDP 的应用\n\n`UDP` 在数据传输中被应用于多个领域，这些包括：\n- 域名服务 (DNS)\n- 简单网络管理协议 (SNMP)\n\
  - 简单文件传输协议 (TFTP)\n- 路由信息协议 (RIP)\n- Kerberos\n\n然而，使用 `UDP` 进行数据传输的系统不仅限于这些。\n\n\
  ## 无线网络协议\n\n在大多数情况下，无线网络被误认为是 Wi-Fi 网络。但正如本书早期建立的，`Wi-Fi` 与无线通信技术是不同的。事实证明，无线网络协议在消费级设备中具有巨大的用途。\n\
  \n### LTE\n`LTE` 技术的设计增强了数据传输速率，并解决了旧手机协议中遇到的其他问题，例如漫游问题。在该协议上，速率可约 100 Mbps。然而，无论这项技术有多优秀，由于手机运营商在某些地区尚未部署，仍然存在局限性。这种运营商的缺失由于安装成本高昂以及政府监管。然而，`LTE`\
  \ 技术并非为支持家庭和 `LAN` 网络设计的，而是为了支持远距离的消费者。\n\n### Wi-Fi\n我们在本书之前已经讨论过 `Wi-Fi` 的整个概念。这项技术已成为家庭、办公室和其他个人区域采用默认连接技术。该技术在\
  \ 20 世纪 90 年代流行起来。在某些情况下，该技术可以被控制进行更距离的传输。但在大多数情况下，它们最适合个人和家庭使用。`WI-Fi` 实际上具有受保护的访问安全协议，这为网络增加了一层身份验证以及数据加密。这种访问技术主要为了防止第三方访问网络或挖掘个人数据。\n\
  \n## 蓝牙\n这是世界上最流行的无线技术之一。它创建于 20 世纪 90 年代，并已无处不在。与 `Wi-Fi` 不同，运行 `Bluetooth` 只需要极小的功率。因此，与\
  \ `Wi-Fi` 相比，`Bluetooth` 设计为仅传输短距离。在许多设备中，`Bluetooth` 已经被 `WI-Fi` 取代。\n\n### 60\
  \ GHz 协议 – WirelessHD 和 WiGig\n视频流媒体已成为个人电脑上一项非常流行的活动。这需要一种能够更好地支持它的无线网络协议。这些协议创建于\
  \ 20 世纪 20 年代，旨在提供高清流媒体。\n\n### 无线家庭自动化协议 – Z-Wave 和 Zigbee\n这些是为家庭自动化设计的无线协议。它们的设计旨在利用低功耗特性。\n\
  \n## 网络路由协议\n\n是否听过所谓的路由协议，并对此好奇它到底是什么？其实非常简单。路由协议利用软件和某些路由算法来确定节点之间数据和信息的最佳传输模式。路由协议的主要功能是建立路由器通信，以及对整个网络拓扑结构的理解。在某些情况下，路由协议也被称为路由策略。为了促进计算机之间更有效的通信，路由协议随着时间的推移不断开发和创新。路由协议的工作非常简单：\n\
  \n- **发现**：识别网络上其他路由器的过程\n- **路由管理**：跟踪网络上的各种潜在目的地\n- **路径确定**：这是协议对应该将网络消息发送到何处做出决策。\n\
  \n\n\n\n\n有些路由协议提供了网络链路映射的完整细节，而另一些则仅允许路由器根据较少的信息工作。\n\n# 路由协议的分类\n路由协议主要分为三大类。\n\
  \n## 距离矢量路由协议\n这些协议旨在帮助（基于跳数）选择在特定网络上从特定方向到达目的地的最佳路径。此类协议中的某些协议是动态的，这使得它们在功能性能上是最优的。其中之一就是\
  \ `RIP`。在这个框架中，跳数是指源网络和目标网络之间存在的各种路由器。在所有可能的路径中，跳数最少的路径被选定为最佳路径。\n\n#### 特性\n- 网络更新定期交换\n\
  - 更新总是广播的\n- 此框架中的路由器基于邻居路由器提供的信息做出决策。\n\n### 缺点\n- 信息的定期交换大多数时候会导致不必要的流量\n- 交换也会导致安全问题\n\
  - 定期广播网络大多数情况下会产生不必要的流量。\n\n## 链路状态路由协议\n与其他协议不同，这些路由协议对互联网络有更多了解。它们也被称为 `SPF`（最短路径优先）。一个例子是\
  \ `OSPF`。\n\n#### 特性\n- 该协议中的更新只有在拓扑发生变化时才能启动。\n- 仅交换邻居路由器请求的更新。\n\n该路由协议维护三张表，分别是：\n\
  - `Neighbor table`（邻居表）：这是作为路由器邻居信息存储表。\n- `Topology table`（拓扑表）：这是包含整个拓扑信息的表，包括数据包可以采取的最佳和备份路由。\n\
  - `Routing table`（路由表）：网络上最佳路由的数组。\n\n## 高级距离矢量路由协议\n这在某种程度上是混合，是链路和矢量路由协议的结合。此类路由协议的一个示例是`增强内部网关路由协议`。\n\
  \n# 网络路由协议的类型\n如上所述，所有路由协议分为三类。有几种路由协议使得无线和有线网络有效运行。这些是：\n\n### 路由信息协议\n这是在局域网和广域网中广泛使用的路由网络。缩写为\
  \ `RIP`，其功能基于距离矢量算法。该协议自 1988 年定义以来，到此后有两个版本。你现在可以使用任何一个版本。\n\n### 内部网关路由协议\n这种路由协议由\
  \ `CISCO` 制作，用于路由器中交换独立系统内部的路由数据。\n\n### 开放最短路径优先\n这是一种用于互联网协议的活动性路由协议。它是链路状态路由协议的一个示例，包含了所有主要的内部网关协议组。该协议主要用于具有大型网络的公司。\n\
  \n### 外部网关协议\n这是互联网的终极路由协议，由 Eric C. `EGP` 在 1982 年指定。它最初在 `RFC827` 中表示，但在 1984\
  \ 年的 `RFC 904` 中得到了正确规范。该网络路由协议的拓扑结构类似于树。\n\n### 增强内部网关路由协议\n这是另一种距离矢量路由协议，但它配备了先进技术以减少拓扑发生变化时出现的不稳定性。它享受基于\
  \ `DUAL` 工作的通用优化，以及无环操作。该网络协议还提供了一种快速连接的方法。\n\n### 网关协议\n这些是在互联网上核心网络路由协议，负责维护互联网协议表，该表旨在允许\
  \ `AS` 内部的网络访问能力。\n\n### 中间系统到中间系统\n这是一种伟大的协议，网络设备用它来决定最佳路由，将数据报在交换网络上从一端传输到另一端。这个过程就是所谓的路由。\n\
  \n# 网络安全协议\n网络安全协议是确保传输数据安全、可靠的网络安全协议。这些协议旨在保护网络免受非法用户的侵害。\n\n## HTTPS\n这是用于保护流量的协议。它旨在保持发送的信息安全。\n\
  \n## 防火墙\n这是电子商务中常用的协议，用于保护支付网关和服务器。如果这些受到攻击，将影响多个用户。\n\n防火墙有三大类：\n- `Packet filter`（包过滤）：负责通过通过网络接口的数据。此时需要的信息是\
  \ `IP-address`、`port numbers` 和目的地。你可以轻松地在你的无线网络上安装和实现此防火墙。优点是它可以很容易维护，但提供的保护水平很低。\n\
  - `Filter circuit`（电路过滤）：这是防火墙安全的中间水平。它设计用于监控客户端和外部主机接接处的协议活动，检查请求的会话是否有效。这种防火墙并不贵，最适合保护私有网络。\n\
  - `Application-level`（应用级）：为你的网络提供最高级别的防火墙保护。然而，它的设计更复杂，且需要额外成本。\n\n## IPSEC\n这是一种在网络层加密数据的安全协议。其中嵌入了三个主要协议：\n\
  - `authentication header`（认证报头）：提供数据源认证、数据完整性以及防止重复消息的安全保护。\n- `encapsulating secure\
  \ payload (ESP)`（封装安全载荷）：旨在为载荷提供验证和完整性，但对 `IP` 头不做。\n- `internet key exchange (IKE)`（互联网密钥交换）：它的主要功能是解决密钥分配协议的问题。\n\
  \n## PCT\n这是 `Private Communication Technology` 的缩写，其基本工作原理类似于 `SSL`。`PCT` 和 `SSL`\
  \ 的唯一区别是传输消息的大小。与 `SSL` 相比，`PCT` 的消息更小。像 `Microsoft Explorer 3` 这样的浏览器使用了 `PCT`。\n\
  \n\n\n\n\n# 网络管理协议\n\n名称已经说明了一了一切。网络管理协议是一组协议，负责定义用于管理、监控和维护计算机网络的进程和策略。这组指令被认为用于传达和管理在特定计算机网络上发生的各种操作和通信。在每一个管理协议中，始终存在着提取、收集、传输、存储和报告与管理相关信息所需的架构和程序。如果你想理解任何管理协议，务必确保你已经理解了其架构。这非常重要。\n\
  \n## 网络管理协议的类型\n\n在本书的这一部分中，我们将介绍你真正需要了解三个最流行的协议。还有其他协议，但与这些协议相比，相关性较低：\n\n### ICMP\n\
  \n这是一种网络层协议，是与 `IP` 协议相关的子协议组的具体部分。该协议的主要功能是故障验证，以及确保性能。它能检测错误并据此发送信息。这就是为什么 `ICMP`\
  \ 的主要消息是错误消息和控制消息的原因。该协议用于计算延迟、响应时间或丢包率等因素的计算。\n\n### SNMP\n\n这是简单网络管理协议，是监督故障、性能和操作的应用层。`SNMP`\
  \ 的框架是用于收集、组织和通信位于网络上的各种设备的管理信息。该协议被用于许多硬件组件，以确保设备的多样性和品牌的多样性。\n\n#### SNMP 架构\n\
  \n`SNMP` 框架有两个基本组件，即 `SNMP` 代理（agents）和 `SNMP` 管理员（administrators）。`SNMP` 代理是一组运行与需要管理的元素元素相关的所有软件。它们主要收集设备数据，而\
  \ `SNMP` 管理员则更多地参与网络管理和监控部分。它们作为所有发送和存储数据的集中位置点。\n\n#### 数据在 SNMP 中是如何组织的？\n\n在\
  \ `SNMP` 中进行管理的数据被称为对象（objects）。\n- **OIDs（对象标识符）**：这些是主要功能为识别对象的基本元素。`OIDs` 的格式始终为：`.1.3.6.1.4.1.9.9.276.1.1.1.1.1.1.11`。该数字的提取自从识别对象生产者开始的层级组织系统。\n\
  - **MIBs（管理信息库）**：这些是数据从 `SNMP` 代理到 `SNMP` 管理员所遵循的基本格式。\n\n### WMI\n\n这是 Windows\
  \ 管理规范 string。它主要用于运行 `Windows` 软件的系统和设备。在 `WMI` 框架上，存在一种用于表示、获取和共享任何运行在 Windows\
  \ 上的硬件的管理信息的模型。\n\n#### 架构\n\n`WMI` 架构中有三个基本实体，即 `WMI` 提供者（providers）、`WMI` 基础设施（infrastructure）和管理应用程序。提供者负责从一个对象或另一个对象获取任何管理信息。基础设施是旨在桥接供应商与管理工具之间差距的框架。协议是让任何计算机网络正常工作的机制。它是引导每项操作的顺序和规则。如果没有协议来处理网络中发生的各个方面，你只能想象那种混乱的程度。\n\
  \n# 第 9 章：通信与蜂窝系统\n\n近年来的通信是通过蜂窝系统实现的。蜂窝通信是由于手机的使用而促进的一种通信方式。我们所知的手机都是基于蜂窝网络的。蜂窝通信的基础是无线电执行同时传输和接收的能力。主要在蜂窝网络中，特定小区内存在地理区域划分。蜂窝技术彻底改变了人类的社交方式。这项技术不断演进，以不同形式提供更快速、更有效且实时的通信。\n\
  \n## 蜂窝网络系统的特征\n\n无线蜂窝网络的出现作为频谱拥堵问题的解决方案。它还增加了用户容量。有一些特征使得这一切成为可能：\n\n- 在有限的频谱内提供高容量\n\
  - 它允许在不同小区间复用无线电信道\n- 在蜂窝网络上，允许固定数量的信道服务较大数量的信道。这是通过在不同区域复用信道实现的\n- 在这种情况下，通信始终发生在移动端和基站之间\n\
  - 将相邻小区分配到不同的信道组\n- 蜂窝网络确保干扰水平在可接受范围内\n- 存在频率复用或规划\n- 还有无线蜂窝网络的组织\n\n蜂窝网络始终被组织成多个低功率发射器。\n\
  \n### 小区的形状\n\n蜂窝网络覆盖的区域总是被分为所谓的“小区”（Cells）。在每个小区上，都有用于传输信号的天线。每个小区都有唯一的频率。跨蜂窝网络的数据通信始终由基站的发射器以及接收器和控制单元提供。小区有两种主要形状，可以是正方形或六边形。\n\
  \n#### 正方形\n在正方形小区中，有四个距离为“d”的邻居，另外四个距离为“2d”的邻居。\n\n#### 六边形\n这种形状在大多数情况下被推荐使用，因为它提供了简单的覆盖。另一个被推荐的原因归于它的形状。使用它具有一些优势：\n\
  \n- 提供了等距天线\n- 从中心到顶点的距离等于边长。\n\n### 频率复用\n\n这是一种现象，即在给定区域内使用相同的无线频率，特别是当它们之间隔着相当的距离时，从而在建立通信时提供最小的干扰。频率复用概念带来了一些益处：\n\
  \n- 它促进了特定频率在特定小区内的通信\n- 对逃逸到相邻小区的功率有限制\n- 频率始终可以在近小区上复用\n- 你可以使用同一个频率进行多次通信\n-\
  \ 在特定小区上可能有约 10 到 50 个频率\n\n\n\n\n\n# 窝网络的演变\n\n一切始于 `1G`，而现在我们正处于一个由超音速 `5G` 连接的世界。在过去的几十年里，通信取得了多遥远、多大的成就？第一代移动网络出现于\
  \ 20 世纪 80 年代初。但随着全球用户的爆炸式增长，需要不断扩张通信网络。这一切都始于意大利发明家`马尔可尼`（Marconi）。他成功地利用无线电波传输了`莫斯电码`信号。这种传输距离达到了\
  \ `3.2kms`。这可以追溯到 `1985` 年。这是世界上首次亮相的无线通信。从那时起，人们对改进无线电波进行了持续的研究。得益于这项发明，科学家和工程师开始研发兼容手机，以取代当时流行的有线电话。第一代移动手机是由`马丁·库珀`（Martin\
  \ Cooper）发明的，他当时在`摩托罗拉`（Motorola）工作。该原型是用于汽车的，开发于 `1974` 年。这项发明被认为是世界通信的转折点。\n\n\
  ## 1G\n\n这是迎接无线通信世界的第一个移动网络。该网络于 `1979` 年由日本电话电信公司（Nippon Telephone and Telegraph\
  \ Company）引入日本主流。在 `1980s`，它在美国、芬兰、英国和欧洲流行。这种情况下使用的是模拟系统。\n\n### 1G 的特性\n- 频率为 `800MHz`\
  \ 和 `900MHz`\n- 带宽为 `10Mhz`\n- 使用了模拟交换技术\n- 特点是频率调制\n- 使用了仅限语音的业务模式\n- 接入技术是频率分用多址\n\
  \n### 1G 的缺点\n- 由于干扰，语音音质很差\n- 电池寿命非常短\n- 手机尺寸大\n- 安全性较低\n- 用户数量和基站覆盖范围受到限制\n- 无法在\
  \ `1G` 网络上进行漫游\n\n## 2G – 第二代通信系统\n\n`2G` 的到来标志着新数字技术的开始。它也被“全球移动通信系统”。`GSM` 技术很快成为无线通信发展的标准。它能够支持高达\
  \ `14.4` 到 `64kbps` 的数据速率。这使得移动设备上有了 `SMS` 和电子邮件服务。\n\n### 2G 的特性\n- 支持 `SMS` 服务\n\
  - 使漫游成为可能\n- 网络安全性得到增强\n- 有加密的语音传输\n- 支持互联网，尽管数据速率较低\n\n### 2G 的缺点\n- 数据速率非常低\n\
  - 移动性受到限制\n- 特性较少\n- 用户数量仍有限制\n\n## 2.5G 和 2.75G 系统\n\n简而言之，为了支持数据速率，出现了`通用分组数据无线业务`（`GPRS`）。它的数据速率可达约\
  \ `171kbps`。随后开发了 `EDGE`。这是“增强型数据 GSM 演进”，能够提高 `GSM` 网络的数据速率。它的最大速度为 `473.6kbps`。在\
  \ `EDGE` 之后，还有 `CDMA200`，它在 `CDMA` 网络上支持更高的速率。通过这项技术，数据速率攀升至 `384 kbps`。\n\n## 3G\
  \ – 第三代\n\n这一代网络始于 `UMTS`（“通用移动地面/电信系统”）的引入。这一代能够支持视频通话，因为它以 `384kbps` 的速率运行。是在\
  \ `3G` 发布后，智能手机才在全球范围内变得流行。智能手机的设计用于处理多媒体信息、电子邮件、视频通话、游戏、社交媒体和其他高级功能任务。\n\n### 3G\
  \ 的特性\n- 数据速率增加\n- 支持视频通话\n- 安全性增强\n-能够支持移动应用\n- 同时也支持多媒体信息\n- 支持位置跟踪和地图\n- 提供了更好的网页浏览\n\
  - 电视流媒体\n- 支持高质量 3D 游戏\n\n## 3.5G 到 3.75 系统\n\n`3G` 网络随后又有了两次发展。这算是一种演进，因为 `3.5G`\
  \ 网络能够支持高达 `2mbps` 的数据速率。`3.75` 系统也提供了更快的速度。`3.9G` 系统的最终发展，也被称为 `LTE`（“长期演进”）。\n\
  \n### 3G 的缺点\n- 频谱许可证非常昂贵\n- 基础设施成本极高\n- 需要更高的带宽来提供良好的数据支持\n- 支持它的移动设备非常昂贵\n\n##\
  \ 4G – 第四代\n\n`4G` 的出现标志着更高速互联网时代的到来。它被称为“全网 IP 化”。`LTE` 技术很快成为移动网络的主流。它能够提供极高的数据速率，这使得高清视频流媒体和在线游戏在移动设备上成为可能。`4G`\
  \ 还引入了多输入多输出（MIMO）技术，极大地提升了用户的网络体验。\n\n### 4G 的特性\n- 数据速率极快\n- 支持高清视频通话\n- 安全性增强\n\
  - 能够支持复杂的移动应用\n- 支持多媒体信息\n- 支持实时定位和地图\n- 更好的网页浏览体验\n- 4K 视频直播\n- 支持在线游戏\n\n### 4G\
  \ 的缺点\n- 基础设施建设成本高昂\n- 设备价格较高\n- 室内信号可能较弱\n\n## 5G – 第五代\n\n`5G` 的到来标志着万物互联时代的开启。我们正处于一个由超高速\
  \ `5G` 连接的世界。`5G` 具有极低的延迟和极高的连接密度。`5G` 能够支持数百万设备同时连接，这改变了工业、医疗和自动驾驶领域。\n\n### 5G\
  \ 的特性\n- 极高的数据速率\n- 极低的延迟\n- 海量设备连接\n- 支持增强现实（AR）和虚拟现实（VR）\n- 工业物联网（IoT）支持\n\n###\
  \ 5G 的缺点\n- 覆盖范围有限（需要更多基站）\n- 设备成本昂贵\n\n\n\n\n\n## 电子邮件的优势\n\n*   它非常快速：邮件的发送速度很快，且交付没有时间延迟。这是它变得非常受欢迎的原因之一，尤其是对于企业而言。你可以与同一大楼内的任何人进行通信，也可以跨越全球与人交流。\n\
  *   它非常方便：事实上，在许多本可以打电话的情况下，你只需简单发送一封邮件即可。如果你对某事有快速查询，并且想省去在电话中熟悉细节的时间，那么解释清楚你的需求，一封简要的邮件就能很快让你得到答案。\n\
  *   你可以发送附件：通过电子邮件，你可以发送附件文档。你可以附带视频、图片、pdf、Word 文档等文件。\n*   它易于访问：在你的电子邮件账户中，可以存储文件和消息，你可以轻松地筛选并在任何你需要的时候访问它们。只需在\
  \ Google 的 `Gmail` 中输入，即可带你找到正在寻找的特定消息。使用起来如此简单。\n*   它可以作为记录：对于那些最好留有记录的对话，使用电子邮件比电话通话更好。你可以随时随地查看之前的对话。\n\
  *   写作空间没有限制：使用短信（SMS）时，写作空间是有限的。然而，使用电子邮件，你可以随心所写。你可以倾诉所有的心声，可以尽情地推销自己，也可以提交任何长度的投诉。你可以用电子邮件编写任何长度的文本。\n\
  *   它是安全的：有一些特殊的电子邮件设计得尽可能安全。部署了特殊的隐私和安全协议，以确保机密和敏感信息保持安全。\n\n## 电子邮件的缺点\n\n嗯，电子邮件有一个困扰许多用户的重大问题，那就是垃圾邮件（Spam）。会有几封垃圾邮件进入你的信箱，并且在此过程中，非常重要的信息可能会丢失。然而，这个问题正在被解决，但尚未完全完美。电子邮件服务提供商现在利用过滤器来筛选进入的各种邮件，从一堆无关信息中挑选出相关的邮件。正如所说，它还不完美，因为一些垃圾邮件仍然会进入你的信箱。\n\
  \n## 语音处理\n\n语音处理有两个主要概念。它涉及对语音信号的研究，也涉及处理信号的方法。这些信号是以数字方式处理的，因此你可以将该过程视为数字信号处理的一种形式。语音处理涉及多个方面，包括：语音信号的采集、处理、存储、传输和输出。输入声音的过程被称为语音识别，而输出被称为语音合成。\n\
  \n### 语音处理技术\n\n语音处理中使用了三种主要技术，如下：\n\n### 动态时间规整\n这缩短为 `DTW`，是一种用于测量两个普通序列之间存在相似性的算法，这些相似性随速度的变化而异。通常，你可以将\
  \ `DTW` 视为一个计算两个序列匹配优化程度的过程。这种测量是在某些限制和规则内执行的。以低成本满足规则和限制的匹配被称为最优匹配。\n\n### 隐马尔可夫模型\n\
  这是动态贝叶斯网络中最基础的形式。该算法的首要目标是估计分配给观测列表的隐藏变量。\n\n### 人工神经网络\n人工神经网络基于节点和单元连接的系统，这些单元被称为人工神经元。人工神经元在某种程度上是人脑中神经元的复制。`ANN`\
  \ 中的每个连接都可以将信号从一个神经元传输到另一个。语音处理作为一项技术突破，自出现已应用于各种领域。它从根本上用于交互式语音系统、虚拟助手、语音识别、情感识别、呼叫中心自动化和机器人。这些案例中许多尚未完全开发到能够提供实时处理，但已经接近了。在虚拟助手方面，像\
  \ `Google assistant` 这样的助手经过了优化以提供实时处理。\n\n## 数据通信的基础知识\n\n通信是生活的基本需求。生命科学家将我们称为社会动物（尽管我更倾向于自称为社会性），这意味着我们需要彼此联系。多年来，通信技术帮助我们最大限程度地实现了这一点。它增强了我们联系彼此的方式、速度和质量。数据通信遵循四个基本原则。\n\
  \n*   **交付 (Delivery)**：这一概念规定每个数据通信系统都能在时刻将数据交付到正确的目的地。发送的数据必须始终被预期的接收者接收。\n* \
  \  **准确性 (Accuracy)**：发送的数据中不能有组件丢失。它必须准确地交付。这是因为数据在传输过程中如果没有更正而被更改，将无法使用。\n*  \
  \ **及时性 (Timeliness)**：实时是标准。发送的数据应该尽可能及时地交付。当数据交付延迟时，它就变得毫无用处。对于视频和音频，及时性意味着在数据产生后立即交付。数据应该在产生后立即按照其产生的顺序且无延迟地交付。这就是我们所指的实时数据传输。\n\
  *   **抖动 (Jitter)**：jitter 一词用于指数据包到达时间的变化。这在交付视频时感受最为明显。在这种情况下，数据的音频包与视频包在交付上存在差异。抖动也发生在特定的格式中。例如，在视频传输中，视频某些部分可能在\
  \ `3D-ms` 到达，而其他部分则延迟并在 `4D-ms` 到达。这会导致视频质量的中断。\n\n## 公用交换网络 (PSTN)\n\n`PSTN` 是一个互连线路网络，由政府和私人所有者共同拥有。该网络系统从\
  \ 1900 年代起一直在使用，它利用地下铜线。在过去的十年中，随着无线通信接管世界，这些网络的使用正在下降。\n\n\n\n\n\n# 第 10 章：无线网络技术及其用途\n\
  \n无线网络技术具有许多辅助实施的原理，这是计算机网络概念中一个相当广泛的领域。正是无线网络技术，使得无线网络能够应用于各种设备，并满足不同的用途。这些技术已被应用于家庭以及不同的业务网络中。就像世界上其他任何技术一样，无线网络也有其优点和缺点。在本书中，我们试图建立这样一个事实：无论无线网络面临哪些局限性，它确实让世界比以前变得更好。我们需要无线网络，尽管多种技术实现了无线网络的可能，而这些正是我们在本章将探讨的内容。\n\
  \n## 什么是思科系统？\n\n你可能在计算机网络世界中听过 `CISCO`（如果你不是新手——即不仅仅是消费者的话）。思科系统公司是世界上领先的网络设备公司之一。该公司由\
  \ Sandy Lerner 和 Len Bosack 夫妇于 1984 年创立，最因作为各种网络设备的领先制造商和销售商而闻名于世。然而，该公司的产品不仅限于硬件，他们还制造相关的软件产品及相关设备。在多年的运营中，该公司一直专注于提供基于\
  \ IP 协议（`IP`）的软件和其他服务。他们还专注于路由和交换产品。他们还关注广泛用于家庭网络、`IP`电话、光网络、安全、存储区域网络和无线技术的其他技术。\n\
  \n这对在斯坦福大学相遇的夫妇已经离婚，但他们公司开发的首款产品是由于 Bosack 和 Kirk Lougheed 开发的 AGSS 路由器。思科开发的各种应用程序和产品都适用于平板电脑、手机、桌面虚拟化等许多领域。公司整体提供安全服务和产品。这些功能以能够为内容提供网络、身份识别和安全保障而众所周知。这些工具在帮助客户减少数据被盗方面一直非常有效。通过各种工具，客户还能够在协作和云支持的环境中工作。\n\
  \n思科的市场面临着 HP、Avaya、Juniper 等公司的激烈竞争。但该公司一直能够确保其主导地位。在计算机网络领域，思科开发出了一种名为 `Catalyst\
  \ 6500` 的交换机。它已被应用于潜艇和山顶。他们还制造了 `CR-3` 路由系统，该系统被认为非常强大，可以在四分钟内流传输所有捕捉的电影。该系统也非常快，可以在大约\
  \ 1 秒内完成美国国会图书馆的所有印刷收藏品的处理。\n\n让我们来看看思科的各种产品\n\n### 思科家用路由器\n在 2003 年到 2013 年的 10\
  \ 年时间里，思科是 `Linksys`（包括业务名称和品牌名称）的母公司。Linksys 公司参与了有线和无线路由器的制造，这些型号在家庭网络中突然变得流行。然而，Linksys\
  \ 被卖给了 Belkin。\n\n### 思科路由器与互联网\n在互联网早期，思科路由器被用于建立长距离连接。这发生在 20 世纪 80 年代和 90 年代之间。那时的技术不仅用于长距离连接，还被企业用于创建内网网络。\n\
  \n### 思科 CSR – 运营商路由系统\n这些被创建用于作为路由器功能，并作为大型企业网络的核心。在网络的这一组件上，你可以连接路由器和交换机。它首次于\
  \ 2004 年引入，提供了 `40 Gbps` 连接。它还具有可以扩展到每秒约 92 太比特的网络带宽。\n\n### 思科 ASR – 聚合服务路由器\n\
  这些是 `EDGE`（边缘）路由器，被设计为企业网络与互联网之间的接口。它还可以作为企业网络与另一个广域网之间的接口。\n\n### 思科 ISR – 集成服务路由器\n\
  该系列有三个型号，包括思科的 `1900`、`2900` 和 `3900` 系列。\n\n### 思科 IOS – 体系操作系统\n这是一种设计运行在思科路由器上的低级网络软件。它也可以运行在其他思科设备上。它基本上支持命令行用户界面外壳。`IOS`\
  \ 有两种变体，即 `IOS XE` 和 `IOS XR`。它们与旗舰版思科 IOS 没有区别，只是增加了思科 IOS 中没有的额外功能。\n\n## 思科网络认证\n\
  \n思科的网络认证计划在全球范围内获得认可，这些认证分为不同的级别。\n\n### 入门级 (CCENT & CCT)\n在入门级类别中有两种主要的认证。这些是\
  \ `CCENT` 和 `CCT`。它们是为初次接触该行业、刚开始从事计算机网络职业的爱好者而设计的。这些认证没有先决条件。入门级认证的学习材料可以在网上获得，只有在注册个人通过考试后才能获得认证。通过该认证，个人将成为一名可以安装、维护和排除小型网络故障的专业人士。他们还能够在企业网络的分支执行所有这些功能。入门级也是某些助理级\
  \ `CCNA` 解决方案路径凭的先决条件。\n\n对于 `CCT` 专业人士，其主要功能是在客户现场工作。他们承担着诊断问题并随后执行修复功能的主要责任。当一个人获得\
  \ `CCT` 认证后，就可以取得进展。\n\n### 助理级 (CCNA & CCDA)\n（注：此处原文未提供助理级详细描述，根据前文逻辑，翻译应保持结构。由于原文中此处仅有标题，故仅翻译标题。）\n\
  \n（注：由于提供的文本在此处中断，以下为翻译已显示的内容）\n\n\n\n\n\n-   **CCENT**: 他们可以轻松地在帮助台或其他技术岗位上工作。\n\
  -   **CCT**: 可以担任工程师或系统管理员。\n-   **CCNA**: 个人可以担任工程师、技术人员或分析师。\n-   **CCDA**: 这一认证级别的专业人士担任工程师、接口开发人员或技术专家。\n\
  -   **CCNP**: 可以担任网络管理员、工程师或高级技术人员。他们还可以承担一些高级职位。\n-   **CCDP**: 他们担任高级职位，例如高级网络设计工程师、高级分析师、网络安全防护分析师或网络设计师。\n\
  -   **CCIE**: 他们可以担任专家级职位，包括：网络架构师、工程师或高级网络管理员。\n-   **CCAr**: 架构师。\n\n## Cisco\
  \ Packet Tracer\n\nCisco Packet Tracer 是由思科设计并实现的一种跨平台可视化仿真工具。该工具允许用户为了创建新的计算机网络而构建拓扑结构。通过该软件，用户可以使用模拟命令行界面来模拟思科制造的路由器以及交换机的配置。Cisco\
  \ Packet Tracer 的用户界面是一种拖放模型。通过这种方式，用户可以根据需要从网络中添加或删除设备。\n\n该软件主要供思科助理级认证的学生使用。它帮助他们学习\
  \ `CCNA` 概念的基础知识。该软件可以在 `Linux`、`Windows` 和 `macOS` 上运行。该应用也适用于 `iOS` 和 `Android`\
  \ 设备。思科的系统和工具在重新定义计算机网络并使其变成今天这样起了至关重要的作用。这确立了该公司在该领域的权威地位，使其认证无论出现在什么地方都广受认可。\n\
  \n# 第 11 章：有线网络与无线网络的区别\n\n在本书中，我们广泛探讨了有线网络和无线网络的各个方面。我们已经了所有的组件、用途、应用等。所有这些都已让你了解了这两种计算机网络的所有特征。本节仅仅是为了让你意识到这两个系统分别代表了什么。\n\
  \n### 有线网络\n如前所述，只有当网络不存在无线连接的可能性时，才能被称为有线网络。有线网络用于描述涉及使用物理电缆在跨端连接的设备之间传输数据的网络设置。情况下使用的电缆大多由铜制成，可以是双绞线或光纤。有线网络将电信号从一端传输到另一端。在大多数有线网络中，`Ethernet`\
  \ 电缆用于在连接的计算机之间传输数据。然而，对于 `Ethernet`，其可达范围非常有限，而且配置也没有像无线网络那样简单。\n\n### 无线网络\n对于无线网络，它利用红外和射频来共享信息和资源。这种设计是为了减少确保设备连接所需的资源。它消除了距离和障碍的问题。在无线网络的情况下，完全消除了电缆的使用。如前所述，它利用无线电波。现有的许多设备都使用这种技术：手机、手持设备、卫星接收器、笔记本电脑、`PDAs`\
  \ 和无线传感器。\n\n### 对比表\n下表列出了计算机网络中涉及的各种参数。\n\n| 序号 | 参数 | 有线网络 | 无线网络 |\n| :--- |\
  \ :--- | :--- | :--- |\n| 1 | 安装 | 由于需要的组件较多，安装有线网络比无线网络更困难 | 无线网络的安装较容易 |\n| 2\
  \ | 速度和带宽 | 速度非常快 | 速度较低 |\n| 3 | 可靠性 | 由于性能原因，它更可靠 | 可靠性相当高 |\n| 4 | 电缆 | 以太网、铜和光纤\
  \ | 使用无线电波和微波工作 |\n| 5 | 移动性 | 连接到有线网络的设备不能轻易移动 | 移动性没有限制 |\n| 6 | 安全性 | 它的安全性非常好\
  \ | 安全性弱，网络可能被黑客攻击 |\n| 7 | 干扰 | 有线网络几乎没有经历干扰 | 容易受到高干扰 |\n| 8 | 服务质量 | 与无线网络相比，服务质量更好\
  \ | 服务质量较低 |\n| 9 | 设置时间 | 设置花费的时间较短 | 设置和连接组件需要时间 |\n| 10 | 使用设备 | 使用集线器和交换机 |\
  \ 情况下使用路由器 |\n| 11 | 成本 | 由于电缆更便宜，现在的总安装成本较低 | 随着需求增加，组件价格非常高 |\n| 12 | 应用 | LAN,\
  \ MAN | WLAN, WPAN (Zigbee, 蓝牙), 红外, 蜂 (GSM, CDMA) |\n| 13 | 标准 | `IEEE802.3` |\
  \ `IEEE802.11a`, `IEEE802.11b`, `IEEE802.11g` |\n\n有线网络和无线网络将一直存在，各自适应它们的优势。当然，在无线网络能够在其优势领域有效超越有线网络之前，有线网络将一直存在。\n\
  \n\n\n\n# 第 12 章：计算机网络安全\n\n无线网络与一件事几乎成了代名词——黑客攻击！随处可见，你都能听到数据泄露以及未经授权的人员进入计算机网络的案例。这在网络空间中已不是什么新鲜事。事实上，根据官方年度网络犯罪报告估计，到\
  \ 2021 年，网络犯罪将给我们带来约 6 万亿美元的损失。截至 2015 年，我们遭受了 3 万亿美元的网络犯罪损失。这是为了告诉你，你所工程的计算机网络需要多大的安全性。如果一个系统很容易被破解，那么构建它就毫无意义。涉及到网络犯罪，涉及的不仅仅是钱。还有数据、信息、访问权限以及许多其他未经授权者渴望在你的系统中进行的操作。在本书前面，我们讨论了我们拥有的各种安全协议以及如何更好地使用它们。在本章中，我们将进一步探讨你的计算机网络必将面临的安全问题，以及你如何才能最好解决。黑客时刻监视，只要管理层稍疏懈，他们就准备好破坏系统。关于你的计算机网络安全有很多需要了解的内容，在我们学习你所需的所有知识时，密切关注是正确的。\n\
  \n## 常见安全威胁\n\n计算机网络面临的安全问题是巨大的。计算机网络极易面临几种可能导致关机的高级问题，然而，让我们看看计算机网络面临的基础安全威胁。\n\
  \n### 计算机病毒\n可以说，世界上没有人可以声称不知道什么是病毒。它是一种影响了许多个人计算机以及计算机网络的瘟疫。特别是如果你使用互联网，病毒是你的计算机受损最简单的方式。根据报告，约\
  \ 33%的家庭计算机受到某种类型恶意软件的影响。病毒仅仅是跨越计算机网络传播的软件，它们会腐损坏并破坏存储在系统中的数据。众所周知，病毒会通过邮件附件，或者通过被错误下载的方式进入计算机系统。它们还可以通过\
  \ USB 或其他连接到另一台设备的电缆进入系统。\n\n### 流氓安全软件\n这是骗子和数字黑客进入计算机系统的新技术。这种黑客手段利用了人们对病毒的恐惧。他们提供病毒解决方案，一旦你接受了报价，会导致你的系统被破解。他们要么告诉你你的系统感染了病毒，要么你应该付钱购买工具来保护你的系统。无论哪种方式，这都只是干扰你系统运行的骗局。\n\
  \n使用 木马\n记得特洛伊木马的案例吗？这就是这里所代表的概念。它简单是指恶意软件隐藏在合法软件之后，找到进入系统的方法。事实上，这可能是来自你认识的人的邮件。一旦你点击了附件，恶意软件就会进入你的计算机。一旦这种病毒进入你的计算机，它就可以通过记录各种击键来保存你的密码。它还可以入侵你的摄像头，或者偷走存储在系统中的敏感数据副本。\n\
  \n### 钓鱼\n这个过程与木马攻击类似。这是一种社会工程方法，其最终目标是收集密码、用户名和信用卡号。这些软件以合法邮件的形式出现，但当下载到计算机时，它们会自动安装。\n\
  \n### DOS 攻击和 DDOS 攻击\nDOS 意味着拒绝服务（Denial of Service），而 DDOS 意味着分布式拒绝服务（Distributed\
  \ Denial of Service）。DOS 的情况是，一个特定的服务器网站同时受到来自某台特定计算机流量的攻击。这导致网站的服务器因为过载而经历停机。它的工作原理仅仅是让单台计算机\
  \ IP 向某个特定的 Web 地址加载不同的数据包，而不是单个数据包。这种攻击系统很容易被追踪和拦截，因此有了 DDOS 的演变。在 DDOS 的情况下，不是使用单台计算机，而是利用不同的计算机，数量可能从\
  \ 2 台到数千台不等。这更难停止，也更致命。\n\n### Rootkit（根内核）\n这是软件工具的组合，可以授予用户对特定网络的管理级访问权限。一旦获取了这种权限，位于集合中的恶意软件就会在计算机或网络上执行各种破坏活动。在这个集合中，有键盘记录器、密码窃取器和反病毒软件禁用器。Rootkit\
  \ 的基本运行方式与木马安全威胁一样。它附带一个合法软件，该软件需要对你的操作系统（OS）进行更改。一旦安装完成，rootkit 就会安装自己，并等待黑客的激活。\n\
  \n### SQL 注入攻击\n网站和应用程序的存储服务器主要使用 SQL。为了破解这一系统，出现了 SQL 注入攻击的演变。这些攻击旨在目标那些使用数据的应用程序。在托管此类应用程序的系统中发现的任何漏洞都会被利用（此处原文逻辑漏洞应为“被利用”）。这是近期对计算机系统最令人畏惧的威胁之一。\n\
  \n### 中间人攻击\n这是一种网络破解，黑客借此监听用户的行为。如果有两个目标，黑客能够窃听双方之间的通信线路。这些对话通常应该是私密的和/或加密的，然而这种攻击破坏了这一点。\n\
  \n## 网络病毒是如何传播的？\n\n病毒在计算机上的传播可能是如此自发，因为可以通过邮件附件、启动感染和程序感染器发生。这些仅仅是病毒在计算机上传播的基本方式。还有其他病毒传播的致命过程：\n\
  \n- 来自网络的感染\n有不同类型的计算机网络，病毒在不同类型网络上的传播方式是类似的。各种网络的基本目的是在两台或更多计算机之间共享软件和其他信息。在网络上，存在文件共享，在这个过程中，存在病毒随文件共享的可能性。近期，常见的网络攻击针对大型科技公司。这是为了扰乱它们的服务。在大多数案例中，都采用了\
  \ DOS。这种工作方式是，黑客已经在各种用户的计算机中感染了病毒。然后在特定时间，向目标发起联合攻击。在这些黑客期间，用户会发现他们的计算机在不知情的情况下执行某些活动。为了防御这些攻击，应该使用防火墙。有了先进且最新的防火墙，发动这些攻击将变得更加困难。\n\
  \n- 其他感染过程\n\n\n\n\n病毒传播的一种主要方式是通过从软件补丁、驱动程序和演示软件下载软件。互联网上充斥着各种软件，其中大多数被设计成用于执行这些恶意过程。除了软件之外，电子邮件是黑客入侵系统的另一种简单方式。电子邮件和其他消息平台在共享信息和资源方面非常有效。然而，它们的使用已被破坏，被用以辅助感染的传播和再次传播。安装了\
  \ `Internet explorer` 或 `outlook express` 的电脑受影响最大。这是因为它们在全球范围内使用最广泛，并且计算机中开启了几个默认权限。这为病毒创造了通畅的路径，并在计算机周围形成了一个模板。\n\
  \n## 计算机遭受病毒攻击的迹象\n\n保护计算机免受病毒攻击的第一步是了解它何时正遭受病毒攻击。你无法对你不了解的事进行战斗。当病毒攻击的影响处于高级阶段时，病毒攻击可能很难检测，那时，可能很难保护计算机完好无损。有一些需要注意的迹象，这些迹象会告诉你的计算机是否被入侵。\n\
  \n*   **弹窗**：当你发现电脑上出现了不该有的弹窗时，这属于两种情况之一——或者两者兼有。在这种情况下，最好的办法是确保你不要点击弹窗广告。广告后面可能潜伏着恶意软件。\n\
  *   **性能下降**：当系统被病毒感染时，其上的进程会变慢，特别是启动过程。尽管当你发现电脑变慢时，你需要确认问题是出在 `RAM` 还是内存上。如果不是，那么它最可能是病毒的影响。\n\
  *   **存储空间突然耗尽**：当你突然发现计算机的存储空间耗尽，且你无法无法追踪到任何占用空间的文档或文件时，这很可能是病毒。\n*   **文件丢失**：众所周知恶意软件会导致问题，特别是当计算机上的文件丢失时。在某些情况下，文件还在，但它们被加密了。这种情况下这也是病毒在作祟。\n\
  *   **错误信息**：每当你注意到程序在无差别地打开和关闭时，系统就感染了病毒。\n*   **邮件被劫持**：病毒是劫持电子邮件的简单方式，当你发现这一点时，向服务提供商报告是最好的。\n\
  *   **高网络活动**：在某些情况下，即使浏览器标签页或应用程序没有打开，互联网活动仍然很高。在这种情况下，很可能是病毒正在向黑客所在地发送信息和数据。\n\
  \n## 如何防止计算机感染病毒\n\n病毒是真实的，如果你不积极处理它们，可能会让你付出更大的代价。处理病毒最好的方法之一是主动保护你的计算机。借助病毒的网络犯罪正变得猖獗。它们像野火一样，许多黑客正在利用病毒的破坏力寻找进入任何系统的方法。你需要警惕，并保护好你的数据、信息和金。以下是一些你可以采取的预防措施，使你的计算机免受病毒侵害。\n\
  \n*   **安装高质量的防病毒软件**：免费的防病毒软件永远是不够的。关于病毒你需要了解的一点是它们在不断进化。新的病毒版本不断被创建，以击败针对旧病毒的安全防护。要获得高级防病毒保护，你需要付费。获取高质量的防病毒保护非常重要。特别是如果你是一个一直在线或经常连接不同设备的人。\n\
  *   **每天扫描计算机**：我不认为你应该让你的防病毒软件在计算机上闲置。既然付了钱，你就需要使其价值化。每天扫描你的计算机。病毒可能随时进入计算机，导致广泛的影响，所需时间不一。为了保持安全，请每天对计算机进行彻底扫描。\n\
  *   **禁用自动运行**：如前所述，病毒进入计算机的方式之一是伪装成程序安装。为了应对这一点，你需要禁用自动运行功能。\n*   **对于邮件，禁用预览**：正如我们在本章中解释的，请确保你禁用了预览。通过预览图片，恶意软件会进入你的计算机。\n\
  *   **警惕网站**：某些网站充斥着恶意软件。你对访问的网站需要小心。\n*   **使用硬件防火墙**：某些病毒能够禁用软件防火墙。这发生在设备共享时。在这种情况下，Windows\
  \ 安装的防火墙是不够的。\n*   **使用 DNS **：连接互联网带来了许多风险。存在一些 DNS 攻击或服务器入侵的情况。\n\n## 恶意软件\n\n\
  恶意软件与病毒有些不同，但它们的目标都是入侵你的计算机。然而，恶意软件是一种未经你许可即可访问计算机的软件。大多数恶意软件都旨在获取计算机的信息和数据。恶意软件有多种类型，每种都有不同的目标。\n\
  \n### 恶意软件类型\n\n*   **广告软件**：这种形式的恶意软件主要由广告商使用。当你访问网站时，这种软件会记录你的行为，并利用这些信息了解你对什么感兴趣或不感兴趣。通过这种方式，广告更具针对性。\n\
  *   **键盘记录器**：这种软件主要由黑客使用。当他们需要获取你输入不同个人账户的信息时，他们使用键盘记录器。每当你输入敏感信息时，可能在你尝试访问在线账户时，恶意软件会记录你在键盘上输入的任何内容。这些内容会被传输给黑客，他们获得对你账户的未经授权的访问。\n\
  *   **调制解调器劫持器**：这些人进入你的电话线，拨打电话并尽可能获取信息。在产生费用之前，你不知道这些活动。\n*   **浏览器劫持器**：这些恶意软件被设计用于重构你的首页和书签，导致你被恶意引导到一个本不会访问的网站，并违背意愿遭受广告轰。\n\
  *   **商业恶意软件**：这是授权恶意软件的一种。因为你实际上同意允许恶意软件监控你，以便你访问他们的服务。然而，给予服务的权限被滥用，广告也针对了你。\n\
  \n恶意软件是如何进入你的计算机的？你是否想过恶意软件是如何进入我们的计算机的？你是否想过自己是否漏掉了什么？恶意软件进入你计算机的方式有几种。\n\n\n\n\
  \n\n## 间谍软件方法\n\n*   **路过下载 (Drive-by download)**：这是你访问的网站或弹出窗口突然想要在你的计算机上下载并安装间谍软件的过程。某些情况下，你会收到针对此类操作的警告，这说明你的安全系统比较先进；如果你没有强大的安全系统，你甚至不会收到任何警告。\n\
  *   **搭带软件安装 (Piggybacked software installation)**：这是某些应用程序在安装过程中，会将间谍软件作为标准程序的一部分进行安装。如果你不留神，最终将安装其他你预料之外的软件。\n\
  *   **浏览器插件 (Browser add-on)**：这些软件以为你的网络浏览器添加插件而闻名。除了承诺的功能外，它们还会执行其他操作。在某些情况下，它们仅仅是执行了进入系统的木马程序。\n\
  *   **伪装 (Masquerades)**：在所有的间谍软件渗透程序中，这种是最致命的。它们向你证明它是设计用来帮助你移除间谍软件的。当你安装它来执行它声称的功能时，它会添加其他损坏计算机的间谍软件。\n\
  \n## 零小时与零日攻击\n\n除了病毒和间谍软件之外，还有其他安全问题。其中之一就是零日漏洞（或零小时攻击）。这是软件安全中的一个缺陷，开发者已经意识到该问题，但还没有相应的补丁或软件来修复该漏洞。在这种情况下，间隙可以被黑客利用。这被称为软件漏洞，它们是出现在软件程序或计算机操作系统中的缺陷。这些漏洞可能是由于计算机系统的配置不当导致的。如果不能轻易纠正，就会给黑客留出操作和破坏系统的时间范围。在零日攻击的情况下，漏洞刚刚被发现。在这种情况下，没有补丁可以解决问题。他们将这种情况称为“零日”，因为开发者没有时间准备应对攻击，即“零天”。当这一问题进入主流视野时，服务提供商需要找到立即解决方案，以平息用户的恐慌并保持系统免受黑客的侵害。\n\
  \n### 如何保护你的系统免受零日攻击\n\n你不希望你的系统被零日攻击攻破。这会对你的数据和计算机造成巨大的损害。在保护计算机安全方面，你需要采取主动措施。你需要在你的系统上安装高级的反病毒和反间谍软件。此外，每当你的正版防病毒软件需要更新时，你都需要立即进行更新。这是因为更新将保护你的系统免受新的和当前的威胁，而旧版本可能无法再次保护你。以下是你为了保护自己免受零日攻击应该采取建议：\n\
  \n*   确保你的软件和安全补丁都是最新的。你可以通过下载最新软件来确保这一点。\n*   分析你的在线习惯，确保你是安全的。\n*   确保你的安全设置已配置妥，以优化你的操作系统、浏览器和安全软件。\n\
  *   获取高级安全软件以获得最大的保护。\n\n## 黑客攻击\n\n我确定你对我们所说的网络攻击并不陌生。这可能是每个拿着计算机并用一种或另一种语言编写代码的孩子的幻想。带着传奇的连帽衫，网络攻击被发起以破坏系统。攻击的程度完全取决于僵尸网络的大小。网络越大，攻击对目标的影响就越大。通过使用这种黑客系统，获得的主要是利益，或者只是破坏互联网上的活动。僵尸大师控制着僵尸军队，他们轰炸目标网站，流量导致网站关闭并停止运行。这使得合法用户无法访问网络。这是拒绝服务（DOS）或分布式拒绝服务（DDOS）的一种形式。\n\
  \n### 网络攻击类型\n\n这些方法包括：`malware`（恶意软件）、`phishing`（钓鱼攻击）、`denial of service`（拒绝服务）、`man-in-the-middle`（中间人攻击）、`credential\
  \ reuse`（密码重用）和`cross-scripting`（跨脚本）。\n\n## 密码重用\n\n我们想要访问的网站有很多，但我们使用相同的密码。但这对于难以记住不同密码的人来说非常方便。你不需要担心记住各种密码。你可以利用密码管理器。\n\
  \n## 跨站脚本 (XSS)\n\n这种攻击类似于 SQL 注入攻击。在这种攻击中，犯罪分子获取几种代码并将其注入网站。然而，这些代码并不是针对网站数据库的，它们只是运行在用户的浏览器上。在那个网站上，它们针对的是可以自动运行的脚本，例如评论区域。例如，可以在评论区域中编写一段恶意的\
  \ JavaScript。这使用户的信息面临风险，从而损害了网站的信誉。\n\n## 僵尸网络\n\n在计算机网络世界中，僵尸网络已被证明是巨大的威胁和安全系统的首要问题。一旦设备相互连接，它们被僵尸网络渗透的可能性非常高。\n\
  \n### 它们是如何工作的？\n\n这个名字是由两个词组合而成的，“机器人”（robot）和“网络”（network）。它们简单来说协调在互联网上执行破坏活动的机器人网络。这些使用僵尸网络攻击的管理员被称为僵尸大师（Botmasters）或僵尸牧羊人（bot\
  \ herders）。\n\n### 僵尸感染特征\n\n*   它们不只攻击一台计算机，可以部署感染数百万台计算机。\n*   它们主要通过木马病毒部署。\n\
  *   它们可以轻松访问并修改用户的个人信息。\n*   更复杂的僵尸网络具有自我传播的能力。\n*   它们很难被检测到。\n*   它们花时间稳定地渗透系统，等待僵尸大师发布命令。\n\
  \n\n\n\n\n只要网络以某种方式连接到互联网，几乎任何网络都可能被僵尸网络入侵。事实上，如果你拥有一台智能电视、冰箱或微波炉，它们都可能通过僵尸网络遭到攻击。僵尸网络可以执行基础进程，甚至更多操作。事实上，已经出现了若干起在互联网上出售僵尸网络的案例。如果僵尸主（botmaster）觉得需要处置僵尸网络，或者让其他黑客使其价值最大化，他可以在互联网上将其出售。\n\
  \n## 僵尸网络结构\n僵尸网络有两种构建方式，但每种设计都能让主能够最大化地开展其活动。\n\n*   **客户端-服务器模型**：这种架构通过一个主服务器来控制僵尸。在这种情况下，由僵尸主进行控制，他利用特殊软件来建立和发布命令。这被称为命令与控制（C&C）服务器。\n\
  \    然而，这种结构也存在一些缺点。执法部门很容易确定主的位置。此外，一旦服务器被销毁，僵尸网络就会消亡。\n*   **对等点模型**：这是目前常用的系统。在这种情况下，僵尸网络不使用单一服务器。系统以对等点的结构相互连接。在每个僵尸上都有一个其他僵尸的列表，当需要更新或传输信息时，它们会寻找这些节点。\n\
  \    对于这种结构的僵尸网络，执法部门很难追踪发起者或破坏该系统。这种僵尸系统非常难以破坏。\n\n## 如何防止你的网络遭受僵尸网络攻击\n到目前，你应该意识到这并非微不足道的攻击。它与其他类型的网络攻击大不相同，你需要针对它来优化系统的安全性。以下是一些你可以保护自己免受攻击的方法：\n\
  \n*   保持操作系统更新到最新版本\n*   不要打开来自不可信源的邮件附件\n*   不要从对等点网络或其他共享网站下载文件\n*   保持你的防病毒软件更新到最新版本\n\
  \n特定计算机网络的安全需求如何强调都不为过。随着互联网的兴起以及无线网络促进的互联，系统变得非常容易受到攻击。记录的网络攻击案例不断增加，你需要更加小心。无论是对于你的个人电脑、局域网还是其他类型的网络，都必须确保足够的谨慎和主动性。再小心也不为。祝你安全！\n\
  \n\n\n\n\n# 第 13 章：物联网\n\n即使你并不打算进入计算机网络领域，你极可能也听过物联网。这个术语已经变得如此常见，几乎几乎每个使用互联网的人都听过它。然而，有许多人对这个概念的真实含义仍然一无所知。`IoT`\
  \ 可以影响生活的各个领域，其边界是无止尽的。通过 `IoT` 我们可以实现很多目标，我们在这个简短的章节中讨论其中一些。如果你在书开始时提到的咖啡用完了，你可能应该再去买些。不过，这不会是一篇冗长无味的读物。\n\
  \n## 到底什么是物联网？\n\n物联网有一个简单的定义。它简单来说就是描述了全球数十亿设备接入互联网的状况。这些设备连接到互联网的唯一目的是收集和共享数据。这种轻松地将物理设备连接到互联网的能力，是由廉价的处理器和无线网络支持的。还记得我们在书中提到过的无线网络和\
  \ `IoT` 吗？通常情况下，这些设备会被称为“愚笨”的，但现在，它们是智能的。这就是 `IoT` 改变我们生活的程度。\n\n几乎任何设备都可以连接到互联网。事实上，一个天才少年能够将玩具熊连接到他的电脑，仅仅因为那只熊有一套通过内置扬声器播放的录音系统。通过\
  \ `IoT` 概念，他能够连接到那只熊，通过电脑麦克风录制的任何声音都会在熊身上播放。这个过程绕过了电脑上预设的程序。\n\n另一个例子。如果你只需通过使用安装了\
  \ App 的智能手机就能打开家里的灯泡，那么它就是一个 `IoT` 系统。`IoT` 看起来可能很简单，就像是一些非常基础的东西。但是，如果我们与我们互动的玩具是\
  \ `IoT` 的产物，你也应该知道无人驾驶货车也是基于 `IoT` 运行的。\n\n## 它是如何工作的？\n\n`IoT` 的工作原理很容易理解。它通过设备内置的传感器工作，这些传感器能够连接到互联网，目的是整合来自不同设备的数据，对其进行分析，并将此类信息用于解决局部问题或执行任务。通过\
  \ `IoT` 设备，可以很容易确定哪些是有用的，哪些没用。通过这种方式，可以检测模式、做出建议并解决问题。\n\n让设备连接是提高效率和减少事故的一种极佳方法。想象一下，如果所有汽车在一定范围内都可以相互连接，当你几乎要撞上某辆车时，那辆车可以警告你有一辆车正快速转道过来。这太神奇了。通过从连接的其他设备中获取信息，它们做出智能决策，这是技术的目标之一，不是吗？这项技术比几年前更庞大了。事实上，Gartner\
  \ 在 2017 年报告说，全球使用了约 84 亿台 `IoT` 设备。估计到 2020 年将达到 204 亿。截至 2017 年，`IoT` 的总支出达到 2\
  \ 万亿美元。这是预料中的，因为智能电视和智能音箱是现在家里最主要的设备。\n\n## 应用\n\n人们有几种方法利用 `IoT`。你很有可能已经用过 `IoT`\
  \ 驱动的设备，只是你不知道。让我们来看一些受 `IoT` 影响的用途。注意我说的是“正在受到影响”。这是因为 `IoT` 在目前是真实的，它不是未来的概念。我相信你也知道这一点。\n\
  \n### 物联网与家居\n\n这是一个我非常确定你已经体验过 `IoT` 的领域。如果你有一个 `Alexa` 驱动的家居设备，那么你就处于 `IoT` 框架之中。这是一个非常有前景的领域，以至于亚马逊、Google、Apple\
  \ 和 Facebook 等大型科技公司正在激烈竞争。无论如何，目前亚马逊在智能手机设计方面处于优势地位。这方面有许多产品，如 `Amazon echo`、智能冰箱、灯泡、摄像头、恒温器等。你可以与所有这些设备交互，甚至不需要靠近它们。\n\
  \n### 物联网与智能城市\n\n随着传感器遍布城市的每一个角落，政府有可能实时了解任何地方正在发生的情况。这是 `IoT` 在不久的未来发挥真正巨大优势的关键方式之一。通过部署不同类型的传感器（如摄像头、环境传感器等），监控城市中发生的情况并知道如何实时做出反应变得非常容易。\n\
  \n### 物联网与人工智能\n\n`IoT` 拥有一种单一的力量，那就是数据。该框架可以访问大量数据。当所有数据从不同来源实时收集并经过敏锐的分析时，它们可以被用来做出拯救生命的决策。这就是人工智能发挥作用的地方。`IoT`\
  \ 收集数据、存储数据、分析数据，然后将其喂给 `AI`。当 `AI` 从 `IoT` 接收到这些信息时，它利用它们做出预测。广泛利用该框架的公司示例是 `Google`。噢，我多喜欢那家公司。他们聘佣最优秀的人，我为此爱他们。那么\
  \ `Google` 如何结合使用 `IoT` 和 `AI` 呢？很简单。`AI` 用于管理公司数据中心的冷却系统。在所有的科技公司，都有大型空间通过物理结构存储数据。在这个数据中心，有成千上万个传感器。\n\
  \n## 物联网：安全与隐私\n\n`IoT` 目前最大的问题之一是安全。隐私涉及数据的保护，无论是以视频、音频还是文本的形式存在。\n\n\n\n\n\n#\
  \ 结论\n\n这一切的核心在于网络，核心在于连接。这就像人类的互动一样。我们需要彼此，通过相互交流，利用个人的知识、思想和方法，这正是人类不断变得更好的方式。\n\
  \n为了确保计算机使用的有效性和高效性，它们需要相互连接。这就是计算机网络的全部精髓。它的目的是促进跨距离的数据和信息共享，并辅助个人之间的通信。计算机网络已经存在很久了，从最初的有线系统一直发展到如今的无线系统。\n\
  \n在本书中，我们已经为你涵盖了启动计算机网络知识之旅所需的所有内容。熟悉这些组件并实现你自己的网络，将会变得更加容易。\n\n我真心希望这段穿过计算机网络各个领域的旅程并不枯燥。你现在能在这里读这本书，真是太棒了。这不仅仅是为了阅读和认知，实施并真正开启你的计算机网络职业的责任在于你。技术的发展不是由读者推动的，而是由执行者推动的，而你正是那些执行者。行动吧！\n"
