    # Existing Machine-Learning PLA Schemes


    Previous [7-10] proposed machine-learning PLA schemes that aim at 5G or are used
    in 5G networks. Network machine learning paradigms for PLA are reviewed in [12].


    [7] proposed a scheme using the time-varying frequency offset (CFO) between each
    pair of wireless communications devices as a radiometric characteristic for radiometric
    fading. Generally, a transmitter and a receiver always have developed devices
    besides oscillating frequency. The time-varying CFO characterized by these biases
    also by the Doppler shift induced by mobility. An autoregressive process is based
    on the method of historical CFO values, and Kalman filtering is used to predict
    the current CFO. The current CFO is compared with the predicted CFO and follows
    homogeneous patterns. An adaptive CFO scheme for spoofing detection is determined
    by the Kalman filtering prediction error and noise ratio. The scheme was validated
    by implementing its prototype on software-defined radio (SDR) platform. Its effectiveness
    in multipath fading is confirmed.


    [8] proposed a scheme using the received signal strength (RSS) for spoofing attack
    in wireless networks. The proposed scheme uses a user-static game to model the
    interactions between a legitimate receiver and spoofers. The legitimate receiver
    tries to maximize the probability of spoofing detection by choosing a proper test
    threshold. On the other hand, the spoofers try to minimize the receiver utility
    by properly determining their attacks. The state game Nash


    [9] Bob used pilot signals from Alice to collect the channel state information
    to be used as a training data. When Eve presents to Alice and sends messages to
    Bob, there is no way to know who is Eve and who is Eve. However, Eve''s message
    can be collected and passed as a training data, which may be a too-strong association.
    By the sets of Alice and Eve, Bob trains AdaBoost-based classifier to distinguish
    messages from Alice and Eve. The proposed scheme was implemented based on SDR-based
    USRP platform.


    Fang et al. [10] proposed a PLA scheme designing-dynamically changing channel
    conditions based on frequency and interference states. The scheme relies on a
    kernel method-based physical layer model which utilizes the statistical properties
    of the attributes. It reduces the multi-dimensional physical layer space into
    (e.g., a scale space), in dramatic reduction of authentication complexity. Simulations
    conducted but the prototype of the proposed method was not implemented. Simulation
    results showed that the proposed scheme achieves authentication performance in
    time-varying environments.


    Table 1 shows all of the machine-learning PLA schemes reviewed in [3]. Three of
    the schemes have been implemented on the SDR platform; however, scheme [7] has
    been implemented on PLA physical layer attributes except for scheme-3. Furthermore,
    scheme-3 needs to acquire channel information for the purpose of machine learning
    training [9].


