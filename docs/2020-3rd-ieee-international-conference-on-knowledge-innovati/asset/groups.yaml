    # Remarks and Research Discussion


    This paper surveys state-of-the-art PLA schemes using machine learning technologies
    for the 5G-based IoT. The utilized machine learning techniques are based on autoregressive
    models filtering processing, reinforcement learning (specifically Q-learning and
    Dyna-Q), AdaBoost Classifier, and kernel machine. All schemes rely on multiple
    physical layer characteristics for authentication performance.


    Physical layer authentication (PLA), machine learning techniques may be used for
    other services in the 5G-based IoT, such as intrusion detection, anomaly detection,
    and access control. Furthermore, we plan to consider taking deep learning, a specific
    type of very powerful machine learning techniques using deep networks, to improve
    the security service.


