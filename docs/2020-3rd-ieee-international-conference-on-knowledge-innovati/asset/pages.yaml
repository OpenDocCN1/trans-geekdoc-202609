    # Background


    A. 5G Mobile Communication System

    Key performance indicators (KPIs) for 5G are specified in IM-2020 [3], which is,
    Global 5G specifications. Fig. 2 shows them and comparisons with KPIs of 4G specifications
    (IM-advanced). The first KPIs are,


    +   1. Peak rate (for emBB): It is the maximum data rate, which is 10 Gbit/s under
    ideal conditions, whereas it can reach 20 Gbit/s under certain conditions.

    2. Latency (for URLLC): The delay between the source device and destination receiving
    is less than 1 ms.

    3. Connection density (for mMTC): The overall number of nodes and connected devices
    per unit is 1,000,000 devices/km².

    4. User experienced data rate: The achievable rate by mobile device whose coverage
    is 100 Mbps.

    5. Mobility: The maximum speed at which a QoS and seamless transfer between two
    devices (or nodes) may belong to different layers and/or capacities is 500 km/h.

    6. Area capacity: The total traffic transported per user is


    7. Energy efficiency: The energy efficiency has two aspects. On the one hand,
    it is the number of bits transmitted per unit of energy consumption of the radio
    access network (RAN). On the other hand, it is the number of bits received/from
    RAN per unit of energy consumption of the device communication module. The energy
    efficiency of IM-2020 is expected to be 10 times better than IM-advanced.

    8. Spectrum efficiency: The average data throughput per unit resource and cell
    is in bits/Hz. The spectrum efficiency of IM-2020 is expected to be 30 bits/Hz.


    Multiple access is the core technology of mobile communications as it allows multiple
    mobile users (UEs) to share the allocated spectrum at the same time in effective
    and efficient way. The multiple access are implemented by 1G frequency division
    multiple access, 2G time-division multiple access (TDMA), 3G code-division multiple
    access (CDMA), 4G orthogonal frequency-division multiple access (OFDMA) of 5G
    frequency-division multiple access (OFDMA) and spatial multiple access (SDMA),
    which is, massive-input-multiple-output (MIMO). The concept of multiple access
    is becoming more complex.

    A base station (BS) of a massive MIMO system has many antennas (usually tens or
    thousands of antennas) to receive or transmit signals simultaneously over the
    same radio channel. Based on the state of the received signal (CSI) to the BS,
    the UE de-links channel state information, the uplink and downlink have same channel
    reciprocity in the time-division duplex (TDD) mode,


