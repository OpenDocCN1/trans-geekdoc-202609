  md: '# # Short Survey on Physical Layer Authentication by Machine-Learning

    for 5G-based Internet of Things


    John-Ruy Iang

    Department of Computer Science and Information Engineering

    National Central University

    toyuan City, Taiwan


    *Corresponding Author: jrjiang@csie.ntu.tw


    # Abstract


    5G-based Internet of Things (IoT) comprises numerous devices with 10 Gb/s peak
    data rate and 1 ms latency. It is challenging to secure the 5G-based IoT. Physical
    layer security (PLS) depends on physical layer characteristics, which are unconditional,
    thus suitable for the 5G-based IoT. This paper reviews recent research on using
    machine learning for the 5G-based IoT. The schemes are detailed and their properties
    are compared. Research directions of applying machine learning techniques to secure
    the 5G-based IoT devices are also pointed out in this paper.


    **Keywords:** 5G IoT, Machine learning, physical layer authentication


    # Introduction


    5G mobile communications attract much attention. The 3GPP (3rd Generation Partnership
    Project) organized 5G Release 15 (or 3G Release 15-1]) in March 2019, and Phase
    5 (or 3G Release 16) is currently under the standardization [2]. It focuses on
    six use cases: enhanced broadband (eMBB), ultra-reliable and low latency communication
    (URLLC), massive machine communications (mMTC) [3]. (1) To meet the requirements
    of the 5G, cases utilizes some novel technologies such as multiple-input multiple-output
    (MIMO), millimeter-wave (mmWave), heterogeneous network (HetNet), and small cell
    technologies to achieve performance, by 10 Gb/s peak data rate, 1 ms latency,
    and devices/km² of density.


    The 5G-based Internet of Things (IoT) comprises numerous devices with 10 Gb/s
    peak data rate and 1 ms latency. Traditional cryptography can be used to secure
    the 5G-based IoT. However, as they rely on complexity, they may not satisfy 5G
    performance requirements for 5G resource-constrained users. Physical layer security
    is based on computational infeasibility with the assumption that an adversary
    has limited computational power. Traditional cryptography is not secure in the
    sense that a quantum computer could potentially break it down easily.


    Physical layer security (PLS) is based on physical layer characteristics which
    inherit receive signal strength (RSS) and wireless state information (CSI) to
    provide security services. Unlike traditional cryptography cryptography, PLS relies
    on theoretical proofs of


    perfect. It achieves the unconditional communication security. There are services
    using physical layer security such as availability, data integrity, confidentiality,
    and data authentication. Authentication verifies entities. Data integrity verifies
    that transmitted data are not modified or altered. Data confidentiality guarantees
    unauthorized entities. Data availability prevents adversaries from jamming data.


    This paper focuses on physical layer authentication (PLA) and reviews PLA schemes
    [7-10] using popular and machine learning (ML) techniques for wireless networks
    or the 5G-based IoT. In some of 5G-based applications, a malicious device is connected
    to the network and be authenticated to avoid impersonation and falsification.
    The 5G-based IoT comprising numerous devices is usually resource-constrained.


    A schemes the following: they have low complexity, they do not make any assumption
    on the pre-shared credentials for the authentication, or on communication channel
    features for the authentication. Machine learning is used for the authentication
    of the 5G-based IoT. The details of these schemes are described and their properties
    compared. Recently, research directions of applying machine learning techniques
    to secure the 5G-based IoT are also pointed out in this paper.


