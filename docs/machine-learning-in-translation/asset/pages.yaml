  md: 'related to other signs. As discussed in Chapter 1, in theory, no language system
    is exactly identical to any other, and thus no absolute equivalence can be found
    in interlingual translation. Behind the visible element, the signifier, there
    is an invisible element that represents an interrelated, continuous, hidden state,
    as shown in a neural network. In the deeper layer of understanding, words are
    entangled with each other, fluid and susceptible to context, rather than separate,
    static, and fixed to what the signifier appears to be. Neural language models
    are effective tools to explore the double structure of signs, which is important
    for language comprehension and generation in translation.


    Third, in the past, many linguistic resources for translators were usually based
    on the notion that words are discrete entities. For example, regular bilingual
    dictionaries are in alphabetical order treating each word as a separate entry.
    Some resources with semantic classification such as thesauri also consider words
    as separate symbols, even if they classify them further into categories based
    on similarity of meaning. To some degree, these resources can be misleading in
    helping translators practice and learn. For example, _faux amis_ (false friends)
    are words that are similar in form and etymology in two languages but which, because
    of their separate development in two distinct cultures, have taken on different
    meanings (Vinay & Darbelnet, 1995, p. 68). Neural LMs, such as word2vec, provide
    a tool to further explore meaning. Even though the dimensions cannot be interpreted
    directly, they capture syntactic and semantic regularities that are useful. By
    using neural LMs, one can better explore the logical relationship between words,
    as shown in the example presented in Table 3.3. Furthermore, the vectorization
    of words allows us to apply mathematical operations to these feature vectors to
    explore their semantic relationships. For example, the cosine similarity score,
    applied to each word paired with other words, indicates mathematically how they
    are related. This is a type of machine learning largely independent of human intuitive
    reflection about language.<sup>4</sup> In this sense, neural LMs provide complementary
    insight into the meaning of words.


    Computers are more efficient than humans for processing repetitive language pattern
    tasks involving immense volumes of language use, due to the repetitive computation
    involved. In semantics, component analysis done by humans involves only a few
    features, but when mathematically driven, it involves millions of repetitions.
    Humans can only focus on the process that makes sense to them, which is the intuitive
    process of reflection. Humans should focus on the results, rather than the process,
    given the limitations of human memory and attention mechanisms. Given this dynamic,
    the division of labor between machines and humans should be reconsidered, which
    we will address in Chapter 8.


