    collective nature of language data, which varies in degree, and the model trained
    on it. ML provides a collective approach, facilitating solutions for the translator
    in rudimentary form, so the translator can focus on other data features that cannot
    be captured easily.


    # 8.3.2 From generic models to customized and personalized ML technologies


    Some technologies are designed to capture collective human behaviors from the
    start. They aim to address common needs shared by a group of people. When managing
    human and linguistic resources, a localization project manager focuses on the
    collective results rather than individual ones. Individual characteristics of
    the data created in a technological platform, such as a CAT tool, which systematically
    involves more than one translator, usually decrease as the linguistic assets grow,
    even though some individual elements can be maintained through data annotation.


    In the language industry, technologies are used to improve the productivity and
    efficiency of the work of either an individual or a group of individuals. For
    example, a translator uses a translation memory tool to translate as well as manage
    TM and terminology independently in the translation process, whereas a translation
    management system is used to manage the whole group’s linguistic assets. Distinguishing
    between individual and group use is important in the context of language data
    ownership, data security, and data use permissions, as these two approaches may
    be in conflict in some areas.


    Given these considerations, distinguishing between generic, customized, and personalized
    ML technologies is useful. As discussed in Section 8.2.1, there are three basic
    components of an ML model: a generator, a supervisor, and a learning machine.
    These models are generic in nature, with different ML pipelines that consist of
    multiple steps and techniques to train the model. Considering the purposes of
    training, there are two basic categories: to meet shared purposes of a group of
    users, or to meet specific purposes of an individual user. Currently, most language
    technology suppliers aim to target a certain group of users and serve their needs.
