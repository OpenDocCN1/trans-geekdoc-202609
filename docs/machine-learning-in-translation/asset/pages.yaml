    the evaluation is automated, it still has human characteristics as the reference
    translation is impacted by humans.


    As discussed previously, human metrics such as MQM and the stabilized version
    of SAE J2450 provide useful error typology for error categorization. The application
    of these metrics relies on specific use cases, including the translation purpose,
    audience, human resources, and linguistic assets, which are covered in relevant
    studies and reference documents (Vehicle E System Diagnostic Standards Committee,
    2016; Mariana et al., 2015; Lommel et al., 2013). The MT development community
    tends to use the term ‘adequacy’ to describe the accuracy of the translation and
    the term ‘fluency’ to describe whether the target text is natural and idiomatic
    in the target language. In quality estimation (QE), ‘adequacy’ and ‘fluency’ metrics
    are incorporated in the algorithms of some applications.


    # 5.4 Automated metrics: using machines to assess machines


    # 5.4.1 An overview of automated metrics


    Comparisons conducted by machines are different from those by humans, yet they
    are a fast and cost-effective way to demonstrate some features of translation
    quality. In practice, when computer applications are capable of generating a large
    volume, it is not feasible to rely on human effort to track the quality of the
    MT output. Under these circumstances, automatic evaluation can be used as a surrogate
    for human evaluation, evaluating the MT raw results and tracking system development
    as the machine trains itself.


    When developing MT systems, an automated measure of accuracy is preferable for
    rapid feedback and reliability on the quality of the system at different stages
    of training. Systems can also be compared with one another; for example, the MT
    evaluation metric in Microsoft Translator Hub includes scores for the engine after
    training on a dataset and scores comparing it against a generic purpose engine.
    This provides indicators of the quality of the MT engine being built, how the
    engine is improving, and what future direction is needed. Evaluation using automated
    metrics is more an evaluation of a software application than of translation, although
    it is also useful for comparing different translation results and text excerpts
