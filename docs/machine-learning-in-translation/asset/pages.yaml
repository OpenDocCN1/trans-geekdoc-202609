    a CAT system. In 1990, Trados launched their MultiTerm terminology database, with
    the first edition of the Translator’s Workbench TM tool following in 1992. Also
    in 1992, IBM Deutschland commercialized its in-house developed Translation Manager
    2, while large language service provider STAR AG (also German) launched its own
    in-house system, Transit, onto the market. Similar products soon entered the arena,
    such as Déjà Vu, first released in 1993. By the mid-1990s,'
