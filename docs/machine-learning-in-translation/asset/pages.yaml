    before attempting to do the same thing in the heat of the interpreting action
    (p. 111).


    Active listening is grounded in analysis, including both general analysis of what
    the speaker is trying to say and analysis of the hierarchical structure of the
    speech to distinguish the primary information or main points from lower level,
    supporting, or ancillary information. Notably, Gillies (2013) proposes the concept
    of “automizing” the analysis task (p. 111), which implies that there may be an
    internal cognitive mechanism or language models in the human brain that is able
    to automate this form of processing (see Chapters 3 and 8).


    Given the constraints of time and cognitive load, the interpreter must process
    the information into larger chunks, rather than attempting to retain the smaller
    bits of information. Interpreters do not simply write down what they have heard,
    but rather elements that will trigger their memory for what to say. To some degree,
    interpreters’ notes capture the hierarchical structure of a speech and are typically
    a demonstration of the results of meaning analysis.


    # 2.2.4 Level of analysis requirements in machine learning


    As discussed previously, to some degree, granularity levels in a machine learning
    process must be consistent with the nature of human cognitive activity in order
    for ML tools to work for and interact with humans directly. Although there are
    instances where they are not used directly but instead serve as a basis for machine
    training of another ML tool that can be utilized by humans, our discussion of
    the levels of analysis begins with the human framework for linguistic structure
    and related reasons why machines process information at various levels too.


    First, as mentioned earlier, an objective of using ML tools is to scale up and
    magnify human ability and reduce cognitive load. To this end, various tools have
    been designed to assist NLP tasks, such as term extraction tools based on tf–idf
    (term frequency – inverse document frequency) at the word/term level, phrase representation
    generation mechanisms in phrase-based statistical machine translation (SMT), and
    systems that automatically align segments of the source and target text. In many
    cases, segmentation decisions are made not based on mathematical considerations,
    but rather to meet human translation requirements and to help humans process natural
    language, including understanding and producing text or speech. For example, even
    if input data is sentence by sentence as a parallel corpus with many features
    based on human information processing, such as segmentation indicated by punctuation,
    the data cleaning process will deconstruct the text to tokens and usually remove
    the punctuation that humans rely on for comprehension. Nevertheless, the process
    starts and ends with human perception, as the data must make sense to humans during
    input and after output. In this sense, the overarching natural language processing
    framework for levels of analysis is driven by human rather than internal programming
    requirements.


    Second, when using a neural network for language modeling, the ‘meaning’ is extracted
    based on the hypothesis that there is a link between similarity in how words are
    distributed and what they mean. This distributional hypothesis was first formulated
    in the 1950s by linguists like Harris (1954) and Firth (1957).'
