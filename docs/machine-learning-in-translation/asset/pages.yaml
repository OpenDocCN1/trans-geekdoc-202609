    in a specific language (Schäfer et al., 2014, p. 9).


    In translation, parallel corpora creation relies on multiple ML techniques to
    collect data, including OCR technologies that digitize translation-related content
    (source and target texts). Automatic tools are then used to segment and align.
    These large-scale corpora come from a compilation of different sources, which
    is not the same as translation memory produced in a translation process. Although
    the TM includes the translated text, the translator who created the translation
    usually was not aware of or not directly responsible for the subsequent parallel
    corpora construction. This type of parallel corpus involves automation rather
    than translator intervention. Unless the translator further annotates the data,
    the corpus does not include information about the content of the corpus from the
    translator’s perspective, such as the unit of translation or translation quality.


    To some degree, this type of data can be considered general, involving less translator
    intervention, due to the following reasons:


    +   a It can be used repetitively for various NLP tasks and for linguistic analysis
    conducted by humans.


    +   b The computation of different sources of language data is more relevant to
    the work of ML developers and data scientists than translators.


    +   c With the application of computational technologies, the scale of this type
    of data is usually much larger than the scale of data resulting from translator
    invention.


    +   d It is considered data out of context. For example, though each part of the
    data might come from linguistic resources from a specific project, the project
    information is usually lost in the massive amount of data after incorporation
    into the larger dataset, or used repetitively for various projects with their
    own specific context. Once the data are removed from their specific context (project
    information, terminology, client requirements, etc.), TCI is no longer possible,
    unless a user analyzes the data to recover its context.


    +   e It is usually inactive in a specific translation project. Take translation
    memory for example. If a TM is not used for a certain period of time, its translations
    and terminology may be outdated. The TM can be considered inactive or depreciated
    and should not be presented to translators as suggestions for their translations.


