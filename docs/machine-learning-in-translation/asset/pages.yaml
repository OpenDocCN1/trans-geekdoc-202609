  md: 'metrics discussed in the previous section, QE metrics are aimed at MT systems
    in use. In this sense, quality in MT is interpreted in terms of post-editing time
    and efficiency.


    Specia, Shah, et al. (2013) list a number of applications for QE: (1) deciding
    which segments require translator revision, or human quality assurance; (2) deciding
    whether a reader gets a reliable gist of the text; (3) estimating the amount of
    effort required to post-edit; (4) selecting among alternative translations produced
    by different MT systems; and (5) deciding whether translations are suitable for
    self-training of MT systems (p. 79).


    QE models are generally trained on publicly available datasets, such as the Europarl
    parallel corpus (Koehn, 2005). These datasets need to leverage language-specific
    human annotations for supervision, including direct assessment and post-editing,
    and these annotations are often costly and time-consuming, particularly for word-level
    QE, where each token needs a label (Tuan et al., 2021). Specia et al. (2009) describe
    three types of manually annotated data (MT output): (1) subsets of sentences annotated
    by humans according to adequacy, with scores from from 1 (worst) to 5 (best);
    (2) sentences annotated by professional translators with quality scores between
    1 and 4, with 1 designating a need for complete retranslation and 4 designating
    fit for purpose; and (3) sentences annotated with post-editing time, determined
    empirically by recording the amount of time a professional translator required
    to post-edit the sentence (pp. 30–31).


    There are multiple open source MT QE frameworks, including deepQuest, OpenKiwi,
    QuEst, and QUETCH. To explain the basic inner workings, QuEst can serve as an
    example (QuEst++, 2022). QuEst was designed to estimate the sentence-level quality
    of machine translation systems, and it relies heavily on linguistic and textual
    features. The basic framework includes two main modules: a feature extraction
    module and a machine learning module. QE is a prediction of quality based on certain
    features, including language-independent features (such as confidence measures),
    general linguistic resources (such as part-of-speech taggers), and language-specific
    features. An example of the latter is incorrect translation of pronouns, which
    was designed for Arabic-English QE (see Specia, Shah, et al., 2013, p. 81). In
    the machine learning module, quality is predicted by combining a number of features
    that describe different aspects of translation fluency and accuracy, source text
    complexity and ‘translatability’, as well as MT system confidence (Specia & Soricut,
    2013, p. 213). The machine learning module is “independent from the feature extraction
    code and uses the extracted feature sets to build and test QE models” (Specia
    et al., 2015, p. 116).


    A main component of the machine learning module is Confidence Estimation (CE),
    which is viewed as a binary classification (Blatz et al., 2003, cited in Specia
    et al., 2009, p. 28) distinguishing between ‘good’ and ‘bad’ translations based
    upon


    a continuous quality score . . . estimated for each sentence. This problem is
    addressed as a regression task, where algorithms are trained to predict'
