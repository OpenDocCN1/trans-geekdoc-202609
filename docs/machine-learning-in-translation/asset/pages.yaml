  md: 'Generally speaking, when translators put more effort into a project, the data
    quality should be higher, making a translation memory corpus with a high degree
    of TCI valuable for translation-related activities. However, sometimes translation
    memory can be ‘contaminated’ by mistakes due to a translator’s misunderstanding
    or the lack of relevant contextual information in the translating or post-editing
    processes. In this sense, the quality of data is affected by individual factors
    during data creation.


    One must also consider whether the TCI is relevant for translation or NLP tasks.
    When using linguistic resources, it is important to analyze the data type in terms
    of TCI. For example, OPUS (https://opus.nlpl.eu) is an online platform where users
    can access large collections of various parallel corpora (Tiedemann, 2012, p.
    2214). If one intends to train a spoken MT, the TED talk corpora can be considered.
    However, if one intends to train an MT on written translation of political documents,
    EuroParl can be used. As these examples show, a key indicator to consider is the
    relevance of the dataset for the NLP task in terms of domain, language pair, and
    mode of communication (spoken or written).


    Now that we have discussed various degrees of TCI from the minimum level of translator
    intervention to multiple layers of translator insights encoded in data, we will
    discuss techniques to communicate these human insights to an ML system. Generally
    speaking, such communication is achieved by means of language data annotation.


    # 7.4 TCI through data annotation


    # 7.4.1 Raw data vs. annotated data


    In this section, we focus on human-generated authentic data in corpora to discuss
    human annotation activities. Language data annotation adds a layer of human intelligence
    to raw data. Here raw data means unannotated data. In corpus linguistics, the
    term ‘tagged’ is often used (see Biber et al., 1998, pp. 257–262). A single corpus
    annotated with the same specification is called an annotated, or a tagged corpus.
    A typical example of a grammatically tagged corpus is part-of-speech (POS) tagging.
    See Figure 7.1 for the POS tagging of the sentence I do not like green eggs and
    ham.


    As shown in Figure 7.1, POS tagging assigns each word in the sentence to a category,
    which is a critical requirement for subsequent analysis.


    Both raw and annotated data can be used to train ML algorithms, as functions are
    learned (or generated) by mapping the relationships between input and the desired
    output. The main use of raw data is searching for a particular word or sequence
    of words. In neural language models, the distributional information of linguistic
    units is the foundation of meaning representation. For example, as discussed in
    Chapter 3, word2vec uses running text as implicitly supervised training data for
    a classifier, which avoids the need for any sort of manual annotation of the data.
    When raw data are annotated, the tags highlight the specific features that are
    relevant to the learning task.'
