    language model we discussed in Chapter 3. As to how a message is chosen out of
    a set of possibilities, Shannon and Weaver (1964) emphasize that "the statistical
    nature of messages is entirely determined by the character of the source" (p.
    18), i.e., the mind of the person who produces the message. In other words, a
    person possesses a mental language model that guides judgments following rules
    that involve the analysis of the frequency of past events, which reflects how
    the person made sense of the real world.


    If we observe language development in infants, it is obvious that they are not
    born with speech or language; language needs to be acquired or learned and does
    not happen automatically. To cite just two examples from the vast literature on
