  md: '![](img/ec5cbdd0549c7a4e25c06fc472c12208_89_0.png)


    # FIGURE 4.3 The Vauquois triangle for MT


    Source: Adapted from Vauquois (1968, p. 335).


    consists of an analyzer to parse the source language and a generator for each
    target language to transfer the interlingua representation from one language to
    another. The Vauquois triangle in Figure 4.3 shows these relationships.


    The triangle shows an increasing depth of analysis, moving from the direct translation
    approach at the top through transfer approaches in the middle to interlingua approaches
    at the bottom. In addition, a decreasing degree of dependence on the language
    form (i.e., signifier) happens moving down the triangle. At the direct level at
    the top, almost all knowledge is at the word level and requires large amounts
    of transfer between linguistic forms. The dependence decreases to syntactic and
    then semantic transfer, and finally little specific transfer knowledge based on
    forms at the interlingua level. We can view the encoder-decoder network of neural
    machine translation (NMT) as an interlingua approach, with an encoder taking an
    input sequence and creating a contextualized representation of it, and a decoder
    generating a task-specific output sequence (see Jurafsky and Martin 2020, p. 208).


    Since the first public demonstration of MT in 1954, many paradigms based on the
    Vauquois triangle have been proposed. They all aim to solve the problem of the
    conflict between meaning (interlingua) and form (semantic/syntactic structure).
    This is not an easy task, as many linguistic features come into play, including
    word order, lexical ambiguity in various contexts, and semantics. The meaning
    conversion process requires knowledge of morphology, syntax, and semantics for
    both the target and source languages. Native speakers of a language have this
    knowledge in implicit form, but coding the knowledge explicitly in computer programs
    is extremely complex. Bar-Hillel (1959) provides an example in Appendix IV of
    the Report on the State of Machine Translation in the United States and Great
    Britain: “Little John was looking for his toy box. Finally, he found it. The box
    was in the pen. John was very happy” (p. 2).'
