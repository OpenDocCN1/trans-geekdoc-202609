    activities. Some corpus-based approaches to learning have proven to be useful,
    but they are often post-translation activities. For example, when comparing two
    varieties of texts in the same language, such as translated and non-translated
    texts, a translated text must be available, and the criteria, such as the topic,
    language style, and document length for selecting the non-translated text, must
