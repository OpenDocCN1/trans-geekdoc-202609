    # 2.3.2 Linguistic units for machine learning


    A sequence $w_1, w_2, w_3 \dots w_n$ as a whole is generally dealt with at various
    levels, and an atomic unit that a language model can train and make predictions
    on is a ‘token’, typically a word, character, or subword (see Google Developers,
    n.d.–c, for a definition and examples).


    If a token is a word, the number of tokens in a corpus is the total number $N$
    of running words. Tokens are not defined by word type; rather, the term ‘type’
    refers to the unique or distinct words in a corpus. If the set of words in the
    vocabulary of a corpus is V, the number of word types is the vocabulary size $|V|$.
    In NLP, references to the number of words in the language are generally references
    to word types (Jurafsky & Martin, 2020, p. 12). In most cases, the number of word
    types is not the same as the number of tokens. For example, in a corpus that includes
    a document about a UN resolution of biodiversity conservation (the English version
    of a resolution adopted by the General Assembly on 16 April 2021, Symbol A/RES/75/271),
    there are 583 word types and 2,017 word tokens based on the calculation of AntConc,
    a corpus analysis toolkit for concordancing and text analysis (Laurence, n.d.),
    as shown in Figure 2.4. This example illustrates that there is often a large difference
    between the vocabulary size (number of word types) and the total number of words
    (tokens) in a corpus. Another linguistic unit in NLP is the lemma, which is the
    stem of a set of lexical forms that are the same major part-of-speech and have
    the same word sense. Cats and cat have the same lemma cat but are different word
    forms. The word form is the full inflected or derived form of the word. In this
    example, cats and cat are two inflected word forms. For morphologically complex
    languages like Arabic, we often need to deal with lemmatization. For many tasks
    in English, however, word forms are sufficient (Jurafsky & Martin, 2020, p. 12).


    There are lemmatization algorithms, which can be complex. This is not surprising,
    as lemmatization involves a further abstraction around the original word forms
    and corresponding categorization. In NLP, there is a simpler but cruder method,
    which mainly consists of chopping off word-final affixes. This naive version of
    morphological analysis is called stemming. One of the most widely used algorithms
    is the Porter stemmer (Porter, 2006), which is included in some NLP'
