    In Equation 3.2, the small letter n is the number of word tokens in a sequence
    w''_1, w''_2, w''_3 ... w''_n, whereas the capital letter N is the size of a fixed
    preceding context. The equation means that the prediction is based on a fixed
    preceding context of size N; any input that occurred earlier than that has no
    bearing on the outcome (Jurafsky & Martin, 2020, p. 175). Take the sequence the
    cat is walking in the bedroom as an example. If we set the context window at 2,
    the probability of the next word token being bedroom given the previous words
    the cat is walking in the is almost equal to the probability of the next word
    being bedroom given the previous word the. That is to say, the right side of Equation
    3.2 is almost equal to the left side. When n = 7 (that is, the seventh word token
    in the sequence) and N = 2, P(w_7 | w_1:6) is equal to P(w_7 | w_{(7-2+1):(7-1)}),
    or, P(w_7 | w_6:1)). The formula w_n | w_(n-1) is the generic one for a sequence
    with n word tokens when N = 2: P(w_n | w_{(n-2+1):(n-1)}) = P(w_n | w_{(n-1):(n-1)})
    = P(w_n | w_(n-1)). It indicates a bigram model, which predicts the second word
    token in the bigram given the first token, in this case using the scheme the cat,
    cat is, is walking, walking in, in the, and the bedroom.


    # 3.2.4 Neural probabilistic language models


    An n-gram language model is an approach to statistical language modeling. It estimates
    words from a fixed window of previous words and obtains a generalization by concatenating
    very short overlapping sequences seen in the training set. As Bengio et al. (2003)
    point out, statistical language modeling is "intrinsically difficult because of
    the curse of dimensionality: a word sequence on which the model will be tested
    is likely to be different from all the word sequences seen during training" (p.
    1137). Mikolov, Yih, and Zweig (2013) also point out weaknesses. They argue that
    traditional n-gram language models treat words as discrete units that have no
    inherent relationship to one another, and thus cannot achieve a level of generalization
    that represents text in the corpora where similar words are likely to have similar
    vectors (p. 746). Thus Bengio et al. (2003) proposed using neural networks for
    the probability function. Their study found that this approach allows the model
    to take advantage of longer contexts and significantly improves on the n-gram
    models. Specifically, they argue that computers should learn a distributed representation
    for words that allows each training sentence to inform the model about the probability
    estimation'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'of semantically neighboring sentences. “The model learns simultaneously (1)
    a distributed representation for each word along with (2) the probability function
    for word sequences, expressed in terms of these representations” (p. 1137). This
    means that by “training a neural network language model, one obtains not only
    the model itself, but also the learned word representations, which may be used
    for other, potentially unrelated, tasks” (Mikolov, Yih, & Zweig, 2013, p. 746).


    In recent years, neural language models (NLMs) have become dominant in solving
    NLP problems. Many translation-related tasks, such as machine translation, text
    summarization, and text generation, are handled by NLMs. A neural LM uses neural
    networks as its architecture to predict upcoming words from prior word context.
    In the neural network, there are many “small computing units, each of which takes
    a vector of input values and produces a single output value” (Jurafsky & Martin,
    2020, p. 127).


    In summary, neural net-based language models have many advantages over the n-gram
    language models:


    they can handle much longer histories and generalize over contexts of similar
    words. For a training set of a given size, a neural language model has much higher
    predictive accuracy than an n-gram language model. Furthermore, neural language
    models underlie many of the models for tasks . . . like machine translation, dialog,
    and language generation. (Jurafsky & Martin, 2020, p. 143)


    # ## 3.2.5 Embeddings and meaning


    In neural language models, the prior context is represented by embeddings of the
    previous words. Representing the prior context as embeddings, rather than by exact
    words as used in n-gram language models, allows neural language models to generalize
    unseen data much better than n-gram language models. In a certain sense, embeddings
    are representations of the meaning of words, learned directly from their distributions
    in texts. These representations are used in every natural language processing
    application that makes use of meaning. Generally, embeddings are vectors for representing
    words as a point in a multidimensional semantic space that is derived from the
    distributions of word neighbors, although the term is sometimes applied more specifically
    to dense vectors like word2vec (see Jurafsky & Martin, 2020, p. 100). In this
    book, we use embeddings to refer to dense vectors. Unlike sparse, long vectors
    with dimensions corresponding to words in the vocabulary, e.g., one-hot encoding,
    embeddings are a more powerful word representation: “they are short, with the
    number of dimensions d ranging from 50–1000, rather than the much larger vocabulary
    size |V|” (p. 112), as seen in one-hot encoding. These vectors “are dense: instead
    of vector entries being sparse, mostly-zero counts or functions of counts, the
    values will be real value numbers that can be negative” (p. 112).'
