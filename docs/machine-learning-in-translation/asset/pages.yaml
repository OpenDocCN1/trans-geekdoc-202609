- pgno: 97
  md: 'an attention mechanism to draw global dependencies between input and output”
    (p. 2). The Transformer allows for significantly more parallelization and can
    reach a new state of the art in translation quality after being trained for a
    relatively short period of time on GPUs (p. 1). According to Vaswani et al. (2017),


    Self-attention, sometimes called intra-attention, is an attention mechanism relating
    different positions of a single sequence in order to compute a representation
    of the sequence. Self-attention had been used successfully in a variety of tasks
    including reading comprehension and abstractive summarization, before being applied
    to machine translation . . . the Transformer is the first transduction model relying
    entirely on self-attention to compute representations of its input and output
    without using sequence aligned RNNs or convolution.


    (p. 2)


    In a self-attention system, the information flows in a single causal, or backward
    looking, self-attention layer. A self-attention layer maps sequences of input
    vectors (x1, ... , xn) to sequences of output vectors (y1, ... , yn) of the same
    length. When processing each item in the input, the model attends to all the inputs
    up to and including the current one. Specifically, the model compares an item
    of interest, e.g., x3, to a collection of other items, i.e., its preceding elements
    x1 and x2, and to x3 itself, in a way that reveals their relevance in the current
    context. The result of these comparisons is then used to compute an output for
    the current input. For example, the computation of y3 is based on a set of comparisons
    between the input x1, x2, and x3. Unlike RNNs, the computations at each time step
    are independent of all the other steps and therefore can be performed in parallel
    (Jurafsky & Martin, 2020, p. 191; Vaswani et al., 2017, p. 2).


    Compared with the RNN, the Transformer includes stacked multiple encoders and
    decoders, which is denoted by Nx, implying that encoders and decoders are stacked
    n times. “Each layer in the encoder has two sub-layers. The first is a multi-head3
    self-attention mechanism, and the second is a simple, position-wise fully connected
    feed-forward network” (p. 3).4 Intuitively, listeners intend to find an answer
    to a specific question in another person’s utterance. There is an internal mechanism
    in the human brain that directs their mental language model to pay attention to
    specific parts of a sentence. For example, if they want to know the color of a
    roof, they pay attention to red when they hear the statement There is a house
    with a red roof. Similarly, the multi-head attention mechanism allows the model
    to attend to different parts of the sequence according to its context, assigning
    larger weight to important parts and smaller weight to irrelevant parts. In addition,
    the position-wise module provides positional encoding that can represent the position
    information of a token in a sequence in a dimensional vector, instead of simply
    calculating the distances between words/tokens in a sequence.


    Vaswani et al. (2017) found that for translation tasks, the Transformer can be
    trained significantly faster than architectures based on recurrent or convolutional
    layers (p. 10). Their research shows these models to be superior in quality while
    being'
