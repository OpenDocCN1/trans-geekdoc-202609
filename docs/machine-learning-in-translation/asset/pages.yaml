    \ e.g., computer linguists, linguists, and translators (SYSTRAN, 2016).\n\nThere\
    \ are three steps in RBMT: first, the analysis of the sentence in the source language,\
    \ including part of speech tagging, morphological analysis, semantic analysis,\
    \ constituent analysis, and dependency analysis. Second, a transfer step creates\
    \ a series of hard engineered algorithms to represent relevant rules and lexical\
    \ items based on the analysis, e.g., if the system sees *pen* in English, the\
    \ system converts it to 笔 (meaning “pen, pencil, writing brush and other types\
