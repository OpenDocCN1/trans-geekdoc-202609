    # 8.3.3 User accessibility to human-driven ML systems in translation


    Given the relationship between HL and ML in language model training, ML provides
    an opportunity for humans to approach their own learning process. This process
    will be facilitated if the basic principles of ML are intuitive for humans. One
    significant obstacle for domain experts to learn ML technologies is the lack of
    access to personalizable ML models.


    Here we propose the concept of human-driven ML systems in translation, which allow
    individual users to personalize and thus learn by manipulating input data and
    editing or analyzing output data according to the users’ purposes and intentions.
    As mentioned previously, many commercialized language technologies are based on
    general assumptions about a group of stakeholders’ needs, which mostly represent
    a collective or ‘objective’ view independent of individual intentions and observations.
    While these technologies can help users accomplish translation-related tasks,
    their customized technological architecture is often based on stereotypes built
    into the generic ML models. The architecture provides limited functionality to
    make changes using language data to which users have full access. For instance,
    if translators can only use a neural MT system to translate without being able
    to train the model based on their needs, they are not fully exposed to dynamics
    of an ML model, resulting in limited support of their understanding of the inner
    workings of the model and limited ability to use the model to facilitate their
    learning.


    Ultimately, the goal of users plays a significant role in defining and categorizing
    these systems. While human intentions are individual and difficult to categorize,
    we can classify them based on shared purposes at each step of a continuous translation
    process, as shown in the list of examples in Table 6.1 in Section 6.3.2 of Chapter
    6. We start at the end of the scale where ML models have the least amount of personalization,
    which are the generic models that offer users the greatest flexibility to personalize
    them based on individual purposes. When categorizing specific use cases, we look
    to the middle of the scale as a framework where cases can be roughly clustered
