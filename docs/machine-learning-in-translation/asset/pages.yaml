- pgno: 71
  md: 'The implications of the concept and methodology of embeddings are as important
    in the fields of linguistics and translation as they are in engineering. Since
    the beginning of reflection on translation centuries ago, meaning has been the
    center of discussion. There are also many intuitive ways to approach meaning in
    traditional linguistics and translation, for example through component analysis
    as discussed in Chapter 1. Yet it was not until theorists developed the methodology
    of embeddings that they were able to visualize and instantiate the concept of
    meaning using real value numbers. In this approach, mathematical operations are
    applied to meaning. For example, the male/female relationship is automatically
    learned, and with induced vector representations, king – man + woman results in
    a vector very close to queen (Mikolov, Yih, & Zweig, 2013, p. 746). The use of
    embeddings offers a new dimension of thinking as to what is meant by a word and
    how the meaning of a word is related to other words semantically. In NLP, this
    area of study is called vector semantics, and it is the standard approach to representing
    word meaning, capturing many aspects.


    In a feedforward² neural network, the computation proceeds iteratively from one
    layer of units to the next, until the last layer is reached, in a process to obtain
    predictions by forward propagation. Deep learning includes modern networks that
    have multiple layers. Neural networks share many of the same mathematical principles
    as logistic regression. A feedforward neural LM is a standard feedforward network
    that takes as input at time _t_ a representation of some number of previous words
    and outputs a probability distribution for possible next words. Like the _n_-gram
    LM, the feedforward neural LM calculates the probability of a word given the entire
    prior context by estimating based on _N_ previous words.


    Next we will discuss how meaning is represented in numbers through a neural language
    model.


    # ## 3.3 Meaning representation in neural language models


    # ### 3.3.1 Distributional semantics


    In Chapter 1, we discussed two approaches to meaning representation: compositional
    analysis and distributed representation. In both approaches, meaning is represented
    internally, from the lexeme or the entity in itself. In a human approach, the
    deconstruction process from a lexeme to its component parts happens through human
    cognitive activity. In a computer system, the feature extraction and meaning representation
    are induced externally, from the environment where an entity exists, by observing
    the distributional structure of natural language data in a corpus.


    In a distributional approach to meaning, language data and the structure of the
    data are the basis for the representation of meaning in the computer program,
    rather than the human intuition used in translation without computer support.
    Rapidly increasing computing power allows machine learning to leverage large-scale
    language data more efficiently. After all, without ML tools, a human would not
    be able to process such a large amount of information in an entire lifetime.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'As discussed in Chapter 2, meaning exists only in the human mind. Then how
    does NLP programming produce information that renders meaning in computer programs?
    Generally speaking, there are two strands of thought addressing this question.
    The first is encoding relevant human linguistic knowledge into the program. An
    example is WordNet (Fellbaum, 1998), a lexical database that stores words and
    human judgment-based relationships among them, e.g., synonyms and hyponyms, and
    linguistic information in the form of parts of speech, e.g., nouns and verbs.
    The second is capturing similarities from text corpora, for which technical methods
    can include count-based statistics, modeling using more advanced statistical methods,
    and increasingly powerful tools from machine learning. In recent years, with the
    rise of ever-larger text collections on the web, the second strand of thought
    grounded in corpus-based approaches has come to dominate (Smith, 2019, p. 3).


    To capture similarities from text corpora, distributional semantics is applied
    as a model of word meaning, which is the foundation of meaning in a longer sequence,
    such as phrases and sentences as discussed in Chapter 2. Distributional semantics
    is based on the distributional hypothesis arising from the work of Harris (1954),
    which states that similarity in meaning results in similarity of linguistic distribution.
    Words that are semantically related are used in similar contexts: if enough text
    material is available, and in the corpus two linguistic entities w₁ and w₂ tend
    to have similar distributional properties by occurring with the same other entity
    w₃, then it can by hypothesized that w₁ and w₂ belong to the same linguistic class,
    or it can be interpreted that to some degree, w₁ and w₂ have some common meaning
    features (see Sahlgren, 2008, p. 35). “Distributional semantics reverse-engineers
    the process and induces semantic representations from contexts of use” (Boleda,
    2020, p. 2), in particular from natural language data.


    As Boleda (2020) points out, distributional semantics represents word meaning
    by taking large amounts of text as input, then through an abstraction mechanism,
    produces a distributional model, with semantic representations in the form of
    vectors – essentially, lists of numbers that determine points in a multi-dimensional
    space. “Words are points in a space determined by the values in the dimensions
    of their vectors, like 0.71028 and 1.76058 for post-doc. The words post-doc and
    student are closer together in the semantic space than post-doc and wealth” (p.
    3). Thus, they are more closely related semantically and used in more similar
    contexts.


    The collection of vectors in a distributional model constitutes a vector or semantic
    space, which is characterized by the dimensions of the vectors. In the space,
    semantic relations can be modeled as geometric relationships. In Boleda’s (2020)
    example, there are two dimensions. The finding shows that the vectors for post-doc
    and student are closer in the space than those of postdoc and wealth because their
    vector values are closer: the cosine of the angle between the two vectors post-doc
    and student is 0.99, which is greater than 0.37, the cosine between postdoc and
    wealth. The closer the vectors, the closer the cosines, the more similar the meaning
    (p. 3).'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# ### 3.3.2 Vectorization: from text to numbers


    # #### 3.3.2.1 Words and vectors


    Computers cannot process the form and meaning of texts as humans do. A computer
    processes only binary numbers 0 and 1. When computers are employed in natural
    language processing, the first step is therefore to convert words to numbers.
    To do that, numbers can be assigned to words to index them, using label encoding.
    But these numbers are discrete in nature, and arithmetic operations cannot be
    performed using the assigned values. These numbers can help identify the corresponding
    form of a word, but do not contain semantic information. A language sign, as discussed
    in Chapter 1, has both form (signifier) and meaning (signified). To obtain a representation
    of meaning, words must be converted to vectors. “A vector is usually a list of
    numbers, with a known length, which we call its dimensionality” (Smith, 2019,
    p. 3). Vectors are derived from the distributions of word neighbors and represent
    an inter-related, continuous, hidden state of words.


    Vector or distributional models of meaning are generally based on a co-occurrence
    matrix, a way of representing how often words co-occur. Converting inputs to numerical
    representation is the first step to generating a ML algorithm in any domain. In
    this section, we will use an example: the term–term matrix.


    As mentioned in the previous section, in a distributional approach to meaning,
    language data and the structure of the data set are fundamental for the representation
    of meaning in the computer program. Table 3.2 shows an excerpt from a document
    about a UN resolution on biodiversity conservation (the English version of a resolution
    adopted by the General Assembly on 16 April 2021, Symbol A/RES/75/271) with roughly
    2000 words, which is the training corpus for vector learning.


    The distributional structure is captured by examining the number of times the
    target words, such as *conservation*, *restoration*, *development*, and *transboundary*,
    and the context co-occur, e.g., *approaches and initiatives for* to the left of
    *transboundary*, and *cooperation*, *at appropriate levels* to the right. In this
    example, the context window is relatively small: 4 words to the left and 4 words
    to the right of the target words.


    Table 3.3 is an example of a term–term matrix, also known as a word–word matrix
    or term-context matrix, in which each cell records the number of times the target
    word in the row co-occurs with the context word in the column in a


    # **TABLE 3.2** UN corpus excerpt to show target words and their contexts


    | 4 words to the left and implementation for the cooperation and biodiversity
    conservation | Target words conservation restoration | 4 words to the right and
    sustainable use of and protection, Welcoming regiona |

    |---|---|---|

    | achievements of the Millennium approaches and initiatives for | development
    transboundary | Goals and seeking to cooperation, at appropriate levels |'
  merge: -1
  img_proc: true
