  md: 'context of mobile phones. First, automatic discourse analysis tools such as
    AntConc or WordSmith Tools are used to identify context keywords that accompany
    the translation *caso*. The collocations of the word *case* include context keywords
    such as Samsung, iPhone, Motorola, and phone. These context words are added to
    a regular expression: “(?i)(caso.+(iphone|samsung|phone|motorola)|(iphone|samsung|phone|motorola).+caso).”
    The regular expression returns most of the translations of *case* in the context
    of mobile phones in this corpus and serves as a starting point for manual verification.


    Corpus-based linguistic analysis tools are used in other translation-related tasks.
    For example, source text analysis based on ML has been applied in the language
    industry. In this approach, statistics of specific features are analyzed using
    ML-driven tools, including the number of words, nouns, long words, and complex
    words. These statistics are good indicators informing the translator’s decisions
    as to whether the source text is suitable for translation and if so, the best
    method to translate it, whether human translation, MT, or MT with post-editing
    (MTPE). A translator can also pre-edit the source text based on the analysis result
    in order to improve the accuracy of the MT engine. In Bar-Hillel’s (1959) example
    of a sentence series – *Little John was looking for his toy box. Finally, he found
    it. The box was in the pen. John was very happy* – the translator can change *pen*
    to *playpen* so that the MT system will not mistranslate it (p. 2). In real-life
    projects, there are usually multiple scenarios for source text creation, including
    content written by non-native authors, content created by technical specialists
    for a non-technical audience, and dated content not adhering to brand tone and
    voice. Corpus analysis can help identify errors in poor source content and predict
    ‘at-risk’ content. Sometimes source text needs to be re-written before translation
    based on the results of the analysis.


    More advanced ML driven technologies can be used to conduct translation-driven
    NLP tasks. Machine translation quality estimation is an example of using ML to
    estimate the MT quality. Further, by analyzing linguistic features including POS,
    density of a particular POS (e.g., nouns or adjectives), long words, complex words,
    short and long sentences, stylistic similarity, and correlations of text features
    to edit distance and MT quality estimation, one can set up threshold indicators
    to identify the outliers of an average situation. The outliers can be further
    examined manually by professional translators to make decisions such as the consistency
    of the source and target text styles and linguistic features, such as when the
    target text is more linguistically complex than the source text.


    # 7.5.2 Data analytics for machine learning


    # 7.5.2.1 Using data to train ML models


    When using data to train neural ML systems, the characteristics of the dataset
    are crucial to train, monitor, and upgrade the systems. To find out whether the
    data are suitable for the task, the data must be cleaned and analyzed to evaluate
    their quality and relevance to the task. In most ML modeling, there are two basic
    types of data:'
  merge: -1
