  md: '# # Introduction


    ANNs allow neurophysiological principles to be described by mathematical formulations.
    However, rather than modeling brain mechanisms, as much more research is needed
    in terms of how our brains work, neural network models were inspired by and resemble
    the anatomy and physiology of the nervous system, as Barrow (1996) points out.
    Key aspects of many neural network models are that they are able to learn and
    their behavior improves with training or experience (p. 135). In this sense, a
    connectionist approach entails machine learning that reflects certain characteristics
    of human cognition; we compare machine learning and human learning in Chapter
    8.


    Traditional statistical approaches also develop generalized models from examples
    of linguistic phenomena. What separates neural network models from other statistical
    methods is that neural network models combine statistical learning with various
    theories of representation, allowing transformation, inference, and manipulation
    of logic formulae (Liddy, 2001, p. 9). In connectionist systems, linguistic models
    are harder to observe due to the fact that connectionist architectures are less
    constrained by humans than traditional statistical ones, given the complexity
    and large numbers of simple components or neurons as well as connections between
    them. A typical example of this approach is neural machine translation (NMT),
    which Google, Microsoft, and Meta (formerly Facebook) started to commercialize
    in 2016. We discuss neural network language models in Chapter 3.


    Since the first public demonstration of machine translation, the Georgetown-IBM
    experiment performed in 1954 (Hutchins, 2004, p. 1), many systems have been built
    in the attempt to deal with natural language input or output. Yet NLP tasks are
    very challenging; as Kornai (2008) points out, "[t]hese tasks are so hard that
    Turing (1950) could rightly make fluent conversation in natural language the centerpiece
    of his test for intelligence" (p. 248). This is not surprising, considering how
    much time and effort a child or an adult requires to learn a language. Ultimately,
    human–computer interaction (HCI) is needed to achieve a real-life communication
    effect, and the way translators interact with computer programs is through language
    data, which we discuss in Chapter 7.


    The transition from symbolic to statistical approaches does not mean that symbolic
    approaches, which were widely used in early stages of NLP, are out-of-date. In
    reality, problems may be better tackled with one or the other approach, and in
    some cases, the tasks become so complex that it may be impossible to choose a
    single best approach. The solution depends on the purpose – how humans intend
    to use NLP computational techniques to accomplish specific tasks.


    Furthermore, as Klavans and Resnik (1996, p. x) point out, every use of statistics
    is based upon a symbolic mode. No matter the application, statistics are based
    upon a probability model, and that model is, at its core, symbolic and algebraic,
    rather than continuous and quantitative. Regardless of the details of the model,
    the numerical probabilities are meaningless except in the context of the model''s
    symbolic underpinnings. In this view, there is no such thing as a ''purely statistical''
    method. Conversely, symbolic underpinnings alone are not enough to capture the
    variability inherent in naturally occurring linguistic data and its resistance
    to inflexible, terse'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'characterization. To sum up, statistical approaches and symbolic approaches
    are complementary. It is important to balance and combine these NLP approaches.


    NLP is closely related to translation. The field of MT is one of the oldest non-numerical
    applications of the history of computers (Nirenburg & Wilks, 2000, pp. 159–188).
    In 1949, Warren Weaver published his memorandum on translation, which drew attention
    to the idea of MT and inspired many projects (Liddy, 2001; Hutchins, 2000). In
    January 1954, a joint project conducted by IBM and Georgetown University showcased
    a Russian-English MT system in New York. This was the first computer-based application
    related to natural language (Hutchins, 2004).


    In addition to MT, translation activities include many other NLP tasks, such as
    translation-related text analysis, text summarization, text classification, multilingual
    information retrieval, and speech recognition. Translation is a special and important
    use case of natural language comprehension and generation. Thus, we propose a
    translation-driven conceptualization of NLP, defined as follows:


    > Translation is an important and useful area of NLP application. Through parsing,
    tagging and analyzing naturally occurring text/speech or other types of language
    data at various levels of linguistic analysis, computer programs can achieve a
    level of human-like language processing for tasks such as machine translation,
    automatic post-editing, and quality estimation, with the goal of functioning effectively
    in a translation process. NLP in translation is fueled by data, powered by a range
    of computational techniques, and driven by human purposes.


    # Machine learning: the scope of discussion


    In the field of AI, ML is considered to be a branch of AI (McCarthy, 2007). In
    NLP, ML is an important aspect of statistical and connectionist approaches. For
    example, artificial neural networks are closely related to artificial intelligence;
    and it is believed that intelligent behavior will emerge from sufficiently complex
    networks of large numbers of simple, interconnected units that are properly stimulated
    (Henderson, 2007, p. 171). Nevertheless, AI and NLP do not necessarily rely on
    machine learning. As we discussed earlier, symbolic approaches to NLP rely on
    human analysis of the data in order to form a theory or build a model. Computer
    systems developed with this approach, such as rule-based MT engines, demonstrate
    a certain level of “intelligence” or “human-like performance”. In contrast, ML
    systems following statistical approaches offer a higher degree of autonomy when
    building models upon the collected data. At the extreme end of the autonomous
    continuum, connectionist architectures based on artificial neural networks are
    less constrained by humans, and linguistic models built on human analysis and
    reflection are harder to observe.


    To some degree, an artificial neural network language model is more like a separate,
    independent system of language processing than a simulation of the'
