  md: '# # EPILOGUE – HUMAN-CENTERED MACHINE LEARNING IN TRANSLATION


    Looking back at the history of human development, one finds that the evolution
    of humankind is closely linked to the development of tools and technology. When
    technology frees people from tasks, it allows them to explore new frontiers, physically
    and mentally. Yet machine learning offers more than progress in the division of
    labor between humans and machines. Its learning capability enables it to generalize
    and make predictions independently based on limited observations. In this sense,
    an ML system is able to create something new, which is not necessarily the same
    as what human inferences produce.


    Confronted with a black box that is subject to less human control than perhaps
    any other tool in history, people have mixed feelings about its power, with advocates
    both for and against. This book advocates a holistic approach to ML, which considers
    the respective roles of both humans and machines so that strengths and weaknesses
    compensate each other and the translation workflow and learning processes are
    optimized.


    In a neural network language model, machine perception provides us with a tool
    to examine our cognitive activities when engaging in translation tasks. Although
    it oversimplifies mental language models in many cases, it provides a preliminary
    visualization of how our mental language model might work. In other words, machine
    learning is a form of human reflection of ourselves, both internally of our own
    cognitive activities and externally of the physical world around us. It is part
    of us and reflects human nature, which is why we are drawn to it.


    Following this train of thought, this book proposes a machine-in-the-loop, human-centered
    approach to machine learning in translation, where translators take full control
    of final decisions and are able to personalize generic ML models based on their
    specific needs. This approach can inspire creativity by providing translators
    a new perspective of their work. This approach offers what neither humans nor
    machines can accomplish on their own. However, as machine learning'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'is very new and dynamic, most users lack sufficient relevant competences to
    implement, customize, and personalize it proactively in their real-life projects.


    This book addresses this gap by helping translators understand and adapt to the
    integration of ML in translation workflows and learning processes. It examines
    machine learning from the user perspective, in particular translation practitioners
    with different levels of ML experience and humanities students who are familiar
    with linguistic and translation theories and aim to use ML technologies in their
    study and practice. It emphasizes a human-centered approach focusing on translation
    practitioners in a broad sense, by empowering them with the most relevant knowledge
    about ML in translation, ML-related communication, and a resource for continuous
    learning.


    # Empowering translators with ML knowledge


    At the very early stages of AI, when scholars such as Alan Turing and John Searle
    studied AI and machine learning, it was considered a subdiscipline in the field
    of intelligence, closely related to philosophy, education, and linguistics. As
    it developed, AI gradually became an independent discipline within science and
    technology research. However, with the harvesting of low-hanging fruit in the
    creation of rudimentary ML models, the language industry is now able to consider
    how to use these models by implementing, customizing, and personalizing the models
    for use in real-life scenarios. To achieve this goal, collaboration and communication
    are needed between computational scientists and translators as domain experts.


    This is not an easy undertaking, as these groups of individuals have different
    levels of exposure to specialized knowledge and skills in machine learning, and,
    while the development of ML technologies requires an engineering background, their
    use requires a holistic perspective, considering aspects such as strengths and
    weaknesses, workflow, as well as ethical issues and consequences. On the one hand,
    it is important to share relevant technical knowledge with users so that they
    can make responsible and informed decisions when using ML techniques in translation.
    For example, if you ask an editor to edit the XML inline tags, you will need to
    let them know what these tags mean. If you want users to make use of vector space
    to represent meaning, you will need to give them information about the corpus
    that generates the vectors so that they can analyze the corpus and the machine-generated
    insights from the human perspective. By shedding light on relevant technical details,
    human translators can complete a project more efficiently and effectively. On
    the other hand, too much technical information is not recommended as it can overwhelm
    translators rather than helping them focus on what they do best, which is translating
    and editing.


    # Empowering translators with ML-related communication


    The dichotomy between technology and human beings is in truth a division between
    human beings themselves, e.g., those with advanced ML knowledge and'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'skills who create technology and those with limited ML competence who are familiar
    with the business scenarios in which they use technology, either actively or passively.
    In a translation process, the ML-related communication occurs among and across
    multiple groups of individuals, including AI/ML developers and programmers, translators
    who are users of AI/MT programs, and project managers who manage human, data,
    and technology resources. Specifically, translators interact with computer programs
    through their work with language data, translating, post-editing, and annotating.


    A human-centered approach to machine learning in translation incorporates all
    types of stakeholders, including educators, ML users, and ML developers/programmers.
    As ML technology users, translators will benefit from communication with ML developers,
    who can help address the knowledge gap in the way of translators customizing or
    personalizing ML technology. ML developers can also benefit from domain experts
    such as translators, who can help them better understand translation workflows
    and design user-friendly tools, as well as grasp the ethical and socio-cultural
    aspects of translation.


    Due to the large quantity of data an ML system can produce, it makes sense in
    many cases to use machines to work with or check against other machines. For example,
    MT speeds up the translation process, which leads to the automation of other steps,
    e.g., automatic post-editing and automated MT quality evaluation. All these steps
    require not only technical expertise, but also domain knowledge that differs at
    various stages of the translation process. The design, development, and upgrading
    of relevant tools will benefit from effective communication between stakeholders,
    help ensure quality of the automated results, and take ethical issues into consideration.


    Technology should not hinder communication, as can happen when callers reach a
    customer service center where machine learning intended to guide customers to
    the right human agent cause frustration, because they stand in the way of speaking
    directly with another human. In a machine translation environment, if the MT deployment
    is used as an excuse to exclude humans in a translation process, it will lead
    to a one-sided perspective and generate resistance among translators.


    Ironically, the concept of communication implies the existence of barriers and
    differences. Humans generate messages that reflect their unique cognitive perspectives.
    Yet, communication processes prioritize commonalities because communication requires
    a shared understanding to be successful. In this vein, a goal of this book is
    to maximize a shared understanding of the role of machine learning in translation
    processes among our various stakeholders.


    # Empowering translators with continuous learning


    In an ML-driven translation process, it is understandable that machine learning
    is at the center of attention when the objective is to improve the system’s performance.
    However, taking a long view, the question arises whether translators will learn
    from the ML implementation and customization process. Theoretically, in a'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'human-centered approach, the whole translation process is driven by translators
    who are in a position to leverage ML results. This role requires a conceptual
    understanding of ML systems, which has a steep learning curve, at least at the
    beginning, because these systems are new and dynamic.


    Given this situation, we draw attention to the imbalance between ML and HL and
    the need to develop ML/AI tools to assist translators in ML–driven translation
    processes. Personalization is an effective way to facilitate interaction between
    humans and machines, where translators are not only training machines but also
    learning from ML resources and results. Through customization and personalization,
    translators can have full control of their linguistic assets and employ ML education
    tools to facilitate effective human learning. As creators, collectors, and managers
    of language data, translators and other domain experts have a significant role
    to play in machine training.


    One significant obstacle to domain experts learning ML technologies is the lack
    of access to personalizable ML models and platforms based on their purposes. In
    this book, we propose facilitating human learning through human–driven ML systems,
    which are generic ML models for specific NLP tasks in translation. Such models
    can be personalized by individual users, whose primary role is to provide relevant
    language data based on their intentions. A platform with human–driven ML systems
    incorporating the goals of each step of a continuous localization process is an
    effective tool to help translators acquire ML knowledge and expertise and learn
    translation–related skills.


    Translator learning is the key to boosting confidence in machine learning. As
    mentioned earlier, machine learning is like a black box that is subject to less
    human control than other tools that have preceded it. Technology should not hinder
    human learning; rather, it should enable and empower translators to keep exploring
    new frontiers in their physical and mental worlds. Although machine learning has
    its own capacity to generalize and predict, the ultimate human strength is our
    unique learning competence. If there is competition between ML and HL, translators
    will prevail for now because our ability to learn is superior, and the definition
    of what is better is based on human experience.'
  merge: -1
  img_proc: true
