  md: 'machine learning has been added to the CAT platform, leading to more intelligent
    CAT tools.


    Similar technologies can be integrated into MT systems as well. For instance,
    Bulte and Tezcan (2019) propose “a method for augmenting NMT training data with
    fuzzy TM matches” (p. 1800). Their tests with two language pairs (English into
    Dutch and English into Hungarian), using the TM of the Directorate-General for
    Translation of the European Commission, show considerable improvements in MT quality.
    Highlighting the ease of implementation of this solution, they suggest that their
    method is promising when a sizable TM is available and there is a repetition across
    translations.


    There is flexibility regarding the main infrastructure. ML technologies can be
    integrated into MT systems, or CAT systems, or other systems. MT quality has been
    considered unstable compared with human translation. As a result, in CAT workflows,
    the MT system is often used as a backup mechanism when the TM fails to retrieve
    high fuzzy matches above a certain threshold. Yet theoretically, these features
    can be embedded in any system based on the user’s purpose. Lilt, for example,
    is an interactive MT system. It integrates segmentation and other features into
    its MT system. As a result, the boundaries between an MT system and a CAT become
    blurry.


    # 6.6 Intentionality: why machine learning matters in translation


    In the Introduction to this book, we discussed Searle’s (1980) thought experiment
    known as the Chinese Room Argument, in which Searle leads those outside the room
    to believe that he understands Chinese (Cole, 2020). Searle argues that he is
    simply behaving like a computer performing computational operations on formally
    specified elements, without any understanding of Chinese. He asserts that he is
    simply an instantiation of the computer program.


    What distinguishes humans from machines is intentionality, which, as Searle (1980)
    states, is “a product of causal features of the brain” (p. 417). Here, the word
    ‘causal’ indicates a relationship between cause and effect. With causal features,
    the brain is able to produce (i.e., cause) intentional states, which cannot be
    achieved by a simulation or a computer program. Searle (1980) further points out
    that instantiating a computer program, as in Searle’s thought experiment, is not
    a sufficient condition of intentionality (p. 417).


    Because the formal symbol manipulations by themselves don’t have any intentionality;
    they are quite meaningless; they aren’t even symbol manipulations, since the symbols
    don’t symbolize anything. In the linguistic jargon, they have only a syntax but
    no semantics. Such intentionality as computers appear to have is solely in the
    minds of those who program them and those who use them, those who send in the
    input and those who interpret the output.'
