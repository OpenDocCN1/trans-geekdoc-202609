    words, directly learned from their distributions in texts.


    From the technical perspective, embeddings are useful for the computer to use
    as an input for the next layer of machine learning, but they are not intuitive
    for humans to understand due to high dimensionality. As introduced in Section
    1.3 of Chapter 1, the dimension of a vector space is the cardinality (i.e., the
    number of vectors) of a basis of a vector space over its base field. In many cases,
    the embeddings used to train a corpus are high dimensional. For instance, in a
    research project conducted by Mikolov, Chen, et al. (2013), they evaluate models
    with multiple dimensionality options (50, 100, 300, and 600) in order to estimate
    the best choice of model architecture (pp. 6–7).


    Thus we require special tools to investigate vector space so that humans can understand
    its meaning. One way to examine and understand the embeddings is through visualization
    after dimensionality reduction. For example, TensorBoard Embedding Projector is
    a tool to graphically represent high dimensional embeddings (Tensorflow, 2022).
    It offers three commonly used methods of data dimensionality reduction, which
    allow easier visualization of complex data: PCA, t-Distributed Stochastic Neighbor
    Embedding (t-SNE), and custom (Smilkov, 2016, pp. 2–3).


    For instance, Figure 8.2 is a visualized vector space trained on a document using
