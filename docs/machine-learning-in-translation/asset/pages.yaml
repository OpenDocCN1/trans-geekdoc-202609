    an external perspective to imbue data with meaning. Translation as a scenario
    generates complexity that does not occur in conventional communication processes.
    The addition of the translator adds a third language model to the constellation,
    and the communication process includes connecting all three, similar to when different
    computer programs adjust their parameters to migrate and process data, albeit
    devoid of intentionality.


    # 8.3 Personalized ML tools for human learning


    # 8.3.1 The collective feature of technologies


    When abstract thoughts are formulated into language and communicated to others,
    meaning-making is based upon a shared understanding, which can be a collective
    understanding if shared among multiple people. Otherwise misunderstanding and
    miscommunication are likely to occur. This seems to be a prerequisite for successful
    communication entailing the conversion of ideas to spoken or written form. At
    the same time, the interpretation of meaning is an individual act, based on an
    internal language model developed through the knowledge and experience of the
    recipient of the message. A computer program, however, processes linguistic signs
    as abstract data, devoid of underlying meaning, but can process data in vast quantities.


