  md: 'with bread and pain. In English, bread has neither the same appearance nor
    the same importance as a food as pain in French.


    To address this complexity, Saussure (1966) proposed a theoretical linguistic
    dichotomy: langue and parole. Specifically, langue encompasses the abstract, systematic
    rules and conventions of a signifying system; it is independent of language use.
    When we speak or write, these words belong to parole, the concrete instances of
    language use. This difference is important because most items of langue undergo
    a transformation when they are used in parole. In its turn, langue evolves according
    to usage in parole. “Parole precedes langue and the realizations of parole pass
    into the realm of langue” (Vinay & Darbelnet, 1995, p. 15).


    This dichotomy also supports the line of argumentation proposed previously, that
