    For this reason, this chapter focuses on fundamental considerations that can support
    users making decisions about customizing their TQA strategies. For example, the
    application of MQM can be considered a specific scenario to make the assessment
    results more comparable across various projects and companies, whereas BLEU is
    used for MT system development and customization. Furthermore, this chapter focuses
    on the assessment of translated content. Theoretically speaking, all TQA metrics
    are potentially applicable to scenarios with both human and machine translation.
    As long as the approach, whether based on automated or human metrics, is utilized
    consistently, the assessment result will be useful.


    # ## 5.2 Fundamental TQA considerations


    # ### 5.2.1 Retrospective and prospective approaches


    House (2014) proposed that there are different ways of assessing (retrospectively)
    the quality of a translation and different ways of ensuring (prospectively) the
    production of a translation of specified qualities. This dichotomy is based on
    time. When the element of time is incorporated into TQA, two fundamental aspects
    are introduced: quality assessment metrics, including automated and human direct
    assessment, for the evaluation of completed translations, and methods that help
    predict the quality of translation. The latter can support the development of
    effective, situation-driven editing strategies for translation tasks.


    # ### 5.2.2 Linguistic relationships


    Among assessment theories in translation studies (e.g., Chesterman, 1994; House,
    2014), a relevant consideration in the context of MT is the concept of linguistic
    relationships. As Chesterman (1994, p. 153) points out, quality assessment was
    initially retrospective; it evaluated the relationship between the translated
    text and its source text, and the source text (plus its author) was taken to be
    the ‘authority’. The goal of translation was a relation of equivalence between
    source and target text – however equivalence was defined. Chesterman (1994) incorporates
    the concept of norms (see also Toury, 1995) into his framework and proposes an
    approach to quality assessment that aims to compare “a given product (or process)
    to the accepted relevant norms” (p. 153). He points out that this mode of assessment
    is “objective, text-based, formal, eminently practical, and furthermore manifestly
    realistic” (p. 153).


    As to what norms are considered to be accepted and relevant, specific circumstances
    must be considered. An extreme case might be the quality assessment of a localized
    website based upon the customer conversion rate. In this case, business considerations,
    rather than linguistic features, are prioritized. There are other norms'
