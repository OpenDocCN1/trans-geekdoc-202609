  md: '# ## 9.4.2 Incorporating ML into the teaching of translation


    In a top-down, educator-guided learning scenario, educators can incorporate the
    most relevant ML knowledge into their curriculum design in order to improve the
    overall translator competence as discussed in Section 9.3.


    One challenge of incorporating ML knowledge into teaching is its diverse and dynamic
    features. In Chapter 6, we summarized some typical NLP tasks in a continuous translation
    process. The list is based on assumptions for a general scenario that might work
    for many translators. However, in real-life projects, it may not be comprehensive
    enough, or some of the items may not be relevant to some translators. Thus, there
    are a few basic considerations when introducing ML knowledge to learners.


    Firstly, the purpose of introducing ML knowledge is to augment human knowledge
    and expertise. That is, the priority is on humans, and how to help translators,
    project managers, and other domain experts adjust to new ML-driven translation/localization
    processes. Therefore, fundamental issues for an educator to consider include the
    true value of humans in an ML–driven translation process and the best way to leverage
    human capability. For example, if a translator/post-editor reviews 100 sentences
    of MT results and only 1 sentence needs to be revised, human potential will be
    underutilized because the task is inefficient, and human intelligence is not fully
    maximized. In this case, if the instructor teaches students new skills such as
    MT quality estimation that can identify sentences that need human post-editing,
    translators will be able to make better use of their time during editing tasks.
    There are many other NLP techniques that can help us find solutions that maximize
    human effort and learning, including source-text oriented comparable corpus compilation
    and analysis, source text analysis and editing from a translator’s point of view,
    and using regular expressions to do linguistic quality assurance of the target
    text.


    Secondly, the teaching of ML knowledge and development of skills must be able
    to help learners make generalizations, which, as we discussed in Chapter 8, is
    the essence of both machine learning and human learning. In other words, an instructor
    should be able to provide students with basic ML technical knowledge that is sufficient
    for them to make inferences and create new technical solutions based on situations
    that they have not seen in class. Following are some specific aspects that indicate
    students’ ability to generalize.


    +   1. Students are able to design their own use case using multiple NLP techniques.
    For example, in Chapter 5, we discussed using human targeted error rate (HTER)
    to evaluate the accuracy of quality estimation (QE). Another example is source
    text analysis. There are multiple approaches, including using automatic discourse
    analysis tools to observe the linguistic behavior, NLP packages to extract relevant
    features from the text, and named entity recognition (NER) to identify key information
    (entities) such as proper names and dates/times.


    +   2. Students are able to apply one NLP technique to different tasks. For example,
    regular expressions (see Section 7.5.1.1 in Chapter 7) can be used in automatic'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'error recognition during the MT post-editing stage as well as in automatic
    segmentation in the analysis/preprocessing stage. Another example is using translation
    memory (TM) for multiple purposes: when students learn how to clean TM to avoid
    leverage loss (i.e., when some segments are not recognized by another system due
    to different data formats, system settings, or other factors), they can use the
    same technique for MT training and data migration across different translation
    environments.


    +   3 Students are able to interpret the results generated by an automated NLP
    technique. For example, when students learn about BLEU scores, an automated MT
    evaluation metric discussed in Section 5.4.1 of Chapter 5, they should be able
    to tell what factors affect the result and control these variables in order to
    ensure the credibility and reliability of the BLEU score. Some typical examples
    are how many reference translations are used in the algorithm, whether the metric
    is used to measure statistical MT or rule-based MT, and whether the reference
    translations were previously done by human translators from scratch or MT post-edited
    results.


    +   4 Students are able to identify and analyze relevant technical details that
    help them make the best use of both human and machine power. For example, students
    should be able to figure out where the automation part is for each tool: translation
    memory includes the automation of segmentation and automatic TM management, including
    concordance and sometimes regular expressions. MT metrics can be automated: metrics
    for translation error typology such as MQM are mainly for humans, but the counting
    and simple analysis of errors can be automated, such as the percentage of each
    type of error. Having this information, students will be able to draw conclusions
    as to when and where to use human resources to complement the weaknesses of automation.


    Thirdly, even in the top-down teaching approach, much focus has been put on learning
    in recent years, in recognition of the importance of selecting the most relevant
    ML knowledge to include in the translation curriculum. Here, the term ‘relevance’
    is a psychological concept that also accounts for the individuality and personality
    of each learner. As Wilson and Sperber (1994) suggest, “information is relevant
    to you if it interacts in a certain way with your existing assumptions about the
    world” (p. 92). Generally speaking, many teaching environments involve the student-instructor
    relationship in a one-to-many instructional setting, such as classroom lectures.
    In such settings, instructors need to investigate collective student expectations
    and learning needs at each step of a continuous translation process, prepare relevant
    knowledge to share with them, and develop lesson plans for skills development
    in these areas.


    # 9.4.3 The impact of ML in a learner-centered environment


    Learner-centered instruction provides personalized and customized learning, taking
    into consideration what learners bring to the class, such as their existing'
