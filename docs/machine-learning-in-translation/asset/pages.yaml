- pgno: 66
  md: 'or an adult starts to learn a foreign language. Many beginning learners experience
    struggling to find the next word in their speech or writing when trying to express
    their ideas. When a person is proficient enough in using their ‘language models’
    to predict the next word in the sequence or sentence, it happens automatically
    and subconsciously; most native speakers usually speak or write without giving
    it too much thought.


    A computer program can generate a sequence through a natural language model that
    predicts what word comes next by assigning probability to a sequence of text,
    both spoken and written. As discussed in Section 2.3.1 in Chapter 2, an ordered
    sequence of words ($w_1, w_2, w_3 ... w_n$) represents syntagmatic relationships.
    In each position of $w_n$, there are specific linguistic values associated with
    possible word options. When a language model captures features of these values,
    e.g., parts of speech and semantics, it can generate and evaluate the results,
    and produce an optimal outcome that is consistent with the results of human prediction.


    Generally speaking, a typical natural language model predicts the next word token,
    instead of the whole sequence. There is a reason why developers do not work on
    modeling an entire sequence. As will be discussed in Section 3.4 of this chapter,
    in a statistical approach to language processing and generation, meaning and associated
    features related to linguistic forms are investigated by observing the distributional
    structure of natural language data in a corpus. A language model learns from past
    experience by analyzing examples and searching for patterns in the language data.
    Humans are very creative and always produce new sequences. The more word tokens
    a sequence contains, the lower the probability that the sequence will be included
    in an existing collection of data. For example, you can easily find the 2-gram
    sequence *it is* in a corpus, but it is much more difficult to find the 5-gram
    sequence *It is a giant bird*. A solution is to decompose, or divide up, the problem
    by segmenting the data into smaller sequences. Generally speaking, a language
    model subdivides the whole sequence – $w_1, w_2, w_3 ... w_n$ – and predicts one
    word token at a time. In practice, a good language model is expected to assign
    higher probabilities to sequences that are real and syntactically correct.


    Most translation-related NLP tasks are fundamentally sequence-to-sequence problems
    that can be solved through language modeling, e.g., converting a longer sequence
    into a shorter one (text summarization), a sequence in language A into a sequence
    in language B (translation), or a sequence of spoken utterances to written text
    (speech recognition). In machine learning, the language model learns from input
    and output data: if the model is fed parallel corpora in a translation memory,
    for example, the model captures the aligned, equivalent patterns in translation.
    If the model contains long texts and their short summaries, it aims to accomplish
    a text summarization task. And if it is a corpus of paired spoken utterances and
    written text, it learns to convert text between spoken and written forms. What
    really matters is the training data as examples of input and output data, which
