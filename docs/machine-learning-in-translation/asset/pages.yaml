    # 1.5 A holistic view of translation


    Now that we have a preliminary idea of the two different approaches to meaning
    representation – one from the human and the other from the machine – we return
    to the concept of translation and revisit its nature. As discussed in the first
    section, translation is primarily a human activity, which originates through practice,
    out of the necessity of communication. Even before Holmes (1972/2004) proposed
    translation studies as a separate discipline, it drew on theories from other fields,
    such as linguistics, psychology, and literary studies. Yet none of them was designed
    to address solely the problem of translation, and these theories tend to be descriptive
    of some translation phenomena, rather than a framework to address all use cases
    of translation. Furthermore, technology tools and computer applications not only
    provide methodologies to solve translation problems but also add a dimension of
    reflection on the nature of translation.


    Undoubtedly, the study of language and translation are inextricably linked. In
    translation, the alignment between a linguistic sign in one language system and
    one in another relies on meaning. In terms of the meaning of a linguistic sign,
    Saussure (1966) argued that in order to make sense of it, one can only examine
    how this sign relates to other signs in the same system. Yet ‘sign’ is a complex
    concept. There is an inseparable union of a concept and its written or spoken
    linguistic form, and there is a gulf between a ‘sign’ as a whole in its own right
    and that same item playing a particular role within a contextual situation in
    human life.


    Translation adds an extra layer to this complexity. As Vinay and Darbelnet (1995,
    p. 12) point out, when a word has an exact counterpart in another language in
    a given context, there is only one signified for two signifiers: *knife* and *couteau*
    in the context of *couteau de table* or *table knife*. But the signified of two
    signifiers, though normally considered interchangeable, may not coincide completely.
    This is the case'
