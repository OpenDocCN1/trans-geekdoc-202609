- pgno: 141
  md: '# # TRANSLATOR-COMPUTER INTERACTION THROUGH LANGUAGE DATA


    # ## KEY CONCEPTS


    +   - There are two fundamental uses of language data: (1) human analysis and
    learning and (2) machine analytics and learning.

    +   - Comparability is a key characteristic of translation-driven language data.
    In translation, both humans and machines compare pairs of texts to learn, e.g.,
    MT results and human translation to calculate MT quality scores, aligned source
    and target texts (parallel corpora) to train MT, and texts in different languages
    on the same topic (comparable corpora) to learn specialized knowledge.

    +   - In a typical translation process, translator–computer interaction (TCI)
    is realized through language data from three perspectives: (1) data design and
    acquisition, (2) data annotation, and (3) language data use.


    # ### 7.1 Introduction


    In its foundations, machine learning (ML) is a method of data analysis that automates
    analytical model building. In other words, data constitute the critical infrastructure
    necessary to build machine learning systems. In translation, language data largely
    determine the performance, fairness, robustness, safety, and scalability of translation-related
    ML systems.


    Neural networks are a form of machine learning that uses a layered representation
    of data. Take a neural MT system pipeline for example. It starts with input data,
    typically human-friendly linguistic elements in the source language. Then the
    MT system converts these elements into machine-readable feature vectors that represent
    syntactic and semantic characteristics. Next, if the network includes deep learning
    layers, the MT system performs a series of further transformations before converting
    the feature vectors back into linguistic elements in the target language.'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'Humans can then edit this final layer to achieve a degree of naturalness that
    is equivalent or similar to what humans can achieve in their traditional translation
    or language generation process.


    Paradoxically, among AI/ML researchers and developers, aspects of working with
    language data are often under-discussed, being viewed as ‘operational’ relative
    to the lionized work of building novel models and algorithms (Sambasivan et al.,
    2021, p. 1). For a translator, linguist, or localization project manager, however,
    working with language data is the most significant part of their practice and
    research, and their approach to language data is different from that of an AI/ML
    researcher, developer, or data scientist. Typically, a translator has advanced
    linguistic and cultural knowledge and can make meaningful analysis of the datasets,
    both individually for discrete translation tasks and collectively for managing
    the quality of translation memory through post-editing and annotation by a group
    of translators. The latter allows for quality control of the language data fed
    to a neural MT engine to train the model. In contrast, a data scientist or a data
    engineer uses computer programs and tools to conduct statistical analysis of language
    data, for example, with software such as Python, R, and Tableau. Similarly, an
    ML/AI researcher and developer focuses on building novel models and algorithms.
    While an overlapping of these approaches is unavoidable, the priority for each
    perspective is clear.


    A translator starts with formatted content, including both linguistic and non-linguistic
    elements, including images, formatting, and audio. In terms of linguistic elements,
    a linguistic unit consists of signs and thus has a double structure for linguistic
    form (signifier) and for meaning (signified). In a neural language model, when
    the input data are prepared and the output data are edited by humans, the data
    must be presentable and make sense to humans. However, once the data are out of
    sight of human users, the data do not necessarily have to be meaningful to them.
    In other words, data can have multiple states. The first state is *parole*, i.e.,
    the concrete instances of language use, which is mainly for humans and demonstrates
    unique human characteristics. The second state occurs when data are fed to machines,
    which tokenize, segment, and process the data so that an ML system can digest
    them and perform mathematical operations. This second state of language data is
    an engineering and statistical perspective rather than a linguistic or cultural
    one. The translator interacts with an ML system in the first state and some aspects
    of the second state – sentence segmentation makes sense to humans, whereas tokenization
    and stemming do not – by creating and compiling linguistic instances for machine
    learning, adding human annotations to make reflections understandable by the system,
    and conducting linguistic analyses to make decisions as to what data are relevant
    to train the machine.


    When discussing human–computer interaction (HCI), many users think first of technological
    tools – CAT tools for instance – an annotation platform, or an interactive MT
    system, which provide an HCI interface for the translator. It might be the case
    that an AI/ML researcher or developer focuses on specific technologies to facilitate
    HCI. However, the HCI investigation in this approach may make the workflow inconsistent
    and segmented for the translator, as a translator uses multiple'
  merge: -1
  img_proc: true
- pgno: 143
  md: "tools, and it can be difficult in theory and practice to connect these separate\
    \ technologies that are designed for various purposes. What is consistent for\
    \ the translator is the need to process language data in various states throughout\
    \ the entire translation process, and the conversion between states is a fundamental\
    \ characteristic of HCI. Incorporating features that facilitate human insight\
    \ into language data at or close to the input and output layer of neural networks\
    \ is part of the translator–computer interaction (TCI) process.\n\n# 7.2 Translation-driven\
    \ language data\n\nTerms such as _data_, _corpus_, and _information_ are often\
    \ used interchangeably in multiple disciplines, e.g., translation studies, NLP,\
    \ and computer linguistics. In this chapter, we point out crucial distinctions\
    \ between them when examining various states of language data, as ML is pushing\
    \ the boundaries of the concept of language data. This section aims to clarify\
    \ these concepts in relation to the continuous translation process discussed in\
    \ Chapter 6.\n\n# 7.2.1 Corpus and language data\n\nThe concept of ‘data’ implies\
    \ an engineering and statistical perspective, rather than a linguistic or translation-related\
    \ one. _Statistics_ is the science of collecting, analyzing, presenting, and interpreting\
    \ data. According to the Encyclopedia Britannica entry for the term _statistics_,\n\
    \n> Data are the **facts and figures** that are collected, analyzed, and summarized\
    \ for presentation and interpretation. Data may be classified as either quantitative\
    \ or qualitative. Quantitative data measure either how much or how many of something,\
    \ and qualitative data provide labels, or names, for categories of like items.\n\
    > \n> _(emphasis added; Williams, n.d.)_\n\nA large amount of data can be analyzed\
    \ and turned into useful information in many applied fields. The process of “information\
    \ extraction (IE) turns unstructured information embedded in texts into structured\
    \ data” (Jurafsky & Martin, 2020, p. 332). For example, the task of relation extraction\
    \ aims to find and classify semantic relations among the text entities; and temporal\
    \ expressions such as days of the week (Thursday, Friday, etc.) can also be extracted.\
    \ In this sense, ‘information’ in IE refers to limited types of semantic content\
    \ that can be extracted from text (p. 332).\n\nIn a translator-mediated communication\
    \ process, large amounts of concrete instances of language use, i.e., _parole_,\
    \ are created. These linguistic resources are meaningful for humans. For a machine\
    \ learning system, these linguistic elements – words or lexemes – are categorical\
