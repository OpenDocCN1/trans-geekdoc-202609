  md: 'longer sequence is a simple and crude way for a computer program to approach
    the level of analysis. It is widely used in NLP programming. For example, in order
    to segment phrases, the program can cut a token sequence into a phrase sequence
    with a fixed phrase length, which varies with the sequence length. This allows
    the program to roughly divide the granularity levels of a text. As the length
    of a phrase is usually smaller than that of a sentence, a phrase can be set to
    be a 5-gram sequence, for example, while a sentence has a higher number of n-gram
    sequences. An n-gram can also refer to a predictive language model that assigns
    probabilities to the next word token. In this case, the small letter n refers
    to the number of grams as in the sequence w_p, w_2, w_3 ... w_n, while the capital
    letter N refers to the size of a fixed preceding context to be considered in an
    n-gram language model. The use of n-grams is discussed in more detail in Chapter
    3.


    # 2.3.3 Segmentation based on meaning


    Granularity levels in NLP can be confirmed based on the form that corresponds
    to human units of thought, e.g., punctuation (sentences) and white spaces (words).
    Recently, neural language models can use a continuous real value vector for each
    linguistic unit, e.g., word or phrase. Cho et al. (2014) report that both the
    semantic and syntactic structures of words and phrases can be captured using an
    RNN Encoder – Decoder. RNN refers to a recurrent neural network, which is one
    of the architectures for language models (see Chapter 3). Cho et al.’s (2014)
    research shows that semantically similar words cluster together. For example,
    France, China, and Russian are clustered, which is consistent with human intuition
    regarding attributes of countries or regions, and English and French are very
    close to one another, which is also consistent with human intuition regarding
    languages or nationality. They also find that most of the phrases about the duration
    of time that are syntactically similar are clustered together. This is a method
    for computer programs to capture human understanding of phrases and their meaning.
    If a computer program does not interact with humans, it is not required to go
    through such a delivery stage.


    Before 2016, when Google, Facebook, and Microsoft launched their Neural Machine
    Translation (NMT) systems, the most popular MT system was phrase-based Statistical
    Machine Translation (SMT), as modeling phrases instead of words had significantly
    improved the SMT approach through the use of larger translation blocks (or ‘phrases’)
    and reordering ability. Generally speaking, using phrases instead of words enables
    conventional SMT to condition on a wider range of context and results in better
    performance in reordering and modeling long-distance dependencies. Recently, Xu
    et al. (2020) “propose an attentive phrase representation generation mechanism
    that is able to generate phrase representations from corresponding token representations”
    (p. 386). They also incorporate the generated phrase representations into a Transformer
    translation model to enhance its ability to capture long-distance relationships.'
