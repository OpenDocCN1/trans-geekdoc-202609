    # 8.4 Using human-driven ML systems to facilitate human learning


    # 8.4.1 Individual cognitive aspects of terminology


    Translation terminology management is in many aspects a framework for humans to
    organize, learn, and use specialized knowledge. When a translator tries to identify
    terms in the source text or reference materials, decisions are usually based on
    two aspects. The first is specialization, including both specialized knowledge
    and its corresponding specialized language use. As Faber and León-Araúz (2016)
    point out, terminology is “the study of how specialized knowledge concepts are
    structured, described, and designated in one or various languages within a specialized
    domain” (p. 196). The second is cognitive difficulty level. Regarding this aspect,
    Muegge (2020) states, “not only the special words that belong to a specific discipline
    should be managed as part of every translation project, but every ‘difficult’
    word” (p. 23).


    These two aspects are related to cognitive features of learners and thus have
    subjective elements to them. The degree of ‘specialization’ may be identified
    by measures such as document comparison, consultation with subject-matter experts,
    and references to specialized documents and term lists. In comparison, identifying
    ‘difficult’ words for translators as learners, who have varying levels of previous
    knowledge and experience, can be a daunting task, as what is ‘difficult’ will
    vary from person to person.


    Under these circumstances, a learner can train an ML system to capture basic patterns
    reflecting a dynamic understanding of what words are ‘difficult’. For example,
    each learner can annotate a term list or a document that includes candidate terms,
    which provides individualized training sets for an ML terminology extraction system.'
