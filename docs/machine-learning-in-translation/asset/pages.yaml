    set data, which in effect invalidates the evaluation results.


    Finally, the main component of BLEU is referred to as “n-gram precision, which
    is the proportion of the matched n-grams out of the total number of n-grams in
    the evaluated translation. Precision is calculated separately for each n-gram
    order, and the precisions are combined via a geometric averaging” (Banerjee, S.,
    & Lavie, A., 2005, p. 67).


    # 5.4.2.3 Other n-gram based automatic metrics


    Metric for Evaluation of Translation with Explicit ORdering (Meteor) is an automatic
    metric for MT evaluation that aims to address the weaknesses of BLEU. It evaluates
    a translation by computing a score based on explicit word-to-word matches between
    the translation and a given reference translation (Lavie & Agarwal, 2007, p. 228).
    According to Banerjee, S., & Lavie, A. (2005) and Lavie and Agarwal (2007), Meteor
    has been demonstrated to correlate strongly with human judgments of translation
    quality and significantly outperform BLEU. In Meteor,


    [u]ngrams can be matched based on their surface forms, stemmed forms, and meanings.
    Furthermore, METEOR can be easily extended to include more advanced matching strategies.
    Once all generalized unigram matches between the two strings have been found,
    METEOR computes a score for this matching using a combination of unigram-precision,
    unigram-recall, and a measure of fragmentation that is designed to capture directly
    how well-ordered matched words are in the machine translation. (Banerjee & Lavie,
    2005, p. 65)


    Sometimes F-measure is used to evaluate MT quality, particularly a model’s accuracy.
    In the context of MT, it is a measure of how closely the hypothesis (MT output)
    matches the human reference translation. Its calculation employs the variables
    precision P and recall R. Specifically, precision P captures how many words from
    reference r (human reference translation) are present in hypothesis h. In other
    words, it is the proportion of words in the hypothesis h (MT output) that is present
    in reference r (human translation). This calculation does not take the position
    of the word in a sentence into account (see Munkova et al., 2020, p. 1329).'
