  md: 'seen as separate undertakings. Rather, there are clear links between a linguistic
    approach to translation that reflects humans’s from B. Intangible thoughts in
    A’s mind cannot be measured or described, whereas thought instantiated in linguistic
    form becomes specific and concrete. This difference in itself implies an inequivalent
    relationship, with speech uttered by A, resulting from focused attention, functioning
    as a set of stimuli that directs B’s attention to a corresponding concept in the
    mind. In this process, what distinguishes humans from machines is not speech as
    oral communication, but the faculty of constructing meaning through language.


    In the early 20th century, there was a shift of attention from historical linguistics
    to the exploration and description of the systemic structure of language, governed
    by rules and principles. In particular, Ferdinand de Saussure (1857–1913), who
    is widely acknowledged as one of the founders of modern linguistics and semiology,
    proposed that language is a system of signs that expresses ideas. According to
    Saussure (1966), a sign includes both the signifier and signified (or French,
    *signifiant* and *signifié*). The sign is arbitrary, meaning there is no inherent
    reason why a signifier is linked to the signified; in order to make sense of a
    sign, one can only examine how this sign relates to other signs in the same system
    (Saussure, 1966).


    Specifically, to understand the word *cheese* in terms of its relationships, a
    person can resort to: (1) linguistic acquaintance with the meaning assigned to
    this word achieved by reflecting on its relations to other signs in the language
    system and (2) nonlinguistic acquaintance with *cheese* as a physical object.
    To understand a word, a person must have at least a linguistic acquaintance with
    it. In some instances, non-linguistic objects associated with the word do not
    exist at all. For those who have never consumed *ambrosia* and have only a linguistic
    acquaintance with the word as “the food of the gods,” they can understand the
    word *ambrosia* and know in what context it may be used simply by depending on
    their linguistic acquaintance with it (Jakobson, 2021).'
