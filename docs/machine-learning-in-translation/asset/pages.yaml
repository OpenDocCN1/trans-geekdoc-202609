  md: 'functionality of relevant NLP techniques, as well as the capabilities and limits
    of the ML approach and the associated cost in the event of failure.


    # 9.3.2.2 Continuous learning competence


    Continuous learning competence is first and foremost a learning competence, which
    means learners must not only acquire but also integrate knowledge, skills, and
    attitudes. The key is accumulating and updating data in ML and offering HL experiences
    to build ML expertise. In the case of machine learning, a learner should be able
    to use ML tools to accumulate, annotate, and manage language data to train the
    machine.


    In a human learning scenario, with ML tools available, translators can use advanced
    technologies to augment their capacity to record, categorize, and analyze language
    data generated in their ongoing translation and localization projects. Usually
    a large text corpus contains more data than a human translator can process in
    a lifetime. With the application of ML and other advanced technologies, the scope
    of continuous learning can be augmented accordingly.


    # 9.3.3 NLP task-specific competences


    # 9.3.3.1 Translation competence in the narrow sense


    This competence covers all types of traditional translation competence, including
    knowledge, skills, and attitudes required to translate, evaluate, edit, review,
    and proofread. It involves capabilities that are needed for a translator to function
    effectively in translation proper, i.e., meaning conversion, including translation-related
    linguistic analysis, as well as semantic and pragmatic considerations involved
    in the meaning conversion process. These aspects are related to other competences,
    e.g., linguistic and cultural, but in the translating/MT step, we focus on interlingual
    translation activities in the narrow sense.


    One characteristic of translation competence is the increasingly important role
    played by editing and evaluating due to the impact of ML. With MT performing the
    translation task, humans tend to evaluate and edit more, which in many cases requires
    a higher competence in translation in terms of language proficiency levels, translation
    strategies, and pragmatics. Simply put, if a human translator cannot provide constructive
    feedback to the machine translator, that translator is optimally qualified for
    the evaluation and editing task.


    Knowledge and skills about terminology is a part of translation competence when
    a user considers the translation of terms in the translating/MT step. It can also
    be included in the memory check and post-processing steps and may focus on identifying
    specialized terms and concepts or finding an appropriate equivalent of these terms
    in the target language based on context. In both circumstances, terminology activities
    are not necessarily about translation in the narrow sense, e.g., identifying terms
    can be performed only in the source text, and choosing the right term in the target
    culture might be done only in the target text.'
