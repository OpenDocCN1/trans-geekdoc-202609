    # 5.2.3 Different automation scenarios in TQA


    Machine translation quality assessment can be carried out by humans and machines.
    If it is conducted solely by machines, using fully automated metrics for MT (e.g.,
    BLEU and TER), there is no need to incorporate a human-oriented assessment framework,
    such as MQM. These error categories are designed primarily for humans, following
    their thinking patterns, to categorize and annotate errors appearing in translations.
    These human judgment-based quality frameworks can be considered human metrics,
    even though further data collection and analysis, e.g., categorizing and counting
    errors and generating a final quality score, can be automated. This distinction
    is important, as the methods and procedures of applying an automated metric are
    different from those involving human judgments of translation quality.


    # 5.2.4 Factors in the TQA workflow


    Many factors in the TQA workflow may affect the quality of an MT system, or an
    MT-driven localization process. One approach to TQA is to assess relevant aspects
    at various MT implementation stages, including the following:


    +   - before MT: the quality of MT-related strategic decisions for a specific
    use case in terms of translation purposes, audience, available human resources
    and linguistic assets, language pairs, and domain identification.

    +   - during the pre-processing stage: the quality of preparations for the use
    of MT in terms of source text extraction, segmentation, data cleaning, and data
    synthesis.

    +   - during the MT stage: the quality of implementation of other MT-related tasks,
    such as translation memory incorporation and terminology integration.

    +   - during the post-translation stage: the quality of post-editing, in-context
    review, terminology, and translation memory updates.


    Each step includes numerous options to consider. For example, in order to convert
    a source text to a machine-friendly format, it needs to be segmented at a predefined
    linguistic level, such as sentences. For some content formats, this task can be
    easily done in some languages by referring to punctuation. However, under some
    circumstances, it is hard for a machine to decide on the boundaries of a piece
    of text input, for example, in pdf formatting and other forms of graphic design,
    there are layers that are hidden intentionally from human eyes. What a machine
    perceives varies from what humans see. For example, with a brochure containing
    pictures and text, a design objective is to make the content appealing, rather
    than ensuring'
