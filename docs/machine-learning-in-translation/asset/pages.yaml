  md: '# 8

    BALANCING MACHINE AND HUMAN LEARNING IN TRANSLATION


    # KEY CONCEPTS


    +   - Learning entails forming a mental model and adjusting the parameters of
    the model. A significant characteristic of both human and machine learning is
    the capability to generalize new conclusions based on available observations.

    +   - From the perspective of the relationship between samples, population, and
    inferencing, human learning is in alignment with statistical inference in ML.

    +   - The human inference process originates from within. Each person has a unique
    multilingual language model based upon past experience and their intentions to
    use the model. Converting generic ML models to personalized tools is an effective
    way to help humans learn ML technologies and acquire translation-related knowledge
    and expertise.


    # 8.1 Introduction


    The concept of ‘learning’ applies to both humans and machines. As Dehaene (2020)
    states: “To learn is to form an internal model of the external world” (p. 5).
    Dehaene also emphasizes that “learning is adjusting the parameters of a mental
    model” (p. 7), highlighting the dynamic features of a learning process, reflecting
    the diversity and individuality of a learner. All these aspects reflect the fundamental
    characteristics of not only human learning (HL) but also machine learning (ML).


    From the human perspective, when a person learns, for example, a new language,
    it can be useful to consider two types of learning environments. The first is
    top-down, starting from known features derived from sampled data, such as grammatical
    features in a corpus. This approach is based on objective rules, or absolute ‘truth’,
    which is independent of an individual learner’s cognition or observation. The
    second is bottom-up, with each learner working with sampled data to extract features
    or rules on their own, which allows the learner to follow individual'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'learning preferences. To some degree, the rules extracted in a bottom–up learning
    process are subjective, in that they depend on the learner''s previous knowledge
    and experience when forming personal understanding. Typically, the top-down approach
    is driven by an instructor who has mastered the linguistic features and can guide
    learners. In contrast, the bottom-up approach can begin with learners'' personalized
    inference processes as they extract features on their own. In the top-down teaching
    environment, instructors give feedback to help learners adjust their language
    models, whereas in the bottom-up learning approach, learners update their learning
    models from data or lived experience.


    These two basic processes apply to machine learning as well. To automate a process
    that was originally a human one, a computer program adopts one of two fundamental
    approaches: machine learning or symbolic reasoning. In machine learning, an algorithm
    learns rules as it establishes correlations between inputs and outputs. In symbolic
    reasoning, objective rules are created through human intervention and then hard-coded
    into a static program. Machine learning is bottom-up, similar to human learner-centered
    approaches. In contrast, symbolic reasoning is top-down, similar to instruction-centered
    approaches.


    There are philosophical considerations behind these two basic approaches. For
    instance, Lakoff (1987) proposed two basic views of learning, rational thought,
    and cognition: objectivism and experiential realism (pp. xi–xvii). In the objectivist
    view of mind, “the world can be described objectively, independent of any particular
    culture or observer’s viewpoint” (Hampton, 1989, p. 131). In an objectivist (human)
    learning environment, “the teacher is privy in some sense to the answers, that
    is, to truth, and the learners are there to find out what those answers are” (Kiraly,
    2003, p. 5). In a computer setting, these answers, or ‘truth’are considered rules
    in a symbolic reasoning approach. In Table 8.1, the first column summarizes some
    basic features of objectivism, which is to a very large extent in alignment with
    symbolic reasoning as we discussed under ‘Natural language processing and translation’
    in the Introduction of the book.


    Another view of learning is based on experiential realism, which emphasizes the
    role of experiences in the nature of learning and rational thought. According
    to Lakoff (1987), “experience”includes “everything that goes to make up actual
    or potential experiences of either individual organisms or communities of organisms”
    (p. xvi). As shown in the second column of Table 8.1, thought is dynamic, non-atomistic,
    and constantly updated with empirical data.


    Both views take categorization as the main method for making sense of human experience.
    As Lakoff (1987) states, “most symbols (i.e., words and mental representations)
    do not designate particular things or individuals in the world . . . [they] designate
    categories” (p. xiii). In an objectivist view, the nature of categories is defined
    by the properties common to all their members, rather than individuals, as it
    is believed there is an absolute, objective ‘truth’ that goes beyond individual
    observations. In an experientialist view, however, all reasonable thought “grows
    out of the nature of an organism and all that contributes to its individual and
    collective experience” (Lakoff, 1987, p. xv). That is to say, empirical data can
    be either'
