- pgno: 36
  md: 'Here Goldberg touched upon two different concepts: one is language data that
    people produce, the other is the rules that govern language. When examining the
    nature of rules, there are two primary considerations: (1) rules are not superficial
    occurrences like data; rather, they are further processed, hidden patterns or
    representations based on data; (2) rules can be constructed by both humans and
    machines, and while humans infer the rules using their intuitive reflections,
    machines use mathematical methods to capture the patterns of data. When Goldberg
    aims to hard code linguistic rules into a computer program, he notices that many
    human-constructed rules may not necessarily be machine friendly.


    These two types of rules, namely human-constructed linguistic rules and machine-generated
    rules, lead to two general approaches to using machines:


    +   1 In traditional computer programming – the symbolic approach to NLP in our
    case – the system receives input training data as well as rules and returns answers.


    +   2 In an ML-driven system – the statistical approach to NLP in our case – which
    includes both traditional statistical methods and artificial neural network models,
    one starts with input data and answers (training data), both of which are concrete
    and visible, and the results generated are patterns or rules that machines have
    summarized (see Figure 1.1).


    The former is driven by rules that are dynamically discovered or summarized as
    a result of human learning, whereas the latter generates its own machine rules
    and avoids human intuitive explanations of natural language, which is inefficient
    in a two-digit computer system. As Samuel (1959) stated, “a computer can be programmed
    so that it will learn to play a better game of checkers than can be played by
    the person who wrote the program” (p. 535). He added that “programming computers
    to learn from experience should eventually eliminate the need for much of this
    detailed programming effort” (p. 535). From his line of argumentation, we can
    see that machine learning gives computers the ability to learn without being explicitly
    programmed. In other words, machine learning allows computer programs to develop
    their own capability to create and generate new output, rather than simply memorizing
    what has been fed to them through traditional programming.


    The use of machines to generate patterns with or without a minimum level of human
    intervention led to a philosophical question: “Can machines think?”, as Alan Turing
    (1950) asked in his article Computing Machinery and Intelligence. Turing supports
    the advantage of drawing a fairly sharp line between the physical and intellectual
    capacities of humans, proposing that machines can ‘learn’ similarly to how humans
    apply intellect by approaching what is visible. An important feature of a learning
    machine is that the rules get changed in the learning process, and its teacher
    will often be largely ignorant of what is going on inside, although still be able
    to some extent to predict the pupil’s behavior. Turing also introduces the famous
    Turing Test, originally called the imitation game in the aforementioned'
