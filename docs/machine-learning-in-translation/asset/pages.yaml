    xP(extraordinarily \| the cat is)

    xP(frustrating \| the cat is extraordinarily) | The cat is extraordinarily

    (frustrating) |


    As the equation indicates, the joint probability of an entire sequence of words
    can be calculated by multiplying the conditional probabilities. Intuitively, it
    seems that new conditions are added to the previous ones. When more word tokens
    are built into the sequence, the probability of the entire sequence becomes smaller,
    as the new resulting sequence includes a longer history h with more conditions
    added to the requirements for the next possible word. For example, if the probability
    of a sequence starting with the is 50% (the first timestamp) and, given the, the
    probability of the next word being cat is 50% (the second timestamp), then the
    probability of a sequence being the cat is 25%. This is because the new condition
    (the probability of cat given the) is multiplied by the first condition (the probability
    of a sequence starting with the).


    In practice, the chain rule of probability does not really help in reducing computational
    complexity. As discussed in Section 3.2.1, humans are very creative in producing
    new sentences, which may not be captured in a corpus. Take the sequence the cat
    is extraordinarily frustrating as an example. This sequence is probably not included
    in a training dataset, because it is not very frequent usage in real life. If
    one wants to compute the exact probability of a word given a long sequence of
    preceding words, e.g., P(extraordinarily | the cat is) and P(frustrating | the
    cat is extraordinarily), there is no way to estimate by counting the number of
    times the word extraordinarily occurs following the cat is, nor the word frustrating
    following the cat is extraordinarily, as these instances are not seen in the training
    dataset. Therefore, a more practical approach is to make future predictions based
    on the most recent observations, with only a limited history being considered,
    instead of computing the probability of a word given its entire history. If there
    are sufficient statistics, it is fine to use longer sequences (e.g., 5-gram).
    Otherwise, a smaller window is used without looking too far into the past.


    The assumption that the probability of a word depends only on the probability
    of a limited history is called a Markov assumption. Andrey Andreyevich Markov
    (1856–1922) was a Russian mathematician best known for his work on stochastic
    processes (Andrey Markov, 2022). The Markov assumption significantly reduces'
