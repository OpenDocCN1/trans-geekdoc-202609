    # 1.4 Two approaches to meaning representation


    As mentioned earlier, human language is a unique creation. A piece of naturally
    occurring text contains both multiple language units (e.g., words) and an order
    of these units. This is not a simple parts-to-whole problem, as underlying such
    a structured combination there is meaning, which is related to each unit but is
    more than the sum of the parts. Thus, meaning representation is a very complex
    activity for a computer program to simulate.


    As discussed in the Introduction, artificial neural networks are able to combine
    statistical learning with various theories of representation. In particular, neural
    network language models, which are composed of large numbers of units (the analogs
    of neurons) together with weights that measure the strength of connections between
    the units (Buckner & Garson, 2019), can represent meaning in real value'
