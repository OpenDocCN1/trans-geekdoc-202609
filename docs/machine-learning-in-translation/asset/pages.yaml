  md: '# ### 3.2.2 n-gram language models


    As discussed in Section 2.1 in Chapter 2, when using computers to process language
    information at various levels of analysis, form is a convenient starting point.
    An n-gram is an ordered sequence of n words (w₁, w₂, w₃, ... wₙ). The value of
    n is an indicator of the length of a sequence and the level of granularity of
    analysis. Typically, the larger the number assigned to n, the longer the sequence
    will be and the greater the probability that the sequence is at a higher level
    of linguistic analysis. For example, the sentence it is pitch black at night can
    be segmented into the following:


    +   - a one-word sequence of words – it, is, pitch, black, at, and night – based
    on a unigram scheme and word level analysis, or

    +   - a two-word sequence – it is, is pitch, pitch black, black at, and at night
    – a 2-gram (also known as bigram) scheme, resulting in a higher probability that
    the sequence is at the phrase level, as in pitch black and at night, or

    +   - a seven-word sequence – it is pitch black at night – 7-gram scheme at the
    sentence level.


    An n-gram model is a symbol-based, statistical language model that can be used
    to analyze the relationship between adjacent tokens – characters, words, or sequences
    at other granularity levels – in order to gain insight into how their meanings
    are related. It is the simplest model that assigns probabilities to word tokens
    in a sequence. n-gram language models are a very successful approach to statistical
    language modeling and are able to obtain a certain level of generalization by
    concatenating very short overlapping sequences seen in the training set. As these
    sequences are ordered in a way that is meaningful to people, this type of investigation
    can, to some degree, assist computers in capturing and extracting ideas or thoughts
    that people have created.


    # ### 3.2.3 Conditions for prediction in n-gram language models


    When a computer program uses an n-gram language model to generate a sequence,
    it keeps adding conditions to the previous probability results. Specifically,
    in order to estimate the next word, one needs to analyze the training data and
    compute P(w|h), which is the probability of a word w given some history h, or
    the previous (n−1) words. To compute probabilities of entire sequences, the probability
    needs to be decomposed by using the chain rule of probability (see Equation 3.1;
    Jurafsky & Martin, 2020, pp. 30–31).


    ```

    P(W₁ₙ) = P(W₁)P(W₂ | W₁)P(W₃ | W₁:₂) K P(Wₙ | W₁ₙ₋₁)  (Equation 3.1)

    ```


    Table 3.1 shows an example of the computing probabilities of the entire sentence
    The cat is extraordinarily frustrating.'
