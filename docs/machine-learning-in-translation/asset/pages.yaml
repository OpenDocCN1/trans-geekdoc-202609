    be categorized and labeled to make the data more usable for machine learning or
    AI applications, such as annotating the verbal components of speech data (words)
    as well as non-verbal features like coughing and sneezing, a doorbell ringing,
    or a barking dog. Again, these tasks do not necessarily need to be performed by
    a bilingual or multilingual translator. Yet these translation-related activities
    can be planned in advance in order to make effective use of human and linguistic
    resources in the translation process.


    # 6.4.1.3 Web crawling techniques


    In website localization, web-crawling techniques can be used to extract translatable
    strings and analyze the linguistic features of the extracted text in order to
    prepare the source content for the next step. From a business perspective, it
    can help the translator estimate the word count and linguistic features such as
    keywords, which is often a basis for cost estimates. For example, tools such as
    InSite (Complete Website Word Counting with InSite, 2015) and WordCounter (Web
    Page Word Counter, n.d.) are convenient tools that provide such information. Other
    tools such as BootCaT (2018) can extract words into a plain text document to generate
    a corpus for discourse analysis and other follow-up activities that might be necessary
    in a continuous translation process.


    # 6.4.2 Preparing the translatable content


    The second step in a continuous translation process involves optimal preparation
    of translatable strings and tuning the inputs by analyzing the source text according
    to human cognitive processing features in an HT scenario. This step can also involve
    pre-processing content to meet MT specifications. In an ML-driven translation
    process, some typical pre-processing activities can also be automated.


    # 6.4.2.1 Domain detection


    Domain detection is usually conducted for various translation-related tasks. For
    example, a baseline NMT engine can be further customized and adapted to a particular
    domain. Each domain-specific MT engine can be further trained on corpora provided
    by a client, who may not have sufficient previous knowledge of the domain. The
    domain may also be labeled incorrectly. In this scenario, the ability to detect
    the domain can help determine which MT engine should be used for the datasets.
    By labeling the training data, a classifier can be trained how to predict possible
    domains. It is a classification task where the input is the source sentence and
    the target is the domain description. The state-of-the-art model for this type
    of'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'NLP tasks is normally as follows: (1) the input sentence is tokenized, (2)
    the tokens are passed into a transformer language model and represented as vectors,
    (3) the final vector representations are passed into a classifier, and (4) the
    classifier returns a list of probabilities associated with all possible labels.
    Humans, who manually tag data, train this type of domain detection modeling.


    NLP tasks that are similar to domain detection, such as topic modeling, can be
    based on ML algorithms that require less manual input than supervised algorithms.
    However, they require high-quality data in bucket loads. Bucketing (or binning)
    refers to the transformation of numeric features into categorical features, using
    a set of thresholds (Google Developers, n.d.-a). In this case, human judgment
    is also needed for data preparation and feature engineering.


    # 6.4.2.2 Automatic segmentation


    In translation, a larger chunk of information is usually segmented into smaller
    ones, as discussed in Chapter 2. In both HT and MT, sentences are usually the
    natural segmentation units. Conventionally, sentence segmentation can be produced
    in a CAT tool environment based on manual sentence boundaries like punctuation.
    However, this approach does not always work. For instance, in the case of speech
    translation, the sentence is not a well-defined unit. A speaker may leave a sentence
    incomplete, make long pauses, or speak for a long period without pausing (Matusov
    et al., 2005). If speech cannot be segmented into meaningful units like sentences,
    the speech cannot be properly translated into the target language.


    While a human transcriber of speech is usually able to use judgment to segment
    a raw transcription into meaningful units, this is not always a feasible approach.
    For example, in spoken machine translation, the pipeline usually includes two
    independent components: automatic speech recognition and machine translation.
    Within this pipeline, “ASR provides an error-prone, audio segmented stream of
    non-punctuated words”, whereas “the majority of MT training data consists of nonspeaking
    style bilingual text data with proper sentence segments and punctuation marks”
    (Paulik et al., 2008, n.p.). In this case, sentence segmentation of ASR output
    and punctuation recovery prior to translation play a major role in addressing
    the mismatch between ASR output and MT training data.


    While there are multiple segmentation tools and NLP packages for segmentation,
    what is relevant to the translator is the training and testing data. In order
    to train a machine learning-based sentence segmentation system, a set of ‘ground
    truth’, human-produced training examples is required. Human insights are also
    significant when sentence segmentation architecture is based on a decision tree
    that uses multiple features computed for each boundary (see Paulik et al., 2008).
    In translation practice, including both HT and MT, automatic segmentation can
    be an effective measure to improve productivity and ensure quality.'
  merge: -1
  img_proc: true
