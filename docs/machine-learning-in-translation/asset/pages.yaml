  md: '# Characteristics of the book


    This book aims to help practitioners find their added value in a field increasingly
    shaped by translation technology. It is about humans, in particular translators,
    linguists, and other stakeholders who are proud and passionate about making translation
    their career. To this end, the authors approach the topic of machine learning
    from a human perspective, with the goal of providing the most relevant knowledge,
    skills, and best practices on MLinTrans. The book covers not only ML knowledge
    and skills in translation but also other relevant aspects of the entire localization
    ecosystem, including ML applications for translation document analysis, language
    data management (translation memory, terminology, and other tools for analyzing
    corpora), and translation-related NLP tasks (speech recognition, speech synthesis,
    and optical character recognition).


    This book enables readers to draw on their previous translation and localization
    experience, in both theory and practice, and develop their own plan to implement
    ML frameworks and methodologies in their translation work. By identifying parallels
    between machine learning and translation, practitioners can draw on their knowledge
    and experience in translation theory and practice to understand the concept of
    ML and its application in translation processes.


    The book provides a new, independent perspective on ML implementation and its
    impact on existing localization processes for both students and practitioners.
    It focuses on the principles behind ML frameworks and technologies that are generally
    applicable in a localization workflow, rather than specific business cases. The
    holistic view of this book benefits readers broadly, as they can apply relevant
    content to their own business scenarios, learning, and research.


    In a practical sense, the book introduces key ML tasks in translation to expose
    readers to cutting-edge ML technologies and help them understand the benefits
    and challenges ML tools bring to translation processes. One of the greatest threats
    in the application of ML is the loss of balance between machine and human learning.
    In a ML-driven translation environment, a large amount of data is fed to the machine
    in order to train it, as this is how a ‘learning machine’ is created and developed.
    Under such circumstances, human interaction becomes only part of the ML environment,
    and the significance of human learning might be neglected if not intentionally
    planned.


    # Intended audience


    This book adopts an inclusive approach, with special attention to those downstream
    and with the aim of winning the support of those upstream in systems development.
    The authors hope that the human-centered approach will make it especially appealing
    to users of ML technologies in localization workflows, including translation/localization
    practitioners with different levels of experience and students in the humanities
    who are familiar with linguistic and translation theories and wish to use ML technologies
    in their studies and practice. This book enables'
