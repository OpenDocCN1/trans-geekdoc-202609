  img_proc: true
- pgno: 38
  md: 'vectors. Specifically, in natural language processing, entities can be represented
    by activities of simple, neuron-like computing elements in an artificial neural
    network.


    There are many representational schemes between a concept and its neuron(s), i.e.,
    entities and computer elements. The most straightforward one uses one computing
    element (neuron) for each entity. This is called a local (or localist) representation.
    It entails a belief that there is a one-to-one correspondence between entities
    and hardware units. This representational scheme is easy to understand and implement
    because the structure of the physical hardware network mirrors the structure of
    the knowledge it contains (Hinton et al., 1986, p. 77), or rather, the surface
    structure of human knowledge.


    In natural language processing, this one-to-one correspondence provides us with
    a gateway to start to understand language from what is tangible externally, from
    what we can see or hear in an actual piece of text or speech. By sampling real-life
    language occurrences and assembling a corpus, which is a large and principled
    collection of natural texts (Biber et al., 1998, p. 12), the researcher can observe
    specific linguistic forms at play. In terms of data type, textual data are categorical,
    rather than numerical, meaning they are discrete in nature, and arithmetic operations
    cannot be performed using these values. Just as with words on a piece of paper,
    each one is an entity unto itself – a separate kingdom – and mathematical operations
    using these linguistic forms is not possible.


    This means that a machine cannot interpret the categorical data directly. They
    must be converted to numbers. For example, in order to study the language behavior
    of a small corpus that consists of two sentences – He is a good learner. He gathers
    insights from a machine learner. – we can label each unique word, or word type
    (Smith, 2019), with one unique decimal number. All unique words make up a vocabulary.
    In this case, if we ignore punctuation and capitalization, the length of the vocabulary
    or the total number of word types is 9, as shown in the first column of Table
    1.1. In order to convert these word types to numbers, the simplest way is to assign
    a decimal number to each of them, as shown in the second column of Table 1.1.
    This is called label encoding (Chollet, 2017).


    | Categorical textual data Unique word | Categorical decimal numbers Label encoding
    | Numerical data in a binary string One-hot encoding |

    |---|---|---|

    | He | 1 | 100000000 |

    | Is | 2 | 010000000 |

    | A | 3 | 001000000 |

    | Good | 4 | 000100000 |

    | Learner | 5 | 000010000 |

    | Gathers | 6 | 000001000 |

    | Insights | 7 | 000000100 |

    | From | 8 | 000000010 |

    | Machine | 9 | 000000001 |'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'Label encoding is very straightforward, indicating a one-to-one correspondence
    between entities, i.e., word form and hardware processing units (neurons). However,
    the numeric values can be misinterpreted by algorithms that are embedded with
    a hierarchy or order in them. This ordering issue is addressed in another common
    alternative approach called “one-hot encoding” (Harris & Harris, 2012; Chollet,
    2017). This method is a binary representation of each word in a corpus, by which
    we use a vector of 9 bits to represent the unique words in our vocabulary, by
    simply making the 1st bit represent the word “He”, the second bit the word “is”,
    etc. (see column 3 in Table 1.1).


    However, this method has some disadvantages in terms of using computer elements
    to represent words:


    +   1 One-hot encoding is a vector, that is, a list of numbers, and the size of
    the vector can be extremely large as the size of vocabulary increases. For example,
    if the vocabulary size of a corpus is 10,000, each word’s numerical representation
    will be 10,000 digits.


    +   2 Data are very sparse as vectors containing mostly 0s and only one 1 (thus
    the name *one-hot*).


    +   3 These vectors do not have information on the relationships between words
    or meanings derived from these relationships. For example, we would not know how
    the word *he* (100000000) is related to *learner* (000010000) just by reading
    the one-hot coding.


    One-hot encoding treats words as discrete, atomic units, rather than continuous.
    This is easy to understand when we consider a type of language in which one word
    form – the signifier – corresponds to one computer element or neuron. Yet, when
    considering the meaning of each word – the signified – this method is limited
    in expressing complex connotations. Neither label nor one-hot encoding changes
    the data type by simply assigning a number, decimal, or binary. They are still
    categorical, as adding or subtracting these numbers makes no sense. They are not
    real numbers as shown in a vector space.


    Localist models are very inefficient whenever the correspondence between concepts
    – the signified, or meaning of a sign – and neurons is not one-to-one. In this
    case, the data have a componential structure. In our domain – language and translation
    – almost all data have componential structure: a word contains multiple sense
    components, like the word *father* includes the meaning of *parent* and *male*.


    Componentional analysis, also known as feature analysis or contrast analysis,
    is one of the cornerstones of semantics – the study of meaning (Leech, 1981; Love,
    1983). Lyons (1995, pp. 106–108) points out that componential analysis is one
    approach to lexical semantics. It involves the analysis of the component parts
    of a lexeme. It has a long history of philosophical discussion and has been employed
    extensively by linguists. An alternative term for componential analysis is lexical
    decomposition. Here is an often used example: The words *man*, *woman*, *boy*,
    and *girl* all denote human beings. We can therefore extract from the sense of
    each of'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'them the common factor *human*; that is, the sense of the English word *human*.
    Similarly, we can extract from *boy* and *man* the common factor *male*, and from
    *girl* and *woman* the common factor *female*. As for *man* and *woman*, they
    can be said to have as one of their factors the sense-component *adult*, in contrast
    with *boy* and *girl*, which contains the factor *non-adult*. The sense of each
    of the four words can thus be represented as the product of three factors:


    +   1 man = human x male x adult

    +   2 woman = human x female x adult

    +   3 boy = human x male x non-adult

    +   4 girl = human x female x non-adult


    Another type of representation is called distributed representation, in which
    each entity is represented by a pattern of activity distributed over many computing
    elements, and each computing element is involved in representing many different
    entities. That is to say, distributed representation entails a many-to-many relationship
    between two types of representation (such as concepts and neurons). Each concept
    is represented by many neurons, and each neuron participates in the representation
    of many concepts. Suppose you see a big, yellow, Volkswagen. You will want to
    use a neuron, or a memory or processing unit to store this information; you create
    a BYV neuron. This seems efficient but consider all the different entities that
    humans can create in real life; for example, the large quantity of different types
    of cars. A computer will need an infinite number of these simple processing units
    to store information. One way to reduce the number of neurons is to extract features
    from these concepts. For example, for the concepts yellow triangle and blue circle,
    we can use two types of feature neurons – color and shape neurons – to represent
    them, by activating all constituent elements at the same time in a conjunction
    (yellow and triangle; blue and circle). If we have 5 options for color and 5 options
    for shape, yellow triangle and blue circle are represented in a 5 x 5 matrix by
    “1”, as shown in Figure 1.2. This can also be done with the 23 possible combinations.
    If we further combine these conjunctions, say, we want to represent four entities
    at the same time (yellow triangle, blue circle, yellow circle and blue triangle)
    at the same time, the number of resulting entities will grow exponentially.


    ![](img/ec5cbdd0549c7a4e25c06fc472c12208_40_0.png)


    FIGURE 1.2 5 x 5 matrix'
  merge: -1
  img_proc: true
- pgno: 41
  md: "The strength of distributed representations does not lie in their notational\
    \ convenience or ease of implementation in a conventional computer, but rather\
    \ in the efficiency with which they make use of the processing abilities of networks\
    \ of simple, neuron-like computing elements. Specifically, important features\
    \ of distributed representations are (a) their essentially constructive character,\
    \ (b) their ability to generalize automatically to novel situations, and (c) their\
    \ tunability to changing environments (Hinton et al., 1986, pp. 77–87).\n\nThe\
    \ pattern of activities involved in distributed representations aligns with human\
    \ cognitive processing of language. People are very creative in their language\
    \ use. They create new words and new combinations of words every day. However,\
    \ no one could in effect store all these occurrences of language use in memory;\
    \ rather, humans extract linguistic (or micro-) features to harness the power\
    \ of human creativity. Grammatical categories (parts of speech, content words\
    \ vs. grammatical words, tense) are a type of “feature” that the human mind can\
    \ extract from a massive amount of language data. Take the sentence *I do not\
    \ like green eggs and ham* for example. We can reasonably imagine that for many\
    \ people, the word *like* contains multiple sub-concepts: it is a verb, a content\
    \ word, and in the present tense. If a neuron or processing unit in the human\
    \ brain is responsible for one sub-concept or micro-feature, the concept of ‘like’\
    \ is represented or processed by at least three elements or neurons. To some degree,\
    \ each neuron represents some attribution of a person’s understanding of the word\
    \ ‘like’. In other words, humans do extract features from raw language data.\n\
    \nInterestingly, when Lyons (1995) proposed the framework of componential analysis,\
    \ he emphasized that he had “deliberately used the multiplication-sign to emphasize\
    \ the fact that these are intended to be taken as mathematically precise equations,\
    \ to which the terms ‘product’ and ‘factor’ apply exactly as they do in, say,\
    \ 30 = 2 x 3 x 5” (p. 108). In this example, *man* (30) = *human* (2) x *male*\
    \ (3) x *adult* (5).³ He also attempted to use algebraic expressions in his componential\
    \ analysis and pointed out that\n\n> To say that the sense of a lexeme (or one\
    \ of its senses) is a compositional function of its sens-components is to imply\
    \ that its value is fully determined by (i) the value of the components and (ii)\
    \ the definition of the operations by means of which they are combined. To say\
    \ that the sense of a lexeme is a set-theoretic function of its sense-components\
    \ is to say that it is a compositional function of a particularly simple kind.\n\
    > \n> (Lyons, 1995, p. 112)\n\nLyons realized that a simple sum like *father*\
    \ = *parent* + *male* does not take account of the directionality of the relations\
    \ and thus is inadequate. It does not make explicit the fact that fatherhood is\
    \ a two-place (or two-term) relation or represent its directionality. He expanded\
