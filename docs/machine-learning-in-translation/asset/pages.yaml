  md: '# 7.2.2.2 Comparability of translation-driven corpora


    Zanettin (2012, 2013) stresses that corpora used in descriptive and applied translation
    studies usually involve the comparison of at least two main sets of data, which
    can be called corpus components or subcorpora (p. 26; p. 10). For instance, the
    British National Corpus (BNC) is often used as a reference for general British
    English, and parts of it have been used as a comparable component in some corpus-based
    translation studies (Zanettin, 2012, p. 46). By using a reference corpus in the
    comparison, linguistic and semantic features of translation-related texts – source
    and target – can be captured, which can provide insight into a translation process,
    for example, in terms of text domain and terminology.


    In practice, translators are frequently handling and comparing two types of text,
    e.g., source/target and translated/untranslated text. In effect, a parallel corpus
    is a special case of comparable corpus, where the comparison is based on content,
    which indicates the basic translation relationship of equivalence. For instance,
    one of the earliest parallel corpora was recorded on the Rosetta Stone, a stele
    inscribed with three versions of a decree issued in Memphis, Egypt, in 196 BC.
    It included Ancient Egyptian, using hieroglyphic and Demotic scripts, and Ancient
    Greek (see Rosetta Stone, 2022). It is an early example of how humans associate
    information by comparing and linking meaning expressed in different languages
    and scripts. In an ML-driven translation process, bilingual and multilingual parallel
    corpora are the main data resources for MT training, testing, and evaluation,
    in addition to being useful for human learning and translation processes.


    When comparing two or multiple subcorpora, certain parameters or measurements
    need to be applied to ensure the effectiveness of comparison. For instance, Zanettin
    (2012) points out that comparability between two subcorpora in different languages
    can be ensured through similarity of “sampling techniques” and “balance and representativeness,”
    or by employing the same procedures for generating content, such as using the
    same web crawling tools (e.g., BootCat) to harvest Internet texts (pp. 150–151).
    When comparing subcorpora, their scope and size can also be considered. The selection
    of specific parameters will be driven by the purpose of the comparison and the
    measurement techniques.


    # 7.2.3 Translation-driven language data


    The comparability feature of translation-driven corpora applies to language data
    in a continuous translation process. For example, in machine translation, the
    training data are parallel data in a database of aligned source and target segments.
    For MT domain adaptation and detection, domain specific data are used, which are
    derived from the comparison of topics or domains. MT results are compared with
    human translations to generate annotated data for automatic post-editing. In this
    sense, translation-driven language data are based on comparison.


    It is also possible to train an NMT engine on both human translation and synthetic
    parallel data (see Poncela et al., 2018). In their research, Poncela et al. (2018)
    point out that in many use cases, the amount of good-quality parallel data'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'produced by humans is insufficient to reach the translation standard required.
    In such cases, it has become the norm to resort to back-translating freely available
    monolingual data to create an additional synthetic parallel corpus for training
    an NMT model. In this case, monolingual source text data are translated with an
    existing MT system, and the MT output can be used with the original monolingual
    data to generate a training corpus for a new NMT system. The corpus can be used
    both as a separate standalone dataset, i.e., synthetic, and combined with human-generated
    parallel data, i.e., hybrid (authentic + synthetic) data. Poncelas et al. (2018)
    found that using back-translated data as a training corpus affects the performance
    of an NMT model: when adding back-translated data to a set of human-translated
    data, they found that translation performance initially improved, but then dropped
    as more synthetic data were added. However, when using synthetic data alone, astonishingly,
    the performance is quite good: it was roughly equivalent to the use of authentic
    data and in some instances even better. This example illustrates that sometimes
    training results are not always consistent with human intuition, as the concept
    of ‘quality of data’ depends on the user: human or machine. In some cases, what
    is considered good data for humans may not be useful for machines and vice versa.


    Thus we expand the concept of translation-driven corpora from translation studies
    and practice to a broader concept of translation-driven language data, which include
    all relevant data in a continuous translation process that are used for both humans
    and machines. In this context, translation-driven language data include: (1) corpora
    with human generated authentic text, (2) machine generated synthetic data, and
    (3) language data with a combination of both human generated and synthetic data.


    Now that the concept of translation-driven language data has been explained, we
    turn to the discussion of translator–computer interaction (TCI) through language
    data from three perspectives: (1) TCI in data design and acquisition, (2) TCI
    through data annotation, and (3) TCI through language data use.


    # ## 7.3 TCI in data design and acquisition


    # ### 7.3.1 Human insights in data design and acquisition


    Translator–computer interactions start before the data reach the computer. When
    translators prepare human-generated language data for ML-driven translation activities,
    they need to convert the data to a state that maximizes machine power to process
    it. This conversion and pre-processing of ‘raw’ language data implies that the
    translator can consider language data for both human and machine use. As Sambasivan
    et al. (2021) point out, language data are shaped through the practices of collecting,
    curating, and sensemaking, which means that language data can be considered inherently
    socio-political in nature (p. 2). Similarly, Pine and Liboiron (2015) emphasize
    that techniques of measurement used to produce data are “imbued with judgments
    and values that dictate what is counted and what is not, what is considered the
    best unit of measurement, and how different things are grouped together and ‘made’
    into a measurable entity” (p. 1).'
