- pgno: 21
  md: 'perspective, computers and their programs are merely tools for human beings
    – no more, no less – no matter whether they are a ''learning machine'' or not.


    We emphasize that machine learning and computer programs developed using ML technologies
    are tools for humans. We are interested in insights that machine learning can
    bring to humans and how people can leverage this tool by understanding its basic
    principles and developing a mindset facilitating its incorporation into conventional
    translation processes. ML provides a different perspective for a discussion on
    the nature of translation and has unique value in complementing human approaches
    to translation. For example, by processing large data sets and extracting patterns
    in a fraction of the time a human requires, ML can produce insights that would
    otherwise remain inaccessible.


    When Searle (1980) introduced the concept of intentionality in machines, he divided
    the topic into contrasting categories: those who program machines and those who
    use them, those who enter the input and those who interpret the output. Most translators
    and linguists are not programmers. They are involved in system deployment by sending
    in the input and interpreting the output. In the system development stage, they
    function as domain experts offering subject-matter expertise. This book takes
    an inclusive perspective, with special attention to those downstream, for whom
    knowledge of ML is instrumental in planning their translation education and career
    in this new age of AI. This objective can only be achieved with the support of
    those who work upstream. Their understanding of the problem of translation from
    a human perspective and attention to those who use these systems, entering input
    and interpreting output, will help balance ML and human learning in translation.


    Since ML was introduced, it has generated concern among translators and linguists,
    and there have been debates about whether ML technologies will replace humans.
    Indeed, the rise of neural language models (NLM) has increased speculation about
    whether ML will gradually take over some tasks that are conventionally done by
    humans. There are several questions to ask in this regard. Firstly, are these
    tasks really ideal for humans? Further, will there be other tasks – either already
    in existence or newly created – that will require humans? Making use of ML tools
    and leveraging their power is only the beginning. What is next? How can humans
    maximize their unique intentionality by customizing these tools? Are they aware
    of the weaknesses of these tools, and will they employ human intelligence to address
    them? Can they find the best scenarios to apply these tools and make wise decisions
    about the division of labor between humans and machines? Which tool best fits
    a given situation? In the age of ML AI, the combination of data and talent is
    the scarcest resource. To be more precise, it is human-touched data that makes
    the difference, as humans, not machines, create data. In the end, it is all about
    how humans materialize their thoughts with ML tools and the methodologies to meet
    specific human purposes. This new approach to thinking about ML is changing fundamentally
    how translators approach their task and the way translators plan and organize
    their activities.'
