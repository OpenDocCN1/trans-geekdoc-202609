    # FIGURE 2.3 The interior relationships within a text


    As shown in Figure 2.3, the sentence She likes green eggs has two basic relationships:
    the syntagmatic relationship between each word that recognizes the place and order
    of each word and “the paradigmatic relationship for terms or units which commute
    within systems set up to give values to the elements of structure” (Firth, 1957,
    p. 5). While the distribution of each element ($w_n$) can be observed (like words
    that we see), the value for each word $w_n$ is hidden, and we can’t observe it
    directly. Sahlgren (2008, p. 39) uses the concept of substitution to describe
    the paradigmatic relationship, which denotes that a hidden element is in the same
    category as an element that can be observed in the actual text sequence. The relationship
    implies that elements in the same category share some common syntactic and semantic
    features.


    The vocabulary options that can function in a particular position can be seen
    as instances with certain values that constitute language data. In human cognitive
    processes, these options might be conscious to a person. For example, when beginning
    adult learners of English produce likes in the second position $w_2$, they might
    struggle with other options such as adores or is fond of. A further abstraction
    behind these options are the values attached to them, which are semantic features$^4$
    that place them in the same category, such as a verb with the general meaning
    of feel affection for.


    In machine learning, a training corpus provides many vocabulary options through
    co-occurrence of elements. In the structure she . . . green eggs, there can'
