    The concept of linguistic relationships entails a comparison of a text against
    a reference. Generally speaking, the basis for an automated evaluation metric
    is a previously completed human translation, as the purpose of machine translation
    is to generate output that is understandable and readable by humans. By comparing
    the output of a machine translation engine against a human reference translation,
    it is feasible to measure factors such as linguistic quality, word order, and
    other textual features.


    Linguistic comparison turns out to be very applicable to the use of automated
    metrics for MT quality assessment. This approach turns a TQA problem into a linguistic
    analysis task: evaluating the nature of the relationships between the linguistic
    features of two sets of texts. As Miller and Beebe-Center (1956) pointed out in
    their pioneering work:


    > The excellence of a translation should be measured by the extent to which it
    preserves the exact meaning of the original. But so long as we have no accepted
    definition of meaning, much less of exact meaning, it is difficult to use such
    a measure. As a practical alternative, therefore, we must search for more modest,
    yet better defined, procedures. (p. 1973)


    They then propose comparing criteria in test translations using a variety of statistical
    indices. The simplest thing to try first is to ask if they use the same words
    (p. 76).


    The linguistic comparison approach in TQA is language independent. Even though
    the comparison is linguistic, comparing similarities of words in the reference
    translation and the MT result, the method of comparison is statistical: how many
    words or phrases are exactly the same, for instance, between a human translation
    and an MT result for the same source text? What is important is the statistic;
    the comparison provides an impression of the quality of the MT results without
    the need to understand the language(s). The statistical approach can be applied
    to any language pair.


    To some degree, linguistic comparison in MT evaluation emphasizes linguistic more
    than translational aspects, in the sense that the approach can be applied to natural
    language processing tasks beyond MT quality assessment. For example, Yeong et
    al. (2019) employ Bleualign, which uses BLEU scores as a similarity metric to
    match sentences in the alignment task.


    Most automated metrics are based on linguistic comparison and thus evaluative
    – when a framework is used to compare and find relationships, it usually involves
    a judgment as to which is better than the other. This might explain why the term
