    \ learners and learning, the role of an educator in a learner-centered setting\
    \ has evolved from mere delivery of content and control of the learning environment\
    \ to actively involving learners in creating their own learning. In particular,\
    \ the learning environment is a stimulating, dynamic, and interactive one with\
    \ both teachers and learners working together (see Tawalbeh et al., 2015; Kiraly,\
