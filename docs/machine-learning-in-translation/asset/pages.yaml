- pgno: 189
  md: '# 9.3.3.2 Linguistic competence


    This competence enables the translator to perform linguistic tasks in a continuous
    translation process. It includes both knowledge and skills in the source and target
    languages. A pertinent factor is whether the learner is monolingual or bilingual.
    In a holistic approach, at each step of a continuous translation process, language
    requirements differ. In particular, with the impact of ML, linguistic competence
    in a translation process has some new characteristics.


    +   (1) Handling small fragments in a translation-related task


    As to what tasks are suitable for humans, the length of the text must be taken
    into consideration. For example, an NLP technique for text classification or domain
    categorization can handle large amounts of documents in a fast and efficient manner.
    Yet, it is not very productive for machines to process small fragments of texts
    that do not have a clear pattern. In contrast, humans can be very flexible in
    handling fragmented information.


    One specific characteristic arising from the application of ML is that a translator,
    linguist, or other domain expert needs to ensure the consistency of fragmented
    information in a larger context. Take NMT for example. NMT is driven by its own
    rules, thus it can work out different translations for the same piece of information.
    For example, for the concept of ‘machine learning in translation’, the system
    may return multiple results such as Machine Learning in Translation, ML in translation,
    and MLinTrans, just like humans. Under such circumstances, humans must examine
    the result and ensure coherence in a larger context.


    +   (2) Evaluating, editing, and adding other human insights


    In the era of ML/AI, humans play an irreplaceable role in verifying results of
    ML techniques and ensuring the quality of the target text due to the fact that
    humans are the ultimate readers or audience of the ML results. In addition, if
    human translators take note of error patterns, they can further automate the review
    and correction process through regular expressions and other automatic discourse
    analysis tools to scale up their quality assurance efforts.


    +   (3) Coordinating between linguistic and non-linguistic elements


    In many cases, a translation-related ML system, e.g., an NMT engine, is not only
    based on one system but also integrates other systems such as visuals and sound.
    This in itself is a great challenge for artificial intelligence. In recent years,
    there have been studies addressing this challenge. For example, multimodal machine
    translation involves drawing information from more than one modality based on
    the assumption that the additional modalities will contain useful alternative
    views of the input data (Sulubacak et al., 2020). Sulubacak et al. (2020) list
    some prominent examples of multimodal translation tasks, e.g., image-guided translation
    (IGT),'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'video-guided translation (VGT), and spoken language translation (SLT), shown
    in contrast to unimodal translation tasks, such as text-based machine translation
    (MT) and speech-to-speech translation (S2S), as well as multimodal NLP tasks that
    do not involve translation, such as automatic speech recognition (ASR), image
    captioning (IC), and video description (VD). This is a new frontier for ML applications
    in the language industry, requiring human competence to coordinate among multiple
    tasks when using and training ML systems. As Stein et al. (2009) point out, humans
    are capable of Multisensory Integration, which describes a process by which information
    from different sensory systems is combined to influence perception, decisions,
    and overt behavior.


    # 9.3.3.3 NLP competence


    This competence refers to the knowledge, skills, and attitudes required for the
    translator (in the broad sense) working in an ML-driven localization process.
    It includes corpus linguistics, statistical analysis, and other NLP tasks such
    as using regular expressions (see Section 7.5.1.1 in Chapter 7). It is related
    to the linguistic competence we discussed in the previous section. However, it
    is more about language analytic and data annotation tasks, as we discussed in
    Section 9.2.5 regarding the roles of language analysts and annotators. It is mainly
    needed in translation analysis-related steps, i.e., analysis/pre-processing, memory
    match, and post-processing.


    With this competence, a translator or linguist is mainly handling language data,
    including authentic (i.e., corpus) and synthetic data (e.g., data generated by
    an MT engine). It includes: (1) data preparation, e.g., using NLP tools to crawl
    the website to create a corpus in the analysis/pre-processing step; (2) data annotation,
    which is a useful task for multiple steps, aiming to communicate additional human
    insights to ML systems; (3) data analytics, e.g., source text analysis and improvement
    in pre-processing, and automatic discourse analysis of the translation memory
    in post-processing; and (4) other NLP-related tasks, e.g., using regular expressions
    to search relevant content, which might be useful in all the steps when handling
    language data.


    # 9.3.3.4 Cultural competence


    Computer programs are good at observing linguistic behaviors and providing humans
    with useful insights. When we delegate some NLP tasks to machines, humans reduce
    their cognitive loads, which in turn enables them to focus on more creative or
    complex translation tasks, including cultural ones, as discussed in Section 9.2.3.
    Thus, it makes sense to place more emphasis on developing cultural competence
    in translators.


    There are many aspects of cultural competence in translator training, which has
    been discussed widely in the translation literature (e.g., Tomozeiu et al., 2016;
    Albir & Olalla-Soler, 2016; Albir, 2017; Asiri & Metwally, 2020). First, it'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'includes knowledge, skills, and attitudes about different symbol systems. When
    symbols are pertinent to translation tasks – be it a sound, a mark on paper, a
    painting, or a statue – translators need to be familiar with them to solve specific
    translation problems. Second, cultural competence entails that a translator is
    able to construct relevant contexts to interpret a message effectively. In real-life
    translation assignments, translators should be able to apply cognitive strategies
    to construct the most relevant possible internal representations of phenomena
    from the outside world, and to process them in a context that maximizes their
    relevance. Third, cultural competence means a translator is able to acquire and
    integrate pieces of knowledge, skills, and attitudes and organize them into systematic
    structures that reflect their relationships. Fourth, cultural competence means
    a translator is able to transfer. In most cases, there is an imbalance between
    knowledge structures for different systems or areas as they are learned or acquired
    in different settings and at different ages of a translator (Wang, 2019, pp. 286–287).
    It is a prerequisite for a person to transfer his existing knowledge and skills
    in his original or source culture or professional area to learn the meaning in
    another culture, as shown in the example of the multilingual language model in
    Section 8.2.2 of Chapter 8.


    # 9.4 Impact of machine learning on translator education


    # 9.4.1 The educator’s role in two approaches to learning environments


    We use the term ‘educator’ in a broad sense in this discussion, referring to a
    person who provides instruction or education. There are many job titles associated
    with this term, including teachers, trainers, and instructors.


    In Chapter 8, we discussed two types of learning environments which apply to both
    ML and HL: (1) bottom-up, learner-centered and (2) top-down, educator-guided environments.
    These two approaches differentiate two basic roles of educators: learning facilitator
    and knowledge transmission agent. Educators following the top-down approach design
    teaching materials to transfer knowledge and develop learners’ skills, e.g., the
    general and specific competences at each step of a continuous process. In the
    learner-centered approach, however, educators step down from a dominant role as
    the authority in the classroom to a role as a facilitator in the communication
    and learning process, generally by providing tasks that help learners find patterns
    on their own and giving feedback.


    In both types of learning environments, educators are advanced learners who have
    mastered the knowledge and skills that they pass to new learners either in educator-guided
    scenarios or learner-centered scenarios. The former is a traditional teaching
    environment and the latter is similar to a supervised machine learning environment,
    with educators organizing training data, i.e., the problems in the tasks as inputs
    and corrected answers to these problems as outputs.'
