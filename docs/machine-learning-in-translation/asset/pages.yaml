- pgno: 13
  md: '# # INTRODUCTION


    # ## Machine learning in translation – a new perspective


    Machine learning (ML) enables digital computer systems to automatically learn
    from a set of training data and make decisions based on the resulting model with
    a minimum level of human intervention. From a methodology perspective, machine
    learning is a form of statistical learning that uses computational algorithms
    to find patterns in empirical data, rather than symbolic rules developed through
    the analysis and intuitive reflection of humans. Neural machine translation (NMT)
    is driven by machine learning, which is applied to a neural network language model¹
    so as to predict what word comes next in a sequence of translated text. There
    are many more language tasks where ML can be leveraged in a translation process.


    In theory and practice, machine learning and translation do not have to be seen
    as separate undertakings. After all, there are clear links between human approaches
    to translation and a machine’s processing of data, which also result in representations
    of thought and reality. While human approaches to translation follow long-established
    methods of theorization, machine approaches, originating by the way in the minds
    of computer scientists and software developers, utilize computer programs to automate
    part of the translation process.


    Take an encoder-decoder ML architecture for example. In this model, machine learning
    converts a real-life translation task into a mathematical formula (encoding),
    and then after a series of arithmetic operations, it converts the mathematical
    formula into a translation solution (decoding). In this sense, ML can be considered
    at least a methodological and theoretical translation framework, although it may
    be premature to call it a paradigm equivalent to other translation theories such
    as equivalence, functionalism, descriptive translation studies (DTS), cultural
    or sociological ‘turns’ of translation studies, localization, or audiovisual translation
    theories, to name but several based primarily upon human analysis and reflection.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# 2 Introduction


    Let us use an analogy of a mirror to illustrate how different views come into
    play when perceiving translation. A mirror offers a perspective on reality, which
    from an objectivist viewpoint is a form of ‘truth’. However, each individual stands
    in a slightly different place when looking into a mirror (Christie, 1987, pp.
    53–54). If there exists a comprehensive ‘truth’ in translation, it would require
    the examination of the object of translation from different perspectives, allowing
    a ‘truth’ to be constructed through observation from multiple angles and stances.
    What individuals perceive in the mirror of ‘truth’ may vary, but all these reflections
    must have something in common, if they all – one might argue – are intended to
    represent some aspect of the same or at least a similar ‘truth’.


    This book introduces ML theories and technologies that are most relevant to translation
    processes by drawing parallels between these two areas. Following the analogy
    of a mirror offering multiple perspectives of the same object, we explore Machine
    Learning in Translation (MLinTrans) as a continuation of linguistic, communicative,
    and cognitive approaches to translation, rather than a separate discipline approached
    from the angle of computer programming and engineering. The following discussion
    is devoted to defining fundamental ML concepts and the scope of ML and translation
    for the purposes of this book.


    # Defining fundamental concepts


    Machine learning is closely related to artificial intelligence (AI) and natural
    language processing (NLP). Following the mirror analogy discussed earlier, these
    related fields can be seen from various angles, with each one providing unique
    value.


    # Artificial intelligence: laying the groundwork


    In the proposal for the Dartmouth Summer Research Project on Artificial Intelligence,
    McCarthy et al. (1955) coined the term itself and delineated the fundamental project
    task:


    > The study is to proceed on the basis of the conjecture that every aspect of
    learning or any other feature of intelligence, can in principle be so precisely
    described that a machine can be made to simulate it. An attempt will be made to
    find how to make machines use language, form abstractions and concepts, solve
    kinds of problems now reserved for humans, and improve themselves.


    In McCarthy’s (2007) terms, AI is “the science and engineering of making intelligent
    machines, especially intelligent computer programs” (p. 2). Until now, AI has
    been used as an umbrella term covering a broad field of science encompassing not
    only computer science but also psychology, philosophy, linguistics, and other'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'areas. Understandably, computer science is a reasonable starting point from
    which to approach AI. For example, Simon (1995) points out that “AI deals with
    some of the phenomena surrounding computers, hence is a part of computer science”
    (p. 95). However, computer scientists have not yet characterized in general what
    kinds of computational procedures can be called intelligent. Thus, definitions
    of intelligence typically depend on relating it to human intelligence (McCarthy,
    2007, pp. 2–3).


    Consequently, other areas of study contribute to the understanding of the concept
    of ‘intelligence’. Many scholars define intelligence by what it does; for example,
    Nilson (2009) stated that “intelligence is that quality that enables an entity
    to function appropriately and with foresight in its environment” (pp. xiii–xvi).


    Gardner (2003) incorporates cultural elements in his definition: “an intelligence
    is the ability to solve problems, or to create products, that are valued within
    one or more cultural settings” (p. xxviii). Some experiments were proposed to
    define the concept of intelligence from empirical, cognitive, and philosophical
    perspectives. For example, the Turing Test (Turing, 1950) posited that if a machine
    were perceived as human by a knowledgeable observer, then the machine could be
    considered intelligent. In the Chinese Room Argument, however, Searle (1980) argues
    that the Turing Test is inadequate. In this experiment, Searle imagines himself
    alone in a room following the steps of a computer program designed to provide
    responses to Chinese characters that are slipped under the door. Searle does not
    understand Chinese, and yet by following the computer program’s steps for manipulating
    Chinese symbols and numerals, based simply upon their shape, he sends appropriate
    strings of Chinese characters back out under the door. His responses lead those
    outside to mistakenly assume that there is a Chinese speaker in the room, even
    though Searle does not understand the meaning of any of the Chinese characters.
    This analogy implies that programming a digital computer to follow Chinese syntax
    may make the computer appear to understand the meaning or semantics of Chinese,
    even though that is not the case (Cole, 2020).


    The above definitions do not limit intelligence to humans. McCarthy (2007) stated
    that “varying kinds and degrees of intelligence occur in people, many animals
    and some machines” (p. 2). It follows that intelligence is not the only capacity
    that distinguishes humans from animals and machines, and intelligence does not
    account for every human mental activity. According to Martínez-Freire (1998),
    the mind is a collection of various classes of mental processes, and intelligence
    is only one of them. There are different approaches to describing relationships
    between the mind, intelligence, and spirit, depending on the field of study, scope
    of concept, and research purpose. No matter how advanced it may become, AI does
    not represent human capacity in its entirety.


    AI will have a significant impact on the development of humanity in the near future.
    There are ethical issues relating to fundamental questions, such as what we should
    do with AI systems, what AI systems themselves should do, what risks they involve,
    and how we can control them (Müller, 2020). Machine learning is situated in the
    context of AI and thus incorporates many aspects of AI, including its'
  merge: -1
  img_proc: true
- pgno: 16
  md: "# 4 Introduction\n\ninterdisciplinary nature, its intrinsic relationship with\
    \ humans, and related ethical considerations.\n\n# Natural language processing\
    \ and translation\n\nAn important and useful application area of AI is natural\
    \ language processing (NLP), which is a field of study that encompasses translation\
    \ and other linguistic tasks. According to Liddy (2001),\n\n> Natural Language\
    \ Processing is a theoretically motivated range of computational techniques for\
    \ analyzing and representing naturally occurring texts at one or more levels of\
    \ linguistic analysis for the purpose of achieving human-like language processing\
    \ for a range of tasks or applications.\n> \n> (p. 1)\n\nThis definition is a\
    \ good starting point for us to explore the essential aspects of NLP in translation\
    \ in a new context, two decades after it was created, which is summarized in the\
    \ following.\n\n+   1 In the early days of NLP research, ‘naturally occurring\
    \ texts’ are usually considered texts gathered from actual usage of human language(s),\
    \ rather than specifically constructed for the purpose of the analysis (see Liddy,\
    \ 2001, p. 1). However, the situation has become more complex after two decades\
    \ of development, as researchers and engineers have begun to manufacture or synthesize\
    \ language data, resulting in non-naturally occurring texts involved in NLP processes\
    \ such as machine translation (MT) engine training or other ML tasks. What remains\
    \ unchanged is the purpose of NLP, in that NLP techniques are applied to accomplish\
    \ ‘natural language’ tasks, rather than ‘artificial language’ tasks.\n\n+   2\
    \ NLP is deeply rooted in linguistics and the use of computer systems to simulate\
    \ the linguistic levels of analysis that humans usually apply. Liddy (2001) pointed\
    \ out that the notion of “levels of linguistic analysis” refers to the fact that\
    \ there are multiple types of language processing thought to be at work when humans\
    \ produce or comprehend language and that humans normally utilize all of these\
    \ levels since each construes different types of meaning (p. 1). While Liddy (2001)\
    \ seemed to aim for a comprehensive list of levels of language, this book intends\
    \ to start with the most relevant concept and the foundation of linguistic structure\
    \ in translation, which we discuss in Chapter 2.\n\n+   3 The goal of NLP as stated\
    \ in Liddy (2001)’s definition is “for the purpose of achieving human-like language\
    \ processing for a range of tasks or applications” (p. 1). In addition, the range\
    \ of computational techniques is “theoretically motivated” (p. 1). In this book,\
    \ we will further elaborate human purposes, or intentionality, when using NLP\
    \ techniques relevant to a translation process as a solution for real-life translation\
    \ problems, such as MT, automatic post-editing,"
  merge: -1
  img_proc: true
- pgno: 17
  md: 'and MT quality estimation, which a translator or other domain expert is more
    likely to guide and support than a computer scientist. From a philosophical perspective,
    machines do not possess intentionality, which is solely in the minds of humans.
    We discuss this further in Chapter 6.


    +   4 The word ''processing'' serves as a basis for sub fields of NLP such as
    natural language understanding (NLU), which refers to machine reading comprehension,
    and natural language generation (NLG), which can transform data into human words
    in communication. Though some frameworks consider NLU and NLG to be disciplines
    separate from NLP, this book considers them part of NLP, as only the purpose of
    processing natural language differentiates these tasks.


    NLP research can be traced back to the late 1940s. Since its inception, NLP has
    evolved from rule-based (symbolic) to machine-learning (statistical) approaches.
    Symbolic approaches perform deep analysis of linguistic phenomena and are based
    on explicit representation of facts about language through well-understood knowledge
    representation schemes and associated algorithms. The description of the levels
    of language analysis, such as words, phrases, sentences, and paragraphs, is given
    from a symbolic perspective. Another example is rule-based MT. This approach relies
    on human analysis of language, with human linguistic and world knowledge tapped
    directly in the language engineering process.


    In contrast to symbolic approaches, statistical approaches use observable data,
    usually in the form of large corpora, as the primary source of evidence. Roughly
    speaking, statistical NLP associates probabilities with the alternatives encountered
    in the course of analyzing an utterance or a text and accepts the most probable
    outcome as the correct one (Mitkov, 2003, p. xix). A typical model following this
    approach is statistical MT. The CANDIDE research project at IBM took a strictly
    non-linguistic, purely statistical approach to MT (Brown et al., 1990). The statistical
    approach to natural language processing includes both statistical analysis and
    inference methods, the latter being consistent with applied ML, as it generalizes
    the statistical analysis results from limited observations to the whole population.


    One particular statistical method is based on connectionism, which is a movement
    in cognitive science that attempts to explain intellectual abilities using artificial
    neural networks (also known as ''neural networks'' or ''neural nets'') (Buckner
    & Garson, 2019). An artificial neural network (ANN) is composed of a large number
    of very simple components wired together (Barrow, 1996, p. 135). The origin of
    connectionism is closely related to the collaboration between neurophysiologists
    and mathematicians/logicians. In 1943, Warren McCulloch (a neurophysiologist)
    and Walter Pitts (a logician) proposed the first mathematical model of a neural
    network, which is based on the physical assumptions of the ''all-or-none'' character
    of nervous activity (i.e., the activity of a neuron is either ''firing'' or inactive)
    and that a certain fixed number of synapses must be excited within the period
    of latent addition in order to excite a neuron at any time (McCulloch & Pitts,
    1943, pp. 115–133).'
