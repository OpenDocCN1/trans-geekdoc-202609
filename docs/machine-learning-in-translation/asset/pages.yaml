  img_proc: true
- pgno: 34
  md: 'Although a word''s relationship to nonlinguistic symbols is an important aspect
    of understanding, the language system in itself is a self-sustaining system, whose
    internal relationship endows a unique position to each sign. Suppose we convert
    the arbitrary language signs to numerical strings or numbers, and quantify the
    distance between each symbol in a collection of words to represent the relationship
    between these symbols. We would in effect simulate the language system in a mathematical
    way. While it may sound radical, it is not that difficult to understand if we
    observe how children learn to read or spell at an early age. Before the language
    signs start to make sense to them, children work hard to memorize the arbitrary
    signifiers and their internal relationships so that they can spell a word that
    provides a shared understanding in society. In theory, if the child were given
    numbers, rather than language signs, to learn the relations between them, they
    would be able to find meaning in a new set of numbers based on the pattern they
    had drawn on from the training samples. However, infants are exposed to of course
    the linguistic systems in their environment to begin their epistemological journey.


    Let us now examine the concept of translation. According to Jakobson (2021), any
    interpretation of meaning involves translation: “no linguistic specimen may be
    interpreted by the science of language without a translation of its signs into
    other signs of the same system or into signs of another system” (p. 157). Jakobson
    distinguishes three ways of interpreting a verbal sign: (1) intralingual (within
    one language, i.e., rewording or paraphrase), (2) interlingual (between two languages),
    and (3) intersemiotic (between sign systems) (p. 157).


    Among these three categories, this book will focus mainly on interlingual translation,
    including both spoken (interpreting) and written (translation), which involves
    equivalent messages in different language systems, aiming to achieve “[e] quivalence
    in difference” (Jakobson, 2021, p. 157). This goal, however, is not easy to achieve.
    Speakers of each language dissect nature and the universe in their own unique
    way. Hence the way different language systems are constructed is not the same,
    with each sign relating to other signs in its own particular way syntagmatically
    and paradigmatically. For example, the English word ride is related to such concepts
    as ride a horse, ride a bicycle, ride metro, or ride a bus. But if we use qi (骑),
    a sign in Chinese that seems to be an equivalent of ride, most Chinese speakers
    cannot understand why a person can qi (sit in) the metro or a bus, which their
    English-speaking counterparts have widely accepted. That is to say, in theory,
    no language system is exactly identical to any other, and thus no absolute equivalence
    can be found in interlingual translation.


    # 1.3 A mathematical approach – machine learning in language and translation


    Language is very unique compared with other human creations. Its meaning does
    not lie in its visual effect like a picture or a painting, although calligraphy
    and'
