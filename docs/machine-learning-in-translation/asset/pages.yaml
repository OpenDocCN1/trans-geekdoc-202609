  img_proc: true
- pgno: 23
  md: 'The rise of ML has not only triggered a gold rush in areas such as data mining
    and machine training, but also disrupted the balance between humans and machines
    in the language industry. While many translation tools have been human-guided,
    assisting practitioners in their translation projects, ML aims for a minimum level
    of human intervention. MT is like a black box for most practitioners in translation
    and localization processes, aside from MT engine suppliers. To integrate MT better
    into existing workflows, we need to build a relationship of trust between these
    practitioners and those developing computer programs and MT systems. To this end,
    transparency and fairness are crucial. By building ML knowledge and expertise,
    translation practitioners can plan their own learning and future activities, and
    part of their work will be assisting machines to learn.


    # About this book


    # Objectives of the book


    The book approaches Machine Learning in Translation (MLinTrans) from a human perspective
    and revisits the nature of translation with machine learning as a new dimension.
    It aims to address the challenges met by users of ML technologies, helping them
    develop their ML expertise. Rather than intimidating the uninitiated reader with
    technical concepts and formulae, the book aims to be accessible by focusing on
    the most relevant and applicable ML knowledge and skills that enable linguists,
    translators, and localizers to communicate with machines as well as other human
    actors, who vary in their ML knowledge, exposure, and attitudes.


    By empowering translation practitioners with relevant ML knowledge, they can be
    more effective when communicating with machines and other human actors in a ML-driven
    translation process. Most importantly, the book aims to support the professional
    development of translation practitioners so that they can fully utilize a ML-driven
    translation environment.


    This book also explores the implications of ML in traditional translator education.
    It proposes a fundamental equation for practitioners seeking to leverage ML: the
    human capacity to learn is augmented by that of machines. The digital revolution
    brought about a rapid increase in the electronic capturing and storage of human
    experience. When humans are accessing a much larger magnitude of information and
    resources, it is natural that they leverage ML to extract a more collective human
    perspective. On the one hand, human learning is augmented with data insights that
    computer programs can provide; on the other, potential risks arise due to automation
    processes that are less constrained by humans. Under such circumstances, the key
    to balancing opportunities and challenges is the human capacity to learn, to form
    dynamically internal models of the external world, and to adjust the parameters
    of their learning with the influx of ML applications. Human learning should be
    prioritized in this shared evolution of humans and machines.'
