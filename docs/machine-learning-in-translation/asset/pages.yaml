    There are two related models for computing continuous vector representations of
    words from very large data sets: continuous bag-of-words (CBOW) and continuous
    Skip-gram model architectures. The CBOW architecture predicts the current word
    based on the context, and the Skip-gram model predicts surrounding words given
    the current word. CBOW and Skip-gram models are shallow, two-layer neural networks
    that are trained to reconstruct linguistic contexts of words.


    # The word2vec tool


    takes a text corpus as input and produces the word vectors as output. It first
    constructs a vocabulary from the training text data and then learns vector representation
    of words. The resulting word vector file can be used as features in many natural
    language processing and machine learning applications.


    > (Word2vec, 2013, n.p.)


    Mikolov, Chen, et al. (2013) provide an example of word pair relationships using
    the Skip-gram model trained on 783 million words with 300 dimensionality.³ Their
    research result shows that word vectors can capture a range of syntactic and semantic
    regularities; for example, Paris – France + Italy = Rome, and Miami – Florida
    + Baltimore = Maryland (p. 10).


    Word2vec methods are fast, efficient to train, and easily available online with
    code and pre-trained embeddings. Word2vec embeddings (2022) are static embeddings,
    meaning that the method learns one fixed embedding for each word in the vocabulary.
    Other methods for learning dynamic contextual embeddings include the popular BERT
    (Bidirectional Encoder Representations from Transformers) and ELMO (Embeddings
    from Language Models) representations, in which the vectors for each word vary
    across contexts. The basic principles of word2vec underlie these more powerful
    dynamic or contextualized embeddings, which are beyond the scope of this book.


    # 3.4 Predicative LMs and translation


    Predicative LMs offer a new dimension of thinking about translation research and
    practice. First, converting inputs to numerical representation (or features) is
    the initial step to any ML algorithm in a given domain, and the most effective
    approach is to use neural language models such as word2vec. Many translation-related
    tasks, including machine translation, text summarization, and text generation,
    are handled by neural LMs. They allow us to draw inferences in the translation
    tasks.


    Second, as discussed in Section 3.2.5, the concept and methodology of embeddings
    offers a new framework to approach the meaning of a sign and how it is'
