  md: 'them provide a certain degree of personalization within a customized technological
    framework, such as allowing each user to enter segmentation rules (e.g., using
    punctuation to segment sentences) in CAT tools. The collective, virtual agent
    created by AI can help users complete tasks, like translation, and it can be customized.
    For example, an MT engine can be tailored with domain-specific data, which is
    usually done by an MT engineer or MT project manager, rather than a translator
    or post-editor. In this example, although the training data are domain specific,
    the data are collective linguistically and culturally, as the MT trainers are
    in many cases not directly involved in the data creation process and aim to capture
    data from all computing resources.


    There are potential issues of this type of customization in terms of balancing
    ML and HL, as these MT trainers do not necessarily learn from the data linguistically
    or culturally. In other words, the data are just for machine learning, and not
    intended for human learning. Customization also impacts translator–computer interaction
    (TCI). When an MT system improves its performance after each training, the result
    is less post-editing work for a human translator and thus fewer TCI opportunities
    for this type of content. However, knowledge and skills can only be acquired and
    reinforced through practice and repetition over time. Without sufficient engagement
    with the data in the TCI process, the translator cannot learn effectively. Simply
    feeding data to machines in a one-way process is insufficient. In this sense,
    collective customization benefits machine learning more than human learning.


    In contrast, if each user, in our case each translator, can train the ML technologies
    in the translator–computer interaction through activities such as translation,
    editing, and post-editing, the translator has the opportunity to work with the
    language data and thus not only trains the ML system effectively using linguistic
    and cultural expertise but also learns from the training process. The translator
    has access to and is able to manage all the language data used in the continuous
    translation process and can employ other ML learning technologies to learn from
    the data. Translator-driven customization also solves many data security problems.
    Strictly speaking, this type of customization is personalization.


    A personalized ML technology does not mean that the translator can only use data
    that the translator creates. On the contrary, the translator can use data from
    other resources, such as parallel corpora, translation memory from other translators,
    and web crawlers. However, the data selection is deeply rooted in personal preferences
    and specific uses of the tools. In addition, the translator has full control of
    the data before, during, and after the personalization process so that it can
    be used in multiple NLP tasks. For the translator, only a personalized ML system
    provides two-way translator–computer interaction. Setting up this direct relationship
    between translators and the ML systems they are using in the ML training process
    is crucial if translators are to be motivated to effectively train the model and
    improve their own learning outcomes.


    Personalized ML technologies means decentralization, i.e., the transfer of control
    and decision-making from a centralized entity to a distributed network.'
