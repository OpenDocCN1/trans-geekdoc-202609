    Krallinger et al. (2010, pp. 341–382) explore how biomedical text processing systems
    operate at different levels of granularity, using relevant processing features
    to detect special characteristics of natural language ranging from a basic level
    of characters and strings to complex relationships derived from multi-document
    collections. They point out that levels such as the character and strings level
    and sentence window level are more suitable for computer processing than human
    linguistic analysis.


    # 2.2.3 Chunking: a cognitive aspect behind levels of analysis


    The human ability to segment an utterance into multiple units at different levels
    is crucial for language comprehension and production. When reading a piece of
    text, humans consciously and subconsciously combine units of information – phrases,
    idioms, proper names, sentences, documents – through meaning to create conceptual
    chunks. To some degree, comprehension is related to competence in abstracting
    a collection of ideas. Conceptual chunks are mental leaps that unite separate
    bits of information that are bound together through meaning, and chunking information
    makes the mental work of the mind more efficient. Once a person chunks a concept,
    it is not necessary to remember the underlying details, as long as the main idea
    – the chunk – is captured. The new logical whole makes the chunk easier to remember
    and also makes it easier to fit the chunk into the larger picture (Oakley, 2014,
    pp. 54–57).


    Raw information is like puzzle pieces that sometimes do not make much sense individually.
    Merely memorizing a fact without understanding or context does not help a person
    grasp how the concept fits together with other relevant concepts. Chunking is
    like inserting the piece in the puzzle. It is the mental leap that helps a person
    understand the whole picture (see Oakley, 2014, p. 57).


    These cognitive activities can be traced in consecutive interpretation processing.
    Gillies (2013, p. 112) summarizes the basic interpreting skill set widely recognized
    in interpreting theory (Gile, 2009; Seleskovitch & Lederer, 1989), which includes
    active listening and analysis as a key component. In interpreting practice, an
    interpreter listens for underlying meaning, including the speaker’s main points
    and supporting details, structural transitions, and implicit meaning. Gillies
    points out that active listening and analysis is about focused listening and concentration
    throughout the entire speech, without missing a single word of what the speaker
    says or drifting off in the middle. Practicing the analysis of written and spoken
    texts'
