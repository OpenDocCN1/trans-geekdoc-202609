  md: 'speaking, there are two basic data use purposes: one is to augment human insights,

    the other is to facilitate computer analytics and machine learning.


    # 7.5.1 Corpus-based analysis from the translator''s perspective


    # 7.5.1.1 Finding patterns in corpora


    From the human translator''s perspective, the most relevant language data are
    naturally occurring text or speech in corpora. Given the huge volume of textual
    information, the translator usually needs to resort to discourse analysis tools
    to search for information and patterns hidden in the corpus. Concordancing software
    is designed for word and phrase search and can examine frequencies of words or
    collocations and find examples of certain words or structures. Discourse analysis
    tools can perform multiple tasks, such as generating wordlists, lists of lemmas,
    keywords, collocations and clusters, and word profiles (Zanettin, 2012, pp. 141–146).
    These tools augment human capabilities by processing large amounts of data that
    could not be processed without a computer program.


    In addition to out-of-box discourse analysis tools, in NLP, a fundamental tool
    for describing text patterns is regular expression, or regex for short. A regular
    expression is an algebraic notation used to characterize a set of strings. They
    are particularly useful for searching for patterns in texts and corpora. A regular
    expression search function will return all texts that match the pattern (Jurafsky
    & Martin, 2020, p. 3). For example, a regex in the form of “/[A-Z]/” performs
    a query to retrieve all upper case letters in the corpus; if a corpus contains
    only one sentence, e.g., He lives in the USA, the searching result will be H,
    USA. Concordancing tools are based on simple regular expressions. Some discourse
    analysis features are already embedded in traditional linguistic quality assurance
    tools, like Xbench, and CAT tools. For instance, users can perform concordance
    searches in the translation memory of most CAT tools, the result of which will
    gather all translation results that contain a specific sequence, either words
    or phrases. Some concordancers are standalone tools offering more advanced features
    of corpus analysis.


    # 7.5.1.2 Corpus-based linguistic analysis


    Corpus analysis tools are widely used in translation to observe linguistic patterns
    in translation-related corpora with the source and target texts. The translator
    can use regular expression to highlight specific linguistic elements with particular
    features in the target text, including checking the accuracy of the translation
    of numbers by using regex /[0–9]/. or verifying the translation of a polysemous
    word. Rowda (2017) offers an example of using regex to do a translation quality
    check: In order to find incorrect translations of the word case in eBay''s product
    descriptions, i.e., case meaning phone case rather than other options such as
    business case or suitcase, one needs to create a regular expression that finds
    the Spanish translation of caso in the'
