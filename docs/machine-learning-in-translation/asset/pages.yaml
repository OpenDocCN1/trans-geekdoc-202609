    # 7.4.2 Framework for human annotations


    Before the annotation activities are conducted, it is important to create an annotation
    framework that includes the categories or metadata of the dataset. The task of
    creating such a framework and specifically designing a set of metadata usually
    requires relevant linguistic and translation expertise. For example, to annotate
    grammatical features, a POS tagset must be standardized and used as a criterion
    to guide the annotation task.


    Translators'' domain expertise and relevant linguistic and cultural knowledge
    are crucial to accomplish this task. One approach is to use a Multidimensional
    Quality Metrics (MQM) framework that contains a description of translation error
    types and scoring criteria for the assessment of translation quality (Lommel et
    al., 2013). A translator can customize MQM error typology into an annotation schema
    with'
