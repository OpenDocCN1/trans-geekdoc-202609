  md: 'need to be developed, similar to the many quality evaluation metrics and quality
    assurance tools that are applied in machine translation.


    To sum up, the various steps of a continuous translation process form an ecosystem.
    The task of managing these ecosystems falls to the translator and, in particular,
    the localization project manager.


    # 6.5 Integration of NLP tasks


    We have discussed examples of intelligent NLP tasks at each step of a continuous
    translation process, including the translator’s interaction with the model while
    working with the language data. In practice, many more tasks can be created based
    on a user’s intent. The key is creating or selecting the most relevant tools and
    customizing them in a system, which includes finding the core technology and support
    tools required to meet a specific translation goal.


    These ML-driven NLP technologies are connected and interrelated. In order to optimize
    performance of the entire system, compatibility and connectivity among these technologies
    must be considered. In many cases, a feasible solution would be to start with
    a core technology while adjusting specifications of adjacent tools to maximize
    overall performance. This solution is driven by identifying one pivotal technology
    and multiple supporting technologies. For example, in a MT system, as discussed
    in Chapter 4, multiple components such as segmentation, terminology integration,
    and automatic text analysis function together with the MT engine as part of the
    whole system. But they can also be stand-alone tools with their own support technologies.
    For an MT-driven translation process, each step – pre-processing, memory check,
    and post-processing – must meet MT engine specifications to maximize the effectiveness
    of the entire system.


    In scenarios where the MT systems integrate CAT tool plugins, typically there
    are multiple options for the translator to make use of automation: (1) translation
    memory fuzzy matches that meet a threshold criterion set by the user, (2) the
    MT result for each sequence (e.g., the whole sentence or individual phrases in
    the sentence) as suggestions for the translator to choose from, and (3) other
    features such as predictive typing and fuzzy match repair that automate the translation
    process.


    For instance, Déjà Vu X3 Professional has a feature called DeepMiner, which extracts
    information from terminology and translation memory databases to create fuzzy
    match repairs. The machine replaces missing content with the correct term. When
    the missing content is not in the termbase, the software can perform statistical
    extraction from translation memory and deduct the translation of the missing content.
    For example, if the program sees a sentence _It is a cat_, but there is only a
    French translation (_C’est un chien_) in the translation memory, it can search
    the termbase to see if there is a translation of _cat_. If there is an entry for
    the translation of _cat_, the program can automatically replace the word _chien_
    with _chat_ and provide the translation _C’est un chat_. This is an example of
    a ML technology that, in addition to MT, is integrated into a CAT platform. With
    the rise of computer power,'
