- pgno: 159
  md: 'training and testing data. Specifically, the ML model learns from the training
    data, and it applies its learning and provides output from the testing data. From
    another perspective, training data influences the model whereas testing data does
    not. In this sense, data for functions such as tuning or fine-tuning belongs to
    the category of training data, as tuning is in essence part of the training process.


    In neural MT engine training, for example, parallel corpora are usually pre-processed
    before being used to train the model. Some typical data cleaning activities are
    removing misaligned sentence pairs, removing repetitions, and tokenization. It
    is worth noting that many pre-processing tasks can be automated and then post-edited
    by humans, rather than performed by humans from scratch, unless particular annotation
    tasks are designed to train a model. For example, computer programs can automatically
    calculate sentence similarity using word-to-word based, structure-based, and vector-based
    approaches (Farouk, 2019, p. 1), and in particular, Feng et al. (2022) find that
    “introducing a pre-trained multi-lingual language model dramatically reduces the
    amount of parallel training data required to achieve good performance by 80%”
    (p. 1). By means of multilingual language models, sentences can be represented
    across different languages as vectors in a single space, where semantically similar
    sentences should have similar representations. Based on the sentence embeddings
    in this space, computer programs can automatically remove sentence pairs not corresponding
    to translations.


    # 7.5.2.2 Using data to monitor and upgrade ML models


    Most models are able to capture only patterns that reflect the training data they
    have seen. When a ML model is put into use, it starts to interact with the real
    world through data, which are created or impacted by human behavior. As a matter
    of fact, models that are dependent on human behavior might be particularly prone
    to degradation. In this case, continuous model monitoring and learning are necessary.


    Again, it is through working with language data that the translator monitors the
    model and contributes to upgrading processes. An MT system can be trained by feeding
    it more translations (parallel corpora, translation memories, etc.) produced by
    translators, editors, or post editors after the translator produces them or simultaneously
    in an interactive MT scenario. Translators add value to the production and evaluation
    of the training and testing data in a continuous machine learning process, in
    particular in areas such as domain adaptation, terminology integration, and translation
    memory leverage.'
