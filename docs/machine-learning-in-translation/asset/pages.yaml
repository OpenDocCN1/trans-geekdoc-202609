  md: 'To summarize, in the above approach, a word can be represented as a sparse,
    long vector with dimensions corresponding to words in the corpus vocabulary or
    documents in a collection. In the next section, we will introduce a more powerful
    word representation: short dense vectors. Unlike the vectors produced by the PPMI
    model or the tf-idf model, these embeddings are short, with the number of dimensions
