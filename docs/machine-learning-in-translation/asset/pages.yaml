  md: '# TABLE 3.3 Co-occurrence vectors for four words in the UN corpus


    | | ... | biodiversity | sustainable | global | ... |

    |---|---|---|---|---|---|

    | conservation | ... | 4 | 8 | 0 | ... |

    | restoration | ... | 4 | 4 | 0 | ... |

    | development | ... | 1 | 16 | 3 | ... |

    | transboundary | ... | 1 | 0 | 0 | ... |


    given context in the training corpus. As shown in the table, there are 0 instances
    of *sustainable* and *transboundary* co-occur in the context in the training corpus,
    whereas 16 instances of the word *sustainable* co-occurring with the word *development*.
    This is not surprising, as intuitively *sustainable* co-occurs with *development*
    more often than with *transboundary*.


    Three of the dimensions, the three words in the row, are hand-picked for pedagogical
    purposes: *biodiversity*, *sustainable*, and *global*. These three dimensions
    of the vector for *conservation* – [4, 8, 0] – are the number of instances that
    *conservation* co-occurs in context with the three hand-picked words.


    This example indicates that there is a correlation between distributional similarity
    and meaning similarity. We can also see from Table 3.3 that the two words *conservation*
    and *restoration* are more similar to each other than they are to other target
    words like *development*, because *biodiversity* tends to occur more often in
    their window (4 times vs. 1 time).


    Figure 3.1 is a spatial visualization of word vectors for *development*, *transboundary*,
    *conservation*, and *restoration* in a three-dimensional space. From the figure,
    we can see the distance of the word *development* is farther than *transboundary*,
    *conservation*, and *restoration*, and the distance between *conservation* and
    *restoration* is much closer, as the meanings of these two words are very close.
    Though the training corpus includes only one document with roughly 2,000 words,
    it demonstrates some alignments between the model prediction and human intuitions.
    The accuracy of the model may improve when we increase vector dimensionality and
    the amount of the training data (Mikolov et al., 2013, pp. 6–7).


    In a real-life corpus, the vocabulary size is much larger than three hand-picked
    context words. A real vector would have vastly more dimensions and thus be much
    less dense, as many words may actually appear in the four-word context window
    to both the left and the right in the training corpus. The length of the vector
    is generally the size of the vocabulary, often between 10,000 and 50,000 words.
    Since most of these numbers are zero, the vector representations are sparse. This
    is a fundamental problem that makes language modeling and other ML challenges
    difficult to resolve. As Bengio et al. (2003) point out, “if one wants to model
    the joint distribution of 10 consecutive words in a natural language excerpt with
    a vocabulary of size 100,000, there are potentially 100000^10 – 1 = 10^50 – 1
    free parameters” (p. 1137). One way to solve this issue is to use the shared patterns
    of the words to describe them, through which the dimensions of the vector are
    greatly reduced.'
