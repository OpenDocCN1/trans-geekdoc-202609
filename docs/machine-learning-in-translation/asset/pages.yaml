  md: 'Since the denominator Pr (f) is independent of e, as the segment in French
    has been given and thus can be considered a constant, finding the estimate of
    the target sequence in English e, ê, is the same as finding e, so as to make the
    product Pr(e)Pr(f | e) as large as possible. This operation leads to the fundamental
    equation of machine translation, shown in equation 4.2:


    ê = Argmax_e Pr(e) Pr(f|e) (Equation 4.2)


    As Brown et al. (1993) state, equation 4.2


    > summarizes the three computational challenges presented by the practice of statistical
    translation: estimating the language model probability, Pr(e); estimating the
    translation model probability, Pr(f | e); and devising an effective and efficient
    suboptimal search for the English string that maximizes their product. These challenges
    are called the language modeling problem, the translation modeling problem, and
    the search problem. (p. 265)


    The application of noisy channels and Bayes'' theorem has in effect swapped the
    dependency relationship between the two events, f and e, i.e., the source language
    and target language, from Pr(e | f) on the left side to Pr(f | e) on the right
    side of Equation 4.1. That is to say, if we want to translate from a French string
    f to an English string e, which is based on probability Pr(e | f), we can convert
    it to a probability Pr(f | e) that operates in the reverse direction as well as
    a language model Pr(e). As Yee et al. (2019) point out, directly estimating the
    posterior probability Pr(e | f) cannot naturally take advantage of unpaired data
    (p. 5696). The way a noisy channel model incorporates the language model into
    its computation allows it to leverage the target language data, which is not paired
    with that of the source language. This transformation may appear unintuitive;
    however, it is done for very good reason, as it makes the operation relatively
    straightforward to implement in computation. In essence, it is more of an engineering
    achievement than a linguistic achievement, as the hope is that the MT system will
    work, even if it is not based on how humans actually do the translation. Starting
    with SMT, the inner workings of machine translation move away from the way humans
    translate in practice. The noisy channel model is used not only for MT, but also
    for text generation, text summarization, optical character recognition (OCR),
    and other NLP tasks.


