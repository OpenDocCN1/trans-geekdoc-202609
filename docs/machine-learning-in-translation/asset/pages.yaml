  md: 'in the target language at the granularity level. As humans handle both the
    input and output data, it must be presentable and make sense to humans. In this
    sense humans, not machines, determine the granularity level in NLP tasks.


    # 2.5 Two approaches to levels of analysis


    # 2.5.1 Sequences vs. meaning units


    Note that a sequence is not necessarily a meaningful language unit (e.g., phrase
    or sentence) in a person’s eyes. As discussed previously, meaning only exists
    in the human mind. The double structure of a sign entails there is no absolute
    overlapping between the signifier (form) and the signified (meaning). Consequently,
    a person has to compromise between form and meaning when using language to express
    ideas. This phenomenon is more obvious in translation. Usually the same meaning
    or concept in the source language can be expressed in various forms in the target
    language. An appropriate form can be selected based on the specific context, although
    that form may not be the preferred choice for everyone or for every situation.
    Likewise, if the form is prioritized, the emphasis on meaning could be undermined
    to some degree. A typical example is puns. When a person is asked to translate
    a restaurant’s name “eggcellent,” if there is restriction on the form in that
    the translation has to be one word, the meaning (“egg + excellent”) might be compromised
    if the target language does not have similar linguistic resources to render the
    meaning. If meaning is prioritized, the translator might need to turn one word
    into multiple words in the target language, in which case the meaning of the pun
    may be compromised. If there is an absolute truth about translation solutions,
    it would be that the preferences underlying such choices are subjective and vary
    from person to person.


    While the term ‘sentence’ conveys a meaningful unit based on human intuition,
    a ‘sequence’ is a concept that applies more to computer programming in that its
    connotations are more mathematical than linguistic. The term implies that there
    is a unique timestamp associated with each word; that is, at a certain moment,
    a person can only utter one word ($w_n$), and the next word has to follow the
    previous one. Sequence therefore describes an ordered combination of tokens. It
    can operate at various levels of granularity, which can be roughly defined by
    length, whereby the number assigned to $n$ in an $n$-gram pattern is an important
    indicator of length. In other words, the concept of ‘sequence’ is flexible and
    can include all types of meaning units at various linguistic levels, controlled
    by the form, or the number of word tokens in the sequence.


    # 2.5.2 Other aspects of comparison


    In most NLP processing, punctuation is removed. In translation, however, punctuation
    is one of the most effective tools for humans to segment a piece of text and analyze
    discourse. As Newmark (1988) points out,'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'Punctuation is an essential aspect of discourse analysis, since it gives a
    semantic indication of the relationship between sentences and clauses, which may
    vary according to languages: e.g. French suspension points indicate a pause, where
    in English they indicate the omission of a passage; exclamation marks in German
    are used for drawing attention, for emotive effects and emphasis, for titles of
    notices (but no longer for ‘Dear Mary’, in letters) and may be doubled; semi-colons
    indicate cohesion between sentences; French tends to use commas as conjunctions.
    (p. 58)


    Similarly, concepts such as terms, phrases, clauses, sentences, and paragraphs
    are also designed for the logic of human thinking. To some degree, a human linguistic
    analysis framework is a social product, which is a learned approach to grouping
    bits of information to create a new logical whole, as with chunking. It is shared
    by a group of people with the same or similar cultural features, meaning that
    there are differences among various groups regarding forms of linguistic levels,
    like the punctuation systems discussed by Newmark (1988).


    # 2.5.3 Implications for a translator


    Translators should be aware of these characteristics so that they can make decisions
    as to what tasks are suitable for machines to accomplish and what tasks are appropriate
    for humans. There is no doubt that a computer program works differently from how
    a human processes textual information. That is the reason both are needed. By
    understanding the strengths and weaknesses of each approach, human users are able
    to better interact with and make use of the power of the machine.


    These two approaches to levels of analysis do not and should not exclude each
    other. The architecture of levels of granularity incorporates both computer-specific
    (character and string levels, sentence window level) and human-oriented concepts
    (sentences, paragraphs, and passages). In doing so, the architecture can engage
    users on the levels they can easily process and leverage computing power for the
    others. For example, the architecture can create sentence segmentation rules using
    punctuation at the sentence level and apply tokenization at the character and
    string level to automate follow-up data processing such as POS tagging and parsing.
    Although there is no NLP processing that is completely unaffected by human intuition,
    when humans start using NLP tools, they are often impacted by this new approach
    to language and translation, which differs from familiar human approaches based
    upon intuition and social perception. By understanding this new approach, humans
    can also re-examine their existing personal theories of language and translation
    and possibly gain a deeper understanding in these areas.


