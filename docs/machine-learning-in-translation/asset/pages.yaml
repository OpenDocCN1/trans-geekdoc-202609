  md: 'J2450 (Vehicle E System Diagnostic Standards Committee, 2016) was issued in
    2001, revised in 2005, and stabilized in 2016. It was developed initially as a
    translation quality metric for use in the automotive industry and then became
    widely used in other domains. The metric allows an evaluator to tag errors in
    a translation and compute a weighted, numeric score that represents the quality
    of the translation. The metric in the 2005 revised version consists of four parts:
    seven error categories, two sub-categories, two meta-rules to help resolve ambiguities
    on the assignment of an error to the categories and subcategories, and numeric
    weights. The error types are applicable to both human and machine translation.


    Compared with SAE J2450, Multidimensional Quality Metrics (MQM) aims to provide
    a comprehensive framework for users to customize and develop their translation
    quality assessment (TQA) metrics in terms of error typology. By mapping their
    existing TQA frameworks (e.g., SAE J2450) with MQM, users can apply the same hierarchy
    of error categories in MQM across projects or in different studies and make meaningful
    comparisons. MQM is customizable to the user’s needs, meaning the user can choose
    the specific error categories in the framework that are most relevant when evaluating
    the text (Mariana et al., 2015, p. 137).


    In addition to evaluating the quality of the target text, evaluation can also
    be performed based on translation processes, as well as requirements for language
    service providers (LSPs) and translation projects. For example, ISO (International
    Organization for Standardization) 17100:2015 “specifies requirements for all aspects
    of the translation process directly affecting the quality and delivery of translation
    services” (ISO, 2015). This standard also provides a guideline for LSPs “concerning
    the management of core processes, minimum qualification requirements, the availability
    and management of resources, and other actions necessary for the delivery of a
    quality translation service” (ISO, 2015). ISO/TS 11669: 2012 (E) provides guidance
    concerning best practices for all phases of a translation project (ISO, 2012).


    Quality assessment for machine translation has some unique features compared with
    traditional TQA. Human direct assessment (DA) or error annotation does not work
    for the massive volume of text that MT can produce. In addition, human evaluation
    of modern high-quality machine translation systems is challenging due to the large
    volume of MT results and subjectivity of human judgment, and there is increasing
    evidence that inadequate evaluation procedures can lead to erroneous conclusions.
    One solution is to automate the assessment process, and a widely used framework
    for process automation is Bilingual Evaluation Understudy (BLEU) and Translation
    Edit Rate (TER)1 (see Section 5.4). Research findings show that automated metrics
    based on machine learning, e.g., pre-trained embeddings, can outperform human
    crowdsourcing evaluation results (Freitag et al., 2021, p. 1).


    As Castilho et al. (2018) point out, there is a lack of standardization in TQA
    at the macro and micro level across theoretical, educational, and industry contexts,
    which yields inconsistency in human TQA procedures, and “there is considerable
    variation in the correlations between human and machine TQA” (pp. 30–33). For
    example, automatic metrics have occasionally been shown to be inconsistent with'
