    # 9.3 Translator competences arising from machine learning


    # 9.3.1 Primary competences in a continuous translation process


    There is a broad discussion of translator competences in the literature (e.g.,
    Albir, 2010, 2017). As Baartman and Ruijin (2011) state, competence “is generally
    defined as consisting of integrated components of knowledge, skills, and attitudes
