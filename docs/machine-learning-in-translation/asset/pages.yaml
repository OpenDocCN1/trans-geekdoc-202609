  md: 'communicative and cultural aspects of the translation, taking subtle connotations
    and nuances into account, including mood, feeling, and emotion. The delegation
    of such high volume, routine tasks to machines allows human translators to focus
    on their strengths.


    # 9.2.4 The need for human-computer collaboration


    Admittedly, computer scientists and linguists have not always agreed with each
    other, particularly at the early stage of ML development and implementation. As
    Jelinek famously stated: “Every time I fire a linguist, the performance of the
    speech recognizer goes up” (Hirschberg, 1998). At the same time, there is resistance
    from linguists and translators who are concerned that computer programs will replace
    them permanently.


    This division creates social and cultural challenges that impact translator education.
    In Algorithms of Oppression: How Search Engines Reinforce Racism, Noble (2018)
    describes the consequences of indifferent attitudes between these two camps. She
    points out that data discrimination exists in search engines, leading to a biased
    set of search algorithms that privilege whiteness and discriminate against people
    of color, specifically women of color. The call for human–computer interaction
    (HCI) or, rather, collaboration among those who work on both the human and machine
    sides to address similar issues, has grown in urgency and raises new requirements
    for translator education.


    # 9.2.5 The evolving role of translators driven by ML


    Due to the implementation of ML, the translator’s role is evolving, and new and
    different tasks are emerging, with a tendency to shift from translation proper
    to translation-related linguistic tasks. One way to categorize these tasks is
    to cluster tasks around each step of a continuous translation process, including
    creating, analyzing, and editing source content for translation; estimating human
    efforts in MT; evaluating and ensuring translation quality; curating, managing,
    and maintaining the language data; and adapting the target content to the new
    culture. We will further discuss these tasks in Section 9.3.1 when summarizing
    competencies needed at each step of the continuous translation process. These
    developments lead to a finer division of labor and new aspects for some traditional
    roles. For instance, the implementation of NMT raises the requirements for human
    translators. Translators who can refine MT results constructively add value to
    the editing process, and other translators may be diverted to other types of NLP
    tasks, including linguistic analysis in the preprocessing phase (e.g., source
    text analysis and edits), data compilation and management of parallel corpora
    and source-text oriented comparable corpora, and postprocessing (e.g., MT postedits
    annotation and analysis). Reacting to these developments, many companies in the
    language industry have already strengthened training processes and the application
    of other NLP tasks, in addition to continuing conventional manual translation
    and MT post-editing tasks.'
