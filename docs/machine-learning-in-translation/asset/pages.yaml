    # 4.4 MT deployment in the localization process


    # 4.4.1 MT deployment infrastructure


    When deploying an MT system, a technical architect typically considers the whole
    deployment infrastructure. For example, the Tilde MT infrastructure design includes
    the client, interface, logical, and data layers (Pinnis et al., 2018, p. 1345).
    However, for linguists, professional translators, and other domain experts, what
    is most relevant is deployment: how the user interacts with the MT system. In
    the Tilde MT system, this involves the client and interface layers. The following
    are popular scenarios for MT deployment:


    +   1 Integrating the MT systems through CAT tool plugins. An MT platform needs
    to provide integration capabilities for at least the most popular CAT tools so
    that the tools can access the MT system.


    +   2 Performing translation of text snippets, documents of various popular formats,
    and websites directly in the graphical user interface.


    +   3 Using an MT widget that can be integrated in a website or mobile applications,
    e.g., Google’s Website Translator widget.⁵


    +   4 Integrating the MT external API (application programming interface) in users’
    translation and multilingual content creation workflow.


    Among these deployment scenarios, integrating MT in CAT tools is an efficient
    way to ensure the quality of output because it leverages both the automatic translation
    results and human evaluation and editing. In this case, human interaction takes
    place during the process of translation, and the unit of translation can vary.
    For example, in Lilt, an interactive MT platform, users (professional translators)
    interact at the phrase level. In contrast, most CAT tools with MT plugins allow
    users to edit at the sentence level, although other ML-driven features such as
    predictive typing are embedded in the platform.


    When using other scenarios, MT quality evaluation is crucial, because contaminated
    indexed content will cause a downward spiral in the quality of the database. When
    users propagate machine translation with no human improvement and the content
    is included in the pool of material used to train the MT engine, the system will
    be polluted with inaccurate translation, causing a decline in the performance
    of the system, especially a neural MT system. If this problem is to be avoided,
    human intervention is a necessity. The intervention goes beyond the translation
    process in the strict sense and takes place before or after machine translation,
    for example in MT post-editing (MTPE).'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'One major consideration in MT deployment is how users can best leverage their
    proprietary linguistic assets to improve the performance of the baseline MT system.
    Terminology integration and translation memory–MT integration are crucial (see
    Bulte & Tezcan, 2019). At the user and interface layers, it is important that
    an MT platform allow users to store linguistic resources for their work, such
    as parallel and monolingual corpora and multilingual term collections. The connectivity
    between CAT tools and MT systems is typically through API.


    Below the client and interface layers, usually there is a logic layer that offers
    features such as authentication and authorization when exchanging data. These
    features can validate a user’s identity and grant that user permission to access
    linguistic resources. Furthermore, in order to provide MT services to clients
    with security concerns or clients whose data are not allowed to leave the client
    infrastructure, the MT system can be deployed as an enterprise solution in the
    client infrastructure.


    # 4.4.2 MT deployment considerations


    When deploying MT systems, there are many factors to be taken into consideration,
    including MT paradigms, communication modes (spoken vs. written translation),
    the deployment environment (cloud-based or local server), and hardware requirements.
    Some key considerations in MT deployment are described here:


    +   1 Language pairs

    +   Some low resource languages such as Arabic and African languages do not have
    sufficient parallel data, and the language resources are imbalanced. Language
    pairs with Arabic, for example, have their own features and pose specific challenges
    for MT. Banita et al. (2018) point out that SMT performed very well when the translation
    was between the Palestinian and the Syrian dialects, due to the close linguistic
    proximity of these two versions of Arabic (p. 3). Another solution for low-resource
    languages is to use a trained multilingual NMT system that can automatically translate
    between unseen pairs without any direct supervision. In this solution, a model
    trained for instance on English/French and Spanish/English is able to directly
    translate from Spanish to French. Such an emergent property of a multilingual
    system is called zero-shot translation (Gu et al., 2019, p. 1259).


    +   2 Content types

    +   An MT solution is closely related to content type. For example, at eBay, MT
    is used mainly on the following content: search queries, item titles and descriptions,
    product reviews, product descriptions, and member-to-member communication (Rowda,
    2016). These content types vary greatly in their linguistic and stylistic features.
    For example, as Rowda (2016) notes, queries are hard to translate because, among
    other things, there is no context. To achieve the best MT performance for different
    content types, both the MT engines and MT-driven translation workflow need to
    be customized. On the one hand, if the content type is creative/marketing materials,
    using CAT with MT plugins or'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'interactive MT is often chosen. On the other hand, if the content is limited
    to a specific domain, such as weather forecasting, a rule-based MT might work
    well.


    # 3 Sequence length


    The sequence length of the source text impacts the performance of MT engines.
    Sánchez (2018) compares SMT and NMT output in a case study of MT quality at eBay.
    In terms of adequacy – whether the translation corresponds to the source text
    – both SMT and NMT decline with longer segments, whereby short segments include
    2–4 words, medium segments 6–12 words, and long segments 12–35 words. However,
    NMT is better even with shorter segments. In terms of fluency – whether the translation
    reads well in the target language – SMT and NMT adequacy declines with longer
    segments, although once again NMT performs better overall.


    # 4 Communication types


    There are different technologies for spoken MT, which usually incorporates more
    ML features. For example, the Microsoft Translator''s architecture for spoken
    MT includes speech recognition and TrueText normalization steps, with the former
    converting speech audio into text and the latter normalizing the text in order
    to make it more appropriate for translation. TrueText removes speech disfluencies
    (filler words such as ‘um’ and ‘ah’), stutters, and repetitions. The text is also
    made more readable and translatable by adding sentence breaks, proper punctuation,
    and capitalization. After the converted text is translated using NMT specially
    developed for real-life spoken conversations, the text is converted to speech
    again; thus, text-to-speech technology is involved as well (Microsoft Translator,
    2018). In this sense, spoken MT is like an accumulative MT, with many pieces of
    ML technology surrounding the main MT engine.


    # 5 User inputs


    Human reactions to different MT paradigms are different. For example, Daems and
    Macken (2019) find that without knowing whether an MT suggestion came from an
    SMT or NMT system, translators seem to prefer NMT output (or no MT output) as
    a starting point for their translations (p. 128). Moreover, characteristics of
    error types for each MT paradigm also affect a translator''s reaction when using
    MT. Le and Schuster (2016) argued that the quality of NMT is higher than that
    of SMT. However, as Castilho et al. (2017) point out, the NMT output was rated
    as more fluent than the SMT output for all language pairs, but the accuracy results
    were less consistent; depending on the language pair, the NMT output contained
    more omission, addition, and mistranslation errors (pp. 116–117). In an MT post-editing
    process, it may take a translator different levels of effort to correct each error
    type depending on factors such as the translator''s preferences and linguistic/cultural
    proficiency level. Thus, when deploying MT systems, user input is needed to select
    a solution'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'that effectively uses MT and relevant human resources, as well as post-editing
    strategies such as the design of an error typology scheme.


    # 4.5 MT as an instantiation of the process of human translation (HT)


    Fundamentally, MT aims to solve a human problem, i.e., translating from one language
    to another. It starts with inputs generated by humans, including the source text,
    training data, and segmentation rules, and ends with outputs that are presentable
    to humans. To achieve this purpose, MT can learn from the human approach to translation
    and become an instantiation of HT processes with its own characteristics. Figure
    4.5 offers a framework for the MT translation process and how it parallels the
    human translation process: (1) extracting the source content; (2) pre-processing
    the content to include analyzing the document structure, segmentation, domain/topic
    identification; (3) checking the translation database to make use of legacy linguistic
    assets; (4) employing machine translation; and (5) finally output desktop publishing.
    From a theoretical perspective, the framework for the MT process parallels how
    humans process the source text: separating text from non-translatable content,
    conducting pre-translation analysis such as text purpose and segmentation, checking
    memory, deciding whether to use or re-translate what has been translated before,
    and finally translating and producing the target text.


    Newmark (1988) describes the process of translation in four levels: (1) at the
    SL text level, analyzing the source text from a translator''s point of view; (2)
    at the referential level, progressively visualizing and building up the level
    of objects and events, real or imaginary, to comprehend the source text and produce
    the target text; (3) at the cohesive level, tracing the train of thought, the
    feeling, tone, and various presuppositions of the SL text, in a more general and
    grammatical manner; and (4) at the level of naturalness, making sure the target
    language is appropriate to the writer or the speaker in a certain situation (pp.
    11–19). Newmark (1988) discusses the importance of resources such as monolingual
    and bilingual dictionaries and thesauri (pp. 175–176). Of course, translators
    also check their memory of past translations at the term and sentence levels and
    utilize glossaries and other personal resources.


    What Newmark summarizes is based mainly on translation practice, and it applies
    to an MT-driven translation process as well. It includes the human analysis/ MT
    pre-processing stage, analyzing the document structure to conduct tasks, such
    as extracting translatable strings from formatting, segmentation/chunking, identifying
    the domain/topic of the source text, and referring to resources/memory check (TM
    check). The naturalness level is in effect checking the language model to verify
    the quality, which aligns with the language model in SMT.


    The MT framework is an effective way to collect, curate, and manage linguistic
    assets, including human-annotated language data that is generated from MT post-editing,
    translation, segmentation, and other human-machine interaction'
