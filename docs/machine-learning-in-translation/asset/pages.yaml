  md: '# # 5

    MACHINE TRANSLATION QUALITY ASSESSMENT AND QUALITY ESTIMATION


    # ## KEY CONCEPTS


    +   - Using humans alone to assess quality tends to slow down the entire MT process.
    Therefore, the whole or part of the assessment of MT must be automated to keep
    up with the speed and efficiency of MT translation.


    +   - In terms of MT quality assessment, two important distinctions are (1) whether
    the assessment is automated and (2) whether the assessment includes editing activities
    that not only evaluate the MT results but also improve quality through direct
    human intervention.


    +   - There are two types of assessment that depend on whether a reference translation
    is available: (1) automatic metrics such as BLEU and (h)TER, and (2) quality estimation
    (QE).


    # ## 5.1 Introduction


    How to assess quality is one of the most intriguing questions asked in connection
    with translation. This question cannot be answered simply because any statement
    about the quality of a translation implies a conceptualization of the goal and
    purpose of the translation; it presupposes a theory of translation (House, 2014,
    p. 241). In practice, translations are assessed under differing circumstances:
    “during translator training, in examinations for official certification, by critics
    and reviewers, and by the ordinary reader,” which consequently allows assessment
    methods to be developed by actors in different roles, including scholars, teachers,
    users, and practitioners in the translation industry (Williams & Chesterman, 2002,
    p. 8).


    In translation practice, many standards have been developed with specific focuses
    and applied in different contexts. For example, the Surface Vehicle Standard (SAE)'
  merge: -1
