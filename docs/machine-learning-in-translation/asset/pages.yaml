    technique can generate a prediction model with good predictive accuracy. Generally
    speaking, the bigger the sample size and the higher its quality, the more representative
    of the population the sample will be, facilitating a higher level of accuracy
    of the statistical inference model.


    A neural network language model is fundamentally a statistical learning machine.
    As discussed in Chapter 3, input and output data are fed to the neural network
    to develop machine learning patterns, which can be used to generate data that
    the system has never seen before.


    # 8.2.2 A mental multilingual language model


    As Dehaene (2020) states, learning can be described as forming a mental model
    and adjusting the parameters of the model (p. 5). This definition applies to both
    HL and ML and assumes there is a mental model in the human brain or a mathematical
    model in a computer system to estimate dependency and draw inferences about the
    population based on available observations. A mathematical model used in machine
    learning is described earlier. In terms of language comprehension and production,
    for the human mental model, it is reasonable to theorize that translators, speakers,
    and writers rely on their internal language models to make inferences. This is
    akin to a ‘learning machine’ in a person’s mind, in which language models are
    a special mechanism whose architecture can accommodate multiple languages. We
    can refer to these mechanisms as mental multilingual language models.


    There is a vast literature on language acquisition in terms of human language
    learning mechanisms. In a well-known example, Krashen (1987) proposes five main
    hypotheses: the acquisition-learning distinction, the natural order hypothesis,
    the monitor hypothesis, the input hypothesis, and the affective filter hypothesis
    (pp. 9–31), which can serve as a basis for specific modules of the overall mental
    language model. In cognitive science, research on learning and cognitive outcomes
    is also useful for us to explore the mental models of learners. For instance,
    Kraiger et al. (1993) argue there are three categories of cognitive learning objectives:
    (1) verbal knowledge, (2) knowledge organization, and (3) cognitive strategies
    (p. 313). Identifying cognitive learning outcomes entails making the initial assumption
    that humans make mental effort to acquire and structure knowledge and use cognitive
    strategies to achieve this purpose. Such an approach implies the belief that humans
    possess mental mechanisms that can be developed through systematic education and
    training. While acknowledging the important work that has been done from these
    perspectives, this chapter aims to use a mathematical approach to examine the
    mental language model.


    According to Shannon and Weaver (1964), in a typical communication process, an
    information source selects a desired message out of a set of possible messages,
    which may consist of written or spoken words, or of pictures or music, and the
    “transmitter encodes this message into a signal which is sent over the communication
    channel from the transmitter to the receiver” (p. 7). They further clarify that'
