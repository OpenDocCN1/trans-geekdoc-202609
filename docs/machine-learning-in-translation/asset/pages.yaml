    # 9.3.2 Two overarching ML-driven translator competences


    Among the competences listed in Figure 9.2, there are two that are prominent throughout
    the translation process and thus considered to be overarching constructs, namely,
    ML-related competence and continuous learning competence. Both of them are about
    learning, including both machine and human learning.


    # 9.3.2.1 ML-related competence


    This competence allows the translator to map translation-related linguistic problems
    into an NLP task framework. It enables translators to use relevant ML technologies
    to perform translation tasks more effectively and also to facilitate translation-related
    learning, as discussed in Sections 8.3 and 8.4 of Chapter 8.


    ML-system users need to be able to (1) apply an ML system (i.e., MT) to different
    tasks, e.g., using MT to translate and generate synthetic data; (2) design their
    own use case employing multiple ML systems, e.g., using MT and MT quality estimation
    systems to estimate editing effort; (3) interpret the results generated by an
    ML system, e.g., understanding BLEU scores produced by an MT automatic evaluation
    system; and (4) identify and analyze relevant technical details that make the
    best use of both human and machine power. This entails addressing a series of
    issues and questions: Should the source text be translated by humans or machines
    or both, and what might be an appropriate balance? Which MT system is most appropriate
    for this task? Who would be the best language service suppliers to work with the
    MT results? We will further discuss these aspects in Section 9.4.2 from the perspective
    of incorporating ML into the teaching of translation.


    A translator may not be able to find the best NLP solution for the translation
    problem at the beginning of the learning process. A benefit of using tools, though,
    is that the translator can check the results to judge the quality of the solution.
    These technologies therefore evolve, and those that function well survive. To
    acquire this competence, the translator needs to learn the vocabulary of ML and
