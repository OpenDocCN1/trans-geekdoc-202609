    states: one for human analysis and human learning, and another for machine analytics
    and machine learning. As described previously, the conversion of language data
    between these two states is a basic form of translator–computer interaction (TCI)
    in a continuous translation process.


    # 7.2.2 Translation-driven language data


    # 7.2.2.1 Translation-driven corpora


    Regarding the state of language data for human analysis and learning, in linguistics
    and translation research and practice, the most frequently used natural language
    dataset is the corpus, which is “a large collection of authentic texts that have
    been gathered in electronic form according to a specific set of criteria” (Bowker
    & Pearson, 2002, p. 9). A corpus collects parole and is primarily designed for
    human use. In machine learning, most syntactic and semantic relations are examined
    in a corpus; the relationships within the text itself are generally the focus
    of investigation. Texts in the corpus are the primary resource allowing observation
    of the distributional structure of a linguistic unit, i.e., how it is related
    to other units in the same group of texts in the corpus. These relationships are
    used to extract feature vectors from linguistic units.


