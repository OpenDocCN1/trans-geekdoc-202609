  md: 'The unit of translation is also a means for comparing subcorpora of translation-driven
    corpora. Many parallel corpora used in translation processes include sentence
    alignment between the source and target text as a structural feature, and the
    sentence boundaries indicated by punctuation marks are annotations that writers
    add when creating text. By applying segmentation rules based on punctuation, computer
    programs like CAT and automatic segmentation tools use human annotations in parallel
    corpus design and acquisition.


    Terminology is another example. When translators or terminologists identify terms
    that are associated with specialized knowledge, they organize information about
    the term using a mental schema to make the term comprehensible to a computer program,
    although the comprehension is only rudimentary in form. When a CAT tool highlights
    terms, it provides an option to have the computer program translate the terms
    and to reduce the translator''s cognitive load.


    # 7.3.2 Encoding translator''s insights when creating language data


    # 7.3.2.1 Degrees of translator intervention


    Generally speaking, if a dataset is created with a high degree of human intervention,
    it is usually considered high quality, labor-intensive data, which can be a good
    linguistic resource to train a ML model. By human intervention, we mean how much
    human intelligence and effort are involved in the database design and compilation.
    In the following, we focus on the translator, to include translators, interpreters,
    linguists, terminologists, translation/localization project managers, and other
    domain experts. With this group in mind, we consider two opposite poles on a continuum
    of translation-driven language data: (1) general language data with minimum translator
    intervention and (2) special purpose data created by translators, e.g., translation
    memory.


    # (1) Language data with minimum translator intervention


    In corpus linguistics, computer science, and natural language processing, large
    scale datasets are used to analyze specific linguistic behavior, extract meaning
    representation, and train ML systems to perform NLP tasks. This type of data is
    usually designed and acquired according to specific criteria, e.g., size limits,
    topics/domain, clients, authorship, publication date, and languages. The collection
    of textual items in these datasets relies heavily on computer processing, e.g.,
    using web crawling techniques or computer programs for text formatting and processing.
    Synthetic data are an extreme case, as the data are created by program simulation
    with minimum human intervention, rather than in real-life communication processes.
    Collections of naturally occurring texts, i.e., corpora, can also be compiled
    with little human intervention. For instance, in web corpus construction, crawling
    is used to collect human language data. In order to address issues such as redundant'
