    # ## Structure of the book


    The book has three parts, each with three chapters.


    Part I discusses *Human and machine approaches to translation*. Chapters 1 through
    3 explore how humans and machines approach the problem of translation in their
    own particular ways, in terms of internal representations of meaning, chunking
    of larger meaning units, and prediction in translation based upon language models.


    Chapter 1 introduces the human approach to translation and discusses its relevance
    to machine learning from the linguistic, communicative, and mathematical perspectives.
    By examining the representation of words as high dimensional, real value vectors
    – a defining feature of neural network language models – the reader can revisit
    the nature of translation with ML as a new dimension.


    Chapter 2 approaches MLinTrans from the perspective of linguistic structure and
    levels of analysis. It compares how humans analyze text at different levels for
    translation purposes with how machines parse text and annotate segments in order
    to interact with humans in an automated translation process. It discusses how
    and why machine segmentation of large chunks of information relies on both mathematical
    calculations and human perception of language.


    Chapter 3 focuses on the neural network language model and how it parallels the
    human faculty of prediction in translation and interpreting. It investigates links
    between human inference and generalization in machine learning used to predict
    output in translation tasks. It looks in particular at how meaning is represented
    numerically in a neural network language model.


    Part II introduces *Machine learning tasks in translation*. Chapters 4 through
    6 introduce key ML tasks, including MT, translation quality assessment and quality'
