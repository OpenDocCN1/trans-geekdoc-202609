  md: 'learning. Translators can learn from the project in addition to fulfilling
    the translation task, which will improve knowledge and expertise for future projects
    in the same domain and linguistic style. The translator can also do follow-up
    research to reinforce knowledge in a particular area. The same applies to a ML-driven
    translation solution. Relevant computer programs can be utilized to compile corpora,
    analyze the linguistic features, and process the corpora to make them more ingestible
    for an ML engine. For example, translation memory can be compiled into a separate
    parallel corpus, or existing source and target texts can be automatically aligned
    to optimize use as training data by a machine translation engine. We will further
    elaborate the concept of continuous learning in Chapters 7 and 8.


    # 6.4.6 Adapting the target content format to the target locale and culture


    After the linguistic elements are translated into the target language, the final
    step is to format the textual information. In effect, many (component) content
    management systems can manage structured information, starting with the first
    step in the continuous translation process: when generating the content to be
    translated or localized. Structured information has a fixed framework, and content
    can be stored and managed in a separate database according to the structure. For
    example, in a bicycle owner manual, content can be divided into different parts
    based upon content, such as bicycle assembly, maintenance and service, general
    warnings, and important safety information. These sections can be recycled when
    creating similar content, such as a tricycle owner manual. When each section is
    translated, the translated part can also be used in a similar manner. Although
    the translator is usually not involved in the training of the intelligent content
    management system, it is useful to be familiar with the fundamentals. For example,
    the Darwin Information Typing Architecture (DITA) was designed specifically for
    writing, organizing, and linking topic-based content; it benefits those who write
    and edit technical information (Bellamy et al., 2011). When translators work with
    technical writers and DITA engineers, relevant knowledge in this area can help
    them effectively translate and work with other functional departments.


    Other intelligent tools are also used in the last step of a continuous translation
    process, such as speech synthesis or text-to-speech (TTS), which is particularly
    significant in spoken MT. TTS algorithms aim to convert text into waveforms. It
    is exactly the reverse of ASR, with similar machine learning principles and possibilities
    for human involvement.


    TTS is part of synthetic media, also known as AI-generated media, generative media,
    and personalized media, which “refers to any media created or modified by algorithmic
    means, especially through the use of artificial intelligence algorithms” (W3C,
    2020, n.p.). One significant trend in the publishing stage is the rise of implementation
    of synthetic media, which include not only speech/voice synthesis, but also artificially-generated
    video, images, or text. AI takes on part (or all) of the creative process, which
    leads to many ethical concerns. To address these concerns, supporting tools such
    as automatic fake detection and quality evaluation'
