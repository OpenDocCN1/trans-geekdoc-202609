  md: 'a specific name and definition of the metadata based on the project requirements.
    Options include significant error types as the error categories in a MTPE task,
    allowing post-editors to choose the error categories in their edits, which the
    linguist can use to analyze MTPE error patterns and train other ML systems, such
    as automatic post-editing systems.


    To improve control of translation memory, the project manager can create an annotation
    schema that represents translators’ competence in producing good translations,
    including the translator’s language proficiency level, translation experience,
    and familiarity with the translation topic. Such criteria can be saved in a typical
    translation project management system. Incorporating them into the annotation
    system makes it possible for the manager to select the most relevant translation
    memory and check that it was produced by translators who meet certain standards,
    thus helping to ensure the quality of the translation memory. In this manner,
    the translator’s knowledge and expertise in translation can play a significant
    role in the design and implementation of a data annotation framework.


    For real-world translation-related tasks, the annotation framework can be incorporated
    into an automated annotation management system. Many CAT tools have an editing
    feature that allows the user to create different error types, which the system
    can automatically store. There are also standalone annotation platforms like KEOPS
    (Keen Evaluation Of Parallel Sentences), which offers a complete tool for manual
    evaluation of parallel sentences (KEOPS for evaluators, n.d.).


    When designing an annotation framework based on existing translation knowledge,
    as discussed in the case of MQM, it is important to balance the relationship between
    computational efficiency, the analysis framework, and annotation cost. MQM has
    19 core issues, and under each major category, there are subcategories that users
    can further extend. On the one hand, the higher the number of tags, the more complex
    the computation and the greater the human cognitive effort required to make judgments
    regarding the categories, which in turn increases cost. On the other hand, if
    there are not enough tag categories, the framework does not represent the scenario
    very well, and the annotations lose significance. Balancing these considerations
    requires domain expertise, rather than computational knowledge and skill, making
    a domain expert such as a translator a strong candidate to execute this task effectively.


    # 7.4.3 The role of human annotation in machine learning


    The early 1990s saw a shift from rule-based to statistical MT and with it a transition
    to descriptive approaches in computer program development. Statistical approaches
    depend on language data, which is in alignment with the history of corpus linguistics,
    with on-line corpora and analysis tools becoming increasingly accessible and corpus-based
    studies increasingly common in the 1990s (Biber et al., 1998, p. F33). As an integral
    part of corpus linguistics, data annotation is significant for these developments.
    For example, Universal Dependencies (n.d.) is a framework for consistent annotation
    of grammar (parts of speech, morphological features, and'
