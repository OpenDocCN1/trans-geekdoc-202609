- pgno: 75
  md: '![](img/ec5cbdd0549c7a4e25c06fc472c12208_75_0.png)


    FIGURE 3.1 Spatial visualization of word vectors


    The co-occurrence matrix in Table 3.3 shows frequencies of words with other words
    in each cell. But in most cases, raw frequency is not the best measure of association
    between words. Raw frequency is very skewed and not very discriminative. For example,
    words like *the*, *a*, and *I* occur frequently with all sorts of words and do
    not provide much information about any particular word. Simply by examining co-occurrences
    with these words, one cannot tell what kinds of contexts are shared by *conservation*
    and *restoration* in contrast to *development* and *transboundary*. Thus, we need
    to weight words in the vector. A weighting function can be provided using models
    such as the PPMI (positive pointwise mutual information) model or the tf-idf (term
    frequency – inverse document frequency) model, with the former being used for
    term-term matrices (see Table 3.3) and the latter for term-document matrices.
    Both algorithms are widely employed to compute word similarity, for tasks like
    finding word paraphrases, tracking changes in word meaning, and automatically
    discovering meanings of words in different corpora (Jurafsky & Martin, 2020, pp.
    106–112). In translation, the tf-idf model is widely used for automated terminology
    extraction.'
