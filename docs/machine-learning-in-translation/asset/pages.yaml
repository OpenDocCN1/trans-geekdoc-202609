    # 5.4.2 Automated metrics based on n-gram precision


    # 5.4.2.1 The Bilingual Evaluation Understudy score


    Of the various metrics for software evaluation, Bilingual Evaluation Understudy
    (BLEU) was one of the earliest, and it continues to be among the most popular
    and robust. It was developed in 2002 by a group of researchers at the IBM Watson
    Research Center (Papineni et al., 2002) as a method for automated evaluation of
    machine translation. It is also used in other NLP tasks. For example, Bleualign
    is an MT-based sentence alignment tool, which uses BLEU as a similarity score
    to find reliable alignments. Specifically, it requires parallel texts (i.e., a
    text and its translation) as well as an automatic translation of at least one
    of the texts. The alignment is conducted according to the similarity (modified
    BLEU score) between the MT results of the source text and the target text sentences
    in the parallel corpus (Sennrich, 2010; Sennrich & Volk, 2010).


    Specifically, the BLEU MT evaluation system requires two ingredients: (1) a numerical
    ‘translation closeness’ metric and (2) a corpus of good quality human reference
    translations. The closeness metric is based on the highly successful word error
    rate (WER) metric used in the speech recognition community (Papineni et al., 2002,
    p. 311). BLEU scores on individual sentences will often vary from human judgments.
    For example, a system that produces the fluent phrase ‘East Asian economy’ is
    penalized heavily if all the references happen to read ‘economy of East Asia’.


    The key to BLEU''s success is the similar treatment of all systems and use of
    multiple human translators with different styles, which are canceled out through
    comparisons between systems. In practice, a single reference or multiple references
    might be available to produce a MT result. A single reference translation does
    not necessarily mean all translations in the corpus are from one translator. Ideally
    such a corpus will ensure a degree of stylistic variation, which means it is preferable
    to have translations from different translators.


    The cornerstone of the BLEU metric is the precision measure. To calculate precision,
    we can compare the n-grams (in this context, an n-gram is an ordered sequence
    of n words) of the candidate with the n-grams of the reference translation and
    count the number of matches, for example, the sum of the candidate translation
    words (unigrams) occurring in the reference translation is divided by the total
    number of words in the candidate translation. Unfortunately, MT systems can over-generate
    what appear to the system as reasonable words, resulting in improbable translations
    that have a high precision measure. In the first example (see Figure 5.2), out
    of the total words (unigrams) in the candidate, all of them'
