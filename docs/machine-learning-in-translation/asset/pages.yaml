    Typically, a SMT engine consists of multiple modules; for instance, Corbi-Bellot
    et al. (2005) introduce eight modules in a SMT architecture: de-formatter, morphological
    analyzer, part-of-speech tagger, structural transfer, lexical transfer, morphological
    generator, post-generator, and re-formatter, which is similar to an assembly line
    producing an automatic translation result (p. 81). Kashani et al. (2007) integrated
    an Arabic-to-English transliteration system into a general-purpose, phrase-based
    statistical machine translation system and found that the transliteration module
    can help significantly in the situation where the test data are rich with previously
    unseen named entities (p. 17).


    In SMT, different modules are optimized separately, instead of jointly in one
    model. In reality, this can be a difficult challenge to resolve, involving considerable
    work in human feature engineering. Further, adding modules and exceptions confuses
    the machine. As these modules are added mostly based on human intuitive reflections
    on the automatic translation process, the focus is on the output rather than machine
    learning and training processes.


    Unlike the traditional phrase-based translation system, which consists of many
    small sub-components that are tuned separately, neural machine translation attempts
    to build and train a single, large neural network that reads a sentence and outputs
    a correct translation. NMT offers end-to-end training, using one model to train
    everything inside. The architecture of an NMT system is conceptually very simple
    and has the ability to generalize well to very long sentences.


    # 4.3.4 Neural MT


    # 4.3.4.1 Statistical approaches to MT


    In essence, the NMT paradigm is also a statistical approach to machine translation,
    as it is also based on statistical inference and response to linguistic data.
    However, NMT architecture is different from that of SMT systems. NMT models take
    the form of neural networks, which are composed of a large number of simple components
    wired together. Specifically, a neural translation model consists of two basic
    parts: an ‘encoder’ and a ‘decoder’, which align with the analysis and transfer/generation
    steps in the Vauquois triangle. In this case, analysis is an encoding process,
    and the result is a matrix composed of a sequence of vectors, representing the
    sentence structure and meaning. The transfer and generation steps are combined
    into a process called decoding, which generates the target words directly. To
    some degree, compared with the representation provided by RBMT and SMT, the intermediate
    representation'
