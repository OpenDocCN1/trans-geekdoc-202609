    # 3.3.2.2 Feature vectors


    Dense vectors entail feature creation, in which the features may or may not have
    any obvious relation to the original input but do have comparative value in that
    similar inputs have similar features. In Section 2.3.1 of Chapter 2, we gave an
    example of paradigmatic relationships in a sequence. As shown in Figure 3.2, specific
    features can be extracted based on characteristics of each word category.


    As discussed in Section 3.2, statistical language models such as n-gram models
    are based on conditional probability. The generalization is obtained from sequences
    of words seen in the training corpus to new sequences of words. When a new combination
    of n words appears that was not seen in the training corpus, n-gram models look
    at the probability predicted using a smaller context size. In contrast, feature
    vectors achieve a higher level of generalization that is not possible with classical
    n-gram language models. For example, if the phrase the cat is walking in the bedroom
    is in the training corpus, the generalization a dog was running in a room should
    be almost as likely, because dog and cat, as with the and a, room and bedroom,
    etc., have similar semantic and grammatical roles (Bengio et al., 2003, pp. 1137–1140).


    Figure 3.2 is a visualization of the generalization obtained when a sequence of
    words that has not yet occurred has high probability due to the fact that it consists
    of words that are similar to words in an occurring sequence because they have
    semantic and grammatical similarity.


    If we assign a numeric value to a feature related to ‘animal’, the values for
    words cat and dog must be greater than those for bedroom and room. Conversely,
    if the feature is ‘space that can be occupied’, the values for words bedroom and
    room will be greater than those for cat and dog. These relationships show that
    the assigned numbers represent meaningful values. They are real value numbers
    and can be used in mathematical operations. In this sense, feature vectors are
    in effect distributed representations, as we discussed in Chapter 1. Bengio et
    al. (2003) state that the feature vectors associated with each word can be “initialized
    using prior knowledge of semantic features” (pp. 1139–1140). In the case of prior
    knowledge of semantic features, like parts of speech or name entities, the information
    can also be passed to the computer program through sequential labeling tasks.
    The example shown in Figure 3.2 is based on prior human knowledge of semantic
    features.


    Features can also be learned from training data. For example, if dog and cat are
    found with similar co-occurrences in a particular corpus, e.g., dog and cat both
    appear with a and the on the left and is and was on the right side of the word,
    the'
