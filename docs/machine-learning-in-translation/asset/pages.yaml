    Aharoni et al. (2019) propose Multilingual Neural Machine Translation, which “enables
    training a single model that supports translation from multiple source languages
    into multiple target languages” (p. 3874). In many areas, multilingual NMT offers
    a more advanced solution than simply combining various bilingual NMT systems.
    Many NMT technology providers have started to develop bilingual language models,
    which are still very suitable for specific business needs, while at the same time
    exploring the potential of and developing Multilingual NMT systems, given their
    technological capabilities and real-life business applications.


