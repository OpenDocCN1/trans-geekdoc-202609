    The editing is done manually by humans, and the MT post-editing (MTPE) process
    is a typical scenario used to generate targeted references.


    The language industry tends to use the term TER to cover both TER and HTER scenarios,
    as many translation edit rate algorithms are based on post-editing results (targeted
    references), rather than human reference translations produced without the translator
    being exposed to the MT results (also known as untargeted references). Yet it
    is crucial that the differentiation between TER and HTER be clear, as the evaluation
    results vary given the fact that the reference translations are produced under
    different conditions.


    Snover et al. (2006) compare the number of insertions, deletions, substitutions,
    and shifts in scenarios with HTER (TER with one human-targeted reference) and
    with TER (four untargeted references). Here, lower numbers in edit-distance indicate
    better performance. Snover et al. (2006) found that HTER reduces the edit rate
    by 33% relative to TER [(49.6–33.5) ÷ 49.6 = 33%]. Substitutions were reduced
    by the largest factor (from 25.8 to 14.6), most likely because words were often
    judged synonymous. The majority of the edits were substitutions and deletions
    in both condition categories, TER and HTER (p. 228).


    When revisiting the concept of n-gram-based automated metrics such as BLEU, whether
    the reference translation is targeted or untargeted also affects the statistical
    results, which must be considered when controlling the variables in the implementation
    of MT quality assessment. Both n-gram– and edit distance-based automated metrics
    share a common feature: they need a reference translation and a hypothesis (MT
    output) to make the linguistic comparison. In many cases, reference translations
    are not always available. ML technologies can provide an indicator of MT quality
    without reference translations, with quality estimation being an example.


    # 5.5 Quality estimation (QE)


    Though automated metrics for MT quality evaluation are fast and cost-effective,
    in many cases a reference translation is not available, much less multiple reference
    translations, which is preferable. The human reference translation is assumed
    to be the gold standard, but that is hard to validate. Most source sentences have
    multiple translations that could be considered high quality translations. Furthermore,
    automated TQA is retrospective and does not indicate how much time will be required
    to post-edit the segment or how much the translator should be paid for editing
    it.


    To address these issues, quality estimation (QE) can be used to automatically
    provide an indication of the quality of machine translation output without access
    to human reference translations. It is also a method to estimate the level of
    post-editing effort that will be required. Unlike the retrospective MT evaluation'
