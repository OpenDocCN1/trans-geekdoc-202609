  md: 'be automated by using document parsers, such as optical character recognition
    (OCR) technique and some out-of-the-box solutions, including Pdftplumber, Google
    Document-AI, and Amazon Textract.


    # 6.4.1.1 Optical character recognition (OCR)


    Optical character recognition is


    the task of converting images of typed, handwritten or printed text into machine-encoded
    text. It is a method of digitizing printed texts so that they can be electronically
    edited, searched, stored more compactly, displayed on-line, and used in machine
    processes such as machine translation, text-to-speech and text mining.


    (Sahu & Sukhwani, 2015, p. 1)


    OCR is a typical sequence to sequence learning model. It includes both character
    recognition and word prediction.


    The training data of a typical OCR system is annotated word images. For example,
    the Modified National Institute of Standards and Technology (MNIST) database of
    handwritten digits has a training set of 60,000 examples and a test set of 10,000
    examples. “The digits have been size-normalized and centered in a fixed-size image”
    (LeCun et al., n.d.). Though most people who understand the words can annotate
    the word images, sometimes it is convenient for a translator to verify and annotate
    OCR results that have multilingual content.


    In the past, some functionalities of document parsing and OCR could be utilized
    in a traditional CAT environment. But with more advanced NLP techniques, it is
    possible to perform these functions outside a CAT tool environment, using a stand-alone
    NLP technique for customization based on specific purposes. In translation practice,
    a translator sometimes needs to verify the OCR results and note patterns in errors
    to correct them efficiently and consistently. In a separate OCR task, these activities
    can be automatically documented and then used to train the engine, which helps
    the translator leverage the linguistic assets created in the process of translation.
    The same applies to other intelligent tasks covered in this section.


    # 6.4.1.2 Automatic speech recognition (ASR)


    As Jurafsky and Martin (2020) note, automatic speech recognition maps any waveform
    to the appropriate string of words. They point out that “automatic transcription
    of the speech of any speaker in any environment is still far from solved, but
    ASR technology has matured to the point where it is now viable for many practical
    tasks,” such as “automatically generating captions for audio or video text” by
    transcribing movies, videos, or live discussions (p. 548). In translation, ASR
    tasks are relevant particularly to spoken machine translation and audiovisual
    translation.'
