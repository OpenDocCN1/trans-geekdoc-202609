  md: '# 2.4 Application of linguistic levels in machine translation


    In a neural network language model, a unit at a certain granularity level is passed
    to the input layer of the neural network. From the computational perspective,
    it is not feasible to feed the entire dataset (e.g., 1 billion characters) into
    the model for training. Therefore, the input data needs to be split into something
    that is processable. The form of the input data affects that of the output. For
    example, most machine translation systems use sentences as input, and the MT results
    are also at the sentence level. A NMT model is based mainly on the encoder-decoder
    framework: the encoder compresses the input sentences of the source language into
    an abstraction from which the decoder generates target sentences. One reason to
    translate at the sentence level is the format of the training data, which is mostly
    aligned at the sentence level, such as in a translation memory. In addition, there
    are studies that explore the possibilities of short-single-sentence MT models
    to be extended to generate larger structures like paragraphs or even entire documents
    (Li et al., 2015).


    An interactive machine translation model, however, usually uses a phrase-based
    language model. Ortiz-Martínez et al. (2011) describe an example of a session
    in which a Spanish sentence is translated into English. In this session, the source
    sentence is *Para ver la lista de recursos*, and the system suggests the translation
    of the whole phrase *To view the resource list*. The user, usually a translator
    or editor, can start to interact with the system by accepting or giving new suggestions
    on a smaller chunk of information. For example, the user might move the mouse
    to accept the first eight characters *To view*. However, the user may not be satisfied
    with the suggestion *the* after *To view* and enter *a* instead. This will trigger
    the system to suggest completing the sentence with *list of resources*, which
    is a new translation suggestion. If the interaction stops here, the final result
    will be *To view a list of resources*, instead of *To view the resource list*,
    which was suggested at the beginning before the user’s interaction. The user can
    keep interacting with the system by changing the options that follow, e.g., change
    *list* to *listing*, and repeat the interaction until the final suggestion is
    accepted (Ortiz-Martínez et al., 2011, p. 69).


    To some degree, the granularity level of interactive MT is impacted by an internal
    human analysis framework of levels. The input is fed sequence by sequence. For
    a computer program, what is more relevant is the length of the sequence. For humans,
    however, it is the unit of translation that is most accessible when they process
    the information, which is equal to ordered tokens from a machine’s mathematical
    perspective. Sometimes the length of the sequence is not completely consistent
    with the concepts of linguistic levels in human minds. For example, a paragraph
    in a human’s eyes might include short sentences so that in terms of length, the
    paragraph is considered a sentence by an MT system. However, the segmentation
    levels of the input and output sequences are usually the same, and the levels
    affect how translators and MT engines interact with each other not only during
    the interactive MT process but also after the MT results are generated. For example,
    in an NMT model, an input sequence is mapped to a vector embedding that represents
    the sequence, which is then converted to an output string of words'
  merge: -1
  img_proc: true
