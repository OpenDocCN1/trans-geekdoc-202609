  md: '# 2 LEVELS OF ANALYSIS


    # KEY CONCEPTS


    +   - Linguistic structure and levels of analysis play a significant role when
    humans and machines approach translation.

    +   - Machine segmentation of large chunks of information relies on both mathematical
    calculations and human perception of language.

    +   - In order for ML tools to work for and interact with humans directly, granularity
    levels in a machine learning process must be consistent with the nature of human
    cognitive activity.


    # 2.1 Introduction


    One of the most essential and controversial preliminary steps in language comprehension
    and production, particularly in translation, is defining the unit with which to
    operate. As discussed in Chapter 1, every linguistic unit consists of signs and
    thus has a double structure, that for linguistic form (the signifier) and that
    for meaning (the signified). Multiple ideas may be positioned within the same
    unit; for example, the word *mouse* can refer to the rodent or a computer accessory.
    Sharing the same linguistic form (*mouse* as signifier), these two ideas cannot
    be separated, but rather are super-positioned. In the flow of language in real-life
    situations, only one signified is usually retained,¹ preferably that which has
    priority in the context. In language comprehension and production in translation,
    there are three elements that play determining roles: form, meaning, and context.
    While form and meaning can be embodied within a unit, context refers to how a
    given unit is related to others in the larger environment. And an intriguing question
    to ask is *Where is the starting point: form, meaning, or context?*'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'In translation, Vinay and Darbelnet (1995) “define the unit of translation
    as the smallest segment of the utterance whose signs are linked in such a way
    that they should not be translated individually” (p. 21). They argue that the
    signifier takes on a more important role than the signified, and translators must
    be concerned more with semantics than structure. This is a human approach; it
    is widely understood that the translator starts with semantics (the meaning) and
    carries out all translation procedures within the semantic field. In this sense,
    a unit of translation is not defined exclusively by formal linguistic criteria;
    rather, it is identified as a unit of thought, taking into account that translators
    do not translate words, but ideas.


    In a machine learning task, these three elements and their relationships – form,
    meaning, and context – can all be explored in a natural language dataset, or corpus,
    which includes the unit itself as well as its context, i.e., a combination of
    other relevant units. A corpus holds all relations of the unit and other units
    in a distributional structure, which is the main resource for a computer program
    to generate patterns that correspond to meaning-based human reflections and thoughts.
    A computer program, whether a machine translation system or a text summarization
    tool, probably does not understand the underlying meaning of the text in the same
    way as humans, but it can absorb information and produce results that make sense
    to humans, in that the output is consistent with human conceptualization of meaning.
    In this sense, meaning exists only in the human mind during the interaction between
    human and machine, which includes feeding the dataset in the computer system,
    designing and optimizing the system architecture, and interpreting and using the
    machine-generated results. This chapter and the next focus on the machine approach
    to form, meaning, and context in translation. Chapter 2 describes levels of analysis
    for form and context. Chapter 3 turns to vector semantics for meaning and context,
    with the machine approach starting with form and structure, where meaning is extracted
    through the distributional structure of natural language data in a corpus, where
    meaning and context lie and co-exist.


    # 2.2 Contextual levels in language comprehension and production


    # 2.2.1 Levels of analysis in translation


    Analysis is a key step in the translation process. As Newmark (1988) states, a
    translator begins translating by “reading the original text for two purposes:
    first, to understand what it is about; second, to analyze it from the translator’s
    point of view” (p. 8). Further, in terms of linguistic analysis of the source
    text, Newmark (1988) emphasizes the unit of translation and discourse analysis
    (pp. 54–67). It is also important to analyze other types of translation-related
    text, such as the target text, the reference text, and aligned source and target
    texts. In this chapter, our focus is on one aspect of linguistic analysis, which
    is how a larger piece of textual information can be segmented into smaller units
    at various levels. The segmentation'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'in itself shows the relationship between a particular unit and its context.
    When a translator approaches a text, there are multiple levels of language processing
    known to be at work, and the translator normally utilizes all of these levels
    intuitively (see Liddy, 2001, p. 1; Newmark, 1988, pp. 18–24).


    Mona Baker (1992) explored equivalence at multiple levels in translation: equivalence
    at the word level and above the word level, grammatical equivalence, textual equivalence,
    and pragmatic equivalence. This framework considers form (grammar and number of
    words) and meaning (idioms and fixed expressions, and pragmatics). Newmark (1988)
    applied the concept of the translation unit in his theory and pointed out that
    a sentence is the ''natural'' unit of translation, just as it is the natural unit
    of comprehension and recorded thought. Within the sentence, he identified five
    further sub-units of translation. The smallest unit of meaning, the morpheme,


    > need not be taken seriously, except in the case of prefixes and suffixes, such
    as ''post-'', ''inter-'', and ''-ism'', when they have no direct target language
    equivalent in the word context. . . . Two sub-units, the clause and the group,
    are grammatical; the other two, the collocation and the word (including the idiom
    and the compound, which is a congealed collocation), are lexical.

    > (Newmark, 1988, pp. 65–66)


    When a translator translates, the translator must “be looking at the grammatical
    (the general factors of time, mood, space, logic, agreement) and the lexical (the
    details) at the same time, making sure that the Functional Sentence Perspective
    (FSP) is preserved where important” (p. 66). According to Newmark (1988), FSP
    “links the study of discourse, sentence and emphasis” (p. 60) and “examines the
    arrangement of the elements of a sentence in the light of its linguistic, situational
    and cultural context, determining its function within the paragraph and the text”
    (p. 61).


    In oral translation, Chernov (2004) proposes a hierarchy of speech levels as the
    basis for a probability anticipation mechanism in simultaneous interpreting:


    > Syllable – word – syntagm² – utterance – discourse

    > (p. 93)


    These theorizations are self-contained frameworks and represent different approaches
    to describing the hierarchical structure of a corpus. Machines employ yet another
    conceptualization of how to organize human thought.


    # 2.2.2 The concept of granularity in NLP


    In natural language processing (NLP), a more commonly used term for level of analysis
    is ‘granularity’. Generally speaking, granularity is the concept of breaking down
    an event into smaller parts or individual granules such that each granule plays
    a part in the higher level event. Newspaper articles offer a classical example'
