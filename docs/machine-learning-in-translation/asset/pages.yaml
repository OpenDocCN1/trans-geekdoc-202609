  md: '# # 9


    # IMPACT OF MACHINE LEARNING ON TRANSLATOR EDUCATION


    # ## KEY CONCEPTS


    +   - With the impact of machine learning, the translator’s role is evolving,
    with tasks moving from translation of proper to translation-related linguistic
    tasks, which provide new requirements for translator competence.

    +   - An educator’s role can be considered in two approaches to structuring learning:
    (1) bottom-up, learner-centered and (2) top-down, educator-guided environments.
    Both ML and bottom-up human learning can increase learner autonomy.

    +   - It is time to rethink the conventional approach to the creation and application
    of rudimentary ML models. Personalization of these models based on user intention
    is a more relevant task for translator practice and learning.

    +   - The call for human–computer interaction (HCI) has grown in urgency and raises
    new requirements for translator education.


    # ### 9.1 Introduction


    From an AI/ML developer or programmer’s perspective, Ng (2021) proposes a rule
    of thumb in terms of what tasks AI technologies can handle. “If a typical person
    can do a mental task with less than one second of thought, we can probably automate
    it using ANI either now or in the near future” (n.p.). Specifically, when technical
    experts design a translation-related ML technology, the following three aspects
    can be taken into consideration:


    +   1. Even if humans can translate, is it feasible? Obviously, the great demand
    for translation makes it impossible for humans to bridge the gap alone; we can
    use AI/ML technologies to address this gap.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '+   2 If a human can accomplish the task, we can probably get data from humans
    and design machine translation systems to automate the process.


    +   3 If a program makes a mistake, we can gather insights from humans to improve
    it.


    This technical perspective explains why ML permeates so many corners of life,
    and why ML computer programs seem to catch a glimpse of human intelligence: (1)
    they can simulate human learning models, if tasks are simple²; and (2) language
    data produced by humans can train, verify, and improve models that are able to
    predict future activities.


    ML generalization capabilities necessitate a higher degree of automation and lower
    degree of human control. This adds uncertainty to human–computer interaction,
    which in turn creates challenges for translator education. Education is about
    humans, and the impact of ML must be taken into consideration, given its dynamics.
    Translator educators can reflect on the teaching methodology that will best facilitate
    human learning, and they can predict what new skill sets translators will need.
    Chapter 8 addressed the relationship between human learning and machine learning.
    In this chapter we examine this relationship from an educator’s perspective.


    # 9.2 New ML-driven translation workflows


    # 9.2.1 A machine-in-the-loop approach to translation


    With the implementation of ML, many translators do not start translating from
    scratch. Rather, ML-driven technologies are applied at each step of a continuous
    translation process. Inspired by the concept of human-centered machine learning
    (Tan, 2018), we propose a machine-in-the-loop approach to translation, where humans,
    in our case translators, take full control of the final outcome, and machines
    play a supporting role. In this scenario, machines provide suggestions in various
    forms, e.g., MT, segmentation, and terminology, to improve productivity and translation
    quality, as well as inspire creativity and help translators overcome cognitive
    inertia, i.e., the reluctance to engage with new technologies in the translation
    process and the desire to adhere to ‘traditional translation’ practices. According
    to Mclaughlan and Bossarte (2012), cognitive inertia is the human tendency to
    maintain previously valid beliefs even when new evidence no longer supports those
    beliefs. This approach achieves what neither a human being nor a machine can achieve
    on their own.


    In a machine-in-the-loop approach, humans are the final decision makers who control
    translation quality through post-machine evaluation and other editing activities
    such as MT post-editing, OCR post evaluation, and segmentation verification. There
    are a few reasons why the entire translation process is human centered: (1) ultimately,
    translation serves humans. In terms of human experience, only humans can sense
    what translation results appeal to them most. Some translation is'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'generated to train MT engines, but this can be considered an indirect translation
    purpose (e.g., back translation in low resource language MT training); (2) humans
    are capable of conducting advanced, complex mental activities that involve coordination
    and integration of various sub activities, which is not what machines can achieve
    at this point; and (3) humans are the real source of creativity. Although machine
    learning can facilitate a certain degree of generalization, the results are unpredictable
    in terms of quality and need to be verified and improved by humans.


    One important consideration when applying this machine-in-the-loop translation
    approach is how to maintain and increase creativity. For a human translator, translation
    is a creative act of an individual, where the ‘meaning’ of a text is also ‘created’
    anew in an individual act of interpretation and production. Meaning is in the
    eye of the beholder, or as discussed in Chapter 8, what a person’s mental language
    model produces. As each person’s mental model is unique, the meaning created is
    also unique and contains many original ideas. A machine-in-the-loop approach,
    however, can mean less human activity for the same amount of translation work
    compared with a conventional human translation process. Here we argue that humans
    play a significant role in maintaining and improving creativity in a machine-in-the-loop
    translation process due to several reasons.


    First, when machines assume some tasks conventionally done by translators, the
    machines help reduce translators’ cognitive load, which in turn enables translators
    to focus on more creative and complex translation tasks.


    Second, to some degree, ML models also facilitate creativity when they estimate
    and predict. As discussed in Section 8.2.1 of Chapter 8, according to statistical
    learning theory, generalization is an approach that incorporates old knowledge
    (data) and creates new knowledge (predicted results). In this sense, machines
    can provide novel suggestions that can inspire human creativity, helping translators
    find an adequate translation, for example, or consider a wide range of translation
    options.


    Third, translator–computer interaction (TCI) provides a feasible way for humans
    to gather feedback from computer programs trained on corpora representing a group’s
    language use. In this sense, TCI indicates an indirect individual–group interaction
    among people, which helps foster creativity. In terms of quantity and immediacy
    of feedback, it would be challenging for humans to achieve this level of interactivity
    on their own.


    # 9.2.2 Translation as a language problem


    When ML gradually infiltrates the translation and localization workflow, a translator’s
    role tends to move towards what used to be peripheral to the translation. As discussed
    in Chapter 6, many NLP tasks are linguistically-oriented, translation-related
    activities that are beyond *translation proper*, i.e., the meaning conversion
    step. ML shifts the focus to linguistic activities associated with the individual
    steps of a continuous translation process, e.g., translatable string extraction,
    source text pre-processing, and terminology identification. Moreover, as discussed
    in Chapter 4,'
