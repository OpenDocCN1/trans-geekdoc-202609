  md: 'translation is a special NLP problem that can be solved by neural network language
    models.


    Accordingly, some human cognitive activities such as translating and text analysis
    (e.g., chunking/sentence segmentation, separating translatable content from formatting,
    and identifying terminology) are impacted by special NLP techniques when human
    translators interact with these tools and work with what these tools offer. In
    particular, neural MT has proved to be effective in many scenarios, and a human
    translator can analyze the MT output and edit it. Consequently, the translator''s
    task has been shifting from pure translating to tailoring specialized computer
    programs to make them function optimally, e.g., by preparing for language data
    at the input layer, working with the data at the end of a neural network and annotating
    it to provide the modeling with relevant human insights.


    # 9.2.3 Moving beyond routine translation tasks


    From a communication perspective, in most cases, there is no absolute linguistic
    equivalence, as discussed in Chapter 1, and definitions of equivalence have evolved
    as translation studies has progressed (see Bassnett, 2014, pp. 33–39; Munday et
    al., 2022, pp. 49–72). To provide another example, the concept of a ‘Coast Guard’
    varies across countries and cultures. The superordinate agencies that oversee
    the Coast Guard also vary in different countries. In China, it was formerly under
    the State Oceanic Administration but transferred to the Chinese People’s Armed
    Police Force in 2018. It is now formally under the command of the Central Military
    Commission. In the United States, the Coast Guard operates under the U.S. Department
    of Homeland Security during peacetime and can be transferred to the U.S. Department
    of the Navy under the Department of Defense by the U.S. President at any time,
    or by the U.S. Congress during times of war. Although these structures differ,
    we do need to find a term to convey meaning, for example, in a bilateral or multilateral
    event. Interlocutors use the same term and its literal translation to communicate
    during such meetings, even though in the back of their minds, they know that their
    understanding of the term is not the same. Rather, the terms establish sufficient
    equivalence to conduct a discussion. The degree of consistency between the terms
    in interlocutors’ minds is dependent on the context and other human cognitive
    factors, such as their background knowledge.


    From this perspective, human translators are still essential in ensuring the best
    communicative experience, even though machines continue to learn by digesting
    a dynamic influx of language data. Uncertainty and degrees of nonequivalence exist
    in all translation situations, particularly when the communication occurs in immediate
    and dynamic settings, such as interpreting. Even if MT attains a very high level
    of accuracy, it will still not be the preferred solution when the interlocutors’
    communicative experience is at the forefront and the adequacy of the translation
    needs to be evaluated. When machines are able to learn patterns by analyzing the
    linguistic forms, routine and high volume tasks can be automated. Human translators
    can then focus on their strengths, including the translation purpose as well as'
