  md: '# # 4 MACHINE TRANSLATION


    # ## KEY CONCEPTS


    +   - In its basic form, a Neural MT (NMT) system is a neural language model with
    specific conditioning; the relationship between the input and output data is based
    on the equivalence of meaning in at least two languages.

    +   - The transition from rule-based MT (RBMT) to statistical MT (SMT) was a paradigm
    shift from linguistic rules to statistics. Both SMT and NMT are models that rely
    on statistical inference and response to linguistic data.

    +   - NMT architecture differs from SMT, as NMT models take the form of neural
    networks composed of a large number of simple components wired together.

    +   - Fundamentally, MT aims to solve a human problem. In this sense, MT can learn
    from the human approach to translation and become an instantiation of human translation
    processes with its own characteristics.


    # ### 4.1 Introduction


    This chapter adopts a holistic approach to machine translation (MT) for three
    main reasons. First, when discussing machine translation with a focus on its impact
    on the human translation process, it makes sense to broaden attention to the entire
    localization process, rather than limiting it to activities involving the conversion
    of meaning from one language to another in the narrow sense. While localization
    may sound to the layperson like a strictly linguistic process, identical or similar
    to translation, it is much broader. The Localization Industry Standards Association¹
    defines localization as “the process of modifying products or services to account
    for differences in distinct markets” (LISA, 2003, p. 34), and it has been investigated
    in both study and practice. While Pym (2014) considers localization as a paradigm
    of'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'translation theory (p 118), this chapter focuses on practice. This chapter
    situates MT in the broader context of localization, which takes place within a
    commercial and developmental framework requiring the expertise of translators,
    language and tools specialists, programmers, engineers, project managers, desktop
    publishing specialists, and marketing staff (FoLaron, 2006; Byrne, 2009, p. 2).


    Second, in a holistic approach, MT technologies include not only various types
    of engines but also other supporting technologies. To integrate MT, technologies
    used in the localization process need to be updated to maximize MT effectiveness,
    including the human–machine interaction interface design. For example, interactive
    MT with computer–assisted translation (CAT) features, MT post-editing interfaces,
    and CAT tools with MT plug-ins through application programming interfaces (APIs)
    need to meet the specifications of MT. These language technologies are deployed
    at different stages of MT implementation, including pre– and post-processing phases.


    Third, in a holistic approach, MT is not separate from traditional translation.
    Rather, MT provides a new dimension for understanding the nature of translation.
    In essence, language technology, including machine translation, is a form of human
    reflection about the mental and physical world. Technologies do not emerge from
    nowhere; rather, they mirror human life, forming a connection making human–machine
    interaction possible. Humans create each machine system, which is unique in how
    it processes data. While MT may be a new player in the translation process in
    a broad sense – to include source text analysis, terminology management, translation
    proper, editing, and reviewing – as a human creation, MT is defined by human nature.


    # 4.2 The expansion of language technology in localization


    # 4.2.1 MT and CAT: two lines of development


    MT was the first computer–based application related to natural language. It is
    generally agreed that Weaver’s memorandum of 1949 brought the idea of MT to general
    attention and inspired many projects (Liddy, 2001). The first public demonstration
    of machine translation, the Georgetown–IBM experiment, was performed in 1954.
    Although a small–scale project of just 250 words and six “grammar” rules, it raised
    expectations that automatic systems capable of high quality translation would
    be developed in the near future (Hutchins, 2006).


    The Georgetown–IBM system was a prototype of rule–based MT. For the first time,
    people realized that computers could not only handle mathematical calculations,
    but also serve as an “electronic brain” to process non–numerical language data.
    It was a great breakthrough in computer science. However, the inadequacies of
    systems in existence at the time, accompanied by over–enthusiasm, led to the ALPAC
    (Automatic Language Processing Advisory Committee of the National Academy of Science
    – National Research Council) report of 1966. The report concluded that MT was
    not immediately achievable and recommended it not be funded. This had'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'the effect of halting MT and most work in other NLP applications, at least
    within the United States (Liddy, 2001).


    While the ALPAC report ended the golden age of MT funding, it opened a new chapter
    for commercialized MT. For example, despite the lack of funding available to MT
    research in the wake of the ALPAC report, SYSTRAN was founded in 1968 and survived
    by working closely with its clients. Moreover, there were some well-funded MT
    projects that proved successful in specific domains. METEO was a machine translation
    system launched in 1977 and fully integrated into the Canadian network for the
    transmission of meteorological forecasts (Benoit, 1982, pp. 39–40). The Pan American
    Health Organization Machine Translation System (PAHOMTS) has been in use in the
    translation unit of PAHO since 1980.


    In the late 1980s and early 1990s the first paradigm shift in MT took place, from
    rule-based to statistical MT, when researchers applied purely statistical, data-driven
    approaches to the task of translation (Brown et al., 1993). As discussed in Chapter
    3, Bengio et al. (2003) developed a language model based on neural networks, which
    improved the data sparsity problem of traditional SMT models. Their work laid
    a foundation for applying neural networks to machine translation. One hurdle for
    NMT system development was that it required significantly more computer power
    than was available with commercial computer processors. With the advent of GPUs
    (graphics processing units, which can be up to 100 times more powerful than regular
    processors), Google NMT, a commercialized system, could be launched in 2016 with
    impressive MT results (Wu et al., 2016; Tinsley, 2017).


    While there have been ups and downs in MT development, MT is not the only solution
    where computer power is used to solve translation problems. When the ALPAC report
    of 1966 halted the first big wave of MT funding in the United States, another
    strand of thought emerged: instead of using computers to translate, they could
    be used to assist humans to translate. The idea of computers supporting the translation
    process is directly linked to the development of MT. In 1966, the ALPAC report
    did support funding for the field of computational linguistics, and in particular
    what it called “machine-aided human translation,” then being implemented by the
    Federal Armed Forces Translation Agency in Mannheim. As Garcia (2014) points out,
    a study included in the report “showed that translators using electronic glossaries
    could reduce errors by 50 percent and increase productivity by over 50 percent”
    (p. 70). Table 4.1 shows milestones in MT and CAT development. Figure 4.1 compares
    their timelines.


