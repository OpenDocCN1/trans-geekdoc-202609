  md: '# # 6.4.3 Leveraging past experience/data through human or machine memory systems


    The next step in the translation process is to check memory to recycle previous
    work. A human translator can resort to past experience and recall some memorized
    information. During this process, some units may require extra mental effort to
    retrieve, such as specialized terms or proper names. When a computer program processes
    natural language, these challenges are mirrored in its design and implementation.
    A program can automatically identify and search an existing database for relevant
    translation units. Terminology extraction and named entity recognition (NER) are
    examples of automated recognition tasks that can be leveraged.


    # ## 6.4.3.1 Terminology extraction


    In translation practice, automatic terminology extraction is an effective tool
    to store, manage, and query relevant specialized concepts in corresponding languages.
    In particular, term frequency – inverse document frequency (tf-idf) machine learning
    is a widely used method to automatically extract terms in a document. Specifically,
    term frequency refers to the frequency of a particular term under investigation
    in the document. Inverse document frequency examines how common (or un-common)
    a word is in various documents in a corpus.


    In addition, as Kováríková (2021) points out, terms have specific quantitative
    features within texts, such as frequency, distribution, and contextual characteristics,
    which can serve as the basis for statistical methods of automatic terminology
    extraction (p. 24). For example, terms can be recognized by distribution in various
    disciplines or entropy² of the immediate left or right context.


    From a human perspective, terminology is “the study of how specialized knowledge
    concepts are structured, described, and designated in one or various languages
    within a specialized domain” (Faber & León-Araúz, 2016, p. 196). In this sense,
    terminology is a concept and framework primarily for humans to organize their
    specialized knowledge. When this factor is taken into consideration, automatic
    terminology extraction can also be customized to cognitive features of individual
    persons. By using word embeddings and recurrent neural networks, the model can
    predict individual learners’ term recognition based on their annotations, which
    represent previous schemata of these terms to some degree (Wang, 2021).


    # ## 6.4.3.2 Named entity recognition (NER)


    According to Jurafsky and Martin (2020), a “named entity is, roughly speaking,
    anything that can be referred to with a proper name: a person, a location, an
    organization” (p. 148). They cite four entity tags as being the most common –
    PER (person), LOC (location), ORG (organization), and GPE (geo-political entity)
    – and point out that tags include other categories, including date, time, and
    price (p. 153).'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'In machine learning, automatic NER is a sequence labeling problem. A sequence
    labeling model assigns “a label chosen from a small, fixed set of labels to each
    element of a sequence” (Jurafsky & Martin, 2020, p. 182). Following is an example
    of automatic NER by Stanza, which is an open-source Python natural language processing
    toolkit supporting 66 human languages. According to Qi et al. (2020), this platform
    “features a language-agnostic fully neural pipeline for text analysis, including
    tokenization, lemmatization, part-of-speech and morphological feature tagging,
    and named entity recognition” (p. 101).


    Despite the improvement of automatic NER annotation tools, human judgment cannot
    be replaced and is required for each annotation. To avoid the risk of introducing
    bias and reducing annotation quality, the annotation tool must be updated with
    input from statistical and machine learning methods to support the annotation
    process (Stenetorp et al., 2012, p. 104). This applies to other annotation tasks
    as well, which we will discuss in Chapter 7.


    # 6.4.4 Converting meaning across languages and cultures


    Humans and machines can both execute meaning conversion tasks. In this step, it
    is important to reinforce what has been discussed under “Translation and the language
    industry” in the Introduction to the book: with the impact of machine translation,
    the boundaries between ‘translating’ and ‘editing’ are frequently blurred, since
    many human translators are now ‘editing’ but still feel they are ‘translating’,
    even though they are working on the suggestions given by MT and TM. Furthermore,
    this step also includes quality assurance metrics. Chapter 4 addressed various
    types of machine translation tasks and machine evaluation metrics. This section
    will add one more task that has grown in importance in the ML approach to translation:
    automatic post-editing (APE).


    According to Correia and Martins (2019), “APE is inspired by human post-editing,
    in which a translator corrects mistakes made by an MT system” (p. 3051). Recently,
    a dual-source transformer architecture has been applied to APE, in which the source
    sentence and the machine-translated sentence serve as input features and the latter’s
    post-edited version as a target label used to train the model (p. 3051).


    In the transformer architecture, the key factor determining APE performance is
    the human-annotated data. As Chollampatt et al. (2020) point out, adequate supervision
    in the form of human post-editing with annotation is key. In their study, Chollampatt
    et al. (2020) compile a large post-edited corpus, SubEdits, which consists of
    actual human postedits of translations of drama and movie subtitles produced by
    a strong in-domain proprietary NMT system. Their results show that with a large
    human post-edited corpus, a strong neural APE model can substantially improve
    a strong in-domain NMT system.


    # 6.4.5 Continuous learning


    The post-processing stage of a continuous translation process is a crucial step
    in which humans and machines accumulate past experiences and data to further their'
