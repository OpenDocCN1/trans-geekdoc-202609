    have difficulty identifying phrases that have specialized meaning in context.
    For example, they might recognize *biodiversity conservation* as two separate
    words, but *biodiversity conservation* has a specialized meaning, referring to
    the practice of protecting and preserving the wealth and variety of species, habitats,
    ecosystems, and genetic diversity on the planet, which is important for health,
    wealth, food, fuel, and services. For specialized documents such as the U.N. resolution,
    advanced learners who have specialized knowledge will identify *biodiversity conservation*
    as one term or set phrase, rather than two separate words.


    The intelligent tutor can be developed further into a personalized terminology
    extraction tool that can incorporate each learner’s level of knowledge about the
    topic. If a learner has not seen a term before, for example, *migratory*, the
    learner can identify it as a new term. By annotating the corpus, each learner
    creates a training dataset that is unique to the individual. The computer program
    can extract these terms and collocations associated with them, building lists
    tailored to individual learners. The number of the words associated with the term
    is also an important indicator of the term’s difficulty level for the learner.
    This tailored term list will be more useful for learners with varying levels of
    knowledge about a specialized topic than a list generated with a general terminology
    extraction tool.


