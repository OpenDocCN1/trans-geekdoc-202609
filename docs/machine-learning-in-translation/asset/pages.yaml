    # 8.4.2 Vector space and terminological schematic context


    Returning to the relationship between form and meaning as a recurring theme in
    this book, we point out that specialized terms are also linguistic signs with
    a double structure of signified and signifier. Learning the meaning of a term
    is about learning not only its form but also the deep structure behind it. In
    this regard, a continuous vector space in ML can provide useful insights for a
    person to visualize, build, and expand a semantic field that focuses on the terminology
    as well as how it facilitates specialized knowledge representation and acquisition
    for a translator. A semantic field is “based on a meaning representation (a description
    of meaning taking account of ambiguity, hyponymy and synonymy” (Simon-Vandenbergen
    & Aijmer, 2007, p. 11). In this framework, the meaning of one word depends on
    the meaning of other words associated with it in a semantic field. We propose
    a concept of terminological schematic context (TSC), which is a semantic field
    associated with a specialized term, yet takes an individual’s previous knowledge
    and unique cognitive status into consideration.


    In studies of pragmatics and semantics, ‘context’ is often a cognitive concept.
    For example, according to Sperber and Wilson (1995), a context is “a psychological
    construct, a subset of the hearer’s assumptions about the world” (p. 15). They
    point out that it is these assumptions, rather than the actual state of the world,
    that affect the interpretation of an utterance. In terminological schematic context,
    specific terms are the anchor. That is to say, each term serves as the learner’s
    starting point to explore other terms that are semantically related to it. When
    encountering a specialized term, a translator as a learner can activate items
    in the broader context that are accessible thanks to previous experience.


    TSC can provide useful indicators to understand the meaning and evaluate the difficulty
    level of a term for a learner. For instance, for an English native speaker, *drink*
    is not a difficult word. It is closely associated with other words in the TSC
    such as *beer*, *coffee*, and *wine*. The TSC for the Chinese equivalent 喝 (drink)
    is different from that in English, with words such as *soup*, *tea*, and *water*
    more likely to accompany 喝 (drink) than *beer*, *coffee*, or *wine*. That is to
    say, the distribution of associated words for *drink* in English is different
    from that of 喝 (drink) in Chinese, which generates difficulty for a native English
    speaker.


    The above discussion is based on intuitive reasoning. In machine learning, we
    can use vector space or semantic space to visualize the TSC of a term based on
    a specific corpus (see Wang, 2021). In a vector space, semantic relations of words
    can be modeled as geometric relationships. These relationships are not hard-coded
    into the program by humans, but learned from the corpus by the computer program.
    TSC-rich documents can be used as simulated schematic context for terminology.
    It can be hypothesized that words in a continuous vector space as well as their
    distance from the term under investigation produced by an ML system are consistent'
