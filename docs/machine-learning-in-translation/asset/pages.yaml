  md: 'Word-for-word RBMT has been further developed in commercial MT systems in terms
    of the complexity of the analysis. For example, in the early development of SYSTRAN
    RBMT systems (see Hutchins, 1979), there were four stages in the translation process:
    input, dictionary lookup, syntactic analysis, and translation. At the input stage,
    each word was checked against two dictionaries (a high frequency dictionary and
    a master stem dictionary) for information on grammatical (and some semantic) properties
    and for possible English equivalents. Syntactic analysis involved four ‘passes’:
    (1) to resolve homographs, (2) to establish basic phrase groups, (3) to extend
    phrase structures and identify specific objects and complements, and (4) to determine
    the types of clauses, their ranges, and their constituents. The final stage was
    translation, which incorporated many subroutines using information from the dictionaries
    and syntactic analysis to select and arrange the English output (pp. 33–34).


    From the linguistic standpoint, the main improvement in the early development
    of SYSTRAN RBMT systems, according to Hutchins (1979), was


    > the ‘modularity’ of its programming, which allows modifications of any part
    of the translation processes to be undertaken without fear of impairing overall
    efficiency. Furthermore, the linguistic and computational facets are kept separate,
    thus avoiding the irresolvable complexities encountered in the Georgetown systems.

    > (p. 33)


    This approach used any information, regardless of its source, leading to acceptable
    English text (p. 34), which is a practice-oriented approach, using applicable
    rules rather than theoretical linguistic rules, and very pertinent in RBMT development.


    The paradigm of RBMT has many restrictions in terms of addressing conflicts between
    shared meaning and specific linguistic forms, many of which led to the ALPAC report.
    In this approach, all linguistic rules need to be hard engineered into computer
    programs, which generates extra effort and makes the system difficult to maintain.
    Researchers sought different paradigms to achieve a better solution. Due to the
    rise of CAT and resulting translation memory, bilingual/multilingual data became
    more sufficient, and attention shifted to the statistical MT paradigm around 1988
    when the IBM Watson Research Center started using it (Brown et al., 1993, 1990).


    # 4.3.3 Statistical MT


    Technically speaking, statistical machine translation does not follow the process
    defined by the Vauquois triangle. There is no generation based on analysis, and
    the transfer component is not deterministic. Instead, for a given source sentence,
    the engine generates multiple possible translations, each one referred to as a
    hypothesis, and the system modeling employs probability hypotheses and search
    algorithms to select the best hypothesis according to the training data. As discussed
    in Section 4.2.1, researchers started to apply purely statistical, data-driven
    approaches to'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'the task of translation in the late 1980s and early 1990s (Brown et al., 1990).
    In particular, IBM translation models draw on the noisy channel model for speech
    recognition (Brown et al., 1990), which formed the basis of many SMT models now
    in use today.


    What is a noisy channel model, and why is it applied in SMT? Suppose person B
    tries to listen to or read person A’s speech or writing. There is a channel that
    transmits the signal from person A to B. Yet somehow the original signal is obscured
    in transmission when disruptions or errors create noise in the channel. Under
    these circumstances, the noisy channel aims to find the intended signal, and,
    in this context, anything that obscures the signal can be considered ‘noise’.
    The noisy channel model is applied to machine translation by regarding the target
    sentence as a distortion of the source sentence through a channel with ‘noise’,
    which can be anything that obscures the source sentence. For example, the grammar
    of the source language (SL) cannot be applied directly to generate an equivalent
    sentence in the target language (TL). Instead, TL grammar needs to be characterized
    by observing correspondences between SL and TL grammar, as well as the grammar
    of the source language.


    As Brown et al. (1993, pp. 264–266) describe, a string of English words, e, can
    be translated into a string of French words, f, in many different ways. In statistical
    translation, we take the view that every f is a possible translation of e. We
    assign to every pair of strings (e ~ f) a number Pr(f | e), i.e., the probability
    of the French translation given the English source e. This relationship can be
    interpreted as the probability that a translator, when presented with e, will
    produce f as the translation. However, simply using Pr(f | e) to work out the
    best possible translation is not adequate, as it distributes probability very
    widely, with most solutions on ill-formed strings in the target languages. In
    other words, a target segment hypothesis with the highest probability given a
    source segment (i.e., a direct model from the source sentence to the target sentence)
    does not necessarily mean that this hypothesis is fluent in the target language.


    Brown et al. (1993, pp. 264–265) use noisy-channel decomposition to address this
    issue. Intuitively, when a native translator of French produces a string of French
    words, the translator actually has the string of English words in mind and has
    translated them mentally. Given a French string f, the job of our translation
    system is to find the string e that the native speaker had in mind when he produced
    f. The chance of error can be minimized by choosing the English string e for which
    Pr(e | f) is greatest. Note that this process involves a form of reverse translation
    or reverse hypothesis, since English is set as the target language, whereas French
    is the source language in the problem Pr(e | f). After applying Bayes’ theorem,
    2 the conditional probability is decomposed into Equation 4.1:


    ```

