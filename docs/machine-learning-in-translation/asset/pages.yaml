    These aspects provide approaches to MT quality, which can be specific to a project
    and examined on a case-by-case basis.


    Another approach is the use of effective metrics or frameworks for both machines
    and humans to measure the performance of an MT engine and quantify the results.
    This is an efficient and generic way to produce an indicator for TQA. MT and its
    assessment aim to serve the reader by producing a result that is ready for use.
    In this sense, MT post-editing (MTPE), editing strategies, and other interventions
    based on quality assessment or quality estimation results are a natural extension
    of MT quality considerations.


    # 5.3 Two lines of thought for MT quality assessment


    Quality considerations draw attention to an innate dilemma of MT applications.
    On the one hand, machine translation can improve translation productivity and
    generate a large volume of translations within a very short period of time. This
    is a significant strength of machine translation and one of the main reasons that
    people use MT. On the other hand, in ensuring that a massive amount of MT output
    is usable and meets expectations, human judgment is perhaps still the most reliable
    approach, despite its subjectivity and dependence on many external factors. Yet
    when using humans alone to assess quality, the entire MT process is slowed down,
    making it impossible to realize the full potential of an MT solution. Therefore,
    the assessment of MT output must be automated if it is to keep up with the speed
    and efficiency of the MT solution. Machine intelligence can be utilized to scale
    and extend human intelligence. The latter resource should be allocated judiciously
    given the enormous volume of output that an MT engine can produce.


    A familiar theme resurfaces: machines and humans do not perceive language and
    translation in the same way. In terms of MT quality assessment, there are two
    lines of thought in Figure 5.1 that make helpful distinctions: (1) whether the
    assessment, or evaluation, is automated; and (2) whether the assessment includes
    editing activities that aim not only to evaluate the MT results but also improve
    quality through direct human intervention.


    The answer to the first question – whether the MT results will only be evaluated
    or also edited – leads to two different MT evaluation metrics: automated and human.
    In machine translation research, the latter is often called human direct assessment
    (DA). In an automated evaluation system, the reference norm is previously completed
    human translations, and the process of comparing MT output and reference translations
    is fully automated. Since it does not require human intervention, it excludes
    many post-editing and computer-assisted tools that can provide an automated analysis
    of human annotation and/or edits. When generating the evaluation results through
    an automated process, machines do not need a linguistic framework. They follow
    their own algorithm to calculate evaluation scores. In'
