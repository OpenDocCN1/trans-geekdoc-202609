  md: 'is usually relatively small in size, as the data are created manually. The
    collection of this type of parallel corpus is dynamic and typically managed under
    a specific translation project, which includes rich contextual information about
    clients, project goals, and target audience. In this sense, translation memory
    associated with a specific translation assignment produces parallel corpora with
    a high level of TCI.


    Translation memory can also be created using automatic or manual methods. In machine
    translation post-editing (MTPE), a translator can post-edit the MT result to achieve
    a high-quality translation memory. Compared with the general corpora discussed
    earlier, the degree of translator intervention is higher.


    Furthermore, translator insights can be added to translation memory in the form
    of annotation based on specific scenarios to select quality data from a large
    dataset in order to facilitate effective machine learning. For example, a translator
    can filter translation memory by authors, who have various degrees of translation
    proficiency levels, and by adding metadata, which is sometimes referred to as
    ‘data about data’. For instance, by adding information about translator proficiency
    levels, we can instruct the system to choose TM produced by authors with high
    proficiency levels so that an ML task is trained only on high-quality data. In
    this context, metadata is “structured information that describes, explains, locates,
    or otherwise makes it easier to retrieve, use, or manage an information resource”
    (National Information Standards Organization, 2004, p. 1). Compared with translators
    directly generating translation memory, annotation with metadata such as author
    information is a second layer of translator intervention, as contextual information
    is encoded in the data based on human analysis. Such annotations can improve the
    effectiveness of machine learning for specialized NLP tasks and can also be used
    to facilitate human learning. In Chapter 8, we will introduce source-text oriented
    comparable corpora that can be curated for the purpose of continuous learning.


    When translators directly interact with language data, the dataset can be rich
    in human insights, which can facilitate ML in translation considerably if used
    strategically. However, there is a fundamental conflict between linguistic resources
    and language data for ML. Human intervention in language data means reducing,
    to some degree, the productivity of language data generation; it slows down machine
    learning, as human interaction yields high quality yet small amounts of data.
    It is important to balance these two extremes.


    # 7.3.2.2 The dynamic feature of data quality


    Human intervention is subjective and context-dependent. When it is incorporated
    into the data creation process, the concept of data quality becomes dynamic as
    well. All processes of data generation involve human intervention; as Sambasivan
    et al. (2021) point out, language data is never “raw” (p. 2). The difference lies
    in the source of the intervention – whether from translator, AI developer, or
    data scientist – the degree of intervention, and its impact.


    In the previous section, we discussed the degree of translator intervention in
    the data generation process. In this section, we turn to the quality of the intervention.'
