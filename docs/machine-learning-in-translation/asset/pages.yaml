    and collaborative systems; and games – that model and reason about learners. One
    example of this approach is the “intelligent interactive tutor” (Woolf, 2009)
    or “intelligent tutoring system” (ITS) – a computer system that aims to provide
    immediate and customized instruction or feedback to learners, usually without
    requiring intervention from a human teacher (Pszota et al., 1988). ITSs are useful
    integrated educational tools for customizing formal education using intelligent
    instruction and feedback. The ITS student models, for example, can promote personalized
    learning, provide real-time learning analysis, use self-adaptive content, and
    designate targeted practice (see Hu et al., 2020).


    ML technology is one of the key tools used to develop intelligent tutors. For
    example, Woolf (2009) argues that ML techniques can independently observe and
    evaluate the tutor’s actions and identify student learning strategies, such as
    which activities students select most frequently and in which order. The tutors
    analyze student behavior and generate feedback using this diagnostic information,
    leading to improved learning outcomes (pp. 223–297).


    In translation, there are areas where ML-driven, interactive intelligent tutors
    can provide immediate feedback to learners of various linguistic and cultural
    backgrounds on translation-related tasks and customize their learning content.
    In most cases, a translation instructor does not have sufficient time to offer
    a similar amount of such diverse feedback to various learners. To illustrate this
    approach, we describe an intelligent tutor for translation students in the following
    section.


    # 8.4.4.2 An intelligent tutor for translation


    An ML-facilitated learning process is usually a bottom-up approach that focuses
    on individual learners. Wang (2021) built a prototype for an intelligent interactive
    tutor that can collect each learner’s feedback on terminology, analyze inputs
    provided by the learner, and predict the terms that are likely to be the most
    useful for the learner to learn. In this example, a resolution of the U.N. General
    Assembly (2021), analyzed in Section 8.4.2, is used to train the term recognition
    models for different levels of learners. The corpus is annotated to distinguish
    between beginning, intermediate, and advanced learners based on linguistic and
    cultural competence for translation tasks. In the study, the task for the students
    is to understand and analyze the English source text for the purpose of translation.
    They need to identify new terms that are specialized or difficult for them so
    that they can focus their translation-related research and learning activities.
    In this example, the translation students are non-native speakers of English,
    with beginning learners having the lowest and advanced learners the highest level
    of linguistic and cultural competence in English, with intermediate learners in
    between.'
