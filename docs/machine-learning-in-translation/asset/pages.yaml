    # 6.4 Intelligent NLP tasks in a continuous translation process


    # 6.4.1 Extracting translatable strings from content in a larger context


    The first step in translation is to review the source content and separate the
    content from formatting. Humans are usually proficient in singling out linguistic
    elements from non-linguistic elements, e.g., images and formatting. This process
    can'
