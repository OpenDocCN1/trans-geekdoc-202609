  md: '# ## 2.3 Drawing parallels between linguistic relations and levels of analysis


    # ### 2.3.1 Syntagmatic vs. paradigmatic relations


    As Harris (1954) states, "language can be described in terms of a distributional
    structure, i.e., in terms of the occurrence of parts . . . relative to other parts"
    (p. 146), with each element in a particular position with regard to the element
    of interest, A:


    > > The distribution of an element will be understood as the sum of all its environments.
    An environment of an element A is an existing array of its co-occurrents, i.e.,
    the other elements, each in a particular position, with which A occurs to yield
    an utterance. A''s co-occurrents in a particular position are called its selection
    for that position.

    > > (Harris, 1954, p. 46)


    Harris’s (1954) work motivated a series of studies that approach meaning through
    distributional structure, arguing that similarity in meaning results in similarity
    of linguistic distribution (see Sahlgren, 2008). Words that are semantically related
    are used in similar contexts: if enough text material is available, and it is
    found that in the text material that two linguistic entities w<sub>1</sub> and
    w<sub>2</sub> tend to have similar distributional properties – they occur with
    the same other entity w<sub>3</sub> – then it can be hypothesized that w<sub>1</sub>
    and w<sub>2</sub> belong to the same linguistic class, or it can be interpreted
    that, to some degree, w<sub>1</sub> and w<sub>2</sub> have some common feature
    in meaning (Sahlgren, 2008, p. 35). In the next chapter, we will see how to reverse-engineer
    the process in a neural language model by inducing semantic representations from
    contexts of use (the distributional structure).


    In this chapter, let’s start with what can be observed and what can be directly
    induced from elements on the surface, i.e., linguistic relations between elements
    in the text. Sahlgren (2008) emphasizes the structuralist origins of the distributional
    methodology, which goes back to the cradle of structuralism with Saussure’s Cours
    de linguistique générale (1966/1916), and follows Saussure’s theory of classifying
    functional differences into two kinds of structures: syntagmatic relationships,
    or those between elements in a linear sequence; and paradigmatic relationships,
    or those between elements in a class or system. These two main types of distributional
    models provide information about co-occurrence (syntagmatic) and information about
    shared neighbors (paradigmatic) (Sahlgren, 2008, p. 33). In other words, the syntagmatic
    relations show positioning and related entities that co-occur in the text, and
