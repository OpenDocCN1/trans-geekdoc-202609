  img_proc: true
- pgno: 136
  md: 'Intentionality is an innate part of human nature which distinguishes human
    intelligence from artificial intelligence (AI). Intentionality is a result of
    a person''s mental efforts to focus attention on specific cognitive areas that
    correlate with previous knowledge and experience. Intentionality is thus individualized
    from within and varies from person to person,3 as Locke (1690) set out in The
    Essay Concerning Human Understanding:


    > [W]hen ideas float in our mind without any reflection or regard of the understanding,
    it is that which the French call reverie; our language has scarce a name for it:
    when the ideas that offer themselves (for, as I have observed in another place,
    whilst we are awake, there will always be a train of ideas succeeding one another
    in our minds) are taken notice of, and, as it were, registered in the memory,
    it is attention: when the mind with great earnestness, and of choice, fixes its
    view on any idea, considers it on all sides, and will not be called off by the
    ordinary solicitation of other ideas, it is that we call “intention,” or “study.”

    > (n.p.)


    Since computers and their programs do not have intentionality, they are unfocused.
    That is not a weakness; it is the reason we use them. Computers and their programs
    are essentially tools for human beings, no more and no less, no matter how advanced
    they are. However, anyone who is willing to utilize them for a particular purpose
    can also bring them to life in their own mind by projecting intentionality on
    them.


    Intention is an area of study in translation theory and practice. A translator
    begins by analyzing the source text from the translator''s point of view, and
    in doing so determines the intention of the text4 for the purpose of selecting
    a suitable translation method and identifying particular and recurrent problems
    (Newmark, 1988, pp. 11–13). The translator''s understanding of the text and search
    for the intention of the text go together, as intention provides rationale for
    choices.


    Newmark compares translation activity to an iceberg: “the tip is the translation
    – what is visible, what is written on the page – the iceberg, the activity, is
    all the work you do, often ten times as much again, much of which you do not even
    use” (Newmark, 1988, p. 12). In the era of machine learning, we can use machines
    to explore many areas below the tip of the iceberg, which allows humans to focus
    on the visible part of the translation activity. A human translator is potentially
    a speaker, sharing a majority of the cognitive features with the message originator;
    yet any reconstruction is a new, individual piece of intellectual work, rather
    than a duplicate. On the other hand, computer programs start with a ‘collective’
    perspective, given the vast amount of data they can process. The translator can
    customize the computer''s approach by projecting intentionality on the computer
    program to achieve a workflow that conforms with the translator''s preferences,
    including cognitive ones.'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'A human translator can do better than a machine not due to a particular strength
    in capturing every aspect of the linguistic features of an utterance, but rather
    due to the ability to create an experience with relevant intentionality, tapping
    into potential connections in the hidden part of the iceberg through shared experiences,
    generating empathy in readers'' minds. Communication purposes are satisfied intuitively
    to some degree in this way. It follows then that there is an issue of the sparsity
    of individual human experience, since experience is vast, with unknown, hidden
    potential. As a tool, machine learning can shed light on areas that an individual
    human cannot cover, offering the translator a feel for what it looks like, while
    at the same time, machine learning might also generate new hidden and unexpected
    areas, as ML generates its own rules based on vast amounts of data that no human
    can process.


    # Notes


    +   1 Softmax is often used as an activation function of a neural network. As
