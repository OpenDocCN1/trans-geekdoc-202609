    that a baby has already taken the first steps towards language development before
    birth. A study conducted by Mampe et al. (2009) shows that newborns'' cry melodies
    are shaped by their native languages. In other words, although humans are not
    born knowing language, they are born with an innate ability to develop it.


    In ML, there is an argument concerning whether one should build a language model
