- pgno: 35
  md: 'other artistic work that employs written language can have an aesthetic impact.
    In most cases, what makes a difference is the combination of linguistic units,
    which includes both the units themselves, such as letters or characters, and their
    order. Underlying such an ordered sequence there is meaning.


    In mathematics, a sequence is an enumerated collection of objects in which order
    matters. All language occurrences are sequences of linguistic units. In other
    words, language in itself is mathematical, and mathematics can be a useful tool
    for people to reflect on the nature of language, because as a tool mathematics
    is generic and language-independent. Here the word *tool* does not have a derogative
    meaning. It is a tool because of its strong power of generalization, which is
    so strong that it can be seen as detached from reality. To many mathematicians,
    mathematics contains three great buildings, which are devoted to Geometry, Analysis,
    and Algebra: the study of space, the study of time, and the study of symbols and
    structures (Berlinski, 2011). Saussure''s proposition of language as a system
    of signs with unique internal relationships maps perfectly onto the framework
    of Algebra, as well as that of Analysis when considering the concept of order
    in a sequence that entails the concept of time; that is, one thing happening before
    or after another. Finally, the concept of vectors is closely related to Geometry.
    In mathematics, a vector is a list of numbers. It has both magnitude (size) and
    direction. For example, in a 2D plane, a vector (x, y) represents the coordinate
    of a point. More generally, the vector represents a point in the n-dimensional²
    space.


    With such a powerful thinking tool in hand, the next step is to put it to use
    by finding a domain to unlock its power in practice. In our case, that domain
    is translation, in which people use language to translate and communicate. Generally
    speaking, a domain expert such as a translator, a linguist, or a translation project
    manager is good at reflecting or learning from human-constructed systems, including
    multiple theories about language, such as linguistics, philology, and sociology,
    whereas a technical expert is proficient in using these mathematical frameworks
    to develop relevant computational techniques for natural language processing.
    Both domain and technical experts are the main drivers leveraging ML to magnify
    and scale up human knowledge of translation.


    In reality, the task of translation is no easy matter. Unlike artificial languages
    that have been intentionally devised, usually by a single creator (see Okrent,
    2019), natural languages are highly ambiguous, ever changing and evolving, leading
    to great challenges in applying computer techniques to process natural language,
    as Goldberg (2017) implies:


    > People are great at producing language and understanding language, and are capable
    of expressing, perceiving, and interpreting very elaborate and nuanced meanings.
    At the same time, while we humans are great users of language, we are also very
    poor at formally understanding and describing the rules that govern language.'
