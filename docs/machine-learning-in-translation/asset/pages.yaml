    FIGURE 3.2 Generalization based on semantic and grammatical similarity


    computer program can learn that they play similar roles syntactically and semantically.
    Matrices can be applied to extract features from the distributional structure,
    such as the term-to-term matrices and term-to-document matrices discussed in Section
    3.3.2.1. However, in these models, the length of the vector is generally the size
    of the vocabulary, often between 10,000 and 50,000 words. This is a fundamental
    problem that makes language modeling and other learning problems difficult.


    This problem can be addressed using neural network language models. In these models,
    input and output data are fed to the neural network in order for the neural language
    model to work out fixed-sized feature vectors on its own. Dimensions are learned
    based on the algorithm and do not have an intuitive interpretation like ‘animal’
    or ‘space that can be occupied’ as in earlier examples of manually extracted features.


    # 3.3.2.3 Word2vec


    Word2vec is a technique to learn word embeddings using shallow neural networks.
    In this approach, the vector-space word representations are implicitly learned
    through the input-layer weights, and it has been found that these representations
    are surprisingly good at capturing syntactic and semantic regularities in language
