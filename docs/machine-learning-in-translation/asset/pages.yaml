- pgno: 22
  md: '# Translation and the language industry


    The concept of ‘translation’ requires clarification. Translation is examined in
    this book from a broad perspective, encompassing the theory and practice of written
    and spoken language mediation activities, as well as localization and other forms
    of technology-driven content alignment across languages and cultures. In this
    sense, ‘translation’ is not only a theoretical concept discussed in academic circles
    but also a professional practice in the language industry. When the concept incorporates
    industry practice, many other related activities are involved, for example, business
    operations and project management, which are often addressed under ‘localization’.
    As Pym (2014, p. 119) points out, localization can involve a wide range of tasks;
    it usually concerns information technology and marketing, as well as language
    skills.


    This broad conceptualization of translation involves stages beyond meaning conversion
    in the strict sense in both human and automated translation processes driven by
    machine learning. Although this definition unavoidably touches on specific areas
    such as project management, programming, and marketing, the priority is still
    on translation, which we consider a human-centered activity that uses machine
    learning to automate part of the process. In other words, the emphasis in this
    discussion is placed on the user side of ML translation applications. This allows
    the adoption of a bottom-up approach, starting from the ML frameworks and methodologies
    that are most relevant for translators and other domain experts in translation,
    rather than technical experts who are also drivers leveraging ML to scale human
    knowledge of translation.


    Another significant characteristic of the concept of translation in the context
    of ML is that the widespread implementation of machine translation has gradually
    blurred the boundaries between ‘translating’ and ‘editing’. The trend is toward
    replacing the grind of translation work with machines, and humans mostly performing
    editing tasks to ensure quality. In a typical machine translation post-editing
    (MTPE) scenario, for example, human translators start with MT output. In an interactive
    MT scenario, humans are editing what the system suggests, even though they may
    feel like that they are ‘translating’. We discuss this in Chapter 4.


    Similarly, the term ‘translator’ as a root concept encompasses various roles in
    translation and localization processes, including those of linguists, localization
    project managers, and other domain experts. In a typical translation process,
    the fundamental productivity lies in translating, from which other translation-related
    activities are derived. Although participants in other roles, such as linguistic
    analysts and project managers, do not necessarily translate, they add value to
    the translation product by managing human and linguistic assets, preparing and
    analyzing source texts, and editing target texts. They can also work with the
    translation product indirectly, e.g., by using parallel corpora to train their
    NMT engines to improve the quality of the product, rather than directly working
    with the results produced by human and machine translators. In this book, the
    term ‘translator’ is used in this broad sense.'
