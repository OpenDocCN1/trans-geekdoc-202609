    QuEst++ is a new release of QuEst. QuEst++ includes support for word-, sentence-,
    and document-level QE. It also provides pipelined processing, whereby predictions
    made at a lower level (e.g., words) can be used as input to build models for predictions
    at a higher level (e.g., sentences). QuEst++ allows the extraction of a variety
    of features and provides machine learning algorithms to build and test QE models.
    Its feature extraction module can extract a variety of attributes from text at
    three levels of granularity. These are then passed to the machine learning module,
    which employs them to build a robust QE model (Specia et al., 2015, p. 116).


    Tuan et al. (2021) proposes a technique that does not rely on examples from human
    annotators and instead uses synthetic training data. Their research findings show
    that the resulting models perform comparably to models trained on human-annotated
    data, both for sentence and word-level prediction. This is an area showing potential
    for further exploration. With the rapid improvement of machine learning technologies,
    QE is becoming more reliable in estimating quality and predicting the required
