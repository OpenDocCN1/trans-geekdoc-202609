  md: 'performance and future learning” (p. 3). This definition is largely based on
    learners’ developmental processes. In this chapter, however, we approach this
    concept from the inner workings of machine learning. Mathematical and statistical
    theories can be used to model the inferences that occur in human learning.


    # 8.2.1 The mathematical analysis of learning processes


    In statistical learning theory, the learning problem is considered a problem of
    finding a desired dependence using a limited number of observations (Vapnik, 2000,
    p. 17). The first model of a learning machine is called the perceptron, which
    Rosenblatt (1958) developed. It initiated the mathematical analysis of learning
    processes (Vapnik, 2000, p. 1). What is unusual about Rosenblatt''s model is that
    it can be generalized. “The perceptron was constructed to solve pattern recognition
    problems; in the simplest case this is the problem of constructing a rule for
    separating data of two different categories using given examples” (p. 2). This
    is different from other types of learning machines that were considered from the
    very beginning as tools for solving real-life problems (p. 7).


    Vapnik (2000) describes a general model of learning from examples through three
    basic components: (1) a generator (G) of random vectors x, (2) a supervisor (S),
    and (3) a learning machine (LM), which observes the pairs (x,y) (the training
    set). The supervisor (S) returns an output value y to every input vector x, according
    to a conditional distribution function of y given x, or F(y|x). The learning machine
    (LM) observes the training set, made up of pairs of x and y. After training, on
    any given value x, the machine returns a value ŷ, the predicted value of y, also
    known as the dependent variable. The predicted value ŷ is expected to be close
    to the supervisor’s response y. In this model, learning is a problem of choosing
    from the given set of functions the one (ŷ) that best approximates the supervisor’s
    response (y) (p. 18).


    Vapnik (2000) identifies a paradigm shift in addressing the fundamental question
    in statistics: “What must one know a priori about an unknown functional dependency
    in order to estimate it on the basis of observations?” (p. ix). According to Fischer’s
    paradigm from the 1920s and 1930s, the answer was restrictive: “one must know
    almost every-thing” (p. ix). The paradigm shift from the 1960s to the 1980s showed
    that “in order to estimate dependency from the data, it is sufficient to know
    some general properties of the set of functions to which the unknown dependency
    belongs” (p. ix). This second paradigm offers the fundamental principle of statistical
    machine learning: in order to statistically analyze the entire group (a population),
    one can collect a subset of the population data (sampling) and analyze the dataset
    to draw conclusions about the population (inferencing), with a certain level of
    significance. This method of inference is based on statistical techniques. In
    this approach, the size and quality of the sample is a significant factor for
    the accuracy of the statistical model (pp. ix–xi).


    The relationship between sampling and population also explains why a learning
    machine is data hungry. In order to draw inferences about the population from'
  merge: -1
  img_proc: true
