  md: '# # CONVERGENCE OF TWO APPROACHES TO TRANSLATION


    # ## KEY CONCEPTS


    +   * The traditional human approach to translation is converging with machine
    learning from the linguistic, communicative, and mathematical perspectives.

    +   * In machine learning and neural network language models, words are represented
    as real value vectors, which offer a new perspective on the nature of translation.

    +   * Distributed representations in a neural network language model provide a
    feasible solution to describe sense-component relationships and can simulate the
    inner workings of meaning.


    # ### 1.1 Introduction


    Translation, first and foremost, is a human activity. It originates out of the
    necessity of communication. When examining the history of translation, three characteristics
    stand out. The first is that translation practice is the foundation of translation
    studies as a discipline, which has a very short but lively history (Gentzler,
    2014, p. 14; Holmes, 1972/2004). Although philosophical writing about translation
    stretches back to antiquity, the focus tends to be on practice, with for example
    Horace and Cicero, and other poets and philosophers in the Western tradition,
    discussing aspects of word-for-word and sense-for-sense translation in the first
    century BC (Ghanooni, 2012, p. 77). The second is the interdisciplinary nature
    of translation studies, widely recognized and discussed in the field. The third
    is that there are technology tools and computer applications associated with computational
    linguistics, computer engineering, and software engineering, among other areas,
