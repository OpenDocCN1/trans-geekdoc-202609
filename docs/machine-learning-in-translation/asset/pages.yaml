  md: 'Distributional models of meaning “are generally based on a co-occurrence matrix,
    a way of representing how often words co-occur” (Jurafsky & Martin, 2020, p. 101).
    Co-occurrence matrices generally start with a count vector based on units at various
    levels (term, sentence, document), and the count vector can be further converted
    to more powerful representation such as embeddings. It is important to understand
    some basic units in a neural language model, such as tokens and word types, as
    these units will affect how count vectors are generated.


    Finally, the concept of levels of analysis is crucial for data annotation. Starting
    around 1990, many resources were used to create large, annotated treebanks and
    other linguistic resources. For example, Universal Dependencies (UD) is a framework
    for morphosyntactic annotation of human language. UD treebanks are now widely
    used in natural language processing research, including research on syntactic
    and semantic parsing (Marneffe et al., 2021, pp. 255–256). Syntactic parsing has
    been a central task in natural language processing because of its importance in
    mediating between linguistic expression and meaning. For example, much work has
    shown the usefulness of syntactic representations for subsequent tasks such as
    relation extraction, semantic role labeling, and paraphrase detection (Socher
    et al., 2013, p. 455). To build an automated syntactic parsing system, annotated/labeled
    data are needed for modeling a supervised classifier at a certain level or levels
    of analysis (see Chapter 7).


    # 2.2.5 Translation memory: a case study for a balance of form and meaning


    Translation Memory (TM) is a fundamental component of modern computer-assisted
    translation (CAT) tools. It is a language technology that enables the translation
    of segments (phrases, sentences, paragraphs) of documents by searching for similar
    segments in a database and suggesting matches that it finds (Raya, 2005). In a
    TM editor, a larger piece of textual information can be segmented into smaller
    segments. The segmentation is based firstly on an automatic rule that is typically
    defined in a TMX file. TMX is the Translation Memory eXchange format; it allows
    the transfer of translation memories from one translation tool to another (Localization-Related
    Formats, 2002). In TMX, the ‘segtype’ attribute (on the fourth line in Figure
    2.1) defines the segtype attribute, which can have several values, e.g., ‘block’,
    ‘paragraph’, ‘sentence’, and ‘phrase’ (TMX Implementation Notes, n.d.). That is
    to say, an automatic segmentation tool such as a conventional TM system can segment
    the larger piece of information by phrase, sentence, paragraph, or block. The
    ‘block’ value is used “when the segment does not correspond to one of the other
    values, for example when you want to store a chapter composed of several paragraphs
    in a single <tu>” (TMX Implementation Notes, n.d.). A <tu> element indicates a
    translation unit, which includes both the source and target segments. Figure 2.1
    provides an example using the sentences This is an example. We wrote a TMX document
    to show how it works. In this case, segtype=“sentence” (in bold). Following this
    segmentation rule, the TM engine will segment the text into sentences. Figure
    2.1 thus shows two translation units: This is an example. and We wrote an TMX
    document to show how it works.'
