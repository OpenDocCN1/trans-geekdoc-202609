  md: 'syntactic dependencies) across different human languages. These annotation
    activities provide a broad range of real-world data with human insights and are
    valuable resources for linguistic analyses.


    From the ML perspective, human annotation seemed very inefficient and slow when
    first introduced. However, the approach turned out to be very successful, as the
    annotation offers many benefits that other approaches cannot provide:


    +   1 Generally speaking, human annotation offers high-quality data annotation
    examples, which can be used to train automatic annotation models such as syntactic
    parsers and POS (part of speech) taggers. This means reuse of human labor, that
    is to say, human annotation efforts are embedded in all potential projects that
    leverage the automatic annotation models based on the initial human inputs.


    +   2 Human annotation offers a method of system evaluation: serving as the ‘ground
    truth’ or ‘gold standard’, human annotation data can be used to evaluate tools,
    similar to how human translations serve as reference translations in automatic
    machine translation metrics.


    +   3 Human annotation offers new capabilities that automatic systems cannot yet
    cover: the more annotated data is used to train the model, the smarter it becomes,
    and the closer we come to universal usability. Humans are very creative in generating
    data, which an existing model based on previous human observation cannot fully
    capture. Humans always take the lead to push the boundaries of data with new feature
    patterns.


    # 7.4.4 Automatic annotation


    Tagging, or annotation, can also be automated. Computer programs that tag an uncoded
    corpus are called taggers. POS taggers, some of the earliest programs, make use
    of resources and methodologies such as dictionaries and probabilities with a rule-based
    component and a morphological analyzer. Parsers are programs that add syntactic
    analysis to a corpus, identifying subjects, verbs, objects, and more complex syntactic
    information (Biber et al., 1998, pp. 260–262).


    Neural networks have also been integrated into the architecture of automatic labeling
    programs. For example, Qi et al. (2020) introduce Stanza, an open-source Python
    natural language processing toolkit that supports 66 human languages. This toolkit
    features a neural pipeline that takes raw text as input and produces annotations
    including “tokenization, multi-word token expansion, lemmatization, POS and morphological
    feature tagging, dependency parsing, and named entity recognition” (p. 101). It
    is worth noting that the concept of annotation is broadened in their study, as
    they also consider NLP activities such as tokenization, sentence segmentation,
    and lemmatization to be annotations in this project. They tokenize the raw text
    and group tokens into sentences as the first processing step, which “is modeled
    as a tagging problem over character sequences, where the model predicts'
