  md: 'These characteristics lay out foundational considerations about the nature
    of translation:


    +   1 At its core, translation is a human practice, with the facilitation of communication
    as its basic function.

    +   2 Humans are creative when using language and translating, and although many
    disciplines can contribute to the study of translation, none can address exclusively
    and entirely the problem of translation, making them individually unsuitable to
    address translation practice as a whole.

    +   3 The study of language and the study of translation are inextricably linked
    – many epistemological translation constructs originate from the study of language
    and application of linguistic constructs to translation.

    +   4 While technology tools and computer applications provide a means to do translations,
    they also offer a new dimension when thinking about the nature of translation;
    they are thus both a methodology and a theoretical framework.


    These considerations lead us to think of a well-known, over 2,500 year-old quotation
    attributed to Confucius: *There are three methods to gaining wisdom. The first
    is reflection, which is the highest. The second is imitation, which is the easiest.
    The third is experience, which is the bitterest.* To some degree, these three
    methods describe aspects of translation practice over the centuries, except that
    with the rise of computer science in modern times, translators are now able to
    reflect on translation practice and gain translation experience not only by using
    their own minds but also electronic resources. These developments have led to
    more diverse participants becoming involved in translation-related activities,
    including technology experts who focus on developing computer applications and
    now feature prominently. These applications attempt to simulate human processes
    by using machines to practice translation. They are augmenting, magnifying, and
    scaling up human knowledge and capability in this area. The rise of technological
    power in translation leads us to rethink the traditional roles of translators
    and linguists. In this new collaborative relationship between humans and machines,
    translators are also domain experts and pioneers in new ways of practicing translation.
    They support the development of computer applications produced by technical experts,
    while simultaneously being empowered by these applications and, quite importantly,
    finding new opportunities to reflect on their translation experience.


    The rise of this technology dimension allows us to identify two fundamental approaches
    to translation. One is linguistic and represents humans’ intuitive and empirical
    reflection on translation practice from the interdisciplinary perspectives of
    translation studies. The other is mathematical and represents computer processing
    of linguistic information and translation data, which is fundamentally based on
    numbers, rather than texts. The focus of this book is on the relationship between
    machine learning and translation, which in theory and practice should not be'
  merge: -1
  img_proc: true
