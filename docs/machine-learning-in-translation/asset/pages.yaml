  md: '# # 6


    INTENTIONALITY AND NLP TASKS IN TRANSLATION


    # ## KEY CONCEPTS


    +   - In an MT-driven translation process, a translator is more likely to guide
    and support translation-related NLP tasks than the core MT technology.

    +   - From the perspective of machine learning, there are two basic categories
    of translation-related NLP tasks: facilitation and intelligent tasks. Facilitation
    tasks help users improve productivity, whereas intelligent tasks support the development
    of their customized or personalized ML models.

    +   - NLP tasks relevant to a continuous translation process are based on purposes
    in specific use cases. Machines do not possess intentionality, which is solely
    in the minds of humans.


    # ## 6.1 Introduction


    Many natural language processing (NLP) tasks can facilitate ML–driven automation
    in translation processes. These tasks do not necessarily fall into the category
    of meaning conversion, i.e., translation proper. As stated in Section 4.1 of Chapter
    4, it makes sense to discuss these technologies in a larger context such as localization,
    which takes place within a larger commercial and developmental framework involving
    the expertise of translators, language and tools specialists, programmers, engineers,
    project managers, desktop publishing specialists, and marketing staff (Folaron,
    2006; cited in Byrne, 2009, p. 2).


    As mentioned under ‘Natural language processing and translation’ in the Introduction
    to the book, there are three approaches to NLP: symbolic, statistical, and connectionist.
    Connectionist models usually take the form of neural networks, which are composed
    of a large number of very simple components wired together. In this book, we will
    examine the connectionist approach in the context of neural'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'network models. In 2016, when commercial neural MT was launched, translation
    research and practice stepped into a new neural NLP era. This chapter is set in
    this general context.


    Two basic translation concepts shape the discussion: (1) language as a sequence,
    and (2) conversion of meaning and of form associated with meaning, which includes
    interlingual machine translation as well as intralingual translation, such as
    from the spoken to written form of a language. First, in the neural NLP approach,
    language is an inherently temporal phenomenon, consisting of sequences that unfold
    in time. Second, the translation of meaning and form is basically a conversion
    problem. Therefore, many translation-related NLP tasks – e.g., optical character
    recognition (OCR), automatic speech recognition (ASR), as well as machine translation
    (MT) itself – are based on the sequence transduction model. In addition, some
    activities beyond the meaning conversion step do not involve conversion challenges,
    e.g., domain detection, language detection, and automatic terminology extraction.
    These activities can be captured by other neural network models such as sequence
    classification. In both cases, data representation is a crucial component supporting
    effective machine learning. It determines how much useful information can be extracted
    from raw data for further classification or prediction. Such language data tasks
    constitute a considerable amount of the translator’s work in ML-driven translation.


    These sequence models can be further customized into specific NLP tasks with relevant
    language data to meet various purposes. NLP tasks can be designed for pertinent
    human needs, and the list of potential neural NLP tasks is dynamic and open-ended.
    This chapter provides a rough classification of the translation-related NLP tasks
    based on three considerations.


    First, this chapter addresses pertinent NLP tasks that are designed with the user
    in mind: translators, linguists, localization project managers, and other domain
    experts. The discussion does not focus on how to develop these technologies but
    rather how to fully draw upon users’ knowledge and expertise to effectively customize
    and utilize them. In other words, NLP tasks are selected and classified from the
    perspective of a translator in a translation process, not whether they are suitable
    for a model customization process or generic data management or annotation project.
    This user focus is important, because the translation process needs to be driven
    ultimately by humans, rather than machines.


    Second, when a translator customizes and uses NLP tasks in the translation process,
    there must be a reason behind it. A translator executes tasks, such as source
    text analysis, term extraction, and text alignment, before, during, and after
    translation in order to improve productivity, ensure quality, and curate language
    data. While user purpose and intent must be analyzed on a case-by-case basis,
    they can be identified in the continuous translation process and categorized based
    on human need (see Section 6.3).


    Third, this chapter distinguishes between purpose and intentionality as concepts
    when determining what NLP tasks are needed and how they should be customized in
    order to leverage the power of machine learning effectively. In this chapter,'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'purposes are task-specific and can be analyzed on a case-by-case basis, whereas
    intentionality illuminates the relationship between humans and machines from a
    philosophical perspective. The concept of intentionality proposed by Searle (1980)
    is borrowed from AI research to illustrate our position on the relationship between
    humans and machines.


    # 6.2 Classification of NLP tasks from the ML perspective


    # 6.2.1 Two types of NLP tasks


    From the perspective of machine learning, there are two basic categories of translation-related
    NLP tasks: facilitation and intelligent tasks. Facilitation tasks help users improve
    their productivity. Technologies for these tasks are used to augment human intelligence
    by automating a designated step without requiring the translator to input, update,
    or annotate language data. The relationship flows in one direction from machine
    to user, and the user does not feed language data back into the machine to train
    it and further develop the ML model.


    In addition to improving translator productivity, intelligent tasks, the other
    type of NLP task, help translators develop their own ML models. Performing these
    NLP tasks entails not only using the tools to translate but also feeding data
    into the engines to improve their artificial intelligence. Machine training is
    a significant aspect of these tasks. When working with intelligent tools, translators
    need to focus on the translation tasks as well as language data associated with
    them. Translation is only part of the overall task, and model development is continuous,
    as language data such as terminology, translation memory, and relevant annotations
    are accumulated and processed according to specific purposes.


    For intelligent NLP tasks, machine training and translation tasks can be conducted
    in two ways: (1) simultaneously: in an interactive MT environment, a translator
    edits the MT suggestions to finish the translation task while at the same time
    the edited data are sent back to the MT engine to train the machine; or (2) separately:
    language data such as termbase and translation memory are collected from a CAT
    tool and compiled in a parallel corpus, which then is used to train an NMT engine.


    Here the task classification is project-based, from the translator’s perspective,
    rather than technical. When a neural network model for a particular NLP task is
    optimized directly through the translator’s input or additional work on language
    data (e.g., annotation), it is considered an (artificial) intelligent task. If
    a NLP task involves machine learning but the model training is not directly relevant
    to the translation profession, it is still considered a facilitation task that
    mainly aims to assist translators. For instance, OCR is a seq2seq (sequence to
    sequence) ML task, but usually the post-recognition verification is conducted
    by a monolingual person instead of a translator. In this case, the OCR task is
    mainly a facilitation tool for the translator, though it may be an intelligent
    tool for other users. In'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'contrast, when a translator plays an important role in creating and ensuring
    the quality of the training data for a model, e.g., the NMT task involves training
    and testing data for MT, it is primarily an intelligent tool. In other words,
    the final criterion to decide whether a task is intelligent or not for a translator
    must be considered on a case-by-case basis. If the translator uses a tool to conduct
    a NLP task without updating the system with data, it is a facilitation task. In
    contrast, if there is a two-way relationship between the translator and the NLP
    model, i.e., the translator performs the NLP task while also training the system,
    it is an intelligent task.


    # ## 6.2.2 Purposes of neural network models in translation


    In machine learning, a translator’s primary task is not model development, but
    rather manipulating language data as input and output of the model. Nevertheless,
    knowledge of some basic neural network models and their functioning in a continuous
    translation process can help the translator better understand relevant NLP tasks
    as well as the role that the translator does have in model development. Language
    data produced by the translator can be used to address two general NLP challenges:
    sequence classification and sequence prediction. Strictly speaking, in machine
    learning, classification is essentially a predictive modeling problem. But instead
    of producing another sequence, as is the case in a seq2seq model, in a classification
    task, a class label is predicted for a given string of input data.


    Both prediction and classification are fundamentally sequential problems. As Jurafsky
    and Martin (2020) state, "[[l]anguage is an inherently temporal phenomenon” and
    “this temporal nature is reflected in the algorithms we use to process language”
    (p. 181). In machine learning, an artificial neural network (ANN) such as Transformer
    and recurrent neural network (RNN) are able to capture the temporal aspects of
    language as a powerful sequence learning architecture.


    # ### 6.2.2.1 Sequence prediction


    As discussed in Section 4.3.4 of Chapter 4, a Neural MT system is essentially
    a sequence transduction model with an encoder-decoder structure. In this approach,
    similar to other sequence transduction models, embeddings are learned from training
    data so as to convert the input and output tokens to vectors of dimension.


    As discussed in Sections 4.3.4.2 and 4.3.4.3 in Chapter 4, RNN-based language
    models process sequences one word at a time, which may lead to a loss of relevant
    information and to difficulties in training when passing information forward through
    an extended series of recurrent connections. Moreover, the inherently sequential
    nature of recurrent networks inhibits the use of parallel computational resources,
    preventing them from being trained with large amounts of data'
  merge: -1
  img_proc: true
- pgno: 124
  md: '(Jurafsky & Martin, 2020, p. 190; Vaswani et al., 2017). To address this challenge,
    Vaswani et al. (2017) proposed the Transformer, “a model architecture eschewing
    recurrences and instead relying entirely on an attention mechanism to draw global
    dependencies between input and output” (p. 2), which allows the use of parallel
    computations and a higher training efficiency.


    For a sequence prediction task, usually the language data directly created by
    humans – through human translation, spelling check, and transcription – can be
    used to train the machine, although additional processing might be needed, such
    as data cleaning, segmentation, and source-target text alignment. In machine translation,
    human translation is used to generate parallel corpora to train an NMT engine.


    # ## 6.2.2.2 Sequence classification


    The encoder-decoder artificial neural networks such as RNNs can also be used to
    classify entire sequences rather than the tokens within them. Examples include
    domain detection, quality estimation, and sentiment analysis. In these applications,
    sequences of text are classified as belonging to one of a small number of categories.


    Classifying documents into different topic categories can be a useful pre-processing
    step in translation. For example, to apply RNNs in this setting, the text to be
    classified is passed through the RNN word-by-word, generating a new hidden layer
    each time. The hidden layer for the final element of the text is taken to constitute
    a compressed representation of the entire sequence. In the simplest approach to
    classification, the hidden layer for the final element of the text serves as the
    input to a subsequent feedforward network, in which the computation proceeds iteratively
    from one layer of units to the next as discussed in Chapter 3, that chooses a
    class via a softmax¹ over the possible classes.


    Xing et al. (2010) summarize three large categories of sequence classification
    methods:


    +   1. Feature-based classification, which transforms a sequence into a feature
    vector and then applies conventional classification methods.

    +   2. Sequence distance-based classification, which measures the similarity between
    sequences to determine the quality of the classification.

    +   3. Model based-classification, which uses a hidden Markov model (HMM) and
    other statistical models to classify sequences.

    +   (p. 3)


    Classification tasks need category labels, which usually start with human annotation,
    i.e., human judgments as to the category. However, some unlabeled data share common
    features with labeled data and also contain additional features that may provide
    a more comprehensive description of a class. By incorporating unlabeled'
