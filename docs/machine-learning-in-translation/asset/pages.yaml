    and comparable bilingual corpora is a topic that has been widely discussed in
    the translation studies literature (e.g., Munday et al., 2022; Bowker & Pearson,
    2002). For example, Munday et al. (2022) point out that comparable bilingual corpora
    “are normally specialized collections of similar STs in the two languages” and
    “can be ‘mined’ for terminology and other equivalents” (p. 86). While acknowledging
    the wide literature in this research field, our discussion on source-text oriented
    comparable corpora is mainly focused on their application in ML as well as using
    ML perspectives to complement humans’ intuitive reflections on terms and their
    associated meaning and concepts.


    Terminology in the source text can help a translator retrieve relevant documents
    for specialized knowledge acquisition. In translation, the source text is the
