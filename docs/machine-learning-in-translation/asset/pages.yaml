    This is a mathematical theory of communication, in which Shannon and Weaver (1964)
    emphasize the statistical nature of messages. Specifically, information associated
    with the communication process, in which messages or signals are generated, "is
    determined by the statistical character of the process – by the various probabilities
    for arriving at message situations and for choosing" the next symbols (pp. 17–18).
    Shannon and Weaver even make an analogy between ''information'' and the concept
