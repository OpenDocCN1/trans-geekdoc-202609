    # 7.4.5 Annotation and markup language


    From the technical perspective, most annotation projects use some form of XML
    to encode the tags, and therefore it is helpful to have a basic understanding
    of markup languages in order to effectively use these standards in actual annotation
    tasks. A markup language is a human-readable computer language that uses tags
    to define elements within a document. The two most popular and also most relevant
    markup languages for tokenizers are HTML (HyperText Markup Language) and XML (eXtensible
    Markup Language). HTML is used for creating webpages by formatting information
    on the page, whereas XML was designed to store and transport structured data.
    While HTML documents use predefined tags, XML files use custom tags to define
    elements. Localization-related data exchange formats are mostly based on XML.
    They include (1) TMX format (Translation Memory eXchange), which “allows the transfer
    of translation memories from one translation tool to another”; (2) TBX (TermBase
    eXchange) format, which “allows the transfer of glossaries from one translation
