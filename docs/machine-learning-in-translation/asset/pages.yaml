  md: "own utterances. Prediction during comprehension allows the interpreter to reduce\
    \ the lag between input and output and therefore reduce demands on memory. It\
    \ also frees up capacity to focus attention on production and self-monitoring.\
    \ Prediction in interpreting is not limited to comprehension; rather, simultaneous\
    \ interpreters sometimes produce the translated utterance before it has been uttered\
    \ in the source language, a form of predictive production (Amos & Pickering, 2020,\
    \ p. 707).\n\nChernov (2004) proposes a model of the interpreting process that\
    \ is centered on the psycholinguistic mechanism of “probability anticipation”\
    \ (p 91) as investigated in experiments with manipulated input material (Pöchhacker,\
    \ 2010, p. 160). Specifically, the probability anticipation model hypothesizes\
    \ that the basic mechanism making SI possible is the probability anticipation\
    \ of the development of the message (Chernov, 2004, p. 199). Chernov (2004) states\
    \ that\n\n> the simultaneous interpreter’s brain generates hypotheses in anticipation\
    \ of certain verbal and semantic developments of the discourse. These hypotheses\
    \ are based on subconscious subjective estimates of the range of probabilities\
    \ within which the given verbal or semantic situation can develop further. In\
    \ subsequent processes, the interpreter either confirms or rejects hypotheses\
    \ by checking against critical points of the on-going discourse, concurrently\
    \ on several levels.\n> \n> (p. 93)\n\nChernov (2004) further points out that\
    \ Markov chains or similar linear sequences of elements cannot fully explain speech\
    \ and postulates that “message development probability anticipation is a multi-level\
    \ mechanism, operating on a hierarchy of levels” (p. 92).\n\nThe concept of prediction\
    \ probability is useful when visualizing the cognitive activities associated with\
    \ prediction in translation and interpreting. In natural language processing,\
    \ predictive language models (LMs) are an approach to examining this cognitive\
    \ area by means of mathematical formulations, as LMs can produce results that\
    \ are to some extent consistent with human prediction in language comprehension\
    \ and generation.\n\n# 3.2 Language models\n\n# 3.2.1 Language models for both\
    \ humans and machines\n\nAs mentioned in Chapter 1, language is very unique compared\
    \ with other human creations. In language use, a specific context triggers humans\
