    # 9.4.4 Building a learning platform for both educators and learners


    Technology is attractive not because of the technology itself, but because communication
    with it is so engaging. For a computer expert or a passionate gamer, what captivates
    their attention is the interaction. Unlike humans who in many cases do not give
    a response, machines always diligently provide you with an answer, even though
    sometimes it is unsatisfactory, which can motivate you to keep engaging with it.
    This is human nature: you are interested in something not because the thing itself
    is interesting, but ultimately you find it interesting because it is relevant
    to you and satisfies your own needs when you engage with it.


    Following this train of thought, we propose establishing a learning platform with
    personalized systems for both educators and learners, as educators are also advanced
    learners, which incorporates both top-down and bottom-up knowledge and learning.
    The personalized feature will allow learners to select the most relevant knowledge
    and exercises to develop their skills. The platform can be both personal and communicative.
    Learners can have their own personalized system but be able to learn together
    with others in their learning community as they customize and accomplish a NLP
    task together. This community supports beginners and advanced learners, including
    educators and experienced translators in their (continuous) learning as they translate
    and localize together.


    This learning system can also help learners create, collect, update, manage, and
    secure their data resources. In Chapter 8, we discussed the collective features
    of ML technologies. An ML system does not correspond to multiple people similar
    to NMT customization but rather is tailored to individuals, each of whom has their
    own internal multilingual language model for processing natural languages in the
    communication process. The collective, general ML system is the starting point
    for personalization. Compared with customization that is indirectly working with
    data generators, a personalized ML system has a much higher probability of being
    similar to a person''s internal language model, and the similarity between these
    two models will more likely lead to satisfactory results generated by ML systems,
    in the sense that the results are consistent with what a human language model
    might produce. In addition, personalized ML systems mean humans have better control
    and interaction with the language data in the translation process. Learners can
    use the data for multiple NLP tasks and also find patterns.


    # 9.5 The value of educators in the ML context


    As Webb et al. (2021) point out, ML systems are “infiltrating our lives and beginning
    to become important in our educational systems” (p. 2109). While educators'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'are beginning to use ML methodology and frameworks to innovate our pedagogy,
    as Webb et al. (2021) demonstrate, the role of educators in the human learning
    process requires more attention. Now more than ever is the question pertinent:
    With the growing influence of ML, what is the true value of the educator? In a
    world of digitized information at our fingertips, we argue that an instructor
    has an essential role in helping make sense of information, which can be unstructured
    and disorganized, and in developing technology and information literacy in students,
    which is an essential part of a communicative, human-centered approach to teaching
    by leveraging ML capabilities. That is to say, human learners need to interact
    with other humans and build their shared environment, which is the physical reality
    on which more abstract knowledge is built. Human instruction is helpful and needed
    not just because of the quality of information it can provide, but because of
    the empathy instructors share with their learners. Humans share similar experiences
    and feelings about language as well as the physical and mental worlds that are
    conveyed and made sense of through language. Starting from this common ground,
    learners can verify their hypotheses and inference models with the support of
    educators as advanced learners, making generalization on a larger scale and transfer
    to different tasks possible and useful. ML technologies can help instructors focus
    on the human part of teaching, rather than replacing human instruction.


