    # 3. Results


    We were interested in the effectiveness of CpG island features in COVID-19 classification.
    After CpG island features were extracted using Equation 1 and Equation 2, they
    were classified by using the machine learning techniques, which were support vector
    machines, naive Bayes, k-nearest neighbor, and random forest. Weka-3-8-4 tool
    [20] was used to perform machine learning classifications. The numerical results
    were obtained by using a computer with Linux operating system, 16 GB RAM, and
    2.7 GHz processor. Performance of each classifier was measured in terms of precision,
    recall, F-measure, and accuracy. The tenfold cross-validation strategy was applied
    and results are reported in Table 2. Moreover, Figure 2 visualizes precision,
    recall, F-measure, and accuracy values. The maximum classification accuracy was
    93%, which was obtained using random forest with CpG island-based features. The
    machine learning models used in this study with the proposed features predicted
    COVID-19 sequences in high accuracy. This underlines the efficiency of the proposed
    method.


    # Table 2. COVID-19 classification results (10-fold cross-validation).


    | Method | Precision | Recall | F-measure | Accuracy |

    |---|---|---|---|---|

    | Support Vector Machine | 0.869 | 0.873 | 0.868 | 0.87 |

    | Naive Bayes | 0.882 | 0.885 | 0.879 | 0.88 |

    | K-Nearest Neighbor | 0.927 | 0.926 | 0.926 | 0.92 |

    | Random Forest | 0.93 | 0.93 | 0.93 | 0.93 |


    ![](img/1c57d3e71276f21d1972f8c8d85cab50_3_0.png)


    # Figure 2. Evaluation of machine learning methods.


    # 4. Conclusions


    In this study, we classified COVID-19 cases from human genome sequences using
    four machine learning methods—support vector machines, naive Bayes, k-nearest
    neighbor, and random forest. Experimental results showed k-nearest neighbor and
    random forest methods with genome-based features gave remarkable results by reaching
    92% and 93% accuracy, respectively. In future studies, we will compare COVID-19
    sequences coming from humans to other types of coronavirus sequences, such as
    those coming from musculus, and propose a similarity-based feature.'
