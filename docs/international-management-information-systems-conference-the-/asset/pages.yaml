    Wang et al. [13] reported that COVID-19 has extremely low CG abundance in its
    open reading frame. They found that CG reduction in COVID-19 can be achieved by
    mutating C/G into A/T. Based on this idea, in this study, we used CpG island features
    to predict the COVID-19 virus. We applied four machine learning techniques—support
    vector machines, naive Bayes, k-nearest neighbor, and random forest. Results were
    evaluated on the 2019 Novel Coronavirus Resource (2019nCoVR) repository [14].


    # ## 2. Material and Method


    In this section, first, we explain how genome sequences were retrieved. Second,
    we explain how distinguishing features were extracted. Finally, we overview the
    machine learning algorithms that we used for prediction of COVID-19.


    # ### 2.1. Dataset


    The 2019 Novel Coronavirus Resource (2019nCoVR) by China’s National Center for
    Bioinformation [14] collects public coronavirus sequences from various databases,
    including NCBI, NMDC, GISAID, and CNCB/NGDC. We downloaded 1000 available COVID-
    19 sequences on August 2020. For non-COVID-19 sequences, 2019nCoVR includes alphacoronavirus,
    betacoronavirus-1, human coronavirus 229E, human coronavirus HKU1, and human coronavirus
    NL63 species. We downloaded all available 334 human coronavirus sequences not
    including COVID-19 on August 2020. Properties of the sequences are also given
    in Table 1. All sequences were complete genome sequences that were about 30 kbp,
    and host waschosen as Homo sapiens.


    # ### Table 1. Sequence properties. The 2019 Novel Coronavirus Resource (2019nCoVR)
    naming convention was used.


    | Human Coronaviruses | The Number Sequences | Label |

    |---|---|---|

    | SARS-CoV-2 | 1000 | 1 |

    | Alphacoronavirus | 88 | 0 |

    | Betacoronavirus-1 | 140 | 0 |

    | Human Coronavirus 229E | 27 | 0 |

    | Human Coronavirus HKU1 | 18 | 0 |

    | Human Coronavirus NL63 | 61 | 0 |


    # ### 2.2. Feature Extraction


    The choice of the differentiable features is a critical step to improve recognition
    performance depending on the characteristics of the COVID-19 virus. By using the
    assumption that SARS-CoV-2 exhibits a strong absence of CpG [13,15], we proposed
    the use of CpG island features [16,17], extracted by using Equations (1) and (2).


    ```

    CGp = p(C) + P(G)

    ```


    ```

    CpGo = \frac{p(CG)}{p(C)p(G)}

    ```


    where p(C), p(G), and p(CG) are percentages of C, G, and CG in a sequence. Thus,
    for a given sequence, we presented the two CpG island features. Figure 1 illustrates
    an example of computing the features from a sequence.'
