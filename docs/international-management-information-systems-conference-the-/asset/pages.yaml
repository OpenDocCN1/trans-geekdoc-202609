    Sequence alignment methods, such as BLAST [4] and FASTA [5], perform classification
    using viral sequencing techniques. These methods are based on the assumption that
    DNA sequences share common features [6]. Although alignment-based methods are
    successful in detecting similarities, their application can be challenging in
    most cases [7]. Analyzing thousands of complete genomes using alignment-based
    methods is too expensive. To overcome the difficulties of alignment-based methods,
    alignment-free methods have been introduced [8,9]. Recent studies revealed that
    machine learning techniques have been applied successfully for virus classification
    [10,11]. Reyes, Aviso, and Kari [10] proposed an open-source supervised alignment-free
    method operating k-mer frequencies in HIV-1 sequences. They used support vector
    machines, multilayer perceptron, and logistic regression for classification. They
    demonstrated classification accuracies over 90% in all cases for full length genome
    datasets of hepatitis B, hepatitis C, and influenza A viruses. Randhawa, Hill,
    and Kari [3] proposed a combination of supervised machine learning


