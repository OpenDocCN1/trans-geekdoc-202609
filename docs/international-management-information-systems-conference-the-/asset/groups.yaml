    ## 基于人类基因组数据的COVID-19预测机器学习方法 †


    Hilal Arslan


    计算机工程系，工程与建筑学院，伊兹米尔巴基尔恰伊大学，土耳其伊兹米尔35665；hilal.arslan@bakircay.edu.tr


    † 在第7届国际管理信息系统会议上发表，线上，2020年12月9日至11日。


    **摘要：** 准确识别COVID-19现在是一项关键任务，因为它已严重损害了日常生活、公共卫生和经济。识别感染者对于防止大流行病进一步传播并快速治疗感染患者至关重要。机器学习技术在预测COVID-19方面发挥着重要作用。在本研究中，我们通过从基因组序列中提取特征进行二进制分类（COVID-19
    vs. 其他类型的冠状病毒）。分类使用了支持向量机、朴素贝叶斯、K近邻和随机森林方法。我们使用了2019新型冠状病毒资源数据库中的病毒基因序列。所呈现的实验结果表明，决策树方法达到了93%的准确率。


    **关键词：** 冠状病毒；COVID-19；机器学习；CpG岛


    ## 1. 引言


    冠状病毒（已知包含一些最大的病毒基因组，长度约为30,000个碱基对）是单链正链RNA病毒[1]。冠状病毒科包含四个属，分别是α冠状病毒、β冠状病毒、γ冠状病毒和最近定义的δ冠状病毒。尽管α冠状病毒和β冠状病毒能够感染哺乳动物宿主，但γ冠状病毒和δ冠状病毒主要感染禽类物种[2]。属于β冠状病毒的严重急性呼吸综合征冠状病毒（SARS-CoV）和中东呼吸综合征冠状病毒（MERS-CoV）是引起高致病性结果的人类冠状病毒。由于其人畜共患特性，这两种冠状病毒均可传播给人类，并引起病毒性肺炎、发烧、呼吸困难等症状[3]。一种未识别的肺炎疾病，被认为起源于2019年12月武汉当地海鲜市场，在中国武汉引发了疫情。该病与SARS-CoV存在足够差异，被视为一种新型人类感染性β冠状病毒，并被命名为COVID-19，其正式名称为SARS-CoV-2
    [1]。


    引用：Arslan, H. 基于人类基因组数据的COVID-19预测机器学习方法. Proceedings 2021, 74, 20. https://doi.org/10.3390/proceedings2021074020


    发布：2021年3月16日


    出版社说明：MDPI对已发表地图中的管辖权主张和机构隶属关系保持中立。


    序列比对方法，如BLAST [4] 和 FASTA [5]，利用病毒测序技术进行分类。这些方法基于DNA序列共享共同特征的假设[6]。尽管基于比对的方法在检测相似性方面很成功，但在大多数情况下，其应用可能具有挑战性[7]。使用基于比对的方法分析数千个完整基因组成本过高。为了克服基于比对的方法的困难，已经引入了无比对方法[8,9]。最近的研究表明，机器学习技术已成功应用于病毒分类[10,11]。Reyes、Aviso和Kari
    [10] 提出了一种开源的监督无比对方法，用于对HIV-1序列中的k- mer频率进行操作。他们使用支持向量机、多层感知机和逻辑回归进行分类。他们在肝炎B、肝炎C和流感A病毒的全长基因组数据集的所有情况下，都证明了分类准确率超过90%。Randhawa、Hill和Kari
    [3] 提出了一种结合监督机器学习与数字信号处理的方法，用于准确且可扩展的基因组注释。他们将基因组序列映射为离散值，以应用数字信号处理技术。他们准确地分类了登革热和流感等病毒的可塑基因组。Reyes
    et al. [12] 提出了一种基于内在基因组签名的无比对方法，可提供高度准确的实时分类学预测。他们使用了决策树方法，并用Spearman秩相关系数分析对其进行了确认。


    Wang等人 [13] 报告称，COVID-19在其开放阅读框中具有极低的CG含量。他们发现，COVID-19中的CG减少可以通过将C/G突变为A/T来实现。基于这一想法，在本研究中，我们使用CpG岛特征来预测COVID-19病毒。我们应用了四种机器学习技术——支持向量机、朴素贝叶斯、k近邻和随机森林。结果在2019新型冠状病毒资源（2019nCoVR）存储库
    [14] 上进行了评估。


    ## 2. 材料与方法


    在本节中，首先，我们解释了基因组序列是如何检索的。其次，我们解释了区分特征是如何提取的。最后，我们概述了用于预测COVID-19的机器学习算法。


    ### 2.1. 数据集


    中国生物信息国家中心 [14] 的2019新型冠状病毒资源（2019nCoVR）从包括NCBI、NMDC、GISAID和CNCB/NGDC在内的各种数据库中收集公共冠状病毒序列。我们于2020年8月下载了1000个可用的COVID-19序列。对于非COVID-19序列，2019nCoVR包括α冠状病毒、β冠状病毒-1、人类冠状病毒229E、人类冠状病毒HKU1和人类冠状病毒NL63物种。我们于2020年8月下载了所有334个不包括COVID-19的人类冠状病毒可用序列。序列属性也列于表1中。所有序列均为约30
    kbp的完整基因组序列，且宿主选择为智人（Homo sapiens）。


    表1. 序列属性。采用了2019新型冠状病毒资源（2019nCoVR）命名约定。


    | 人类冠状病毒 | 序列数量 | 标签 |

    |---|---|---|

    | SARS-CoV-2 | 1000 | 1 |

    | Alphacoronavirus | 88 | 0 |

    | Betacoronavirus-1 | 140 | 0 |

    | Human Coronavirus 229E | 27 | 0 |

    | Human Coronavirus HKU1 | 18 | 0 |

    | Human Coronavirus NL63 | 61 | 0 |


    ### 2.2. 特征提取


    选择可区分的特征是提高识别性能的关键步骤，这取决于COVID-19病毒的特征。利用SARS-CoV-2表现出强烈CpG缺失的假设[13,15]，我们提出了使用CpG岛特征[16,17]，并通过方程(1)和(2)提取。


    ```

    CGp = p(C) + p(G)

    ```


    ```

    CpGo = \frac{p(CG)}{p(C)p(G)}

    ```


    其中，p(C)、p(G)和p(CG)分别表示序列中C、G和CG的百分比。因此，对于给定的序列，我们提出了两个CpG岛特征。图1说明了从序列中计算特征的示例。


    AAAAAAAGTT GCTGACTTT TCCCCCAACT CTGCCGTAGA GGCGGGAGTG GAGGGCGTGT


    C = 13, G = 20, CG = 3, CGp = 0.55, CpGo = 0.05


    **图1.** CpG岛特征。C、G和CG的值分别为13、20和3。因此，CGp = p(C) + p(G) = 0.55，且 CpGo = p(CG) /
    (p(C)p(G)) = 0.05。


    ## 2.3. 机器学习算法


    分类旨在将给定的人类基因组序列分类为COVID-19或非COVID-19。可以使用各种机器学习技术来实现分类。支持向量机、朴素贝叶斯、K近邻和随机森林被用于执行此任务。


    ### 2.3.1. 支持向量机


    支持向量机（SVM）方法是一种监督非参数统计学习技术。因此，它不对底层数据分布做任何假设。它具有多种优势，例如解的稀疏性、全局优化、坚实的理论基础、泛化能力和非线性。在SVM的原始表述中，该方法通过最大化两个类之间的边界，利用一组带有已知标签的观察（即训练集）来找到最优分离超平面。最优分离超平面一词指的是最小化误分类的决策边界。位于边界上的数据子集称为支持向量。新的未标记数据根据其相对于分类器函数的几何位置被分配到一个类。在实践中，属于不同类成员的数据点可能会相互重叠，这使得线性可分性变得困难。通过添加松弛变量，使用软边界方法和核技巧来解决不可分性问题
    [18]。


    ### 2.3.2. 朴素贝叶斯


    朴素贝叶斯（NB）是一种基于贝叶斯定理的常用机器学习分类算法，该定理提供了对任何假设的显式概率评估。该定理指出：


    p(h | T) = \frac{p(T | h) p(h)}{p(T)}  \quad (3)


    其中，P(h)表示假设h的先验概率，P(T)是训练数据T的先验概率，P(T | h)是在给定h时T的概率，P(h | T)是在给定T时h的概率。为了选择可接受的假设，将选择最可能的假设。


    ### 2.3.3. K近邻


    K近邻（KNN）被认为是最简单的非参数分类器之一。它是一种惰性学习算法，不需要任何学习过程。KNN基于k近邻的多数票将新观测值分配到一个类中 [19]。在此步骤中，使用类似欧氏距离的距离。可以使用交叉验证技术定义最佳k值数量。


    ### 2.3.4. 随机森林


    随机森林（RF）分类器是一种用于分类的集成机器学习算法，其工作原理与决策树类似。它使用自助聚合方法进行训练。可以通过对所有单个树的预测进行平均来进行总体预测。当将特征向量作为输入时，随机森林算法


