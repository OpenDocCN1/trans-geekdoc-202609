    # ## 2.3. Machine Learning Algorithms


    The classification was performed to classify the given human genome sequences
    into COVID-19 or not. Various machine learning techniques can be used to achieve
    classification. Support vector machines, naive Bayes, K-nearest neighbor, and
    random forest were used for performing this task.


    # ### 2.3.1. Support Vector Machines


    The support vector machine (SVM) method is a supervised nonparametric statistical
    learning technique. Therefore, it does not make any assumption on the underlying
    data distribution. It has various advantages, such as the sparsity of the solution,
    global optimization, solid theoretical foundation, generalization, and nonlinearity.
    In the original formulation of SVMs, the method finds an optimal separating hyperplane
    using a broad set of observations with known labels (i.e., training set) by maximizing
    the margin between two classes. The term optimal separating hyperplane refers
    to the decision boundary minimizing misclassifications. The subset of data that
    lie on the margin is called a support vector. New unlabeled data are allocated
    to a class based on their geometric position relative to the classifier function.
    In practice, data points belonging to different class members may overlap one
    another, which makes linear separability difficult. The soft margin method and
    the kernel trick are used by adding slack variables to solve the inseparability
    problem [18].


    # ### 2.3.2. Naive Bayes


    Naive Bayes (NB) is a frequently used machine learning classification algorithm
    based on Bayes’ theorem, which provides evaluation of explicit probabilities for
    any hypothesis. The theorem states that:


    p(h | T) = \frac{p(T | h) p(h)}{p(T)}  \quad (3)


    where P(h) denotes prior probability of hypothesis h, P(T) is prior probability
    of training data T, P(T | h) is probability of T given h, and P(h | T) is probability
    of h given T. In order to choose the acceptable hypothesis the most probable one
    is selected.


    # ### 2.3.3. K-Nearest Neighbor


    K-nearest neighbor (KNN) is known as one of the simplest nonparametric classifiers.
    It is a lazy learning algorithm and it does not require any learning process.
    KNN assigns a new observation into a class with the majority of votes based on
    k-nearest neighbors [19]. In this step, a Euclidean-like distance is used. Optimum
    amounts of k-values can be defined using a cross-validation technique.


    # ### 2.3.4. Random Forest


    Random forest (RF) classifier is an ensemble machine learning algorithm that is
    used for classification and works similarly to a decision tree. It uses the bootstrap
    aggregating method for training. The overall prediction can be done by averaging
