    利用多种决策树，从随机选取的数据子集中构建一棵森林。接着，算法汇总决策树的投票结果，以判断是否预测为 COVID-19。


    ## 3. 结果


    我们研究了 CpG 岛特征在 COVID-19 分类中的有效性。在使用公式 1 和公式 2 提取 CpG 岛特征后，利用支持向量机、朴素贝叶斯、k 最近邻和随机森林等机器学习方法对其进行分类。采用
    Weka 3.8.4 工具 [20] 执行机器学习分类。数值结果是在运行 Linux 操作系统、配备 16 GB 内存和 2.7 GHz 处理器的计算机上获得的。每个分类器的性能按精确率、召回率、F
    值和准确率进行评估。采用了十倍交叉验证策略，结果如表 2 所示。此外，图 2 展示了精确率、召回率、F 值和准确率的数值。最大分类准确率为 93%，通过使用基于
    CpG 岛特征的随机森林获得。本研究中采用所提特征的机器学习模型对 COVID-19 序列进行了高准确率预测。这凸显了所提方法的高效性。


    表 2. COVID-19 分类结果（10 倍交叉验证）。


    | 方法 | 精确率 | 召回率 | F 值 | 准确率 |

    |---|---|---|---|---|

    | 支持向量机 | 0.869 | 0.873 | 0.868 | 0.87 |

    | 朴素贝叶斯 | 0.882 | 0.885 | 0.879 | 0.88 |

    | K 最近邻 | 0.927 | 0.926 | 0.926 | 0.92 |

    | 随机森林 | 0.93 | 0.93 | 0.93 | 0.93 |


    ![](img/1c57d3e71276f21d1972f8c8d85cab50_3_0.png)


    图 2. 机器学习方法评价。


    ## 4. 结论


    在本研究中，我们利用四种机器学习方法——支持向量机、朴素贝叶斯、k 最近邻和随机森林——从人类基因组序列中对 COVID-19 病例进行了分类。实验结果表明，采用基于基因组特征的
    k 最近邻和随机森林方法取得了显著效果，准确率分别达到 92% 和 93%。在今后的研究中，我们将对比来自人类的 COVID-19 序列与其他类型冠状病毒序列（如来源于小鼠的序列），并提出一种基于相似性的特征。


