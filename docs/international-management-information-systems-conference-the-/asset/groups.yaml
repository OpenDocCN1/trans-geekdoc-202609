    # 4. Conclusions


    In this study, we classified COVID-19 cases from human genome sequences using
    four machine learning methods—support vector machines, naive Bayes, k-nearest
    neighbor, and random forest. Experimental results showed k-nearest neighbor and
    random forest methods with genome-based features gave remarkable results by reaching
    92% and 93% accuracy, respectively. In future studies, we will compare COVID-19
    sequences coming from humans to other types of coronavirus sequences, such as
    those coming from musculus, and propose a similarity-based feature.'
