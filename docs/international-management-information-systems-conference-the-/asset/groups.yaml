    # # Machine Learning Methods for COVID-19 Prediction Using Human Genomic Data
    †


    Hilal Arslan


    Department of Computer Engineering, Faculty of Engineering and Architecture, Izmir
    Bakircay University, Izmir 35665, Turkey; hilal.arslan@bakircay.edu.tr


    † Presented at the 7th International Management Information Systems Conference,
    Online, 9–11 December 2020.


    **Abstract:** Accurate identification of COVID-19 is now a critical task since
    it has seriously damaged daily life, public health, and the economy. It is essential
    to identify the infected people to prevent the further spread of the pandemic
    and to treat infected patients quickly. Machine learning techniques have a significant
    role in predicting of COVID-19. In this study, we performed binary classification
    (COVID-19 vs. other types of coronavirus) by extracting features from genome sequences.
    Support vector machines, naive Bayes, K-nearest neighbor, and random forest methods
    were used for classification. We used viral gene sequences from the 2019 Novel
    Coronavirus Resource Database. Experimental results presented show that a decision
    tree method achieved 93% accuracy.


    **Keywords:** coronavirus; COVID-19; machine learning; CpG islands


    # ## 1. Introduction


    Coronaviruses, known to include some of the largest viral genomes (about 30,000
    bps in length), are single stranded positive sense RNA viruses [1]. The family
    of coronaviruses contains four genera, which are alphacoronavirus, betacoronavitus,
    gammacoronavirus, and recently defined deltacoronavirus. Although alphacoronavirus
    and betacoronavirus are able to infect mammalian hosts, gammacoronavirus and deltacoronavirus
    mainly infect avian species [2]. Severe acute respiratory syndrome coronavirus
    (SARS-CoV) and Middle East respiratory syndrome coronavirus (MERS-CoV), which
    belong to betacoronavirus, are human coronaviruses causing highly pathogenic aoutcomes.
    Both coronaviruses can be transmitted to humans due to their zoonotic nature,
    and cause symptoms of viral pneumonia, fever, breathing difficulties, etc. [3].
    An unrecognized pneumonia disease, which is thought to have originated from a
    local seafood market in December 2019, caused an outbreak in Wuhan, China. The
    disease sufficiently diverged from SARS-CoV to be considered a new human-infecting
    betacoronavirus, and it was named COVID-19, which has been officially named SARS-CoV-2
    [1].


    Citation: Arslan, H. Machine Learning Methods for COVID-19 Prediction Using Human
    Genomic Data. Proceedings 2021, 74, 20. https://doi.org/10.3390/proceedings2021074020


    Published: 16 March 2021


    Publisher’s Note: MDPI stays neutral with regard to jurisdictional claims in published
    maps and institutional affiliations.


    Sequence alignment methods, such as BLAST [4] and FASTA [5], perform classification
    using viral sequencing techniques. These methods are based on the assumption that
    DNA sequences share common features [6]. Although alignment-based methods are
    successful in detecting similarities, their application can be challenging in
    most cases [7]. Analyzing thousands of complete genomes using alignment-based
    methods is too expensive. To overcome the difficulties of alignment-based methods,
    alignment-free methods have been introduced [8,9]. Recent studies revealed that
    machine learning techniques have been applied successfully for virus classification
    [10,11]. Reyes, Aviso, and Kari [10] proposed an open-source supervised alignment-free
    method operating k-mer frequencies in HIV-1 sequences. They used support vector
    machines, multilayer perceptron, and logistic regression for classification. They
    demonstrated classification accuracies over 90% in all cases for full length genome
    datasets of hepatitis B, hepatitis C, and influenza A viruses. Randhawa, Hill,
    and Kari [3] proposed a combination of supervised machine learning


