    The other two had had the project but were not directly involved and had never
    seen our visualization.


    Every person we interviewed had an exhaustive tour of our visualization and an
    explanation of all its features. After that, they were given the opportunity to
    look around freely as long as they wanted, and when finished, we conducted a structured
    interview with them to get qualitative feedback.


    All experts that we interviewed found ours helpful. One even suggested they developed
    visualizations of their own but ours were more helpful than all of them. We also
    asked which part of their work could benefit from our visualization and a variety
    of answers could help them find out more layers or neurons are needed in the network.
    While they did not elaborate on how to do that, we suspect that this is because
    of hyperparameters. Using hyperparameters are usually help the experts to determine
    where they are too deep and the visualization is help to get a feeling for the
    size of the network. Additionally the experts mentioned they could determine similar
    feature maps, which filters are activated frequently or if the patterns were learned
    by the network made to some. One of them mentioned that using the case set caused
    a potential error in their interpretation when they were using a pooling layer
    and noticed that it did not appear clearly in the convolutional layer.


    We also asked the experts if they would like to see more networks in a different
    fashion. Two experts mentioned that they would definitely like to see recurrent
    architectures like RNNs. One expert said that the tool could be used for scientific
    purposes but in practical projects they would not have the time to analyze the
    network in that depth.


    We also received criticism and suggestions from the experts. For example one expert
    asked to show only the most important edges of all of them. The same experts requested
    a way to pick one node selected without looking at it, to see the edges from different
    directions. Two experts mentioned that the fully-connected layers were through
    multiple layers, like a tree. Another point was that two experts mentioned it
    were too complicated to reliably gain information from them. Points of criticism
    we received were that it was too difficult to show the individual layers, which
    we flashed when the


    was felt too costly and that the selection was sometimes difficult to see in front
    of a red background.


    # V. CONCLUSION


    We presented an interactive node-link visualization for ANNs based on immersive
    reality. Unlike previous work, our system is targeted at machine learning experts.
    We performed an expert review to test our hypothesis that a node-link visualization
    can help them in their experiments. We perceived the feedback from the experts
    as evidence that our hypothesis holds. More evaluations are needed to perform
    that node-link visualizations can actually improve the workflow of machine learning
    experts. However, we are optimistic that future versions of our visualization
    could be used by experts on a larger scale.


