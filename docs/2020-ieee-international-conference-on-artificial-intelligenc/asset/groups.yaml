    # 2020 IEEE 人工智能与虚拟现实国际会议 (AIVR)


    ## 用于机器学习实验的人工网络沉浸式节点-链接可视化


    Martin Bellgard

    视觉计算研究所

    德国亚琛工业大学 (RWTH Aachen University)


    Christian Schneider

    机械工程信息管理学院

    德国亚琛工业大学 (RWTH Aachen University)


    Torsten R. Kuhlen

    视觉计算研究所

    德国亚琛工业大学


    **摘要—** 人工神经网络（ANN）的黑箱问题仍然是一个且备受关注的问题。在交流 ANN 概念时，它们通常被描绘为节点-链接图。尽管采用了这种策略，但它仍局限于教育背景。我们假设全全
    ANN 的大规模节点-链接图对机器学习实验可能有用。我们开发了一种工具，利用虚拟现实将 ANN 描绘为节点-链接图。将其应用于机器学习研究领域，并针对特定挑战进行了调整。最后，我们通过专家评审以评估该可视化的有用性。事实证明，ANN
    的节点-链接可视化在专业背景下是有帮助的。


    **索引词—** 人工神经网络，分析，节点-链接图


    # I. 引言


    在过去的十年里，ANN 已经成为人工智能领域的标准工具。它们是许多先进方法（例如图像分类、目标检测或语义图像管理领域）中不可或缺的一部分。这些方法仍然是不透明的；理解其含义意味着是一项挑战，通常被称为**黑箱问题**
    [3]。ANN 的行为和可解释性未能被简化到在敏感应用中被接受的程度。因此，可解释人工智能（XAI）领域近期受到了广泛关注 [4]，出现了许多解决黑箱问题的方法。我们建议读者参阅
    [5–7] 中关于解释黑箱模型方法的综述。


    ![](img/c0cbb3a27f44dfb3b0b8e1bcc5443bd8_0_0.png)


    描绘神经网络的常用方法是节点-链接图 [7]。在节点-链接图中，神经元和突触的概念分别由节点和链接表示。然而，ANN 外观的表示变得非常复杂。尽管如此，复杂
    ANN 的视化化很少使用节点-链接图来制作。它们主要用于说明小规模网络，如 [11] 或 [12] 中的许多图所示。还有使用节点-链接图的交互式可视化，例如
    tensorflow playground。其交互式网站允许用户设置小型神经网络的超参数，并观察它们在二维数据集上的行为，虽然无法向初学者教授 ANN 的层，但所描绘的网络仅仅是微小且具有示例性的。据我们所知，本文首次尝试将一个大型
    ANN 以节点-链接图的形式描绘，且该论文正处于活跃评审状态。


    节点-链接图用于描绘 ANN 的另一种方法是在计算图中，如 [8] 所示。在计算图中，边所描绘的不是单个神经元，而是计算过程以及这些计算之间流动的数据。在这种情况下，表示权重、偏和梯度通常是非常方便的。因此，节点-链接图表示的不是网络本身，而是涉及的计算。尽管
    ANN 工具箱 [5] 使用这种节点-链接图处理大型网络。


    人们可能想强调，这不仅是可视化接近现实而且是相对的。[6] 中描述的基于 Web 的可视化描绘了一个三维节点-链接图。用户能够看到自己在网络中的操作，并立即观察任何神经元的响应，因为其颜色被映射到激活状态。所有突触的权重也用彩色线条描绘，并可以显示过滤后的卷积核。虽然他们的方法描绘了一个工作中的全尺寸
    ANN，但作者表示其目标是教育用例。在这项工作中，我们的目标是将他们的想法更进一步，并评估类似的 ANN 描绘是否也能用于机器学习实验。


    一个主要挑战（可能也是大规模可视化未被更多尝试的原因）是 ANN 日益增长的规模和复杂度。ANN 包含数百个神经元和数百万个突触。在二维平面上简单地描绘这些会导致视觉混乱且难以解释。三维可视化要好得多，但如果显示在二维屏幕上仍然受限。这就是为什么对于我们的可视化，我们决定利用虚拟现实（VR）技术。由于技术的进展，VR
    现在在日常工作中是可行的 [11]。对于我们的任务，由于在三维中显示我们的可视化需要更高的自由度 [9], [13]。


    为了证明我们的系统可以用于机器学习示例，我们使用了 MNIST，但并不是。我们需要将系统应用于一个有帮助的用例中。在生产技术领域，机器学习是一个日益受到关注的领域。因此，我们决定将可视化应用于该领域的用例。接下来的章节将详细描述该用例。


    # II. 用例


    我们通过控制机械臂的卷积神经网络来演示我们的方法。本节对项目进行了简要概述。更详细的描述见 [10]。


    本质上，该项目描述了如何通过强化学习生成机械臂的运动。机器人被赋予了跟踪一个环形线的任务，必须沿着线定义的路径移动而不触碰它。简单来说，过程如下：首先，在部件旁边拍摄图像。然后，ANN
    根据此图像计算轨迹。最后，机器人沿着轨迹移动并重复该过程。如果机器人碰到线，它必须重置位置并在训练过程中获得负奖励。该训练过程的细节与本文工作无关，予以省略。


    ![](img/c0cbb3a27f44dfb3b0b8e1bcc5443bd8_1_0.png)

    图 2。我们的方法架构示意图。


    # III. 概念


    图 1 是我们用例的概述。如所述，它深受 [6] 中系统的启发。与他们一样，我们将 ANN 可视化为节点链接图，其中节点表示激活，边表示它们之间的权重。然而，我们只显示连接节点的边。这是由于在我们的情况下神经元数量巨大，使用线性布局并在二维屏幕上显示可视化（如
    [6] 所示）是不可行的。这就是为什么我们使用 VR，因为它允许使用第三维度。关于我们 VR 实现的决策在第 III-A 节中描述。III-C 节描述了为了适应我们的用例而在应用中需要解决的额外方面。


    '
