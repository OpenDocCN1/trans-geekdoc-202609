    **Abstract—** The black box problem of artificial neural networks (ANN) is still
    a relevant issue. When communicating concepts of ANNs, they are often depicted
    as node-link diagrams. Despite this strategy it remains limited to educational
    context. We hypothesize that large-scale node-link diagrams of full ANNs could
    be useful for machine learning experiments. We made a tool to depict ANNs as node-link
    diagrams using virtual reality. We applied it to the field of machine learning
    research and adapted it to the specific challenges. Finally, we performed an expert
    review to evaluate the usefulness of our visualization. The node-link visualization
    of ANNs was proved as helpful in this professional context.


    **Index Terms—** Artificial Neural Networks, Analysis, Node-Link Diagram


    # I. INTRODUCTION


    During the past decade, ANNs have become a standard tool within the field of artificial
    intelligence. They form an integral part of many state-of-the-art approaches in
    the areas of, e.g., image classification, object detection or semantic image management.
    These approaches remain opaque; understanding their means is alike a challenge,
    commonly called the **black box problem** [3]. The behavior and explainability
    of ANNs have failed to be made simple to be acceptable in sensitive applications.
    As, the field of explainable AI (XAI) has recently gained traction [4], with many
    methods to address the black box problem. We refer the reader to the surveys on
    methods for explaining black box models in [5–7].


    ![](img/c0cbb3a27f44dfb3b0b8e1bcc5443bd8_0_0.png)


    A common way to depict neural networks are node-link diagrams [7]. In a node-link
    diagram, the concepts of neurons and synapses are represented by nodes and links,
    respectively. However, the representation of appearance of ANNs becomes complicated.
    Despite this, visualizations for complex ANNs are rarely made using node-link
    diagrams. They are mainly used to illustrate small scale networks, as shown in
    [11] or in many Figures in [12]. There are also interactive visualizations using
    node-link diagrams, such as the tensorflow playground. Their interactive website
    allows users to set the hyperparameters of a small neural network and observe
    their behavior of a two dimensional datasets, while it is not possible to teach
    the layers of the ANNs to beginners, the networks depicted are just as small and
    exemplary. To the best of our knowledge has attempted to depict a large ANN, that
    is subject to active review, as node-link diagram in this paper.


    Another way node-link diagrams are used to depict ANNs is in a computation graph,
    as described in [8]. In a computation graph the edges do not depict individual
    neurons but the computations and the data flowing between these computations.
    In this case, it is usually highly convenient to represent the weights, biases,
    and gradients. For this reason, node-link diagrams do not represent the networks
    themselves, but the computations involved. Although this kind of node-link diagram
    is used for large networks by the ANN Toolbox [5]


    One might want to emphasize that this is not only relative that the visualization
    is very close to reality. The web-based visualization described in [6] depicts
    a three-dimensional node-link graph. Users are able to see their doings in the
    network and immediately observe the responses of any neuron as their color is
    mapped to their activation. The weights of all synapses are also depicted using
    colored lines and the filtered kernels can be displayed. While their approach
    depicts a working, full-scale ANN, the author state that it is targeted at an
    educational use case. In this work, we aim to take their idea one step further
    and evaluate if a similar depiction of ANNs can also be used for machine learning
