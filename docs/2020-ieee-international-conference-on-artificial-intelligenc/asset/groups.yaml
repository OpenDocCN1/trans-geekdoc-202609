    their activation. The weights of all synapses are also depicted using colored
    lines and the filtered kernels can be displayed. While their approach depicts
    a working, full-scale ANN, the author state that it is targeted at an educational
    use case. In this work, we aim to take their idea one step further and evaluate
    if a similar depiction of ANNs can also be used for machine learning experiments.


    One major challenge, probably why large scale-node visualizations have not been
    attempted more, is the increasing size and complexity of ANNs. ANN consist of
    hundreds of neurons and millions of synapses. Naively drawing of the that on a
    two-dimensional plane would result in a lot of visual clutter and be interpretable.
    A three-dimensional visualization is much better but still limited if displayed
    on a two-dimensional screen. This is why, for our visualization, we decided to
    make use of immersive virtual reality (VR) technology. Due to recent economic
    advancements, VR is now feasible for every everyday work [11]. This is for our
    task, since to easily display our visualization in three dimensions needs the
    use of three filters with higher degrees of freedom than in some data tasks [9],
    [13].


    To show that our system can be used for machine learning examples, we use MNIST
    which is not. We need to apply our system to a use case that is helpful. In the
    field of production technologies, machine learning is currently an area of increasing
    interest. Therefore we decided to apply our visualization to a use case in that
    area. The following sections describe this use case in more detail.


    # II. USE CASE


    We demonstrate our approach on a convolutional ANN that controls a robot arm.
    This section gives a short overview of the project. A more description is presented
    in [10].


    In essence the project describes how the movements of a robot arm are generated
    via reinforcement learning. The robot is given the task of following a loop wire,
    which has to be moved along a path defined by a wire without touching it. Touching
    the wire in an electric circuit being closed. This provides the information and
    the images of a camera that is mounted to the robot''s head, a reinforcement learning
    approach trains a convolutional ANN. This ANN uses (down) camera images and generates
    rewards.


    To put it simply, the process works as follows: First, an image is taken of next
    to the part. Then, the ANN calculates a trajectory based on this image. Finally,
    the robot moves along the trajectory and the process repeats. If the robot touches
    the wire, it has to reset its position and receives a negative reward


    ![](img/c0cbb3a27f44dfb3b0b8e1bcc5443bd8_1_0.png)


    Fig. 2. Schematic of our approach architecture.


    during the training process. The details of this training process are not relevant
    to this work and are omitted.


    The project already demonstrated that it is possible to learn a control-policy
    for a robot arm to tie the loop wire, based on camera images. Nevertheless, there
    are still issues with the learning process. which makes this project an ideal
    case for our visualization, since the experts on it can likely benefit from a
    better understanding of ANNs. Additionally, the inputs and outputs have only a
    few differences. The control of the robot is a lot more complex. Furthermore,
    it uses color inputs and constraints. The robot is moved every step robot, which
    is about once every second. These aspects pose additional challenges, which had
    to be addressed to the visualization to use this case. The way we want to describe
    these aspects is described in the next section.


    # III. CONCEPT


    An overview of our use case can be seen in Figure 1. As described, it is greatly
    inspired by the system in [6]. Like them we visualize the ANN as a node-link graph
    where the nodes represent activations and the edges represent the weights between
    them. However, we only show edges that connect nodes. This is because due to the
    large number of neurons in our case, using a linear layout and showing the visualization
    on a 2D screen, as is done in [6], it is not feasible. This is why we use VR which
    allows the use of the third dimension. The decisions made regarding our VR implementation
    are described in Section III-A. Section III-C describes additional aspects that
    needed to be addressed in our application to adapt to our use case.


