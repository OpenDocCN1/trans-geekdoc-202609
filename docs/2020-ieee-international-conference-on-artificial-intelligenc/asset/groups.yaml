    # A. Immersive Virtual Reality


    Our goal was to design an application that machine learning experts could integrate
    into their workflow. The first decision, when designing an immersive VR application
    for everyday work, was the usage scenario [1]. ANNs abstract objects that do not
    exist in the physical world, so the user''s sense of their own body will likely
    affect their immersion; a seated scenario would be feasible for this application.
    However, the experts in our use case worked standing in front of the robot and
    walking around. The location of the robot inside their workshop was large enough
    to walk around. Therefore, we decided to design our application to be while standing
    and allowing the users to walk around if they wish. Additionally, we included
    a virtual travel mode (flying) to give users freedom to move around.


    Naturally, we sensed the availability of our visualization as high as possible,
    and decided to use head mounted displays (HMDs) as our target device. These devices
    are affordable and do not require a complex setup. To enable virtual travel and
    all interactive elements of the visualization, we used the standard input devices
    that are included with the HMD. Navigation is intuitive but might require a redesign
    of the control scheme, since the button on our VR controllers is not yet standardized.


    ![](img/c0cbb3a27f44dfb3b0b8e1bcc5443bd8_2_0.png)


    Fig. 3. Pointing at any activation shows that it connects to it. For convolutional
    layers, the filters are known as such.


    Still, it preserves the good properties of the linear layout, as users can look
    at parts of the network within without clutter. To decrease the amount of work
    the users have to do and give the neurons of adjacent layers along the circle,
    Additionally, there is that no inherent information is communicated better than
    in the linear layout. This layout, shown in figure 2, is a good compromise between
    compactness, and simplicity. We do not use little of the another dimension. Other
    layouts could use the spatial arrangement of neurons to explore properties of
    them or relationship. We plan to investigate this in future work.


    # B. Spatial Layout


    The baseline for the spatial layout of the nodes in our visualization is the linear
    approach used in [6]. In this case, the third dimension is used to show the activations
    of the neural network, while all neurons are placed along a straight line. This
    layout works well for smaller networks, and especially useful when the target
    platforms are only 2D. Another positive aspect of this is the users can see any
    part of the network in isolation. However, our layout is a very long line, where
    information is hard to process across the dimension. This is why we need to find
    a layout that is more compact but does not include too much visual.


    We wanted to preserve the idea of linking the structure of the neural network.
    This leaves us with two spatial dimensions to the layout. The neurons in the hidden
    layers of an ANN do not have any ordering or structure that could be implemented
    from the calculation, there is a lot of freedom here. By placing them on a regular
    grid, this would result in a very compact layout. Unfortunately, this caused many
    of them to be occluded. In the end, we settled on arranging the neurons in circles.
    This makes the visualization compact enough to fit the users'' field


    # C. Use Specific Features


    There were a few challenges that we had to address to make our visualization feasible
    for the experts in our study. First, the output of our control robot is not interpretable
    as the MNIST network in [6]. Instead of encoding class probabilities, the output
    layer of neurons encodes a path that the robot will follow. This path also contains
    the input image and plots that the robot will take as a step. An example of this
    is shown in figure 1. The experts were to be notified when the path is ready.
    We also made our visualization flash ready for a short time, if a network package
    is received. Additionally, we added a function to hold and load the state of the
    visualization. This was because we frequently receive new inputs which might cause
    the user to fly around the visualization or change the parameters in an undirected
    fashion.


    To test our hypothesis that a node-link visualization of a complete network is
    helpful to machine learning experts, we performed an experiment review. Overall,
    we interviewed four experts. Two of them were working in our use case'
  - '[PAGE 3]


    and had worked with us and our visualization before.


    The other two had had the project but were not directly involved and had never
    seen our visualization.


    Every person we interviewed had an exhaustive tour of our visualization and an
    explanation of all its features. After that, they were given the opportunity to
    look around freely as long as they wanted, and when finished, we conducted a structured
    interview with them to get qualitative feedback.


    All experts that we interviewed found ours helpful. One even suggested they developed
    visualizations of their own but ours were more helpful than all of them. We also
    asked which part of their work could benefit from our visualization and a variety
    of answers could help them find out more layers or neurons are needed in the network.
    While they did not elaborate on how to do that, we suspect that this is because
    of hyperparameters. Using hyperparameters are usually help the experts to determine
    where they are too deep and the visualization is help to get a feeling for the
    size of the network. Additionally the experts mentioned they could determine similar
    feature maps, which filters are activated frequently or if the patterns were learned
    by the network made to some. One of them mentioned that using the case set caused
    a potential error in their interpretation when they were using a pooling layer
    and noticed that it did not appear clearly in the convolutional layer.


    We also asked the experts if they would like to see more networks in a different
    fashion. Two experts mentioned that they would definitely like to see recurrent
    architectures like RNNs. One expert said that the tool could be used for scientific
    purposes but in practical projects they would not have the time to analyze the
    network in that depth.


    We also received criticism and suggestions from the experts. For example one expert
    asked to show only the most important edges of all of them. The same experts requested
    a way to pick one node selected without looking at it, to see the edges from different
    directions. Two experts mentioned that the fully-connected layers were through
    multiple layers, like a tree. Another point was that two experts mentioned it
    were too complicated to reliably gain information from them. Points of criticism
    we received were that it was too difficult to show the individual layers, which
    we flashed when the


    was felt too costly and that the selection was sometimes difficult to see in front
    of a red background.


    # V. CONCLUSION


    We presented an interactive node-link visualization for ANNs based on immersive
    reality. Unlike previous work, our system is targeted at machine learning experts.
    We performed an expert review to test our hypothesis that a node-link visualization
    can help them in their experiments. We perceived the feedback from the experts
    as evidence that our hypothesis holds. More evaluations are needed to perform
    that node-link visualizations can actually improve the workflow of machine learning
    experts. However, we are optimistic that future versions of our visualization
    could be used by experts on a larger scale.


