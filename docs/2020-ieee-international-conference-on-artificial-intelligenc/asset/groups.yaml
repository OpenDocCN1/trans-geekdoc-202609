    interest. Therefore we decided to apply our visualization to a use case in that
    area. The following sections describe this use case in more detail.


    # II. USE CASE


    We demonstrate our approach on a convolutional ANN that controls a robot arm.
    This section gives a short overview of the project. A more description is presented
    in [10].


    In essence the project describes how the movements of a robot arm are generated
    via reinforcement learning. The robot is given the task of following a loop wire,
    which has to be moved along a path defined by a wire without touching it. To put
    it simply, the process works as follows: First, an image is taken next to the
    part. Then, the ANN calculates a trajectory based on this image. Finally, the
    robot moves along the trajectory and the process repeats. If the robot touches
    the wire, it has to reset its position and receives a negative reward during the
    training process. The details of this training process are not relevant to this
    work and are omitted.


    ![](img/c0cbb3a27f44dfb3b008e1bcc5443bd8_1_0.png)

    Fig. 2. Schematic of our approach architecture.


    # III. CONCEPT


    An overview of our use case can be seen in Figure 1. As described, it is greatly
