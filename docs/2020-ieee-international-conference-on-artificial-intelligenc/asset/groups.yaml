    # A. Immersive Virtual Reality


    Our goal was to design an application that machine learning experts could integrate
    into their workflow. The first decision, when designing an immersive VR application
    for everyday work, was the usage scenario [1]. ANNs abstract objects that do not
    exist in the physical world, so the user''s sense of their own body will likely
    affect their immersion; a seated scenario would be feasible for this application.
    However, the experts in our use case worked standing in front of the robot and
    walking around. The location of the robot inside their workshop was large enough
    to walk around. Therefore, we decided to design our application to be while standing
    and allowing the users to walk around if they wish. Additionally, we included
    a virtual travel mode (flying) to give users freedom to move around.


    Naturally, we sensed the availability of our visualization as high as possible,
    and decided to use head mounted displays (HMDs) as our target device. These devices
    are affordable and do not require a complex setup. To enable virtual travel and
    all interactive elements of the visualization, we used the standard input devices
    that are included with the HMD. Navigation is intuitive but might require a redesign
    of the control scheme, since the button on our VR controllers is not yet standardized.


    ![](img/c0cbb3a27f44dfb3b0b8e543bd8_2.png)


    Fig. 3. Pointing at any activation shows that it connects to it. For convolutional
    layers, the filters are known as such. Still, it preserves the good properties
    of the linear layout, as users can look at parts of the network without clutter.
    To decrease the amount of work the users have to do and give them adjacent layers
    along, this layout shown in figure 2 is a good compromise between compactness
    and simplicity. Other layouts could use the spatial arrangement of neurons. We
    plan to investigate this in future work.


    # B. Spatial Layout


    The baseline for the spatial layout of nodes in our visualization is the linear
    approach used [6]. In this case, the third dimension is used to show the activations
    of the neural network while all neurons are placed along a straight line. This
    layout works well for smaller networks, and especially when platforms are only
    2D. Another positive aspect of this is users can see any part in isolation. However,
    our layout is a very long line where information is hard to process across the
    dimension. We wanted to preserve the idea of linking the structure. By placing
    them on a regular grid, this leaves us with two dimensions. Unfortunately, this
    caused many of them to be occluded. In the end, we settled on arranging the neurons
    in circles.


    # C. Use Features


    There were a few challenges that we had to address to make our visualization feasible
    for the experts in our study. To test our hypothesis that node-link visualization
    of complete network is helpful to machine learning experts, we performed an expert
    review. Overall, we interviewed four experts who worked with our visualization
    before. The other two were not directly involved and had never seen our visualization.
    Every person we interviewed had an exhaustive tour of our visualization and an
    explanation. First, the output of our control is not interpretable as [6]. Instead
    of encoding probabilities, the layer encodes a path that the robot will follow.
    This path also contains input image and plots that the robot will take. We also
    added a function to hold the state of the visualization. This was because we frequently
    receive new inputs which might change the parameters in an undirected fashion.
    After that, they were given the opportunity to look around freely as long as they
    wanted, and when finished, we conducted a structured interview with them to get
    qualitative feedback. All experts that we interviewed found ours helpful. One
    even suggested they developed their own visualizations but ours were more helpful
    than all of them. We also asked which part of their work could benefit from our
    feature maps. While they did not elaborate on how to do that, we suspect it is
    because hyperparameters.


    # V. CONCLUSION


    We presented an interactive node-link visualization for ANNs based on immersive
    reality. Unlike previous work, our system is targeted at machine learning experts.
    We performed an expert review to test our hypothesis that a node-link visualization
    can help them in experiments. We perceived the feedback from the experts as evidence
    that our hypothesis holds. More evaluations are needed to perform that node-link
    visualizations can actually improve the workflow of machine learning experts.
    However, we are optimistic that future versions of our visualization could be
    used by experts on a larger scale.


