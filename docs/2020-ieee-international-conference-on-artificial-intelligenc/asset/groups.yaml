    # A. 沉浸式虚拟现实


    我们的目标是设计一种机器学习专家可以将其集成到工作流中的应用程序。在设计用于日常工作的沉浸式 VR 应用时，第一个决定是使用场景 [1]。神经网络（ANN）是物理世界中不存在的抽象，因此用户的身体感知可能会影响他们的沉浸感；对于此应用程序，坐式场景是可能的。然而，我们用例中的专家在机器人面前站立并走动。机器人在车间内的位置足够他们走动。因此，我们决定将应用程序设计为站立模式，并允许用户根据意愿走动。此外，我们还包含了一个虚拟旅行模式（飞行），以给用户移动的自由。


    自然地，我们感知到可视化的可用性尽可能高，并决定使用头戴显示器（HMD）作为目标设备。这些设备价格低廉，且不需要复杂的设置。为了实现虚拟旅行和可视化的所有交互元素，我们使用了
    HMD 自带的标准输入设备。导航是直观的，但可能需要重新设计控制方案，因为我们 VR 控制器上的按钮尚未标准化。


    ![](img/c0cbb3a27f44dfb3b0b8e543bd8_2.png)


    图 3. 指向任何激活点均显示与其连接。对于卷积层，过滤器被称为过滤器。尽管如此，它仍然保留了线性布局的良好特性，因为用户可以查看网络的部分而不会感到杂乱。为了减少用户需要的工作量并让他们提供相邻层，图
    2 所示的布局在紧凑性和简单性之间取得了很好的折中。其他布局可以使用神经元的空间排列。我们计划在未来的工作中研究这一点。


    # B. 空间布局


    我们可视化中节点空间布局的基准是使用的 [6] 线性方法。在这种情况下，第三维度被用于显示神经网络的激活，而所有神经元都沿着一条直线排列。这种布局对于较小的网络非常好，特别是当平台仅为
    2D 时。另一个积极方面是用户可以孤立地查看任何部分。然而，我们的布局是一条非常长的线，跨维度的信息难以处理。我们想要保留链接结构的想法。通过将它们放置在规则网格上，我们留下了两个维度。遗憾的是，这导致许多节点被遮挡。最后，我们决定将神经元排列成圆。


    # C. 使用特性


    为了使我们的可视化对研究中的专家可行，我们必须解决一些挑战。为了测试我们的即“完整网络的节点-链接可视化对机器学习专家有帮助”的假设，我们进行了专家评审。总而言，我们访谈了四位以前使用过我们可视化的专家。另外两位没有直接参与，并且从未见过我们的可视化。我们访谈的每一个人都对我们的可视化进行了详尽的参观和解释。首先，我们控制的输出无法像
    [6] 那样解释。相反，层编码了机器人将遵循的路径。这条路径还包含了输入图像和机器人将采取的图表。我们还添加了保持可视化状态的功能。这是因为我们经常接收新输入，这些输入可能会以无向的方式更改参数。之后，他们有机会根据自己的需要自由地环顾四周，结束后，我们对他们进行了结构化访谈以获取定性反馈。我们访谈的所有专家都发现我们的工具很有帮助。甚至有人建议说他们开发了自己的可视化，但我们的比他们所有的工具都更有帮助。我们还询问了他们的工作中哪些部分可以从我们的特征图中获益。虽然他们没有详细说明如何做到，但我们怀疑是因为超参数的原因。


    # V. 结论


    我们展示了一种基于沉浸式现实的神经网络交互式节点-链接可视化。与之前的工作不同，我们的系统针对机器学习专家。我们进行了专家评审，以测试我们的“节点-链接可视化可以帮助他们进行实验”的假设。我们认为专家的反馈是我们的假设成立的证据。还需要更多的评估来节点-链接可视化确实可以改进机器学习专家的工作流。然而，我们乐观认为，我们可视化的未来版本可以在专家中更大范围内使用。


