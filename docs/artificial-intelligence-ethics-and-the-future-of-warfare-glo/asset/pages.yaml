    # Human control


    All AI systems are subject to human control, whether they are autonomous or semi-autonomous.
    Autonomous weapons are under the strategic and tactical authority of human commanders,
    although operationally these weapons have decision-making authority delegated
    to them. Semi-autonomous systems have more limited functions delegated to them,
    e.g., information gathering, issue of recommendations, etc., but not the getting
    themselves.


    There is substantial agreement among scholars and practitioners about the dangers
    of ''loss of control over the use of force'' (SIPRI 2020). This goes for the whole
    chain from strategy formulation and development via deployment and training to
    potential use. However, there is some disagreement about the best terminology
    to be employed.⁷⁵


    The term most often used to describe the kind of control needed is ''meaningful
    control'', signifying that (authorised) human beings have an actual possibility
    of controlling (and halting) ongoing processes at all points, and thus remain
    in the decision loop.


    Some, not the USA, have preferred other designations, primarily the term ''appropriate
    human judgement'', indicating a process where commanders'' intent and proper moral
