    # Ai on UAVs


    From a humble beginning, and driven by commercial motivations, drones or UAVs
    have grown tremendously. Their military uses have proliferated impressively too.
    In 1969, Israel''s Military Intelligence Directorate used used toy drones mounted
    with 35 mm cameras programmed to pick pictures every ten seconds to harvest details
    of trenches, signals cables and deployments over Egyptian territory over the Suez.
    Since then, the use of UAVs has grown remarkably in terms of autonomy for myriad
    roles and tasks. UAVs have been used in combat during military conflicts for a
    long time; a US Predator first fired a missile in 2001.³⁶ More recently, Azerbaijan
    and Armenia have gone wide (and decisive!) use of UAVs in the latter half of 2020.


    Autonomous UAVs can now execute accurate strikes against ground targets, carrying
    out target selection and firing presumed on AI (which is either on board or on
    a platform they are in data communication with). The MQ-9 Reaper has been used
    to detect categorise and track potential objects of interest. This AI pod has
    the potential to identify targets and determine priorities for engagement. The
    loyal wingman UAV developed by Boeing for RAAF has similar target detection, prioritisation
    and engagement capabilities, as claimed by Boeing. This is'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# AI and military aviation 101


    applicable to loitering munitions as well, AI enabling them to carry out their
    suicidal missions without an operator in the loop but investing them with enough
    autonomy to recover safely if no worthwhile target is unearthed. An interesting
    European project isEURO, a demonstrator for the development, integration and validation
    of European technologies for next-generation combat aircraft and drones. Russian
    UAVs Okhotnik and Grom (with AI capability for working with fighters) have been
    mentioned earlier; Altius, Sirius and Orion are three other UAVs for autonomous/semi-autonomous
    capabilities.


    AI has been quietly and surreptitiously making its way into UAV operations and
    each episode of success for UAVs strengthens the motivation to embed AI in diverse
    forms to enhance their capabilities. The USN''s X-47B has demonstrated not only
    deck launches and landings, but even an aerial refueling, carried out autonomously.³37
    The QF-16, has the capability to fly autonomously on predetermined routes for
    decoy roles or as aerial targets for air-to-air missiles and guns. Looking ahead,
    it is easy to imagine UAVs that will be primed for fully autonomous missions with
    their designs build to accommodate MUM-T errands when tasked to. Automatic target
    detection using optical, thermal and/or electromagnetic sensors would empower
    them for offensive roles while long-range sensors would render them invaluable
    for autonomous operations, including in hostile environments. A demonstration
    in 2020 used USAF MQ-9 Reaper engage a cruise mission using AI air-to-air missile,
    revealing another aspect of AI-enabled UAVs'' offensive potential.


    In 2020, the US Army''s Combat Capabilities Development Command (CCDC) has released
    a Request For Information (RFI) for AI Launched Effects (ALE)³⁸ which would be
    a new family of UAVs launched from scout and andis helicopters, which would have
    multifarious capabilities including scout role, EW, attack, decoy, suicide missions
    and swarm capabilities. The RFI stipulates that these UAVs need to be capable
    of semi-autonomous and fully autonomous operations and specifies that the camera
    systems on the UAVs would also be paired with AI-driven ML algorithms to automatically
    identify targets of interest. The steady rise of AI technologies is matched by
    the wants and needs of military aviation for a wide spectrum of AI capabilities.


    Several spectacular demonstrations of UAVs operating in swarms have caught military
    attention in the recent past. Their small size (and Radar Cross Section or RCS),
    low cost (permitting large numbers to be used together), and AI to connect them
    seemingly to think like one, makes UAV swarms objects of desire for the military.
    Dramatic multi-UAV attacks like the one on Saudi Aramco oil facilities at Abqaiq
    and Khurais in September 2019 have helped keep that interest alive (those attacks'
