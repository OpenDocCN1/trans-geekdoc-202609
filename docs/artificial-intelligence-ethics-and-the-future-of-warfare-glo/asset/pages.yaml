  md: '# Ethics of AI-based systems in the military 127


    ![](img/d43ab890b2c86d936e46ba90e0b6da43_145_0.png)


    FIGURE 5.1 The joint targeting cycle


    Phase 1, the ‘Commander’s intent, objectives, and guidance,’ refers to the top-echelon
    military decision that a use of force will be implemented, based on strategic-political
    guidance from the relevant authorities. All subsequent target strikes should be
    traceable to this intent.

    Phase 2, ‘Target development,’ refers to the identification of potential targets,
    their subsequent vetting, prioritisation and selection, as well as building the
    database of knowledge about them.

    Phase 3, ‘Capabilities analysis,’ consists in matching the prioritised targets
    with the most appropriate weapon systems (it is also called ‘weoneering’) to achieve
    the desired effects.

    Phase 4, ‘Commander’s decision, force planning and assignment,’ involves final
    approval of the prioritised targets and communication of these from the operational
    to the tactical level. Relevant constraints, articulated as rules of engagement,
    are passed to the assigned units.

    Phase 5, ‘Mission planning and force execution,’ involves positive identification
    of targets to be engaged with the predetermined weapon systems. At this juncture,
    a tactical targeting cycle is made operational, and is described by NATO as F2T2EA:
    Find, fix, track, target, engage'
