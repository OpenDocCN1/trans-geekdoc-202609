    has contracted with nine companies to develop AI technology that will enable 250
    small air and/or ground units to collaborate; aimed primarily at facilitating
    operations in dense urban environments, the programme showcases the promise of
    swarming UAVs. The interest in swarming UAVs is not restricted to the US military
    only. China is making significant strides in that direction as is the European
    Union, where shared joint military programmes are underway to produce AI-driven
    swarm technologies; the DRONEDGE-E project, for example, is aimed at designing
    an edge computing platform for the autonomous control of UAV swarms in real time
    with automatic generation of algorithms through AI. Details of other swarm projects
    can be found in a recent document called ''Artificial Intelligence in European
    Defence: Autonomous Armament''⁴⁰ authored by GUE/NGL, the left-wing group of the
    European Parliament. Robander is another European project that is aimed at developing
    AI-piloted UAVs which would be tasked to patrol borders autonomously. Working
    in swarm, these UAVs will corroborate and coordinate information among ground,
    and sea-borne platforms.


    In the context of high speed, highly manoeuvrable swarm operate in close proximity
    to each other (and enemy UAVs) and collaborating tactically, cloud computing is
    too slow for their cooperative communication. Edge computing⁴¹ eliminates the
    time for devices/UAVs to communicate through cloud computing (which connects generalised
    data centres or servers) and processes data on the ''edge'' of the network, i.e.,
    at or near the source of the significant data. This munificence of the information
    technology is quintessential to the progression of swarm UAVs; so is their employment
    of AI. In a demonstration by Lockheed Martin, four rotary-wing UAVs flew coordinated
    missions while connected to two Verizon 5G network nodes. These UAVs detected
    and geolocated a target while transmitting a low-power RF signal through real-time
    detection data being transmitted over the 5G network and then processed by signal
    processing algorithms employing edge resources.²² copious use in future military
    kinetic action can be predicted.


    # Conclusion


    From the foregoing account, some strands are discernible in the context of AI''s
    inexorable inroads into military aviation. Firstly, AI is a force multiplier that
    has the potential to enable faster, smarter and safer military operations'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'using minimal resources. Most AI applications are dual use, and a clear distinction
    between civil and military applications is rather difficult. Thus, international
    law may not have much inhibiting leverage over the use of AI for military aviation
    purposes. AI is changing the character and conduct of war into ‘hyperwar’-combat
    waged under the influence of AI, where human decision-making is mostly absent
    from the Observe, Orient, Decide, and Act (OODA) loop. In the future, some military
    aviation missions will be consumed by manned wingmen, unmanned, autonomous UAVs
    collaborating with each other in real time edge computing due to the time taken
    by data/communication to travel from one entity to a satellite and back to another.
    The ethical issues involved are being debated hotly, but it is unlikely that AI-crewed
    aerial platforms will be kept away any aerial action in the future.


    AI is harshly disruptive. It is changing how air powers look at the use of combat
    aircraft, aerial combat, long-range strikes, air defence and support to surface
    forces. The importance given to strategic bombers appears to diminish with much
    smaller craft taking strategic roles (including some not possible by bombers,
    targeted examinations for example). Sixth-generation combat aircraft will be‘battlespace’
    into the bounds of space and mission decisions may get delegated to AI in orbit,
    although the overall control, for philosophical reasons and ethical ones, may
    remain with humans on the ground or in air or even space.


    AI is taking milit towards no-contact war, with long-range strikes and BVR aerial
    combat. This would be possible as confidence in AI transcends current appreions
    about their reliability and lack of cognitive faculties. Without pushing a timeline
    to it, confidence appears achievable and feasible as advancements of technology
    promise. Attributable, disposable, economical UAVs are proving to be more efficacious
    than fixed-wing aircraft, although the disappearance of fixed-wing fighters is
    still quite distant. The speed of operations is going up, and so is the speed
    of decision-making, which is being redefined through AI, which enables taking
    amounts of data from many dissimilar sensors, organising that data, and performing
    analytics on it solve problems, make determinations and recommend courses of action.
    Ultimately, autonomous operations could become the norm even after the handling
    and analytics of information is done by AI, the decision-making time at the hands
    of a human may be unacceptably long. The pace of AI’s march towards singularity
    will decide how soon that happens.


