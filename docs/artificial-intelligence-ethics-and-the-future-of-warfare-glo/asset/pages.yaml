    # Conclusion


    This chapter set out to discuss why Nigeria needs to consider enhancing the pace
    of its incorporation of AI into all phases of its military planning. The main
    objectives of this research included discussing how AI has been used in military
    planning and technologies both in Africa and the rest of the world, how advantageous
    AI is in military planning, and how important it is to involve AI when planning
    for future wars. This chapter also set out to discuss the major setbacks faced
    by Nigeria in the implementation of an AI-laced military plan and make suggestions
    on how these can be overcome'
