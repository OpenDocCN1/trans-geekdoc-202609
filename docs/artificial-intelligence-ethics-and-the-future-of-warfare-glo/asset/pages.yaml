- pgno: 135
  md: '# Impact on stability and deterrence


    The use of cyber-AI tools for defence and security raises pertinent questions
    about how it would alter the current dynamics of international relations as well
    as strategic stability.³⁸ For many states, possession of nuclear weapons has averted
    an all-out war to some extent based on the fear of Mutually Assured Destruction
    (MAD).³⁹ The notion of MAD is based on the notion that a potential attacker has
    no motivation to launch a nuclear strike if the defender can guarantee a retaliatory
    strike. The likelihood of a nuclear state shifting towards autonomous capabilities
    is linked to its confidence in the second-strike capability. The ‘more vulnerable
    they perceive these second-strike capabilities to be, the more likely it is that
    they will integrate autonomous systems,’ particularly those that may speed up
    decision-making or cut the human out of the loop.


    With the introduction of AI, the equation of MAD may not hold true. It may change
    the balance of power because of the fear of miscalculation and unexpected outcomes
    inherently linked to technology. On the one hand, AI-enhanced military capabilities
    can enhance deterrence, because of effective detection, prediction and reduction
    of the sensor-to-shoot time frame. On the other hand, these advances could also
    doubt the survivability of second-strike capabilities, especially for nations
    having a first-use policy. For instance, as the ability of AI improves, it can
    make accurate predictions based on the fusion of disparate sources of information,
    allowing it to find and target missiles stored in silos, in aircraft, submarines
    or trucks. This could lead to ‘strategic destabilization of threats to the survivability’
    of systems such as missile launchers, which are the foundation of deterrence.¹⁴¹
    With such capabilities, the threat of retaliation could demotivated encourage
