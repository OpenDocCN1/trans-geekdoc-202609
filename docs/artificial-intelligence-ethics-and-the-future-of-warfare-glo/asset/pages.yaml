  md: '# 1


    # ARTIFICIAL INTELLIGENCE, NATIONAL SECURITY AND THE FUTURE OF WARFARE


    P.K. Mallick


    # Introduction


    Throughout history, militaries that have failed to adapt to disruptive changes
    in war have paid a steep price, losing lives, battles, or even wars. Artificial
    intelligence is the future, not only for Russia, but for all humankind. It comes
    with colossal opportunities, but also threats that are difficult to predict. Whoever
    becomes the leader in this sphere will become the


    > Russian President Vladimir Putin, 1 September 2017¹


    Today is the age of the Fourth Industrial Revolution. The current period of rapid,
    simultaneous transformations driven by advances in science is reshaping industries,
    blurring geographical boundaries, challenging existing regulatory frameworks and
    even redefining what it means to be human. Artificial intelligence (AI) is the
    software engine that drives the Fourth Industrial Revolution. AI has the potential
    to change entire industries significantly, increase economic growth and impact
    all aspects of society. Recent developments demonstrate that AI is expanding quickly
    and has captured the attention of various groups, such as commercial investors,
    defence experts, policymakers and international competitors. AI will be a crucial
    component in future products and services and play a significant role in the Fourth
    Industrial Revolution, affecting every aspect of life².


    AI has been transforming how modern warfare is conducted. The integration of AI
    in military operations has the potential to greatly enhance the capabilities and
    efficiency of military organisations, but it also raises important ethical and
    security concerns. The use of AI in warfare ranges'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'AI, national security and warfare''s future 31


    from the automation of mundane tasks, such as inventory management, to the integration
    of AI in advanced weapon systems. The US National Security Commission on Artificial
    intelligence concluded in its final report that although AI will be ubiquitous
    across all domains, the high-data volumes associated with the space, cyber, and
    information operations make use cases in those domains particularly well-suited
    for prioritized integration of AI-enabled applications in wargames, exercises,
    and experimentation. This chapter explores how AI is being used in warfare, the
    benefits and risks associated with it, and the importance of ethical considerations
    in developing and deploying AI in military contexts.


    # AI as an emerging and disrupting technology (EDT)


    In all the lists published by the different government and non-government entities,
    AI always figures four of the top five technologies along with Biotechnology,
    Energy and Autonomy/Robotics. AI has a wide range of uses in defence, from improving
    decision-making to increasing the effectiveness of armed forces and protecting
    personnel by automating hazardous tasks by automating ''dull, dirty and dangerous
    jobs''. AI is being used as a force multiplier for the military. It can enhance
    the speed and efficiency of support functions, increase the military forces''
    mass, persistence, and reach. AI brings its unique challenges, which must be balanced
    with effective human oversight. AI needs to work effectively as part of a distributed
    team. The AI system must be deployed and robust under various future scenarios
    and must be able to collaborate effectively with human teammates


    The study of AI started in the 1940s. The term ''artificial intelligence'' was
    introduced at the Dartmouth Summer Research Project on Artificial Intelligence
    in 1955. It saw a significant surge in popularity around 2010 due to the combination
    of these factors: Access to amounts of data, advancements in machine learning
    (ML) techniques, an increase in computing power, and the rise of the internet
    enabling any online system to access big data and distribute intelligent behaviours
    among networked devices (see Figure 1.1).


    # Different areas of AI


    AI can be divided into three types: Narrow AI, General AI and Artificial Superintelligence.
    Narrow AI can perform a single task, General AI can perform various tasks, and
    Artificial Superintelligence is a system that surpasses human cognitive abilities
    in most domains. Currently, General AI and Artificial Superintelligence do not
    exist and may never exist. Narrow AI is currently being incorporated into many
    military applications like'
  merge: -1
  img_proc: true
