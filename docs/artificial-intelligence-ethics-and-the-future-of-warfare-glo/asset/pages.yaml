    # DEFENCE APPLICATIONS OF ARTIFICIAL INTELLIGENCE


    Ajey Lele


    # Introduction


    AI commonly gets identified as the simulation of human intelligence processes
    by machines. The main focus here is on information and communications technologies
    (ICT). The overall AI system involves specific hardware, software, and algorithms.
    Generally, AI systems work by feeding large amounts of data and undertaking pattern
    analysis based on that data. Here, both quantity and quality of data are equally
    important. Today, AI is impacting practically every sector of society. It is changing
    business processes radically. There are various AI-enabled devices, which are
    found bringing a silent revolution in various fields from science research, including
    climate research, industry, agriculture, education, and medicine, and critical
    infrastructure management. It is also becoming an integral part of various security
    establishments. Various military applications of this technology are becoming
    evident. The defense industry is found working towards designing and developing
    AI-enabled military systems. This chapter takes a broad overview of the strategic
    applications of AI knows-how. It discusses various AI-related military developments,
    identifies both the offensive and defensive areas where AI has already made inroads
    in the defense sector, and traces the ongoing and proposed research developments
    happening in this field and relevant investments made by major states. The chapter
    ends with a discussion on facets of legality, arms controls, disarmament, and
    ethics.


    The idea of Artificial Intelligence (AI) is not new. However, this technology
    remains an evolving technology and there is a requirement for much innovation
    in order to obtain the perceived benefits of this technology.'
