    that country. In an investigation of the program and its algorithms, it was found
    that white defendants were labelled as low risk more often than black ones, and
    that the system was wrongly labelling black defendants as future criminals at
    the rate of white defendants.^20 This bias arose from the attributes selected
    as high-risk factors for the algorithms, which were also attributes that black
    Americans are over-represented by, due to historical and social inequities in
    the USA.21 However, it is important to acknowledge that the problem is not only
    that data contains bias, but even that the types of data that are collected in
    our society can also be biased.


    One example that shows bias in terms of what data is collected is that of maternal
    deaths during pregnancy. Until recently in the USA, there was very little data
    collected on maternal deaths in the country.^22 However, due to different investigations
    into the topic, it became clear that this was not only a large issue in the USA,
    but one that was disproportionately impacting women of colour who died at three
    to four times the rate that white women. As our society continues to integrate
    AI into everyday functions, such data will only become increasingly important.
    In light of this, it is necessary to recognise that decisions about what types
    of data are collected by AI-based systems are also influenced by bias.


    # Amplification of bias with AI


    AI not only can reinforce bias and social inequalities, but it can also further
    amplify them. Among those whose amplification to address bias, there is a large
    consensus that amplification is one of the main challenges with AI.^24 One example
    of this is the way in which the Los Angeles Police Department is using AI to help
    with policing.^25 Due to the way in which AI programs are drawing upon historical
    data, which we already know can contain bias, it then predicts which areas are
    at risk of crime, and the police then more heavily-surveil and over-police the
    area, which further amplifies racial bias.^26 Due to the large-scale nature that
    AI programs can operate at, it creates a risk of these biases being multiplied,
    and creates a feedback loop which the bias builds itself upon. Currently, Google
    Translate often defaults to masculine pronouns, resulting in more masculine pronouns
    on the internet and further amplifying bias.^27 While humans certainly contain
    bias and this the issue of amplification highlights the way in which AI creates
    new dilemmas when it comes to the way in which bias negatively impacts individuals
    within society.


