    Significantly, swarms of missiles are now being formed to overwhelm defence systems
    and minimal radio links to avoid detection. It has been reported that Shahed missiles
    are now being equipped with detectors that allow them to hide in nearby heat sources
    without requiring target updates communicated from controllers by radio. This
    could be an important step towards full autonomy. Jamming systems turn out to
    be the norm, radio control becomes more difficult and autonomous weapons become
    more attractive. Military analysts say the longer the war in Ukraine lasts, the
    more likely drones will be used to identify, select and attack targets without
    human help.


    The AI and ML algorithms are used to process massive amounts of data, which is
    crucial for making decisions. One of the examples of AI for battlefield information
    processing is by an American company called Primer.edly, it is used to capture,
    process, analyse, transcribe and translate Russian military communications that
    are unencrypted. AI and ML algorithms have been used for information operations
    for the production of deepfakes and in authentic and fake social media accounts
    that Russia has employed on social media platforms like X (formerly known as Twitter),
    Facebook and Instagram. Overall, AI and ML are being used in this war between
    Ukraine and Russia. However, their use is still limited and cautious.


    # Future prospects


    The Future of AI in warfare will be formed by the decisions made by governments,
    military leaders and technology experts. In military contexts, the responsible
    development and deployment of AI will be crucial to ensure that it contributes
    to stability and security rather than fueling new conflicts or aggravating ones.
    AI can be copied easily and run on relatively small machines once trained. With
    present technology, detecting their presence or verifying their absence is difficult
    or impossible. AI will be ubiquitous acquired, mastered and employed. The imposition
    of restraints on weaponising AI or achieving a collective definition of restraint
    will be extremely difficult. This is an important area for further technical research
    and policy development.⁴⁹


    By 2025, digital technologies such as robotics, autonomy, connectivity, secure
    cloud data and AI will have a transformative effect on confrontation'
