  md: '# Philosophy of emergent logic


    Indian philosophical traditions have a long and different history of engaging
    with this ''duality'' through the principle of tattva or ''thatness'' as a tool
    to understand the nature of knowledge and experience. As a philosophical foundation
    for a new system of non-status quoist logic for non-carbon sentence, two contemporary
    Indian philosophers – Jiddu Krishnamurthy and U.G. Krishnamurthy – useful to use
    and identify some of the key tenets that can be turned into principles (control
    laws). Both the philosophers, in their own ways, make the point that there is
    fundamentally no distinction between the observer and the observation, as the
    act of observation involves the observer transforming what is observed into an
    act of observation through knowledge. J. Krishnammurthy^17 in Nature of the New
    Mind puts out the role of knowledge in observation that turns the relationship
    between the observed and the observed from observation to an act of observation.^18


    There is no ideal in observation. When you have an ideal, you cease to observe;
    you are merely approximating the present to the idea, and therefore there is duality
    and conflict.


    An ideal and/or a thought is knowledge, and knowledge is something that is documented,
    commonly accepted, collectively shared, and experienced. In many ways, a tree
    cannot be categorised as a tree unless there is a prior knowledge that categorises
    it as tree. This conundrum, in a nutshell, is the problematic of empirical falsification.
    U.G. Krishnamurthi puts it more directly and as a clear contrast to the concept
    of rationality, and by logical extension the foundations of existentialism derived
    from Cartesian ''I think therefore I am''^19 logic with an emphatic ''I don''t
    think therefore I am not.''


    Man is a memory. You understand things around you by the help of the knowledge
    that was put in you. I am not anti-rational, just irrational. You may infer a
    rational meaning in what I say or do, but it is your doing, not mine.^20


    Both Jiddu Krishnamurthi and U.G. Krishnamurthi provide the philosophical framework
    for an emergent logic where the observer, observation and the observed are not
    different from the thinker, thinking and thought. A philosophy of emergent logic
    provides for every observation being an observer moment^21 facilitating a ''here
    and now'' emergent logic that exists for the moment and as long as the context
    requires it. A philosophy of emergent logic is ideal for incorporating chaos and
    a concomitant Bayesian approach to complex systems (See Figure 6.5).'
