  md: '150 Gregory M. Reichberg and Henrik Syse


    # Virtue ethics as an appropriate language and framing of AI military ethics


    We conclude our ethical analysis with a brief discussion of the ethical framework
    and language to be used when discussing the military ethics of employing AI systems,
    not least with the virtue ethics of military education.


    While ethics in general and military ethics in particular are often associated
    with the formulation of basic duties and rules (under the heading of deontology
    or duty ethics) or the calculation of desired effects (under the heading of utilitarianism
    or more consequential ethics), the approach to that informs much of the training
    and education in – and self-understanding of military ethics is ‘virtue ethics.’
    This is an ethical approach that sees good character (‘excellence’ or ‘virtue’)
    as inescapable and foundational to soul behaviour.


    Some would say that character and virtue are concepts inextricably linked to human
    beings and their behaviour, and that they do not apply to the actions of machines.
    One could claim that increased use of computer-based machinery in general and
    AI-based, increasingly autonomous machines and systems in particular make virtue
    ethics less relevant. Instead, duties, rules and consequences become the key terms
    for the ethical use of AI, including in military settings.


    Given the centrality of elements such as training, competence, proper feedback
    loops, safety, trust and proper delineation of responsibility, we believe that
    virtue ethics remains an unavoidable and essential framework for understanding
    the ethics of using AI-based machines and systems in a military setting. From
    the way in which systems are developed and programmed to the way they are deployed
    and used, whether for information gathering and other forms of enhancement of
    human decisions or as autonomous decision-makers, the virtues central to proper
    military action will inform the processes for them to align with core legal and
    ethical concerns. Rules and utilitarian calculations without a basis in virtue
    and character can detail the most inhumane of acts and processes.


    In Classical Greek thought, with ramifications for later Western as Islamic moral
    philosophy, four virtues have been delineated as the core (‘cardinal’ virtues),
    and they have deep-seated importance for the development of military ethics, as
    well. It is proper to conclude this ethical analysis with a brief reflection on
    them.


    +   - Moderation signifies the ability to hold back and behave in a balanced manner,
    not least when one is in possession of – or has at one’s disposal tools of – great
    power and strength.'
