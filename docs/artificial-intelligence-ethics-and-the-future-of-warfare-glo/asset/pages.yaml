    capabilities against agile, adaptive and unknown hostile radars or radar modes.
    REAM technology is expected to join active USN fleet squadrons 2025.


    Many of the AI applications mentioned above are available in varying degrees of
    sophistication and could be grafted onto existing or evolving aircraft types without
    much difficulty. As in-cockpit AI permits cockpit to perform and more vital combat
    functions at speeds exceeding that human pilots are capable of, combat aircraft
    could move from AI sharing cockpits with human pilots (as the U-2 mentioned above)
    to manning them independently. Thus, an ''optionally manned cockpit'' design is
    a key attribute of the sixth-generation fighter. As also evident from the discussion
    on sixth-generation fighters above, a quintessential element of ongoing sixth-generation
    fighter programmes is the AI-driven capability to team with UAVs for the performance
    of sundry offensive and defensive roles. This teaming is discussed later in this
    chapter.


    # AI as cockpit crew


    On 20 August 2020, in the finale of the AlphaDogfight trials under US Defense
    Research Projects Agency''s (DARPA''s) auspices, an algorithm developed by Heron
    Systems and installed in a simulator as a simulated F-16, comprehensively defeated
    an US Air Force pilot in five rounds of mock combat. Almost exactly a year ago,
    DARPA had emphatically stated that, ''No AI currently exists, however, that can
    outduel human strapped into a fighter jet in a high-speed, high-G dogfight.''18
    Deeper analysis would show that the simulation conditions were biased in favour
    of AI. The human pilot was not in an actual aircraft which was trained to fly
    by the seat of his pants, and had a Virtual Reality (VR) headset to give him situational
    awareness. However, the demonstration was insignificant as it ratified the all-inanimate
    construct of AI replacing a pilot in the cockpit for something as dynamic as a
    dogfight.


    Civil aviation has already models of AI in the cockpit. The Autonomy system from
    Garmin enables, in case of pilot incapacity, for on-board systems to take either
    automatically or on activation by the pilot or a passenger, stabilise the aircraft
    and then autoland, if required. Interestingly, this, now certified by US Federal
    Aviation Administration (FAA), is not projected as an AI system but as automation.


    The patent application for Emergency Autoland System19 did not use the term ''artificial''
    or ''intelligence'' anywhere.


    However, military aviation requirements are much more demanding and stringent.
    On 15 December 2020, the USAF flew a single-seat U-2 on a'
  merge: -1
  img_proc: true
