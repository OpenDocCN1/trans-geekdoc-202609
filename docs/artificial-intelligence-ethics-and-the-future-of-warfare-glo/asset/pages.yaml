    ETHICS, LAWS ON WAR AND ARTIFICIAL

    INTELLIGENCE-DRIVEN WARFARE


    Guru Saday Batabyal


    # Introduction


    Military technology, which has always defined how wars are fought, has

    come a long way. From the bows and arrows of the Trojan War to the long-

    bows in the Middle Ages to the invention of gunpowder and now later

    tanks and aircraft of World Wars, nuclear arsenals, and now artificial

    intelligence (AI)-assisted-piloted unmanned aerial vehicles (UAVs),

    robots, and cyber weapons amongst a plethora of other weapons.

    Dreamy ‘Star Wars’ like ideas, which were once novel and the stuff of mov-

    ies, are now a reality by advancement in the field of military tech-

    nology, especially UAVs and that has created a situation of flux in

    our understandings of war, how it should be fought, and who should fight

    where – man or machine or a combination of both in the case of interstate

    or even intrate wars.


    The term AI came into existence in 1956, coined by the Dartmouth

    Summer Research Conference, organised by the computer scientist John

    McCarthy. But serious discussion on it began when Alan Turing, popu-

    larly known as ‘father of computer science,’ in 1950 wrote his famous paper

    ‘Computing Machinery and Intelligence,’ where he dwelt on the famous

    question ‘Can machines think?’ With AI, machines aim to replicate human

    intelligence and perform automated tasks. Its military as well as non-mili-

    tary applications have increased manifold since the beginning of this cen-

    tury. President Vladimir Putin, while speaking to the students in a school

    in September 2017 predicted, ‘Artificial intelligence is the future, not only

    for Russia but for all mankind. It comes with colossal opportunities, but


    DOI: 10.4324/9781003421849-9'
