  md: 'The ''Loyal Wingman'' project of USAF Research Laboratory (AFRL) involves a
    manned command aircraft with unmanned aircraft serving as an adjunct flying platform,
    scouting for threats and taking them on, if (thus inviting the term loyal wing).
    Initial live demonstrations were with F-16s—both manned and unmanned—and were
    impressive enough to ensure the concept being grafted onto the sixth-generation
    programmes.


    NATO''s conglomerate of analysts, while the F-16 tests were contested in a autonomous
    mode over predetermined parameters, future plans include ''flocking'' and ''swarming''.
    In flocking, more than one unmanned wing would operate under the manned aircraft,
    which would give more abstract commands than exercise direct control over them,
    while ''swarming'' would obviate the possibility of the command aircraft having
    situational awareness over each of a huge swarm of UAVs but permit it to exercise
    command over the swarm as an aggregate. A demonstration related to this concept
    was made in October 2016 with F/A-18 Super Hornets swarming a swarm of 103 autonomous
    micro drones, which then proceeded to exhibit ''collective decision-making, adaptive
    flying, and self-healing.'' The swarming UAVs are especially alluring as they
    represent myriad possibilities. Some UAVs could have offensive roles, some could
    be scouts (ISR) tasks, could carry EW payloads, some others could aid in target
    recognition and tracking, and others could be loitering munitions with possible
    air-to-air capability, that they can sacrifice themselves in defense of their
    command aircraft. The possibilities are myriad.


    As can be, UAVs present a persuasive alternative to exposing expensive (the almost
    unaff), scarce, manned aircraft to high threat environments. They can be used
    again and like manned aircraft and are comparatively economical, so greater risks
    can be taken with them, with no danger of losing a valuable human pilot. They
    are referred to Low Cost Attributable Aircraft (LCAA) or Attributable (A/R) UAVs,
    for short life spans (in comparison to manned fighters), recoverable (if not downed
    during a mission), low cost, and usable with multiple manned aircraft. The AI
    technologies that are lodged in UAVs enable them to be part of MUM-T programmes
    like the Skyborg, one of ''Vanguard programmes'' launched by AFRL.


    Skyborg was launched in 2018 by AFRL''s Strategic Development Planning and Experimentation
    (SPDE) and AFRL calls it ''an autonomy-focused capability that will enable the
