    and economic effects of AI-enabled weapons. The contributors tackle the problem
    of how far the use of AI-augmented war machines square with morality and legality.
    While the bulk of the essays takes a global perspective, some of the chapters
    follow a region-specific approach. Most of the essays deal with the four issues
    discussed below. These four issues are: Whether the introduction of AI in military
    affairs is causing a Military Revolution or a Revolution in Military Affairs (RMA),
    the challenges of command and control of the AI-augmented weapon systems, the
    probable use of AI for warfare in cyberspace and outer space, and finally, the
    legality and ethical of using military AI. All the essays in this volume deal
    with the state of AI which is available at present, that is, ANI. In the last
    section of this Introduction, I delve into the possibility of the emergence of
    GAI (equivalent to Human Level Machine Intelligence [HLMI]) and superintelligence
    in the future and the impact it might have on the conduct of war in particular
    and the survival of humanity in general.


    # AI in warfare: A military revolution or a RMA?


    We can see that the induction of AI-embedded weapons (like robots, drones, etc.)
    is causing a Military Revolution or an RMA? The term RMA became fashionable among
    American security analysts in the 1990s. RMA is a narrow concept compared to the
    much broader notion of Military Revolution. RMA, which is similar to the Soviet
    concept of Military Technical Revolution (MTR), refers to the introduction of
    a new type of weapon system which has massive tactical and operational effects
    on the battlefield. In the 1970s, as the American armed forces started inducing
    Guided Missions (PGMs) and cruise missiles, the Soviet military theoreticians
    termed it as MTR. In contrast, the Military Revolution involves transformation
    of the society due to the emergence of an operational system of systems (a combination
    of different technologies and managerial techniques) which generates a new military
    system. The implementation of this innovative military system results in a quantum
    jump of military effectiveness of the party initiating the Military Revolution.
    The genesis and maintenance of the resulting advanced military system transforms
    the state-society relationship. Hence, unlike the RMA, the effects of the Military
    Revolution are not merely confined to the tactical-operational spheres but also
    spill over at the military strategic and grand strategic levels. Further, while
    the driver of RMA is the emergence of a new piece of technology, the causation
    behind the Military Revolution involves a lot of factors. Besides the technological
