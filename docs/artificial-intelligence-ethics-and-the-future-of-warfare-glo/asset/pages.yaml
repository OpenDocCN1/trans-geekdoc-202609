    # # ARTIFICIAL INTELLIGENCE AND THE FUTURE OF ARMED CONFLICTS


    # Contextualising Africa in the global matrix


    Gabriel Udoh


    # Introduction


    AI is one of the fastest-growing fields in modern times. Just as its use has been
    extended into fields like agriculture, health, education, Earth observation, marketing
    and several others, the importance of AI has far-reaching effects in the planning
    and execution of armed conflicts. These effects could cause severe breaches in
    the laws and ethics of armed conflicts and, for instance, promote the unnecessary
    loss of lives and property. While IHL requires that civilians and those not actively
    participating in armed conflicts, civilian properties, and their source of livelihood
    be spared from attacks, Earth observation imagery can help identify civilian-populated
    areas, homes, vegetation, property, and other sources of livelihood like water
    bodies. Unethical uses can also trigger unnecessary loss of lives and property.


    Amidst concerns from different actors, military planning in the near future may
    depend wholly on the AI-embedded autonomous weapons capacity of states. Also,
    Africa seems to be either backward or totally unperturbed by the developments
    in the military use of AI, especially in areas like using satellite imagery to
    coordinate strikes. There are major concerns regarding the ethics and legality
    of these systems. The aim of this chapter is to analyse general developments in
    the use of AI for military planning, autonomous weapon systems, the extent of
    involvement by other actors in comparison to Africa, and ethical and political
    reasons that presuppose the slow pace of military AI developments in Nigeria,
    the ‘hub’ of Africa. It considers how automated and autonomous systems have helped
    in military


