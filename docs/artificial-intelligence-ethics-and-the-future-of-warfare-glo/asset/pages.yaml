  md: '# 3

    ARTIFICIAL INTELLIGENCE

    AND MILITARY AVIATION


    A.K. Sachdev


    Artificial intelligence (AI), the distributive of science that deals with computer-related
    technologies pursuing the development of intelligent machines, is yet to receive
    a universally accepted definition but is being hailed as the third revolution
    in warfare. While the first two revolutions (gunpowder and nuclear weapons) were
    arms, AI does not strictly speaking – fit that definition. Nevertheless, it is
    common to read or hear references to the ‘AI arms race’. AI is making significant
    inroads into all domains of warfare – land, sea, air, space and cyber – and all
    military powers are engaged in endeavours to harness AI to their advantage over
    perceived rivals.


    At this stage, it would be good to differentiate between ‘automated’ and ‘autonomous’
    in the context of computer-driven technologies. Automation implies that the computer
    carries out a task without human assistance within a rule-based structure deterministically,
    i.e., producing consistently identical results for a particular set of inputs,
    while an autonomous system operates stochastically in much as it makes predictions
    about outcomes based on inputs so as to arrive at a course of action probabilistically.
    Thus, an autonomous system, even when given the same inputs repeatedly, would
    produce a range of decisions/actions. That is where AI can. According to USDOD,


    AI refers to the ability of machines to perform tasks that normally require human
    intelligence — for example, recognizing patterns, learning from experience, drawing
    conclusions, making predictions, or taking action whether digitally or as the
    smart software behind autonomous physical systems.\¹


    DOI: 10.4324/9781003421849-4'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'In other words, AI describes a computer’s competence for natural language recognition,
    pattern identification, experiential learning, predictions/conclusions based on
    inputs, visual perception, decision-making and decisive action; essentially, these
    represent of human intelligence. However, there is a fundamental problem in making
    computers mimic the human brain. We still do not understand comprehensively the
    brain functions, and thus cannot design computers to impersonate it.


    The common AI (CAI) refers to those tasks that computers can do as well, and indeed
    faster than, humans beings, while General (GAI) refers to the higher level, cognitive
    functions of the brain, generally termed as ‘thinking.’ The Holy Grail of AI is
    to achieve a state of technology wherein computer programs become so advanced
    that AI transcends human intelligence, potentially erasing the boundary between
    humanity and computers (hence the term ‘singularity’). Erudite estimates expect
    that to happen in another two decades.² Meanwhile, current research endeavours
    to elevate CAI to gai by understanding how the brain functions and then having
    AI mimic the processes. While we move towards that milestone, AI is still a significant
    handiden for military purposes and the militarisation of AI is well under with
    leading military powers investing large resources in emerging AI-related technologies.


    AI has linkages with many current, emerging and future fields of science. Some
    of them are quantum computing, nano technology (size, weight and power consumption
    [SWAP] is critical to embedded AI in avionics, and technology is obsessed with
    reducing this set of parameters to make AI more usable and deployable), brain
    machine interface, natural language processing, human augmentation, robotics,
    data science (data science includes multiple fields, including statistics, scientific
    methods, and data analysis to extract value from data), big data analytics, cloud
    computing, edge computing, small (and big) satellites, 5G/6G communications, 3D
    printing, computer technologies, Internet of Things, digital twins, augmented/virtual/mixed
    reality and metaverse (Meta is developing its own AI supercomputer, which it predicts
    would be the fastest in the world). This article looks at the major developments
    in AI, in conjunction with these domains, and the technologyintensive field of
    military aviation.


    # Modern combat aerial platforms


    To locate the inroads of AI into combat aircraft, it would help to know that as
    technologies provided improvements during their evolution, the significant milestones
    gradually came to be as generational changes. There is no unanimous agreement
    on airtight definitions of these generations, but generally, the jet fighters
    that appeared at the end of the Second World War (mid 1940s) are referred to as
    the first generation, while significant technological'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'improvements in design and speeds led to the second generation in the 1950s.
    The second-generation aerial vehicles were the fighters operating during the Korean
    War, with many swept-swept designs. Supersonic speeds and advanced engines generalised
    the third generation through the 1950s and 1960s. The fourth generation came in
    the 1970s and was differentiated by significant improvement in avionics and automation,
    for example Fly By Wire (FBW) and Full Authority Digital Engine Controls (FADE).
    These had sophisticated levels of automation (essentially ''if... then...'' capabilities)
    but by no autonomy AI. A 4.5 (also immense 4+ or 4+) generation is also listed
    by some sources to refer to fourth-generation fighters with fifth-generation features.
    Numerically, the majority of current-day fighters are essentially fourth-generation,
    although they are constantly being refitted with features (improvements upon the
    fourth generation) to enhance their original capabilities. In the 1990s, the fifth
    generation emerged with a significant amount of stealth, some of the other features
    that characterised this generation being fitted with Active Electron Scanned Array
    (AESA) radars, super cruise, plug-and-play electronics, and automation permitting
    a fair amount of autonomy supported by fledgling AI in some areas of operations.


    While the fifth generation was typified by high stealth (stealth and emphatic
    feature), the distinctive feature of the sixth generation is AI. Some fourth-generation
    fighters carried a Weapon System Operator (WSO) to help the pilot, but fifth-generation
    fighters are all sensors with AI sharing the pilot workload. In the sixth generation,
    AI is expected to move from the cockpit with a human pilot to manning it independently;
    ''optionally manned cockpit'' design is thus slated to be a key attribute of the
    sixth-generation fighter. Its other attributes are expected to be modular design,
    virtual/augmented/mixed reality and the capability to control drone swarms.


    The USA, Russia, China, the UK, Japan and France are engaged in sixth-generation
    fighter programmes, with the USA, expected, in the lead but China not far behind.
    USA has two sixth-generation programmes: F-X, also known as Next Generation Air
    Dominance (NGAD) or Penetrating Counter Air Platform (PCA) for the US Air Force
    (USAF) and FA-XX, a replacement for the US Navy''s F-18E/F (also referred to as
    NGAD). The projected date of induction for both NGAD is 2030. The NGAD is often
    projected as a ''family of systems'' with a manned platform working with multi-mission
    UAVs called Collaborative Combat Aircraft (CCA) which will carry out roles including
    probing, suppressing and destroying enemy defences, surveillance and weapon delivery
    in high-risk areas. In September 2022, American defence firms Kratos and General
    Atomics announced arriving at a significant milestone – that of providing autonomous
    capability using an AI pilot on the UAV Avenger MQ-20A. The ''family of systems''
    may later'
