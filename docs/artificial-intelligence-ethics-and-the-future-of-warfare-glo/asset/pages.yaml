    could also incentivize adversary forces to undertake covert attacks by exploiting
    vulnerabilities or manipulating data of the systems, thereby exacerbating the
    situation.


    Deterrence is a psychological concept that relies on the threat perception of
    an opponent''s capabilities and intentions. Advances in AI capabilities create
    a misperception of an adversary’s capabilities. To counter at least the issue
    of predictability, certain research programmes are underway to bypass the black
    box nature of the AI such as DARPA’s Explainable AI program (XAI), which has been
