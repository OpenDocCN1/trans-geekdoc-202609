  md: '# Conclusion


    AI will play a significant role in future military applications. Militaries worldwide
    are incorporating AI and autonomy into their organisational processes, command
    and control systems, logistics systems and weapon systems to leverage current
    developments from the commercial world. It has many areas where it can improve
    efficiency, reduce the workload for human operators and perform tasks more quickly.
    Continued research will further develop its capabilities, transparency and robustness.
    The military cannot ignore the potential of this technology. However, the full
    potential of AI in integrated warfare has to be realised. Regarding using AI in
    military operations such as targeting or other aspects of warfare, the armed forces
    still have a long way to go in terms of deploying the technology and addressing
    issues related to trust and ethics.


    While the potential benefits of AI in military applications are significant, we
    must exercise caution in its deployment. Placing vulnerable AI systems in contested
    environments and entrusting them with critical decision-making poses a considerable
    risk of negative consequences. At this time, humans must retain ultimate responsibility
    for key decisions. The likelihood of AI systems being targeted by attacks and
    the current limitations in AI technology resilience, the most viable areas for
    investment in military AI are those that operate in uncontested environments.
    AI tools supervised by human experts or with secure inputs and outputs can provide
    value to the military without raising concerns about vulnerabilities. To fully
    harness the potential of AI in the military, traditional acquisition practices
    will need to be reformed or discarded. Collaboration between government, academia
    and industry is crucial for successfully integrating AI into the military.


    AI can potentially revolutionise the ways are fought, but it also poses significant
    ethical and security challenges. Even after extensive training, advanced algorithms
    have been known to make considerable mistakes in identifying objects or people
    and scientists still not understand how these systems arrive at their decisions.
    AI-enabled machines are vulnerable to hacking and sabotage, like other cyber-dependent
    systems. The development of Military AI poses risks that need to be addressed.
    There is no agreement on an AI development timeline, but professionals agree.
    International competition could encourage countries to hasten the development
    of military artificial intelligence without adequate attention to safety, reliability
    and humanitarian consequences. The former chief executive officer of Google, Eric
    Schmidt suggested ''those powers creating or wielding an AI-designed or AI-operated
    weapon may not know how powerful it is, or what it will do in a given situation.'''
