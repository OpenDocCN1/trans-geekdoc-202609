    +   And finally, justice signifies the ability to take the moral concerns of all
    involved – we would say the human dignity and human rights of all involved, as
    well as environmental concerns – into consideration when decisions are made, and
    to let the common good of one''s community guide politics. Ultimately, the particular
    good of one or more parts of that community guide grave ramifications of, that
    community encompasses all human beings, meaning that we must take into consideration
    international and global concerns, and also the human dignity and human rights
    of those we would consider our adversaries. Most would add – under the heading
    of environmental justice – that includes proper care of the natural environment
    of which human beings are.


    We believe these virtues will be crucial in the development of both military ethics
    and political ethics as the power and potential of AI-based military systems are
    developed and deployed.


    Other virtues will similarly be needed; obedience, for instance, the virtue by
    which we respond to command authority promptly but never rely or automatically.
    Also, we must take care not to confuse machine input and recommendations with
    the order of a superior and adjust our understanding of obedience accordingly.


    According classical thinking about virtues, not least inspired by the Greek philosopher
    Aristotle, the proper operation of virtues in general – and of moral modern psychology
    in particular – requires training (indeed, education) and habituation. Virtues
    are not learnt that simple facts or purely automated routines or tasks are learnt.
    Virtues are learned and acquired through a combination of understanding and repeated
    action over time. This also explains why the ethical challenges associated with
    using AI-based systems must be integrated into basic training and into our broader
