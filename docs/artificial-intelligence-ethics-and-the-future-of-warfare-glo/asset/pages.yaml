    mentioned above. In short, these systems will be operating at the level of knowledge
    and experience that is currently more or less an exclusive human domain. It is
    a fundamental pivot. In short, smart battlefield management of the future will
    be largely about AI-driven knowledge- and experience-based autonomous decision-making
    pathways. The second will be the rapid integration of artificial kinaesthetic
    intelligence with neural networks, deep learning and language models based on
    Natural Language Processing (NLP)-Bidirectional Encoder Representations from Transformers
    (BERT) and deep situational awareness all encompassed in a variety of non-carbon
    forms. These would range from general-purpose non-carbon entities with all key
    human characteristics including form, actions and behaviour to nanobots with specific
    purposes like precision microsurgery of medicines at a cellular level.


    # Non-carbon entities of the future


    The common foundation of all non-carbon entities of the future with key human
    characteristics will be a source-code (as a combination of logical artifacts and
    brain organs) that is self-learning, autonomously rewritable at the entity level
    by the entity itself each learning moment and can anticipate outcomes of multiple
    decisions within complex environments for achieving either specific purpose or
    a larger goal. Self-learning is a process connected to knowledge production and
    experiential wisdom. Knowledge and experience are integral parts of metacognition:
    A main indicator of sentience.


    A non-carbon sentient entity of the future will use five metacognitive competences
    of Systems Thinking, Normative and Values Thinking, Anticipatory and Futures Thinking,
    Strategic Thinking and Self Awareness and Critical Thinking. Normative and Values
    Thinking is the most critical competency since it cross-sects and intersects all
    the other competencies and is necessary for designating decisions and outcomes
    as good, permissible and desirable or bad, inadmissible and undesirable. Ethics,
    Virtue and Morality are the key instruments of regulation for decision-making
    processes and all the executive functions connected to actions emerging from a
    decision.


    For creating an all-purpose source-code, then, architecting a library of ''if''
    ''but'' and ''or'' statements that are coupled with a library of ''when'' scenarios
    and ''then''-outcomes is an incredibly logarithmic problem set. The problem will
    set, require the design of a logarithmic scale of the widest range possible to
    accommodate all norms, including their contextual nuances, and degrees of application
    in different scenarios, over a wide range of values in a compact manner.'
