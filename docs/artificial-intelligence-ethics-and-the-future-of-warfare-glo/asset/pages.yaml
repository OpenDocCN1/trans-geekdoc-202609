    This problem is set in the absence of any agreed framework or an understanding
    of how escalatory behaviour can be detected in cyberspace. For instance, a cyber
    campaign launched for signalling (i.e., for coercive diplomacy) may go unnoticed
    by the target or, worse, be mistaken for an offensive attack. Even if an operation
    of this nature is promptly and easily discovered, the motivations behind would
    remain unclear or misunderstood. Thus, the onus falls on nation states and especially
    powers to communicate clearly and transparently about their AI capabilities as
