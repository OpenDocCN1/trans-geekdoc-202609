  md: '# AI, national security and warfare''s future 3S


    many problems previously considered impossible, with many applications across
    national security and defence. Quality data and clear judgement have made AI successful
    in the commercial world. These may not be available to the same degree for all
    military tasks. In the military, judgement includes command intentions, administrative
    management, rules of engagement and moral leadership. These functions cannot be
    automated with AI technology. Increasing reliance on AI will make humans'' judgement
    even more important for military power. This incentivises adversaries to improve
    protection of their information systems and command institutions and intervention
    in the adversaries'' information network and command set. Instead of the idea
    that AI will lead to swift robot wars and significant changes in military power,
    we anticipate that conflicts involving AI will be generalised by environmental
    uncertainty, internal resistance and political disputes.


    AI is not just technology; it is a stack and an enable more akin to inventions
    such as electricity or the internal combustion engine between the tank and fighter
    aircraft. It is a vast topic including Data and Data Science, how data is stored,
    transported and secured, which involves all three paradigms of computer science.
    It involves exquisite algorithms like GPT-3, applications, domain experts, integration
    and precision engineering. Talent for each one of these fields is needed.


    # Dual-use technology


    From the two World Wars to the Cold War era, most major defence-related technologies,
    including nuclear technology, the internet and the Global Positioning System (GPS),
    were first developed by government-funded research programmes before spreading
    to the commercial sector later. The private sector is now at the forefront of
    AI innovation. The progress in the development and application of AI in both academic
    and commercial fields is faster than the pace at which the military can obtain
    and utilise the most recent advancements. Today, commercial companies are leading
    AI development, with armed forces adapting their tools for military applications
    later.


    A lot of research on AI applications and the level of human control over them
    have dual purposes. For example, the specifications for an autonomous drone used
    for package delivery are similar to those used for delivering explosives. The
    same image recognition software that is used to identify cats on YouTube could
    also be used by military drones to detect terrorist activity in Syria and Afghanistan.


    AI and autonomous systems are attractive technologies to militaries for the following
    reasons:


    +   AI can outperform humans in automated military and civilian tasks and in more
    demanding tasks. AI systems have demonstrated superior performance to humans in
    dogfighting, board games and cancer detection'
