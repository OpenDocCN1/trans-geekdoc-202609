  md: '# 5


    # ETHICAL ANALYSIS OF AI-BASED

    SYSTEMS FOR MILITARY USE


    Gregory M. Reichberg and Henrik Syse


    # Introduction


    There is a growing expectation– that artificial intelligence (AI) technologies
    will transform military affairs. Hopes have been kindled for more precise targeting
    and fewer casualties, while fears have arisen about new weapons of mass destruction,
    lack of human control and oversight, and the potential for a major shift in the
    geo-political balance. As this military transformation takes place some call it
    ‘revolution’ – gaining a better understanding of its potential benefits and disadvantages
    for humanity is imperative. In other words, an ethical analysis of the main challenges
    posed by AI military technologies is needed.


    Setting aside logistics (outside its scope), this article shows how AI-enabled
    autonomous operations function both to support human decisions and to have an
    artificial agent (computerised robot) render targeting decisions. As to the first,
    and using NATO doctrine as a point of reference, we explain how machine-issued
    target-identification and target-engagement recommendations, despite the notable
    efficiency gains, also involve possible ethical downsides. We discuss under the
    following: Overfitting problem, classification problem, information overload,
    automation bias and complacency.


    Regarding machines that are designed to make targeting decisions without direct
    human involvement – standardly termed ‘autonomous weapon systems’ (AWS)’ – we
    survey the arguments that have been proposed for and against their use in battlefield
    settings. Some have maintained, for instance, that AI-directed combatants have
    an advantage over their human counterparts, while robots operate solely by rational
    assessment, while


