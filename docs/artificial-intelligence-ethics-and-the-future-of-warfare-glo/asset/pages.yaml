- pgno: 12
  md: '# PREFACE AND ACKNOWLEDGEMENTS


    An ‘information age’ is fast replacing the industrial age and artificial intelligence
    (AI) is a key driver in this process. Rapid advance in information and communication
    technologies, especially the processing power of the computers, machine learning,
    big data and the breakthrough in the field of robotics are the causative factors
    behind the massive stride of military intelligence or AI. AI is already reshaping
    the civilian sector. The military domain is likewise undergoing a dramatic shift.
    Over the next 10 or 20 years, AI-enhanced weapon systems will likely transform
    the conduct of warfare. The USA, China and Russia are already integrating AI within
    their military postures. Following the lead of the USA and China, several countries
    like Russia and Israel are formulating new strategic doctrines with AI as the
    centripiece. NATO has recently announced that it will do the same. Where do other
    countries of Asia and Africa, and their armed forces stand in this regard?


    Strangly not much is discussed in the Indian academia about the impact and the
    future role of AI-related technologies in military affairs. 3–4 January 2022,
    Peace Research Institute Oslo (PRIO) organised a conference at LaLit Great Eastern
    Hotel in Kolkata, India. This conference is possible due to the moral and material
    assistance provided by Professor Gregory Reichberg of PRIO who led the project
    ‘Warring with Machines: Artificial Intelligence and the Relevance of Virtue Ethics,’
    a multiyear project funded by the Research Council of Norway. The conference was
    attended by senior-ranking retired military officers from the Indian armed forces,
    scientists, engineers, philosophers, diplomats and academics -who belonged to
    the streams of history, sociology and political science from all over the world.
    The participants discussed not merely AI technologies, but'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Preface and acknowledgments xiii


    also innovative doctrines, command structures, and new tactics and training which
    are necessary for integrating AI within the existing politico-military formats.
    Adoption of AI in the civilian-military sectors will change not only intra-human
    but also machine-human interactions which will give rise to new identities and
    cultural values. Several participants discussed the emerging ethical and legal
    issues associated with the deployment of ''killer robots'' and the use of machine
    augmented decision-making in future conflicts. Some of the papers that were presented
    at conference are revised and the result is this edited volume.


    First, let us be clear that this edited collection is not dealing with the political,
    psychological and economic effects of AI-enabled weapons. Rather our focus is
    on the strategic, tactical, doctrinal and ethical challenges resulting from the
    induction of AI-enabled weapon systems. This edited volume will examine how the
    adoption of AI technologies is likely to impact strategic planning and the command
    culture for unconventional, cyber, space and nuclear force structures. While much
    has already been written on the USA and China, how different Asian and European
    countries are relatively understudied. This readiness will pay special attention
    to the role of AI within the military planning of these areas. By way of comparison,
    the adoption of AI-based technology by different military organisations and the
    consequent transformation of tactics and training will be considered. How different
    countries reconfiguring their doctrines and structures to benefit from the introduction
    of AI and related technologies? What are the perceived advantages of this technology?
    In what measure have the attendant risks and ethical concerns envisaged? In raising
    these questions, the volume does not merely aim to study specific technologies.
    The goal is to contextualise the position of different Asian and European countries
    within the broader market of AI developments. Some of the essays of this volume
    focus on particular geographical areas, others take a global approach. The volume
    brings together a mix of scientists, engineers, military officers and academics
    to discuss how AI will transform warfare in the years to come.


    Finally, special thanks to CENERS-Kolkata Branch, Lieutenant-General (retired)
    Arun Roy, Professor Reichberg, Kelly Fisher, a researcher of PRIO, Dr Moumita
    Chowdhury, So Sohini Mitra and Mr Alka Choudhury of the Department of History,
    Jadavpur University for making the conference possible. Without their cooperation,
    the conference and this volume would not been possible.


    Kaushik Roy


    Guru Nanak Chair Professor, Jadavpur University, Kolkata, India

    Kolkata July 2023'
