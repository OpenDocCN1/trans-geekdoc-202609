    In the ongoing war, there were also noted instances of the use of AI such as the
    employment of ClearView AI''s facial recognition software by Ukraine''s Defence
    Ministry. Ukraine has received free access to powerful search engines under a
    ‘special operation’ campaign to identify killed Ukrainians and Russian soldiers
    on the battlefield, match fingerprints or allow authorities to potentially search
    people of interest at checkpoints, among other applications. The software works
    even if there is facial damage.¹18 There are some promising applications of the
    technology such as reuniting missing people with families, there is also the fear
    of misidentification or unfair arrests. The so-called ‘well-intention’ technology
    could backfire, harming the people it is meant to help. Another obvious fear that
    stems from facial recognition''s battlefield deployment is that it will allow
    ClearView the chance to perform stress tests and provide valuable data, instantly
    transforming ClearView AI into a major tool for military use.¹⁹ If the AI is to
    identify both life and dead enemies, it could be integrated into systems that
    use automated decision-making to direct lethal force. This perilous precedent
    by battlefield deployment and refinement of facial-recognition technology could
    be integrated into autonomous killing machines in the near future.


    The Ukraine-Russia War is serving as a testing ground for cutting-edge, yet unproven
    technologies. Although these technologies are currently being employed in ‘support’
    roles rather than fully autonomous machines, even if that''s what they were initially
    designed to do. wartime technology is complicated because of the chaotic environment.
    Despite the best assurances of the manufacturers, there is simply no way to know
    what could possibly go wrong until a given sees actual field use. Nonetheless,
    the deployment of these machines in war zones is worrisome. First, there is limited
    control over how it is being used. Second, it would continuously be deployed in
    all conflict situations. Last, with each iteration these autonomous systems would
    only get better and smarter.


    These illustrations of using cyber and AI tools can be seen as a ‘novelty and
    an odd complication,’ as they may tamper with or potentially generate new conflict
    dynamics.⁰ In the near future, these technologies would become more advanced because
    of the data being gathered along the way, which is a primary requisite for improving
    the effectiveness of these technologies.


    # Cyber and AI: A lethal combination


    Over the past few decades, researchers have made enormous strides in developing
    computer programs that draw insights from immense volumes of data owing to cheaper
    access to machines that can process gigantic data quickly. With the advancement
    of AI, it is now possible for machines'
  merge: -1
  img_proc: true
