    AWS can likewise run through an entire operating cycle without the need for human
    intervention. In this case, however, the cycle includes the decision to engage
    with a target.


    Some systems are designed for decision-support functionality, while others can
    operate in either mode – decision support and decision-making – depending on the
    option selected by the human operator. This twofold functionality has been technologically
    possible at least since the Aegis Combat system was first deployed in the 1970s.
    It could be to run in automatic mode in which case it would engage targets directly
    without an intervening decision by a commander, or it could run in manual mode,
    whereby only the authorised human operator could trigger a missile launch. We
    have been told by a retired US admiral that he and his peers were reluctant to
    deploy the system in automatic mode for fear of unintended engagements that might
    occur.


    # AI in autonomous decision-support and decision-making functions


    To examine the support that AI can provide for targeting decisions, we use NATO
    doctrine as a point of reference. The Allied Joint Doctrine for Joint Targeting
    outlines several phases in the targeting cycle (or ‘loop’, as it is alternatively
    termed),⁶ AI-enhanced decision-support tools can be inserted at different points
    in this loop. Understanding these points of insertion will assist us in mapping
    the relevant ethical issues. Beforehand, it should be noted that the doctrine
    outlined below has been designed for what might be described ‘offensive operations,’
    namely where military command has a choice with respect to the inception of hostilities.
    In defensive engagements, where prior knowledge of an oncoming attack is very
    limited, the time margin for careful selection of targets will be considerably
    restrained. NATO speaks of ‘dynamic targeting’ aposes these defensive engagements,
    while ‘deliberate targeting’ is the term reserved for engagements of the offensive
    sort.⁷ AI can have a role in either case; for the latter, the assessment of targets
    will be paramount, whereas for the former, the assessment of imminent threats
    will be primary,⁸ with the determination of targets having a subordinate role.


    Figure 5.1⁹ shows the main phases in the deliberate targeting cycle.'
