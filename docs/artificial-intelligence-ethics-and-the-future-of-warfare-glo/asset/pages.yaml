    # Philosophy of status quo logic


    Sentience is not the key challenge. The building blocks for generating a source
    bio-code are increasingly becoming available; the tipping point for viable integration
    will be reached sooner than later. The main challenge is to design the normative
    architecture for sentience. Sentience has been dissected using two main thought
    instruments: through qualia as a specific intersubjective experience that portrays
    several Western schools of philosophy¹¹ and through awareness as a continuous
    inter-relational process of cognition that infuses many Asian philosophies.


    The need to understand human existence is at the core of philosophical traditions
    of the West. Rene Descartes is a key figure – if not the key figure – of the Scientific
    Revolution. Everything from logic, mathematics and geometry to philosophical treatises
    on reason, psychology and even physiology. His first principle of ‘Think, therefore
    I am’ in his 1637 Discourse on the Method is arguably the cornerstone of all Western
    philosophy anchored to mind-body dualism. This dualism undermines Karl Popper’s
    concept of empirical falsification that has informed the contemporary view of
    the relationship between knowledge, observation and objectivity. The concept of
    mind-body dualism of a binary separation between a thinker and his thinking and
    of an observer and his turns the ‘thought’ and ‘observed’ into a problematic.


    Logically, a watertight case can be made that the act of thinking and observation
    cannot take place without pre-existing knowledge with conscious act and directed
    action possible without knowledge. In machine learning terms, it is akin to the
    pre-existence of a library of images logged in a sufficiently indexable manner
    for any act of observation to fulfil itself. As illustrated in Figure 6.2, machine
    learning software cannot observe a tree and turn it into an observation of a tree
    and categorise it unless it has a sufficiently dense catalogue of trees and non-trees
    to cross-reference and in the process identify a tree as a.


    The empirical falsification approach holds logic as long as it operates within
    a dual axis of the observer and/or the thinker and the thinking. However, the
    approach gets deeply problematised when there is a third axis added of the observed
    and thought. By adding the third axis,'
