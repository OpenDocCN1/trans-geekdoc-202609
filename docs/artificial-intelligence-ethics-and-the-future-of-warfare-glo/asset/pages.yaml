  md: '# AI, national security and warfare''s future 33


    artificial intelligence and autonomy, integrated network system-of-systems, microelectronics,
    space, renewable energy generation and storage, and human-machine interfaces.
    Because Joint operations increasingly rely on data-driven technologies and integration
    of diverse data sources, the Department will implement institutional reforms to
    integrate data, software, and artificial intelligence efforts and speed their
    delivery to the warfighter.


    AI raises several questions that have to be addressed:


    +   - How will AI change warfare?

    - What kinds of military AI applications are possible?

    - What limits, if any, should be imposed?

    - What effect will it have on the military balance with adversaries?

    - What unique advantages and vulnerabilities come with employing AI for defense?


    # Definitions


    It is universally acknowledged that there is no commonly accepted definition.
    The DoD AI Strategy of 2018 defined AI as ‘the ability of machines to perform
    tasks that normally require human intelligence—for example, recognizing patterns,
    learning from experience, drawing conclusions, making predictions, or taking action.’
    The US Defense Innovation Board (DIB) defines AI as ‘a variety of information
    processing techniques and technologies used to perform a goal-oriented task and
    the means to reason in the pursuit of that task.’ These techniques can include,
    but are not limited to, symbolic logic, expert systems, ML and hybrid systems.


    The following relevant concepts regard AI, especially regarding its military applications,
    are helpful. First is autonomy. Automated or autonomous systems with no (or limited)
    human operator involvement, typically in structured and unchanging environments,
    and the system’s performance is limited to the specific set of actions that it
    has designed to accomplish. Typically, these are well-defined tasks that have
    predetermined responses according to scripted or rule-based prescriptions. Then
    autonomy. This term can be defined as the condition or quality of being self-governing
    in order to achieve an assigned task based on the system’s situational awareness
    (integrated sensing, perceiving and analyzing), planning and decision-making.
    When the Lethal Autonomous Weapon System (LAWS) could be termed as a weapon system
    that, once activated, can select and engage targets without further intervention
    by a human operator. In contrast, a Semi-Autonomous Weapon System, once activated,
    is intended to only engage individual targets or specific target'
  merge: -1
  img_proc: true
