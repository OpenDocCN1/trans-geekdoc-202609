    chapter makes the case for a system-of-systems approach of reinforcing and balancing
    feedback loops as ''anticipatory'' control laws of ethics, virtue and morality
    for a real-time sentence.


    # The modern contemporary war


    It is useful to think of a contemporary ''modern'' war as a system-of-systems
    it is composed of two interoperable pieces of Command, Control, Computers, Communications
    and Information (C4I) and Intelligence, Surveillance and Reconnaissance (ISR).
    A system-of-systems war plays out as a series of hybrid battles with manned assets
    and unmanned assets operating together in a complementary manner to combat a multidimensional
    hostile environment. The ongoing Russia-Ukraine conflict is a case in point. There
    are three key systems that are currently operating in a theatre of conflict, sometimes
    in conjunction with each other and at other times in isolation.


    The first is an emerging complex of unmanned systems of different levels operating
    with each other. These range from intelligence gathering loitering drones operating
    together with small infantry-level handheld drones to lethal drones with stand-off
    missiles, with preconfigured commodity-level Kamikaze drones replacing misses
    due to cost and logistical considerations. The second are legacy assets like heavy
    and light tanks, bridge layers, portable radars and sensors electronic sniffing
    equipment, mine-clearing vehicles, trench digers, infantry vehicles, fighter aircraft
    and helicopters with air-to-air and air-to-ground roles that operate through a
    ground-, sea-, air-, and satellite-based command and control infrastructure.


    The third system is in its infancy. It is composed of autonomous systems with
    executive functions. These include AI decision-making systems that provide everything
    from targeting decisions for air, sea and ground forces to big think ''how'' to
    and with what'' solutions for countering and suppressing offensive and defensive
    assets. Such systems have the inbuilt capability to execute their decisions independently,
    but are are currently supervised by a human layer with the final execution conducted
    through a human chain of command.


    # The modern future war


    The modern war will also be a system-of-systems war with two significant pivots.
    The first is that the complex of AI-driven autonomous decision-making systems
    will have matured significantly; so much that it will be at least the first amount
    equals if not the first system within the system-of-systems. The implications
    of this would be far-reaching, with such systems not only deeply networked with
    each other for information and situational awareness, also becoming the ''brains''
    of the other two systems'
