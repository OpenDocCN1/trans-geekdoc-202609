    BIASED ARTIFICIAL INTELLIGENCE SYSTEMS AND THEIR IMPLICATIONS IN WAR SCENARIOS


    Kelly Fisher


    ### Introduction

    In recent years, there has been a growing debate about ethical uses of artificial
    intelligence (AI) in warfare. This debate and growth in interest have led to a
    number of reports and literature on the topic. Interestingly, few of these debates
    and topics have focused on the issue of biased AI, which is surprising as the
    topic of biased AI has gained much prominence when it comes to the use of AI in
    civilian settings. As our society has increasingly begun to implement the use
    of AI in everyday life, it has become also clear that these systems can inherit
    and further amplify the type of biases as we humans, including gendered and racial
    biases. This chapter aims to bring these two conversations of ethical use of AI
    in military settings and the issue of biased AI in civilian settings to highlight
    the implications of biased AI from civilian settings. This chapter draws upon
    examples from the USA and Europe, but aims to highlight what biased AI means in
    the larger international community as well.


    In the recent Netflix documentary, *Coded Bias*, Joy Buolamwini, a researcher
    at Massachusetts Institute of Technology (MIT), provides an example of the way
    that AI can be biased. Buolamwini, a black woman, attempts to use a facial recognition
    program which is unable to identify her face, that is, until she puts a white
    mask up to her face. In an analysis of facial recognition''s accuracy, Buolamwini
    would find that facial recognition programs only misidentified white men''s faces
    1% of the time yet a black woman''s face only is misidentified 35% of the time.
    Multiple investigations and reports in recent years have also demonstrated that
    the type of racial'
