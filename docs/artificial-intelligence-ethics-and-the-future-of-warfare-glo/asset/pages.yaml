    Finally, this research will highlight these developments in Africa (with particular
    attention to Nigeria), considering the continent''s conflict situation, and how
    far the inclusion of AI in military planning can help in the prevention of unnecessary
    deaths and suffering in its fight against insecurity.


    # AI, autonomy and autonomous systems


    This chapter seeks to clarify the meaning of certain interdisciplinary concepts
    like AI and autonomy, as used in the context. According to M. Cockelbergh, ''the
    hype surrounding AI has given rise to all kinds of speculations about the future
    of AI and indeed, of what it is to be human.''13 AI is (arguably) intelligence
    demonstrated by non-natural entities, or machines. B. Raphael defines AI as an
    idea and a process: ''of making things that would require human intelligence to
    drive man.''14 It would require human intelligence to drive a car from point A
    to B without hitting sidewalks at both locations. As such, any mechanical system
    that has the capacity to do this possesses some level of autonomy, and can be
    described as operating on AI. This simplified description of AI is built on the
    presumption that ''intelligence'' is focused on other human-like capabilities
    like emotions, consciousness, adaptability, etc. According to M.U. Scherer, since
    ''humans are the only entities that are universally recognised (at least among
    humans) as possessing intelligence, it is hardly surprising that definitions of
    intelligence tend to be tied to human characteristics.''15 Other researchers have
    attributed AI to the pre-instruction of systems with codes.16 This argument seems
    to suggest the constant involvement of human'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'elements in these activities, albeit indirectly. One very striking definition
    of AI is found in Section 238 of the National Defense Authorization Act. This
    section considers AI as ‘any artificial system that performs tasks under varying
    and unpredictable circumstances without significant human oversight, or can learn
    from experience, and improve performance when exposed to data sets.’ This idea
    poses a few vital points worth note; unpredictability, the limitation of significant
    human oversight, a capacity to learn from experiences, and the introduction of
    datasets, which exposes some ethical challenges and opportunities not found in
    many definitions.


    Autonomy denotes independence. It must be noted that there are diverse perceptions
    of autonomy given its context in different disciplines. R.of suggests that due
    to the absence of a universal definition, negotiating a new treaty to regulate
    or ban autonomous weapon systems often ends up inoperferences between autonomous
    and automated systems. Here, the internal cognitive structures of an automated
    system can always be back-tracked to a human in the loop, autonomous systems are
    ‘goal-oriented,’ ‘self-directed’ systems, ‘sophisticated enough that their cognitive
    processes are supposed to be intelligible to the user, who understands the task
    is supposed to perform but not necessarily how the system will perform that.’The
    Proba-1 satellite system, which commanded essentially from the ESA’s ground station
    in Red, Belgium, has onboard autonomy and ground-segment systems that enable it
    control satellite passes ‘with no operator attendance.’The US Defense Science
    Board defines autonomy as ‘a capability (or set of capabilities) that enables
    a particular action of a system to be automatic or, within programmed boundaries,
    ‘self-governing.’It can be concluded from these descriptions that while autonomy
