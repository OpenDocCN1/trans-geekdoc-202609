  md: '# AI and military aviation 97


    simulated missile strike mission²⁰ with an AI algorithm called ARTUp as a working
    crew member. A human pilot flew the aircraft and coordinated with ARTUp, which
    was responsible for sensor employment and tactical navigation. The system is designed
    to be transferable to another type of aircraft with ease and has the potential
    to a cockpit occupant in modern fighters as well as future ones. The implication
    is that the pilot workload of flying and fighting can be reduced by AI in the
    cockpit taking complex tasks of managing data from multiple sources and sensors.
    ARTUp (or similar system) could also manage autonomous systems teamed with the
    fighter it is located in (manned-unmanned teams are discussed later in). There
    have been reports of other programmes for unmanned combat aircraft. For example,
    Japan is reportedly developing an unmanned fighter to operate by 2035.²¹


    Current technological progress encourages optimistic aviation accommodating incremental
    AI participation in cockpit workloads. The AlphaDogfight series of demonstrations
    is DARPA''s Air Combat Evolution (ACE) programme, which aims to progressively
    automate aerial combat and foster confidence in unmanned cockpits. Evolving fighters,
    previously clubbed into sixth-generation fighters, stand to benefit immensely
    from the inexorable tipt of AI into modern cockpits. A promising example is DARPA''s
    Air Labour In-Cockpit Automation System (ALIAS), which is aimed at developing
    a flexible, drop-in, removable kit that would permit appending high levels of
    AI-driven automation into an existing aircraft; the ultimate aim is to execute
    every mission from take-off to landing²² with just AI working as a cockpit crew.
    This forms the basis for the Manned-Unmanned Teaming (MUM-T) concept, now in an
    advanced stage of maturity.


    # Manned-unmanned teaming


    Rotary wing advancements in MUM-T preceded those in fixed wing aircraft by at
    least a decade and proved the concept for adoption by fixed wing platforms. In
    197, the US Army initiated four concept evaluation programmes which fructed into
    two operational systems involving the Apache AH-64D and the Apache AH-64E respectively
    linking with UAVs.²³ In October 2020, these programmes demonstrated a spectacular
    accomplishment wherein a live missile was fired through cooperative engagement
    between an Apache AH-64E helicopter, a Shadow RQ-7BV2 Block 3 Tactical Unmanned
    Aircraft System (TUAS) and an MQ-1C Gray Eagle Extended Range (GE-ER) UAS.²⁴


    Thus, the basic framework already existed for fixed-wing MUM-T to adopt, although
    the comparatively high speeds of fixed-wing fighters and the UAVs teamed with
    them required higher and more immersive levels of'
