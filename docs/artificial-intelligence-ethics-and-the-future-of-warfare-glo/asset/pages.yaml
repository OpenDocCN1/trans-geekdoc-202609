    # Accidents and AI safety


    An accident is an ''undesired and unplanned event that results in a loss (including
    loss of human life or injury, property damage, environmental pollution and so
    on).''³57 Safety, by contrast, may be defined as ''freedom from accidents (loss
    events).'' Ensuring the safety of actions to be undertaken is a key aspect of
    practical wisdom (prudence or prudence) and is traditionally described by terms
    such as ''foresight,'' ''circumpection'' or ''precaution.''³58


    AI raises distinctive challenges with respect to the safe employment of associated
    systems. The challenges are especially acute when AI is employed to deliver weapons
    in battlespace settings. The challenges can be summed up as threefold: amplification
    of errors, misalignment and miscommunication.


    # Amplification of errors


    Automation is often introduced to reduce the errors that result when human operators
    are engaged in rote tasks that require close concentration, for instance, overnight
    guard duty at a military installation. Even short moments of inadvertence can
    have devastating consequences. Watching a radar screen for many hours, checking
    for an enemy incurs, can similarly give rise to operator errors. Automated machines,
    including AI-based surveillance systems, will be less prone to fatigue-induced
    or distraction-related errors. Machine agents have no need to rest and are not
    beset by competing thoughts that can draw one'' attention away from the task at
    hand. Although machine agents are less error-prone than humans, when errors occur
    – and the causes can be multiple – they tend to be more severe, due to the inter-locking
    character of AI systems. Eliminating human error has


    allowed systems to grow, becoming faster and more complex. But this growth came
