    is by using more intelligent warring machines (UGVs with human commanders at the
    back) in place of infantry units for tackling the insurgents.


    Further, the Indian Army is thinking of using loitering munitions fitted with
    precision-guided munitions in sub-conventional warfare. A loitering munition is
    a UAV which can engage explosive targets. These UAVs are fitted with high-resolution
    optical and infrared cameras which allow the target to locate, survive and track
    the target. This sort of UAV is able to hover over the target area for an extended
    period before striking, thus enabling the operator to decide what to target and
    when. The robust sensor-to-shooter communications will also allow a human-in-the-loop
    command system to continue. Loitering munitions are perfect for targeted assassinations
    of insurgent commanders and also for crowd control by taking out the leaders.
    In addition, urban centres, the loitering drones with non-lethal weapons could
    temporarily deactivate the hostile crowd. This will prevent non-combat fatalities
    as collateral damage in urban operations always causes a political hue and cry.79


    # Conclusion


    Technology is neutral. Both India and its non-state opponent are using AI-related
    technologies, and their use by both sides will increase in scope and frequency
    in the near future. The issue is which side will use it effectively. Complete
    autonomy for LAWS remains a chimera in the foreseeable future. At most, in the
    near future, we will see semi-autonomous intelligent weapon systems deployed for
    operations in combination with human soldiers and human-manned weapon platforms.
    The Indian armed forces need to update their joint and service-specific doctrines
    for conceptual blending of AWS with other conventional weapon systems by humans.
    Along with doctrine, training with and against AWS needs to be elaborated and
    implemented. Such amalgamation and deployment of AI-related technologies and non-AI
    technologies are necessary for effective force planning, force structuring and
    force deployment. For the time being, the officers of the Indian armed forces
    are comfortable using AI as a junior partner with the human commander in tactical
    and operational decision-making processes. However, in the future, there might
    be a demand to reduce the OODA loop and increase the tempo, more autonomy should
    be given to AWS. Such a scenario will run counter to the Indian government’s prescription
    of using AI as an adjunct of humans in the managerial/command'
