    # b Trustworthiness of facial recognition


    Another concern revolves around the trustworthiness of facial and object recognition
    programs when it comes to targeting systems for the battlefield. As military development
    moves further into developing autonomous vehicles and weapon systems, they will
    be using a variety of AI programs to manoeuvre and engage in the combat space.
    When it comes to targeting, and who to target, key to these systems will be facial
    and object recognition, as we have seen due to different forms of bias, are inaccurate
    when it comes to identifying non-white faces. In the UK, police are currently
    using facial recognition programs to try and identify criminals in a crowd, after
    an investigation, found that the program accurately identified faces 5% of the
    time.36 These trends in bias raise serious questions about the trustworthiness
    of facial recognition programs used in combat settings. Furthermore, it has been
    found that Project Maven, which was trained for object identification in the Middle,
    struggled in other contexts and settings. One of the challenges resulted from
    cultural differences between men and women'' clothing, which negatively impacted
    Project Maven''s accuracy.37 Both of these examples show how bias can be embedded
    in AI when the training data is under-represented, the Project Maven example highlights
    another dilemma with AI. This problem revolves around developing AI that can recognise
    cultural differences and,, which is understood as a large challenge for AI programming.38
    These challenges pose serious questions about the uncertainty of using AI, and
    also when one should consider a program to be seen as accurate enough to be used
    for target recognition and enemy identification.


    Identification when it comes to other targets such as vehicles can also be susceptible
    to the challenge of trustworthiness. One dilemma when it comes to the trustworthiness
    of AI is we always understand how programs reach their decisions, even if they
    do it correctly most of the time. When it comes to enemy identification, this
    is problematic because we may think that the program is capable of identifying
    enemies, in reality it is actually making the decision off something such as a
    certain colour on a jet wing, and this might result in unintentional friendly
    fire.39 This is a concern that has come up in UN groups about the risks of militarised
    AI, due to ''automation bias,'' humans overly trust machines'' decisions, even
    if we don''t know how it is reaching its decision.40'
