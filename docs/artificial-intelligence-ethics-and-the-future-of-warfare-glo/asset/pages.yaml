    +   Prudence, or practical wisdom, the ability to use actively one''s experience
    and competence, and that of others, and to weigh many factors against each other,
    not least when faced with complex and fateful decisions. Prudence calls on us
    to acquire skills we may need to carry out tasks effectively; for AI applications,
    which will require enhanced digital competence on the part of all who make use
    of these applications. Prudence also signifies a precautionary approach, where
