    also threats that are difficult to predict. Whoever becomes the leader in this
    sphere will become the ruler of the world.¹12 Further Putin predicted that AI-driven
    drones are going to play a major role in future wars; the recent increase in the
    use of military drones proves his point.


    AI dual use – good and evil, for civilian and military purposes. For military
    purposes, AI can use robots employed as fire extinguishers in a naval ship and
    deadly drones like self-flying lethal drones and autonomous weapons where a human
    is not in the loop resulting in unchecked killing and destruction. And that brings
    to the fore the issue of ‘ethical designing of AI.¹13 AI-powered machines and
    information warfare remain mostly questionable. There are countless ethical challenges
    concerning AI in warfare. Famous astrophysicist Stephen Hawking feared that one
    day AI may surpass human intelligence, which might bring the world to an end.
    Like Hawking, there are others who feel AI surpassing human intelligence is harmful
    to humanity. Billionaire entrepreneur Elon Musk – CEO of Tesla, SpaceX and X (formerly
    known as Twitter) warned that AI smarter than humans could create an immortal
    dictator’ and its adoption is like ‘summoning a demon.’ Hawking’s and Elon Musk’s
    prediction of an AI apocalypse may not come true in the near future but their
    caution against an extreme form of AI, if thinking machines would design higher
    versions of themselves, outwitting mankind, needs to be taken seriously.


    Data-driven technologies are now the core infrastructure around which the global
    economy operates. Nations are seeing AI as an empowering tool; consequently, AI
    now has become the basis for a highly competitive geopolitical contest where major
    powers are aiming for rapid growth in this domain, in order to get them in a higher
    place in the global order, along the lines of the Olympic motto of “Swifter, Higher,
    Stronger.” This chapter discusses AI-driven forms of warfare, with special highlights
    on AI-powered weapons, robots and ‘offensive operations,’ including military as
    well as non-military offensive operations and activities in cyberspace for cyberattacks
    and cyber terrorism. On a holistic note to cover the ethical and legal aspects
    of AI-augmented warfare, the chapter recalls the essence of existing laws on war
    modern warfare. By providing normative implications of AI-augmented warfare, the
