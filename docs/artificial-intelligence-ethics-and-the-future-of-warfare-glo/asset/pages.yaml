    Thus, there is a general indication that AI could have a transformative impact
    on both defensive and offensive cyber weapons. However, the likely impacts of
    introducing AI-cyber tools within weapon systems may range from being a positive
    reinforcement to a destructive scenario. From a defensive perspective, the combination
    of AI-cyber tool could help enhance the performance of weapon systems and detect
    irregularities and deviations. The combination could build a robust network against
    any form of cyber subversion. Several cybersecurity firms are cognizant of the
    growing advantages of implementing AI solutions to provide rapid insights and
    cut through the noise, reducing the response time during eternity. From a national
    perspective, as the United States’ report, “AI can enhance our ability to predict,
    identify, and respond to cyber and physical threats from a range of sources.”24
    The DOD’s Project Maven is believed to ‘employ AI to decipher video footage and
    is expected to among others, increase the precision of drones.’23 It is also being
    expanded to other areas such as speeding up the reading of hard drives obtained
    from non-state actors or terrorist entities.26


    From an offensive perspective, the introduction of AI within weapon systems may
    make the systems vulnerable to different types of cyberattacks and data manipulation.
    For example, an adversary could deploy malware, install a backdoor to take control
    of the system or manipulate/fool the behaviour of autonomous systems. Furthermore,
    the data fed to autonomous systems could be poisoned, wherein intruders feed an
    algorithm to alter the system’s behaviour according to their own aims. Offensive
    attacks such as data manipulation or spoofing would be relatively easy to execute,
    but very difficult to detect, attribute or effectively count. After witnessing
    the capabilities of Mayhem, Pentagon’s startup-centric Defense Innovation Unit
    Experimental (DIU)) initiated a project Dubbled Triton is said to offer Mayhem-like
    capabilities to several defence agencies to find coding flaws in both operating
    systems and custom programs used by the US military.27


    The introduction of AI-cyber tools within weapon systems highlights a prevalent
    strategic paradox wherein, on the one hand, these technologies are making operations
    easier and eliminating redundant tasks. While the other hand, the same technology
    would make systems more prone to cyberattacks, vulnerability exploitation and
    an increased probability of technical glitches.


    # Is integration of AI within weapon systems viable?


    There have been some efforts to integrate AI within weapon systems. However, these
    integrations are not without challenges. The first challenge'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# Al-cyber nexus 115


    emanates from models trained through ML being susceptible to adversarial attacks
    when ''an adversary can craft a malicious input that reliably causes a trained
    model to produce the wrong behaviour (for example misclassify an object in an
    image or take an inappropriate action in the environment).$^{28}$


    Despite of intensive investigation and knowledge about this vulnerability, no
    reliable fix has yet been discovered. Nevertheless, the urge to implement potentially
    vulnerable systems may arise given the promise of new capabilities that ML and
    automation offer.$^{29}$


    The next biggest challenge is the absence of quality data. AI-based systems require
    voluminous data for training models for different tasks such as target selection
    and engagement, path navigation and data relationship identification. To identify
    a particular object in an image (such as a cat or dog), a system may be trained
    with millions of pictures of that particular object. Crucial is the quality of
    the data used to train the systems. If the training data set is not representative,
    the system may not work as intended, perform poorly, and may introduce new biases
    or reinforce incorrect ones. In the case of combat zones, acquiring training data
    as well as quality data has been a considerable challenge for AI development projects.
    The absence of quality data could lead to the failure of autonomous systems in
    a complex and unpredictable manner.


    Furthermore, making autonomous systems also means allowing for error. As witnessed
    in the incident of 1983 where a machine misidentified sunlight reflecting off
    altitude clouds as incoming missiles. However, Lieutenant-Colonel Stanislav Petrov
    of the Soviet Union decided to follow his instincts rather than the machine''s
    indication, calling it ''false alarm'' and thus averting a nuclear crisis.$^{30}$
    In a more recent incident, a man lost his life because the sensors of his autonomous
    car failed to distinguish between a large white 18-meter truck and a trailer crossing
    the highway against a bright spring sky.$31}$ Vulnerabilities in systems or technical
    flaws may still persist or occur despite testing and proving of the AI systems.
    They have been noted cases where AI employed for route operations is plagued by
    flaws that were discovered only at the deployment stage. Consequently, the result
    of such oversights may be irreversible and may cause harm to military operations
    by compromising personnel, equipment and/or information.


    Another issue is that ML algorithms depend on deep neural networks which are opaque
    and operate like a black box. The input and the output are observable but the
    computational process learning from one to the other is difficult for humans to
    comprehend. ... using the technique of deep learning and neural networks but trying
    to decipher what the machine understood is complex.$^{32}$ These learnings are
    not stored in a digital memory for an individual to unlock and decipher,'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# 116 Kritika Roy


    rather the information is diffused in a way that is exceedingly difficult to untangle
    the machine’s learning. 33 Simply put, this indicates that it might not be possible
    to fully comprehend how a trained AI comes to its conclusions or predictions.
    Therefore, using it in sensitive contexts such as contested regions or conflict
    zones could pose a risk of eventuality or escalation. Additionally, the lack of
    transparency and explainability creates a fundamental problem of predictability.
    The issue of predictability and uncertainty could also be used by militaries as
    an advantage to provide a scenario of plausible deniability.34


    Many scholars have also articulated the issue of predictability as paradoxical
    because the operations by autonomous systems would be predictable to the operators
    they employ, but not predictable enough to an enemy who could exploit the predictability
    to its advantage.35 Additionally, the issue of transparency is equally worrisome
    from a regulatory perspective because it makes difficult to identify the source
    of a problem and attribute responsibility when something goes wrong.


    The reliability of the output is another concern. Unlike humans, AI systems are
    unable to emphas patterns at an abstract level. They merely identify a correlation
    between different pixels. Facial recognition software cannot distinguish between
    a real person and a picture of a picture inside another image; in both situations,
    a valid identification is made. According to a study, ‘variations in an image
    that are imperceptible to the human eye could cause an image-recognition system
    to completely mislabel the object or people in the image,’ for instance mistaking
    a Siberian husky for a wolf.36 Another study has also highlighted that it is easy
    to produce images that are completely unrecognizable to humans, but that software
    believes it to be a recognisable object with over 99% confidence.37 This means
    AI systems may not be fully reliable and can be fooled by adversaries. The issue
    of predictability and reliability is further exacerbated by the cyber domain.
    In DARPA’s 2016 Cyber Grand Challenge – an autonomous agent captures the flag
    contesting wherein autonomous systems faced each other. During the contest, one
    autonomous system quit in the middle of the competition, while another repaired
    some damage but incapacitated the machine it was to safeguard.


    Thus, the reality stands that these technologies that facilitate features within
    machines are still at a nascent stage, especially for weapon systems that would
    be used on the battlefield and in militaries. Deploying these half-tested machines
    in conflicts and wars could only lead to chaos and escalation. Hence, ensuring
    a responsible adoption of AI technology continues to remain a pressing challenge
    for regulators, developers and users.'
