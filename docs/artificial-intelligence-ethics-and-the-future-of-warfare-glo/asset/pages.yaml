    # A Threat assessments


    The first dilemma when it comes to bias and AI usage in warfare is how threat
    assessments are determined and then acted on. The process of creating threat assessments
    includes the selection of attributes which are deemed to qualify individuals as
    a risk or threat, and we can look at how threat assessments used in drone warfare
    already show warning signs how these biases could further manifest with AI. As
    Sarah Shooker in her book Military-Age Males in Counterinsurgency and Drone Warfare,
    in the context of the Middle East and drone warfare, biases play a large role
    in influencing who is or is not considered a threat on the battlefield. The term
    ‘Military Age Male’ as a category for who is targeted she argues reveals the way
    in which biases based around gender, age, race and religion have deadly consequences.29
    Other researchers have also pointed out the role of biases around gender, ethnicity
    and religion in shaping what bodies are ‘killable’ in drone strikes.30 In 2021,
    documents were released from the Trump administration''s policy on drone warfare
    highlighting that whether or not there were different requirements for men and
    women when assessing whether or not they were seen as of a threat for a military
    strike.31 What these authors and reports show that biases shape who is seen as
    a target, regardless of whether or not they are actually a threat.


    This becomes of further concern when we recognise the way in which algorithms
    and data are being used to assess who is a threat in the battles, and the flaws
    which exist within these programs. Currently there are different forms of data
    that US military officials are using to determine with algorithms whether or not
    individuals are seen as a risk, and then targeted in a drone strike despite knowing
    if they truly a threat.32 These algorithms use a number of attributes to identify
    whether or not an individual should be considered an ‘extremist’, including how
    often they went to an airport or what parts of the country they visited.33 Yet,
    in an investigation of these algorithms, it was found that the person who was
    deemed the highest threat by the algorithm was actually Al-Jazeera’s Islamabad
    Bureau Chief, showing that despite having large amounts of data, innocent individuals
    can still be marked as a threat by'
