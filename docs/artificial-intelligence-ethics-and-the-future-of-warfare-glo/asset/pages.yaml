    # AI-CYBER NEXUS


    # Impact on deterrence and stability


    Kritika Roy


    # Introduction


    Artificial intelligence (AI) is a growing field that finds application in various
    sectors. It has often been termed as ''general/purpose technology'' that enhances
    or adds functionality when integrated into systems.¹ The major idea behind the
    use of AI within machines is to allow some control and autonomy with limited or
    no human assistance or supervision.


    Autonomy is not a new concept, especially in weapon systems where its employment
    has been witnessed since at least the era of the Second World War. For instance,
    the Norden Bombsight and V-1 buzz bomb were controlled by sensors linked to computer
    systems and application of lethal force while the final decision-making control
    always remained with the operator.² Autonomy depends on a diverse array of technology
    but primarily software. The viability of autonomy relies on (a) ''the ability
    of software developers to formulate an intended task in terms of a mathematical
    problem and a solution; and (b) ''the possibility of mapping or modelling the
    operating environment in advance.³ Autonomy can be created or enhanced by AI and
    ML.⁴ The current advancement in autonomy is because of the increasing computing
    power and continuous development in ML has made the development of commercially
    viable autonomous systems, such as AI voice assistants, autonomous vehicles or
    autonomous weapons possibility.⁵ AI can have different levels of autonomy based
    on⁶


    +   Human involvement in the system''s task execution:


    +   Human in the loop: Semi-autonomous systems which remain under the active control
    of a human operator.


    DOI: 10.4324/9781003421849-5'
  merge: -1
  img_proc: true
- pgno: 127
  md: '+   Human on the loop: Human-supervised systems that remain the oversight of
    a human operator.


    +   Human out of the loop: Fully autonomous systems that carry out operations
    without any interference or oversight of a human operator.


    +   Reactive Systems: Follow condition-action rules, commonly referred to as ''if-then''
    rules.


    +   Deliberative Systems: Employ a model of the world (information on how the
    functions work and how actions by the system are responded by the world), a value
    function (which offers information about the intended goal), and a set of alternative
    rules to search for and plan ways to accomplish the goal.


    +   Learning systems: Become more effective over time by gaining experience.


    +   Operational tasks include ''mobility, health management (fault detection),
    etc.''.


    +   Mission tasks include ''target identification and selection, explosive detection,
    etc.''


    AI has been segregated into three branches: Narrow (weak) AI, General Intelligence
    (AGI) and AI Super Intelligence (ASI). ASI is said to be a futuristic capability
    where the machines would surpass the intelligence of humans who have the brightest
    and most gifted minds. AGI has been linked to an advanced level of intelligence
    that would least match, or not surpass, that of a human. It is supposed to be
    so advanced that it would be able to comprehend the environment around it and
    also make decisions and predictions based on this understanding, something more
    akin to what was portrayed in the movie *The Terminator*. To date, we have a narrow
    phase of AI today. This phase has improved over last time and is continually developing,
    as machines are able to perform tasks such as object identification or language
    translation, but as per the user-defined inputs and parameters. Often these parameterized
    inputs are broadly defined but allow a substantial range of autonomy by establishing
    some limits on the AI''s behaviour. For instance, AlphaZero – a computer program,
    developed by DeepMind – mastered the game of chess. Playing chess allowed the
    technology to initiate moves as per its own understanding (providing freedom to
    navigate the chess board) but within the rules of the game. Hence, AI in the current
    context is defined as ''purpose-built, problem-specific and context-driven.''¹⁸


    Understandably, the introduction of AI within weapon systems could facilitate
    significant improvements in the military domains, for instance,'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'optimising solutions for concise operations that are data-intensive like logistics
    and maintenance. Speedy and concise analysis using AI would provide policy-makers
    with better information and more time to make decisions. However, these AI systems
    are also brittle, that is, there is a high plausibility that these systems may
    fail in unpredictable situations or behave in an unpredictable manner that could
    further snowball into escalation and deter the current stability matrix among
    nations. Cyberspace, in this context, is the foundation on which AI is grounded,
    and hence, cybersecurity is a necessary condition for the secure deployment of
    AI systems for all social, economic and military purposes. The shortcomings and
    vulnerabilities of cyberspace would intrinsically linked to the implementation
    of AI, which would further exacerbate the deterrence equation.


    Against this backdrop, this chapter will first analyse the relevance of the topic,
    employing the ongoing Ukraine-Russia War as a case in point that has witnessed
    a number of cyber operations feeding into kinetic warfare. Further, this chapter
    will examine the degree of autonomy showcased by the weapons employed in the Russian-Ukraine
    War by analysing deployments of new and untested autonomous weapons (with a full-autonomous
    capabilities). This examination is important as it will highlight how the current
    Ukraine-Russia War will set certain precedents for the future of warfare, where
    disruption of networks and cyberattacks on critical information infrastructure
    may become a common phenomenon, as well as mass usage of autonomous systems in
    various roles. Furthermore, the paper will also investigate the nexus of AI-cyber
    tools that could only enhance the efficacy of the weapon systems but also make
    them susceptible to vulnerabilities and errors. These advances could subsequently
    impact the current stability matrix and deterrence equation among nation states.


    # Russian-Ukraine War: The role of cyber warfare and autonomous systems


    The ongoing war between Ukraine and Russia has brought to focus the significance
    of cyberspace as well brought forth the reality of autonomous weapons. Russia
    and Ukraine have consistently targeted each other''s cyberspace with Distributed
    Denial of Service (DDoS) attacks, varied malware deployment and leakage of personal
    information. These cyberattacks may not be as lethal as their kinetic counterparts
    but have a force multiplier effect, that is, they create more chaos in an already
    frenzied environment. In one instance, the Ukrainian communication satellite KA-SAT
    network owned by Viasat was targeted, which had a significant impact on communications
    on the ground. The Viasat attacks also had had spillover effects on other European
    nations, including Germany, where around 2,000 wind turbines were disconnected
    from the internet.'
