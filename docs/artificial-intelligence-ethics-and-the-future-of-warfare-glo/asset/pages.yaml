  md: '# 9


    # ARTIFICIAL INTELLIGENCE IN

    MILITARY OPERATIONS


    Technology, ethics and the Indian perspective


    R.S. Panwar


    # Introduction


    AI has become a field of intense interest and high expectations within the defence
    technology community. AI technologies hold great promise for facili- tating military
    decisions, minimising human casualties and enhancing the combat power of forces,
    and in the process dramatically changing, if not revolutionising, the design of
    military systems. This is especially true in a wartime environment, when data
    availability is high, decision periods are short, and decision effectiveness is
    an absolute necessity.


    The rise in the use of increasingly autonomous unmanned aerial vehicles (UAVs)
    in military settings has been accompanied by a heated debate as to whether there
    should an outright ban on Lethal Autonomous Weapon Systems (LAWS), sometimes referred
    to as ‘killer robots.’ Such AI-enabled robots, which could be in the air, on the
    ground, or under water, would theo- retically capable of executing missions on
    their own. The debate concerns artificially intelligent machines should be allowed
    to execute such military missions, especially in scenarios where human lives are
    at stake. This chapter focuses on the development and fielding of LAWS against
    the backdrop of rapid advances in the field of AI, with special emphasis on the
    legal and ethical issues associated with their deployment. It also reviews the
    status of AI technology in India, assesses the current capability of the Indian
    Army to adapt to this technology, and suggests that need to be taken on priority
    to ensure that we do not get left behind other advanced armies in the race to
    usher in a new AI-triggered Revolution in Military Affairs (RMA).


    DOI: 10.4324/9781003421849-10'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# AI: Current status of technology


    AI is a maturing technology. A general definition of AI is the capability of a
    computer system to perform tasks that normally require human intelligence, such
    as visual perception, speech recognition and decision-making. Functionally, AI-enabled
    machines should have the capability to learn, reason, judge, predict, and initiate
    action. In layman''s terms, AI implies trying to emulate the brain. There are
    three main ingredients that are necessary for simulating intelligence: The brain,
    the body and the mind. The brain consists of the software algorithms that work
    on available data, the body is the hardware, and the mind is the computing power
    that runs the algorithms. Technological breakthroughs and convergence in these
    areas are enabling the AI to rapidly mature.


    In 2016, in a significant development, Google DeepMind’s AlphaGo defeated South
    Korean Master Lee Se-dol in the popular board game Go, and the terms machine learning
    and deep learning were used to describe how DeepMind worked. The easiest way to
    think of their relationship is to visualise them as concentric circles, with AI
    the largest, machine learning, and finally deep learning – which is driving today’s
    AI explosion – fitting inside.¹ AI is any technique that enables us to mimic human
    intelligence. Machine learning is a subset of AI, which focuses on the development
    of computer programs that can change when exposed to data, searching through data
    to look for patterns and adjusting program actions accordingly. Deep learning
    is a further subset of machine learning that is composed of algorithms which train
    itself by using multi-layered neural networks (which are designed on concepts
    borrowed from a study of the neurological structure of the brain) to vast amounts
    of data.


    The most significant AI technologies making rapid progress today are natural language
    processing and generation


    Today, while AI is most commonly cited for image recognition, natural language
    processing and voice recognition, this is an early manifestation of its full potential.
    The next step will be the ability to reason, and in'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'fact reach a level where an AI system is functionally indistinguishable from
    a human. With such a capability, AI-based systems would potentially have an infinite
    number of applications.^3


    In a 1951 paper, Alan Turing proposed the Turing Test to test for AI. It envisages
    two contestants consisting of a human and a machine, with a judge, suitably screened
    from them, tasked with deciding which of the two is talking to him. While there
    were two well-known computer programs claiming to have cleared the Turing Test,
    the reality is that no AI system has been able to pass since it was introduced.
    Turing himself thought that by the year 2000 computer systems would be able to
    pass the test with flying colours. While there is much disagreement as to when
    a computer would actually pass the Turing Test, one thing all AI scientists generally
    agree on is that it is very likely to happen in our lifetime.^4


    There is a growing fear that machines with AI will get so smart that they take
    over and end civilisation. This belief is properly rooted in the fact that most
    of society does not have an adequate understanding of this technology. AI is less
    feared in engineering circles because there is a slightly more hands-on understanding
    of the technology. There is perhaps a potential for AI to be abused in the future,
    but that is a possibility with any technology. Apprehensions about AI leading
    to end-of-civilisation scenarios are perhaps largely based on fear of the unknown,
    and are largely unfounded.


    # AI in military operations


    Is AI a harbinger of a new RMA? Robotic systems are now widely present in the
    modern battlefield. Increasing levels of autonomy are being seen in systems which
    are already fielded or under development, ranging from systems capable of autonomously
    performing their search, detect, evaluation, track, engage and kill-forget munitions,
    loitering torpedoes, and intelligent anti-submarine or anti-tank mines, numerous
    other examples. In view of these developments, many now consider AI and robotics
    technologies as having the potential to trigger a new RMA, as Lethal Autonomous
    Weapon Systems (LAWS) continue to achieve increasing levels of sophistication
    and capability.


    It is actually difficult to precisely define what is a LAWS. In the acronym ‘LAWS’,
    there is a fair amount of ambiguity in the term ‘autonomous,’ and there is a lack
    of consensus on how a ‘fully autonomous’ weapon system should be characterised.
    In this context, two definitions merit mention. A 2012 US Department of Defense
    (DoD) defines an autonomous weapon system as one that, ‘once activated, can select
    and engage targets without further intervention by a human operator.’ More significantly,
    it defines a semi-autonomous weapon system as one that, once activated, is intended
    to engage individual targets or specific target groups that'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# AI in military operations 219


    have been selected by a human operator. By this yardstick, a weapon system, once
    programmed by a human to destroy a target group (which could be interpreted as
    an entire army) and thereafter seeks and destroys individual targets autonomously,
    would still be classified as semi-autonomous.$5$


    The Human Rights Watch (HRW) definition differs. As per HRW, fully autonomous
    weapons are those that, initiated, will be able to operate without Meaningful
    Human Control (MHC). They will be able to select and engage targets on their own,
    rather than requiring a human to make targeting and killing decisions for each
    individual attack. However, in the absence of consensus on what MHC is to be specified,
    it concedes that there is a lack of clarity on the definition of LAWS.$6$


    There is a view that rather focus on autonomous systems alone, there is a need
    to leverage the power of AI for increasing the combat power of the current force.
    This approach is referred to as Narrow or Weak AI. Narrow AI could lead to many
    benefits, such as using image recognition from video feeds to identify imminent
    threats, anticipating bottlenecks, automating administrative functions, etc. Such
    applications would permit force restructuring, with a smaller staff of scientists
    replacing large organisations. Narrow AI also has the potential to help the Defence
    Forces improve their teeth-to-tail ratio.$7$


    Another focus on the evolutionary route to the development of autonomous weapons
    is what can be termed as human-machine teaming, wherein machines and humans work
    together in a symbiotic relationship. Like the mythical centaur, this approach
    envisages harnessing human speed and power to human judgement, combining machine
    precision and reliability with human robustness and flexibility, as well as enabling
    computers and humans to help each other to think, termed as cognitive teaming.
    Some functions will necessarily have to be completely automated, like missile
    defence lasers or cybersecurity, and in all cases where there is no time for human
    intervention. But, at least in the medium term, most military AI applications
    are likely to be teamed: Computers will fly the missiles, ai lead the signals,
    read the sensors, and pull all the data together over a network, putting it into
    an intuitive interface, which humans, using their experience, can use well-informed
    decisions.$8$


    # LAWS: Legal and ethical issues


    LAWS powered by AI are currently the subject of much debate based on ethical and
    legal concerns, with human rights proponents recommending the development of such
    weapons should be banned, as they would not be in line with international humanitarian
    law (IHL) under the Geneva Convention. The legal debate over LA revolves around
    three fundamental issues. The first is the Principle of Distinction. This principle
    requires parties'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# 220 R.S. Panwar


    an armed conflict to distinguish civilian populations and assets from military
    assets, and to target only the latter (Article 51[4] of Additional Protocol I).
    The second one is the Principle of Proportionality. The law of proportionality
    requires parties to a conflict to determine the civilian cost of achieving a particular
    military target and prohibits any if the civilian harm exceeds the military advantage
    (Article 51[5] and 57[2] of Additional Protocol I). The third one is the issue
    of Legal Review. The rule on legal review provides that signatories to the Convention
    are obliged to determine or not new weapons as well as methods of warfare are
    in adherence to the Convention or any other international law (Article 36 of Additional
    Protocol I).


    It has also been argued that fully autonomous weapons systems do not pass muster
    the Martens'' Clause, which requires that ‘in cases not covered by the law in
    force, the human person remains under the protection of humanity and the dictates
    of the public conscience’ (Preamble to Additional Protocol I). Then there is the
    Campaign to Kill Robots. Under this banner, the HRW has argued that fully autonomous
    weapons would be prima illegal as they would never be able to adhere to the provisions
    of IHL, since such adherence requires a subjective judgement, which machines can
    never achieve. Hence, their development should be banned at this stage itself.¹


    There exists an equally vocal body of opinion with which LAWS would not be illegal,
    and in fact, would lead to the saving of human lives. Some of these views are
    given here. LAWS do not need to have self-preservation as a foremost drive, and
    hence can be used in a self-sacrificing manner, saving human lives in the process.
    They can be designed without emotions that normally cloud human judgement during
    battle leading to unnecessary loss of lives. When working as a team with human
    soldiers, autonomous systems have the potential capability of objectively monitoring
    ethical behaviour on the battlefield by all parties. Then, the eventual development
    of robotic systems superior to human capabilities would enable robotic better
    informed ‘kill’ decisions. Autonomous weapons would have a wide range of uses
    in scenarios where civilian loss would be minimal or non-existent, such as naval
    warfare. The question of legality depends on how these weapons are used, not their
    development or existence.¹ Finally, it is too early to argue over the legal issues
    surrounding autonomous weapons because the technology itself has not completely
    developed yet.


    It is better to take a middle path between these two extreme positions. The middle
    path involves discussion on the degree of autonomy and meaningful human control
    (MHC). LAWS have been broadly classified into three categories. Human-in-the-Loop
    LAWS can select targets, while humans take the ‘kill’ decision. Human-on-the-Loop
    weapons'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# AI in military operations 221


    kill decisions autonomously, while a human may override the decision by exerting
    oversight. Then human-out-of-loop LAWS are those that select and engage targets
    without any human interaction. Entwined within this categorisation is the concept
    of MHC, i.e., the degree of human control which would muster under IHL. Despite
    extensive discussions at many levels, there is no consensus so far on what is
    meant by human autonomy nor how MHC should be conceptualised.¹¹²


    Triggered by the initiatives of HRW and other NGOs, an informal group of experts
    from a large number of countries debated the issue of LAWS for several years at
    the United Nations Office of Disarmament Affairs (UNODA) forum, Convention on
    Conventional Weapons (CCW). In December 2016, several countries agreed to formalise
    these deliberations, and as a result, a Group of Governmental Experts (GGE) was
    established, the first of which was held from 13–17 November 2017, chaired by
    Ambassador Amandeep Gill of India. Approximately 90 countries with many other
    agencies participating in the meeting. Some of the conclusions arrived as follows.
    Systems must ensure accountability for lethal action by any weapon system used
    by them in armed conflict, acknowledging the dual nature of the technologies involved.
    The Group’s efforts should not hamper research and development in these technologies,
    and there is a need to prevent potential military applications using these technologies
    under review.³ Thereafter, the GGE has been holding meetings regularly, with the
    latest one continuing its deliberations in May 2023.


    # AI in military operations: International perspective


    As of now, non-autonomous defensive systems have been deployed by several countries
    to intercept attacks. Offensive weapon systems, in contrast, would be those which
    may be deployed and actively seek targets. However, the difference between offensive
    and defensive weapons is not warfare. The most well-known autonomous weapon system
    is the Iron Dome of Israel and the Phalanx Close-In Weapon System used by the
    US. Fire-and-forget systems, such as the Brimstone missile system of the United
    Kingdom and the Harpy Air Defence Suppression System, South Korea uses the S1,
    a sentry bot with an automatic mode, in the Demilitarised Zone with North Korea.
    One example of an offensive weapon system likely to be deployed in the near future
    is Norway’s Joint Strike Missile, which can hunt, recognise and detect a target
    ship or land-based object without human intervention.¹⁴


    The USA has put AI at the centre of its quest to maintain its military dominance.
