    # Bias in the data


    There are several ways that AI can become biased by data. The first is

    that the data can be trained on datasets that are either over-representative

    or under-representative of a group.. Many ML schemes are trained on

    free and large datasets on the internet such as Wikipedia, Google Images,

    Google News or ImageNet, and these datasets are not equally representa-

    tive groups in society.16 One example of how these biased datasets then

    affected AI programs includes Amazon''s facial recognition application,

    which only mistake a white man''s face 1% of the time, but a black woman''s

    35%.17 Furthermore, voice recognition programs, which often perform bet-

    er on men''s voices are often trained on a large data set called

    t Linguistic Data Consortium, which is a dataset where two-thirds of the

    voices making up the data are men''18


    The purpose of AI is to try and make predictions for the future

    based on previous trends and information from the data. As a result of this,

    t the types of data are included reflect historical and social inequities,

    the AI programs can become biased.19 An example of this includes Amazon''s

    resume hiring scheme. This program was looking at which candidates were

    previously hired at Amazon, which was predominantly men, and then

    dided that men were the ideal candidates, and removed women''s resumes

    from the list of possible candidates. Another example of this includes an

    alg in the USA that was calculating the risk score of a convicted crim-

    al''s likelihood to commit a crime, and being used by court systems'
