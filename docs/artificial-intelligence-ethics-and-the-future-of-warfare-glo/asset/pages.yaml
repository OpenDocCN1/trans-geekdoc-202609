    accurately translate languages, compose poetry and possibly even aid in the discovery
    of new drugs.²¹


    The introduction of AI within weapon systems has led to significant improvements
    in many processes as well as eliminating redundant timeconsuming tasks. Major
    applications of AI have been noted in capabilities and analysing voluminous data
    from different sensors, early warning systems, intelligence surveillance and reconnaissance,
    inventory management and prediction. These systems can also be used to conduct
    remote sensing operations in areas that are hardly accessible by manned systems.
    Many of these tasks are currently being undertaken by a human in the loop. For
    instance, AI can enable systems to sift through large amounts of data to find
    relevant information, fuse data from sensors and observe whether situations have
    changed or not; finally, it is the analyst who decides the next steps to be taken
    on the concise and comprehensive data.


    For cyber operations as well, AI could act as a force multiplier for both offensive
    and defensive weapons. In the Defense Advanced Research Projects Agency (DARPA)
    organised a cyber challenge where a lethal dubbed May was deployed. Its features
    include ‘automatic finding vulnerabilities in commercial-off-the-shelf software
    without developer participation’ and ‘automatic patching of its own vulnerabilities.’
    Many researchers also anticipate that an advanced version of May could be capable
    of ‘fighting dynamically against attackers.’ It is said to be ‘smart for both
    offense and defense purposes.’²²


    In the field of cybersecurity, AI is increasingly used in systems that prioritize
    threats and carry out automatic remediation. Examples include anomaly detection
    algorithms that can identify malicious traffic or user activity in real time.
    The development of new technologies that can conduct complex cyber campaigns with
    innovative traits, such as malware capable of tactical adaptability and value
    calculations vis-à strategic objectives, is currently the subject of intense research
    worldwide. OpenAI recently released ChatGPT that allows users to interact with
    an ‘intelligent’ chatbot. A user can also ask it to convert or finish an assignment.
    A researcher experimented with the chatbot to see if it would be able to solve
    a simple capture the flag challenge. Surprisingly, the model not only identified
    the vulnerability within the code but also wrote a small code that allowed the
    exploitation of the vulnerability. This is to note that as the machine becomes
    more sophisticated, it could also be employed to write malicious code or find
    vulnerabilities in the adversary’s network. This discovery is without shortcomings,
    OpenAI researchers have observed that the model can produce vulnerable or misaligned
    code and while ‘future code generation models may be able to be trained to produce
    more secure than the average developer,’ getting there ‘is far from certain.’²³
    There is also no'
