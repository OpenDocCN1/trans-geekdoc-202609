- pgno: 19
  md: '# INTRODUCTION


    Intelligent autonomous war machines\sand the future of warfare


    Kaushik Roy


    # What is an intelligent military machine?


    The term artificial intelligence (AI) was first used as a title for the conference
    held at Dartmouth College in 1955. Alan Turing’s (a mathematician and a pioneer
    in computer science) 1950 essay titled ‘Computing Machinery and Intelligence’
    can also be taken as a signpost for the birth of the term AI.¹ AI is machines
    that can generate behaviour similar to humans, such as making choices and judgements.
    The rise of AI is part of the ‘Information Revolution.’ Information is a crucial
    ingential of material productivity in the era of Information Revolution. In this
    era, the generation of new knowledge is dependent on computing power. Basic services
    like banking, railways, transportation, water and energy distribution are becoming
    more and more dependent on information and communication technologies (ICT). The
    principal sources of energy include digital information, computer software and
    communications. The computer with its electronic brain is supplementing (might
    supplement in the future) human thinking. The integrated circuits and computer
    technology are the bedrock of AI, and these two technologies are continuously
    developing.AI is a combination of technologies which includes both hardware and
    software. So, an AI system includes hardware like mainframe computers, microchips,
    sensors integrated with software as programs, algorithms, etc. The fundamental
    building blocks of AI are learning algorithms which allow the machine to detect
    patterns in data, make decisions, adjust their behaviour relation to the environment.
    This learning process is called machine learning (ML) and its subset is deep learning
    (DL).We will discuss these two terms later in detail. The production of computers
    with increasing processing powers,'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 2 Kaushik Roy


    the internet, Internet of Things (IoT), iCloud, Facebook, X (formerly known as
    Twitter), advances in robotics, synthetic biology, neuroscience and nanotechnology
    are making possible the use of AI in the non-military and military sectors. So,
    AI can be simplistically grouped as a symbiosis of related technologies around
    ICT. The result is that weapons are being informatised and intellectualised.


    The field studying the effect of AI on warfare is overloaded with acronyms, abbreviations
    and conceptual categories. Social scientists argue that a tight and static definition
    of a concept or a category will result in the death of social sciences. Nevertheless,
    a working definition of various terms, categories and concepts is necessary. The
    understanding of what constitutes autonomous intelligence differs among people
    and regions.


    The UK in a Joint Doctrine Note published in 2011 differentiated automated/automatic
    systems (which have elements of AI in them). An automated or automatic system
    follows a predefined set of rules and results in predictable outcomes. One example
    is the Phalanx Anti-Ship Missile Defence System. In contrast, an autonomous system
    is capable of understanding higher-level intent and direction. With a sophisticated
    perception of its environment, a system is capable of taking a course of action
    from a number of possible alternatives, without depending on human oversight or
    control. Overall, the activity of an autonomous system is predictable though individual
    actions may be, as the system not merely follow a pattern of rules in a predictable
    way. Actually the UK Ministry of Defence’s (MOD) 2011 Note is equating Narrow
    or Weak AI (Artificial Narrow Intelligence/ANI) with automatic systems, semi-autonomous
    machines and fully autonomous machines (part of Strong or General AI(GAI)) as
    a truly autonomous intelligent system.


    Paul Scharre a former US Army Ranger turned military AI expert, writes that machines
    become more sophisticated, they are more capable and able to execute complex tasks
    in more open-ended environments. Scharre classifies AI on the basis of its intelligence
    and autonomy into three classes: Automatic, automated and autonomous. An automatic
    machine is simple threshold-based, and an automated one is more complex rule-based.
    An autonomous system senses the environment and acts. It does not exhibit much
    in the way of decision-making, and its actions are predictable. An autonomous
    system, in contrast, may consider a variety of inputs and weighs variables before
    taking an action. An autonomous machine is goal-oriented and self-directed. Goal-oriented
    suggests that the human user specifies the goal to be achieved, but how it is
    achieved is decided by the machine. Its internal cognitive processes are less
    intelligible to its handlers. So, the autonomous machine’s specific action to
    achieve a goal may be less even to its operators. Hence, in Scharre’s framework,
    at one pole is the automatic machine, which is least autonomous and minimally
    intelligent.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Introduction 3


    The automated one is at the mid-spectrum of intelligence and autonomy. The extreme
    pole is the autonomous machine, which is most intelligent and to a great extent
    unpredictable in its behaviour.


    When we think of AI, robots and drones come to our mind. The Czech author Karel
    Capek in 1921 in play Rosum''s Universal Robot used the word robot. The word is
    derived from the Czech word robota meaning forced labour. Paul J. Springer highlights
    that there is a difference between a computer program and a robot. Unlike a computer
    program, a robot (or a drone for that matter) is capable of some form of direct
    action in the physical world. So, robots and drones are cyber-physical composite
    systems which comprise both physical and software components.


    From the French perspective, a military robot is defined as a system which possesses
    capabilities of perception, communication, decision-making and action. A robot
    might operate under human supervision but is also capable of improving its performance
    through automatic learning. So, a robot is a machine that can sense and act. Daniel
    Ichbiah, a robotics expert, defines a robot as a very powerful computer with powerful
    software housed in a mobile body and to act rationally on its perception of the
    world around.


    The Russian military encyclopaedia divides robots into three generations. The
    first-generation robots have software and remote control and can operate only
    in an organised environment. These robots are adaptive and possess some kind of
    sensory organ and are able to operate in previously unknown conditions, meaning
    that these machines are able to adapt to a changing environment. The third-generation
    robots are intelligent and have elements of AI in their control systems. One Russian
    policy analyst believes that the Russian military considers only the third-generation
    robots as Autonomous Weapon Systems (AWS). Those AWS, which could identify and
    track a target and fire without human supervision, can be labelled as Lethal Autonomous
