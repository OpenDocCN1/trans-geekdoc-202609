    the use of nuclear weapons by Pakistan. The IBGs using T-90 and T-72 tanks, self-propelled
    guns (SPGs) supported by tactical air force (helicopter gunships providing ground
    support and cover to be given by the fighter jets would make rapid thrusts into
    Pakistani territory within 96 hours of ordering them. The IBGs would go up to
    a depth of 80 km within the Pakistani territory, and then Delhi would start pressing
