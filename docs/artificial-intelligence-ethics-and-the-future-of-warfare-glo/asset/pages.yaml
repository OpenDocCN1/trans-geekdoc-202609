    scientific community is continuously working towards developing various applications
    of this technology. Currently, much work is being done towards developing various
    defence applications of AI. Actually, some armed forces are already inducting
    this technology in their overall defence architecture. From a military perspective,
    AI has both offensive and defensive dimensions. For some years now, there is an
    ongoing debate on the efficacy of Lethal Autonomous Weapon Systems (LAWS) in modern-conflict.
    This debate, which mainly revolves around the aspects of ethics and morality,
    is still evolving. This chapter discusses various AI-related military developments.


    # Context


    Technology shapes warfare. It defines, or circumscribes warfare and is known as
    the instrumentality of warfare. It is viewed that technological shapes warfare;
    and, conversely, war (not warfare) shapes technology. Also, military technology
    is not deterministic but opens the doors for experimentation, and modern-day wars
    are the best examples of this. The first two decades of the twenty-first century
    have seen an explosion in technological advancements affecting cultures, economies
    and governments around the world. Militaries and the realm of warfare have been
    no different. Technological innovation is known to modify the way armies engage
    with each other, and in doing so, it has been observed that it rema the boundaries
    of how conflicts are fought. Seismic changes in waging have always owing to the
    introduction of new technologies. From the horse-drawn armies of the 1910s, through
    the mechanised forces of the 1930s and jet-propelled aircraft of the 1940s, to
    the nuclear age, a technology that has dictated the processes of warfare. General
    Richard Barr – a former head of Britain’s Joint Forces Command – argues that:
    ‘We are seeing changes on the battlefield as profound as anything in the past
    150 years as data, artificial intelligence and connectivity become the key, components
    of warfare. But we are in the foothills of what is coming.¹


    John McCarthy, a professor emeritus of computer science at Stanford, is credited
    with having the term ‘artificial intelligence.’ McCarthy was a giant in the field
    of computer science and a seminal figure in the field of AI. While at Dartmouth
    in 1955, McCarthy authored a proposal for a towmonth, 10-person summer research
    conference on ‘artificial intelligence’ – the first use of the term in publication.³
    He defined AI as the science and engineering of making intelligent machines intelligent
    computer programs. Important advances in AI in recent times have led to many debates
    about the potential social, economic and security impact of AI. However, little
    sustained attention has been paid to the impact of AI on international'
