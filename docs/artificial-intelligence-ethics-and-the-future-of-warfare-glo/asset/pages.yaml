  md: '# 126 Gregory M. Reichberg and Henrik Syse


    decision aids are devices that support human decision making in complex environments...
    Such systems are meant to support human cognitive processes of information analysis
    and/or response selection by providing automatically generated cues to aid the
    human user or system state and to respond appropriately. Two different functions
