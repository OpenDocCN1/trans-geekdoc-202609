    +   - Accelerated and better decision-making.

    - Enhanced human cognitive and physical performance.

    - Heightened military readiness and operational competency.

    - New systems of design, manufacture and sustainability of military systems.

    - Capability to produce and detect strategic cyberattacks and information operations.

    - Innovative capabilities that can upset military balances.


