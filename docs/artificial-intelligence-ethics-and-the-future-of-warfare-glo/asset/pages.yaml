  md: '# AI-cyber nexus 119


    # Conclusion


    Many nations today are prioritising the applications of AI towards civilian applications
    for economic enhancement, social change and military modernisation. The noteworthy
    aspect is the dual-use feature of these applications, that is, any development
    in the civilian sector could well be adopted in the military domain. For instance,
    if a self-driving car becomes useful for battle tanks, or the success of autonomous
    food or medical drones can also be applied to weapon-carrying drones. These AI
    tools on the one hand facilitate operation at great scale and speed but also make
    them prone to vulnerabilities and errors.


    The added complexity of the AI-cyber tools would only further deteriorate the
    current stability matrix. As demonstrated in the ongoing Russia-Ukraine War, cyber
    operations are feeding into kinetic forces, doubling the chaos of war. Additionally,
    these campaigns have a spillover effect that is not limited by borders and have
    consistently caused disruptions for neighboring nations.


    The war in Ukraine may not have seen the deployment of killer robots or fully
    autonomous weapons but a comprehensive use of semi-autonomous drones and reconnaissance
    vehicles which have very highlights the usefulness of AI. These small successes
    are an indication of the improvement and advancement of AI''s abilities and that
    the future is no longer bleak for AI weapons. Especially in combat scenarios,
    the demand for speed in conflict will inevitably compel militaries to delegate
    more decisionmaking to machines. AI tools may currently have in a narrow phase
    and further challenges of the absence of quality data and unreliability towards
    the black box technology. However, one cannot deny that the current war presents
    opportunities in the form of a testing ground as well a source of data collection
    that can later be used in progressing the application of AI.


    As of now, cyber operations and AI systems have been deployed lately in the war,
    but a combination of cyber-AI has considerable potential for ''fuscation and strategic
    misdirection.⁴⁵ Policymakers must be cognizant that a combination of AI-cyber
    tools adds a new dimension to the challenges of ''validity and attribution'' already
    present in cyber campaigns. Given the opportunities for data poisoning and manipulation,
    the trust and integrity of a system would always be questionable. Going forward,
    the integration of AI-cyber tools within weapon systems could lead to unforeseen
    scenarios, widen the trust gap between adversaries and increase the risk of miscalculation.
    Especially in the case of countries possessing nuclear'
