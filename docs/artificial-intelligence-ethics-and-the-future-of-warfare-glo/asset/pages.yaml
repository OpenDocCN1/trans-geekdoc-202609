    # Strategic scenario


    From the very beginning, Pakistan could not come to terms with the reality that
    Muslim-dominated Kashmir would be part of India. Pakistan had fought three conventional
    wars (1947–48, 1965, 1971) and one quasi-conventional war (Kargil 1999) occupied
    Kashmir but had eventually failed. Hence, Pakistan’s strategy is to win India
    through a ‘thousand cuts’ by encouraging jikhadi militancy in different parts
    of the country. Inter-Services Intelligence (ISI, an organ within the Pakistan
    Army) is the principal mechanism through which Islamabad recruits, trains and
    finances the various military organisations providing material and moral support
    to the insurgent groups operating in North-East India, China provides diplomatic
    and military support to Pakistan in the latter’s endeavour to weaken India by
    pursuing the strategy of a ‘thousand cuts’. Beijing’s strategy was to employ multiple
    internal rebellions, which thus remain within South Asia and not be in position
    to counter the People’s Republic of China (PRC) rising influence in South East
    and West Asia. In addition to China, Myanmar and Bangladesh occasionally provide
    arms and sanctuaries to the Mizo and Naga militants of North-East India.


    In desperation, India conceived of a strategy of launching a limited conventional
    strike by the integrated battle groups (IBGs) under the nuclear umbrella, lest
    Pakistan continue to aid the insurgents in Kashmir. This is known as India’s Cold
