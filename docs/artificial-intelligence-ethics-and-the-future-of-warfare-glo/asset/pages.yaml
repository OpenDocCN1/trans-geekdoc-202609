    # Logic stack for emergent non-carbon sentience


    Non-carbon sentience is also non-anthropic sentience. Deep learning systems based
    on AGI and the still ASI highlight a specific dimension of the anthropic principle.$^{22}$
    The principle, simply put, considers the age of the universe and its physical
    constraints as necessary boundary conditions for the evolution of carbon-based
    life forms. The principle further deals with the notion that the Universe is fine-tuned
