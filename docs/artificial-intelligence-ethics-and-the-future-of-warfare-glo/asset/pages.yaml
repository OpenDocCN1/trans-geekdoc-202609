    # Autonomous weapon systems


    What is considered autonomous weapon systems (AWS) today had, until recently,
    only in science fiction and is already by several countries including Israel,
    Russia, the USA and South Korea.25 While there is no universally accepted definition
    of AWS, Grootof describes it as weapon systems that ‘based on conclusions derived
    from gathered information and pre-programmed constraints, is capable of independently
    selecting and engaging targets.26 In this view, it is not important whether other
    functionalities of the system are manually controlled by humans, as long as it
    maintains a high level of independence in its ‘kill-cycle’: target selection and
    engagement. The US Department of Defense (DoD) defines autonomous weapon systems
    as


    any system that, once activated, can select and engage targets without further
    intervention by a human operator. This includes human supervised AWS that are
    designed to allow human operators to override operations of the weapon system
    but can select and engage targets without further human input after activation.27


    This definition, again, indicates the presence of a human in the operational loop
    of AWS, as opposed to the perception of complete autonomy. Reitmeier28 distinguishes
    autonomy in weapon systems across three distinct levels:'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# AI and the future of armed conflicts 257


    +   1. A person ‘in the loop’ if they retain a high degree of oversight and control
    over the system (automatic systems).


    +   2. A person ‘on the loop’ if the system operates autonomously, but the person
    continues to monitor and control the process (semi-autonomous systems).


    +   3. Finally, a person ‘off the loop’ if the system operates autonomously without
    any human intervention (fully autonomous systems).


    The third group of AWS raises the argument of its very existence. Do “fully” autonomous
    systems exist? Researchers have doubted the capabilities of machines to be ‘fully’
    autonomous, as indicated in all the descriptions, there is always a human somewhere
    in the loop. The definition as to where the loop actually begins and ends is yet
    unclear. Where the loop is only limited to certain functionalities (the kill-cycle),
    then systems like the Israeli HARPY fall within this category. This chapter introduces
    the existence of defensive and offensive military systems that have incorporated
    high levels of autonomy. This ranges from autonomous drones such as the British
    Taurus Stealth drone, the Chinese Blow helicopter drone, the Israeli HARPY drone,
    the Russian T-14 Armata battle tank, the Israeli Iron Dome Missile Defense System,
    the American Sea-Hunter and several others. Generally, AI in military systems
    has been heralded as a major bowler of new generations of weaponry. These developments
    will likely determine policies, sizes of defence budgets, and the nature of future
    armed conflicts.


