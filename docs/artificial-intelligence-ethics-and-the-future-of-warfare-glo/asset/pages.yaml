    American Civil War (1861-1865). Though this itself was not an autonomous weapon,
    paved the way for the subsequent development and introduction of autonomy into
    weapons systems. For the era, a weapon that could fire 300 rounds per minute was
    an advantage against an enemy who needed to recoil and refill manually. Others
    followed, including the German G7e/T4 potentially (Falcon’s) torpedo. Then came
    the precision-guided munitions (PGMs), mostly autonomous due to the inability
    of the human operator to recall once they launched. There are also looting and
    hunting missiles which are autonomous for target identification and engagement.\36


