  md: '# # 6

    # SENTIENCE IN FUTURE WAR MACHINES


    The challenge of building ethics, morality and virtue as a normative engine


    Swaminathan Ramanathan


    # Introduction


    War machines of the future will be autonomous entities distinctly non-human but
    all the key human features. This is a challenge that we haven''t faced till now
    as a human species. It is a challenge that cannot leverage any previous human
    experience to anticipate and model future paths, dangers and strategies. All human
    knowledge about the world is derived from carbon life forms. To put it another
    way: we have no knowledge of non-carbon lifelike forms.¹ A future war machine
    will be one of several forms of non-carbon entities. A non-carbon entity with
    intelligence that passes the Turing Test (Artificial General Intelligence [AGI])
    is not far away. Humanity has neither encountered nor with a non-carbon intelligence
    until now.


    The progression from AGI to sentience is not an ''if'' but a ''when'' function.
    In the artificial intelligence (AI) community, sentience is still an emerging
    definition. Sentience is the capability to experience feelings and sensations,
    and it underpins all human systems. Normative thinking regulates human systems.
    Ethics, morality and virtue are three key normative instruments that define boundary
    conditions and the outer limits of outcomes as good, permissible and desirable
    or bad, impermissible or undesirable. In the context of AI, it is useful to think
    of non-carbon sentience as Artificial Superintelligence (ASI). War Machines of
    the Future will be one form of ASI.


    The key issue for ASI is not sentience. Sentience will emerge. The key challenge
    is the normative architecture that will regulate sentience. War machines of the
    future will not only need the most but will need it as a deep learning system.
    This chapter engages with the challenges of building a normative architecture
    for a war machine. In doing so, the


