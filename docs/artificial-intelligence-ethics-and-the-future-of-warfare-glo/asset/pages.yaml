  md: '# Biased human-machine system designs


    The third area in which biased AI may be an issue in military settings has to
    do with the way in which these systems are designed. While AI systems will be
    able to operate autonomously, there will still be a great deal of human-machine
    interaction ongoing in the future battlefields. Possible examples of this human-machine
    interaction include the use of headsets in combat settings which may make recommendations
    for the soldiers by analysing real-time data43 or to operate in a interface where
    a pilot is flying out their jet while also controlling and overseeing a fleet
    of autonomous jets.42 The concern is how might these systems be biased due to
    the way they have been designed, unintentionally, for men. As different researchers
    have shown, societal biases have resulted in a number of products and technologies
    being tested on and designed for men, and as a result of this, these are less
    effective for women.43 Different examples include how voice recognition programs
    work better on men''s voices than women''s voices,44 airbags in cars which are
    more effective at protecting men in a car crash,45 to even iPhone''s whose size
    have been based on the average man''s hand size, often larger than what is comfortable
    for a woman to use.46


    Drawing on the lessons learnt from these examples, we can consider how the military
    examples provided also be biased in their design and thus more difficult for women
    to use. Perhaps the helmet is designed for the average male head size, making
    it harder for the female soldier to use properly. Or in the situation with the
    fighter jet, it could be that the voice recognition program is less effective
    at understanding the female pilot''s voice. Examples in the working world where
    AI-enabled programs have been used by women which may contain some of these system
    design biases show how these biased systems create real and concrete consequences
    for the women as they try to go about doing their job. This provides another area
    in which we can see how gender and other forms of bias create negative consequences
    for women and other minority groups in military conflicts.


    # Conclusion


    Much of the international debates on regulating military uses of AI have focused
    on whether or not to ban LAWS.47 This is an important debate, and presents a number
    of ethical, moral and legal challenges to consider. However, there are a number
    of different military uses of AI other than just LAWS, and as has been presented
    in this chapter, these other uses of AI can contain different forms of biases.
    Militaries increasingly implement and adopt different uses of AI-enabled systems
    in warfare settings, it is important that they recognise the pervasive way in
    which biases can become'
