    # Examples of bias


    An initial promise and hope of the use of AI that it would not make the same mistakes
    humans make, including the types of biases that we as humans may or may not have.
    Our society has begun to use AI programs to help us in the work that we do, it
    has become clear that this promise is in reality false. Increasingly, there has
    been an awareness of biased AI as a problem facing our society, a problem which
    has received more attention recently. There have been some prominent examples
    in the last few years of the different types of bias that AI programs have. Whether
    this was Amazon''s resume filter program, due to the algorithms it relied, disqualified
    women for jobs, voice recognition programs in cars which struggle to identify
    women'' commands, or even an algorithm used in the US court system which falsely
    predicted that black citizens were twice likely to be at risk of committing crimes
    than ones. What these examples demonstrate that bias is a problem in AI and one
    has serious gendered and racial implications contributing to inequalities in society.


    # Lack of diversity and different entry points for bias into AI


    To mitigate bias in AI, it is important to understand the different ways that
    bias may become embedded into AI. While there are a number of contributing factors,
    one key factor is that the field of AI development has a diversity problem. Recent
    numbers show that 80% of AI professionals are men, with women making up only 15%
    of researchers at Facebook, and 10% at Google When it comes to black workers,
    this number drops to 4% at Facebook and Microsoft, and 2.5% at Google. To extent
    this is a main cause of the problem when it comes to AI and bias is something
    that is unclear and still in need of investigation, but there are those who believe
    that this is one of the main contributing factors to biased AI. While there are
    examples of how this lack of diversity is contributing to biased AI, there are
    also other factors that play a role. These will now be explored at two different
    levels, including: 1) bias from the developers, and 2) bias in the data.


