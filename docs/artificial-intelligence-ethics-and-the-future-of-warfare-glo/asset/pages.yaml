    This chapter initiates a case for the new logic system across four dimensions
    of Emergent Philosophy, Emergent Logic, Emergent Framework and Emergent Principles
    (see Figure 6.1). The chapter defines and uses Emergence in the way Swarm Intelligence¹
    defines it as ‘the collective behaviour of decentralized, self-organized systems,
