    embedded in these systems and take steps to try and mitigate and reduce biases.


    Gender is often seen as something equating to women,48 and therefore, the topic
    of gender biased AI has been equated to ways in which AI-enabled programs may
    differently and negatively impact women. However, as I have argued in this article,
    gender biased ideas about men, which may also intersect with other aspects of
    identity including religion and ethnicity, can result in lower thresholds for
    whether or not they are seen as military targets. AI-enabled systems which focus
    on threat assessments and provide recommendations for likely targets are high-risk,
    as they would be susceptible to bias from different angles, including that is
    from previous data used in an algorithm or through different attributes selected
    for an algorithm seen as increasing particular individuals'' threat level. If
    an algorithm draws on previous groups of men being seen as more likely military
    threats, regardless of that being the case.49


    The examples here have mainly drawn from the USA and Europe. We can certainly
    see how dynamics are playing out in the USA. Biases against women and minority
    groups are also present in parts of the world. For example, discriminatory and
    biased ideas about certain ethnic groups which result in being seen as a threat
    is a dynamic that exists in many parts of the world, whether that is China, India,
    South Africa and many other countries. Similar to the USA''s examples of biased
    AI wrongfully convicted Black Americans, how might the use of these programs in
    these other parts of the world contribute to and reinforce social inequalities?
    Additionally, as the IT sector is a male-dominated profession,50 programs which
    rely on human-machine interaction may also be similarly designed for men rather
    than women, as we have seen in the USA and other parts of Europe.


    The issue of bias in AI is a large serious and one that has many negative implications
    if a biased system were ever to be used in a military setting. NATO''s recent
    AI Strategy takes an important first step by stating that efforts must be made
    to mitigate bias. However, to mitigate this bias, it is important to understand
    how it can emerge in AI in the first place, and different steps can be taken to
    reduce this bias. Research on the online implications of gender (and other forms)
    of bias is still in its early stages when it comes to AI-based systems. While
    it is a topic gaining increased attention, it is also a topic that merits further
    research and a more detailed investigation. Such areas include bringing to attention
    the issue of biased AI from many different parts of the world, to make sure that
    different forms and processes of social inequalities around the world are considered,
    and not just those in the USA and Europe.'
