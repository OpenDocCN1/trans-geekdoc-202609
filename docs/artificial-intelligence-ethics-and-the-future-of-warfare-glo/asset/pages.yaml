  md: '# 128 Gregory M. Reichberg and Henrik Syse


    assess.¹10 It is here that robotic combatants are deployed, which would autonomously
    run through the entire F2T22EA cycle. Phase 6, ''Combat assessment,'' is concerned
    with surveying the damage (both intended and collateral) that has been caused
    by the targeting action, and whether this damage has furthered the achievement
    of goals, vis-à-vis collateral damage, is proportionate to these goals; the lawfulness
    of the operation, including whether the principle of distinction or other relevant
    rules have been violated, is also taken up in this stage.


    Of these phases, the first, fourth and fifth are primarily concerned with rendering
    decisions about actions to be done. For this reason, they are not directly relevant
    to our immediate concern with how AI serves in a decision-support capacity. Whether
    the decisions in the first and fifth phases could be rendered in autonomous mode
    by an AI device is (we note in passing) in principle possible. Defensive responses
    to attacks (nuclear or conventional) could be demanded, for instance, in air defense
    systems or nuclear deterrence reality, and would serve as an equivalent for a
    commander''s decision. The F2T2EA loop in the fifth phase, similarly, could be
    performed by a machine agent. This is for ongoing discussions about robotic combatants
    (so-called ''LAWS,'' ''AWS,'' or ''killer robots'').


    The third and sixth phases are primarily concerned with intelligence in the broad
    sense, namely the gathering and analysis of data regarding the operating environment,
    as well as the issuance of recommendations to decision-makers.¹¹ The second and
    third phases, in particular, have a vital impact on the direction and accomplishment
    of missions. Commanders are not bound to heed the information and advice they
    receive, but most often they do – otherwise their actions would be deemed hasty
    and ill-informed. Commanders must understand the facts on the ground before they
    decide what steps to take. Increasingly, this understanding derives from input
    that commanders receive from AI-enhanced algorithms structure so it can inform
    their decision-making in the most efficient manner possible.


    Efficiency is an extremely important consideration in gathering intelligence,
    because military operations, even when they result from much advance planning,
    are subject to time constraints, must be responsive to fast-changing adversarial
    developments, and require careful analysis of complex potential targets (an oil
