  md: 'For the FFT condition, the minimum validation loss was 6.41 with a training
    loss of 4.82 and for STD, the minimum validation loss was 9.14 with a training
    loss of 9.43. For the STD model, features from all channels were extracted and
    the final model used all the features except the slope sign change for a total
    of 46 features.


    The average test loss, meaning the performance on unseen data, per condition is
    shown in Figure 4 for the 11 sessions. The STD test loss is significantly different
    from the two other conditions (t-test, p < 0.05) but the FFT and RAW conditions
    are not different.


    The test loss for each subject is shown in Figure 5, each subject recorded 3 sessions
    except S2 who did only two calibration sessions. An example of the predicted angles
    versus the target labels is shown in Figure 6 for the RAW condition on the test
    set of subject S1. It consist of one repetition of each movement and lasts for
    56 seconds. The angles correspond to the sequence: Index Flexion, Middle Finger
    Flexion, Ring Finger Flexion, Ulmar Grasp, Open, Tridigigital Grasp, Power Grasp,
    Thumb opposition and Thumb opposition + flexion. It corresponds to a loss of 7.36.
    The baseline loss corresponding to a model outputting only the mean value of the
    targets was ~19.


    ![](img/d2423e8420ae194bb21d641517122d0f_3_0.png)


    # IV. DISCUSSION


    This work aimed at quantifying the performance of DL compared to a STD feature
    extraction approach. The results showed that both DL conditions (RAW and FFT)
    are performing better than STD. However, it is not possible to conclude on which
    approach between RAW and FFT is best suited for single finger proportional control.
    For simplicity, one could argue to keep the RAW condition to avoid computing the
    FFT and therefore reduce the computational time for real time applications. A
    possible optimization is the combination of time-frequency information merging
    the RAW and FFT approaches, increasing the amount of information that inputs the
    model.


    However, the amount of data per session in these experiments is relatively low
    (3 repetitions for the train set) which create uncertainty during the training
    of the different models and high differences between the validation and testing
    losses.


    ![](img/d2423e8420ae194bb21d641517122d0f_3_1.png)


    Another limitation to take into account is that the dataset comprised only fully
    open and closed positions held for several seconds without any real “rest/middle”
    position.or other arbitrary angles. Indeed, when the users follow movements shown
    on a screen, there are intrinsic delays due to their reaction time that create
    jitter between expected kinematics and actual finger positions. In the case of
    single finger proportional control, exact finger position is paramount. Therefore,
    obtaining synchronized middle values is challenging and may be obtained using
    a kinematic glove for example.


    Deep networks like CNNs need a huge amount of data to reach their maximum accuracy
    (e.g. ImageNet Challenge [26]) which means that increasing the amount of data
    could play a significant role in the performances obtained. However, a subject
    cannot reasonably record tens of hours of data in a single sitting. One possible
    solution is to leverage the information of several subjects to pre-train a general
    network that could be fine-tuned for the subject’s specific EMG activity. Several
    authors [13], [27], [28] investigated this approach and showed promising results
    for grasp classification, this strategy could be applied to single finger proportional
    control.


    # V. CONCLUSION


    To conclude, we showed that deep learning is a promising approach for proportional
    EMG decoding. Due to the placement of the electrodes on the forearm, these results
    obtained on healthy subjects could apply for trans-radial amputees or amputations
    that are more distal. On the decoding side, we cannot conclude on the best DL
    approach between raw signals or spectrogram as input since both outperformed the
    standard state-of-the-art approach but were not statistically different.


    For future developments, increasing the amount of data should be the main objective.
    Leveraging open access EMG databases like NinaPro [29], [30] to improve performances
    of DL for single-finger regression. The feasibility of this DL approach in real
    time to control a real prosthesis or any microprocessor should also be addressed
    due to the high computational cost of the models used.'
