    # II. METHODS


    # A. EMG Dataset and pre-processing


    The detailed protocol for EMG acquisition comes from Zhuang et al. (2019) experiment
    3 [21]. Briefly, four healthy subjects aged between 20 and 26 were recruited for
    this experiment. Ethical approval was obtained by the cantonal ethical committee
    of Vaud. Informed consent was obtained from all participants in the study. The
    subjects participated to 2 or 3 calibration sessions where EMG signals were recorded
    using a Noraxon Delsys system connected to a LabJack data acquisition card to
    record six channels placed around the subject''s forearm on specific muscles corresponding
    to the flexion of each finger and thumb opposition found with palpation. In this
    article, we focus only on the offline calibration part of the decoding model.
    The subjects followed a series of movements on a screen performed in a virtual
    environment. Hand kinematics were obtained from the finger angles shown on the
    video. The movements consisted in single and multi-finger movements and the virtual
    environment was synchronized with the EMG acquisition setup. The sequence of movements
    was repeated 5 times, each


    ![](img/d2423e8420ae194bb21d641517122d0f_1_1.png)


    Figure 2. Illustration of the movements present in the EMG recordings. with a
    hold period of 5 seconds and the total time of the video


    was 4.5 minutes (see Figure 1). The EMG signals were recorded at 2 kHz and the
    kinematics at 60 Hz.

    From the 15 joint angles recorded during the training phase on the virtual environment,
    six joint angles were selected: the metacarpophalangeal joint angle of each finger
    to estimate finger flexion/extension and the carpometacarpal joint angle for thumb
    opposition. Kinematic data was linearly interpolated and oversampled at 2 kHz
    to match the EMG signal sampling frequency. The dataset was then split into train,
    validation and test set, the three first repetitions were used for the training
    set, one for the validation set and the last one for testing. This non-random
    split was done to consider the real-world use case of RPH. Indeed, amputees would
    use their RPH after this calibration phase and therefore the last repetition for
    testing is the most suited repetition to evaluate performance of the decoding
    in real world scenario. For each set, a sliding window of 192ms with a moving
    step of 40ms (152ms overlap) was used, the angle values of the end of each window
    were kept as labels and the angles were rescaled between 0 (fully open) and 10
    (fully flexed).


    # B. Learning paradigms


    In order to quantify the performance of DL vs STD, three learning paradigms are
    compared: The standard feature engineering approach (STD), a DL approach with
    the raw signal as input (RAW) and a DL approach with the spectrogram computed
    with the fast Fourier transform of each individual window (FFT) as input. For
    the two DL approaches, the input signal window is reshaped as squared images as
    in [22]. In the STD one, EMG signals are processed and features are extracted
    from each channel. We chose 9 well-explored time and frequency domain features
    to extract from each time window [23]:


    +   1. Mean Absolute Value

    +   2. Wavelength: Cumulative length of waveform over time

    +   3. Maximum Absolute Value'
