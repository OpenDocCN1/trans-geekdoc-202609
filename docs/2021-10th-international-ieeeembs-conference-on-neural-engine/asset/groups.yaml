    ## 基于表面肌电记录的卷积神经网络手指比例控制深度学习


    V. Mendez, L. Pollina, F. Artoni, S. Micera IEEE会员


    摘要— 对于上肢截肢者，机器人义手（RPH）的控制远未理想。基于肌电信号的机器人义手同时且比例的手指控制仍然具有挑战性。基于受试者遵循预定义的单指和多指动作序列的肌电和运动学记录，我们旨在预测手指屈曲和拇指对阻角度。我们比较了两种基于深度学习（DL）的方法，第一种使用原始肌电信号，第二种使用信号的频谱作为输入，与手指角度回归的标准最先进的解码技术（STD）进行对比。使用遗传算法进行超参数优化，我们在一次记录会话中为每种条件获得了优化的模型架构（以及STD情况下的特征集）。然后，我们在四位受试者可用的十一段肌电和手指运动学记录上评估了每种条件的最佳模型。基于卷积神经网络的两种DL方法以相似的平均平方误差损失预测了手指角度，但两者都优于标准方法，用于同时单指角度的回归。这种拟议的解码策略和超参数优化框架为进一步改善机器人义手的单指比例控制提供了基础。


    ## I. 引言


    控制人手感觉简单直观，但依赖于一种复杂且强大的控制策略，该策略允许灵巧操纵各种物体。手部丧失是一件创伤性事件，不仅带来运动后果，还带来心理后果 [1]，导致执行物体操纵、感觉以及非语言沟通的能力受限。机器人义手（RPH）旨在恢复前臂截肢者的手部功能。为了捕捉用户的意图，这些义手通常依赖于从残肢前臂肌肉活动中记录的肌电图（EMG）信号。商业上可用的义手通常使用放置在剩余拮抗肌肉（通常是手腕屈曲/伸展）上的两个表面肌电（sEMG）电极。这些机器人手的控制依赖于一种简单的阈值策略来控制一个自由度
    [2]。握把类型可以通过共收缩在预定义握把之间循环选择。


    通过使用更多电极（~6-8），模式识别算法是这种直接控制方法的替代方案。它包括从肌电信号中提取判别特征，以直接解码用户意图的握把类型。在校准阶段后，用户只需想象用其幻肢执行所需握把即可。结果显示4类的准确率为98%，50类的准确率最高可达75%
    [3][4]。其他研究组展示了单指屈曲和伸展的解码可能性 [5]，单指和多指动作的准确率为99%。


    虽然这种方法更直观，但它仍然不同于控制手指的自然方式。确实，为了使手指处于中间位置，用户必须收缩肌肉直到达到所需角度，然后放松以保持机器人义手在相同位置。为了获得更加自然的控制，少数研究组展示了执行角度回归而不是运动分类以进行单指比例控制的可能性
    [6]-[8]。


    为了从肌电数据中解码有意义的信息，有必要将信号转换为信息丰富、判别性强且独立的特征。研究人员已经致力于设计从肌电信号中解码运动意图的最佳特征数十年了 [9]。自2016年第一个示例
    [10] 以来，肌电解码社区已从这种标准特征工程（STD）方法转向使用深度学习（DL）和在大多数情况下使用卷积神经网络（CNN）的特征学习方法。标准深度网络通常由多个卷积层接全连接层组成
    [11]。卷积层可以从输入信号中学习判别特征并降低其维度。这些特征随后被用作全连接层的输入，全连接层将进行预测（参见图1）。对于肌电解码，CNN的输入可以是原始信号
    [12] 或信号的频谱 [13]。多项研究表明，深度网络可以直接从原始信号中学习更具判别性的特征，以执行握把分类，其准确率高于STD [14]、[15]。少数研究组展示了使用表面肌电进行手臂
    [16] 和手腕运动 [17]-[19] 的DL运动意图回归，结果有前景。有关机器人义手的更详细综述，参见 [20]。


    完美的运动解码策略可以描述为一种将受试者灵巧度提高到与健康手相当水平的策略。为了尽可能接近手的自然控制，必须连续且同时解码手指角度。由于DL在握把分类中相比STD方法具有更高的性能，我们旨在量化DL与STD方法在单指比例控制中的性能。


    ![](img/d2423e8420ae194bb21d641517122d0f_1_0.png)


    图1. STD方法与深度学习之间的训练范式差异（虚线对象表示可调超参数）。


    ## II. 方法


    ### A. 肌电数据集及预处理


    肌电采集的详细方案来源于Zhuang等人（2019）实验3 [21]。简言之，四名年龄在20至26岁之间的健康受试者参与了此次实验。伦理批准已由沃州 kantonal伦理委员会获得。研究中所有参与者均已签署知情同意书。受试者参加了2或3次校准会话，其中使用Noraxon
    Delsys系统连接到LabJack数据采集卡记录肌电信号，共六个通道，放置在受试者前臂特定肌肉周围，这些肌肉对应触诊发现的每个手指屈曲和拇指对阻。在本文中，我们仅关注解码模型的离线校准部分。受试者遵循在虚拟环境中屏幕上显示的一系列动作。手部运动学从视频显示的手指角度获得。动作包括单指和多指运动，虚拟环境与肌电采集设备同步。运动序列重复了5次，每次


    ![](img/d2423e8420ae194bb21d641517122d0f_1_1.png)


    图2. 肌电记录中存在的动作示意图。包含5秒保持期，视频总时长为4.5分钟（参见图1）。肌电信号以2 kHz采样，运动学以60 Hz采样。


    在虚拟环境训练阶段记录的15个关节角度中，选择了六个关节角度：每个手指的掌指关节角度以估计手指屈曲/伸展，以及用于拇指对阻的桡中手关节角度。运动学数据经过线性插值，并以2
    kHz过采样以匹配肌电信号采样频率。随后将数据集分为训练集、验证集和测试集，前三次重复用于训练集，一次用于验证集，最后一次用于测试。这种非随机划分是为了考虑机器人义手的实际应用场景。确实，截肢者在校准阶段后将使用他们的机器人义手，因此最后一次重复用于测试是评估实际场景中解码性能最合适的重复。对于每个集，使用了192ms的滑动窗口，移动步长为40ms（152ms重叠），保留每个窗口末端的角度值作为标签，并将角度重新缩放到0（完全张开）和10（完全屈曲）之间。


    ### B. 学习范式


    为了量化DL与STD的性能，比较了三种学习范式：标准特征工程方法（STD）、以原始信号为输入的DL方法（RAW）以及以使用快速傅里叶变换计算的各个窗口频谱（FFT）为输入的DL方法。对于两种DL方法，输入信号窗口被重塑为方形图像，如[22]所示。在STD方法中，肌电信号经过处理，并从每个通道提取特征。我们选择了9个在时间域和频率域中研究较为充分的特征，从每个时间窗口提取
    [23]：


    - 1. 平均绝对值

    - 2. 波长：波形随时间累计长度

    - 3. 最大绝对值


