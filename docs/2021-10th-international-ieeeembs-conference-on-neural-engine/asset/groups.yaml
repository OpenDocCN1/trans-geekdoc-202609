    # C. Hyper-parameter optimization


    There is a high number of hyper-parameters to optimize for each paradigm. Among
    those, we optimized a set of parameters based on the first session of the first
    subject due to computational power required to perform a hyper-parameter search
    for each recording. The hypothesis being that the quantity of information is relatively
    the same for each recording and therefore, the complexity of the dataset is relatively
    the same, meaning that the best model architecture for one recording is a good
    model for the other recordings.


    For the two DL approaches (RAW and FFT), we started from a VGG-like architecture
    [24] and optimized the shape of the network: the number of convolutional layers
    before each average pooling layer (up to 3), the number of pooling layer (up to
    5) and the number of filters for each convolutional layer (16, 32, 64, 128). A
    batch-normalization follows each convolutional layer. Then, the number of fully
    connected layers (up to two layers) and the number of nodes for each layer (16,
    32, 64) were also tuned. Except from the architectural parameter, the drop rate
    was also optimized (0, 0.2, 0.5) as well as the L2 regularization rate (0, 1e-3,
