    +   4. Standard Deviation

    +   5. Zero Crossings: Number of times the signal crosses zero

    +   6. Slope sign changes: Number of time that the slope of the EMG signal changes
    sign

    +   7. Root Mean Square

    +   8. Log detector: \(\frac{1}{e^N} \sum_{i=1}^N log(|x_i|)\) where \(x_i\) is
