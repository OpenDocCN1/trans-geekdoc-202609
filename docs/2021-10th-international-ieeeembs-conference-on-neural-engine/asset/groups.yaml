    ### C. 超参数优化


    每种范式都有大量超参数需要优化。其中，基于第一个受试者的第一次会话，我们优化了一组参数，因为对每次记录进行超参数搜索所需的计算能力有限。其假设是每次记录的信息量相对相同，因此数据集的复杂度也相对相同，这意味着一种记录的最佳模型架构也是其他记录的良好模型。


    对于两种深度学习方法（RAW 和 FFT），我们以类 VGG 架构 [24] 为起点，优化了网络结构：每个平均池化层之前的卷积层数量（最多 3 层）、池化层数量（最多
    5 层）以及每个卷积层的滤波器数量（16、32、64、128）。每个卷积层后都接一个批量归一化层。接着，全连接层数量（最多两层）和每层的节点数（16、32、64）也进行了调优。除架构参数外，还优化了丢弃率（0、0.2、0.5），以及
    L2 正则化率（0、1e-3、0.1）、学习率（0.1、0.01、0.001）、x 维度和 y 维度的卷积滤波器大小（1、3、5）以及图像边缘的填充策略（有或无）。CNN
    网络采用批量梯度下降进行优化，批量大小为 32 个样本，训练 50 个 epoch，每 10 个 epoch 学习率下降 \(\frac{1}{2}\)，且如果验证损失在超过
    13 个 epoch 内未下降，则采用早停策略。


    对于 STD 方法，模型为多层感知机（MLP），因此需要调优的参数较少。然而，特征选择是一个重要的过程，以避免对数据过拟合。因此，超参数包括是否选择某个特征、全连接层数量（最多
    3 个隐藏层）、每层节点数（16、32、64、128、256）、丢弃率（0、0.2、0.5）、L1 和 L2 正则化项（0、1e-3、0.1）、学习率（0.1、0.01、0.001）以及优化器（Adam、RMSprop、批量梯度下降）。MLP
    采用批量梯度下降进行优化，批量大小为 16 个样本，训练 100 个 epoch，同样采用每 10 个 epoch 学习率下降 \(\frac{1}{6}\)
    的阶梯式衰减，且如果验证损失在超过 13 个 epoch 内未下降，则采用早停策略。所有模型均使用均方误差损失（MSE）进行训练。


    由于超参数空间维度较高，在合理时间内无法进行网格搜索。因此，我们采用基于遗传算法（GA）的参数优化方法 [25]。问题被表述为解域的遗传表示，其中每个超参数被编码为染色体上的基因，可取离散可能值之一。适应度函数被编码为训练模型的验证损失，以评估解域。创建了一个包含
    20 个随机个体的种群，并使用基于适应度比例（或轮盘赌）的后代选择方法进行了 200 代训练。突变率设置为 0.1，选择率设置为 0.6。


    ### D. 每个受试者的性能评估


    在对一次会话进行超参数优化后，将对所有可用记录应用相同的预处理步骤，以便对每条可用记录训练一个模型。对于每条记录，模型被训练了十次，并保留验证损失最低的模型。此步骤是必要的，以减少模型陷入局部最小值的可能性。然后，在测试集上评估最佳模型。


    ![](img/d2423e8420ae194bb21d641517122d0f_2_0.png)


    ## III. 结果


    通过遗传算法获得的三种范式的最佳模型为 RAW 条件，其验证损失为 5.34，训练损失为 2.20。模型架构如图 3 所示。该模型训练时丢弃率为 50%，不使用
    L2 归一化，学习率为 0.01，卷积掩码形状为 (3, 1)，并使用 0 填充以保持相同的输出维度。


    ![](img/d2423e8420ae194bb21d641517122d0f_2_1.png)


    对于 FFT 条件，最小验证损失为 6.41，训练损失为 4.82；对于 STD，最小验证损失为 9.14，训练损失为 9.43。对于 STD 模型，提取了所有通道的特征，最终模型除斜率符号变化外使用了所有特征，总计
    46 个特征。


    图 4 显示了 11 次会话中各条件的平均测试损失（即未见数据上的性能）。STD 测试损失与另外两种条件存在显著差异（t 检验，p < 0.05），但 FFT
    和 RAW 条件之间无差异。


    图 5 显示了每个受试者的测试损失，每个受试者记录了 3 次会话，除了 S2 仅进行了两次校准会话。图 6 显示了 RAW 条件下受试者 S1 测试集中预测角度与目标标签的示例。它包含每种动作的一次重复，持续
    56 秒。角度对应序列：食指屈曲、中指屈曲、无名指屈曲、尺偏握、张开、三指捏握、力量握、拇指对抗以及拇指对抗 + 屈曲。其对应损失为 7.36。基线损失（即仅输出目标均值的模型）约为
    19。


    ![](img/d2423e8420ae194bb21d641517122d0f_3_0.png)


    ## IV. 讨论


    本研究旨在量化深度学习与 STD 特征提取方法相比的性能。结果表明，两种深度学习条件（RAW 和 FFT）均优于 STD。然而，无法得出在 RAW 和 FFT
    之间哪种方法更适合单手指比例控制的结论。为求简单，有人可能会主张保留 RAW 条件以避免计算 FFT，从而降低实时应用的计算时间。一种可能的优化是结合时频信息，融合
    RAW 和 FFT 方法，增加输入模型的信息量。


    然而，这些实验中每次会话的数据量相对较小（训练集为 3 次重复），这在不同模型训练过程中产生不确定性，并导致验证损失与测试损失之间存在较大差异。


    ![](img/d2423e8420ae194bb21d641517122d0f_3_1.png)


    另一项需要考虑的局限性是，数据集仅包含保持几秒钟的完全张开和闭合位置，没有真正的“休息/中间”位置或其他任意角度。确实，当用户跟随屏幕上显示的动作时，由于其反应时间存在固有延迟，导致预期动力学与实际手指位置之间出现抖动。在单手指比例控制的情况下，精确的手指位置至关重要。因此，获取同步的中间值具有挑战性，例如可以使用动力学手套来实现。


    像 CNN 这样的深度网络需要大量数据才能达到最大精度（例如 ImageNet 挑战 [26]），这意味着增加数据量可能在所获得的性能中发挥重要作用。然而，受试者无法在单次会话中合理地记录几十小时的数据。一种可能的解决方案是利用多个受试者的信息预训练一个通用网络，然后针对受试者特定的
    EMG 活动进行微调。多位作者 [13]、[27]、[28] 研究了这种方法，并在握把分类方面取得了有希望的结果，该策略可应用于单手指比例控制。


    ## V. 结论


    总之，我们表明深度学习是比例 EMG 解码的一种有前景的方法。由于电极放置在前臂上，在健康受试者上获得的这些结果可能适用于桡远端截肢者或更远端的截肢情况。在解码方面，我们无法得出原始信号还是频谱图作为输入的最佳深度学习方法，因为两者均优于标准的最先进方法，但在统计上无显著差异。


    未来发展方面，增加数据量应是主要目标。利用 NinaPro [29]、[30] 等开放获取 EMG 数据库，以提高深度学习在单手指回归方面的性能。由于所用模型的计算成本高昂，还应解决这种深度学习方法在实时控制真实义肢或任何微处理器方面的可行性。


