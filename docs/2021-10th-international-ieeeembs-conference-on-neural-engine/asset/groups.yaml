    and the second one using the spectrogram of the signal as input, with the standard
    state of the art decoding technique (STD) for finger angle regression. Using a
    genetic algorithm for hyper-parameter optimization, we obtained an optimized model
    architecture (and set of features in the case of STD) for each condition on one
    recording session. Then, we evaluated the best model of each condition on the
    eleven EMG and finger kinematics recordings available from four subjects. The
    two DL approaches based on convolutional neural networks predicted finger angles
    with a similar mean squared error loss but both of them outperformed the standard
    approach for the regression of simultaneous single-finger angles. This proposed
    decoding strategy and hyper-parameter optimization framework provides a basis
    to further improve single finger proportional control for RPHs.


    ## I. INTRODUCTION


    Controlling the human hand feels simple and intuitive but relies on a sophisticated
    and robust control strategy that allows for dexterous manipulation of a variety
    of objects. Hand loss is a traumatic event with not only motor but also psychological
    consequences [1], resulting in limited ability to perform object manipulation,
    sensing, as well as non-verbal communication. Robotic Prosthetic Hands (RPHs)
    aim at restoring hand functionality in trans-radial amputees. In order to capture
    the user’s intention, these RPHs usually rely on electromyographic (EMG) signals
    recorded from their residual forearm muscle activity. Commercially available RPHs
    usually use two surface EMG (sEMG) electrodes placed on remaining antagonist muscles
    (usually wrist flexion/extension). The control of these robotic hands rely on
    a simple threshold based strategy controlling one degree of freedom [2]. The type
    of grasp can be selected using co-contraction to cycle between pre-defined grasps.


    By using more electrodes (~6-8), pattern recognition algorithms are an alternative
    to this direct control approach. It consists of extracting discriminative features
    from the EMG signals to decode directly the type of grasp intended by the user.
    After a calibration phase, the user only has to think to perform the desired grasp
    with his phantom hand. Results showed 98% accuracy on 4 classes [3] and up to
    75% for 50 classes [4]. Other groups showed the possibility to decode single finger
    flexion and extension [5] with performance of 99% accuracy on single and multi-finger
    movements.


    Although this approach is more intuitive, it is still different from the natural
    way of controlling finger. Indeed, to obtain fingers in a middle position, the
    user has to contract his muscles until the desired angle is reached then relax
    to keep the RPH in the same position. In order to obtain an even more natural
    control, few groups showed the possibility to perform single finger proportional
    control performing angle regression instead of movement classification [6]-[8].


    To decode meaningful information from EMG data, it is necessary to transform the
    signals into informative, discriminating and independent features. It has been
    now several decades that researchers have been working on the design of the best
    features to decode motor intentions from EMG signals [9]. Since the first example
    in 2016 [10], the EMG decoding community shifted from this standard feature engineering
    (STD) approach to feature learning approach using deep learning (DL) and in most
    cases convolutional neural networks (CNN). The standard deep networks usually
    consists of several convolutional layers followed by fully-connected layers [11].
    Convolutional layers can learn discriminative features from the input signal and
    reduce its dimension. These features are then used as input to the fully connected
    layers that will make the prediction (see Figure 1). For EMG decoding, the input
    of CNNs can be either the raw signal [12] or the spectrogram of the signal [13].
