  md: "# Dependency Injection\n\nYou can find all the code for this chapter here\n\
    \nIt is assumed that you have read the structs section before as some understanding\
    \ of interfaces will be needed for this.\n\nThere are *a lot* of misunderstandings\
    \ around dependency injection around the programming community. Hopefully, this\
    \ guide will show you how\n\n+   - You don't need a framework\n+   - It does not\
    \ overcomplicate your design\n+   - It facilitates testing\n+   - It allows you\
    \ to write great, general-purpose functions.\n\nWe want to write a function that\
    \ greets someone, just like we did in the hello-world chapter but this time we\
    \ are going to be testing the *actual printing*.\n\nJust to recap, here is what\
    \ that function could look like\n\n```\n```go\nfunc Greet(name string) {\n   \
    \ fmt.Printf(\"Hello, %s\", name)\n}\n```\n```\n\nBut how can we test this? Calling\
    \ fmt.Printf prints to stdout, which is pretty hard for us to capture using the\
    \ testing framework.\n\nWhat we need to do is to be able to **inject** (which\
    \ is just a fancy word for pass in) the dependency of printing.\n\n**Our function\
    \ doesn't need to care *where* or *how* the printing happens, so we should accept\
    \ an *interface* rather than a concrete type.**"
