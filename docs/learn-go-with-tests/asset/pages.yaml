    # How do we test we return the correct markup?


    There are a few ways. As has been emphasised throughout the book, it is important
    that the tests you write have sufficient value to justify the cost.


    +   1. Write a browser based test, using something like Selenium. These tests
    are the most "realistic" of all approaches because they start an actual web browser
    of some kind and simulates a user interacting with it. These tests can give you
    a lot of confidence your system works but are more difficult to write than unit
    tests and much slower to run. For the purposes of our product this is overkill.

    +   2. Do an exact string match. This can be ok but these kind of tests end up
    being very brittle. The moment someone changes the markup you will have a test
    failing when in practice nothing has actually broken.

    +   3. Check we call the correct template. We will be using a templating library
    from the standard lib to serve the HTML (discussed shortly) and we could inject
    in the thing to generate'
