  md: 'private functions as being "less stable" and you don''t want to couple your
    tests to them.


    +   - I feel like if a test is working with more than 3 mocks then it is a red
    flag - time for a rethink on the design

    +   - Use spies with caution. Spies let you see the insides of the algorithm you
    are writing which can be very useful but that means a tighter coupling between
    your test code and the implementation. Be sure you actually care about these details
    if you''re going to spy on them


    # # Can''t just use a mocking framework?


    Mocking requires no magic and is relatively simple; using a framework can make
    mocking seem more complicated than it is. We don''t use automocking in this chapter
    so that we get:


    +   - a better understanding of how to mock

    +   - practise implementing interfaces


    In collaborative projects there is value in auto-generating mocks. In a team,
    a mock generation tool codifies consistency around the test doubles. This will
    avoid inconsistently written test doubles which can translate to inconsistently
    written tests.


    You should only use a mock generator that generates test doubles against an interface.
    Any tool that overly dictates how tests are written, or that use lots of ''magic'',
    can get in the sea.


    # # Wrapping up


    # # More on TDD approach


    +   - When faced with less trivial examples, break the problem down into "thin
    vertical slices". Try to get to a point where you have working software backed
    by tests as soon as you can, to avoid getting in rabbit holes and taking a "big
    bang" approach.'
