  md: "```\ntype WebsiteChecker func(string) bool\n\nfunc CheckWebsites(wc WebsiteChecker,\
    \ urls []string) map[string]\nresults := make(map[string]bool)\n\n    for _, url\
    \ := range urls {\n        go func() {\n            results[url] = wc(url)\n \
    \       }()\n    }\n\n    return results\n}\n```\n\nBecause the only way to start\
    \ a goroutine is to put `go` in front of a function call, we often use *anonymous\
    \ functions* when we want to start a goroutine. An anonymous function literal\
    \ looks just the same as a normal function declaration, but without a name (unsurprisingly).\
    \ You can see one above in the body of the `for` loop.\n\nAnonymous functions\
    \ have a number of features which make them useful, two of which we're using above.\
    \ Firstly, they can be executed at the same time that they're declared - this\
    \ is what the `()` at the end of the anonymous function is doing. Secondly they\
    \ maintain access to the lexical scope they are defined in - all the variables\
    \ that are available at the point when you declare the anonymous function are\
    \ also available in the body of the function.\n\nThe body of the anonymous function\
    \ above is just the same as the loop body was before. The only difference is that\
    \ each iteration of the loop will start a new goroutine, concurrent with the current\
    \ process (the `WebsiteChecker` function) each of which will add its result to\
    \ the results map.\n\nBut when we run `go test`:\n\n```\n--- FAIL: TestCheckWebsites\
    \ (0.00s)\n```"
