- pgno: 11
  md: '+   - Feedback loops


    I am going to focus on refactoring. It''s a phrase that gets thrown around a lot
    "we need to refactor this" - said to a developer on their first day of programming
    without a second thought.


    Where does the phrase come from? How is refactoring just different from writing
    code?


    I know that I and many others have *thought* we were doing refactoring but we
    were mistaken


    Martin Fowler describes how people are getting it wrong


    However the term "refactoring" is often used when it''s not appropriate. If somebody
    talks about a system being broken for a couple of days while they are refactoring,
    you can be pretty sure they are not refactoring.


    So what is it?


    # Factorisation


    When learning maths at school you probably learned about factorisation. Here''s
    a very simple example


    Calculate 1/2 + 1/4


    To do this you *factorise* the denominators, turning the expression into


    ```

    2/4 + 1/4 which you can then turn into 3/4.

    ```


    We can take some important lessons from this. When we *factorise* *the expression*
    we have **not changed the meaning of the expression**. Both of them equal 3/4
    but we have made it easier for us to work with; by changing 1/2 to 2/4 it fits
    into our "domain" easier.'
  merge: -1
  img_proc: true
- pgno: 12
  md: "When you refactor your code, you are trying to find ways of making your code\
    \ easier to understand and \"fit\" into your current understanding of what the\
    \ system needs to do. Crucially **you should not be changing behaviour**.\n\n\
    # An example in Go\n\nHere is a function which greets `name` in a particular `language`\n\
    \n```\n```go\nfunc Hello(name, language string) string {\n    if language == \"\
    es\" {\n        return \"Hola, \" + name\n    }\n\n    if language == \"fr\" {\n\
    \        return \"Bonjour, \" + name\n    }\n\n    // imagine dozens more languages\n\
    \n    return \"Hello, \" + name\n}\n```\n```\n\nHaving dozens of `if` statements\
    \ doesn't feel good and we have a duplication of concatenating a language specific\
    \ greeting with , and the `name`. So I'll refactor the code.\n\n```\n```go\nfunc\
    \ Hello(name, language string) string {\n    return fmt.Sprintf(\n        \"%s,\
    \ %s\",\n        greeting(language),\n        name,\n    )\n}\n\nvar greetings\
    \ = map[string]string {\n    \"es\": \"Hola\",\n    \"fr\": \"Bonjour\",\n   \
    \ //etc..\n}\n\nfunc greeting(language string) string {\n    greeting, exists\
    \ := greetings[language]\n```\n```"
  merge: -1
  img_proc: true
- pgno: 13
  md: "```\nif exists {\n    return greeting\n}\n\nreturn \"Hello\"\n}\n```\n\nThe\
    \ nature of this refactor isn't actually important, what's important is I haven't\
    \ changed behaviour.\n\nWhen refactoring you can do whatever you like, add interfaces,\
    \ new types, functions, methods etc. The only rule is you don't change behaviour\n\
    \n# When refactoring code you must not be changing behaviour\n\nThis is very important.\
    \ If you are changing behaviour at the same time you are doing two things at once.\
    \ As software engineers we learn to break systems up into different files/packages/functions/etc\
    \ because we know trying to understand a big blob of stuff is hard.\n\nWe don't\
    \ want to have to be thinking about lots of things at once because that's when\
    \ we make mistakes. I've witnessed so many refactoring endeavours fail because\
    \ the developers are biting off more than they can chew.\n\nWhen I was doing factorisations\
    \ in maths classes with pen and paper I would have to manually check that I hadn't\
    \ changed the meaning of the expressions in my head. How do we know we aren't\
    \ changing behaviour when refactoring when working with code, especially on a\
    \ system that is non-trivial?\n\nThose who choose not to write tests will typically\
    \ be reliant on manual testing. For anything other than a small project this will\
    \ be a tremendous time-sink and does not scale in the long run."
