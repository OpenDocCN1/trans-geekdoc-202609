- pgno: 357
  md: 'Package embed provides access to files embedded in the running Go program.


    Go source files that import "embed" can use the //go:embed directive to initialize
    a variable of type string, []byte, or FS with the contents of files read from
    the package directory or subdirectories at compile time.


    Why would we want to use this? Well the alternative is that we can load our templates
    from a "normal" file system. However this means we''d have to make sure that the
    templates are in the correct file path wherever we want to use this software.
    In your job you may have various environments like development, staging and live.
    For this to work, you''d need to make sure your templates are copied to the correct
    place.


    With embed, the files are included in your Go program when you build it. This
    means once you''ve built your program (which you should only do once), the files
    are always available to you.


    What''s handy is you can not only embed individual files, but also file systems;
    and that filesystem implements io/fs which means your code doesn''t need to care
    what kind of file system it is working with.


    If you wish to use different templates depending on configuration though, you
    may wish to stick to loading templates from disk in the more conventional way.


    # Next: Make the template "nice"


    We don''t really want our template to be defined as a one line string. We want
    to be able to space it out to make it easier to read and work with, something
    like this:


    ```

    <h1>{{.Title}}</h1>


    <p>{{.Description}}</p>

    ```'
