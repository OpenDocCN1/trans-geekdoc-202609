  md: "# # Testable code\n\nTestable code is decoupled and single purpose. To me it\
    \ feels like there are two main concerns for this code\n\n+   1. Retrieving the\
    \ raw XML data\n+   2. Decoding the XML data and applying our business logic (in\
    \ this case strings.ToUpper on the <message>)\n\nThe first part is just copying\
    \ the example from the standard lib.\n\nThe second part is where we have our business\
    \ logic and by looking at the code we can see where the \"seam\" in our logic\
    \ starts; it's where we get our io.ReadCloser. We can use this existing abstraction\
    \ to separate concerns and make our code testable.\n\nThe problem with GetData\
    \ is the business logic is coupled with the means of getting the XML. To make\
    \ our design better we need to decouple them\n\nOur TestGetData can act as our\
    \ integration test between our two concerns so we'll keep hold of that to make\
    \ sure it keeps working.\n\nHere is what the newly separated code looks like\n\
    \n```\n```go\ntype Payload struct {\n\tMessage string `xml:\"message\"`\n}\n\n\
    func GetData(data io.Reader) string {\n\tvar payload Payload\n\txml.NewDecoder(data).Decode(&payload)\n\
    \treturn strings.ToUpper(payload.Message)\n}\n\nfunc getXMLFromCommand() io.Reader\
    \ {\n\tcmd := exec.Command(\"cat\", \"msg.xml\")\n\tout, _ := cmd.StdoutPipe()\n\
    \treturn out\n}\n```\n```"
