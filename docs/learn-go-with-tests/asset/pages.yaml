- pgno: 178
  md: 'So `walk(x interface{}, fn func(string))` will accept any value for x.


    # So why not use `interface` for everything and have really flexible functions?


    +   - As a user of a function that takes `interface` you lose type safety. What
    if you meant to pass `Foo.bar` of type `string` into a function but instead did
    `Foo.baz` which is an `int`? The compiler won''t be able to inform you of your
    mistake. You also have no idea what you''re allowed to pass to a function. Knowing
    that a function takes a `UserService` for instance is very useful.

    +   - As a writer of such a function, you have to be able to inspect *anything*
    that has been passed to you and try and figure out what the type is and what you
    can do with it. This is done using *reflection*. This can be quite clumsy and
    difficult to read and is generally less performant (as you have to do checks at
    runtime).


    In short only use reflection if you really need to.


    If you want polymorphic functions, consider if you could design it around an interface
    (not `interface`, confusingly) so that users can use your function with multiple
    types if they implement whatever methods you need for your function to work.


    Our function will need to be able to work with lots of different things. As always
    we''ll take an iterative approach, writing tests for each new thing we want to
    support and refactoring along the way until we''re done.


    # Write the test first


    We''ll want to call our function with a struct that has a string field in it (`x`).
    Then we can spy on the function (`fn`) passed in to see if it is called.'
