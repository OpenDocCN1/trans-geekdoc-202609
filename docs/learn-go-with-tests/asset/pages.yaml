- pgno: 618
  md: '+   - Testing handlers becomes a breeze and is focused a small number of concerns.

    +   - Importantly testing `ImportantBusinessLogic` no longer has to concern itself
    with `HTTP`, you can test the business logic cleanly.

    +   - You can use `ImportantBusinessLogic` in other contexts without having to
    modify it.

    +   - If `ImportantBusinessLogic` changes what it does, so long as the interface
    remains the same you don''t have to change your handlers.


    # Go''s Handlers


    [http.HandlerFunc](http.HandlerFunc)


    The HandlerFunc type is an adapter to allow the use of ordinary functions as HTTP
    handlers.


    ```

    type HandlerFunc func(ResponseWriter, *Request)

    ```


    Reader, take a breath and look at the code above. What do you notice?


    # It is a function that takes some arguments


    There''s no framework magic, no annotations, no magic beans, nothing.


    It''s just a function, *and we know how to test functions.*


    It fits in nicely with the commentary above:


    +   - It takes a [http.Request](http.Request) which is just a bundle of data for
    us to inspect, parse and validate.

    +   - [A http.ResponseWriter interface is used by an HTTP handler to construct
    an HTTP response.](#)'
