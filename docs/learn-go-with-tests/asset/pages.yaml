    in exactly the same way - and I already know what my implementation is going to
    be - I wrote a function for the general case of changing an angle into a point
    in the minute hand iteration.


    I''m not going to plough through TDD ceremony for the sake of it. TDD is a technique
    that helps me understand the code I''m writing - and the code that I''m going
    to write - better. TDD gives me feedback, knowledge and insight. But if I''ve
    already got that knowledge, then I''m not going to plough through the ceremony
    for no reason. Neither tests nor TDD are an end in themselves.


