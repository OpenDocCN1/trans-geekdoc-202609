  md: '# Reflection


    You can find all the code for this chapter here


    From Twitter


    golang challenge: write a function `walk(x interface{}, fn func(string))` which
    takes a struct x and calls fn for all strings fields found inside. difficulty
    level: recursively.


    To do this we will need to use *reflection*.


    Reflection in computing is the ability of a program to examine its own structure,
    particularly through types; it''s a form of metaprogramming. It''s also a great
    source of confusion.


    From The Go Blog: Reflection


    # What is `interface`?


    We have enjoyed the type-safety that Go has offered us in terms of functions that
    work with known types, such as `string`, `int` and our own types like `BankAccount`.


    This means that we get some documentation for free and the compiler will complain
    if you try and pass the wrong type to a function.


    You may come across scenarios though where you want to write a function where
    you don''t know the type at compile time.


    Go lets us get around this with the type `interface{}` which you can think of
    as just any type (in fact, in Go `any` is an alias for `interface{}`).'
  merge: -1
