  md: '# TDD Anti-patterns


    From time to time it''s necessary to review your TDD techniques and remind yourself
    of behaviours to avoid.


    The TDD process is conceptually simple to follow, but as you do it you''ll find
    it challenging your design skills. **Don''t mistake this for TDD being hard, it''s
    design that''s hard!**


    This chapter lists a number of TDD and testing anti-patterns, and how to remedy
    them.


    # Not doing TDD at all


    Of course, it is possible to write great software without TDD but, a lot of problems
    I''ve seen with the design of code and the quality of tests would be very difficult
    to arrive at if a disciplined approach to TDD had been used.


    One of the strengths of TDD is that it gives you a formal process to break down
    problems, understand what you''re trying to achieve (red), get it done (green),
    then have a good think about how to make it right (blue/refactor).


    Without this, the process is often ad-hoc and loose, which *can* make engineering
    more difficult than it *could* be.


    # Misunderstanding the constraints of the refactoring step


    I have been in a number of workshops, mobbing or pairing sessions where someone
    has made a test pass and is in the refactoring'
  merge: -1
  img_proc: true
- pgno: 628
  md: 'stage. After some thought, they think it would be good to abstract away some
    code into a new struct; a budding pedant yells:


    > You''re not allowed to do this! You should write a test for this first, we''re
    doing TDD!


    This seems to be a common misunderstanding. **You can do whatever you like to
    the code when the tests are green**, the only thing you''re not allowed to do
    is **add or change behaviour**.


    The point of these tests are to give you the *freedom to refactor*, find the right
    abstractions and make the code easier to change and understand.


    # Having tests that won''t fail (or, evergreen tests)


    It''s astonishing how often this comes up. You start debugging or changing some
    tests and realise: there are no scenarios where this test can fail. Or at least,
    it won''t fail in the way the test is *supposed* to be protecting against.


    This is *next to impossible* with TDD if you''re following the **first step**,


    +   - Write a test, see it fail


    This is almost always done when developers write tests *after* code is written,
    and/or chasing test coverage rather than creating a useful test suite.


    # Useless assertions


    Ever worked on a system, and you''ve broken a test, then you see this?'
  merge: -1
