- pgno: 560
  md: "```\nfunc (a BlindAlerterFunc) ScheduleAlertAt(duration time.Duration\n   \
    \ a(duration, amount)\n}\n```\n\nBy doing this, people using your library can\
    \ implement your interface with just a function. They can use Type Conversion\
    \ to convert their function into a BlindAlerterFunc and then use it as a BlindAlerter\
    \ (as BlindAlerterFunc implements BlindAlerter).\n\n```\ngame := poker.NewTexasHoldem(poker.BlindAlerterFunc(poker.StdOut\n\
    ```\n\nThe broader point here is, in Go you can add methods to types, not just\
    \ structs. This is a very powerful feature, and you can use it to implement interfaces\
    \ in more convenient ways.\n\nConsider that you can not only define types of functions,\
    \ but also define types around other types, so that you can add methods to them.\n\
    \n```\ntype Blog map[string]string\n```\n\n```\nfunc (b Blog) ServeHTTP(w http.ResponseWriter,\
    \ r *http.Request)\n    fmt.Fprintln(w, b[r.URL.Path])\n}\n```\n\nHere we've created\
    \ an HTTP handler that implements a very simple \"blog\" where it will use URL\
    \ paths as keys to posts stored in a map."
