    # What we''ve learned


    +   - How to create and render HTML templates.

    +   - How to compose templates together and DRY up related markup and help us
    keep a consistent look and feel.

    +   - How to pass functions into templates, and why you should think twice about
    it.

    +   - How to write "Approval Tests", which help us test the big ugly output of
    things like template renderers.


    # On logic-less templates


    As always, this is all about **separation of concerns**. It''s important we consider
    what the responsibilities are of the various parts of our system. Too often people
    leak important business logic into templates, mixing up concerns and making systems
    difficult to understand, maintain and test.


    # Not just for HTML


    Remember that go has `text/template` to generate other kinds of data from a template.
    If you find yourself needing to transform data into some kind of structured output,
    the techniques laid out in this chapter can be useful.


