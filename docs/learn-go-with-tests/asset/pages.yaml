  md: "false was not equal to true\n\nI know that false is not equal to true. This\
    \ is not a helpful message; it doesn't tell me what I've broken. This is a symptom\
    \ of not following the TDD process and not reading the failure error message.\n\
    \nGoing back to the drawing board,\n\nWrite a test, see it fail (and don't be\
    \ ashamed of the error message)\n\n# Asserting on irrelevant detail\n\nAn example\
    \ of this is making an assertion on a complex object, when in practice all you\
    \ care about in the test is the value of one of the fields.\n\n```\n// not this,\
    \ now your test is tightly coupled to the whole objec\nif !cmp.Equal(complexObject,\
    \ want) {\n    t.Error(\"got %v, want %v\", complexObject, want)\n}\n```\n\n```\n\
    // be specific, and loosen the coupling\ngot := complexObject.fieldYouCareAboutForThisTest\n\
    if got != want {\n    t.Error(\"got %q, want %q\", got, want)\n}\n```\n\nAdditional\
    \ assertions not only make your test more difficult to read by creating 'noise'\
    \ in your documentation, but also needlessly couples the test with data it doesn't\
    \ care about. This means if you happen to change the fields for your object, or\
    \ the way they behave you may get unexpected compilation problems or failures\
    \ with your tests.\n\nThis is an example of not following the red stage strictly\
    \ enough."
