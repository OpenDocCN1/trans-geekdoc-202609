- pgno: 123
  md: "If we do that, we can then change the implementation to print to something\
    \ we control so that we can test it. In \"real life\" you would inject in something\
    \ that writes to stdout.\n\nIf you look at the source code of `fmt.Printf` you\
    \ can see a way for us to hook in\n\n```\n// It returns the number of bytes written\
    \ and any write error er\nfunc Printf(format string, a ...interface{}) (n int,\
    \ err error)\n    return Fprintf(os.Stdout, format, a...)\n}\n```\n\nInteresting!\
    \ Under the hood `Printf` just calls `Fprintf` passing in `os.Stdout`.\n\nWhat\
    \ exactly *is* an `os.Stdout`? What does `Fprintf` expect to get passed to it\
    \ for the 1st argument?\n\n```\nfunc Fprintf(w io.Writer, format string, a ...interface{})\
    \ (n ir\n    p := newPrinter()\n    p.doPrintf(format, a)\n    n, err = w.Write(p.buf)\n\
    \    p.free()\n    return\n}\n```\n\nAn `io.Writer`\n\n```\ntype Writer interface\
    \ {\n    Write(p []byte) (n int, err error)\n}\n```\n\nFrom this we can infer\
    \ that `os.Stdout` implements `io.Writer`; `Printf` passes `os.Stdout` to `Fprintf`\
    \ which expects an `io.Writer`.\n\nAs you write more Go code you will find this\
    \ interface popping up a lot because it's a great general purpose interface for\
    \ \"put this data somewhere\"."
