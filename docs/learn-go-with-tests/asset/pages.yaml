  md: 'because each digit has a different value based upon its position in the numeral.
    So


    ```

    1337

    ```


    The 1 has a value of one thousand because its the first digit in a four digit
    numeral.


    Roman are built using a reduced number of digits (I, V etc...) mainly as values
    to produce the numeral. There''s a bit of positional stuff but it''s mostly I
    always representing ''one''.


    So, given this, is int an ''Arabic number''? The idea of a number is not at all
    tied to its representation - we can see this if we ask ourselves what the correct
    representation of this number is:


    ```

    255

    11111111

    two-hundred and fifty-five

    FF

    377

    ```


    Yes, this is a trick question. They''re all correct. They''re the representation
    of the same number in the decimal, binary, English, hexadecimal and octal number
    systems respectively.


    The representation of a number as a numeral is independent of its properties as
    a number - and we can see this when we look at integer literals in Go:


    ```

    0xFF == 255 // true

    ```


    And how we can print integers in a format string:


    ```

    n := 255

    fmt.Printf("%b %c %d %o %q %x %X %U", n, n, n, n, n, n, n, r

    // 11111111 ÿ 255 377 ''ÿ'' ff FF U+00FF

    ```


    We can write the same integer both as a hexadecimal and an Arabic (decimal) numeral.'
