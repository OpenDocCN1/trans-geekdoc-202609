  md: "When your method is called on a variable of that type, you get your reference\
    \ to its data via the `receiverName` variable. In many other programming languages\
    \ this is done implicitly and you access the receiver via `this`.\n\nIt is a convention\
    \ in Go to have the receiver variable be the first letter of the type.\n\n```\n\
    r Rectangle\n```\n\nIf you try to re-run the tests they should now compile and\
    \ give you some failing output.\n\n# Write enough code to make it pass\n\nNow\
    \ let's make our rectangle tests pass by fixing our new method\n\n```\n```go\n\
    func (r Rectangle) Area() float64 {\n    return r.Width * r.Height\n}\n```\n```\n\
    \nIf you re-run the tests the rectangle tests should be passing but circle should\
    \ still be failing.\n\nTo make circle's `Area` function pass we will borrow the\
    \ `Pi` constant from the `math` package (remember to import it).\n\n```\n```go\n\
    func (c Circle) Area() float64 {\n    return math.Pi * c.Radius * c.Radius\n}\n\
    ```\n```\n\n# Refactor\n\nThere is some duplication in our tests.\n\nAll we want\
    \ to do is take a collection of *shapes*, call the `Area()` method on them and\
    \ then check the result."
