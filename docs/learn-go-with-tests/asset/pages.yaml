    Now that we have done this refactoring, we can safely remove the string stack
    test because we don''t need to prove the same logic over and over.


    Using a generic data type we have:


    +   - Reduced duplication of important logic.

    +   - Made `Pop` return `T` so that if we create a `Stack[int]` we in practice
