  md: 'To circumvent this, in the type you send to the render, you''ll need to wrap
    your trusted HTML in [template.HTML](template.HTML)


    HTML encapsulates a known safe HTML document fragment. It should not be used for
    HTML from a third-party, or HTML with unclosed tags or comments. The outputs of
    a sound HTML sanitiser and a template escaped by this package are fine for use
    with HTML.


    Use of this type presents a security risk: the encapsulated content should come
    from a trusted source, as it will be included verbatim in the template output.


    So I created an **unexported** view model (`postViewModel`), because I still viewed
    this as internal implementation detail to rendering. I have no need to test this
    separately and I don''t want it polluting my API.


    I construct one when rendering so I can parse the `Body` into `HTMLBody` and then
    I use that field in the template to render the HTML.


    # Wrapping up


    If you combine your learnings of the [reading_files](reading_files) chapter and
    this one, you can comfortably make a well-tested, simple, static site generator
    and spin up a blog of your own. Find some CSS tutorials and you can make it look
    nice too.


    This approach extends beyond blogs. Taking data from any source, be it a database,
    an API or a file-system and converting it into HTML and returning it from a server
    is a simple technique spanning many decades. People like to bemoan the complexity
    of modern web development but are you sure you''re not just inflicting the complexity
    on yourself?


    Go is wonderful for web development, especially when you think clearly about what
    your real requirements are for the website you''re making. Generating HTML on
    the server is often a better, simpler and'
