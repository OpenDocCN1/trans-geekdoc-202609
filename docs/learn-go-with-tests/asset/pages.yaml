    \ d time.Duration, assert func() ) {\n    t.Helper()\n\n    done := make(chan\
    \ struct{}, 1)\n\n    go func() {\n        assert()\n        done <- struct{}{}\n\
    \    }()\n\n    select {\n    case <-time.After(d):\n        t.Error(\"timed out\"\
    )\n    case <-done:\n    }\n}\n```\n```\n\nWhat within does is take a function\
    \ assert as an argument and then runs it in a go routine. If/When the function\
    \ finishes it will signal it is done via the done channel.\n\nWhile that happens\
    \ we use a select statement which lets us wait for a channel to send a message.\
    \ From here it is a race between the assert function and time.After which will\
    \ send a signal when the duration has occurred.\n\nFinally, I made a helper function\
    \ for our assertion just to make things a bit neater"
