- pgno: 603
  md: "```\nif res.StatusCode != http.StatusOK {\n    return \"\", BadStatusError{URL:\
    \ url, Status: res.StatusCode}\n}\n```\n\nThis change has had some *real positive\
    \ effects*\n\n+   - Our `DumbGetter` function has become simpler, it's no longer\
    \ concerned with the intricacies of an error string, it just creates a `BadStatusError`.\n\
    +   - Our tests now reflect (and document) what a user of our code *could* do\
    \ if they decided they wanted to do some more sophisticated error handling than\
    \ just logging. Just do a type assertion and then you get easy access to the properties\
    \ of the error.\n+   - It is still \"just\" an `error`, so if they choose to they\
    \ can pass it up the call stack or log it like any other `error`.\n\n# Wrapping\
    \ up\n\nIf you find yourself testing for multiple error conditions don't fall\
    \ in to the trap of comparing the error messages.\n\nThis leads to flaky and difficult\
    \ to read/write tests and it reflects the difficulties the users of your code\
    \ will have if they also need to start doing things differently depending on the\
    \ kind of errors that have occurred.\n\nAlways make sure your tests reflect how\
    \ *you'd* like to use your code, so in this respect consider creating error types\
    \ to encapsulate your kinds of errors. This makes handling different kinds of\
    \ errors easier for users of your code and also makes writing your error handling\
    \ code simpler and easier to read.\n\n# ## Addendum\n\nAs of Go 1.13 there are\
    \ new ways to work with errors in the standard library which is covered in the\
    \ Go Blog"
