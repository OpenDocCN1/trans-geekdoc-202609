    \ are ways of grouping up related Go code together.\n\nThe `func` keyword is how\
    \ you define a function with a name and a body.\n\nWith `import \"fmt\"` we are\
    \ importing a package which contains the `Println` function that we use to print.\n\
    \n# How to test"
