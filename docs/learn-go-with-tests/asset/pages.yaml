    \ Seeking problems\n\nThere is a flaw in our implementation. First of all, let's\
    \ remind ourselves how io.Reader is defined.\n\n```\ntype Reader interface {\n\
    \    Read(p []byte) (n int, err error)\n}\n```\n\nWith our file, you can imagine\
    \ it reading through byte by byte until the end. What happens if you try to Read\
    \ a second time?\n\nAdd the following to the end of our current test.\n\n```\n\
    //file_system_store_test.go\n\n// read again\ngot = store.GetLeague()\nassertLeague(t,\
    \ got, want)\n```\n\nWe want this to pass, but if you run the test it doesn't.\n\
    \nThe problem is our Reader has reached the end so there is nothing more to read.\
    \ We need a way to tell it to go back to the start.\n\nReadSeeker is another interface\
    \ in the standard library that can help.\n\n```\ntype ReadSeeker interface {\n\
    \    Reader\n    Seeker\n}\n```"
