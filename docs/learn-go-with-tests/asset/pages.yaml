- pgno: 371
  md: 'As we''ve shown, in order to test our templates, we''ve had to *introduce a
    whole different kind of testing.*


    Imagine you introduce a function into a template which has a few different permutations
    of behaviour and edge cases, **how will you test it?** With this current design,
    your only means of testing this logic is by *rendering HTML and comparing strings*.
    This is not an easy or sane way of testing logic, and definitely not what you''d
    want for *important* business logic.


    Even though the approval tests technique has reduced the cost of maintaining these
    tests, they''re still more expensive to maintain than most unit tests you''ll
    write. They''re still sensitive to any minor markup changes you might make, it''s
    just we''ve made it easier to manage. We should still strive to architect our
    code so we don''t have to write many tests around our templates, and try and separate
    concerns so any logic that doesn''t need to live inside our rendering code is
    properly separated.


    What Mustache-influenced templating engines give you is a useful constraint, don''t
    try to circumvent it too often; **don''t go against the grain**. Instead, embrace
    the idea of [view models](view models), where you construct specific types that
    contain the data you need to render, in a way that''s convenient for the templating
    language.


    This way, whatever important business logic you use to generate that bag of data
    can be unit tested separately, away from the messy world of HTML and templating.


    # Separating concerns


    So what could we do instead?


    # Add a method to `Post` and then call that in the template


    We can call methods in our templating code on the types we send, so we could add
    a `SanitisedTitle` method to `Post`. This would simplify'
  merge: -1
  img_proc: true
