- pgno: 29
  md: "Here we are introducing another tool in our testing arsenal, subtests. Sometimes\
    \ it is useful to group tests around a \"thing\" and then have subtests describing\
    \ different scenarios.\n\nA benefit of this approach is you can set up shared\
    \ code that can be used in the other tests.\n\nThere is repeated code when we\
    \ check if the message is what we expect.\n\nRefactoring is not *just* for the\
    \ production code!\n\nIt is important that your tests *are clear specifications*\
    \ of what the code needs to do.\n\nWe can and should refactor our tests.\n\n```\n\
    ```go\nfunc TestHello(t *testing.T) {\n    assertCorrectMessage := func(t testing.TB,\
    \ got, want string)\n        t.Helper()\n        if got != want {\n          \
    \  t.Errorf(\"got %q want %q\", got, want)\n        }\n    }\n\n    t.Run(\"saying\
    \ hello to people\", func(t *testing.T) {\n        got := Hello(\"Chris\")\n \
    \       want := \"Hello, Chris\"\n        assertCorrectMessage(t, got, want)\n\
    \    })\n    t.Run(\"empty string defaults to 'World'\", func(t *testing.T)\n\
    \        got := Hello(\"\")\n        want := \"Hello, World\"\n\n        assertCorrectMessage(t,\
    \ got, want)\n    })\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 30
  md: "# What have we done here?\n\nWe've refactored our assertion into a function.\
    \ This reduces duplication and improves readability of our tests. In Go you can\
    \ declare functions inside other functions and assign them to variables. You can\
    \ then call them, just like normal functions. We need to pass in `t *testing.T`\
    \ so that we can tell the test code to fail when we need to.\n\nFor helper functions,\
    \ it's a good idea to accept a `testing.TB` which is an interface that `*testing.T`\
    \ and `*testing.B` both satisfy, so you can call helper functions from a test,\
    \ or a benchmark.\n\n`t.Helper()` is needed to tell the test suite that this method\
    \ is a helper. By doing this when it fails the line number reported will be in\
    \ our *function call* rather than inside our test helper. This will help other\
    \ developers track down problems easier. If you still don't understand, comment\
    \ it out, make a test fail and observe the test output. Comments in Go are a great\
    \ way to add additional information to your code, or in this case, a quick way\
    \ to tell the compiler to ignore a line. You can comment out the `t.Helper()`\
    \ code by adding two forward slashes `//` at the beginning of the line. You should\
    \ see that line turn grey or change to another color than the rest of your code\
    \ to indicate it's now commented out.\n\nNow that we have a well-written failing\
    \ test, let's fix the code, using an `if`.\n\n```\n```go\nconst englishHelloPrefix\
    \ = \"Hello, \"\n\nfunc Hello(name string) string {\n    if name == \"\" {\n \
    \       name = \"World\"\n    }\n    return englishHelloPrefix + name\n}\n```\n\
    ```\n\nIf we run our tests we should see it satisfies the new requirement and\
    \ we haven't accidentally broken the other functionality."
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Back to source control


    Now we are happy with the code I would amend the previous commit so we only check
    in the lovely version of our code with its test.


    # Discipline


    Let''s go over the cycle again


    +   - Write a test

    +   - Make the compiler pass

    +   - Run the test, see that it fails and check the error message is meaningful

    +   - Write enough code to make the test pass

    +   - Refactor


    On the face of it this may seem tedious but sticking to the feedback loop is important.


    Not only does it ensure that you have *relevant tests*, it helps ensure *you design
    good software* by refactoring with the safety of tests.


    Seeing the test fail is an important check because it also lets you see what the
    error message looks like. As a developer it can be very hard to work with a codebase
    when failing tests do not give a clear idea as to what the problem is.


    By ensuring your tests are *fast* and setting up your tools so that running tests
    is simple you can get in to a state of flow when writing your code.


    By not writing tests you are committing to manually checking your code by running
    your software which breaks your state of flow and you won''t be saving yourself
    any time, especially in the long run.


    # Keep going! More requirements'
