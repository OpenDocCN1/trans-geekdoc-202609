- pgno: 225
  md: 'containing your value. You have to create a coupling of map keys from one module
    to another and if someone changes something things start breaking.


    In short, **if a function needs some values, put them as typed parameters rather
    than trying to fetch them from `context.Value`**. This makes it statically checked
    and documented for everyone to see.


    # But...


    On other hand, it can be helpful to include information that is orthogonal to
    a request in a context, such as a trace id. Potentially this information would
    not be needed by every function in your call-stack and would make your functional
    signatures very messy.


    Jack Lindamood says Context.Value should inform, not control


    The content of context.Value is for maintainers not users. It should never be
    required input for documented or expected results.


    # Additional material


    +   - I really enjoyed reading Context should go away for Go 2 by Michal Štrba.
    His argument is that having to pass `context` everywhere is a smell, that it''s
    pointing to a deficiency in the language in respect to cancellation. He says it
    would better if this was somehow solved at the language level, rather than at
    a library level. Until that happens, you will need `context` if you want to manage
    long running processes.

    +   - The Go blog further describes the motivation for working with `context`
    and has some examples'
