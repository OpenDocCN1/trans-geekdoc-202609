  md: "# Then add our new webSocket handler\n\n```\nfunc (p *PlayerServer) webSocket(w\
    \ http.ResponseWriter, r *http.\n    upgrader := websocket.Upgrader{\n       \
    \ ReadBufferSize: 1024,\n        WriteBufferSize: 1024,\n    }\n    upgrader.Upgrade(w,\
