    # Wrapping up


    This exercise has been a little lighter on the TDD than usual. In a way we''ve
    been taking part in one long refactoring of the CheckWebsites function; the inputs
    and outputs never changed, it just got faster. But the tests we had in place,
    as well as the benchmark we wrote, allowed us to refactor CheckWebsites in a way
    that maintained confidence that the software was still working, while demonstrating
    that it had actually become faster.


    In making it faster we learned about


    +   - *goroutines*, the basic unit of concurrency in Go, which let us check more
    than one website at the same time.

    +   - *anonymous functions*, which we used to start each of the concurrent processes
    that check websites.

    +   - *channels*, to help organize and control the communication between the different
    processes, allowing us to avoid a *race condition* bug.

    +   - *the race detector* which helped us debug problems with concurrent code


    # Make it fast


    One formulation of an agile way of building software, often misattributed to Kent
    Beck, is:


    [Make it work, make it right, make it fast]()'
