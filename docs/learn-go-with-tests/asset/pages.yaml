- pgno: 322
  md: 'function provides an implementation of fs.FS backed by a tree of operating
    system files.


    If we use this interface, users of our package have a number of options baked-in
    to the standard library to use. Learning to leverage interfaces defined in Go''s
    standard library (e.g. io.fs, io.Reader, io.Writer), is vital to writing loosely
    coupled packages. These packages can then be re-used in contexts different to
    those you imagined, with minimal fuss from your consumers.


    In our case, maybe our consumer wants the posts to be embedded into the Go binary
    rather than files in a "real" filesystem? Either way, *our code doesn''t need
    to care.*


    For our tests, the package testing/fstest offers us an implementation of io/FS
    to use, similar to the tools we''re familiar with in net/http/httptest.


    Given this information, the following feels like a better approach,


    ```

    var posts []blogposts.Post

    posts = blogposts.NewPostsFromFS(someFS)

    ```


    # Write the test first


    We should keep scope as small and useful as possible. If we prove that we can
    read all the files in a directory, that will be a good start. This will give us
    confidence in the software we''re writing. We can check that the count of []Post
    returned is the same as the number of files in our fake file system.


    Create a new project to work through this chapter.


    +   - mkdir blogposts

    +   - cd blogposts

    +   - go mod init github.com/{your-name}/blogposts

    +   - touch blogposts_test.go'
