    \ If you now re-run the test you should move on to the next error.\n\n```\n===\n\
    RUN\nTestGame/when_we_get_a_message_over_a_websocket_it_is_a_winner_of_a_game\n\
    ---\nFAIL:\nTestGame/when_we_get_a_message_over_a_websocket_it_is_a_winner_of_a_game\
    \ (0.00s)\n    server_test.go:132: got 0 calls to RecordWin want 1\n```\n\nNow\
    \ that we have a connection opened, we'll want to listen for a message and then\
    \ record it as the winner.\n\n```\nfunc (p *PlayerServer) webSocket(w http.ResponseWriter,\
    \ r *http.\n    upgrader := websocket.Upgrader{\n        ReadBufferSize: 1024,\n\
    \        WriteBufferSize: 1024,\n    }\n    conn, _ := upgrader.Upgrade(w, r,\
    \ nil)\n    _, winnerMsg, _ := conn.ReadMessage()\n    p.store.RecordWin(string(winnerMsg))\n\
    }\n```\n\n(Yes, we're ignoring a lot of errors right now!)\n\nconn.ReadMessage()\
    \ blocks on waiting for a message on the connection. Once we get one we use it\
