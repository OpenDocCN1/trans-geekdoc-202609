    type PlayerServer struct {\n    store PlayerStore\n    http.Handler\n}\n\nconst\
    \ jsonContentType = \"application/json\"\n\n// NewPlayerServer creates a PlayerServer\
    \ with routing configured\nfunc NewPlayerServer(store PlayerStore) *PlayerServer\
    \ {\n    p := new(PlayerServer)\n\n    p.store = store\n\n    router := http.NewServeMux()\n\
