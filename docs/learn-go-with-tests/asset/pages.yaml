    # Always `make` channels


    Notice how we have to use `make` when creating a channel; rather than say `var
    ch chan struct{}`. When you use `var` the variable will be initialised with the
    "zero" value of the type. So for `string` it is "", `int` it is 0, etc.


    For channels the zero value is `nil` and if you try and send to it with `<-` it
    will block forever because you cannot send to `nil` channels


    You can see this in action in The Go Playground


    # select


    If you recall from the concurrency chapter, you can wait for values to be sent
    to a channel with `myVar := <-ch`. This is a *blocking* call, as you''re waiting
    for a value.


    What `select` lets you do is wait on *multiple* channels. The first one to send
    a value "wins" and the code underneath the `case` is executed.


    We use `ping` in our `select` to set up two channels, one for each of our `URL`s.
    Whichever one writes to its channel first will have its code executed in the `select`,
    which results in its `URL` being returned (and being the winner).


    After these changes, the intent behind our code is very clear and the implementation
    is actually simpler.


