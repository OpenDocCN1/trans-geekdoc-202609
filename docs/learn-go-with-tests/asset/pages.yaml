  md: "This should be trivial for Go experts like us. We need to keep some state for\
    \ the counter in our datatype and then increment it on every Inc call\n\n```\n\
    type Counter struct {\n    value int\n}\n```\n\n```\nfunc (c *Counter) Inc() {\n\
    \    c.value++\n}\n```\n\n```\nfunc (c *Counter) Value() int {\n    return c.value\n\
