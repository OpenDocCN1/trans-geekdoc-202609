- pgno: 262
  md: 'These tests are sometimes called ''acceptance tests'', sometimes called ''feature
    test''. The idea is that you write a really high level test to describe what you''re
    trying to achieve - a user clicks a button on a website, and they see a complete
    list of the Pokémon they''ve caught, for instance. When we''ve written that test,
    we can then write test more tests - unit tests - that build towards a working
    system that will pass the acceptance test. So for our example these tests might
    be about rendering a webpage with a button, testing route handlers on a web server,
    performing database look ups, etc. All of these things will be TDD''d, and all
    of them will go towards making the original acceptance test pass.


    Something like this *classic* picture by Nat Pryce and Steve Freeman


    ![](img/570fb0b5bd524332c8e0fb9e37d716fb_262_0.png)


    Anyway, let''s try and write that acceptance test - the one that will let us know
    when we''re done.'
