- pgno: 146
  md: '+   - Favour testing expected behaviour rather than the implementation


    Normally a lot of mocking points to *bad abstraction* in your code.


    **What people see here is a weakness in TDD but it is actually a strength**, more
    often than not poor test code is a result of bad design or put more nicely, well-designed
    code is easy to test.


    # But mocks and tests are still making my life hard!


    Ever run into this situation?


    +   - You want to do some refactoring

    +   - To do this you end up changing lots of tests

    +   - You question TDD and make a post on Medium titled "Mocking considered harmful"


    This is usually a sign of you testing too much *implementation detail*. Try to
    make it so your tests are testing *useful behaviour* unless the implementation
    is really important to how the system runs.


    It is sometimes hard to know *what level* to test exactly but here are some thought
    processes and rules I try to follow:


    +   - **The definition of refactoring is that the code changes but the behaviour
    stays the same.** If you have decided to do some refactoring in theory you should
    be able to make the commit without any test changes. So when writing a test ask
    yourself

    +     - Am I testing the behaviour I want, or the implementation details?

    +     - If I were to refactor this code, would I have to make lots of changes
    to the tests?

    +   - Although Go lets you test private functions, I would avoid it as private
    functions are implementation detail to support public behaviour. Test the public
    behaviour. Sandi Metz describes'
  merge: -1
  img_proc: true
