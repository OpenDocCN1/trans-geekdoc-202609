  md: "```\nimport \"io\"\n\ntype tape struct {\n    file io.ReadWriteSeeker\n}\n\n\
    func (t *tape) Write(p []byte) (n int, err error) {\n    t.file.Seek(0, 0)\n \
    \   return t.file.Write(p)\n}\n```\n\nNotice that we're only implementing `Write`\
    \ now, as it encapsulates the `Seek` part. This means our `FileSystemStore` can\
    \ just have a reference to a `Writer` instead.\n\n```\n//file_system_store.go\n\
    type FileSystemPlayerStore struct {\n    database io.Writer\n    league   League\n\
    }\n```\n\n# Update the constructor to use Tape\n\n```\n//file_system_store.go\n\
    func NewFileSystemPlayerStore(database io.ReadWriteSeeker) *File\n    database.Seek(0,\
    \ 0)\n    league, _ := NewLeague(database)\n\n    return &FileSystemPlayerStore{\n\
    \        database: &tape{database},\n        league:   league,\n    }\n}\n```\n\
    \nFinally, we can get the amazing payoff we wanted by removing the `Seek` call\
    \ from `RecordWin`. Yes, it doesn't feel much, but at least it means if we do\
