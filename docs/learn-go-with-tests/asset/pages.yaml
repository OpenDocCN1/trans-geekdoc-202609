  md: "If you try and run the test, it's still failing.\n\nThe issue is timing. There\
    \ is a delay between our WebSocket connection reading the message and recording\
    \ the win and our test finishes before it happens. You can test this by putting\
    \ a short `time.Sleep` before the final assertion.\n\nLet's go with that for now\
    \ but acknowledge that putting in arbitrary sleeps into tests **is very bad practice**.\n\
    \n```\ntime.Sleep(10 * time.Millisecond)\nAssertPlayerWin(t, store, winner)\n\
    ```\n\n# Refactor\n\nWe committed many sins to make this test work both in the\
    \ server code and the test code but remember this is the easiest way for us to\
    \ work.\n\nWe have nasty, horrible, *working* software backed by a test, so now\
    \ we are free to make it nice and know we won't break anything accidentally.\n\
    \nLet's start with the server code.\n\nWe can move the `upgrader` to a private\
    \ value inside our package because we don't need to redeclare it on every WebSocket\
    \ connection request\n\n```\nvar wsUpgrader = websocket.Upgrader{\n    ReadBufferSize:\
