- pgno: 205
  md: "# Next steps\n\nThat was easy enough but now we have a requirement that it\
    \ must be safe to use in a concurrent environment. We will need to write a failing\
    \ test to exercise this.\n\n# Write the test first\n\n```\n```go\nt.Run(\"it runs\
    \ safely concurrently\", func(t *testing.T) {\n    wantedCount := 1000\n    counter\
    \ := Counter{}\n\n    var wg sync.WaitGroup\n    wg.Add(wantedCount)\n\n    for\
    \ i := 0; i < wantedCount; i++ {\n        go func() {\n            counter.Inc()\n\
    \            wg.Done()\n        }()\n    }\n    wg.Wait()\n\n    assertCounter(t,\
    \ counter, wantedCount)\n})\n```\n```\n\nThis will loop through our `wantedCount`\
    \ and fire a goroutine to call `counter.Inc()`.\n\nWe are using `sync.WaitGroup`\
    \ which is a convenient way of synchronising concurrent processes.\n\nA WaitGroup\
    \ waits for a collection of goroutines to finish. The main goroutine calls Add\
    \ to set the number of goroutines to wait for. Then each of the goroutines runs\
    \ and calls Done when finished. At the same time, Wait can be used to block until\
    \ all goroutines have finished."
  merge: -1
  img_proc: true
- pgno: 206
  md: "By waiting for `wg.Wait()` to finish before making our assertions we can be\
    \ sure all of our goroutines have attempted to `Inc` the `Counter`.\n\n# Try to\
    \ run the test\n\n```\n=== RUN   TestCounter/it_runs_safely_in_a_concurrent_envionment\n\
    --- FAIL: TestCounter (0.00s)\n               ---               FAIL:\nTestCounter/it_runs_safely_in_a_concurrent_envionment\
    \ (0.00s)\n    sync_test.go:26: got 939, want 1000\nFAIL\n```\n\nThe test will\
    \ *probably* fail with a different number, but nonetheless it demonstrates it\
    \ does not work when multiple goroutines are trying to mutate the value of the\
    \ counter at the same time.\n\n# Write enough code to make it pass\n\nA simple\
    \ solution is to add a lock to our `Counter`, a Mutex\n\nA Mutex is a mutual exclusion\
    \ lock. The zero value for a Mutex is an unlocked mutex.\n\n```\ntype Counter\
    \ struct {\n    mu      sync.Mutex\n    value int\n}\n```\n\n```\nfunc (c *Counter)\
    \ Inc() {\n    c.mu.Lock()\n    defer c.mu.Unlock()\n    c.value++\n}\n```\n\n\
    What this means is any goroutine calling `Inc` will acquire the lock on `Counter`\
    \ if they are first. All the other goroutines will have to wait for it to be `Unlock`ed\
    \ before getting access."
  merge: -1
  img_proc: true
- pgno: 207
  md: "If you now re-run the test it should now pass because each goroutine has to\
    \ wait its turn before making a change.\n\n# I've seen other examples where the\
    \ `sync.Mutex` is embeddedded into the struct.\n\nYou may see examples like this\n\
    \n```\n```go\ntype Counter struct {\n    sync.Mutex\n    value int\n}\n```\n```\n\
    \nIt can be argued that it can make the code a bit more elegant.\n\n```\n```go\n\
    func (c *Counter) Inc() {\n    c.Lock()\n    defer c.Unlock()\n    c.value++\n\
    }\n```\n```\n\nThis *looks* nice but while programming is a hugely subjective\
    \ discipline, this is **bad and wrong**.\n\nSometimes people forget that embedding\
    \ types means the methods of that type becomes *part of the public interface*;\
    \ and you often will not want that. Remember that we should be very careful with\
    \ our public APIs, the moment we make something public is the moment other code\
    \ can couple themselves to it. We always want to avoid unnecessary coupling.\n\
    \nExposing `Lock` and `Unlock` is at best confusing but at worst potentially very\
    \ harmful to your software if callers of your type start calling these methods."
