- pgno: 50
  md: 'Arrays have a *fixed capacity* which you define when you declare the variable.
    We can initialize an array in two ways:


    +   - `[N]type{value1, value2, ..., valueN}` e.g. `numbers := [5]int{1, 2, 3,
    4, 5}`

    +   - `[...]type{value1, value2, ..., valueN}` e.g. `numbers := [...]int{1, 2,
    3, 4, 5}`


    It is sometimes useful to also print the inputs to the function in the error message.
    Here, we are using the `%v` placeholder to print the "default" format, which works
    well for arrays.


    [Read more about the format strings](Read more about the format strings)


