  md: 'This highlights the importance of *integrating your work*. We rightfully made
    the dependencies of our `CLI` private (because we don''t want them exposed to
    users of `CLIs`) but haven''t made a way for users to construct it.


    Is there a way to have caught this problem earlier?


    # package mypackage_test


    In all other examples so far, when we make a test file we declare it as being
    in the same package that we are testing.


    This is fine and it means on the odd occasion where we want to test something
    internal to the package we have access to the unexported types.


    But given we have advocated for *not* testing internal things *generally*, can
    Go help enforce that? What if we could test our code where we only have access
    to the exported types (like our `main` does)?


    When you''re writing a project with multiple packages I would strongly recommend
    that your test package name has `_test` at the end. When you do this you will
    only be able to have access to the public types in your package. This would help
    with this specific case but also helps enforce the discipline of only testing
    public APIs. If you still wish to test internals you can make a separate test
    with the package you want to test.


    An adage with TDD is that if you cannot test your code then it is probably hard
    for users of your code to integrate with it. Using `package foo_test` will help
    with this by forcing you to test your code as if you are importing it like users
    of your package will.


    Before fixing `main` let''s change the package of our test inside `CLI_test.go`
    to `poker_test`.'
