    \ are good and are easily composed\n+   - When you're trying to augment one thing\
    \ (e.g io.Reader) with another you usually want to reach for the delegation pattern\n\
    \nIn software engineering, the delegation pattern is an object-oriented design\
    \ pattern that allows object composition to achieve the same code reuse as inheritance.\n\
    \n+   - An easy way to start this kind of work is to wrap your delegate and write\
