    \ `(*w)` is absolutely valid. However, the makers of Go deemed this notation cumbersome,\
    \ so the language permits us to write `w.balance`, without an explicit dereference.\
    \ These pointers to structs even have their own name: *struct pointers* and they\
    \ are automatically dereferenced.\n\nTechnically you do not need to change `Balance`\
    \ to use a pointer receiver as taking a copy of the balance is fine. However,\
    \ by convention you should keep your method receiver types the same for consistency.\n\
    \n# Refactor\n\nWe said we were making a Bitcoin wallet but we have not mentioned\
    \ them so far. We've been using `int` because they're a good type for counting\
    \ things!\n\nIt seems a bit overkill to create a `struct` for this. `int` is fine\
    \ in terms of the way it works but it's not descriptive.\n\nGo lets you create\
    \ new types from existing ones.\n\nThe syntax is `type MyName OriginalType`\n\n\
    ```\n```go\ntype Bitcoin int\n\ntype Wallet struct {\n    balance Bitcoin\n}\n\
    \nfunc (w *Wallet) Deposit(amount Bitcoin) {\n    w.balance += amount\n}\n\nfunc\
    \ (w *Wallet) Balance() Bitcoin {\n    return w.balance\n}\n```\n```"
