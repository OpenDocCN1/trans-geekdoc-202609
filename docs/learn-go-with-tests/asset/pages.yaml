  md: "# Arrays and slices\n\nYou can find all the code for this chapter here\n\n\
    Arrays allow you to store multiple elements of the same type in a variable in\
    \ a particular order.\n\nWhen you have an array, it is very common to have to\
    \ iterate over them. So let's use our new-found knowledge of for to make a Sum\
    \ function. Sum will take an array of numbers and return the total.\n\nLet's use\
    \ our TDD skills\n\n# Write the test first\n\nCreate a new folder to work in.\
    \ Create a new file called sum_test.go and insert the following:\n\n```\n```go\n\
    package main\n\nimport \"testing\"\n\nfunc TestSum(t *testing.T) {\n    numbers\
    \ := [5]int{1, 2, 3, 4, 5}\n\n    got := Sum(numbers)\n    want := 15\n\n    if\
    \ got != want {\n        t.Errorf(\"got %d want %d given, %v\", got, want, numbers)\n\
    \    }\n}\n```\n```"
