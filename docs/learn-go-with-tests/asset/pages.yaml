  md: "```\n```go\ntype Animal interface {\n    Eater\n    Sleeper\n}\n```\n```\n\n\
    And you can use it with concrete types too, not just interfaces. As you'd expect\
    \ if you embed a concrete type you'll have access to all its public methods and\
    \ fields.\n\n# Any downsides?\n\nYou must be careful with embedding types because\
    \ you will expose all public methods and fields of the type you embed. In our\
    \ case, it is ok because we embedded just the *interface* that we wanted to expose\
    \ (`http.Handler`).\n\nIf we had been lazy and embedded `http.ServeMux` instead\
    \ (the concrete type) it would still work *but* users of `PlayerServer` would\
    \ be able to add new routes to our server because `Handle(path, handler)` would\
    \ be public.\n\n**When embedding types, really think about what impact that has\
    \ on your public API.**\n\nIt is a *very* common mistake to misuse embedding and\
    \ end up polluting your APIs and exposing the internals of your type.\n\nNow we've\
    \ restructured our application we can easily add new routes and have the start\
    \ of the `/league` endpoint. We now need to make it return some useful information.\n\
    \nWe should return some JSON that looks something like this.\n\n```\n```json\n\
    [\n    {\n        \"Name\":\"Bill\",\n        \"Wins\":10\n    },\n    {\n```\n\
    ```"
