- pgno: 80
  md: "Now our tests - rather, the list of test cases - make assertions of truth about\
    \ shapes and their areas.\n\n# Make sure your test output is helpful\n\nRemember\
    \ earlier when we were implementing `Triangle` and we had the failing test? It\
    \ printed `shapes_test.go:31: got 0.00 want 36.00`.\n\nWe knew this was in relation\
    \ to `Triangle` because we were just working with it. But what if a bug slipped\
    \ in to the system in one of 20 cases in the table? How would a developer know\
    \ which case failed? This is not a great experience for the developer, they will\
    \ have to manually look through the cases to find out which case actually failed.\n\
    \nWe can change our error message into `%#v got %g want %g`. The `%#v` format\
    \ string will print out our struct with the values in its field, so the developer\
    \ can see at a glance the properties that are being tested.\n\nTo increase the\
    \ readability of our test cases further, we can rename the `want` field into something\
    \ more descriptive like `hasArea`.\n\nOne final tip with table driven tests is\
    \ to use `t.Run` and to name the test cases.\n\nBy wrapping each case in a `t.Run`\
    \ you will have clearer test output on failures as it will print the name of the\
    \ case\n\n```\n--- FAIL: TestArea (0.00s)\n    --- FAIL: TestArea/Rectangle (0.00s)\n\
    \        shapes_test.go:33: main.Rectangle{Width:12, Height:6}\ngot 72.00 want\
    \ 72.10\n```\n\nAnd you can run specific tests within your table with `go test\
    \ -run TestArea/Rectangle`.\n\nHere is our final test code which captures this\n\
    \n```\nfunc TestArea(t *testing.T) {\n```"
