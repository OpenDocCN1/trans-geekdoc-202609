  md: 'Our project now needs to create two binaries, our existing web server and the
    command line app.


    Before we get stuck into our new work we should structure our project to accommodate
    this.


    So far all the code has lived in one folder, in a path looking like this


    ```

    $GOPATH/src/github.com/your-name/my-app

    ```


    In order for you to make an application in Go, you need a `main` function inside
    a `package main`. So far all of our "domain" code has lived inside `package main`
    and our `func main` can reference everything.


    This was fine so far and it is good practice not to go over-the-top with package
    structure. If you take the time to look through the standard library you will
    see very little in the way of lots of folders and structure.


    Thankfully it''s pretty straightforward to add structure when you need it.


    Inside the existing project create a `cmd` directory with a `webserver` directory
    inside that (e.g `mkdir -p cmd/webserver`).


    Move the `main.go` inside there.


    If you have `tree` installed you should run it and your structure should look
    like this


    ```

    .

    |-- file_system_store.go

    |-- file_system_store_test.go

    |-- cmd

    |   |-- webserver

    |   |   |-- main.go

    |-- league.go

    |-- server.go

    |-- server_integration_test.go

    |-- server_test.go

    ```'
