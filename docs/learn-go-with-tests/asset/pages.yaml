    We create a new template with a name, and then parse our template string. We can
    then use the `Execute` method on it, passing in our data, in this case the `Post`.


    The template will substitute things like `{{.Description}}` with the content of
    `p.Description`. Templates also give you some programming primitives like `range`
    to loop over values, and `if`. You can find more details in the [text/template
    documentation](text/template documentation).


    *This should be a pure refactor.* We shouldn''t need to change our tests and they
    should continue to pass. Importantly, our code is easier to read and has far less
    annoying error handling to contend with.


    Frequently people complain about the verbosity of error handling in Go, but you
    might find you can find better ways to write your code so it''s less error-prone
    in the first place, like here.


    # More refactoring


    Using the `html/template` has definitely been an improvement, but having it as
    a string constant in our code isn''t great:


    +   - It''s still quite difficult to read.

    +   - It''s not IDE/editor friendly. No syntax highlighting, ability to reformat,
    refactor, e.t.c.

    +   - It looks like HTML, but you can''t really work with it like you could a
    "normal" HTML file


    What we''d like to do is have our templates live in separate files so we can better
    organise them, and work with them as if they''re HTML files.


    Create a folder called "templates" and inside it make a file called `blog.gohtml`,
