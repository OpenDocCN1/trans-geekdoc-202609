  md: "the template and we could easily unit test this logic separately if we wish.\
    \ This is probably the easiest solution, although not necessarily the simplest.\n\
    \nA downside to this approach is that this is still *view* logic. It's not interesting\
    \ to the rest of the system but it now becomes a part of the API for a core domain\
    \ object. This kind of approach over time can lead to you creating God Objects.\n\
    \n# Create a dedicated view model type, such as `PostViewModel` with exactly the\
    \ data we need\n\nRather than our rendering code being coupled to the domain object,\
    \ `Post`, it instead takes a view model.\n\n```\n```go\ntype PostViewModel struct\
    \ {\n    Title, SanitisedTitle, Description, Body string\n    Tags []string\n\
    }\n```\n```\n\nCallers of our code would have to map from `[]Post` to `[]PostView`,\
    \ generating the `SanitizedTitle`. A way to keep this clean would be to have a\
    \ `func NewPostView(p Post) PostView` which would encapsulate the mapping.\n\n\
    This would keep our rendering code logic-less and is probably the strictest separation\
    \ of concerns we could do, but the trade-off is a slightly more convoluted process\
    \ to get our posts rendered.\n\nBoth options are fine, in this case I am tempted\
    \ to go with the first. As you evolve the system you should be wary of adding\
    \ more and more ad-hoc methods just to grease the wheels of rendering; dedicated\
    \ view models become more useful when the transformation between the domain object\
    \ and view becomes more involved.\n\nSo we can add our method to `Post`\n\n```\n\
    ```go\nfunc (p Post) SanitisedTitle() string {\n    return strings.ToLower(strings.Replace(p.Title,\
    \ \" \", \"-\", -1))\n}\n```\n```"
