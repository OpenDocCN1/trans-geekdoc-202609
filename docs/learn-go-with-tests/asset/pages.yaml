  md: "# Update our SpyStore\n\n```\ntype SpyStore struct {\n    response string\n\
    \    t        *testing.T\n}\n\nfunc (s *SpyStore) Fetch(ctx context.Context) (string,\
    \ error) {\n    data := make(chan string, 1)\n\n    go func() {\n        var result\
    \ string\n        for _, c := range s.response {\n            select {\n     \
    \       case <-ctx.Done():\n                log.Println(\"spy store got cancelled\"\
    )\n                return\n            default:\n                time.Sleep(10\
    \ * time.Millisecond)\n                result += string(c)\n            }\n  \
    \      }\n        data <- result\n    }()\n\n    select {\n    case <-ctx.Done():\n\
    \        return \"\", ctx.Err()\n    case res := <-data:\n        return res,\
    \ nil\n    }\n}\n```\n\nWe have to make our spy act like a real method that works\
    \ with context.\n\nWe are simulating a slow process where we build the result\
    \ slowly by appending the string, character by character in a goroutine. When\
    \ the goroutine finishes its work it writes the string to the data channel. The\
    \ goroutine listens for the ctx.Done and will stop the work if a signal is sent\
    \ in that channel."
