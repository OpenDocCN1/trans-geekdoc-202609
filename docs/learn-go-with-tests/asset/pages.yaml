  md: "```\nif !store.cancelled {\n    t.Error(\"store was not told to cancel\")\n\
    }\n})\n```\n\nFrom the Go Blog: Context\n\nThe context package provides functions\
    \ to derive new Context values from existing ones. These values form a tree: when\
    \ a Context is canceled, all Contexts derived from it are also canceled.\n\nIt's\
    \ important that you derive your contexts so that cancellations are propagated\
