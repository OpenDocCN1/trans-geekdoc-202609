    \ inaccurate, especially when we factor them up and down as we are in the secondsInRadians\
    \ function. By dividing math.Pi by 30 and then by multiplying it by 30 we've ended\
    \ up with a number that's no longer the same as math.Pi.\n\nThere are two ways\
    \ around this:\n\n+   1. Live with it\n+   2. Refactor our function by refactoring\
    \ our equation\n\nNow (1) may not seem all that appealing, but it's often the\
    \ only way to make floating point equality work. Being inaccurate by some infinitesimal\
