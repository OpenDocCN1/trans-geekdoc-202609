- pgno: 26
  md: "```\nfunc TestHello(t *testing.T) {\n    got := Hello(\"Chris\")\n    want\
    \ := \"Hello, Chris\"\n\n    if got != want {\n        t.Errorf(\"got %q want\
    \ %q\", got, want)\n    }\n}\n```\n\nNow run go test, you should have a compilation\
    \ error\n\n```\n./hello_test.go:6:18: too many arguments in call to Hello\n  \
    \  have (string)\n    want ()\n```\n\nWhen using a statically typed language like\
    \ Go it is important to listen to the compiler. The compiler understands how your\
    \ code should snap together and work so you don't have to.\n\nIn this case the\
    \ compiler is telling you what you need to do to continue. We have to change our\
    \ function Hello to accept an argument.\n\nEdit the Hello function to accept an\
    \ argument of type string\n\n```\nfunc Hello(name string) string {\n    return\
    \ \"Hello, world\"\n}\n```\n\nIf you try and run your tests again your hello.go\
    \ will fail to compile because you're not passing an argument. Send in \"world\"\
    \ to make it compile.\n\n```\nfunc main() {\n    fmt.Println(Hello(\"world\"))\n\
    }\n```\n\nNow when you run your tests you should see something like\n\n```\nhello_test.go:10:\
    \ got 'Hello, world' want 'Hello, Chris'\n```"
