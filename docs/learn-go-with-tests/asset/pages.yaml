- pgno: 559
  md: "+   - If your tests look messy try and refactor them.\n+   - If you've done\
    \ this and they're still a mess it is very likely pointing to a flaw in your design\n\
    +   - This is one of the real strengths of tests.\n\nEven though the tests and\
    \ the production code was a bit cluttered we could freely refactor backed by our\
    \ tests.\n\nRemember when you get into these situations to always take small steps\
    \ and re-run the tests after every change.\n\nIt would've been dangerous to refactor\
    \ both the test code and the production code at the same time, so we first refactored\
    \ the production code (in the current state we couldn't improve the tests much)\
    \ without changing its interface so we could rely on our tests as much as we could\
    \ while changing things. Then we refactored the tests after the design improved.\n\
    \nAfter refactoring the dependency list reflected our design goal. This is another\
    \ benefit of DI in that it often documents intent. When you rely on global variables\
    \ responsibilities become very unclear.\n\n# An example of a function implementing\
    \ an interface\n\nWhen you define an interface with one method in it you might\
    \ want to consider defining a MyInterfaceFunc type to complement it so users can\
    \ implement your interface with just a function.\n\n```\ntype BlindAlerter interface\
    \ {\n    ScheduleAlertAt(duration time.Duration, amount int)\n}\n```\n\n```\n\
    // BlindAlerterFunc allows you to implement BlindAlerter with a\ntype BlindAlerterFunc\
    \ func(duration time.Duration, amount int)\n\n// ScheduleAlertAt is BlindAlerterFunc\
    \ implementation of BlindAi\n```"
