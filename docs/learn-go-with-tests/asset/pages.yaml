    +   - Iterate over the collection, applying some kind of operation (or function)
    to the result and the next item in the slice, setting a new value for the result

    +   - Return the result.


    This idea is commonly talked about in functional programming circles, often times
    called ''reduce'' or fold.


    In functional programming, fold (also termed reduce, accumulate, aggregate, compress,
    or inject) refers to a family of higher-order functions that analyze a recursive
    data structure and through use of a given combining operation, recombine the results
    of recursively processing its constituent parts, building up a return value. Typically,
    a fold is presented with a combining function, a top node of a data structure,
    and possibly some default values to be used under certain conditions. The fold
    then proceeds to combine elements of the data structure''s hierarchy, using the
    function in a systematic way.


    Go has always had higher-order functions, and as of version 1.18 it also has generics,
    so it is now possible to define some of these functions discussed in our wider
    field. There''s no point burying your head in the sand, this is a very common
    abstraction outside the Go ecosystem and it''ll be beneficial to understand it.


