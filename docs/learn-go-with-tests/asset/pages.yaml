- pgno: 15
  md: '# If unit tests are so great, why is there sometimes resistance to writing
    them?


    On the one hand you have people (like me) saying that unit tests are important
    for the long term health of your system because they ensure you can keep refactoring
    with confidence.


    On the other you have people describing experiences of unit tests actually hindering
    refactoring.


    Ask yourself, how often do you have to change your tests when refactoring? Over
    the years I have been on many projects with very good test coverage and yet the
    engineers are reluctant to refactor because of the perceived effort of changing
    tests.


    This is the opposite of what we are promised!


    # Why is this happening?


    Imagine you were asked to develop a square and we thought the best way to accomplish
    that would be stick two triangles together.


    ![](img/570fb0b5bd524332c8e0fb9e37d716fb_15_0.png)


    We write our unit tests around our square to make sure the sides are equal and
    then we write some tests around our triangles. We want to make sure our triangles
    render correctly so we assert that the angles sum up to 180 degrees, perhaps check
    we make 2 of them, etc etc. Test coverage is really important and writing these
    tests is pretty easy so why not?'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'A few weeks later The Law of Continuous Change strikes our system and a new
    developer makes some changes. She now believes it would be better if squares were
    formed with 2 rectangles instead of 2 triangles.


    ![](img/570fb0b5bd524332c8e0fb9e37d716fb_16_0.png)


    She tries to do this refactor and gets mixed signals from a number of failing
    tests. Has she actually broken important behaviours here? She now has to dig through
    these triangle tests and try and understand what''s going on.


    *It''s not actually important that the square was formed out of triangles* but
    **our tests have falsely elevated the importance of our implementation details.**


    # # Favour testing behaviour rather than implementation detail


    When I hear people complaining about unit tests it is often because the tests
    are at the wrong abstraction level. They''re testing implementation details, overly
    spying on collaborators and mocking too much.


    I believe it stems from a misunderstanding of what unit tests are and chasing
    vanity metrics (test coverage).


    If I am saying just test behaviour, should we not just only write system/black-box
    tests? These kind of tests do have lots of value in terms of verifying key user
    journeys but they are typically expensive to write and slow to run. For that reason
    they''re not too helpful for *refactoring* because the feedback loop is slow.
    In addition black box'
  merge: -1
