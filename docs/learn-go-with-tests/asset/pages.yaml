- pgno: 74
  md: "We want to be able to write some kind of `checkArea` function that we can pass\
    \ both `Rectangles` and `Circles` to, but fail to compile if we try to pass in\
    \ something that isn't a shape.\n\nWith Go, we can codify this intent with **interfaces**.\n\
    \n[Interfaces]( ) are a very powerful concept in statically typed languages like\
    \ Go because they allow you to make functions that can be used with different\
    \ types and create highly-decoupled code whilst still maintaining type-safety.\n\
    \nLet's introduce this by refactoring our tests.\n\n```\n```go\nfunc TestArea(t\
    \ *testing.T) {\n\n    checkArea := func(t testing.TB, shape Shape, want float64)\
    \ {\n        t.Helper()\n        got := shape.Area()\n        if got != want {\n\
    \            t.Errorf(\"got %g want %g\", got, want)\n        }\n    }\n\n   \
    \ t.Run(\"rectangles\", func(t *testing.T) {\n        rectangle := Rectangle{12,\
    \ 6}\n        checkArea(t, rectangle, 72.0)\n    })\n\n    t.Run(\"circles\",\
    \ func(t *testing.T) {\n        circle := Circle{10}\n        checkArea(t, circle,\
    \ 314.1592653589793)\n    })\n}\n```\n```\n\nWe are creating a helper function\
    \ like we have in other exercises but this time we are asking for a `Shape` to\
    \ be passed in. If we try to call this with something that isn't a shape, then\
    \ it will not compile."
  merge: -1
  img_proc: true
- pgno: 75
  md: "How does something become a shape? We just tell Go what a Shape is using an\
    \ interface declaration\n\n```\ntype Shape interface {\n    Area() float64\n}\n\
    ```\n\nWe're creating a new type just like we did with Rectangle and Circle but\
    \ this time it is an interface rather than a struct.\n\nOnce you add this to the\
    \ code, the tests will pass.\n\n# Wait, what?\n\nThis is quite different to interfaces\
    \ in most other programming languages. Normally you have to write code to say\
    \ My type Foo implements interface Bar.\n\nBut in our case\n\n+   - Rectangle\
    \ has a method called Area that returns a float64 so it satisfies the Shape interface\n\
    +   - Circle has a method called Area that returns a float64 so it satisfies the\
    \ Shape interface\n+   - string does not have such a method, so it doesn't satisfy\
    \ the interface\n+   - etc.\n\nIn Go **interface resolution is implicit**. If\
    \ the type you pass in matches what the interface is asking for, it will compile.\n\
    \n# Decoupling\n\nNotice how our helper does not need to concern itself with whether\
    \ the shape is a Rectangle or a Circle or a Triangle. By declaring an interface,\
    \ the helper is decoupled from the concrete types and only has the method it needs\
    \ to do its job."
  merge: -1
  img_proc: true
- pgno: 76
  md: "This kind of approach of using interfaces to declare **only what you need**\
    \ is very important in software design and will be covered in more detail in later\
    \ sections.\n\n# Further refactoring\n\nNow that you have some understanding of\
    \ structs we can introduce \"table driven tests\".\n\n[Table driven tests](Table\
    \ driven tests) are useful when you want to build a list of test cases that can\
    \ be tested in the same manner.\n\n```\n```go\nfunc TestArea(t *testing.T) {\n\
    \    areaTests := []struct {\n        shape Shape\n        want  float64\n   \
    \ }{\n        {Rectangle{12, 6}, 72.0},\n        {Circle{10}, 314.1592653589793},\n\
    \    }\n\n    for _, tt := range areaTests {\n        got := tt.shape.Area()\n\
    \        if got != tt.want {\n            t.Errorf(\"got %g want %g\", got, tt.want)\n\
    \        }\n    }\n}\n```\n```\n\nThe only new syntax here is creating an \"anonymous\
    \ struct\", `areaTests`. We are declaring a slice of structs by using `[]struct`\
    \ with two fields, the `shape` and the `want`. Then we fill the slice with cases.\n\
    \nWe then iterate over them just like we do any other slice, using the struct\
    \ fields to run our tests."
  merge: -1
  img_proc: true
- pgno: 77
  md: "You can see how it would be very easy for a developer to introduce a new shape,\
    \ implement Area and then add it to the test cases. In addition, if a bug is found\
    \ with Area it is very easy to add a new test case to exercise it before fixing\
    \ it.\n\nTable driven tests can be a great item in your toolbox, but be sure that\
    \ you have a need for the extra noise in the tests. They are a great fit when\
    \ you wish to test various implementations of an interface, or if the data being\
    \ passed in to a function has lots of different requirements that need testing.\n\
    \nLet's demonstrate all this by adding another shape and testing it; a triangle.\n\
    \n# Write the test first\n\nAdding a new test for our new shape is very easy.\
    \ Just add {Triangle{12, 6}, 36.0}, to our list.\n\n```\nfunc TestArea(t *testing.T)\
    \ {\n\n    areaTests := []struct {\n        shape Shape\n        want  float64\n\
    \    }{\n        {Rectangle{12, 6}, 72.0},\n        {Circle{10}, 314.1592653589793},\n\
    \        {Triangle{12, 6}, 36.0},\n    }\n\n    for _, tt := range areaTests {\n\
    \        got := tt.shape.Area()\n        if got != tt.want {\n            t.Errorf(\"\
    got %g want %g\", got, tt.want)\n        }\n    }\n}\n```"
