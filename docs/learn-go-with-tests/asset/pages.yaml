  md: "We need to do three things to convert our unit vector into a point on the SVG:\n\
    \n+   1. Scale it to the length of the hand\n+   2. Flip it over the X axis because\
    \ to account for the SVG having an origin in the top left hand corner\n+   3.\
    \ Translate it to the right position (so that it's coming from an origin of (150,150))\n\
    \nFun times!\n\n```\n// SecondHand is the unit vector of the second hand of an\
    \ analogi\n// represented as a Point.\nfunc SecondHand(t time.Time) Point {\n\
    \    p := secondHandPoint(t)\n    p = Point{p.X * 90, p.Y * 90}    // scale\n\
    \    p = Point{p.X, -p.Y}             // flip\n    p = Point{p.X + 150, p.Y +\
    \ 150} // translate\n    return p\n}\n```\n\nScale, flip, and translate in exactly\
    \ that order. Hooray maths!\n\n```\nPASS\nok      clockface  0.007s\n```\n\n#\
    \ Refactor\n\nThere's a few magic numbers here that should get pulled out as constants,\
    \ so let's do that\n\n```\nconst secondHandLength = 90\nconst clockCentreX = 150\n\
    const clockCentreY = 150\n```\n\n```\n// SecondHand is the unit vector of the\
    \ second hand of an analogi\n// represented as a Point.\nfunc SecondHand(t time.Time)\
    \ Point {\n    p := secondHandPoint(t)\n    p = Point{p.X * secondHandLength,\
    \ p.Y * secondHandLength}\n```"
