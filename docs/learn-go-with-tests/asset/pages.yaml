  md: 'TDD process. So they''re still stuck with fragile, annoying systems, with a
    poor test suite.


    Simply put, if testing your code is difficult, then *using* your code is difficult
    too. Treat your tests as the first user of your code and then you''ll see if your
    code is pleasant to work with or not.


    I''ve emphasised this a lot in the book, and I''ll say it again **listen to your
    tests**.


    # Excessive setup, too many test doubles, etc.


    Ever looked at a test with 20, 50, 100, 200 lines of setup code before anything
    interesting in the test happens? Do you then have to change the code and revisit
    the mess and wish you had a different career?


    What are the signals here? *Listen*, complicated tests == complicated code. Why
    is your code complicated? Does it have to be?


    +   - When you have lots of test doubles in your tests, that means the code you''re
    testing has lots of dependencies - which means your design needs work.

    +   - If your test is reliant on setting up various interactions with mocks, that
    means your code is making lots of interactions with its dependencies. Ask yourself
    whether these interactions could be simpler.


    # Leaky interfaces


    If you have declared an `interface` that has many methods, that points to a leaky
    abstraction. Think about how you could define that collaboration with a more consolidated
    set of methods, ideally one.


