  md: "# Write enough code to make it pass\n\nIn the immortal words of Jennifer Aniston:\
    \ Here comes the science bit\n\n```\nfunc minutesInRadians(t time.Time) float64\
    \ {\n    return (secondsInRadians(t) / 60) +\n        (math.Pi / (30 / float64(t.Minute())))\n\
