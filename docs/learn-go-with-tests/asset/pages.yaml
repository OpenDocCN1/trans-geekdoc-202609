  md: "# Channels\n\nWe can solve this data race by coordinating our goroutines using\
    \ *channels*. Channels are a Go data structure that can both receive and send\
    \ values. These operations, along with their details, allow communication between\
    \ different processes.\n\nIn this case we want to think about the communication\
    \ between the parent process and each of the goroutines that it makes to do the\
    \ work of running the WebsiteChecker function with the url.\n\n```\n```go\npackage\
    \ concurrency\n\ntype WebsiteChecker func(string) bool\ntype result struct {\n\
    \    string\n    bool\n}\n\nfunc CheckWebsites(wc WebsiteChecker, urls []string)\
    \ map[string]bool\n    results := make(map[string]bool)\n    resultChannel :=\
    \ make(chan result)\n\n    for _, url := range urls {\n        go func(u string)\
    \ {\n            resultChannel <- result{u, wc(u)}\n        }(url)\n    }\n\n\
    \    for i := 0; i < len(urls); i++ {\n        r := <-resultChannel\n        results[r.string]\
    \ = r.bool\n    }\n\n    return results\n}\n```\n```\n\nAlongside the results\
    \ map we now have a resultChannel, which we make in the same way. chan result\
    \ is the type of the channel - a"
  merge: -1
  img_proc: true
- pgno: 160
  md: 'channel of result. The new type, result has been made to associate the return
    value of the WebsiteChecker with the url being checked - it''s a struct of string
    and bool. As we don''t need either value to be named, each of them is anonymous
    within the struct; this can be useful in when it''s hard to know what to name
    a value.


    Now when we iterate over the urls, instead of writing to the map directly we''re
    sending a result struct for each call to wc to the resultChannel with a send statement.
    This uses the <- operator, taking a channel on the left and a value on the right:


    ```

    // Send statement

    resultChannel <- result{u, wc(u)}

    ```


    The next for loop iterates once for each of the urls. Inside we''re using a receive
    expression, which assigns a value received from a channel to a variable. This
    also uses the <- operator, but with the two operands now reversed: the channel
    is now on the right and the variable that we''re assigning to is on the left:


    ```

    // Receive expression

    r := <-resultChannel

    ```


    We then use the result received to update the map.


    By sending the results into a channel, we can control the timing of each write
    into the results map, ensuring that it happens one at a time. Although each of
    the calls of wc, and each send to the result channel, is happening in parallel
    inside its own process, each of the results is being dealt with one at a time
    as we take values out of the result channel with the receive expression.


    We have parallelized the part of the code that we wanted to make faster, while
    making sure that the part that cannot happen in parallel still happens linearly.
    And we have communicated across the multiple processes involved by using channels.


    When we run the benchmark:'
