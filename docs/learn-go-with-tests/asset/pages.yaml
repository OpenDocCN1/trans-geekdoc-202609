    +   - Here is a video of me working through the problem and taking questions from\
    \ the Twitch stream\n\nIn this chapter we're going to learn how to read some files,\
    \ get some data out of them, and do something useful.\n\nPretend you're working\
    \ with your friend to create some blog software. The idea is an author will write\
    \ their posts in markdown, with some metadata at the top of the file. On startup,\
    \ the web server will read a folder to create some `Posts`, and then a separate\
    \ `NewHandler` function will use those `Posts` as a datasource for the blog's\
    \ webserver.\n\nWe've been asked to create the package that converts a given folder\
    \ of blog post files into a collection of `Posts`.\n\n# Example data\n\nhello\
    \ world.md\n\n```\nTitle: Hello, TDD world!\nDescription: First post on our wonderful\
    \ blog\nTags: tdd, go\n---\nHello world!\n\nThe body of posts starts after the\
    \ `---`\n```\n\n# Expected data\n\n```\ntype Post struct {\n    Title, Description,\
    \ Body string\n}\n```"
