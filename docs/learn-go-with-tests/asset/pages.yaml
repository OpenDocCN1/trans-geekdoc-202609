    \ can implement an interface, not just `struct`s. If you are making a library\
    \ that exposes an interface with one function defined it is a common idiom to\
    \ also expose a `MyInterfaceFunc` type.\n\nThis type will be a `func` which will\
    \ also implement your interface. That way users of your interface have the option\
    \ to implement your interface with just a function; rather than having to create\
