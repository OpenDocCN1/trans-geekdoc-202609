    \ Test\n\nBefore we get too stuck in, lets think about an acceptance test.\n\n\
    Wait, you don't know what an acceptance test is yet. Look, let me try to explain.\n\
    \nLet me ask you: what does winning look like? How do we know we've finished work?\
    \ TDD provides a good way of knowing when you've finished: when the test passes.\
    \ Sometimes it's nice - actually, almost all of the time it's nice - to write\
    \ a test that tells you when you've finished writing the whole usable feature.\
    \ Not just a test that tells you that a particular function is working in the\
    \ way you expect, but a test that tells you that the whole thing you're trying\
    \ to achieve - the 'feature' - is complete."
