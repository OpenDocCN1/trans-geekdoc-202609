    We have now stumbled into more questions on package design. In order to test our
    software we made unexported stubs and helper functions which are no longer available
    for us to use in our `CLI_test` because the helpers are defined in the `_test.go`
    files in the `poker` package.


    # Do we want to have our stubs and helpers ''public''?


    This is a subjective discussion. One could argue that you do not want to pollute
    your package''s API with code to facilitate tests.


    In the presentation "Advanced Testing with Go" by Mitchell Hashimoto, it is described
    how at HashiCorp they advocate doing this so that users of the package can write
    tests without having to reinvent the wheel writing stubs. In our case, this would
    mean anyone using our `poker` package won''t have to create their own stub `PlayerStore`
    if they wish to work with our code.


    Anecdotally I have used this technique in other shared packages and it has proved
    extremely useful in terms of users saving time when integrating with our packages.


    So let''s create a file called `testing.go` and add our stub and our helpers.


    ```

    //testing.go

    package poker


    import "testing"


    type StubPlayerStore struct {

