- pgno: 46
  md: "Unlike other languages like C, Java, or JavaScript there are no parentheses\
    \ surrounding the three components of the for statement and the braces { } are\
    \ always required. You might wonder what is happening in the row\n\n```\nvar repeated\
    \ string\n```\n\nas we've been using := so far to declare and initializing variables.\
    \ However, := is simply short hand for both steps. Here we are declaring a string\
    \ variable only. Hence, the explicit version. We can also use var to declare functions,\
    \ as we'll see later on.\n\nRun the test and it should pass.\n\nAdditional variants\
    \ of the for loop are described here.\n\n# Refactor\n\nNow it's time to refactor\
    \ and introduce another construct += assignment operator.\n\n```\nconst repeatCount\
    \ = 5\n```\n\n```\nfunc Repeat(character string) string {\n    var repeated string\n\
    \    for i := 0; i < repeatCount; i++ {\n        repeated += character\n    }\n\
    \    return repeated\n}\n```\n\n+= called \"the Add AND assignment operator\"\
    , adds the right operand to the left operand and assigns the result to left operand.\
    \ It works with other types like integers.\n\n# Benchmarking"
