    ```\n\nThis approach is ok, but is it idiomatic?\n\nDoes it make sense for our\
    \ web server to be concerned with manually cancelling `Store`? What if `Store`\
    \ also happens to depend on other slow-running processes? We'll have to make sure\
    \ that `Store.Cancel` correctly propagates the cancellation to all of its dependants.\n\
    \nOne of the main points of `context` is that it is a consistent way of offering\
    \ cancellation.\n\n[From the go doc](From the go doc)\n\nIncoming requests to\
    \ a server should create a Context, and outgoing calls to servers should accept\
    \ a Context. The chain of function calls between them must propagate the Context,\
    \ optionally replacing it with a derived Context created using WithCancel, WithDeadline,\
    \ WithTimeout, or WithValue. When a Context is canceled, all Contexts derived\
    \ from it are also canceled.\n\nFrom the [Go Blog: Context](Go Blog: Context)\
