  md: '# HTTP Server


    You can find all the code for this chapter here


    You have been asked to create a web server where users can track how many games
    players have won.


    +   - `GET /players/{name}` should return a number indicating the total number
    of wins

    +   - `POST /players/{name}` should record a win for that name, incrementing for
    every subsequent `POST`


    We will follow the TDD approach, getting working software as quickly as we can
    and then making small iterative improvements until we have the solution. By taking
    this approach we


    +   - Keep the problem space small at any given time

    +   - Don''t go down rabbit holes

    +   - If we ever get stuck/lost, doing a revert wouldn''t lose loads of work.


    # Red, green, refactor


    Throughout this book, we have emphasised the TDD process of write a test & watch
    it fail (red), write the *minimal* amount of code to make it work (green) and
    then refactor.


    This discipline of writing the minimal amount of code is important in terms of
    the safety TDD gives you. You should be striving to get out of "red" as soon as
    you can.


    Kent Beck describes it as:'
  merge: -1
