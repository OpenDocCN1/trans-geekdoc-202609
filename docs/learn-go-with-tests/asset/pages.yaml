    # On TDD Zealotry


    Test driven development is not a religion. Some people might act like it is -
    usually people who don''t do TDD but are happy to moan on Twitter or Dev.to that
    it''s only done by zealots and that they''re ''being pragmatic'' when they don''t
    write tests. But it''s not a religion. It''s a tool.


