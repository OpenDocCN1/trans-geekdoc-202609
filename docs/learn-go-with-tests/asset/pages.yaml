- pgno: 22
  md: "How do you test this? It is good to separate your \"domain\" code from the\
    \ outside world (side-effects). The fmt.Println is a side effect (printing to\
    \ stdout) and the string we send in is our domain.\n\nSo let's separate these\
    \ concerns so it's easier to test\n\n```\n```go\npackage main\n\nimport \"fmt\"\
    \n\nfunc Hello() string {\n    return \"Hello, world\"\n}\n\nfunc main() {\n \
    \   fmt.Println(Hello())\n}\n```\n```\n\nWe have created a new function again\
    \ with func but this time we've added another keyword string in the definition.\
    \ This means this function returns a string.\n\nNow create a new file called hello_test.go\
    \ where we are going to write a test for our Hello function\n\n```\n```go\npackage\
    \ main\n\nimport \"testing\"\n\nfunc TestHello(t *testing.T) {\n    got := Hello()\n\
    \    want := \"Hello, world\"\n\n    if got != want {\n        t.Errorf(\"got\
    \ %q want %q\", got, want)\n    }\n}\n```\n```\n\n# Go modules?"
