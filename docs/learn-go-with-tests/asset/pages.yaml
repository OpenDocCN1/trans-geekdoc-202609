    # Embedding


    We changed the second property of PlayerServer, removing the named property router
    http.ServeMux and replaced it with http.Handler; this is called embedding.


    Go does not provide the typical, type-driven notion of subclassing, but it does
    have the ability to “borrow” pieces of an implementation by embedding types within
    a struct or interface.


    Effective Go - Embedding


    What this means is that our PlayerServer now has all the methods that http.Handler
    has, which is just ServeHTTP.


    To "fill in" the http.Handler we assign it to the router we create in NewPlayerServer.
    We can do this because http.ServeMux has the method ServeHTTP.


    This lets us remove our own ServeHTTP method, as we are already exposing one via
    the embedded type.


    Embedding is a very interesting language feature. You can use it with interfaces
    to compose new interfaces.'
