    \    string\n        shape   Shape\n        hasArea float64\n    }{\n        {name:\
    \ \"Rectangle\", shape: Rectangle{Width: 12, Height:\n        {name: \"Circle\"\
    , shape: Circle{Radius: 10}, hasArea: 314\n        {name: \"Triangle\", shape:\
    \ Triangle{Base: 12, Height: 6},\n    }\n\n    for _, tt := range areaTests {\n\
    \        // using tt.name from the case to use it as the `t.Run`\n        t.Run(tt.name,\
    \ func(t *testing.T) {\n            got := tt.shape.Area()\n            if got\
    \ != tt.hasArea {\n                t.Errorf(\"%v got %g want %g\", tt.shape, got,\
    \ tt\n            }\n        })\n    }\n}\n```\n\n# Wrapping up\n\nThis was more\
    \ TDD practice, iterating over our solutions to basic mathematic problems and\
    \ learning new language features motivated by our tests.\n\n+   - Declaring structs\
    \ to create your own data types which lets you bundle related data together and\
    \ make the intent of your code clearer\n+   - Declaring interfaces so you can\
    \ define functions that can be used by different types (parametric polymorphism)\n\
    +   - Adding methods so you can add functionality to your data types and so you\
    \ can implement interfaces"
