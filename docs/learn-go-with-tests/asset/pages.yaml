- pgno: 208
  md: "This seems like a really bad idea\n\n# Copying mutexes\n\nOur test passes but\
    \ our code is still a bit dangerous\n\nIf you run go vet on your code you should\
    \ get an error like the following\n\n```\nsync/v2/sync_test.go:16: call of assertCounter\
    \ copies lock value: v1.Counter contains sync.Mutex\nsync/v2/sync_test.go:39:\
    \ assertCounter passes lock by value: v1.Counter contains sync.Mutex\n```\n\n\
    A look at the documentation of sync.Mutex tells us why\n\nA Mutex must not be\
    \ copied after first use.\n\nWhen we pass our Counter (by value) to assertCounter\
    \ it will try and create a copy of the mutex.\n\nTo solve this we should pass\
    \ in a pointer to our Counter instead, so change the signature of assertCounter\n\
    \n```\nfunc assertCounter(t testing.TB, got *Counter, want int)\n```\n\nOur tests\
    \ will no longer compile because we are trying to pass in a Counter rather than\
    \ a *Counter. To solve this I prefer to create a constructor which shows readers\
    \ of your API that it would be better to not initialise the type yourself.\n\n\
    ```\nfunc NewCounter() *Counter {\n\treturn &Counter{}\n}\n```"
