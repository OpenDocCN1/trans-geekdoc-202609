  md: '# Why unit tests and how to make them work for you


    [Here''s a link to a video of me chatting about this topic](video-link)


    If you''re not into videos, here''s wordy version of it.


    # Software


    The promise of software is that it can change. This is why it is called *soft*
    ware, it is malleable compared to hardware. A great engineering team should be
    an amazing asset to a company, writing systems that can evolve with a business
    to keep delivering value.


    So why are we so bad at it? How many projects do you hear about that outright
    fail? Or become "legacy" and have to be entirely re-written (and the re-writes
    often fail too!)


    How does a software system "fail" anyway? Can''t it just be changed until it''s
    correct? That''s what we''re promised!


    A lot of people are choosing Go to build systems because it has made a number
    of choices which one hopes will make it more legacy-proof.


    +   - Compared to my previous life of Scala where [I described how it has enough
    rope to hang yourself](link), Go has only 25 keywords and *a lot* of systems can
    be built from the standard library and a few other small libraries. The hope is
    that with Go you can write code and come back to it in 6 months time and it''ll
    still make sense.

    +   - The tooling in respect to testing, benchmarking, linting & shipping is first
    class compared to most alternatives.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '+   - The standard library is brilliant.

    +   - Very fast compilation speed for tight feedback loops

    +   - The Go backward compatibility promise. It looks like Go will get generics
    and other features in the future but the designers have promised that even Go
    code you wrote 5 years ago will still build. I literally spent weeks upgrading
    a project from Scala 2.8 to 2.10.


    Even with all these great properties we can still make terrible systems, so we
    should look to the past and understand lessons in software engineering that apply
    no matter how shiny (or not) your language is.


    In 1974 a clever software engineer called Manny_Lhman wrote Lehman''s laws of
    software evolution.


    The laws describe a balance between forces driving new developments on one hand,
    and forces that slow down progress on the other hand.


    These forces seem like important things to understand if we have any hope of not
    being in an endless cycle of shipping systems that turn into legacy and then get
    re-written over and over again.


    # The Law of Continuous Change


    Any software system used in the real-world must change or become less and less
    useful in the environment


    It feels obvious that a system has to change or it becomes less useful but how
    often is this ignored?


    Many teams are incentivised to deliver a project on a particular date and then
    moved on to the next project. If the software is "lucky" there is at least some
    kind of hand-off to another set of individuals to maintain it, but they didn''t
    write it of course.'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'People often concern themselves with trying to pick a framework which will
    help them "deliver quickly" but not focusing on the longevity of the system in
    terms of how it needs to evolve.


    Even if you''re an incredible software engineer, you will still fall victim to
    not knowing the future needs of your system. As the business changes some of the
    brilliant code you wrote is now no longer relevant.


    Lehman was on a roll in the 70s because he gave us another law to chew on.


    # The Law of Increasing Complexity


    As a system evolves, its complexity increases unless work is done to reduce it


    What he''s saying here is we can''t have software teams as blind feature factories,
    piling more and more features on to software in the hope it will survive in the
    long run.


    We **have** to keep managing the complexity of the system as the knowledge of
    our domain changes.


    # Refactoring


    There are *many* facets of software engineering that keeps software malleable,
    such as:


    +   - Developer empowerment

    +   - Generally "good" code. Sensible separation of concerns, etc etc

    +   - Communication skills

    +   - Architecture

    +   - Observability

    +   - Deployability

    +   - Automated tests'
  merge: -1
