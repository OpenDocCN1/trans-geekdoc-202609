- pgno: 258
  md: 'So when the function signature looks like `ConvertToRoman(arabic int) string`
    it''s making a bit of an assumption about how it''s being called. Because sometimes
    `arabic` will be written as a decimal integer literal


    ```

    ConvertToRoman(255)

    ```


    But it could just as well be written


    ```

    ConvertToRoman(0xFF)

    ```


    Really, we''re not ''converting'' from an Arabic numeral at all, we''re ''printing''
    - representing - an `int` as a Roman numeral - and `ints` are not numerals, Arabic
    or otherwise; they''re just numbers. The `ConvertToRoman` function is more like
    `strconv.Itoa` in that it''s turning an `int` into a `string`.


    But every other version of the kata doesn''t care about this distinction so 🙆'
