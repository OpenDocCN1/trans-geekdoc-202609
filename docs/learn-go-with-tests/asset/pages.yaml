- pgno: 320
  md: '# Iterative, test-driven development


    We''ll take an iterative approach where we''re always taking simple, safe steps
    toward our goal.


    This requires us to break up our work, but we should be careful not to fall into
    the trap of taking a "bottom up" approach.


    We should not trust our over-active imaginations when we start work. We could
    be tempted into making some kind of abstraction that is only validated once we
    stick everything together, such as some kind of `BlogPostFileParser`.


    This is *not* iterative and is missing out on the tight feedback loops that TDD
    is supposed to bring us.


    Kent Beck says:


    > > Optimism is an occupational hazard of programming. Feedback is the treatment.


    Instead, our approach should strive to be as close to delivering *real* consumer
    value as quickly as possible (often called a "happy path"). Once we have delivered
    a small amount of consumer value end-to-end, further iteration of the rest of
    the requirements is usually straightforward.


    # Thinking about the kind of test we want to see


    Let''s remind ourselves of our mindset and goals when starting:'
  merge: -1
  img_proc: true
- pgno: 321
  md: '+   - **Write the test we want to see.** Think about how we''d like to use
    the code we''re going to write from a consumer''s point of view.

    +   - *Focus on what and why, but don''t get distracted by how.*


    Our package needs to offer a function that can be pointed at a folder, and return
    us some posts.


    ```

    var posts []blogposts.Post

    posts = blogposts.NewPostsFromFS("some-folder")

    ```


    To write a test around this, we''d need some kind of test folder with some example
    posts in it. There''s nothing terribly wrong with this, but you are making some
    trade-offs:


    +   - for each test you may need to create new files to test a particular behaviour

    +   - some behaviour will be challenging to test, such as failing to load files

    +   - the tests will run a little slower because they will need to access the
    file system


    We''re also unnecessarily coupling ourselves to a specific implementation of the
    file system.


    # File system abstractions introduced in Go 1.16


    Go 1.16 introduced an abstraction for file systems; the io/fs package.


    Package fs defines basic interfaces to a file system. A file system can be provided
    by the host operating system but also by other packages.


    This lets us loosen our coupling to a specific file system, which will then let
    us inject different implementations according to our needs.


    On the producer side of the interface, the new embed.FS type implements fs.FS,
    as does zip.Reader. The new os.DirFS'
