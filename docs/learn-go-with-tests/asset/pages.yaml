- pgno: 601
  md: "What does this tell us? The ergonomics of our test would be reflected on another\
    \ bit of code trying to use our code.\n\nHow does a user of our code react to\
    \ the specific kind of errors we return? The best they can do is look at the error\
    \ string which is extremely error prone and horrible to write.\n\n# What we should\
    \ do\n\nWith TDD we have the benefit of getting into the mindset of:\n\nHow would\
    \ I want to use this code?\n\nWhat we could do for DumbGetter is provide a way\
    \ for users to use the type system to understand what kind of error has happened.\n\
    \nWhat if DumbGetter could return us something like\n\n```\n```go\ntype BadStatusError\
    \ struct {\n    URL     string\n    Status int\n}\n```\n```\n\nRather than a magical\
    \ string, we have actual data to work with.\n\nLet's change our existing test\
    \ to reflect this need\n\n```\n```go\nt.Run(\"when you don't get a 200 you get\
    \ a status error\", func(t\n    svr := httptest.NewServer(http.HandlerFunc(func(res\
    \ http.Res\n        res.WriteHeader(http.StatusTeapot)\n    }))\n    defer svr.Close()\n\
    \n    _, err := DumbGetter(svr.URL)\n\n    if err == nil {\n        t.Fatal(\"\
    expected an error\")\n    }\n})\n```\n```"
