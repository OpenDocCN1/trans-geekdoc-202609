    # But isn't mocking evil?\n\nYou may have heard mocking is evil. Just like anything\
    \ in software development it can be used for evil, just like DRY.\n\nPeople normally\
    \ get in to a bad state when they don't listen to their tests and are not respecting\
    \ the refactoring stage.\n\nIf your mocking code is becoming complicated or you\
    \ are having to mock out lots of things to test something, you should listen to\
    \ that bad feeling and think about your code. Usually it is a sign of\n\n+   -\
    \ The thing you are testing is having to do too many things (because it has too\
    \ many dependencies to mock)\n+     - Break the module apart so it does less\n\
    +   - Its dependencies are too fine-grained\n+     - Think about how you can consolidate\
    \ some of these dependencies into one meaningful module\n+   - Your test is too\
    \ concerned with implementation details"
