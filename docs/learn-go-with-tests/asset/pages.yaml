- pgno: 316
  md: "Looking at `clockface.go`, there are a few 'magic numbers' floating about.\
    \ They are all based around how many hours/minutes/seconds there are in a half-turn\
    \ around a clockface. Let's refactor so that we make explicit their meaning.\n\
    \n```\nconst (\n    secondsInHalfClock = 30\n    secondsInClock     = 2 * secondsInHalfClock\n\
    \    minutesInHalfClock = 30\n    minutesInClock     = 2 * minutesInHalfClock\n\
    \    hoursInHalfClock   = 6\n    hoursInClock       = 2 * hoursInHalfClock\n)\n\
    ```\n\nWhy do this? Well, it makes explicit what each number *means* in the equation.\
    \ If - *when* - we come back to this code, these names will help us to understand\
    \ what's going on.\n\nMoreover, should we ever want to make some really, really\
    \ WEIRD clocks - ones with 4 hours for the hour hand, and 20 seconds for the second\
    \ hand say - these constants could easily become parameters. We're helping to\
    \ leave that door open (even if we never go through it).\n\n# Wrapping up\n\n\
    Do we need to do anything else?\n\nFirst, let's pat ourselves on the back - we've\
    \ written a program that makes an SVG clockface. It works and it's great. It will\
    \ only ever make one sort of clockface - but that's fine! Maybe you only *want*\
    \ one sort of clockface. There's nothing wrong with a program that solves a specific\
    \ problem and nothing else.\n\n# A Program... and a Library"
  merge: -1
  img_proc: true
- pgno: 317
  md: 'But the code we''ve written *does* solve a more general set of problems to
    do with drawing a clockface. Because we used tests to think about each small part
    of the problem in isolation, and because we codified that isolation with functions,
    we''ve built a very reasonable little API for clockface calculations.


    We can work on this project and turn it into something more general - a library
    for calculating clockface angles and/or vectors.


    In fact, providing the library along with the program is *a really good idea*.
    It costs us nothing, while increasing the utility of our program and helping to
    document how it works.


    > > APIs should come with programs, and vice versa. An API that you must write
    C code to use, which cannot be invoked easily from the command line, is harder
    to learn and use. And contrariwise, it''s a royal pain to have interfaces whose
    only open, documented form is a program, so you cannot invoke them easily from
    a C program. -- Henry Spencer, in *The Art of Unix Programming*


    In [my final take on this program](), I''ve made the unexported functions within
    `clockface` into a public API for the library, with functions to calculate the
    angle and unit vector for each of the clock hands. I''ve also split the SVG generation
    part into its own package, `svg`, which is then used by the `clockface` program
    directly. Naturally I''ve documented each of the functions and packages.


    Talking about SVGs...


    # The Most Valuable Test


    I''m sure you''ve noticed that the most sophisticated piece of code for handling
    SVGs isn''t in our application code at all; it''s in the test code. Should this
    make us feel uncomfortable? Shouldn''t we do something like


    +   - use a template from `text/template`?'
  merge: -1
  img_proc: true
- pgno: 318
  md: '+   - use an XML library (much as we''re doing in our test)?

    +   - use an SVG library?


    We could refactor our code to do any of these things, and we can do so because
    it doesn''t matter how we produce our SVG, what is important is what we produce
    - an SVG. As such, the part of our system that needs to know the most about SVGs
    - that needs to be the strictest about what constitutes an SVG - is the test for
    the SVG output: it needs to have enough context and knowledge about what an SVG
    is for us to be confident that we''re outputting an SVG. The what of an SVG lives
    in our tests; the how in the code.


    We may have felt odd that we were pouring a lot of time and effort into those
    SVG tests - importing an XML library, parsing XML, refactoring the structs - but
    that test code is a valuable part of our codebase - possibly more valuable than
    the current production code. It will help guarantee that the output is always
    a valid SVG, no matter what we choose to use to produce it.


    Tests are not second class citizens - they are not ''throwaway'' code. Good tests
    will last a lot longer than the version of the code they are testing. You should
    never feel like you''re spending ''too much time'' writing your tests. It is an
    investment.


