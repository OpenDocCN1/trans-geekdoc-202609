  md: "Well, OK - now let's make ourselves do some *real* work. We could model the\
    \ minute hand as only moving every full minute - so that it 'jumps' from 30 to\
    \ 31 minutes past without moving in between. But that would look a bit rubbish.\
    \ What we want it to do is move a *tiny little bit* every second.\n\n```\nfunc\
    \ TestMinutesInRadians(t *testing.T) {\n    cases := []struct {\n        time\
    \    time.Time\n        angle   float64\n    }{\n        {simpleTime(0, 30, 0),\
    \ math.Pi},\n        {simpleTime(0, 0, 7), 7 * (math.Pi / (30 * 60))},\n    }\n\
    \n    for _, c := range cases {\n        t.Run(testName(c.time), func(t *testing.T)\
    \ {\n            got := minutesInRadians(c.time)\n            if got != c.angle\
    \ {\n                t.Fatalf(\"Wanted %v radians, but got %v\", c.angle\n   \
    \         }\n        })\n    }\n}\n```\n\nHow much is that tiny little bit? Well...\n\
    \n+   - Sixty seconds in a minute\n+   - thirty minutes in a half turn of the\
    \ circle (`math.Pi` radians)\n+   - so `30 * 60` seconds in a half turn.\n+  \
    \ - So if the time is 7 seconds past the hour ...\n+   - ... we're expecting to\
    \ see the minute hand at `7 * (math.Pi / (30 * 60))` radians past the 12.\n\n\
    # Try to run the test\n\n```\nclockface_test.go:62: Wanted 0.012217304763960306\
    \ radians, but\ngot 3.141592653589793\n```"
