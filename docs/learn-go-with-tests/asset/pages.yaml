  md: "At Google, we require that Go programmers pass a Context parameter as the first\
    \ argument to every function on the call path between incoming and outgoing requests.\
    \ This allows Go code developed by many different teams to interoperate well.\
    \ It provides simple control over timeouts and cancelation and ensures that critical\
    \ values like security credentials transit Go programs properly.\n\n(Pause for\
    \ a moment and think of the ramifications of every function having to send in\
    \ a context, and the ergonomics of that.)\n\nFeeling a bit uneasy? Good. Let's\
    \ try and follow that approach though and instead pass through the `context` to\
    \ our `Store` and let it be responsible. That way it can also pass the `context`\
    \ through to its dependants and they too can be responsible for stopping themselves.\n\
    \n# Write the test first\n\nWe'll have to change our existing tests as their responsibilities\
    \ are changing. The only thing our handler is responsible for now is making sure\
    \ it sends a context through to the downstream `Store` and that it handles the\
    \ error that will come from the `Store` when it is cancelled.\n\nLet's update\
    \ our `Store` interface to show the new responsibilities.\n\n```\n```go\ntype\
    \ Store interface {\n    Fetch(ctx context.Context) (string, error)\n}\n```\n\
    ```\n\nDelete the code inside our handler for now\n\n```\n```go\nfunc Server(store\
    \ Store) http.HandlerFunc {\n    return func(w http.ResponseWriter, r *http.Request)\
    \ {\n    }\n}\n```\n```"
