    \ (in our case `i`) and a *copy* of the element at that index. Changing the `Wins`\
    \ value of a copy won't have any effect on the `league` slice that we iterate\
    \ on. For that reason, we need to get the reference to the actual value by doing\
    \ `league[i]` and then changing that value instead.\n\nIf you run the tests, they\
    \ should now be passing.\n\n# Refactor\n\nIn `GetPlayerScore` and `RecordWin`,\
