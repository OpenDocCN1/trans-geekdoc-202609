- pgno: 600
  md: "As Pedro says, we *could* write a test for the status error like so.\n\n```\n\
    t.Run(\"when you don't get a 200 you get a status error\", func(t\n    svr :=\
    \ httptest.NewServer(http.HandlerFunc(func(res http.Res\n        res.WriteHeader(http.StatusTeapot)\n\
    \    }))\n    defer svr.Close()\n\n    _, err := DumbGetter(svr.URL)\n\n    if\
    \ err == nil {\n        t.Fatal(\"expected an error\")\n    }\n\n    want := fmt.Sprintf(\"\
    did not get 200 from %s, got %d\", svr.L\n    got := err.Error()\n\n    if got\
    \ != want {\n        t.Errorf(`got \"%v\", want \"%v\"`, got, want)\n    }\n})\n\
    ```\n\nThis test creates a server which always returns `StatusTeapot` and then\
    \ we use its URL as the argument to `DumbGetter` so we can see it handles non\
    \ 200 responses correctly.\n\n# Problems with this way of testing\n\nThis book\
    \ tries to emphasise *listen to your tests* and this test doesn't *feel* good:\n\
    \n+   - We're constructing the same string as production code does to test it\n\
    +   - It's annoying to read and write\n+   - Is the exact error message string\
    \ what we're *actually concerned with* ?"
