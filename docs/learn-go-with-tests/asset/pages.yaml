- pgno: 17
  md: 'tests don''t tend to help you very much with root causes compared to unit tests.


    So what *is* the right abstraction level?


    # Writing effective unit tests is a design problem


    Forgetting about tests for a moment, it is desirable to have within your system
    self-contained, decoupled "units" centered around key concepts in your domain.


    I like to imagine these units as simple Lego bricks which have coherent APIs that
    I can combine with other bricks to make bigger systems. Underneath these APIs
    there could be dozens of things (types, functions et al) collaborating to make
    them work how they need to.


    For instance if you were writing a bank in Go, you might have an "account" package.
    It will present an API that does not leak implementation detail and is easy to
    integrate with.


    If you have these units that follow these properties you can write unit tests
    against their public APIs. *By definition* these tests can only be testing useful
    behaviour. Underneath these units I am free to refactor the implementation as
    much as I need to and the tests for the most part should not get in the way.


    # Are these unit tests?


    **YES**. Unit tests are against "units" like I described. They were *never* about
    only being against a single class/function/whatever.


    # Bringing these concepts together'
