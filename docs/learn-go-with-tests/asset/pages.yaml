- pgno: 456
  md: "In my experience tests that assert against JSON strings have the following\
    \ problems.\n\n+   - *Brittleness.* If you change the data-model your tests will\
    \ fail.\n+   - *Hard to debug.* It can be tricky to understand what the actual\
    \ problem is when comparing two JSON strings.\n+   - *Poor intention.* Whilst\
    \ the output should be JSON, what's really important is exactly what the data\
    \ is, rather than how it's encoded.\n+   - *Re-testing the standard library.*\
    \ There is no need to test how the standard library outputs JSON, it is already\
    \ tested. Don't test other people's code.\n\nInstead, we should look to parse\
    \ the JSON into data structures that are relevant for us to test with.\n\n# Data\
    \ modelling\n\nGiven the JSON data model, it looks like we need an array of `Player`\
    \ with some fields so we have created a new type to capture this.\n\n```\n//server.go\n\
    type Player struct {\n    Name string\n    Wins int\n}\n```\n\n# JSON decoding\n\
    \n```\n//server_test.go\nvar got []Player\nerr := json.NewDecoder(response.Body).Decode(&got)\n\
    ```\n\nTo parse JSON into our data model we create a `Decoder` from `encoding/json`\
    \ package and then call its `Decode` method. To create a `Decoder` it needs an\
    \ `io.Reader` to read from which in our case is our response spy's `Body`."
