- pgno: 415
  md: 'Make the test work quickly, committing whatever sins necessary in process.


    You can commit these sins because you will refactor afterwards backed by the safety
    of the tests.


    # What if you don''t do this?


    The more changes you make while in red, the more likely you are to add more problems,
    not covered by tests.


    The idea is to be iteratively writing useful code with small steps, driven by
    tests so that you don''t fall into a rabbit hole for hours.


    # Chicken and egg


    How can we incrementally build this? We can''t `GET` a player without having stored
    something and it seems hard to know if `POST` has worked without the `GET` endpoint
    already existing.


    This is where *mocking* shines.


    +   - `GET` will need a `PlayerStore` *thing* to get scores for a player. This
    should be an interface so when we test we can create a simple stub to test our
    code without needing to have implemented any actual storage code.

    +   - For `POST` we can *spy* on its calls to `PlayerStore` to make sure it stores
    players correctly. Our implementation of saving won''t be coupled to retrieval.

    +   - For having some working software quickly we can make a very simple in-memory
    implementation and then later we can create an implementation backed by whatever
    storage mechanism we prefer.


    # Write the test first'
