  md: '# Mathematics


    You can find all the code for this chapter here


    For all the power of modern computers to perform huge sums at lightning speed,
    the average developer rarely uses any mathematics to do their job. But not today!
    Today we''ll use mathematics to solve a real problem. And not boring mathematics
    - we''re going to use trigonometry and vectors and all sorts of stuff that you
    always said you''d never have to use after highschool.


    # The Problem


    You want to make an SVG of a clock. Not a digital clock - no, that would be easy
    - an analogue clock, with hands. You''re not looking for anything fancy, just
    a nice function that takes a Time from the time package and spits out an SVG of
    a clock with all the hands - hour, minute and second - pointing in the right direction.
    How hard can that be?


    First we''re going to need an SVG of a clock for us to play with. SVGs are a fantastic
    image format to manipulate programmatically because they''re written as a series
    of shapes, described in XML. So this clock:'
