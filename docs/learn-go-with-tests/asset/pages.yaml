    \    database io.ReadSeeker\n}\n\nfunc (f *FileSystemPlayerStore) GetLeague()\
    \ []Player {\n    f.database.Seek(0, 0)\n    league, _ := NewLeague(f.database)\n\
    \    return league\n}\n```\n\nTry running the test, it now passes! Happily for\
