    \  \"hello world.md\": {Data: []byte(\"hi\")},\n        \"hello-world2.md\": {Data:\
    \ []byte(\"hola\")},\n    }\n\n    posts := blogposts.NewPostsFromFS(fs)\n\n \
    \   if len(posts) != len(fs) {\n        t.Errorf(\"got %d posts, wanted %d posts\"\
    , len(posts), le\n    }\n}\n```\n\nNotice that the package of our test is `blogposts_test`.\
    \ Remember, when TDD is practiced well we take a *consumer-driven* approach: we\
    \ don't want to test internal details because *consumers* don't care about them.\
    \ By appending `_test` to our intended package name, we only access exported members\
    \ from our package - just like a real user of our package.\n\nWe've imported `testing/fstest`\
    \ which gives us access to the `fstest.MapFS` type. Our fake file system will\
    \ pass `fstest.MapFS` to our package.\n\nA MapFS is a simple in-memory file system\
    \ for use in tests, represented as a map from path names (arguments to Open) to\
    \ information about the files or directories they represent.\n\nThis feels simpler\
    \ than maintaining a folder of test files, and it will execute quicker."
