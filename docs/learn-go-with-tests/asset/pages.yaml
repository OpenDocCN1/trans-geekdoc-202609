- pgno: 252
  md: "What if we could take these rules that we know about our domain and somehow\
    \ exercise them against our code?\n\nProperty based tests help you do this by\
    \ throwing random data at your code and verifying the rules you describe always\
    \ hold true. A lot of people think property based tests are mainly about random\
    \ data but they would be mistaken. The real challenge about property based tests\
    \ is having a good understanding of your domain so you can write these properties.\n\
    \n# Enough words, let's see some code\n\n```\nfunc TestPropertiesOfConversion(t\
    \ *testing.T) {\n    assertion := func (arabic int) bool {\n        roman := ConvertToRoman(arabic)\n\
    \        fromRoman := ConvertToArabic(roman)\n        return fromRoman == arabic\n\
    \    }\n\n    if err := quick.Check(assertion, nil); err != nil {\n        t.Error(\"\
    failed checks\", err)\n    }\n}\n```\n\n# Rationale of property\n\nOur first test\
    \ will check that if we transform a number into Roman, when we use our other function\
    \ to convert it back to a number that we get what we originally had.\n\n+   -\
    \ Given random number (e.g 4).\n+   - Call `ConvertToRoman` with random number\
    \ (should return IV if 4).\n+   - Take the result of above and pass it to `ConvertToArabic`.\n\
    +   - The above should give us our original input (4).\n\nThis feels like a good\
    \ test to build us confidence because it should break if there's a bug in either.\
    \ The only way it could pass is if they have the same kind of bug; which isn't\
    \ impossible but feels unlikely."
  merge: -1
