    # The problem with interface{}


    Our `AssertX` functions are quite naive but conceptually aren''t too different
    to how other popular libraries offer this functionality.


    ```

    func (is *I) Equal(a, b interface{})

    ```


    So what''s the problem?


    By using `interface{}` the compiler can''t help us when writing our code, because
    we''re not telling it anything useful about the types of things passed to the
    function. Try comparing two different types.


    ```

    AssertNotEqual(1, "1")

    ```


    In this case, we get away with it; the test compiles, and it fails as we''d hope,
    although the error message `got 1, want 1` is unclear; but do we want to be able
    to compare strings with integers? What about comparing a `Person` with an `Airport`?


    Writing functions that take `interface{}` can be extremely challenging and bug-prone
    because we''ve lost our constraints, and we have no information at compile time
    as to what kinds of data we''re dealing with.


    This means **the compiler can''t help us** and we''re instead more likely to have
    **runtime errors** which could affect our users, cause outages, or worse.


    Often developers have to use reflection to implement these ahem generic functions,
    which can get complicated to read and write, and can hurt the performance of your
    program.


