  md: '# HTML Templates


    [You can find all the code here]()


    We live in a world where everyone wants to build web applications with the latest
    flavour of the month frontend framework built upon gigabytes of transpiled JavaScript,
    working with a Byzantine build system; [but maybe that''s not always necessary]().


    I''d say most Go developers value a simple, stable & fast toolchain but the frontend
    world frequently fails to deliver on this front.


    Many websites do not need to be an [SPA](). **HTML and CSS are fantastic ways
    of delivering content** and you can use Go to make a website to deliver HTML.


    If you wish to still have some dynamic elements, you can still sprinkle in some
    client side JavaScript, or you may even want to try experimenting with [Hotwire]()
    which allows you to deliver a dynamic experience with a server-side approach.


    You can generate your HTML in Go with elaborate usage of [`fmt.Fprintf` ](), but
    in this chapter you''ll learn that Go''s standard library has some tools to generate
    HTML in a simpler and more maintainable way. You''ll also learn more effective
    ways of testing this kind of code that you may not have run in to before.


