- pgno: 47
  md: "Writing benchmarks in Go is another first-class feature of the language and\
    \ it is very similar to writing tests.\n\n```\nfunc BenchmarkRepeat(b *testing.B)\
    \ {\n    for i := 0; i < b.N; i++ {\n        Repeat(\"a\")\n    }\n}\n```\n\n\
    You'll see the code is very similar to a test.\n\nThe `testing.B` gives you access\
    \ to the cryptically named `b.N`.\n\nWhen the benchmark code is executed, it runs\
    \ `b.N` times and measures how long it takes.\n\nThe amount of times the code\
    \ is run shouldn't matter to you, the framework will determine what is a \"good\"\
    \ value for that to let you have some decent results.\n\nTo run the benchmarks\
    \ do `go test -bench=.`. (or if you're in Windows Powershell `go test -bench=\"\
    .\"`)\n\n```\ngoos: darwin\ngoarch: amd64\npkg: github.com/quii/learn-go-with-tests/for/v4\n\
    10000000        136 ns/op\nPASS\n```\n\nWhat `136 ns/op` means is our function\
    \ takes on average 136 nanoseconds to run (on my computer). Which is pretty ok!\
    \ To test this it ran it 10000000 times.\n\n*NOTE* by default Benchmarks are run\
