    Expected to find the second hand %v, in the SVG\n    }\n}\n```\n```\n\nBut is\
    \ this really an improvement?\n\nNot only will it still pass if I don't produce\
    \ a valid SVG (as it's only testing that a string appears in the output), but\
    \ it will also fail if I make the smallest, unimportant change to that string\
    \ - if I add an extra space between the attributes, for instance.\n\nThe biggest\
    \ smell is that I'm testing a data structure - XML - by looking at its representation\
    \ as a series of characters - as a string. This is never, ever a good idea as\
    \ it produces problems just like the ones I outline above: a test that's both\
    \ too fragile and not sensitive enough. A test that's testing the wrong thing!\n\
    \nSo the only solution is to test the output as XML. And to do that we'll need\
    \ to parse it.\n\n# Parsing XML"
