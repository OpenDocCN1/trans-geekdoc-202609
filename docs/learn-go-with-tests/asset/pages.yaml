    It''s easy to dunk on AbstractSingletonProxyFactoryBean but let''s not pretend
    a code base with no abstraction at all isn''t also bad. It''s your job to *gather*
    related concepts when appropriate, so your system is easier to understand and
    change; rather than being a collection of disparate functions and types with a
    lack of clarity.


    # Make it work, make it right, make it fast


    People run in to problems with generics when they''re abstracting too quickly
    without enough information to make good design decisions.


    The TDD cycle of red, green, refactor means that you have more guidance as to
    what code you *actually need* to deliver your behaviour, **rather than imagining
    abstractions up front**; but you still need to be careful.


    There''s no hard and fast rules here but resist making things generic until you
    can see that you have a useful generalisation. When we created the various `Stack`
    implementations we importantly started'
