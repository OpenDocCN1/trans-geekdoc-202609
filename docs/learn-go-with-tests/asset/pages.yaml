  md: "# Error types\n\n[You can find all the code here]\n\nCreating your own types\
    \ for errors can be an elegant way of tidying up your code, making your code easier\
    \ to use and test.\n\nPedro on the Gopher Slack asks\n\nIf I’m creating an error\
    \ like fmt.Errorf(\"%s must be foo, got %s\", bar, baz), is there a way to test\
    \ equality without comparing the string value?\n\nLet's make up a function to\
    \ help explore this idea.\n\n```\n// DumbGetter will get the string body of url\
    \ if it gets a 200\nfunc DumbGetter(url string) (string, error) {\n    res, err\
    \ := http.Get(url)\n\n    if err != nil {\n        return \"\", fmt.Errorf(\"\
    problem fetching from %s, %v\", ur\n    }\n\n    if res.StatusCode != http.StatusOK\
    \ {\n        return \"\", fmt.Errorf(\"did not get 200 from %s, got %d\",\n  \
    \  }\n\n    defer res.Body.Close()\n    body, _ := ioutil.ReadAll(res.Body) //\
    \ ignoring err for brev\n\n    return string(body), nil\n}\n```\n\nIt's not uncommon\
    \ to write a function that might fail for different reasons and we want to make\
    \ sure we handle each scenario correctly."
  merge: -1
