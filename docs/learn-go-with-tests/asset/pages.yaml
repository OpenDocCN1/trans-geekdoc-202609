  md: "# Context-aware readers\n\n[You can find all the code here](#)\n\nThis chapter\
    \ demonstrates how to test-drive a context aware `io.Reader` as written by Mat\
    \ Ryer and David Hernandez in [The Pace Dev Blog](#).\n\n# Context aware reader?\n\
    \nFirst of all, a quick primer on `io.Reader`.\n\nIf you've read other chapters\
    \ in this book you will have ran into `io.Reader` when we've opened files, encoded\
    \ JSON and various other common tasks. It's a simple abstraction over reading\
    \ data from *something*\n\n```\n```go\ntype Reader interface {\n    Read(p []byte)\
    \ (n int, err error)\n}\n```\n```\n\nBy using `io.Reader` you can gain a lot of\
    \ re-use from the standard library, it's a very commonly used abstraction (along\
    \ with its counterpart `io.Writer`)\n\n# Context aware?\n\n[In a previous chapter](#)\
    \ we discussed how we can use `context` to provide cancellation. This is especially\
    \ useful if you're performing tasks which may be computationally expensive and\
    \ you want to be able to stop them.\n\nWhen you're using an `io.Reader` you have\
    \ no guarantees over speed, it could take 1 nanosecond or hundreds of hours. You\
    \ might"
  merge: -1
  img_proc: true
- pgno: 606
  md: "find it useful to be able to cancel these kind of tasks in your own application\
    \ and that's what Mat and David wrote about.\n\nThey combined two simple abstractions\
    \ (context.Context and io.Reader) to solve this problem.\n\nLet's try and TDD\
    \ some functionality so that we can wrap an io.Reader so it can be cancelled.\n\
    \nTesting this poses an interesting challenge. Normally when using an io.Reader\
    \ you're usually supplying it to some other function and you don't really concern\
    \ yourself with the details; such as json.NewDecoder or ioutil.ReadAll.\n\nWhat\
    \ we want to demonstrate is something like\n\nGiven an io.Reader with \"ABCDEF\"\
    , when I send a cancel signal half-way through I when I try to continue to read\
    \ I get nothing else so all I get is \"ABC\"\n\nLet's look at the interface again.\n\
    \n```\ntype Reader interface {\n    Read(p []byte) (n int, err error)\n}\n```\n\
    \nThe Reader's Read method will read the contents it has into a []byte that we\
    \ supply.\n\nSo rather than reading everything, we could:\n\n+   - Supply a fixed-size\
    \ byte array that doesnt fit all the contents\n+   - Send a cancel signal\n+ \
    \  - Try and read again and this should return an error with 0 bytes read\n\n\
    For now, let's just write a \"happy path\" test where there is no cancellation,\
    \ just so we can get familiar with the problem without having to write any production\
    \ code yet."
  merge: -1
  img_proc: true
