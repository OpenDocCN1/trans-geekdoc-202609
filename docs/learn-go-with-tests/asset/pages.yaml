  md: "The \\n escape character prints a new line after outputting the memory address.\
    \ We get the pointer (memory address) of something by placing an & character at\
    \ the beginning of the symbol.\n\n# Now re-run the test\n\n```\naddress of balance\
    \ in Deposit is 0xc420012268\naddress of balance in test is 0xc420012260\n```\n\
    \nYou can see that the addresses of the two balances are different. So when we\
    \ change the value of the balance inside the code, we are working on a copy of\
    \ what came from the test. Therefore the balance in the test is unchanged.\n\n\
    We can fix this with *pointers*. Pointers let us *point* to some values and then\
    \ let us change them. So rather than taking a copy of the whole Wallet, we instead\
    \ take a pointer to that wallet so that we can change the original values within\
    \ it.\n\n```\nfunc (w *Wallet) Deposit(amount int) {\n    w.balance += amount\n\
    }\n```\n\n```\nfunc (w *Wallet) Balance() int {\n    return w.balance\n}\n```\n\
    \nThe difference is the receiver type is `*Wallet` rather than `Wallet` which\
    \ you can read as \"a pointer to a wallet\".\n\nTry and re-run the tests and they\
    \ should pass.\n\nNow you might wonder, why did they pass? We didn't dereference\
    \ the pointer in the function, like so:\n\n```\nfunc (w *Wallet) Balance() int\
    \ {\n    return (*w).balance\n}\n```"
