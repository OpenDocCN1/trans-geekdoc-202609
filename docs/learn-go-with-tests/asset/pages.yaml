  md: "`encoding/xml` is the Go package that can handle all things to do with simple\
    \ XML parsing.\n\nThe function `xml.Unmarshal` takes a `[]byte` of XML data, and\
    \ a pointer to a struct for it to get unmarshalled in to.\n\nSo we'll need a struct\
    \ to unmarshal our XML into. We could spend some time working out what the correct\
    \ names for all of the nodes and attributes, and how to write the correct structure\
    \ but, happily, someone has written `zek` a program that will automate all of\
    \ that hard work for us. Even better, there's an online version at https://www.onlinetool.io/xmltogo/.\
    \ Just paste the SVG from the top of the file into one box and - bam - out pops:\n\
    \n```\n```go\ntype Svg struct {\n    XMLName xml.Name `xml:\"svg\"`\n    Text\
    \    string   `xml:\",chardata\"`\n    Xmlns   string   `xml:\"xmlns,attr\"`\n\
    \    Width   string   `xml:\"width,attr\"`\n    Height  string   `xml:\"height,attr\"\
    `\n    ViewBox string   `xml:\"viewBox,attr\"`\n    Version string   `xml:\"version,attr\"\
    `\n    Circle  struct {\n        Text  string `xml:\",chardata\"`\n        Cx\
    \    string `xml:\"cx,attr\"`\n        Cy    string `xml:\"cy,attr\"`\n      \
    \  R     string `xml:\"r,attr\"`\n        Style string `xml:\"style,attr\"`\n\
    \    } `xml:\"circle\"`\n    Line []struct {\n        Text  string `xml:\",chardata\"\
    `\n        X1    string `xml:\"x1,attr\"`\n        Y1    string `xml:\"y1,attr\"\
    `\n        X2    string `xml:\"x2,attr\"`\n        Y2    string `xml:\"y2,attr\"\
    `\n        Style string `xml:\"style,attr\"`\n    } `xml:\"line\"`\n}\n```\n```\n\
    \nWe could make adjustments to this if we needed to (like changing the name of\
    \ the struct to `svg`) but it's definitely good enough to start us"
