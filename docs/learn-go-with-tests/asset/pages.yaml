  md: "Just running this very simple property has exposed a flaw in our implementation.\
    \ We used int as our input but:\n\n+   - You can't do negative numbers with Roman\
    \ Numerals\n+   - Given our rule of a max of 3 consecutive symbols we can't represent\
    \ a value greater than 3999 (well, kinda) and int has a much higher maximum value\
    \ than 3999.\n\nThis is great! We've been forced to think more deeply about our\
    \ domain which is a real strength of property based tests.\n\nClearly int is not\
    \ a great type. What if we tried something a little more appropriate?\n\n# uint16\n\
    \nGo has types for unsigned integers, which means they cannot be negative; so\
    \ that rules out one class of bug in our code immediately. By adding 16, it means\
    \ it is a 16 bit integer which can store a max of 65535, which is still too big\
    \ but gets us closer to what we need.\n\nTry updating the code to use uint16 rather\
    \ than int. I updated assertion in the test to give a bit more visibility.\n\n\
    ```\nassertion := func(arabic uint16) bool {\n    if arabic > 3999 {\n       \
    \ return true\n    }\n    t.Log(\"testing\", arabic)\n    roman := ConvertToRoman(arabic)\n\
    \    fromRoman := ConvertToArabic(roman)\n    return fromRoman == arabic\n}\n\
    ```\n\nIf you run the test they now actually run and you can see what is being\
    \ tested. You can run multiple times to see our code stands up well to the various\
    \ values! This gives me a lot of confidence that our code is working how we want."
