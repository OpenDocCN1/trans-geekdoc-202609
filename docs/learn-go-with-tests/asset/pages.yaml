    \    }\n}\n```\n\n# Wrapping up\n\n# Pointers\n\n+   - Go copies values when you\
    \ pass them to functions/methods, so if you're writing a function that needs to\
    \ mutate state you'll need it to take a pointer to the thing you want to change.\n\
    +   - The fact that Go takes a copy of values is useful a lot of the time but\
    \ sometimes you won't want your system to make a copy of something, in which case\
    \ you need to pass a reference. Examples include referencing very large data structures\
    \ or things where only one instance is necessary (like database connection pools).\n\
    \n# nil\n\n+   - Pointers can be nil\n+   - When a function returns a pointer\
    \ to something, you need to make sure you check if it's nil or you might raise\
    \ a runtime exception - the compiler won't help you here.\n+   - Useful for when\
    \ you want to describe a value that could be missing\n\n# Errors\n\n+   - Errors\
    \ are the way to signify failure when calling a function/method."
