    GRU 是 `RNN` 的较新版本。与长短期记忆 (`LSTM`) 单元不同，`GRUs` 不包含单元状态。`GRU` 利用其隐藏状态来传输信息。它仅包含
    2 个门（更新门和重置门）。由于张量操作较少，`GRUs` 比 `LSTM` 运行更快。`更新门` 是输入门和遗忘门的组合。`遗忘门` 选择将哪些数据添加到内存中，以及忽略哪些数据。`重置门`
    为了消除梯度爆炸而重置过去的数据。`重置门` 估计需要遗忘的过去数据量。`更新门`和`重置门`的方程分别在公式 (21) 和 (22) 中表示。


    (21)

    `r[t] = sigma(x[t]W[r]+h[t-1]U[r])`


    (22)

    `u[t] = sigma(x[t]W[u]+h[t-1]U[u])`


    其中，`sigma` 是应用于门的激活函数，`x[t]` 是输入数据，`h[t–1]` 是隐藏状态数据，`W[r]` 和 `U[r]` 是传递给重置门的权重，`W[u]`
    和 `U[u]` 是传递给更新门的权重。


    `GRU` 使用反向传播算法进行训练，将提取的特征作为输入并将 `ASO` 解集作为权重。这项工作考虑了数据集的 80%用于训练，20% 的数据用于测试。模型的训练使用训练特征和相应的标签进行。考虑的标签有：正常（Normal）、轻度感染的
    `COVID-19`、中度感染的 `COVID-19`、重度感染的 `COVID-19`。测试阶段通过测试输入进行以评估性能。


    # 5. 结果与讨论


    本论文的这部分介绍了具有不同特征向量的不同分类器的分类结果和性能。这些模型的仿真是在 `MATLAB R2020a` 平台上进行的，配置为 `Windows
    10 Pro` 版操作系统、`Intel Core i3` 处理器和 `8 GB RAM`。从仿真获得的结果将在接下来的子章节中展示并讨论。


    针对不同模型的分类器进行了实验，例如传统的 `CNN`、传统的 `RNN` 以及所提的 `ASO-GRU-NN`。这些模型使用不同的特征向量进行训练，如 `F1`（统计特征向量）、`F2`（GLCM
    纹理特征向量）、`F3`（形状特征向量）以及组合的 `F1 + F2 + F3` 特征向量。模型比较的性能指标包括准确率、错误率、敏感性、特异性和执行时间。


    分类准确率是指正确预测的数量占所有预测总数的比例。这如公式 (23) 所示：


    (23)

    $$~Accuracy = \frac{T_{P} + T_{N}}{T_{P} + T_{N} + F_{P} + F_{N}}$$ $$


    其中，

    `T_P` 是真阳性，`T_N` 是真阴性，`F_P` 是假阳性，`F_N` 是假阴性。错误率是指错误预测总数与观测总数的比例。这可以用公式 (24) 中的准确率来表示。


    (24)

    `Error rate = 1 - accuracy`


    敏感性定义为 `COVID-19` 类预测的总数与正确的 `COVID-19` 类预测和正常类预测之和的比。可以使用公式 (25) 计算敏感性。


    (25)

    $$~Sensitivity = \frac{TP}{TP + FN}$$ $$


    特异性定义为正确负类预测的总数与正确负类预测和错误的正类预测之和的比。特异性可以使用公式 (26) 计算。


    (26)

    $$~Specificity = \frac{TN}{TN + FP}$$ $$总执行时间（以秒为单位）是从给出图像到获得分类结果所需的时间。本研究评估了不同特征集的影响，所获得的性能测量值如表
    4.1–4.4 所示。表 4.1 显示了统计特征集的分类结果。结果发现所提的 `ASO-GRU-NN` 产生了最佳结果，显示出 0.5 的准确率、0.5 的错误率、1
    的敏感性和 61.23s 的总执行时间。然而，在特异性方面，`CNN` 模型显示了 1 的最佳得分。


