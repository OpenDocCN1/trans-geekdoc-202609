    **Abstract** In order to improve pictorial information for human understanding
    and to process picture data for transmission, storage, and retrieval of meaningful
    information, the intriguing and inspiring discipline of Image Processing was developed.
    Raw data from cameras and sensors, such as those used in everyday life, can be
    processed using a method called “image processing.” In order to do image analysis,
    it is necessary to analyse the images and divide them into meaningful segments,
    a process known as image segmentation. Anatomical and physiological structures
    of the human body can be studied with the aid of medical picture segmentation.
    Multiple high-resolution photographs of the human brain are created using cuttingedge
    technology, allowing researchers to track its development and spot a wide range
    of disorders. Brain cancer is the most common malignant disease to strike children
    and young people. This study will aid the public in determining whether or not
    a brain tumour is present in an MRI of the brain. Other researchers’ ground-breaking
    efforts have served as inspiration for this investigation. As a result, their
    work has been a major inspiration for this study. In addition, I want to get involved
    in the medical domain by learning about and eventually analysing brain tumours.


    **Keywords** Data transmission, Tumor, Processing, MRI, Image segmentation


    ## 1\. Introduction


    Many scientists in the field of medicine are using cutting-edge methods for disease
    forecasting. These methods have consistently helped medical professionals with
    diagnosis, prevention, and therapy preparation. Studying how to diagnose brain
    tumours from brain MRI scans using Image Processing techniques is one of the most
    prominent and challenging areas of study now underway. However, people of all
    ages are among the brain tumor’s many victims. Human lives can be saved with early
    detection or prediction of brain tumours. Brain tumours are among the most lethal
    disorders a person may have, say doctors and scientists in the field of medicine.
    Researchers are therefore driven to find ways to detect and anticipate tumours
    in the area of the brain where they are most likely to arise, based on the earliest
    symptoms, and to determine the specific type of tumour using MRI scans of the
    brain. One of the most in-demand areas of medicine, this work investigates the
    use of picture segmentation techniques to detect brain tumours. However, there
    is no correlation between age and the prevalence of brain tumours of all sorts.
    While some of these tumours are surgically treatable benign variants, others are
    malignant and can eventually cause brain cancer.


    ## 2\. Literature Review


    Ingenious image processing involves digitising an image and running it through
    a series of mathematical operations in order to either improve it or extract relevant
    data from it. There are two main categories of IP: the first deals with enhancing
    the appearance of images for human viewing, and the second measures various aspects
    and structures inside those images. Depending on the body part, diagnostic task,
    viewing preferences, and so on, a digital image can be customised for applications
    by segmenting or modifying the look of structures within it. Radiologists will
    benefit from computerised image analysis since it allows them to quickly and accurately
    locate questionable areas in an image and provide an accurate diagnosis. In this
    section, we’ll talk about the research that has been done on image processing
    techniques, classification algorithms, and diagnosing brain tumours. Moreover,
    it provides a comprehensive analysis of the preprocessing methods and picture
    segmentation algorithms employed by various researchers. Information from the
    survey was also cited in pieces discussing a variety of brain disorders and tumours.
    Algorithms for segmenting data, classifying it, and clustering it have all found
    applications in the field of medicine. Super pixelbased brain tumours segmentation
    using RF and SVM classifiers was evaluated and found to favour RF in terms of
    accuracy. Combining C-MRI with DTI, as reported in \[[1](#ch5.xhtml#ref5_1)\],
    and feeding the data to support vector machines (SVM) allowed researchers to identify
    distinct types of tumour tissue \[[2](#ch5.xhtml#ref5_2)\]. An advantage of the
    super pixel based method, as suggested by \[[3](#ch5.xhtml#ref5_3)\], is that
    it greatly reduces the amount of computing needed for classification in the new
    feature space.


