    \n**Abstract** Watermelon is a valuable fruit with a long storage period, and\
    \ its ripeness is crucial for its taste, quality, and preservation. Traditional\
    \ methods of assessing ripeness are time-consuming and prone to errors. This study\
    \ used CNN models to categorise watermelon ripeness into unripe, ripe, and overripe,\
    \ using Jupyter and several libraries. The MobileNetV2 network performed the best,\
    \ with an accuracy rate of 95.97%.\n\n**Keywords:** CNN-Convolutional neural network,\
    \ Watermelon, MobileNetV2\n\n## 1\\. Introduction\n\nThe watermelon is a huge\
    \ fruit with a maximum diameter of 25 cm and a maximum weight of 15 kg. Its form\
    \ is oval or spherical, and its smooth, dark-green rind occasionally sports errant\
    \ pale-green patches. It has high water content and little protein or fat, making\
    \ it low in calories. People have difficulty determining ripeness with their naked\
    \ eyes and even by touching. Convolutional neural networks (CNN) are a popular\
    \ method for doing this because of their exceptional effectiveness in extracting\
    \ useful information from raw images without the need for humans. This study concentrated\
    \ on using deep learning to capture images of watermelon fruit and analyse them\
    \ in order to detect its ripeness stages using non-destructive testing techniques.\n\
    \n## 2\\. Literature Review\n\n\\[Yinghao [Zhang et al., 2018](#ch16.xhtml#ref16_1)\\\
    ] comparison of ELM and SVM is performed in relation to the classification results,\
    \ and an accuracy of 92% is achieved. \\[DengfeiJie et al., 2019\\] used VIS/NIR\
    \ transmittance technology and created a spectral characteristic analysis classification\
    \ technique using the ratio of peak1 to peak2 intensity (RPP) and the normalised\
    \ difference intensity of peak (NDIP) approaches to identify the mature phases\
    \ of watermelon.\n\n\\[Edwin R. Arboleda, et al., 2020\\] employed near-infrared\
    \ spectroscopy (NIRS) to determine the ripeness level of watermelon. \\[Ketsarin\
    \ et al., 2021\\] Proposed a non-destructive method that uses auditory signals,\
    \ image processing, weight, rind designs, sound signals, and ML techniques to\
    \ detect watermelon sweetness and achieved an accuracy of 92%.\n\n\\[Anthony B.\
    \ Villa, et al., 2022\\]studied the technology of using an Android-Based Application\
    \ on Watermelon Fruit Recognition using a deep learning CNN model to classify\
    \ a watermelon’s ripeness.\n\n## 3\\. Data and Variables\n\nDatasets were created\
    \ by capturing images using an Android phone’s camera at a vertical distance of\
    \ around 40 to 50 cm from the top of the sample. The top, bottom, and lying sides\
    \ were all taken into consideration as datasets. 300 images used in this study\
    \ were split into (100 for unripe, 100 for ripe, and 100 for overripe) which can\
    \ be seen in watermelon from various angles. 80% of the image dataset was used\
    \ to train the model, while 20% was used to test it.\n\n## 4\\. Proposed Methodology\n\
    \nIn order to categorise the watermelon’s ripeness using the non-destructive method,\
    \ CNN is used. By comparing and analysing CNN models that provide high accuracy,\
    \ low loss, and less compilation time among various models, the best model for\
    \ watermelon ripeness detection is chosen.\n\n![Fig. 16.1 Block diagram](images/fig16_1_B.jpg)\n\
    \nFig. 16.1 Block diagram\n\nBefore using the image dataset for training, the\
    \ background of each was manually removed using an online background removal tool,\
    \ and the resulting image was given as the input to the CNN. For training, the\
    \ image datasets are reduced in size to 224 by 224 pixels.\n\nConvolutional neural\
    \ networks (CNNs) employ the data augmentation approach to artificially increase\
    \ the size of a training dataset. This helps to improve the generalisation of\
    \ the model and avoid overfitting. [Figure 16.2](#ch16.xhtml#fig16_2) shows the\
    \ data augmentation techniques. The Keras deep learning library offers data augmentation\
    \ to train a model with the ImageDataGenerator class.\n\n![Fig. 16.2 Data augmentation\
    \ techniques](images/fig16_2_C.jpg)\n\n[Fig. 16.2 Data augmentation techniques](#ch16.xhtml#R_fig16_2)\n\
    \nThe four types of CNN models, such as AlexNet, ResNet50, VGG19, MobileNetV2,\
    \ and DenseNet121, have been studied. Deeper layers of a CNN detect more complicated\
    \ features such as textures and patterns, while early layers often only detect\
    \ simple features like edges and corners. [Figure 16.3](#ch16.xhtml#fig16_3) shows\
    \ the ripeness stages of watermelon. Based on the classification, it would predict\
    \ the ripeness stages of watermelon.\n\n ![Fig. 16.3 Ripeness stages of watermelon](images/fig16_3_C.jpg)\n\
    \n[Fig. 16.3 Ripeness stages of watermelon](#ch16.xhtml#R_fig16_3)\n\n## 5\\.\
    \ Results and Discussion\n\nThe performance of the deep learning model used for\
    \ classifying watermelon ripeness was evaluated using training accuracy, validation\
    \ accuracy, training loss, validation loss, and compilation time at each epoch.\
    \ There were 20 epochs in total for each experiment. In [Fig. 16.4,](#ch16.xhtml#fig16_4)\
    \ the training and validation accuracy, testing and validation loss, for each\
    \ experimental run, are represented graphically, and [Table 16.1](#ch16.xhtml#tab16_1)\
    \ shows the compilation time for different CNN.\n\n![Fig. 16.4 Comparison of accuracy\
    \ (a) and Loss (b)](images/fig16_4_C.jpg)\n\n[Fig. 16.4 Comparison of accuracy\
