    # 9 Cognitive Based Learning in Feed Forward MLP for Classification of Neurodegenerative
    Disorders


    B. Mahalakshmi^([^(17)](#fn17))


    Research Scholar, Department of Computer Science, Vels Institute of Science, Technology
    & Advanced Studies (VISTAS)


    A. Thirumurthi Raja^([^(18)](#fn18))


    Research Supervisor & Assistant Professor, Department of Computer Science, Vels
    Institute of Science, Technology & Advanced Studies (VISTAS)


    DOI: [10.1201/9781003428466-9](https://dx.doi.org/10.1201/9781003428466-9)


    **Abstract:** Neurodegenerative illnesses are global epidemics that disrupt the
    lives of millions of people in every part of the world. These disorders are known
    as neurodegenerative diseases. There is currently no medicine that has been proved
    to be capable the progression of the disease itself. In this paper, we develop
    a cognitive based learning in Feed forward MLP (Multi- Layer Perceptron) for classification
    of neurodegenerative disorders. The dataset is split into training and test data,
    where the FFMLP model is trained using the pre-processed datasets. Then the trained
    MLP model is tested using the test dataset and finally the classified instances
    are depicted. The simulation is conducted to test the efficacy of the FFMLP model
    over various input images. The results of simulation show that the proposed method
    achieves higher accuracy, precision, recall and f-measure than existing methods.


    **Keywords** Cognitive, Feed forward multi-layer perceptron, Classification, Neurodegenerative
    disorders


