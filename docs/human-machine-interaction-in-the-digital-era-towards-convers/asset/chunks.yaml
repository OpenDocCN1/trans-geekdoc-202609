    在剪枝过程中，会对神经节点的输入层或隐藏层进行删除。结果是 `ANN` 运行速度更快，因为需要执行的计算更少。在[5]中，作者通过使用前馈 `ANN` 尝试解决过拟合、内存过度等等问题。了一种双层神经网络拓扑结构。特别是建议了一种基于神经元配置的双层神经网络。使用了一个训练函数和相应的数据集来解决上述问题。根据作者的，尽管该方法的计算成本较低，但产生的结果与传统方法相当。使用了
    `KDD’99` 数据集并进行了测试。根据论文的发现，数据越少越好，因为机器处理数据需要更多时间。使用基准 `KDD’99` 数据集对该方法进行了检验。在[6]中，根据论文的结论，测试数据应该较少，因为机器处理时间更长。在[7]中，在数据发送进行训练和测试之前，使用主成分分析
    `Principal component analysis` 作为特征提取器。正如论文所示，这显著减少了该方法的内存需求和所需的训练时间。在准确性方面，两种评估方法产生了相当的结果。这使得使用
    `PCA` 成为显而优的选择。[8]的作者比较了三种高效算法——支持向量机 `Support Vector Machine`、朴素贝叶斯 `Naive Bayes`
    和 `C4.5` 算法与使用单隐藏层实现的神经网络。三层网络框架的简单配置允许网络在利用更少计算的情况下，执行与其他检查技术相当或更高的恶意软件检测。测试是使用
    `NSL-KDD` 数据集进行的，它是最新的 `KDD’99` 替代者。


    [9]的作者希望通过解决大维度问题来发现一种解决方案。为了实现这一点，他们结合了两种网络：深度置信网络 (`DBN`) 和特征加权支持向量机 (`SVM`)
    (`WSVM`)。使用一种名为可变学习率的特征提取器对机器进行训练。然后将特征输入到针对粒子群优化的 `WSVN` 中。该解决方案在 `NSL-KDD` 上进行了测试，其二分类准确率达到
    85.73%。


    ## 3. 提议系统


    人工神经网络 (`ANN`) 工具具有多种应用。自然语言处理、生物识别、多项式根的计算以及攻击检测[10]是该方法涵盖的各个领域。


    使用神经元的网络吸收了人类大脑中典型的自然神经网络的学习能力，同时非常有效。在每一层都有神经元的神经网络包含输入层、隐藏层和输出层。数据通过第一层（输入层）进入网络，由不同的神经元连接，在隐藏层内部进行精炼，然后可以在最后一层（输出层）中进行检索。底图显示了一个包含所有三层的普通神经网络模型：


    此类配置的网络中的一个神经元可以接受任意数量的输入 `n`，每个输入都有分配的权重。“x0”指的是偏置值，它被加到输入（激活函数的输入）中。如果输入 `X[i]`
    是神经元的输入，`W[i]` 是权重，`b` 是偏置，其输出由方程 (1) 决定。


    (1)


    $$a = f(\sum\\limits\_{t = 0}^{n}wixi + b)$$


    其中 `f` 是用于获取该层输出并将输出发送到下一个连续连续的函数[6]。机器学习中的学习模式有两个大类：无监督学习和监督学习。在监督技术中，第一阶段对输出进行标记，网络知道什么应该作为响应。在无监督学习中，使用神经元的网络检查模式并提取出与输入属性相关的特征。结果是数据较少，因为
    `ML` 算法需要训练和测试数据。


    `ANN` 识别模式的建模过程得益于在适应新输入方面的非凡灵活性。在处理实时数据时，这种巨大的近似能力极其重要，因为那里有更多信息，但隐藏的模式尚未被识别。生成的配置结果可能会受到优化程度的显著影响。通过逐渐增大的数据集调整权重，`ANN`
    能够学习。学习算法能够识别变量之间的连接，并进行泛化，使其能够成功应用于新的、不可预见的数据。在大多数情况下，它工作方式与拟合集合直线或平面的方式相同。`ANN`
    在模式识别中令人惊讶的建模能力源于其在适应新输入方面的卓越可塑性。生成的配置结果可能会受到优化程度的显著影响。该算法能够识别变量之间的连接并进行泛化，使其能够成功应用于新的、不可预见的数据[11]。从实践上来说，它等同于用集合拟直线[12]。一种称为
    `perceptron` 的 `ANN` 只有一个处理层以及输入、输出计算层。数据被输入输入层，然后传输到计算层。输出神经元根据输入层中的 `dnodes`
    计算 `W X 14 Pdi141wixi)`，这些节点代表由 `X 14 12x1... xd` 表示的 `d` 特征以及由 `W 14 12w1...
    wd` 表示的权重边。使用 `perceptron` 时，使用二值进行预测。引入偏置有助于处理不均匀分布。`y` 的预测获取如下：


    (2)


    $$y = sign\\left\\{ W \\cdot X + b) = sign\\left\\lbrack {\\sum\\limits\_{i =
    1}^{d}wixi + b} \\right\\rbrack \\right.$$


    方程中的 sign 由激活函数 `Uv` 表示。在结合了许多隐藏层的神经网络中可以应用不同的激活函数。为了在多层网络中进行有效训练，修正线性单元 (`ReLU`)
    被广泛利用。回归误差表示为用于测试的实际值与预测值之间的差异。如果发现的误差大于零，则需要更改权重。`perceptron` 的目标是预测数据集 `D` 中每个点
    `y` 的最小二差。该目标通过以下函数提到：


    (3)


    $$\sum\\limits\_{(X,y)}(y - sign\\left\\{ w \\cdot X \\right\\}$$


    该函数在整个数据集 `X` 中指定，学习率随权重更新，然后在算法的每次迭代中都使用整个数据集，直到收敛。该算法也称为随机梯度下降，表达式如下：


    (4)


    *W* = *W* + *α**E*(*X*)*X*


