    Neurodegenerative disorders are a global epidemic that impacts the lives of millions
    of people in every region of the world. Neurodegenerative diseases are those that
    reveal themselves whenever neurons in the brain gradually lose their function
    and eventually die. These diseases are known as neurodegenerative diseases. There
    is currently no medication that has been shown to be capable of arresting the
    progression of the disease itself [[1](#ch9.xhtml#ref9_1), [2](#ch9.xhtml#ref9_2),
    [3](#ch9.xhtml#ref9_3), [4](#ch9.xhtml#ref9_4) and [5](#ch9.xhtml#ref9_5)]. This
    is because there is no cure for the sickness. On the other hand, there is a possibility
    that there are methods that can help reduce some of the mental or physical anguish
    that is caused by neurodegenerative conditions. There is a wide variety of neurodegenerative
    illnesses, and each one is placed into a distinct category based on the area of
    the brain that is impacted by the death of nerve cells and the symptoms that is
    brought on by the condition [[6](#ch9.xhtml#ref9_6)].


    In addition, if a correct evaluation of the severity of the patient disease is
    performed, the right drug can be given to the patient at the right time. Disagreements
    between a patient report and a physician assessment have the potential to cloud
    the true gravity of a disease prognosis. This is because both parties are biased
    in their perspectives [[11](#ch9.xhtml#ref9_11), [12](#ch9.xhtml#ref9_12), [13](#ch9.xhtml#ref9_13),
    [14](#ch9.xhtml#ref9_14) and [15](#ch9.xhtml#ref9_15)]$. At this point in time,
    a system supported by AI and which depends solely on gait data has the potential
    to deliver a more objective assessment at a lesser cost than the approaches that
    are now being used.


    In order to classify neurodegenerative diseases into appropriate categories, we
    have integrated into Feed forward MLP a learning technique that is cognitively
    based (Multi-Layer Perceptron). First thing that we do when we want to train the
    `FFMLP` model is take the dataset and divide it into the training set and the
    test set. After that, we put the training set to use. After the trained `MLP`
    model has been evaluated on the test dataset, the examples that have been detected
    are shown to the user.


    ## 2. Literature Review


    One of the contributions made by Sadeeh et al. [[16](#ch9.xhtml#ref9_16)] was
    the demonstration of a sensor prototype for fall detection and prediction. In
    the event that a fall is anticipated, the patient would be warned to take measures,
    and the device would alert medical care in the event that a fall really takes
    place. Clouds have the ability to notify medical staff when an elderly patient
    has fallen, allowing the team to immediately assist the patient.


    Researchers Du et al. [[17](#ch9.xhtml#ref9_17)] used longitudinal support vector
    regression (`SVR`) to determine whether or not demographic parameters may correctly
    predict the severity of ALS. They propose employing an innovative approach to
    machine learning in order to accomplish the task of collecting longitudinal data.
    In order to keep track of the participant behaviour throughout the length of the
    study, this technique calculates new weighted parameters at a variety of intervals
    throughout the research process. These include the characteristics of the `SVR`
    hyper plane as well as the parameters of the trend in time over a given period
    of time. Because of this, they were inspired to develop `LSVR`, which combines
    longitudinal modelling with the paradigms of machine learning, in order to satisfy
    a demand that was obvious in the business. In doing so, `LSVR` was able to mix
    longitudinal modelling with the paradigms of machine learning.


    The mono triaxial accelerometer sensor that was developed by Sadeeh et al. [18]
    is a device that is worn on the thigh and is utilized to both anticipate and recognize
    instances of people falling. After that, the information is saved so that a medical
    professional can do a comprehensive follow-up on the patient. In the event that
    the patient has a fall, a notification will be transmitted over the internet to
    the relevant medical personnel. The patient will also be informed in the event
    that a fall is anticipated.


    Benassar et al. [19] wanted to establish a system that was low-cost, objective,
    and automated for measuring the impairment of upper limb mobility caused by HD.
    They did this by utilizing techniques from machine learning and signal processing.
    This was supposed to be their end goal. They offer a method for evaluating the
    motor dysfunction of HD patients in an objective and continuous manner as the
    patients carry out a novel task involving their upper limbs. This method was developed
    by the researchers at the University of Washington. An impairment score that reflected
    the extent of mobility impairment was automatically constructed from the recorded
    accelerometer signals by applying methods from signal processing and machine learning.
    This score was derived from the obtained data. The data from the accelerometer
    were used to generate this score.


    Gaßner et al. [22] decided to perform their investigation utilizing a sensor-based
    gait analysis because they wanted to objectively define the characteristics of
    the gait in HD patients. Using mobile sensor-based gait analysis, the purpose
    of this study was to compare and contrast the gait parameters of HD patients with
    those of controls who were the same age and were of the same gender. To determine
    whether or not these objective measures had any clinical relevance, in particular,
    we investigated the correlation between gait measurements and total motor score
    (`TMS`) and total functional capacity (`FRC`). The `GRF` data that was gathered
    from these walk sensors was fed into a machine learning model that was presented
    by Aşurolu et al. [24].


    One of the services that they offered was regression analysis that was based on
    the numerical properties of the generated signal. They referred to the model that
    they used as a hybrid and gave it the name `LWRF`. Another one of the services
    that they offered was correlation between two variables (`LWRF`). In specifically,
    they provide a computational method for assessing the severity of motor symptoms
    in patients who are diagnosed with Parkinson disease (`PD`).


    ## 3. Proposed Method


    In this section, the framework illustrated in [Figure 1](#ch9.xhtml#fig9_1) shows
    how the process of training and testing is carried out to classify well the neurodegenerative
    disorders using `FFMLP`.


    ![Figure 9.1 Proposed cognitive framework](images/fig9_1.jpg)

    *Figure 9.1 Proposed cognitive framework* [1]


    ### 3.1 FFMLP


    An example of a neural network that employs the back-propagation algorithm for
    the purpose of supervised learning is the Fully-Fed Multilayer Perceptron, which
    is also sometimes referred to as `FFMLP`.


    `MLP` functions most well with a three-layer design consisting of an input layer,
    a hidden layer or levels, and an output layer. In addition to this, in this architecture,
    every neuron is connected to each and every neuron in the layer that lies below
    it. It has been argued that the `MLP` is successful when utilized in the context
    of solving non-linear issues.


    The `MLP` design can be utilized to determine the input variables, the bias values,
    and the output values, as shown by Equation (1):


    ```

    S_{i} = \sum_{i = 1}^{n}w_{ij}I_{i} + \beta_{i}

    ```


    In the multilayer perceptron, the sigmoid function, which can be obtained by solving
    Equation (2), is frequently utilized as an activation function.


    ```

    f_{j} = \frac{1}{1 + e^{- S_{j}}}

    ```


    Equation (3) may be utilized to find out what the final action of neuron *j* will
    be:


    ```

    (3)

    ```

