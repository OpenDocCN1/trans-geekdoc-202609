    所提的方法优于此前尝试实现相同目标的系统。之前的工作依赖于更简单的 2 级离散小波变换（`DWT`），但 3 级 `Median Filter` 的实现改进了对比度，并允许轻松抑制图像内的信号。图像在第
    4 层和第 5 层变得过于模糊，且分类准确率太低，因此我们确定在第 3 层。虽然我们研究了 `Chanvese` 算法和 `CNN` 在分割中的潜力，但后者的结果不尽人意。快速
    `Fuzzy C-means` 方法改进了结果，并成为科学界的一项创新工具。最后，在 `MATLAB 2021a` 中创建了一种名为 `Deep belief
    convolutional neural network`（DBCNN）的混合方法用于分类，它结合了 `CNN`（卷积神经网络）和 `DBN`（深度置信神经网络），取得了卓越的结果。


