    ## 5\. Conclusion


    The eLearning technologies play an important role in pandemic period for the teachers
    and students. This paper resolves the various approach used in learning technology
    for the user. Zoom technique most commonly used for scheduling the meeting among
    organization and students. In Kahoot technique, it mostly used among medical field
    to work on the live process of operations which invoke the gaming technology for
    the user. Organization of class in Google classroom will be user friendly, in
    single user login it allows multiple class to create and at a same time work can
    be assigned for each individual students separately. With this comparison of this
    three technology Google classroom is very user friendly among the user and easy
    to learn for the students and easy for the teachers to communicate with students.


