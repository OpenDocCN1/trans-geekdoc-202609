    的准确率为 80.18%。[3]。


    Omar Sharif, Mohammed Moshiul Hoque 等（2020）进行了使用机器学习识别 Facebook、Twitter、YouTube
    上的可疑孟加拉语短信的研究。使用带有 `python` 的 `Google colab` 平台分析短信。算法 `LR` 的准确率为 84.00%，`DT`
    的准确率为 79.57%，`RF` 的准确率为 83.71%，`MNB` 的准确率为 83.78%，`SGD` 准确率为 84.57%。[4]


    Janak Sachdeva, Kushank Kumar Chaudhary 等（2021）进行了使用深度学习在 Twitter 上寻找仇恨言论的研究。使用
    `Word2Vec` 和 `Google News Vectors` 来寻找 Twitter 上的仇恨言论。他们使用了许多算法；`LR` 的准确率为 84.8%，`RFC`
    的准确率为 84.8%，`KNN` 的准确率为 75.5%，`L-SVC` 的准确率为 83.4%，`CNN` 的准确率为 83.4%，`LSTM` 的准确率为
    84.0%。[5]。


    Bhavesh Pariyani, Krish Shah 等（2021）提出了一项使用机器学习在 Twitter 上寻找仇恨言论的研究。使用了 `python`
    中的 `Count Vector organizer`。他们使用的算法如 `SVM` 的准确率为 95.25%，`LR` 的准确率为 96.05%，`RF`
    的准确率为 96.29%。[6]


    Ilia Markov, Walter Daelemans.（2022）提出了一项使用 `python` 在 Facebook 上寻找仇恨言论的研究。使用了
    `BERT` 算法并获得了 69% 的准确率。[12]


    Jaeheon Kim 等（2022）提出了一项识别和发现 Twitch 中有毒对话用法的研究。使用了 `LSTM` 并获得了 81% 的准确率。[13]


    ## 3. 数据与变量


