    研究人员已经尝试了多种方法来分析 MRI 脑图像以寻找肿瘤。所建议的方法分为预处理和 `Segmentation`（分割）两个主要阶段。定位 MRI 脑图像、消除噪声和提高图像质量都需要使用图像处理技术。为了精确地确定位照片中的肿瘤区域和受损区域，我们使用分割方法对它们进行提取。


    ![Fig. 5.1 Architecture of proposed methodology Source: Made by Author](img/fig5_1_C.jpg)


    图 5.1 提议方法的架构 `Source:` 作者自制


    以下是所建议程序步骤的详细说明。


    * 步骤 1：使用保存为 `MATLAB` 格式的 3064 脑部 MRI 扫描进行训练系统，将其平均分为正常示例和类型 1、2、3 和 4 的病理示例。

    * 步骤 2：上传您的 MRI 脑扫描图的 `fresh.jpg`

    * 步骤 3：此图像已从其原始的 `RGB` 格式转换为灰度图。

    * 步骤 4：用于预处理的三级 `Median Filter`（中值滤波）

    * 步骤 5：通过使用中值滤波减少了这种噪声

    * 步骤 6：数据使用 `IME`（反向中值滤波）进行了预处理。第 5 部分：使用 `Fast Fuzzy C-means Algorithm`（快速模糊
    C 均值算法）分割图像

    * 步骤 7：“使用卷积神经网络（CNN`）进行特征提取”

    * 步骤 8：深度信念卷积神经网络混合算法分类。


    ### 3.1 数据集说明


    成像平面（或方向）以三种不同的方式来表征脑部 MRI 扫描：水平、垂直和横截。`axial plane`（轴状面）、`coronal plane`（冠状面）和
    `sagittal plane`（矢状面）都是医学影像领域使用的术语。根据神经外科医生的说法，矢状面对大脑左右边的描述并没有告诉我们任何关于肿瘤位置的信息。轴状面和冠状面的图像可用于精确确定肿瘤受累区域，用于治疗计划和临床诊断。任何以
    MRI 图像作为输入的算法在实施之前都需要一个转换步骤。MRI 扫描仪生成的图像为 `DICOM`（医学数字成像和通信）格式，因此在 `CAD` 程序中进行视觉处理之前需要进行转换。还从四组异常患者（类型
    1、2、3 和 4）中的每组获取了样本照片。


