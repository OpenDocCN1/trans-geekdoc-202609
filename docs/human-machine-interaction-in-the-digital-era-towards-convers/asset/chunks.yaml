    ### 4.1 交叉验证


    机器学习以及 AI 的许多其他方面面临一些独特的问题。这些问题中的过拟合问题就是其中之一。如果算法面临这些困难，它们在测试环境中可能表现优异，但在应用于实际数据时就会大失所。模型通过一个被称为
    k 折交叉验证（也称为旋转估计）的过程来帮助缓解这个问题。用于训练的数据被划分为标记为 `k` 的部分，其中 `k-1` 部分数据用于训练，最后一部分用于测试。然后执行
    `k` 次，同时更改测试部分。数据折进行随机采样，本研究应用了 10 折交叉验证。


