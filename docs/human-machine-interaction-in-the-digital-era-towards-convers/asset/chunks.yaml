    本文为 Protus 提出了一种推荐系统，该系统包含一个能够自动适应学生需求和技能水平的模块。通过评估学生的学习风格并挖掘其服务器日志，该系统可以检测出各种学习风格示例和学生的倾向。在学生初次使用学习平台的情况下，所提的推荐器模块能够理解学生当前的赋能水平，并鼓励他们学习基础级课程，同时根据学习者的表现建立个人档案。一旦学生通过最终测试完成课程，推荐框架将根据结果为学生未来可能偏好的后续课程开发一套推荐集。当学生与框架交互时，数据挖掘算法将利用有关学生学习偏好的数据来创建学生画像并进行智能推荐。这些数据的示例包括导航示例、偏好、可访问内容和书签。所提系统的流程图如图图
    15.1 所示。


    ![图 15.1 所提系统的流程图](img/fig15_1_C.jpg)


    图 15.1 所提系统的流程图


    ## 2.1 推荐过程


    随后使用向量空间模型来指示推荐的基础级课程、文章和相关材料。为了对文档上的数值函数进行相关性分析，实现了 `VSM` 以在多维视图表示适当的报告。在这里，报告被视为向量。每个项目都被表示为向量空间中的一个点，距离越近的对象被认为越相关或相关。将课程、文章或视频的显著子向量进行相互比较，并使用调整后的余弦相似度和
    TF-IDF 权重来计算可比性。以这种方式将可比较的向量空间模型纳入我们的探索中。特定记录 `d` 中相关术语 `t` 的出现频率称为词频 (`TF`)，可以写作
    `tftd`。以下是 TF 权重方程。


    (1)


    $$W\_{t,d} = \\left\{ \begin{matrix} {1 + \log\_{10}tf\_{t,d}} & {iftf\_{t,d}
    > 0} \\\\ 0 & {otherwise} \\\\ \end{matrix} \right.$$


    文档频率 (`DF`)，缩写为 `dft`，提供了包含特定短语 `t` 的记录数量。另一方面，逆文档频率 (`IDF`) 增加了低频术语的相关性，同时降低了高频术语的重要性。


    (2)


    $$idf\_{t} = \log\_{10}\left( \frac{N}{df\_{t}} \right)$$


    该方案的特定权重通过乘以 TF 和 IDF 权重确定。为了获得调整后的余弦相似度，使用了此值。


    (3)


    $$W\_{t,d} = (1 + \log tf\_{t,d}) \times \log\_{10}\left( \frac{N}{df\_{t}} \right)$$


    两个向量之间的相似性用于计算余弦相似度。系统可以用它根据相应的特征 `p` 比较两个课程。系统使用 TF-IDF 权重计算调整后的余弦相似度。余弦相似度量没有考虑到某些用户使用不同评分的情况。调整后的余弦相似度减去用户
    `u` 对其已评估的所有项的平均评分。


    (4)


    $$Adjusted\\ Cosine\\ Similarity = \frac{\\sum_{i \\in I}(r\_{u,i} - {\\overline{r}}\_{u})(r\_{v,i}
    - {\\overline{r}}\_{v})}{\\sum_{i \\in I}{(r\_{u,i} - {\\overline{r}}\_{u})}^{2}
    + \\sum_{i \\in I}{(r\_{v,i} - {\\overline{r}}\_{v})}^{2}}$$


    其中，`i` 是目标项目（材料），`u` 和 `v` 是用户。因此，系统可以通过将具有初始倾向的每个课程与相似领域的所有其他课程进行比较，利用 TF-IDF
    权重方法确定相似性索引。


    ## 3. 实验结果


    ### 3.1 查询处理时间比较


    在图 15.2 中比较了所提基于 `EVSM` 的推荐和当前基于 `VSM` 的推荐方案的查询时间。`y` 轴表示查询处理时间，`x` 轴表示学习人数。实验结果表明，新系统比现有系统产生了更好的结果。


    ![图 15.2 查询处理时间的比较](img/fig15_2_C.jpg)


    图 15.2 查询处理时间的比较


    ### 3.2 平均绝对误差 (MAE)


    所提 `EVSM` 与当前基于 `VSM` 的推荐方法之间的 `MAE` 比较如图图 15.3 所示。查询结果表明，与之前的方法相比，所提方法实现了最小的
    `MAE` 值。


    ![图 15.3 MAE 的比较](img/fig15_3_C.jpg)


    图 15.3 MAE 的比较


    ### 3.3 精确率比较


    所提基于 `EVSM` 的推荐与当前基于 `VSM` 的推荐方法的准确率性能在图 15.4 中进行了比较。实验结果表明，设计的系统比现有系统产生了更好的结果。


    ![图 15.4 MAE 的比较](img/fig15_4_C.jpg)


    图 15.4 MAE 的比较


    ## 4. 使用增强支持向量模型 (ESVM) 的电子学习推荐模型


    本研究描述了一种基于增强向量空间模型 (`EVSM`) 的在线学习系统推荐方法的创建。该策略将基于内容的过滤与协同过滤相结合，以提高定制系统的有效性。本研究提供了调整后的余弦相似度来评估学习者之间的相似性。分析结果表明，在查询处理时间、`MAE`
    和准确性方面，建议的系统优于当前的方法。得益于使用了萤火虫算法 (`FA`) 和粒子群算法 (`PSO`) 等各种优化方法，未来的推荐将更加准确


    ## 5. 参考文献


    1. Brockman, P., French, D. and Tamm, C. (2014) REIT 组织结构、机构所有权与表现。

    2. Cella, C. (2009) 机构投资者与公司投资。印第安纳大学，凯利商学院。

    3. Chuang, H. (2020) 机构所有权对股票收益的影响。经验经济学。

    4. Clark, G.L. and Wójcik, D. (2005) 德国模型的价值：所有权集中与股市收益之间的负相关，1997–2001。经济地理。

    5. Dasgupta, A., Prat, A. and Verardo, M. (2011) 机构交易持续性与长期股票收益。金融杂志。

    6. Demsetz, H. and Lehn, K. (1985) 公司所有结构：原因与结果。政治经济学。

    7. Dyakov, T. and Wipplinger, E. (2020) 机构所有权与未来股票收益：国际视角。国际金融评论。

    8. Gompers, P. A. and Metrick, A. (2001) 机构投资者与股权价格。季度经济学杂志。

    9. Han, K. C. and Suk, D. Y. (1998) 所有权结构对公司表现的影响：补充证据。金融与经济评论。

    10. Kennedy, P. (1985) 计量经济学指南，MIT 出版，剑桥。


