    neural network that is seen in brains of human beings while being extremely effective
    . There are input , hidden layers and an output layer in a neural network with
    neurons present in each layer. Through the first layer which is the input layer,
    data enters the network which are connected by different neurons, where it is
    refined inside the hidden layers before being available for retrieval in the last
    layer which is an output layer. The following diagram depicts an normal neural
    network model with all the three layers:


