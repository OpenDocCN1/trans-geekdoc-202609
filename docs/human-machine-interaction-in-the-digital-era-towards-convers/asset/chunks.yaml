    value which is called bias which is added to the input (activation functions input).
    If the inputs are `X[i]` are the neuron’s inputs, and `W[i]` is weighted, `b`
    is biased, its output is determined by the equation (1).


    (1)


    $$a = f(\sum\\limits\_{t = 0}^{n}wixi + b)$$


    where `f` is the function that is employed to obtain the output of that layer
    and then send the output to the next successive layer[[6](#ch12.xhtml#ref12_6)].
    Learning patterns in machine learning have two major categories: Unsupervised
    and supervised learning. In the supervised technique, the output is labeled as
    the first phase, and the network knows what should be accepted as a response.
    In unsupervised learning, a network that uses neurons examines the patterns and
    brings out the features related to the input properties. As a result less data
    because the `ML` algorithm needs to train and test the data.


    The `ANN`’s modeling process in recognizing the patterns is due to the remarkable
    flexibility in adapting to new input. This enormous approximation capability is
    extremely important when working with real-time data, where there is more information
    but the patterns that are hidden are not identified. The results of the configuration
    generated may be significantly influenced by how well it is optimized. By adjusting
    weights with progressively larger sets of datasets, an `ANN` learns. The learning
    algorithm is capable of recognizing the connections between variables and generalizing
    in a way that enables the successful application of novel, unforeseen data. In
    most cases, it works in the same way for fitting a line, or plane with a set,
    in most cases. The `ANN`’s surprising modeling prowess in pattern recognition
    is due to its remarkable malleability when it comes to adapting to new input.
    The results of the configuration generated can be significantly influenced by
    how well it is optimized. This algorithm is capable of recognizing the connections
    between variables and generalizing in a way that enables successful application
    to novel, unforeseen data [[11](#ch12.xhtml#ref12_11)]. Practically speaking,
    it’s equivalent to fitting a line with a set [[12](#ch12.xhtml#ref12_12)]. An
