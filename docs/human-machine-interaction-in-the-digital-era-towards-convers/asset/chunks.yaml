- raw: "Internet users now have more freedom of speech than ever thanks to the proliferation\
    \ of online social networks, the accessibility of information and communication\
    \ technologies, and the widespread usage of computers and smart phones. Additionally,\
    \ social media users frequently have the option to conceal their identities, which\
    \ facilitates the abuse of the tools offered.\n\nHate speech has been more prevalent\
    \ both offline and online in recent years. Social media and other internet platforms\
    \ have a significant role in the creation and transmission of inflammatory content,\
    \ which ultimately results towards hate crimes \\[[1](#ch1.xhtml#ref1_1)\\]. However,\
    \ it takes a lot of time and effort to manually discover and delete hate speech-related\
    \ content. Consequently, depending on their own definitions, some people may find\
    \ certain things to be hateful while others may not. According to \\[[2](#ch1.xhtml#ref1_2)\\\
    ], Hate speech is defined as offensive and violent material that is intended at\
    \ particular minority, religious, political, sexual, or other groups.\n\n## 2\\\
    . Literature Review\n\nHarish Yenala et al., (2017) did research into inappropriate\
    \ text from 79,041 unique web search queries using python. When using various\
    \ algorithms, they found that PKF gave 62.5% accuracy, BDT gave 79.25% accuracy,\
    \ **BDT- DSSM** gave **94.75%** accuracy, SVM gave 83.22% accuracy, SVM- DSSM\
    \ gave 92.41% accuracy, CNN gave 71.48% accuracy, LSTM gave 88.62% accuracy, C-Bil\
    \ STM gave 92.46% accuracy, BLSTM gave 80.18% accuracy.\\[[3](#ch1.xhtml#ref1_3)\\\
    ]\n\nOmar Sharif, Mohammed Moshiul Hoque et al.,(2020) did research to recognise\
    \ suspicious Bengali text messages on Facebook, Twitter, YouTube using ML. Google\
    \ colab platform with python is used to analyse the text messages. The algorithm\
    \ LR gave 84.00% accuracy, DT gave 79.57% accuracy, RF gave 83.71% accuracy, MNB\
    \ gave 83.78% accuracy, **SGD 84.57%** accuracy. \\[[4](#ch1.xhtml#ref1_4)\\]\n\
    \nJanak Sachdeva, Kushank Kumar Chaudhary et al., (2021) did research to find\
    \ hate speech on Twitter using deep learning. Word2Vec and Google News Vectors\
    \ is used to find the hate speeches on Twitter. They used many algorithms; LR\
    \ gave **84.8%** accuracy, **RFC** gave **84.8%** accuracy, KNN gave 75.5% accuracy,\
    \ L-SVC gave 83.4% accuracy, CNN gave 83.4% accuracy, LSTM gave 84.0% accuracy.\
    \ \\[[5](#ch1.xhtml#ref1_5)\\]\n\nBhavesh Pariyani, Krish Shah et al., (2021)\
    \ proposed a research to find hate speech on Twitter using machine learning.Count\
    \ Vector organizer in python is used. They used algorithms such as SVM gave 95.25%\
