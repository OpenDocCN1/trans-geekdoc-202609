    ## 2\. Literature Review


    Cricket is a dynamic sport that evolves ball by ball. The goal of the study in
    this paper is to look into machine learning technologies that can be used to the
    issue of forecasting cricket match outcomes based on historical match data. \[[1](#ch11.xhtml#ref11_1)\].
    In order to create predictive models, factors are discovered using filter-based
    techniques. Once the features were chosen, the proper machine learning algorithm
    was then used. In comparison, tree-based models like random forest performed better
    in terms of accuracy, precision, and recall metrics.


    The IPL is a team game and not an individual sport, which makes the winning chances
    to be dependent on each and every factor of all the players within the team. This
    study has mainly focused upon building a robust prediction model, which cab make
    it easier to classify players and help in predicting the best team that has the
    highest chances of winning the match, in this study modelling algorithms like
    decision tree, support vector machine and random forest are used in order to make
    the predictions for the same\[[2](#ch11.xhtml#ref11_2)\]. The study showed 95.78%
    accuracy for random forest model, which showed that the model is efficient in
    predicting the right selection of players to the team.


    When modelling the dataset, a multivariate regression-based solution is proposed
    to calculate the points for each team member and the overall weight of the team
    based on past performance. A cricket match is dependent on a number of factors,
    and these ultimately have a significant impact on how it turns out. Players’ performance
    has a relatively huge impact. Lamsal et al. identified 7 factors and trained the
    models for outcome prediction; it was observed that nearly three of the trained
    models demonstrated a correct prediction with multilayer perception and an accuracy
    of 72%; it was also observed that the multilayer perception classifier outperformed
    the other classifiers by correctly predicting 43 out of 60 matches\[[3](#ch11.xhtml#ref11_3)\].
    The analysis took into account the five characteristics of an IPL career and the
    five characteristics of an international 120 career for both bowlers and batsmen.
    Deep et al. gave idea to construct mathematical model to make the prediction of
    match results. Future research opportunities will be demonstrated by using more
    work features that can be created and taken into account, more data that is generated
    and gathered, better model learning and classification techniques, and various
    other types of data analytics techniques\[[4](#ch11.xhtml#ref11_4)\].


    This paper widely discusses the winner prediction using machine learning and data
    analytics. In order to test and train the data set of various sizes, different
    machine learning algorithms have been applied. Some of the algorithms are random
    forest SVM, naive bayes logistic regression, and decision tree. The paper researchers
    various features that can be used to analyse and predict the match winner of the
    game. The cricketing boards can use this to assess team strength and conduct a
    more thorough examination of cricket. This may be applied to gambling and media
    coverage of sporting events, which is a blessing in disguise. Mago Vistro et al.using
    a decision tree model, the model’s performance was enhanced when the parameters
    were adjusted with an accuracy of 76%. The model’s performance was improved from
    76% to 94 percentage, and positive results were obtained\[[5](#ch11.xhtml#ref11_5)\].
    The study finds that in order to produce superior analyses, a wide range of data
    must be analysed, the computation must run quickly, and it must satisfy business
    systems and problems.


