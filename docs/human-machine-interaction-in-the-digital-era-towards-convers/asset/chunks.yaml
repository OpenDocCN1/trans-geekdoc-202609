    “教育帮助我们接触新的思想和概念，我们可以利用这些理念来欣赏并改善我们周围的世界以及内在的世界。”\n\n我高兴地得知，SRMIST Ramapuram 理人文学院计算机科学与应用系将\
    \ de 2023 年 2 月 24 日与马来西亚 AIMST 大学及印度计算机学会（钦奈点）联合举办“数字时代的人机交互 - ICHMIDE-2023”国际会议。\n\
    \n人机交互（`HMI`）作为一个领域，在理解和改进我们与计算机技术的交互方面迈了巨大步伐。人机交互是系统的重要组成。用户满意度正促使更好的设计，这些设计融合了智能、自适应多模态的方法。针对这一非常相关的话题召开会议是当务之急。我坚信，本编辑著作将成为全球学者和学术界汇聚并交流有关数字化影响研究的绝佳参考。祝愿！\n\
