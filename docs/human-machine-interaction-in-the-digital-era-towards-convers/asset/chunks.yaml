    NSL-KDD 数据集的开发是为了解决文献中经常提到的恶意软件以及作为入侵数据进入的数据问题。尽管它仍然表现出一些不受理想的特征，但它现在已成为公认的基准数据集。尽管，由于可用的
    IDS 数据集存在缺失以及收集所需数据的困难，NSL-KDD 仍然是恶意检测研究的一个可靠选择。该数据集包含约 5,000,000 条记录，这使其适用于机器学习，同时又不会过大而导致研究人员必须从集合中随机随机样本。其结果非常容易比较。与
    KDD’99 数据集相比，NSGeocoder 清洗了冗余数据，以避免机器学习算法产生偏见。由于缺乏可靠且更新及时的网络安全数据集，促成了入侵检测评估数据集——CICIDS2017
    的诞生。研究人员通常使用的 IDS 数据本身具有许多自身的缺点，例如缺乏攻击多样性、缺乏流量多样性以及缺乏适当的特征。通过研究具有多种协议的 25 个用户的行为，CICIDS2017
    提供了真实的网络流量数据。随后，数据在五天的时间内被收集，其中四天被对模型设置的攻击所占据。


