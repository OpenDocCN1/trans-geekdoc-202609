  trans: '


    ### 2.1 通用图像伪造检测系统


    为了使某些思路更加清晰，我们首先对相关应用进行广泛概述。下节简要描述了最常见的伪造类型。


    ![图 3.1 伪造的类型 [1], [2], [3], [4], [6], [7], [8], [9]](images/fig3_1_C.jpg)


    图 3.1 伪造的类型 [1], [2], [3], [4], [6], [7], [8], [9]\]


    修改数字照片通常使用以下三种方法：


    1. 篡改（Tampering）

    2. 拼接（Splicing）

    3. 克隆或复制-移动（Cloning or Copy-Move）


    #### 篡改


    图像篡改是通过改变图像来产生新的结果。它是数字艺术的一种形式，需要强大的视觉想象力以及对图像属性的理解。篡改图像有多种原因，例如使用数字工具创建惊人的照片以娱乐为目的，或者制造伪造证据。被动图像篡改检测在对源图像没有任何先验信息的情况下，验证数字照片的合法性。


    #### 图像拼接


    这是一种照片编辑技术，涉及将多个独立的图像通过数字方式融合成合成图像。这是用于修改数字形式图片的的数字数字照片合成技术中的关键阶段，该技术也被称为“贴图”（paste-up），因为它通过使用
    `Photoshop` 等工具连接照片来创建。


    ![图 3.2 原始图像与伪造图像来源：在 OnePlus 手机上拍摄的原始图像](img/fig3_2_C.jpg)


    图 3.2 原始图像与伪造图像 *来源:* 在 OnePlus 手机上拍摄的原始图像


    修改数字图像最流行的方法是通过图像伪造。复制-移动技术基本上包括将图像块插入现有图像中，同时遮盖关键细节或物体。结果是图像的有效性和唯一性都受到了破坏。伪造极难发现，因为克隆块与其他图像块具有相同的属性，因为它们来自同一张图像。


    #### 使用拼接检测图像伪造


    拼接图像被用于各种场景，包括新闻报道、摄影比赛、学术论文中的关键证据等，这些可能会产生不利影响。随着数字图像比其非数字对应物更容易受到恶意篡改，确定图像的真实性并识别图像中被篡改的部分成为至关重要且困难的研究课题。


    文献中提到的一些技术包括：归类为基于特征的方法、光照颜色估计、源图像中不一致的噪声水平、源图像的统计特征以及其他技术。


    #### 光照颜色估计


    在其他异常信号之外，光照差异在拼接检测中确定数字图像的有效性方面可能有用。这是因为要创建一个光照情况调整恰当的伪图像是非常挑战性的。


    为了识别局部图像区域之间的差异，C. Riess 和 E. Angelopoulou 在提出的方法中设计了一种基于物理的光照颜色模型。为了估计结果并将其用于法医调查，作者构建了一个基于距离测量的光照图。用户必须参与这一策略。


    Yu Fan、Philippe Carré 和 Christine FernandezMaloigne 提出利用局部光照估计，通过物体周围区域光照颜色的波动来识别区域拼接伪造。为了估计每个水平和垂直条带的光照，他们建议结合五种基于简单统计的技巧。


    C. Riess 和 E. Angelopoulou 提供了一项利用光照颜色识别个人伪造照片的新颖方法以供进一步研究。通过统计灰度边缘估计和一种利用反强度-色度色彩空间的物理技术，他们计算了光照颜色。


    ### 2.2 基于图像噪声水平不一致的伪造


    通过伪造具有不一致噪声水平的文档提高拼接图像区域检测的准确性。显而易见，每个数字相机图像都会受到某种形式噪声的影响，这种噪声可能发生在光子进入过程中直到相机输出图像。


    在他们的研究中，Xunyu Pan、Xing Zhang 和 Siwei Lyu 提出了一种基于局部噪声不一致性的盲伪造检测方法，以寻找被局部噪声污染的小区域。为了在没有重叠块的情况下获得最高分辨率，该技术采用了高通对角波波系数。为了识别拼接伪造，使用基于同质性要求的简单区域合并方法将图像分割成若干个同质子区域。当认证图像包含的噪声量与均匀噪声水平图像相同时，这些方法的效果并不理想。


    该研究的作者建议了一种改进实践方法。首先将图像分离为不重叠的块，并使用聚类使块整齐且改变。


    Thibaut Julliand、Vincent Nozick 和 Hugues Talbot 在他们的论文中提出了一种原始照片拼接伪造自动检测方法。通过检查四叉树分解的图像差异，他们能够利用噪声参数的相对一致性识别潜在的切割图像。


    Siwei Lyu、Xunyu Pan 和 Xing Zhang 提出了一种基于投影峰度集中现象的区域拼接检测方法。


    噪声统计估计的优化问题存在闭式解。这些方法都基于单尺度上的噪声差异。


    Chi-Man Pun、Bo Liu 和 Xiao-Chen Yuan 提出了一种技术，将图像分成许多尺度的超像素，然后对每个单独尺度应用水平函数，利用多尺度作为识别拼接图像伪造的指标。然后使用`最优参数搜索`算法进一步处理不受水平函数限制的片段，以识别拼接部分。


    Yu-Feng Hsu 和 Shih-Fu Chang 开发了一种基于确定图像不同部分间一致相机特征的技术。使用 `LPIP` 中的几何不变性从分割图像的每个段计算相机响应函数
    (`CRF`)。基于 `SVM` 的分类器获得了计算出的 `CRF` 分数的区域强度特征。


    Zhenhua Qu、Guoping Qiu 和 Jiwu Huang 建议了一种使用人类视觉系统的机器学习方法。边缘锐度确定的前几个注视点与边界之间存在强联系。


    Hnnamma 和 Lalitha Rangarajan 提出的方法使用基于线的校准来测量镜头径向畸变。当图像存在直线时，该方法可以成功识别它们，但糟糕图像会在直线处产生干扰，导致对径向畸变的评估错误。


    '
