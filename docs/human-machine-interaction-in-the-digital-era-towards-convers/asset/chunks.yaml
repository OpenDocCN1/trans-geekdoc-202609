    得益于在线社交网络的普及、信息通信技术的普及以及计算机和智能手机的广泛使用，互联网用户现在的言论自由度比以往任何时候都要多。此外，社交媒体用户通常可以选择隐藏自己的身份，这为所提供工具的滥用提供了便利。


    近年来，仇恨言论在在线和线下都变得更加流行。社交媒体和其他互联网平台在煽动性内容的创建和传播中发挥了重要作用，这最终导致了仇恨犯罪 [1]。然而，手动发现和删除与仇恨言论相关的内容需要大量精力。因此，根据自己的定义，某些人可能认为某些事情是仇化的，而另一些人可能认为不是。根据
    [2]，仇恨言论定义为针对特定少数、宗教、政治、性别或其他体的攻击性和暴力材料。


    ## 2. 文献综述


