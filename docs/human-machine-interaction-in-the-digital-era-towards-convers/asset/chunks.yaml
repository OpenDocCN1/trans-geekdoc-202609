    # 15 使用增强支持向量空间模型 (ESVM) 的在线学习环境推荐模型


    Manikandan Rajagopal

    副教授，CHRIST (被认为大学的大学)，班加罗尔


    Surekha R Gondkar

    副教授，BMS 技术与管理学院电子与通信工程系，班加罗尔，卡纳塔克邦


    Ramkumar Sivasakthivel

    副教授，CHRIST (被认为大学的大学)，班加罗尔


    DOI: [10.1201/9781003428466-15](https://dx.doi.org/10.1201/9781003428466-15)


    **教育领域最引人入胜的研究之一是基于推荐系统的定制化在线学习。大多数学者创建了各种推荐式在线学习方法，这些方法在教育数据挖掘中使用了推荐方法，特别是针对教育数据的挖掘。**


    **关键词：文档频率、调整余弦相似度、向量空间模型**


    ## 1 引言


    在线学习场景正变得越来越普遍。由于先进教学法的引入，传统的教学模式发生了巨大变化 1, 2 和 3。


    为了激发学生的投入并引导其学习过程，教师需要一种程序化的策略。在学生方面，一个能够有机引导学习的学习框架将非常有益 4, 5, 6 和 7。


    由于在线资源的丰富，寻找相关的学习资源是困难的。在线学习框架预计将为学生推荐一系列内容 8 和 9。


    学习者的动力和兴趣程度也同样重要，是衡量学习成果的关键指标之一。这促使研究人员开发更有效的推荐模型以提高推荐的质量。根据某些研究人员的观点，可以通过考虑学生的知识维度来推进个性化学习
    12 和 13。


    沿着这些线，个性化深受学生能力的影响。根据项目反应理论提供了一种很大程度上取决于材料参数的定制化学习环境，增强型学习框架在 14 中提出。


