    5 局列。现在由于 `date` 列是字符串格式，需要将其转换为 `object` 格式。在完成这些数据清洗后，再次检查了重复值和空值。最后，生成了相关矩阵，揭示了数据得分和局数之间存在高度相关性。


    ### 4.4 建模与评估


    在构建模型之前，必须识别特征重要性。使用 `Extratreesregressor` 作为元估计器，以便在数据集的各种样本上拟合多个随机决策树，并利用平均形式保持更好的预测准确性并控制过拟合。在此项目中，部署了
    4 种算法作为模型构建的一部分，分别是 `linear regression`、`lasso regression`、`random forest` 和 `ridge
    regression`。


    ### 4.5 线性回归


    使用 `Sklearn` 构建了线性回归模型并进行了预测，使用 `MSE`、`RMSE` 和 `MAE` 矩阵来识别模型的拟合程度，并预测了模型评分以便更好地理解模型，下面是预测的图表。


    ### 4.6 随机森林


    随机森林模型也使用 `Sklearn` 构建，并使用 `random forest regressor` 执行回归，在提取的子集上随机拟合多个决策树，并对测试数据上所做的预测取平均值。


    ### 4.7 岭回归


    通过使用 `scale` 执行岭回归，使用 `randomised searchCV` 和 `gridsearch CV` 来拟合参数并确定 `lambda`
    值，使用负均方误差来识别算法评分，下面是该模型的密度图。


    ![Fig. 11.2 Ridge regression](img/fig11_2_C.jpg)


    图 11.2 岭回归


    ### 4.8 Lasso 回归


    Lasso 回归算法也使用 `Sklearn` 构建，并通过 `gridsearchCV` 确定 `Alpha` 值，使用负均方误差获取算法评分，并根据回归定律对模型进行预测，下面是该模型的密度图。


    相应的模型是通过从 `Sklearn` 导入模型来构建的。为了解释该项目预测的最佳拟合模型，可以使用多种指标，但使用了 `MSE`、`MAE` 和 `RMSE`
    这三种不同的指标来选择用于预测的最佳算法。


    1. `MAE`：也称为平均绝对误差，表示数据集中实际值与预测值之间绝对差的平均值，用于衡量数据集中所有残差的平均水平。


    2. `MSE`：也称为均方误差，表示数据集中原始值与预测值之间平方差的平均值，用于衡量数据集中所有残差的方差。


    3. `RMSE`：也称为均方根误差，是均方误差的平方根，用于衡量数据集中所有残差的标准差。


    通过上述 [表 11.1] 的对比，我们可以看到 `MAE`、`MSE` 和 `RMSE` 的最低值对应 `LASSO REGRESSION`，因此在该项目中使用
    lasso 回归模型进行首局得分预测。


