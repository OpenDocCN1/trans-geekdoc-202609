    ### 4.8 Lasso Regression


    The lasso regression algorithm is also built using the Sklearn and the gridsearchCV
    to identify the Alpha value and the negative means squared error is used to get
    the score of the algorithm and the model is predicted using the laws of regression
    and below is density graph of the same\[[8](#ch11.xhtml#ref11_8)\].


    The respective models are built by importing the models from Sklearn. And in order
    to interpret the best fit model for the prediction of this project several metrics
    can be utilised however three different metrics which is MSE, MAE and RMSE are
    used in order to pick the best algorithm to make the prediction.


    1.  MAE: Also known as the Mean Absolute Error, is the value the denotes the average
    of the absolute difference between the actual values and the predicted values
    within the dataset, and it is used to measure the average of all the residuals
    within the dataset.


    2.  MSE: Also known as the Mean Squared Error, is the value the denotes the average
    of the squared difference between the original values and the predicted values
    within the dataset, and it is used to measure the variance of all the residuals
    within the dataset.


    3.  RMSE: Also known as the root mean squared error is the square root of mean
    squared error, it is something that measures the standard deviation of all the
    residuals within the dataset.


