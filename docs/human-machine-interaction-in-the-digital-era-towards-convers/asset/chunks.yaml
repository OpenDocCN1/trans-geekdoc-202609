  trans: '

    本节讨论了实验工作；本研究采用的数据集是从 ECDC 仓库获取的 covid-19 数据集。ECDC 仓库是广泛使用的研究仓库，包含许多与 COVID-19
    相关的数据集。我们对每天和每周的普通患者以及 ICU 入院患者进行了处理。


    使用 MATLAB 实现了所提工作，并结果以召回率（Recall）、F 值（F-measure）和精确率（Precision）的形式给出。


    ![Fig. 17.2 观测数量（混淆矩阵)](img/fig17_2_C.jpg)


    图 17.2 观测数量（混淆矩阵）


    图 17.22 定义了所提集成分类器与输入数据集的关系。结果显示了袋袋（bagged tree）形成，其中 x 轴表示预测类别，y 轴表示真实类别。


    Figure 17.3 定义了带有袋的所提集成分类器与输入数据集的关系。结果显示了正预测值（PPV）和错误发现率（FDR）。x 轴表示预测类别，y 轴表示真实类别。


    ![Fig. 17.3 PPV 和 FDR](img/fig17_3_C.jpg)


    Fig. 17.3 PPV 和 FDR


    Figure 17.4 定义了带有袋的所提集成分类器与输入数据集的关系。结果显示了真阳性率（TPR）和假阴性率（FNR）。`x`-轴表示预测类别，y 轴表示真实类别。


    ![Fig. 17.4 TPR 和 FNR](img/fig17_4_C.jpg)


    Fig. 17.4 TPR 和 FNR


    ### 6.1 散点图


    散点图是一种确定两个数据收集变量结果的数学图表或表示方法。散点图应用笛卡尔坐标系，根据该坐标系，水平轴确定一个变量的值，垂直轴确定另一个变量的值。绘图点可视化了形状、颜色或大小。


    Figure 17.5 显示了年龄与胆固醇（chol）之间的散点图观测。基于袋的预测模型确定了关于年龄和胆固醇的正确错误预测。颜色和符号唯一地确定了每次预测。x
    轴表示年龄，y 轴表示胆固醇。


    ![Fig. 17.5 年龄对比胆固醇散点图](img/fig17_5_C.jpg)


    Fig. 17.5 年龄对比胆固醇散点图


    ### 6.2 ROC 曲线下面积 (AUC)


    ROC 曲线下面积（AUC）类似于积分曲线，对比了 0 到 1 范围内的真阳性率（TPR）值和假阳性率（FPR）值。AUC 在所有可能的水平上提供了全面的性能评估。AUC
    值从 0 到 1，数值越大表示分类器越有效。为了在任何阈值下获得 1 的真阳性率，完美的分类器会对正类数据不断给出正类标签。通过连接点 `[0, 0]`、`0,
    [1]` 和 `[1, 1]` 的直线，获得了该理想分类器的 AUC 值为 1。相反，对于随机分配分数的随机分类器，阈值、真阳性率和假阳性率将相同的。AUC
    为 0.5，ROC 曲线呈对角线。


    Figure 17.6 显示了基于 ROC 的 0 正类观测的袋树预测结果。y 轴表示真阳性率（TPR），x 轴表示假阳性率（FPR）。


    ![Fig. 17.6 ROC 0 正类观测](img/fig17_6_C.jpg)


    Fig. 17.6 ROC 0 正类观测

