    # 18 Study of Factors associated with Diets and Prevalence of Overweight and Obesity
    among Adolescent Girls


    A. Maria Vinitha^([^(38)](#fn38))


    Research Scholar, Presidency College, Triplicane, Chennai, Tamil Nadu, India


    T. Pramananda Perumal


    Principal (Retired), Presidency College, Triplicane, Chennai, Tamil Nadu, India


    DOI: [10.1201/9781003428466-18](https://dx.doi.org/10.1201/9781003428466-18)


    **Abstract** Overweight and Obesity among adolescent girls have become a growing
    health concern in urban cities of India. For the past few decades, the adolescent
    population of urban cities is more inclined to consume more western foods rather
    than opting for territorial cuisines. The adolescent girls of India in terms of
    acquiring fashion have got special love and psychological tendency towards modern
    western culture and cuisines and their alluring technologies. Culture and fashions
    have emerged among humans based on the geographical location and climate of their
    living place. The influence of exposure to western food habits and modern processed
    foods have not been elaborately investigated yet. Moreover, the actual food items
    and eating lifestyle for the development of overweight and obesity are yet to
    be carefully analysed because we mix both foreign and local styles in our living.
    The aim of this investigation is to determine the authentic causes, especially
    of food items and eating habits for overweight and obesity among adolescent girls
    of school and college goers in Chennai, India. Being in India, many places are
    in a nutritional transformation phase, in which overweight and obesity have become
    common prevalence. Nutritional evaluation needs to be done in the age of adolescence
    as it is the transitory period between childhood and adulthood. Thus concentrating
    on the adolescent age group will help to prevent the occurrence of disease and
    to improve the healthy lifestyle for future in the society.


    **Keywords** Adolescent girls, Diet type, Food types, Non-communicable diseases,
    Overweight, Obesity, Physical activity, Risk factors


    ## 1. Introduction


    Nearly 39% of the adult population globally have been grouped into overweight
    with a Body Mass Index (BMI) of 25.0–29.9 kg per m² or obese with BMI of more
    than 29.9 kg per m² in 2014 and it has been increasing by two folds from 1975.
