    # 12 Real Time Intrusion Detection Network Using Artificial Neural Network


    Deepa M.^([^(24)](#fn24))


    Research Scholar, Department of Computer Science and Applications, SRMIST, Ramapuram
    Campus, Chennai, India


    J. Dhilipan^([^(25)](#fn25))


    Professor & Head, Department of Computer Science and Applications, SRMIST, Ramapuram
    Campus, Chennai, India


    DOI: [10.1201/9781003428466-12](https://dx.doi.org/10.1201/9781003428466-12)


    **Abstract** The fortification of networks and databases has become increasingly
    dynamic in recent years, and intrusion detection systems are essential to this
    process\[[1](#ch12.xhtml#ref12_1)\]\[[2](#ch12.xhtml#ref12_2)\]. An IDS can provide
    real-time statistics on network traffic in the event that an attack is identified,
    inform users, and/or halt doubtful activity. The indefinite features continue
    to limit the effectiveness and accuracy of ML-based IDS, despite the fact that
    they have been shown to be efficient at monitoring real-time traffic.


    The challenge with machine learning is how the system becomes accustomed to experiencing
    accumulation to automatically develop performance and is compatible with the idea
    of detecting the attacks by making the machine learning against intrusion to increase
    the rate of detection and to decrease the false positive rate\[[2](#ch12.xhtml#ref12_2)\].


    A standard feature set may not be suitable for identifying different forms of
    intrusion attacks since some attributes may be unnecessary or unrelated and slow
    down the functionality of machine learning. In order to increase a detection system’s
    accuracy, it is important to research the ideal qualities. If an attack is discovered,
    an IDS can offer real-time statistics on network traffic and immediately alert
    users or stop questionable activity. The accuracy and effectiveness of ML-based
    IDS are still hampered by their unspecified features, despite the fact that they
    have confirmed strength in real-time traffic monitoring. The principal task is
    to focus on topology and hyperparameter configurations that are near to the ideal
    configuration, which are used to identify the smallest topologies that require
    the least computational resources.


    **Keywords** Intrusion attack, Security, Machine learning, Neural network


    ## 1\. Introduction


    More defence systems have been created and implemented, including firewalls, antiviruses,
    and malware detection software. However, it has been demonstrated that these solutions
    fall short of providing complete protection against attacks in the current network
    environments. Intrusion detection systems have become increasingly important for
    ensuring network and database security in recent years. Network intrusion detection
    \[[3](#ch12.xhtml#ref12_3)\]systems have been created using ML approaches in a
    variety of ways (NIDSs).


    Real-time statistics can be provided for intrusion detection system in the event
    that an attack is identified, inform users, and/or halt suspicious activity. Although
    ML-based IDS have demonstrated success in monitoring actual time traffic, their
    effectiveness and accuracy are constrained by the inaccurate characteristics.


    The variety of cybersecurity infractions has sparked study into a wide spectrum
    of different detection techniques. The working of signature-based intrusion detection
    systems (IDS) relies on a database of known assaults, but other approaches like
    anomalybased approaches create a model of “normal” traffic and raises an alarm
    if the model deviates from it.


    Each and every automated machine learning system has hyperparameters, and the
    most fundamental objective is to automatically set these hyperparameters to maximize
    performance. Particularly contemporary deep neural networks heavily rely on a
    variety of hyperparameter decisions regarding the architecture, regularisation,
    and optimization of the neural network. The use cases for automated hyperparameter
    optimization (HPO) are numerous and significant.


    Often, research on the use of neural networks to intrusion detection presents
    setups for hyperparameters and topologies that are picked at random, oblivious
    to the significant impact that these parameters might have on the accuracy that
    is attained. The initial goal of this research is to draw attention to the potential
    that exists in frequently untested situations. Second, the ideal configuration
    benchmarks that are applied for detecting the intrusions is desired. Then to locate
    the smallest topologies that demand the minimum resources, topology and hyperparameter
    mixtures that are near to the optimal arrangement are identified. A strategy for
    hyperparameter tuning is provided and used to accomplish the aforementioned goals.
    Grid search is a method e producing maximum candidates for the setup of a network
    using neurons and ranking it in accordance with one selected scoring function
    while searching through hyperparameter space. The results of the function is collected,
    scheduling the results with different hyperparameter combination has been designed
    for a given topology. The results that are obtained highlight the optimized topology
    and hyperparameters for data in the security domain. Grid search was employed
    in this study because of its transparency and ability to manually direct tests
    to the most promising areas.


    ## 2\. Related Work


    An artificial neural network is made up of a different layers of neurons, which
    are known as units for processing, that are coordinated and connected in the desired
    topology (ANN). A wide range of data-intensive applications have effectively been
    applied using ANN. Because there are so many possible attack vectors, cybersecurity
    is a very broad subject\[[3](#ch12.xhtml#ref12_3)\]\[[4](#ch12.xhtml#ref12_4)\].'
