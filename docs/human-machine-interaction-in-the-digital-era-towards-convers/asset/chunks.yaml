    | 类型 II | 205 名患者 | 中期患者就医 |

    | 类型 III | 772 名患者 | 类型 III 就医人数多 |

    | 类型 IV | 991 名患者 | 晚期就医人数多 |


    脑 MRI 扫描被用于本研究的预处理、分割、特征提取、分类和验证阶段（如 表 5.2 所示）。总共有六张照片，分别来自正常组和病理组，以及来自不同年龄和成像模式的患者。图像在保存为
    `.mat` 文件后可以使用 `MATLAB 2021a` 进行处理。


