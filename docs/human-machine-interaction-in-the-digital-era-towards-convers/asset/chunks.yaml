    统计了学生拥有账号的社交媒体平台。学生主要使用 Instagram，占比为 54%（163 人），其次是 Whatsapp，占比为 21%（69 人），然后是
    Snapchat，占比为 6%（17 人），最后是 Facebook 其他应用程序。发现大多数人在 Instagram 上都有账号。


    ![图 2.4 学生拥有的社交媒体账号](img/fig2_4_C.jpg)


    图 2.4 学生拥有的社交媒体账号


    发现 33.3%（155 人）每天使用电子设备超过 3 小时，其次是 25.2%（117 人）每天使用约 1 到 2 小时，然后是 24.5%（114 人）每天使用
    2 到 3 小时，最后只有约 17%（79 人）使用设备不到 1 小时。由此我们可以发现大多数学生长时间沉浸在社交媒体中。


    发现 75%（349 人）每天随身携带智能设备。其次是 25%（116 人）没有随身携带设备。（图 2.6）。


    ![图 2.6 显示学生是否每天随身携带智能设备](img/fig2_6_C.jpg)


    图 2.6 显示学生是否每天随身携带智能设备


    为了找出使用手机和其他设备的原因，我们发现 31%（62 人）仅用于娱乐，其次是 23%（46 人）仅用于聊天，17%（34 人）用于学习和工作，然后是在线游戏占比
    10%（19 人）。在这一表示中，去除了组合情况以查找单一原因的使用情况。从这些数据中我们可以看到，社交媒体的使用大部分主要是娱乐。


    ![图 2.5 学生在设备上花费的时间](img/fig2_5_C.jpg)


    图 2.5 学生在设备上花费的时间


    ![图 2.7 使用技术的原因](img/fig2_7_C.jpg)


    图 2.7 使用技术的原因


    收集数据的整体表示已使用旭日图（sunburst chart）呈现


    ## 6. 结论


    本研究探索了大学生为什么会从学术上分心。尽管大多数学生没有认为社交媒体分散了他们的学习，但当发现社交媒体应用的使用情况时，显而易见的是大多数学生在无聊时会使用社交媒体。最常用的社交媒体平台是
    Instagram。通过这项研究，我们发现更多学生长时间使用设备，这可能会损害他们的学习能力。本研究发现了学生使用的社交媒体应用、最常用的设备以及智能设备的使用情况。这项研究可用于发现并减少学术分心。


    ![图 2.8 旭日图](img/fig2_8_C.jpg)


    图 2.8 旭日图


