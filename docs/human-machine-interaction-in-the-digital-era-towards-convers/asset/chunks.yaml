    ### 3.2 Steps in the Filtering Process


    When an MRI picture is acquired, it is contaminated by many types of noise due
    to the environment. Results from noisy images tend to be subpar. This means that
    prior to implementing any technique, noise reduction and image quality enhancement
    must occur.


    *   **Gaussian filter:** It is common practise to employ a Gaussian filter to
    clean up an image by decreasing noise and boosting contrast. Images are preprocessed
    using the Gaussian filter’s closeness and similarity functions to reduce noises
    before further analysis.


    *   **Bilateral filter:** is an edge-preserving, noise-reduction, non-linear smoothing
    filter for pictures. It does this by substituting the average intensity of neighbouring
    pixels for the intensity of the current pixel. There is room for a Gaussian distribution
    in this weighting.


    *   **Median filter:** The goal of the preprocessing procedure is to modify the
    photos such that they have higher contrast and are more legible. Median has a
    tendency to retain the crispness of image edges while smoothing out the noise.
    It is a method that helps get rid of impulse noise.


    #### RGB to Gray Scale


    A colour picture, abbreviated as RGB, consists of the primary colours red, green,
    and blue. Each pixel in an RGB image encapsulates the red, green, and blue components
    of the image at a given point in M x N x 3 array of colour pixels.


    *   Step 1: Read RGB color image


    *   Step 2: Take an RGB image and separate its red, green, and blue components
    into three separate 2-dimensional matrices.


    *   Step 3: Generating a new matrix with the same amount of rows and columns as
    the RGB image, but filled with zeroes.


    *   Step 4: To create grayscale values, create a weighted sum of the Red, Green,
    and Blue colour components and assign it to the ijth position in the new matrix.


    ### 3.3 Segmentation


    Without altering the original image’s structures or attributes, segmentation serves
    to separate the images for processing in order to recover information utilising
    algorithms or image segmentation approaches. Segmentation is the process of dividing
    a digital image into multiple non-overlapping parts based on characteristics of
    the image, such as its pixel size, texture, depth, and grayscale. These are some
    of the many methods used in segmentation::


    *   Threshold-based segregation


    *   Clustering based on features to create subgroups


    Deep Learning Based Brain Tumour Detection Using Image Processing


    *   Automatic Region Delimitation Using Edge Detection


    *   Compression-based techniques


    ### 3.4 Feature Extraction


    There are primarily four phases involved in image processing. After the images
    have been preprocessed and segmented, the next stage is Feature extraction, which
    is crucial in obtaining the features. The final level or step in processing an
    image is classification, which receives its input from the results of both the
    segmentation and feature extraction processes. After an image has been subjected
    to various processing steps—including pre-processing, segmentation, feature extraction,
    and classification—its results must be validated. While many different approaches
    exist for Feature Extraction, the ones listed here are tried and true methods
    for extracting and choosing features.


    *   The Principal Components Method (PCA)


    *   Matrix of Grey-Level Occurrences (GLCM)


    ## 4\. Conclusion'
