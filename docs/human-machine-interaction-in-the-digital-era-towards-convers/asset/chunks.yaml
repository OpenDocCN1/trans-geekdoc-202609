- raw: "The advent of COVID-19 has brought a huge health catastrophe to the world\
    \ in 2019, resulting in a pandemic. The rapid diagnosis of COVID-19 is essential\
    \ to stay precautious and to stop the spread of infection. Medical images like\
    \ MRI and CT-Scans are used as sources of information for the diagnosis. With\
    \ help of automated diagnostic models, it is easier to overcome the difficulties\
    \ encountered by non-expert radiologists in the accurate diagnosis process \\\
    [[2](#ch4.xhtml#ref4_2)\\]. There are several kinds of AI classification models\
    \ which were reported in the research works dealing with real datasets of COVID-19\
    \ comprising of different targets and case studies \\[[5](#ch4.xhtml#ref4_5)\\\
    ]. Even though, AI methods can be found beneficial in the process of diagnosis\
    \ and detection of the presence of COVID-19, it is challenging to develop an appropriate\
    \ AI model which can yield precise results \\[[7](#ch4.xhtml#ref4_7) and [8](#ch4.xhtml#ref4_8)\\\
    ].\n\nThe proposed research work focuses on evaluating the different feature extraction\
    \ methods, and their performance in the prediction and classification of COVID-19\
    \ severity. The effect of statistical features, textural features, region-based\
    \ features, and their combinations are evaluated in this study. Furthermore, this\
    \ work proposes a novel classifier model that includes the concept of Computational\
    \ Intelligence (CI). The main paradigms of CI are the metaheuristic algorithms,\
    \ which are fundamentally used for solving the problems of optimization \\[[9](#ch4.xhtml#ref4_9)\\\
    ]. In this regard, latest metaheuristic approach called Atom Search Optimization\
    \ (ASO) \\[[3](#ch4.xhtml#ref4_3)\\] is employed in the proposed model to optimize\
    \ the weights of Gated Recurrent Unit based Neural Network (GRU-NN). The proposed\
    \ model of Atom Search Optimized GRU-NN (ASO-GRU-NN) helps in enhancing the performance\
    \ of COVID-19 and its severity classification with respect to accuracy, specificity,\
    \ sensitivity, and error rate.\n\nThe major contributions of the proposed research\
    \ work are listed below.\n\n*   A novel CI based AI model of classifier called\
    \ ASO-GRU-NN is developed for the prediction of COVID-19 and classification of\
    \ the severity of COVID-19.\n\n*   The study evaluates the impact of statistical\
    \ features, GLCM features, and infected region-based shape features on COVID-19\
    \ detection and classification.\n\n*   The combined effects of the three features\
    \ are evaluated for detection and classification of the severity of COVID-19.\
    \ The performance of the proposed method is validated by comparing it with the\
    \ existing state-of-the-art models of classifiers.\n\n## 2\\. Literature Review\n\
    \nAl-Areqi, F., & Konyar, M. Z. (2022) \\[[1](#ch4.xhtml#ref4_1)\\] extracted\
    \ texture features using gray-level co-occurrence matrix (GLCM), shape features,\
    \ and first order statistical features using the CT slices. The feature matrix\
    \ for training the model is developed using one group of feature or a combination\
    \ of more number of groups. The performance of the feature extraction techniques\
    \ was evaluated and compared with different ML classifiers such as SVM, Random\
    \ Forest, k-nearest neighbor and XGBoost.\n\nDey et al. \\[[6](#ch4.xhtml#ref4_6)\\\
    ] considered 400 CT images (200 non-COVID-19 and 200 COVID-19 subjects). The authors\
    \ recommended a system which segments the lesions of COVID-19 and then extract\
    \ features of those segmented regions. Four classifiers were employed for classification,\
    \ namely, RF, KNN, SVM and DT. A highest accuracy of 87% was achieved for KNN\
    \ model.\n\nQiblawey, Y., et al. (2021) \\[[4](#ch4.xhtml#ref4_4)\\] proposed\
    \ a cascaded model to segment the lungs, detect, localize, and quantify COVID-19\
    \ lesions from CT slices. An extensive set of experiments were accomplished with\
    \ the help of Encoder–Decoder CNNs (ED-CNNs), UNet, and Feature Pyramid Network\
    \ (FPN), with diverse structures of backbone (encoder) employing the variants\
    \ of ResNet and DenseNet.\n\n## 3\\. Proposed Framework of Severity Classification\
    \ of COVID-19\n\nThe proposed framework of detection of COVID-19 and its severity\
    \ level classification is given in [Fig. 4.1.](#ch4.xhtml#fig4_1) The input lung\
    \ CT image is pre-processed for noise removal using Contrast Limited Adaptive\
    \ Histogram Equalization based non-local means Filter (CLAHEN Filter). The pre-processed\
    \ image is subjected to segmentation of lungs using Logarithmic Non-Maxima Suppression\
    \ (LNMS) method. The segmented lungs are passed through the trained Inf-Seg-Net\
    \ model for determining the infections present in the lungs. The segmented infections\
    \ are superimposed over the original input CT image to get the infection extracted\
    \ image. Three types of features are estimated from the segmented output image.\
    \ The estimated features are given separately and in combination for training\
    \ the proposed ASO-GRU-NN classification model to detect and classify the severity\
    \ of COVID-19.\n\n![Fig. 4.1 Proposed framework of COVID-19 severity classification](images/fig4_1_C.jpg)\n\
    \n[Fig. 4.1 Proposed framework of COVID-19 severity classification](#ch4.xhtml#R_fig4_1)\n\
    \nFeature extraction plays a crucial roles which is performed by eliminating the\
    \ irrelevant and redundant information from the data. The extracted features are\
    \ used in training the classifier models to classify the incoming data. The performance\
    \ of a classifier depends directly on the choice of feature estimation techniques\
    \ employed on the data. Hence, three major kinds of features such as statistical\
    \ features, shape features, and texture features using gray-level co-occurrence\
    \ matrix (GLCM) are extracted from the infection segmented output to train the\
    \ classification model.\n\n### 3.1 Statistical Features\n\nThe statistical features\
    \ extracted in this study are mean, median, standard deviation, and variance.\
    \ Mean can be referred as the average of all the pixels in the image estimated\
    \ using the following equation (1).\n\n(1)  \n\n$$~Mean~ = \\\\frac{\\\\underset{N}{\\\
    \\overset{i,j = 1}{\\\\sum^{}}}P\\_{i,j}}{N}$$  \n\nWhere, *P[i]*[,*j*] is the\
    \ image pixel and N is the total count of pixels in the matrix of the image.\n\
    \nMedian represents the mid pixel of the image matrix, which is estimated using\
    \ the equation (2).\n\n(2)  \n\n$$Median~ = \\\\frac{\\\\left( P\\_{\\\\frac{N}{2},\\\
    \\frac{N}{2}} \\\\right) + \\\\left( P\\_{\\\\frac{N + 1}{2},\\\\frac{N + 1}{2}}^{2}\
    \ \\\\right)}{2}$$  \n\nStandard deviation can be defined as the dispersion measure\
    \ of observation in the dataset relative to the mean value. This can be expressed\
    \ as given in equation (3).\n\n(3)  \n\n$$~SD = \\\\sqrt{\\\\frac{\\\\underset{N}{\\\
    \\overset{i,j = 1}{\\\\sum^{}}}\\\\left( {P\\_{i,j} - ~Mean~} \\\\right)^{2}}{N}}$$\
    \  \n\nVariance can be defined as the numerical value that describes the variability\
    \ of the observations from the mean value. Variance can be estimated using equation\
    \ (4).\n\n(4)  \n\n *V**a**r**i**a**n**c**e*  = *S**D*²  \n\n### 3.2 Gray Level\
    \ Co-occurrence Matrix (GLCM) Features\n\nThe textural features estimated using\
    \ GLCM in this research work are energy, entropy, contrast, correlation, and homogeneity.\
    \ The GLCM function characterizes the textural features of the image by assessing\
    \ how often the pixel pairs with specified values and in a specific spatial relationship\
    \ exist in an image, with the help of a GLCM to extract statistical features from\
    \ this matrix. Every element (*i*, *j*) of the GLCM is the total number of times\
    \ the pixel of intensity i existed in the specific spatial relationship to a pixel\
    \ of intensity *j* in the input matrix of image.\n\nEnergy estimates the uniformity\
    \ in the texture (repetitions in pixel pair). Energy can be expressed using equation\
    \ (5).\n\n(5)  \n\n$$~Energy~ = \\\\underset{i}{\\\\sum^{}}\\\\underset{j}{\\\\\
    sum^{}}\\\\left( g\\_{i,j} \\\\right)^{2}$$  \n\nWhere, *g[i]*[,*j*] is the element\
    \ of the GLCM *G*.\n\nEntropy calculates the complexities or disorders in the\
    \ image. The value of entropy is high when the uniformity is not found in the\
    \ image and when the elements of GLCM are very small. Entropy is inversely and\
    \ strongly proportional to energy. Entropy can be calculated using the equation\
    \ (6)."
