    ## 5. 结论


    本研究采用深度学习方法开发了一种用于发现和测量海洋垃圾的自动方法。本研究建议用于物体识别和分类的 `FMA-YOLOv5s` 网络架构。在基于 `YOLOv5s`
    的骨干网络最后引入了特征图注意力（`FMA`）层以改进特征提取。使用了使用深度学习方法构建的分割模型 `U-Net` 来计算垃圾数量。本研究创建的网络模型以
    0.90 的 mAP 精度对物品进行了分类。随后，将所提自动方法对整个海滩海洋垃圾存量的预测与基于人工方法的统计计算进行了比较。该方法能够以足够的速度和精度实时检测水体中的漂浮物。从长期来看，可以更多地关注增强模糊和密集物品的识别，并支持新的漂浮垃圾类别。此外，在本工作中开发的深度学习方法可以与无人机或无人飞机集成，以便未来在国家海洋垃圾监测站创建并实施自动化监测系统。


