    and coordinated by an Arduino microcontroller


    ## 3\. Methodology and Model Specifications


    Neural network-based method for measuring and detecting railway deterioration.
    Train accidents are frequently caused by railway problems and deficiencies. An
    approach that uses selective search to extract just 2000 areas from the image
    and call them region proposals was presented to get over the issue of picking
    a large number of regions. Corrupted images will prevent the system from operating
    correctly. Low Precision due to Poor Lighting The suggested approach not only
    resolves these issues but also boosts precision.


