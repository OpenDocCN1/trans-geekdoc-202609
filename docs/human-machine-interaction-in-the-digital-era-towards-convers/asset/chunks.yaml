- raw: "On numerous computer vision tasks, such as object localization and detection\
    \ [Bochkovskiy et al., (2020](#ch14.xhtml#ref14_12)) classification, and semantic\
    \ segmentation [Tao et al., (2020](#ch14.xhtml#ref14_13)) deep learning techniques\
    \ have been successfully applied. Unlike normal machine learning approaches, which\
    \ demand domain-specific as well as humanly designed feature extraction, deep-learning\
    \ algorithms autonomously uncover latent data characterizations out from source\
    \ data and provide end-to-end training processes. [Fukushima et al (2014](#ch14.xhtml#ref14_14))\
    \ Deep learning techniques can be used to develop quicker and more precise tools\
    \ for locating and classifying floating trash in the scope of marine debris study.\
    \ When it comes to picture and video data, convolutional neural networks (CNNs)\
    \ are among the top techniques advancing the success of deep learning. CNNs are\
    \ created in a way that is influenced by the receptive field patterns seen in\
    \ the animal visual system in order to retrieve features hierarchical order by\
    \ integrating low level information into high level ones.\n\nThe single-stage\
    \ single shot multi-box detector (SSD) as well as YOLO series algorithm and the\
    \ two-stage region-convolutional neural network (R-CNN) series algorithm are two\
    \ subsets of algorithms for deep learning. The most recent studies demonstrate\
    \ that YOLO series techniques can be used in a variety of detecting applications.\
    \ The YOLOv5 method has been selected to be used in the network model for the\
    \ spotting of floating debris.YOLOv5 has a more adaptable network structure than\
    \ YOLOv2, YOLOv3, and YOLOv4, which makes it easier to change the network architecture\
    \ of various jobs. The four versions of YOLOv5 are YOLOv5s, YOLOv5m, YOLOv5l,\
    \ and YOLOv5x. The model’s depth and width, as well as its number of parameters,\
    \ are growing from YOLOv5s to YOLOv5l.Even though accuracy will grow as model\
    \ complexity increases, detection speed is also significantly impacted. Due of\
    \ their numerous parameters, which would significantly slow down detection, YOLOv5l\
    \ as well as YOLOv5x are not included.\n\nThis paper’s research intends to address\
    \ the demand for a quick and accurate estimate of floating plastic. These are\
    \ the primary contributions to this paper:\n\n*   To create a model for the detection,\
    \ classification, and quantification of various types of marine trash by autonomous\
    \ means;\n\n*   A feature map attention (FMA) layer was placed in between backbone\
    \ and neck of the YOLOv5 network, as seen in [Figure 1](#ch14.xhtml#fig14_1).\
    \ The input feature map for this layer was adjusted to improve the YOLOv5 backbone’s\
    \ lighter object recognition’s ability to extract features.\n\n    ![Fig. 14.1\
    \ FMA-YOLOv5s algorithm's general framework](images/fig14_1_C.jpg)\n\n    [Fig.\
    \ 14.1 FMA-YOLOv5s algorithm's general framework](#ch14.xhtml#R_fig14_1)\n\n*\
    \   To estimate the coastal debris, U-Net, segmentation technique based on deep\
    \ learning was employed.\n\n*   The proposed methodology is utilized to quantitatively\
    \ estimate and classify waste into six categories: plastic, glass, fishing gear,\
    \ thermopolis, rubber, metal and undefined.\n\n*   This investigation also demonstrated\
    \ the difference between the suggested automatic method and established techniques\
    \ for estimating and predicting beach waste.\n\nThe remaining sections of the\
    \ work are structured as follows. Related works are reviewed in [section 2](#ch14.xhtml#sec14_1).\
    \ Materials and techniques utilized in this study are described in [Section 3](#ch14.xhtml#sec14_3):dataset\
    \ ([Section 3.1](#ch14.xhtml#sec14_3_1)) and implemented deep convolutional architectures\
    \ ([Section 3.2](#ch14.xhtml#sec14_3_2)). [Section 4](#ch14.xhtml#sec14_4) presents\
    \ and discusses the experimental findings. Conclusions and suggestions for further\
    \ research are provided in [Section 5](#ch14.xhtml#sec14_5).\n\n## 2\\. Literature\
    \ Survey\n\nUnderstanding and combating the expanding advent and latest developments\
    \ in the dispersion and accumulation of plastic particles depend on the identification\
    \ and detection of macroplastic waste in aquatic settings. Fieldwork studies and\
    \ ocular methods are now the most widely used strategies for gathering data, although\
    \ since 2018 remote sensing and artificial intelligencebased methods have advanced.\
    \ Despite their shown effectiveness, speed, and broad usability, there remain\
    \ challenges to be solved, particularly when considering the accessibility and\
    \ availability of data. As a result, Gnann N et al., (2022) review provides an\
    \ overview of the most recent studies on the visual identification and recognition\
    \ of various macroplastic types. The emphasis is on methods for both gathering\
    \ data and evaluating it, such as machine learning and deep learning, although\
    \ outcomes and publicly available might also be taken into account. The goal is\
    \ to provide a critical outlook and viewpoint at a period when this field of study\
    \ is developing swiftly. This research reveals that the bulk of machine learning\
    \ and deep learning algorithms remain in their immaturity in terms of accuracy\
    \ and precision comparing to visual surveillance, although having highly promising\
    \ results.\n\nIn order to design a protocol that citizens can use to check shorelines\
    \ for marine debris, [Papakonstantinou et al., (2021](#ch14.xhtml#ref14_16)) framework\
    \ blends drone technology with advancements in artificial intelligence for machine\
    \ vision applications. In the current study, a customer-grade off-the-shelf drone\
    \ was used to capture really high resolution aerial photographs from a beach with\
    \ a complicated background. In order to detect marine litter in the coastal area\
    \ and produce its density maps, these photos were employed as input data in deep\
    \ learning models. The input data was annotated into the litter and no litter\
    \ classifications using the Zooniverse citizen science tool. With the aid of volunteers,\
    \ the annotation procedure was quickly put into place, increasing its effectiveness\
    \ and efficiency. In order to recognize marine litter from very high quality photos\
    \ gathered from beaches with complicated backdrops, five deep learning algorithms\
    \ were looked at and trained. By contrasting these density maps with those generated\
    \ by a manual screening categorization, it was demonstrated that the method could\
    \ be applied geographically to new and undiscovered beaches.\n\nLi P et al., (2022)\
    \ suggests using picture enhancement and YOLOv5S to detect marine biological items.\
    \ To address the issues of underwater image distortion and blur, contrast-limited\
    \ adaptive histogram equalization (CLAHE) is used. They also present an upgraded\
    \ YOLOv5S to increase object detection’s accuracy and real-time functionality.\
    \ The enhanced YOLOv5S incorporates coordinated attention and dynamic spatial\
    \ feature fusion to precisely detect the object of attention and fully integrate\
    \ the features of different dimensions. Soft non-maximum suppression has been\
    \ adopted in favor of non-maximum suppression to improve the capacity to detect\
    \ overlapping items. The results of the experiment show that the CLAHE method\
    \ can greatly improve the accuracy and quality of underwater picture detection."
