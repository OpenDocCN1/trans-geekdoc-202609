    ### 5.1 Discussions


    In the study, we tested on a dataset of hate speech with three classes, seven
    classifiers utilising two different feature engineering techniques were used.
    The `LSTM` algorithm in combination with `Doc2Vec` generated the best outcomes,
    according to the results of the testing. In order to categorise texts, feature
    engineering selection is crucial. In this study, we looked at the `word2vec` and
    `doc2vec` feature extraction methods. The experiments’ findings showed that `doc2vec`
    performed better than the other two methods.


    Out Of Vocabulary cannot be handled in Twitter data using `Word2vec`, which results
    in poor performance. To understand the complex relationship between words, `Word2vec`
    requires additional training data[[9](#ch1.xhtml#ref1_9)]. The Taken dataset contains
    about 15000 tweets as displayed in Table I, because it is not enough for `Word2vec`
    to elicit the difficult word association. Recent studies have revealed that no
    single deep learning algorithm performs better than most on all types of data.
    To determine which deep learning algorithm performs the best on the provided dataset,
    we compared seven different deep learning models to our dataset as a result.


    Test findings demonstrated that `LSTM` and `SVM` classifiers performed the best
    because `LSTM` and `SVM` employ thresholds to segregate data instead of determining
    the amount of features boundaries. These results shows `SVM` is not affected by
    feature quantity of data [[10](#ch1.xhtml#ref1_10), [11](#ch1.xhtml#ref1_11)].
    The outcome achieved by the `NB` and `RNN` classifiers are slightly lower than
    the results obtained with the `LSTM` and `SVM` classifiers, but way better than
    the results obtained with `CNN`, `DT`, and `RCNN`.


    When compared to the other classes, the category “Hate Speech” has the fewest
    training sets, as shown in [Table 1.1](#ch1.xhtml#tab1_1), however this category’s
    misclassification is primarily due to the fact that it is not a class. Many more
    categories besides hate speech contain word overlapping more frequently.


    ## 6. Conclusion


    This study used automated text categorization approaches with two feature engineering
    strategies and seven deep learning algorithms to identify hate speech. The research
    findings demonstrated that `Doc2Vec` performed better than `word2vec` features
    engineering strategies. Furthermore, `LSTM` and `SVM` algorithms outperformed
    `NB`, `DT`, `CNN`, `RNN`, and `RCNN`. `DT` shows less performance than `LSTM`
    and `SVM`. In Hate Speech detection, this study results are significant since
    this acts as a benchmark for assessing subsequent investigations into various
    automatic text categorization methods. This study is also useful for a lot of
    automatic hate speech detection because of its experimental results from a scientific
    standpoint. This research contains two significant drawbacks. The First limitation
    is real-time prediction precision of the data, the suggested deep learning model
    is inefficient. Finally, it merely separates hate speech messages into three categories
    and is incapable of determining the severity of the dataset. Prediction of the
    severity of hate speech using deep learning techniques is the expected next step.
    The classification performance of the recommended model will also be improved
    using two techniques.Second, additional information examples will be gathered
    so that the categorization rules can be learned quickly.


