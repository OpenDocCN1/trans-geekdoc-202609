    ## 5\. Conclusion


    Lasso regression was found to be the model that had the highest accuracy among
    the models and it did a good job in making the future prediction effective, appropriate
    and close to the range. The factors like runs, wickets, overs and the batting
    and the bowling team, along with the total runs plays a major role in predicting
    the score of the first innings. Factors like runs and wickets in the last 5 overs
    matter the most in case of prediction as the game’s fate is almost sealed after
    the completion of the first 5 overs, hence the state of the game in the previous
    5 overs play a major role. The venue of the match, was not considered in building
    the model; however, its significance is not identified, hence this aspect opens
    window for future research to explore more factors in predicting the score of
    the match. IPL has 8 consistent teams based on the no. of games played, being
    an established franchise and the data proves their consistency based on the average
    score of these teams as well. A crucial aspect of cricket is the use of machine
    learning algorithms to forecast the results of a match. By analysing player performance
    data and other related information, models that predict the winning team can be
    developed. The worth of a victory manifests itself in a variety of ways, including
    trickle-down effects to the fans, broadcast contracts, fan store items, parking,
    concessions, sponsorships, enrolment, and retention.


