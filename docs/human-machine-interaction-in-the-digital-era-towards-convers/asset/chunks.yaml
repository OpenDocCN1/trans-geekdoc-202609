    # Confronting Floating Plastic Debris as Pollutants in Marine Using Technological
    Solutions


    ### Abstract

    Estimating how much macro-plastic is present in the world’s oceans is one of most
    critical challenges. The most popular techniques for counting the amount of floating
    trash take long time and only work in relatively narrow region. To overcome the
    shortcomings, an automatic identification method based on a deep learning framework
    was developed to find and quantify the marine trash. As a result, it is suggested
    to utilize the `FMA-YOLOv5` approach, an improved version of `YOLOv5` technique
    that uses a feature map attention (`FMA`) layer at the end of the backbone for
    detection and classification. The deep learning-based segmentation model was used
    by the image classifier to quantify the marine debris in the sample. The quantity
    of coastal debris predicted by the suggested strategy was compared with the estimation
    of manual monitoring method in order to demonstrate the differences. Apparently,
    the proposed outcomes offer vital data for formulating efficient marine trash
    control and regulations.


    ### Keywords

    Debris, Marine, Aquatic, Pollution, Yolo, Garbage, Plastics


    ## Introduction

    Marine debris, particularly pollution from plastics, is one of the largest environmental
    issues currently endangering our ecosystems. Marine debris is present in all sectors
    worldwide and is described as any durable, made, or treated solid mass disposed,
    discarded, neglected, or misplaced in the coastal and marine environment. Marine
    debris pollution of coastlines has a terrible effect on ecosystems, human life,
    and marine life. Because it can entangle any type of marine species (including
    fishes, turtles, and marine animals) and because it can be consumed by marine
    life, particularly big filter-feeding species, floating marine debris is particularly
    damaging. The amount of plastic generated worldwide has surpassed 500 million
    tons, and predictions show that 30% of this plastic will be dumped in the oceans.
    Inside the Central Pacific Gyre, plastic trash has multiplied five times, and
    studies have indicated that it now outpaces natural plankton six to one in abundance.
    About 80% of the marine plastic we see comes from land-based sources: Most frequently
    in the form of packing supplies and food storage containers like plastic bags
    and bottles. The remaining 20% comes from discharges from transport vessels and
    abandoned commercial fishing gear. According to studies, clearing the oceans of
    plastic will have a huge positive impact on ecosystem health, includes stopping
    invasive species from spreading between regions, stopping it from degrading into
    microplastics, and reducing greenhouse gas emissions (thereby slowing down climate
    change). Determining the amount of plastic marine debris (PMD) is crucial for
    conducting efficient beach cleaning efforts and evaluating the harmful effects
    of marine litter on the environment. Boat surveys are the primary technique for
    gathering information on plastics lying on (or around) the water’s surface, including
    its form and thickness. Vessel surveys are time-consuming, costly, and have a
    restricted geographic scope notwithstanding the possibility that human error would
    taint observations. This is because of the subsequent examination of the content
    and data that are gathered. However, survey techniques have not yet been developed
    that can objectively and precisely determine the quantity of PMD that has washed
    ashore. To detect floating trash, some researchers have recommended employing
    a single component with an attached camera. However, using an automated system
    based on machine learning for identifying and categorizing marine debris has some
    additional benefits. A technique like this could speed up the identification of
    large-size plastic garbage and reduce expedition costs while cutting down on search
    time.

