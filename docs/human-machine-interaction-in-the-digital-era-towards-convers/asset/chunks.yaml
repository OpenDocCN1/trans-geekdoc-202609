    # 6. Conclusion


    This research work aims to assess the effects of three main feature estimation
    techniques, namely, statistical features, GLCM textural features, and shape features.
    The effect of combined feature vector was also evaluated in this research. The
    comparison of the effects of different feature sets on the classification recommends
    that the combined feature vector has greater potential to achieve the best performance
    of detection and severity classification of `COVID-19`. This research also proposes
    a new model of classifier called `ASO-GRU-NN`, which uses `GRU` as the base model
    and the optimization of the weights are carried out using CI algorithm called
    `ASO`. This `ASO-GRU-NN` model was found to provide the best performance of classification
    when compared to conventional `CNN` and conventional `RNN` models. This is because,
    the `ASO-GRU-NN` optimally tunes the weights during the training period, resulting
    in reduced training losses and increased accuracy. In the future, the `ASO` can
    be employed in a `CNN` to evaluate its classification performance on image feature
    maps of `COVID-19` CT slices.


