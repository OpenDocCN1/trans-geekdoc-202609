    # 从管理视角看具有交互因素和元素的 7 在线学习技术


    ## 摘要

    在线学习用于以虚拟方式连接学生和教师。教学可以通过互动的方式进行，这种技术可以触及更广泛的学生。随着技术的发展和高等教育的交付，通过`Email`、`Internet`、`World_Web`
    (`WWW`) 和多媒体的在线学习变得越来越流行。诸如大学讲师如何在教学中使用技术等问题。在疫情形势之后，在线学习应用对学生和教师来说变得非常熟悉。它使用户能够更容易地进行通信并方便地管理课堂。在线学习的主要特征是虚拟教室、考虑到学习者的自适应设计和网站布局、提醒、表扬以及额外的相关警报、各种教育资源（包括图像、播客等）、全方位学习原则、可下载供未来复习的在线内容以及不同的测验格式。在本文研究论文中，比较了不同类型的在线学习应用以进行了解。


    **关键词：** 数字化、在线学习和虚拟教室。


    ## 1 引言

    一种交互式网站允许用户通过 `webapp` 输入数据并交互以获得所需的在线学习结果。从遥远地区，学生使用 `internet connection` 通过
    `web browser` 积极参与访问应用程序。根据 SmallBizTrends 的说法，超过 90% 的学生认为在线学习在概念上优于传统学习。为了保持学生的参与度，在线学习社区在网络上使用在线学习应用。用于在线学习的
    Web 程序保存在 `web server` 上。Web 应用程序与在线学习的网站相比，让学生参与交互式任务，包括测试、写文章、进行演示、解决 `math_problem`
    等，并在课堂中保持更数字数字化连接。其中一个例子是 `Zoom`，这是一种视频会议工具，允许用户主持和加入远程会议。通过这种方式，教师和学生可以在不进入实际校楼的情况下参与实时学习环境。


    在线学习的主要特征是虚拟教室、考虑到学习者的自适应设计和网站布局、提醒、表扬以及额外的相关警报、各种教育资源（包括图像、电影等）、全方位学习原则、可下载供未来复习的在线内容以及不同的测验格式。上述
    `Fig.7` 表达了在线学习的各种特征。在当前的疫情时期后，在线课程对学生和教师起着重要作用，并覆盖了广泛的学生群体。用户常用的技术是 Google Classroom、Kahoot
    和 Zoom 在线平台。


    ![7.1 在线学习特征 源：使用 MS Word 工具绘制](img/Fig_7_1.jpg)


    ## 2 Google Classroom

    Google Apps 是教育产品，Classroom 帮助教师管理时间、组织课堂并鼓励学生参与。教师可以使用 Classroom 快速创建和安排作业、提供反馈并与课堂互动。学生可以使用
    Classroom 管理他们的 `Google Drive` 工作、完成并提交，并与教师和同学实时互动。


    ![7.2 Google Classroom 用户界面 源：取自官方 Google Classroom](img/fig7_2.jpg)


    图 7.2 Google Classroom 用户界面 *来源：* 取自官方 Google Classroom


    学习方法：允许高效反馈和在线协作。在线学习的社交属性得到了增强，使教师能够设计协作数字学习活动，并让学生从同学的技能和知识中受益。用户友好：容易设置、登录、接收和提交作业，快捷方便。


    访问：Google Classroom 可以通过所有设备访问，如 PC、笔记本电脑、平板电脑和手机。


    ## 3 Kahoot

    学习过程以游戏术语进行，成为学生个人学习体验的主场所：激发观众好奇心，并使用词云、脑风暴和开放式问题类型评估先验知识。


    学习方法：这是一个基于游戏的学习平台，可检查学生的知识、复习他们的理解，或简单地让学生从常规课程休息。


    用户友好：容易设置、登录、接收和提交作业，快捷方便。


