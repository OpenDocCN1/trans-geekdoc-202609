  trans: '

    心血管疾病是一种严重的心脏病；在全球范围内，它占年度死亡率的三分之一 [1]。许多科学家已经创建了诊断心脏疾病的算法，旨在通过机器学习从现有医学数据集中提取可用数据来改善现状。利用这些诊断技术可以促进医学诊断的临床评估，改进诊断流程，并揭示疾病相关信息，从而拯救更多生命。准确的诊断和有效的治疗可以保护患者生命，为了预测心脏疾病需要进行多项测试。目前已有基于机器学习的方法被用于预测心脏疾病的概率。这些技术中大多数使用公开的数据集来训练和测试模型。这些数据集的可用性提高了基于机器学习的预测分析的效率，并为学者创建增强算法以估计患心脏疾病风险创造了新机会。


    机器学习（`ML`）算法在处理非线性和复杂特征方面更为有效。包括 `KNN`、`SVM` 和 `LR` 在内的多种算法已有效地解决一系列疾病的分类和预测困难，例如心电图（`ECG`）检测的先进指标以及先天性心脏疾病的预测
    [Che et al. 2021]。研究人员提出了多种机器学习模型以改进心脏疾病预测，包括 `KNN`、`LR`、`DT`、`NB`、`FR`、`SVM`
    等。创建一种先进且经济的准确预测心脏疾病的方法至关重要。提出了一种机器学习分类器的集成分类器（Ensemble classifier）用于预测心脏疾病。该系统在包含心脏疾病记录的医学数据集上执行。


    本文结构如下：section 1 讨论介绍，section 2 介绍相关工作，section 3 介绍提出的机制，section 4 介绍实验工作，section
    5 给出结论。


    ## 2. 文献综述


    Ali 等人应用特征选择机制来执行从传感器数据和医学记录中获取的低维数据。为了获得数据集，他们采用考虑数据流和特征排名的特征选择方法。通过使用集成深度学习方法，他们实现了比现有模型更高的准确率。


    Ishaq 等人集成了随机森林进行特征排名并利用 `SMOTE` 技术进行数据平衡。每个模型在平衡数据上的预测准确率远高于未处理的不平衡数据。在包含 `SMOTE`
    生成样本和未处理离群值的数据上，对九种流行算法的预测结果进行了分析。


    Joo 等人考虑了心血管疾病数据集以预测心血管疾病风险。其中，他们通过整合健康检查结果和问卷调查回答从数据集中提取了 25 个变量。医生处方信息对于执行特征选择具有重要意义。


    Umarani 等人通过实现 `XGBoost` 开发了一种基于机器学习的心脏疾病预测机制。采用混合合成少数过采样技术编辑最近邻（`SMOTE-ENN`）、基于密度的空间聚类算法（`DBSCAN`）、心脏疾病预测模型（`HDPM`）、临床决策支持系统（`CDSS`）的组合架构用于异常值检测和训练数据的分布。最后，实现
    `XGBoost` 来预测心脏疾病。


    Abdul 等人应用特征选择机制来执行从传感器数据和医学记录中获取的低维数据。为了获得数据集，他们采用考虑数据流和特征排名的特征选择方法。通过使用集成深度学习方法，他们实现了比现有模型更高的准确率。


    Ishaq 等人集成了随机森林进行特征排名并利用 `SMOTE` 技术进行数据平衡。每个模型在平衡数据上的预测准确率远高于未处理的不平衡数据。在包含 `SMOTE`
    生成样本和未处理离群值的数据上，对九种流行算法的预测结果进行了分析。


    Joo 等人考虑了心血管疾病数据集以预测心血管疾病风险。其中，他们通过整合健康检查结果和问卷调查回答从数据集中提取了 25 个变量。医生处方信息对于执行特征选择具有重要意义。


    Umarani 等人通过实现 `XGBoost` 开发了一种基于机器学习的心脏疾病预测机制。采用混合合成少数过采样技术编辑最近邻（`SMOTE-ENN`）、基于密度的空间聚类算法（`DBSCAN`）、心脏疾病预测模型（`HDPM`）、临床决策支持系统（`CDSS`）的组合架构用于异常值检测和训练数据的分布。最后，实现
    `XGBoost` 来预测心脏疾病。


    Abdul 等人应用特征选择机制来执行从传感器数据和医学记录中获取的低维数据。为了获得数据集，他们采用考虑数据流和特征排名的特征选择方法。通过使用集成深度学习方法，他们实现了比现有模型更高的准确率。


    ## 3. 提出的方法


    所提出的架构包含各种过程，如预处理、应用集成分类器、袋装树、预测。图 17.1 展示了所提出的架构，后续章节将描述所提出的工作流。


    ![图. 17.1 提出的架构](img/fig17_1.jpg)


    图 17.1 提出的架构


    ## 4. 数据预处理


    数据预处理是清洗和转换数据的机制；数据可能是各种格式，包括结构化、半结构化或非结构化。这些数据直接来自输入数据集或通过其他方式提取。数据处理是计算生物学中最复杂且耗时的机器学习任务。这种复杂性由于医学数据集中的不规则、冗余、不必要和噪声信息。在处理数据准备时，“数据创建”和“过滤程序”是必要的。预处理的主要优势是加速执行。数据预处理包括过滤、标准化、实例确定、特征选择、提取、转换等。生成的训练集是通过预处理获得的数据集。


    ### 基于袋装树的集成分类器


    集成分类器属于构建一组分类器并通过权重这些分类器的预测/分类对输入数据点的机器学习算法。与传统的机器学习方法相比，后者尝试从训练集中研究一个假设。集成学习训练多个学习器来解决同一个问题。集成方法尝试创建假设集并将其用于预测。


    袋装树是一种用于准确分类数据的集成方法。它被称为自助聚合（Bootstrap Aggregation）。最初，在带放回的自助样本 `D1`、`D2`到 `Dn`
    上构建基础分类器 `c1`、`c2,..cn`。随后，将所有基础分类器 `c1`、`c2,... cn` 通过多数投票结合以创建最终决策树。因此，这证明了袋装法在医学诊断中起着关键作用，并与任何分类器配合。


    ## 5. 特征选择


    准确的特征选择对于提高分类准确率至关重要。在提出的系统中，来自集成分类器的结果数据用于通过各种属性进行特征选择。选择少数几个关键方面可以在最短的时间内获得准确的预测结果。大多数疾病数据集的样本分布需要更加平衡，较少样本落在正类类别，而更多样本落在负类组。性能评估将在实验和结果部分进行讨论。


    ## 6. 实验结果

