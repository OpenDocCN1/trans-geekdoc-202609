    通过使用 GPS 模块、GSM 模块和加速度计，并将它们连接到作为控制器的 `Arduino Uno`，创建出了一个可以通过短信服务向相关方警报事故的系统。


    ### 高效的事故检测与通知系统


    安装在车辆上的 Arduino 板板带有 GSM 和 GPS 功能。现有的 Android App 是软件组件。在所提的系统中，只有在扫描受害者的指纹后才会触发
    GSM 模块。


    ### 一种利用（IoT）为智能救护车让路的方法


    基于车辆内“黑箱”的理念，可以利用 GPS 和 GSM 技术发现发生的情况。通过控制交通信号，使救护部门能够迅速将受难者送往医院。


    ### 使用 Arduino UNO 进行人员身份验证


    在大多数情况下，指纹扫描涉及对指纹图案的几个方面进行比较，这在对指纹进行匹配分析时是必要的。这些特征由微小的点、以及作为脊纹聚合属性的模式中所的个体特征组成。


    ### GSM–SMS 技术应用的可行研究


    GSM-SMS 技术用于在两个系统之间进行控制、通信和数据传输。基于 GSM-SMS 的通信架构提供短信息包格式，适用于跟踪广泛的应用。


    ## 3. 系统设计与实现


    通过使用指纹传感器访问数据，并使用 GSM 模块自动向受害者的监护人和警察控制室发送短信，我们为需要帮助的人员建立了一个自动识别和通知系统。这种方法主要旨在加速寻找在急救车内发现的事故受害者基本信息的过程。检查网络连接是否以及以及电源可靠可能是启动此程序的第一步。只需在设备中使用
    `R307` 指纹传感器扫描受害者的指纹，LCD 屏幕上就会显示出受害者的姓名、紧急联系电话信息和地址。随后，将使用必要信息立即向指定的紧急联系人发送短信。为了报告道路交通事故，系统被设计为自动触发并向警察控制中心发送
    E-Service 短信投诉。这种方法是使用一个带有内置 SIM 卡的 GSM 模块 `SIM900A` 来联系患者家属和警察控制室，它提供了一个使用 GSM
    移动电话技术到网络的无线数据连接。采用该系统最大的益处是对于所有救护车来说安装都非常方便。在治疗未识别的事故受害者之前无需等待。信息交换机制变得更加快速和自动化。


    ## 4. 框图


    从[图 6.1]可以看出，此设备使用的微控制器是 `Arduino Uno` (`ATmega328P`)。该设备由 `+5v` 直流电源供电。`Arduino`
    微控制角落有一个电源接口。闪存、EEPROM 和 SRAM 是此处提供的板载内存。可以使用 `Arduino IDE` 软件执行我们系统所需的程序。随后，该程序可以通过电源插头线上传到
    `Arduino` 微控制器。`Arduino uno` 充当指纹传感器 (`R307`) 和 GSM 模块 (`SIM900A`) 之间的接口，因为它存储了采集到的指纹和人员数据，这些数据在扫描指纹时需要进行匹配。使用
    `R307` 指纹传感器扫描受害者的指纹以获取其基本信息，然后利用这些信息通知受害者的监护人和警察控制中心。该指纹传感器模块通过 `TTL UART` 通道直接连接微控制器。如果受害者的指纹与现有数据匹配，`Arduino
    Uno` 的程序将会将受害者的姓名和紧急联系电话显示在 `2x16 LCD` 显示屏上。


    ![图 6.1 未识别事故受害者检测与通知系统框图](img/fig6_1_C.jpg)


    数据显示在 LCD 上后，带有内置 SIM 卡的 GSM 模块利用必要信息将短信发送给受害者的监护人和警察控制中心。GSM-SMS 通通信架构提供短信息包格式，适用于跟踪广泛的应用。GSM-SMS
    技术用于在两个系统之间进行控制、通信和数据传输。此处。


    ## 5. 结果与讨论


    在数据在 LCD 上显示后，指纹扫描。


    ![图 6.2 指纹传感器在硬件套件中的位置](img/fig6_2_C.jpg)


    图 6.2 指纹传感器在硬件套件中的位置


    ![图 6.3 通过 GSM 模块发送](img/fig6_3_C.jpg)


    图 6.3 通过 GSM 模块发送


    ## 6. 结论展望


    “未识别事故受害者检测与通知系统”原型已经构建。通过扫描受害者的指纹，该原型可以识别受害者并联系受害者的监护人和警察控制中心。在现有系统的基础上，可以通过传感器持续监测受害者的生命体征（如心率、血压和脉搏）增加更多记录。然后这些数据将通过实时服务器传递到医院。


    ## 致谢


    诚挚地感谢我的导师 `V. Dinesh` 先生在整个过程中提供的指导和监督。此外感谢 Easwari 工程学院电子与通信系的全体教师。


