- raw: "As demonstrated in [Fig. 14.2,](#ch14.xhtml#fig14_2) this approach uses the\
    \ YOLOv5 network structure for both its training and identification networks,\
    \ with the Cross Stage Partial Network (CSPNet) acting as the network’s central\
    \ node. The issue of needing numerous inference calculations is solved with CSPNet.\
    \ By combining the cross-stage hierarchical structure, CSPNet separates the base\
    \ layer’s feature map into two portions before extracting the picture features.\
    \ This approach has the benefit of decreasing the amount of repetitive gradient\
    \ data, lowering the number of computations, speeding up the equipment, and not\
    \ impacting the model’s correctness.YOLOv5 additionally uses the Feature Pyramid\
    \ network topology to fully utilize the feature information retrieved from various\
    \ levels (FPN).The new feature map is constructed by combining the source mapping\
    \ on the left with the levelappropriate feature maps that were created from the\
    \ downsampling of the input image, following a process of upsampling from top\
    \ to bottom. By integrating shallow data with deep data, this structure improves\
    \ the effect while also enhancing the magnitude of the produced feature map. Following\
    \ the FPN feature combinations, the Path Aggregation Network (PAN) framework is\
    \ built on top of this base. After convolutional downsampling, the merged bottom\
    \ map is combined with the scale-matched feature map from the left FPN structure\
    \ to create 3 output feature maps of varying magnitudes. With this combination,\
    \ the model’s feature extraction will be more accurate and strong location features\
    \ will be communicated from the ground up.\n\n![Fig. 14.2 YOLOv5 network structure](images/fig14_2_C.jpg)\n\
    \n[Fig. 14.2 YOLOv5 network structure](#ch14.xhtml#R_fig14_2)\n\n#### Feature\
    \ Map Attention Layer Structure\n\nThere are numerous convolutional layers in\
    \ YOLOv5. Each component’s convolution has a unique depth and width. The depth\
    \ and width coefficients of YOLOv5s are 0.33 and 0.5, respectively. By controlling\
    \ the number of stacking layers, the depth index controls the depth of the network.\
    \ The width coefficient, which affects both the network’s width and the quantity\
    \ of convolution output channels, controls this. By limiting the depth and width,\
    \ the total quantity of variables in the network can be controlled. It is recommended\
    \ to add an FMA layer in between backbone as well as neck to improve the network\
    \ structure that depends on YOLOv5s, as shown in [Fig. 14.3.](#ch14.xhtml#fig14_3)The\
    \ attention feature map, which is shown in [Fig. 14.3](#ch14.xhtml#fig14_3) as\
    \ having four channels, and the input feature map are both weighted in the FMA\
    \ layer to obtain the features for the four groups. Then, 1 x 1 convolution is\
    \ used to downsample the quantity of channels with in feature map for every group.\
    \ After channel downsampling, the feature maps from the four groups are finally\
    \ concatenated to create a new output feature map. Since the attention layer of\
    \ said feature maps’ channel downsampling multiplicity is the same as that of\
    \ the attention feature map, the output and the input feature maps are of the\
    \ same size.\n\n![Fig. 14.3 Structure of feature map attention layer](images/fig14_3_C.jpg)\n\
    \n[Fig. 14.3 Structure of feature map attention layer](#ch14.xhtml#R_fig14_3)\n\
    \n#### Detection Process\n\nThe detection procedure follows the following flow:\n\
    \n*   *Step 1:* Using the test image as input, extract the image’s features using\
    \ the backbone.\n\n*   *Step 2:* Get the feature maps of the different depths\
    \ of the backbone network.\n\n*   *Step 3:* In order to combine features, the\
    \ retrieved multiscale feature maps are fed into the FPN structure. Bilinear interpolation\
    \ is used as an improvement to the feature map upsampling.\n\n*   *Step 4:* The\
    \ multi-scale feature maps are supplied into the PAN framework for reliable feature\
    \ localization following FPN fusion. The outcomes of the identification of 3 feature\
    \ maps with different scales are then obtained.\n\n*   *Step 5:* The final results\
    \ will be generated and the detecting boxes and classifications in the original\
    \ input photographs will be labeled once nms has processed all feature map detecting\
    \ results.\n\n*   *Step 6:* To finish identifying each frame of the movie, redo\
    \ steps 1 through 5 and extract the next frame of the visual to be identified,\
    \ as illustrated in [Fig. 14.4.](#ch14.xhtml#fig14_4)\n\n![Fig. 14.4 Frame by\
    \ frame detection](images/fig14_4_C.jpg)\n\n[Fig. 14.4 Frame by frame detection](#ch14.xhtml#R_fig14_4)\n\
    \n### 3.3 Quantification of Coastal Debris\n\nThe beach debris identification\
    \ and classification performed well using the object detection model, but it was\
    \ unable to predict the types of debris present in the covered region. To solve\
    \ the issue, the debris classes of the research region were estimated using the\
    \ image segmentation method. The predicted area of the debris items is referred\
    \ to as the covered area. The segmentation model was trained using the patch pictures\
    \ created by the survey’s extraction of images from a movie. A commercial geographic\
    \ information system (GIS) tool was utilized to label the debris pieces. A polygon\
    \ was produced in each patch image by joining the vertices along the outer edge\
    \ of the debris object. In order to set each polygon apart from the background\
    \ in the images, it was designated as a piece of trash. The tagged items were\
    \ divided into seven groups for the segmentation model’s training, comprising\
    \ Plastic, glass, fishing gear, Thermopolis, rubber, metal and undefined. A pair\
    \ of photos composed of the source patch picture and a labeled picture were also\
    \ uploaded as one dataset. Utilizing the picture segmentation model U-Net, which\
    \ is based on a fully convolutional network, the trash classes of the enclosed\
    \ region were estimated (FCN). In the U-Net, a highly symmetric U-shaped design,\
    \ skip connections are utilized to instantly link each level’s output from the\
    \ encoder to the corresponding level of the decoder. The model communicates the\
    \ combined feature map to the appropriate decoders after concatenating the decoder\
    \ feature maps which was upsampled *with* it. Even with minimal amounts of training\
    \ data, the U-Net model performed well.\n\n## 4\\. Results and Discussion\n\n\
    On the testing set, the model’s performance was assessed employing the intersection\
    \ over union (IoU) and mean average precision (mAP). The network model’s predictions\
    \ and the actual survey findings for the entire Dasa-port beach were compared\
    \ for confirmation.\n\n*   The IoU assesses the accuracy with which projected\
    \ bounding boxes correspond to the position of an item, which is defined as,\n\
    \n    (1)  \n\n    $$\\\\text{IoU} = \\\\frac{Area\\\\ of\\\\ Overlap}{Area\\\\\
    \ of\\\\ Union}$$  \n\n    As the IoU increases, so does the overlapping among\
    \ the two bounding boxes. 0.5 IoU thresholds were used to examine mAP and evaluate\
    \ the performance of the model. IoU = 0.5 is true when the overlapping area of\
    \ the two boxes exceeds 50% of the total area, and any value less than this is\
    \ considered false.\n\n    The mAP is calculated by calculating the Average Precision\
    \ (AP) for each class and then averaging it across numerous courses.\n\n    (2)\
    \  \n\n    $$\\\\text{mAP} = \\\\frac{1}{\\\\text{N}}\\\\sum\\\\limits\\_{\\\\\
    text{i} = 1}^{\\\\text{N}}\\\\text{AP}\\_{\\\\text{i}}$$  \n\n    The mAP takes\
    \ into account both false positives (FP) and false negatives (FN), and accounts\
    \ for the trade-off between precision and recall (FN). Due to this characteristic,\
    \ the majority of detecting applications can use mAP as a measure."
  fmt: "\nAs demonstrated in [Fig. 14.2,](#ch14.xhtml#fig14_2) this approach uses\
    \ the `YOLOv5` network structure for both its training and identification networks,\
    \ with the Cross Stage Partial Network (`CSPNet`) acting as the network’s central\
    \ node. The issue of needing numerous inference calculations is solved with `CSPNet`.\
    \ By combining the cross-stage hierarchical structure, `CSPNet` separates the\
    \ base layer’s feature map into two portions before extracting the picture features.\
    \ This approach has the benefit of decreasing the amount of repetitive gradient\
    \ data, lowering the number of computations, speeding up the equipment, and not\
    \ impacting the model’s correctness.\n\n`YOLOv5` additionally uses the `Feature\
    \ Pyramid` network topology to fully utilize the feature information retrieved\
    \ from various levels (`FPN`). The new feature map is constructed by combining\
    \ the source mapping on the left with the level-appropriate feature maps that\
    \ were created from the downsampling of the input image, following a process of\
    \ upsampling from top to bottom. By integrating shallow data with deep data, this\
    \ structure improves the effect while also enhancing the magnitude of the produced\
    \ feature map. Following the `FPN` feature combinations, the Path Aggregation\
    \ Network (`PAN`) framework is built on top of this base. After convolutional\
    \ downsampling, the merged bottom map is combined with the scale-matched feature\
    \ map from the left `FPN` structure to create 3 output feature maps of varying\
    \ magnitudes. With this combination, the model’s feature extraction will be more\
    \ accurate and strong location features will be communicated from the ground up.\n\
    \n![Fig. 14.2 YOLOv5 network structure](images/fig14_2_C.jpg)\n\n[Fig. 14.2 YOLOv5\
    \ network structure](#ch14.xhtml#R_fig14_2)\n\n### Feature Map Attention Layer\
    \ Structure\n\nThere are numerous convolutional layers in `YOLOv5`. Each component’s\
    \ convolution has a unique depth and width. The depth and width coefficients of\
    \ `YOLOv5s` are `0.33` and `0.5`, respectively. By controlling the number of stacking\
    \ layers, the depth index controls the depth of the network. The width coefficient,\
    \ which affects both the network’s width and the quantity of convolution output\
    \ channels, controls this. By limiting the depth and width, the total quantity\
    \ of variables in the network can be controlled. It is recommended to add an `FMA`\
    \ layer in between backbone as well as neck to improve the network structure that\
    \ depends on `YOLOv5s`, as shown in [Fig. 14.3.](#ch14.xhtml#fig14_3) The attention\
    \ feature map, which is shown in [Fig. 14.3](#ch14.xhtml#fig14_3) as having four\
    \ channels, and the input feature map are both weighted in the `FMA` layer to\
    \ obtain the features for the four groups. Then, `1 x 1` convolution is used to\
    \ downsample the quantity of channels with in feature map for every group. After\
    \ channel downsampling, the feature maps from the four groups are finally concatenated\
    \ to create a new output feature map. Since the attention layer of said feature\
    \ maps’ channel downsampling multiplicity is the same as that of the attention\
    \ feature map, the output and the input feature maps are of the same size.\n\n\
    ![Fig. 14.3 Structure of feature map attention layer](images/fig14_3_C.jpg)\n\n\
    [Fig. 14.3 Structure of feature map attention layer](#ch14.xhtml#R_fig14_3)\n\n\
    ### Detection Process\n\nThe detection procedure follows the following flow:\n\
    \n*   **Step 1:** Using the test image as input, extract the image’s features\
    \ using the `backbone`.\n*   **Step 2:** Get the feature maps of the different\
    \ depths of the `backbone`.\n*   **Step 3:** In order to combine features, the\
    \ retrieved multiscale feature maps are fed into the `FPN` structure. Bilinear\
    \ interpolation is used as an improvement to the feature map upsampling.\n*  \
    \ **Step 4:** The multi-scale feature maps are supplied into the `PAN` framework\
    \ for reliable feature localization following `FPN` fusion. The outcomes of the\
    \ identification of 3 feature maps with different scales are then obtained.\n\
    *   **Step 5:** The final results will be generated and the detecting boxes and\
    \ classifications in the.\n*   **Step 6:** To finish identifying each frame, `nms`\
    \ has processed all the next frame, as illustrated in [Fig. 14.4.](#ch14.xhtml#fig14_4)\n\
    \n![Fig. 14.4 Frame by detection](images/fig14_4_C.jpg)\n\n[Fig. 14.4 Frame by\
    \ detection](#ch14.xhtml#R_fig14_4)\n\n### 3.3 Quantification of Coastal Debris\n\
    \nThe beach identification performed well using the object model, but it was unable\
    \ to predict the types. To solve the issue, the debris classes were estimated\
    \ using the segmentation method. The tagged items were divided into seven groups:\
    \ `Plastic`, `glass`, `fishing gear`, `Thermopolis`, `rubber`, `metal`, and `undefined`.\
    \ A pair of photos composed of source were also uploaded. Utilizing the segmentation\
    \ model `U-Net`, which is based on a fully convolutional network (`FCN`), the\
    \ enclosed region were estimated. In `U-Net`, a highly symmetric U-shaped design,\
    \ skip connections are utilized to instantly link each level’s output from the\
    \ encoder to the corresponding level of the decoder. Even with minimal amounts\
    \ of training data, the-model performed well.\n\n## 4. Results and Discussion\n\
    \nOn the testing set, the model’s performance was assessed employing the intersection\
    \ over union (`IoU`) and mean average precision (`mAP`). The network model’s predictions\
    \ and the actual survey findings for the entire Dasa-port beach were compared\
    \ for confirmation.\n\n*   The `IoU` assesses the accuracy with which projected\
    \ bounding boxes correspond to the position of an item, which is defined as:\n\
    \n    (1)\n\n    $$\\text{IoU} = \\frac{Area\\ of\\ Overlap}{Area\\ of\\ Union}$$\n\
    \n    As the `IoU` increases, so does the overlapping among the two bounding boxes.\
    \ `0.5` `IoU` thresholds were used to examine `mAP`. `IoU = 0.5` is true when\
    \ the overlapping area of the two boxes exceeds 50% of the total area, and any\
    \ value less than this is considered false.\n\n*   The `mAP` is calculated by\
    \ calculating the Average Precision (`AP`) for each class and then averaging it\
    \ across numerous courses.\n\n    (2)\n\n    $$\\text{mAP} = \\frac{1}{\\text{N}}\\\
    sum\\limits_{\\text{i} = 1}^{\\text{N}}\\text{AP}_{\\text{i}}$$\n"
  trans: "\n\n如图 14.2  所示，该方法在训练和识别网络中均使用了 `YOLOv5` 网络结构，其中跨阶段部分网络（`CSPNet`）作为网络的中心节点。需要大量推理计算的问题通过\
    \ `CSPNet` 得到了解决。通过结合跨阶段分层结构，`CSPNet` 在提取图像特征之前将基础层的特征图分为两个部分。这种方法的处处是减少了重复梯度数据量，降低了计算次数，加快了设备运行，且不影响模型的准确性。\n\
    \n`YOLOv5` 此外使用了特征金字塔（`Feature Pyramid`）网络拓扑来充分利用从不同层次（`FPN`）检索到的特征信息。新的特征图是通过左侧源映射与输入图像下采样创建的相应层特征图组合成的，遵循了从上到下的上采样过程。通过将浅层数据与深层数据相结合，该结构在提高效果的同时也增强了生成特征图的幅度。在\
    \ `FPN` 特征组合之后，在此基础上构建了路径聚合网络（`PAN`）框架。在卷积下采样后，合并的底部图与左侧 `FPN` 结构的尺度匹配特征图相结合，创建出\
    \ 3 个不同幅度的输出特征图。通过这种组合，模型的特征提取将更加准确，强有力的定位特征将将底部向上进行传递。\n\n![图 14.2 YOLOv5 网络结构](img/fig14_2_C.jpg)\n\
    \n图 14.2 YOLOv5 网络结构\n\n### 特征图注意力层结构\n\n`YOLOv5` 中存在许多卷积层。每个组件的卷积具有独特的深度和宽度。`YOLOv5s`\
    \ 的深度和宽度系数分别为 `0.33` 和 `0.5`。通过控制堆叠层数，深度索引控制网络的深度。宽度系数影响网络的宽度和卷积输出通道的数量，并控制这一点。通过限制深度和宽度，可以控制网络中的总变量数量。建议在骨干（backbone）和颈（neck）之间添加\
    \ `FMA` 层，以改进依赖 `YOLOv5s` 的网络结构，如图 14.3.所示。如图图 14.3 所示，具有四个通道的注意力特征图与输入特征图在 `FMA`\
    \ 层中均被加权，以获得四组特征。然后，使用 `1 x 1` 卷积对每组特征图中的通道数量进行下采样。通道下采样后，最后将四组的特征图拼接在一起，创建一个新的输出特征图。由于所述特征图的通道下采样倍数与注意力特征图的倍数相同，因此输出和输入特征图的大小相同。\n\
    \n![图 14.3 特征图注意力层结构](img/fig14_3_C.jpg)\n\n图 14.3 特征图注意力层结构\n\n### 检测过程\n\n检测程序遵循以下流程：\n\
    \n*   **步骤 1：** 使用测试图像作为输入，使用 `backbone` 提取图像特征。\n*   **步骤 2：** 获取 `backbone`\
    \ 不同深度的特征图。\n*   **步骤 3：** 为了合并特征，将检索到的多尺度特征图输入 `FPN` 结构。使用双线性插值作为特征图上采样的改进。\n\
    *   **步骤 4：** 在 `FPN` 融合后，将多尺度特征图输入 `PAN` 框架。合并的底部图与左侧 `FPN` 结构的尺度匹配特征图相结合，以创建出\
    \ 3 个具有不同幅度的输出特征图。\n*   **步骤 5：** 生成最终结果，即检测框和分类。\n*   **步骤 6：** 通过 `nms` 完成每一帧的识别，如图\
    \ 14.4 所示\n\n![图 14.4 检测帧](img/fig14_4_C.jpg)\n\n图 14.4 检测帧\n\n### 3.3 海岸垃圾量化\n\
    \n使用目标模型检测效果良好，但它无法预测类型。为了解决这个问题，使用了分割方法估计垃圾类别。标记的物品被分为七组：`Plastic`（塑料）、`glass`（玻璃）、`fishing\
    \ gear`（渔具）、`Thermopolis`（热玻璃）、`rubber`（橡胶）、`metal`（金属）和 `undefined`（未定义）。还上传了一对源照片。利用基于全卷积网络（`FCN`）的分割模型\
    \ `U-Net` 估计了封闭区域。即使在训练数据很少的情况下，模型性能良好。\n\n## 4. 结果与讨论\n\n在测试集上，通过交并比（`IoU`）和平均精度（`mAP`）对模型进行了评估。将模型的预测结果与整个\
    \ Dasa-port 海滩的实际调查结果进行了比较。\n\n*   `IoU` 评估预测框位置的准确性，其定义为：\n\n    (1)\n\n    $$\\\
    text{IoU} = \\frac{重叠面积}{并集面积}$$\n\n    随着 `IoU` 的增加，两个框之间的重叠程度也随之增加。使用 `0.5`\
    \ `IoU` 阈值来检查 `mAP`。\n\n"
