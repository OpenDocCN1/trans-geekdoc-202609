- raw: 'This study by Muhammad Hameed Siddiqi,Khurshed Asghar, Umar Draz,4Amjad Ali,
    Madallah Alruwaili, Yousef Alhwaiti, Saad Alanazi, M. M. Kamruzzaman presented
    a novel approach for the detection of fraudulent images using the Discrete Wavelet
    Transform, image splicing, and histograms of robust discriminative local binary
    patterns. In the end, a support vector machine is used to build an image forgery
    detection model.


    Ali Retha Hasoon Khayeat, Ahmed Abdulhadi Al-Moadhen and Mustafa Ridha Hassoon
    Khayyat used the semantic segmentation of the decomposed image.


    Yuan Rao; Jiangqun Ni proposed a method that extracts dense features from the
    test pictures using the pre-trained CNN as a patch descriptor. The final discriminative
    features for SVM classification are obtained by investigating feature fusion techniques.


    Souradip Nath & Ruchira Naskar proposed a blind image splicing detection method
    that uses a fully connected classifier network to distinguish between authentic
    and spliced images as its backbone and a deep convolutional residual network architecture
    as its front end.


    ## 3\. Conclusion


    In this review various Image Splicing forgery techniques were studied and summarised.
    The differences in the image properties or camera characteristics are the primary
    source in identifying the forged sections of the photographs because the spliced
    images are created from distinct images. We further categorise the pixel-based
    and statistically based methods into noise inconsistencies, illumination colour
    estimation, statistical aspects of the image, and other feature-based approaches.
    The literature may contain a variety of strategies, but each one has drawbacks.
    Notwithstanding its shortcomings, the research topic of image forensics holds
