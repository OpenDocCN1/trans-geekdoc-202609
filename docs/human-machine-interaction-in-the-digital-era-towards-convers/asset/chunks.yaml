    The NSL-KDD data collection was developed to address issues with the malware and
    data that comes inside as intruded data was frequently brought up in the literature.
    Even though it still exhibits some undesirable traits, it is now a recognized
    benchmark dataset. NSL-KDD is nevertheless a trustworthy option for detecting
    malware detection research due to the missing values of accessible IDS datasets
    and the difficulties in gathering required data. The collection has about 5, 000,
    000 records, which distinguishes it as acceptable for machine learning while also
    not being excessively big to make researchers have to choose random samples from
    the set. The outcomes are so easy to compare. In comparison to the KDD’99 dataset,
    the NSGeocoder has been cleaned of redundant data to avoid bias in ML algorithms.
    The shortage of trustworthy and sufficiently updated cybersecurity datasets led
    to the creation of the Intrusion Detection Evaluation Dataset - CICIDS2017 . The
    IDS data that are used for the researchers typically have a number of drawbacks
    of their own, such as a lack of attack variety, lack of traffic diversity, and
    a lack of appropriate characteristics. By studying 25 users behaviour with a wide
    variety of protocols, CICIDS2017 provide data with real network traffic. Then
    the data was collected over a period of five days, of which four were occupied
    by attacks on the model setup.


    In addition to being one of the newest datasets accessible to academics, CICIDS2017
    includes more than 80 network flow features. [Figure 12.1](#ch12.xhtml#fig12_1)


