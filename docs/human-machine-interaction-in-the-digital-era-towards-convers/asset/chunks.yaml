    (6)


    $$~Entropy~ = - \underset{i}{\sum^{}}\\underset{j}{\sum^{}}g\_{i,j}\log_{2}g\_{i,j}}$$


    对比度（Contrast）计算灰度共生矩阵（GLCM）与图像空间频率之间的差异。它定义为矩阵中像素最大值与最小值之间的差。可以使用公式(7)估计的对比度。


    (7)


    $$~Contrast~ = \underset{i}{\sum^{}}\\underset{j}{\sum^{}}{(i - j)}^{2}gi,j$$


    相关性（Correlation）是指图像灰度线性依赖关系的度量。相关性特征可以使用公式(8)估计。


    (8)


    $$~Correlation~ = \frac{\underset{i}{\sum^{}}\\underset{j}{\sum^{}}(ij)g\_{i,j}
    - ~mean~\_{g}}{SD\_{g}}$$


    其中`SD[g]`和`mean[g]`是`g`的标准差和平均值。


    同性（Homogeneity）被称为逆差分矩（Inverse Difference Moment）。它通过考虑元素对之间灰度差异越小则赋予越高值，来估计图像的同性。可以使用公式(9)测量。


    (9)


    $$~Homogeneity~ = \underset{i}{\sum^{}}\\underset{j}{\sum^{}}\\frac{1}{1 + {(i
    - j)}^{2}}g\_{i,j}}$$


    ### 3.3 感染区域特征


    形状特征是描述病变外观的物理维度度量。从感染区域提取的形状特征包括质心、面积、周长、离心率和方向。质心（Centroid）是区域的质中心，以 1byQ 向量返回，其中
    Q 表示图像的维度。面积是区域内的实际像素数量，以标量值返回。周长是区域的边界距离，以标量返回。离心率（Eccentricity）定义为病变焦点之间的距离与主轴长度之比。方向（Orientation）是
    x 轴相对于与区域二阶相同的椭圆主轴扫过的角，以标量返回。


    ## 4. 提的 ASO-GRU-NN 分类模型


    #### 4.1 ASO 优化器


    ASO 是一种新型的物理启发的计算元启发式优化方法。ASO 受基础分子动力学的启发而制定。该算法用于解决全局优化问题[19]。在本工作中，ASO 优化器用于在训练阶段优化
    GRU-NN 模型的权重。在 ASO 中，搜索空间中原子的位置代表通过其质量衡量的解集（神经网络权重），质量越大的解越优异，反之亦然。为了解决这一无约束优化问题，考虑一个包含
    N 个原子的种群。本应用假设原子种群为输入层中 N 个神经元的`N`个输入数据。第`i`个原子的位置可以如公式(10)所示：


    (10)


    `x[i]`  = [`x[i]¹,*x[i]²,…,*x[i]^(D)]`,  `i`  = 1,  2, …,  `N`


    其中`x[i]^d` (`d` = 1, 2, …, `D`）代表`D`维搜索空间中第`i`个原子的第`d`个位置分量。对每个种群进行适应度评估。该优化中用于适应度评估的目标函数是均方误差（MSE）函数。种群的最小
    MSE 值是最佳拟合值`F[best]`，如公式(11)所示：


    (11)


    `F[best]`  = min `F`  = min `MSE`


    另一方面，最差拟合值`F[worst]`可以如公式(12)所示：


    (12)


    `F[worst]`  = max `F`  = max `MSE`


    其中， $MSE = \frac{1}{n}\underset{n}{\overset{i = 1}{\sum^{}}}\left( {Y_{pred} -
    Y_{actual}} \right)^{2}$，`Y_{pred}`是预测类别，`Y[actual]`是实际类别，`n`是数据样本的总数。获得`F[best]`的权重矩阵（原子种群集）`x[best]`是神经网络的最优权重。在最简单的阶段，第`i`个原子的质量可以通过涉及适应度值的以下公式(13)计算得出：


    (13)


    $$M_{i}(t) = \frac{m_{i}(t)}{\underset{N}{\overset{j = 1}{\sum^{}}}m_{j}(t)}$$


    其中，$m_{i}(t) = e^{\frac{F_{i}(t) - F_{bert}(t)}{F_{bert}(t)}}$，`F_{i}(t)`是第`i`个原子的适应度。在探索阶段，第`i`个原子与许多原子交互。在开发阶段，第`i`个原子与少数原子交互。这个`k`随着`t`的增加而减小。


    (14)


    $$k(t) = \underset{N}{\overset{j = 1}{\sum^{}}}$$


    其中，`t`是迭代次数，`T`是最大迭代次数。第`i`个原子来自其余原子的力如公式(15)所示：


    (15)


    $$F_{i}^{d}(t) = \underset{j \in k}{\sum^{}}rand_{j}^{d}(t)$$


    这里，`rand[j]`是在`[0,1]`内生成的随机数。第`i`个原子来自最佳拟合原子的几何约束由公式(17)表示：


    (17)


    `G[i]^d(t)`  = `λ(t)(x[best]^d(t)-x[i]^d(t))`


    其中`x[i]^d(t)`表示第`t`次迭代中第`i`个原子的位置，`x^d[best]`表示第`t`次迭代中最佳原子的位置，`λ`代表拉格朗日乘子。


    然后使用作用力和几何约束通过公式(18)估计原子的加速度：


    (18)


    $$a_{i}^{d}(t) = \frac{F_{i}^{d}(t)}{M_{i}^{d}(t)} + \frac{G_{i}^{d}(t)}{M_{i}^{d}(t)}$$


    使用公式(19 和 20)更新下次迭代（t+1）原子的速度和位置。


    (19)


    `v[i]^d(t+1) = rand[i]^d(t)*v[i]^d(t) + a[i]^d(t)`


    (20)


    `x[i]^d(t+1) = x[i]^d(t) + v[i]^d(t+1)`


    #### 4.2 COVID-19 严重程度分类的 GRU-NN 模型


    最终的最佳方案作为权重*W*赋予 GRU-NN 分类模型。


