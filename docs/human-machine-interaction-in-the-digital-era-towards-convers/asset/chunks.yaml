    # 6 Detection and Notification System in Emergency Vehicles for Unidentified Accident
    Victims


    V. Dinesh^([^(11)](#fn11))


    Assistant Professor, Easwari Engineering College, Anna University Chennai


    R. Krithika^([^(12)](#fn12))


    Easwari Engineering College, Anna University Chennai


    S. Kirti Sri³


    Easwari Engineering College, Anna University Chennai


    DOI: [10.1201/9781003428466-6](https://dx.doi.org/10.1201/9781003428466-6)


    **Abstract** The intent here is to shorten the time taken to detect the basic
    information of the unidentified accident victims and notify the patient’s guardian
    and police control room regarding the current situation. This device is installed
    in emergency vehicles. The implemented design stores a specific amount of data
    about each individual along with their fingerprints so that the data can be quickly
    accessed by scanning the unidentified accident victim’s fingerprint through the
    fingerprint scanner. Following that, utilizing the data acquired, the victim’s
    guardian and the police control room are informed regarding the present status
    via an SMS notification system using a GSM module.


    **Keywords:** Notification, Fingerprint, Emergency vehicle SMS, GSM


    ## 1\. Introduction


    India is the second most populated country, and as a result, several essential
    aids and emergency medical procedures are disregarded. Every day, several accidents
    take place. When we come across an unfamiliar person, we always wait for them
    to become conscious before attempting to identify their blood relatives. This
    may possibly be more dangerous if the person has already been missing for some
    time. The goal here is to prevent having to wait while notifying the patient’s
    guardian and the police station. The victim’s fingerprint is scanned in order
    to notify those in need. According to the method described in this system, a GSM
    module and a fingerprint sensor R307 are added to the emergency vehicle so that
    the victim can be quickly identified after an accident by having their fingerprint
    scanned, having access to their data, and SMS notifications are sent to the appropriate
    parties. The data which is needed to identify the victim is already stored in
    the memory. The fingerprint is scanned using the optical fingerprint sensor R307.
    The device contains a built-in SIM within the GSM module that uses mobile telephone
    technology to contact patients’ family members and the police control room. The
    R307 fingerprint sensor, LCD display, nodemcu, and the GSM module are interfaced
    through the Arduino Uno microcontroller.


    ## 2\. Literature Review


    ### 2.1 Automatic Messaging System for Vehicle Tracking and Accident Detection'
