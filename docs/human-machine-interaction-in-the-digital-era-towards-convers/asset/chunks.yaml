    99.89%。该表中少数准确率值低于 90%，其中性能最低的到了 6% 以下。对于更复杂的拓扑结构，这种趋势将会持续。表 12.4 中的最佳准确率为 96.83%，对应批大小为
    10，以及 `tanh` 和 `rms prop` 的组合。只有 50% 的配置达到了 90%。双曲正切再次位居贡献准确率因素的榜首。`tanh` 函数在十种备选配置中出现了六次（表
