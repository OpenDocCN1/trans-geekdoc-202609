    # 16 使用 CNN 进行西瓜成熟度检测


    A. T. Madhavi^(³³)

    助理教授，电子与通信工程系，Easwari Engineering College, 钦奈，印度


    K. Rahimunnisa^(³⁴)

    副教授，电子与通信工程系，Easwari Engineering College, 钦奈，印度


    E. Thilagavathy^(³⁵)

    学生，电子与通信工程系，Easwari Engineering College, 钦奈，印度


    N. Vithiya^(³⁶)

    学生，电子与通信工程系，Easwari Engineering College, 钦奈，印度


    DOI: [10.1201/9781003428466-16](https://dx.doi.org/10.1201/9781003428466-16)


    **摘要** 西瓜是一种具有价值且保质期较长的水果，其成熟度对于口感、质量和保鲜至关重要。评估成熟度的传统方法既耗时又容易出错。本研究使用 Jupyter
    和若干库，利用 CNN 模型将西瓜成熟度划分为未成熟、成熟和过熟。`MobileNetV2` 网络表现最佳，准确率达到 95.97%。


    **关键词：** CNN-卷积神经网络，西瓜，MobileNetV2


    ## 1. 引言


    西瓜是一种巨大的水果，最大直径为 25 厘米，最大重量为 15 公斤。它的形状呈椭圆形或球形，光滑的深绿色外皮偶尔会出现错误的浅绿色斑块。它含水量高，蛋白质或脂肪较少，因此热量低。人们很难用肉眼甚至通过触摸来判断其成熟度。卷积神经网络（`CNN`）是一种流行的方法，因为它们在不需要人类的情况下从原始图像中提取有用信息方面具有卓越的效果。本研究侧重于使用深度学习获取西瓜图像并进行分析，以便使用非无损检测技术检测其成熟阶段。


    ## 2. 文献综述


    Yinghao [Zhang et al., 2018] 针对分类结果进行了 ELM 和 SVM 的比较，达到了 92% 的准确率。[DengfeiJie
    et al., 2019] 使用了 VIS/NIR 透射技术，并利用峰值 1 与峰值 2 强度的比例（`RPP`）和归一化差异强度（`NDIP`）方法创建光谱特征分析分类技术来识别西瓜的成熟阶段。


    [Edwin R. Arboleda, et al., 2020] 采用近红外光谱（`NIRS`）来确定西瓜的成熟度。[Ketsarin et al., 2021]
    提出了一种使用听觉信号、图像处理、重量、果皮设计、声音信号和 ML 技术来检测西瓜甜度的无损方法，并实现了 92% 的准确率。


    [Anthony B. Villa, et al., 2022] 研究了基于安卓的应用程序使用深度学习 `CNN` 模型进行西瓜识别以对西瓜的成熟度进行分类的技术。


    ## 3. 数据与变量


    数据集通过使用安卓手机相机在距离样本顶部约 40 到 50 厘米的垂直距离拍摄图像而创建。顶部、底部和侧卧面均被纳入数据集考虑。本研究使用的 300 张图像被分为三类（未成熟
    100 张，成熟 100 张，过熟 100 张），可以从西瓜中看到（此处应为从不同角度拍摄的图像）。图像数据集的 80% 用于训练模型，20% 用于测试。


    ## 4. 提议方法


    为了使用无损方法对西瓜的成熟度进行分类，使用了 `CNN`。在使用无损方法对西瓜的成熟度进行分类，使用了 `CNN`。通过比较 `CNN` 模型并分析高准确率、低损失和较短编译时间的模型，选择了最佳的西瓜成熟度模型。


    ![Fig. 16.1](img/fig16_1)


    图 16.1 流程图


    在使用训练图像数据集之前，手动去除了图像的背景，并将生成的图像作为 `CNN` 的输入。卷积神经网络（`CNNs`）使用数据增强来人为增加数据集的大小。这有助于提高模型的泛化能力。图
    16.2 显示了数据增强技术。Keras 的 `ImageDataGenerator` 类提供了数据增强。


    ![Fig. 16.2](img/fig16_2)


    图 16.2 数据增强技术


    研究了四种 `CNN` 模型，如 `AlexNet`、`ResNet50`、`VGG19`、`MobileNetV2` 和 `DenseNet121`。`CNN`
    的深层检测更复杂的特征（如纹理和模式），而浅层通常检测简单特征（如边缘和角）。图 16.3 显示了西瓜的成熟阶段。基于分类，它将预测西瓜的成熟阶段。


    ![Fig. 16.3](img/fig16_3)


    图 16.3 西瓜成熟阶段


    ## 5. 结果与讨论


    用于分类西瓜成熟度的深度学习模型性能通过每个 epoch 的训练准确率、验证准确率、训练损失、验证损失和编译时间进行评估。每个实验总共有 20 个 epoch。在图
    16.4 中，以图表形式展示了每次实验运行的训练和验证准确率、测试和验证损失，表 16.1 显示了不同 `CNN` 的编译时间。


    ![Fig. 16.4](img/fig16_4)


    图 16.4 准确率 (a) 与损失 (b) 的对比


