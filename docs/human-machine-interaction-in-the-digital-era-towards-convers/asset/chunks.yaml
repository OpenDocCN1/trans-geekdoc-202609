- raw: 'The proposed method outperforms previously developed systems that attempted
    to accomplish the same goal. Previous efforts relied on a simpler 2-level discrete
    wavelet transform (DWT), but the implementation of the 3-level Median Filter has
    improved contrast and allowed for the easy suspension of signals within an image.
    The image became too blurry at levels 4 and 5, and the classification accuracy
    rate was too low, so we settled on level 3. While both the Chanvese algorithm
    and CNN were examined for their potential in segmentation, the former yielded
    less encouraging findings. The fast Fuzzy C-means method improved the results,
    and it became an innovative tool in the scientific community. Last but not least,
    a hybrid method called Deep belief convolutional neural network (DBCNN) was created
    in MATLAB 2021a for classification, bringing together CNN (Convolutional Neural
    Network) and DBN (Deep belief Neural network) for superior results.


