    COVID-19 的出现在 2019 年给世界带来了巨大的健康灾难，导致了全球大流行。快速诊断 COVID-19 对于保持警惕和阻止感染传播至关重要。`MRI`和`CT-Scans`等医学图像被用诊断的信息源。在自动化诊断模型的帮助下，可以更容易克服非专业放射科医生在准确诊断过程中遇到的困难`[2]`。在处理
    COVID-19 真实数据集的研究工作中，报告了多类包含不同目标和案例研究的 COVID-19 数据的 AI 分类模型`[5]`。尽管 AI 方法在 COVID-19
    的诊断和检测过程中被证明是有益的，但开发一个能够产生精确结果的适当 AI 模型仍然具有挑战性`[7 and 8]`。


    所提出的研究工作侧重于评估不同的特征提取方法及其在 COVID-19 严重程度预测和分类中的性能。本研究评估了统计特征、纹理特征、基于区域的特征及其组合的影响。此外，这项工作提出了一种包含计算智能（`CI`）概念的新型分类器模型。`CI`的主要范式是元启发式算法，这些算法根本上用于解决优化问题`[9]`。在这方面，名为原子搜索优化（`ASO`）`[3]`的最新元启发方法被用于提出的模型，以优化门控循环单元（`GRU-NN`）的权重。所提出的原子搜索优化`GRU-NN`（`ASO-GRU-NN`）模型有助于在准确性、特异性、敏感性和错误率方面增强
    COVID-19 及其严重程度分类的性能。


    所提研究工作的主要贡献列如下：


    *   开发了一种基于`CI`的新型 AI 分类器模型`ASO-GRU-NN`，用于预测 COVID-19 并对其严重程度进行分类。

    *   该研究评估了统计特征、`GLCM`特征和基于感染区域形状特征对 COVID-19 检测和分类的影响。

    *   评估了这三种特征的组合效应对 COVID-19 严重程度检测和分类的影响。通过与现有的最先进分类器模型进行比较，验证了所提方法的性能。


