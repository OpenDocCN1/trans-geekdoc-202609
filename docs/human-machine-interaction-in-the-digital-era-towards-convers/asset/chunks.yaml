- raw: '**Abstract** Technology has advanced significantly in today’s modern era.
    It is open to everyone, including students. Students now have easier access to
    the technological world through the internet. Students are becoming more interested
    in social media. Long-term use of social media can lead to apathy toward studies.
    When students are distracted by social media and other factors that they often
    overlook, it can have a negative impact on their academic performance. The aim
    of this study is to identify the major factors that contribute to distractions
    to students’ studies and also identify the social media usage among students for
    lowering their grades. The responses of the 465 students who participated from
    various colleges reveal that social networking sites are very popular, and the
    majority of the responses prove that they are distracting from studies due to
    excessive internet usage.


    **Keywords** Social Media, Educational Data Mining, Internet, Student Performance,
    Mobile Phone Activity, Students Distraction


    ## 1. Introduction


    Students are more enticed than ever before to engage in media multitasking with
    the emergence of personal digital gadgets. However, it is unclear whether all
    digital devices interfere with student learning. \[[1](#ch2.xhtml#ref2_1)\] With
    the advancement of the Internet and digital technologies, society is becoming
    increasingly connected.


    Personal page of the user can be set to semi-public or protected, depending on
    the user’s preferences. Instagram, Facebook, YouTube, and TikTok are some of the
    most popular sites.


    Teachers at most colleges are constantly competing for attention in the classroom
    with cell phones and other technologically - advanced gadgets. While the teacher
    is instructing, students text, surf the web, and post on social media. As a result,
    they are only half-present in the classroom for the majority of the time, which
    automatically leads to academic distraction.


    ## 2. Literature Review


    ### 2.1 Students Distraction During Lectures


    Abraham E., Scott (2020) conducted a survey with 100 participants, to find whether
    the students get distracted from taking lectures while using laptops. The participants
    were made to watch a 15 minute seminar and, in between the time, they conducted
    various tests to analyse the distraction using text messages sent during lectures.
    They found that making the students finish the notes is a better way to reduce
    distraction \[[2](#ch2.xhtml#ref2_2)\].


    ### 2.2 College Students Distraction of Two Universities


    Leida, Ravi, Zhenya (2019) conducted a survey with the students of two universities.
    They created a scale by which they analysed the distraction in college students
    and the intensity of it using ratings. There were 425 students who participated
    in this study. They found the students had impetuous personalities due to mobile
    usage \[[3](#ch2.xhtml#ref2_3)\].


    ### 2.3 Student Distraction


    McKinley Green (2019) conducted a study with the responses of 143 students and
    10 students were interviewed. In his research, he used nine activities to find
    distractions for students by finding which activities are done by many students.
    The study reveals many distracting activities and the students’ attitude trends
    due to technology usage \[[4](#ch2.xhtml#ref2_4)\].


    Fayyaz Ahmad Faize, Muhammad Nawaz, 2020 The author used 196 students’ data to
    find their attitude toward the online classes during the COVID-19 pandemic. The
    students’ satisfaction levels, challenges in learning, suggestions, modifications
    for improvement were found during this study. It was found that there was 12.7%
    distraction during online classes. The students identified some challenges faced
    during the online classes\[[5](#ch2.xhtml#ref2_5)\].


    Suad A. A. Al-Furaih, Hamed M. Al-Awidi, (2020) surveyed the data of 2084 undergraduate
    students for analysis. The data was analysed using SPSS to find the t-Test and
    correlation between the variables. The results found by the analysis show that
    students are distracted and they are not attentive, the attitude of students changes
    due to distraction caused by smart phones. The fear of missing out was found affecting
    the learning ability of students\[[6](#ch2.xhtml#ref2_6)\].


    ### 2.4 Attitude Towards Active Learning


    Madison E. Andrews, Matthew Graham, et al, (2019) conducted a inspection on the
    data collected from 27 instructors and 758 students. The data was collected from
    STEM instructors and students to find their attitude toward active learning. The
    data suggests that students show a more open mindset towards active learning,
    and the instructors were a bit hesitant to adopt active learning \[[7](#ch2.xhtml#ref2_7)\].


    ## Data and Variables


    The students data is gathered from a variety of undergraduate students. The total
    number of records is 465 contains 251 males and 214 females.


    ### 3.1 Data Preparation


    The survey research study method was used to collect data, and a specific questionnaire
    was created and distributed to 465 undergraduate students. The questionnaire was
    divided into four sections: (1) Device Usage (2) Purpose for using SNS (3) Digital
    Distraction (4) Reason for using social media.


    ### 3.2 Pre-Processing


    The students’ data was collected from the pre-processing step. Pre-processing
    has the ability to increase the accuracy of categorisation. The proposed pre-processing
    system is divided into two stages.


    1.  Remove any values that are missing.


    2.  Categorization


    ## 4. Methodology


    ### 4.1 Feature Selection


    Data mining provides a number of feature selection strategies. The fields of pattern
    recognition, statistics, and data mining have all actively studied feature selection.
    Attribute selection is another name for feature selection \[[8](#ch2.xhtml#ref2_8)\].
    Several feature selection strategies were applied to the pre-processed data set
    of 465 samples in order to select the important qualities and eliminate the irrelevant
    features, with a focus on picking the top attributes.


    ### 4.2 Classification


    Classification refers to the method of categorising data objects using predefined
    class labels. One of the ML supervised methods is classification \[[9](#ch2.xhtml#ref2_9)\].


    #### K-means


    K-means refers as simplistic recursive algorithm used for clustering. It calculate
    the distance mean, produces initial centroid, using distance as the metric and
    the K classes in the data. With respect to a given data set X with n multidimensional
    data points and a category K to be classified, the Euclidean distance is selected
    as the similarity index, and the clustering objectives minimize squares sum of
    the different kinds.\[[10](#ch2.xhtml#ref2_10)\]


    #### Decision Tree


    A supervised classification method called a decision tree forecasts both the classifier
    and the regression model. The basic purpose of classification trees is to allocate
    an object to a specified class based on its attributes. The root of the tree is
    the absence of any incoming edges, the internal node is the only node with an
    outgoing edge, and all other nodes are known as leaf nodes because they lack any
    outgoing edges \[[11](#ch2.xhtml#ref2_11)\].


    ### 4.3 Data Analysis


    This survey uses Knime analytic platform to analyze the data collected from 465
    college students. Over 3000 organizations utilize Knime, an open source graphical
    workbench for data mining, visualization, and reporting. The basic Knim open source
    version is called Knime desktop. Its foundation is the renowned and well-liked
    Eclipse **[Fig. 2.1](#ch2.xhtml#fig2_1)** Framework IDE platform, giving it both
    a development environment and a platform for data mining.\[[12](#ch2.xhtml#ref2_12)\]


    ![Fig. 2.1 Framework](images/fig2_2_B.jpg)


    [Fig. 2.1 Framework](#ch2.xhtml#R_fig2_1)


    ## 5. Results


    For the question of whether students have social media accounts, the responses
    were 89.2% (415) of students had social media accounts. This indicates that most
    of the students have social media accounts. ([Fig. 2.2](#ch2.xhtml#fig2_2)).'
