    \ + \\\\beta\\_{i}} \\\\right)$$  \n\nIn order to evaluate the efficacy of a model,\
    \ it is necessary to compare the output of the model, which is denoted by *y*,\
    \ to values that have been established. This is required in order to do so. 70%\
    \ of the information was used to teach MLP, and then later on, the model the training\
    \ dataset in a random order. During the time that the predictor model was being\
    \ trained, we varied the total number of neurons that were present in the hidden\
    \ layer within a four-point range. This allowed us to determine the architecture\
    \ that produced the most accurate results for the model. Tan h(x) was chosen to\
    \ act as the activation function in place of the other potential choices since\
    \ it exhibited higher performance when compared to the alternatives.\n\n### 3.2\
    \ Cognitive Learning\n\nIn order to facilitate supervised learning, the input\
    \ format settings have been standardized at 335×335, the image resolution has\
    \ also been standardized at 335×335, the add and sub trace maps have been labelled,\
    \ and the training set accounts for 80% of the total data while the validation\
    \ set accounts for 20% of the total data. When repeated on several occasions,\
    \ the results of a set of examinations should remain unchanged. Because of this,\
    \ it is essential to make use of seeds that produce the exact same random number\
    \ each and every time. Because of this, it is much simpler to enhance the accuracy\
    \ of models, which in turn makes it easier for them to be optimized.\n\nA random\
    \ value with a standard deviation of 0.05 is added to the weight, which results\
    \ in the addition of an offset of 0.05 to the total. In order to improve the classification\
    \ performance of the convolution neural network and to more closely match the\
    \ data, this step is taken. Additionally, this contributes to an overall improvement\
    \ in the appropriateness of the network. The RMS Prop optimizer and the gradient\
    \ descent method developed by Momentum are the two approaches that are combined\
    \ to form the Adaptive Moment Estimation methodology. This technique is built\
    \ by merging the two methods. The configurations of the network are updated on\
    \ a regular basis by an automated system that makes adjustments.\n\nIn order for\
    \ training to converge on a superior performance setting with an initial learning\
    \ rate of 1\\*10^(\\-4), Adam excellent computational efficiency and small memory\
    \ demand are both extremely helpful. As a result of the linear non-saturation\
    \ features possessed by the RELU function, the Sigmoid and tan functions converge\
    \ at a significantly slower rate than the RELU function. By using RELU as the\
    \ activation function of the convolution neural network during training, the gradient\
    \ disappearance problem can be overcome in an effective manner. This improves\
    \ the convolution neural network ability to sparsely express data, which ultimately\
    \ results in a more successful resolution of the issue. The simulation was run\
    \ for a total of 800 cycles, with 32 iterations making up each batch. The function\
    \ known as softmax is what is utilized in order to map the input of neurons onto\
    \ a scale ranging from 0 to 1.\n\nThe ideal objective function, often referred\
    \ to as the loss function, should serve as the basis for the choice of the cross-entropy\
    \ function that is most appropriate. The cross-entropy function is what used to\
    \ determine the degree to which the two values differ from one another, and the\
    \ softmax function is what responsible for computing the cross-entropy loss. Let\
    \ make the assumption that, for the purpose of iteratively training the network,\
    \ p is the probability distribution of the desired output, q is the distribution\
    \ of the observed output, and H (p, q) is the cross entropy. This will allow us\
    \ to say that q is the distribution of the observed output. Because of this, we\
    \ will be able to assert that the cross entropy is H. (p, q). The following is\
    \ the questionable formula:\n\n(4)  \n\n$$H(p,q) = - \\\\sum\\\\limits\\_{x}\\\
    \\left( {p(x)\\\\log q(x) + \\\\left( {1 - p(x)\\\\log\\\\left( {1 - q(x)} \\\\\
    right)} \\\\right)} \\\\right)$$  \n\n## 4\\. Results and Discussions\n\nIn this\
    \ section, the proposed FFMLP is validated at both training and testing phases\
    \ over various other methods. The simulation is conducted in python that runs\
    \ on a i5 core processor with 16GB RAM. The proposed model is tested in terms\
    \ of accuracy, precision, recall, f-measure and classification loss during training\
    \ and testing phase. In order to evaluate the performance of the neural network,\
    \ we made use of the following measurements:\n\nSensitivity = (TP)/(TP + FN),\
    \ Specificity = (TN)/(TP + FP), Accuracy = (TP + FP)/(TP + FP + TN + FN)\n\n[Figure\
    \ 9.2](#ch9.xhtml#fig9_2) shows the classification accuracy between the proposed\
    \ FFMLP and existing LRF, LWRF and SVR. The results of simulation shows that the\
    \ proposed FFMLP has higher rate of training classification accuracy than the\
    \ existing classification models.\n\n![Figure 9.2 Classification accuracy](images/fig9_2_C.jpg)\n\
    \n[Figure 9.2 Classification accuracy](#ch9.xhtml#R_fig9_2)\n\n[Figure 9.3](#ch9.xhtml#fig9_3)\
    \ shows the precision between the proposed FFMLP and existing LRF, LWRF and SVR.\
    \ The results of simulation show that the proposed FFMLP has higher rate of precision\
    \ than the existing classification models.\n\n![Figure 9.3 Precision](images/fig9_3_C.jpg)\n\
    \n[Figure 9.3 Precision](#ch9.xhtml#R_fig9_3)\n\n[Figure 9.4](#ch9.xhtml#fig9_4)\
    \ shows the recall between the proposed FFMLP and existing LRF, LWRF and SVR.\
    \ The results of simulation shows that the proposed FFMLP has higher rate of recall\
    \ than the existing classification models.\n\n![Figure 9.4 Recall](images/fig9_4_C.jpg)\n\
    \n[Figure 9.4 Recall](#ch9.xhtml#R_fig9_4)\n\n[Figure 9.5](#ch9.xhtml#fig9_5)\
    \ shows the F-measure between the proposed FFMLP and existing LRF, LWRF and SVR.\
    \ The results of simulation show that the proposed FFMLP has higher rate of f-measure\
    \ than the existing classification models.\n\n![Figure 9.5  F-Measure](images/fig9_5_C.jpg)\n\
    \n[Figure 9.5  F-Measure](#ch9.xhtml#R_fig9_5)\n\n## 5\\. Conclusion\n\nIn order\
    \ to classify neurodegenerative diseases into appropriate categories, we have\
    \ integrated into Feed forward MLP a learning technique that is cognitively based\
    \ (Multi-Layer Perceptron). First thing that we do when we want to train the FFMLP\
    \ model is take the dataset and divide it into the training set and the test set.\
