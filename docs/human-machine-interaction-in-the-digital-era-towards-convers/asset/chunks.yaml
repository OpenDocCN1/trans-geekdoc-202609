    # Chairman''s Message


    **“Education helps us get exposure to new ideas and concepts that we can use to
    appreciate and improve the world around us and the world within us.”**


    I am delighted to know that the Department of Computer Science and Applications,
    Faculty of Science & Humanities, SRMIST Ramapuram, is organizing an International
    Conference on “Human Machine Interaction in the Digital Era - ICHMIDE-2023 in
    association with AIMST University, Malaysia & Computer Society of India, Chennai
    Chapter on February 24th, 2023.


    Human Machine Interaction (HMI) as a field has made great strides towards understanding
    and improving our interaction with computer-based technologies.


    Human-Computer Interaction is an important part of systems design. User satisfaction
    requirement is leading to better designs which incorporates intelligent, adaptive,
    multimodal, natural methods. This conference on a very pertinent topic is the
    need of the hour.


    I am confident that this edited book volume would be a great input for scholars
    and academicians around the world to unite and exchange their ideas related to
    study the impact of digitization.


    Best Wishes!


    ![](images/figfront_v_3_B.jpg)


    **CHAIRMAN**


    **SRM Ramapuram & Trichy**


