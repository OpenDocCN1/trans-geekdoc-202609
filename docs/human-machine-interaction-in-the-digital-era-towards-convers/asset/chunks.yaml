    ### 5.1 讨论


    在研究中，我们对包含三个类别的仇恨言论数据集进行了测试，并使用了两种不同特征工程技术的七种分类器。根据测试结果，`LSTM` 算法结合 `Doc2Vec`
    生成了最佳结果。为了对文本进行分类，特征工程的选择至关重要。在本研究中，我们研究了 `word2vec` 和 `doc2vec` 特征提取方法。实验结果表明，`doc2vec`
    的性能优于其他两种方法。


    `Word2vec` 无法处理 Twitter 数据中的词汇表（Out Of Vocabulary），这导致性能不佳。为了理解词之间复杂的关系，`Word2vec`
    需要额外的训练数据[9]。表 I 所示，Taken 数据集包含 15000 条推文，对于 `Word2vec` 引发困难词关联是不够的。最近的研究表明，没有一种深度学习算法在所有类型的数据上都优于大多数。为了确定哪种深度学习算法在提供的数据上表现最好，我们将七种不同的深度学习模型与我们的数据集进行了对比。


    测试结果显示，`LSTM` 和 `SVM` 分类器的表现最好，因为 `LSTM` 和 `SVM` 使用阈值来分割数据，而不是确定特征边界。这些结果表明 `SVM`
    不受数据特征数量的影响 [10, 11]。`NB` 和 `RNN` 分类器的结果略低于 `LSTM` 和 `SVM` 分类器的结果，但远好于 `CNN`、`DT`
    和 `RCNN` 的结果。


    与其他类别相比，“仇恨言论”类别的训练集最少，如表 1.1 所示，然而该类别的误分类主要是由于它并不是一个类别。除了仇恨言论之外，更多类别包含频繁的词汇重叠。


    ## 6 结论


    本研究使用了自动文本分类方法，结合两种特征工程策略和七种深度学习算法来识别仇恨言论。研究结果显示 `Doc2Vec` 特征工程策略优于 `word2vec`。此外，`LSTM`
    和 `SVM` 算法优于 `NB`、`DT`、`CNN`、`RNN` 和 `RCNN`。`DT` 的性能低于 `LSTM` 和 `SVM`。在仇恨言论检测中，本研究结果具有重要意义，因为它们作为评估后续各种自动文本分类方法的基准。从科学角度来看，本研究的结果对许多自动仇恨言论检测也很有用。该研究包含两个明显的缺点。第一个局限性是数据的实时预测精度，建议的深度学习模型效率低下。最后，它仅仅将仇恨言论信息分为三类，无法确定数据集的严重性。使用深度学习技术预测仇恨言论的严重性是预期的下一步。推荐模型的分类性能将通过两种技术得到改进。其次，将收集额外的信息示例，以便快速学习分类规则。


