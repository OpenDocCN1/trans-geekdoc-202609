    ### 3.1 Description of Dataset


    Imaging planes, or directions, are used to characterise brain MRI scans in three
    different ways: horizontally, vertically, and cross-sectionally. The axial plane,
    the coronal plane, and the sagittal plane are all terms used in the field of medical
    imaging. According to neurosurgeons, the sagittal plane’s description of the brain’s
    left and right sides tells us nothing about the tumor’s location. Images in both
    the axial and coronal planes can be utilised to pinpoint the tumor’s afflicted
    area for use in treatment planning and clinical diagnosis. Any algorithm requiring
    an MRI picture as input requires a conversion step before it can be implemented.
