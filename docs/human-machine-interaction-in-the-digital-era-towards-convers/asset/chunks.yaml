    # 1. 引言


    森林地区的铁路线路跟踪系统用于最大限度地减少铁路轨道上的事故。该系统监控轨道上是否有任何动物或人员出现。该领域的重大改进将对国家产生重大影响。目前已有相应机制可以对铁轨进行充分的监测和维护。由于其规模巨大，维护不当会导致轨道事故。疏忽行为的缺失会影响许多生命。本文建立了一套系统，可以防止许多事故的发生，以避免轨道上发生此类事故。这种技术主要集中在野生动物经常出现在铁路轨道上的区域。所提系统使用图像处理技术对图像进行识别。在这里，本文采用
    `Keras` 作为后端，并使用 `Tensor flow`，能够精确地预测分类报告 [15]。它可以在几分之一内检测出图像中的物体，应用程序会立即生成警报信息并通知机车司机。严重事故包括：载有人员的火车导致人员死亡、一名或多名乘客重伤、价值超过
    25,000 卢比的铁路财产严重损坏，或任何根据“铁路安全总专员或铁路安全专员”判断需要铁路部门进行调查的事故。


    利用深度学习在铁路上检测人员或动物


    # 2. 文献综述


    ## 用于铁路轨道行人和机车信号灯检测的增强 YOLOv4


    一种检测铁路轨道上生物的方法被称为轨道跟踪技术。该系统由摄像头、火车状态系统和警报应用程序组成。摄像头每隔一段时间对轨道进行拍摄，随后通过图像处理技术进行识别。


    ## 使用增强型 YOLOv4 检测和识别交通灯的技术


    通过深度特征增强和边界框不确定性预测机制研究了增强型 YOLO V4 算法。为了从网络中提取特征并提高其检测小物体和颜色分辨率的能力，浅层特征增强技术将不同阶段的两个浅层特征与多轮上采样后生成的增强语义特征相结合。


    ## 基于 Arduino 和区块链的用于寄养儿童的主食捐赠系统和废物管理系统


    利用 `Arduino Uno` 微控制器，铁路轨道断裂检测系统，本工作的主要重点是跟踪系统的动态集成、用于传输警报信息的 `GSM` 模块以及用于铁路线路断裂检测传感器的
    `GPS` 坐标。该设备的操作由 `Arduino` 微控制器进行引导和协调。


    # 3. 方法论与模型规格


    基于神经网络的测量和检测铁路劣化的方法。火车事故经常是由铁路问题和缺陷引起的。提出了一种使用选择性搜索从图像中仅提取 2000 个区域并将其称为区域建议的方法，以解决选择大量区域的问题。损坏的图像将阻止系统正常运行。由于光线不佳导致精度低。所建议的方法不仅解决了这些问题，还提高了精度。


    ![Fig. 13.1 硬件套件](img/fig13_1_C.jpg)

    图 13.1 硬件套件


    ## 3.1 卷积神经网络


    处理图像的典型方法称为卷积，它通过修改像素的亮度来反映附近像素的亮度。卷积滤波器是卷积的应用。


    ## 3.2 卷积层


    当神经元连接到输入卷中的一个小区域时，`Convolution` 层将估计该神经元的输出。


    每个神经元将计算其权重与该区域之间的点积。


    ## 3.3 Relu 层


    应用 `RELU` 层的逐元素激活函数，包括 0 处的 `max(0, x)` 阈值处理。结果是卷的大小保持不变。


    ## 3.4 池化层


    `Pooling` 层将沿着所有维度（宽度、高度）进行下采样。


    ## 3.5 全连接层


    `FC` 层将计算类别得分，产生大小为 [1x1xN] 的卷，其中 N 个数字中的每一个都代表一个类别得分，例如 N 个类别中的一个。


    ### 模块 1 图像分类


    * 缩放、方向调整和颜色调整属于此类。

    * 图像预处理可以同时加速模型推理的速度和模型训练的速度。


    ### 模块 2 图像提取


    * 特征提取包括降维程序，该程序将原始数据集合划分并压缩为更小、更容易管理的分组。

    * 因此，当你想要处理它时，会变得更简单。

    ### 模块 3 检测


    * 在大型动物进入轨道之前发现它们，并在它们位于轨道或靠近轨道时提醒司机它们的存在。


    ## 3.6 框图


    ![Fig. 13.2 框图](img/fig13_2_C.jpg)

    图 13.2 框图


    利用深度学习在铁路上检测人员或动物


    ## 3.7 分析结果


    ![Fig. 13.3 检测到动物和人](img/fig13_3_C.jpg)

    图 13.3 检测到动物和人


    # 4. 结论


    铁路是最实用、方便的交通形式。但由于疏忽，发生了许多事故。因此，本文介绍了所建议的方法，利用图像处理方法来防止此类事故。照片在拍摄后存储在数据库中。拍摄后开始比较过程，并找到了图像。当发现生物或物体时，会有一个重新拍摄的过程，需要进一步检测和验证该生物或物体是否仍在轨道上。机车司机可以使用这些信息停止火车并防止危及动物的事故。当发现生物时，它会发出响声。


    # 5. 致谢


    首先，我们要感谢 SRM 教育集团的创始人 T. R. Paarhar 博士，没有他的支持我们的项目无法完成。我们非常感谢电子信息工程系 M. Devaraju
    博士为我们提供帮助并持续鼓励我们完成项目。我们非常荣幸地感谢导师电子信息工程 V. Dinesh 先生，他的知识指导和宝贵建议使项目取得了成功。最后，我们衷心感谢所有对我们完成项目提供支持的父母。


