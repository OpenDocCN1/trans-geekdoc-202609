    为了更好地了解海洋垃圾的瞬时漂移和分布，并加强海洋废物的管理，Sun 等（2020）对渤海西部漂移的海洋碎片进行了数值分析。风速、风向以及垃圾源头等重要变量对漂移轨迹和范围的影响已得到彻底的调查和辩论。研究还考察了处理海洋垃圾的程序。结果发现，海洋垃圾产生地的地形特征对颗粒的扩散及其最终的漂移路径具有影响。风速的增加会触发海洋碎片的收集，而风向的变化会定期影响粒子的漂移距离和扩散区域。


    在 Kylili 等（2020）这项研究中，利用人工智能应用，通过`CNN`设计和瓶颈法（bottleneck approach）构建了一个图像分类器。训练后的瓶颈法分类器被用于将塑料袋、容器、篮子、食品包装、吸管、废弃渔网、鱼和其他物体分为八个不同的组。这些塑料发现于海岸线或浮在海面上。该深度学习技术在有效区分物体方面的成功率达到
    90%，推荐用于海边和海洋中塑料产品的智能检测。针对不同历轮（epochs）和批次（batches）的损失和准确率的训练测试结果为该方法提供了更多信心。此类分辨率敏感性检查的结果表明，即使图像质量降低，预测系统仍能成功识别塑料。


    Bajaj R 等（2021）利用基于深度学习的方法对本土水下生态系统中的垃圾进行视觉识别，以便部署自主水下飞行器（`AUVs`）检查、监测并消除这些垃圾。训练采用了深度学习的`InceptionResNetV2`架构。利用`JAMSTEC`电子图书馆关于深海垃圾的数据，对来自不同地点的海量免费开放的真实垃圾数据集进行了标注。随后，经过认证的网络在来自各种数据集的图像上进行了测试，提供了有关提高`AUV`清除海底垃圾检测能力的知识。训练后的系统使用边界框（bounding
    boxes）和目标类别图来寻找测试图像中的特征。预计这些发现将推动利用`AUVs`在水下环境中自主检查、检测和收集水生垃圾的努力。


    海洋垃圾对海洋生态和海洋生物的生存具有负面影响。Xue 等（2021）在研究中建立了利用深度学习技术的深海碎片识别。为了方便未来的研究，首先建立了一个真实的深海垃圾识别数据集（`3D
    dataset`）。该数据集包含 7 种不同形式的垃圾。其次，提出了`ResNet50-YOLOV3`单阶段深海垃圾检测系统。在寻找深海碎片的过程中还使用了其他八种复杂的检测算法。最后，通过实验验证了`ResNet50-YOLOV3`的性能。


    Winans 等（2021）这项工作利用`AUVs`在水下环境中自主检查、检测和收集水生垃圾。测试了两种流行的检测技术：速度更快的基于`MobileNetV2`的`SSD`（`SSD-MN`）以及计算成本更大的基于`InceptionResNetV2`的`faster
    RCNN`（`FR-IR`）。这项研究证明了深度学习在识别和量化海洋垃圾方面的有效性。


    ## 3. 材料与方法


    这项工作使用深度学习来识别和量化海洋垃圾。本提议的目的是使用`FMAYOLOv5`识别并量化沿岸的存量碎片。


    ### 3.1 数据采集


    利用高分辨率的`Galaxy S20`超级相机拍摄了海滩垃圾的照片。视野和焦距分别为`25 mm`和`79 度`。使用宽为`10.m`的样带收集了位于西海整个海岸线的图像。训练集和测试集共收集了
    110 张照片。尽管尽力避免重复，但某些碎片之间确实存在重叠。因此，对重叠的照片进行了阴影处理，以确保在深度学习之前不会被发现。此外，专门为数据集收集了 736
    张特写照片。在指定的情况下，特写照片是在`0.5 m`的高度处拍摄的。从 736 张照片中提取了 1500 个物品进行单独标注。


    对整个海滩的垃圾进行了人工人工计数和分类，以便与深度学习方法的结果进行比较。由于尺寸较小，使用了尺寸`>2.5 cm`的海滩碎片来确定剩余存量。


    ### 3.2 FMA-YOLOv5 目标检测算法的实现


    使用采集的照片，利用基于`YOLOv5`的网络架构来识别和分类碎片。该方法通过添加特征图注意力（`FMA`）层扩展了骨干网络。`FMA`层保持输入特征图的大小不变，允许灵活多功能地添加到任何网络配置中。图
    14.1 展示了构成该方法的网络训练和检测程序。


