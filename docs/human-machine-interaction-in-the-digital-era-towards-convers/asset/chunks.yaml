    Internet users now have more freedom of speech than ever thanks to the proliferation
    of online social networks, the accessibility of information and communication
    technologies, and the widespread usage of computers and smart phones. Additionally,
    social media users frequently have the option to conceal their identities, which
    facilitates the abuse of the tools offered.


    Hate speech has been more prevalent both offline and online in recent years. Social
    media and other internet platforms have a significant role in the creation and
    transmission of inflammatory content, which ultimately results towards hate crimes
    [[1](#ch1.xhtml#ref1_1)]. However, it takes a lot of time and effort to manually
    discover and delete hate speech-related content. Consequently, depending on their
    own definitions, some people may find certain things to be hateful while others
    may not. According to [[2](#ch1.xhtml#ref1_2)], Hate speech is defined as offensive
    and violent material that is intended at particular minority, religious, political,
    sexual, or other groups.


    ## 2. Literature Review


    Harish Yenala et al., (2017) did research into inappropriate text from 79,041
    unique web search queries using `python`. When using various algorithms, they
    found that `PKF` gave 62.5% accuracy, `BDT` gave 79.25% accuracy, `BDT- DSSM`
    gave 94.75% accuracy, `SVM` gave 83.22% accuracy, `SVM- DSSM` gave 92.41% accuracy,
    `CNN` gave 71.48% accuracy, `LSTM` gave 88.62% accuracy, `C-Bil STM` gave 92.46%
    accuracy, `BLSTM` gave 80.18% accuracy.[[3](#ch1.xhtml#ref1_3)]


    Omar Sharif, Mohammed Moshiul Hoque et al.,(2020) did research to recognise suspicious
    Bengali text messages on Facebook, Twitter, YouTube using ML. `Google colab` platform
    with `python` is used to analyse the text messages. The algorithm `LR` gave 84.00%
    accuracy, `DT` gave 79.57% accuracy, `RF` gave 83.71% accuracy, `MNB` gave 83.78%
    accuracy, `SGD` 84.57% accuracy. [[4](#ch1.xhtml#ref1_4)]


    Janak Sachdeva, Kushank Kumar Chaudhary et al., (2021) did research to find hate
    speech on Twitter using deep learning. `Word2Vec` and `Google News Vectors` is
    used to find the hate speeches on Twitter. They used many algorithms; `LR` gave
    84.8% accuracy, `RFC` gave 84.8% accuracy, `KNN` gave 75.5% accuracy, `L-SVC`
    gave 83.4% accuracy, `CNN` gave 83.4% accuracy, `LSTM` gave 84.0% accuracy. [[5](#ch1.xhtml#ref1_5)]


    Bhavesh Pariyani, Krish Shah et al., (2021) proposed a research to find hate speech
    on Twitter using machine learning. `Count Vector organizer` in `python` is used.
    They used algorithms such as `SVM` gave 95.25% accuracy, `LR` gave 96.05% accuracy,
    `RF` gave 96.29% accuracy. [[6](#ch1.xhtml#ref1_6)]


    Ilia Markov, Walter Daelemans., (2022) proposed a research to find hate speech
    on Facebook using `python`. `BERT` algorithm is used and got 69% accuracy. [[12](#ch1.xhtml#ref12)]


    Jaeheon Kim et al., (2022) proposed a research to recognize and find the usage
    of toxic conversations in Twitch. `LSTM` is used and got 81% accuracy. [[13](#ch1.xhtml#ref1_3)]


    ## 3. Data and Variables


    ### 3.1 Dataset Collection


    The dataset contains hate speech tweets has been used for this study and has been
    categorised as three categories. This dataset was created and labelled by Crowd.
    This dataset contains14502 tweets. 19% of these tweets are classified as hate
    speech. Furthermore, 52% of tweets are others, the remaining 29% are offensive.
    [Figure 1.2](#ch1.xhtml#fig1_2) depicts the specifics of this distribution.


    ## 4. Methodology and Model Specifications


    This study describes the proposed methodology that has applied to categorize tweets
    into three separate types as “hate speech, offensive, and Others”. [Figure 1.1](#ch1.xhtml#fig1_1)
    shows the entire overview of the process. The research technique is described
    in this picture, includes six major steps: data collecting, data pre-processing,
    feature engineering, data splitting, classification design, and classification
    evaluation.


    ### 4.1 Text Pre-Processing


    The results of categorization are improved by text preparation, according to several
    studies [[7](#ch1.xhtml#ref7)]. Therefore, in this dataset, we applied a variety
    of pre-processing techniques to get rid of tweets messy and undesirable properties.
    As of preprocessing, we changed the tweets to lower case. Additionally, we removed
    all names, `URL`, hash tags, spaces, punctuation, special characters and stop
    words from the collected tweets using pattern matching. Additionally, we stemmed
    and tokenized tweets.


    ### 4.2 Feature Engineering


    The categorization criteria cannot be understood by deep learning systems from
    textual content. To grasp classification criteria, these algorithms require quantitative
    features. As a result, one of the most important processes in text classification
    is feature engineering. This phase is used to extract significant attributes from
    the raw text and numerically represent the data. We used two different feature
    engineering strategies in this study: `Word2vec`, and `Doc2vec`.


    ### 4.3 Data Splitting


    The class-wise distributed training and test sets are displayed in [Table 1.1](#ch1.xhtml#tab1_1).
    For training, 80% of the data is used and 20% for testing. The categorization
    model is evaluated using the test data. The test data is used to evaluate the
    categorization model and also used to evaluate the categorisation model.


    | Class | Total | Training | Test |

    | --- | --- | --- | --- |

    | Hate Speech | 2396 | 1917 | 479 |

    | Offensive | 4835 | 3868 | 967 |

    | Others | 7274 | 5819 | 1455 |

    | Total | 14502 | 11604 | 2901 |


    ### 4.4 Deep Learning Models


    A master feature should be subjected to the application of several distinct classifiers
    to see which one yields the best results. We ultimately settled on seven classifiers:
    `NB`, `SVM`, `DT`, `LSTM`, `CNN`, `RNN`, and `RCNN`.


    ### 4.5 Evaluation of Classifier


    In this phase, the created classifier uses the test set to predict the class of
    unlabeled text. To find Classifier Performance (TP) the following are used: True
    negatives (TN), true positives (TP), false positives (FP), and false negatives
    (FN). To evaluate the functionality of the developed classifier, various criteria
    are used. Some typical text categorization performance measures are addressed
    briefly below. More information on performance measurements can be found in [[8](#ch1.xhtml#ref1_8)].


    | Performance metrics |

    | --- |

    | Precision | `TP(TP + FP)` |

    | Recall | `TP(TP + FN)` |

    | F-measure | `2 × (precision × recall)(precision + recall)` |

    | Precision | `TP + FP + TN + FN (TP + TN)` |


    ## 5. Empirical Results


    Table 1.3 Precision of results


    | Features | NB | SVM | DT | LSTM | CNN | RNN | RCNN |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | Word2Vec | 0.70 | 0.67 | 0.67 | 0.75 | 0.65 | 0.63 | 0.66 |

    | Doc2Vec | 0.71 | 0.66 | 0.66 | 0.75 | 0.70 | 0.62 | 0.65 |


    Table 1.4 Recalls of results


    | Features | NB | SVM | DT | LSTM | CNN | RNN | RCNN |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | Word2Vec | 0.73 | 0.68 | 0.69 | 0.74 | 0.62 | 0.64 | 0.69 |

    | Doc2Vec | 0.73 | 0.63 | 0.68 | 0.73 | 0.66 | 0.64 | 0.68 |


    Table 1.5 F-Measures of results


    | Features | NB | SVM | DT | LSTM | CNN | RNN | RCNN |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | Word2Vec | 0.70 | 0.67 | 0.67 | 0.71 | 0.62 | 0.61 | 0.66 |

