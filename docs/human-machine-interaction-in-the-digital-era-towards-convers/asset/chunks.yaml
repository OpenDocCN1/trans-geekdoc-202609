    ### 3.1 Convolutional Neural Network


    A typical method of processing images is called convolution, which modifies a
    pixel’s brightness to reflect the brightness of pixels nearby. Image filters are
    a frequent application for convolution.


    ### 3.2 Convolution Layer


    When a neuron is connected to a small area in the input volume, the Convolution
    layer will estimate the outputs of that neuron.


    Each neuron will compute the dot product between its weights and that area.


    ### 3.3 Relu Layer


    The elementwise activation function of the RELU layer will be applied, including
    the max(0, x) thresholding at 0. The volume remains the same size as a result.


    ### 3.4 Pooling Layer


    The Pooling layer will do down sampling all along dimensions (width, height).


    ### 3.5 Fully Connected Layer


    A FC layer will calculate the class scores, producing a volume of size \[1x1xN\],
    in which each of the N numbers represents a class score, such as within the N
    categories.


