    Y^=Sign(W[d] A[d] + W[d] -1 A[d] -1+ ………..+ W[2] A[2] +W[1] A[1] +W[0] A[0])

    ```


    `Sign` 是激活函数。赋值值 `W[0] =--T`，`A[0] =1`；


    当我们有太多数据进行准确率检测时，可以使用神经网络。表 8.2 述明，根据收集的值，人员 1、2 和 4 处于压力状态。通过心率、呼吸频率和血压检测出人员
    3、5 和 6 处于冷静状态。


    表 8.2 应用人工神经网络后获得的 Y^ 结果


    | `A1` | `A2` | `A3` | `Y^` |

    | --- | --- | --- | --- |

    | 0 | 1 | 1 | –1.2 |

    | 1 | 1 | 0 | –1.2 |

    | 1 | 0 | 0 | –0.8 |

    | 1 | 0 | 1 | –1.2 |

    | 0 | 0 | 1 | –0.8 |

    | 0 | 1 | 0 | –0.8 |


    ## 5. 结论


    可穿戴设备是未来 IT 方法的重要组成部分。在数据收集、数据操作、安全等方面有很多未被考虑。这项工作的目标是对多个领域的可穿戴设备提供清晰的综述。探讨了人工智能在可穿戴设备中的作用。在后续章节中，可穿戴设备将改善生活质量。


