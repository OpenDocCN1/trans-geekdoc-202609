    # 15 Recommender Model for e-Learning Environment Using Enhanced Support Vector
    Space Model (ESVM)


    Manikandan Rajagopal

    Associate Professor, CHRIST (Deemed to be University), Bangalore


    Surekha R Gondkar

    Associate professor, Department of Electronics and Communication Engineering,
    BMS Institute of Technology and Management, Bengaluru, Karnataka


    Ramkumar Sivasakthivel

    Associate Professor, CHRIST (Deemed to be University), Bangalore


    DOI: [10.1201/9781003428466-15](https://dx.doi.org/10.1201/9781003428466-15)


    **Abstract One of the most intriguing studies in the world of education is custom
    online learning based on a recommender system. The majority of academics created
    a variety of recommender e-learning approaches that use recommendation methods
    in mining of educational data particularly for the determination of learning choices
    of students. But it doesn’t produce satisfactory outcomes. The suggested system
    designed an Enhanced Vector Space Model (ESVM) based recommendation for the Protus
    system in order to improve suggestion accuracy and reduce query processing time.
    The learning styles of students are initially derived from server blogs. Similarity
    computation and recommendations are carried out when preprocessing is finished.
    The system first creates a suggestion list using content-based filtering. Based
    on the adjusted cosine similarity of their content, the results are ranked. In
    order to accurately classify the most active participant in the group, we use
    a collaborative method. The experimental results prove that the designed EVSM
    scheme performs better than the old system in terms of query processing speed,
    MAE, and correctness.


    **Keywords:** Document frequency, Adjusted cosine, Recommendation system, and
    Vector space model (VSM)


    ## 1. Introduction


    E-learning scenarios are becoming more and more commonplace in educational settings.
    A significant change has been brought in conventional methods of learning owing
    to the advanced pedagogy through e-learning, with a new situation (understudies)
    [1](#ch14.xhtml#R_ref14_1), [2](#ch14.xhtml#R_ref14_2) and [3](#ch14.xhtml#R_ref14_3).


    In order to stimulate student input and direct students’ learning processes, teachers
    need a programmed strategy on their end. On the student’s side, an e-learning
    framework that could organically guide the student’ exercises and intelligently
    produce learning resources would be incredibly beneficial [4](#ch14.xhtml#R_ref14_4),
    [5](#ch14.xhtml#R_ref14_5), [6](#ch14.xhtml#R_ref14_6) and [7](#ch14.xhtml#R_ref14_7).


    Finding learning resources pertaining to student preference is difficult due to
    the abundance of learning resources online. A group of things are expected to
    be prescribed to students by e-learning recommender frameworks, i.e., the most
    effective or practical approaches within a wide range of learning resources [8](#ch14.xhtml#R_ref14_8)
    and [9](#ch14.xhtml#R_ref14_9).


    Additionally, selecting the most effective teaching method for each student and
    putting it into practise in a real classroom is quite difficult for educators,
    and the present eLearning frameworks do not provide a good way to monitor students’
    progress. Many academic and industry researchers have already tried to address
    the challenges of RS for improving the quality of recommendations which are supplied
    to the learners. The learner centric approach is what expected from the online
    learners [10](#ch14.xhtml#R_ref14_10) and [11](#ch14.xhtml#R_ref14_11).


    The level in which the learners are motivated and due interest are also of more
    importance and one of the key metric in measuring the outcome of learning. This
    motivates the researchers to come out with more efficient recommendation models
    for improving the quality of learning outcome through recommendations. According
    to certain researchers, advancing the execution of personalized learning can be
    done by taking into account the students’ dimensions of information [12](#ch14.xhtml#R_ref14_12)
    and [13](#ch14.xhtml#R_ref14_13).


    Along these lines, personalization is strongly impacted by a student’s capacity.
    According to the theory of item responses that gives a tailor made learning environment
    that largely depend on the materialistic parameters, B-Spoke framework for enhanced
    e-learning is introduced in [14](#ch14.xhtml#R_ref14_14).


    A personalized framework for learning English vocabulary was developed based on
    the memory cycles in learning pattern was introduced in [15](#ch14.xhtml#R_ref14_15).
    The framework recommends suitable and appropriate content for mastering vocabulary
    based in individual participants’ capacity and memory based cycles [16](#ch14.xhtml#R_ref14_16).


    A multi-specialist tailored e-learning framework based on IRT and Artificial Neural
    Network (ANN) was developed [17](#ch14.xhtml#R_ref14_17).


    ## 2. Proposed Methodology

