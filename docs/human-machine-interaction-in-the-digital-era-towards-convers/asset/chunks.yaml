    **Abstract** A lot of fraudulent and manipulated photographs have been created
    in recent years and disseminated through the media and the Internet due to the
    accessibility and simplicity of image editing softwares. To judge the veracity
    of an image and, in some situations, to identify the parts that have been altered
    (forged), a variety of methods have been put forth. The most prevalent copy-move
    and splicing attacks are the focus of this paper’s examination of some of the
    most recent methods for detecting image forgeries that specifically rely on DL
    techniques. Deep learning-powered techniques seem to be the most relevant at the
    moment, as evidenced by the best overall performances they exhibit on the benchmark
    datasets that are now available, so this survey is especially pertinent at this
    time. These approaches’ key characteristics were discussed in addition to the
    datasets that were used to train and test them.


    **Keywords:** Deep learning, Classification algorithm, Image forgery, Principal
    component analysis, Copy-move and splicing attacks


    *Human Machine Interaction in the Digital Era - Prof. J. Dhilipan et al. (eds)*


    *© 2024 Taylor & Francis Group, London, ISBN 978-1-032-54998-9*


    ## 1\. Introduction


    Images and videos are consequently frequently shared and used as information sources
    in a variety of scenarios. In fact, a lot of commonplace information is recorded
    using smartphones, even by experts. A wide range of digital technologies, including
    efficient compression techniques, quick networks, and specifically developed user
    apps, enable widespread sharing of visual content. Web platforms, such as social
    networks like Instagram and forums like Reddit, which enable the almost instantaneous
    dissemination of user-generated photographs and video, are among the latter group.


    This paper’s aim is to provide an overview of a few forgery detection techniques,
    devoting strong emphasis to deep learning (DL) algorithms that have recently gained
    prominence.


