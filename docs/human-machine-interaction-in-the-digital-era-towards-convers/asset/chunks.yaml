    On checking the information on the number of rows and columns in the data set
    before cleaning the data it was found to be 16 columns and 103881 rows. The data
    has to be checked for any form of null values which was checked with a function
    `is null` and it was found to be 0 hence the data did not contain any null values.
    Now the data had some columns that were not necessary for the analysis hence unwanted
    columns like `mid`, `season`, `venue`, `batsman`, `bowler`, `striker` and `non-striker`
    were removed to go ahead with further analysis. Once the data was cleaned off
    of the unnecessary columns the number of columns reduced to 9. Now to go ahead
    with the further analysis the most consistent teams of IPL had to be identified
    which was done using the `unique` function. Since the first 5 overs information
    had to be collected during the deployment of web app the first 5 overs column
    had to be removed from the data set. Now the `date` column required to be converted
    to `object` format since it was in string format. All of these cleaning the data
    was check for duplicate values and null values once again. Finally, the correlation
    Matrix was generated which revealed a high correlation between the runs and the
    overs of the dataset.


    ### 4.4 Modeling and Evaluation


    Feature importance had to be identified to start off with building the model.
    `Extratreesregressor` was used as a meta estimator in order to fit a number of
    randomised decision trees on various some samples within the data set and utilise
    the averaging form in order to maintain a better accuracy on prediction and to
    keep the overfitting under control. In this project 4 different algorithms are
    deployed as a part of model building which is `linear regression`, `lasso regression`,
    `random forest` and `ridge regression`.


    ### 4.5 Linear Regression


    Linear Regression model is built using the `Sklearn` and the prediction is made
    and matrices `MSE`, `RMSE` and `MAE` are used to identify the fitness of the model
    and the score of the model is also predicted in order to understand the model
    better and below is a plot of the prediction.


    ### 4.6 Random Forest


    The random forest model is also built using the `Sklearn` and the `random forest
    regressor` is used in order to make the regression happen and fit the multiple
    decision trees randomly on the extracted subsets and to average the prediction
    that is made across the test data.


    ### 4.7 Ridge Regression


    The ridge regression is also performed by using `scale`, `randomised searchCV`
    and `gridsearch CV` are used to fit the parameters and to identify the `lambda`
    value and the negative means squared error is used to identify the score of the
    algorithm and below is density graph of the same.


    ![Fig. 11.2 Ridge regression](images/fig11_2_C.jpg)


    Fig. 11.2 Ridge regression


    ### 4.8 Lasso Regression


    The lasso regression algorithm is also built using the `Sklearn` and the `gridsearchCV`
    to identify the `Alpha` value and the negative means squared error is used to
    get the score of the algorithm and the model is predicted using the laws of regression
    and below is density graph of the same.


    The respective models are built by importing the models from `Sklearn`. And in
    order to interpret the best fit model for the prediction of this project several
    metrics can be utilised however three different metrics which is `MSE`, `MAE`
    and `RMSE` are used in order to pick the best algorithm to make the prediction.


    1. `MAE`: Also known as the Mean Absolute Error, is the value the denotes the
    average of the absolute difference between the actual values and the predicted
    values within the dataset, and it is used to measure the average of all the residuals
    within the dataset.


    2. `MSE`: Also known as the Mean Squared Error, is the value the denotes the average
    of the squared difference between the original values and the predicted values
    within the dataset, and it is used to measure the variance of all the residuals
    within the dataset.


    3. `RMSE`: Also known as the root mean squared error is the square root of mean
    squared error, it is something that measures the standard deviation of all the
    residuals within the dataset.


    From the above [Table 11.1] for comparison, we can see that the lowest values
    for `MAE`, `MSE` and `RMSE` are for the `LASSO REGRESSION`, hence the lasso regression
    model is used to make the first innings score prediction in this project.


