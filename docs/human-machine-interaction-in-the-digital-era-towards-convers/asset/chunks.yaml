    Bengaluru, India


    DOI: [10.1201/9781003428466-11](https://dx.doi.org/10.1201/9781003428466-11)


    **Abstract** Sports analytics is a very popular segment. Every modern day sport
    uses a form of analytics to analyze either the player performance, training effect,
    match statistics or match result predictability. As huge volumes of data is being
    generated due to Indian premier league (IPL), match result predicting websites
    like Dream11, CricBuzz, etc. have gained popularity. Such companies have shifted
    from basic player analysis to accurate match result prediction. This paper deals
    with important game factors to be considered to develop a match result predicting
    system. We employ popular machine learning techniques like linear regression,
    random forest, ridge modeling and others to develop such a system. The machine
    learning model has been tested with game conducted in 2021 April between Royal
    Challengers Bangalore and Mumbai Indians. The proposed model predicts a score
    range of 152 - 167 when the actual first innings score was 159, hence the model
    is capable of making the closest prediction with the help of lasso regression.


    **Keywords:** Regression model, Machine learning regularization, IPL prediction,
    Lasso regression, Ridge regression, Random forest, Linear regression


    ## 1\. Introduction


    The Twenty20 cricket league known as the Indian Premier League (IPL) is played
    in India. Every year, it is often performed in April and May. The game’s title
    sponsor as of 2021 is Vivo, and it is known as the Vivo IPL 2021. Board of Control
    for Cricket India (BCCI) established the league in 2008. The shortest variation
    of cricket is called T20. It gets completed in 3-4 hours. There are two innings
    one for each team. Each innings consists of 20 overs (6 legal balls to bowl) in
    an over. T20 version has gained popularity in the last 15 years, thanks to India’s
    inaugural T20 world cup win in 2007, which led to the formation of IPL. The data
    can be scraped and transformed from Cricsheet.org and IPL T20 - Official Website
    or espncricinfo.com, the above- mentioned sites have ball-by-ball details and
    it contained summary of all the matches by season and time. Hence the data from
    2008 till 2021 can be scraped from the same.'
