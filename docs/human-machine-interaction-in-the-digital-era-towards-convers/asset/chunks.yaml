    # 7 E-Learning Technologies with Interactive Factors and Elements on the Perspective
    of Knowledge Management


    C. Rajeshkumar^([^(13)](#fn13))


    Research Scholar, Department of MCA, Bharath Institute of Higher Education and
    Research (BIHER), Chennai


    K. Rajakumari^([^(14)](#fn14))


    Associate Professor, Department of CS, Bharath Institute of Higher Education and
    Research (BIHER), Chennai


    DOI: [10.1201/9781003428466-7](https://dx.doi.org/10.1201/9781003428466-7)


    **Abstract:** E-Learning is used to connect the students and teachers in virtual
    manner. In this learning concept teaching can be done with interactive manner
    and mass range of the students can be reached with this learning technique. ELearning
    through eMail, Internet, World\_Wide\_Web (WWW), multimedia become more popular
    as the result developing technologies in digital and delivering higher education
    on interest of computerized manner. Questions like how confidently college instructors
    use technology in their instruction. After the pandemic situation E-Learning applications
    become very familiar to the students and the teachers. It makes the user to make
    the communication easier and handle the class in easy manner. Major features of
    E-Learning are a virtual classroom, adaptable designs and website layouts with
    learners in mind, Reminders, compliments, and additional pertinent push alerts
    a variety of educational resources, including images, movies, podcasts, etc. principles
    for holistic micro learning, online content that can be downloaded for future
    reviewing and different quiz formats. In this research paper, different types
    of E-Learning applications are compared to know the features and usages of that
    application in various approach manners.


    **Keyword:** Digital, E-Learning and virtual classroom


    ## 1\. Introduction


    An interactive website that lets users input data and interact to receive desired
    outcomes on ELearning using webapp. From distant locations, students use internet
    connection for web browser to active participate on accessing the application.
    The above 90 percentage of students believing that the online learning consider
    as superior learning in traditional concept, according to SmallBizTrends. To keep
    the students engaged the online elearning community using elearning apps on web.


    Web programs for e-learning are kept on the web server. Apps on web, are opposed
    to websites on elearning, let students are participating in interactive tasks
    including the test, writing an essay, giving a presentation, solving a math\_problem,
    and more digitally connected on the classroom. One such example is Zoom, a video
    conferencing tool that enables users to host and join remote meetings. By doing
    this, teachers and students can engage in a live learning environment without
    entering the actual school building.


    The major features of E-Learning are a virtual classroom, adaptable designs and
    website layouts with learners in mind, Reminders, compliments, and additional
    pertinent push alerts a variety of educational resources, including images, movies,
    podcasts, etc. principles for holistic micro learning, online content that can
    be downloaded for future reviewing and different quiz formats.


    The above [Fig. 7.1](#ch7.xhtml#fig7_1) express the various features of E-Learning.
