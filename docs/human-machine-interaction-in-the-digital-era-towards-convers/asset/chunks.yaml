    ### 5.1 Comparison of Performance of ML Algorithms


    This section focuses on the performance of ML approaches. Tests were run on an
    SVM with a gaussian kernel, the Naive Bayes classifier, and ADA Boost to put the
    performance of the illustrated methods into perspective. The variations in the
    outcomes the classifiers have produced using the CICIDS2017 data are shown in
    [Table 12.6](#ch12.xhtml#tab12_6) lists the precision, recall, and f1-score of
    each class found in the dataset along with the results the Naive Bayes classifier
    was able to achieve on the entire CICIDS2017 dataset. The table is further expanded
    to display the outcomes from additional methodologies across the entire CICIDS2017
    dataset.


    ### 5.2  Hyperparameter Optimization


    Each of the settings has its hyperparameters optimised. The selected hyperparameters
    are evaluated using the grid search approach in all of their conceivable permutations.
    In order to attain the best accuracy, the batch size, the activation function,
    the optimiser, and the used epochs count are sequentially permutated as shown
    in the [tab12.1](#ch12.xhtml#tab12_1), [tab12.2](#ch12.xhtml#tab12_2), [tab12.3](#ch12.xhtml#tab12_3),
    [tab12.4](#ch12.xhtml#tab12_4), [tab12.5](#ch12.xhtml#tab12_5) and [tab12.6](#ch12.xhtml#tab12_6).
    It is obvious that, as was the case with NSL-KDD, the results obtained with various
    parameter configurations vary significantly.


    ### 5.3 Statistical Analysis


    To assess the statistical significance of this study, the tried-and-true Wilcoxon
    Signed-Rank Test was applied. [Table 5](#ch12.xhtml#tab12_5) compiles the NSL-KDD
    setups that perform the best. All of those configurations were evaluated in comparison
    to the top-ranking configuration, but the test failed to demonstrate statistical
    significance which led to the conclusion that, if the hyperparameters are properly
    set for this dataset, the topology of the neural network has no discernible influence
    on accuracy.'
