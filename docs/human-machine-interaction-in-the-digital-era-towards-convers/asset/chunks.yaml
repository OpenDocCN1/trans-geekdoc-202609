- raw: 'Cardiovascular disease is a serious heart disease; worldwide, it has one-third
    of the annual death rates \[[1](#ch17.xhtml#ref17_1)\]. Many scientists have created
    algorithms for diagnosing heart disease to improve the current situation using
    machine learning to extract usable data from available medical datasets. Utilizing
    these diagnostic techniques can facilitate clinical evaluations of medical diagnoses,
    improve the diagnosis procedure, and reveal disease-related information will save
    more lives. An accurate diagnosis and effective treatment can preserve the lives
    of patients, several tests are necessary for predicting cardiac disease. Several
    machine learning-based approaches have been used to forecast the probability of
    finding heart disease. Most of these techniques use publicly accessible datasets
    to train and test models. The availability of these datasets has improved the
    efficiency of machine learning-based predictive analytics and created new opportunities
    for scholars to create enhanced algorithms for estimating the risk of developing
    cardiac disorders.


    Machine learning (ML) algorithms are more effective in dealing with nonlinear
    and complex features. Several algorithms, including KNN, SVM, and LR, have been
    effectively used to address a range of illnesses classification and prediction
    difficulties, such as an advanced indicator for Electro Cardiogram (ECG) detection
    and prediction the congenital heart disease \[[Che et al. 2021](#ch17.xhtml#ref17_6)\].
    Researchers have proposed various machine learning models for improved cardiac
    disease prediction, including KNN, LR, DT, NB, FR, SVM, and others. Creating an
    advanced and economical method of accurately forecasting heart disease is essential.
    An Ensemble classifier as the machine learning classifier is proposed for predicting
    heart diseases. The proposed system is executed with the medical dataset containing
    the records of heart diseases.


    Organization of this paper: in [section 1](#ch17.xhtml#sec17_1) introduction is
    discussed, related works in [section 2](#ch17.xhtml#sec17_2), the proposed mechanism
    in [section 3](#ch17.xhtml#sec17_3), experimental works in [section 4](#ch17.xhtml#sec17_4),
    and the conclusion in [section 5](#ch17.xhtml#sec17_5).


    ## 2. Literature Review


    Ali et al. applied a feature selection mechanism to execute the low-dimensional
    data obtained from the sensor data and medical records. To get the dataset, they
    employed a feature selection method that considered data flow and feature ranking.
    By using an ensemble deep learning method, they achieved higher accuracy than
    the existing models.


    Ishaq et al. integrated random forest for feature ranking and SMOTE technique
    for data balancing. Each model’s prediction accuracy on balanced data was much
    higher than on unbalanced data without treatment. The prediction results of nine
    popular algorithms were analyzed on data containing both SMOTE-generated samples
    and untreated outliers.


    Joo et al. considered the cardiovascular disease dataset to predict cardiovascular
    disease risk. In which, they extract 25 variables from dataset by integrating
    the results of health examinations and questionnaire responses. The information
    from the physician’s medication is significant for performing feature selection.


    Umarani et al. developed a machine learning-based heart disease prediction mechanism
    by implementing XGBoost. A combined architecture using hybrid synthetic minority
    over-sampling technique-edited nearest neighbor (SMOTE-ENN), density-based spatial
    clustering of applications with noise (DBSCAN), heart disease prediction model
    (HDPM), clinical decision support system (CDSS) is applied for outliner detection
    and distribution of the trained data. Finally, XGBoost is implemented for predicting
    heart diseases.


    Abdul et al. concentrated on utilizing machine learning (ML) techniques to increase
    the forecast accuracy of heart disorders. The author applied hyper parameter tuning
    in the ML algorithms in this work. The trained dataset is executed to the nine
    classifiers with hyperparameter tuning and without hyperparameter tuning.


    For precise and prompt detection of heart diseases, Farhat et al. proposed a robust
    machine learning approach. It is a two-phase work initially analyzing the performance
    of SVM, SGD, KNN, LR, RF, DT, and NB with the Cleveland heart disease dataset.
    Next, LASSO, mutual information, MultiSURF, variance threshold and ANOVA are implemented
    to extract the relevant features.


    Yang et al. proposed a Smote-Xgboost Algorithm and Feature Optimization model
    for predicting heart diseases. Initially, feature optimization is applied to obtain
    the significant features from the dataset and resolve the overfitting problems.
    Next Smote-Enn algorithm is applied for data balancing and then Xgboost algorithm
    is implemented to get the final prediction result.


    ## 3. Proposed Methodology


    The proposed ensemble classifier, a machine learning approach comprising various
    processes such as preprocessing, applying ensemble classifier, bagged trees, prediction,
    feature selection, and performance evaluation. [Figure 17.1](#ch17.xhtml#fig17_1)
    illustrates the proposed architecture, and the proposed workflow is described
    in upcoming sections.


    ![Fig. 17.1 Proposed architecture](images/fig17_1_B.jpg)


    [Fig. 17.1 Proposed architecture](#ch17.xhtml#R_fig17_1)


    ## 4. Data Preprocessing


    Data preprocessing is the mechanism for “cleaning and transforming “ data; the
    data may be in various formats, including structured, semi-structured, or unstructured.
    These data have been taken directly from the input dataset or extracted in another
    way. Data processing is computational biology’s most complex and time-consuming
    machinelearning task. This complexity is due to the medical dataset’s irregular,
    redundant, unnecessary, and noisy information. When addressing data preparation,
    the terms “data creation” and “filtering procedures” are essential. The main advantage
    of preprocessing is it accelerates total execution. Data preprocessing includes
    filtering, standardization, instance determination, feature selection, extraction,
    transformation, and so forth. The resulting training set is the dataset obtained
    by data preprocessing.


    ### Ensemble classifier with Bagged Trees


    The ensemble classifier belongs to the machine learning algorithms that build
    a group of classifiers and then categorize incoming data points by weighing the
    predictions/classifications of those classifiers. Compared to the conventional
    machine learning approaches, which attempt to study one hypothesis from the training
    dataset. Ensemble learning trains several learners to tackle the same issue. Ensemble
    methods attempt to create hypotheses sets and combine them for use in prediction.


    A bagging tree is an ensemble approach applied for accurately classifying the
    data. It is also referred to as Bootstrap Aggregation. Initially, the base classifiers
    c1, c2,..cn are built on the bootstrap samples D1, D2,.., and Dn with a replacement
    before generating the decision trees. Later, all basic classifiers c1, c2,...
    cn are combined with the majority votes to create the final decision tree. Thus,
    this proves that bagging plays a vital role in medical diagnosis and can be used
    with any classifiers.


    ## 5. Feature Selection


    Accurate feature selection is significant in improving classification accuracy.
    In the proposed system, the resultant data from the ensemble classifier is used
    for feature selection using various attributes. The selection of a few essential
    aspects results in accurate prediction outcomes at minimum time. The sample distribution
    in most disease datasets needs to be more balanced, fewer samples fall into the
    positive category whereas more fall into the negative group. The performance evaluation
    is discussed in the experimental and result section.


    ## 6. Experimental Results'
