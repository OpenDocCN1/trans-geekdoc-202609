- raw: 'A many layer network which uses neurons is constructed by employing numerous
    complex layers, also termed as the layers that are hidden . As stated by the title,
    “black box” alludes to the fact that the computations underlying such layers are
    concealed from the user. The points of the data are transmitted starting from
    the input layer to following levels up to the output layer, with computations
    occurring at each stage. The mentioned technique is coined as a feed and forward
    network with neurons. Usually, the count of the nodes in the input layer and the
    computational layer on the topmost are not equal. The accurate number of neurons
    and layers that are hidden will be calculated by the complexity of the necessary
    model and data\[[13](#ch12.xhtml#ref12_13)\].Utilizing hidden layers with fewer
    neurons than the input often leads in a loss of representation while still boosting
    the performance of the network, even though using a fully-connected layer is typical
    in some exceptional cases. This is most likely what happened when the noise in
    the data was removed.


    The undesirable behaviour that a network with an excessive number of neurons may
    display is overfitting. This circumstance arises if a network that uses neurons
    fits the patterns exactly in the training dataset that the algorithm struggles
    to function well on unexpected input because the expected data is not sufficient
    \[[14](#ch12.xhtml#ref12_14)\]. The work which has been mentioned has looked at
    the way the hidden layers are used in the network and the neurons in those layers
    alter the quality of ANNs (along with other hyperparameters). These characteristics,
    like topology, and structure of the network, can also be referred to as hyperparameters.


    ### 3.1 The Application of Backpropagation


    The loss function of a single-layer perceptron depends on the weights, making
    training it straightforward. When there are additional levels, the process is
    more challenging since the weights in the various layers interact. By using backpropagation,
    the error gradient is determined along several pathways to the output node\[[14](#ch12.xhtml#ref12_14)\].
    Both the forward phase and the backward phase of the algorithm are present. The
    data points are delivered to the input nodes during the forward phase, where the
    outcomes at subsequent layers are computed one at a time using the current weights.
    The outcome of this prediction is evaluated against the training example. The
    loss function gradient for each weight is shown by the backward phase. The gradients
    step backward from the output layer all the way to the first layer to update the
    weights. Each repetition of this weight update procedure over the training data
    is referred to as a “epoch, ” and ANNs frequently require thousands of iterations
    to for convergence.


    ### 3.2 Technologies


    TensorFlow, which is open-source library and has a high-performance, is made available
    by the Google Brain team’s developers and engineers, and has been utilised in
    this article. It is now used in a variety of scientific and commercial applications
    as a capable support for machine learning as well as deep learning\[[15](#ch12.xhtml#ref12_15)\].
    Incomparable user experience is combined with an incredible speed of experimentation
    using Keras, that is trained to run on TensorFlow top layer and various other
    libraries that come under machine learning. Modular, extendable design is used
    to achieve this. Instead of being an independent library, Keras was created primarily
    as an interface. The TensorFlow library now fully supports Keras, allowing for
    the straightforward coding of methodologies and its supporting operations\[[16](#ch12.xhtml#ref12_16)\]


    ### 3.3 Optimising the Hyperparameters of the Chosen Algorithms


    The activation function’s role in the creation of an ANN is one of its most crucial
    aspects because it directly affects the outcomes that can be obtained. Different
    sorts of activation functions can be supported by the network. Particularly in
    multilayer networks, where each layer may have its own non-linear activation function,
    the choice of an activation function’s type is critical\[[17](#ch12.xhtml#ref12_17)\].
    Every separate function has the potential to have a unique impact on the ANN’s
    outcomes, convergence, and overall network coverage. The four activation functions
    that have appeared the most frequently in recent research were chosen from a large
    pool of activation functions.


    a)\_Sigmoid b)-Hard Sigmoid c)\_Rectified Linear Unit (ReLU) d) \_Hyperbolic Tangent
    (tanh)


    A grid search process is used, that finishes a thorough search over the space
    of the hyperparameters, and the best network configuration is identified. The
    criteria for the grid search included:


    *   Batch size


    *   Activation function


    *   Optimiser


    *   Epoch count


    *   Number of neuron nodes


    *   Count of layers that are hidden


    ### 3.4 Dimensionality Reduction


    Dimensionality reduction refers to the pursuit of a feature vector that conveys
    the essence of the dataset while omitting the need to express each individual
    feature.


    The topic is how to build an n-dimensional projection that can describe the information
    in a k-dimensional space. This process has clear computational advantages. Preventing
    the “curse of dimensionality” is one of the additional advantages. Consequently,
    when dataset dimensions increase, the ML classifiers fail to produce the desired
    results \[[18](#ch12.xhtml#ref12_18)\]. The algorithms must exponentially increase
    the number of samples to make up for this flaw. There are many different methods
    for reducing dimensionality .Feature selection is typically used to obtain the
    most relevant feature set because insignificant features frequently produce noise.
    However, there are other ways to get a more focused feature set that fully describes
    the data. Linear Discriminant Analysis is a different strategy that can be used
    (LDA). The two main aim of the mentioned strategy is the using the feature of
    maximisation between the selected class centroids and the variation that results
    from minimisation within those classes. In other words, LDA aids in establishing
    boundaries across class clusters.


    Principal Component Analysis is another technique for dimensionality reduction
    that is extensively utilized in academic literature (PCA). PCA seeks out the data
    view with the greatest amount of variance. According to an example given in \[28\],
    if the data form a line of input, conducting the process of Analysis using the
    Principal component strategy would definitely show that the dimension is equal
    to 0 across all variances. Therefore, since the characteristics of those dimensions
    are unnecessary, they can be excluded. Data collection may indicate a strong signal
    in one direction, but noise will likely be present in a large number of aspects.
    The evoked projection with the largest value of variance is definite to capture
    the value and meaning of the data, given that the signal outweighs the noise to
    a sufficient degree.


    ## 4\. Experimental Setup'
