    # 18 饮食因素与青少年女性超重和肥胖流行率的相关研究


    A. Maria Vinitha 研究员，Presidency College, Triplicane, Chennai, 泰米尔纳德邦


    T. Pramananda Perumal 校长（退休），Presidency College, Triplicane, Chennai, 泰米尔纳德邦


    DOI: [10.1201/978100342866-18](https://dx.doi.org/10.1201/978100342866-18)


    ## 摘要

    青少年女性的超重和肥胖已成为印度城市日益关注的健康问题。在过去的几十年里，城市青少年群体更倾向于消费西方食物，而不是选择当地美食。就印度青少年女性而言，由于倾向于西方饮食，超重和肥胖问题日益凸显。由于地理位置和生活方式的影响，超重和肥胖已成为一种趋势。然而，关于食品习惯和生活方式对青少年超重和肥胖的影响，尚未得到深入研究。本研究旨在探讨导致青少年超重和肥胖的真实因素，以改善未来的健康状况。关键词：青少年、饮食、超重、肥胖


    ## 1 引言

    青少年女性的超重和肥胖已成为印度城市日益关注的健康问题。在过去的几十年里，城市青少年群体更倾向于消费西方食物，而不是选择当地美食。就印度青少年女性而言，由于倾向于西方饮食，超重和肥胖问题日益凸显。然而，由于地理位置和生活方式的影响，超重和肥胖已成为一种趋势。然而，关于食品习惯和生活方式对青少年超重和肥胖的影响，尚未得到深入研究。本研究旨在探讨导致青少年超重和肥胖的真实因素，以改善未来的健康状况。关键词：青少年、饮食、超重、肥胖


    在全球范围内，近 39% 的成年人由于不健康饮食和缺乏活动而超重或肥胖，体重指数（`BMI`）超过 25 kg/m² 的情况已成为严重的健康威胁。在许多国家，超重和肥胖已成为普遍问题，`BMI`
    超过 29.9 kg/m² 的比例正在迅速增加。在印度，由于地区，食品习惯和生活方式对青少年超重和肥胖的影响尚未进行详细调查。本研究旨在通过分析人体特征、饮食模式和身体活动，识别影响超重和肥胖的关键因素。此外，通过
    `BMI` 检验发现超重和肥胖的统计意义。


    ## 2 研究细节


    ### 2.1 研究地点与参与者

    本研究的数据随机收集自 2019 年 1 月至 3 月期间位于印度泰米尔纳德邦金奈的 7 所不同学校和 5 所不同大学的年龄在 16 至 19 岁之间的女性。在收集数据之前，已获得参与者及其父母的知情同意。


    ### 2.2 样本量估算

    为了获得 95% 的置信水平和 ±2% 的误差范围，本研究计划的样本量大于 1537（但在本研究中，我们将样本量设定为 2000），通过应用公式估算样本量：

    ```

    N = \frac{z^{2}\hat{p}(1 - \hat{p})}{\epsilon^{2}}

    ```


    ### 2.3 数据收集

    使用标准问卷收集了社会、人口统计、生理和人体测量数据。还收集了个人以及父母、兄弟姐妹和祖父母非传染性疾病（NCDs）的健康状况，如心血管疾病（`CVD`）、高血压、糖尿病（`DM`）、骨质疏松和癌症。根据
    `WHO`（世界卫生组织）标准计算成年人 `BMI` 为：体重（kg）除以身高平方（m²）。

    成年 `BMI` 的界值如下：小于 18.50 为“体重过轻”，18.50 至 24.9 为“正常”，25 至 29 为“超重”，30 以上为“肥胖”(WHO,
    2016)。


