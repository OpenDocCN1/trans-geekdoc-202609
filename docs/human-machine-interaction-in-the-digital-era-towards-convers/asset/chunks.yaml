    ## 8. Conclusion\n\nIn this work, an Ensemble classifier with the bagged tree\
    \ is proposed to predict heart disease from the covid-19 dataset from the ECDC\
    \ repository. This work mainly focuses on overcoming the drawbacks of existing\
    \ approaches such as lack of accuracy and maximum time consumption. The research\
    \ on machine learning approaches dealing with the combination of Covid-19 and\
    \ heart disease is minimum. The major problem with machine learning is that sometimes\
    \ a dataset can be accurately classified, even though it can be improved if its\
    \ attributes are successfully extracted. In the proposed system, preprocessing\
    \ is initially computed with the dataset to remove the noisy information. Next,\
    \ an ensemble classifier with the bagged tree is applied to get the prediction\
    \ model on attributes like TP rate, Recall, FP rate, F-Measure, Precision, PRC\
    \ area, MCC and ROC. Finally, the proposed Ensemble classifier performance is\
    \ evaluated with MATLAB, which results in an accuracy of 98.8%. The obtained results\
    \ prove its accuracy level in prediction is more efficient than the existing approaches.\n\
