    令人惊讶的是，较小设置的结果优于更深结构。研究的统计显著性部分将对这些发现进行更详细的说明。该算法已在多次试验应用于 CICIDS2017 数据集。表 12.5
    中的初步发现结果非常积极，准确率超过了 99% (0.9936)。数据集中可能存在平衡问题，正如其中一个类别所示。该方法的准确率优于测试集的 97%，10
    折交叉平均验证的准确率为 95%。


    ### 5.1 ML 算法性能比较


    本节重点关注机器学习（ML）算法的性能。测试在具有高斯核的 SVM、朴素贝斯分类器和 Ada Boost 上进行，以对这些方法的性能进行对比。分类器使用 CICIDS017
    数据产生的结果变化如表 12.6，列出了每个类别的精率、召回率和 F1 分数，以及朴素贝斯分类器在整个 CICIDS017 数据集上获得的结果。


    ### 5.2 超参数优化


    每个设置都进行了超参数优化。所选超参数通过网格搜索法对所有组合进行了评估。如表 12.1、表 12.2、表 12.3、表 12.4、表 12.5 和表 12.6
    所示，按顺序对批大小、激活函数、优化器和使用的轮次数进行了排列组合，以获得最佳准确率。


    ### 5.3 统计分析


    为了评估本研究的统计显著性，应用了经典的 Wilcoxon 符号秩检验（Wilcoxon Signed-Rank Test）。表 5 汇总了性能最好的 NSL-KDD
    设置。所有这些配置都与排名最高的配置进行了比较，但测试未能证明统计显著性，这得出结论：如果为该数据集正确设置超参数，神经网络的拓扑结构对准确率没有明显的影响。


