    **Enhanced YOLOv4 for Pedestrian and Locomotive Signal Light Detection on Railway
    Tracks**


    A method for detecting organisms on railroad tracks is called the Railway Track
    Tracing Technique. The system consists of a camera, a train status system, and
    an alert application. At periodic intervals, the camera takes pictures of the
    track, which are later identified by image processing.


