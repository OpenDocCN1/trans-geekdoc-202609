    Tables demonstrating the accuracy levels attained by various hyperparameters arrangement
    of various complexity that increase steadily are used to present the findings
    of the tests that were conducted. Although the trials were not carried out in
    this order, this method of presentation has been chosen to make things more clear.
    Accuracy attribute was selected as it is simple as well as effective for any learning
    algorithms that are used for detecting the attacks in network environment. It
    offers several confusionmatrix based metrics that have the capacity to describe
    precisely the classifiers capabilities .


    Accuracy is also one of the metrics that IDS research uses the most frequently.
    This work uses a balancing data process that reduces the impact of datasets with
    substantial class imbalance, despite the fact that this method has drawbacks for
    these datasets. Precision and recall are used to further amplify the information
    that accuracy offers. Tables are arranged in order of accuracy. To avoid placing
    a simple condition on the models, early stopping was not used.


    The achieved accuracy variation in the smallest of the examined topologies is
