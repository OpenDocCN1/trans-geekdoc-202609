    ### 5.1 Accuracy


    The models’ classification performance was evaluated based on their training and
    validation accuracy values. [Figure 16.4](#ch16.xhtml#fig16_4)(a) shows the accuracy
    result for various CNN models. Among them, MobileNetV2 achieved the highest accuracy
    for both training and validation, with 95% and 90%, respectively. VGG19 had the
    second-highest accuracy, with a training accuracy of 88% and a validation accuracy
    of 81%. ResNet50, AlexNet, and DenseNet121 had lower accuracy values.


    ### 5.2 Loss


    The loss value measures a model’s performance after each iteration, with less
    loss indicating better performance, except for over-fitting. [Figure 16.4](#ch16.xhtml#fig16_4)(b)
    shows the loss rates of different models during training and testing. As the number
    of epochs increased, the rate of loss generally decreased. MobileNetv2 had the
    lowest loss rates of 0.528% and 0.7928% for training and validation, respectively.
    VGG19 had the second-lowest loss rates. AlexNet, ResNet50, and DenseNet121 had
    higher loss rates.


    ### 5.3 Compilation Time


    A model’s effectiveness depends on both its accuracy and completion time. [Table
    16.1](#ch16.xhtml#tab16_1) shows the compilation time in minutes and seconds.
    DenseNet121 had the longest completion time of 31 minutes and 86 seconds, while
    MobileNetv2 had a shorter time of 3 minutes and 51 seconds. MobileNetV2 had the
    best prediction results, with the highest accuracy and lowest compilation time.


    ## 6\. Conclusion


    The study shows that non-destructive methods can be used to determine whether
    a watermelon is unripe, ripe, or overripe. This study presents a comparison of
    different CNN-based models for classifying watermelon ripeness. Models evaluated
    include AlexNet, ResNet50, VGG19, MobileNetV2, and DenseNet 121. A dataset made
    up of 300 images of watermelons was used in these models. Performance analysis
    was performed by comparing three performance metrics: accuracy, loss, and classification
    time. Overall, the MobileNetV2 showed the best performance in watermelon ripeness
    classification, with 95.97% accuracy, the lowest loss, and the least compilation
    time.


