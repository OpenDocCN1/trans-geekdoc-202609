- raw: 'The acquired data and analysis of the statistical significance of the findings
    attained by specific setups showed that, past a certain point, neither deepening
    network under neural environment nor increasing the neurons numbered layers, ANN
    accuracy can be increased for the base dataset under evaluation. In this study,
    the proposed method was thoroughly explained and its performance on two benchmark
    datasets was demonstrated, demonstrating its usefulness by displaying equivalent
    findings. The numbered layers that are hidden and the numbered neurons on those
    layers were varied on testing a vast range of neural based topologies. The effect
    that different hyperparameter choices have on the metrics attained was estimated.
    Threats to the legitimacy of the suggested approach were explored, as well as
    the issue of data imbalance. Two standard sets of datasets which are always used
    for testing and training are NSL-KDD and CICIDS2017 respectively. The tests showed
    that employing the incorrect combination of hyperparameters might result in radically
    different results while applying the same topology over the same dataset. In one
    instance, increasing the batch size from 10.to 100 causes the accuracy to decrease
    from 0.9498 to 0.8592. When using SGD instead of rms prop optimizer, accuracy
    decreases from 0.9545 to 0.8592. When using tanh instead of R e L U activation,
    accuracy plummets startlingly from 0.9545 to 0.0564. However, the accuracy was
    increased to 0.9990 when the sigmoid activation function was used in the identical
    arrangement. The experiments that employed CICIDS2017 show a similar outcome.
    The accuracy falls from 0.9582 to 0.5850 this time. As demonstrated in the previous
    paragraph, this work offers experimental evidence that even a little change in
    configuration may have a large impact on the metric to be calculated and used.
    The ideal amalgamation of the examined standards was discovered. Additional settings
    that are comparable to the quality setup (for the value p = 0.05) were also used
    for NSLKDD.


    ## 6\. Conclusion


    The proposed work has successfully implemented and simulated hyperparameter optimization
    in Artificial Neural Networks (ANN) to achieve a efficient network intrusion detection.


