    better results than existing system.


    ![Fig. 15.2 Comparison of query processing time](images/fig15_2_C.jpg)


    [Fig. 15.2 Comparison of query processing time](#ch15.xhtml#R_fig15_2)


    ### 3.2 Mean Absolute Error (MAE)


    The `MAE` comparison of the proposed `EVSM` and the current `VSM`-based recommendation
    approach is shown in [Fig. 15.3](#ch15.xhtml#fig15_3). The results of the inquiry
    demonstrate that in comparison to the prior approach, the proposed method achieves
    the smallest `MAE` value.


    ![Fig. 15.3 Comparison of MAE](images/fig15_3_C.jpg)


    [Fig. 15.3 Comparison of MAE](#ch15.xhtml#R_fig15_3)


    ### 3.3 Comparison of Precision


    The accuracy performance for the proposed `EVSM`-based recommendation and the
    current `VSM`-based recommendation approach are compared in [Fig. 15.4](#ch15.xhtml#fig15_4).
    The experimental results demonstrate that the designed system produced better
    results than existing system.


    ![Fig. 15.4 Comparison of MAE](images/fig15_4_C.jpg)


    [Fig. 15.4 Comparison of MAE](#ch15.xhtml#R_fig15_4)


    ## 4. Recommender Model for e-Learning Using Enhanced Support Vector Model (ESVM)


    This study has described the creation of a recommendation method for an online
    learning system based on Enhanced Vector Space Model (`EVSM`). This strategy combined
    content-based filtering with collaborative filtering techniques to boost the effectiveness
    of the tailored system. The adjusted cosine similarity measure is offered in this
    study to assess the similarity between learners. The analysis’s findings indicate
    that, in terms of query processing time, `MAE`, and accuracy, the suggested system
    outperforms the current methodology. Future recommendations will be more accurate
    thanks to the use of various optimization methods like Firefly Algorithm (`FA`)
    and Particle Swarm Optimization (`PSO`) algorithms.


    ## 5. References


