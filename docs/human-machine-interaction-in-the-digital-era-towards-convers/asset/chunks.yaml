- raw: '### 2.1 General Image Forgery Detection System


    In order to make a few ideas clearer, we first provide a broad overview of the
    application in question. The types of forgeries that are most frequently found
    are briefly described in the section below that.


    ![Fig. 3.1 Types of forgeries \[1\], \[2\], \[3\], \[4\], \[6\], \[7\], \[8\],
    \[9\]](images/fig3_1_C.jpg)


    Fig. 3.1 Types of forgeries \[[1](#ch3.xhtml#ref3_1)\], \[[2](#ch3.xhtml#ref3_2)\],
    \[[3](#ch3.xhtml#ref3_3)\], \[[4](#ch3.xhtml#ref3_4)\], \[[6](#ch3.xhtml#ref3_6)\],
    \[[7](#ch3.xhtml#ref3_7)\], \[[8](#ch3.xhtml#ref3_8)\], \[[9](#ch3.xhtml#ref3_9)\]


    To modify digital photos, three methods are frequently utilised.


    1.  Tampering


    2.  Splicing


    3.  Cloning or Copy-Move.


    #### Tampering


    Image Tampering is altering an image to produce a new outcome. It is a form of
    digital art that requires a strong sense of visual inventiveness and an understanding
    of picture attributes. One tampers images for a variety of reasons, such as for
    entertainment purposes when using digital tools to create amazing photos or to
    create fake proof. Passive image tampering detection validates the legitimacy
    of digital photos without having any prior information of the source images.


    #### Image splicing


    It is a photo editing technique that involves digitally fusing multiple independent
    images into a composite. This is a key stage in the popular digital photomontage
    technique used for modifying pictures in digital form, that is also known as a
    paste-up because it was created by joining the photos using tools like Photoshop.


    ![Fig. 3.2 Original image and forged image Source: Original images taken on Oneplus
    Mobile Phone](images/fig3_2_C.jpg)


    Fig. 3.2 Original image and forged image *Source:* Original images taken on Oneplus
    Mobile Phone


    The most popular way to modify a digital image is through image forging. Copy-move
    techniques basically include inserting picture blocks into an existing image while
    obscuring crucial details or objects. As a result, the image’s validity and uniqueness
    are both compromised. Forgery is exceedingly challenging to spot because the cloned
    blocks have the same attributes as the other image blocks because they are from
    the same image.


    #### Detecting image forgery with splicing


    The spliced image is used in various contexts, including news coverage, photography
    competitions, essential evidence in academic papers, and more, which could have
    unfavourable effects. It follows that determining the image authenticity and spotting
    altered portions of an image become essential and difficult research topics as
    digital images become more susceptible to malevolent alteration than their non-digital
    equivalents.


    Some techniques that have been mentioned in the literature include the following;
    categorized as feature-based methods, estimation of illumination colour, inconsistent
    noise levels in the source image, the source image’s statistical characteristics,
    as well as other techniques.


    #### Illumination colour estimation


    Among other red flags, lighting discrepancies may be useful for splicing detection
    in determining the validity of a digital image. This is because it’s challenging
    to create a forged image with the right adjustment of the lighting circumstances.


    For the purpose of identifying differences between local picture regions, a physics-based
    illuminant colour model was devised in the method proposed by C. Riess And E.
    Angelopoulou. In order to estimate the results and use them in forensic investigation,
    the authors constructed an illumination map based on distance measurement. Users
    must get involved with this strategy.


    Used fluctuations in the colour of the illuminant in the area surrounding the
    object to identify region splicing forgeries using local illumination estimate
    was proposed by Yu Fan, Philippe Carré and Christine FernandezMaloigne. To estimate
    the illuminant of each horizontal and vertical band, they suggested combining
    five simple statistics-based techniques.


    C. Riess And E. Angelopoulou provided a novel method for identifying faked photos
    of individuals using the illuminant colour for further research. Using statistical
    grey edge estimation and a physics-based technique that takes use of the inverse
    intensitychromaticity colour space, they calculated the illuminant colour.


    ### 2.2 Forgeries Based on Inconsistency in Image Noise Levels


    Image noise can be used to improve accuracy in spliced image region detection
    by forging documents with inconsistent noise levels. It is clear that every digital
    camera image is susceptible to some form of noise, which may occur during the
    photon entry process and up until the camera outputs the image.


    In their study, Xunyu Pan, Xing Zhang and Siwei Lyu, a blind forgery detection
    method based on local noise inconsistencies is suggested to find small regions
    that have been tainted by local noise. In order to achieve the greatest resolution
    with no overlapping blocks, the technique employs high pass diagonal wavelet coefficients.
    To identify spliced forgeries, the image was segmented using a straightforward
    region merging method based on the homogeneity requirement into a number of homogenous
    subregions. When the authenticated image contains the same amount of noise as
    the image with the uniform noise level, the approaches do not operate as well.


    The writers of this research suggested a practical way as an improvement. The
    image is first separated into non-overlapping blocks, and clustering is used to
    make the blocks neat and altered.


    An automatic method for spliced forgery detection in raw photos is suggested by
    Thibaut Julliand, Vincent Nozick And Hugues Talbot in their paper. By examining
    image discrepancies from quad-tree decomposition, they were able to identify potential
    sliced images by using the relative consistency of the noise parameters.


    A method for detecting region splicing based on the phenomena of projection kurtosis
    concentration was proposed by Siwei Lyu,Xunyu Pan And Xing Zhang.


    A closed-form solution exists for the optimization problem of noise statistics
    estimation. These methods are all based on differences in noise on a single scale.


    A technique where the image is split into super pixels of many scales and then
    noise level function is applied to each individual scale was proposed by Chi-Man
    Pun, Bo Liu and Xiao-Chen Yuan, taking advantage of multi scales as an indicator
    for identifying spliced image counterfeiting. The Optimal Parameter Combination
    Searching algorithm is then used to further process the segments that are not
    restricted by the noise level function in order to identify the spliced sections.


    Yu-Feng Hsu And Shih-Fu Chang developed a technique based on determining the camera
    features that are consistent across different portions of an image. A camera response
    function (CRF) is computed from each segment of a segmented image using geometric
    invariants from LPIPs. SVM-based classifier is provided with computed CRF scores
    and area intensity characteristics.


    Zhenhua Qu1, Guoping Qiu2, And Jiwu Huang suggested a machine learning method
    that uses the human visual system model. There is a strong link between the first
    few fixation sites determined by edge sharpness and the spliced borders.


    The approach proposed by H. R. Chennamma, Lalitha Rangarajan uses line-based calibration
    to measure the image’s lens radial distortion. When there are straight edges in
    the image, the approach recognises them successfully, but a poor image will result
    disturbances along with the straight lines, leading to an incorrect assessment
    of radial distortions.


    Kunj Bihari and Vipin Tyagi in their study of a deep learning-based technique
    to identify picture splicing in the photographs used a method called “Noiseprint”.
    The average classification accuracy for the suggested approach is 97.24%.'
