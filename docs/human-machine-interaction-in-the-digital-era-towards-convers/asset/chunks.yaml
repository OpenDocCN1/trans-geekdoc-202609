    识别以往数据中模式的能力是计算智能的许多应用之一，随后可用于对未来将发生的情况进行预测 [7]。研究历史信息可以实现这一目标。`AI` 与 `IoT` 的集成为企业提供了对测试案例进行预测性分析的机会，这反增强了它们的流程自动化能力
    [8]。


    人工智能的最终目标是通过构思可行的解决方案来解决挑战性问题。这些可能性呈现出结果组合，其中某些结果不像其他那样容易实施 [10]。在这种情境下，搜索算法扮演着人工智能智能体的角色。它隐藏自己并在后台工作，研究许多前行的道路，并在保持完全不露面的情况下指引你走向正确的方向。没有了这些算法，`AI`
    系统将无法决定采取什么行动以获得最佳结果 [11]。


    ## 2. 相关工作


    肺癌是人类最常见的疾病类型，起源于器官组织，然后扩散到身体的其他部分。使用烟草制品与约 85% 的肺癌病例的发展之间存在相关性。肺癌是由肺部异常细胞不受控生长引起的，特别是在气管分叉线周围区域。这是导致疾病进展的主要因素
    [12]。糖尿病患者的生存机会极不可预测。根据发现，需要更多胰岛素的糖尿病患者比需要较少胰岛素的患者具有更高的并发症风险 [13]。


    据推测，糖尿病在肺癌的发展中起了了作用。这是根据 Mishra 等人进行的一项研究。经常吸烟的人比不吸烟的人具有更高的患发胰岛素抵抗的风险，且胰岛素敏感性较差
    [14]。戒烟是控制糖尿病和降低与疾病相关的并发症脆弱性的先决条件 [15]。通过利用电子健康记录（`EHRs`），患者可以获得执行其个性化健康计划的协助。这些记录还可用于向患者提供医疗护理协调
    [16]。


    以往对肺癌治疗进行的先研究使用了广泛的计算机工具进行分析。Setio 等人 [17] 创建了一个 3D 卷积神经网络（`CNN`）模型，其目标是在肺结节分类中实现
    `FP` 最小化。该模型的创建目的是减少识别肺结节过程中的假阳性数量。通过使用多补丁方法结合 `Fragni` 滤波器，Hongyang 等人 [18] 成功开发了一个以社区为导的肺结节识别模型，改进了预测能力。


    Kattan 和 Bach [19] 提倡进行多因素研究，以分析观察到的烟民中肺癌风险异常偏移的现象。结果表明，与没有烟瘾的年轻人相比，对烟草成瘾的年轻人患肺癌的风险更大。这些年轻人的平均年龄范围在
    18 到 28 岁之间。


    Ramachandran 等人 [20] 利用知识挖掘方法构建了各种疾病风险（包括肝炎和肺癌）的预防模型。Thangaraju 等人 [21] 利用 `Bayes
    trees` 和 `decision trees` 等分类器进行预测。


    ## 3. 提出的方法


    迁移学习分类器旨在根据患者表现出的症状对肺癌患者进行分类。在所提出的方案框架内，预处理阶段位于数据收集之前。


