    神经退行性疾病是一场全球性的流行，影响着世界上每个地区数百万人的生活。神经退行性疾病是指大脑中的神经元逐渐失去功能并最终死亡时就会表现出来的疾病。这些疾病被称为神经退行性疾病。目前还没有被证明能够阻止疾病本身进展的药物
    [1, 2, 3, 4 和 5]。这是因为这种疾病尚无法治愈。另一方面，可能某些方法有助于减轻神经退行性疾病引起的某些精神或身体痛苦。神经退行性疾病种类多样，根据神经细胞死亡影响的大脑区域以及该疾病引起的症状，每种疾病都被分为不同的类别
    [6]。


    此外，如果对患者疾病的严重程度进行正确评估，就可以在正确的时间给患者正确的药物。患者报告与医生评估之间的分歧可能会掩盖疾病预后的真实严重性。这是因为双方在观点上都存在偏见
    [11, 12, 13, 14 和 15]。在目前，一种由人工智能支持且仅依赖步态数据的系统，比目前使用的方法具有较低成本提供更客观评估的。


    为了将神经退行性疾病归入适当类别，我们将一种基于认知的学习技术（多层感知器）集成到前馈 MLP（Feed forward MLP）中。当我们训练 `FFMLP`
    模型时，的第一件事是获取数据集并将其分为训练集和测试集。之后，我们使用训练集。在测试数据集上对训练好的 `MLP` 模型进行评估后，会将检测到的示例显示给用户。


    ## 2. 文献综述


    Sadeeh 等人 [16] 的贡献之一是展示了一种用于跌倒检测和预测的传感器原型。在预计会跌倒的情况下，患者将收到警告并采取措施，而在确实发生跌倒时，设备将提醒医疗人员。云端能够在老年患者跌倒时通知医人员，允许团队立即协助患者。


    Du 等人 [17] 使用纵向支持向量回归（`SVR`）来确定人口统计参数是否可以正确预测 ALS 的严重程度。他们建议采用一种创新的机器学习方法来完成纵向数据的收集。为了跟踪整个研究期间参与者的行为，该技术在研究过程中的多个间隔计算新的加权参数。这些包括
    `SVR` 超平面的特征以及给定时间内的趋势趋势参数。正因如此，他们开发了 `LSVR`，将纵向建模与机器学习范式相结合，以满足行业中显而易见的需求。通过这种方式，`LSVR`
    将纵向建模与机器学习范式融合。


    Sadeeh 等人 [18] 开发的单三轴加速度传感器是一种佩戴在大腿上的设备，用于预测和识别人体跌倒的情况。之后，信息会被保存，以便医疗专业人员对患者进行全面的随访。如果患者发生跌倒，通知将通过互联网发送给相关的医疗人员。如果预计会跌倒，患者也会被通知。


    Benassar 等人 [19] 希望建立一个低成本、客观且自动的系统，用于测量 HD 引起的上肢活动受障碍。他们通过利用机器学习和信号处理技术来实现这一点。这本应该是他们的终极目标。他们提供了一种方法，在患者执行涉及其上肢的新颖任务时，客观且持续地评估
    HD 患者的运动障碍。该方法由华盛顿大学的研究人员开发。通过应用信号处理和机器学习的方法，从记录的加速度计信号中自动构建了一个反映活动受障碍程度的评分。该评分源于获得的数据。来自加速度计的数据用于生成此评分。


    Gaßner 等人 [22] 决定利用基于传感器的步态分析进行调查，因为他们想客观地定义 HD 患者步态的特征。通过基于移动传感器的步态分析，本研究的目的是对比
    HD 患者与同龄同性别的对照组人员的步态参数。为了确定这些客观衡量标准是否具有临床相关性，我们特别研究了步态测量与总运动评分（`TMS`）以及总功能能力（`FRC`）之间的相关性。从这些步行传感器中收集的
    `GRF` 数据被输入到 Aşurolu 等人 [24] 提出的机器学习模型中。


    他们提供的服务之一是基于生成信号数值属性的回归分析。他们将使用的模型称为混合模型并命名为 `LWRF`。他们提供的另一项服务是变量之间的相关性。具体而言，他们提供了一种评估帕金森病（`PD`）患者运动症状严重性的计算方法。


    ## 3. 提方法


    在本节中，图 1（ch9.xhtml#fig9_1）所示的框架展示了如何使用 `FFMLP` 良好地分类神经退行性疾病。


    ![9.1 认知框架](img/fig9_1.jpg)

    *图 9.1 认知框架* [1]


    ### 3.1 FFMLP


    采用反向传播算法进行监督学习的神经网络示例是全连接多层感知器，也称为 `FFMLP`。


    `MLP` 在具有输入层、隐藏层和输出层的三层设计中运行效果最好。此外，在这种架构中，每个神经元都连接到其下方的每一个神经元。人们认为，`MLP` 在解决非线性问题时是成功的。


    如公式 (1) 所示，`MLP` 设计可确定输入变量、偏置值和输出值：


    ```

    S_{i} = \sum_{i = 1}^{n}w_{ij}I_{i} + \beta_{i}

    ```


    多层感知器中，通过求解公式 (2) 得到的 sigmoid 函数经常被用作激活函数。


    ```

    f_{j} = \frac{1}{1 + e^{- S_{j}}}

    ```


