    # 利用技术解决方案应对海洋漂浮塑料垃圾污染


    ### 摘要

    估计全球海洋中的宏观塑料含量是最严峻的挑战之一。统计漂浮垃圾数量的最流行技术耗时较长且仅在较窄的区域有效。为了克服这些缺点，开发了一种基于深度学习框架的自动识别方法，用于发现和量化海洋垃圾。结果建议采用
    `FMA-YOLOv5` 方法，这是 `YOLOv5` 技术的改进版本，它在骨干网络末端使用特征图注意力 (`FMA`）层进行检测和分类。图像分类器使用基于深度学习的分割模型来量化样本中的海洋碎片。将建议策略预测的沿岸碎片数量与人工监测方法的估计值进行比较，以证明其差异。显然，所提出的结果为制定高效的海洋垃圾控制和法规提供了关键数据。


    ### 关键词

    碎片、海洋、水生、污染、Yolo、垃圾、塑料


    ## 引言

    海洋垃圾，特别是塑料污染，是目前威胁我们生态系统最大的环境问题之一。海洋垃圾存在于全球所有领域，被描述为在海岸和海洋环境中被处置、丢弃、忽视或放置不当的任何耐用、制造或处理过的固体物质。海岸线海洋垃圾污染对生态系统、人类生活和海洋生物产生了可怕的影响。由于它可以缠绕任何类型的海洋生物（包括鱼类、海龟和海洋动物），而且它会被海洋生物（特别是大型滤食性物种）吞，漂浮海洋垃圾具有特别的破坏性。全球塑料产量已超过
    5 亿吨，预测显示有 30% 的塑料将进入海洋。在太平洋垃圾带内部，塑料垃圾已增加了五倍，研究表明其数量已是浮游生物的六倍。我们看到的海洋塑料约 80% 源自陆地：最常见的形式是包装材料和食品容器（如塑料袋和瓶）。其余
    20% 来自运输船舶的排放和废弃的渔具。根据研究，清理海洋塑料对生态系统健康产生巨大的影响，包括防止入侵物种在区域间扩散、防止其降解为微塑料以及减少温室气体排放（从而减缓气候变化）。确定塑料垃圾（PMD）的数量对于开展高效的海滩清理和评估海洋垃圾对环境的影响至关重要。


