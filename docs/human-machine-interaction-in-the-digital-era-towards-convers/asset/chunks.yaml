    # 3. 结果与讨论


    ### 3.1 受访者特征


    参与者的平均年龄为 17.63 岁，标准差（SD）为 1.15。参与者的平均体重为 48.94 公斤，标准差为 9.26。参与者的平均身高为 155.6 cm，标准差为
    6.62。参与者的平均 BMI 为 20.19，标准差为 3.49。参与者的平均腰围为 88.7 cm，标准差为 8.8。参与者每日体力活动中位数为 25
    分钟，四分位距（IQR：20–60 分钟）。参与者家庭的月收入中位为 34,000 卢比，四分位距为 19,000–1,00,000 卢比。2000 名参与者中有
    32 人(1.6%) 至少有一位超重/肥胖的父母。肥胖流行率为 20(1%)，超重流行率为 113(5.65%)。观察到超重和肥胖在青少年晚期更为常见，其中肥胖和超重在
    19 岁时达到峰值，分别为 10(0.5%) 和 33(1.65%)。


    在评估与超重和肥胖相关的生活方式风险变量时发现，在肉类饮食的青少年（108(5.4%)）、经常进餐的青少年（103(5.15%)）以及跳餐的青少年（56(2.8%)）中，超重和肥胖的流行率较高。经常食用不健康饮食和即食食品与超重和肥胖的发生具有统计学意义，流行率分别为
    91(4.55%)、85(4.25%)、96 (4.8%)、103(5.15%)、73(3.65%) 和 79(3.95%)。此外，有 117(5.85%)
    的超重和肥胖个体没有进行任何形式的体育活动，如锻炼或做运动。


