    ## 5\. Conclusion


    A deep learning approach was employed in this study to develop an automated method
    for finding and measuring marine rubbish. This study suggests the FMA-YOLOv5s
    network architecture for object identification and classification. A feature map
    attention (FMA) layer is introduced at the end of the backbone based on YOLOv5s
    to improvise feature extraction. U-Net, a segmentation model built using a deep
    learning methodology, was also employed to calculate the quantity of trash. With
    a precision of 0.90 mAP, the network model created for this investigation categorised
    the items. Then, the proposed automatic approach’s prediction of marine waste
    standing-stock on the entire beach was compared to a statistical calculation based
    on a manual method. This method is capable of detecting floating items in water
    bodies with sufficient speed and precision in real-time. In the long term, greater
    focus can be placed on enhancing the recognition of blurry and dense items and
    supporting new categories of floating debris. Furthermore, the deep learning methodology
    developed in this work might be integrated with drones or unmanned airplane, allowing
    for the future creation and implementation of an automated monitoring system at
    national marine debris monitoring stations.


