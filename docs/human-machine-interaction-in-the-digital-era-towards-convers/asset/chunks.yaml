- raw: 'The NSL-KDD data collection was developed to address issues with the malware
    and data that comes inside as intruded data was frequently brought up in the literature.
    Even though it still exhibits some undesirable traits, it is now a recognized
    benchmark dataset. NSL-KDD is nevertheless a trustworthy option for detecting
    malware detection research due to the missing values of accessible IDS datasets
    and the difficulties in gathering required data. The collection has about 5, 000,
    000 records, which distinguishes it as acceptable for machine learning while also
    not being excessively big to make researchers have to choose random samples from
    the set. The outcomes are so easy to compare. In comparison to the KDD’99 dataset,
    the NSLKDD has been cleaned of redundant data to avoid bias in ML algorithms.
    The shortage of trustworthy and sufficiently updated cybersecurity datasets led
    to the creation of the Intrusion Detection Evaluation Dataset - CICIDS2017 . The
    IDS data that are used for the researchers typically have a number of drawbacks
    of their own, such as a lack of attack variety, lack of traffic diversity, and
    a lack of appropriate characteristics. By studying 25 users behaviour with a wide
    variety of protocols, CICIDS2017 provide data with real network traffic. Then
    the data was collected over a period of five days, of which four were occupied
    by attacks on the model setup.


    In addition to being one of the newest datasets accessible to academics, CICIDS2017
    includes more than 80 network flow features. [Figure 12.1](#ch12.xhtml#fig12_1)


    ![Fig. 12.1 An overall schema of ANN with n layers, neural nodes, and output layer
    Source: Adapted and Redesigned from https://blog.knoldus.com/architecture-of-artificial-neural-network/](images/fig12_1_C.jpg)


    [Fig. 12.1 An overall schema of ANN with n layers, neural nodes, and output layer](#ch12.xhtml#R_fig12_1)
    *Source:* Adapted and Redesigned from [https://blog.knoldus.com/architecture-of-artificial-neural-network/](https://blog.knoldus.com)


    To limit the number of features to 50, PCA is used. Based on preliminary setup
    tests, an arbitrary number of features was extracted. The feature and the dataset
    delivered to the first layer that is the input of the neural network contains
    feature vector. In [Fig. 12.2,](#ch12.xhtml#fig12_2) the process’s pipeline is
    depicted.


    ![Fig. 12.2 Process in the form of pipeline with dataset Source: Adapted and Redesigned
    from https://hazelcast.com/glossary/data-pipeline/](images/fig12_2_B.jpg)


    [Fig. 12.2 Process in the form of pipeline with dataset](#ch12.xhtml#R_fig12_2)
    Source: Adapted and Redesigned from [https://hazelcast.com/glossary/data-pipeline/](https://hazelcast.com)


    ### 4.1 Cross Validation


    Implementations of ML and many other aspects of AI come with a few unique problems.
    The overfitting of some of those issues is one of those issues. If the algorithms
    face these difficulties, they may perform brilliantly in a test setting but fall
    short when put to use on actual data. The models go through a process known as
    k-fold cross validation, also known as rotation estimation, to help alleviate
    this problem. The data that is used for training is divided into parts labelled
    as k, out of which k-1 data are used for training and the last component is utilised
    for testing. The process is then carried out k times while altering the portion
    of the test The data folds are randomly sampled and 10.fold cross-validation was
    applied in this study.


    ## 5\. Results and Discussion


    Multiple topological setups were examined, starting with 1–10(3 layers which is
    hidden mapped with ten neurons ([Table 12.1](#ch12.xhtml#tab12_1)) and progressing
    to 7 layers hidden mapped with 25 neurons ([Table 12.2](#ch12.xhtml#tab12_2)),
    ten layers of hidden with 25 neurons, four levels mapped with 25 neurons, and
    ten layers mapped with 25 neurons ([Table 12.3](#ch12.xhtml#tab12_3)).


    [Table 12.1 3 Layers with 10.neurons with NSL KDD dataset](#ch12.xhtml#R_tab12_1)


