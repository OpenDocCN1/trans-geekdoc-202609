- raw: 'The ability to recognize patterns in previous data is one of the many applications
    for computational intelligence, which can subsequently be used to make forecasts
    about what will happen in the future \[[7](#ch10.xhtml#ref10_7)\]. Researching
    historical information allows one to achieve this goal. The integration of AI
    and IoT gives businesses the chance to perform predictive analysis on test cases,
    which, in turn, boosts their capability to automate processes \[[8](#ch10.xhtml#ref10_8)\].


    The ultimate goal of artificial intelligence is to tackle challenging issues by
    conceiving of solutions that are viable. The possibilities present a combination
    of outcomes that are not as easily implementable as the others \[[10](#ch10.xhtml#ref10_10)\].
    Within the context of this scenario, the search algorithm plays the role of the
    artificial intelligence agent. It conceals itself and works in the background,
    studying the many paths forward and pointing you in the right direction while
    remaining completely out of sight. Without these algorithms, an AI system cannot
    be able to decide which action to take that will yield the best results \[[11](#ch10.xhtml#ref10_11)\].


    ## 2\. Related Works


    Lung cancer, which is the most common form of the disease in humans, originates
    in the tissues of the organ and then spreads to other parts of the body. There
    is a correlation between the use of tobacco products and the development of about
    85% of all lung cancer cases. Lung cancer is caused by the unchecked growth of
    abnormal cells in the lung, particularly in the region around the line of air
    division. This is the primary factor that contributes to the progression of the
    disease \[[12](#ch10.xhtml#ref10_12)\]. The chances of life for diabetic people
    are exceedingly unpredictable. According to the findings, those with diabetes
    who need a greater amount of insulin are at a greater risk for having complications
    than those who require a lower amount \[[13](#ch10.xhtml#ref10_13)\].


    Diabetes mellitus has been hypothesized to have a part in the development of lung
    cancer. This is according to a study that was conducted by Mishra et al. Those
    who smoke cigarettes on a regular basis are at a greater risk of developing insulin
    resistance and have a poorer insulin sensitivity than those who don’t smoke \[[14](#ch10.xhtml#ref10_14)\].
    Stopping smoking is an absolute prerequisite for bringing one diabetes under control
    and lowering one vulnerability to complications associated with the disease \[[15](#ch10.xhtml#ref10_15)\].
    By utilizing electronic health records (EHRs), patients can receive assistance
    with the administration of their individualized health plans. These records can
    also be utilized to coordinate the delivery of medical treatment to patients \[[16](#ch10.xhtml#ref10_16)\].


    Previous studies that have been conducted on the treatment of lung cancer have
    made use of a wide array of computer tools for their analysis. Setio et al. \[17\]
    created a model of a 3D convolutional neural network (CNN) for the goal of FP
    minimization in the classification of lung nodules. This model was created for
    the aim of reducing the number of false positives in the process of identifying
    lung nodules. Using a multi-patches method in conjunction with the Fragni filter,
    Hongyanget al. \[18\] successfully develop a community-oriented pulmonary nodule
    identification model with improved capability for prediction.


    Kattan and Bach \[19\] advocated doing a multifactoral study to analyze the phenomena
    of the observed shift in lung cancer risk anomaly among smokers. It was shown
    that young people who were addicted to smoking had a greater risk of developing
    lung cancer compared to young people who did not have an addiction to smoking.
    These young folks ranged in age from 18 to 28 years old, on average.


    Knowledge mining methods were utilized by Ramachandran et al. \[20\] to construct
    a preventative model for a variety of disease risks, including hepatitis and lung
    cancer. Classifiers such as Bayes trees and decision trees were utilized by Thangaraju
    et al. \[21\] to make predictions regarding cardiovascular risk variables utilizing
    a large-sample heart disease dataset. This was done in order to make predictions
    regarding cardiovascular risk variables.


    An exhaustive study on the detection and categorization of lung cancer using the
    application of computer prediction models. The majority of the existing models,
    in our opinion, make use of machine learning algorithms for classification that
    are on the more fundamental end of the spectrum. Even after carrying out a variety
    of processes for optimizing the qualities, the data samples still contain characteristics.
    There was an increase in the reliability of the lung cancer detection process.
    The examination of lung cancer does not typically make use of the transfer learning
    technique, which is another aspect of this disease.


    ## 3\. Proposed Method


    A Transfer learning classifier is applied with the intention of classifying patients
    who have lung cancer into the right category depending on the symptoms that they
    present with. Within the framework of the approach that has been proposed, the
    phase of pre-processing comes before the step of data collection. The chosen classifiers
    are then put through a training phase, followed by two independent testing phases
    on the benchmark dataset, which are carried out in accordance with the usual method
    of 10-fold cross-validation.


    In order to find the screening approach that is most successful for lung cancer,
    the information is analyzed and broken down into its component parts. The general
    strategy that will be implemented may be seen depicted in given [Fig. 10.1](#ch10.xhtml#fig10_1).


    ![Fig. 10.1 Proposed design](images/fig10_1_C.jpg)


    [Fig. 10.1 Proposed design](#ch10.xhtml#R_fig10_1)


    The data that was supplied is shown here in the same order in which it was supplied
    in the original query. These inputs are dependent on a wide variety of data kinds,
    each of which, in turn, requires a significant number of inquiries to be conducted
    before the necessary information can be received. These preprocessing techniques
    are used to divide the entering information into more manageable bits before any
    additional processing is carried out on the data.


    ### 3.1 Data Acquisition


    The lung cancer dataset is available online in a repository that is managed by
    the University of California, Irvine, and can be viewed through that platform.
    The dataset has a total of 32 samples, each of which has its very own unique collection
    of 57 attributes and a single class attribute. In total, there are 58 attributes
    and one class attribute. The fundamental reason behind our proposed line of inquiry
    is the ultimate goal of analyzing and comparing the efficacy of SVM and other
    methods that are comparable in nature. This purpose will be accomplished by conducting
    a series of tests.


    ### 3.2 Data Preprocessing


    The first thing that is done in the process of identifying lung cancer is called
    preprocessing. During this phase of the process, the dataset will be finished
    by removing unnecessary data and completing missing values. Therefore, in order
    to improve the general trustworthiness of the entire dataset, missing values are
    inferred using a method termed nearest neighbor, paired with three other values
    that are located in close proximity. It is essential to make sure that you have
    training as well as testing samples.


