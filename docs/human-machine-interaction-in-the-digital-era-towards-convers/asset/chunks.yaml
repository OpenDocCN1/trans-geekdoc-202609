    # 6. 结论


    这项工作旨在评估三种主要的特征估计技术的影响，即统计特征、GLCM 纹理特征和形状特征。本研究还评估了组合特征向量的影响。不同特征集对分类的影响比较表明，组合特征向量在实现
    `COVID-19` 检测和病情分类方面具有更大的潜力。本研究还提出了一种名为 `ASO-GRU-NN` 的新型分类器模型，它使用 `GRU` 作为基础模型，并使用名为
    `ASO` 的优化算法进行权重优化。与传统的 `CNN` 和传统的 `RNN` 模型相比，发现 `ASO-GRU-NN` 模型提供了最佳分类性能。这是因为
    `ASO-GRU-NN` 在训练期间优化调整了权重，从而减少了训练损失并提高了准确率。未来，可以将 `ASO` 应用于 `CNN`，以评估其在 `COVID-19`
    CT 切片图像特征图上的分类性能。


