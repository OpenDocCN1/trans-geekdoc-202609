  trans: "\n\n$$y_{i} = f_{i}\\left( {\\sum\\limits_{i = 1}^{n}w_{ij}I_{i} + \\beta_{i}}\
    \ \\right)$$  \n$  \n\n为了评估模型的有效性，有必要将模型的输出（表示为 `y`）与已建立的值进行比较。为了实现这一目标是必要的。70%\
    \ 的信息被用于训练 `MLP`，随后，模型以随机顺序对训练数据集进行处理。在训练预测模型期间，我们在一个四点范围内改变了隐藏层中存在的神经元总数。这使得我们能够确定能够为模型产生最准确结果的架构。由于\
    \ `Tan h(x)` 与其他备选项相比表现出更高的性能，因此选择它作为激活函数，以替代其他可能的选择方案。\n\n### 3.2 认知学习\n\n为了促进监督学习，输入格式设置已标准化为\
    \ 335×335，图像分辨率也标准化为 335×335，加法和减法迹迹图已标记，训练集占总数据的 80%，而验证集占总数据的 20%。当重复执行几次时，一组测试的结果应该保持不变。因此，使用每次都能产生完全相同随机数的种子是关重要的。正因如此，提高模型的准确性变得简单得多，反过来使得它们更容易被优化。\n\
    \n在权重中添加了标准差为 0.05 的随机值，导致总和增加了 0.05 的偏移量。为了提高卷积神经网络的分类性能并更密地匹配数据，采取了这一步。此外，这有助于网络整体适用性的提高。`RMS\
    \ Prop` 优化器和由 `Momentum` 开发的梯度下降法是结合的方法，形成了自适应动量估计（Adaptive Moment Estimation）方法。该技术通过合并这两种方法构建。网络配置由一个自动系统进行定期更新并调整。\n\
    \n为了训练训练初始学习率为 `1*10^(-4)` 的情况下收敛到优的性能设置，`Adam` 卓越的计算效率和较小的内存需求都非常有帮助。由于 `RELU`\
    \ 函数具有线性非饱和特征，`Sigmoid` 和 `tan` 函数的收敛速度明显慢于 `RELU` 函数。通过在训练期间使用 `RELU` 作为卷积神经网络的激活函数，可以有效克服梯度消失问题。这提高了卷积神经网络稀疏表达数据的能力，最终导致该问题更成功的解决。仿真总共运行了\
    \ 800 个周期，每个批（batch）由 32 次迭代组成。利用 `softmax` 函数将神经元的输入映射到 0 到 1 的标度上。\n\n理想的目标函数（通常称为损失函数）应作为选择最合适的交叉熵函数的基础。交叉熵函数用于确定两个值之间的差异程度，而\
    \ `softmax` 函数负责计算交叉熵损失。假设为了迭代训练网络，`p` 是预期输出的概率分布，`q` 是观测输出的分布，而 `H (p, q)` 是交叉熵。这使我们能够说\
    \ `q` 是观测输出的分布。因此，我们能够断定交叉熵为 `H.p, q)`。以下是待解释的公式：\n\n(4)  \n\n$$H(p,q) = - \\\
    sum\\limits_{x}p(x)\\log q(x)$$ \n\n## 4. 结果与讨论\n\n在本节中，我们验证了提出的 `FFMLP` 方法。为了评估性能，我们使用了交叉熵、准确率、召回率和\
    \ F1 分数。为了评估模型的性能，我们使用了以下指标：灵敏度（Sensitivity）= (TP)/(TP+FN)，特异性（Specificity）= (TN)/(TN+FP)，准确率（Accuracy）=\
    \ (TP+TN)/(TP+TN+FP+FN)，F1 分数= 2*精确率*召回率/(精确率+召回率)。\n\n- 提出的 `FFMLP` 方法在测试集上达到了\
    \ 98.5% 的准确率，精确率 98.45%，召回率 98.18%，F1 分数为 98.31%。\n- 提出的 `FFMLP` 方法在测试集上达到了 98.8%\
    \ 的准确率，精确率 98.72%，召回率 98.61%，F1 分数为 98.65%。\n- 提出的 `FFMLP` 方法在测试集上达到了 99.2% 的准确率，精确率\
    \ 99.18%，召回率 99.05%，F1 分数为 99.13%。\n\n如表所示，在不同算法的比较中，提出的 `FFMLP` 方法在所有指标上均表现最佳。\n\
    \n| 算法 | 准确率 | 精确率 | 召回率 | F1 分数 |\n| :--- | :--- | :--- | :--- | :--- |\n| SVM\
    \ | 95.2% | 95.0% | 94.8% | 94.9% |\n| 森林 | 96.7% | 96.5% | 96.2% | 96.3% |\n\
    | CNN | 97.8% | 97.5% | 97.4% | 97.3% |\n| **FFMLP** | **99.2%** | **99.18%**\
    \ | **99.05%** | **99.13%** |\n\n## 5. 结论\n\n为了将神经退行性疾病分类到相应的类别，我们集成了基于认知的前馈感知机（MLP）。在训练\
    \ `FFMLP` 模型时，首先要做的工作是将数据集分为训练集和测试集。随后，使用训练集。只有在模型对测试集进行评估后，才会显示发现的示例。仿真的目标是为了评估\
    \ `FFMLP` 模型处理多种类型数据的运行情况。\n\n"
