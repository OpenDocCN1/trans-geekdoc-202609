    # 数据分析与统计显著性


    通过获得的数据以及对特定设置所得结果的统计显著性分析表明，在超过某个点后，无论是在神经环境下加深网络，还是增加神经元数量的层数，对于所评估的基础数据集而言，`ANN`
    的准确率无法进一步提高。在本研究中，详细解释了所提方法，并展示了其在两个基准数据集上的性能，通过展示等效的发现证明了其实用性。在测试广泛的基于神经的拓扑结构时，对隐藏层层数以及这些层上的神经元数量进行了变动处理。还估计了不同超参数选择对所获指标的影响。本文还探讨了对所提方法合法性的威胁，以及数据不平衡问题。常用于测试和训练的两个标准数据集分别为
    `NSL-KDD` 和 `CICIDS2017`。测试表明，在相同数据集上应用相同的拓扑结构，使用错误的超参数组合可能会导致截然不同的结果。例如，将批大小从
    `10.` 增加到 `100` 会导致准确率从 `0.9498` 下降到 `0.8592`。使用 `SGD` 代替 `rms prop` 优化器时，准确率从
    `0.9545` 下降到 `0.8592`。使用 `tanh` 代替 `ReLU` 激活函数时，准确率惊人地从 `0.9545` 跌至 `0.0564`。然而，在相同的配置下使用
    `sigmoid` 激活函数时，准确率提高到了 `0.9990`。使用 `CICIDS2017` 的实验显示了相似的结果，准确率从 `0.9582` 下降到
    `0.5850`。如前一段所示，这项工作提供了实验证据，表明配置的微小变化也可能对计算和使用的指标产生巨大影响。发现了所研究标准的最理想组合。对于 `NSLKDD`
    还使用了与高质量设置相当（值为 `p = 0.05`）的额外设置。


    ## 6. 结论


    该工作成功实现并模拟了人工神经网络（`ANN`）中的超参数优化，实现了高效的网络入侵检测。


    ## 参考文献


    1. Michał Choras, Marek Pawlicki, ”Intrusion detection approach based on optimised
    artificial neural network”, Elsevier Publishing, Neurocomputing 452(2021) 705–715

    2. M. Feurer, F. Hutter, “Hyperparameter Optimization”, Springer International
    Publishing, Cham, 2019, pp. 3–33. doi:[10.1007/978-3030-05318-5_1](http://dx.doi.org/10.1007/978-3030-05318-5_1).

    3. Roopa M and Dr. Selvakumaraja, “Intelligent Intrusion Detection and Prevention
    System using Smart Multi-Instance Multi- Learning Protocol for Tactical Mobile
    Ad hoc Networks”, KSII Transactions on Internet and Information Systems, VOL.
    12, NO. 6, 2895–2921, Jun. 2018. ISSN: 1976–7277.

    4. M. Choras´, R. Kozik “Machine learning techniques applied to detect cyber attacks
    on web applications”, Logic J. IGPL 23 (1) (2015) 45–56, [`doi.org/10.1093/jigpal/jzu038`](https://doi.org/10.1093/jigpal/jzu038).

    5. Seungwon Lee, “A Study of Neural Network Based IoT Information Security”, Journal
    of Theoretical and applied Information, Volume 96, Issue 22, ISSN: 1992–8645,
    E-ISSN: 1817–3195, 2018.

    6. I. Mukhopadhyay, et.al, “Back propagation neural network approach to intrusion
    detection”, International Conference on Recent Trends in Information Systems (2011)
    303–308, [`doi.org/10.1109/ReTIS.2011.614686`](https://doi.org/10.1109/ReTIS.2011.614686).

    7. F. Haddadi, S. Khanchi, M. Shetabi, V. Derhami, “Intrusion detection and attack
