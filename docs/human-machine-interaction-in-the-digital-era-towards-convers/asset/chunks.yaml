    迁移学习作为人工智能的一种形式，是用于训练目的以及训练完成后测试输入数据样本的主要工具。在开始阶段，神经网络的权重是以完全任意的方式从输入数据中得出的。在旨在准确表示整体的数据集上进行训练后，将使用相同数据集对神经网络进行测试。在分类过程中，使用数据加权来计算错误率和错误频率；对数据集进行重新加权可以修复初始加权引入的错误。


    ### 3.4 特征提取


    对数据集进行分段后，可以从数据提取大量特征，这使得肺癌检测过程变得简单得多。这种诊断使得切除由癌细胞增殖引起的肺肿瘤变得更容易。肿瘤是在癌细胞增殖时产生的。这种诊断使得手术切除癌细胞增殖引起的肺肿瘤成为可能。肿瘤由于癌细胞的繁殖而产生。


    使用蚁群优化（ACO）来执行这种特征提取方法，以获得预期的结果。为了分类数据，通常使用支持向量机（SVMs），这是标准程序。从输入数据中获取更重要且非冗余的主要属性的过程被称为特征提取，它是所使用的模式识别算法的组成部分。


    ### 3.5 分类模型


    一种名为 `BERT` 的分类模型（是 Transformer 双向编码器表示的缩写）经过了预训练，根据从对话双侧学习到的上下文来构建词表示。


    `BERT` 由一个包含 24 层、1024 个隐藏单元和 16 个注意力头的 Bertrange 网络组成，而一个具有 12 层的 Bertbase 网络只有
    768 个隐藏单元和 12 个注意力头。24 层的 Bertrange 网络被称为 Bertrange 网络。


    基础版本由六层编码器层、512 个隐藏单元前馈层和 8 个注意力头组成。基础变体的精细复杂程度远高于这两种变体中的任何一个。每个编码器内部都存在两个不同的抽象层。以下公式将用于计算自注意力层
    `Z` 的输出：


    (1)


    $$Z = softmax\left( \frac{QK^{T}}{\sqrt{d\_{k}}} \right)V$$


    模型中大量的注意力头数量使得模型能够转移其焦点并利用各种表示子空间，每个子空间都有它们自己的 `Z` 矩阵。这是由于模型包含了大量的注意力头而实现的。由于模型能够在不同的关注点之间切换（BASE
    为 12 个，LARGE 为 24 个），这变得可行。从注意力头发送的矩阵被组合成一个单一矩阵 `Z`。这是必要的，因为前馈层只接收单个 `Z` 矩阵。一个名为
    `W^O` 的权重矩阵应用于此 `Z` 矩阵并进行相乘。


    (2)


    `Z` = `L**a**y**e**r**N**o**r**m*(X + Z)`


    `BERT` 栈的第一个编码器从内部提供了栈结构的全面视图。`BERT` 训练的基础两个不同任务的相互依赖，每个任务都发挥着独特的作用。第一个任务被称为下一句预测（NSP），它需要输入两个句子。


    ## 4 结果与讨论


    数据集包含 32 个样本，具有 57 个特征，且所有预测参数的假设范围为 0–3。数据收集自 UCI 机器学习存储库。简化数据分析的过程——数据转换涉及将数据从名义属性和类别标签转换为二进制形式。在数据分析领域，被证明是最常用且最受接受的方法是将名义数据转换为二进制形式。


    数据分析需要非常谨慎地进行，因为数据集包含一些未说明的数字。从严重到中度到轻微的量表，标签的严重程度可以进行划分，其中严重代表最极端的情况。提供的信息在许多关键数据方面存在缺失。因此，在清理数据时，建议将任何缺失值替换为该列中出现频率最高的值。这是最频繁观察到的值。


    实施分析使用了多种不同的性能指标，所有指标均由混淆矩阵生成。分析的目标之一是确定执行情况的良好程度。你可以在这里看到我们在分析中使用的性能参数。训练和评估计算智能模型所需的总时间被称为执行延迟。


    分类器获取历史数据并将其转换为更适合分类的格式，以便数据可以使用。为了充分测试分类器的性能，总共使用了 10 种不同的交叉验证技术。这是一种强数据分析方法，可以使用比传统方法多
    10 倍的数据做出可靠的预测。与以前的情况相比，这是一个巨大的改进，以前只能通过传统方法实现。与过去相比，这是正确方向迈出的一大步。图 10.2 到 图 10.5
