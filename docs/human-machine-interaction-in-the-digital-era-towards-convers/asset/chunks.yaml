    $$~Contrast~ = \underset{i}{\sum^{}}\\underset{j}{\sum^{}}{(i - j)}^{2}gi,j$$


    Correlation value refers to the measure of image’s gray tone linear dependencies.
    The correlation feature can be estimated using equation (8).


    (8)


    $$~Correlation~ = \frac{\underset{i}{\sum^{}}\\underset{j}{\sum^{}}(ij)g\_{i,j}
    - ~mean~\_{g}}{SD\_{g}}$$


    Where `SD[g]` and `mean[g]` are the standard deviation and mean of `g`.


    Homogeneity is referred as the Inverse Difference Moment. It estimates the homogeneity
    of image as it considers higher values for lesser gray tone differences in element
    pair. This can be measured using equation (9).


    (9)


    $$~Homogeneity~ = \underset{i}{\sum^{}}\\underset{j}{\sum^{}}\\frac{1}{1 + {(i
    - j)}^{2}}g\_{i,j}}$$


    ### 3.3 Infection Region Features


    Shape features are physical dimensional measures that characterize the appearance
    of the lesions. The shape features extracted from the infected regions are centroid,
    area, perimeter, eccentricity, and orientation. Centroid is the region’s center
    of mass, returned as a 1-by-Q vector, where Q denotes the dimensionality of the
    image. Area is the actual number of pixels in the region, returned as a scalar
    value. Perimeter is the boundary distance of the region returned as a scalar value.
    Eccentricity defined as the ratio of the distance between the lesions’ foci and
    the length of the main axis. Orientation is the angle swept by the x-axis from
    the main axis of the ellipse which has the second-moments same as the region,
    returned as a scalar.


    ## 4. Proposed ASO-GRU-NN Classification Model


    #### 4.1 ASO Optimizer


    ASO is a novel physics-inspired computational metaheuristic optimization approach.
    ASO was formulated by the inspiration of basic molecular dynamics. This algorithm
    was formulated for addressing global optimization problems [19]. ASO optimizer
    is employed in this work to optimize the weights of the GRU-NN model during the
    training phase. In ASO, the location of the atoms in the search space represent
    a solution set (neural network weights) measured by means of their masses, with
    a solution that is better in terms of heavier masses, and vice versa. In order
    to solve this unconstrained optimization, an atom population with N atoms is considered.
    The atom population assumed for this application is the `N` input data from the
    `N` neurons in input layer. The location of the `i`^th atom can be expressed as
    given in equation (10)


    (10)


    `x[i]`  = [`x[i]¹,*x[i]²,…,*x[i]^(D)]`,  `i`  = 1,  2, …,  `N`


    where `x[i]^d` (`d` = 1, 2, …, `D`) represents the `d`^th position component of
    the `i`^th atom in a `D`-dimensional search space. Each population is evaluated
    for fitness. The objective function used in this optimization for fitness evaluation
    is the Mean Square Error (MSE) function. The minimum MSE value of the population
    is the best fit value `F[best]` and is expressed as given in equation (11),


    (11)


    `F[best]`  = min `F`  = min `MSE`


    On the other hand, the worst fit value `F[worst]` can be expressed as given in
    equation (12),


    (12)


    `F[worst]`  = max `F`  = max `MSE`


    Where, $MSE = \frac{1}{n}\underset{n}{\overset{i = 1}{\sum^{}}}\left( {Y_{pred}
    - Y_{actual}} \right)^{2}$,`Y_{pred}` is the predicted class, `Y[actual]` is the
    actual class, and `n` is the total count of data samples. The weight matrix (atom
    population set) `x[best]` for which `F[best]` is obtained is the optimal solution
    of weights for the neural network. The mass of the `i`^th atom which can be assessed
    at the simplest stage is calculated with the help of the following equation (13)
    that involve fitness values.


    (13)


    $$M_{i}(t) = \frac{m_{i}(t)}{\underset{N}{\overset{j = 1}{\sum^{}}}m_{j}(t)}$$


    Where, $m_{i}(t) = e^{\frac{F_{i}(t) - F_{bert}(t)}{F_{bert}(t)}}$,`F_{i}(t)`
    is the fitness of the `i`^th atom. In the exploration phase, the `i`^th atom interacts
    with many atoms. For the exploitation phase, the `i`^th atom interacts with a
    few atoms. This `k` decreases as `t` increases.


    (14)


    $$k(t) = \underset{N}{\overset{j = 1}{\sum^{}}}$$


    Where, `t` is the iteration and `T` is the maximum iteration. The force of the
    `i`^th atom from the rest of atoms is shown in equation (15).


    (15)


    $$F_{i}^{d}(t) = \underset{j \in k}{\sum^{}}rand_{j}^{d}(t)$$


    Here, `rand[j]` is a random number generated within `[0,1]`. The geometric constraint
    of the `i`^th atom from the best fit atom is expressed in equation (17).


    (17)


    `G[i]^d(t)`  = `λ(t)(x[best]^d(t)-x[i]^d(t))`


    Where `x[i]^d(t)` denotes the position of the `i`^th atom in `t`^th iteration
    and `x^d[best]` denotes the position of the best atom in `t`^th iteration, and
    `λ` represents the Lagrangian multiplier.


    The atom’s acceleration is then estimated using the interaction force and the
    geometric constraint as shown in equation (18).


    (18)


    $$a_{i}^{d}(t) = \frac{F_{i}^{d}(t)}{M_{i}^{d}(t)} + \frac{G_{i}^{d}(t)}{M_{i}^{d}(t)}$$


    The velocity and the position of the atoms are updated for the next iteration
    (t + 1) using the equations (19 and 20).


    (19)


    `v[i]^d(t+1) = rand[i]^d(t)*v[i]^d(t) + a[i]^d(t)`


    (20)


    `x[i]^d(t+1) = x[i]^d(t) + v[i]^d(t+1)`


    #### 4.2 GRU-NN Model of COVID-19 Severity Classification


    The final best solution is given as the weights *W* to the GRU-NN classifier model.

