- raw: 'With the use of a GPS module, GSM module, and accelerometer, which are connected
    to an Arduino Uno, which serves as the controller, a system is created that can
    alert the concerned parties about an accident via SMS services.


    #### Efficient accident detection and notification system


    The Arduino board which is installed in the vehicle has GSM and GPS. The Android
    app present is the software component. In the proposed system, the gsm module
    is triggered only after the victim’s fingerprint is scanned.


    #### An approach to making way for intelligent ambulance Using IoT


    With the idea of a “black box” in a vehicle, it is possible to use GPS and GSM
    technologies to find out what transpired. Controlling the traffic signals will
    enable the ambulance department to quickly admit the sufferer to the hospital.


    #### Person''s identity verification using Arduino UNO


    In most cases, fingerprint scanning involves comparing several aspects of the
    print pattern, which is necessary when analyzing fingerprints for matching purposes.
    These consist of tiny points, individual qualities contained within the patterns
    as an aggregate property of ridges.


    #### Feasibility study on applications of GSM–SMS technology


    GSM-SMS technology is used to control, communicate, and transmit data across two
    systems. A GSM-SMS-based communication architecture provides a package format
    of short messages which is appropriate for keeping track of a wide range of applications.


    ## 3\. System Design and Implementation


    By using a fingerprint sensor to access the data and a GSM module to automatically
    send an SMS message to the victim’s guardian and police control room, we have
    built an automated identification and notification system for the needy. This
    approach is primarily intended to speed up the process of finding the fundamental
    information on an accident victim who is found inside an emergency vehicle. Checking
    for adequate network connectivity and a reliable power supply might serve as the
    first step in starting this procedure. The victim’s name, emergency contact number
    information, and address will be shown on the LCD screen by just scanning the
    victim’s fingerprint in the device, using the R307 fingerprint sensor. An SMS
    message is then sent immediately to the designated emergency contact using the
    necessary information. In order to report a road accident, the system is set up
    in such a manner that an E-Service SMS complaint will automatically be triggered
    and transmitted to the police control center. This method is done using a GSM
    module SIM900A, which has an inbuilt SIM, to contact the patient’s relatives and
    the police control room, it offers a wireless data connection to a network using
    GSM mobile telephone technology. The biggest benefit of employing this system
    is how easy it is to install in all ambulances. There is no waiting period before
    treating unidentified accident victims. Mechanisms for exchanging information
    are a lot more quicker and automated.


    ## 4\. Block Diagram


    From [Fig. 6.1](#ch6.xhtml#fig6_1) the microcontroller used in this device is
    an Arduino Uno (ATmega328P). The device is supplied with a +5v of DC power supply.
    The corner of the Arduino microcontroller has a power supply port. Flash memory,
    EEPROM, and SRAM are the onboard memories that are available here. The Arduino
    IDE software can be utilized to execute the required program for our system. Following
    that, this program can be uploaded through the power jack cable to the Arduino
    microcontroller. The Arduino uno acts as an interface between the fingerprint
    sensor (R307) and the GSM module (SIM900A) as it stores the captured fingerprints
    and the data of the group of people, which is required to match when the fingerprint
    is scanned. The victim’s fingerprint is scanned using the fingerprint sensor R307
    to obtain his basic information, which is then utilized to notify the victim’s
    guardian and the police control center. This fingerprint sensor module connects
    directly to microcontrollers through a TTL UART channel. If the fingerprint of
    the victim matches the existing data, the Arduino Uno is programmed in such a
    way that the victim’s name and emergency contact number are displayed on the 2x16
    LCD display.


    ![Fig. 6.1 Block diagram of detection and notification system for unidentified
    accident victims](images/fig6_1_C.jpg)


    [Fig. 6.1 Block diagram of detection and notification system for unidentified
    accident victims](#ch6.xhtml#R_fig6_1)


    After the data has been shown on the LCD screen for a short while, the GSM module,
    which has an integrated SIM, uses the data to send an SMS notice to the victim’s
    legal representative and the police control room. The subscriber identification
    module (SIM) is inserted into the GSM network to give personal mobility through
    the worldwide system for mobile telecommunications (GSM). The nodemcu (ESP8266)
    is an open-source IOT platform that connects items and enables Wi-Fi protocol
    data transfer, Arduino. The push button here is utilized to perform device enrollment,
    deletion, and transmission of up and down commands.


    ## 5\. Result and Discussions


    The scanning of a fingerprint is displayed alongside the final output image.


    ![Fig. 6.2 Positioning of the finger in the fingerprint sensor present in the
    hardware kit](images/fig6_2_C.jpg)


    Fig. 6.2 Positioning of the finger in the fingerprint sensor present in the hardware
    kit


    ![Fig. 6.3 SMS notification sent via GSM module](images/fig6_3_C.jpg)


    Fig. 6.3 SMS notification sent via GSM module


    ## 6\. Conclusion and Future Scopes


    The “Detection and Notification System for Unidentified Accident Victims” prototype
    has been constructed. By scanning the victim’s fingerprints, this prototype potentially
    recognizes an unidentified accident victim and contacts the victim’s guardian,
    and the police control center. In this complete system, the utilization of a fingerprint
    sensor and GSM mobile technology is fundamental. By placing this equipment in
    the emergency vehicle, the proposal is thus advanced to shorten the response time
    for an unidentified accident.


    In addition to the current system, a few more records can be added by continuously
    monitoring the patient’s vitals using the sensors connected to the victim’s body,
    such as heart rate, blood pressure, and pulse. Then the records will be delivered
    to the hospital through a live web server after the vital data has been acquired,
    allowing for a quicker start to the treatment planning process.


