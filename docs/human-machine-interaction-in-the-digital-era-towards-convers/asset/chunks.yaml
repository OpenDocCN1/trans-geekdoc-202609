    it provides a comprehensive analysis of the preprocessing methods and picture
    segmentation algorithms employed by various researchers. Information from the
    survey was also cited in pieces discussing a variety of brain disorders and tumours.
    Algorithms for segmenting data, classifying it, and clustering it have all found
    applications in the field of medicine. Super pixelbased brain tumours segmentation
    using `RF` and `SVM` classifiers was evaluated and found to favour `RF` in terms
    of accuracy. Combining `C-MRI` with `DTI`, as reported in `[[1](#ch5.xhtml#ref5_1)]`,
    and feeding the data to support vector machines (`SVM`) allowed researchers to
    identify distinct types of tumour tissue `[[2](#ch5.xhtml#ref5_2)]`. An advantage
    of the super pixel based method, as suggested by `[[3](#ch5.xhtml#ref5_3)]`, is
    that it greatly reduces the amount of computing needed for classification in the
    new feature space.


