    # 1 A Performance of Comparative Study on Hate Speech Detection using Deep Learning
    Algorithms


    S. Sankari^([¹](#fn1))


    Research Scholar, Bharath Institute of Higher Education and Research, Chennai


    S. Priscila^([²](#fn2))


    Associate Professor, Bharath Institute of Higher Education and Research, Chennai


    DOI: [10.1201/9781003428466-1](https://dx.doi.org/10.1201/9781003428466-1)


    **Abstract** Social media has recently grown to be one of the leading entertainment
    areas. The increased use of social media platforms by people all over the world
    has given rise to several fascinating NLP challenges. One of the major problems
    with NLP is detecting taboos in streaming platform chats and comments. In past
    works, taboos were identified on different datasets using a range of deep learning
    algorithms and feature engineering techniques to address this growing problem.
    Although many research have already been conducted to detect hate material, most
    of these have been conducted in a single context, no study has been done to compare
    the comparison to machine learning or deep learning models perform the best on
    common public data. A publicly released dataset with three different classes will
    be used in this study to compare the performance of two feature engineering techniques
    and seven deep learning algorithms. The testing findings showed the high accuracy
    and less time complexity.


    **Keywords** Hate speech detection, Deep learning, Feature selection, LSTM, Social
    media


    ## 1\. Introduction


    A social media website is an online community where people may communicate and
    create profiles. Over the past ten years, social media has grown tremendously
    in both scope and significance as a communication tool. The main focus of a social
    network will be user-generated content. Users mostly engage with and view content
    created by other users. They are urged to publish text, status updates, or images
    for public access. Due to the open nature of social media, anyone may post whatever
    they want, espousing any point of view, whether it be enlightening or repulsive
    or anywhere in between.'
