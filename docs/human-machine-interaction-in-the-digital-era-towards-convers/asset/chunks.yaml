    \n| --- | --- |\n\n| AlexNet || 5 min 53 s |\n\n| --- | --- |\n\n| ResNet50 ||\
    \ 13 min 3 s |\n\n| VGG19 || 14 min |\n\n| MobileNetV2 || 3 min 51 s |"
