    # 13 Detection of People or Animals Using Deep-learning in Railway Tracks


    V. Dinesh^([^(26)](#fn26))


    Assistant Professor, Easwari Engineering College (Anna University) Chennai India


    G. Mahalaxmi^([^(27)](#fn27))


    Student, Easwari Engineering College (Anna University) Chennai India


    DOI: [10.1201/9781003428466-13](https://dx.doi.org/10.1201/9781003428466-13)


    **Abstract** The Indian Railways one of the world’s largest rail networks, stretches
    more than 1, 15, 000 kilometers across the entirety of the country. Deep neural
    networks, as well as other machine learning techniques, have received a lot of
    interest recently when applied to railroad transportation data in order to detect
    the animals or people in the railway tracks, Convolution Neural Networks (CNN)
    is used. They provide a lot of advantages over other techniques, resulting in
    the season they are most frequently utilized in pattern and image identification
    tasks. This paper employs Keras python library as the backend as well as Tensor
    flow, which able to precisely forecast the classification report. For classifier
    images, the convolutional neural network technique is used. Given that this classifier
    is a deep learning model, the accuracy will increase as you train it. As an object
    is detected in the railway tracks, the buzzer will go off near the loco pilot.
    This system will aid in preventing accidents caused by creatures on rail tracks.


    **Keywords** Keras, CNN, Buzzer, Tensorflow'
