    # 数字时代的人机交互


    ### 5.1 准确率


    根据训练和验证的准确率值，对模型的分类性能进行了评估。图 16.4(a)显示了各种 CNN 模型的准确率结果。其中，`MobileNetV2` 在训练和验证方面均达到了最高准确率，分别为
    95% 和 90%。`VGG19` 的准确率次之，训练准确率为 88%，验证准确率为 81%。`ResNet50`、`AlexNet` 和 `DenseNet121`
    的准确率值较低。


    ### 5.2 损失值


    损失值衡量了模型在每次迭代后的性能，损失越低通常表示性能越好，过拟合除除外。图 16.4(b)显示了不同模型在训练和测试期间的损失率。随着训练次数（epochs）的增加，损失率通常会下降。`MobileNetv2`
    的训练和验证损失率最低，分别为 0.528% 和 0.7928%。`VGG19` 的损失率次之低。`AlexNet`、`ResNet50` 和 `DenseNet121`
    的损失率较高。


    ### 5.3 编译时间


    模型的有效性取决于其准确率和完成时间。表 16.1 显示了以分钟和秒为单位的编译时间。`DenseNet121` 的完成时间最长，为 31 分 86 秒，而
    `MobileNetv2` 的时间较短，为 3 分 51 秒。`MobileNetV2` 具有最佳预测结果，拥有最高的准确率最短的编译时间。


    ## 6 结论


    研究表明，可以使用无破坏性方法判断西瓜是未成熟、成熟还是过熟。本研究比较了不同的基于 CNN 的模型对西瓜成熟度分类的效果。评估的模型包括 `AlexNet`、`ResNet50`、`VGG19`、`MobileNetV2`
    和 `DenseNet 121`。模型中使用了一个由 300 张西瓜图像组成的数据。通过比较三个性能指标（准确率、损失值和分类时间）进行了性能分析。总体而言，`MobileNetV2`
    在西瓜成熟度分类中表现出最佳性能，准确率为 95.97%，损失率最低，编译时间最短。


