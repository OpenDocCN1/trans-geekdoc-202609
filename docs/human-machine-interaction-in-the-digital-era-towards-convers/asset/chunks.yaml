    ## 3. Proposed Framework of Severity


    The proposed framework focuses on the detection and classification of COVID-19
    severity. The feature extraction plays a crucial role in the data. The features
    extracted are statistical features, `GLCM` features, and shape features.


    ### 3.1 Statistical Features


    The statistical features extracted in this study are mean, median, standard deviation,
    and variance. The mean can be defined as the average of all pixels in the image,
    using the following equation:


    ```math

    Mean = \frac{\sum_{i=1}^N_{j=1}^N P_{i,j}}{N}

    ```


    Median represents the mid pixel of the image matrix, which is estimated using
    the equation:


    ```math

    Median = \frac{\left( P_{\frac{N}{2},\frac{N}{2}} \right) + \left( P_{\frac{N
    + 1}{2},\frac{N + 1}{2}} \right)}{2}

    ```


    Standard deviation can be defined as the dispersion measure of observation in
    the dataset relative to the mean value. This can be expressed as:


    ```math

    SD = \sqrt{\frac{\sum_{i=1}^N_{j=1}^N (P_{i,j} - Mean)^{2}}{N}}

    ```


    Variance can be defined as the numerical value that describes the variability
    of observations from the mean value.


    ```math

    Variance = SD^2

    ```


