    # 4 ASO-GRU-NN: Atom Search Optimized Gated Recurrent Units based Neural Network
    for the Severity Classification of COVID-19 Using Different Feature Extraction
    Methods


    J. Kalaivani^([⁸](#fn8))


    Research Scholar, Tamil Nadu, Vels Institute of Science, Technology and Advanced
    Studies (VISTAS)


    A. S. Arunachalam^()


    Associate Professor, Tamil Nadu, Vels Institute of Science, Technology and Advanced
    Studies (VISTAS)


    DOI: [10.1201/9781003428466-4](https://dx.doi.org/10.1201/9781003428466-4)


    **Abstract** The recent pandemic COVID-19 had invaded all the countries without
    any exceptions. The main reason of the virus to become pandemic is its intensity
    is infection contagiousness. Hence, rapid diagnosis is to be carried out to prevent
    the infection from spreading. As a rapid diagnosis framework, this research proposes
    an Artificial Intelligence (AI) based framework for identifying the presence and
    the severity of COVID-19 with the help of chest CT slices of the subject. This
    paper proposes a new AI severity classifier called Atom Search Optimized Gated
    Recurrent Units based Neural Network (ASO-GRU-NN), which is a GRU model with recurrent
    weights optimized by ASO algorithm. This model is trained for severity classification
    using different feature extraction techniques on the infection segmented images.
    The feature extraction phase aims to estimate the statistical features, gray-level
    co-occurrence matrix (GLCM) features, and region features of the identified infected
    areas in the lungs. The feature vectors are given as one feature group and as
    combinations of three to assess the performance of the ASO-GRU-NN model for the
    identification and the severity classification of COVID-19. The performance of
    the classification model trained with different features are analyzed and compared
    with existing models with the help of various performance measures such as accuracy,
    error rate, sensitivity, specificity, and execution time.


    **Keywords** COVID-19, Feature extraction, Gated recurrent unit, Gray-level co-occurrence
    matrix, Severity classification


    ## 1\. Introduction'
  fmt: '

    This study by Muhammad Hameed Siddiqi, Khurshed Asghar, Umar Draz, Amjad Ali,
    Madallah Alruwaili, Yousef Alhwaiti, Saad Alanazi, M. presented a novel approach
    for the detection of fraudulent images using Discrete Wavelet Transform, image
    splicing, and robust discriminative local binary patterns. Retha Hasoon Khayeat,
    Ahmed Abdulhadi Moadhen and Mustafa Ridha Hassoon used the semantic segmentation
    of decomposed image.


    Yuan Rao; Jiangqun Ni proposed a method that extracts dense features from the
    test pictures using the pre-trained `CNN` as a patch descriptor. The final discriminative
    features for `SVM` classification are obtained by investigating feature fusion
    techniques. Souradip Nath & Ruch Naskar proposed a blind splicing detection method
    that uses a fully connected network to distinguish between authentic and spliced
    images as its backbone and a deep convolutional network architecture as its front
    end. In this review various image splicing techniques were studied and summarised.
    The differences in the image properties or camera characteristics are the primary
    source in identifying the forged sections because the spliced images are created
    from distinct images. We further categorize the pixel-based and statistically
    based methods into noise inconsistencies, illumination estimation, statistical
    aspects, and other feature-based approaches. Notwithstanding its shortcomings,
    the research topic of image forensics holds great promise for enhancing forgery
    detection thanks to competition between forgery producers and detectors.


