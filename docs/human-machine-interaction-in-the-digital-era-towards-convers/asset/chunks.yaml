    ## 4\. Conclusion


    The railroad is the most practical and easy form of transportation. But several
    accidents are happening as a result of carelessness. This paper, therefore, introduces
    the proposed method, which makes use of the image processing approach, to prevent
    such accidents. The photos are stored in the database after being captured. After
    capturing, the comparing process started, and the image was found. When a creature
    or object was found, there was a recapturing process that required further detection
    and verification that the creature or object was still on the track. The loco-pilot
    can use this information to halt the train and prevent incidents that endanger
    the critter on the track. When a creature is found, it makes a buzzing sound.


