    | 3 | 体力活动与 `BMI` 之间存在显著相关（`p value<0.05`），即超重和肥胖流行率较高。 |

    | 4 | 在家族史中，非传染性疾病（NCD）病史、家族肥胖和家族糖尿病（DM）与 `BMI` 相关，因为其 `p values` 在 1% 水平下小于 0.01。同样，家族心血管疾病（CVD）和家族血压（BP）的
    `p values` 小于 0.05，在 5% 水平上显著。 |

    | 5 | 在食物频率中，胆固醇、甜食和巧力的 `p value` 小于 0.01，在 1% 水平上极显著。 |


