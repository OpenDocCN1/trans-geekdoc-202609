    # 18 Study of Factors associated with Diets and Prevalence of Overweight and Obesity
    among Adolescent Girls


    A. Maria Vinitha Research Scholar, Presidency College, Triplicane, Chennai, Tamil
    Nadu


    T. Pramananda Perumal Principal (Retired), Presidency College, Triplicane, Chennai,
    Tamil Nadu


    DOI: [10.1201/978100342866-18](https://dx.doi.org/10.1201/978100342866-18)


    ## Abstract

    Overweight and Obesity among adolescent girls have become a growing health concern
    in urban cities of India. For the past few decades, the adolescent population
    of urban cities is more inclined to consume more western foods than opting for
    territorial cuisines. The adolescent girls of India in terms of acquiring fashion
    have got special tendency towards modern culture and fashions have emerged among
    humans based on geographical location and climate of their living. The influence
    of exposure to western food habits and processed foods have not been elaborately
    investigated yet. Moreover, the actual food items and eating lifestyle for the
    development of overweight and obesity are to be carefully analysed because we
    mix both foreign and local. The aim of this investigation is to determine the
    authentic causes, especially of food items and eating habits for overweight and
    obesity among adolescent girls of school and collegeers in Chennai. Being in India,
    many places are in nutritional transformation, in which overweight and obesity
    have become common. Nutritional evaluation needs to be done in the age of adolescence
    as it is the transitory period between childhood and adulthood. Thus concentrating
    on the adolescent age group will help to prevent the occurrence of disease and
    to improve the healthy lifestyle for future.


    Keywords: Adolescent girls, Diet type, Food types, Non-communicable diseases,
    Overweight, Obesity, Physical activity, Risk factors


    ## 1. Introduction

    Nearly 39% of the adult population globally have been grouped into overweight
    with a Body Mass Index (`BMI`) of `25.0–29.9 kg per m²` or obese with `BMI` more
    than `29.9 kg per m²` in 2014 and it has been increasing by two folds from 1975.
    While the obesity incidence are `6.4%` and `3.2%` among men and women respectively
    during 1975, it has risen to `14.9%` and `10.8%` correspondingly ([Di Cesare M.
    et al., 2016](#ch18.xhtml#ref18_1)). The growing incidence of overweight and obesity,
    especially in developing nations like India, have been correlated significantly
    ([Tandon N. et al., 2018](#ch18.xhtml#ref18_2)), ([Dandona L. et al., 2017](#ch18.xhtml#ref18_3)),
    ([Prabhakaran D. et al., 2018](#ch18.xhtml#ref18_4)). The incidence of overweight
    and obesity has been rising rapidly from `8.4%` in 1998 to `15.5%` in 2015 among
    females. The incidence of obesity has grown from `2.2%` to `5.1%` during the above
    period for the same female population ([Mumbai IIPS, 2017](#ch18.xhtml#ref18_5)).
    Almost 80% of adolescent individuals would continue to be obese and it is a serious
    threat factor in the development of Non-Communicable Diseases (`NCDs`), namely
    Cardio-Vascular Disease (`CVD`), Non-Insulin-Dependent Diabetes Mellitus (`NID-DM`)
    and Cancer. In many countries, Obesity is found to be causative of different psychological
    issues among adolescents, primarily due to unhealthy dietary and physical inactivity
    ([Catherine M. Levy, 2017](#ch18.xhtml#ref18_6)). Besides the physical impacts
    of flab, overweight and obesity, adolescents have commonly been developed with
    psychological problems in addition (Ebbeling CB, Pawlak DB, and Ludwig DS. 2002).


    The investigation has been performed to find and evaluate the risk factors that
    cause the incidence of overweight and obesity among adolescent girls and assist
    in planning the strategies that are needed to strengthen adolescent well-being
    and health. The purpose of this study is to identify the key factors and its relevant
    variables from numerous risk indicators influencing obesity among adolescent girls
    based on the hidden factors in anthropometric profile, dietary pattern, food frequencies
    and physical activity. Further the study includes `Chi-Square test`, to find the
    statistical significance among `BMI` and risk factors.


    ## 2. Details of the Study


    ### 2.1 Study Sites and Participants

    The data for this study is randomly collected from the girls belonging to ages
    of 16 and 19 years from seven different schools and five different colleges, located
    in Chennai, an urban area in Tamil Nadu, India for the period from January through
    March 2019 as a diverse background. The survey has been performed based on the
    consent, obtained from the parents of the participants as well as from the participants
    before data collection.


    ### 2.2 Sample Size Estimation

    This study has planned with a sample size of more than 1537 (but in our study,
    we have taken the sample size as 2000) in order to have a confidence level of
    95% and a margin of error within ±2% by setting population proportion 0.2. The
    sample size has been estimated by applying the formula:

    ```

    N = \frac{z^{2}\hat{p}(1 - \hat{p})}{\epsilon^{2}}

    ```


    ### 2.3 Data Collection

    Using a standard questionnaire, data with respect to social, demographic, physiological,
    anthropometry details have been recorded. Self and other family members like parents,
    siblings and grand parents’ health details about NCDs namely `CVD`, Hypertension,
    `DM`, Osteoporosis and Cancer were too collected. By applying the `WHO` (World
    Health Organization) standards. Adult `BMI` is calculated using the formula:

    ```

    BMI = Weight (Kg)/Height² (m²)

    ```

    The adult `BMI` cutoff values of less than `18.50` are considered `Underweight`,
    if between `18.50` and `24.9` `Normal`, if between `25` and `29` `Overweight`
    and if more than `30` as `Obese` ([WHO, 2016](#ch18.xhtml#ref18_8)).

