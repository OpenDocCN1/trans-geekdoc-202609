    # 5 基于图像处理的深度学习脑肿瘤检测


    Asma Parveen A^(⁹)


    研究员，计算机科学系，Vels 科学、技术与高级研究学院，钦奈杜，印度


    Kamalakannan T^(¹⁰)


    计算机科学主任，Vels 科学、技术与高级研究学院，钦奈杜，印度


    DOI: [10.1201/9781003428466-5](https://dx.doi.org/10.1201/9781003428466-5)


    **摘要** 为了改进人类对视觉信息的理解，并处理用于传输、存储和检索意义信息的图像数据，图像处理这一引人入胜且富有启发性的学科运而生。来自摄像头和传感器的原始数据可以使用“图像处理”方法进行处理。为了进行图像分析，必须对图像进行分析并将其分为有意义片段，这一过程被称为图像分割。通过医学图像分割可以研究人体的解剖和生理结构。利用尖端技术创建人类大脑的多幅分辨率照片，允许研究人员跟踪其发育并发现多种疾病。脑癌是儿童和青少年最常见的恶性疾病。本研究将帮助公众判断脑部磁共振成像（MRI）中是否存在脑肿瘤。其他研究人员的努力为本研究提供了灵感。


    **关键词** 数据、肿瘤、处理、MRI、图像分割


    ## 1. 引言


    医学领域的许多科学家正在使用前沿方法进行疾病预测。这些方法一直以来帮助医疗专业人员进行诊断和治疗。早期发现或预测脑肿瘤可以挽救生命。然而，各年龄段都是受害者。因此，研究人员致力于寻找方法，在脑肿瘤最可能发生的区域根据早期症状进行检测和预测，并使用
    MRI 扫描确定特定的肿瘤类型。作为医学领域需求最大的领域之一，本工作研究了图像分割技术的使用。


    ## 2. 文献综述


    创新的图像处理涉及将图像数字化并运行一系列数学运算，以改进图像或从中提取相关数据。图像处理（IP）主要分为两类：第一类处理用于人类查看的图像外观增强，第二类测量图像内部的各个方面和结构。根据身体部位、诊断任务、视觉偏好等，可以通过分割或修改其内部结构的外观为应用程序定制数字图像。放射科医生将从计算机图像分析中获益，因为它允许他们快速准确地定位图像中的可疑区域并提供准确的诊断。


    在本节中，我们将讨论在图像处理技术、分类算法和脑肿瘤诊断方面的研究。此外，它对各种研究人员采用的处理方法和图像分割算法进行了全面分析。综述中的信息也被引用在讨论各种脑疾病和肿瘤的文章中。数据分割、分类和聚类算法均已应用于医学领域。对使用
    `RF` 和 `SVM` 分类器进行超像素脑肿瘤分割进行了评估，结果发现在准确性方面 `RF` 优于后者。正如 `[1]` 所示，将 `C-MRI` 与 `DTI`
    结合并将数据输入支持向量机（SVM），使研究人员能够识别不同类型的肿瘤组织 `[2]`。正如 `[3]` 建议，超像素方法的优势是极大地减少了在新特征空间中分类所需的计算量。


    ## 3. 提出的方法


