    # Abstract

    Technology has advanced significantly in today’s modern era. It is open to everyone,
    including students. Students now have easier access to the technological world
    through the internet. Students are becoming more interested in social media. Long-term
    use of social media can lead to apathy toward studies. When students are distracted
    by social media and other factors that they often overlook, it can have a negative
    impact on their academic performance. The aim of this study is to identify the
    major factors that contribute to distractions to students’ studies and also identify
    the social media usage among students for lowering their grades. The responses
    of the `465` students who participated from various colleges reveal that social
    networking sites are very popular, and the majority of the responses prove that
    they are distracting from studies due to excessive internet usage.


    # Keywords

    Social Media, Educational Data Mining, Internet, Student Performance, Mobile Phone
    Activity, Students Distraction


    ## 1. Introduction

    Students are more enticed than ever before to engage in media multitasking with
    the emergence of personal digital gadgets. However, it is unclear whether all
    digital devices interfere with student learning. [[1](#ch2.xhtml#ref2_1)] With
    the advancement of the Internet and digital technologies, society is becoming
    increasingly connected.


    Personal page of the user can be set to semi-public or protected, depending on
    the user’s preferences. `Instagram`, `Facebook`, `YouTube`, and `TikTok` are some
    of the most popular sites.


    Teachers at most colleges are constantly competing for attention in the classroom
    with cell phones and other technologically - advanced gadgets. While the teacher
    is instructing, students text, surf the web, and post on social media. As a result,
    they are only half-present in the classroom for the majority of the time, which
    automatically leads to academic distraction.


