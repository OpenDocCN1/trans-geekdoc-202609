    # 7 E-Learning Technologies with Interactive Factors and Elements on Perspective
    of Management


    ## Abstract

    E-Learning is used to connect students and teachers in virtual manner. Teaching
    can be done with interactive manner and mass range of students can be reached
    with this technique. E-learning through `Email`, `Internet`, `World_Web` (`WWW`),
    multimedia become more popular as result technologies developing and delivering
    higher education. Questions like how college instructors use technology in instruction.
    After the pandemic situation E-Learning applications become very familiar to the
    students and the teachers. It makes the user to make the communication easier
    and handle class in easy manner. Major features of E-Learning are a virtual classroom,
    adaptable designs and website layouts with learners in mind, Reminders, compliments,
    and additional pertinent alerts a variety of educational resources, including
    images, podcasts, etc. principles for holistic learning, online content that can
    be downloaded for future reviewing and different quiz formats. In this research
    paper, different types of E-Learning applications are compared to know.


    **Keyword:** Digital, E-Learning and virtual classroom.


