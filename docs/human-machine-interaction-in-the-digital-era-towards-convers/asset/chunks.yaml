    # 摘要

    技术在当今时代取得了显著进步。它对所有人（包括学生）开放。学生现在可以通过互联网更容易地接触技术世界。学生对社交媒体变得越来越感兴趣。长期使用社交媒体可能会导致对学习的冷漠。当学生被社交媒体和其他他们经常忽略的因素分散注意力时，会对他们的学术表现产生负面影响。本研究旨在识别导致学生学习分心的主要因素，并识别学生中导致成绩下降的社交媒体使用情况。来自不同学院的
    `465` 名参与学生的回答显示，社交网络网站非常受欢迎，大多数回答表明，由于过度使用互联网导致了他们学习上的分心。


    # 关键词

    社交媒体、教育数据挖掘、互联网、学生表现、手机活动、学生分心


    ## 1. 引言

    随着个人数字设备的出现，学生比以往任何时候都更容易受到多媒体任务处理的吸引。然而，目前尚不清楚所有数字设备都会干扰学生的学习。[1] 随着互联网和数字技术的发展，社会变得日益紧密。


    用户的个人页面可以根据用户的偏好设置为半公开或受保护。`Instagram`、`Facebook`、`YouTube` 和 `TikTok` 是一些最受欢迎的网站。


    大多数大学的教师在教室里不断通过手机和其他先进技术设备争夺注意力。当老师在授课时，学生在发短信、浏览网页并在社交媒体上发布内容。结果是他们在大多数时间里在教室里只有一半的注意力，这自动导致了学术上的分心。


    ## 2. 文献综述


    ### 2.1 讲座期间的学生分心

    Abraham E., Scott (2020) 对 `100` 名参与者进行了调查，以找出学生在使用笔记本电脑听课时是否会分心。参与者被要求观看一个 `15`
    分钟的研讨会，期间他们进行了各种测试，通过分析讲座期间发送的短信来分析分心情况。他们发现完成笔记是减少分心的更好方法 [2]。


    ### 2.2 两所大学大学生的分心

    Leida, Ravi, Zhenya (2019) 对两所大学的学生进行了调查。他们创建了一个量表，通过评分分析了大学生的分心情况及其强度。共有 `425`
    名学生参与了这项研究。他们发现由于手机的使用，学生具有急躁躁的性格 [3]。


    ### 2.3 学生分心

    McKinley Green (2019) 对 `143` 名学生的回答进行了研究，并采访了 `10` 名学生。在他的研究中，他使用了九项活动，通过寻找许多学生进行的活动来发现学生的分心点。该研究揭示了许多分心活动以及学生因使用技术产生的态度趋势
    [4]。


    Fayyaz Ahmad Faize, Muhammad Nawaz, 2020 作者使用了 `196` 名学生的数据来寻找他们在 `COVID-19` 流行期间对在线课程的态度。在该研究中发现了学生的满意度、学习挑战、建议以及改进的修改方案。


    （注：提供的后续文本存在大量重复，已根据提供的独特内容进行处理。）

