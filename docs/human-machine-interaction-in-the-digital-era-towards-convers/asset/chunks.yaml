- raw: 'To better understand the instantaneous drift and distribution of marine trash
    and to enhance the management of marine waste, [Sun et al. (2020](#ch14.xhtml#ref14_18))
    perform a numerical analysis on the marine debris drifting in the western Bohai
    sea. The impact of important variables on the drift trajectory and range, including
    wind velocity and direction, and trash source, has been thoroughly investigated
    and debated. The program for treating marine trash is also examined. It has been
    discovered that the topographical characteristics of the area where the ocean
    trash oirgin is located have an impact on the particle’s diffusion as well as
    its eventual route of drift. The collection of marine debris will be triggered
    by an increase in wind speed, and the drift distance and diffusion zone of the
    particles will be periodically impacted by changes in wind direction.


    In this study by [Kylili et al., (2020](#ch14.xhtml#ref14_19)) an image classifier
    was built using an artificial intelligence application using a CNN design and
    the bottleneck approach. The trained bottleneck approach classifier was used to
    divide plastic packs, containers, baskets, food wrappers, straws, abandoned netting,
    fishes, and other objects into eight distinct groups. These plastics were found
    either at the coastline or floating at the surface of the ocean. With a 90% rate
    of success in effectively differentiating objects, the recommended deep learning
    technique is a move to the intelligent detection of plastic products at the seashore
    and in the ocean. The results of training and testing for losses and accuracy
    for different epochs and batches have given the proposed method more confidence.
    Results from such a resolution sensitivity examination showed that even with reduced
    image quality, the prediction system can still successfully identify plastics.


    The process of visually identifying trash in indigenous underwater ecosystems
    has been carried out by [Bajaj R et al. (2021)](#ch14.xhtml#ref14_20) using a
    deep learning based method in order to deploy autonomous underwater vehicles (AUVs)
    to examine, monitor, and eliminate that trash. For training, the InceptionResNetV2
    architecture of deep learning is employed. A huge and freely accessible dataset
    of real trash in diverse locations is labeled using data from the JAMSTEC e-library
    about deep-sea trash. After that, the certified network is put to the test on
    a variety of images from various datasets, offering knowledge about ways to improve
    an AUV’s detection capabilities for removing undersea trash. The trained system
    uses bounding boxes and target class maps to find interesting features in test
    images. It is expected that the findings will advance efforts to use AUVs to autonomously
    examine, detect, and collect aquatic garbage in underwater environments.


    Marine trash has a negative impact on the marine ecology and marine life’s ability
    to exist. The identification of deep-sea debris utilizing deep learning techniques
    is established in this study by [Xue et al., (2021](#ch14.xhtml#ref14_21)). In
    order to facilitate future study, a true deep-sea trash identification dataset
    (3D dataset) is first established. The dataset includes 7 different forms of trash.
    Second, the ResNet50-YOLOV3 one-stage deep-sea trash detection system is suggested.
    Eight other sophisticated detection algorithms are also utilized in the search
    for deep-sea debris. Finally, experiments are used to validate ResNet50-YOLOV3’s
    performance.


    This work by [Winans et al., (2021](#ch14.xhtml#ref14_22)) assesses the effectiveness
    of deep learning centered object identification to autonomously identify, track
    down, and categorize abandoned marine debris along several kilometers of the diverse
    Hawaiian shoreline. The two most popular object detection techniques, SSD with
    MobileNetV2 (SS-MN), which is the faster model, and faster RCNN with Inception-ResNet-v2
    (FR-IR), which has a greater computational cost, were put to the test. These two
    models provide a trade-off between identification accuracy and detection speed,
    with one model operating five times as quickly. When thoroughly studied, the results
    of the object identification and deep learning classifiers clearly show the best
    methods for the development of deep learning for the management of coastline strand
    maritime rubbish at the broad, regional level.


    ## 3\. Materials and Methods


    This work uses a segmentation technique based on deep learning to identify and
    quantify the residual stock of marine debris. The purpose of this proposal is
    to identify and quantify the standing stock of coastal trash using deep learning-based
    segmentation algorithms. The implementation of real-time floating debris identification
    and classification employs a method based on FMAYOLOv5. Here, using the image
    segmentation method, the total number of debris objects along the coast is approximated.
    Additionally, this study demonstrated the discrepancy between automatic and manual
    approaches for predicting the standingstock of beach waste.


    ### 3.1 Data Acquisition


    A Galaxy S20 super camera with highest resolution was utilized to examine photographs
    of beach trash. The field of view and focal length are 25 mm and 79 degrees, respectively.
    A 10.m-wide transect was used to gather images of the entire Dasa-port seashore,
    which is situated in the West Sea, Korea (2021). For the training and test sets,
    110 pictures were gathered. Although every effort was made to prevent duplication,
    some debris pieces did overlap. Therefore, the overlapped photos were shaded so
    that they couldn’t be spotted before deep learning. Additionally, 736 close-up
    photos were gathered solely for the data set. Under the specified circumstances,
    close-up photos were captured at a height of just 0.5 m. 1500 items were taken
    for individual item labeling from 736 pictures.


    The litter on the entire beach was personally counted and categorized to make
    comparisons of the results of the deep learning method utilized in this work.
    Because of the small size, beach debris measuring >2.5 cm was used to determine
    the residual stock. Each piece of beach trash was categorized into one of seven
    categories, including plastic (containing PET bottles, vinyl ropes, and synthetic
    fiber), glass, fishing gear, thermopolis, rubber, metal and undefined. The undefined
    objects includes paper, fabric, manufactured wood pieces etc.. Following that,
    each class’s items were separately counted.


    ### 3.2 Implementation of FMA-YOLOv5 Object Detection Algorithm


    Using the acquired pictures, a network architecture based on YOLOv5—You Only Look
    Once—was utilized to identify and classify the debris. As a 1-stage detector,
    YOLO was created to expedite the image processing procedure. The 1-stage detector
    simultaneously performs region proposal and classification. To improve the ability
    of network feature extraction, an enhanced YOLOv5 (FMA-YOLOv5) technique is developed.
    This method extends the backbone by adding a feature map attention (FMA) layer.
    The input feature map’s size is left unchanged by the FMA layer, allowing for
    flexible and versatile addition to any network configuration. [Figure 14.1](#ch14.xhtml#fig14_1)
    illustrates the network training and detection procedures that make up the method.


    #### YOLOv5 Network Structure'
