    GRU is a newer version of `RNN`. Unlike Long Short Term Memory (`LSTM`) cells,
    `GRUs` do not contain cell states. `GRU` makes use of its hidden states for transporting
    information. It comprises of only 2 gates (Update gate and Reset gate). `GRUs`
    are faster than `LSTM` as they have lesser tensor operations. `Update Gate` is
    a combination of input and forget gates. `Forget gate` chooses what data to add
    in memory and what to ignore. `Reset gate` resets the past data for the purpose
    of eliminating gradient explosion. `Reset gate` estimates quantity of past data
    to be forgotten. The `update gate` and `reset gate` equations are expressed in
    equations (21) and (22) respectively.


    (21)

    `r[t] = sigma(x[t]W[r]+h[t-1]U[r])`


    (22)

    `u[t] = sigma(x[t]W[u]+h[t-1]U[u])`


    Where, `sigma` is the activation function applied at the gates, `x[t]` is the
    input data, `h[t–1]` is the hidden state data, `W[r]` and `U[r]` are the weights
    passed for reset gate, and `W[u]` and `U[u]` are the weights passed for update
    gate.


    The `GRU` is trained using backpropagation algorithm by feeding the extracted
    features as inputs and `ASO` solution set as weights. This work considers 80%
    of dataset for training and 20% of data for testing. The training of the model
    performed with training features and corresponding labels. The labels considered
    are: Normal, `COVID-19` with mild infections, `COVID-19` with moderate infections,
    `COVID-19` with severe infections. The testing phase is carried out with testing
    inputs to evaluate the performance.


    # 5. Results and Discussion


    This section of the research paper presents the classification results and performances
    of different classifiers with different feature vectors. The simulation of these
    models was conducted in `MATLAB R2020a` platform with `Windows 10 Pro` edition
    of operating system, `Intel Core i3` processor, and `8 GB RAM`. The results obtained
    from the simulation are presented and discussed in the following sub sections.


    The experimentation was conducted for different models of classifiers such as,
    conventional `CNN`, conventional `RNN`, and the proposed `ASO-GRU-NN`. These models
    were trained with different feature vectors such as `F1` (statistical feature
    vector), `F2` (GLCM textural feature vector), `F3` (Shape feature vector), and
    combined `F1 + F2 + F3` feature vector. The performance metrics considered for
    the comparison of the models are accuracy, error rate, sensitivity, specificity,
    and execution time.


    Accuracy of classification is referred as the number of correct predictions to
    the total sum of predictions. This is expressed as given in equation (23),


    (23)

    $$~Accuracy = \frac{T_{P} + T_{N}}{T_{P} + T_{N} + F_{P} + F_{N}}$$ $$


    Where,

    `T_P` is True Positives, `T_N` is True Negatives, `F_P` is False Positives, and
    `F_N` is False Negatives. Error rate is referred as the ratio of the total count
    of incorrect predictions to the total count of observations. This can be expressed
    in terms of accuracy given in equation (24).


    (24)

    `Error rate = 1 - accuracy`


    Sensitivity is defined as the total count of `COVID-19` class predictions to the
    sum of correct `COVID-19` class predictions and the normal class predictions.
    Sensitivity can be calculated using equation (25).


    (25)

    $$~Sensitivity = \frac{TP}{TP + FN}$$ $$


    Specificity is defined as the total count of correct negative class predictions
    to the correct negative class predictions and the incorrect positive predictions.
    Specificity can be calculated using equation (26).


    (26)

    $$~Specificity = \frac{TN}{TN + FP}$$ $$Total execution time (in s) is the time
    taken from giving an image to getting the classification results. The effects
    of different feature sets were assessed in this research and the obtained values
    of performance measures are shown in the Tables 4.1–4.4. Table 4.1 shows the classification
    results of statistical feature set. The proposed `ASO-GRU-NN` was found to produce
    best results showing 0.5 accuracy, 0.5 error rate, 1 sensitivity, and 61.23s total
    execution time. However, in terms of specificity, the `CNN` model showed best
    score of 1.


