  trans: '


    人机交互（HMI）是研究人类如何与机械系统进行交互和通信的学科。目前，它已连接到电脑、尖端系统以及用于物联网（IoT）设备，早已不再局限于传统的工业机械。越来越多的设备相互连接并自动完成任务。操作这些工具、框架和小巧设备应该是直觉的，客户不应有任何不理性的预期。


    客户既可以提供语音命令，也可以直接触摸手机屏幕来操作设备。或者，这些框架能够自然地区分每个人的需求：当汽车驶过路面上的感应线圈时，交通灯会自动变换颜色。不同的技术进步更多是为了支持我们的物理感官，而不是为了操作设备。显示增强现实的眼镜就是其中一个例子。此外还有高级员工，例如能够对客户请求做出相应响应并不断学习的聊天机器人。


    本书展示了由人机交互（HCI）和人工智能（AI）专家组成的跨学科团队如何培养突破性的应用，如医疗保健、智能家居和卓越医疗保健，并能够指导人机连接（HCI）——这是一个关注电脑创新设计以及在各种空间内客户与电脑之间通信的多学科领域。


    ## 核心特点


    * 探索了涵盖医疗保健、工业和教育的广泛案例研究

    * 研究了设计和开发智能用户界面的多种策略，以解决现实问题

    * 概述了人机交互（HCI）的研究挑战和未来研究方向


    信息安全面临着具有挑战性且迷人的问题。为了跟上不断变化的风险，人们正以热情、坚持和投入致力于这些工作。他们正在创建新的分析技术并提供新的解决方案。在这个全球互连和相互依赖的新时代，为安全从业人员（包括专业人士和学生）配备信息安全前沿的知识至关重要。该方法极佳的第一步就是本书。


    **M. VENKATRAMANAN 陆上将博士**


    **科学与人文学院院长**


    # 关于编辑


    ### J. Dhilipan 教授

    J. Dhilipan 博士担任位于钦奈（Chennai-89）的 SRM 科学技术学院 Ramapuram 校区计算机科学与应用系（MCA）的教授兼系主任。他在
    Manonmaniam Sundranar 大学获得博士学位，在 Dravidan 大学获得硕士学位（Phil），在 Madurai Kamaraj 大学获得
    MCA 学位。他在学术机构拥有 21 年的教学经验。他热爱教学、传授、培训、激励并用知识和良好的纪律帮助年轻人。他在知名期刊上发表了 47 篇文章，并在会议上发表了
    60 篇。在国内外知名期刊上发表了超过 96 篇论文，拥有 70 次引用，h 指数为 5。他担任多个国家和国际技术项目的组织主席、程序主席和程序委员会成员。他的主要研究领域包括人工智能、机器学习和数据分析。


    ### V. Saravanan 教授

    V. Saravanan 教授于 2004 年在 Bharathiar 大学计算机科学与工程系完成了计算机科学博士学位。他的研究领域包括人工智能、机器学习和软件代理。他在
    ISI、Scopus 等收录的国际期刊上发表了 90 多篇论文。他在国家、国际会议和期刊上发表了许多研究论文，并指导许多研究人员获得博士学位。他总共有 25
    年的教学经验，其中包括 3 年在 Bharathiar 大学的研究员工作。他指导了 18 位计算机科学领域的博士生。作为资助项目的成果，他完成了与沙特阿拉伯王国
    Majmaah 大学和阿卜杜勒·阿齐兹科学技术大学的合作，项目总成本为 41,500 美元。他是 IEEE 高级会员、印度计算机学会和印度技术教育协会终身会员。他曾担任哥拜姆特
    Karunya 大学计算机应用系教授兼系主任，哥拜姆特博士 NGP 学院计算机应用总监，以及哥拜姆特 SNS 学院计算机研究院长。目前担任泰米尔纳德邦钦奈
    SRM 科学技术学院 Ramapuram 校区科学与人文学院的副院长（学术）。


    ### R. Agusthiyar 教授

    R. Agusthiyar 教授是高等教育领域著名的学者，拥有 21 年的教学经验，他从 2002 年开始从事教学工作，目前担任 SRMIST Ramapuram
    校区科学与人文学院计算机应用系（BCA）的教授兼系主任。他于 2001 年在印度泰米尔纳德邦的 Madurai Kamaraj 大学获得 MCA 学位，于
    2008 年在泰米尔纳德邦的 Periyar 大学获得硕士学位（Phil）。他于 2017 年在 K. Narashiman 教授的指导下，在 Anna 大学获得数据挖掘方向的博士学位。他的研究兴趣包括数据挖掘、人工智能和机器学习。他在收录期刊上发表了
    14 篇研究论文，并在国内外会议上发表了 25 篇论文。他在 SRM 科学技术学院指导 8 名研究学者。他在物联网和机器学习领域拥有两项专利。


    # 1 基于深度学习算法的仇恨言论检测比较研究性能


    S. Sankari^(¹)


    研究学者，钦奈 Bharath 高等教育与研究学院


    S. Priscila^(²)


    副教授，钦奈 Bharath 高等教育与研究学院


    DOI: [10.1201/9781003428466-1](https://dx.doi.org/10.1201/9781003428466-1)


    ### 摘要

    社交媒体最近已成为领先的娱乐领域之一。全球范围内对社交媒体平台的使用增加引发了许多迷人的自然语言处理（NLP）挑战。NLP 的一个主要问题是检测流媒体平台聊天和评论中的禁忌。在过去的工作中，已使用各种深度学习算法和特征工程技术在不同数据集上识别了禁忌。尽管已有许多针对仇恨内容的研究，但大多数是在单一语境下进行的，没有研究过机器学习或深度学习模型在常见公共数据上的表现对比。本研究将使用一个包含三个不同类别的公开数据集，比较两种特征工程技术和七种深度学习算法的性能。测试结果显示高准确率和较低的时间复杂度。


    **关键词** 仇恨言论检测、深度学习、特征选择、LSTM、社交媒体


    ## 1 引言


    社交媒体网站是人们可以交流和创建个人文件的在线社区。在过去的十年里，社交媒体作为通信工具在范围和重要性上都有巨大的增长。社交网络的核心关注是用户生成的内容。用户主要参与和查看用户创建的内容。他们被鼓励发布文本、状态更新或图像供公众访问。由于社交媒体的开放性，任何人都可以发布他们想要的任何内容，无论这些观点是启发的还是反感的，或是处于两者之间。


    '
