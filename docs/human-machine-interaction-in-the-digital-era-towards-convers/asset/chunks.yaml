    \ marine litter in the coastal area and produce its density maps, these photos\
    \ were employed as input data in deep learning models. The input data was annotated\
    \ into litter and no litter classifications using the Zooniverse citizen science\
    \ tool. With the aid of volunteers, the annotation procedure was quickly put into\
    \ place, increasing its effectiveness and efficiency.\n"
  trans: "\n\n在许多计算机视觉任务中，例如目标定位和检测 Bochkovskiy et al., (2020)、分类以及语义分割 Tao et al.,\
    \ (2020) 深度学习技术已成功应用。与普通的机器学习方法不同，后者需要特定领域的知识以及人工设计的特征提取，而深度学习算法能够自主地从源数据中发现潜在的数据表征，并提供端到端的训练过程。Fukushima\
    \ et al (2014) 深度学习技术可用于在海洋碎片研究范围内开发更快速、更精确的工具来定位和分类漂浮垃圾。在图像和视频数据方面，卷积神经网络（CNNs）是推动深度学习成功的顶尖技术之一。CNN\
    \ 的设计受到动物视觉系统中观察到的感受野模式的影响，通过将低层信息整合到高层信息中来获取分层顺序的特征。\n\n单阶段单次框检测器（`SSD`）以及 `YOLO`\
    \ 系列算法和两阶段区域卷积神经网络（`R-CNN`）系列算法是深度学习算法的两个子集。最近的研究表明，`YOLO` 系列技术可用于多种检测应用。`YOLOv5`\
    \ 方法被选中用于识别漂浮碎片的网络模型。相比 `YOLOv2`、`YOLOv3` 和 `YOLOv4`，`YOLOv5` 具有更适应性的网络结构，使其更容易改变各种任务的网络架构。`YOLOv5`\
    \ 有四个版本：`YOLOv5s`、`YOLOv5m`、`YOLOv5l` 和 `YOLOv5x`。模型的深度、宽度从 `YOLOv5s` 到 `YOLOv5l`\
    \ 都在增长。尽管准确性随着模型复杂性的增加而提高，但检测速度也会受到影响。由于参数众多会显著减慢检测速度，`YOLOv5l` 以及 `YOLOv5x` 未被纳入考虑。\n\
    \n本文的研究旨在解决对漂浮塑料进行快速准确估计的需求。这些是本文的主要贡献：\n\n* 创建一个用于自主手段对各种类型的海洋垃圾进行检测、分类和量化的模型；\n\
    * 在 `YOLOv5` 网络的骨干和颈部之间放置了特征图注意力（`FMA`）层，如图图 1\n\n  图 14.1 FMA-YOLOv5s 算法的通用框架\n\
    \n* 为了估计沿岸碎片，采用了基于深度学习的 `U-Net` 分割技术。\n* 利用所提方法对废物进行定量估计并分为六类：塑料、玻璃、渔渔具、热塑胶、橡胶、金属和未定义。\n\
    * 本研究还证明了所提出的自动方法与既有自动方法之间的区别。\n\n工作的其余部分结构如下。相关工作在 2 中进行了回顾。本研究使用的材料和技术在 3 中描述。深度卷积架构在\
    \ 4 中实现，并展示和讨论了在-14_1 中的实验结果。进一步研究的结论和建议在 5 中。\n\n## 2 文献综述\n\n理解和对抗日益增加塑料颗粒依赖于肉眼方法，这些方法是目前收集数据最广泛的策略，尽管自\
    \ 2018 年以来人工智能方法已有所进展。因此，Gnann 等人（2022）的综述概述了关于宏观塑料类型视觉识别的最新研究。重点是数据收集和评估方法，例如机器学习和深度学习，尽管也可能考虑公开可用的数据。其目标是在这一研究领域发展的时期提供批判性的展望和观点。该研究表明，尽管机器学习和深度学习算法显示出有效性和广泛的可用性，但在准确性和精度方面与视觉监控相比，它们仍处于不成熟阶段。\n\
    \n为了设计一种公民可以用来检查海岸线海洋垃圾的方案，Papakstantinou et al., (2021) 框架将无人机技术与人工智能机器视觉的进展相结合。在当前研究中，使用消费级现无人机从背景复杂的沙滩拍摄了极高分辨率的航空照片。为了检测沿海地区的垃圾并产生其密度图，这些照片被用作深度学习模型的输入数据。输入数据使用\
    \ Zooniverse 公民科学工具标注为“垃圾”和“无垃圾”分类。在志愿者的帮助下，标注程序迅速实施，提高了其有效性和效率。\n\n"
