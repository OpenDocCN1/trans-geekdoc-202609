  \ `ICMP` 等特征，这些特征似乎在第 3 层之上。另一方面，`IETF` 模型没有显式地定义会话层（第 5 层）和表示层（第 6 层）。\n\n### 2.\
  \ 数据链路层\n`IETF` 以这一原则为基础定义了不同的层，尽管没有像 OSI 模型那样清晰，但发现使用像 OSI 模型那样的层数在开发软件和产品时非常方便且易于表达。尽管存在某些差异，`IETF`\
  \ 和 OSI 层模型之间似乎几乎有一一一的映射。例如，`IETF` 针对 `IP` 的网络层 3 并不完全由 OSI 网络层 3 所定义，因为 `IP` 具有诸如\
  \ `ICMP` 等特征，这些特征似乎在第 3 层之上。另一方面，`IETF` 模型没有显式地定义会话层（第 5 层）和表示层（第 6 层）。\n\n### 3.\
  \ 互联网/网络层\n`IETF` 以这一原则为基础定义了不同的层，尽管没有像 OSI 模型那样清晰，但发现使用像 OSI 模型那样的层数在开发软件和产品时非常方便且易于表达。尽管存在某些差异，`IETF`\
  \ 和 OSI 层模型之间似乎几乎有一一一的映射。例如，`IETF` 针对 `IP` 的网络层 3 并不完全由 OSI 网络层 3 所定义，因为 `IP` 具有诸如\
  \ `ICMP` 等特征，这些特征似乎在第 3 层之上。另一方面，`IETF` 模型没有显式地定义会话层（第 5 层）和表示层（第 6 层）。\n\n\n\n\n\
  \n网络层的额外功能包括 `ARP`、`ICMP` 和 `IGMP`。`ARP` 用于节点将相应的物理地址（例如 `MAC addresses`）解析到其分配的\
  \ IP 地址（例如 `IPv4 addresses`）。`ICMP` 提供了一些网络管理和维护功能，其中就包含了节点用于查询网络中其他节点属性的“ping”功能。`IGMP`\
  \ 用于管理主机和路由设备在组播组中的成员关系。IP 主机使用 `IGMP` 向任何直接相邻的组播路由设备报告其组播组成员身份。组播路由设备使用 `IGMP`\
  \ 来学习其所连接的每个物理网络中哪些组包含成员。\n\n### 6.2.4 第 4 层：传输层\n\n传输层 4 层的设计正如 OSI 模型中描述的那样，旨在让传输协议为应用程序提供主机到机的通信服务。OSI\
  \ 第 4 层的描述也适用于 Internet 模型。\n\n### 6.2.5 第 5–6 层：中间件\n\nInternet 模型并没有定义中间件层（第 5–6\
  \ 层），而是将其作为 5 层模型的一部分。然而，多年来工业界已达成共识，认为中间件层应由 OSI 模型中的第 5 层和第 6 层组成（图 6.1）。事实上，中间件层是一个关键层，全球不同的行业论坛和每家公司已对大量的软件组件进行了标准化。演进中的\
  \ Internet 模型中间件层（包含 OSI 模型的第 5 层和第 6 层）由某种方式在工业界开发的某种标准软件模块组成，这些模块独立于底层的硬件和软件组件，使得开发人员更容易实现通信和输入/输出，以便他们专注于应用程序的特定目的，在成本、进度和复杂度目标内成功实现预期结果。在这方面，中间件是一种起中间人作用的抽象层。中间件管理应用程序与底层系统软件层（如操作系统和设备驱动程序层）之间的交互。此外，一个中间件组件可以利用另一个中间件组件的服务，反之亦然。底层软件可以是控制非计算机设备（如微芯片）特定功能的嵌入式软件，也可以是位于芯片之上的另一个应用程序的一部分。\n\
  \n中间件软件组件可以为上层中间件和应用程序提供许多益处：适应系统资源可用性的变化、通过配置和自定义软硬件限制提供灵活性和可扩展性、确保对系统资源授权访问的安全性、避免耗时且昂贵的应用程序代码重写的移植性，以及通过某些用户友好的标准接口与远程设备上的其他应用程序进行透明通信的连接能力。行业标准中间件软件组件的示例包括面向消息中间件\
  \ (`MOM`)、对象请求代理 (`ORB`)、企业服务总线 (`ESB`)、开放数据库连接 (`ODBC`)、Java 数据库连接 (`JDBC`)、事务处理监控器\
  \ (`TPM`)、虚拟机 (`VM`)、Web 中间件、服务器中间件等。尽管根据定义，中间件位于操作系统 (`OS`)/底层（嵌入式）软件与应用层之间，但原则上讲，`OS`\
  \ 和底层（嵌入式）软件也可以被视为一种中间件。\n\n在 2000 年，由于 `SOA`（面向服务的架构）和云计算的兴起，中间件的发展发生了爆炸性的变化（见第\
  \ 1.3 节）。\n\n### 6.2.6 第 7 层：应用层\n\nInternet 模型的应用层（第 7 层）基本上与我们在 OSI 模型中描述的相同。\n\
  \n## 6.3 对等点架构\n\n我们之前描述的早期架构模型被称为客户端/服务器 (`C/S`) 模型，每个客户端都是服务器的从节点。在对等点 (`P2P`)\
  \ 架构中，每个节点都作为一个对等的伙伴工作。对等点架构 (`P2P`) 是一种常用的计算机架构，其中每个工作站具有平等的能力和状态。`P2P` 也可以指代一个设计的程序，该程序的每个实例都可以同时作为客户端和服务器，并在对等网络中工作。内容分发是\
  \ `P2P` 网络的主要目的。这还包括软件发布和分发、内容交付网络、流媒体以及用于组播流的对等缓存，这些促进了按需内容交付。科学研究网络、搜索和通信网络以及现代动态无人机\
  \ (`UAVs`)/无人机网络也是 `P2P` 网络的一部分。\n\n非结构化 `P2P` 计算机网络架构有三种：纯 `P2P`、混合 `P2P` 和集中式\
  \ `P2P`。\n\n在纯 `P2P` 系统中，存在结构化的 `P2P` 计算机架构、工作站（对等体），有时还有资源。它们根据特定的标准和算法进行组织。在混合\
  \ `P2P` 设置中，使用客户端/服务器架构增强了 `P2P`系统的某些缺点。在集中式 `P2P` 系统中，集中式服务器负责每个对等点，以确定包含查询资源的所需对等点，然后将结果返回给请求的对等点。\n\
  \n\n\n\n\n图 6.5 展示了基于标准的 P2P 架构模型，以 P2P 区块链（BC）应用为例，以及非 BC P2P 架构模型的关系。P2P BC 应用包含两个部分：`P2P\
  \ 交易与脚本` 以及 `P2P BC 共识与挖矿信号协议`。非 BC P2P 应用也包含两个部分，即非 BC 消息和非 BC 信号与消息。例如，一些人正在构建\
  \ `ChatGPT` P2P 网络。如果 `ChatGPT` 使用如图 6.5 所示的基于标准的 P2P 协议，它就可以与网络上的其他 P2P 产品进行互操作。请注意，消息传输、存储、逻辑拓扑插件（使用应用层分布式分层表）以及转发和链路管理协议，对于\
  \ BC 和非 BC P2P 应用来说是保持相同的。\n\n![![图 6.5 P2P 协议架构模型。](img/fig6_5.jpg)\n\n图 6.5 P2P\
  \ 协议架构模型。\n\n分布式哈希表（`DHT`）是一种基于去中心化哈希表的分布式拓扑插件系统，用于映射键到值，提供查找、存储方案以及键值对存储。`DHT`\
  \ 中的每个节点都负责密钥以及映射的值。任何节点都可以高效地检索与给定键关联的值。`DHT` 将用户寻找的内容映射到存储匹配内容的对等节点。`DHT` 可能拥有一个巨大的表，用于存储*谁*拥有*什么*数据。`DHT`\
  \ 的示例包括 `Chord`、`Kademlia`、`BitTorent`、`Dynamo` 等。可扩展性是 P2P 网络选择不同 `DHT` 的主要原因。\n\
  \n然而，传输层、网络层和链路/MAC 层对于 P2P 和非 P2P 应用来说是相同的。最近，人们也在构建 `ChatGPT` P2P 应用网络。请注意，`ChatGPT`\
  \ 仍然被认为一组使用大型自然语言处理（NLP）协议的非 BC P2P 应用。\n\n移动自组网络（`MANET`）也是一种 P2P 网络，需要两层路由协议：`基于逻辑\
  \ DHT 的路由协议` 和 `物理路由协议`。通过这种方式，可以构建大规模的 `MANET` 网络。延迟容网络（`DTNs`）也是 `MANET`，但 `DTN`\
  \ 协议的设计使得网络上的消息延迟可以容忍节点随机移动导致的链路/节点断开。`DSR`、`OLSR` 和 `OSPFv3-MDR/CDR` 是 `MANET`\
  \ 物理路由协议的一些示例，在其之上使用了逻辑 DHT 路由协议。\n\n边界网关协议（`BGP`）用于互联网骨干网络内部路由，而之前描述的所有其他路由协议用于接入网络。`CSMA/CD`、`CSMA/CA`、`CDMA`、`FDMA`、`混合\
  \ (CDMA/TDMA/FDMA)`、`OFDMA` 等用于链路/MAC 层，被称为多接入方案。`光纤`和`时间/密集波分网络`用于网络的物理层，我们在之前以及后面的章节中也详细描述过。\n\
  \n关键点在于，AI/ML/DL 可用于协议架构每一层中的所有这些技术，以使它们更高效并提高性能。\n\n## 6.4 总结\n\n在本节中，我们描述了客户端/服务器（C/S）OS\
  \ 协议层架构、`C/S` 互联网协议层模型以及对等网络（P2P）架构模型。还详细讨论了这些架构模型之间的显著差异。我们指出 OSI 模型的第 4 层和第 5\
  \ 层在互联网模型中被称为“中间件”。`C/S` 模型是 P2P 协议架构模型的一个子集。\n\n## 参考文献\n\n* [1] Zimmermann, H.,\"\
  OSI 参考模型——开放系统互连架构模型，”IEEE Transactions on Communications. 28 (4): 425–432, 1980\
  \ 年 4 月。\n\n\n\n\n\n*   降维\n    *   机器学习\n    *   深度学习\n*   信号/数据分类技术\n    *   机器学习\n\
  \    *   深度学习\n*   决策信号/数据分类评估\n    *   测试数据预测\n    *   ML/DL 模型评估\n\n## 7.1 信号/数据采集\n\
  \n信号/数据采集（`SAQ/DAQ`）是通过采样等方式以数字形式从系统中获取信息的过程。传感器 `SAQ/DAQ` 系统能够将物理参数转换为电信号。`SAQ/DAQ`\
  \ 系统像信号调处理电路一样，将传感器信号转换为可以转化为数字值的形式。模数转换器将处理过的传感器信号转换为数字值。在此时，我们还未让 `SAQ/DAQ` 系统具备\
  \ AI/ML/DL 能够。\n\n## 7.2 信号/数据数字化\n\n对信号或数据进行采样以实现数字化。例如，传感器的物理参数被转换为可能是模拟形式的电信号。我们假设所有所有信号/数据都已数字化，以供计算机系统使用。一旦获得数字化信息，就可以启动\
  \ `AL/ML/DL` 过程。\n\n## 7.3 信号/数据清洗与预处理\n\n信号/数据清洗和预处理主要用于去除噪声，而去除噪声的方法取决于应用的类型。例如，对于文本（如电子邮件、文件、网页），包括\
  \ `Tokenization`（分词）、`Stop Words`（停用词）、`Capitalization`（大小写转换）、`Slang and Abbreviation`（俚语和缩写）、`Noise\
  \ Removal`（去噪）、`Spelling Correction`（纠错）、`Stemming`（词干提取）和 `Lemmatization`（词形还原）。这些功能每个都有特定的机器学习和非机器学习算法。从测量数据中提取的初始可操作非冗余特征（值）用于满足所需的目标，例如促进后续的学习和泛化步骤，在某些情况下，它可能有助于人类更好地理解。初始特征集被称为无冗余特征的全特征集。有很多\
  \ `ML` 特征提取算法可用。然而，需要选择什么特征提取算法再次取决于应用类型。例如，对于文本（如电子邮件、文件、网页），可以使用以下特征提取算法，每种算法都有其优缺点：\n\
  \n*   句法词表示\n    *   N-Gram\n    *   句法 N-Gram\n*   权重词\n    *   词袋模型 (`BoW`)/特征包\
  \ (`BoF`)\n    *   词袋模型 (`BoW`）的局限性\n    *   词频-逆文档频率 (`TF-IDF`）\n*   词嵌入\n    *\
  \   词向量 (`Word2Vec`）\n        *   – 连续词袋模型\n        *   – 连续跳字模型\n    *   词表示全局向量\
  \ (`GloVe`）\n    *   快速文本 (`FastText`）\n    *   上下文词表示\n\n注意，这些算法中的任何一种都适用于文本应用的特征提取。人们可以使用一种或多种算法进行文本应用的特征提取。通常情况下是使用尽可能多的算法，并选择产生优越结果的最佳算法。\n\
