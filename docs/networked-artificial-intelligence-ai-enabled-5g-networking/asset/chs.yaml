  \ R. J., “Simple Statistical Gradient-Following Algorithms for Connectionist Reinforcement\
  \ Learning,” Machine Learning, 1992.\n\n\n\n\n21 世纪 AI 赋能/基于标准的通信网络必须处理许多多样化的应用。AI\
  \ 赋能（AI-enable）意味着通过 AI 启用的现有遗留应用/协议可能被放置在后端服务器，而基于 AI 标准的应用/协议则是新的高效的标准化应用和网络协议，这些协议不使用任何遗留应用或协议。例如，4G/5G\
  \ 网络可以使用 AI 赋能的应用协议，其中遗留应用协议通过 AI 后端服务器进行处理，以提高其效率。然而，新兴的 6G 网络从本质上将是新的基于 AI 标准的通信网络，所有的应用和网络协议都将使用基于开放标准的\
  \ AI 协议进行设计。AI 赋能/基于标准的通信网络协议架构如图图 14.1\n\n图 14.1 AI 通信网络协议架构。\n\n每一层中的当前遗留应用都是\
  \ AI 赋能的，以提高它们的效率。当 AI 标准协议被开放标准组织标准化时，这些新的基于 AI 标准的协议也将应用于每一层。请注意，AI 感知的应用服务既可以是\
  \ AI 赋能的，也可以是基于 AI 标准的。为了起见，我们将使用“AI 应用”一术，它可能指 AI 赋能或基于 AI 标准的应用或协议。\n\n21 世纪的通信网络必须处理跨越空间层、空中层、无人机（UAV）层和地面（有人和无人）层的多样化应用，以及移动蜂窝无线网络、移动自接网络（MANETs）和/或固定有线网络。图\
  \ 14.2 展示了建议的多域通信网络架构的高层视图[1]。\n\n![图 14.2 多域通信网络架构的高层视图。](img/fig14_2.jpg)\n\n\
  图 14.2 多域通信网络架构的高层视图。\n\n通信网络的运营在性质上也变得日益多样化。每种应用，如基于互联网的会话协议（SIP）语音/多媒体、消息、即时消息、态势感知（SA）、指挥与控制、嵌入式训练、前方观察员训练、现场网络战争模拟等，都需要包含行动历史、当前状态和潜在后果的整合视图，特别是在网络战争环境中。因此，这些应用都需要在最短时间内具有海量信息处理能力。\n\
  \n当人们无法将呈现的信息转化为连贯的态势感知时，就会发生信息过载的情况。例如，随着对许多地点实时或近实时数据采集能力的快速扩展，以及从指挥控制运行中心到个人现场人员向不同级别的通信提供数据抽象，信息过载的危险已显著增加。\n\
  \n网络运营商或用户可能需要理解全局态势感知，以及各个团队预期如何在环境中移动，而单个用户可能只关注非常有限的区域。同样，医护人员可能需要健康记录通往伤者的路线，而前方观察员可能需要几天的侦察信息来检测异常或意外的敌人或攻击者的行动。理想情况下，AI/ML/DL\
  \ 应用将感知到这些各种任务，例如任务计划（包括任何应急预案）以及任何用户在给定时间可能承担的角色。这些用户的需求和能力专门驱动了 AI/ML/DL 应用的发展[2]。\n\
  \n此时也应该明显，各种 AI/ML/DL 应用连接了两个有些不同的领域：计算和通信。例如，态势感知迫使需要引入数据的视觉表示。同样，所有其他应用如传感器、机器人、车辆、计算机、手机、服务器和其他通信实体将使用\
  \ AI/ML/DL 应用。以通用的应用无关的方式满足所有多样化应用需求的高层数据抽象也是一个活跃的研究领域。\n\nAI 需要整合来自不同应用的各种信息，包括\
  \ ML/DL 算法的输出。因此，它可以限制对特定应用有意义抽象类型，并迫使应用设计者创建超越典型人类感知的感知或认知提示的方法。独立于使用的编程语言和支持的数据格式的高层抽象，有助于应用程序编程接口（API）的开发，以便利用不同产品的各个算法，或组合多个算法使用\
  \ AI/ML/DL 解决复杂任务。\n\n## 14.1 人工智能感知应用服务\n\nAI 感知的应用服务可能包括网络安全、运维（O&M）、自然语言处理（NLP）、语音、分析/预测/预测、专家系统、机器人、视觉、情绪/情感分析等。这些服务基于底层\
  \ AI 赋能/基于标准的中间件层创建。\n\n## 14.2 人工智能赋能/基于标准的应用\n\n此层由 AI 应用组成，通常用于构建以下 AI 应用服务：\n\
  \n* NLP 平台：上下文提取/分类/机器转换/问答/测试关联\n* 专家系统平台\n* 知识库 (KB)\n* 本体论\n* 视觉平台：图像处理/机器视觉\n\
  * 语音平台：文本转语音 (TTS) 和语音转文本 (STT)\n* 机器人平台\n* 其他\n\n这些 AI 应用对于执行我们在任何 AI 系统、产品（例如\
  \ ChatGPT、BARD 等）和服务中看到的所有工作至关重要。反之，这些 AI 服务调用 ML/DL 算法（我们将其称为常用的 ML/DL 中间件基础设施），以代表应用执行计算。如前所述，AI\
  \ 应用调用一个或多个 ML/DL 算法以找到满足任务目标的最佳性能。\n\n## 14.3 人工智能赋能/基于标准的中间件基础设施\n\n我们将 AI 赋能/基于标准的中间件分为两个部分：由开放或公共标准组织标准化的\
  \ AI 标准中间件，以及通过私有手段使用 AI 启用的遗留现有中间件。\n\n### 14.3.1 基于人工智能标准的中间件\n\n该层最重要的方面是用于开发\
  \ AI 赋能和基于 AI 标准的应用的 AI 标准中间件。我们也使用“AI 中间件基础设施”来称此。该中间件是一组 AI/ML/DL 算法。以下是预计将被开放或公共标准组织标准化的\
  \ AI 标准中间件（算法）和工具列表：\n\n* 线性/逻辑回归\n* 线性判别分析\n* 梯度提升决策树 (XGBoost)\n* 因子分解机\n* K 均值类/提取最大化聚类\n\
  * 随机森林\n* 朴素贝叶斯\n* 主成分分析 (PCA)\n\n\n\n\n\n*   独立相关分析 (ICA)\n*   线性学习器\n*   支持向量机\
  \ (SVM)\n*   信念网络\n*   隐马尔可夫模型 (HMM)\n*   轮廓隐马尔可夫模型 (PHMM)\n*   模糊系统\n*   Q-Learning\
  \ 学习模型（强化学习）\n*   长短期记忆网络 (LSTM)\n*   递归神经网络 (RNN)\n*   卷积神经网络 (CNN)\n*   神经灵机 (NTM)\n\
  *   遗传算法 (GA)\n*   ML/DL 工具\n    *   OpenAI\n    *   TensorFlow\n    *   Keras\n\
  \    *   H2O\n    *   PyTorch\n    *   Caffe\n    *   Gluon\n    *   其他\n\n### 14.3.2\
  \ 人工智能启用中间件\n\n人工智能启用中间件是通过专用手段启用 AI 的现有遗留中间件。如前所述，现有的遗留中间件可以使用后端 AI 服务器进行启用。\n\n\
  ## 14.4 人工智能启用/基于标准的传输协议\n\n今天网络中使用的遗留传输协议示例如下：传输控制协议 (`TCP`)、用户数据 agram 协议 (`UDP`)、结合\
  \ `TCP` 的传输层安全协议 (`TLS`) (`TLS-TCP`) 以及结合 `UDP` 的数据 agram 传输层安全协议 (`DTLS`) (`DTLS-UDP`)。此外，超文本传输协议\
  \ (`HTTP`) 和超文本传输协议 (`HTTPS`) 用于传输协议之上，在网络设备之间传输信息，特别是用于 Web 服务。\n\n`TCP` 具有流控机制，随着网络变得越来越复杂和动态，设计最优反馈-动作映射变得越来越困难。AI\
  \ 可以应用于这些遗留的 `TCP` 流控中，例如通过联邦学习、强化学习、监督学习和其他机器学习，以最少的数据包丢失、改进的延迟和更高的吞吐量容量来提高性能。\n\
  \n`UDP` 是一种不可靠的协议，会在网络上丢弃数据包，同时关键信息内容往往会在途中丢失，从而降低整体性能。语音、视频和数据通过 `UDP` 发送。通过 `UDP`\
  \ 发送的这些应用的性能无法保证。通过 AI 算法（如联邦学习、强化学习、监督学习）启用 `UDP`，可以提高非结构化数据负载的性能（例如丢包率和可靠性）。\n\
  \n`TLS` 安全协议通过面向连接的 `TCP` 传输协议传输。与 `TCP` 类似，`TLS-TCP` 也可以通过 AI 启用以提高性能。`DTLS-UDP`\
  \ 也可以类似于 AI 启用的 `UDP` 使用。应用层 `HTTP/HTTPS` 协议通常运行在 `TCP` 传输协议之上。尽管 AI 网站生成器使用机器学习根据用户输入自动生成网页，但\
  \ `HTTP/HTTPS` 的性能可以进一步提高，类似于通过 `TCP` 控制 `HTTP/HTTPS` 协议的传输，但研究人员尚未在此方面开展工作。\n\n\
  ## 14.5 人工智能启用/基于标准的网络和路由协议\n\n5G 网络中遗留网络协议（例如 `IPv6`）和路由协议（路由协议 [例如：开放最短路径优先第 3\
  \ 版 (`OSPFv3`)、`OSPFv3-MANET`、指定路由器 (`MDR`)、动态源路由 (`DSR`)、优化链路状态路由 (`OLSR`)、边界网关协议\
  \ (`BGP`)]）可以被 AI 启用，而新兴的 6G 网络将基于基于 AI 标准的新型网络和路由协议。AI 启用的 `IPv6` 可以提供强大的编程能力，其网络路径、服务和转发行为满足许多需求，使其成为操作简单的服务驱动型网络的理想选择。现代动态网络中，路由协议需要实时链路流量信息、准确的实时数据分析和流量预测方法，以及跨数据集的一致流量预测。基于\
  \ AI 的路由协议（例如 `OSPFv3`、`OSPFv3-MDR`、`OSPFv3-CDR`、`DSR` 和 `OLSR`）可以处理动态网络中的这些问题，具有优越的性能（例如低丢包和极低延迟），并在具有动态拓扑的现代网络中跨数据集具有一致流量预测。\n\
  \n`BGP` 是一种用于在自治系统 (`AS`) 之间携带路由信息的路径向量协议。路径向量一词源于 `BGP` 路由信息携带一系列 `AS` 编号，这些编号识别了网络前缀遍历的\
  \ `AS` 路径。与前缀相关的路径信息用于防止环路。`BGP` 需要通过 `TCP` 在对等体之间发送预配置的路由信息，从而简化了在协议本身中设计可靠性相关的复杂性。尽管\
  \ `BGP` 本身不使用动态路由协议，即使如此，AI 可能仍有助于对等体之间基于配置的路由。此外，AI 可以增强有线和无线网络的能量优化、动态故障恢复与分析、资源管理和调度，特别是针对小区网络的小区划分。\n\
  \n## 14.6 人工智能启用/基于标准的链路/介质访问控制 (MAC) 协议\n\n这里列出了链路/介质访问控制 (`MAC`) 协议的一些示例：\n\n\
  *   载波监听多接入/冲突回避 (`CSMA/CA`)\n*   `CSMA`/冲突检测 (`CD`)\n*   时分多接入 (`TDMA`)\n*   码分多接入\
  \ (`CDMA`)\n*   频分多接入 (`FDMA`)\n*   混合式 (`TDMA/CDMA/FDMA`)\n*   正交频分多接入 (`OFDMA`)\n\
  \n链路/介质访问控制 (`MAC`) 层信道估计和预测、符号检测和通道编码需要复杂的数学模型。这些数学模型提供了简单的近似数学公式，无法捕获今天高速网络（例如毫米波和太赫兹网络）的实际特征。系统设计者在设计收发器时使用了启发式模型而非精确模型。然而，链路/MAC\
  \ 协议的 AI 启用模型和算法克服了遗留模型和算法的挑战。在数据链路层，将深度学习用于频谱分配、流量预测和链路评估等任务将提供卓越的结果。同样，结合了 MAC\
  \ 技术 `CSMA/CA`、`CSMA/CD`、`TDMA`、`CDMA`、`FDMA`、混合式 (`TDMA/CDMA/FDMA`) 和 `OFDMA` 的介质访问技术可以使用包括强化学习的\
  \ AI 来获得更好的性能。强化学习的一个良好特性是智能体能够根据网络状态在多种模式之间切换，从而始终保持网络性能最优。其他层级的其他技术也是如此。\n\n##\
  \ 14.7 人工智能启用/基于标准的物理层 (PHY)\n\n物理层 (`PHY`) 对 AI 至关重要，因为该层为 AI/ML/DL 提供了所有的计算处理能力。5G\
  \ 是 AI 启用的，因为它已经标准化以使其应用 AI 启用。4G 设计没有对其应用提供标准化提案，但其应用仍然可以实现 AI 启用。然而，新兴的 6G 技术在设计上将是\
  \ AI 标准化的。物理层的一些任务可以包括物理编码、调制分类、干扰对齐和抗干扰。所有这些物理层任务至少对于 4G/5G 都是 AI 启用的，而 6G 技术将基于\
  \ AI 标准。\n\n\n\n\n\n自由空间光学系统（`FSO`）是最有效的解决方案之一，特别是针对天气和环境结构引起的大气湍流。自由空间光学系统面临各种局限性。`FSO`\
  \ 的一个为人知的缺点是其对局部天气条件敏感，特别是对雾和雨的敏感，这导致通信路径上的光信号功率大幅损失。本章的主要目标是评估使用波分复用（`WDM`）的数据传输质量，同时强调几个影响数据传输质量的因素。这些分析结果是为了开发一种用于高数据率传输的高质量自由空间光学系统。从结果分析可以看出，`1,550\
  \ nm` 的 `FSO` 波应对大气衰减的影响较小。发射器和接收器之间的短链路可以优化 `FSO` 系统的传输参数或组件。根据分析，建议在天气良好、误码率（`BER`）为`10^(−9)`的情况下，开发一种采用`1,550\
  \ nm` 波长、链路范围达`150 km` 的`2.5 Gbps` `FSO` 系统。\n\n## 14.8 总结\n\n在本节中，我们提出了一种符合 `OSI`\
  \ 模型的人工智能协议架构模型。该模型将成为最重要的模型，允许我们构建基于标准的协议架构，从而在多厂商通信环境中提供互操作性。鉴于目前缺乏基于标准的 AI 协议架构（因为尚未有标准机构进行标准化），我们使用了双重方法：`赋能\
  \ AI 的架构`和`基于 AI 标准的架构`。使用私有方案构建的`赋能 AI 的架构`在`基于 AI 标准的协议`出现之前，仅能通过各家公司或组织开发的开放应用程序编程接口（`APIs`）实现互操作。几乎所有厂商都定义了自己的开放\
  \ `APIs`，但这些 `APIs`中没有一个是基于开放标准论坛/机构开发的基于标准的 `APIs`。根据关于基于开放标准的协议的持续研发和出版物，我们提出了`基于\
  \ AI 标准的协议架构`。它将为`ITU-T`、`IETF` 等标准机构/论坛构建基于开放 AI 标准的协议架构铺平道路。在第一阶段，所有 AI 应用协议都可以使用研发出版物中提出的所有\
  \ AI 协议，以实现最高效的操作，通过在所有 `OSI` 层中使用简单协议来证明其优越的性能。\n\n## 参考文献\n\n* [1] Roy, R. R.\
  \ et al. “多领域阵型中的指挥：2050 愿景战士网络安全、指挥与控制架构，”MAD Scientist Conference, 2017.\n* [2]\
  \ Roy, R. R. et al. “基于人工智能、机器学习/深度学习的战士网络安全架构框架，”MILCOM, 2019.\n\n# 15 AI 赋能网络\n\
  \nDOI: [10.1201/9781003499466-15](https://doi.org/10.1201/9781003499466-15)\n\n\
  ## 15.1 AI 赋能物理层\n\n物理层负责在通信链路或通道上原始比特的传输和接收。物理层链路/通道可以是物理导线或无线。流量复用、`调制方案`、`数据速率`、`信道接入方法`、`物理连接器`、`单工`、`全/半双工`、`定时`、`频率`、`电压级`等都是物理层的功能。物理层链路/通道可以是物理导线或无线。在物理层中，`调制/解调`是主要功能。`调制/解调`（`Modem`）是对电磁（`EM`）波幅度、频率或相位的操作，目的是传输信息。发射器和接收器将预先约定特定的调制方案，以便这种信息共享发生。我们在图\
  \ 15.1 中展示了非 AI/ML/DL 赋能的解调器的基本功能。\n\n```\n![FIGURE 15.1 调调器的基本功能（调制器/解调器）。](img/fig15_1.jpg)\n\
  ```\n\nFIGURE 15.1 解调器的基本功能（调制器/解调器）。\n\n有趣的是，如果解调器如如图 15.2 所示，通过过程（信号采集、预处理、特征提取、特征分类和预测/决策）实现了\
  \ AI/ML/DL 赋能，其基本功能仍保持与图 15.1 所示相同，但其性能（如误码率 `BER`）与正常值相比几乎可以忽略不计，且信道容量将接近标准的香农信道容量。\n\
  \n```\n![FIGURE 15.2 AI/ML/DL 赋能的解调器（调制器/解调器）。](img/fig15_2.jpg)\n```\n\nFIGURE\
  \ 15.2 AI/ML/DL 赋能的解调器（调制器/解调器）。\n\n可见，神经网络用于调制分类任务的性能可以在大调制类型范围内达到非常高的准确率。卷积神经网络和残差神经网络在标准信道失真下达到了\
  \ 80%-90% 的准确率[1]。注意 AI/ML/DL 的过程保持不变，但使用特定软件集需要物理层（OSI）。图 15.3 显示了图 15.2 的简化视图。\n\
  \n```\n![FIGURE 15.3 AI/ML/DL 赋能的解调器（调制器/解调器）。](img/fig15_3.jpg)\n```\n\nFIGURE\
  \ 15.3 AI/ML/DL 赋能的解调器（调制器/解调器）。\n\n注意，图 15.3 展示了通信信道基于 AI/ML/DL 的解调器的简化表示。我们现在可以认为，物理解调器可能会带有嵌入式的特定\
  \ AI/ML/DL 硬件。另一种方案是在手机、无线电波形和应用服务器等设备的所有 OSI 层中使用通用的 AI/ML/DL 计算（图 15.4）。\n\n##\
  \ 15 \n\n```\n![FIGURE 15.4 所有 层的 AI/ML/DL 服务器。](img/fig15_4.jpg)\n```\n\nFIGURE\
  \ 15.4 所有 层的 AI/ML/DL 服务器。\n\n物理层网络由光纤/光子/光、密集波分和其他骨干网通信网络技术组成，而 4G/5G/6G 无线技术用于连接骨干网的接入网络。无线通信背景下的“代”通常描述所提供的基本特征的转变，例如传输技术、比特率、频带、信道频率带宽和数据传输容量。扩张迅速的技术领域之一是无线时代[2]。6G\
  \ 网络带宽的剧增将迫使骨干网容量增加。图 15.5 描绘了接入网络和骨干网的高级示意图。\n\n```\n![FIGURE 15.5 端到端网络的高级示意图。](img/fig15_5.jpg)\n\
  ```\n\nFIGURE 15.5 端到端网络的高级示意图。\n\n\n\n\n由于目前存在许多先进技术，因此需要实现能够进行集成和调整的技术，以产生更先进、更统一的系统。在这项工作中，我们对若干无线通信技术进行了总结，特别是\
  \ 4G、5G 和 6G 网络，并对它们之间进行了详细比较。第三代（3G）移动技术提供了更高的数据速率和更大的容量。第三代（3G）移动无线技术已被第四代（4G）取代，后者提供了更改进的数据。5G\
  \ 将使无线世界成为可能，而 6G 将结合 5G 和卫星网络提供全球覆盖。\n\n## 15.2 AI 驱动的链路/介质接入控制层\n\n我们观察到链路/介质接入层（MAC）使用了时分多址（TDMA）、码分多址（CDMA）、频分多址（FDMA）、正交频分多址（OFDMA）、带有冲突规避的载波监听多接入（CSMA/CA）、时分全双工（TSFD）以及纯\
  \ ALOHA、时隙 ALOHA 等其他无线接入协议。另一方面，数据链路控制负责通过使用帧封装、错误控制和流量控制等技术，确保信息在传输通道上的可靠传输。\n\n\
  关键在于 MAC 协议调节了介质（例如音频、视频和/或数据）的使用，这是通过信道接入机制实现的。信道接入机制通过复用方法划分资源，允许多个数据流或信号通过调节其使用，共享通信节点之间的通信信道或物理介质（无线信道）。MAC\
  \ 协议告诉每个节点何时可以传输以及何时预期接收数据。信道接入机制是 MAC 协议的核心。此外，MAC 确认方案和重传，以防止信道/时隙出现错误。\n\n通过\
  \ AI/ML/DL，所有这些链路/MAC 协议的实现都可以简化，并可以尽可能减少无线网络中的错误和损失，从而提高网络的整体响应时间。3–5] 有线/无线网络中的\
  \ MAC 协议具有多层异构性。目前在嵌入式无线节点中编写 MAC 逻辑的最佳实践是，根据可用的底层硬件支持，实现已知的协议，如 ALOHA、Slotted-ALOHA、载波监听多接入（CSMA）和带有冲突规避的载波监听多接入（CSMA-CA）（例如\
  \ Wi-Fi、BT 等）。此类协议的选择通常由网络设计者的启发式方法和经验驱动。虽然这些方法提供了网络和协议部署的标准方法，但它们并不一定以公平的方式最大化\
  \ MAC 层性能，特别是在网络和数据异构的情况下。例如，当不具备载波监听能力的节点运行 ALOHA 族协议时，一旦网络中的应用流量负载超过最佳水平，它们的性能就会因为冲突开始下降。在存在确认（ACK）、无确认、分片/聚合、分片阈值、退避、发送请求（RTS)/清除发送（CTS）、网络分配矢量（NAV）、NAV\
  \ 超时、竞争窗口（CW）、流量负载、拓扑、特定节点访问优先级等多种形式的异构时，这些问题更加复杂。这种性能差距的关键在于节点是静态编程的协议逻辑，无法感知时间变化的负载情况和此类异构性。AI/ML/DL\
  \ 的 MAC 允许无线节点学习如何检测此类情况，并实时更改传输策略以最大化网络性能，即使在特定节点访问优先的情况下也是如此。\n\nAI/ML/DL 驱动 MAC\
  \ 的核心概念是将 MAC 层逻辑建模为（例如）马尔可夫决策过程（MDP），并使用（例如）强化学习（RL）作为在变化的流量和网络条件下的时序差解决方案来动态解决它。MDP\
  \ 解决方案需要网络节点（作为 MDP 代理）采取正确的传输动作集。RL 为节点提供了即时学习的机会，无需任何先验训练数据。该示例模型允许为异构流量负载、网络拓扑和特定节点优先级提供配置，同时在节点级和网络级性能之间取得正确平衡。利用强化学习固有的实时适应性，还支持对此类异构性和访问优先级的时间变化进行学习调整。结果表明，节点可以学习自我调节冲突，以便在最佳负载条件下获得理论上的最大\
  \ MAC 层性能。对于较高负载，节点学习调整传输概率以减少有效负载，保持低水平的冲突，从而维持最大的 MAC 层性能。\n\nMAC/链路层位于 OSI 第\
  \ 2 层，工作在网络层（OSI 第 3 层）和物理层（OSI 第 1 层）之间，流量负载可能取决于传输方向来自第一层和第三层。然而，AI/ML/DL 驱动 MAC\
  \ 的通用机制与传统的非 AI/ML/DL 驱动网络相同。AI/ML/DL 驱动的 MAC 层的描述如图 15.6](#Ch15.xhtml#fig15_6)\
  \ 所示。\n\n![图 15.6 简化 AI/ML/DL 驱动介质接入协议（MAC）示意图。](img/fig15_6.jpg)\n\n图 15.6 简化 AI/ML/DL\
  \ 驱动介质接入协议（MAC）示意图。\n\nAI/ML/DL 驱动 MAC 的特定特性如下：首先，可以使用马尔可夫决策过程（MDP）作为 MAC 层通用逻辑，利用强化学习（RL）解决问题。RL\
  \ 可以让代理/节点自我调节其个体流量负载，即使在应用级流量负载超过最佳点也能达到并维持理论上的最大吞吐量。第三，可以增强 RL 机制以处理异构流量负载。第四，可以将节点级访问优先级整合到原生学习过程中。第四，MDP\
  \ 公式和 RL 解决方案的核心概念可以用于非全连接网络拓扑。最后，具有 AI/ML/DL 驱动 MAC 的有线/无线节点可以使用更简化的方式运行基础 MAC\
  \ 逻辑，例如不依赖载波监听或其他来自底层硬件的复杂功能。换句话说，开发的机制甚至更适用于发现于低成本无线传感器、物联网（IoT）和其他嵌入式设备中的非常简单的收发器。\n\
  \n人工智能（AI）使机器能够模拟人类大脑智能，并用于优化超越 5G（B5G）MAC。AI 的能力包括自然语言处理、基于知识的决策和感知。ML 是 AI 的子集。ML\
  \ 是 AI 的通用技术，可以直接从信息技术提供的结构化和非结构化数据中学习，而无需显式编程。从标记和未标记数据集学习以进行预测的 ML 技术被称为监督学习。\n\
  \n\n\n\n现有的研究论文针对一种提供去中心化异步并行配置无线通信系统的设备和方法，该系统允许用户进行语音、数据和实时数字视频流的通信，并能够根据需要选择各种通信路径和呼叫带宽。该系统采用了一种新的时分全双工（TSFD）协议进行通信。TSFD\
  \ 协议允许将实时数字视频信号从一个无线设备传输到另一个无线设备。该系统提供本地通信以及指向外部网络的可选链接，且不需要同步的中心化交换中心。它进一步提供了安全运行、紧急通知以及一种从系统中收集收益的方法，并允许控制内部网络的工作运行状态，以及对网络外部系统运行状态的可选远程控制。\n\
  \n介质访问（MAC）协议的空周期由休眠阶段、唤醒阶段和监听阶段组成。MAC 协议通常建议优化唤醒和监听阶段的持续，以增加休眠阶段的时间，从而减少无线节点不必要的能量消耗。在本章中，我们提出了一种基于人工智能（AI）和机器学习（ML）的方法，该方法使用了时分多址接入（TDMA）、位图辅助\
  \ MAC（BMA）和传感器 MAC（SMAC）的混合组合。机器学习层利用 MAC 层中的空周期，并为给定的无线通信生成多个解决方案。AI 层通过在选择函数中引入空周期因子，从生成的解决方案中选择最佳方案，从而优化协议的空周期。所提系统在多次通信中显示出通信速度提升了\
  \ 15%，能耗降低了 10%。我们计划将此工作扩展到印度农村地区，并将其应用于农业应用。\n\n数据采集是无线传感器网络（WSNs）中的一项主要操作，最小化所采集数据的传输延迟对于许多特定操作取决于所需截止日的应用至关重要，例如基于事件的任务关键型应用。诸如时分多址接入（TDMA）等调度算法被广泛用于数据交付，旨在缩短数据传输到汇点的时间。为了最小化\
  \ TDMA 中的平均延迟和平均归一化延迟，我们提出了一种基于遗传算法（GA）的新型高效调度算法（ETDMA-GA）。ETDMA-GA 通过设计的二维编码表示来分配时隙以最小化通信延迟，并使用提出的适应度函数最小化总网络延迟。仿真结果表明，所提算法在平均延迟、平均归一化延迟和平均调度长度方面的性能优于现有的先进方法。\n\
  \n由于水下高速数据传输的需求，水下光无线通信（UOWC）网络在许多民用和工业应用中具有前景。本章专注于 UOWC 网络分布式时分多址（TDMA）协议的设计。与现有研究不同，我们关注更通用的水下通信场景，其中节点分散且考虑了节点移动性。我们提出了一种基于分布式\
  \ TDMA 的介质访问（MAC）协议，称为基于簇的跨层多隙 MAC（CCM-MAC），它可以根据时隙占用信息为每个节点分配多个时隙。使用 CCM-MAC 时，网络被划分为簇。每个节点通过路由技术维护簇拓扑和周围节点的时隙占用信息；通过更新这些知识，还可以动态检测并消除冲突。通过分析结果来评估\
  \ CCM-MAC 的性能，仿真结果验证了其与现有基于竞争的 MAC 协议相比的优势。\n\n## 15.3 AI 赋能的网络层\n\n网络层负责控制子网络/网络的操作。网络层协议的关键功能是数据包如何从源路由到目的地，而目的地可能连接在距离源端许多跳的子网络/网络上。需要使用标准的网络路由协议（例如，开放路径优先（OSPF）、边界网关协议（BGP）等），这些协议决定下一跳网络节点位于目标节点路径的最佳位置，并解析目的地的网络层地址。此外，路由协议、组播组管理、网络层信息和错误以及网络层地址分配都是网络层的功能。注意，是负载的功能使得这些属于网络层，而不是承载它们的协议的功能。\n\
  \n网络是复杂的交互系统，涉及云操作、核心和城域传输以及移动连接，一直延伸到视频流和类似的用户应用程序。由于本地化和高度工程化的操作工具，这些网络在任何更改、升级或服务部署后需要几天到几周才能生效，这是常态。使用\
  \ `OSPF` 路由时，在提供服务质量（QOS）保障后，所有数据包将通过通过相同路径交付，因为它无法执行多路径路由，这将浪费其他链路的资源并导致网络拥塞。\n\
  \n行业传统上依赖于以硬件为中心的创新，并继续取得成功——例如通过光子集成、石墨烯、空间分分复用、使用多域光网络并涵盖核心、城域和接入网络。不同的网络段通常需要协同工作以支持多层服务和应用，无论是直接还是通过混合无线/有线基础设施。注意，光网络及其路由属于链路层（OSI\
  \ 第 2 层），而越际协议（IP）网络上的 `OSPF` 路由属于网络层（OSI 第 3 层）。然而，路由过程是相同的，为了简单起见通常指的是 OSI 第 3\
  \ 层。这种多样化、动态且复杂的网络栈结构，加上未来的移动性限制，需要使用 AI/ML/DL 算法的智能端到端面向服务的软件框架来增强传统的硬件进步。6–7]\n\
  \nAI/ML/DL 算法的特征是能够从过去的数据中学习系统行为并根据学习到的系统模型预测未来的响应。随着计算硬件和并行计算的近期改进，AI/ML/DL 赋能的多路径路由以及动态\
  \ QOS 配置等功能可以轻松实现。\n\n基于 AI/ML/DL 的路由模块构建表示流量矩阵向量和路由解决方案向量的元组序列。启发式模块计算启发式路由解决方案并将其返回给数据采集和结果报告模块以及数据集仓库。\n\
  \n\n\n\n数据仓库中的元组集通过数据分析和训练管理模块识别，用于训练基于 ML 的路由模块。例如，在监督学习中，前馈深度神经网络（`DNN`）学习一种映射函数，该函数能够将输入流量矩阵最佳地映射到多路路由输出，并根据先验的标记训练数据集实现最佳匹配。一旦学习了该映射函数，基于\
  \ AI/ML/DL 的路由模块就能实时计算路由方案的估计值，即具有适当流量分布以满足 QOS 约束的多路路由。\n\n所提出的基于 AI/ML/DL 的多路路由模块基于算法运行，例如前馈深度\
  \ `DNN`。多路路由输出的小数分值使得深度学习结构成为一个多输出回归模型。`DNN` 可能由多个全连接层组成，其中假设包含两个隐藏层、一个输入层和一个输出层。在两个隐藏层中都可能应用丢弃（dropout）技术，以增强模型对过拟合的鲁棒性。此外，还采用了自适应动量估计（如\
  \ `Adam` 优化算法）来训练深度神经网络并最小化预测均方误差（`MSE`）。简化的启用 AI/ML/DL 的多路路由示意图如图图 15.7 所示。\n\n\
  ![FIGURE 15.7 启用 AI/ML/DL 的多路路由示意图。](img/fig15_7.jpg)\n\nFIGURE 15.7 启用 AI/ML/DL\
  \ 的多路路由示意图。\n\n在初始化期间，输入模块（或数据采集和结果报告）从路由器收集网络状态和流量矩阵，并转发到基于启发式的启用 AI/ML/DL 的路由模块。基于启发式的\
  \ AI/ML/DL 模块（例如深度神经网络 `DNN`）计算基于启发式的多路路由方案，并结合每条路径的分流量返回多路路由输出模块。然而，在 `DNN` 初始化多路路由计算之前，`DNN`\
  \ 需要通过数据分析使用足够的已知标记路由流量进行训练。这可以通过离线或在线方法完成。\n\n一旦 `DNN` 训练完成，基于 AI/ML/DL 的路由模块开始生成路由方案并将其报告给数据采集和结果报告模块，后者将其转发到路由器。在此阶段，从基于启发式的路由模块接收的路由方案仅用于更新数据仓库，只有从基于\
  \ AI/ML/DL 的路由模块接收的方案会被实时转发到路由器。`DNN` 的设计可以在多次尝试错误实验后确定。可能会考虑各种设计版本，直到在训练和测试评估中均获得最佳性能。性能评估表明，在信令开销、网络延迟和吞吐量方面，启用\
  \ AI/ML/DL 的多路 OSPF 相比传统的单路开放最短路径优先（`OSPF`）协议展现出了大为前景的改进。\n\n简而言之，启用 AI/ML/DL 的路由功能的整个过程（例如启用\
  \ AI/ML/DL 的多路-OSPF）保持不变。通过为任何应用选择特定参数（例如 `OSPF`），我们可以通过对对 `OSPF` 路由适当地地调整算法，使其成为启用\
  \ AI/ML/DL 的多路路由。最后，我们预见了智能物理层和智能网络层的前景。随着 AI 持续整合到光物理和电磁学领域，衍生的 `IRS`、超材料、超表面、超透镜和光计算将进一步驱动\
  \ IVLC 的发展。光计算和光神经网络将成为发展的重点。由于 IVLC 可能在 6G 中大规模部署，基于电的数字信号处理将消耗大量能量。使用光计算将大幅降低消耗。分布式信道均衡结合了现有通信系统和神经网络的多层机制，这将是快速部署\
  \ IVLC 的有效手段。在网络层，AI 的主要作用将减少人工干预。它可以通过智能学习实现更好的资源调度和安全性。希望这将是对智能可见光通信的彻底研究，并为未来\
  \ 6G 网络中大规模部署可见光通信提供实践指南。\n\n## 15.4 AI 赋能传输网络层\n\n位于会话层（第 5 层）和网络层（第 3 层）之间的传输层基本功能是接受会话层的数据，然后根据网络层的允许将其分成较小的包，并传递到网络层，同时确保数据包能够正确到达（对于\
  \ `IETF` 等标准化的传输控制协议 `TCP` 等面向连接的传输协议）。这意味着给定链路的可靠性由传输层通过流量控制、分段和重组以及错误控制来控制。对于使用的无连接传输协议（例如\
  \ `IETF` 等标准化的用户数据报协议 `UDP`），数据包的可靠性服务通过某些私有机制推送到上层应用层，传输层也不提供流量控制。\n\n`TCP` 在网络上的运行对于频繁传输大文件是非优的，特别是会导致队列延迟和丢包的网络性能下降。预测\
  \ `TCP` 不同性能指标的解决方案（如吞吐量或丢包预测）主要集中在两种方法：基于公式的和基于历史的。基于公式的方法使用数学表达式将预测变量与路径和端点属性（如往返时间\
  \ `RTT` 或接收窗口大小）联系起来。大多数情况下，属性的测量是通过不同的主动或被动网络工具收集的。\n\n另一方面，基于历史的方法根据之前文件传输的测量值（通过被动地监控链路或主动地进行不同大小的文件传输）产生所需属性（例如丢包）的时间序列预测。尽管在某些\
  \ `TCP` 性能方面，基于历史的方法比基于公式的预测更准确 [3]，但现有解决方案主要关注预测网络吞吐量。然而，这些方法都无法准确预测端端丢（表现为高能科学应用流和网络吞吐量中的重传包数量），从而使\
  \ `TCP` 能够控制包的传输和重传。\n\n启用 AI/ML/DL 的 `TCP` 可以自动构建丢分类器来预测端端丢（表现为任意大小科学流中的重传包数量、队列延迟、端端往返延迟和网络吞吐量）。它不仅考虑基于公式和基于历史的方法，还会考虑之前数据传输的路径和属性测量测量\
  \ [8–9]。机器学习算法如 `随机森林回归`、`决策树提升` 等。简化的启用 AI/ML/DL 的 TCP 传输协议示意图如图图 15.8 所示。注意，整个\
  \ AI/ML/DL 过程仍然与图 15.8](#Ch15.xhtml#fig15_8)所示的相同。\n\n\n\n\n\n**图** **15.8** 简化的基于\
  \ AI/ML/DL 的 TCP 传输协议原理图。\n\n由于重传大部分是由所选路径沿线的物理丢失以及端主机网络调优不当引起的，模型中需要考虑端主机属性（例如\
  \ TCP 最大分段大小）与路径相关测量值（例如往返时间）的不同组合。收集的特征测量值数量可能非常多，这将导致解决方案过于泛泛化，并增加计算开销。然而，本文选择了以下特征集：TCP\
  \ 最大分段大小、平均往返时间、文件大小、流时长、吞吐量、源 IP 地址、目的 IP 地址以及 TCP 初始拥塞窗口。\n\n使用此类分类器后，改进后的协议将如下运行：每当通过三次重复包检测到丢失时，其原因将由分类模型确定。如果丢包/端到端丢包被分类为由于拥塞引起，发送端将照常进行（即将其拥塞窗口除以\
  \ 2）。如果端到端丢包是因为高能科学应用的重传，则允许高能科学应用的科学家和网络操作人员通过不同的主机或流重配置技术来缓解丢包。否则，它将保持拥塞窗口不变。这种端到端方法的优势在于它们不需要网络的支持，因此在实践中可以更容易部署。\n\
  \n支持 AI/ML/DL 的 TCP 显示出无线网络中带宽利用率显著提高，且在传统有线网络中没有劣化。预测器显示出较低的训练时间，并对任意大小数据传输的包重传提供准确估计（97–99%）。结果还表明，如果训练和测试数据集具有相似的统计特性，我们的解决方案能够很好地预测未见过数据的重传行为（66%）。\n\
  \n## 15.5 AI 支持的中间件层\n\n会话层允许不同计算机/机器上的用户之间建立会话并控制对话。它建立、管理并终止本地与远程应用程序之间的连接。它提供了全工/半双工或单工操作等功能，并建立了检查点、挂起、重启和终止会话的程序。注意，不包含会话层的互联网协议栈中，面向连接的传输协议（例如\
  \ `TCP`）的会话挂起和关闭功能与下层传输层（第 4 层）合并，因为 `TCP` 会建立会话（OSI 第 5 层）。音频/视频编码属于表示层（OSI 第 6\
  \ 层）。同样，其他应用程序如消息格式转换也属于会话层。在实践中，这两层通过中间件层（OSI 第 5 和 6 层）结合，因为会话层的功能元素支持位于应用层（OSI\
  \ 第 7 层）的应用程序，所有这些中间件功能可以相互使用以组合复杂功能，而无需遵循我们在 OSI 层中看到的协议层层次。\n\nAI/ML/DL 成为一种重要的新的资源密集型工作负载，已成功应用于计算机视觉、语音、自然语言处理等。分布式深度学习已成为应对日益增长的数据和模型的需求。其计算特征通常是：使用简单的张量数据抽象来建模多维矩阵、用于建模计算的数据流图，以及带有较频繁同步的迭代执行，这使得它与\
  \ map/reduce 风格的分布式大数据计算有本质区别。\n\n远程过程调用 (`RPC`) 通常用作通信原语，已被 `TensorFlow` 等流行的深度学习框架采用（后者使用\
  \ `gRPC`）。我们证明 `RPC` 对于分布式深度学习计算是次优的，特别是在支持远程直接内存访问 (RDMA) 的网络上 [10]。张量抽象和数据流图结合\
  \ `RDMA` 网络，提供了在不牺牲可编程性和通用性的情况下减少不必要的开销（例如内存拷贝）的机会。\n\n从数据访问点的角度来看，远程机器被被抽象为 `RDMA`\
  \ 通道上的一个“设备”，具有简单的内存接口，用于分配、读取和写入内存区域。我们的图分析器同时查看数据流图和张量，利用此接口优化内存分配和远程数据访问。结果相比于针对\
  \ `RDMA` 优化的 `RPC` 实现提升了高达 169%，导致训练过程中的收敛更快。\n\n## 15.6 AI 支持的会话层\n\n远程过程调用 (`RPC`)\
  \ 是一种中间件协议，是客户端-服务器交互的形式（调用者是客户端，执行者是服务器），通常在分布式环境中通过请求-响应消息传递系统实现。当一个程序导致过程（或子程序）在不同的地址空间中执行（通常在共享网络上的另一台计算机上）时，该计算机程序会启动\
  \ `RPC`。`RPC` 的编码就像普通的（本地）过程调用一样，程序员不需要显式地编写远程交互的细节。\n\n然而，`RPC` 对于分布式深度学习计算是次优的。这是因为\
  \ (i) 深度学习计算使用张量（或多维矩阵）作为主要数据类型，它由作为张量数据的原始字节数组和作为指定张量形状和元素类型的元数据的简单模式（schema）组成。张量通常具有足够的大小（几十\
  \ KB 到 MB），且其元数据/数据大小通常是静态的。使用 `RPC` 进行张量数据传输在可编程性或效率上没有提供明显的优势；(ii) 使用 `RPC` 通常涉及在\
  \ `RPC` 管理的通信缓冲区内存区域与已知区域之间进行内存拷贝。\n\n一个简单且几乎微不足道的接口从数据访问点的角度将远程机器暴露为一个“设备”。该“设备”通过支持\
  \ AI/ML/DL 的 `RPC` 通道 [10]–11] 连接，该通道暴露了并行控制。远程内存可以通过此“设备”接口进行分配和直接访问，类似于本地 `GPU`。这自然地映射到提供直接内存访问的底层\
  \ AI/ML/DL `RPC` 网络。\n\n基于 AI/ML/DL `RPC`，直接在“设备”接口上设计了零拷贝跨机器张量传输机制。这是通过对计算的数据流图进行静态分析和动态追踪实现的，以：(i)\
  \ 得出跨服务器传输每个张量的大小是否可以在编译时静态已知，(ii) 评估此类张量应静态分配（以获得更高效率）还是动态分配（以减少内存占用），(iii) 确保在发送端和接收端的\
  \ AI/ML/DL `RPC` 内存区域分配张量，(iv) 识别 AI/ML/DL `RPC` 传输的张量源地址。实验表明，与针对 AI/ML/DL `RPC`\
  \ 优化的 `RPC` 实现相比，这些技术帮助 TensorFlow 在代表性的深度学习基准测试中实现了高达 169% 的提升。AI/ML/DL `RPC` 的流程仍然与图\
  \ 15.8 以及 OSI 层 2、3 或 4 中描述的相同。\n\n## 15.7 AI 支持的表示层\n\n\n\n\n传统的音频编码技术通常利用人类对声音的感知（即心理声学），在保持解码后音频信号感知质量的同时降低比特率。例如，支持\
  \ AI/ML/DL 的音频编码可以解码出在感知上与参考信号更相似的信号，但其模型复杂度要低得多 \\[12–13\\]。所提的损失函数包含了全局掩蔽阈值，允许重建误差对应于不可听的伪影。实验结果表明，所提模型的性能优于规模是基准神经编码器的两倍，且每秒比特数高出\
  \ 23.4%。通过所提的方法，这种仅具有 900 万参数的轻量级神经编码器实现了近乎透明的音频编码，与 112 kbps 下的商业 MPEG-1 Audio\
  \ Layer III 编码器相当。我们没有展示这些细节，因为支持 AI/ML/DL 的音频编码过程仍与之前描述的相同（图 15.8 和 OSI 第 1 层）。\n\
  \n## 15.8 AI 驱动的应用层\n\n应用层是终端用户直接与软件应用程序交互的层。OSI 标准并没有定义这一层，而是将其留给市场，根据全球客户推动的市场需求，通过竞争手段开发智能且具有增值的应用程序和业务。当然，在国际标准论坛中，有机会将某些应用层协议标准化，例如用于电子邮件的简单邮件传输协议\
  \ (`SMTP`）、用于基于 IP 的语音/多媒体（VoIP`）的会话建立协议 (`SIP`）、用于文件传输的文件传输协议 (`FTP`) 以及等。这意味着，在标准应用层协议之上构建的增值服务是巨大的，因此需要多厂商环境中的互操作产品，以降低构建可扩展全球通信网络的成本。更准确地说，应用层中可能存在许多与应用实体和应用本身不同的构建块。例如，应用层功能通常包括识别通信双方、确定资源可用性以及同步通信。这里列举了一些\
  \ AI 驱动应用的示例：\n\n*   诸如 `Siri` 和 `Alexa` 之类的虚拟助手\n*   电子商务平台中使用的推荐系统\n*   金融机构的欺诈检测\n\
  *   自动驾驶车辆\n*   用于聊天机器人和客户服务的自然语言处理 (NLP)\n*   安全系统中的图像和人脸识别\n*   医疗诊断和保健系统\n\n\
  我们可以提供一个网络安全应用如何支持 AI/ML/DL 的示例。在这个示例中，我们详细考虑了许多之前没有展示的内容，因为因为涉及大量的函数。其中一个示例是使用应用程序编程接口\
  \ (`APIs`)，假设某个特定功能需要从仓库中检索。如图 15.9 所示，`APIs` 是实现此点的最佳方法之一。\n\n![图 15.9 使用自然语言处理\
  \ (NLP) AI 应用实现的 AI/ML/DL 网络安全](img/fig15_9.jpg)\n\n图 15.9 使用自然语言处理 (NLP) AI 应用实现的\
  \ AI/ML/DL 网络安全。\n\n用户正在使用自然语言处理 (`NLP`) AI 应用调用机器人，以了解有关网络攻击的细节。图 15.9 显示了所有自足其义的步骤，在此不再重复。重要点是，使用\
  \ `NLP` 解析用户命令涉及许多复杂性，而 `API` 是检索适当函数以执行下一步的最佳方式。我们看到，需要如表达式、意图、实体、对话、动作和声明函数等步骤来满足用户命令。图\
  \ 15.10 显示了如何找到能够满足用户命令函数的特定 `API` 的详细步骤。\n\n![图 15.10 通过调用 ML/DL 算法由 NLP AI 应用支持的网络安全应用](img/fig15_10.jpg)\n\
  \n图 15.10 通过调用 ML/DL 算法由 NLP AI 应用支持的网络安全应用。\n\n知识图谱 (`KG`) 和知识库 (`KB`) 是两个重要的功能性实体。最后，调用\
  \ ML/DL 函数来寻找必要的参数等内容。我们需要注意的是，支持 AI/ML/DL 的网络安全的基础训练阶段和检测阶段将保持与我们在图 15.8 中描述的相同。然而，我们发现网络安全之外还有额外的\
  \ AI 应用，例如 `NLP`。`NLP` 应用本身是一个巨大的过程，并使用了与图 15.8 中描述相同的流程。这次，基于 AI 的 `NLP` 和网络安全应用都需要训练，然后它们将用于预测。这表明，实现支持\
  \ AI/ML/DL 的网络安全需要巨大的处理复杂性。\n\n用于安全分析的海量数据处理和操作已给无线和非无线网络带来严重的信息过载。当移动战斗场景需要处理大数据数据时，情况变得更加棘手。\n\
