  \ MILCOM, 2019。\n\n\n\n\n\n21 世纪正见证着一场剧烈的变革，人工智能（AI）的成功应用在理论和技术的共同推动下，塑造了赋有 AI 能力的产品和通信网络服务，包括网络安全。然而，其跨学科和快速增长的特征使得\
  \ AI 成为一个难以通过通用架构集成 AI 能力和网络化能力的领域。国际标准化组织（`ISO`）和国际电信联盟（`ITU`）等开放公共标准已经汇集了全球巨大的团队来开发\
  \ AI 标准，但要制定解决高度技术复杂性的 AI 标准还需要多年时间。与此同时，几乎所有学科的产品都在被开发并用于服务。在过去的几年里，我们分析了许多已发表的研究论文和厂商的专有产品。这一创新性的章节描述了通用以网络为中心的架构如何使每种“遗留”能力（包括网络安全）具备\
  \ AI 能力、AI/机器学习（ML)/深度学习（DL）能力以及网络化（或网络功能）。我们考虑了开放系统国际（`OSI`）层协议架构，用于开发 AI/ML/DL\
  \ 通用基础设施，其中网络中现有的遗留协议保持不变。所提出的基础设施将为共享相同的“通用”AI/ML/DL 平台资源提供扩展性，并在多厂商环境中使用专有产品时通过应用程序接口（`API`）实现某种程度的互操作性，从而实现规模效应。\n\
  \n## 16.2 人工智能与跨学科应用\n\n网络安全、作战、商业、DNA（脱氧核糖酸）测序、医疗、健康保健、高能物理、化学、生物测量学[1]）、电影、电视、实时高质量音视频会议、天文学、铁路、交通、交通控制、机器人、行星际旅行/漫游器、自动驾驶汽车、酒店服务、金融与银行、法律服务、食品农工制造业、大数据以及所有其他学科的跨学科应用，这些领域已经开始或正准备使用人工智能。换句话说，所有这些应用都将具备\
  \ AI 能力。`ISO` 和 `ITU` 一直致力于创建 AI 标准，将 AI  专业知识引入全球。考虑到所有跨学科应用，涉及的 AI 项目极其众多。`ISO`\
  \ 和 `ITU` 需要数十时间来开发更新的 AI 通用标准，这些标准将具有更现代、更简单、更智能的通信协议，但在后端拥有海量计算。\n\n与此同时，我们调查了市场上大量与\
  \ AI 相关的与“现有”遗留网络协议结合的研究出版物和新兴厂商产品。我们分析了 `OSI` 协议层，研究如何将 `OSI` 模型应用于 AI/ML/DL。首先，前述的跨学科应用主要属于\
  \ `OSI` 应用层（`OSI Layer 7`）。其次，观察到所有现有的遗留应用都是通过一组核心 AI 应用实现了 AI 能力化。第三，每个应用的功能集可能是巨大的，例如从几百到数百万个。第四，预处理、特征选择、特征分类和评估需要使用\
  \ `ML/DL` 算法/模型进行高度计算密集型的复杂数学分析。第五，每个 AI 能力应用程序的 AI 代理都会调用一个或多个 AI 应用；反之，AI 应用调用\
  \ `ML/DL` 算法/模型进行预处理、特征选择、特征分类和评估。第六，与 AI 一样，`ML/DL` 有一组核心算法/模型，它们可以响应具备 AI 能力的现有遗留应用的特定需求。第七，行业内正在开发许多开源\
  \ AI/ML/DL 工具，全球数百万用户正在使用。第八，不仅是现有应用，从 `Layer 1` 到 `Layer 7` 的每个 `OSI` 层的每个能力都可以具备\
  \ AI 能力。最后，从 `Layer 1` 到 `Layer 7` 的 `OSI` 层通过五到实现了网络中心。\n\n## 16.3 通用 AI/ML/DL\
  \ 通信基础设施\n\n`OSI` 层协议栈 [1] 为通信网络提供了卓越的服务。开放标准几十年来促进了互操作性。\n\n| OSI 层 | 名称 | 描述 |\n\
  | :--- | :--- | :--- |\n| Layer 7 | 应用层 | 具备 AI 能力的应用 |\n| Layer 6 | 会话层 | AI/ML/DL\
  \ 平台 |\n| Layer 5 | 表示层 | |\n| Layer 4 | 传输层 | 具备 AI 能力的传输层 |\n| Layer 3 | 网络层 |\
  \ 具备 AI 能力的网络层 |\n| Layer 2 | MAC/链路层 | 具备 AI 能力的 MAC/链路层 |\n| Layer 1 | 物理层 | 具备\
  \ AI 能力的物理层（信号处理） |\n\n图 16.1 OSI 层模型与通用 AI/ML/DL 平台\n\n然而，这些遗留的标准协议既不具备 AI 能力，也不基于\
  \ AI。开发包括网络安全在内的跨学科 AI 通用标准的延迟，导致厂商开发了自己的专有产品，造成了不可互通的产品和服务的孤岛。我们分析认为，作为中间件（`OSI\
  \ Layers 5 and 6`）的通用 AI/ML/DL 基础设施或平台被用于使通信应用具备 AI 能力。“中间件”是一个模糊的术语，因为标准机构本身并未对其定义。在构建应用程序软件的十年经验中，许多许多软件可以重复用于构建另一组增值应用，反之亦然。行业已经开发了许多著名的中间件。\n\
  \n同样，我们看到一组核心 AI 应用和 `ML/DL` 算法/模型可以重用，使每个 `OSI` 层的每个能力具备 AI 能力或 AI/ML/DL 能力，并最终基于\
  \ AI。这就是为什么我们在图 16.1 中展示通用 AI/ML/DL 基础设施或平台属于中间件（`OSI Layers 5 and 6`）。作为中间件使用的核心通用\
  \ AI 应用集如下：\n\n*   自然语言处理（`NLP`）平台（内容提取、分类、机器转换、问答和测试关联）\n*   专家系统平台\n*   知识库（`KB`）\n\
  *   本体论\n*   视觉平台（图像处理/机器视觉）\n*   语音平台（文本转语音/语音转文本）\n*   机器人平台\n\n同样，属于中间件的核心 `ML/DL`\
  \ 算法/模型集（图 16.1）如下 [2–3\\]：\n\n*   **信号/数据预处理：** 去噪；分词；停用词；大小写转换；俚语和缩写；拼写纠错；词干提取；词形还原等。\n\
  \n\n\n\n\n- **语法词表示**：`N-Gram` 和 `Syntactic N-Gram`；加权词：`Bagof-Words` (`BoW`)/`Beg-of-Feature`\
  \ (`BoF`)；`词频-逆文档频率` (`TF-IDF`)；`词嵌入-词向量` (`Word2Vec`)：`Continuous Bag-of-Words\
  \ Model` 和 `Continuous Skip-Gram Model`；`词表示全局向量` (`GloVe`)；`词嵌入-上下文词表示`；等。\n\n\
  - **成分分析**：`主成分分析` (`PCA`)、`独立成分分析` (`ICA`)；`线性判别分析` (`LDA`)；`非负矩阵分解`；`随机投影`：`Random\
  \ Kitchen Sinks`、`Johnson–Lindenstauss Lemma`；`自动编码器`：`Conventional Autoencoder\
  \ Architecture` 和 `Recurrent Autoencoder Architecture`；`t 分布随机邻嵌入` (`t-SNE`)；`置信网络`；等。\n\
  \n- **逻辑回归 (`LR`)**：`朴素贝斯分类器`；`K 近邻` (`KNN`)：`权重调整 K 近邻分类`；`支持向量机` (`SVM`) 设计树；`随机森林`；`神经调优机`\
  \ (`NTM`)，等。\n\n- **深度神经网络**：`循环神经网络` (`RNN`)：`长短期记忆` (`LSTM`) 和 `门控循环单元` (`GRU`)；`传统卷积神经网络`\
  \ (`CNN`)；`深度置信网络` (`DBN`)；`分层注意力网络` (`HAN`)；`随机梯度下降` (`SGD`) 优化器；`Adam 优化器`、`循环卷积神经网络`\
  \ (`RCNN`)；带 `LSTM` 的 `CNN` (`C-LSTM`)；等。\n\nAI/ML/DL 算法/模型的性能通过通过以下模型进行评估，这些模型也属于中间件，如图\
  \ 16.1；`受试者工作特征` (`ROC`) 以及`受试者工作特征曲线下的面积` (`ROC`) Curve (`AUC`)。\n\n我们将 ML/DL 算法/模型分为若干松散组\
  \ (a) 到 (f)。通常，组 (a) 适用于数据清洗和预处理。组 (b) 似乎适用于特征提取，而组 (c) 适用于降维。然而，组 (d) 和 (e) 用于特征分类。组\
  \ (e)属于主要使用多层神经网络的 DL 算法。然而，这种分组并不是限制，因为某一组的算法也可以用于其他组的功能。最后，组 (f) 用于 AI/ML/DL 算法/模型的性能评估。\n\
  \n启用 AI 的应用程序（例如网络安全）有一个 AI 代理，它根据应用程序的需求（例如网络安全）调用一个或一组核心 AI 应用。对于网络安全，用户可能需要知道网络攻击何时（时间）以及何地（地点和功能实体/资源）在网络中发生，并向\
  \ AI 机器人（即 AI 代理）发出的语音命令（例如，调用 `NLP` AI 应用）。相反，`NLP` 将调用相应的 ML/DL 算法/模型来处理用户命令以获得答案。答案可能意味着网络攻击发生在通信网络中的何时（时间）和何地（资源）的预测。整个\
  \ AI/ML/DL 过程可以概括为（另见图 7.2）：预处理、特征提取、降维、分类/预测和评估。可解释 AI (`XAI`) 和基于反思因果推理 (`CI-R`)\
  \ 的 ML/DL 正在作为新的 AI/ML/DL 技术兴起。\n\n\n\n\n\nML/DL 算法/模型可以被许多不同的应用程序使用。然而，参数值（即特征）以及用于解释结果的用法将根据具体的应用而完全不同。预测结果将针对各自的应用具有很特殊性。为了简洁起见，我们没有详细讨论比较不同应用的结果评估。\n\
  \n请注意，我们没有专门描述 AI/ML/DL 算法/模型的训练（另请参阅图 7.2）。在训练过程中，使用已知应用程序的已知且已标记数据，以便模型能够预测该应用程序的实际结果（例如，针对不同类型的网络安全攻击，损失参数超过了特定阈值），而在实际现实应用中，则使用未知且未标记的数据作为预测的输入。训练数据至关重要，因为预测的好坏取决于训练数据的质量。\n\
  \n## 16.4 AI/ML/DL 网络架构\n\n我们发现，驻留在后端的通用 AI/ML/DL 基础设施可以为所有 OSI 层提供服务，使每个 OSI 层的各项能力（包括网络安全）都\
  \ AI AI。因此，我们可以使用相同的通用 AI/ML/DL 平台来提供 AI 能力的服务。图 16.2 展示了客户端和服务器的通用 AI/ML/DL 基础设施逻辑网络架构的高层概念视图，其中\
  \ AI/ML/DL 平台服务器在逻辑上为客户端和服务器提供相同的通用服务，以使每个 OSI 层的各项能力分别实现 AI 化。\n\n![FIGURE 16.2\
  \ 通用 AI/ML/DL 基础设施逻辑网络架构高视图，使旧客户端和服务器实现 AI 化](img/fig16_2.jpg)\n\nFIGURE 16.2 通用\
  \ AI/ML/DL 基础设施逻辑网络架构高视图，使旧客户端和服务器实现 AI 化。\n\n重点在于，供应商正在分别对不同层的能力进行 AI 化，并创建了各个孤岛，而没有重复任何通用\
  \ AI 能力（例如，相同的算法但根据不同应用的能力需求使用不同的超参数）。因此，现有的 AI 解决方案缺乏扩展性。基于逻辑网络架构，图 16.3 显示了高层网络实现架构。服务器群中的所有旧服务器都通过通用的\
  \ AI/ML/DL 平台服务器实现了 AI 化，而无需替换现有的旧软件或硬件。\n\n![FIGURE 16.3 实现 AI 的旧客户端、服务器、场所、局域网和骨干网络](img/fig16_3.jpg)\n\
  \nFIGURE 16.3 实现 AI 的旧客户端、服务器、场所、局域网和骨干网络。\n\n关键在于，所有的原始通信协议和信号处理都可以增强和优化，创建新的轻量级智能协议和信号处理方案，允许客户端和服务器的后端通用\
  \ AI/ML/DL 基础设施服务器进行高强度复杂计算（类似于云/边缘计算）。如果这些协议利用 AI/ML/DL 能力重新设计，则需要标准机构制定新的标准，以替换现有的旧标准协议，如图\
  \ 16.4 所示。\n\n![FIGURE 16.4 基于 AI 的网络上的服务器与客户端通信](img/fig16_4.jpg)\n\nFIGURE 16.4\
  \ 基于 AI 网络上的服务器与客户端通信。\n\n正如我们之前解释过的，从标准机构获得这些新协议标准可能需要十年或更长时间。当然，我们正在向标准机构提供这些新见解，即如何使用通用\
  \ AI/ML/DL 平台创建一套新协议以简化标准的制定。然而，在此期间，我们提供了一种解决方案，为客户端和服务器提供通用 AI/ML/DL 基础设施服务（图\
  \ 16.2 和 16.3），使每个 OSI 层的各项能力（包括网络安全）实现 AI/ML/DL 化。\n\n这意味着所有现有协议对外部（包括网络安全）保持不变，但\
  \ AI/ML/DL 服务将作为后端服务，处理每个 OSI 层每个协议的各项能力，以使这些能力实现 AI 化。通过这种方式，目前在互联网和/或战斗网络上使用旧协议的互操作性得以完好保留。\n\
  \n显然，这种配置提供了巨大的规模经济，因为任何现有的旧应用程序服务器都不需要配备 AI/ML/DL 平台特定的硬件和/或软件，从而避免了在每个服务器或客户端中不必要的重复高成本。如果应用程序服务器是从不同的供应商采购的，可以使用通用的\
  \ AI/ML/DL 平台应用程序接口（`API`）在多供应商环境中提供互操作性。在每个客户端侧（即 AI 设备），对于所有 OSI 层，都可以使用相同的通用\
  \ AI/ML/DL 基础设施，如图 16.2 和 16.3 所示，用于设计智能手机、智能笔记本电脑和其他 AI 设备等客户端设备。\n\n## 16.5 使用通用\
  \ AI/DL 基础设施的端到端 AI 化 OSI 层\n\n本节的描述与第 15 节解释的内容类似，我们在此处端到端网络的背景下简要回顾。OSI 第 1 层到第\
  \ 7 层的所有现有应用程序（图 16.1、16.2 和 16.3）都可以使用第 16.3](#Ch16.xhtml#sec16_3)节和第 16.4](#Ch16.xhtml#sec16_4)节描述的相同\
  \ AI/ML/DL 基础设施实现 AI/ML/DL 化。如图 7.2](#Ch07.xhtml#fig7_2)所示，每个 OSI 的整体 AI/ML/DL 处理技术保持不变。物理层负责在通信链路或通道上传输和接收原始比特。物理层链路/通道物理可以是有线的或无线的。流量复用、调制方案、数据速率、信道接入方法、物理连接器、单工、全/半双工、定时、频率、电压电平等都是物理层的功能[4]。有趣的是，如果解调器利用图\
  \ 7.2](#Ch07.xhtml#fig7_2)所示的过程（信号采集、预处理、特征提取、特征分类和预测/决策）实现 AI/ML/DL 化，其基本功能将保持不变，但其性能（如比特错误率\
  \ `BER`）将几乎可以忽略不计，且信道容量将接近标准的香农信道容量。\n\n卷积神经网络（`CNN`）和残差神经网络在具有无线通道物理知识的情况下达到了 80%-90%\
  \ 以上的准确率。注意，AI/ML/DL 的过程保持不变，但从通用算法/模型软件库中选择特定信息对特定信号/数据进行训练时，需要针对物理层（OSI 第 1 层）的特定信号/数据对其参数进行调。最后，通信通道上基于\
  \ AI/ML/DL 的调制器的简化表示如图 15.3 所示，作为一个示例。\n\n\n\n\n\n我们现在可以认为，物理调制解调设备可以设计为带有特定 AI/ML/DL\
  \ 嵌入硬件的独立硬件。另一种方案是为所有 OSI 层（第 1 到第 7 层）提供通用的 AI/ML/DL 计算过程，并集成到手机、战士电台波形电台和应用服务器等设备中（参见图\
  \ 16.2 和 16.3）。\n\n有线/无线网络中的`介质访问控制`(MAC）协议具有多个级别的异构性。目前在嵌入式无线节点中编写 MAC 逻辑的最佳实践，是根据可用的底层硬件支持，实现已知协议如\
  \ `ALOHA`、`Slotted-ALOHA`、`载波检测多接入 (CSMA)` 以及带有冲突避免的载波检测多接入 (CSMA-CA)`（即 `Wi-Fi`\
  \ 等）。例如，当没有载波检测能力的节点运行 `ALOHA` 系列协议时 [5]，一旦网络中的应用流量负载超过最佳水平，其性能就会因冲突而开始下降。在存在`确认\
  \ (ACK)`、`无确认`、`分片/聚合`、`分片阈值`、`退避`、`发送请求/清除发送 (RTS/CTS)`、`网络分配矢量 (NAV)`、`NAV 超时`、`竞争窗口\
  \ (CW)`、`流量负载`、`拓扑`以及`特定节点访问优先级`等多种形式的异构性时，这些问题变得更加复杂。\n\n这种性能差距的重要原因是，节点的协议逻辑无法感知随变化的负载状况以及此类异构性。支持\
  \ AI/ML/DL 的 MAC 允许无线节点学习如何检测此类情况，并实时更改传输策略以最大化网络性能，即使在特定节点访问优先级的情况下也是如此。AI  MAC\
  \ 协议可以通过两种方式进行增强：在不修改现有遗留 MAC 协议的情况下实现性能的小提升，以及通过创建新的 MAC 协议来优化性能。后者需要几十年才能标准化，而前者现在就可以完成，且\
  \ `API` 将在多厂商产品环境中提供互操作性。\n\n支持 AI/ML/DL 的 MAC 有线/无线节点可以使用更简化的功能来运行新的原始 MAC 逻辑 [5]，例如在未来标准化后，不再依赖载波检测以及不再依赖底层硬件的其他复杂功能。换句话之，开发的机制甚至更适用于低成本无线传感器、`物联网\
  \ (IoT)` 和其他嵌入式设备中非常简单的收发器。因为机器学习算法允许网络节点单独调整发送概率，从而在不向 MAC 协议本身嵌入任何此类功能的情况下减少自冲突和节点间冲突。因此，当基于\
  \ AI 的协议标准化时，节点可以达到理论最大吞吐量并在较高负载条件下维持该吐量（图 16.4）。然而，对此的详细讨论超出了本书的范范围。\n\n`网络层`负责控制子网/网络的操作，例如在`网协议\
  \ (IP)` 中。网络层协议的关键功能是数据包如何从源路由到可能连接在子网/网络上的多个端点。（注：原文此处存在大量重复句，译文已按要求处理逻辑）。支持 AI/ML/DL\
  \ 的 MAC 有线/无线节点可以使用更简化的功能来运行新的原始 MAC 逻辑 [5]，例如在未来标准化后不再依赖载波检测以及不再依赖底层硬件的其他复杂功能。（注：原文此处存在大量重复句）。AI\
  \ 支持的 OSPF 可以通过多路径路由 [6] 进一步优化，但这将需要更改现有的 OSPF 协议。关于 AI 增强的讨论不在本文范围内。位于会话层（第 5 层）和网络层（第\
  \ 3 层）之间的`传输层`的基本功能是接受来自会话的数据，然后根据网络层的许可将其分成较小的数据包并传递给网络层，以确保数据包正确到达，例如 `IETF` 中的面向连接的传输协议\
  \ `TCP`。这意味着给定链路的可靠性由传输层通过流量控制、分段和错误控制来管理。网络上的 TCP 操作并不是最优的 [7]，特别是对于频繁传输任意大小的文件。预测\
  \ TCP 不同方面（如吞吐量或丢包）的解决方案主要集中在两种方法：基于公式和基于历史的。支持 AI/ML/DL 的 TCP [7] 可以自动构建丢包分类器，用于预测端到端丢包，体现在带宽密集型流（例如高能物理应用）的任意大小重传包数量、队列延迟、端到端往返延迟和网络吞吐量上。它将考虑基于公式和基于历史的方法，并结合`随机森林回归`、`决策树提升`等机器学习算法实时测量之前数据传输的路径和主机属性。支持\
  \ AI/ML/DL 的 TCP 显示出网络带宽利用率显著提高（特别是无线网络），在传统有线网络中没有退化。\n\n远程过程调用 (RPC) 是一种`中间件协议`，是客户端服务器交互的形式（调用者是客户端，执行者是服务器），通常在分布式环境中通过请求-响应消息传递系统实现。然而，RPC\
  \ 对于分布式深度学习计算并不是最优的 [8]。这是因为 (i) 深度学习计算使用`张量（或多维矩阵）`作为主要数据类型，它由作为张量数据的原始字节数组和作为指定张量形状和元素类型的简单模式（schema）组成。\n\
  \n一个简单且几乎微不足道的接口从数据访问点的角度将远程机器暴露为一个“设备”。该“设备”通过支持 AI/ML/DL 的 RPC [8] 通道连接，该通道提供了并行控制。远程内存区域可以通过此“设备”接口进行分配和直接访问，就像本地图形处理器\
  \ (GPU) 一样。这自然映射到提供直接远程内存访问的底层支持 AI/ML/DL 的 RPC 网络。\n\n\n\n\n`application layer`（应用层）是终端用户以客户端-服务器架构的形式直接与软件应用程序交互的层级。OSI\
  \ 标准没有定义这一层，将市场留给开发者开发智能和增值的应用与服务，包括在全球范围内客户需求的推动下通过竞争性手段实现网络安全。当然，在国际标准论坛中，有机会对某些应用层协议进行标准化，例如用于电子邮件的\
  \ `SMTP`、用于 `Voice-over-Internet Protocol (VoIP)` 的 `Session Initiation Protocol\
  \ (SIP)`、用于文件传输的 `File Transfer Protocol (FTP)` 等。这意味着在标准化的应用层协议之上构建的增值服务是巨大的，因此需要多厂商环境中的某种可互操作产品，以降低构建可扩展全球通信网络的成本。正如我们之前在讨论\
  \ AI 赋能网络安全时所提到的，我们可以让 `SMTP`、`SIP/VoIP`、`FTP` 等具备 AI/ML/DL 能力。为了简洁起见，我们没有进一步阐述这一讨论。\n\
  \n## 16.6 网络化 AI 赋能应用\n\nOSI 第 1 至第 4 层负责使 AI 赋能的应用网络化。请注意，OSI 第 1 至第 4 层不需要具备 AI\
  \ 赋能能力即可使 AI 应用网络化（或具备网络能力）。为了使 AI/ML/DL 赋能的网络安全应用网络化或具备网络能力，需要调用底层 OSI 层（见 图 16.3\
  \ 和 16.4）。如果底层 OSI 层具备 AI/ML/DL 能力，它们的性能将接近正常水平。例如，如果物理层信道具备 AI/ML/DL 能力，信道容量可能会接近最大理想香农吞吐量上限。所有的\
  \ OSI 第 2 层（MAC/链路）、3 层（网络/路由）和 4 层（传输）情况也是如此。如果这些 OSI 第 1 至第 4 层具备 AI/ML/DL 能力，整个端到端网络吞吐容量将大幅增加并接近正常水平。\n\
  \n## 16.7 总结\n\n我们描述了通用的 AI/ML/DL 基础设施如何使所有 OSI 层包括网络安全在内的每项能力都具备 AI/ML/DL 属性并实现网络化。我们清楚地阐述了所提基础设施如何通过\
  \ `API` 提供共享“通用”AI/ML/DL 平台资源的可扩展性，以及在多厂商环境中使用专用产品时的互操作性，从而实现规模经济。我们仅描述了在不改变现有标准协议的情况下，每个\
  \ OSI 层的每项能力如何能够 AI 赋能并网络化以提高性能。如何使用更简单、需要标准化的新型智能协议来充分优化每个 OSI 层每个协议的性能，将在未来解决。\n\
