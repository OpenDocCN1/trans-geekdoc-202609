  * [2] Next G Alliance Report: 6G Technologies, June 2022.\n* [3] Zimmermann, H.,\
  \ “OSI Reference Model—The ISO Model of Architecture for Open Systems Interconnection,”\
  \ IEEE Transactions on Communications. \n\n# 2 智能代理\n\nDOI: [10.1201/9780349466-2](https://doi.org/10.1201/9780349466-2)\
  \ 在 AI 中，代理是一种计算机程序或系统，旨在感知环境、做出决策并采取行动以实现特定目标。代理自主运行，意味着它不受人类直接控制。\n\n## 2.1 代理与环境\n\
  \n环境是环绕代理的一切，但它不是代理的一部分。环境是代理生存、运行的地方，并为其提供感知和作用的对象。代理与环境之间的关系在图 2.1 中所示。\n\n![FIGURE\
  \ 2.1 Agent Interacting with Environment.](img/fig2_1.jpg)\n\nFIGURE 2.1 代理与环境的交互。\n\
  \n代理作用于环境，环境根据代理的行为传回刺激（即物理或行为的变化或过去的经历）。如果代理传感器能够在每个时间感知或访问环境的完整状态，则就是完全观测环境；否则是部分观测环境。完全观测环境很容易处理，因为不需要维护内部状态来跟踪历史。如果代理在所有环境中都没有传感器，则这种环境被称为不可观测环境。代理可能具有外部输入或知识，如能力、目标/偏好和先验知识（见图\
  \ 2.2）。\n\n![FIGURE 2.2 An Agent with External Inputs.](img/fig2_2.jpg)\n\nFIGURE\
  \ 2.2 带外部输入的代理。\n\n能力意味着代理可以执行的基本动作。目标意味着代理必须尝试实现对世界状态的偏好。先验知识是关于代理和环境的。注意，代理现在感知到的刺激、能力、目标/偏好、先验知识和过去经历的所有输入统称为感知（percept）。\n\
  \n## 2.2 代理系统\n\n代理系统由代理及其所处的环境组成。代理从环境中接收刺激，并在环境中执行动作。再次，代理本身由身体和控制器组成，如图 2.3 所示。控制器从身体接收感知，并向身体发送命令。\n\
  \n![FIGURE 2.3 Agent System.](img/fig2_3.jpg)\n\nFIGURE 2.3 代理系统。\n\n### 2.2.1 控制器\n\
  \n\n\n\n控制器接收来自智能体（agents）的实时性能数据，可视化应用性能，并向智能体发送指令（图 2.3）。控制器维护智能体的信念状态，并在每个时刻决定发布什么命令。它在必须执行此操作时所获得的信息是它的信念状态和当前的感知。如果可以通过先找到世界的最佳模型，然后使用该模型来确定最佳动作以获取结果，则该控制问题是可分离的。\n\
  \n### 2.2.2 分层控制器\n\n分层控制系统使用层级化的控制器（图 2.4）。每一层都将其下方的层视为一个虚拟体，从那里获取感知并向其发送命令。低层运行速度要快得多，对世界中需要快速反应的方面做出反应，并为高层提供更简单的世界视图，隐藏那些对高层而言至关重要的细节[1]。低层的规划视野通常比上层的规划视野短得多。人们在最低层面必须在几分之一秒内对世界做出反应，但在最高层面甚至要为几十年后做计划。例如，在机构中执行某些任务的原因可能是为了长期目标，但在零售店阅读并回答客户的问题必须在几分钟甚至几秒内完成。\n\
  \n![FIGURE 2.4 带有分层控制器的理想智能体系统。](img/fig2_4.jpg)\n\nFIGURE 2.4 带有分层控制器的理想智能体系统。\n\
  \n另一个例子，底层控制器可能操作工厂的小部分，而高级控制器则控制从控制器的动作。使用分层结构为工作和部门建立了明确的权威。管理者根据管理级别拥有权威，并有分配资源、奖励和惩罚行为以及向下属发布命令的权力。每层每时刻有三种输入：[1]\n\
  \n*   来自存储在记忆中的信念状态的特征（图 2.4），这些特征被称为这些特征的记忆值或先前值\n*   代表层级中下方层感知的特征\n*   代表层级中上方层命令的特征\n\
  \n因此，一个层实现了以下内容：\n\n$$\\begin{matrix} \\left. remember:s \\times p_{l} \\times c_{h}\\\
  rightarrow s \\right. \\\\ \\left. Command:s \\times p_{l} \\times c_{h}\\rightarrow\
  \ c_{I} \\right. \\\\ \\left. \\text{tell}:s \\times p_{l} \\times c_{h}\\rightarrow\
  \ p_{h} \\right. \\\\ \\end{matrix}$$\n\n其中 `s` 是信念状态，`C[h]` 是来自上层的命令集，`P[l]` 是来自下层的感知集，`C[l]`\
  \ 是命令集，`P[h]` 是用于上层的感知集。计算这些函数可能涉及任意计算，但目标是保持每一层尽可能简单。为了实现控制器，层的每个输入都必须从某处获取值。每个感知或命令输入都应连接到其他层的输出。其他输入来自记忆中的信念（存储在记忆中——参见图\
  \ 2.4）。层的输出不需要连接到任何地方，它们也可以连接到多个输入。\n\n### 2.2.3 身体\n\n身体包括将刺激转换为感知的传感器，以及执行器（也称为作用器），执行器将命令转换为动作。身体还可以执行不通过控制器的动作。\n\
  \n### 2.2.4 环境\n\n环境是智能体周围的一切，但它并不是智能体的一部分。环境是智能体生存、工作并为其提供感知和行动的地方。环境可以被描述为确定性的。从智能体的角度来看，环境具有多种特征：[2]\
  \ 完全观测与部分观测、静态与动态、离散与连续、确定性与随机、单智能体与多智能体、阶段性与序列性、已知与未知、可访问与不可访问。\n\n*   **完全观测与部分观测**：智能体任何给定时间感知或访问整个状态；否则，它是部分观测的。完全观测环境意味着智能体不需要跟踪过去的世界。\n\
  *   **确定性与随机**：如果智能体的当前状态和所选动作可以完美预测环境的未来状态，则这种环境是确定性的。代理无法完全控制随机环境，因为其本质上是不可预测的。在确定、完全观测的世界中，智能体不需要考虑不确定性。\n\
  *   **阶段性与序列性**：在阶段性环境中，一系列一次性动作只需要当前的感知。然而，在序列环境中，智能体必须记住之前的行为以决定下一个最佳动作。\n*  \
  \ **单智能体与多智能体**：“单智能体环境”是指只有一个智能体存在并独立的环境。另一方面，多智能体环境是指多个代理在同一空间内运行。多智能体环境的设计问题与单智能体环境不同。\n\
  *   **静态与动态**：如果环境在智能体深思时发生变化，则它是动态环境；否则，它是静态环境。静态环境很容易处理，因为代理在决策时不需要环顾四周。另一方面，动态环境中的智能体在每次动作时必须不断环顾。\n\
  *   **离散与连续**：离散环境具有有限数量的感知和动作，而连续环境具有无限数量的感知和动作。国际象棋发生在离散语文中。自动驾驶汽车是连续环境的例子。\n\
  *   **已知与未知**：“已知”和“未知”不是环境的特征，而是代理执行动作时的知识状态。在已知环境中，智能体知道所有动作的效果。在不熟悉的环境中执行动作之前，代理必须先学习其运行方式。已知环境可能是部分观测的，而未知环境可能是完全观测的。\n\
  *   **可访问与不可访问**：如果代理可以获得关于环境状态的完整正确知识，它是可访问环境；否则，它是不可访问环境。\n\n\n\n智能体架构是构建智能体应用的核心组件之一，如图\
  \ 2.2 和 2.3 所示。智能体架构被认为是智能体在决策和推理以解决问题并实现目标的功能大脑。事实上，智能体架构是软件智能体和智能控制系统的蓝图，描述了组件的排列。智能体实现的架构被称为认知架构。“智能体”这一术语是一个概念，并没有精确的定义。它由事实、一组目标以及有时的计划库组成。\n\
  \nAI 中主要有三种架构：符号主义、连接主义和进化论。它们各自有优缺点。符号主义架构基于逻辑和推理。它们可以非常强大，但也可能缺乏活性。连接主义架构基于神经网络。它们比符号主义架构更灵活，但可能性较低。进化架构基于进化算法。它们非常灵活且非常强大，但也可能难以设计。此类`architectures`中的一个关键问题是采用什么样的`control`框架来嵌入`agent’s`子系统，以管理层与层级之间的交互。\n\
  \n## 2.4 总结\n\n我们描述了 AI 智能体、环境、智能体系统、控制器、分级控制器以及体的特征。讨论了分级控制器的感知和命令。此外，详细描述了不同类型的环境。此外还解释了不同类型的智能体架构和控制。\n\
  \n## 参考文献\n\n* [1] Poole, D. L. and Mackworth, A. K., “Artificial Intelligence:\
  \ Foundation of Computational Agents,” 第二版，2017, Cambridge University Press.\n*\
  \ [2] website: [`tutorialforbeginner.com/agent-environment-in-ai`](https://tutorialforbeginner.com/agent-environment-in-ai)。\n\
  \n# 3 智能体函数\n\nDOI: [10.1201/9781003499466-3](https://doi.org/10.1201/9781003499466-3)\n\
  \n智能体函数是将一系列感知序列映射到动作的数学函数。该函数通过智能体程序实现。执行动作的智能体部分被称为执行器。智能体处于时间之中，时间可以是离散的或密集的。它们在时间内接收感知数据并在时间上执行动作。智能体在特定时间执行的动作是其输入的函数。人工智能智能体持续执行这些功能：[1]\
  \ 感知环境中的动态状况、采取行动影响环境状况、使用推理解释感知、解决问题、得出推断并确定动作及其结果。\n\n## 3.1 时间\n\n离散时间将变量的值视为发生在不同的、分离的“时间点”上，或者等效地视为在每个名为时间的非零时间区域内保持不变，即时间被视为一个离散变量。国际象棋被归类为离散时间\
  \ AI 问题。相比之下，连续时间认为变量仅在极短时间内具有特定值。在任何两个时间点之间存在无限多个其他时间点。变量`time` 跨越整个实轴，或者取决于上下文，跨越实数的某些子集（如非负实数）。因此，时间被视为连续变量。连续时间\
  \ AI 环境依赖于未知且快速变化的数据源。多人视频游戏是连续时间 AI 环境的经典示例。\n\n## 3.2 感知轨迹\n\n感知轨迹（percept trace）是控制器收到的所有过去、现在和未来感知的序列。\n\
  \n## 3.3 命令轨迹\n\n命令轨迹（command trace）是控制器输出的所有过去、现在和未来命令的序列。\n\n## 3.4 历史\n\n智能体在`t`\
  \ 时的历史是过去和现在感知的序列。智能体无法访问整个历史。它只能访问它需要记忆的内容。\n\n## 3.5 记忆/信念状态\n\n智能体在`t` 时的记忆或信念状态（belief\
  \ state）编码了它所访问的所有历史。智能体的信念状态封装了其可用于当前和未来动作的过去信息。可能会创建知识库（KB）来存储所有信念状态，并捕获人类知识以支持决策、问题解决等。年来，知识库系统已被开发以支持许多组织流程。最具变革性的之一是\
  \ AI 驱动的客户支持，包括自助选项。\n\n## 3.6 理性\n\n完全理性是指根据给定情况和可用信息，生成或选择将带来最大成功的能力。它限制了智能体在考虑可用信息的情况下提供最大预期成功的能力。边界理性描述了人类做出决策偏离完全经济理性的方式，因为我们受到心理能力、可用信息和时间的限制。与其追求做出“最佳”选择，我们往往满足于做出尚意的选择。\n\
  \n## 3.7 在线和离线学习\n\n当机器学习工程师处理大量数据时，在线学习可能是更好的选择，例如金融和经济等领域，新的数据模式几乎不断出现。离线学习（批量学习）在数据模式一致、出现较慢且没有快速概念切换的情况下，可能是更好的选择。\n\
  \n\n\n当 AI 智能体被设计为使用模拟人类思维过程的认知模型（例如：语言、视觉化、记忆使用、语言关系、感知速度、归纳和演绎）以理性的方式行动时，出现了一个巨大的领域，包括机器学习、深度学习、神经网络、自然语言处理（NLP）和情感分析。例如，通过智能体模拟认知技能需要通过所有的图灵测试以证明该智能体是理性的。智能体需要具备表示知识并对其进行推理的能力，因为这使其能够在各种情况下做出良好的决策。例如，可以开发出具有更好自然语言知识的智能体，通过创建句子或对话来帮助人类在全球复杂的社会中生存。同样，智能体生成的更深层次、更好的视觉感知将使我们能够了解某个行动可能实现的效果。以理性行动的智能体更利于科学发展，因为理性的标准定义明确且完全通用。\n\
  \n### 3.8.1 方案搜索\n\n搜索问题的解是搜索空间/状态空间中的一系列动作，称为“计划”，它能将起始状态转换为目标状态。该计划通过搜索算法实现。搜索空间中的每个点代表一个可能的解决方案。每个可能的解决方案都可以通过其对问题的价值（或适应度）被“标记”。所有的搜索方法本质上属于两类之一：穷举法（盲目）方法和启发式或信息方法。\n\
  \n### 3.8.2 推理\n\n理性智能体是一种计算机程序，它利用逻辑推理和决策能力来确定后续动作。它使用一组规则为给定情况确定最佳行动方案。这些智能体通常通过比较当前状态与之前的状态来工作，然后根据它们对现在位置相对于之前位置的好坏程度来选择行动。这种类型智能体最基本的形式被称为强化学习智能体，其名称源于它在执行过程中从经验中学习——它尝试各种方法，然后根据过去执行的效果对其进行评分。\n\
  \n### 3.8.3 规划\n\n智能体通过形成实现计划的计划，并通过在领域内的交互来执行这些计划来响应目标。行动规划的目标是选择动作并确定这些动作之间的顺序关系，以实现特定目标。在\
  \ AI 规划中，规划器通常会输入一个领域模型（对模拟领域的一组可能动作的描述）以及由初始状态和目标指定的特定问题，这与那些未指定输入领域的情况不同。\n\n\
  *   **经典规划**：经典规划中执行三项任务：规划、行动和学习。在规划中，智能体在了解问题后进行规划；在行动中，它决定必须采取什么动作；在学习中，智能体采取的动作使其学习到新知识。\n\
  *   **现实世界中的规划与行动**：现实世界中的规划器需要扩展、表示语言、具有持续时间和资源限制的动作。\n*   **确定性规划**：如果在确定性领域中初始状态是明确已知的，则可以进行确定性规划，所有动作都是确定的，且任何动作序列之后的世界状态都可以被准确预测。\n\
  *   **不确定性规划**：不确定性规划用于可能存在不完整或错误信息的环境，在这些环境中，行动可能并不总是产生相同的结果，规划的不同可能结果之间可能存在权衡。\n\
  *   **关系规划**：关系规划提供了用的状态抽象，能够实现快速学习和跨任务的高效迁移。使用状态抽象的益处在关系环境中至关重要，因为对象的数量和或类型不是预先固定的。关系规划框架不仅在当前任务上实现了更好的性能和高效的学习，还展示了对未见任务的更好的泛化能力。\n\
  \n### 3.8.4 确定性行动\n\n确定性是信念的一种认识属性，人没有理性的理由怀疑它。它也被称为认识确定性或客观确定性。有三种不同类型的确定性：意见、信念和信念。在确定性领域中，行动执行的结果是可以被预测的。AI\
  \ 的许多传统领域都是确定性的，包括滑块游戏和积木世界。以智能体为中心的搜索方法可以通过在状态空间中移动虚拟智能体来解决这些领域中的离线规划任务。在这种情况下，局部搜索空间不是受限于信息限制的。因此，以智能体为中心的搜索方法为传统的搜索方法提供了替代方案。例如，它们已成功应用于优化和约束满足问题，并通常与随机重启相结合。示例包括爬山算法、模拟退火、禁忌搜索和某些调度方法。以智能体为中心的搜索方法也被应用于传统的搜索问题和规划问题。对于这些规划问题，以智能体为中心的搜索方法与贪心（最佳优先）等其他启发式搜索方法竞争。\n\
  \n### 3.8.5 不确定性行动\n\n处理不确定性也是 AI 领域的一个重要问题：AI 系统应该知道自己什么时候不知道某事、什么时候应该谨慎，以及什么时候需要承担风险，特别是在高风险应用领域，如关键基础设施、医疗保健或军事。风险和歧义是决策中两种基本的不确定性。风险存在于在已知情况下，事件的结果是不确定的，但可以计算概率（例如骰子）。另一方面，歧义指的是概率未知或无法确定的未知情况。许多机器人、控制和调度领域是非确定性的。\n\
  \n在非确定领域中规划通常比在确定性领域中规划更困难，因为信息限制只能通过枚举所有可能的意外来克服，导致巨大的搜索空间。因此，智能体考虑其规划成本以高效解决规划任务变得更加重要。非确定领域中的智能体中心研究比确定性领域中的智能体中心搜索还有一个额外优势，即它允许智能体尽收集信息。这种优势是以智能体为中心的搜索的一个巨大优势，因为这些信息可以用来解决部分不确定性，从而减少对未遇到的情况所执行的规划量。\n\
  \n如果不将规划与执行交替进行，智能体必须确定一个完整的条件计划，无论在执行过程中出现什么意外，都能解决规划任务。这样的计划可能很大。然而，当规划与执行交替进行时，智能体不需要为每种可能的意外进行规划。它只需要确定完整计划的开头。在执行该子计划后，它可以观察结果状态，然后从子计划执行产生的状态开始重复该过程，而不是从执行可能产生的所有状态开始。\n\
  \n\n\n\n当然，两种不确定性可能同时存在：智能体对于动作结果的不确定性本身可能是不确定的。然而，关键点在于，如果我们只看预测概率，这两种不确定性是无法区分的：对某些结果不确定与对不确定的结果表示确定，可能会对可能发生的情况产生相同的预测。因此，由于我们唯一关心的是预测概率，我们将模型不确定性与环境分离开来。这是因为在某些情况下（如分类）中，这可能并不重要，但在某些情况下，它可能决定方法的成败。\n\
  \n### 3.8.6 学习中的行动 (ACTION IN LEARNING)\n\n学习中的行动是一个洞察性提问和反思性倾听的过程。行动学习通过通过先提问以澄清问题的确切性质、进行反思并识别可能的解决方案，然后再采取行动。商业模拟是行动学习方法的一个例子。参与者扮演企业的管理角色，并在时间压力下以游戏化的方式学习管理决策。人工智能中的行动模型学习有许多优点。其中优点是，它可以通过观察其他智能体如何执行相同任务，帮助智能体学习如何更高效地执行任务。此外，行动模型学习可以帮助智能体学习如何将其知识推广到新的情况和领域。\n\
  \n## 3.9 总结\n\n我们详细描述了 AI 智能体功能，包括时间、准则追踪、指令追踪、历史、记忆/信念状态、理性、离线和在线学习以及行动。我们解释了智能体行动的每种功能：解搜索、推理、确定的行动、不确定的行动以及学习中的行动。\n\
  \n## 参考文献\n\n*   [1] [Poole, D. L. and Mackworth, A. K., “Artificial Intelligence:\
  \ Foundation of Computational Agents,” Second Edition, 2017, Cambridge University\
  \ Press.]\n\n# 4 智能体建模 (Agent Modeling)\n\nDOI: [10.1201/9781003499466-4](https://doi.org/10.1201/9781003499466-4)\n\
  \n## 4.1 智能体 (AGENT)\n\n在人工智能（AI）领域，广泛的共识是：智能体被定义为一种功能实体，处理从环境中感知到的输入信息并对该环境采取行动\
  \ [[1]]。此外，最简单的人工智能智能体由一个知识库（KB）和一个推理引擎组成，如 [图 4.1] 所示。智能体与其环境和/或影响智能体的其他外部实体称为世界。智能体从环境中接收用于处理的输入信息通常以环境（例如传感器）的观测（例如测量数据）、指令（例如目标和/或效用函数）以及循环工作的查询的形式存在。\n\
  \n![图 4.1 智能体与世界的概念性表示](img/fig4_1.jpg)\n\n[图 4.1] 智能体与世界的概念性表示。\n\n在每次迭代中，智能体接收以环境观测、指令和查询形式存在的输入。推理引擎执行推理，推理由知识库（KB）中的数据结构驱动，以回答查询并选择在环境中执行的行动以实现目标。智能体可能无法通过一次迭代或一个步骤实现目标。需要一个计划来规定智能体在任何给定时间和或在未来将做什么。因此，规划是智能体寻找一系列行动以实现目标的过程。\n\
  \n学习者或机器学习算法是用于从数据中学习机器学习模型的程序。另一个名称是“归纳器”（例如“树归纳器”）。机器/深度学习模型是映射输入到预测的已学程序。这可以是线性模型或神经网络的一组权重。人工智能中的感知是解释视觉、声音、嗅觉和触觉的过程。感知是一个解释、获取、选择然后组织来自物理世界的感官信息的过程，以便能够像人类一样采取行动。\n\
  \n## 4.2 推理 (REASONING)\n\n推理是一个广泛的领域，即使在具有理性的情况下也可以包含类人类的思维 [[1]]。需要注意的是，人类被视为构建\
  \ AI 智能体时要模仿的理想参考模型，但实际上，没有人说可能永远达到那个理想目标。类人思维需要计算机程序以足够的精度表达人类心智的推理。心理学中的认知理论（本身就是一个巨大的领域）已经出现过为智能智能体编程尽可能接近人类的思考，尽管其在这一领域的成功表现还在遥远的未来。智能智能体具有理性的类人思维可能包括产生正确结论的论证结构模式。人工智能中的大多数问题都是理性推理问题。具有正确答案或结论的理性论证结构存储在知识库中。知识库可以使用语义搜索、自然语言处理、符号推理和其他技术快速轻松地发现知识。学习或知识工程随着获取更多知识，通过新经验修改知识库。\n\
  \n知识库通常包含本体论，它定义了世界中存在的对象类型及其拥有的属性、定义对象和属性之间关系的关系、定义理想和非理想状态以及智能体状态的目标和效用，以及定义行动方式的策略、控制规则和启发式。可见，知识库可能包含手动工程（或自动学习）的策略，这些策略无法通过知识库中的声明性知识进行推断（或解释）。控制规则和启发式也是如此。这就是机器和深度学习的由来，它们可以在学习策略、控制规则和启发式方面做得更好，利用知识来约束和引导推理引擎，使其更有效地得出正确结论以满足性能目标。关键在于，描述实现行动序列的计划是推理的结果。\n\
  \n\n\n与其显式地基于状态进行推理，通常不如通过特征来描述状态并基于这些特征进行推理，其中特征是关于状态的函数。特征使用变量来描述。通常，特征之间并不是独立的，并且存在硬性约束，规定了变量赋值组合的合法性。项目经理应该熟悉的三个主要约束条件是时间、范围和成本。这些通常被称为三重约束或项目管理三角形。\n\
  \n### 4.2.3 基于不确定性的推理\n\n基于不确定性和时间进行推理，是指根据不完整、不一致或随时间变化的不确定信息来得出逻辑结论并做出决策的能力。概率推理是不确定性推理的另一种名称。在现实世界中，智能体不可避免地根据不完整的数据做出决策。即使智能体感知世界以获取更多信息，也很少学习世界的精确状态。不确定性的产生由于信息源不可靠、实验误差、设备故障、温度变化和气候变化等各种因素。\n\
  \n### 4.2.4 知识推理\n\n知识表示与推理是人工智能的一个领域，专门致力于以计算机系统可以使用的形式表示关于世界的信息，以解决复杂任务，例如诊断医疗状况或使用自然语言进行对话。更准确地说，知识推理包括以下内容：\n\
  \n*   **命题与推理**：基于命题逻辑的智能体通过将其对外部世界的理解表达为逻辑语句来运行。知识库最初是空的，但随着智能体探索环境，它会用新数据填充。智能体通过逻辑推理从知识库中得出新知识。例如，如果我们知道\
  \ `PΛQ` 是真的，并且知道 `P→R`，那么我们可以推断出 `Q→R` 也是真的。\n*   **个体与关系推理**：涉及如何描述世界的表示维度，在最高层级是基于个体实体和关系的推理。基于关系的推理允许紧凑的表示，这种表示不仅可以独立于特定实体进行构建，还可以用于学习和对每个实体进行推理。\n\
  *   **本体论**：本体论是一个基础知识术语，指某一领域内的概念及其连接集合。为了使这种描述成为可能，必须显式指定类、个体、特征、关系，以及规则、限制和公理。\n\
  *   **基于知识的系统**：基于知识的系统使用人工智能技术来存储和推理知识。知识通常以规则或事实的形式表示，可用于得出结论或做出决策。\n*   **概率推理**：概率推理是知识表示的一种形式，其中概率概念用于表示知识的不确定性程度。在人工智能中，概率模型使用统计代码检查数据。\n\
  *   **知识表示**：知识表示与推理是人工智能中涉及智能体思考以及思考如何有助于智能体智能行为的部分。`基于知识的智能体`具有可以推理的显式知识表示。它们维护内部知识状态，对其进行推理、更新并执行相应的操作。这些智能体根据需求智能地行动。\n\
  *   **基于时间的概率推理**：这与概率推理相同，但它包含了进行概率推理的时间片。在最好的情况下，智能体能够预测世界可能如何演变。在情况下，智能体维护内部知识状态，对其进行推理、更新并执行相应的操作。这些智能体根据需求智能地行动。\n\
  \    *   **决策制定**：智能体基于感知做出决策。\n    *   **通信与感知**：在人工智能中，智能体是一个旨在感知环境、做出决策并与伙伴通信的计算机程序或系统。\n\
  \n## 4.3 学习\n\n我们已经看到，推理需要知识，而知识是通过学习获得的。从概念上讲，学习是一个根据对环境的观察来改进知识、经验和行为的过程。与人类类似，人工智能智能体也具有改进的能力。\n\
  \n## 4.4 结合推理的学习\n\n学习本身是一种认知现象，而推理也是认知的主要组成部分。人类解决问题的过程需要感知和推理是两个无缝集成的智能表示。感知和推理是智能的两种代表性能力，在人类解决问题的过程中被无缝集成。在人工智能领域，这两种能力分别通过机器学习和逻辑编程实现。在人工智能中，这两种能力通过机器学习和深度学习实现，被称为溯因学习（abductive\
  \ learning）。溯因学习有助于从简单的手写方程图像中同时识别数字并解决未知的数学运算。此外，学习到的模型可以推广到更长的方程，并适应不同的任务。\n\n\
  ## 4.5 联邦学习\n\n在联邦学习设置中，机器学习模型在由不同组织控制的多个去中心化服务器上训练，每个服务器都有自己的本地数据。它们与中央协调器通信，由协调器聚合单个模型更新并协调训练过程。与分布式机器学习类似，联邦学习也独立地训练模型。分布式机器学习与联邦学习之间的唯一区别在于，在联邦学习中，每个参与者独立初始化训练，因为网络中没有其他参与者。\n\
  \n## 4.6 集成学习\n\n\n\n\n集成方法是创建多个模型并将它们结合起来以产生改进结果的技术。在机器学习中，这些方法通常比单模型能产生更准确的解决方案。在类集成技术中，机器学习专业人士使用多个模型对每个数据点进行预测。不同模型做出的预测被视为独立的选票。此后，由大多数模型做出的预测被视为最终预测。与之前描述的单模型机器学习学科相比，集成学习方法具有更强的表达力，且偏差和方差更小。集成学习的优势在于，其成本仅随集成中模型数量的呈线性增长，而不是像更通用模型那样呈指数级增长。假设预测或分类模型是相互独立的（这是一个相当强的假设），集成将做出更准确的预测和分类。创建集成的方法有许多，包括装袋法（bagging）、提升法（boosting）和随机森林。\n\
  \n## 4.7 结合逻辑推理的机器学习\n\n机器学习技术通常用于构建抽象，而推理技术可以被用于在纠正反馈循环中对其进行验证和纠正。这些迭代的学习和推理算法使我们能够解决某些其他看来非常困难或不可行的\
  \ AI 问题。演绎推理是 AI 中的一种推理类型，涉及使用逻辑规则根据一组前提或假设得出结论。在演绎推理中，如果前提是真实的，那么结论也必须是真实的。演绎推理通常用于数学和形式逻辑。学习是\
  \ AI 解决方案的基础基石之一。从概念角度讲，学习是一个通过对所在环境进行观察来改进 AI 程序知识的过程。\n\n无监督机器学习（见第 8 章）、监督机器学习（见第\
  \ 9 章）、深度学习（见第 10 章）和强化学习机器学习（见第 13 章）也属于结合逻辑推理的机器学习。无监督机器学习算法的示例包括基于质心的 `K-means`\
  \ 聚类算法，它在现实示例中用于客户细分、目标营销细分、数据探索、数据准备等。此外，主成分分析（`PCA`）和层次聚类是另外著名的无监督学习算法。监督机器学习的示例包括线性回归、具有多个感知器的神经网络、线性回归、支持向量机、朴素贝叶斯、决策树、`K-nearest\
  \ neighbor` 算法、相似性学习等。图像识别、欺诈检测、垃圾邮件过滤、分类和回归都是监督学习的示例。使用神经网络的机器学习算法被称为深度学习。这里提供了机器学习和深度学习（`ML/DL`）算法列表。\n\
  \n* 机器学习\n    * 线性/逻辑回归\n    * 线性判别分析\n    * 梯度提升决策树（`XG Boost`）\n    * 因子机\n  \
  \  * `K-means`/提取极大化聚类\n    * 随机森林\n    * 朴素贝叶斯\n    * 主成分分析\n    * 线性学习器\n    *\
  \ 支持向量机\n    * 信仰网络\n    * 隐藏马尔可夫模型（`HMM`）\n    * 特征隐藏马尔可夫模型（`PHMM`）\n    * 模糊系统以及\n\
  \    * 其他\n* 深度学习\n    * 深度监督学习\n        * – 卷积神经网络（`CNN`）\n        * – 递归神经网络（`RNN`）\n\
  \            * – LSTM 记忆（`LSTM`）\n            * – 门控循环单元\n    * 深度无监督学习\n      \
  \  * – 自动编码器\n            * – 玻尔兹曼机\n            * – 自组织映射\n    * 神经图灵机（`NTM`）\n\
  \n### 4.7.1 混合学习\n\n用于机器学习/深度学习（`ML/DL`）的大多数学习算法都擅长完成某项任务或处理单个数据集。虽然这些帮助且比手动操作好得多，但这些算法无法帮助你实现\
  \ AI 在所有数据上的全部潜力。这就是混合机器学习（`HML`）的用处。多个简单算法协同工作，相互补充和增强。它们共同解决单独设计无法解决的问题。\n\n##\
  \ 4.8 总结\n\n我们描述了 AI 代理建模，它由代理本身（代理和世界）、推理和学习组成。推理包括认知推理、约束推理、不确定推理和知识推理。学习可以是不同类型，例如结合推理的学习、联邦学习、集成学习以及机器学习和混合学习。机器学习属于结合逻辑推理的学习。深度学习也是使用神经网络的机器学习的一部分。无监督学习、监督学习和强化学习在这里也简要讨论。这里还列出了每种学习使用的示例算法。\n\
  \n## 参考文献\n\n* [1] Poole, D. L. and Mackworth, A. K., “Artificial Intelligence:\
  \ Foundation of Computational Agents,” Second Edition, 2017, Cambridge University\
  \ Press.\n\n# 5 多代理系统\n\nDOI: [10.1201/9781003499466-5](https://doi.org/10.1201/9781003499466-5)\n\
  \n## 5.1 概述\n\n多代理系统由多个相互作用的代理组成。在最一般的情况下，代理将代表具有不同目标和动机的用户采取行动。为了成功交互，它们需要像人类一样具备相互合作、协调和谈判的能力。在构建代理时，我们处理此类问题：\n\
  \n* 你如何向你的代理陈述偏好？\n* 你的代理如何比较来自不同供应商的不同交易？\n* 如果有很多参数怎么办？\n* 你的代理可以使用什么算法与其他代理进行谈判（以确保你获得划算的交易）？\n\
  \n在多代理系统中，我们处理此类问题等：\n\n* 协作如何在自利代理的社会中产生？\n* 代理可以使用什么语言进行通信？\n* 自利代理如何识别冲突？以及\n\
  * 多代理系统如何成为跨学科的？\n\n多代理领域受到许多其他领域的影响和启发：哲学、逻辑、博弈论、经济学、社会科学和生态学。这既是一种优势（为领域注入了良好的方法论），也是一种劣势（关于该领域的内容以及如何（尽管如此）达成共存在许多观点）。自主代理如何协调活动以合作实现目标。多代理系统（`MAS`）是由独立软件元素组成的系统，用于帮助人类决策过程。它们被假设是处理由异构资产构成的工业资产群复杂性的合适框架。多代理系统在帮助人类在交通管理、工业生产等复杂环境中决策方面取得了特别成功。\n\
  \n\n\n\n多智能体系统的历史与我们对“代理（agent）”一词含义的理解内在相关，即之前描述定义（参见第 2 章–第 4 章）。代理是自主的、解决问题的且目标驱动的计算实体，与其他功能实体共存。多智能体系统仍然管理持续监控系统最丰富的框架之一，最近它们被假设为为资产提供某种程度代理的方法。基于这一想法，协作预测（collaborative\
  \ prognostics）是一个提出的框架，其中代理之间共享信息以改进计算和故障预测，从而优化预测性维护。\n\n多智能体系统由其架构 \\[1,2\\]定义，架构决定了智能体的结构和拓扑。多智能体系统架构可广泛分为四类：集中式、层次化、非层次化和分布式（或对等点）。在协作预测中，代理通常与单个资产关联，最优架构将取决于其对系统整体成本和可靠性的影响。大型资产群的协作预测涉及几项成本因素：通信、计算和维护。传统上，维护成本被认为是首要。随着工业物联网（IIoT）技术的出现，由于持续监控的资产群中通过互联网处理和传输大量数据，通信和计算成本已变得相关。\n\
  \n当应用于预测性维护时，多智能体系统的几种标准架构需要大幅增加群内部的处理和通信量，因为它们支持实时的对等点通信和预测。先进的预测技术使用了大量的机器学习算法，这些算法通常是计算和数据密集型的。因此，量化维护成本与其他成本的比较对于评估不同多智能体系统（MAS）架构的适用性至关重要。\n\
  \n在这里，我们比较了几种用于协作预测的标准多智能体架构，因为通信、维护和计算之间的成本平衡不同。具体而言，我们研究了资产价值和通信成本的变化对架构整体成本的影响，并证明不同的架构适用于不同的工业场景。\n\
  \n除了本章明确处理的成本限制外，多智能体架构的实施可能受到其他限制，如人力资源或可用资金。这对于领域专家（SME）或在财务流动性低背景下运行的行业尤为重要。我们不涉及此类管理细节，但任何希望在实践中实施所提系统的资产经理都必须事先考虑这些因素。\n\
  \n## 5.2 协作预测\n\n协作预测的概念将协作代理的概念扩展到了预测与健康管理领域。协作代理之间共享信息以共同实现给定目标。在协作预测中，机器（通过其代理）表现得像社会实体，相互通信并做出决策。协作预测的核心涉及形成相似机器的聚类以及这些聚类内部机器之间的协作，以改进故障预测和预测性维护。这种协作可以交换模型参数或状态数据的形式进行。\n\
  \n## 5.3 代理类型与故障模式\n\n本章回顾的架构由四个元素组成：虚拟资产、数字孪生、中介代理和社交平台。代理的故障模式被限制在影响其决策和通信能力上。实验的设置基于这样一个假设：由于工业中备份系统的广泛性，代理故障不会导致数据丢失。\n\
  \n## 5.4 价值资产\n\n虚拟资产是协作预测中使用的最低级代理。虚拟资产的任务仅限于将来自相应物理资产的数据进行标准化，并将这些数据发送到架构的上层。必须提到的是，由于它们执行的任务相当简单，虚拟资产无法满足某些广泛接受的代理定义。然而，它们对于系统的运行至关重要，因此我们将它们包含在分析中。\n\
  \n虚拟资产作为架构的被动节点运行，没有决策能力。它们的数据分为三个主要部分：一组传感器产生的特征、一组定时故障或告警，和一个唯一标识符。虚拟资产由两个构建块组成：一个专门标准化来自分配资产数据的标准化器，以及一个控制与架构上层通信的通信管理器。\n\
  \n**故障：** 虚拟资产的故障对应于恶化资产与架构其余部分的通信中断，从而导致该特定资产的预测停止。\n\n## 5.5 数字孪生\n\n数字孪生是具有预测、通信和数据预处理能力的智能代理。当使用数字孪生时，工业系统中的每个物理资产都被分配了一个独立的数字孪生。数字孪生由三个构建块组成：分析引擎、数据仓库和通信管理器。分析引擎计算预测和维护策略，数据仓库管理孪生可用数据，通信管理器控制数字孪生与架构其他元素之间的通信。这包括独立选择其他孪生进行协作的能力。\n\
  \n**故障：** 数字孪生的故障意味着：（1）它与其他代理的通信中断；（2）系统停止为分配给故障数字孪生的物理资产提供维护建议；以及（3）数字孪生无法执行任何计算。\n\
  \n## 5.6 中介代理\n\n中介代理是中间代理，能够执行预测并为资产组确定维护策略。它们还能够从虚拟资产接收数据并将数据发送到架构的上层。中介代理可以通过社交平台相互通信。中介代理与数字孪生具有相同的构建块。然而，它们的分析引擎和通信管理器没有赋予它们选择与哪些代理通信的能力，因为它们的通信是由社交平台管理的。\n\
  \n**故障：** 中介代理的故障意味着：（1）它与其他代理的通信中断；（2）系统停止为分配给中介代理的物理资产提供维护建议；以及（3）中介代理停止使用任何计算能力。\n\
  \n## 5.7 社交平台\n\n\n\n\n\n社交平台是中心化、分层和异构层次架构中作为中心节点的代理。社交平台的主要任务是运行利用源自整个机队的信息的算法。这些算法可以用于\
  \ (1) 形成协作资产集群，(2) 检索并绘制企业级信息，或 (3) 计算诊断并做出维护决策。请注意，这些任务中的每一项都是可选的，取决于社交平台嵌入的架构。\n\
  \n社交平台使用从层级结构中低层代理接收的数据来形成协作资产集群。在分层架构中，社交平台还充当架构中底层代理之间的通信通道。该平台由三个构建模块组成：数据仓库（包含聚类信息和在平台运行的算法结果）、用于计算算法的分析引擎，以及一个控制与低级代理通信的通信管理单元。\n\
  \n**故障：** 社交平台的故障意味着其管理的所有通信和所有计算的中断。此外，在中心化架构中，社交平台的故障意味着所有维护建议的停止。\n\n## 5.8 多代理体架构\n\
  \n在本节中，我们描述了本章分析的架构。选择这些架构是因为它们在工业系统中具有重要性。在这里，我们在协作诊断的背景下描述这些架构。\n\n### 5.8.1 中心化\n\
  \n中心化架构是此处考虑的最简单情况。它由一个对系统决策具有完全控制权的社交平台，以及一组仅限于向社交平台发送数据的虚拟资产组成。社交平台计算相似资产的集群，然后使用来自属于这些集群的资产数据生成维护建议（参见图\
  \ 5.1）。\n\n![FIGURE 5.1 Centralized MAS Architecture.](img/fig5_1.jpg)\n\nFIGURE\
  \ 5.1 中心化 MAS 架构。\n\n从技术上讲，可以认为中心化架构并不是多代理架构，因为唯一真正做出决策并输出预测的代理是社交平台。尽管如此，由于其在工业应用中的重要性和广泛使用，我们决定将其与其他架构进行对比测试。\n\
  \n### 5.8.2 分层\n\n分层架构定义为一种架构，其中中间代理提供系统的大部分决策，而低级代理负责执行更简单的任务。在我们的情况下，这些中间代理是中介代理。中介代理被分配了一组虚拟资产，它们对这些资产进行诊断并调度维护动作（参见图\
  \ 5.2）。\n\n![FIGURE 5.2 Hierarchical MAS Architecture.](img/fig5_2.jpg)\n\nFIGURE\
  \ 5.2 分层 MAS 架构。\n\n社交平台在层级上优于中介代理，事实上将它们分配给相似资产组。社交平台还可以创建或删除中介代理（因为集群的数量和成员可能会随时间变化），并对系统的通信具有完全控制权。\n\
  \n### 5.8.3 异构层次\n\n异构架构与之前介绍的分层架构的区别在于，它允许数字孪生之间进行点对点通信。具体而言，在我们对此架构的实现中，数字孪生执行诊断、做出维护决策并相互通信。社交平台位于架构的更高层次，通过其聚类算法决定哪些数字孪生将相互通信，并作为与人类操作员的通信链接（参见图\
  \ 5.3）。\n\n![FIGURE 5.3 Heterarchical MAS Architecture.](img/fig5_3.jpg)\n\nFIGURE\
  \ 5.3 异构层次 MAS 架构。\n\n### 5.8.4 分布式\n\n分布式架构是指所有代理都处于层级结构的同一层，并且可以在没有高级代理监督的情况下独立决策的架构（参见图\
  \ 5.4）。\n\n![FIGURE 5.4 Distributed MAS Architecture.](img/fig5_4.jpg)\n\nFIGURE\
  \ 5.4 分布式 MAS 架构。\n\n在这种架构中，通信由数字孪生之间的点对点连接组成（即所有孪生都相互连接，没有任何中央代理或中介存在）。与之前描述的架构一样，相似资产被聚在一起以进行协作诊断，同一集群内的数字孪生之间相互协作。然而，存在一个重要的区别：此处实现的聚类算法必须是分布式聚类算法，而之前的架构是由社交平台执行此任务的。此处实现的分布式\
  \ k-mean 聚类算法类似于 Qin 等人的 \\[1\\]，并在“分布式聚类算法”中详细介绍。在中心化和分层情况下，中介代理的故障会导致对数百个资产的维护建议停止。在分布式和异构层次情况下，维护建议由数字孪生产生，且任何代理故障都不会损害数百个资产的维护。分析的总结如下：\n\
  \n-   全范围内低价值资产的成本更高：包含低价值资产的架构每个资产每个时间步的归一化成本比高价值资产高出几个数量级，这意味着对于诊断，实时 MAS 实现更具成本效益，且如果诊断复杂度保持不变，资产成本越高效益越高。\n\
  -   在没有代理故障的情况下，中心化和分层架构通常更便宜；这是预期的，因为这两种架构的通信和计算成本较低。只有在噪声巨大的实验、极低通信成本或极高资产价值的情况下，这种情况才不成立，此时维护成本主导了其他其他成本。\n\
  -   在没有代理故障的情况下，随着资产价值的增加，架构之间的成本差异缩小。这是因为对于高价值资产，维护成本主导了通信和计算成本。如果实验不包含代理故障，不同架构的预测维护准确性非常相似，总体成本基本上是相同的。\n\
  -   存在高通信成本限制：如果通信成本足够高（或资产价值足够低），代理故障意味着运营成本降低。解释很简单：代理故障通过增加更多意外的性维护动作增加了运营成本，但通过停止计算和通信动作降低了成本。如果通信成本足够高，代理故障会导致架构成本更低。\n\
  \n\n\n\n我们研究了实现用于协作预测（collaborative prognostics）的不同多代理系统架构的成本影响。协作预测是一种基于代表机队中不同资产的代理之间协作的新型预测方法。我们分析了四种架构，它们具有不同程度的分布性：集中式、分层式、非层次化和分布式。该分析得出的主要结论是，去中心化架构对于协作预测而言并不总是具有成本效益。如果系统中的资产价值较低，通信和计算成本将变得显著，此时集中式架构将成为最佳选择。然而，当资产价值足够时，实施分布式架构是合理的。在这种情况下，资产的价值远大于通信和计算成本，可以利用分布式架构的优势。当引入代理故障时，这种架构之间的差异变得尤为重要。在这种情况下，由于预测和维护计划高度依赖于少数代理的架构特别容易受到代理故障的影响。这在实践中，这意味着当考虑代理故障时，分布式架构变得更具竞争力。\n\
  \n次要结论是，通常而言，基于多代理的协作预测架构比系统资产本身更具成本效益。这是一个常识性结果：没有必要用物联网（IoT）技术来增强价值极低的资产，因为这些技术的成本远超过预测性维护策略带来的节省。关于未来的工作，本章尚未显式研究过某些参数依赖关系。也许最重要的是机队中集群的数量\
  \ `k`（不同资产的组），在实验中，该数量被限制为四个。在分布式和分层架构中，通信成本 `C[c]` 将与每个簇的平方成正比：$C_{c} \\propto\
  \ \\left( \\frac{N}{k} \\right)^{2}$（如果每个簇的大小相似）。这意味着如果 `k` 保持不变但总资产数量 `N` 增加，分布式和分层架构的成本增长速度将高于其集中式和非层次化的对应架构。因此，研究相对于机异异性性由\
  \ `k` 决定）的不同架构的最优性将为可能有趣的研究提供空间。\n\n另一个在实验中被忽略（保持不变）的参数依赖是架构成本与代理故障概率及其持续时间的依赖。在我们的实验中，第一个参数保持不变，第二个参数从预定的概率分布中进行采样。我们特意选择这两个参数都相对较高，以补偿我们假设没有修复代理故障相关成本的因素。进一步的研究应该侧重于探索这种依赖关系，并将其置于真实的工业参数中。最后，在本文提出的实验中，维护阈值\
  \ `η` 保持恒定的。尽管对于这个特定的示例来说这是一个合理的假设，但在跨架构比较时，研究实时优化的效果将产生一个可能有趣的研究。\n\n## 参考文献\n\n\
