  \ `IETF` 的原则。具有 128 位地址字段的 IP 版本 6（`IPv6`）的标准化消除了使用 `NATs` 的需求，因为它拥有更大的地址空间和拓扑隐藏能力。\n\
  \n`IETF` 以这一原则为基础定义了不同的层，尽管没有像 OSI 模型那样清晰，但发现使用像 OSI 模型那样的层数在开发软件和产品时非常方便且易于表达。尽管存在某些差异，`IETF`\
