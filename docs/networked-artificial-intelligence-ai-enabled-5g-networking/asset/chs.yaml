- "# 网络人工智能；AI 赋能 5G 网络\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n*本书献给我们亲爱的孙子 Amor。*\n\
  \n*献给我的奶奶，感谢她无私的爱；感谢我的父母 Rakesh Chandra Roy 和 Sneholota Roy，他们的精神启感在我们所有人心中依然生动；感谢我已故的姐姐\
  \ GitaSree Roy、Anjali Roy 和 Aparna Roy 及其配偶，我的兄弟 Raghunath Roy 和他的妻子 Nupur，感谢他们的启发；我的女儿\
  \ Elora 和女婿 Nick，我的儿子 Ajanta、儿媳 Nageen 以及他们的儿子和我们的孙子 Amor，最后我深爱的妻子 Jharna，感谢他们的爱。*\n\
  \n*献给我们最爱的儿子 Debasri Roy，医学博士 (MD)（1988 年 1 月 20 日 – 2014 年 10 月 31 日），他拥有辉煌的职业生涯（本科以优等成绩毕业），本可以为这个国家和世界做出更多贡献。他一直非常渴望看到这本书的出版，并说：“爸爸，你是我的英雄。”在他与未婚妻的合照旁写下“爱是永恒的”，作为他一生的愿望：“我已准备好面对生活，我想看遍世界，我会研读灵性经文来寻找生命的奥秘，我想为世界带来改变。”他从他最善良的内心深处爱着我们每一个人，包括他长期的未婚妻（她也是医学博士，他的同学），他与她订婚于\
  \ 2015 年 10 月 30 日在亲友、朋友、同事和邻居的见证下结婚，直到他生命的最后一刻，他一直以多种方式激励着他们热爱上帝，并留下了预言般的话：“妈妈，你能和我在一起我非常开心，我想在其中获得幸福。”\n\
  \n---\n\n# 前言\n\n我从事网络化人工智能已经长时间了。详细描述所有这些技术是一项巨大的工程。本书已尽可能简洁地涵盖了上述每个主题。这些章节和小节都引用了最新的知名研究和开发论文的文本。我深感谢发表了这些论文的研究人员。我在每章中都提供了参考文献列表，并列出了名称和出版日期。\n\
  \n网络化 AI/ML/DL 将日益使网络能够持续学习、自我优化，甚至在全自动化的情况下在服务下降发生前进行预测和纠正。网络服务提供商可以为警报定制网络基准，减少噪点和误报，同时让信息技术（IT）团队能够准确识别问题、趋势、异常和根源。AI/ML/DL\
  \ 甚至可以减少未知性并提高决策的确定性。此外，AI 驱动的网络可以在事件发生前捕捉并保存数据，有助于加速故障排除。连接、通信、协作、策展和社区是增强效果的五个步骤。网络运营商通过分析和\
  \ AI/ML/DL 获取洞察，指导更具信誉的流程，从而降低网络运营成本并为用户提供最佳体验。\n\n\n\n\n\n\n\n**Radhika Ranjan\
  \ Roy 博士**，自 2009 年起担任电子工程师（研究），战术网络保护分支，网络安全处，工程与系统集成局，DEVCOM C5ISR 中心，马里兰州阿伯丁堡试验场（APG）。自\
  \ 2009 年以来，Roy 博士长期在其目前所在的美国工程与系统集成局、指挥、控制、计算机、通信、网络、情报、监视与侦察（C5ISR）中心，领导针对大规模全球网络的人工智能、机器学习和深度学习（AI/ML/DL）的联网人工智能研究（该术语自\
  \ 2009 年起被首次引入）。\n\nRoy 博士还领导着相关的研发工作，包括开发可扩展的大型基于`SIP`的 VoIP/多媒体网络及服务、移动自组织网络（`MANETs`）、点对点（`P2P`）网络、网络安全检测应用软件以及网络漏洞干扰检测，并支持美国陆军/国防部的一系列全国及全球战斗员网络架构。此外他还参与了多媒体/实时服务协作、`IPv6`、无线电通信、企业服务管理以及国防部（DoD）技术工作组信息传输的技术标准开发。\n\
  \n他于 1984 年毕业于纽约市立大学获得电气工程博士学位，主修计算机通信；并于 1978 年毕业于马萨诸塞州波士顿的东北大学获得电气工程硕士学位。他于 1967\
  \ 年毕业于孟加拉国达卡的孟工程技术大学获得电气工程学士学位。他出生于孟加拉国著名的乡村小镇德赖赖（Derai）。\n\n在加入 C5ISR 之前，Roy 博士于\
  \ 2007 年至 2009 年担任新泽西州伊昂顿敦`CACI`市的首席系统工程师，开发了陆军技术资源模型（`TRM`）、陆军企业架构（`AEA`）、国防部架构框架（`DoDAF`）以及陆军陆网（`LWN`）能力集，并为联合战术无线电系统（`JTRS`）、移动`IPv6`、`MANET`和会话建立协议（`SIP`）支持陆军首席信息官（`CIO`/G-6）提供了技术标准。2004\
  \ 年至 2007 年，Roy 博士担任马里兰州阿宾格登`SAIC`的高级系统工程师，支持多个陆军项目的建模、仿真、架构和系统工程工作，包括`WIN-T`、`FCS`和`JNN`。\n\
  \n在职业生涯中，Roy 博士于 1990 年至 2004 年担任新泽西州米德尔派特`AT&T/贝尔实验室`的高级顾问，并领导一个工程师团队设计了 AT&T 全球基于`SIP`的\
  \ VoIP/多媒体通信网络架构。该架构包含有线和无线部分，涵盖了信息请求（`RFI`）的准备、供应商`RFI`响应的评估以及与所有选定主要供应商相关产品的互动。他参与并贡献了`ITU-T`、`IETF`、`ATM`和帧中标准组织中`VoIP`/`H.323`/`SIP`多媒体标准的发展。Roy\
  \ 博士于 1984 年至 1990 年担任弗吉尼亚州福尔斯法奇`CSC`的高级首席工程师，负责美国财政部全国`X.25`分组交换网络的设计和性能分析。此外，他还设计了许多拟议的美国政府及商业全球和全国网络架构，包括国务院电信网络（`DOSTN`等等。\n\
  \nRoy 博士的研究兴趣包括联网人工智能、分布式人工智能、移动自组织网络、多媒体、点对点和业务质量。他发表了超过 50 篇技术论文，并持有或正在申请 30 项专利。他还是许多工作组的成员。此外，Roy\
  \ 还撰写了三本书：*《联网多点会议与 SIP 手册》*（CRC Press，2021 年）、*《多媒体电话 SDP 手册》*（CRC Press，2018 年）以及*《会话建立协议手册：网络通信》（CRC\
  \ Press，2016 年）。他与妻子 Jharna 住在新泽西州的霍泽尔（Howell）历史区。\n\n# 1 联网人工智能\n\nDOI: [10.1201/97802499461](https://doi.org/10.1201/978024994611)\n\
  \n## 人工智能技术的兴起\n\n人工智能（AI）在第四次工业革命中扮演着重要角色，我们正看到机器学习方法发生了许多演进。人工智能技术被执业工程师广泛用于解决一系列棘手问题。最近，OpenAI\
  \ 发布了其主要的自然语言处理（NLP）模型`ChatGPT4`。`ChatGPT4`可以编写代码、信函和诗歌；规划营销策略；回答问题并完成许多其他任务。此外，人工智能还应用于深度学习神经网络和现实应用、大数据分析和复杂网络理解、智能交通系统和自动汽车、物联网（`IoT`）和网络物理系统、自组织和新兴生物启发系统、全局优化、进化算法、群智能、自然和生物启发启发式算法，以及溯推理、基于案例、非单调推理。\n\
  \n人工智能不仅带来了潜在的利益和机遇，也带来了挑战和陷阱。例如，人工智能可以加速数据处理并提供洞察、增强人类决策、优化复杂任务和系统的性能、提高危险职业人员的安全。另一方面，人工智能系统可能会持续或放大偏差，可能无法完全解释其决策过程，并且通常依赖于难以获取的大型数据集。\n\
  \n\n\n\n\n# 人工智能（AI）已成为 21 世纪最主导的技术，影响着科学、技术及其他学科的每一个领域，以及人类社会。AI 极其复杂，由应用于应用程序的各种软件（SW）和硬件（HW）技术组成。商业和军事领域全球范围内专有\
  \ AI 产品和服务的出现，为所有公司和政府带来了巨大的推动力，迫使他们思考如何在多供应商环境中通过基于标准的 AI 赋能网络架构和协议提供互操作性，从而提供扩展性和规模效应，降低产品和服务的成本。AI\
  \ 的目标是提供能够对输入进行推理并对输出进行解释的软件。AI 将提供与人类类似的软件交互，并为特定任务提供决策支持，但它并不是人类的替代 [1]`。AI 通过丰富的分析和模式预测能力增强人类智能，以提高的准确性提高人类决策的质量、有效性和创造力。\n\
  \nAI 不再是一个独立的产品和服务。AI 服务必须在全球范围内为地球全体人口提供，可能可能在太空中提供，并通过如公共互联网、商业和/或军事网络等全球网络进行连接。AI\
  \ 产品不仅包括用于云计算的高端超级计算机、中端网络服务器、广域网和局域网路由器及交换机，还包括配备强大中央处理器（CPU）和图形处理器（GPU）的笔记本电脑等终端设备，甚至是手持智能手机。\n\
  \n为了让事情变得复杂，受第五代（5G）和新兴 6G 移动技术爆炸式增长驱动的数十亿物联网（IoT）设备也可以被 AI 赋能，或者通过 AI 服务器的服务作为微型\
  \ AI 客户端。AI 赋能的 IoT 实体通过网络连接，可能是非常小的产品，如传感器、家用设备（如恒温器）、火灾报警器、无线传感器标签、射频识别（RFID）标签、生物识别贴片等。这种新一代的\
  \ AI 赋能的小型、微型 IoT 实体不仅可以是固定的，还可以用于移动环境。\n\n“人工智能”这一术语在该领域被广泛使用，对于如何将与其他智能（例如自然智能）与\
  \ AI 区分开来存在许多争论。我们在这书中并不讨论这一点，因为仍有许多困惑需要清晰简洁地解决，甚至包括图灵测试和其他测试。相反，将其定义为一种具有某种能力的计算机，这种能力虽然可能不等同于人类智能。因此，我们定义：\n\
  \n> 人工智能（AI）是一个体现为智能体的领域，它能够推理、学习和智能地行动，模仿人类智能来解决问题和做出决策。在采取任何行动之前需要详细的计划。我们可以以模仿人类智能为中心，综合并分析以下组件：智能体、推理、学习、规划和执行。\n\
  \n人工智能这个术语是由艾兰·图灵（Alan Turing）在 1950 年的开创性工作《计算机器与智能》提出的。然而，得益于数据量的增加、先进算法以及计算和存储能力的提高，AI\
  \ 在今天变得更加流行。20 世纪 50s 年代的早期 AI 研究探索了问题解决和符号方法等课题。20 世纪 60s 年代，美国国防部对这类工作感兴趣，并开始训练计算机模仿基本的人推理。例如，国防高级研究计划署（DARPA）在\
  \ 20 世纪 70s 年代完成了街道制图项目。DARPA 在 2003 年生产了智能个人助手，这远在 Siri、Alexa、Cortana 或生成式 AI——ChatGPT\
  \ 成为家喻户晓之前。这些早期工作为我们今天在计算机中看到的自动化和形式推理铺平了道路，包括可以设计用于补充和增强人类能力的决策支持系统和智能搜索系统。虽然好莱坞电影和科幻小说将\
  \ AI 描述为统治世界的类机器人，但当前 AI 技术的演进并没有那么可怕——或者那么聪明。相反，AI 已经演变为为每个行业提供许多特定的益处。继续阅读有关医疗、零售等领域的\
  \ AI 现代案例。我们正在描述 AI 如何成为我们时代最主导的技术，这是因为机器学习（1943–2010）、深度学习（2011–2020s）神经网络（1950s–1970s）以及当今生成式\
  \ AI 的前所未有的进步。\n\n## 1.1.1 机器学习\n\n机器学习的历史始 1943 年，沃尔特·皮茨（Walter Pitts）和沃伦·麦卡洛（Warren\
  \ McCulloch）在科学论文《神经活动内在思想逻辑演算》中提出了神经网络的首个数学模型。然而，机器学习领域是由计算机科学家艾兰·图灵（Alan Turing）在\
  \ 20 世纪 50s 年代创立的。亚瑟·塞缪尔（Arthur Samuel）被认为在 1959 年任职 IBM 期间创造了“机器学习”这一术语。在 20 世纪\
  \ 50s–2010s 期间，机器学习变得流行。机器学习自动化了分析模型的构建。它利用神经网络、统计学、运筹学和物理学的方法从数据中发现隐藏的见解，而无需显式编程规定去哪里寻找或得出什么结论。\n\
  \n## 1.1.2 深度学习与神经网络\n\n在 2011–2020s 期间，深度学习的突破驱动了 AI 的热潮。深度学习使用具有许多层处理单元的大型神经网络，利用计算能力的进步和训练技术的改进，从海量数据中学习复杂的模式。常见应用包括图像识别和语音识别。20\
  \ 世纪 50s–1970s 年代神经网络的早期工作激发了人们对“思考机器”的兴奋。神经网络是机器学习的一种，由互连的单元（如神经元）组成，通过响应外部输入来处理信息，并在单元之间传递信息。该过程需要对数据进行多次迭代，以发现联系并从未知数据中得出含义。20\
  \ 世纪 80s 年代，使用反向传播算法进行自我训练的神经网络在 AI 应用中被广泛。2015 年，百度的墨昆超级计算机使用一种名为卷积神经网络的特殊深度神经网络来识别和分类图像，其准确率高于普通人类水平。\n\
  \n### 1.1.3 生成式人工智能\n\n生成式 AI 作为一种颠覆性技术，人气直线飙升。例如，ChatGPT 作为一个主要使用大型自然语言处理（NLP）模型的生成式\
  \ AI，震撼了整个世界。是大数据造就强大的 AI 产品。因此，数据被称为王。\n\n## 1.2 人工智能的应用\n\n- 端到端网络自动化，零接触配置\n\
  - 优化的 IT 服务管理，如密码重置和硬件故障\n- 改进的网络管理和性能，识别瓶颈、延迟问题和拥塞区域\n- 通过关联分析、模式识别和其他方法加速事件处理\n\
  - 智能网络安全，通过分析流量、用户行为和系统日志发现异常并标记潜在的安全漏洞或攻击，几乎实时，减少误报\n- 基于 AI 的数字孪生可以集成到持续集成和持续交付流水线中，允许“假设”场景测试，确保网络按预期运行\n\
  - 准确的图像识别\n- 识别产品、人员、缺陷和损坏\n- 语音识别\n- 自然语言生成\n\n\n\n\n\n* 情感分析\n* 聊天机器人/客户服务\n*\
  \ 太空探索\n* 医疗保健\n* 制造业\n* 银行业\n* 零售\n* 其他许多\n\n## 1.3 人工智能赋能与支持技术\n\n自然语言处理、计算机视觉、图形处理器、物联网、高级算法和应用程序接口是\
  \ AI 主要的赋能和支持技术，这些技术使 AI 在当今全球工作的各个领域取得了前所未有的突破。我们将在这里简要描述这些技术。\n\n### 1.3.1 自然语言处理\n\
  \n自然语言处理（`NLP`）计算机分析、理解和生成人类语言（包括语音）的能力。`NLP` 的下一个阶段是自然语言交互，它允许人类使用日常语言与计算机通信以执行任务。\n\
  \n### 1.3.2 计算机视觉\n\n计算机视觉依赖模式识别和深度学习来识别图片或视频内容。当机器能够处理、分析和理解图像时，它们就可以实时捕捉图像或视频并解释其周围环境。\n\
  \n### 1.3.3 图形处理器\n\n图形处理器（`GPUs`）是人工智能的关键，因为它们提供了迭代处理所需的强大计算能力。训练神经网络需要大数据加算力能力。\n\
  \n### 1.3.4 物联网\n\n物联网从连接设备产生海量数据，其中大部分未经分析。使用 AI 自动化模型将允许我们利用更多此类数据。\n\n### 1.3.5\
  \ 高级算法\n\n高级算法正在以新的方式开发和组合，以更快的速度在多个层面上分析更多数据。这种智能处理是识别和预测稀有事件、理解复杂系统以及优化独特场景的关键。\n\
  \n### 1.3.6 应用程序接口\n\n应用程序接口（`APIs`）是可移植的代码包，使得向现有产品和软件软件包添加 AI 功能成为可能。它们可以为家庭安全系统添加图像识别能力，以及描述数据、创建说明和标题的问答能力，或提取数据中有趣的模式和洞察。\n\
  \n## 1.4 极高速半导体技术的出现\n\nAI 技术预计将对全球整个行业产生重大影响。随着高速半导体的发展，半导体行业也在发生变化，以满足基于 AI 的复杂技术的需求。例如，AI\
  \ 技术、大数据技术、5G 无线通信技术、新兴 6G 物联网（`IoT`）技术以及自动驾驶技术。因此，半导体公司的技术能力将得到提升。例如，带有 AI 技术的神经网络单元（`NPU`）和图形处理器（`GPU`）的发展将为自动汽车创造市场。我们提供的新兴高速半导体列表如下：\n\
  \n* 半导体外延生长（`MBE` 和 `MOCVD`）：金属有机化学气相沉积（`MOCVD`）是化学气相沉积（`CVD`）的一种变体，通常用于沉积晶体微纳米膜和结构。可以轻松实现精细调制、突变界面和良好的掺杂控制。分子束外延（`MBE`）是一种薄膜沉积工艺，其中原子或分子的热束在超高真空条件下处于高温的单晶衬底洁净表面发生反应，形成外延膜。\n\
  \n* 化学气相沉积（`CVD`）原子层沉积（`ALD`）：原子层沉积（`ALD`）是一种用于广泛应用的薄膜生长技术。`ALD` 是化学气相沉积（`CVD`）技术的特殊变体，将气态反应物（前驱体）引入反应腔，通过化学表面反应形成所需的材料。\n\
  \n* 高 k（`k = 介电常数`）介质用于终极互补金属氧化物半导体（`CMOS`）：`k` ≥ `20` 的高 k 介质有利于 `CMOS` 纳米器件，当等效氧化层厚度（`EOT`）≤\
  \ `0.5 nm` 时减少栅漏电流。技术辅助设计（`T-CAD`）已模拟了高 k MOS 结构作为栅极堆：针对不同 `FAB` 节点 `45nm`, `32nm`,\
  \ `22nm` 和 `14 nm` 的 `metal/oxide/p-Si`。\n\n* 同质场效应晶体（III-V）...\n\n## 1.5 极高带宽网络的出现\n\
  \n### 1.5.1 地陆有线网络\n\n远陆高速骨干网已通过同步光网络（`SONET`)/时分复用（`TDM`）网络和密集波分复用（`DWDM`）建立。此外，`Wi-Fi`、时分多址（`TDMA`）、码分多址（`CDMA`）、正交频分多址（`OFDMA`）、微波接入（`WiMAX`）和长期演进（`LTE`）实现了高速用户的高效复用。\n\
  \n### 1.5.2 五代和六代无线网络\n\n五代（`5G`）技术实现了一种新型网络，旨在连接几乎每个人和每物，包括机器、物体和设备。5G 无线技术旨在为用户提供更高的多\
  \ Gbps 峰值数据速率、超低延迟、更高的可靠性、海量的网络容量、提高可用性和更均匀的用户体验。更高的性能和提高的效率赋予了新的用户体验并连接了新行业。六代（`6G`）技术将归类为第六代移动网络，是\
  \ `5G` 的未来继任者。\n\n\n\n\n\n卫星网络将在 6G 中发挥重要作用，通过补充地面网络来扩展覆盖范围，特别是在偏远和农村地区（例如沙漠、山脉、森林），在这些地区部署固定基础设施在经济上是不可行的，同时也用于机载通信。可重复火箭技术的最新进展、低成本卫星的引入、小型卫星（例如低地球轨道上的立方体）[2]，以及对机载互联网访问、船只跟踪和自然灾害监测日益增长的需求，已经为使用非陆地网络（NTN）补充地面网络（TN）连接性奠定了基础。第三代移动体系计划（3GPP）Release-17\
  \ 将支持使用 NTN 的 5G 新空电（NR）和长期演进物联网（LTEIoT）。因此，迫切需要设计系统方案和解决方案，以支持 6G 中无处不在的网络覆盖和设备连接的\
  \ NTN。\n\nNTN 在系统和网络架构方面带来了一些新挑战。这包括大往返时间（RTT）、高差分延迟（小区边缘与小区中心 UE 之间的 RTT 差异）以及由于非地球静止卫星的高移动性导致的频繁切换和小区重选。需要注意的是，人工智能、机器学习和深度学习（AI/ML/DL）可以通过调整可用参数和过程以最贴合流量来增强网络运行。例如，上下文感知可以用于预测无线节点中较低层最匹配的配置，或根据网络提供的模型和/或用户特定行为主动提供服务。\n\
  \n## 1.6 开放系统互连\n\n开放系统互连（OSI）模型[3] 是由国际标准化组织创建的一个概念模型，它使得不同的通信系统能够使用标准协议进行通信。这些层分别是第\
  \ 1 层物理层、第 2 层数据链路层、第 3 层网络层、第 4 层传输层、第 5 层会话层、第 6 层表示层和第 7 层应用层（见图 1.1）。OSI 模型描述了计算机系统用于网络通信使用的七层。它是网络通信的首个标准模型，于\
  \ 20 世纪 80 年代被所有主要的计算机和电信公司采用。书中提供了对 OSI 模型的详述（参见第 14 章）。\n\n![FIGURE 1.1 OSI Protocol\
  \ Layer.](img/fig1_1.jpg)\n\nFIGURE 1.1 OSI 协议层。\n\n该模型指导产品制造商如何构建硬件和软件来构建其网络，并在多供应商环境中提供互操作性。网络化\
  \ AI 意味着所有这些协议层将具备 AI 能力。本书关注通信网络协议如何在提供网络服务时实现 AI 增强。\n\n## 1.7 互联网协议层模型\n\n现代互联网基于第\
  \ 4 层更简单的传输控制协议（`TCP`）用户数据报协议（`UDP`）和第 3 层互联网协议（`IP`）模型（见图 1.2）。第 5 层和第 6 层定义为应用层用于创建服务的中间件层。然而，第\
  \ 1 层和第 2 层与 OSI 模型中的定义相同。\n\n![FIGURE 1.2 Internet Protocol Layer Model.](img/fig1_2.jpg)\n\
  \nFIGURE 1.2 互联网协议层模型。\n\n在书中，我们将描述这些互联网协议层中的每一个如何实现 AI 增强以提供网络服务。此外，我们在第 14 章中详细描述了这一协议模型。\n\
  \n## 1.8 总结\n\n在本小节中，我们正式引入了网络化 AI 架构，该架构提供了 AI 的通信和计算框架。此外，我们还描述了机器学习、深度学习和神经网络。我们简述了\
  \ AI 增强和支持技术，如 `NLP`、计算机视觉、图形处理器、物联网、高级算法和 `APIs`，以及极高速半导体、极高带宽网络（如地面和非陆地技术）的兴起。我们讨论了\
  \ OSI 和互联网协议的标准化通信网络层协议模型，这些模型将在后续章节中用于定义用于通信和计算的网络化 AI。\n\n## 参考文献\n\n* [1] IBM.\
