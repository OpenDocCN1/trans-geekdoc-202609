  \ [10.1201/9781003499466-13](https://doi.org/10.1201/9781003499466-13)\n\n强化学习（`RL`）与无监督学习和监督学习并没有太大区别。强化学习是一种机器学习训练方法，通过最大程度地奖励期望行为和/或惩罚不期望的行为来实现。通常情况下，强化学习智能体能够感知并解释其环境，采取行动并通过试错来学习。强化学习与监督学习的区别在于，它不需要提供带标记的输入/输出对，也不需要显式地纠正其欠优操作。它在对未知区域的探索与对已学知识的利用之间寻找平衡\
  \ [1]。\n\n## 无模型与基于模型\n\n`RL` 可以分为两类：`基于模型（Model-Based）`和`无模型（Model-Free）`。图 13.1\
  \ 展现了这一视图。\n\n### 无模型强化学习\n\n* **基于价值（Value-Based）**：`无模型` `RL` 可以分为`基于价值`和`基于策略（Policy-Based）`。\n\
  \    * `基于价值`的 `RL` 可以分为 `DQN` 和 `Double DQN`。\n    * `基于策略`的`无模型` `RL` 可以分为 `A2C`\
  \ 和 `A3C`。\n\n### 基于模型的强化学习\n\n* **基于模型（Model-Based）**：`基于模型`的 `RL` 可以分为 `MBVE`\
  \ 和 `MBMF`。\n    * `基于模型`的`无模型` `RL` 可以分为`世界模型（World Models）`和 `AlphaZero`。\n  \
  \  * `基于策略`的`基于模型` `RL` 可以分为 `I2As` 和 `策略优化（Policy Optimization）`。\n\n\n\n\n在这两种情况下，核心学习算法本质上是相同的，但主要的区别在于，在在线设置中，智能体可以影响其收集经验的方式，使其对学习最有用。这增加了额外的挑战，主要是因为智能体在学习过程中必须处理探索与利用（exploration/exploitation）的权衡。但在线设置下的学习也可以是一种优势，因为智能体能够专门针对环境中最感兴趣的部分收集信息。因此，即使环境是完全已知的，与由于缺乏特定性而导致效率下的动态规划方法相比，强化学习方法在实践中可能提供计算效率最高的方法\n\
  \n## 13.1 RL 智能体与环境的交互\n\n事实上，强化学习（RL）是一种基于反馈的机器学习，在给定情况下采取适当行动以最大化奖励。图 13.2 提供了\
  \ RL 智能体与环境的交互。\n\n![FIGURE 13.2 智能体与环境之间的交互。](img/fig13_2.jpg)\n\n图 13.2 智能体与环境之间的交互。\n\
  \n让我们考虑离散时间马尔可夫决策过程（MDP）来定义 RL 智能体与环境的交互。MDP 是一个五元组（`S`, `A`, `T`, `R`, `γ`），其中：\n\
  \n* `S` 是状态空间，\n* `A` 是动作空间，\n* `T`: `S` × `A` × `S`→`[0,1]` 是转移函数（状态之间条件转移概率集合），\n\
  * `P`: `S` × `S` × `A`→`[0,1]` 是设定动力学的概率；例如，`P(s′ | s,a)` 是在智能体处于状态 `s` 且执行动作 `a`\
  \ 时，转移到状态 `s′` 的概率；因此，$\\forall s \\in S\\forall a \\in A{\\sum\\limits\\_{s^{\\\
  prime} \\in S}{P\\left( {s^{\\prime} \\mid s,a} \\right) = 1}}$ \\[1],\n* `R : S\
  \ × A × S → R` 是奖励函数，其中 `R(s,a,s′)` 是在范围 `R[max]` ∈ `R^+`（例如 `[0, R[max]]`）中，执行动作\
  \ `a` 并从状态 `s` 转移到 `s′` 的可能奖励连续集合；`R(*s*,a*,s^′)` = ∑[*s^′]*R(*s*,a*,s^′)` \\* P(s^′∣s,a);注意，有时将\
  \ `R (s,a,s′)` 写为 `R(s,a)` 是方便的，`γ` ∈ `[0,1]` 是折扣因子。\n\n离散时间马尔可夫决策过程（MDP），`P` 定义如下：\n\
  \n$$\\begin{matrix} {{\\\\mathbb{P}}\\\\left( {s\\_{t + 1} \\mid s\\_{t},a\\_{t}}\
  \ \\right) = {\\\\mathbb{P}}\\\\left( {s\\_{t + 1} \\mid s\\_{t},a\\_{t},\\\\ldots.,s\\\
  _{0},a\\_{0}} \\\\right)} \\\\\\\\ {{\\\\mathbb{P}}\\\\left( {r\\_{t} \\\\mid s\\\
  _{t},a\\_{t}} \\right) = {\\\\mathbb{P}}\\\\left( {r\\_{t} \\\\mid s\\_{t},a\\_{t},\\\
  \\ldotsldots,s\\_{0},a\\_{0}} \\\\right)} \\\\\\\\ \\\\end{matrix}$$\n\nMDP 图形的一部分如图图\
  \ 13.3 所示，包含状态转移、动作和奖励 [1]。智能体根据某些策略采取动作，比较不同的奖励序列（标量）：`{r[1]`,`r[2]`,……`r[n]}`。\n\
  \n* 总奖励：$V = {\\\\sum\\limits_{i = 1}^{\\infty}r\\_{i}}$\n* 平均奖励：`V` = lim[n→∞]\
  \ `{r[1] + r[2] + …. + r[n]}/*n*\n* 折扣奖励/因子：折扣因子 `γ` 本质上决定了强化学习智能体相对于近期奖励，对遥远未来奖励的关注程度。\n\
  \n如果 `γ` = 1，智能体将根据所有未来奖励的总和来评估其每一个动作。\n\n`V` = `r[1]` + `γ*r[2]` + `γ*²*r[3]` +…. + `γ^(*n)*r*[*n*]`\
  \ 在 `γ` < 1 时是收敛的。\n\n![图 13.3 马尔可夫决策过程。](img/fig13_3.jpg)\n\n图 13.3 马尔可夫决策过程。\n\
  \n*(注：由于原文包含大量 LaTeX 数学公式和乱码占位符，此处已按要求保留了所有公式格式，并确保了文本描述的逻辑连贯性。)*\n\n*(注：由于提供的原始文本后半部分存在大量乱码和未对齐的\
  \ LaTeX 表达式，如 `R(*s*,a*,s^′)` = ∑[*s^′]*R(*s*,a*,s^′)`，翻译时保留了其原始符号结构以确保 Markdown\
  \ 格式不损坏。)*\n\n\n\n\n$$Q^{\\pi}(s,a) = R(s,a) + \\gamma^{\\*}{\\sum\\limits\\_{s^{\\\
  prime}}P}\\left( {s^{\\prime} \\mid s,a} \\right)^{\\*}V^{\\pi}\\left( s^{\\prime}\
  \ \\right)$$  \n\n`V^π` 通过执行由 `π` 指定的动作并遵循 `π` 获得：\n\n`V^(*π*)(*s*) = *Q^(*π*)(*s*, *π*(*s*))`\n\
  \n![FIGURE 13.4 状态/动作变化的 RL 智能体-环境。](img/fig13_4.jpg)\n\n**图 13.4** 状态/动作变化的 RL\
  \ 智能体-环境。\n\n## 13.4 Q-TABLE\n\nQ 表代表了在（状态，动作）对中用于探索的动作值（见图 13.5a），而奖励表代表了相同（状态，动作）对用于探索的奖励值（见图\
  \ 13.5b）。奖励矩阵包含每个状态和动作组合的正奖励或负奖励（见图 13.5b），而 Q 表矩阵内部的值描述了 RL 智能体在之前回合中采取的选择的结果。相关的奖励表和\
  \ Q 表如图 13.5 所示。所提的机制有助于在探索和利用阶段做出最合适的决策。\n\n![FIGURE 13.5 Q 表和奖励表。](img/fig13_5.jpg)\n\
  \n**图 13.5**](#Ch13.xhtml#bck_fig13_5) Q 表和奖励表。\n\nQ Learning（见图 13.6）是一种无模型强化学习算法，它构建了一个状态-动作值的\
  \ Q 表，其维度为 (*s*,*a*)，其中 `s` 是状态数量，`a` 是动作数量。它可以处理具有随机转移和奖励的问题，而不需要任何调整。从根本上说，Q 表将状态动作对映射到\
  \ Q 值。在实践中，状态和动作的数量可能是巨大的，这使得构建表在计算上是不可行的。\n\n![FIGURE 13.6 Q-Learning 表。](img/fig13_6.jpg)\n\
  \n**图 13.6**](#Ch13.xhtml#bck_fig13_6) Q-Learning 表。\n\nQ-learning 使用（有限）马尔可夫决策过程（MDP），从当前状态开始，寻找在所有连续步骤的总奖励期望值最大化意义优策略。它可以在无限探索和部分随机策略的情况下，识别出在每个状态下采取动作具有期望奖励的最优动作选择策略。\n\
  \n## 13.5 最优策略的价值\n\n令 `Q^(\\*) (*s,a*)` 为在状态 s 中执行 `a` 然后遵循最优策略的期望值，`V*\\*(*s*)`\
  \ 为从状态 *s* 开始遵循最优策略的期望值。`Q*\\*` 的定义可以类似于 `Q^π`：\n\n$$Q^{\\*}(s,a) = {\\\\sum\\limits\\\
  _{s^{\\prime}}P}\\left( {s^{\\prime} \\mid s,a} \\right)^{\\*}\\left\\{ {R\\left\\\
  { {s,a,s^{\\prime}} \\right\\} + \\gamma V^{\\*}\\left\\{ s^{\\prime} \\right\\\
  }\\}} \\right\\} = R(s,a) + \\gamma^{\\*}{\\sum\\limits\\_{s^{\\prime}}P}\\left(\
  \ {s^{\\prime} \\mid s,a} \\right)^{\\*}V^{\\*}\\left( s^{\\prime} \\right)$$  \n\
  \n`V^(\\*)(*s*)` 通过执行在每个状态下产生最佳价值的动作获得：\n\n$$V^{\\*}(s) = \\max\\limits\\_{a}Q^{\\\
  *}(s,a)$$\n\n最优策略 `π^(\\*)` 是为每个状态提供最佳价值的策略之一：\n\n$$\\pi^{\\*}(s) = \\underset{a}{\\\
  arg\\max}Q^{\\*}(s,a)$$\n\n其中，arg max[`a*]` `Q^(\\*) *s,a*` 是状态 `s` 的函数，其值是一个导致\
  \ `Q^(\\*) (*s,a*)` 取最大值的动作 `a`。\n\nMDP 是完全可观测的，这意味着观测值与环境状态相同：`s[t] = s[t]^′`。在每个时间步\
  \ `t`，移动到 `s[t+1]` 的概率由状态转移函数 `T(s[t], a[t]*, s[t], s[*t+1])` 给出，奖励由边界奖励函数 `R(s[t],\
  \ a[t]*, s[t], s[*t+1])` ∈ `R*` 给出。这在图 13.7 中所示。\n\n![FIGURE 13.7 智能体动作导致 MDP 状态和奖励的变化。](img/fig13_7.jpg)\n\
  \n**图 13.7**](#Ch13.xhtml#bck_fig13_7) 智能体动作导致 MDP 状态和奖励的变化。\n\n## 13.6 策略分类\n\n\
  策略定义了如何选择动作。策略分为平稳的非平稳的。非平稳策略取决于时间步，平稳策略在有限视界内是有效的。在无限视界下，策略可以是确定性的或随机的。在确定性情况下，策略由\
  \ `π (*s)` 描述。\n\n在随机情况下，策略由：\n\n`π (*s)` 描述，其中 `π (*s)` 算法（见 1）是通过累积奖励来优化。通过对未来状态的估计来反复改进。这种过程被称为进化算法（EA）。进化算法的优缺点如下：\n\
  \n*   学习每一个动作。\n*   学习时间复杂度是线性的，相对于状态数量是指数级的。\n\n## 13.7 时分（Temporal DIFFERENCE）\n\
  \n时分（TD）学习是强化学习的核心概念。时分学习顾其实名，关注智能体随时间产生的差异。TD 方法为某些策略 `π` 提供状态的估计值。\n\n最基础的 TD\
  \ 方法是 `TD(0)`。时分 `TD(0)` 学习根据奖励更新状态估计值。具体来说，如果我们的智能体处于当前状态 `s[t]`，采取动作并接收 `r[t]`，则我们更新：\n\
  \n```\nV(s[t])←V(s[t]) + α[r[t+1] + γV(s[t+1]) - V(s[t])]\n```\n\n其中 `r[t+1] + γV(s[t+1])`\
  \ 是 TD 目标。\n\n时分学习只是试图估计价值函数 `v[π] (*s[t])`，作为智能体处于某些状态的估计，通过许多状态逐渐向下传递。\n\n###\
  \ 13.7.1 时分差异（TD）\n\nTD 的简单示例将进一步说明（见 1）。为了了解 RL 如何工作，可以从一组数值检查 TD 中的示例：`{*v[1],*v[2],*v[3],\
  \ …, *v[k]*}`。令 `A[k]` 为运行平均值：\n\n`A[k] = {*v[1]+*v[2]+*v[3],…*v[k]*}/*k*`\n\n因此，\n\
  \n$$k^{\\*}A_{k} = \\left\\\\{ {v\\_{1}\\*v\\_{2}\\*v\\_{3},\\\\ldots + v\\_{k -\
  \ 1} + v\\_{k}} \\\\right\\\\} = (k - 1)\\*A_{k - 1} + v\\_{k}} \\\\\\\\ {A\\_{k}\
  \ = \\left( {1 - \\frac{1}{k}} \\right)\\*k^{\\*}A_{k - 1} + \\frac{v\\_{k}}{k}\
  \ = \\left( {1 - \\alpha\\_{k}} \\right)\\*A_{k - 1} + \\alpha\\_{k}\\*v\\_{k}}\
  \ \\\\\\\\ \\end{array}$$\n\n其中，`α[k]` = 1/*k**；然后经过变形后：\n\n`A[k] = A[k*− 1] + *α*[*k*] \\\
  * (*v*[*k*]−*A*[*k* − 1])`\n\n\n\n\n\n时间差分 (TD) 误差 ≡ (`v[k]` − `A[k-1]`)；它规定了新值\
  \ `v[k]` 与旧预测 `A[k-1]` 之间的差异。它表明我们需要通过 TD 误差来更新旧估计值 `A[k-1]` 以获得新的估计值 `A[k]`。该分析假设每个数字具有相同的权重。在实践中，每个数字的权重可能不同。例如，股票市场价值在短期内会下降，但长期可能缓慢增长。因此，预测需要考虑不同数字的不同权重。在强化学习（RL）中，值是动作效果的估计；较新的值比早期的值更准确，因为智能体正在学习，因此它们应该赋予更大的权重。我们可以使用参数\
  \ `α[k]`，使其在解收敛的同时产生更准确的预测。\n\n`TD(`λ`)` 是一种学习算法，其中参数 `λ` 指的是轨迹衰减参数，取值为 0 ≤ `λ`\
  \ ≤ 1。较高的设置会导致轨迹持续更久，从奖励中获得更大比例的信用，并且当 `λ` 较高时，可以将信用分配给更远的状态和动作。注意，当 `λ` = 1 时，它产生与蒙特卡洛\
  \ RL 算法并行的学习。\n\n## 13.8 策略梯度 (POLICY GRADIENT)\n\n策略梯度旨在寻找一种最优策略，通过学习随机策略来最大化期望累积长期奖励，而价值函数无法做到这一点。策略梯度方法既可以用于无模型（Model-Free）也可以用于基于模型（Model-Based），因为它们是一种通用的公式。当强化学习应用于机器人和控制系统等现实案例时，不确定的状态信息会导致严重问题，并且需要应用部分可观测\
  \ MDP 方法进行计算，而这通常会导致过高的计算需求。这些方法在收敛性上没有保证，甚至存在发散的例子。此外，高维空间中的连续状态和动作无法被大多数现成的 RL\
  \ 算法处理。\n\n策略梯度方法不会同样的方式遭受这些问题。例如，状态的不确定性可能会降低策略的性能（如果没有使用额外的状态估计器），但策略的优化技术不需要改变。连续状态和动作可以像离散状态一样被处理，而且学习性能通常会提高。至少保证收敛到局部最优。\n\
  \n让我们假设控制系统是离散时间模式，并用 `k` 表示当前时间步。为了考虑到系统可能的随机性，我们使用概率分布 `x[k+1]` ∼ `p(x[k+1] |\
  \ x[k], a[k])` 来表示模型，其中 `a[k]`  ∈ ℝ(*M*) 表示当前动作，`x[k],` `x[k+1]`  ∈ ℝ(*N*) 分别表示当前状态和下一个状态。我们进一步假设动作是由策略\
  \ `a[k]` ∼ `π[θ]` (`a[k] | x[k]`) 生成的，其被建模为概率分布以包含探索性动作；对于某些特殊问题，控制问题的最优解实际上是一个随机控制器。假设策略由\
  \ `K` 个策略参数 `θ`  ∈ ℝ(*k*) 参数化。状态和动作的序列形成轨迹，记为 `τ` = (`x[0:T-1], a[0:T-1]`)，其中 `T`\
  \ 表示视野，可以是无限的。在本章中，我们将交替使用轨迹（trajectory）、历史（history）或采样（roll-out）这些词。在每个时刻，学习系统接收一个标记为\
  \ `r[k]`=`x[k], a[k]`  ∈ ℝ 的奖励。\n\n强化学习中策略优化的通用目标是优化策略参数 `θ`  ∈ ℝ(*M*)，使得期望收益：\n\
  \n```\nJ(\\theta) = E \\left[ \\sum\\limits_{t=0}^{T-1} \\gamma^t r_t \\right]\n\
  ```\n\n其中 `γ` 是折扣因子。如果 `T` 是无限的，则公式变为：\n\n```\nJ(\\theta) = E \\left[ \\sum\\limits_{t=0}^{\\\
  infty} \\gamma^t r_t \\right]\n```\n\n这里的 `E` 表示期望。\n\n（抱歉，原文在此处截断，根据提供的文本片段翻译如下）：\n\
  \n强化学习中策略优化的通用目标是优化策略参数 `θ`  ∈ ℝ(*M*)，使得期望收益：\n\n```\nJ(\\theta) = E \\left[ \\\
  sum\\limits_{t=0}^{T-1} \\gamma^t r_t \\right]\n```\n\n其中 `γ` 是折扣因子。如果 `T` 是无限的，则公式变为：\n\
  \n```\nJ(\\theta) = E \\left[ \\sum\\limits_{t=0}^{\\infty} \\gamma^t r_t \\right]\n\
  ```\n\n这里的 `E` 表示期望。\n\n\n\n\n\n在强化学习（RL）中，回合（episode）被视为从初始状态到最终状态的智能体环境交互。我们将总奖励定义为\
  \ G，为智能体与环境之间的交互在整个回合内提供的期望奖励。策略在整个回合内的期望回报定义为，例如，状态价值函数 `V^π(s)` 在状态 `s` 下遵循策略\
  \ `π` 时由 `E^π[G[t] | s[t] = s]` 提供。另一个例子是，如果奖励每个时间步按因子 `γ` ∈ [1,0] 折扣，则时间 $t$ 回报为\
  \ $\\sum_{t^{\\prime} = t}^{T}{\\gamma^{t^{\\prime} - t}r_{t}}$，其中 `T` 是回合结束时的步，期望回报可以计算为\
  \ $\\left( {{\\sum_{t^{\\prime} = t}^{T}{\\gamma^{t^{\\prime} - t}r_{t}}},} \\right)/T$。\n\
  \n# 13.10 V 价值函数 (V-VALUE FUNCTION)\n\n在整个调查中，我们考虑 RL 智能体的情况，其目标是找到一个策略 `π(s, a)`\
  \ ∈ Π，以便优化期望回报 `V^π(s)`：`S → R`（也称为 V 价值函数），使得：\n\n$$V^{\\pi}(s) = E\\left\\lbrack\
  \ {{\\sum\\limits_{k = 0}^{\\infty}\\gamma^{k}}r_{t + k} \\mid s_{t} = s,\\pi} \\\
  right\\rbrack$$\n\n其中，\n\n* `r[t]` = `E[a ∼ π(s[t],.)]R(s[t],a,s[t] + 1)]`\n* `P(s[t+1]\
  \ | s[t+1],a[t]) = T (s[t],a[t],s[t+1])` 其中 `a ∼ π(s[t],.)`\n\n注意，`V`-价值函数与 `A`-动作函数没有直接关系。根据期望回报的定义，最优期望回报可以定义为：\n\
  \n$$V^{*}(s) = \\max_{\\pi \\in \\Pi}V^{\\pi}(s)$$\n\n# 13.11 Q 价值函数 (Q-VALUE FUNCTION)\n\
  \n除了 V 价值外，还可以引入其他一些感兴趣的函数。Q 价值函数 `Q^π(s,a)`：`S × A → R` 定义如下：\n\n$$Q^{\\pi}(s,a)\
  \ = E\\left\\lbrack {{\\sum\\limits_{k = 0}^{\\infty}\\gamma^{k}}r_{t + k} \\mid\
  \ s_{t} = s,a_{t} = a,\\pi} \\right\\rbrack$$\n\n在马尔可夫决策过程（MDP）的情况下，可以使用贝尔曼方程递归地重写此方程：即时当前奖励\
  \ − `P(s′|s,a)*R(s,a,s′)` + 折扣未来奖励-`P(s′|s,a)*γV^(π)(s′)`。\n\n注意，\n\n$$\\begin{matrix}\
  \ {P\\left( {s^{\\prime} \\mid s,a} \\right) = T\\left( {s,a,s^{\\prime}} \\right)}\
  \ \\\\ {Q^{\\pi}(s,a) = {\\sum\\limits_{s^{\\prime} \\in S}T}}\\left( {s,a,s^{\\\
  prime}} \\right)\\left( {R\\left( {s,a,s^{\\prime}} \\right) + \\gamma Q^{\\pi}\\\
  left( {s^{\\prime},a = \\pi\\left( s^{\\prime} \\right)} \\right)} \\right)} \\\\\
  \ \\end{matrix}$$\n\n最优 Q 价值函数 `Q^π(s,a)` 也可以定义为：\n\n$$Q^{*}(s,a) = \\max_{a \\\
  in \\text{A}}Q^{\\pi}(s,a)$$\n\n注意，Q 价值函数与 `A`-动作函数直接相关。Q 价值函数与 V 价值函数相比的特殊之处在于可以直接从\
  \ `Q^*(s,a)` 获取最优策略：\n\n$$\\pi^{*}(s) = \\underset{a \\in A}{argmax}Q^{*}(s,a)$$\n\
  \n最优 V 价值函数 `V^*(s)` 是在每个状态 `s` 之后遵循策略 `π^(*)` 的期望折扣奖励。最优 Q 价值 `Q^*(s,a)` 是在每个状态\
  \ `s` 且对于给定动作 `a` 之后遵循策略 `π^(*)` 的期望折扣回报。也可以定义优势函数（Advantage Function）：\n\n`A^π(s,\
  \ a)` = `Q^π(s, a)` − `V^π(s, a)`\n\n# 13.12 拟合 Q 学习 (FITTED Q-LEARNING)\n\n拟合 Q\
  \ 学习算法是期望回报的近似器。在拟合 Q 学习（Gordon, 1996）中，Q 值用 `θ` 初始化并向目标更新：\n\n$$Y_{t} = E\\left(\
  \ \\left\\lbrack {{\\sum\\limits_{k = 0}^{\\infty}\\gamma^{k}}r_{t + k} \\mid s_{t}\
  \ = s,\\pi} \\right\\rbrack \\right)\n$$\n\n其中 `θ` 指初始参数。\n\n# 13.13 深度 Q 网络 (DEEP\
  \ Q-NETWORKS)\n\n深度网络所需的内存和计算量太高。深度网络算法被称为深度 Q 网络（DQN）。这一开发的关键思想是使用图 13.8 和 13.9\
  \ 所示的深度网络。\n\n之前将深度神经网络引入强化学习的尝试主要由于不稳定性而没有成功。深度神经网络在强化学习中容易产生过拟合。然而，DQN 算法通过使用两个网络解决了这些不稳定性：估计器（当前）Q\
  \ 网络和目标 Q 网络。目标网络的想法是使用目标网络中的参数来计算目标，这些参数在若干时间步内未进行更新。每隔时间步，目标网络都会与当前网络同步。此外，DQN\
  \ 使用回放内存缓冲区（Replay Memory buffer）来获得多样化且去相关的训练数据，通过存储智能体的所有经验并随机采样和重放。此外，还需要一个参数服务器来存储最新更新的参数，保持全局状态与目标网络以及估计器（当前）网络同步。\n\
  \n\n\n\n\n此外，Q-Network 通常针对一个冻结的目标网络进行优化，该网络每隔 `η` 步使用最新的权重 `w` 更新一次（其中 `η` 是一个称为学习率的超参数）。后者通过防止移动目标导致的短期震荡，使得训练更加稳定。前者处理了在线学习中出现的自相关性问题，而引入回放内存（replay\
  \ memory）使得该问题更像是一个监督学习问题。图 13.10 显示了整个 DQN 强化学习系统的整体完整示意图 [3]，该图不包含参数服务器。\n\n![FIGURE\
  \ 13.10 包含估计器 Q-网络、目标 Q-网络和回放内存的深度 Q-网络。](img/fig13_10.jpg)\n\nFIGURE 13.10 包含估计器\
  \ Q-网络、目标 Q-网络和回放内存的深度 Q-网络。\n\n当许多学习者/工作节点计算梯度时，DQN 的可扩展设计需要一个参数服务器(图 13.11)）。参数服务器维护全局共享的模型参数并聚合来自学习者/工作节点的更新。每个学习者/工作节点从服务器提取最新的模型参数，计算所有梯度并将其推回进行更新。由于这种方法通常减少了节点间的通信量，它可能会显著缩短训练时间。\n\
  \n![FIGURE 13.11 包含估计器 Q-网络、目标 Q-网络、回放内存和参数服务器的深度 Q-网络。](img/fig13_11.jpg)\n\nFIGURE\
  \ 13.11 包含估计器 Q-网络、目标 Q-网络、回放内存和参数服务器的深度 Q-网络。\n\n核心任务是设计一种同步策略，协调所有学习者（或工作节点）的执行进度。该同步策略决定了每一步（即每当某些学习者/工作节点推送梯度时）每个学习者/工作节点的状态（“运行”或“等待”），直到下一次更新到达参数服务器。因此，它直接决定了整体训练时间。在此背景下，我们添加了具有多个分片的参数服务器，在\
  \ DQN 计算架构中提供可扩展的高性能算法和数据结构。\n\n## 13.14 大规模并行 DQN 架构\n\n广义强化学习架构 (GORILA) [3] 是一种大规模分布的强化学习，如图\
  \ 13.11](#Ch13.xhtml#fig13_11)所示所示。图 13.11 与图 13.12 之间的区别在于：图 13.11 中的架构只包含一个执行者（actor）；然而图\
  \ 13.12 拥有大量的数量的执行者。\n\n![FIGURE 13.12 带有参数服务器的强化学习系统高层完整图。](img/fig13_12.jpg)\n\
  \nFIGURE 13.12 带有参数服务器的强化学习系统高层完整图。\n\n学习者包含一个 Q 网络的副本，其任务是计算 Q 网络参数所需的所需的更改。学习者从回放内存中读取存储经验的样本，并根据给定的强化学习算法更新值函数。例如，可以使用异步梯度下降\
  \ (ASGD) 的变体，这些变体需要更新 Q 网络的参数。\n\n具体而言，对于第 `k` 次更新，从本地或全局经验内存 `D[t] = {e[1], …,\
  \ e[t]}` 中采样一个小批次经验 `e[t] = (s[t], a[t], r[t], s[t]+1)`。DQN 维护两个独立的 Q-网络 `Q(s,a;θ)`\
  \ 和 `Q(s,a;θ−)`，分别带有当前参数 `θ` 和旧参数 `θ−`。当前参数 `θ` 在每个时间步中可能会更新多次，并在经过 `N` 次迭代后复制到旧参数\
  \ `θ−` 中。在每次更新的迭代 `i` 中，更新当前参数 `θ` 以通过优化以下 DQN 损失最小化相对于旧参数 `θ−` 的均方贝尔曼误差：\n\n$$L_{i}\\\
  left( \\theta_{i} \\right) = \\text{E}\\left[\\left[ {r + \\gamma\\max\\limits_{a^{\\\
  prime}}Q\\left( {s^{\\prime},a^{\\prime};\\\\theta^{-}} \\right. - Q\\left[ {s,a;\\\
  \\theta_{i}} \\right.} \\right^{2} \\right.$$\n\n对于每次更新 `i`，采样一个经验元组 `(s,a,r,s')\
  \ ∼ U(D)` 或一个小批次，通过随机梯度下降更新当前参数 `θ`。具体而言，`θ` 根据损失相对于 `θ` 的样本梯度 `g[i]` 的方向进行调整：\n\
  \n$$g_{i} = \\left( {r + \\gamma\\max\\limits_{a^{\\prime}}Q\\left( {s^{\\prime},a^{\\\
  prime};\\\\theta^{-}} \\right) - Q\\left {s,a;\\\\theta_{i}} \\right.} \\right)$$\n\
  \n最后，在每个时间步中，通过 `ε`-贪婪策略选择 `Q(s,a;θ)`。\n\n## 13.15 DDQN：双深度 Q 网络\n\n双深度 Q 网络 (DDQN)\
  \ 使用两个估计器 Q-网络和一个目标 Q-网络([图 13.13)。DDQN 是对单个 DQN 的改进，单个 DQN 会由于使用最大值作为目标值而引入正向偏置。DDQN\
  \ 通过将目标操作分解为动作选择和动作评估来减少这种高估。根据在线网络使用目标网络来估计其值。\n\n![FIGURE 13.13 DQN。](img/fig13_13.jpg)\n\
  \nFIGURE 13.13 DQN。\n\n### 15.1 背景\n\n为了解决序列决策问题，我们可以学习每个动作的优化估计值，定义为采取该动作并随后遵循优化策略的预期和。在给定策略\
  \ `π` 下，状态 `s` 动作的真实值为：\n\n$$Q_{\\pi}(s, a) \\equiv E[R[1]+\\gamma R[2]+…|S[0]=s,A[0]=a]$$\n\
  \n其中 `γ \\in [0,1]` 是折扣因子，用于权衡当前和未来奖励的重要性。此时，优化值为 `Q(s,a) = \\max[\\pi] Q_{\\pi}(s,a)`。从优化值可以很容易推导出优化策略。\n\
  \n优化动作值的估计可以通过 Q 学习来学习，它是时差学习的一种形式 [4]。大多数有趣的问题太大，无法单独学习所有状态的动作值。相反，我们可以学习参数化的值函数\
  \ `Q(s,a;θ[t])`。在状态 `S[t]` 采取 `A[t]` 并观察到立即奖励 `R[t]+1]` 和产生的状态 `S[t]+1]` 后，标准的 Q\
  \ 学习参数更新公式为：\n\n$$\\theta[t+1] = \\theta[t] + \\alpha(Y[t]^{Q} - Q(S[t],A[t];\\\
  theta[t]))\\nabla_{\\theta[t]}Q(S[t],A[t];\\theta[t])$$\n\n其中 `α` 是标量步长，且目标 `Y[t]^{Q}`\
  \ 定义为：\n\n$$Y_{t}^{Q} \\equiv R_{t+1} + \\gamma\\max_{\\alpha}Q(S_{t+1},a;\\theta_{t})$$\n\
  \n这种更新类似于随机梯度下降，将当前值 `Q(S[t],A[t];\\theta[t])` 向目标值 `Y[t]^{Q}` 更新。\n\n### 13.15.2\
  \ 深度 Q 网络 (DQN)\n\n\n\n\n\n深度 Q 网络（DQN）是一种多层神经网络，对于给定的状态 `s`，它输出一个动作值向量 `Q(s;\\\
  _;θ*)`，其中 `θ` 是网络的参数。对于 `n`-维状态空间和一个包含 `m` 个动作的动作空间，该神经网络是一个从 ℝ^(*n*) Rn 到 ℝ^(*m*)\
  \ 的函数。根据 [5\\]提出的 DQN 算法，两个重要要素是目标网络的使用和经验回放。目标网络的参数为 `θ`^−，与在线网络相同，不同之处在于参数每隔 `τ`\
  \ 步从在线网络复制一次，因此 `θ[t]`− = `θ[t]` 并在所有其他步骤保持固定。DQN 使用的目标为：\n\n$$Y_{t}^{DQN} \\equiv\
  \ R_{t + 1} + \\gamma\\max\\limits\\_{\\alpha}Q\\left( {S_{t + 1},a;\\theta_{t}^{-}}\
  \ \\right)$$\n\n对于经验回放，观测到的转移会被存储一段时间，并从该内存池中均匀采样以更新网络。目标网络和经验回放极大提升了算法的性能 [5\\\
  ]。\n\n### 13.15.3 双重深度 Q 网络 (DOUBLE DQN)\n\n在标准 Q-learning 和 DQN 的 max 操作符中，我们使用相同的值来同时选择和评估动作。这使得算法可能选择到被高估的值，导致过度乐观的价值估计。为了防止这一点，我们可以将选择与评估分离。这就是\
  \ Double Q-learning [6\\] 的核心思想。在原始的 Double Q-learning 算法中，通过随机分配每次经验来更新两个价值函数之一，从而学习两个价值函数，由此产生两组权重\
  \ `θ` 和 `θ′`。对于每次更新，使用一组权重来确定贪婪策略，使用另一组来确定其价值。为了进行清晰比较，我们可以首先解开 Q-learning 中的选择与评估，并将其目标重写为：\n\
  \n$$Y_{t}^{Q} \\equiv R_{t + 1} + \\gamma Q\\left( {S_{t + 1},\\underset{\\alpha}{argmax}Q\\\
  left( {S_{t + 1},a;\\theta_{t}} \\right)} \\right)$$\n\nDouble Q-learning 的 TD 误差可以写为：\n\
  \n$$Y_{t}^{DoubleDQN } \\equiv R_{t + 1} + \\gamma Q\\left( {S_{t + 1},\\underset{\\\
  alpha}{argmax}Q\\left( {S_{t + 1},a;\\theta_{t}} \\right);\\theta_{t}^{\\prime}}\
  \ \\right)$$\n\n注意，argmax 中的动作选择仍然源于在线权重 `θ[t]`。这意味着，与 Q-learning 一样，我们仍然是根据 `θ[t]`\
  \ 定义的当前值来估算贪婪策略的价值。然而，我们使用第二组权重 `θ[t]′` 来公正地评估该策略的价值。这第二组权重可以通过切换 `θ` 和 `θ′` 的角色来称对称地更新。\n\
  \nDDQN 智能体使用两个相同的估计器 DQN 网络（见图 13.16），它们的更新方式不同，因此持有不同的权重。第二个估计器 DQN 网络是过去某时刻主神经网络的副本——通常是上一个回合（episode）。DDQN\
  \ 中的损失函数如下：\n\n```\nL(θ[i]) = E[Y[t-Q[S[t],A[t];θ[t]]]]²]\n```\n\n参考 Double Q-learning\
  \ 和 DQN，我们将所得算法称为 Double DQN。它的更新方式与 DQN 相同，但将目标网络替换为 `Yt`。与 Double Q-learning 相比，第二个网络的权重被替换为目标网络的权重，用于评估当前贪婪策略。目标网络的更新保持与\
  \ DQN 不变，仍然是在线网络的周期性复制。这个版本的 Double DQN 也许是 DQN 向 Double Q-learning 改进的最小可能改变。目标是在获得\
  \ Double Q-learning 大部分收益的同时，保持 DQN 算法其余部分的完整，以便进行公平比较并具有最小的计算开销。\n\n在经验回放期间进行学习，就像\
  \ DQN 一样，而另一个模型是第一个模型上一个回合的副本。使用第二个模型计算 Q 值。在 DQN 中，Q 值是通过在下一个状态的最大 Q 值上加上奖励计算得到的。显然，如果每次为某个状态计算出的\
  \ Q 值都是高值，那么从该特定状态的神经网络输出获得的数值每次都会变得更高。每个输出神经元的值都会越来越高，直到每个输出值之间的差异变大。现在假设对于状态 `s`，动作\
  \ `a` 高于动作 `b`，那么每次对于 `s` 都会选择 `a`，以便让神经网络为状态 `s` 获得更高的值，而 `b` 才是更好的动作。DQN 已证明自己是处理离散空间环境和问题的强大算法。\n\
  \n### 13.16 神经拟合 Q 网络 (NFQ)\n\n神经拟合 Q 网络（NFQ）是拟合 Q 迭代（Fitted Q-Iteration）算法族的一种实例，其中回归通过多层感知器（MLP）实现。它包含两个主要步骤：\n\
  \n- 生成训练集 `P`\n- 在在多层感知器内训练这些模式\n\n多层感知器（MLP）是一类前馈人工神经网络（ANN）。其多层结构和非线性激活将 MLP 与线性感知器区分开来。在神经拟合学习（NFQ\
  \ [7\\]）中，状态可以作为 Q 网络的输入，并为每个可能的动作给出不同的输出。这提供了一种高效的结构，其优势是对于给定的 `s'`，可以通过神经网络的次前向传播获得\
  \ `max a'∈A Q(s',a';θ[k])`。Q 值使用神经网络参数化，参数 `θ[k]` 通过随机梯度下降（或变体）通过最小化平方损失来更新：\n\n\
  ```\nL(DQN) = (Q(s,a;θ[k])−Yt)²\n```\n\n因此，Q-learning 更新导致参数更新：\n\n```\nθ[k+1] = θ[k] + α(Yt—Q(s,a;θ[k]))∇[θ[k]]Q(s,a;θ[k])\n\
  ```\n\n其中 `α` 是称为学习率的标量步长。注意，使用平方损失并非偶然。事实上，它确保了 `Q(s,a;θ[k])` 无偏地趋向于随机变量 `Yt` 的期望值（注意：E[[Z−c\\\
  ]\\] 的最小值发生在常数 *c* 等于随机变量 *Z* 的期望值时）。因此，在假设神经网络适用于任务且数据集 `D` 中收集的经验足够的情况下，经过多次迭代，`Q(s,a;θ[k])`\
  \ 应该趋向于 `Q(s,a)`。\n\n\n\n\n请注意，即使是使用线性回归的拟值迭代也可能发散。然而，当使用仅具有插值能力的线性函数近似器时，这种缺陷不会发生，例如基于核（核意味着多项式的线性化）的回归器（`k`-`nearest\
  \ neighbors`、线性和多线性插值等）或基于树的集成方法 [8]。尽管如此，这些方法尚未被证明能够成功处理高维输入。因此，方程中贝尔曼算子的收缩映射性质：\n\
  \n$$(BK)(s,a) = {\\\\sum\\\\limits\\_{s^{\\\\prime} \\\\in S}T}\\\\left( {s,a,s^{\\\
  prime}} \\\\right)\\\\left( {R\\\\left( {s,a,s^{\\prime}} \\\\right. + \\\\gamma\\\
  \\max\\\\limits\\_{a^{\\\\prime} \\\\in A}K\\\\left( {s^{\\\\prime},a^{\\\\prime}}\
  \ \\\\right.} \\\\right.$$  \n\n不足以保证收敛。\n\n实验验证，这些误差可能会随着这种更新规则而传播，导致收敛可能缓慢甚至不稳定\
  \ [7]。使用函数近似器的另一个相关副作用是由于 max 算子的存在，Q 值往往会被高估计 [6]。由于不稳定性和过度估计的风险，已经采取了特定措施以确保适当的训练。\n\
  \n# 13.17 优势 Actor-CRITIC 网络\n\n在强化学习（RL）中，我们通常希望增加轨迹中动作的概率，使其与奖励回报的高度成正比。策略梯度算法是一种策略迭代方法，通过直接操控策略来达到最大期望回报的最优策略。例如，策略梯度（PG）可以描述如下：\n\
  \n$$\\nabla\\_{\\theta}J(\\theta) = \\text{E}\\_{\\\\tau}\\\\left\\\\lbrack {{\\\
  \\sum\\\\limits\\_{t = 0}^{T - 1}\\\\nabla\\\\_{\\theta}}\\\\log\\\\pi\\\\_{\\theta}\\\
  \\left\\\\lbrack {a\\\\_{t} \\\\mid s\\\\_{t}} \\\\right\\\\rbrack G\\\\_{t}} \\\
  \\right\\\\rbrack$$\n\n然而，策略梯度的方差可能很高。优势函数可以显著降低策略梯度的方差。我们已经看到优势函数的定义如下：\n\n$$\\\
  begin{matrix} {A^{\\\\pi}\\\\left( {s\\\\_{t},a\\\\_{t}} \\\\right) = Q^{\\\\pi}\\\
  \\left( {s\\\\_{t},a\\\\_{t}} \\\\right) - V^{\\\\pi}\\\\left( s\\\\_{t} \\\\right)}\
  \ \\\\\\\\ {L\\\\_{i}\\\\left( \\\\theta\\\\_{i} \\\\right) = \\\\text{E}\\\\left\\\
  \\lbrack \\\\left\\\\lbrack {r + \\\\gamma\\\\max\\\\limits\\\\_{a^{\\\\prime}}Q\\\
  \\left\\\\lbrack {s^{\\\\prime},a^{\\\\prime};\\\\theta^{-}} \\\\right\\\\rbrack\
  \ - Q\\\\left\\\\lbrack {s,a;\\\\theta\\\\_{i}} \\\\right\\\\rbrack} \\\\right\\\
  \\rbrack^{2} \\\\right\\\\rbrack} \\\\matrix} $$\n\n我们将这种方法称为单步 Q-learning，因为它将动作值\
  \ `Q(s,a)` 向单步回报 `r+γ max*[a], Q(s′,a′;θ^−)` 更新。\n\n使用单步方法的一个缺点是，获得奖励 `r` 仅直接影响导致该奖励的状态动作对\
  \ `(s, a)` 的值。其他状态动作对的值仅通过更新后的值 `Q(s,a)` 间接影响。这可能导致学习过程变慢，因为需要许多更新才能将奖励传播到相关的先前状态和动作。加速奖励传播的一种方法是使用\
  \ `n`-步回报。在 `n`-step Q-learning 中，`Q(s,a)` 向定义的 `n`-步回报更新：\n\n$$r\\\\_{t} + \\\\\
  gamma r\\\\_{t + 1} + \\\\ldots + \\\\gamma^{n - 1}r\\\\_{t + n - 1} + \\\\max\\\
  \\limits\\\\_{a}\\\\gamma^{n}Q\\\\left( {s\\\\_{t + n},a} \\\\right)$$\n\n这导致单个奖励\
  \ `r` 直接影响 `n` 个先验状态动作对的值。这使得奖励传播到相关状态动作对的过程可能高效得多。与基于价值（Value-Based）的方法相比，基于策略的无模型（Policy-Based\
  \ Model-Free）方法直接参数化策略 `π(a|s;θ)`并通过对 `E[R[t]]` 执行（通常是近似的）梯度上升来更新参数 `θ`。此类方法的一个例子是\
  \ RL 算法族。标准 RL 在方向 `∇[θ] log πθR[t]` 上更新策略参数 `θ`（注意我们同时使用了 `R` 和 `G` 来表示累计奖励），它是\
  \ `∇[θ] E[R[t]]` 的无偏估计。可以通过从回报中减去一个已知的基线（baseline）状态学习函数 `bt` [9]，在保持无偏的同时减少该估计的方差。所得梯度为\
  \ `∇[θ]logπθ(R[t]bt)`。\n\n\n\n\n我们随后通过最小化损失函数来回归我们的输出：\n\n$$L(\\theta) = {\\\\sum\\\
  \\limits\\_{t = 0}^{T}\\\\left( {y\\_{t} - V\\\\left( s\\_{t} \\right)} \\\\right)^{2}}$$\
  \  \n\n同样，如果环境是回合制的（episodic），我们可以直接使用经验回报：\n\n$$L(\\theta) = {\\\\sum\\\\limits\\\
  _{t = 0}^{T}\\\\left( {G\\_{t} - V\\\\left( s\\_{t} \\right)} \\\\right)^{2}}$$\
  \  \n\n我们还可以将策略梯度泛化如下：\n\n$$\\nabla\\_{\\theta}J(\\theta) = \\text{E}\\_{\\tau}\\\
  \\left\\\\lbrack {{\\\\sum\\\\limits\\_{t = 0}^{T - 1}\\\\nabla\\_{\\theta}}\\\\\
  log\\\\pi\\_{\\theta}\\\\left\\\\lbrack {a\\_{t} \\\\mid s\\_{t}} \\\\right\\\\\
  rbrack⥁\\\\_{t}} \\\\right\\\\rbrack$$  \n\n其中 Ψ[`t`] 是其中之一：\n\n$$\\begin{matrix}\
  \ {R\\_{t} = {\\\\sum\\\\limits\\_{k = t}^{T}r\\_{k}}} \\\\\\\\ {G\\_{t} = {\\\\\
  sum\\\\limits\\_{k = t}^{T}\\\\gamma^{k - t}}r\\_{k}} \\\\\\\\ {Q^{\\pi}\\\\left(\
  \ s\\_{t} \\right)} \\\\\\\\ {A^{\\pi}\\\\left( {s\\_{t},a\\_{t}} \\\\right) = Q^{\\\
  pi}\\\\left( {s\\_{t},a\\_{t}} \\\\right) - V^{\\pi}\\\\left( s\\_{t} \\right)}\
  \ \\\\\\\\ {\\\\text{~TemporalError~:~}\\\\delta\\_{t}^{\\pi} = r\\_{t} + \\\\gamma\
  \ V^{\\pi}\\\\left( s\\_{t + 1} \\\\right) - V^{\\pi}\\\\left( s\\_{t} \\\\right)}\
  \ \\\\\\\\ \\\\end{matrix}$$  \n\n我们可以将价值函数的 `n` 步贝尔曼方程展开如下：\n\n$$V^{\\pi}\\\\left(\
  \ s\\_{t} \\\\right) = E\\_{r}\\\\left\\\\lbrack {G\\_{t} \\\\mid s\\_{t}} \\\\\
  right\\\\rbrack = E\\_{r}\\\\left\\\\lbrack {r\\_{t} + \\\\gamma r\\_{t + 1} + \\\
  \\gamma^{2}r\\_{t + 2} + \\\\ldots \\\\mid s\\_{t}} \\\\right\\\\rbrack = E\\_{r}\\\
  \\left\\\\lbrack {r\\_{t} + \\\\gamma r\\_{t + 1} + \\\\gamma^{2}r\\_{t + 2} + \\\
  \\ldots + \\\\gamma^{n}V^{\\pi}\\\\left\\\\lbrack s\\_{t + n} \\\\right\\\\rbrack\
  \ \\\\mid s\\_{t}} \\\\right\\\\rbrack = E\\_{r}\\\\left\\\\lbrack {{\\\\sum\\\\\
  limits\\_{k = t}^{n - 1}\\\\gamma^{k - t}}r\\_{k} + \\\\gamma^{n}V^{\\pi}\\\\left\\\
  \\lbrack s\\_{t + n} \\\\right\\\\rbrack} \\\\right\\\\rbrack$$  \n\n`n`-步 TD 误差（TD-error）定义如下：\n\
  \n$$\\delta\\_{t}^{n} = \\\\left\\\\lbrack {{\\\\sum\\\\limits\\_{k = t}^{n - 1}\\\
  \\gamma^{k - t}}r\\_{k} + \\\\gamma^{n}V^{\\pi}\\\\left\\\\lbrack s\\_{t + n} \\\
  \\right\\\\rbrack} \\\\right\\\\rbrack - V^{\\pi}\\\\left( s\\_{t} \\\\right)$$\n\
  \n然而，这实际上等于 1-步 TD 误差的折现之和：\n\n$$\\begin{array}{ll} \\\\delta\\_{t}^{n} & \\\\left\\\
  \\lbrack {{\\\\sum\\\\limits\\_{i = 0}^{n}\\\\gamma^{i}}\\\\delta\\_{t + i} = \\\
  \\delta\\_{t} + \\\\gamma\\\\delta\\_{t + 1} + \\\\gamma^{2}\\\\delta\\_{t + 2}\
  \ + \\\\ldots \\\\right\\\\rbrack &= r\\_{t} + \\\\gamma\\\\left( {V^{\\pi}\\\\\
  left( s\\_{t + 1} \\\\right) - V^{\\pi}\\\\left( s\\_{t} \\\\right)} \\\\right)\
  \ + \\\\gamma\\\\left( {r\\_{t + 2} + V^{\\pi}\\\\left( s\\_{t + 2} \\\\right) -\
  \ V^{\\pi}\\\\left( s\\_{t + 1} \\\\right)} \\\\right) + \\\\gamma^{2}\\\\left(\
  \ {r\\_{t + 3} + V^{\\pi}\\\\left( s\\_{t + 3} \\\\right) - V^{\\pi}\\\\left( s\\\
  _{t + 2} \\\\right)} \\\\right) + \\\\ldots + \\\\gamma^{n}\\\\left( {r\\_{t + n}\
  \ + V^{\\pi}\\\\left( s\\_{t + n} \\\\right) - V^{\\pi}\\\\left( s\\_{t + n - 1}\
  \ \\\\right)} \\\\right) &= \\\\left\\\\lbrack {{\\r\\_{t} + \\\\gamma r\\_{t +\
  \ 1} + \\\\gamma^{2}r\\_{t + 2} + \\\\gamma^{3}r\\_{t + 3} + \\\\ldots + \\\\gamma^{n}V^{\\\
  pi}\\\\left( s\\_{t + n} \\\\right)} \\\\right\\\\rbrack - V^{\\pi}\\\\left( s\\\
  _{t} \\\\right) &= \\\\left\\\\lbrack {{\\\\sum\\\\limits\\_{i = t}^{n - 1}\\\\\
  gamma^{i - t}}r\\_{i}} \\\\right) + \\\\gamma^{n}V^{\\pi}\\\\left\\\\lbrack s\\\
  _{t + n} \\\\right\\\\rbrack - V^{\\pi}\\\\left( s\\_{t} \\\\right) \\\\end{array}$$\n\
  \n价值函数消去后剩下 `n`-步 TD 误差。\n\n同样，我们可以使用 `n`-步 TD 误差作为优势估计 `A[n]`。泛化优势估计（GAE）`An` 仅仅是这些\
  \ `n`-步估计 `An` 的指数加权平均：\n\n$$\\begin{array}{ll} {{\\\\check{A}_{n}^{G}(\\gamma,\\\
  \\lambda)} & = (1 - \\\\lambda)\\\\left\\\\lbrack {{\\\\check{A}_{1}\\\\left( s\\\
  _{t} \\\\right) + \\\\lambda{\\check{A}_{2}\\\\left( s\\_{t + 1} \\\\right) + \\\
  \\lambda^{2}{\\smile{A}_{3}}\\\\left( s\\_{t + 2} \\\\right) + \\\\ldots} \\\\right\\\
  \\rbrack} &= (1 - \\\\lambda)\\\\left\\\\lbrack {{\\\\delta\\_{t}^{\\pi} + \\\\\
  lambda\\\\left {{\\\\delta\\_{t + 1}^{\\pi} \\\\right] + \\\\lambda^{2}\\\\left\
  \ {{\\\\delta\\_{t + 2}^{\\pi} \\\\right] + \\\\ldots} \\\\right\\\\rbrack} &= (1\
  \ - \\\\lambda)\\\\left\\\\lbrack {{\\\\delta\\_{t}^{\\pi}\\\\leftlbrack {1 + \\\
  \\lambda + \\\\lambda^{2} + \\\\ldots} \\\\right. + \\\\delta\\_{t + 1}^{\\pi}\\\
  \\leftlbrack {\\\\lambda + \\\\lambda^{2} + \\\\lambda^{3}...ldots} \\\\right.}\
  \ \\\\right.\\\\left. {+ \\\\delta\\_{t + 2}^{\\pi}\\\\left. {\\\\lambda^{2} + \\\
  \\lambda^{3} + \\\\lambda^{4}...ldots} \\\\right]\\\\rbrack + \\\\ldots} \\\\right\\\
  \\rbrack} &= (1 - \\\\lambda)\\\\left\\\\lbrack {{\\\\left\\\\lbrack {{\\\\delta\\\
  _{t}^{\\pi}\\\\frac{1}{1 - \\\\lambda}} \\\\right\\\\rbrack} + \\\\left\\\\lbrack\
  \ {{\\\\delta\\_{t + 1}^{\\pi}\\\\frac{\\\\lambda}{1 - \\\\lambda}} \\\\right\\\\\
  rbrack} + \\\\left\\\\lbrack {{\\\\delta\\_{t + 2}^{\\pi}\\\\frac{\\\\lambda^{2}}{1\
  \ - \\\\lambda}} \\\\right\\\\rbrack + \\\\ldots} \\\\right\\\\rbrack} = {{\\\\\
  sum\\\\limits\\_{i = 0}^{\\\\infty}{(\\gamma\\\\lambda)}^{i}}\\\\delta\\_{t + i}^{\\\
  pi}} \\\\\\\\ \\\\end{array}$$\n\n因此，`λ` 可以让我们在使用 TD 误差作为优势函数与使用经验回报减去 `V^π` 之间进行插值。通过使用高\
  \ `λ` 值，我们通过对未来进行更少的折使用了更大的项和。这给了我们较小的估计，但波动性更大。同样，低 `λ` 值通过对未来进行更多的折现使用了较小的项和。这给了我们偏差较大的估计，但波动性更小。\n\
  \n**actor-critic** 算法是一种使用函数估计代替经验回报的策略梯度算法。**actor**（演员）是策略 `π(a | s)`，而 **critic**（评论家）通常是价值函数\
  \ `V^π(s)`。**advantage actor-critic** 只是使用优势 `A^π(s,a)` 代替 `V^π(s)` 的 actor-critic。优势可以使用任何描述的方法进行估计。为了我们的目的，我们将使用\
  \ GAE 作为优势，并使用经验回报来拟合我们的 `V[ϕ]` 网络。\n\n## 13.18 异步优势 actor-critic 网络\n\n异步优势 actor-critic\
  \ (A3C) 网络实现了并行训练，其中并行环境中的多个工作节点独立更新具有优势、演员和评论家函数的全局价值函数。\n\n### 13.18.1 异步优势评论家\n\
  \n异步优势 actor-critic (A3C) [5] 维护一个策略 `π(a | s;θ)` 和价值函数的估计 `V(s;θ[v])`。与我们的 n-步\
  \ Q 学习变体一样，我们的 actor-critic 变体也在前向视图运行，并使用相同的 n-步回报来更新策略和价值函数。\n\n\n\n\n与基于价值（Value-Based）的方法一样，我们依赖并行执行学习者（actor-learners）和累积更新来提高训练稳定性。注意，虽然为了通用性，策略参数\
  \ `θ` 和价值函数参数 `θ[v]` 显示为分离，但在实践中我们总是共享某些参数。我们通常使用卷积神经网络，它为策略 `π(a[t] | s[t];θ)`\
  \ 有一个 SoftMax 输出，为价值函数 `V(s[t];θ[v])` 有一个线性输出，且所有非输出层都是共享的。\n\n我们还发现，将策略 `π` 的熵加入目标函数可以改进探索能力，因为它通过防止过早收敛到次优的确定性策略来实现这一点。这种技术对于需要分层行为的任务特别有用。包含熵正则化项的完整目标函数对策略参数的梯度取如下形式：\n\
  \n∇[*θ*^′]logↆ*π*(*a*[*t*]∣*s*[*t*];*θ*^′)(*R*[*t*−]*V*(*s*[*t*];*θ*[*v*])+*β*∇[*θ*^′]*H*(*π*(*s*[*t*];*θ*^′)))\
  \  \n\n其中 `H` 是熵。超参数 `β` 控制熵正则化项的强度。我们使用了标准的非中心化均方根传播（RMSProp）更新：\n\n$$\\left. g\
  \ = \\alpha g + (1 - \\alpha)\\Delta\\theta^{2}\\text{~and~}\\theta\\leftarrow\\\
  theta - \\eta\\frac{\\Delta\\theta}{\\sqrt{g + \\epsilon}} \\right.$$  \n\n其中所有操作都是逐元素执行的。对\
  \ Atari 2600 子集的比较表明，统计量 `g` 线程共享的 RMSProp 变体比其他两种方法要健壮得多。\n\n我们介绍了四种标准强化学习算法的异步版本，并证明了它们能够以稳定的方式在各种领域训练神经网络控制器。我们的结果表明，在我们提出的框架中，通过基于价值和基于策略的方法、离策略（off-policy）以及同策略（on-policy）方法，以及离散和连续领域，通过强化学习进行神经网络稳定训练都是可能的。在使用\
  \ 16 个 CPU 核心在 Atari 领域进行训练时，所提的异步算法比在 Nvidia K40 GPU 上训练的 DQN 更快，其中 A3C 在一半的训练时间内超过了当前的先进水平。\n\
  \n我们的主要发现之一是，使用并行执行学习者更新共享模型对我们考虑的三种基于价值方法的学习过程具有稳定作用。虽然这表明在没有经验回放（DQN 为此目的使用了经验回放）的情况下稳定的在线\
  \ Q-learning 是可能的，但这并不意味着经验回放没有用。将经验回放整合到异步强化学习框架中可以通过重用旧数据大幅提高这些方法的数据效率。这反过来可能导致在\
  \ TORCS 等领域中更快的训练速度，在这些领域中与环境交互的成本高于更新我们所使用的模型。\n\n将其他现有的强化学习方法或深度强化学习的最新进展与我们的异步框架相结合，为提出的方法提供了立即改进的许多可能性。（注：原文后续存在大量重复的段落，已根据要求提取核心内容并翻译）\n\
  \n\n\n\n由于对决网络（dueling network）的输出是一个 `Q` 函数，可以使用许多现有的算法对其训练，例如 `DDQN` 和状态-动作-奖励-状态-动作\
  \ (`SARSA`) [1]。此外，它可以利用这些算法的任何改进，包括更好的回放内存、更好的探索策略、内在动机等。结合两个全连接层流以输出 `Q` 估计值的模块需要非常周全的设计。从优势表达式来看，我们有：\n\
  \n`Q^π(s[t], a[t]) = A^π(s[t], a[t]) + V^π(s[t])`\n\n对于状态价值，我们有：\n\n`V^π(s[t]) =\
  \ E[a ~ π(s)][Q^π[s[t], a[t]]]`\n\n得出：\n\n`A^π(s[t], a[t]) = 0`\n\n对于确定性策略，`a^(*)\
  \ = arg max[a[t + 1] ∈ A]Q^π(s[t], a[t + 1])`，得出 `Q^π(s[t], a*) = V^π(s[t])`，因此\
  \ `A^π(s[t], a*) = 0`。\n\n注意某些符号的变化：`t′ ≡ t + 1`，任何没有时间符号的项均表示当前时间 `t`。让我们考虑图 13.17\
  \ 所示的对决网络，我们让一个全连接层流输出一个标量 `V(s; θ, β)`，另一个流输出一个 `|A|` 维向量 `A(s, a*; θ, α)`。这里，`θ`\
  \ 表示卷积层的参数，而 `α` 和 `β` 是两个全连接层流的参数。根据优势的定义，我们可能会倾向于如下构建聚合模块：\n\n`Q(s, a; θ, α, β)\
  \ = V(s; θ, β) + A(s, a; θ, α)`\n\n注意，该表达式适用于所有的 (s; a) 实例；也就是说，为了用矩阵形式表示方程 (7)，我们需要将标量\
  \ `V(s; θ, β)` 复制 `|A|` 次。然而，我们需要记住，`Q(s, a; θ, α β)` 只是对真实 `Q` 函数的参数化估计。此外，如果得出\
  \ `V(s; θ, β)` 是状态价值函数的良好估计器，或者同样 `A(s, a; θ, α)` 提供了优势函数的合理估计，将是错误的。\n\n`Q(s, a;\
  \ θ, α β)` 的方程在意义上是不可识别的，因为给定 `Q`，我们无法唯一地恢复 `V` 和 `A`。为了证明这一点，给 `V(s; θ, β)` 加上一个常数并从\
  \ `A(s, a; θ, α)` 中减去相同的常数。这个常数会抵消，导致相同的 `Q` 值。这种不可识别性的缺失在直接使用该方程时表现为糟糕的实际性能。\n\n\
  为了解决这个可识别性问题，我们可以强制优势函数估计器在所选动作上具有零优势。也就是说，我们让网络的最后一个模块实现前向映射：\n\n$$\nQ(s,a;\\theta,\\\
  alpha,\\beta) = V(s;\\theta,\\beta) + \\left\\lbrack {A(s,a;\\theta,\\alpha) - \\\
  max\\limits_{a^{\\prime} \\in |\\mathcal{A}|}A\\left\\lbrack {s,a^{\\prime};\\theta,\\\
  alpha} \\right\\rbrack} \\right\\rbrack\n$$\n\n现在，对于 `a* = arg max[a′∈ A]Q(s, a';\
  \ θ, α, β) = arg max[a′∈ A]A(s, a'; θ, α, β)`，我们得到 `Q(s, a*; θ, α, β) = V(s; θ,\
  \ β)`。因此，流 `V(s; θ, β)` 提供了价值函数的估计，而另一个流产生优势函数的估计。另一种模块将最大值算子替换为平均值：\n\n```$$\n\
  Q(s,a;\\theta,\\alpha,\\beta) = V(s;\\theta,\\beta) + \\left\\lbrack {A(s,a;\\theta,\\\
  alpha) - \\frac{1}{\\left| A \\right|}{\\sum\\limits_{a^{\\prime}}}A}\\left\\lbrack\
  \ {s,a^{\\prime};\\theta,\\alpha} \\right\\rbrack} \\right\\rbrack\n$$\n\n一方面，这丢失了\
  \ `V` 和 `A` 的原始语义，因为它们现在偏离目标一个常数；但另一方面，它增加了优化的稳定性：优势的变化只需要像均值一样快即可，而不需要补偿最优动作优势的任何变化。我们还尝试了\
  \ `SoftMax`，但发现提供的结果与更简单的模块相似。\n\n注意，虽然在 `Q(s, a; θ, α, β)` 中减去平均值有助于可识别性，但它不会改变\
  \ `A`（从而是 `Q`）值的相对排名，从而保留了任何基于 `Q` 值的贪婪或 `ϵ` 贪婪策略。在行动时，只需评估优势流即可做出决策。\n\n重要的是，`Q(s,\
  \ a; θ, α, β)` 被视为并实现为网络的一部分，而不是一个独立的算法步骤。对决网络的训练、`DDQN` 和 `SARSA` [1] 已经过解释。\n\n\
  ## 13.20 总结\n\n我们详细描述了强化学习。RL 是人工智能领域的主导领域之一。之前描述的每个 RL 网络都需要深入关注。\n\n## 参考文献\n\n\
