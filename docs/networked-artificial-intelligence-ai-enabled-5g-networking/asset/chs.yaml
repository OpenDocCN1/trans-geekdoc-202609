  \n\n\n\n\n## 18.1 概述\n\n第五代（5G）蜂窝网络是最先进的无线技术，正在彻底改变所有的无线系统。5G 的核心目标是增加网络容量、提高数据传输率并降低端到端延迟。因此，5G\
  \ 可以支持许多设备连接到互联网，并实现物联网（IoT）愿景。尽管 5G 为移动无线网络提供了显著的特性，但仍有一些挑战需要解决。虽然 5G 为移动无线网络提供了宝贵的能力，但某些特定问题仍需解决。我们将彻底介绍\
  \ 5G 技术，详细阐述其需求、基础设施、特性和困难。第五代（5G）无线网络已实现约每秒 20 GB 字节的峰值数据速率，大约是 4G 能力的 20 倍（参见表\
  \ 18.1）。虽然 5G 网络使用了基于 AI 的应用，但尚未使用基于 AI 的路由器或交换技术。\n\n### 表 18.1 4G 和 5G 技术关键性能参数\n\
  \n| 关键性能参数 (KPPs) | 第四代 (4G) 无线技术 | 第五代 (5G) 无线技术 | 备注 |\n| --- | --- | --- | ---\
  \ |\n| 延迟 | 10 毫秒 | 小于 1 毫秒 | 5G 网络在使用某些 AI 应用，但网络中没有基于 AI 的路由器或交换机。 |\n| 数据流量 |\
  \ 每每月 7.2 兆字节（2021 年） | 每秒 50 兆字节（2021 年） | |\n| 峰值数据速率 | 每秒 1 Gigabit | 每秒 20 兆字节\
  \ | |\n| 可用频谱 | 3 GHz | 30 GHz | |\n| 连接密度 | 每平方公里 10,000 万次连接 | 每平方公里 100 万次连接\
  \ | |\n\n从表 18.1 可以看出，5G 准备提供海量的连接、可靠性、低延迟以及高移动带宽。5G 的另一个关键能力是使用托管在可重用网络基础设施平台上的软件化服务。基于市场细分、虚拟化服务和其他服务的网络服务功能（NSFs）需要通过自动化提供，这意味着需要使用\
  \ AI/ML/DL 技术来实现这些服务。就目前现状而言，AI 被设计为外部网络功能（NF），这是一种事后服务，而不是核心网络功能。5G 在多个维度上对 4G\
  \ 服务进行了改进：\n\n*   **增强型移动宽带 (eMBB)：** 规定了更高的数据传输率。对于下行链路，户外提供高达 50 Mbps 的速率，室内（5GLAN）提供\
  \ 1 Gbps，这些值的一半可用于上行链路。目前已经考虑了几个案例研究，其中包括航空领域——eMBB 正在帮助为空中飞行提供 1.2 Gbps 的比特率。\n\
  *   **关键通信 (CC) 和极高可靠低延迟通信 (URLLC)：** 在某些语境下，期望极高的可靠性。例如，对于过程自动化的远程控制，预计可靠性达到 99.9999%，用户体验数据速率高达\
  \ 100 Mbps，且端到端延迟远小于 50 毫秒。这是通过边缘计算能力提供的。\n*   **海量物联网 (mIoT)：** 多个场景要求 5G 系统支持极高的设备流量密度。海量物联网的需求包括运营方面，适用于\
  \ 5G 时间跨度内预期的广泛物联网设备和服务。\n*   **灵活网络运营：** 多个场景要求 5G 系统支持极高的设备流量密度。\n\n\n\n\n\n*\
  \   `RAN3`—通用地面无线接入网络 (UTRAN)/演进通用无线接入网络 (E-UTRAN)/下一代无线接入网络 (NG-RAN)，包括云无线接入网络\
  \ (C-RAN) 架构相关的网络接口。\n*   `RAN4`—无线性能和协议方面。\n*   `RAN5`—移动终端一致性测试。\n\n研究刚刚开始，在撰写此时，我们只能提供初步的考虑。根据收到的\
  \ `RAN` 授权，我们的研究重点关注功能以及相应的输入和输出类型（从 `RAN`、核心网络和终端收集的大量数据），以及对现有节点和接口的潜在影响；详细的 AI/ML\
  \ 算法不属于 `RAN3` 的范畴。C-RAN 是 RAN 基带软件与 RAN 基带硬件的分离。该基带软件可以运行在任何具备能力的商用现货 (COTS) 硬件上，无论是否集成了加速器，并利用云原生工具和流程来管理软件和硬件。\n\
  \n在 `RAN3` 定义的 `RAN` 架构中，本研究优先考虑 NG-RAN，包括演进通用地面无线接入新无线双连接 (EN-DC)。在用例方面，小组已同意从节能、负载均衡和移动性优化开始。尽管避免自组织优化网络\
  \ (SON) 重复的重要性已得到，但随着研究的进行，可能会根据公司的贡献讨论额外的用例。目标是在当前的 NG-RAN 架构内定义一个 AI/ML 框架，且正在讨论的\
  \ AI/ML 工作流不应防止在用例所需的“超越性思考”。\n\n覆盖内模式（In-Coverage Mode），5G 网络通过将 5G RAN 与长期演进 (LTE)\
  \ 演进数据包核心 (EPC) 配对来提供更高的数据传输速度。请注意，5G RAN 仍然依赖 4G 核心网络来管理控制和信号信息，且 4G RAN 继续运行，这被称为非独立网架构\
  \ (NSA)。通过利用 4G 网络的现有基础设施，运营商可以提供更快、更可靠的增强移动宽带 (eMBB)，而无需完全重构其核心网络技术并向客户推销新设备。非独立网\
  \ 5G 为运营商和客户共同提供了一个过渡平台。\n\n还考虑大规模部署 5G 继继节点以增强网络容量、覆盖范围和能量效率，因此可能会出现许多 5G 继继网络的部署变体。继继网络需要巧妙地解决电源问题。例如，为\
  \ 5G 网络提出了一种无线供电的 28 GHz 相列阵继继收发器，它可以无需任何外部电源工作。\n\n另一方面，独立网 5G 带来了比以前任何时候都更快、更可靠且功能强大的通信。独立网模式运营商面临的物流、财务和运营挑战将消耗大量时间和资金来使用\
  \ 5G 技术升级基础设施。独立网模式提供了直接设备到设备 (D2D) 通信，即动态点对点 (P2P) 通信，相对于客户端/服务器 (C/S) 模式。这是 5G\
  \ 网络架构的一个强大概念，因为它不依赖于 LTE EPC 运行。\n\n## 18.3 5G 无线接口\n\n5G 新无线电 (NR) 的开发是为了在灵活性、扩展性和效率方面（包括功率使用和频谱）提供显著增强。5G\
  \ 新无线电可以为视频流等极高带宽传输提供通信，为远程控制车辆通信提供低延迟通信，并为机器类型通信提供低数据速率低带宽通信。用于 5G 的新无线电有几个基石：\n\
  \n*   **新无线电频谱：** 移动通信的使用正在迅速增加，5G 的引入将加速这一趋势，该技术将容纳更多应用。虽然频谱效率将得到提高，但无法满足使用量的巨大增长，因此需要更多频谱。Release\
  \ 15 还概述了若干组专门针对 NR 的新频谱。针对立即部署的几个频段范围在 2.5 GHz 到 40 GHz 之间，其中区域的 3.3 GHz 到 3.8\
  \ GHz 频谱已在美国、欧洲和某些亚洲国家发布，最早在 2018 年即可部署。40 GHz 以下的其他高频段也为 5G 预留，但讨论频率高达 86 GHz。高频段的优势是它们更宽，允许更高的信号带宽并支持更高的数据吞吐量。在某些方面的缺点是范围较短，但这也是一个优势，因为它允许更大的频率复用。\n\
  *   **优化 OFDM：** 早期决定将 OFDM 作为 5G 第一阶段的波形。它在 4G、较新的 Wi-Fi 标准以及许多系统中已非常成功地使用，并成为\
  \ 5G 各种应用的最优波形类型。凭借 5G 额外的处理能力可以应用各种形式的优化。\n*   5G NR 下行链路使用的特定 OFDM 版本是循环前缀 OFDM\
  \ (`CP-OFDM`)，这与 LTE 采用的波形相同。。\n*   **波束赋形：** 波束赋形是近年来成为现实的一种技术，它为 5G 提供了一些显著优势。波束赋形使基站波束指向移动终端。通过这种方式，可以将最优信号传输到移动终端并从中接收，同时减少对其他手机的干扰。向更高频率移动允许使用更小的天线以及可编程高方向性的可能。在\
  \ 24 GHz 以上频率上，天线更小，可能具有高性能波束成形天线，能够准确将功率引导至手机并在该方向提供接收增益。\n*   **MIMO：** 多输入多输出已应用于从\
  \ Wi-Fi 到当前 4G 蜂窝系统的许多无线系统中，它提供了一些显著改进。在 5G 中，MIMO 将成为主体技术之一。5G 将充分利用多用户 MIMO (MU-MIMO)，通过利用各种用户的分布且不相关的空间位置为\
  \ MIMO 提供多接入能力。\n*   **5G 基站 (gNB)：** 在实现此技术时，`gNB` (5G 基站) 向不同的用户设备发送 `CSI-RS`\
  \ (信道状态参考信号)，然后根据响应 `gNB` 计算每个用户的空间信息。它利用这些信息计算所需的预编码矩阵 (`W-Matrix`)，其中数据符号被构建为\
  \ `gNB` 天线阵列每个单元的信号。\n\n\n\n\n\n*   **多路数据流：** 多路数据流具有自身的权重，包括对每个流的相位偏移，以便使波形在接收端产生相干干涉。这在最大化用户信号强度的同时，也最小化了对其他用户的信号和干扰。通过这种方式，`gNB`\
  \ 能够利用空间信息并发且独立地与多个设备通信。这意味着 5G MU-MIMO 使 `UEs` 无需获取信道知识或通过额外的处理获取数据流即可运行。下行 MU-MIMO\
  \ 显著提升了 `gNB` 天线的容量。它根据 `gNB` 天线数量与用户设备数量乘以每个 UE 设备天线数量之的最小值进行缩放。这意味着使用 5G MU-MIMO，系统可以使用\
  \ `gNB` 天线阵列和简单的 `UE` 设备实现容量增益。\n\n*   **频谱共享技术：** 大部分无线频谱虽然已分配，但并未得到有效利用。拟议的技术之一是频谱共享。\n\
  \n*   **跨频率统一设计：** 5G 新无线电（NR）利用了多种频率，可能是 6GHz 以下的 3.4 到 3.6 GHz，以及毫米波无线电可能使用的 24.25\
  \ 到 27.5 GHz、27.5 到 29.5 GHz、37 GHz、39 GHz 以及 57 到 71 GHz 范围。这些频率之间拥有一个通用接口至关重要。\n\
  \n*   **小基站：** 为了提供所需的数据能力，需要网络加密，因此提议更多使用小基站和小基站网络。小基站网络是一组低功率发射基站，它们利用毫米波增强整个网络的容量。5G\
  \ 小基站网络通过协调一组小基站来分担负载，并减少物理障碍带来的困难（物理障碍在毫米波下变得更加重要）。通过利用这些及许多其他技术，5G 新无线电 `5G NR`\
  \ 将能够显著提高当前移动网络的性能、灵活性、可扩展性和效率。通过这种方式，5G 将确保可用频谱（无论是授权的、共享的还是免的）的最利用，并在各种频谱段实现这一目标。\n\
  \n*   **下行和上行：** 对于层 1（物理层）下行（`DL`），即从网络到 `UE`，`NR` 使用带有循环前缀（`CP`）的 `OFDM`（类似于 `LTE`）。对于上行（`UL`），即从\
  \ `UE` 到网络，可以使用 `OFDM` 以及 `DFT-with-OFDM`（带有离散傅里叶变换预编码的 `OFDM`）。`DFT-with-OFDM`\
  \ 改进了 `UL` 覆盖，但其峰值比（`PAPR`）较低且仅限于单层传输。\n\n*   **5G 层 1（物理层）特性：** 5G 层 1 的一些关键特性是跨越多个频率范围，以便根据每个国家或地区的频率进行部署。载波从\
  \ 400 MHz 到 100 GHz 不，但授权频段从 600 MHz 到 39 GHz。这些频率重新定义了模拟电视（UHF）频段和某些卫星系统，由于在不同位置使用，因此没有干扰。\n\
  \n# 18.4 5G 核心网络\n\n此外，我们在 5G RAN 中拥有功能拆分，称为垂直拆分控制面（`CP`）和用户面（`UP`），而水平拆分由集中单元（`CU`）和去中心化单元（`DU`）组成。`CP/UP`\
  \ 实现了软件定义网络（`SDN`）、容量优化、包括干扰管理在内的多厂商网络一致性控制以及成本节省。`CU/DU` 提供了集中的资源和性能管理，在多接入边缘计算（`MEC`）的帮助下根据需求将功能转移到不同的位置，并将\
  \ RAN 处理适配于不同的基础设施部署。5G 核心网络功能（`NF`）也是模块化的，拆分为如图图 18.3\n\n图 18.3 5G 核心网络功能（非漫游部分）。\n\
  \n5G 核心网络功能定义如下：\n\n*   **接入和移动性管理功能 (AMF)：** 支持非接入层（`NAS`）信令终止、`NAS` 加密与完整性保护、注册管理、连接管理、移动性管理、接入认证与授权以及安全上下文管理。\n\
  \n*   **会话管理功能 (SMF)：** 支持会话管理（会话建立、修改、释放）、`UE` IP 地址分配与管理、动态主机配置协议（`DHCP`）功能、终止与会话相关的\
  \ `NAS` 信令、下行数据通知、`UPF` 的流量引导配置以实现正确的流量路由。\n\n*   **用户面功能 (UPF)：** 支持包路由与转发、包检测、QoS\
  \ 处理、作为数据网络（`DN`）的外部 PDU 会话接入点，并作为内部及无线接入技术（`RAT`）移动的锚点。注意，`UPF` 处理内部和跨 RAN 移动的锚点、包路由与转发、QoS\
  \ 处理以及流量计费和报告。\n\n*   **策略控制功能 (PCF)：** 支持统一策略框架，为 `CP` 功能提供策略规则，为 `UDR` 中的策略决策提供接入订阅信息。\n\
  \n*   **认证服务器功能 (AUSF)：** 作为认证服务器。\n\n*   **统一数据管理 (UDM)：** 支持认证和密钥协议（`AKA`）凭据、用户身份处理、接入授权、订阅管理。\n\
  \n*   **应用功能 (AF)：** 支持应用对流量路由的影响、访问 `NEF` 以及策略策略交互。\n\n*   **网络暴露功能 (NEF)：** 支持能力和事件的暴露、从外部应用向\
  \ 3GPP 网络提供信息、内部/外部信息的翻译。\n\n*   **NF 仓库函数 (NRF)：** 支持服务发现、维护 `NF` 配置和可用的 `NF` 实例。\n\
  \n*   **网络切片选择功能 (NSSF)：** 支持为 `UE` 选择网络切片实例、确定允许的 `NSSAI`、确定用于服务 `UE` 的 `AMF`set。\n\
  \n*   **服务通信代理 (SCP)：** 支持基于容量和可用性的轮询等流量分配方案。\n\n*   **网络切片特定认证与授权功能 (NSSAAF)：**\
  \ 指定网络切片是否需要使用主认证不同的额外凭据由认证、授权和计费（`AAA`）服务器进行认证和授权。\n\n*   **5G 数据网络 (DN) 接口：**\
  \ 提供与外部业务提供商服务、互联网接入或第三方服务的连接。\n\n为了部署这些功能，必须完全理解客户需求。通信服务管理功能（`CSMF`）是承担此任务的实体，作为网关将这些需求翻译到网络切片生态系统中。此外，网络切片管理功能（`NSMF`）负责网络切片实例（`NSI`）的管理和编排并导出网络切片子网需求。网络切片管理功能（如网络切片管理功能\
  \ `NSMF`、网络切片子网管理功能 `NSSMF` 和通信服务管理功能 `CSMF`）负责网络切片实例、网络切片子网的端到端创建、管理和编排。\n\n\n\n\
  \n\n管理与编排（MANO）是欧洲电信标准协会（ETSI）网络功能虚拟化（NFV）架构的关键要素。MANO 是一种架构框架，用于为云应用协调网络资源，以及虚拟网络函数（VNF）和网络服务的生命周期管理。最后，为了编排所有这些，NFV\
  \ MANO 基于三个功能块构建：\n\n*   `NFV 编排器 (NFVO)`——负责接入新的网络服务（NS）、VNFFG 和 VNF 软件包。授权并验证\
  \ NFVI 资源请求。同时管理 NS 的生命周期，并对 NFVI 请求进行验证/授权。\n*   `VNF 算器 (VNFM)`——负责 VNF 的生命周期，例如创建和终止，以及\
  \ FCAPS（故障、配置、计费、性能和安全管理）。\n*   `虚拟化基础设施管理器 (VIM)`——控制和管理网络功能虚拟化基础设施（NFVI），例如虚拟/物理计算、存储和网络资源。同时收集事件和性能指标。\n\
  \n`网络数据分析功能`（`NWDAF`）使网络能够实现自己的基于机器学习（ML）的数据分析方法，或将第三方解决方案集成到其网络中。NWDAF 用于将数据驱动技术的优势变为现实。对网络生成的数据进行分析，通过无监督学习、聚类探索核心网内部交互，并将这些结果作为未来机会和工作的洞察。\n\
  \n`意图驱动网络`（`Intent-Driven Networking`）是系统所需状态的表达方式，用于描述预期的网络或服务。意图并不定义特定的网络或服务配置，也没有规定系统要执行的管理任务。意图允许客户请求网络和服务，而无需详细了解其提供方式。从本质上说，这假设系统能够学习网络和服务的行为，并使用\
  \ AI 和自动化机制来实现通过意图表达的请求。这不仅减轻了消费者了解实现细节的负担，还提供了灵活性，允许生产者探索替代方案以寻找最优解决方案。\n\n`管理数据分析功能`（`MDAF`）执行所需的数据分析（使用暴露能力），以帮助管理系统为网络配置设置合理的网络拓扑参数并保证服务质量。在根据\
  \ `MDAF` 提供的分析结果对网络进行合理配置后，控制面和用户面可以进行进一步的参数调整以改善用户体验。AI/ML 将用于整个 5G 系统，包括管理与编排、核心网和\
  \ RAN。为了启用并促进 5G 系统中的 AI/MLless，AI/ML 模型将在其整个生命周期内创建、训练、测试、部署和管理。此外，AI/ML 管理能力将与核心网中的\
  \ AI/ML 能力协作，并支持 RAN 中的 AI/ML 能力。\n\n`自组织网络`（`SON`）技术通过消除从部署时的手动配置到运行期间动态优化和故障排除的全过程，减少了运行移动网络的生命周期成本。除了提高网络性能和客户体验外，SON\
  \ 还能显著降低移动运营商服务的成本，提高运营支出（OpEx）与收入的比例，并延迟可以避免的资本支出（CapEx）。SON 专注于整合新能力，例如针对数字安全威胁的自保护和通过\
  \ AI 技术实现的自学习，并将 SON 的范围扩展到 RAN 之外，涵盖移动核心和传输网段——这对于解决端到端网络切片等 5G 要求至关重要。\n\n也许 RAN\
  \ 中 AI/ML 最明显的候选者是自组织网络（SON）功能，它目前是 LTE 和 NR 规范的一部分（最初在 LTE 的 Rel-8 中引入）。通过 SON，网络根据不同的无线和流量条件自动调整并微调一系列参数，减轻了运营商手动优化的负担。虽然\
  \ SON 功能背后的算法在 3GPP 中尚未标准化，但 SON 的实现通常是基于规则的。SON 与基于 AI 方法之间的主要区别之一是从响应式范式转向主动式范式。\n\
  \n`分布式 SON`平台将基于 NFV 和软件定义网络（SDN）开发。事实上，它是 SON 与 C-RAN 结合的关键。这可以在集中式或混合架构中发生，从而实现\
  \ SON 即服务（SONaaS）。\n\n`基于 AI 的数据分析`（`AI-based Data Analytics`）是释放 SON 真正潜力的关键。物联网（IoT）产生的流量在未来两年可能会超过\
  \ 100 万亿 GB。更多数据意味着预测未来的更多机会。随着 5G 的超连接、极速率、AI 驱动的网络优化和数据分析洞察，电信行业正处于变革边缘。这种结合创造了数据驱动的未来并推动经济增长。NWDAF\
  \ 代表了移动行业首次对核心网分析功能的尝试。从根本上说，通过 NWDAF，3GPP 确保了分析不是事后补救，而是将分析驱动的自动化构建到系统之中。以下是基于\
  \ NWDAF 数据分析用于应用 AI/ML 操作的一些示例：\n\n*   5G 核心信息暴露给第三方用于应用层/ML 操作。\n*   增强外部参数配置。\n\
  *   5G 核心增强以实现应用 AI/ML 传输。\n*   复用用于 URLLC 服务的现有 QoS 机制。\n*   SMF 将信息发送给 UPF，将 AI/ML\
  \ 流量绑定到特定的 QoS 流。\n*   5G 系统辅助联邦学习操作：\n    *   新增成员选择功能，根据 AF 请求中的参数提供推荐的 UE 列表。\n\
  \    *   UE 触发切分推理（split inference）。\n    *   UE 与 AI/ML 服务器在应用层协商。\n*   AF 订阅一个或多个\
  \ NWDAF 分析以生成 AI/ML 辅助信息。\n*   需要来自 5G 核心的 AI/ML 辅助信息来协助 AI/ML 服务器做出相应的决策。\n*  \
  \ 根据辅助信息和 UE 处的系统环境因素（如通信速率和资源），AI/ML 服务器 AF 做出切分推理决策。\n\n\n\n\n*   `gNB`= `gNodeB`:\
  \ 特指 5G RAN 基站的节点称为 `gNBs`。\n\n`gNodeB` (`gNB`) 是 5G 无线基站，通过 `NR` 无线接口将 5G 新射电 (`NR`)\
  \ 设备（例如 5G 手机）连接到 5G 核心网。5G 网络使用了前面所述的新技术——新射电 (`NR`)，它需要被称为 `gNodeB` 或 `gNB` 的新无线基站。在\
  \ 5G 网络背景下，描述了两种类型的无线基站节点。\n\n### 18.5.1 5G 无线网络节点与 5G 部署类型\n\n5G 网络部署可以通过两种方式进行：独立组网\
  \ (`SA`) 和非独立组 (`NSA`)。这两种部署的区别在于所使用的核心网类型。非独立组 5G 部署利用 4G 核心网，而独立组网使用专用的 5G 核心网。非独立模式\
  \ (`NSA`) 是更常见的部署选项，特别是对于 5G 的早期采用阶段，移动运营商在其现有的 4G LTE 基础设施中添加 5G `NR`。`NSA` 使用\
  \ LTE 核心网 `EPC`（带有某些增强），而 `SA` 使用名为 `5G Core Network` 的新 5G 核心网。\n\n### 18.5.2 ENB、GNB\
  \ 和 NG-ENB 的 5G 用户面和控制面\n\n在使用 5G 核心网时，`gNB` 负责 5G `NR` 设备的用户面和控制面；在非独立 5G 核心网网络中，`gNB`\
  \ 负责用户面，而 `eNB` 负责控制面。双连接概念对于 LTE 和 5G 的共存非常重要。在双连接中，手机同时连接到 4G 和 5G 网络；然而，连接的类型是不同的。在非独立部署\
  \ (`NSA`) 中，5G `NR` 设备（例如 5G 手机）的数据连接大小、服务质量 (`QoS`) 以及其他用户级功能由 5G `NR` 无线网络基站 (`gNodeB`\
  \ 或 `gNB`) 处理。这种用户级连接被称为用户面。然而，5G 设备的控制级功能是控制面的一部分，由被称为演进节点基站 (`eNodeB` 或 `eNB`)\
  \ 的 4G LTE 无线网络处理。\n\n使用 5G 核心网时，连接方式是不同的。当 5G 设备需要连接网络时，`gNodeB` (`gNB`) 可以使用 `NR`\
  \ 无线接口提供控制面和用户面。另一方面，当 4G 设备需要连接网络时，下一代演进节点基站 (`ng-eNodeB` 或 `ng-eNB`) 可以使用 `LTE`\
  \ 无线接口提供控制面和用户面。\n\n### 18.5.3 5G 控制面：UE-TO-AMF 和 UE-TO-SMF 协议栈\n\n协议栈定义例如在 `TS\
  \ 23.501` 中，用于这些 `NF` 之间的通信以及图中图中次要协议。在这里，我们重点介绍一些主要的：\n\n*   `NAS-SM`: 它支持 `UE`\
  \ 和 `SMF` 之间的会话管理。它支持用户面 PDU 会话的建立、修改和释放。它通过 `AMF` 传输并对 `AMF` 透明。它定义在“5G 系统 (5GS)\
  \ 非接入层 (NAS) 协议；阶段 3” (`TS 24.501`)。\n*   `NAS-MM`: 它支持注册管理功能、连接管理功能以及用户面连接的激活和取消。它负责\
  \ NAS 信令的加密和完整性保护。5G `NAS` 协议定义在 `TS 24.501`。\n*   `5G-AN 协议层`: 这组协议/层取决于 `5G-AN`。在\
  \ `NG-RAN` 情况下，`UE` 和 `NG-RAN` 节点 (`eNodeB` 或 `gNodeB`) 之间的无线协议规定在 E-UTRA & E-UTRAN“描述；阶段\
  \ 2” (`TS 36.300`) 和 NR“描述；阶段 2” (`TS 38.300`) 中。在非 3GPP 接入的情况下，参见 8.2 节。\n*   `NG\
  \ 协议 (`NG-AP`)`: `5G-AN` 节点与 `AMF` 之间的应用层协议。`NG-AP` 定义在 `TS 38.413`。\n*   `流控制传输协议\
  \ (SCTP)`: 该协议保证 `AMF` 和 `5G-AN` 节点 (`N2`) 之间的信令传输。`SCTP` 定义在 `IETF RFC 4960` [18_1]。注意\
  \ `5G-AN` 和 `SMF` 之间也存在直接通信，称为 `N2 SM`：这是 `NG-AP` 信息的子集（图中未显示），`AMF` 透明地在 `5G-AN`\
  \ 和 `SMF` 之间转发，并包含在 `NG-AP` 消息和 `N11` 相关消息中。\n\n![图 18.4 5G 协议：UE、5G-AN、AMF 和 SMF\
  \ 之间的控制面协议栈](img/fig18.4)\n\n### 18.5.4 ENB、GNB 和 NG-ENB 的 5G 用户面和控制面\n\n使用 5G 核心网时，`gNB`\
  \ 负责 5G `NR` 设备的用户面和控制面。（等等，在非独立 5G 4G 核心网中，`gNB` 负责用户面，`eNB` 负责控制面。）双连接概念对于 LTE\
  \ 和 5G 的共存非常重要。在双连接中，手机同时连接到 4G 和 5G 网络；然而，连接的类型是不同的。在非独立部署 (`NSA`) 中，5G `NR` 设备（例如\
  \ 5G 手机）的数据连接大小、服务质量 (`QoS`) 以及其他用户级功能由 5G `NR` 无线网络基站 (`gNodeB` 或 `gNB`) 处理。这种用户级连接被称为用户面。然而，5G\
  \ 设备的控制级功能是控制面的一部分，由被称为演进节点基站 (`eNodeB` 或 `eNB`) 的 4G LTE 无线网络处理。（注：输入文本存在冗余章节和标题对齐问题，已根据提供的内容维护了逻辑流。）\n\
  \n### 18.5.5 5G 非独立组网 与 5G 独立架构\n\n5G 网络部署可以通过两种方式进行：独立组网 (`SA`) 和非独立组 (`NSA`)。这两种部署的区别在于所使用的核心网类型。非独立组\
  \ 5G 部署利用 4G 核心网，而独立组网使用专用的 5G 核心网。非独立模式 (`NSA`) 是更常见的部署选项，特别是对于 5G 的早期采用阶段，移动运营商在其现有的\
  \ 4G LTE 基础设施中添加 5G `NR`。`NSA` 使用 LTE 核心网 `EPC`（带有某些增强），而 `SA` 使用名为 `5G Core Network`\
  \ 的新 5G 核心网。（*自纠：提供的文本包含了 18.5.1 到 18.5.4 的重复章节，我已清理结构以确保文档的连贯性并保留了所有技术信息。）*\n\n\
  \n\n\n“独立式”（`SA`）架构是将 `NR` 连接到 `5G Core` 的架构。只有在这种配置下，才支持全套的 `5G Phase 1` 服务。`SA`\
  \ 架构如图 18.7 所示。`SA` 架构可以看是“全 5G 部署”，不需要任何 `4G` 网络部分即可运行。`NR` 基站（逻辑节点 `gNB`）通过 `Xn`\
  \ 接口相互连接，而接入网（称为 `NG-RAN for SA`）通过 `NG` 接口连接到 `5G Core` 网络。\n\n![18.7 The SA Architecture](img/fig18_7)\n\
  \n## 18.6 5G 安全\n`5G` 系统是 `4G` 移动通信系统的演进。因此，`5G` 安全架构的设计旨在为非独立式和独立式新无线（`NR`）系统集成与\
  \ `4G` 等的安全。此外，`5G` 还考虑了对其他安全威胁的重新评估，例如针对无线接口、信令面、用户面的攻击，伪装、隐私、重放、降级以及运营商之间的安全，这将带来进一步的安全增强。\n\
  \n### 18.6.1 5G 非独立式 NR\n`3GPP` 迈向完全 `5G` 覆盖的第一步是非独立式 `NR`，也称为 `E-UTRA-NR 双模连接 (EN-DC)`。非独立式的关键特性是能够利用现有的\
  \ `LTE` 和 `EPC` 基础设施，从而在无需替换的情况下提供基于 `5G` 的无线技术。`EN-DC` 使用 `LTE` 作为主接入技术，而新无线接入技术（即\
  \ `NR`）作为次级接入技术，用户设备（`UE`）同时连接到两种无线接入。除了能力协商外，`EN-DC` 的安全程序基本上遵循双模连接的安全规范。\n\n演进节点基站\
  \ `eNB`（`MeNB`）检查 `UE` 是否具有 `5G NR` 能力以访问次级 `gNB`（`SgNB`），即 `5G` 基站，以及对 `SgNB` 的访问权限。能力和访问权限检查确保了标准的向前兼容性，因为具有不同能力（包括安全能力）的\
  \ `UEs` 可以加入网络。`MeNB` 派生并发送供 `SgNB` 用于 `NR` 上安全通信的密钥；`UE` 也派生相同的密钥。与 `4G` 网络中的双模连接不同，`UE`\
  \ 和 `gNB` 之间可以交换无线资源控制（`RRC`）消息，因此可以导出用于 `RRC` 消息以及用户面（`UP`）数据的密钥。尽管 `5G` 网络支持对\
  \ `UP` 数据的完整性保护，但在 `EN-DC` Case 中不会使用。`UP` 和 `RRC` 的机密性保护使用均为可选。\n\n### 18.6.2 5G\
  \ 信任模型的演进\n离开非独立式部署，在独立式 `5G` 系统中，信任模型发生了演进。网络内部的信任度被认为越远离核心越低。这对 `5G` 安全设计中采取的决策影响。`UE`\
  \ 中的信任模型相对简单：有两个信任域，防篡改通用电路卡（`UICC`，其通用用户身份模块（`USIM`）作为信任锚点驻留在其上）和移动设备（`ME`）。`ME`\
  \ 和 `USIM` 共同组成 `UE`。漫游和非漫游情况下的网络侧信任模型分别如图 18.8 和 18.9 所示，它们展示了像洋葱一样的多层信任。\n\n![18.8\
  \ Trust Model of Non-Roaming Scenario](img/fig18_8)\n\n![18.9 Trust Model of Roaming\
  \ Scenario](img/fig18_9)\n\n无线接入网（`RAN`）分为分布单元（`DU`）和集中单元（`CU`）——`DU` 和 `CU` 共同组成\
  \ `gNB` `5G` 基站。`DU` 无法访问客户通信，因为它可能部署在无人监管的站点。`CU` 和终止接入层（`AS`）安全的非 3G 互工作功能（`N3IWF`——图中未显示）将部署在访问限制更严格的站点。\n\
  \n在核心网中，接入管理功能（`AMF`）作为非接入层（`NAS`）安全的终止点。目前，即在 `3GPP` `5G Phase 1` 中，`AMF` 与安全锚点函数（`SEAF`）同地部署，后者持有访问网的根密钥（称为\
  \ `anchor key`）。该安全架构以一种面向未来的方式定义，因为它允许安全锚点与移动功能分离，这在未来是可能的。\n\n认证功能（`AUSF`）保留一个用于复用的密钥（在认证后派生），以防\
  \ `UE` 同时在不同的接入网络技术（即 `3GPP` 接入网络和非 3G 接入网络，如 IEEE 802.11 无线局域网 `WLAN`）中注册。认证凭据存储与处理函数（`ARPF`）保留认证凭据。客户端（即\
  \ `UE` 端）的 `USIM` 镜像了。用户信息存储在统一数据存储（`UDR`）中。统一数据管理（`UDM`）使用存储在 `UDR` 中的订阅数据并实现应用逻辑以执行各种功能，如认证凭据生成、用户识别、服务和会话连续性等。在接口上，控制面和用户面都考虑了主动和被动攻击。隐私变得越来越重要，导致永久标识符在接口上保持保密。\n\
  \n在漫游架构中，主网和访问网通过安全保护代理（`SEPP`）进行互联网连接控制面的连接。在 `5G` 中进行这种增强是因为近期暴露了许多攻击，例如 `SS7`\
  \ 中的密钥窃和重定向攻击，以及 `DIAMETER` 信令消息中的网络节点伪造和源地址欺骗。\n\n### 18.6.3 5G 第一阶段安全（第 15 版）\n\
  `5G Phase 1` 为 `4G` 安全带来了若干增强，本节介绍了其中一些关键点。此处简要描述 `5G Phase 1` 安全的细节。\n\n- **主认证**：`5G`\
  \ 中的网络和设备双向认证基于主认证。这与 `4G` ，但有几点不同。认证机制内置了主网控制，允许主网运营商了解设备是否在每个网络中通过认证，并做出最终认证判定。在\
  \ `5G Phase 1` 中，有两个强制性认证选项：`5G 认证与密钥协议 (5G-AKA)` 和 `扩展认证协议 (EAP)-AKA’`，即 `EAP-AKA’`。可选，`5G`\
  \ 也允许其他基于 `EAP` 的认证机制——用于特定场景如私有网。\n\n- **次级认证**：`5G` 中的次级认证用于与移动运营商域之外的数据网络进行认证。为了这一目的，可以使用不同的基于\
  \ `EAP` 的认证方法和相关凭据。类似的服务在 `4G` 中也是可能的，但现在集成到了 `5G` 架构中。\n\n\n\n\n\n-   **跨运营商安全**：由于早期移动通信系统使用了\
  \ SS7 或 Diameter [5,6]，运营商间接口中存在若干安全问题。为了应对这些问题，5G 第 1 阶段从起初就提供了运营商间安全保护。\n\n- \
  \  **隐私**：与用户身份相关的问题自 4G 及更早的移动系统以来已为人知。在 5G 中，开发出了一种隐私解决方案，保护用户的永久订阅标识符免受主动攻击。使用家庭网络公钥来提供用户身份隐私保护。\n\
  \n-   **基于服务的架构 (SBA)**：5G 核心网基于基于服务的架构，这种架构在 4G 及更早的系统中并不存在。因此，5G 也为 SBA 提供了充分的安全。\n\
  \n-   **集中单元 (CU)—分布式单元 (DU)**：在 5G 中，基站从逻辑上被分为 CU 和 DU，它们之间存在接口。CU–DU 接口提供了安全保护。这种划分在\
  \ 4G 中也是可能的，但在 5G 中它是架构的一部分，可以支持多种部署方案（例如，也可以支持同地 CU–DU 部署）。部署在网络最边缘的 DU 在开启机密性保护时无法访问任何用户数据。即使采用了\
  \ CU–DU 划分，5G 的空中接口安全点仍与 4G 相同，即位于无线接入网。\n\n-   **密钥层级**：5G 层级结构反映了整体架构和信任模型的变化，并使用了密钥分离的安全原则。5G\
  \ 与 4G 相比的一个主要区别是支持对用户面进行完整性保护。\n\n-   **移动性**：虽然 5G 的移动性与 4G 类似，但 5G 的区别在于假设核心网中的移动性锚点可以与安全锚点分离。\n\
  \n非独立组架构和 5G 第 1 阶段独立组架构让我们领略了新一代移动通信系统。5G 第 1 阶段的主要用用例是移动宽带。5G 第 2 阶段将为物联网 (IoT)带来解决方案，涵盖大规模机器类通信\
  \ (mMTC) 和高可靠低延迟通信 (URLLC) 形式的多种场景。mMTC 涉及大量设备传输容量较小的非延迟敏感数据，而 URLLC 则涉及对吞吐量、延迟和可用性等能力有严格要求的业务。\n\
  \n对于数据速率低至每天仅几比特的 mMTC，我们必须考虑能够提供的安全保护程度（无论是认证、机密性、完整性还是其他）。若干物联网或机器对机器 (M2M) 服务和设备属于此类，例如提供每小时更新一次状态的温度传感器、每天提供几次农场动物生命体更新的传感器等。此类设备在电池、计算和内存方面也会受到资源限制。对于安全而言，要求是减少安全相关位位的开销，例如每次通信的完整性校验开销。\n\
  \n在尺度的另一端，URLLC 设备需要高数据率以及可能需要更高的电池和计算资源；例如汽车、工业物联网 (IIoT) 设备（如工厂机械）以及用于游戏或实时服务的虚拟或增强现实\
  \ (VR 或 AR) 设备。提供更高的数据率意味着还需要考虑安全函数的吞吐量，以避免处理延迟。\n\n5G 端到端骨干网见图 18.10。核心骨干网由光/光/光子技术和时/密波分技术组成。AI\
  \ 驱动的智能光纤/光/光子和密波网络为针对光非线性复杂噪声的最优编码、信道仿真、MIMO、信道均衡和最优决策提供了效率。光计算和光神经网络是智能光通信网络 (IOCN)\
  \ 的重点。IOCN 可以在 6G 中大规模部署，尽管基于电的数字信号处理将消耗大量能量。光计算的使用将大幅降低消耗。分布式信道均衡结合了现有的通信系统和神经网络的多层机制，这将是快速部署\
  \ IOCN 的有效手段。\n\n![图 18.10 5G 端到端网络。](img/fig18_10.jpg)\n\n图 18.10 5G 端到端网络。\n\n\
  在 AI 能力网络中，所有这些协议都将由 AI 控制，从而使它们变为动态。ML/DL 算法的数量是有限的，多年年来已发表许多论文使每种协议实现 AI 化。通过这种方式，每种协议都失去了其原始特性。结果是与传统网络相比，AI\
  \ 能力网络将提供更大的系统容量、更高的数据率、更低的延迟、更高的安全性和改进的服务质量 (QoS)。然而，标准化要求在开放论坛、IETF、ITU-T、ISO/IEC、IEEE\
  \ 等处定义每种协议的发展，以提供多厂商环境下的互操作性。\n\n## 5G 网络切片\n\n5G 的一个关键业务理念是网络切片，它为业务创建提供了极大的灵活性。例如，切片\
  \ 1 用于低延迟优化，切片 2 用于高带宽，切片 3 用于低设备，以此类推。5G 标准允许增强移动宽带 (eMBB)、高可靠低延迟通信 (URLLC) 和大规模机器类通信\
  \ (mMTC) 等业务。一种实现场景（图 18.11）是将网络切分为三部分，每个部分都有自己的一套网络功能。\n\n![图 18.11 带有 URLLC、eMBB\
  \ 和 mMTC 服务的网络切片](img/fig18_11.jpg)\n\n图 18.11 带有 URLLC、eMBB 和 mMTC 服务的网络切片。\n\n\
  网络服务的切片允许根据客户需求实现不同的业务虚拟化，而不是像传统网络中看到的单一类型虚拟专用网络 (VPN) 业务。例如，连接公用事业公司物联网 (IoT) 设备的客户可能会大规模使用\
  \ mMTC 服务来监控其智能电表。网络服务提供商可能会将 URLLC 服务提供给对高可靠、极低延迟中等带宽需求的优质客户，而 eMBB 服务将提供给需求高可靠性、高带宽和极低延迟的优质客户。关键在于所使用的应用程序，因为应用程序可能包含音频、视频、数据、图形和/或文本，具有实时、近实时或非实时的流量特征。\n\
  \n\n\n\n\nURLC、eMBB 和 mMTC 服务的进一步细粒化如图图 18.12 所示。在每一类服务中，可以创建不同的网络切片来为每个客户定制服务，并且根据给定的基于延迟、带宽和可靠性要求的切片来创建切片。注意，URLC、eMBB\
  \ 和 mMTC 服务都定义了网络切片实例在整个生命周期内的结构、配置和工作流，而切片（例如 1、2、3 等）则定义了客户应用的特定业务需求。\n\n![图 18.12\
  \ eMBB、URLLC、mMTC 服务的细粒化](img/fig18_12.jpg)\n\n图 18.12 eMBB、URLLC、mMTC 服务的细粒化。\n\
  \n5G 网络高带宽的一个关键范式转变是细粒度服务及其更精细的性能需求，这支持了海量用户，并通过对全球网络移动性的海量管理，支持实时、近实时和非实时应用。这意味着\
  \ AI/ML/DL 技术对于这些网络服务的创建以及客户的应用来说是至关重要的。5G 网络只是 6G 网络的前奏，在 6G 中，AI/ML/DL 技术将专门用于网络和应用服务的创建。\n\
  \n## 18.8 5G MAC 协议\n\n物联网（IoT）设备的海量连接需求（其中高带宽对所有用户并非必不可少）催生了一种名为非正交多址接入（NOMA）的新标准协议。NOMA\
  \ 协议中存在许多变体方案。学术界、标准机构和无线行业认为，新的 NOMA 接入协议是 5G 的关键赋能技术。NOMA 协议允许在多个不同用户之间共享单一资源。这类协议被认为是无线通信网络持续扩展以实现物联网设备海量连接的可能解决方案。由于\
  \ NOMA 与其他多接入方法兼容，NOMA 技术可以增加正交接入系统的有效性。\n\n在 NOMA 中，每个用户通过正交接入被赋予专门使用一个独立的信号或频率范围。在采用非正交多址接入的网络中，多个用户可以共享相同的频率或特定时间。此外，NOMA\
  \ 系统允许灵活的功率分配策略，以确保位于网络中心之外的用户能够获得更公平的资源回收。这些新协议的核心驱动力是对增加海量连接密度的需求。NOMA 促进了 5G\
  \ 等无线网络中稀缺的时间频谱资源的有效利用，并可以推荐用于 6G。\n\n注意，理想的情况是用户一旦有数据要传输，就可以立即开始，而无需完全建立连接，也不依赖动态授权来提高信道利用效率。换句话之，允许用户在无线资源控制器（RRC）空闲或非活动状态传输数据。在免授权传输中，每个用户随机选择一个资源或签名。用户之间可能会产生冲突。NOMA\
  \ 能够通过应用特定的传输方案结合先进接收机来缓解冲突问题。通过 NOMA，系统可以承受更多的活跃用户或更高的负载，从而增加系统容量。在 mMTC、eMBB 和\
  \ URLLC 中，已经推荐了 NOMA 方案。\n\n为了满足性能需求，NOMA 技术需要引入 AI/ML/DL 技术支持。这一方面也需要标准化，以确保在多厂商环境中的互操作性。标准机构和工业界在该领域仍在工作中。\n\
  \n## 18.9 5G 高层协议\n\n高层协议（例如网络、传输和中间件）尚待像 MAC 层那样进行改进，以在整体性能（如吞吐量）方面获得端到端的收益。\n\n\
  ## 18.10 AI 赋能的 5G 应用\n\n5G 网络尚未针对高层协议进行改进，以在延迟方面获得端到端的收益。AI 仅仅是叠加的服务。在这种场景下，AI\
  \ 服务器将作为后端来实现 5G 应用，具体取决于实现方式，见图 18.13\n\n图 18.13 端到端 5G 网络。\n\n这种 5G 网络将是透明的，尽管前端应用可能是私有的。\n\
  \n## 18.11 带 AI 赋能的 5G 端到端网络架构\n\n5G 网络将使用尚未 AI 赋能的现有协议。如前所述，5G 网络将利用 AI 赋能应用来增强服务并改进延迟。图\
  \ 18.14 描述了 AI 赋能的 5G 网络架构。\n\n![图 18.14 带 AI 赋能的 5G 网络架构](img/fig18_14.jpg)\n\n\
  图 18.14 带 AI 赋能的 5G 网络架构。\n\n注意，3GPP 不定义具体的 AI/ML 网络及其实现。它仅定义 AI/ML 网络的接口和输入输出类型（模型）。整个\
  \ AI/ML 功能将包含几个不同的组件（例如：数据采集、模型训练、模型推理）。可能，接入网中 AI/ML 最明显的候选是自组织网络（SON）功能，它目前是 LTE\
  \ 和 NR 规范的一部分。通过 SON，网络根据不同的无线和流量条件自动调整和微调参数，减轻了运营商手动优化的负担。虽然 SON 背后的算法尚未在 3GPP\
  \ 中标准化，但 SON 的实现通常是基于规则的。SON 与基于 AI 方法的主要区别之一是从响应式范式转向主动式范式。注意，3GPP 通过以下小组定义 RAN：\n\
  \n* `RAN1`——无线第 1 层：物理层。\n* `RAN2`——无线第 2 层和无线第 3 层无线资源控制。\n* `RAN3`——通用无线接入网络（UTRAN）、演进通用无线接入网络（E-UTRAN）、下一代无线接入网络（NG-RAN），包括云无线接入（C-RAN）架构及相关网络接口。\n\
  * `RAN4`——无线性能和协议。\n* `RAN5`——移动终端测试。\n\n研究刚刚开始，写作时我们只能提供初步考虑。根据从 RAN 收到的指令，我们的研究重点是功能以及相应的输入输出类型（来自接入网、核心网和终端的海量数据），以及对现有节点和接口的潜在影响；详细的\
  \ AI/ML 算法超出 RAN3 范围。C-RAN 是无线接入基带软件与无线接入基带硬件的分离。这种基带软件可以在任何能力所需的商用通用（COTS）硬件上运行，无论是否集成加速器，并利用云原生工具和流程来管理软件和硬件。\n\
  \n\n\n\n\n在 `RAN3` 定义的 RAN 架构中，本研究优先考虑 `NG-RAN`，包括`演进型通用地面无线接入新无线电双连接性 (ENDC)`。在用例方面，该小组已同意从节能、负载均衡和移动性优化开始。尽管人们已经意识到避免\
  \ `SON` 重复的重要性，但根据各公司的贡献，随着研究的进行，可能会讨论额外的用例。其目标是为当前 `NG-RAN` 架构中的 `AI/ML` 定义一个框架，并且如果用例需要，正在讨论的\
  \ `AI/ML` 工作流不应阻止“超越现状的思考”。\n\n## 18.12 总结\n\n我们描述了一种赋 AI 的 5G 网络。`5G RAN`、`5G 接口`、`5G\
  \ 核心网`、`5G 协议栈`、`5G 安全`、`5G 网络切片`、`5G MAC 协议`、`5G 高层协议`、赋 AI 的 5G 应用，以及带有赋 AI 应用的\
  \ 5G 端到端网络架构。所有这些功能和能力主要基于 `3GPP` 的新兴规范进行说明。\n\n## 参考文献\n\n*   [1] RFC 4850, “多协议标签交换的\
