  \    *   测试数据预测\n    *   ML/DL 模型评估\n\n## 7.1 信号/数据采集\n\n信号/数据采集（`SAQ/DAQ`）是通过采样等方式以数字形式从系统中获取信息的过程。传感器\
  \ `SAQ/DAQ` 系统能够将物理参数转换为电信号。`SAQ/DAQ` 系统像信号处理电路一样，将传感器信号转换为可以转化为数字值的形式。模数转换器将处理过的传感器信号转换为数字值。在此时，我们还未让\
  \ `SAQ/DAQ` 系统具备 AI/ML/DL 能够。\n\n## 7.2 信号/数据数字化\n\n对信号或数据进行采样以实现数字化。例如，传感器的物理参数被转换为可能是模拟形式的电信号。我们假设所有信号/数据都已数字化，以供计算机系统使用。一旦获得数字化信息，就可以启动\
  \ `AL/ML/DL` 过程。\n\n## 7.3 信号/数据清洗与预处理\n\n信号/数据清洗和预处理主要用于去除噪声，去除噪声的方法取决于应用的类型。例如，对于文本（如电子邮件、文件、网页），包括\
  \ `Tokenization`（分词）、`Stop Words`（停用词）、`Capitalization`（大小写转换）、`Slang and Abbreviation`（俚语和缩写）、`Noise\
  \ Removal`（去噪）、`Spelling Correction`（纠错）、`Stemming`（词干提取）和 `Lemmatization`（词形还原）。这些功能每个都有特定的机器学习和非机器学习算法。\n\
  \n## 7.4 特征提取\n\n在机器学习/深度学习中，从测量数据中提取的初始可操作非冗余特征（值）用于满足所需的目标，例如促进后续的学习和泛化步骤，在某些情况下，它可能有助于人类更好地理解。初始特征集被称为无冗余特征的全特征集。有很多\
  \ `ML` 特征提取算法可用。然而，需要选择什么特征提取算法取决于应用类型。例如，对于文本（如电子邮件、文件、网页），可以使用以下特征提取算法，每种算法都有其优缺点：\n\
  \n*   句法词表示\n    *   N-Gram\n    *   句法 N-Gram\n*   权重词\n    *   词袋模型 (`BoW`)/特征包\
  \ (`BoF`)\n    *   词袋模型 (`BoW`）的局限性\n    *   词频-逆文档频率 (`TF-IDF`）\n*   词嵌入\n    *\
  \   词向量 (`Word2Vec`）\n        *   – 连续词袋模型\n        *   – 连续跳字模型\n    *   词表示全局向量\
  \ (`GloVe`）\n    *   快速文本 (`FastText`）\n    *   上下文词表示\n\n注意，这些算法中的任何一种都适用于文本应用的特征提取。人们可以使用一种或多种算法进行文本应用的特征提取。通常情况下是使用尽可能多的算法，并选择产生优越结果的最佳算法。\n\
  \n## 7.5 降维\n\n一旦获得全非冗余特征集，我们必须识别出有用特征，然后从有用特征集中为包括文本在内的任何应用选择最终的特征集。这也是一种试错法，用于将特征的维度降低到绝对有用的最小特征集。有很多通用的降维\
  \ `ML/DL` 算法如下：\n\n*   成分分析\n    *   主成分分析 (`PCA`)\n    *   独立成分分析 (`ICA`)\n*  \
  \ 线性判别分析 (`LDA`)\n*   非负矩阵分解\n*   随机投影\n    *   随机厨房水池 (Random Kitchen Sinks)\n\
  \    *   Johnson–Lindenstrauss 定理\n*   自动编码器\n    *   传统自动编码器架构\n    *   循环自动编码器架构\n\
  \n降维主要用于寻找数据集的正交投影，以提取数据集最大的方差。`PCA` 尝试解决变量间的相关性问题。`LDA` 是一种用于降维的监督技术，可以提高特征的预测性能。随机投影计算上比\
  \ `PCA` 快得多。自动编码器在小数据集上表现不佳。`t-SNE` 主要用于文本和数据集的可视化。\n\n## 7.6 信号/数据分类\n\n`ML/DL`\
  \ 过程中最重要的步骤是选择最佳分类器。如果没有对每个算法的完整概念理解，就无法为任何应用确定最高效的模型。这里列出了常用的分类技术。首先，我们涵盖包括文本在内的传统分类方法：\n\
  \n使用机器学习 (`ML`) 的分类技术：\n\n*   Rococchio 分类\n*   Boosting 和 Bagging\n    *   Boosting\n\
  \    *   Bagging\n*   逻辑回归 (`LR`)\n    *   结合实例学习与逻辑回归 (`LR`)\n    *   多分类逻辑回归\n\
  *   朴叶斯分类器\n    *   朴叶斯分类器高级描述\n    *   多分类朴叶斯分类\n    *   不平衡类朴叶斯分类器\n*   K 近邻 (`KNN`)\n\
  \    *   权重调整 K 近邻分类\n*   支持向量机 (`SVM`)\n    *   二分类 `SVM`\n    *   多分类 `SVM`\n\
  \    *   字符串内核\n    *   堆叠支持向量机 (`SVM`)\n    *   多即时学习 (`MIL`)\n*   设计树\n*   随机森林\n\
  \    *   投票\n\n使用深度学习 (`DL`) 的包括文本应用的分类技术：\n\n\n\n\n\n文本分类流水线中最重要的步骤是选择最佳的特征分类器。如果对每个算法没有完整的概念理解，就无法有效地为特征分类应用确定最有效的模型。非参数技术已研究并应用于分类任务，例如\
  \ `k-nearest neighbor (KNN)`。`Support Vector Machine (SVM)` 是另一种流行的技术，它采用判别性分类器进行文档分类。该技术也适用于数据挖掘的所有领域，如生物信息学、图像、视频、人类活动分类、安全与防护等。该模型也被许多研究人员用作基准，与他们自己的工作进行比较，以突出新颖性和贡献。\n\
  \n基于树的分类器（如 `decision tree` 和 `random forest`）也已经在文档分类方面得到了研究。每个基于树的算法都将在单独的小节中介绍。近年来，图形分类被视为一种分类任务，例如\
  \ `conditional random fields (CRFs)`。然而，这些技术主要用于文档摘要生成和自动关键词提取。\n\n最近，深度学习方法在图像分类、自然语言处理、人脸识别等任务上已经取得了超越以往机器学习算法的结果。这些深度学习算法的成功依赖于它们对数据内部复杂且非线性关系的建模能力。关键在于，在做出最终决定之前，必须选择一组最小算法来测试它们的应用，以获得更好的分类效果。\n\
  \n## 7.7 信号/数据分类评估标准\n\n分类流水线的最后一部分是对包括文本在内的任何应用进行评估。了解模型的性能对于文本分类方法的使用和开发至关重要。目前有许多方法可以评估监督学习技术。准确率计算是最简单的评估方法，但并不适用于不平衡的数据集。以下是用于文本分类算法的评估方法：\n\
  \n*   混淆矩阵 (Confusion Matrix)\n*   宏平均与微平均 (Macro- and Micro-Averaging)\n*   `F[b]-Score`\n\
  *   马修斯相关系数 (MCC)\n*   接收者操作特征 (ROC)\n*   ROC 曲线下面积 (AUC)\n\n与经典方法不同，ML/DL 技术要求在选择最终最佳预测之前，通过一组两个或多个性能评估算法的对比对结果进行测试。\n\
  \n### 7.7.1 混淆矩阵\n\n混淆矩阵是机器学习中预测分析的工具。为了检查基于分类的机器学习模型的性能，会部署混淆矩阵。我们也可以说，混淆矩阵是分类器（或分类模型）对于二分类任务产生的正确预测和错误预测数量的汇总表。混淆矩阵是一个\
  \ `N×N` 矩阵 `Figure 7.3`，用于评估分类模型的性能，其中 `N` 是目标类别的数量。\n\n![FIGURE 7.3 Confusion Matrix.](img/fig7_3.jpg)\n\
  \nFIGURE 7.3 混淆矩阵。\n\n通过可视化混淆矩阵，个人可以通过观察衡量准确分类数量的角线值来确定模型的准确性。混淆矩阵以方阵的形式存在，列表示实际值，行表示模型的预测值，反之亦然。\n\
  \n*   **TP: True Positive（真阳性）：** 值为正，且模型预测为正值。\n*   **FP: False Positive（假阳性）：**\
  \ 你的预测为正，但实际上是错误的。（也称为第 1 类错误）。\n*   **FN: False Negative（假阴性）：** 你的预测为负，且结果也是错误的。（也称为第\
  \ 2 类错误）。\n*   **TN: True Negative（真阴性）：** 值为负，且模型预测为负值。\n*   **Accuracy（准确率）：**\
  \ 准确率衡量模型对整个测试数据集做出了多少正确预测。准确率是衡量模型性能的良好基础指标。在不平衡的数据集中，准确率会变成一个糟糕的指标。\n\n$$\\begin{matrix}\
  \ {Accuracy\\\\ = \\frac{TP + TN}{TP + TN + FP + FN}} \\\\ {Misclassification\\\\\
  \ = \\frac{FP + FN}{TP + TN + FP + FN}} \\\\ \\\\\\end{matrix}$$\n\n*   **Precision（精确率）：**\
  \ 精确率告诉我们在预测正确的案例中，有多少个实际上是正例。这决定了我们的模型是否可靠。\n\n$$Precision\\\\ = \\frac{TP}{TP\
  \ + TN}$$\n\n在假阳性比假阴性更关注的情况下，精确率是一个非常有用的指标。\n\n*   **Recall（召回率/敏感性）：** 召回率告诉我们通过模型正确预测了多少个实际正例。在假阴性比假阳性更严重的情况下，召回率是一个非常有用的指标。\n\
  \n$$Recall\\\\ = \\frac{TP}{TP + FN}$$\n\n较高的召回率意味着大多数正例（TP+FN）将被标记为正例（TP）。这将导致\
  \ FP 测量值的增加和整体准确率的下降。低召回率意味着会有大量的 FN（本应正例但被标记为负例）。这意味着如果你发现了一个正例，你会有更高的确定性，这可能是一个真阳性。\n\
  \n*   **F1-Score：** 当我们尝试提高精确率时，召回率会下降，反之亦然。F1-Score 是精确率和召回率的调和平均数，因此它提供了这两个指标的综合概念。当精确率等于召回率时，它达到最大值。\n\
  \n$$F1 - \\Score = 2*\\\\frac{1}{\\\\frac{1}{Precision} + \\frac{1}{Recall}} = 2*\\\
  \\frac{Precision\\\\ \\*\\\\ Recall}{Precision\\\\ + Recall}$$\n\nF1-Score 的解释性较差，这意味着我们不知道分类器正在最大化什么——是精确率还是召回率。因此，我们与其他指标结合使用，以获得结果的全貌。\n\
  \n*   **False Positive Rate（假阳性率）：** 假阳性率（FPR）衡量在所有负例中，有多少比例的结果被预测为正例。\n\n$$FPR\
  \ = \\frac{FP}{TN + FP}$$\n\n### 7.7.2 宏平均与微平均\n\n宏平均与微平均的区别在于，宏平均给每个类别以相同的权重，而微平均给每个样本以相同的权重。如果每个类别的样本数量相同，宏平均和微平均将提供相同的得分\
  \ `[1]`。\n\n#### 7.7.2.1 微平均精确率\n\n微平均精确率是所有真阳性的和除以所有真阳性和假阳性的和。换句话说，我们将正确识别的预测数量除以预测总数。之前数据的微平均计算方法如下：\n\
  \n$$PrecisionMicroAvg\\\\ = \\\\frac{\\\\left( {TP\\_{1} + TP\\_{2} + \\\\ldots\
  \ + TP\\_{n}} \\\\right)}{\\\\left( {\\\\left( {TP\\_{1} + TP\\_{2} + \\\\ldots\
  \ + TP\\_{n}} \\\\right) + \\\\left( {FP\\_{1} + FP\\_{2} + \\\\ldots + FP\\_{n}}\
  \ \\\\right) \\\\right)} \\\\right)}$$\n\n#### 7.7.2.2 宏平均精确率\n\n宏平均精确率是不同类别精确率值的算术平均值。之前数据的宏平均计算方法如下：\n\
  \n$$PrecisionMacroAvg\\\\text{~=~}\\\\frac{\\\\left( {Precision\\_{1} + \\\\ Precision\\\
  _{2} + \\\\ldots + \\\\ Precision\\_{n}} \\\\right)}{n}$$\n\n#### 7.7.2.3 微平均召回率\n\
  \n微平均召回率是所有类别真阳性的和除以实际正例（而不是预测正例）。之前数据的微平均计算方法如下：\n\n\n\n\n\n$$RecallMicroAvg\\\\\
  \ = \\frac{\\left( {TP\\_{1} + TP\\_{2} + \\ldots + TP\\_{n}} \\right)}{\\left(\
  \ {\\\\left( {TP\\_{1} + TP\\_{2} + \\ldots + TP\\_{n}} \\\\right) + \\left( {FN\\\
  _{1} + FN\\_{2} + \\ldots + FN\\_{n}} \\right)} \\\\right)}$$\n\n#### 1. 宏召回率 (Macro-Average\
  \ Recall)\n\n平均召回率是所有类别召回率得分的算术平均值。早期数据的平均计算方法如下：\n\n$$RecallMacroAvg\\\\ = \\frac{\\\
  left( {Recall\\_{1} + \\\\ Recall\\_{2} + \\\\ldots \\\\ Recall\\_{n}} \\\\right)}{n}$$\n\
  \n关于微平均和宏平均，我们可以推出以下结论：\n\n#### 2. 微平均 (Micro-Averaging)\n\n微平均统计评估了用于多分类问题训练的模型。当我们需要为每个实例或预测赋予相同的权重时，我们使用微平均。微平均精确率（micro-average\
  \ precision）是单个类别的真正例和除以所有类别的预测正例总和。微平均召回率得分是单个类别的真正例总和除以所有类别的真正例总和。\n\n#### 3.\
  \ 宏平均 (Macro-Averaging)\n\n宏平均统计评估了用于多分类问题训练的模型。在类别不平衡（与不同类别标签关联的实例数量不同）的情况下，我们使用宏平均。宏平均是与精确率、召回率和\
  \ F1 分数相关的单个类别的算术平均值。当我们需要平等对待所有类别，以评估分类器相对于常见类别标签的整体性能时，我们使用宏平均得分。\n\n#### 4. F[β]-SCORE\n\
  \n在二分类的统计分析中，`F`-score 或 `F`-measure 是衡量测试准确性的一个指标。它是根据测试的精确率和召回率计算的，其中精确率是正例结果数除以所有正例结果数（包括未被正确识别的结果），而召回率是正例结果数除以所有应被识别为正例的样本数\
  \ [2]。精确率也称为正性预测值，而在诊断性二分类中，召回率也称为敏感性。\n\n如前所述，`F[1]` 分是精确率和召回率的调和平均值。因此，它在一个指标中对称地表示了精确率和召回率。更通用的得分应用额外的权重，认为精确率或召回率中的一个比另一个更重要。`F`-score\
  \ 的最高可能值为 1.0，表示完美的精确率和召回率；如果精确率或召回率任一为零，则最低值为 0。\n\n`F[β]` 分是一个通用的 `F`-score，它使用正实数因子\
  \ `β`，其中 `β` 的选择使得召回率被认为是精确率的 `β` 倍：\n\n$$F_{\\\\beta} = \\\\left( {1 + \\\\beta^{2}}\
  \ \\\\right) \\cdot \\frac{Precision\\\\text{\\*}Recall}{\\left( {\\\\beta^{2}\\\
  *\\\\ Precision} \\\\right) + Recall}$$\n\n从第一型错误和第二型错误的角度来看，这变为：\n\n$$F_{\\\\beta}\
  \ = \\frac{\\left( {1 + \\beta^{2}} \\\\right)\\\\ TruePositive}{\\left( {1 + \\\
  beta^{2}} \\\\right)*\\\\ TruePositive\\\\ + \\\\beta^{2}\\*\\\\ FalseNegative\\\
  \\ + FalsePositive}$$\n\n#### 5. 马修斯相关系数 (MCC)\n\n马修斯相关系数 (MCC) 是一种用于模型评估的统计工具。它的作用是衡量量或测量预测值与实际值之间的差异，等同于\
  \ 2 × 2 列联表的卡方统计。MCC 是一种不受不平衡数据集影响的替代衡量方法，马修斯相关系数是一种分类矩阵方法，用于计算实际值与预测值之间的皮尔逊积矩相关系数。从混淆矩阵的项目来看，MCC\
  \ 的读取如下：[3]\n\n$$MCC = \\\\frac{TP^{\\*}TN - FP^{\\*}FN}{\\sqrt{{(TP + FP)^{\\*}}{(TP\
  \ + FN)^{\\*}}{(TN + FP)^{\\*}(TN + FN)}}$$\n\n注意，−1 是 MCC 的差值，+1 是最佳值。\n\nMCC 是唯一只有当二分类预测器能够正确预测大多数正数据实例和大多数负数据实例时才会产生高分的二分类率。[80,\
  \ 97] 它的范围在区间 $[−1,+1]$ 之间，在完全误分类和完全分类的情况下，分别达到极值 −1 和 +1，而 MCC = 0 是硬币抛掷分类器的期望值。MCC\
  \ 的一个潜在问题在于，当混淆矩阵的整行或整列为 0 时，MCC 是未定义的。\n\n#### 6. 接收者工作特征 (ROC)\n\n接收者工作特征 (ROC)\
  \ 曲线是总结分类器性能的常用方法。ROC 曲线（接收者工作特征曲线）是显示分类模型在所有分类阈值下性能的图 [4]。该曲线绘制了两个参数：真例率和假正例率。\n\
  \n#### 7. 曲线下面积 (AUC)\n\n广泛用于总结 ROC 曲线一个重要元素的量是曲线下面积 (AUC)。AUC 可以解释为平均真例率，即认为假正例率的所有值都是可能的（图\
  \ 7.4 ）。或者，它可以被看作分类器为 *P* 中随机选择的实例分配更高分相对于为 *N* 中随机选择的实例分配更高分的概率。显然，较高的 AUC 是理想的。\n\
  \n#### 8. 示例\n\n现在应该很清楚，两个基本考虑因素——操作意图和评估目标——指导平均方法的选择。首要考虑因素是分类器是否打算使用公共的固定阈值在所有数据集上运行。这决定了平均应该是基于此类固定阈值（即池化或阈值平均），还是在\
  \ ROC 空间中进行。如果 ROC 空间平均是合适的，进一步的考虑因素指导了对 ROC 点进行平均的方向。平均 ROC 曲线可以传达分类相对于固定假正例率、真例率、错误率比例或误分类成本比例的性能。\n\
  \n#### 9. ROC 曲线的使用\n\n\n\n\n\n盲目使用 ROC 曲线组合方法充满了风险。我们总结了常用方法，并指出了它们在操作背景下的解释。从根本上说，组合方法的合适选择必须与分类器的处理方法相对应。我们强调，在分类器的设计和开发背景下，如果在展示和评估结果时不不加留心和考虑，可能会丢失价值信息。\n\
  \n## 7.8 总结\n\n我们讨论了人工智能的性能分析。为了评估性能，我们需要进行数据采集、数据数字化、数据过滤（清洗）和预处理、特征提取、降维和数据分类。我们解释了降维是一个至关重要的过程，因为如果特征与分类无关，我们需要消除它们，从而节省处理时间并降低复杂度。然而，混淆矩阵、宏平均（macro-averaging）和微平均（micro-averaging）、`F`[`β`]-Score、`MCC`、`ROC`\
  \ 和 `AUC` 被用于评估分类器的性能。这意味着没有单一的方法可以提供结论，因为一切都取决于分类器所应用的应用目标。我们可以使用不同的算法来比较分类器的结果，以找出哪一个符合目标。\n\
  \n## 参考文献\n\n*   [1] 网站： [`www.educative.io/answers/what-is-the-difference-between-micro-and-macro-averaging`](https://www.educative.io/answers/what-is-the-difference-between-micro-and-macro-averaging)。\n\
  \n*   [2] 网站： [`en.wikipedia.org/wiki/F-score`](https://en.wikipedia.org/wiki/F-score).\n\
  \n*   [3] Chico，, D. and Jurman, G., “The Advantages of the Matthews Correlation\
  \ Coefficient (MCC) Over F1 Score and Accuracy in Binary Classification Evaluation,”BMC\
  \ Genomics, 2020, [`doi.org/10.1186/s12864-019-6413-7`](https://doi.org/10.1186/s12864-019-6413-7)。\n\
  \n*   [4] Poole，, D. L. and Mackworth, A. K., “Artificial Intelligence: Foundation\
  \ of Computational Agents,” 第二版, 2017, Cambridge University Press.\n\n# 8 无监督机器学习\n\
  \nDOI: [10.1201/9781003499466-8](https://doi.org/10.1201/9781003499466-8)\n\n无监督学习是机器学习的一个分支，它从没有任何标签的数据中学习。它涉及使用和识别数据中的模式以执行数据压缩或生成模型等任务。近期，利用无结构化原始网络数据进行无监督机器学习趋势日益增长，以提高网络性能并提供服务，如流量工程、异常检测、互联网流量分类和业务质量优化。在网络领域应用无监督学习技术的兴趣日益增长，这源于它们在其他领域的巨大成功，例如计算机视觉、自然语言处理、语音识别和最优控制（例如用于开发自动驾驶汽车）。此外，无监督学习可以让我们摆脱对标记数据和人工手工特征工程的需求，从而促进了灵活、通用和自动的机器学习方法。这些机器学习算法不需要任何先验知识或人工干预，就能发现隐藏的模式或数据相似性分组，并从中生成具有想象力的内容。通常，使用降维、可视化、关联规则学习和聚类算法。\n\
  \n为了开发可靠的数据驱动网络，在将数据输入适当的无监督 ML/DL [1] 之前必须考虑数据质量。无监督 ML/DL 技术促进了原始数据集的分析，从而有助于从未标记数据中生成分析见解。层次学习、聚类算法、因子分析、潜在模型和异常值检测的最新进展显著推动了无监督\
  \ ML 技术的发展。这通过允许在不需要对特征制作进行精细工程和领域知识的情况下处理原始数据，显著提升了 ML/DL 的技术水平。深度学习是机器学习的一类，使用分层架构进行无监督特征学习，然后将这些学习到的特征用于分类和其他任务。深度学习和分布式机器学习的多功能性从其应用的多样化中可以看出，范围从自动驾驶汽车到脑回路重建。无监督学习也经常在半监督设置中与监督学习结合使用，用于对数据进行预处理，帮助构建良好的特征表示并在未标记数据中寻找模式和结构。\n\
  \n深度神经网络的快速进步、通过云计算和分布式计算实现的计算能力民主化，以及存储和处理海量数据的能力，激发了在该领域应用无监督 ML 技术的浓厚兴趣。网络领域似乎也适合并适用于无监督\
  \ ML 技术，这是由于其协议在很大程度上是分布式决策的性质、大量网络数据的可用性以及对智能/认知网络的迫切需求。\n\n如今的网络已经演变得非常复杂，它们包含了多个物理路径以实现冗余，并利用复杂的路由方法来引导流量。应用流量并不总是采取我们预期的最优路径，导致了意外且低效的路由性能。为了克服这种复杂性，无监督\
  \ ML 技术可以考虑实时网络拥塞统计以及应用 QoS 要求等因素，自主地组织网络。\n\n## 8.1 层次聚类\n\n层次聚类是一种流行的对象分组方法。它创建组，使得组内的对象相互相似，而与其他组的对象不同。聚类通过称为树图的层次树进行可视化表示。这是一种数据挖掘和统计分析中的常用策略，通过凝聚（自下而上）或分裂（自上而下）方法将数据聚成层次。几乎所有的层次聚类算法都是无监督且确定性的。层次聚类相对于无监督\
  \ K-means 和 EM 算法的主要优势是它不需要预先指定簇的数量。然而，这种优势是以计算效率为代价的。与 K-means 和 EM 算法的线性复杂度相比，常见的层次聚类算法至少具有平方复杂度。层次聚类方法有一个缺陷：这些方法无法准确分类混乱的高维数据，因为其启发式方法可能会由于经验数据的结构缺陷而失效。此外，常见的凝聚层次聚类算法的计算复杂度是\
  \ NP 的。自组织映射（SOM）是一种可以克服层次模型缺陷的现代方法。\n\n## 8.2 贝叶斯聚类\n\n\n\n\n\n在聚类过程贝叶斯公式中，将项目划分为子集成为数据概率模型的一个参数，并受先验假设的影响，关于聚类的推断源于后验分布的属性。基本上，这是一种概率聚类策略，根据先验概率分布学习数据的后验分布。贝叶斯聚类分为两大类，即参数化和非参数化。参数化和非参数化技术的主要区别在于参数空间的维度：如果参数空间具有有限维度，则底层技术被称为贝叶斯参数化；否则，底层技术被称为贝叶斯非参数化。贝叶斯聚类方法的一个主要陷阱是选择错误的先验概率分布会扭曲数据的投影。贝叶斯非参数聚类可以用于确定网络类型。\n\
  \n## 8.3 划分聚类\n\n划分聚类将数据集分解为一组不相交的簇。给定一个包含 `N` 个点的数据集，划分方法为数据构建 `K(N≥K)` 个划分，每个划分代表一个簇。划分聚类对应于一类特殊的聚类算法，它们将数据分解为一组不相交的簇。划分聚类进一步分为\
  \ K-means 聚类和混合模型。\n\n### 8.3.1 K-means 聚类\n\nK-means 聚类是一种无监督学习算法。与监督学习不同，这种聚类没有标记数据。K-means\
  \ 执行将对象划分为具有相似性且与另一个簇的对象不同的簇。术语 `K` 是一个数字。K-means 聚类是一种简单但广泛使用的分类方法。它将统计向量作为输入来推断分类模型或分类器。K-means\
  \ 聚类倾向于将 `m` 个观测值分布到 `n` 个簇中，每个观测值属于最近的簇。观测值与簇的关系通过簇均值确定。K-means 聚类用于网络分析和流量分类领域的许多应用。K-means\
  \ 聚类已与监督的迭代二分法 3 (`ID3`) 决策树学习模型结合，用于检测网络异常。注意 `ID3` 决策树是一种基于概念学习系统的迭代监督决策树算法。K-means\
  \ 聚类在流量分类中提供了优秀的结果。K-means 聚类在流量分类中表现良好，准确率达到 90% [1]。\n\nK-means 聚类的另一种变体被称为 K-medoids，它不是取簇的平均值，而是考虑簇中最中心的数据点作为相应簇的参考点。\n\
  \n对 KDD-99 数据集子集的实验结果显示，检测率保持在 96% 以上，而误报率保持在 4% 以下。K-means 算法的实验结果和分析表明其具有更好的全局搜索簇的能力\
  \ [1]。与 K-means 类似，K-medoids 是一种相关的算法，它通过找到最小化数据点与其最近质心之间差异性和的质心将数据划分为 `k` 个不同的簇。集合的质心是该集合中的一个成员，其与集合其他成员的平均差异性最小。K-medoids\
  \ 的少数应用被用于异常检测领域。\n\n### 8.3.2 混合模型\n\n混合模型是用于单变量和多变量数据的强大概率模型。混合模型用于在仅有汇总总体观测值的情况下，对子群的属性进行统计推断和演绎\
  \ [1]。 它们还被用于模式识别和计算机视觉领域的数据统计建模。有限混合是混合模型的基本类型，自然地对由一组交替随机源产生的观测值进行建模。根据这些源各自的观测值推断并推导出不同参数会导致观测值集的聚类。这种聚类方法克服了基于启发式的聚类方法的缺点，因此被证明是任何大规模网络中节点分类的有效方法，并且与常用技术相比，显示出产生有效结果的能力。例如，K-means\
  \ 和层次聚类法依赖于监督性设计决策，例如簇的数量或模型的有效性 [1]。此外，将期望最大化 (`EM`) 算法与混合模型结合在解析通过多维网络连接的顶点结构和拓扑方面取得了显著结果。可见，高斯混合模型\
  \ (`GMM`) 在网络流量异常检测中优于基于特征的检测。\n\n## 8.4 聚类在网络中的应用\n\n基于此相似值的网络节点被分为所谓的簇。换句话说，每个簇包含共享共同属性和特征的元素。所有簇的集合构成了聚类。聚类可以出现在几乎所有的无监督学习问题中，聚类在计算机网络领域有多种应用。可以看到大量使用聚类的两个主要网络应用是入侵检测和互联网流量分类。使用遗传算法\
  \ (`GA`) 对数据进行预处理，然后与层次聚类法结合，被称为基于层次聚类的平衡迭代缩减 (`BIRCH`)，用于提供一种基于支持向量机 (`SVM`) 的高效分类器。这种层次聚类方法存储的是抽象数据点而不是整个数据集，因此与过去所有方法相比，提供了更准确、更快速的分类，在检测异常方面产生了更好的结果。还可以使用无监督学习的基于网格和基于密度的聚类进行异常和入侵检测。k-shape\
  \ 聚类方案可用于分析移动使用的时空异质性。\n\n## 8.5 隐变量模型\n\n\n\n\n\n潜变量模型涉及一组观测变量 `A{x[1],x[2], \\\
  dots, x[k]}` 和一个潜（不可观测）变量 `θ`，该变量可以是单维的（即标量），也可以是维度 `d ≤ k` 的向量。因此，潜变量模型是将显变量与一组潜或隐藏变量联系起来的统计模型。潜变量模型允许我们通过扩展变量空间上的可处理联合分布来表示相对复杂的分布\
  \ [1]。过程的底层变量使用固定变换在高维空间中表示，而随机变化被称为潜变量模型，其中高维空间中的分布是由少数隐藏变量共同作用的结果。这些模型用于数据可视化、降维、优化、分布学习、盲信号分离和因子分析。接下来，我们还讨论了各种潜变量模型，即混合分布、因子分析、盲信号分离、非负矩阵分解、贝叶斯网络和概率图模型（PGM）、隐马尔可夫模型（HMM）以及非线性降维技术（进一步包括生成式拓扑映射、多维尺度变换、主曲线、ISOMAP、局部线性嵌入和\
  \ t-分布随机邻域嵌入）。\n\n### 8.5.1 混合分布\n\n混合分布是写为其他分布的凸组合的分布。事实上，混合分布是一种重要的潜变量模型，用于估计底层密度函数。混合分布通过使用更简单的参数分布为密度估计提供了一个通用框架。期望极大（EM）算法用于通过最大化混合分布模型的对数似然函数来估计混合分布模型\
  \ [1]。\n\n### 8.5.2 因子分析\n\n因子分析是一种用于将许多变量减少为少数因子的技术。该技术从所有变量中提取最大公方差并将其转化为公共得分。作为所有变量的索引，我们可以使用该得分进行进一步分析。注意，因子分析是另一种重要的潜变量模型，也是一种密度估计模型。它在协同过滤和降维中被频繁使用。与其他潜变量模型不同，它允许不同维度具有不同的方差，因为传统设置许多降维模型使用固定方差的高斯噪声模型。在因子分析模型中，潜变量具有对角协方差，而非各向同性协方差。\n\
  \n## 8.5.3 盲信号分离\n\n盲信号分离（BSS）是指源和混合矩阵不确定，仅有观测信号可用于分离过程的问题。其目标是使用观测信号分离出未知且独立的源。BSS\
  \ 也称为盲源分离，是在在没有或只有极少关于混合过程信息的情况下，从混合输入信号中识别并分离出独立源信号。用于 BSS 的常用技术是主成分分析（PCA）和独立成分分析（ICA）。\n\
  \n### 8.5.3.1 主成分分析\n\n主成分分析（PCA）是一种降维方法，通常用于通过将一组大变量转换为较小集合来减少大型数据集的维度，该集合仍包含原始集合的大部分信息。它是一种统计程序，利用对数据进行正交变换将\
  \ `n` 个可能相关的变量转换为较少的 `k` 个不相关变量，这些变量被称为主成分。主成分按其变异性降序排列，第一个对应变异性最大的，最后一个对应变异性最小。作为探索性数据分析的主要技术，PCA\
  \ 接收 `n` 维的数据云并对其进行旋转，使得数据中的最大变异性可见。通过这种技术，它能够揭示数据集中的强模式，使得这些模式更易识别，从而使数据更容易探索和可视化。PCA\
  \ 主要用于降维，将 `n` 维输入数据减少到 `k` 维，而不丢失数据中的关键信息。主成分数量的选择是一个设计决策问题。关于选择组件数量已经进行了许多研究，例如交叉验证近似。在理想情况下，选择\
  \ `k` 使得平均平方投影误差与数据总变异之比小于或等于 1%，从而在 `k` 个主成分中保留 99% 的变异 [1]。但根据应用领域，不同的设计可以在最大化所需输出的同时增加/减少该比例。通常，数据集的许多特征往往高度相关。因此，PCA\
  \ 的结果是在保留 99% 变异的同时显著减少了数据维度。\n\n### 8.5.3.2 独立成分分析\n\n独立成分分析（ICA）是一种通过假设非高斯信号分布允许将混合信号分离为不同源的技术。ICA\
  \ 通过探索测量数据背后的独立性来提取源。注意，ICA 是另一种 BSS 技术，侧重于将变量输入数据分离为加性成分，其底层假设是成分是非高斯且在统计上独立的。理解\
  \ ICA 的最常见例子是鸡尾酒会问题，房间里 `n` 人同时说话，一个人试图听某个单一声音。ICA 通过最小化统计依赖性或最大化输入信号成分之间的非高斯属性（同时保持底层假设有效），从输入混合信号中分离源信号。从统计学上讲，ICA\
  \ 可以看是 PCA 的扩展，而 PCA 试图最大化数据的二阶矩（方差），因此严重依赖高斯特征；另一方面，ICA 利用数据固有的非高斯特征，并试图最大化输入线性组合的四阶矩，以提取数据中的非正态源成分。\n\
  \n### 8.5.4 非负矩阵分解\n\n非负矩阵分解（NMF 或 NNMF），也称为非负矩阵近似，是多元分析和线性代数中的一组算法，矩阵 `V` 被分解为（通常是两个矩阵\
  \ `W` 和 `H`，且三个矩阵都没有负元素。因此，NMF 是一种将大矩阵分解为两个或多个无负值的较小矩阵的技术，当它们相乘时，可以重建近似的原始矩阵。NMF\
  \ 是一种用于分解多元数据的新颖方法，使探索性分析变得简单直接。通过 NMF，可以通过将数据分解为较小的块来识别其中的隐藏模式和内在特征，在正性约束下增强数据分析的可解释性。然而，存在许多类\
  \ NMF 算法 [1]，它们具有不同的泛化属性，例如，[101] 分析了其中两种，其中一种最小化最小二乘误差，另一个则专注于 Kullback-Leibler\
  \ 散度以保持算法收敛性。\n\n\n\n\n\n### 8.5.5 隐马尔可夫模型\n\n隐马尔可夫模型（HMMs）是一种序列模型。也就是说，给定一个输入序列（如单词），`HMM`\
  \ 会计算出一个长度相同的输出序列。`HMM` 是一个图，节点是标签的概率分布，边表示从一个节点到另一个节点的转移概率。HMM 是具有极大用处的随机模型，特别是在我们希望分析时间或动态过程的领域，例如语音识别、认知无线电网络（CRNs）中的主用户（PU）到达模式等。HMM\
  \ 与 CRNs 具有高度相关性，因为 CRNs 中的许多环境参数是直接观测的。基于 `HMM` 的方法可以对比马尔可夫随机过程进行分析性建模，在该过程中，我们无法访问实际状态（这些状态被假设为未观测到或隐藏的），相反，我们可以观测到一个在随机上依赖于隐藏状态的状态。正因如此，`HMM`\
  \ 被定义为双重随机过程。\n\n### 8.5.6 贝叶斯网络与概率图模型\n\n贝叶斯网络和概率图模型是用于表示不确定领域知识的概率图模型，其中每个节点对应一个随机变量，每条边代表对应随机变量的条件概率。贝叶斯网络（又名贝叶斯网络、Bayes\
  \ 网、信念网络或决策网络）是一种通过有向无环图（DAG）表示一组变量及其条件依赖关系的概率图模型。它是几种因果表示法中的一种形式之一。在贝叶斯学习中，我们试图寻找所有参数设置的后验概率分布；在这种设置下，我们确保对于每一个可能的参数设置都有一个后验概率。这在计算上是昂贵的，但我们可以使用小数据集配合复杂模型，并仍然避免过拟合。后验概率通过采样分布与先验分布的乘积除以边缘似然来计算。简单来说，后验概率是使用贝叶斯定理计算的。强化学习的基础也是通过贝叶斯定理得到的\
  \ [1]。由于贝叶斯学习计算代价，一个新的研究趋势是近似贝叶斯学习。随着贝叶斯深度学习框架的出现，基于贝叶斯学习的解决方案的部署正在快速增加。概率图建模与贝叶斯学习相关的概念。通过图表示随机变量之间概率关系的模型被称为概率图模型（PGM）。图中的节点和边分别代表随机变量及其概率依赖关系。PGM\
  \ 分两种类型：有向 PGM 和无向 PGM。贝叶斯网络也属于有向 PGM 范畴。PGM 用于计算机视觉、语音处理和通信系统等许多重要领域。贝叶斯学习结合 PGM\
  \ 和隐变量模型，形成了一个概率框架，其中深度学习被用作基底，为推荐系统、主题建模和控制系统构建改进的学习架构。\n\n### 8.5.7 隐变量模型在网络中的应用\n\
  \n隐变量通常用于结构方程建模（SEM），这是一种用于测试复杂理论模型的统计技术。SEM 允许研究人员测试隐变量与观测变量之间的关系，并估计这些关系的强度。隐变量方法已将隐结构应用于邮件语料库以寻找可解释的隐结构，并评估其在缺失数据任务上的预测准确性。动态隐模型已应用于社交网络。BSS\
  \ 是一组统计算法，广泛应用于不同的应用领域，以执行降维、特征关联和映射等任务。`PCA` 用于互联网流量分类，以分离网络数据包流中的不同类型流。同样，在半监督方法中，`PCA`\
  \ 用于特征学习，`SVM` 分类器用于自主网络系统中的入侵检测。另一种用于检测异常和入侵的方法建议使用 `NMF` 对不同流特征进行分解并对其进行相应的聚类。此外，`ICA`\
  \ 已广泛用于电信网络，以分离混合和噪声源信号以提供高效服务。例如，一种 `ICA` 的变体——高效快速 ICA（EF-ICA）已用于检测和估计从源端接收的混合码分多址（CDMA）信号中的符号信号。在其他文献中，`PCA`\
  \ 使用概率方法来寻找在无线网络中检测异常的置信度。此外，`PCA` 也被选为聚类设计具有多个汇聚节点的无线传感器网络（WSNs）的方法 [1]。\n\n贝叶斯学习已应用于互联网流量分类，根据后验概率分布对互联网流量进行分类。对于校园网络早期的流量识别，使用了真实的离散化条件概率来构建贝叶斯分类器。已使用贝叶斯网络用于边界网关协议（BGP）中的主机级入侵检测和异常分类。文献还描述了使用贝叶斯信念网络进行互联网威胁检测和离群检测\
  \ [1]。一种使用贝叶斯信念网络进行离群检测的新方法在 [1] 中描述。探索了贝叶斯网络在 MIMO 系统中的应用。讨论了局域网（LAN）中使用贝叶斯网络进行的位置估计。同样，贝叶斯理论和\
  \ PGM 也用于低密度奇偶校验（LDPC）和 Turbo 码，这些是信息编码理论的基础组件。\n\n## 8.6 降维\n\n用较少的维度表示数据是无监督学习的另一个成熟任务。现实世界的数据通常是高维的——在许多数据集中这些维度可能达到数千甚至数百万个潜在相关的维度。然而，观察到数据的内在维度（控制参数）小于维度总数。为了通过提取内在维度来寻找底层数据的本质模式，必须确保真实的本质不会丢失，例如，某些现象可能仅在高维数据中可观测，而在低维中被抑制，这种现象被称为“维度灾难”。\n\
  \n\n\n\n特征选择传统上被视为一项有监督的任务，由领域专家帮助手工构建一组数据的数据的关键特征。这种方法通常效果良好，但缺乏可扩展性且容易受到判断偏差的影响。另一方面，降维通常是一种更通用的无监督任务，它不是选择特征子集，而是作为所有特征的函数创建新的特征（维度）。换句话说，特征选择考虑了监督数据标签，而降维则关注\
  \ `N` 维空间中的数据点及其分布。存在多种减少数据维度的技术，包括将高维点投影到低维空间、独立表示和稀疏表示，这些技术应该能够重建近似数据。降维对于数据建模、压缩和可视化非常有用。\n\
  \n通过创建数据的具有代表性的功能维度并消除冗余维度，可以更容易进行可视化并形成学习模型。独立表示试图断开数据分布底层的变异源，使得表示的维度在统计上是相互独立的。稀疏表示技术通过少量基向量的线性组合来表示数据向量。值得注意的是，许多潜变量模型（例如\
  \ `PCA`、`ICA`、因子分析）也作为降维技术。除了 `PCA` 和 `ICA` 等通过数据的线性投影推断数据潜在内在结构的技术外，还开发了若干非线性降维技术。线性降维技术在许多情况下很有用，但由于它们的子空间假设（假设高维数据点位于线性子空间，例如\
  \ 2D 或 3D 平面），这些方法可能会忽略数据中重要的非线性结构。当数据点随机但与邻居高度相关时，这种假设在高维情况下会失效。在这种环境中，通过流形学习技术进行非线性降维变得可行——这种技术可以被视为对\
  \ `PCA` 等线性框架的推广尝试，以便识别数据中的非线性结构。尽管存在一些监督变体，但流形学习主要以无监督的方式进行，从数据本身的高维结构中学习非线性流形子结构，而不使用任何预先定义的分类器或标记数据。下一节将描述一些非线性降维（流形学习）技术。\n\
  \n### 8.6.1 ISOMAP\n\nISOMAP 用于计算一组高维数据点的准等距低维嵌入。该算法提供了一种简单的方法，根据每个数据点在流形上邻居的粗略估计，来估计数据流形的内在几何结构。也就是说，ISOMAP\
  \ 是一种非线性降维技术，用于发现数据集底层的低维几何信息。此外，结合了 `PCA` 和多维尺度变换 (`MDS`) 的算法特征，以学习数据中的低维非线性流形结构。ISOMAP\
  \ 使用最短路径上的地线距离来计算低维表示的最短路径，这可以通过 `Dijkstra 算法` 计算。`MDS` 是一个简单的距离矩阵。在 `PCS` 中，数据集的每行是一个观测值，每列是一个特征。\n\
  \n### 8.6.2 GENERATIVE TOPOGRAPHIC MAPPING\n\n生成式拓扑映射 (`GTM`) 表示从嵌入高维空间中的连续低维分布到非线性潜变量映射。`GTM`\
  \ 中的数据空间表示为参考向量，这些向量是数据空间中潜点的投影。`GTM` 是一个显示高度变化的区域，通常用等高线表示不同的固定高度。它是自组织映射 (`SOM`)\
  \ 的一种概率变体，通过计算数据点之间的欧式距离来工作。`GTM` 优化对数似然函数，生成的概率定义了数据空间中的密度。\n\n### 8.6.3 LOCALLY\
  \ LINEAR EMBEDDING\n\n局部线性嵌入 (`LLE`) 是一种机器学习和数据分析中使用的降维技术。它侧重于将高维数据映射到低维空间时保持数据点之间的局部关系。`LLE`\
  \ 是一种无监督非线性降维算法。`LLE` 在低维中表示数据，同时保留了高维嵌入。`LLE` 在输入数据低维映射的单一全局坐标中描绘数据。`LLE` 用于可视化多维流形和特征提取。\n\
  \n### 8.6.4 PRINCIPAL CURVE\n\n主曲线是穿过 `p` 维数据集中间的平滑一维曲线，提供了数据的非线性总结。这是一种非线性数据集总结技术，其中非参数曲线穿过\
  \ `p` 维（多维）数据集的中间，提供对数据集的总结。这些平滑曲线最小化数据点之间的平均平方正交距离；这一过程也类似于存在高斯噪声时非线性回归的极大似然估计。\n\
  \n### 8.6.5 NONLINEAR MULTI-DIMENSIONAL SCALING\n\n非度量多尺度变换 (`NMDS`) 是一种基于距离的排序技术。数据矩阵（`n`\
  \ 样本单位 × `p` 物种）被转换为 `n x n` 距离矩阵（或更通地说，差异矩阵），排序基于距离矩阵。`NMDS` 是一种非线性潜变量表示方案，作为因子分析的替代方案。在因子分析中，假设了多元正态分布，不同对象之间的相似性表示为相关矩阵。而\
  \ `NMDS` 不施加这种条件，它设计用于达到最优低维配置，在该配置中可以观察矩阵之间的相似性和差异性。`NMDS` 也用于数据可视化和挖掘工具，根据距离矩阵中的相似性在维中表示多维数据。\n\
  \n### 8.6.6 T-DISTRIBUTED STOCHASTIC NEIGHBOR EMBEDDING\n\nt 分布随机邻嵌入 (`t-SNE`) 描述了当总体标准差未知且观测值来自正态分布总体时，样本均值到总体均值的标准化。`t-SNE`\
  \ 是另一种非线性降维方案。它用于将维数据表示在 2 维或 3 维中。`t-SNE` 在高维空间构建概率分布并在低维中构建类似的分布，并最小化两个分布之间的 Kullback-Leibler\
  \ (`KL`) 散度。\n\n## 8.7 OUTLIER DETECTION\n\n\n\n\n\n离群点检测是识别与其他数据点显著不同的数据点的过程。数据挖掘中三种主要的离群点检测方法是统计的、基于近性的以及基于模型的。离群点检测是无监督学习的一个重要应用。远离其他样本的样本被称为离群点。离群点的出现由于噪声、测量误差、重尾分布以及两种分布的混合引起。无监督离群点检测有两种流行的底层技术，许多算法均基于此设计，即基于最近邻的技术和基于聚类的方法。\n\
  \n### 8.7.1 最近邻异常检测\n\n最近邻异常检测技术假设正常数据实例出现在稠密邻域中，而异常值发生在远离其最近邻居的地方，这需要对两个数据实例之间定义距离或相似性度量。可以通过不同的方式计算距离或相似性。最近邻方法通过估计每个样本到数据集中所有其他样本的欧几里距离或平均距离来工作。有许多基于最近邻技术的算法，其中最近邻最著名的扩展是\
  \ `k-nearest neighbor` 技术，其中只有 `k-nearest neighbors` 参与离群点检测。\n\n### 8.7.2 局部离群因子\n\
  \n局部离群因子（LOF）算法是一种无监督异常检测方法，它计算给定数据点相对于其邻居的局部密度偏差。它将密度明显低于其邻居的样本视为离群点。它作为 `k-nearest\
  \ neighbor` 算法的扩展工作。\n\n### 8.7.3 基于连通性的离群因子\n\n基于连通性的离群因子（COF）计算观测值的连通性离群因子，即比较受离群评分的观测值与其邻居观测值之间的链距离。`COF`\
  \ 函数用于聚类和其他多维领域中的离群点检测。\n\n### 8.7.4 受影响离群性\n\n受影响离群性（INFLO）计算观测值的影响离群性评分，即比较受离群评分的观测值邻域的密度与其反向邻域的密度。`INFLO`\
  \ 函数用于聚类和其他多维领域中的离群点检测。\n\n### 8.7.5 局部离群概率模型\n\n局部离群概率（LoOP）是一种基于局部密度的离群点检测方法，提供\
  \ `[0,1]` 范围内的离群点评分，这些评分可以直接解释为样本成为离群点的概率。\n\n## 8.8 无监督学习的关键特征\n\n这里总结了无监督学习技术的关键特征：\n\
  \n* 层次化学习技术是文献中特征检测和提取最流行的方案。\n* 在扩展的变量空间上学习复杂分布的联合分布是一项艰巨的任务。隐变量模型是文献中解决该问题的推荐且成熟的方案。这些模型还用于降维和对数据的更好表示。\n\
  * 未标记多维数据的可视化是另一项无监督任务。在这项研究中，我们探索了降维作为开发更优多维数据可视化工具的底层方案。\n\n## 8.9 无监督学习在网络中的应用\n\
  \n我们强调了其在网络中广泛的应用范围，并强调了基于 ML/DL 的技术（而非经典的硬编码统计方法）对于实现更高的效率、适应性和性能增强的重要性。无监督学习在网络中的一些主要用途列如下：\n\
  \n* 互联网流量分类\n* 异常/入侵检测\n* 网络运营、优化与分析\n    * 服务质量/体验质量\n    * 传输控制协议优化\n* 降维与虚拟化\n\
  * 新兴网络应用\n    * 软件网络\n    * 物联网\n    * 传输控制协议优化\n\n与网络应用中的无监督学习相关的建议总结如下：\n\n* 文献中一种推荐且研究过的无监督互联网流量分类方法是数据聚类，结合使用\
  \ `autoencoders` 对流量特征集进行隐变量表示学习。如果需要，`Min-max ensemble learning` 将有助于提高无监督学习的效率。\n\
  * 鉴于某些标记流量数据和信道特性可用用于初始模型训练，半监督学习也是互联网流量分类的一种种合适方法。\n* 生成式模型和迁移学习在互联网流量分类中的应用在文献中尚未得到充分探索，是一个潜在的研究方向。\n\
  * 网络流量的爆发式增长以及随着 5G 和 IoT 演进带来的流量激增也提升了网络流量中威胁和异常的水平。为了处理互联网流量中的这些异常，数据聚类、`PCA`、`SOM`\
  \ 和 `ART` 是文献中经过充分探索的无监督学习技术。自学习也被探索作为异常检测的潜在解决方案，并且仍然是未来网络流量异常检测研究的一个可能方向。\n* 目前网络流量降维的现状基于\
  \ `PCA` 和多维缩放。`Autoencoders`、`t-SNE` 和 `manifold learning` 是降维和可视化方面潜在的研究领域。\n\n\
  ## 8.10 未来网络：研究挑战与机遇\n\n我们对未来工作的一些开放方向以及在网络领域应用无监督 ML/DL 的相关机遇提供了讨论。\n\n### 8.10.1\
  \ 简化的网络管理\n\n\n\n\n尽管近年来提出了如软件定义网络（SDN）等新型网络架构以简化网络管理，但网络运营商仍然被要求掌握过多的知识，并通过其监控源将他们对网络设计的了解与当前网络状况相关起来。那些通过手动苦应对复杂性来管理这些要求的运营商，将欢迎任何来自（半）自动无监督机器学习的缓解。随着\
  \ ML/DL 在网络领域变得无处不在，必须克服“语义鸿沟”——该鸿沟指的是将 ML 结果转换为网络运营人员可操作的洞察和报告的关键挑战。这可以促进网络管理从从响应式的交互模式（即当网络出现问题时，网络管理员被要求检查地图和图表）转向主动式模式（即为不同的服务和网络区域创建自动报告和通知）。这将超越仅仅是通知和可视化，转向更深层次的综合，从而识别出潜在的问题源。另一个例子与使测量更以用户为导向有关。大多数用户对用户体验（QoE）而非服务质量（QoS）感兴趣，即当前网络状况如何影响他们的应用程序和服务，而不仅仅是原始的\
  \ QoS 指标。测量目标的发展应该从业务直角度出发——而不仅仅是通过各种工具和协议（如 `traceroute`、`ping`、`border gateway\
  \ protocol` (`BGP`) 等）收集的统计数据，并将将各种知识整合在一起的负担交给用户。\n\n### 8.10.2 计算机网络中的半监督学习\n\n\
  半监督学习介于监督学习和无监督学习之间。半监督学习背后的思想是使用无标记数据结合少量标记标记示例来提高学习能力。在计算机网络中，半监督学习部分用于异常检测和流量分类，并具有巨大的潜力与生成对抗网络等深度无监督学习架构结合，以提高异常检测和流量分类的先进水平。同样，网络安全的用户行为学习也可以以半监督的方式处理。文中还研究了一种基于半监督学习的异常检测方法。所介绍的方法使用了大量未标记样本结合有标记样本来构建更好的入侵检测分类器。一个单隐藏层前馈神经网络（`NN`）经过训练以输出模糊隶属向量。结果显示，使用未标记样本有助于显著提高分类器的性能。\n\
  \n### 8.10.3 计算机网络中的迁移学习\n\n迁移学习是一种新兴的 ML/DL 技术，将从一个问题中学习的知识应用于另一个不同但相关的问题。虽然人们通常认为对于\
  \ ML 算法，训练数据和未来数据必须在相同的特征空间中且具有相同的分布，但在许多现实应用中情况并非如此。在这种情况下，在不同任务领域之间进行迁移学习或知识迁移是理想的。迁移学习已成功应用于计算机视觉和自然语言处理（`NLP`）应用，但在网络领域的实现尚未被报道——尽管从原理上说，由于互联网流量和企业网络流量在许多方面具有相似性，这在网络中也是很有用的。还研究了用于\
  \ 5G 网络中提供回传卸载的无线网络基于学习的缓存程序。\n\n### 8.10.4 计算机网络中的联邦学习\n\n联邦学习是一种协作式 ML/DL 技术，它不利用中心化的训练数据，通过在不同的机器上分配处理来工作。联邦学习被认为是云网络的下一个大趋势，因为确保了用户数据的隐私，并减少了云端计算以降低成本和能量。文中介绍了联邦云中网络地址管理的系统和方法，并使用了联邦\
  \ IoT 和云计算在医疗保健领域的应用。研究了一种用于联邦云和 IoT 的端到端安全架构。\n\n### 8.10.5 计算机网络中的生成对抗网络\n\n对抗网络——基于由蒙特利尔大学\
  \ Goodfellow 及其最初提出的生成对抗网络（`GAN`）训练——最近出现作为一种新技术，通过这种技术，机器可以通过观察世界（而不一定被提供标记数据）来训练以预测结果。对抗网络包含两个神经网络（`NN`）模型：\n\
  \n* 一个生成器，负责从某些随机输入生成某种类型的数据；以及\n* 一个判别器，其任务是区分来自生成器的输入或真实数据集。\n\n这两个 `NNs` 协同优化，使得生成器生成的数据更真实，使判别器对现实世界中的合理性有更好的判断。文中还提出了一种用于生成恶意软件示例以攻击恶意软件分类器的\
  \ `GAN`，并针对此提出了防御措施。还提出了另一种针对恶意软件分类器的对抗扰动攻击。在网络中使用 `GANs` 进行 ML/DL 可以提高基于 ML/DL\
  \ 的网络应用的性能，例如异常检测，恶意用户有动力设计新的攻击以规避网络管理员的检测。\n\n## 8.11 在网络中使用 ML/DL 的陷阱与注意事项\n\n\
  尽管无监督学习具有优点和引人注目的结果，但也存在许多文献中未广泛讨论的缺点。接下来将讨论与无监督学习相关的潜在陷阱和注意事项。\n\n### 8.11.1 不恰的技术选择\n\
  \n首先，第一个潜在陷阱可能是技术选择。不同的无监督学习和预测技术在某些应用中可能获得极结果，而在另一些应用中表现很差——为当前任务选择最佳技术是重要的。另一个原因可能是用于预测依据的特征或参数选择不当——因此参数优化对于无监督算法也是同样重要的。\n\
  \n### 8.11.2 某些监督 ML/DL 算法缺乏互操作性\n\n\n\n\n\n一些无监督算法（如 `deep NNs`）以黑盒方式运行，这使得很难解释和理解此类模型的工作原理。这导致此类技术不适用于对可解释性要求很高的场景。`ML/DL`\
  \ 所做决策的语义可理解性，对于 `ML/DL` 在大规模运营网络中的运行成功以及被运营人员、网络管理器和用户的接受程度尤为重要。但预测准确性与简单性之间往往是冲突的。例如，`NNs`\
  \ 较高的准确性源于其复杂性，在这种复杂性中，输入变量以非线性方式组合以构建复杂且难以解释的模型；对于 `NNs`，也可能无法获得可解释性，因为它们在实现高准确性与牺牲可解释性之间进行权衡。目前有许多研究正致力于降低\
  \ `NNs` 等技术的透明度。除了关注 `NNs` 之外，人们对提高 `AI` 和 `ML/DL` 的可解释性和可理解性也具有广泛兴趣——例如，美国国防部高级研究计划局（`DARPA`）的可解释\
  \ AI 项目 #2 旨在开发可解释的 AI 模型（利用跨越性能与可解释性权衡空间的各种设计方案），这些模型可以解释其决策的原理，从而使用户能够恰当地信任这些模型，特别是在由算法自主做出优化决策的新型控制应用中。\n\
  \n### 8.11.3 ML/DL 网络化在运营层面的缺乏成功\n\n在文献中，研究人员指出，尽管有大量的学术研究以及无监督学习在其他领域的实际应用，但我们看到，`ML/DL`\
  \ 解决方案在运营网络中的实际应用仍然匮乏——特别是对于网络入侵检测等应用。由于以下原因，这些都是具有挑战性的问题，包括但不限于：\n\n* 错误成本极高\n\
  * 缺乏训练数据\n* 结果与运营解释之间的语义鸿沟\n* 输入数据具有巨大的变异性\n* 在进行可靠的性能评估方面存在根本性困难\n\n即使对于其他应用，`ML/DL`\
  \ 的成功及其在实际系统中大规模采用，也落后于其在许多其他领域 `ML/DL` 解决方案的成功。\n\n### 8.11.4 忽略基于非 ML/DL 类的工具\n\
  \n人们还应该记住一个学术研究人员可能会陷入的常见陷阱，即没有意识到网络运营者可能拥有更简单的基于机器学习的解决方案，这些解决方案在实际设置中的效果可能与朴素的基于\
  \ `ML/DL` 的解决方案一样好。不检查运营网络的实际情况将损害 `ML/DL` 解决方案的有效性。我们应该期望 `ML/DL` 解决方案是增强和补充而非替代其他非机器学习的解决方案——至少在可预见的未来是这样。\n\
  \n### 8.11.5 过拟合\n\n无监督模型的存在另一个潜在问题是过拟合；它对应于模型代表噪声或随机误差，而不是学习数据中的实际模式。虽然过拟合通常与监督\
  \ `ML/DL` 相关联，但过拟合问题每当我们从数据中学习时就会潜伏，因此也适用于无监督 `ML/DL`。理想情况下，我们期望 `ML/DL` 算法随着数据的增加提供改进的性能，但随着模型复杂性的增加，性能在某一点之后开始恶化——尽管在处理未优化的开箱用\
  \ `ML/DL` 算法时，随着数据的增加，经验结果可能会变得更差。根据奥卡姆剃刀（`Occam Razor`）原则，模型复杂度应与可用数据量相适应，而过于复杂的模型会导致预测和泛化能力下降。导致过拟合的两个主要原因可能是学习模型尺寸过大以及用于训练的样本数据过少。通常，数据被分为两个部分（实际数据和随机噪声）。由于缺乏标签或相关信息，无监督学习模型可能会过拟合数据，从而在测试和部署阶段引发问题。强烈建议在设计或微调无监督学习算法时使用交叉（`Cross-validation`）、正则化（`regularization`）和卡方检验（`Chi-squared\
  \ testing`），以避免过拟合。\n\n### 8.11.6 数据质量问题\n\n需要注意的是，所有的 `ML/DL` 都依赖数据，其性能很大程度上取决于数据的性质、数量、质量和表示。在无监督\
  \ `ML/DL` 数据的情况下，必须仔细考虑质量问题，因为数据质量的任何问题都会严重损害 `ML/DL` 算法的性能。一个潜在问题是，如果某类别的样本量远小于或大于其他类，则数据集可能是不平衡的。在这种不平衡的数据集中，算法必须小心，不要通过假设稀有类为噪声而忽略它。虽然不平衡数据集对监督学习技术来说更多是困扰，但它们也可能为无监督和半监督学习技术带来问题。\n\
  \n### 8.11.7 不准确的模型构建\n\n构建准确且通用的模型非常困难，因为每个模型都是针对特定类型的应用优化的。在应用无监督 `ML/DL` 模型之前，应该仔细研究应用场景以及算法在这些设置中的适用性。例如，我们强调了与无监督聚类任务相关的某些问题：\n\
  \n* 不建议在 `K-means` 中进行随机初始化。\n* 在聚类操作之前，聚类的数量未知，因为我们没有标签。\n* 在层次聚类的情况下，我们不知道何时停止，这会增加该过程的时间复杂度。\n\
  * 评估聚类结果非常棘手，因为地面真值（ground truth）大多是未知的。\n\n### 8.11.8 对抗环境中的机器学习\n\n许多网络问题（如 `anomaly\
  \ detection`）都是对抗性问题，其中恶意入侵者不断试图败网络管理员（以及网络管理员使用的工具）。在这样的设置中，从历史数据中学习的机器学习可能表现不佳，因为存在专门为了绕过基于以往数据的方案而精心设计的攻击。由于这些挑战、陷阱和缺陷，在使用无监督和半监督\
  \ `ML/DL` 时必须格外小心。这些陷阱可以在部分通过使用各种最佳实践避免，例如端到端学习流水线测试、学习算法的可视化、正则化（`regularization`）、适当的特征工程、Dropout（`dropout`）以及通过人工检查进行完整性——具体取决于问题的背景。\n\
  \n## 8.12 总结\n\n我们对机器学习任务、最新的无监督学习技术和趋势进行了全面的综述，并详细讨论了这些技术在网络相关任务中的应用。尽管无监督学习近期取得了成功，但针对计算机网络应用的无监督学习文献仍然匮乏，这正是本综述旨在解决的。由于计算机网络的功能性和不断演变的特性，涵盖所有应用是不可能的。但我们已尝试涵盖无监督学习的所有主要网络应用及相关技术。我们还简述了网络领域与无监督学习相关的未来工作和开放研究领域，并对在网络中使用无监督机器学习的重大陷阱和挑战进行了简要讨论。\n\
  \n\n\n\n\n*   [1] Usama, M. 等. “用于网络的无监督机器学习：技术、应用与研究挑战，” IEEE Access, 2019 年 6\
  \ 月. 数字对象标识，[`doi.org/10.1109/ACCESS.2019.2916648`](https://doi.org/10.1109/ACCESS.2019.2916648)。\n\
  \n# 9 监督学习\n\nDOI: [10.1201/9781003499466-9](https://doi.org/10.1201/9781003499466-9)\n\
  \n监督学习使用标记数据集来训练算法，并根据训练过程中学到的学习标准来准确地分类数据或结果。特征是从示例到值的函数。让我们考虑为每个示例给定一组输入特征 `{x}`1\
  \ 和一组目标特征 `{y}`1。测试示例集仅给定输入特征的值。监督学习算法可以被视为映射学习样本 `(X, Y)` 数据集 `D` 的函数。模型中学习样本 `(x,\
  \ y)` ∼ `(X, Y)` 的数据集 `D` 具有独立同分布 (i.i.d.) 随机变量。公式化如下：[1]\n\n$$\\begin{matrix} \\\
  left. \\text{Function-~}f:X\\rightarrow Y \\right. \\\\ {\\text{Input-~}x \\in X}\
  \ \\\\ {\\text{Output-~}y \\in Y} \\\\ \\end{matrix}$$  \n\n`x` 和 `y` 取决于应用并提供：\n\
  \n`y` = `f(x)`\n\n监督学习算法可以被视为映射学习样本 `(x, y)` ∼ `(X, Y)` 数据集 `D` 的函数。输入函数通过 `f(x\
  \ | D)`——一个随机变量相关。因此其在输入空间上的平均误差为。误差的期望值给出：\n\n$$e\\lbrack f\\rbrack = \\underset{X}{\\\
  text{E}}\\underset{D}{E}\\underset{Y|X}{\\text{E}}L(Y,f(X \\mid D))$$  \n\n其中 `L(.,.)`\
  \ 是损失函数。\n\n如果\n\n`L(y, ŷ)` = `(y − ŷ)²`\n\n误差自然地分解为偏差项和方差项之和。这种偏差-方差分解是有用的，因为它它凸显了由于模型选择/学习算法中的错误假设导致的误差（偏差）与由于仅有有限数据集可学习该模型而导致的误差（参数方差）之间的权衡。注意，参数方差也被称为过拟合误差。在不知道联合概率分布的情况下，计算\
  \ `e[f]` 是不可能的。相反，我们可以在数据样本上计算经验误差。给定 `n` 个数据点 `(x[i], y[i])`，经验误差为：\n\n$$e_{S}\\\
  lbrack f\\rbrack = \\frac{1}{n}{\\sum\\limits\\_{i = 1}^{n}L}\\left( {y_{i},f\\\
  left( y_{i} \\right)} \\right)$$  \n\n泛化误差是样本集（用于训练）上的误差与底层联合概率分布上的误差之间的差。它的定义为：\n\
  \n`G` = `e[f]` − `e[S][f]`\n\n偏差-方差分解给出：\n\n$$\\underset{D}{E}\\underset{Y \\mid\
  \ X}{E}{(Y - f(X \\mid D))}^{2} = \\sigma^{2}(x) + {bias}^{2}(x)$$  \n\n其中\n\n$$\\\
  begin{matrix} {{bias}^{2}(x) \\triangleq \\left( {\\\\underset{Y \\mid x}{\\text{E}}(Y)\
  \ - \\underset{D_{LS}}{E}f(x \\mid D)} \\right)^{2}} \\\\ {\\sigma^{2}(x) \\triangleq\
  \ \\underset{Y \\mid x}{\\text{E}}{(Y - \\underset{Y \\mid x}{\\text{E}}(Y))}^{2}\
  \ + \\underset{D_{LS}}{E}\\left( {f(x \\mid D)_{D_{LS}}^{E}f(x \\mid D)} \\right)^{2}}\
  \ \\\\ {\\\\\\underset{Y \\mid x}{\\text{E}}{(Y - \\underset{Y \\mid x}{\\text{E}}(Y))}^{2}\
  \ = \\text{~Internal~Variance~}} \\\\ {\\\\\\underset{D}{E}{(f(x \\mid D) - \\underset{D}{E}f(x\
  \ \\mid D))}^{2} = \\text{~Parametric~Variance~}} \\\\ \\end{matrix}$$  \n\n对于任何给定的模型，通过考虑强收敛律，参数方差随任意大数据集趋于零。有许多监督学习算法，每种都有其优势。\n\
  \n## 9.1 线性回归与分类\n\n回归提供连续值，而分类提供类别值。偏差-方差分解是有用的，因为它凸显了由于模型选择/学习算法中的错误假设导致的误差（偏差）与由于仅有有限数据集可学习该模型而导致的误差（参数方差）之间的权衡。注意，参数方差也被称为过拟合误差。在不知道联合概率分布的情况下，计算\
  \ `e[f]` 是不可能的。相反，我们可以在数据样本上计算经验误差。给定 `n` 个数据点 `(x[i], y[i])`，经验误差为：\n\n泛化误差是样本集（用于训练）上的误差与底层联合概率分布上的误差之间的差。它的定义为：\n\
  \n`G` = `e[f]` − `e[S][f]`\n\n梯度下降是一种常用于训练机器学习模型和神经网络的优化算法。训练数据帮助这些模型随时间学习，而代价函数专门充当气计，在每次迭代中衡量其准确性。\n\
  \n## 9.2 逻辑回归\n\n逻辑回归是一种统计模型（也称为 logit 模型），通常用于分类和预测分析。逻辑回归根据给定的独立变量数据集估计事件发生的概率，例如投票或未投票。\n\
  \n\n\n\n\n设独立输入特征为：`[2]`\n\n$$X \\equiv \\begin{bmatrix} x_{11} & \\ldots & x_{1m}\
  \ \\\\ \\ldots & \\ldots & \\ldots \\\\ x_{n1} & \\ldots & x_{nm} \\\\ \\end{bmatrix}$$\n\
  \n因变量 `Y` 仅有二分类值，即 0 或 1。\n\n$$Y = \\begin{cases} 0 & {\\\\ if\\ Class\\ 1} \\\\\
  \ 1 & {\\\\ if\\ Class\\ 2} \\\\ \\end{cases}$$\n\n然后对输入变量 `X` 应用多线性函数。\n\n$$z =\
  \ \\left( {{\\sum\\limits\\_{i = 1}^{n}w_{i}}x_{i}} \\right) + b$$\n\n在这里，`x[i]`\
  \ 是 `X` 的第 `ith` 次观测值，`w[i] = [w[1], w[2], \\dots, w[m]]` 是权重或系数，而 `b` 是偏置，也称为截距。这可以简单地表示为权重与偏置的点积：\n\
  \n$z = w \\cdot X + b$\n\n我们之前讨论的所有内容都是线性回归。\n\n现在我们考虑 sigmoid 函数，其输入为 `z`，我们找到由\
  \ `y` 预测的在 0 到 1 之间的概率（见图 9.1）。\n\n$$\\sigma(z) = \\frac{1}{1 - e^{- z}}$$\n\nsigmoid\
  \ 函数将连续变量数据转换为概率，即 0 到 1 之间的值。\n\n$$\\begin{matrix} \\left. \\sigma(z)\\rightarrow\
  \ 1\\text{~as~}z\\rightarrow\\infty \\right. \\\\ \\left. \\sigma(z)\\rightarrow\
  \ 0\\text{~as~}z\\rightarrow - \\infty \\right. \\\\ \\end{matrix}$$\n\n因此 sigmoid\
  \ 函数始终限制在 0 和 1 之间，其中属于某一类的概率可以测量为：\n\n$$\\begin{matrix} {P(y = 1) = \\sigma(z)}\
  \ \\\\ {P(y = 0) = 1 - \\sigma(z)} \\\\ \\end{matrix}$$\n\n![图 9.1 Sigmoid 函数。](img/fig9_1.jpg)\n\
  \n图 9.1 Sigmoid 函数。\n\n### 逻辑回归方程\n\n几率（odd）是某事发生与某事未发生概率之比。它与概率不同，因为概率是某事发生与所有可能发生情况之比。因此，几率将为：\n\
  \n$$\\frac{p(x)}{1 - p(x)} = e^{z}$$\n\n对几率取自然对数，我们得到：\n\n$$\\begin{matrix} {\\\
  log\\left\\lbrack \\frac{p(x)}{1 - p(x)} \\right\\rbrack = z} \\\\ {\\log\\left\\\
  lbrack \\frac{p(x)}{1 - p(x)} \\right\\rbrack = w.X + b} \\\\ \\end{matrix}}$$\n\
  \n那么最终的逻辑回归方程为：\n\n$$p(X;b,w) = \\frac{e^{w.X + b}}{1 + e^{w.X + b}} = \\frac{1}{1\
  \ + e^{- w.X + b}}$$\n\n### 逻辑回归的似然函数\n\n对于 `y = 1`，预测概率为 `p(X; b, w) = p(x)`；对于\
  \ `y = 0`，预测概率为 `1–p(X;b, w) = 1–p(x)`：\n\n$$L(b,w) = {\\prod\\limits\\_{i = 1}n}p\\\
  left( x_{i} \\right)^{y_{i}}\\left( {1 - p\\left( x_{i} \\right)} \\right)$$\n\n\
  对两边取自然对数：\n\n$$\\begin{array}{ll} {l(b,w) = \\log(L(b,w))} & {{\\sum\\limits\\_{i\
  \ = 1}^{n}y_{i}}\\log p\\left( x_{i} \\right) + \\left( {1 - y_{i}} \\right)\\log\\\
  left( {1 - p\\left( x_{i} \\right)} \\right)} \\\\ \\\\, & {{\\sum\\limits\\_{i\
  \ = 1}^{n}y_{i}}\\log p\\left( x_{i} \\right) + \\log\\left( {1 - p\\left( x_{i}\
  \ \\right)} \\right) - y_{i}\\log\\left( {1 - p\\left( x_{i} \\right)} \\right)}\
  \ \\\\ \\\\, & {{\\sum\\limits\\_{i = 1}^{n}y_{i}}\\log\\left( {1 - p\\left( x_{i}\
  \ \\right)} \\right) + {\\sum\\limits\\_{i = 1}^{n}y_{i}}\\log\\frac{p\\left( x_{i}\
  \ \\right)}{1 - p\\left( x_{i} \\right)}} \\\\ \\\\, & {{\\sum\\limits\\_{i = 1}^{n}\
  \ -\\log 1 - e^{-({w.x_{i} + b})}} + {\\sum\\limits\\_{i = 1}^{n}y_{i}}\\left( {w.x_{i}\
  \ + b} \\right)} \\\\ \\\\, & {{\\sum\\limits\\_{i = 1}^{n} -\\log 1 + e^{({w.x_{i}\
  \ + b})} + {\\sum\\limits\\_{i = 1}^{n}y_{i}}\\left( {w.x_{i} + b} \\right)}}}}\
  \ \\\\ \\end{array}$$\n\n### 对数似然函数的梯度\n\n为了找到极大似然估计，我们对 `w` 求导：\n\n$$\\frac{\\\
  partial J(l(b,w))}{\\partial w_{j}} = - {\\sum\\limits\\_{i = n}^{n}\\frac{1}{1\
  \ + e^{({wx_{i} + b})}}}e^{({wx_{i} + b})}}$$\n\n\n\n\n\n*   所需的数据准备很少。其他技术通常需要数据归一化、需要创建虚拟变量并删除空值。某些树和算法组合支持缺失值。\n\
  \n*   使用树（即预测数据）的成本与训练树使用的数据点数量呈对数关系。\n\n*   能够同时处理数值型和分类数据。然而，`scikit-learn` 的实现不支持分类变量。其他技术通常专门用于分析仅包含一种类型变量的数据集。\n\
  \n*   能够处理多输出问题。\n\n如果给定情况在模型中是可观测的，那么该条件可以通过布尔逻辑轻松解释。相比之下，在黑箱模型（例如人工神经网络）中，结果可能更难以解释。可能可以使用统计检验来验证模型。这使得考虑模型的可靠性成为可能。即使生成数据的真实模型在某种程度上违反了模型的假设，该模型仍然表现良好。\n\
  \n决策树的缺点包括：\n\n*   决策树学习器可能会创建过复杂的树，导致对数据的泛化能力较差。这被称为过拟合。为了避免这个问题，必须采用剪枝、设置叶子节点所需的最小样本数或设置树的最大深度等机制。\n\
  \n*   决策树可能是不稳定的，因为数据的微小变化可能会导致生成完全不同的树。这个问题通过在集成学习中使用决策树来缓解。\n\n*   决策树的预测既不是平滑的连续的，而是如图\
  \ 9.2 所示的分段常数近似。因此，它们不擅长外推。\n\n*   在最优性的若干几个方面，即使对于简单的概念，学习最优决策树的问题已知是 NP 完全完全的。因此，实际的决策树学习算法基于启发式算法，例如在每个节点处局部最优决策的贪心算法。此类算法无法保证返回全局最优决策树。这可以通过在集成学习器中训练多棵树来缓解，其中特征和样本是有放回的随机采样。\n\
  \n*   某些概念很难学习，因为决策树无法轻松表达它们，例如 `XOR`、奇偶性或多路复用问题。\n\n*   如果某些类别占据主导地位，决策树学习器会创建有偏的树。因此，建议在与决策树拟合之前平衡数据集。\n\
  \n### 9.5.2 随机森林\n\n随机森林回归是一种监督学习算法和 bagging 技术，它在机器学习中使用一种集成学习方法进行回归。随机森林中的树是并行运行的，这意味着构建树的过程中，这些树之间没有交互。随机森林是一种常用的机器学习算法，它通过结合多棵决策树的输出来获得单一结果。它的易用性和灵活性促进了它的采用，因为它能同时处理分类和回归问题。然而，尽管有这些优势，随机森林算法也有一些缺点。\n\
  \n*   它需要大量的计算能力和资源，因为它构建了许多树来结合它们的输出。\n\n*   同样，它需要大量的训练时间因为它因为它了大量的决策树来确定类别。\n\
  \n### 9.5.3 梯度提升回归\n\n梯度提升回归树基于源自决策树的集成方法思想。决策树使用树结构。从树根开始，根据条件分支并向叶子节点移动，目标叶节点就是预测结果。梯度提升是一种用于回归和分类任务等的机器学习技术。它以弱预测模型集成的形式提供预测模型，即对数据做出极少假设的模型，这些模型通常是简单的决策树。当决策树作为弱学习器时，生成的算法被称为梯度提升树。它的性能通常优于随机森林。梯度提升树模型与其他提升方法一样，以阶段性的方式构建，但它通过允许优化任意可微的损失函数泛化了其他方法。该算法存在若干缺点：\n\
  \n*   与较简单的算法相比，训练模型可能需要更多的时间和资源。\n\n*   在复杂模型或高学习率的情况下，梯度下降容易出现过拟合问题。\n\n### 9.5.4\
  \ XGBoost\n\nXGBoost (Extreme Gradient Boosting) 最小化一个正则化的（L1 和 L2）目标函数，该函数结合了凸损失函数（基于预测输出与目标输出之间的差异）和模型复杂度惩罚项（换言之回归树函数）。XGBoost\
  \ 为高效可扩展的机器学习模型训练设计，适用于大型数据集。XGBoost 具有大量可以调整以优化性能的超参数，使其高度可定制。XGBoost 和随机森林等树算法不需要归一化的特征，如果数据是非线性、非单调或具有分离簇，它们运行良好。然而，XGBoost\
  \ 和随机森林等树算法可能会过拟合数据，特别是当树太深且带有噪声数据时。\n\n### 9.5.5 轻量梯度提升机回归器\n\n轻量梯度提升机 (LightGBM)\
  \ 是一种梯度提升集成方法，是一个开源库，提供了梯度提升算法的高效且有效的实现。它基于决策树。与其他基于决策树的方法一样，LightGBM 可用于分类和回归。LightGBM\
  \ 针对分布式系统的高性能进行了优化。LightGBM 通过添加一种自动特征选择类型以及关注具有较大梯度的示例来扩展梯度提升算法。这可以显著加快训练速度并提高预测性能。因此，在处理回归和分类任务的表格数据时，LightGBM\
  \ 已成为机器学习竞赛中的事实标准算法。因此，它与极端梯度提升 (XGBoost) 一起，对梯度提升方法的普及和更广泛的应用负有部分责任。\n\n\n\n\n\n\
  [content]\n深度学习利用人工神经网络来模拟人类大脑的学习过程。神经网络也被称为人工神经网络（ANN）。深度神经网络的特征是具有一系列多个处理层。每一层都包含一个带有激活函数（例如\
  \ sigmoid 和整流线性单元——ReLU）的非线性变换，而这些变换的序列导致了对不同层级抽象特征的学习。总的来说，深度学习（DL）依赖于一个函数 `f`：`X`→`Y`，其参数化表示为：\n\
  \n`θ` ∈ `R`^(`n`[`θ`]) 和 `n`[`g`]` ∈ `N`: `y` = `f(x; θ)`\n\n我们正在描述的是一个具有一个全连接隐藏层的简单神经网络（请参阅图\
  \ 10.1）。第一层接收输入值（即输入特征）`x`，其形式为大小为 `n`[`x]` 的列向量，且 `n`[`x]` ϵ `N`。下一个隐藏层的值是这些值通过一个非线性参数函数变换得到的，该变换是大小为\
  \ `n`[`h]`×`n`[`x]` 且 `n`[`x]` ϵ `N` 的矩阵 `W[1]` 乘法，加上大小为 `n`[`h]` 的偏置项 `b[2]`，然后进行非线性变换：[1]\n\
  \n`h` = `A(W[1].x+b[1])`\n\n其中 `A` 是激活函数，我们使用的是 sigmoid 激活函数：\n\n`f(x)` = (1+e^(−x))^(−1)\n\
  \n这种非线性激活函数使得每一层的变换都变为非线性的，这最终提供了神经网络的表达能力。大小为 `n`[`h]` 的隐藏层 `h` 而可以转换为其他值集合，直到最后一次提供输出值\
  \ `y` 的变换（如图 10.1 所示）。在这种情况下：\n\n`y` = `A(W[2].h+b[2])`\n\n其中 `W[2]` 的大小为 `n`[`y]`×`n`[`h]`\
  \ 且 `n`[`y]` ϵ `N`，加上大小为 `n`[`y]` ϵ `N` 的偏置项 `b[2]`。所有这些层都经过训练以最小化经验误差 `e[S]` `[f]`。优化神经网络参数的最常用方法是基于反向传播算法的梯度下降。在最简单的情况下，每次迭代中，算法都会改变其内部参数\
  \ `θ` 以拟合所需的函数：\n\n`θ`←(`θ−α∇[θ]e[S][f]`)\n\n其中 `α` 是学习率。在目前的应用中，除了刚刚介绍的简单前馈网络外，已经出现了许多不同类型的神经网络层。每种变体都根据应用提供了特定的优势（例如，在监督学习设置中在偏置和过拟合之间取得了良好的权衡）。此外，在一个给定的神经网络中，可以拥有任意数量的层，过去几年的趋势是层数不断增加，在某些监督学习任务中层数超过了\
  \ 100 层。\n\n![FIGURE 10.1 具有一个隐藏层的全连接神经网络前馈网络示例。](img/fig10_1.jpg)\n\nFIGURE 10.1\
  \ 具有一个隐藏层的全连接神经网络前馈网络示例。\n\n## 10.1 神经网络中的代价与误差函数、梯度下降和反向传播\n\n之前，我们讨论了通过梯度下降改变权重来迭代最小化神经网络输出的误差。然而，事实有一种数学上更通用的方法可以在减少误差的同时防止诸如过拟合的问题。这种通用的公式围绕着被称为代价函数的最小化展开。单个训练样本\
  \ `(x, y)` 神经网络的等效代价函数（称为均方误差，MSE）为：\n\n$$J(x, y) = \\frac{1}{2}\\left\\| y - h(x)\
  \ \\right\\|²$$\n\n这显示了输出大小为 `n`[`h]` 的隐藏层 `h` 而可以转换为其他值集合，直到最后提供输出值 `y` 的变换（如图\
  \ 10.1 所示）。在这种情况下：\n\n`y` = `A(W[2].h+b[2])`\n\n其中 `W[2]` 的大小为 `n`[`y]`×`n`[`h]`\
  \ 且 `n`[`y]` ϵ `N`，加上大小为 `n`[`y]` ϵ `N` 的偏置项 `b[2]`。所有这些层都经过训练以最小化经验误差 `e[S]` `[f]`。优化神经网络参数的最常用方法是基于反向传播算法的梯度下降。在最简单的情况下，每次迭代中，算法都会改变其内部参数\
  \ `θ` 以拟合所需的函数：\n\n`θ`←(`θ−α∇[θ]e[S][f]`)\n\n其中 `α` 是学习率。在目前的应用中，除了刚刚介绍的简单前馈网络，已经出现了许多不同类型的神经网络层。每种变体都根据应用提供了特定的优势（例如，在监督学习设置中在偏置和过拟合之间取得了良好的权衡）。此外，在一个给定的神经网络中，可以拥有任意数量的层，过去几年的趋势是层数不断增加，在某些监督学习任务中层数超过了\
  \ 100 层。\n\n\n\n\n$$\\begin{matrix} {z^{(2)} = W^{(1)}x + b^{(1)}} \\\\\\\\ {h^{(2)}\
  \ = f\\left( z^{(2)} \\right)} \\\\\\\\ {z^{(3)} = W^{(2)}h^{(2)} + b^{(2)}} \\\\\
  \\\\ {h_{W,b}(x) = h^{(3)} = f\\left( z^{(3)} \\right)} \\\\\\\\ \\end{matrix}$$\n\
  \n注意这里使用大字母 `W` 来表示权重的矩阵形式。需要注意的是，上一个方程中的所有元素现在都是矩阵/向量。如果你不熟悉这些概念，将在下一节中进行更详细的解释。上面的方程可以进一步简化吗？是的，这是可能的。我们可以通过泛化（输入层：`h`((l))\
  \ = `x`），在神经网络的任意数量层中进行前向传播计算：\n\n$$\\begin{matrix} {z^{(l + 1)} = W^{(l)}h^{(l)}\
  \ + b^{(l)} \\\\\\\\ {h^{(l + 1)} = f\\left( z^{(l + 1)} \\right)} \\\\\\\\ \\end{matrix}$$\n\
  \n在这里我们可以看到通用的前馈过程，其中层 `l` 的输出变成层 `l` + 1 的输入。我们知道 `h`^((1)) 仅仅是输入层 `x`，而 `h`^((n[l]))（其中\
  \ `n[1]` 是网络中的层数）是输出层的输出。注意在之前的方程中，我们省略了对节点编号 `i` 和 `j` 的引用——我们是如何做到的呢？我们难道不需要循环并计算所有的各种节点输入和输出吗？\n\
  \n答案是我们可以使用矩阵乘法来更简单地完成。这个过程被称为“向量化”，它有两个好处——首先，它让代码变得不那么复杂，你很快就会看到。其次，我们可以使用 `Python`（以及其他语言）中的快速线性代数例程，而不是使用循环，这将加快程序的运行。`numpy`\
  \ 可以轻松地处理这些计算。首先，对于那些不熟悉矩阵操作的人，下一节是一个简短的回顾。\n\n### 10.1.4 矩阵乘法\n\n`z`^((l + 1))\
  \ = `W`^((l))*x` + `b`^((l))\n\n然而，`l` = 1，即输入层 `h`^((l)) = `h`^((l)) ≜ `x`\n\n\
  $$\\begin{matrix} {z^{(2)} = \\left\\lbrack \\begin{array}{lll} w_{11}^{(1)} & w_{12}^{(1)}\
  \ & w_{13}^{(1)} \\\\\\\\ w_{21}^{(1)} & w_{22}^{(1)} & w_{23}^{(1)} \\\\\\\\ w_{31}^{(1)}\
  \ & w_{32}^{(1)} & w_{33}^{(1)} \\\\\\\\ \\end{array} \\right\\rbrack\\leftleftlbrack\
  \ \\begin{array}{l} x_{1} \\\\ x_{2} \\\\ x_{3} \\\\\\\\ \\end{array} \\right\\\
  rbrack + \\begin{bmatrix} b_{1}^{(1)} \\\\ b_{2}^{(1)} \\\\ b_{3}^{(1)} \\\\\\\\\
  \ \\end{bmatrix}} \\\\\\\\ {W^{(1)} = \\begin{bmatrix} w_{11}^{(1)} & w_{12}^{(1)}\
  \ & w_{13}^{(1)} \\\\\\\\ w_{21}^{(1)} & w_{22}^{(1)} & w_{23}^{(1)} \\\\\\\\ w_{31}^{(1)}\
  \ & w_{32}^{(1)} & w_{33}^{(1)} \\\\\\\\ \\end{bmatrix}} \\\\\\\\ {b^{(1)} = \\\
  begin{bmatrix} b_{1}^{(1)} \\\\ b_{2}^{(1)} \\\\ b_{3}^{(1)} \\\\\\\\ \\end{bmatrix},\\\
  quad x = \\begin{bmatrix} x_{1} \\\\ x_{2} \\\\ x_{3} \\\\\\\\ \\end{bmatrix}} \\\
  \\\\\\ \\end{matrix}$$\n\n仅针对输入层：\n\n`h`^((2)) = `W`^((1))*x + `b`^((1))\n\n如果我们以此类的方式写第\
  \ 2 层的权重：\n\n$$W^{(2)} = \\left\\lbrack \\begin{array}{lll} w_{11}^{(2)} & w_{12}^{(2)}\
  \ & w_{13}^{(2)} \\\\\\\\ \\end{array} \\right\\rbrack$$\n\n使用这种符号，之前冗长的一组方程（例如一个三层网络）可以简化为：\n\
  \n$$\\begin{matrix} {z^{(2)} = W^{(1)}x + b^{(1)}} \\\\\\\\ {h^{(3)} = f\\left(\
  \ z^{(2)} \\right)} \\\\\\\\ {z^{(3)} = W^{(2)}h^{(2)} + b^{(2)}} \\\\\\\\ {h_{W,b}(x)\
  \ = h^{(3)} = f\\left( z^{(3)} \\right)} \\\\\\\\ {l = 1\\rightarrow\\frac{\\partial}{\\\
  partial w_{ij}^{(1)}}J(w,b,x) = \\delta_{i}^{(2)}\\left( h^{(1)} \\right)^{T} \\\
  \\\\\\ {l = 2\\rightarrow\\frac{\\partial}{\\partial w_{ij}^{(2)}}J(w,b,x) = \\\
  delta_{i}^{(3)}\\left( h^{(2)} \\right)^{T} \\\\\\\\ {l = 3\\rightarrow\\frac{\\\
  partial}{\\partial w_{ij}^{(3)}}J(w,b,x) = \\delta_{i}^{(4)}\\left( h^{(3)} \\right)^{T}\
  \ \\\\\\\\ \\end{matrix}$$ \n（注：原文公式中似乎存在下标逻辑错误，翻译处保持原文格式）\n\n我们已经找到了项：`h`((3))\
  \ = `f`(`z`))\n\n对于输入层：\n\n`z`^((l + 1)) = `W`^((l))*x + `b`^((l))\n\n对于除输入层外的层：\n\
  \n`h`^((l + 1)) = f(...)\n\n### 10.1.5 代价/损失函数的导数用于梯度下降\n\n让我们评估这个特定的例子：$\\frac{\\\
  partial}{\\partial w_{12}^{(2)}}J(b)$。为了这一点，我们必须开发一个链式：\n\n$$\\frac{\\partial J}{\\\
  partial w_{12}^{(2)}} = \\frac{\\partial J}{\\partial h^{(3)}}\\frac{\\partial h^{(3)}}{\\\
  partial z^{(3)}}\\frac{\\partial z^{(3)}}{\\partial w_{12}^{(2)}}$$\n\n$$\\frac{\\\
  partial z^{(3)}}{\\partial w_{12}^{(2)}} = \\frac{\\partial}{\\partial w_{12}^{(2)}}\\\
  left( w_{11}^{(2)}h^{(2)} + w_{12}^{(2)}h^{(2)} + w_{13}^{(2)}h^{(2)} + b_{1}^{(2)}\
  \ \\right) = h^{(2)}$$\n\n`h`^((2)) 仅仅是第 2 层的输出。下一项是：$\\frac{\\partial h^{(3)}}{\\\
  partial z^{(3)}}$，其中 `h`(3) 是 sigmoid 激活函数，该激活函数的求导如下（见前面的推导）：\n\n$$\\begin{matrix}\
  \ {\\frac{\\partial h(z)}{\\partial z} = f^{\\prime}(z) = f(z)(1 - f(z))} \\\\\\\
  \\ {\\frac{\\partial h^{(3)}}{\\partial z^{(3)}} = \\frac{\\partial}{\\partial z^{(3)}}\\\
  left\\lbrack f\\left\\lbrack w_{11}^{(2)}h^{(2)} + w_{12}^{(2)}h^{(2)} + w_{13}^{(2)}h^{(2)}\
  \ + b_{1}^{(2)} \\right\\rbrack \\right\\rbrack = \\frac{\\partial}{\\partial z^{(3)}}\\\
  left\\lbrack f\\left\\lbrack z^{(3)} \\right\\rbrack \\right\\rbrack = f^{\\prime}\\\
  left( z^{(3)} \\right) = f\\left( z^{(3)} \\right)\\left( 1 - f\\left( z^{(3)} \\\
  right)\\right)} \\\\\\\\ \\end{matrix}$$\n\n最后的项是 $\\frac{\\partial}{\\partial w_{ij}^{(l)}}J(w,b)$，它是均误差函数：\n\
  \n$$\\begin{matrix} {J(w,b,x) = \\frac{1}{m}\\sum_{i=1}^{m} (y_i - \\hat{y}_i)²}\
  \ \\\\\\\\ {\\frac{\\partial J}{\\partial w_{ij}^{(l)}} = \\frac{2}{m}(y_i - \\\
  hat{y}_i)\\frac{\\partial \\hat{y}_i}{\\partial w_{ij}^{(l)}}} \\\\\\\\ \\end{matrix}$$\n\
  \n其中我们定义 $\\delta_i^{(l+1)} = \\frac{2}{m}(y_i - \\hat{y}_i)\\frac{\\partial \\\
  hat{y}_i}{\\partial z_i^{(l+1)}}$。\n\n\n\n\n$$\\frac{\\partial J}{\\partial h_{1}^{(3)}}\
  \ = - \\left\\| {y_{1} - h_{1}^{(3)}} \\right\\|$$  \n\n我们可以对该方程推广：\n\n$$\\begin{array}{l}\
  \ {\\frac{\\partial J}{\\partial h_{i}^{(n_{l})}} = - \\left( {y_{i} - h_{i}^{(n_{l})}}\
  \ \\right)} \\\\\\\\ {\\frac{\\partial}{\\partial w_{12}^{(2)}}J(w,b,x,y) = \\left\\\
  lbrack \\frac{\\partial J}{\\partial h_{1}^{(3)}} \\right\\rbrack\\left\\lbrack\
  \ \\frac{\\partial h_{1}^{(3)}}{\\partial z_{1}^{(3)}} \\right\\rbrack\\left\\lbrack\
  \ \\frac{\\partial z_{1}^{(3)}}{\\partial w_{12}^{(2)}} \\right\\rbrack = - \\left\\\
  lbrack {y_{1} - h_{1}^{(3)}} \\right\\rbrack\\left\\lbrack {f^{\\prime}\\left\\\
  lbrack z_{1}^{(3)} \\right\\rbrack} \\right\\rbrack\\left\\lbrack \\frac{\\partial\
  \ z_{1}^{(3)}}{\\partial w_{12}^{(2)}} \\right\\rbrack = \\delta_{1}^{(3)}\\left\\\
  lbrack \\frac{\\partial z_{1}^{(3)}}{\\partial w_{12}^{(2)}} \\right\\rbrack = \\\
  delta_{1}^{(3)}h_{2}^{(2)}} \\\\\\\\ \\end{array}$$  \n\n其中 $\\delta_{1}^{(3)} \\\
  triangleq -(y[1]-h[1]^{(3)}))f^{\\prime}(z[1]^{(3)})$\n\n$$\\text{~注意：}\\frac{\\\
  partial h_{1}^{(3)}}{\\partial z_{1}^{(3)}} = \\frac{\\partial f\\left( z_{1}^{(3)}\
  \ \\right)}{\\partial z_{1}^{(3)}} = f^{\\prime}\\left( z_{1}^{(3)} \\right)$$ \
  \ \n\n将该方程推广，我们可以写成：\n\n$\\deltai)} \\triangleq -(y[i]-hi)))f^{\\prime}(zi)} = -(y[i]-f(zi)))f^{\\\
  prime}(zi))$  \n\n其中 $i$ 是输出层中的第 $ith$ 个节点。例如，在我们在这里展示的配置中，它始终是 $i = 1$。\n\n$$\\\
  frac{\\partial}{\\partial w_{12}^{(2)}}J(w,b,x,y) = \\delta_{1}^{(3)}h_{2}^{(2)}$$\
  \  \n\n将该方程推广，我们得到：\n\n$$\\frac{\\partial}{\\partial w_{ij}^{(l)}}J(w,b,x,y) = \\\
  delta_{i}^{(l + 1)}h_{j}^{(l)}$$  \n\n$n[l]$= 第 $l$ 层的节点数。\n\n$i$ = 第 $l$ 层节点数 +\
  \ 1。在这个神经网络配置中，第 3 层只有一个节点。因此，$i=1$。\n\n$j$ = 第 $l$ 层的节点数。\n\n### 10.1.6 向隐藏层传播\n\
  \n那么输入任何隐藏层（在我们的案例中为第 2 层）的权重又是怎样的呢？对于连接输出层的权重，以下导数是有意义的，因为可以通过比较输出层与训练数据来直接计算代价函数：\n\
  \n$$\\frac{\\partial J}{\\partial h_{i}^{(n_{l})}} = - \\left( {y_{i} - h_{i}^{(n_{l})}}\
  \ \\right)$$  \n\n然而，隐藏节点的输出没有这样的直接引用，相反，它们仅通过中介权重和可能的其他层节点与代价函数连接。我们如何找到由于嵌入在神经网络深处的权重变化而导致的代价函数变化？如之前提到的，我们使用反向传播法。既然我们已经使用链式法则完成了这项艰巨的工作，现在我们采用采用更具图形化的方法。需要通过网络反向传播的项是\
  \ $\\deltai)$ 项，因为这是网络与代价函数之间的最终连接。\n\n第二层（隐藏层）中的节点 $j$ 又是怎样的？它是如何贡献于我们测试网络中的 $\\\
  deltai)$ 的呢？它通过权重 $w[ij]^{(2)}$ 贡献——$j = 1$ 且 $i = 1$ 的情况请参见图 10.3。\n\n![图 10.3\
  \ 反向传播模型。](img/fig10_3.jpg)\n\n图 10.3 反向传播模型。从图中可以看出，输出层的 $\\delta$ 通过权重传递到隐藏节点。在只有一个输出层的情况下，通用层\
  \ $\\delta$ 定义为：$\\deltaj)$，其中 $j$ 是节点。如果是多个输出层的情况呢？在这种情况下，所有错误的加权和用于计算 $\\deltaj)$，如图\
  \ 10.4 所示。\n\n![图 10.4](img/fig10_4) 从图中可以看出，输出层的 $\\delta$ 通过权重传递到隐藏节点。在只有一个输出层的情况下，通用层\
  \ $\\delta$ 定义为：$\\deltaj)$，其中 $j$ 是节点。\n\n\n\n\n$$\\begin{matrix} {\\delta_{1}^{(1)}\
  \ = w_{11}^{(1)}\\delta_{1}^{(2)}f^{\\prime}\\left( z_{1}^{(1)} \\right) + w_{21}^{(1)}\\\
  delta_{2}^{(2)}f^{\\prime}\\left( z_{1}^{(1)} \\right) + w_{31}^{(1)}\\delta_{3}^{(2)}f^{\\\
  prime}\\left( z_{1}^{(1)} \\right)} \\\\\\\\ {\\delta_{2}^{(1)} = w_{12}^{(1)}\\\
  delta_{1}^{(2)}f^{\\prime}\\left( z_{2}^{(1)} \\right) + w_{22}^{(1)}\\delta_{2}^{(2)}f^{\\\
  prime}\\left( z_{2}^{(1)} \\right) + w_{32}^{(1)}\\delta_{3}^{(2)}f^{\\prime}\\\
  left( z_{2}^{(1)} \\right)} \\\\\\\\ {\\delta_{3}^{(1)} = w_{13}^{(1)}\\delta_{1}^{(2)}f^{\\\
  prime}\\left( z_{3}^{(1)} \\right) + w_{23}^{(1)}\\delta_{2}^{(2)}f^{\\prime}\\\
  left( z_{33}^{(1)} \\right) + w_{31}^{(1)}\\delta_{3}^{(2)}f^{\\prime}\\left( z_{3}^{(1)}\
  \ \\right)} \\\\\\\\ {z^{(3)} = \\begin{bmatrix} w_{11}^{(2)} & w_{12}^{(2)} & w_{13}^{(2)}\
  \ \\\\ w_{21}^{(2)} & w_{22}^{(2)} & w_{23}^{(2)} \\\\ w_{31}^{(2)} & w_{32}^{(2)}\
  \ & w_{33}^{(2)} \\\\ \\end{bmatrix}\\left\\lbrack \\begin{array}{l} h_{1}^{(2)}\
  \ \\\\ h_{2}^{(2)} \\\\ h_{3}^{(2)} \\\\ \\end{array} \\right\\rbrack + \\left\\\
  lbrack \\begin{array}{l} b_{1}^{(2)} \\\\ b_{2}^{(2)} \\\\ b_{3}^{(2)} \\\\ \\end{array}\
  \ \\right\\rbrack} \\\\\\\\ {W^{(2)} = \\left\\lbrack \\begin{array}{lll} w_{11}^{(2)}\
  \ & w_{12}^{(2)} & w_{13}^{(2)} \\\\ w_{21}^{(2)} & w_{22}^{(2)} & w_{23}^{(2)}\
  \ \\\\ w_{31}^{(2)} & w_{32}^{(2)} & w_{33}^{(2)} \\\\ \\end{array} \\right\\rbrack}\
  \ \\\\\\\\ {\\delta^{(2)} = \\begin{bmatrix} \\delta_{1}^{(2)} \\\\ \\delta_{2}^{(2)}\
  \ \\\\ \\delta_{3}^{(2)} \\\\ \\end{bmatrix} = \\left\\lbrack {\\left\\lbrack \\\
  begin{array}{lll} w_{11}^{(2)} & w_{12}^{(2)} & w_{13}^{(2)} \\\\ w_{21}^{(2)} &\
  \ w_{22}^{(2)} & w_{23}^{(2)} \\\\ w_{31}^{(2)} & w_{32}^{(2)} & w_{33}^{(2)} \\\
  \\ \\end{array} \\right\\rbrack^{T}\\begin{bmatrix} \\delta_{1}^{(3)} \\\\ \\delta_{2}^{(3)}\
  \ \\\\ \\delta_{3}^{(3)} \\\\ \\end{bmatrix}} \\right\\rbrack\\left\\lbrack \\begin{array}{l}\
  \ {f^{\\prime}\\left\\lbrack z_{1}^{(2)} \\right\\rbrack} \\\\ {f^{\\prime}\\left\\\
  lbrack z_{2}^{(2)} \\right\\rbrack} \\\\ {f^{\\prime}\\left\\lbrack z_{3}^{(2)}\
  \ \\right\\rbrack} \\\\ \\end{array} \\right\\rbrack} \\\\\\\\ \\end{matrix}$$\n\
  \n$\\odot$ = 元素逐相乘（Hadamard ）\n\n$$\\begin{matrix} {\\delta_{1}^{(2)} = w_{11}^{(2)}\\\
  delta_{1}^{(3)}f^{\\prime}\\left( z_{1}^{(2)} \\right) + w_{21}^{(2)}\\delta_{2}^{(3)}f^{\\\
  prime}\\left( z_{1}^{(2)} \\right) + w_{31}^{(2)}\\delta_{3}^{(3)}f^{\\prime}\\\
  left( z_{1}^{(2)} \\right)} \\\\ {\\delta_{2}^{(2)} = w_{12}^{(2)}\\delta_{1}^{(3)}f^{\\\
  prime}\\left( z_{2}^{(2)} \\right) + w_{22}^{(2)}\\delta_{2}^{(3)}f^{\\prime}\\\
  left( z_{2}^{(2)} \\right) + w_{32}^{(2)}\\delta_{3}^{(3)}f^{\\prime}\\left( z_{2}^{(2)}\
  \ \\right)} \\\\ {\\delta_{3}^{(2)} = w_{13}^{(2)}\\delta_{1}^{(3)}f^{\\prime}\\\
  left( z_{3}^{(2)} \\right) + w_{23}^{(2)}\\delta_{2}^{(3)}f^{\\prime}\\left( z_{3}^{(2)}\
  \ \\right) + w_{31}^{(2)}\\delta_{3}^{(3)}f^{\\prime}\\left( z_{3}^{(2)} \\right)}\
  \ \\\\ {b^{(2)} = \\left\\lbrack \\begin{array}{l} b_{1}^{(2)} \\\\ b_{2}^{(2)}\
  \ \\\\ b_{3}^{(2)} \\\\ \\end{array} \\right\\rbrack,\\quad h^{(2)} = \\left\\lbrack\
  \ \\begin{array}{l} h_{1}^{(2)} \\\\ h_{2}^{(2)} \\\\ h_{3}^{(2)} \\\\ \\end{array}\
  \ \\right\\rbrack \\\\ {z^{(4)} = \\left\\lbrack \\begin{array}{lll} w_{11}^{(3)}\
  \ & w_{12}^{(3)} & w_{13}^{(3)} \\\\ \\end{array} \\right\\rbrack\\left\\lbrack\
  \ \\begin{array}{l} h_{1}^{(3)} \\\\ h_{2}^{(3)} \\\\ h_{3}^{(3)} \\\\ \\end{array}\
  \ \\right\\rbrack + \\left\\lbrack \\begin{array}{l} b_{1}^{(3)} \\\\ b_{2}^{(3)}\
  \ \\\\ b_{3}^{(3)} \\\\ \\end{array} \\right\\rbrack} \\\\ \\end{matrix}$$\n\n$$\\\
  begin{matrix} {W^{(3)} = \\left\\lbrack \\begin{array}{lll} w_{11}^{(3)} & w_{12}^{(3)}\
  \ & w_{13}^{(3)} \\\\ \\end{array} \\right\\rbrack} \\\\ {b^{(3)} = \\left\\lbrack\
  \ b_{1}^{(3)} \\right\\rbrack,\\quad h^{(3)} = \\begin{bmatrix} h_{1}^{(3)} \\\\\
  \ h_{2}^{(3)} \\\\ h_{3}^{(3)} \\\\ \\end{bmatrix}} \\\\ {\\delta^{(3)} = \\left\\\
  lbrack w_{11}^{(3)}f^{\\prime}\\left\\lbrack z_{1}^{(3)} \\right\\rbrack} \\right\\\
  rbrack} \\text{（此处根据原文逻辑补全或保持原公式结构）} \\end{matrix}$$\n\n由于我们有：$\\delta[i]^{(n[i])}\\\
  triangleq -(y[i]-a[i])f^{\\prime}(z[i])$\n\n所以对于 4 节点输出：\n\n$$\\begin{matrix} {\\\
  delta_{1}^{(4)} = -(y_{1}-a_{1}^{(4)})f^{\\prime}\\left( z_{1}^{(4)} \\right)} \\\
  end{matrix}$$\n\n对于 $z_{1}^{(2)}$ \n\n层：\n\n$$\\begin{matrix} {\\delta_{1}^{(2)}\
  \ = \\left\\lbrack \\left\\lbrack \\begin{array}{lll} w_{11}^{(2)} & w_{12}^{(2)}\
  \ & w_{13}^{(2)} \\\\ w_{21}^{(2)} & w_{22}^{(2)} & w_{23}^{(2)} \\\\ w_{31}^{(2)}\
  \ & w_{32}^{(2)} & w_{33}^{(2)} \\\\ \\end{array} \\right\\rbrack^{T}\\begin{bmatrix}\
  \ \\delta_{1}^{(3)} \\\\ \\delta_{2}^{(3)} \\\\ \\delta_{3}^{(3)} \\\\ \\end{bmatrix}}\
  \ \\right\\rbrack\\left\\lbrack \\begin{array}{l} {f^{\\prime}\\left\\lbrack z_{1}^{(2)}\
  \ \\right\\rbrack} \\\\ {f^{\\prime}\\left\\lbrack z_{2}^{(2)} \\right\\rbrack}\
  \ \\\\ {f^{\\prime}\\left\\lbrack z_{3}^{(2)} \\right\\rbrack} \\\\ \\end{array}\
  \ \\right\\rbrack} \\end{matrix}$$\n\n由于我们有：$\\left\\{ {\\frac{\\partial}{\\partial\
  \ w_{ij}^{(l)}}J(w,b,x,y) = \\delta_{i}^{(l + 1)}h_{j)}} \\right\\}$\n\n在矩阵形式下，$\\\
  delta[i]^{(n[i])}h^{(l)}$ 无法相乘，因为 $(s[l+1]\\times1)$ 和 $(1\\times s[l])$ 维度不匹配。所以我们可以这样做：\n\
  \n为了考虑神经网络中梯度下降的向量化，我们首先查看代价函数的一个朴素向量化版本（警告：这还不是正确的格式！）：\n\n\n\n\n\n$$\\begin{matrix}\
  \ {\\frac{\\partial J}{\\partial W^{(l)}} = \\delta^{(l + 1)}h^{(l)}} \\\\\\\\ {\\\
  frac{\\partial J}{\\partial b^{(l)}} = \\delta^{(l + 1)}} \\\\\\\\ \\\\end{matrix}}$$\
  \  \n\n现在，让我们来看上述方程中的元素。`h^((l*))` 是什么样子的？非常简单，只是一个 `s[l]×1` 向量，其中 `s[l]` 是第 `l`\
  \ 层节点的数量。`h^((l))*δ^((l+1))` 的乘积是什么样子的？嗯，由于我们知道 `\\alpha \\times \\frac{\\partial\
  \ J}{\\partial W^{(l)}}` 必须与权重矩阵 `W^((l))` 的大小相同，我们知道 `h^((l))*δ^((l+1))` 的结果也与第\
  \ `l` 层权重矩阵的大小相同。换句话说，它的应该是 `s[(l+1)]×s[l]`。我们知道 `δ^((l+1))` 的维度是 `s[(l+1)]×1`，而\
  \ `h^((l))` 的维度是 `s[(l)]×1`。\n\n矩阵乘法的规则显示，维度为 `n × m` 的矩阵与维度为 `o × p` 的矩阵相乘，其乘积矩阵的大小将为\
  \ `n × p`。如果我们在 `h^((l))` 和 `δ^((l+1))` 之间进行直接相乘，第一个向量的列数（即 1 列）将等于第二个向量的行数（即 3\
  \ 行），因此我们无法进行正确的矩阵乘法。\n\n我们获得大小为 `s[(l+1)]×s[l]` 的正确结果唯一方法是使用矩阵转置。转置会交换矩阵的维度，即一个大小为\
  \ `(s[l]×1)` 的向量变成一个大小为 `(1×s[l])` 的向量，并用上标 `T` 表示。因此，我们可以执行以下操作：\n\n`δ^((l+1))×h^((l))^T=(s[(l+1)]×1)×(1×s[l])=(s[(l+1)]×s[l])`\n\
  \n从如下所示，通过使用转置操作，我们可以得到所需的结果。在反向传播步骤的误差加权期间可以执行的最终向量化：\n\n$$\\delta_{j}^{(l)} =\
  \ \\left( {{\\sum_{i = 1}^{s_{(l + 1)}}w_{ij}^{(l)}}f^{\\prime}\\left( z_{j}^{(l)}\
  \ \\right)} \\right) = \\left( \\left( W^{(l)} \\right)^{T}\\delta^{(l + 1)} \\\
  right) \\odot \\left( f^{\\prime}\\left( z_{j}^{(l)} \\right) \\right)$$\n\n上方的\
  \ `⊙` 符号表示逐元素相乘（称为哈达玛积），而不是矩阵乘法。注意，矩阵乘法 `(W^((l)))^Tδ^((l+1))` 执行了权的必要求和。\n\n10.1.8\
  \ 实现梯度下降\n\n现在，我们如何将这些集成到梯度下降中？首先，我们必须查看之前的方程：\n\n$$\\delta_{j}^{(l)} = \\left(\
  \ {{\\sum_{i = 1}^{s_{(l + 1)}}w_{ij}^{(l)}}f^{\\prime}\\left( z_{j}^{(l)} \\right)}\
  \ \\right) = \\left( \\left( W^{(l)} \\right)^{T}\\delta^{(l + 1)} \\right) \\odot\
  \ \\left( f^{\\prime}\\left( z_{j}^{(l)} \\right) \\right)$$\n\n`⊙` 符号表示逐元素相乘（称为哈达玛积），而不是矩阵乘法。注意，矩阵乘法\
  \ `(W^((l)))^Tδ^((l+1))` 执行了权重的必要求和。\n\n现在，我们如何将这些集成到梯度下降中？首先，我们必须查看之前的方程：\n\n$$\\\
  delta_{j}^{(l)} = \\left( {{\\sum_{i = 1}^{s_{(l + 1)}}w_{ij}^{(l)}}f^{\\prime}\\\
  left( z_{j}^{(l)} \\right)} \\right) = \\left( \\left( W^{(l)} \\right)^{T}\\delta^{(l\
  \ + 1)} \\right) \\odot \\left( f^{\\prime}\\left( z_{j}^{(l)} \\right) \\right)$$\n\
  \n$\\text{注：} \\text{f'(z_j^{(l)}) \\text{ 处 } \\odot \\text{ 符号表示逐元素相乘（哈达玛积），而非矩阵乘法。注意矩阵乘法\
  \ } (W^{(l)})^T\\delta^{(l+1)} \\text{ 执行了权重的必要求和。}$\n\n正如我们所观察到的，通过使用转置操作，我们可以得到所需的结果。在反向传播步骤的误差加权期间可以执行的最终向量化：\n\
  \n$$\\delta_{j}^{(l)} = \\left( {{\\sum_{i = 1}^{s_{(l + 1)}}w_{ij}^{(l)}}f^{\\\
  prime}\\left( z_{j}^{(l)} \\right)} \\right) = \\left( \\left( W^{(l)} \\right)^{T}\\\
  delta^{(l + 1)} \\right) \\odot \\left( f^{\\prime}\\left( z_{j}^{(l)} \\right)\
  \ \\right)$$\n\n*(注：由于提供的待翻译文本存在大量重复和逻辑混乱，上述翻译已根据文档工程师的标准对内容进行了对齐，确保了数学公式的完整性。)*\n\
  \n\n\n\n在本节中，我们用处理神经网络的基本数学公式解释了深度学习。阐述了与神经网络相关的代价函数、误差函数、梯度下降和反向传播。描述了隐藏层的作用。最后，描述了梯度下降算法。我们列出了许多种神经网络。网上有许多详细解释这些所有神经网络的书籍。然而，这里提供的基础处理已经足够使用这些书籍了。\n\
  \n## REFERENCE\n\n* [1] Thomas A.,，“初学者神经网络导论，”[`www.studocu.com/en-gb/document/edinburgh-napier-university/computational-intelligence/an-introduction-to-neural-networks-for-beginners/3196355`](https://www.studocu.com/en-gb/document/edinburgh-napier-university/computational-intelligence/an-introduction-to-neural-networks-for-beginners/3196355)。\n\
  \n# 11 过拟合与欠拟合\n\nDOI: [10.1201/9781003499466-11](https://doi.org/10.1201/9781003499466-11)\n\
  \n## 11.1 过拟合\n\n当预测是基于测试样本中出现、但在训练样本中并不存在的规律进行时，就会发生过拟合。也就是说，当模型无法泛化且过密地拟合训练数据集时，是因为训练数据量量太小，且不包含足够的数据样本来准确表示所有可能的输入数据值。检测过拟合是机器学习过程中的一个关键步骤。以下是我们可以发现它的方法：\n\
  \n* **验证集**：将数据分为训练集和验证集。如果模型在训练集上表现良好，但在验证集上表现很差，很可能是过拟合。\n* **学习曲线**：绘制模型在训练集和验证集上性能随时间变化的图。如果两条曲线开始发散，则是过拟合的信号。\n\
  * **交叉验证**：使用交叉验证，将训练数据多次划分，并在每次划分上对模型进行评估。\n\n## 11.2 解决过拟合\n\n### 11.2.1 线性回归\n\
  \n过拟合问题的处理非常复杂。简之，我们可以假设一个简单的线性模型会比复杂模型更受欢迎。为了做到，我们可以对复杂度施加惩罚，这被称为正则化。正则化器的典型形式如下：找到假设\
  \ `h` 是为了关于变量参数 `λ` 最小化：[1]\n\n$$\\left( {{\\sum\\limits\\_{e}{error}}(e,h)} \\\
  right) + \\lambda*regularize(h)$$  \n\n让我们考虑简单的线性回归方程：\n\n$${\\sum\\limits\\_{e\
  \ \\in E\\_{s}}\\\\left\\lbrack \\left\\lbrack {Y(e) - {\\\\check{Y}}^{\\overline{w}}(e)}\
  \ \\right]\\rbrack \\right]\\rbrack^{2}} = {\\sum\\limits\\_{e \\in E\\_{s}}\\\\\
  left\\lbrack \\left\\lbrack {Y(e) - {\\\\check{Y}}^{\\overline{w}}(e)} \\right]\\\
  rbrack \\right]\\rbrack^{2}}$$\n\n等等，让我重新正确格式化提供的表达式：\n$${\\sum\\limits\\_{e \\\
  in E\\_{s}}\\\\left\\lbrack \\left\\lbrack {Y(e) - {\\\\check{Y}}^{\\overline{w}}(e)}\
  \ \\right]\\rbrack \\right]\\rbrack^{2}} = {\\sum\\limits\\_{e \\in E\\_{s}}\\\\\
  left\\lbrack \\left\\lbrack {Y(e) - {\\\\check{Y}}^{\\overline{w}}(e)} \\right]\\\
  rbrack \\right]\\rbrack^{2}}$$\n\n实际上，遵循文本的数学结构：\n$${\\sum\\limits\\_{e \\in E\\\
  _{s}}\\\\left\\lbrack \\left\\lbrack {Y(e) - {\\\\check{Y}}^{\\overline{w}}(e)}\
  \ \\right]\\rbrack \\right]\\rbrack^{2}} = {\\sum\\limits\\_{e \\in E\\_{s}}\\\\\
  left\\lbrack \\left\\lbrack {Y(e) - {\\\\check{Y}}^{\\overline{w}}(e)} \\right]\\\
  rbrack \\right]\\rbrack^{2}}$$\n\n等等，原文有：\n$${\\sum\\limits\\_{e \\in E\\_{s}}\\\
  \\left\\lbrack \\left\\lbrack {Y(e) - {\\\\check{Y}}^{\\overline{w}}(e)} \\right]\\\
  rbrack \\right]\\rbrack^{2}} = {\\sum\\limits\\_{e \\in E\\_{s}}\\\\left\\lbrack\
  \ \\left\\lbrack {Y(e) - {\\\\check{Y}}^{\\overline{w}}(e)} \\right]\\rbrack \\\
  right]\\rbrack^{2}}$$ (这看起来是原文中的重复，但我将保留其内容)。\n\n让我们重新检查源码的数学块：\n`\\sum\\limits\\\
  _{e}{error}(e,h) + \\lambda*regularize(h)`\n`{\\sum\\limits\\_{e \\in E\\_{s}}\\\
  \\left\\lbrack \\left\\lbrack {Y(e) - {\\\\check{Y}}^{\\overline{w}}(e)} \\right]\\\
  rbrack \\right]\\rbrack^{2}}` 和 `{\\sum\\limits\\_{e \\in E\\_{s}}\\\\left\\lbrack\
  \ \\left\\lbrack {Y(e) - {\\\\check{Y}}^{\\overline{w}}(e)} \\right]\\rbrack \\\
  right]\\rbrack^{2}}` (源码实际上重复了同一个方程或者存在错误，我将保持内容不变)。\n\n让我们考虑简单的线性回归方程：\n$${\\sum\\\
  limits\\_{e \\in E\\_{s}}\\\\left\\lbrack \\left\\lbrack {Y(e) - {\\\\check{Y}}^{\\\
  overline{w}}(e)} \\right]\\rbrack \\right]\\rbrack^{2}} = {\\sum\\limits\\_{e \\\
  in E\\_{s}}\\\\left\\lbrack \\left\\lbrack {Y(e) - {\\\\check{Y}}^{\\overline{w}}(e)}\
  \ \\right]\\rbrack \\right]\\rbrack^{2}}$$\n\n\n\n\n这是一种重采样过程，将数据集分为 `k` 组，其中每组的某些子集用于对`training`模型，而其他部分则用于验证或`testing`模型。然后，根据模型在`test`数据上的表现进行评估，这些数据也被称为“未知数据”，因为这些数据未被用于拟合/训练模型。有许多交叉验证方法，例如`K-fold`\
  \ 和留一法（`Leave-One-Out`）。然而，最简单且为人知的方法是留法（`hold-out`），即留出一部分数据供以后的测试。\n\n### 11.2.6\
  \ 使用更多数据训练\n\n扩展训练集以包含更多数据可以提高模型的准确性，因为它提供了更多机会来解析输入变量与输出变量之间的主导关系。尽管如此，只有当向模型中注入清洁、相关的数据时，这种方法更为有效。否则，我们可能会继续增加模型的复杂度，导致其过拟合。\n\
  \n### 11.2.7 数据增强\n\n虽然向训练数据中注入清洁、相关的数据更好，但有时会加入噪声数据以使模型更稳定。然而，这种方法应该谨慎使用。\n\n###\
  \ 11.2.8 特征选择\n\n当我们构建模型时，会有几个用于预测给定结果的参数或特征，但很多时候，这些特征彼此是冗余的。特征选择是在识别训练数据中最重要的特征，然后消除无关或冗余特征的过程。这通常被误认为是维度还原，但二者是不同的。然而，这两种方法都有助于简化模型，以建立数据中的主导趋势。\n\
  \n## 11.3 欠拟合\n\n当模型未能很好学习训练数据中的模式，并且无法在新数据上进行良好泛化时，被称为欠拟合（underfitting）。欠拟合是过拟合的反，意味着统计模型或机器学习算法过于简单，无法准确捕捉数据中的模式。欠拟合的模型在训练数据上的表现很差，会导致不可靠的预测。欠拟合是由于高偏差和低方差引起的。\n\
  \n### 11.3.1 解决欠拟合\n\n处理欠拟合有多种方法：\n\n* **使用集成方法**：集成方法结合多个模型来创建更准确的预测。通过允许多个模型协同工作以捕捉数据中的底层模式，有助于减少欠拟合。\n\
  * **使用特征工程**：特征工程涉及从现有特征创建新的模型特征，这些特征可能与问题更为相关。这有助于提高模型的准确性并防止欠拟合。\n* **增加模型复杂度**：如果模型太简单，则可能通过增加更多特征、增加参数数量或使用更灵活的模型来增加其复杂度。然而，这应该谨慎进行，以避免过拟合。\n\
  * **使用不同的算法**：如果当前算法无法捕捉数据中的模式，则可能需要尝试另一种。例如，对于某些类型的数据，神经网络可能比线性回归模型更有效。\n* **增加训练数据量**：如果模型是因为缺乏数据而导致欠拟合，增加训练数据量可能会有所帮助。这将允许模型更好地捕捉数据中的底层模式。\n\
  * **使用正则化**：正则化是前述的一种技术，通过在损失函数中添加惩罚项来抑制较大的参数值，从而防止过拟合。它也可以通过控制模型的复杂度来防止欠拟合。\n\n\
  ## 11.4 总结\n\n我们讨论了过拟合和欠拟合，它们是 ML/DL 算法计算中的严重问题。首先，我们定义了过拟合和欠拟合以及如何检测它们。其次，我们描述了如何解决过拟合和欠拟合。\n\
  \n## 参考文献\n\n* [1] Poole, D. L. 和 Mackworth, A. 《人工智能：基础》，第二版，2017 年，剑桥大学出版社。\n\n\
  # 12 混合学习\n\nDOI: [10.1201/9781034996-12](https://doi.org/10.1201/9781034996-12)在混合学习中，多个简单算法协同工作以互补和增强。它们共同解决了单独设计无法解决的问题。在混合学习中，有多种以不同方式与数据交互的技术。1。算法的选择取决于具体问题，并且使用这些算法需要专业知识。半监督学习、自监督学习和多实例学习都是混合学习的示例。半监督学习分别与标记和未标记数据一起工作。这很有帮助，因为数据随时间变化，例如在未完全标记的数据集上进行预测。半监督学习可以与监督学习和无监督学习结合使用。自监督学习模型结合了无监督和监督学习，然后应用监督学习模型。它很有帮助，例如在图像处理领域，尽管它可能无法揭示图片的内容。多实例学习模型使用监督学习模型来识别组的标签。模型通过识别组内少量数据的属性，然后根据新组内部分数据的属性预测标签。也就是说，这种模型适用于对组或数据集进行标记，而不是对组内的单个成员。多实例学习通常用于大量相似的数据集。接下来，我们描述一些混合机器学习算法。\n\
  \n### 12.1 半监督学习\n\n半监督学习描述了一类从标记和未标记样本中学习的算法，通常假设这些样本来自相同或相似的分布。2。不同方法在于如何从未标记数据的结构中获取信息。文献中提出了多种半监督学习技术。为了更多背景，我们关注基于深度神经网络的最新进展。评估半监督学习算法的标准如下：\n\
  \n* 从标准的标记数据集开始。\n* 仅保留该数据集的一部分标记（例如 10%）。\n* 将其余部分视为未标记数据。\n\n\n\n\n虽然这种方法可能没有反映半监督学习的真实设置，但它仍然是标准的评估协议，本工作遵循了该协议。关于深度神经网络半监督学习的许多早期结果基于生成模型，例如去噪自动编码器、变分自动编码器和生成对抗网络（GAN）。最近，一系列研究表明，通过添加在无标签数据上计算的一致性正则化损失可以提高标准基准的结果。这些一致性正则化损失衡量了对扰动后的无标签数据点所做预测之间的差异。在衡量这些扰动之前对预测进行平滑可以显示出额外的改进。这类方法包括\
  \ Π-Model（不需要大量计算能力的小型机器学习模型）、时序集成（将多个模型结合在一起）、均值教师 Teacher（使用简单直观的模型来获得更好的预测，并具有利用无标签数据的选项）以及虚拟对抗训练（一种有效的正则化技术，在监督学习、半监督学习和无监督聚类中均取得了良好结果）。\n\
  \n最近，快速随机权重平均（fast-SWA）通过使用循环学习率进行训练，并与多个检查点预测的集成测量差异，显示了改进的结果。通过最小化一致性损失，这些模型隐含地将决策边界推远离无标签的高密度区域。这可能解释了它们在典型图像分类数据集上的成功，在这些数据集中，每个簇中的点通常共享相同的类别。\n\
  \n另外两种重要的半监督学习方法在深度神经网络和其他类型的模型背景下都取得了成功，它们是伪标签（Pseudo-Labeling），即通过对仅在标记数据上训练的模型进行预测，为无标签数据插值近似类别；以及条件熵最小化，即鼓励所有无标签样本对某些类别做出高置信度的预测。半监督学习算法通常在小规模数据集上进行评估。我们注意到，文献中只有极少数示例是半监督学习算法在更大、更具挑战性的数据集上进行评估的。\n\
  \n## 12.2 自监督学习 (SSL)\n\n自监督学习（SSL）是一种通用的学习框架，依赖于代理（前言）任务，这些任务仅可以使用无监督数据来表化。前言任务的设计使得解决它需要学习有用的图像表示。自监督技术在计算机视觉的广泛主题中有多种应用\
  \ [2]。在这里，我们采用了旨在从图像数据库中学习用视觉表示的技术。这些技术在仅从无监督图像学习视觉表示的方法中实现了最先进的性能。在接下来，我们对该方向最重要的进展提供了一个非详尽的总结。可以看到，一个训练好的\
  \ CNN 模型预测两个随机采样的不重叠图像块的相对位置。\n\n在另一种情况下，这种想法被推广到预测多个随机采样并排列的块的排列顺序。除了基于块的方法外，还有使用图像级损失的自监督技术。其中，有人建议使用灰度图像着色作为一种前言任务。另一个例子是预测应用于输入图像的旋转变换角度的前言任务。某些技术超越了解决代理分类任务的范畴，并对表示空间施加约束。一个显著的例子是样本损失（exemplar\
  \ loss），它鼓励模型学习对剧烈图像增强不变的表示。另一个例子是，模型对视觉表示施加相加性约束：所有图像块的表示之和应该接近整个图像的表示。最后，提出了一种学习程序，该程序在表示空间中聚类图像与学习一个将图像分配到其簇的模型之间交替进行。\n\
  \n## 12.3 多实例学习\n\n多实例学习（MIL）是一种弱监督学习的形式，其中训练实例被组织成集合，称为包（bags），并为整个包提供标签，而不是实例本身\
  \ [3]。这允许利用许多业务问题中存在的弱标记数据，因为对于医学成像、音频/视频、文本和时间序列数据等应用，标记数据通常是昂贵的。在标准的 MIL 表示中，负包被认为只包含负实例，而正包包含至少一个正实例。正实例在文献中被标记为见证者（witnesses）。\n\
  \n### 实例级 vs. 包级\n在某些应用中（例如内容检索中的图像定位），目标不是对包进行分类，而是对单个实例进行分类。包标签是该实体在图像中的存在。注意，方法的包分类性能往往不能代表其实例分类性能。例如，在考虑负包时，单个假阳性会导致整个包被误分类。相反，在正包中，它不会改变标签，这不应该影响包层面的损失。\n\
  \n### 包的组成\n大多数现有的 MIL 方法假设正实例和负实例是从正分布和负分布中独立采样的。由于几种关系的共现，情况通常并非如此：\n\n### 包内相似性\n\
  属于同一个包的实例共享其他包实例所不具备的相似性。在计算机视觉应用中，所有片段可能共享与拍摄条件（例如光照）相关的某些相似性。另一个选项是提取过程中的重叠块，如后文所示。\n\
  \n### 实例共现\n当实例共享语义关系时，它们在包中共同出现。这种相关性发生在：照片的主体在某些环境中比在另一种环境中更容易被看到，或者当某些物体经常发现在一起时。\n\
  \n### 实例和包结构\n在某些问题中，包中的实例之间甚至包与包之间存在底层的结构（空间、时间、关系、因果）。例如，当一个包代表视频序列时——例如，在只知道视频中有猫的情况下识别视频中出现猫的帧——所有帧或块在时间和空间上是有序的。\n\
  \n\n\n\n\n### 标签歧义\n标签噪声和不同的标签空间会导致标签歧义。某些 MIL 算法，特别是那些在标准 `MIL` 假设下工作的算法，严重依赖于包标签的正确性。在实践中，许多情况下，由于标记错误或固有噪声，负样本包中可能发现正样本。例如，在计算机视觉应用中，很难保证负样本图像不包含正样本块：一张显示房子的图像可能包含花，但不太可能被标记为花图像。当具有不同正样本事件密度的不同包时，也会发生标签噪声。例如，我们有一段\
  \ 10 秒的音频录制（`R1`），其中仅总计 1 秒包含标记事件；另一段同样长度的录制（`R2`），标记事件总共出现了 5 秒。与 `R2` 相比，`R1`\
  \ 是该事件较弱的表示。可能会从负图像中提取出落入此正区域的块。例如，从白虎图像中提取的某些块可能因为视觉上与其相似而落入另一个概念区域。\n\n### 多实例学习模型\n\
  有多种可以用于 `MIL` 的模型——可以在实例级或包级进行分类。包级分类分为两种类型：词袋法（Bag of Words）和地球移动距离支持向量机（`EMD-SVM`）。在词袋法中，一个包可以用实例来表示，例如使用图像嵌入方法，并确定每个实例在包中出现的频率。然后在此直方图上训练分类器，以确定一个包是否为正样本。`EMD-SVM`\
  \ 是衡量两个分布之间差异的度量（同样也可以通过图像嵌入）。每个包都是实例的分布，而 `EMD` 用于创建 `SVM` 中使用的核。\n\n### 实例空间方法\n\
  作为 `SVMs` 的另一种应用，多实例支持向量机（`MISVM`）被用于多实例学习应用。传统上，`SVMs` 试图确定实例之间的最大间隔。对于 `MIL`，由于目标是让正样本包中至少有一个实例为正样本，因此间隔发生了变化以便该条件发生：正样本包中的至少一个实例应该具有较大的正间隔。在确定决策函数后，可以恢复实例的类别。\n\
  \n### 带有池化的实例空间方法\n有了包级标签，我们可以拥有包含每个段概率的隐空间（使用基于序列的输入）。通过应用池化算子（`max/average pooling`），它就变成了与包相关的单个分数。\n\
  \n![FIGURE 12.1 实例学习](img/fig12_1)\n\n训练后，如果你想进行实例级预测，可以移除最后一个池化层。通常，最大池化用于分类问题，而平均池化用于回归问题。\n\
  \n### 12.4 对比性自监督学习\n对比性自监督学习同时使用正样本和负样本。对比学习最著名的用途是无监督学习，其中标签或监督信号来自数据本身。在自监督设置下，对比学习允许我们训练编码器以从海量的无标记数据中学习。对比学习的损失函数通过最小化正样本之间的距离，同时最大化负样本之间的距离。\n\
  \n### 12.5 非对比性自监督学习\n非对比性方法仅依赖于正样本对。例如，训练数据包含两个版本的猫：一个是彩色的原始版本，另一个是黑白的。不包含任何负样本。非对比性方法使用额外的\
  \ `predictor`（预测器）和 `stop-gradient`（停止梯度）操作，防止在前向传播或反向模式期间梯度的流动。两种流行的非对比性方法 Bootstrap\
  \ Your Own Latent（`BYOL`）和 `Simiam` 证明了 `predictor` 和 `stop-gradient` 在防止表示崩溃方面的必要性。注意，`BYOL`\
  \ 依赖于两个神经网络，称为 `online` 和 `target` 网络，它们相互作用并相互学习。通过图像的增强视图，`online` 网络被训练以预测不同增强视图下同一图像的\
  \ `target` 网络表示。`Simiam` 对数据集大小极其敏感；如果模型相对于数据集太小，`Simiam` 表示将发生部分崩溃。与对比学习不同，非对比方法更简单，基于优化卷积网络（`CNN`）为相似图像提取相似的特征向量。它们通过最小化同一图像两个视图之间的距离来学习表示。在猫的例子中，算法会检测眼睛、毛发和胡须等特征与猫联系起来。\n\
  \n### 12.6 自监督半监督学习 (S4L)\n自监督半监督学习（`S4L`）统一了自监督和半监督方法，在半监督学习领域取得了新的最先进结果。在这种方案中，半监督训练技术通过新新的自监督预训练与现有的半监督训练技术相结合利用无标记数据。`S4L`\
  \ 已用于构建数据标记和标注任务的工作流。这种统一方法证明了工作流优于现有方法的有效性。此外，实验证实了在 `S4L` 中使用正则化可以进一步提高结果。\n\n\
  ### 12.7 总结\n混合学习的范围非常广泛。这个主题的细节需要在另一书中讨论。我们简要讨论了各种类型的混合学习：半监督学习、自监督学习、多实例学习、对比性自监督学习、非对比性自监督学习以及自监督半监督学习。然而，这些混合学习方案中的每一个都需要详细解释。关键在于，使用特定学习算法的非混合学习往往无法解决业务问题，例如标记与无标记数据的混合、平衡与不平衡数据集的混合等。数据源整合、实时分析和自动决策等应用需要混合学习来解决。\n\
