  # 6 协议层架构\n\nDOI: [10.1201/9781003499466-6](https://doi.org/10.1201/9781003499466-6\n\
  \n## 6.1 开放标准模型\n\n最重要的是，我们可以想象一个成千上万的超级计算机通过全球网络连接到数十终端设备的环境。在这种情况下，我们需要使用开放标准互连（OSI）模型，其软件/硬件技术被视为一组新的通信技术。OSI\
  \ 模型是由国际标准组织（ISO）开发的，它为网络软件和硬件技术提供了七层架构。1 ISO 模型为所有功能实体之间的互操作性提供了革命性的机制。正确地说，OSI\
  \ 模型为应用层（第七层）创建新的增值产品和服务提供了选项。\n\n图 6.1 显示了网络上端到端通信的 OSI 协议层架构。在计算机主机和用户终端所在的地方，显示了七层逻辑协议栈。有趣的是，连接网络上主机和终端的网络路由器/交换机仅包含三个逻辑协议栈。\n\
  \n![图 6.1 OSI 参考协议层架构](img/fig6_1.jpg)\n\n图 6.1 OSI 参考协议层架构。\n\n每一层的基本原理是根据国际标准创建不同抽象抽象层。每一层都需要执行一组良好定义的、基于标准的特定函数，在逻辑上区分每一层。称为应用程序编程接口（API）的软件接口未在图\
  \ 6.1。然而，我们提供了每个 OSI 层某些示例功能的概述，以及随后在不同国际标准论坛中标准化的特定功能示例。\n\n### 6.1.1 第 1 层：物理层\n\
  \n物理层负责在通信链路或通道上传输和接收原始比特。物理层链路/通道可以是物理介质或无线。流量复用、调制方案、数据速率、信道接入方法、物理连接器、单工、全双工/半双工、定时、频率、电压电平等都是物理层的功能。电气电子学会（IEEE）已成为构建物理层\
  \ 1 相关规范的主要论坛。以太网、蓝牙、通用总线（USB）是物理层标准实体的示例。物理层链路/通道可以是物理介质或无线。\n\n### 6.1.2 第 2 层：数据链路层\n\
  \n\n\n数据链路层在通过线缆或无线链路连接的两个节点之间传输和接收数据帧。链路传输过程中发生的纠错和数据帧的确认是其主要功能。与第 1 层一样，`IEEE`\
  \ 也已成为构建数据链路层 2 相关规范的主要标准论坛。`IEEE` 进一步扩展了 OSI 数据链路层 2，将其划分为两个子层：介质访问控制（`MAC`）和逻辑链路控制（`LLC`），如图图\
  \ 6.2 和介质访问控制 (MAC)。](Images/fig6_2.jpg)\n\nFIGURE 6.2 由 IEEE 定义的 OSI 数据链路层 2 子层：逻辑链路控制\
  \ (`LLC`) 和介质访问控制 (`MAC`)。\n\n`IEEE` 开发了完善的 `LLC` 标准，例如 `IEEE 802.2`。此外，在其他标准论坛开发的点点协议（`PPP`）、异步传输模式（`ATM`）、帧继（`FR`）和同步光纤（`SONET`）标准也属于\
  \ `LLC`。同样，`IEEE` 开发了 `MAC` 标准，例如用于数据速率的以太网：载波多道冲突检测（`CSMA/CD`）`IEEE 802.3`、Wi-Fi：载波多道冲突回避（`CSMA/CA`）`IEEE\
  \ 802.11`，以及在 `IEEE` 中开发的 `802.15.4` Zig-Bee。\n\n### 6.1.3 第 3 层：网络层\n\n网络层负责控制子网/网络的操作。网络层协议的一个关键功能是数据包如何从源路由到目的地，而目的地可能连接在距离源许多跳数的子网络上。需要使用标准化的网络路由协议（例如：最短路径优先协议\
  \ `OSPF`、边界网关协议 `BGP` 等）来确定下一跳网络节点在目的路径中的最佳位置，解析目的节点的网络层地址。此外，路由协议、组播组管理、网络层信息与错误以及网络层地址分配都是网络层的功能。注意，是有效负载的功能使得这些属于网络层，而不是承载它们的协议的功能。\n\
  \n### 6.1.4 第 4 层：传输层\n\n传输层位于会话层（第 5 层）和网络层（第 3 层）之间，其基本功能是接收会话层的数据，然后根据网络层的允许将其分成较小的数据包，并传递给网络层以确保数据包正确到达（对于如\
  \ `TCP` 等面向连接的传输协议）。\n\n### 6.1.5 第 5 层：会话层\n\n会话层允许不同计算机上的用户建立会话。它提供了如全双工、检查点、重启和终止会话等功能。注意，IP\
  \ 协议栈（见章节 6.2.2）并不包含会话层以及底层的挂起和关闭功能。\n\n### 6.1.6 第 6 层：表示层\n\n两个通信实体之间的应用层可能具有不同的语法和语义。表示层通过映射、压缩和解压缩缓解这些差异。也就是说，表示层将数据转换为应用层接受的形式。例如，音频编码、视频编码、非\
  \ XML 到 XML 的映射等。\n\n### 6.1.7 第 7 层：应用层\n\n应用层是终端用户直接与应用程序交互的地方。OSI 标准没有定义这一层，将其交给市场根据需求通过竞争手段开发智能增值应用和服务。当然，国际标准论坛有机会标准化某些应用层协议，例如用于电子邮件的\
  \ SMTP、用于 IP 电话（VoIP）的会话建立协议 (`SIP`)、用于文件传输的空传输协议 (`FTP`) 等。\n\n\n\n\n国际工程任务组（`IETF`）开发了早期传输控制协议（`TCP`/IP\
  \ 协议（`IP`）参考模型，该模型多年一直在演变。`RFC 1122` 定义了名为《主机需求》的增强型 `TCP/IP` 参考模型。该文档松散地定义了层模型，没有像\
  \ OSI 模型那样指定任何层数。最后，`IETF` 未对其分层模型进行任何正式的增强，而 OSI 模型似乎更符合逻辑。从 `RFC 1122` 演变并在 `IETF`\
  \ 中流行的分层模型如图 6.3\n\n图 6.3 互联网协议层参考架构。\n\n在本书中，我们将使用图 6.3 作为描述协议层参考架构的基础，因为互联网已成为全球所有用户最主导的全球网络。此外，图\
  \ 6.4 中所示的互联网层细节将在书中使用。此外，用于商业和军事领域的众多应用程序也是基于互联网协议（`IP`）的。`IETF` 强调将智能放在边缘的原则，并假设互联网本身（边缘之外）应该是简单的，只需为边缘节点提供更快速的通信，并且为了简单而不保留任何状态。现实中，由于担心具有\
  \ 64 位地址字段的互联网协议版本 4（`IPv4`）无法支持用户连接到 `IPv4` 互联网的所有网络地址，并满足客户对私有网络拓扑隐藏的需求，使用了地址转换器（`NATs`）。后来，防火墙被用于防止网络攻击。最后，使用\
  \ Web 服务器的流行万网服务的出现迫使我们使用内容缓存，而云服务的日益普及也迫使我们在某种程度上修改了 `IETF` 的原则。具有 128 位地址字段的 IP\
  \ 版本 6（`IPv6`）的标准化消除了使用 `NATs` 的需求，因为它拥有更大的地址空间和拓扑隐藏能力。\n\n![图 6.4 互联网/网络层 3 的高层细节。](img/fig6_4.jpg)\n\
  \n图 6.4 互联网/网络层 3 的高层细节。\n\n`IETF` 以这一原则为基础定义了不同的层，尽管没有像 OSI 模型那样清晰，但发现使用像 OSI 模型那样的层数在开发软件和产品时非常方便且易于表达。尽管存在某些差异，`IETF`\
  \ 和 OSI 层模型之间似乎几乎有一一一的映射。例如，`IETF` 针对 `IP` 的网络层 3 并不完全由 OSI 网络层 3 所定义，因为 `IP` 具有诸如\
  \ `ICMP` 等特征，这些特征似乎在第 3 层之上。另一方面，`IETF` 模型没有显式地定义会话层（第 5 层）和表示层（第 6 层）。\n\n最初，`IETF`\
