  - '[PAGE 2]


    conversion of biomass to syngas under a condition with a limited oxygen supply
    [4,14,27]. It can be classified into conventional and hydrothermal types depending
    on the type of gasifying agent, reaction conditions, and quality of the produced
    syngas [2,28]. Unlike other thermochemical technologies that normally favor dry
    biomass, hydrothermal treatment can transform wet biomass into gases, solid fuels,
    and other constituents at reasonable energy efficiencies. Hydrothermal treatment
    involves the utilization of hot pressurized water as a reactant to produce biofuels
    [12]. It can be classified as either hydrothermal carbonation or hydrothermal
    liquefaction, based on the temperature, pressure, and proportions of the converted
    intermediate products [29]. The design of these processes presents various challenges,
    mostly owing to their multiparametric and complex characteristics. In addition,
    serious consideration should be given to catalyst [30], in terms of basic properties
    [31] that increased the yield of oil and gas while that of char is suppressed
    [32].


    Typical thermochemical conversion research often requires rigorous experiments
    to determine the optimal design and operation [5,12]. Over the years, novel modeling
    techniques, including computational fluid dynamics (CFD), kinetic and thermodynamic
    models, and process models, have been employed to accelerate process optimization
    while reducing operation time and cost [33–37]. However, modeling using these
    conventional techniques is sometimes unrealistic and difficult [38,39]. This is
    because these models are based on a variety of assumptions, either elaborated
    or oversimplified, affecting the quality of the model predictions and/or leading
    to great difficulty in implementation [40]. In addition, these models are difficult
    to incorporate under different operating conditions [35,41]. For example, CFD
    is time-consuming and computationally expensive because it requires a significant
    amount of processing power and predefined engine-specific parameters [36,37].
    Therefore, developing an accurate, non-time-consuming, non-computationally expensive,
    and robust modeling approach to model the processes is of utmost importance.


    Machine Learning (ML) techniques have proven to be reliable alternatives to the
    traditional modeling techniques for studying and comprehending complex conversion
    processes. They can model complex problems by leveraging a series of interconnections
    between the input and output parameters. Recently, the application of ML approaches
    to model thermochemical biofuel conversion processes have increased significantly.
    The applications include the prediction of the yield and composition of products,
    kinetic parameters, and calorific values of the products. The ML models developed
    have also been used to determine the optimal conditions for desired production.
    The preprocessing or normalization of input variables with distinctive magnitudes
    is a hyperparameter that contributes to improve the performance of machine learning-based
    models. However, some did not state the measures adopted to prevent overfitting,
    which is a crucial challenge against the model improvement [37,42–44].


    Previous reviews summarized the ML application of biomass conversion processes,
    where specific datasets (e.g., not diverse type of feedstock and operating conditions)
    were utilized. The developed ML models showed good performance, but extrapolation
    or further improvement of the ML model was limited by the variability in the conversion
    process such as types of reactors, feedstocks, and operating conditions. In real
    applications, the development of a universal ML model is necessary to produce
    biofuel stably regardless of the condition of biomass feedstock. As a first step
    to develop such universal model, the variability in the dimensions of the dataset,
    as well as the number of data points, were compared in this study. Preprocessing
    and the possibility of overfitting in the developed ML are also discussed. Then,
    this review summarized the results of estimating the importance of input variables
    in individual ML models in order to discuss which input variables are important.
    Finally, relevant challenges in the development of universal ML model are summarized
    and potential solutions and future research directions are suggested.


    # 2. General overview of machine learning


    Machine learning methods can be classified as supervised, semi-supervised, unsupervised,
    or reinforcement learning. In supervised learning methods, labeled input and output
    datasets are used for the training and validation of the model. The model then
    learns to map the input data to its targeted output [45]. Supervised learning
    methods can be categorized into regression and classification methods. Classification
    methods seek to identify behavioral patterns across datasets, whereas regression
    methods aim to establish the best match between the input and output parameters
    [46].


    In contrast to supervised learning, unsupervised machine learning, also known
    as self-organization, works best with unlabeled data and is excellent at detecting
    any possible hidden patterns. As input data are fed into an unsupervised ML model,
    the model seeks and classifies the similarities and differences between the data
    accordingly. Examples of unsupervised ML include principal component analysis,
    dimensionality reduction, and clustering. Semi-supervised learning combines the
    advantages of supervised and unsupervised learning. It aids in the resolution
    of supervised learning challenges and can handle systems with both unlabeled and
    labeled inputs [45]. It is worth noting that labeling data for supervised learning
    is often difficult and time-consuming. Semi-supervised learning can overcome this
    drawback by incorporating a portion of the total unlabeled input into the supervised
    learning process [45,47].


    The last class of ML algorithms, reinforcement learning, involves a learning system
    called an agent, which understands its environment through a series of actions
    that could give it a reward or penalty. A positive action yields rewards and negative
    action results in a penalty. The agent allows a better understanding of its environment
    without human intervention, based on maximizing profit and reducing penalties
    [39,48]. Some prominent ML algorithms employed in the field of science and engineering,
    which can be implemented for biomass thermochemical conversion processes, are
    presented in Fig. 1. Several ML algorithms have been utilized for different aspects
    of biomass thermochemical conversion processes. The most widely explored algorithms
    are artificial neural networks (ANN). Other less popular algorithms include decision
    trees, random forests, support vector machines, deep neural networks, and hybrid
    intelligent models. A brief discussion of ANN and other algorithms that have been
    used in various applications of this field have been given by Umenweke et al.
    [2], Ascher et al. [25], Ascher et al. [49], and Shahbeik et al. [28]. More explanation
    about methods to estimate feature importance was added to Supplementary Material.


    # 3. Machine learning (ML) applications in thermochemical biofuel conversion processes


    Thermochemical conversion processes convert biomass resources into various biofuels
    such as hydrogen, methane, biogas, bio-oil and biochar. To maximize the selectivity
    or yield of biofuel and the conversion efficiency, various ML approaches have
    been applied to the thermochemical biofuel conversion processes. Before applying
    ML methods, the performance of a trained model needs to be assessed using the
    test dataset acquired from thermochemical biofuel conversion processes. Most studies
    describe the performance of models using a correlation coefficient (R²) or root
    mean square error, which is sufficient for a single-output model. However, in
    the case of a multioutput model, the performance of model should consider the
    different magnitudes of each output, and the role of R² should be limited to evaluating
    the correlation of each output. Thus, for multioutput models, relative measures,
    such as the average percentage error or root relative squared error, are recommended
    to compare the averaged performance of different models.


    It is important to know how the prediction of ML models could deviate from experimental
    values, but few studies provided the respective yield values in ML studies. Instead,
    some studies provided the averaged percentage error between experimental value
    and prediction.'
