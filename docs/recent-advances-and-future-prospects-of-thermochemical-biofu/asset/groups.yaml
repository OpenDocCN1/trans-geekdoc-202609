    ## 5. 挑战与展望


    尽管机器学习模型在热化学生物燃料转化预测方面的应用已得到广泛探索，但这些研究仍无法扩展到实际实施和工厂规模优化。各种综述强调了数据集和理论集成机器学习模型在提高机器学习模型实际应用中的重要性。就数据集而言，强调了使用小数据集、多视角数据、不确定性量化以及数据质量的重要性
    [118,119]。尽管多视角数据为机器学习建模提供了更全面的信息 [118]，但由于模型结构复杂性增加，它可能会恶化训练过程。然而，这可以通过使用机器学习模型的紧凑架构来克服。研究表明，在不增加神经元数量或复杂性的情况下，神经网络的紧凑形式提供了最佳性能
    [120]。此外，大多数研究使用了总和为 100% 的生物质组成。由于组成（或输入变量）之间存在相互关联，因此应进一步探索平衡相关问题以及使用独立测量的组成
    [55]。数据收集的重要方面将在下一节中讨论。理论集成机器学习模型因其更好的外推性和可解释性而在多个领域蓬勃发展 [121]。然而，其在生物质热化学转化中的应用仍然有限。在下一节中，将讨论基于理论模型和机器学习模型预测生物质热化学转化的可能集成。


    ### 5.1. 全面数据集


    应创建更全面的数据集，涵盖广泛的原料和操作条件，以开发对生物质热化学转化过程更具生成性的模型。这可以通过遵循标准化协议创建数据集来实现。首先，必须标准化生物质和操作条件的表征。生物质的组成通常使用元素分析和近似分析进行分析。一些现有研究仅提供了其中一种分析，导致数据集不完整。气体环境（空气、CO₂
    或惰性气体（Ar 或 N₂））的详细信息也应报告，因为它对生物质的热化学转化有显著影响。少数研究未能提供气体环境所需的必要信息。


    其次，建议在数据集中避免使用分类输入变量。在一些研究中，出于方便，将反应器类型、催化剂类型和原料作为分类输入变量包含在内。这种分类变量可以帮助机器学习模型区分不同的反应器，但它们不提供反应器差异程度的信息。理想的机器学习模型应能够以高度准确和精细的粒度预测所有输出变量，区分反应器类型和催化剂类型。使用数值变量定义分类输入变量可以有助于提高机器学习模型的外推能力。流化床和固定床广泛用于生物质热化学转化，这些反应器通常由气体速度和生物质密度表征。如果这些反应器可以用数据集中常见的变量定义，将通过增加可用数据量来提高机器学习模型的性能
    [122]。同样，具有不同热化学转化效应的反应物（例如丙酮或乙醇）也曾作为机器学习建模的分类输入变量使用 [74]。反应物的介电常数可以作为候选输入变量，并显著影响生物质热化学转化中的反应动力学。由于结构难以概括，催化剂和原料通常表示为分类输入变量。图神经网络（GNN）基于图结构数据，因其能够通过概括分子表示来预测各种分子性质而变得流行
    [123]。


    一个分子可以


    表示为拓扑图，其中原子和化学键分别被视为节点和边 [124]。因此，催化剂和原料的原子和键可以在图结构数据中概括，基于它们的 GNN 可以作为减轻分类变量对机器学习建模不利影响的有希望的方法
    [124]。GNN 已用于预测生物柴油燃烧性能 [124]。


    ### 5.2. 机器学习模型与基于理论模型的集成


    将机器学习模型与基于理论的模型相结合可以利用各自的优势 [121]。这种结合的目标通常是提高预测能力。生物质热化学转化过程复杂且尚未完全理解。机器学习与基于理论模型的适当集成对于解决化学和生物复杂性可能有益。Aykol
    等人总结了其他复杂系统的可能集成方法 [98]。在 Aykol 等人 [98] 建议的集成方法中，参数学习可能是最容易实现的集成。在这种集成中，复杂行为，例如反应动力学，可以由数据驱动模型建模，而相对已知的传输现象则由基于理论的模型描述。对于生物质转化，并非所有反应动力学都已理解，但解释实验数据的反应动力学参数可以由机器学习模型预测。使用获得的动力学参数与基于理论的模型或工艺模拟可以提高最终结果的可解释性。此外，GNN
    因其能够捕捉原子间势能或分子结构与性质之间的关系而受到越来越多的关注。将 GNN 应用于考虑生物质结构将有助于各种原料的泛化。例如，热解的反应动力学参数可以用
    GNN 建模，然后动力学参数可用于工艺模拟。有了这样的 GNN 模型，只要新原料的结构能够快速表征，就能更快地设计新生物质的热化学转化工艺。


    另一种集成建模类型是理论约束机器学习，也称为物理引导机器学习建模。一般来说，机器学习模型的损失函数（或误差函数）是目标值与预测值之间平方误差的总和（或平均值）。当物理引导损失项添加到损失函数时，机器学习模型通过减少物理引导损失项来寻找最佳权重和偏差
    [125]。这种物理引导损失项可以涵盖质量或能量守恒等物理定律。在合成气生产的情况下，当实施源自转化过程前后碳平衡的物理引导损失时，生物质转化过程可以用更严格的质量平衡建模。


    第三种是机器学习加速的基于理论建模，其中非线性偏微分方程由机器学习快速求解。这是一个快速增长的领域，已在流体力学和薛定谔方程等多个领域得到应用 [126]。机器学习加速的基于理论建模的优势在于神经网络是通用逼近器并包括自动微分
    [98,127]。因此，神经网络模型可以求解底层非线性偏微分方程，同时满足边界条件和物理定律。在流体动力学中求解偏微分方程对于生物质热化学转化过程也很重要，其中流化床被广泛使用。此外，催化热化学转化涉及复杂的反应动力学。因此，求解传输现象和反应动力学的控制方程可以有助于未来开发更复杂的生物质热化学转化过程的模型。


