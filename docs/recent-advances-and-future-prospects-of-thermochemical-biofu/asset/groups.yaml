    [24]。它们也是现有基于 ML 模型中使用的主要输入变量。当使用相同数据集时，含有元素组成数据的基于 ML 的模型性能优于仅含有近似组成数据的模型 [50]。然而，当两种组成数据均作为输入变量时，基于
    ML 的模型的性能显著提高 [50]。需要注意的是，生物质资源的化学和结构组成取决于原料类型 [51]。在藻类原料的情况下，主要组分为碳水化合物、脂质和蛋白质，而木质纤维素原料的主要组分为半纤维素、木质素和纤维素
