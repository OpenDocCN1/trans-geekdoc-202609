    ## 3.1.4. 预测中输入变量相对重要性的比较


    对 ML 模型预测性能的输入变量相对重要性的比较在表 4 和表 5 中给出。在估计重要性时，输入变量简单地分为原料特性和操作条件，同时剔除了分类变量的重要性。原料特性包括元素组成、元素比、
    proximate 分析以及生物质中木质素、半纤维素和纤维素的比例。操作条件包括除原料特性外的所有输入变量，包括混合比例和颗粒尺寸。如表 4 所示，原料特性对干态条件下合成气组成的贡献在各研究中有所不同：干态条件下原料特性重要性更高和操作条件重要性更高的研究数量为
    9:8，意味着贡献相等。在湿态条件下，操作条件的贡献大于原料特性（表 5）。对于湿态条件下生物炭的产率、组成和热值，原料特性的贡献大于操作条件。同样，原料特性对生物油的产率和组成的贡献较大。在湿态条件下，原料特性重要性更高和操作条件重要性更高的研究数量为
    17:5，意味着原料特性的贡献极高。


    原料特性对 ML 模型的相对重要性的直方图绘制于图 2(a)–(c)。在干态条件下，分布呈左偏，显示出原料特性重要性较低的模型数量较大。然而，在湿态条件下，分布呈右偏，因为原料特性重要性较高的模型数量更多。这可能归因于与干态条件相比，湿态条件包括更广泛的操作条件，例如催化剂和反应物类型。此类操作条件被指定为分类输入变量，但在相对重要性求和过程中其贡献被剔除，导致湿态条件下操作条件的贡献下降。当所有条件的相对重要性被绘制时（图
