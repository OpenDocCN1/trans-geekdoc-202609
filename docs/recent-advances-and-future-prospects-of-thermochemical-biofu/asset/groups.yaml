    # Fig. 1. Classification of ML algorithms.


    This could better indicate how different the predicted values are from the experiment
    on average. In addition, it is also important that the distribution of deviations
    (differences between experiment results and predicted values) should be scattered
    uniformly regardless of the magnitude of the experimental value. Thus, the deviations
    of all experimental values should be investigated rather than specific values.


    Some ML models showed relatively poor correlation (R² < 0.9), implying underfit
    of the models. There are various methods to increase the R² value, and the first
    method is to increase the number of available data. In addition, the selection
    of effective input variables can be another method. Many studies did so, and the
    best combination of input variables for a given system was suggested. It should
    be noted that a high R² value doesn’t assess whether overfitting occurs. Thus,
    methods to prevent overfitting, such as the early stop method or regularization
    method, should be used. Considering these aspects, the detailed procedure for
    the model development is summarized in the following section. The detailed description
    of the configuration of the ML model can help to reproduce the developed ML models,
    and it can be found in the references.


    # 3.1. Fully data-driven ML models


    # 3.1.1. Yield and composition of products under dry conditions


    Generally, the condition of biomass used in thermochemical biofuel conversion
    processes can be divided into dry and wet conditions, depending on whether external
