    The simulation results of 2D CFD for biomass pyrolysis were used to develop a
    ML model [37] where the temperature and x/y coordinates were used as input variables.
    The simulation results at each CFD node were converted to output variables in
    the form of the time-averaged mass fractions of tar, gas, and biomass. Similarly,
    a reaction kinetic model of lignin pyrolysis was used to generate the data required
    for the development of ML models to predict the yield of solid and product gases
    and the distribution of functional groups in tars [69]. These types of ML model
    applications are called the reduced-order model (ROM), and they can be considered
    as the basic version of theory-integrated ML model or sequential integration.
    The benefit of using simulation data is that compared with experimental data,
    an abundant amount of data can be used for model training. Additionally, a certain
    degree of noise can be added to assess the robustness of trained models.


