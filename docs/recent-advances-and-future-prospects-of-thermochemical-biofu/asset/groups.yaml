    ## 3.1.4. Comparison of the relative importance of input variables on prediction


    A comparison of the relative importance of the input variables on the predictive
    performance of ML models is presented in Tables 4 and 5. During the estimation
    of the importance, input variables were simply categorized into feedstock characteristics
    and operating conditions while the importance of categorical variable was eliminated.
    Feedstock characteristics included elemental composition, elemental ratio, proximate
    analysis, and the fraction of lignin, hemicellulose, and cellulose of biomass.
    The operating conditions included all input variables except for the feedstock
    characteristics, including blending ratio and particle size. As shown in Table
    4, the contribution of feedstock characteristics to syngas compositions under
    dry conditions varies across studies: the number of studies with feedstock characteristics
    having higher importance and that with operating conditions was 9:8 under dry
    conditions, implying equal contributions. Under wet conditions, the contribution
    of operating conditions was larger than that of feedstock characteristics (Table
    5). For the yield, composition, and calorific value of biochar under wet conditions,
    the contribution of feedstock characteristics was larger than that of operating
    conditions. Similarly, the contribution of feedstock characteristics to the yield
    and composition of bio-oil was large. The number of studies with feedstock characteristics
    having


    higher importance and that for operating conditions was 17:5 under wet conditions,
    implying an extremely high contribution of the feedstock characteristics.


    The histograms of the relative importance of feedstock characteristics on the
    ML models are plotted in Fig. 2(a)–(c). In the case of dry conditions, the distribution
    was left-skewed, showing that the number of models with low importance of feedstock
    characteristics was large. However, in the case of the wet conditions, the distribution
    was right-skewed as the number of models with a high importance of feedstock characteristics
    was more. This could be attributed to the fact that compared to dry conditions,
    wet conditions include a wide range of operating conditions, such as catalyst
    and reactant types. Such operating conditions were designated as categorical input
    variables, but their contributions were eliminated during the summation of relative
    importance, leading to a decreased contribution of the operating conditions under
    wet conditions. When the relative importance of all conditions was plotted (Fig.
    2(c)), the distribution was right-skewed owing to the larger number of ML models
    under wet conditions.


