    等人开发了一个纳入操作环境（N₂、O₂ 和 CO₂）的模型，并使用 10 种原料的数据集显示出预测生物炭产量的高性能（R² > 0.915）[57]。预测生物炭元素组成和碳含量的模型的性能范围为
    R² = 0.66 [54] 至 R² = 0.8480 [56]。高热值（HHV）是与质量相关的燃料热值 [58]。对于生物炭 HHV 的预测，Onsree
    等人实现了 R² 值为 0.9052 [57]。


    对于单位生物质生物油产量的预测，Ullah 等人的 ML 模型实现了 R² 值为 0.95 [59]。热化学转化过程中产生的液相副产物水产量也由 ML 模型预测
    [60,61]。干条件下生物油组成的 ML 预测尚未见报道，这可能归因于干条件下数据集不足。


    H₂、CO、CO₂ 和 CH₄ 是热化学转化中释放的主要气体物种，其产量通常被视为 ML 模型的输出 [62,63]。Yucel 等人使用不同原料类型的数据集开发了用于预测生物质气化总气体产量和气体组成的
    ML 模型 [63]。总气体产量和 H₂、CO、CO₂ 和 CH₄ 气体组成的性能分别用 R² = 0.86、0.85 表示。Tang 等人开发了一个 ML
    模型来预测 H₂、CO、CO₂ 和 CH₄ 的产量，R² 值为 0.999 [62]。该模型使用相对大量的数据（3831 个数据点）开发，但仅使用了两种原料，意味着需要对其他原料进行进一步验证。Ascher
    等人开发了一个 ML 模型来预测包括 H₂、CO、CO₂、CH₄、N₂ 和 C₂H₄ 在内的多功能气体物种的组成 [50]。该研究还预测了总气体产量、冷气效率和碳转化效率。ML
    模型还被开发用于预测其他输出变量，如总气体产量 [55,60,64]、HHV [63]、低热值（LHV）[50,64]、H₂ 组成 [42]、CO/CO₂
    组成 [60] 和 H₂、CO 和 CH₄ 的最大产量 [27]。此外，合成气中焦油浓度和总焦油产量（每单位生物质质量）也基于 ML 模型的开发进行了预测
    [65]。干热化学转化中副产物的 LHV 预测良好，R² = 0.988 [64]。


    少数研究在干条件下将不同的气体环境作为 ML 模型开发的输入变量。Zhao 等人将气体中 O₂ 组成作为输入变量（预测因子），同时预测了生物炭、沼气、焦油和水的产量
    [60]。Onsree 等人将气体环境中 N₂、CO₂ 和 O₂ 的组成作为输入变量，预测了固体产物的产量和 HHV [57]。用于预测干条件下产品产量和组成的
    ML 模型的总结见表 1。


    如上所述，将近似组成和元素组成同时作为输入变量通常会导致良好的 ML 建模性能。然而，使用了不同形式的基于组成的输入变量。例如，一些研究以比值形式考虑元素组成，如氢/碳比（H/C）和氧/碳比（O/C）。在模型开发过程中测试各种形式的输入变量时，比值形式的性能优于组成本身
    [54]。O/C 比被报道为藻类中碳水化合物、脂质和蛋白质水平的一个良好衡量指标 [72]。生物油的产量主要取决于碳水化合物、脂质和蛋白质的比例，其中脂质是最重要的因素，其次是蛋白质和碳水化合物
    [72,73]。生物质中较低的 H/C 值可能表明木质素比例较大而半纤维素比例较小 [57]。此外，生物炭中的 O/C 和 N/C 比可以作为生物炭极性及其表面性质的指标
    [74]。在木质纤维素生物质的情况下，高 O/C 和 H/C 比意味着半纤维素和纤维素比例高，木质素比例低 [51]。这些研究表明，元素比值可以更好地描述特定的组分（例如木质素或半纤维素），该组分决定了生物质热化学转化的机制。这意味着选择元素比值作为输入变量有利于
    ML 开发。


    因此，建议将描述热化学机制决定因素的组分比值形式应用于 ML 开发。如果这些机制尚不明确，系统性地寻找性能更好的比值形式可能会揭示生物质热化学转化的机制。


    ### 3.1.2. 干条件下的转化动力学和动力学参数


    人工神经网络和随机森林已被广泛应用于预测生物质热化学转化的动力学或动力学参数，如活化能和指前因子。此外，生物质加热时的热重质量损失已广泛使用 ML 模型进行预测。


    生物质组成被用作输入变量来预测干条件下热解的活化能，该活化能基于 Kissinger-Akahira-Sunose、Ozawa-Flynn-Wall 和 Friedman
    等各种估算方法计算 [51]。基于热重分析数据，各种生物质的纤维素、半纤维素和木质素比例已被用于预测反应动力学参数，如指前因子（log k0）、活化能（log
    Ea）和反应级数（log n）[70]。用于预测热解活化能的加热速率也获得了类似的结果 [71]。氩气环境下藻类热解的质量损失时间序列使用加热速率、系统初始温度和目标温度进行预测
    [69]。


    Wei 等人开发了一个 ML 模型来预测生物质和煤炭共燃烧的热重质量损失曲线 [72]。输入变量包括生物质和煤炭的组成及其混合比例以及操作参数，如加热速率和温度。


    输入变量的重要性如下：温度 > 生物质与煤炭的混合比例 > 生物质与煤炭的组成 > 加热速率。用于预测干条件下热化学转化转化动力学和动力学参数的 ML 模型的总结见表
    2。


    ### 3.1.3. 湿条件下产品的产量和组成


    与干条件类似，使用各种 ML 模型对湿条件下生产的固体产物（称为生物炭）的产量、组成和性质进行预测已得到广泛研究。在湿条件下，反应物或水是转化过程的补充因子。少数研究已将反应物信息，如反应物与生物质比（或生物质与反应物比）作为输入变量纳入
    [73–76]。


    尽管这些研究中纳入了生物质与水比作为输入变量 [73,74,77]，但其对产量的重要性被估计为较低。生物炭的组成使用不同的输出变量进行预测，如碳含量（或碳回收率）[44,78,79]、氮含量
    [77]、无机磷含量 [79]、原子比 [73,78] 和固体产物的灰分含量 [73]。Wei 等人预测了反应前后固体产物的 H/C 和 O/C 比以估计产物质量
    [80]。这是基于生物炭的 H/C 和 O/C 比越低，燃烧过程中的能量损失越小这一事实 [81]。使用 ML 模型预测了生物炭的能量回收率和 HHV [44,73,78]。在这些研究中，温度和保留时间通常作为输入变量纳入；然而，使用了不同的生物质特性组合。在液体产物的情况下，开发用于预测生物油产量和组成的
    ML 模型比干条件下投入更大 [44,74,75,82]，以及副产物（水相共产物）[44,74]。预测了生物油的元素组成（C、H、O、N 和 S）[74]，同样也预测了
    C、N 和 O 的具体组成 [44,83]、能量回收率 [44] 和生物油的 HHV [74,75]。当使用包含各种类型反应物和催化剂的数据集开发 ML 模型时，反应物和催化剂的类型被指定为分类输入变量
    [75]。


    使用各种 ML 模型预测了湿条件下产生的具有各种组成和产量的产物气体。所开发模型的输出变量包括总产生气体产量 [38,44,74,83]、H₂、CH₄、CO₂、CO、C₂H₄
    和 C₂H₆ 的产量 [76,84]，以及污染指数（CO₂ + CO）[75]。值得注意的是，大多数 ML 模型包含生物质与水比或生物质与反应物比作为预测因子。生物炭、合成气和焦油的分布被模型很好地预测，性能良好（R²
    > 0.91）[76]。结果表明，生物质特性对预测生物炭生产的影响更为明显，而温度对预测合成气和焦油生产的影响更为明显。此外，反应物与生物质比是合成气中 CO₂
    比例的重要输入变量，但对其他气体不重要 [76]。用于预测湿条件下产品产量和组成的 ML 模型的总结见表 3。


    在湿条件下生物质的热化学转化过程中，生物质中含有氧和氢的官能团通过脱羧和脱水从结构中脱离 [91]。因此，生物炭中 O/C 和 H/C 比的变化分别代表热化学转化过程中脱水和脱羧的程度。Mu
    等人定义了脱羧程度指数（DCD）和脱水程度指数（DHD），它们是反应前后 O/C 和 H/C 比的比值 [73]。指数值越小，热化学转化过程中发生的脱羧和脱水反应越强，固体燃料质量越高
    [73]。这些指数使用 ML 模型进行预测，其中温度是最重要的输入变量。生物质中的 O 含量和灰分含量分别是 DCD 和 DHD 的后续重要因素。使用诸如
    DCD 和 DHD 之类的输出变量进行 ML 建模已被证明为

