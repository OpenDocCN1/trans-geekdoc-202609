    renewable energy systems have received much attention with their high efficiency
    and environmental benefits [128]. Intermittency issues of renewable energy become
    additional consideration for these integrated systems. Thus, the complexity for
    optimization of such integrated systems has increased substantially. Besides being
    able to establish a comprehensive dataset for biomass and respective thermochemical
    processes, the required data set should be expanded towards a much wider parameters
    while responding to the fluctuating energy conditions during the thermochemical
    processes rapidly. The well-developed ML model that approximates the complex function
    can be used as a surrogate model to reduce the computational cost of optimizing
    the whole integrated process. When the optimization of the integrated systems
    is assessed for a given feedstock and renewable energy system, the choice of the
    thermochemical conversion process will be suggested by an advanced ML model. Either
    with various feedstocks blend to tackle the unstable supply of single feedstock
    or alternating between different energy sources. The corresponding operating conditions
    could be suggested by the ML model to produce biofuel stably and efficiently.


    ## 6. Conclusions


    Recent development of ML models for thermochemical biofuel conversion processes
    were reviewed. ML models have been developed to predict the yield and composition
    of biofuel products, as well as reaction kinetics. The predictive performance
    of ML models can be improved by increasing the number of data points, provided
    relevant hyperparameters are set properly. Although many experimental studies
    have been conducted, there is still a barrier attributed to the complex composition
    of biomass, preventing the utilization of all published data. In addition, the
    various types of reactors, catalysts, and reactants prevent the standardization
    of operating conditions and process designs for ML modelling. A comprehensive
    dataset that unifies various biomass characteristics and operating conditions
    and theory-integrated ML models are highly desired and will promote the design
    and optimization of thermochemical conversion processes. Categorical input variables
    were better defined using numerical variables to improve the interpretability
    of input variables.


