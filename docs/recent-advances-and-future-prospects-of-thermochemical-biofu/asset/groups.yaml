    ### 4.1.2. 气态生物燃料


    Masala et al. [107] 在一个孤立岛屿上安装了一台小型厌氧消化器，容量为 2477 t/年，然后分析并优化了三种情景：（i）用于居民区的气体提纯，（ii）用于交通运输区的提纯，（iii）在热电联产厂中的电力生产。Akbulut
    et al. [108] 对土耳其一家小型奶牛场中的沼气生产进行了 TEA。基于运行数据，计算了净现值和能源回收期。此外，还比较了电、热能和 CO2 的年产量。Vo
    et al. [109] 提出了三种沼气提纯情景。消化器和胺洗涤器（情景 1）、洗涤器排放的 CO2 和 H2 的甲烷化（情景 2），以及在没有胺洗涤器的情况下使沼气和氢气反应的生物甲烷化工艺（情景
    3）被建模。对工艺进行了模拟，随后进行了 TEA。第 1、2 和 3 情景的 CH4 成本分别为 0.76、1.50 和 1.43/m3。Rajendran
    和 Murthy [110] 回顾了 TEA 和 LCA 在厌氧消化中的应用。基于使用运行数据的模拟工艺计算了沼气提纯的 TEA 和 LCA。Pääkkönen
    et al. [111] 基于电价波动的情况对电转沼气进行了 TEA。可再生能源（多余电力）用于生产氢气，随后氢气与沼气中的 CO2 反应形成 CH4。使用该工艺，多达
    40% 的电力可以以生物甲烷的形式储存。证实如果电解槽投资成本降低 60–72% 或生产的 CH4 价格提高 20–76%，则可以确保盈利。Ferella
    et al. [112] 对发达市场中的沼气提纯进行了 TEA。维持现有的沼气厂并通过


    引入变压吸附工艺增加生物甲烷的生产，使用内部收益率、净现值和折现现金流等 TEA 指标进行了比较。Lee et al. [113] 基于生物炭进行了生物柴油生产的
    TEA，当折现率为 10% 时，盈亏平衡价格为 $1.55/kg，考虑到碳惩罚和税收减免，与现有工艺相比具有竞争力。


    ## 4.2. 机器学习辅助 TEA


    机器学习技术正被应用于 TEA。Byun et al. [114] 基于若干技术经济参数，使用基于机器学习的预测模型研究了甲醇-蒸汽重整工艺的技术、环境和经济可行性，用于
    H2 生产，如图 5 所示。TEA 分为三个阶段进行如下。（i）包括热力学性质和环境特征的 Aspen Plus®-based 工艺模拟；（ii）用于技术和环境性能的
    MATLAB-based 数值模型；以及（iii）使用 12,000 个数据集训练的基于机器学习的预测模型，其可行性输出为 H2 生产速率、H2 生产成本和
    CO2 排放。


    Cheng 和 Luo [115] 引入机器学习技术对水热液化法生产的藻类生物燃料进行经济评估。用于预测生物原油能量产量的机器学习模型纳入了（i）显示脂质含量与生物质生产率之间相关性的生物质生产率模型，（ii）显示生物质生产率与生物质最低售价之间相关性的生物质生产成本结论模型，以及（iii）生化组成。Olafasakin
    et al. [116] 将机器学习技术应用于生物质热解的 TEA。然而，与上述两项研究不同，使用了 ROM，其中化学反应机理是通过用生物质热解实验的结果进行训练来识别的（见图
    6）。基于获得的 ROM 进行了技术经济分析，其结果为每吨干生物质的生物燃料产量为 65 至 130 加仑，生物燃料最低售价为 $2.62-$5.43/加仑，全球变暖潜势为
    −13.62 至 145 kg CO₂/ MJ。这些结果表明 ROM 可以促进生物炼制系统中的原料快速筛选。


    Vondra et al. [117] 开发了基于机器学习的描述性经济模型来评估沼气厂蒸发系统的经济性，并为决策者提供了一种启发式方法。使用新的技术经济模型，研究了利用沼气厂热电联产装置的废热实施最新真空蒸发系统的经济方面。为了考虑分析的现实世界概率和稳健性，使用蒙特卡洛模拟技术生成了
    >20,000 种不同的蒸发系统实施可能性。随后，通过利用人工神经网络和超优化决策树分类器的新方法选择了有利的决策路径。


