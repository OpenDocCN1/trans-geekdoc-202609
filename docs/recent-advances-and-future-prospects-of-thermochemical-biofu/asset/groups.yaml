    在有限氧气供应条件下将生物质转化为合成气 [4,14,27]。根据气化剂类型、反应条件和所生产合成气质量，可将其分为常规型和水热型 [2,28]。与通常偏好干燥生物质的其他热化学技术不同，水热处理可在合理的能量效率下将湿生物质转化为气体、固体燃料和其他组分。水热处理涉及利用热压水作为反应物生产生物燃料
    [12]。根据温度、压力和转化中间产物的比例，可将其分为水热碳化或水热液化 [29]。这些工艺的设计面临各种挑战，主要是由于其多参数和复杂特性。此外，还应认真考虑催化剂
    [30]，就其基本性质 [31] 而言，这些性质可提高油和气的产率，同时抑制焦炭的生成 [32]。


    典型的热化学转化研究通常需要严格的实验来确定最佳设计和操作 [5,12]。多年来，包括计算流体动力学（CFD）、动力学和热力学模型以及工艺模型在内的新型建模技术已被用于加速工艺优化，同时减少操作时间和成本
    [33–37]。然而，使用这些传统技术的建模有时是不切实际且困难的 [38,39]。这是因为这些模型基于各种假设，要么过于详细，要么过于简化，影响了模型预测的质量和/或导致实施困难
    [40]。此外，这些模型在不同操作条件下难以应用 [35,41]。例如，CFD 耗时且计算成本高，因为它需要大量的处理能力和预定义的特定发动机参数 [36,37]。因此，开发一种准确、非耗时、非计算成本高且稳健的建模方法来模拟这些工艺至关重要。


    机器学习（ML）技术已被证明是研究和理解复杂转化过程的传统建模技术的可靠替代方案。它们可以通过利用输入和输出参数之间的一系列相互联系来建模复杂问题。最近，应用
    ML 方法对热化学生物燃料转化过程进行建模的应用显著增加。应用包括预测产品的产率和组成、动力学参数以及产品的热值。所开发的 ML 模型还被用于确定所需生产的最佳条件。对具有不同量级的输入变量进行预处理或归一化是一种超参数，有助于提高基于机器学习的模型的性能。然而，一些研究并未说明为防止过拟合而采取的措施，而过拟合是模型改进的关键挑战
    [37,42–44]。


    之前的综述总结了生物质转化过程的 ML 应用，其中使用了特定数据集（例如，原料类型和操作条件不多样）。所开发的 ML 模型表现出良好的性能，但 ML 模型的推断或进一步改进受限于转化过程中的变异性，如反应器类型、原料和操作条件。在实际应用中，开发通用
    ML 模型以在不受生物质原料条件影响的情况下稳定生产生物燃料是必要的。作为开发此类通用模型的第一步，本研究比较了数据集维度的变异性以及数据点的数量。还讨论了开发的
    ML 中的预处理和过拟合的可能性。然后，本综述总结了估计单个 ML 模型中输入变量重要性的结果，以便讨论哪些输入变量重要。最后，总结了开发通用 ML 模型的相关挑战，并提出了潜在解决方案和未来研究方向。


    ## 2. 机器学习的总体概述


    机器学习方法可分为监督学习、半监督学习、无监督学习或强化学习。在监督学习方法中，标记的输入和输出数据集用于模型的训练和验证。然后模型学习将输入数据映射到其目标输出
    [45]。监督学习方法可分为回归方法和分类方法。分类方法旨在识别数据集中的行为模式，而回归方法旨在建立输入和输出参数之间的最佳匹配 [46]。


    与监督学习相比，无监督机器学习也称为自组织，最适合无标签数据，并且擅长检测任何可能的隐藏模式。随着输入数据输入无监督 ML 模型，模型会据此寻找并分类数据之间的相似性和差异。无监督
    ML 的示例包括主成分分析、降维和聚类。半监督学习结合了监督学习和无监督学习的优点。它有助于解决监督学习挑战，并且可以处理同时具有无标签和有标签输入的系统
    [45]。值得注意的是，为监督学习标记数据通常困难且耗时。半监督学习可以通过将部分总无标签输入纳入监督学习过程来克服这一缺点 [45,47]。


    ML 算法的最后一类是强化学习，涉及一种称为智能体的学习系统，它通过一系列可能带来奖励或惩罚的行动来理解其环境。积极的行动会产生奖励，而消极的行动会导致惩罚。智能体能够在无需人工干预的情况下更好地理解其环境，其依据是最大化收益并减少惩罚
    [39,48]。一些在科学和工程领域使用的突出 ML 算法，可用于生物质热化学转化过程，已在图 1 中呈现。多种 ML 算法已被用于生物质热化学转化过程的不同方面。最广泛研究的算法是人工神经网络（ANN）。其他不太流行的算法包括决策树、随机森林、支持向量机、深度神经网络和混合智能模型。Umenweke
    等 [2]、Ascher 等 [25]、Ascher 等 [49] 和 Shahbeik 等 [28] 对 ANN 以及该领域各种应用中使用的其他算法进行了简要讨论。关于估计特征重要性的方法的更多解释已添加到补充材料中。


    ## 3. 机器学习（ML）在热化学生物燃料转化过程中的应用


    热化学转化过程将生物质资源转化为氢气、甲烷、沼气、生物油和生物炭等各种生物燃料。为了最大化生物燃料的选择性或产率以及转化效率，各种 ML 方法已被应用于热化学生物燃料转化过程。在应用
    ML 方法之前，需要使用从热化学生物燃料转化过程中获得的测试数据集来评估训练模型的性能。大多数研究使用相关系数（R²）或均方根误差来描述模型的性能，这对于单输出模型来说是足够的。然而，在多输出模型的情况下，模型的性能应考虑每个输出的不同量级，而
    R² 的作用应仅限于评估每个输出的相关性。因此，对于多输出模型，建议使用相对度量，例如平均百分比误差或根相对平方误差，来比较不同模型的平均性能。


    了解 ML 模型的预测可能与实验值产生多大偏差很重要，但在 ML 研究中很少有研究提供相应的产率值。相反，一些研究提供了实验值与预测值之间的平均百分比误差。

