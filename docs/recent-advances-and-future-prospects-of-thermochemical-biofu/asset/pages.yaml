    # 4. Technoeconomic analysis (TEA) assisted by ML modelling


    # 4.1. Technoeconomic analysis for biofuel conversion processes


    Over the past decades, TEA has been regarded as one the most important tools for
    evaluating the economic aspects of chemical processes, including biofuel production
    processes. In addition to energy or exergy analysis and life cycle assessment
    (LCA), the application of TEA has increased exponentially. Classical TEA was performed
    using general-purpose software based on the process design. For the past 20 years,
    TEA has mostly been calculated through correlations with process operation data,
    simulation results using commercial software, and process optimization results.
    Recently, it has evolved to the level of performing TEA directly or indirectly
    by using ML techniques. Research results are beginning to emerge on energy optimization,
    environment, and profitability, and at the same time, integration of data-based
    technology into TEA. Among data-driven technologies, the genetic algorithm has
    been frequently used in TEA linked with process simulation and optimization; however,
    to date big data analysis, ML, ANN, and digital twin are few examples of the direct
    application of ML technologies.


    # 4.1.1. Liquid biofuel


    Marchetti et al. presented various alternatives to replace fossil fuel-based diesel
    fuel production [99]. Because raw materials encompass>80% of the production cost
    of conventional fossil fuels, the development of technologies using low-cost raw
    materials generated in the animal and vegetable oil processing process has been
    proposed and economically evaluated with TEA. Yaashikaa et al. [100] carried out
    an overall review of biodiesel production processes using algae. In particular,
    TEA and LCA were briefly mentioned using the parameters that affect algal growth
    and biodiesel productivity. Kushwaha et al. [101] performed a sustainability assessment
    for algal biodiesel production. Naveenkumar and Baskar [102] produced biodiesel
    from bio-oils by using a Zn-doped CaO-based catalyst. The sustainable biodiesel
    conversion rate was 91.95%, with a green chemistry value of 0.873. Based on the
    experimental and calculation results, TEA of a 21,000 ton/year biodiesel production
    scale plant was performed with an annual biodiesel revenue of $15.2 M$/year and
    a payback period of approximately 1.15 years. Huang et al. [103] presented a process
    for producing biodiesel from vegetable oil, in particular, genetically modified
    lipid-producing sugarcane, and conducted an economic analysis. As the lipid content
    increased from 2% to 20%, the biodiesel production cost decreased from $0.89/L
    to $0.59/L, and the internal rate of return increased from 13.7% to 24.0%. Heo
    et al. [104] compared different technologies of i) catalytic, ii) enzymatic, and
    iii) in situ transesterification to produce microalgal biodiesel. After verifying
    the importance of the process variables through a global sensitivity analysis,
    TEA was performed. The biodiesel production costs were in the order of catalytic
    ($4.77/kg), in situ ($9.92/kg), and enzymatic transesterification ($12.53/kg).
    Apos-tolkou et al. [105] performed TEA on the production of biodiesel - monoalkyl
    esters of long-chain fatty acids obtained from lipid feedstock. After simulating
    the process of transesterification of vegetable oil and animal fat, TEA was performed
    according to the biodiesel production capacity. Bartling et al. [106] developed
    a process to fractionate lignocellulose and converted lignin into a narrow product
    slate using a reductive catalytic fractionation technology. Research has been
    conducted to maximize the profit of high-value-added products by minimizing the
    reaction pressure, reactant loading, and total amount of oil produced by reductive
    catalytic fractionation.


