    # ABSTRACT


    Biofuels have been widely recognized as potential solutions to addressing the
    climate crisis and strengthening energy security and sustainability. However,
    techno-economic and environmental challenges for the production of biofuels remain
    and complicated conversion processes and factors, such as materials and process
    design, need to be taken into consideration for solving the challenges, which
    is not easy. Machine Learning (ML) has been combined with the theories of thermochemical
    biofuel conversion processes to achieve accurate and efficient biofuel process
    modelling. In this review, existing ML applications to predict biofuel yield and
    composition are critically reviewed. The details of the input and output variables
    of the developed models for thermochemical biofuel conversion processes were summarized,
    and their development procedures were compared. Techno-economic analysis results
    incorporating ML applications in biofuels were also reviewed. Although developed
    models in literature showed good performance for their targets, respectively,
    they can hardly be applied to other feedstocks or operating conditions. To overcome
    the challenge and develop universal model, perspective approaches were suggested
    in this study. It was suggested that it is essential to develop systematic datasets
    to support more comprehensive machine learning-based modelling towards practical
    applications. Potential prospective research and development directions on machine
    learning-based thermochemical biofuel conversion process modeling were recommended,
    so that it can assist in the commercialization and optimization of various biofuel
    conversions leading to a sustainable and circular society.


    # 1. Introduction


    The utilization of renewable energy sources, including biomass, has increased
    worldwide to reduce an increase in the amount of greenhouse gases resulting in
    severe environmental challenges [1–3]. Among the various renewable resources,
    biomass including lignocellulosic and municipal wastes is unique in that it has
    been used for a long time, even in conventional energy systems and has received
    considerable interest for a few decades as a reliable alternative to fossil fuel
    [4]. The amount of power generated by biomass combustion reached 750 TWh in 2021,


    and the supply from biomass is expected to increase to 100 EJ by 2050 [5,6]. The
    development of biomass energy conversion processes, based on e.g., biochemical
    and thermochemical methods, has been increasing in recent years owing to their
    low-emission characteristics, among other advantages [5,7,8]. In particular, biofuels
    have the potential to contribute to the United Nations Sustainable Development
    Goals (UNSDGs) by promoting affordable and clean energy (Goal 7), industry, innovation,
    and infrastructure (Goal 9), responsible consumption and production (Goal 12),
    and climate action (Goal 13) [9].


    Biomass conversion processes, either biochemical or thermochemical, allow fuels,
    heat, electricity, and other value-added products to be'
