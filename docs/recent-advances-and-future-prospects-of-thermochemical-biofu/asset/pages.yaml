    Some ML models showed relatively poor correlation (R² < 0.9), implying underfit
    of the models. There are various methods to increase the R² value, and the first
    method is to increase the number of available data. In addition, the selection
    of effective input variables can be another method. Many studies did so, and the
    best combination of input variables for a given system was suggested. It should
    be noted that a high R² value doesn’t assess whether overfitting occurs. Thus,
    methods to prevent overfitting, such as the early stop method or regularization
    method, should be used. Considering these aspects, the detailed procedure for
    the model development is summarized in the following section. The detailed description
    of the configuration of the ML model can help to reproduce the developed ML models,
    and it can be found in the references.


    # 3.1. Fully data-driven ML models


    # 3.1.1. Yield and composition of products under dry conditions


    Generally, the condition of biomass used in thermochemical biofuel conversion
    processes can be divided into dry and wet conditions, depending on whether external
    water is added to the conversion processes. The moisture content of the biomass
    used in those processes was neglected for the classification of the processes.
    The yield and composition of biomass thermochemical conversion products depend
    on feedstock characteristics (e.g., proximate and ultimate compositions) and operating
    conditions, such as temperature, residence time, and heating rate under dry condition
    [24]. They are also the main input variables used in existing ML-based models.
    ML-based models with ultimate composition data showed better performance than
    that with proximate composition data when the same dataset was used in both cases
    [50]. However, the performance of ML-based models was significantly improved when
    both composition data were included as input variables [50]. It should be noted
    that the chemical and structural composition of biomass resources depends on the
    types of feedstocks [51]. In the case of algal feedstock, the major components
    are carbohydrates, lipids, and proteins, whereas those of lignocellulose feedstock


    are hemicellulose, lignin, and cellulose [51–53]. Thus, some studies have also
    included the content of the major components as input variables for ML model development.
    The particle size of the biomass was also used as an input variable [27]. In the
    case of the operating conditions, the temperature, heating rate, retention time,
    and gas velocity were utilized as input variables.


    The yield and composition of products and byproducts are typical output variables
    for ML-based models. The yield can be calculated as the ratio of the target product
    mass to the feedstock mass. When various combinations of input variables were
    tested, a R² value was reached to 0.862[54–56]. Onsree et al. developed a model
    incorporating operating environments (N₂, O₂, and CO₂) and showed high performance
    for predicting biochar yield (R² > 0.915) using datasets with 10 types of feedstocks
    [57]. The performance of models for predicting the elemental composition and carbon
    content of biochar ranged from R² = 0.66 [54] to R² = 0.8480 [56]. A higher heating
    value (HHV) is the calorific value of the fuel associated with quality [58]. For
    the prediction of the HHV of biochar, a R² value of 0.9052 was achieved by Onsree
    et al. [57].


    For predicting the yield of bio-oil per biomass, a R² value of 0.95 was achieved
    by the ML model of Ullah et al. [59]. The yield of water, a liquid-phase byproduct
    produced during thermochemical conversion, was also predicted by ML models [60,61].
    The ML prediction of the composition of bio-oil produced under dry conditions
    is yet to be reported, which might be attributed to the fact that there are insufficient
    datasets in dry conditions.


    H₂, CO, CO₂, and CH₄ are major gas species that evolve from thermochemical conversion
    and their yields have been commonly considered as the outputs of ML models [62,63].
    Yucel et al. used various datasets with different feedstock types to develop ML
    models for predicting the total gas yield and gas composition of biomass gasification
    [63]. The performance for the total gas yield and for the gas compositions of
    H₂, CO, CO₂, and CH₄ were indicated by R² = 0.86, 0.85, respectively. Tang et
    al. developed a ML model to predict the yields of H₂, CO, CO₂, and CH₄ with an
    R² value of 0.999 [62]. The model was developed using a relatively large amount
    of data (3831 data points), but only two feedstocks were used, implying the necessity
    for further validation of other feedstocks. Ascher et al. developed a ML model
    to predict the composition of versatile gas species, including H₂, CO, CO₂, CH₄,
    N₂, and C₂H₄ [50]. The total gas yield, cold gas efficiency, and carbon conversion
    efficiency were also predicted in this study. ML models have also been developed
    to predict other output variables such'
