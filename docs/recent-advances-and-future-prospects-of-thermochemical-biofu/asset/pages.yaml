    # 4.1.2. Gaseous biofuel


    Masala et al. [107] installed a small-scale anaerobic digester with a capacity
    of 2477 t/year on an isolated island, and then analyzed and optimized three scenarios:
    (i) gas upgrading for the residential sector, (ii) upgrading for the transport
    sector, and (iii) electricity production in a combined heat and power plant. Akbulut
    et al. [108] performed TEA on biogas production in a small dairy farm in Turkey.
    Based on the operation data, net present value and energetic payback time were
    calculated. Additionally, the annual amounts of electricity, thermal energy, and
    CO2 were compared. Vo et al. [109] presented three biogas-upgrading scenarios.
    The digester and amine scrubber (scenario 1), methanation of CO2 and H2 discharged
    from the scrubber (scenario 2), and bio-methanation process that reacted biogas
    and hydrogen without an amine scrubber (scenario 3) were modeled. The process
    was simulated, and TEA was subsequently performed. The CH4 costs for Scenarios
    1, 2, and 3 were 0.76, 1.50, and 1.43/m3, respectively. Rajendran and Murthy [110]
    reviewed the use of TEA and LCA for anaerobic digestion. The TEAs and LCAs for
    biogas upgrading were calculated based on simulated processes using operational
    data. Pääkkönen et al. [111] performed TEA for power to biogas based on the case
    in which the electricity price fluctuated. Renewable energy (excess electricity)
    is used to produce hydrogen, which then forms CH4 by reacting with the CO2 in
    biogas. Using this process, up to 40% of electricity can be stored as biomethane.
    It was confirmed that profitability can be secured if the electrolyzer investment
    cost is reduced by 60–72% or the price of CH4 produced is increased by 20–76%.
    Ferella et al. [112] performed TEA for upgrading biogas in the developed market.
    Maintaining the existing biogas plant and increasing the production of biomethane
    by


    introducing the pressure swing adsorption process were compared using TEA indicators
    such as internal rate of return, net present value, and discounted cash flow.
    Lee et al. [113] performed a TEA for biodiesel production based on biochar, and
    when the discount rate was 10%, the breakeven price was $1.55/kg, which is competitive
    with the existing process considering the carbon penalty and tax exemption.


