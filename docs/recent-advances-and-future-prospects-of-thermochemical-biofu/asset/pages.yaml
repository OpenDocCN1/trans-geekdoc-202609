    produced. The biochemical conversion process utilizes bacteria, enzymes, and microorganisms
    to break down biomass into fuel and other products [10–12]. The main drawback
    of biochemical processes is their low reaction rate, owing to which hours, days,
    or weeks are usually required to complete the necessary reactions. In contrast,
    thermochemical conversion processes rather utilize thermal energy sources and
    chemical reactions to decompose biomass into various products [13–15]. Compared
    to biochemical processes, thermochemical processes are relatively fast, as reactions
    can occur within a few minutes or even seconds. They are also suitable for wider
    ranges of feedstocks [16].


    Thermochemical conversion has been the most widely used method owing to its advantages
    and high conversion efficiency [2,12]. They can


    be grouped into torrefaction [17], pyrolysis [18,19], gasification [20], and hydrothermal
    treatments [21]. Torrefaction is conducted at low temperatures (<320 °C) under
    the absence of oxygen or partial oxidizing gas in order to upgrade the fuel characteristics
    [17]. Pyrolysis is the thermal treatment of biomass under an inert environment
    to produce liquid biofuels, gases, and solid residues. Depending on the heating
    rate and residence time, pyrolysis is generally divided into slow, fast, and flash
    pyrolysis [22,23]. The efficacy and quality of pyrolysis products greatly depend
    on the heating rate, temperature, feedstock particle size, residence time, and
    moisture content [24,25]. Pretreatment of feedstock also plays a role in the process,
    as depicted by the increasing pyrolytic gas yield with HCl pretreatment [26].
    Gasification involves the'
