    in Table 1.


    As mentioned above, the inclusion of both proximate and ultimate compositions
    as input variables usually led to good ML modelling performance. However, different
    forms of composition-based input variables were utilized. For example, some studies
    consider ultimate composition in as ratio form, such as the hydrogen/carbon ratio
    (H/C) and oxygen/carbon ratio (O/C). When various forms of input variables were
    tested during model development, the performance in the ratio form was better
    than that of the composition itself [54]. The O/C ratio is reported to be a good
    measure of carbohydrate, lipid, and protein levels in algae [72]. The yield of
    bio-oil mainly depends on the fraction of carbohydrates, lipids, and proteins,
    with lipids as the most significant factor, followed by proteins and carbohydrates
    [72,73]. A low H/C value in biomass could indicate a large fraction of lignin
    and a small fraction of hemicellulose [57]. In addition, the O/C and N/C ratios
    in biochar could be indicators of the polarity of biochar, as well as its surface
    properties [74]. In the case of lignocellulose biomass, high O/C and H/C ratios
    imply high fractions of hemicellulose and cellulose and low lignin fractions [51].
    These studies have shown that the ratio of elements can better describe specific
    component (e.g., lignin or hemicellulose), which determines the mechanism of thermochemical
    conversion of biomass. This implies that choosing the elemental ratios as input
    variables can be beneficial for ML development.


    Hence, it is recommended that the component ratio form that describes the determining
    factor of thermochemical mechanism is applied for ML development. If such mechanisms
    are not well known, a systematic search for a ratio form with better performance
    might shed light on the thermochemical conversion mechanism of biomass.


    # 3.1.2. Conversion kinetics and kinetic parameters under dry conditions


    Artificial neural networks and random forest have been widely applied to predict
    the kinetics or kinetic parameters such as the activation energy and pre-exponential
    factor of the thermochemical conversion of biomass. In addition, thermal gravimetric
    mass loss of biomass upon heating has been widely predicted using ML models.


    Biomass composition was used as an input variable to predict the activation energy
    of pyrolysis under dry conditions, which was calculated based on various estimation
    methods such as Kissinger-Akahira-Sunose, Ozawa-Flynn-Wall, and Friedman methods)
    [51]. Based on the data of thermogravimetric analysis, the fractions of cellulose,
    hemicellulose, and lignin of various biomass have been used to predict the reaction
    kinetic parameters, such as the pre-exponential factor (log k0), activation energy
    (log Ea), and reaction order (log n) [70]. Similar results were obtained for the
    heating rate used to predict the activation energy of pyrolysis [71]. The time
    series of mass loss upon algal pyrolysis in an argon environment was predicted
    using the heating rate, initial temperature, and target temperature of the system
    [69].


    Wei et al. developed a ML model to predict the thermal gravimetric mass-loss curve
    for the co-combustion of biomass and coal [72]. The input variables included the
    composition of biomass and coal and their blending ratio and operating parameters,
    such as heating rate and temperature.


    The importance of the input variables was as follows: temperature > blending ratio
    of biomass and coal > composition of biomass and coal > heating rate. A summary
    of the ML models for predicting the conversion kinetics and kinetic parameters
    of thermochemical conversion under dry conditions is presented in Table 2.


    # 3.1.3. Yield and composition of products under wet conditions


    Similar to dry conditions, the prediction of the yield, composition, and properties
    of solid products (called biochar) produced under wet conditions has been widely
    studied using various ML models. Under wet conditions, the reactant or water is
    the supplementary factor for the conversion process. A few studies have included
    reactant information, such as reactant-to-biomass ratio (or biomass-to-reactant
    ratio), as input variables [73–76].


    Although the biomass-to-water ratio was included as an input variable in these
    studies [73,74,77], its importance to yield was estimated to be low. The composition
    of biochar was predicted with diverse output variables, such as carbon content
    (or carbon recovery) [44,78,79], nitrogen content [77], inorganic phosphorus content
    [79], atomic ratios [73,78], and ash content of the solid product [73]. Wei et
    al. predicted the H/C and O/C ratios of solid products before and after the reaction
    to estimate the product quality [80]. This was based on the fact that energy loss
    during combustion was lower for the biochar with lower H/C and O/C ratios [81].
    The energy recovery and HHV of biochar were predicted using ML models [44,73,78].
    In these studies, temperature and retention time were commonly included as input
    variables; however, different combinations of biomass characteristics were used.
    In the case of liquid products, higher efforts than under dry conditions are involved
    in developing ML models for the prediction of yield and composition of bio-oil
    [44,74,75,82] and byproducts (aqueous co-product) [44,74]. The elemental composition
    of the bio-oil (C, H, O, N, and S) was predicted [74], and the same was true for
    the specific composition of C, N, and O [44,83], energy recovery [44] and HHV
    [74,75] of the bio-oil. When a dataset with various types of reactants and catalysts
    was used to develop ML models, the types of reactants and catalysts were designated
    as categorical input variables [75].


    Product gases with various compositions and yields produced under wet conditions
    were predicted using various ML models. The output variables of the developed
    models included the yield of total produced gas [38,44,74,83], the yield of H2,
    CH4, CO2, CO, C2H4, and C2H6 [76,84], and the pollution index (CO2 + CO) [75].
    Notably, most ML models include biomass-to-water or biomass-to-reactant ratios
    as predictors. The distributions of biochar, syngas, and tar were well predicted
    by the models with good performance (R2 > 0.91) [76]. It was shown that the effect
    of biomass characteristics was more pronounced for predicting biochar production,
    whereas temperature was more pronounced for predicting syngas and tar production.
    In addition, the reactant-to-biomass ratio is an important input variable for
    the CO2 fraction in syngas, but not for other gases [76]. A summary of the ML
    models for predicting the yield and composition of products under wet conditions
    is presented in Table 3.


    Functional groups containing oxygen and hydrogen in biomass are detached from
    the structure through decarboxylation and dehydration during the thermochemical
    conversion of mass under wet conditions [91]. Thus, the changes in the O/C and
    H/C ratios in biochar can represent the extent of dehydration and decarboxylation
    during thermochemical conversion, respectively. Mu et al. defined indices for
    the decarboxylation degree (DCD) and dehydration degree (DHD), which are the ratios
    of O/C and H/C ratios before and after the reaction [73]. The smaller the value
    of the indices, the stronger the decarboxylation and dehydration reactions that
    occur during thermochemical conversion, and and the higher quality of solid fuel
