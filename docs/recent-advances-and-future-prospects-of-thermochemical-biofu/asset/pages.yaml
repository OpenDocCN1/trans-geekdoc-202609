  md: '# 5. Challenges and prospects


    Although applications of the ML models for thermochemical biofuel conversion prediction
    have been extensively explored, these studies are still incapable of extending
    towards actual implementation and plant-scale optimization. Various reviews have
    emphasized the importance of datasets and theory-integrated ML models in improving
    the ML models for practical applications. In the case of datasets, the importance
    of training with small datasets, multi-view data, uncertainty quantification,
    and data quality has been emphasized [118,119]. Although multi-view data include
    more comprehensive information for ML modelling [118], it could deteriorate the
    training procedure owing to the increased complexity of model structure. However,
    this can be overcome by using the compact architecture of ML model. It was shown
    that the compact form of neural network provided the best performance without
    increasing the number of neurons or complexity [120]. In addition, most studies
    used the composition of biomass that was summed up to 100%. Because there is an
    intercorrelation between compositions (or input variables), balance-related issues
    and the usage of independently measured compositions should be explored further
    [55]. The important aspects of data collection will be discussed in the following
    section. Theory-integrated ML models are growing in diverse fields because of
    their greater extrapolability and interpretability [121]. However, their application
    in biomass thermochemical conversion is still limited. In the next section, the
    possible integration of theory-based and ML models for predicting thermochemical
    conversion of biomass will be discussed.


    # 5.1. Comprehensive data set


    More comprehensive datasets should be created covering a wide range of feedstocks
    and operating conditions for developing models that are more generative to thermochemical
    conversion process of biomass. This can be achieved by creating a dataset following
    a standardized protocol. First, the characterization of biomass and operating
    conditions must be standardized. The composition of biomass is commonly analyzed
    using ultimate and proximate analyses. Some existing studies only provided one
    of these analyses, resulting in an incomplete dataset. Details of gas environment
    (air, CO₂, or inert gases (Ar or N₂)) should also be reported because of its significant
    influences towards the thermochemical conversion of biomass. A few studies have
    failed to provide necessary information on the gas environment.


    Second, it is recommended to avoid using categorical input variables in the dataset.
    In some studies, the reactor type, catalyst type, and feedstock were included
    as categorical input variables for convenience. Such categorical variables can
    help ML models distinguish between different reactors, but they do not provide
    information about the extent to which the reactors differ. An ideal ML model should
    be able to predict all the output variables, differentiating reactor types and
    catalyst types to great accuracy and granularity. Defining categorical input variables
    using numerical variables can contribute to the improvement of the extrapolation
    of ML models. Fluidized and fixed beds are widely used for biomass thermochemical
    conversion and these reactors are commonly characterized by gas velocity and biomass
    density. If these reactors can be defined with common variables in a dataset,
    it will improve the performance of ML model by increasing the amount of available
    data [122]. Similarly, reactants (e.g., acetone or ethanol) with different effects
    on thermochemical conversion have also used as categorical input variables for
    ML modelling [74]. The dielectric constant of the reactants can be a candidate
    input variable and significantly influences the reaction kinetics in the thermochemical
    conversion of biomass. Because of the difficulty in generalizing their structures,
    both the catalyst and feedstock were normally represented as categorical input
    variables. The graph neural network (GNN) is based on graph-structure data, and
    it has become popular because it can predict various molecular properties by generalizing
    molecular representation [123].


    A molecule can be


    represented as a topological graph where atoms and chemical bonds are considered
    nodes and edges, respectively [124]. Thus, atoms and bonds of catalysts and feedstocks
    can be generalized in graph-structure data, and GNN based on them can serve as
    a promising method for mitigating the adverse impact of categorical variables
    on ML modelling [124]. The GNN has been used to predict biodiesel combustion performance
    [124].


    # 5.2. Integration of ML models with theory-based models


    Combining ML models with a theory-based model can leverage their respective advantages
    [121]. The objective of this combination is usually to improve the predictive
    capability. Biomass thermochemical conversion processes are complicated and not
    fully understood. The proper integration of ML and theory-based models could be
    beneficial for solving chemical and biological complexity. Aykol et al. summarized
    possible integration methods for other complicated systems [98]. Among the integration
    method suggested by Aykol et al. [98], parameter learning can be the one easily
    implementable. In such integration, complex behavior, such as reaction kinetics,
    can be modeled by a data-driven model, whereas relatively well-known transport
    phenomena are described by a theory-based model. For biomass conversion, not all
    reaction kinetics are understood, but the reaction kinetic parameters that explain
    the experimental data can be predicted by ML models. The utilization of the obtained
    kinetic parameters with a theory-based model or process simulation can improve
    the interpretability of the final result. In addition, GNNs have received increasing
    attention owing to their ability to capture interatomic potential or the relationship
    between molecular structure and properties. The application of GNN to account
    for biomass structures would contribute to the generalization of various feedstocks.
    For example, the reaction kinetic parameters of pyrolysis could be modeled with
    GNN, and the kinetic parameters can be then utilized for process simulation. With
    such a GNN model, faster design of the thermochemical conversion process of new
    biomass can be achieved given the structure of the new feedstock can be rapidly
    characterized.


    Another type of integrated modelling is theory-constrained ML, which is also known
    as physics-guided ML modelling. In general, the loss function (or error function)
    of a ML model is the summation (or mean) of the squared error between the target
    and prediction values. When a physics-guided loss term is added to the loss function,
    the ML model attempts to find the optimal weights and biases by reducing the physics-guided
    loss term [125]. Such physics-guided loss terms can encompass physics laws such
    as mass or energy conservation. In the case of syngas production, when physics-guided
    loss originating from the carbon balance before and after the conversion process
    is implemented, the biomass conversion process can be modelled with more rigorous
    mass balance.


    The third is ML-accelerated theory-based modeling, in which nonlinear partial
    differential equations are rapidly solved by ML. This is a rapidly growing area,
    and there have been applications in diverse fields such as fluid mechanics and
    Schrodinger''s equation [126]. The strength of the ML-accelerated theory-based
    modeling is based on the fact that a neural network is a universal approximator
    and includes automatic differentiation [98,127]. Thus, the neural network model
    can solve the underlying nonlinear partial differential equation, simultaneously
    satisfying the boundary conditions and physics laws. Solving partial differential
    equations in fluid dynamics is also important for the biomass thermochemical conversion
    process, in which a fluidized bed is widely utilized. In addition, thermochemical
    conversion via catalysis involves complex reaction kinetics. Thus, solving the
    governing equations of transport phenomena and reaction kinetics could contribute
    to the development of models for more sophisticated biomass thermochemical conversion
    processes in the future.


    # 5.3. Integration of ML models with renewable energy aided systems


    Integration of thermochemical bio-fuel conversion process with'
