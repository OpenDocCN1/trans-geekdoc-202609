    # Unsolved Problems


    Here are some problems that we’ve attempted but we’re not close to perfect at
    all:


    ## Machine Conversations


    We have apps like `Siri` and `Cortana` where you can say simple phrases to command
    the computer to do something, and that’s actually a very hard problem. There is
    an extra stage here in addition to just text processing, which is that it has
    to translate your voice into a string of words. To use Geoff Hinton’s favorite
    example, “recognize speech” sounds almost the same as “wreck a nice beach” - but
    using probabilistic analysis we can conclude that “recognize speech” is more likely.


    And it’s even harder for a computer to extract meaning from what you say, and
    respond with something meaningful in return. You may have heard of something called
    the “Turing test”, which is a test that will be passed when humans are unable
    to detect whether they are having a conversation with a human or a machine.


    Recently, Microsoft released a bot on Twitter called “Tay”, who was supposed to
    have the personality of a teenaged girl. Instead, she was manipulated by other
    Twitter users and eventually became a racist neo-Nazi.


    ## Paraphrasing and Summarization


    Pretend you work for a news company and everyday people write new articles for
    your site. You’d like to have little boxes on your home page that put up a nice
    picture and a little blurb of text that represent the article - how can you summarize
    the article correctly into a few sentences? If you’ve ever used Pinterest, you’d
    see that they get this wrong pretty often.


    # Interesting New Progress - word2vec


    `word2vec` is the application of neural networks to learn vector representations
    of words. It has performed very well and can learn relationships such as the famous:


    > “woman” + “king” - “man” = “queen”


    It shows us that we can extract an underlying meaning of concepts and relationships
    from language.


    In fact, that’s what they are working on at Google - to create things called “thought
    vectors”, where actual ideas can be represented in a vector space.


    So I hope this gives you a sense of the wide variety of very real and very useful
    applications that NLP can be used for.


    # Why is NLP Hard?


    Because language is ambiguous!


    You may have heard the phrase that math is the universal language. This is true
    because math is precise. In language, you have synonyms (two words that mean the
    same thing), and you have homonyms (two words that sound the same or are spelled
    the same that mean different things).


    ## Examples of Ambiguity


    **“Republicans Grill IRS Chief Over Lost Emails”**


    This type of sentence has great possibilities because of its two different interpretations:


    * Republicans harshly question the chief about the emails

    * Republicans cook the chief using email as the fuel


    **“I saw a man on a hill with a telescope.”**


    It seems like a simple statement, until you begin to unpack the many alternate
    meanings:


    * There’s a man on a hill, and I’m watching him with my telescope.

    * There’s a man on a hill, who I’m seeing, and he has a telescope.

    * There’s a man, and he’s on a hill that also has a telescope on it.

