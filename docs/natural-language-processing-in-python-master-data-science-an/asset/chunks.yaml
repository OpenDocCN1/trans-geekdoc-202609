- raw: 'Notice that we can use the draw() method to display a tree instead of viewing
    the result as text.


    ￼![Screen Shot 2016-05-17 at 8.25.07 PM.png](Images/00001.jpeg)


    So named entity recognition can tell you which parts of a sentence are people.


    Let’s try another one.


    nltk.ne\_chunk(nltk.pos\_tag("Steve Jobs was the CEO of Apple Corp.".split())).draw()


    This returns:


    \[(''Steve'', ''NNP''),


    (''Jobs'', ''NNP''),


    (''was'', ''VBD''),


    (''the'', ''DT''),


    (''CEO'', ''NNP''),


    (''of'', ''IN''),


    (''Apple'', ''NNP''),


    (''Corp.'', ''NNP'')\]


    So NER thinks the abbreviation CEO is an organization, which of course it’s not.
    Just goes to show that NLP isn’t perfect just yet.


    One question you might have is, “what is all this stuff useful for?”


    A lot of times, we want to draw relationships between the items in a sentence.


    So if one noun is performing some action on another noun, that is a special relationship
    that is not captured by bag-of-words.


    As you can imagine, this might be a useful feature for a machine learning algorithm.


    Remember from our previous chapters - the algorithms are only about as powerful
    as the features we give it.


    I’ve worked on many interesting projects that involved using these features of
    NLP.


    For instance, perhaps your supervisor comes to you one day and says he needs a
    list of every corporation working on artificial intelligence. All you have is
    data from the web.


    Well, you could just look through every web page manually and write down each
    corporation that shows up after reading each page very carefully.


    Of course, that would take you a very long time.


    Alternatively, you could instead scrape each web page, extract the text data,
    and filter the pages for the term “artificial intelligence” and any synonym of
    that, like “machine learning”.


    Next, you could use named entity recognition to extract all the corporations from
    the filtered text. Voila! You have a list of corporations that are involved with
    AI.


    # Chapter 6: Latent Semantic Analysis


    What is latent semantic analysis (also known as “latent semantic indexing”)?


    Previously we solved some problems where we turned words into counts, and we said
    if this word shows up a lot for spam or for negative sentiment, then that means
    that word was associated with that label.


    But what if you have multiple words with the same meaning? Or what if you have
    one word that can have multiple different meanings?


    Then we have a problem! These two problems are called synonymy and polysemy.


    Some examples from Wikipedia:


    Synonyms:


    “buy” and “purchase”


    “big” and “large”


    “quick” and “speedy”


    Polysemes:


    “Man” - as in human as opposed to animal, or as in male as opposed to female,
    or just in the casual sense, “hey man!”


    “Milk” - as in the verb “I’m going to milk it for all it’s worth”, or as in “the
    cat is producing milk for its babies”


    So one way you might solve this problem is to combine words with similar meanings.
    So for example, you’ll probably see the terms “computer”, “desktop”, and “PC”
    together very often. That means they are highly correlated.


    You can think of a sort of “latent variable” or hidden variable that represents
    all of them - hence the term latent semantic analysis.


    The job of LSA is to find these variables and transform the original data into
    these new variables - and hopefully the dimensionality of this new data is much
    smaller than the original - which allows us to speed up our computations.


    It’s important to note that LSA definitely helps solve the synonymy problem by
    combining correlated variables, but I’ve seen conflicting viewpoints of whether
    or not it really helps with polysemy.


    In the next section we’re going to talk about the underlying mathematics behind
    LSA, and then we’ll look at a real-world example.


    PCA and SVD Recap


    LSA is basically the application of SVD to a term-document matrix. PCA is a simpler
    form of SVD so we’ll cover that first to get an intuition.


    SVD = singular value decomposition


    PCA = principal components analysis


    I want to stress that this is optional and is only for people who want to understand
    the math behind LSA. It’s not necessary to do the coding part, since that will
    just be interpreting the answer that LSA gives us.


    Let’s look first at PCA, and let’s talk in general terms about what it does. At
    its most basic it does a transformation on all our input vectors, z = Qx. This
    is a matrix multiplication, and you know that when you multiply a vector by a
    scalar it gives us another vector in the same direction, but if you multiply a
    vector by a matrix you could possibly get a vector in a different direction. So
    PCA rotates our original input vectors, or another way of thinking of it is that
    it’s the same vectors in a different, rotated coordinate system.


    PCA does 3 things for us:


    1) It decorrelates all of our data. So our data in the new coordinate system has
    0 correlation between any 2 input features.


    2) It orders each new dimension in decreasing order by its information content.
    So the first dimension carries the most information, the second dimension carries
    less than the first but more than the third, and so on.


    3) It allows us to reduce the dimensionality of our data. So if our original vocabulary
    was 1000 words, we might find that when we join all the words by how often they
    co-occur in each document, maybe the total number of distinct “latent” terms is
    only 100. This is a direct consequence of #2, since you can cut off any higher
    dimensions if they contain say, less than 5% of the total information.


    Note that by removing information, you’re not always reducing predictive ability.
    One perspective of PCA is that it does “denoising”. With NLP where the vocabulary
    size is large, noise is quite prevalent, so by doing this smoothing or denoising,
    we can actually generalize better when we look at new data.


    These 3 ideas give us a big hint about what we need to do here. The central item
    in all these ideas is the covariance matrix. The diagonals of a covariance matrix
    tell us the variance of that dimension, and the off-diagonals tell us how correlated
    2 different dimensions are with each other.


    Recall that for most classical statistical methods, we consider more variance
    to be synonymous with more information. As a corollary to this, think of a variable
    that’s completely deterministic to contain 0 information. Why? Because, if we
    already can predict this variable exactly, then measuring it won’t tell us anything
    new, since we already knew the answer we would get!


    The covariance is defined as:


    C(i,j) = E\[(X\_i - mu(i))(X\_j - mu(j))\]


    Where mu(i) is the mean of X\_i (the ith feature of X).


    If i = j you see that this is just the sample variance.


    The sample covariance is then:


    C(i,j) = sum\[n=1..N\]{ (X\[n,i\] - mu\[i\])(X\[n,j\] - mu\[j\]) } / N


    A more convenient form of this equation is the matrix notation - the matrix “X
    transpose” times “X” divided by “N”. Notice that we’ve dropped the means since
    we can center the data before doing any processing.


    C = X^T X / N


    You can convince yourself this is correct since “X transpose” is D x N and “X”
    is N x D, so the result is D x D.


    Ok, so now we have this D x D covariance matrix, what do we do with it? We find
    its eigenvalues and eigenvectors of course!


    Cq = lambda q


    It turns out there are exactly D eigenvectors and D eigenvalues. We put them both
    into matrices by putting the eigenvalues into a diagonal matrix called “big lambda”
    and we stack the eigenvectors into a matrix called “Q”, which we saw earlier.
    We will sort the eigenvalues and corresponding eigenvectors in descending order.


    In matrix form this would be:


    CQ = Q Lambda


    We can prove that Big Lambda is actually just the covariance of the transformed
    data. Since all the off-diagonals are 0, being that it’s a diagonal matrix, that
    means the transformed data is completely decorrelated.'
