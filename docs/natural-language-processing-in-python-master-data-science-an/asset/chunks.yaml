  trans: "\n\n# 文章重写器\n\n我们如何建模给定周围单词时某个单词的概率？假设我们获取整个文档并标记所有单词，从而得到 `w(1), …, w(N)`。\n\
    \n然后我们可以建模任意单词 `w(i)` 在给定所有其他周围单词条件下的概率。\n\n用概率符号表示为：\n\n`P(w(i) | w(1), ... ,\
    \ w(i-1), w(i+1), … w(N))`\n\n当然，这实际上行不通，因为如果我们考虑文档中的每一个单词，那么只有该文档本身才能完全匹配（即样本量为\
    \ 1），所以我们将采用类似马尔可夫模型的方法，只考虑最近的单词。\n\n我们将使用一种称为三元组的方法来实现这一点。基本上我们将创建三元组，存储 3 个连续单词的组合。我们将使用前一个单词和后一个单词来预测当前单词。\n\
    \n在数学上，这意味着我们将建模：\n\n`P(w(i) | w(i-1), w(i+1))`\n\n为了实现这一点，我们将创建一个字典，以 `(w(i-1),\
    \ w(i+1))` 作为键，并随机采样 `w(i)`。\n\n当然，我们不会替换文档中的每一个单词，因为那可能不会给我们带来任何有用的结果，所以我们将根据某个较小的概率来决定是否替换某个单词。\n\
    \n这和潜在语义分析都是我们所谓的“无监督学习”算法，因为它们没有标签，我们只是学习结构。相比之下，我们的垃圾邮件分类器和情感分析器是“监督学习”问题，因为我们有标签可供匹配。\n\
    \n## 文章重写器代码\n\n在这个代码示例中，我们将重用我们的亚马逊评论数据。\n\n```python\nimport nltk\nimport random\n\
    import numpy as np\nfrom bs4 import BeautifulSoup\n\npositive_reviews = BeautifulSoup(\n\
    \    open(\n        'electronics/positive.review'\n    ).read())\npositive_reviews\
    \ = positive_reviews.findAll('review_text')\n```\n\n这一次，我们只看正面评论。\n\n接下来，我们提取三元组。键将是首尾单词。值将是可能的中间单词数组。\n\
    \n```python\ntrigrams = {}\n\nfor review in positive_reviews:\n    s = review.text.lower()\n\
    \    tokens = nltk.tokenize.word_tokenize(s)\n    for i in xrange(len(tokens)\
    \ - 2):\n        k = (tokens[i], tokens[i+2])\n        if k not in trigrams:\n\
    \            trigrams[k] = []\n        trigrams[k].append(tokens[i+1])\n```\n\n\
    接下来，我们要将每个中间单词数组转换为概率向量。\n\n```python\ntrigram_probabilities = {}\n\nfor k, words\
    \ in trigrams.iteritems():\n    # 创建一个单词 -> 计数的字典\n    if len(set(words)) > 1:\n\
    \        # 只有当中间单词有不同可能性时才执行此操作\n        d = {}\n        n = 0\n        for w\
    \ in words:\n            if w not in d:\n                d[w] = 0\n          \
    \  d[w] += 1\n            n += 1\n        for w, c in d.iteritems():\n       \
    \     d[w] = float(c) / n\n        trigram_probabilities[k] = d\n```\n\n这意味着如果可能的中间单词是\
    \ `[\"cat\", \"cat\", \"dog\"]`，那么我们现在将得到一个字典 `{\"cat\": 0.67, \"dog\": 0.33}`。\n\
    \n因此，如果我们遇到上下文提供了这些可能性的情况，那么我们将以 2/3 的概率插入“cat”作为中间单词，以 1/3 的概率插入“dog”。\n\n接下来，我们将创建一种从字典中随机采样的方法。\n\
    \n```python\ndef random_sample(d):\n    # 从字典中选择一个随机样本，其中值为概率\n    r = random.random()\n\
    \    cumulative = 0\n    for w, p in d.iteritems():\n        cumulative += p\n\
    \        if r < cumulative:\n            return w\n```\n\n最后，让我们编写一个函数来测试重写器。\n\
    \n```python\ndef test_spinner():\n    review = random.choice(positive_reviews)\n\
    \    s = review.text.lower()\n    print \"Original:\", s\n    tokens = nltk.tokenize.word_tokenize(s)\n\
    \    for i in xrange(len(tokens) - 2):\n        if random.random() < 0.2: # 20%\
    \ 替换几率\n            k = (tokens[i], tokens[i+2])\n            if k in trigram_probabilities:\n\
    \                w = random_sample(trigram_probabilities[k])\n               \
    \ tokens[i+1] = w\n    print \"Spun:\"\n    print \" \".join(tokens).replace(\"\
    \ .\", \".\").replace(\" '\", \"'\").replace(\" ,\", \",\").replace(\"$ \", \"\
    $\").replace(\" !\", \"!\")\n```\n\n最后一行替换了我注意到总是出现在奇怪位置的一些标点符号。或者，你也可以像前几章那样使用自定义分词器来替换标点符号。\n\
    \n以下是一些示例输出：\n\n**原文：**\n\n> i downloaded the driver from trendnet's website before\
    \ installing the adapter. i did not encounter any problems at all, including the\
    \ issue that some users had with it disconnecting when they plugged in another\
    \ usb device\n\n**重写后：**\n\n> i downloaded the driver from trendnet's limits before\
    \ installing the adapter. i did not encounter any problems at all, including the\
    \ issue that new users had with it disconnecting when they plugged in another\
    \ usb device\n\n**另一个。**\n\n**原文：**\n\n> the reason it is not rated 5 stars is\
    \ that the ink supply is utilized too rapidly and the expensive cartriges have\
    \ to replaced too frequently\n\n**重写后：**\n\n> the reason it does not afford 5\
    \ stars is that the ink supply is utilized too rapidly and the expensive cartriges\
    \ have to use too frequently\n\n自己试试看还能得到什么结果。\n\n你可以看到很多结果相当滑稽。这绝对表明应该有比仅检查两个相邻单词更多的上下文检查。\n\
    \n这告诉我们关于类“马尔可夫”假设的什么？它不成立！\n\n这可能只是构建一个真正优秀的文章重写器所需工作的 5%。\n\n请注意，这绝非易事。快速谷歌搜索显示，即使是顶级结果也远称不上是好的产品。\n\
    \n# 结语\n\n我真心希望阅读这本书给你带来的乐趣，不亚于我制作它时的乐趣。\n\n你有没有发现什么困惑的地方？有什么问题吗？\n\n我随时可以提供帮助。只需发邮件至：info@lazyprogrammer.me\n\
    \n想了解更多关于数据科学和机器学习的知识吗？也许在线课程更适合你。我恰好在 Udemy 上有几门课程。\n\n深度学习和神经网络的背景及先修知识可以在我的课程“Data\
    \ Science: Deep Learning in Python”（正式称为系列的“第 1 部分”）中找到。在该课程中，我教你神经网络的前向传播机制（本书假设你已知晓），以及如何推导称为反向传播的训练算法（本书也假设你已知晓）：\n\
    \n[Data Science: Deep Learning in Python](https://udemy.com/data-science-deep-learning-in-python)\n\
    \n[`udemy.com/data-science-deep-learning-in-python`](https://udemy.com/data-science-deep-learning-in-python)\n\
