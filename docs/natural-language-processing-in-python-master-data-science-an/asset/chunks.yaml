    # Chapter 5: Exploration of NLTK


    In the previous chapter I gave you a preview of NLTK. You’ve already seen the
    tokenize function and the lemmatizer - so you already know how NLTK can be useful.


    “NLTK” is the natural language toolkit. It’s a library that encapsulates a lot
    of NLP tasks for you so that you don’t have to write them yourself. In these lectures
    we’re going to take a look at a few of them, just to give you a taste, and maybe
    give you some ideas for how it could be used in your own projects.


    The first thing we’ll look at is “parts of speech” or POS tagging. It’ll be pretty
    obvious what it does when you see it, as opposed to me just trying to explain
    it abstractly, so let’s just go into the code now.


    If you haven’t installed NLTK already, you can just do “sudo pip install nltk”
    in your command line.


    Note that for some of these examples, NLTK might give you a message about some
    resource not being found. They tell you what that resource is, and instructions
    for how to download it - so that’s just nltk.download() in the console - you choose
    what they asked you to download, and then the thing you were trying to do before,
    should now work.


    POS tag example:


    nltk.pos\_tag("Machine learning is great".split())


    \[(''Machine'', ''NN''), (''learning'', ''NN''), (''is'', ''VBZ''), (''great'',
    ''JJ'')\]


    What you see here is that the POS tagger tells us what role each word has in the
    sentence. It’s saying that “machine” is a noun, “learning” is a noun, “is” is
    a verb in the 3rd person present form, and “great” is an adjective.


    For a full list of what these abbreviations mean, go to: [https://www.ling.upenn.edu/courses/Fall\_2003/ling001/penn\_treebank\_pos.html](https://www.ling.upenn.edu/courses/Fall_2003/ling001/penn_treebank_pos.html)


    The next thing we’re going to look at is “stemming” and “lemmatization”. We already
    used this in our sentiment analyzer.


    The basic idea for both of these is that we want to reduce a word to its base
    form. So if it’s plural like “dogs”, it would be reduced to “dog”. “Jumping” would
    be reduced to “jump”, and so on.


    This can be useful if you’re trying to create a bag of words, but you want to
    reduce the variations on each word since “dogs” and “dog” both essentially have
    the same meaning.


    So what’s the difference between stemming and lemmatization?


    Think of stemming as a more “basic” or “crude” version of this task - sometimes
    it just chops off the ends of words to give you the base form. Let’s do an example.


    from nltk.stem.porter import PorterStemmer


    porter\_stemmer = PorterStemmer()


    porter\_stemmer.stem(‘wolves’)


    Output: ‘wolv’


    vs.


    from nltk.stem import WordNetLemmatizer


    wordnet\_lemmatizer = WordNetLemmatizer()


    wordnet\_lemmatizer.lemmatize("wolves")


    Output: ‘wolf’


    So you see that stemming is more crude in the sense that it can return things
    that are not even real words. This may or may not be an issue in your system,
    that is up to you to decide. Experiment and see which one is faster.


    Something we talked about briefly in our intro was named entity recognition or
    NER.


    Here are some examples of that in NLTK.


