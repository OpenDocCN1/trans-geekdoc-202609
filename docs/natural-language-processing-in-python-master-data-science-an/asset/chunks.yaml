- raw: 'And since we are free to sort the eigenvalues in any order we wish, we can
    ensure that the largest eigenvalues come first - keeping in mind that the eigenvalues
    are just the variances of the transformed data.


    If you want to go more in depth and actually derive all the math, I would recommend
    checking out my FREE tutorial on this - you can find it at [http://lazyprogrammer.me/tutorial-principal-components-analysis-pca/](http://lazyprogrammer.me/tutorial-principal-components-analysis-pca/)


    Usually in NLP we create what are called “term-document” matrices. You can think
    of each term as each input dimension, and each document as each sample. Note that
    this is reversed from what we usually work with, where the samples go along the
    rows and the input features go along the columns.


    What we just did with PCA was combine similar terms. But what if we wanted to
    combine similar documents?


    Well, then we could just do PCA after transposing the original matrix! One weird
    thing that happens is that even though we get an N x N covariance matrix, there
    are still only D eigenvalues. Not only that, but remarkably, they are the same
    eigenvalues that we find from the other covariance matrix!


    Now that you know that PCA finds correlations between the input features, and
    PCA on the transposed data finds correlations between the input samples, we are
    ready to talk about SVD.


    It turns out, SVD just does both PCAs at the same time.


    So what we do is this. We find the eigenvectors of X X^T, and call that U.


    Then we find the eigenvectors of X^T X, and call that V.


    Remember we lined up these eigenvectors so that the corresponding eigenvalues
    would be in descending order. In SVD, we actually take the square root of the
    eigenvalues and put them into a matrix called S.


    Once we do all this, then we can relate X, U, S, and V as:


    X = USV^T


    This is what we mean by “decomposition” in the term “singular value decomposition”.


    Using LSA in your code


    For this example we’re going to look at a dataset consisting of book titles.


    Remember that you can get all this code, including the data, from my Github: [https://github.com/lazyprogrammer/machine\_learning\_examples/tree/master/nlp\_class](https://github.com/lazyprogrammer/machine_learning_examples/tree/master/nlp_class)


    import nltk


    import numpy as np


    import matplotlib.pyplot as plt


    from nltk.stem import WordNetLemmatizer


    from sklearn.decomposition import TruncatedSVD


    wordnet\_lemmatizer = WordNetLemmatizer()


    titles = \[line.rstrip() for line in open(‘all\_book\_titles.txt'')\]


    All similar to what we’ve seen already.


    In this next step, I’m adding a few more stopwords to the original list of stopwords,
    because I noticed them when I tried the example myself. A lot of them are book
    title-related, which is why they were probably not included in this list originally.


    stopwords = set(w.rstrip() for w in open(''stopwords.txt''))


    \# add more stopwords specific to this problem


    stopwords = stopwords.union({


    ''introduction'', ''edition'', ''series'', ''application'',


    ''approach'', ''card'', ''access'', ''package'', ''plus'', ''etext'',


    ''brief'', ''vol'', ''fundamental'', ''guide'', ''essential'', ''printed'',


    ''third'', ''second'', ''fourth'', })


    Next, we again define a tokenizer.


    def my\_tokenizer(s):


    s = s.lower() # downcase


    tokens = nltk.tokenize.word\_tokenize(s) # split string into words (tokens)


    tokens = \[t for t in tokens if len(t) > 2\] # remove short words, they''re probably
    not useful


    tokens = \[wordnet\_lemmatizer.lemmatize(t) for t in tokens\] # put words into
    base form


    tokens = \[t for t in tokens if t not in stopwords\] # remove stopwords


    tokens = \[t for t in tokens if not any(c.isdigit() for c in t)\] # remove any
    digits, i.e. "3rd edition"


    return tokens


    Notice the one extra step here - if a token contains a digit, I throw it out.


    We again create a word index mapping:


    word\_index\_map = {}


    current\_index = 0


    all\_tokens = \[\]


    all\_titles = \[\]


    index\_word\_map = \[\]


    for title in titles:


    try:


    title = title.encode(''ascii'', ''ignore'') # this will throw exception if bad
    characters


    all\_titles.append(title)


    tokens = my\_tokenizer(title)


    all\_tokens.append(tokens)


    for token in tokens:


    if token not in word\_index\_map:


    word\_index\_map\[token\] = current\_index


    current\_index += 1


    index\_word\_map.append(token)


    except:


    pass


    There were some bad characters in the dataset I downloaded, so we will just ignore
    those lines.


    We again define a function to turn our tokens into a feature vector:


    def tokens\_to\_vector(tokens):


    x = np.zeros(len(word\_index\_map))


    for t in tokens:


    i = word\_index\_map\[t\]


    x\[i\] = 1


    return x


    Notice how in this example we have no label. PCA and SVD are unsupervised algorithms.
    They are for learning the structure of the data, not making predictions.


    Next, we create the data matrix.


    N = len(all\_tokens)


    D = len(word\_index\_map)


    X = np.zeros((D, N)) # terms will go along rows, documents along columns


    i = 0


    for tokens in all\_tokens:


    X\[:,i\] = tokens\_to\_vector(tokens)


    i += 1


    Notice how here we diverge from our normal N x D matrix and instead create a D
    x N matrix of data.


    Finally, we use SVD to create a scatterplot of the data (equivalent to reducing
    the dimensionality to 2 dimensions), and annotate each point with the corresponding
    word.


    svd = TruncatedSVD()


    Z = svd.fit\_transform(X)


    plt.scatter(Z\[:,0\], Z\[:,1\])


    for i in xrange(D):


    plt.annotate(s=index\_word\_map\[i\], xy=(Z\[i,0\], Z\[i,1\]))


    plt.show()


    Try this on your own and look for patterns. I noticed that the sciences and the
    arts were split along 2 orthogonal axes.


    So on one axes you should have things like biology, business, economics, neuroscience,
    etc.


    On the other axes you should have things like religion, philosophy, literature,
    etc.


    # Chapter 7: Build your own article spinner


    Article spinning is somewhat of a holy grail in Internet marketing. Why? Internet
    entrepreneurs often like to automate as much of their business as possible. They
    only have so much time in a day, so in order to scale, they have to find ways
    for computers to do work for them.


    One of the most time-consuming tasks is content generation. Ideally, humans would
    create content, like how I created this book. Back in the old days, people would
    just repeat a keyword 1000 times on their web pages in order to rank higher in
    search engines. Eventually search engines caught onto this. Then marketers started
    to outright steal content from others and put it on their own site. But you can
    see how a search engine, which wants to provide the most useful results for its
    users, would not want that to happen, because as a result, if you searched for
    something, you’d just end up with multiple copies of the same thing. So nowadays
    duplicate content is banned. Search engines are evolving every day, and the only
    way to keep up is to have unique, quality content.


    One thing Internet marketers have always been interested in is article spinning.
    That’s essentially taking an existing article that’s very popular, and modifying
    certain words or phrases so that it doesn’t exactly match the original, which
    then prevents the search engines from marking it as duplicate content.


    How do you do this? Well you can imagine that synonyms play a big role. If you
    just replaced certain words with other words that meant the same thing, you’d
    end up with a different article with the same meaning.


    Of course things don’t always work that well in reality.


    Let’s take Udemy’s description of itself for example:


    “Udemy.com is a platform or marketplace for online learning.”


    Now let’s replace each of the bolded words with synonyms I found at thesaurus.com.


    “Udemy.com is a podium or forum for online research.”


    You can see that this new sentence doesn’t make much sense.


    With sentences and full documents, context is important. So the idea is you want
    to use the surrounding words to influence the replacement of the current word.'
