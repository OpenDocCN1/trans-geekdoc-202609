  trans: "\n\n由于我们可以按任意顺序对特征值进行排序，因此我们可以确保最大的特征值排在前面——请记住，特征值就是变换后数据的方差。\n\n如果你想更深入地了解并实际推导所有数学细节，我建议查看我的免费教程——你可以在\
    \ [`lazyprogrammer.me/tutorial-principal-components-analysis-pca/`](http://lazyprogrammer.me/tutorial-principal-components-analysis-pca/)\
    \ 找到它。\n\n通常在 NLP 中，我们会创建所谓的“词-文档”矩阵。你可以把每个词看作每个输入维度，把每个文档看作每个样本。请注意，这与我们通常处理的方式相反，通常样本沿行排列，输入特征沿列排列。\n\
    \n我们刚才用 PCA 所做的就是合并相似的词。但如果我们想合并相似的文档呢？\n\n那么，我们只需在转置原始矩阵后进行 PCA 即可！会发生一件奇怪的事：即使我们得到了一个\
    \ `N x N` 的协方差矩阵，仍然只有 `D` 个特征值。不仅如此，令人惊讶的是，它们与从另一个协方差矩阵中找到的特征值竟然是相同的！\n\n现在你知道\
    \ PCA 能发现输入特征之间的相关性，而对转置数据进行 PCA 能发现输入样本之间的相关性，我们已经准备好来谈论 SVD 了。\n\n结果表明，SVD 只是同时完成这两个\
    \ PCA。\n\n所以我们的做法是：我们找到 `X X^T` 的特征向量，称之为 `U`。\n\n然后我们找到 `X^T X` 的特征向量，称之为 `V`。\n\
    \n请记住，我们排列这些特征向量，使得对应的特征值按降序排列。在 SVD 中，我们实际上取特征值的平方根，并将它们放入一个称为 `S` 的矩阵中。\n\n\
    一旦完成所有这些步骤，我们就可以将 `X`、`U`、`S` 和 `V` 联系起来：\n\n`X = USV^T`\n\n这就是“奇异值分解”中“分解”的含义。\n\
    \n# 在代码中使用 LSA\n\n在这个例子中，我们将查看一个由书名组成的数据集。\n\n请记住，你可以从我的 Github 获取所有这些代码，包括数据：[`github.com/lazyprogrammer/machine_learning_examples/tree/master/nlp_class`](https://github.com/lazyprogrammer/machine_learning_examples/tree/master/nlp_class)\n\
    \n```\nimport nltk\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom\
    \ nltk.stem import WordNetLemmatizer\nfrom sklearn.decomposition import TruncatedSVD\n\
    ```\n\n`wordnet_lemmatizer = WordNetLemmatizer()`\n\n`titles = [line.rstrip()\
    \ for line in open(‘all_book_titles.txt’)]`\n\n一切都与我们之前见过的相似。\n\n在下一步中，我向原始停用词列表添加了几个更多的停用词，因为我在亲自尝试示例时注意到了它们。其中很多与书名相关，这可能就是为什么它们最初未被包含在该列表中的原因。\n\
    \n```\nstopwords = set(w.rstrip() for w in open('stopwords.txt'))\n\n# add more\
    \ stopwords specific to this problem\nstopwords = stopwords.union({\n    'introduction',\
    \ 'edition', 'series', 'application',\n    'approach', 'card', 'access', 'package',\
    \ 'plus', 'etext',\n    'brief', 'vol', 'fundamental', 'guide', 'essential', 'printed',\n\
    \    'third', 'second', 'fourth', })\n```\n\n接下来，我们再次定义一个分词器。\n\n```\ndef my_tokenizer(s):\n\
    \    s = s.lower() # downcase\n    tokens = nltk.tokenize.word_tokenize(s) # split\
    \ string into words (tokens)\n    tokens = [t for t in tokens if len(t) > 2] #\
    \ remove short words, they're probably not useful\n    tokens = [wordnet_lemmatizer.lemmatize(t)\
    \ for t in tokens] # put words into base form\n    tokens = [t for t in tokens\
    \ if t not in stopwords] # remove stopwords\n    tokens = [t for t in tokens if\
    \ not any(c.isdigit() for c in t)] # remove any digits, i.e. \"3rd edition\"\n\
    \    return tokens\n```\n\n请注意这里多了一个额外步骤——如果一个词元包含数字，我就将其丢弃。\n\n我们再次创建一个词到索引的映射：\n\
    \n```\nword_index_map = {}\ncurrent_index = 0\nall_tokens = []\nall_titles = []\n\
    index_word_map = []\n\nfor title in titles:\n    try:\n        title = title.encode('ascii',\
    \ 'ignore') # this will throw exception if bad characters\n        all_titles.append(title)\n\
    \        tokens = my_tokenizer(title)\n        all_tokens.append(tokens)\n   \
    \     for token in tokens:\n            if token not in word_index_map:\n    \
    \            word_index_map[token] = current_index\n                current_index\
    \ += 1\n        index_word_map.append(token)\n    except:\n        pass\n```\n\
    \n我下载的数据集中有一些坏字符，所以我们将直接忽略那些行。\n\n我们再次定义一个函数将词元转换为特征向量：\n\n```\ndef tokens_to_vector(tokens):\n\
    \    x = np.zeros(len(word_index_map))\n    for t in tokens:\n        i = word_index_map[t]\n\
    \        x[i] = 1\n    return x\n```\n\n请注意，在这个例子中我们没有标签。PCA 和 SVD 是无监督算法。它们用于学习数据的结构，而不是进行预测。\n\
    \n接下来，我们创建数据矩阵。\n\n```\nN = len(all_tokens)\nD = len(word_index_map)\nX = np.zeros((D,\
    \ N)) # terms will go along rows, documents along columns\ni = 0\nfor tokens in\
    \ all_tokens:\n    X[:,i] = tokens_to_vector(tokens)\n    i += 1\n```\n\n请注意，这里我们偏离了正常的\
    \ `N x D` 矩阵，转而创建一个 `D x N` 的数据矩阵。\n\n最后，我们使用 SVD 创建数据的散点图（相当于将维度降低到 2 维），并用相应的词标注每个点。\n\
    \n```\nsvd = TruncatedSVD()\nZ = svd.fit_transform(X)\nplt.scatter(Z[:,0], Z[:,1])\n\
    for i in xrange(D):\n    plt.annotate(s=index_word_map[i], xy=(Z[i,0], Z[i,1]))\n\
    plt.show()\n```\n\n亲自试试并寻找模式。我注意到科学和艺术沿着两个正交轴分开了。\n\n所以在一个轴上你应该会有生物学、商业、经济学、神经科学等。\n\
    \n在另一个轴上你应该会有宗教、哲学、文学等。\n\n# 第 7 章：构建你自己的文章重写器\n\n文章重写是在互联网营销中某种程度上的“圣杯”。为什么？互联网企业家通常喜欢尽可能自动化他们的业务。他们一天只有那么多时间，所以为了扩大规模，他们必须找到让计算机为他们工作的方法。\n\
    \n最耗时的任务之一是内容生成。理想情况下，人类会创建内容，就像我创建这本书一样。在早期，人们只是在网页上重复关键词 1000 次，以便在搜索引擎中获得更高的排名。最终搜索引擎识破了这一点。然后营销人员开始直接窃取他人的内容并放在自己的网站上。但你可以看出，搜索引擎旨在为用户提供最有用的结果，它不希望发生这种情况，因为结果是，如果你搜索某样东西，你最终只会得到多份相同的东西。所以现在重复内容被禁止了。搜索引擎每天都在进化，跟上它们的唯一途径就是拥有独特、高质量的内容。\n\
    \n互联网营销人员一直感兴趣的一件事是文章重写。本质上就是获取一篇非常流行的现有文章，并修改某些词或短语，使其不完全匹配原文，从而防止搜索引擎将其标记为重复内容。\n\
    \n如何做到这一点？你可以想象同义词扮演了重要角色。如果你只是用意思相同的其他词替换某些词，你最终会得到一篇含义相同但不同的文章。\n\n当然，现实中事情并不总是那么顺利。\n\
    \n让我们以 Udemy 对自己的描述为例：\n\n“Udemy.com is a platform or marketplace for online learning.”\n\
    \n现在让我们用我在 thesaurus.com 找到的同义词替换每个**加粗的词**。\n\n“Udemy.com is a podium or forum\
    \ for online research.”\n\n你可以看到这个新句子讲不太通。\n\n对于句子和完整文档，上下文很重要。所以思路是你想利用周围的词来影响当前词的替换。\n\
    \n"
