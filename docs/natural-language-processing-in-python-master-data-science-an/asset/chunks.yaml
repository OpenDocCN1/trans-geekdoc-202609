    # Chapter 2: Common NLP Operations


    In this chapter we are going to talk about some common data pre-processing operations
    we do on text data, so that it “fits” with typical machine learning algorithms
    like `Naive Bayes`, `Decision Trees`, `Logistic Regression`, and so on.


    The main idea is that all these algorithms work on vectors of numbers, which is
    definitely not what text is.


    So how do we turn text into vectors of numbers?


    ## Bag of Words


    The simplest way to convert text to numbers is the “bag of words” technique. This
    means there is no order to the words. It’s just saying “here are the words in
    this document”.


    The simplest way to do this is to have a vector that just tells us, “yes this
    word is there”, or “no this word is not there”.


    For example, if we wanted to represent a sentence “Dog eat dog” - and my vocabulary
    consists of the words:


    * Cat

    * Dog

    * Fish

    * Rabbit

    * Eat


    Then my vector representation would be `(0, 1, 0, 0, 1)`.


    Notice what happened here. I assigned a word to each location in the vector.


    The 0th position is “cat”, the 1st position is “dog”, the 2nd position is “fish”,
    and so on.


    This technique is also known as “one-hot encoding”, and is used generally when
    you have categorical variables in data science and machine learning.


    We do this for the same reason we do in NLP - categories aren’t numbers, and we
    need to turn them into numbers.


    You may also have come across this idea by the name of “indicator” variables.
    Same thing.


    ## Word Frequency


    Notice that we lose data when we use indicator variables, because it doesn’t tell
    us how often a word showed up, just whether it did or not.


    You can imagine that if the words “Einstein” and “physics” show up frequently
    in a document, it’s probably a document about physics and Albert Einstein. However,
    if you see Einstein just once, it might not have anything to do with Albert Einstein
    and physics, because someone could just be saying something like, “Nice one, Einstein”
    sarcastically.


    In this case, “dog eat dog” becomes:


    `(0, 2, 0, 0, 1)`


    With many machine learning algorithms, we like our data to be normalized first.
    Sometimes this means subtracting the mean and dividing by the standard deviation,
    sometimes it means transforming all the values so that they are between 0 and
    1.


    With NLP, it’s the latter, since a negative frequency on a word wouldn’t make
    much sense anyway.


    In this case, “dog eat dog” becomes:


    `(0, 0.67, 0, 0, 0.33)`


    ## TF-IDF


    Word frequency is still not perfect.


    Think about words like “the”, “is”, and “it”.


    These are common words that will probably show up in every document. Being so
    common, they tell you almost nothing about what the document is actually about.
    i.e. If I tell you the word “the” shows up 500 times, could you predict the topic
    of the document?


    TF-IDF is a technique that mitigates this problem.


    TF stands for “term frequency”, and IDF stands for “inverse document frequency”.


    You can tell by the above definitions that this measure will be larger when a
    term shows up more often, and it will be smaller if it shows up in a wide variety
    of documents.


    We usually don’t use the raw counts to measure these, but rather we take the `log()`.


    There is no “official”, set way to do this.


    The `TF(t, d)` part can be calculated as follows:


    * **Binary**: 0, 1 indicator (as discussed above)

    * **Raw frequency**: `f(t, d) = number of times term t shows up in document d`

    * **Log normalized**: `log(1 + f(t, d))`


    The inverse document frequency also has a few variations, most of which use the
    `log()` function.


    * **Regular IDF**: `log(N / n(t))`, where `n(t)` is the number of documents that
    contain term `t`

    * **Smoothed IDF**: `log(1 + N/n(t))`

    * **Probabilistic IDF**: `log((N - n(t)) / n(t))`


