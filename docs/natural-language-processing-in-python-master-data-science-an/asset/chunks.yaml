    \       print word, weight\n```\n\n我们选择 0.5 作为阈值（即绝对值小于 0.5 的权重被视为中性）。以下是我发现的一些有趣结果：\n\
    \n| 单词 | 权重 |\n| :--- | :--- |\n| easy | 0.919927614044 |\n| time | -0.600961986429\
    \ |\n| love | 0.615388184001 |\n| returned | -0.542160355628 |\n| cable | 0.525780463192\
    \ |\n| waste | -0.5615910491 |\n| card | -0.623082827818 |\n| price | 1.79091994573\
    \ |\n| return | -0.622817513478 |\n| you | 0.752460553703 |\n| look | 0.509584059602\
    \ |\n| quality | 0.976849032448 |\n| speaker | 0.553046521681 |\n| recommend |\
    \ 0.540623118612 |\n| item | -0.636201081354 |\n| little | 0.532198613503 |\n\
    | sound | 0.577221784706 |\n| n't | -1.42002037539 |\n| buy | -0.513862313368\
    \ |\n| excellent | 1.08015208784 |\n| memory | 0.565900106762 |\n| fast | 0.503794112607\
    \ |\n\n令人鼓舞的是，这些结果大多非常合理！事实上，“讲得通”是对算法进行合理性检查的好方法。\n\n# 第 5 章：NLTK 探索\n\n在上一章中，我向您预览了\
    \ `NLTK`。您已经看到了 `tokenize` 函数和 `lemmatizer` —— 所以您已经知道 `NLTK` 如何发挥作用。\n\n“NLTK”\
    \ 是自然语言工具包。它是一个封装了大量 NLP 任务的库，这样您就不必自己编写它们。在本系列讲座中，我们将了解其中的一些功能，让您有个大概的了解，并可能为您自己的项目提供一些思路。\n\
    \n## 词性标注\n\n我们要看的第一件事是“词性标注”或 POS tagging。当您看到它的实际效果时，它的作用将非常明显，而不是我试图抽象地解释它，所以让我们直接进入代码。\n\
    \n如果您尚未安装 `NLTK`，可以在命令行中执行 `sudo pip install nltk`。\n\n请注意，对于其中一些示例，`NLTK` 可能会提示找不到某些资源。它会告诉您该资源是什么，以及如何下载它的说明\
    \ —— 只需在控制台运行 `nltk.download()`，选择它要求您下载的内容，然后您之前尝试做的事情现在应该可以工作了。\n\n**POS 标注示例：**\n\
    \n```python\nnltk.pos_tag(\"Machine learning is great\".split())\n```\n\n输出：\n\
    \n```text\n[('Machine', 'NN'), ('learning', 'NN'), ('is', 'VBZ'), ('great', 'JJ')]\n\
    ```\n\n在这里，您可以看到 POS 标注器告诉我们句子中每个单词的角色。它表明 \"machine\" 是名词，\"learning\" 是名词，\"\
    is\" 是第三人称现在时动词，\"great\" 是形容词。\n\n有关这些缩写含义的完整列表，请访问：[`www.ling.upenn.edu/courses/Fall_2003/ling001/penn_treebank_pos.html`](https://www.ling.upenn.edu/courses/Fall_2003/ling001/penn_treebank_pos.html)\n\
    \n## 词干提取与词形还原\n\n接下来我们要看的是“词干提取”和“词形还原”。我们在情感分析器中已经使用过它们了。\n\n两者的基本思想都是将单词还原为其基本形式。因此，如果是复数如\
    \ \"dogs\"，它会还原为 \"dog\"。\"Jumping\" 会还原为 \"jump\"，以此类推。\n\n如果您试图创建词袋模型，但希望减少每个单词的变体（因为\
    \ \"dogs\" 和 \"dog\" 本质上具有相同的含义），这会很有用。\n\n那么，词干提取和词形还原有什么区别呢？\n\n可以将词干提取视为该任务的一个更“基本”或“粗糙”的版本\
    \ —— 有时它只是切掉单词的结尾以给出基本形式。让我们做个例子。\n\n```python\nfrom nltk.stem.porter import PorterStemmer\n\
    \nporter_stemmer = PorterStemmer()\nporter_stemmer.stem('wolves')\n```\n\n输出：`'wolv'`\n\
    \n对比：\n\n```python\nfrom nltk.stem import WordNetLemmatizer\n\nwordnet_lemmatizer\
    \ = WordNetLemmatizer()\nwordnet_lemmatizer.lemmatize(\"wolves\")\n```\n\n输出：`'wolf'`\n\
    \n因此，您可以看到词干提取更粗糙，因为它可能返回甚至不是真实单词的内容。这在您的系统中可能是个问题，也可能不是，这取决于您的决定。请实验并查看哪个更快。\n\
    \n## 命名实体识别\n\n我们在简介中简要讨论过命名实体识别（NER）。\n\n以下是 `NLTK` 中的一些示例。\n\n```python\nnltk.ne_chunk(nltk.pos_tag(\"\
    Albert Einstein was born on March 14, 1879.\".split())).draw()\n```\n"
