    # Chapter 4: Build your own sentiment analysis tool


    In this chapter I’m going to introduce you to sentiment analysis. Sentiment is
    the measure of how positive or negative something is. This is immediately applicable
    to Amazon reviews, Tweets, Yelp reviews, hotel reviews, and so on.


    We would like to know - is this statement positive or negative, given just the
    words?


    We’re going to build a very simple sentiment analyzer in this book, and in this
    section I want to go into some of the details of how we’re going to build it before
    we start to write the code. You’ll see that there are a lot of subtleties that
    could become big issues should we choose to address them.


    First, let’s look at the dataset we’re going to use. It can be found at this URL:
    [https://www.cs.jhu.edu/~mdredze/datasets/sentiment/index2.html](https://www.cs.jhu.edu/~mdredze/datasets/sentiment/index2.html)


    The author has been kind enough to label the data for us, so we can use that knowledge
    to our advantage. These are Amazon reviews, which come with 5 star ratings, and
    we’re going to look at the electronics category.


    First, there’s the issue of what are we trying to predict? We could use the 5
    star reviews as our target and try to do a regression on them. Instead we’re going
    to make the problem a little simpler - and just use the fact that they’ve already
    been classified as positive or negative.


    Data is in XML - so we’ll use an XML parser


    We’ll ignore all the extra data and just use the text inside the key “review\_text”.


    To create our feature vector, we’ll do the same thing as the first data set we
    worked with - count up the number of occurrences of each word and divide it by
    the total number of words.


    For that to work, we’ll have to make 2 passes through the data - one to collect
    the total number of distinct words so that we’ll know the size of our feature
    vector, and possibly remove stopwords like numbers and “this”, “is”, “I”, “to”,
    etc. to reduce the vocabulary size. This is so we will know the index of each
    token.


    The 2nd pass will be to actually assign each data vector.


    Notice that this is a lot more work than our spam detection example, because that
    work was already done for us before we downloaded the data.


    Once we have that, it’s simply a matter of creating a classifier like the one
    we made for our spam detector!


    If we use a model like logistic regression - we could look at the weights of our
    learned model to get a “score” for each individual input word. That will tell
