- raw: 'Since there are more positive reviews than negative reviews, we’ll simply
    just take a sample of the positive reviews so that we have balanced classes. For
    some classifiers this is not a problem, but let’s be safe and do it anyway.


    Next, we’ll define a function to turn each review into a list of words or tokens.
    This doesn’t means just calling string.split(). What if we have “Dog” and “dog”?
    These are the same word. NLTK includes its own tokenization function, so we can
    use that here.


    def my\_tokenizer(s):


    s = s.lower() # downcase


    tokens = nltk.tokenize.word\_tokenize(s) # split string into words (tokens)


