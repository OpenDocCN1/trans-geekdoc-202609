- raw: 'In most machine learning problems we often see that the data matrix X is defined
    such that each row is a sample, and each column is an input feature.


    Therefore, we have an N x D matrix X where there are N samples and D features.


    In NLP, you often see the reverse, where the matrix X is organized such that each
    column is a sample and each row is a feature.


    This is just a matter of convention.


    You will see that when we do singular value decomposition, it’s actually like
    doing 2 PCAs, one on the DxD covariance matrix of X, and one on the NxN covariance
    matrix of X transposed.


    # Chapter 3: Build your own spam detector


    Data description


    In this chapter we are going to build our own “spam detector”.


    We’re going to look at a publicly available pre-preprocessed dataset that you
    can find here: [https://archive.ics.uci.edu/ml/datasets/Spambase](https://archive.ics.uci.edu/ml/datasets/Spambase)


    There are 2 important things I want you to take away from this example:


    1) A lot of the time what we’re doing in NLP is pre-processing data for use in
    existing algorithms. So what’s involved here is - how do we take a bunch of documents,
    which are basically just blocks of text - and feed them into other machine learning
    algorithms, where the input is usually a vector of numbers?


    Note that we covered this in the last chapter, so all there really is to do now
    is plug-n-chug into an ML library.


    2) We can use almost ANY existing ML classifier for this problem. So you can take
    all the knowledge you’ve gained from other statistics and machine learning classes,
    and add a little bit of text processing and take into account the subtleties of
    language, and you’re more or less doing NLP.


    That said, we’re going to be using the sci-kit learn library for this example
    - not writing Naive Bayes on our own.


    We should however, talk about how the data was pre-processed. The documentation
    on the website says the data is normalized like we described in the previous chapter,
    and then subsequently multiplied by 100.


    Notice each row is a data point (so it’s an N x D matrix). The first 48 columns
    are “word frequency proportions”, which is just the number of times that word
    appears in the email, divided by the total number of words in the email, times
    100).


    The last column is the label, 1 for spam and 0 for not spam.


    The rest of the columns we’re going to ignore.


    Note that we can also think of this as a “term-document” matrix, which we’ll talk
    about more in-depth later on.


    Basically it means that along one dimension you have each document, and along
    the other dimension you have some measure of the frequency of the terms.


    Now that you know how the data was generated, let’s go ahead and build our classifier.


    The first step is importing all the libraries we’ll need:


    from sklearn.naive\_bayes import MultinomialNB


    import pandas as pd


    import numpy as np


    Next, we load in the data using Pandas, which makes it super easy to turn a CSV
    into a matrix.


    data = pd.read\_csv(''spambase.data'').as\_matrix()


    np.random.shuffle(data)


    Third, we assign our X and Y:


    X = data\[:,:48\]


    Y = data\[:,-1\]


    Next, we make the last 100 rows our test set:


    Xtrain = X\[:-100,\]


    Ytrain = Y\[:-100,\]


    Xtest = X\[-100:,\]


    Ytest = Y\[-100:,\]


    Next, we train our model on the training data, and check the classification rate
    on the test data:


    model = MultinomialNB()


    model.fit(Xtrain, Ytrain)


    print "Classification rate for NB:", model.score(Xtest, Ytest)


    Try this and see what score you get.


    Next, let’s try a more powerful classifier. Remember, the API for all these machine
    learning models is the same. Much of the task is getting X and Y into the right
    format to feed it into these APIs.


    from sklearn.ensemble import AdaBoostClassifier


    model = AdaBoostClassifier()


