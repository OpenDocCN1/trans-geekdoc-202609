    # 2.9 ADVANTAGES AND DISADVANTAGES OF ARRAYS


    # Advantages of Arrays


    +   1. It is used to represent multiple data items of same type by using only
    single name.

    2. It can be used to implement other data structures like linked lists, stacks,
    queues, trees, graphs etc.

    3. 2D arrays are used to represent matrices.


    # Disadvantages of Arrays


    +   1. The dimension of an array is determined at the moment the array is created,
    and cannot be changed later on.

    2. The array occupies an amount of memory that is proportional to its size, independently
    of the number of elements that are actually of interest.

    3. If we want to keep the elements of the collection ordered, and insert a new
    value in its correct position, or remove it, for each such operation we may need
    to move many elements (on the average, half of the elements of the array); this
    is very inefficient.'
