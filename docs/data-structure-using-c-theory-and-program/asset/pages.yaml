    2. In transport networks where stations are drawn as vertices and routes become
    the edges of the graph.

    3. In maps that draw cities/state/regions as vertices and adjacency relations
    as edge.

    4. In program flow analysis where procedures or modules are treated as vertices
    and calls to these procedures are drawn as edges of the graph.

    5. Once we have a graph of a particular concept, they can be easily used for finding
    shortest paths, project planning, etc.

    6. In flow charts or control-flow graphs, the statements and conditions in a program
    are represented as nodes and the flow of control is represented by the edges.

    7. In state transition diagram, the nodes are used to represent states and the
    edges represent legal moves from one state to the other.

    8. Graphs are also used to draw activity network diagrams. These diagrams are
    extensively used as a project management tool to represent the interdependent
    relationships between groups, steps, and tasks that have a significant impact
    on the project.

    9. An activity network diagram also known as an arrow diagram or a PERT is used
