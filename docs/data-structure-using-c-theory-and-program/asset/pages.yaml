    can be any number of elements or nodes in the stack. The second advantage of linked
    list method is that insertion and deletion operation do not involve more data
    movements. The other advantage of this method is that memory space is not wasted,
    because memory space is allocated only when the users wants to push an element
    into the stack. To implement a push, we create a new node in the list and attach
    it as the first element. To implement a POP, we advance the Top of the stack to
    the second element in the first


