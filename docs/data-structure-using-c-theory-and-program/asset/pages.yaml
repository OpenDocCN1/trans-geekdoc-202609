  md: '# Chapter 9 Hashing Techniques


    (a) The search operation in a primary directory is done in a way to find a key
    which is greater than equal to the target. Using the corresponding pointer field,
    the sub-directory is searched.


    (b) In the sub-directory also, the search is made such that the key is greater
    than or equal to the target. The corresponding pointer filed is used to address
    a particular record in the actual file.

    The search efficiency of the indexed sequential file is based on many factors.
    Some of them:


    +   1. To what degree the directory structures are able to divide the actual file.

    2. To what degree the directory structure are able to reside in main memory.

    3. The relationship of data records to physical characteristics of the disk such
    as blocking factors, track size and cylinder size.

    This searching method is not suitable for a highly volatile file. It requires
    that the data records be stored in a physically increasing or decreasing key order.
    If there are no records in the overflow area, the search efficiency tends to deteriorate.
    In that case, ISAM is called Intrinsically Slow Access Method. To avoid the deterioration,
    the actual file should be reorganized into a new file with overflow. This organization
    operation cannot be done dynamically. It is a time-consuming task. The maintenance
    problems involved with the ISAM structures lead to the development of several
    dynamic indexing schemes.


    # POINTS TO REMEMBER


    +   1. Hash table is a data structure in which keys are mapped to array positions
    by a hash function.

    2. Popular hash function which use numeric keys are division method, mid-square
    method and folding method.

    3. Division method divides x by M and then uses the remainder.

    4. Multiplication method applies the hash function given as h (x) = [m (ka mod
    m)]

    5. Collision occur when a hash function maps two different keys to the same location.
    Therefore, a method is used to solve the problem of collisions, also called collision
    resolution techniques are applied.

    6. Open addressing technique can be implemented using linear probing, quadratic
    probing, double hashing and rehashing.

    7. The storage requirement for a hash table is o (k), where k is the number of
    keys actually used.


    # MULTIPLE CHOICE QUESTIONS


    +   1. In a hash table, an element with key k is stored at index'
