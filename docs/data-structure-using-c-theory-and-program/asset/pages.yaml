  md: '# Chapter 4 Stack


    3. Function execution is slower than iterative method because of the overhead
    of calling functions repeatedly.


    # Comparison of Iteration and Recursion


    Any iterative function consists of four parts.


    +   1. Initialisation: The decision parameter is set to an initial value or more
    precisely, the loop variable is initialised, other pre-defined variables are also
    initialised.


    +   2. Decision: The decision parameter is used to determine whether further looping
    is necessary. The loop variable is compared and based on the outcome, the loop
    is executed again.


    +   3. Computation: Necessary computation is performed within the loop.


    +   4. Update: The decision parameter is updated and transfer is made to the next
    iteration. The loop variable is incremented/decremented.


    For a recursive function.


    +   1. Initialisation: The variables in the form of arguments are passed to the
    function.


    +   2. Decision: The argument values are used to determine whether recursive calls
    are required.


    +   3. Computation: Necessary computation is performed using the local variables
    and the parameters at the current depth.


    +   4. Update: The update is done so that the variables can be used for further
    recursive calls.


    | SNo | Iteration | Recursion |

    |---|---||

    | 1 | Iterative Instructions –are based repetitions of a process | Recursive function
    – is a function that partially defined by itself |

    | 2 | Iteration uses repetition structure | Recursion uses selection structure
    |

    | 3 | An infinite loop occurs with iteration if the loop-condition test never
    becomes false | Infinite recursion occurs if the recursion step does not reduce
    the problem in a manner that converges on some condition |

    | 4 | Iteration terminates with the loop condition | Recursion terminates when
    a base case is recognized |

    | 5 | Iteration does not use stack so it''s faster than recursion | Recursion
    is slower than iteration due to overhead of maintaining stack |

    | 6 | Iteration consume less memory | Recursion uses more memory than iteration
    |

    | 7 | Infinite looping uses CPU cycles repeatedly | Infinite recursion can crash
    the system |

    | 8 | Iteration makes code longer | Recursion makes code smaller |'
