  md: '# # Searching and Sorting


    # ## 8.1 INTRODUCTION


    The process of finding the location of a specific data item or record with a given
    key value or finding the locations of all records, which satisfy one or more conditions
    in a list, is called “Searching”. If the element exists in the given list then
    search is said to be successful otherwise if the element not found in the given
    list then search is said to be unsuccessful.


    +   1. External searching

    2. Internal searching


    External searching means searching the records where there are many records which
    reside in files stored on disks. Internal searching means searching the records
    using keys where there are less number of records residing entirely within the
    computer’s main memory.


    There are many searching algorithms. The algorithm that one chooses generally
    depends on the way information in DATA is arranged. Following are the three important
    searching techniques:


    +   * Linear or Sequential Searching

    * Binary Searching

    * Interpolation Searching


    The time required for a search operation depends on the complexity of the searching
    algorithm. Basically, we have to consider three cases when we search for a particular
    element in the list.


    +   1. Best Case: The best case is that in which the element is found during the
    first comparison.

    2. Worst Case: The worst case is that in which the element is found only at the
    end i.e., in the last comparison.'
