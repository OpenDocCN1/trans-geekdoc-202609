    # POINTS TO REMEMBER


    +   1. A data structure is a particular way of sorting and organizing data either
    in computer’s memory or on the disk storage that it can be used efficiently.

    2. There are two types of data structure: primitive and non-primitive data structure.

    3. Primitive data structures are the fundamental data types which are supported
    by a programming language.

    4. Non-primitive data structures are those data structures which are created using
    primitive data structure.

    5. Non-primitive data can further be classified into two categories: linear and
    non-linear data structure.

    6. In the elements of a data structure are stored in a linear or sequential order,
    then it is a linear data structure. However, if the elements of a data structure
    are not stored in sequential order, then it is a non-linear data structure.

    7. An array is a collection of similar data elements which are stored in consecutive
    memory locations.

    8. A linked list is a linear data structure consisting of a group of elements
    called nodes which together represent a sequence.

    9. A stack is a last-in-first-out(LIFO) data structure in which insertion and
    deletion of elements are done at one end, which is known as the top of the stack.

    10. A queue is a first-in-first-out(FIFO) data structure in which the element
    that is inserted first is the first to be taken out. The elements in a queue are
    added at one end called the rear and removed from the other end called the front.'
