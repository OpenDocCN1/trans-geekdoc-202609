  md: 'There must be a decision criterion for stopping the process or computation.

    For designing the good recursive program we must make certain assumptions such
    as:


    +   (a) Base case: Base case is the terminating condition for the problem while
    designing any recursive function.


    +   (b) Conditions: If condition in the recursive algorithm defines the terminating
    condition.


    +   (c) When a recursive program is subjected for execution function calls will
    not be executed immediately.


    +   (d) The initial input value was pushed on the stack.


    +   (e) Each time a function is called again pushed on the stack and execution
    starts from the beginning of the function using new set of local variable and
    formal parameters are changed new value. This process is repeated until a base
    condition (stopping condition) is reached.


    +   (f) Once a base condition or stopping condition is reached the recursive function
    calls popping elements from stack and returns a result to the previous values
    of the function.


    +   (g) A sequence or returns ensures that the solution to the original problem
    is obtained.


    # Advantages and Disadvantages of Recursion


    # Advantages


    +   1. We can create a simple and easy version of programs using recursion.


    +   2. Always recursion will be written in the name of recursive definition. It
    can be translated into C code very easily.


    +   3. We can avoid initialisation of variable inside the functions, but iterative
    solutions are required to beised.


    +   4. Some specific applications are meant for recursion as Binary tree traversal;
    tower of Hanoi can. be easily understood.


    # Disadvantages


    +   1. It occupies lot of memory: When function is called outside or called within,
    the function stores formal local variables and address to confirm function are
    working well. Apart from this, stores function variables separately.


    +   2. It consumes more time to get result: After matching the base condition,
    the function should restore the most recently saved parameters, local variables,
    and return address. This operation spends lot of time during pushing and popping
    the necessary items from the stack.'
