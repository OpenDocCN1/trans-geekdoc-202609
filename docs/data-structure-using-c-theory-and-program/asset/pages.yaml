- pgno: 336
  md: "the spanning tree, since the two nodes are in the same tree, they are already\
    \ connected and adding these edges would result in a cycle. So we will insert\
    \ an edge in the spanning tree only if its nodes are in different trees.\n\nNow,\
    \ we will see how two nodes are in the same tree or not. For this, we need a UNION\
    \ - FIND structure.\n\nTo understand the UNION - FIND structure, we need to look\
    \ at a partition of a set.\n\n+   (a) Every element of the set belongs to one\
    \ of the sets in the partition.\n\n+   (b) No element of the set belongs to more\
    \ than one of the sub-sets.\n\n+   (c) Every element of a set belongs to one and\
    \ only one of the sets of a partition.\n\nA partition of a set may be thought\
    \ of as a set of equivalence classes. Each sub-set of the partition contains a\
    \ set of equivalent elements. For each subset, we denote one element as the representative\
    \ of that sub-set. Each element in the sub-set is however, equivalent and represented\
    \ by the representative. When we add elements to the sub-set, we arrange all the\
    \ elements point to that representative. Initially, each node is its own representative.\
    \ As the initial pairs of nodes are joined to form a tree, the representative\
    \ pointer of one of the nodes is made to point to the other, which becomes the\
    \ representative of the tree. As trees grow, the representative pointer of the\
    \ representative of one of them is set to any element of the other. Let x denote\
    \ an object, we wish to support the following operations.\n\n+   1. MAKE - SET\
    \ (x) creates a new set whose only member is pointed to by x.\n2. FIND - SET (x)\
    \ returns a pointer to the representative of the set containing x.\n3. UNION (x,\
    \ y) unites the dynamic sets that contain x and y, say S_x and S_y, into a new\
    \ set that is the union of these two sets. The representative of the resulting\
    \ set is some member of S_x U S_y. Since we require the sets in the collection\
    \ to be disjoint, we “destroy” S_x and S_y removing them from the collection.\n\
    \n```\nMST - KRUSKAL (G, W)\n1. A = ∅\n2. for each vertex v V[G]\n   do MAKE-SET\
    \ (v)\n3. sort the edges of E into increasing order by weight w.\n4. for each\
    \ edge (u,v) E in increasing order.\n   do if FIND-SET (u) ≠ FIND-SET (v)\n  \
    \ then A = A U {u, v}\n   UNION (u, v)\n5. return A.\n```"
