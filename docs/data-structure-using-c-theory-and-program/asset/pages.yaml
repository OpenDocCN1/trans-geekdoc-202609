- pgno: 15
  md: '# # Introduction to Data Structures


    # ## 1.1 INTRODUCTION


    In computer science, a data structure is a particular way of storing data in a
    computer so that it can be used efficiently. Different kinds of data structures
    are suited to various kinds of applications, and some are highly specialized to
    certain tasks. For Example, B-Trees are are well suited for implementation of
    databases, while compiler implementations usually use hash tables to look up for
    identifiers.


    Data structures are used almost in every program or software. Data structures
    are generally based on the ability of a computer to fetch and store data at any
    place in its memory, specified by an address- a bit string that can be itself
    stored in memory and manipulated by the program. Thus, the record and array data
    structure are based on computing the address of data items with arithmetic’s operation;
    while the linked list data structures are based on storing address of data items
    within the structure itself.


    # Definition


    +   - A data structure is a method of representing data; it not only deals with
    raw data but also involves the relationship between the data.

    - A data structure is defined as a way of representing data in computer memory.

    - Data structure is the structural representation of logical relationships between
    elements of data.


    # ## 1.2 CLASSIFICATION OF DATA STRUCTURE


    +   1. Linear data structure

    2. Non-linear data structure'
  merge: -1
  img_proc: true
- pgno: 16
  md: '2 Data Structure Using C


    +   3. Primitive and non-primitive data structure


    +   4. Homogeneous and non-homogeneous data structure


    **Linear data structure:** In linear data structure, data is stored in consecutive
    memory locations i.e., array, linked list, stack and queue.

    **Non-linear data structure:** In non-linear data structure, data is stored in
    non consecutive memory location. A non-linear data structure is mainly used to
    represent data containing a hierarchical relationship between data elements i.e.,
    tree, graph.

    **Primitive data structures:** are the basic data structures and are directly
    operated upon by the machine instructions, which is in a primitive level. These
    have different representations on different computers. They are integer, floating
    point numbers, string constants, etc.


    **Non-primitive data structures:** Is the more complicated data structure on structuring
    of a group of homogeneous or heterogeneous data items. These are derived from
    the primitive data structures. They are array, linked-list, stack, queue, graph,
    tree, files, etc.


    ![](img/3d5da05d64722faaa72fdc4daca105f9_16_0.png)


    **Figure 1** Classification of Data Structure


    In homogeneous data structures, the data elements are of same type like array.
    In non-homogeneous data structures, the data elements may not be of same type.


    # # 1.3 OPERATION ON DATA STRUCTURE


    **Create:** this is the first operation to create a data.


    **Inserting:** adding new record from the data structure.


    **Deleting:** remove a record from the data structure.


    **Updating:** it changes values of the data structure.


    **Traversing:** access each record exactly once so that certain items in the record
    may be processed.'
