    # POINTS TO REMEMBER


    +   1. A tree is a data structure which is mainly used to store hierarchical data.
    A tree is recursively defined as collection of one or more nodes is designated
    as the root of the tree and the remaining nodes can be partitioned into non-empty
    sets each of which is a sub-tree of the root.


    +   2. In a binary tree, every node has zero, one, or at the most two successors.
    A node that has no successors is called a leaf node or a terminal node. Every
    node other than the root node has a parent.


    +   3. The degree of a node is equal to the number of children that a node has.
    The degree of a leaf node is zero. All nodes that are at the same level and share
    the same parent are called siblings.


    +   4. Two binary trees having a similar structure are said to be copies if they
    have the same content at the corresponding nodes.


    +   5. A binary tree of n nodes has exactly n-1 edges. The depth of a node N is
    given by the length of the path from the root R to the node N, and depth of the
    root node is zero


    +   6. A binary tree of height h has least h nodes and at most 2^h-1 nodes.


    +   7. In a complete binary tree, every level (except possibly the last) is completely
    filled and nodes appears as far as possible


    +   8. The height of the binary tree with n nodes is at least log2(n+1) and at
    most n. The root node is the only node that has an in-degree equal to zero.


    +   9. A binary search tree, also known as an ordered binary tree, is a variant
    of binary tree in which all the nodes in the left sub-tree have a value less than
    of the root node and all the nodes in the right sub-tree have a value either equal
    or greater than the root node.'
