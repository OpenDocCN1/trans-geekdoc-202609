- pgno: 297
  md: '# Chapter 6 Trees 283


    For the first case suppose node has than minimum number of keys then it can be
    easily deleted. But it has only minimum number of keys then first key of the adjacent
    node will go to the parent node and in parent node which partitioning will be
    combined together in one node. Suppose, now parent has less than the minimum number
    of keys then the thing will be repeated until it get the node which has more than
    the minimum number of keys. For the second case key will be deleted and its predecessor
    and successor key have minimum number of keys then the nodes of predecessor and
    successor keys will be combined. Thus, while removing a key from a leaf node,
    However, if the node contains more than the minimum number of elements, then key
    can be easily deleted. However, if the leaf node contains just the minimum number
    of elements, scout for an element from either the left sibling or right sibling
    node for the vacancy. If the left sibling node has more than the minimum number
    of keys. Pull the largest key up into the parent node and move down the intervening
    entry from the parent node to the leaf node where the key is to be deleted. Otherwise,
    pull the smallest key up of the right sibling to the parent node and move down
    the intervening element to the leaf node.


    If both the siblings have only minimum number of entries, then create a new leaf
    node out of the two leaf nodes and the intervening element of the parent node,
    ensuring that the total number does not exceed the limit for a node. If while
    borrowing the intervening element from the parent node, it leaves the number of
    keys in the parent node to be below the minimum number, then we propagate the
    property upwards ultimately resulting in a reduction of height of the B-tree.


    ![](img/3d5da05d64722faaa72fdc4daca105f9_297_0.png)'
