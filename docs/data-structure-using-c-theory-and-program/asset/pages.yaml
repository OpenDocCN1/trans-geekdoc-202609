    \ test whether DATA (2) = ITEM, and so on. This method traverses DATA sequentially\
    \ to locate ITEM, is called linear search or sequence search. Each element of\
    \ an array is read one-by-one sequentially and it is compared with the desired\
    \ element. A search will be unsuccessful if all the elements are read and the\
    \ desired element is not found. Linear search is the least efficient search technique\
    \ among the quantity dependent search techniques. This technique should be chosen\
    \ for searching the records when the records are stored without considering the\
