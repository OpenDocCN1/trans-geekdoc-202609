    # 2. Linked List Implement of a Stack


    The stack can be implemented as a linked list in which the top of the stack is
    represented by the first item in the list. The first element inserted into the
    stack is pointed out by the second element, the second element out by the third
    and so on. In general the (n-1) th element is pointed out by the nth element.


