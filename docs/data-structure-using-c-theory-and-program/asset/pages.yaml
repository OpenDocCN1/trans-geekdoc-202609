    # Applications of Doubly linked list can be


    +   1. A great way to represent a deck of cards in a game.

    2. The browser cache which allows you to hit the BACK button (a linked list of
    URLs)

    3. Applications that have a Most Recently Used (MRU) list (a linked list of file
    names)

    4. A stack, hash table, and binary tree can be implemented using a doubly linked
    list.

    5. Undo functionality in Photoshop or Word (a linked list of state)


    # 3.12 DIFFERENCE BETWEEN LINKED LISTS AND ARRAYS


    Similar data element can be stored in memory with the use of array or a linked
    list. Arrays are easy to understand but they have the following limitations:'
  merge: -1
