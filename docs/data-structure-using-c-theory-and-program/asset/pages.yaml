  md: '# Chapter 4 Stack


    # 1. Checking the Validity of an Arithmetic Expression


    An arithmetic expression consists of operands and operators. Operands are variables
    or constants and operators are of various types. With the help of stack, we can
    check the validity of an arithmetic expression.


    +   * Whenever an opening parenthesis is encountered, it is pushed on the stack.

    * Whenever a closing parenthesis is encountered, the stack is examined.

    * If the stack is empty, the closing parenthesis does not have an opening parenthesis
    and the expression is invalid.

    * If the stack is not empty, POP the stack and check whether the popped item corresponds
    to the closing parenthesis.

    * When the end of the expression is reached, the stack must be empty; otherwise
    one or more opening parenthesis does not have corresponding closing parenthesis
    and the expression is invalid.


    Example

    [(P + Q) - {R + S}] - [T + U]


    | Symbol Scanned | Stack |

    |---|---|

    | [ | |

    | ( | |(

    | P | |(

    | + | |(

    | Q | |(

    | ) | [ |

    | - | [ |

    | { | |(

    | R | |(

    | + | |(

    | S | |(

    | } | [ |

    | ] | |

    | - | |

    | [ | [ |

    | T | [ |'
