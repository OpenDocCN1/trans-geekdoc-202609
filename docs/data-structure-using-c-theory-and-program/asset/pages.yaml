    # 6.24 MULTI-WAY SEARCH TREES


    The goal of M-way search tree is to minimise the accesses while retrieving a key
    from a file. However, an M-way search tree of height h calls for O (h) number
    of accesses for an insert, delete, and retrieval operation. Hence, it pays to
    ensure that the height h is close to log m (n+1), because the number of elements
    in an M-way search tree of height h ranges from a minimum of h to a maximum of
    M^h-1. This implies that an M-way search tree of n elements ranges from a minimum
    of height of log m(n+1) to a maximum height of n. Therefore, there arises the
    need to maintain balanced M-way search trees.\ Trees having (m-1) keys and m children
    are called M-way search trees. A binary tree is 2-way tree. It means that it has
    m-1=2-1 key (here m=2) in every node and it can have maximum of two children.
    A binary tree also an M-way tree of order 3 is that in key values could be either
    1 or 2.


    +   1. In an M-way tree all nodes have degree < m.

    2. The keys in each node are in ascending order k1 < k2 < ...

    3. The Ki is larger than keys in sub-tree pointed by Pi and smaller than keys
    in sub tree pointed by Pi+1

    4. The sub-trees are the M-way trees.


    Searching a Multi-Way Tree

    Searching for a key in an M-way search tree is similar to that of binary search
    trees. The procedure is as follows.


    +   1. If the key is less than k1 then the search is continued in M-way search
    tree pointed to pointer p1

    2. If the key lies between k1 and k2 then the search is continued in M-way search
    tree pointed to p2

    3. If the key lies between k2 and k3 then the search is continued in M-way search
    tree pointed to pointer p3

    4. If the key is greater than kqi-1 then the search is continued in M-way search
    tree pointed by pq

    The steps are carried on recursively either the key is found or the M-way search
    tree is empty.


    ![](img/3d5da05d64722faaa72fdc4daca105f9_291_0.png)'
  merge: -1
  img_proc: true
