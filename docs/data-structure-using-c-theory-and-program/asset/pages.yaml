    The insertion operations start in the same way as we add a new node in the binary
    search tree. However, in a binary search tree, we always add the new node as a
    leaf, while in a red-black tree, leaf node contain no data. Instead of adding
    the new node as a leaf, we add a red interior node that has two black leaf nodes.
    Remember that the colour of the new node is red and its leaf nodes are coloured
    in black. Once a new node is added, it may violate some property of the red-black
    tree. So in order to restore its property, we check for certain cases and restore
