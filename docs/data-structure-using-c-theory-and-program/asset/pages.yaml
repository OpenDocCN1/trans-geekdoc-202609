    # 9.7 COLLISION RESOLUTION TECHNIQUES


    Suppose we want to add a new record R with key k to our file F, but suppose the
    memory location address H (k) is already occupied. This situation is called collision.
    A collision occurs when more than one keys map to same hash value in the hash
    table.


    Types of Collision Resolution Techniques:


    +   1. Collision resolution by open addressing.

    2. Collision resolution by separate chaining.


    The performance of these methods depends on load factor i.e., ratio λ = n/m. This
    is the ratio of the number n of keys to the number m hash addresses. The efficiency
    of a hash function with a collision resolution is measured by the average number
    of probes needed to find the location of the record with a given k.


    # 9.8 HASHING WITH OPEN ADDRESSING


    In open addressing, all elements are stored in the hash table itself. That is,
    each table entry contains an element of the dynamic set or NIL. When searching
    for an element, we systematically examine table slots until the desired element
    is found or it is not in the table. Thus, in open addressing, the load factor
    can never exceed 1. The advantage of open addressing is that it avoids pointers
    altogether. Instead of following pointers, we compute the sequence of slots. The
    extra memory freed provides the hash table with a larger number of slots for the
    same amount of memory, potentially yielding fewer collisions and faster retrieval.
    The process of examining the locations in the hash table is called ‘Probing’.
    To perform insertion using open addressing, we successively examine, or probe,
    the hash table until we an empty slot in which to put the key.


    Three techniques are commonly used to compute the probe sequences required for
    open addressing: Linear probing, quadratic probing and double hashing.


