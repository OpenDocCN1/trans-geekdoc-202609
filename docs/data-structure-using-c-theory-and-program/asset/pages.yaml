- pgno: 21
  md: '# There are another popular design approaches


    +   1. Incremental Approach


    +   2. Divide and Conquer Approach


    +   3. Greedy Approach


    +   4. Dynamic Programming Approach


    +   5. Backtracking Approach


    +   6. Branch and Bound Approach


    **Incremental Approach:** In this approach we increase the index to insert the
    element at proper position. Insertion sort uses an incremental approach. Having
    sorted the sub-array [1....j-1], insert the single element A[j] into its proper
    place, yielding the sorted sub-array A[1....j].


    **Divide and Conquer Approach:** Divide the original problem into a set of sub-problems.
    Solve every sub-problem individually, recursively. Combine the solutions of the
    sub-problems (top level) into a solution of the whole original problem.


    **Greedy Approach:** A greedy algorithm is a mathematical process that looks for
    simple, easy-to-implement solutions to complex, multi-step problems by deciding
    which next step will provide the most obvious benefit. Such algorithms are called
    greedy because the smaller instance will provide an immediate output, the algorithm
    doesn''t consider the larger problem as a whole. Once a decision has been made,
    it is never reconsider. Greedy algorithms work by recursively constructing a set
    of objects from the smallest constituent parts. Recursion is an approach to solving
    in which the solution to a particular problem depends on solutions to smaller
    instances of the same problem. The advantage to using a greedy algorithm is that
    to smaller instances of the problem can be straightforward and easy to understand.
    The disadvantage is that it is entirely possible that the most optimal short term
    solutions may lead to the worst possible long-term outcome. Greedy algorithms
    are often used in mobile networking to efficiently route packets with the fewest
    number of hops and the shortest delay possible. They are also used in machine
    learning, business intelligence (BI), artificial intelligence (AI) and programming.


    **Dynamic Approach:** Dynamic programming is a technique for efficiently computing
    recurrences by storing partial result. It is a method of solving problems exhibiting
    the properties of overlapping sub-problems and optimal sub-structure that takes
    much less time than naive methods.


    **Backtracking Approach:** Backtracking is a form of recursion. The usual scenario
    is that you are faced with a number of options, and you must choose one of these.
    After you make your choice you will get a new set of options; just set of options
    you gets on what choice you made. This procedure is repeated over and until you
    reach a final state. If you made'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'a good sequence of choices, your final state is a goal state; if you didn’t,
    isn’t. Conceptually, you start at the root of a tree; the tree probably has some
    good leaves and some bad leaves, it might be that the leaves are all good or bad.
    You want to get a good leaf. At each node, beginning with the root, you choose
    one of its children to move to, and you keep this until you get to a leaf.


    +   - Branch and Bound: In a branch and bound algorithm a given sub-problem, which
    cannot be bounded, has to be divided into at least two new sub-problems. Branch
    and bound algorithms are methods for global optimization in non-convex problems.


    # Analysis of algorithm


    The algorithm can be traced by step-by-step instructions, reading the algorithm
    for logical correctness, and testing it on data using mathematical techniques.
    After designing an algorithm, it has to be checked and its correctness needs to
    be predicted; this is done by analysing the algorithm. thus, its analysis measures
    the efficiency of the algorithm. The efficiency of an algorithm can be checked
    by (i) correctness of an algorithm, (ii) implementation of an algorithm, (iii)
    simplicity of an algorithm (iv) execution time and memory requirements of an algorithm.


    # Types of Analysis


    **Best Case:** The best case complexity of the algorithm is the function defined
    by the minimum number of steps taken on any instance of n.


    **Average Case:** The average case complexity of the algorithm is the function
    defined by an average number of steps taken on any instance of size n.


    **Worst Case:** The worst case complexity of an algorithm is the function defined
    by the maximum number of steps taken on any instance of size n.


    # 1.7 TIME-SPACE TRADE OFF


    For many natural problems, such as sorting or matrix-multiplication, there are
    many choices of algorithms to use, some of which are extremely space-efficient
    and others of which are extremely time-efficient. This is an instance of a general
    phenomenon where one can save space by recomputing intermediate results. Research
    in time-space trade off lower bounds seeks to prove that, for certain problems,
    no algorithms exist that achieve small space and time simultaneously. In computer
    science, a space-time or time-memory trade off is a way of solving a problem or
    calculation in less time using more storage space (or memory), or by solving a
    problem in very little space by spending a long time. Most computers have a large
    amount of storage, but not infinite space. Also, most people are willing to wait
    a little while for a big calculation, but not forever. So if'
