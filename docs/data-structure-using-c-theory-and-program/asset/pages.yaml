  md: '# Types of Sorting


    +   1. Bubble sort

    2. Insertion Sort

    3. Selection sort

    4. Merger Sort

    5. Heap Sort

    6. Quick sort

    7. Radix Sort


    The sorting problem is to arrange a sequence of records so that values of their
    fields form a non-decreasing sequence. That is, given records r₁,, r₂,,...,rn
    with key values k₁,, k2,...,kn, respectively, we must produce the same records
    in an order r₁,, r₂, rₙ such that k₁ ≤ k₂ ≤ ... ≤ kn


    # ## 8.6 BUBBLE SORT


    Also called as sinking sort

    Bubble sort, is a simple sorting algorithm. Comparing two items at a time and
    swapping them if they are in the wrong order. Pass through the list is repeated
    until no swaps are needed, which means the list is sorted. The idea applied for
    the bubble sort is as follows:


    +   (a) Suppose if the array contains n elements, then (n-1) iterations to sort
    this array.

    (b) First compare the 1st and 2nd element of array, if 1st element < 2nd element
    then compare the 2nd element with 3rd element.

    (c) If 2nd element > 3rd element, interchange the value of 2nd and 3rd elements.

    (d) Now compare the value of 3rd element with 4th element, if 3rd element > 4th
    element then interchange the value of 3rd and 4th elements.

    (e) Similarly n-1th element is compared with nth element.

    (f) Now when the highest value is reached at the nth position.

    The bubble sort is generally considered to be the most inefficient sorting algorithm
    in common usage.


    # Algorithm


    Bubble sort (A)


    +   1. start

    2. for i= 1 to length [A]

    3. for j= length [A] to i+1

    4. if A[j] < A[j-1]

    5. exchange (A[j], A[j-1])'
