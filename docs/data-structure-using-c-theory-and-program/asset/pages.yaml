    # Time Complexity


    In computer science, the **time complexity** of an algorithm quantifies the amount
    of time taken by an algorithm to run as a function of the length of the string
    representing the input. The time complexity of an algorithm is commonly expressed
    using big O notation, which excludes coefficients and lower order terms. When
    expressed this way, the time complexity is said to be described *asymptotically*,
    *i.e.*, as the input size goes to infinity. Time complexity is commonly estimated
    by counting the number of elementary operations performed by the algorithm, where
    an elementary operation takes a fixed amount of time to perform. The amount of
    time taken and the number of elementary operations performed by the algorithm
    differ by most a constant factor.


    > The time complexity of an algorithm is the amount of time to run to completion”.
    Some of the reasons for studying time complexity are


    +   1. We may be interested to know whether the program will provide a satisfactory
    real time response.

    2. There may be several possible solutions with different time requirements or
    with different time complexity.


    # Space Complexity


    Space complexity is a measure of the amount of working storage an algorithm needs.
    That means how much memory, in the worst case, is needed at any point in the algorithm.
    As with time complexity, we are mostly concerned with how the space grows, in
    big-O terms, the size N of the problem grows. *Space Complexity of an algorithm*
    is total space taken by the algorithm with respect to the input size. Space complexity
    includes both Auxiliary space and used by input.


    > The space complexity of an algorithm is the amount of memory it needs to run
    to completion”. The space needed by a program consists of following components


    +   1. Instructions space - to store executable version of program

    2. Data space - to store all constants, variables etc.

    3. Environment stack space - it is used in case of recursive program


    The total space needed by a program can be divided in two parts- A fixed part
    that is independent of particular problem, and includes instructions space for
    constants, variables and fixed size structure variables A variable part that'
