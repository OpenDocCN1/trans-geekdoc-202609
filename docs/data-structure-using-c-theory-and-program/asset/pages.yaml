  md: '# 2. Depth first search using stack


    The Depth First Search (DFS) as its name suggest, is to search deeper in the graph.
    Given an input graph G=(V, E) and a source vertex S, from where the searching
    paths. First we visit the starting node, and then we travel through each node
    along a path, which begins at S. That is, we visit a neighbour vertex of S and
    again a neighbour of a neighbour of S and so on. DFS also works on both directed
    as on undirected graphs.


    # Depth first search using stack


    Depth first search technique uses stack. Take an array STACK, which will be used
    to keep the unvisited neighbours of the node. Another Boolean array VISITED, which
    will have value TRUE if the node has been visited and will have FALSE if the node
    has not been visited.


    Initially stack is empty and TOP = -1.

    Initially VISITED [i] = FALSE where i = 1, n is total number of nodes


    # Procedure


    +   1. Push starting node into the stack.

    2. Pop an element from the stack, if it has not been traversed traverse it, if
    it has already traversed just ignore it. After traversing making the value of
    visited array true for this node.

    3. Now push all the unvisited adjacent nodes of the popped element on stack. Push
    the element if it is already on the stack.

    4. Repeat steps 3 and 4 until stack is empty.


    | Vertex | Adjacency List |

    | A | B, C, D |

    | B | D, E |

    | C | D |

    | D | |

    | E | D |


    ![](img/3d5da05d64722faaa72fdc4daca105f9_328_0.png)


    Step 1: Push node A into stack


    ![](img/3d5da05d64722faaa72fdc4daca105f9_328_1.png)


    Now, Top = 0 and STACK = A.

    Step 2: POP node A from stack and traverse it

    So, Traversed node = A and VISITED [A] = TRUE

    Now, push all the unvisited adjacent nodes B, C, D of the popped element on the
    stack.'
