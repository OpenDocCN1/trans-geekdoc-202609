  md: '# 1. Creation of binary tree from pre-order and in-order traversal.


    The general rule for creating a binary tree is as follows:


    **Rule 1:** scan the pre-order traversal from left to right


    **Rule 2:** for each node scanned, locate its position in in-order traversal.
    Assume the scanned node be X.


    **Rule 3:** the node X preceding X inorder from its left sub-tree and nodes succeeding
    it from right sub-tree.


    **Rule 4:** repeat rule 1 for each symbol in the pre-order.


    **Example:** Draw a binary tree of the following given orders


    Pre-order: A B D H E C F G


    In-order: D H B E A F C G


    # **Solution:**


    Pre-order: A B D H E A F G


    In-order: D H B E A F G


    **Step 1:** In pre-order traversal root is the first node. So, A is the root node
    of the binary tree.


    ![](img/3d5da05d64722faaa72fdc4daca105f9_264_0.png)


    **Step 2:** We can find the node of left sub-tree and right sub-tree with in-order
    sequence.


    Nodes which left sub-tree: D H E


    Nodes are right sub-tree: F C G


    **Step 3:** The left child of the root will be the first node in the pre-order
    sequence after root A. Hence, node B is the left child of root A. Similarly, the
    right child of root A will be the first node after nodes of left sub-tree in pre-order
    sequence. Hence, node C is the right child of A.


    ![](img/3d5da05d64722faaa72fdc4daca105f9_264_1.png)


    Nodes which are left sub-tree: D H E


    Nodes which are right sub-tree: F G


    **Step 4:** In in-order sequence, node D and H are on the left side of B and E
    is on the right side of B. So node D and node H form left sub-tree and node E
    will be in the right sub-tree of B.


    Nodes which are left sub-tree: D H


    Nodes which are right sub-tree: F G


    **Step 5:** In in-order sequence node F is on the left of node C and node G is
    on the right side of node C. So node F will be in left sub-tree of node C and
    node G in right sub-tree of node.


    Nodes which are left sub-tree: D H


    ![](img/3d5da05d64722faaa72fdc4daca105f9_264_2.png)'
