    # 6.16 AVL TREE


    The first balanced binary search tree was the AVL tree. The AVL tree is a binary
    search tree that has an additional balance condition. This balance condition must
    be easy to maintain and ensures that the depth of the tree is O (log N). The simplest
    idea is to require that the left and right sub-trees have the same height. This
    balance condition ensures that the depth of the tree is logarithmic, but it is
    too restrictive because it is too difficult to insert new items while maintaining
    balance.


    AVL is a height balance. Height balanced tree is one in which the difference in
    the height of the two sub-trees for any node is less than or equal to some specified
    amount. In AVL tree, the height difference may be no than 1. In fact, for an AVL
    tree it will never be greater than 1.


    # Balance Factor


    To implement an AVL tree each node must contain a balance factor, which indicates
    its states of balance relative to its sub-trees: Height of left sub-tree – Height
    of right sub-tree.


    Then the balance factors in a balanced tree have values of -1, 0 or 1. For an
    AVL tree, the value of the balance factor of any node is -1, 0, or 1. If it is
    other than these three values then the tree is not balanced or it is not an AVL
    tree. If the value of the balance factor of any node is -1, then the height of
    the right sub-tree of that node is one more than the height of its left sub-tree.
    If the value of the balance factor of any node is 0 then the heights of its left
    and right sub-tree is exactly the same. If the value of the balance factor of
    any node is 1 then the height of the left sub tree of that node is one more than
    height of right sub-tree.


    # 6.17 ROTATIONS OF AVL TREE


    +   (i) Left-to-Left rotation (LL Rotation)

    (ii) Right-to-Right rotation (RR Rotation)

    (iii) Left-to-Right rotation (LR Rotation)

    (iv) Right-to-Left rotation (RL Rotation)'
