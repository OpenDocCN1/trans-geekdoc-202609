  md: '# Add operation in priority queue


    Add operation in priority queue is same as the insert operation in sorted linked
    list. Here, we insert the new node element on the basis of priority. The new node
    element will be inserted before the element which has less priority than new node
    element.


    ![](img/3d5da05d64722faaa72fdc4daca105f9_232_0.png)


    Figure Before add


    ![](img/3d5da05d64722faaa72fdc4daca105f9_232_1.png)


    Figure After add (whose priority is 2)


    # Delete operation in priority queue


    A priority queue must at least support the following operations:


    +   **Pull Highest Priority Element:** Remove the element from the queue that
    has the highest priority, and return it. This is also known as “pop element(Off)”,
    “get_maximum element” or “get_front(most) element”. Some conventions reverse the
    order of priorities, considering lower values to be higher priority, so may also
    be known as “get_minimum_element”, and is often referred to as “get-min” in the
    literature. This may instead be specified as separate “peek_at_highest_priority_element”
    and “delete_element” functions, which can be combined to produce “pull_highest_priority_element”.


    ![](img/3d5da05d64722faaa72fdc4daca105f9_232_2.png)


    Figure Before delete


    ![](img/3d5da05d64722faaa72fdc4daca105f9_232_3.png)


