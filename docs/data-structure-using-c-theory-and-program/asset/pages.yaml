    # 9.5 HASH FUNCTIONS


    A hash function is function that can be used to map data of arbitrary size to
    data of fixed size. The values returned by a hash function are called hash values,
    hash codes, hash sums, or simply hashes. The intent is that elements will be relatively
    randomly and uniformly distributed. Perfect hash function is a function which,
    when applied to all the members of the set of items to be stored in a hash table,
    produces a unique set of integers within suitable range. Such produces no collisions.
    Good Hash function minimises by spreading the elements uniformly throughout the
    array. There is no magic formula for the creation of the hash function. It can
    be any transformation that produces a relatively random and unique distribution
    of values within the address space of the storage.


    # Characteristics of a Good Hash Function


    There are four main characteristics of a good hash function:


    +   * The hash value is fully determined by the data being hashed.

    * The hash function uses all the input data.

    * The hash function “uniformly” distributes the data across the entries of possible
    hash values.

    * The hash function generates very different hash values for similar strings.'
