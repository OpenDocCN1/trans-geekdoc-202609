    # 6.14 THREADED BINARY TREE


    Consider the linked list representation of any binary tree, we notice that half
    of the entries in the pointer field left and right will contain NULL entries.
    This space may be more efficiently used by replacing the NULL entries by special
    pointers called Threads which point to the nodes higher in the tree. Such tree
    are called threaded binary tree.


    In memory, an extra field called tag or flag is used to distinguish a thread from
    a normal pointer. Tree can be threaded using one-way threading or two-way threading.
    In one-way threading a thread will appear in the right field of the node and will
    point to the successor node in the in-order traversal of tree. In two-way threading
    of tree a thread will appear in the left field of a node and will point to the
    preceding node in the in-order traversal of tree.


    +   1. The Right NULL pointer of each node can be replaced by a thread to the
    successor of that node under in-order traversal called a right thread and the
    tree will be called as a right threaded tree.


    ![](img/3d5da05d64722faaa72fdc4daca105f9_273_0.png)


    +   2. The left NULL pointer of each node can be replaced by a thread to the predecessor
    of that node under in-order traversal called a left threaded and the tree will
    be called as a left threaded tree.


    ![](img/3d5da05d64722faaa72fdc4daca105f9_273_1.png)


    +   3. Both left and right NULL pointers can be used to point to predecessor and
    successor of that node, respectively, under in-order traversal. Such a tree is
    called a fully threaded tree.'
