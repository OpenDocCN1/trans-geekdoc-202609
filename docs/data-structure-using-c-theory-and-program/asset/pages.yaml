  md: 'Chapter 6 Trees


    # 6.19 DELETION IN AN AVL TREE


    The deletion of a node from an AVL tree is exactly the same as the deletion of
    a node from the BST. The sequence of steps to be followed in deleting a node from
    an AVL tree is as follows:


    +   Initially, the AVL tree is searched to find the node to be deleted.


    +   The procedure used to delete a node in an AVL tree is the same as deleting
    the node in the binary search tree.


    +   After deletion of the node, check the balance factor of each node.


    +   Rebalance the AVL tree if the tree is unbalanced. For this, AVL rotations
    are used.


    Example: consider the AVL tree given in figure and deletes some nodes from it
    one by:


