  md: '# Chapter 6 Trees


    The absence of a branch indicates an empty subtree. If every internal node (non
    terminal node) has no empty left and right children then it is called strictly
    binary tree. In other words, every leaf node in a binary tree has no empty left
    and right sub-trees, the tree is termed as strictly binary tree.


    Here, every internal node A, B, E has two empty left and right children, it is
    strictly binary tree.


    # Properties


    +   1. A strictly binary tree with n leaf nodes has n+1 leaf node.

    2. A strictly binary tree with n leaf nodes always has 2n-1 nodes.


    # 2. Extended Binary Tree (2-Tree)


    If in a binary tree, each sub-tree is replaced by a special node then resulting
    tree is extended binary tree or 2-tree. So we can convert a binary tree to an
    extended binary tree by adding special nodes to leaf nodes and nodes that have
    only one child. The special nodes added to the tree are called external nodes
    and the original nodes of the tree are internal nodes. External nodes are shown
    by square and internal nodes by circles.


    ![](img/3d5da05d64722faaa72fdc4daca105f9_245_0.png)


    # 3. Complete Binary Tree


    In computer science, a binary tree is a data structure in which each node has
    at most two children, which are referred to as the left child and the right child.
    A binary tree with n nodes and a depth d is a strictly binary tree all of whose
    terminal nodes are at level d. If a binary tree contains m nodes at level I, it
    contains at 2m nodes at level I+1.


    # 4. Almost Complete Binary Trees


    A binary tree of depth d is an almost complete binary tree, if:


    +   (i) Any node less than d-1 has two children.

    (ii) For any node ''X'' in the tree with a right descendant at level d, X must
    have a left child and every left descendant of X is either a leaf at level d or
    has two childrens.


    ![](img/3d5da05d64722faaa72fdc4daca105f9_245_1.png)


    ![](img/3d5da05d64722faaa72fdc4daca105f9_245_2.png)


    ![](img/3d5da05d64722faaa72fdc4daca105f9_245_3.png)'
