  md: '4. All leaves have the same depth, which is the tree''s height.


    5. There are lower and upper bounds on the number of keys a node can contain.
    These bounds are expressed in a fixed integer i ≥ 2 called the minimum degree
    of the B-tree:


    +   (a) Every node other than the root must have at least t-1 keys. Every internal
    node other than the root has at-least children. If the tree is not empty, the
    root must have at-least one key.


    +   (b) Every node can contain at most 2t-1 keys. Therefore, an internal node
    can have most 2t children. We say that a node is full if it contains 2t-keys.


    # 6.26 INSERTION IN B-TREE


    The insertion of key in a B-tree requires first traversal in B-tree. Through traversal
    it will find that key to be inserted is already existing or not. Suppose key does
    not exist in tree then through traversal it will reach leaf node. Now we have
    two cases for inserting the key.


    +   1. Node is not full


    +   2. Node is already full


    If the leaf node in which the key is to be inserted is not full, then the insertion
    is done in the node. A node is said to be full if it contains a maximum of (m-1)
    keys, given the order of the B-tree to be m. If the node were to be full, insert
    the key into the existing set of keys in the node, split the node at its median
    into two nodes at the same level, pushing the median, and element by one level.
    Note that the split nodes are only half full. Accommodate the median element in
    the parent node if it is not full. Otherwise repeat the procedure and this may
    even call for rearrangement of the keys in the root node or the formation of a
    new root itself.


    **Example: Insert these numbers in a B-Tree of order 5.**


    20, 80, 55, 116, 39, 76, 124, 103, 48, 200, 98, 175, 235, 28, 114, 132, 164


    **Solution:**


    Insert 20: |20|


    Insert 80: |20|80|


    Insert 55: after insertion of 55, the keys in the node will be sorted.


    |20|55|80|


    Insert 15: after insertion of 15, the keys in the node will be sorted.


    |15|20|55|80|'
