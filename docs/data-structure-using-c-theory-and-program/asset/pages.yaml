    # 6.20 RED-BLACK TREE


    A red-black tree is a binary search tree in which every node has a colour which
    is red or black. Recall that an extended binary tree is a tree in which all NULL
    links are replaced by special nodes that are called external nodes. The properties
    of a red-black tree are as follows:


    +   Property 1: The colour of a node is either red or black.


    +   Property 2: The colour of the root node is always black.


    +   Property 3: All leaf nodes are black.


    +   Property 4: Every red node has both the children coloured in black.


    +   Property 5: Every simple path from a given node to any of its leaf nodes has
    an equal number of black nodes.'
