    # Algorithm

    Insertion sort (A)


    +   1. start

    2. for j=2 to length [A]

    3. do key = A[j]

    4. i = j-1

    5. while i > 0 and A[i] > key

    6. do A[i+1]=A[i]

    7. i = i+1

    8. A[i+1]= key


    **Step 1**: array [0] is already sorted because of one element.

    **Step 2**: array [1] is inserted before or after array [0]

    So array [0], array [1] are sorted

    **Step 3**: array [2] is inserted before array [0], in between array [0] and array
    [1] or after array [1]

    So array [0], array [1], array [2] are sorted

    **Step 4**: array [3] is inserted in its proper place in array

    So array [0], array [1], array [2], array [3] are sorted

    And so on...

    Finally, array [n-1] is inserted into its proper place in array

    So array [0], array [1], array[2]... array [n-1] are sorted.


