    4. QUICK-SORT (A, q+1, r)


    Note that to sort array, the initial call is quick sort (A, 1, length [A]) as
    a first step, quick sort choose pivot one of the elements to be sorted. Then array
    is partitioned on either side of the pivot. Elements that are less or equal to
    pivot will move towards the left and elements that are greater or equal to pivot
    will move towards the right.


    Partitioning the Array


    # Algorithm


    # PARTITION (A, p, r)


    +   1. x = A[r]

    2. i = p - 1

    3. for j = p to r - 1

    4. do if A[j] ≤ x

    5. then i = i + 1

    6. exchange A[i] = A[j]

    7. exchange A[i + 1] = A [r]

    8. return i + 1


    +   1. All the elements on the left side of pivot should be smaller or equal to
    the pivot.

    2. All the elements on the right side of pivot should be greater than or equal
    to pivot.


    The process for sorting the elements through quick sort is as:


    +   1. Take the first element of list as pivot.

    2. Place pivot at the proper place in list.

    3. For placing the pivot at proper place we have a need to do the following process:

    (a) Compare the pivot element one by right to left for getting the element which
    has value less than pivot element.

    (b) Interchange the element with pivot element.

    (c) Now the comparison will start from the interchanged element position from
    left to right for getting the element which has higher value than pivot.

    (d) Repeat the same process until pivot is at its proper position.


    Example: Let us take list of element and process through quick sort


    46 27 6 57 70 86 40 63 93 17 80 66'
