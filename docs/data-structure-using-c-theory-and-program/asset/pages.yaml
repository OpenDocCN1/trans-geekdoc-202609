    # 4.3 IMPLEMENTATION OF STACK


    A stack can be implemented in array or linked list


    +   1. Array Implementation of the Stacks


    A stack is an ordered collection of items and C language already contains a data
    type that is an ordered collection of items such as array. A stack and an array
    are two entirely different things. The number of elements in an array is fixed
    and is assigned by the declaration for the array. A stack on the other hand, is
    fundamentally a dynamic object whose size is constantly changing as items are
    pushed and popped. However, although an array cannot be a stack, it can be home
    of a stack.


