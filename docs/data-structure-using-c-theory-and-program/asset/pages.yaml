    \ are greedy algorithms.\n\n# 7.9 KRUKSHAL'S ALGORITHM\n\nThis algorithm creates\
    \ a forest of trees. Initially the forest consists of n single node trees and\
    \ no edges. That is, in the method initially we take n distinct trees for all\
    \ nodes of the graph. At each step, we add one edge, so that it joins two together.\n\
    \n+   1. Initially construct a separate tree for each node in a graph.\n2. Edges\
    \ are placed in a priority queue, we take edges in ascending order. We can use\
    \ a heap for the priority queue.\n3. Until we have added n-1 edges.\n  (a) Extract\
    \ the cheapest edge from the queue.\n  (b) If it forms a cycle, reject it\n  \
    \  else\n    add to the forest.\n4. Whenever we insert an edge, two trees will\
    \ be joined, so that at the end, there will be only one.\nIn this method, first\
    \ we examine all the edges one-by-one starting from the smallest edge. To decide\
    \ whether the selected edge should be included in the spanning tree or not, we\
    \ will examine the two nodes connecting the edge. If the two nodes belong to the\
    \ same tree then we will not include the edge in"
