    # 3.5 CIRCULAR LINKED LIST


    Circular Linked List is more complicated linked data structure. In the circular
    linked list we can insert elements anywhere in the list whereas in the array cannot
    insert element anywhere in the list because it is in the contiguous memory. In
    the circular linked list the previous element stores the address of the next element
    and the last element stores the address of the starting element. The elements
    points to each other in a circular way which forms a circular chain. The circular
    linked list has a dynamic size which means the memory can be allocated when it
    is required. Circular linked list is a linked list where all nodes are connected
    to a circle. There is no NULL at the end. A circular linked list can be a singly
    circular linked list or doubly linked list.


