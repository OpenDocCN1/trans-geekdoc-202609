    # 4.5 RECURSION


    Recursion can be defined as a process in which a function calls itself with reduced
    input to stop the process, i.e., in order to have a base condition solve a problem
    recursively, two conditions must be satisfied. First, the problem must be written
    in a recursive form, and second, the problem statement must include a stopping
    condition.


    > **Definition:** A function is to be recursively defined, if a function containing
    either a Call statement to itself or a Call statement to a second function that
    may eventually result in a Call statement back to the original function.


    A recursive function must have the following properties:


    +   1. There must be certain criteria, called base criteria for which the function
    does not call itself.

    2. Each time the function does call itself (directly or indirectly); the argument
    of the function must be close to a base value.


    # Principles of Recursion


    Recursion is implemented through the use of functions. A function that contains
    a function call to itself or a function call to a second function which eventually
    calls the first function, is known as a **recursive function.**


    Two important **conditions** must be satisfied by any recursive function


    +   1. Each time a function calls itself it must be closer, in some sense to a
    stopping solution.'
