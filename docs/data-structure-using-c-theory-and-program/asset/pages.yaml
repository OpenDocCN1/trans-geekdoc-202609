    manipulate. However, black boxes may fail to elucidate elementary mechanisms or
    be detailed enough to realistically validate the model. Top down approach starts
    with the big picture. It breaks down from into smaller segments


    ![](img/3d5da05d64722faaa72fdc4daca105f9_20_0.png)


    Figure 7: Representation of Top down Approach


    **Bottom-Up Approach:** A bottom-up approach is the piecing together of systems
    to give rise to more complex systems, making the original subsystems of the emergent
    system. Bottom-up processing is a type of information processing based on incoming
    data from the environment to form a perception. From a Cognitive Psychology perspective,
    information enters the eyes in one direction (sensory input, or the “bottom”),
    and is then turned into an image by the brain that can be interpreted and recognized
    as a perception (output that is “built up” from processing to final cognition).
    In a bottom-up approach the individual base elements of the system are first specified
    in great detail. These elements are then linked to larger subsystems, which then
    in turn are linked, sometimes in many levels, until a complete top-level system
    is formed. This strategy often resembles a “seed” model, by which the beginnings
    are small but eventually grow in complexity and completeness. However, “organic
    strategies” may result in a tangle of elements and subsystems, developed in isolation
    and subject to local optimization as opposed to meeting a global purpose


    ![](img/3d5da05d64722faaa72fdc4daca105f9_20_1.png)


    Figure 8: Representation of Bottom-up Approach'
