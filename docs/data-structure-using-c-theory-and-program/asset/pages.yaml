    Data Structure C


    +   1. The size of arrays cannot be increased or decreased during execution.

    2. The elements in an array are stored in contiguous memory locations.

    3. The operations like insertion of a new element in an array or deletion of an
    existing element after the specified position.


    Linked list can be used to overcome these limitations.


    +   1. A linked list can grow or shrink during the execution of program.

    2. There is no problem of shortage of memory as the nodes are stored in different
    memory locations.

    3. In different operations insertion and deletion no shifting of nodes is required.


    # POINTS TO REMEMBER


    +   1. A linked list is a linear collection of data elements called as nodes in
    which linear representation is given by links from one node to another.

    2. A linked list is a data structure which can be used to implement other data
    structures as stacks, queues, and their variations.

    3. Before we insert a new node in linked lists, we must check for overflow condition,
    which occurs when no free memory cell is present in the system.

    4. Before we delete a node from a linked list, we must first check for underflow
    condition which occurs when we try to delete a node from a linked list that is
    empty.

    5. In a circular linked list, the last node contains a pointer to the first node
    of the list.

