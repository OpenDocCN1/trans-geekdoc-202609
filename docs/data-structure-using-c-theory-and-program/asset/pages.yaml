- pgno: 299
  md: '# Chapter 6 Trees


    the B* tree and B+ tree. The B-tree guarantees at least 50% storage utilisation
    that is any given time, the tree has of nodes at least 50% full. The B+ tree is
    a slightly different data structure, which in addition to indexed access, also
    allows sequential data processing and stores all data in the lowest level of the
    tree.


    One of the major drawbacks of the B-tree is the difficulty of traversing the keys
    sequentially. B+ tree retains the rapid random access property of the B-tree,
    while also allows rapid sequential access. In the B+ tree, all keys are maintained
    in leaves and are replicated in non-leaf nodes to define the paths for locating
    individual records. The leaves are linked together to provide a sequential path
    for traversing the keys in the tree. The B+ tree is called a balanced tree because
    every path from the root to leaf node is the same length. A balance tree means
    that all searches for individual values require the same number of nodes to be
    read from the disk.


    # B+ Tree


    +   (i) is a structure of nodes linked by pointers

    (ii) is anchored by a special node called the root and bounded by leaves

    (iii) has a unique path to each leaf, and all paths are of equal length

    (iv) store keys only at leaves, and stores reference values in other, internal
    node

    (vi) guides key search, via the reference values from the root to the leaves


    # B+ tree of order M (M>3) is a M-ary tree with the following properties:


    +   (i) The data items are stored at leaves.

    (ii) The root is either a leaf or between two M children.

    (iii) Node

    (a) The (internal node non leaf) stores up to M-1 keys (redundant) to guide the
    searching; ki represents the smallest key in sub tree i+1.

    (b) All nodes (except the root) between [M/2] and M children.

    (iv) Leaf:

    (a) A leaf between [L/2] and L data items, for some L (usually L << M, but we
    will assume M=L in most examples).

    (b) All leaves are at the same depth.

    (v) Less disk accesses due to fewer levels in the tree.

    (vi) B+ tree provides faster sequential access of data.'
