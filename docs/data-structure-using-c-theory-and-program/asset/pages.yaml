    # Linked List Representation of a Sparse Matrix


    Representing a sparse matrix as an array of 3-tuples. we need to know the number
    of non-zero terms in each of the sparse matrices. As a result, it is not possible
    to predict the size of the resultant matrix before hand. Instead of an array,
    we can represent the sparse matrix in the form of a linked list. The linked list
    representation is maintained for each column as well as each row of the matrix,
    i.e., if the matrix is of size 4 x 4, then there would be 4 lists for 4 columns
    and 4 lists for 4 rows. A node in a list stores the information about the non-zero
    element of the sparse matrix. The head node for a column list stores the column
    number, a pointer to the node which comes first in the column and a pointer to
    the next column head node. A head node for a row list, a pointer to the node,
    which comes first in the row list, and a pointer to the next head node.


