  md: '# Introduction to Array


    # 2.1 ARRAY


    Arrays are most frequently used in programming. Mathematical problems like matrix,
    algebra, etc can be easily handled by arrays. An array is a collection of similar/homogenous
    data elements described by a single name. Each element of an array is referenced
    by a variable or value, called index. If an element of an array is referenced
    by single subscript, then the array is known as one-dimensional array or linear
    array. If an element of an array is referenced by two subscripts, then the array
    is known as two-dimensional array. Arrays whose elements are referenced by two
    or more subscripts are called multi-dimensional arrays.


    # Definition


    An array can be defined as the combination of homogenous elements with consecutive
    index numbers and successive memory locations. The values of an array are called
    elements of that array. The general syntax of an array is


    ```

    <<Data type >> variable name [size];

    Example of one-dimensional array

    Int arr[5] = {11, 22, 33, 44, 55};

    Char arr[5] = "Talha";

    Float arr[5] = {10.5, 20.5, 30.5, 40.5, 50.5};

    ```


    The data type contained in the array could be int, char, float etc and the size
    indicates the maximum number of elements that can be stored inside the array.
    So, when we declare an array, we will have to assign a type as well as size. For
    example, when we want to store 5 integer values, then we can use the following
    declaration.


    ```

    int arr[5];

    ```'
