- pgno: 231
  md: '# Rule 1:


    An element of higher priority is processed before any element of lower priority.


    # Rule 2:


    Two elements with the same priority are processed to the order in which they were
    inserted to the queue.


    # Types of Priority Queues


    There are two types of priority queues:


    +   1. Ascending Priority queue

    2. Descending priority queue.

    1. **Ascending priority queue** elements can be inserted in an ascending order.
    But, while deleting elements from the queue a small element can only to be deleted
    first.

    2. **Descending priority queue** elements are inserted in descending order while
    deleting elements from the queue a largest element should be deleted.


    # Representation of the Priority Queue


    There are various ways of maintaining a priority queue. These are:


    +   * One way linked list.

    * Multiple queues, one for each priority.

    * Maximum or minimum heap.


    # One way List Representation


    In this representation each node of the linked list will have three fields.


    +   1. A Priority Number PN

    2. An information field INFO

    3. A link to next node LINK.


    | Priority | Info | Link |


    Figure Structure of a node in priority queue


    Operation in priority queue


    +   1. Add operation

    2. Delete operation'
