    # Deletion in Multi-Way Search Tree


    Let K a key to be deleted from the M-way search tree. To delete the key we proceed
    as one would search for the key. Suppose the node accommodating K is as follows.


    +   1. If ($A_i=A_j=$ NULL) then delete K.

    2. If ($A_i \neq$ NULL, $A_j \neq$ NULL) then choose the largest of the key elements
    $K''$ in the child node pointed to by Ai delete the key K'' and replace K by $K''$.
    Obviously delete of $K''$ may call for subsequent replacements and therefore deletions
    in similar manner, to enable the key $K''$ moves up the tree.

    3. If ($A_i=$ NULL, $A_j \neq$ NULL) then choose the smallest of the key elements
    $K''''$ from the sub tree pointed to by Ai delete “K” and replace K by “K”. Again
    delete of “K” may trigger subsequent replacements and deletions to enable key
    “K” move up the tree.

    4. If ($A_i \neq$ NULL, $A_j \neq$ NULL) then choose the largest of the key elements
    $K''$ in the sub tree pointed to by Ai or the smallest of the key elements “K”
    from the sub tree pointed to by $A_j$ to replace K. As mentioned before move $K''$
    or $K''''$ may call for subsequent replacements and deletions.


