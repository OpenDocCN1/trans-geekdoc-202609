  md: '# Chapter 1 Introduction to Data Structures


    **Searching**: finding the location of the record with a given key value, or finding
    the locations of all records, which satisfy one or more condition in the data.


    **Sorting**: arranging the data elements in some logical order *i.e.* in ascending
    and descending order.


    **Merging**: combine the different data elements into a single set of data element.


    # 1.4 OVERVIEW OF VARIOUS DATA STRUCTURE Array


    The simplest type of data structure is a linear array and most often it is the
    only data structure that is provided in any programming language. An array can
    be defined as a collection of homogenous elements, in the form of index or value,
    stored in consecutive memory locations. An array always has a predefined size
    and the elements of an array are referred by means of index or value. An array
    is a collection of variables of the same data type that share a common name. The
    general syntax of an array is as variable-name[SIZE].


    | a[0] | a[1] | a[2] | a[3] | a[4] |


    # Stack


    A stack is an ordered list elements. Insertion in a stack is done using PUSH function
    and removal from a stack is done using POP function. there are only two basic
    operations possible on a stack.


    +   (i) PUSH: Insert an element or value into a stack.

    (ii) POP: Retrieve an element or value into the stack.

    Stack is also called as LIFO (Last-In-First-Out).


    ![](img/3d5da05d64722faaa72fdc4daca105f9_17_0.png)


    > Figure 2: Representation Diagram of Stack


    # Queue


    A queue is an ordered list in which all insertions can take place at one end called
    the REAR and all deletions take place at the other end called the FRONT. The two
    operations that are possible in a queue are insertion and deletion. Queue is also
    called FIFO (First-In-First-Out).


    | 0 1 2 3 4 5 6 |

    | T A L H A | | | |


    ![](img/3d5da05d64722faaa72fdc4daca105f9_17_1.png)


    > Figure 3: Representation of Queue


