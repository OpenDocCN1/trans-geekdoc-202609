    \ front and from there. That is the idea of an interpolation search. Instead of\
    \ cutting the search space by a fixed half, we cut it by an amount that seems\
    \ most likely to succeed. This amount is determined by interpolation.\n\nConsider\
    \ an array A of elements and the elements are uniformly distributed. Initially,\
    \ as binary search, low is set to 0 and high is set to n-1.\n\nNow we are searching\
    \ an element key in an array A[low] and A[high]. The key would be expected to\
    \ be at mid.\n\nMid = low + (high - low) * ((key - A[low])/A[high] - A[low])\n\
    \nIf key is lower than A[mid], reset high to mid -1; else reset low to mid +1.\
