  md: '# 4

    Stack


    # 4.1 INTRODUCTION


    Stack is a specialized data storage structure (Abstract data type). It has two
    main functions-push and pop. Insertion in a stack is done using push function
    and removal from a stack is done using pop function. Stack allows access to only
    the last element inserted hence, an item can be inserted or removed from the stack
    from one end called the top of the stack. It is therefore, also called Last-In-First-Out
    (LIFO) list. Stack has three properties:


    +   (a) Capacity stands for the maximum number of elements stack can hold.

    (b) Size stands for the current size of the stack.

    (c) Elements are the array of elements.


    The Linear data structure such as array and linked list allows us to delete and
    insert an element at any place in the list, either at the beginning or at the
    end or even in the middle. However, sometimes it is required to permit the addition
    or deletion of elements only at one end. That is either at the beginning or at
    the end. Stack and queue are two types of data structures in which the addition
    or deletion of an element is done, rather than in the middle. A stack is a linear
    data structure in which all insertions and deletions are made at one end, called
    the top of the stack. It is very useful in many applications such as:


    +   * We see stack (pile) of plates in restaurant, stack of books in bookshop.

    * Even a packet of papers is also a stack of paper-sheet. A book is also a stack
    of written papers.

    * When anybody takes a plate from a stack of plates, he takes it from the top.'
