  md: '![](img/3d5da05d64722faaa72fdc4daca105f9_241_0.png)


    # # 6.1 INTRODUCTION


    So far we have studied about array, stack, queue and linked lists, which are known
    as linear data structures. These are termed as linear because the elements are
    arranged in a linear fashion. There are many applications in real life situations
    that make use of non-linear data structure such as trees and graphs. Tree is a
    data structure that allows you to associate a parent-child relationship between
    various pieces of data and thus allows us to arrange our records, data and files
    in a hierarchical fashion. Consider a tree representing your family structure.


    ![](img/3d5da05d64722faaa72fdc4daca105f9_241_1.png)


    **Figure:** General Tree


    # # 6.2 BASIC TERMINOLOGY RELATED TO TREE


    +   **Node:** Each element of the tree is called a node. This is the main component
    of any tree structure. It stores the actual data with links to other nodes.


    +   **Root:** A root is a specially designated node in a tree. Root is a node
    which has no parent. There can be only one root in a tree.


    +   **Parent:** The parent of the node is the immediate predecessor of that node.


    +   **Child:** The immediate successors of a node are called children. A child
    which is placed at the left side is called the left child and a child which is
    placed at the right side is called the right child.


    +   **Degree of Node:** The number of sub-trees of a node in a given tree is called
    degree of that node. Sub tree represents descendants of a node.


    +   **Terminal Node:** A node with degree zero is called a terminal node or a
    leaf.'
