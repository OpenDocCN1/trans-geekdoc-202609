    # 2. POP Operation


    The process of deleting an element from the top of the stack is called pop operation.
    After every pop operation the stack is decremented by 1. Finally, when all the
    elements are deleted, top points to bottom of the stack. When the stack is empty,
    it is not possible to delete any element and this situation is called stack underflow.
    Thus, if there is no element on the POP OPERATION stack and the Pop operation
    performed then this will result in


