  md: '# 5

    Queues


    #  5.1 INTRODUCTION


    Queues arise quite naturally in the computer for solution of many problems. Perhaps
    the most common occurrence of a queue in Computer Applications is for the scheduling
    of jobs. The name “queue” likely comes from the everyday use of the term. A real
    time example for a queue is people standing in a queue for billing in a shop,
    railway ticket counter, entry point in the shopping mall, etc. The first person
    in the queue will be the first person to get to service. Similarly the first element
    inserted in the queue will be the first one that will be retrieved and hence a
    queue is also called the First-in-Out (FIFO).


    Queue is a linear list which has two ends, one for insertion of elements and other
    for deletion of elements. The first end is called ‘Rear’ and the later is called
    ‘Front’. Elements are inserted from Rear End and Deleted from Front End. Queues
    are called First-In-First-Out(FIFO) List, where the first element in a queue will
    be the first element out of the queue.


    It is a homogeneous collection of elements in which new elements are added at
    one end rear, and the existing elements are deleted from other end called front.


    Push operation will insert (or add) an element to queue, at the rear end, by incrementing
    the array index. Pop operation will delete (or remove) from the front end by decrementing
    the array index and will assign the deleted value to a variable. Total number
    of elements present in the queue is front-rear+1, when implemented using arrays.


    Example: Suppose we have an empty queue, with 8 memory cells:


    | 0 | 1 | 2 | 3 | 4 | 5 | 6 | 7 |

    |---|---|---|---|---| | | |'
