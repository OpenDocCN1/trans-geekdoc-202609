    This is a very expensive operation! O(N) since there are N elements to rehash
    the table size is roughly 2N. This is though since it doesn''t happen that often.


    The question arises when the rehashing should be applied:

    Some possible:


    +   - once the table becomes half full

    - once an insertion fails

    - once a specific load factor has been reached, where load factor is the ratio
    of the number of elements in the hash table to the table size


