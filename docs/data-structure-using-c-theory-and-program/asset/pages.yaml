    +   1. A stack is a linear data structure in which elements are added and remove
    only from one end, which is called the top. Hence, a stack is called a LIFO data
    structure as the element is inserted last is the first one to be taken.


    +   2. In the computer''s memory, stacks can be implemented using either linked
    lists or single arrays.


    +   3. Infix, prefix, and postfix notations are different but equivalent notations
    of writing algebraic expressions.


    +   4. In postfix notation, operators are placed after the operands, whereas in
    prefix notation, operators are placed before the operands.


    +   5. Postfix notations expression that is scanned from left to right. If the
    character is an operand, it is pushed onto the stack. Else, if it is an operator,
    the top two values are popped from the stack and the operator is applied on these
    values. The result is pushed onto the stack.


    +   6. Multiple stacks means to have more than one stack in the same array of
    sufficient size.


