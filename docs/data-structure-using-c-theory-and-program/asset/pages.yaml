- pgno: 290
  md: '# 6.23 APPLICATIONS OF RED-BLACK-TREE


    Red-black trees are efficient binary search tree, they offer worst case time guarantee
    for insertion, deletion, and search operations. Red-black trees are not only valuable
    in time-sensitive applications as real-time applications, but are also preferred
    to be used as a building block in other data structures which provides worst-case
    guarantee.


    # B-Tree and its Variants


    All the data structures discussed so far data stored in the internal memory and
    hence support internal information retrieval. However, to favour retrieval and
    manipulation of data stored in external memory viz., storage devices such as disks
    etc. There is a need for some special data structures as M-way search trees B-trees
    and B*


    # Why do we need another tree structure?


    +   1. In databases, the data is too large to fit in memory; therefore, it is
    stored on secondary storage (disks or tapes).

    2. Disk access is very expensive; the disk I/O takes milliseconds while CPU operation
    takes nanoseconds i.e; CPU is one million times faster.

    3. When dealing with external storage the disk accesses dominate the running time.

    4. Balance binary search trees (AVL & Red-Black) have good performance if the
    entire data can fit in the memory.

    5. These trees are not optimised for external storage and require many disk accesses,
    thus give poor performance for very large data.

    6. Data is transferred to and from the disk in blocks.

    7. To reduce disk accesses.

    (a) Reduce height by increasing the number of children of a node.

    (b) Store multiple records in a block on the disk.

    8. To achieve above goals we use Multi way (M-way) search tree, which is a generalisation
    of BST, binary search tree.


    ![](img/3d5da05d64722faaa72fdc4daca105f9_290_0.png)


    Figure: 4-way Search Tree'
  merge: -1
  img_proc: true
