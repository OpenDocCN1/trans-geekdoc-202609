- pgno: 301
  md: '# Insertion into a B+ Tree


    In order to insert a key into a B+ Tree, first a B+ Tree search is performed to
    find the correct location for the key. Actually, the procedure to insert a new
    key value into a B+ Tree is almost as for B - Tree. The sequence of steps required
    to insert a node in a B+ Tree are as follows:


    +   1. The search operation is used to find the leaf node in which the value of
    node has to be inserted.

    2. If the key value already exists in a leaf node, no more insertion is needed.
    Else if the said key value does not exist, insert the value in the leaf node in
    an ordered fashion.

    3. When a node is split, the middle key is retained in the leaf half-node as well
    as being promoted to the father.


    # Deletion from a B+ Tree


    The sequence of steps required to delete a key value from the B+ Tree is as follows:


    +   1. Search the B+ Tree for the key value.

    2. If the key value is in the B+ Tree, remove it from the tree as that of B Tree.

    3. When a key value is deleted from a leaf there is no need to delete key from
    the index set of the key. That key value still can direct searches to proper leaves,
    since it is still a valid separator between the keys in the nodes below.


    # Difference between B-Tree and B+ Tree


    | S.No | B-Tree | B+ Tree |

    | --- | --- | --- |

    | 1 | Data pointers are stored in all nodes. | Data printers are stored only in
    leaf nodes (sequential set). |

    | 2 | Search can end at any node. | Search always ends at leaf node. |

    | 3 | No redundant keys. | Redundant keys may exist. |

    | 4 | Slow sequential access. | Efficient sequential access. |

    | 5 | Higher trees. | Flatter trees. No data pointers in index set nodes. |


    # 6.30 APPLICATION OF TREES


    +   1. Trees are used to store simple as well as complex data.

    2. Integer value, character value and complex data means a structure or a record.'
