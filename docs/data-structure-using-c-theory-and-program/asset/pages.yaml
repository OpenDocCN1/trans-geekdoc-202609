- pgno: 244
  md: 'Leaf node: A node that has no children is called a leaf node or a terminal
    node.


    Similar binary trees: Two binary trees T and T'' are said to be similar if both
    these trees have the same structure.


    Copies: Two binary trees T and T'' are said to be copies if they have similar
    structure and if they have same content at the corresponding nodes.


    Edge: It is the line connecting a node n to any of its successors. A binary tree
    of n nodes has n-1 edges every node except the root node connected to its parent
    via an edge.


    Path: A sequence of consecutive edges.


    Depth: The depth of a node N is given as the length of the path from the root
    R to the node N.


    Height of a tree: It is the total number of nodes on the path from the root node
    to the deepest node in the tree. A tree with only a root node has a height of
    1.


    # 6.5 PROPERTIES OF BINARY TREES


    +   1. The number of external nodes in binary tree is equal to number of internal
    nodes+1.


    +   2. The number of external nodes is at least h+1, where h is the height of
    the tree, and at most 2h.


    +   3. The height h, of a binary tree with n nodes is at least logn+1 and at most
    n.


    +   4. A binary tree with n nodes has exactly n-1 edges.


    # 6.6 TYPES OF BINARY TREES


    +   1. Strictly Binary Tree


    +   2. Extended Binary Tree (2-Tree)


    +   3. Complete Binary Tree


    +   4. Almost Completed Binary Tree


    # 1. Strictly Binary Tree


    A tree is a finite set of elements that is either empty or partitioned into three
    disjoint subsets. The first subset contains a single element called the root of
    the tree. The other two subsets are themselves binary trees, called the left and
    right subtrees of the original tree. Below given tree consists of 7 nodes and
    the root node is node A. Its left subtree is rooted at B and its right subtree
    is rooted at C. This is indicated by the two branches emanating from A to B on
    the left and A to C on the right.


    ![](img/3d5da05d64722faaa72fdc4daca105f9_244_0.png)


    Fig: Strictly Binary Tree'
