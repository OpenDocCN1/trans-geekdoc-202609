    # 6.12 HUFFMAN’S TREE


    Suppose, we have n nodes and their weights the Huffman algorithm is used to find
    a tree with minimum-weighted path length. The process essentially begins by merging
    (or adding the values) of two smallest weights among n valued nodes and hence
    to the creation of a new node, such that the new node’s weight is equal to the
    sum of the merged children weight. This process is repeated until the tree has
    only one node which is known as the Huffman tree.


    The Huffman’s algorithm can be implemented using a priority queue. Huffman tree
    is built from bottom up to top down ie the creation of trees from leaf nodes and
    proceeds upwards.


