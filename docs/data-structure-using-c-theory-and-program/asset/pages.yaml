    # 2.7 SPARSE MATRICES


    There are special types of matrices in which most of the elements are “0s” (Zeros).
    That is, if lot of elements from a matrix have a value 0 then the matrix is known
    as a sparse matrix.


    There is no clear definition of when a matrix is sparse and when it is not, it
    is a concept, we can all recognise intuitively. If the matrix is sparse, we must
    consider an alternate way of representing it rather than the normal row-major
    or column-major arrangement. This is because a sparse matrix is a matrix containing
    very few non-zero elements. If the user stores the entire matrix including elements
    there is wastage of storage space.


    Consider a 1000 × 1000 matrix have 5 non-zero elements per row then the non-zero
    percentage of the matrix can be calculated as:


    ```

    $\\{ \frac{5 \times \text{non-zero element}}{\text{Row } 1000 \times 1000 \text{
    element}} \right\ \times 1000 \text{ rows} \times 100\% = 0.005\% \text{ non-zero
    elements}$

    ```'
