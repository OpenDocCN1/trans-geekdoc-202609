  md: '# Graph G


    ![](img/3d5da05d64722faaa72fdc4daca105f9_334_0.png)


    We found spanning trees off one complete graph. A complete undirected graph can
    have maximum n^{n-2} number of spanning trees, where n is the number of nodes.
    In addressed example, n is 3, hence 3^{3-2} = 3 spanning trees are possible.


    # General properties of spanning tree


    We now understand that one graph can have more than one spanning trees. Below
    are few properties of spanning tree of given connected graph G –


    +   * A connected graph G can have more than one spanning tree.

    * All possible spanning trees of graph G, have same number of edges and vertices.

    * Spanning tree does not have any cycle (loops)

    * Removing one edge from spanning tree will make the graph disconnected i.e. spanning
    tree is minimally connected.

    * Adding an edge to a spanning tree will create a circuit or loop i.e. spanning
    tree is maximally acyclic.


    # Mathematical properties of spanning tree


    +   * Spanning tree has n-1 edges, where n is number of nodes (vertices)

    * From a complete graph, removing maximum e-n+1 edges, we can construct a spanning
    tree.

    * A complete graph can have maximum n^{n-2} number of spanning trees. So, we can
    conclude that spanning trees are subset of a connected Graph and disconnected
    Graphs do not have spanning tree.


    # Application of Spanning Tree


    Spanning tree is basically used to find minimum paths to connect all nodes in
    a graph. Common application of spanning trees is –


    +   * Civil Network Planning'
