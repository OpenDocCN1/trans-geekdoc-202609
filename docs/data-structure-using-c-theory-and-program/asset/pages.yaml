    # ## 5.4 DOUBLE ENDED QUEUE (DE-QUEUE)


    Another type of queue is called de-queue. In de-queue, both insertion and deletion
    operations are performed at either end of the queue. That is, we can insert an
    element from rear end or the front end. Also deletion is possible from both ends.


    ![](img/3d5da05d64722faaa72fdc4daca105f9_227_0.png)


    Figure Structure of a De-Queue


    # Types of De-queue


    De-queue can be of two types


    +   1. Input-restricted queue

    2. Output-restricted queue


    # ## 1. Input-restricted queue


    In input-restricted queue, element can be added at only one end but we can delete
