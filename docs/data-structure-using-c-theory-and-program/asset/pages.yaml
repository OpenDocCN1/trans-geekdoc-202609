  md: '# Chapter 6 Trees


    C has 4 descendants – H, J, K and L

    G has no descendants


    **Forest**: A forest is a disjoint union of trees. A set of disjoint (or forests)
    is obtained by deleting the root and edges connecting the root node to nodes at
    level 1. We have already seen that every node of a tree is the tree of some sub-tree.
    Therefore, all the subtrees immediately below form a forest. A forest can also
    be defined as an ordered set of zero or more general trees. While a general tree
    must have a root, a forest on the other hand may be empty because by definition
    it is a set, and can be empty.


    # 6.3 BINARY TREES


    A binary tree is made of nodes, where each node contains a “left” reference, a
    “right” reference, and a data element. The topmost node in the tree is called
    the root.


    Every node (excluding the root) in a tree is connected by a directed edge from
    exactly one other node, this node is called a parent. On the other hand, each
    node can be connected to arbitrary number of nodes, called children. Nodes with
    no children are called leaves, or external nodes. Nodes which are not leaves are
    called internal nodes. Nodes with the same parent are called siblings.


    ![](img/3d5da05d64722faaa72fdc4daca105f9_243_0.png)


    # 6.4 TERMINOLOGY RELATED TO BINARY TREE


    **Parent**: If N is any node in tree T that has left successor S1 and right successor
    S2, then N is called the parent of S1, and S2. Correspondingly S1 and S2 are called
    the left child and the right child of N. Every node other than the root node has
    a parent.


    **Level number**: Every node in a binary tree is assigned a level number. The
    root node is defined to be at level 0.The left and right child or the root node
    have a level number 1. Similarly, every node is at one level higher than its parents.
    So all nodes are defined to have level number as parent’s level number + 1.


    **Degree of a node**: It is equal to the number of children that a node has. The
    degree of a leaf node is zero.


    **Sibling**: All nodes that are at the same level and share the same parent are
    called siblings.'
