- pgno: 409
  md: '# Hashing Techniques


    ## 9.1 INTRODUCTION

    We have seen different searching techniques where search time basically dependent
    on the number of elements. Sequential search, binary search and all the search
    trees totally depend on number of elements and key comparisons involved. Suppose,
    all the elements are in an array having size n. Let us say all the keys are unique
    and in the range 0 to n-1. Now we are storing the records in array based on the
    key where array index and keys are same. Now we can access the record in constant
    time and comparisons.


    ## 9.2 HASH TABLES

    Hash tables support one of the most efficient types of searching: hashing. Fundamentally,
    a hash table consists of an array in which data is accessed via a special index
    called a key. The primary idea behind a hash table is to establish a mapping between
    the set of all possible keys and positions in the array using a hash function.
    A hash function accepts a key and returns its hash value. Keys vary in type, but
    coding are always integers. Since both computing a hash value and indexing into
    an array can be performed in constant time, the beauty of hashing is that guarantee
    that no two keys will generate the same hash code, the resulting hash table is
    said to be directly addressed. This is ideal, but direct addressing is rarely
    possible in practice. Typically, the number of entries in a hash table is small
    relative to the universe of possible keys. Consequently, most hash functions map
    some keys to the same position in the table. When two keys map to the same position,
    they collide. A good hash function minimises collisions, but we must still be
    prepared to deal with them.'
