    # POINTS TO REMEMBER


    +   1. Searching refers to finding the position of a value in a collection of
    values.

    2. In bubble sorting, consecutive adjacent pairs of elements in the array are
    compared with each other.

    3. Selection sort works by moving the smallest value and placing it in the first
    position.

    4. Insertion sort works by moving the current data element past the already sorted
    values and repeatedly interchanging it with the proceeding value until it is in
    the correct place.

    5. Merge sort is a sorting algorithm that uses the divide, conquer and combine
    algorithm paradigm.

    6. Heap sort an array in two phases. In the first phase, it built a heap of the
    given array. In the second phase, the root element is deleted repeatedly and inserted
    into an array.

    7. Quick sort works using divide-and-conquer strategy.

    8. Radix sort is a linear sorting algorithm that uses the concept of sorting names
    in alphabetical order.

    9. Linear search works by comparing the value to be searched with every element
    of the array one by one is a sequence until a match is found.

    10. Binary search works efficiently with a sorted list. In this algorithm, the
    value to be searched is compared with the middle element of the array segment.'
