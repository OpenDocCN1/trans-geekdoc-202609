    # 7.12 WARSHALL’S ALGORITHM


    Let G a directed graph with n nodes, V₁, V₂, ..., V_�. Suppose we want to find
    the path matrix P of the graph G. Warshall gave an algorithm for this purpose
    that is much more efficient than calculating the powers of the adjacency matrix
    A.


    We define n square Boolean matrices P₀ P₁, ..., Pn as follows. Let Pi[i][j] denote
    the ij entry of the matrix Pₖ. Then we define:


    Pi[i][j] = {1 if there is a simple path from Vi to Vj which does not use any other
    nodes except V₁, V₂, ..., Vₖ.;0.otherwise


    In other words:

    P₀ [i][j] = 1 if there is an edge from Vi to Vj

    P₁ [i][j] = 1 if there is a simple path from Vi to Vj which does not use any other
    nodes except possible V₁.'
