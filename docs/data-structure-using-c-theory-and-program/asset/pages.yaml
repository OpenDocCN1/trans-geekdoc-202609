    # 3.3 SINGLE LINKED LIST


    In a single linked list each node contains only one link which points to the next
    subsequent node in the list. In other words, each node has a single pointer to
    the next node and in the last node a NULL pointer representing that there are
    no more nodes in the list.


    ![](img/3d5da05d64722faaa72fdc4daca105f9_55_0.png)


