- - '#'
  - 关于这本书
- - '##'
  - 我将本书分为三个部分。
- - '###'
  - 第 1 章 从对 `bitcoin` 协议的总结和概述开始，解释了 `bitcoin` 白皮书中描述的其定义。它从电子现金系统的历史开始，介绍了什么是区块链、什么是交易、什么是区块，以及区块链的关键方面。它还介绍了
    `bitcoin` 不可篡改的公共账本及其属性。
- - '###'
  - 第 2 章 深入探讨了 `bitcoin` 运行的独特性及其使其能够诚实运行的经济模型。介绍了系统中内置货币的网络结构和用途，并描述了 `bitcoin`
    的网络结构，随后详细讨论了去中心化的理念及其含义。
- - '###'
  - 第 3 章 回到基础，从解释 `bitcoin` 中使用的数学和密码学概念开始。它涵盖了 `bitcoin` 协议中使用的 `ECDSA` 基础设施细节，以及签名和签名验证的工作原理。本章还涵盖了生成
    `bitcoin` 地址的步骤，以及公私钥中的工作原理。
- - '###'
  - 第 4 章 讨论了 `UTXO` 系统。它解释了钱包的类型及其用途，以及基于账户的系统。本章还讨论了 `SPV`（简单支付验证）的细节。
- - '###'
  - 第 5 章 深入研究 `bitcoin` 中名为 `Script` 的内部编程语言。它详细说明了作为脚本部分的各种 `OP Codes`，以及在执行交易时如何处理输入（input）和输出（output）。
- - '###'
  - 第 6 章 通过讨论矿工和挖矿结束了 `第一部分`。它深入探讨了网络共识的基础、`BFT` 算法和区块创建过程，以及 `BTC` 和 `BCH` 等各种分支的历史。本章还简单介绍了挖矿作为一种业务的现状。
- - '##'
  - 本书的 `第二部分` 专注于 `bitcoin` 生态系统的现状。它讨论了应用开发领域正在发生的情况，这些开发运行在 `bitcoin` 区块链之上，也可以被任何应用的后端开发。
- - '###'
  - 第 7 章 从讨论名为 `Metanet` 的变革性应用协议开始。`Metanet` 是一种用于 `bitcoin` 协议之上的协议，作为身份和信息交换的方法。长期目标是让该协议成为一个可以在其构建应用程序的环境，让用户重新掌握其数据隐私，并摆脱目前基于广告的模式。
- - '###'
  - 第 8 章 讨论了随时间构建的各种应用层协议，这些协议构成了基础基础设施，可以使用 `bitcoin` 区块链作为数据存储、交易和认证层来构建任何应用。
- - '###'
  - 第 9 章 查看区块链如何作为数据存储工作，并详细探索了 `BitDB` 框架及其查询语言。这是第一个使用区块链数据库的正式数据结构框架之一。我们还查看了有助于
    `bitcoin` 区块链 `CRUD` 操作的其他各种实用程序，它们都是 `BitDB` 框架的一部分。
- - '###'
  - 第 10 章 更多关注 `Planaria` 工具系统中的基础设施级协议，这些协议不仅专注于构建面向消费者的应用程序，也同样适用于构建大规模企业或政府应用。本章还将展望使用
    `bitcoin` 区块链进行应用开发的更大愿景，以及该技术提供的巨大可能性。
- - '###'
  - 第 11 章 带你进入一个领域，我们将浏览涵盖生活的各个领域、互联网贸易和业务建设中数百个项目的 `bitcoin` 应用开发生态系统，构建使用 `bitcoin`
    区块链以及我们讨论过的其他协议的解决方案。本章展示了我们目前为止讨论的理论如何在真实的消费者和业务/企业应用中实现。
