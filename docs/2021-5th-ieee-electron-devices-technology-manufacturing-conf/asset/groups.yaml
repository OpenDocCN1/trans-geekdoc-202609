    Two experiments were carried out to evaluate the applicability of ML in process
    tuning: (a) plasma etching for carbon films and (b) PEALD for SiO2 films. Profiles
    of the thickness were measured at 49 points within the wafer, where each RF power,
    pressure, gas flow rate and capacitance at each electrode were tuned.


    In some cases, the ML approach can be used as a supplement. For example, the engineer
    can proceed with the experiment by referring to the results of the ML approach.
    Once the key parameter is suggested via ML, the desired target in the extrapolation
    area is achievable by human judgment.


    # Results


    Fundamentally, learning can be transferred when the process conditions are similar.
    Thus, it is possible to build a database using data that are relatively easily
    obtain.


    # A. Optimization of Film-Thickness Nonuniformity


    # Conclusion


    As mentioned earlier, the PEALD film-thickness nonuniformity within a wafer was
    carried out by an engineer and by the ML approach, separately. Each variation
    of nonuniformity was attributed to the DOE initial conditions. The nonuniformity
    of each trial by the ML approach is shown in Fig. 4.


    The nonuniformity of PEALD film thickness and stress, the carbon etching and PEALD
    thickness profiles were optimized with the ML approach and successfully achieved
    their targets. Even if the database does not cover the target, the ML approach
    is still useful because it exploration of a new process.


    The engineer could not settle the nonuniformity after the five trials, which were
    effectively settled by the ML approach. Moreover, the range of nonuniformity by
    the ML approach at the second trial was 0.7%. These results suggest that the ML
    approach can find the optimum condition and settle the variation.


    # References


    +   [1] Y. Mo, S.-P. Ong, and G. Ceder, Chem. Mat., 24, no. 1, p. 15, 2012.


    +   [2] Y. Hinata, H. Hatakeyama, Y. Kumagai, L. A. Burton, H. Sano, Y. Muraba,
    S. Imura, and H. Hiramatsu, I. Tanaka, H. Hosono, and F. Oba, Nat. Commun., 7,
    11962-1, 2016.


    +   [3] O. Sasai, C. Oses, T. Coher, E. Gossett, S. Sartarlo, and A. Trohaft,
    Nat. Commun., 8, 1567, 2017.


    +   [4] C. Toher, C. Oses, and S. Sartarlo, arXiv:1805.03509, 2018.


    +   [5] B. Sanchez-Lelneg and A. Aspuri-Guzik, Science, vol. 361, no. 6440, p.
    360, 2018.


    +   [6] M. Chopra, Z. Zhang, J. Ekerdit, and Roger T Bonner, in Proceedings of
    the SPIE 9781, 97811, 2016.


    +   [7] S. Iwashita, N. Moriya, T. Tokuchi, M. Kagaya, N. Nero, and T. Hasegawa,
    J. Sci. Technol. A 36, p. 02155, 2018.


    # B. Stress Optimization


    Similarly stress optimization was performed by the engineer and the ML approach,
    with the results shown in Fig. 5. The condition obtained by the ML approach in
    uniformity optimization of TiO2 was transferred to this. After 52 attempts of
    optimizing the process based on the engineer''s knowledge (◇), the engineer was
    able to achieve the target stress of -100 MPa. In contrast, the conditions created
    by the ML approach ◊ met the target stress.


    # C. Optimizing Knot Profiles


    Figure 6 shows the results of the carbon etching profiles, which are defined as
    the differences in film thickness before and after plasma etching with three profiles.
    Figure 6 (a) shows the predicted profiles used by length model, and (b) shows
    the experimental results optimized by ML.


    Such tendency indicates the sensitivity of process distribution with the O2 flow
    rate. The O2 flow was suggested as the key parameter tuning the take-off position
    by the ML approach. Figure 7 shows the O2 flow dependence of the carbon etching
    processes.


