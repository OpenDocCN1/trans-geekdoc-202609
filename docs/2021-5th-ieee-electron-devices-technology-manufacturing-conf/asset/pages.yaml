- pgno: 1
  md: 'Two experiments were carried out to evaluate the applicability of ML in process
    tuning: (a) plasma etching for carbon films and (b) PEALD for SiO2 films. Profiles
    of the thickness were measured at 49 points within the wafer, where each RF power,
    pressure, gas flow rate and capacitance at each electrode were tuned.


    In some cases, the ML approach can be used as a supplement. For example, the engineer
    can proceed with the experiment by referring to the results of the ML approach.
    Once the key parameter is suggested via ML, the desired target in the extrapolation
    area is achievable by human judgment.


    # Results


    Fundamentally, learning can be transferred when the process conditions are similar.
    Thus, it is possible to build a database using data that are relatively easily
    obtain.


    # A. Optimization of Film-Thickness Nonuniformity


    # Conclusion


    As mentioned earlier, the PEALD film-thickness nonuniformity within a wafer was
    carried out by an engineer and by the ML approach, separately. Each variation
    of nonuniformity was attributed to the DOE initial conditions. The nonuniformity
    of each trial by the ML approach is shown in Fig. 4.


    The nonuniformity of PEALD film thickness and stress, the carbon etching and PEALD
    thickness profiles were optimized with the ML approach and successfully achieved
    their targets. Even if the database does not cover the target, the ML approach
    is still useful because it exploration of a new process.


    The engineer could not settle the nonuniformity after the five trials, which were
    effectively settled by the ML approach. Moreover, the range of nonuniformity by
    the ML approach at the second trial was 0.7%. These results suggest that the ML
    approach can find the optimum condition and settle the variation.


