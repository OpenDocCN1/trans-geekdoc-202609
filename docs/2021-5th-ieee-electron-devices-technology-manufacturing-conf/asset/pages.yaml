  md: '# # Machine Learning Approaches Optimizing Semiconductor Manufacturing Processes


    Tsuyoshi Moriya

    Tokyo Electron Limited, Tokyo, Japan, tsuyoshi.moriya@tel.com


    # ## Abstract


    This study was geared towards the optimization of semiconductor manufacturing
    processes through machine learning (ML) based on a regression algorithm. The nonuniformity
    of plasma-enhanced atomic layer deposition (PEALD) film thickness and PEALD film
    stress and the thickness etching profiles were demonstrated herein to successfully
    achieve their targets.

    (Keywords): Machine learning, plasma processing, and materials informatics)


    # ## Introduction


    In semiconductor manufacturing, a variety of tuning controls control the processes.
    Optimization of these processes is a serious problem due to the associated complexity
    thereof as well as the correlation between tuning parameter. ML has recently drawn
    the attention of engineers due to its promising characteristics as a powerful
    tool for the optimization of parameters [1–6].

    ML technique used is based on a regression algorithm for optimization, particularly
    for the deposition process and the plasma distribution control knob, the latter
    being related to the uniformity of film thickness and etch rate within a wafer,
    which are important properties in semiconductor manufacturing.


    # ## Experiment


    The ML approach adopted herein is given by algorithm of building regression models
    with parameters as explanatory variables, and the uniformity of film thickness
    and etch rate as objective variables. The experimental flow for the model is achieved
    in the following steps:


    +   1. Constructing a model with a dataset with the regression algorithm. The
    initial dataset is given by the design of experiments (DOE).

    2. Finding parameter combinations that satisfy the inputting target value of the
    objective variables and their models into the optimization algorithm.

    3. Optimizing the parameter combination outputs and comparing the experimental
    results with the optimized values.


    4. Registering the results of the experiment as a new learning dataset.


    Steps 1–4 were repeated until the desired result was achieved, as shown by the
    diagram in Fig. 1. In general, the optimization process starts from a small dataset
    and improves as data increase.


    This ML approach enabled the optimization of three different processes: film-thickness
    nonuniformity of PEALD SiO₂, film stress of PEALD SiO2 and parameters of the tuning
    distribution.


    By definition, film-thickness nonuniformity refers to the lr of thickness at 49
    points within a wafer. Nonuniformity aims to achieve a target value of zero. The
    base process is shown in Ref. [7]. In the experiment, capacitively coupled plasmas
    (CCPs) were ignited in an Ar/O2 gas mixture at 450Hz, RF power duration, and four
    gas rates were used.


    Process optimization was performed by an engineer and by application of the ML
    algorithm. After the fourth iteration, the uniformity and degree of convergence
    were evaluated. The engineer did not refer to the ML approach by the whole experiment
    and the database for ML. During the film stress optimization of PEALD SiO₂, the
    RF power, duration, and four gas rates were used, then as other parameters were.
    In this study, the film stress was from –100 MPa to zero.


    The process knobs were optimized for the control processes. Here turning profile
    was profiled to control the take-off of the thickness profile, which had not been
    achieved by conventional optimization methods. Figure 3 displays the target profiles,
    which could be described as flat, very edge high, and edge high. These processes
    were controlled by the prepared plasma electrode. Figure 2 shows the experimental
    setup of the prepared plasma electrode. In the Ar/O2 gas mixture, at a frequency
    of 13.56 MHz. Moreover, the plasma distribution was controlled by tuning the respective
    capacities of the center and outer (ring) electrodes.


