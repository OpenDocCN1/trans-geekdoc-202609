  trans: "\n 虽然数据泄露和损失对 Adobe 来说非常糟糕，但也有一个微小的好消息。从公司被盗的数据中，部分经过了加密，包括客户密码以及借记卡和信用卡号。加密数据是一种使用代码或密码来隐藏数据的方法。这样，即使未经授权的个人访问，他们也无法使用或理解它。由于\
    \ Adobe 对部分数据进行了加密，被盗信息中只有一部分对黑客来说具有价值。加密是该公司用于保护其系统中存储数据的工具之一。加密和密码学领域的行业专家 Rick\
    \ Robinson 表示：\n\n![](img/page_61-1.jpg)\n\n数据加密软件是可用于保护组织数据并防止未经授权的用户访问和读取的工具之一。\n\
    \n**今天的敌人是致力于偷取你的数据以获利的数据窃贼。如果他们无法获取你的数据并从中获利，他们就会寻找其他目标。加密数据代表了他们无法从中获利的逾越挑战。这种利用加密保护你的数据并防止其被犯罪分子使用的做法，是将密码学应用于业务的典范。**\n\
    \n# 创建与破解密码\n\n当组织需要加密和保护重要数据时，他们会寻求密码学家。密码学是一种通过使用代码来保护信息和通信的方法。只有授权接收信息的人才能读取和处理它。在当的数字世界中，密码学通常通过加密过程将普通文本（也称为明文）乱序转换为密文。然后，密码学通过解密过程将密文转换回明文。企业、军事组织和政府机构使用加密和密码学来保护数据和网络免受黑客和网络恐怖主义者的侵害。专业的密码学专家开发用于加密价值数据的算法、密码和安全系统。这些算法用于保护数据、互联网网页浏览以及电子邮件和信用卡交易等机密通信。\n\
    \n![](img/page_62-1.jpg)\n\n此图展示了如何使用加密算法对数据进行加密和解密，使其只有授权用户才能访问。\n\n虽然密码学领域的每个工作都不同，但密码学家通常保护信息免受拦截、复制、修改或删除。他们使用基于数学的加密方法。他们编写新算法来加密银行账户和信用卡信息等信息。密码学家分析密码学安全系统和算法中的弱点，并开发统计和数学模型来分析数据。密码学家还研究和测试新的密码学方法和应用。他们寻找组织通信系统（如无线网络、手机和电子邮件）中的漏洞，并确保通信不被非法访问或更改。除了加密敏感数据外，为军事、政府和执法机构工作的密码学家还可能分析和解码加密信息系统和编码系统中的任何隐藏信息。\n\
    \nChristof Paar 自 1995 年以来一直从事应用密码学工作，是马诸诸塞大学阿默斯特分校的兼职教授。根据 Paar 的说法，密码学是网络安全的核心。“加密算法是几乎每个安全解决方案的驱动力和心脏，”他在接受\
    \ IEEE Cyber Security 采访时说。Paar 一直致力于将密码学应用于联网汽车和车万一切（`V2X`）通信，即车辆与其他车辆（`V2V`）或路侧基础设施（`V2I`）进行交互。`V2V`\
    \ 通信有助于防止碰撞，而 `V2I` 通信有助于减少拥堵和污染。确保这些通信是安全且不被任何方式更改的，**密码学支持实时位置信息至关重要。例如，密码学支持\
    \ V2X 通信。**\n\n## 加密算法的类型\n\n加密算法主要分为三大类：\n\n- `密钥`（Secret key）或`对称加密`（symmetric\
    \ encryption）在加密和解密时使用同一个密钥。它主要用于保持数据私密。\n- `公钥`（Public key）或`非对称加密`（asymmetric\
    \ encryption）使用一个密钥加密，使用另一个密钥解密。它通常用于身份验证。\n- `哈希函数`（hash function）是一种可以在文件等数据上运行的算法，并能产生一个称为校验和的值。如果两个文件生成的校验和相同，则可以假设这两个文件也是相同的。\n\
    \n## 如何成为一名密码学家\n\n对于喜欢谜题、高等数学和计算机科学的人来说，密码学职业可能具有吸引力。大多数密码学家的职位要求候选人拥有数学、计算机科学、计算机工程或相关领域的学士学位。许多职位还要求数学或计算机科学的硕士或博士学位。此外，由于他们处理的是高度敏感的数据，某些工作要求密码学家拥有高级别的安全许可。对密码学感兴趣的高中学生可以学习数学、统计学、计算机科学和编程课程，为这一职业做准备。\n\
    \n密码学家需要强大的技术、数学和计算机技能。他们应该熟悉计算机体系、数据结构和算法。他们必须理解线性矩阵代数和离散数学。密码学专业人员还应该熟悉信息论、计算机安全和工程学。\n\
    \n在工作中，了解多种编程语言如 `C`、`C++`、`Python` 和 `Java`是有帮助的。此外，使用对称和非对称加密原理的技术技能也关重要，例如对称加密、哈希函数、密钥交换、数字签名等。\n\
    \n## 密码学家的就业前景\n\n密码学职业的就业前景预计非常好。根据劳工局（BLS）的数据，包括密码学专家在内的数学家和统计学家的预计将在 2016 年至\
    \ 2026 年增长 33%。电子商务的增长以及密码学家保护在线客户数据的需求是驱动密码学家需求的因素之一。\n"
