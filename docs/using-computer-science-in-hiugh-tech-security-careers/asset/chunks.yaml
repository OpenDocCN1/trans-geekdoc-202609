- fmt: '

    Students interested in penetration testing careers can gain valuable hands-on
    experience working in a security internship. In 2017, Tim Welles worked as a summer
    intern for Sword & Shield Enterprise Security, an information security consulting
    company. Welles, a student at the University of Tennessee majoring in computer
    science with a focus in cybersecurity, worked on a project to set up a programming
    function called a `wrapper` for a `hashcat` installation, a password cracking
    tool, in the company office. Welles said in an article on the Sword & Shield website:


    "The `hashcat` wrapper for distributed hashcracking project was a perfect pick
    for an intern such as myself. It gave me something to do that I feel will add
    value back to this company well beyond my time there, and accomplish work they
    needed to be done. At the same time, it taught me a lot about password cracking
    and `Linux` in general, as well as some general networking skills. The best part
    of the project was when I finished and the team actually started using it in their
    penetration testing services. This made me feel like I was making an impact on
    the company vs. working on a side project that would not be utilized very much."


    Welles plans to pursue a career in cybersecurity after he graduates.


    For one client, van der Baan found a system where he could manipulate the database
    and read files from the underlying operating system. Another error he discovered
    gave him the system’s code. When he downloaded it, he found a vulnerability that
    allowed him to execute whatever code he wanted—a weakness that could be very dangerous
    if found by a malicious hacker. “What we find and where we find it, what our end
    results are, completely depends on the system,” he said in an April 2016 article
    for *Computerworld UK.* By showing the client these vulnerabilities, van der Baan
    was able to help the client understand where it needed to strengthen its cyber
    defenses.


    ![](Images/page_39-1.jpg)


    Malicious hackers sometimes impersonate others over the phone to gain access to
    sensitive personal information, such as usernames and passwords.


    # HOW TO BECOME A PENETRATION TESTER


    For someone who is curious and has a talent for coming up with unique and sophisticated
    fixes for cybersecurity, a career in penetration testing may be a great fit. Most
    penetration testers have several years of relevant experience and at least a bachelor’s
    degree in computer science, information security, or a related field. These programs
    prepare students with skills in programming, networking, and cybersecurity. Students
    will take courses in areas such as computer forensics, disaster recovery, penetration
    testing, and more. High school students can prepare for a career in penetration
    testing by taking computer science and programming courses.


    Most careers in cybersecurity, including penetration testing, require strong technical
    and computer skills so that these professionals can hack into computer systems.
    Some employers require candidates to know specific programming languages, such
    as `C`, `C++`, `Java`, `PHP`, and `Python`. Because clients run different operating
    systems, penetration testers should know `Windows`, `UNIX`, and `Linux` operating
    systems. They should also have experience with web-based applications, network
    servers and networking tools, security tools, and security frameworks. Jeff Williams,
    chief technology officer and cofounder of Contrast Security, said in an April
    2018 article for *Forbes:*


    "You’ll definitely need a deep understanding of the technology you are testing.
    You don’t have to become an expert coder, but you should know enough to build
    simple applications using the technologies you want to test and comprehend the
    code for more complex apps. I suggest specializing in technologies that are widely
    used to build applications that people actually care about like `Java`, `.NET`
    and the major application frameworks."


    ![](Images/page_41-1.jpg)


    Teens attend a computer workshop where they learn how to write code and practice
    programming skills, which will be useful for a career in penetration testing.


    Candidates should also have a thorough understanding of security defenses and
    vulnerabilities. “Understanding security defenses like encryption, authentication,
    authorization, cross-site request forgery (`CSRF`) tokens, `session IDs`, `HTTP`
    headers, encoding/escaping and logging is critical,” said Williams in the *Forbes*
    article. He also recommends that candidates get practical experience finding and
    exploiting system vulnerabilities. Some employers also require penetration testers
    to earn ethical hacking or other technology security certifications.


    Penetration testers must be up-to-date on the latest methods and technologies
    hackers use, as well as the new security technologies. To do this, they can attend
    conferences where they meet with other professionals to discuss new attacks and
    security strategies.


    # THE JOB OUTLOOK FOR PENETRATION TESTERS


    The job outlook for penetration testers is very good. According to the BLS’s *Occupational
    Outlook Handbook,* employment of information security analysts, which includes
    penetration testers, is projected to grow 28 percent from 2016 to 2026. This growth
    rate is much faster than the average rate for all occupations.


    As the threats from cyberattacks become more frequent and sophisticated, organizations
    will need to make sure their cyber defenses are up to the task. “We need to stop
    dealing with cyber-attacks after the damage is done. We need to have foresight
    and prevent them from occurring in the first place,” said US representative C.
    A. Dutch Ruppersberger in a December 2014 article for *U.S. News &World Report.*
    As a result, the demand for penetration testers will grow as companies hire them
    to find and fix security weaknesses before a security breach occurs. Williams
    said in the article for *Forbes*:


    "The demand for skilled penetration testers will continue to rise. If you’re the
    kind of person who thrives on learning about all different kinds of systems and
    businesses and would be bored working on a single application for years, penetration
    testing might be for you."


    # CHAPTER FIVE: DEVELOPING THE SECURITY ARCHITECTURE


    All organizations need to protect their technology and computer networks. To do
    so, they must create a comprehensive strategy that includes security systems,
    policies, and procedures that work together seamlessly across an organization’s
    different users, systems, networks, and other technologies. The security architect
    takes on this challenge, designing, building, and maintaining high-tech computer
    systems security for an organization.


    ## BUILDING A SECURE CYBER SYSTEM


    Security architects are responsible for the overall strategy for all cybersecurity
    operations within an organization. Looking at the big picture, they design an
    organization’s security structures to block malware and attempts by hackers to
    gain access to an organization’s computer networks and systems. To do so, a security
    architect must have a thorough understanding of a company’s technology and information
    systems. He or she should think like a hacker to understand and anticipate the
    tactics that hackers might use to gain access to computer systems. Knowing the
    systems and technologies used by the organization helps a security architect pinpoint
    who has access and where any security vulnerabilities may exist.


    ![](Images/page_45-1.jpg)


    In order to design an organization’s security system and overall security plan,
    security architects must understand all of the hardware and software used by the
    organization.

