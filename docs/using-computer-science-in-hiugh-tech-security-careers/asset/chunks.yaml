    对渗透测试职业感兴趣的学生可以通过参加安全实习来获得宝贵的实战经验。2017 年，Tim Welles 在 Sword & Shield Enterprise
    Security 担任暑期实习生，这是一家信息安全咨询公司。Welles 是田纳西大学的一名学生，主修计算机科学并专注于网络安全。他在公司办公室负责了一个项目，为一种名为
    `hashcat`（一种密码破解工具）的安装设置了一个名为 `wrapper`（包装器）的编程函数。Welles 在 Sword & Shield 网站的一篇文章中写道：


    “用于分布式哈希破解项目的 `hashcat` 包装器对我我这样的实习生来说是一个完美的选择。它让我做了一些我认为这些工作在我离开公司后很长一段时间仍能为公司创造价值，并完成了他们需要完成的工作。同时，它让我学习了许多关于密码破解和通用的
    `Linux` 知识，以及一些基础网络技能。这个项目最棒的部分是我完成后，团队实际上开始在他们的渗透测试服务中使用它。这让我觉得自己正在为公司产生影响，而不是在做一个可能不会被充分利用的侧边项目。”


    Welles 计划在毕业后从事网络安全职业。


    对于其中一个客户，van der Baan 发现了一个可以操纵数据库并从底层操作系统文件的系统。他发现的另一个错误提供了系统代码。当他下载它时，发现了一个允许他执行任何想要的代码的漏洞——这种漏洞如果被恶意黑客发现将会非常危险。他在
    2016 年 4 月为 *Computerworld UK* 的一篇文章中说：“我们发现了什么、在哪里发现、我们的最终结果是什么，完全取决于系统。”通过向客户展示这些漏洞，van
    der Baan 能够帮助客户理解哪里需要加强网络防御。


    ![](img/page_39-1.jpg)


    恶意黑客有时会在电话中冒充他人，以获取敏感的个人信息，如用户名和密码。


    # 如何成为渗透测试员


    对于那些充满好奇心并擅长为网络安全问题提供独特且复杂的解决方案的人来说，渗透测试职业可能是一个非常合适的选择。大多数渗透测试员具有多年相关经验，并至少拥有计算机科学、信息安全或相关领域的学士学位。这些计划为学生准备了编程、网络和网络安全方面的技能。学生将学习计算机取证、灾难恢复、渗透测试等领域的课程。高中生可以通过学习计算机科学和编程课程来为渗透测试职业做准备。


    大多数网络安全职业（包括渗透测试）都需要强大的技术和计算机技能，以便这些专业人员能够入侵计算机系统。某些雇主要求候选人掌握特定的编程语言，如 `C`、`C++`、`Java`、`PHP`
    和 `Python`。由于客户运行不同的操作系统，渗透测试员应该熟悉 `Windows`、`UNIX` 和 `Linux` 操作系统。他们还应该具有 Web
    应用程序、网络服务器和网络工具、安全工具以及安全框架的经验。Contrast Security 技术官兼创始人 Jeff Williams 在 2018 年
    4 月为 *Forbes* 的一篇文章中表示：


    “你绝对需要对正在测试的技术有深入的理解。你不需要成为一名编码专家，但你应该掌握足够的知识，使用你想要测试的技术来构建简单的应用程序，并理解更复杂应用程序的代码。我建议专门研究广泛用于构建人们真正关注的应用的技术，例如
    `Java`、`.NET` 和主要的应用程序框架。”


    ![](img/page_41-1.jpg)


    青少年参加计算机研讨会，在会上学习如何编写代码并练习编程技能，这对于渗透测试职业将非常有帮助。


    候选人还应该对安全防御和漏洞有深入的理解。Williams 在 *Forbes* 文章中说：“理解加密、认证、授权、跨站请求伪造 (`CSRF`) 令牌、`session
    IDs`、`HTTP` 头部、编码/转义和日志等安全防御至关重要。”他还建议候选人获得发现和利用漏洞的实践经验。某些雇主要求渗透测试员拥有道德黑客或其他安全认证。


    渗透测试员必须了解黑客使用的最新方法和技术。为了做到这一点，他们可以参加会议与其他专家讨论新的攻击。


    # 渗透测试员的职业前景


    渗透测试员的职业前景非常好。根据 BLS 的《职业展望手册》，信息安全分析师（包括渗透测试员）的就业预计从 2016 年到 2026 年增长 28%。这一增长率远高于所有职业的平均水平。


