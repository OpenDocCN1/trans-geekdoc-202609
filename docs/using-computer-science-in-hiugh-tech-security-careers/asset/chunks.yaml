    WORKING IN COMPUTER FORENSICS


    People working in computer forensics combine a computer science background with
    forensic skills. They assist law enforcement and companies by collecting, analyzing,
    and presenting the digital data they uncover. The primary job of a computer forensic
    specialist is to find and collect the visible and hidden digital information on
