- fmt: '

    As companies increasingly understand the importance of high-tech cybersecurity,
    the demand for skilled security architects and other cybersecurity professionals
    will continue to rise. In addition, a study from the Center for Cyber Safety and
    Education predicts that there will be more jobs than qualified professionals to
    fill them in the next five years, with a talent gap of 1.8 million jobs. For people
    interested in high-tech cybersecurity, a career as a security architect may be
    the perfect fit.


    # CHAPTER SIX: SECURITY ENGINEERING


    As more organizations store valuable and sensitive information in computer systems
    and networks, protecting this information has never been more important. Faulty
    software and weak systems can leave computer networks vulnerable to malicious
    malware, spyware, and more. Security engineers take the designs created by security
    architects and build the systems that can handle malicious cyberattacks, unexpected
    natural disasters, or other catastrophic events.


    ## ENGINEERING A PROTECTION SYSTEM


    Security engineers are a valuable part of the cybersecurity team. Working for
    a variety of companies and organizations, these professionals understand how to
    design architecture to protect an organization. They work with other security
    professionals to minimize damages during a cyberattack. They test and screen security
    software. They monitor computer networks and systems and look for any unauthorized
    breaches or activity. Security engineers often function as an organization’s first
    line of defense against potential security threats. In this role, they identify
    and contain threats as they arise, but they also plan and prepare a threat response
    before one occurs.


    ![](Images/page_54-1.jpg)


    A security engineer sits at her workstation and monitors an organization’s systems
    for any sign of an unauthorized breach or suspicious activity.


    Security engineers often build new systems to help protect networks. They implement
    and administer security hardware and software. They install and configure security
    software such as `firewalls` and data encryption programs. They install and process
    new security products such as software that notifies the team about unauthorized
    system intrusions. They develop automated code that tracks and reports on security
    incidents. When there is any change in an organization’s hardware and software,
    security engineers are involved to ensure the changes do not expose the organization
    to new vulnerabilities.


    Security engineers are also part of the security team that monitors networks and
    systems for breaches. They spend a lot of time looking for any system or network
    vulnerabilities and testing security solutions. To do this, they may conduct scans
    of networks or perform penetration testing. When a breach occurs, security engineers
    often lead the organization’s response and investigate how the breach occurred.
    With this information, they install fixes to strengthen security.


    Helen Oswell is a security engineer at `6point6`, a technology consulting company.
    In her role, Oswell builds security systems and identifies ways to improve and
    eliminate vulnerabilities in a company’s IT infrastructure. In an interview posted
    on the Learning People website, Oswell explained, “I work on tools and designs
    and work on structure papers during a normal day. My favorite part of the role
    is designing tools and implementing them—for example working on a vulnerability
    management tool in a cloud environment.” She believes that it is more important
    than ever for companies to pay attention to their cyber defenses. While spending
    money on cybersecurity professionals can be costly, Oswell pointed out that “the
    real cost is when all your data gets hacked and your business can’t function.”


    ![](Images/page_56-1.jpg)


    Security engineers work together to install updates to an organization’s security
    firewall and data encryption programs.


    ## HOW TO BECOME A SECURITY ENGINEER


    Most security engineers have at least a bachelor’s degree in computer or information
    science, computer programming, software engineering, or systems engineering. Students
    in these programs will typically take courses in computer programming, networking,
    and systems design. Some companies prefer security engineers to have a master’s
    degree, such as a master of science in information systems or a related field.
    Students in high school who want to become a security engineer can take classes
    in math, science, and computer science.


    ## THE PROPER CERTIFICATIONS


    Earning a certification can show that a person has mastered important skills for
    security engineering. Some of the most popular certifications for security engineers
    include Certified Ethical Hacker, Cisco Certified Network Professional Security,
    and Certified Information Systems Security Professional. Students in these certification
    programs learn about hacker software, network security, computer forensics, cryptography,
    program testing, applied mathematics, and information system maintenance. Although
    many certifications are available, the process for obtaining each one is similar.
    Students must have a certain level of experience and pass an exam.


    Security engineers must have strong technical and computer skills. They must know
    how to build security networks, including cloud systems. They should have experience
    using penetration and intrusion detection software, setting up `firewalls`, and
    configuring routers and software. While coding skills are not a requirement, they
    are helpful when engineers review code to search for security issues. Parisa Tabriz
    said in a blog post on `freeCodeCamp`:


    > The best security engineers I know are also actively writing code. This gives
    them firsthand experience with writing software, including unintentionally-yet-inevitably
    introducing security bugs. The latter forces a real empathy for all developers.
    After all, it’s often harder to consistently write secure code than it is to point
    out insecure code.


    Security engineers should be familiar with operating systems such as `Windows`
    and `Linux` and database security using `MySQL`, `Oracle`, and `SQL Server`. They
    should be able to use the latest encryption technology and networking security
    protocols such as `TCP/IP` and `HTTPS`. They should also keep up-to-date on the
    latest hacking techniques.


    ![](Images/page_58-1.jpg)


    A security engineer reviews code on a laptop and searches for any vulnerabilities
    or weaknesses in the code that will allow a hacker to breach an organization’s
    software and systems.


    Those who work in this field need to keep up with the latest technologies and
    industry developments. To do so, they take continuing education courses throughout
    their careers and attend industry conferences.


    ## JOB OUTLOOK FOR SECURITY ENGINEERS


    The job outlook for security engineers is very good. According to the `BLS`, employment
    of information security analysts, which includes security engineers, is projected
    to grow 28 percent from 2016 to 2026. While the demand for cybersecurity professionals,
    including security engineers, is soaring, the supply of qualified candidates is
    low. Research by the job site `Indeed` in 2017 found that although organizations
    have cybersecurity job postings, there are not enough candidates to fill them.
    Therefore, qualified candidates with related job experience will have their pick
    of jobs in security engineering.


    # CHAPTER SEVEN: ENCRYPTING DATA


    In 2013, computer software company `Adobe` announced that its computer systems
    had been hacked. Cyberattackers accessed millions of `Adobe` customer IDs, encrypted
    passwords, and encrypted credit or debit card numbers. The company later reported
    that hackers also stole the source code for `Photoshop`, its popular photo editing
    software. Thirty-eight million customers were affected by the breach.

