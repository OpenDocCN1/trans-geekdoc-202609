    # ABOUT THE AUTHOR

    Carla Mooney is a graduate of the University of Pennsylvania. Before becoming
    an author, she spent several years in finance as an accountant. Today, she writes
    for young people and is the author of many books for young adults and children.
    Mooney enjoys learning about new technologies and the impact they will have on
    different industries and the average digital user.


