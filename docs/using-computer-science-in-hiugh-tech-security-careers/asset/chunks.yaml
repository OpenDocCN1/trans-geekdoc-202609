    different users, systems, networks, and other technologies. The security architect
    takes on this challenge, designing, building, and maintaining high-tech computer
    systems security for an organization.


    BUILDING A SECURE CYBER SYSTEM


    Security architects are responsible for the overall strategy for all cybersecurity
    operations within an organization. Looking at the big picture, they design an
    organization’s security structures to block malware and attempts by hackers to
    gain access to an organization’s computer networks and systems. To do so, a security
    architect must have a thorough understanding of a company’s technology and information
    systems. He or she should think like a hacker to understand and anticipate the
    tactics that hackers might use to gain access to computer systems. Knowing the
    systems and technologies used by the organization helps a security architect pinpoint
    who has access and where any security vulnerabilities may exist.


    ![](Images/page_45-1.jpg)


    In order to design an organization’s security system and overall security plan,
    security architects must understand all of the hardware and software used by the
    organization.'
