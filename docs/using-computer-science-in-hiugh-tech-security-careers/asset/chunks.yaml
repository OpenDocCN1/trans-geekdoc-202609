    \ `Unit 8, Suite #324`\n- `Mississauga, ON L4Z 3K8`\n- `Canada`\n- `(905) 602-1370`\n\
    - Website: [http://www.cips.ca](http://www.cips.ca)\n- Facebook: `@CIPS.ca`\n\
    - Twitter: `@cips`\n\nThe `CIPS` represents thousands of professionals in the\
