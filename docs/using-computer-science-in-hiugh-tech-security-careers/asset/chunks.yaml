    # 引言


    在 20 世纪 90 年代，Jeff Williams 成为一名应用安全工程师，在大多数人听说这个职业之前，他就担任了这一高科技安全职位。“通用电气来到我的公司说：‘我们喜欢你们的数据中心，但在这些代码发布到互联网之前，我们需要对每一行代码进行安全审查，’’他在接受
    `CSO Online` 采访时提到。“销售团队很快回答说：‘没问题！’其他人都迅速后退了一步，而我承担了研究如何交付的任务。”


    应用安全是保护软件免受威胁的实践。


    # 第一章：保护数字资产和信息


    在 20 世纪 90 年代，Jeff Williams 成为一名应用安全工程师，在大多数人听说这个职业之前，他就担任了这一高科技安全职位。“通用电气来到我的公司说：‘我们喜欢你们的数据中心，但在这些代码发布到互联网之前，我们需要对每一行代码进行安全审查，’’他在接受
    `CSO Online` 采访时提到。“销售团队很快回答说：‘没问题！’其他人都迅速后退了一步，而我承担了研究如何交付的任务。”


    应用安全是保护软件免受威胁的实践。


    ![](img/page_5.jpg)


    今天，Williams 是加利福尼亚州帕洛托供应商 `Contrast Security` 的首席技术官兼联合创始人。


    ![](img/page_9-1.jpg)


    我们日益成为一个高度连接的社会。智能手机和健身追踪器等联网设备容易受到网络安全攻击。


    多年前，网络安全主要与政府机构和国防承包商相关。今天，所有组织都需要解决网络安全问题。


    ## 网络安全的类型


    '
- fmt: '

    Cybersecurity includes several types of high-tech security. Application security
    involves detecting vulnerabilities and developing tools and procedures to protect
    hackers from using weaknesses in an application to gain unauthorized access to
    company systems. Information security protects information and data from unauthorized
    access, breaches, manipulation, theft, and more. Network security involves monitoring
    an organization’s internal networks to identify any weaknesses and prevent unauthorized
    access. Network security uses both hardware and software technologies, such as
    `firewalls` and antivirus and antispyware software, to keep internal networks
    secure and reliable.


    Cybersecurity also involves planning for a disaster, whether natural or technical.
    This planning involves assessing and analyzing risks, prioritizing assets, and
    creating a disaster response plan. With a disaster plan in place, organizations
    can recover more quickly from a disaster and minimize any losses.


    A website is another place where organizations can be vulnerable to attack. In
    recent years, there has been a rise in the number of data breaches on websites.
    These breaches result in identity theft and financial losses for customers and
    companies. When a breach is made public, companies also suffer damage to their
    brand image and reputation. Website security focuses on protecting websites from
    online threats. It uses techniques and tools such as website scanning and malware
    removal, application security testing, website application firewalls, and more.


    ![](Images/page_11-1.jpg)


    Cybersecurity professionals work in a company server room and monitor a software
    program that detects any unauthorized access to the company’s network.


    Mobile technology and the internet allow people to work from anywhere in the world.
    This flexibility also brings some risk since remote workstations and mobile devices
    are vulnerable to cyberattacks. When mobile devices connect to an organization’s
    network and are interconnected, they create new entry points for hackers to gain
    access to a company’s systems. Endpoint security protects and secures an organization’s
    network by blocking attempts to access it from remote entry points.


    ## COMMON CYBER THREATS


    No organization—regardless of its size, industry, or location—is immune to cyberattacks.
    Understanding some of the most common threats can help cybersecurity professionals
    better design an organization’s cyber defenses. Five of the most common threats
    faced by organizations include:


    *   Socially engineered malware: This type of attack tricks users into downloading
    harmful software onto a computer; the software can then spread to and disrupt
    a connected system or network.

    *   Phishing attacks: Password phishing attacks trick users into revealing their
    passwords and log-in information, which is then used to access an organization’s
    network without permission.

    *   Unpatched software: Unpatched software contains vulnerabilities that allow
    hackers a point of access into an organization’s network.

    *   Social media threats: Hackers can use social media accounts to gather information
    about a company and its employees, eventually piecing together enough information
    to successfully hack into the company’s network.

    *   Advanced persistent threats: these frequently use phishing attacks or a Trojan
    attachment that delivers malware when opened to gain access to an organization’s
    network and steal intellectual property.


    ## HIGH-TECH SECURITY AND COMPUTER SCIENCE


    As more information and systems are connected online, there is a growing need
    for people who are interested in working in high-tech security and also have an
    interest in computer science and coding. According to `ISACA`, a nonprofit information
    security advocacy group, there is a global shortage of approximately two million
    cybersecurity professionals. In the United States, employers are struggling to
    fill cybersecurity jobs, with thousands remaining open because companies cannot
    find qualified professionals to fill them. There are needs for people to design
    and build security systems, try to break systems and identify weaknesses, monitor
    systems and detect intrusions.


    Much of computer science is about layers of abstraction, and security is often
    about finding the flawed assumptions in those abstractions and then figuring out
    to best fix (or exploit) them,” said cybersecurity expert Parisa Tabriz in a blog
    post for freeCodeCamp.


    ![](Images/page_14-1.jpg)


    Knowing several programming languages and being able to code are useful skills
    for professionals who want to work in the field. People working in cybersecurity
    can benefit from a knowledge of `operating systems`, `networking`, and `computer
    architecture`. Knowledge of security topics in networking, `privacy enhancing
    technologies`, and `application security` are also important to have. An understanding
    of some programming languages—such as `Python`, `C`, `Java`, `JavaScript`, `PHP`,
    `HTML`, and `SQL`—is valuable.


    ## PURSUING A CAREER IN HIGH-TECH SECURITY AND COMPUTER SCIENCE


    There is no single path to a career in cybersecurity. Some people enter the field
    right out of college, while others gain experience working first in another IT
    position. No matter which path a person takes, all cybersecurity careers require
    a good foundation of general IT experience. People interested in this career need
    to understand how technology works before they can learn how to protect it. Many
    choose to get a degree in `computer science` or `information science` from a four-year
    college, taking classes in `operating systems`, `networks`, `programming languages`,
    `databases`, and more. Classes in security topics are also beneficial. Some cybersecurity
    careers require advanced degrees, such as a `master’s degree` or `doctorate` in
    `IT` with a focus on cybersecurity. For some positions, earning a certificate
    is a good way to show that a person has the technical skills needed for the career.


    After earning a degree, cybersecurity professionals work in companies of all sizes,
    in almost every industry. Many work for consulting companies that perform services
    for a portfolio of clients. Others work in a company’s internal IT department.
    Some cybersecurity professionals are self-employed, working on a freelance basis
    for clients.


    In addition to taking classes, people interested in a high-tech security and computer
    science career can take other steps to learn more about the profession. Joining
    a cybersecurity professional organization can help a person learn more about the
    field and make contacts. Some companies offer internships to students. Internships
    give students the experience of working for a particular company or industry.
    Reading newspapers and other business and technology publications can help students
    keep up to date on the latest in cybersecurity.


    For people who have an interest in security and computer science, a career in
    cybersecurity can be a challenging but rewarding choice.

