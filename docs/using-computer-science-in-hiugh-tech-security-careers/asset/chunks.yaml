    \nINTRODUCTION\n\nIn the 1990s, Jeff Williams became an application security engineer,\
    \ taking this high-tech security position long before most people had heard of\
    \ the career. “General Electric came to my company and said, ‘We like your data\
    \ centers, but we need every line of code reviewed for security before it goes\
    \ on the internet,’” he said in an interview for CSO Online. “The sales team quickly\
    \ said, ‘Sure!’ Everyone else took a quick step backwards and I got the job of\
    \ figuring out how to deliver.”\n\nApplication security is the practice of adding\
    \ features or functions to software and web applications to reduce vulnerabilities\
    \ and block threats. Threats include cyberattacks, network breaches, and data\
    \ theft. To protect applications, application security engineers use firewalls,\
    \ antivirus programs, encryption programs, and other features that prevent unauthorized\
    \ access.\n\nApplication security is part of a company’s overall high-tech security\
    \ plan, which also includes system, network, and mobile security. The goal of\
    \ the entire security plan, including application security, is to protect organizations\
    \ and software users from hacking and other malicious intrusions. In his role\
    \ as an application security engineer, Williams learned how to perform penetration\
    \ testing and security code reviews, create application security architectures,\
    \ complete threat modeling, and more.\n\n![](Images/page_5-1.jpg)\n\nAn information\
    \ technology engineer adjusts a wire connection in a company’s server room. She\
    \ is one of the professionals responsible for protecting the company’s computer\
    \ systems.\n\nToday, Williams is the chief technology officer and cofounder at\
    \ Contrast Security, a Palo Alto, California, application security vendor. He\
    \ says that to be successful in this high-tech security career, people should\
    \ have strong computer science skills and experience in multiple programming styles\
    \ and languages. “But that’s not enough,” he said in an interview for CSO Online.\
    \ “I look for people who work on open source projects, write their own tools,\
    \ and code every day—those people that are excited and passionate about code.\
    \ So, it’s a lot more about realworld experience than book learning.”\n\nTechnology\
    \ is changing many aspects of daily life, from how people do business to how they\
    \ communicate. Increasingly, organizations are relying on digital systems to generate,\
    \ process, and store valuable information. The need to protect an organization’s\
    \ digital systems and data from unauthorized access and malicious hackers has\
    \ given rise to new career fields in cybersecurity.\n\nCybersecurity is the protection\
    \ of internetconnected systems, including hardware, software, and data, from breaches\
    \ and cyberattacks. As companies are increasingly needing to protect their digital\
    \ systems and assets, they require the skills of security professionals who combine\
    \ technical skills with coding knowledge. Computer forensics, security engineering,\
    \ security architecture, and cryptography are just a few examples of areas within\
    \ cybersecurity that benefit from computer science and coding skills. The demand\
    \ for information technology (IT) professionals with cybersecurity and technical\
    \ skills is creating new opportunities for people with an interest in computer\
    \ science and high-tech security. “Behind every new hack or data breach, there’s\
    \ a company scrambling to put out the fire. That’s good news for job seekers with\
    \ cyber security skills. Employers can’t hire them fast enough,” wrote journalist\
    \ Jeff Kauflin in an article about high-tech security careers for *Forbes.*\n\n\
    In high-tech security, there are many different career specialties using computer\
    \ science that students can pursue. Companies employ computer forensic specialists,\
    \ security engineers, cryptographers, information security analysts, penetration\
    \ testers, security architects, and more. With so many opportunities, careers\
    \ that merge hightech security and computer science can fit many backgrounds and\
    \ interests.\n\nCHAPTER ONE\n\nPROTECTING DIGITAL ASSETS AND INFORMATION\n\nEvery\
    \ day, organizations face threats to their information systems and data. Sophisticated\
    \ attackers search for any weakness in an organization’s systems and devise ways\
    \ to exploit it. When they are successful, it can mean a simple interruption of\
    \ services or a serious concern that sensitive data is being tampered with and\
    \ sold. As more everyday objects are connected to the internet, from smart refrigerators\
    \ to fitness trackers, the need for high-tech security to protect digital assets,\
    \ systems, and information is greater than ever.\n\nWHAT IS CYBERSECURITY?\n\n\
    When people want to protect the valuables in their home, they install physical\
    \ locks and security systems to prevent thieves from entering. Organizations that\
    \ need to protect valuable digital systems and information turn to cybersecurity.\
    \ Cybersecurity is the practice of making sure digital information, networks,\
    \ and systems are safe from theft, manipulation, and other damage. Some damage\
    \ can be accidental, such as when a hard drive fails or a natural disaster strikes.\
    \ Increasingly, however, damage is caused by an intentional attack from a malicious\
    \ entity. This includes individual hackers who are just trying to see if they\
    \ can break into a system and organized criminal groups that steal data and information\
    \ for financial gain.\n\n![](Images/page_9-1.jpg)\n\nWe are increasingly a highly\
    \ connected society. Internet-enabled devices such as smartphones and fitness\
    \ trackers are vulnerable to cybersecurity attacks.\n\nYears ago, cybersecurity\
    \ was mainly associated with government agencies and defense contractors. Today,\
    \ all organizations need to address cybersecurity. Companies in industries such\
    \ as health care, manufacturing, finance, retail, and more all employ cybersecurity\
    \ professionals to protect valuable assets and information.\n\nTYPES OF CYBERSECURITY"
