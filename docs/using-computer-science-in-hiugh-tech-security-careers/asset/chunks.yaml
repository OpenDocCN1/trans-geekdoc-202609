    \ master’s or doctoral degree in mathematics or computer science will likely have\
    \ the best chance of landing a good job in the cryptography field.\n\n![](Images/page_67-1.jpg)\n\
    \nCryptography professionals use data encryption as one part of an overall cybersecurity\
    \ plan to protect company and customer data from unauthorized access and use.\n\
    \n## GLOSSARY\n\n- **algorithm**: A process or set of rules to be followed in\
    \ calculations, often by a computer.\n- **application**: A software program that\
    \ runs on a computer.\n- **architecture**: A set of rules and methods that determines\
    \ how a computer system functions and is organized.\n- **certification**: An official\
    \ document that shows a level of achievement.\n- **cryptography**: The practice\
    \ of solving or writing codes.\n- **cyberattack**: An attempt by hackers to damage\
    \ a computer network or system.\n- **cybersecurity**: The process of protecting\
    \ internet-connected computer systems, including hardware, software, and data.\n\
    - **database**: A set of data held in a computer.\n- **data breach**: The intentional\
    \ or unintentional release of private information to unauthorized users.\n- **e-commerce**:\
    \ Commercial transactions that take place over the internet.\n- **encrypt**: To\
    \ convert data into a code to prevent unauthorized access.\n- **firewall**: Part\
    \ of a computer system or network that is designed to block unauthorized access.\n\
    - **forensics**: Scientific tests and techniques used to investigate a crime.\n\
    - **hacker**: A person who uses computers to gain unauthorized access to data\
    \ or systems.\n- **identity theft**: The deliberate use of someone’s identity,\
    \ often for financial gain.\n- **internship**: A program in which a student or\
    \ trainee works in an organization, sometimes without pay, in order to gain work\
    \ experience.\n- **malicious**: Of or having an intent to do harm.\n- **malware**:\
    \ Software that is meant to damage or disable a computer system or network.\n\
    - **network**: A set of connected computers.\n- **source code**: Computer language\
    \ designed to direct a software program.\n- **threat modeling**: The process identifying\
    \ security risks by thinking like a hacker.\n- **vulnerability**: The ability\
    \ to be attacked or harmed.\n\n## FOR MORE INFORMATION\n\n### Association of Information\
    \ Technology Professionals (AITP)\n- `1120 Route 73, Suite 200`\n- `Mount Laurel,\
    \ NJ 08054-5113`\n- `(800) 224-9371`\n- Website: [https://www.aitp.org](https://www.aitp.org)\n\
    - Twitter: `@CompTIAAITP`\n\nThe `AITP` works to advance the IT profession through\
    \ professional development, education, and national policies. It features webinars,\
    \ conferences, awards for professionals and students, a career center with a jobs\
    \ board, and networking options that are of interest to computer science professionals.\
    \ \n\n### Association of Software Professionals (ASP)\n- `ASP Executive Director`\n\
    - `PO Box 1522`\n- `Martinsville, IN 46151`\n- `(765) 349-4740`\n- Website: [http://asp-software.org](http://asp-software.org)\n\
    - Facebook: `@AssocSoftwareProfessionals`\n- Twitter: `@Applied_SW`\n\nThe `ASP`\
    \ is a professional trade association of software developers that provides a community\
    \ for developers to share information about the industry.\n\n### Canada’s Association\
