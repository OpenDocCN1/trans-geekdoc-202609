  trans: '

    网络安全包含了多种高科技安全类型。应用安全涉及检测漏洞，并开发工具和程序，以防止黑客利用应用程序中的漏洞获取对公司系统的未经授权访问。信息安全保护信息和数据免受未经授权的访问、泄露、操纵、盗取等侵害。网络安全涉及对组织的内部网络进行监控，识别任何漏洞并防止未经授权的访问。网络安全同时使用硬件和软件技术，例如`firewalls`
    以及防病毒软件和反间谍软件，用以保持内部网络的安全和可靠。


    网络安全还涉及对灾难的规划，无论是自然还是技术性的。这种规划涉及评估和分析风险、确定资产优先级以及创建灾难响应计划。有了灾难计划，组织可以更快地从灾难中恢复，并最大限度地减少损失。


    网站是组织另一个容易受到攻击的地方。近年来，网站数据泄露事件的数量增加。这些泄露导致了客户和公司的身份盗用和财务损失。当泄露事件被公开时，公司的品牌形象和声誉也会受到损害。网站安全侧重于保护网站免受在线威胁。它使用了如网站扫描和恶意软件清除、应用程序安全测试、网站应用程序防火墙等技术和工具。


    ![](img/page_11-1.jpg)


    网络安全专业人员在公司服务器房工作，监控一个用于检测对公司网络任何未经授权访问的软件程序。


    移动技术和互联网允许人们在世界上任何地方工作。这种灵活性也带来了一些风险，因为远程工作站和移动设备容易受到网络攻击。当移动设备连接到组织的网络并相互互连时，它们会为黑客访问公司系统创建新的切入点。终端安全（Endpoint
    security）通过阻止来自远程入口的访问尝试，来保护和保障组织的网络。


    ## 常见网络威胁


    无论规模、行业或位置如何，没有任何一个组织是免受网络攻击的。了解一些最常见的威胁可以帮助网络安全专业人员更好地设计组织的网络防御。组织面临的五个最常见威胁包括：


    *   社会工程学恶意软件：这种攻击欺骗用户在计算机上下载有害软件；随后该软件可以扩散到并破坏连接的系统或网络。

    *   钓鱼攻击：密码钓鱼攻击欺骗用户泄露密码和登录信息，这些信息随后被用于在未经许可的情况下访问组织的网络。

    *   未打补丁的软件：未打补丁的软件包含漏洞，允许黑客获得进入组织网络的访问点。

    *   社交媒体威胁：黑客可以使用社交媒体账户收集有关公司及其员工的信息，最终拼凑出足够的信息以成功黑入公司网络。

    *   高级持续性威胁（APT）：这些威胁频繁使用钓鱼攻击或木马附件（打开后会投送恶意软件）来获取组织网络的权限并窃取知识产权。


    ## 高科技安全与计算机科学


    随着越来越多的信息和系统连接到在线，对那些希望在高科技安全领域工作，且对计算机科学和编码感兴趣的人才的需求日益增长。根据非营利信息安全倡导组织 `ISACA`
    的说法，全球缺少约两百万名网络安全专业人员。在美国，雇主正努力填补网络安全职位，仍有数千个职位处于空缺，因为公司找不到合格的专业人员来。。这需要人们设计和构建安全系统、尝试破解系统并识别漏洞、监控系统并检测入侵。


    “计算机科学的很大程度上关于抽象层，而安全通常是关于发现这些抽象层中的缺陷假设，然后想出最佳修复（或利用）它们的方法，”网络安全专家 Parisa Tabriz
    在 freeCodeCamp 的一篇博客中写道。


    ![](img/page_14-1.jpg)


    熟悉几种编程语言并能够编写代码，对于希望在该领域工作的专业人士来说是有用的技能。从事网络安全工作的人可以从 `operating systems`、`networking`
    和 `computer architecture` 的知识中获益。拥有网络中的安全主题、`privacy enhancing technologies` 以及
    `application security` 的知识也很重要。理解一些编程语言——如 `Python`、`C`、`Java`、`JavaScript`、`PHP`、`HTML`
    和 `SQL`——非常有价值。


    ## 追求高科技安全与计算机科学职业


    网络安全职业没有单一路径。有些人大学毕业后就进入该领域，而另一些人先在其他 IT 职位获得经验。无论人们采取哪种路径，所有网络安全职业都需要良好的通用 IT
    基础。对此职业感兴趣的人在学习如何保护技术之前需要了解技术是如何工作的。许多人选择在四年制大学获得`computer science`或`information
    science`学位，学习 `operating systems`、`networks`、`programming languages`、`databases`
    等课程。学习安全主题的课程也有益。某些网络安全职业需要高级学位，例如专注于网络安全的 `IT` `master’s degree` 或 `doctorate`。对于某些职位，获得证书是证明个人具备该职业所需技术技能的好方法。


    获得学位后，网络安全专业人员在各种规模的公司、几乎所有的行业中工作。许多人在咨询公司工作，为一系列客户提供服务。另一些人在公司内部 IT 部门工作。一些网络安全专业人员自雇，为客户提供自由职业服务。


    除了上课，对高科技安全和计算机科学职业感兴趣的人还可以采取其他步骤来深入了解该行业。加入网络安全专业组织可以帮助人们更多地了解领域并建立人脉。一些公司为学生提供实习。实习让学生获得在特定公司或行业工作的经验。阅读报纸和其他商业技术出版物可以帮助学生跟上网络安全的动态。


    对于对安全和计算机科学感兴趣的人来说，网络安全职业是一个充满挑战但回报丰厚的选择。

