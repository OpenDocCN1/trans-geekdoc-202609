    大多数信息安全分析师至少拥有四年制学院或大学的计算机科学、计算机编程或相关领域的学士学位。一些学校为信息安全专业人士开设了特定的课程。一些雇主要求候选人拥有信息系统的工商管理硕士学位。


    许多雇主更倾向于拥有相关工作经验的候选人，例如在 IT 部门担任网络或系统管理员。寻求数据库安全分析师的组织可能更倾向于选择曾担任过数据库管理员的候选人，而寻求系统安全分析师的组织则可能倾向于担任过计算机系统分析师的候选人。


    ![](img/page_31-1.jpg)


    信息安全分析师在控制中心协作，听主管汇报有关入侵公司网络最新尝试的进展。


    尽管信息安全分析师没有强制性的认证或执照，但一些自愿培训和认证可以增加个人获得工作或晋升的机会。某些认证是通用的，而另一些则指定了渗透测试或系统审计等领域。“我不认为你应该花费所有时间在名字后面积累更多的头衔，但在寻找第一份工作时，拥有学士学位和初级认证确实能让你脱颖而出，”Hoy
    在 *U.S. News & World Report* 网站发布的一篇文章中说道。


    除了技术技能，成功的信息安全分析师还应该具备强大的分析、批判性思维和解决问题的能力。他们必须能够识别和分析安全风险与问题，识别并评估可能的解决方案，并找到保护组织系统和网络的最佳方法。他们还必须非常注重细节，以便像侦探一样研究系统，寻找网络攻击或数据泄露的细微迹象。这些泄露可能通过网络流量的变化、用户账户活动、地理登录模式或对同一文件的请求数量的增加来指示。此类分析师必须极具道德操守，因为工作的某些部分可能涉及入侵系统，以突出需要安全加固的环节。


    ## 积累经验：网络安全实习


    实习工作可以帮助学生获得宝贵的实操经验，并为信息安全职业积累必要的技能。作为实习生，Tiffany Smith 在网络安全公司 Foreground Security
    工作。每位实习生都被分配一项任务：Smith 的项目是将名为 `Opsview` 的监控工具安装到 Red Hat 服务器上。Smith 花费了大量时间研究如何安装该监控工具。“这对我来说非常有挑战性，但我通过跟踪我在安装每个阶段所采取的步骤，解决了这个问题，”Smith
    在 `Keirsten Brager.tech` 的博客中写道，“这段经历为我在第一份全职网络安全工作中面临的挑战做好了准备。我的项目在实习结束时被选中并投入公司生产环境，我非常激动！”


    ## 信息安全分析师的职业前景


    信息安全分析师的职业前景非常好。根据 BLS 的《职业展望手册》，信息安全分析师的就业人数预计从 2016 年到 2026 年将增长 28%。“这一领域的工作机会无处不在，”Hoy
    在 U.S. News & World Report 网站的文章中说道，“我们目前面临网络安全专业人才短缺。”


    随着越来越多的信息数字化以及网络攻击和数据泄露的增加，对信息安全分析师的需求也会增加。面对日益复杂的网络威胁，各行业的公司都需要增加保护措施以确保信息安全。特别是医疗行业，由于医疗公司使用记录，需要增加安全性。根据招聘网站
    CareerCast 的说法，“如果有漏洞，迟早会被发现——如今，发现得更快。”


    ## 第四章 伦理黑客


    企业日益受到黑客和网络犯罪犯的攻击，问题正变得越来越糟糕。公司还在聘用渗透测试人员来测试网络的真实安全性。


    渗透测试是计算机科学众多职业之一，是通过测试计算机系统、Web 应用程序或网络来发现安全漏洞的实践。渗透测试人员也被称为伦理黑客，负责确保客户的计算机网络和系统得到保护。为了做到这一点，渗透测试人员使用真实的黑客技术寻找客户系统中的漏洞。


    ![](img/page_36-1.jpg)


    尽管公司的服务器机房看起来是空的，但其网络经常面临试图访问服务器的攻击。


    渗透测试人员必须极具创造力，并不断思考新方法来“攻击”系统。在工作时，他们会仔细记录所采取的步骤和发现的任何漏洞。虽然每个客户都不同，但目标是一样的：模拟现实黑客发起的攻击，并向客户报告这些模拟的成功或失败。


    ## 在渗透测试领域工作


    Aleksander Gorkowienko 和 Steven van der Baan 是网络安全咨询公司 7Safe 的渗透顾问。他们大部分时间都在尝试破解公司的计算机系统。每个客户使用的技术不同，面临着独特的挑战。有时，Gorkowienko
    和 van der Baan 会执行 `SQL (Structured Query Language) 注入`，将查询插入数据库，允许黑客在未经授权的情况下对其操纵。其他时候，他们会进行钓鱼攻击，即黑客通过电话或电子邮件冒充他人，试图让员工透露安全密钥或密码等信息。无论使用何种方法，渗透测试人员都试图寻找其客户系统中的任何漏洞，以便在泄露发生之前防止其。


