    随着电子商务的持续增长和越来越多的业务转向在线，对密码学专业人才的需求将持续强劲。“数据加密和安全是如今一个巨大且不断增长的领域，”数学密码学杂志（`Journal
    of Mathematical Cryptology`）副总监兼共同编辑 Rainer Steinwandt 在 Bank Info Security 网站的一篇文章中写道。“每天都有新公司出现，它们需要对数据进行加密；他们通过密码学家利用数学开发的软件和‘密钥’来实现这一点。”
    具有相关经验并拥有数学或计算机科学硕士或博士学位的密码学专业人士可能在密码学领域拥有最好的工作机会。


    ![](img/page_67-1.jpg)


    密码学专业人士将数据加密作为整体网络安全计划的一部分，保护公司和客户数据免受未经的访问和使用。


    ## 术语表


    - **算法 (algorithm)**: 在计算中需要遵循的过程或规则集，通常由计算机执行。

    - **应用 (application)**: 运行在计算机上的软件程序。

    - **架构 (architecture)**: 决定计算机系统如何工作和组织结构的一系列规则和方法。

    - **认证 (certification)**: 显示成就水平的官方文件。

    - **密码学 (cryptography)**: 编写或编写代码的实践。

    - **网络攻击 (cyberattack)**: 黑客试图破坏计算机网络或系统的尝试。

    - **网络安全 (cybersecurity)**: 保护连接互联网的计算机系统（包括硬件、软件和数据）的过程。

    - **数据库 (database)**: 存储在计算机中的一组数据。

    - **数据泄露 (data breach)**: 蓄意或无意地向未经授权的用户发布私有信息。

    - **电子商务 (e-commerce)**: 在互联网上进行的商业交易。

    - **加密 (encrypt)**: 将数据转换为代码以防止未经授权的。

    - **防火墙 (firewall)**: 计算机系统或网络中旨在阻止未经授权访问的部分。

    - **法医 (forensics)**: 用于调查犯罪的科学测试和技术。

    - **黑客 (hacker)**: 使用计算机获取未经授权的数据或系统访问的人。

    - **身份盗用 (identity theft)**: 蓄意使用他人的身份，通常是为了财务利益。

    - **实习 (internship)**: 学生或实习生在组织中工作的计划，有时无薪，旨在获得工作经验。

    - **恶意 (malicious)**: 具有伤害意图的。

    - **恶意软件 (malware)**: 旨在损坏或禁用计算机系统或网络的软件。

    - **网络 (network)**: 一组连接的计算机。

    - **源代码 (source code)**: 设计用于指导软件程序的计算机语言。

    - **威胁建模 (threat modeling)**: 通过像黑客一样进行思考来识别安全风险的过程。

    - **漏洞 (vulnerability)**: 被攻击或伤害的能力。


