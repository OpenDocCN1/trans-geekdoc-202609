    According to Irvine, digital forensics is valuable because it provides information.
    He said in the interview posted on Balance Careers:


    **Whether that information is evidence for a Federal criminal case or knowledge
    of an insider stealing corporate intellectual property for a competitor, digital
    forensics professionals provide data that the customers otherwise do not have
    available. In very simple terms, one could liken the job of a digital forensic
    examiner to that of a photo developer. For example, if I have an undeveloped roll
    of film in my hands, that’s almost useless to me as any kind of evidence. However,
    if someone develops that film into pictures (or recovers data from a hard drive
    in our case), that content can provide everything the prosecutor, HR manager,
    or corporate security officer needs.**


    SUMMER CAMP WITH THE NATIONAL SECURITY AGENCY


    While many teens are swimming, hiking, and toasting marshmallows, students at
    the National Security Agency (NSA)–sponsored summer camp at Marymount University
    learn how to crack encrypted passwords. At the computer, sixteen-year-old Ben
    Winiger typed a command into a software tool designed to help test and break passwords.
    “Now we’re trying a brute-force attack,” said Winiger in an article in the New
    York Times.


    This GenCyber summer camp, and others like it around the country, teach middle
    school and high school students some of the skills they will need for future careers
    in cybersecurity. Each camp receives loose guidelines from the NSA and is free
    to decide which topics and exercises it will offer. According to the Marymount
    camp head Diane Murphy, an IT professor, her camp teaches students how to hack
    so that they can better defend against cyberattackers they might encounter in
    the future. NSA officials hope that camps like GenCyber for students will help
    build the next generation of computer forensics and cybersecurity professionals
    who will be needed to fill thousands of new cybersecurity jobs in the future.


