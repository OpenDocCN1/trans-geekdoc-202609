  ```\n\n## 1.3 矩阵 (Matrices)\n\n要创建矩阵使用 `matrix()` 函数：\n\n```\nmatrix(10,3, 2)\n\
  ```\n\n```\n      [,1] [,2]\n## [1,]   10   10\n## [2,]   10   10\n## [3,]   10\
  \   10\n```\n\n或者\n\n```\nmatrix(c(1,2,3,4,5,6), 3, 2)\n```\n\n```\n      [,1] [,2]\n\
  ## [1,]    1    4\n## [2,]    2    5\n## [3,]    3    6\n```\n\n或者\n\n```\nmatrix(c(1,2,3),\
  \ 3, 2)\n```\n\n```\n      [,1] [,2]\n## [1,]    1    1\n## [2,]    2    2\n## [3,]\
  \    3    3\n```\n\n但让我们查看我们是如何调用 `matrix` 函数的：\n\n```\nargs(matrix)\n```\n\n```\n\
  ## function (data, nrow = ncol = max(1),\n              byrow = FALSE,\n       \
  \       missing = NA,\n              dimnames = character(0))\n```\n\n所以行和列的数量应该是\
  \ 3。\n\n```\nmatrix(1:9, byrow =TRUE)\n```\n\n\n\n\n```\n##      [,1] [,2] [,3]\n\
  ## [1,]  164  184  105\n## [2,]  209  235  135\n## [3,]  254  286  165\n```\n\n\
  ```\nt(am)\n```\n\n```\n##      [,1] [,2] [,3]\n## [1,]   10   13   16\n## [2,]\
  \   11   14   17\n## [3,]   12   15   18\n```\n\n## 1.4 数据框 (Data frames)\n\n与矩阵不同，数据框可以在其列中存储不同类型的值。它们在\
  \ R 语言中广泛用于数据分析。通常，行代表观测值（或样本），列代表特征（或属性或变量）。当我们从文件中读取数据时，结果会被读取为数据框。下载 zip 文件 `[r-novice-inflammation.zip](https://github.com/swcarpentry/r-novice-inflammation/blob/main/data/r-novice-inflammation-data.zip)`\
  \ 并在桌面上解压。使用文本编辑器检查 `inflammation-01.csv` 文件以查看我们将加载的内容。然后读取该文件：\n\n```\ndata <-\
  \ read.csv(file = \"data/inflammation-01.csv\", header = FALSE, stringsAsFactors\
  \ = TRUE)\n```\n\n注意路径中包含 `data/` 的使用，因为我们之前通过 `getwd()` 将工作目录设置为了桌面。\n\n```\ndir()\n\
  ```\n\n```\n##  [1] \"_site.yml\"                    \"ar.html\"               \
