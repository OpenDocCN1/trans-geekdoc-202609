  \     [,7]     [,8]      [,9]    [,10]\n## [1,] 0.09910944 1.144572 0.4380461 1.223821\n\
  ```\n\n```\nplot(data_new,data_new,asp=1,xlab=\"x1\", ylab=\"x2\")\n```\n\n####\
  \ 8.1.2 使用 R 函数进行 PCA\n\n在本节中，我们将使用可以一步完成 PCA 的 `prcomp` 函数。我们将将其应用于 Iris 数据集，并使用\
