- "# R 机器学习实用指南 (2021 更新版)\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n# 指南\n\n1. [开始阅读]\n\
  \n\n\n\nR 是一种开源编程语言和免费环境，主要用于统计计算和图形图形。你可以在[官方网站](https://www.r-project.org/)上找到关于\
  \ R 的信息。在 Google 等网站上使用关键词 `R` 以及其他特定主题词进行搜索，可以从网站、博客文章、教程、文档等处找到更多信息。\n\n尽管 R 自带了它的环境：命令行界面和图形化界面，但你仍然可以使用流行的\
  \ [RStudio](https://www.rstudio.com/)，它提供了额外的图形化功能。\n\n在 R 环境中（R 提示符为 `>`）时，你可以通过调用\
  \ `quit()` 函数或其简写 `q()` 退出。当系统询问你是否要保存工作空间时，如果你回复 `y`（是），那么你在当前 R 会话期间产生的所有变量都将保存到名为\
  \ `.Rdata` 的文件中，位于当前工作目录下。如果你以后在同一目录下启动 R，这些变量及其名称将被自动加载。\n\nR 中的函数在不同的包（packages）之间共享。最基础的包如“base”、“utils”、“graphics”\
  \ 和 “stats”在启动时会自动导入，它们包含了一些最常用的函数。然而，还有许多实用的函数需要用户下载并导入一些额外的包。这可以通过 RStudio 的图形用户界面轻松完成。例如，为了下载包含有用\
  \ SVM 函数的包“e1071”，你可以点击“Packages（包）” -> “Install Packages（安装包）”并输入所需的包名。从同一个菜单中，你可以导入所需的包。同样的操作也可以通过命令\
  \ `install.packages(\"e1071\")` 和 `library(\"e1071\")` 分别来下载和导入包“e1071”。最后，通过 `library()`\
  \ 命令可以显示所有已安装的包集合。\n\n若要检查你当前的工作目录，可以输入：\n\n```\ngetwd()\n```\n\n要设置工作目录，可以使用 `setwd`\
  \ 函数。例如，在 Linux 机器上将工作目录设置为桌面（Desktop）：\n\n```\nsetwd(\"~/Desktop\")\n```\n\n你在\
  \ R 提示符处输入的内容是一个表达式，R 会尝试对其进行求值并打印结果。例如，`getwd()` 是一个通过调用不带参数的函数 `getwd()` 来求值的表达式。`42`\
  \ 也是如此：\n\n```\n42\n```\n\n```\n## [1] 42\n```\n\n对于以下也是如此：\n\n```\n(100 * 2 - 12\
  \ ^ 2) / 7 * 5 + 2\n```\n\n```\n## [1] 42\n```\n\n还有一些预定义的常量，如 `pi` 或 `e`：\n\n```\n\
  sin(pi/2)\n```\n\n```\n## [1] 1\n```\n\n要查找特定函数的文档，你可以输入 `?sum` 或 `help(sum)`。要搜索函数，可以使用\
  \ `help.search(\"sin\")` 函数来提供帮助。对于某些函数，可以通过输入表达式 `example(plot)` 查看使用示例。注释以 `#`\
  \ 开头，而给变量赋值时可以使用 `<-` 或 `=`。例如：\n\n```\na <- 42\nb <- (42 + a) / 2\nprint(a)\n```\n\
  \n```\n## [1] 42\n```\n\n```\nprint(b)\n```\n\n```\n## [1] 42\n```\n\n使用 `ls()`\
  \ 可以检查当前会话中存在的所有变量。\n\n```\nls()\n```\n\n```\n## [1] \"a\" \"accuracy\" \"b\" \"\
  centers\" \"clustering\" \"col\" \"control\" \"ctrl\" \"d\"\n```\n\n要删除当前会话中的所有变量，可以使用：\n\
  \n```\nrm(list=ls())\n```\n\n## 1.2 向量 (Vectors)\n\n向量是相似类型的集合。一个向量是某些类型元素的集合。下面显示了关于向量的一些操作。创建一个向量：`a\
  \ <- c(1, 2, 3, 4, 5)`，另一个向量 `b <- c(10, 20, 30, 40, 50)`。向量 `a` 的索引可以通过 `a[1]`\
