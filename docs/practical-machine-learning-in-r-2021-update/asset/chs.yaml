  \n## 1.5 R 脚本\n\n到目前，我们直接在 R 命令行中输入。我们还可以将一系列命令保存到文件中并运行。这样做的方法是创建一个带有 `.R` 扩展的文件，并使用\
  \ `source` 函数来运行它。良好的习惯是始终使用 `rm(list())` 清空会话。另一方面，如果它是作为库使用的（例如加载你创建的一些函数），那么可能不应该这样做。你也可以将其他源文件包含在当前文件中以提高可读性，Google\
  \ 有一些 [Google R 风格指南](https://google.github.io/styleguide/)。\n\n## 1.6 函数\n\n让我们通过创建\
  \ `fahr_to_kelvin` 来学习如何创建函数，它可以将温度从华氏度转换为开尔文：\n\n```r\nfahr_to_kelvin <- function(temp)\
  \ {\n  kelvin <- ((temp - 32) * 5 / 9) + 273.15\n  return(kelvin)\n}\n```\n\n运行一个函数：\n\
  \n```r\nfahr_to_kelvin(32)\n```\n\n沸点：\n\n```r\nfahr_to_kelvin(212)\n```\n\n让我们创建一个将开尔文转换为摄氏度的函数：\n\
  \n```r\nfahr_to_celsius <- function(temp) {\n  celsius <- (temp - 273.15) * 5 /\
  \ 9\n  return(celsius)\n}\n```\n\n绝对零：\n\n```r\nfahr_to_celsius(0)\n```\n\n我们也可以在函数内部使用函数：\n\
  \n```r\nfahr_to_result <- function(temp) {\n  temp_k <- fahr_to_kelvin(temp)\n \
  \ result <- fahr_to_celsius(temp_k)\n  return(result)\n}\n```\n\n通过链式调用获取结果：\n\n\
  ```r\nfahr_to_result(32)\n```\n\n## 1.7 for 循环\n\n像所有编程语言都有 `for` 循环来处理循环任务。通用语法是：\n\
  \n```r\nfor (variable in collection) {\n  do things with variable\n}\n```\n\n一个示例：\n\
  \n```r\nsentence <- c(\"Let\", \"computer\", \"work\")\nprint_words <- function(sentence)\
  \ {\n  for (word in sentence) {\n    print(word)\n  }\n}\nprint_words(sentence)\n\
  ```\n\n另一个示例：\n\n```r\nlen <- 0\nvowels <- c(\"a\", \"e\", \"i\", \"o\", \"u\")\n\
  for (v in vowels) {\n  len <- len + 1\n}\n```\n\n## 1.8 决策\n\n在你的 R 脚本中做决策，R 提供了标准的\
  \ `if-else` 语句：\n\n```r\nnum <- 37\nif (num > 100) {\n  print(\"greater\")\n} else\
  \ {\n  print(\"not greater\")\n}\n```\n\n或者创建一个使用条件的函数：\n\n```r\nsign <- function(num)\
  \ {\n  if (num > 0) {\n    return(1)\n  } else if (num == 0) {\n    return(0)\n\
  \  } else {\n    return(-1)\n  }\n}\nsign(-3)\n```\n\n你可以使用逻辑运算符做决策：\n\n- 等 (`==`)\n\
  - 大于等于 (`>=`)\n- 小于等于 (`<=`)\n- 不等于 (`!=`)\n\n我们还可以组合测试。与符号 `&` 表示逻辑“与”；竖线 `|` 表示逻辑“或”。\n\
  \n## 1.9 数据集和统计数据\n\n通过运行 `data()` 函数，我们可以看到 R 安装中的某些数据集。例如检查 `iris` 数据集，可以使用函数：\n\
