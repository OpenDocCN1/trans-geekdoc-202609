  \n### 7.2 包装方法 (Wrapper Methods)\n\n#### 7.2.1 递归特征消除 (Recurrent Feature Elimination)\n\
  \n作为包装方法的演示，我们将使用 `Recurrent Feature Elimination (RFE)` 方法在 Pima Indians 糖尿病数据集中选择属性。为此，我们将使用\
  \ `caret` 库。\n\n首先，像往常一样，我们将数据集划分为训练集和验证集。\n\n```\n# 确保结果的可重复性\nset.seed(1234)\n\
  # 加载所需的库\nlibrary(mlbench)\nlibrary(caret)\n# 加载数据\ndata(PimaIndiansDiabetes)\n\
  data = PimaIndiansDiabetes\n# 划分训练集和验证集\nset.seed(1234)\nind <- sample(2, nrow(data),\
  \ replace=TRUE, prob=c(0.7, 0.3))\ntrainData <- data[ind==1,]\nvalidationData <-\
  \ data[ind==2,]\ntrainData <- trainData[complete.cases(trainData),]\nvalidationData\
  \ <- validationData[complete.cases(validationData),]\n```\n\n接下来，我们将使用 `caret` 包中的\
  \ `rfe` 方法，并使用 `rfeControl` 方法进行设置（如果出现缺少包 `klaR` 的错误，请安装库 `klaR:`）。\n\n```\n# 使用随机森林选择函数定义控制\n\
  control <- rfeControl(functions=nbFuncs, method=\"cv\", number=10)\n# 运行 RFE 算法\n\
  results <- rfe(trainData[,1:8], trainData[,9], sizes=c(1:8), rfeControl=control)\n\
  ```\n\n让我们看看结果。\n\n```\n# 总结结果\nprint(results)\n```\n\n```\n## 递归特征选择\n## 外部重采样方法：交叉验证\
  \ (10 折) \n## 子集大小的重采样性能：\n##  Variables Accuracy  Kappa AccuracySD KappaSD Selected\n\
  ##          1   0.7453 0.3681    0.04390 0.12449         \n##          2   0.7546\
  \ 0.4182    0.04598 0.12317         \n##          3   0.7715 0.4707    0.05759 0.14388\
  \        \n##          4   0.7584 0.4479    0.04145 0.10478         \n##       \
  \   5   0.7546 0.4457    0.04429 0.10095         \n##          6   0.7490 0.4344\
  \    0.04393 0.09394         \n##          7   0.7509 0.4290    0.04686 0.11122\
  \         \n##          8   0.7491 0.4201    0.03507 0.07767         \n## \n## 前\
  \ 3 个变量（共 3 个）：\n##    glucose, age, mass\n```\n\nRFE 从 8 个特征中选择了三个（`glucose`、`age`、`mass`），它们在\
  \ 10 折交叉验证下提供了最佳准确率。\n\n#### 7.2.2 前向搜索 (Forward Search)\n\n标准的包装方法有正向搜索和反向搜索。在本节中，我们应用正向搜索和决策树。\n\
  \n```\nlibrary(FSelector)\nlibrary(rpart)\n\nevaluator <- function(subset) {\n \
  \ #k 折交叉验证\n  k <- 5\n  splits <- runif(nrow(trainData))\n  results = sapply(1:k,\
  \ function(i) {\n    test.idx <- (splits >= (i - 1) / k) & (splits < i / k)\n  \
  \  train.idx <- !test.idx\n    test <- trainData[test.idx, , drop=FALSE]\n    train\
  \ <- trainData[train.idx, , drop=FALSE]\n    tree <- rpart(as.simple.formula(subset,\
  \ \"Class\"), train)\n    error.rate = sum(test$Class != predict(tree, test, type=\"\
  c\")) / nrow(test)\n    return(1 - error.rate)\n  })\n  print(subset)\n  print(mean(results))\n\
  \  return(mean(results))\n}\n\nsubset <- forward.search(names(trainData)[-10], evaluator)\n\
  ```\n\n\n\n\n```\n## [1] \"ClumpThickness\" (团厚度)\n## [1] 0.8535402\n## [1] \"UniformityCellSize\"\
  \ (细胞均匀尺寸)\n## [1] 0.9169743\n## [1] \"UniformityCellShape\" (细胞均匀形状)\n## [1] 0.9046481\n\
