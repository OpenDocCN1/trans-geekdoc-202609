  ![](img/chapter10----silhouette_plot.png)\n\n# 第 11 章基于密度的聚类\n\n`基于密度的聚类`基于这样一个事实：给定一个训练数据集，类可以定义为密度高于数据集其他部分的区域。稀疏区域内的数据实例（用于分离类）通常被认为是噪声。最著名且广泛使用的基于密度的算法是\
  \ `DBSCAN`（基于噪声的密度空间聚类），它由 Martin Ester、Hans-Peter Kriegel、Jorg Sander 和绪晓伟于 1996\
  \ 年提出。`DBSCAN` 算法的核心思想是：给定某些 n 维空间中的一组点，紧密聚集的点（具有许多邻近点且密度较高的点）被分到类中，而孤立在低密度区域的点则被视为离群值。\n\
  \n## 11.1 R 中的 DBSCAN\n\n为了在 R 中使用 `DBSCAN`，我们需要使用 `cluster` 库，可以通过以下命令导入：\n\n```\n\
  library(dbscan)\n```\n\n为了使用 `DBSCAN` 执行聚类并获取输入数据集在类中的分布，我们可以使用以下命令：\n\n```\n# Perform\
  \ clustering using DBSCAN\nmodel = dbscan(ddata, eps = 1.0, minPts = 4)\n\n# Get\
  \ distribution of the input dataset into clusters\nclusters = model$cluster\n```\n\
  \n`DBSCAN` 算法需要设置两个主要参数：\n\n* `epsilon (eps)`，指定两个数据点之间为了被视为同一类的一部分所允许的最大距离。\n*\
  \ `minPoints (minPts)`，指定形成一个类所需的的数据点最少数量。\n\n## 11.2 DBSCAN 模型构建\n\n为了尝试使用 `DBSCAN`\
  \ 算法构建基于密度的聚类模型，我们将使用下表的数据：\n\n|  || X || Y |\n| --- | --- | --- |\n| x1 || 2 ||\
  \ 10 |\n| x2 || 2 || 5 |\n| x3 || 8 || 4 |\n| x4 || 5 || 8 |\n| x5 || 7 || 5 |\n\
  | x6 || 6 || 4 |\n| x7 || 1 || 2 |\n| x8 || 4 || 9 |\n\n为了使用 R 可视化数据，我们首先需要使用以下命令创建相应的数据框：\n\
  \n```\n# 构建包含 X 轴数据的向量\nX = c(2, 2, 8, 5, 7, 6, 1, 4)\n\n# 构建包含 Y 轴数据的向量\nY = c(10,\
  \ 5, 4, 8, 5, 4, 2, 9)\n\n# 构建包含与行名对应数据标签的向量\nrnames = c(\"x1\", \"x2\", \"x3\"\
  , \"x4\", \"x5\", \"x6\", \"x7\", \"x8\")\n\n# 创建数据框\nddata = data.frame(X, Y, row.names\
  \ = rnames)\n```\n\n一旦创建了数据框，我们就可以使用以下命令绘制数据：\n\n```\n# Plot the data\nplot(ddata,\
  \ pch = 15)\n\n# 添加数据标签\ntext(ddata, labels = row.names(hdata), \n             \
  \   pos = c(4, 2, 4, 4, 4, 4, 4, 4))\n```\n\n我们的数据如下图所示：\n\n![](img/chapter11----data_plot.png)\n\
  \n## 11.3 DBSCAN 计算\n\n在本小节中，我们将应用 `minPoints = 2` 和 `epsilon = {2, 3.5}` 的 `DBSCAN`\
  \ 算法，将给定数据分配到类中。\n\n* `minPoints = 2 and epsilon = 2`\n\n我们首先需要计算给定数据集的距离矩阵，如下表所示：\n\
  \n|  || x1 || x2 || x3 || x4 || x5 || x6 || x7 || x8 |\n| --- | --- | --- | ---\
  \ | --- | --- | --- | --- | --- |\n| x1 || 0.00 |  |  |  |  |  |  |  |\n| x2 ||\
  \ 5.00 || 0.00 |  |  |  |  |  |  |\n| x3 || 8.49 || 6.08 || 0.00 |  |  |  |  | \
  \ |\n| x4 || 3.61 || 4.24 || 5.00 || 0.00 |  |  |  |  |\n| x5 || 7.07 || 5.00 ||\
  \ 7.00 | 0.00 | 0.00 |  |  |\n| x6 || 7.21 || 4.20 | 7.00 | 0.00 | 0.00. 0 |\n|\
  \ x7 || 8.00 || 6.00 || 0.00 || 3.00 | 0.00 | 0.00 |\n| x8 || 8.49 || 5.00 || 6.00\
  \ || 5.00 || 5.00 | 5.00 | 0.00 |\n\n\n\n\n\n![](img/chapter11----app_kMeans_plot.png)\n\
  \n如我们所示，k-Means 无法充分将数据划分为不同的簇。这一结果源于 k-Means 依赖于欧式距离，因此无法区分具有复杂结构的簇。\n\n### 11.5.2\
  \ 优化参数 eps\n\n为了优化 `DBSCAN` 算法的参数 `eps`（问题 (c）），我们将使用 `kNN` 距离。我们可以使用以下 R 命令来计算每个数据点与其最近\
  \ 10 个邻居的距离：\n\n```\nknndist = kNNdist(mdata, k = 10)\n```\n\n然后，在对数据进行升序排序后，绘制相应的图形：\n\
  \n```\n# Plot distances\nplot(sort(knndist), type = 'l', xlab = \"Points sorted\
  \ by distance\",\n                              ylab = \"10-NN distance\")\n```\n\
  \n![](img/chapter11----app_kNN_dist.png)\n\n为了优化 `eps`，我们遵循手肘线法（elbow method）。从图中可以看出，优化的\
  \ `eps` 值位于 [0.35, 0.45] 区间。\n\n### 11.5.3 使用 DBSCAN 建模\n\n最后，我们可以通过使用 `eps = 0.4`\
  \ 和 `minPoints = 10` 在给定数据集上应用 `DBSCAN` 来回答问题 (d)。\n\n```\n# Construct DBSCAN model\n\
  model = dbscan(mdata, eps = 0.4, minPts = 10)\n\n# Plot distances\nplot(mdata, col\
  \ = model$cluster + 1, pch = ifelse(model$cluster, 1, 4))\n```\n\n下图描述了聚类结果。如我们所示，`DBSCAN`\
  \ 能够有效地将给定数据集划分为簇。\n\n![](img/chapter11----app_dbscan.png)\n\n# 第 12 章 - 基于分布的聚类\n\
  \n### 12.1 理论背景\n\n`基于分布的聚类`与统计学密切相关，它基于这样一个事实：簇可以被定义为最可能属于同一分布的数据实例集合。虽然应用于此类聚类的方法的理论基础非常优秀，但除非在模型复杂度中设置某些限制，否则它们会受到一个名为`过拟合`的关键问题的影响。更复杂的模型通常能够更好地解释数据，这使得选择合适的复杂度水平在本质上变得困难。一种突出且被广泛的方法被称为`高斯混合模型`（`Gaussian\
  \ Mixture Models`或`GMMs`，使用`期望极大化算法`或`EM`）。\n\n#### 12.1.1 期望极大化算法\n\n在统计学中，`期望-极大化\
  \ (EM)` 算法是一种迭代方法，用于寻找统计模型中参数（未观测隐性变量时）的极大似然估计或最大后验概率 (MAP) 估计，其中模型依赖于未观测的隐性变量。在实践中，`EM`\
  \ 算法使以下表达式最大化：\n\n![X: dataset, \\\\ \\\\ Z: latent \\\\ \\\\ variables, \\\\ \\\
  \\ \\\\\\\\theta: set \\\\ \\\\ of \\\\ \\\\ parameters](img/leanpub_equation_85.png)![\\\
  \\ln{P(X/\\\\theta)} = \\\\ln{\\\\displaystyle\\\\sum\\_{Z}P(X, Z/\\\\theta)}](img/leanpub_equation_86.png)\n\
  \n`EM` 迭代在期望步（`E-step`）和极大步（`M-step`）之间交替：期望步利用当前参数估计创建一个对数似然期望的函数，而极大步则计算在`E-step`中找到的期望对数似然的参数。这些参数估计随后用于确定下一个\
  \ `E-step` 中隐性变量的分布。\n\n`E-step:`\n\n![Given \\\\ \\\\ \\\\theta_{old}: \\\\ \\\\\
  \ find \\\\ \\\\ P(Z/X, \\\\theta_{old})](img/leanpub_equation_87.png)\n\n`M-step:`\n\
  \n![\\\\theta_{new} = argmax_{\\\\theta}(\\displaystyle\\\\sum\\_{Z}P(Z/X, \\\\\
  theta_{old}))](img/images88.png)\n\n当对数似然值不再更新或更新小于阈值时，`EM` 算法达到收敛。\n\n#### 12.1.2\
  \ 高斯混合模型 - GMMs\n\n`高斯混合模型`是一种概率模型，假设所有数据点都是由有限数量未知参数的高斯分布生成的。可以将混合模型看作是 `k-means`\
  \ 的推广，包含了关于数据的协方差结构以及高斯中心的信息。通常，`k` 个正态分布的混合由以下方程给出：\n\n![P(x) = \\displaystyle\\\
  \\sum\\_{k = 1}^K\\\\pi_{k}N(x/\\\\mu_{k}},\\\\Sigma_{k})](img/leanpub_equation_89.png)![where](img/leanpub_equation_90.png)![\\\
  \\pi_{k}: Mixing \\\\ Coefficients \\\\in [0, 1] and \\\\displaystyle\\\\sum\\_{k\
  \ = 1}^K\\\\pi_{k} = 1](images/leanpub_equation_91.png)![\\\\mu_{k}, \\\\Sigma_{k}\
  \ : Mean \\\\ Covariance \\\\ of distribution \\\\ k](img/leanpub_equation_92.png)![N(x/\\\
  \\mu, \\\\Sigma) = \\\\dfrac{1}{2\\\\pi^{n/2}}\\\\text{\\\\Sigma}\\\\text{\\}}^{1/2}}e^{-\\\
  frac{1}{2}(x- \\\\mu)^T\\\\Sigma^{-1}}](img/leanpub_equation_93.png)\n\n`GMMs` 使用\
  \ `EM` 作为计算描述数据的分布隐性变量的优化算法。因此，在 `GMMs` 的情况下，`EM` 算法极大化以下量：\n\n![\\\\ln{P(X/\\\\\
  pi, \\\\mu, \\\\Sigma)} = \\\\displaystyle\\\\sum\\_{n = 1}^N\\\\ln(\\\\displaystyle\\\
  \\sum\\_{k = 1}^K\\\\pi_{k}N(x/\\\\mu_{k}},\\\\Sigma_{k}))](img/leanpub_equation_94.png)![where](img/leanpub_equation_95.png)\n\
  \n### 12.2 使用 EM 构建高斯混合模型\n\n为了使用 `GMMs` 进行聚类，我们将使用一个包含 1000 个来自不同分布的一维数据实例的数据集。关于这些分布，我们知道它们的标准差为\
  \ 1。数据的摘要如下表：\n\n| | D1_X | D2_X |\n| --- | --- | --- |\n| **Min.** | -1.905 | 3.992\
  \ |\n| --- | --- | --- |\n| **1st Qu.** | 0.223 | 6.322 |\n| **Median** | 0.907\
  \ | 6.944 |\n| **Mean** | 1.000 | 6.985 |\n| **3rd Qu.** | 1.664 | 7.681 |\n| **Max.**\
  \ | 3.659 | 10.810 |\n\n使用上述数据，我们将回答以下问题：\n\n(a) 绘制数据（一维）以及概率密度函数，为每个分布使用不同的颜色。\n\
  \n(b) 计算每个正态分布的均值 (\\\\mu_1, ![\\\\mu_2](img/leanpub_equation_97.png))）和隐性变量 (\\\
  \\lambda_1, ![\\\\lambda_2](img/leanpub_equation_99.png))）。\n\n(d) 在同一图中绘制给定数据的估计和真实概率密度函数。\n\
  \n#### 12.2.1 数据绘图\n\n为了回答第一个问题，我们首先使用以下命令读取数据：\n\n```\n# Read data\ngdata = read.csv(\"\
  gdata.txt\")\n\n# Save 1D data in the vector x\nx = gdata[, 1]\n\n# Save cluster\
  \ index in the vector y\ny = gdata[, 2]\n```\n\n为了绘制数据以及概率密度函数，我们可以使用以下命令：\n\n```\n\
  # Plot data\nplot(data.frame(x, 0), ylim = c(-0.01, 0.25), col = y, \n         \
  \                             xlab = \"Data\",\n                               \
  \       ylab = \"Density\")\n\n# Plot probability density function\nlines(density(x),\
  \ col = y)\n```\n\n下图说明了给定数据集以及概率密度函数。来自每个簇的数据用不同的颜色（黑色和红色）表示。\n\n![](img/chapter12----density.png)\n\
  \n#### 12.2.2 正态分布参数的手动计算\n\n在本小节中，我们将使用给定数据集通过 `EM` 算法计算正态分布的参数。首先，我们将为参数选择随机初始值\
  \ ![\\\\mu](img/leanpub_equation_100.png)和 ![\\\\lambda](img/leanpub_equation_101.png):\n\
  \n\n\n\n\n![Initialization: \\mu\\_1 = 0 , \\mu\\_2 = 1, \\lambda\\_1 = 0.5, \\\
  lambda\\_2 = 0.5](img/leanpub_equation_102.png)![\\\\Theta = \\\\{ \\theta\\_1,\
  \ \\\\theta\\_2 \\\\} = \\\\{ (0, 1, 0.5),(1, 1, 0.5) \\\\}](img/leanpub_equation_103.png)\n\
  \n## E 步 (期望步)\n\n在这一步中，我们想要计算给定数据点源自某个正态分布的概率。该概率由以下方程给出：\n\n![P(D\\_j/x\\_i, \\\
  theta\\_j) = \\\\dfrac{\\\\lambda\\_j \\cdot P(x\\_i / \\theta\\_j) }{ \\\\lambda\\\
  _1 \\cdot P(x\\_i / \\theta\\_1) + \\lambda\\_2 \\cdot P(x\\_i / \\theta\\_2)}](img/leanpub_equation_104.png)![where:\
  \ j = 1,2 \\\\ \\\\ \\\\ \\\\ \\lambda_{init} = \\{ \\lambda\\_1, \\lambda\\_2 \\\
  \\} = \\{ 0.5, 0.5 \\\\}](img/leanpub_equation_105.png)\n\n此时，我们将为给定的点 ![x\\_i =\
  \ 2](img/leanpub_equation_106.png) 计算上述概率：\n\n![P(x\\_i/ \\theta\\_j) = \\\\dfrac{1}{\\\
  \\sqrt{2\\pi\\sigma\\_j}}e^{-\\frac{(x\\_i - \\mu\\_j)²}{2 \\sigma\\_j}}](img/leanpub_equation_107.png)![P(2/\
  \ \\theta\\_1) = \\\\dfrac{1}{\\\\sqrt{2\\pi \\cdot 1}}e^{-\\frac{(2 - 0)²}{2 \\\
  cdot 1}} = \\\\dfrac{1}{\\\\sqrt{2\\pi}}e^{-2} = 0.054](img/leanpub_equation_108.png)![P(2/\
  \ \\theta\\_2) = \\\\dfrac{1}{\\\\sqrt{2\\pi \\cdot 1}}e^{-\\frac{(2 - 1)²}{2 \\\
  cdot 1}} = \\\\dfrac{1}{\\\\sqrt{2\\pi}}e^{-1/2} = 0.242](img/leanpub_equation_109.png)\n\
  \n给定点源自分布 1 和 2 的概率由以下两个方程给出：\n\n![P(D\\_1/2, \\theta\\_1) = \\\\dfrac{0.5 \\cdot\
  \ 0.054}{0.5 \\cdot 0.054 + 0.5 \\cdot 0.242} = 0.182](img/leanpub_equation_110.png)![P(D\\\
  _2/2, \\theta\\_2) = \\\\dfrac{0.5 \\cdot 0.242}{0.5 \\cdot 0.054 + 0.5 \\cdot 0.242}\
  \ = 0.818](img/leanpub_equation_111.png)\n\n给定上述结果，点 ![x\\_i = 2](img/leanpub_equation_112.png)\
  \ 源自分布 1 的概率为 0.182，源自分布 2 的概率为 0.818。一旦为所有 1,000 个数据点计算出上述概率，我们将进入 EM 的极大化步。\n\n\
  ## M 步 (极大化步)\n\n在这一步中，我们将计算参数 `mu_1`, `mu_2`(images/leanpub_equation_113.png)，使得概率\
  \ `P(D\\_1/X\\_i, \\theta\\_1)`, `P(D\\_2/X\\_i, \\theta\\_2)`(images/leanpub_equation_114.png)\
  \ 最大。为了计算参数 `mu_1`, `mu_2`(images/leanpub_equation_115.png)，我们将使用以下方程：\n\n![mu\\\
  _1 = \\\\dfrac{\\\\sum_{i=1}^{1000} x\\_i \\cdot P(D\\_1/x\\_i, \\theta\\_1)}{\\\
  \\sum_{i=1}^{1000} P(D\\_1/x\\_i)}](img/leanpub_equation_116.png)![mu\\_2 = \\\\\
  dfrac{\\\\sum_{i=1}^{1000} x\\_i \\cdot P(D\\_2/x\\_i, \\theta\\_2)}{\\\\sum_{i=1}^{1000}\
  \ P(D\\_2/x\\_i)}](img/leanpub_equation_117.png)\n\n上述方程计算了所有数据点的加权平均值，其中权重实际上是每个数据点源自两个分布之一的概率。\n\
  \n混合系数由以下方程给出：\n\n![lambda\\_1 = \\\\dfrac{\\\\sum_{i=1}^{1000} P(D\\_1/x\\_i, \\\
  theta\\_1)}{1000}](img/leanpub_equation_118.png)![lambda\\_2 = \\\\dfrac{\\\\sum_{i=1}^{1000}\
  \ P(D\\_2/x\\_i, \\theta\\_2)}{1000}](img/leanpub_equation_119.png)\n\n在计算出参数 `mu_1`,\
  \ `mu_2`, `lambda_1`, `lambda_2`(images/leanpub_equation_120.png) 的值后，给定数据集的对数似然由以下方程给出:\n\
  \n![ln({P(X/\\theta)}) = \\\\displaystyle\\\\sum_{i = 1}^{1000}\\\\ln(\\\\sum_{j\
  \ = 1}²\\\\lambda_{j} \\\\cdot P(x\\_i/\\\\theta\\_j))](img/leanpub_equation_121.png)![=\
  \ \\\\displaystyle\\\\sum_{i = 1}^{1000}\\\\ln(\\\\lambda_{1} \\cdot P(x\\_i/\\\\\
  theta\\_1) + \\\\lambda_{2} \\cdot P(x\\_i/\\\\theta\\_2))](img/leanpub_equation_122.png)\n\
  \n一旦计算出数据集的对数似然，将其与上一次迭代的值进行比较。如果该值的没有超过给定的阈值（`epsilon`），则算法收敛。否则，我们返回 E 步重新计算参数值并继续执行。\n\
  \n### 使用 R 计算正态分布的参数\n\n使用 R 计算正态分布参数的方法涉及两个主要步骤：初始化和循环直到收敛。* **第 1 步：初始化均值**\n\n\
  ```r\n# 初始化均值\nmu = c(0, 1)\n\n# 初始化混合系数\nlambda = c(0.5, 0.5)\n\n# 设置停止准则\nepsilon\
  \ = 1e-8\n```\n\n* **第 2 步：循环直到收敛**\n\n允许我们计算正态分布参数的 R 方法如下：\n\n```r\nrepeat {\n\
  \  # 期望步\n  # 找到分布\n  T1 <- dnorm(x, mean = mu[1], sd = 1) * lambda[1]\n  T2 <-\
  \ dnorm(x, mean = mu[2], sd = 1) * lambda[2]\n  \n  # 极大化步\n  # 计算对数似然\n  new_likelihood\
  \ = sum(log(T1 + T2))\n  \n  # 打印当前参数和似然\n  cat(\"mu =\", mu, \" lambda =\", lambda,\
  \ \" loglikelihood =\", new_likelihood, \"\\n\")\n  \n  # 如果似然收敛则停止\n  if (new_likelihood\
  \ - log_likelihood <= epsilon) break\n  log_likelihood = new_likelihood\n}\n```\n\
  \n#### 使用 mixtools 构建 GMM 模型\n\n为了回答 (c)，我们将使用 mixtools 库：\n\n```r\nlibrary(mixtools)\n\
  \n# 应用 EM 使用初始化\nmodel <- normalEM(x, mu = c(0,1))\n```r\n\n# 获取分布的均值\nmodel$mu\n\
  \n# 获取混合系数\nmodel$lambda\n\n# 获取最终似然\nmodel$loglik\n```\n\n我们可以在同一图中绘制原始密度和估计密度函数：\n\
  \n```r\n# 绘制估计密度函数\nplot(model, which = 2)\n\n# 绘制原始密度函数\nlines(density(x), lty\
  \ = 2, lwd = 2)\n```\n\n\n\n\n(b) 构建一个 GMM 模型以将提供的数据集聚类为 3 个簇。将 epsilon 值设置为 0.1。\n\
  \n(c) 展示 EM 算法的收敛情况，并使用估计的概率密度函数绘制数据。\n\n(d) 将每个数据点分配给概率最高的簇，并绘制公式化后的聚类质质心。\n\n\
  (e) 计算并绘制轮廓系数（silhouette coefficient）。\n\n(f) 显示根据上述聚类结果对数据进行排序后的热力图。\n\n### 12.3.1\
  \ 数据集构建\n\n首先，我们将使用以下命令读取给定的数据集：\n\n```\n# Read data\ngsdata = read.csv(\"gsdata.txt\"\
  )\n\n# 第三列包含每个数据点的聚类标签\ntarget = gsdata[, 3]\n\n# 前两列包含数据坐标\ngsdata = gsdata[, 1:2]\n\
  ```\n\n我们可以使用以下命令绘制数据：\n\n```\nplot(gsdata, col = target)\n```\n\n输出结果如图所示，其中每个簇的数据点用不同的颜色（红色、黑色、绿色）表示：\n\
  \n![](img/chapter12----app_data_overview.png)\n\n### 12.3.2 GMM 模型构建\n\n为了构建 GMM\
  \ 模型，我们将使用以下命令：\n\n```\n# Import library mixtools\nlibrary(mixtools)\n\n# Construct\
  \ model\nmodel = mvnormalmixEM(gsdata, k = 3 , epsilon = 0.1)\n```\n\n一旦构建了模型，我们可以使用以下命令演示算法是如何收敛的：\n\
  \n```\nplot(model, which = 1)\n```\n\n收敛情况如图所示：\n\n![](img/chapter12----app_convergence.png)\n\
  \n如图所示，值得注意的是 EM 算法收敛得非常快。从第 2 次迭代开始，对数似然值（log-likelihood）几乎几乎保持不变。\n\n最后，我们可以使用以下命令绘制给定的数据集以及每个簇的概率密度函数：\n\
  \n```\nplot(model, which = 2)\n```\n\n输出结果如图所示：\n\n![](img/chapter12----app_clusters_and_centers.png)\n\
  \n通过 `model$posterior` 命令，我们可以看到每个数据点源于三个簇中任一个簇的概率（软分配）。然而，为了回答这个问题，我们使用以下命令进行了“硬分配”（hard-assignments）：\n\
  \n```\n# 将每个点分配给概率最高的簇\nclusters = max.col(model$posterior)\n\n# Calculate centers\
  \ \ncenters = matrix(unlist(model$mu), byrow = TRUE, ncol = 2)\n```\n\n使用上述硬分配结果，我们可以计算轮廓系数并构建热力图。\n\
  \n### 12.3.3 轮廓计算\n\n为了计算并绘制轮廓图，我们可以使用以下命令：\n\n```\n# Calculate silhouette\nmodel_silhouette\
  \ = silhouette(clusters, dist(gsdata))\n\n# Plot silhouette\nplot(model_silhouette)\n\
  ```\n\n![](img/chapter12----app_silhouette.png)\n\n### 12.3.4 热力图构建\n\n为了构建热力图，我们可以使用以下\
  \ R 命令：\n\n```\n# 根据聚类值对数据进行排序\ngsdata_ord = gsdata[order(clusters),]\n\n# Construct\
  \ heatmap\nheatmap(as.matrix(gsdata_ord), Rowv = NA, Colv = NA, col = heat.colors(256),\
  \ rev = TRUE)\n```\n\n![](img/chapter12----app_heatmap.png)\n\n### 12.4 基于信息标准的\
  \ GMM 应用\n\n在本节中，我们将根据信息标准使用 GMM 进行聚类，以选择最优簇数量。沿着这一方向，我们将使用一个包含 300 个数据点的数据集。给定的数据集摘要如下表所示：\n\
  \n| X | |\n| --- | --- |\n| 最小值 (Min.) | -2.2239 |\n| 第一四分位数 (1st Qu.) | 0.6396\
  \ |\n| 中位数 (Median) | 5.1139 |\n| 平均值 (Mean) | 5.0336 |\n| 第三四分位数 (3rd Qu.) | 9.1177\
  \ |\n| 最大值 (Max.) | 12.0908 |\n\n我们将使用给定数据集回答以下问题：\n\n(a) 绘制数据及其概率密度函数\n(b) 使用 EM\
  \ 算法进行聚类，将簇的数量设置为 2, 3, 4 和 5。对于每种情况，绘制概率密度函数并计算信息标准 AIC 和 BIC。\n(c) 绘制不同簇数量的 AIC\
  \ 和 BIC 值，并选择最优簇数量\n\n#### 12.4.1 数据构建\n\n首先，我们将使用以下命令读取给定的数据集：\n\n```\n# Import\
  \ mixtools library\nlibrary(mixtools)\n\n# Read data\nicdata = read.csv(\"icdata.txt\"\
  )\n\n# 第一列包含每个数据点的值\nx = icdata[, 1]\n\n# 第二列包含每个数据点的聚类标签\ny = icdata[, 2]\n```\n\
  \n之后，我们可以使用以下命令绘制数据集及其概率密度函数：\n\n```\n# Plot data\nplot(data.frame(x, y), ylim =\
  \ c(-0.01, 0.1))\n\n# Plot probability density function\nlines(density(x))\n```\n\
  \n![](img/chapter12----app_info_density.png)\n\n#### 12.4.2 使用信息标准选择最优簇数量\n\n为了回答问题\
  \ (b)，我们需要计算赤池信息准则 (AIC) 和贝叶斯信息准则 (BIC)。对于具有 `t` 个参数、`N` 个样本且对数似值为 `L` 的给定模型，上述标准公式如下：\n\
  \n![AIC = 2 * t - 2 * L](img/leanpub_123.png)\n![BIC = t * ln(N) - 2 * L](img/leanpub_124.png)\n\
  \n我们将使用以下代码对 2, 3, 4 和 5 个分布进行聚类：\n\n```\n# Vector for holding AIC values\nAIC =\
  \ c()\n\n# Vector for holding BIC values\nBIC = c()\n\n# 设置 2x2 画图布局\npar(mfrow\
  \ = c(2, 2))\n\n# 遍历簇的数量\nfor (k in 2:5) {\n  # 构建模型\n  model <- normalmixEM(x,\
  \ k = k, epsilon = 0.0001)\n  \n  # 绘制聚类结果\n  plot(model, which = 2 , main2 = paste(\"\
  Density (k = \", k, \")\", sep = \"\"))\n  \n  # 计算参数\n  numparams = length(model$mu)\
  \ + length(model$stdev) + length(model$lambda)\n  \n  # 存储 AIC 和 BIC 值\n  AIC[k]\
  \ = 2 * numparams - 2 * model$loglik\n  BIC[k] = log(length(x)) * numparams - 2\
  \ * model$loglik\n}\n```\n\n该图展示了聚类结果：\n\n![](img/chapter12----app_info_clusters.png)\n\
  \n最后，我们可以使用以下命令绘制 AIC 和 BIC 值：\n\n```\n# Plot AIC values\nplot(AIC[2:5], type =\
  \ 'l', xaxt = \"n\", main = \"AIC\", ylab = \"AIC\")\naxis(1, at = 1:4, labels =\
  \ 2:5)\n\n# Plot BIC values\nplot(BIC[2:5], type = 'l', xaxt = \"n\", main = \"\
  BIC\", ylab = \"BIC\")\naxis(1, at = 1:4, labels = 2:5)\n```\n\nAIC 和 BIC 值与簇数量的关系如图所示：\n\
