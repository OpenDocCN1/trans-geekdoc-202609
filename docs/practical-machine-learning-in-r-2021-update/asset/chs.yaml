  \ 4 个错误。当然，在现实场景中，对于这样的小的数据集应该使用交叉验证。\n\n### 8.2.3 用于绘图的 PCA\n\n使用 PCA，我们还可以通过仅使用前两个成分，在高维数据上进行二维绘图。\n\
  \n```r\nplot(train.pca$x[trainData$Species == 'setosa',1:2], col=\"blue\", ylim\
  \ = c(-3, 3),\nxlim=c(-3,3), asp=1)\npoints(train.pca$x[trainData$Species == 'versicolor',1:2],\
  \ pch = 3, col=\"red\")\npoints(train.pca$x[trainData$Species == 'virginica',1:2],\
  \ pch = 4, col=\"green\")\n```\n\n\n\n在轮廓系数的计算中，`data` 代表原始数据。为了绘制轮廓系数和平均轮廓系数，我们可以使用以下命令：\n\
  \n```\n# 绘制轮廓\nplot(model_silhouette)\n\n# 计算平均轮廓系数\nmean(model_silhouette[, 3])\n\
  ```\n\n另一种可以让我们概览聚类情况并评估其性能的方法是构建热图。首先，我们可以使用以下命令对数据样本进行排序：\n\n```\ndata_ord = data[order(model$cluster),]\n\
  ```\n\n然后构建我们的热图：\n\n```\nheatmap(as.matrix(dist(data_ord)), Rowv = NA, Colv = NA,\
  \ \n              col = heat.colors(256), revC = TRUE)\n```\n\n下图展示了使用分布在 3 个簇中的数据样本构建的示例热图。热图的颜色代表有序数据样本的距离。红色表示距离较小，黄色表示距离较大。\n\
  \n![](img/chapter9----heatmap.png)\n\n## 9.4 k-Means 聚类概述\n\n下表包含了我们将用于使用 k-Means\
  \ 算法解决聚类问题的数据集。\n\n| || X || Y |\n| --- | --- | --- |\n| x1 | 7 | 1 |\n| x2 | 3\
  \ | 4 |\n| x3 | 1 | 5 |\n| x4 | 5 | 8 |\n| x5 | 1 | 3 |\n| x6 | 7 | 8 |\n| x7 |\
  \ 8 | 2 |\n| x8 | 5 | 9 |\n\n使用上述数据集，我们将回答以下问题：\n\n(a) 在二维空间中绘制数据。\n\n(b) 应用 k-Means\
  \ 算法将数据点分配到 3 个簇中。使用数据点 `x1`、`x2` 和 `x3` 作为初始中心来初始化算法。\n\n(c) 计算问题 (b) 中执行的聚类的内聚度（cohesion）和离散度（separation）。\n\
  \n(d) 使用不同的颜色为每个簇中包含的数据点绘制聚类结果，并标记质心。\n\n### 9.4.1 数据构建\n\n首先，我们需要正确地构建包含上述数据集的数据框。为了做到，我们可以使用以下命令：\n\
  \n```\n# 构建包含 X 轴数据的向量\nX = c(7, 3, 1, 5, 1, 7, 8, 5)\n\n# 构建包含 Y 轴数据的向量\nY = c(1,\
  \ 4, 5, 8, 3, 8, 2, 9)\n\n# 构建对应行名的数据标签向量\nrnames = c(\"x1\", \"x2\", \"x3\", \"\
  x4\", \"x5\", \"x6\", \"x7\", \"x8\")\n\n# 创建数据框\nkdata = data.frame(X, Y, row.names\
  \ = rnames)\n```\n\n一旦创建了数据框，我们可以使用以下命令绘制数据：\n\n```\n# 绘制数据\nplot(kdata, pch = 15)\n\
  \n# 添加数据标签\ntext(hdata, labels = row.names(hdata), \n                pos = c(4,\
  \ 2, 4, 4, 4, 4, 4, 4))\n```\n\n我们的数据如图所示：\n\n![](img/chapter9----data_plot.png)\n\
  \n### 9.4.2 使用 k-Means 算法进行聚类\n\n为了回答问题 (b)，我们设置数据点 `x1`、`x2` 和 `x3` 为初始中心并应用 k-Means\
  \ 算法：\n\n![C\\_1^{0} = \\begin{bmatrix} 7 \\\\\\\\ 1 \\end{bmatrix} \\ \\\\ \\\\\
  \ \\\\ C\\_2^{0} = \\begin{bmatrix} 3 \\\\\\\\ 4 \\end{bmatrix} \\ \\\\ \\\\ \\\\\
  \ C\\_3^{0} = \\begin{bmatrix} 1 \\\\\\\\ 5 \\end{bmatrix}](img/leanpub_equation_45.png)\n\
  \n***第一次迭代：***\n\n首先，我们将计算数据集中所有数据点与初始中心之间的距离。这些距离在下面的距离矩阵中：\n\n| || ![C\\_1^{0}](img/leanpub_equation_46.png)\
  \ || ![C\\_2^{0}](img/leanpub_equation_47.png) || ![C\\_3^{0}](img/leanpub_equation_48.png)\
  \ |\n| --- | --- | --- | --- |\n| x1 | **0.00** | 5.00 | 7.21 |\n| x2 | 5.00 | **0.00**\
  \ | 2.24 |\n| x3 | 7.21 | 2.24 | **0.00** |\n| x4 | 7.28 | **4.47** | 5.00 |\n|\
  \ x5 | 6.32 | 2.24 | **2.00** |\n| x6 | 7.00 | **5.66** | 6.71 |\n| x7 | **1.41**\
  \ | 5.39 | 7.62 |\n| x8 | 8.25 | **5.39** | 6.66 |\n\n计算距离后，我们找到每个数据点的最小距离并将其分配到相应的簇。一旦所有数据点都分配完毕，我们就计算新的中心。\n\
  \n![C\\_1^{1} = \\begin{bmatrix} 7.5 \\\\\\\\ 1.5 \\end{bmatrix}](img/leanpub_equation_49.png)C\\\
  _2^{1} = \\begin{bmatrix} 7 \\\\\\\\ 6.5 \\end{bmatrix}](images/leanpub_equation_50.png)C\\\
  _3^{1} = \\begin{bmatrix} 1 \\\\\\\\ 4 \\end{bmatrix}](images/leanpub_equation_50.png)\n\
  \n***第二次迭代：***\n\n下表包含了数据点到更新后的中心的距离。\n\n| || ![C\\_1^{1}](img/leanpub_equation_51.png)\
  \ || ![C\\_2^{1}](img/leanpub_equation_52.png) || ![C\\_3^{1}](img/leanpub_equation_53.png)\
  \ |\n| --- | --- | --- | --- |\n| x1 | **0.71** | 6.56 | 6.71 |\n| x2 | 5.15 | 3.82\
  \ | **2.00** |\n| x3 | 7.38 | 4.59 | **1.00** |\n| x4 | 6.96 | **0.75** | 5.66 |\n\
  | x5 | 6.67 | 5.84 | **1.00** |\n| x6 | 6.52 | **2.14** | 7.21 |\n| x7 | **0.71**\
  \ | 6.05 | 7.28 |\n| x8 | 7.91 | **1.75** | 6.40 |\n\n新的中心是：\n\n![C\\_1^{2} = \\\
  begin{bmatrix} 7.5 \\\\\\\\ 1.5 \\end{bmatrix}](img/leanpub_equation_54.png)C\\\
  _2^{2} = \\begin{bmatrix} 5.67 \\\\\\\\ 8.33 \\end{bmatrix}](images/leanpub_equation_55.png)C\\\
  _3^{2} = \\begin{bmatrix} 1.67 \\\\\\\\ 4 \\end{bmatrix}](images/leanpub_equation_55.png)\n\
  \n由于中心发生了变化，算法在下一次迭代中继续。\n\n***第三次迭代：***\n\n我们再次计算更新后的距离。\n\n| || ![C\\_1^{2}](img/leanpub_equation_56.png)\
  \ || ![C\\_2^{2}](img/leanpub_equation_57.png) || ![C\\_3^{3}](img/leanpub_equation_58.png)\
  \ |\n| --- | --- | --- | --- |\n| x1 | **0.71** | 7.45 | 6.12 |\n| x2 | 5.15 | 5.09\
  \ | **1.33** |\n| x3 | 7.38 | 5.73 | **1.20** |\n| x4 | 6.96 | **0.75** | 5.21 |\n\
  | x5 | 6.67 | 7.09 | **1.20** |\n| x6 | 6.52 | **1.37** | 6.67 |\n| x7 | **0.71**\
  \ | 6.75 | 6.64 |\n| x8 | 7.91 | **0.94** | 6.01 |\n\n新的中心是：\n\n![C\\_1^{3} = \\\
  begin{bmatrix} 7.5 \\\\\\\\ 1.5 \\end{bmatrix}](img/leanpub_equation_59.png)C\\\
  _2^{3} = \\begin{bmatrix} 5.67 \\\\\\\\ 8.33 \\end{bmatrix}](images/leanpub_equation_60.png)C\\\
  _3^{3} = \\begin{bmatrix} 1.67 \\\\\\\\ 4 \\end{bmatrix}](images/leanpub_equation_60.png)\n\
  \n我们可以看到，中心没有发生变化，因此算法在第三次迭代后收敛。\n\n我们可以简单地使用 R 中的以下命令执行上述手动过程：\n\n```\n# 执行 k-Means\
  \ 聚类\nmodel = kmeans(kdata, centers = kdata[1:3,])\n\n# 获取最终中心\nmodel$centers\n\n\
  # 获取数据点在簇之间的分布情况\nmodel$cluster\n```\n\n### 9.4.3 计算内聚度和离散度\n\n为了回答问题 (c)，我们需要计算上一个小节中执行的聚类的内聚度和离散度。\n\
  \n首先，我们将手动计算这些指标，然后我们将看到如何使用 R 进行计算。在计算过程中，我们将使用上述簇。\n\n![C\\_1: \\\\ \\\\ m\\_1\
  \ = \\begin{bmatrix} 7.5 \\\\\\\\ 1.5 \\end{bmatrix} \\\\ \\\\ \\\\ \\\\ C\\_2:\
  \ \\\\ \\\\ m\\_2 = \\begin{bmatrix} 5.67 \\\\\\\\ 8.33 \\end{bmatrix} \\\\ \\\\\
  \ \\\\ \\\\ C\\_3: \\\\ \\\\ m\\_3 = \\begin{bmatrix} 1.67 \\\\\\\\ 4 \\end{bmatrix}](img/leanpub_equation_61.png)\n\
  \n*   ***内聚度计算***\n\n内聚度指标由以下方程给出：\n\n![WSS={\\displaystyle\\sum\\_{i-1}^K\\\\displaystyle\\\
  sum\\_{x \\\\in C\\_i}\\\\text{\\\\textbardbl}x - m\\_{i}\\\\text{\\\\textbardbl}²}](img/leanpub_equation_62.png)\n\
  \n此时，我们将计算每个簇的内聚度：\n\n***第一个簇：***\n\n\n\n\n![WSS(C\\_1)={\\\\displaystyle\\\\sum\\\
  _{x \\in C\\_1}\\\\text{\\\\textbardbl}x - m_{1}\\\\text{\\\\textbardbl}²} = \\\\\
  text{\\\\textbardbl} x\\_1 - m\\_1 \\text{\\\\textbardbl}² + \\\\text{\\\\textbardbl}\
  \ x\\_7 - m\\_1 \\text{\\\\textbardbl}²](img/leanpub_equation_63.png)![\\= \\\\\
  sqrt{ (7 - 7.5)² + (1 - 1.5)² }² + \\sqrt{ (8 - 7.5)² + (2 - 1.5)² }²](img/leanpub_equation_64.png)![\\\
  = 0.25 + 0.25 + 0.25 + 0.25 = 1](img/leanpub_equation_65.png)\n\n## 第二个簇\n\n![WSS(C\\\
  _2)={\\\\displaystyle\\\\sum\\_{x \\in C\\_2}\\\\text{\\\\textbardbl}x - m_{2}\\\
  \\text{\\\\textbardbl}²} = \\\\text{\\\\textbardbl} x\\_4 - m\\_2 \\text{\\\\textbardbl}²\
  \ + \\\\text{\\\\textbardbl} x6 - m\\_2 \\text{\\\\textbardbl}² + \\\\text{\\\\\
  textbardbl} x\\_8 - m\\_2 \\text{\\\\textbardbl}²](img/leanpub_equation_66.png)![\\\
  = \\\\sqrt{ (5 - 5.67)² + (8 - 8.33)² }² + \\sqrt{ (7 - 5.67)² + (8 - 8.33)² }²](img/leanpub_equation_67.png)![\\\
  \\\\ + \\\\sqrt{ (5 - 5.67)² + (9 - 8.33)² }²](img/leanpub_equation_68.png)![\\\
  = 0.4489 + 0.1089 + 1.7689 + 0.1089 + 0.4489 + 0.4489 = 3.3334](img/leanpub_equation_69.png)\n\
  \n## 第三个簇\n\n![WSS(C\\_3)={\\\\displaystyle\\\\sum\\_{x \\in C\\_3}\\\\text{\\\\\
  textbardbl}x - m_{3}\\\\text{\\\\textbardbl}²} = \\\\text{\\\\textbardbl} x\\_2\
  \ - m\\_2 \\text{\\\\textbardbl}² + \\\\text{\\\\textbardbl} x3 - m\\_2 \\text{\\\
  \\textbardbl}² + \\\\text{\\\\textbardbl} x\\_5 - m\\_2 \\text{\\\\textbardbl}²](img/leanpub_equation_70.png)![\\\
  = \\\\sqrt{ (3 - 1.67)² + (4 - 4)² }² + \\sqrt{ (1 - 1.67)² + (5 - 4)² }²](img/leanpub_equation_71.png)![\\\
  \\\\ + \\\\sqrt{ (1 - 1.67)² + (3 - 4)² }²](img/leanpub_equation_72.png)![\\= 1.7689\
  \ + 0 + 0.4489 + 1 + 0.4489 + 1 = 4.6667](img/leanpub_equation_73.png)\n\n总内聚性通过以下方程给出：\n\
  \n![WSS_{Total} = {\\\\displaystyle\\\\sum\\_{i}WSS(C\\_i)} = WSS(C\\_1) + WSS(C\\\
  _2) + WSS(C\\_3)](img/leanpub_equation_74.png)\n\n### 离散度\n\n簇间平方和（BSS）指标通过以下方程给出：\n\
  \n![BSS_{Total}={\\\\displaystyle\\\\sum\\_{i-1}^K\\\\textbar}C\\_i\\\\textbar}\\\
  \\cdot\\\\textbardbl}x - m_{i}\\\\text{\\\\bardbl}²](img/leanpub_equation_76.png)\n\
  \n我们的第一步是计算数据集的中心，它由所有点的平均值给出。\n\n![m = \\\\dfrac{x\\_1 + x\\_2 + x\\_3 + x\\_4\
  \ + x\\_5 + x\\_6 + x\\_7 + x\\_8}{8} = \\\\begin{bmatrix} 4.625 \\\\ 5 \\\\end{bmatrix](img/leanpub_equation_77.png)![BSS_{Total\
  \ } = 2 \\\\cdot \\\\sqrt{ (4.625 - 7.5)² + (5 - 1.5)² }²](img/leanpub_equation_78.png)![\\\
  \\ + \\\\ 3 \\\\cdot \\\\sqrt{ (4.625 - 5.67)² + (5 - 8.33)² }²](img/leanpub_equation_79.png)![\\\
  \\ + \\\\ 3 \\\\cdot \\\\sqrt{ (4.625 - 1.67)² + (5 - 4)² }²](img/leanpub_equation_80.png)!![=\
  \ 41.031 + 36.589 + 29.255 = 106.875](img/leanpub_equation_81.png)\n\n\n\n\n\n|\
  \ Conference_1 | 高 | SE |\n| --- | --- | --- |\n| Conference_2 | 低 | SE |\n| Conference_3\
  \ | 高 | ML |\n| Conference_4 | 低 | DM |\n| Conference_5 | 低 | ML |\n| Conference_6\
  \ | 高 | SE |\n\n上述数据集展示了 6 个不同会议的排名和主题。SE 代表软件工程（Software Engineering），ML 代表机器学习（Machine\
  \ Learning），DM 代表数据挖掘（Data Mining）。\n\n首先，我们将使用以下命令构建一个包含上述数据集的数据框：\n\n```\n# 存储\
  \ Rank 数据的向量\nRank = c(\"High\", \"Low\", \"High\", \"Low\", \"Low\", \"High\")\n\
  \n# 存储 Topic 数据的向量\nTopic = c(\"SE\", \"SE\", \"ML\", \"DM\", \"ML\", \"SE\")\n\n\
  # 数据框\nconferences = data.frame(Rank, Topic)\n```\n\n我们可以使用以下命令应用 k-Medoids 算法：\n\
  \n```\n# 导入库\nlibrary(cluster)\n\n# 创建 k-Medoids 模型\nmodel = pam(conferences, 3)\n\
  ```\n\n我们可以使用以下命令显示质类中心（medoids）以及数据实例到聚类的分布：\n\n```\n# 获取质类中心\nmodel$medoids\n\n\
  # 获取样本到聚类的分布\nmodel$clustering\n```\n\n我们还可以使用以下命令通过名称显示质类中心：\n\n```\nconferences[model$id.med,]\n\
  ```\n\n最后，我们可以使用以下命令绘制数据图：\n\n```\n# 获取不同的排名\nL1 = levels(conferences$Rank)\n\n\
  # 获取不同的主题\nL2 = levels(conferences$Topic)\n\n# 绘制数据\nplot(model$data, xaxt = \"\
  n\", yaxt = \"n\", pch = 15, col = model$cluster)\n\n# 插入轴标签\naxis(1, at = 1:length(L1),\
  \ labels = L1)\naxis(2, at = 1:length(L2), labels = L2)\n\n# 显示质类中心\npoints(conferences[model$id.med,],\
  \ col = 1:3, pch = \"o\", cex = 2)\n```\n\n![](img/chapter9----app_medoids.png)\n\
  \n# 第 10 章 - 基于连接性的聚类\n\n基于连接性的聚类（也称为层次聚类）基于一个核心思想，即给定数据集中的每个实例都与所有其他实例相关。上述假设背后的主要思想是，对于“最近”的对象，这种关系的程度比对于较远的对象更强。`nearby`\
  \ 一词意味着这些算法根据距离将`data instances`（数据实例）连接形成`clusters`（聚类）。一个聚类很大程度上可以通过连接聚类部分所需的最大距离来描述。在不同的距离下，会形成不同的聚类，这可以使用树图（dendrogram）来表示，这解释了“层次聚类”这一常用名称的由来：这些算法并不提供数据集的单一划分，而是提供了一个在特定距离下相互合并的广泛聚类层次结构。\n\
  \n## 10.1 R 中的层次聚类\n\n### 10.1.1 数据构建\n\n为了详细概述如何使用 R 进行层次聚类，让我们考虑以下包含五个二维空间实例的简单数集。\n\
  \n| | X | Y |\n| --- | --- | --- |\n| x1 | 2 | 0 |\n| x2 | 8 | 4 |\n| x3 | 0 | 6\
  \ |\n| x4 | 7 | 2 |\n| x5 | 6 | 1 |\n\n首先，我们需要妥妥地构建包含上述数据集的数据框。为了实现这一点，我们可以使用以下命令：\n\
  \n```\n# 构建包含 X 轴数据的向量\nX = c(2, 8, 0, 7, 6)\n\n# 构建包含 Y 轴数据的向量\nY = c(0, 4, 6,\
  \ 2, 1)\n\n# 构建包含与行名对应的数据标签的向量\nrnames = c(\"x1\", \"x2\", \"x3\", \"x4\", \"x5\"\
  )\n\n# 创建数据框\nhdata = data.frame(X, Y, row.names = rnames) \n```\n\n一旦创建了数据框，我们就可以使用以下命令绘制数据：\n\
  \n```\n# 绘制数据\nplot(hdata, pch = 15)\n\n# 添加数据标签\ntext(hdata, labels = row.names(hdata),\
  \ pos = c(4, 2, 4, 4, 4))\n```\n\n我们的数据如图所示：\n\n![](img/chapter10----plot_example_data.png)\n\
  \n### 10.1.2 使用单连接和完全连接进行层次聚类\n\n在本节中，我们将使用上述数据集，通过单连接（Single Linkage）和完全连接（Complete\
  \ Linkage）执行层次聚类。\n\n如所述，层次聚类是一个迭代过程，从给定数据集的单个元素开始，以逐步形成聚类。这些聚类通过合并表现出连接元素形成。这种连接是通过距离度量表示的。一种常用的距离度量是欧几里得距离，它由以下公式给出：\n\
  \n![d=\\sqrt{\\displaystyle\\sum(x_{1} - x_{2})²}}](img/chapter10----plot_example_data.png)\n\
  \n首先，我们将通过单连接进行：第一次迭代：下表显示了矩阵。\n\n| | x1 | x2 | x3 | x4 | x5 |\n| --- | --- | ---\
  \ | --- | --- |\n| x1 | 0 | 7.21 | 6.32 | 5.39 | 4.12 |\n| x2 | 7.21 | 0 | 8.25\
  \ | 2.24 | 3.61 |\n| x3 | 6.32 | 8.25 | 0 | 8.06 | 7.81 |\n| x4 | 5.39 | 2.24 |\
  \ 8.06 | 0 | 1.41 |\n| x5 | 4.12 | 3.61 | 7.81 | 1.41 | 0 |\n\n如表所示，`x4` 和 `x5`\
  \ 距离最近。作为结果，我们将它们合并形成聚类。第二次迭代：由于我们使用单连接，包含 `x4` 和 `x5` 的聚类与其它点的距离是该点与这两个点之间距离的最小值。下表显示了更新后的矩阵。\n\
  \n| | x1 | x2 | x3 | x4 - x5 |\n| --- | --- | --- | --- | |\n| x1 | 0 | 7.21 | 6.32\
  \ | 5.39 |\n| x2 | 7.21 | 0 | 8.25 | 3.61 |\n| x3 | 6.32 | 8.25 | 0 | 8.06 |\n|\
  \ x4 - x5 | 5.39 | 3.61 | 8.06 | 0 |\n\n第三迭代：再次，我们将 `x2` 与包含 `x4` 和 `x5` 的聚类合并。\n\
  \n| | x1 | x2 - x4 - x5 |\n| --- | --- | --- |\n| x1 | 0 | 6.32 |\n| x2 - x4 - x5\
  \ | 6.32 | 0 |\n\n第四次迭代：最后，在第四次迭代中，`x3` 与 `x1 - x2 - x4 - x5` 的聚类合并。\n\n| | x1 -\
  \ x2 - x4 - x5 |\n| --- | --- |\n| x1 - x2 - x4 - x5 | 0 |\n\n此时聚类在第四次迭代中完成。单连接完成。\n\
  \n此时，我们将再次通过相同的迭代过程，但针对完全连接的情况。第一次迭代：第一步与单连接的情况相同，我们计算原始数据集的矩阵并连接距离最近的 `x4` 和 `x5`\
  \ 点。\n\n| | x1 | x2 | x3 | x4 | x5 |\n| --- | --- | --- | --- | --- | --- |\n| x1\
  \ | 0 | 7.21 | 6.32 | 5.39 | 4.12 |\n| x2 | 7.21 | 0 | 8.25 | 2.24 | 3.61 |\n| x3\
  \ | 6.32 | 8.25 | 0 | 8.06 | 7.81 |\n| x4 | 5.39 | 2.24 | 8.06 | 0 | 1.41 |\n| x5\
  \ | 4.12 | 3.61 | 7.81 | 1.41 | 0 |\n\n第二次迭代：与单连接不同，在完全连接中，包含点 `x4` 和 `x5` 的聚类与任何其他点的距离是该点与\
  \ `x4` 和 `x5` 点之间距离的最大值。下表显示了更新后的矩阵。\n\n| | x1 | x2 | x3 | x4 - x5 |\n| --- | ---\
  \ | --- | --- | --- |\n| x1 | 0 | 7.21 | 6.32 | 5.39 |\n| x2 | 7.21 | 0 | 8.25 |\
  \ 3.61 |\n| x3 | 6.32 | 8.25 | 0 | 8.06 |\n| x4 - x5 | 5.39 | 3.61 | 8.06 | 0 |\n\
  \n\n\n\n根据更新后的距离，我们将点 `x2` 与聚类 `(x4 - x5)` 链接。到此为止，结果与单链法（single linkage）的情况相同。\n\
  \n### 第 3 次迭代\n\n在下一次迭代中，距离矩阵再次更新，这次我们发现距离最近的点是 `x1` 和 `x3`。结果是它们被链接在一起并形成聚类 `(x1\
  \ - x3)`。\n\n| | x1 | x2 - x4 - x5 | x3 |\n| --- | --- | --- | --- |\n| `x1` | 0\
  \ | 7.21 | 6.32 |\n| `x2 - x4 - x5` | 7.21 | 0 | 8.25 |\n| `x3` | 6.32 | 8.25 |\
  \ 0 |\n\n### 第 4 次迭代\n\n最后，聚类在第 4 次迭代中完成，聚类 `(x1 - x3)` 和 `(x2 - x4 - x5)` 被链接在一起。\n\
  \n| | x1 - x3 | x2 - x4 - x5 |\n| --- | --- | --- |\n| `x1 - x2 - x4 - x5` | 0 |\
