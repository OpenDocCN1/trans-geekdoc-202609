    \ not able to suffieciently split the data into clusters. This result originates\
    \ from the fact that k-Means relies on the Euclidean distance and thus cannot\
    \ distingush clusters organized in complex structures.\n\n### 11.5.2 Optimizing\
    \ parameter eps\n\nIn order to optimize the parameter `eps` of the `DBSCAN` algorithm\
    \ (quaestion (c)), we will use `kNN` distance. We can use the following R command\
    \ in order to compute the destance of every data point with its 10 nearest neighbours:\n\
    \n```\nknndist = kNNdist(mdata, k = 10)\n```\n\nThen, we can plot the respective\
    \ graph after sorting the data into ascending order:\n\n```\n# Plot distances\n\
    plot(sort(knndist), type = 'l', xlab = \"Points sorted by distance\",\n      \
    \                        ylab = \"10-NN distance\")\n```\n\n![](images/chapter11----app_kNN_dist.png)\n\
    \nIn order to optimize `eps`, we follow the elbow method. As we can see from the\
    \ graph, the optimized `eps` valus are in the interval [0.35, 0.45].\n\n### 11.5.3\
    \ Modeling using DBSCAN\n\nLastly, we can answer question (d) by applying `DBSCAN`\
    \ on the given dataset using `eps = 0.4` and `minPoints = 10`.\n\n```\n# Construct\
    \ DBSCAN model\nmodel = dbscan(mdata, eps = 0.4, minPts = 10)\n\n# Plot distances\n\
    plot(mdata, col = model$cluster + 1, pch = ifelse(model$cluster, 1, 4))\n```\n\
    \nThe following figure depicts the clustering result. As we can see, `DBSCAN`\
    \ is able to efficiently split the given dataset into clusters.\n\n![](images/chapter11----app_dbscan.png)\n\
    \n# Chapter 12 - Distribution-based Clustering\n\n### 12.1 Theoretical background\n\
    \n`Distribution-based clustering` is closely related to statistics and is based\
    \ on the fact that clusters can easily be defined as objects including data instances\
    \ belonging most likely to the same distribution. While the theoretical foundation\
    \ of the methods that apply to this clustering category is excellent, they suffer\
    \ from one key problem known as `overfitting`, unless cetrain constraints are\
    \ set into the complexity of the model. A more complex model will usually be able\
    \ to explain the data better, which makes choosing the appropriate level of complexity\
    \ inherently difficult. One prominent and widely used method is known as `Gaussian\
    \ Mixture Models` or `GMMS` (using the `Expectation-Maximization algorithm` or\
    \ `EM`).\n\n#### 12.1.1 The Expectation-Maximization algorithm\n\nIn statistics,\
    \ an `Expectation-Maximization (EM)` algorithm is an iterative method to find\
    \ maximum likelihood or maximum a posteriori (MAP) estimates of parameters in\
    \ statistical models, where the model depends on unobserved latent variables.\
    \ In practice `EM` algorithm maximizes the following expression:\n\n![X: dataset,\
    \ \\\\ \\\\ Z: latent \\\\ \\\\ variables, \\\\ \\\\ \\\\\\\\theta: set \\\\ \\\
    \\ of \\\\ \\\\ parameters](images/leanpub_equation_85.png)![\\\\ln{P(X/\\\\theta)}\
    \ = \\\\ln{\\\\displaystyle\\\\sum\\_{Z}P(X, Z/\\\\theta)}](images/leanpub_equation_86.png)\n\
    \nThe `EM` iteration alternates between an expectation step (`E-step`), which\
    \ creates a function for the expectation of the log-likelihood using the current\
    \ estimate for the parameters, and a maximization step (`M-step`), which computes\
    \ parameters the expected log-likelihood found on the `E-step`. These parameter\
    \ estimates are then used to determine the distribution of the latent variables\
    \ in the next `E-step`.\n\n`E-step:`\n\n![Given \\\\ \\\\ \\\\theta_{old}: \\\\\
    \ \\\\ find \\\\ \\\\ P(Z/X, \\\\theta_{old})](images/leanpub_equation_87.png)\n\
    \n`M-step:`\n\n![\\\\theta_{new} = argmax_{\\\\theta}(\\displaystyle\\\\sum\\\
    _{Z}P(Z/X, \\\\theta_{old}))](images/leanpub_equation_88.png)\n\nThe `EM` algorithm\
    \ reaches convergence when the log-likelihood value is no longer updated or the\
    \ updat is smaller than a given threshold.\n\n#### 12.1.2 Gaussian Mixture Models\
    \ - GMMs\n\nA `Gaussian Mixture Model` is a probabilistic model that assumes all\
    \ the data points are generated from a mixture of a finite number of Gaussian\
    \ distributions with unknown parameters. One can think of mixture models as generalizing\
    \ `k-means` to incorporate information about the covariance structure of the data\
    \ as well as the centers of the Gaussians.\n\nGenerally, a mixture of `k` normal\
    \ distributions is given by the following equation:\n\n![P(x) = \\displaystyle\\\
    \\sum\\_{k = 1}^K\\\\pi_{k}N(x/\\\\mu_{k}},\\\\Sigma_{k})](images/leanpub_equation_89.png)![where](images/leanpub_equation_90.png)![\\\
    \\pi_{k}: Mixing \\\\ Coefficients \\\\in [0, 1] \\\\ and \\\\displaystyle\\\\\
