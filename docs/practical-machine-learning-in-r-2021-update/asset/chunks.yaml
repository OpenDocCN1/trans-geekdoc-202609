    ## Chapter 8 - Dimensionality Reduction\n\n### 8.1 Principal Components Analysis\n\
    \n#### 8.1.1 “Raw” Principal Components\n\nFirst we will try to perform Principal\
    \ Components analysis (PCA) without using a ready-made function from library.\n\
    \n##### Step 1: Data\n\nFirst we are to make a dataset and plot it.\n\n```\nd\
    \ <- c(2.5, 2.4, 0.5, 0.7, 2.2, 2.9, 1.9, 2.2, 3.1, 3.0, 2.3, 2.7, 2, 1.6, 1,\
    \ 1.1, 1.5, 1.6, 1.1, 0.9)\ndata <- matrix(d, ncol=2, byrow = T)\nplot(data, xlab=\"\
    x1\", ylab=\"x2\")\n```\n\n![](images/chapter8-pca-step1.png)\n\n##### Step 2:\
    \ Subtract the mean\n\nWe subtract the mean of each attribute (`x1`, `x2`) from\
    \ the respective values (centering the data) using the function `scale`.\n\n```\n\
    data_norm <- scale(data, scale=F)\nplot(data_norm, xlab=\"x1\", ylab=\"x2\")\n\
    ```\n\n![](images/chapter8-pca-step2.png)\n\n##### Step 3: Calculate the covariance\
    \ matrix\n\nWe calculate the covariance matrix using the function `cov`.\n\n```\n\
    S <- cov(data_norm)\nprint(S)\n```\n\n```\n##           [,1]      [,2]\n## [1,]\
    \ 0.6165556 0.6154444\n## [2,] 0.6154444 0.7165556\n```\n\n##### Step 4: Computer\
    \ the eigenvectors of the covariance matrix\n\nUsing the `svd` method (Singular\
    \ Value Decomposition) we derive the eigenvectors of the covariance matrix. First\
    \ we print the decomposition:\n\n```\nudv <- svd(S)\nprint(udv)\n```\n\n```\n\
    ## $d\n## [1] 1.2840277 0.0490834\n## \n## $u\n##            [,1]       [,2]\n\
    ## [1,] -0.6778734 -0.7351787\n## [2,] -0.7351787  0.6778734\n## \n## $v\n## \
    \           [,1]       [,2]\n## [1,] -0.6778734 -0.7351787\n## [2,] -0.7351787\
    \  0.6778734\n```\n\nand then we plot the eigenvectors:\n\n```\n# asp=1 keep the\
    \ aspect ratio to 1 so that the eigenvectors are \n# displayed appropriatelly,\
    \ perpendicular\nplot(data_norm, asp=1, xlab=\"x1\", ylab=\"x2\")\narrows(0,0,udv$u[1,1],udv$u[2,1],\
    \ lwd=1)\narrows(0,0,udv$u[1,2],udv$u[2,2], lwd=0.5)\n```\n\n![](images/chapter8-pca-step4.png)\n\
    \n##### Step 5: Choosing components\n\nWe can use a barplot to display the variance\
    \ accounted for each component.\n\n```\nbarplot(udv$d)\nprint(cumsum(udv$d)/sum(udv$d))\n\
    ```\n\n![](images/chapter8-pca-step5.png)\n\nWe can see that the 1st component\
    \ accounts for more than 95% of the variance.\n\n##### Step 6: Picking the 1st\
    \ component\n\nWe transform the 2D dataset into a 1D dataset using just 1st Principal\
    \ Component (PC).\n\n```\ndata_new <- t(udv$u[,1,drop=FALSE]) %*% t(data_norm)\n\
    data_new\n```\n\n```\n##            [,1]    [,2]       [,3]       [,4]      [,5]\
    \       [,6]\n## [1,] -0.8279702 1.77758 -0.9921975 -0.2742104 -1.675801 -0.9129491\n\
    ##            [,7]     [,8]      [,9]    [,10]\n## [1,] 0.09910944 1.144572 0.4380461\
    \ 1.223821\n```\n\n```\nplot(data_new,data_new,asp=1,xlab=\"x1\", ylab=\"x2\"\
    )\n```\n\n![](images/chapter8-pca-step6.png)\n\n#### 8.1.2 PCA using an R function\n\
    \nIn this subsection, we will use the `prcomp` function that performs PCA in one\
    \ step. We will apply it on the Iris dataset and test the gains or losses in terms\
    \ of accuracy using the kNN algorithm.\n\n```\n# download the file\ndata = iris\n\
    set.seed(1234)\nind <- sample(2, nrow(data), replace=TRUE, prob=c(0.7, 0.3))\n\
    trainData <- data[ind==1,]\nvalidationData <- data[ind==2,]\n\nlibrary(class)\n\
    library(stats)\n\ntrainData <- trainData[complete.cases(trainData),]\nvalidationData\
    \ <- validationData[complete.cases(validationData)]\n\ntrainDataX <- trainData[,-ncol(trainData)]\n\
    logTrainDataX <- log(trainDataX)\ntrain.pca <- prcomp(logTrainDataX, center =\
    \ TRUE, scale. = TRUE)\nsummary(train.pca)\n```\n"
