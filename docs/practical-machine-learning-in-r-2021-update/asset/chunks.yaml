    \ 8 | 2 |\n| x8 | 5 | 9 |\n\nUsing the above dataset, we will answer the following\
    \ questions:\n\n(a) Plot the data in a two dimentions.\n\n(b) Apply k-Means algorithm\
    \ in order to distribute the data points into 3 clusters. Initialize the algorithm\
    \ by using the data points `x1`, `x2` and `x3` as the initial centers.\n\n(c)\
    \ Calculate the cohesion and the separation of the clustering performed in question\
    \ (b)\n\n(d) Plot the clustering results using a different color for the data\
    \ points included in each cluster and also mark the centroids.\n\n### 9.4.1 Data\
    \ Construction\n\nFirst of all, we need to properly construct our data frame containing\
    \ the above dataset. In order to do so, we can use the following commands:\n\n\
    ```\n# Construct vector containing X-axis data\nX = c(7, 3, 1, 5, 1, 7, 8, 5)\n\
    \n# Construct vector containing Y-axis data\nY = c(1, 4, 5, 8, 3, 8, 2, 9)\n\n\
    # Construct vector containing the data labels which correspond to the row names\n\
    rnames = c(\"x1\", \"x2\", \"x3\", \"x4\", \"x5\", \"x6\", \"x7\", \"x8\")\n\n\
    # Create the data frame\nkdata = data.frame(X, Y, row.names = rnames)\n```\n\n\
    Once having created our data frame, we can plot our data using the following commands:\n\
    \n```\n# Plot the data\nplot(kdata, pch = 15)\n\n# Add the data labels\ntext(hdata,\
    \ labels = row.names(hdata), \n                pos = c(4, 2, 4, 4, 4, 4, 4, 4))\n\
    ```\n\nOur data is illustrated in the following figure:\n\n![](images/chapter9----data_plot.png)\n\
    \n### 9.4.2 Clustering using k-Means algorithm\n\nIn order to answer question\
    \ (b), we apply k-Means algorithm setting the data points `x1`, `x2` and `x3`\
    \ as the initial centers:\n\n![C\\_1^{0} = \\begin{bmatrix} 7 \\\\\\\\ 1 \\end{bmatrix}\
    \ \\ \\\\ \\\\ \\\\ C\\_2^{0} = \\begin{bmatrix} 3 \\\\\\\\ 4 \\end{bmatrix} \\\
    \ \\\\ \\\\ \\\\ C\\_3^{0} = \\begin{bmatrix} 1 \\\\\\\\ 5 \\end{bmatrix}](images/leanpub_equation_45.png)\n\
    \n***1st iteration:***\n\nAt first, we will compute the distances between all\
    \ data points contained in the dataset and the initial centers. These distances\
    \ are given in the following distance matrix:\n\n| || ![C\\_1^{0}](images/leanpub_equation_46.png)\
    \ || ![C\\_2^{0}](images/leanpub_equation_47.png) || ![C\\_3^{0}](images/leanpub_equation_48.png)\
    \ |\n| --- | --- | --- | --- |\n| x1 | **0.00** | 5.00 | 7.21 |\n| x2 | 5.00 |\
    \ **0.00** | 2.24 |\n| x3 | 7.21 | 2.24 | **0.00** |\n| x4 | 7.28 | **4.47** |\
    \ 5.00 |\n| x5 | 6.32 | 2.24 | **2.00** |\n| x6 | 7.00 | **5.66** | 6.71 |\n|\
    \ x7 | **1.41** | 5.39 | 7.62 |\n| x8 | 8.25 | **5.39** | 6.66 |\n\nAfter having\
    \ computed the distances, we find minimum distance for each data point to assign\
    \ it into the respective cluster. Once all data point are assigned to cluster,\
    \ we compute the new centers.\n\n![C\\_1^{1} = \\frac{x\\_1 + x\\_7}{2} = \\begin{bmatrix}\
    \ 7.5 \\\\\\\\ 1.5 \\end{bmatrix}](images/leanpub_equation_49.png)C\\_2^{1} =\
    \ \\frac{x\\_2 + x\\_4 + x\\_8}{4} = \\begin{bmatrix} 7 \\\\\\\\ 7.25 \\end{bmatrix}C\\\
    _3^{1} = \\frac{x\\_3 + x\\_5}{2} = \\begin{bmatrix} 1 \\\\\\\\ 4 \\end{bmatrix}](images/leanpub_equation_50.png)\n\
    \n***2nd iteration:***\n\nThe following table contains the distances of data points\
    \ from the updated centers.\n\n| || ![C\\_1^{1}](images/leanpub_equation_51.png)\
    \ || ![C\\_2^{1}](images/leanpub_equation_52.png) || ![C\\_3^{1}](images/leanpub_equation_53.png)\
    \ |\n| --- | --- | --- | --- |\n| x1 | **0.71** | 6.56 | 6.71 |\n| x2 | 5.15 |\
    \ 3.82 | **2.00** |\n| x3 | 7.38 | 4.59 | **1.00** |\n| x4 | 6.96 | **0.75** |\
    \ 5.66 |\n| x5 | 6.67 | 5.84 | **1.00** |\n| x6 | 6.52 | **2.14** | 7.21 |\n|\
    \ x7 | **0.71** | 6.05 | 7.28 |\n| x8 | 7.91 | **1.75** | 6.40 |\n\nThe new centers\
    \ are:\n\n![C\\_1^{2} = \\frac{x\\_1 + x\\_7}{2} = \\begin{bmatrix} 7.5 \\\\\\\
    \\ 1.5 \\end{bmatrix}](images/leanpub_equation_54.png)C\\_2^{2} = \\frac{x\\_4\
    \ + x\\_6 + x\\_8}{3} = \\begin{bmatrix} 5.67 \\\\\\\\ 8.33 \\end{bmatrix}C\\\
    _3^{2} = \\frac{x\\_2 + x\\_3 + x\\_5}{3} = \\begin{bmatrix} 1.67 \\\\\\\\ 4 \\\
    end{bmatrix}](images/leanpub_equation_55.png)\n\nGiven that the centers have changed,\
    \ the execution of the algorithm continues in the next iteration.\n\n***3rd iteration:***\n\
    \nOnce again, we compute the updated distances.\n\n| || ![C\\_1^{2}](images/leanpub_equation_56.png)\
    \ || ![C\\_2^{2}](images/leanpub_equation_57.png) || ![C\\_3^{3}](images/leanpub_equation_58.png)\
    \ |\n| --- | --- | --- | --- |\n| x1 | **0.71** | 7.45 | 6.12 |\n| x2 | 5.15 |\
    \ 5.09 | **1.33** |\n| x3 | 7.38 | 5.73 | **1.20** |\n| x4 | 6.96 | **0.75** |\
    \ 5.21 |\n| x5 | 6.67 | 7.09 | **1.20** |\n| x6 | 6.52 | **1.37** | 6.67 |\n|\
    \ x7 | **0.71** | 6.75 | 6.64 |\n| x8 | 7.91 | **0.94** | 6.01 |\n\nThe new centers\
    \ are:\n\n![C\\_1^{3} = \\frac{x\\_1 + x\\_7}{2} = \\begin{bmatrix} 7.5 \\\\\\\
    \\ 1.5 \\end{bmatrix}](images/leanpub_equation_59.png)C\\_2^{3} = \\frac{x\\_4\
    \ + x\\_6 + x\\_8}{3} = \\begin{bmatrix} 5.67 \\\\\\\\ 8.33 \\end{bmatrix}C\\\
    _3^{3} = \\frac{x\\_2 + x\\_3 + x\\_5}{3} = \\begin{bmatrix} 1.67 \\\\\\\\ 4 \\\
    end{bmatrix}](images/leanpub_equation_60.png)\n\nAs we can see, the centers have\
    \ not changes and thus the algorithm converges after the 3rd iteration.\n\nWe\
    \ can simply perform the aforementioned manual procedure with R using the following\
    \ commands:\n\n```\n# Perform k-Means clustering\nmodel = kmeans(kdata, centers\
    \ = kdata[1:3,])\n\n# Get final centers\nmodel$centers\n\n# Get the distribution\
    \ of data points among clusters\nmodel$cluster\n```\n\n### 9.4.3 Compute Cohesion\
    \ and Separation\n\nIn order to answer the question (c), we have to compute the\
    \ cohesion and sepeartion of the clustering performed in the previous subsection.\n\
    \nAt first, we will compute these metrics manually and then we will see how they\
    \ can be computed using R. In the computation, we will use the above clusters.\n\
    \n![C\\_1: \\\\ \\\\ m\\_1 = \\begin{bmatrix} 7.5 \\\\\\\\ 1.5 \\end{bmatrix}\
    \ \\\\ \\\\ \\\\ \\\\ C\\_2: \\\\ \\\\ m\\_2 = \\begin{bmatrix} 5.67 \\\\\\\\\
    \ 8.33 \\end{bmatrix} \\\\ \\\\ \\\\ \\\\ C\\_3: \\\\ \\\\ m\\_3 = \\begin{bmatrix}\
    \ 1.67 \\\\\\\\ 4 \\end{bmatrix}](images/leanpub_equation_61.png)\n\n*   ***Cohesion\
    \ computation***\n\nThe Cohesion metric is given by the following equation:\n\n\
    ![WSS={\\displaystyle\\sum\\_{i-1}^K\\\\displaystyle\\sum\\_{x \\\\in C\\_i}\\\
    \\text{\\\\textbardbl}x - m\\_{i}\\\\text{\\\\textbardbl}^2}](images/leanpub_equation_62.png)\n\
    \nAt this point, we will compute the cohesion for every cluster:\n\n***1st Cluster:***\n"
