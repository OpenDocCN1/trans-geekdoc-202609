    \n```\n\n```\npaste(\"Accuracy in validation all attributes\", \n      Accuracy(pred,\
    \ validationData$diabetes), sep=\" - \")\n```\n\n```\n## [1] \"Accuracy in validation\
    \ all attributes - 0.764957264957265\"\n```\n\n```\npaste(\"Accuracy in validation\
    \ RFE attributes\", \n      Accuracy(simpler_pred, validationData$diabetes), sep=\"\
    \ - \")\n```\n\n```\n## [1] \"Accuracy in validation RFE attributes - 0.799145299145299\"\
    \n```\n\nUsing a simpler formula with 3 out of 8 attibutes, we were able to get\
    \ better generalization results in the validation dataset.\n\n#### 7.2.2 Forward\
    \ Search\n\nThe standard wrapper methods are forward and backward search. In this\
    \ sub-section we will apply forward search and decision trees as a model in the\
    \ breast cancer Wisconsin dataset (see [Chapter 5](#chap06.xhtml#chapter-5)).\n\
    \n```\n# Downloading the file\nfileURL <- \"http://archive.ics.uci.edu/ml/machine-learning-databases/breast-cance\\\
    \nr-wisconsin/breast-cancer-wisconsin.data\"\ndownload.file(fileURL, destfile=\"\
    breast-cancer-wisconsin.data\", method=\"curl\")\ndata <- read.table('breast-cancer-wisconsin.data',\
    \ na.strings = \"?\", sep=\",\")\ndata <- data[,-1]\nnames(data) <- c(\"ClumpThickness\"\
    , \n                 \"UniformityCellSize\", \n                 \"UniformityCellShape\"\
    , \n                 \"MarginalAdhesion\",\n                 \"SingleEpithelialCellSize\"\
    ,\n                 \"BareNuclei\",\n                 \"BlandChromatin\",\n  \
    \               \"NormalNucleoli\",\n                 \"Mitoses\",\n         \
    \        \"Class\")\ndata$Class <- factor(data$Class, levels=c(2,4), labels=c(\"\
    benign\", \"malignant\"))\nset.seed(1234)\nind <- sample(2, nrow(data), replace=TRUE,\
    \ prob=c(0.7, 0.3))\ntrainData <- data[ind==1,]\nvalidationData <- data[ind==2,]\n\
    # remove cases with missing data\ntrainData <- trainData[complete.cases(trainData),]\n\
    validationData <- validationData[complete.cases(validationData),]\n```\n\nWe will\
    \ use the `forward.search` method of the `FSelector` package and the `rpart` decision\
    \ trees training method of the homonymous package. The `forward.search` method\
    \ needs an evaluation function that evaluates a subset of attributes. In our case\
    \ the `evaluator` function performs 5-fold cross-validation on the training dataset.\n\
    \n```\nlibrary(FSelector)\nlibrary(rpart)\n\nevaluator <- function(subset) {\n\
    \  #k-fold cross validation\n  k <- 5\n  splits <- runif(nrow(trainData))\n  results\
    \ = sapply(1:k, function(i) {\n    test.idx <- (splits >= (i - 1) / k) & (splits\
    \ < i / k)\n    train.idx <- !test.idx\n    test <- trainData[test.idx, , drop=FALSE]\n\
    \    train <- trainData[train.idx, , drop=FALSE]\n    tree <- rpart(as.simple.formula(subset,\
    \ \"Class\"), train)\n    error.rate = sum(test$Class != predict(tree, test, type=\"\
    c\")) / nrow(test)\n    return(1 - error.rate)\n  })\n  print(subset)\n  print(mean(results))\n\
    \  return(mean(results))\n}\n\nsubset <- forward.search(names(trainData)[-10],\
    \ evaluator)\n```"
