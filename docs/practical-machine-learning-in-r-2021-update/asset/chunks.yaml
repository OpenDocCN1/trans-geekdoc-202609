    \ is on Outlook.\n\nWe can also make these computations using R. For `Outlook`,\
    \ we build the following frequency arrays:\n\n```\nabsfreq = table(weather[, c(1,\
    \ 4)])\nfreq = prop.table(absfreq, 1)\nfreqSum = rowSums(prop.table(absfreq))\n\
    ```\n\nWe calculate the Gini index for Sunny and Rainy:\n\n```\nGINI_Sunny = 1\
    \ - freq[\"Sunny\", \"No\"]^2 - freq[\"Sunny\", \"Yes\"]^2\nGINI_Rainy = 1 - freq[\"\
    Rainy\", \"No\"]^2 - freq[\"Rainy\", \"Yes\"]^2\n```\n\nThe total Gini for `Outlook`\
    \ is computed by:\n\n```\nGINI_Outlook = freqSum[\"Sunny\"] * GINI_Sunny + freqSum[\"\
    Rainy\"] * GINI_Rainy\n```\n\n##### 3.2.2.2 Information Gain\n\nWe compute the\
