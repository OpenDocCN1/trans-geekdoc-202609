    \n## Chapter 12 - Distribution-based Clustering\n\n### 12.1 Theoretical background\n\
    \n***Distribution-based clustering*** is closely related to statistics and is\
    \ based on the fact that clusters can easily be defined as objects including data\
    \ instances belonging most likely to the same distribution. While the theoretical\
    \ foundation of the methods that apply to this clustering category is excellent,\
    \ they suffer from one key problem known as *overfitting*, unless cetrain constraints\
    \ are set into the complexity of the model. A more complex model will usually\
    \ be able to explain the data better, which makes choosing the appropriate level\
    \ of complexity inherently difficult. One prominent and widely used method is\
    \ known as ***Gaussian Mixture Models*** or ***GMMS*** (using the ***Expectation-Maximization\
    \ algorithm*** or ***EM***).\n\n#### 12.1.1 The Expectation-Maximization algorithm\n\
    \nIn statistics, an Expectation-Maximization (EM) algorithm is an iterative method\
    \ to find maximum likelihood or maximum a posteriori (MAP) estimates of parameters\
    \ in statistical models, where the model depends on unobserved latent variables.\
    \ In practice EM algorithm maximizes the following expression:\n\n![X: dataset,\
    \ \\\\ \\\\ Z: latent \\\\ \\\\ variables, \\\\ \\\\ \\\\theta: set \\\\ \\\\\
    \ of \\\\ \\\\ parameters](images/leanpub_equation_85.png)![\\\\ln{P(X/\\\\theta)}\
    \ = \\\\ln{\\\\displaystyle\\\\sum\\_{Z}P(X, Z/\\\\theta)}](images/leanpub_equation_86.png)\n\
    \nThe EM iteration alternates between performing an expectation step (E-step),\
    \ which creates a function for the expectation of the log-likelihood evaluated\
    \ using the current estimate for the parameters, and a maximization step (M-step),\
    \ which computes parameters maximizing the expected log-likelihood found on the\
    \ E step. These parameter estimates are then used to determine the distribution\
    \ of the latent variables in the next E-step.\n\n***E-step:***\n\n![Given \\\\\
    \ \\\\ \\\\theta\\_{old}: \\\\ \\\\ \\\\ find \\\\ \\\\ \\\\ P(Z/X, \\\\theta\\\
    _{old})](images/leanpub_equation_87.png)\n\n***M-step:***\n\n![\\\\theta\\_{new}\
    \ = argmax\\_{\\\\theta}(\\\\displaystyle\\\\sum\\_{Z}P(Z/X, \\\\theta\\_{old})\\\
    \\ln{P(X, Z/\\\\theta)})](images/leanpub_equation_88.png)\n\nThe EM algorithm\
    \ reaches convergence when the log-likelihood value is no longer updated or the\
    \ updat is smaller than a given threshold.\n\n#### 12.1.2 Gaussian Mixture Models\
    \ - GMMs\n\nA Gaussian Mixture Model is a probabilistic model that assumes all\
    \ the data points are generated from a mixture of a finite number of Gaussian\
    \ distributions with unknown parameters. One can think of mixture models as generalizing\
    \ k-means clustering to incorporate information about the covariance structure\
    \ of the data as well as the centers of the latent Gaussians.\n\nGenerally, a\
    \ mixture of *k* normal distributions is given by the following equation:\n\n\
    ![P(x) = \\\\displaystyle\\\\sum\\_{k = 1}^K\\\\pi\\_{k}N(x/\\\\mu\\_k,\\\\varSigma\\\
    _{k})](images/leanpub_equation_89.png)![where](images/leanpub_equation_90.png)![\\\
    \\pi\\_{k}: Mixing \\\\ \\\\ Coefficients \\\\in \\[0, 1\\] \\\\ \\\\ and \\\\\
    \ \\\\ \\\\displaystyle\\\\sum\\_{k = 1}^K\\\\pi\\_k = 1](images/leanpub_equation_91.png)![\\\
    \\mu\\_k, \\\\varSigma\\_{k} : Mean \\\\ \\\\ and \\\\ \\\\ Covariance \\\\ \\\
    \\ of \\\\ \\\\ distribution \\\\ \\\\ k](images/leanpub_equation_92.png)![N:\
    \ N(x/\\\\mu, \\\\varSigma) = \\\\dfrac{1}{2\\\\pi^{n/2}\\\\text{\\\\textbar}\\\
    \\varSigma\\\\text{\\\\textbar}^{1/2}}e^{-\\\\frac{1}{2}(x- \\\\mu)^T\\\\varSigma^{-1}(x-\\\
    \\mu)}](images/leanpub_equation_93.png)\n\nGMMs use EM as the optimization algorithm\
    \ that enables calculating the latent variables of the distributions that describe\
    \ the goven data. As a result, the EM algorithm in the case of GMMs maximizes\
    \ the following quantity:\n\n![\\\\ln{P(X/\\\\pi, \\\\mu, \\\\varSigma)} = \\\\\
    displaystyle\\\\sum\\_{n = 1}^N\\\\ln(\\\\displaystyle\\\\sum\\_{k = 1}^K\\\\\
    pi\\_{k}N(x\\_n/\\\\mu\\_k,\\\\varSigma\\_{k}))](images/leanpub_equation_94.png)![where\
    \ \\\\ \\\\ \\\\ X = \\\\{ x\\_1, x\\_2, \\\\dots, x\\_n \\\\} \\\\longrightarrow\
    \ Given \\\\ \\\\ \\\\ dataset](images/leanpub_equation_95.png)\n\n### 12.2 Modeling\
    \ Gaussian Mixture Models using EM\n\nIn order to perform clustering using GMMs\
    \ we will use a dataset that contains 1,000 1D data instances that originate from\
    \ two different distributions. Regarding the distributions, we know that their\
    \ standard deviation is 1. A summary of the data is given in the following table:\n\
    \n|   || D1\\_X || D2\\_X |\n\n| --- | --- | --- |\n\n| **Min.** || \\-1.905 ||\
    \ 3.992 |\n\n| --- | --- | --- |\n\n| **1st Qu.** || 0.223 || 6.322 |\n\n| **Median**\
    \ || 0.907 || 6.944 |\n\n| **Mean** || 1.000 || 6.985 |\n\n| **3rd Qu.** || 1.664\
    \ || 7.681 |\n\n| **Max.** || 3.659 || 10.810 |\n\nUsing the above data, we will\
