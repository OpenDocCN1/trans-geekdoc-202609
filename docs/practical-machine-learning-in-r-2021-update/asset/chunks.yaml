    \n混合系数由以下方程给出：\n\n![lambda\\_1 = \\\\dfrac{\\\\sum_{i=1}^{1000} P(D\\_1/x\\_i,\
    \ \\theta\\_1)}{1000}](img/leanpub_equation_118.png)![lambda\\_2 = \\\\dfrac{\\\
    \\sum_{i=1}^{1000} P(D\\_2/x\\_i, \\theta\\_2)}{1000}](img/leanpub_equation_119.png)\n\
    \n在计算出参数 `mu_1`, `mu_2`, `lambda_1`, `lambda_2`(images/leanpub_equation_120.png)\
    \ 的值后，给定数据集的对数似然由以下方程给出:\n\n![ln({P(X/\\theta)}) = \\\\displaystyle\\\\sum_{i\
    \ = 1}^{1000}\\\\ln(\\\\sum_{j = 1}²\\\\lambda_{j} \\\\cdot P(x\\_i/\\\\theta\\\
    _j))](img/leanpub_equation_121.png)![= \\\\displaystyle\\\\sum_{i = 1}^{1000}\\\
    \\ln(\\\\lambda_{1} \\cdot P(x\\_i/\\\\theta\\_1) + \\\\lambda_{2} \\cdot P(x\\\
    _i/\\\\theta\\_2))](img/leanpub_equation_122.png)\n\n一旦计算出数据集的对数似然，将其与上一次迭代的值进行比较。如果该值的没有超过给定的阈值（`epsilon`），则算法收敛。否则，我们返回\
    \ E 步重新计算参数值并继续执行。\n\n### 使用 R 计算正态分布的参数\n\n使用 R 计算正态分布参数的方法涉及两个主要步骤：初始化和循环直到收敛。*\
    \ **第 1 步：初始化均值**\n\n```r\n# 初始化均值\nmu = c(0, 1)\n\n# 初始化混合系数\nlambda = c(0.5,\
    \ 0.5)\n\n# 设置停止准则\nepsilon = 1e-8\n```\n\n* **第 2 步：循环直到收敛**\n\n允许我们计算正态分布参数的\
    \ R 方法如下：\n\n```r\nrepeat {\n  # 期望步\n  # 找到分布\n  T1 <- dnorm(x, mean = mu[1],\
    \ sd = 1) * lambda[1]\n  T2 <- dnorm(x, mean = mu[2], sd = 1) * lambda[2]\n  \n\
    \  # 极大化步\n  # 计算对数似然\n  new_likelihood = sum(log(T1 + T2))\n  \n  # 打印当前参数和似然\n\
    \  cat(\"mu =\", mu, \" lambda =\", lambda, \" loglikelihood =\", new_likelihood,\
    \ \"\\n\")\n  \n  # 如果似然收敛则停止\n  if (new_likelihood - log_likelihood <= epsilon)\
    \ break\n  log_likelihood = new_likelihood\n}\n```\n\n#### 使用 mixtools 构建 GMM\
    \ 模型\n\n为了回答 (c)，我们将使用 mixtools 库：\n\n```r\nlibrary(mixtools)\n\n# 应用 EM 使用初始化\n\
    model <- normalEM(x, mu = c(0,1))\n```r\n\n# 获取分布的均值\nmodel$mu\n\n# 获取混合系数\nmodel$lambda\n\
    \n# 获取最终似然\nmodel$loglik\n```\n\n我们可以在同一图中绘制原始密度和估计密度函数：\n\n```r\n# 绘制估计密度函数\n\
    plot(model, which = 2)\n\n# 绘制原始密度函数\nlines(density(x), lty = 2, lwd = 2)\n```\n\
    \n"
- fmt: "\n(b) Construct a GMMs model inorder to cluster the provided dataset into\
    \ 3 clusters. Set epsilon value to 0.1.\n\n(c) Show how the EM algorithm converges\
    \ and plot the data using the estimated probability density function\n\n(d) Assign\
    \ each data point to the cluster with the highest probability and plot the formulated\
    \ clusters along with their centroids.\n\n(e) Calculate and plot silhouette coefficient\n\
    \n(f) Show the heatmap of the data after sorting them based on the above clustering\
    \ results\n\n### 12.3.1 Dataset construction\n\nAt first, we will read the given\
    \ dataset using the following commands:\n\n```\n# Read data\ngsdata = read.csv(\"\
    gsdata.txt\")\n\n# The third column contains the cluster for each data point\n\
    target = gsdata[, 3]\n\n# The first two columns contain the data coordinates\n\
    gsdata = gsdata[, 1:2]\n```\n\nWe can plot tha data using the following command:\n\
    \n```\nplot(gsdata, col = target)\n```\n\nThe output is the following figure,\
    \ where tha data points for each cluster are illustrated with different colors\
    \ (red, black, green):\n\n![](images/chapter12----app_data_overview.png)\n\n###\
    \ 12.3.2 GMMs model construction\n\nIn order to construct the GMMs model, we will\
    \ use the following commands:\n\n```\n# Import library mixtools\nlibrary(mixtools)\n\
    \n# Construct model\nmodel = mvnormalmixEM(gsdata, k = 3 , epsilon = 0.1)\n```\n\
    \nOnce we have constructed the model, we can use the following command to demonstrate\
    \ how the algorithm converges:\n\n```\nplot(model, which = 1)\n```\n\nThe convergence\
    \ can be shown in the following figure:\n\n![](images/chapter12----app_convergence.png)\n\
    \nAs shown in the graph, it is worth noticing that the EM algorith converges very\
    \ fast. Since the 2nd iteration, the log-likelihood is almost the same.\n\nFinally,\
    \ we can plot the given dataset along with the probability density function for\
    \ each cluster using the following command:\n\n```\nplot(model, which = 2)\n```\n\
    \nThe output is given in the following figure:\n\n![](images/chapter12----app_clusters_and_centers.png)\n\
    \nUsing the `model$posterior` command, we can see the probability for each data\
    \ point to originate from each one of the three clusters (soft-assigments). However,\
    \ in order to answer this question, we have made `hard-assigments` using the following\
    \ commands:\n\n```\n# Assign each point to the cluster with the highest probability\n\
    clusters = max.col(model$posterior)\n\n# Calculate centers \ncenters = matrix(unlist(model$mu),\
    \ byrow = TRUE, ncol = 2)\n```\n\nUsing the above hard-assigments, we can compute\
    \ the silhouette coeffiecient and construct the heatmap.\n\n### 12.3.3 Silhouette\
    \ computation\n\nIn order to calculate and plot silhouette, we can use the following\
    \ commands:\n\n```\n# Calculate silhouette\nmodel_silhouette = silhouette(clusters,\
    \ dist(gsdata))\n\n# Plot silhouette\nplot(model_silhouette)\n```\n\n![](images/chapter12----app_silhouette.png)\n\
    \n### 12.3.4 Heatmap constuction\n\nIn order to construct the heatmap, we can\
    \ use the following R commands:\n\n```\n# Order data based on cluster value\n\
    gsdata_ord = gsdata[order(clusters),]\n\n# Construct heatmap\nheatmap(as.matrix(gsdata_ord),\
    \ Rowv = NA, Colv = NA, col = heat.colors(256), rev = TRUE)\n```\n\n![](images/chapter12----app_heatmap.png)\n\
    \n### 12.4 GMMs Application with Information Criteria\n\nIn this section, we will\
    \ perform clustering using GMMs based on information criteria to select the optimal\
    \ number of clusters. Towards this direction, we will use a dataset containing\
    \ 300 data points. A summary of the given dataset is given in the following table:\n\
    \n| X | |\n| --- | --- |\n| Min. | -2.2239 |\n| 1st Qu. | 0.6396 |\n| Median |\
    \ 5.1139 |\n| Mean | 5.0336 |\n| 3rd Qu. | 9.1177 |\n| Max. | 12.0908 |\n\nWe\
    \ will use the given dataset in order to answer the following:\n\n(a) Plot the\
    \ data along with the probability density function\n(b) Perform clustering using\
    \ EM algorithm setting the number of clusters to 2, 3, 4 and 5. For each case,\
    \ plot the probability density function and calculate the information criteria\
    \ AIC and BIC.\n(c) Plot the AIC and BIC values for the different number of clusters\
    \ and select the optimal number of clusters\n\n#### 12.4.1 Data Construction\n\
    \nAt first, we will read the given dataset using the following commands:\n\n```\n\
    # Import mixtools library\nlibrary(mixtools)\n\n# Read data\nicdata = read.csv(\"\
    icdata.txt\")\n\n# The first column contains the value of each data point\nx =\
    \ icdata[, 1]\n\n# The second column contains the cluster for each data point\n\
    y = icdata[, 2]\n```\n\nAfter that, we can plot the dataset with the probability\
    \ density function using the following command:\n\n```\n# Plot data\nplot(data.frame(x,\
    \ y), ylim = c(-0.01, 0.1))\n\n# Plot probability density function\nlines(density(x))\n\
    ```\n\n![](images/chapter12----app_info_density.png)\n\n#### 12.4.2 Usage of Information\
    \ Criteria for selecting the optimal number of clusters\n\nIn order to answer\
    \ question (b), we need to compute the Akaike Information Criterion (AIC) and\
    \ the Bayesian Information Criterion (BIC). For a given model that has `t` parameters,\
    \ applied in `N` data samples and has log-likelihood `L`, the aforementioned criteria\
    \ are given by the following equations:\n\n![AIC = 2 \\cdot t - 2 \\cdot \\ln(L)](images/leanpub_equation_123.png)\n\
    ![BIC = t \\cdot \\ln(N) - 2 \\cdot \\ln(L)](images/leanpub_equation_124.png)\n\
    \nWe can cluster the data using 2, 3, 4 and 5 distributions using the following\
    \ code:\n\n```\n# Vector for holding AIC values\nAIC = c()\n\n# Vector for holding\
    \ BIC values\nBIC = c()\n\n# Set a 2x2 plot grid\npar(mfrow = c(2, 2))\n\n# Iterate\
    \ over the number of clusters\nfor (k in 2:5) {\n  # Construct model\n  model\
    \ <- normalmixEM(x, k = k, epsilon = 0.0001)\n  \n  # Plot clustering results\n\
    \  plot(model, which = 2 , main2 = paste(\"Density (k = \", k, \")\", sep = \"\
    \"))\n  \n  # Calculate number of parameters\n  numparams = length(model$mu) +\
    \ length(model$stdev) + length(model$lambda)\n  \n  # Store AIC and BIC values\n\
    \  AIC[k] = 2 * numparams - 2 * model$loglik\n  BIC[k] = log(length(x)) * numparams\
    \ - 2 * model$loglik\n}\n```\n\nThe following figure depicts the clustering results:\n\
    \n![](images/chapter12----app_info_clusters.png)\n\nFinally, we can plot AIC and\
    \ BIC values using the following commands:\n\n```\n# Plot AIC values\nplot(AIC[2:5],\
    \ type = 'l', xaxt = \"n\", main = \"AIC\", ylab = \"AIC\")\naxis(1, at = 1:4,\
    \ labels = 2:5)\n\n# Plot BIC values\nplot(BIC[2:5], type = 'l', xaxt = \"n\"\
    , main = \"BIC\", ylab = \"BIC\")\naxis(1, at = 1:4, labels = 2:5)\n```\n\nThe\
    \ AIC and the BIC values in relation to the number of clusters are shown in the\
    \ following figure:\n\n![](images/chapter12----app_info_AIC_BIC.png)\n\n# Part\
    \ V - Extended Topics\n\n## Chapter 13 - Association Rules\n\nThe association\
    \ rules extraction algorithm is included in the `arules` library. The supermarkt\
    \ transaction data to be used for executing market basket analysis can be found\
    \ in the Grocery Shopping datasets page of ACM RecSys. More specifically we will\
    \ use the Belgium retail market dataset.\n\nFirst let’s load the data, read it\
    \ with the `read.transactions` function and inspect the first 10 of them:\n\n\
    ```\nlibrary(arules)\n# Read the data in basket format\ntrans = read.transactions(\"\
    retail.dat\", format = \"basket\", sep=\" \");\ninspect(trans[1:10])\n```\n"
