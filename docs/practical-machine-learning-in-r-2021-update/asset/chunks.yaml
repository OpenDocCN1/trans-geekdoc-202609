    \ - (4/6) \\cdot log2(4/6) - (2/6) \\cdot log2(2/6) = 0.918](images/leanpub_equation_13.png)![Entropy(Rainy)\
    \ = - (1/8) \\cdot log2(1/8) - (7/8) \\cdot log2(7/8) = 0.544](images/leanpub_equation_14.png)![GAIN\\\
    _{Outlook} = 0.940 - (6/14) \\cdot 0.918 - (8/14) \\cdot 0.544 = 0.236](images/leanpub_equation_15.png)\n\
    \nSimilarly, the Information Gain for Temperature and Humidity is ![GAIN\\_{Temperature}\
    \ = 0.152](images/leanpub_equation_16.png)and ![GAIN\\_{Humidity} = 0.102](images/leanpub_equation_17.png),\
    \ respectively. Hence, answering to question (a), the optimal first split using\
    \ the Information Gain is on Outlook.\n\nWe can also make these computations using\
    \ R. Initially, we compute the total entropy of the dataset:\n\n```\nfreq = prop.table(table(weather[,\
    \ c(4)]))\nEntropy_All = - freq[\"No\"] * log2(freq[\"No\"]) - freq[\"Yes\"] *\
    \ log2(freq[\"Yes\"])\n```\n\nThen, for Outlook, we build the following frequency\
    \ arrays:\n\n```\nabsfreq = table(weather[, c(1, 4)])\nfreq = prop.table(absfreq,\
    \ 1)\nfreqSum = rowSums(prop.table(absfreq)) \n```\n\nWe calculate the entropy\
    \ for Sunny and Rainy:\n\n```\nEntropy_Sunny = \n    - freq[\"Sunny\", \"No\"\
    ] * log2(freq[\"Sunny\", \"No\"]) \n    - freq[\"Sunny\", \"Yes\"] * log2(freq[\"\
    Sunny\", \"Yes\"])\nEntropy_Rainy = \n    - freq[\"Rainy\", \"No\"] * log2(freq[\"\
    Rainy\", \"No\"]) \n    - freq[\"Rainy\", \"Yes\"] * log2(freq[\"Rainy\", \"Yes\"\
    ])\n```\n\nThe total information gain for Outlook is computed by:\n\n```\nGAIN_Outlook\
    \ =\n    Entropy_All\n    - freqSum[\"Sunny\"] * Entropy_Sunny\n    - freqSum[\"\
    Rainy\"] * Entropy_Rainy\n```\n\n### 3.2.3 Building the Decision Tree\n\nFor (c),\
    \ we build a decision tree using `rpart`:\n\n```\nmodel <- rpart(\n    Play ~\
    \ Outlook + Humidity, \n    method = \"class\",\n    data = weather, \n    minsplit\
    \ = 1,\n    cp = -1)\n```\n\nFurthermore, we can plot the tree with the following\
    \ command:\n\n```\nrpart.plot(model, extra = 10, nn = TRUE)\n```\n\nThe tree is\
    \ shown in the following figure:![](images/chapter3----decision_tree.png)\n\n\
    ### 3.3 Application with Pruning and Evaluation Metrics\n\nA decision tree classifier\
    \ can also be applied on datasets with continuous variables, such as the `iris`\
    \ dataset. From the `iris` dataset, we shall only keep the first columns and drop\
    \ the last 50 instances, so we now have a binary classification problem with two\
    \ predictor features and one target class. We can perform these transformations\
    \ in R as follows:\n\n```\niris2 = iris[, c(1, 2)]\niris2$Species = factor(iris$Species[1:100],\
    \ levels=levels[1:2])\n```\n\nAfter that, we split the dataset into training and\
    \ testing data:\n\n```\ntrainingdata = iris2[c(1:40, 51:90, 101:140),]\ntestdata\
    \ = iris2[c(41:50, 91:100, 141:150),]\n```\n\nWe will answer the following questions:\n\
    \na) Build a decision tree using the training data (the `minsplit` parameter of\
    \ `rpart` should be set to 20, which is the default).\n\nb) Apply the model on\
    \ `testdata` and compute the precision, the recall, and the f-measure for the\
    \ two classes.\n\nc) Build two decision trees, one for `minsplit` equal to 10\
    \ and one for `minsplit` equal to 30, apply them on `testdata` and compute the\
    \ precision, the recall, and the f-measure for the two classes.\n\nd) Compare\
    \ the three models given their f-measure for class `versicolor`.\n\n#### 3.3.1\
    \ Decision Tree Training and Testing\n\nWe train the decision tree and plot it\
    \ using the following commands (a, c):\n\n```\nmodel <- rpart(\n    Species ~\
    \ ., \n    method = \"class\",\n    data = trainingdata,\n    minsplit = 20)\n\
    rpart.plot(model, extra = 10, nn = TRUE)\n```\n\nThe `.` in the formula stands\
    \ for all the remaining variables in the data frame `trainingdata`. We can also\
    \ execute our model on the test set using the commands:\n\n```\nxtest = testdata[,1:2]\n\
    ytest = testdata[,3]\npred = predict(model, xtest, type=\"class\")\n```\n\n####\
    \ 3.3.2 Evaluation Metrics\n\nWe can produce the confusion matrix and compute\
    \ useful metrics with the following commands (b, c):\n\n```\nlibrary(MLmetrics)\n\
    cm = ConfusionMatrix(pred, ytest)\naccuracy = Accuracy(pred, ytest)\nprecision\
    \ = Precision(ytest, pred, 'versicolor')\nrecall = Recall(ytest, pred, 'versicolor')\n\
    f1 = F1_Score(ytest, pred, 'versicolor')\ndata.frame(precision, recall, f1)\n\
    ```\n\n(alternatively we can compute `TP`, `FP`, `TN`, and `FN` and find precision\
    \ as `TP/(TP + FP)` and recall as `TP/(TP + FN)`)\n\nFinally, the F-measure for\
    \ the 3 models is shown in the following array (d):\n\n| Decision Tree | F-Measure\
    \ |\n| --- | --- |\n| minsplit = 10 | 0.833 |\n| minsplit = 20 | 0.947 |\n| minsplit\
    \ = 30 | 0.857 |\n\n### 3.4 Exercise\n\nYou are given the training data of the\
    \ following array for a binary classification problem.\n\n| CustomerID | Sex |\
    \ CarType | Budget | Insurance |\n| --- | --- | --- | --- | --- |\n| 1 | M | Family\
    \ | Low | No |\n| 2 | M | Sport | Medium | No |\n| 3 | M | Sport | Medium | No\
    \ |\n| 4 | M | Sport | High | No |\n| 5 | M | Sport | VeryHigh | No |\n| 6 | M\
    \ | Sport | VeryHigh | No |\n| 7 | F | Sport | Low | No |\n| 8 | F | Sport | Low\
    \ | No |\n| 9 | F | Sport | Medium | No |\n| 10 | F | Sedan | High | No |\n| 11\
    \ | M | Family | High | No |\n| 12 | M | Family | VeryHigh | No |\n| 13 | M |\
    \ Family | Medium | No |\n| 14 | M | Sedan | VeryHigh | No |\n| 15 | F | Sedan\
    \ | Low | No |\n| 16 | F | Sedan | Low | No |\n| 17 | F | Sedan | Medium | No\
    \ |\n| 18 | F | Sedan | Medium | No |\n| 19 | F | Sedan | Medium | No |\n| 20\
    \ | F | Sedan | High | No |\n\nCalculate the Gini index for:\n\na) all the instances\n\
    \nb) CustomerID\n\nc) Sex\n\nd) CarType using multiway split\n\ne) Budget using\
    \ multiway split\n\nWhich of these should be used for the first split? Hint-question:\
    \ Explain why CustomerID should not be used as a feature even though it has the\
    \ lowest Gini index.\n"
