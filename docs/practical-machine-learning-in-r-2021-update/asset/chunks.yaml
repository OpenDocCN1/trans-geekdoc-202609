    \n## Chapter 4 - Classification with Naive Bayes\n\n### 4.1 Introduction\n\n####\
    \ 4.1.1 Introduction to Naive Bayes\n\nNaive Bayes is a machine learning algorithm\
    \ that is based on the Bayes theorem as well as the assumption of independence\
    \ between the features of the dataset. Given a dataset with a set of features\
    \ ![x\\_1, x\\_2, \\\\dots, x\\_n](images/leanpub_equation_18.png)and a class\
    \ feature ![c](images/leanpub_equation_19.png), the Bayes theorem defines the\
    \ probability that an instance ![\\\\{x\\_1, x\\_2, \\\\dots, x\\_n\\\\}](images/leanpub_equation_20.png)belongs\
    \ to ![c](images/leanpub_equation_21.png)as the combination of the probabilities\
    \ ![P(x\\_1|c), P(x\\_2|c), \\\\dots, P(x\\_n|c)](images/leanpub_equation_22.png):\n\
    \n![P(c|x) = \\\\frac{ P(x\\_1|c) \\\\cdot P(x\\_2|c) \\\\cdot \\\\dots \\\\cdot\
    \ P(x\\_n|c) \\\\cdot P(c) }{ P(x\\_1) \\\\cdot P(x\\_2) \\\\cdot \\\\dots \\\\\
    cdot P(x\\_n) }](images/leanpub_equation_23.png)\n\nwhere we notice that the probability\
    \ of the set of features is given by their product, as their values are independent\
    \ from one another.\n\n#### 4.1.2 Naive Bayes in R\n\nWe may use the e1071 library\
    \ to build the probabilistic Naive Bayes model in R:\n\n```\nlibrary(e1071)\n\
    ```"
