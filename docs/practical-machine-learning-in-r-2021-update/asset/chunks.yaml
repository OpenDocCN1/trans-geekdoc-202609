  trans: "\n\n### 5.2 k-最近邻模型的构建与分类\n\n我们将使用下表的数据来解决二分类问题：\n\n| X1 | X2 | Y |\n| ---\
    \ | --- | --- |\n| 0.7 | 0.7 | A |\n| 0.7 | 0.8 | A |\n| 0.6 | 0.6 | A |\n| 0.5\
    \ | 0.5 | A |\n| 0.5 | 0.6 | A |\n| 0.5 | 0.7 | A |\n| 0.5 | 0.8 | A |\n| 0.7\
    \ | 0.5 | B |\n| 0.8 | 0.7 | B |\n| 0.8 | 0.5 | B |\n| 0.8 | 0.6 | B |\n| 1.0\
    \ | 0.3 | B |\n| 1.0 | 0.5 | B |\n| 1.0 | 0.6 | B |\n\n我们将回答以下问题：\n\na) 使用不同的颜色/符号为每个类绘制数据图。\n\
    \nb) 使用 `k = 1` 的 kNN，你将把值为 `(X1, X2) = (0.7, 0.4)` 的新实例归为哪一类？\n\nc) 使用 `k = 5`\
    \ 重复问题 (b)。\n\nd) 使用 `k = 5` 的 kNN，你将把值为 `(X1, X2) = (0.7, 0.6)` 的新实例归为哪一类？\n\n\
    #### 5.2.1 数据与库导入\n\n首先，我们读取数据并导入所需的库：\n\n```\nknndata = read.csv(\"knndata.txt\"\
    , stringsAsFactors = TRUE)\nlibrary(class)\n```\n\n#### 5.2.2 算法应用\n\n我们首先对数据集进行划分：\n\
    \n```\nX_train = knndata[,c(\"X1\",\"X2\")]\nY_train = knndata$Y\n```\n\n对于问题\
    \ (a)，我们执行以下命令：\n\n```\nplot(X_train, col = Y_train, pch = c(\"o\",\"+\")[Y_train])\n\
    ```\n\n![](img/chapter5----knndata.png)\n\n当 `k = 1` 时（问题 (b）），我们必须找到距离 `(0.7,\
    \ 0.4)` 最近的实例（使用欧式距离），它是 `(0.7, 0.5)`，它属于类 B。因此，我们执行命令：\n\n```\nknn(X_train, c(0.7,\
    \ 0.4), Y_train, k = 1, prob = TRUE)\n```\n\n新实例被分类为 B，概率为 1。\n\n当 `k = 5` 时（问题\
    \ (c)），我们必须找到距离 `(0.7, 0.4)` 最近的 5 个实例，它们是 `(0.7, 0.5)`、`(0.8, 0.5)`、`(0.6, 0.6)`、`(0.8,\
    \ 0.6)` 和 `(0.7, 0.7)`，分别属于类 B、B、A、B、A。我们注意到其中 3 个（ 5 个中的 3 个）属于类 B。我们可以执行命令：\n\
    \n```\nknn(X_train, c(0.7, 0.4), Y_train, k = 5, prob = TRUE)\n```\n\n新实例被分类为\
    \ B，概率为 0.6。\n\n对于问题 (d)，我们想要找到距离 `(0.7, 0.6)` 最近的 5 个实例。我们观察到实例 `(0.7, 0.5)`、`(0.6,\
    \ 0.6)`、`(0.8, 0.6)`、`(0.7, 0.7)`（分别属于类 B、A、B、A）距离 `(0.7, 0.6)` 的距离相同。此外，实例 `(0.8,\
    \ 0.7)` 和 `(0.8, 0.5)`（属于类 B）距离 `(0.7, 0.6)` 的距离相同（由于 kNN 的 `use.all` 参数为 `TRUE`），算法将使用所有这些实例。我们注意到其中\
    \ 4 个（ 6 个中的 4 个）属于类 B。我们可以执行命令：\n\n```\nknn(X_train, c(0.7, 0.6), Y_train, k\
    \ = 5, prob = TRUE)\n```\n\n新实例被分类为 B，概率为 0.66。\n\n### 5.3 k-最近邻真实实例\n\n在本节中，将在乳腺癌数据集上应用\
    \ k-NN。\n\n#### 5.3.1 数据处理\n\n首先，我们将数据集加载为数据框。假设当前工作目录是数据集所在的目录。我们添加 `sep` ，因为默认分隔符是空字符串。此外，从数据可以观察到缺失值用\
    \ `?` 表示。查看 `read.table` 函数的文档使用 `read.table`。接下来，我们将数据集划分为训练集和验证集。步骤如下：\n\n```\n\
    rm(list=ls())\n# 下载数据集\nfileURL <- \"http://archive.ics.uci.edu/ml/machine-learning/breast-cancer-wisconsin.data\"\
    \ndownload.file(fileURL, destfile=\"breast-cancer.data\", method=\"curl\")\n#\
    \ 读取数据\ndata <- read.table(\"breast-cancer.data\", na.strings = \"?\", sep=\"\
    ,\",AsFactors = TRUE)\n# 删除 id 列\ndata <- data[,-1]\n# 为列命名（属性）\nnames(data) <-\
    \ c(\"ClumpThickness\",\"UniformityCellSize\",\"UniformityShape\",\"MarginalAdhesion\"\
    ,\"EpithelialSize\",\"BareNuclei\",\"Chromatin\",\"NormalNuclei\",\"Mitoses\"\
    ,\"Class\")\n# 将类转为因子\ndata$Class <- factor(data$Class, levels=c(2,4), labels=c(\"\
    benign\", \"malignant\"))\n# 设置种子\nset.seed(123)\n# 划分数据集\nind <- sample(2, nrow(data),\
    \ replace=TRUE, prob=c(0.7,0.3))\ntrainData <- data[ind==1,]\nvalidationData <-\
    \ data[ind==2,]\n```\n\n#### 5.3.2 训练与预测\n\n像之前加载 k-NN 算法。\n\n```\nlibrary(class)\n\
    ```\n\n由于所有属性都在 0 到 10 之间，不需要进行 0 到 1 的标准化，因为没有属性会主导 kNN 的距离计算。kNN 接受不带目标列的训练和测试数据集，放在第\
    \ 3 个参数。我们将进行一些数据处理以符合 `knn` 函数的喜（查看 `knn` 手册）。此外，由于 kNN 不允许缺失值，让我们移除它们。\n\n```\n\
    trainData <- trainData[complete.cases(trainData)]\nvalidationData <- validationData[complete.cases(validationData)]\n\
    trainDataX <- trainData[,-ncol(trainData)]\ntrainDataY <- trainData$Class\nvalidationDataX\
    \ <- validationData[,-ncol(validationData)]\nvalidationDataY <- validationData$Class\n\
    ```\n\n让我们进行预测，因为使用 kNN 不需要训练。训练实例就是模型。\n\n```\nprediction = knn(trainDataX, validationDataX,\
    \ trainDataY, k = 1)\n```\n\n你可以尝试不同的 k 值寻找更好的模型。\n\n#### 5.3.3 评估\n\n对验证集进行预测并打印混淆矩阵：\n\
    \n```\ncat(\"Confusion matrix:\\n\")\nxtab = table(prediction, validationData$Class)\n\
    print(xtab)\ncat(\"\\nEvaluation:\\n\")\naccuracy = sum(prediction == validationData$Class)/length(validationData$Class)\n\
    precision = xtab[1,1]/sum(xtab[,1])\nrecall = xtab[1,1]/sum(xtab[1,])\nf = 2 *\
    \ (precision * recall) / (precision + recall)\ncat(paste(\"Accuracy:\\t\", format(accuracy,\
    \ digits=2), \"\\n\", \"\"))\ncat(paste(\"Precision:\\t\", format(precision, digits=2),\
    \ \"\\n\", \"\"))\ncat(paste(\"Recall:\\t\\t\", format(recall, digits=2), \"\\\
    n\", \"\"))\ncat(paste(\"F-measure:\\t\", format(f, digits=2), \"\\n\", \"\"))\n\
    ```\n\n输出结果：\n\n```\n## Confusion matrix:\n##\n## prediction  benign malignant\n\
    ##   benign        99         4\n##   malignant      6        60\n##\n## Evaluation:\n\
    ## Accuracy:     0.94\n## Precision:    0.94\n## Precision:    0.96\n## F-measure:\
    \    0.95\n```\n\n#### 5.3.4 交叉验证\n\n为了执行交叉验证，我们将使用 `caret` 包。[这里](https://cran.r-project.org/web/packages/caret/vignettes/caret.pdf)你可以找到\
    \ caret 的快速指南。\n\n##### 5.3.4.1 将数据分为两组\n\n`createPartition` 函数对数据进行分层随机划分。与我们之前做的类似（尽管没有分层）。然后我们将使用\
    \ `train` 函数构建 kNN 模型。\n\n```\nlibrary(caret)\nlibrary(mlbench)\ndata(Sonar)\n\
    set.seed(107)\ninTrain <- createDataPartition(y = Sonar$Class, p = .75, list =\
    \ FALSE)\ntraining <- Sonar[ inTrain,]\ntesting <- Sonar[-inTrain,]\nkNNFit <-\
    \ train(Class ~ ., \n                data = training,\n                method\
    \ = \"knn\",\n                preProc = c(\"center\", \"scale\"))\nprint(kNNFit)\n\
    ```\n\n```\n## k-Nearest Neighbors \n##\n## 157 samples\n##  60 predictor\n##\
    \   2 classes: 'M', 'R' \n##\n## Pre-processing: centered (60), scaled (60) \n\
    ## Resampling: Bootstrapped (25 reps) \n## Summary of sample sizes: 157, 157,\
    \ 157, 157, 157, 157, ... \n## Resampling results across tuning parameters:\n\
    ##\n##   k  Accuracy   Kappa    \n##   5  0.7683412  0.5331399\n##   7  0.7559100\
    \  0.5053696\n##   9  0.7378175  0.4715006\n##\n## Accuracy was used to select\
    \ the optimal model using  the largest value.\n## The final value used for the\
    \ model was k = 5.\n```\n\n我们也可以针对训练数据集搜索最佳 k 值。\n\n"
