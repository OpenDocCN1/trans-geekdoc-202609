    ```\n\n### 1.4 数据框 (Data frames)\n\n与矩阵不同，数据框可以在其列中存储不同类型的值。它们在 R 语言中广泛用于数据分析。通常，行代表观测值（或样本），列代表特征（或属性或变量）。当我们从文件中读取数据时，结果会被读取为数据框。下载\
    \ zip 文件 `[r-novice-inflammation.zip](https://github.com/swcarpentry/r-novice-inflammation/blob/main/data/r-novice-inflammation-data.zip)`\
    \ 并在桌面上解压。使用文本编辑器检查 `inflammation-01.csv` 文件以查看我们将加载的内容。然后读取该文件：\n\n```\ndata\
    \ <- read.csv(file = \"data/inflammation-01.csv\", header = FALSE, stringsAsFactors\
    \ = TRUE)\n```\n\n注意路径中包含 `data/` 的使用，因为我们之前通过 `getwd()` 将工作目录设置为了桌面。\n\n```\n\
    dir()\n```\n\n```\n##  [1] \"_site.yml\"                    \"ar.html\"      \
