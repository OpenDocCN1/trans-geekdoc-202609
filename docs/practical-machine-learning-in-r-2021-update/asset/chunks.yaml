    \ `max` or `mean` per row or column respectivelly. Luckily there is the function\
    \ `apply` that applies a function for each one of the “margins”, 1 for rows and\
    \ 2 for columns:\n\n```\nargs(apply) # args return NULL because it prints the\
    \ information, but every funct\\\nion must return something!\n```\n\n```\n## function\
    \ (X, MARGIN, FUN, ...) \n## NULL\n```\n\n```\nmax_patient_inflammation <- apply(data,\
    \ 1, max)\nmax_patient_inflammation\n```"
