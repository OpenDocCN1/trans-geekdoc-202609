    ### 1.10 Factors


    The `factor()` command is used to create and modify factors in R:


    ```r

    sex <- factor(c("male", "female", "female", "male"))

    ```


    R will assign 1 to the level `"female"` and 2 to the level `"male"` (because `f`
    comes before `m`, even though the first element in this vector is `"male"`). You
    can check this by using the function `levels()`, and check the number of levels
    using `nlevels()`:


    ```r

    levels(sex)

    ```


    ```

    ## [1] "female" "male"

    ```


    ```r

    nlevels(sex)

    ```


    ```

    ## [1] 2

    ```


    Sometimes, the order of the factors does not matter, other times you might want
    to specify the order because it is meaningful (e.g., “low”, “medium”, “high”)
    or it is required by particular type of analysis. Additionally, specifying the
    order of the levels allows us to compare levels:


    ```r

    food <- factor(c("low", "high", "medium", "high", "low", "medium", "high"))

    levels(food)

    ```


    ```

    ## [1] "high"   "low"    "medium"

    ```


    ```r

    food <- factor(food, levels = c("low", "medium", "high"))

    levels(food)

    ```


    ```

    ## [1] "low"    "medium" "high"

    ```


    ```r

    min(food) ## doesn''t work

    ```


    ```

