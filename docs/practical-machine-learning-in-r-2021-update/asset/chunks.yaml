    \ figure illustrates the probability density functions. The dashed line refers\
    \ to the actual density, while the straight line to the estimated. As we can see,\
    \ the estimation lies very close to the actual density.\n\n![](chapter12----density_functions.png)\n\
    \n### GMMs Clustering Application\n\nIn this section, we are going to demonstrate\
