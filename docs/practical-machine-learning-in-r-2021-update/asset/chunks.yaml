    \n### 7.2 包装方法 (Wrapper Methods)\n\n#### 7.2.1 递归特征消除 (Recurrent Feature Elimination)\n\
    \n作为包装方法的演示，我们将使用 `Recurrent Feature Elimination (RFE)` 方法在 Pima Indians 糖尿病数据集中选择属性。为此，我们将使用\
    \ `caret` 库。\n\n首先，像往常一样，我们将数据集划分为训练集和验证集。\n\n```\n# 确保结果的可重复性\nset.seed(1234)\n\
    # 加载所需的库\nlibrary(mlbench)\nlibrary(caret)\n# 加载数据\ndata(PimaIndiansDiabetes)\n\
    data = PimaIndiansDiabetes\n# 划分训练集和验证集\nset.seed(1234)\nind <- sample(2, nrow(data),\
    \ replace=TRUE, prob=c(0.7, 0.3))\ntrainData <- data[ind==1,]\nvalidationData\
    \ <- data[ind==2,]\ntrainData <- trainData[complete.cases(trainData),]\nvalidationData\
    \ <- validationData[complete.cases(validationData),]\n```\n\n接下来，我们将使用 `caret`\
    \ 包中的 `rfe` 方法，并使用 `rfeControl` 方法进行设置（如果出现缺少包 `klaR` 的错误，请安装库 `klaR:`）。\n\n```\n\
    # 使用随机森林选择函数定义控制\ncontrol <- rfeControl(functions=nbFuncs, method=\"cv\", number=10)\n\
    # 运行 RFE 算法\nresults <- rfe(trainData[,1:8], trainData[,9], sizes=c(1:8), rfeControl=control)\n\
    ```\n\n让我们看看结果。\n\n```\n# 总结结果\nprint(results)\n```\n\n```\n## 递归特征选择\n## 外部重采样方法：交叉验证\
