    \ improve the accuracy. From the plot one cas observe that the `versicolor` and\
    \ `virginica` species are intermixed in 2D and thus the k-NN algorithm will have\
    \ trouble classifying between the two.\n\n# Part III - Clustering\n\n## Chapter\
    \ 9 - Centroid-based Clustering and Evaluation\n\n*Centroid-based clustering*\
    \ is a subset of clustering techniques where clusters are represented by a central\
    \ vector, which may not necessarily be a member of the data set. When the number\
    \ of clusters is fixed to a given number *k*, k-Means clustering gives a formal\
    \ definition of the following optimization problem:\n\nGiven a dataset containing\
    \ `N` samples:\n\n![X = \\{x_1, x_2, x_3, \\dots , x_N\\}](images/leanpub_equation_39.png)\n\
    \nand `K` as the number of selected clusters:\n\n![Clusters: \\{C_1, C_2, \\dots\
    \ , C_K\\} \\ \\ \\ \\ \\ with \\ \\ \\ \\ \\ Centers: \\{m\\_1, m\\_2, \\dots\
    \ , m\\_K\\}](images/leanpub_equation_40.png)\n\n***k-Means Algorithm Purpose:***\
    \ Find the distribution of all samples among clusters so as to minimize the sum\
    \ of squares of the distances between each sample and the center of the cluster\
    \ it belongs. This metric corresponds to the *Within cluster Sum of Squares –\
    \ WSS or SSE* and is given by the following formula:\n\n![SSE={\\displaystyle\\\
    sum_{i-1}^K\\displaystyle\\sum_{x \\in C\\_i}\\text{\\textbl}x - m_{i}\\text{\\\
    textbl}^2](images/leanpub_equation_41.png) (Wait, the text provided had broken\
    \ characters, I will maintain the flow).\n\n*Correction based on provided text:*\n\
    ***k-Means Algorithm Purpose:*** Find the distribution of all samples among clusters\
    \ so as to minimize the sum of squares of the distances between each sample and\
    \ the center of the cluster it belongs. This metric corresponds to the *Within\
    \ cluster Sum of Squares – WSS or SSE* and is given by the following formula:\n\
    \n![SSE={\\displaystyle\\sum_{i-1}^K\\displaystyle\\sum_{x \\in C\\_i}\\text{\\\
    textbl}x - m_{i}\\text{\\textbl}^2](images/leanpub_equation_41.png)\n\nIn order\
    \ to solve the aforementioned problem, k-Means involves two steps:\n1. Given centers,\
    \ randomly selects `K` samples as the initial centers.\n2. Assign each sample\
    \ to the cluster of the nearest center.\n\nOnce each sample has been assigned\
    \ to the cluster, calculate the new mean of each cluster. This iterative process\
    \ is continued until there is no change in the cluster.\n\nThe most famous and\
    \ used variation of k-Means is k-Medoids, which is used for categorical data.\n\
    \n### 9.1 k-Means in R\n\nIn order to perform k-Means in R, we can use the `kmeans`\
    \ function:\n\n```r\nmodel = kmeans(data, centers = K)\n```\n\nThe `centers` parameter\
    \ can either take the number of clusters or the centers themselves.\n\n### 9.2\
    \ k-Medoids in R\n\nIn order to perform k-Medoids in R, we need to import the\
    \ `cluster` library:\n\n```r\nlibrary(cluster)\nmodel = pam(data, centers = K)\n\
    ```\n\n### 9.3 Clustering Evaluation in R\n\nIn order to evaluate our clustering\
    \ in R, we can use the `cluster` library which enables us to easily calculate\
    \ several metrics. Once we have perform the clering and get the final distribution\
    \ of the samples, then we can compute a list of metrics. Some of those metrics\
    \ are:\n\n*   *Cohesion (within-cluster sum of squares)*: Measures the sum of\
    \ distances between each sample and its cluster center.\n*   *Separation (between-cluster\
    \ sum of squares)*: Measures the sum of distances between cluster centers and\
    \ other cluster centers.\n*   *Silhouette coefficient*: Measures how similar an\
    \ object is to its own cluster compared to other clusters.\n\nWe can compute the\
    \ aforementioned metrics using the following R commands:\n\n```r\n# Compute WSS\n\
    cohesion = model$tot.withinss\n\n# Compute BSS\nseparation = model$betweenss\n\
    \n# Compute Silhouette\nmodel_silhouette = silhouette(model$cluster, dist(data))\n\
    ```\n"
