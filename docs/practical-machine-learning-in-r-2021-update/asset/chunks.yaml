    \n## Chapter 3 - Classification with Decision trees\n\n### 3.1 Introduction\n\n\
    #### 3.1.1 Introduction to Decision Trees\n\nA Decision Tree is a Machine Learning\
    \ algorithm that is used mainly for classification problems. It can be applied\
    \ to categorical and continuous data. The main concept of the algorithm is simple;\
    \ the data are split consecutively according to certain splitting criteria. Decision\
    \ trees are computationally efficient when training and quite fast for classifying\
    \ new instances. Furthermore, they are comprehensional when they are not too large,\
    \ therefore they are frequently used for data exploration. A common pitfall is\
    \ that they are sensitive to overfitting, which can be confronted by pruning or\
    \ by adding further criteria when building the tree.\n\n#### 3.1.2 Decision Trees\
    \ in R\n\nWe may use the `rpart` library to build decision trees in R:\n\n```\n\
    library(rpart)\n```\n\nFurthermore, we shall use the library `rpart.plot` to plot\
    \ the produced trees:\n\n```\nlibrary(rpart.plot)\n```\n\nBuilding a new tree\
    \ requires executing the `rpart` command:\n\n```\nmodel <- rpart(Target ~ ., method\
    \ = \"class\", data = ..., minsplit = ..., minbucke\\\nt = ..., cp = ...)\n```\n\
    \nWe can plot the tree using `plot(model)` and `text(model, use.n = TRUE)`, or,\
    \ alternatively using the following command:\n\n```\nrpart.plot(model, extra =\
    \ 104, nn = TRUE)\n```\n\nIn order to check the parameters of `rpart`, we can\
    \ run `rpart`. Additionally, if we execute `rpart.control`, we can also check:\n\
    \n* `minsplit`: the minimum number of instances in a node so that it split\n*\
    \ `minbucket`: the minimum allowed number of instances in each leaf\n* `maxdepth`:\
    \ the maximum depth of the tree\n* `cp`: parameter that controls complexity for\
    \ split and is set intuitively (the larger its value, the more probable to apply\
    \ pruning to the tree)\n\n### 3.2 Splitting Criteria and Decision Tree Construction\n\
    \nTo compute the values of different splitting criteria, we will use as example\
    \ the training data of following table, which refer to problem of binary classification.\n\
    \n| Outlook | Temperature | Humidity | Play |\n| :--- | :--- | :--- | :--- |\n\
    | Sunny | Hot | High | No |\n| Sunny | Hot | Normal | No |\n| Overcast | Hot |\
    \ High | Yes |\n| Rainy | Hot | High | Yes |\n| Sunny | Mild | High | No |\n|\
    \ Overcast | Mild | Normal | Yes |\n| Rainy | Mild | Normal | Yes |\n| Sunny |\
    \ Mild | Normal | No |\n| Overcast | Mild | Low | Yes |\n| Rainy | Mild | Low\
    \ | Yes |\n| Sunny | Cool | High | No |\n| Overcast | Cool | Normal | Yes |\n\
    | Rainy | Cool | Normal | Yes |\n\nWe are going to apply decision tree algorithm\
    \ on the above dataset. We will answer the following questions:\n\na) If we split\
    \ using the Gini index, which feature (out of Outlook, Temperature, and Humidity)\
    \ should we perform the first split?\nb) If we split using Information gain, which\
    \ feature (out of Outlook, Temperature, and Humidity) should we perform the first\
    \ split?\nc) Build the full decision tree using Gini index. Also, plot the tree.\n\
    \n#### 3.2.1 Data and Library Imports\n\nInitially, we read the data and import\
    \ the required libraries:\n\n```\nweather = read.csv(\"weather.txt\", stringsAsFactors\
    \ = TRUE)\nlibrary(rpart)\nlibrary(rpart.plot)\n```\n\n#### 3.2.2 Splitting Criteria\n\
    \nTo see the split for variable `Outlook`, we execute the following command:\n\
    \n```\nmodel <- rpart(Play ~ Outlook, method = \"class\", data = weather, minsplit\
    \ = 1)\n```\n\nIf we also run this command for Temperature and Humidity, and then\
    \ plot all three with `rpart.plot(model, extra = 104, nn = TRUE)`, then the following\
    \ visualizations are provided:\n\n![](images/chapter3----decision_tree_split.png)\n\
    \nIntuitively, we can already understand which of the three splits will be selected,\
    \ right?\n\n##### 3.2.2.1 Gini Index\n\nWe compute the Gini index for `Outlook`\
    \ using the following formulas:\n\n$GINI(Sunny) = 1 - Freq(Play = No|Outlook =\
    \ Sunny)^2 - Freq(Play = Yes|Outlook = Sunny)^2$\n\n$GINI(Rainy) = 1 - Freq(Play\
    \ = No|Outlook = Rainy)^2 - Freq(Play = Yes|Outlook = Rainy)^2$\n\n$GINI(Outlook)\
    \ = Freq(Outlook = Sunny) \\cdot GINI(Sunny) + Freq(Outlook = Rainy) \\cdot GINI(Rainy)$\n\
    \nThe calculations provide:\n\n$GINI(Sunny) = 1 - (4/6)^2 - (2/6)^2 = 0.444$\n\
    \n$GINI(Rainy) = 1 - (1/8)^2 - (7/8)^2 = 0.219$\n\n$GINI(Outlook) = (6/14) \\\
    cdot 0.444 + (8/14) \\cdot 0.219 = 0.315$\n\nSimilarly, the GINI for Temperature\
    \ and Humidity is $GINI(Temp) = 0.367$ and $GINI(Temp) = 0.394$, respectively.\
