  trans: "\n\n拥有模型后，可以使用以下命令对新实例进行分类：\n\n```\npredict(model, test)\n```\n\n如果我们还想查看每个类的概率，则必须添加参数\
    \ `probability = TRUE`。注意，参数 `probability = TRUE` 必须在训练时（命令 `svm`）和运行期间（命令 `predict`）都进行添加。\n\
    \n### 6.2 支持向量机模型的构建与分类\n\n我们将使用 `alldata.txt` 文件的数据来解决一个二分类问题：\n\n```\n     \
    \     X1                    X2                  y      \n    Min.   :-3.25322007\
    \   Min.   :-4.664161   Min.   :1.0  \n    1st Qu.:-0.70900886   1st Qu.: 0.625361\
    \   1st Qu.:1.0  \n    Median :-0.01162501   Median : 1.641370   Median :1.5 \
    \ \n    Mean   : 0.03493570   Mean   : 1.939284   Mean   :1.5  \n    3rd Qu.:\
    \ 0.73337179   3rd Qu.: 3.115350   3rd Qu.:2.0  \n    Max.   : 3.63957363   Max.\
    \   : 9.784076   Max.   :2.0 \n```\n\n首先，我们导入数据集并将其分为训练数据和测试数据：\n\n```\nalldata\
    \ = read.csv(\"alldata.txt\")\ntrainingdata = alldata[1:600, ]\ntestdata = alldata[601:800,\
    \ ]\n```\n\n我们将回答以下问题：\n\na) 使用不同的颜色/符号为每个类绘制训练数据图。\n\nb) 应用 RBF 核且 gamma 等于 1\
    \ 的 SVM，并在问题 (a) 的图中画出超平面。\n\nc) 重复问题 (b)，设置 gamma 值分别等于 0.01 和 100。你的观察结果是什么？\n\
    \n使用 gamma 值 `gammavalues = c(0.01, 0.1, 1, 10, 100, 1000, 10000, 100000, 1000000)`，我们还将回答以下问题：\n\
    \nd) 计算训练误差和测试误差。\n\ne) 将这两个误差绘制在同一张图中。你的观察结果是什么？\n\nf) 应用 10 折交叉验证来寻找 gamma 的最佳值。\n\
    \n#### 6.2.1 导入\n\n首先，我们导入所需的库：\n\n```\nlibrary(MLmetrics)\nlibrary(e1071)\n```\n\
    \n#### 6.2.2 算法应用与超平面图\n\n对于问题 (a)，我们执行：\n\n```\nplot(trainingdata[, c(1:2)],\
    \ col = trainingdata$y, pch = c(\"o\",\"+\")[trainingdata$y])\n```\n\n对于问题 (b)\
    \ 和 (c)，我们首先建立一个网格，并在其上方绘制超平面：\n\n```\nX1 = seq(min(trainingdata[, 1]), max(trainingdata[,\
    \ 1]), by = 0.1)\nX2 = seq(min(trainingdata[, 2]), max(trainingdata[, 2]), by\
    \ = 0.1)\nmygrid = expand.grid(X1, X2)\ncolnames(mygrid) = colnames(trainingdata)[1:2]\n\
    ```\n\n对于问题 (b)，我们使用 `gamma = 1` 训练 SVM 并将其应用于网格：\n\n```\nsvm_model = svm(y ~\
    \ ., kernel=\"radial\", type=\"C-classification\", data = trainingdata, gamma\
    \ = 1)\npred = predict(svm_model, mygrid)\nY = matrix(pred, length(X1), length(X2))\n\
    contour(X1, X2, Y, add = TRUE, levels = 1.5, labels = \"gamma = 1\", col = \"\
    blue\")\n```\n\n同样，对于问题 (c)，当 `gamma = 0.01` 时：\n\n```\nsvm_model = svm(y ~ .,\
    \ kernel=\"radial\", type=\"C-classification\", data = trainingdata, gamma = 0.01)\n\
    pred = predict(svm_model, mygrid)\nY = matrix(pred, length(X1), length(X2))\n\
    contour(X1, X2, Y, add = TRUE, levels = 1.5, labels = \"gamma = 0.01\", col =\
    \ \"red\")\n```\n\n以及当 `gamma = 100` 时：\n\n```\nsvm_model = svm(y ~ ., kernel=\"\
    radial\", type=\"C-classification\", data = trainingdata, gamma = 100)\npred =\
    \ predict(svm_model, mygrid)\nY = matrix(pred, length(X1), length(X2))\ncontour(X1,\
    \ X2, Y, add = TRUE, levels = 1.5, labels = \"gamma = 100\", col = \"green\")\n\
    ```\n\n最后，图示所示：\n\n![](img/chapter6----svmdiagram.png)\n\n#### 6.2.3 训练与测试误差曲线\n\
    \n对于问题 (d)，我们遍历所有的 `gamma` 值并计算训练误差：\n\n```\ntraining_error = c()\nfor (gamma\
    \ in gammavalues) {\n  svm_model = svm(y ~ ., kernel=\"radial\", type=\"C-classification\"\
    , data = trainingdata, gamma = gamma)\n  pred = predict(svm_model, trainingdata[,\
    \ c(1:2)])\n  training_error = c(training_error, 1 - Accuracy(trainingdata$y,\
    \ pred))\n}\n```\n\n同样，对于测试误差：\n\n```\ntesting_error = c()\nfor (gamma in gammavalues)\
    \ {\n  svm_model = svm(y ~ ., kernel=\"radial\", type=\"C-classification\", data\
    \ = trainingdata, gamma = gamma)\n  pred = predict(svm_model, testdata[, c(1:2)])\n\
    \  testing_error = c(testing_error, 1 - Accuracy(testdata$y, pred))\n}\n```\n\n\
    我们可以使用以下命令在同一张图中绘制这两个误差：\n\n```\nplot(training_error, type = \"l\", col=\"blue\"\
    , ylim = c(0,0.5), xlab = \"Gamma\", ylab = \"Error\")\nlines(testing_error, col=\"\
    red\")\nlegend(\"right\", legend = c(\"Training Error\", \"Testing Error\"), col\
    \ = c(\"blue\", \"red\"))\n```\n\n"
- fmt: "The output is a formula that we can use in various classification algorithms\
    \ and says that according to the `CFS` algorithm and the training dataset, the\
    \ best features in order to predict the `Species` of the Iris flowers are the\
    \ `Petal Length` and the `Petal Width`.\n\nFor example in the `Naive Bayes` algorithm,\
    \ we will use both the formula that includes all the attributes for predicting\
    \ the `Species` and the formula derived from `CFS`.\n\n```\nlibrary(e1071)\nmodel\
    \ <- naiveBayes(Species ~ ., data=trainData, laplace = 1)\nsimpler_model <- naiveBayes(f,\
    \ data=trainData, laplace = 1)\n\npred <- predict(model, validationData)\nsimpler_pred\
    \ <- predict(simpler_model, validationData)\n\nlibrary(MLmetrics)\ntrain_pred\
    \ <- predict(model, trainData)\ntrain_simpler_pred <- predict(simpler_model, trainData)\n\
