    _2** || Low || SE |\n\n| **Conference\\_3** || High || ML |\n\n| **Conference\\\
    _4** || Low || DM |\n\n| **Conference\\_5** || Low || ML |\n\n| **Conference\\\
    _6** || High || SE |\n\nThe above dataset presents the rank and the topic of 6\
    \ different conferences. SE satnds for Software Engineering, ML for Machine Learning\
    \ and DM for Data Mining.\n\nAt first, we will construct our data frame containing\
    \ the above dataset with the following commands:\n\n```\n# Vector that holds Rank\
    \ data\nRank = c(\"High\", \"Low\", \"High\", \"Low\", \"Low\", \"High\")\n\n\
    # Vector that holds Topic data\nTopic = c(\"SE\", \"SE\", \"ML\", \"DM\", \"ML\"\
    , \"SE\")\n\n# Data frame\nconferences = data.frame(Rank, Topic)\n```\n\nWe can\
    \ apply k-Medoids using the following commands:\n\n```\n# Import library\nlibrary(cluster)\n\
    \n# Create k-Medoids model\nmodel = pam(conferences, 3)\n```\n\nWe can display\
    \ the medoids and the distribution of the data instances into clusters using the\
    \ following commands:\n\n```\n# Get medoids\nmodel$medoids\n\n# Get distribution\
    \ of samples into clusters\nmodel$clustering\n```\n\nWe can also display the medoids\
    \ by their names using the following command:\n\n```\nconferences[model$id.med,]\n\
    ```\n\nFinally, we can plot the data using the following commands:\n\n```\n# Get\
    \ the different ranks\nL1 = levels(conferences$Rank)\n\n# Get the different topics\n\
    L2 = levels(conferences$Topic)\n\n# Plot data\nplot(model$data, xaxt = \"n\",\
    \ yaxt = \"n\", pch = 15, col = model$cluster)\n\n# Insert axes labels\naxis(1,\
    \ at = 1:length(L1), labels = L1)\naxis(2, at = 1:length(L2), labels = L2)\n\n\
    # Display medoids\npoints(conferences[model$id.med,], col = 1:3, pch = \"o\",\
    \ cex = 2)\n```\n\n![](images/chapter9----app_medoids.png)\n\n## Chapter 10 -\
    \ Connectivity-based Clustering\n\n***Connectivity-based clustering***, also known\
    \ as ***hierarchical clustering***, is based on the core idea that every instance\
    \ of a given dataset is related with every other instance. The main idea behind\
    \ the aforementioned assumption is that the degree of this relation is stronger\
    \ for the “nearby” objects than to objects farther away. The term **nearby** implies\
    \ that these algorithms connect *data instances* to form *clusters* based on their\
    \ distance. A cluster can be described largely by the maximum distance needed\
    \ to connect parts of the cluster. At different distances, different clusters\
    \ will form, which can be represented using a dendrogram, which explains where\
    \ the common name “hierarchical clustering” comes from: these algorithms do not\
    \ provide a single partitioning of the data set, but instead provide an extensive\
    \ hierarchy of clusters that merge with each other at certain distances.\n\n###\
    \ 10.1 Hierarchical clustering in R\n\n#### 10.1.1 Data Construction\n\nIn order\
    \ to provide a detailed overview of how hierarchical clustering can be performed\
    \ using R packages, let’s consider the following simple dataset containing five\
    \ instances of the 2-dimentional space.\n\n|   || X || Y |\n\n| --- | --- | ---\
    \ |\n\n| **x1** || 2 || 0 |\n\n| --- | --- | --- |\n\n| **x2** || 8 || 4 |\n\n\
    | **x3** || 0 || 6 |\n\n| **x4** || 7 || 2 |\n\n| **x5** || 6 || 1 |\n\nFirst\
    \ of all, we need to properly construct our data frame containing the above dataset.\
    \ In order to do so, we can use the following commands:\n\n```\n# Construct vector\
    \ containing X-axis data\nX = c(2, 8, 0, 7, 6)\n\n# Construct vector containing\
    \ Y-axis data\nY = c(0, 4, 6, 2, 1)\n\n# Construct vector containing the data\
    \ labels which correspond to the row names\nrnames = c(\"x1\", \"x2\", \"x3\"\
    , \"x4\", \"x5\")\n\n# Create the data frame\nhdata = data.frame(X, Y, row.names\
    \ = rnames) \n```\n\nOnce having created our data frame, we can plot our data\
    \ using the following commands:\n\n```\n# Plot the data\nplot(hdata, pch = 15)\n\
    \n# Add the data labels\ntext(hdata, labels = row.names(hdata), pos = c(4, 2,\
    \ 4, 4, 4))\n```\n\nOur data is illutrated in the following figure:\n\n![](images/chapter10----plot_example_data.png)\n\
    \n#### 10.1.2 Hierarchical Clustering using Single and Complete Linkage\n\nIn\
    \ this subsection, we will perform hierarchical clustering using single and complete\
    \ linkage using the aforementioned dataset.\n\nAs already noted, hierarchical\
    \ clustering is an iterative process that starts with the individual elements\
    \ of a given dataset in order to progressively form clusters. These clusters are\
    \ formed by merging elements that appear to have a strong connection. This connection\
    \ is expressed using a distance metric. A very common distance metric is the Euclidean\
    \ distance, which is given by the following equation:\n\n![\\\\text{\\\\textbardbl}x\\\
    _{1} - x\\_{2}\\\\text{\\\\textbardbl}\\_2=\\\\sqrt{{\\\\displaystyle\\\\sum\\\
    _{i}(x\\_{1} - x\\_{2})^2}}](images/leanpub_equation_82.png)\n\nAt first, we will\
    \ go through the single linkage algorithm:\n\n***1st iteration:***\n\nThe following\
    \ table presents the distnce matrix for the aforementioned dataset.\n\n|   ||\
    \ x1 || x2 || x3 || x4 || x5 |\n\n| --- | --- | --- | --- | --- | --- |\n\n| **x1**\
    \ || 0 || 7.21 || 6.32 || 5.39 || 4.12 |\n\n| --- | --- | --- | --- | --- | ---\
    \ |\n\n| **x2** || 7.21 || 0 || 8.25 || 2.24 || 3.61 |\n\n| **x3** || 6.32 ||\
    \ 8.25 || 0 || 8.06 || 7.81 |\n\n| **x4** || 5.39 || 2.24 || 8.06 || 0 || ***1.41***\
    \ |\n\n| **x5** || 4.12 || 3.61 || 7.81 || ***1.41*** || 0 |\n\nAs shown in the\
    \ table, the points x4 and x5 are the ones having the smallest distance. As a\
    \ result, we link them together and thus we formulate our first cluster.\n\n***2nd\
    \ iteration:***\n\nSince we are using single linkage, the distance between the\
    \ cluster containing the points x4 and x5 and every other point is the minimum\
    \ of the distance between this point and the points x4 and x5.\n\nThe following\
    \ table presents the updated distance matrix.\n\n|   || x1 || x2 || x3 || x4 -\
    \ x5 |\n\n| --- | --- | --- | --- | --- |\n\n| **x1** || 0 || 7.21 || 6.32 ||\
    \ 4.12 |\n\n| --- | --- | --- | --- | --- |\n\n| **x2** || 7.21 || 0 || 8.25 ||\
    \ ***2.24*** |\n\n| **x3** || 6.32 || 8.25 || 0 || 7.81 |\n\n| **x4** - **x5**\
    \ || 4.12 || ***2.24*** || 7.81 || 0 |\n\nAgain, using the same strategy, we link\
    \ the point x2 with the cluster (x4 - x5).\n\n***3rd iteration:***\n\nIn the next\
    \ iteration, the distance matrix is updated again and the point x1 is linked with\
    \ the cluster (x2 - x4 - x5).\n\n|   || x1 || x2 - x4 - x5 || x3 |\n\n| --- |\
    \ --- | --- | --- |\n\n| **x1** || 0 || ***4.12*** || 6.32 |\n\n| --- | --- |\
    \ --- | --- |\n\n| **x2** - **x4** - **x5** || ***4.12*** || 0 || 7.81 |\n\n|\
    \ **x3** || 6.32 || 7.81 || 0 |\n\n***4th iteration:***\n\nFinally, the clustering\
    \ is completed in the 4th iteration where the final point x3 is linked with the\
    \ cluster (x1 - x2 - x4 - x5).\n\n|   || x1 - x2 - x4 - x5 || x3 |\n\n| --- |\
    \ --- | --- |\n\n| **x1** - **x2** - **x4** - **x5** || 0 || ***6.32*** |\n\n\
    | --- | --- | --- |\n\n| **x3** || ***6.32*** || 0 |\n\nAt this point we will\
    \ go through the same iterative process again, but for the case of complete linkage.\n\
    \n***1st iteration:***\n\nThe first step is the same as in the case of single\
    \ linkage, where we compute the distance matrix of our original dataset and link\
    \ the points x4 and x5 which are the ones having the smallest distance.\n\n|  \
    \ || x1 || x2 || x3 || x4 || x5 |\n\n| --- | --- | --- | --- | --- | --- |\n\n\
    | **x1** || 0 || 7.21 || 6.32 || 5.39 || 4.12 |\n\n| --- | --- | --- | --- | ---\
    \ | --- |\n\n| **x2** || 7.21 || 0 || 8.25 || 2.24 || 3.61 |\n\n| **x3** || 6.32\
    \ || 8.25 || 0 || 8.06 || 7.81 |\n\n| **x4** || 5.39 || 2.24 || 8.06 || 0 || ***1.41***\
    \ |\n\n| **x5** || 4.12 || 3.61 || 7.81 || ***1.41*** || 0 |\n\n***2nd iteration:***\n\
    \nAs opposed to the case of single linkage, in complete linkage the distance between\
    \ the cluster containing the points x4 and x5 and every other point is the maximum\
    \ of the distance between this point and the points x4 and x5.\n\nThe following\
    \ table presents the updated distance matrix.\n\n|   || x1 || x2 || x3 || x4 -\
    \ x5 |\n\n| --- | --- | --- | --- | --- |\n\n| **x1** || 0 || 7.21 || 6.32 ||\
    \ 5.39 |\n\n| --- | --- | --- | --- | --- |\n\n| **x2** || 7.21 || 0 || 8.25 ||\
    \ ***3.61*** |\n\n| **x3** || 6.32 || 8.25 || 0 || 8.06 |\n\n| **x4** - **x5**\
    \ || 5.39 || ***3.61*** || 8.06 || 0 |"
