- fmt: "\nHaving a model, a new instance may be classified using the command:\n\n\
    ```\npredict(model, test)\n```\n\nIf we also want to view the probabilities for\
    \ each class, then we have to add the parameter `probability = TRUE`. Note that\
    \ the parameter `probability = TRUE` must be added both while training (command\
    \ `svm`) and while running (command `predict`).\n\n### 6.2 Support Vector Machines\
    \ Model Construction and Classification\n\nWe will use the data of the file `alldata.txt`\
    \ for a problem of binary classification:\n\n```\n          X1               \
    \     X2                  y      \n    Min.   :-3.25322007   Min.   :-4.664161\
    \   Min.   :1.0  \n    1st Qu.:-0.70900886   1st Qu.: 0.625361   1st Qu.:1.0 \
    \ \n    Median :-0.01162501   Median : 1.641370   Median :1.5  \n    Mean   :\
    \ 0.03493570   Mean   : 1.939284   Mean   :1.5  \n    3rd Qu.: 0.73337179   3rd\
    \ Qu.: 3.115350   3rd Qu.:2.0  \n    Max.   : 3.63957363   Max.   : 9.784076 \
    \  Max.   :2.0 \n```\n\nInitially, we import the dataset, and split it into training\
    \ and testing data:\n\n```\nalldata = read.csv(\"alldata.txt\")\ntrainingdata\
    \ = alldata[1:600, ]\ntestdata = alldata[601:800, ]\n```\n\nWe will answer to\
    \ the following questions:\n\na) Plot the training data with different colors/symbols\
    \ for each class.\n\nb) Apply SVM with RBF kernel and gamma equal to 1, and plot\
    \ the hyperplane on the figure of question (a).\n\nc) Repeat question (b) for\
    \ gamma value equal to 0.01 and equal to 100. What are your observations?\n\n\
    Using the gamma values `gammavalues = c(0.01, 0.1, 1, 10, 100, 1000, 10000, 100000,\
    \ 1000000)`, we will also answer to the following questions:\n\nd) Compute the\
    \ training error and the testing error.\n\ne) Plot the two errors on the same\
    \ diagram. What are your observations?\n\nf) Apply 10-fold cross validation to\
    \ find the best value for gamma.\n\n#### 6.2.1 Library Imports\n\nInitially, we\
    \ import the required librares:\n\n```\nlibrary(MLmetrics)\nlibrary(e1071)\n```\n\
    \n#### 6.2.2 Algorithm Application and Hyperplane Diagram\n\nFor question (a),\
    \ we execute\n\n```\nplot(trainingdata[, c(1:2)], col = trainingdata$y, pch =\
    \ c(\"o\",\"+\")[trainingdata$y])\n```\n\nFor questions (b), (c), we initially\
    \ build a grid, on top of which we are going to plot the hyperplanes:\n\n```\n\
    X1 = seq(min(trainingdata[, 1]), max(trainingdata[, 1]), by = 0.1)\nX2 = seq(min(trainingdata[,\
    \ 2]), max(trainingdata[, 2]), by = 0.1)\nmygrid = expand.grid(X1, X2)\ncolnames(mygrid)\
    \ = colnames(trainingdata)[1:2]\n```\n\nFor question (b), we train the SVM with\
    \ `gamma = 1` and apply it on the grid:\n\n```\nsvm_model = svm(y ~ ., kernel=\"\
    radial\", type=\"C-classification\", data = trainingdata, gamma = 1)\npred = predict(svm_model,\
    \ mygrid)\nY = matrix(pred, length(X1), length(X2))\ncontour(X1, X2, Y, add =\
    \ TRUE, levels = 1.5, labels = \"gamma = 1\", col = \"blue\")\n```\n\nSimilarly,\
    \ for question (c), when `gamma = 0.01`:\n\n```\nsvm_model = svm(y ~ ., kernel=\"\
    radial\", type=\"C-classification\", data = trainingdata, gamma = 0.01)\npred\
    \ = predict(svm_model, mygrid)\nY = matrix(pred, length(X1), length(X2))\ncontour(X1,\
    \ X2, Y, add = TRUE, levels = 1.5, labels = \"gamma = 0.01\", col = \"red\")\n\
    ```\n\nand when `gamma = 100`:\n\n```\nsvm_model = svm(y ~ ., kernel=\"radial\"\
    , type=\"C-classification\", data = trainingdata, gamma = 100)\npred = predict(svm_model,\
    \ mygrid)\nY = matrix(pred, length(X1), length(X2))\ncontour(X1, X2, Y, add =\
    \ TRUE, levels = 1.5, labels = \"gamma = 100\", col = \"green\")\n```\n\nFinally,\
    \ the diagram is shown below:\n\n![](images/chapter6----svmdiagram.png)\n\n####\
    \ 6.2.3 Training and Testing Error Curves\n\nFor question (d), we iterate over\
    \ all `gamma` values and calculcate the training error:\n\n```\ntraining_error\
    \ = c()\nfor (gamma in gammavalues) {\n  svm_model = svm(y ~ ., kernel=\"radial\"\
    , type=\"C-classification\", data = trainingdata, gamma = gamma)\n  pred = predict(svm_model,\
    \ trainingdata[, c(1:2)])\n  training_error = c(training_error, 1 - Accuracy(trainingdata$y,\
    \ pred))\n}\n```\n\nSimilarly, for the testing error:\n\n```\ntesting_error =\
    \ c()\nfor (gamma in gammavalues) {\n  svm_model = svm(y ~ ., kernel=\"radial\"\
    , type=\"C-classification\", data = trainingdata, gamma = gamma)\n  pred = predict(svm_model,\
    \ testdata[, c(1:2)])\n  testing_error = c(testing_error, 1 - Accuracy(testdata$y,\
    \ pred))\n}\n```\n\nWe may plot the two errors on the same diagram using the commands:\n\
    \n```\nplot(training_error, type = \"l\", col=\"blue\", ylim = c(0,0.5), xlab\
    \ = \"Gamma\", ylab = \"Error\")\nlines(testing_error, col=\"red\")\nlegend(\"\
    right\", legend = c(\"Training Error\", \"Testing Error\"), col = c(\"blue\",\
    \ \"red\"))\n```\n"
