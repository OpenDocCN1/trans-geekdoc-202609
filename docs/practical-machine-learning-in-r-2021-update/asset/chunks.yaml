  trans: "\n\n| Conference_1 | 高 | SE |\n| --- | --- | --- |\n| Conference_2 | 低 |\
    \ SE |\n| Conference_3 | 高 | ML |\n| Conference_4 | 低 | DM |\n| Conference_5 |\
    \ 低 | ML |\n| Conference_6 | 高 | SE |\n\n上述数据集展示了 6 个不同会议的排名和主题。SE 代表软件工程（Software\
    \ Engineering），ML 代表机器学习（Machine Learning），DM 代表数据挖掘（Data Mining）。\n\n首先，我们将使用以下命令构建一个包含上述数据集的数据框：\n\
    \n```\n# 存储 Rank 数据的向量\nRank = c(\"High\", \"Low\", \"High\", \"Low\", \"Low\"\
    , \"High\")\n\n# 存储 Topic 数据的向量\nTopic = c(\"SE\", \"SE\", \"ML\", \"DM\", \"\
    ML\", \"SE\")\n\n# 数据框\nconferences = data.frame(Rank, Topic)\n```\n\n我们可以使用以下命令应用\
    \ k-Medoids 算法：\n\n```\n# 导入库\nlibrary(cluster)\n\n# 创建 k-Medoids 模型\nmodel =\
    \ pam(conferences, 3)\n```\n\n我们可以使用以下命令显示质类中心（medoids）以及数据实例到聚类的分布：\n\n```\n\
    # 获取质类中心\nmodel$medoids\n\n# 获取样本到聚类的分布\nmodel$clustering\n```\n\n我们还可以使用以下命令通过名称显示质类中心：\n\
    \n```\nconferences[model$id.med,]\n```\n\n最后，我们可以使用以下命令绘制数据图：\n\n```\n# 获取不同的排名\n\
    L1 = levels(conferences$Rank)\n\n# 获取不同的主题\nL2 = levels(conferences$Topic)\n\n\
    # 绘制数据\nplot(model$data, xaxt = \"n\", yaxt = \"n\", pch = 15, col = model$cluster)\n\
    \n# 插入轴标签\naxis(1, at = 1:length(L1), labels = L1)\naxis(2, at = 1:length(L2),\
    \ labels = L2)\n\n# 显示质类中心\npoints(conferences[model$id.med,], col = 1:3, pch\
    \ = \"o\", cex = 2)\n```\n\n![](img/chapter9----app_medoids.png)\n\n# 第 10 章 -\
    \ 基于连接性的聚类\n\n基于连接性的聚类（也称为层次聚类）基于一个核心思想，即给定数据集中的每个实例都与所有其他实例相关。上述假设背后的主要思想是，对于“最近”的对象，这种关系的程度比对于较远的对象更强。`nearby`\
    \ 一词意味着这些算法根据距离将`data instances`（数据实例）连接形成`clusters`（聚类）。一个聚类很大程度上可以通过连接聚类部分所需的最大距离来描述。在不同的距离下，会形成不同的聚类，这可以使用树图（dendrogram）来表示，这解释了“层次聚类”这一常用名称的由来：这些算法并不提供数据集的单一划分，而是提供了一个在特定距离下相互合并的广泛聚类层次结构。\n\
    \n## 10.1 R 中的层次聚类\n\n### 10.1.1 数据构建\n\n为了详细概述如何使用 R 进行层次聚类，让我们考虑以下包含五个二维空间实例的简单数集。\n\
    \n| | X | Y |\n| --- | --- | --- |\n| x1 | 2 | 0 |\n| x2 | 8 | 4 |\n| x3 | 0 |\
    \ 6 |\n| x4 | 7 | 2 |\n| x5 | 6 | 1 |\n\n首先，我们需要妥妥地构建包含上述数据集的数据框。为了实现这一点，我们可以使用以下命令：\n\
    \n```\n# 构建包含 X 轴数据的向量\nX = c(2, 8, 0, 7, 6)\n\n# 构建包含 Y 轴数据的向量\nY = c(0, 4, 6,\
    \ 2, 1)\n\n# 构建包含与行名对应的数据标签的向量\nrnames = c(\"x1\", \"x2\", \"x3\", \"x4\", \"\
    x5\")\n\n# 创建数据框\nhdata = data.frame(X, Y, row.names = rnames) \n```\n\n一旦创建了数据框，我们就可以使用以下命令绘制数据：\n\
    \n```\n# 绘制数据\nplot(hdata, pch = 15)\n\n# 添加数据标签\ntext(hdata, labels = row.names(hdata),\
    \ pos = c(4, 2, 4, 4, 4))\n```\n\n我们的数据如图所示：\n\n![](img/chapter10----plot_example_data.png)\n\
    \n### 10.1.2 使用单连接和完全连接进行层次聚类\n\n在本节中，我们将使用上述数据集，通过单连接（Single Linkage）和完全连接（Complete\
    \ Linkage）执行层次聚类。\n\n如所述，层次聚类是一个迭代过程，从给定数据集的单个元素开始，以逐步形成聚类。这些聚类通过合并表现出连接元素形成。这种连接是通过距离度量表示的。一种常用的距离度量是欧几里得距离，它由以下公式给出：\n\
    \n![d=\\sqrt{\\displaystyle\\sum(x_{1} - x_{2})²}}](img/chapter10----plot_example_data.png)\n\
    \n首先，我们将通过单连接进行：第一次迭代：下表显示了矩阵。\n\n| | x1 | x2 | x3 | x4 | x5 |\n| --- | --- |\
    \ --- | --- | --- |\n| x1 | 0 | 7.21 | 6.32 | 5.39 | 4.12 |\n| x2 | 7.21 | 0 |\
    \ 8.25 | 2.24 | 3.61 |\n| x3 | 6.32 | 8.25 | 0 | 8.06 | 7.81 |\n| x4 | 5.39 |\
    \ 2.24 | 8.06 | 0 | 1.41 |\n| x5 | 4.12 | 3.61 | 7.81 | 1.41 | 0 |\n\n如表所示，`x4`\
    \ 和 `x5` 距离最近。作为结果，我们将它们合并形成聚类。第二次迭代：由于我们使用单连接，包含 `x4` 和 `x5` 的聚类与其它点的距离是该点与这两个点之间距离的最小值。下表显示了更新后的矩阵。\n\
    \n| | x1 | x2 | x3 | x4 - x5 |\n| --- | --- | --- | --- | |\n| x1 | 0 | 7.21 |\
    \ 6.32 | 5.39 |\n| x2 | 7.21 | 0 | 8.25 | 3.61 |\n| x3 | 6.32 | 8.25 | 0 | 8.06\
    \ |\n| x4 - x5 | 5.39 | 3.61 | 8.06 | 0 |\n\n第三迭代：再次，我们将 `x2` 与包含 `x4` 和 `x5`\
    \ 的聚类合并。\n\n| | x1 | x2 - x4 - x5 |\n| --- | --- | --- |\n| x1 | 0 | 6.32 |\n\
    | x2 - x4 - x5 | 6.32 | 0 |\n\n第四次迭代：最后，在第四次迭代中，`x3` 与 `x1 - x2 - x4 - x5` 的聚类合并。\n\
    \n| | x1 - x2 - x4 - x5 |\n| --- | --- |\n| x1 - x2 - x4 - x5 | 0 |\n\n此时聚类在第四次迭代中完成。单连接完成。\n\
    \n此时，我们将再次通过相同的迭代过程，但针对完全连接的情况。第一次迭代：第一步与单连接的情况相同，我们计算原始数据集的矩阵并连接距离最近的 `x4` 和\
    \ `x5` 点。\n\n| | x1 | x2 | x3 | x4 | x5 |\n| --- | --- | --- | --- | --- | ---\
    \ |\n| x1 | 0 | 7.21 | 6.32 | 5.39 | 4.12 |\n| x2 | 7.21 | 0 | 8.25 | 2.24 | 3.61\
    \ |\n| x3 | 6.32 | 8.25 | 0 | 8.06 | 7.81 |\n| x4 | 5.39 | 2.24 | 8.06 | 0 | 1.41\
    \ |\n| x5 | 4.12 | 3.61 | 7.81 | 1.41 | 0 |\n\n第二次迭代：与单连接不同，在完全连接中，包含点 `x4` 和\
    \ `x5` 的聚类与任何其他点的距离是该点与 `x4` 和 `x5` 点之间距离的最大值。下表显示了更新后的矩阵。\n\n| | x1 | x2 | x3\
    \ | x4 - x5 |\n| --- | --- | --- | --- | --- |\n| x1 | 0 | 7.21 | 6.32 | 5.39\
    \ |\n| x2 | 7.21 | 0 | 8.25 | 3.61 |\n| x3 | 6.32 | 8.25 | 0 | 8.06 |\n| x4 -\
    \ x5 | 5.39 | 3.61 | 8.06 | 0 |\n\n"
- fmt: "\nBased on the updated distances, we link the point `x2` with the cluster\
    \ `(x4 - x5)`. Up to this point, the results are the same with the case of single\
    \ linkage.\n\n### 3rd iteration\n\nIn the next iteration, the distance matrix\
    \ is updated again and this time the closest point are found to be `x1` and `x3`.\
    \ As a result, they are linked together and formulate the cluster `(x1 - x3)`.\n\
    \n| | x1 | x2 - x4 - x5 | x3 |\n| --- | --- | --- | --- |\n| `x1` | 0 | 7.21 |\
    \ 6.32 |\n| `x2 - x4 - x5` | 7.21 | 0 | 8.25 |\n| `x3` | 6.32 | 8.25 | 0 |\n\n\
    ### 4th iteration\n\nFinally, the clustering is completed in the 4th iteration\
    \ where the clusters `(x1 - x3)` and `(x2 - x4 - x5)` are linked together.\n\n\
    | | x1 - x3 | x2 - x4 - x5 |\n| --- | --- | --- |\n| `x1 - x2 - x4 - x5` | 0 |\
    \ 8.25 |\n| `x3` | 8.25 | 0 |\n\n#### 10.1.3 Modeling with R\n\nWe can use the\
    \ following R command in order to compute the distance matrix.\n\n```\nd = dist(hdata)\n\
    ```\n\nHave in mind that `hdata` is the already constructed data frame that contains\
    \ our dataset (see Data Construction section).\n\nWe can use R commands in order\
    \ to perform hierarchical clustering and plot the respective dendrogram that illustrates\
    \ the formulated clusters.\n\n```r\n# Perform clustering using single linkage\n\
    hc_single = hclust(d, method = \"single\")\n\n# Plot the respective dendrogram\n\
    plot(hc_single)\n```\n\nThe following figure depicts the produced dengrogram.\n\
    \n![](images/chapter10----hierarchical_clustering_single.png)\n\nWe can use the\
    \ same commands for the case of complete linkage.\n\n```r\n# Perform clustering\
    \ using complete linkage\nhc_single = hclust(d, method = \"complete\")\n\n# Plot\
    \ the respective dendrogram\nplot(hc_single)\n```\n\nThe following figure depicts\
    \ the produced dengrogram for the case of complete linkage.\n\n![](images/chapter10----hierarchical_clustering_complete.png)\n\
    \nIt is worth noticing that the Y-axis of the dendrograms refers to the distance\
    \ metric.\n\nOnce having performed the hierarchical clustering, We can split the\
    \ original data into a number of clusters based on our preference using the following\
    \ command:\n\n```r\n# Split data into clusters. k refers to the number of clusters\n\
    clusters = cutree(hc_single, k = 2) \n#       -------- OR --------\nclusters =\
    \ cutree(hc_complete, k = 2)\n```\n\nIn order to demonstrate the formulated clusters\
    \ from the two aforementioned approaches (single and complete linkage), we can\
    \ plot using the following commands:\n\n```r\n# Single linkage result\nplot(hdata,\
    \ col = clusters, pch = 15, main = \"Single Linkage\")\ntext(hdata, labels = row.names(hdata),\
    \ pos = c(4, 2, 4, 4))\n\n# Complete linkage result\nplot(hdata, col = clusters,\
    \ pch = 15, main = \"Complete Linkage\")\ntext(hdata, labels = row.names(hdata),\
    \ pos = c(4, 2, 4, 4))\n```\n\nThe following figure depicts the two clusters for\
    \ both cases of single and complete linkage.\n\n![](images/chapter10----split_into_clusters.png)\n\
    \n### 10.2 Hierarchical Clustering Application and Evaluation\n\nIn order to apply\
    \ hierarchical clustering into a real world example, we will use the dataset `europe.txt`.\
    \ This dataset contains statistics regarding the Gross Domestic Product (GDP),\
    \ the Inflation and Unemployment in 28 countries. The first 6 entries are presented\
    \ in the table:\n\n| | GDP | Inflation | Unemployment |\n| --- | --- | --- | ---\
    \ |\n| Austria | 41600 | 3.5 | 4.2 |\n| Belgium | 37800 | 3.5 | 7.2 |\n| Bulgaria\
    \ | 13800 | 4.2 | 9.6 |\n| Croatia | 18000 | 2.3 | 17.7 |\n| Czech Republic |\
    \ 27100 | 1.9 | 8.5 |\n| Denmark | 37000 | 2.8 | 6.1 |\n\nWe will this dataset\
    \ in order to answer the following:\n\n(a) Apply hierarchical clustering using\
    \ complete linkage and plot the respective dendrogram\n(b) Select the appropriate\
    \ number of clusters based on silhouette coefficient\n(c) Use the given data in\
    \ order to form 7 clusters and produce the respective dendrogram that illustrates\
    \ the results\n(d) Create 3D plot of the data using a different color for each\
    \ cluster\n(e) Calculate and plot the silhouette coefficient\n\n#### 10.2.1 Create\
    \ Hierarchical Clustering\n\nAt first, in order to answer (a), we will perform\
    \ hierarchical clustering using the given data. Our initial step involves importing\
