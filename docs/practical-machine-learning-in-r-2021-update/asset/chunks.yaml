    \n```\n\n```\npaste(\"Accuracy in training CFS attributes\", \n      Accuracy(train_simpler_pred,\
    \ trainData$Species), sep=\" - \")\n```\n\n```\n## [1] \"Accuracy in training\
    \ CFS attributes - 0.955357142857143\"\n```\n\n```\npaste(\"Accuracy in validation\
    \ all attributes\", \n      Accuracy(pred, validationData$Species), sep=\" - \"\
    )\n```\n\n```\n## [1] \"Accuracy in validation all attributes - 0.947368421052632\"\
    \n```\n\n```\npaste(\"Accuracy in validation CFS attributes\", \n      Accuracy(simpler_pred,\
    \ validationData$Species), sep=\" - \")\n```\n\n```\n## [1] \"Accuracy in validation\
    \ CFS attributes - 0.973684210526316\"\n```\n\nThe accuracy in the training set\
    \ is increased when using all the attrbitues, but decreased in the validation\
    \ set in relation to the simpler model that only used 2 attributes.\n\n### 7.2\
    \ Wrapper Methods\n\n#### 7.2.1 Recurrent Feature Elimination\n\nAs a demonstration\
    \ of a wrapper method, we will use the `Recurrent Feature Elimination (RFE)` method\
    \ to select attributes in the Pima Indians Diabetes dataset. For this purpose\
    \ the library `caret` will be used.\n\nFirst, as always, we will split the dataset\
    \ in train and validation datasets.\n\n```\n# ensure the results are repeatable\n\
    set.seed(1234)\n# load the required libraries\nlibrary(mlbench)\nlibrary(caret)\n\
    # load the data\ndata(PimaIndiansDiabetes)\ndata = PimaIndiansDiabetes\n# split\
    \ into training and validation datasets\nset.seed(1234)\nind <- sample(2, nrow(data),\
    \ replace=TRUE, prob=c(0.7, 0.3))\ntrainData <- data[ind==1,]\nvalidationData\
    \ <- data[ind==2,]\ntrainData <- trainData[complete.cases(trainData),]\nvalidationData\
    \ <- validationData[complete.cases(validationData),]\n```\n\nNext we will use\
    \ the `rfe` method of the `caret` package, setting it up using the `rfeControl`\
    \ method (if an error about missing package `klaR` appears, install the library\
    \ `klaR:`).\n\n```\n# define the control using a random forest selection function\n\
    control <- rfeControl(functions=nbFuncs, method=\"cv\", number=10)\n# run the\
    \ RFE algorithm\nresults <- rfe(trainData[,1:8], trainData[,9], sizes=c(1:8),\
    \ rfeControl=control)\n```\n\nLet’s see the results.\n\n```\n# summarize the results\n\
    print(results)\n```\n\n```\n## Recursive feature selection\n## Outer resampling\
    \ method: Cross-Validated (10 fold) \n## Resampling performance over subset size:\n\
    ##  Variables Accuracy  Kappa AccuracySD KappaSD Selected\n##          1   0.7453\
    \ 0.3681    0.04390 0.12449         \n##          2   0.7546 0.4182    0.04598\
    \ 0.12317         \n##          3   0.7715 0.4707    0.05759 0.14388        \n\
    ##          4   0.7584 0.4479    0.04145 0.10478         \n##          5   0.7546\
    \ 0.4457    0.04429 0.10095         \n##          6   0.7490 0.4344    0.04393\
    \ 0.09394         \n##          7   0.7509 0.4290    0.04686 0.11122         \n\
    ##          8   0.7491 0.4201    0.03507 0.07767         \n## \n## The top 3 variables\
    \ (out of 3):\n##    glucose, age, mass\n```\n\nThe RFE out of 8 selected three\
    \ (`glucose`, `age`, `mass`) that provided the best accuracy under 10-fold cross-validation.\n\
    \n#### 7.2.2 Forward Search\n\nThe standard wrapper methods are forward and backward\
    \ search. In this sub-section we apply forward search and decision trees.\n\n\
    ```\nlibrary(FSelector)\nlibrary(rpart)\n\nevaluator <- function(subset) {\n \
    \ #k-fold cross validation\n  k <- 5\n  splits <- runif(nrow(trainData))\n  results\
    \ = sapply(1:k, function(i) {\n    test.idx <- (splits >= (i - 1) / k) & (splits\
    \ < i / k)\n    train.idx <- !test.idx\n    test <- trainData[test.idx, , drop=FALSE]\n\
    \    train <- trainData[train.idx, , drop=FALSE]\n    tree <- rpart(as.simple.formula(subset,\
    \ \"Class\"), train)\n    error.rate = sum(test$Class != predict(tree, test, type=\"\
    c\")) / nrow(test)\n    return(1 - error.rate)\n  })\n  print(subset)\n  print(mean(results))\n\
    \  return(mean(results))\n}\n\nsubset <- forward.search(names(trainData)[-10],\
    \ evaluator)\n```\n"
