    blue\", ylim = c(0, 0.5), xlab = \"Gamma\", yl\\\nab = \"Error\", xaxt = \"n\"\
    )\naxis(1, at = 1:length(gammavalues), labels = gammavalues)\nlines(testing_error,\
    \ col=\"red\")\nlegend(\"right\", c(\"Training Error\", \"Testing Error\"), pch\
    \ = c(\"-\",\"-\"),  col = c(\\\n\"blue\", \"red\"))\n```\n\nFinally, we are provided\
    \ with the following diagram:\n\n![](images/chapter6----trainingtestingerrors.png)\n\
    \n#### 6.2.4 Cross-validation\n\nWe will apply k-fold cross validation to compute\
    \ the best value for gamma (question (f)). Initially, we construct k folds:\n\n\
    ```\nk = 10\ndsize = nrow(trainingdata)\nfolds = split(sample(1:dsize), ceiling(seq(dsize)\
    \ * k / dsize))\n```\n\nAfter that, we make a loop over gamma, and inside the\
    \ loop we create a new (nested) loop over the folds:\n\n```\naccuracies <- c()\n\
    for (gamma in gammavalues) {\n  predictions <- data.frame()\n  testsets <- data.frame()\n\
    \  for(i in 1:k){\n    # Select 9 out of 10 folds for training and 1 for validation\n\
    \    trainingset <- trainingdata[unlist(folds[-i]),]\n    validationset <- trainingdata[unlist(folds[i]),]\n\
    \    # Train and apply the model\n    svm_model = svm(y ~ ., kernel=\"radial\"\
    , type=\"C-classification\", data = train\\\ningset, gamma = gamma)\n    pred\
    \ = predict(svm_model, validationset[, c(1:2)])\n    # Save predictions and testsets\n\
    \    predictions <- rbind(predictions, as.data.frame(pred))\n    testsets <- rbind(testsets,\
    \ as.data.frame(validationset[,3]))\n  }\n  # Calculate the new accuracy and add\
    \ it to the previous ones\n  accuracies = c(accuracies, Accuracy(predictions,\
    \ testsets))\n}\n```\n\nWe calculate the accuracy for each fold, and, finally,\
    \ select the gamma value with the maximum accuracy:\n\n```\nprint(accuracies)\n\
    bestgamma = gammavalues[which.max(accuracies)]\n```\n\n### 6.3 Exercise\n\nYou\
    \ are given the following data where Y is the class vector of a binary classification\
    \ problem.\n\n| X1 || X2 || Y |\n\n| --- | --- | --- |\n\n| 2 || 2 || 1 |\n\n\
    | --- | --- | --- |\n\n| 2 || \\-2 || 1 |\n\n| \\-2 || \\-2 || 1 |\n\n| \\-2 ||\
    \ 2 || 1 |\n\n| 1 || 1 || 2 |\n\n| 1 || \\-1 || 2 |\n\n| \\-1 || \\-1 || 2 |\n\
    \n| \\-1 || 1 || 2 |\n\nYou can enter the data in R using the following commands:\n\
    \n```\nX1 = c(2, 2, -2, -2, 1, 1, -1, -1)\nX2 = c(2, -2, -2, 2, 1, -1, -1, 1)\n\
    Y = c(1, 1, 1, 1, 2, 2, 2, 2)\nalldata = data.frame(X1, X2, Y)\n```\n\nAnswer\
    \ to the following questions:\n\na) Plot the training data with different colors/symbols\
    \ for each class.\n\nb) Apply SVM with RBF kernel, and plot the hyperplane on\
    \ the figure of question (a).\n\nc) Using your jmodel, in which class would you\
    \ classify a new instance with values `(4, 5)`?\n\n# Part III - Data Processing\n\
    \n## Chapter 7 - Feature Selection\n\n### 7.1 Introduction\n\nWhat is feature\
    \ selection? What are filter methods? What are wrapper methods?\n\n### 7.2 Filter\
    \ Methods\n\nIn this section we will use the **Correlation Feature Selection (CFS)**\
    \ method to select attributes to be used when training and testing the machine\
    \ learning models. We will use the Iris dataset for this purpose.\n\n```\ndata\
    \ = iris\n# split into training and validation datasets\nset.seed(1234)\nind <-\
    \ sample(2, nrow(data), replace=TRUE, prob=c(0.7, 0.3))\ntrainData <- data[ind==1,]\n\
    validationData <- data[ind==2,]\n# keep only instances that do not have missing\
    \ values.\ntrainData <- trainData[complete.cases(trainData),]\nvalidationData\
    \ <- validationData[complete.cases(validationData),]\n```\n\n#### 7.2.1 Using\
    \ the CFS method\n\nThe CFS method is found in the `FSelector` package and to\
    \ use it we call the `cfs` method.\n\n```\nlibrary(FSelector)\nsubset <- cfs(Species\
    \ ~ ., trainData)\nf <- as.simple.formula(subset, \"Species\")\nprint(f)\n```\n\
    \n```\n## Species ~ Petal.Length + Petal.Width\n## <environment: 0x114e18a70>\n\
    ```"
