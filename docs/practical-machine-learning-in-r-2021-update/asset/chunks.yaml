- fmt: "\n### 5.2 k-Nearest Neighbors Model Construction and Classification\n\nWe\
    \ will use the data of the following table for a problem of binary classification:\n\
    \n| X1 | X2 | Y |\n| --- | --- | --- |\n| 0.7 | 0.7 | A |\n| 0.7 | 0.8 | A |\n\
    | 0.6 | 0.6 | A |\n| 0.5 | 0.5 | A |\n| 0.5 | 0.6 | A |\n| 0.5 | 0.7 | A |\n|\
    \ 0.5 | 0.8 | A |\n| 0.7 | 0.5 | B |\n| 0.8 | 0.7 | B |\n| 0.8 | 0.5 | B |\n|\
    \ 0.8 | 0.6 | B |\n| 1.0 | 0.3 | B |\n| 1.0 | 0.5 | B |\n| 1.0 | 0.6 | B |\n\n\
    We will answer to the following questions:\n\na) Plot the data with different\
    \ colors/symbols for each class.\n\nb) Using kNN with `k = 1`, in which class\
    \ would you classify a new instance with values `(X1, X2) = (0.7, 0.4)`?\n\nc)\
    \ Repeat question (b) using `k = 5`.\n\nd) Using kNN with `k = 5`, in which class\
    \ would you classify a new instance with values `(X1, X2) = (0.7, 0.6)`?\n\n####\
    \ 5.2.1 Data and Library Imports\n\nInitially, we read the data and import the\
    \ required librares:\n\n```\nknndata = read.csv(\"knndata.txt\", stringsAsFactors\
    \ = TRUE)\nlibrary(class)\n```\n\n#### 5.2.2 Algorithm Application\n\nWe initially\
    \ split the dataset as follows:\n\n```\nX_train = knndata[,c(\"X1\",\"X2\")]\n\
    Y_train = knndata$Y\n```\n\nFor question (a) we execute the command:\n\n```\n\
    plot(X_train, col = Y_train, pch = c(\"o\",\"+\")[Y_train])\n```\n\n![](images/chapter5----knndata.png)\n\
    \nWhen `k = 1` (question (b)), we have to find the nearest instance (using euclidean\
    \ distance) to `(0.7, 0.4)`, which is `(0.7, 0.5)` that belongs to class B. So,\
    \ we execute the command:\n\n```\nknn(X_train, c(0.7, 0.4), Y_train, k = 1, prob\
    \ = TRUE)\n```\n\nand the new instance is classified to class B with probability\
    \ 1.\n\nWhen `k = 5` (question (c)), we have to find the 5 nearest instances to\
    \ `(0.7, 0.4)`, which are `(0.7, 0.5)`, `(0.8, 0.5)`, `(0.6, 0.6)`, `(0.8, 0.6)`,\
    \ `(0.7, 0.7)` and belong to classes B, B, A, B, A respectively. We note that\
    \ 3 of them (out of 5) belong to class B. We may execute the command:\n\n```\n\
    knn(X_train, c(0.7, 0.4), Y_train, k = 5, prob = TRUE)\n```\n\nand the new instance\
    \ is classified to class B with probability 0.6.\n\nFor question (d), we would\
    \ like to find the 5 nearest instances to `(0.7, 0.6)`. We observe that instances\
    \ `(0.7, 0.5)`, `(0.6, 0.6)`, `(0.8, 0.6)`, `(0.7, 0.7)` (that belong to classes\
    \ B, A, B, A respectively) all have the same distance from `(0.7, 0.6)`. Additionally,\
    \ the instances `(0.8, 0.7)` and `(0.8, 0.5)` (which belong to class B) have also\
    \ the same distance from `(0.7, 0.6)`. So (and since the parameter `use.all` of\
    \ kNN is `TRUE`), the algorithm will use all of these instances. We note that\
    \ 4 of them (out of 6) belong to class B. We may execute the command:\n\n```\n\
    knn(X_train, c(0.7, 0.6), Y_train, k = 5, prob = TRUE)\n```\n\nand the new instance\
    \ is classified to class B with probability 0.66.\n\n### 5.3 k-Nearest Neighbors\
    \ Real World Example\n\nIn this sub-section we will apply k-NN in the breast cancer\
    \ Wisconsin dataset.\n\n#### 5.3.1 Data Handling\n\nFirst we are going to load\
    \ the dataset as a dataframe. We are assuming that the current working directory\
    \ is in the same directory where the dataset is stored. We add the `sep` option\
    \ because the default separator is the empty string. In addition, as one can observe\
    \ from the dataset instructions, the missing values are denoted with `?`. To check\
    \ the documentation of the `read.table` function use the command `?read.table`.\
    \ Next we will split the dataset into training and validation datasets. The steps\
    \ for loading and splitting the dataset to training and validation are the following:\n\
    \n```\nrm(list=ls())\n# download the dataset\nfileURL <- \"http://archive.ics.uci.edu/ml/machine-learning-databases/breast-cancer-wisconsin.data\"\
    \ndownload.file(fileURL, destfile=\"breast-cancer.data\", method=\"curl\")\n#\
    \ read the data\ndata <- read.table(\"breast-cancer.data\", na.strings = \"?\"\
    , sep=\",\",AsFactors = TRUE)\n# remove id column\ndata <- data[,-1]\n# put names\
    \ in the columns (attributes)\nnames(data) <- c(\"ClumpThickness\",\"UniformityCellSize\"\
    ,\"UniformityShape\",\"MarginalAdhesion\",\"EpithelialSize\",\"BareNuclei\",\"\
    Chromatin\",\"NormalNuclei\",\"Mitoses\",\"Class\")\n# make the class a factor\n\
    data$Class <- factor(data$Class, levels=c(2,4), labels=c(\"benign\", \"malignant\"\
    ))\n# set the seed\nset.seed(123)\n# split the dataset\nind <- sample(2, nrow(data),\
    \ replace=TRUE, prob=c(0.7,0.3))\ntrainData <- data[ind==1,]\nvalidationData <-\
    \ data[ind==2,]\n```\n\n#### 5.3.2 Training & Prediction\n\nWe load the k-NN algorithm\
    \ as before.\n\n```\nlibrary(class)\n```\n\nBecause all attributes are between\
    \ 0 and 10 there is no need to do normalization between 0 and 1 since no attribute\
    \ will dominate the distance calculation of kNN. kNN accepts the training and\
    \ testing datasets without the target column, which puts in 3rd argument, we are\
    \ going to do some data manipulation to have the data the `knn` function likes\
    \ (look the manual with `knn`). Also, because no missing values are allowed in\
    \ kNN, let’s remove those.\n\n```\ntrainData <- trainData[complete.cases(trainData)]\n\
    validationData <- validationData[complete.cases(validationData)]\ntrainDataX <-\
    \ trainData[,-ncol(trainData)]\ntrainDataY <- trainData$Class\nvalidationDataX\
    \ <- validationData[,-ncol(validationData)]\nvalidationDataY <- validationData$Class\n\
    ```\n\nLets predict, since there is no need training using kNN. The training instances\
    \ are the model.\n\n```\nprediction = knn(trainDataX, validationDataX, trainDataY,\
    \ k = 1)\n```\n\nYou can play with the values of k to look for a better model.\n\
    \n#### 5.3.3 Evaluation\n\nMake the predictions for the validation dataset and\
    \ print the confusion matrix:\n\n```\ncat(\"Confusion matrix:\\n\")\nxtab = table(prediction,\
    \ validationData$Class)\nprint(xtab)\ncat(\"\\nEvaluation:\\n\")\naccuracy = sum(prediction\
    \ == validationData$Class)/length(validationData$Class)\nprecision = xtab[1,1]/sum(xtab[,1])\n\
    recall = xtab[1,1]/sum(xtab[1,])\nf = 2 * (precision * recall) / (precision +\
    \ recall)\ncat(paste(\"Accuracy:\\t\", format(accuracy, digits=2), \"\\n\", \"\
    \"))\ncat(paste(\"Precision:\\t\", format(precision, digits=2), \"\\n\", \"\"\
    ))\ncat(paste(\"Recall:\\t\\t\", format(recall, digits=2), \"\\n\", \"\"))\ncat(paste(\"\
    F-measure:\\t\", format(f, digits=2), \"\\n\", \"\"))\n```\n\nand the output:\n\
    \n```\n## Confusion matrix:\n##\n## prediction  benign malignant\n##   benign\
    \        99         4\n##   malignant      6        60\n##\n## Evaluation:\n##\
    \ Accuracy:     0.94\n## Precision:    0.94\n## Precision:    0.96\n## F-measure:\
    \    0.95\n```\n\n#### 5.3.4 Cross Validation\n\nFor performing cross-validation\
    \ we will use the `caret` package. [Here](https://cran.r-project.org/web/packages/caret/vignettes/caret.pdf)\
    \ you can find a quick guide to caret.\n\n##### 5.3.4.1 Split data in two groups\n\
    \nThe function `createDataPartition` does a stratified random split of the data.\
    \ Similar to what we did above ourselves (not stratified though). Then we will\
    \ use the `train` function to build the kNN model.\n\n```\nlibrary(caret)\nlibrary(mlbench)\n\
    data(Sonar)\nset.seed(107)\ninTrain <- createDataPartition(y = Sonar$Class, p\
    \ = .75, list = FALSE)\ntraining <- Sonar[ inTrain,]\ntesting <- Sonar[-inTrain,]\n\
    kNNFit <- train(Class ~ ., \n                data = training,\n              \
    \  method = \"knn\",\n                preProc = c(\"center\", \"scale\"))\nprint(kNNFit)\n\
    ```\n\n```\n## k-Nearest Neighbors \n##\n## 157 samples\n##  60 predictor\n##\
    \   2 classes: 'M', 'R' \n##\n## Pre-processing: centered (60), scaled (60) \n\
    ## Resampling: Bootstrapped (25 reps) \n## Summary of sample sizes: 157, 157,\
    \ 157, 157, 157, 157, ... \n## Resampling results across tuning parameters:\n\
    ##\n##   k  Accuracy   Kappa    \n##   5  0.7683412  0.5331399\n##   7  0.7559100\
    \  0.5053696\n##   9  0.7378175  0.4715006\n##\n## Accuracy was used to select\
    \ the optimal model using  the largest value.\n## The final value used for the\
    \ model was k = 5.\n```\n\nWe can also search for the best *k* value given the\
    \ training dataset.\n"
