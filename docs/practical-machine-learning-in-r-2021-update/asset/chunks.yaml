    | | x1 | x2 | x3 | x4 - x5 |\n| --- | --- | --- | --- | --- |\n| x1 | 0 | 7.21\
    \ | 6.32 | 5.39 |\n| x2 | 7.21 | 0 | 8.25 | 3.61 |\n| x3 | 6.32 | 8.25 | 0 | 8.06\
