    \ |\n| **3rd Qu.** | 11.88 | 11.38 | 27.44 | 11.48 |\n| **Max.** | 17.32 | 14.80\
    \ | 31.27 | 23.47 |\n\nThen, we will use the given dataset in order to answer\
    \ the following questions:\n\n(a) Plot the given dataset using a different color\
    \ for each cluster.\n"
