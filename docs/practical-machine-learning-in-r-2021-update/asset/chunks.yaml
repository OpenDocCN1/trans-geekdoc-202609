  trans: "\n\n![](img/chapter11----app_kMeans_plot.png)\n\n如我们所示，k-Means 无法充分将数据划分为不同的簇。这一结果源于\
    \ k-Means 依赖于欧式距离，因此无法区分具有复杂结构的簇。\n\n### 11.5.2 优化参数 eps\n\n为了优化 `DBSCAN` 算法的参数\
    \ `eps`（问题 (c）），我们将使用 `kNN` 距离。我们可以使用以下 R 命令来计算每个数据点与其最近 10 个邻居的距离：\n\n```\nknndist\
    \ = kNNdist(mdata, k = 10)\n```\n\n然后，在对数据进行升序排序后，绘制相应的图形：\n\n```\n# Plot distances\n\
    plot(sort(knndist), type = 'l', xlab = \"Points sorted by distance\",\n      \
    \                        ylab = \"10-NN distance\")\n```\n\n![](img/chapter11----app_kNN_dist.png)\n\
    \n为了优化 `eps`，我们遵循手肘线法（elbow method）。从图中可以看出，优化的 `eps` 值位于 [0.35, 0.45] 区间。\n\n\
    ### 11.5.3 使用 DBSCAN 建模\n\n最后，我们可以通过使用 `eps = 0.4` 和 `minPoints = 10` 在给定数据集上应用\
    \ `DBSCAN` 来回答问题 (d)。\n\n```\n# Construct DBSCAN model\nmodel = dbscan(mdata,\
    \ eps = 0.4, minPts = 10)\n\n# Plot distances\nplot(mdata, col = model$cluster\
    \ + 1, pch = ifelse(model$cluster, 1, 4))\n```\n\n下图描述了聚类结果。如我们所示，`DBSCAN` 能够有效地将给定数据集划分为簇。\n\
    \n![](img/chapter11----app_dbscan.png)\n\n# 第 12 章 - 基于分布的聚类\n\n### 12.1 理论背景\n\
    \n`基于分布的聚类`与统计学密切相关，它基于这样一个事实：簇可以被定义为最可能属于同一分布的数据实例集合。虽然应用于此类聚类的方法的理论基础非常优秀，但除非在模型复杂度中设置某些限制，否则它们会受到一个名为`过拟合`的关键问题的影响。更复杂的模型通常能够更好地解释数据，这使得选择合适的复杂度水平在本质上变得困难。一种突出且被广泛的方法被称为`高斯混合模型`（`Gaussian\
    \ Mixture Models`或`GMMs`，使用`期望极大化算法`或`EM`）。\n\n#### 12.1.1 期望极大化算法\n\n在统计学中，`期望-极大化\
    \ (EM)` 算法是一种迭代方法，用于寻找统计模型中参数（未观测隐性变量时）的极大似然估计或最大后验概率 (MAP) 估计，其中模型依赖于未观测的隐性变量。在实践中，`EM`\
    \ 算法使以下表达式最大化：\n\n![X: dataset, \\\\ \\\\ Z: latent \\\\ \\\\ variables, \\\\\
    \ \\\\ \\\\\\\\theta: set \\\\ \\\\ of \\\\ \\\\ parameters](img/leanpub_equation_85.png)![\\\
    \\ln{P(X/\\\\theta)} = \\\\ln{\\\\displaystyle\\\\sum\\_{Z}P(X, Z/\\\\theta)}](img/leanpub_equation_86.png)\n\
    \n`EM` 迭代在期望步（`E-step`）和极大步（`M-step`）之间交替：期望步利用当前参数估计创建一个对数似然期望的函数，而极大步则计算在`E-step`中找到的期望对数似然的参数。这些参数估计随后用于确定下一个\
    \ `E-step` 中隐性变量的分布。\n\n`E-step:`\n\n![Given \\\\ \\\\ \\\\theta_{old}: \\\\ \\\
    \\ find \\\\ \\\\ P(Z/X, \\\\theta_{old})](img/leanpub_equation_87.png)\n\n`M-step:`\n\
    \n![\\\\theta_{new} = argmax_{\\\\theta}(\\displaystyle\\\\sum\\_{Z}P(Z/X, \\\\\
    theta_{old}))](img/images88.png)\n\n当对数似然值不再更新或更新小于阈值时，`EM` 算法达到收敛。\n\n#### 12.1.2\
    \ 高斯混合模型 - GMMs\n\n`高斯混合模型`是一种概率模型，假设所有数据点都是由有限数量未知参数的高斯分布生成的。可以将混合模型看作是 `k-means`\
    \ 的推广，包含了关于数据的协方差结构以及高斯中心的信息。通常，`k` 个正态分布的混合由以下方程给出：\n\n![P(x) = \\displaystyle\\\
    \\sum\\_{k = 1}^K\\\\pi_{k}N(x/\\\\mu_{k}},\\\\Sigma_{k})](img/leanpub_equation_89.png)![where](img/leanpub_equation_90.png)![\\\
    \\pi_{k}: Mixing \\\\ Coefficients \\\\in [0, 1] and \\\\displaystyle\\\\sum\\\
    _{k = 1}^K\\\\pi_{k} = 1](images/leanpub_equation_91.png)![\\\\mu_{k}, \\\\Sigma_{k}\
    \ : Mean \\\\ Covariance \\\\ of distribution \\\\ k](img/leanpub_equation_92.png)![N(x/\\\
    \\mu, \\\\Sigma) = \\\\dfrac{1}{2\\\\pi^{n/2}}\\\\text{\\\\Sigma}\\\\text{\\}}^{1/2}}e^{-\\\
    frac{1}{2}(x- \\\\mu)^T\\\\Sigma^{-1}}](img/leanpub_equation_93.png)\n\n`GMMs`\
    \ 使用 `EM` 作为计算描述数据的分布隐性变量的优化算法。因此，在 `GMMs` 的情况下，`EM` 算法极大化以下量：\n\n![\\\\ln{P(X/\\\
    \\pi, \\\\mu, \\\\Sigma)} = \\\\displaystyle\\\\sum\\_{n = 1}^N\\\\ln(\\\\displaystyle\\\
    \\sum\\_{k = 1}^K\\\\pi_{k}N(x/\\\\mu_{k}},\\\\Sigma_{k}))](img/leanpub_equation_94.png)![where](img/leanpub_equation_95.png)\n\
    \n### 12.2 使用 EM 构建高斯混合模型\n\n为了使用 `GMMs` 进行聚类，我们将使用一个包含 1000 个来自不同分布的一维数据实例的数据集。关于这些分布，我们知道它们的标准差为\
    \ 1。数据的摘要如下表：\n\n| | D1_X | D2_X |\n| --- | --- | --- |\n| **Min.** | -1.905 |\
    \ 3.992 |\n| --- | --- | --- |\n| **1st Qu.** | 0.223 | 6.322 |\n| **Median**\
    \ | 0.907 | 6.944 |\n| **Mean** | 1.000 | 6.985 |\n| **3rd Qu.** | 1.664 | 7.681\
    \ |\n| **Max.** | 3.659 | 10.810 |\n\n使用上述数据，我们将回答以下问题：\n\n(a) 绘制数据（一维）以及概率密度函数，为每个分布使用不同的颜色。\n\
    \n(b) 计算每个正态分布的均值 (\\\\mu_1, ![\\\\mu_2](img/leanpub_equation_97.png))）和隐性变量 (\\\
    \\lambda_1, ![\\\\lambda_2](img/leanpub_equation_99.png))）。\n\n(d) 在同一图中绘制给定数据的估计和真实概率密度函数。\n\
    \n#### 12.2.1 数据绘图\n\n为了回答第一个问题，我们首先使用以下命令读取数据：\n\n```\n# Read data\ngdata = read.csv(\"\
    gdata.txt\")\n\n# Save 1D data in the vector x\nx = gdata[, 1]\n\n# Save cluster\
    \ index in the vector y\ny = gdata[, 2]\n```\n\n为了绘制数据以及概率密度函数，我们可以使用以下命令：\n\n\
    ```\n# Plot data\nplot(data.frame(x, 0), ylim = c(-0.01, 0.25), col = y, \n  \
    \                                    xlab = \"Data\",\n                      \
    \                ylab = \"Density\")\n\n# Plot probability density function\n\
    lines(density(x), col = y)\n```\n\n下图说明了给定数据集以及概率密度函数。来自每个簇的数据用不同的颜色（黑色和红色）表示。\n\
    \n![](img/chapter12----density.png)\n\n#### 12.2.2 正态分布参数的手动计算\n\n在本小节中，我们将使用给定数据集通过\
    \ `EM` 算法计算正态分布的参数。首先，我们将为参数选择随机初始值 ![\\\\mu](img/leanpub_equation_100.png)和 ![\\\
    \\lambda](img/leanpub_equation_101.png):\n\n"
- fmt: "\n![Initialization: \\mu\\_1 = 0 , \\mu\\_2 = 1, \\lambda\\_1 = 0.5, \\lambda\\\
    _2 = 0.5](images/leanpub_equation_102.png)![\\\\Theta = \\\\{ \\theta\\_1, \\\\\
    theta\\_2 \\\\} = \\\\{ (0, 1, 0.5),(1, 1, 0.5) \\\\}](images/leanpub_equation_103.png)\n\
    \n## E-step\n\nIn this step, we want to calculate the probability for a given\
    \ data point to originate from a certain normal distibution. This probability\
    \ is given by the following equation:\n\n![P(D\\_j/x\\_i, \\theta\\_j) = \\\\\
    dfrac{\\\\lambda\\_j \\cdot P(x\\_i / \\theta\\_j) }{ \\\\lambda\\_1 \\cdot P(x\\\
    _i / \\theta\\_1) + \\lambda\\_2 \\cdot P(x\\_i / \\theta\\_2)}](images/leanpub_equation_104.png)![where:\
    \ j = 1,2 \\\\ \\\\ \\\\ \\\\ \\lambda_{init} = \\{ \\lambda\\_1, \\lambda\\_2\
    \ \\\\} = \\{ 0.5, 0.5 \\\\}](images/leanpub_equation_105.png)\n\nAt this point,\
    \ we will compute the above probability for the given point ![x\\_i = 2](images/leanpub_equation_106.png):\n\
    \n![P(x\\_i/ \\theta\\_j) = \\\\dfrac{1}{\\\\sqrt{2\\pi\\sigma\\_j}}e^{-\\frac{(x\\\
    _i - \\mu\\_j)^2}{2 \\sigma\\_j}}](images/leanpub_equation_107.png)![P(2/ \\theta\\\
    _1) = \\\\dfrac{1}{\\\\sqrt{2\\pi \\cdot 1}}e^{-\\frac{(2 - 0)^2}{2 \\cdot 1}}\
    \ = \\\\dfrac{1}{\\\\sqrt{2\\pi}}e^{-2} = 0.054](images/leanpub_equation_108.png)![P(2/\
    \ \\theta\\_2) = \\\\dfrac{1}{\\\\sqrt{2\\pi \\cdot 1}}e^{-\\frac{(2 - 1)^2}{2\
    \ \\cdot 1}} = \\\\dfrac{1}{\\\\sqrt{2\\pi}}e^{-1/2} = 0.242](images/leanpub_equation_109.png)\n\
    \nThe probabilities of the given point to originate from distributions 1 and 2\
    \ are given by the following two equations:\n\n![P(D\\_1/2, \\theta\\_1) = \\\\\
    dfrac{0.5 \\cdot 0.054}{0.5 \\cdot 0.054 + 0.5 \\cdot 0.242} = 0.182](images/leanpub_equation_110.png)![P(D\\\
    _2/2, \\theta\\_2) = \\\\dfrac{0.5 \\cdot 0.242}{0.5 \\cdot 0.054 + 0.5 \\cdot\
    \ 0.242} = 0.818](images/leanpub_equation_111.png)\n\nGiven the aforementioned\
    \ results, the point ![x\\_i = 2](images/leanpub_equation_112.png) originates\
    \ from distribution 1 with probability 0.182 and from distribution 2 with probability\
    \ 0.818. Once having computed the aforementioned probabilities for all 1,000 data\
    \ points, we will proceed in the maximization step of EM.\n\n## M-step\n\nIn this\
    \ step, we will calculate the parameters `mu_1`, `mu_2`(images/leanpub_equation_113.png)\
    \ that maximize the probabilities `P(D\\_1/X\\_i, \\theta\\_1)`, `P(D\\_2/X\\\
    _i, \\theta\\_2)`(images/leanpub_equation_114.png). In order to compute the parameters\
    \ `mu_1`, `mu_2`(images/leanpub_equation_115.png), we will use the following equations:\n\
    \n![mu\\_1 = \\\\dfrac{\\\\sum_{i=1}^{1000} x\\_i \\cdot P(D\\_1/x\\_i, \\theta\\\
    _1)}{\\\\sum_{i=1}^{1000} P(D\\_1/x\\_i)}](images/leanpub_equation_116.png)![mu\\\
    _2 = \\\\dfrac{\\\\sum_{i=1}^{1000} x\\_i \\cdot P(D\\_2/x\\_i, \\theta\\_2)}{\\\
    \\sum_{i=1}^{1000} P(D\\_2/x\\_i)}](images/leanpub_equation_117.png)\n\nThe above\
    \ equations calculate the weighted average of all data points, where the weights\
    \ are actually the probabilities for each data point to originate from one of\
    \ the two distributions.\n\nThe mixing coefficients are given by the following\
    \ equations:\n\n![lambda\\_1 = \\\\dfrac{\\\\sum_{i=1}^{1000} P(D\\_1/x\\_i, \\\
    theta\\_1)}{1000}](images/leanpub_equation_118.png)![lambda\\_2 = \\\\dfrac{\\\
    \\sum_{i=1}^{1000} P(D\\_2/x\\_i, \\theta\\_2)}{1000}](images/leanpub_equation_119.png)\n\
    \nAfter computing the values of the parameters `mu_1`, `mu_2`, `lambda_1`, `lambda_2`(images/leanpub_equation_120.png),\
    \ the log-likelihood of the given dataset is given by the following equation:\n\
    \n![ln({P(X/\\theta)}) = \\\\displaystyle\\\\sum_{i = 1}^{1000}\\\\ln(\\\\sum_{j\
    \ = 1}^2\\\\lambda_{j} \\\\cdot P(x\\_i/\\\\theta\\_j))](images/leanpub_equation_121.png)![=\
    \ \\\\displaystyle\\\\sum_{i = 1}^{1000}\\\\ln(\\\\lambda_{1} \\\\cdot P(x\\_i/\\\
    \\theta\\_1) + \\\\lambda_{2} \\\\cdot P(x\\_i/\\\\theta\\_2))](images/leanpub_equation_122.png)\n\
    \nOnce having computed the log-likelihood of the dataset, we compare it with the\
    \ value of the previous iteration. If the value has not changed more than a given\
    \ threshold (`epsilon`), the algorithm converges. Otherwise, we return back in\
    \ the E-step to re-calculate the parameters values and continue the execution.\n\
    \n### Calculating the parameters of the normal distributions using R\n\nThe R\
    \ algorithm that enables us to compute the parameters of the normal distributions\
    \ is the following and involves two main steps, the initialization and the loop\
    \ until convergence:\n\n* **Step 1: Initialize the means and the latent variables**\n\
    \n```r\n# Initialize means\nmu = c(0, 1)\n\n# Initialize lambdas\nlambda = c(0.5,\
    \ 0.5)\n\n# Set stopping criterion \nepsilon = 1e-08\n\n# Compute initial log-likelihood\n\
    log_likelihood = sum(log(lambda[1] * dnorm(x, mean = mu[1], sd = 1) + \n     \
    \                 lambda[2] * dnorm(x, mean = mu[2], sd = 1)))\n```\n\n* **Step\
    \ 2: Loop until convergence**\n\n```r\nrepeat {\n  # ------ Expectation step\n\
    \    # Find distributions given mu, lambda (and sigma)\n    T1 <- dnorm(x, mean\
    \ = mu[1], sd = 1)\n    T2 <- dnorm(x, mean = mu[2], sd = 1)\n    P1 <- lambda[1]\
    \ * T1 / (lambda[1] * T1 + lambda[2] * T2)\n    P2 <- lambda[2] * T2 / (lambda[1]\
    \ * T1 + lambda[2] * T2)\n\n  # ------ Maximization step\n    # Find mu, lambda\
    \ (and sigma) given the distributions\n    mu[1] <- sum(P1 * x) / sum(P1)\n  \
    \  mu[2] <- sum(P2 * x) / sum(P2)\n    lambda[1] <- mean(P1)\n    lambda[2] <-\
    \ mean(P2)\n    \n    # Calculate the new log likelihood (to be maximized)\n \
    \   new_log_likelihood = sum(log(lambda[1] * dnorm(x, mean = mu[1], sd = 1) +\
    \ \n                              lambda[2] * dnorm(x, mean = mu[2], sd = 1)))\n\
    \    \n    # Print the current parameters and log likelihood\n    cat(\"mu =\"\
    , mu, \" lambda =\", lambda, \" loglikelihood =\", new_log_likelihood, \"\\n\"\
    )\n    \n    # Break if the algorithm converges\n    if (new_log_likelihood -\
    \ log_likelihood <= epsilon) break\n    log_likelihood = new_log_likelihood\n\
    }\n```\n\n#### GMMs model using mixtools\n\nIn order to answer (c), we will construct\
    \ a GMM model using R. The library we are going to use is:\n\n```r\nlibrary(mixtools)\n\
    ```\n\nWe can use the expectation maximization (EM) algorithm and overview the\
    \ final parameters using the following:\n\n```r\n# Apply EM using the aforementioned\
