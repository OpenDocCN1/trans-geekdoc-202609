    \nR 中的函数在不同的包（packages）之间共享。最基础的包如“base”、“utils”、“graphics” 和 “stats”在启动时会自动导入，它们包含了一些最常用的函数。然而，还有许多实用的函数需要用户下载并导入一些额外的包。这可以通过\
