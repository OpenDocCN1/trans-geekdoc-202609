    \ns)\ncat(paste(\"Accuracy:\\t\", format(accuracy, digits=2), \"\\n\",sep=\" \"\
    ))\n```\n\n```\n## Accuracy:     0.97\n```\n\n```\ncat(\"Confusion matrix PCA:\\\
    n\")\n```\n\n```\n## Confusion matrix PCA:\n```\n\n```\nxtab = table(prediction_pca,\
    \ validationData$Species)\nprint(xtab)\n```\n\n```\n##               \n## prediction_pca\
    \ setosa versicolor virginica\n##     setosa         10          0         0\n\
    ##     versicolor      0         10         3\n##     virginica       0      \
    \    2        13\n```\n\n```\ncat(\"\\nEvaluation PCA:\\n\\n\")\n```\n\n```\n\
    ## \n## Evaluation PCA:\n```\n\n```\naccuracy = sum(prediction_pca == validationData$Species)/length(validationData$Sp\\\
    \necies)\ncat(paste(\"Accuracy PCA:\\t\", format(accuracy, digits=2), \"\\n\"\
    ,sep=\" \"))\n```\n\n```\n## Accuracy PCA:     0.87\n```\n\nEven though the validation\
    \ dataset is small, one can observe that using 50% less predictor attributes,\
    \ the algorithm made only 4 extra mistakes. Of course in real world scenarios,\
    \ cross-validation should be used with such small datasets.\n\n#### 8.2.3 PCA\
    \ for Plotting\n\nUsing the PCA we can also plot in 2 dimensions, high-dimensional\
    \ data, by using just the first two components.\n\n```\nplot(train.pca$x[trainData$Species\
    \ == 'setosa',1:2], col=\"blue\", ylim = c(-3, 3),\\\n xlim=c(-3,3), asp=1)\n\
    points(train.pca$x[trainData$Species == 'versicolor',1:2], pch = 3, col=\"red\"\
    )\npoints(train.pca$x[trainData$Species == 'virginica',1:2], pch = 4, col=\"green\"\
    )\n```\n\n![](images/chapter8----pca-2d.png)\n\nIn this case the PCA is not the\
    \ best method for dimensionality reduction to improve the accuracy. From the plot\
    \ one cas observe that the `versicolor` and `virginica` species are intermixed\
    \ in 2D and thus the k-NN algorithm will have trouble classifying between the\
    \ two.\n\n# Part III - Clustering\n\n## Chapter 9 - Centroid-based Clustering\
    \ and Evaluation\n\n***Centroid-based clustering*** is a subset of clustering\
    \ techniques where clusters are represented by a central vector, which may not\
    \ necessarily be a member of the data set. When the number of clusters is fixed\
    \ to a given number ***k***, k-Means clustering gives a formal definition of the\
    \ following optimization problem:\n\nGiven a dataset containing `N` samples:\n\
    \n![X = \\\\{x\\_1, x\\_2, x\\_3, \\\\dots , x\\_N\\\\}](images/leanpub_equation_39.png)\n\
    \nand `K` as the number of selected clusters:\n\n![Clusters: \\\\{C\\_1, C\\_2,\
    \ \\\\dots , C\\_K\\\\} \\\\ \\\\ \\\\ \\\\ with \\\\ \\\\ \\\\ \\\\ Centers:\
    \ \\\\{m\\_1, m\\_2, \\\\dots , m\\_K\\\\}](images/leanpub_equation_40.png)\n\n\
    ***k-Means Algorithm Purpose:*** Find the distribution of all samples among clusters\
    \ so as to minimize the sum of squares of the distances between each sample and\
    \ the center of the cluster it belongs. This metric corresponds to the ***Within\
    \ cluster Sum of Squares â€“ WSS or SSE*** and is given by the following formula:\n\
    \n![SSE={\\\\displaystyle\\\\sum\\_{i-1}^K\\\\displaystyle\\\\sum\\_{x \\\\in\
    \ C\\_i}\\\\text{\\\\textbardbl}x - m\\_{i}\\\\text{\\\\textbardbl}^2}](images/leanpub_equation_41.png)\n\
    \nIn order to solve the aforementioned optimization problem, k-Mean algorithm\
    \ involves two distinc steps:\n\n1.  Given certain centers, formulate clusters\
    \ by assigning each sample to the closest cluster\n\n2.  Calculate the new centers\
    \ based on the formulate clusters\n\nIn the initialization step, the algorithm\
    \ randomly selects `K` samples as the initial centers and then using these centers\
    \ assigned each sample in the closest cluster. Once every sample has been assigned\
    \ to a certain cluster, the new center of each cluster is calculated as the mean\
    \ of every sample that belongs to the cluster. This iterative process is continuoued\
    \ until there is no change in the clusters in to consecutive iterations.\n\nThe\
    \ most famous and used variation of the k-Means algorithm is ***k-Medoids***,\
    \ which is mainly used for categorical data and allows the use of various different\
    \ distance functions. It is worth noticing that unlike k-Means, k-Medoids always\
    \ uses a certain sample as the ***medoid*** of each cluster.\n\n### 9.1 k-Means\
    \ in R\n\nFor performing k-Means clustering in R, we can use the following command:\n\
    \n```\n# Perform k-Means to form 3 clusters\nmodel = kmeans(data, centers = 3)\n\
    ```\n\nThe `centers` parameter can either take the number of the initial centers\
    \ (and thus the number of clusters) or the centers themselves as argument.\n\n\
    We can use the following commands in order to show the final centroids and the\
    \ distribution of the samples into the formulated clusters:\n\n```\n# Get centroids\n\
    model$centers\n\n# Get distribution of samples into clusters\nmodel$cluster\n\
    ```\n\n### 9.2 k-Medoids in R\n\nIn order to perform k-Medoids clustering in R,\
    \ we need to import the library cluster:\n\n```\nlibrary(cluster)\n```\n\nand\
    \ then we can use the following command:\n\n```\n# Perform k-Medoids to form 3\
    \ clusters\nmodel = pam(conferences, 3)\n```\n\nWe can use the following commands\
    \ in order to show the final medoids and the distribution of the samples into\
    \ the formulated clusters:\n\n```\n# Get centroids\nmodel$medoids\n\n# Get distribution\
    \ of samples into clusters\nmodel$clustering\n```\n\nIf the dataset contains categorical\
    \ variables, then we can show the medoids using the respective variable with the\
    \ following command:\n\n```\ndata[model$id.med,]\n```\n\n### 9.3 Clustering Evaluation\
    \ in R\n\nIn order to evaluate our clustering in R, we can use the library cluster\
    \ which enables us to easily calculate several evaluation metrics. Once we have\
    \ perform the clutering and get the final distribution of the samples into the\
    \ clusters, then we can compute a list of metrics that enable us evaluate the\
    \ result. Some of those metrics are the following:\n\n*   ***Cohesion (or within-cluster\
    \ sum of squares)***\n\n![WSS={\\\\displaystyle\\\\sum\\_{i-1}^K\\\\displaystyle\\\
    \\sum\\_{x \\\\in C\\_i}\\\\text{\\\\textbardbl}x - m\\_{i}\\\\text{\\\\textbardbl}^2}](images/leanpub_equation_42.png)\n\
    \n*   ***Separation (or between-cluster sum of squares)***\n\n![BSS={\\\\displaystyle\\\
    \\sum\\_{i-1}^K\\\\text{\\\\textbar}C\\_i\\\\text{\\\\textbar}\\\\text{\\\\textbardbl}m\
    \ - m\\_{i}\\\\text{\\\\textbardbl}^2}](images/leanpub_equation_43.png)\n\n* \
    \  ***Silhouette coefficient***\n\n![Silhouette(i) = \\\\dfrac{b(i) - a(i)}{max\\\
    \\{ a(i), b(i) \\\\} }](images/leanpub_equation_44.png)\n\nwhere `a(i)` is the\
    \ average distance between the `i-th` sample and all other samples within the\
    \ same cluster and `b(i)` is the lowest average distance of the `i-th` sample\
    \ to all samples in any other clusters, of which `i` is not a member.\n\nWe can\
    \ compute the aforementioned metrics using the following R commands:\n\n```\n\
    # Compute WSS\ncohesion = model$tot.withinss\n\n# Compute BSS\nseparation = model$betweenss\n\
    \n# Compute Silhouette\nmodel_silhouette = silhouette(model$cluster, dist(data))\n\
    ```"
