    \n### 9.5 k-Means clustering and evaluation in real life Application\n\nIn this\
    \ section, we are going to demonstrate the application of k-Means algorithm in\
    \ a real life application. In this context, we have a dataset that contains 300\
    \ different 2D data points that originate from three different distributions.\
    \ A summary of the dataset is given in the following table:\n\n| | X1 | X2 |\n\
    | --- | --- | --- |\n| **Min.** | -4.720 | -3.974 |\n| **1st Qu.** | -1.237 |\
    \ -1.059 |\n| **Median** | 1.757 | 2.096 |\n| **Mean** | 1.322 | 1.532 |\n| **3rd\
    \ Qu.** | 3.592 | 3.675 |\n| **Max.** | 6.077 | 6.689 |\n\nWe will use the aforementioned\
    \ data in order to answer the following questions:\n\n(a) Plot the data using\
    \ a different color for each cluster, apply the k-Means algorithm and identify\
    \ the optimal number of clusters based on the SSE metric.\n\n(b) Apply k-Means\
    \ in order to formulate 3 clusters (plot the outcome using a different color for\
    \ each cluster along with the centroids) and compute the cohesion and the separation.\n\
    \n(c) Calculate silhouette coeffiecient and create the silhouette plot.\n\n(d)\
    \ Plot the heatmap for the clustered data.\n\n#### 9.5.1 Identify optimal number\
    \ of clusters\n\nAt first, we will read the given dataset using the following\
    \ commands:\n\n```r\n# Import cluster library \nlibrary(cluster)\n\n# Read data\n\
    cdata = read.csv(\"cdata.txt\")\n\n# The third column contains the cluster for\
    \ each data point\n```\n\nTo determine the optimal number of clusters, we will\
