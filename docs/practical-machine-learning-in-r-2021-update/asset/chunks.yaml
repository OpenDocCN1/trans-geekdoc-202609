- fmt: "\nR is an open source programming language and a free environment, mainly\
    \ used for statistical computing and graphics. You can find information about\
    \ R in the [official website](https://www.r-project.org/). By searching with the\
    \ keyword `R` with other topic-specific words in sites like Google, one can find\
    \ additional information from sites, blog posts, tutorials, documents etc.\n\n\
    Even through R comes with its own environment: command line and graphical interfaces,\
    \ one can use the popular [RStudio](https://www.rstudio.com/), which offers additional\
    \ graphical functionalities.\n\nWhen in the R environment (the R prompt is `>`)\
    \ one can exit by calling the `quit()` function or `q()` for short. When asked\
    \ if you want to save the workspace, if you reply with a `y` for yes, all the\
    \ variables that you have during the current R session will be saved into a file\
    \ named `.Rdata`, in the current working directory. If you later start R in the\
    \ same directory, the variables and their names will be automatically loaded.\n\
    \nFunctions in R are shared among packages. The most basic packages, like “base”,\
    \ “utils”, “graphics” and “stats”, are automatically imported during startup and\
    \ they include some of the most used functions. However, there are a lot of useful\
    \ functions, for which the user has to download and import some additional packages.\
    \ This can be easily accomplished with the RStudio gui. For example, in order\
    \ to download the package “e1071”, which contains useful functions about SVM,\
    \ one can click at “Packages” -> “Install Packages” and type the desired package\
    \ name. From the same menu, one can import the packages that are needed. The same\
    \ operations can be accomplished with the commands `install.packages(\"e1071\"\
    )` and `library(\"e1071\")` for downloading and importing the package “e1071”\
