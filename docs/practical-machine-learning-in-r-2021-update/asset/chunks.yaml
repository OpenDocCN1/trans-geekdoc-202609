    构建模型需要执行 `naiveBayes` 命令：


    ```

    model <- naiveBayes(Target ~ ., data = ..., laplace = ...)

    ```


    其中参数 `laplace` 用于选择拉普拉斯平滑（laplace smoothing）。


    在给定一个训练好的模型，我们可以使用以下命令预测新实例的类别：


    ```

    predict(model, trvalue)

    ```


    而如果我们进一步添加参数 `type = "raw"`，我们还将获得后验概率。


    ### 4.2 朴素贝叶斯模型的构建与分类


    我们将使用下表的数据来解决一个二分类问题：


    | 天气 (Weather) | 天数 (Day) | 高流量 (HighTraffic) |

    | --- | --- | --- |

    | Hot | Vacation | No |

    | Cold | Work | Yes |

    | Normal | Work | No |

    | Cold | Weekend | Yes |

    | Normal | Weekend | Yes |

    | Cold | Work | No |

    | Hot | Work | No |

    | Hot | Vacation | Yes |


    我们将回答以下问题：


    a) 使用朴素贝叶斯分类器，对于值为 `(Weather, Day) = (Hot, Vacation)` 的新实例，你会将其归为哪一类？


    b) 使用朴素贝叶斯分类器，对于值为 `(Weather, Day) = (Hot, Weekend)` 的新实例，你会将其归为哪一类？


    c) 使用拉普拉斯平滑重复问题 (b)。


    d) 在 R 中构建完整的模型并重复问题 (a)。


    e) 在 R 中使用拉普拉斯平滑构建完整的模型并重复问题 (b)。


    #### 4.2.1 数据读取与库（Library）的导入


    最初，我们读取数据并导入所需的库：


    ```

    traffic = read.csv("traffic.txt", stringsAsFactors = TRUE)

    library(e1071)

    ```


    #### 4.2.2 概率计算


    对于问题 (a)，我们使用以下公式计算概率：


    ![P(Yes|Hot,Vacation) = \frac{ P(Hot|Yes) \cdot P(Vacation|Yes) \cdot P(Yes) }{
    P(Hot) \cdot P(Vacation) } = \frac{ 1/4 \cdot 1/4 \cdot 1/2 }{ 3/8 \cdot 2/8 }
    = 1/3](img/leanpub_equation_24.png)![P(No|Hot,Vacation) = \frac{ P(Hot|No) \cdot
    P(Vacation|No) \cdot P(No) }{ P(Hot) \cdot P(Vacation) } = \frac{ 2/4 \cdot 1/4
    \cdot 1/2 }{ 3/8 \cdot 2/8 } = 2/3](img/leanpub_equation_25.png)


    由于 ![P(No|Hot,Vacation) > P(Yes|Hot,Vacation)](img/leanpub_equation_26.png)，算法将该实例分类为
    No。


    同样地，对于问题 (b)：


    ![P(Yes|Hot,Weekend) = \frac{ P(Hot|Yes) \cdot P(Weekend|Yes) \cdot P(Yes) }{
    P(Hot) \cdot P(Weekend) } = \frac{ 1/4 \cdot 2/4 \cdot 1/2 }{ 3/8 \cdot 2/8 }
    = 2/3](img/leanpub_equation_27.png)![P(No|Hot,Weekend) = \frac{ P(Hot|No) \cdot
    P(Weekend|No) \cdot P(No) }{ P(Hot) \cdot P(Weekend) } = \frac{ 2/4 \cdot 0/4
    \cdot 1/2 }{ 3/8 \cdot 2/8 } = 0](img/leanpub_equation_28.png)


    由于 ![P(No|Hot,Weekend) < P(Yes|Hot,Weekend)](img/leanpub_equation_29.png)，算法将该实例分类为
    Yes。


    关于问题 (c)，我们将重新计算概率，但添加了 `1` 作为拉普拉斯参数。因此，给定新的概率为 ![P(Hot|Yes) = (1 + 1)/(4 + 3)
    = 2/7](img/leanpub_equation_30.png)，![P(Weekend|Yes) = (2 + 1)/(4 + 3) = 3/7](img/leanpub_equation_31.png),
    ![P(Hot|No) = (2 + 1)/(4 + 3) = 3/7](img/leanpub_equation_32.png), 以及 ![P(Weekend|No)
    = (0 + 1)/(4 + 3) = 1/7](img/leanpub_equation_33.png)，我们计算：


    ![P(Yes|Hot,Weekend) = \frac{ P(Hot|Yes) \cdot P(Weekend|Yes) \cdot P(Yes) }{
    P(Hot) \cdot P(Weekend) } = \frac{ 2/7 \cdot 3/7 \cdot 1/2 }{ 3/8 \cdot 2/8 }
    = 32/49](img/leanpub_equation_34.png)![P(No|Hot,Weekend) = \frac{ P(Hot|No) \cdot
    P(Weekend|No) \cdot P(No) }{ P(Hot) \cdot P(Weekend) } = \frac{ 3/7 \cdot 1/7
    \cdot 1/2 }{ 3/8 \cdot 2/8 } = 16/49](img/leanpub_equation_34.png)


