    \ = \"boot\"))\nknnPredict2 <- predict(knnFit5, newdata = testing)\n#Get the confusion\
    \ matrix to see accuracy value and other parameter values\nconfusionMatrix(knnPredict2,\
    \ testing$Class)\n```\n\n```\n## Confusion Matrix and Statistics\n## \n##    \
    \       Reference\n## Prediction  M  R\n##          M 25  9\n##          R  2\
    \ 15\n##                                           \n##                Accuracy\
    \ : 0.7843          \n##                  95% CI : (0.6468, 0.8871)\n##     No\
    \ Information Rate : 0.5294          \n##     P-Value [Acc > NIR] : 0.0001502\
    \       \n##                                           \n##                  \
    \ Kappa : 0.56            \n##  Mcnemar's Test P-Value : 0.0704404       \n##\
    \                                           \n##             Sensitivity : 0.9259\
    \          \n##             Specificity : 0.6250          \n##          Pos Pred\
    \ Value : 0.7353          \n##          Neg Pred Value : 0.8824          \n##\
    \              Prevalence : 0.5294          \n##          Detection Rate : 0.4902\
    \          \n##    Detection Prevalence : 0.6667          \n##       Balanced\
    \ Accuracy : 0.7755          \n##                                           \n\
    ##        'Positive' Class : M               \n## \n```\n\n## Chapter 6 - Classification\
    \ with Support Vector Machines\n\n### 6.1 Introduction\n\n#### 6.1.1 Introduction\
    \ to Support Vector Machines\n\nSupport Vector Machines (SVM) constitute an algorithm\
    \ that finds a linear hyperplane that separates the data. The problem can be defined\
    \ as maximizing the distance between the hyperplane and the data (margin):\n\n\
    Maximize ![Margin = 2 / ||w^2||](images/leanpub_equation_37.png)given that ![f(x)=\
    \ \\\\{1 if w \\\\cdot x + b \\\\geq 1, -1 if w \\\\cdot x + b \\\\leq 1\\\\}](images/leanpub_equation_38.png)\n\
    \nIf the data are not linearly separable, then they can be mapped to a space of\
    \ different (usually larger) dimensionality, in order to make them linearly separable.\n\
    \n#### 6.1.2 Support Vector Machines in R\n\nWe may use the e1071 library to build\
    \ an SVM model in R:\n\n```\nlibrary(e1071)\n```\n\nWe can execute the command\
    \ `svm` to build a model:\n\n```\nmodel = svm(y ~ ., data, kernel = \"radial\"\
    , type = \"C-classification\")\n```\n\nwhere parameter `kernel` controls which\
    \ kernel is going to be used (one of `linear`, `polynomial`, `radial`), while\
    \ we may also define more parameters for each kernel, such as `degree`, `gamma`,\
    \ `coef0`. By executing `?svm`, we can see all the parameters."
