    ytest = testingdata[,1]\npred = predict(model, xtest)\npredprob = predict(model,\
    \ xtest, type = \"raw\")\n```\n\n#### 4.3.2 Metrics Computation and ROC Curve\
    \ Plotting\n\nWe can see the confusion matrix and calculate useful metrics with\
    \ the following commands (question (b)):\n\n```\nConfusionMatrix(pred, ytest)\n\
    Precision(ytest, pred, \"democrat\")\nRecall(ytest, pred)\n```\n\nPlotting the\
    \ ROC curve (question (c)) initially requires computing TPR and FRP with the following\
    \ commands:\n\n```\npred_obj = prediction(predprob[,1], ytest, label.ordering\
    \ = c(\"republican\", \"demo\\\ncrat\"))\nROCcurve <- performance(pred_obj, \"\
    tpr\", \"fpr\")\n```\n\nIf we plot the `ROCcurve` object, we shall see TPR and\
    \ FRP and the corresponding thresholds.\n\nFinally, we can plot the curve as follows:\n\
    \n```\nplot(ROCcurve, col = \"blue\")\nabline(0,1, col = \"grey\")\n```\n\nAnd\
    \ find the area under the curve using the command:\n\n```\nperformance(pred_obj,\
    \ \"auc\")\n```\n\n![](images/chapter4----roc_curve.png)\n\n## Chapter 5 - Classification\
    \ with k-Nearest Neighbors\n\n### 5.1 Introduction\n\n#### 5.1.1 Introduction\
    \ to k-Nearest Neighbors\n\nk-Nearest Neighbors (kNN) is a machine learning algorithm,\
    \ where the prediction for a new instance depends on its k nearest instances.\
    \ As a result, the class for a new instance is determined by majority vote given\
    \ the class of its k nearest instances.\n\n#### 5.1.2 k-Nearest Neighbors in R\n\
    \nWe may use the class library to apply the kNN model in R:\n\n```\nlibrary(class)\n\
    ```\n\nA new instance may be classified using the command `knn`:\n\n```\nknn(X_train,\
    \ X_test, Y_train, k = 1, prob = TRUE)\n```\n\nwhere we have to provide the training\
    \ data (`X_train`, `Y_train`), the new instances (`X_test`), and the value of\
    \ k. If we also add the parameter `prob = TRUE`, then the probabilities for the\
    \ class are also given."
