    ## Chapter 2 - Introduction to Machine Learning


    ### 2.1 Definition


    **Machine Learning** (ML) is a subset of Artificial Intelligence (AI) that uses
    statistical techniques to give computers the ability to “learn” without being
    explicitly programmed. Machine Learning is often related to **Data Mining** (*the
    process of discovering patterns in large datasets), **Pattern Recognition**, **Statistical
    Inference**, and **Machine Learning** itself (the goal is to improve performance).


    ### 2.2 Main categories and tasks


    The main ML tasks are typically classified into two broad categories, depending
    on whether there is “teacher” available:


    *   **Supervised Learning**: The system is presented with examples and desired
    outputs, the learner must produce a mapping that assigns inputs to one or more
    classes. This is typically tackled in a supervised manner. Spam filtering is an
    example of classification, where the inputs are messages and the classes are “spam”
    and “not spam”.

    *   **Regression**: also a supervised problem, the outputs are continuous rather
    than discrete.

    *   **Unsupervised Learning**: a set of inputs is to be divided into groups. Unlike
    classification, the groups are not known beforehand, making this typically an
    unsupervised task. **Dimensionality Reduction** simplifies inputs by mapping them
    into a lower-dimensional space.


    * **Association Rules learning** (or dependency modelling): Searches for relationships
    between inputs. For example, a supermarket might gather data on customer purchasing
    habits. Using association rule learning, the supermarket can determine which products
    are frequently bought.


    ### 2.3 Survival guide to machine learning


    So you are given a problem. With what methodology are you going to approach it?


    First of all you have to understand the problem you are trying to solve with the
    data you have (or you are given) and ML algorithms. Is the problem defined formally?
    Unformally? Both? Are there any assumptions that need to be made? How one can
    go and solve it without ML? What is the motivation behind solving the problem?


    The next step is to prepare the data to be used by your favorite ML algorithms
    since usually data do not come with the format you need or have other problems.
    One should consider:

    1. what data are available,

    2. if there are any missing values,

    3. if any data need to be removed (for example the student ID, which does not
    have any predictive value, if we want to predict the average GPA of the student
    by the end of the semester),

    4. to be organized, cleaned and sampled and 5. to be transformed either to other
    values due to domain knowledge (for example image pixel values to average image
    intensity or symmetry).

