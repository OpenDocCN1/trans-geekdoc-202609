    \ log2(freq[\"Yes\"])\n```\n\n然后，对于天气，我们构建了以下频率数组：\n\n```\nabsfreq = table(weather[,\
    \ c(1, 4)])\nfreq = prop.table(absfreq, 1)\nfreqSum = rowSums(prop.table(absfreq))\
    \ \n```\n\n我们计算了晴天和雨天的熵：\n\n```\nEntropy_Sunny = \n    - freq[\"Sunny\", \"No\"\
    ] * log2(freq[\"Sunny\", \"No\"]) \n    - freq[\"Sunny\", \"Yes\"] * log2(freq[\"\
    Sunny\", \"Yes\"])\nEntropy_Rainy = \n    - freq[\"Rainy\", \"No\"] * log2(freq[\"\
    Rainy\", \"No\"]) \n    - freq[\"Rainy\", \"Yes\"] * log2(freq[\"Rainy\", \"Yes\"\
    ])\n```\n\n天气的总信息增益计算方式为：\n\n```\nGAIN_Outlook =\n    Entropy_All\n    - freqSum[\"\
    Sunny\"] * Entropy_Sunny\n    - freqSum[\"Rainy\"] * Entropy_Rainy\n```\n\n###\
    \ 3.2.3 构建决策树\n\n对于 (c)，我们使用 `rpart` 构建决策树：\n\n```\nmodel <- rpart(\n    Play\
    \ ~ Outlook + Humidity, \n    method = \"class\",\n    data = weather,\n    minsplit\
    \ = 1,\n    cp = -1)\n```\n\n此外，我们可以使用以下命令绘制树：\n\n```\nrpart.plot(model, extra\
    \ = 10, nn = TRUE)\n```\n树所示：images/decision_tree.png\n\n### 3.3 剪枝与评估指标\n\n决策树分类器也可以应用于具有连续变量的数据集，例如\
    \ `iris` 数据集。从 `iris` 数据集中，我们只保留前两列并丢弃最后 50 个实例，因此我们现在有一个预测特征和一个目标的二分类问题。我们可以在\
    \ R 中进行这些转换：\n\n```\niris2 = iris[, c(1, 2)]\niris2$Species = factor(iris$Species[1:100],\
    \ levels=levels(iris$Species))\n```\n\n之后，我们将数据集分为训练数据和测试数据：\n\n```\ntrainingdata\
    \ = iris2[c(1:40, 51:90),]\ntestdata = iris2[c(41:50),]\n```\n\n回答以下问题：\n\na)\
    \ 使用训练数据构建决策树（`rpart` 的 `minsplit` 参数设置为 20）。\nb) 将模型应用于 `testdata` 并计算精确率 (precision)、召回率\
    \ (recall) 和 F 分数 (f-measure)。\nc) 构建两个决策树，一个 `minsplit` 等于 10，另一个 `minsplit`\
    \ 等于 30，将它们应用于 `testdata` 并计算精确率、召回率和 F 分数。\nd) 比较三个模型对于 `versicolor` 类的 F 分数。\n\
    \n#### 3.3.1 决策树的训练与测试\n\n我们使用以下命令训练并绘制决策树：\n\n```\nmodel <- rpart(\n    Species\
    \ ~ ., \n    method = \"class\",\n    data = trainingdata,\n    minsplit = 20)rpart.plot(model,\
    \ extra = 10, nn = TRUE)\n```\n公式中的 `.` 代表 `trainingdata` 中的所有剩余变量。我们也可以在测试集上执行模型：\n\
    \n```\nxtest = testdata[,1:2]\nytest = testdata[,3]\npred = predict(model, xtest,\
    \ type=\"class\")\n```\n\n#### 3.3.2 评估指标\n\n我们可以使用以下命令产生混淆矩阵并计算这些指标：\n\n```\n\
    library(MLmetrics)\ncm = ConfusionMatrix(pred, ytest)\naccuracy = Accuracy(pred,\
    \ ytest)\nprecision = Precision(ytest, 'versicolor')\nrecall = Recall(ytest, 'versicolor')\n\
    f1 = F1_Score(ytest, 'versicolor')\ndata.frame(precision, recall, f1)\n```\n（或者我们可以计算\
    \ `TP`、`FP`、`TN` 和 `FN`，并找到精确率为 `TP/(TP + FP)`，召回率为 `TP/(TP + FN)`）\n\n最后，3 个模型的\
    \ F 分数如下表（d）：\n\n| 决策树 | F-Measure |\n| --- | --- |\n| minsplit = 10 | 0.833 |\n\
    | minsplit = 20 | 0.947 |\n| minsplit = 30 | 0.857 |\n\n### 3.4 练习题\n\n给定以下数组用于二分类问题的训练数据：\n\
    \n| CustomerID | Sex | CarType | Budget | Insurance |\n| --- | --- | --- | ---\
    \ | --- |\n| 1 | M | Family | Low | No |\n| 2 | M | Sport | Medium | No |\n| 3\
    \ | M | Sport | Medium | No |\n| 4 | M | Sport | High | No |\n| 5 | M | Sport\
    \ | VeryHigh | No |\n| 6 | M | Sport | VeryHigh | No |\n| 7 | F | Sport | Low\
    \ | No |\n| 8 | F | Sport | Low | No |\n| 9 | F | Sport | Medium | No |\n| 10\
    \ | F | Sedan | High | No |\n| 11 | M | Family | High | No |\n| 12 | M | Family\
    \ | VeryHigh | No |\n| 13 | M | Family | Medium | No |\n| 14 | M | Sedan | VeryHigh\
    \ | No |\n| 15 | F | Sedan | Low | No |\n| 16 | F | Sedan | Low | No |\n| 17 |\
    \ F | Sedan | Medium | No |\n| 18 | F | Sedan | Medium | No |\n| 19 | F | Sedan\
    \ | Medium | No |\n| 20 | F | Sedan | High | No |\n\n为以下项计算 Gini 指数：\n\na) 所有实例\n\
    b) CustomerID\nc) Sex\nd) 使用多路划分的 CarType\ne) 使用多路划分的 Budget\n\n哪一个应该被用于首次划分？提示性问题：解释为什么\
    \ CustomerID 尽管具有最低的 Gini 指数但不应被作特征使用。\n\n"
- fmt: "\nBuilding a model requires executing the `naiveBayes` command:\n\n```\nmodel\
    \ <- naiveBayes(Target ~ ., data = ..., laplace = ...)\n```\n\nwhere parameter\
    \ `laplace` is used to select laplace smoothing.\n\nGiven a trained model, we\
    \ can predict the class for a new instance using the command:\n\n```\npredict(model,\
    \ trvalue)\n```\n\nwhile if we further add the parameter `type = \"raw\"`, we\
    \ are also provided with the posterior probabilities.\n\n### 4.2 Naive Bayes Model\
    \ Construction and Classification\n\nWe will use the data of the following table\
    \ for a problem of binary classification:\n\n| Weather | Day | HighTraffic |\n\
    | --- | --- | --- |\n| Hot | Vacation | No |\n| Cold | Work | Yes |\n| Normal\
    \ | Work | No |\n| Cold | Weekend | Yes |\n| Normal | Weekend | Yes |\n| Cold\
    \ | Work | No |\n| Hot | Work | No |\n| Hot | Vacation | Yes |\n\nWe will answer\
    \ to the following questions:\n\na) Using the Naive Bayes Classifier, in which\
    \ class would you classify a new instance with values `(Weather, Day) = (Hot,\
    \ Vacation)`?\n\nb) Using the Naive Bayes Classifier, in which class would you\
    \ classify a new instance with values `(Weather, Day) = (Hot, Weekend)`?\n\nc)\
    \ Repeat question (b) using Laplace smoothing.\n\nd) Build the full model in R\
    \ and repeat question (a).\n\ne) Build the full model in R using laplace smoothing\
    \ and repeat question (b).\n\n#### 4.2.1 Data and Library Imports\n\nInitially,\
    \ we read the data and import the required librares:\n\n```\ntraffic = read.csv(\"\
    traffic.txt\", stringsAsFactors = TRUE)\nlibrary(e1071)\n```\n\n#### 4.2.2 Probability\
    \ Calculation\n\nFor question (a), we compute the probability using the following\
    \ formulas:\n\n![P(Yes|Hot,Vacation) = \\frac{ P(Hot|Yes) \\cdot P(Vacation|Yes)\
    \ \\cdot P(Yes) }{ P(Hot) \\cdot P(Vacation) } = \\frac{ 1/4 \\cdot 1/4 \\cdot\
    \ 1/2 }{ 3/8 \\cdot 2/8 } = 1/3](images/leanpub_equation_24.png)![P(No|Hot,Vacation)\
    \ = \\frac{ P(Hot|No) \\cdot P(Vacation|No) \\cdot P(No) }{ P(Hot) \\cdot P(Vacation)\
    \ } = \\frac{ 2/4 \\cdot 1/4 \\cdot 1/2 }{ 3/8 \\cdot 2/8 } = 2/3](images/leanpub_equation_25.png)\n\
    \nSince ![P(No|Hot,Vacation) > P(Yes|Hot,Vacation)](images/leanpub_equation_26.png),\
    \ the algorithm classifies the instance to No.\n\nSimilarly, for question (b):\n\
    \n![P(Yes|Hot,Weekend) = \\frac{ P(Hot|Yes) \\cdot P(Weekend|Yes) \\cdot P(Yes)\
    \ }{ P(Hot) \\cdot P(Weekend) } = \\frac{ 1/4 \\cdot 2/4 \\cdot 1/2 }{ 3/8 \\\
    cdot 2/8 } = 2/3](images/leanpub_equation_27.png)![P(No|Hot,Weekend) = \\frac{\
    \ P(Hot|No) \\cdot P(Weekend|No) \\cdot P(No) }{ P(Hot) \\cdot P(Weekend) } =\
    \ \\frac{ 2/4 \\cdot 0/4 \\cdot 1/2 }{ 3/8 \\cdot 2/8 } = 0](images/leanpub_equation_28.png)\n\
    \nSince ![P(No|Hot,Weekend) < P(Yes|Hot,Weekend)](images/leanpub_equation_29.png),\
    \ the algorithm classifies the instance to Yes.\n\nConcerning question (c), we\
    \ will re-compute the probabilities, however adding `1` as the Laplacian parameter.\
    \ So, given the new probabilities are ![P(Hot|Yes) = (1 + 1)/(4 + 3) = 2/7](images/leanpub_equation_30.png),\
    \ ![P(Weekend|Yes) = (2 + 1)/(4 + 3) = 3/7](images/leanpub_equation_31.png), ![P(Hot|No)\
    \ = (2 + 1)/(4 + 3) = 3/7](images/leanpub_equation_32.png), and ![P(Weekend|No)\
    \ = (0 + 1)/(4 + 3) = 1/7](images/leanpub_equation_33.png), we compute:\n\n![P(Yes|Hot,Weekend)\
    \ = \\frac{ P(Hot|Yes) \\cdot P(Weekend|Yes) \\cdot P(Yes) }{ P(Hot) \\cdot P(Weekend)\
    \ } = \\frac{ 2/7 \\cdot 3/7 \\cdot 1/2 }{ 3/8 \\cdot 2/8 } = 32/49](images/leanpub_equation_34.png)![P(No|Hot,Weekend)\
    \ = \\frac{ P(Hot|No) \\cdot P(Weekend|No) \\cdot P(No) }{ P(Hot) \\cdot P(Weekend)\
    \ } = \\frac{ 3/7 \\cdot 1/7 \\cdot 1/2 }{ 3/8 \\cdot 2/8 } = 16/49](images/leanpub_equation_35.png)\n\
    \nSince ![P(No|Hot,Weekend) < P(Yes|Hot,Weekend)](images/leanpub_equation_36.png),\
    \ the algorithm classifies the instance to Yes.\n\n#### 4.2.3 Building the Naive\
    \ Bayes Model\n\n##### 4.2.3.1 Building Simple Model\n\nFor question (d), we build\
    \ a bayes model:\n\n```\nmodel <- naiveBayes(HighTraffic ~ ., data = traffic)\n\
    ```\n\nFurthermore, we can print the model:\n\n```\nprint(model)\n```\n\nThe output\
    \ is shown below:\n\n```\nNaive Bayes Classifier for Discrete Predictors\nCall:\
    \ naiveBayes.default(x = X, y = Y, laplace = laplace)\n\nA-priori probabilities:\n\
    Y\n No Yes \n0.5 0.5 \n\nConditional probabilities:\n     Weather\nY     Cold\
    \  Hot Normal\n  No  0.25 0.50   0.25\n  Yes 0.50 0.25   0.25\n\n     Day\nY \
    \    Vacation Weekend Work\n  No      0.25    0.00 0.75\n  Yes     0.25    0.50\
    \ 0.25\n```\n\nWe may now re-compute question (a):\n\n```\ntrvalue <- data.frame(Weather\
    \ = factor(\"Hot\", levels(traffic$Weather)),  Day = factor(\"Vacation\", levels(traffic$Day)))\n\
    predict(model, trvalue)\n```\n\nWe can also get the relevant probabilities:\n\n\
    ```\npredict(model, trvalue, type = \"raw\")\n```\n\n##### 4.2.3.2 Building Model\
    \ with Laplace Smoothing\n\nFor question (c), we build a naive bayes model with\
    \ laplace smoothing:\n\n```\nmodel <- naiveBayes(HighTraffic ~ ., data = traffic,\
    \ laplace = 1)\n```\n\nWe may now re-compute question (a):\n\n```\ntrvalue <-\
    \ data.frame(Weather = factor(\"Hot\", levels(traffic$Weather)),  Day = factor(\"\
    Weekend\", levels(traffic$Day)))\npredict(model, trvalue)\n```\n\nWe can also\
    \ get the relevant probabilities:\n\n```\npredict(model, trvalue, type = \"raw\"\
    )\n```\n\n### 4.3 Naive Bayes Application with Evaluation\n\nWe will apply the\
    \ Naive Bayes classifier on the dataset `HouseVotes84`. Initially, we import the\
    \ dataset, ignoring any instances with missing values:\n\n```\ndata(HouseVotes84,\
    \ package = \"mlbench\")\nvotes = na.omit(HouseVotes84)\n```\n\nFurthermore, we\
    \ import the libraries required to execute and evaluate the model:\n\n```\nlibrary(e1071)\n\
    library(MLmetrics)\nlibrary(ROCR)\n```\n\nAfter that, we split the dataset into\
    \ training and testing data:\n\n```\ntrainingdata = votes[1:180,]\ntestingdata\
    \ = votes[181:232,]\n```\n\nWe will answer to the following questions:\n\na) Build\
    \ a Naive Bayes model using the training data and apply it on the test data.\n\
    \nb) Compute the precision, the recall and the F-measure for the test data for\
    \ the class `democrat`.\n\nc) Build the ROC curve for the model.\n\n#### 4.3.1\
    \ Building and Applying the Naive Bayes Model\n\nFor question (a), we train the\
    \ bayes model:\n\n```\nmodel <- naiveBayes(Class ~ ., data = trainingdata)\n```\n\
    \nAfter that, we apply the model on the test set:\n\n```\nxtest = testingdata[,-1]\n\
    ytest = testingdata[,1]\npred = predict(model, xtest)\npredprob = predict(model,\
    \ xtest, type = \"raw\")\n```\n\n#### 4.3.2 Metrics Computation and ROC Curve\
    \ Plotting\n\nWe can see the confusion matrix and calculate useful metrics with\
    \ the following commands (question (b)):\n\n```\nConfusionMatrix(pred, ytest)\n\
    Precision(ytest, pred)\nRecall(ytest, pred)\n```\n\nPlotting the ROC curve (question\
    \ (c)) initially requires computing TPR and FPR with the following commands:\n\
    \n```\npred_obj = prediction(predprob[,1], ytest, label.ordering = c(\"republican\"\
    , \"democrat\"))\nROCcurve <- performance(pred_obj, \"tpr\", \"fpr\")\n```\n\n\
    If we plot the `ROCcurve` object, we shall see TPR and FPR and the corresponding\
    \ thresholds.\n\nFinally, we can plot the curve as follows:\n\n```\nplot(ROCcurve,\
    \ col = \"blue\")\nabline(0,1, col = \"grey\")\n```\n\nAnd find the area under\
    \ the curve using the command:\n\n```\nperformance(pred_obj, \"auc\")\n```\n\n\
    ![](images/chapter4----roc_curve.png)\n\n## Chapter 5 - Classification with k-Nearest\
    \ Neighbors\n\n### 5. Introduction\n\n#### 5.1.1 Introduction to k-Nearest Neighbors\n\
    \nk-Nearest Neighbors (kNN) is a machine learning algorithm, where the prediction\
    \ for a new instance depends on its k nearest instances. As a result, the class\
    \ for a new instance is determined by majority vote given the class of its k nearest\
    \ instances.\n\n#### 5.1.2 k-Nearest Neighbors in R\n\nWe may use the class library\
    \ to apply the kNN model in R:\n\n```\nlibrary(class)\n```\n\nA new instance may\
    \ be classified using the command `knn`:\n\n```\nknn(X_train, X_test, Y_train,\
    \ k = 1, prob = TRUE)\n```\n"
