    \n![](images/chapter10----silhouette_plot.png)\n\n# Chapter 11 Density-based Clustering\n\
    \n`Density-based clustering` is based on the ground truth that given a cetrain\
    \ dataset, clusters can be defined as areas of higher density than the remainder\
    \ of the dataset. Data instances within the sparse areas, which are required to\
    \ separate clusters, are usually considered to be noise. The most famous and widely\
    \ used density-based algorithm is `DBSCAN` (Density-based Spatial Clustering of\
    \ Applications with Noise) which was introduced by Martin Ester, Hans-Peter Kriegel,\
    \ Jorg Sander and Xiaowei Xu in 1996. The main idea behind the `DBSCAN` algorithm\
    \ is that given a set of points in some n-dimantional space, points that are closely\
    \ packed together (points with many nearby neighbors and thus of higher density)\
    \ are grouped into clusters, while points that lie alone in low-density regions\
    \ are considered as outliers.\n\n## 11.1 DBSCAN in R\n\nIn order to use `DBSCAN`\
    \ in R, we need to use the `cluster` library which can be imported with the following\
    \ command:\n\n```\nlibrary(dbscan)\n```\n\nIn order to perform clustering using\
    \ `DBSCAN` and get the distribution of the input dataset into clusters, we can\
    \ use the following commands:\n\n```\n# Perform clustering using DBSCAN\nmodel\
    \ = dbscan(ddata, eps = 1.0, minPts = 4)\n\n# Get distribution of the input dataset\
    \ into clusters\nclusters = model$cluster\n```\n\n`DBSCAN` algorithm requires\
    \ setting 2 main parameters:\n\n* `epsilon (eps)`, which specifies the maximum\
    \ distance that two data points can have in order to be considered as part of\
