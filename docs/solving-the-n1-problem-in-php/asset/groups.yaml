  mdcn: "\n\n# 使用 Query-Stitch 解决 N+1\n\n```php\n<?php\n// 创建一个用逗号分隔的引号 post_id 值列表\n\
    $quoted_post_ids = [];\nforeach (array_keys($posts) as $post_id) {\n    $quoted_post_ids[]\
    \ = $pdo->quote($post_id);\n}\n$quoted_post_ids = implode(',', $quoted_post_ids);\n\
    \n// 获取所有帖子的评论\n$stmt = \"SELECT \nFROM comments\nWHERE post_id IN ($quoted_post_ids)\"\
    ;\n$stmt = $pdo->prepare($stmt);\n$stmt->execute();\n$comment_entities = $stmt->fetchAll(PDO::FETCH_CLASS,\
    \ 'Comment');\n?>\n```\n\n> 评论-编码功能会创建一个用逗号分隔的 post_id 值列表，用于 IN 子句。通常情况下，我们更倾向于使用占位符绑定（placeholder\
    \ binding），但遗憾的是 PDO 不绑定数组。此外，quote() 不会将数组转换为引号且逗号分隔的值。因此，我们必须创建带引号的逗号分隔的值集。（某些数据库访问库可以绑定数组作为逗号分隔的值，例如\
    \ AuraSql。如果你正在使用其中一种，那就再棒了。）\n\n最后，我们将 Comment 条目提交到 Post 实体的根集合中。由于 $posts 集合是以\
    \ post_id 值作为键的，很容易将每个 Comment 匹配到每个 Post。\n\n```php\n<?php\nforeach ($comment_entities\
    \ as $comment) {\n    $post_id = $comment->post_id;\n    $comment_id = $comment->comment_id;\n\
    \    $posts[$post_id]->comments[$comment_id] = $comment;\n}\n?>\n```\n\n搞定：我们总共使用了两次查询和两个循环，就创建了带有关联\
    \ Comment 集合的 Post 实体根集合。\n\n尽管我们仍然使用了循环，但重要的区别在于我们没有在循环内部使用查询。与在循环内部运行查询相比，将关联实体缝合（stitch）到根集合中的循环快得多。\n\
    \nhttps://github.com/aurasphp/AuraSql\n\n# 使用 Query-And-Stitch 解决 N+1\n\n## 处理“多对多”关系\n\
    \n我们也可以关联多对多关系中的实体。例如，如果我们需要为每个 Post 关联一个多对多关系的 Tag 集合，我们可以这样操作：\n\n```php\n<?php\n\
    // 通过 `posts_tags` 关联表获取所有标签\n$stmt = \"SELECT\n    posts_tags.post_id AS post_id,\n\
    \    tags.*\nFROM tags\nJOIN posts_tags ON posts_tags.tag_id = tags.tag_id\nWHERE\
    \ posts_tags.post_id IN ({$quoted_post_ids})\";\n\n$stmt = $pdo->prepare();\n\
    $stmt->execute();\n$tag_entities = $stmt->fetchAll(PDO::FETCH_CLASS, 'Tag');\n\
    \n// 将标签缝合到 posts 中\nforeach ($tag_entities as $tag) {\n    $post_id = $tag->post_id;\n\
    \    $tag_id = $tag->tag_id;\n    $posts[$post_id]->tags[$tag_id] = $tag;\n}\n\
    ?>\n```\n\n> 注意，我们没有捕获关联表映射数据本身。对于这一点，我们需要另一个查询和另一个实体来保留数据。\n\n使用 query-and-stitch\
    \ 技术，我们总共发出了 3 次查询，并总共使用了 4 次循环，来获取根实体 ID 并缝合两个关联（评论和标签）。在 N+1 的情况下，PHP 代码中将只使用一个循环，但我们将总共发出\
    \ 21 次查询。多个 PHP 循环的性能实际上可以保证优于 21 次查询的性能。\n\n## 处理“多对一”关系\n\n如果我们想添加一个“多对一”关系（有时称为“属于”（belongs-to）关联），query-and-stitch\
    \ 逻辑会稍微复杂一些。我们需要构建一个唯一关联实体的集合，然后将关联实体缝合到根集合中。在这种情况下，我们不希望为每个关联实体创建多个副本，每个实体由相同的底层数据库行表示。\n\
    \n例如，如果每个 Post 都属于一个 Author，我们需要先收集唯一的 Author 实体，然后将它们缝合到 Post 集合中。如果一个 Author\
    \ 关联了多个 Post 实体，通过一个 Post 修改 Author 数据将反映在所有具有相同 Author 的其他 Post 实体中。\n\n```php\n\
    <?php\n// 从 posts 集合中获取唯一的 author_id 值\n$quoted_author_ids = array();\nforeach\
    \ ($posts as $post) {\n    $quoted_author_ids[] = $pdo->quote($post->author_id);\n\
    }\n$quoted_author_ids = implode(',', array_unique($quoted_author_ids));\n\n//\
    \ 将所有作者获取到 posts 集合\n$stmt = \"SELECT *\nFROM authors\nWHERE author_id IN ($quoted_author_ids)\"\
    ;\n\n$stmt = $pdo->prepare();\n$stmt->execute();\n$author_entities = $stmt->fetchAll(PDO::FETCH_CLASS,\
    \ 'Author');\n\n// 根据标识值对所有作者集合建立键\n$authors = array();\nforeach ($author_entities\
    \ as $author) {\n    $author_id = $author->author_id;\n    $authors[$author_id]\
    \ = $author;\n}\n\n// 将 Author 实体缝合到 posts\nforeach ($posts as $post) {\n    $author_id\
    \ = $post->author_id;\n    $post->author = $authors[$author_id];\n}\n?>\n```\n\
    \nAuthor 是我们为每个 Post 添加的第三个关联（两个是 Comment 和 Tag 关联）。这样做，我们只添加了 1 次查询，总共 4 次。在这种情况下，有两个额外的循环，一个用于创建\
    \ Author 集合，另一个将每个 Author 缝合到其关联的 Post。\n\n## 处理“一对一”关系\n\n添加“一对一”关系是最容易处理的情况。我们再增加一次查询和一次循环，来获取根集合的所有关联，并将它们缝合到根集合中。在这种情况下，我们不需要跟踪唯一性，只需要获取根集合的所有关联并缝合到根集合中。让我们说我们需要建立键值：\n\
    \n```php\n<?php\n// 获取根集合的所有 summaries\n$stmt = \"SELECT *\nFROM summaries\nWHERE\
    \ post_id IN ($quoted_post_ids)\";\n\n$stmt = $pdo->prepare();\n$stmt->execute();\n\
    $summary_entities = $stmt->fetchAll(PDO::FETCH_CLASS, 'Summary');\n\n// 根据标识值对\
    \ summaries 建立键\n$summaries = array();\nforeach ($summary_entities as $summary)\
    \ {\n    $post_id = $summary->post_id;\n    $summaries[$post_id] = $summary;\n\
    }\n\n// 将 summaries 缝合到 posts\nforeach ($posts as $post) {\n    $post_id = $post->post_id;\n\
    \    $post->summary = $summaries[$post_id];\n}\n?>\n```\n\nSummary 是我们为每个 Post\
    \ 添加的第四个关联。\n\n## 性能影响\n\n让我们汇总查询和循环次数：\n\n- 总共 5 次查询：1 次用于根集合，每个关联各 1 次\n- 总共\
    \ 9 次循环：\n  - 1 次为 Post 集合建立键\n  - 1 次分别为 Author 和 Summary 集合建立键\n  - 1 次创建 post_id\
    \ 的引号分隔值\n  - 1 次将 Comment、Tag、Author 和 Summary 关联缝合到根集合\n\n相比之下，具有 10 个 Post\
    \ 实体的 N+1 情况将只有一个循环，但将发出 41 次查询。query-and-stitch 解决方案的代码量更多，但由于查询减少，性能要更好。\n\n\
    # 7. 重构代码库以移除 N1 问题\n\n现在我们已经讨论了解决 N1 问题的方案，可以开始从代码库中移除它们。我们不需要重写整个应用程序；相反，我们可以通过重构逐步改进代码库。\n\
    \n## 前提条件\n\n在开始之前，我们应该准备好一些前提条件。\n\n最重要的是我们要对应用程序拥有某些测试，至少是对我们要修改的部分。这些测试将帮助我们确保移除\
    \ N1 问题时所做的更改不会破坏应用程序。这些不需要是单元测试，表征测试（Characterization tests）即可。至少要与 QA 团队建立良好关系，并将他们的验收测试应用于你的更改。\n\
    \n如果我们没有使用修订版本控制系统（如 Git），现在是开始的好时机。我们应该在单独的分支中工作，而不是在主开发分支中。在我们确认更改工作正常后再进行合并。\n\
    \n我们需要能够在短的迭代循环中诊断并解决我们的数据库交互循环。这意味着我们需要访问数据库本身（即使只是本地副本），并带有一组用于查询测试的数据数据集。当然，这还需要一套可运行的应用程序安装。\n\
    \n"
