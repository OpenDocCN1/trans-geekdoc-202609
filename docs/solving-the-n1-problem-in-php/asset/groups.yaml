  - "[PAGE 23]\n\n# Handling “To-Many” Relationships\n\nUnfortunately, the single-query\
    \ solution is almost entirely unsuitable for most \"one-to-many\" and \"many-to-many\"\
    \ situations. Let’s take a look at our initial post-and-comments example to see\
    \ why. We will start by retrieving all the Post entities (not just 10) and all\
    \ their comments:\n\n```\n<?php\n$stmt = 'SELECT\n    posts.post_id AS post__post_id,\n\
