    \n# Defining The N+1 Problem\n\n## The Problem By Example\n\nIt is easiest to\
    \ describe the N+1 problem by example. Let's say that our naive blog application\
    \ needs to show a page of the 10 most recent blog posts, along with all the comments\
    \ on each post.\n\nFirst, the application retrieves the root collection of Post\
    \ entities as an array:\n\n```php\n<?php\n$stm = 'SELECT *\nFROM posts\nORDER\
    \ BY datetime DESC\nLIMIT 10';\n$sth = $pdo->prepare($stm);\n$sth->execute();\n\
    $posts = $sth->fetchAll(PDO::FETCH_CLASS, 'Post');\n?>\n```\n\nSo far so good:\
    \ the application has issued one query to build the root collection of Post entities.\
    \ Next, the application collects the Comment entities on each entity:\n\n```php\n\
    <?php\n// prepare a statement to select the comments\n$stm = 'SELECT *\nFROM comments\n\
    WHERE post_id = :post_id';\n$sth = $pdo->prepare($stm);\nforeach ($posts as $post)\
    \ {\n  $sth->execute(array('post_id' => $post->post_id));\n  $post->comments =\
    \ $sth->fetchAll(PDO::FETCH_CLASS, 'Comment');\n}\n?>\n```\n\nThe application\
    \ has issued ten queries to build the comments for each post. With this, we have\
    \ arrived at the core of the N+1 Problem.\n\n# The Problem Defined\n\nThe N+1\
    \ problem is revealed as the following:\n\nFor each entity in a root collection,\
    \ the application issues one additional query to retrieve association.\n\nIn the\
    \ above example, the application issued a total of 11 queries to build up 10 Post\
    \ entities with their Comment collections:\n\n- one query to fetch the entities\
    \ in the root collection (this is the \"1\" in \"N+1\")\n- ten more queries, for\
    \ each entity in the root collection, to fetch the associations (this is the \"\
    N\" in \"N+1\", where \"N\" equals the number of entities in the root collection).\n\
    \n# Performance Implications\n\nThere are two performance implications of the\
    \ N+1:\n\n1. The number of queries grows as a factor of the number of entities\
    \ in the root collection.\n2. The number of queries also grows as a factor of\
    \ number of associations needed to complete each root entity.\n\nThis means that\
    \ as the number of root entities and number of relationships increase linearly,\
    \ the number of queries increases as a multiple of those two numbers. Each added\
    \ query reduces the responsiveness of the application.\n\n# 3. Diagnosing N+1\
    \ Problems\n\nThere are two methods to diagnose occurrences of the N+1 problem\
    \ in a codebase. Both methods are a matter of detective work, and are not especially\
    \ amenable to automation.\n\n# Codebase Examination\n\nFirst, we can examine the\
    \ codebase manually to look for queries being executed inside loops. This can\
    \ be tougher than it sounds, since the loop may be widely separated from the query.\
    \ For example, this loop looks mostly harmless:\n\n```php\n<?php\nforeach ($posts\
    \ as $post) {\n    $helper->doSomething($post);\n}\n?>\n```\n\nOn further examination,\
    \ if the doSomething() method (or one of the methods it calls in turn) issues\
    \ a query to the database, then we have an N+1 problem on our hands. As such,\
    \ it may not be immediately obvious where the problem originates in the codebase.\n\
    \n> What can be really pernicious is when the codebase makes a database call to\
    \ a stored procedure, and the stored procedure itself is the origin of the N+1\
    \ problem. In that case, we will need to review the stored procedure code as well.\n\
    \n# Log/Profile Examination\n\nAlternatively, we can start at the other end of\
    \ the problem, and review the database query logs (or an application-level query\
    \ profiler) to look for patterns in the queries. This is easier to achieve with\
    \ some amount of knowledge of the application and the underlying data, but in\
    \ simple cases it should be relatively obvious even without detailed application\
    \ knowledge. Pattern recognition is the key to success with this approach.\n"
