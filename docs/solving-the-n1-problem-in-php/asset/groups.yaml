  md: "\n# Solving N+1 With A Single Query\n\nAs with any N+1 situation, this will\
    \ issue 1 query for the root collection of entities, and then 1 query for each\
    \ association. In this case, with 10 Post entities, that means a total of 11 queries.\n\
    \n> As an added problem, note that the code creates a new Author entity for each\
    \ Post. If all Post entities belong to the same Author, means there are ten copies\
    \ of the Author data, none of which is authoritative. Changes to the Author of\
    \ one Post will not be reflected in what should the same Author on another post.\
    \ We will address this issue as part of the single-query solution below.\n\n#\
    \ Converting To A Single Query\n\nBecause this is a \"many-to-one\" query, where\
    \ each Post belongs to only one Author, we can consider using a single-query approach\
    \ to eliminate the N+1 problem. First, we fetch a set of rows for all Post and\
    \ Author data:\n\n```php\n<?php\n// get the most recent posts with their authors\n\
    $stmt = 'SELECT\n    posts.post_id AS post__post_id,\n    posts.author_id AS post__author_id,\n\
    \    posts.datetime AS post__datetime,\n    posts.title AS post__title,\n    posts.body\
    \ AS post__body,\n    authors.author_id AS author__author_id,\n    authors.name\
    \ AS author__name\nFROM posts\nJOIN authors ON authors.author_id = posts.author_id\n\
    ORDER BY datetime DESC\nLIMIT 10';\n$stmt = $pdo->prepare($stmt);\n$stmt->execute();\n\
    $rows = $stmt->fetchAll(PDO::FETCH_ASSOC);\n?>\n```\n\nSome things to note about\
    \ this code:\n\n- We no longer use SELECT *. We have to deconflict between tables\
    \ that have the same column names (in this case author_id), and at the same time\
    \ make sure we get back all the data needed to construct the relevant entities.\
    \ Here we do by aliasing each column name with a prefix indicating the intended\
    \ entity name, along with two underscores as a separator.\n- We add a JOIN clause\
    \ for the \"to-one\" relationship, in this case joining to the author's table.\n\
    - 3. We use the PDO::FETCH_ASSOC fetch mode instead of PDO::FETCH_CLASS. This\
    \ returns an array of arrays instead of an array of object instances. Because\
    \ each row represents data for two entities, a Post and an Author, no class is\
    \ suitable for the row data. As such, we will have to create the object instances\
    \ ourselves from the row data.\n\nThe database returns a result set that looks\
    \ something like following:\n\n# Result rows with post and author\n\n| post_id\
    \ | title | author_id | name |\n| --- | --- | --- | --- |\n| 1 | Post #1 | 1 |\
    \ Author #1 |\n| 2 | Post #2 | 2 | Author #2 |\n| 3 | Post #3 | 2 | Author #2\
    \ |\n| 4 | Post #4 | 1 | Author #1 |\n| 5 | Post #5 | 2 | Author #2 |\n| 6 | Post\
    \ #6 | 1 | Author #1 |\n| 7 | Post #7 | 1 | Author #1 |\n| 8 | Post #8 | 2 | Author\
    \ #2 |\n| 9 | Post #9 | 2 | Author #2 |\n| 10 | Post #10 | 1 | Author #1 |\n\n\
    Now we have the results, we loop through to create our entity objects.\n\n```php\n\
    <?php\n$authors = array();\n$posts = array();\nforeach ($rows as $row) {\n\n \
    \   // create the post entity\n    $post = new Post();\n    $post->post_id = $row['post_post_id'];\n\
    \    $post->author_id = $row['post_author_id'];\n    $post->datetime = $row['post_datetime'];\n\
    \    $post->title = $row['post_title'];\n    $post->body = $row['post_body'];\n\
    \n    // does the author already exist?\n    $author_id = (isset($authors[$author_id]))\
    \ {\n        // use the existing author entity\n        $author = $authors[$author_id];\n\
    \    } else {\n        // create and retain a new author entity\n        $author\
    \ = new Author();\n```\n\n```php\n$author->author_id = $author_id;\n$author->name\
    \ = $row['__name__'];\n$authors[$author_id] = $author;\n}\n\n// associate the\
    \ author entity\n$post->author = $author;\n\n// retain the post in the collection\n\
    $posts[] = $post;\n```\n\nSome notes about the object-creation code:\n\n- 1. The\
    \ approach clearly involves more lines of code than allowing PDO to create the\
    \ entity instances for us. In a less naive situation, the entity constructors\
    \ might receive an array of data and populate themselves, or there might be an\
    \ entity factory or builder of some sort to handle that work. Regardless, this\
    \ approach is guaranteed to perform better than issuing 11 queries to create the\
    \ Post entities with their associated Author entities.\n- 2. This solution uses\
    \ unique Author associations across Post entities, unlike the N+1 code. While\
    \ not strictly an N+1 problem, it does solve the issue of multiple objects representing\
    \ the same author.\n\nWith that, the solution is complete. Adding “to-one” relationships\
    \ to build associated entities is similarly straightforward. We would add another\
    \ JOIN clause, alias the selected column names appropriately, and then pull them\
    \ out of the row in our entity-creation flow, tracking unique entities along the\
    \ way.\n\n# Handling “One-To-One” Relationships\n\nThese are pretty straightforward\
    \ under the single-query approach. A plain-old JOIN, without any tracking of unique\
    \ entities, is all we need.\n\nLet’s say the blogging application needs to present\
    \ a list of Post entities, along with Summary data that tracks the number of views\
    \ and number of comments. The retrieval and creation code would look something\
    \ like this:\n\n```php\n<?php\n// get the most recent posts with their authors\n\
    $stm = 'SELECT\n    posts.post_id AS post__post_id,\n    posts.author_id AS post__author_id,\n\
    \    posts.datetime AS post__datetime,\n    posts.title AS post__title,\n    posts.body\
    \ AS post__body,\n    summaries.post_id AS summary__post_id,\n    summaries.view_count\
    \ AS summary__view_count,\n    summaries.comment_count AS summary__comment_count\n\
    FROM posts\nJOIN summaries ON posts.post_id = posts.post_id\nORDER BY datetime\
    \ DESC\nLIMIT 10';\n$sth = $pdo->prepare($stm);\n$sth->execute();\n$rows = $sth->fetchAll(PDO::FETCH_ASSOC);\n\
    \n// create the posts collection with summaries\n$posts = array();\nforeach ($rows\
    \ as $row) {\n    // create the post entity\n    $post = new Post();\n    $post->post_id\
    \ = $row['__post_post_id'];\n    $post->author_id = $row['__post_author_id'];\n\
    \    $post->datetime = $row['__post_datetime'];\n    $post->title = $row['__post_title'];\n\
    \    $post->body = $row['__post_body'];\n\n    // associate the summary\n    $post->summary\
    \ = new Summary();\n    $post->summary->post_id = $row['__summary__post_id'];\n\
    \    $post->summary->view_count = $row['__summary__view_count'];\n    $post->summary->comment_count\
    \ = $row['__summary__comment_count'];\n\n    // retain the post in the collection\n\
    \    $posts[] = $post;\n}\n?>\n```\n\nAs we can see, this is simple. Combining\
    \ \"many-to-one\" and \"one-to-one\"\n\nThe major selling point of the single-query\
    \ solution is that we should be able to bring in all the data for the root entity\
    \ and the associated entities in one query. The combined retrieval code would\
    \ look like this:\n\n```php\n<?php\n$stm = 'SELECT\n    posts.post_id AS post_id,\n\
    \    posts.author_id AS author_id,\n    posts.datetime AS post__datetime,\n  \
    \  posts.title AS post__title,\n    posts.body AS post__body,\n    authors.author_id\
    \ AS author__author_id,\n    authors.name AS author__name,\n    summaries.post_id\
    \ AS summary__post_id,\n    summaries.view_count AS summary__view_count,\n   \
    \ summaries.comment_count AS summary__comment_count\nFROM posts\nJOIN authors\
    \ ON authors.author_id = posts.author_id\nJOIN summaries ON summaries.post_id\
    \ = posts.post_id\nORDER BY datetime\nLIMIT 10';\n$stm = $pdo->prepare($stm);\n\
    $stm->execute();\n$rows = $stm->fetchAll(PDO::FETCH_ASSOC);\n```\n\nWhen we get\
    \ the results, we pick up each row by building the creation logic as well:\n\n\
    ```php\n<?php\n$authors = array();\n$posts = array();\nforeach ($rows as $row)\
    \ {\n\n    // create the post entity\n    $post = new Post();\n    $post->post_id\
    \ = $row['post_id'];\n    $post->author_id = $row['author_id'];\n    $post->datetime\
    \ = $row['post__datetime'];\n    $post->title = $row['post__title'];\n    $post->body\
    \ = $row['post__body'];\n\n    // does the author entity already exist?\n    $author_id\
    \ = $row['author__author_id'];\n    if (isset($authors[$author_id])) {\n     \
    \   // use the existing author entity\n        $author = $authors[$author_id];\n\
    \    } else {\n        // create and retain a new author entity\n        $author\
    \ = new Author();\n        $author->id = $author_id;\n        $author->name =\
    \ $row['author__name'];\n        $authors[$author_id] = $author;\n    }\n\n  \
    \  // associate the author entity\n    $post->author = $author;\n\n    // associate\
    \ the summary\n    $post->summary = new Summary();\n    $post->summary->post_id\
    \ = $row['summary__post_id'];\n    $post->summary->view_count = $row['summary__view_count'];\n\
    \    $post->summary->comment_count = $row['summary__comment_count'];\n\n    //\
    \ retain the post in the collection\n    $posts[] = $post;\n}\n?>\n```\n"
  mdcn: "\n\n# 使用单个查询解决 N+1 问题\n\n与任何 N+1 情况一样，这会为根实体集合发布 1 次查询，然后为每个关联发布 1 次查询。在这种情况下，如果有\
    \ 10 个 Post 实体，就意味着总共会有 11 次查询。\n\n> 作为一个额外的问题，请注意该代码为每个 Post 创建了一个新的 Author 实体。如果所有\
    \ Post 实体都属于同一个 Author，意味着存在十份 Author 数据的副本，且其中任何一个都不是权威的。对一个 Post 的 Author 的更改不会反映在另一个帖子上本应是相同的\
    \ Author 上。我们将在下文的单查询解决方案中解决这个问题。\n\n# 转换为单查询\n\n由于这是一个“多对一”查询（每个 Post 仅属于一个 Author），我们可以考虑使用单查询方法来消除\
    \ N+1 问题。首先，我们获取包含所有 Post 和 Author 数据的一行记录：\n\n```php\n<?php\n// 获取带有作者的最新帖子\n\
    $stmt = 'SELECT\n    posts.post_id AS post__post_id,\n    posts.author_id AS post__author_id,\n\
    \    posts.datetime AS post__datetime,\n    posts.title AS post__title,\n    posts.body\
    \ AS post__body,\n    authors.author_id AS author__author_id,\n    authors.name\
    \ AS author__name\nFROM posts\nJOIN authors ON authors.author_id = posts.author_id\n\
    ORDER BY datetime DESC\nLIMIT 10';\n$stmt = $pdo->prepare($stmt);\n$stmt->execute();\n\
    $rows = $stmt->fetchAll(PDO::FETCH_ASSOC);\n?>\n```\n\n关于这段代码的几点注意事项：\n\n- 我们不再使用\
    \ `SELECT *`。我们必须处理具有相同列名（在本例中为 `author_id`）的表之间的命名冲突，同时确保我们获取了构建相关实体所需的所有数据。在这里，我们通过为每个列名加上带有目标实体名称的别缀，并使用两个下划线作为分隔符来实现。\n\
    - 我们为“对一”关系添加了 `JOIN` 子句，在本例中连接到作者表。\n- 3. 我们使用 `PDO::FETCH_ASSOC` 获取模式而不是 `PDO::FETCH_CLASS`。这返回的是一个数组数组，而不是对象实例数组。因为每行代表了两个实体的数据（一个\
    \ Post 和一个 Author），所以没有一个类适用于该行数据。因此，我们必须从行数据自己创建对象实例。\n\n数据库返回的结果集看起来如下：\n\n\
    # 带有 Post 和作者的结果行\n\n| post_id | title | author_id | name |\n| --- | --- | ---\
    \ | --- |\n| 1 | Post #1 | 1 | Author #1 |\n| 2 | Post #2 | 2 | Author #2 |\n\
    | 3 | Post #3 | 2 | Author #2 |\n| 4 | Post #4 | 1 | Author #1 |\n| 5 | Post #5\
    \ | 2 | Author #2 |\n| 6 | Post #6 | 1 | Author #1 |\n| 7 | Post #7 | 1 | Author\
    \ #1 |\n| 8 | Post #8 | 2 | Author #2 |\n| 9 | Post #9 | 2 | Author #2 |\n| 10\
    \ | Post #10 | 1 | Author #1 |\n\n现在我们有了结果，通过循环来创建我们的实体对象。\n\n```php\n<?php\n\
    $authors = array();\n$posts = array();\nforeach ($rows as $row) {\n\n    // 创建\
    \ post 实体\n    $post = new Post();\n    $post->post_id = $row['post_post_id'];\n\
    \    $post->author_id = $row['post_author_id'];\n    $post->datetime = $row['post_datetime'];\n\
    \    $post->title = $row['post_title'];\n    $post->body = $row['post_body'];\n\
    \n    // 作者是否存在？\n    $author_id = (isset($authors[$author_id])) {\n        //\
    \ 使用已有的作者实体\n        $author = $authors[$author_id];\n    } else {\n        //\
    \ 创建并保留新的作者实体\n        $author = new Author();\n```\n\n```php\n$author->author_id\
    \ = $author_id;\n$author->name = $row['__name__'];\n$authors[$author_id] = $author;\n\
    }\n\n// 关联作者实体\n$post->author = $author;\n\n// 在集合中保留 post\n$posts[] = $post;\n\
    ```\n\n关于对象创建代码的说明：\n\n- 1. 这种方法显然比允许 PDO 为我们创建实体实例的代码行数要多。在一种不那么简单的情况下，实体构造函数可能会接收一个数据数组并填充自己，或者会有某种类型的实体工厂或构建器来处理这些工作。无论如何，这种方法的性能保证优于发布\
    \ 11 次查询来创建 Post 实体及其关联的 Author 实体。\n- 2. 该解决方案在 Post 实体之间使用了唯一的 Author 关联，与 N+1\
    \ 代码不同。虽然不是严格的 N+1 问题，但它解决了多个对象表示同一个作者的问题。\n\n至此，解决方案就完成了。添加“一对一”关系来构建关联实体同样简单。我们会添加另一个\
    \ `JOIN` 子句，相应地为所选列名设置别名，然后在实体创建流中从行中提取它们，在此过程中跟踪唯一的实体。\n\n# 处理“一对一”关系\n\n在单查询方法下，这些关系非常直观。我们只需要一个普通的\
    \ `JOIN`，不需要对唯一实体进行任何跟踪。\n\n假设博客应用程序需要展示 Post 实体列表，以及跟踪视图次数和评论数量的 Summary 数据。检索和创建代码看起来如下所示：\n\
    \n```php\n<?php\n// 获取带有作者的最新帖子\n$stm = 'SELECT\n    posts.post_id AS post__post_id,\n\
    \    posts.author_id AS post__author_id,\n    posts.datetime AS post__datetime,\n\
    \    posts.title AS post__title,\n    posts.body AS post__body,\n    summaries.post_id\
    \ AS summary__post_id,\n    summaries.view_count AS summary__view_count,\n   \
    \ summaries.comment_count AS summary__comment_count\nFROM posts\nJOIN summaries\
    \ ON posts.post_id = posts.post_id\nORDER BY datetime DESC\nLIMIT 10';\n$sth =\
    \ $pdo->prepare($stm);\n$sth->execute();\n$rows = $sth->fetchAll(PDO::FETCH_ASSOC);\n\
    \n// 创建带有 summaries 的 posts\n$posts = array();\nforeach ($rows as $row) {\n  \
    \  // 创建 post 实体\n    $post = new Post();\n    $post->post_id = $row['post_post_id'];\n\
    \    $post->author_id = $row['post_author_id'];\n    $post->datetime = $row['post_datetime'];\n\
    \    $post->title = $row['post_title'];\n    $post->body = $row['post_body'];\n\
    \n    // 关联 summary\n    $post->summary = new Summary();\n    $post->summary->post_id\
    \ = $row['summary__post_id'];\n    $post->summary->view_count = $row['summary__view_count'];\n\
    \    $post->summary->comment_count = $row['summary__comment_count'];\n\n    //\
    \ 在集合中保留 post\n    $posts[] = $post;\n}\n?>\n```\n\n我们可以看到，这很简单。结合“多对一”和“一对一”，单查询解决方案的主要优势在于我们能够通过一次查询获取根实体及其关联实体的数据。合并后的检索代码看起来如下：\n\
    \n```php\n<?php\n$stm = 'SELECT\n    posts.post_id AS post_id,\n    posts.author_id\
    \ AS author_id,\n    posts.datetime AS post__datetime,\n    posts.title AS post__title,\n\
    \    posts.body AS post__body,\n    authors.author_id AS author__author_id,\n\
    \    authors.name AS author__name,\n    summaries.post_id AS summary__post_id,\n\
    \    summaries.view_count AS summary__view_count,\n    summaries.comment_count\
    \ AS summary__comment_count\nFROM posts\nJOIN authors ON authors.author_id = posts.author_id\n\
    JOIN summaries ON summaries.post_id = posts.post_id\nORDER BY datetime\nLIMIT\
    \ 10';\n$stm = $pdo->prepare($stm);\n$stm->execute();\n$rows = $stm->fetchAll(PDO::FETCH_ASSOC);\n\
    ```\n\n当我们获取结果时，通过构建构建逻辑来处理每一行：\n\n```php\n<?php\n$authors = array();\n$posts\
    \ = array();\nforeach ($rows as $row) {\n\n    // 创建 post 实体\n    $post = new\
    \ Post();\n    $post->post_id = $row['post_id'];\n    $post->author_id = $row['author_id'];\n\
    \    $post->datetime = $row['post__datetime'];\n    $post->title = $row['post__title'];\n\
    \    $post->body = $row['post__body'];\n\n    // 作者是否存在？\n    $author_id = $row['author__author_id'];\n\
    \    if (isset($authors[$author_id])) {\n        // 使用已有的作者实体\n        $author\
    \ = $authors[$author_id];\n    } else {\n        // 创建并保留新的作者实体\n        $author\
    \ = new Author();\n        $author->id = $author_id;\n        $author->name =\
    \ $row['author__name'];\n        $authors[$author_id] = $author;\n    }\n\n  \
    \  // 关联作者实体\n    $post->author = $author;\n\n    // 关联 summary\n    $post->summary\
    \ = new Summary();\n    $post->summary->post_id = $row['summary__post_id'];\n\
    \    $post->summary->view_count = $row['summary__view_count'];\n    $post->summary->comment_count\
    \ = $row['summary__comment_count'];\n\n    // 在集合中保留 post\n    $posts[] = $post;\n\
    }\n?>\n```\n\n"
