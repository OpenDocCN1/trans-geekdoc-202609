  - '[PAGE 33]


    # 7. Refactoring The Codebase To Remove N+1 Problems


    Now that we have discussed solutions for N+1 problems, we can begin to remove
    them from our codebase. We need not rewrite the entire application; instead, we
    can incrementally improve the codebase through [refactoring].


    # Prerequisites


    Before we get started, we should have some prerequisites in place.


    Most importantly, we should have tests of some sort for our application, or at
    least for the parts we are going to modify. These tests will help us assure that
    any changes we make while removing N+1 problems do not break the application.
    These need not be unit tests, [Characterization tests] will just do fine. If nothing
    else, make friends with your QA team and apply their acceptance tests to your
    changes.


    If we are not using a revision version control system, such as Git, now would
    be an excellent time to start. We should do our work in a separate branch, not
    in the same branch as the main thrust of development work. We can merge our changes
    after we know they work properly.


    We need to be able to work in short iteration loops while diagnosing and resolving
    our database-interaction loops. This means we need access to the database itself,
    even if only a local copy, with a representative set of data for the querying
    testing. This is in addition to a working installation of the application code,
    of course.


    Finally, if you have not [Modernizing Legacy Applications in PHP] and applied
    its formula to your codebase, you should consider doing so. While not strictly
    required, it will be very helpful. This is because we want to work on a codebase
    that has a good separation of concerns in place. If the database code is mixed
    in business logic and presentation, it is going to be that much more difficult
    to pick apart (and test!) the SQL queries contributing to our N+1 problems.'
