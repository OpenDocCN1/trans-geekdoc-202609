  - "[PAGE 28]\n\n# Solving N+1 With Query-Stitch\n\n```\n<?php\n// create a comma-separated\
    \ list of quoted post_id values\n$quoted_post_ids = [];\nforeach (array_keys($posts)\
    \ as $post_id) {\n    $quoted_post_ids[] = $pdo->quote($post_id);\n}\n$quoted_post_ids\
    \ = implode(',', $quoted_post_ids);\n\n// fetch all the comments for the posts\n\
    $stmt = \"SELECT \nFROM comments\nWHERE post_id IN ($quoted_post_ids)\";\n$stmt\
    \ = $pdo->prepare($stmt);\n$stmt->execute();\n$comment_entities = $stmt->fetchAll(PDO::FETCH_CLASS,\
    \ 'Comment');\n?>\n```\n\n> The comment-coding feature creates a comma-separated\
    \ list of post_id values for the use in the IN clause. Normally we would prefer\
    \ to use placeholder binding, but unfortunately PDO does not bind arrays. Further,\
    \ quote() does not convert arrays to quoted-separated values. As much, we must\
    \ create the quoted set of comma-separated values. (Some database access libraries\
    \ do bind arrays as comma-separated values, such as AuraSql. If you are using\
    \ one of them, so much the better.\n\nFinally, we commit the Comment entries into\
    \ the root collection of Post entities. Because the $posts collection is keyed\
    \ on post_id values, it is easy to match each Comment to each Post.\n\n```\n<?php\n\
    foreach ($comment_entities as $comment) {\n    $post_id = $comment->post_id;\n\
    \    $comment_id = $comment->comment_id;\n    $posts[$post_id]->comments[$comment_id]\
    \ = $comment;\n}\n?>\n```\n\nVoila: we have used a total of two queries and two\
    \ loops to create the root collection of Post entities with their associated Comment\
    \ collections.\n\nAlthough we are still loops, the important distinction is that\
    \ we are not using queries inside the loops. The loops that stitch the associated\
    \ entities into the root collection are very fast compared to running queries\
    \ inside those loops.\n\nhttps://github.com/aurasphp/AuraSql"
  - "[PAGE 29]\n\nSolving N+1 With Query-And-Stitch\n\n# Handling “Many-To-Many” Relationships\n\
    \nWe can also associate entities from a many-to-many relationship. For example,\
