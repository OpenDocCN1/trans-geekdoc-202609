    \ entities into the root collection. We do not want to create multiple"
  - "[PAGE 30]\n\n# Solving N+1 With Query-And-Stitch\n\ncopies of each associated\
    \ entity in this case, each is represented by the same backing database row.\n\
    \nFor example, if each Post belongs to an Author, we need to collect the unique\
    \ Author entities first, then stitch them into the Post collection. If one Author\
    \ is associated with multiple Post entities, changing the Author data through\
    \ one Post will be reflected in all other Post entities with that same Author.\n\
    \n```\n<?php\n// get the unique author_id values from the posts collection\nquoted_author_ids\
    \ = array();\nforeach ($posts as $post) {\n    $quoted_author_ids[] = $pdo->quote($post->author_id);\n\
    }\n$quoted_author_ids = implode(',', array_unique($quoted_author_ids));\n\n//\
    \ fetch all authors into the posts collection\n$stmt = \"SELECT *\nFROM authors\n\
    WHERE author_id IN ($quoted_author_ids)\";\n\n$stmt = $pdo->prepare();\n$stmt->execute();\n\
    $author_entities = $stmt->fetchAll(PDO::FETCH_CLASS, 'Author');\n\n// key all\
    \ authors collection on its identity values\n$authors = array();\nforeach ($author_entities\
    \ as $author) {\n    $author_id = $author->author_id;\n    $authors[$author_id]\
    \ = $author;\n}\n\n// stitch the author entities into the posts\nforeach ($posts\
    \ as $post) {\n    $author_id = $post->author_id;\n    $post->author = $authors[$author_id];\n\
    }\n?>\n```\n\nThe Author is the third association we have added to each Post (the\
    \ others were Comment and Tag associations). In doing so we have added only 1\
    \ query, for a total of 4. In this case, there were two additional loops, one\
    \ to create the Author collection and to stitch each Author into its associated\
    \ Post."
  - "[PAGE 31]\n\n# Handling “One-To-One” Relationships\n\nAdding a \"one-to-one\"\
