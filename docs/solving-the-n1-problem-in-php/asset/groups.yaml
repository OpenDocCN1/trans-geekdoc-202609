    \ Reporting Script, where the application retrieved five associated entities for\
    \ each root entity, the logs looked like this...\n\nQueries batched per root entity\n\
    \n```\nSELECT * FROM root_table WHERE;\nSELECT * FROM rel1 WHERE rel1.root_id\
    \ = 10324 ...;\nSELECT * FROM rel2 WHERE rel2.root_id = 10324 ...;\nSELECT * FROM\
    \ rel3 WHERE rel3.root_id = 10324 ...;\nSELECT * FROM rel4 WHERE rel4.root_id\
    \ = 10324 ...;\nSELECT * FROM rel5 WHERE rel5.root_id = 10324 ...;\nSELECT * FROM\
    \ rel1 WHERE rel1.root_id = 10325 ...;\nSELECT * FROM rel2 WHERE rel2.root_id\
    \ = 10325 ...;\nSELECT * FROM rel3 WHERE rel3.root_id = 10325 ...;\nSELECT * FROM\
    \ rel4 WHERE rel4.root_id = 10325 ...;\nSELECT * FROM rel5 WHERE rel5.root_id\
    \ = 10325 ...;\nSELECT * FROM rel1 WHERE rel1.root_id = 10326 ...;\nSELECT * FROM\
    \ rel2 WHERE rel2.root_id = 10326 ...;\nSELECT * FROM rel3 WHERE rel3.root_id\
    \ = 10326 ...;\nSELECT * FROM rel4 WHERE rel4.root_id = 10326 ...;\nSELECT * FROM\
    \ rel5 WHERE rel5.root_id = 10326 ...;\n```\n\n... and so, with 5 related queries\
    \ for each of the root entities. As you can see, the pattern repeats over groups\
    \ of five lines, one for each rel1 through rel5.\n\n## Diagnosing N+1 Problems\n\
    \nIf the queries are batched per-relationship, instead of per-root-entity, the\
    \ log might look more like this:\n\nQueries batched per relationship\n\n```\n\
    SELECT * FROM root_table WHERE ... ;\nSELECT * FROM rel1.root_id = 10324 ...;\n\
    SELECT * FROM rel1.root_id = 10325 ...;\nSELECT * FROM rel1.root_id = 10326 ...;\n\
    \nSELECT * FROM rel2.root_id = 10324 ...;\nSELECT * FROM rel2.root_id = 10325\
    \ ...;\nSELECT * FROM rel2.root_id = 10326 ...;\n\nSELECT * FROM rel3.root_id\
    \ = 10324 ...;\nSELECT * FROM rel3.root_id = 10325 ...;\nSELECT * FROM rel3.root_id\
    \ = 10326 ...;\n\nSELECT * FROM rel4.root_id = 10324 ...;\nSELECT * FROM rel4.root_id\
    \ = 10325 ...;\nSELECT * FROM rel4.root_id = 10326 ...;\n\nSELECT * FROM rel4.root_id\
    \ = 10324 ...;\nSELECT * FROM rel4.root_id = 10325 ...;\nSELECT * FROM rel4.root_id\
    \ = 10326 ...;\n\nSELECT * FROM rel5.root_id = 10324 ...;\nSELECT * FROM rel5.root_id\
    \ = 10325 ...;\nSELECT * FROM rel5.root_id = 10326 ...\n```\n\nUnfortunately,\
    \ even when we recognize a pattern, it may be difficult to discover what part\
    \ of the codebase is causing the problem. We will need to search the codebase\
    \ for SQL strings similar to the ones showing up in the logs.\n\n> If your database\
    \ abstraction layer has a query profiler that retains a backtrack, so that you\
    \ can tell where the query originates, so much the better (Aura.Sql¹ is one package).\
    \ Even if it does not, you can narrow down the possible locations by starting\
    \ the profiler at a point of your choosing, then stopping the profiler (and logging\
    \ or dumping its output) at a later point.\n\n¹https://github.com/auraph/Aura.Sql\n\
    \n## Easier Query Examination\n\nIf we have a non-trivial number of root entities,\
    \ more than 100 or so, reviewing the query logs or profiles will be a heavy undertaking.\
    \ If at all possible, try to reduce the data set to something more manageable,\
    \ so that the logs are relatively short. At the very least, reducing the data\
    \ set will decrease the amount of time it takes to generate the logs in the first\
    \ place.\n\nIn the case of the Slow Reporting Script, it would have taken three\
    \ hours to run the script and get a log, and the log itself would have been hundreds\
    \ of thousands of lines. That would have for a very slow “change-and-retest” iteration\
    \ cycle. Realizing this, I reduced the data set from 2 million rows to just 2\
    \ thousand; as a result, the script had to build only 40 root entities instead\
    \ of 40,000. This had the benefit reducing the time for the script to run and\
    \ to generate the query log, as well as reducing the number of lines in the log.\
    \ That meant looking through only 201 relevant log lines, instead of 200,001.\n\
    \n## 4. Why Does The N+1 Problem Occur?\n\nWhy is it that the N+1 problem appears\
    \ at all? After fixing the problem in several codebases, and talking with some\
    \ of the original developers on those codebases, I have concluded that the problem\
    \ stems from a CRUD-dy developer mindset.\n\n## CRUD Is The Problem\n\nWe all\
    \ know the CRUD acronym: Create, Read, Update, Delete. The key here is that CRUD\
    \ applies primarily to single entity, retrieve a single entity, edit and delete\
    \ a single entity.\n\nThis one-at-a-time approach is useful for the vast majority\
    \ of database interactions. It leads to using such patterns as RowDataGateway\
    \ and ActiveRecord?. In these, the concentration is on how to build a single entity,\
    \ usually with its associations.\n\nThe single-entity concentration is the source\
    \ of the N+1 problem. With that mindset, developers approach building a collection\
    \ of multiple entities as a variation on building entities. The developer just\
    \ loops over the single-entity creation process once for each entity in the collection.\
    \ Collections of entities are essentially an afterthought. Because they are not\
    \ a primary focus, the developer naturally gravitates towards queries-inside-loops,\
    \ the hallmark of the N+1 problem.\n\n## B Is The Answer\n\nThe key to solving\
    \ the N+1 problem, then, begins with a change in developer mindset. Instead of\
    \ thinking in terms of CRUD, we should think in terms of BREAD: Browse, Read,\
    \ Edit, Add, and Delete.\n\nAlthough the \"R-E-A-D\" parts map directly to \"\
    C-R-U-D\", notice that the very first letter represents a collection of entities.\n\
    \n## Why Does The N+1 Problem Occur?\n\nBy thinking first about collections of\
    \ entities, instead of only individual entities, a developer begins to consider\
    \ different approaches. Patterns such as TableGateway³, Table⁴, and even DataMapper⁵\
    \ deal with collections as a first-class part. After treating entity collections\
    \ as a first-class concern, it becomes relatively easy to build a single entity,\
    \ one that contains only a single entity.\n\nIf we can efficiently build a collection\
    \ of entities, then building a single entity is also efficient. The reverse is\
    \ simply not true, as we have seen by example.\n\n## 5. Solving N+1 With A Single\
    \ Query\n\nOne approach to solving the N+1 problem is to retrieve all the data\
    \ for the root entities, and all data for all the associations, all in one query:\n\
    \n- Issue a query that joins all necessary tables in a single result set.\n- Convert\
    \ each result row to entity objects in a PHP loop.\n\nThis approach is intuitively\
    \ appealing, because it results in only a single query no matter the number of\
    \ root entities or associations. While it works reasonably well for \"to-one\"\
    \ relationships, it is generally unsuitable for \"to-many\" relationships. Even\
    \ so, it warrants discussion, if only for completeness' sake.\n\n Handling “Many-To-One”\
    \ Relationships\n\nLet's say our blogging application needs to present a list\
    \ of the 10 most-recent blog posts and their authors. In an N+1 situation, the\
    \ relevant code might look like the following.\n\n# The Original N+1 Code\n\n\
    ```\n<?php\n// get the most recent posts\n$stmt = 'SELECT *\nFROM posts\nORDER\
    \ BY datetime DESC\nLIMIT 10';\n$stmt = $pdo->prepare($stmt);\n$stmt->execute();\n\
    $posts = $stmt->fetchAll(PDO::FETCH_CLASS, 'Post');\n\n// get the author for each\
    \ post\n$stmt = 'SELECT *\nFROM authors\nWHERE author_id = :author_id'\n$stmt\
    \ = $pdo->prepare($stmt);\nforeach ($posts as $post) {\n    $stmt->execute(array('author_id'\
    \ => $post->author_id));\n    $post->author = $stmt->fetchObject('Author');\n\
    }\n?>\n```\n\n³https://martinfowler.com/eaa/eaaCatalog/tableDataGateway.html\n\
    ⁴https://martinfowler.com/eaa/eaaCatalog/tableModule.html\n⁵https://martinfowler.com/eaa/eaaCatalog/dataMapper.html\n"
  mdcn: "\n\n## 诊断 N+1 问题\n\n在我们帖子和评论的示例中，可能会在查询日志中看到类似的内容：\n\n### N 次评论查询和 1 次帖子查询\n\
    \n```\nSELECT * FROM posts ORDER BY date DESC LIMIT 10;\nSELECT * FROM comments\
    \ WHERE comments.post_id = 936;\nSELECT * FROM comments WHERE comments.post_id\
    \ = 935;\nSELECT * FROM comments WHERE comments.post_id = 934;\nSELECT * FROM\
    \ comments WHERE comments.post_id = 933;\nSELECT * FROM comments WHERE comments.post_id\
    \ = 932;\nSELECT * FROM comments WHERE comments.post_id = 931;\nSELECT * FROM\
    \ comments WHERE comments.post_id = 929;\nSELECT * FROM comments WHERE comments.post_id\
    \ = 927;\n```\n\n如果应用程序检索两个或多个关系的数据，这种模式可能没那么明显。在“慢速报告脚本”的情况下，应用程序为每个根实体检索了五个关联实体，日志看起来如下……\n\
    \n按根实体批处理的查询\n\n```\nSELECT * FROM root_table WHERE;\nSELECT * FROM rel1 WHERE\
    \ rel1.root_id = 10324 ...;\nSELECT * FROM rel2 WHERE rel2.root_id = 10324 ...;\n\
    SELECT * FROM rel3 WHERE rel3.root_id = 10324 ...;\nSELECT * FROM rel4 WHERE rel4.root_id\
    \ = 10324 ...;\nSELECT * FROM rel5 WHERE rel5.root_id = 10324 ...;\nSELECT * FROM\
    \ rel1 WHERE rel1.root_id = 10325 ...;\nSELECT * FROM rel2 WHERE rel2.root_id\
    \ = 10325 ...;\nSELECT * FROM rel3 WHERE rel3.root_id = 10325 ...;\nSELECT * FROM\
    \ rel4 WHERE rel4.root_id = 10325 ...;\nSELECT * FROM rel5 WHERE rel5.root_id\
    \ = 10325 ...;\nSELECT * FROM rel1 WHERE rel1.root_id = 10326 ...;\nSELECT * FROM\
    \ rel2 WHERE rel2.root_id = 10326 ...;\nSELECT * FROM rel3 WHERE rel3.root_id\
    \ = 10326 ...;\nSELECT * FROM rel4 WHERE rel4.root_id = 10326 ...;\nSELECT * FROM\
    \ rel5 WHERE rel5.root_id = 10326 ...;\n```\n\n……依此类，每个根实体都有 5 次相关查询。如你所见，该模式以五行为一组进行重复，每行对应一个\
    \ rel1 到 rel5。\n\n## 诊断 N+1 问题\n\n如果查询是按关系而不是按根实体批处理，日志可能更像这样：\n\n按关系批处理的查询\n\n\
    ```\nSELECT * FROM root_table WHERE ... ;\nSELECT * FROM rel1.root_id = 10324\
    \ ...;\nSELECT * FROM rel1.root_id = 10325 ...;\nSELECT * FROM rel1.root_id =\
    \ 10326 ...;\n\nSELECT * FROM rel2.root_id = 10324 ...;\nSELECT * FROM rel2.root_id\
    \ = 10325 ...;\nSELECT * FROM rel2.root_id = 10326 ...;\n\nSELECT * FROM rel3.root_id\
    \ = 10324 ...;\nSELECT * FROM rel3.root_id = 10325 ...;\nSELECT * FROM rel3.root_id\
    \ = 10326 ...;\n\nSELECT * FROM rel4.root_id = 10324 ...;\nSELECT * FROM rel4.root_id\
    \ = 10325 ...;\nSELECT * FROM rel4.root_id = 10326 ...;\n\nSELECT * FROM rel4.root_id\
    \ = 10324 ...;\nSELECT * FROM rel4.root_id = 10325 ...;\nSELECT * FROM rel4.root_id\
    \ = 10326 ...;\n\nSELECT * FROM rel5.root_id = 10324 ...;\nSELECT * FROM rel5.root_id\
    \ = 10325 ...;\nSELECT * FROM rel5.root_id = 10326 ...\n```\n\n遗憾的是，即使我们识别出了模式，也很难发现代码库的哪部分导致了问题。我们需要在代码库中搜索与日志中显示的\
    \ SQL 字符串类似的字符串。\n\n> 如果你的数据库抽象层具有一个保留回溯轨迹的查询分析器，这样你就能知道查询的源头，那就再好不过了（Aura.Sql¹\
    \ 就是这样一个包）。即使没有，你也可以通过在你选择的某一点启动分析器，然后在稍后的一点停止分析器（并记录或转储其输出）来缩小可能的位置。\n\n¹https://github.com/auraph/Aura.Sql\n\
    \n## 更容易的查询检查\n\n如果我们有大量非平凡的根实体（超过 100 个左右），那么审查查询日志或配置文件将是一项繁重的工作。如果可能，请尝试将数据集减少到更易于管理的程度，以便日志相对较短。至少，减少数据集将缩短最初生成日志所需的时间。\n\
    \n在“慢速报告脚本”的情况下，运行脚本并获取日志需要三个小时，而日志本身将会有数十万行。这将导致非常缓慢的“修改-测试”迭代周期。意识到这一点后，我将数据集从\
    \ 200 万行减少到仅 2000 行；结果是脚本只需要构建 40 个根实体而不是 40,000 个。这样做的好处是缩短了脚本运行和生成查询日志的时间，同时也减少了日志中的行数。这意味着只需要查看\
    \ 201 行相关的日志，而不是 200,001 行。\n\n## 4. 为什么会出现 N+1 问题？\n\n为什么会出现 N+1 问题呢？在修复了几个代码库中的问题并与这些代码库的一些原始开发者交流后，我得出的结论：问题源于一种\
    \ **CRUD 式**的开发者思维。\n\n## CRUD 是问题所在\n\n我们都知道 CRUD 这个缩写：创建（Create）、读取（Read）、更新（Update）、删除（Delete）。这里的关键在于，CRUD\
    \ 主要应用于单个实体：检索单个实体、编辑和删除单个实体。\n\n这种一次处理一个的方法对于大多数数据库交互都是很有用的。它导致了如 RowDataGateway\
    \ 和 ActiveRecord? 等模式的使用。在这些模式中，重点在于如何构建单个实体（通常带有它的关联关系）。\n\n对单个实体的关注是 N+1 问题的根源。在这种思维下，开发者将构建多个实体的集合视为构建实体的变体。开发者只是对集合中的每个实体循环一次单实体的创建过程。实体集合本质上是事后考虑的。因为它们不是主要关注点，开发者自然会倾向于使用“循环内查询”，这正是\
    \ N+1 问题的标志。\n\n## B 是答案\n\n那么，解决 N+1 问题的关键在于开发者思维的转变。我们不应该以 CRUD 的方式思考，而应该以 BREAD\
    \ 的：浏览（Browse）、读取（Read）、编辑（Edit）、添加（Add）和删除（Delete）。\n\n虽然“R-E-A-D”部分直接对应“C-R-U-D”，但请注意，第一个字母代表的是实体的集合。\n\
    \n## 为什么会出现 N+1 问题？\n\n通过首先考虑实体的集合而不是只考虑单个实体，开发者开始考虑不同的方法。如 TableGateway³、Table⁴\
    \ 甚至 DataMapper⁵ 等模式将集合视为一等公民来处理。在将实体集合视为一等关注后，构建单个实体（即只包含单个实体的实体）就变得相对容易。\n\n\
    如果我们能高效地构建实体集合，那么构建单个实体也是高效的。反之则并非如此，正如我们在示例中所看到的那样。\n\n## 5. 使用单个查询解决 N+1\n\n\
    解决 N+1 问题的一种方法是在一次查询中检索所有根实体的数据以及所有关联的数据：\n\n-   发处一个查询，将所有必要的表连接到单个结果集中。\n- \
    \  在 PHP 循环中将每行结果转换为实体对象。\n\n这种方法在直觉上很有吸引力，因为无论根实体或关联的数量有多少，它只产生一个查询。虽然它对于“一对”关系效果良好，但通常对于“一对多”关系并不适用。尽管如此，为了完整性起见，它仍然值得讨论。\n\
    \n 处理“多对一”关系\n\n假设我们的博客应用程序需要展示10 篇最新的博客帖子及其作者。在 N+1 的情况下，相关代码可能如下。\n\n# 原始的 N+1\
    \ 代码\n\n```\n<?php\n// 获取最新的帖子\n$stmt = 'SELECT *\nFROM posts\nORDER BY datetime\
    \ DESC\nLIMIT 10';\n$stmt = $pdo->prepare($stmt);\n$stmt->execute();\n$posts =\
    \ $stmt->fetchAll(PDO::FETCH_CLASS, 'Post');\n\n// 获取每个帖子的作者\n$stmt = 'SELECT\
    \ *\nFROM authors\nWHERE author_id = :author_id'\n$stmt = $pdo->prepare($stmt);\n\
    foreach ($posts as $post) {\n    $stmt->execute(array('author_id' => $post->author_id));\n\
    \    $post->author = $stmt->fetchObject('Author');\n}\n?>\n```\n\n³https://martinfowler.com/eaa/eaaCatalog/tableDataGateway.html\n\
    ⁴https://martinfowler.com/eaa/eaaCatalog/tableModule.html\n⁵https://martinfowler.com/eaa/eaaCatalog/dataMapper.html\n\
    \n"
