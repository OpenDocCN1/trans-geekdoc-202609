    # Single-Query Fails With “To-Many” Relationships


    At the first single-query solution may seem like a solution for N+1 problems as
    applied to “to-many” relationships, but there are some major drawbacks.


    First, there is no reasonable way to add a LIMIT clause that works the way we
    need it to. This is because the LIMIT applies to the number of rows returned,
    and not to the number of entities represented. The difference is subtle but important.


    If we were to add LIMIT 10 to the above query, we would in fact get back 10 rows.
    But those rows would not necessarily represent 10 Post entities (at least, unless
    there was only one Comment per Post). Even variations on sub-selects for the FROM
    and JOIN clauses, with LIMIT clauses in the sub-selects, do not work the way we
    would like in “to-many” relationships.


    It turns out the only way to enforce a LIMIT involving a “to-many” relationship
    in the single-query solution is to count the entities in the PHP looping code.
    It is left to say that this is a sub-optimal approach.


    Second, if there are two or more “to-many” relationships, it becomes much more
    difficult to construct the query and then pick apart the result set to create
    the entities. The repetition becomes exponentially more troublesome, we need to
    track the existence of each related entities. In addition, the size of the result
    set becomes a problem, whether in terms of columns (because each row has every
    column for every entity) or in terms of rows (because each row repeats every data
    element for every entity, multiplied by the number of relationships).


    Overall, then, the single-query solution may be fine for “to-one” relationships,
    but is almost entirely unsuitable for any number of “to-many” relationships.'
  - '[PAGE 26]


    # 6. Solving N+1 With Query-And-Stitch


    There is an alternative to the single-query solution that is easy to implement
    and more scalable across any number of associations. This alternative is called
    "query-and-stitch."


    The query-and-stitch approach is as follows:


    +   1. Issue one query for the root collection of entities.

    2. Issue one additional query per association to get all of the associated entities
    for all of the root entities at.

    3. Stitch the associated entities into the root entities using a PHP loop.


    # Tradeoffs In Query-And-Stitch


    The key here is that we issue one additional query per relationship, not one per
    root entity. The increase in the number of queries is thus linear, not exponential.


    For example, if there are 10 entities in the root collection and 2 associations
    ...


    +   - Under N+1 we would issue 21 queries (1 for the root collection of 10 entities,
    and then 10 more queries for each of the associations). Adding a third association
    would result in a total of 31 queries (i.e., 1 more for each of the 10 root entities).

    - With the single-query solution, we might be able to retrieve the data in one
    query, but the costs of working with the result set are too high, including the
    inability to effectively LIMIT the results on the SQL side.

    - Using query-and-stitch, we issue a total of 3 queries (1 for the root collection,
    and 1 each of the associations). Adding a third association would result in a
    total of 4 queries (i.e., 1 query for the relationship).


    The query-and-stitch approach represents an effective tradeoff between N+1 and
    the single-query solution, both for "to-one" and "to-many" relationships.'
