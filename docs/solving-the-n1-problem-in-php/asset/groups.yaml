  - "[PAGE 17]\n\n# Solving N+1 With A Single Query\n\nAs with any N+1 situation,\
    \ this will issue 1 query for the root collection of entities, and then 1 query\
    \ for each association. In this case, with 10 Post entities, that means a total\
    \ of 11 queries.\n\n> As an added problem, note that the code creates a new Author\
    \ entity for each Post. If all Post entities belong to the same Author, means\
    \ there are ten copies of the Author data, none of which is authoritative. Changes\
    \ to the Author of one Post will not be reflected in what should the same Author\
    \ on another post. We will address this issue as part of the single-query solution\
    \ below.\n\n# Converting To A Single Query\n\nBecause this is a \"many-to-one\"\
    \ query, where each Post belongs to only one Author, we can consider using a single-query\
    \ approach to eliminate the N+1 problem. First, we fetch a set of rows for all\
    \ Post and Author data:\n\n```\n<php\n// get the most recent posts with their\
    \ authors\n$stmt = 'SELECT\n    posts.post_id AS post__post_id,\n    posts.author_id\
    \ AS post__author_id,\n    posts.datetime AS post__datetime,\n    posts.title\
    \ AS post__title,\n    posts.body AS post__body,\n    authors.author_id AS author__author_id,\n\
    \    authors.name AS author__name\nFROM posts\nJOIN authors ON authors.author_id\
    \ = posts.author_id\nORDER BY datetime DESC\nLIMIT 10';\n$stmt = $pdo->prepare($stmt);\n\
    $stmt->execute();\n$rows = $stmt->fetchAll(PDO::FETCH_ASSOC);\n?>\n```\n\nSome\
    \ things to note about this code:\n\n+   We no longer use SELECT *. We have to\
    \ deconflict between tables that have the same column names (in this case author_id),\
    \ and at the same time make sure we get back all the data needed to construct\
    \ the relevant entities. Here we do by aliasing each column name with a prefix\
    \ indicating the intended entity name, along with two underscores as a separator.\n\
    We add a JOIN clause for the \"to-one\" relationship, in this case joining to\
    \ the author's table."
  - "[PAGE 18]\n\n# Solving N+1 With A Single Query\n\n3. We use the PDO::FETCH_ASSOC\
    \ fetch mode instead of PDO::FETCH_CLASS. This returns an array of arrays instead\
    \ of an array of object instances. Because each row represents data for two entities,\
    \ a Post and an Author, no class is suitable for the row data. As such, we will\
    \ have to create the object instances ourselves from the row data.\n\nThe database\
    \ returns a result set that looks something like following:\n\n# Result rows with\
    \ post and author\n\n| post_id | title | author_id | name |\n| --- | --- | ---\
    \ | --- |\n| 1 | Post #1 | 1 | Author #1 |\n| 2 | Post #2 | 2 | Author #2 |\n\
    | 3 | Post #3 | 2 | Author #2 |\n| 4 | Post #4 | 1 | Author #1 |\n| 5 | Post #5\
    \ | 2 | Author #2 |\n| 6 | Post #6 | 1 | Author #1 |\n| 7 | Post #7 | 1 | Author\
    \ #1 |\n| 8 | Post #8 | 2 | Author #2 |\n| 9 | Post #9 | 2 | Author #2 |\n| 10\
    \ | Post #10 | 1 | Author #1 |\n\nNow we have the results, we loop through to\
    \ create our entity objects.\n\n```\n<?php\n$authors = array();\n$posts = array();\n\
    foreach ($rows as $row) {\n\n    // create the post entity\n    $post = new Post();\n\
    \    $post->post_id = $row['post_post_id'];\n    $post->author_id = $row['post_author_id'];\n\
    \    $post->datetime = $row['post_datetime'];\n    $post->title = $row['post_title'];\n\
    \    $post->body = $row['post_body'];\n\n    // does the author already exist?\n\
    \    $author_id = (isset($authors[$author_id])) {\n        // use the existing\
    \ author entity\n        $author = $authors[$author_id];\n    } else {\n     \
    \   // create and retain a new author entity\n        $author = new Author();\n\
    }\n```"
