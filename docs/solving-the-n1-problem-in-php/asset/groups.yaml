    Some notes about the object-creation code:


    +   1. The approach clearly involves more lines of code than allowing PDO to create
    the entity instances for us. In a less naive situation, the entity constructors
    might receive an array of data and populate themselves, or there might be an entity
    factory or builder of some sort to handle that work. Regardless, this approach
    is guaranteed to perform better than issuing 11 queries to create the Post entities
    with their associated Author entities.

    2. This solution uses unique Author associations across Post entities, unlike
    the N+1 code. While not strictly an N+1 problem, it does solve the issue of multiple
    objects representing the same author.


    With that, the solution is complete. Adding “to-one” relationships to build associated
    entities is similarly straightforward. We would add another JOIN clause, alias
    the selected column names appropriately, and then pull them out of the row in
    our entity-creation flow, tracking unique entities along the way.


    # Handling “One-To-One” Relationships


    These are pretty straightforward under the single-query approach. A plain-old
    JOIN, without any tracking of unique entities, is all we need.


    Let’s say the blogging application needs to present a list of Post entities, along
    with Summary data that tracks the number of views and number of comments. The
    retrieval and creation code would look something like this:'
