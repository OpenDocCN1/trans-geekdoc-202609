    \ 200,000 多次查询用于构建每个根实体以及其五个关联集合和实体。难怪脚本要花三个小时才完成！\n\n在发现这一点后，我能够应用书中介绍的“查询及缝合”（query-and-stitch）技术来重构实体对象的组装方式。在经过几天的重构后，我成功将加载时间从\
    \ 3 多小时缩短到不到 6 分钟。这是 30 倍的提升，而且按照典型标准来说，尽管依然很快，但对客户来说要接受得多。（随后的重构进一步缩短了加载时间。）\n\
    \n导致这个“缓慢的报告脚本”性能糟糕的原因有一个名字：N+1 问题。这个问题有各种别名，例如“1+N 问题”、“N+1 查询”、“SELECT N+1”等，但它们指的都是同一件事。\n\
    \n# 引言\n\n虽然我在《PHP 遗留应用现代化》（Modernizing Legacy Applications in PHP）¹中多次提到 N+1\
    \ 问题，但我并没有直接给出解决方案。本书弥补了这一缺陷。在这里，我们将讨论 N+1 问题的细节：\n\n- 什么是 N+1 问题，\n- 如何在你的应用程序中诊断并发现问题，\n\
    - 为什么会出现这个问题，以及\n- 如何在你的代码库中解决这个问题。\n\n# 示例应用程序\n\n虽然我无法展示“缓慢报告脚本”本身来进行对比检查，但我可以采取次优方案，展示一个通用示例。在书中，我们将使用来自简易博客系统的假设代码作为主体。在此过程中，我们将使用附录中描述的\
    \ SQL 和 PHP 结构。\n\n这是一个遗留应用示例，因此没有使用 ORM。（不同的 ORM 实现有自己的 N+1 缓解策略，我们在这里无法讨论。）\n\
    \n在没有 ORM 的情况下，这个假设的应用使用 PDO² 进行数据库抽象。并不是所有的遗留代码都使用 PDO，但关于 N+1 的原理（包括问题和解决方案）适用于所有的数据库连接库。这些包括\
    \ mysqli³、mysqli*，以及我们自己的数据库抽象层。\n\n在获取查询时，我们的应用程序尽可能使用 `PDO::FETCH_CLASS`* 模式。这导致\
    \ PDO 返回一个指定实体类的数组实例，每个实例的属性已填充了来自该行的数据。在其他系统中，你可能会单独从数据库查询创建类；我们使用 `FETCH_CLASS`\
    \ 主要是为了减少示例代码量。（实体类本身是带有公共属性的普通 PHP 对象）\n\n最后，简易代码库使用普通的 PHP 数组处理实体集合。更复杂的系统可能会使用通用类属性，但关于集合的\
    \ N+1 原理仍然是一致的。\n\n> ¹https://github.com/mlphp\n²http://php.net/PDO\n³http://php.net/mysql\n\
    ⁴http://php.net/mysqli\n⁵http://php.net/manual/pdostatement.fetch.php\n\n# 定义\
    \ N+1 问题\n\n## 通过示例说明问题\n\n通过示例来描述 N+1 问题是最简单的。假设我们的简易博客应用需要显示一个包含 10 篇最新博客文章的页面，以及每篇文章文章的所有评论。\n\
    \n首先，应用程序以数组形式获取 Post 实体的根集合：\n\n```php\n<?php\n$stm = 'SELECT *\nFROM posts\n\
    ORDER BY datetime DESC\nLIMIT 10';\n$sth = $pdo->prepare($stm);\n$sth->execute();\n\
    $posts = $sth->fetchAll(PDO::FETCH_CLASS, 'Post');\n?>\n```\n\n到目前为止良好：应用程序已执行了一个查询来构建\
    \ Post 实体的根集合。接下来，应用程序收集每个实体上的 Comment 实体：\n\n```php\n<?php\n// 准备一个语句来选择评论\n\
    $stm = 'SELECT *\nFROM comments\nWHERE post_id = :post_id';\n$sth = $pdo->prepare($stm);\n\
    foreach ($posts as $post) {\n  $sth->execute(array('post_id' => $post->post_id));\n\
    \  $post->comments = $sth->fetchAll(PDO::FETCH_CLASS, 'Comment');\n}\n?>\n```\n\
    （注：原文代码块处有格式错误，已按逻辑对齐）\n\n应用程序为每个文章执行了十次查询。通过此，我们到达了 N+1 问题的核心。\n\n# 问题定义\n\n\
    N+1 问题表现为如下：\n\n对于根集合中的每个实体，应用程序都会执行一个额外的查询来获取关联。\n\n在上面的示例中，应用程序总共执行了 11 次查询来构建\
    \ 10 个实体及其 Comment 集合：\n\n- 一个获取根集合实体的查询（这是 N+1 中的 \"1\"）\n- 为根集合中的每个实体执行的十次获取的查询（这是\
    \ N+1 中的 \"N\"，其中 \"N\" 等于根集合中的实体数量）。\n\n# 性能影响\n\nN+1 有两个性能影响：\n\n1. 查询数量随着根集合中实体数量的增加而增加。\n\
    2. 查询数量随着每个根实体所需的关联数量而增加。\n\n这意味着随着根实体和关联数量的线性增加，查询数量会按这两个者的倍数增长。每次增加的查询都会降低应用程序的响应速度。\n\
    \n# 3. 诊断 N+1 问题\n\n有两种方法可以诊断代码库中的 N+1 问题。两种方法都需要调查，并且不容易自动化。\n\n# 代码库检查\n\n首先，我们可以手动检查代码库，寻找循环内部执行的查询。这听起来可能很难，因为循环与查询可能隔得很远。例如，这个循环看起来大部分无害：\n\
    \n```php\n<?php\nforeach ($posts as $post) {\n    $helper->doSomething($post);\n\
    }\n?>\n```\n\n进一步检查，如果 `doSomething()` 方法（或它调用的任何方法）向数据库发出查询，那么我们就遇到了 N+1 问题。由于这样，可能无法立即看出问题在代码库中的来源。\n\
    \n> 真正棘手的是代码库调用了数据库的存储过程，而存储过程本身是 N+1 问题的根源。在这种情况下，我们还需要审查存储过程代码。\n\n# 日志/分析检查\n\
    \n或者，我们可以从问题的另一个端开始，审查数据库查询日志（或应用程序级查询分析器）以寻找查询中的模式。在对应用程序和底层数据有一定了解的情况下，这更容易实现，但在简单情况下，即使没有详细的应用知识，也应该是显而易见的。模式识别是这种方法成功的关键。\n\
    \n"
