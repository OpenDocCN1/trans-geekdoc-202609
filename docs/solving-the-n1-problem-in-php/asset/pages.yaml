    \ we have removed the N+1 problem. However, we still have layer-separation issues.\
    \ As a further refactoring, we would probably want to unify the query-and-stitch\
    \ logic in the domain layer and build the collection of Post entities in a better-separated\
    \ way.\n\n# Test, Commit, Push, Notify QA\n\nAfter making our changes, we need\
    \ to make sure the application still works. We do this by running our pre-existing\
    \ unit or characterization tests. If we do not have tests in place, we must browse\
    \ to or otherwise invoke the changed code.\n\nIf these tests fail, we rejoice!\
    \ We have discovered that the refactoring has errors. We now have a chance to\
    \ fix them before we deploy to production.\n\nIf the tests pass, we likewise rejoice.\
    \ We can now commit all of our new work and push it to the central repository.\
    \ Then we can notify the QA team that our better-performing code is ready for\
    \ them to review.\n\n# Do ... While\n\nOnce we have solved that occurrence of\
    \ one N+1 problem, we can start over again and look for remaining ones, and apply\
    \ the process again."
