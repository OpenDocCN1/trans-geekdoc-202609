- pgno: 29
  md: "Solving N+1 With Query-And-Stitch\n\n# Handling “Many-To-Many” Relationships\n\
    \nWe can also associate entities from a many-to-many relationship. For example,\
    \ if we need to associate a Tag collection in a many-to-many relationship for\
    \ each Post, we could do something like:\n\n```\n<?php\n// fetch all tags through\
    \ a `posts_tags` association table\n$stmt = \"SELECT\n    posts_tags.post_id AS\
    \ post_id,\n    tags.*\nFROM tags\nJOIN posts_tags ON posts_tags.tag_id = tags.tag_id\n\
    WHERE posts_tags.post_id IN ({$quoted_post_ids})\";\n\n$stmt = $pdo->prepare();\n\
    $stmt->execute();\n$tag_entities = $stmt->fetchAll(PDO::FETCH_CLASS, 'Tag');\n\
    \n// stitch the tag into the posts\nforeach ($tag_entities as $tag) {\n    $post_id\
    \ = $tag->post_id;\n    $tag_id = $tag->tag_id;\n    $posts[$post_id]->tags[$tag_id]\
    \ = $tag;\n}\n?>\n```\n\n> Note that we do not capture the association table mapping\
    \ data itself. For that, we would need another query, and another entity to retain\
    \ the data.\n\nUsing the query-and-stitch technique, we have issued a total of\
    \ 3 queries, and used a total of 4 loops, to get the root entity IDs and stitch\
    \ together two associations (comments and tags). In an N+1 situation, would have\
    \ used a single loop in the PHP code, but we would have issued a total of 21 queries.\
    \ The performance of the multiple PHP loops is practically guaranteed to be better\
    \ than the performance of 21 queries.\n\n# Handling “Many-To-One” Relationships\n\
    \nIf we want to add a “many-to-one” relationship, sometimes called a “belongs-to”\
    \ association, the query-and-stitch logic is somewhat more complex. We need to\
    \ build a collection of unique associated entities, then stitch the associated\
    \ entities into the root collection. We do not want to create multiple"
  merge: -1
  img_proc: true
- pgno: 30
  md: "# Solving N+1 With Query-And-Stitch\n\ncopies of each associated entity in\
    \ this case, each is represented by the same backing database row.\n\nFor example,\
    \ if each Post belongs to an Author, we need to collect the unique Author entities\
    \ first, then stitch them into the Post collection. If one Author is associated\
    \ with multiple Post entities, changing the Author data through one Post will\
    \ be reflected in all other Post entities with that same Author.\n\n```\n<?php\n\
    // get the unique author_id values from the posts collection\nquoted_author_ids\
    \ = array();\nforeach ($posts as $post) {\n    $quoted_author_ids[] = $pdo->quote($post->author_id);\n\
    }\n$quoted_author_ids = implode(',', array_unique($quoted_author_ids));\n\n//\
    \ fetch all authors into the posts collection\n$stmt = \"SELECT *\nFROM authors\n\
    WHERE author_id IN ($quoted_author_ids)\";\n\n$stmt = $pdo->prepare();\n$stmt->execute();\n\
    $author_entities = $stmt->fetchAll(PDO::FETCH_CLASS, 'Author');\n\n// key all\
    \ authors collection on its identity values\n$authors = array();\nforeach ($author_entities\
    \ as $author) {\n    $author_id = $author->author_id;\n    $authors[$author_id]\
    \ = $author;\n}\n\n// stitch the author entities into the posts\nforeach ($posts\
    \ as $post) {\n    $author_id = $post->author_id;\n    $post->author = $authors[$author_id];\n\
    }\n?>\n```\n\nThe Author is the third association we have added to each Post (the\
    \ others were Comment and Tag associations). In doing so we have added only 1\
    \ query, for a total of 4. In this case, there were two additional loops, one\
    \ to create the Author collection and to stitch each Author into its associated\
    \ Post."
  merge: -1
  img_proc: true
- pgno: 31
  md: "# Handling “One-To-One” Relationships\n\nAdding a \"one-to-one\" relationship\
    \ is the simplest case to deal with. We add one more query, and one more loop,\
    \ to fetch the associations for the root collection all, and stitch them into\
    \ the root collection. There's no need for uniqueness tracking as \"many-to-one\"\
    , but we need to key the associated entities on their foreign key values.\n\n\
    Let's say we want to bring in the Summary entry for each Post for the view and\
    \ comment counts:\n\n```\n<?php\n // fetch all summaries for the post collection\n\
    \ $stmt = \"SELECT *\n FROM summaries\n WHERE post_id IN ({$quoted_post_ids})\"\
    ;\n\n $sth = $pdo->prepare();\n $sth->execute();\n $summary_entities = $sth->fetchAll(PDO::FETCH_CLASS,\
    \ 'Summary');\n\n // key a summaries collection on its foreign key values\n $summaries\
    \ = array();\n foreach ($summary_entities as $summary) {\n $post_id = $summary->post_id;\n\
    \ $summaries[$post_id] = $summary;\n}\n\n // stitch the summaries into the posts\n\
    \ foreach ($posts as $post) {\n $post_id = $post->post_id;\n $post->summary =\
    \ $summaries[$post_id];\n}\n ?>\n```\n\nThe Summary marks the fourth association\
    \ for the root collection of Post entities."
  merge: -1
  img_proc: true
- pgno: 32
  md: "# Performance Implications\n\nLet's tally up our query and loop counts:\n\n\
    +   * A total of 5 queries: 1 for the root collection, and 1 for each of the Comment,\
    \ Tag, Author, and Summary associations\n* A total of 9 loops:\n  - 1 to key the\
    \ Post collection on its key values,\n  - 1 each to rekey the Author and Summary\
    \ collections on their key values\n  - 1 each to create the quoted comma-separated\
    \ values for the post_id and author_id lists\n  - 1 each to stitch the Comment,\
    \ Tag, Author, and Summary associations into the root collection\n\nBy contrast,\
    \ an N+1 situation with 10 Post entities in the root collection would have had\
    \ only one loop, but would have issued 41 queries. The query-and-stitch solution\
    \ is certainly more lines of code, but its performance is much better than N+1\
    \ because of the reduced number of queries."
  merge: -1
  img_proc: true
- pgno: 33
  md: '# 7. Refactoring The Codebase To Remove N+1 Problems


    Now that we have discussed solutions for N+1 problems, we can begin to remove
    them from our codebase. We need not rewrite the entire application; instead, we
    can incrementally improve the codebase through [refactoring].


    # Prerequisites


    Before we get started, we should have some prerequisites in place.


    Most importantly, we should have tests of some sort for our application, or at
    least for the parts we are going to modify. These tests will help us assure that
    any changes we make while removing N+1 problems do not break the application.
    These need not be unit tests, [Characterization tests] will just do fine. If nothing
    else, make friends with your QA team and apply their acceptance tests to your
    changes.


    If we are not using a revision version control system, such as Git, now would
    be an excellent time to start. We should do our work in a separate branch, not
    in the same branch as the main thrust of development work. We can merge our changes
    after we know they work properly.


    We need to be able to work in short iteration loops while diagnosing and resolving
    our database-interaction loops. This means we need access to the database itself,
    even if only a local copy, with a representative set of data for the querying
    testing. This is in addition to a working installation of the application code,
    of course.


    Finally, if you have not [Modernizing Legacy Applications in PHP] and applied
    its formula to your codebase, you should consider doing so. While not strictly
    required, it will be very helpful. This is because we want to work on a codebase
    that has a good separation of concerns in place. If the database code is mixed
    in business logic and presentation, it is going to be that much more difficult
    to pick apart (and test!) the SQL queries contributing to our N+1 problems.'
  merge: -1
  img_proc: true
- pgno: 34
  md: "# The Process\n\nThe general process for resolving N+1 problems is as follows:\n\
    \n+   1. Diagnose the existence of an N+1 problem and discover its location in\
    \ the codebase.\n2. Determine the nature of the N+1 code:\n    - If root collection\
    \ and the associations are all built together, we should be able to refactor the\
    \ code in place.\n    - On the other hand, if the root collection is built in\
    \ one location, and the associations are built elsewhere, we must either modify\
    \ the code in different locations, or collect it into a single location.\n3. Once\
    \ the N+1 problem is resolved, test or spot-check the application to make sure\
    \ it still works.\n4. Commit the changes, push them to the central repository,\
    \ and notify QA.\n5. Diagnose the existence of any remaining N+1 problems, and\
    \ start the process over again.\n\nSince we have already gone over the diagnosis\
    \ and discovery techniques for N+1 problems, we can proceed to determining the\
    \ nature of the discovered N+1 code.\n\n# N+1 In A Single Location\n\nThis is\
    \ the easiest variation of N+1 to resolve. In this case, the root collection of\
    \ entities and all the associations are built in a single function, method, or\
    \ class. It will look something like our earlier posts-and-comments examples,\
    \ and we can apply the single-query solution and/or the query-and-stitch directly\
    \ on the code as it is.\n\n# N+1 Across Separated Locations\n\nThis is a more\
    \ difficult variation of N+1, one that can be prevalent in modernized codebases.\
    \ Here, the root collection of entities is built in one location in the codebase,\
    \ but the associations are built in a separate location.\n\nFor example, if our\
    \ business-logic builds a collection of Post entities ..."
  merge: -1
  img_proc: true
