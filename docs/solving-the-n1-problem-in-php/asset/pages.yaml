- pgno: 12
  md: '# Diagning N+1 Problems


    If the queries are batched per-relationship, instead of per-root-entity, the log
    might look more like this:


    Queries batched per relationship


    ```

    SELECT * FROM root_table WHERE ... ;

    SELECT * FROM rell1.root_id = 10324 ...;

    SELECT * FROM rell1.root_id = 10325 ...;

    SELECT * FROM rell1.root_id = 10326 ...;


    SELECT * FROM rell2.root_id = 10324 ...;

    SELECT * FROM rell2.root_id = 10325 ...;

    SELECT * FROM rell2.root_id = 10326 ...;


    SELECT * FROM rell3.root_id = 10324 ...;

    SELECT * FROM rell3.root_id = 10325 ...;

    SELECT * FROM rell3.root_id = 10326 ...;


    SELECT * FROM rell4.root_id = 10324 ...;

    SELECT * FROM rell4.root_id = 10325 ...;

    SELECT * FROM rell4.root_id = 10326 ...;


    SELECT * FROM rel4.root_id = 10324 ...;

    SELECT * FROM rell4.root_id = 10325 ...;

    SELECT * FROM rell4.root_id = 10326 ...;


    SELECT * FROM rell5.root_id = 10324 ...;

    SELECT * FROM rell5.root_id = 10325 ...;

    SELECT * FROM rell5.root_id = 10326 ...

    ```


    Unfortunately, even when we recognize a pattern, it may be difficult to discover
    what part of the codebase is causing the problem. We will need to search the codebase
    for SQL strings similar to the ones showing up in the logs.


    > If your database abstraction layer has a query profiler that retains a backtrack,
    so that you can tell where the query originates, so much the better (Aura.Sql¹
    is one package). Even if it does not, you can narrow down the possible locations
    by starting the profiler at a point of your choosing, then stopping the profiler
    (and logging or dumping its output) at a later point.


    ¹https://github.com/auraph/Aura.Sql'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Easier Query Examination


    If we have a non-trivial number of root entities, more than 100 or so, reviewing
    the query logs or profiles will be a heavy undertaking. If at all possible, try
    to reduce the data set to something more manageable, so that the logs are relatively
    short. At the very least, reducing the data set will decrease the amount of time
    it takes to generate the logs in the first place.


    In the case of the Slow Reporting Script, it would have taken three hours to run
    the script and get a log, and the log itself would have been hundreds of thousands
    of lines. That would have for a very slow “change-and-retest” iteration cycle.
    Realizing this, I reduced the data set from 2 million rows to just 2 thousand;
    as a result, the script had to build only 40 root entities instead of 40,000.
    This had the benefit reducing the time for the script to run and to generate the
    query log, as well as reducing the number of lines in the log. That meant looking
    through only 201 relevant log lines, instead of 200,001.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# 4. Why Does The N+1 Problem Occur?


    Why is it that the N+1 problem appears at all? After fixing the problem in several
    codebases, and talking with some of the original developers on those codebases,
    I have concluded that the problem stems from a CRUD-dy developer mindset.


    # CRUD Is The Problem


    We all know the CRUD acronym: Create, Read, Update, Delete. The key here is that
    CRUD applies primarily to single entity, retrieve a single entity, edit and delete
    a single entity.


    This one-at-a-time approach is useful for the vast majority of database interactions.
    It leads to using such patterns as RowDataGateway and ActiveRecord?. In these,
    the concentration is on how to build a single entity, usually with its associations.


    The single-entity concentration is the source of the N+1 problem. With that mindset,
    developers approach building a collection of multiple entities as a variation
    on building entities. The developer just loops over the single-entity creation
    process once for each entity in the collection. Collections of entities are essentially
    an afterthought. Because they are not a primary focus, the developer naturally
    gravitates towards queries-inside-loops, the hallmark of the N+1 problem.


    # B Is The Answer


    The key to solving the N+1 problem, then, begins with a change in developer mindset.
    Instead of thinking in terms of CRUD, we should think in terms of BREAD: Browse,
    Read, Edit, Add, and Delete.


    Although the "R-E-A-D" parts map directly to "C-R-U-D", notice that the very first
    letter represents a collection of multiple entities. Dealing with collections
    is the very first thing to think about with a BREAD mindset.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Why Does The N+1 Problem Occur?


    By thinking first about how to build collections of entities, instead of only
    individual entities, a developer begins to consider different approaches for entity
    storage and retrieval. Patterns such as TableDataGateway³, TableModule⁴, and even
    DataMapper⁵ implementations deal with collections of entities as a first-class
    part of the application. Collections are no longer an afterthought; instead, they
    are among the earliest considerations.


    After treating entity collections as a first-class concern, it becomes relatively
    easy to build a single entity, one that contains only a single entity. Thus, the
    process to build one entity becomes identical to the process of building hundreds
    of them, and obviates the N+1 problem from the start.


    Thus, if we can efficiently build a collection of entities, then building a single
    entity is also reasonably efficient. The reverse is simply not true, as we have
    seen by example.


    > ³http://martinfowler.com/eaa/eaaCatalog/tableDataGateway.html

    ⁴http://martinfowler.com/eaa/eaaCatalog/tableModule.html

    ⁵http://martinfowler.com/eaa/eaaCatalog/dataMapper.html'
  merge: -1
  img_proc: true
- pgno: 16
  md: "# 5. Solving N+1 With A Single Query\n\nOne approach to solving the N+1 problem\
    \ is to retrieve all the data for the root entities, and all data for all the\
    \ associations, all in one query:\n\n+   - Issue a query that joins all necessary\
    \ tables in a single result set.\n- Convert each result row to entity objects\
    \ in a PHP loop.\n\nThis approach is intuitively appealing, because it results\
    \ in only a single query no matter the number of root entities or associations.\
    \ While it works reasonably well for \"to-one\" relationships, it is generally\
    \ unsuitable for \"to-many\" relationships. Even so, it warrants discussion, if\
    \ only for completeness' sake.\n\n# Handling “Many-To-One” Relationships\n\nLet's\
    \ say our blogging application needs to present a list of the 10 most-recent blog\
    \ posts and their authors. In an N+1 situation, the relevant code might look like\
    \ the following.\n\n# The Original N+1 Code\n\n```\n<?php\n// get the most recent\
    \ posts\n$stmt = 'SELECT *\nFROM posts\nORDER BY datetime DESC\nLIMIT 10';\n$stmt\
    \ = $pdo->prepare($stmt);\n$stmt->execute();\n$posts = $stmt->fetchAll(PDO::FETCH_CLASS,\
    \ 'Post');\n\n// get the author for each post\n$stmt = 'SELECT *\nFROM authors\n\
    WHERE author_id = :author_id'\n$stmt = $pdo->prepare($stmt);\nforeach ($posts\
    \ as $post) {\n    $stmt->execute(array('author_id' => $post->author_id));\n \
    \   $post->author = $stmt->fetchObject('Author');\n}\n?>\n```"
  merge: -1
  img_proc: true
- pgno: 17
  md: "# Solving N+1 With A Single Query\n\nAs with any N+1 situation, this will issue\
    \ 1 query for the root collection of entities, and then 1 query for each association.\
    \ In this case, with 10 Post entities, that means a total of 11 queries.\n\n>\
    \ As an added problem, note that the code creates a new Author entity for each\
    \ Post. If all Post entities belong to the same Author, means there are ten copies\
    \ of the Author data, none of which is authoritative. Changes to the Author of\
    \ one Post will not be reflected in what should the same Author on another post.\
    \ We will address this issue as part of the single-query solution below.\n\n#\
    \ Converting To A Single Query\n\nBecause this is a \"many-to-one\" query, where\
    \ each Post belongs to only one Author, we can consider using a single-query approach\
    \ to eliminate the N+1 problem. First, we fetch a set of rows for all Post and\
    \ Author data:\n\n```\n<php\n// get the most recent posts with their authors\n\
    $stmt = 'SELECT\n    posts.post_id AS post__post_id,\n    posts.author_id AS post__author_id,\n\
    \    posts.datetime AS post__datetime,\n    posts.title AS post__title,\n    posts.body\
    \ AS post__body,\n    authors.author_id AS author__author_id,\n    authors.name\
    \ AS author__name\nFROM posts\nJOIN authors ON authors.author_id = posts.author_id\n\
    ORDER BY datetime DESC\nLIMIT 10';\n$stmt = $pdo->prepare($stmt);\n$stmt->execute();\n\
    $rows = $stmt->fetchAll(PDO::FETCH_ASSOC);\n?>\n```\n\nSome things to note about\
    \ this code:\n\n+   We no longer use SELECT *. We have to deconflict between tables\
    \ that have the same column names (in this case author_id), and at the same time\
    \ make sure we get back all the data needed to construct the relevant entities.\
    \ Here we do by aliasing each column name with a prefix indicating the intended\
    \ entity name, along with two underscores as a separator.\nWe add a JOIN clause\
    \ for the \"to-one\" relationship, in this case joining to the author's table."
  merge: -1
  img_proc: true
- pgno: 18
  md: "# Solving N+1 With A Single Query\n\n3. We use the PDO::FETCH_ASSOC fetch mode\
    \ instead of PDO::FETCH_CLASS. This returns an array of arrays instead of an array\
    \ of object instances. Because each row represents data for two entities, a Post\
    \ and an Author, no class is suitable for the row data. As such, we will have\
    \ to create the object instances ourselves from the row data.\n\nThe database\
    \ returns a result set that looks something like following:\n\n# Result rows with\
    \ post and author\n\n| post_id | title | author_id | name |\n| --- | --- | ---\
    \ | --- |\n| 1 | Post #1 | 1 | Author #1 |\n| 2 | Post #2 | 2 | Author #2 |\n\
    | 3 | Post #3 | 2 | Author #2 |\n| 4 | Post #4 | 1 | Author #1 |\n| 5 | Post #5\
