- pgno: 37
  md: "# Unify Query-And-Stitch Logic\n\nThe inline approach is fine for legacy codebases,\
    \ but it is messy. If we have a more modern codebase with well-separated layers,\
    \ we would do better to extract the separated association-building logic to an\
    \ appropriate layer. This is by far the preferred approach.\n\nFor example, let's\
    \ say we have a PostsMapper and a CommentsMapper:\n\nMapper classes\n\n```\n<?php\n\
    class PostsMapper\n{\n    protected $pdo;\n\n    public function fetchRecentPosts()\n\
    \    {\n        $stm = 'SELECT * FROM posts ORDER BY datetime DESC LIMIT 10';\n\
    \        $sth = $this->pdo->prepare($stm);\n        $sth->execute();\n       \
    \ $posts = $sth->fetchAll(PDO::FETCH_CLASS, 'Post');\n        return $posts;\n\
    \    }\n}\n\nclass CommentsMapper\n{\n    protected $pdo;\n\n    public function\
    \ fetchCommentsForPost($post_id)\n    {\n        $stm = 'SELECT * FROM comments\
    \ WHERE post_id = :post_id';\n        $sth = $this->pdo->prepare($stm);\n    \
    \    $sth->execute(array('post_id' => $post_id));\n        $comments = $sth->fetchAll(PDO::FETCH_CLASS,\
    \ 'Comment');\n        return $comments;\n    }\n?>\n```"
  merge: -1
