- pgno: 26
  md: '# 6. Solving N+1 With Query-And-Stitch


    There is an alternative to the single-query solution that is easy to implement
    and more scalable across any number of associations. This alternative is called
    "query-and-stitch."


    The query-and-stitch approach is as follows:


    +   1. Issue one query for the root collection of entities.

    2. Issue one additional query per association to get all of the associated entities
    for all of the root entities at.

    3. Stitch the associated entities into the root entities using a PHP loop.


    # Tradeoffs In Query-And-Stitch


    The key here is that we issue one additional query per relationship, not one per
    root entity. The increase in the number of queries is thus linear, not exponential.


    For example, if there are 10 entities in the root collection and 2 associations
    ...


    +   - Under N+1 we would issue 21 queries (1 for the root collection of 10 entities,
    and then 10 more queries for each of the associations). Adding a third association
    would result in a total of 31 queries (i.e., 1 more for each of the 10 root entities).

    - With the single-query solution, we might be able to retrieve the data in one
    query, but the costs of working with the result set are too high, including the
    inability to effectively LIMIT the results on the SQL side.

    - Using query-and-stitch, we issue a total of 3 queries (1 for the root collection,
    and 1 each of the associations). Adding a third association would result in a
    total of 4 queries (i.e., 1 query for the relationship).


    The query-and-stitch approach represents an effective tradeoff between N+1 and
    the single-query solution, both for "to-one" and "to-many" relationships.'
  merge: -1
  img_proc: true
- pgno: 27
  md: "# Handling “One-To-Many” Relationships\n\nThe following is a rewritten version\
    \ of our earlier posts-comments example using the query-and-stitch technique.\
    \ The query to fetch the master set of Post entities is identical, but note that\
    \ we follow it by creating a root collection keyed on the post_id identity values\
    \ (i.e., instead of sequential keys).\n\n```\n<?php\n// fetch the sequentially-indexed\
    \ post entities\n$stmt = 'SELECT\nFROM posts\nORDER BY datetime DESC\nLIMIT 10';\n\
    $stmt = $pdo->prepare($stmt);\n$stmt->execute();\n$post_entities = $stmt->fetchAll(PDO::FETCH_CLASS,\
    \ 'Post');\n\n// reindex the entities on their primary key values\n$posts = array();\n\
    foreach ($post_entities as $post) {\n    $post_id = $post->post_id;\n    $posts[$post_id]\
    \ = $post;\n}\n?>\n```\n\nSome notes about this code:\n\n+   1. We are back to\
    \ using PDO::FETCH_CLASS and letting PDO create the entity instances for us.\n\
    2. We key a new $posts collection array on the post_id values so that later we\
    \ can easily look up a specific Post by its primary key. While it's tempting to\
    \ change the array keys of the original result set we might unintentionally overwrite\
    \ an existing key, which would be counterproductive and difficult to debug.\n\
    3. Instead of using a loop to key the $posts collection on the post_id of each\
    \ entity, we could use $stmt->setFetchMode(PDO::FETCH_CLASS|PDO::FETCH_UNIQUE,\
    \ 'Post'). While that would automatically key column on the first column of each\
    \ returned row, it would also unset column from the row. In turn means each Post\
    \ would no longer have its post_id value as a property.\n\nNow that we have our\
    \ collection of Post entities keyed on their identity values, we fetch all the\
    \ Comment entities for the entire $posts collection in a single query."
  merge: -1
  img_proc: true
- pgno: 28
  md: "# Solving N+1 With Query-Stitch\n\n```\n<?php\n// create a comma-separated\
    \ list of quoted post_id values\n$quoted_post_ids = [];\nforeach (array_keys($posts)\
    \ as $post_id) {\n    $quoted_post_ids[] = $pdo->quote($post_id);\n}\n$quoted_post_ids\
    \ = implode(',', $quoted_post_ids);\n\n// fetch all the comments for the posts\n\
    $stmt = \"SELECT \nFROM comments\nWHERE post_id IN ($quoted_post_ids)\";\n$stmt\
    \ = $pdo->prepare($stmt);\n$stmt->execute();\n$comment_entities = $stmt->fetchAll(PDO::FETCH_CLASS,\
    \ 'Comment');\n?>\n```\n\n> The comment-coding feature creates a comma-separated\
    \ list of post_id values for the use in the IN clause. Normally we would prefer\
    \ to use placeholder binding, but unfortunately PDO does not bind arrays. Further,\
    \ quote() does not convert arrays to quoted-separated values. As much, we must\
    \ create the quoted set of comma-separated values. (Some database access libraries\
    \ do bind arrays as comma-separated values, such as AuraSql. If you are using\
    \ one of them, so much the better.\n\nFinally, we commit the Comment entries into\
    \ the root collection of Post entities. Because the $posts collection is keyed\
    \ on post_id values, it is easy to match each Comment to each Post.\n\n```\n<?php\n\
    foreach ($comment_entities as $comment) {\n    $post_id = $comment->post_id;\n\
    \    $comment_id = $comment->comment_id;\n    $posts[$post_id]->comments[$comment_id]\
    \ = $comment;\n}\n?>\n```\n\nVoila: we have used a total of two queries and two\
    \ loops to create the root collection of Post entities with their associated Comment\
    \ collections.\n\nAlthough we are still loops, the important distinction is that\
    \ we are not using queries inside the loops. The loops that stitch the associated\
    \ entities into the root collection are very fast compared to running queries\
    \ inside those loops.\n\nhttps://github.com/aurasphp/AuraSql"
  merge: -1
