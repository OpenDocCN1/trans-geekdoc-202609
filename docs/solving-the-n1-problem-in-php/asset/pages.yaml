    \ into a single query. When we get the results, we can pick up each row by building\
    \ the creation logic as well:\n\n```\n<?php\n$authors = array();\n$posts = array();\n\
    foreach ($rows as $row) {\n\n    // create the post entity\n    $post = new Post();\n\
    \    $post->post_id = $row['post_id'];\n    $post->author_id = $row['author_id'];\n\
