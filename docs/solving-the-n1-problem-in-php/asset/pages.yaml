- pgno: 6
  md: '# 1. Introduction


    # The Slow Reporting Script


    The web page was taking three hours to load. Let that sink in for a moment: three
    hours. The code backing the page was a reporting script written in PHP, attempting
    to build 40,000 entity objects from 2 million database rows. Sometimes the page
    never loaded at all. At least the client could tell when it failed, because a
    big ugly error popped up in the browser window. Unfortunately that was also around
    the three hour point. The client was understandably frustrated.


    I was assigned to troubleshoot the problem. It turned out the cause was not that
    the database was optimized. It was not the number of rows being returned. It was
    not even the number of objects being built.


    No, the cause was the number of queries being issued from the reporting script.
    The high volume of queries, in turn, was a result of how the script was assembling
    the entity objects. When I say "high volume", I mean two hundred thousand and
    one queries. These 200,000+ queries were used to build each root entity along
    with each of its five associated collections and entities. No wonder the script
    was taking three hours to finish!


    After discovering this, I was able to apply the "query-and-stitch" technique presented
    in this book to refactor how the entity objects were assembled. Over the course
    of a few days of refactoring I was able to reduce the load time from 3+ hours
    to just under 6 minutes. That''s a 30x improvement, and still so by typical standards,
    it was much more bearable for the client. (Later refactorings improved the load
    time ever.)


    The causes leading to the terrible performance of the Slow Reporting Script have
    a name: N+1 Problem. The problem has various aliases, such as the "1+N problem",
    "N+1 queries", "SELECT N+1", and so on, but they all refer to the same thing.'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# Introduction


    While I mention the N+1 problem more than once in Modernizing Legacy Applications
    in PHP¹, I did not address a solution directly. This book remedies it. Here, we
    will discuss the specifics of the N+1 problem:


    +   - what the N+1 problem is,

    - how to diagnose and discover the problem in your application,

    - why the problem occurs, and

    - how to solve the problem in your codebase.


    # Example Application


    While I cannot present the Slow Reporting Script itself for before-and-after examination,
    I can do the next best thing and present a generic example. In this book, we will
    use hypothetical code from naive blogging as our subject. In doing so, we will
    use the SQL and PHP structures described in the appendix.


    This will be a legacy application example, so there is no use of ORMs. (Different
    ORM implementations have their own N+1 mitigation strategies, which we cannot
    discuss here.)


    Without an ORM, this hypothetical application uses PDO² for its database abstraction.
    Not all legacy code uses PDO, but the principles regarding N+1 (both the problem
    and solutions) apply to all database connection libraries. These include mysqli³,
    mysqli*, as well as usland database abstraction layers.


    When fetching query, our application uses the PDO::FETCH_CLASS* mode as much as
    possible. This causes PDO to return an array instance of a specified entity class,
    each with its properties already filled with the data from one row. With other
    systems, you are likely to create the class separately from the database query;
    we use FETCH_CLASS primarily to reduce the volume of the example code. (The entity
    classes themselves are plain PHP objects with public properties)


    Finally, the naive codebase uses plain PHP arrays for entity collections. More
    sophisticated systems may use generic class properties, but the principles concerning
    N+1 regarding collections remain the same.


    > ¹https://github.com/mlphp

    ²http://php.net/PDO

    ³http://php.net/mysql

    ⁴http://php.net/mysqli

    ⁵http://php.net/manual/pdostatement.fetch.php'
  merge: -1
  img_proc: true
- pgno: 8
  md: "# # Defining The N+1 Problem\n\n# ## The Problem By Example\n\nIt is easiest\
    \ to describe the N+1 problem by example. Let's say that our naive blog application\
    \ needs to show a page of the 10 most recent blog posts, along with all the comments\
    \ on each post.\n\nFirst, the application retrieves the root collection of Post\
    \ entities as an array:\n\n```\n<?php\n$stm = 'SELECT *\nFROM posts\nORDER BY\
    \ datetime DESC\nLIMIT 10';\n$sth = $pdo->prepare($stm);\n$sth->execute();\n$posts\
    \ = $sth->fetchAll(PDO::FETCH_CLASS, 'Post');\n?>\n```\n\nSo far so good: the\
    \ application has issued one query to build the root collection of Post entities.\\\
    Next, the application collects the Comment entities on each entity:\n\n```\n<?php\n\
    // prepare a statement to select the comments\n$stm = 'SELECT *\nFROM comments\n\
    WHERE post_id = :post_id';\n$sth = $pdo->prepare($stm);\nforeach ($posts as $post)\
    \ {\n  $sth->execute(array('post_id' => $post->post_id));\n  $post->comments =\
    \ $sth->fetchAll(PDO::FETCH_CLASS, 'Comment');\n}\n?>\n```\n\nThe application\
    \ has issued ten queries to build the comments for each post. With this, we have\
    \ arrived at the core of the N+1 Problem."
  merge: -1
  img_proc: true
- pgno: 9
  md: '# The Problem Defined


    The N+1 problem is revealed as the following:


    For each entity in a root collection, the application issues one additional query
    to retrieve each association for each entity.


    In the above example, the application issued a total of 11 queries to build up
    a collection of 10 Post entities with their associated Comment collections:


    +   - one query to fetch the ten entities in the root collection (this is the
    "1" in "N+1")

    - ten more queries, for each entity in the root collection, to fetch the associations
    (this is the "N" in "N+1", where "N" equals the number of entities in the root
    collection).


    # Performance Implications


    There are two performance implications of the N+1 problem:


    +   1. The number of queries grows as a factor of the number of entities in the
    root collection.

    2. The number of queries *also* grows as a factor of the number of associations
    needed to complete each root entity.


    This means that as the number of root entities and number of relationships increase
    *linearly*, the number of queries increases as a *multiple* of those two numbers.
    Each added query reduces the responsiveness of the application.'
  merge: -1
  img_proc: true
- pgno: 10
  md: "# 3. Diagnosing N+1 Problems\n\nThere are two methods to diagnose occurrences\
    \ of the N+1 problem in a codebase. Both methods are a matter of detective work,\
    \ and are not especially amenable to automation.\n\n# Codebase Examination\n\n\
    First, we can examine the codebase manually to look for queries being executed\
    \ inside loops. This can be tougher than it sounds, since the loop may be widely\
    \ separated from the query. For example, this loop looks mostly harmless:\n\n\
    ```\n<?php\nforeach ($posts as $post) {\n    $helper->doSomething($post);\n}\n\
    ?>\n```\n\nOn further examination, if the doSomething() method (or one of the\
    \ methods it calls in turn) issues a query to the database, then we have an N+1\
    \ problem on our hands. As such, it may not be immediately obvious where the problem\
    \ originates in the codebase.\n\n> What can be really pernicious is when the codebase\
    \ makes a database call to a stored procedure, and the stored procedure itself\
    \ is the origin of the N+1 problem. In that case, we will need to review the stored\
    \ procedure code as well.\n\n# Log/Profile Examination\n\nAlternatively, we can\
    \ start at the other end of the problem, and review the database query logs (or\
    \ an application-level query profiler) to look for patterns in the queries. This\
    \ is easier to achieve with some amount of knowledge of the application and the\
    \ underlying data, but in simple cases it should be relatively obvious even without\
    \ detailed application knowledge. Pattern recognition is the key to success with\
    \ this approach."
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Diagnosing N+1 Problems


    In the case of our posts-and-comments example, we might see something like this
    in the query logs:


    # N Comment queries and 1 Post query


    ```

    SELECT * FROM posts ORDER BY date DESC LIMIT 10;

    SELECT * FROM comments WHERE comments.post_id = 936;

    SELECT * FROM comments WHERE comments.post_id = 935;

    SELECT * FROM comments WHERE comments.post_id = 934;

    SELECT * FROM comments WHERE comments.post_id = 933;

    SELECT * FROM comments WHERE comments.post_id = 932;

    SELECT * FROM comments WHERE comments.post_id = 931;

    SELECT * FROM comments WHERE comments.post_id = 929;

    SELECT * FROM comments WHERE comments.post_id = 927;

    ```


    If the application retrieves data for two or more relationships, the pattern might
    be less obvious. In the case of the Slow Reporting Script, where the application
    retrieved five associated entities for each root entity, the logs looked like
    this...


    Queries batched per root entity


    ```

    SELECT * FROM root_table WHERE;

    SELECT * FROM rel1 WHERE rel1.root_id = 10324 ...;

    SELECT * FROM rel2 WHERE rel2.root_id = 10324 ...;

    SELECT * FROM rel3 WHERE rel3.root_id = 10324 ...;

    SELECT * FROM rel4 WHERE rel4.root_id = 10324 ...;

    SELECT * FROM rel5 WHERE rel5.root_id = 10324 ...;

    SELECT * FROM rel1 WHERE rel1.root_id = 10325 ...;

    SELECT * FROM rel2 WHERE rel2.root_id = 10325 ...;

    SELECT * FROM rel3 WHERE rel3.root_id = 10325 ...;

    SELECT * FROM rel4 WHERE rel4.root_id = 10325 ...;

    SELECT * FROM rel5 WHERE rel5.root_id = 10325 ...;

    SELECT * FROM rel1 WHERE rel1.root_id = 10326 ...;

    SELECT * FROM rel2 WHERE rel2.root_id = 10326 ...;

    SELECT * FROM rel3 WHERE rel3.root_id = 10326 ...;

    SELECT * FROM rel4 WHERE rel4.root_id = 10326 ...;

    SELECT * FROM rel5 WHERE rel5.root_id = 10326 ...;

    ```


    ... and so, with 5 related queries for each of the root entities. As you can see,
    the pattern repeats over groups of five lines, one for each rel1 through rel5.'
  merge: -1
