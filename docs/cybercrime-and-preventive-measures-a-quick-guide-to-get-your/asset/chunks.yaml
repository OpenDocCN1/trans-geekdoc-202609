    \ about your trip or vacation plans on social media.    Avoid tagging pictures\
    \ with dates, times, and locations.    Never open emails and attachments from\
    \ suspicious sources.    Never share your OTP even if the fraudster says they're\
    \ calling directly from a bank.    Never install any application told by strangers\
    \ on call unless you know it is known and safe.    Avoid entering credit/debit\
    \ card information even on IVR.    Always be suspicious while reading tempting\
    \ offers.    Never follow any steps listed for availing of an offer.    Before\
    \ installing any free software/application on your laptop/phone, make sure to\
    \ uncheck all unnecessary sections, clauses to prevent the installation of anything\
    \ other than what you intended to.    Keep your antivirus software up to date.\
    \    Never leave credit/debit card receipts at the bank or ATMs.    Ensure that\
    \ credit/debit card swiping is done in your presence.    No one can win the lottery\
    \ if they do not participate.    Enable spam filters in your account.    Never\
    \ accept or transfer money into an unknown account.    Crosscheck the domain before\
    \ replying to any email.    Never respond to the phone calls which claim that\
    \ your card is blocked.    Search and apply for jobs only on authentic job portals.\
    \    Keep your friends or family informed if you meet a social media contact.\
    \    Never share intimate photographs with someone whom you met on social media.\
    \    Share safe browsing practices with your friends and family members.    Don't\
    \ delete offensive text messages or emails. These are helpful in a police investigation.\
    \  \n\n  Online gaming    Online gaming portals are increasing day by day, and\
