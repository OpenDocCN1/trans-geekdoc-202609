    -   **BPB PUBLICATIONS**: 20, Ansari Road, Darya Ganj, New Delhi-110002. 电话：23254990/23254991

    -   **MICRO MEDIA**: Shop No. 5, Mahendra Chambers, 150 DN Rd. Next to Capital
    Cinema, V.T. (C.S.T.) Station, MUMBAI-400 001. 电话： 22078296/22078297

    -   **DECCAN AGENCIES**: 4-3-329, Bank Street, Hyderabad-500195. 电话: 24756967/24756400

    -   **BPB BOOK CENTRE**: 376 Old Lajpat Rai Market, Delhi-110006. 电话: 23861747


    由 Manish Jain 为 BPB Publications（地址：20 Ansari Road, Darya Ganj, New Delhi-110002）出版，并在
    Repro India Ltd, Mumbai 处由印刷。


    献给 Priyanka Tomar 的父母 Abha Tomar 女士和已故 S.S.Tomar 博士。


    ## 关于作者

    Priyanka Tomar 是 New Era System Pvt Ltd 的经理，在各个 IT 领域（包括网络安全和网络取证）拥有 18 年的经验。自
    2014 年以来，她一直是 Ghaziabad 的客座教师，担任网络安全相关问题的政府顾问。她是各类活动的常驻演讲嘉宾，并在项目中教授网络安全知识。


    Sanjay Gautam 于 2002 年加入印度中央调查局（CBI），具有网络取证经验。他经常受邀到各个地点进行网络安全培训。他一直是各类网络安全相关论坛的常驻演讲嘉宾。他还为政府和私营机构提供协助。


    ## 关于审稿人

    Sunil Kumar 是一位经过认证的计算机审查员，在 Linux、Mac、Windows 和 Android 方面拥有 8 年以上的经验，是数字安全功能的开发者。


    ## 致谢

    Priyanka Tomar 感谢几位在写作期间提供支持的人。首先，她想对 K.N. Rao（退休）的宝贵贡献表示谢意。诚挚感谢 Shuchi Mitra、Jully
    Aggarwal、Chhavi 和 Dhruv 提供的见解。最后，她想感谢 BPB Publications 的 Manish Jain 给她的这次机会。


    ## 前言

    网络犯罪日益增加，包括在线诈骗、购物欺诈、婚姻诈骗、身份盗用和数据泄露。本书提供了对日常网络犯罪的简单理解，以及保护每个人的预防措施。我在书中分享了自己的经验和收获。书中的真实案例取自真实事件（已更改姓名），旨在对网络犯罪和网络犯罪分子采用的手段提供清晰见解。让我们建立网络卫生文化！


