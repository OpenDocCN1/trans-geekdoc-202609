    # Common tricks used by fraudsters on social media


    We all are active on social media nowadays for various reasons; professionals
    use social media to hire people to showcase their professional skills and achievements.
    Likewise, students and housewives have reasons to be active on social media. People
    are even addicted to it, and many countries now have addiction centers to treat
    the social media addiction of people. Therefore, there are plenty of opportunities
    for cybercriminals to trap and dupe ordinary, innocent citizens. Since the internet
    has no boundaries, cybercriminals can reach their target from any country. Some
    common types of social media crimes are lottery and free gift card free shopping
    voucher cryptocurrency (`bitcoin`) collection of your personal information from
    social media websites. Cybercriminals advertise their posts or send emails to
    lure innocent people. They say that you have won a lottery or free gift coupons.
    Sometimes, they clone''s identity of an individual to commit the crime.


    ![](image-sexz7yi0.jpg) Figure 3.6: Social media frauds


    Some of the common tricks used by fraudsters are as follows:


    * Look over your keyboard when you type the password

    * Use your mobile phone or laptop to check browsers for saved passwords

    * Installation of malware and keystroke logging software into your devices

    * Look for login credentials in public cybercafés computer

    * Creation of social media accounts in someone else''s names and posting their
    publicly available photographs

    * Cracking Wi-Fi passwords and committing cybercrime using the real owner''s name

    * Avail medical treatment on your health insurance

    * Stalking of one''s activities on social media, commenting, and messaging even
    though not being on the contact list

    * Sending a friend request to the victim''s contacts to access his/her complete
    profile information

    * Posting proposals, vulgar comments, pictures, or videos on victim''s profile
    page

    * Spreading rumors, false information, defamatory comments, swear words among
    victims'' friends, and contact list on social media

    * Tricking teens into sending obscene pictures and later blackmailing them

    * Unwanted game invites, pokes, pings, or comments asking for dates, and so on

    * Hacking, stealing victim account''s password and messaging, proposing, posting
    obscene content using their profiles resulting in their contacts believing the
    user does it

    * Phone on behalf of banks or bank wallets such as `Paytm`, `BHIM`, and so on

    * Persuade customers to download and install some third-party applications

    * Ask for `OTP`

    * Sending mails and asking to fill in KYC details or click on a link

    * Giving reference examples of victim''s contact lists or believable references
    for persuading victims

    * Misuse of photocopies to get a driving license or passport


    ## Preventive steps to be taken on social media


    The following are some of the preventive steps to be taken on social media:


    * Memorize passwords rather than writing or saving.

    * Never leave identity cards (`PAN`/`Aadhar`/`Driving License`) softcopies in
    the trash or public computers.

    * Never click on web links received in emails or messages from unknown.

    * Keep your electronic devices password/PIN protected.

    * From time to time, check the last login, a device used to log in, location,
    and browser information on social media accounts.

    * Implement two-step verification.

    * Be careful while downloading or installing third-party apps.

    * Avoid using any free Wi-Fi, games, coupon codes, and so on.

    * If not using any social media account for long, then deactivate.

    * Never save credit/debit card information on e-commerce/online shopping websites.

    * Never save the password when prompted to save.

    * Use strict privacy rules over social media.

    * Avoid tagging or posting locations or live vacation images on social media platforms.

    * Avoid enabling single sign-on or sync options for various social media accounts
    with other applications.

    * Always memorize your passwords rather than writing or saving them in an application
    or browser.

    * Never accept requests from strangers over social media platforms unless they''re
    well known.

    * Never click on links received in emails or messages from strangers.

    * Immediately report the profile or block accounts that seem to be suspicious.

    * Keep your privacy settings very strict to prevent any unknown person from entering
    your account.

    * Always notice the last login, the device used to log in, location, and browser
    information on prominent social media accounts.

    * Disable download of pictures/videos from your social media accounts to prevent
    misuse.

    * Do not reply to any forms of communication such as game invites, pokes, or messages
    over social media.

    * Keep your contacts and parents informed of any suspicious activities over social
    media.

    * Do not panic if your profile is hacked, misused, or defamed. Report the incident
    to the cyber cell.

    * Never add information about a trip or vacation on social media platforms.

    * Never share your location while sharing pictures or videos from a vacation or
    trip.

    * Always wait to return home before making any posts of a trip or vacation.

    * Ask your most active friends not to comment about your trip or vacation plans
    on social media.

    * Avoid tagging pictures with dates, times, and locations.

    * Never open emails and attachments from suspicious sources.

    * Never share your `OTP` even if the fraudster says they''re calling directly
    from a bank.

    * Never install any application told by strangers on call unless you know it is
    known and safe.

    * Avoid entering credit/debit card information even on `IVR`.

    * Always be suspicious while reading tempting offers.

    * Never follow any steps listed for availing of an offer.

    * Before installing any free software/application on your laptop/phone, make sure
    to uncheck all unnecessary sections, clauses to prevent the installation of anything
    other than you intended.

    * Keep your antivirus software up to date.

    * Never leave credit/debit card receipts at the bank or ATMs.

    * Ensure that credit/debit card swiping is done in your presence.

    * No one can win the lottery if they do not participate.

    * Enable spam filters in your account.

    * Never accept or transfer money into an unknown account.

    * Crosscheck the domain before replying to any email.

    * Never respond to the phone calls which claim your card is blocked.

    * Search and apply for jobs only on authentic job portals.

    * Keep your friends or family informed if you meet a social media contact.

    * Never share intimate photographs with someone you met on social media.

    * Share safe browsing practices with your friends and family members.

    * Don''t delete offensive text messages or emails. These are helpful in a police
    investigation.


    ## Online gaming


    Online gaming portals are increasing day by day, and no doubt, like other online
    platforms, it also has flaws. As per a media survey, gamers spend at least six
    hours a week in online gaming. Verbal abuse has been found very common in gaming
    chats and lobbies. In the online gaming community, bullies are called Cybercriminals
    find online gaming an easy platform to target teens for various motives such as
    cyberbullying, money extortion, and abetting them to commit suicide.


    ![](image-rtoluf9r.jpg) Figure 3.7: Online gaming


    We all had seen the case of the Blue Whale game when it was on a peak across every
    news channel and every nation reporting death and traumatic effects it had on
    teens. Blue whale choking Ghost pepper Ice and Salt Car Surfing challenge, and
    `PUBG` are a few of the games which had a negative impact. Teens have been given
    challenges in these provocative and mentally sickening games. Ultimately cybercriminals
    isolate the teens from friends and family and abet them into committing suicide
    or extort money from them.

