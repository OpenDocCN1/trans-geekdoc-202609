    # 网络犯罪与预防措施


    一份帮助您安全免受数字威胁、社交媒体风险和网络犯罪侵害的快速指南


    **Priyanka Tomar | Sanjay Gautam**


    2021 年第一版 版权所有 © BPB Publications, India ISBN: 978-93-90684-526。保留所有权利。未经出版者事先书面许可，本书部分不得以任何形式或通过任何手段复制、分发或传输，或存储在数据库或检索系统中；但程序列表除外，程序可以在计算机系统中输入、存储和执行，但不能通过出版、复印、录制或任何电子和机械手段复制。


