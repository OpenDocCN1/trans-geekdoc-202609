    \ only    Avoid public or free Wi-Fi as these may not be secure    Delete cookies,\
    \ temp files, and browsing history regularly    Back up your data regularly   \
    \ Never ignore the slow and strange response of the computer    Never ignore all\
    \ of the sudden appearances of new programs and icons    Never ignore unexpected\
    \ error messages or popups  \n\n  General preventive measures    The following\
    \ are some of the general preventive measures:     Change the default password\
    \ of Wi-Fi    Disable file sharing on the computer    Use the incognito mode of\
    \ the browser    Before shopping or making an online transaction, check for HTTPS,\
    \ a padlock in URL, and website ownership    Turn off the computer, modem, and\
    \ so on if not in use    Never store information on the C drive of the computer\
    \    Keep changing passwords regularly    Respect other's privacy; think twice\
    \ before posting    Report illegal/offensive/abusive content    Use alias when\
    \ chatting online    Report online bullying immediately to teachers and parents\
    \    Connect on social media with known people only  \n\n  Preventive tips while\
    \ working from home     Webcams can be connected with many applications, and those\
    \ apps may be vulnerable and can steal your data. Therefore, never leave the webcam\
    \ unattended.    Always scan external hard disks and pen drives before copying\
    \ the data.    Change default user ID and password.    Prefer at least an eight-character\
    \ password.    Use a licensed operating system.    Install licensed antivirus/internet\
    \ security software.    Always scan the documents before opening.    Be careful\
    \ while opening email attachments, such as checking whether an email has come\
    \ from an authentic source and verifying the domain.    Log off the system after\
    \ work.    Take regular backup of data.    Lock computer when not using    Switch\
    \ off the router if not in use.  \n\n  Identify fake weblink/URL     Look for\
    \ the padlock in the URL to ensure the website is on a secure layer.    Check\
    \ the URL for https; the s in https stands for secure layer.  \n\nCHAPTER 4   \
    \ Mobile Application-Related Frauds  \n\n  Introduction    Media reported more\
    \ than five million apps available on Apple and Google Play Store; mobile apps\
    \ help businesses grow. Therefore, these are goldmines for cybercriminals, and\
    \ they perform sophisticated attacks on insecure mobile apps. Vulnerable apps\
    \ leak entire user data, and after getting the data, fraudsters sell it on various\
    \ platforms, including the Dark  \n\n  Structure    In this chapter, we will cover\
    \ the following topics:     Risks due to mobile apps and preventive measures \
    \   Key mobile app statistics  \n\n  Objective    Here, our objective is to make\
    \ you aware of the mobile application frauds and preventive steps to safeguard\
    \ them.  \n\n  Mobile application-related cybercrime    Mobile apps are a part\
    \ of our daily routine as we use those to pay our bills, banking services, and\
    \ so on, and these will also dominate in coming years. Therefore, these are very\
    \ attractive targets for cybercriminals. Sometimes hackers clone popular mobile\
    \ apps, and innocent users become their victims.    With over 3.2 billion smartphone\
    \ users across the world, it's no surprise that the mobile app industry is thriving.\
    \ Now, factor in the 1.14 billion tablet users worldwide, a number that's grown\
    \ about 36% over the past six years. 88% of mobile time is spent on apps.  \n\n\
      Key mobile app statistics     Mobile apps are expected to generate over $935\
    \ billion in revenue by 2023\\.    The Apple App Store has 1.96 million apps available\
    \ for download.    There are 2.87 million apps available for download on the Google\
    \ Play Store.    21% of millennials open an app 50+ times per day.    49% of people\
    \ open an app 11+ times each day.    69% of all US digital media time comes from\
    \ mobile apps.    The average smartphone owner uses ten apps per day and 30 apps\
    \ each month.    The source is as follows:    https://buildfire.com    Because\
    \ of our dependency on mobile apps, we tend to ignore security warnings, leading\
    \ to cyber-attack. Sometimes mobile apps are already infected with malicious software.\
    \ This provides access to your emails, messages, photographs, contact list, and\
    \ even OTPs to cybercriminals.    People use the CamScanner app to scan documents.\
    \ In Aug Kaspersky –Moscow-based multinational cybersecurity and antivirus company-reported\
    \ malware in    The source is as follows:    https://www.kaspersky.co.in/blog/camscanner-malicious-android-app/16595/#:~:text=Malicious%20Android%20app%20had%20more,million%20times%20from%20Google%20Play\
    \    Google removed 34 malware-infected apps from its play store    The source\
    \ is as follows:    https://indianexpress.com/article/technology/tech-news-technology/34-apps-joker-malware-infected-android-uninstall-google-play-store-6701973/\
    \    Juice Public mobile charging kiosks may also infect your mobile. Cybercriminals\
    \ hijack the power supply channel as the same cable is used for power supply and\
    \ data transfer. They may extract your personal data, including a contact list,\
    \ messages, and photographs.    Sometimes mobile apps are infected with ransomware.\
    \ Ransomware locks the device completely, and to restore your access, cybercriminals\
    \ demand hefty ransom.    Let us understand it with an example:    Rani installed\
    \ an infected document scanner mobile app to scan her college documents. After\
    \ some time, she notices that her mobile has become slow, and it is showing advertisements,\
    \ and sometimes obscene images are being displayed. After consulting some cybersecurity,\
    \ she uninstalled the infected app, took the backup of her data, and reset the\
    \ phone.  \n\n  Preventive tips     Install apps from trusted sources and check\
    \ their authenticity    Be careful while granting permissions to mobile apps \
    \   Regularly update the mobile operating system    Install licensed antivirus/internet\
    \ security software    Be suspicious if mobile behaves differently    Delete all\
    \ the data related to the infected app and uninstall it  \n\nCHAPTER 5    To-Do\
    \ List for Working Professionals and Small Business Houses  \n\n  Introduction\
    \    There are high chances of a cybersecurity breach for all of us, and many\
    \ times it becomes a very expensive affair. Hiring a permanent technically sound\
    \ cybersecurity professional is expensive, and even hiring a cybersecurity consultant's\
    \ services may be expensive for individuals working in professional or small business\
    \ houses. Therefore, here is a small and for a sure to-do list to safeguard the\
    \ data up to some extent, at least for some common types of cybercrimes. These\
    \ are very easy steps to implement and can prove a good support system.  \n\n\
      Structure    In this chapter, we will go through the to-do list for working\
    \ professionals, consultants, and small business houses.  \n\n  Objective    Cyber\
    \ essentials or following cyber hygiene will help working IT, non-IT professionals,\
    \ NGOs, and small business houses protect their important data by taking proper\
    \ preventive measures.  "
