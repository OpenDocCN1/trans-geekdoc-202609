    \ messages, and photographs.\n\nSometimes mobile apps are infected with ransomware.\
    \ Ransomware locks the device completely, and to restore your access, cybercriminals\
    \ demand hefty ransom. Let us understand it with an example:\nRani installed an\
    \ infected document scanner mobile app to scan her college documents. After some\
    \ time, she notices that her mobile has become slow, and it is showing advertisements,\
    \ and sometimes obscene images are being displayed. After consulting some cybersecurity,\
    \ she uninstalled the infected app, took the backup of her data, and reset the\
    \ phone.\n\n Preventive tips\n- Install apps from trusted sources and check their\
    \ authenticity.\n- Be careful while granting permissions to mobile apps.\n- Regularly\
    \ update the mobile operating system.\n- Install licensed antivirus/internet security\
    \ software.\n- Be suspicious if mobile behaves differently.\n- Delete all the\
    \ data related to the infected app and uninstall it.\n\n# CHAPTER 5: To-Do List\
    \ for Working Professionals and Small Business Houses\n\n## Introduction\n\nThere\
    \ are high chances of a cybersecurity breach for all of us, and many times it\
    \ becomes a very expensive affair. Hiring a permanent technically sound cybersecurity\
    \ professional is expensive, and even hiring a cybersecurity consultant's services\
    \ may be expensive for individuals working in professional or small business houses.\n\
    \n## Structure\n\nIn this chapter, we will go through the to-do list for working\
    \ professionals, consultants, and small business houses.\n\n## Objective\n\nCyber\
    \ essentials or following cyber hygiene will help working IT, non-IT professionals,\
    \ NGOs, and small business houses protect their important data by taking proper\
    \ preventive measures.\n"
  trans: "\n\n# 计算机/笔记本电脑的预防技巧\n\n以下是计算机/笔记本电脑的一些预防技巧：\n\n- 使用 `Bluetooth` 时必须开启隐身模式，以避免被附近的人发现。\n\
    - 如果你想处理电脑，请先删除所有数据。\n- 使用包含字母、数字和特殊字符的强密码组合。\n- 使用经过验证的开源或授权的操作系统，并定期进行更新。\n\
    - 使用网络安全和防杀病毒软件。\n- 不使用时关闭移动网络连接、`Wi-Fi`、`Bluetooth` 和摄像头。\n- 将个人文件夹和私人文件夹分开存放。\n\
    - 永远不允许未知设备通过 `Bluetooth` 连接。\n- 仅从官方网站下载内容。\n- 避免使用公共或免费 `Wi-Fi`，因为这些可能不。\n-\
    \ 定期删除 cookie、临时文件和浏览历史。\n- 定期备份你的数据。\n- 永远不要电脑运行缓慢或响应异常。\n- 永远忽略新程序和图标的突然出现。\n\
    - 永远忽略意外的错误消息或弹出窗口。\n\n# 通用预防措施\n\n以下是一些通用预防措施：\n- 更改 `Wi-Fi` 的默认密码。\n- 禁用电脑上的文件共享。\n\
    - 使用浏览器的无痕模式。\n- 在购物或进行在线交易之前，检查 `HTTPS`、`URL` 中的锁标志以及网站所有权。\n- 不使用时关闭电脑、调制调器等设备。\n\
    - 永远不要在电脑的 `C` 盘上存储信息。\n- 定期更改密码。\n- 尊重他人的隐私；在发布前考虑两次。\n- 举报非法/攻击性/辱骂性内容。\n- 在线聊天时使用别名。\n\
    - 立即向老师和父母举报网络欺凌。\n- 仅在社交媒体上与认识的人联系。\n\n# 居家办公时的预防技巧\n\n- 摄像头可以连接许多应用程序，这些应用可能存在漏洞并窃取你的数据。因此，永远不要离开摄像头。\n\
    - 在拷贝数据之前，始终扫描外部硬盘和优 盘。\n- 更改默认用户 ID 和密码。\n- 优先使用至少八个位的密码。\n- 使用授权的操作系统。\n- 安装授权的防杀病毒/网络安全软件。\n\
    - 在打开文档之前始终进行扫描。\n- 打开邮件附件时要小心，例如检查邮件是否来自真实来源并验证域名。\n- 下班后注销系统。\n- 定期备份数据。\n-\
    \ 不使用时锁定电脑。\n- 不使用时关闭路由器。\n\n# 识别虚假网页链接/URL\n\n- 寻找 `URL` 中的锁标志，以确保网站处于安全层。\n\
    - 检查 `URL` 是否为 `https`；`https` 中的 `s` 代表安全层。\n\n# 第 4 章：与移动应用程序相关的欺诈\n\n## 引言\n\
    \n媒体报道，`Apple` 和 `Google Play Store` 上有超过五百万个应用程序；移动应用帮助业务增长。因此，这些对于网络犯罪分子来说是金矿，他们对不安全的移动应用进行复杂的攻击。有漏洞的程序会泄露整个用户数据，诈骗者获取数据后会在包括暗网在内的各种平台上将其出售。\n\
    \n## 结构\n\n在本章中，我们将涵盖以下主题：\n- 移动应用带来的风险及预防措施\n- 关键移动应用统计数据\n\n## 目标\n\n我们的目标是让您意识到移动应用程序欺诈，以及保护它们的预防步骤。\n\
    \n## 与移动应用程序相关的网络犯罪\n\n移动应用是我们日常生活中的一部分，我们使用它们来支付账单、办理银行服务等，它们在未来几年也一直占据主导地位。因此，这些是网络犯罪分子眼中极具吸引力的目标。有时黑客会克隆流行的移动应用，无辜的用户成为他们的受害者。\n\
    \n全球有超过 32 亿智能手机用户，移动应用行业蓬勃发展并不意外。现在，考虑到全球有 11.4 亿平板电脑用户，这个数字在过去六年中增长了约 36%。移动时间的\
    \ 88% 是花在应用程序上的。\n\n## 关键移动应用统计数据\n\n- 预计移动应用到 2023 年将产生超过 9350 亿美元的收入。\n- `Apple\
    \ App Store` 有 196 万个应用程序供下载。\n- `Google Play Store` 有 287 万个应用程序供下载。\n- 21% 的千禧一代每天每天打开应用程序\
    \ 50 次以上。\n- 49% 的人每天打开应用程序 11 次以上。\n- 美国所有数字媒体使用时间的 69% 来自移动应用。\n- 平均每个智能手机所有者每天使用十个应用程序，每月使用\
    \ 30 个。\n- 来源如下：`https://buildfire.com`\n\n由于我们对移动应用的依赖，我们往往会忽略安全警告，导致网络攻击。有时移动应用已经感染了恶意软件。这为网络犯罪分子提供了访问你的电子邮件、消息、照片、联系人列表甚至动态验证码（OTP）的机会。\n\
    \n人们使用 `CamScanner` 应用扫描文档。8 月，总部位于莫斯科的跨国网络安全和防杀病毒公司 `Kaspersky`（卡巴斯基）报告了其中的：\n\
    来源如下：`https://www.kaspersky.co.in/blog/camscanner-malicious-android-app/16595/#:~:text=Malicious%20Android%20app%20had%20more,million%20times%20from`\n\
    \nGoogle 从其应用商店删除了 34 个受恶意软件感染的应用程序\n来源如下：`https://indianexpress.com/article/technology/tech-news/34-apps-malware-infected-google-play-670193/`\n\
    \nJuice 公共移动充电桩也可能感染你的手机。网络犯罪分子劫持电源通道，因为同一根电缆被用于供电和数据传输。他们可能会提取你的个人数据，包括联系人列表、消息和照片。\n\
    \n有时移动应用会感染勒索软件。勒索软件会完全锁定设备，为了恢复访问权限，网络犯罪分子会索要巨额赎金。让我们通过例子来理解：\nRani 安装了一个扫描扫描移动应用来扫描她的学院文件。一段时间后，她注意到手机变慢了，并且显示广告，有时还会显示色信息。咨询网络安全专家后，她卸载了感染的应用，备份了数据并重置了手机。\n\
    \n 预防技巧\n- 从信任源安装应用程序并检查其真实性。\n- 在授予移动应用权限时要小心。\n- 定期更新移动操作系统。\n- 安装授权的防杀病毒/网络安全软件。\n\
    - 如果手机行为出现异常，请保持怀疑。\n- 删除所有与受感染应用相关的数据并卸载它。\n\n# 第 5 章：职场人士和小小型企业的清单\n\n## 引言\n\
    \n我们所有人都有面临网络安全泄露的高概率，很多时候这会变成一笔非常昂贵的代价。雇佣一名技术良好的长期网络安全专家是昂贵的，即使对于在专业或小型企业工作的个人来说，聘请网络安全顾问的服务可能也很昂贵。\n\
    \n## 结构\n\n在本章中，我们将介绍职场人士、顾问和小型企业的清单。\n\n## 目标\n\n网络安全基础知识或遵循网络卫生习惯将帮助 IT 和非 IT\
    \ 专业人士、非政府组织（NGO）以及小型企业通过采取适当的预防措施来保护他们的重要数据。\n\n"
