    Published by Manish Jain for BPB Publications, 20 Ansari Road, Darya Ganj, New
    Delhi-110002 and Printed by him at Repro India Ltd, Mumbai.


    Dedicated to Priyanka Tomar''s Parents, Mrs. Abha Tomar and Late Dr. S.S.Tomar.


    ## About the Authors

    Priyanka Tomar is the Director of New Era System Pvt Ltd and has 18 years of experience
    in the various IT fields, including Cyber Security & Cyber Forensics. She is a
    guest faculty at Ghaziabad since 2014 and is an advisor to the government on cybersecurity-related
    issues. She is a regular speaker at various events, imparting cybersecurity on
    various projects.


    Sanjay Gautam joined the CBI in 2002 and has experience in cyber forensics. He
    is also invited to various locations to deliver training on cybersecurity. He
    has been a regular speaker at various forums on cybersecurity-related issues.
    He has also provided assistance to the government and private organizations.


    ## About the Reviewer

    Sunil Kumar, a certified computer examiner with 8+ years of experience in Linux,
    Mac, Windows, and Android, is a developer of digital security features.


    ## Acknowledgement

    There are few people Priyanka Tomar wants to thank for their support during the
    writing. First and foremost, she would like to express her gratitude to K.N. Rao
    (Retd) for her invaluable contribution. Her sincere thanks to Shuchi Mitra, Jully
    Aggarwal, Chhavi, and Dhruv for providing insights. Finally, she would like to
    thank Manish Jain at BPB Publications for giving her this opportunity.


    ## Preface

    Cyber crime is rising day by day, including online scams, shopping frauds, matrimonial
    scams, identity theft, data breaches. This book provides an easy understanding
    of daily occurring cyber crimes and preventive measures to safeguard everyone.
    I am sharing my own experience and learning in this book. The real life examples
    have been taken from real incidences (names are changed) to provide a clear insight
    into cyber crime and the modus operandi adopted by cyber criminals. Let’s create
    a culture of cyber hygiene!


