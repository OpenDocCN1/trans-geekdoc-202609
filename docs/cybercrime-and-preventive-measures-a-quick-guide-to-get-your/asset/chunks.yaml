    # Popular financial frauds


    Some of the popular financial frauds are mentioned in the following screenshot:


    ![](image-t0g9m5zp.jpg)

    Figure 2.1: Fraud data reported by scheduled commercial banks and financial institutions


    The source is as follows:

    https://www.financialexpress.com/industry/banking-finance/hundreds-of-crores-of-rupees-lost-in-card-payment-internet-banking-frauds-in-just-3-months/1886386/


