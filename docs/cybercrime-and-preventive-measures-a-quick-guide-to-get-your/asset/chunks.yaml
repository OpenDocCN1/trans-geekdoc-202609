    \n# CHAPTER 6 Complaint Registration\n\n## Introduction\nHere we are informing\
    \ you about the free courses conducted by the Indian Government and the name of\
    \ the Government websites, which issue alerts and advisories about where to approach\
    \ if you are a victim of cybercrime, and the procedure to register a cybercrime\
    \ complaint.\n\n## Structure\nThe following topics are covered in this chapter:\n\
    - Free courses by the Indian Government\n- Complaint registration procedure\n\
    - State-wise cyber cell contact details\n- What to retain as evidence?\n\n## Objective\n\
    This chapter provides the resources link to upgrade your knowledge about cybercrime\
    \ and security along with the complaint registration procedure. Cyber helpline\
    \ numbers and state-wise cyber cell email ID and phone numbers are also given\
    \ for your convenience.\n\n## Free online courses for you by the Government\n\
    There are a few online courses that the Government provides, and you can find\
    \ them on the following site:\n- `https://www.swayam.gov.in`\n- `https://www.infosecawareness.in`\n\
    \nIf you are a victim of cybercrime, then the following things will help you:\n\
    - Cybercrime phone helpline `155260` (9:00 am to 6:00 pm)\n\n## Online complaint\
    \ registration facility\nThe following steps can be used to register an online\
    \ complaint:\n- Visit the following website: `www.cybercrime.gov.in`\n- Subscribe\
    \ to the advisories issued by the `CERT-IN` by visiting the following website:\
    \ `http://www.cert-in.org.in`\n- Malicious activities can be reported to `CERT-IN`\n\
    \  - Email: `incident@cert-in.org.in`\n  - Helpline: `+91-1800 114949`\n- In case\
    \ of stolen/lost mobile, follow these steps:\n  - First, register FIR with the\
    \ police\n  - Helpline `14422`\n  - Register complaint with Central Equipment\
    \ Identity Register website that is: `www.ceir.gov.in`\n\n## State-wise list of\
