    \  Online gaming and common tricks used by cybercriminals during Online Gaming\
    \  Preventive steps to be taken while playing online games  Preventive steps to\
    \ safeguard a WhatsApp account  Preventive tips to avoid fake news  Preventive\
    \ tips for a smartphone  Your computer/laptop can be infected if:  Preventive\
    \ tips for a computer/laptop  General preventive measures  Preventive tips while\
    \ working from home  Identify fake weblink/URL    4\\. Mobile Application-Related\
    \ Frauds  Introduction  Structure  Objective  Mobile application-related cybercrime\
    \  Key mobile app statistics  Preventive tips    5\\. To-Do List for Working Professionals\
    \ and Small Business Houses  Introduction  Structure  Objective  Regular backup\
    \ of your data  Protect your key devices  Apply strong passwords  Identify phishing\
    \ attacks    6\\. Complaint Registration  Introduction  Structure  Objective \
    \ Online complaint registration facility  State-wise list of cybercrime police\
    \ stations  Evidence-what to retain  References    Index  \n\nCybercrime and Preventive\
    \ Measures  \n\n  Introduction to cybersecurity    Digital data is surging day\
    \ by day or minute by minute. We are dependent on computers and mobile devices\
    \ even to accomplish the smallest work of our daily regimes.    Cybersecurity\
    \ is a vast subject and includes computer security, network security, application\
    \ security, website security, software security, mobile security, cloud security,\
    \ Internet of Things (IoT) devices, smart devices, information security, and so\
    \ on. To protect hardware devices, software, and information (data) from various\
    \ kinds of attacks, viruses, or unauthorized access, we need cybersecurity. Cybersecurity\
    \ is constantly evolving, but we can say that it involves ensuring the integrity,\
    \ confidentiality, and availability of information.  \n\n  The need for cybersecurity\
    \ awareness    Advanced technologies, especially the internet, have been life-changing\
    \ for all of us, but they also have many side effects and make us vulnerable.\
    \ Cyberattacks are increasing minute by minute; almost everyone has been a victim\
    \ of cybercrime directly or indirectly. Data breaches can be very devastating\
    \ for business organizations and high-profile individuals. These types of incidences\
    \ are being reported by the media almost daily. As per leading research organisations,\
    \ mostly cyber-attacks happen due to a lack of human intelligence. Humans are\
    \ the weakest link in the chain. Therefore, cybersecurity awareness is necessary\
    \ for each one of us.    Almost 500 million consumers have been the victim of\
    \ cybercrime, with nearly 350 million in 2019 alone:    ![](image-8hdrpdps.jpg) \
    \ Figure 1.1: 500 million consumers have been the victim of cybercrime, with nearly\
    \ 350 million in 2019     February 23, The Internet Crime Report for released\
    \ by the USA's Internet Crime Complaint Centre of the Federal Bureau of Investigation,\
    \ has revealed that India stands third in the world among the top 20 countries\
    \ that are victims of internet crimes. As per the report, excluding the USA, the\
    \ UK tops the list with 93,796 victims of internet crimes, followed by Canada\
    \ (3,721) and India (2,901).    The source is as follows:    https://www.newindianexpress.com/nation/2020/feb/23/india-stands-third-among-top-20-cyber-crime-victims-says-fbi-report-2107309.html\
    \    March 11, In the nine months between April 1 and December 31, 2019, cyber\
    \ criminals took away nearly Rs. 230 Further, the last two years show that the\
    \ ATM/debit and credit cards and net banking frauds saw Rs. 318.4 crores stolen;\
    \ therefore, between April 1, 2017, to December 31, a total of Rs. 547 crores\
    \ in more than 1.1 lakh cases:    ![](image-hk70s0lv.jpg)  Figure 1.2: Cybercrime\
    \ cases    Here's the source:    timesofindia.indiatimes.com/articleshow/74571025.cms?utm\\\
    _source=contentofinterest&utm\\_medium=text&utm\\_campaign=cppst  \n\nCHAPTER\
    \ 1    Email-related Cybercrime  \n\n  Introduction    Cybercrime is a criminal\
    \ activity wherein a single computer, multiple computers, or interconnected computers/devices\
    \ have been used. A cyberattack may involve the intranet and internet. Cybercrime\
    \ can be committed by an individual, group of people, organizations, and even\
    \ state-sponsored agencies.  \n\n  Structure    In this chapter, we will cover\
    \ the following email-related popular cybercrimes (along with examples) such as:\
    \     Spamming    Phishing    Bombing    Spoofing  \n\n  Objective    To make\
    \ you aware of a variety of cybercrimes carried out through email and preventive\
    \ measures to safeguard.  "
