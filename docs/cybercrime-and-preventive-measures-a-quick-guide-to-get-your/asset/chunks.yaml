    Figure 2.2: Types of Financial frauds


    ## Types of Financial Frauds


    ### QR code/OTP/app-related common tricks used by fraudsters

    Some of the common tricks used by the fraudsters are as follows:


    * Cybercriminals send `QR codes` via emails and WhatsApp to hack bank accounts.

    * Fraudulent `NPCI`/`UPI`/`BHIM` handles and portals.

    * Myriad Twitter handles masquerading as `@NPCI_BHIM` official helpline handle
    has mushroomed on the micro-blogging site. The fake accounts trick customers looking
    for help to reveal their account, wallet, or card details.


    **Example 1:**

    Cybercriminals used `QR codes` and `OTP` to trick the customer.


    **Example 2:**

    Fraudsters used remote desktop software to gain access to the bank account.


    ### Preventive tips for protecting financial frauds

    Some of the preventive measures which can be taken:


    * Never share `OTP` with anyone.

    * `OTP` is never required to receive money in your bank account.

    * Pick the bank''s customer care numbers directly from the bank''s legitimate
    website. Avoid the numbers being displayed on Google and so on.

    * Never download the apps you don''t need.

    * Check the authenticity of the app with the bank before you download it.

    * Check the authenticity of the website before paying any fee.

    * Use separate email ID for matrimonial websites.

    * Never share personal and sensitive information with the people you meet through
    matrimonial websites.

    * Crosscheck NRI profiles carefully.


    # CHAPTER 3: Cybercrime in Social Media


    ## Introduction

    Almost everyone, from children, teenagers, housewives, working professionals to
    unskilled manpower, spends time on social media for various reasons. Cybercrimes
    such as cyberbullying, `MMS`, threatening messages, fake profiles, identity theft,
    cyber harassment, cyberstalking, and so on are very common on social media. Cybercriminals
    not only target individuals but they conduct automated attacks using bots.

