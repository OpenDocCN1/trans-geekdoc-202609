    \ about people such as what is their personality like, what kind of websites they\
    \ visit, accordingly they create personality profile and show users fake news\
    \ content. Ordinary social media users also do share fake news unknowingly. It\
    \ is a human tendency to share novel information with others. Trolls post comments\
    \ on social media with an intention to argue to people or to insult famous people.\n\
    \n## Preventive tips to avoid fake news\n\nFake news is one of the biggest global\
    \ cybercrime concerns, and in a way, it is an abuse of social media. Many times,\
    \ it causes harm to a country's reputation. People fabricate stories to get more\
    \ website visitors and increase their revenues from the website advertisements.\
    \ Sometimes stories are created to mislead people or promote a biased point of\
    \ view or political agenda. We need to evaluate social media posts' motives and\
    \ website headings and distinguish fake content or posts. Though there are legal\
    \ consequences of publishing and spreading fake news, we also need to be aware\
    \ of the following:\n\n![](image-ulgqln76.jpg) Figure 3.10: Fake news\n\n* Never\
    \ trust any news or information from untrusted sources.\n* Rely on renowned and\
    \ authentic television news channels rather than social media.\n* Report fake\
    \ pages, profiles, or groups over `Facebook`, `Twitter` or `Instagram`, and so\
    \ on.\n* Do not join groups luring you for money to commit unethical acts.\n*\
    \ Some pages or groups spread anti-national, communal, or religious information.\
    \ Report such pages immediately.\n* Never believe random `WhatsApp` texts claiming\
    \ certain facts and asking you to gather at a place or join a protest and so on.\
    \ Always check the authenticity of the text/news.\n\n## Preventive tips for a\
    \ smartphone\n\nSome of the preventive tips for a smartphone are as follows:\n\
    \n* Note the International Mobile Equipment Identity number. It is useful in tracking\
    \ lost mobile.\n* Update mobile operating system and apps regularly.\n* Never\
    \ download any third-party app from the play store without authentication.\n*\
    \ Turn off mobile internet connection, `Wi-Fi`, `Bluetooth`, `camera` when not\
    \ in use.\n* Use a password or `pin` to guard your smartphone.\n* Never share\
    \ your `pin/password` with others.\n* Never allow unknown devices to connect via\
    \ `Bluetooth`.\n* Avoid public or free `Wi-Fi` as these may not be secure.\n*\
    \ Never click on links mentioned in email/SMS, as it may harm your mobile phone.\n\
    * Never allow third-party apps to access your data if not necessary.\n* Back up\
    \ your data regularly.\n* Report loss of mobile phone immediately to police.\n\
    * Never ignore drainage of battery life before the expected time.\n\nYour computer/laptop\
    \ can be infected if:\n\n* You download software from untrusted and infected websites.\n\
    * You plug in an infected `USB` or external hard disk.\n* You click on any malicious\
    \ weblink.\n* You click on any infected image or document.\n* If you pick up an\
    \ infected device from someone such as college, office, and so on.\n* If you visit\
    \ `Torrent` websites.\n* If your password is easy.\n* If you use the pirated operating\
    \ system.\n* If you don't use licensed antivirus/internet security software.\n\
    \nThese actions may result in your computer going slow and may corrupt or even\
    \ delete the data. Let's understand it more with the help of an example:\n\n`Sumit\
    \ asks his friend Amit about the new video release of a popular Bollywood artist.\
    \ Amit says that he is unaware of the new release, so they decide to download\
    \ it from some website. And as the download starts, his computer gets infected,\
    \ freezes, and the operating system gets corrupted.`\n"
  trans: "\n\n# 网络游戏以及网络犯罪分子在网络游戏中常用的骗术\n\n网络犯罪分子常用的一些骗术如下：\n\n![](img/image-vxqrnpkx.jpg)\
    \ 图 3.8：网络游戏\n\n* 游戏开发者创建了多个层级的暴力模拟。\n*   创建游戏 WhatsApp 群组，玩家需要不断向管理员更新并持续接受新挑战。\n\
    *   诱导青少年与朋友、家人等隔绝，最终让他们相信这不仅仅是游戏，而是现实。\n*   因青少年无法完成挑战而羞辱他们。\n*   威胁要将他们的照片公开并分享给他们的朋友。\n\
    *   诸如 `PUBG` 等游戏旨在让青少年变得暴力和成瘾，以至于他们在任何地方（无论是学校、道路、公共交通、医院等）都无法戒掉。\n*   其他几种游戏，如“鬼椒辣椒冰”和“盐水冲浪”挑战，旨在对青少年造成各种身体和心理伤害。\n\
    \n## 玩网络游戏时应采取的预防措施\n\n可以采取的一些预防措施如下：\n\n* 父母应该讨论暴力游戏对青少年的负面影响。\n*   家长/老师必须监控儿童的数字设备。\n\
    * 父母必须监控子女的浏览习惯、在线游戏活动、聊天等。\n* 如果父母发现孩子对社交失去兴趣或过度沉迷于在线游戏，必须立即与孩子交谈。\n* 让青少年参与其他娱乐活动，如音乐、户外运动等。\n\
    * 以匿名身份玩。\n* 立即报告任何不恰当行为或网络欺凌事件。\n* 发生任何事件时，通知学校老师。\n\n## 保护 WhatsApp 账号的预防措施\n\
    \n`WhatsApp` 的使用也会吸引网络犯罪分子实施各种犯罪。黑客可能会创建虚假的的 `WhatsApp` 账号，并在显示图像上放置 `WhatsApp`\
    \ 的官方标志。他们假装成客服执行人员或技术支持团队。他们现在通过要求目标验证 `WhatsApp` 号并索要 6 位数字 `OTP` 来验证身份来欺骗他们。由于短信显示为技术支持团队的\
    \ `WhatsApp` 号，人们往往会陷入陷阱并分享他们的 `OTP`。一旦 `OTP/PIN` 泄露，账户就会破解。网络犯罪分子利用被劫持的账户向害者的朋友、亲戚等索要钱财。被破解的\
    \ `WhatsApp` 账户可能会暴露你的聊天记录、短信信息甚至照片。\n\n![](img/image-bfhw0we3.jpg) 图 3.9：安全的\
    \ WhatsApp\n\n一些预防措施如下：\n\n* 使用第三方安全锁应用程序保持你的 `WhatsApp` 应用程序安全。\n* 避免在公共计算机/设备上登录\
    \ `WhatsApp web`，并记住注销。\n* 如果不被信任，请勿加入任何随机群组邀请。\n* 不要点击由未知来源转发的任何链接。\n* 不要转发敏感、挑衅性的信息。\n\
    * 应用严格的隐私设置。\n* 如果你收到不想要的短信或群组邀请，请屏蔽该联系人。\n* 定期安装 `WhatsApp` 更新。\n\n虚假新闻通过社交媒体传播。\n\
    \n 机器人（自动化程序）、喷子（出于特定原因使用社交媒体的人类）和社交媒体用户会传播虚假新闻。机器人具有与用户交互并分享信息和消息的能力。恶意行为者（社交媒体用户）首先获取有关人们的信息，例如他们的性格如何、访问哪些网站，据此创建性格画像并向用户展示虚假新闻内容。普通社交媒体用户也会在不经意间分享虚假新闻。与他人分享新颖信息是人类的一种倾向。喷子在社交媒体上发布评论，目的是与人争论或侮辱名人。\n\
    \n## 避免虚假新闻的预防技巧\n\n虚假新闻是全球网络犯罪关注的问题之一，在某种程度上，它是对社交媒体的滥用。许多时候会对国家的声誉造成损害。人们编造故事以获得更多网站访问者，并增加网站广告收入。有时，创建故事是为了误导人们或推广偏激的观点或政治议程。我们需要评估社交媒体帖子的动机和网站标题，并区分虚假内容或帖子。虽然发布和传播虚假新闻会有法律后果，但我们也需要注意以下点：\n\
    \n![](img/image-ulgqln76.jpg) 图 3.10：虚假新闻\n\n* 永远不要相信不可信来源的新闻或信息。\n* 依靠知名且真实的电视新闻频道，而非社交媒体。\n\
    * 在 `Facebook`、`Twitter` 或 `Instagram` 等平台上举报虚假页面、简介或群组。\n* 不要加入诱导你为了金钱而从事不道德行为的群组。\n\
    * 某些页面或群组传播反国家、社区或宗教信息。立即举报此类页面。\n* 永远不要相信声称某些事实并要求你在某地聚集或参加抗议等的随机 `WhatsApp`\
    \ 短信。始终检查短信/新闻的真实性。\n\n## 智能手机的预防技巧\n\n智能手机的一些预防技巧如下：\n\n* 记录国际移动设备识别码（IMEI）。它对追踪丢失手机很有用。\n\
    * 定期更新移动操作系统和应用程序。\n* 不要在没有身份验证的情况下从应用商店下载任何第三方应用。\n* 不使用时关闭手机网络连接、`Wi-Fi`、蓝牙`和摄像头。\n\
    * 使用密码或 `pin` 保护你的智能手机。\n* 永远不要向他人分享你的 `pin/密码`。\n* 不允许未知设备通过 `蓝牙` 连接。\n* 避免使用公共或免费\
    \ `Wi-Fi`，因为这些可能不安全。\n* 不要点击邮件/短信提到的链接，因为它可能会损害你的手机。\n* 如果必要，不要允许第三方应用访问你的数据。\n\
    * 定期备份数据。\n* 手机丢失后立即向警方报案。\n* 永远不要忽视电池提前消耗的情况。\n\n如果发生以下操作，你的电脑/笔记本可能会被感染：\n\n\
    * 从不可信和受感染的网站下载软件。\n* 插入受感染的 `USB` 或外部硬盘。\n* 点击任何恶意链接。\n* 点击任何受感染的图像或文档。\n* 从大学、办公室等地方拿起受感染的设备。\n\
    * 访问 `Torrent` 网站。\n* 如果你的密码简单。\n* 使用盗版操作系统。\n* 如果你不使用授权的反病毒/互联网安全软件。\n\n这些操作可能导致你的电脑变慢，并可能损坏甚至删除数据。让我们通过示例进一步了解：\n\
    \n`Sumit 询问朋友 Amit 关于一位热门宝莱坞艺人的新视频发布。Amit 说他不知道新发布，于是他们决定从某个网站下载。下载一开始，他的电脑被感染了，死机了，操作系统损坏了。`\n\
    \n"
