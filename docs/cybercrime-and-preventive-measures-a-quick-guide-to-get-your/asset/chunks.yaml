- raw: "  Regular backup of your data    Some data may be very important and crucial\
    \ such as customer's personal information and their payment details, including\
    \ their account number, credit/debit card details, and so on. If you have a habit\
    \ of taking regular data backup, there are almost zero chances of blackmailing\
    \ by cybercriminals. Most people/organizations do not have a proper backup; therefore,\
    \ they are forced to pay the ransomware.    Identify the important data and take\
    \ regular backup in a separate external storage media such as external hard disks.\
    \ You may keep one copy of the backup on a cloud server.  \n\n  Protect your key\
    \ devices    Safeguard your key computer systems, servers, and other digital devices\
    \ from malware. Install licensed and paid total security/internet security/antivirus\
    \ software on all digital devices. Instruct your office staff to avoid the installation\
    \ of unnecessary apps from play stores. Have proper policies for using external\
    \ media such as pen drives, external hard disks, CDs/DVDs; you may block these\
    \ devices on certain computers. You may even consider the closing of open ports\
    \ which are not in use.  \n\n  Apply strong passwords    Never use a common password\
    \ for all email IDs and online accounts. Passwords must not be easy to predict.\
    \ Never use default passwords; most people never change the default passwords\
    \ of routers, modems, and so on. Prefer to use two-factor authentication (either\
    \ opt for One Time Password on mobile or use any external device such as a dongle.\
    \  \n\n  Identify phishing attacks    Avoid connecting to free Wi-Fi hotspots.\
    \ Always remember nothing comes for free. When we use free Wi-Fi, there are high\
    \ chances that many services or web service providers are storing our personal\
    \ login details and other personal information. Sometimes popup may appear on\
    \ your device, and it may redirect you to some phishing page.    Grant account\
    \ privileges as per user's requirement; for example, each should not be granted\
    \ administrative rights on a computer or server. Train your office staff and guide\
    \ them about basic cybersecurity steps. They must know how to identify a genuine\
    \ email (phishing emails normally have spelling mistakes, logo and other images\
    \ of poor graphic design quality, may show some urgency such as to reply within\
    \ 24 hrs otherwise your bank account will be closed or you will be fined, and\
    \ so on), valid web page, and so on (we have discussed this in detail in Chapter\
    \ 1, Email Related Once in a while, conduct mock drills in the office. Report\
    \ a cyberattack immediately to the concerned department (officers' email ID and\
    \ phone numbers are provided in the book).  \n\nCHAPTER 6    Complaint Registration\
    \  \n\n  Introduction    Here we are informing you about the free courses conducted\
    \ by the Indian Government and the name of the Government websites, which issue\
    \ alerts and advisories about where to approach if you are a victim of cybercrime,\
    \ and the procedure to register a cybercrime complaint.  \n\n  Structure    The\
    \ following topics are covered in this chapter:     Free courses by the Indian\
    \ Government    Complaint registration procedure    State-wise cyber cell contact\
    \ details    What to retain as evidence?  \n\n  Objective    This chapter provides\
    \ the resources link to upgrade your knowledge about cybercrime and security along\
    \ with the complaint registration procedure. Cyber helpline numbers and state-wise\
    \ cyber cell email ID and phone numbers are also given for your convenience. \
    \   Free online courses for you by the Government    There are a few online courses\
    \ that the Government provides, and you can find them on the following site: \
    \   https://www.swayam.gov.in    https://www.infosecawareness.in    If you are\
    \ a victim of cybercrime, then the following things will help you:    Cybercrime\
    \ phone helpline 155260 (9:00 am to 6:00 pm)  \n\n  Online complaint registration\
    \ facility    The following steps can be used to register an online complaint:\
    \     Visit the following website:    www.cybercrime.gov.in    Subscribe to the\
    \ advisories issued by the CERT-IN by visiting the following website:    http://www.cert-in.org.in\
    \    Malicious activities can be reported to CERT-IN    Email: incident@cert-in.org.in\
    \    Helpline: +91-1800 114949    In case of stolen/lost mobile, follow these\
    \ steps:     First, register FIR with the police    Helpline 14422    Register\
    \ complaint with Central Equipment Identity Register website that is:    www.ceir.gov.in\
    \  \n\n  State-wise list of cybercrime police stations    The State-wise phone\
    \ numbers and email IDs of the officers:    officers:  officers:  officers:  officers:\
    \  officers:  officers:  officers:  officers:  officers:  officers:  officers:\
    \  officers:  officers:  officers:  officers:  officers:  officers:  officers:\
    \  officers:  officers: officers:  officers:  officers:  officers:  officers:\
    \  officers:  officers:  officers:  officers:  officers: officers:  officers:\
    \  officers:  officers:  officers:  officers:  officers:  officers:  officers:\
    \  officers:    You may refer to the following website to see the cyber cell updated\
    \ email ID and phone numbers:    https://cybercrime.gov.in/  \n\n  Evidence-what\
    \ to retain    It is always good practice to retain evidence related to your cybercrime\
    \ complaint. The following can be treated as evidence:     Credit card receipts\
    \    Bank statements    Online money transfer receipt    Email copy    URL of\
    \ website/page    Transcripts of chat    Brochure/pamphlets    Suspect mobile\
    \ number screenshot    SMS, videos, images    Any other kind of document    Envelopes\
    \ (if received a letter or item through mail or courier)    In case of social\
    \ media derogatory posts, before reporting it to Facebook, Twitter, and so on,\
    \ click the photo, make a video, or take a screenshot.    Some more useful links:\
    \    https://www.cyberswachhtakendra.gov.in    https://www.ncert.nic.in  \n\n\
      References    http://www.cybercelldelhi.in/    https://economictimes.indiatimes.com/wealth/save/8-digital-payment-related-scams-and-how-you-can-avoid-them/articleshow/71863864.cms?utm\\\
    _source=contentofinterest&utm\\_medium=text&utm\\_campaign=cppst    https://economictimes.indiatimes.com/wealth/save/8-digital-payment-related-scams-and-how-you-can-avoid-them/articleshow/71863864.cms?utm\\\
    _source=contentofinterest&utm\\_medium=text&utm\\_campaign=cppst    https://www.cybercrime.gov.in\
    \    https://www.blog.ipleaders.in    http://www.legalserviceindia.com    http://www.limelight.com\
    \    https://www.kaspersky.co.in/blog/camscanner-malicious-android-app/16595/#:~:text=Malicious%20Android%20app%20had%20more,million%20times%20from%20Google%20Play\
    \    https://indianexpress.com/article/technology/tech-news-technology/34-apps-joker-malware-infected-android-uninstall-google-play-store-6701973/\
    \    Be Alert Be Safe!  "
