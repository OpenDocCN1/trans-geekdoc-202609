    \    Some of the common tricks used by cybercriminals are as follows:    ![](image-vxqrnpkx.jpg) \
    \ Figure 3.8: Online gaming     Game developers create several levels of violent\
    \ simulations    WhatsApp groups for games are created where players need to update\
    \ admin and take up new challenges continuously    Tricking teenagers into isolation\
    \ from friends, families, and so on ultimately making them believe that it's not\
    \ just a game but a reality    Embarrassing teens for not being able to complete\
    \ challenges    Threatening teens to make their pictures public and share them\
    \ with their friends    Games such as PUBG are designed to make teens violent\
    \ and addicted so that they can't abstain from it anywhere, be it schools, roads,\
    \ public transport, hospitals, and so on    Several other games such as Choking\
    \ Ghost pepper Ice and Salt Car surfing challenge are designed to cause various\
    \ physical and mental damages to teens  \n\n  Preventive steps to be taken while\
    \ playing online games    Some of the preventive steps, which can be taken are\
    \ as follows:     Parents should discuss the negative impact of violent games\
    \ on teens    Parents/teachers must monitor children's digital devices    Parents\
    \ must monitor their children's browsing habits, online gaming activities, chats,\
    \ and so on    Parents must immediately talk to their children if they notice\
    \ a lack of interest in socializing or too much involvement in online games   \
    \ Involve the teens in other recreational activities such as music, outdoor sports,\
    \ and so on    Play anonymously    Immediately report any indecent behavior, cyberbullying\
    \ incident    Inform school teachers in case of any incidents  \n\n  Preventive\
    \ steps to safeguard a WhatsApp account    The use of WhatsApp also attracts cybercriminals\
    \ to commit a variety of crimes. Hackers may create fake WhatsApp account and\
    \ put an official logo of WhatsApp on the display image. They pretend to be a\
    \ customer care executive or technical support team. They now trick their target\
    \ by asking them to verify the WhatsApp number and ask for 6-digit OTP to verify\
    \ the identity. Because text message appears as technical support team's WhatsApp\
    \ number, people are often trapped and share their OTP. Once the OTP/PIN is revealed,\
    \ the account is hacked. Cybercriminals use the hijacked account to ask for money\
    \ from the victim's friends, relatives, and so on. WhatsApp hacked account can\
    \ expose your chat, text messages, and even photographs.    ![](image-bfhw0we3.jpg) \
    \ Figure 3.9: Secure WhatsApp    Some of the preventive measures are as follows:\
    \     Keep your WhatsApp application secure with a third-party security lock application\
    \    Avoid logging in to WhatsApp web on public computers/devices and remember\
    \ to log out    Do not join any random group invitations if not trusted    Do\
    \ not click on any links forwarded by unknown sources    Do not forward sensitive,\
    \ provocative messages    Apply strict privacy settings    Block the contact if\
    \ you receive unwanted text messages or group invitations    Install WhatsApp\
    \ updates regularly     Fake news spread via social media. Bots (automated programs),\
    \ trolls (humans who use social media for specific reasons) and social media users\
    \ do spread fake news. Bots have the capability to interact with the users and\
    \ share information and messages. Malicious actors (social media users) first\
    \ find out the information about people such as what is their personality like,\
    \ what kind of websites they visit, accordingly they create personality profile\
    \ and show users fake news content. Ordinary social media users also do share\
    \ fake news unknowingly. It is a human tendency to share novel information with\
    \ others. Trolls post comments on social media with an intention to argue to people\
    \ or to insult famous people.  \n\n  Preventive tips to avoid fake news    Fake\
    \ news is one of the biggest global cybercrime concerns, and in a way, it is an\
    \ abuse of social media. Many times, it causes harm to a country's reputation.\
    \ People fabricate stories to get more website visitors and increase their revenues\
    \ from the website advertisements. Sometimes stories are created to mislead people\
    \ or promote a biased point of view or political agenda. We need to evaluate social\
    \ media posts' motives and website headings and distinguish fake content or posts.\
    \ Though there are legal consequences of publishing and spreading fake news, we\
    \ also need to be aware of the following:    ![](image-ulgqln76.jpg)  Figure 3.10:\
    \ Fake news     Never trust any news or information from untrusted sources.   \
    \ Rely on renowned and authentic television news channels rather than social media.\
    \    Report fake pages, profiles, or groups over Facebook, Twitter or Instagram,\
    \ and so on.    Do not join groups luring you for money to commit unethical acts.\
    \    Some pages or groups spread anti-national, communal, or religious information.\
    \ Report such pages immediately.    Never believe random WhatsApp texts claiming\
    \ certain facts and asking you to gather at a place or join a protest and so on.\
    \ Always check the authenticity of the text/news.  \n\n  Preventive tips for a\
    \ smartphone    Some of the preventive tips for a smartphone are as follows: \
    \    Note the International Mobile Equipment Identity number. It is useful in\
    \ tracking lost mobile.    Update mobile operating system and apps regularly.\
    \    Never download any third-party app from the play store without authentication.\
    \    Turn off mobile internet connection, Wi-Fi, Bluetooth, camera when not in\
    \ use.    Use a password or pin to guard your smartphone.    Never share your\
    \ pin/password with others.    Never allow unknown devices to connect via Bluetooth.\
    \    Avoid public or free Wi-Fi as these may not be secure.    Never click on\
    \ links mentioned in email/SMS, as it may harm your mobile phone.    Never allow\
    \ third-party apps to access your data if not necessary.    Back up your data\
    \ regularly.    Report loss of mobile phone immediately to police.    Never ignore\
    \ drainage of battery life before the expected time.  \n\n  Your computer/laptop\
    \ can be infected if:     You download software from untrusted and infected websites\
    \    You plug in an infected USB or external hard disk    You click on any malicious\
    \ weblink    You click on any infected image or document    If you pick up an\
    \ infected device from someone such as college, office, and so on    If you visit\
    \ Torrent websites    If your password is easy    If you use the pirated operating\
    \ system    If you don't use licensed antivirus/internet security software   \
    \ These actions may result in your computer going slow and may corrupt or even\
    \ delete the data. Let's understand it more with the help of an example:    Sumit\
    \ asks his friend Amit about the new video release of a popular Bollywood artist.\
    \ Amit says that he is unaware of the new release, so they decide to download\
    \ it from some website. And as the download starts, his computer gets infected,\
    \ freezes, and the operating system gets corrupted.  "
