  \n更多关于 BPB 的信息，请访问。\n\n\n## 网络犯罪与预防措施\n\n### 网络安全简介\n数字数据正在激增。网络安全每天都在发生。我们依赖计算机。网络安全是一个广阔的话题，涉及信息的完整性、机密性和可用性。\n\
  \n网络安全意识的必要性\n先进技术，特别是互联网，改变了我们的生活，但也带来了许多副作用并让我们变得脆弱。网络攻击每天都在发生；网络安全不断演变。根据领先机构的研究，人类是链条中最薄弱的一环。因此，我们每个人都需要网络安全。\n\
  \n几乎 500 万消费者是网络犯罪的受害者，仅在 2019 年：\n\n![](img/image-8hdrps.jpg)\n图 1.1：几乎 500 万消费者是网络犯罪的受害者，仅在\
  \ 2019 年\n\n2 月 23 日，美国联邦调查局（FBI）互联网投诉中心发布的互联网报告显示，印度在网络犯罪受害者国家 20 位中位第三。根据报告，排除美国后，英国位居首位，有\
  \ 93,796 名受害者，其次是加拿大（3,721 名）和印度（2,901 名）。\n\n来源如下：\nhttps://www.newindianexpress.com/nation/2020/feb/23/india-stands-third-among-top-20-cyber-crime-says-fbi\n\
  \n3 月 11 日，2019 年 4 月 1 日至 12 月 31 日的九个月里，网络犯罪分子盗走了近 230 亿。此外，过去两年显示 ATM/借记和信用卡以及网银诈骗损失了\
  \ 318.4 亿；因此，从 2017 年 4 月 1 日到 12 月 31 日，超过 1.1 万案件共损失 547 亿：\n\n![](img/image-hk70s0lv.jpg)\n\
  图 1.2：网络犯罪案例\n\n来源 timesofindia.indiatimes.com/articleshow/74571025.cms?utm_source=contentofinterest&utm_medium=text&utm_campaign=cppst\n\
  \n# 1 与电子邮件相关的网络犯罪\n\n## 引言\n网络犯罪是以单台计算机、多台计算机或互联计算机/设备进行的犯罪活动。网络攻击可能涉及内网和互联网。网络犯罪可能由个人、团体、组织甚至国家支持机构实施。\n\
  \n## 结构\n在本章中，我们将涵盖以下与电子邮件相关的常见网络犯罪（带有示例），例如：\n- 垃圾邮件 (Spamming)\n- 钓鱼攻击 (Phishing)\n\
  - 邮件弹攻击 (Bombing)\n- 伪装 (Spoofing)\n\n## 目标\n让您了解通过电子邮件进行的各种网络犯罪以及保护安全的预防措施。\n\n\
  \n\n\n\n## 常见的电子邮件相关网络犯罪\n\n在图中，第一行定义了网络犯罪，第二行说明了其目标。图中展示了一些常见的电子邮件相关的网络犯罪。\n\n\
  ![](img/image-8pslwosf.jpg)\n图 1.1: 电子邮件相关的网络犯罪\n\n现在让我们逐一详细查看它们：\n\n### 垃圾邮件 (Spam\
  \ email)\n向接收者发送的非意愿的批量邮件，其动机可能是广告、盗取个人信息、安装恶意软件或销售非法/违禁物品。它通常被称为电子邮件的负面影响。\n\n\
  ![](img/image-k5lp1ylb.jpg)\n图 1.2: 垃圾邮件\n\n### 黑客攻击 (Hacking)\n网络犯罪分子入侵了 Sumit\
  \ 的电子邮箱并接管了他的笔记本电脑。当 Sumit 打开邮箱检查来自学校的邮件时，他发现无法登录。于是，他提交了黑客攻击投诉。经过警方调查，发现黑客对 Sumit\
  \ 的活动进行了广泛搜索，爬取了他的 `Facebook`、`Twitter`、`Instagram` 等社交媒体账号，并找到了他的出生日期。\n\n在研究了两个月后，网络犯罪分子给他发送了一封带有附件的邮件，假装成学校管理部门。他们选择了一个非常引人注目的主题来吸引\
  \ Sumit 的注意力，让他下载了附件，恶意软件被下载到他的电脑中，攻击者获取了其笔记本电脑和摄像头的权限。\n\n### 钓鱼攻击 (Phishing)\n\
  网络犯罪分子通过电子邮件冒充个人、组织等。这些欺诈邮件可能来自各种政府机构（例如所得税部门），声称你没有按时申报所得税，因此必须缴纳罚款；也可能假装来自银行要求更新你的\
  \ `KYC` 详情；他们会发送令你兴奋的促销信息，提供免费购物券或现金回馈，或者可能发送威胁性邮件，声称如果不回复此邮件，你的邮箱账户将被关闭。当你点击邮件中提到的链接时，它会将你导向一个与合法网站相似的虚假网站。与疫情更新相关的邮件是一种新的钓鱼趋势。\n\
  \n![](img/image-nysft84m.jpg)\n图 1.3: 钓鱼攻击\n\n受害者收到一封似乎来自世界卫生组织的邮件。邮件内容与 `COVID`\
  \ 更新有关，并有一个关于冠病毒地图更新的链接。点击后，它将其引导至一个要求提供个人信息和地址的网页。点击鼠标后，该网页会安装恶意软件以窃取设备的敏感信息。\n\
  \n### 邮件炸弹 (Email bombing)\n网络犯罪分子利用自动化程序在极短时间内发送大量邮件，以淹没你的收件箱。这导致由于邮件配额超出而邮件退回。由于这种情况，你可能会错过重要的通信，这可能进一步导致网络服务器挂起。通常，官方邮箱是目标，因为网络犯罪分子可能有各种意图，例如控制你的邮箱账号并通过拒绝服务攻击来损害邮件服务器。\n\
  \n![](img/image-3dam31rj.jpg)\n图 1.4: 邮件炸弹\n\n某网络托管公司注意到其 Web 服务器在过去几天内流量非常大，这很不寻常。某一天，其许多客户的网站都无法运行。经过调查，发现其中一个竞争对手雇佣了一些黑客发动邮件炸弹攻击，导致该公司的\
  \ Web 服务器崩溃无法运行。\n\n### 伪造 (Spoofing)\n邮件使用伪造的发送者地址创建；通常发送者会假装成接收者认识的人。在伪造邮件中，发送者的真实身份被隐藏，其目的是通过诱导接收者或安装恶意软件来获取其财务详情。\n\
  \n![](img/image-igjfrnpb.jpg)\n图 1.5: 伪造\n\n作为呼叫中心执行人员的 Anjali Gupta 收到一封似乎来自她办公室的邮件。根据邮件内容，公司由于她在封锁期间表现出色，为她提供了从在线门户网站购买食品杂货的现金回馈。她工作非常高效。邮件中提到了一个链接，要求\
  \ Anjali 提供一些银行详情。Anjali 遵循了邮件指令，诈骗者拨打她的电话，假装是她的办公室同事并要求分享银行 `OTP`。Anjali 分享了 `OTP`，结果她的账户被扣除了\
  \ `Rs 25,000/-` 而不是入账。经过调查，确定这是一起邮件诈骗案，Anjali 没有仔细核对邮箱地址，落入了网络犯罪分陷阱。\n\n![](img/image-igjfrnpb.jpg)\n\
  图 1.6: 伪造\n\n### 欺骗者使用的常用电子邮件陷阱\n欺骗者使用的常用陷阱包括：\n\n![](img/image-nysft84m.jpg)\n\
  图 1.7: 通过邮件进行陷阱\n\n### 保护你邮箱的预防措施\n保护你邮箱可以采取的一些预防措施如下：\n- 使用强密码（至少八个字母和数字组合）。\n\
  - 在打开 `.exe` 和其他附件之前始终进行扫描。\n- 永远不要点击从陌生人处收到的链接。\n- 忽略/删除垃圾邮件。\n- 不要陷入邮件中未知人员提供的礼物陷。\n\
  - 永远不要在社交媒体上分享你的真实出生日期、出生地、地理位置和其他隐私信息。\n- 通过在邮箱账户设置中添加手机来实现双重身份验证。每当你从新设备访问邮箱时，都会收到一个\
  \ `SMS` 码。\n- 验证你的邮箱登录历史，确保只有你打开了它。\n- 提供备用邮箱地址和电话，以便邮件服务提供商在出现异常时联系你。\n- 检查最近用于查看邮箱的设备，查看是否有异常活动。\n\
  - 管理与邮箱账户关联的应用权限。\n- 永远不要向任何人透露密码。\n- 永远不要在任何设备上保存你的密码。\n- 核实网站的真实性；检查浏览器中的拼写错误和锁头图标。\n\
  - 如果你的邮箱被破解，请联系你的邮件服务提供商。\n- 避免多个邮箱使用相同的密码。\n- 避免免费、公共且不安全的 `Wi-Fi`。\n\n# 第二章 财务欺骗与网络犯罪\n\
  \n网络犯罪分子利用计算机、互联网、智能手机、电子邮件、短信等数字手段实施各种财务欺骗。他们发送钓鱼邮件或 `SMS`，当你点击或打开附件时，恶意软件就会安装到你的数字设备中。他们窃取姓名、出生日期、银行账户详情、信用卡详情等机密信息来实施财务欺骗。最常见的财务欺骗包括洗钱、电子诈骗、逃税、伪造、网上银行欺骗、信用卡/借记卡欺骗、电子商务诈骗、股市操控、贿赂、资助主义等。\n\
  \n## 结构\n在本章中我们将涵盖以下主题：\n\n## 目标\n在这里，我们的目标是让你了解各种财务犯罪以及保护这些犯罪的预防措施。我们让你了解在发生网络犯罪时，该去哪里、做什么以及向谁寻求帮助。\n\
  \n\n\n\n\n## 常见的金融欺骗\n\n下图中提到了一些常见的金融欺骗：\n\n![](img/image-t0g9m5zp.jpg)\n图 2.1：定期商业银行和金融机构报告的欺骗数据\n\
  \n来源如下：\nhttps://www.financialexpress.com/industry/banking-finance/hundreds-of-crores-of-rupees-lost-in-card-payment-internet-banking-frauds-in-just-3-months/1886386/\n\
  \n![](img/image-8nnsu29l.jpg)\n图 2.2：金融欺骗类型\n\n### 金融欺骗类型\n\n### 诈骗者使用的二维码/OTP/与应用程序相关的常用手段\n\
  诈骗者使用的常用手段如下：\n\n* 网络罪分子通过电子邮件和 WhatsApp 发送`QR codes` 来黑入银行账户。\n* 伪造的 `NPCI`/`UPI`/`BHIM`账号和门户网站。\n\
  * 微博客网站上出现了大量伪装 `@NPCI_BHIM` 官方帮助热线的 Twitter 账号。这些虚假账户欺骗寻求帮助的客户泄露其账户、钱包或卡片详情。\n\n\
  **示例 1：**\n网络罪分子利用 `QR codes` 和 `OTP` 欺骗客户。\n\n**示例 2：**\n诈骗者使用远程桌面软件获取银行账户访问权限。\n\
  \n### 预防金融欺骗的提示\n可以采取的一些预防措施包括：\n\n* 永远不要与任何人分享 `OTP`。\n* 银行账户收款时永远不需要 `OTP`。\n\
  * 直接从银行官方网站获取客户服务热线。避免使用在 Google 等平台上显示的号码。\n* 永远不要下载你不需要的应用程序。\n* 在下载之前，向银行核实该\
  \ App 的真实性。\n* 在支付任何费用之前，检查网站的真实性。\n* 为婚友网站使用独立的电子邮箱。\n* 永远不要与通过婚友网站认识的人分享个人和敏感信息。\n\
  * 仔细核实 NRI（非居民印度）资料。\n\n# 第 3 章：社交媒体中的网络犯罪\n\n## 引言\n从儿童、青少年、家庭主妇、职场人士到非技术工人，几乎每个人都会出于各种原因在社交媒体上花费时间。社交媒体上的网络犯罪非常常见，例如网络欺凌、`MMS`、威胁信息、虚假资料、身份盗窃、网络骚扰、网络跟踪等。网络罪分子不仅针对个人，还会使用机器人进行自动化攻击。\n\
  \n\n\n\n\n## 结构\n在本章中，我们将涵盖以下主题：\n\n## 目标\n在这里，我们的目的是让你了解各种与社交媒体相关的网络犯罪以及保护自身的预防措施。\n\
  \n## 社交媒体中的网络犯罪\n以下是社交媒体中常见的网络犯罪：\n\n### 冒充/身份\n网络犯罪分子获取他人的信息来进行欺诈，例如在社交媒体上创建虚假资料、网上银行诈骗、电子商务交易等。\n\
  ![](img/image-w59lw5pj.jpg)\n图 3.1：**社交媒体欺诈**\n他们可能使用各种技术欺骗受害者，例如`phishing`（网络钓鱼）、`phone\
  \ scams`（电话诈骗）或`skimming`（使用安装在 ATM 销售点的 `skimmer` 读器获取信用卡/借记卡信息的非法方法）。\n\n### 网络欺凌\n\
  这是一种分享虚假、种族歧视、伪或有害内容的行为，如文本、照片、视频等，这会导致某些人感到尴尬或羞辱。\n![](img/image-4brqnps6.jpg)\n\
  图 3.2：**网络欺凌**\n容易受攻击的目标是学生儿童、青少年、女性和职场人士。\n\n### 网络人格\n这是一种个人的行为模式。这类性格的人专门针对女性，并在\
  \ `Facebook`、`Twitter`、`Instagram` 和 `WhatsApp` 等社交媒体上羞辱她们。他们发布不雅的评论或某些病毒式视频。\n\n\
  ### 网络诽谤\n这是指发布虚假信息以损害个人或群体的声誉，或者由某人发起虚假活动以破坏任何机构的形象的行为：\n![](img/image-bc07praf.jpg)\n\
  图 3.3：**网络诽谤**\n\n### 网络跟踪\n这是一种经过计划的网络犯罪。起初，一个人可能会发送负面或令人的评论或消息，但随后，网络犯罪分子会在常用的社交媒体应用或门户网站上发送烦人的信息或发布虚假指控。这些信息可能来自由同一个人管理的一个或多个账户。有时，网络跟踪是间接进行的，目的是收集个人信息以备进行身份盗用。\n\
  ![](img/image-fr04ymwh.jpg)\n图 3.4：**网络跟踪**\n据发现，通常网络跟踪者是受害者或其家属认识。\n\n### 网络色情\n\
  网络色情者通过社交媒体向人们出售色情内容；他们可能会创建虚假资料来这样做。在印度，观看和保留色情内容是非法的。请参考以下参考网站：\n`http://legalserviceindia.com/`\n\
  \n### 网络猥秽\n网络猥秽在印度属于犯罪，并根据 `66E` 条规定对犯罪者追究责任。让儿童参与性行为或在线关系也是非法的。\n\n### 报复\n发布/分发色情内容以使个人蒙羞或破坏形象。这些视频可能在主体同意或未经同意的情况下制作，但在未经许可的情况下分发。儿童、青少年和女性是主要目标，但由于嫉妒，组织中的任何同事不分性别也可能这样做。\n\
  \n### 发布人肉 (Doxing)\n这是 dropping 的缩写。这是一种在互联网上收集并发布他人个人信息的做法。网络犯罪分子这样做是为了在线骚扰、勒索或威胁某人。有时，发布人肉是由调查人员为了法律调查或由公司为了业务分析进行的。\n\
  ![](img/image-y8r4ujmd.jpg)\n图 3.5：**发布人肉**\n\n### 网络恐吓 (Swatting)\n一种在网络上的骚扰技术，通常由网络游戏社区使用。包括向警察、消防或救护热线拨打假电话，向当局提供虚假信息以制造恐慌，或向某人的所在地发送任何紧急支援。网络犯罪子的动机可能是网络骚扰、报复或经济利益。\n\
  \n### 网络钓鱼 (Trolling)\n通过说具有争议的话题来挑衅他人，引发冲突或伤害他人情感。`YouTube`、`Twitter` 和 `WhatsApp`\
  \ 是网络钓鱼常见的平台。它可能针对个人、特定群体、社区或名人。\n\n### 猫钩子诈骗 (Catfishing)\n这是一种欺骗技术；网络犯罪分子创建一个虚假的在线身份来进行财务欺诈，但他们可能是为了报复或为了陷或虐待儿童或女性。\n\
  \n### 黑客攻击\n通过创建虚假账户或欺骗他人，网络犯罪分子获取个人/敏感信息，如登录凭据、银行详情，或接管某人的社交媒体账户。\n\n### 假期\n犯罪分子在社交媒体上进行侦察以了解目标的行踪。人们在社交媒体上发布他们的假期计划甚至实时位置，犯罪分子利用这一点进行犯罪。\n\
  \n### 虚假在线\n网络犯罪分子特别通过情感联系欺骗儿童、青少年和女性。有时他们甚至会发送礼物来诱捕目标，随后利用他们进行洗钱等各种犯罪活动。他们甚至以医疗紧急情况或国外出现的问题为借口骗他们要钱。\n\
  \n### 购买非法\n通过创建虚假资料，网络犯罪分子利用社交媒体交易非法或违禁物品。\n\n\n\n\n\n## 欺骗者在社交媒体上常用的花招\n\n如今，我们都出于各种原因活跃在社交媒体上；专业人士利用社交媒体招聘人员并展示他们的专业技能和成就。同样，学生和家庭妇女也有活跃在社交媒体上的理由。人们甚至对此成瘾，许多国家现在设立了成瘾中心来治疗社交媒体成瘾者。因此，网络犯罪分子有大量机会陷害和欺骗普通的无辜的民。由于互联网没有边界，网络犯罪分子可以从任何国家接触他们的目标。常见的社交媒体犯罪类型包括彩票、免费礼品卡、免费购物券、加密货币（`bitcoin`）收集以及从社交媒体网站收集您的个人信息。网络犯罪分子通过发布帖子或发送电子邮件来诱骗无辜的人。他们说你中了彩票或获得了免费礼品券。有时，他们还会克隆个人的身份来实施犯罪。\n\
  \n![](img/image-sexz7yi0.jpg) 图 3.6: 社交媒体诈骗\n\n欺骗者使用的一些常用技巧如下：\n\n* 在输入密码时留意你的键盘\n\
  * 使用手机或笔记本电脑检查浏览器中保存的密码\n* 在你的设备中安装恶意软件和击键记录软件\n* 在公共网吧的电脑上寻找登录凭据\n* 使用他人名字创建社交媒体账户并发布他们公开的照片\n\
  * 破解 Wi-Fi 密码并使用真实所有者的姓名实施网络犯罪\n* 使用你的健康保险进行医疗治疗\n* 在社交媒体上跟踪某人的活动、发表评论和发送消息，即使不在联系列表中\n\
  * 向受害者的联系人发送好友请求以访问其完整的个人资料信息\n* 在受害者的个人页上发布建议、粗俗评论、图片或视频\n* 在社交媒体的受害者朋友和联系列表中传播谣言、虚假信息、诽性评论、脏话\n\
  * 诱骗青少年发送色情图片并在随后对其进行勒索\n* 不希望的游戏邀请、点赞（poke）、提醒（ping）或索要约会的评论等\n* 黑客、盗取受害者的账户密码并发送信息、提亲、使用他们的个人资料发布色情内容，导致其联系人相信是用户所为\n\
  * 代表银行或银行钱包（如 `Paytm`、`BHIM` 等）拨电话\n* 说服客户下载并安装某些第三方应用程序\n* 索要 `OTP`\n* 发送邮件并要求填写\
  \ KYC 详情或点击链接\n* 提供受害者联系列表的参考示例或可信的参考人以说服受害者\n* 滥用复印件获取驾驶执照或护照\n\n## 在社交媒体上应采取的预防措施\n\
  \n以下是在社交媒体上可以采取的一些预防措施：\n\n* 记忆密码而不是记录或保存。\n* 永远不要将身份证（`PAN`/`Aadhar`/`驾驶执照`）的电子副本留在垃圾箱或公共电脑中。\n\
  * 永远不要点击来自未知邮件或消息的网络链接。\n* 保持你的电子设备受密码/PIN 保护。\n* 定期检查社交媒体账户的最后登录时间、登录设备、位置和浏览器信息。\n\
  * 实施双重验证。\n* 在下载或安装第三方应用时要小心。\n* 避免使用任何免费 Wi-Fi、游戏、优惠码等。\n* 如果长期不使用任何社交媒体账户，请将其注销。\n\
  * 永远不要在电子商务/在线购物网站保存信用卡/借记卡信息。\n* 在提示保存时，永远不要保存密码。\n* 在社交媒体上使用严格的隐私规则。\n* 避免在社交媒体平台上标记或发布位置或假期的实拍图片。\n\
  * 避免将各种社交媒体账户与其他应用程序开启单点登录或同步选项。\n* 始终记住你的密码，而不是在应用程序或浏览器中记录或保存它们。\n* 除非是熟人，否则永远不要接受社交媒体平台上陌生人的请求。\n\
  * 永远不要点击来自陌生人邮件或消息的链接。\n* 立即报告或看起来看起来可的账户。\n* 将你的隐私设置得非常严格，以防止任何陌生人进入你的账户。\n* 始终关注主要社交媒体账户的最后登录、登录设备、位置和浏览器信息。\n\
  * 禁止从你的社交媒体账户下载图片/视频以防滥用。\n* 不要回复社交媒体上的任何形式的通信，如游戏邀请、点赞或消息。\n* 让你的联系人和父母了解社交媒体上的任何可疑活动。\n\
  * 如果你的个人资料被黑、滥用或被诽谤，请不要恐慌。向网络警察部门报案。\n* 永远不要在社交媒体平台上添加有关旅行或休假的信息。\n* 在分享假期或旅行的图片或视频时，不要分享你的位置。\n\
  * 始终在回到家后再发布任何旅行或休假的帖子。\n* 要求你最活跃的朋友不要在社交媒体上评论你的旅行或休假计划。\n* 避免在图片上标记日期、时间和位置。\n\
  * 永远不要打开来自可疑来源的邮件和附件。\n* 永远不要分享你的 `OTP`，即使欺骗者说他们是直接从银行打来的。\n* 永远不要根据陌生人的电话要求安装任何应用程序，除非你知道它是且安全的。\n\
  * 即使在 `IVR` 上也避免输入信用卡/借记卡信息。\n* 在阅读诱人的报价时始终保持警惕。\n* 永远不要按照列出的任何步骤获取优惠。\n* 在你的笔记本电脑/手机上安装任何免费软件/应用程序之前，确保取消勾选所有必要的章节、条款，以防止安装预期之外的内容。\n\
  * 保持你的杀毒软件更新到最新。\n* 永远不要在银行或 ATM 机留下信用卡/借记卡收据。\n* 确保信用卡/借记卡的刷卡在你场的情况下完成的。\n* 如果不参加，没有人能中彩票。\n\
  * 在你的账户中开启垃圾邮件过滤器。\n* 永远不要向未知账户接受或转移资金。\n* 在回复任何邮件之前核对域名。\n* 永远不要响应声称你的卡被封锁的电话。\n\
  * 仅在真实的招聘网站上搜索和申请工作。\n* 如果你遇到了社交媒体联系人，告知你的朋友或家人。\n* 永远不要与在社交媒体上的人分享亲密照片。\n* 与亲家人分享安全的浏览习惯。\n\
  * 不要删除具有攻击性的短信或邮件。这些对警方调查很有帮助。\n\n## 在线游戏\n\n在线游戏门户日益增加，毫无疑问，和其他在线平台一样，它也有缺陷。根据媒体调查，游戏玩家每周在在线游戏上至少花费六小时。在游戏聊天和大厅中发现言语暴力非常常见。在在线游戏社区中，欺凌者被称为网络犯罪分子，网络犯罪分子发现在线游戏是一个易于针对青年的平台，用于网络欺凌、金钱勒索和唆使他们自杀等各种动机。\n\
  \n![](img/image-rtoluf9r.jpg) 图 3.7: 在线游戏\n\n我们都见过“蓝鲸游戏”的案例，当它在每个新闻频道达到巅峰时，每个国家都在报道它对青少年造成的死亡和创伤影响。蓝鲸窒息挑战、鬼辣椒冰、盐冲浪挑战（Salt\
  \ Car Surfing）以及 `PUBG` 是一些具有负面影响的游戏。青少年在这些挑衅且心理上令人作呕的游戏中面临了挑战。最终，网络犯罪分子将青少年与朋友和家人隔离开，并唆他们自杀或从他们那里勒索钱财。\n\
  \n\n\n\n\n# 网络游戏以及网络犯罪分子在网络游戏中常用的骗术\n\n网络犯罪分子常用的一些骗术如下：\n\n![](img/image-vxqrnpkx.jpg)\
  \ 图 3.8：网络游戏\n\n* 游戏开发者创建了多个层级的暴力模拟。\n*   创建游戏 WhatsApp 群组，玩家需要不断向管理员更新并持续接受新挑战。\n\
  *   诱导青少年与朋友、家人等隔绝，最终让他们相信这不仅仅是游戏，而是现实。\n*   因青少年无法完成挑战而羞辱他们。\n*   威胁要将他们的照片公开并分享给他们的朋友。\n\
  *   诸如 `PUBG` 等游戏旨在让青少年变得暴力和成瘾，以至于他们在任何地方（无论是学校、道路、公共交通、医院等）都无法戒掉。\n*   其他几种游戏，如“鬼椒辣椒冰”和“盐水冲浪”挑战，旨在对青少年造成各种身体和心理伤害。\n\
  \n## 玩网络游戏时应采取的预防措施\n\n可以采取的一些预防措施如下：\n\n* 父母应该讨论暴力游戏对青少年的负面影响。\n*   家长/老师必须监控儿童的数字设备。\n\
  * 父母必须监控子女的浏览习惯、在线游戏活动、聊天等。\n* 如果父母发现孩子对社交失去兴趣或过度沉迷于在线游戏，必须立即与孩子交谈。\n* 让青少年参与其他娱乐活动，如音乐、户外运动等。\n\
  * 以匿名身份玩。\n* 立即报告任何不恰当行为或网络欺凌事件。\n* 发生任何事件时，通知学校老师。\n\n## 保护 WhatsApp 账号的预防措施\n\n\
  `WhatsApp` 的使用也会吸引网络犯罪分子实施各种犯罪。黑客可能会创建虚假的的 `WhatsApp` 账号，并在显示图像上放置 `WhatsApp` 的官方标志。他们假装成客服执行人员或技术支持团队。他们现在通过要求目标验证\
  \ `WhatsApp` 号并索要 6 位数字 `OTP` 来验证身份来欺骗他们。由于短信显示为技术支持团队的 `WhatsApp` 号，人们往往会陷入陷阱并分享他们的\
  \ `OTP`。一旦 `OTP/PIN` 泄露，账户就会破解。网络犯罪分子利用被劫持的账户向害者的朋友、亲戚等索要钱财。被破解的 `WhatsApp` 账户可能会暴露你的聊天记录、短信信息甚至照片。\n\
  \n![](img/image-bfhw0we3.jpg) 图 3.9：安全的 WhatsApp\n\n一些预防措施如下：\n\n* 使用第三方安全锁应用程序保持你的\
  \ `WhatsApp` 应用程序安全。\n* 避免在公共计算机/设备上登录 `WhatsApp web`，并记住注销。\n* 如果不被信任，请勿加入任何随机群组邀请。\n\
  * 不要点击由未知来源转发的任何链接。\n* 不要转发敏感、挑衅性的信息。\n* 应用严格的隐私设置。\n* 如果你收到不想要的短信或群组邀请，请屏蔽该联系人。\n\
  * 定期安装 `WhatsApp` 更新。\n\n虚假新闻通过社交媒体传播。\n\n 机器人（自动化程序）、喷子（出于特定原因使用社交媒体的人类）和社交媒体用户会传播虚假新闻。机器人具有与用户交互并分享信息和消息的能力。恶意行为者（社交媒体用户）首先获取有关人们的信息，例如他们的性格如何、访问哪些网站，据此创建性格画像并向用户展示虚假新闻内容。普通社交媒体用户也会在不经意间分享虚假新闻。与他人分享新颖信息是人类的一种倾向。喷子在社交媒体上发布评论，目的是与人争论或侮辱名人。\n\
  \n## 避免虚假新闻的预防技巧\n\n虚假新闻是全球网络犯罪关注的问题之一，在某种程度上，它是对社交媒体的滥用。许多时候会对国家的声誉造成损害。人们编造故事以获得更多网站访问者，并增加网站广告收入。有时，创建故事是为了误导人们或推广偏激的观点或政治议程。我们需要评估社交媒体帖子的动机和网站标题，并区分虚假内容或帖子。虽然发布和传播虚假新闻会有法律后果，但我们也需要注意以下点：\n\
  \n![](img/image-ulgqln76.jpg) 图 3.10：虚假新闻\n\n* 永远不要相信不可信来源的新闻或信息。\n* 依靠知名且真实的电视新闻频道，而非社交媒体。\n\
  * 在 `Facebook`、`Twitter` 或 `Instagram` 等平台上举报虚假页面、简介或群组。\n* 不要加入诱导你为了金钱而从事不道德行为的群组。\n\
  * 某些页面或群组传播反国家、社区或宗教信息。立即举报此类页面。\n* 永远不要相信声称某些事实并要求你在某地聚集或参加抗议等的随机 `WhatsApp` 短信。始终检查短信/新闻的真实性。\n\
  \n## 智能手机的预防技巧\n\n智能手机的一些预防技巧如下：\n\n* 记录国际移动设备识别码（IMEI）。它对追踪丢失手机很有用。\n* 定期更新移动操作系统和应用程序。\n\
  * 不要在没有身份验证的情况下从应用商店下载任何第三方应用。\n* 不使用时关闭手机网络连接、`Wi-Fi`、蓝牙`和摄像头。\n* 使用密码或 `pin` 保护你的智能手机。\n\
  * 永远不要向他人分享你的 `pin/密码`。\n* 不允许未知设备通过 `蓝牙` 连接。\n* 避免使用公共或免费 `Wi-Fi`，因为这些可能不安全。\n\
  * 不要点击邮件/短信提到的链接，因为它可能会损害你的手机。\n* 如果必要，不要允许第三方应用访问你的数据。\n* 定期备份数据。\n* 手机丢失后立即向警方报案。\n\
  * 永远不要忽视电池提前消耗的情况。\n\n如果发生以下操作，你的电脑/笔记本可能会被感染：\n\n* 从不可信和受感染的网站下载软件。\n* 插入受感染的 `USB`\
  \ 或外部硬盘。\n* 点击任何恶意链接。\n* 点击任何受感染的图像或文档。\n* 从大学、办公室等地方拿起受感染的设备。\n* 访问 `Torrent` 网站。\n\
  * 如果你的密码简单。\n* 使用盗版操作系统。\n* 如果你不使用授权的反病毒/互联网安全软件。\n\n这些操作可能导致你的电脑变慢，并可能损坏甚至删除数据。让我们通过示例进一步了解：\n\
  \n`Sumit 询问朋友 Amit 关于一位热门宝莱坞艺人的新视频发布。Amit 说他不知道新发布，于是他们决定从某个网站下载。下载一开始，他的电脑被感染了，死机了，操作系统损坏了。`\n\
  \n\n\n\n\n## 计算机/笔记本电脑的预防技巧\n\n以下是计算机/笔记本电脑的一些预防技巧：\n\n- 使用 `Bluetooth` 时必须开启隐身模式，以避免被附近的人发现。\n\
  - 如果你想处理电脑，请先删除所有数据。\n- 使用包含字母、数字和特殊字符的强密码组合。\n- 使用经过验证的开源或授权的操作系统，并定期进行更新。\n- 使用网络安全和防杀病毒软件。\n\
  - 不使用时关闭移动网络连接、`Wi-Fi`、`Bluetooth` 和摄像头。\n- 将个人文件夹和私人文件夹分开存放。\n- 永远不允许未知设备通过 `Bluetooth`\
  \ 连接。\n- 仅从官方网站下载内容。\n- 避免使用公共或免费 `Wi-Fi`，因为这些可能不。\n- 定期删除 cookie、临时文件和浏览历史。\n-\
  \ 定期备份你的数据。\n- 永远不要电脑运行缓慢或响应异常。\n- 永远忽略新程序和图标的突然出现。\n- 永远忽略意外的错误消息或弹出窗口。\n\n## 通用预防措施\n\
  \n以下是一些通用预防措施：\n- 更改 `Wi-Fi` 的默认密码。\n- 禁用电脑上的文件共享。\n- 使用浏览器的无痕模式。\n- 在购物或进行在线交易之前，检查\
  \ `HTTPS`、`URL` 中的锁标志以及网站所有权。\n- 不使用时关闭电脑、调制调器等设备。\n- 永远不要在电脑的 `C` 盘上存储信息。\n- 定期更改密码。\n\
  - 尊重他人的隐私；在发布前考虑两次。\n- 举报非法/攻击性/辱骂性内容。\n- 在线聊天时使用别名。\n- 立即向老师和父母举报网络欺凌。\n- 仅在社交媒体上与认识的人联系。\n\
  \n## 居家办公时的预防技巧\n\n- 摄像头可以连接许多应用程序，这些应用可能存在漏洞并窃取你的数据。因此，永远不要离开摄像头。\n- 在拷贝数据之前，始终扫描外部硬盘和优\
  \ 盘。\n- 更改默认用户 ID 和密码。\n- 优先使用至少八个位的密码。\n- 使用授权的操作系统。\n- 安装授权的防杀病毒/网络安全软件。\n- 在打开文档之前始终进行扫描。\n\
  - 打开邮件附件时要小心，例如检查邮件是否来自真实来源并验证域名。\n- 下班后注销系统。\n- 定期备份数据。\n- 不使用时锁定电脑。\n- 不使用时关闭路由器。\n\
  \n## 识别虚假网页链接/URL\n\n- 寻找 `URL` 中的锁标志，以确保网站处于安全层。\n- 检查 `URL` 是否为 `https`；`https`\
  \ 中的 `s` 代表安全层。\n\n# 第 4 章：与移动应用程序相关的欺诈\n\n## 引言\n\n媒体报道，`Apple` 和 `Google Play\
  \ Store` 上有超过五百万个应用程序；移动应用帮助业务增长。因此，这些对于网络犯罪分子来说是金矿，他们对不安全的移动应用进行复杂的攻击。有漏洞的程序会泄露整个用户数据，诈骗者获取数据后会在包括暗网在内的各种平台上将其出售。\n\
  \n## 结构\n\n在本章中，我们将涵盖以下主题：\n\n## 目标\n\n我们的目标是让您意识到移动应用程序欺诈，以及保护它们的预防步骤。\n\n## 与移动应用程序相关的网络犯罪\n\
  \n移动应用是我们日常生活中的一部分，我们使用它们来支付账单、办理银行服务等，它们在未来几年也一直占据主导地位。因此，这些是网络犯罪分子眼中极具吸引力的目标。有时黑客会克隆流行的移动应用，无辜的用户成为他们的受害者。\n\
  \n全球有超过 32 亿智能手机用户，移动应用行业蓬勃发展并不意外。现在，考虑到全球有 11.4 亿平板电脑用户，这个数字在过去六年中增长了约 36%。移动时间的\
  \ 88% 是花在应用程序上的。\n\n## 关键移动应用统计数据\n\n- 预计移动应用到 2023 年将产生超过 9350 亿美元的收入。\n- `Apple\
  \ App Store` 有 196 万个应用程序供下载。\n- `Google Play Store` 有 287 万个应用程序供下载。\n- 21% 的千禧一代每天每天打开应用程序\
  \ 50 次以上。\n- 49% 的人每天打开应用程序 11 次以上。\n- 美国所有数字媒体使用时间的 69% 来自移动应用。\n- 平均每个智能手机所有者每天使用十个应用程序，每月使用\
  \ 30 个。\n- 来源如下：`https://buildfire.com`\n\n由于我们对移动应用的依赖，我们往往会忽略安全警告，导致网络攻击。有时移动应用已经感染了恶意软件。这为网络犯罪分子提供了访问你的电子邮件、消息、照片、联系人列表甚至动态验证码（OTP）的机会。\n\
  \n人们使用 `CamScanner` 应用扫描文档。8 月，总部位于莫斯科的跨国网络安全和防杀病毒公司 `Kaspersky`（卡巴斯基）报告了其中的：\n\
  来源如下：`https://www.kaspersky.co.in/blog/camscanner-malicious-android-app/16595/#:~:text=Malicious%20Android%20app%20had%20more,million%20times%20from`\n\
  \nGoogle 从其应用商店删除了 34 个受恶意软件感染的应用程序\n来源如下：`https://indianexpress.com/article/technology/tech-news/34-apps-malware-infected-google-play-670193/`\n\
  \nJuice 公共移动充电桩也可能感染你的手机。网络犯罪分子劫持电源通道，因为同一根电缆被用于供电和数据传输。他们可能会提取你的个人数据，包括联系人列表、消息和照片。\n\
  \n有时移动应用会感染勒索软件。勒索软件会完全锁定设备，为了恢复访问权限，网络犯罪分子会索要巨额赎金。让我们通过例子来理解：\nRani 安装了一个扫描扫描移动应用来扫描她的学院文件。一段时间后，她注意到手机变慢了，并且显示广告，有时还会显示色信息。咨询网络安全专家后，她卸载了感染的应用，备份了数据并重置了手机。\n\
  \n 预防技巧\n- 从信任源安装应用程序并检查其真实性。\n- 在授予移动应用权限时要小心。\n- 定期更新移动操作系统。\n- 安装授权的防杀病毒/网络安全软件。\n\
  - 如果手机行为出现异常，请保持怀疑。\n- 删除所有与受感染应用相关的数据并卸载它。\n\n# 第 5 章：职场人士和小小型企业的清单\n\n## 引言\n\n\
  我们所有人都有面临网络安全泄露的高概率，很多时候这会变成一笔非常昂贵的代价。雇佣一名技术良好的长期网络安全专家是昂贵的，即使对于在专业或小型企业工作的个人来说，聘请网络安全顾问的服务可能也很昂贵。\n\
  \n## 结构\n\n在本章中，我们将介绍职场人士、顾问和小型企业的清单。\n\n## 目标\n\n网络安全基础知识或遵循网络卫生习惯将帮助 IT 和非 IT\
  \ 专业人士、非政府组织（NGO）以及小型企业通过采取适当的预防措施来保护他们的重要数据。\n\n\n\n\n\n## 定期备份您的数据\n某些数据可能非常重要且关键，例如客户的个人信息和支付详情，包括账户号码、信用卡/借记卡详情等。如果你养成定期备份数据的习惯，网络犯罪分子勒索你的几率几乎为零。大多数个人/组织没有适当的备份；因此，他们被迫支付勒索软件。识别重要数据并在独立的外部存储介质（如外接硬盘）中进行定期备份。你可以在云服务器上保留一份备份副本。\n\
  \n## 保护您的关键设备\n保护您的关键计算机系统、服务器和其他数字设备免受恶意软件的侵害。在所有数字设备上安装授权且付费的全方位安全/网络安全/防病毒软件。指导您的办公室员工避免从应用商店安装不必要的应用程序。对使用\
  \ U 盘、外接硬盘、CD/DVD 等外部介质制定恰当的策略；您可以在某些计算机上禁用这些设备。您甚至可以考虑关闭未使用的开放端口。\n\n## 使用强密码\n\
  切勿为所有电子邮箱和在线账户使用通用密码。密码不能易于预测。永远不要使用默认密码；大多数人从不更改路由器、调制调器等的默认密码。优先使用双重身份验证（可以选择手机上的一次性密码，或使用令牌等任何外部设备）。\n\
  \n## 识别钓鱼攻击\n避免连接到免费 Wi-Fi 热点。始终记住天下没有免费午餐。当我们使用免费 Wi-Fi 时，很有可能许多服务或网络服务提供商会存储我们的个人登录详情和其他个人信息。有时您的设备上可能会弹出窗口，并可能将您重定向到某些钓鱼页面。根据用户需求授予账户权限；例如，不应为每个人授予计算机或服务器的管理员权限。培训您的办公室员工并引导他们了解基础网络安全步骤。他们必须知道如何识别真实的电子邮件（钓鱼邮件通常有拼写错误、Logo\
  \ 和其他设计质量较差的图片、可能会显示某些紧迫性，例如要求在 24 小时内回复否则您的银行账户将被关闭或您将面临罚款等）、有效的网页等（我们已在第 1 章详细讨论过与电子邮件相关的章节）。偶尔在办公室进行进行模拟演练。一旦发生网络攻击，请立即向相关部门报告（官员的电子邮箱和电话号码在书中提供）。\n\
  \n# 第 6 章 投诉注册\n\n## 引言\n在这里向您介绍由印度政府举办的免费课程，以及政府网站的名称，这些网站会在您成为网络犯罪受害者时提供寻求对象的警报和建议，以及注册网络犯罪投诉的程序。\n\
  \n## 结构\n本章涵盖了以下主题：\n- 印度政府提供的免费课程\n- 投诉注册程序\n- 各州网络安全部门联系方式\n- 应保留哪些证据？\n\n## 目标\n\
  本章提供了提升您关于网络犯罪和安全知识的资源链接，以及投诉注册程序。为了方便起见，还提供了网络援助热线以及各州网络安全部门的邮箱和电话号码。\n\n## 政府为您提供的免费在线课程\n\
  政府提供了一些在线课程，您可以在以下网站找到它们：\n- `https://www.swayam.gov.in`\n- `https://www.infosecawareness.in`\n\
  \n如果您是网络犯罪的受害者，以下内容将帮助您：\n- 网络犯罪电话热线 `155260`（上午 9:00 至下午 6:00）\n\n## 在线投诉注册设施\n\
  可以使用以下步骤注册在线投诉：\n- 访问以下网站：`www.cybercrime.gov.in`\n- 通过访问以下网站订阅 `CERT-IN` 发布的建议：`http://www.cert-in.org.in`\n\
  - 恶意活动可以向 `CERT-IN` 报告：\n  - 邮箱：`incident@cert-in.org.in`\n  - 热线：`+91-1800 114949`\n\
  - 如果手机被盗/丢失，请遵循以下步骤：\n  - 首先，向警方报案（FIR）\n  - 热线 `14422`\n  - 在中央设备身份识别注册网站注册投诉，地址为：`www.ceir.gov.in`\n\
  \n## 各州网络犯罪派出局列表\n官员的电话号码和邮箱：（官员列表）。\n您可以参考以下网站查看更新的网络安全部门邮箱和电话号码：`https://cybercrime.gov.in/`\n\
  \n## 证据——应保留什么\n保留与您的网络犯罪投诉相关的证据始终是一个良好的做法。以下内容可以视为证据：\n- 信用卡收据\n- 银行对单\n- 在线转账收据\n\
  - 电子邮件副本\n- 网站/页面的 URL\n- 聊天记录\n- 册子/传单\n- 嫌疑手机号截图\n- 短信、视频、图像\n- 任何其他类型的文档\n- 信封（如果通过邮件或快递收到信件或物品）\n\
  \n对于社交媒体上的诽损性帖子，在向 Facebook、Twitter 等举报之前，请点击照片、录制视频或截图。\n\n更多实用的链接：\n- `https://www.cyberswachhtakendra.gov.in`\n\
