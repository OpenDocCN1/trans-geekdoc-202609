    FMIs. The settlement of securities necessitates the use of numerous systems, including
    payment systems and settlement systems specifically designed for securities. It
    is possible for financial institutions, payment systems, and FMIs to operate in
    many countries at the same time.


    # Connectivity and the establishment of standards


