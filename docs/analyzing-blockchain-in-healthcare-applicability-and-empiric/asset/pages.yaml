    # Persistency


    The blockchain network is able to swiftly verify all of the transactions, and
    it only permits the transactions that are legitimate to join the network. Once
    a transaction has been accepted into the network, the network does not let the
    transaction be rolled back or deleted. This quality makes it possible to make
    decisions more quickly and accurately, both of which are necessary for dealing
    with the COVID-19 scenarios. The management of the supply chain for COVID-19 vaccines
    may also benefit from the features of blockchain.


    # Immutability


    Once a record has been added to the blockchain network, it is impossible to take
    it out or erase it. This feature guarantees that a record of each and every transaction
    will be kept in the blockchain indefinitely. One of the benefits of using this
    strategy to combat the COVID-19 epidemic is that if a patient is sent to another
    doctor, the new physician will have access to the patient’s complete medical history.
    The 51 percent attack, on the other hand, reveals a possible weakness in this
    argument. During these types of assaults, a single party takes control of more
    than 51 percent'
