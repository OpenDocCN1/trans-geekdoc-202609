- pgno: 82
  md: 'Comparisons must be made between the costs of maintaining and updating a distributed
    ledger and the costs associated with existing practices and alternative options.
    The world of business is looking at DLT agreements to see whether or not they
    may lower costs in different stages of the value chain. In addition to this, the
    costs to society and the market as a whole need to be taken into consideration.
    Expense distribution among members could be different if the agreement is based
    on DLT. A decentralized arrangement in which players contribute to maintaining
    and updating a shared ledger enables participants to share maintenance costs rather
    than having a single organization, such as an FMI, charge fees to participants.
    This is in contrast to a model in which the costs of maintaining the ledger are
    borne by a single organization. Participants in the distributed system keep the
    ledger updated. As a result of this division of labor, certain of the members
    running certain nodes in an arrangement could have to bear greater direct expenses.


    # Carrying out of the reconciliation with speed and cador


    When reconciling, you must ensure that the internal records of all relevant parties
    are similar to one another. Because it requires capturing and storing information
    in numerous distinct forms as well as reconciling information on several separate
    ledgers, this procedure is laborious and time-consuming. The use of DLT may lessen
    the likelihood of data inconsistency, quicken the pace of reconciliation, and
    eliminate or cut down office chores. This is accomplished by all parties participating
    in the transaction providing transaction information in a standard manner. It
    is possible that all of the reconciled data, or only a portion of it, may be shared
    with other market players in order to ease reporting or to promote greater market
    transparency.


    # Effects on several aspects of the financial industry


    There is the potential for market consequences if DLT arrangements continue to
