    +   3. The block which is created for a particular transaction is sent to each
    node which is included in the network.

    +   4. Nodes validate each transaction.

    +   5. After this, nodes collect their rewards for their proof of the transaction.

    +   6. To the current blockchain, the specific block is appended. Please refer
