- pgno: 98
  md: 'Because IoMT data is not sent to untrusted third-party cloud servers, these
    techniques lessen the risk of privacy and security breaches.


    Cloud computing and blockchain technologies are combined in a service called **Blockchain-as-a-Service
    (BaaS)** were supporting the blockchain is the primary feature. Simply put, the
    BaaS provider takes care of all of the infrastructure-related chores for you,
    so you can focus on developing and deploying your blockchain applications. Companies
    in the medical profession, among others whose main goals are security and secrecy,
    may now outsource their blockchain creation and use to an entity that provides
    BaaS and concentrate on other vital tasks. Microsoft Azure, Oracle, and Amazon
    Web Services (AWS) are some of the major cloud providers that provide BaaS systems.


    # Block5GIntell


    As smartphones and IoT devices become more commonplace, advancements in blockchain,
    AI, and 5G have been developed. The quantity of data being stored and produced
    has increased at an alarming pace, from TB to PB, EB, and ZB. When dealing with
    this much data, it’s imperative to find a technique to handle the information
    quickly and efficiently, but also to keep it safe at the same time. An effective
    framework for safe data analysis and intelligence gathering will make use of all
    three of these technologies. Four levels make up Block5GIntell: There are four
    layers: the Device Layer, the Access Layer, the Fog Layer, and the Cloud Layer
    (in that sequence). The term “gadgets” refers to the components that make up each
    layer. Some examples of the first layer are “smart homes,” “e-health systems,”
    “smart infrastructure,” and “smart transportation.”


    This layer is responsible for the generation of both confidential and system-related
    information. After being obtained from a local Blockchain, the confidential information
    that has to be protected and kept safe is then sent to a cloud layer, which will
    be stored and evaluated by an AI learning module. This process takes place in
    a secure manner. Using AI’s supervised and unsupervised machine learning capabilities,
    it is possible to improve the overall quality of the experience and service provided
    to the users while also reducing the likelihood of errors happening in the future.


    Core networks, base stations, and C-RAN condition and status are stored in Block5GIntell’s
    access layer. In addition, this layer allows base stations to securely exchange
    status information with one another through P2P communication. The data is subsequently
    sent to the cloud layer for usage by AI in the fog layer’s learning modules. Data
    collected at this layer aids in network planning, energy efficiency, and greater
    network security for AI modules.


    The fog layer is where the AI’s acting and learning modules are incorporated.
    The learning modules employ data stored in the cloud layer to perform a variety
    of'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'learning algorithms. Finally, the action modules apply these findings back
    to their network of nodes. Successful findings are forwarded to the cloud layer
    and stored in a smart contract.


    Data from the three preceding tiers will be stored in Blockchain at the cloud
    layer. Using AI at the cloud layer, Blockchain offers safe and decentralized data
    organization and clustering in Blockchain to be used at the fog layer more quickly
    and effectively.


    # Conclusion


