- pgno: 109
  md: '# Transparency


    Transparency is something that the blockchain networks provide in a way that no
    other network does. In these types of networks, the ledger is distributed across
    all of the member nodes and may be accessed by any of them at any time.


    Nugent et al. described a blockchain-based smart contracts system for medical
