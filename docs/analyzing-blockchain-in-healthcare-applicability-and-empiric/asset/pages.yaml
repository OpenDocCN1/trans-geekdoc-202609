- pgno: 22
  md: '# CHAPTER 1


    # Internet of Medical Things-Blockchain Integration


    # Abstract


    The Internet of Medical Things (IoMT) is a network of implanted or worn medical
    devices that gather patient health data. Large files containing sensitive information
    need tight security. Researchers are exploring blockchain-based solutions to boost
    the safety of healthcare apps. However, owing to the distinct needs of these two
    systems, such integration is very complex and demanding. In this chapter, we give
    a technical assessment of several current solutions that make use of Blockchain
    (BC) technology. These studies are analyzed, and a discussion is held on the suggested
    designs about how the authors solved the integration problems. In addition to
    this, the unanswered questions about the implementation of blockchain technology
    via IoMT are detailed in this chapter.


    # Introduction


    Researchers are digitizing and decentralizing healthcare institutions to meet
