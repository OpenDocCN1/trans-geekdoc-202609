- pgno: 108
  md: '# Tracking drugs


    In the medical field, patient medicine mix-ups are common, as is the existence
    of fake medications.


    A secure end-to-end solution is provided to the end-users by blockchain, which
    may address the aforementioned difficulties.


    # Opportunities brought by blockchain to the COVID-19 pandemic


    Blockchain is a promising new technology that has a wide range of potential uses.
    We’ve looked at how blockchain’s unique traits may help us combat the COVID-19
    epidemic.


    # Decentralization


    It is possible for any member of the blockchain network to see the whole network
    and participate in transaction verification and validation because of blockchain’s
    decentralized peer-to-peer architecture (P2P). In the case of the COVID-19 pandemic,
    the benefit of such an architecture is that it allows independent parties to work
    without handing over total power to a single authority. In addition, its decentralized
    design does not have the same vulnerability to a single point of failure as centralized
    systems.


    Nodes in a decentralized system are not impacted if one of them goes down. A functional
    healthcare system is essential in these situations. If the system is unable to
    accomplish this, it might be fatal. The patient retains control of their data
    since there is no central authority to oversee it. As a result of this distributed
    design, data is saved using hash values rather than real patient names.


    # Increased capacity


    As opposed to being held on a small number of centralized servers, all of the
    data in P2P networks is instead distributed throughout a huge network of geographically
    dispersed computers. This is the primary benefit of P2P networks. These are the
    kinds of networks whose capacities are always expanding; once a new node is added
    to the network, it immediately begins adding to the overall capacity of the network
    as well. This additional capacity may be essential in the fight against this pandemic
    in order to store the large quantity of patient data that is always expanding.
    Because of the increased processing capacity, the time it takes to validate transactions
    may be cut down, allowing for a greater number of transactions to be processed
    per second. By assisting with run-time simulations, the computing capacity may
    also contribute to the development of a vaccine to combat this pandemic.'
  merge: -1
