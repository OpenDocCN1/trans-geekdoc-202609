    # Blockchain


    Notably, the European Parliamentary Research Service has named blockchain as one
    of the 10 major technologies that may be used to combat COVID-19. The majority
    of the restrictions that are associated with centralized computing ecosystems
    may be eliminated thanks to Blockchain Technology, which offers a decentralized
    computing service architecture. The blockchain is comprised of a group of computational
    nodes'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'that are linked in a Peer-To-Peer (P2P) fashion and mutually verify any transactions
    that are carried out inside the network.


    A hash-based (cryptographic) chain of blocks is formed by the blockchain, with
    each block cryptographically securing a set of previously recorded transactions
    and being connected to the block that came before it. Blockchain is a viable answer
    to the healthcare industry’s growing number of data breaches and other security
    concerns, such as supply and supplier verification, online payments, and so on.
    Blockchain is a new technology that helps to keep track of transactions that cannot
    be tampered with, in a decentralized manner.


    Patients’ personal and sensitive information may be shared in a safe and trustworthy
    manner thanks to this method. Decentralization, immutability, and transparency
    are three of the most important aspects of the blockchain. Information about transactions
    that have been started by one party and validated by other members of the network
    may be stored in a chain of blocks that are linked together logically.


    The blockchain is then updated to reflect these transactions. As the chain grows,
    so does the security of the data it holds. The attacker has to know the cryptographic
    hash value of the block in question, as well as the hash value of the next block,
    in order to modify the contents of a block. As a result, in order to commit a
    cyberattack, the attacker would have to alter every subsequent block in the chain,
    which would take a significant amount of effort and time and be almost impossible.


    All network users have access to the data contained in the blocks and their current
    condition, but the identities of individual users are protected by pseudonymity.
    To prevent unauthorized users from accessing data that is not intended for them,
    blockchain also offers access control. For example, physicians should only be
    able to access a patient’s past medical information while using the blockchain,
    which has an extra feature that is data permanence. All transactions are logged
    and may be retrieved at any time by a person with the proper permissions.


    # Taxonomy of blockchain


    Blockchain networks are categorized into four categories: public, private, consortium,
    and hybrid.


    # Public blockchain


    This type of blockchain provides a totally open network in which all participants
    may participate in the consensus process.


    # Private blockchain


    Every member of this blockchain network is required to have the authorization
    to join, and such members are referred to as “known participants.”'
