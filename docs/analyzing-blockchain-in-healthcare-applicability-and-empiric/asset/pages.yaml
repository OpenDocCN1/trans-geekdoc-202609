    # IoT market drivers


    Internet of Things is a fast-growing market driving down the hardware cost, its
    device deployment provides the data and insights needed, to automate the processes,
    streamline workflows visualize usage patterns, and bring out effectiveness in
    changing the business landscape.


    The following are the few enablers behind its growth:


    # Decreasing the cost of sensors and actuators


    Sensors are an essential component of an interconnected device, allowing it to
    communicate with the outside world and monitor its surroundings. They function
    as a digital nervous system that collects position data via GPS sensors, visual
    and audio data via camera and microphone, temperature and pressure data via sensors.
    Sensor costs have dropped by half in the previous decade and are continuing to
    fall at a consistent rate, making them easier to combine with physical equipment.


    # Increased investment in IoT


    Companies such as Google, Samsung, and Dell have made significant investments
    in IoT divisions and continue to engage in R&D. There have also been acquisitions,
    such as Google’s purchase of Nest, Intel’s purchase of Basis, Microsoft’s purchase
    of Solair, and Qualcomm’s purchase of NXP. Companies with core expertise in data
    analytics, cyber security, cloud computing, semiconductor chip production, connectivity
    platform capabilities, and services are the most coveted acquisition targets.


    # Increasing internet connectivity


    According to studies, 40 percent of the world’s population is presently linked
    to the internet, with 57 percent expected to be connected by 2019. As the Internet
    of Things becomes more accessible, there will be greater demand and interest in
    acquiring IoT devices.'
