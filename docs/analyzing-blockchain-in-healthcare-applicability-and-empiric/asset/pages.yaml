    # Benefits of blockchain in healthcare


    In the previous sections, we have also discussed the blockchain, health care,
    its types, capabilities and so on. Now, in this section we will discuss the benefits
    of blockchain in healthcare.


    +   **Decentralization:** Depending on the type of medical care, a decentralized
    management structure is necessary for healthcare because of the spread of stakeholders.
    Blockchain has the potential to become the decentralized health data management
    foundation that would allow all stakeholders without anybody acting as the global
    health data''s governing body.


    +   **Improved data security and privacy:** Once the data is saved to the blockchain
    cannot be degraded, edited, or recovered, this property of blockchain significantly
    enhances the security of the health data kept on it. Each and every piece of health
    information on the blockchain is time-stamped, encrypted, and added in chronological
    sequence.


    +   **Health Data ownership:** Patients must be the owners of their data and in
    charge of how it is utilized. Patients should have the ability to notice instances
    of data misuse and require the confidence that their health information won’t
    be used improperly by third parties. Blockchain’s robust cryptographic protocols
    and clearly specified smart contracts help it to meet these needs.


    +   **Availability and robustness:** The availability of the health data saved
    on blockchain is ensured since records are duplicated across numerous nodes, making
    the system resistant to data loss, data corruption, and some security attacks
    on data availability.


    +   **Transparency and trust:** Blockchain end up in distributed healthcare applications
    because of its openness and transparency. This makes it easier for healthcare
    stakeholders to accept such applications.


    +   **Data verifiability:** The authenticity and integrity of the records kept
    on blockchain can be confirmed even without access to their plaintext. This capability
    is especially helpful in healthcare settings where record verification is necessary,
    such as in the processing of insurance claims and pharmaceutical supply chains.


