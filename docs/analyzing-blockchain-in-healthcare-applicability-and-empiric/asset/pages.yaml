- pgno: 9
  md: '# # Preface


    The Book - Analyzing Blockchain in Healthcare is written by Aryan Chaudhary (Research
    Head in Nijji HealthCare) and Raman Chadha (Professor and HoD in Chandigarh, University).
    The Book provides, extensive prospects of technology that intensify scientific
    advancement to recent information on the application & adoption of Blockchain
    Technology. Each chapter furnishes the deployment of BlockChain Technology in
    regulated settings & discusses how other evolving technologies like Artificial
    intelligence, machine learning, neural network, and deep learning along with BCT
    can set up a benchmark to improve healthcare services. This Book will be the first
    to include a description of real-world implementation to support evidence-based
    practice to educate researchers, hcp, ITPs, and health science organizations to
    make value propositions & recognize the economic value of blockchain


    The book is an overview of **10 chapters**, which provide a comprehensive structure
    to induce a high-class knowledge of applying blockchain in healthcare and come
    up with a mechanism to expedite patient-amiable automation to improve Healthcare


    **Chapter 1** examines how the Internet of Medical Things (IoMT) technical assessment
    of several current solutions that make use of blockchain technology. In addition
    to this, the unanswered questions about the implementation of blockchain technology
    via IoMT are detailed.


    **Chapter 2** unveils the benefits and barriers of Blockchain (BC) technology
    in the health sector.


    **Chapter 3** covers the impact of Blockchain (BC) technology on patient engagement
    in the healthcare industry. The Technology, Environment, and Organization model
    were examined in this chapter.


    **Chapter 4** works on Distributed Ledger Technology, the study which is being
    included in the chapter provide a methodology that may be used by central banks
    and other authorities to examine and evaluate the usability of this technology
    for payment, clearing, and settlement purposes. The findings of this study may
    be helpful to players in the market as well as other parties. The primary goal
    of the framework is to assist in understanding the applications of distributed
    ledger technology (DLT).'
  merge: -1
  img_proc: true
- pgno: 10
  md: '**Chapter 5** investigates the ways in which the Internet of Medical Devices
    (IoMD) and blockchain technology are contributing to the development of and having
    an effect on the healthcare business.


    **Chapter 6** provides an overview of how blockchain application helps in mitigating
    and fighting the challenges of the Covid-19 Pandemic.


    **Chapter 7** study seeks to understand how health facilities adopt blockchain
    networks to satisfy their patients without any quagmire.


    **Chapter 8** induce a study''s specific goals to identify the use cases for Blockchain
    technology in healthcare, sample applications that have been created for those
    use cases, challenges and restrictions facing Blockchain-based healthcare applications,
    current development methods used for those applications, and potential future
    research areas.


    **Chapter 9** seeks to give a thorough evaluation of the existing and anticipated
    usage of blockchain technology in health care, as well as future research possibilities,
    and


    **Chapter 10** concludes with security end-user analysis using Blockchain Technology


    > — Aryan Chaudhary

    > Research Head,

    > Niji Health Care Pvt Ltd


    > — Raman Chadha

    > Professor, Computer Science & Engineering

    > Research Head, Chandigarh University'
  merge: -1
