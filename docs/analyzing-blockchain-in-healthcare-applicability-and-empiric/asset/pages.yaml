- pgno: 5
  md: '# About the Authors


    ![](img/22d5c8aa48bdb074c6f04bac5d488ae6_5_0.png)


    Aryan Chaudhary is the Research Head and lead member (the research project launched
    by Nijji Healthcare Pvt Ltd). He focuses on implementing technologies such as
    artificial intelligence, deep learning, IoT (Internet of Things), cognitive technology,
    and blockchain to better the healthcare sector. He has published academic papers
    in public health and digital health in international journals and has participated
    as a keynote speaker at many international and national conferences. His research
    includes the integration of IoT and sensor technology for gathering vital signs
    through one-time/ ambulatory monitoring and then the functionality of artificial
    intelligence, machine learning leading to big data analytics for faster intervention,
    tracking of prognosis, and research on these vast data for effective clinical
    research for future development of treatment, drug, pathological tests, and supply
    systems. He is the editor of many books in biomedical science and the Chief Editor
    of a CRC book series. He also serves as the guest editor of many special issues
    in reputed journals. He has been awarded as Most Inspiring Young Leader in Healthtech
    Space 2022 by Business Connect and the Best Project Leader of Global Education
    and Corporate Leadership. He is a senior member of many international associations
    in science & brand ambassador of Betham Science'
  merge: -1
  img_proc: true
