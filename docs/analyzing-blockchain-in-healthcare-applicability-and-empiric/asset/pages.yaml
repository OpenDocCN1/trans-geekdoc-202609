    # Technology based upon distributed ledger


    The term “Distributed Ledger Technology” is used in various ways, reflecting the
    ever-changing nature of technology, business, and new applications. In this chapter,
    “Distributed Ledger Technology” (or DLT) refers to the processes and related technologies
    that allow nodes inside a network (or arrangement) to reliably propose, validate,
    and record state changes (or updates) to a synchronized, distributed ledger. DLT
    enables payment, clearing, and settlement transactions without a central authority
    maintaining a single “golden copy” of the ledger. This is made possible through
    the utilization of established procedures and protocols made available by DLT.


    The word “arrangement” is used throughout the paper to refer to any application
    or implementation built on distributed ledger technology. It is possible to characterize
    an arrangement by referring to its technological design and the institutional
    structure it possesses. The industry has only a limited amount of standardization
    when it comes to nomenclature; some of the developing arrangements include systems,
    platforms, and layers. A self-contained system can function without outside help.
    A platform is another type of organization in which programs are built on a common
    base to share functionality. Other technology implementations may act as a layer,
    facilitating interconnectivity across setups.


    # Historical content


    Satoshi Nakamoto published a paper in 2008 outlines Bitcoin’s mechanics and a
    peer-to-peer solution for internet transfers without known and trusted third parties.
    This method permitted user-to-user internet transfers. The solution integrates
    several tried-and-true technologies into a single system to validate transactions
    and add them to a “block.” Following a predetermined set of procedures and rules,
    this block, also known as a batch of transactions, is appended to a chain that
    contains a history of transactions and is referred to as a blockchain. The newly
    created block is then communicated to the network so that all of the nodes can
    converge on the same version of the blockchain and update their own ledgers. This
    process of agreement across nodes is known as consensus, and it entails cryptographically
    tying the new block to the block that came before it in the blockchain.'
