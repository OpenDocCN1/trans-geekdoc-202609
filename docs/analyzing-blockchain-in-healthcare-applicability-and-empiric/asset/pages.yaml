    # Cloud computing


    Cloud computing provides users with a network-based view of their environment,
    allowing them to share computations and resources no matter where they are. Cloud
    computing, according to the **National Institute of Standards and Technology**
    (NIST), is “a template for providing the appropriate and when needed access to
    the internet, to a collective pool of programmable grids, storage, servers, software,
    and amenities that can be rapidly liberated, with little communication and supervision
    from the provider.” Processor features include self-service on-demand, high-performance
    network connectivity, rapid elasticity, resource pooling, and metric service quality.
    Hybrid, community, private, and public cloud deployment models add three service
    models: **Platform as a Service (PAAS)** for the platform, **Infrastructure as
    a Service (IAAS)** for infrastructure, and **Software as a Service (SAAS)** for
    shared services. These shared properties, such as virtualization, homogeneity,
    geographic dispersion, and service orientation are all outlined in NIST’s definition
    of cloud computing.'
