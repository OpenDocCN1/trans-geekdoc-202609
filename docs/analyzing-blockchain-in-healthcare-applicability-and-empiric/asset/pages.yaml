  md: '+   - **Distribution**: Participants in the case of blockchain are physically
    separated from one another but are linked through a network. Each user running
    a node has a copy of the ledger that is updated as new transactions take place.


    +   - **Encryption**: Blockchain captures the information in the blocks securely
    and semi-anonymously utilizing technologies like public and private keys. Participants
    can maintain their identities and other personal information private and only
    divulge the information required for the transaction.


    +   - **Immutability**: Firstly, the transactions which are completed are cryptographically
    signed. Then they are time stamped after the cryptographical signature, and at
    last they are combined in the ledger. Without the participants’ consent, records
    cannot be altered or distorted in any other way.


    +   - **Tokenization**: These secure exchange of value occurs during different
    transactions and other needful interactions occurring in the blockchain. Tokens
    are used to represent value, which can be anything from intangible to tangible
    assets. Tokens also give users the ability to manage their personal data, which
    is a key component of the blockchain.


    +   - **Decentralization**: Due to a consensus mechanism, nodes in the decentralized
    system are responsible for maintaining both network data and the rules that govern
    how the network functions. Decentralization refers to the fact that no single
    organization is in control of all the computers, information, or rules.


    # # Functioning of blockchain


    The major part of any blockchain system is its working and functioning with the
    proper steps. The functioning of blockchain is shown in Figure 8.2 given as follows
    and the steps are also discussed here:


