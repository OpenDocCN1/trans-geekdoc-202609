    \ are very young. When something happens to us, we interpret the experience and\
    \ give personal meaning to the situation. Then we confuse what really happened\
    \ with our interpretation of what did. The story we make up based on that mixture\
    \ of fact and fiction becomes our truth and an operating principle in our lives.\n\
