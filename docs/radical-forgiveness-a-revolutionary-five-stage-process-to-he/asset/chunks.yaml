    \ how to care for them. The medical paradigm we have held for the last three hundred\
    \ years—ever since the French philosopher René Descartes defined the body as a\
    \ machine—is changing radically as it moves toward a holistic, mind-body approach.\n\
    \nWe used to think of health as the absence of disease. Now we think of it in\
    \ terms of how well our life force (prana, chi, etc.) flows through our bodies.\
    \ For optimum health, this life force must be able to flow freely. We cannot be\
    \ healthy if our bodies are clogged with the energy of resentment, anger, sadness,\
    \ guilt, and grief.\n\nWhen we speak here of the body, we include not only the\
    \ physical body, which is also an energy body, but the subtle bodies that surround\
    \ us as well. These we refer to individually as the etheric body, the emotional\
    \ body, the mental body, and the causal body. Each has a different frequency.\
    \ Whereas we used to define the physical body in terms of chemicals and molecules,\
    \ physicists have taught us to see all five bodies, including the physical one,\
    \ as dense condensations of interacting energy patterns."
