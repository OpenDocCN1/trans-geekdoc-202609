    # 致谢


    我的感激和爱首先来自我的妻子 JoAnn，感谢她信任并写这本书。我特别感谢我的姐姐 Lorraine 和姐夫 John 的耐心与合作。（后文省略）

    (Images/back.jpg)


    # 序言


    无论我们看向哪里，报纸上、电视里，甚至是我们的个人生活中——我们都能看到极端行为的例子。例如，我们读到今天美国至少有五分之一的成年人在儿童时期遭受过肢体或性虐待。电视新闻证实，强奸和谋杀在我们社区中已屡见不鲜，破坏财产的犯罪更是猖獗。在全球范围内，我们目睹了大规模的酷刑、镇压、监禁和公开战争。


    20 世纪初，我开始举办宽恕工作坊、癌症疗营和企业研讨会。从那时起，我听了足够普通人的恐怖故事，这让我相信，地球上没有任何人没有经历过一次严重的创伤，而在小事上更是不胜数。我们中谁能说自己从未归咎过他人来解释自己的缺失？


    要打破如此强大的原型，我们必须用一种完全不同的东西来取代它——一种如此迷人且在精神上释放的东西，足以吸引我们远离。我们需要一种能够让我们超越生活戏剧性的东西，以便看到大局以及那些目前被我们遮蔽的真相。


    当我们继续进入新千年，并为即将到来的下一次精神进化飞跃做好准备时，采用一种不再基于恐惧、控制和权力滥用，而是基于真正的宽恕、无条件的爱和和平的生活方式是至关重要的。这就是我所说的“激进”，这也是我这本书的主旨：帮助我们完成这一转变。


    '
- fmt: '

    If we are to transform anything, we must be able to experience it completely and
    fully, which means that to transform the victim archetype, we must first experience
    victimhood fully. There is no shortcut! Therefore, we need situations in our lives
    that allow us to feel victimized so we can transform the energy through `Radical
    Forgiveness`.


    To transform an energy pattern so fundamental as the victim archetype, many, many
    people—souls who possess the wisdom and love necessary to accomplish this immense
    task—must awaken and accept this as their spiritual mission. Perhaps you are one
    of the souls who volunteered for this mission. Could that be why this book speaks
    to you?


    Jesus gave a powerful demonstration of what transforming the victim archetype
    means, and I believe he now waits patiently and lovingly for us to follow his
    lead. Up to now, at least, we have failed to learn from his example precisely
    because the victim archetype has had such a strong hold on our psyches.


    We have ignored the lesson of genuine forgiveness that Jesus taught—that there
    are no victims. We straddle the fence and attempt to forgive while staying firmly
    committed to being victims. We have made Jesus himself the ultimate victim, and
    this will not move us forward in our spiritual evolution. True forgiveness must
    include completely letting go of victim consciousness.


    Indeed, my main intention in writing this book was to make clear the distinction
    between forgiveness that maintains the victim archetype and `Radical Forgiveness`
    that frees us from it. `Radical Forgiveness` challenges us to fundamentally shift
    our perception of the world and our interpretation of what happens to us so we
    can stop being victims. My one goal is to help you make that shift.


    I recognize that the ideas I am presenting here may be extremely challenging for
    someone who has been severely victimized and is still carrying a lot of pain.
    I ask only that you read this book with an open mind and see whether or not you
    feel better after reading it.


    As I write this edition of the book, I can tell you that the feedback I have received
    from my readers and those who come to my workshops has been overwhelmingly positive.
    Even people who have been in emotional pain for a long time have found the book
    to be extremely freeing and healing—and the workshops transformational.


    What has also been amazing and gratifying is the extent to which `Chapter 1`,
    “Jill’s Story,” has created immediate healing for many, many people. I originally
    thought I was writing it as a useful lead-in to the concepts and ideas behind
    this book, but I now recognize that Spirit knew better and was guiding my hand
    all the way. I get many phone calls from people—often still in tears—who, having
    just read the story, tell me that they see themselves in it and feel that their
    healing has already begun.


    A great many of those who call have been moved to share their experience with
    others by emailing “Jill’s Story” directly from my website (see `Further Resources`
    at the end of the book) to all their friends, relations, and business associates—a
    wonderful chain reaction! I shall be forever grateful to my sister and brother-in-law
    for allowing me to tell their story and making that gift to the world.


    I find myself very humbled by the overall response I am getting to the book, and
    it is fast becoming clear to me that I am being used by Spirit to get this message
    out so that we can all heal, raise our vibration, and go home. I am grateful to
    be of service.


    *Namasté* Colin Tipping


    ## Part One


    # A Radical Healing


    ## 1


    ### Jill’s Story


    **Author’s Note:** To give you, the reader, an understanding of what I call `Radical
    Forgiveness`, I have presented the following true account of how this process
    saved my sister’s marriage and changed her life. Since that time, `Radical Forgiveness`
    has positively impacted the lives of countless others, for not long after this
    episode with my sister, I realized that the process could be used as a form of
    help quite different from traditional psychotherapy and relationship counseling.—*C.T.*


    As soon as I saw my sister, Jill, emerge into the lobby of Atlanta’s Hartsfield
    International Airport, I knew something was wrong. She had never hidden her feelings
    well, and it was apparent to me that she was in emotional pain.


    Jill had flown from England to the United States with my brother, John, whom I
    had not seen for sixteen years. He had emigrated from England to Australia in
    1972 and I to America in 1984—thus Jill was, and still is, the only one of the
    three siblings living in England. John had made a trip home, and this trip to
    Atlanta represented the last leg of his return journey. Jill accompanied him to
    Atlanta so she could visit me and my wife, JoAnn, for a couple of weeks and see
    him off to Australia from there.


    After the initial hugging and kissing and a certain amount of awkwardness, we
    set out for the hotel. I had arranged rooms for one night so JoAnn and I could
    show them Atlanta the next day before driving north to our home.


    As soon as the first opportunity for serious discussion presented itself, Jill
    said, “Colin, things are not good at home. Jeff and I might be splitting up.”


    Despite the fact that I had noticed something wrong with my sister, this announcement
    surprised me. I had always thought she and Jeff were happy in their six-year marriage.
    Both had been married before, but this relationship had seemed strong. Jeff had
    three kids with his previous wife, while Jill had four. Her youngest son, Paul,
    was the only one still living at home.


    “What’s going on?” I asked.


    “Well, it’s all quite bizarre, and I don’t quite know where to begin,” she replied.
    “Jeff is acting really strange, and I can’t stand much more of it. We’ve gotten
    to the point where we can’t talk to each other anymore. It’s killing me. He has
    totally turned away from me and says that it’s all my fault.”


    “Tell me about it,” I said, glancing at John, who responded by rolling his eyes.
    He’d stayed at their house for a week prior to flying to Atlanta, and I guessed
    by his demeanor that he’d heard enough of this subject to last him a while.


    “Do you remember Jeff’s eldest daughter, Lorraine?” Jill asked. I nodded. “Well,
    her husband got killed in a car crash about a year ago. Ever since then, she and
    Jeff have developed this really weird relationship. Any time she calls, he fawns
    over her, calling her ‘Love’ and spending hours talking to her in hushed tones.
    You’d think they were lovers, not father and daughter. If he’s in the middle of
    something and she calls, he drops everything to talk with her. If she comes to
    our home, he acts just the same—if not worse. They huddle together in this deep
    and hushed conversation that excludes everyone else, especially me. I can hardly
    stand it. I feel like she has become the center of his life, and I hardly figure
    in it at all. I feel totally shut out and ignored.”


    She went on and on, offering more details of the strange family dynamic that had
    developed. JoAnn and I listened attentively. We wondered aloud about the cause
    of Jeff’s behavior and were generally sympathetic. We made suggestions as to how
    she might talk to him about his behavior and generally struggled to find a way
    to fix things, as would any concerned brother and sister-in-law. John was supportive
    and offered his perspective on the situation as well.

