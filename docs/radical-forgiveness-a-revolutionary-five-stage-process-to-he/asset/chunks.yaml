    为了更全面地看待整个讨论，我们必须记住，由于物理世界实际上是幻象，那么我们所经历的地球变迁也将是幻象的。这解释了为什么人类意识的改变可以立即改变局面。我们体验地球变迁的方式取决于我们对正在发生之事的感知。如果我们将其视为意识的净化和一场将导致精神转化的疗愈危机，我们对它们的体验将形成鲜明对比；而如果我们采取害者的立场，将它们视为真实的、令人恐惧的，以及对我们极其愚蠢的惩罚，那么我们的感受将截然不同。**激进宽恕**Radical
    Forgiveness）的视角使我们能够专注于当下所发生之事的完美性，并引领我们走向体验彼岸的喜悦与和平。


    ### 礼物


    “如其在上，如其在下”这句谚语在应对我们体内的癌症和地球癌症方面也具有深远意义。用有毒药物和其他暴力治疗手段与癌症进行“战争”，永远无法带来癌症治愈。对地球问题采取暴力的、高科技的、政治驱动的解决方案同样行不通。在这两种情况下，唯一有效的方法都是爱。当我们真正理解这一点时，我们就理解了地球变迁和癌症的礼物。


    没有任何课程比这一个更关重要了。癌症患者是勇敢的灵魂，他们来到物理平面带着一项使命：证明向身体和自身投射愤怒与战争是徒劳的。他们的使命是帮助我们理解任何情况的唯一答案都是爱。而我们作为的回是倾听他们爱的信息。


    ### 喜悦、和谐与和平的愿景


    无论我们是否提高了足够的频率以防止创伤，并自愿地与所有生命产生爱的共鸣，最终结果将是相同的。关于地球变迁的所有预测都提到了在地球自我净化和平衡我们创造的业力之后，意识发生了一场突破。


    地球变迁后的生活是一个美妙、和谐、和平且田园的愿景，这与现状形成了鲜明对比，是许多预测中的一个共同主题。正如所有的疗愈机会一样，我们可以在压抑的痛苦出现的第一个迹象时就治愈灵魂的痛苦，也可以等到灾难将我们唤醒。无论地球变迁如何发生，无论行星业力以何种程度上演，这些变化都将构成地球以及我们所有人而言的终极疗愈危机。这无疑将是神圣的安排。


    提高足够的频率以改变预测，必须包括基于爱来生活，对自己和他人温和地接纳，并为我们滥用地球而原谅自己。它必须包括参与和平祈祷，并让世界范围内尽可能多的人参与，同时拥抱激进宽恕，将其视为一种永久的生活方式。


    ## 第三部分


    # 扩展的假设


    ## 15


    ### 信仰条文


    第二章列出的假设是简要介绍的，只是为了让你对它们有足够的了解，以理解激进宽恕的理论。现在，我想更深入地讨论激进宽恕背后的、尚未被全面讨论的假设。我希望这能帮助你对这些假设感到某种程度的舒适，即使你无法完全接受它们。


    记住，所有理论都基于假设，但并非所有假设都能通过有效性证据得到证明。这对于涉及现实本质和精神问题的理论和假设尤其如此。


    有趣的是，科学与神秘主义在现实本质和其他直到目前似乎科学无法触及的灵性问题上达到了新的共识。几个世纪，印度教神秘主义者声称拥有这些宇宙真理的“直接知晓”，他们声称这是在喜马拉雅山洞中冥想四十年的结果。通过使用严谨的科学方法和理论构建，科学家最近也得相同的真理——或者我们应该说，他们做了类似的假设。现在可以说，量子物理学实际上证明了神秘主义者几个世纪以来所知的真理。看到这两种截然不同的接近和获得真理的方式汇合是多么令人兴奋。科学与精神终于走到了一起，科学家成为了现代神秘主义者！


    尽管我们取得了进步，但我们必须保持谦卑，继续记住，这些假设从其本质上并不代表全部真理。宇宙如何运作的奥秘以及人类生命的更高目标仍然超出了凡俗的理解范围，而我们所做的假设仅仅是对可能为真理的近似。因此，在此基础之上，以下假设被作为激进宽恕的基础。


    **假设：** 与大多数西方宗教思想相反，我们并非偶尔拥有精神体验的人类。相反，我们是拥有人类体验的灵性生物。


    这不仅仅是一个文字游戏。它代表了我们对自己是谁以及我们与上帝关系思维的根本性转变。与其认为自己是堕落并远离上帝的，它表明我们仍然与“万有存在”（All That
    Is）紧密相连，而在物理体中的生活只是为了学习和平衡能量而采取的临时插曲。它还表明上帝住在我们每个人心中，而不是在“上面”，强调了我们人/灵的双重属性。普利策奖奖得主埃恩斯特·贝克尔（Ernst
    Becker）曾生动地解释道：“人是一个会拉屎的神。”[2]


    **假设：** 我们拥有会死亡的身体，但我们是不朽的。


    几个世纪以来，哲学家一直在争论“灵魂”的构成。这种讨论甚至早于柏拉图和苏格拉底，这两者都对灵魂有许多见解，但在该主题上仍然意见不相让。今天，争论仍在继续，对于什么构成了灵魂很少达成共识。


    然而，为了这次讨论的，灵魂被定义为我们身上纯粹意识的部分，它与构成“万有存在”的更宏大的意识海洋相连。为了我们转世的需要，灵魂承担了某种个体化的特征，这种特征可以类比为同一片海洋中的一滴水，或者一点“神性的物质”。由于我们是万有存在海洋的一部分，我们一直作为灵魂存在。灵魂没有起点也没有终点，存在于时间和空间之外，并且是不朽的。在我们转世期间，灵魂保持我们与神圣真理世界和万有存在相连，并对我们的精神演化负责。

