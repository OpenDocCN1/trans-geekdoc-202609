    “没关系的，”我安慰道，“听着，没非要弄清楚这一切。只要愿意接受‘可能有其他事情正在发生’这个想法，就是巨大的一步。事实上，愿意从不同的角度看待情况，是你愈合的关键。百分之九十的愈合发生在你愿意接受这样一个想法时：你的灵魂是充满爱地为你创造了这种情况。当你变得愿意时，你放手了控制权，并将其交给上帝。他会处理剩下的百分之十。如果你真的从深层上理解并顺服于这种想法——只要你把事情交给他，他就会为你处理好——那么你什么都不需要做。这种情况和你的愈合都会自动得到解决。”


    “但在这一步之前，你可以迈出完全理智的一步，让你能够立即以不同的方式看待问题。这涉及到将事实与虚构分离开来。这意味着要承认你的信念没有任何事实依据。它仅仅是你根据少数几个事实和大量的解读所编造出来的一个故事。”


    “我们经常这样这样做：经历一个事件并对其进行解读。然后我们将这两部分结合在一起，创造出一个关于发生了什么的、很大程度上虚假的故事。这个故事变成了信念，而我们像捍卫真理一样捍卫它。当然，它绝不是真理。”


    “在你的情况下，事实是爸爸没有抱你，没有花时间陪你玩，没有搂着你，没有让你坐在他的腿上。他没有满足你对情感的需求。这些都是事实。基于这些事实，你做了一个关键的假设：‘爸爸不爱我。’这不是真的吗？”


    她点了点头。


    “但他没有满足你需要的这一事实，并不意味着他不爱你。那是一种解读。那不是事实。他是一个性欲望压抑的男人，亲密关系对他来说是可怕的；我们知道这一点。也许他只是不知道如何用你希望接收的方式表达他的爱。你还记得某年圣诞节他为你做的那个超级大娃娃屋吗？我记得当你睡觉的晚上，他在晚上在上面花费了无数个小时。也许那是他所知道的表达对你之爱的唯一方式了。”


    “我不是在为他辩护，也不是试图证明你所说的或所感受的是错。我只是想指出，我们都会犯一个同样的错误，认为我们的解读代表了真理。”


    “你做的下一个大假设，”我继续说道，“基于事实以及你对‘爸爸不爱我’的第一个解读，是‘这是我的错。我一定有些问题。’这比上一个假设是一个更大的谎言，你不觉得吗？”


    她点了点头。


    “你得出那个结论并不意外，因为小孩子正是是这样思考的。由于他们感知到世界是绕着他们转的，所以他们总是认为当进展不顺利时，是他们的错。当孩子第一次这样想时，这个念头伴随着巨大的痛苦。为了减轻痛苦，孩子会压抑它，但这种行为实际上让摆脱这个念头变得更加困难。因此，即使成年后，我们仍然被困在‘这是我的错，我一定有些问题’这个想法中。”


    “每当世界绕着他们转时，他们总是认为当事情进展不顺利时，是他们的错。当孩子第一次这样想时，这个念头伴随着巨大的痛苦。为了减轻痛苦，孩子会压抑它，但这种行为实际上让摆脱这个念头变得更加困难。因此，即使成年后，我们仍然被困在‘这是我的错，我一定有些问题’这个想法中。”


    “每当世界绕着他们转时，他们总是认为当事情进展不顺利时，是他们的错。当孩子第一次这样想时，这个念头伴随着巨大的痛苦。为了减轻痛苦，孩子会压抑它，但这种行为实际上让摆脱这个念头变得更加困难。因此，即使成年后，我们仍然被困在‘这是我的错，我一定有些问题’这个想法中。”


