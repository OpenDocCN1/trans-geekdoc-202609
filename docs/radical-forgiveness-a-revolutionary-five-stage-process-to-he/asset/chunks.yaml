    with anger; he was all red and puffed up. I said that I was conducting a seminar
    and that I would come and find him when I was finished.


    He went out very upset but came back almost immediately, clearly enraged. He pointed
    his finger at me, hooked it as if to motion me toward him, and screamed, “I want
    to see you, right now!”


    It was the gesture with the finger that got me. All the frustration and tension
    of the past hour came rushing to the surface. I turned to my class and said in
    a very menacing tone, “Just watch this!” I strode over to the red-faced, puffed-up
    monk and told him in no uncertain terms, pointing back at him with my finger very
    close to his face, “I don’t care what you are wearing and what those clothes represent—you
    don’t come into my workshop and hook me out as if I were some little schoolboy
    who has offended you. I’ll come out and talk to you when—and only when—I am ready.
    In fact, I will be done right at twelve noon. If you have anything to say to me,
    you’d better be outside in the lobby right at that time. Then we can talk. Now,
    get out of my room!”


    I strode back to my class; to a person, they were sitting there aghast with their
    mouths gaping. (You don’t talk to religious figures like that!) “Right,” I said,
    pointing to each one of them in turn, “I want to know what you are feeling right
    now, in this moment, and don’t give me that B.S. that you have given it to the
    violet flame and you are feeling peaceful, because it is obvious that you are
    not. What are you feeling? Get real!”


    Well, as you might expect, they were in their feelings big time, and we started
    to discuss them. With the help of the monk, I had broken through their wall of
    resistance to acknowledging that humans have feelings and that feelings are okay.
    I had busted their story. They had been doing the spiritual bypass, and I let
    them know it.


    At noon I went out of the room into the lobby. The monk was there. I went straight
    up to him and, much to his surprise and consternation, hugged him. “Thank you
    so much,” I said. “You were a healing angel for me today. You were my seminar.
    You saved the whole thing.”


    He really didn’t know what to say. I don’t think he got it either, even when I
    tried to explain it to him. He had calmed down, though, and it turned out that
    all he was upset about was that I had not rung the bell to let him know we were
    there. He had been sitting in his room waiting for the bell to ring, not thinking
    that we might push open the door and go on in. Can you imagine getting so enraged
    about such a small thing? Do you think he might have had an abandonment or “not
    good enough” issue running?


    That seven-day retreat became one of the best workshops I have ever done, and
    that’s because the participants got real and became authentic. I took them into
    their pain, some of which dated back to wartime incidents they had never shared
    before. They came to realize that the power to heal is in the feelings—not in
    talking or thinking, not in affirmations, and not even in meditation if it involves
    shutting out feelings.


    Another myth is that there are two kinds of feelings, positive and negative, and
    that negative ones must be avoided. The truth is that there is no such thing as
    a negative emotion. Emotions only become “bad” and have a negative effect on us
    when they are suppressed, denied, or unexpressed. Positive thinking is really
    just another form of denial.


    ### We Want the Emotional Experience


    As human beings, we are blessed with the capability to feel our emotions. In fact,
    some say the only reason we have chosen this human experience arises from the
    fact that this is the only planet carrying the vibration of emotional energy,
    and we have come here precisely to experience it. Consequently, when we do not
    allow ourselves to experience the full range of emotions and instead suppress
    them, our souls create situations in which we are literally forced to feel them.
    (Have you noticed that people are often given opportunities to feel intense emotions
    just after having prayed for spiritual growth?)


    This means that the whole point of creating an upset may simply lie in our soul’s
    desire to provide an opportunity for us to feel a suppressed emotion. That being
    the case, simply allowing ourselves to have the feeling may allow the energy to
    move through us, and the so-called problem to disappear immediately.


    But not all situations are dissolved so easily. When we try to cope with a deep-seated
    issue and a remembrance of what seems an unforgivable transgression, such as sexual
    abuse, rape, or physical abuse, it takes more than just experiencing our emotions
    to get to the point where we feel unconditional love for the other person. Feeling
    the emotion fully is just the first step in faking it until we make it, and it
    definitely cannot be bypassed.


    I am not saying that emotional work will not benefit from insight gained through
    a shift in perception that might have occurred before the emotions were felt and
    expressed. It certainly will. But the converse does not hold true; the perceptual
    shift required for Radical Forgiveness will not happen if the underlying repressed
    feelings are not released first.


    Invariably, when we feel the desire to forgive someone or something, we have at
    some time felt anger toward them or it. Anger actually exists as a secondary emotion.
    Beneath anger lies a primary emotional pain, such as hurt pride, shame, frustration,
    sadness, terror, or fear. Anger represents energy in motion emanating from the
    suppression of that pain. Not allowing one’s anger to flow can be likened to trying
    to cap a volcano. One day it will blow!


    Stages one and two of Radical Forgiveness ask us to get in touch with not only
    the anger but the underlying emotion as well. This means feeling it—not talking
    about it, analyzing it, or labeling it, but experiencing it!


    #### **LOVE YOUR ANGER**'
