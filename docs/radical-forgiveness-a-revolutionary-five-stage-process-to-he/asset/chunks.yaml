    We can say the same thing about the basic assumptions handed down throughout the
    ages about God, human nature, and the spiritual realm. While there is little hard
    scientific evidence to support their validity, such assumptions have been handed
    down to us as universal truths, or principles, for centuries, and have formed
    the foundation for many great spiritual traditions throughout the world. They
    certainly are foundational to `Radical Forgiveness`. Some of these assumptions
    are now being proven by physicists to be scientifically well founded.


    I prefer to use the word “assumption” rather than “belief” or even “principle”
    because simply classifying an idea as an assumption allows for the possibility
    of a greater truth emerging in the future. I am more likely to be open to seeing
    the deeper meaning in something if I am not ego-invested in a belief system I
    feel obliged to defend. I prefer to hang out in the question rather than take
    a fixed position on something that has yet to be proven.


    I have also discovered that the process of `Radical Forgiveness` works equally
    well whether you believe in it or not. So long as you are willing to try it and
    use the tools the system provides, it seems to work. Belief is not necessary.


    In any case, `Radical Forgiveness` makes very little sense to the rational mind,
    at least to that part of the mentality that is grounded in everyday reality as
    perceived through the five senses. That’s because `Radical Forgiveness` operates
    according to spiritual law, not physical law. It is essentially a metaphysical
    idea.


    Nevertheless, in order to wrap our minds around the basic idea as best we can,
    it helps to go over some of the assumptions that give some structure to the concept
    and a quasi-rational basis for understanding the technology.


    Each assumption listed here is expanded upon at length in various other places
    in the book. They are as follows:


    | Assumption |

    | :--- | :--- |

    | • We have bodies that die, but we have immortal souls that existed prior to
    our incarnation and continue to exist after death. (Therefore, death is an illusion.)
    |

    | • While our bodies and our senses tell us we are separate individuals, we are
    all one. We all individually vibrate as part of a single whole. |

    | • In order to exponentially expand our awareness of oneness, we agreed to come
    to this world of duality in order to experience the exact opposite of oneness—separation.
    |

    | • Part of the agreement was that we would forget the world of oneness we came
    from in order to fully experience the pain of separation. When we have experienced
    the amount of pain we agreed to have in this lifetime, we use `Radical Forgiveness`
    to awaken and remember who we are. |

    | • Since the pain of separation is an emotional experience, we need a body to
    be able to feel it. |

    | • The human experience is meant to be an emotional one, so the extent to which
    we deny our feelings is the extent to which we deny our purpose for being here.
    |

    | • We are spiritual beings having a spiritual experience in human bodies. |

    | • Vibrationally, we live in two worlds simultaneously: <br>1. The World of Divine
    Truth (Spirit)<br>2. The World of Humanity Once we awaken, we can live comfortably
    in both. |

    | • The World of Humanity is a spiritual classroom, and life is the curriculum.
    Our lessons are the events that happen in life. The objective is to awaken to
    the truth of who we are and return home. |

    | • When we decided to incarnate into the World of Humanity, God gave us total
    free will to live the experiment in any way we choose and to find for ourselves
    the way back home. |

    | • We have three forms of intelligence: mental, emotional, and spiritual. Our
    spiritual intelligence knows the truth of who we are and connects us directly
    to universal intelligence. |

    | • Life is not random. It provides for the purposeful unfoldment of our own divine
    plan, with opportunities to make choices and decisions in every moment guided
    by our Higher Self and ego. |

    | • There are two definitions of the ego. The first sees it as our friend and
    loving guide, while the second casts it as our enemy. They are as follows: <br>1.
    A part of our soul whose job it is, in cahoots with our Higher Self and our spiritual
    intelligence, to lovingly find all sorts of ways for us to experience the pain
    of separation, that being the purpose for our being on the earth plane. <br>2.
    An insidious, deep-seated subconscious guilt complex based on our belief that
    we committed the original sin of separating from God, who will eventually punish
    us for doing so. The ego seeks every way possible to reinforce itself and blocks
    any attempt to reveal the truth that we never separated from God at all. It cleverly
    ensures its survival by “protecting” us from our overwhelming guilt, as well as
    the fear of God’s wrath, through the mechanisms of repression and projection.
    (See Chapter 7.) |

    | • We create our reality through the Law of Cause and Effect. Thoughts are causes
    that show up in our world as physical effects. Reality is an outplaying of our
    consciousness. Our world offers a mirror of our beliefs. (See Chapter 9.) |

    | • At the soul level, we get precisely what we need in our lives for our spiritual
    growth. How we judge what we get determines whether we experience life as painful
    or joyful. |

    | • Through relationship we grow and learn. Through relationship we heal and are
    returned to wholeness and truth. We need others to mirror our misperceptions and
    our projections and to help us bring repressed material to consciousness. |

    | • Through the Law of Resonance, we attract people who resonate with our issues
    so we can heal them. For example, if abandonment is our issue, we will tend to
    attract people who abandon us. In that sense, these people serve as our teachers.
    (See Chapter 8.) |

    | • We come into the physical life experience with a mission: to fully experience
    a particular energy pattern so we can feel the feelings associated with that pattern
    and then transform that energy through love. (See Chapter 10.) |

    | • Physical reality is an illusion created by our five senses. Matter consists
    of interrelating energy fields vibrating at different frequencies. (See Chapter
    13.) |


    *Note: If you find yourself unable to accept any of these assumptions, simply
    disregard them. It will make no difference to the effectiveness of the Radical
    Forgiveness experience.*


    ##


    ##


    #### 3


    ### Worlds Apart


    What we might learn from Jill’s story is that things are not always what they
    seem. What appears to be cruel and nasty behavior on somebody’s part might be
    exactly what we need and have indeed called forth. Situations that appear to be
    the worst that could possibly befall us may hold the key to our healing something
    deep within us that keeps us from being happy and prevents our growth. The people
    who seem to us to be the most troublesome and the least likable may therefore
    be our greatest teachers. What we think they do *to* us, they actually do *for*
    us.


    If I am right about this, then it follows that whatever appears to be happening
    is seldom what is truly occurring. Beneath the apparent circumstances of every
    situation exists a wholly different reality—a different world altogether; a world
    that we are not privy to except for the occasional glimpse.

