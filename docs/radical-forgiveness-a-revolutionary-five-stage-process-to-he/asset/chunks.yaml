  trans: "\n\n我们也对自己身上不喜欢的方面感到强烈的羞耻感，并因此疏远这些方面。著名的瑞士心理学家卡尔·荣格（Carl Jung）将其称为我们的**阴影**，因为它代表了我们自身的阴暗面，即我们不希望看到或也不希望被别人看到的部分。我们身上的这部分知道我们有杀死另一个人类的能力——知道如果我们在那个时代是德国人，我们可能参与过集中营；知道如果我们在内战前出生在南方的白人家庭，我们可能拥有并虐待奴隶；知道我们可能会伤害或强奸某人，可能是贪婪或好利的、愤怒且报复心心的，或者在某些方面是偏离或不可接受的。我们所拥有的任何此类特征，或者带给我们羞耻感的生命领域，我们都归类为阴影并予以压抑。\n\
    \n### 坐在火山上\n\n压抑这种能量就像坐在火山上一样！我们永远不知道自己的力量何时会耗尽，从而导致岩浆（`shadow`）喷薄而出，对我们的世界造成毁灭性的破坏。这解释了为什么我们需要引入一个替罪羊，将所有的羞耻感投射在他们身上。这样，我们至少可以暂时从这种情绪中解脱。\n\
    \n### 投射\n\n即使当我们压抑了与生活事件相关的感受和/或记忆时，我们在潜意识层面也知道，与之相关的羞耻、负罪感或自我批判仍然与我们在一起。因此，我们试图通过将这种痛苦“从体内取出”并转移到我们之外的某人或某物身上来摆脱它。这种投射过程让我们忘记自己曾有过这些感受。\n\
    \n一旦我们把不愿拥有的东西投射到别人身上，我们看到的是他们（而不是我们）拥有那些特质。所以，如果我们压抑负罪感并将其投射，我们就让对方变成了错的一方。如果我们压抑愤怒并将其投射，我们就认为他们是那个愤怒的人。我们可以指责他们犯了我们自己自己会被自己指责的所有事情。难怪我们在投射时感到如此释然！通过这样做，我们让别人为我们身上发生的所有糟糕事情，以及我们认为自己身上的负面特质负责。然后，我们可以要求他们受到惩罚，这样我们就能感到更加正义，并更安全地免受攻击。\n\
    \n这解释了为什么我们喜欢看电视新闻。新闻为我们提供了一个机会，将所有的负罪感和羞耻感投射到屏幕上的杀人犯、奸犯、腐败政客和其他“坏人”身上。这样做之后，我们可以带着良好的心情入睡。新闻以及所有其他以“坏人”和糟糕状况为特色的电视节目，无止尽地为我们提供了方便的替罪羊。（图\
    \ 7）\n\n![](img/part2_chapter7_image001.jpg)\n\n图 7：投射我们压抑的羞耻\n\n### 识别你何时正在投射\n\
    \n当你发现自己正在判断某人并感到愤怒时，你就知道自己正在投射。愤怒是投射的恒常伴侣，因为你总是利用这种情绪来为你投射自恨行为合理化。\n\n你觉得这个人身上最令反感的地方，仅仅反映了你内心拒绝并否定的那个部分（你的`shadow`），并将其投射到了他们身上。如果事实并非如此，你不会感到心心。\n\
    \n### 只要你发现了，你就抓到了！\n\n感觉就像对方正在对你做某些事来让你变成。如果我们压抑负罪感并将其投射，我们就让对方变成了错的一方。如果我们压抑愤怒并将其投射，我们就认为他们是那个愤怒的人。我们可以指责他们犯了我们自己自己会被自己指责的所有事情。难怪我们在投射时感到如此释然！通过这样做，我们让别人为我们身上发生的所有糟糕事情，以及我们认为自己身上的负面特质负责。然后，我们可以要求他们受到惩罚，这样我们就能感到更加正义，并更安全地免受攻击。\n\
    \n### 对亲密的恐惧\n\n当我们遇到喜欢的人时，往往会害怕亲密。这是因为我们害怕他们会看到我们的`shadow`，并像我们拒绝自己一样拒绝我们。我们把自己的恐惧投射到他们身上，然后我们害怕他们，而不是害怕自己。例如，如果我们担心自己无聊，就会将其投射到伴侣身上。如果我们担心自己丑，就会将其投射为他们觉得我们丑。如果我们担心自己不配得上，就会将其投射出去。\n\
    \n### 关系都是为了治愈\n\n正如我们在 Jill 的故事中看到的，“激进宽恕”（Radical Forgiveness）可以拯救一段关系（Jill\
    \ 和 Jeff 仍然婚姻美满）。然而，这并不 necessarily 目标。如果关系的真谛已经实现，即治愈已经发生，那么关系可能只是自然和平地消散。当双方都理解“激进宽恕”并使用这种技术时，分手可以是充满爱、尊重且相对没有痛苦的。\n\
    \n另一方面，如果关系在治愈发生之前破裂，双方可能会离开并找到另一个具有非常相似特征的伴侣，他们会为对方引发相同的问题。我们中的许多人一次又这样做，当这种模式被指出时，我们通常能很清楚地看到这种模式。\n\
    \n## \n\n# #\n\n#### 8\n\n### 引力与共鸣\n\n正如我们在上一章看到的，我们将负罪感和愤怒投射给那些有能力产生情感共鸣的人，而这些人就变成了方便的替罪羊。\n\
    \n就像无线电台使用特定的频率广播节目一样，我们的情绪（运动中的能量）也以特定的频率振动。与我们的感受产生共鸣的人以相同的速率振动，并可能拥有我们相似的情绪模式——相同或相反——然后他们将这些镜像给我们。我们的核心信念也有特定的频率。通过大声说出它们，我们赋予了信念更多能量，使它们在宇宙中具有了因果属性，在我们的世界中产生影响。此外，其他人与该信念的能量频率产生共鸣。换句话说，他们以相同的速率与之感应振动。当他们这样做时，他们会被吸引到我们的生活中，将我们的信念反射给我们。这给了我们一个机会去审视并在必要时改变对该信念的看法。\n\
    \n"
- fmt: "\nRecall from Part One that my sister, Jill, had a belief that she would never\
    \ be enough for any man. This belief resonated with a man who was a sex addict.\
    \ He provided the ideal partner for her because he supported her belief by continually\
    \ having sex with other women, thus showing her she was not enough for him. She\
    \ did not make the connection in that relationship and, consequently, did not\
    \ heal the pain that created this belief in the first place. So she found another\
    \ man (Jeff) who resonated with her belief. He supported her belief differently,\
    \ by using his own issue of codependence with his daughter Lorraine as the catalyst.\
    \ In this situation, she saw the connection and realized that he was mirroring\
    \ her belief that she was not enough, and both of them healed.\n\nIf you want\
    \ to know what you dislike about yourself and have likely disowned, simply look\
    \ at what annoys you about the people who come into your life. Look into the mirror\
    \ they provide. If you seem to attract a lot of angry people into your life, you\
    \ probably have not dealt with some anger of your own. If people seem to withhold\
    \ love from you, some part of you is unwilling to give love. If people seem to\
    \ steal things from you, part of you behaves dishonestly or feels dishonest. If\
    \ people betray you, maybe you have betrayed someone in the past.\n\nLook at the\
    \ issues that upset you too. If abortion really makes you mad, maybe a part of\
    \ you shows little reverence for life in other ways, or a part of you knows it\
    \ could abuse a child. If you are passionately against homosexuality, maybe you\
    \ cannot accept the part of you that sometimes feels homosexually inclined.\n\n\
    ### Hall of Mirrors\nThe reflection does not always appear so readily or as simply.\
    \ For example, sometimes we do not identify with the specific behavior as much\
    \ as we do with the underlying meaning it holds for us. A man who gets angry about\
    \ his wife’s overeating and obesity may not be resonating with any personal tendency\
    \ to overeat; instead, he might be resonating with her use of food to avoid dealing\
    \ with emotional problems because it mirrors his tendency to run away from his\
    \ own emotional turmoil. Clearly, seeing what others mirror for us can become\
    \ like looking at the myriad of distorted images in a hall of mirrors.\n\n###\
    \ Automatic Reversal of Projection\nThe beauty of Radical Forgiveness lies in\
    \ the fact that it does not require us to recognize what we project. We simply\
    \ forgive the person for what is happening at the time. In doing so, we automatically\
    \ undo the projection, no matter how complicated the situation. The reason for\
    \ this is simple, in that the person represents the original pain that caused\
    \ us to project in the first place. As we forgive him or her, we clear that original\
    \ pain.\n\nIronically, the people who seem to upset us the most are those who,\
    \ at the soul level, love and support us the most. They are often the souls we\
    \ made contracts with prior to our incarnation to do certain things with us during\
    \ our lifetime. Almost always, and often at great expense to themselves in terms\
    \ of their own discomfort, these individuals try to teach us something about ourselves\
    \ and encourage us to move toward our awakening. Remember, this is not a personality-to-personality\
    \ exchange. In fact, more than likely, our personalities clash terribly. Instead,\
    \ the souls of each player set up the scenario in the hope that we will eventually\
    \ see the truth.\n\n### Don’t Take Life So Personally\nWho comes into our lives\
    \ to help us accomplish this task is actually irrelevant. If one particular person\
    \ does not take the job, somebody else will. The tragedy is that, as the victim,\
    \ we seldom understand this. We imagine that we just happened to be the unlucky\
    \ recipient of a particular person’s harmful behavior. It does not occur to us\
    \ that we might have (at the soul level) attracted the person and the situation\
    \ to ourselves for a reason and that had it not been this person, it simply would\
    \ have been someone else. We mistakenly feel that, but for this person, we would\
    \ not have had the problem. In other words, we see the problem as entirely with\
    \ the other person, whom we now feel justified in hating and resenting for “causing”\
    \ us pain and unhappiness.\n\n### Blaming Our Parents\nWe often hear this type\
    \ of blame when people talk about their parents. “If I’d had different parents,\
    \ I’d be whole and complete today,” people say. Wrong. They could have chosen\
    \ a different set of parents, that’s true; but the new set would have given them\
    \ the exact same experience, because that’s what their soul wanted.\n\n### Repeating\
    \ Relationship Patterns\nWhen we see ourselves as victims, we think only about\
    \ killing the messenger. We miss the message. This explains why people go from\
    \ marriage to marriage recreating the same relationship dynamic each time. They\
    \ do not get the message with the first spouse, so they go on to another who continues\
    \ trying to relay the message the last spouse tried to relay.\n\n### Codependency\
    \ and Mutual Projection\nWe also find others onto whom we project our own self-hatred,\
    \ who will not only accept it but reciprocate by projecting theirs back onto us.\
    \ We call this kind of agreement a codependent or addictive relationship. This\
    \ special someone compensates for what we feel is missing in ourselves by continually\
    \ telling us we are okay, so we avoid feeling our shame about who we are. We do\
    \ the same thing for them in return; thus both people learn to manipulate each\
    \ other with highly conditional love based on the underlying guilt. (The stereotypical\
    \ Jewish mother is a wonderful example of this archetype.) The moment the other\
    \ person withdraws approval, we are forced to confront our guilt and self-hatred\
    \ again, and everything collapses. Love turns immediately into hate, and each\
    \ partner attacks the other. This explains why so many faltering relationships\
    \ that once seemed supportive and loving turn into cauldrons of hate almost instantaneously.\n\
    \n# 9\n### Cause and Effect\nCentral to the idea that we create our own reality\
    \ is the Law of Cause and Effect. This states that every action has an equal reaction.\
    \ Therefore, every cause must have an effect, and every effect must have a cause.\
    \ Since thoughts are causal in nature, every thought has an effect in the world.\
    \ In other words, we—unconsciously for the most part—create our world, the World\
    \ of Humanity, with our thoughts.\n\nWhen we vibrate at a high frequency, such\
    \ as when we pray, meditate, or contemplate, we can create consciously and intentionally\
    \ through thought. Most of the time, though, we do so quite unconsciously. Individual\
    \ random thoughts do not carry a lot of energy, so they create a relatively small\
    \ effect. However, thoughts accompanied by larger amounts of energy, especially\
    \ emotional or creative energy, have a much larger effect in the world. Thus they\
    \ take a larger hand in creating our reality.\n\nWhen a thought gathers sufficient\
    \ energy to become a belief, it has an even greater effect in the world. It becomes\
    \ an operating principle in our lives, and we then create effects—circumstances,\
    \ situations, even physical events—that hold true to that belief. What we believe\
    \ about the world is how it will always be for us.\n\nAcceptance of the principle\
    \ that thought is creative is fundamental to an understanding of Radical Forgiveness,\
    \ for it allows us to see that what turns up in our lives represents what we have\
    \ created with our thoughts and beliefs. It allows us to see that we are simply\
    \ projecting all our thoughts and beliefs about “the way things are” onto the\
    \ world. (FIGURE 8)\n\n![](Images/part2_chapter9_image001.jpg)  \n\nFIGURE 8:\
    \ Projecting Our Own Reality\n\n### PROJECTING THE ILLUSION\n"
