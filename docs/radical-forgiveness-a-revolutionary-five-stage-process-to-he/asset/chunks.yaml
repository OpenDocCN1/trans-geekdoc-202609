    通过工作表法，整合是通过写下陈述然后大声读出来来实现的。通过`13 Steps`，整合是通过做出口头肯定来看到完美来实现的。通过仪式（参见“更多资源”），穿过圆圈并对另一个方向走来的人说一些肯定的话，这一行为完成了整合。仪式、庆典，当然还有音乐，都被用来整合“激进原谅（Radical
    Forgiveness）”这种感知的转变。


    这五个阶段并不一定按照这个顺序发生。很多时候，我们会同时经历这些阶段（或至少是其中某些阶段），或者以一种循环或螺旋的方式在不同阶段之间来回移动。


    # 激进原谅


    ## 18


    ### 假装成真 (Fake It Till You Make It)


    原谅是一段旅程，它总是始于不原谅的地方。到达那里可能需要几年，也可能几分钟，我们现在知道这是一个选择问题。传统的原谅需要长时间，但我们可以通过激进原谅，通过简单表达我们看到完美的`willing
    性`来快速实现。每当我们这样做时，它都代表了信仰的行为、一次祈祷、一份奉献，以及对神助的谦卑请求。我们在感到无法原谅的时刻这样做，从这个意义上说，这是一个“假装直到成真”的过程。


    ### 顺服 (SURRENDERING)


    假装成真真的意味着顺应这一过程，既不付出努力，也不试图控制结果。在第 13 章提到的西雅图研究中，参与者在尝试原谅上付出的努力越多，他们就发现越难以放下伤害和愤怒。在他们停止尝试原谅和控制过程后，在某个时间点，原谅就自然发生了。


    诚然，从愤怒和责备到原谅和责任的能量转变，在激进原谅中发生得快得多，因为使用这里提供的工具，我们可以抛弃受害者意识。你可能在第 13 章中记得，意识会改变时间。尽管如此，即使使用激进原谅，我们在进入过程时也必须对能量转变何时发生不抱预期——尽管我们知道它可以瞬间发生。结果具体何时开始出现可能取决于我们知之甚少。可能需要一段时间，我们才会开始真正对相关涉的人感到无条件的接纳，并对局势感到平和，这正是我们判断原谅何时完成的标准。例如，可能需要很多工作表才能达到这一点。


    然而，对许多人来说，得知我们并不需要喜欢某个人就能原谅他们。如果他们的性格和/或行为对我们是有毒的，我们也不必留在他们身边。激进原谅是灵魂与灵魂的互动，只需要我们在灵魂层面建立联系。当我们对他们的灵魂产生这种无条件的爱时，我们的灵魂就与他们的灵魂接合，我们合二为一。


    ### 把握机会 (TAKING THE OPPORTUNITY)


    每当有人惹恼我们时，我们必须将其视为原谅的机会。惹恼我们的人可能共鸣了我们内心某些需要治愈的东西，在这种情况下，我们可以选择将其视为礼物——只要我们愿意转变自己的感知。这种情况也可能是早期某个时刻的重演，当时有人曾对我们做过类似的事情。如果是这样，现在的这个人就代表了以前所有曾对我们做过同样事情的人。当我们原谅这个人在目前的情况时，我们就原谅了以前所有曾对我们做过同样事情的人。


    ## 激进原谅急救工具


    以下章节包含了转变能量并提供改变现状机会的过程。这种改变构成了激进原谅的精髓。所有这些过程通过帮助我们从过去收回能量并从未来撤回能量，将我们带当下，这两者都必须完成才能产生改变。


    本节包含的一些工具更适合在需要原谅的情况发生的瞬间使用。它们帮助我们在深陷戏剧性冲突并进入“受害者之地（Victimland）”之前，猛地意识到可能正在发生的事情。当我们的神经开关被触动时，我们很容易直接进入防御/攻击循环。一旦进入这个循环，我们就发现很难出来。使用这些快速工具有助于我们避免开始这个循环。`原谅四步法（Four
    Steps to Forgiveness）`（参见第 22 章）就是其中之一。它很容易记忆，你可以在那个时刻对自己说。


    后续章节中描述的其他工具设计用于我们在更具反思的心态时使用。`激进原谅工作表`在这方面效果奇奇。起初，请将它们都作为一种信仰的行为。时间的推移，回报将是不可思议的。持续使用这些工具帮助我们找到一种可能从未想过可能的平和。


    # 19


    ### 感受痛苦 (Feeling the Pain)


    感受情绪是原谅过程的第二阶段，它通常作为讲述故事的后果而产生。这一步要求我们允许自己感受围绕特定情况的情绪——并充分地感受这些情绪。如果我们尝试用纯粹的心理过程来原谅——例如，否认自己感到愤怒、悲伤或抑郁——那么什么都不会发生。我遇到过很多人，特别是那些自认为很灵性的人，他们认为情绪应该被否认并交给神性（Spirit）。这被称为`灵性逃避（spiritual
    bypass）`。


    1994 年，我同意在英国举办一个工作坊。这是我移民美国十年后，我完全忘记了英国人在抵制感受自己情绪方面有多大。

