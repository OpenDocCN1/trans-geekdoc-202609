    is a golden opportunity to resolve that old issue, even if you have no idea what
    it is. You just do the worksheet on the small event until the upset goes away.
    In this way, you automatically take care of the older issue. The more worksheets
    you do on a daily basis, the more you clear your energy field of old emotional
    baggage.


    You might want to date and number these sheets and then file them. This allows
    you to review them from time to time and evaluate the extent to which your consciousness
    has changed. Alternatively, you might want to do a ritual burning of them as part
    of the process.


    ### THE RADICAL FORGIVENESS WORKSHEET


    #### **An Instrument for the True Transformation of a Grievance**


    Following is a sample filled-in worksheet and instructions for each step.


    **Date:** *8/7/09* Worksheet *#:3*


    **Subject:** *Jeff* Whomever you are upset about.


    **Instructions:** Identify the person, situation, or object about which you feel
    upset. Do not use the Radical Forgiveness worksheet for forgiving yourself. There
    is a separate worksheet for this entitled Radical Self-Forgiveness and Self-Acceptance
    (see Further Resources). The one exception to this is when you are forgiving a
    part of your body that has let you down by becoming sick or otherwise not functioning
    correctly. In this case, externalize it by giving it a name other than your own,
    and speak of it as if it were someone “out there” separate from yourself.


    ### I. TELLING THE STORY


    1\. The situation around which I have an upset is or was ... *(Tell the story
    totally from your victim standpoint, i.e., old paradigm. Use additional paper
    if necessary.)*


    *Jeff is abandoning me by focusing all his attention and love on his daughter
    Lorraine—completely ignoring me. He makes me wrong and accuses me of being mentally
    unbalanced. He makes me feel worthless and stupid. Our marriage is over, and it’s
    all his fault. He is forcing me to leave him.*


    **Instructions:** Be sure to write about the person or object upsetting you in
    the third person. In other words, tell your story as if you were telling someone
    else what happened or is happening. Tell the story about your upset from the victim’s
    standpoint. (Victim consciousness is the old paradigm.) Don’t hold back. Describe
    what the situation is or was and how it feels for you right now, and/or what it
    felt like at the time. Do not edit or overlay it with any spiritual or psychological
    interpretation. You must honor where you are now, even if you know that you are
    in Victimland and therefore in the illusion. (Remember, we are never upset for
    the reason we think.) Knowing that you are experiencing illusion and need to experience
    it represents the first step toward escaping from it.


    Even if we have already awakened to the truth (the new paradigm), we can easily
    be knocked off balance and perceive ourselves as victims again very easily. Being
    human requires that experience. We cannot always be joyful and peaceful and see
    the perfection in absolutely every situation.


    2a. **Confronting X:** I am upset with you, *Jeff,* because ...


    *You have ruined our marriage. You have hurt me and rejected me. Your behavior
    stinks, and I am going to leave you, you bastard!*'
