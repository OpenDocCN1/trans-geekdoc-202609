    The subtle fields envelop the physical body in layers like vibrating sheaths of
    energy, each one an octave higher than the previous. But they are not fixed bands
    with clear boundaries, as shown in Figure 10. Rather, they are to a large degree
    diffused within the same space, as if they were all part of an ocean of energy
    surrounding our bodies. The subtle bodies are not so much defined by their position
    in space as by the different frequencies at which they vibrate.


    The subtle bodies resonate harmonically with the vibrating patterns of the physical
    body, enabling consciousness (mind) to interact with the body. This is what we
    mean when we speak of the `body-mind continuum`, with mind existing both inside
    and outside the physical body. (For more details on the qualities and purpose
    ascribed to each of these subtle bodies, refer to Chapter 15.)


    To ground this concept in a practical analogy, think of our bodies as being like
    the filters typically found in home heating furnaces—the kind we have to clean
    from time to time to ensure the furnace works efficiently. Just as these filters
    are designed to allow air to move easily through them, the same is true of our
    bodies and the life force. Life force must be free to flow easily through all
    our bodies—our physical one and our subtle bodies too. (FIGURE 10)


    ![](Images/part2_chapter13_image001.jpg)


    FIGURE 10: The Subtle Energy Bodies


    Whenever we judge, make someone wrong, blame, project, repress anger, hold resentment,
    and the like, we create an energy block in our body/bodies. Each time we do this,
    our filter becomes a little more blocked and less energy remains available for
    our furnace. Sooner or later the filter fails, and, starved of the vital oxygen
    it must have to keep burning, the flame dies. More simply, when our physical and
    subtle bodies become too clogged for life force to flow through easily, our body
    starts to shut down. In many cases, this manifests first as depression. Eventually,
    our body gets sick, and, if the blocks are not removed, we may die.


    You may recall how my sister, Jill, felt a release of energy when she moved into
    Radical Forgiveness. Her life force filter was blocked by her toxic belief system
    about her own lack of worthiness, not to mention past resentments, anger, sadness,
    and frustration over her current situation. When she let all that go, her energy
    blocks were cleared, which allowed her to shift her emotional state as well. Whenever
    you forgive radically, you release enormous amounts of life force energy that
    then can be made available for healing, creativity, and expressing your true purpose
    in life.


    ### Farra’s Flu Release


    My good friend Farra Allen, co-founder of the Atlanta School of Massage and a
    mind/body counselor, took ill with a particularly virulent strain of flu that
    typically keeps people in bed for ten days or more. It hit him hard, but instead
    of giving all his power to the virus, he decided to do some inner work around
    it, work that might shift the energy pattern holding the virus in place. Using
    a process known as active imagination, which simply involves writing down thoughts
    as a stream of consciousness, he came upon a hitherto unconscious and unresolved
    emotional issue. He used Radical Forgiveness to clear the issue, and the flu disappeared
    almost immediately. He was working full time and feeling great within two days
    of the onset of his illness. This was a powerful demonstration of the healing
    power of Radical Forgiveness.


    #### Will Cancer Respond Too?


    Suppose the illness had been cancer rather than the flu, and it was our belief
    that it had started as a deeply repressed emotion. Thinking the cure might lie
    in releasing that energy block, our recommendation would have have been that my
    friend get in touch with the repressed feelings, feel them fully, and then let
    them go.


    However, unlike Farra’s flu attack, which probably moved from his subtle body
    into his physical body in just a few days, this energy pattern might have taken
    many years to move from the subtle body into the physical body and, in time, to
    manifest as a disease. The question that haunts us then becomes, how long will
    it take for the disease process to fully reverse itself using emotional release
    work alone? Conceivably, it could require the same number of years it took for
    the disease to manifest—not very practical if you have cancer or some other disease
    for which time is of the essence—or so it might seem, anyway.


    #### Time Is a Factor in Healing


    We used to think of time as something fixed and linear, until Einstein showed
    that time is a relative concept. In terms of how long it takes to heal a physical
    disease or condition, consciousness is definitely a factor. The more elevated
    our consciousness, the faster we create change in anything to which we give our
    focused attention.


    Think of consciousness as our vibratory rate. It would probably take far too long
    to reverse the disease process of cancer energetically in a person with a low
    vibratory rate. It will automatically be low if we are in fear, hold anger and
    resentment, think of ourselves as a victim, and/or have our energy locked up in
    the past. For the majority of us, this represents our consciousness most of the
    time. Therefore, few of us could reverse a disease like cancer fast enough by
    relying solely on releasing the emotional cause of the disease—that is, unless
    we can find a way to raise our vibratory rate. (FIGURE 11)


    ![](Images/part2_chapter13_image002.jpg)


    Figure 11: Time and Healing


    By letting go of the victim archetype and bringing our energy into present time
    through the process of Radical Forgiveness, we may be able to raise our vibration
    enough to create at least a quicker, if not immediate, disease reversal. We improve
    our chances if we also incorporate other ways of raising our vibration, such as
    prayer and meditation.


    Here is an example. A woman who attended one of our retreats had had several surgeries
    for ovarian cancer, and her doctors had recently given her three months the most
    to live. She was depressed and had little life force left. She said she only came
    to the retreat because the people in her church had collected the money for her
    to come, so she felt obliged to do so. We worked with her, and on the third day
    she had a wonderful breakthrough that put her in touch with an event that had
    occurred when she was two-and-half years old and had made her believe herself
    be utterly worthless. She released a lot of emotion around that issue and grieved
    for the countless number of times she had created her life in ways that proved
    her worthlessness. After that, her life force energy increased. By the time she
    left, she was all fired up to find an alternative program that would help her
    beat the cancer and the doctor’s prognosis. She was even willing to travel outside
    the U.S. if the method she chose was illegal in this country. (Many treatments
    are illegal in the U.S.)


    After two weeks of frantically searching for the treatment to which she felt most
    drawn, she suddenly realized that her healing would come through prayer. So she
    went away to a place in upstate New York and worked with a couple who offered
    prayer weeks: she literally prayed for a week. Upon her return, she went to her
    oncologist, who examined her and said, “I don’t know how to explain this, but
    you have absolutely no cancer in your body. I could say it was a spontaneous remission,
    but I believe in God, and I am not willing to describe it in any other way than
    as a miracle.”


    This woman serves as a wonderful example of how raising the vibration through
    prayer reversed the physical condition in days rather than years. I believe that
    Radical Forgiveness would have done the same.


    ### Seattle Forgiveness Study

