    # Acknowledgments


    My gratitude and love goes first to my wife, JoAnn, for believing in me and writing
    this. I owe a special debt to my sister, Lorraine, and brother-in-law, John, for
    their patience and collaboration. ( [rest omitted for brevity])

    (Images/back.jpg)


    # Introduction


    Everywhere we look, in the newspapers, on TV, and even in our personal lives—we
    see examples of people who have been egregiously. We read, for example, that at
    least one in five adults in America today was either physically or sexually abused
    as a child. TV news confirms that rape and murder are commonplace in our communities
    and crime against property is rampant. Around the world we see torture, repression,
    incarceration, and open warfare occurring on a vast scale.


    In the early 1990s I began offering forgiveness workshops, cancer retreats, and
    corporate seminars. Since then I have heard enough horror stories from quite ordinary
    people to convince me that there is not a human being on the planet who has not
    been seriously at least once, and in minor ways more than they could count. Who
    among us can say they have never blamed someone else for their lack of?


    To break free from such a powerful archetype, we must replace it with something
    radically different—something so compelling and spiritually liberating that it
    magnetizes us away from. We need something that will take us beyond the drama
    of our lives so we can see the big picture and the truth that, right now, lies
    hidden from us.


    As we continue to move into the new millennium and prepare for the imminent next
    great leap in our spiritual evolution, it is essential that we adopt a way of
    living based not on fear, control, and abuse of power but on true forgiveness,
    unconditional love, and peace. That’s what I mean by something radical, and that
    is what my book is all about: helping us make that transition.

