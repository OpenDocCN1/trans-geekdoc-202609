  trans: '


    对于世世代代来的关于神、人性和灵界的基本假设，我们也可以说同样的话。虽然很少有硬性的科学证据来支持它们的有效性，但这些假设几个世纪以来一直作为普遍真理或原则相传给我们，并构成了世界上许多伟大精神传统的基础。它们对于`激进宽恕`（Radical
    Forgiveness）无疑是基础性的。这些假设现在正被物理学家证明在科学上是有根据的。


    我更倾向于使用“假设”一词，而不是“信念”甚至是“原则”，因为仅仅将一个想法归类为假设，为未来出现更大的真理留下了可能。如果我不对我所觉得有义务去捍卫的信念体系投入自我，我更有可能开放去洞察某事物背后的深层意义。我宁愿停留在问题中，而不是对一个尚未被证实的事情采取固定的立场。


    我还发现，`激进宽恕`的过程无论你是否相信它，其效果都一样好。只要你愿意尝试并使用系统提供的工具，它似乎就有效。相信并非必要的。


    无论如何，`激进宽恕`对于理性思维来说几乎毫无意义，至少对于那种根植于通过五感感知的日常现实的心智部分是如此。因为`激进宽恕`根据精神法则运作，而不是物理法则。它本质上是一个形而上学的概念。


    尽管如此，为了让我们尽可能理解这一核心思想，回顾一些为该概念提供结构并为理解这项技术提供准理性基础的假设是有帮助的。


    这里列出的每个假设在书中其他地方都有详细的阐述。它们如下：


    | 假设 |

    | :--- | :--- |

    | • 我们有会死亡的身体，但我们拥有在投胎之前就存在、并在死后继续存在的不朽灵魂。（因此，死亡是一种幻象。） |

    | • 虽然我们的身体和感官告诉我们是独立的个体，但我们都是一体的。我们都作为一个整体的一部分在独立地振动。 |

    | • 为了指数级地扩大我们对一性的意识，我们同意来到这个二元对立的世界，以体验与一性完全对立的事物——分离。 |

    | • 协议的一部分是，我们将忘记来自的那个一性世界，以充分体验分离的痛苦。当我们体验了这辈子所约定的痛苦程度时，我们使用`激进宽恕`来觉醒并记住我们是谁。
    |

    | • 既然分离的痛苦是一种情感体验，我们需要一个身体才能感受到它。 |

    | • 人类的经历本应是情感性的，因此我们否认感受的程度，就是我们否认自己来到此目的的程度。 |

    | • 我们是在人类身体中灵性体验的灵性生物。 |

    | • 从振动的角度来说，我们同时生活在两个世界：<br>1. 神圣真理世界（精神）<br>2. 人类世界。一旦我们觉醒，就可以在两个世界中舒适地生活。 |

    | • 人类世界是一个灵性教室，生命就是课程。我们的课程是生活中发生的事件。目标是觉醒到我们是谁的真理并回家。 |

    | • 当我们决定投胎到人类世界时，神给了我们完全的自由意志，让我们以选择的任何方式进行实验，并为自己找到回家的路。 |

    | • 我们有三种形式的智慧：心理、情感精神。我们的精神智慧知道我们是谁的真理，并将我们直接与宇宙智慧连接起来。 |

    | • 生命不是随机的。它为我们神圣计划的有目的展开提供了保障，并在每一刻都提供在我们的更高自我和自我的引导下做出选择和决定的机会。 |

    | • 自我有两种定义。第一种将其视为我们的朋友和爱心的导师，而第二种将其描绘为我们的敌人。它们如下：<br>1. 我们灵魂的一部分，它的工作是与我们的更高自我和精神智慧合谋，充满爱地为我们寻找各种方式来体验分离的痛苦，这就是我们在地球平面存在的意义。<br>2.
    一种阴险的、根深蒂固的潜意识罪恶感复合，基于我们认为自己犯了与神分离的原罪，而神最终会因此惩罚我们。自我寻求一切可能的方法来强化自身，并阻止任何揭示“我们从未与神分离”这一真理的尝试。它通过压抑和投射机制，“保护”我们免受这种压倒性的罪恶感以及对神愤怒的恐惧，巧妙地确保了自身的生存。（见第七章。）
    |

    | • 我们通过因果律创造自己的现实。思想是因，在我们的世界中表现为物理果。现实是我们意识的投射。我们的世界提供了我们信念的镜子。（见第九章。） |

    | • 在灵魂层面，我们在生活中精确地获得了精神成长所需的切切。我们如何判断所得到的，决定了我们体验生活是痛苦的还是快乐的。 |

    | • 我们在关系中成长和学习。在关系中，我们得到治愈并回到完整与真理。我们需要他人来反映我们的误解和投射，并帮助我们将被压抑的素材带入意识。 |

    | • 通过共振律，我们吸引与我们的问题产生共鸣的人，以便我们治愈他们。例如，如果遗弃是我们的问题，我们倾向于吸引遗弃我们的人。从这个意义上说，这些人充当了我们的老师。（见第八章。）
    |

    | • 我们进入物理生活经验带着使命：充分体验特定的能量模式，以便感受与该模式相关的情感，并通过爱转化这种能量。（见第十章。） |

    | • 物理现实是由我们的五感创造的幻象。物质由以不同频率振动的相互能量场组成。（见第十三章。） |


    *注意：如果你发现自己无法接受这些任何假设，请忽略它们。这对于激进宽恕体验的有效性没有影响。*


    ##


    ##


    #### 3


    ### 两个世界


    从 Jill 的故事中我们可以学到，事情并不总是表面上看起来那样。某人看似冷酷残忍的行为，可能正是我们需要的，并且确实被召唤了出来。看似是我们可能遭遇的最糟糕的情况，可能正是治愈我们内心深处某些让我们不快乐并阻碍我们成长的钥匙。那些在我们看来最麻烦、最不受待的人，因此可能是我们伟大的老师。我们认为他们对我们所做的事，实际上他们是在为我们做。


    如果我关于这一点是正确的，那么意味着表面发生的事情很少是真实发生的。在每个情境的表面现象之下存在着一个完全不同的现实——另一个完全不同的世界；一个我们偶尔瞥见、否则无法得知的世界。


