    Another great benefit of Satori Breathwork comes from the fact that it integrates
    new energy patterns into our existing energy fields and restructures our subtle
    bodies accordingly. This means that when you shift your perception, have an insight,
    or release old emotional patterns, breathwork integrates this into your `body’s`
    data banks. Using the computer analogy, it is as if breathwork serves as a downloading
    process in which data currently stored in the short-term computer memory is transferred
    to the hard drive for permanent storage.


    This also explains why Satori Breathwork is so important in the Radical Forgiveness
    process. It accomplishes these tasks, not just at the beginning of the process
    for the purpose of emotional release, but afterward too, when our belief systems
    change and all the resulting changes in our energy fields need integrating. The
    integration process anchors the changes in our bodies and helps prevent us from
    going back to our old ways.


    I would suggest that you have between ten and twenty supervised breathing sessions
    over a period of time, which may take up to a year. After that, you can probably
    do the breathing process on your own.


    # 28

    ### The Radical Release Letter


    The Release Letter is an adaptation of a letter given to me by hypnotherapist
    and mind/body therapist Dr. Sharon Forrest of the Forrest Foundation, a nonprofit
    corporation dedicated to alternative holistic healing, located in Mexico.


    The Release Letter proclaims to your Higher Self and to every part of your being
    that you give full permission for all aspects of unforgiveness still remaining
    in any situation to be released. It also serves as an instrument of self-forgiveness,
    for it recognizes that you have created the experiences as a way to learn and
    to grow.


    Photocopy the letter as written on the following page and enlarge it to an appropriate
    size. To use the Release Letter, fill in the blanks, have it witnessed by someone,
    and then burn it in a ritual manner.


    Date: `\_\_\_\_` Name: `\_\_\_\_`


    Dear Higher Self:


    I, `\_\_\_\_`, hereby grant you, my Higher Self, my Soul, my Super-Conscious Mind,
    my `DNA`, my cellular memory, and all parts of myself that might want to hold
    onto unforgiveness for whatever reason, permission to release all of the misunderstandings,
    unfounded beliefs, misinterpretations, and misguided emotions, wherever they may
    reside, whether in my body, my unconscious mind, my `DNA`, my conscious mind,
    my subconscious mind, my unconscious mind, my chakras, and even my Soul, and I
    ask all those who want the best for me to assist in this releasing process.


    I, `\_\_\_\_`, thank you, my Soul, for creating the experiences that created the
    unforgiveness, and I realize that on some level they have all been my teachers
    and have offered opportunities for me to learn and grow. I accept the experiences
    without judgment and do hereby release them to the nothingness from which they
    came.


    I, `\_\_\_\_`, do hereby forgive `\_\_\_\_`.


    I release him/her to his/her highest good and set him/her free. I bless him/her
    for having been willing to be my teacher. I sever all unhealthy attachments to
    this person and send him/her unconditional love and support.


    I, `\_\_\_\_`, do hereby forgive myself, accept myself just the way I am, and
    love myself unconditionally just the way I am, in all my power and magnificence.


    I, `\_\_\_\_`, do hereby release myself to my highest good and claim for myself
    freedom, fulfillment of my dreams, wishes, and goals, clarity, love, full expression,
    creativity, health, and prosperity.


    Signed: `\_\_\_\_` Date: `\_\_\_\_`


    Witnessed by: `\_\_\_\_` Date: `\_\_\_\_`


    # 29

    ### The Forgiveness Rose


    When we open our hearts to others, we become vulnerable and face the danger of
    becoming the target for their projections. Their psychic energy can become mixed
    with ours, and this can deplete our energy.


    The more workshops I do, the more I realize that in many cases the problems people
    appear to be having with someone in particular stem from the fact that the latter
    person is able to get into and manipulate their energy field. Almost invariably,
    the one with whom they have the problem seems to be entering through the `third
    chakra`, which is the one where issues of power and control are stored. Once in,
    it is easy for that person to control them—sucking their energy or dumping their
    own energy onto them at will. Of course, this is all done subconsciously—without
    awareness and hopefully without malice—but it can be debilitating to the one being
    manipulated and puts a great strain on the relationship.


    You probably won’t be surprised to learn that it is most often the person’s mother
    who is doing the invading and controlling—even from the grave, I might add. It
    might also be the father, or the spouse, or any other person who wants to have
    some control over the person’s life, but most often it is the mother.


    The easiest way for you to stop this or prevent it happening with people you come
    in contact with is to simply place an imaginary rose between you and the other
    person. It is a surprisingly powerful protective device.


    The rose is a symbol of psychic protection in a great many esoteric writings.
    For whatever reason, it possesses a great deal of potency in this regard, probably
    because it is the universal symbol for love. Visualizing a rose gives us protection
    from the projections of others, offering a way to block negative energy without
    closing our heart to the person. I cannot explain why the rose visualization works
    so well in this regard; in truth, we can create psychic protection with any kind
    of visualization, because just doing so creates the intention of self-protection.
    But the rose has been used for centuries for this purpose and seems to work better
    than most other symbols.


    So, from now on, any time you encounter someone whose energy you don’t want mixed
    with your, visualize the rose existing at the edge of your aura, or halfway between
    yourself and the person. Then notice whether you feel differently while in their
    presence. You should feel a much greater sense of your own psychic space and identity
    while at the same time being present for the person. You don’t have to be in someone’s
    physical presence for them to be able to control your energy, so it is a good
    idea to put up your rose even while talking on the phone. (FIGURE 19)


    ![](Images/part4_chapter29_image001.jpg)


    FIGURE 19: The Rose


    # 30

    ### A Wake for the Inner Child


    Our spiritual evolution depends heavily upon our recovery from our worst addiction—our
    addiction to the victim archetype, which traps us in the past and saps our life
    energy. The inner child represents nothing but a metaphor for our woundedness
    and a cuty form of victim consciousness. Wrapping our victim consciousness in
    baby clothes does not make it more acceptable. Invoking our inner child still
    represents addictive behavior.


    Please note that I am not talking about the playful, creative, and life-affirming
    inner child, such as the one described by Richard Bach,[6] or the part of ourselves
    that comes forward to inspire and awaken us. I am talking about the whining little
    brat who lives in the back room of our mind, that unhappy victim who can always
    be relied upon to blame everyone else for our unhappiness. This is the one we
    pandered to at all those inner child workshops in the 1980s.

