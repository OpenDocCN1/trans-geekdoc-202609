    The key to understanding her power as a human being lies in the archetype of the
    wounded healer, which teaches us that our power lies in our wounds—in the sense
    that it is the wound in me that evokes the healing in you and the wound in you
    that evokes the healing in me. We are all wounded healers, but we don’t know it.
    When we keep our wounds hidden and totally private, we separate from and deny
    healing, not only to ourselves but to countless others. The stiff upper lip is
    a terrible way to withhold love. It atrophies the heart and cripples the soul.
    Through her willingness to share her deepest wounds with the whole world, Princess
    Diana evoked the healer in all of us, opened our hearts, and healed our fractured
    souls.


    The whole world watched as people took their cue from Diana and opened up, sharing
    their grief and their woundedness, just as she had done. She gave the people a
    language of intimacy they could use to express feelings openly and authentically.
    I don’t recall seeing one display of emotion and feeling that was not truly authentic;
    and on television today, that is indeed unusual.


    As we each begin to emerge from behind the pain of loss and the rope burns of
    grief, anger, and projection of guilt regarding our insatiable appetite for Diana’s
    image and curiosity about her life—which the press and paparazzi merely reflected
    for us—we begin to discern, through the mists and veils, the divine perfection
    of it all. The more we contemplate the mission she accepted and the extent to
    which she succeeded, the more we are able to surrender into that perfection.


    We find ourselves experiencing a new level of peace as we move beyond the emotions
    and thoughts that once would have tied us to the World of Humanity forever and
    held us hostage to the victim archetype; we move toward accepting the fact that
    it all had to unfold in exactly that way. The mission absolutely required the
    upbringing she had, the marriage that went terribly wrong, the rejection she suffered
    at the hands of the royal establishment, the criticism by the press, the hounding
    by the paparazzi, the dramatic and violent death—everything, down to the very
    last detail.


    As the future unfolds, you will notice that now that Diana has returned “home,”
    having completed her mission, the energies that held all those dynamics in place
    will begin to disperse. Not only is she released from those dynamics, so are all
    the other people who were involved in the drama we know to be only an illusion.
    Charles is now free to become warmer, less distant, and a more loving father to
    his two boys—and he deoubtedly will. (The press will say that he changed because
    of what happened, but we will know the real truth.) The Queen will probably become
    less stuffy, more open, and not quite so irrelevant. The monarchy itself will
    transcend the cult of personality and will become a stronger, more meaningful
    institution, not as a direct response to what happened but because of the energy
    shift that occurred when the mission was over and the transformation complete.


    But just because someone opens his or her heart chakra, there’s no guarantee that
    he or she will keep it open. That remains a matter of choice at every moment.
    The same is true of the collective. The British people, and others around the
    world, will either stay in the love vibration that Diana’s death catapulted them
    into, and use that power to transform themselves, their royal family, and their
    society, or they will focus on the illusion of what happened, blaming Charles,
    the royal family in general, the driver, the press, and others. If they choose
    the latter, the heart chakra will close.


    # Transforming the Archetype


    ## 11


    ### Transforming the Victim Archetype


    As we saw in the last chapter, our primary mission is to transform the victim
    archetype and raise the consciousness. But what does it mean to transform anything,
    and how does it raise consciousness?


    The first thing to understand is that we can transform something only when we
    choose so as our mission. And we make the decision about our mission not in this
    world but in Divine Truth.


    The second thing to realize is that transforming something does not mean changing
    it. In fact:


    To transform anything we must experience it fully and love it just the way it
    is.


    For example, maybe your individual mission involved being born into an abusive
    family to experience the abuse firsthand and to know it either as a victim or
    as a perpetrator. Remember, once you incarnate, your memory of your agreed-upon
    mission disappears. If you recalled your mission, you would not experience the
    energy and the feelings of victimhood as fully. Only in the experience of being
    victimized can you possibly come to realize what lies behind the illusion of victimhood—the
    projection of self-hatred. If you are able to look beyond the illusion of the
    perpetrator and recognize these actions as a call for love, and if you respond
    with love and complete acceptance, the victim energy is transformed and the consciousness
    of all involved is raised. In addition, the energy that holds the pattern of abuse
    disappears and the behavior stops immediately.


    On the other hand, if we do not recognize the truth in the situation or do not
    see beyond the illusion, and if we try to change the physical circumstances, we
    lock up the energy that holds the pattern of abuse in place and nothing changes.


    ## ONLY LOVE TRANSFORMS


    Only love has the ability to transform energies like child abuse, corporate greed,
    murder, and all the other so-called evils of the world. Nothing else has any impact.

