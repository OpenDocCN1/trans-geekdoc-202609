    比喻性地，我们通过脑海（投影机）运行着一部名为“现实”的电影，并将其投射到“外部”。一旦我们理解到所说的现实只是我们的投影，我们就不再指责他人，而是可以开始为自己用思想所创造的一切承担责任。当我们改变感知，并放下对“屏幕上出现的内容代表现实”这一信念的执着时，我们便体验到了“激进宽恕”（Radical
    Forgiveness）。


    ### 意识决定了发生的一切


    虽然要看出因果律在我们生活中的运作似乎很困难，但当我们从发生的事情回溯源时，这一点就会变得显而易见。换句话说，如果你想知道自己的信念，只需看看正在发生什么；那将告诉你你正在投影什么。例如，如果你不断受到攻击或灾难不断发生，很可能是你相信这个世界本质上是不安全的地方。你正在创造这些事件来证明你对这一点的观点是，而人们通过表现出威胁性或危险的行为来支持你的这种信念。


    我的几个朋友在北卡罗莱纳州的山区里有一座灵性会议中心。维尔纳（Werner）性格谨慎，认为他和他妻子简（Jean）应该购买保险，以保护他们的免受火灾、风暴破坏以及每个季节都会出现的频繁龙卷风的影响。简非常反对这个想法。她觉得购买这种保险会明确向宇宙表明他们不信任自己的安全。现在，我并不是在提倡这样做，但他们决定不购买保险。


    次年，一场巨大的风暴袭击了他们所在地的山山并摧毁了该地区。成千上万棵树被连根拔起。两周后我和妻子开车去探他们时，不敢相信自己的眼睛：那里看起来像一个战场。他们显然被迫砍开一条路才出来。风暴发生时，有
    36 人在中心参加会议，他们整整两天内无法离开。但是，尽管倒了这么多树，却没有一辆汽车或任何一栋建筑受到影响——而它们全都在树林之中。树木倒在建筑和汽车几英寸之遥，但奇迹地没有造成任何破坏。对于我的朋友来说，这是对他们信仰和愿意信任的巨大证明。


    从因果关系的角度来看，简意识到购买保险强化了对逆境的信念（因），并会创造出坏事发生（果）的能量。相反，她选择了这样的思想（因）：“我们在这里是在做上帝的工作，我们绝对安全。”这个想法在世界上显现出的结果是：在混乱之中没有发生任何坏事。


    正如我所说的，如果你想知道自己的信念，看看你生命中拥有什么——或者你缺少什么。例如，如果你在生活中没有爱，并且似乎无法创造出爱的关系，请检查你对自我价值的信念，或者对异性安全感的信念。当然，这可能不像听起来那么容易，因为你所持有的信念可能深埋在你的潜意识中。


    ### 你不需要知道为什么


    好消息是，你不需要知道你为什么创造了这种处境，也不需要知道是什么信念导致了你创造它。只需将处境的存在视为一个换方式感知它的机会——愿意将其视为完美的——就足以引发感知的转变并治愈原始的痛苦了。


    事实是，只要我们处于肉体形式，人类意识中的我们就无法知道为什么或不知道。


    ### 只要臣服


    如果我们参与了导致我们振频率提升的活动和持续方式（例如，通过长期使用“激进宽恕”），我们可能会发现自己成为了“第一因”。


    ### 解脱法则


    重要的是意识到，只要我们还处于肉体形式，因果律就只适用于人类世界。在神圣真理中，没有所谓的业力或结果。只有第一因，那就是上帝。


