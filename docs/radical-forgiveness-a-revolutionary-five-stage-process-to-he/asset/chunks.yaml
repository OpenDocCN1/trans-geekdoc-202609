  trans: '


    当然，与所有使命一样，它看起来可能不像是一次治愈的机会。它可能表现为战争、饥荒，也许是一场自然灾害。但当我们接受这种可能性——即一场集体灵魂疗愈正在进行，且整个过程是由`Spirit`
    为了所有涉及灵魂的更大的利益而安排的——我们便开始以完全不同的视角看待问题。让我给你们举几个似乎不可理喻的例子。


    | 序号 | 描述 |

    | :--- | :--- |

    | 1 | 假设转世成为阿道夫·希特勒的灵魂其使命是为了转化犹太人种的受害者意识和德国人种的优越意识。 |

    | 2 | 如果萨达姆·侯赛因转世是为了帮助美国意识转化其对奴隶以及对同胞极度虐待的罪恶感呢？（参阅我的书`A Radical Incarnation`，书中探讨了这种可能性。）
    |

    | 3 | 假设斯洛博丹·米洛舍维奇转世是为了让美国能够将其对美印第安人实施的种族灭绝所产生的自我仇恨投射在他身上。 |

    | 4 | 如果中国政府必须入侵西藏，以便让达赖喇嘛被迫环游世界并在国界之外传播他美好的信息呢？ |

    | 5 | 假设转世为戴安娜公主的灵魂选择了以她完全那样的的方式去世，而她去世时，是为了开启英国的心轮轮。 |


    在这本书的第一版中，戴安娜公主的故事出现在`Epilogue`（结语）。那是因为在我送付印刷前没几天就去世了，所以它几乎是作为事后补进去的。在这个新版中，我将它放在这一章中，因为它与“使命”这个问题非常相关。


    当我第一次写关于戴安娜去世的文章时，那次事件在我脑海中依然新鲜。葬礼刚刚举行，情感的宣泄仍在继续。我仍然深地沉浸在这一切经历中，我想这种感受在文中得到了体现。出于这个原因，我决定不对原始版本进行任何修改，以便你们能够通过我的经历来感同地体验到那种`satori`（顿悟）。


    ## 再见，英国的玫瑰


    我用一个关于我姐姐 Jill 的故事开启了这本书。它的目的是为了说明，当我们从`激进宽恕`（Radical Forgiveness）的角度来看问题时，一个看似绝望的境地是如何被转化的。


    在送付印刷前几天，命运给了我一个机会，让我用一个同样具有启发性且符合`激进宽恕`视角的故事结束这本书。与关于 Jill 的故事不同，这个故事是世界上几乎每个人都熟悉的，而且在情感上深度参与其中的。我说的无疑是戴安娜公主的故事，她在
    1997 年 8 月 31 日周日凌晨完成了她那意料之外的转世。


    对我来说，戏剧开始于我的终生朋友 Peter Jollyman 从英国打来电话叫醒我。对他来说，那里是中午左右，但对我所在的亚特兰大来说，还是清晨，我还没看报报纸，也没有听广播。


    “你听说了事故吗？”他问。


    “什么事故？”我回答，虽然还处于神昏状态，但足以意识到如果他打电话过来，事情一定很严重。


    “戴安娜公主昨晚在巴黎的一场车祸中去世了。她当时被狗仔记者追赶。她的车失控撞上了一根混凝土柱。她和迪迪遇难了。”


    当我听他叙述当时所知的细节时，我注意到内心掠过一丝敷衍的愧疚，但我不能说这种感觉持续了超过几分钟。我试着让自己听起来很很震惊，但我心里对此其实感到有些矛盾。


    挂掉电话后，我想，过去的二十四小时里死去了很多人。为什么她的死就比其他人的死更悲剧，或者更不那么悲剧呢？那是她离开的时候，大抵仅此而已。不过，当然为她的两个儿子感到很难过。说完，我下楼去泡茶并准备早餐。


    然后我打开了电视，从那一刻起，我逐渐被卷入并参与了在通往周六早晨葬礼的这几天里，演变成的一场情感过山车。


    随着时间的推移，我意识到发生了一些非常非凡的事情。人们对戴安娜公主去世的反应，不仅在英国，而且全世界范围内简直是现象级的。当我看到电视里的我的同胞们感到心切的痛苦，在公共场合哭泣哀悼——这可是英国人通常不会做的——我发现自己也感受到了同样的情绪，并和他们一起哭泣。我震惊地意识到我也受伤了。不知为何，这个我从未见过也未怎么想过这个女人（特别是在我住在美国的十三年里），她深深地触动了我。我深切地感受到了失去，并感到非常惊讶。


    我开始关注并思考这里到底发生了什么。某些具有极深意义的事情正在发生，我开始在内心寻找，以找到其中的信息和意义。戴安娜的死显然意义远超她发生的表面情况，尽管这些看起来充满戏剧性。我想，某种更高的目标正在这里上演。


    然后，周三，我恍然醒了。当我看着英国的画面，经历着那些本不以表达情感而闻名的人们（尤其是在公开场合）爆发出的巨大情感波动时，我突然意识到戴安娜的精神使命是什么。她转世的核心目的是开启大英帝国的心轮，并借此极大地加速了英国人的精神演化。我毫不怀疑她完全实现了这一点。


    任何目睹那周事件的人都不可能怀疑她单凭之力在心灵层面转化了整个国家——事实上是转化了世界的很大一部分。在整个历史上，只有极少数人能纯粹通过爱能量的表达对世界产生这样的影响：也许是`甘地`、`马丁·路德·金
    Jr.`和`尼尔逊·曼德拉`；无疑还有`德修修`和`耶稣基督`。（难怪英国女王向戴安娜的棺低了头——这是前所未有的景象。）


    虽然在人类成就和精神榜样方面，任何与`德修修`的比较都是不公平的。尽管值得注意的是，德修修的去世（在大多数人眼中，她的生平事业让她生前就接近了圣人）甚至没有让戴安娜失去焦点。两个通过真挚之爱深深触动世界的女性，在短短几天内完成了转世，这具有巨大的精神意义。


    尽管英国人在本世纪已经经历了两次战争，遭受了巨大的痛苦并哀悼了巨大的损失，但他们凭借他们传奇般的幽默感和著名的“坚毅”挺过了一切——但我觉得这样说并不公平，并不是带着敞开的心。那不仅要等待一位人民公主的到来，还要等待她那被神安排的、至少对我们而言过早且悲剧的死亡。


