    无论如何，与自我所让我们相信的相反，事实是，我们实际上是带着上帝的祝福和祂无条件的爱来到物理世界的。上帝始终会在最高层面尊重我们的自由意志和选择，并且不会提供神圣干预——除非我们请求。


    幸运的是，“激进宽恕”（Radical Forgiveness）为请求这种协助提供了完美的工具，因为在这个过程中，你向上帝证明了你已经超越了自我，洞察了真理：只有爱是真实的，我们都与上帝合为一体，包括那些最初看起来是我们的敌人的人。


    ## 2. 作为爱心引导者的自我


    另一种更友好的看待自我的方式——我觉得这种观点同样合理，而且坦率地说，更有吸引力——这种观点认为，自我远非我们的敌人，而是我们灵魂的一部分，在人类世界中充当我们的引导者。它的作用是在我们一生中提供机会，充分测试我们履行在投胎前精心计划的任务的能力，而这项任务的首要目的是体验某种约定的程度的分离。当我们达到了自己所约定的疏离程度时，觉醒的过程就开始了。那时，我们可能就会发现“激进宽恕”。


    （顺便说一下，我内心深信，仅仅由于你拿起了这本书并读到这里而没有把它扔在墙上，你就已经达到了觉醒点，或者已经在那点之后不远处。这并不意味着你一直都是完全清醒的——很少有人能做到这一点——而是意味着你至少开始看到什么是真实的，并记起了真理。）


    （关于关于我们自愿体验分离之痛苦的整个想法——以及当我们达到了约定的痛苦额度后开始觉醒过程的完整且详细解释，请参阅我的书籍《骑着哈利上天堂》（*Getting
    to Heaven on a Harley*）。）


    拥有人类体验的唯一价值，恰恰在于经历自我所提供的事情：对二元性、分离感、痛苦和苦难、内疚和恐惧的信念。我们的自我通过创造被遗弃、背叛、虐待、拒绝、离婚、身体疾病、残疾等经历，给了我们化身这些感受的机会。（图
    6）


    ![](img/part2_chapter6_image002.jpg)


    图 6：灵魂的旅程


    因此，在模型中，我们的自我是引导我们进入所有这些关于分离、痛苦和不适的兴奋旅程的引导者。它这样做并非出于恶意，也不是为了自身的生存（正如许多精神导师所坚持的那样），而是因为爱我们，并知道我们的精神成长需要这些经历。


    高我（Higher Self）是我们的另一个引导者，它在我们跟随自我进入幻象旅程时耐心地等待，直到我们准备好觉醒。正是通过高我的温柔低语，我们一点点地醒来，直到我们最终想起自己是谁。通常在我们生命中的这个时刻，我们会转变方向，对物质事物的关注减少，而对他人的服务产生更大的兴趣。


    我邀请你同时考虑这两个定义都是正确的。我的感觉是，第一种定义在解释我们最初降临物理形态以及我们如何事后（错误地）看待这一事件方面是真实的，但第二种植根于更深层次的真理——即，我们需要自我来帮助我们完成使命。


    也许它们是两种不同的东西；我不知道。这并不重要。每种定义都能帮助我从精神真理的角度理解这种人类体验，我相信它们对你同样如此。


    ## 7. 躲藏处与替罪羊


    理解压抑和投射这两个双生的心理自我防御机制在我们治愈关系中所扮演的作用，对于“激进宽恕”的概念至关重要。仔细检查每种机制机制可能有所帮助。


    压抑和投射共同运作，对我们的关系和生活造成破坏。它们共同创造并维持了受害者原型。理解它们的运作方式使我们能够反击自我利用这些机制让我们彼此以及与上帝分离。


    ### 压抑（REPRESSION）


    压抑作为一种正常的心理防御机制，发生于恐惧、内疚或愤怒等感受变得如此压倒，以至于大脑将它们完全阻隔在意识之外。这使得压抑成为了一种强大的心理安全装置，因为如果没有这种屏蔽机制，我们很容易疯掉。它的运作是如此有效的，以至于对这些感受或导致这些感受的事件完全没有任何记忆。它可能被从意识中完全阻隔几天、几周或几年——有时甚至持续一终生。


    ### 抑制（Suppression）


    压抑不应与另一种相似但程度较轻的防御机制混淆。当我们`意识地`拒绝承认我们不想感受或表达的情绪时，就会发生抑制。尽管我们知道它们就在那里，但我们试图推开或压抑它们，并拒绝处理它们。但长时间的持续否可能导致等同于被压抑的麻木。


    ### 被压抑的内疚与羞愧（Repressed Guilt and Shame）


    内疚和羞愧不是一样。当我们觉得`做`了错时，我们会感到内疚。羞愧将我们带到一个深得多的内疚层面，在那里我们感到自己实际上`是`错了。通过羞愧，自我让我们在存在的核心处感到与生是错误的——这种感受最可靠地将我们与每个人每物隔离开来。这种羞愧可能是如此强烈，以至于我们别无选择只能压抑它：否则我们无法承受。


    ### 羞愧阻碍能量（Shame Blocks Energy）


    年的孩子很容易被羞辱，例如，当他们尿裤、勃起、表现出愤怒、害羞等时。虽然这些可能是自然发生的情况，但孩子们仍然会感到羞愧，这种感受的累积影响可能会变得无法忍受。因此，他们压抑了羞愧，但它仍然留在潜意识中和身体中。它在细胞层面被锁定在系统中，并在身体中形成了能量阻塞。如果留得太久而不解决，这种阻塞就会导致精神/情绪问题、身体问题，或两者兼有。许多研究人员现在认为被压抑的情绪是癌症的主要原因之一。


    ### 被压抑的感受（Repressed Feelings）


    巨大的创伤（如父母的去世）可能会导致孩子压抑情绪。同样，看似微不足道的事情，如被解读为有意义的随口批评，或者一个被错误认为是孩子之错的事件，都会导致情绪被压抑。例如，孩子们几乎总是将离婚归于自己的错。研究表明，孩子能记得父母在他们子宫内时进行的对话，因此关于出生前非意外怀孕的讨论可能导致孩子感到不受欢迎并害怕被遗弃。这种感受会在孩子生命的如此早期阶段被压抑。


    ### 代际内疚（Generational Guilt）


    群体甚至国家通常会压抑积累的代际内疚。无疑，现在美国黑人和白人在奴隶制问题上就是如此。我们现在在美国所经历的所有种族问题都源于白人内心未解决和被压抑的内疚，以及黑人未解决和被压抑的愤怒。


    在我的工作坊中，我发现人们携带的许多痛苦并不是他们自己的，可能追溯到几代以前。最常见的是他们承担了父母的痛苦，但也可能是祖父母或兄弟姐妹的。当我们是孩子时，我们的能量比成年时更纯洁、更不破碎，因此孩子能够承受受伤成年人无法承受的痛苦。但孩子忘记了还回去，并让它变成了他们自己的。


