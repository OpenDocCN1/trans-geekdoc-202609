    accordance with divine guidance and spiritual law. I acknowledge my Oneness and
    feel myself totally reconnected with my Source. I am restored to my true nature,
    which is love, and I now restore love to *Jeff.* I close my eyes in order to feel
    the love that flows in my life and to feel the joy that comes when the love is
    felt and expressed.


