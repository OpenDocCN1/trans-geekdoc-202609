    \ cannot feel resentment, because resentment only lives in the past. Neither can\
    \ we feel fear, because fear only exists in relation to the future. We find ourselves,\
    \ therefore, with the opportunity to be in present time and in the space of love,\
    \ acceptance, and Radical Forgiveness.\n\nSome of the tools included in this section\
    \ are more appropriate for use at the very moment when a situation requiring forgiveness\
    \ occurs. They help to jerk us into an awareness of what may be happening before\
    \ we get drawn too deeply into a drama and go to Victimland. When our buttons\
    \ get pushed, we easily move straight into the defense/attack cycle. Once in this\
    \ cycle, we find it tough to get out. Using these quick tools helps us to avoid\
    \ ever beginning the cycle. The Four Steps to Forgiveness process (see Chapter\
    \ 22) is one of these. It is easy to remember, and you can say it to yourself\
    \ in the moment.\n\nOther tools described in the following chapters are designed\
    \ for use when we are in a more reflective state of mind. The Radical Forgiveness\
    \ worksheet works wonders in this regard. Use them all as an act of faith in the\
    \ beginning. The payoff will prove incredible in time. Consistent use of these\
    \ tools helps us to find a peace we may never have known was even possible.\n\n\
    ## \n\n# \n\n#### 19\n\n### Feeling the Pain\n\nFeeling the feelings is the second\
    \ stage in the forgiveness process, and it usually arises as a consequence of\
    \ telling the story. This step requires that we give ourselves permission to feel\
    \ the feelings we have around a given situation—and to feel them fully. If we\
    \ try to forgive using a purely mental process—thus denying that we feel angry,\
    \ sad, or depressed, for example—nothing happens. I have met many people, especially\
    \ those who think of themselves as spiritual, who feel that feelings are to be\
    \ denied and given over to Spirit. That’s known as a “spiritual bypass.”\n\nIn\
    \ 1994, I agreed to do a workshop in England. This was ten years after I had immigrated\
    \ to America, and I had quite forgotten the extent to which English people resist\
    \ feeling their feelings."
