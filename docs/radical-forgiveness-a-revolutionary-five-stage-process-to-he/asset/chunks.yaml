    At first blush, this seems a fatalistic viewpoint, but this is not just fate.
    In truth, the divine plan allows for a great deal of creativity and flexibility
    and continues to honor the principle of free will. We continue to co-create with
    Spirit the circumstances of our lives and, without exception, to get precisely
    what we want. The extent to which we resist (judge) what we get determines whether
    we experience life as painful or joyful.


    Mastery of the life experience, then, relies on our entering life fully and trusting
    that we are taken care of and supported all the time, no matter what. Radical
    Forgiveness moves us in that direction.


    **Assumption:** Physical reality is an illusion created by our five senses. Matter
    consists of interrelating energy fields vibrating at different frequencies.


    Most people have a difficult time coming to grips with the idea that our physical
    reality is an illusion created by our senses. Ken Carey confirms the difficulty
    we have grasping this concept. In his book *The Starseed Transmissions,* which
    was a channeled work, the souls “talking through him” made an interesting observation.[3]
    They said that when they got inside Carey’s body and experienced all his senses,
    they were simply amazed. Only then did they understand why human beings felt the
    physical world was real. Our senses make the illusion so convincing that even
    these disincarnate souls appreciated why we would have great difficulty getting
    beyond it. Indeed, it is difficult to remember that the physical world is simply
    an illusion.


    However, we are beginning to move in a direction that fosters that memory. Recently,
    scientists have begun talking about the human body in terms of a mind/body continuum.
    Such terminology gives us the sense that our bodies are, indeed, more than cells,
    molecules, and atoms. Energy science tells us that, in reality, our bodies are
    dense condensations of interrelating energy fields and that, just like a hologram,
    all matter consists of energy vibrating in certain patterns. Holograms are those
    seemingly real, three-dimensional images created by laser beams. Quantum physicists
    have theorized that the entire universe is a hologram and everything in it, including
    each one of us, is a hologram as well.


    Some energy fields vibrate at frequencies that enable them to be observed and
    measured. They can be given physical qualities like weight, volume, hardness,
    and fluidity. We give such energy patterns names like wood, steel, leather, or
    whisky. Everything physical simply represents energy vibrating at a rate we can
    detect with our five senses.


    Yet this concept seems strange to us. We have developed such faith in our five
    senses to detect the physical world around us that we have difficulty imagining
    that our bodies consist of more than just what we can see and feel. But in a very
    real sense, the physical world is an illusion *created* by our senses.


    Consider for a moment one of the metal beams holding up a building. It looks solid
    enough, and our senses of touch and sight tell us that it is solid, as well as
    strong and heavy. But we also know that this beam is composed entirely of atoms
    and, furthermore, that each atom is composed of a nucleus of protons and neutrons
    around which orbits, at ultra-high speed, one or more electrons.


    To get a feel for the spatial relationship between the nucleus and the electron,
    imagine a basketball sitting in the middle of a football stadium. Now imagine
    an object the size of a golf ball orbiting the basketball at several thousand
    miles per hour and describing a circle with a diameter as large as the stadium.
    This gives us a rough picture of the kind of size difference we are talking about
    between an electron and a nucleus, and the immense space between them.


    From this, we can say that an atom is composed of somewhere around 99.99 percent
    space. Since matter is composed entirely of atoms, matter must be composed of
    99.99 percent space. Thus, the aforementioned metal beam is 99.99 percent space.
    You are 99.99 percent space as well.


    The beam looks dense for the same reason that an electric fan when running looks
    solid. When such a fan is not rotating you can see the spaces between the blades,
    and you can put your hand through those spaces. When the blades spin very fast,
    you can no longer see the spaces. And if you try to put your hand between the
    blades, they will feel like an impenetrable wall. Like a fan’s blades, any piece
    of physical material is made up of a mass of electrons spinning so fast that they
    appear solid to our senses.


    If the electrons in the beam holding up the building were to stop spinning, the
    beam would disappear in an instant. If all the other electrons around it stopped
    spinning too, we could imagine the whole building disappearing. No debris would
    be left, no dust, nothing. To a viewer, it would appear that the building had
    simply evaporated.


    Matter is simply vibration—nothing more, nothing less. Our senses are tuned to
    these vibrations, and our minds convert them into matter. Sounds weird, but it’s
    true.


    **Assumption:** We have subtle bodies as well as physical bodies. The physical
    body vibrates at the frequency of matter (the World of Humanity), while the highest
    two of the five subtle bodies vibrate closer to the frequency of the soul (the
    World of Divine Truth).


    Besides the flesh and bone of our physical bodies, we consist of other energy
    patterns we cannot see or measure. These are called our subtle bodies or subtle
    fields. They vibrate at frequencies an octave or two higher than those bodies
    condensed as matter and are beyond the range of our senses and most detection
    instrumentation. These are:


    ### The Etheric Body


    The etheric body carries the energetic template of the body. It ensures the continuation
    of the patterns, harmonies, and disharmonies within the body while the body constantly
    renews itself. Your body is not the same as it was a year ago, for not one cell
    exists in your body that is more than one year old.


    The etheric body interacts with your genetic code and holds the memory of who
    you are, the shape of your nose, your height, what prejudices you hold, what you
    like to eat, your strengths, your weakness, your illness patterns, and so on.


    ### The Emotional Body


    The emotional body vibrates one octave above the etheric field. Also known as
    the astral body, it suffuses the etheric field and the bioenergetic fields of
    the physical body and manifests in the body as feelings.


    An emotion constitutes a thought attached to a feeling that usually results in
    a physical response or action. When energy flows freely from the emotional field
    through the etheric field and the physical body, everything works together beautifully.


    When we restrict our emotional energy through suppression or repression, we create
    energy blocks in both our etheric and emotional fields as well as in our physical
    body.


    The perceptual shift required for forgiveness cannot happen while anger and resentment
    are maintained in the emotional body. Any energy stuck in the emotional body must
    be cleared first.


    ### The Mental Body


    This field governs our intellectual functioning and is responsible for memory,
    rational thinking, concrete thought, and so on. Of course, there are scientists
    who still maintain that thinking and other mental processing can be explained
    in terms of brain biochemistry. Suffice it to say that the scientists who follow
    the logic of quantum physics believe that the mind goes beyond the brain, beyond
    even the body. They believe that brain and mind interact *holographically* and
    that each cell contains a blueprint of the whole. Many researchers believe that
    memory resides in holographic form in an energetic field that exists beyond the
    body.

