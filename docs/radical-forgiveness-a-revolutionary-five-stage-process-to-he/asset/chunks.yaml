    To put this whole discussion in perspective, we must also keep in mind that, since
    the physical world is actually an illusion, what we experience as earth changes
    will be illusionary too. This explains why a change in human consciousness can
    change the situation immediately. The way we experience earth changes depends
    upon our perception of what is happening. If we see them as a purification of
    consciousness and a healing crisis that will result in a spiritual transformation,
    our experience of them will be in stark contrast to what we will feel if we take
    the victim position and think of them as real, as things to be feared, and as
    a punishment for our rank stupidity. A Radical Forgiveness perspective will enable
    us to stay focused on the perfection of what is happening in the moment and will
    carry us through to the joy and peace on the other side of the experience.


    ### The Gift


    The adage “as above, so below” is meaningful, too, in terms of how we respond
    to both the cancer in our bodies and the cancer on the planet. Waging “war” on
    cancer with toxic drugs and other violent treatment will never bring about a cure
    for cancer. Violent, high-tech, politically motivated solutions to the earth’s
    problems won’t work either. The only thing that will work, in both cases, is love.
    When we really comprehend this, we will have understood the gift of both earth
    changes and cancer.


    No lesson is more crucial than this one. People with cancer are brave souls who
    have come to the physical plane with a mission to demonstrate the futility of
    projecting anger and war on the body and on ourselves. Their mission is to help
    us understand that the only answer to any situation is love. Our gift in return
    is to hear their loving message.


    ### Visions of Joy, Harmony, and Peace


    Whether or not we raise our vibration sufficiently to prevent trauma and come
    into loving resonance with all of life voluntarily, the end result will ultimately
    be the same. All the predictions about earth changes speak of a breakthrough in
    consciousness happening in the wake of the earth cleansing itself and balancing
    the karma we have created.


    A vision of life after the earth changes as wonderfully harmonious, peaceful,
    and idyllic, in stark contrast to the way it is today, is a common theme running
    through many of the predictions. As in all healing opportunities, we can heal
    our soul pain at the first sign of the repressed pain occurring, or we can wait
    until a disaster wakes us. However the earth changes occur and at whatever level
    of destruction the planetary karma plays out, the changes will constitute the
    ultimate healing crisis for the planet and for all of us. That will certainly
    be in divine order.


    Raising our vibration enough to change the predictions must include living our
    lives based on love and gentle acceptance of ourselves and others and forgiving
    ourselves for abusing the planet. It must include joining in prayer for peace,
    with as many people as possible from around the world involved, and embracing
    Radical Forgiveness as nothing less than a permanent way of life.


    ## Part Three


    # Assumptions Expanded


    ## 15


    ### Articles of Faith


    The assumptions listed in Chapter 2 were made briefly, to give you just enough
    of an understanding of them to comprehend the theory of Radical Forgiveness. Now
    I would like to discuss in greater depth the assumptions underlying Radical Forgiveness
    that have not yet been comprehensively discussed. I hope this will help you find
    a level of comfort with them, even if you cannot entirely accept them.


    Remember, all theories are based upon assumptions, but not all assumptions are
    proven with evidence of their validity. This holds especially true for theories
    and assumptions pertaining to the nature of reality and spiritual issues.


    Interestingly, science and mysticism have come to a new level of agreement about
    the nature of reality and other spiritual questions that until now have seemed
    beyond the reach of science. For centuries, Hindu mystics have claimed to possess
    a “direct knowing” of these universal truths, which they assert they have arrived
    at as a result of forty years of meditating in Himalayan caves. By using rigorous
    scientific methods and theoretical constructs, scientists have recently arrived
    at the same truths—or, should we say, have made similar assumptions. It is now
    safe to say that quantum physics actually demonstrates the truth of what the mystics
    have known for centuries. How exciting it is to see a joining of these two distinct
    ways of approaching and arriving at truth. Science and spirituality have come
    together at last, with scientists becoming modern-day mystics!


    Yet in spite of the progress we have made, in all humility we must continue to
    keep in mind that these assumptions, by their very nature, do not represent the
    whole truth. The great mysteries of how the universe works and of the higher purpose
    of human life still lie beyond mere mortal understanding, and the assumptions
    we make are mere approximations of what might be the truth. On this basis, therefore,
    the following assumptions are given as the foundation for Radical Forgiveness.


    **Assumption:** Contrary to most Western religious thought, we are not human beings
    having an occasional spiritual experience. Rather, we are spiritual beings having
    a human experience.


    This is not just a play on words. It represents a fundamental shift in our thinking
    about who we are and our relationship with God. Instead of thinking of ourselves
    as fallen and separated from God, it suggests that we are still very much connected
    to the All That Is, and that life in a physical body is just a temporary interlude
    taken for the purpose of learning and balancing energy. It also suggests that
    God lives within each of us rather than “up there”, highlighting our dual man/spirit
    nature. Pulitzer Prize-winner Ernst Becker explained this vividly by saying, “Man
    is a God who shits.”[2]


    **Assumption:** We have physical bodies that die, but we are immortal.


    For centuries philosophers have debated the makeup of the “soul.” This discussion
    predates even Plato and Socrates, both of whom had much to say about the soul
    but remained very much at odds on the subject. Today, the debate continues, with
    little agreement on what constitutes the soul.


    For the purposes of this discussion, however, the soul is defined as the part
    of us that is pure consciousness connected to the greater ocean of consciousness
    that forms the All That Is. For the purposes of our incarnation, the soul takes
    on an individual characteristic that can be likened to a single droplet of that
    same ocean or a little bit of God Stuff. Since we are a part of the ocean of the
    All That Is, we have always existed as a soul. The soul has no beginning and no
    end, exists outside of both time and space, and is immortal. During our incarnation,
    the soul keeps us connected to the World of Divine Truth and the All That Is and
    is responsible for our spiritual evolution.


    Once the soul incarnates, it becomes attached to both a body and a personality,
    which together represent a “persona” or identity. This we create for ourselves
    based on our own self-concept, which we present to the world at large. Thus our
    soul becomes subject to the stresses of human existence and can even become sick.
    A great many of the sicknesses of today, such as cancer, begin as a deep sickness
    of the soul. Shamans speak of the soul becoming fractured and splintered, parts
    of it actually being left behind and lost in past events, especially traumas.
    A great deal of a shaman’s healing work revolves around the idea of soul retrieval.

