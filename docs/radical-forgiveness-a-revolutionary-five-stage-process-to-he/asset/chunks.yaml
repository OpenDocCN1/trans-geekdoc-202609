    这个人实际上并不是什么反派，他而是德比（Debi）的治愈天使。尽管这让他感到非常不适——毕竟谁会喜欢做一个刻薄的坏蛋呢？——但他为德比演绎了她的故事。不幸的是，她当时错过了那中的教训，仅仅将其视为一个扩大她那个“我不够好”故事的机会，并证明了它是正确的。


    十三年后，她进行了一个名为`13 Steps to Radical Forgiveness`（激进原谅十三步）的简单过程。结果，她看到了真相——他是在为她提供一个治愈的机会，而他实际上是她的治愈者。能量立即开始流动，金钱几乎瞬间就向她流来。（金钱只是能量。）


    德比从培训回来几天后，她遇到了这个男人。他特意走过去对她说：“你知道吗，德比，我从未感谢你多年前为我所做的一切，尤其是你为我做那个第一个广告的时候。你帮了我一把，而且很奏效。我非常感激。谢谢你。”他还是没有给她钱，但这并不重要。她从他那里获得的是她之前无法接受的认可。那是最后的治愈时刻。


    从那时起，德比已经走向了自己的力量中心。她不再通过做匿名工作室工作来隐藏自己的才华，而是开始举办演唱并录制自己的 CD。她甚至建立了自己的制作公司。所有那些关于“我不够好”的老观念完全消失了，她正在活出自己的使命。


    我总是向人们讲述德比的故事，以让人们相信这些看似简单的工具的力量，并鼓励人们使用它们，我很感谢她允许我这样做。


    注：一旦我意识到`Radical Forgiveness`（激进原谅）工作表具有让人们产生转变的力量，我很好奇它的效果是否与音频体验一样有效。为了找到答案，我设计了十三个与工作表上类似的问题，并将它们录制在一张
    CD 上。在回想起故事并感受那些情感后，听者只需要对随后的每一个问题大声回答“是”。


    我相信，当大声读出问题时，`Radical Forgiveness`过程的效力会提高。口头回答是重要的，因为身体感受到了“是”这个字的共鸣，它会进入深层。无数人已经证实了它的有效性。这并不是一种催眠体验，所以很多人把它放在车里，在开车时听。


    要获取这张名为`Radical Forgiveness`的 CD 副本，请参见名为“Also from Sound True and Collin Tipping”的部分。


    # 17


    ## 激进原谅的五个阶段


    无论激进原谅的技术采取什么形式，无论是工作坊、`13 Steps`（十三步）、`Radical Forgiveness`工作表还是仪式，每一项设计都是为了引导你通过激进原谅的五个基本阶段。这些阶段是：


    ### 1. 讲述故事


    在这一步中，有人自愿且充满慈悲地倾听我们讲述故事，并尊重其为我们那个刻的真实。（如果你在做工作表，这个人可能就是你自己。）


    让我们的故事被听到并见证是放下它的第一步。正如释放受害者心态的第一步是完全拥有它一样，我们也必须从受害者的角度完整地拥有有我们的故事，并避免在此阶段进行任何精神上的解释。


    在这里，我们必须从我们所在的地方（或者如果我们回到过去治愈某些事情，则是回到过去）开始，这样我们才能感受到最初导致能量阻塞的痛苦。


    ### 2. 感受情绪


    这是许多所谓的灵性人士想要跳过的关键步骤，他们认为自己不应该有“负面”情绪。这纯粹是否认，而且它错过了一个关键点：真正的力量存在于我们充分感受情绪的能力，并以这种方式展现出完整的人性。只有当我们允许自己接触痛苦时，治愈才开始。治愈之旅本质上是一场情感之旅。但它也不一定全是痛苦。令人惊讶的是，当我们深入情绪的层级并允许自己感受真实的痛苦时，它可以迅速转化为平静、喜悦和感激。


    ### 3. 瓦解故事


    这一步审了我们的故事是如何开始的，以及我们对事件的解释如何导致脑海中形成某些（虚假的）信念，这些信念决定了我们如何看待自己以及我们如何生活。当我们看到这些故事在很大程度上是不真实的，并且只是为了让我们受困在受害者原型中时，我们就获得了力量，选择停止为它们提供我们至关重要的生命力能量。一旦我们决定收回能量，我们就夺回了主权，故事就会枯萎凋零。


    在这一步，我们还可能对正在原谅的人表现出高度的慈悲，并对生活的常态以及我们所有人是多么不完美给出一些直接、诚恳的理解——并意识到我们都在根据所拥有的尽尽所能。这其中的很大一部分我们可能将其归类为传统的原谅，但作为第一步和现实检查，它仍然是重要的。毕竟，我们大多数的故事都起源于童年早期，那时我们想象整个世界都围绕着我们转转，一切都是我们的错。


    所以，这就是我们可以放弃那种以孩子为中心的受伤感的地方。在这里，我们可以运用成人的视角，用关于真实发生或没有发生什么的平白事实来面对我们的内在小孩，这与我们对所认为发生的事情的解释区分开来。一旦我们允许光照进来，我们的许多故事看起来是多么荒谬，真是令人惊讶。但这一步的真正价值在于释放对故事的执着，以便我们能更容易地开始下一步所需的转变。


    ### 4. 重构故事


    在这一步，我们允许自己转换感知，使我们不再将情境看作一场悲剧，而是愿意看到它实际上正是我们想要经历的，并且对我们的成长至关重要。从这个意义上说，它是完美的。有时我们能够立即看到完美性并立即学习教训。但大多数情况下，这关乎于放弃弄清楚它的需要，顺服于这样一个观点：礼物包含在情境之中，无论我们是否知道。正是在那种顺服的行为中，真正的爱的课程被学会了，礼物被接收。这也是转变的步骤，因为当我们开始开放并看到所发生之事的完美完美时，我们曾经作为愤怒、痛苦和怨恨载体的受害者故事，将转化为欣赏、感激和爱的接纳故事。


    ### 整合我们需要在细胞层面整合这种变化，使其成为我们的一部分。这就像将你在电脑上做的内容保存到硬盘上。只有这样，它才会变成永久。


    在我的工作坊中，我发现`Satori Breathwork`（觉悟呼吸法）是整合变化的一种非常好方法，无论是在工作坊期间还是不久之后进行的。这包括躺下并随着响音乐有意识地进行循环呼吸（见第
    27 章）。


