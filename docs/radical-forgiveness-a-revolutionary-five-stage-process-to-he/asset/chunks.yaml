    it is not your step to take. You affirm that you are willing to experience it
    and turn the remainder of the process over to your higher power. Ask that the
    healing be completed by divine grace and that you and X be restored to your true
    nature, which is love, and reconnected to your Source, which is also love.


    This final step offers you the opportunity to drop the words, the thoughts, and
    the concepts and to actually feel the love. When you reach the bottom line, only
    love exists. If you can truly tap into that love, you are home free. You need
    do nothing else.


    So, take a few minutes to meditate on this statement and be open to feeling the
    love. You may have to try this exercise many times before you feel it, but one
    day, just when you least expect it, the love and the joy will envelop you.


    19. A Note of Appreciation and Gratitude to You *Jeff.* Having done this worksheet,
