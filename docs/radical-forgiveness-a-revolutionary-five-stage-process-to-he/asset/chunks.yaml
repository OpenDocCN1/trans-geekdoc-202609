    从化身之前的神圣真理世界来看，这项任务似乎很简单。但一旦我们投胎出生，难度就增加到了一个新的水平。这不仅是因为人类世界的能量密度更大，而且是因为这项任务必须在完全不意识到我们已经选择了这种经历的情况下完成。如果我们知道（记得）关于我们目的的真相，那么这种经历将毫无意义。如果我们从没有忘记过自己是谁，又怎么能记起自己是谁呢？因此，灵魂以这种方式创造了人类体验：使我们进入肉体时，丧失对任务的所有记忆，以及对物理层面的生活实际上是一场安排的所有觉知。


    为了完成我们的任务（转化能量），我们必须对这些能量有完整的体验。例如，要转化“受害者””的能量，我们必须感到完全被受害。要转化恐惧的能量，我们必须感到被恐吓。要转化憎恨的能量，我们必须被仇恨吞噬。换句话说，我们必须完全投入到做人的体验中。只有当我们充分感受了与这些能量有关的情绪时，我们才获得了完全宽恕它们的能力。而正是通过宽恕它们，我们才想起了自己是谁。


    从这个观点来看，我们显然永远没有审判任何人的立场。一个看起来充满仇恨的人可能选择了转化那种能量作为他的任务。因此，他的憎恨行为尽管看起来伤害了他人（他人可能为了自己的任务而自愿接受仇恨投射），既不是对也不是错。他的憎恨行为仅仅代表了转化憎恨能量需要发生的事情。此为止。


    当一个感到被憎恨的人看到憎恨之下的爱，并原谅恨他的人时，憎恨能量就被转化了。在那一，心敞开了，爱在两人之间流动。因此，憎恨转化为爱。觉醒源于所有形式分离能量的持续转化过程。


    #### 珍妮的故事


    患有癌症的珍妮参加了我早期的一个癌症静修营，但肿瘤并不是唯一侵蚀着她的东西。她对二十三岁的女儿梅兰妮（Melanie）感到的愤怒也在做同样的事情。


    据各种说明，梅兰妮表现出相当强烈的反叛行为。她对珍妮和珍妮的新丈夫吉姆（Jim）语言虐待，并且随了一个相当不靠谱的男人。“我恨死她了，”珍妮回忆道，“她对我和吉姆的行为简直是不可理喻，我再也受不了了。我真的很恨她。”


    我们进一步挖掘了珍妮的个人历史，发现珍妮和她母亲之间也存在过类似的关系。这不像与梅兰妮之间的冲突那样清晰和戏剧，但动态是相似的。珍妮怨恨母亲控制她并试图主导她的生活。尽管，她并没有像梅兰妮那样反叛。相反，她对母亲变得退缩而冷淡。


    我们开始探索与梅兰妮的动态如何反映了她灵魂帮助珍妮治愈与母亲之间问题的意愿，但珍妮并不愿意看到这一点。她太愤怒了，听不进任何与她的感受不符的话。因此，我们让她进入愤怒，通过用网球拍打垫子和尖叫来感受并表达愤怒。（愤怒通过身体动作和声音的使用有效地释放。）尽管她释放了一些对母亲的愤怒，但对梅兰妮的愤怒依然存在。


    #### 珍妮的开悟


    那天晚的静修课程留给了“悟呼吸”。为了体验悟呼吸并将其用于治愈，小组中的每个人都躺在地上，在听着响音乐的同时，有意识且有力地呼吸大约一小时。（参见第 27
    章。）虽然这听起来可能很奇怪，但这种呼吸方式通常会导致情绪释放、洞察以及细胞层面的改变整合。那天晚上，珍妮获得了她的`satori—`——她的“觉醒”。


    呼吸练习结束后，人们开始分享他们在练习期间发生的事情。珍妮一开始分享，我们就知道发生了重要的事情。她的声音变得轻柔而甜美，而之前是生硬而刺耳的。她的姿态放松而开放，而之前是紧绷而收缩的。曾经充斥着她、我们以前都感觉到从她身上散发出来的愤怒已经消失无影无踪。她很平静，显然很和平。事实上，她看起来几乎不再是同一个人。“我不知道这一切意味着什么，”她开始说，“我只知道我在呼吸时看到了东西，那种感觉比我可能描述的任何事情都要真实。在我开始呼吸后，很长一段时间都没有发生什么，”她继续道，“然后，突然，我发现自己漂浮在空中，在那以太中。我没有身体，我确定我正在重新经历进入目前生活之前的一段时光。我是纯粹的灵魂。我从未感到如此和平冷静。然后，我意识到了梅兰妮，同样处于灵魂状态。她靠近了，我们开始一起跳舞——就在空间中无限制地跳舞。”


    “我们开始谈论一起进入下下生，”珍妮说，“这辈子。我们必须决定的大问题是谁来扮演什么角色——谁扮演母亲，谁扮演女儿。这并不重要，因为无论哪种方式对我们两人来说都是一项艰巨的任务。这将对我们的爱的非常强大的测试。我们必须决定，于是我们约定由做母亲，她做女儿，我们不久后就会化。就是这样，”她总结道，“这听起来没发生什么大事，但真的发生了。我只是无法用语言表达。我无法描述我所经历的那种深度和意义。”


    #### 被转化的能量


    我们讨论了她的经历，并根据珍妮的幻象探讨了“任务”的概念。小组中的其他人对她的经历有很深的感触，并在自己的生活中看到了相似之处。我建议珍妮在静修营回家后对梅兰妮什么也别提。在珍妮回家几天后，梅兰妮给妈妈打了电话，问是否可以谈谈。珍妮同意了，虽然第一次见面很试探且尴尬，但从那以后，她们的关系发生了巨大的变化。梅兰妮很快放弃了所有怪异行为，赶走了那个不靠谱的男朋友，回家陪伴母亲并在她疾病期间照顾她。在那以后他们真的成了最好的朋友，形影不离。此外，珍妮的母亲也开始频繁地打电话，她们的关系也逐渐开始改善。


    在这个例子中，能量的转化是以间接的方式发生的。珍妮对宽恕梅兰妮非常抗。她的灵魂引导她去静修营，以便她通过一个过程开启对任务协议的记忆，这又让她能够看到局面的完美。通过宽恕梅兰妮，她转化了他们关系中的憎恨，结果治愈了她和母亲之间最初的痛苦。


    ### 治愈集体的任务


    虽然有些人是为了治愈自身或灵魂小组的问题，但有些人化身是为了扮演更大的角色。这可能是为了承担在社会、政治、国家国际层面发生的特定能量，并为大群体提供治愈的机会。


