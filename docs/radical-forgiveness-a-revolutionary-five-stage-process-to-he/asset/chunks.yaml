    All too often when people talk about “letting go” of anger or “releasing” anger,
    they really mean trying to get rid of it. They judge it as wrong and undesirable,
    even frightening. They do not want to feel it, so they just talk about it and
    try to process it intellectually, but that does not work. Trying to process emotion
    through talking about it is just another way to resist feeling it. That’s why
    most talk therapies don’t work. *What you resist persists.* Since anger represents
    energy in motion, resisting it just keeps it stuck within us—until the volcano
    erupts. Releasing anger actually means freeing the stuck energy of held emotions
    by allowing them to move freely through the body as feeling. Doing some kind of
    anger work helps us experience this emotion purposefully and with control.


    ## Anger Work Moves Energy


    What we call anger work is not really about anger. It is simply the process of
    getting energy that is stuck in the body moving again. It might be more appropriately
    called energy release work. Whatever we call it, the process can be as simple
    as screaming into a cushion (so as not to alarm neighbors), yelling in the car,
    beating cushions, chopping wood, or doing some other explosive physical activity.


    Combining physical activity with the use of the voice seems to provide the key
    to successful energy release work. All too often we block the energy of emotion—whether
    it be anger, sadness, guilt, or something else—in the throat, so vocal expression
    should always be a part of the process. We should go into it not with the idea
    of trying to rid ourselves of the feeling, but with the intention of feeling the
    intensity of it moving through our body—without thought or judgment. If we truly
    can surrender to the emotions, we will feel more alive than we have felt in a
    long while, and we will find that the energy has dissipated.


    ## If Anger Is Scary


    For many of us, the thought of bringing up anger may be too scary even to contemplate,
    especially if terror lies underneath the anger. The person who did these terrible
    things to us may still exert a strong influence on our subconscious mind. Under
    these circumstances, it is not advisable to do anger work alone. Instead, we should
    work with someone who knows how to support us while we feel both the anger and
    the terror—someone with whom we feel safe and who has experience in helping people
    to move through intense emotion. A counselor or psychotherapist of some kind would
    be a good choice. I also recommend doing Satori Breathwork (see Chapter 27) with
    a skilled practitioner. This provides a way to release emotion.


    ## Anger Addiction Warning


    A note of caution needs to be sounded here. It becomes all too easy to get addicted
    to anger. Anger feeds on itself and easily becomes resentment. Resentment relishes
    going over and over an old hurt, constantly revisiting the pain associated with
    it, and venting the resultant anger in some form. It becomes a powerful addiction
    in and of itself.


    We must realize that anger that persists serves no useful purpose. Consequently,
    once the energy of anger has been allowed to flow as feeling, we should use the
    energy to create a positive outcome. Maybe we need to set a boundary or a condition
    on future interactions with the person around whom our anger revolves. Perhaps
    we can make a decision of some kind, such as being willing to feel compassion
    for the person or forgive him or her. Only when we use anger as the catalyst for
    positive change, self-empowerment, or forgiveness will we prevent it from becoming
    an addictive cycle.


    ## Collapsing the Story


    The only part of the story that is true is the original event: Father left. The
    rest is simply interpretation—assumptions made by a very immature, frightened
    mind. That makes the story 95 percent B.S. (Belief System)!


    For example, let’s say our father leaves home when we are five years old. For
    us, this event is traumatic and painful, but in our mind that is only the beginning
    of our story. At that age we think the world revolves around us, so we can only
    see it from that viewpoint. So we make our own interpretations based on that.
    The first interpretation is that he left me! After that come many more interpretations
    that expand the story egocentrically, such as: “It must be my fault. I must have
    done something to drive him away. He doesn’t love me anymore. Maybe he never did.
    I must be a verylovable person if my father would leave me. He can’t care about
    me, and if he doesn’t care about me, who will? I guess if he doesn’t love me,
    nobody will love me, and even if they do they are sure to leave me after five
    years because that’s the way things are with men who say they love you. You can’t
    really trust men who say they love you because they are bound to leave after five
    years anyway. I am just not very lovable. I will never have a relationship that
    will last more than five years. If I was not good enough for my father, I will
    never be good enough for anyone.”


    These stories become like internal gyroscopes, with their own frequencies that
    attract events and people to them so that they get played out according to the
    beliefs they contain. But, as we can see, the only part of the story that is true
    is the original event: Father left. That might be perhaps 5 percent of the total
    story.


    We might also, if we are female—and as happened with a woman in my workshop recently
    who had this story running—make it up that men are always subject to being “stolen”
    by other women. Then we will unconsciously create situations where this happens—in
    this example, after about five years of being in relationship.

