    ## # 22


    ### Four Steps to Forgiveness


    This adaptation of a three-step process taught by Arnold Patent[5] serves as a
    reminder of our power to attract the events and people we need to feel the emotions
    we have around a particular issue. The process takes only a few moments, but it
    is one that literally could save you from getting endlessly caught up in the drama
    of what is happening and going to Victimland for an extended stay!


    When something happens and we get upset, it is extremely easy for us to forget
    everything we ever knew about Radical Forgiveness. Until these principles become
    firmly anchored in our minds, whenever our upset creates a lot of emotional turmoil,
    our tendency is always to default to victim consciousness. The problem is, once
    there, we tend to hang out there for a very long time. Without a Radical Forgiveness
    viewpoint, you would will probably stay there for years, which is what most people
    do, as indicated by the dotted line on the diagram below. But if you know someone
    who knows Radical Forgiveness and recognizes your symptoms, he or she will have
    you do a worksheet or listen to the Radical Forgiveness CD so you can return to
    peace. As you will see on the following diagram, each time something happens we
    default to becoming a victim and go for an extended stay in Victimland. Then we
    get reminded of how everything might be perfect, so we use the technology to express
    our willingness to see the perfection and eventually return to a state of peace.


    This can be a rough ride, though, and it depends on your having someone who will
    rescue you. The way to stop the roller coaster is to use the four-step process
    *before* you have to book yourself a room in Victimland! On the diagram, use of
    the four-step process is represented by the curves that stop just short of the
    line at which we usually go unconscious. When we find ourselves using this process
    naturally, as a matter of course, Radical Forgiveness has become our default lifestyle—one
    that is, for sure, a whole lot easier!


    So, as soon as you find yourself getting upset over something, or even if you
    find yourself making judgments, feeling self-righteous, or wanting to change something
    about a situation, use this process to bring your consciousness back into alignment
    with the principles of Radical Forgiveness. (FIGURE 18)


    ![](Images/part4_chapter22_image001.jpg)


    FIGURE 18: The Victimland Roller Coaster


    ### STEP ONE: “LOOK WHAT I CREATED!”


    This first step reminds us that we are the creators of our reality. However, we
    create circumstances for our own healing, so do not assume `guilt` for what happens.
    Being quick to judge, we often use this step as a way to beat ourselves up. We
    say, “Look what I have created. Oh, it’s terrible—I must be a terrible person,
    a spiritual failure.” Please do not fall into this trap, for if you do, you buy
    into the illusion.


    ### STEP TWO: “I NOTICE MY JUDGMENTS AND LOVE MYSELF FOR HAVING THEM.”


    This step acknowledges that, as humans, we automatically attach a whole string
    of judgments, interpretations, questions, and beliefs to situations. Our task
    involves accepting the imperfection of our own humanity and loving ourselves for
    having these judgments, including the one that says we must be a spiritually moribund
    person for creating this reality. Our judgments are part of ourselves, so we must
    love them as we love ourselves. Doing this connects us with what is actually happening
    in our body and mind and brings us into the present through our feelings. Our
    energy then shifts quickly and allows us to go to the third and fourth steps of
    this process.


    ### STEP THREE: “I AM WILLING TO SEE THE PERFECTION IN THE SITUATION.”


    The “willingness” step is the essential step in the Radical Forgiveness process.
    It equates to a prayerful surrendering in the moment to the divine plan and the
    willingness to love ourselves for not being able to see this plan directly.


    ### STEP FOUR: “I CHOOSE THE POWER OF PEACE.”


    This fourth step represents a consequence of all the previous steps. By accepting
    that divine purpose is served in this situation and that what appears to be may
    be illusory, we choose to feel peace and use the power of peace in whatever actions
    are required. The power of peace is found when we are fully present in the moment,
    acting with clarity and focus, and being completely aware of our feelings.


    Practice this four-step process as often as possible. Make it a part of your awareness.
    It gives you a way to be in the moment throughout your day.


    To help you make this process your practice, it is a good idea to put these steps
    on a card. The previous printing of this book featured an epilogue on 9/11 that
    demonstrated the use of the four-step process in such a situation (see Further
    Resources).


    ## 23


    ### Seeing the Christ in Another


    If you recognize that a situation occurring between you and someone else represents
    an opportunity to heal something in yourself, you can create the healing experience
    by being in that present moment. A way to bring your energy into present time,
    as opposed to allowing your mind to be in the past or in the future, requires
    simply looking at the person with whom you are having an issue and seeing the
    Christ in them.


    In this sense, the term “Christ” means the part of them that is divine and one
    with you and with God. As you do this, you join with them, and in that moment
    you acknowledge the Christ within yourself.


    When we truly join with another person and become one with them, we have no need
    to attack and defend—so in that moment of joining, we raise our vibration, drop
    all our mechanisms of defense, and become our true selves. At the same time we
    let go of our projections and see the other person as a child of God, perfect
    in every sense. This is the essence of Radical Forgiveness.


    ### SEEING THE CHRIST IN OURSELVES

