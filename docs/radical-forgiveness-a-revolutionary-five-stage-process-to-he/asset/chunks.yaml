    This explains why the decision to transform something can be made only from the
    World of Divine Truth. We humans are so locked into our beliefs about pain and
    suffering, fear and death, that even while we may believe that a particular child’s
    soul came into this world to experience abuse and actually wants to feel abused,
    we simply cannot stand by and watch this happen. While the mission looks easy
    from the World of Divine Truth, it appears quite different down here on the physical
    plane. Who could possibly leave a child in an abusive environment? We cannot help
    but intervene. We are human!


    As we saw in an earlier chapter, we need to surrender to the idea that Spirit
    knows exactly what it is doing. If it were not in the child’s highest and best
    interest for there to be an intervention on its behalf, Spirit would set things
    up so that no one notices the abuse. If on the other hand, Spirit decides an intervention
    serves the soul’s highest good, it will arrange for that to occur. But this is
    not our decision. We as human beings must always respond in the way that seems
    most humane, most caring and compassionate, while at the same time knowing that
    love is contained in the situation.


    ### Radical Forgiveness Transforms


    This is not to say that we as humans cannot contribute to the transformation of
    such energies as those that create child abuse. We do so when we apply Radical
    Forgiveness to the situation. If we truly forgive—in the radical sense—all those
    involved in the abusive situation, we definitely have an impact on the energy
    pattern. Ultimately, the child will have to forgive in order to change the pattern,
    but each time any of us, in any situation, whether we are personally involved
    or not, chooses to see the perfection in the situation, we change the energy at
    once.


    I was once asked to address the National Society of Mediators at their annual
    conference. I was only to have about forty-five minutes and they were to be eating
    lunch while I spoke! I went early to listen in on their discussions and try to
    get a feel for their way of thinking. I determined that, in terms of background,
    about 50 percent of the attendees were lawyers and 50 percent were counselors
    and that their commitment to mediation left them fairly open-minded and flexible
    in their approaches to problem-solving. (FIGURE 9)


    ![](Images/part2_chapter11_image001.jpg)


    FIGURE 9: Mediation Energy Fields


    For the first twenty minutes or so, I did my best to explain the concepts and
    assumptions underlying Radical Forgiveness. Then I drew the diagram above to represent
    the energetic relationship between them and their clients.


    I then put it to them that their perception of the situation they were mediating
    was likely to be such that what was happening to `Clients A` and `B` was unfortunate
    at best and tragic at worst. I also suggested that they saw their role as mediators
    as trying to make the best of a bad job and resolve the situation in a way that
    would be the least damaging to both parties and their dependents.


    They agreed that this was a fair characterization of their task and that the energy
    field around the situation for the clients was one of hostility and mistrust.
    Had it been otherwise, they wouldn’t have needed a mediator.


    Then I factored into the situation their own energy. They saw that their energy
    field would normally contain thoughts and feelings related to the perception that
    this was a “bad” situation. I also suggested that, even though they were trying
    to mediate and help both clients, their perception of the situation as “bad” fed
    into the situation.


    “What if,” I asked, “instead of seeing this situation as tragic, you became willing
    to accept what is? Do you think that would make a difference? Your energy field,
    instead of being filled with fear, would be filled with love. Do you think that
    would affect how the situation comes out?”


    Surprisingly, they understood. It was not so much what they did that prevented
    the predicted bloodbath from occurring, but how they handled the energy of the
    situation. That is what transforming energy means.


    ### MORPHIC RESONANCE


    What I have just described draws on Rupert Sheldrake’s theory of morphic fields
    and morphic resonance. Sheldrake is an English biologist who postulates the existence
    of fields which are self-organizing and self-regulating systems in nature. Elements
    are attracted to each other by morphic resonance to create these fields. When
    one element in the field changes, the concept seems to be applicable at all levels,
    from quantum phenomena to social group behavior.


    In the human context, morphic fields link individual members through extrasensory
    and energetic resonance (consciousness), a process that is independent of time
    and space. This is why when someone forgives, the effect is felt immediately by
    the person being forgiven no matter how far away they may be.


    Returning to our situation with the mediators, we can think of the situation they
    often find themselves in as a morphic field in which the individuals are held
    together, through morphic resonance, by a victim consciousness. As soon as one
    member (the mediator) shifts their consciousness in the direction of love and
    acceptance of what is, the field immediately undergoes a transformation and evolves
    into a new vibratory arrangement of a higher order. Through morphic resonance,
    the other members of the group have an opportunity to become realigned in the
    same way, and the situation can evolve on completely different lines from the
    way it would have had the consciousness not transformed in this way.


    #### Nelson Mandela Has Shown Us How


    The way Nelson Mandela handled the South African situation when apartheid ended
    in the early 1990s is an object lesson in how to transform energy through Radical
    Forgiveness. Apartheid, the white-dominated political system that had been in
    place for three-quarters of a century, kept blacks and whites separated—the whites
    in luxury and the blacks in terrible poverty. Mandela himself was imprisoned for
    twenty-six years. Upon his release, he became president of the country. South
    Africa was ripe for a bloodbath of revenge, yet Mandela brought about an amazingly
    peaceful transition—the hallmark of which was not revenge but forgiveness.

