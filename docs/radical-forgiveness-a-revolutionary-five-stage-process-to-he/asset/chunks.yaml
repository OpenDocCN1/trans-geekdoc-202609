    然而，做到这一点需要一些前提条件。首先，“激进宽恕”（Radical Forgiveness）最终依赖的接纳能力要求我们能够从灵性的角度来看问题。它不指代任何特定的宗教，也不排除任何宗教，但它要求我们至少相信一个更高的力量或更高的智慧，并相信存在一个超越我们物理世界的灵性现实。严格的无神论观点不会让激进宽恕发生，也不会让
    `RFT` 发挥作用。我们将看到，要让激进宽恕在我们的生活中成为现实，我们需要对“我们可以同时行走在两个世界”这一想法感到自在。


    尽管如此，激进宽恕可以用非威胁性的术语和尊重所有人的宗教信仰的语言来解释。它可以以与任何现有信仰体系相契的方式进行解释，从而让人们能够从容地倾听。此外，激进宽恕疗法的很大程度上有效性并不依赖于神秘或深奥的理念。压抑、否认和投射都是根根于心理学理论的观念，并可以用科学术语进行充分解释。


    将传统疗法与 `RFT` 混合是行不通的。我怎么强调这一点都不为过。这两种形式底后的问题和假设太不同了。任何将 `RFT` 加入到自己工具箱的治疗师，必须首先意识到
    `RFT` 与传统疗法之间的区别，并能够向客户清楚地区分它们；其次，必须努力保持它们相互独立。


    总而言之，激进宽恕疗法是针对那些完全没有精神疾病的人的——他们只是在处理日常生活问题上需要一些帮助。然而，如果一个人有严重的问题和深层压抑的痛苦，并伴有复杂的防御机制，他或她可能会被转给一位充分理解如何有利应用
    `RFT` 的合格心理治疗师。


    激进宽恕的技术表面上简单得惊人，但作为一种灵魂疗法却又奇地有效——对于个人、群体、种族甚至是国家。例如，我曾为犹太人和其他受迫者举办过工作坊，他们怀着自身种族或群体的痛苦，我见证了他们意识中发生了惊人的转变。他们能够放下集体的痛苦，我相信，通过这样做帮助治愈了该群体追溯许多代的集体意识。


    # 6 # 执我的机制


    在涉及灵性本质的问题上，对话往往很快就会转向“自我”（Ego）。激进宽恕也不例外，因为自我似乎确实起着核心作用。那么，什么构成了自我？它在激进宽恕中扮演着什么角色？我认为至少有两种回答这个问题的方法。第一种将自我视为我们的敌人，而第二种将其视为我们的朋友。


    “自我作为敌人”的观点认为，自我为了自身生存的私利，负责将我们与源头（Source）隔离开。因此，自我是我们的灵性敌人，我们正与它处于状态。许多灵性修行以此为核心思想，并要求必须抛弃或超越自我作为灵性成长的前提。相比之下，“自我作为朋友”的模型将自我视为我们灵魂的一部分，它在我们类体验中充当着我们慈爱引导者的角色。


    我更倾向于认为，这两个想法中都包含真理，尽管初看之下它们似乎是不相容的。让我按照我自己的理解逐一解释它们，以便你做出自己的判断。


    ## 1. 自我作为敌人


    在这一模型中，自我被认为存在一套根深蒂固的、关于我们与灵性关系的信念，这些信念是在我们尝试思考与神圣源头分离念头时形成的。事实上，我们可以说，自我就是“分离实际上已经发生”这一信念。


    根据故事版本，在分离的那一刻，自我导致我们相信上帝对我们的实验非常愤怒。这立即在我们内心产生了巨大的负罪感。随后，自我通过告诉我们来充实了它的故事：上帝会报复，并因为我们巨大的罪恶严厉惩罚我们。由于相信这个故事是真的，在我们内心产生的负罪感和恐惧是如此，以至于我们别无选择，将这些情感压抑在潜意识深处。这让我们免受了对它们的意识觉察。


    这种策略效果相当好，但我们仍然对这些感觉可能再次起感到非常恐惧。为了解决这个问题，自我产生了一种新信念——罪疚在别人身上而不是在我们自己。换句话说，我们开始将罪疚投射到他人身上，这样我们就能完全摆脱它。他人成了我们的替罪羊。然后，为了确保罪疚留在他们那里，我们对他们产生愤怒并不断地攻击他们。（关于否认和投射的更多详细信息，请参见第
    7 章。）（图 5）


    ![](img/part2_chapter6_image001.jpg)


    图 5：自我的结构


    这就是受害者原型的起源，以及人类不断相互攻击和防御的需求来源。在攻击了被我们投射罪疚的人之后，我们担心他们会反击我们。因此，我们建立了强有力的防御来保护自己以及我们认为完全无辜的事物。在某个层面上，我们知道自己是有罪的，所以我们对攻击的防御越加强，就越强化了我们的罪感。因此，我们必须不断寻找仇恨、批评、评判、攻击和犯错的人，仅仅是为了让我们自己感觉好受。这种动态不断强化自我的信念体系，通过这种方式，自我确保了它自身的生存。


    以这种行为模式作为参考，我们可以看到为什么在历史上，人类对愤怒投入了如此高的精力，并如此强烈需要将世界分为受害者和迫害者、反派和英雄、胜利者和失败者、赢家和输家。


    此外，我们对这个所谓的“我们/他们”世界的感知，反映了我们内部的分裂：一方是自我（分离、恐惧、惩罚和死亡的信念），另一方是灵性（爱与永恒生命的认知）。我们通过总是将敌人视为“外部”而非内在，将这种分裂投射到了物理世界中。


    虽然所有的信念体系都会对变化产生抗拒，但在这一点上，自我并非普通的信念体系。它是极具抗性的。它在我们的潜意识中掌握着巨大的力量，并在关于我们认为是谁的决策中掌握着巨大的票数。


