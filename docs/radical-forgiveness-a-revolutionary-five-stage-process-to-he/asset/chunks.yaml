    # 指南：这段声明仅仅是为了提醒我们“激进原谅”（Radical Forgiveness）的一个假设：我们来到这个世界上带着某种使命，或与灵性（Spirit）达成协议，去做某些事情、以某种方式存在，或转化某些能量。无论那个使命过去或现在是什么，我们只知道，所经历的一切都是我们所扮演的角色不可或缺的一部分。戴娜公主的故事就是一个很好的例子。请注意，声明的最后部分免除了我们了解使命究竟是什么的需要。


    ## 15. 我从我的意识中释放所有*(如 2b 所示)*的情绪：


    **指令：** 这让你能够确认你正在释放你在第 2b 框中记录的情绪。只要这些情绪和想法停留在你的意识中，它们就会阻碍你对导致困扰的误解产生感知。如果你对这种情况仍有强烈的感受，说明你对无论是什么误解仍有投入——你的信念、解释、判断等。不要评判这一事实，也不要试图改变你的投入。只需观察它。


    你对处境的情绪可能会反复出现，你也可以接受这一点。只需愿意感受它们，然后释放它们（至少是暂时释放），这样觉知之光就能穿透你，让你看到那个误解。然后，你可以再次选择以不同的方式看待这种情况。


    释放情绪及其相应的想法在原谅过程中起着重要作用。只要那些想法仍在运作，它们就会继续为我们的旧信念系统提供能量，而这些系统创造了我们现在试图转化的现实。确认我们同时释放情绪和附着其上的想法，开启了治愈过程。


    ## V. 重构故事


    ### 重构声明


    16. 第 1 条的故事是你的“受害者故事”，基于旧的现实范式（受害者意识）。现在，尝试根据你在完成此工作表过程中获得的洞察，从你全新的、赋能的立场，对同一事件进行不同的感知（即重构）。（这可能仅仅是一个通用的声明，表示你只是知道一切都是完美的；或者是一个包含你具体处境内容的声明，前提是你真的能看到这种完美之处所在。通常你看不见。注意不要基于“人类世界”的术语进行重构。注意感受基调的任何积极转变。）*


    我现在意识到……*Jeff 仅仅是在镜像我关于“我不被爱”的错误信念，他正给了我治愈的礼物。Jeff 太爱我了，以至于他愿意忍受为我表现出的不适。我现在看到，我为了自己的治愈得到了我想要的一切，而
    Jeff 也为了他自己的治愈得到了他想要的。从这个意义上说，这种情况是完美的，它是灵在我生命中运作的证据，证明我是被爱的。一切都真正处于神圣的秩序中，按照我的神圣计划展开。Jeff
    是我生命中的一种祝福，无论未来发生什么，我都对他表示感谢。*


    **指令：** 如果你无法看到针对你具体处境的新解释，这没问题。激进原谅的重构可以用非常通用的方式表达，例如：“发生的事情仅仅是神圣计划的展开。它是由我的高我（Higher
    Self）为了我的精神成长而召唤的，相关的人都在与我一起跳着治愈之舞，所以事实上，从未发生过任何错误。”写这样的话就完全足够了。另一方面，如果你对这一切如何在完美的意义上圆满解决有一些洞察，那也可以。


    没有帮助的做法是基于根根于“人类世界”的假设来写解释，例如给出发生的原因或找借口。你可能在用另一个谎言故事交换另一个故事，甚至陷入了“伪原谅”。对你处境的新解释应该让你能从灵性的角度感受到它的完美，并对它带给你的礼物保持开放。你的重构应该提供一种看待你处境的方式，揭示上帝或神圣智慧的手正在为你工作，并向你展示祂有多么爱你。


    **注意：** 你可能需要针对同一个问题完成许多工作表，才能感受到那种完美。对自己绝对诚实，并始终从你的感受出发。这里没有正确答案，没有目标，没有分数，也没有最终产物。价值在于过程，在于付诸行动。让发生的一切都是完美的，抵制编辑和评价你所写内容的冲动。你不会做错的。


    ## VI. 整合转变


    17. 我完全原谅我自己，*Jill,*，并接受自己作为一个充满爱、慷慨且创造性的生命。我释放所有对与过去相关的匮乏和局限的情绪及想法的需求。我从过去撤回能量，释放所有阻碍我此刻拥有的爱与丰盛的障碍。我创造我的生命，我被赋能重新做自己，无条件地爱和支持自己，就我现在的样子，带着我所有的力量和光辉。


    **指令：** 这段宣言的重要性再怎么强调也不为。大声说出来，让自己感受到它。让文字在你的内心共鸣。自我评判是我们所有问题的根源，即使当我们移除了对他人的评判并原谅了他们，我们仍继续评判自己。我们甚至因为评判自己而评判自己！


    18. 我现在顺服我所想的*宇宙*的力量，并相信这种情况将继续完美地按照神圣的引导和灵性法则继续展开。我承认我的合一性，感到自己与我的源头（Source）完全重新连接。我恢复了我的真实本性，即爱，我现在将爱归还给*Jeff*。我闭上眼睛，感受流淌在我生命中的爱，感受当爱被感知和表达时而来的喜悦。


    **指令：** 这代表了原谅过程的最后一步。然而，这不是你采取的步骤。你确认你愿意体验它，并将剩下的过程交给你的更高力量。请求通过神圣的恩典完成治愈，并让你和
    X 恢复他们的真实本性（即爱），并重新连接到你们的源头（也是爱）。


    这最后一步为你提供了一个机会，放下文字、想法和概念，真正去感受爱。当你到达底线时，只有爱存在。如果你能真正触及那种爱，你就安全了。你什么都不需要做。


    所以，花几分钟思考这段声明，并对感受爱保持开放。你可能需要尝试很多次才能感受到它，但某一天，就在你最无意的时候，爱和喜悦将包裹你。


    19. 对你 *Jeff* 的赞赏与感激。完成这张工作表后，*我现在意识到，你所做的一切是因为你足够爱我，才将我推出受害者心态，并帮助我放弃了我不被爱的信念。我很感谢你，感谢你出现在我的生活中。*


    我完全原谅你，*Jeff,* 因为我现在意识到你没有做任何错，一切都处于神圣的秩序中。感谢你愿意在我的觉醒中扮演角色——谢谢你——并感谢我自己愿意在你的觉醒中扮演角色。我承认并接受你现在的样子。


    **指令：** 你通过面对 X 开始了激进原谅工作表。从你开始，你的能量可能已经发生了变化，即使这种变化发生在仅仅一或两分钟前。现在你对 X 感觉如何？你想对
    X 说什么？如果可能，允许自己在不思考的情况下写作，不要评判你的文字。让它们让你你自己感到惊讶。


