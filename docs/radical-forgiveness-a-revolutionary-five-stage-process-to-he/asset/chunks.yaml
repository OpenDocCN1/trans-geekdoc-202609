- fmt: '

    Jill’s story demonstrates this fact beautifully. On the surface, there was the
    drama of what was happening between her, Jeff, and his daughter Lorraine. It was
    not pretty. It looked as though Jeff was being cruel and insensitive. It was easy
    to identify Jill as a victim in the situation and Jeff as the villain. Yet there
    were enough clues to lead us to the possibility that something else of a more
    loving nature was happening, and that it was being orchestrated at the spiritual
    level.


    As the story unfolded, it became obvious that Jill’s soul was doing a dance with
    the souls of Jeff and Lorraine and that the situation being played out was purely
    for her soul’s benefit. Moreover, far from being a villain, Jeff was actually
    a hero and, from that spiritual perspective, had done nothing wrong. He had simply
    played his part in the drama, as dictated by his soul, acting in support of Jill’s
    growth at the soul level.


    When we shift our perspective to this possibility, we become open to the idea
    that nothing wrong took place and that in fact there was nothing to forgive. This
    is precisely the notion that defines Radical Forgiveness. It is also what makes
    it radical.


    If we had asked Jill to apply traditional forgiveness to this situation, we would
    not have investigated this “other world” possibility. We would have taken the
    evidence of our five senses and used our intellect to come to the conclusion that
    Jeff had wronged and badly treated her and that if she were to forgive him, she
    would have to accept what he did and try her best to let it go, or “let bygones
    be bygones.”


    From this we notice that traditional forgiveness takes it as a given that something
    wrong happened. Radical Forgiveness, on the other hand, takes the position that
    nothing wrong happened and that, consequently, there is nothing to forgive. We
    can put it like this:


    With traditional forgiveness, the willingness to forgive is present but so is
    the residual need to condemn. Therefore victim consciousness is maintained and
    nothing changes.


    With Radical Forgiveness, the willingness to forgive is present but not the need
    to condemn. Therefore, the victim consciousness is dropped, and everything changes.


    (“Victim consciousness” is defined as the conviction that someone else has done
    something bad to you, and, as a direct result, they are responsible for the lack
    of peace and happiness in your life.)


    ### DIFFERENT WORLDS—DIFFERENT PERSPECTIVES


    Traditional forgiveness should not be seen as inferior to Radical Forgiveness.
    It is simply different. When used in the context of a certain set of beliefs—beliefs
    that are firmly rooted in the physical world and in everyday human reality—traditional
    forgiveness is the only form of forgiveness possible and has great value in its
    own right. It calls upon the finest of human qualities and characteristics, such
    as compassion, mercy, tolerance, humility, and kindness. Joan Borysenko calls
    forgiveness “the exercise of compassion.”[1] (FIGURE 2)


    ![](Images/part2_chapter3_image001.jpg)


    FIGURE 2: The Existential Chain of Being


    Radical Forgiveness is different from traditional forgiveness because it is rooted
    in the metaphysical reality of the world of Spirit—that which I call the World
    of Divine Truth.


    This makes the distinction between radical and traditional forgiveness very clear,
    because we can see now that in each case we look through a completely different
    lens. The lens we are using to view a situation will determine whether we are
    using traditional forgiveness or Radical Forgiveness. Each provides us with a
    completely different point of view.


    But we should not fall into the trap of thinking of either/or. We live in both
    worlds at the same time. Since we are spiritual beings, the importance of the
    distinction between these two worlds cannot be overemphasized, some further explanation
    will be helpful.


    The World of Humanity and the World of Divine Truth represent two ends of a vibrational
    scale. When we vibrate at low frequency, our bodies become dense and we exist
    only in Humanity. When we vibrate at high level, our bodies become lighter, we
    exist also in Divine Truth. Depending upon our vibration, we move toward one or
    the other.


    The World of Humanity represents the reality we see as “outside ourselves.” As
    world of form, it provides the setting in which we live—it holds the energy patterns
    of death, change, fear, limitation, and duality. This means we have human to work
    with. The World of Divine Truth, on the other hand, has no physical form and already
    carries the energy pattern of eternal life, immutability, infinite abundance,
    love, and oneness with God. Even though we cannot perceive this world with our
    senses, we can get enough of a sense of it to know it is real. Such activities
    as prayer, meditation, and Radical Forgiveness, all of which raise our vibration,
    allow us to access the Divine Truth. (FIGURE 3)


    ![](Images/part2_chapter3_image002.jpg)


    FIGURE 3: Perspectives on Two Worlds


    These existential realms differ not in terms of place or time but solely in their
    vibrational level. The study of quantum physics has proven that all reality consists
    of energy patterns and that consciousness sustains these energy patterns. Thus,
    the world of form exists as dense concentrations of energy vibrating at frequencies
    we can experience. On the other hand, we experience the World of Truth as an inner
    knowing and extrasensory awareness.

