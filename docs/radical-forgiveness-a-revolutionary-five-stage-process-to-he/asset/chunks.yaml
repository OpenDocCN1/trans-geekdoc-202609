    There are some prerequisites, however, for doing so. First, the receptivity that
    Radical Forgiveness ultimately depends upon requires us to be open to seeing things
    from a spiritual standpoint. It references no particular religion and excludes
    none, but it does require at least a belief in a Higher Power or Higher Intelligence
    and the idea of a spiritual reality beyond our own physical world. A strictly
    atheistic viewpoint will not allow Radical Forgiveness to occur, nor `RFT` to
    work. We shall see that to make Radical Forgiveness a reality in our lives, we
    need to be comfortable with the idea that we can walk in both worlds simultaneously.


    Having said that, Radical Forgiveness can be explained in nonthreatening terms
    and in such language as to honor all people’s religious beliefs. It can be explained
    in ways that provide a fit with any existing belief system, thus allowing people
    to listen with comfort. Besides that, a substantial part of Radical Forgiveness
    Therapy does not depend upon mystical or esoteric ideas for its validity. Repression,
    denial, and projection all are concepts firmly rooted in psychological theory,
    and can be explained fully in scientific terms.


    Mixing traditional therapy with `RFT` will not work. I cannot stress this enough.
    The questions and the assumptions underlying the two forms are just too different.
    Any therapist who adds `RFT` to his or her tool kit must first be aware of the
    distinctions between `RFT` and traditional therapy and be able to clearly differentiate
    them to a client, and, second, must work hard to keep them separated.


    In the main, Radical Forgiveness Therapy is for people who are not in the least
    mentally sick—just needing some help in dealing with the issues of daily life.
    However, if a person has profound issues and deeply repressed pain with complex
    defense mechanisms in place, he or she may be referred to a qualified psychotherapist
    with a thorough understanding of how to apply `RFT` beneficially.


    The technology of Radical Forgiveness is deceptively simple and yet amazingly
    effective as therapy for the soul—for individuals, groups, races, even countries.
    For example, I have held workshops for Jews and other persecuted people who hold
    the pain of their race or group, and I have witnessed amazing shifts in their
    consciousness. They have been able to let go of the collective pain, and in so
    doing, I believe, help heal the collective consciousness of that group going back
    many generations.


    # 6 # The Mechanisms of the Ego


    In matters of a spiritual nature, it is seldom long before the conversation turns
    to the ego. Radical Forgiveness is no exception, since the ego does seem to play
    a central role. So, what constitutes the ego and what role does it play in Radical
    Forgiveness? I think there are at least two ways of answering this question. The
    first casts the ego as our enemy, while the second sees it as our friend.


    The ego-as-enemy viewpoint makes the ego responsible for keeping us separated
    from Source out of self-interest for its own survival. Consequently, the ego is
    our spiritual enemy and we are at war with it. Many spiritual disciplines take
    this as their central idea and demand that the ego must be dropped or transcended
    as a prerequisite for spiritual growth. The ego-as-friend model, in contrast,
    sees the ego as being the part of our own soul that acts as our loving guide for
    our human experience.


    I prefer to think that there is truth in both of these ideas even though, at first
    blush, they seem to be incompatible. Let me explain each in turn as I have come
    to understand them for myself, so you can make up your own mind.


    ## 1. THE EGO AS THE ENEMY


    In this model, the ego is said to exist as a deeply held set of beliefs about
    who we are in relationship to Spirit, having been formed when we experimented
    with the thought of separation from the Divine Source. In fact, we could say that
    the ego is the belief that separation actually occurred.


    At the moment of separation, so the story goes, the ego caused us to believe that
    God became very angry about our experiment. This immediately created enormous
    guilt within us. The ego then elaborated on its story by telling us that God would
    get even and punish us severely for our great sin. So great were the guilt and
    terror created in us by the belief that this story was true that we had no choice
    but to repress these emotions deep in our unconscious minds. This spared us from
    conscious awareness of them.


    This tactic worked quite well, yet we retained a great fear that the feelings
    might rise again. To remedy this problem, the ego developed a new belief—that
    the guilt lay with someone else rather than within ourselves. In other words,
    we began projecting our guilt onto other people so we could be rid of it entirely.
    Others became our scapegoats. Then, to ensure that the guilt stayed with them,
    we became angry with them and continuously attacked them. (For more detailed information
    on denial and projection, see Chapter 7.) (FIGURE 5)


    ![](Images/part2_chapter6_image001.jpg)


    FIGURE 5: The Structure of the Ego


    Herein lies the origin of the victim archetype and the human race’s continual
    need to attack and to defend against one another. After attacking the people onto
    whom we project our guilt, we fear they will attack us in return. So we create
    strong defenses to protect ourselves and what we see as our complete innocence.
    At some level we know we are guilty, so the more we defend against the attack,
    the more we reinforce our guilt. Thus we must constantly find people to hate,
    to criticize, to judge, to attack, and to make wrong simply so we can feel better
    about ourselves. This dynamic constantly reinforces the ego’s belief system, and
    in this manner, the ego ensures its own survival.


    Using this behavior pattern as a reference, we can see why, throughout history,
    human beings have had such a high investment in their anger and such a great need
    to break the world into victims and persecutors, villains and heroes, victors
    and vanquished, winners and losers.


    Furthermore, the perception we have of a we/they world reflects our own internal
    split between the ego on one hand—which is the belief in separation, fear, punishment,
    and death—and Spirit on the other, which is the knowledge of love and eternal
    life. We project this division onto the physical world by always seeing the enemy
    as “out there” rather than within ourselves.


    Although all belief systems quickly become resistant to change, the ego is no
    ordinary belief system in this regard. It is extremely resistant. It holds incredible
    power in our unconscious mind and carries an enormous bloc of votes when it comes
    to making decisions about who we think we are. This belief system is so very powerful
    that it appears to be an entity in its own right—and we have named it the ego.


    We have become trapped in the belief in separation to such a degree that it has
    become our reality. We have been living the myth of separation for eons, making
    real the idea that we chose separation by naming it Original Sin. In actuality,
    no separation ever occurred. We are as much a part of God as we always were. We
    are spiritual beings having a human experience, remember? Consequently, there
    is no such thing as Original Sin in this sense.


    Jesus purportedly gave us this revelation—the truth about our illusion—in *A Course
    in Miracles,* a three-volume work by Jesus channeled through a lady named Helen
    Schucman, the purpose of which was to show us the error of the ego’s way and to
    teach us that the way home to God is through forgiveness. (Interestingly, Helen
    was a very reluctant channel and never believed a word of what she channeled.)
    Contrary to some prevailing Christian theology, many biblical scholars find these
    very same ideas expressed in the Bible.

