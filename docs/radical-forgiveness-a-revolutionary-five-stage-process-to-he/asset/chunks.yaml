  raw: "We can either choose to let go of the victim archetype and bring our energy\
    \ into the present through Radical Forgiveness or wait for a significant trauma\
    \ to force us into the now. In other words, we can either transform our consciousness\
    \ as a matter of will or we can wait for a disaster or a life-threatening illness\
    \ to make us do it.\n\n## \n\n# \n\n#### 14\n\n### As Above, So Below\n\nHumanity\
    \ as a whole may soon be faced with the same choice that confronts each one of\
    \ us as individuals. As I pointed out in the previous chapter, the decision is\
    \ to heal by choice or by trauma.\n\nMany visionaries claim that all the signs\
    \ are present that point toward humankind receiving a massive demonstration of\
    \ the heal-by-choice-or-trauma principle in the very near future. The Earth has\
    \ a cancer, and it is called the human race. This living, breathing, conscious\
    \ planet has been in a state of perfect balance its entire life, with every little\
    \ part doing what it must to sustain the system in balance. This is analogous\
    \ to the job done by healthy cells in the human body.\n\nFor thousands of years\
    \ we have been part of that balanced system. In the last few hundred of them,\
    \ however, we have put ourselves above the natural order and have come to believe\
    \ that we can control and dominate the entire system. Just as a cancer cell multiplies\
    \ out of control, metastasizes throughout the system, and begins to devour its\
    \ host, so we continue to multiply exponentially out of control all over the planet\
    \ and to plunder its natural resources as if nothing mattered beyond the satisfaction\
    \ of our greed.\n\nLike a tumor wrapping itself around the heart or blocking a\
    \ lung, so do we, in the same kind of deadly embrace with our own life source,\
    \ chop down forests, pollute the very air we breathe, and poison the environment.\
    \ Scientists are telling us that we are close to destroying life as we know it\
    \ within the next forty to fifty years if we don’t make dramatic changes.\n\n\
    The greatest need, however, is for a change in consciousness. Collectively, we\
    \ must change mass consciousness or face unprecedented trauma at such a level\
    \ that all the structures maintaining our present lifestyle will be swept away.\n\
    \n### EARTH CHANGES AND POLITICAL UPHEAVAL\n\nFrom earliest times right up to\
    \ the present, massive and disastrous earth changes have been predicted for the\
    \ early years of the new millennium. Predictions include two polar shifts, dramatic\
    \ earthquakes, drastically altered weather patterns, volcanic eruptions, and a\
    \ significant rise in sea levels as polar ice caps melt. The result of such events\
    \ would be a radically changed map of the world, with much of what we see today\
    \ as land disappearing under water and new continents rising from the sea. The\
    \ disruption and chaos would be unimaginable, and millions of people would die.\
    \ Political upheavals, religious wars, and environmental damage would also occur\
    \ on a massive scale.\n\nSuch predictions were most notably made by the famous\
    \ seer of the sixteenth century, Nostradamus, and in this century by Edgar Cayce,\
    \ the “sleeping prophet” who made very precise predictions in the 1940s. They\
    \ also appear in many religious writings, including the Bible’s Book of Revelation\
    \ and in the traditional texts of the Mayans, the Hopi Indians, and many other\
    \ indigenous peoples.\n\nIt is clear to many that these earth changes have already\
    \ begun. As the effects of global warming become impossible to ignore, the scientific\
    \ community is making its own series of predictions based on the worldwide increase\
    \ in floods, droughts, hurricanes, tornadoes, and volcanic eruptions, all of which\
    \ bear close resemblance to the predictions of Cayce and others. Just recently,\
    \ the world has become a whole lot more unstable politically, and some of what\
    \ is happening looks uncomfortably like what has been predicted.\n\n#### **Consciousness\
    \ Counts**\n\nScientists do not talk much about the effects of consciousness on\
    \ the earth, preferring instead to focus on what action we should take to prevent\
    \ impending doom. But the more spiritually oriented predictions have always carried\
    \ with them the caveat that the severity of earth changes and political upheaval\
    \ may be mitigated to the extent that we human beings come to our senses and change\
    \ our consciousness. In other words, even though our fear/greed-based consciousness\
    \ has wounded the etheric body of the planet so badly that a violent eruption\
    \ in its physical form seems inevitable, we can still lessen the effect by raising\
    \ our consciousness. Just as a disease pattern in the etheric body of a human\
    \ being can be healed by nonphysical means (prayer, Reiki, imagery, hands-on healing,\
    \ Radical Forgiveness Therapy, etc.), so the pattern of upheaval and violent change\
    \ already set in the earth’s etheric body can be dissipated before it manifests\
    \ in the physical. The answer seems to be, amazingly enough, prayer.\n\nScience\
    \ has been putting the spotlight on prayer over the last few years, and there\
    \ is a growing consensus in that community that it actually works. We truly create\
