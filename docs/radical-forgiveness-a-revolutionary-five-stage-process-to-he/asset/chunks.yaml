  trans: '

    吉尔的故事完美地证明了这一事实。从表面上看，她、杰夫和他的女儿洛林之间发生了一场闹剧。这并不好看。看起来杰夫似乎非常冷酷且缺乏同情。人们很容易将吉尔认同为这种情况中的受害者，将杰夫视为反派。然而，有足够的线索引导我们走向另一种可能性：某种更具爱本质的事情正在发生，而且这是在精神层面被精心安排的。


    随着故事的展开，显而易见，吉尔的灵魂正在与杰夫和洛林的灵魂共舞一场舞，而正在上演的情况纯粹是为了她灵魂的利益。此外，杰夫远不是什么反派，他实际上是一个英雄，从那个精神角度来看，他没有做任何错。他只是按照灵魂的指令在这场戏中扮演了自己的角色，支持着吉尔在灵魂层面的成长。


    当我们把视角转向这种可能性时，我们开始接受这样一种观点：并没有发生任何错误，事实上没有什么可以原谅的。这正是定义“激进原谅”（Radical Forgiveness）的核心概念。这也是它之所以“激进”的原因。


    如果我们要求吉尔对这种情况应用传统的原谅，我们就不会去研究这种“另一个世界”的可能性。我们会根据五感提供的证据，并用理智得出结论：杰夫亏负并粗鲁地对待了她，如果她要原谅他，就必须接受他所做的一切并尽力让其过去，或者说“让往事过去”。


    从从中我们注意到，传统的原谅是将“发生了某些错误”视为理所当然。另一方面，激进原谅的立场是：什么错误都没有发生，因此没有什么可以原谅的。我们可以这样表述：


    对于传统的原谅，原谅的意愿是存在的，但谴责的残余需求也存在。因此，受害者意识得以维持，什么都没有改变。


    对于激进原谅，原谅的意愿是存在的，但没有谴责的需求。因此，受害者意识被抛弃了，一切都发生了变化。


    （“受害者意识”被定义为：坚信别人对你做了坏事，并且作为直接结果，他们对你生活中缺乏平和与幸福负责。）


    ### 不同的世界——不同的视角


    传统的原谅不应被看作是劣于激进原谅的。它只是不同。当在特定的信仰体系背景下使用时——这些信仰深根于物理世界和日常人类现实——传统的原谅是唯一可能的原谅形式，并其本身具有巨大的价值。它唤起了人类最优的品质和特征，如同情、慈悲、宽容、谦卑和善良。乔安·波里森（Joan
    Borysenko）将原谅称为“慈心的练习”。[1]（图 2）


    ![](img/part2_chapter3_image001.jpg)


    图 2：存在的之链


    激进原谅与传统的原谅不同，因为它植根于精神世界的形而上现实——即我所谓的“神圣真理世界”（World of Divine Truth）。


    这使得激进原谅与传统原谅之间的区别变得非常清晰，因为我们现在看到，在每情况下我们都在通过完全不同的视角。我们观察情况时使用的视角决定了我们使用的是传统的原谅还是激进原谅。每种方式都为我们提供了完全不同的观点。


    但我们不应该陷入“非此即彼”的陷阱。我们同时生活在两个世界。由于我们是精神性的，这两个世界之间区别的重要性再怎么强调也不为过，进一步的解释将会有帮助。


    人类世界和神圣真理世界代表了振动频率的两个极端。当我们以低频率振动时，我们的身体变得致密，我们只存在于人类世界。当我们以高水平振动时，我们的身体变得轻盈，我们也存在于神圣真理之中。根据我们的振动情况，我们向其中一个移动。


    人类世界代表了我们看到的“自身之外”的现实。作为形式的世界，它提供了我们生活的背景——它承载着死亡、改变、恐惧、局限和二元性的能量模式。这意味着我们有人类需要应对。另一方面，神圣真理世界没有物理形式，已经携带了永恒生命、恒不变、无限丰盛、爱与神合一的能量模式。尽管我们无法通过感官感知这个世界，但我们可以获得足够的感觉来知道它是真实的。祈祷、冥想和激进原谅等活动都提升了我们的振动频率，允许我们接触到神圣真理。（图
    3）


    ![](img/part2_chapter3_image002.jpg)


    图 3：两个世界的视角


    这些存在领域的不同不在于空间或时间，而仅仅在于它们的振动水平。量子物理学已经证明了所有现实都是由能量模式组成的，意识维持着这些能量模式。因此，形式的世界是以我们可以体验的频率振动的致密能量聚集的形式存在的。另一方面，我们将真理世界体验为一种内在的认知和超感官的感知。

