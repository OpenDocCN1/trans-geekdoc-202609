- fmt: "\n“He was willing to do whatever it took to get you to the point where you\
    \ could look again at your belief about yourself and see that it was untrue. Do\
    \ you realize how much discomfort he was willing to endure to help you? He is\
    \ not a cruel man by nature, so it must have been hard for him. Few men could\
    \ have done that for you while risking losing you in the process. Jeff, or Jeff’s\
    \ soul, truly is an angel for you. When you really understand this, you will feel\
    \ so grateful to him! Plus, you will stop sending out messages that you are unlovable.\
    \ You will have the ability to let love in, perhaps for the first time in your\
    \ life. You will have forgiven Jeff, because you will be clear that nothing wrong\
    \ ever took place. It was perfect in every sense.\n\n“And I promise you this,”\
    \ I continued. “Jeff is already changing and dropping his bizarre behavior as\
    \ we speak. His soul is already picking up that you have forgiven him and healed\
    \ your misperception about yourself. As you change your energy, his energy changes\
    \ too. You’re connected energetically. Physical distance is irrelevant.”\n\nGetting\
    \ back to her question, I said, “So, you won’t have to do anything special when\
    \ you get home. In fact, I want you to promise me that you won’t do anything at\
    \ all when you get back. In particular, do not, under any circumstances, share\
    \ with Jeff this new way of looking at the situation. I want you to see how everything\
    \ will be different `automatically simply as a consequence of you changing your\
    \ perception.`\n\n“You will feel changed as well,” I added. “You will find yourself\
    \ feeling more peaceful, more centered, and more relaxed. You will have a knowingness\
    \ that will seem strange to Jeff for a while. It will take time for your relationship\
    \ with him to adjust, and it may still be difficult for a while, but this issue\
    \ will resolve now,” I concluded with conviction.\n\nJill and I reviewed this\
    \ new way of looking at her situation many times before she returned home to England.\
    \ It is always difficult for someone in the middle of an emotional upset to shift\
    \ into a Radical Forgiveness perspective. In fact, getting to a place where Radical\
    \ Forgiveness can truly happen often requires a great deal of integration and\
    \ repetitive reinforcement. To help my sister, I introduced her to some breathing\
    \ techniques that help to release emotion and integrate new ways of being and\
    \ asked her to complete a Radical Forgiveness worksheet. (See Part Four, “Tools\
    \ for Radical Forgiveness.”)\n\nThe day she left, Jill was obviously nervous about\
    \ going back to the situation she had left behind. As she walked down the jetway\
    \ to her airplane, she looked back and tried to wave confidently, but I knew she\
    \ was scared that she might lose her newfound understanding and get drawn back\
    \ into the drama.\n\nApparently the meeting with Jeff went well. Jill requested\
    \ that he not question her immediately about what had happened while she was away.\
    \ She also requested that he give her space for a few days in order to get settled.\
    \ But she immediately noticed a difference in him. He was attentive, kind, and\
    \ considerate—more like the Jeff she had known before this whole episode began.\n\
    \nOver the next couple of days, Jill told Jeff she no longer blamed him for anything,\
    \ nor did she want him to change in any way. She said she had learned that it\
    \ was she who needed to take responsibility for her own feelings and that she\
    \ would deal with whatever came up for her in her own way without making him wrong.\
    \ She did not elaborate at all and did not try to explain herself.\n\nThings went\
    \ well for some days after Jill’s return home, and Jeff’s behavior with his daughter\
    \ Lorraine changed dramatically. In fact, everything seemed to be getting back\
    \ to normal with regard to that relationship, but the atmosphere between Jeff\
    \ and Jill remained tense and their communication limited.\n\nAbout two weeks\
    \ later, the situation came to a head. Jill looked at Jeff and said quietly, “I\
    \ feel like I’ve lost my best friend.”\n\n“So do I,” he replied.\n\nFor the first\
    \ time in months they connected. They hugged each other and began to cry. “Let’s\
    \ talk,” Jill said. “I’ve got to tell you what I learned with Colin in America.\
    \ It’s going to sound weird to you at first, but I want to share it with you.\
    \ You don’t have to believe it. I just want you to hear me. Are you willing?”\n\
    \n“I’ll do whatever it takes,” Jeff replied. “I know something important happened\
    \ to you there. I want to know what it was. You have changed, and I like what\
    \ I see. You are not the same person you were when you stepped on the airplane\
    \ with John. So tell me what happened.”\n\nJill talked and talked. She explained\
    \ the dynamics of Radical Forgiveness as best she could in a way Jeff could understand.\
    \ She felt strong and powerful—sure of herself and her understanding, secure and\
    \ clear in her mind.\n\nJeff, a practical man who is always skeptical of anything\
    \ that cannot be rationally explained, did not resist this time, and he was indeed\
    \ quite receptive to the ideas Jill asked him to consider. He voiced openness\
    \ to the idea that there might be a spiritual world beneath everyday reality and,\
    \ given that, saw a certain logic in the Radical Forgiveness concept. He didn’t\
    \ accept it totally, but he nevertheless was willing to listen, consider, and\
    \ see how it had changed Jill.\n\nAfter the discussion, they both felt their love\
    \ had been rekindled and that their relationship had a good chance of surviving.\
    \ They made no promises, though, and agreed to keep talking to each other while\
    \ they watched how their relationship progressed.\n\nIt did, indeed, progress\
    \ quite well. Jeff still fawned over his daughter Lorraine to a degree, but not\
    \ as much as before. Jill found she cared hardly at all even when he did behave\
    \ in this manner. It certainly did not trigger her to regress emotionally and\
    \ react from old beliefs about herself.\n\nWithin a month of their conversation\
    \ about Radical Forgiveness, all of Jeff’s past behavioral pattern with Lorraine\
    \ stopped. In turn, Lorraine didn’t call or visit as often; she got on with her\
    \ life. Everything slowly returned to normal and Jill and Jeff’s relationship\
    \ began to grow more secure and loving than ever before. Jeff became the kind,\
    \ sensitive man he is by nature, Jill became less needy, and Lorraine became happier.\n\
    \nLooking back, had Jill’s soul not brought her to Atlanta to create the opportunity\
    \ for us to have our conversation, I feel sure she and Jeff would have separated.\
    \ In the grand scheme of things, that would have been all right too. Jill simply\
    \ would have found someone else with whom to recreate the drama and another opportunity\
    \ to heal. As it was, she took this opportunity to heal and stayed in the relationship.\n\
    \n*Note: The time-line diagram in FIGURE 1 depicts Jill’s story as a graphic.\
    \ She found this helped her greatly to see how the original pain of not feeling\
    \ loved by her father had led to a belief that she was not enough and how, in\
    \ turn, that belief had played out in her life. You might do the same for yourself\
    \ if you think you have a similar story running your life.* (FIGURE 1)\n\n![](Images/part1_chapter1_image001.jpg)\
    \  \n\nFIGURE 1: Jill's Healing Journey\n\n## part two\n\n# Conversations on Radical\
    \ Forgiveness\n\n#### 2\n\n### Underlying Assumptions\n\nSince all theories are\
    \ based upon certain assumptions, it is important to have an understanding of\
    \ the spiritual assumptions underlying the theory and practice of Radical Forgiveness.\
    \ Before looking at these, though, it is worth noting that even the most widely\
    \ accepted scientific theories are often based on assumptions for which there\
    \ is very little hard evidence.\n"
