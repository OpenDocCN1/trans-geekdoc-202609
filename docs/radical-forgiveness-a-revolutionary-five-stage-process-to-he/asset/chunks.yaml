    重要的是，要意识到投射机制不仅适用于我们的阴暗面。我们还会把自己身上那些喜欢却难以承认的特质投射到他人身上。因此，我们在那些身上看到了我们内内在的美感、自己的创造才华、自己的智慧等等。


    # 正向反映练习


    这是一个由阿诺德·帕廷特（Arnold Patient）教导的练习。它对每个尝试过的人都非常有成效，因为它要求你：首先，看到他人身上奇妙之处；其次，将这种特质归为你自己的。它将人与他们的本质——与内在的基督——连接起来，并让他们真正看清自己。这个练习通常在小组环境中进行，但两个人一起做也同样好。这类似于在一个人身上看到基督，但这项练习不是静静进行的，而是通过语言并配合眼神交流完成的：


    A 人发自内心地对 B 人说：“我在你身上看到的、你折射在我身上的那些美好的特质，是……” B 人倾听并回答道：“谢谢。”然后他们交换角色并重复这一练习。


    # 24


    ## 原谅是一个三个字母的单词


    这个工具只需涉及写三封信给那个让你觉得欺犯过或伤害过你的人。当你对刚刚发生的事情感到非常愤怒时，它的效果非常好；即使对于很久以前发生的事情也有效。


    在第一封信中发泄你所有的愤怒。不要留情。如果这让你感觉好，你可以威胁要进行最卑劣的报复。一直写下去直到你无话可说。写这封信的过程可能会让你流下许多眼泪——愤怒、悲伤、怨恨和受伤的泪水。让它们流出来吧。在身边放一盒纸巾。如果你很愤怒，对着枕头尖叫，或者做一些体育活动来帮助释放你的愤怒。在任何情况下都不要邮寄这封信！


    第二天，写另一封信。这封信的愤怒和报复之情要少一些，尽管它仍然不会让那个令你生气的人因你认为他们所做的事脱脱。然而，它应该努力将同情、理解、慷慨，以及某种原谅的可能性纳入考量。这封信也不要邮寄。


    第三天，写第三封信。在这一封信中，尝试根据“激进原谅”（Radical Forgiveness）的原则对情况进行新的解释。由于这模仿了激进原谅的工作单，请参考工作单上的笔记作为信件的指南，但要尽可能用你自己的话来写（见第
    21 章）。起初这可能很困难，但请坚持下去。记住，在真正做到之前，你必须先假装一段时间。


    这些信从未被邮寄过——这样做既没有必要也没有意义。它们的设计初衷是改变你的能量，而不是接收者的能量。发泄你的感受，而不是再次将其投射到他人身上，是我们的目标。特别是寄出那封愤怒的信，毫无用处。这样做只会让攻击-防御循环持续下去，并将你进一步拖入戏剧性的深渊。记住，当你将能量向着激进原谅的方向转变时，对方的能量会自动发生变化。


    你可以保留这些信以备后用，或在原谅仪式中使用它们。我个人的倾向是使用火仪式来转化它们。当你看到自己的文字变成灰烬并随着一缕烟升起时，会发生某种力量。


    # 25


    ## 原谅仪式


    仪式的力量在当今社会被低估了。当我们把任何程序仪式化时，我们就让它变得神圣；因此，仪式直接与我们的灵魂对话。虽然仪式可以非常简单，也可以相当复杂，但复杂性不如你对仪式展现出的敬畏重要。仪式邀请了神性参与人类事务，因此，它代表了另一种祈祷的方式。


    当我们亲手创造仪式时，仪式会变得更加强大。在设计自己的仪式时，请尽可能发挥创造力。不过，这里有一些你可能需要的通用指南和想法。


    ### 火之仪式


    火一直是转化和炼金术的元素。每当我们通过火献上某物时，我们就触及了对火转化力量的原始信仰。因此，焚烧激进原谅工作单、释放信或三连信的仪式，提供了一种完成感和转化感。带着仪式感和敬畏之心进行焚烧。在物品焚烧时祈祷。


    焚烧香木、鼠尾草、甜草和香会增强任何仪式，并为原谅仪式带来特殊的意义。鼠尾草和甜草烟还能净化你的气场，从而从你的能量场中清除不需要的能量。


    ### 水之仪式


    水具有治愈和清洁的，我们赋予它使事物神圣的能力。仪式化的洗涤、浸泡和漂浮都可以产生良好效果。例如，与其焚烧释放信，不如将其折成一只小船，让湍急的溪水带走它。


    ### 发挥创意


    在你的仪式中发挥创造力，让它们对你产生意义。你可能记得 Jane 的故事，她患有脑癌，在阁楼上放了一个盒子，里面装着与一个让她心碎的人有关的一切物品。我让她把盒子从阁楼取下来，带去参加治疗。如果她不是在我们这样做之前发作并去世，我们就会打开盒子，检查里面的每一件物品以及它们对她意味着什么。然后我们将通过对她有意义的仪式逐一处理它们。这个过程将释放许多被压抑的能量。


    # 26


    ## 艺术化的原谅


    艺术为原谅和情感释放提供了强大的工具。我有幸见证或参与的通过艺术进行的最具戏剧性的治愈之一，发生在我在英国举办静营期间。参与者之一是一个患有多发性硬化症的年轻女性。她的身体虚弱枯竭，声音几乎听不见。她的喉轮几乎关闭了。她有一个丈夫和两个孩子，但这段婚姻基本上不存在，她感到被困、无助和绝望。


    在一次小组艺术治疗期间的某时刻，她开始以一种特别引人注目的方式画。她无法说话，但一直画。起初很难辨认她在画什么，但随着时间的推移，很明显她正在利用这种媒介作为一种回归的方式来释放童年的痛苦。


    我和妻子坐在她身边，看着她画了一个又一个，随着时间的推移，她的画变得越来越幼稚。除了画作之外，她偶尔还会涂下“坏女孩”、“上帝不爱我”等表达深层羞耻、内疚和恐惧的词。最后，她画了一个简陋的火笔画，那是她后来回忆起的童年被舅舅侵奸。在这种宣泄式的释放中，她通过绘画表达了她无法用语言和声音说出的东西。她的喉轮是因为她被迫用嘴所做的事情而关闭的。

