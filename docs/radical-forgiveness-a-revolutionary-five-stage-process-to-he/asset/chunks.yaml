    我们转化受害者原型的集体使命，要求我们所有人都要遵循曼拉的榜样，超越受害者的体验。如果不这样做，我们将永远绝望地沉迷于自己的伤痛和受害者原型。


    ### 灵性的触动


    在我们潜意识的深处，我们与使命保持着联系。灵性通过将乱伦、儿童虐待、性侵待和种族仇恨等问题推向表面，不断提供转化受害者能量的机会。我们每个人都可以在这些任何情况下通过练习`激进原谅`（Radical
    Forgiveness）来接受这一使命。如果有足够的人实现了这一点，这种让我们看到情境中完美的感知转变将转化情境，使得对这种能量模式的需求消失不见。


    ### 转化练习


    要转化受害者原型，请练习以下方法：每当你看新闻时，将你的意识从评判转变为观察情境中完美的模式。例如，不要从表面上接受一个关于种族偏见的故事，而是帮助转化种族不和谐的能量。这样做的方法是观察那些通常会被你评判和指责的人或情况，看看你是否可以进入一个充满爱的接纳空间。要知道故事中的人正在履行神圣计划中自己的部分。不要把任何人视为受害者，也拒绝给任何人贴上反派的标签。人们只是在正在上演的剧中行动，以便治愈的发生。记住，上帝不会犯错！


    # 12


    ### 自我的反击


    通过提醒我们自己是拥有人类体验的灵性生物，`激进原谅`提升了我们的频率，并引导我们向精神进化的方向迈进。


    这种增长对自我构成了真正的威胁（在这里自我定义为一种根深蒂固、复杂的信仰体系，认为我们与上帝是分离的，他终有一天会因为我们选择这种分离而惩罚我们）。这是因为我们在精神上进化得越成熟，就越可能记得自己究竟是谁——以及我们与神合为一。


    一旦我们有了这一认知，自我就必须死去。如果说对任何类型的信仰体系我们知道一件事，那就是它们会抵抗一切证明自己是错误的尝试——自我也不例外。（人们经常证明，他们宁愿是正确的也不愿快乐。）


    因此，我们越是使用`激进原谅`，自我的反击就越激烈，并试图诱导我们继续沉迷于受害者原型。它完成这一任务的一种方式是利用我们自己的精神成长工具。其中一个很好的例子是自我利用“内在小孩工作”来让我们困在受害者心态中。


    内在小孩工作给了我们一种审视内心的方法，治愈我们作为成年人仍带着、并继续影响我们今天生活的童年伤口。然而，在我们对伤痛的关注中，自我看到了机会。它利用了那种将内在小孩作为我们伤痛隐喻的内在小孩工作，以加强我们对受害者原型的依恋。这引发的行为是不断重温我们的伤口，通过不断谈论它们赋予它们力量，将它们投射到所谓的内在小孩身上，并将它们作为寻找亲密关系的手段。


    20 世纪 80 年代的大部分内在小孩工作侧重于指责我们的父母或其他他人，导致我们成年后感到不快乐。“如果不是因为父母，我今天本会快乐的”是这项工作相关的咒语。它允许我们觉得“是他们这样对待我们的”，这种感知比认为我们自己是以某种方式`请求`被这样对待要容易得多。这种观点会自动将我们重塑为受害者。只要我们继续为自己的问题归怪父母，每一代人都会延续这种信仰模式。


    我并不是说接触我们被压抑的童年愤怒和痛苦并寻找释放它们的方法是坏的。事实上，这样做是关重要的。我们必须在走向原谅之前先完成这项工作，因为如果我们感到愤怒，就无法原谅。但有太多的工作坊和治疗纯关注愤怒，未能帮助我们通过任何形式的原谅来转化它。当我们愤怒工作与`激进原谅`结合时，各种被压抑的情绪和心理毒素都会被清除，愤怒的永久释放将成为可能。因此，我们离开了伤痛，超越了受害者心态。


    ### 纳瓦霍原谅仪式


    我曾听过《为什么人们不痊愈以及他们如何痊愈》一书的作者卡罗琳·米斯（Caroline Myss）描述纳瓦霍人用来防止“伤口学”变成成瘾模式的仪式。虽然他们确实意识到人们需要谈论自己的伤口并获得群体的见证，但他们理解谈论伤口会赋予伤口力量，尤其是当过度进行时。因此，如果一个人有伤口或委屈想要分享，部落就会聚会，那个人可以将其带到圈中。这个人被允许表达三次他的委屈，每个人都带着同情和慈悲倾听。然而在第四次，当这个人进入圈中时，大家都转过身去。“够了！我们已经听你表达了三次你的担忧。我们收到了。现在放手它吧。我们不会再听了，”他们说。这成为了一种释放过去痛苦的强大支持仪式。


    想象一下，如果我们以同样的方式支持我们的朋友，会发生什么？如果在他们抱怨了三次自己的伤口和受害之苦后，我们接着说：“关于这个问题我听得足够了。是时候让你放手它了。我不会再通过允许向我谈论它们来让你的伤口对你产生控制力。我太爱你了。”


    我确信，如果我们这样做，我们的很多朋友会叫我们为叛徒。他们可能不会把我们的行为看作纯粹、充满爱的支持，而是背叛，并可能立即反对我们。


    如果我们真的想在精神进化的道路上互相支持，我们别无选择承担风险，在我们爱的人面前划清界限，并尽力温柔地帮助他们超越对伤口的成瘾。这种行动将引导我们实现集体使命：转化受害者原型并记住我们真实的身份。


    # 13


    ### 时间、医学与原谅


    精神进化带来了对我们物理身体及其护理方式的新认知和知识。我们过去三百年来所持有的医学范式——自从法国哲学家勒内·笛卡尔将身体定义为机器以来——正朝着一种整体性的心身方法发生根本性的变化。


    我们过去认为健康就是没有疾病。现在，我们根据生命力（普拉纳、气）在体内的流动情况来衡量健康。为了达到健康，这种生命力必须能够自由流动。如果我们的身体充满了怨恨、愤怒、悲伤、内疚和哀悼的能量，我们就无法健康。


    当我们谈论身体时，不仅包括物理身体（它也是一种能量体），还包括环绕我们的微妙体。我们分别将其称为以太体、情绪体、精神体和因果体。每种都有不同的频率。虽然我们过去用化学和分子来定义物理身体，但物理学家已经教我们把所有五个身体（包括物理身体）看作相互作用能量模式的致密凝聚。


