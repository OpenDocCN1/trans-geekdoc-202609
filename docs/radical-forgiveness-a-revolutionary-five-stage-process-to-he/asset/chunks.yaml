    理解她作为人类力量的关键在于“伤痕治愈者”这一原型，它告诉我们，我们的力量源于我们的伤口——这意味着，是我身上的伤口唤醒了你的治愈，而你身上的伤口唤醒了我的治愈。我们都是带伤的治愈者，但我们并不知道。当我们把伤口隐藏并完全私密化时，我们不仅在疏离和否定自身的治愈，也否定了无数他人的治愈。**强颜微笑**是一种剥夺爱的糟糕方式。它让心灵萎缩，让灵魂残废。通过戴安娜公主愿意向整个世界分享她最深处的伤口，她唤醒了我们心中的治愈者，开启了我们的心扉，治愈了我们破碎的灵魂。


    整个世界目睹了人们以迪安娜为榜样并敞开心扉，分享他们的悲伤和伤痕，正如她所做的那样。她给了人们一种亲密的语言，让他们能够公开且真实地表达感受。我不记得见过有任何情感和感受的表现是不真正真实的；而在当今的电视上，这确实很罕见。


    当我们每个人开始从失去的痛苦，以及因悲伤、愤怒、对迪安娜形象的贪婪渴望和对她生活的好奇而产生的内疚投射的“绳索灼伤”中（媒体和狗仔只是为我们反映了这些）中走出来时，我们开始透过迷雾和面纱，觉察到这一切的神圣完美。我们越是体悟她所接受的任务以及她取得成功的程度，就越能让自己交付于那种完美之中。


    当我们超越了曾经将我们永远束缚在人类世界、并让我们受困“受害者原型”的情绪和思想时，我们发现自己正经历着一种新层次的和平；我们开始接受这样一个事实：这一切必须完全以那种方式展开。这项使命绝对需要她所经历的成长、那段彻底失败的婚姻、她从王室阶层遭受的排斥、媒体的批评、狗仔的骚扰，以及那场戏剧性而暴力的死亡——一切，精确到最后一个细节。


    随着未来的展开，你会注意到，既然现在迪安娜已经回到“家”并完成了她的使命，那些维持所有动态的能量将开始消散。不仅是她从这些动态中被释放，所有参与这场我们所知仅是幻象的剧目的人也是如此。查尔斯现在可以变得更温暖、不那么疏远，成为他两个儿子更慈爱的父亲——而且他无疑会这样做。（媒体会说他是因为所发生的事而改变了，但我们知道真正的真相。）女王可能会变得不那么古板、更加开放，并且不再那么无关紧要。王室本身将超越个人崇，成为一个更强大、更有意义的机构，这并非对所发生之事的直接反应，而是因为任务结束、转化完成后所发生的能量转变。


    但仅仅因为某人开启了他的心轮，并不能保证他会一直保持开启状态。这在每一刻都是一种选择。集体也是如此。英国人民以及世界其他地方的人，要么留在迪安娜死亡将他们推入爱的震动中，并利用这种力量来转化他们、他们的王室和他们的社会；要么聚焦在所发生之事的幻象上，指责查尔斯、整个王室、司机、媒体和其他人。如果他们选择后者，心轮就会关闭。


    # 转化原型


    ## 11


    ### 转化受害者原型


    正如我们在上一章中看到的，我们的首要任务是转化受害者原型并提升意识。但转化任何事物意味着什么，它又是如何提升意识的？


    首先要理解的是，只有当我们选择将其作为我们的使命时，我们才能转化某些事物。而我们对使命的决定不是在这个世界上做的，而是在神圣真理之中。


    其次要意识到的是，转化某些事物并不意味着改变它。事实上：


    > 要转化任何事物，我们必须充分地体验它，并爱上它本来的样子。


    例如，也许你的个人使命涉及出生在一个虐待家庭中，亲身体验虐待，并以受害者或施暴者的身份去认知。记住，一旦你转世，你对约定的使命的记忆就会消失。如果你能想起自己的使命，你将无法充分地体验那种能量和受害者的感受。只有在被害化的经历中，你才可能意识到受害者幻象背后的真相——自我恨的投射。如果你能够看透施暴者的幻象，承认这些行为是对爱的召唤，并用爱和完全接纳给予回应，受害者能量就会被转化，所有参与者的意识都会提升。此外，维持虐待模式的能量会消失，行为会立即停止。


    相反，如果我们不承认情况中的真相，或者看不透幻象，并试图改变物理环境，我们就会锁住维持虐待模式的能量，导致什么都不会改变。


    ## 唯有爱能转化


    只有爱具有转化儿童虐待、企业贪婪、谋杀以及世界上所有所谓邪恶能量的能力。其他事物无法产生影响。


