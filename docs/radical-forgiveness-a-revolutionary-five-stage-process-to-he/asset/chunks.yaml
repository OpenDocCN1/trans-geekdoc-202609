  raw: "Far from being a villain, then, this man was in fact a healing angel for Debi.\
    \ At great discomfort to himself—for who would enjoy being a mean-spirited jerk?—he\
    \ played out Debi’s story for her. Unfortunately, she missed the lesson at that\
    \ time and simply took it as an opportunity to enlarge her “not good enough” story\
    \ and prove it right.\n\nThirteen years later she did a simple little process\
    \ called the 13 Steps to Radical Forgiveness. As a result, she got to see the\
    \ truth—that he was providing a healing opportunity for her and that he was in\
    \ fact her healer. Immediately the energy started to move again, and the money\
    \ flowed almost instantly in her direction. (Money is just energy.)\n\nA few days\
    \ after Debi returned from the training, she ran into this man. He made a point\
    \ of coming up to her and saying, “You know, Debi, I never did thank you for what\
    \ you did for me all those years ago when you did that first ad for me. You gave\
    \ me a break, and it worked. I really appreciate it. Thank you.” He still didn’t\
    \ offer her money, but that doesn’t matter. What she got from him was the acknowledgment\
    \ that she was previously unable to accept. That was the final healing moment.\n\
    \nSince then, Debi has stepped out into her power. She has stopped hiding her\
    \ talent by doing anonymous studio work and is now out there doing concerts and\
    \ recording her own CDs. She has even started her own production company. All\
    \ that old “I’m not good enough” stuff has disappeared completely, and she is\
    \ living her purpose.\n\nI always tell Debi’s story to convince people of the\
    \ power of these seemingly simple tools and to encourage people to use them, and\
    \ I am grateful to her for allowing me to do so.\n\n*Note: Once I became aware\
    \ of the power of the Radical Forgiveness worksheet to create transformation in\
    \ people, I was curious as to whether it would prove equally effective as an audio\
    \ experience. To find out, I crafted thirteen questions that were similar to those\
    \ on the worksheet and recorded them on a CD. After bringing to mind the story\
    \ and feeling the feelings, the listener simply had to answer “Yes” out loud to\
    \ every question that followed.*\n\n*I believe that the potency of the Radical\
    \ Forgiveness process improves when the questions are heard aloud.* *The oral\
    \ response is important, because the body feels the resonance of the word “yes”\
    \ and it goes in deep. Countless numbers of people have attested to its effectiveness.\
    \ It is not a hypnotic experience, so many people keep it in the car and listen\
    \ to it while driving.*\n\n*To obtain a copy of this CD, called* Radical Forgiveness\
    \ *, see section entitled “Also from Sound True and Collin Tipping”.*\n\n## \n\
    \n# \n\n#### 17\n\n### The Five Stages of Radical Forgiveness\n\nNo matter what\
    \ form the technology of Radical Forgiveness takes, whether it be a workshop,\
    \ the 13 Steps, the Radical Forgiveness worksheet, or the ceremony, each is designed\
    \ to take you through the five essential stages of Radical Forgiveness. These\
    \ are:\n\n### 1\\. TELLING THE STORY\n\nIn this step, someone willingly and compassionately\
    \ listens to us tell our story and honors it as being our truth in the moment.\
    \ (If you are doing a worksheet, this person might be yourself.)\n\nHaving our\
    \ story heard and witnessed is the first step to letting it go. Just as the first\
    \ step in releasing victimhood is to own it fully, so must we own our story in\
    \ its fullness from the point of view of being a victim and avoid any spiritual\
    \ interpretation at this stage.\n\nHere we must begin from where we are (or were,\
    \ if we are going back into the past to heal something), so that we can feel some\
    \ of the pain that caused the energy block in the first place.\n\n### 2\\. FEELING\
    \ THE FEELINGS\n\nThis is the vital step that many so-called spiritual people\
    \ want to leave out, thinking that they shouldn’t have “negative” feelings. That’s\
    \ denial, pure and simple, and it misses the crucial point that authentic power\
    \ resides in our capacity to feel our feelings fully and, in that way, show up\
    \ as fully human. It is only when we give ourselves permission to access our pain\
    \ that our healing begins. The healing journey is essentially an emotional one.\
    \ But it doesn’t have to be all pain either. It is surprising how, as we go down\
    \ through the levels of emotion and allow ourselves to feel the authentic pain,\
    \ it can quickly turn to peace, joy, and thankfulness.\n\n### 3\\. COLLAPSING\
    \ THE STORY\n\nThis step looks at how our story began and how our interpretations\
    \ of events led to certain (false) beliefs forming in our minds that have determined\
    \ how we think about ourselves and how we have lived our lives. When we come to\
    \ see that these stories are, for the most part, untrue and serve only to keep\
    \ us stuck in the victim archetype, we become empowered to make the choice to\
    \ stop giving them our vital life force energy. Once we decide to retrieve our\
    \ energy, we take back our power, and the stories wither and die.\n\nIt is also\
    \ at this step that we might exercise a high degree of compassion for the person\
    \ we are forgiving and bring to the table some straightforward, honest-to-goodness\
    \ understanding of the way life often is and just how imperfect we all are—and\
    \ the realization that we are all doing the very best we can with what we are\
    \ given. Much of this we might categorize as traditional forgiveness, but it is\
    \ nevertheless important as a first step and a reality check. After all, most\
    \ of our stories have their genesis in early childhood, when we imagined that\
    \ the whole world revolved around us and that everything was our fault.\n\nSo\
    \ this is where we can give up some of that child-centered woundedness. Here we\
    \ can bring our adult perspective to bear and confront our inner child with the\
    \ plain truth of what really did or didn’t happen, as distinct from our interpretations\
    \ about what we think happened. It is amazing how ridiculous many of our stories\
    \ seem once we allow the light in. But the real value in this step is in releasing\
    \ our attachment to the story, so we can more easily begin to make the transition\
    \ required in the next step.\n\n### 4\\. REFRAMING THE STORY\n\nThis is where\
    \ we allow ourselves to shift our perception in such a way that instead of seeing\
    \ the situation as a tragedy, we become willing to see that it was in fact exactly\
    \ what we wanted to experience and was absolutely essential to our growth. In\
    \ that sense, it was perfect. At times we will be able to see the perfection right\
    \ away and learn the lesson immediately. Most often, however, it is a matter of\
    \ giving up the need to figure it out and surrendering to the idea that the gift\
    \ is contained in the situation, whether we know it or not. It is in that act\
    \ of surrender that the real lesson of love is learned and the gift received.\
    \ This is also the step of transformation, for as we begin to become open to seeing\
    \ the divine perfection in what happened, our victim stories, which were once\
    \ vehicles for anger, bitterness, and resentment, become transformed into stories\
    \ of appreciation, gratitude, and loving acceptance.\n\n### 5\\. INTEGRATION\n\
    \nAfter we have allowed ourselves to be willing to see the perfection in the situation\
    \ and turned our stories into ones of gratitude, it is necessary to integrate\
    \ that change at the cellular level. That means integrating it into the physical,\
    \ mental, emotional, and spiritual bodies so that it becomes a part of who we\
    \ are. It’s like saving what you have done on the computer to the hard drive.\
    \ Only then will it become permanent.\n\nIn my workshops, I find that Satori Breathwork\
    \ is a very good way to integrate the change, whether it is done as part of the\
    \ workshop or soon thereafter. This entails lying down and breathing consciously\
    \ in a circular fashion to loud music (see Chapter 27)."
