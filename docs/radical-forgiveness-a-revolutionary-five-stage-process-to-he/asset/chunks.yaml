    为了支持这位女性进行宣泄，我的妻子走向我们举办静修的那个相当大房间的远端。然后，我们让她用自己的声音告诉我的妻子，她是一个好女孩，上帝爱她。我让她说话的声音越来越大，直到她用尽全身的力气大声叫喊。在她在大声呼喊了大约二十次“上帝爱我！”之后，她停下来，看着我并肯定道：“他真的在爱我，不是吗？”那个治愈的时刻我将永远忘记。


    在我们从英国回来三个月后，我们收到了她的来信，说她已经离开了丈夫，找了新住处，并找到了一份工作。她正在运用自己的声音去索取她想要的东西，她发现自己不仅有索取的力量，还有接受的力量。她甚至为多发性硬化症患者建立了一个支持小组，并和他们一起进行艺术治疗。她的力量一天一天地恢复，三年后我们仍然能听到她的消息，并对她不断增长的力量感到惊叹。


    ## 艺术治疗作为一种工具


    如果你不是一个善于言辞的人，也不习惯写下什么，请尝试画画。你可能会对这种沟通方式所产生的结果感到惊讶。买一些尺寸合适的白纸和黑纸，以及一些彩色蜡笔和粉笔。（粉蜡笔在黑纸上的效果非常好。）


    要记住，使用这种工具完全不需要任何艺术天赋：它并不是为了画出漂亮的图片。事实上，如果你满腹愤怒，你的画作可能一点也不美。它的意义在于是将情绪和想法投射在纸上。


    在没有任何预期或预设设想的情况下开始画画。你可以请求上帝或你的精神向导，帮助你通过绘画和上色的过程释放任何需要释放的情绪——然后直接开始即可。无论什么涌来，就让它来。不要评判。顺其自然。像冥想一样去做。如果你想讲一个故事，就去讲。如果你只想运用颜色，就去用。做任何你想做的。


    要将艺术治疗作为原谅工具，可以使用类似于“信件三部曲”的方法。画一系列画，表达你对某个人对你所做的事情的感受；这些画将表达你的愤怒、恐惧、痛苦、悲伤等。然后进入一个更具慈悲和理解的心态，画一些反映这种态度的画。再画第三组画来表达“激进原谅”（Radical
    Forgiveness）的感觉。你可能想在每个阶段之间留出时间，也可以一次性完成。然而，请确保一旦开始进行这种艺术治疗，就完成所有三个阶段——即使你总共只画了三幅画。例如，只做第一幅可能会让你陷入愤怒中无法自拔。


    当你完成每一幅画时，把它挂在墙上。按照你完成的精确顺序放置这些画，在墙上创造出一条垂直或水平的条带。如果你是垂直展示，请从底部的第一张愤怒画开始，以顶部的最后一个激进原谅画结束。当你以这种方式放置它们时，你会惊讶地看到每幅画所表达的能量质量的进展和变化。


    给每幅画命名并注明日期。花些时间和这些画在一起。让它们向你“说话”。在你画每一幅画时，你在思考某些想法。当你以后看这些画时，清空脑海中的那些想法，检查画作中是否有其他重要的内容。邀请你信任的人对这些画给出他们的解读；他们可能会看到你没有看到的东西。通过说来征他们的意见：“如果这是你的画，你会看到什么？”如果他们看到的与你产生了共鸣，很好。如果对你来说并不完全真实，也可以。他们是通过他们自己的潜意识而不是你的来洞察你的画作，但你会发现他人的观察会在你内心引发一种全新的观察画作的方式，你可能会因此产生新的见解。


    # 27


    ### 悟道呼吸（Satori Breathwork）


    正如我们之前讨论过的，压抑或受抑制的情绪对我们的身心健康都有毒影响。释放这些情绪是激进原谅过程的第一步。我们可以在经验老师的指导下，通过使用名为`Satori
    Breathwork`（悟道呼吸）的过程最快、最有效地释放积压的情绪。（Satori 是一个日语单词，意为“洞察”或“觉醒”。）


    `Satori Breathwork`通常仰卧进行，涉及以全意识的圆形模式进行呼吸。换句话说，你有意识地呼吸，吸气和呼气之间没有停顿。整个过程中会播放响量较大的音乐。


    这个人通过张嘴呼吸四十到六十分钟，有时长而深地进入腹部，有时快速而浅地进入上胸部。这使身体氧化到某种程度，身体从细胞中释放出在细胞内结晶为能量粒的受抑情绪。当这些能量粒被释放时，人通常会意识到当下的这些旧感受。


    这些感受可能以纯情感的形式表达，如悲伤、愤怒或绝望，且与与之相关的任何记忆无关。相反，导致这种情绪产生并被压抑的事件、想法、联想或误解的记忆可能会清晰地进入焦点。它甚至可能以符号的方式或隐喻的形式出现。对于每个人和在每次呼吸练习中，体验都是不同的——也是无法预测的。


    随着情绪涌起，这个人“通过呼吸”处理它们，这让人不仅能够充分感受到它们，还能释放它们。我们经常为了控制情绪而停止呼吸，因此，通过呼吸来处理它们能让这种感受和释放得以发生。在某些情况下，人会在呼吸时通过口头和肢体动作表达出来。无论情绪是如何释放的，这个过程几乎都会带来深邃的宁静和内在的和平。


    这种简单的技术提供了戏剧且持久的治愈效果。对于任何认真想要清理“情绪衣柜”的人，我毫不犹豫地推荐它。（更多信息请参见“更多资源”。）


    `Satori Breathwork`的效果之所以是深刻的，是因为它们完全发生在个人内部，没有任何引导者的任何干预、指导、引导或操纵。事实上，引导者的存在仅仅是为了维持空间的安全，并支持呼吸者经历这些感受（有时这些感受令人恐惧），而不是再次压抑它们。出于这个原因，我不建议你独自进行这个过程。


