    That last sentence in Step 9 is probably the most important statement on the worksheet.
    It reinforces the notion that thoughts, feelings, and beliefs create our experiences,
    and that, furthermore, we order our reality in such a way as to support our spiritual
    growth. When we open ourselves to this truth, the problem almost always disappears.
    That’s because there are no problems, only misperceptions.


    The statement also challenges us to accept the possibility that the situation
    may be purposeful and to let go of the need to know the how and the why of it.
    This is where most intellectually inclined people have the greatest difficulty.
    They want proof before they believe anything. Therefore they make “knowing why”
    a condition for accepting the situation as a healing opportunity.


    It’s no good asking why things happen as they do, because this is asking to know
    the mind of God. At our current level of spiritual development, we cannot possibly
    know the mind of God. We must give up our need to know why (which is a victim’s
    question anyway), and surrender to the idea that God does not make mistakes, and
    therefore everything is in divine order.


    The importance of this step comes in its ability to help you feel your way out
    of the victim mode into the possibility that the person, object, or situation
    with whom you have the issue reflects precisely that part of yourself that you
    have rejected and which cries out to be accepted. It acknowledges that the divine
    essence within, the knowing part of yourself, your soul—whatever you want to call
    it—has set the situation up for you so that you can learn, grow, and heal a misperception
    or a false belief.


    This step also creates self-empowerment. Once we realize we have created a situation,
    we have the power to change it. We can choose to see ourselves as the victim of
    circumstance, or we can choose to see our circumstance as an opportunity to learn,
    grow, and have our lives be the way we want.


    Do not judge yourself for creating a situation. Remember, the divine part of yourself
    created it. If you judge the divine part of you, you judge God. Acknowledge yourself
    as a wonderful, creative, divine being with the ability to create your own lessons
    along the spiritual path, lessons that will eventually take you home. Once you
    are able to do this, you are able to surrender to the divine essence that you
    are and trust it to do the rest.


    ## IV. TOWARD THE REFRAME


    10. I now realize that I get upset only when someone resonates in me those parts
    of me I have disowned, denied, repressed, and then projected onto them.


    I see now the truth in the adage, “If you spot it, you’ve got it!” It’s me in
    the mirror!


    **Instructions:** These statements acknowledge that when we get upset with someone,
    that person is invariably reflecting back to us the very parts of ourselves we
    most despise and have projected onto them.


    If we can open ourselves enough to be willing to accept that this person is offering
    us a chance to accept and love a part of ourselves that we have condemned, and
    that he or she is a healing angel in that sense, the work will have been done.


    As I have said before, you don’t have to like this person. Just recognize them
    as a mirror, thank their soul by doing this worksheet, and move on. Neither do
    we need to figure out what parts of ourselves are being mirrored. Usually it is
    far too complicated anyway. Let it go at that, and don’t be drawn into an analysis.
    It works best without it.


    11. `Jeff` is reflecting what I need to love and accept in myself. Thank you `Jeff,`
    for this gift. I am now willing to take back the projection and own it as a part
    of my shadow. I love and accept this part of me.


    **Instructions:** This statement reminds us that through our stories, which are
    always full of misperceptions, we create our reality and our lives. We will always
    draw people to us who will mirror our misperceptions and offer us the opportunity
    to heal the error and move in the direction of truth.


    12. Even though I may not understand it all, I now realize that you and I have
    both been receiving exactly what we each had subconsciously chosen and were doing
    a dance with and for each other to bring us to a state of awakened consciousness.


    **Instructions:** This statement serves as yet another reminder that we can instantly
    become aware of our subconscious beliefs if we look at what shows up in our lives.
    What we have at any particular point in time truly is what we want. We have, at
    the soul level, chosen our situations and experiences, and our choices are not
    wrong. This is true for all parties involved in the drama. Remember, there are
    no villains or victims, just players. Each person in the situation is getting
    exactly what he or she wants. Everyone is engaged in a healing dance.


    13. I now realize that nothing you, `Jeff,` have done is either right or wrong.
    I am able now to release the need to blame you or anyone else. I release the need
    to be right about this, and I am willing to see the perfection in the situation
    just the way it is.


    **Instructions:** This step goes against everything we have ever been taught about
    being able to distinguish between right and wrong, good and evil. After all, the
    whole world gets divided up along those lines. Yes, we know that the World of
    Humanity is really just an illusion, but that doesn’t alter the fact that human
    experiences demand that we make these particular distinctions in our daily lives.


    What helps us with this step is realizing that we are only affirming that there
    is no right or wrong, good or bad, when seeing things from the spiritual big-picture
    standpoint—from the perspective of the World of Divine Truth. From there we are
    able to get beyond the evidence of our senses and minds and see divine purpose
    and meaning in everything. Once we are able to see that, we can also see that
    there is no right or wrong. It just is.


    This step also confronts you with the perfection in the situation and tests your
    willingness to see this perfection. While it will never be easy to see the perfection
    or good in something such as child abuse, we can be willing to see the perfection
    in the situation, be willing to drop the judgment, and be willing to drop the
    need to be right. Obviously, the closer we are to a situation, the more difficult
    it becomes to see its perfection, but seeing the perfection does not always mean
    understanding it. We cannot know the reasons why things happen as they do; we
    must simply have faith that they are happening perfectly and for the highest good
    of all.


    Observe your strong need to be right. We possess an enormous investment in being
    right, and we learned at an early age to fight to be right, which usually means
    proving that someone else is wrong. We even measure our self-worth by how often
    we are right; thus it is no wonder we have such trouble accepting that something
    just is—that is inherently neither right nor wrong. If you really cannot at this
    point drop your judgment about something that seems awful, just reconnect with
    your feelings (see Step 3 above), move into them, and admit to yourself that you
    cannot yet take this step. Still, be willing to drop your judgment. Willingness
    always remains the key. It creates the energetic imprint of Radical Forgiveness.
    As the energy shifts, all else follows.


    14. I am willing to see that, for whatever reason, my mission or “soul contract”
    included experiences like this and that you and I may have agreed to do this dance
    with and for each other in this lifetime. If it is for the highest good for both
    of us. I now release you and me from that contract.

