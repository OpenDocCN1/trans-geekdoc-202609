    对我来说，奇怪又可疑的是杰夫（Jeff）那种反常的行为。我所认识的杰夫对女儿很有感情，而且在情感上完全完全极度需要她们的认可和爱，但我从未见过他表现出吉尔（Jill）所描述的那种样子。我一直认为他对吉尔很体贴、深情。事实上，我很难相信他会对她如此残忍。很容易理解为什么这种情况让吉尔感到不快乐，而杰夫坚持认为这一切都是她的幻觉，是她在自作出精神疾病，这如何让她的处境变得更加糟糕。


    第二天，对话持续着。我开始从`激进宽恕`（Radical Forgiveness）的角度来构思吉尔和杰夫之间可能发生了什么，但决定不提这件事——至少现在不。她太陷于这种局势的戏剧性中了，无法听进去并理解我想说的话。`激进宽恕`基于一种非常广阔的灵性视角，而当我们还住在英国时，这并不是我们共同的现实。我确定她和约翰（John）并不知道我`激进宽恕`背后的信念，我觉得还没到引入像“这一切本就如此完美——而且是一个治愈的机会”这样极具挑战性的想法的时候。


    在口头上反来覆地绕了问题两天后，我决定时候该我尝试`激进宽恕`的方法了。这需要我姐姐对一种可能性开放：在表象之外正发生着某些事情——某种有目的的、受神引导的、且为了她最高利益的
    string。然而，她太执着于做局势中的受害者了，我不确定是否能让她听取对杰夫行为的解释，从而让她脱离那个角色。尽管如此，正当我姐姐再次开始重复她前一天说过的话时，我决定干预。我试探性地说：“吉尔，你愿意从不同的角度来看待这种情况吗？你愿意听我对正在发生的事情给你一个完全不同的解释吗？”


    她疑惑地看着我，仿佛在想：怎么可能还有另一种解释呢？事实就是这样啊！不过，我在吉尔那里有一定的良好的信誉，因为我以前曾帮她解决过一段感情关系问题，所以她足够信任我，说道：“嗯，我想可以吧。你有什么想法？”


    这是我一直在等的。“我要说的话可能听起来很奇怪，但在我说完之前试着不要质疑。只需保持对我所说的可能是真的持开放态度，看看我说的话对你来说是否有任何道理。”


    到目前为止，约翰一直尽力关注吉尔，但关于杰夫的不断重复的对话已经让他感到极度无聊。事实上，他已经在很大程度上忽略了她。现在我敏锐地察觉到，我的插话让约翰精神一振，重新开始听了。


    “吉尔，你向我们描述的这些，无疑代表了你所看到的真相，”我开始说。“我心里一点也不怀疑这件事正像你所说的那样发生。而且，约翰在过去的三周里见证了很多情况，并证实了你的说法——对吧，约翰？”我转向我哥哥问道。


    “绝对是，”他说。“我看到很多时候都是，正如吉尔说的一样。我觉得非常奇怪，而且老实，很多时候待在那儿我觉得很尴尬。”


    “我不感到意外，”我说。“无论如何，吉尔，我想让你知道，我要说的任何话都没有否定你所说的话，也没有让你的故事无效。我相信它的发生正如你所说的那样。然而，让我给你提示一下在这种局面之下可能正在发生什么。”


    “你说的‘局面之下’是什么意思？”吉尔问，怀疑地看着我。


    “认为‘外在’的一切就是现实的全部，这完全是自然的，”我解释道。“但也许在现实之下还有更多事情在发生。我们没有感知到其他正在发生的事，是因为我们的五感不足以完成这项任务。但这并不意味着它没有发生。”


    “以你的情况为例。你和杰夫正陷入这种戏剧中。这很清楚。如果在这种戏剧之下，发生着某种更具灵性本质的事情呢——同样的人，同样的事件，但完全不同的意义？如果你们两个灵魂在跳同一种舞，但伴随着完全不同的曲调呢？如果这段舞蹈是关于你的治愈呢？如果你能把它看作是一个治愈和成长的机会呢？这将是非常不同的解释，不是吗？”


    她和约翰都看着我，仿佛我现在在说一种外语。我决定放弃解释，直接进入体验层面。


    “回望过去的三个月左右，吉尔，”我继续道，“当你看到杰夫对女儿洛恩（Lorraine）表现那么爱时，你大部分感受是什么？”


    “主要是愤怒，”她说，但继续思考着。“挫败感，”她补充道。接着，在长时间的沉默后，“还有悲伤。我真的很难过。”泪水涌满了她的眼睛。“我觉得如此孤独、不被爱，”她说，开始轻声抽泣。“如果我觉得他无法表现出爱，那还好，但他可以，而且他做到了——对`她!`！”


    她激烈而愤怒地吐出最后几个词，并自从到来以来第一次失控地痛哭起来。在此之前她流过几滴泪，但她并没有真正让自己哭出来。现在，她终于放下了。我很高兴吉尔能如此迅速地接触到她的情绪。


    整整十分分钟后，吉尔的哭声平静了，我觉得她可以交流了。那时我问：“吉尔，你记得小时候也曾有这种感觉吗？”她毫不犹豫地说：“有。”她没有立刻说明是什么时候，所以我让她解释一下。她花了一段时间才回答。


    “爸爸也不爱我！”她终于爆发出来，再次开始抽泣。“我想要他爱我，但他不。我想他谁都不爱！然后你的女儿出现了。他爱她，完全是如此。那他为什么就不爱我呢，该鬼？”她用力击打桌面，大喊着这些话，陷入了更加失控的哭泣。


    吉尔指的是我的大女儿洛恩。巧合的是，或者说是同步性，她和杰夫的大女儿同名。


    哭泣对吉尔来说感觉很畅快。我知道她对我们父亲表达的意思。他是一个善良温和的人，但非常安静、内向。在大多数时候，他对他任何人来说确实是情感缺失的。

