    \ hurt people. It was also an oddity that both girls had the same name—Lorraine.\
    \ It was a synchronicity that John was on a trip from Australia and was going\
    \ on to Atlanta to see Colin, which meant I could tag along whereas I never would\
    \ have done it on my own. The timing could not have been better.*\n\n**Instructions:**\
    \ This step recognizes that we are curious human beings and that we have an insatiable\
    \ need to know why things happen as they do. So although I have said elsewhere\
    \ that we must abandon our need to know, this step offers us the chance to have\
    \ some fun looking for some of the more obvious clues that would offer evidence\
    \ that the situation was always perfect in some unexplainable way. So long as\
