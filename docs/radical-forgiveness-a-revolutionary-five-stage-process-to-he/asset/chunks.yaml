    in touch with the original pain and become acquainted with your belief system
    about yourself. In fact, his first acts of unfaithfulness represented your first
    opportunities to practice Radical Forgiveness and to heal your original pain,
    but you missed them. You made him wrong each time and created yourself as a victim
    instead, which made healing impossible.”


    “What do you mean, forgiveness?” Jill asked, still looking troubled. “Are you
    saying I should have forgiven him for seducing my best friend and anyone else
    he could find who was willing?”


    “I am saying that, at that time, he provided you with an opportunity to get in
    touch with your original pain and to see how a certain belief about yourself was
    running your life. In so doing, he gave you the opportunity to understand and
    change your belief, thus healing your original pain. That’s what I mean by forgiveness.
    Can you see why he deserves your forgiveness, Jill?”


    “Yes, I think so,” she said. “He was reflecting my belief—the one I had formed
    because I felt so unloved by Dad. He was making me right about not being enough.
    Is that correct?”


    “Yes, and to the extent that he provided you with that opportunity, he deserves
    credit—actually, more than you realize right now. We have no way of knowing whether
    he would have stopped his behavior had you healed your issue around Dad at that
    time—or whether you would have left him. Either way, he would have served you
    powerfully well. So in that sense, he deserves not only your forgiveness but your
    deep gratitude as well. And you know what? It wasn’t his fault that you didn’t
    understand the true message behind his behavior.


    “I know it was hard for you to see that he was trying to give you a great gift.
    That’s not how we are taught to think. We’re not taught to look at what is going
    on and say, ‘Look what I have created in my life. Isn’t that interesting?’ Instead,
    we are taught to judge, lay blame, accuse, play victim, and seek revenge. Neither
    are we taught to think that our lives are directed by forces other than our own
    conscious mind—but, in truth, they are.


    “In fact, it was Henry’s *soul* that tried to help you heal. On the surface, he
    just acted out his sexual addiction, but his soul—working with your soul—chose
    to use the addiction for your spiritual growth. Recognizing this fact is what
    Radical Forgiveness is all about. Its purpose lies in seeing the truth behind
    the apparent circumstances of a situation and recognizing the love that always
    exists there.”


    I felt that talking about her current situation would help Jill fully understand
    the principles I had described, so I said, “Let’s take another look at Jeff and
    see how these principles are operating in your current relationship. In the beginning,
    Jeff was extremely loving toward you. He really doted on you, did things for you,
    communicated with you. On the surface, life with Jeff seemed pretty good.


    “Remember, though, this didn’t fit your picture of yourself—your belief about
    yourself. According to your belief, you shouldn’t have a man who shows you this
    much love. You are not enough, remember?”


    Jill nodded but still looked uncertain and rather perplexed.


    “Your soul knows you must heal that belief, so it colludes with Jeff’s soul somehow
    to bring it to your awareness. On the surface it seems that Jeff begins to act
    strangely and totally out of character. He then taunts you by loving another Lorraine,
    thus acting out with you the very same scenario you had with your father many
    years ago. He appears to be persecuting you mercilessly, and you feel totally
    helpless and victimized.


    “Does this describe, more or less, your current situation?” I asked.


    “I guess so,” Jill said quietly. She wrinkled her brow as she tried to hold on
    to the new picture of her situation slowly forming in her mind.


    “Well, here you are again, Jill, about to make a choice. You must choose whether
    to heal and grow—or to be right,” I said and smiled. “If you make the choice people
    normally make, you will choose to be the victim and make Jeff wrong, which in
    turn will allow you to be right. After all, his behavior seems quite cruel and
    unreasonable, and I don’t doubt there are many women who would support you in
    taking some drastic action in response to it. Haven’t most of your friends been
    saying you should leave him?”


    “Yes. Everyone says I should get out of the marriage if he doesn’t change. I actually
    thought you would say that too,” she added with a tinge of disappointment.


    “A few years ago, I probably would have. But since my introduction to these spiritual
    principles, my whole way of looking at such situations has changed, as you can
    see,” I said with a wry smile, looking across at John. He grinned but said nothing.


    I continued. “So as you might guess, the other choice might be to recognize that
    beneath what seems to be happening on the surface, something else much more meaningful—and
    potentially very supportive—is going on. The other choice is to accept that Jeff’s
    behavior may contain another message, another meaning or intent, and that within
    the situation lies a gift for you.”


    Jill thought for a while, then said, “Jeff’s behavior is so darn bizarre, you’d
    have a hard time coming up with any good reason for it. Maybe something else is
    going on that I don’t yet see. I suppose it’s similar to what Henry was doing,
    but it’s hard for me to see it with Jeff because I’m so confused right now. I
    can’t see beyond what is actually going on.”'
