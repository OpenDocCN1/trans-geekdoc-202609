    # 激进原谅


    Colin Tipping 旁白音频/W1455D 3 张 CD，包含 E-CD 售价 $24.95/ISBN: 978-1-59179-767-8 UPC:
    600835-145527 音频产品提供 CD 和数字下载版。


    ## 背封内容


    **《作家世界摘要》奖得者**


    “这是长期以来出版的关于原谅最令人兴奋的书。我从未见过关于这个主题写得如此出色、如此‘切中要害’的作品。我向所有人推荐《激进原谅。”


    –尼尔·唐纳德·沃尔许，《与神的对话》作者


    “《激进原谅》是必读之作！这些内容如此深奥却又完全易于理解，任何人都能感受到它的转化力量。”


    –詹姆斯·F·泰维曼，和平吟游诗人，《证明：化身天人合一的 40 天计划》作者


    在发生的一切背后是否有一个神圣的意图？如果你愿意接受这种可能性，你生活的方方面都能发生改变。这就是科林·蒂平（Colin Tipping）革命性方法背后的理论，该方法能让你体验到激进原谅带来的自由、和平和重生的能量。在《激进原谅》中，蒂平为我们提供了循序渐进的指导，这始于一个治愈过程，最终演变为在世界上生活的一种全新方式。发发现如何将愤怒、恐惧和怨恨等负面情绪转化为无条件的爱、感激与和平。探索激进原谅的五个基本阶段，以及它们如何帮助我们超越受害者原型并拥抱生命固有的完美。并运用激进原谅的工具将这一切付诸实践——一系列快速、有效且易于使用的技巧。


    ## 关于作者


    Colin Tipping 出于英国，在 1984 年移民美国之前曾任教于伦敦大学。他与妻子 JoAnn 共同创立了 Georgia CancerHelp
    项目和 Together-We-Heal, Inc. 公司，并创立了激进原谅疗法与教练学院。除了《激进原谅》，蒂平还编写了基于激进原谅实践的一系列书籍、音频和在线课程。`radicalforgiveness.com`


