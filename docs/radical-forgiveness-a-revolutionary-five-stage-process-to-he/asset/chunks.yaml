- fmt: '

    Our collective mission to transform the victim archetype demands that we all follow
    Mandela’s lead and move beyond the experience of victimhood. If we do not, we
    will stay hopelessly addicted to our woundedness and to the victim archetype.


    ### Spirit Nudges


    Deep inside our subconscious mind, we are in touch with our mission. Spirit keeps
    presenting opportunities to transform the victim energy by bringing things like
    incest, child abuse, sexual abuse, and racial hatred to the surface. Each one
    of us can embrace this mission by practicing `Radical Forgiveness` in any of these
    situations. If achieved by enough of us, the shift in perception that allows us
    to see the perfection in the situation will transform it so that the need for
    such energy patterns disappears.


    ### Exercise in Transformation


    To transform the victim archetype, practice the following: Every time you watch
    the news, shift your consciousness from one of judgment to one of seeing the perfection
    in the situation. Instead of accepting at face value a story about racial prejudice,
    for example, help transform the energy of racial disharmony. Do so by looking
    at the person or situation that would ordinarily receive your judgment and censure
    and see if instead you can move into a space of loving acceptance. Know that the
    people in the story are living out their part in the divine plan. Do not see anyone
    as a victim and refuse to label anyone a villain. People are just acting in dramas
    being played out so that healing can occur. Remember, God does not make mistakes!


    # 12


    ### The Ego Fights Back


    By reminding us that we are spiritual beings having a human experience, `Radical
    Forgiveness` raises our vibration and moves us in the direction of spiritual evolution.


    Such growth represents a real threat to the ego (defined here as the deep-seated,
    complex belief system that says we are separated from God and that He will one
    day punish us for choosing that separation). This is because the more spiritually
    evolved we become, the more likely it is that we will remember who we are—and
    that we are one with God.


    Once we have this realization, the ego must die. If there is one thing we know
    about belief systems of any kind, they resist all attempts at making them wrong—and
    the ego is no exception. (People demonstrate all the time that they would rather
    be right than happy.)


    Therefore, the more we use `Radical Forgiveness`, the more the ego fights back
    and tries to seduce us into remaining addicted to the victim archetype. One way
    it accomplishes this task is by using our own tools of spiritual growth. A good
    example of this is found in the ego’s use of “inner child work” to keep us stuck
    in victimhood.


    Inner child work gives us a way to look within and heal the wounds of childhood
    that we still carry within us as adults and that continue to affect our lives
    today. In our focus on our woundedness even however, the ego sees an opportunity.
    It exploits the kind of inner child work that uses the inner child as a metaphor
    for our woundedness, in order to strengthen our attachment to the victim archetype.
    The behavior this gives rise to is the constant revisiting of our wounds, giving
    them power through constantly speaking about them, projecting them onto a so-called
    inner child, and using them as the means to finding intimacy.


    Much of the inner child work of the 1980s focused heavily on blaming our parents,
    or someone else, for the fact that we were unhappy as adults. The idea “I would
    be happy today if it weren’t for my parents” is the mantra associated with this
    work. It gives us permission to feel that “they did this to us,” a perception
    that is much easier to live with than believing that we have somehow `requested`
    to be treated in this manner. Such a viewpoint automatically recreates us as victim.
    As long as we continue to blame our parents for our problems, each succeeding
    generation continues this belief pattern.


    I do not wish to imply that getting in touch with our repressed childhood rage
    and pain and finding ways to release it are bad. In fact, doing so is essential.
    We must first do this work before moving on to forgiveness, for we cannot forgive
    if we are angry. But too many workshops and therapies focus purely on the anger
    and fail to help us transform it through forgiveness of any kind. When we couple
    anger work with `Radical Forgiveness`, all sorts of repressed emotional and mental
    toxicity are cleared and the permanent release of anger becomes possible. Thus
    we move out of woundedness and beyond victimhood.


    ### THE NAVAJO FORGIVENESS RITUAL


    I once heard Caroline Myss, author of *Why People Don’t Heal and How They Can,*
    describe the ritual that the Navajo used for preventing woundology from becoming
    an addictive pattern. While they certainly recognized the need for people to speak
    of their wounds and to have them witnessed by the group, they understood that
    speaking about their wounds gave the wounds power, especially when done to excess.
    Therefore, if a person had a wound or a grievance to share, the tribe would meet
    and the person could bring it to the circle. This person was allowed to air his
    grievance three times, and everyone listened with empathy and compassion. On the
    fourth occasion, however, as the person came into the circle, everyone turned
    their backs. “Enough! We have heard you express your concern three times. We have
    received it. Now let it go. We will not hear it again,” they said. This served
    as a powerful ritual of support for letting go of past pain.


    Imagine what would happen if we were to support our friends in that same manner.
    What if, after they had complained about their wounds and their victimization
    three times, we then said, “I have heard you enough on this subject. It’s time
    you let it go. I will not give your wounds power over you any longer by allowing
    you to talk about them to me. I love you too much.”


    I am sure that if we did this, many of our friends would call us traitors. They
    would likely see our behavior not as an act of pure, loving support but of betrayal,
    and they might turn against us immediately.


    If we are to truly support each other on the journey of spiritual evolution, we
    have no choice but to take the risk, draw a line in the sand with those we love,
    and do our best to gently help move them beyond their addiction to their wounds.
    Such action will lead us to the achievement of our collective missions to transform
    the victim archetype and to remember who we really are.


    # 13


    ### Time, Medicine, and Forgiveness


    Spiritual evolution brings with it a new appreciation for and knowledge of our
    physical bodies and how to care for them. The medical paradigm we have held for
    the last three hundred years—ever since the French philosopher René Descartes
    defined the body as a machine—is changing radically as it moves toward a holistic,
    mind-body approach.


    We used to think of health as the absence of disease. Now we think of it in terms
    of how well our life force prana, chi. flows through our bodies. For optimum health,
    this life force must be able to flow freely. We cannot be healthy if our bodies
    are clogged with the energy of resentment, anger, sadness, guilt, and grief.


    When we speak here of the body, we include not only the physical body, which is
    also an energy body, but the subtle bodies that surround us as well. These we
    refer to individually as the etheric body, the emotional body, the mental body,
    and the causal body. Each has a different frequency. Whereas we used to define
    the physical body in terms of chemicals and molecules, physicists have taught
    us to see all five bodies, including the physical one, as dense condensations
    of interacting energy patterns.

