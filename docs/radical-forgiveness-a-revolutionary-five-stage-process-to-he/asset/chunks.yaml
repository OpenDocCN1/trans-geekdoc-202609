    Proof of this is continually showing up as a byproduct of organ replacement surgery.
    One celebrated story concerns a person who received a liver transplant. Some months
    after the operation, he began having a recurring dream that did not make sense
    to him. After some investigation, he discovered that the person who had donated
    the liver had dreamed the same dream for many years. The memory of that dream
    was apparently embedded in the cellular structure of the liver.


    ### The Causal Body or Intuitional Field


    At the next octave up lies the body we might call our soul, our Higher Self, or
    our connection to the World of Divine Truth. Also called the causal body, this
    one provides our bridge to the spiritual realm. Whereas the mental field deals
    with ideas and thought forms at the concrete level, this field deals with them
    at the conceptual, abstract, iconic, and symbolic level. It deals with essence,
    intuition, and “direct knowing.” The causal body extends beyond the individual
    and penetrates the collective mind—or what Jung called the collective unconscious,
    a single mind to which we all individually connect and have access.


    The idea of subtle bodies rising in harmonics is by no means new; it has been
    included in many great spiritual traditions throughout the whole world, especially
    those of the East.


    **Assumption:** Universal energy as life force and consciousness is brought into
    our body via the chakra system. The first three chakras are aligned with the World
    of Humanity while the fourth through eighth align more closely with the World
    of Divine Truth.


    In addition to the ocean of energy containing our differently vibrating subtle
    bodies, we human beings possess a system of energy centers that align vertically
    in our bodies. These are known as chakras—“wheel” in Sanskrit, because they are
    like vortices of spinning energy.


    The chakras act like transformers. They take the energy or life force (`prana`,
    `chi`, `Christ energy`) that comes to us from the universe and step it down to
    frequencies that can be used by the biomolecular and cellular processes of the
    physical body. The chakras also represent the locations where each of the subtle
    bodies link to the physical body, thus bringing different levels of consciousness
    into our being. They process our daily experiences, thoughts, and feelings while
    also carrying long-term data relating to personal and tribal history, long-established
    thought patterns, and archetypes. (FIGURE 13)


    ![](Images/part3_chapter15_image001.jpg)


    FIGURE 13: The Human Chakra System


    The first three chakras possess levels of consciousness vibrating at the lower
    frequencies of the existential chain and rooted in the World of Humanity. They
    carry the energy of the victim archetype. Traditional forgiveness is the only
    type of forgiveness possible with the consciousness of the first three chakras.
    The consciousness that comes through the fifth, sixth, seventh, and eighth chakras
    is more likely to align with energies from the World of Divine Truth, while the
    fourth, the heart chakra, provides the link between the World of Humanity and
    the World of Divine Truth.


    In addition, each chakra is associated with an endocrine gland and corresponds
    to a particular nerve nexus in the same area. Each also has a color and sound
    associated with it, and each nourishes a particular part of the body. Chakras
    also serve as information databanks and processors associated with the parts of
    the body to which they are attached and the functions they serve.


    | • || The first (root) chakra carries data relating to being grounded to Mother
    Earth and issues of basic trust, security, and the will to live. This chakra runs
    on tribal/social consciousness. |

    | --- | --- |

    | • || The second (sacral) chakra carries data relating to creativity, sexual
    energy, and guilt. This chakra runs on tribal/social consciousness. |

    | --- | --- |

    | • || The third (solar plexus) chakra carries data relating to power, control,
    and betrayal. This chakra runs on tribal/social consciousness. |

    | --- | --- |

    | • || The fourth (heart) chakra carries data relating to love, nurturing, and
    compassion. This chakra runs on individual consciousness. |

    | --- | --- |

    | • || The fifth (throat) chakra carries data relating to personal power, relationships,
    and expression. This chakra runs on individual consciousness. |

    | --- | --- |

    | • || The sixth (third eye) chakra carries data relating to intuitive knowledge,
    clairvoyance, and truth. This chakra runs on individual consciousness. |

    | --- | --- |

    | • || The seventh (crown) chakra carries data relating to spiritual awareness
    and connection to Source. This chakra runs on individual consciousness. |

    | --- | --- |

    | • || The eighth chakra, which lies above the head, represents our contract or
    agreement for life’s mission. |

    | --- | --- |


    Though central to Eastern traditions, the chakra system gets zero attention from
    Western medical science. When these energy centers become out of balance—as they
    do when emotionally upset or traumatized, for instance—they reverse rotation,
    become very erratic, and in some cases close down. Anger, resentment, and hurt
    will tend to close the heart and throat chakras; guilt and lack of trust will
    weaken the sacral, and so on. Fortunately, chakras can be restored to balance
    quite easily. There are practitioners who are sensitive enough to feel the energy
    of each chakra and have techniques for rebalancing them. Most forms of energy
    medicine such as acupuncture, homeopathy, aromatherapy, and many others act directly
    on the chakras and bring them into balance.


    ## part four


    # Tools for Radical Forgiveness


    #### 16


    ### A Spiritual Technology


    In writing the first edition of this book, I had two objectives in mind. First,
    I wanted to explain the concept of Radical Forgiveness as simply as I could in
    order to make it accessible to many people as possible. Second, I wanted to make
    it as practical as I could so that people could use it in their everyday lives.
    That meant including tools that were not only effective but quick and easy to
    use.


    As I write this edition, I confess that the extent to which the tools in this
    book have proven effective more than surprises me. I find myself in awe of how
    extraordinarily powerful they have proven to be in helping people heal their lives.
    I have also come to realize that they work in a way not dissimilar to how homeopathic
    remedies work. That is to say they work holo-energetically (using the energy of
    the whole).


    In a holographic universe, each minute part of the universe is not only connected
    energetically to the whole, but contains the whole. Therefore, from an energetic
    standpoint, you cannot change one part without affecting the whole.

