  trans: "\n你的高阶自我知道那些想法不仅是胡说，而且极具毒性，因此虽然它无法直接干预（因为灵性赋予了我们自由意志），但它会将某些带入你的生活，他们会充满爱地不断“演绎”你故事中的部分，直到你意识到那并非事实。\n\
    \n同样，这就是在我姐姐吉尔（Jill）身上发生的事情。当我们的父亲对我女儿洛莱恩（Lorraine）表现出吉尔一直渴望从他身上获得但从未感受过的那种爱时，吉尔认为这意味着她天生是不值得被爱的。这成了她深信的故事，直到她给生活带入了一个人（`Jeff`），那个人让她发现了自己的故事，并看到那是虚假的。\n\
    \n### 杰西的故事\n\n有时你意识这段这段故事，有时没有。杰西（Jesse）曾参加我的一场研讨会，她似乎完全清楚自己的故事，但仍然没有看出其中的错误。尽管她在灵性上非常觉醒。她告诉我们她刚被解雇了。“没关系，”她说，“这是我的遗弃问题在再次作祟。我每隔几年就会被解雇或失去一段关系。这是因为我婴儿时期被遗弃了。”\n\
    \n我怀疑这是一个胡编的故事，于是开始调查关于“遗弃”的情况。我们很快发现，她的父亲在她出生前就去世了，她的母亲在杰西大约两岁时生病了，无法应对。因此，杰西由她的祖父母抚养了一段时间。\n\
    \n尽管她无疑因与母亲分离而受到了创伤，但事实的真相是，她的父母从未遗弃过她——他们只是由于客观原因而缺席了。遗弃某人是经过计算且有意识地选择离开。这是一种故意的。单纯的缺席并不构成遗弃。\n\
    \n将缺席等同于遗弃是一个小孩子很容易做出的解读，而其意义远超语义本身。由于将父母的缺席解读为遗弃，她又产生了许多其他解读，例如：“如果我的父母遗弃了我，我一定是一个非常不值得被爱的人。没有人会跟我在一起超过两年，因为如果我妈妈在那个之后遗弃了我，那么每个人都会这样做。在那之后他们就不再需要我了。他们会意识到我是个坏人并离开。生活就是这样。”\n\
    \n杰西在五十二年里一直生活在这个特定的故事里。然而，它是建立在对情况的完全误解之上。一旦她看清了这一点，从那时起她能够放下它，并从每隔两年制造一次遗弃的需求中解放。。尽管她拥有灵性觉知，但她一直没有意识到，通过每隔两年提供一次遗弃的案例，灵性实际上是在给她机会觉醒并治愈一个限制她生活并伤害她灵魂的毒性故事。针对上一个解雇她的人进行一些“激进宽恕”（Radical\
    \ Forgiveness）工作表，帮助她清除了她五十二年里其他所有被“遗弃”的时刻，并中和了她最初的遗弃故事。\n\n### 宽恕离心机\n\n一种工具可能拯救吉尔和杰西多年痛苦的挣扎。宽恕离心机帮助我们把任何特定情况下的*实际发生的事*与我们对发生事情的*解读*分开。如果你拥有那种榨汁机，把胡萝卜和其他东西放入顶部，通过旋转搅拌器的离心力将果汁与纤维分离，你就知道*离心机*这个词的意思了。离心机也用于从血液中分离血浆、从牛奶中分离奶油等。洗衣机旋转甩出衣服多余水的原理也是相同的。（图\
    \ 15）\n\n![](img/part4_chapter20_image002.jpg)\n\n图 15：将事实与虚构分离\n\n宽恕离心机只是反转了我们产生发生在我们身上的事情故事的过程。要使用它，拿出你正在经历的故事——那个让你感到不安的故事。记住，它无疑是事实（发生了什么）和解读（你对发生的事情的所有想法、判断、评估、假设和信念）的绝望混合物。将这个故事投入虚构的离心机顶部，就像你向榨汁机里放入胡萝卜一样，然后在你的脑海中，看到机器将事实与解读分开。\n\
    \n然后，像任何优秀的研究人员一样，首先根据浮出现的事实列出一个清单，尽可能客观。然后列出你对这些事实所做的解读清单。（图 16）\n\n![](img/part4_chapter20_image003.jpg)\n\
    \n图 16：关于发生事情的事实\n\n写下你的结果后，承认并接受这些事实。意识到这些事实说明了发生了什么，而且没有人能改变它。你别无选择，只能允许发生的事情就是它发生的样子，但要留意任何为发生的事情寻找借口的倾向——这会再次将解读强加于事实。只需留在实际发生的事情上。\n\
    \n检查检查强加在发生的事情上的每一个想法、信念、合理化、观点或态度，并宣布它们全都是*不真实的*。肯定它们没有一个具有有效性。告诉自己它们只是脑子里的思绪（mind-talk）。然后，意识到你的想法、信念和态度对你有多重要。在\
    \ `1-100` 的范围内，在左侧列标明你认为对每种解读有多大的执着，然后决定哪些你可能准备放弃，哪些你还没有。\n\n### 对自己温柔一点\n\n不要因为执恋于这些任何想法、信念或态度，或因为不愿放下它们而埋备自己。你可能拥有它们很长时间。事实上，它们可能定义了你是谁。例如，如果你是乱伦幸存者或酗酒者的成年子女，这些标签代表了关于你自己的想法或信念，可能为你提供你是谁的参考。如果你放下了与这些标签相关的想法，你可能会失去身份认。所以，虽然你想在将真实的与你虚构的隔离开来时对自己保持坚定，但要对自己温柔一点，给予时间释放这些信念。（图\
    \ 17）\n\n![](img/part4_chapter20_image004.jpg)\n\n图 17：我对发生事情的解读\n\n此后的下一步是进行“激进宽恕重构”（Radical\
    \ Forgiveness reframe）——看到那个故事是完美的，必须以那种方式上演。当你发现自己围绕一组不真实的信念创造了整个生活时，留心你可能产生并指向自己的内疚、愤怒、抑郁和批评。请，不要这样做。相反，请记住万物皆有目的，上帝不会犯错。使用一种或多种宽恕工具来努力宽恕自己，并看到你处境中的完美。\n\
    \n## \n\n# \n\n#### 21\n\n### 激进宽恕工作表\n\n激进宽恕工作表源于宽恕领域的先驱`迈克尔·莱斯博士`创建的一个。他是与我的导师`阿诺德·专利`一起鼓励我开发激进宽恕的人之一。\n\
    \n从 `1989` 年我以`莱斯博士`的工作表为最初灵感创作出激进宽恕工作表的那刻起，它真的改变了成千上万人的生活。很难解释它是如何或为什么取得如此巨大的成果，只能说它帮助人们转变能量。事实上，你可以说做工作表本身就是能量体验。\n"
- fmt: '

    As I have already indicated, all the tools in the Radical Forgiveness tool kit
    are holographic in nature and require very little in the way of skill, belief,
    knowledge, or cognitive understanding. All that is required is the willingness
    to be open to the possibility that there might be a certain perfection in the
    situation—even if you don’t feel like saying it and don’t really believe it. The
    worksheet is simply a way of expressing this willingness to be willing. Your spiritual
    intelligence picks up on your willingness and makes the connection to Universal
    intelligence, whatever that is for you. For that reason, I like to think of the
    worksheet as a form of secular prayer.


    Because the worksheet is an energetic instrument that works holographically, it
    is not subject to the limitations of time and space. That’s why the effect is
    often immediate and distance is never a factor. Doing the worksheet immediately
    releases the stuck energy in the situation, with the result that everything seems
    to resolve itself automatically.


    Now that you have read this far in the book, you will understand that any time
    anyone upsets you or triggers negative emotion in you, it’s an opportunity to
    grow. Where before you would have been sucked into the drama, now you can reach
    for a worksheet, start the forgiveness process immediately, and get results fast.


    Sometimes one worksheet is enough, but if the energy is very stuck, it might take
    many more. It’s difficult to tell. Just keep doing worksheets until the energy
    around the situation, person, or incident dissipates. This could take days or
    even months.


    You will know when you have reached a place of forgiveness by how you feel. If
    you find yourself simply feeling neutral when meeting the person again, speaking
    to them on the phone, or even thinking about them, you are probably 90 percent
    there with little or no charge left around the person or the situation. You are
    100 percent there when you can feel nothing but love for that person.


    The worksheet in section entitled “THE RADICAL FORGIVENESS WORKSHEET” can be enlarged
    and photocopied, but you might prefer to download a letter-size one from `soundstrue.com/radicalforgiveness`.


    It helps when completing the worksheet to have a reasonable grasp of the principles
    underlying Radical Forgiveness, and the following notes serve as a reminder of
    them. By way of example, answers are filled in as if Jill had completed it at
    the time she was going through the situation with Jeff as portrayed in Chapter
    1.


    When we begin working with Radical Forgiveness, we have a tendency to want to
    do too many worksheets on too many people from our forgiveness list, and to focus
    on the major issues of the past. But one of Radical Forgiveness’s best characteristics
    lies in the fact that we do not have to dig up the past to heal the big wounds
    of yesteryear. Whoever is upsetting you `right now` is the person who represents
    `all` the people who have ever upset you for the same reason in the past. So work
    with that person first, even if you’re thinking that it’s no big deal. If it’s
    upsetting you, it `is` a big deal. It could easily lead you to what really matters.


    Another misconception is that Radical Forgiveness is just for dealing with the
    past. It is perfect for that, of course, but it becomes profoundly life-changing
    when you use it on a more or less daily basis. As soon as an issue arises, the
    idea is to use this worksheet, or one of the other tools in the book, to dissolve
    the energies attached to it.


    ### THE RADICAL FORGIVENESS WORKSHEET


    #### An Instrument for the True Transformation of Grievance


    Following is a sample filled-in worksheet and instructions for each step.


    **Date:** `8/7/09` **Worksheet:** `3`

    **Subject:** `Jeff`


    ##### I. TELLING THE STORY


    1. The situation around which I have an upset is or was *(Tell the story totally
    from your victim standpoint, i.e., old paradigm. Use additional paper if necessary.)*


    *Jeff is abandoning me by focusing all his attention and love on daughter Lorraine—completely
    ignoring me. He makes me wrong and accuses me of being mentally unbalanced. He
    makes me feel worthless and stupid. Our marriage is over, and it’s all his fault.
    He is forcing me to leave him.*


    **Instructions:** Be sure to write about the person or object in the third person.
    In other words, tell your story as if you were telling someone else what happened
    or is happening. Tell the story about your upset from the victim’s standpoint.
    (Victim consciousness is the old paradigm.) Don’t hold back. Describe what the
    situation is or was and how it feels for you right now, and/or what it felt like
    at the time. Do not edit or overlay it with any spiritual or psychological interpretation.


    2a. **Confronting X:** I am upset with you, `Jeff,* because ...


    *You have ruined our marriage. You have hurt me and rejected me. Your behavior
    stinks, and I am going to leave you, you bastard!*

    '
