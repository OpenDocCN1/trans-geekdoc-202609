  raw: "This explains why the decision to transform something can be made only from\
    \ the World of Divine Truth. We humans are so locked into our beliefs about pain\
    \ and suffering, fear and death, that even while we may believe that a particular\
    \ child’s soul came into this world to experience abuse and actually wants to\
    \ feel abused, we simply cannot stand by and watch this happen. While the mission\
    \ looks easy from the World of Divine Truth, it appears quite different down here\
    \ on the physical plane. Who could possibly leave a child in an abusive environment?\
    \ We cannot help but intervene. We are human!\n\nAs we saw in an earlier chapter,\
    \ we need to surrender to the idea that Spirit knows exactly what it is doing.\
    \ If it were not in the child’s highest and best interest for there to be an intervention\
    \ on its behalf, Spirit would set things up so that no one notices the abuse.\
    \ If on the other hand, Spirit decides an intervention serves the soul’s highest\
    \ good, it will arrange for that to occur. But this is not our decision. We as\
    \ human beings must always respond in the way that seems most humane, most caring\
    \ and compassionate, while at the same time knowing that love is contained in\
    \ the situation.\n\n#### **Radical Forgiveness Transforms**\n\nThis is not to\
    \ say that we as humans cannot contribute to the transformation of such energies\
    \ as those that create child abuse. We do so when we apply Radical Forgiveness\
    \ to the situation. If we truly forgive—in the radical sense—all those involved\
    \ in the abusive situation, we definitely have an impact on the energy pattern.\
    \ Ultimately, the child will have to forgive in order to change the pattern, but\
    \ each time any of us, in any situation, whether we are personally involved or\
    \ not, chooses to see the perfection in the situation, we change the energy at\
    \ once.\n\nI was once asked to address the National Society of Mediators at their\
    \ annual conference. I was only to have about forty-five minutes and they were\
    \ to be eating lunch while I spoke! I went early to listen in on their discussions\
    \ and try to get a feel for their way of thinking. I determined that, in terms\
    \ of background, about 50 percent of the attendees were lawyers and 50 percent\
    \ were counselors and that their commitment to mediation left them fairly open-minded\
    \ and flexible in their approaches to problem-solving. (FIGURE 9)\n\n![](Images/part2_chapter11_image001.jpg)\
    \  \n\nFIGURE 9: Mediation Energy Fields\n\nFor the first twenty minutes or so,\
    \ I did my best to explain the concepts and assumptions underlying Radical Forgiveness.\
    \ Then I drew the diagram above to represent the energetic relationship between\
    \ them and their clients.\n\nI then put it to them that their perception of the\
    \ situation they were mediating was likely to be such that what was happening\
    \ to Clients A and B was unfortunate at best and tragic at worst. I also suggested\
    \ that they saw their role as mediators as trying to make the best of a bad job\
    \ and resolve the situation in a way that would be the least damaging to both\
    \ parties and their dependents.\n\nThey agreed that this was a fair characterization\
    \ of their task and that the energy field around the situation for the clients\
    \ was one of hostility and mistrust. Had it been otherwise, they wouldn’t have\
    \ needed a mediator.\n\nThen I factored into the situation their own energy. They\
    \ saw that their energy field would normally contain thoughts and feelings related\
    \ to the perception that this was a “bad” situation. I also suggested that, even\
    \ though they were trying to mediate and help both clients, their perception of\
    \ the situation as “bad” fed into the clients’ energy field and reinforced their\
    \ victim consciousness.\n\n“What if,” I asked then, “instead of seeing this situation\
    \ as tragic and undesirable, you became willing to entertain the idea that this\
    \ is a divine plan unfolding exactly as it needs to unfold, and that each of the\
    \ parties, including the ones on the periphery, are in actuality getting exactly\
    \ what they subconsciously want at the soul level—and that this is true no matter\
    \ how this situation works out?\n\n“Do you think that would make a difference?\
    \ Your energy field, instead of being filled with fear-based thoughts and emotions,\
    \ would be filled with love. Do you think that would have an effect on how the\
    \ situation would finally become resolved?”\n\nSurprisingly, they understood.\
    \ Even the lawyers got it! There was broad acceptance of the idea that the way\
    \ they held the situation in their own minds was a powerful factor in determining\
    \ how the situation came out. They saw it from a cause-and-effect standpoint.\
    \ It was not that anything would be done differently or overtly changed; it would\
    \ just be that by their holding the idea that everything was perfect, the energy\
    \ would be allowed to move—without as much resistance—in whatever direction it\
    \ needed to move. That is what transforming energy means.\n\n### MORPHIC RESONANCE\n\
    \nWhat I have just described draws on Rupert Sheldrake’s theory of morphic fields\
    \ and morphic resonance. Sheldrake is an English biologist who postulates the\
    \ existence of fields which are self-organizing and self-regulating systems in\
    \ nature that organize and sustain patterns of vibratory or rhythmic activity.\
    \ Elements are attracted to each other by morphic resonance to create these fields,\
    \ which are constantly changing and evolving. When one element in the field changes,\
    \ this affects the whole field. The concept seems to be applicable at all levels,\
    \ from quantum phenomena to social group behavior.\n\nIn the human context, morphic\
    \ fields link individual members through extrasensory and energetic resonance\
    \ (consciousness), a process that is independent of time and space. This is why\
    \ when someone forgives, the effect is felt immediately by the person being forgiven\
