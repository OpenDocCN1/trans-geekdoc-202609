    The workshop was to take place in a monastery in the west of England, and, as
    it happened, most of the participants were spiritual healers. The workshop attendees
    and I arrived at the monastery, but there was no one from the monastery around,
    so we went in and rearranged the furniture. I began the workshop by explaining
    that life was essentially an emotional experience for the purpose of our spiritual
    growth and that the workshop was designed to help us get in touch with emotions
    we have buried. Well, you would have thought I was telling them they had to dance
    naked around a fire or something! Here’s the essence of what they all said: “Oh,
    no. We are spiritual. We have transcended our emotions. We don’t give our emotions
    any credence at all. If we have them, we simply ask Spirit to take them away,
    and we go straight to peace. We don’t believe in this kind of work.”


    About an hour into the workshop, I knew I had a disaster on my hands. It was like
    swimming through treacle. I couldn’t get through at all, and there was no way
    they were going to do this work. I was feeling progressively more awful every
    moment and was convinced that the workshop was going to fall apart completely.


    At this point Spirit intervened. A young monk in full habit burst into the room
    demanding to know who was in charge. When I said I was, he demanded that I go
    outside with him. He wanted to “talk” to me, but I could see that he was seething
    with anger; he was all red and puffed up. I said that I was conducting a seminar
    and that I would come and find him when I was finished.


    He went out very upset but came back almost immediately, clearly enraged. He pointed
    his finger at me, hooked it as if to motion me toward him, and screamed, “I want
    to see you, right now!”


    It was the gesture with the finger that got me. All the frustration and tension
    of the past hour came rushing to the surface. I turned to my class and said in
    a very menacing tone, “Just watch this!” I strode over to the red-faced, puffed-up
    monk and told him in no uncertain terms, pointing back at him with my finger very
    close to his face, “I don’t care what you are wearing and what those clothes represent—you
    don’t come into my workshop and hook me out as if I were some little schoolboy
    who has offended you. I’ll come out and talk to you when—and only when—I am ready.
    In fact, I will be done right at twelve noon. If you have anything to say to me,
    you’d better be outside in the lobby right at that time. Then we can talk. Now,
    get out of my room!”


    I strode back to my class; to a person, they were sitting there aghast with their
    mouths gaping. (You don’t talk to religious figures like that!) “Right,” I said,
    pointing to each one of them in turn, “I want to know what you are feeling right
    now, in this moment, and donn’t give me that B.S. that you have given it to the
    violet flame and you are feeling peaceful, because it is obvious that you are
    not. What are you feeling? Get real!”


    Well, as you might expect, they were in their feelings big time, and we started
    to discuss them. With the help of the monk, I had broken through their wall of
    resistance to acknowledging that humans have feelings and that feelings are okay.


    ### We Want the Emotional Experience


    As human beings, we are blessed with the capability to feel our emotions. In fact,
    some say the only reason we have chosen human experience arises from the fact
    that this is the only planet carrying emotional energy. Consequently, when we
    do not allow ourselves to experience them and instead suppress them, our souls
    create situations in which we are literally forced to feel them. This means that
    the whole point of creating an upset may simply lie in our soul’s desire to provide
    an opportunity to feel a suppressed emotion. That being the case, simply allowing
    ourselves to have the feeling may allow the energy to move through us, and the
    so-called problem to disappear.


    But not all situations are dissolved so easily. When we try to cope with deep-seated
    issue and a remembrance of what seems unforgivable, such as sexual abuse, rape,
    or physical abuse, it takes more than just experiencing our emotions to get to
    the point where we feel unconditional love for the other person. Feeling the emotion
    fully is just the first step in faking it until we make it, and it definitely
    cannot be bypassed.


    I am not saying that emotional work will not benefit from insight gained through
    a shift in perception that might have occurred before the emotions were felt and
    expressed. It certainly will. But the converse does not hold true; the perceptual
    shift required for Radical Forgiveness will not happen if the underlying repressed
    feelings are not released.


    Invariably, when we feel the desire to forgive someone or something, we have at
    some time felt anger toward them or it. Anger actually exists as a secondary emotion.
    Beneath anger lies a primary emotional pain, such as hurt pride, shame, frustration,
    sadness, terror, or fear. Anger represents energy in motion emanating from the
    suppression of that pain. Not allowing one’s anger to flow can be likened to trying
    to cap a volcano. One day it will blow!


    Stages one and two of Radical Forgiveness ask us to get in touch with not only
    the anger but the underlying emotion as well. This means feeling it—not talking
    about it, analyzing it, or labeling it, but experiencing it!


    #### **LOVE YOUR ANGER**

