    # \n\n#### 20\n\n### Collapsing the Story\n\nThe story is where the pain resides.\
    \ It is what we write in Step 1 of the worksheet in the next chapter to complete\
    \ the sentence, “The situation around which I have an upset is or was...”\n\n\
    Since it appears to be the source of all our pain and discomfort, it is worth\
    \ turning the spotlight on our victim story to see the extent to which it is real\
    \ and whether holding onto the pain is justified. We might find that there’s very\
    \ little in it that is actually true. We might find that it is just a story we\
    \ have created to keep us stuck in separation in order to reinforce our belief\
    \ that we are not all one. It might also be that we have created this story to\
    \ give us clues about what we might need to heal (forgive) within ourselves so\
