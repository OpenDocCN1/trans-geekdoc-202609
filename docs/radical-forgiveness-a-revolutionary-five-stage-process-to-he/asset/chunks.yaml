    To support this woman in her catharsis, my wife went to the far end of the rather
    large room in which we were holding the retreat. We then asked her to use her
    voice to tell my wife that she was a good girl, and that God loved her. I made
    her do it louder and louder until she was shouting at the top of her lungs. After
    she had shouted “God loves me!” about twenty times, she stopped and looked at
    me and affirmed, “He really does love me, doesn’t he?” That healing moment I will
    never forget.


    Three months after we got back from England, we received a letter from her saying
    that she had left her husband, gotten a new place to live, and found a job. She
    was using her voice and asking for what she wanted, and she was finding that she
    had the power not only to ask but also to receive. She had even started a support
    group for people with multiple sclerosis and was doing art therapy with them.
    Her strength was returning day by day, and after three years we still hear from
    her and marvel at her continuously increasing strength.


    ## Art Therapy as a Tool


    If you are not a verbally inclined person and are not comfortable writing things
    down, try drawing. You may be surprised by what happens when you communicate in
    this manner. Buy some decent-sized white and black paper as well as some colored
    pastel chalks and crayons. (The pastels work really well on the black paper.)


    Know that to use this tool requires no artistic talent whatsoever: it is not about
    painting pretty pictures. In fact, if you are full of anger, your pictures will
    probably be anything but pretty. It is about getting emotions and thoughts out
    on paper.


    Begin drawing with no expectations or preconceived ideas. You might ask God or
    your spirit guides to help you release through the process of drawing and coloring
    whatever needs releasing—and then simply start. Whatever wants to come, allow
    it. Do not judge. Just go with the flow. Do it like a meditation. If you want
    to tell a story, do that. If you just want to use color, do that. Do whatever
    you feel like doing.


    To use art therapy as a forgiveness tool, use an approach similar to that of the
    letter trilogy. Do a series of drawings that express how you felt about what a
    particular person did to you; these pictures would express your anger, fear, pain,
    sadness, and so on. Then move into a more compassionate and understanding frame
    of mind and do some drawings that reflect this attitude. Do a third set that expresses
    the feeling of Radical Forgiveness. You might want to put some time between each
    phase, or you can do them all in the same sitting. Make sure, however, that once
    you start doing this art therapy, you complete all three stages—even if you only
    do three drawings in all. Doing just the first one, for example, might leave you
    stuck in anger.


    As you finish each picture, hang it on a wall. Place the pictures in the precise
    order in which you complete them, and create a vertical or horizontal band on
    the wall with them. If you are creating a vertical display, begin with the first
    of the angry ones at the bottom and end with the last Radical Forgiveness one
    at the top. When you place them in such a manner, you will be amazed to see the
    progression and the change in the quality of the energy each picture expresses.


    Title each drawing and date it. Spend some time with the drawings. Let them “speak”
    to you. While you were drawing each picture, you were thinking certain thoughts.
    When you look at the drawing later, clear your mind of those thoughts and examine
    the pictures for anything else of importance. Invite others you trust to give
    you their interpretations of the pictures; they may see things you do not. Ask
    for their input by saying, “If this were your picture, what would you see?” If
    what they see resonates with you, fine. If it does not really ring true for you,
    that is fine too. They see into your drawing through their own subconscious, not
    yours, but you will find that other people’s observations will trigger within
    you a whole new way of looking at your drawings, and you may have some new insights
    as a result.


    # 27


    ### Satori Breathwork


    As we have discussed previously, suppressed or repressed emotions have toxic effects
    on both our mental and physical health. Releasing these emotions serves as the
    first step in the Radical Forgiveness process. We can release held emotions most
    quickly and most effectively by using a process called `Satori Breathwork`, with
    the guidance of an experienced teacher. (Satori is a Japanese word meaning “insight”
    or “awakening.”)


    `Satori Breathwork` is usually done lying on your back and involves breathing
    with full awareness in a circular pattern. In other words, you consciously breathe
    in a manner that has no pause between the in-breath and the out-breath. Carefully
    selected music is played rather loudly throughout the process.


    The person breathes for forty to sixty minutes through an open mouth, sometimes
    long and deep into the abdomen and at other times fast and shallow into the upper
    chest. This oxygenates the body to such an extent that the body releases from
    its cells suppressed emotion that has crystallized into energy particles within
    the cells. As these energy particles are released, the person often becomes consciously
    aware of these old feelings in present time.


    The feelings may be expressed as pure emotion, such as sadness, anger, or despair,
    unattached to any memory associated with them. Conversely, the memory of an event,
    idea, association, or misperception that caused the emotion to be felt and suppressed
    in the first place may come sharply into focus. It may even surface in a symbolic
    way or in the form of a metaphor. For each person and in each breathing session,
    the experience is different—as well as impossible to predict.


    As emotions come up, the person “breathes through” them, which allows the person
    not only to feel them fully but to release them. We often stop breathing to hold
    emotions in check, so breathing through them allows this feeling and release to
    take place. In some cases, the person expresses them verbally and kinesthetically
    while breathing. No matter how the emotions are released, almost invariably a
    sense of profound calm and deep peace results from the process.


    This simple technique provides dramatic and long-lasting healing effects. I have
    no hesitation in recommending it to anyone who is serious about wanting to clear
    out their emotional closet. (See Further Resources for more information.)


    The effects of `Satori Breathwork` are profound precisely because they happen
    completely within the person, without any interjection, guidance, steering, or
    manipulation whatsoever by the facilitator. In fact, a facilitator is only present
    to hold the space as safe and support the breather in moving through the feelings—which
    sometimes can be scary—rather than suppressing them again. I would not recommend
    that you do this process on your own for that reason.


    Conscious connected breathing is also called rebirthing, because researchers have
    found that breathwork gives us access to memories and emotions lodged in our cells
    as early as *in utero* experience, during the actual birth process, and soon after
    birth. Birth represents our first major life trauma, and we form profound ideas
    about struggle, abandonment, safety, and acceptance as we go through this experience.
    These ideas often become beliefs that literally run our lives. When someone re-experiences
    their birth and releases the traumas and beliefs they formed at that time, their
    lives change dramatically.

