  trans: '


    我们可以选择放弃受害者式的心态，通过`激进原谅`（Radical Forgiveness）将我们的能量带入当下，也可以等待重大的创伤迫使我们回到当下。换句话说，我们要么可以通过意志来转化我们的意识，也可以等待一场灾难或危及生命的疾病来迫使我们这样做。


    # 14 上如其，下亦然


    全人类可能很快就会面临与我们每个个体所面临的相同选择。正如我在上一章中指出的，这个决定在于是通过选择来治愈，还是通过创伤来治愈。


    许多预言者声称，所有迹象已经出现，标志着人类在不久的将来将见证关于“选择治愈或创伤治愈”原则的大规模演示。地球患了癌症，这种癌症被称为人类。这个活着、呼吸着、有意识的星球在其整个生命中一直处于完美的平衡状态，每一个微小的部分都在各司职责以维持系统的平衡。这正比人体内健康细胞的工作。


    几千年来，我们一直是这个平衡系统的一部分。然而，在过去的几百年里，我们把自己置于自然秩序之上，开始相信我们可以控制并主宰整个系统。正如癌细胞失控地繁殖、扩散到整个系统并开始吞噬宿主一样，我们也继续在全球范围内呈指数级失控地繁殖，并掠夺其自然资源，仿佛除了满足我们的贪欲之外，什么都不重要。


    正如肿瘤包裹着心脏或阻塞肺部一样，我们也与自己的生命之源处于同一种致命的拥抱中，砍伐森林，污染我们呼吸的空气，毒害环境。科学家们告诉我们，如果我们不做出巨大的改变，我们将在未来四到五十年内摧毁我们所知的生命。


    然而，最大的需求是意识的转变。从集体而言，我们必须改变大众意识，否则将面临前所未有的创伤，导致维持我们目前生活方式的所有结构都将被扫空。


    ## 地球变迁与政治动荡


    从远古直到现在，人们一直预言在新千年的初期将发生大规模且灾难性的地球变化。预测包括两次极地移动、剧烈地震、天气模式的剧变、火山爆发，以及极冰盖融化导致的海平面大幅上升。这些事件的结果将是世界地图的彻底改变，我们今天看到的大陆陆将消失在水下，新的大陆将从海中升起。这种动乱和混乱是不可想象的，数以百万的人将死亡。政治动荡、宗教战争和环境破坏也将在大范围内发生。


    此类预测最著名的当过于 16 世纪的著名预言家诺斯特拉德米（Nostradamus），以及本世纪的“睡眠先知”、在 20 世纪 40 年代做过非常精确预测的埃德加·凯西（Edgar
    Cayce）。这些预测也出现在许多宗教著作中，包括《圣经》的《启示录》，以及玛雅人、霍皮印第人和其他许多原住民的传统文献。


    对许多人来说很清楚，这些地球变化已经开始。随着全球变暖的影响变得无法忽视，科学界正在根据全球洪水、干旱、飓风、龙卷风和火山爆发的增加做出他们自己的系列预测，所有这些都与凯西等人的预测高度相似。最近，世界政治局势变得更加不稳定，正在发生的一些事情看起来与预言的相似得令人不安。


    ## 意识至关重要


    科学家并不经常讨论意识对地球的影响，而是倾向于关注我们应该采取什么行动来防止即将来临的毁灭。但那些更具灵性倾向的预测总是带着一个警告：只要我们人类觉醒并改变意识，地球变化和政治动荡的严重程度就可以被减轻。换句话说，尽管我们基于恐惧/贪婪的意识已经严重地伤害了地球的以太体，以至于其物理形式的剧烈爆发似乎不可不可避免，但我们仍然可以通过提高意识来减轻这种影响。正如人类以太体中的疾病模式可以通过非物理手段（祈祷、灵气疗愈、意象、手法疗愈、`激进原谅疗法`等）得到治愈一样，地球以太体中已经形成的动荡和剧烈变化的模式可以在显现在物理世界之前消散。令人惊讶的是，答案似乎是祈祷。


    过去几年，科学一直在关注祈祷，该领域正达成越来越多的共识，认为它确实有效。我们确实通过祈祷创造了我们的现实。我必须补充的是，不是那种由请求或要求上帝给我们这个或那个，或者让某事发生而不是另一事发生，或以其他方式告诉上帝该做什么的祈祷。


    不，创造性祈祷的本质不是文字或思想的问题。它实际上是*感觉*。只有当你能够完全处于“已经拥有”的感觉中，知道它已经完成，或者你已经被赐予了它时，祈祷才会显化你想要的东西。一种深度感激的感觉或许是人描述它最接近的方式。


    但即使是这种也与特定的结果挂钩，可能无法将意识提高到足够的高度，以达到所需的能量转化程度。


    我们可以从事的最纯粹形式的祈祷是感受和平：这种和平来自于我们完全顺从事物的本源——在认知和安慰中，灵性（Spirit）已经处理好了一切，并且只要我们自己退出让位，一切都会向最好的方向发展。


    只有当我们完全顺从我们所处的处境时，能量才会开放让改变发生——至于会是什么样，只有老天知道了！不要*为了*和平而祈祷。要为了*感受到*和平而祈祷。那是最有创造力的祈祷。和平是地球上最大的力量，而且在此时是非常需要的。当我们内心感受到和平时，我们将认出爱，我们的世界也将反映它。


    这意味着我们拥有选择。每个人都可以选择留在恐惧、匮乏、不信任、贪婪和罪恶感中，也可以选择放弃这一切并处于平和之中。这非常简单。和平/爱是我们现在每天生活并参与的这种恐惧意识的唯一解药。所以，只需选择它。我们拥有这种技术。每天使用`激进原谅`来让这种选择变成现实——看看会发生什么！


    我们现在可能看到的，地球和全人类正在经历一场治愈危机——在好转之前，情况可能先变得更糟。（治愈危机发生在有机体经历状况急剧恶化的时期，例如发烧或脓肿破裂，随后它才开始好转。）


