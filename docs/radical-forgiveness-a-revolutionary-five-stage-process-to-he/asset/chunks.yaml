  trans: '

    第 9 步中的最后句话可能是这张工作表上最重要的陈述。它强化了这样一个观点：思想、情感和信念创造了我们的经历，而且此外，我们安排现实的方式是为了支持我们的灵性成长。当我们向这一真理敞开心扉，问题几乎总是消失的。这是因为没有问题，只有误解。


    这段陈述还挑战我们去接受一种可能性，即情况可能是有刻意的，并放下对知道“如何做”和“为什么”的需求。这是大多数智力主导型的人感到最困难的地方。他们希望在相信任何事情之前看到证明。因此，他们将“知道为什么”作为接受这一情况视为治愈机会的前提。


    追问事情为什么变成那样是没有用的，因为这是在要求探知上帝的心意。以我们目前的灵性发展水平，我们无法知道上帝的心意。我们必须放弃对知道为什么的需求（这无论如何都是受害者的提问），并顺从这样一个想法：上帝不会犯错，因此一切都处于神圣的秩序之中。


    这一步的重要性在于，它能够帮助你通过感受来走出受害者模式，进入一种可能性：即与你产生问题的那个个人、物体或情况，精准地反映了你所排斥的、渴望被接纳的自我部分。它承认了内在的神性本质、你内在那个觉知的部分、你的灵魂——无论你怎么称呼它——都为你安排了这种情况，以便你可以学习、成长并治愈一个误解或错误的信念。


    这一步也创造了自我赋能。一旦意识到我们创造了一个情况，我们就有改变它的力量。我们可以选择将自己视为环境的受害者，也可以选择将环境视为一个学习、成长并让生活变成我们想要的样子的机会。


    不要因为创造了某种情况而审判自己。记住，是你内在的神性部分创造了它。如果你审判你内在的神性部分，你就是在审判上帝。承认自己是一个奇妙的、创造性的神性存在，有能力在灵性道路上创造属于自己的课程，这些课程最终将带你回到家。一旦你能做到这一点，你就能顺服于你所是的的神性本质，并信任它处理剩下的部分。


    ## IV. 迈向重构


    10. 我现在意识到，只有当有人在我身上引起了我那些被我遗弃、否认、压抑并投射到他们身上的部分时，我才会感到不悦。


    我现在看到了这句格言中的真理：“如果你发现了它，你就拥有了它！”镜子里的就是我！


    **指令：** 这些陈述承认，当我们对某人感到不悦时，那个人总是在向我们反映我们自己最鄙视并投射到他们身上的那些部分。


    如果我们能足够敞开心扉，愿意接受这个人正在为我们提供一个机会，去接纳和爱我们曾谴责的自我部分，并且在这个意义上，他或她是一个治愈天使，那么工作就完成了。


    正如我之前所说的，你并不需要喜欢这个人。只需要把他们看作一面镜子，通过完成这张工作表来感谢他们的灵魂，然后继续。我们也不需要弄清楚我们自己的哪些部分被反映出来了。通常这本身就太复杂了。到此为止即可，不要卷入分析中。在没有分析的情况下效果最好。


    11. `Jeff` 反映了我在自己身上需要爱和接纳的部分。感谢 `Jeff` 给予我的这份礼物。我现在愿意收回投射，并承认它是我阴影的一部分。我爱并接纳我的这部分自我。


    **指令：** 这一陈述提醒我们，通过我们总是充满误解的故事，我们创造了我们的现实和生活。我们总是会吸引那些反映我们误解的人来到我们身边，并为我们提供治愈错误并走向真理方向的机会。


    12. 尽管我可能无法完全理解，但我现在意识到，你和我现在都意识到了这一点并不完全理解。

    '
