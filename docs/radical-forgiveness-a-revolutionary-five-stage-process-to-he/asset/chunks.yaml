  trans: '


    西雅图大学进行了一项关于宽恕与时间的、有趣但尚未发表的研究。这项研究涉及对一系列自认为是受害者的人进行访谈。研究人员想观察这种感知如何随着时间的推移而改变。初步结果显示，那种被描述为“不再留有怨恨”的宁静，`并不是`通过任何原谅的行为实现的，而是由于参与者突然`发现`他们确实已经原谅了。所有报告的人都说，他们越是努力原谅，就越变得困难，感受到的怨恨也越多。他们停止了尝试原谅，并`顺其自然`。在经历了不同的时间间隔后，他们惊讶地发现，自己已经不再怀有怨恨，事实上他们已经原谅了。


    后来一项更有有趣的发现发现，在意识到自己已经原谅之前，他们是先被别人原谅了。（至于是谁原谅了他们以及为了什么，这并不重要。）这明确指出，宽恕是一种能量的转变。在体验过被原谅——一种对滞结能量的释放——之后，他们几乎自动地释放了自己的滞结能量。


    这项研究不仅强化了“宽恕无法通过意志实现”的洞察，还表明宽恕是通过内在转变发生的，这种转变通过放弃对怨恨的执着以及接受对自己的原谅结合来实现。研究结果还强调了“十二步法”中第九步的价值，这种方法在匿名戒酒会和其他类似项目中已被数百万人成功使用。第九步要求我们向受过伤害的人寻求弥补，并请求他们的原谅。当我们发现自己实际上被原谅时，这就释放了我们自己的能量，不仅可以原谅他人，也能原谅自己。


    有些人可能会认为，西雅图的研究说明了宽恕过程的缓慢性，并表明宽恕对于治愈癌症等疾病来说是一种相当低效的方法。在很多情况下，人们花了十年时间才发现自己已经原谅了。


    然而，一个重要的区别是，这项研究并没有区分“激进宽恕”（Radical Forgiveness）和传统的宽恕。它所描述的无疑后者。我愿意打赌，如果将受试者组分为两组——一组对激进宽恕有洞察，而另一组基本上只使用传统的宽恕——那么拥有额外洞察的小组达到宁静状态的速度会比另一组快得多。


    我并不是在声称激进宽恕总是瞬间发生的——尽管我不得不说，我已经见过很多次瞬间发生的情况。它也不能被声称为癌症的确定性治愈方法。然而，它确实应该是任何治疗方案中不可或缺的一部分。有时人们甚至推迟医疗治疗，以看看激进宽恕是否能产生足够的效果，以至于不需要那种剧烈的干预。这在传统宽恕的情况下是不可想象的。


    ### 玛丽的故事


    我的朋友玛丽是我许多次静修活动的共同引导者，她曾连续几个月否认健康出了严重问题。当她无法忽视明显的迹象时，她去看了一位医生，医生告诉她患有三期结肠癌——他们想立即手术。她请求三十天的时间，医生们不情愿同意了。她去了山里的一间小小屋，在那里住了一周，通过冥想和运用激进宽恕来原谅生活中的所有人，包括她自己。她禁食、祈祷、哭泣，字面上地经历了灵魂的暗夜。她回到家里后，与几位实践者合作清理身体并增强免疫系统。


    在三十天结束时，手术进行了。术后，她的医生想知道她做了什么，因为癌症几乎完全消失了，而且比起他们所说的必须进行的激进手术，移除癌症只需要微小的干预。


    在疾病如此晚期或侵袭性以至于需要立即医疗干预的情况下，手术、化疗或放射可以赢得时间。但时间是为了什么呢？


    记住：癌症是不可治愈的。因此，无论采取什么医疗治疗，医生心中都有一个默的预期，认为复发几乎是必然结果，只是时间问题。我倾向于将治疗（假设患者幸存）视为一种购买时间来进行激进宽恕工作的方式，这种工作实际上可以防止任何复发。


    激进宽恕提供了目前最好的预防措施之一。它在能量变成物理体中的阻塞之前，就清理了精细体中的能量。当我通过激进宽恕治疗帮助人们解决宽恕问题时（正如我帮助妹妹 Jill
    那样），我相信我不仅在帮助他们治愈精细体伤伤，还在帮助他们预防疾病在物理体内发生。我深信，如果我们保持能量按照设计的方式流动，我们永远不会生病。尽管我不再像以前那样举办五天的癌症营，但我将我现在世界各地举办的激进宽恕工作坊视为癌症预防工作。


    当然，充足的运动、良好的饮食和其他此类常识做法在这方面也有帮助。但保持我们的能量体没有情绪杂质和毒性，对于健康和治愈至关重要。遗憾的是，这种治愈方式受到的媒体关注最少，尽管光在美国，每五个人中就一个人服用`Prozac`（百忧）之类的抗抑郁药物。考虑到抑郁总是发生在癌症之前，我们不得不怀疑，五个美国人中也有一个死于癌症是否仅仅是巧合。


    我经常被问及为什么和癌症患者一起。我没有个人经历，而且当我上世纪 90 年代初开始提供情感和灵性疗愈五天癌症营时，从医学角度来看对它了解甚少。


    只有在工作一段时间后，我才意识到我为什么会被它吸引：因为它与我对宽恕的兴趣联系在了一起。这种洞察发生在我发现几乎所有的癌症患者除了有终生抑制和压抑情绪的习惯外，还都表现出明显的缺乏宽恕的能力。


    现在我相信，缺乏宽恕导致了、甚至可能是大多数癌症的主要原因。因此，我针对癌症患者以及想要防止疾病在体内发生或复发的人的治疗工作，现在几乎完全集中激进宽恕治疗上。


    ### 简的故事


    简参加了我们在佐治亚州北部山区的一次五天静营。她做过乳腺切除术，正在等待骨髓移植。静营结束后，她每周来这里接受一次催眠治疗和个人指导。第二次访问时，她状态非常焦虑，因为当天的一项常规`MRI`扫描在她的脑中发现了微小的癌点。虽然这种新癌症本身就令人心心，它的出现也可能破坏她的移植机会。医生们计划通过化疗来试图抑制癌症进展，但他们对她的情况感到惊讶，因为通常转移是从乳腺转移到肝脏然后到大脑；极少直接从乳腺转移到大脑。对我来说，这似乎值得探讨。


