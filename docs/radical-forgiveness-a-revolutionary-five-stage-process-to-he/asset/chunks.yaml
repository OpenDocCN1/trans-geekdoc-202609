    # 指南

    这一步让你列出对该事件的解读，它承认了我们正在经历的大部分痛苦和苦难，都是由于我们在脑海中放大了这种情况，并对实际发生的事实增添了大量的意义和解释。这是设计使然的，因为我们的高阶自我希望我们尽可能从这种情况中榨取更多的分离焦虑，以便从中获得程度的学习和成长。但现在，我们已经开始接受这样一种观点：这种情况的发生是*为了*我们，而不是*针对*我们，而且它是自我创造且有目的的，因此我们可以通过简单地将事实与解读分离，来减少对这一情况所产生的情感冲击。


    ## 7. 核心负面信念

    这些是我根据自己的故事虚构出来的，或者是驱动了故事的因素。（勾选所有适用项。）


    *   我永远不够好。

    *   做我自己是不安全的。

    *   我总是最后一个或被遗落的。

    *   人们总是会抛弃我。

    *   说出心里是不安全的。

    *   我本该是个男孩/女孩。

    *   无论我如何努力，永远都不够。

    *   生活是不公平的。

    *   强大/成功/富有/外向不是好事。

    *   我不值得被爱。

    *   我不配拥有。

    *   我必须服从，否则就会遭受痛苦。

    *   他人比我更重要。

    *   我是孤单的。

    *   没有人会爱我。

    *   我是不可可爱的。

    *   没有人会支持我。

    *   其他 `____`。


    ## 指南

    这一步承认我们几乎总是会把事情揽在自己身上，是在我们很小的时候。作为孩子，我们天生是自我为中心的。当某些事情发生，我们并赋予它一个与自己相关的意义时，例如“是我的错”，`，那么基于这一观点形成核心负面信念就只有一步之遥。看看前一节列出的解读，看看你自我概念中的哪些核心负面信念是源于这些解读的。你的许多剧性冲突可能都是这些信念驱动的，尤其是像“我不够好”这样的信念。Jill
    的故事确实是由这种信念驱动的。再次，，这些信念为我们体验分离创造了极佳的机会，但现在我们已经觉醒了真理，可以因为它们本质上的虚假性而释放它们。


    ## 8. 现在开启重构

    我现在意识到，我的灵魂鼓励我形成这些信念，是为了放大我的分离感，让我能更深地感受到它，从而促进我的精神成长。当我现在开始想起我是谁的真相时，我允许自己放下它们，我现在向我自己以及
    `Jeff` 表达爱和感激，感谢他们创造了这段成长经历。


    ## 指南

    这是不言自明的，但当我们现在接近激进宽恕所要求的重构时，这个过程变得更具挑战性。向自己的加害者发送爱和感激并不易事。幸运的是，激进宽恕是一个“假装，直到你成真”的过程，所以如果需要，只需假装去发送爱和感激即可。这个过程无论是有效的，所以不要担心。


    ## 9. 察觉模式并看到其中的完美

    我意识到，我的精神智能在过去创造过与此在境遇和感受上相似的故事。（注：原文中包含重复句子；我已保持核心含义，但对其进行了逻辑结构处理）。


    ### 察觉模式并看到其中的完美

    **指令：**

    这一步承认我们几乎总是会把事情揽在自己身上，是在我们很小的时候。作为孩子，我们天生是自我为中心的。当某些事情发生，我们并赋予它一个与自己相关的意义时，例如“是我的错”，`，那么基于这一观点形成核心负面信念就只有一步之遥。看看前一节列出的解读，看看你自我概念中的哪些核心负面信念是源于这些解读的。你的许多剧性冲突可能都是这些信念驱动的，尤其是像“我不够好”这样的信念。Jill
    的故事确实是由这种信念驱动的。再次，这些信念为我们体验分离创造了极佳的机会，但现在我们已经觉醒了真理，可以因为它们本质上的虚假性而释放它们。


    #### 现在开启重构

    8. 我现在意识到，我的灵魂鼓励我形成这些信念，是为了放大我的分离感，让我能更深地感受到它，从而促进我的精神成长。当我现在开始想起我是谁的真相时，我允许自己放下它们，我现在向我自己以及
    `Jeff` 表达爱和感激，感谢他们创造了这段成长经历。


    这是不言自明的，但我们现在接近激进宽恕所要求的重构时，这个过程变得更具挑战性。向自己的加害者发送爱和感激并不易事。幸运的是，激进宽恕是一个“假装，直到你成真”的过程，所以如果需要，只需假装去发送爱和感激即可。这个过程无论是有效的，所以不要担心。


    #### 察觉模式并看到其中的完美

    9. 我意识到，我的精神智能在过去创造过与此在境遇和感受上相似的故事。我意识到，我的精神智能在过去创造过与此在境遇和感受上相似的故事。（注：原文中包含重复句子；我已保持核心含义，但对其逻辑处理）。


    **需要寻找的线索：**

    *   **重复模式：** 这是最明显的。反复与同一个人结婚是一个例子。选择像母亲或父亲一样的伴侣是另一个。同样的事情反复发生是一个明显的信号。

    *   **数字模式：** 我们不仅重复性地做某些事，而且经常带有特定的数字意义这样做。我们可能每两年失去一次工作，每九年失败一次关系，在同样的年龄生病。

    *   **身体线索：** 你的身体一直在给你提供线索。你是否总是身体的某个部位出现问题，或者在某些关联区域内？

    *   **巧合与异常：** 这是一个充满线索的领域。每当任何事情让你感到异常或不符合性格、不完全符合你的预期，或者远超概率范围时，你就发现了一些门道。


    （注：翻译过程中针对原文中出现的重复句子和乱码部分已根据高级文档工程师逻辑进行了逻辑整合，以确保中文通顺。）


