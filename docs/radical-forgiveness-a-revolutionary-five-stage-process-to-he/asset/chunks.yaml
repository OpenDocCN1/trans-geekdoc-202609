    # 指南


    指令：尽可能与 `X` 发生对抗，并准确列出你指责他/她/它的什么。这一部分空间很小，只能写几个词，但要让你选择的词汇代表你所有情绪的整体。如果这个对象或情况没有名字，请给它起一个名字，或者至少像对待人一样去描写它。如果那人已经去世，请像他/她站在你面前一样对他们说话。如果你想完整地写出来，请以信的形式写。（参见第
    24 章。）这一步允许你直接面对那个人。然而，请专注于一个问题。不要在信中或此工作表中讨论其他事情。要实现你的目标——激进原谅——需要你清楚自己`现在`到底对什么感到如此困扰。


    ## 2b. 因为你所做（正在做）的事，我感到：*(在此处识别你的真实情绪。）*


    *受伤、被遗弃、背叛、孤独、悲伤和愤怒。*


    指令：允许自己感受你的情绪至关重要。不要对它们进行审查或“压抑”它们。请记住，我们进入物质世界是为了体验情感——这是人性的本质。所有的情绪都是好的，除非我们压抑它们。压抑情绪会在我们的身体里产生潜在的有害能量块。


    确保你识别出的情绪代表你实际感受到的真实情绪，而不仅仅是关于你感受如何的想法。你是生气、高兴、悲伤还是害怕？如果你无法具体说明，那也没关系。有些人发现自己无法区分不同的感受。如果对你来说也是如此，只需留意你在这种情况下能感受到的整体情绪特征即可。


    如果你想更清晰或更强烈地感受自己的情绪，拿起网球拍或球棒，用力猛打一些垫子或枕头。使用撞击时会发出声音的物体。如果愤怒让你感到害怕，做这项练习时找个人陪你。那个人应该鼓励并支持你感受愤怒（或任何其他情绪），并确保这样做是安全的。对着枕头尖叫也有助于释放感受。正如我多次强调的那样，你越允许自己感受隐藏在愤怒之下的痛苦、悲伤或恐惧，效果越好。


    ## II. 感受情绪


    ### 承认自己的人性


    3\. 我深爱地承认并接受我的情绪，不再对它们进行评判。我有权拥有自己的情绪。


    指令：这一重要的步骤为你提供了一个机会，允许自己从这种信念中解脱：即愤怒、报复、嫉妒、羡慕甚至悲伤等情绪是糟糕的且应该被拒绝。无论它们是什么，你都需要按照它们对你发生的方式去感受它们，因为它们是你的真实自我的表达。你的灵魂希望你充分感受它们。知道，它们是完美的，不要再因为拥有这些情绪而评判自己。


    尝试以下三步法来整合并接受你的情绪：


    步骤 1. 充分感受这种情绪，然后将其识别为生气、高兴、悲伤或害怕。


    步骤 2. 在心中按其原有的拥抱这些情绪。爱它们。接受它们。把它们作为自己的一部分去。让它们保持完美。在先接受你的情绪并与它们和解之前，你无法进入喜悦的频率。说出这段肯定：“我请求支持，去感受我每种情绪原本的样子，我在心中拥抱它，并爱心地接受它作为我自己的一部分。”


    步骤 3. 现在为你拥有这些情绪的自己感到自爱，并知道你选择感受它们是为了引导你的能量走向治愈。


    4\. 我拥有我的情绪。没有人能让我感到任何事情。我的情绪是我如何看待这一情况的反映。


    指令：这段陈述提醒我们，没有人能让我们感到任何事情。我们的情绪是我们自己的。当我们感受、识别、接受并无条件地爱我们的情绪作为自己的一部分时，我们就能完全自由地保留它们或放手它们。这种认知赋予了我们力量，帮助我们意识到问题不在“外在”，而在这里，在我们自己身上。这种认知也代表了我们离开受害者原型频率的第一步。当我们认为其他人、甚至情境让我们生气、高兴、悲伤或害怕时，我们就把所有的力量交给了他们。


    5\. 我的不适是一个信号，说明我通过评判、持有期待、希望 `Jeff` 改变以及认为 `Jeff` 不完美，正在剥夺自己和 `Jeff` 的爱。


    （列出那些你想要 Jeff 改变的评判、期待和行为。）


    我将他对他女儿 Lorraine 的关怀解读为在他眼里她比我更重要。从那里起，我解读为他不爱我，对我来说还不够，而且他就像所有男人一样。


    指令：当我们与某人断开联系时，我们无法爱他们。当我们评判一个人（或我们自己）并判定他们错了时，我们就在剥夺爱。即使我们认为他们是对的，我们也在剥夺爱，因为我们让爱以他们的“正确性”为条件。


    任何改变别人的尝试都涉及对爱的撤回，因为想要他们改变意味着他们是错且需要改变。此外，我们在鼓励他们改变时甚至可能造成伤害，因为我们意识到。例如，如果我们因为某人生病了而发送未经请求的治愈能量，我们实际上是在判断他们现在的状态是不好的，不应该生病。我们是谁来做这个决定？生病可能是他们精神成长所需要的经历。自然地，如果他们请求治愈，就变成了另一回事，你也会尽所全力回应。尽管如此，你仍然认为他们是完美的。


    所以请在这个子里记录下你希望被你原谅的人在哪些方面变得不同，或者希望他们在哪些方面改变。你对那个人做了哪些细微的评判，表明你无法接受他们原本的样子？你表现出什么行为显示你正在评判他们？


    ### III. 瓦解故事


    6\. 我现在意识到，为了更深地体验这种经历，我的灵魂鼓励我针对事件或情境创造出一个比事实本身看起来更宏大的故事。既然这个目的已经达到，我现在可以通过将事实与我虚构的解读隔离开来，释放围绕我故事的能量。（列出主要的解读，并圈出你现在对每种解读的情绪程度和依恋程度。）现在的情绪水平：


    \_ 高 \_ 中 \_ 低 \_ 零


