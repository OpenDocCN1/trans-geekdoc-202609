    \ too, that there may well be nothing that strikes you as evidence one way or\
    \ the other. If nothing stands out, don’t worry. It does not mean that the statement\
    \ is any less true.\n\nThe kinds of clues to look out for might be as follows:\n\
    \n• Repeating Patterns: This is the most obvious one. Marrying the same kind of\
    \ person over and over again is an example. Picking life partners who are just\
    \ like your mother or father is another. The same kind of event happening over\
    \ and over is a clear signal. People doing the same kinds of things to you, like\
    \ letting you down or never listening to you, is another clue that you have an\
    \ issue to work through in that area.\n\n• Number Patterns: Not only do we do\
    \ things repetitively, but we often do so in ways that have a numerical significance.\
    \ We may lose our job every two years, fail in relationships every nine years,\
    \ always create relationships in threes, get sick at the same age as our parents,\
    \ find the same number turning up in everything we do, and so on. It is very helpful\
    \ to construct a time line like the one I did for Jill (see FIGURE 1), except\
    \ that you might fill in all the dates and note all intervals of time between\
    \ certain events. You might well find a meaningful time correlation in what is\
    \ happening.\n\n• Body Clues: Your body gives you clues all the time. Are you\
    \ always having problems on one side of your body, or in areas that correlate\
    \ to particular chakras and the issues contained therein? Books by Caroline Myss,\
    \ Louise Hay, and many others will help you to find meaning in what is happening\
    \ to your body and what the healing message is. In our work with cancer patients,\
    \ for example, the cancer always turned out to be a loving invitation to change\
    \ or to be willing to feel and heal repressed emotional pain.\n\n• Coincidences\
    \ and Oddities: This is a rich field for clues. Anytime anything strikes you as\
    \ odd or out of character, not quite as you’d expect, or way beyond chance probability,\
    \ you know you are onto something. For example, in Jill’s story, not only was\
    \ it odd that both girls who were getting the love Jill felt was denied her were\
    \ called Lorraine, which is not a common name in England; they were also both\
    \ blonde, blue-eyed, and the first-born of three. Jeff’s behavior was also extremely\
    \ uncharacteristic. Far from being cruel and insensitive, he is an exceedingly\
    \ kind, nurturing, and sensitive man. I can’t imagine Jeff being cruel to anyone\
    \ or anything. His behavior toward Jill certainly struck me as odd in the extreme.\n\
    \nWhere once we thought things happened by chance and were just coincidences,\
    \ we are now willing to think that it is our spiritual intelligence making things\
    \ happen synchronistically for our highest good. It is these synchronicities that\
    \ lie embedded in our stories, and once we see them as such, we then become free\
    \ to feel the truth in the statement: “My soul has created this situation in order\
    \ that I learn and grow.”"
