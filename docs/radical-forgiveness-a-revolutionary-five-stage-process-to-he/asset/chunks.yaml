    Seen from the World of Divine Truth prior to incarnation, the mission seems easy.
    But once we incarnate, it takes on a new level of difficulty. This is due not
    only to the greater density of energy in the World of Humanity but to the fact
    that the mission must be undertaken free of any awareness that we have chosen
    this experience. If we knew (remembered) the truth about our purpose, the experience
    would be pointless. How can we remember who we are if we have never forgotten?
    So Spirit creates the human experience in such a way that when we are born into
    our bodies we lose all recall of our mission and all awareness that life on the
    physical plane is, in fact, a setup.


    To accomplish our mission (to transform energies) we must have a total experience
    of those energies. For example, to transform the energy of “victim,” we must feel
    utterly victimized. To transform the energy of fear, we must feel terrorized.
    To transform the energy of hate, we must be consumed with hatred. In other words,
    we must go fully into the experience of being human. It is only when we have fully
    felt the emotions connected with these energies that we gain the ability to move
    into the full forgiveness of them. And it is through forgiving them that we remember
    who we are.


    From this viewpoint, we are clearly never in a position to judge anyone. A person
    who appears hateful may have chosen as his mission to transform that energy. Thus
    his hateful behavior, even though it seems to harm others (who may have volunteered
    to have hate projected at them as their mission), is neither right nor wrong.
    His hateful behavior simply represents what needs to happen to transform the energy
    of hate. Period.


    The energy of hate is transformed when someone who feels hated sees the love beneath
    the hate and forgives the person for hating him. In that moment, hearts open and
    love flows between the two people. Thus hate is transformed into love. Awakening
    results from a continuous process of transformation of the energies of all forms
    of separation.


    #### Janet’s Story


    Janet, who had cancer, attended one of my early cancer retreats, but her tumor
    was not the only thing eating away at her. The anger she felt concerning her twenty-three-year-old
    daughter, Melanie, was doing the same.


    By all accounts, Melanie exhibited some pretty strong rebellious behavior. She
    was verbally abusive to Janet and Janet’s new husband, Jim, and she had attached
    herself to a rather unsavory man. “I hate her with a vengeance,” Janet related.
    “Her behavior toward me and Jim is simply abominable, and I can’t stand it anymore.
    I really hate her.”


    We dug a little deeper into Janet’s personal history and found that a similar
    relationship had existed between Janet and her own mother. It was not as clear
    and dramatic as the drama with Melanie, but the dynamic was similar. Janet had
    resented how much her mother had controlled her and tried to run her life. She
    did not rebel as Melanie did, though. Instead she had become withdrawn and cold
    toward her mother.


    We began to explore how the dynamic with Melanie reflected her soul’s willingness
    to help Janet heal her issues with her mother, but Janet was not willing to see
    this. She was simply too angry to hear anything that did not correspond with her
    feelings. So we asked her to move into her anger, to feel and express it by beating
    cushions with a tennis racket and shouting. (Anger is very effectively released
    through the combination of physical action and the use of the voice.) Although
    she released some anger toward her mother, her anger with Melanie remained.


    #### Janet’s Satori


    That evening’s retreat session was reserved for Satori Breath. To experience Satori
    Breath and use it for healing, everyone in the group lies on the floor and breathes
    consciously and vigorously for about an hour while listening to loud music. (See
    Chapter 27.) While this may sound bizarre, breathing in this manner often results
    in emotional release, insight, and integration of change at the cellular level.
    That night, Janet had her `satori—`her “awakening.”


    After the breathing session, people began sharing what had happened for them during
    the exercise. As soon as Janet began to share, we knew something important had
    happened. Her voice was soft and sweet, whereas before it had been hard and abrasive.
    Her posture was relaxed and open, whereas before it had been tight and constricted.
    There was not a trace of the anger that had filled her being and that we all had
    felt emanating from her previously. She was calm and evidently peaceful. In fact,
    she hardly seemed the same person. “I have no idea what all this means,” she began.
    “All I know is that I saw something while I was breathing, and it felt more real
    than anything I can possibly describe. Nothing much happened for quite a while
    after I began breathing,” she continued. “Then, suddenly, I found myself floating
    in space, out there in the ethers. I was not in a body, and I knew with certainty
    that I was re-experiencing a time before I came into my current life. I was pure
    spirit. I have never felt so peaceful and calm. Then I became aware of Melanie,
    also in spirit form. She came close, and we began to dance together—just dancing
    in space without limitation.


    “We began a conversation about coming into our next lifetime together,” Janet
    said. “This lifetime. The big question we had to decide was who would play what
    role—who was going to play the mother and who was going to play the daughter.
    It didn’t much matter, for either way it was going to be a difficult assignment
    for us both. It would be a very strong test of our love. We had to decide, so
    we agreed that I would be the mother and she would be the daughter and that we
    would incarnate soon thereafter. That’s about it,” she concluded. “It doesn’t
    sound like a whole lot happened, but really it did. I just can’t put it into words.
    I just can’t describe the depth and the meaning of what I experienced.”


    #### Energies Transformed


    We discussed her experience and looked at the notion of mission as suggested by
    Janet’s vision. Several others in the group felt strongly about her experience
    and saw parallels in their own lives. I suggested that Janet say nothing at all
    to Melanie when she returned home after the retreat. Within a few days of Janet’s
    homecoming, Melanie called her mother and asked if she could come and talk. Janet
    agreed, and, while the first meeting was tentative and awkward, their relationship
    changed dramatically after that. Melanie soon dropped all her bizarre behavior,
    sent the unsavory boyfriend packing, and came home to be with her mother and take
    care of her during her illness. They literally became best friends and were quite
    inseparable after that. Also, Janet’s mother began calling more often, and gradually
    their relationship began to improve as well.


    In this example, the transformation of energy happened in a roundabout way. Janet
    was extremely resistant to forgiving Melanie. Her soul guided her to the retreat
    so that she could do a process that opened her to a remembrance of her mission
    agreement, which in turn enabled her to see the perfection in the situation. By
    forgiving Melanie, she transformed the hate in their relationship and, as a result,
    healed the original pain between herself and her mother.


    ### MISSIONS TO HEAL THE COLLECTIVE


    While of us come in to heal aspects of our own soul or those of our soul group,
    some may incarnate with a larger role to play. This may be to take on particular
    energies that get played out at the social, political, national, and international
    level and offer large groups of people the opportunity to heal.

