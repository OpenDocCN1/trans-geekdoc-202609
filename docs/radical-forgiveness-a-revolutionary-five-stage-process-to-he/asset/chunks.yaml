    1990 年在亚特兰大的一次聚会上，我听著名作家杰拉尔德·詹波尔斯基（Gerald Jampolsky）讲述了一个关于一对夫妇生完第二个孩子后从医院回家的真实故事。故事说明了一个事实：我们对与上帝以及自身灵魂的关系有着真正的认知，但在拥有肉体后，我们很快就会忘记它。这对夫妇意识到，他们需要在庆祝新宝宝回家的活动中加入他们三岁的女儿。但由于她坚持要求独自进入房间看宝宝，他们感到很困扰。为了尊重她的请求同时监督情况，他们打开了婴儿监视器，这样他们至少能听见发生了什么，即使看不到。他们听到的声音让他们大吃一惊。小女孩直奔婴儿床，透过栅栏看向新生儿，说道：“宝宝，告诉我关于上帝的事吧。我开始要忘记了。”


    尽管我们在与上帝合一的记忆上拉下了一层面纱（上面的故事暗示这层面纱可能在三岁左右被完全拉上），但作为人类，我们并没有被拒绝与神圣真理世界连接。我们的灵魂携带着一种与神圣真理世界产生共振的震动，并将我们连接到那个世界。我们可以通过冥想、祈祷、瑜伽、呼吸法、舞蹈和吟等练习来帮助这种连接。通过这些练习，我们提高了震动，使其足以与神圣真理世界的震动产生共鸣。


    有证据表明，这种状态正在迅速变化。无论我去哪里，都会向工作坊的参与者问同一个问题：“你们有多少人意识到我们的精神进化正在加速——而且灵性要求我们更快速地通过这些课程，为某种深远的转变做准备？”答案几乎是一致认可的。现在有越来越多的人公开、自由地谈论一直与他们的“引导”保持联系，并愿意每天都更加信任它。两个世界之间的面纱确实正在变薄。激进宽恕（Radical
    Forgiveness）在个人层面和集体意识层面都促进了这一过程。


    然而，这两种宽恕在字面上仍然是两个世界的距离。每一种都需要一种不同的看待世界和生活的方式。显然，传统的宽恕提供了一种在世俗生活的方式，而激进宽恕无异于一条灵之路。


    在我们精神进化的能力方面，激进宽恕为转化意识提供了非凡的潜力，这种潜力远超过传统宽恕所能实现的。然而，我们必须承认，我们仍然生活在人类世界，在某些时刻，我们无法达到理想中的灵性标准。例如，当我们发现自己沉浸在痛苦中时，我们几乎无法进入激进宽恕的状态。当我们最近遭受了他人的伤害，例如被强奸时，不能指望在那一刻接受这种经历是我们想要的，并且它代表了神圣计划的展开。我们没有足够的受纳性去考虑那个想法。它只能在以后出现，在安静反思的时刻，而不是在愤怒的头上或创伤发生后立即。（图
    4）


    ![](img/part2_chapter3_image003.jpg)


    图 4：传统宽恕与激进宽恕的区别。关于这些区别的更多解释，请参阅第 15 章：信仰条文。


    尽管如此，我们必须不断提醒自己：我们所创造的*就是*灵性理想；我们在生活中创造了有助于我们成长和学习的环境；我们需要学习的课程包含在情境之中；而从经验中获得长的唯一途径就是*经历*它。


    我们在这方面的选择，与其说是是否拥有经历（灵性为我们决定了这一点），不如说是我们要因为这种经历在受害者意识中徘留多久。如果我们选择迅速放掉受害者心态，知道我们拥有一种可以实现这点的技术是非常宽慰的。相比之下，传统的宽恕在这方面提供的帮助无几。


    ### 总结


    - 传统的宽恕深根于人类世界。正如人类世界包含着二元性的能量一样，传统的宽恕也将一切极极化，并将其判定为好或坏、对或错。


    *激进宽恕的观点是，没有对错或好坏之分。只是我们的思维使其变得如此。*


    - 传统的宽恕总是假设发生了某些错误，并且某人对另一个人“做了某些事”。受害者原型仍在起作用。


    *激进宽恕始于相信没有发生任何错误，在任何情境中都没有受害者。*


    - 传统的宽恕的有效性体现在它召唤了最高尚的人类美德，如同情、宽容、善良、慈悲和谦卑。这些特质指向宽恕并具有治愈的潜力。然而，它们本身并不是宽恕。


    *激进宽恕在这方面并无区别，因为它同样要求在过程中具备这些相同的美德。*


    - 传统的宽恕完全取决于我们感受同情的能力，因此它在这方面是局限的。无论我们对希特勒这样的人投入多少同情或宽容，无论我们对他成长过程中的痛苦有多少共情，都没有能让我们（使用传统的宽恕）原谅他杀杀了超过
    130 万人。


    *激进宽恕没有任何限制，而且完全无条件。如果激进宽恕不能原谅希特勒，它就不能原谅任何人。就像无条件的爱一样，它全有或全无。*


    - 在传统的宽恕中，自我和人格自我主宰一切。因此，问题总是出现在“外外”，在别人身上。


    *在激进宽恕中，手指指向了另一个方向。问题在“这里”，在我身上。*


    - 传统的宽恕相信物理世界的真实，相信“所发生的一切”具有完全的完整；它总是试图“想通一切”并控制局势。


    *激进宽恕识别了幻象，看到所发生的只是一个故事，并顺应情境的完美做出反应。*


    - 传统的宽恕没有考虑到灵性使命的概念，并保持对死亡的相信和恐惧。


    *激进宽恕将死亡视为幻象，并认为生命是永恒的。*


    - 传统的宽恕将生命视为一个需要解决的问题或需要避免的惩罚。它将生活体验为一系列无缘无故发生在身上的随机情况——这就是那句流行的汽车贴纸：“倒霉总发生（Shit
    happens）！”


    *激进宽恕看到生命完全是有目的且由爱驱动的。*


    - 传统的宽恕承认人类固有的不完美，但未能看到不完美中的完美。


    - 当传统的宽恕召唤一些最高尚的人类美德（如善良、谦卑、同情、耐心和宽容）时，它可以带有与激进宽恕相似的高震动。


    *我们开启提升震动以连接神圣真理世界并体验激进宽恕旅程的门户，是敞开的心。*


