    最近我听畅销书作家艾兰·科恩（Alan Cohen）讲述了一个很好地说明了这一点的故事。他的一个朋友曾卷入一起导致女孩死亡的事件。由于女孩的意外死亡，他被囚禁了多年。他接受了所发生事的责任，并在方方面表现得像一个模范犯。然而，女孩的父亲是一位富有、有影响力且在高层有人脉的人，他发誓要尽可能长地把这个人关起来。每当他符合假释条件时，女孩的父亲都会花费大量精力和金动用一切可能的人政治关系来确保假释被拒绝。在经历了多次此类事件后，科恩问他的朋友，对于因为这个人的努力而被拒绝假释他有什么感受。那个男人说，他一生的每天都在原谅女孩的父亲并为他祈祷，因为他意识到处于监狱的是父亲，而不是自己。


    事实上，这位父亲无法走出愤怒、悲伤和痛苦，他被报仇的欲望所控制。他无法逃脱自己受害者心态引发的监狱。即使是传统的宽恕对他来说也遥不可及。相比之下，科恩的朋友拒绝成为受害者，并将爱视为唯一的可能性。他的振动更高，并能够实践“激进宽恕”（Radical
    Forgiveness）。


    ### 寻求救济与问责


    回到是否通过法院寻求救济的问题，是的，我们应该寻求让其他人对其行为负责。但请记住，一旦我们决定起诉，我们必须像酒精者匿名会所说的那样，“为那个混蛋祈祷”，也为自己祈祷。（顺便说一下，我们不需要喜欢某人才能原谅他！）换句话说，我们把这件事交给我们的更高力量。我们意识到神圣的爱在每种情况下都在发挥作用，每个人都能得到他或她想要的。我们意识到完美始终存在于这种情况的某处，即使在当时并不明显。


    ### 关于受害者心态的个人经历


    当我刚写完这本书并正寻找能帮助我营销这本书的人，我曾经历过这种事。一个朋友推荐了一个人，于是我和妻子乔安（JoAnn）去见了她。她看起来还可以，我没有理由怀疑她的能力或诚实。然而——宇宙的运作方式很有趣——将书收录进《印刷图书》（Books
    in Print）的截止日期就是第二天。这是书店订购时使用的参考书，“所以在那之前录进去很重要，以以免错过整整一年。”这意味着我被仓促地与其女性签署了合同，并支付了
    4,000 美元，这是她要求的预付款，外加书销售额的 15%。我们当时没有 4,000 美元，但乔安设法凑齐了 2,900 美元；剩余部分我们将按月分期支付。于是签了合同。尽管很仓促，但我很庆幸自己把项目的那部分委托给了她。


    随着时间的推移，在我的书出版很久之后，我发现我仍然需要做很多我以为已经和她约定好要做的事情。我得自己安排所有的签售活动，把书寄给评论员，等等。我完全没有从她的努力中看到任何结果。我一直关注着，一段时间后我找了她对质。结果发现，她几乎什么都没做。当然，她否认了并辩护自己，但当我要求看信件和活动证据时，一无所获。我解雇了她，因其未履行合同而终止合同，并要求退还我的钱。她当然拒绝了，于是我开始了法律程序以追回资金。


    正如你可以想象的，我当时非常沮丧。我陷入了所有想象自己受害的人都会去的地方——“受害者之地！”而且我完全处于无意识状态。我编造了一整个受害者故事，并抓住每一个机会向任何愿意听的人分享。对我来说，她偷了我的钱，我需要报仇。我彻底陷在里面了，这种状态持续了好几个星期。而我本该是“宽恕先生”的！


    ### 觉醒之路


    幸运的是，多年前参加过我第一次工作坊的一个朋友来吃晚餐。当我告诉她我的故事时，她的反应是：“那么，你针对这件事做过练习表吗？”


    我当然没做。那是我脑子里最远的事。“不，我没做过练习表，”我回答道，感到非常愤怒。


    “你不觉得你应该这样做吗？”露西（Lucie）问。


    “不，我不想做该死的练习表！”我吼道。


    这时乔安插话道：“那是那是你的练习表。你应该言行一致！”这下管用了。感到被逼入绝角，我气冲冲地上楼去拿一张，但我很生气。我知道，他们也知道，我是在抗议下这么做的。这是我世界上最不想做的事，但他们不让我过关。我怒气冲冲地完成了每一步，对这个过程几乎没有或完全没有投入。突然，当我进行到一半时，我必须读到这段声明：“我释放了指责的需求和保持正确的需求。”就在那个时刻，我被击中了。*保持正确的需求！*
    突然，我的脑海中闪过我一直试图在什么方面保持正确。我有一个核心信念：我必须亲力完成所有事情！我看到这件事只是那种信念的另一种体现。所有其他我无意识中创造的被失望的情况都在我眼前一闪而。然后我看到并完全理解了，这个女人是在支持我熟悉这种有毒的信念，以便我能释放它。


    突然，我的愤怒消失了，我看到我违背了自己所教导的东西。我感到非常羞愧——但至少我恢复了意识。我现在能看到这个女人对我来说是一个天使，我的感受从愤怒怨恨转变为对她的感激和爱。


    除了是一次奇妙的觉醒，这还是一次非常有力且谦卑的教训，让我看到人是多么容易变得无意识，以及你如何迅速被卷入戏中。它也证明了我是如何迅速背离了自己的本性，以及为什么我们需要属灵朋友，他们不买账我们的受害者故事并准备好挑战我们。


    现在，你可能问的问题是，在意识到她是我的治愈天使后，我是否取消了对她的诉讼？嗯，我可以告诉你，我曾纠结于


