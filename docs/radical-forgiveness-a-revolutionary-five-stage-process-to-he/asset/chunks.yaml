    During a gathering in Atlanta in 1990, I heard Gerald Jampolsky, a well-known
    author, tell a true story about a couple returning home from the hospital after
    giving birth to their second child. It is a story that illustrates the fact that
    we have a true knowing of our connection with God and our own soul, but that we
    forget it fairly quickly after taking on a body. The couple were conscious of
    the need to include their three-year-old daughter in the celebration of the new
    baby’s homecoming. But they felt perturbed by her insistence that she be allowed
    to go alone into the room with the baby. To honor her request yet oversee the
    situation, they switched on the baby monitor so they could at least hear what
    was going on, if not see it. What they heard astounded them. The little girl went
    straight to the crib, looked through the bars at the newborn child, and said,
    “Baby, tell me about God. I’m beginning to forget.”


    In spite of the veil we lower over the memory of our oneness with God, which the
    above story suggests might become fully drawn around the age of three, as humans
    we are not denied a connection to the World of Divine Truth. Our soul carries
    a vibration that resonates with the World of Divine Truth and connects us to that
    world. We can aid this connection through practices like meditation, prayer, yoga,
    breathwork, dancing, and chanting. Through such practices, we raise our vibration
    enough to resonate with that of the World of Divine Truth.


    There is evidence to suggest that even this is changing rapidly. Everywhere I
    go, I ask the same question of my workshop participants: “How many of you are
    aware of a quickening or a speed-up in our spiritual evolution—and that we are
    being asked by Spirit to move more quickly through our lessons in preparation
    for a profound shift of some kind?” There is almost unanimous concurrence. More
    and more people now talk openly and freely about always being in touch with their
    “guidance” and are willing to trust it more each day. The veil between the two
    worlds is definitely becoming thinner. Radical Forgiveness contributes to this
    process both at the individual level and at the level of collective awareness.


    Yet the two types of forgiveness remain literally worlds apart. Each demands a
    different way of looking at the world and at life. Clearly, traditional forgiveness
    offers itself as a way of living in the world, while Radical Forgiveness is nothing
    less than a spiritual path.


    In terms of our capacity to evolve spiritually, Radical Forgiveness offers extraordinary
    potential to transform consciousness, and this potential far exceeds what is possible
    with traditional forgiveness. Yet we must recognize that we all still live in
    the World of Humanity, and at certain times we will fall short of what we might
    think of the spiritual ideal. When we find ourselves immersed in pain, for example,
    it becomes virtually impossible for us to move into Radical Forgiveness. When
    we have recently experienced harm at the hand of another, such as being raped,
    we cannot be expected to accept, in that moment, that the experience was something
    we wanted and that it represents the unfolding of a divine plan. We will not have
    the receptivity necessary to entertain that idea. It can only come later, in moments
    of quiet reflection, not in the heat of anger or in the immediate aftermath of
    trauma. (FIGURE 4)


    ![](Images/part2_chapter3_image003.jpg)


    FIGURE 4: Distinctions Between Traditional and Radical Forgiveness. For more explanation
    of these distinctions, see Chapter 15: Articles of Faith.


    Then again, we must continually remind ourselves that what we have created *is*
    the spiritual ideal; that we have created circumstances in our lives that help
    us to grow and learn; that the lessons we need to learn are contained in the situation;
    and that the only way to obtain the growth from the experience is to go *through*
    it.


    Our choice in this is not so much whether or not to have the experience (Spirit
    decides this for us), but how long we are going to hang out in victim consciousness
    because of it. Should we choose to quickly let go of victimhood, it is comforting
    to know that we have a technology that will make that happen. Traditional forgiveness,
    by contrast, has little to offer in this regard.


    ### Summary


    - Traditional forgiveness is firmly rooted in the World of Humanity. In the same
    way that the World of Humanity holds the energy of duality, so traditional forgiveness
    polarizes and judges everything as either good or bad, right or wrong.


    *Radical Forgiveness takes the view that there is no right/wrong or good/bad.
    Only our thinking makes it so.*


    - Traditional forgiveness always begins with the assumption that something wrong
    took place and someone “did something” to someone else. The victim archetype remains
    operative.


    *Radical Forgiveness begins with the belief that nothing wrong happened and there
    are no victims in any situation.*


    - Traditional forgiveness is effective to the extent that it calls upon the highest
    human virtues, such as compassion, tolerance, kindness, mercy, and humility. These
    qualities point toward forgiveness and have healing potential. However, in and
    of themselves, they are not forgiveness.


    *Radical Forgiveness is no different in this regard, since it also calls for these
    same virtues to be present in the process.*


    - Traditional forgiveness depends entirely upon our own capacity to feel compassion,
    so it is limited in this regard. No matter how much compassion or tolerance we
    muster for someone like Hitler, and no matter how much we empathize with the pain
    of his upbringing, nothing enables us to forgive him (using traditional forgiveness)
    for the mass murder of over 13 million people.


    *Radical Forgiveness has no limits whatsoever and is completely unconditional.
    If Radical Forgiveness cannot forgive Hitler, it can forgive nobody. Like unconditional
    love, it’s all or nothing.*


    - With traditional forgiveness, the ego and our personality-self call the shots.
    Hence, the problem always appears “out there” with someone else.


    *With Radical Forgiveness, the finger points the other way. The problem lies “in
    here,” with me.*


    - Traditional forgiveness believes in the reality of the physical world, in the
    complete integrity of “what happens”; it always tries to “figure it all out” and
    thus control the situation.


    *Radical Forgiveness recognizes the illusion, sees that what happened was just
    a story, and responds by surrendering to the perfection of the situation.*


    - Traditional forgiveness does not factor in the notion of a spiritual mission
    and maintains its belief in, and fear of, death.


    *Radical Forgiveness sees death as an illusion and takes the view that life is
    eternal.*


    - Traditional forgiveness views life as a problem to be solved or punishment to
    be avoided. It experiences life as a random set of circumstances that just happen
    to us for no reason—thus, the popular bumper sticker, “Shit happens!”


    *Radical Forgiveness sees life as entirely purposeful and motivated by love.*


    - Traditional forgiveness recognizes the inherent imperfection of human beings
    but fails to see the perfection in the imperfection.


    - Traditional forgiveness can carry a high vibration similar to Radical Forgiveness
    when calling upon some of the highest of human virtues, like kindness, humility,
    compassion, patience, and tolerance.


    *The portal through which we begin the journey of raising our vibration to connect
    with the world of Divine Truth and experience Radical Forgiveness is the open
    heart.*

