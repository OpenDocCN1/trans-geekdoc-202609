    灵魂是只投世一次还是周而复始，自古以来一直是争议的话题，直到今天，许多教会和宗教仍然不接受这一观点。然而，东方宗教一直将轮回包含在它们的精神信仰中。我不认为轮回是`激进宽恕`（Radical
    Forgiveness）的核心，无论人们是否相信它都无关紧要。它对`激进宽恕`的效力没有影响，这仅仅是一个个人选择的问题。（如果轮回的概念让你感到反感，请跳过接几页。）


    对我而言，我对这两种观点都不执着，尽管似乎有证据支持这一观点，尤其是通过关于濒死体验的大量文字。这些描述在内容和质量上如此相似，以至于无法反驳。成千上万的人报告了类似的经历，并对他们所看到的都是真实的表现出相同程度的确定。濒死体验对人们生活的影响在很大程度上也是相同的。


    从同一个来源来看，我们的灵魂不仅投世了许多次，而且它们并不是独自进入这个物理生命体验的。前世研究似乎表明，我们的灵魂与灵魂小组中的其他人一起来回回来，以解决特定的业力不平衡。


    在通向完整的过程中，我们创造了必须解决的能量不平衡。这些不平衡被称为我们的`业`（karma）。例如，如果我们利用他人并欺骗他们，我们必须在某个时候经历被欺骗的经历来平衡能量。这不是一种道德练习；与对错无关。正如我已经指出的，`宇宙`（Universe）是中性的。这仅仅是能量的平衡，由`因果律`（Law
    of Cause and Effect）决定，该法则规定每一个动作都有相等的反作用。（参见第九章。）


    我们互动的人以及与他们玩的游戏都是关于这种能量的平衡。每当我们重新平衡业力能量，我们的灵魂就会治愈并恢复完整。因此，每一次轮回都对灵魂的治愈做出了贡献。


    顺带一句，由于时间在`神圣真理世界`（World of Divine Truth）中并不，我们所有的轮回同时发生。当我们在一生中痊愈时，我们也治愈了所有其他的轮回。因此，在某一生中使用`激进宽恕`为灵魂提供了巨大的价值，因为它在治愈当前轮回的同时，也治愈了所有其他轮回。想象一下尼尔逊·曼德拉（Nelson
    Mandela）通过宽恕南非的一代白人对黑人的对待，所平衡的集体业力。同样，想象一下美国在对待奴隶和美国原住民方面仍留待待平衡的集体业力。


    我们的灵魂总是指引我们走向治愈的方向，并不断创造出让我们有机会平衡业力能量的情况。但如果这种治愈没有在`神圣真理`的层面完成，我们倾向于通过怨恨和报复的循环以及受害者意识的维持来重新创造不平衡。这让业力的轮转不停地转圈转下去。`激进宽恕`提供了停止轮转旋转的最佳方法之一，因为它打破了循环。


    话虽如此，如果你对轮回的概念有异议，只需忽略它即可。这没有任何区别。


    **假定（Assumption）：** 尽管我们的身体和感官告诉我们是相互独立的个体，但事实上我们都是合一的。我们都作为一个单一整体的一部分独立地振动。


    我们不是我们的身体。我们不是的人格自我，也不是我们每天扮演的角色。相信我们是这些东西有助于进一步加强我们对分离的信念。坚持这种信念阻碍了我们——至少在觉醒之前——记住我们究竟是谁：作为神的一部分被创造的个体灵魂，并与神合为一。


    **假定（Assumption）：** 当我们还与神合为一时，我们尝试了一个分离是可能的想法。我们陷入了那个想法中，那个想法就变成了我们现在生活的梦。这是一个梦，因为分离并没有真正发生。我们只是认为它发生了——而那个想法产生了我们称之为`自我`（ego，“作为敌人的”的版本）的信念系统。


    曾经，我们完全包裹在`万有之源`（All That Is）——即神之中。我们是无形的、永恒的、不朽的，只知道爱。然后我们产生了一个念头。我们在想，如果我们进入物理现实并体验相反的能量——如形式、变化、分离、恐惧、死亡、局限性和二元性——会是什么样呢？我们对这个想法玩耍了一会儿，总认为如果我们真的决定将这个想法付诸行动，可以随时从实验中抽身。我们没有看到任何危险。于是，决定做出了，我们降低了能量振动，将我们的能量凝成物理形式。在这个过程中，我们忘记了与神的联系，想象我们实际上已经与神分离，并且没有回到`万有之源`的方法。


    这个梦对我们来说变得非常真实，然后我们因为犯了这种与神分离的“原始”罪孽而极度内疚。我们担心神会因为我们这样做而降下愤怒。这种对罪孽、内疚和恐惧的强大信念变成了`自我`，它在我们生活中变成了一种如此强大的力量，以至于在我们脑海中创造了一个由恐惧支配的世界。我们的世界仍然是以恐惧而非爱作为驱动力。


    尽管我们倾向于将其拟人化，但`自我`本身并不是一个实体。它也不代表我们的人格。`自我`代表了一组根深信念，使我们完全确信自己与神是分离的。这些潜意识信念通过愧、恐惧、压抑和投影的动态施加的极端力量，创造了`自我`“活”在我们身上的假象。`自我`将我们困在`人类世界`（World
    of Humanity）中并处于睡眠（无意识），梦见我们与神分离。


    **假定（Assumption）：** 当我们决定尝试轮回时，神赋予了我们完全的自由意志，允许我们选择任何方式进行这次实验，并为自己找到回到`万有之源`的路。


    自由意志在最高水平得到了尊重。与某些人所认为的相反，神对于我们玩弄分离的想法并不愤怒。神给予我们想要的任何东西，无论我们选择什么，每当我们通过祈告和`激进宽恕`寻求帮助时，呼唤总是得到回应。


    **假定（Assumption）：** 生命并非随机事件。它有目的，并为神圣计划的展开提供了每一刻做出选择和决定的机会。


