    这一点的证明作为器官移植手术的副作用不断出现。其中一个广为人知的故事关于一个接受肝脏移植的人。手术后几个月，他开始做梦一个让他无法理解的重复梦。经过一些调查，他发现捐献肝脏的那个人多年一直做着同一个梦。那个梦的记忆显然被嵌入了肝脏的细胞结构中。


    ### 因果体或直觉场


    在下一个阶层上存在着我们可能称之为灵魂、高我或我们与神圣真理世界连接的身体。它也被称为因果体，为我们通往灵性领域提供了桥梁。精神场处理的是具体层面的思想和思维形式，而这一场则在概念、抽象、形象和符号的层面处理这些内容。它处理本质、直觉和“直接知晓”。因果体超越了个人，渗透到集体意识——或者荣格所说的集体无意识，这是一个我们所有个体都连接并与之接入的单一心灵。


    微妙体在谐波中升起的观点绝非新事；它已经包含在世界范围内许多伟大的精神传统中，尤其是东方的传统。


    **假设：** 作为生命力和意识的宇宙能量通过脉轮系统进入我们的身体。前三个脉轮与人类世界对齐，而第四到第八个脉轮与神圣真理世界的对应更为密切。


    除了包含我们不同频率微妙体的能量海洋外，我们人类还拥有一套在体内垂直排列的能量中心。这些被称为脉轮（chakras），在梵语中意为“轮子”，因为它们像旋转能量的漩涡。


    脉轮的作用就像变压器。它们接收来自宇宙的能量或生命力（`prana`、`chi`、`基督能量`），并将其降低到物理身体的生物分子和细胞过程可以使用的频率。脉轮还代表了每个微妙体连接物理体的位置，从而将不同层次的意识引入我们的存在中。它们处理我们的日常体验、思想和感受，同时也携带着与个人和部落历史、长期存在的思维模式以及原型相关的长期数据。（图
    13）


    ![](img/part3_chapter15_image001.jpg)


    图 13：人体脉轮系统


    前三个脉轮拥有在存在链低频率处振动的意识水平，并植根于人类世界。它们携带着受害者原型的能量。传统的宽恕是前三个脉轮意识下唯一可能的宽恕类型。通过第五、第六、第七和第八个脉轮产生的意识更有可能与神圣真理世界的能量对齐，而第四个心轮则提供了提供了人类世界与神圣真理世界之间的联系。


    此外，每个脉轮都与一个内分泌腺相关，并对应同一区域特定的神经结。每个脉轮也有与其相关的颜色和声音，并滋养身体的特定部分。脉轮还作为与其连接的身体部位及其服务的功能相关的数据库和处理器。


    | • || 第一个（根轮）脉轮携带与扎根于大地母亲以及基本信任、安全和生存意愿相关的数据。这个脉轮在部落/社会意识上运行。 |

    | --- | --- |

    | • || 第二个（骶骨轮）脉轮携带与创造力、性能量和负罪感相关的数据。这个脉轮在部落/社会意识上运行。 |

    | --- | --- |

    | • || 第三个（太阳穴轮）脉轮携带与权力、控制和背叛相关的数据。这个脉轮在部落/社会意识上运行。 |

    | --- | --- |

    | • || 第四个（心轮）脉轮携带与爱、滋养和慈悲相关的数据。这个脉轮在个人意识上运行。 |

    | --- | --- |

    | • || 第五个（喉轮）脉轮携带与个人力量、关系和表达相关的数据。这个脉轮在个人意识上运行。 |

    | --- | --- |

    | • || 第六个（第三眼轮）脉轮携带与直觉知识、透视和真理相关的数据。这个脉轮在个人意识上运行。 |

    | --- | --- |

    | • || 第七（顶轮）脉轮携带与精神意识和与源头连接相关的数据。这个脉轮在个人意识上运行。 |

    | --- | --- |

    | • || 第八个脉轮位于头部上方，代表我们对生命使命的合同或协议。 |

    | --- | --- |


    尽管脉轮系统是东方传统的核心，但西方医学科学对其完全不关注。当这些能量中心失去平衡时——例如在情绪波动或受到创伤时——它们会反转旋转，变得非常无常，在某些情况下会关闭。愤怒、怨恨和伤害往往会关闭心轮和喉轮；负罪感和缺乏信任会削弱骶轮，以此此类推。幸运的是，脉轮可以很容易地恢复平衡。有一些敏感的从业者能够感觉到每个脉轮的能量并拥有重新平衡它们的技术。许多能量医学如针灸、顺势疗法、芳香法等都直接作用于脉轮并使其恢复平衡。


    ## 第四


    # 激进宽恕工具


    #### 16


    ### 一种灵性技术


    在编写这本书的第一版时，我心中有两个目标。首先，我想尽可能简单地解释“激进宽恕”的概念，以便尽可能多的人接触它。其次，我想让它尽可能实用，以便人们可以在日常生活中它。这意味着要包含不仅有效而且快速易于使用的工具。


    在撰写这个版本时，我承认书中的工具所被证明的有效程度超出了我的想象。我发现它们在帮助人们治愈生活方面表现出的强大令我惊叹。我也意识到，它们的工作方式与顺势疗法并不相似。也就是说，它们以全息能量的方式（利用整体的能量）运作。


    在全息宇宙中，宇宙的每一个微小部分不仅与整体在能量上连接，而且包含了整体。因此，从能量的角度来看，你无法改变一部分而不影响整体。

    '
- fmt: '

    Homeopathy uses this principle by making remedies that affect the energy system
    of the organism in exactly this way. The tiniest part of an active ingredient
    is put into water and is then diluted many thousands of times to the point where
    there is no physical trace of the substance left. What does remain, however, is
    the energetic imprint of the substance, and therein lies the power to heal. When
    the person takes the remedy, the subtle body registers the imprint and becomes
    stimulated to move energy in whatever way it needs to in order to heal at all
    levels.


    The same thing happens with these Radical Forgiveness tools. Just as someone might
    look at the homeopathic remedy and, seeing only water, find great difficulty in
    imagining that it has the power to heal, so might someone looking at a forgiveness
    worksheet, for example, be thoroughly skeptical about its ability to change her
    life.


    Yet it works. Thousands of people have used the Radical Forgiveness worksheet
    (see section entitled “The Radical Forgiveness Worksheet”) or listened to the
    `Radical Forgiveness` CD (see section entitled “TELLING THE STORY”) or walked
    the circle in the Radical Forgiveness ceremony (see Further Resources section)
    and experienced miracles in their lives.


    These tools work because each of them is simply the delivery system for the secret
    ingredient: the energetic imprint of Radical Forgiveness, i.e., the willingness
    to be open to the idea that there is nothing to forgive.


    The process is very subtle. Mind control or making things happen at the gross
    level through affirmations, visualization techniques, or hypnosis has little relevance
    to Radical Forgiveness. It does not require a high level of belief or faith, nor
    do you need to be in a meditative or altered state. All you must do is use a simple
    tool that asks little of you in the way of intelligence, discipline, or skill.
    It asks only that you express a tiny amount of willingness—that’s all. In this
    edition of the book, I have even simplified the worksheet so that in some places
    you only have to check boxes in answer to a few questions. It still works.


    Since forgiveness is always a “fake it ‘til you make it” proposition, we are indeed
    fortunate that it needs only that small amount. If you had to wait until you had
    100 percent willingness to believe that the situation was perfect, you would never
    begin the process.


    The following story is an example of how this transformation can occur in an instant
    using one of the Radical Forgiveness tools—interestingly enough, the quickest
    and simplest of them all: the `13 Steps to Radical Forgiveness`.


    ## DEBI AND THE 13 STEPS


    Debi was a studio singer, which means she sang jingles, commercials, radio IDs,
    and things like that. She was considered to be among the best in the business.
    In 1999, she came to study with me to become a Radical Forgiveness coach.


    At one point during the training, I wanted to teach her how to facilitate the
    `13 Steps to Radical Forgiveness`. It takes no more than seven minutes and involves
    responding in the affirmative to thirteen very simple questions.


    The thirteen questions all relate to our willingness (the secret ingredient) to
    see the perfection in the situation whether we understand it or not. The answer
    to each question is yes.


    I asked Debi if she had a situation to work with for this process. She thought
    for a while and then said: “Yes, here’s something I’ve been upset about for a
    while. I’d almost forgotten. About thirteen years ago, I was in a studio and in
    came a guy whom I knew reasonably well but was not real close to. We chatted for
    a while, and eventually he came out with what was really on his mind. He said,
    ‘Debi, I have this great product that’s just perfect to market on the radio, and
    I need you to do an ad for me. The problem is, I don’t have money right now, but
    will you do it as a big favor to me?’


    “Well, I finally gave in and agreed to do for seventy-five dollars what I normally
    charge a lot of money for. I did the ad, and what do you know, it made him a multimillionaire
    overnight.


    “Some time later, when I ran into him, I suggested he might want to send just
    a little bit of that my way in appreciation of what I had done for him. His response
    was, ‘Debi, we’re not in the business of giving money away!’”


    This was perfect. She was obviously into her feelings about it—even after thirteen
    years! This was understandable given the fact that every time she had turned the
    radio on over the last thirteen years, there was that ad. As you might imagine,
    it had all the ingredients of a victim story—betrayal, insult, manipulation, withholding,
    ingratitude, and so on.


    So I immediately proceeded to take her through the process. It took no more than
    the seven minutes, and as always after doing a process like that, we went on to
    something else without any further discussion. (Talking about it would destroy
    the energy field created in the process.)


    She went out that evening and returned to her hotel at around 11p.m. She called
    me at 11:05 in a state of great excitement. She had checked her voicemail messages,
    and one was from the studio producer who had helped her do that very ad.


    The message went like this: “Debi, that commercial you recorded for Mr. X has
    come up again, and it needs to be re-recorded. But the copyright has expired,
    so you would earn all the royalties on it this time. Are you interested?”


    Well, as you might imagine, I started jumping up and down yelling, “Hey, this
    stuff really works!” Then Debi said, “But there’s more. When we did the `13 Steps`,
    I happened to glance at the clock on the wall, and for some reason I registered
    the time quite clearly in my mind. It was 3:01p.m. That message came in at 3:02!
    One minute later—and I hadn’t spoken with him for months!”


    Debi’s victim story about how she was used, cheated, dishonored, insulted, and
    rejected had kept the energy stuck for thirteen years. It was not until she was
    invited to express a minute amount of willingness to see that she had created
    that story out of her own perception of the situation—and, during the `13 Steps`
    process, reframed it in a way that reflected spiritual truth—that the energy field
    collapsed. At no point did we “work” on her story. That would only have given
    it more power and reinforced it. Instead we used the holo-energetic technology
    of Radical Forgiveness to transform the energy.


    It is interesting to look at what might have been happening here. Most people
    would have agreed with Debi that this man had betrayed, insulted, and dishonored
    her with his selfish attitude. Yet the very fact that he exhibited this really
    quite peculiar kind of behavior was a clue that something else was going on beneath
    the apparent situation.


    At the time that event occurred, Debi’s self-esteem was very low. Even though
    she was always being told what a good singer she was, she could never accept it;
    she would always put herself down. She had an unconscious belief that she wasn’t
    worthy of what she could rightly charge for her talent.


    It is a principle of Radical Forgiveness that if you have a limiting belief which
    prevents you from becoming whole or from achieving your true purpose, your Higher
    Self will always find a way to acquaint you with your limiting belief so you can
    heal it. It can’t intervene directly, because you have free will. But it can,
    through the Law of Attraction, bring into your life someone who will act out your
    belief for you so you can see it for what it is and choose to let it go.


    This man resonated with Debi’s limiting belief that she was unworthy, not good
    enough, and undeserving, and he responded to the call. His Higher Self colluded
    with hers to play this worthiness issue out so that she could see the idea, feel
    the pain of it, and choose again.

