    “How have I done that?” Jill interrupted. “I don’t see how I have created myself
    not being enough in my life.”


    “How was your relationship with Henry?” She had been married to Henry, her first
    husband and the father of her four children, for fifteen years.


    “Not bad in many respects, but he was such a womanizer. Always looking for opportunities
    to make out with other women. I hated that.”'
