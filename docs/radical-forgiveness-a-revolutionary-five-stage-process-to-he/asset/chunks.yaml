  trans: '

    这解释了为什么转化某些事物的决定只能从“神圣真理世界”（World of Divine Truth）做出。我们人类被困在对痛苦与苦难、恐惧与死亡的信念中，以至于我们可能认为某个孩子的灵魂来到这个世界是为了经历虐待，并且实际上想要被虐待，但我们根本无法坐旁目睹这种事情发生。从神圣真理世界来看，这项任务似乎很容易，但在下方的物理平面上，情况看起来完全不同。谁会把孩子留在受虐待的环境中？我们禁不住要干预。我们是人啊！


    正如我们在前面的章节中看到的，我们需要顺服这样一个观点：即“灵性”（Spirit）非常清楚自己在做什么。如果代表孩子进行干预并不符合其最高、最佳利益，灵性会安排没有人注意到这种虐待。相反，如果灵性决定干预是有必要的，那么它就会安排一切发生。如果灵性决定代表孩子进行干预符合其最高、最佳利益，它就会安排让大家注意到虐待。


    ### 激进宽恕如何转化


    这并不是说，转化意味着我们作为人类无法从神圣真理世界做出决定。转化时，我们必须顺服这样一个观点：即灵性非常清楚自己在做什么。当我们作为人类应用了激进宽恕，并以最人性化、慈悲的方式做出反应，这种能量就会改变虐待的发生。


    最终，我们作为人类会改变虐待模式的能量场。无论我们是否真的参与其中，只要我们应用激进宽恕，这种能量就会发生改变。


    我曾受邀向调解员协会（Mediators）进行演讲，关于激进宽恕。我刚才所描述的内容基于鲁伯特·谢尔德拉克（Rupert Sheldrake）的“形态场”（morphic
    fields）和“形态共振”（morphic resonance）理论。谢尔德拉克是一位英国生物学家，他假设自然界存在自我组织和调节系统。元素通过形态共振相互吸引产生这些场。当场中的一个元素改变时，这一概念似乎适用于所有层面。


    在人类背景下，形态场通过感官和能量共振（意识）连接个体成员，这一过程不受时空的限制。这就是为什么当一个人宽恕时，被宽恕的人无论在多远的地方都能感受到这种影响。


    回到我们调解员的情境，我们可以认为他们经常处的处境是一个形态场，场中的成员通过形态共振被受害者意识联系在一起。只要其中一个成员（调解员）将意识向爱和接受现状的方向转变，场就会立即发生转化，并演变为更高层次的新振动排列。通过形态共振，小组的其他成员有机会以同样的方式重新对齐，情境可以朝着完全不同的方向发展，如果意识没有这样转化，情境将会如何。


    #### 尼尔松·曼德拉向我们展示了如何做


    尼尔松·曼德拉在 20 世纪 90 年代种族制度结束时处理南非局势，是通过激进宽恕转化能量的典范。种族制度是一项持续了四分之三世纪的白人政治体系，将黑白分开——白人享受奢侈，黑人则处于极度贫困中。曼德拉本人被禁了二十六年。出狱后，他当选为总统。南非本可能发生报复性的血杀，但曼德拉带来了一场令人惊讶的和平过渡，其标志不是报复，而是宽恕。

