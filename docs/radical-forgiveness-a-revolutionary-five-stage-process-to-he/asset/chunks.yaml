    为了我们的精神进化以及最终从“受害者原型”中解脱，我们必须慈悲地给内心那个顽童的生活画上句号。因此，我建议你举行葬礼，并宣布他或她已经死亡。如果你选择进行这项练习，你可能会对失去内在小孩感到哀伤，这没关系。毫无疑问，多年来你的内在小孩在你的痛苦中给予过你慰藉和安慰，但现在是时候前行了。激进宽恕让你不再需要执着于受伤，所以现在就允许自己释放你的内在小孩吧。


    只要你还抓着过去的伤口，激进宽恕就不可能实现。执着于内在小孩只会阻碍你，因为那个孩子代表了你过去的伤口。当你想要继续生活时，你可能会惊讶地发现，你的内在小孩也想向前走！要释放你的内在小孩，请尝试以下冥想。


    ### 葬礼冥想


    舒服地坐好，深呼吸三次，随着呼吸呼出身体，让身体放松。注意身体内任何仍然紧绷的部位。有意识地放松这些部位，知道在这次冥想过程中，你的身体会随着每一次呼吸不断放松——很快，你将从头到脚感到彻底放松。现在看向你的内心，找到那个房间，那里坐着那个自愿承担你痛苦的年轻人。找到那个怀着你被虐待、忽视、背叛、遗弃、不被接受或不被爱的记忆的内在小孩。


    当你在这个房间里遇到这个小人时，注意到他或她周围环满了清单、账簿、图表和评分卡。房间的墙上贴满了人的名字、他们对你做过的事，以及你认为他们应该受到的惩罚。在账簿中，孩子仔细记录了他人受害你的每一个时刻，以及你为此付出的代价。注意这个房间里毫无喜悦。当你看着这个年幼的孩子时，意识到他或她独自被锁在里面与痛苦为伴，陷在受害者意识中，内心是多么悲伤。


    意识到是时候做出改变了，你穿过房间，推开窗户让阳光照射进来。当阳光洒满房间，墙上图表上的墨水开始褪色，账簿开始化为灰烬。钉在墙上的清单也落在地上并融化。看着在这个房间里生活了多年、日复一日记录着怨恨分值的小人。看到他或她宽阔的笑容和喜的表情。


    “现在我可以自由离走了，”孩子说道。


    “去哪里？”你问道。


    “我可以自由去下一个地方了。我本该多年前就离开的，但我一直在等你把我从这份工作中解脱出来。”


    突然，你注意到这个不久前还那么年轻、像孩子一样的人就在你眼眼前变老、变得枯萎、白发。然而，一种巨大的平静已经取代了他或她的悲伤。


    “谢谢你让我走，”他或她喘息着，缓慢地躺在沙发上。


    你说：“抱歉花了这么久才把光带进这个房间。抱歉我拖了你的后腿。”


    “没关系，”传来轻柔的回道，“真的没关系。反正时间只是幻象。再见。”说完，小人去世了，神情平和而宁静。


    你慈悲地用白布裹住这个小人，将遗体带上楼，走向光亮。那里有一辆马车在等候，天使在附近盘旋，轻声歌唱。你生命中出现过的所有人都在等待着致意。所有的过去伤害都已被原谅。爱无处不在。马车上的铃铛轻声作响，随从队开始缓慢走向准备好墓地的山丘。在墓旁，每个人都在歌唱，巨大的喜悦笼罩着众人。你的天使与你在一起，支持你完成最后的告别。看着小人在天体合唱团的歌声中，被慈悲而温柔地放入墓中。当墓石被放在墓上时，你感到一种新的自由和爱流经全身。


    你走到山脚，发现那里有一条湍急的小溪。你用水洗手、脸，看到了自己的倒影。感受溪流洁净的水流过你的存在，带走了小人曾经居住的房间里所有的尘土和碎片。听听水流过岩石的声音。看到阳光在水面上闪烁，感受阳光洒在身上的温暖。注意周围绿色的田野和许多鲜艳的花朵。一切都好。当你觉得准备好时，随时睁开眼睛。


    没有了受伤的内在小孩会感到很奇怪，但你也将开始注意到一些积极的变化。你会感到更轻盈、负担更少、更活在当下。当你找回曾经用于执着内在小孩伤口的能量时，你的生命能量将会增加。


    做好准备，可能会与以前与你分享伤口的亲密朋友产生问题。他们不会喜欢你的这种变化，因为他们会看到你不再赋予伤口力量。如果你是某些以分享伤口为核心的支持小组成员（例如酒精成瘾者
    `ACOA` 或性侵幸存者），请做好准备与小组脱节。


    # 后记


    在最初出版这本书的十二年后，我终于跟上了自己的思维：激进宽恕远不止是一个简单的宽恕过程——事实上，它比我想象的要大得多。


    '
- fmt: '

    But the truly amazing gift that it offers humanity lies in its capacity to serve
    as a bridge: a bridge that enables us to move freely and easily, without knowing
    it, between third-dimensional reality and fourth-dimensional reality. A bridge
    that enables us to practice operating from the love vibration of the latter while
    existing physically in the former. Such a bridge is necessary because even though
    deep down we know that fourth-dimensional reality is based on love, peace, oneness,
    and joy—and we yearn desperately to go there—we are terrified at the thought of
    letting go of what is all so familiar. This is true even though the current reality
    is one based on fear, separation, and pain. The doubt is real and deep-seated—what
    if I jump into the void and find that the other reality doesn’t exist after all?


    So, while the technology of `Radical Forgiveness` ostensibly appears to be about
    helping us forgive ourselves and others, its real purpose is to give us a chance
    to `practice` being in that other reality while being blissfully ignorant of our
    actual presence there. It lulls us into thinking that we are simply doing a forgiveness
    worksheet, or one of the other processes, when in fact we are—without realizing
    it—actually stepping across that chasm and operating in fourth-dimensional reality.
    By the use of “smoke and mirrors” and the blessing of ignorance, our ego happily
    goes along with the process.


    Like anything else, the more we practice something, the less fear we have about
    it. When the time comes for us to make the shift—which I believe is imminent—we
    will be so accustomed to being in the vibration of the love-based reality (through
    using `Radical Forgiveness`) that our fears about making the final leap will have
    evaporated.


    This brings me to a question that people who have just completed one of my workshops
    frequently ask: “How can I stay in the `Radical Forgiveness` vibration and not
    get pulled back into victim consciousness by the world around me?”


    The quick answer is simple—keep using the tools. Each and every time we practice
    `Radical Forgiveness`, we become more and more anchored in the fourth-dimensional
    reality and, in turn, it becomes less and less likely that we will choose to return
    to the third. Eventually, it will become our default way of being, and we will
    have become fully stabilized at the higher vibratory rate.


    But there is a much deeper aspect to this question that we must also address.
    In order to keep using the tools so that we remain playing in fourth-dimensional
    reality and raising our vibration, we must stay awake.


    Refer to the `Victimland Roller Coaster` diagram see “FIGURE 18`. Here we see
    that if we become so upset that we go above the line marking both the loss of
    spiritual consciousness and our crossing into Victimland, we are in deep trouble.
    The result is a dramatic lowering of our vibratory rate and the loss of awareness
    of the newfound reality. We find ourselves back in the world of separation and
    fear-based reality—back in the grip of the ego. The furthest thing from our mind
    at this point is doing a worksheet or listening to the `Radical Forgiveness` CD.
    In short, we are lost.


    I now see this phenomenon as not just a setback for the people who lose what they
    have gained through the `Radical Forgiveness` experience (as the question about
    falling back into victim consciousness implies might happen), but as the thing
    most likely to impede the achievement of the mission to create a world of forgiveness
    by 2012.


    As you know, to create this Awakening, a certain critical mass of people whose
    consciousness is sufficiently raised to counteract the many whose vibratory rate
    remains low is required. It is critical, therefore, that all those who have had
    their vibration raised (even by reading this book), remain awake and engaged in
    the very process that keeps them traversing that bridge.


    Until now, my primary goal in using `Radical Forgiveness` has been to heal our
    wounds and release energy blocks in order to improve our lives—not that I have
    restricted it to working with individuals, for I have found it to be every bit
    as potent a technology for healing communities. Working in Australia gave me the
    opportunity to try it in the context of the reconciliation movement that is happening
    there as white and aboriginal Australians come together to heal their terrible
    past. I wrote and published a book there called `Reconciliation Through Radical
    Forgiveness: A Spiritual Technology for Healing Communities.` This book was designed
    to give everyone in Australia who wanted reconciliation the spiritual technology
    to bring it about—something they could use in their own homes, schools, and communities.
    I am doing the same thing now with corporations.


    So yes, of course this work will continue, but my colleagues and I at the `Institute
    for Radical Forgiveness` are also extending that focus to include helping people
    not only to maintain the high vibratory rate gained during the `Radical Forgiveness`
    experience, but to increase it steadily to as high a level as possible so that
    there will be no going back.


    To this end, we have created a `Radical Empowerment` program designed to enable
    people to operate from a higher-than-normal vibratory rate, and, instead of always
    being the `effect` in a cause-and-effect world, to become the `cause` in their
    own life. `Radical Empowerment` is a combination of `Radical Forgiveness` (to
    clean up the past and deal effectively with the present), and `Radical Manifestation`
    (to create the future). Hence the formula: `RE=RF+RM`. Empowered in this way,
    people will be able to manifest what they want, easily and quickly.


    One of the keys to our spiritual empowerment, and central to our maintaining our
    connection with the `Radical Forgiveness` vibration, is the systematic development
    of that part of our consciousness known as the `observer`. This is the self-aware
    part of ourselves that is able to witness or observe the whole community of selves
    within. From its vantage point outside of, or separate from, ourselves, it will,
    if trained to do so, notice when we begin to go unconscious. It will then take
    steps to bring us back—probably by reminding us to do the four-step process in
    that moment, or to listen to the `Radical Forgiveness` CD. A trained `observer`
    will keep us out of `Victimland`—free and always with choice in our lives.


    Another question that inevitably comes up is: “How can I effectively apply the
    `Radical Forgiveness` technology to every area of my life?”


    The answer to this is also contained in the `Radical Empowerment` program. Once
    you have integrated the `Radical Forgiveness/Radical Manifestation` model into
    your consciousness and developed your `observer` to a reasonably high degree,
    you will naturally begin to utilize `Radical Empowerment` in every aspect of your
    life. It will be hard not to.


    The third question that arises once people realize the potential of this work
    to make a difference in the world and see in it themselves the possibility to
    do meaningful spiritual work, becomes: “How can I share this with others?”


    The answer is that we now have in place a professional certification program through
    which you can be trained to become (a) a `Radical Empowerment Teacher`, (b) a
    `Radical Forgiveness` coach, or (c) a `Radical Manifestation` coach and workshop
    facilitator (see `Further Resources`).

