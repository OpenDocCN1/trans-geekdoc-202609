- fmt: '

    Whether a soul incarnates just once or does so over and over again has been an
    issue of contention through the ages, and many churches and religions will not
    consider this idea even today. Yet Eastern religions have always included reincarnation
    among their spiritual beliefs. I do not regard reincarnation as central to `Radical
    Forgiveness`, and it is of no consequence whether one believes it or not. It has
    no effect on the efficacy of `Radical Forgiveness` and is simply a matter of personal
    choice. (If the idea of reincarnation offends you, skip the next couple of pages.)


    For myself, I am not attached either way, although there does seem to be evidence
    to support the idea, especially through the vast amount of writing about near-death
    experiences. These accounts are so similar in their content and quality they can
    hardly be refuted. Thousands of people have reported similar kinds of experiences
    and exhibit the same degree of certainty that what they saw was real. The effects
    near-death experiences have on people’s lives are more or less identical as well.


    From this same source, it appears that not only do our souls incarnate numerous
    times but that they do not come into this physical life experience alone. Past
    life research seems to suggest that our souls keep coming back time and time again
    with others from our soul group to resolve particular karmic imbalances.


    During our journey toward wholeness, we create energy imbalances that have to
    be resolved. These imbalances are referred to as our `karma`. For example, if
    we take advantage of people and cheat them, we must at some time have the experience
    of being cheated to equalize the energy. This is not a moral exercise; it has
    nothing to do with right or wrong. As I have already noted, the `Universe` is
    neutral. This happens simply as a balancing of energy and is dictated by the `Law
    of Cause and Effect`, which states that for every action there must be an equal
    reaction. (See Chapter 9.)


    The people with whom we play and the games we play with them are all about balancing
    energy in this manner. Our soul heals and becomes whole again each time we rebalance
    the karmic energies. Thus, each incarnation contributes to the healing of the
    soul.


    Incidentally, since time does not exist in the `World of Divine Truth`, all our
    incarnations happen simultaneously. As we heal in one lifetime, we heal all the
    other incarnations as well. Using `Radical Forgiveness` in one lifetime, therefore,
    provides incredible value to a soul because it heals all the other incarnations
    at the same time as it heals the current one. Imagine the collective karma that
    was balanced by `Nelson Mandela` forgiving a whole generation of whites in South
    Africa for their treatment of blacks. By the same token, imagine the collective
    karma that remains to be balanced in the United States for the treatment of slaves
    and Native Americans.


    Our soul always moves us in the direction of healing and keeps creating situations
    that offer us the opportunity to balance karmic energy. But if this healing is
    not accomplished at the level of `Divine Truth`, we tend to recreate the imbalance
    through the resentment and revenge cycle and the maintenance of victim consciousness.
    This keeps the wheel of karma spinning round and round and round. `Radical Forgiveness`
    provides one of the best ways to stop the wheel from turning, because it breaks
    the cycle.


    Having said all that, if you have a problem with the concept of reincarnation,
    simply ignore it. It makes no difference.


    **Assumption:** While our bodies and our senses tell us we are separate individuals,
    in truth we are all one. We all individually vibrate as part of a single whole.


    We are not our bodies. We are not our personality selves or the roles we play
    each day. Believing we are these things serves to further reinforce our belief
    in separation. Upholding this belief prevents us—until we awaken, that is—from
    remembering who we really are: individual souls created as part of God and existing
    in oneness with God.


    **Assumption:** When we were all one with God, we experimented with a thought
    that separation was possible. We became trapped in that thought, which became
    the dream that we now live. It is a dream because the separation did not actually
    happen. We only think it did—and that thought gave birth to the belief system
    we call the `ego` (the “as enemy” version).


    Once we were completely enfolded in the `All That Is`—God. We were formless, unchanging,
    and immortal, and knew only love. Then we had a thought. What would it be like,
    we wondered, if we were to descend into physical reality and experience the opposite
    energies—such as form, change, separation, fear, death, limitation, and duality?
    We played with the idea for a while, always thinking we could withdraw from the
    experiment any time we wished, should we indeed decide to put the thought into
    action. We saw no danger. Thus, the decision was made, and we lowered our energetic
    vibration to condense our energy into physical form. In the process, we forgot
    our connection to God and imagined we had actually separated from God and that
    we had no way back to the `All That Is`.


    This dream became very real for us, and we then became extremely guilt-ridden
    for committing this “original” sin of separating from God. We became fearful that
    God would bring His wrath down upon us for having done so. This powerful belief
    in sin, guilt, and fear became the `ego`, and it became such a powerful force
    in our lives that it created in our minds a world dominated by fear. Our world
    is still one where fear, rather than love, is the driving force.


    Though we tend to personify it, the `ego` is not an entity in and of itself. Neither
    does it represent our personality. The `ego` represents a set of deeply held beliefs
    that keep us utterly convinced of our separateness from God. The extreme power
    exerted by these subconscious beliefs through the dynamics of guilt, fear, repression,
    and projection creates the appearance that the `ego` “lives” in us. The `ego`
    keeps us stuck in the `World of Humanity` and asleep (unconscious), dreaming that
    we have separated from God.


    **Assumption:** When we decided to experiment with physical incarnation, God gave
    us total free will to live this experiment in any way we chose and to find for
    ourselves the way home to the `All That Is`.


    Free will is honored at the highest level. Contrary to what some would have believe,
    God is not mad at us for playing with the idea of separation. God gives us anything
    we want, whatever we choose, and makes no judgment about it. Whenever we ask for
    help through prayer and `Radical Forgiveness`, the call is always answered.


    **Assumption:** Life is not a random event. It has purpose and provides for the
    unfolding of a divine plan, with opportunities to make choices and decisions in
    every moment.


    Seen from the `World of Humanity`, it might appear that we arrive on this planet
    by biological accident. Our only significance lies in the fact that our parents
    made love and started a chain of biological events called pregnancy and birth.


    It also might appear as if the only ways to master the experience of life are
    to learn a lot about how the world works and develop skills that enable us to
    control, as much as possible, the seemingly random circumstances of our lives.
    The more mastery we achieve over the physical circumstances of our lives, the
    better our lives appear to become.


    The opposite is true when viewed from the `World of Divine Truth`. From this perspective,
    our arrival on the planet represents a deliberate, planned, and conscious choice.
    The plan includes the selection of the people who will serve as our parents.


    Also, the seemingly haphazard events of our lives are attributed to the unfolding
    of a divine plan, decided upon in advance, and completely purposeful in terms
    of our spiritual growth. The more we surrender to this unfoldment without trying
    to control it, the more peaceful we become.

