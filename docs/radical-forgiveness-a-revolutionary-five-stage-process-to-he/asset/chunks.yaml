- fmt: '

    Metaphorically, we run a movie called Reality through our minds (the projector),
    and we project it “out there.” Once we understand that what we call reality is
    just our projections, instead of blaming others we can begin to take responsibility
    for what we have created with our thoughts. When we change our perception and
    drop our attachment to our belief that what appears on the screen represents reality,
    we experience Radical Forgiveness.


    ### Consciousness Determines What Happens


    While it may seem difficult to see the principle of cause and effect operating
    in our lives, it becomes apparent when we trace back from what is occurring. In
    other words, if you want to know your beliefs, just look at what is happening;
    that will tell you what you are projecting. For example, if you keep getting attacked
    or disasters keep happening to you, the likelihood is that you believe the world
    is inherently an unsafe place. You are creating these events to prove that you
    are right about that and people are supporting you in this belief by appearing
    to you to behave in a threatening or dangerous manner.


    Some friends of mine have a spiritual conference center in the mountains of North
    Carolina. Werner, being of a prudent nature, thought he and his wife, Jean, should
    have insurance to protect their buildings against fire, storm damage, and the
    frequent tornadoes that come through each season. Jean was very much against the
    idea. She felt having such insurance would clearly indicate to the Universe that
    they did not trust in their safety. Now, I am not advocating this, but they decided
    against purchasing the insurance.


    The following year, a huge storm hit their very mountain and devastated the area.
    Thousands of trees were uprooted and thrown down. When my wife and I drove up
    to visit them two weeks later, we couldn’t believe our eyes: it looked like a
    war zone. They had obviously been obliged to cut their way out. The storm had
    happened while thirty-six people were at the center attending a conference, and
    they were unable to leave for two whole days. But in spite of all the trees down,
    not a single car or any of the buildings were touched—and all were right in among
    the trees. Trees fell within inches of structures and autos but miraculously damaged
    nothing. For my friends, it was a great confirmation of their faith and willingness
    to trust.


    Looking at this from a cause-and-effect standpoint, Jean recognized that buying
    insurance reinforced a belief (a cause) in adversity and would create the energy
    for something bad (an effect) to happen. Instead she chose the thought (cause)
    “We are doing God’s work here, and we are absolutely safe.” The effect, as it
    played out in the world, was that in the midst of chaos nothing bad happened.


    As I have said, if you want to know your beliefs, look at what you have in your
    life—or what you do not have. If, for example, you do not have love in your life
    and do not seem to be able to create a loving relationship, examine your beliefs
    about self-worth, or about safety with the opposite sex. Of course, this may not
    be as easy as it sounds, for the beliefs you hold may be buried deep in your subconscious
    mind.


    ### You Don’t Need to Know Why


    The good news is that you do not have to know why you created your situation or
    what beliefs led you to its creation. Just seeing the situation’s existence as
    an opportunity to perceive it differently—being willing to see it as perfect—is
    enough to bring about the required shift in perception and a healing of the original
    pain.


    The truth is, we in human consciousness cannot know why or not as long as we are
    in form.


    ### Just Surrender


    If we engage in activities and consistent ways that result in our vibration being
    raised (through continual use of Radical Forgiveness over a long period of time,
    for instance), we may find ourselves becoming first cause.


    ### Freedom from the Law


    It is important to realize that as long as we are in human form, the Law of Cause
    and Effect only applies to the World of Humanity. In Divine Truth, there is no
    such thing as karma or effect. There is only first cause, which is God.

