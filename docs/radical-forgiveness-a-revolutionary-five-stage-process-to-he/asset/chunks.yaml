    # Afterword


    Twelve years after first publishing this book, I have finally caught up with my
    own thinking about Radical Forgiveness being much larger than a mere process of
    forgiveness—bigger, in fact, than I ever imagined.


    I have known from the beginning that Radical Forgiveness has never been about
    forgiveness *per se—*at least not as we have traditionally conceived of it. It
    is indeed an alternative way of forgiving that is quicker and more effective than
    any other form of forgiveness, but it’s something infinitely greater, more all-encompassing,
    and more revolutionary.


    It is nothing less than a mind-blowing idea that shatters our existing ideas of
    reality and challenges our current worldview. It invites us to engage in a process
    that is rooted in a fourth-dimensional reality that we don’t yet understand. Neither
    is there much proof of its efficacy, other than the evidence of our own awareness
    of how significantly changed we become when we engage in it. (If you’ve done a
    worksheet, you’ll know what I mean.)


