    \ the mediators, we can think of the situation they most often find themselves\
    \ in as a morphic field in which the individuals are held together, through morphic\
    \ resonance, by a victim consciousness. As soon as one member (the mediator) shifts\
    \ his consciousness in the direction of love and acceptance of what is, as is,\
    \ the field immediately undergoes a transformation and evolves into a new vibratory\
    \ arrangement of a higher order. Through morphic resonance, the other members\
    \ of the group have an opportunity to become realigned in the same way, and the\
    \ situation can evolve on completely different lines from the way it would have\
    \ had the consciousness not been transformed in this way.\n\nI mention Sheldrake’s\
    \ work to show that the way we talk about energy and consciousness has a firm\
