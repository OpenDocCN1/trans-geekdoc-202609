    ![](Images/part2_chapter7_image001.jpg)  \n\nFIGURE 7: Projecting Our Repressed\
    \ Shame\n\n#### **Recognize When You’re Projecting**\n\nAs soon as you find yourself\
    \ judging someone and getting angry, you know you are projecting. Anger serves\
    \ as the constant companion of projection, for you always use this emotion to\
    \ justify the projection of your self-hatred.\n\nWhat you find so objectionable\
    \ about this person simply serves as a reflection of that part of you that you\
    \ have rejected and denied in yourself (your shadow) and projected onto them instead.\
    \ If this were not so, you would not be upset.\n\n#### **If You Spot It, You Got\
    \ It!**\n\nIt feels like the other person is doing something to you to make you\
    \ angry. However, when you own that your feelings begin with you, not with them,\
    \ you will drop the need to feel victimized and realize that the person is doing\
    \ these things not *to* you but *for* you—enabling you to take back the projection\
    \ and love it in yourself.\n\nThough repression and projection are meant as temporary\
    \ relief valves for the psyche, the ego coopts them as the means to increase and\
    \ prolong the feeling of separation. Hence, denial, repression, and projection\
    \ become permanent ways of being for us, at least until we begin to awaken. At\
    \ that point we slowly become aware of these mechanisms and how we use them to\
    \ create and maintain separation. The task then is to wean ourselves off these\
    \ mechanisms and begin to take responsibility for creating the circumstances of\
    \ our lives rather than blaming everything on others.\n\n#### **Fear of Intimacy\
    \ (“Into-Me-See”)**\n\nEvery person we meet offers us the opportunity to choose\
    \ between projection or forgiveness, union or separation. However, when it comes\
    \ to close personal relationships, the more intimate we become with someone the\
    \ closer they get to our true self. Thus it becomes all the more likely they will\
    \ discover all that unpleasant stuff (our shadow material) that we have denied\
    \ and repressed, the prospect of which creates enormous fear inside us. The temptation\
    \ to project it all onto them becomes almost irresistible. At this point, the\
    \ honeymoon is over. The fear of intimacy becomes so strong that the relationship\
    \ is likely to fall apart. Most do so within six months to a year, often with\
    \ a lot of acrimony and painful emotion.\n\n### ALL RELATIONSHIPS ARE FOR HEALING\n\
    \nTo be awake means to fully understand how this all works and how the ego has\
    \ skillfully used our spiritual intelligence—which is always moving us in the\
    \ direction of healing and growing—to provide us with people whose role it is\
    \ to mirror our own projections and repressed self-hatred. Only then can we heal\
    \ the separation within ourselves and become whole. This is the purpose of all\
    \ relationships.\n\nAs we saw in Jill’s story, Radical Forgiveness can save a\
    \ relationship (Jill and Jeff are still happily married). However, this is not\
    \ necessarily the goal. If the true purpose of the relationship has been fulfilled,\
    \ which is to say the healing has occurred, the relationship may simply dissolve\
    \ naturally and peacefully. When both parties understand Radical Forgiveness and\
    \ use the technology, the parting can be loving, respectful, and relatively pain\
    \ free.\n\nIf, on the other hand, the relationship breaks off before the healing\
    \ has taken place, the parties will likely go off and find another partner with\
    \ very similar characteristics who will resonate the same issues for them all\
    \ over again. Many of us do this over and over again, and we can often see the\
    \ pattern quite clearly when it is pointed out.\n\n## \n\n# \n\n#### 8\n\n###\
    \ Attraction and Resonance\n\nAs we saw in the previous chapter, we project our\
    \ guilt and anger onto people who have the capacity to resonate with our feelings,\
    \ and such people become convenient scapegoats.\n\nJust as a radio station uses\
    \ a certain frequency to broadcast its programs, so our emotions (energy in motion)\
    \ vibrate at certain frequencies. People who resonate with our feelings vibrate\
    \ at that same rate and are likely to have a similar emotion pattern to our own—either\
    \ the same or the opposite—which they then mirror back to us.\n\nOur core beliefs\
    \ also have a certain frequency. By speaking them aloud, we give our beliefs even\
    \ more energy, and they take on a causal quality in the Universe, causing effects\
    \ in our world. In addition, other people resonate with the energetic frequency\
    \ of that belief. In other words, they vibrate sympathetically at the same rate\
    \ with it. When they do so, they are attracted into our lives to mirror our beliefs\
    \ back to us. This gives us a chance to look at and, if necessary, change our\
    \ minds about that belief. It is not only negative beliefs that get mirrored back\
    \ to us. For example, if we are loving and trusting, we will tend to attract people\
    \ into our lives who are likewise trustworthy and nurturing."
