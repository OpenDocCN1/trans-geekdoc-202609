    简是一个四十出头、极具魅力的女性，她已经大约七年没有谈过恋爱了。她有一个某种意义上的男朋友，但她描述那种关系不只是一段亲密的朋友关系。事实上，她说，尽管偶尔会和他发生性关系，但她只是把他看作自己的哥们。当我进一步探究她的感情状况时，她对多年前结束的一段感情表现出了难以置信的悲伤。那段持续八年的感情极其激情且剧烈，简显然崇拜那个男人。在感情关系的第四年，正当她认为很快就会结婚时，她发现他已经结婚并有了孩子。他没有离开妻子的打算。简心碎了，但她无法停止与他见面。她又花了四年的极度痛苦的时光才从那段关系中挣脱出来。


    对我来说很清楚，由于这段失败的关系，简完全封闭了自己的情感，不再允许自己与一个男人产生如此深层的感情。她遭受过心碎并不让我意外；大多数患有乳腺癌的女性在人生某个阶段都经历过心碎。（乳房是滋养的器官，与心脏相邻且与之密切相关。）


    在我们课程结束她正准备出门时，简低声说道：“我把他放在阁楼上了。”


    我停下了脚步。“你什么意思？”我问。


    “嗯，我多年来积累的所有与这个男人有任何关系、或能想起他的东西，我都塞进了一个箱子里。然后我把盒子放到了阁楼。它还在那里。从以后我再没碰过它。”


    我让她坐下重新告诉我一遍。我让她重复了三遍同样的话。突然，她看到了阁楼里那个代表她失败恋恋的箱子与她脑癌之间的联系。“噢，我的天呐，”她说，“他就在我的脑子里，不是吗？他在我的阁楼里。”


    我告诉她回家，上阁楼，把盒子取下来，下次咨询时带过来。我们将一起一件件检查。我们计划让她告诉我每件物品背后的故事，直到我们驱逐了他的能量，并释放了她压抑的痛苦。简明白这可能是她痊愈的关键，并感到非常兴奋。悲剧的是，她第二天发生了发作并被送回医院。一个月后她去世了，从未触碰过阁楼上的那个盒子。看着箱里的东西并感受失去之爱的痛苦，对她来说可能太难以承受了，我觉得，在某种程度上，她可能选择了放弃生命，而不是面对那种痛苦。


    ## 疾病的起源


    能量堵塞总是始于细微体。然后，如果它们在那个层面没有被释放，就会进入物理身体，并最终表现为癌症、多发性硬化、糖尿病等疾病。因此，我们可以说，疾病总是始于细微体，并向内发展。


    我们曾经认为，预防疾病最好的方法是定期去看医生体检。我们现在知道，咨询那些能够读取我们光场的人要好得多——这意味着他们感应能量。

