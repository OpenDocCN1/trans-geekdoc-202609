- fmt: '

    I recently heard bestselling author Alan Cohen tell a story that illustrates this
    point well. A friend of his once got involved in circumstances that resulted in
    a girl’s death. For her wrongful death, he was imprisoned for many years. He accepted
    the responsibility for what had happened and behaved in every way as a model prisoner.
    Still, the girl’s father, a rich and influential man with friends in high places,
    made a vow to keep this man locked up for as many years as possible. Every time
    he became eligible for parole, the girl’s father spent a great deal of time and
    money pulling every political string possible to make sure parole was denied.
    After numerous such occurrences, Cohen asked his friend how he felt about being
    denied parole because of this man’s efforts to keep him in prison. The man said
    he forgave the girl’s father every day of his life and prayed for him, because
    he realized that it was the father who was in prison, not himself.


    In truth, the father, who was unable to get beyond his rage, sadness, and grief,
    was controlled by his need for revenge. He could not escape the prison of his
    own victimhood. Even traditional forgiveness was beyond him. Cohen’s friend, on
    the other hand, refused to be a victim and saw love as the only possibility. His
    vibration was higher, and he was able to practice Radical Forgiveness.


    ### Seeking Redress and Accountability


    Getting back to the issue of whether or not to seek redress through the courts,
    yes, we should seek to make others accountable for their actions. Remember, though,
    that once we decide to sue, we must, as they say in Alcoholics Anonymous, “pray
    for the S.O.B.”—and for ourselves. (By the way, we do not have to like someone
    in order to forgive him!) In other words, we turn the matter over to our Higher
    Power. We recognize that divine love operates in every situation and that each
    person receives exactly what he or she wants. We recognize that perfection always
    resides somewhere in the situation, even if it is not apparent at the time.


    ### A Personal Experience with Victimhood


    I had occasion to experience this myself when I had just completed this book and
    was looking around for someone to help me market it. A friend recommended someone,
    so my wife, JoAnn, and I went to see her. She seemed okay, and I had no reason
    to doubt her skill or integrity. However—it’s funny how the Universe works—the
    deadline for getting the title into `Books in Print` was the following day. This
    is the reference book that bookstores use for ordering, “so it was important to
    get in then to avoid missing a whole year.” That also meant I was rushed into
    signing a contract with this woman and coming up with $4,000, which is what she
    wanted up front, as well as 15 percent of the book sales. We didn’t have $4,000,
    but JoAnn somehow came up with $2,900; we would pay the rest in monthly installments.
    So we signed. Though rushed into it, I was pleased that I had delegated that part
    of the project.


    As the months went by, and well after my book was published, I noticed that I
    was still having to do a lot of what I thought I had contracted with her to do.
    I was booking all my own signings, sending books to reviewers, and so on. I wasn’t
    seeing any results from her efforts at all. I kept my eye on it, and after a while
    I confronted her. It turned out that she had hardly done a thing. Of course she
    denied it and defended herself, but when I demanded to see letters and evidence
    of activity, there was nothing. I fired her, voided the contract for nonperformance,
    and demanded my money back. Of course she refused, so I started court proceedings
    to recoup the money.


    As you can imagine, I was pretty upset. I was stuck where all people who imagine
    themselves victimized go—in “Victimland!” And I was completely unconscious. I
    had my victim story all made up and took every opportunity to share it with anyone
    who would listen. As far as I was concerned, she had stolen that money from me,
    and I needed to get even. I was well and truly stuck, and I stayed that way for
    several weeks. And I was supposed to be Mr. Forgiveness!


    ### The Path to Awakening


    Fortunately, a friend who had attended my first workshop many years before came
    to dinner. When I told her my story, her response was, “Well, have you done a
    worksheet around this?”


    Of course I hadn’t. It was the thing furthest from my mind. “No, I haven’t done
    a worksheet,” I replied, feeling very angry.


    “Don’t you think you should?” Lucie asked.


    “No, I don’t want to do a darn worksheet!” I shouted.


    Then JoAnn chimed in. “Well, it’s your worksheet. You ought to practice what you
    preach!” That did it. Feeling cornered, I stomped upstairs to get one, but I was
    angry. I knew, and so did they, that I was doing it under protest. It was the
    last thing in the world I wanted to do, but they wouldn’t let me off the hook.
    I did each step in a huff and with little or no commitment to the process. Then
    all of a sudden, as I got about halfway through, I had to read this statement:
    “I release the need to blame and the need to be right.” That was when it hit me.
    *The need to be right!* All of a sudden it flashed before me what I was trying
    to be right about. I had a core belief that I always had to do everything myself!
    I saw that this incident was just another playing out of that belief. All the
    other times I had unconsciously created being let down that way flashed before
    my eyes. I then saw and fully understood that this woman was supporting me in
    becoming acquainted with this toxic belief so that I could release it and open
    myself to greater abundance.


    Suddenly, all my anger evaporated, and I saw how I had shut myself off the very
    things I believed in and was teaching. I felt very ashamed—but at least I was
    conscious again. I could now see that this woman was an angel for me, and I switched
    from feeling anger and resentment to feeling gratitude and love for her.


    Besides being a wonderful awakening, this was a very powerful and humbling lesson
    in how easy it is to become unconscious and how quickly you can be sucked into
    a drama. It was also a great demonstration of how quickly I could separate from
    my true nature and of why we need spiritual friends who will support us by not
    buying in to our victim story and being prepared to challenge us.


    Now, the question you are probably asking is, having realized that she was a healing
    angel for me, did I cancel the court case against her? Well, I can tell you, I
    agonized over this


    I recognized that, though I now saw the truth from the perspective of the World
    of Divine Truth, the situation itself was deeply grounded in the World of Humanity.
    I offered to go to mediation twice, and she refused on both occasions. So I went
    ahead with the court case, reasoning that her soul needed to have that experience;
    otherwise it would have taken her out of it when I suggested mediation. But I
    went into it with my heart open and with the intention that the right and perfect
    outcome would ensue. The court found in my favor, and I got a judgment against
    her for most of the $4,000. I never got the money, but that didn’t matter. The
    point was that we had trusted the process and had done what seemed to be necessary
    at the time.


    The truth is, it wouldn’t have mattered which way I decided. Spirit could have
    sorted it out some other way, and it all would have worked out okay in the end—as
    it always does. The idea that our decisions matter in the overall scheme of things
    is just our ego trying to make us feel separate and special. The Universe has
    everything handled no matter what we decide. But how we make those decisions—whether
    from love or fear, greed or generosity, false pride or humility, dishonesty or
    integrity—matters to us personally, because each decision we make affects our
    vibration.

