    回想第一部分，我的姐姐吉尔（Jill）曾深信自己永远无法让任何男人感到满意。这种信念与一个性成瘾者产生了共鸣。他为她提供了理想的伴侣，因为他通过不断与其他女性性交来支持她的信念，从而向她证明她对他来说是不够的。在那段关系中，她没有发现这其中的联系，因此没有治愈最初产生这种信念的痛苦。于是，她找到了另一个与她的信念产生共鸣的男人（杰夫）。他以不同的方式支持了她的信念，利用他自己与女儿洛恩（Lorraine）之间的情感依赖问题作为催化剂。在这种情况下，她看到了这种联系，并意识到他正在镜像她那种“自己不够好”的信念，两人都得到了治愈。


    如果你想知道自己讨厌自己并可能已经否认了哪些部分，只需看看进入你生活的那些身上令你感到恼的特质。观察他们为你提供的镜子。如果你似乎吸引了许多愤怒的人进入你的生活，你可能还没有处理好你自己的某些愤怒。如果人们似乎在对你吝啬爱，你内心的某个部分是不愿意给予爱的。如果人们似乎在从你这里偷取东西，你的一部分表现得不诚实，或者感到自己不诚实。如果人们背叛了你，也许你过去也背叛过某人。


    看看那些让你感到困扰的问题。如果堕胎真的让你愤怒，也许你内心的某个部分在其他方式上对生命缺乏敬畏，或者你内心的某个部分知道自己可能虐待孩子。如果你强烈反对同性恋，也许你无法接受自己内心那个有时会产生同性恋倾向的部分。


    ### 镜宫（Hall of Mirrors）

    这种反映并不总是那样直接或简单。例如，有时我们对特定行为的认同并不如我们对该行为对我们所蕴含的底层意义。一个对妻子暴食和肥胖感到愤怒的男人，可能并不是与任何个人暴食倾向产生了共鸣；相反，他可能是与她利用食物来逃避情感问题的行为产生了共鸣，因为这镜像了他逃避自身情感混乱的倾向。显然，看到他人为我们映射出的东西，就像在镜宫中观察无数个扭曲的图像一样。


    ### 投射的自动反转

    激进宽恕（Radical Forgiveness）的美妙之处在于，它并不要求我们识别出自己投射了什么。我们只是为了当时发生的事情原谅那个人。通过这样做，我们自动抵消了投射，无论情况多么复杂。其原因很简单，因为那个人代表了最初导致我们产生投射的原始痛苦。当我们原谅他或她时，我们就清除了了那份原始的痛苦。


    讽刺的是，那些最让我们感到困扰的人，反而是灵魂层面最爱我们、最支持我们的人。他们通常是我们在投生之前就约定的、在世中与我们一起完成某些事的灵魂。几乎总是，而且往往以他们自身不适为付出的巨大代价，这些个体试图教导我们关于我们自己的事情，并鼓励我们走向觉醒。记住，这不是性格与性格之间的交换。事实上，极可能，我们的性格之间发生了剧烈的冲突。相反，每位玩家的灵魂设定了剧本，希望我们最终能看到真相。


    ### 不要把生活看得太个人化

    谁进入我们的生活帮助我们完成这项任务其实并不重要。如果某个特定的人不承担这份工作，另一个人会做的。悲剧在于，作为受害者，我们很少理解这一点。我们想象自己只是恰好是某个人有害行为的倒霉受害者。我们没有想过，我们可能（在灵魂层面）由于某种原因吸引了那个人和那个情境，如果不是这个人，也会是另一个人。我们错误地觉得，如果不是这个人，我们就不会有这个问题了。换句话说，我们认为问题完全在另一个人身上，而我们现在觉得有理由去恨和怨恨他们，因为是他们“导致”了我们的痛苦和不快乐。


    ### 责备我们的父母

    当人们谈论他们的父母时，我们经常听到这种指责。“如果我有不同的父母，我今天就是完整且完满的，”人们这样说。错了。他们本可以选择一组不同的父母，这没错；但新的组父母会给他们完全相同的经历，因为那是他们灵魂所渴望的。


    ### 重复关系模式

    当我们自己看作受害者时，我们只想着杀死传信者。我们错过了信息。这解释了为什么人们从一段婚姻走向另一段婚姻，每次都复制出相同的关系动态。他们从第一任配偶那里没有得到信息，所以又走向了另一个，而后者继续试图传达上任配偶试图传达的信息。


    ### 情感依赖与相互投射

    我们还发现自己向他人投射了我们自己的自恨，他们不仅接受它，还通过将他们的自恨投射回我们来予以回报。我们将这种契约称为情感依赖或成瘾性关系。这个特别的人通过不断告诉我们“我们很好”来补偿我们认为自己身上缺失的东西，这样我们就能避免对自己的真实身份感到羞耻。作为回报，我们也对他们做同样的事；因此两人都学会了利用基于底层罪恶感的、高度条件的爱来操纵对方。（典型的犹太裔母亲是这种原型的极佳范例。）当对方撤回认可的一刻，我们被迫再次面对自己的罪恶感和自恨，一切都崩塌了。爱立即变成了恨，每个伴侣都攻击对方。这解释了为什么许多曾经看起来支持和爱爱的摇摆关系会几乎瞬间变成仇恨的熔炉。


    # 9

    ### 因果律

    “我们创造自己的现实”这一思想的核心是因果律。它规定每一个行为都有等的回应。因此，每一个因都必须有果，每一个果都必须有因。由于思想本质上是因果性的，每一个念头对世界都有影响。换句话说，在大多数时候，我们无意识地通过思想创造了我们的世界，即人类世界。


    当我们在高频率振动时（例如祈祷、冥想或思考时），我们可以有意识、有目的地通过思想进行创造。然而，大多数时候我们是无意识的。单个随机念头没有携带大量的能量，所以产生的影响相对较小。但是，带有大量能量的念头（尤其是情感或创造能量）对世界的影响要大得多。因此它们在创造我们的现实中起着更大的作用。

