    ## 六、 整合转变


    17. 我完全原谅自己，_\_\_\_\_\_，接纳自己作为一个充满爱、慷慨且创造力的生命。我释放所有紧贴过去的、关于匮乏与局限的情绪和想法的需求。我从过去中撤回我的能量，释放所有阻碍我深知此刻所拥有的爱与丰盛的障碍。我创造我的生活，我被赋予了重新做自己的力量，无条件地爱护并支持自己，正如我原本的样子，带着我所有的力量和光辉。


    18. 我现在顺服于我所认为的 \_\_\_\_\_ 高力量，并相信这种情况将继续完美地展开，并符合神圣指引和灵性法则。我承认我的合一性，感到自己已与我的源头完全重新连接。我恢复了我的真实本性——即爱，我现在将爱归还给
    \_\_\_\_\_。我闭上眼睛，感受流进我生命的爱，感受感受到并表达爱时而来的喜悦。


    19. 对你 \_\_\_\_\_ 的由衷赞赏与感激。完成这份工作表后，我……我完全原谅你，_\_\_\_\_\_，因为我现在意识到你并没有做任何错，一切都在神圣的秩序之中。祝福你愿意参与我的觉醒——谢谢你——并赞赏自己愿意参与你的觉醒。我认可并接纳你原本的样子。


    20. 写给自己的话语：


    [原书中此处特意留白]


    我意识到，我是一个在人类躯体中经历灵性体验的灵性存在，我在人性的每一个方面都爱并支持自己。


    ## # 22


    ### 宽恕的四个步骤


    这一对阿诺德·帕森特（Arnold Patent[5]）所教的三步法的改编，提醒着我们：我们拥有吸引我们所需的事件和人物的力量，从而让我们感受到对某个特定问题所产生的情绪。这个过程只需要几分钟，但它字面上可以拯救你不再无尽地陷入正在发生的各种剧性冲突中，并避免在“受害者之地”（Victimland）长期逗留！


    当事情发生且我们心烦时，我们极易忘记曾经过的关于“激进宽恕”的一切知识。在这些原则牢固植根在我们脑海之前，每当我们的心烦产生巨大的情绪动荡时，我们的倾向总是默认回到受害者意识。问题是，一旦进入了那里，我们往往会在那里待很长一段时间。如果没有激进宽恕的观点，你可能会在那儿待上几年，这正是大多数人的所为，正如底图中的虚线所示。但如果你认识一个了解激进宽恕并能识别出你症状的人，他或她会让你做一份工作表或听《激进宽恕》光盘，以便你能回到平静。正如你将在接下来的图中看到的，每当有事情发生时，我们都会默认变成受害者，并在“受害者之地”长期逗留。然后我们会被提醒万物本可以是完美的，于是我们使用这种技术来表达我们看到完美的意愿，并最终回到平静的状态。


    不过，这可能是一段艰难的旅程，取决于你是否有一个会救你的人。停止这种过山车的方法，是在你必须为“受害者之地”订房**之前*使用这四步法！在图中，四步法的使用由那些曲线表示，这些曲线在我们通常进入意识状态的线之前稍稍停止。当我们发现自己自然而然、理所当然地使用这个过程时，激进宽恕已成为我们默认的生活方式——这无疑要容易得多！


    所以，一旦你发现自己正为某事感到心烦，或者即使你发现自己在做评判、感到自以为是、或想要改变现状的某些方面时，请使用这个过程，让你的意识与激进宽恕的原则保持一致。（图
    18）


    ![](img/part4_chapter22_image001.jpg)


    图 18：受害者之地过山车


    ### 第一步：“看我创造了什么！”


    第一步提醒我们，我们是自己现实的创造者。然而，我们是为了自己的治愈而创造环境，因此不要为发生的事情承担`guilt`（内疚）。由于急于评判，我们经常将这一步作为一种自我责备的方式。我们会说：“看我创造了什么。噢，太糟糕了——我一定是个糟糕的人，一个在灵性上的失败者。”请不要掉进这个陷阱，因为如果你这样做了，你就陷入了幻象。


    ### 第二步：“我注意到我的评判，并为产生这些评判而爱自己。”


    这一步承认了作为人类，我们会自动对情况附加一连串评判、解释、疑问和信念。我们的任务包括接纳自己人性的不完美，并为拥有这些评判而爱自己，包括那个认为我们因为创造了这种现实而必须是一个灵性枯死的人的评判。我们的评判是我们自己的一部分，所以我们必须像爱自己一样爱它们。这样做将我们与身体和思维中真实发生的事情联系起来，并通过我们的感受将我们带当下。我们的能量随后迅速转变，允许我们进入该过程的第三和第四步。


    ### 第三步：“我愿意看到情境中的完美。”


    “意愿”步骤是激进宽恕过程中的核心步骤。它等同于在当下对神圣计划进行祈祷式的顺服，并为自己无法直接看到这一计划而爱自己。


    ### 第四步：“我选择平静的力量。”


    第四步代表了之前所有步骤的结果。通过接受神圣的目标在这种情况中得到了实现，并接受所见之可能是虚幻的，我们选择感受平静，并在任何行动中使用平静的力量。当我们完全处于当下、行动清晰专注、并对自己的感受完全感知时，就能找到平静的力量。


    尽可能多地练习这个四步法。让它成为你意识的一部分。它让你全天都能处在当下。


    为了帮助你将这个过程变为习惯，最好将这些步骤写在卡片上。这本书之前的版本曾有一个关于 9/11 事件的后记，展示了在这种情况下如何使用四步法（参见更多资源）。


    ## 23


    ### 在他人身上看到基督


    如果你意识到你与他人之间正在发生的情况代表了治愈自己某些机会，你就可以通过处于当下来创造治愈体验。将你的能量带回当下的方法（而不是让大脑停留在过去或未来），只需要看向与你产生问题的人，看到他们身上的基督。


    从这个意义上说，“基督”这个指的是他们身上神性的、与你以及上帝合一的部分。当你这样做时，你就与他们合一，在那一刻你也承认了自己内在的基督。


