    \ Has Shown Us How**\n\nThe way Nelson Mandela handled the South African situation\
    \ when apartheid finally ended in the early 1990s is an object lesson in how to\
    \ transform energy through Radical Forgiveness. Apartheid, the white-dominated\
    \ political system that had been in place for three-quarters of a century, kept\
    \ blacks and whites separated—the whites in luxury and the blacks in terrible\
    \ poverty. Mandela himself was imprisoned for twenty-six years. Upon his release,\
    \ he became president of the country. South Africa was ripe for a bloodbath of\
    \ revenge, yet Mandela brought about an amazingly peaceful transition—the hallmark\
    \ of which was not revenge but forgiveness.\n\nIt was not so much what he did\
    \ that prevented the predicted bloodbath from occurring, but how he handled the\
    \ energy. He refused to take revenge, and on behalf of all the people he transcended\
    \ the victim archetype. This, in turn, collapsed the energy pattern of potential\
    \ violence already in place and waiting to be triggered. South Africa remains\
    \ in transition today and not without problems, but it has progressed much farther\
    \ than we could have dreamed possible a few decades ago."
