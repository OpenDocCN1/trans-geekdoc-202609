  trans: "\n\n回答这个问题的另一种方式是指出，“激进宽恕”（Radical Forgiveness）是一种口口传播的现象。1997 年当我第一次出版这本书时，我收到一封来自亚特兰大最大的独立书店之一的店主的信。她说，她注意到人们会进店买一本书，然后在大周左右又回来买六本送给朋友。她写道：“我看到这种现象只在另外两本书上发生过——《神圣奇言》（Celestine\
    \ Prophecy）和《与上帝对话》（Conversations with God），这两本书都已成为畅畅销书。”我并不是建议你一定要出去买六本送给别人，但如果你只是简单地告诉朋友“激进宽恕”，你也将做出巨大的贡献。如今，可能没有比这更好的方法，就是给你通讯录中你认为可能感兴趣的每个人发送一封电子邮件了。\n\
    \n所以，事实就是这样——“激进宽恕”终于浮出水面了。它一直伪装成一种治愈你生活的方法（当然，它确实如此），但现在它被“揭露”是一项强大的技术。它不仅能帮助你治愈并消除生活中的障碍，还能显著提高你的频率，让你完全觉醒，并帮助你成为一个被赋能的灵性存在，能够完全在现实的第三、第四——乃至第五维度之间轻松切换。\n\
    \n这也是我们每个人（无论是个人还是集体）为世界产生重大影响的方式。随着我们振动频率的提高，我们会发现自己被召唤去更多地帮助他人，并为大觉醒做好准备。\n\n\
    感谢你与我共同开启这段旅程。有很多值得期待和兴奋的事情，我很感激你出现在我的生命中。\n\n*Namaste* 柯林·蒂平（Colin Tipping）\n\
    \n# 注释\n\n[1] Joan Borysenko, *Guilt Is the Teacher; Love Is the Lesson* (纽约:\
    \ Warner Books, 1990).\n\n[2] Ernst Becker, *The Denial of Death* (纽约: Macmillan,\
    \ 1973).\n\n[3] Ken Carey, *The Starseed Transmission* (纽约: HarperOne, 1991).\n\
    \n[4] 有关如何通过参考脉脉轮来解释我们的进化的详尽说明，请参阅 Caroline Myss 的 *Anatomy of the Spirit* (纽约:\
    \ Three Rivers Press, 1996).\n\n[5] A.M. Patent, *You Can Have It All* (纽约: Simon\
    \ & Schuster, 1995).\n\n____, *Death, Taxes, and Other Illusions* (图森逊: Celebration\
    \ Publishing, 1989).\n\n[6] Richard Bach, *Running from Safety: An Adventure of\
    \ the Spirit* (加州康科德: Delta, 1995).\n\n# 更多资源\n\n我们有许多书籍、音频节目、视频和在线课程，用以帮助你扩展关于“激进宽恕”技术的知识及其实际应用。我们还提供专业培训课程，让你能够与他人分享“激进宽恕”。要了解更多关于我们的产品或寻找“激进宽恕”教练，以及研讨会和“激进宽恕圈仪式”的机会，请访问我们的网站\
    \ radicalforgiveness.com。\n\n# 关于作者\n\n柯林（Colin）于 1941 年出生于英国，在战争期间和战后初英国由工人阶级父母抚养长大。他有一个哥哥和一个妹妹，他们都出现在第一章“吉尔的故事”中。根据他自己的描述，他的父母是好人，充满爱且勤劳，尽管那个时代充满了社会困难，但他认为自己拥有稳定且快乐的童年是非常倍幸运的。\n\
    \n即使作为一个男孩，他似乎就能赢得那些想要谈论自己感受的人的信任，因为在他身上发现了一个会倾听且不评判的人。在皇家空军服役四年后，他成为了一名高中教师和大学教授，但即使那时，他经常发现自己被人寻求提供咨询。他的第一段婚姻有三个孩子，这段婚姻在七年后离婚结束。第二段婚姻只持续了四年，但他仍然与两位前妻保持着朋友关系。\n\
    \n他于 1984 年移民美国，不久后成为临床催眠治疗师。他喜欢催眠治疗是因为在积累了多年经验后，他得出这种方法让治疗速度至少提高了三倍。\n\n当时他并不宗教，现在仍然感到不受任何组织宗教教条的“束缚”。他的灵性在本质上是务实且接地气的，简单、自由且开放的。\n\
    \n1992 年，他和妻子乔安（JoAnn，他们在亚特兰大相遇并于 1990 年结婚）在佐治亚州北部的山区为深受癌症困扰的人创建了一系列疗愈营地。在意识到缺乏宽恕是成因很大一部分后，他们开始完善一种新的宽恕形式，这后来变成了现在广为人知的“激进宽恕”。与传统的宽恕需要多年且被普遍认为非常难以实现不同，这种宽恕必须是快速、容易、简单且无需治疗的。\n\
    \n1997 年，柯林写了这本书的第一版，并从 1998 年 1 月开始举办研讨会。他现在在美国、澳大利亚、波兰和德国都有一家“激进宽恕学院”。他没有退休计划。\n\
    \n# 关于 Sounds True\n\nSounds True 成立于 1985 年，拥有一个明确的愿景：传播灵性智慧。Sounds True 位于科罗拉多州的博尔德，，出版旨在教育、提升和启发人们的教学计划。我们与当时代许多领先的灵性导师、思想家、疗愈者和远见艺术家合作。\n\
    \n欲获取用于个人和灵性转型的工具和教学的免费目录，请访问 soundue.com，或拨打免费电话 800-333-9185，或写信至下方地址。\n\n```\n\
    ![](img/postsection_image01.jpg)\n``` \n\n# radicalforgiveness.com 提供的其他产品和资源\n\
    \n激进宽恕是一项技术，提供了多种工具、流程和体验性课程，帮助你让宽恕成为日常生活的一部分。\n\n我们网站上的许多工具是免费的，我们鼓励你随时使用。\n\n\
    我们还有付费*在线课程*，专门设计用于帮助你宽恕父母、伴侣或你自己。\n\n"
