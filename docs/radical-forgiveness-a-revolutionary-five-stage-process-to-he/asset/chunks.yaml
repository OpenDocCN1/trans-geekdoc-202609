- fmt: "\nWe also experience intense shame over aspects of ourselves we dislike and,\
    \ therefore, disown. Carl Jung, the famous Swiss psychoanalyst, referred to this\
    \ as our shadow because it represents the dark side of ourselves, the part we\
    \ do not want to see or have seen by others. This part of ourselves knows we are\
    \ capable of killing another human being—knows we could have taken part in the\
    \ concentration camps had we been German during that time, knows we might have\
    \ owned and brutalized slaves had we been born white in the South before the Civil\
    \ War, could hurt or rape someone, is greedy or avaricious, is rageful and vengeful,\
    \ or is in some other way deviant or unacceptable. Any such characteristics we\
    \ possess or areas of our lives that bring us feelings of shame we classify as\
    \ our shadow and repress.\n\n### Sitting on a Volcano\n\nRepressing this kind\
    \ of energy is like sitting on a volcano! We never know when our strength will\
    \ give out, thus allowing the lava (`shadow`) to spurt forth and wreak havoc on\
    \ our world. This explains why we need to bring in a scapegoat on whom we can\
    \ project all that shame. That way, we can be free of it, at least temporarily.\n\
    \n### PROJECTION\n\nEven when we have repressed the feelings and/or memories associated\
    \ with a life event, we know on an unconscious level that the shame, guilt, or\
    \ self-criticism associated with it remains with us. So we attempt to rid ourselves\
    \ of that pain by “taking it out of ourselves” and transferring it onto someone\
    \ or something else outside of ourselves. This projection process allows us to\
    \ forget we ever possessed such feelings.\n\nOnce we project what we do not want\
    \ to own onto someone else, we see them, rather than ourselves, as possessing\
    \ those qualities. So if we repress our guilt and then project it, we make the\
    \ other person the wrong one. If we repress our anger and then project it, we\
    \ see them as the one who’s angry. We can accuse them of all the things we feared\
    \ we would be accused of ourselves. No wonder we feel so relieved when we project!\
    \ In so doing, we make someone else responsible for everything terrible that happens\
    \ to us and for what we see as negative about ourselves. Then we can demand that\
    \ they be punished, so we can feel even more righteous and safe from attack.\n\
    \nThis explains why we love to watch the news on television. The news provides\
    \ us with an opportunity to project all our guilt and shame onto the murderers,\
    \ rapists, corrupt politicians, and other “bad” people we see on the screen. After\
    \ doing so, we can go to bed feeling okay about ourselves. The news, and all the\
    \ other television programs that feature “bad” people and situations, endlessly\
    \ provides us with convenient scapegoats upon whom to project. (FIGURE 7)\n\n\
    ![](Images/part2_chapter7_image001.jpg)\n\nFIGURE 7: Projecting Our Repressed\
    \ Shame\n\n### Recognize When You’re Projecting\n\nAs soon as you find yourself\
    \ judging someone and getting angry, you know you are projecting. Anger serves\
    \ as the constant companion of projection, for you always use this emotion to\
    \ justify the projection of your self-hatred.\n\nWhat you find so objectionable\
    \ about this person simply serves as a reflection of that part of you that you\
    \ have rejected and denied in yourself (your `shadow`) and projected onto them\
    \ instead. If this were not so, you would not be upset.\n\n### If You Spot It,\
    \ You Got It!\n\nIt feels like the other person is doing something to you to make\
    \ you. If we repress our guilt and then project it, we make the other person the\
    \ wrong one. If we repress our anger and then project it, we see them as the one\
    \ who’s angry. We can accuse them of all the things we feared we would be accused\
    \ of ourselves. No wonder we feel so relieved when we project! In so doing, we\
    \ make someone else responsible for everything terrible that happens to us and\
    \ for what we see as negative about ourselves. Then we can demand that they be\
    \ punished, so we can feel even more righteous and safe from attack.\n\n### Fear\
    \ of Intimacy\n\nWhen we meet someone we like, we often become afraid of intimacy.\
    \ This is because we are afraid they will see our `shadow` and reject us as we\
    \ have rejected ourselves. We project our own fears onto them, and then we become\
    \ afraid of them rather than of ourselves. For example, if we are afraid of being\
    \ boring, we project that onto our partner. If we are afraid we are ugly, we project\
    \ that they find us ugly. If we are afraid we are unworthy, we project that onto.\n\
    \n### ALL RELATIONSHIPS ARE FOR HEALING\n\nAs we saw in Jill’s story, Radical\
    \ Forgiveness can save a relationship (Jill and Jeff are still happily married).\
    \ However, this is not necessarily the goal. If the true purpose of the relationship\
    \ has been fulfilled, which is to say the healing has occurred, the relationship\
    \ may simply dissolve naturally and peacefully. When both parties understand Radical\
    \ Forgiveness and use the technology, the parting can be loving, respectful, and\
    \ relatively pain free.\n\nIf, on the other hand, the relationship breaks off\
    \ before the healing has taken place, the parties will likely go off and find\
    \ another partner with very similar characteristics who will resonate the same\
    \ issues for them. Many of us do this over and again, and we can often see the\
    \ pattern quite clearly when it is pointed out.\n\n## \n\n# #\n\n#### 8\n\n###\
    \ Attraction and Resonance\n\nAs we saw in the previous chapter, we project our\
    \ guilt and anger onto people who have the capacity to resonate with our feelings,\
    \ and such people become convenient scapegoats.\n\nJust as a radio station uses\
    \ a certain frequency to broadcast its programs, so our emotions (energy in motion)\
    \ vibrate at certain frequencies. People who resonate with our feelings vibrate\
    \ at that same rate and are likely to have a similar emotion pattern to our own—either\
    \ the same or the opposite—which they then mirror back to us. Our core beliefs\
    \ also have a certain frequency. By speaking them aloud, we give our beliefs even\
    \ more energy, and they take on a causal quality in the Universe, causing effects\
    \ in our world. In addition, other people resonate with the energetic frequency\
    \ of that belief. In other words, they vibrate sympathetically at the same rate\
    \ with it. When they do so, they are attracted into our lives to mirror our beliefs\
    \ back to us. This gives us a chance to look at and, if necessary, change our\
    \ minds about that belief.\n"
