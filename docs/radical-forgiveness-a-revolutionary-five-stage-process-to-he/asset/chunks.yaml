  trans: '


    乍看之下，这似乎是一个宿命论的观点，但这并不仅仅是命运。事实上，神圣的计划允许极大的创造力和灵活性，并继续遵循自由意志的原则。我们继续与灵性（Spirit）共同创造我们的生活环境，并无例外地完全得到我们想要的一切。我们对所所得物的抗拒（评判）程度，决定了我们体验到的生活是痛苦还是喜悦。


    因此，对生命经验的精通取决于我们是否全身投入生活，并相信无论发生什么，我们都会得到照顾和支持。激进的原谅使我们朝着那个方向迈进。


    **假设：** 物理现实是由我们的五感官创造的幻象。物质由以不同频率振动的、相互关联的能量场组成。


    大多数人很难接受“我们的物理现实是由感官创造的幻象”这一观点。肯·凯瑞（Ken Carey）证实了我们理解这一概念的困难性。在他本通过通灵传讯完成的著作《星种子讯息》（*The
    Starseed Transmissions*）中，那些“通过他说话”的灵魂产生了一个有趣的观察。[3] 它们说，当他们进入凯瑞的身体并体验他所有的感官时，他们简直惊呆了。只有在那里，他们才理解了为什么人类觉得物理世界是真实的。我们的感官让这种幻象如此令人信服，以至于这些脱离肉体的灵魂也理解为什么我们想要跨越它是如此困难。事实上，要记住物理世界仅仅是一个幻象是很困难的。


    然而，我们开始朝着培养这种记忆的方向移动。最近，科学家们开始从“心/身连续体”的角度来讨论人体。这种术语让我们感到，我们的身体确实不仅仅是细胞、分子和原子。能量科学告诉我们，实际上，我们的身体是相互关联的能量场的致密凝结，就像全息图一样，所有物质都是由以特定模式振动的能量组成的。全息图是那些激光束产生的看似真实的三维图像。量子物理学家曾理论化地认为整个宇宙是一个全息图，其中的一切，包括我们每一个人，也都都是全息图。


    某些能量场的振动频率允许它们被观察和测量。它们可以被赋予物理学属性，如重量、体积、硬度和流动性。我们给这些能量模式命名，如木头、钢铁、皮革或威士忌。物理上的一切仅仅代表了以我们五感可以检测到的频率振动的能量。


    然而，这个概念对我们来说似乎很奇异。我们如此信任我们的五感来探测周围的物理世界，以至于很难想象我们的身体所包含的不仅仅是我们能看到和感受到的东西。但在一个非常真实的意义上，物理现实确实是由我们的感官*创造*的幻象。


    考虑一下支撑建筑的一根金属梁。它看起来足够坚固，我们的触觉和视觉告诉我们它是结实的的，而且是强壮且沉重。但我们也知道，这根梁完全由原子组成，而且，每个原子由一个质子和中子组成的原子核组成，一个或多个电子以超高速度绕其核运行。


    为了感受原子核和电子之间的空间关系，请想象一个放在足球场正中央的篮球。现在，想象一个高尔夫球大小的物体，以每小时几千英里的速度绕着篮球运行，并画出一个直径等同于整个球场的圆。这为我们描述电子和原子核之间这种尺寸差异，以及它们之间巨大的空间提供了一个大致的形象。


    从这里，我们可以说原子大约由 99.99% 的空间组成。由于物质完全由原子组成，那么物质必须由 99.99% 的空间组成。因此，上述的金属梁 99.99%
    都是空间。你也是 99.99% 的空间。


    梁看起来致密的原因与电风扇在运行时看起来是实心的是一样的。当电风扇不旋转时，你可以看到叶片之间的空隙，你可以把手穿过那些空间。当叶片旋转得非常快时，你就再也看不到那些空间了。如果你试图把手伸进叶片之间，它们感觉就像一堵不可逾越的墙。就像风扇叶片一样，任何物理材料都是由大量快速旋转的电子组成的，以至于它们在我们的感官中看起来是实心的。


    如果支撑建筑的梁中的电子停止旋转，这根梁会瞬间消失。如果周围所有其他电子也停止旋转，我们可以想象整座建筑都会消失。不会留下碎片，没有灰尘，什么也没有。对于观察者来说，建筑看起来就像是蒸发了。


    物质仅仅是振动——仅此，不多也不少。我们的感官对这些振动进行了调谐，而我们的大脑将它们转化为物质。听起来很诡异，但这是事实。


    **假设：** 我们既有微妙体，也有肉体。肉体以物质的频率（人类世界）振动，而五个微妙体中频率最高的两个振动频率更接近灵魂的频率（神圣真理世界）。


    除了肉体的肌肉和骨骼，我们还由其他无法看到或测量的能量模式组成。这些被称为我们的微妙体或微妙场。它们的振动频率比凝结为物质的身体高出一个或两个八度，并且超出了我们感官和大多数检测设备的范围。这些是：


    ### 以太体（The Etheric Body）


    以太体携带着身体的能量模板。它确保了身体在不断更新时，内部的模式、和谐与不和谐能够得以持续。你的身体与一年前不同了，因为你身体中没有一个细胞年龄超过一年。


    以太体与你的基因代码相互作用，并保存关于你是谁的记忆、你的鼻子形状、你的身高、你持有哪些偏见、你喜欢吃什么、你的优点、弱点、疾病模式等等。


    ### 情感体（The Emotional Body）


    情感体的振动频率比以太场高一个八度。它也被称为星体（astral body），它渗透了以太场和物理体的生物能量场，并在身体中表现为各种感受。


    情绪构成了一个附着在感觉上的思想，通常会导致物理反应或行动。当能量从情感场自由地流经以太场并进入物理体时，一切都运作得非常完美。


    当我们通过抑制或压抑限制情感能量时，我们会在以太场、情感场以及物理体中产生能量块。


    当情感体中维持着愤怒和怨恨时，原谅所需的感知转变就无法发生。情感体中的任何能量必须先被清除。


    ### 意念体（The Mental Body）


    这一场主宰我们的智力功能，负责记忆、理性思维、具体思维等等。当然，仍然有一些科学家坚持认为，思维和其他心理处理可以通过大脑生物化学来解释。只需说，遵循量子物理学逻辑的科学家们认为，思维超越了大脑，甚至超越了身体。他们认为大脑和思维是以*全息方式*相互作用的，每个细胞都包含一个整体的蓝图。许多研究人员认为，记忆以全息形式存在于身体之外的能量场中。


    '
