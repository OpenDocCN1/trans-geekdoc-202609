    # Instructions: This statement is simply there to remind us of one of the assumptions
    of Radical Forgiveness: that we come into this life experience with a mission
    or an agreement with Spirit to do certain things, be a certain way, or transform
    certain energies. Whatever that mission was or is, we simply know that whatever
    experiences we are having are part and parcel of the role we came in to play.
    Princess Diana’s story is a great example of that. Please note that the last part
    of the statement absolves us from the need to know what the mission was.


    ## 15. I release from my consciousness all feelings of *(as in 2b):*


    **Instructions:** This enables you to affirm that you release the feelings that
    you had noted in Box 2b. As long as these emotions and thoughts remain in your
    consciousness, they block your awareness of the misperception that is causing
    the upset. If you still feel strongly about the situation, you still have an investment
    in whatever the misperception is—your belief, interpretation, judgment, etc. Do
    not judge this fact or try to change your investment. Just notice it.


    Your emotions about your situation may come back time and time again, and you
    can make that okay too. Just be willing to feel them and then release them, at
    least for the moment, so that the light of awareness can shine through you and
    allow you to see the misperception. Then, once again, you can choose to see the
    situation differently.


    Releasing emotions and their corresponding thoughts serves an important role in
    the forgiveness process. As long as those thoughts remain operative, they continue
    to lend energy to our old belief systems, which created the reality we are now
    trying to transform. Affirming that we release both the feeling and the thoughts
    attached to them begins the healing process.


    ## V. REFRAMING THE STORY


    ### The Reframe Statement


    16. The story in number 1 was your Victim Story, based in the old paradigm of
    reality (victim consciousness). Now attempt a different perception of the same
    event (a reframe) from your new, empowered position, based on the insights you
    have experienced as you have proceeded through this worksheet. *(It may simply
    be a general statement indicating that you just know everything is perfect, or
    a statement that includes things specific to your situation if, that is, you can
    actually see what the perfection is. Often you cannot. Be careful not to do a
    reframe that is based in “world of humanity” terms. Note any positive shift in
    feeling tone.)*


    I now realize ... *that Jeff was simply mirroring my false belief that I was unlovable,
    and he was giving me the gift of healing. Jeff loves me so much that he was willing
    to endure the discomfort of acting it out for me. I now see that I was getting
    everything I wanted for my own healing and that Jeff was getting what he wanted
    for his healing. The situation was perfect in that sense and is evidence of Spirit
    working in my life and that I am loved. Everything is truly in divine order unfolding
    according to my divine plan. Jeff is a blessing in my life, and I give thanks
    for him no matter what happens in the future.*


    **Instructions:** If you are not able to see a new interpretation that is specific
    to your situation, that’s not a problem. The Radical Forgiveness reframe might
    simply be expressed in a very general way, such as, “What happened was simply
    the unfolding of a divine plan. It was called forth by my own Higher Self for
    my spiritual growth, and the people involved were doing a healing dance with me,
    so, in truth, nothing wrong ever happened.” Writing something like that would
    be perfectly adequate. On the other hand, if you did have some insights into how
    it all worked out in a perfect sense, that would be fine too.


    What would not be helpful would be to write an interpretation based on assumptions
    rooted in the World of Humanity, like giving reasons why it happened or making
    excuses. You might be exchanging one B.S. story for another, or even shifting
    into pseudo-forgiveness. A new interpretation of your situation should allow you
    to feel its perfection from the spiritual standpoint and become open to the gift
    it offers you. Your reframe should offer a way of looking at your situation that
    reveals the hand of God or Divine Intelligence working for you and showing you
    how much It loves you.


    **Note:** You may have to complete many worksheets on the same issue before you
    feel the perfection. Be absolutely truthful with yourself, and always work from
    your feelings. There are no right answers, no goals, no grades, and no end products
    here. The value lies in the process, in doing the work. Let whatever comes be
    perfect, and resist the urge to edit and evaluate what you write. You cannot do
    it wrong.


    ## VI. INTEGRATING THE SHIFT


    17. I completely forgive myself, *Jill,* and accept myself as a loving, generous,
    and creative being. I release all need to hold on to emotions and ideas of lack
    and limitation connected to the past. I withdraw my energy from the past and release
    all barriers against the love and abundance I know I have in this moment. I create
    my life and I am empowered to be myself again, to unconditionally love and support
    myself, just the way I am, in all my power and magnificence.


    **Instructions:** The importance of this proclamation cannot be overemphasized.
    Say it out loud, and let yourself feel it. Let the words resonate within you.
    Self-judgment is at the root of all our problems, and even when we have removed
    judgment from others and forgiven them, we continue to judge ourselves. We even
    judge ourselves for judging ourselves!


    18. I now surrender to the Higher Power I think of as *the Universe* and trust
