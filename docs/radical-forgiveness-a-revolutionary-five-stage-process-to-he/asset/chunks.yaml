  raw: "Your Higher Self knows that those ideas are not only B.S. but are highly toxic\
    \ as well, so while it cannot intervene directly (since Spirit gave us free will),\
    \ it brings people into your life who will lovingly “act out” parts of your story\
    \ over and over until you realize that it is not true.\n\nAgain, this is what\
    \ happened with my sister, Jill. When our father demonstrated the kind of love\
    \ for my daughter Lorraine that Jill had always wanted to feel from him and had\
    \ not felt, Jill took that to mean that she was inherently unlovable. That became\
    \ the story she believed until she brought someone into her life (Jeff) who was\
    \ able to make her discover her story and to see that it was false.\n\n### Jesse’s\
    \ Story\n\nSometimes you are aware of the story, sometimes not. Jesse was at one\
    \ of my workshops and appeared fully aware of her story but nevertheless did not\
    \ see the error in it. This was in spite of the fact that she was spiritually\
    \ very aware. She told us that she had just been fired from her job. “That’s okay,”\
    \ she said. “It’s my abandonment issue playing itself out again. I get fired or\
    \ lose a relationship every couple of years. It’s because I was abandoned when\
    \ I was a baby.”\n\nI suspected a B.S. story, so I began to investigate the abandonment.\
    \ What we soon discovered was that her father had died just before she was born\
    \ and that her mother had become ill and unable to cope when Jesse was about two\
    \ years old. Consequently, Jesse was reared for a while by her grandparents.\n\
    \nThough she was no doubt traumatized by being separated from her mother, the\
    \ actual truth of the matter was that her parents never did abandon her—they were\
    \ simply absent through no fault of their own. To abandon someone is to make a\
    \ calculated and conscious choice to leave them. It is a deliberate act. Mere\
    \ absence does not constitute abandonment.\n\nTaking absence to mean abandonment\
    \ was an interpretation a small child might easily make, and the importance goes\
    \ way beyond semantics. Interpreting her parents’ absence as abandonment, she\
    \ went on to make a number of other interpretations such as: “If my parents abandon\
    \ me, I must be a very unlovable person. No one will ever stay with me for more\
    \ than two years because, if my mother abandons me after that time, everyone will\
    \ do exactly that. They won’t want me after that. They will realize I am a bad\
    \ person and will leave. That’s how life is.”\n\nJesse had been living out of\
    \ this particular story for all her fifty-two years. Yet it was founded on a complete\
    \ misinterpretation of the situation. Once she saw that, and from that point on,\
    \ she was able to let it go and become free from the need to create abandonment\
    \ every two years.\n\nEven though she had spiritual awareness, she had consistently\
    \ failed to realize that in providing instances of abandonment every two years,\
    \ Spirit was in fact giving her opportunities to wake up and heal a toxic story\
    \ that was a limitation on her life and a wound to her soul. Doing some Radical\
    \ Forgiveness worksheets on the person who had last fired her helped her clear\
    \ all the other times she had been “abandoned” over her fifty-two years and neutralized\
    \ her original abandonment story.\n\n#### **THE FORGIVENESS CENTRIFUGE**\n\nOne\
    \ tool might have saved Jill and Jesse many years of painful struggle. The forgiveness\
    \ centrifuge helps us separate *what actually happened* in any given situation\
    \ from our *interpretation* of what happened. If you own the type of juicer where\
    \ you put carrots and other things in the top and the juice is separated from\
    \ the fiber by the centrifugal force of the spinning grater, you know what is\
    \ meant by the term *centrifuge.* A centrifuge is also used to separate plasma\
    \ from blood, cream from milk, and so on. A washing machine spinning out the excess\
    \ water from clothes works in the same manner. (FIGURE 15)\n\n![](Images/part4_chapter20_image002.jpg)\
    \  \n\nFIGURE 15: Separating Fact from Fiction\n\nA forgiveness centrifuge simply\
    \ reverses the process by which we come up with stories about what happened to\
    \ us. To use it, take the story you are living now—the one that is causing you\
    \ discomfort. Remember, it is certain to be a hopeless mixture of fact (what happened)\
    \ and interpretation (all your thoughts, judgments, assessments, assumptions,\
    \ and beliefs about what happened). Feed the story into the top of the imaginary\
    \ centrifuge, just as you would with carrots in a juicer, and then, in your mind,\
    \ see the machine separating the facts from the interpretations.\n\nThen, like\
    \ any good researcher, first make a list of the facts as they emerge, being as\
    \ objective as possible. Then make a list of the interpretations you made about\
    \ the facts. (FIGURE 16)\n\n![](Images/part4_chapter20_image003.jpg)  \n\nFigure\
    \ 16: The Facts About What Happened\n\nAfter writing down your results, acknowledge\
    \ the facts and accept them. Recognize that they tell what happened and that no\
    \ one can do anything to change that. You have no choice but to allow what happened\
    \ to be exactly what happened, but watch for any tendency to make excuses for\
    \ what happened—this will impose interpretation on the facts once again. Just\
    \ stay with what actually took place.\n\nNext, examine every thought, belief,\
    \ rationalization, idea, or attitude you imposed on what happened, and declare\
    \ them all to be *untrue.* Affirm that none of them have validity. Tell yourself\
    \ they just represent mind-talk. Then, recognize how important your ideas, beliefs,\
    \ and attitudes are to you. On a scale of 1-100, indicate in the left-hand column\
    \ how much attachment you think you have to each of your interpretations, and\
    \ then decide which of them you may be ready to drop and which you are not.\n\n\
    #### Be Gentle with Yourself\n\nDo not criticize yourself for being attached to\
    \ any of these ideas, beliefs, or attitudes, or for being unwilling to let them\
    \ go. You may have had them for a long time. In fact, they may define who you\
    \ are. For example, if you are an incest survivor or an adult child of an alcoholic,\
    \ these labels, which represent ideas or beliefs about yourself, may provide a\
    \ reference for who you are. If you let go of the ideas associated with these\
    \ labels, you might lose your identity. So, while you want to be firm with yourself\
    \ in separating what is real from what you have made up, be gentle with yourself\
    \ and allow time to release these beliefs. (FIGURE 17)\n\n![](Images/part4_chapter20_image004.jpg)\
    \  \n\nFIGURE 17: My Interpretations About What Happened\n\nThe next step after\
    \ this is the Radical Forgiveness reframe—seeing that the story was perfect and\
    \ had to play out that way. Watch out for the guilt, anger, depression, and criticism\
    \ you might feel and direct at yourself when you find out you have created your\
    \ entire life around a set of untrue beliefs. Please, do not do this. Instead,\
    \ remember that everything has a purpose and God does not make mistakes. Use one\
    \ or more of the forgiveness tools to work on forgiving yourself and on seeing\
    \ the perfection in your situation.\n\nIf the facts still prove that something\
    \ “bad” took place—for example, a murder remains a murder no matter what interpretations\
    \ you may have made—the Radical Forgiveness worksheet provides the best tool to\
    \ help you shift the energy around that event.\n\n## \n\n# \n\n#### 21\n\n###\
    \ The Radical Forgiveness Worksheet\n\nThe Radical Forgiveness worksheet has its\
    \ origins in one created by Dr. Michael Ryce, a pioneer in the field of forgiveness.\
    \ He was one of those who, along with my mentor, Arnold Patent, encouraged me\
    \ to develop Radical Forgiveness.\n\nFrom the moment I created the Radical Forgiveness\
    \ worksheet in 1989, using Dr. Ryce’s worksheet as my initial inspiration, it\
    \ has literally changed thousands of people’s lives. It is not easy to explain\
    \ how or why it accomplishes such dramatic results except to say that it helps\
    \ people to shift their energy. In fact, you could say that doing the worksheet\
    \ is, in and of itself, an energy experience."
