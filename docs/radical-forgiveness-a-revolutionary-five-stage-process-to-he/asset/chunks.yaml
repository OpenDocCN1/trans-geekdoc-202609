    我经常被要求处理另一种情况是：当一个人意识到孩子正遭受虐待时该怎么办。提出的问题是：如果我们假设孩子的精神成长正受到这段经历的支持，那么我们是否应该采取行动？因为干预是否意味着否定了孩子灵魂的成长体验？我的答案总是是，作为人类，我们必须根据我们目前对对错的认知——即人类法律所定义的对错——来做正确的事。因此，我们会采取相应的行动，同时深知在灵性法则中，并没有发生错误的事情。自然，我们会进行干预。作为人类，我们别无选择。但我们的干预既不是错误的也不是正确的，因为无论何种方式，灵性都会处理好一切。


    我的推理是，如果不进行干预符合孩子灵魂的最佳利益，灵性就会安排事情来防止它的发生。换句话说，如果我不应该干预，灵性会让我对这种情况无所不知。相反，如果灵性让我意识到这种情况，我假设它对我的干预没有意见。到底，这甚至不是我的决定。


    然而，当我进行干预时，我是不带判断、也不需要指备任何人的。我只是那样做，知道宇宙安排这一切是有原因的，并且其中某处存在完美。


    # 5


    ## 激进宽恕疗法


    Jill 的故事没有什么寻常之处。现实是，这可能是任何人的故事。事实上，自从本书第一版于 1997 年出版以来，成千上万的人写信、打电话或给我发邮件，说他们对它产生了如此巨大的共鸣，以至于他们在阅读时觉得这就像他们自己的个人故事。对于许多读过它的人来说，这个引人入胜的故事就是他们治愈的开始，就像对
    Jill 一样。


    由于它是许多表面关系问题的典型代表，这个故事也提供了一个很好的例子，说明了`激进宽恕`如何应用于日常生活中极其平凡的问题，并证明了它作为传统咨询和心理治疗的激进替代方案的可行性。这种实践被称为`激进宽恕疗法`（`RFT`）。


    这其中带有讽刺意味，因为`激进宽恕`的一个基本原则是，尽管有所有相反的证据，没有任何错误发生，也没有什么需要改变的。那么它如何能成为疗法呢？毕竟，`激进宽恕`的核心原则是：“毫无例外，发生在我们身上的一切都是神圣引导的、有目的的，并且为了我们更大的利益。”


    “疗法”这个概念本身意味着某些不对劲需要改变。当我们去治疗师那里时，我们期望治疗师问他自己这三个基本问题：


    | 1. | 这个人或这种情况有什么问题？ |

    | --- | --- |

    | 2. | 是什么导致他/她变成这样的？ |

    | --- | --- |

    | 3. | 如何修复他的问题？ |

    | --- | --- |


    既然这些问题一个都不适用于`激进宽恕`，那么`激进宽恕`如何能成为一种治疗模式呢？答案在于它对 Jill 起作用的方式。


    你可能记得，在 Jill 故事的开始，我的行动是基于与她的一种隐含的共识，即她确实有问题，`Jeff` 是这个问题的根本原因，而应对它的唯一方法是尝试寻找解决方案。在很长一段时间里，我和她沿着这条传统的道路走。只有当我认为时机成熟，我才建议了一种不同的（`激进宽恕`）方法。


    在那个时刻，我必须非常明确地告诉她我正在将对话引向一个完全不同的方向，并使用另一套假设。更具体地说，我正转向转向一组新问题。这些问题是：


    | 1. | 对她来说，发生的事情有什么完美之处？ |

    | --- | --- |

    | 2. | 这种完美是如何揭示的？ |

    | --- | --- |

    | 3. | 她如何转变观点，以接受她的处境可能存在某种完美？ |

    | --- | --- |


    我可以向你保证，Jill 最初对与 `Jeff` 情况的认知，以及对她前丈夫所有之前情况的认知，绝不符合“一切都是完美的”这一观点。事实上，她觉得发生的事情是`显而易见的`错误或糟糕的。大多数人都会同意她的观点。


    但正如我们所看到的，只有当她意识到事实上在任何情况下都没有对错之分，她显然没有被任何人受害，而且 `Jeff` 远不是她的敌人，而是她的治愈天使时，治愈才在她身上发生。她开始慢慢看到，神圣引导如何帮助她治愈早期的误解以及相关的错误信念系统，这个系统多年来一直阻止她表达真实的自我。在此基础上，每种情况（包括与
    `Jeff` 发生的事）都是恩典的礼物。


    这实际上让 `RFT` 不像是一种疗法，倒不如说是一个教育过程。治疗师——或者我更喜欢的称呼教练——行动并不是出于修复某人的欲望，而是为了启迪他们。`激进宽恕`是一种灵性哲学，它对生活具有实际应用价值，因为它给了人们一种精神视角，他们可以以自救的方式应用于他们正在处理的任何问题或处境。


    神圣计划不是固定的。在计划展开的任何一点，人们总是拥有选择。`激进宽恕`帮助人们转变观点，并根据他们的洞察做出新的选择。


    Jill 的故事证明了这种认知的转变有多么困难。即使有相当明显的线索，在经历了大量的讨论和对情感痛苦的处理之后，她才开放去理解另一种解释。对于她前丈夫的不忠尤其是如此。


    想象一下，向一个大屠杀幸存者或刚被强奸或其他遭受暴力虐待的人推销`激进宽恕`的想法会有多艰难。事实上，`RFT` 的大部分初步工作涉及创造一种意愿，去观察发生的事情中存在完美的`可能性`。即便如此，取决于情况，培养这种接受性可能需要时间，并且几乎总是需要先进行大量的情感释放工作。尽管如此，这是可能的。我可以这么说，因为我见过拥有悲惨经历的人在非常短的时间内发生了巨大的转变。


    然而，仍然存在可能，有些人可能永远无法达到变得接受的程度；他们可能永远无法超越受害者心态的情绪。另一方面，那些发现自己即使只有一刻，也能看到自己处境中的完美的人，被赋予了释放受害者心态并获得自由的力量。Jill
    就是其中之一。


