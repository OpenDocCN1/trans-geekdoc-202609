- fmt: "\nAnother way to respond to that question is by pointing out that Radical\
    \ Forgiveness is a word-of-mouth phenomenon. Back in 1997, when I first published\
    \ the book, I received a letter from the owner of one of the biggest independent\
    \ bookstores in Atlanta. She said that she was noticing that people were coming\
    \ in and buying a copy of the book and then returning a week or so later to buy\
    \ six more for their friends. She wrote, “I have seen this phenomenon happen only\
    \ with two other books—*Celestine Prophecy* and *Conversations with God,* both\
    \ of which have become bestsellers.” I am not suggesting necessarily that you\
    \ go out and buy six books to give away, but you would be contributing in a big\
    \ way if you simply told your friends about Radical Forgiveness. There is probably\
    \ no better way these days than to send out an email message to everyone in your\
    \ address book who you think might be interested.\n\nSo there you have it—Radical\
    \ Forgiveness is finally out of the closet. It has been, as it were, masquerading\
    \ as simply a way to heal your life (which, of course, it is), but it is now “outed”\
    \ as being a powerful technology that will, in addition to helping you heal and\
    \ eradicate blocks in your life, raise your vibration considerably, awaken you\
    \ fully, and assist you in becoming an empowered spiritual being, fully able to\
    \ shift easily between the third and fourth—and even the fifth—dimensions of reality.\n\
    \nIt is also a way for each of us, both individually and collectively, to make\
    \ a significant difference in the world. As our vibratory rate increases, we will\
    \ find ourselves being called to do more to help others and prepare for the great\
    \ Awakening.\n\nThank you for being on this journey with me. There is much to\
    \ look forward to and be excited about, and I am grateful that you are in my life.\n\
    \n*Namasté* Colin Tipping\n\n# Notes\n\n[1] Joan Borysenko, *Guilt Is the Teacher;\
    \ Love Is the Lesson* (New York: Warner Books, 1990).\n\n[2] Ernst Becker, *The\
    \ Denial of Death* (New York: Macmillan, 1973).\n\n[3] Ken Carey, *The Starseed\
    \ Transmission* (New York: HarperOne, 1991).\n\n[4] For a thorough explanation\
    \ of how our evolution can be explained by reference to the chakras, see Caroline\
    \ Myss, *Anatomy of the Spirit* (New York: Three Rivers Press, 1996).\n\n[5] A.M.\
    \ Patent, *You Can Have It All* (New York: Simon & Schuster, 1995).\n\n____, *Death,\
    \ Taxes, and Other Illusions* (Tucson: Celebration Publishing, 1989).\n\n[6] Richard\
    \ Bach, *Running from Safety: An Adventure of the Spirit* (Concord, CA: Delta,\
    \ 1995).\n\n# Further Resources\n\nWe have numerous books, audio programs, videos,\
    \ and online courses available to help expand your knowledge about and practical\
    \ use of the Radical Forgiveness technology. We also offer professional training\
    \ programs that enable you to share Radical Forgiveness with others. To learn\
    \ more about our products or to find a Radical Forgiveness coach, and opportunities\
    \ for workshops and Radical Forgiveness Circle Ceremonies, please visit our website\
    \ at radicalforgiveness.com.\n\n# About the Author\n\nBorn in England in 1941,\
    \ Colin was raised during the war and in early post-war Britain by working-class\
    \ parents. He has an elder brother and a younger sister, both of whom appear in\
    \ Chapter 1, “Jill’s Story.” By his own account his parents were good people,\
    \ loving and hardworking, and he considers himself blessed in having had a stable\
    \ and enjoyable childhood in spite of the social hardships of the time.\n\nEven\
    \ as a boy, he seemed to inspire the trust of people who needed to talk about\
    \ their feelings, as they found in him a person who would listen and not judge.\
    \ After a four-year stint in the Royal Air Force, he became a high school teacher\
    \ and a college professor, but even then often found himself being sought after\
    \ to provide counseling for people. He has three children from his first marriage,\
    \ which ended in divorce after seven years. A second marriage lasted only four,\
    \ but he nevertheless remains friends with both ex-wives.\n\nHe immigrated to\
    \ America in 1984 and shortly thereafter became certified as a clinical hypnotherapist.\
    \ He liked hypnotherapy because, after some years of experience, he concluded\
    \ it speeded up the therapy by a factor of at least three.\n\nHe was not religious\
    \ then and still feels “free” of any organized religious dogma. His spirituality\
    \ is essentially practical and down-to-earth, simple, free, and open-end.\n\n\
    In 1992, he and his wife JoAnn, whom he met in Atlanta and married in 1990, created\
    \ a series of healing retreats in the north Georgia mountains for people challenged\
    \ by cancer. In recognizing that lack of forgiveness was a big part of the causation,\
    \ they set about refining a new form of forgiveness which later was to become\
    \ what is now recognized as Radical Forgiveness. Unlike traditional forgiveness,\
    \ which takes many years and is universally seen as very difficult to achieve,\
    \ this had to be be quick, easy to do, simple, and therapy-free.\n\nIn 1997, Colin\
    \ wrote the first edition of this book and began doing workshops in January 1998.\
    \ He now has an Institute for Radical Forgiveness in the U.S.A., Australia, Poland,\
    \ and Germany. He has no plans to retire.\n\n# About Sounds True\n\nSounds True\
    \ was founded in 1985 with a clear vision: to disseminate spiritual wisdom. Located\
    \ in Boulder, Colorado, Sounds True publishes teaching programs that are designed\
    \ to educate, uplift, and inspire. We work with many of the leading spiritual\
    \ teachers, thinkers, healers, and visionary artists of our time.\n\nTo receive\
    \ a free catalog of tools and teachings for personal and spiritual transformation,\
    \ please visit soundstrue.com, call toll-free 800-333-9185, or write to us at\
    \ the address below.\n\n```\n![](Images/postsection_image001.jpg)\n``` \n\n# Other\
    \ Products and Resources Available at radicalforgiveness.com\n\nRadical Forgiveness\
    \ is a technology that provides a wide variety of tools, processes, and experiential\
    \ programs to help you make forgiveness a part of your everyday life.\n\nMany\
    \ of the tools on our website are free, and we encourage you to use them as often\
    \ as you like.\n\nThere are also paid *Online Programs* specifically designed\
    \ to help you forgive your parents, your partners, or yourself.\n\n## Manifestation,\
    \ Money, and Games\n\n*   *The Online Radical Manifestation Program* trains you\
    \ to be a “conscious creator.”\n*   *The Online Radical Money Program* enables\
    \ you to raise your subconscious “income set point” with the goal of quadrupling\
    \ your income over a period of two years.\n*   *The “Satori” Radical Forgiveness\
    \ Game* besides being fun and a great way to introduce Radical Forgiveness to\
    \ others, is a mini-workshop that never fails to bring enlightenment (“satori”)\
    \ to the participants.\n\n## Weight Loss and Empowerment\n\n*   The only thing\
    \ you have to give up with *The Radical Weight Loss Program* are the stories that\
    \ caused you to gain weight in the first place.\n*   *The Radical Empowerment\
    \ Program* puts Radical Forgiveness and Radical Manifestation together to empower\
    \ you to make a difference in the world and to all aspects of your life. This\
    \ is a twelve-month, multimedia learning program.\n*   *The Miracles* weekend\
    \ workshop offers the opportunity of working personally with Colin or a facilitator\
    \ he has trained in releasing a particular grievance. This is always a life-changing\
    \ experience.\n\n## Certification\n\nYou will find more books by Colin Tipping\
    \ at radicalforgiveness.com, as well as CDs, DVDs, and many free downloads. Certification\
    \ programs are offered online if you wish to learn how to coach or teach others\
    \ how to use Radical Forgiveness and Radical Manifestation in the lives of others.\n\
    \nradicalforgiveness.com\n\n# Also from Sounds True and Colin Tipping\n"
  raw: "Another way to respond to that question is by pointing out that Radical Forgiveness\
    \ is a word-of-mouth phenomenon. Back in 1997, when I first published the book,\
    \ I received a letter from the owner of one of the biggest independent bookstores\
    \ in Atlanta. She said that she was noticing that people were coming in and buying\
    \ a copy of the book and then returning a week or so later to buy six more for\
    \ their friends. She wrote, “I have seen this phenomenon happen only with two\
    \ other books *—Celestine Prophecy* and *Conversations with God,* both of which\
    \ have become bestsellers.” I am not suggesting necessarily that you go out and\
    \ buy six books to give away, but you would be contributing in a big way if you\
    \ simply told your friends about Radical Forgiveness. There is probably no better\
    \ way these days than to send out an email message to everyone in your address\
    \ book who you think might be interested.\n\nSo there you have it—Radical Forgiveness\
    \ is finally out of the closet. It has been, as it were, masquerading as simply\
    \ a way to heal your life (which, of course, it is), but it is now “outed” as\
    \ being a powerful technology that will, in addition to helping you heal and eradicate\
    \ blocks in your life, raise your vibration considerably, awaken you fully, and\
    \ assist you in becoming an empowered spiritual being, fully able to shift easily\
    \ between the third and fourth—and even the fifth—dimensions of reality.\n\nIt\
    \ is also a way for each of us, both individually and collectively, to make a\
    \ significant difference in the world. As our vibratory rate increases, we will\
    \ find ourselves being called to do more to help others and prepare for the great\
    \ Awakening.\n\nThank you for being on this journey with me. There is much to\
    \ look forward to and be excited about, and I am grateful that you are in my life.\n\
    \n*Namasté* Colin Tipping \n\n# Notes\n\n\\[1\\] Joan Borysenko, *Guilt Is the\
    \ Teacher; Love Is the Lesson* (New York: Warner Books, 1990).\n\n\\[2\\] Ernst\
    \ Becker, *The Denial of Death* (New York: Macmillan, 1973).\n\n\\[3\\] Ken Carey,\
    \ *The Starseed Transmission* (New York: HarperOne, 1991).\n\n\\[4\\] For a thorough\
    \ explanation of how our evolution can be explained by reference to the chakras,\
    \ see Caroline Myss, *Anatomy of the Spirit* (New York: Three Rivers Press, 1996).\n\
    \n\\[5\\] A.M. Patent, *You Can Have It All* (New York: Simon & Schuster, 1995).\n\
    \n\\_\\_\\_\\_\\_, *Death, Taxes, and Other Illusions* (Tucson: Celebration Publishing,\
    \ 1989).\n\n\\[6\\] Richard Bach, *Running from Safety: An Adventure of the Spirit*\
    \ (Concord, CA: Delta, 1995).\n\n# Further Resources\n\nWe have numerous books,\
    \ audio programs, videos, and online courses available to help expand your knowledge\
    \ about and practical use of the Radical Forgiveness technology. We also offer\
    \ professional training programs that enable you to share Radical Forgiveness\
    \ with others. To learn more about our products or to find a Radical Forgiveness\
    \ coach, and opportunities for workshops and Radical Forgiveness Circle Ceremonies,\
    \ please visit our website at radicalforgiveness.com.\n\n# About the Author\n\n\
    Born in England in 1941, Colin was raised during the war and in early post-war\
    \ Britain by working-class parents. He has an elder brother and a younger sister,\
    \ both of whom appear in Chapter 1, “Jill’s Story.” By his own account his parents\
    \ were good people, loving and hardworking, and he considers himself blessed in\
    \ having had a stable and enjoyable childhood in spite of the social hardships\
    \ of the time.\n\nEven as a boy, he seemed to inspire the trust of people who\
    \ needed to talk about their feelings, as they found in him a person who would\
    \ listen and not judge. After a four-year stint in the Royal Air Force, he became\
    \ a high school teacher and a college professor, but even then often found himself\
    \ being sought after to provide counseling for people. He has three children from\
    \ his first marriage, which ended in divorce after seven years. A second marriage\
    \ lasted only four, but he nevertheless remains friends with both ex-wives.\n\n\
    He immigrated to America in 1984 and shortly thereafter became certified as a\
    \ clinical hypnotherapist. He liked hypnotherapy because, after some years of\
    \ experience, he concluded it speeded up the therapy by a factor of at least three.\n\
    \nHe was not religious then and still feels “free” of any organized religious\
    \ dogma. His spirituality is essentially practical and down-to-earth, simple,\
    \ free, and open-ended.\n\nIn 1992, he and his wife JoAnn, whom he met in Atlanta\
    \ and married in 1990, created a series of healing retreats in the north Georgia\
    \ mountains for people challenged by cancer. In recognizing that lack of forgiveness\
    \ was a big part of the causation, they set about refining a new form of forgiveness\
    \ which later was to become what is now recognized as Radical Forgiveness. Unlike\
    \ traditional forgiveness, which takes many years and is universally seen as very\
    \ difficult to achieve, this had to be be quick, easy to do, simple, and therapy-free.\n\
    \nIn 1997, Colin wrote the first edition of this book and began doing workshops\
    \ in January 1998. He now has an Institute for Radical Forgiveness in the U.S.A.,\
    \ Australia, Poland, and Germany. He has no plans to retire.\n\n# About Sounds\
    \ True\n\nSounds True was founded in 1985 with a clear vision: to disseminate\
    \ spiritual wisdom. Located in Boulder, Colorado, Sounds True publishes teaching\
    \ programs that are designed to educate, uplift, and inspire. We work with many\
    \ of the leading spiritual teachers, thinkers, healers, and visionary artists\
    \ of our time.\n\nTo receive a free catalog of tools and teachings for personal\
    \ and spiritual transformation, please visit soundstrue.com, call toll-free 800-333-9185,\
    \ or write to us at the address below.\n\n![](Images/postsection_image001.jpg)\
    \  \n\n# \n\nOther Products and Resources Available at radicalforgiveness.com\n\
    \nRadical Forgiveness is a technology that provides a wide variety of tools, processes,\
    \ and experiential programs to help you make forgiveness a part of your everyday\
    \ life.\n\nMany of the tools on our website are free, and we encourage you to\
    \ use them as often as you like.\n\nThere are also paid *Online Programs* specifically\
    \ designed to help you forgive your parents, your partners, or yourself.\n\n*The\
    \ Online Radical Manifestation Program* trains you to be a “conscious creator.”\n\
    \n*The Online Radical Money Program* enables you to raise your subconscious “income\
    \ set point” with the goal of quadrupling your income over a period of two years.\n\
    \n*The “Satori” Radical Forgiveness Game* besides being fun and a great way to\
    \ introduce Radical Forgiveness to others, is a mini-workshop that never fails\
    \ to bring enlightenment (“satori”) to the participants.\n\nThe only thing you\
    \ have to give up with *The Radical Weight Loss Program* are the stories that\
    \ caused you to gain weight in the first place.\n\n*The Radical Empowerment Program*\
    \ puts Radical Forgiveness and Radical Manifestation together to empower you to\
    \ make a difference in the world and to all aspects of your life. This is a twelve-month,\
    \ multimedia learning program.\n\n*The Miracles* weekend workshop offers the opportunity\
    \ of working personally with Colin or a facilitator he has trained in releasing\
    \ a particular grievance. This is always a life-changing experience.\n\nYou will\
    \ find more books by Colin Tipping at radicalforgiveness.com, as well as CDs,\
    \ DVDs, and many free downloads.\n\nCertification programs are offered online\
    \ if you wish to learn how to coach or teach others how to use Radical Forgiveness\
    \ and Radical Manifestation in the lives of others.\n\nradicalforgiveness.com\n\
    \n# Also from Sounds True and Colin Tipping"
