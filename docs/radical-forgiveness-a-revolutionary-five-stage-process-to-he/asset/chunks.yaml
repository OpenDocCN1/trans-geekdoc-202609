  trans: "\n\n“他愿意付出一切代价，只为了让你重新审视你对自己的信念，并发现那些信念是不真实的。你意识到为了帮助你，他愿意忍受多少不适了吗？他天性并不是一个残忍的人，所以对他来说一定很艰难。很少有人能在一个冒着失去你的风险的情况下为你做这些事情。杰夫，或者说杰夫的灵魂，对你来说真是一个天使。当你真正理解这一点时，你会对他感到无比感激！此外，你将停止向外发出‘自己不被爱’的信号。你将有能力让爱进入内心，或许这是你人生中的第一次。你会原谅杰夫，因为你会很清楚，从未发生过任何错误。在任何意义上，那一切都是完美的。”\n\
    \n“我向你保证这一点，”我继续道，“此时此刻杰夫正在改变并戒掉那些古怪的行为。他的灵魂已经察觉到你已经原谅了他，并治愈了你对自己的误解。当你改变能量时，他的能量也随之改变。你们在能量上是连接的。物理距离是不无关的。”\n\
    \n回到她的问题，我说：“所以，你回到家不需要做任何特别的事情。事实上，我希望你答应我，回去后什么都不要做。特别是，在任何情况下，都不要向杰夫分享这种看待问题的新方式。我想让你看到，一切将如何`由于你感知的改变而自动简单地发生变化`。”\n\
    \n“你也会感到自己的改变，”我补充道，“你会发现自己变得更加平静、更加专注、更加放松。你将拥有一种认知，这在杰夫看来一段时间内会觉得很奇怪。你们的关系需要时间来调整，可能一段时间内仍然很困难，但这个问题现在已经解决了，”我坚定地总结道。\n\
    \n在吉尔回到英国之前，我和她多次复习了这种看待她处境的新方式。对于一个处于情绪波动中的人来说，要转变为“激进宽恕”（Radical Forgiveness）视角总是困难的。事实上，要达到能够真正激进宽恕的状态，通常需要大量的整合和反复强化。为了帮助我的姐姐，我向她介绍了一些帮助释放情绪并整合新生存的呼吸技巧，并要求她完成一份激进宽恕工作表。（参见第四部分，“激进宽恕的工具”。）\n\
    \n在她离开的那天，吉尔显然对回到她留下的那种处境感到紧张。当她走下登桥走向飞机时，她回头并自信地挥了挥手，但我知道她是害怕自己失去这种新获得的理解，并再次被拉回戏剧性的冲突中。\n\
    \n显然，与杰夫的会面进展顺利。吉尔请求他不要立刻质问她离开期间发生了什么。她还请求他给她几天的空间让她安顿下来。但她立刻注意到了他身上的变化。他变得专注、友善且体贴——更像她在整场风剧开始前所相识的那个杰夫。\n\
    \n在接下来的几天里，吉尔告诉杰夫，她不再因为任何事埋怨他，也不希望他以任何方式改变。她说她已经学会了是自己需要对自己的情绪负责，并且她会以自己的方式处理出现的任何问题，而不会指责他错了。她没有做任何解释，也没有试图证明自己。\n\
    \n吉尔回到家后的几天里进展得很顺利，杰夫对女儿洛莱的行为也发生了巨大的变化。事实上，关于那段关系，一切似乎都在恢复正常，但杰夫和吉尔之间的气氛依然保持紧张，他们的交流也很有限。\n\
    \n大约两周后，情况发展到了顶点。吉尔看着杰夫，轻声说：“我觉得我失去了我最好的朋友。”\n\n“我也是，”他回答道。\n\n这是他们几个月来第一次建立联系。他们拥抱在一起开始哭泣。“我们谈谈吧，”吉尔说，“我必须告诉我在美国和科林一起学到的东西。起初你听起来可能很奇怪，但我想和你分享。你不必非相信它，我只想让你听我说。你愿意吗？”\n\
    \n“我会付出任何代价，”杰夫回答道，“我知道在那里发生了一些重要的事情。我想知道是什么。你变了，我喜欢我看到的你。你不再是和约翰一起上飞机时的那个人了。所以告诉我发生了什么。”\n\
    \n吉尔说了一又一遍。她尽力用杰夫能理解的方式解释了激进宽恕的动态机制。她感到自己强大且有力量——对自己和自己的理解充满信心，头脑中安全且清晰。\n\n杰夫是一个务实的人，对任何无法用理性解释的事物总是持怀疑态度，但这一次他没有抵制，他确实非常乐于接受吉尔让他考虑的观点。他对于“日常现实之下可能存在精神世界”的想法表达了开放态度，并据此在激进宽恕的理念中看到了某种逻辑。他并没有完全接受，但仍然愿意倾听、考虑，并观察它是如何改变吉尔的。\n\
    \n讨论结束后，他们都觉得自己的爱被重新点燃，他们的关系很有机会生存下去。尽管如此，他们没有做承诺，并同意在观察关系进展的同时保持交流。\n\n关系确实进展得相当顺利。杰夫仍然在某种程度上宠爱他的女儿洛莱，但没有像以前那那样了。吉尔发现，即使他表现出这种行为，她也几乎不在意了。这确实没有触发她在情绪上的退行，也没有根据她对自己的旧信念做出反应。\n\
    \n在谈论激进宽恕的对话后的一个月内，杰夫过去对洛莱的所有行为模式都停止了。相反，洛莱不再像以前那样经常打电话或拜访；她开始经营自己的生活。一切慢慢恢复正常，吉尔和杰夫的关系开始比以往任何时候都更加安全和充满。杰夫变回了他本性善良敏感的男人，吉尔变得不再那么依赖，洛莱变得更快乐了。\n\
    \n回想起来，如果吉尔的灵魂没有把她带到亚特兰大来为我们的对话创造机会，我确信她和杰夫会分开。从宏观角度来看，那也可以。吉尔只是会找到另一个人来重演这种戏剧，并获得另一个治愈的机会。而现在，她抓住了这次治愈的机会并留在了在这段关系中。\n\
    \n*注：图 1 中的时间线图以图表形式描述了吉尔的故事。她发现这极大地帮助她看清了那种未被父亲感爱的原始痛苦是如何导致了“我自己不够好”的信念，以及这种信念反过来是如何在她生活中起作用的。*（图\
    \ 1）\n\n![](img/part1_chapter1_image001.jpg)  \n\n图 1: 吉尔的治愈之旅\n\n"
