    Fortunately, a friend who had attended my first workshop many years before came
    to dinner. When I told her my story, her response was, “Well, have you done a
    worksheet around this?”


    Of course I hadn’t. It was the thing furthest from my mind. “No, I haven’t done
    a worksheet,” I replied, feeling very angry.


    “Don’t you think you should?” Lucie asked.


    “No, I don’t want to do a darn worksheet!” I shouted.


    Then JoAnn chimed in. “Well, it’s your worksheet. You ought to practice what you
    preach!” That did it. Feeling cornered, I stomped upstairs to get one, but I was
    angry. I knew, and so did they, that I was doing it under protest. It was the
    last thing in the world I wanted to do, but they wouldn’t let me off the hook.
    I did each step in a huff and with little or no commitment to the process. Then
    all of a sudden, as I got about halfway through, I had to read this statement:
    “I release the need to blame and the need to be right.” That was when it hit me.
    *The need to be right!* All of a sudden it flashed before me what I was trying
    to be right about. I had a core belief that I always had to do everything myself!
    I saw that this incident was just another playing out of that belief. All the
    other times I had unconsciously created being let down that way flashed before
    my eyes. I then saw and fully understood that this woman was supporting me in
    becoming acquainted with this toxic belief so that I could release it and open
    myself to greater abundance.


    Suddenly, all my anger evaporated, and I saw how I had shut myself off from the
    very things I believed in and was teaching. I felt very ashamed—but at least I
    was conscious again. I could now see that this woman was an angel of healing for
    me, and I switched from feeling anger and resentment to feeling profound gratitude
    and love for her.


    Besides being a wonderful awakening, this was a very powerful and humbling lesson
    in how easy it is to become unconscious about spiritual law and how quickly you
    can be sucked into a drama. It was also a great demonstration of how quickly I
    could separate from my true nature and from everything I knew to be true even
    after having once awakened to it. It was also a powerful reminder of why we need
    spiritual friends who will support us by not buying in to our victim story and
    being prepared to challenge us on it.


    Now, the question you are probably asking is, having realized that she was a healing
    angel for me, did I cancel the court case against her? Well, I can tell you, I
    agonized over this.


    I recognized that, even though I now saw the truth from the perspective of the
    World of Divine Truth, the situation itself was deeply grounded in the World of
    Humanity. I offered to go to mediation twice, and she refused on both occasions.
    So I went ahead with the court case, reasoning that her soul needed to have that
    experience; otherwise it would have taken her out of it when I suggested mediation.
    But I went into it with my heart open and with the intention that the right and
    perfect outcome would ensue. The court found in my favor, and I got a judgment
    against her for most of the $4,000. I never got the money, but that didn’t matter.
    The point was that we had trusted the process and had done what seemed to be necessary
    at the time.


    The truth is, it wouldn’t have mattered which way I decided. Spirit could have
    sorted it out some other way, and it all would have worked out okay in the end—as
    it always does. The idea that our decisions matter in the overall scheme of things
    is just our ego trying to make us feel separate and special. The Universe has
    everything handled no matter what we decide. But how we make those decisions—whether
    from love or fear, greed or generosity, false pride or humility, dishonesty or
    integrity—matters to us personally, because each decision we make affects our
    vibration.'
