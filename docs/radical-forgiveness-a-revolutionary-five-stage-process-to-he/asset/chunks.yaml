    \ obviously been obliged to cut their way out. The storm had happened while thirty-six\
    \ people were at the center attending a conference, and they were unable to leave\
    \ for two whole days. But in spite of all the trees down, not a single car or\
    \ any of the buildings were touched—and all were right in among the trees. Trees\
    \ fell within inches of structures and autos but miraculously damaged nothing.\
    \ For my friends, it was a great confirmation of their faith and willingness to\
    \ trust.\n\nLooking at this from a cause-and-effect standpoint, Jean recognized\
    \ that buying insurance reinforced a belief (a cause) in adversity and would create\
    \ the energy for something bad (an effect) to happen. Instead she chose the thought\
    \ (cause) “We are doing God’s work here, and we are absolutely safe.” The effect,\
    \ as it played out in the world, was that in the midst of chaos nothing bad happened.\n\
    \nAs I have said, if you want to know your beliefs, look at what you have in your\
    \ life—or what you do not have. If, for example, you do not have love in your\
    \ life and do not seem to be able to create a loving relationship, examine your\
    \ beliefs about self-worth, or about safety with the opposite sex. Of course,\
    \ this may not be as easy as it sounds, for the beliefs you hold may be buried\
    \ deep in your subconscious mind.\n\n#### **You Don’t Need to Know Why**\n\nThe\
    \ good news is that you do not have to know why you created your situation or\
    \ what beliefs led you to its creation. Just seeing the situation’s existence\
    \ as an opportunity to perceive it differently *—being willing* to see it as perfect—is\
    \ enough to bring about the required shift in perception and a healing of the\
    \ original pain.\n\nThe truth is, we in the World of Humanity cannot know *why*\
    \ a situation is as it is because the answer lies in the World of Divine Truth,\
    \ and we can know little or nothing of that world as long as we are in human form.\
    \ *All we can do is surrender to the situation.*\n\n#### **Just Surrender**\n\n\
    If new insights or connections, old memories, emotional movements, and other psychic\
    \ events are necessary for the desired change to occur, they will happen automatically\
    \ and without our conscious control. If we try to figure it all out and manipulate\
    \ the unfolding process, this creates resistance and blocks the process completely,\
    \ which puts us right back under the influence of the ego.\n\n#### **Freedom from\
    \ the Law**\n\nIt is important to realize that the Law of Cause and Effect only\
    \ applies to the World of Humanity. It is a physical law, not a spiritual law.\
    \ Creating an open parking space or any other physical thing that you desire and\
    \ create with your mind is still only manipulating the illusion. It has little\
    \ to do with being spiritual as such. In fact, if we imagine that we are special\
    \ because of how well we can manifest in the world, this simply increases our\
    \ sense of separation and strengthens the ego.\n\nOn the other hand, when we truly\
    \ drop the need to know the why or how of everything, let go of our need to control\
    \ the world, and truly surrender to what is—as is—in the knowledge that the love\
    \ of God is in everything, we shall transcend the Law of Cause and Effect entirely.\
    \ Then we shall realize that karma is just another story that exists only in our\
    \ minds in the World of Humanity. In the World of Divine Truth, there is no such\
    \ thing as karma or cause and effect. There is only first cause, which is God.\n\
    \nHowever, if we engage in activities and consistent ways of being that result\
    \ in our vibration being significantly raised (through the continual and sustained\
    \ use of Radical Forgiveness over a long period of time, for instance), we may\
    \ find ourselves becoming “first cause.”\n\nThat would be in stark contrast to\
    \ how it is for the majority of us at the present time, where we are always the\
    \ “effect” in this cause-and-effect world—always having to react to what appears\
    \ to be happening “out there.”\n\nPerhaps in the not-too-distant future, when\
    \ our vibratory rate is raised and we have all our energy and consciousness in\
    \ present time rather than tied up in past or future, we will find ourselves not\
    \ so much noticing synchronicities as *becoming* synchronicity itself.\n\nFor\
    \ more on how to gauge your own vibratory rate, how you stack up against the “enlightened”\
    \ ones, and how many it would take of a certain vibration to shift planetary consciousness,\
    \ I recommend David Hawkins’s book *Power vs. Force,* published by Hay House.\n\
    \n## \n\n# \n\n#### 10\n\n### Mission “Forgiveness”\n\nNot one of us can feel\
    \ our soul’s journey to be over until we, as an entire species, have completed\
    \ the mission we created for ourselves. This involves no less than transforming\
    \ the energies of fear, death, and duality by coming to the full realization of\
    \ our oneness—that we are not separated from God at all and that these energies\
    \ are simply illusion. This is our collective mission; each of us serves as an\
    \ individual expression of that mission, and the life we create for ourselves\
    \ here in the World of Humanity purely serves that purpose. There are no exceptions.\
    \ Whether we know it or not, we are all on that spiritual path.\n\n### OUR INDIVIDUAL\
    \ MISSION\n\nThe decision about which energies we work with on the earth plane\
    \ is not made by us at the human level. That decision predates our incarnation\
    \ and is made by our soul group—a group to which we belong made up of souls who\
    \ either incarnate with us or act as our spirit guides during our incarnation.\n\
    \nOnce it is decided which energies we will work with, we then carefully choose\
    \ parents who will provide the experiences we need as children, and we arrange\
    \ for others to come along at the right time to play their respective roles in\
    \ the experiences necessary to the accomplishment of our mission. We create dramas\
    \ throughout our physical lives that allow us to experience the feelings that\
    \ make up our mission. These dramas serve as opportunities to experience the separation\
    \ we came to experience. Then we can awaken, forgive, and remember who we are.\n\
    \n### MISSION AMNESIA"
