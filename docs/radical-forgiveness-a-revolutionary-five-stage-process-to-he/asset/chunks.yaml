    # Instructions


    Instructions: Be as confrontational as possible with `X`, and lay out exactly
    what you blame him/her/it for. This section’s small space only allows a few words,
    but let the words you choose represent the totality of your upset. If the object
    or situation has no name, give it one, or at least write about it as if it were
    a person. If the person is dead, speak to him or her as if he or she were there
    in front of you. If you want to write it out in full, do so in the form of a letter.
    (See Chapter 24.) This step allows you to address the person directly. However,
    keep to one issue. Do not discuss other things in the letter or on this worksheet.
    Reaching your objective—Radical Forgiveness—requires you to get clarity on precisely
    what you feel so upset about `now.`


    ## 2b. Because of what you did (are doing), I feel: *(Identify your real emotions
    here.)*


    *Hurt, abandonment, betrayal, aloneness, sadness, and anger.*


    Instructions: It is vitally important that you allow yourself to feel your feelings.
    Do not censor them or “stuff” them. Remember, we came into the physical realm
    to experience emotion—the essence of being human. All emotions are good, except
    when we suppress them. Stuffing emotion creates potentially harmful energy blocks
    in our bodies.


    Make sure the emotions you identify represent real emotions you actually feel,
    not just thoughts about how you feel. Are you mad, glad, sad, or afraid? If you
    cannot be specific, that is okay. Some people find themselves unable to differentiate
    one feeling from another. If that holds true for you, just notice what general
    emotional quality you can feel around the situation.


    If you would like to feel your emotions more clearly or strongly, pick up a tennis
    racket or a bat and beat the heck out of some cushions or pillows. Use something
    that will make a noise when you hit the cushions. If anger scares you, have someone
    with you when you do this exercise. That person should encourage and support you
    in feeling your anger (or any other emotion) and make it safe to do so. Screaming
    into a cushion also helps to release feelings. As I have stressed many times,
    the more you allow yourself to feel the hurt, sadness, or fear that may lie beneath
    your anger, the better.


    ## II. FEELING THE FEELINGS


    ### Acknowledging My Own Humanness


    3\. I lovingly recognize and accept my feelings and judge them no more. I am entitled
    to my feelings.


    Instructions: This important step provides you with an opportunity to allow yourself
    some freedom from the belief that feelings like anger, vengefulness, jealousy,
    envy, and even sadness are bad and should be denied. No matter what they are,
    you need to feel your emotions in exactly the way they occur for you, for they
    are an expression of your true self. Your soul wants you to feel them fully. Know
    they are perfect and quit judging yourself for having them.


    Try the following three-step process for integrating and accepting your feelings:


    Step 1. Feel the feeling fully, and then identify it as either mad, glad, sad,
    or afraid.


    Step 2. Embrace the feelings in your heart just the way they are. Love them. Accept
    them. Love them as part of yourself. Let them be perfect. You cannot move into
    the joy vibration without first accepting your feelings and making peace with
    them. Say this affirmation: “I ask for support in feeling love for each of my
    emotions just the way it is, as I embrace it within my heart and accept it lovingly
    as part of myself.”


    Step 3. Now feel love for yourself for having these feelings and know you have
    chosen to feel them as a way of moving your energy toward healing.


    4\. I own my feelings. No one can make me feel anything. My feelings are a reflection
    of how I see the situation.


    Instructions: This statement reminds us that no one can make us feel anything.
    Our emotions are our own. As we feel, recognize, accept, and love our emotions
    unconditionally as part of ourselves, we become entirely free to hold on to them
    or let them go. This realization empowers us by helping us realize that the problem
    resides not “out there” but in here, within ourselves. This realization also represents
    our first step away from the victim archetype vibration. When we think that other
    people, or even situations, make us mad, glad, sad, or afraid, we give them all
    our power.


    5\. My discomfort was my signal that I was withholding love from myself and `Jeff`
    by judging, holding expectations, wanting `Jeff` to change, and seeing `Jeff`
    as less than perfect.


    *(List the judgments, expectations, and behaviors that indicate you wanting Jeff.)*


    I interpreted his caring for his daughter Lorraine to mean that she was more important
    than me in his eyes. I went from there to interpreting that he did not love me
    and that I was not enough for him and that he was like all men.


    Instructions: When we feel disconnected from someone, we cannot love them. When
    we judge a person (or ourselves) and make them wrong, we withhold love. Even when
    we make them right, we are withholding love, because we make our love conditional
    upon their rightness.


    Any attempt to change someone involves a withdrawal of love, because wanting them
    to change implies that they are wrong and need to change. Furthermore, we may
    even do harm in encouraging them to change, for we we realize. For instance, if
    we send unsolicited healing energy to someone because they are sick, we are in
    effect making a judgment that they are not okay as they are and should not be
    sick. Who are we to make that decision? Being sick may be the very experience
    they need for spiritual growth. Naturally, if they request a healing, it becomes
    a different matter, and you do all you can in response. Nevertheless, you still
    see them as perfect.


    So make a note in this box of all the ways you want the person you are forgiving
    to be different or in what respects you want them to change. What subtle judgments
    do you make about the person that indicate your inability to accept them just
    the way they are? What behavior do you exhibit that shows you be in judgment of
    them?


    ### III. COLLAPSING THE STORY


    6\. I now realize that in order to feel the experience more deeply, my soul has
    encouraged me to create a bigger story out of the event or situation than it actually
    seemed to warrant, considering just the facts. This purpose having been served,
    I can now release the energy surrounding my story by separating the facts from
    the interpretations I have made up about it. *(List the main interpretations and
    circle the level of emotion and attachment you have around each interpretation
    now.)*


    Level of emotion now:


    \_ High \_ Medium \_ Low \_ Zero

