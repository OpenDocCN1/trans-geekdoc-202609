    Another situation I am often asked to address is what to do when one becomes aware
    of a child being abused. The question raised is: if we assume that the child’s
    spiritual growth is being supported by this experience, should we take action
    or not, since to interfere would be to deny the child’s soul its growth experience?
    My answer is always that, as human beings, we must do what it is right according
    to our present awareness of right and wrong—as defined in human law. So we act
    accordingly while at the same time knowing that, in spiritual law, nothing wrong
    is taking place. Naturally, then, we would intervene. As human beings, we cannot
    do otherwise. But our intervention is not wrong or right either, because either
    way Spirit has it handled.


    My reasoning is that if it were in the best interest of the child’s soul for there
    to be no intervention, Spirit would arrange things in such a way as to prevent
    it. In other words, if I am not supposed to intervene, Spirit will keep me unaware
    of the situation. Conversely, if Spirit makes me aware of the situation, I assume
    it has no problem with my intervening. In the end, it is not even my decision.


    When I do intervene, though, I do it free of judgment and the need to blame anyone.
    I just do it, knowing that the Universe set the whole thing up for a reason and
    that there is perfection in there somewhere.


    # 5


    ## Radical Forgiveness Therapy


    There’s little about Jill’s story that is unusual. The reality is, it could be
    anyone’s story. In fact, since the publication of the first edition of this book
    in 1997, many thousands of people have written, called, or emailed me to say that
    they identify so much with it that they felt, while reading it, that it was their
    own personal story. For many of those who have read it, this compelling story
    has been the beginning of their healing, just as it was for Jill.


    Insofar as it is typical of many apparent relationship problems, the story also
    provides a good example of how `Radical Forgiveness` can be applied to the quite
    ordinary problems of everyday life and demonstrates its viability as a radical
    alternative to traditional counseling and psychotherapy. This practice became
    known as `Radical Forgiveness Therapy` (`RFT`).


    There is some irony in this, since it is a fundamental principle of `Radical Forgiveness`
    that, notwithstanding all evidence to the contrary, nothing wrong is happening
    and there is nothing to change. How can it therefore be therapy? After all, the
    main principle underlying `Radical Forgiveness` is that “Without exception, everything
    that happens to us is divinely guided, purposeful, and for our greater good.”


    The very notion of therapy implies that something is amiss and needs to be changed.
    When we go to a therapist, we expect our therapist to ask himself or herself these
    three basic questions:


    | 1. | What is wrong with this person or circumstance? |

    | --- | --- |

    | 2. | What caused him/her to become this way? |

    | --- | --- |

    | 3. | How can his/her problem be fixed? |

    | --- | --- |


    Since none of these questions are applicable to `Radical Forgiveness`, how can
    `Radical Forgiveness` become a therapeutic modality? The answer lies in the way
    it worked for Jill.


    You might recall that in the beginning of the story with Jill, I acted out of
    an implicit agreement with her that she really did have a problem, that `Jeff`
    was the basic cause of it, and that the only way to react to it was by trying
    to find a solution. For quite some time I went down this traditional road with
    her. Only when I thought the time was right did I suggest a different (`Radical
    Forgiveness`) approach.


    At that point, I had to make it very clear to her that I was shifting the conversation
    in an entirely different direction and using an alternate set of assumptions.
    More particularly, I was shifting to a new set of questions. These were:


    | 1. | What is perfect about what is occurring for her? |

    | --- | --- |

    | 2. | How is this perfection being revealed? |

    | --- | --- |

    | 3. | How can she shift her viewpoint in order to accept that there might be
    a certain perfection in her situation? |

    | --- | --- |


    I can assure you that Jill’s original perception of the situation with `Jeff`,
    and of all prior situations with her previous husband, certainly did not agree
    with with the idea of everything being perfect. Indeed, she felt that what had
    occurred was `self-evidently` wrong or bad. Most people would have agreed with
    her.


    But, as we saw, the healing occurred for her only when she realized that, in fact,
    there was no right or wrong in any of the situations, that she was clearly not
    being victimized by anyone, and that, far from being her enemy, `Jeff` was her
    healing angel. She slowly began to see how at every moment divine guidance was
    helping her to heal an earlier misperception and a related false belief system
    that for years had prevented her from expressing her true self. Each situation,
    including what was happening with `Jeff`, was, on that basis, a gift of grace.


    This actually makes `RFT` less a therapy and more a process of education. The
    therapist—or coach, as I prefer to call him or her—acts not so out of a desire
    to fix someone as to enlighten him or her. `Radical Forgiveness` is a spiritual
    philosophy that has practical application to people’s lives insofar as it gives
    them a spiritual perspective which they can apply, in the manner of self-help,
    to whatever problem or situation they are dealing with.


    The divine plan is not fixed. At any point in the unfolding of one’s plan, one
    always has choice. `Radical Forgiveness` helps people to shift their viewpoint
    and make new choices based on their insights.


    Jill’s story demonstrates how difficult it can be to make that shift in perception.
    Even with fairly obvious clues, it took a lot of discussion and processing of
    emotional pain before she became open to understanding a different interpretation.
    This was especially true of her former husband’s infidelity.


    Imagine how tough it might be to sell the idea of `Radical Forgiveness` to a Holocaust
    victim or someone who has just been raped or otherwise violently abused. Indeed,
    much of `RFT`’s preliminary work involves creating a willingness to even look
    at the `possibility` of there being perfection in what happened. Even then, depending
    on the circumstances, developing such a receptivity can take time and almost always
    requires a great deal of emotional release work first. It is, nevertheless, possible.
    I can say this because I have seen people with horrendous stories make tremendous
    shifts in very short periods of time.


    Yet it remains possible that some people may never get to the point where they
    become receptive; they simply may never get beyond their feelings of victimhood.
    On the other hand, those who find themselves able to see, even for a moment, the
    perfection in their situation are empowered to release their feelings of victimhood
    and to become free. Jill was one of those.


    Therein lies the power of this work, for, as we shall see in later chapters, releasing
    victimhood provides the key to health, personal power, and spiritual evolution.
    We have been addicted to the victim archetype for eons, and as we move into the
    Aquarian Age (the next two-thousand-year period of spiritual evolution), we must
    answer the call to let go of the past, release the victim archetype, and be more
    aware of life occurring in the moment.

