    微妙场像层层震动的能量护鞘一样包裹着物理体，每一层都比前一层高一个八度。但它们并不是具有清晰边界的固定频带，如图 10 所示。相反，它们在很大程度上处在同一个空间内扩散，仿佛它们都是环绕在我们身体周围的能量海洋的一部分。微妙体与其说是通过空间中的位置定义的，不如说是通过它们振动的不同频率定义的。


    微妙体与物理体的振动模式产生和谐共鸣，使意识（心灵）能够与身体相互作用。这就是当我们谈论`身心连续体`（body-mind continuum）时的含义，心灵既存在于物理体内部，也存在于外部。（有关赋予这些微妙体的特质和目的的更多细节，请参考第
    15 章。）


    为了用具体的类比来落实这一概念，可以将我们的身体想象成家用供暖炉中常见的过滤器——那种我们必须定期清理以确保炉子高效运行的过滤器。正如这些过滤器的设计是为了让空气容易流过，我们的身体和生命力也是如此。生命力必须能够自由地流过我们所有的身体——包括我们的物理体和微妙体。（图
    10）


    ![](img/part2_chapter13_image001.jpg)


    图 10：微妙能量体


    每当我们判断、指责他人、埋怨、投射、压抑愤怒、怀恨等时，我们就在身体/多个身体中创造了一个能量阻塞。每当我们这样做，我们的过滤器就会变得稍微堵塞一点，留给炉子的可用能量就越少。早晚过滤器会失效，由于缺乏了维持燃烧所需的生命氧气，火焰就会熄灭。简单来说，当我们的物理体和微妙体变得过于堵塞，导致生命力无法轻松流动时，我们的身体就开始关闭。在许多情况下，这首先表现为抑郁。最终，我们的身体会生病，如果不移除这些阻塞，我们可能会死亡。


    你可能记得我的姐姐吉尔（Jill）在进入“激进宽恕”（Radical Forgiveness）时感到能量得到了释放。她的生命力过滤器被她对自己缺乏价值的毒性信念系统所阻塞，更不用说过去的怨恨、愤怒、悲伤以及对现状的挫败感。当她放下这一切时，她的能量阻塞被清除了，这让她也转变转变了情绪状态。每当你进行激进宽恕时，你都会释放出大量的生命能量，这些能量随后可以用于治愈、创造以及表达你人生的真正目标。


    ### 法拉的流感释放


    我的好朋友法拉·艾伦（Farra Allen）是亚特兰大按摩学校的联合创始人，也是身心咨询师。他患了一种特别毒性的流感病毒，这种病毒通常会让人们卧床十天或以上。病毒对他的打击很大，但他并没有把所有的力量都交给病毒，而是决定围绕它做一些内在工作，这些工作可能会改变固定病毒位置的能量模式。通过使用一种被称为“主动想象”（active
    imagination）的过程（这仅涉及以意识流的形式写下想法），他发现了一个此前未曾意识且未解决的情绪问题。他利用激进宽恕清除了这个问题，流感几乎立即就消失了。在发病后的两天内，他就开始全职工作并感觉良好。这是对激进宽恕治愈力量的强有力证明。


    #### 癌症也会反应吗？


    假设这种疾病是癌症而不是流感，而且我们认为它始于一种深层压抑的情绪。考虑到治愈方法可能在于释放那个能量阻塞，我们的建议将是我的朋友去接触那些压抑的情绪，充分感受它们，然后让它们。


    然而，与法拉的流感袭击不同（流感可能在几天内从他的微妙体移动到物理体），这种能量模式可能花了多年时间才从微妙体移动到物理体，并最终表现为疾病。那时困扰我们的问题就变成了：仅通过情绪释放工作，疾病过程需要多长时间才能完全逆转？可以设想，这可能需要与疾病发作所需的相同的年份——如果你患有癌症或其他对时间至关重要的疾病，这可能并不实际——至少看起来看起来是这样。


    #### 时间是治愈中的一个因素


    我们过去认为时间是固定且线性的，直到爱因斯坦证明了时间是一个相对性概念。在治愈一种物理疾病或状况所需的时间上，意识绝对是一个因素。我们的意识越高，我们对任何我们专注关注的事物所创造的变化就越快。


    将意识想象成我们的振动频率。对于一个振动频率低的人来说，从能量上逆转癌症的疾病过程可能需要长时间。如果我们处于恐惧中、怀着愤怒和怨恨、把自己想成受害者，和/或将能量锁定在过去，频率就会自动变低。对于我们大多数人来说，这在大多数时间里代表了我们的意识。因此，很少有人能仅仅依靠释放疾病的情绪原因就足够快地逆转像癌症这样的疾病——除非我们能找到一种提高我们振动频率的方法。（图
    11）


    ![](img/part2_chapter13_image002.jpg)


    图 11：时间与治愈


    通过放弃受害者原型，并通过激进宽恕的过程将我们的能量带回到当下，我们可能能够足够的振动，以至少创造出更快的（即使不是立即）疾病逆转。如果我们还结合其他提高振动的方法（如祈祷和冥想），我们会增加机会。


    这里有一个例子。一位参加过我们一次营会的女性曾做过几次卵巢癌手术，医生最近告诉她最多只能活三个月。她当时感到很抑郁，生命力所剩无几。她说她来参加营会是因为教会的人为她集了钱，所以她觉得有义务这样做。我们对她进行了引导，在第三天她获得了一次奇的突破，联系到了她在两岁半时发生的一个事件，那个事件让她认为自己完全没有价值。她释放了围绕该问题的大量情绪，并为自己无数次创造证明自己毫无价值的生活而哀悼。在那之后，她的生命力增加了。当她离开时，她充满了斗志去寻找一种帮助她战胜癌症和医生预后的替代方案。如果她选择的方法在我国是非法的，她甚至愿意去国外旅行。（许多治疗方法在美国是非法的。）


    在疯狂寻找最让她感触的治疗方法两周后，她突然意识到她的治愈将通过祈祷来实现。于是她去了纽约州北部的一个地方，与一对提供祈祷周的夫妇一起工作：她字面上真的祈祷了一周。回来后，她去看了肿瘤医生，医生检查了她并说：“我不懂如何解释，但你的身体里完全没有癌症了。我可以说是自发性缓解，但我相信上帝，我不愿意以任何其他方式描述它，只能说是奇迹。”


    这位女性是一个完美的例子，说明通过祈祷提高振动如何在几天内而非多年逆转了物理状况。我相信激进宽恕也会做同样的事。


    ### 西雅图宽恕研究


    '
- fmt: '

    An interesting but as yet unpublished study on forgiveness and time was conducted
    at Seattle University. It involved a series of interviews with people who, by
    their own assessment, had been victimized. The researchers wanted to see how that
    perception changed over time. Preliminary findings showed that serenity, which
    was described as “having no resentment left,” came `not` through any act of forgiveness
    but as a sudden `discovery` that the participants had indeed forgiven. All reported
    that the more they tried to forgive, the harder it became and the more resentment
    they felt. They stopped trying to forgive and `just let go.`. After varying intervals
    of time came the surprising realization that they no longer harbored resentment
    and that they had, in fact, forgiven.


    A later and even more interesting discovery revealed that the realization that
    they had forgiven was preceded by being forgiven themselves. (Who forgave them
    and for what was irrelevant.) What this certainly points to is that forgiveness
    is a shift in energy. Having experienced being forgiven—a release of stuck energy—they
    were able to release their own stuck energy with someone else virtually automatically.


    This study not only reinforces the insight that forgiveness cannot be willed but
    also shows that forgiveness happens as an internal transformation through a combination
    of surrendering one’s attachment to resentment and accepting forgiveness for oneself.
    The study’s results also underscore the value of step nine in the twelve-step
    process used successfully by millions of people in Alcoholics Anonymous and other
    similar programs. Step nine asks that we seek to make amends to those we have
    harmed and that we ask them for forgiveness. When we find that we have in fact
    been forgiven, this frees our own energy to forgive not only others but ourselves
    as well.


    Some might argue that the Seattle study illustrates the slowness of the forgiveness
    process and shows that forgiveness would offer a rather ineffective method for
    curing a disease such as cancer. In many cases, it took people decades to discover
    that they had forgiven.


    The important distinction to make, however, is that the study did not distinguish
    between Radical Forgiveness and traditional forgiveness. What it described was
    definitely the latter. I would be willing to wager that, if the subject group
    had been divided into two—one group with insight into Radical Forgiveness and
    the other left basically to use traditional forgiveness—the group with the additional
    insight would have reached the state of serenity infinitely more quickly than
    the other group.


    I am not claiming that Radical Forgiveness always occurs instantaneously either—though
    I have to say I have seen it happen instantaneously many times now. Neither can
    it be claimed as a definitive cure for cancer. However, it certainly should be
    an integral part of any treatment protocol. Sometimes people even delay medical
    treatment to see if Radical Forgiveness creates enough of an effect to make such
    drastic intervention unnecessary. That would be unthinkable with traditional forgiveness.


    ### Mary’s Story


    My friend Mary, a co-facilitator at many of my retreats, denied for months that
    something was terribly wrong with her health. When she could not ignore the obvious
    any longer, she went to a doctor who told her she had stage three colon cancer—they
    wanted to operate immediately. She asked them for thirty days, and they reluctantly
    agreed. She went to a little cabin in the mountains and stayed there for a week,
    meditating and working on forgiving all the people in her life, including herself,
    using Radical Forgiveness. She fasted, prayed, cried, and literally went through
    the dark night of the soul. She came back home and worked with several practitioners
    to cleanse her body and strengthen her immune system.


    At the end of the thirty-day period, the surgery was performed. Afterward, her
    doctor wanted to know what she had done, for the cancer had all but disappeared
    and, instead of the radical surgery they had said would be necessary, removal
    of the cancer required only minor intervention.


    In cases where the disease is so advanced or aggressive as to require immediate
    medical intervention, surgery, chemotherapy, or radiation buy time. But time for
    what?


    Remember: there is no cure for cancer. Consequently, no matter what the medical
    treatment, doctors have an unspoken expectation that a recurrence is almost a
    foregone conclusion and just a question of time. I prefer to look at the treatment,
    assuming the patient survives it, as a way to buy the time to do the Radical Forgiveness
    work that could actually prevent any recurrence.


    Radical Forgiveness provides one of the best preventive measures available. It
    clears the energy in the subtle bodies long before it becomes a block in the physical
    body. When I help people resolve forgiveness issues by using Radical Forgiveness
    Therapy, as I did with my sister, Jill, I believe I am not only helping them heal
    a wound in their subtle body but also helping them prevent disease occurring in
    the physical body. I am convinced that if we keep the energy flowing in our bodies
    as it was designed to do, we will never get sick. Though I no longer do the five-day
    cancer retreats I used to, I nevertheless regard the Radical Forgiveness workshops
    that I now present all around the world as cancer prevention workshops.


    Of course, adequate exercise, good diet, and other such common-sense practices
    help in this regard as well. But keeping our energy bodies clear of emotional
    dross and toxicity is of primary importance to good health and healing. Unfortunately,
    this aspect of healing gets the least media attention, despite the fact that,
    in America alone, one out of every five people takes an antidepressant drug such
    as `Prozac`. Bearing in mind that depression always precedes cancer, we have to
    wonder whether it is mere coincidence that one out of five Americans also dies
    of cancer.


    I am often asked why I work with people who have cancer. I have had no personal
    experience with it, and I knew little about it from a medical standpoint when
    I began offering five-day cancer retreats for emotional and spiritual healing
    in the early 1990s.


    It was only after doing this work for some time that I realized why I was attracted
    to it: it was because it linked up with my interest in forgiveness. This insight
    occurred when I discovered that nearly all cancer patients, besides having a lifetime
    habit of suppressing and repressing emotions, are known to share a marked inability
    to forgive.


    I now believe that lack of forgiveness contributes to, and may even be a principal
    cause of, most cancers. Therefore, my healing work with cancer patients, and with
    those who want to prevent the disease from arising or recurring in their bodies,
    now centers almost entirely on Radical Forgiveness Therapy.


    ### Jane’s Story


    Jane came to one of our five-day retreats in the north Georgia mountains. She
    had had a mastectomy and was awaiting a bone marrow transplant. After the retreat,
    she came to me once a week for hypnotherapy and individual coaching. On the second
    visit, she arrived in a distressed state, because a routine `MRI` scan had that
    day discovered minute spots of cancer in her brain. While this new cancer was
    upsetting enough by itself, its appearance was also liable to spoil her chances
    of a transplant. The doctors planned to give her chemotherapy to try to arrest
    the cancer’s progress, but they were surprised at her condition, because normally
    metastasis proceeds from the breast to the liver and then to the brain; very rarely
    does it move directly from the breast to brain. To me, this seemed worthy of some
    exploration.

