    Jane was an attractive woman in her early forties who had not been involved in
    a romantic relationship for about seven years. She had a boyfriend of sorts, but
    she described the relationship as not much more than a close friendship. In fact,
    she said, she looked upon him as her buddy, even though she had sex with him from
    time to time. As I probed further into her relationship situation, she got in
    touch with some incredible grief she still felt around a relationship she had
    ended a number of years earlier. This eight-year relationship had been extremely
    passionate and intense, and Jane clearly worshipped the man. Four years into the
    relationship, which she believed was soon to be consummated in marriage, she discovered
    that he was married already and had children. He had no intention of leaving his
    wife. Jane was devastated but could not stop seeing him. It took her another four
    extremely painful years to extricate herself from the relationship.


    It was clear to me that as a result of this failed relationship, Jane had shut
    down her emotions completely and would no longer allow herself to get involved
    so deeply with a man. Neither was I surprised that she had suffered a broken heart;
    most women with breast cancer have a broken heart somewhere in their history.
    (The breast is the organ of nurturance and is in the proximity of, and related
    to, the heart.)


    As she was going out the door at the end of our session, Jane said in a whisper,
    “I put him in the attic.”


    I stopped in my tracks. “What do you mean?” I asked.


    “Well, everything I had accumulated over the years that had any connection to
    this man, or that would remind me of him, I stuffed in a box. I then put the box
    up in the attic. It’s still there. I haven’t touched it since.”


    I told her to sit down and tell me that again. I had her repeat the same thing
    three times. Suddenly, she saw the connection between the box in the attic that
    represented her broken love affair and her brain cancer. “Oh, my God,” she said.
    “That’s him in my head, isn’t it? He’s in my attic.”


    I told her to go home, go up into the attic, take down the box, and bring it with
    her to her next session. We would go through it piece by piece together. We planned
    for her to tell me the story behind each item until we had exorcised his energy
    and released the pain she had repressed. Jane understood that this might be the
    key to her healing and was very excited. Tragically, she had a seizure the next
    day and was taken back to the hospital. She died a month later without ever touching
    the box in the attic. Looking at the box’s contents and feeling the pain of her
    lost love may have been just too much for her to bear, and I feel that, at some
    level, she may have decided to let go of life rather than face that pain.


