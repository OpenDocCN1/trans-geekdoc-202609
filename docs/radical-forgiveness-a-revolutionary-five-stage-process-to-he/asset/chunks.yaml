  trans: '


    -   传统的宽恕在处于极高振动时，承认了灵性洞察的深刻性：我们都是不完美的，而不完美恰恰是人性的本质。当我们用这种眼光看待犯错者时，我们可以以极其谦卑、宽容和慈悲的心态：“若非上帝的恩典，我亦会如此。”我们承认自己也完全有能力做出被控控者所做的任何行为。如果我们了解自己的阴影自我，我们就知道我们内心都潜藏着伤害、杀害、强奸、虐待儿童以及消灭
    1300 万人的潜力。这种认知让我们能够唤起谦卑，让我们不仅对被控者，也对自己变得善良和仁慈，因为在他们身上，我们看到了自己内在的不完美和自己的阴影。这种认可使我们非常接近于收回那些我们投射出的东西——这是“激进宽恕”的关键第一步。


    *激进宽恕也充满爱地看到人类中固有的不完美，但它从不完美中看到了完美。*


    -   激进宽恕承认宽恕无法通过意志或赐予。我们必须乐意宽恕，并将局面交给我们的更高力量。任何形式的宽恕并非源于努力，而是源于对体验它的敞开放。


    ## 宽不是宽恕


    在我们讨论定义时，也应该清楚什么*不是*宽恕。很多被当作宽恕的行为，我称为“伪宽恕”。


    伪宽恕缺乏真实性，通常只是包装良好的判断和隐藏的怨恨，伪装成宽恕的样子。宽恕的意愿并不存在，而且非但没有减轻受害者意识，反而扩大了它。然而，这与传统宽恕之间的界限可能并不容易确定。


    ### 伪宽恕的示例


    以下示例按清晰度从高到低列出，从明显虚假的开始，到接近传统宽恕的示例结束。


    | 描述 |

    | :--- |

    | • **出于责任感而宽恕。** 这完全不真实，但我们中许多人是从这种心态宽恕的。我们认为宽恕是正确的事，甚至是一种灵性的行为。我们认为我们*应该*宽恕。
    |

    | • **出于正义感而宽恕。** 这是宽恕的对立面。如果你因为认为自己正确而他们很愚蠢，或者因为怜悯他们而宽恕他们，那是纯粹的傲慢。 |

    | • **赐予宽恕或赦免。** 这是纯粹的自我欺骗。我们没有力量向任何人赐予宽恕。当我们赐予宽恕时，我们是在扮演上帝。宽恕不是我们控制的东西——它只是在我们乐意时自然会发生。
    |

    | • **假装宽恕。** 当我们实际上生气时假装不生气，这提供的不是宽恕的机会，而是否认自己愤怒的机会。这代表了一种自我否定的形式。当我们这样做时，就允许他人像谚语所说的门垫一样对待我们。这种行为通常源于对不宽恕、对被遗弃的恐惧，或者认为表达愤怒是不可接受的。
    |

    | • **宽之不忘。** 这仅仅制造了否认。宽恕绝非简单的擦除。。智者宽恕但*从不*忘记。他们努力欣赏情境中固有的礼物，并记住它教给他们的教训。 |

    | • **找借口。** 当我们宽恕时，往往会带着解释或为宽恕的对象找借口。例如，我们可能会对父母说：“我父亲虐待我是因为他也被自己的父母虐待过。他已经尽力了。”宽恕应该是关于放下过去并拒绝被过去控制。如果一个解释能帮助某人放下，在某种程度上是有帮助的，尽管解释并没有消除“发生过错误”这一事实。因此，它顶多只能是传统的宽恕。它也具有某种正义感，可能会掩盖愤怒。另一方面，理解某人为何那样做并对他们产生同理心，会使我们重新回到自身的不完美中，并开启慈悲和仁慈的大门——这通向传统宽恕的更高振动，但仍未达到激进宽恕。
    |

    | • **宽恕人但不纵容行为。** 这种很大程度上是理性的方法可能只是伪装成宽恕，因为仍然带有判断色彩和自以为是。它在实践和语义上也存在问题。你如何将杀手本人与杀人行为分开？
    |


    最后这引发了问责和责任的问题，这两者都是下一章的主题。


    ## 问责


    必须明确的是，激进宽恕并没有减轻我们在这个世界的责任。我们是灵性生物，在一个受物理法则和人为法则支配的世界中拥有人类体验，因此我们必然要对自己所有的行为负责。这是人类体验中无法避免的内在部分。


    换句话说，当我们制造了伤害他人的情况时，我们必须接受在`人类世界`（World of Humanity）中，此类行为是有后果的。虽然从激进宽恕的角度来看，我们会说局面中的所有参与方都在得到他们需要的，但事实也是，经历后果（如入狱、罚款、羞辱或谴责）都是课程的一部分，并且在那个灵性语境下是完美的。


    我经常被问及，在某人伤害了我们、且正常反应是通过法院寻求救济的情况下，一个宽恕的人是否真的会采取那种行动。答案是肯定的。我们生活在`人类世界`（World
    of Humanity）中，这个世界在`因果律`（Law of Cause and Effect）的范围内运行。这规定每一个行为都有相应的等量反作用。因此，我们很早就学会了行为是有后果的。如果我们不必对自己的行为负责，宽恕将变得毫无意义且毫无价值。如果没有要求我们承担责任，似乎无论我们做什么，都没有人在意。这种行动或态度完全提供不了任何慈悲。例如，孩子们总是将运用得当的*合理的*父母教训解读为关心和爱。相反，他们将父母给予的完全许可解读为不关心。


    然而，我们对他人的行为是出于正义的愤慨、委屈、复仇和怨恨，还是基于公平、自由和尊重他人的原则真心地渴望平衡尺度，这决定了我们宽恕的程度。正义感和复仇会降低我们的振动。相反，维护原则和正直行事会提高我们的振动。振动越高，我们就越接近神圣真理，也就越能够进行激进的宽恕。


