    Of course, as with all missions, it may not look anything like a healing opportunity.
    It may show up as war or famine or maybe a natural disaster. But when we open
    to the possibility that a group soul healing is being offered and that the whole
    thing is being orchestrated by `Spirit` for the greater good of all souls involved,
    we begin to see things very differently. Let me give you some seemingly outrageous
    examples.


    | Number | Description |

    | :--- | :--- |

    | 1 | Suppose the soul who came in to become Adolf Hitler did so with a mission
    to transform the victim consciousness of the Jewish race and the superiority consciousness
    of the German race. |

    | 2 | What if Saddam Hussein came in to help American consciousness transform
    its guilt about slavery and the terrible abuse of its own people? (See my book
    `A Radical Incarnation,` which explores this possibility.) |

    | 3 | Suppose Slobodan Milošević came in to enable America to project onto him
    the self-hatred it feels about the ethnic cleansing it has perpetrated against
    the Native American people. |

    | 4 | What if the Chinese government had to invade Tibet so the Dalai Lama would
    be forced to travel the world and spread his beautiful message beyond the borders
    of his country? |

    | 5 | Suppose the soul that was Princess Diana chose to die in exactly the way
    she did, and when she did, in order to open the heart chakra of England. |


    In the first edition of this book Princess Diana’s story appeared as the `Epilogue`.
    That was because she died within a very few days of my going to press, so it had
    to go in almost as an afterthought. In this new edition, I am including it in
    this chapter since it is so pertinent to the issue of mission.


    The event was still very fresh in my mind when I first wrote about Diana’s death.
    The funeral had only just taken place and the emotional outpouring was still continuing.
    I was still very much in the experience of it all, and I think that comes across
    in the piece. For that reason, I have decided not to alter the original version
    in any way so that you may experience the `satori` vicariously through my own
    experience of it.


    ## Good-bye England’s Rose


    I began this book with a story about my sister, Jill. Its purpose was to illustrate
    how a seemingly desperate situation can be transformed when we approach it from
    the standpoint of `Radical Forgiveness`.


    Just a few days before going to press, fate handed me an opportunity to end the
    book with a story that was equally instructive and open to a `Radical Forgiveness`
    perspective. Unlike the one about Jill, this story was one with which virtually
    everyone in the world was familiar, as well as deeply involved emotionally. I
    refer of course to the story of Princess Diana, who made her unexpected transition
    in the early hours of Sunday, August 31, 1997.


    The drama began for me when my lifetime friend Peter Jollyman woke me with a phone
    call from England. For him it was around midday, but for me, in Atlanta, it was
    still early and I had not yet seen a newspaper or listened to the radio.


    “Have you heard about the accident?” he asked.


    “What accident?” I replied, still in a stupor but aware enough to realize this
    had to be serious for him to be calling.


    “Princess Di was killed last night in a car crash in Paris. She was being chased
    by paparazzi. Her car spun out of control and hit a concrete post. She and Dodi
    were killed.”


    I noticed a perfunctory pang of remorse pass through me as I listened to the details
    as best he knew them at the time, but I can’t say that it lasted more than a few
    moments. I tried to sound suitably shocked, but I really felt somewhat ambivalent
    about it.


    Lots of people died in the last twenty-four hours, I thought after I put the phone
    down. Why would her death be any more, or any less, tragic than anyone else’s?
    It was her time to go, and that’s about all there is to it. Sad for her two boys
    though, of course. With that, I went downstairs to make tea and fix breakfast.


    Then I turned on the TV and, from that moment on, was gradually drawn into and
    involved with what was to become, in the days culminating in her funeral on Saturday
    morning, a roller coaster of emotion.


    As the days went by, I realized that something quite extraordinary was going on.
    The reaction to Princess Diana’s death, not only in England but throughout the
    world, was truly phenomenal. As I saw my countrymen on the TV in heartfelt pain,
    crying and grieving in public—something English people simply do not do ordinarily—I
    found myself feeling the same emotions and crying with them. I was shocked to
    realize that I was hurting too. Somehow this woman, whom I had never met or thought
    much about, especially during the thirteen years I had lived in the U.S., had
    touched me deeply. I felt the loss profoundly, and I was very surprised.


    I began to pay attention and to wonder what was really happening here. Something
    of extraordinarily deep significance was occurring, and I began an inner search
    to find the message and the meaning in it. Diana’s death clearly had meaning far
    beyond the apparent circumstances in which it occurred, dramatic as they appeared
    to be. Some higher purpose was being played out here, I thought.


    Then, on Wednesday, it hit me. As I watched the scenes from England and experienced
    the great outpouring of emotion from people not in the least renowned for showing
    their emotions, especially in the open, I suddenly realized what Diana’s spiritual
    mission had been. The overarching purpose of her incarnation had been to open
    the heart chakra of Great Britain and, by doing so, greatly accelerate the spiritual
    evolution of the British people, no less. I had no doubt whatsoever that she had
    achieved exactly that.


    No one who watched the events of that week could ever doubt that she had single-handedly
    transformed the country—and indeed, much of the world—at the heart level. Only
    a very few people in all of history come to mind as having such an effect on the
    world purely through expression of love energy: `Gandhi`, `Martin King Jr.`, and
    `Nelson Mandela` perhaps; `Mother Teresa` and `Jesus Christ`, certainly. (No wonder
    the Queen of England bowed her head to Diana’s coffin—something never witnessed.)


    While in terms of human achievement and spiritual example in life, any comparison
    with `Mother Teresa` would be unfair. It is nevertheless interesting to note that
    the death of Mother Teresa, whose life and work, in most people’s eyes, brought
    her close to sainthood in her lifetime, did not take the spotlight off Diana for
    even a moment. That two women whose lives so deeply touched the world through
    authentic love should make their transitions within days of each other has enormous
    spiritual significance.


    Even though the British people had been through two wars this century, suffering
    and grieving enormous losses, they had come through it all with their legendary
    sense of humor and proverbial stiff upper lip intact—but not, I think it is fair
    to say, with an open heart. That had to wait, not only for the coming of a people’s
    princess but for her divinely planned and, to us at least, untimely and tragic
    death.


    Since then, commentators have tried in vain to explain her effect on the world
    in terms of our fixation on, and willingness to almost deify, celebrities we know
    only through the media. Jonathan Alter, in `Newsweek,` came closer than most by
    referring to what Richard Sennett, in `The Fall of Public Man,` called the ideology
    of intimacy, in which people “seek to find personal meaning in impersonal situations.”
    It is true that people did not know her personally, and to that extent it remains
    an impersonal situation. Yet she transcended those limitations imposed by time
    and space and somehow touched everyone’s heart very deeply in a way that cannot
    be easily explained.

