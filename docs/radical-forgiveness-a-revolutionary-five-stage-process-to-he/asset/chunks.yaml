    这场研讨会定在英国西部的一座修道院举行，巧的是，大多数参与者都是灵性疗愈者。会友和我我到达修道院时，发现周围没有人，于是我们走进去重新布置了家具。我开始研讨会，并解释说：生命本质上是为了我们灵性成长的情感体验，而这次研讨会的设计目的是帮助我们接触那些被埋藏的情绪。呃，你可能会以为我是在告诉他们必须绕着火光裸跳舞之类的！以下是他们所有人的话的本质：“噢，不。我们是灵性的人。我们已经超越了情感。我们完全不相信自己的情绪。如果我们产生了情绪，我们只管请求灵性把它们带走，然后直接进入平静。我们不相信这种工作。”


    研讨会进行到大约一小时后，我知道自己陷入了灾难。那种感觉就像在糖糖蜜中游泳。我完全无法进展，而且他们绝不会完成这项工作。我感到每一刻心情都变得越来越糟糕，并深信研讨会将会彻底崩盘。


    就在这时，灵性干预了。一个穿着全套僧袍的年轻僧侣冲进房间，要求知道是谁在负责。当我说是我时，他要求我跟他一起出去。他想和我“谈谈”，但我能看出他正怒着火；他满脸通红，气得直涨。我说我正在主持一场研讨会，结束后我会去找他。


    他非常不悦地离开了，但几乎立刻就回来了，显然被气坏了。他指着我，手指弯曲仿佛示意让我靠近他，大吼道：“我现在就要见你！”


    正是那个手指的手势触动了我。过去一小时所有的挫败感和紧张感涌上心头。我转向我的学生，用非常威胁的语气说：“看着吧！”我大步走向那个脸通红、气冲冲的僧侣，手指抵近他的脸，明确地告诉他：“我不在乎你穿什么，不在乎那些衣服代表什么——你不能闯进我的研讨会，然后像对待某个犯了你的错小学生一样把我勾出去。我会在准备好——且仅在准备好之后——出来和你谈。事实上，我会在中午十二点正好结束。如果你有什么话对我说，最好在那个时间准时在大厅外等我。到时候我们再谈。现在，离开我的房间！”


    我大步回到教室；学生们整个人呆坐在那里，目瞪口呆，嘴巴大张。（你可不能那样对待宗教人物！）“好了，”我说，逐个指着他们每一个人，“我想知道你们现在、此时此刻感受到了什么，而且别跟我扯那些鬼话，什么说什么你们已经把情绪交给了紫色火焰并且正感到很平静了，因为显而易见你们并没有。你们感受到了什么？面对现实吧！”


    呃，正如你所料的，他们陷入了强烈的情绪中，我们开始讨论这些情绪。在僧侣的帮助下，我打破了他们承认情感的防御墙，让他们承认人类拥有情感，而且情感是可以接受的。


    ### 我们渴望情感体验


    作为人类，我们被赋予了感受情绪的能力。事实上，有人说我们之所以选择人类体验，唯一的原因是地球是唯一带有情感能量的行星。因此，当我们不对自己体验这些情绪，而是压抑它们时，我们的灵魂就会创造出一些情境，让我们字面上被迫去感受它们。这意味着，产生波动的全部意义可能在于我们灵魂渴望提供一个感受被压抑情绪的机会。既然如此，仅仅允许自己拥有那种感觉可能就能让能量流过我们，让所谓的问题随之消失。


    但并非所有情况都能如此轻易化。当我们试图应对根深蒂固的问题以及看似无法原谅的回忆时，例如性侵待、强奸或肢体虐待，仅仅体验我们的情绪不足以达到对他人产生无条件之爱的程度。充分感受情绪只是“假装直到成真”（faking
    it until we make it）的第一步，而且这一步绝对不能跳过。


    我并不是说情感工作不会从在情绪被感知和表达之前可能发生的感知转变所获得的洞察中获益。它确实会。但反过过来并不成立；如果底层的压抑情感不得到释放，“激进原谅”（Radical
    Forgiveness）所需的感知转变将不会发生。


    通常，当我们产生原谅某人或某事的愿望时，我们曾在某个时候对他们或它产生过愤怒。愤怒实际上是一种次级情绪。在愤怒之下隐藏着初级的情感痛苦，如自尊受损、羞愧、挫败、悲伤、恐怖或恐惧。愤怒代表了从压抑那种痛苦中发出的运动能量。不让自己的愤怒流动好比试图封住火山。它总有一天会喷爆发的！


    “激进原谅”的第一、二阶段要求我们不仅接触愤怒，还要接触底层的情绪。这意味着感受它——而不是谈论它、分析它或给它贴标签，而是去体验它！


    #### **爱你的愤怒**


