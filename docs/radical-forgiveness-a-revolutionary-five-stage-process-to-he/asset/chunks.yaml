    As Jill became more composed once again, she continued, “I remember a particular
    day at your house. Lorraine was probably about four or five years old. Mum and
    Dad were visiting from Leicester, and we all came to your house. I saw your Lorraine
    take Dad’s hand.” She said, “Come on, Granddad. Let me show you the garden and
    all my flowers.” He was like putty in her hands. She led him everywhere and talked
    and talked and talked, showing him all the flowers. She enchanted him. I watched
    them through the window the whole time. When they came back in, he put her on
    his lap and was as playful and joyful as I had ever seen him.


    “I was devastated. So he is able to love after all, I thought. If he can love
    Lorraine, then why not me?” The last few words came out as a whisper followed
    by deep tears of grief and sadness, tears held in for all those years.


    I figured we had done enough for the time being and suggested we make tea. (Well,
    we’re English! We always make tea, no matter what.)


    Interpreting Jill’s story from a Radical Forgiveness standpoint, I easily saw
    that Jeff’s outwardly strange behavior was unconsciously designed to support Jill
    in healing her unresolved relationship with her father. If she could see this
    and recognize the perfection in Jeff’s behavior, she could heal her pain and Jeff’s
    behavior would almost certainly stop. However, I wasn’t sure how to explain this
    to Jill in a way she could understand at that point in time. Luckily, I didn’t
    have to try. She stumbled on the obvious connection by herself.


    Later that day she asked me, “Colin, don’t you think it’s odd that Jeff’s daughter
    and your daughter both have the same name? Come to think of it, both of them are
    blonde and firstborn. Isn’t that a strange coincidence! Do you think there’s a
    connection?”


    I laughed and replied, “Absolutely. It’s the key to understanding this whole situation.”


    She looked at me long and hard. “What do you mean?”


    “Work it out for yourself,” I replied. “What other similarities do you see between
    that situation with Dad and my Lorraine and your current situation?”


    “Well, let’s see. Both girls have the same name. Both of them were getting what
    I don’t seem to be able to get from the men in my life.”


    “And what is that?” I inquired.


    “Love,” she said in a whisper.


    “Go on,” I urged gently.


    “It seems that your Lorraine was able to get the love from Dad that I couldn’t.
    And Jeff’s daughter Lorraine gets all the love she wants from her dad, but at
    my expense. Oh, my God!” she exclaimed. She really was beginning to understand
    now.


    “But why?” she asked in a panic. “I don’t understand why. It’s a bit frightening!
    What the heck’s going on?”


    It was time to put the pieces together for her. “Look, Jill,” I said. “Let me
    explain how this works. This happens to be a perfect example of what I was talking
    about earlier when I said that beneath the drama we call life lies a whole different
    reality. Believe me, there’s nothing to be frightened about. When you see how
    this works, you will feel more trust, more security, and more peace than you ever
    thought possible. You’ll realize how well we are being supported by the Universe
    or God, whatever you want to call it, every moment of every day no matter how
    bad any given situation seems at the time.” I tried to be as reassuring as I could.


    “Looked at from a spiritual standpoint, our discomfort in any given situation
    provides a signal that we are out of alignment with spiritual law and are being
    given an opportunity to heal something. It may be some original pain or perhaps
    a toxic belief that stops us from becoming our true selves. We don’t often see
    it from this perspective, however. Rather, we judge the situation and blame others
    for what is happening, which prevents us from seeing the message or understanding
    the lesson. This prevents us from healing. If we don’t heal whatever needs to
    be healed, we must create more discomfort until we are literally forced to ask,
    ‘What is going on here?’ Sometimes the message has to become very loud, or the
    pain extremely intense, before we pay attention. A life-threatening illness, for
    example, provides a loud message. Yet, even when facing death, some people don’t
    get the connection between what is happening in their lives and the opportunity
    for healing that it provides.


    “In your case, what has come up to be healed this time is your original pain around
    your father and the fact that he never showed you love. That is what all your
    current pain and discomfort are about. This particular pain has arisen many times
    before in different situations, but, because you didn’t recognize the opportunity
    before, it never got healed. That’s why having yet another opportunity to look
    at and heal this issue is a gift!”


    “A gift?” Jill questioned. “You mean it’s a gift because there’s a message in
    it for me? One that I might have gotten a long time ago if I’d been able to see
    it?”


    “Yes. Had you seen it then, you would have had less discomfort and you wouldn’t
    be going through this now. But no matter—now is fine too. This is perfect, and
    now you won’t have to produce a life-threatening illness to understand this, like
    so many people do. You’re getting it now—you’re beginning to understand and to
    heal.


    “Let me explain to you exactly what happened and how it has affected your life
    up until now,” I said, wanting her to understand clearly the dynamics of her current
    situation.


    “As a little girl, you felt abandoned and unloved by Dad. From a developmental
    standpoint, it is necessary for a young girl to feel loved by her father. Since
    you didn’t feel that love, you concluded that there must something wrong with
    you. You began to really believe you were unlovable and inherently ‘not enough.’
    That belief anchored itself deeply in your subconscious mind and, later, when
    it came to relationships, began to run your life. In other words, as a way of
    mirroring your belief that you are not enough, life has always included situations
    that exhibit to you the fact that you were indeed, not enough. Life will always
    prove your beliefs right.


    “When you were a child, the pain of not getting Dad’s love was more than you could
    bear, so you suppressed some of it and repressed a whole lot more. When you suppress
    emotion, you know it’s there, but you stuff it down. Repressed emotion, on the
    other hand, gets buried so deeply in the subconscious mind that you lose awareness
    of it.


    “Later, when you began to realize that your father was not a naturally loving
    man and probably couldn’t love anyone, you began to somewhat rehabilitate or heal
    yourself from the effects of feeling unloved by him. You probably released some
    of the suppressed pain and maybe began to give up some part of the belief that
    you were unlovable. After all, if he couldn’t love anyone, maybe it wasn’t your
    fault that he didn’t love you.


    “Then along came the bombshell that knocked you right back to square one. When
    you observed him loving my Lorraine, that triggered your original belief. You
    said to yourself, ‘My father can love after all, but he doesn’t love me. It is
    obviously my fault. I am not enough for my father, and I will never be enough
    for any man.’ From that point on, you continually created situations in your life
    to support your belief that you are not enough.”


    “How have I done that?” Jill interrupted. “I don’t see how I have created myself
    not being enough in my life.”


    “How was your relationship with Henry?” She had been married to Henry, her first
    husband and the father of her four children, for fifteen years.


    “Not bad in many respects, but he was such a womanizer. Always looking for opportunities
    to make out with other women. I hated that.”

