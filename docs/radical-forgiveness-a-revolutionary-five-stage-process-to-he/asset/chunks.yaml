  raw: 'But the truly amazing gift that it offers humanity lies in its capacity to
    serve as a bridge: a bridge that enables us to move freely and easily, without
    knowing it, between third-dimensional reality and fourth-dimensional reality.
    A bridge that enables us to practice operating from the love vibration of the
    latter while existing physically in the former. Such a bridge is necessary because
    even though deep down we know that fourth-dimensional reality is based on love,
    peace, oneness, and joy—and we yearn desperately to go there—we are terrified
    at the thought of letting go of what is all so familiar. This is true even though
    the current reality is one based on fear, separation, and pain. The doubt is real
    and deep-seated—what if I jump into the void and find that the other reality doesn’t
    exist after all?


    So, while the technology of Radical Forgiveness ostensibly appears to be about
    helping us forgive ourselves and others, its real purpose is to give us a chance
    to *practice* being in that other reality while being blissfully ignorant of our
    actual presence there. It lulls us into thinking that we are simply doing a forgiveness
    worksheet, or one of the other processes, when in fact we are—without realizing
    it—actually stepping across that chasm and operating in fourth-dimensional reality.
    By the use of “smoke and mirrors” and the blessing of ignorance, our ego happily
    goes along with the process.


