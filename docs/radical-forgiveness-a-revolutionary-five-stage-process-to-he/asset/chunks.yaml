    \ and another opportunity to heal. As it was, she took this opportunity to heal\
    \ and stayed in the relationship.\n\nAt the time of writing this second edition,\
    \ many years after that crisis, they remain together and are very happily married.\
    \ Like every other couple, they continue to create dramas in their lives—but they\
    \ know now how to see them as healing opportunities and move through them quickly\
    \ and with grace.\n\n*Note: The time-line diagram in FIGURE 1 depicts Jill’s story\
    \ as a graphic. She found this helped her greatly to see how the original pain\
    \ of not feeling loved by her father had led to a belief that she was not enough\
    \ and how, in turn, that belief had played out in her life. You might do the same\
    \ for yourself if you think you have a similar story running your life.* (FIGURE\
    \ 1)\n\n![](Images/part1_chapter1_image001.jpg)  \n\nFIGURE 1: Jill's Healing\
    \ Journey\n\n## part two\n\n# Conversations on Radical Forgiveness\n\n#### 2\n\
    \n### Underlying Assumptions\n\nSince all theories are based upon certain assumptions,\
    \ it is important to have an understanding of the spiritual assumptions underlying\
    \ the theory and practice of Radical Forgiveness. Before looking at these, though,\
    \ it is worth noting that even the most widely accepted scientific theories are\
    \ often based on assumptions for which there is very little hard evidence."
