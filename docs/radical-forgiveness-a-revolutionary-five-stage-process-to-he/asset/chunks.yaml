    \ energetically. Thus they remain totally reliant upon chemical medicine for their\
    \ healing. (FIGURE 12)\n\n![](Images/part2_chapter13_image003.jpg)  \n\nFigure\
    \ 12: Why People Don’t Heal\n\nMyss argues that if it takes 60 to 70 percent of\
    \ the average person’s precious life force to manage the negative experiences\
    \ of his or her childhood, adolescence, and earlier years of adulthood, as well\
    \ as to hold on to the losses, disappointments, and resentments of the past, and\
    \ another 10 percent to worry about, plan for, and try to control the future.\
    \ That leaves precious little energy for the present moment—or for healing. (It\
    \ is important to note that it does not drain our energy to maintain positive\
    \ memories or even negative memories if they have been processed and forgiven.)\n\
    \nLife has its own way of bringing us—and our energy—into present time. Often\
    \ it occurs through trauma. When we find ourselves in the midst of a disaster,\
    \ have an unexpected accident, or discover that our lives are suddenly in danger,\
    \ we become very focused on the present moment. We bring all our consciousness\
    \ into the present instinctively, and suddenly the past does not matter, nor does\
    \ the future. Only this moment exists. The power of such currently focused energy\
    \ is demonstrated when a mother, seeing her child trapped under a car, suddenly\
    \ becomes able to lift the car off the ground so her child can be rescued. Acts\
    \ of incredible bravery and courage also happen when energy becomes focused in\
    \ the moment, because fear only occurs when we bring the past into the future.\
    \ When we are truly in the moment we are absolutely fearless, because we have\
    \ no awareness of past or future.\n\nRadical Forgiveness helps us to be in present\
    \ time because we do not forgive radically by going back into the past. We simply\
    \ forgive the person who happens to be mirroring our projection right here in\
    \ the present. That is the beauty of Radical Forgiveness. It is true that sometimes\
    \ the past connection will be so clear that, as in Jill’s case, it illuminates\
    \ the current situation. But the focus is still on the perfection of what is happening\
    \ *in the now.*"
