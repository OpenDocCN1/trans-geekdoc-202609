    Using the worksheet method, the integration comes through writing the statements
    and then reading them out loud. Using the `13 Steps`, it comes through making
    the verbal affirmation to see the perfection. With the ceremony (see Further Resources),
    the act of walking across the circle and saying something of an affirmative nature
    to someone else coming in the other direction is what accomplishes integration.
    Ritual, ceremony, and, of course, music are all used to integrate the shift in
    perception that is Radical Forgiveness.


    These five stages don’t necessarily occur in just this order. Very often we move
    through them, or some of them at least, simultaneously, or we keep coming back
    and forth from one stage to another in a kind of circular or spiraling fashion.


    # Radical Forgiveness


    ## 18


    ### Fake It Till You Make It


    Forgiveness is a journey, and it always begins from a place of no forgiveness.
    Getting there can take years or minutes, and we know now that this is a matter
    of choice. Traditional forgiveness takes a long time, but we can do it quickly
    through Radical Forgiveness simply by expressing our `willingness` to see the
    perfection. Each time we do this, it represents an act of faith, a prayer, an
    offering, a humble request for divine assistance. We do this at moments when we
    feel unable to forgive, and in that sense it is a fake-it-till-you-make-it process.


    ### SURRENDERING


    Faking it until you make it really means surrendering to the process, neither
    putting forth effort nor trying to control the results. In the Seattle study mentioned
    in Chapter 13, the more effort the participants put into trying to forgive, the
    more difficult they found it to let go of their hurt and anger. After they stopped
    trying to forgive and control the process, at some point in time forgiveness just
    happened.


    It is true that the energetic shift from anger and blame to forgiveness and responsibility
    happens much more quickly with Radical Forgiveness, because, using the tools given
    here, we can drop the victim consciousness. Consciousness, you will recall from
    Chapter 13, changes time. Nevertheless, even with Radical Forgiveness, we must
    enter the process with no expectation of when an energy shift might happen—even
    though we know that it can happen instantaneously. Exactly when the results begin
    to show up may depend on things we know little about. It might take a while before
    we begin to really feel unconditional acceptance for the person involved and peace
    around the situation, which is how we know when forgiveness is complete. It might
    take many worksheets, for example, to reach this point.


    However, it can be of comfort to many to learn that we do not have to like the
    person to forgive them. Neither do we have to stay in their company if their personality
    and/or their behavior is toxic to us. Radical Forgiveness is a soul-to-soul interaction
    and requires only that we become connected at the soul level. When we feel this
    unconditional love for their soul, our soul joins theirs and we become one.


    ### TAKING THE OPPORTUNITY


    Whenever someone upsets us, we must recognize it as an opportunity to forgive.
    The person upsetting us may be resonating something in us that we need to heal,
    and in that case we can choose to see it as a gift—if we care to shift our perception.
    The situation also may be a replay of an earlier time when someone did something
    similar to us. If so, this current person represents all the people who have ever
    done this to us before. As we forgive this person for the current situation, we
    forgive all others who have ever done this to us before.


    ## FIRST AID FORGIVENESS TOOLS


    The following chapters contain processes that shift energy and offer opportunities
    to change what might be happening. This change constitutes the essence of Radical
    Forgiveness. All of these processes bring us into the present moment by helping
    us retrieve our energy from the past and withdraw it from the future, both of
    which must be done for change to occur.


    Some of the tools included in this section are more appropriate for use at the
    very moment when a situation requiring forgiveness occurs. They help to jerk us
    into an awareness of what may be happening before we get drawn too deeply into
    a drama and go to Victimland. When our buttons get pushed, we easily move straight
    into the defense/attack cycle. Once in this cycle, we find it tough to get out.
    Using these quick tools helps us avoid ever beginning the cycle. `Four Steps to
    Forgiveness` process (see Chapter 22) is one of these. It is easy to remember,
    and you can say it to yourself in the moment.


    Other tools described in the following chapters are designed for use when we are
    in a more reflective state of mind. The `Radical Forgiveness worksheet` works
    wonders in this regard. Use them all as an act of faith in the beginning. The
    payoff will prove incredible in time. Consistent use of these tools helps us to
    find a peace we may never have known was possible.


    # 19


    ### Feeling the Pain


    Feeling the feelings is the second stage in the forgiveness process, and it usually
    arises as a consequence of telling the story. This step requires that we give
    ourselves permission to feel the feelings we have around a given situation—and
    to feel them fully. If we try to forgive using a purely mental process—thus denying
    that we feel angry, sad, or depressed, for example—nothing happens. I have met
    many people, especially those who think of themselves as spiritual, who feel that
    feelings are to be denied and given over to Spirit. That’s known as a `spiritual
    bypass`.


    In 1994, I agreed to do a workshop in England. This was ten years after I had
    immigrated to America, and I had quite forgotten the extent to which English people
    resist feeling their feelings.

