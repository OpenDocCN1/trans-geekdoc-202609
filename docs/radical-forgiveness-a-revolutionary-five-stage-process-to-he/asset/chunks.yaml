  trans: '

    随着吉尔再次镇静下来，她继续说道：“我记得在你家那特别的一天。那时洛莱恩大概只有四五岁。爸爸妈妈从莱西斯特来访我们，我们大家都去了你家。我看到你的洛莱恩拉着爸爸的手。”她说：“来吧，爷爷。我带你看看花园和我我所有的花。”她在她手里就像橡皮泥一样听话。她带着他处处去，说了一遍又一遍说了一遍又一遍，指给他看所有的花。她让他迷住了。我全程都在窗户外看着他们。当他们回到屋内时，他把她放在膝盖上，表现出我以前从未见过的顽皮和快乐。”


    “我当时崩溃了。我想，原来他终究还是会爱的。如果他能爱洛莱恩，为什么不能爱我呢？”最后几个字是低语流出的，随后是深切的悲痛和哀伤之泪，那是积压了多年的泪水。


    我觉得我们目前做得已经足够了，便提议去泡茶。（毕竟，我们是英国人！无论发生什么，我们都会泡茶。）


    从激进宽恕（Radical Forgiveness）的角度来解读吉尔的故事，我很容易看出，杰夫外表奇怪的行为在潜意识里是为了支持吉尔治愈她与父亲之间未得解决的关系。如果她能看到这一点并认可杰夫行为中的完美之处，她就能治愈自己的痛苦，而杰夫的行为几乎会停止。然而，我不确定该如何用吉尔在那个时间点能理解的方式向她解释这一点。幸运的是，我不需要尝试。她自己发现了这显而易见的联系。


    那天晚晚些时候，她问我：“科林，你不觉得杰夫的女儿和你的女儿同名很奇怪吗？仔细起来，她们都是金发而且是长女。这不是很奇怪的巧合吗！你觉得这之间有联系吗？”


    我笑了回答道：“绝对有。这是理解整个局面的关键。”


    她长时间地注视着我。“你什么意思？”


    “你自己去想吧，”我回答道，“和你爸爸的情况、我的洛莱恩以及你的现状之间，还有什么相似之处？”


    “嗯，让看看。两个女孩名字一样。她们都得到了我似乎无法从我生活中的男人那里得到的东西。”


    “那是什么？”我问道。


    “爱，”她低声说道。


    “继续，”我轻轻地催促。


    “似乎你的洛莱恩能够从爸爸那里得到我无法得到的爱。而杰夫的女儿洛莱恩从她爸爸那里得到了她想要的所有爱，但是以我的为代价。噢，天哪！”她惊呼道。她真的开始理解了。


    “但为什么？”她恐慌地问，“我不明白为什么。这有点可怕！这到底是怎么了？”


    是时候为她把碎片拼凑在一起了。“听着，吉尔，”我说。“让我解释一下这是如何运作的。这恰好是我之前提到的一个完美例子，当时我说，在我们所谓的生命戏剧之下，隐藏着一个完全不同的现实。相信我，没有什么好害怕的。当你看到它是如何运作的时，你将感受到比你想象中更多的信任、安全感和和平。你会意识到，宇宙或上帝（无论你如何称呼它）在每天的每一刻都是如何完美地支持着我们，无论当时某个特定的情况看起来多么糟糕。”我试着尽我所能地安抚她。


    “从灵性的角度来看，我们在任何特定情况下的不适提供了一个信号，表明我们与灵性法则失调了，并且获得了一个治愈某些东西的机会。可能是某种原始的痛苦，也许是阻碍我们成为真我的毒性信念。然而，我们并不经常从这个角度来看问题。相反，我们会评判情况，并将发生的事情归咎于他人，这阻止了我们看到信息或理解教训。这阻碍了我们的治愈。如果我们不治愈任何需要治愈的东西，我们就必须创造更多的不适，直到我们被字面上迫问道：‘这里到底是怎么了？’有时，信息必须变得非常响亮，或者痛苦变得极其强烈，我们才会注意。例如，一种危生命的疾病就提供了一个响亮的信息。然而，即使面对死亡，有些人仍然无法意识到生活中正在发生的事情与它所提供的治愈机会之间的联系。”


    “在你的情况下，这次需要治愈的是你对父亲的原始痛苦，以及他从未向你表达过的事实。这就是你目前所有痛苦和不适的根源。这种特定的痛苦以前在不同的情况下出现过很多，但因为你以前没有意识到那个机会，所以它从未被治愈。这就是为什么再次获得观察和治愈这个问题的机会是一份礼物！”


    “礼物？”吉尔质疑道，“你的意思是这是一份礼物是因为里面有给我的信息吗？如果我很久以前就能看到它，我可能早就得到了？”


    “是的。如果你那时就看到它，你的痛苦会少很多，你现在也不必正在经历这些。但没关系——现在也可以。这是完美的，而且现在你不需要像许多人那样通过患上一种危生命的疾病来理解这一点。你现在明白了——你正开始理解并治愈。”


    “让我向你准确解释到底发生了什么，以及它到目前为止如何影响你的生活，”我说，我想让她清楚地理解她现状的动态机制。


    “作为一个女孩，你感到被爸爸抛弃和不被爱。从发展的角度来看，女孩有必要感受到父亲的爱。由于你没有感受到那种爱，你得出结论自己身上有问题。你开始真正相信自己是不值得爱的，而且本质上‘不足’。这种信念深深地植根于你的潜意识中，后来在涉及到关系时，它开始主导你的生活。换句话说，为了镜像你对自己不足的信念，生活总会包含向你展示你确实不足的情况。”


    “当你还是孩子时，得不到爸爸爱的痛苦超过了你的承受能力，所以你压抑了一部分，并压抑了更多。当你压抑情绪时，你知道它在那里，但你把它压下去。另一方面，压抑的情绪被深埋在潜意识中，至于你失去了意识。”


    “后来，当你开始意识到父亲并不是一个天生爱的人，可能无法爱任何人时，你开始在某种程度上从不被他爱的影响中康复。你可能释放了一些压抑的痛苦，也许开始放弃部分关于你是不值得爱的信念。毕竟，如果他无法爱任何人，也许他不爱你并不是你的错。”


    “接着，那枚炸弹出现了，让你直接回到了原点。当你观察到他爱我的洛莱恩时，那触发了你的原始信念。你对自己说：‘爸爸终究还是会爱的，但他不爱我。显然是我的错。我对爸爸来说不够，对任何男人永远不够。’从那时起，你不断在生活中创造情况来支持你对自己不足的信念。”


    “我是怎么做到的？”吉尔打断道，“我不明白如何在生活中创造了自己不足。”


    “你和亨利的关系如何？”她和她的丈夫亨利（她四个孩子的父亲）已经结婚了十五年。


    “在很多方面都不错，但他是个花花公子。总是找机会和其他女性亲热。我讨厌这一点。”


