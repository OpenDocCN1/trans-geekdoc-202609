    \ the Radical Forgiveness worksheet, refer to the notes on the worksheet as signposts\
    \ for your letter, but write it in your own words as best you can (see Chapter\
    \ 21). This may feel like a struggle at first, but persevere. Remember, you will\
    \ have to fake it for a while before you make it.\n\n*None of these letters are\
    \ ever mailed—*it is neither necessary nor desirable to do so. They are designed\
    \ to shift *your* energy, not the energy of the recipient. Venting your feelings,\
    \ rather than projecting them once again onto the other person, serves as the\
    \ objective. Sending the angry letter, in particular, accomplishes nothing whatsoever.\
    \ Doing so will only keep the attack-defense cycle going, and that will drag you\
    \ deeper into the drama. Remember, as you shift your energy in the direction of\
    \ Radical Forgiveness, the energy of the other person changes automatically.\n\
    \nYou can either keep the letters for future reference or use them in a forgiveness\
    \ ritual. My personal preference lies in using the ritual of fire to transform\
    \ them. Something powerful happens when you see your words turn into ashes and\
    \ rise up in a column of smoke.\n\n## \n\n# \n\n#### 25\n\n### Forgiveness Rituals\n\
    \nThe power of ritual is underestimated in our society today. When we ritualize\
    \ any procedure, we make it sacred; thus the ritual speaks directly to our soul.\
    \ While rituals can be very simple or quite complex, the complexity matters less\
    \ than the reverence you show the ritual. The ritual invites the participation\
    \ of the divine in human affairs and, as such, represents another way of praying.\n\
    \nRituals become all the more powerful when we create them ourselves. When devising\
    \ your own rituals, be as creative as you can. However, here are some general\
    \ guidelines and ideas you may want to use.\n\n### RITUAL WITH FIRE\n\nFire has\
    \ always been the element of transformation and alchemy. Whenever we offer something\
    \ up through fire, we tap into primordial beliefs in fire’s transformative power.\
    \ For this reason, a ritual burning of a Radical Forgiveness worksheet, a release\
    \ letter, or the letter trilogy provides a sense of completion and transformation.\
    \ Carry out the burning with ceremony and reverence. Say a prayer as the item\
    \ burns.\n\nBurning scented woods, sage, sweetgrass, and incense will intensify\
    \ any ritual and bring special significance to a forgiveness ceremony. The smoke\
    \ from sage and sweetgrass also cleanses your aura, thus removing unwanted energies\
    \ from your energy field.\n\n### RITUAL WITH WATER\n\nWater possesses healing\
    \ and cleansing qualities, and we give it the ability to make things holy. Ritualized\
    \ washing, immersing, and floating can all be used to good effect. For example,\
    \ instead of burning a release letter, fold it into a boat and let a fast-flowing\
    \ stream of water take it away.\n\n### BE CREATIVE\n\nBe creative with your rituals,\
    \ and make them meaningful to you. You may recall the story of Jane, who had brain\
    \ cancer and had put in the attic a box containing everything associated with\
    \ a man who broke her heart. I asked her to take the box down from the attic and\
    \ bring it with her to therapy. Had she not had a seizure and died before we could\
    \ do so, we would have gone through the box, examining every item in it and what\
    \ it meant to her. Then we would have disposed of them one by one with a ritual\
    \ bearing meaning for her. This process would have released much repressed energy.\n\
    \n## \n\n# \n\n#### 26\n\n### Artful Forgiveness\n\nArt provides a powerful tool\
    \ for forgiveness and emotional release. One of the most dramatic healings through\
    \ art I have ever been privileged to witness and/or participate in occurred at\
    \ the retreat I did in England. One of the participants was a young woman with\
    \ multiple sclerosis. Her body was weak and wasted, and her voice was hardly audible.\
    \ Her throat chakra was virtually shut down. She had a husband and two children,\
    \ but the marriage was basically nonexistent, and she felt trapped, helpless,\
    \ and hopeless.\n\nAt one point during a group art therapy session, she began\
    \ to draw in a particularly striking fashion. She could not talk, but she kept\
    \ drawing and drawing. It was hard to discern what she was drawing, but it became\
    \ clear over time that she was using the medium as a way to regress herself and\
    \ release old childhood pain.\n\nMy wife and I sat there with her as she drew\
    \ hour after hour, her drawings becoming more and more childlike as time went\
    \ on. In addition to her pictures, occasionally she would scrawl phrases like\
    \ “bad girl” and “God doesn’t love me” and other words indicating deep shame,\
    \ guilt, and fear. Finally, she made a crude stick drawing of what she later was\
    \ able to recall as childhood rape by an uncle. In this cathartic release, she\
    \ was able to express in drawings what she had found impossible to say in words\
    \ and sounds. Her throat chakra had shut down because of what she had been forced\
    \ to do with her mouth. (Her uncle had made her have oral sex with him.) Suddenly,\
    \ art became an outlet for memories and emotions that had remained repressed for\
    \ many years. These memories and emotions were responsible for her illness."
