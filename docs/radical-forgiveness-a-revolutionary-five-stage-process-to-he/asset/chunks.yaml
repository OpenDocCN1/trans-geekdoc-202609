  trans: '

    如果我们想要转化任何东西，就必须能够完全、充分地体验它，这意味着要转化“受害者原型”，我们必须先充分地体验作为受害者的状态。这没有捷径！因此，我们的生活中需要一些让我们感到被欺害的情境，这样我们才能通过`激进宽恕`（Radical
    Forgiveness）来转化这种能量。


    要转化像受害者原型这样根源性的能量模式，许多、许多人——那些拥有完成这项艰巨任务所需的智慧和爱的灵魂——必须觉醒并接受这作为他们的精神使命。也许你就是自愿承担这项使命的灵魂之一。这可能就是这本书能引起你的共鸣吗？


    耶稣有力地展示了转化受害者原型意味着的内涵，我相信他现在正耐心且充满爱地等待我们跟随他的指引。至少到为止，我们未能从他的榜样中学习，这恰恰是因为受害者原型对我们的心理世界控制得太紧了。


    我们忽略了耶稣教导的关于真正宽恕的课程——即世界上不存在受害者。我们在墙上反复徘徊，在尝试宽恕的同时，又坚定地做一个受害者。我们让耶稣本人成了终极受害者，这不会推动我们的精神演进向前。真正的宽恕必须包括完全放弃受害者意识。


    事实上，我写这本书的主要意图是明确区分“维持受害者原型的宽恕”与让我们从中解脱的`激进宽恕`”之间的区别。`激进宽恕`挑战我们从根本上改变对世界的认知以及对发生在我们身上的事情的解释，以便我们能够停止做受害者。我的唯一目标是帮助你完成那种转变。


    我意识到，我在这里提出的观点对于那些遭受过严重伤害且仍然背负着许多痛苦的人来说，可能是极具挑战性的。我请求你带着开放的心态阅读这本书，看看读完后是否感觉好一些。


    当我写这个版本的书时，我可以告诉你，我从读者以及参加我研讨会的人那里获得的反馈是极其积极的。即使长期处于情感痛苦中的人也发现这本书极其解脱且具有治愈力——而研讨会则具有转化性的意义。


    同样令人惊喜和欣慰的是，`第一章`“吉尔的故事”为许多许多人创造了即时的治愈。我原本认为我写它是作为书中背后概念和思想的一个很有用引言，但现在我意识到灵性更清楚，它一直在引导着我的手。我接到很多人的电话——他们通常还在流泪——他们在读完故事后告诉我，在故事中看到了自己，并觉得自己的治愈已经开始了。


    许多来电的人深受触动，通过直接从我的网站上将“吉尔的故事”（见书末尾的`更多资源`）发送给他们所有的朋友、亲属和商业伙伴来分享他们的经历——这是一个奇妙的连锁反应！我将永远感谢我的姐姐和姐夫，让我讲述了他们的故事并将这份礼物送给世界。


    我发现自己对这本书获得的整体反应感到非常谦卑，对我来说越来越清晰：我正被灵性用来传递这一信息，这样我们所有人都能治愈、提升频率并回家。我很感激能提供服务。


    *Namasté* Colin Tipping


    ## 第一部分


    # 激进治愈


    ## 1


    ### 吉尔的故事


    **作者注：** 为了让读者理解我所称的`激进宽恕`，我展示了以下真实记录，讲述了这一过程如何拯救了我姐姐的婚姻并改变了她的生活。从那时起，`激进宽恕`对无数人的生活产生了积极影响，因为在我姐姐身上发生这段故事后不久，我意识到这种过程可以作为一种与传统心理治疗和关系咨询完全不同的帮助形式。“*C.T.*


    当我看到我的姐姐吉尔出现在亚特兰塔哈特斯菲尔国际机场的大厅时，我就知道出问题了。她从不擅长隐藏情感，对我来说，她显然处于痛苦之中。


    吉尔和我哥哥约翰从英国飞往美国，我已经十六年没见到他了。他在 1972 年从英国移民到了澳大利亚，我在 1984 年移民到了美国——因此，吉尔是、仍然是三个孩子中唯一住在英国的人。约翰回了一次家，这次亚特兰塔之旅代表了他返回之路的最后一段。吉尔陪他去亚特兰塔是为了来看我和妻子
    JoAnn 住几周，并在那里送他回澳大利亚。


    在最初的拥抱、吻以及某种尴尬之后，我们去了酒店。我安排了一晚的房间，这样 JoAnn 和我第二天就可以带他们参观亚特兰塔，然后向北回到家。


    当第一个严肃讨论的机会出现时，吉尔就说：“科林，家里情况不太好。杰夫和我可能会分开。”


    尽管我察觉到我姐姐有些不对，但这个声明还是令我很惊讶。我一直认为她和杰夫在六年的婚姻中是幸福的。他们以前都结过婚，但这段关系看起来很稳固。杰夫和前任妻子有三个孩子，而吉尔有四个。她最小的儿子保罗是唯一还住在家的。


    “发生什么了？”我问。


    “嗯，这完全很诡异，我不知道从何说起，”她回答道，“杰夫的行为非常奇怪，我再也受不了了。我们已经到了无法互相交谈的地步。这快要我我死了。他完全背离了我，并说这一切都是我的错。”

