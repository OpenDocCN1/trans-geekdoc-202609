    但它带给人类的真正惊人的礼物在于它能够作为一座桥梁：一座能让我们在不知不觉中，于三维现实与四维现实之间自由、轻松移动的桥梁。这座桥梁让我们能够在身体存在前者的同时，以后者的爱振动进行运作。这种桥梁是必要的，因为尽管我们深处知道四维现实是基于爱、和平、合一和喜的——而且我们极渴望去那里——但对于放弃那些如此熟悉的东西，我们感到恐惧。尽管目前的现实是基于恐惧、分离和痛苦的，事实依然如此。怀疑是真实且根深蒂固的——万一我跳入虚空，发现另一种现实根本不存在怎么办？


    所以，虽然`激进宽恕`（Radical Forgiveness）技术表面上是为了帮助我们原谅自己和他人，但它的真实目的是赋予我们一个机会，在对自己实际存在于那里完全无所知的情况下，`练习`处于那种另一种现实。它诱导我们认为自己只是在做一份宽恕工作表或其他过程，而事实上，我们正——在没有意识的情况下——实际上正在跨越那道鸿沟，并在四维现实中运作。通过使用“障眼法”和无知的赐赐，我们的自我乐此地配合了这个过程。


    就像其他任何事情一样，我们对某件事练习得越多，对它的恐惧就越少。当我们准备进行转变时——我相信这迫在眉睫——我们将如此习惯于处于基于爱的现实的振动中（通过使用`激进宽恕`），以至于我们对做出最终跳跃的恐惧将烟消云散。


    这引出了刚参加完我研讨会的人经常问的问题：“我该如何保持在`激进宽恕`的振动中，而不被周围的世界拉回受害者意识中？”


    简单的回答是——继续使用这些工具。我们每一次练习`激进宽恕`，就会越来越地锚定在四维现实中，反之，我们选择回到三维现实的可能性也越来越小。最终，它将成为我们默认的生存方式，我们将在更高的频率上变得完全稳定。


    但这个问题还有一个我们必须解决的更深层次的方面。为了继续使用这些工具，让我们留在四维现实中玩并提升我们的振动，我们必须保持清醒。


    请参阅`受害者之地过山车`（Victimland Roller Coaster）图表，见“图 18”。在这里看到，如果我们情绪波动到超过了标记精神意识丧失和进入受害者之地的线条，我们就陷入了巨大的麻烦。结果是我们的振动频率急剧下降，并失去了对新现实的感知。我们发现自己回到了分离的世界和基于恐惧的现实中——回到了自我的掌控之中。此时，我们脑海中最不想想的事情就是做工作表或听`激进宽恕`光盘。简而言之，我们迷失了。


    我现在认为这种现象不仅是那些通过`激进宽恕`体验获得收获的人的一种挫折（正如关于陷入受害者意识的问题所暗示的那样），而且最可能阻碍实现“在 012 年之前创建一个宽恕世界”这一使命的因素。


    如你所知，要创造这种觉醒，需要一定临界质量的人其意识足够提高，以抵消许多振动频率保持低水平的人。因此，对于所有振动被提升过的人（即使是通过阅读这本书），保持清醒并参与到让他们持续跨越那座桥梁的过程中是至关重要的。


    到为止，我使用`激进宽恕`的主要目标一直是治愈我们的伤口并释放能量块，以改善我们的生活——并不是说我将其局限于个人，因为我发现它对于治愈社区来说同样是非常高效的技术。在澳大利亚的工作让我有机会在当地和解运动的背景下尝试它，在那里，白人和澳大利亚原住民正聚在一起，治愈他们可怕的过去。我在那里编写并出版了一本书，名为`通过激进宽恕实现和解：治愈社区的灵性技术`。这本书的设计是为了给澳大利亚所有想要实现和解的人提供实现这一点的灵性技术——一种他们可以在家里、学校和社区中使用的工具。我现在正在对企业做同样的事情。


    所以是的，当然，这项工作将继续，但我和`激进宽恕学院`（Institute for Radical Forgiveness）的同事们也将将关注重点扩展，包括帮助人们不仅保持在`激进宽恕`体验中获得的高振动频率，还要稳步将其增加到尽可能高的水平，这样就没有回头路。


    为此，我们创建了一个`激进赋能`（Radical Empowerment）计划，旨在使人们能够以比常常更高的振动频率运作，而不是总是成为因果世界中的“果”，而是成为自己生活的“因”。`激进赋能`是`激进宽恕`（清理过去并有效处理现在）和`激进显化`（创造未来）的结合。因此公式是：`RE=RF+RM`。通过这种方式赋能的人将能够轻松快速地显化他们想要的东西。


    我们灵性赋能的关键之一，也是我们保持与`激进宽恕`振动联系的核心，是系统地开发我们意识中被称为被称为`观察者`（observer）的部分。这是我们自身具有自我意识的部分，能够见证或观察内部整个自我群体。从我们之外或独立于我们自己的视角出发，如果经过训练，它会注意到我们何时开始进入无意识状态。然后它会采取步骤将我们带回来——可能通过提醒我们在那一刻执行四步法，或者听`激进宽恕`光盘。受过训练的`观察者`将使我们远离`受害者之地`——让我们在生活中保持自由并始终拥有选择。


    另一个不可避免出现的问题是：“我该如何有效地将`激进宽恕`技术应用到我生活的每个领域？”


    这个问题的答案也包含在`激进赋能`计划中。一旦你将`激进宽恕/激进显化`模型整合到你的意识中，并将`观察者`培养到相当高的程度，你将自然开始在生活的每个方面利用`激进赋能`。这很难办不起来。


    当人们意识到这项工作具有改变世界的潜力，并在身上看到了从事有意义的灵性工作的可能后，第三个问题是：“我该如何与他人分享这些？”

