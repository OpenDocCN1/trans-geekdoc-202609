    *(List the judgments, expectations, and behaviors that indicate that you were
    wanting him/her/them to change.)*


    *I made it up that because Jeff was giving Lorraine a lot of attention, he didn’t
    love me. I felt ignored and belittled. I wanted him to put me first. I needed
    him to make me feel “enough.” I judged him as insensitive and cruel. I was judging
