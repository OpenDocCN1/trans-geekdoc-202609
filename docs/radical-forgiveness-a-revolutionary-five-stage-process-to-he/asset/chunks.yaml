  raw: '“That’s okay,” I said, reassuring her. “Look, there’s no need to figure it
    out. Just being willing to entertain the idea that something else is going on
    is a giant step forward. In fact, the willingness to see the situation differently
    is the key to your healing. Ninety percent of the healing occurs when you become
    willing to let in the idea that your soul has lovingly created this situation
    for you. In becoming willing, you let go of control and surrender it to God. He
    takes care of the other 10 percent. If you can really understand at a deep level
    and surrender to the idea that God will handle this for you if you turn it over
    to him, you won’t need to do anything at all. The situation and your healing will
    both get handled automatically.


    “But prior even to this step, you can take a perfectly rational step that enables
    you to see things differently right away. It involves separating fact from fiction.
    It means recognizing that your belief has no factual basis whatsoever. It is simply
    a story you have made up, based on a few facts and a whole lot of interpretation.


    “We do this all the time: experience an event and make interpretations about it.
    Then we put these two pieces together to create a largely false story about what
    happened. The story becomes the belief, and we defend it as if it were the truth.
    It never is, of course.


    “In your case, the facts were that Dad didn’t hug you, didn’t spend time playing
    with you, didn’t hold you, didn’t put you on his lap. He did not meet your needs
    for affection. Those were the facts. On the basis of those facts, you made a crucial
    assumption: ‘Dad doesn’t love me.’ Isn’t that true?”


    She nodded.


    “But the fact that he didn’t meet your needs doesn’t mean that he didn’t love
    you. That’s an interpretation. It wasn’t true. He was a sexually repressed man,
    and intimacy was scary for him; we know that. Maybe he just didn’t know how to
    express his love in the way you wanted to receive it. Do you remember that super
    dollhouse he made you one year for Christmas? I remember him spending countless
    hours on it in the evenings when you were in bed. Perhaps that was the only way
    he knew how to express his love for you.


    “I’m not making excuses for him or trying to make what you have said, or felt,
    wrong. I’m just trying to point out how we all make the mistake of thinking that
    our interpretations represent the truth.


    “The next big assumption you made,” I continued, “based on the facts and your
    first interpretation that ‘Dad doesn’t love me,’ was ‘It’s my fault. There must
    be something wrong with me.’ That was an even greater lie than the other assumption,
    don’t you agree?”


    She nodded.


    “It isn’t surprising that you would come to that conclusion, because that’s the
    way little kids think. Since they perceive that the world revolves around them,
    they always assume that when things don’t go well, it’s their fault. When a child
    first thinks this, the thought is coupled with great pain. To reduce the pain,
    a child represses it, but this action actually makes it all the harder to get
    rid of the thought. Thus we stay stuck with the idea that ‘It’s my fault and something
    must be wrong with me’ even as adults.


    “Any time a situation in our life triggers the memory of this pain or the idea
    attached to it, we emotionally regress. Thus we feel and behave like the little
    kid who first experienced the pain. In fact, that’s precisely what happened when
    you saw my Lorraine cause our father to feel love. You were twenty-seven years
    old, but at that moment you regressed to the two-year-old Jill who felt unloved
    and acted out all your childhood neediness. And you are still doing it, only this
    time you are doing it with your husband.


    “The idea upon which you based all your relationships represents an interpretation
    made by a two-year-old kid and has absolutely no basis in fact,” I concluded.
    “Do you see that, Jill?”


    “Yes, I do. I made some pretty silly decisions based on those unconscious assumptions,
    didn’t I?”


    “Yes, you did, but you made them when you were in pain and when you were too young
    to know any better. Even though you repressed the pain to get rid of it, the belief
    kept working in your life at a subconscious level. That’s when your soul decided
    to create some drama in your life so you would bring it to consciousness again
    and have the opportunity to choose healing once more.


    “You attracted people into your life who would confront you directly with your
    own pain and make you relive the original experience through them,” I continued.
    “That’s what Jeff is doing right now. Of course, I am not saying he is doing this
    consciously. He really isn’t. He is probably more perplexed by his own behavior
    than you are. Remember, this is a soul-to-soul transaction. His soul knows about
    your original pain and is aware that you will not heal it without going through
    the experience again.”


    “Wow!” Jill said, and took a deep breath. Her body relaxed for the first time
    since we had begun talking about the situation. “It’s certainly a totally different
    way of looking at things, but do you know what? I feel lighter. It’s as if a weight
    has been lifted off my shoulders just by talking it through with you.”


    “That’s because your energy has shifted,” I replied. “Imagine how much of your
    life-force energy you have had to expend just keeping the story about Dad and
    Lorraine alive. Plus, imagine the amount of energy required to keep down the feelings
    of grief and resentment wrapped around the story. The tears you shed earlier enabled
    you to release a lot of that. And you have just acknowledged that it was all a
    made-up story anyway—what a relief that must be. Also, you’ve had a lot of energy
    locked up around Jeff—making him wrong, making yourself wrong, being a victim,
    and so on. Just being willing to see the whole situation differently enables you
    to release all that energy and allow it to move through you. No wonder you feel
    lighter!”


    “What would have happened if, instead of understanding what was going on underneath
    the situation with Jeff, I had simply left him?” Jill asked.


    “Your soul would have brought in someone else to help you heal,” I quickly replied.
    “But you didn’t leave him, did you? You came here instead. You have to understand,
    this trip was no accident. There are no such things as accidents in this system.
    You—or rather, your soul—created this trip, this opportunity to understand the
    dynamics of the situation with Jeff. Your soul guided you here. John’s soul created
    a trip at this particular time to make it possible for you to come with him.”


    “And what about the two Lorraines?” Jill wondered. “How did that happen? Surely,
    that’s just a coincidence.”


    “There are no coincidences in this system either. Just know that your souls, and
    the souls of some others, conspired to create this situation, and notice how perfect
    it was that a person named Lorraine was involved in the original occasion and
    in this one. It couldn’t have been a more perfect clue. It’s hard to imagine that
    it wasn’t set up somehow, don’t you agree?” I said.


    “So what do I do with this now?” asked Jill. “It’s true that I feel lighter, but
    what do I do when I go home and see Jeff?”


    “There really is very little for you to do,” I answered. “From this point on,
    it’s more a question of how you feel inside yourself. Do you understand that you
    are no longer a victim? Do you understand that Jeff is no longer a persecutor?
    Do you see that the situation was exactly what you needed and wanted? Do you feel
    how much that man loves you—at the soul level, I mean?”


    “What do you mean?” Jill asked.'
