    of the organism in exactly this way. The tiniest part of an active ingredient
    is put into water and is then diluted many thousands of times to the point where
    there is no physical trace of the substance left. What does remain, however, is
    the energetic imprint of the substance, and therein lies the power to heal. When
    the person takes the remedy, the subtle body registers the imprint and becomes
    stimulated to move energy in whatever way it needs to in order to heal at all
    levels.


    The same thing happens with these Radical Forgiveness tools. Just as someone might
    look at the homeopathic remedy and, seeing only water, find great difficulty in
    imagining that it has the power to heal, so might someone looking at a forgiveness
    worksheet, for example, be thoroughly skeptical about its ability to change her
    life.


