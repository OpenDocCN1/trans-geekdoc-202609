    # 29

    ### 原谅之玫瑰


    当我们向他人敞开心扉时，我们会变得脆弱，并面临成为他们投射目标的危险。他们的心理能量可能会与我们的混合，这会耗尽我们的能量。


    我举办的工作坊做得越多，就越意识到，在很多情况下，人们似乎与某个特定个人产生的问题，源于后者能够进入并操纵他们的能量场。几乎总是，与他们产生问题的人似乎是通过`第三脉轮`（third
    chakra）进入的，那是权力和控制问题所在。一旦进入，那个人就很容易控制他们——抽取他们的能量或随心所欲将自己的能量倒在他们身上。当然，这一切都是在潜意识中完成的——没有意识，希望也没有恶意——但对于被操纵的人来说这可能是筋疲力竭，并给关系带来巨大压力。


    你可能不会惊讶地发现，通常是母亲在进行侵入和控制——我还要补充一点，甚至在坟墓也是如此。也可能是父亲、配偶或其他任何想要对人的生活拥有某种控制权的人，但大多数是母亲。


    停止这种行为或防止其发生在你接触的人身上最简单的方法，就是在你和他人之间放置一朵想象中的玫瑰。这是一种令人惊讶的强大保护装置。


    在许多神秘文献中，玫瑰是心理保护的象征。出于原因，它在这方面具有巨大的效力，可能是因为它是爱的通用符号。视觉化玫瑰可以让我们免受他人投射的伤害，提供了一种在不向他人关闭心灵的情况下阻隔负能量的方法。无法解释为什么玫瑰的视觉化在这方面如此有效；事实上，我们可以用任何形式的视觉化建立心理保护，因为仅仅这样做就创造了自我保护的意图。但玫瑰数百年来一直用于此目的，似乎比大多数其他符号都更有效。


    所以，从现在起，每当你遇到不想让能量与你混合的人时，想象玫瑰存在于你光场的边缘，或者位于你与那个人之间的中间。然后注意你在他们身边时感觉有何不同。你应该在陪伴对方的同时，感受到更强的自身空间感和身份认同。你不需要出现在某人的物理场中，他们就能控制你的能量，因此即使在通话时建立你的玫瑰也是个好主意。（图
    19）


    ![](img/part4_chapter29_image001.jpg)


    图 19：玫瑰


    # 30

    ### 为内在小孩守灵


    我们的灵性演化很大程度上取决于我们从最糟糕的成瘾中恢复——我们对“受害者原型”的成瘾，它将我们困在过去并榨干我们的生命能量。内在小孩仅仅是我们伤口和一种可怜的受害者意识的隐喻。将我们的受害者意识包裹在婴儿衣里并让它变得更容易被接受。唤起内在小孩仍然代表着成瘾行为。


    请注意，我指的不是那种顽皮、富有创意且肯定生命的内在小孩，例如理查德·巴赫（Richard Bach）[6]描述的那种，或者是我们身上那个出来启发并唤醒我们的部分。我指的是那个住在头脑后房间里、哭闹的小鬼，那个总是可以信赖用来指怪他人导致我们不快乐的不快乐受害者。这就是我们在
    80 年代在那些内在小孩工作坊中讨好的那一个。


    '
- fmt: '

    For the sake of our spiritual evolution and our eventual release from the victim
    archetype, we must bring the inner brat’s life lovingly to a close. I therefore
    propose that you hold a funeral and pronounce him or her dead. If you choose to
    go ahead with this exercise, you will probably grieve the loss of your inner child,
    and that is okay. No doubt your inner child has given you solace and comfort in
    your pain over the years, but now is the time to move on. Radical Forgiveness
    releases you from the need to hold onto the woundedness, so allow yourself to
    release your inner child now.


    As long as you hold onto your past wounds, Radical Forgiveness remains impossible.
    Clinging to your inner child only holds you back, because that child represents
    your past wounds. While you want to move on with your life, you may be surprised
    to find that your inner child wants to move on too! To release your inner child,
    try the following meditation.


    ### THE FUNERAL MEDITATION


    Sit comfortably and take three deep breaths, allowing your body to relax as your
    breath leaves your body. Notice any areas of your body that remain tight. Consciously
    relax them, knowing that during this meditation your body will continue to relax
    with every breath you take—and soon you will be profoundly relaxed from head to
    toe. Now look inside yourself and find the room in which sits the young person
    who has willingly carried your pain. Find the inner child who holds your memories
    of being abused, ignored, betrayed, abandoned, unaccepted, or unloved.


    As you come upon this little person in that room, notice that he or she is surrounded
    by lists, ledgers, charts, and scorecards. The walls of the room are covered with
    people’s names, what they did to you, and the punishment you have believed they
    deserve. In the ledgers, the child keeps a careful tally of all the times someone
    victimized you and what it cost you. Notice the joylessness of this room. As you
    look at this young child, realize how sad he or she really feels being locked
    down there alone with the pain, mired in victim consciousness.


    Realizing that it is time for a change, you walk across the room and throw open
    the windows to let in the sunlight. As it floods into the room, the ink on the
    charts on the wall starts to fade and the ledger books begin to crumble to dust.
    The lists tacked to the wall also fall to the ground and dissolve. Look at the
    little person who has lived in this room for all those years, keeping resentment
    scores day by day. See his or her broad smile and joyous expression.


    “Now I am free to go,” the child says.


    “Go where?” you ask.


    “I’m free to go to the next place. I should have left years ago, but I’ve been
    waiting for you to release me from this job.”


    Suddenly you notice that this person, who was young and childlike such a short
    while ago, is growing old and becoming wizened and gray-haired right before your
    eyes. Yet a great peace has replaced his or her sadness.


    “Thank you for letting me go,” he or she gasps, lying down slowly on a couch.


    You say, “I’m sorry it’s taken so long to bring light into this room. I’m sorry
    I’ve held you back.”


    “That’s quite alright,” comes the quiet reply. “It really is okay. Time is just
    an illusion anyway. Goodbye.” With that, the little person dies, looking peaceful
    and serene.


    Lovingly, you wrap the little person in a white cloth and take the body upstairs
    and out into the light. A horse and buggy wait there, and angels hover nearby,
    singing softly. All the people who have ever been in your life are waiting to
    pay their respects. All past hurts are forgiven. Love is everywhere. The bells
    on the horse and buggy ring softly as the entourage slowly begins its journey
    to the hill where a grave has been prepared. At the graveside, everyone sings
    and great joy envelops the group. Your angels are with you and support you as
    you say your last farewell. See the little person being lowered lovingly and gently
    into the grave while the celestial choir sings. As a stone is placed onto the
    grave, you feel a new sense of freedom and love moving through you.


    You walk to the bottom of the hill where you find a fast-running stream. You wash
    your hands and face in the water and see your reflection there. Feel the cleansing
    water of the stream running through your being, taking with it all the dust and
    debris from the room where the little person once dwelled. Hear the sound of the
    water babbling over the rocks. See the sun sparkling on the water, and feel the
    warmth of the sun on your body. Notice the green of the surrounding fields and
    the many bright flowers all around you. All is well. Open your eyes whenever you
    feel ready to do so.


    Being without your wounded inner child will feel strange for a while, but you
    will also begin to notice some positive changes. You will feel lighter, less burdened,
    more in the moment. Your life energy will increase as you retrieve the energy
    that was previously spent holding on to the wounds of the inner child.


    Be prepared to encounter problems with close friends with whom you previously
    spent time sharing wounds. They will not like this change in you, for they will
    see that you no longer give your wounds power. Since they remain committed to
    their wounds, they may be uncomfortable with you; they may even begin feeling
    as if you have betrayed them. If you are a member of a support group that thrives
    on sharing wounds, such as Adult Children of Alcoholics (`ACOA`) or Incest Survivors,
    be prepared to disconnect yourself from the group. You will probably find your
    need to attend group meetings diminishing anyway, but if you are the least bit
    codependent, you might still feel as if leaving the group is a challenge. Stick
    to your guns, and do not take personally other people’s attempts to disconnect
    from you or talk of betrayal.


    # Afterword


    Twelve years after first publishing this book, I have finally caught up with my
    own thinking about Radical Forgiveness being much larger than a mere process of
    forgiveness—bigger, in fact, than I ever imagined.


    I have known from the beginning that Radical Forgiveness has never been about
    forgiveness per se—at least not as we have traditionally conceived of it. It is
    indeed an alternative way of forgiving that is quicker and more effective than
    any other form of forgiveness, but it’s something infinitely greater, more all-encompassing,
    and more revolutionary.


    It is nothing less than a mind-blowing idea that shatters our existing ideas of
    reality and challenges our current worldview. It invites us to engage in a process
    that is rooted in a fourth-dimensional reality that we don’t yet understand. Neither
    is there much proof of its efficacy, other than the evidence of our own awareness
    of how significantly changed we become when we engage in it. (If you’ve done a
    worksheet, you’ll know what I mean.)


    It requires that we suspend our normal way of thinking about ourselves and our
    relationship to the world at large, and be open to the possibility that we can
    begin operating from this new reality—before we really know what it is or how
    it works—just by being willing to do it.

