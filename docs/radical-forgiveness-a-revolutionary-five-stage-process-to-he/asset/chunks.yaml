    很多时候，当人们谈论“放下”愤怒或“释放”愤怒时，他们实际上是想试图除掉它。他们将其判定为错误的、不不可的的，甚至是令人恐惧的。他们不想感受这种情绪，所以只是在谈论它，并试图从理智上处理它，但这并行不通。通过谈论来处理情绪只是另一种逃避感受的方式。这就是为什么大多数谈话疗法无效的原因。*你越抗拒，它就越持久。*
    因为愤怒代表着运动中的能量，抗拒它会让它停留在我们体内——直到火山爆发。释放愤怒实际上意味着允许被压抑的情绪作为感受在身体里自由流动，从而释放这些停滞的能量。进行某种形式的愤怒处理可以帮助我们有目的地且有控制地体验这种情绪。


    ## 愤怒处理转化能量


    我们所说的“愤怒处理”并不是真的关于愤怒。它仅仅是让停留在体内的能量重新流动起来。它更准确地被称为“能量释放工作”。无论我们如何称呼它，过程都可以非常简单：对着枕头尖叫（以免惊扰到邻居）、在车里大吼、拍打枕头、劈木，或进行其他某种爆发性的身体活动。


    将身体活动与声音的使用似乎是成功释放能量的关键。很多时候，我们将情绪的能量——无论是愤怒、悲伤、内疚还是其他情绪——堵在喉咙里，因此发声的表达始终应该是该过程的一部分。我们进入这一过程时，不应带着试图除掉这种感觉的想法，而是带着感受它流经身体强度的意图——不带思考或判断。如果我们真的能够臣服于情绪，我们将感到比久以来任何时候都有活力，并且会发现能量已经消散了。


    ## 如果愤怒令人恐惧


    对于我们许多人来说，提起愤怒的想法可能太可怕了，甚至无法去思考，尤其是当愤怒之下隐藏着恐惧时。那些对我们做过坏事的人可能仍然对我们的潜意识产生强烈影响。在这种情况下，不建议独自进行愤怒处理。相反，我们应该与那些知道如何支持我们感受愤怒和恐惧的人一起工作——这个人要让我们感到安全，并且具有帮助人们度强烈情绪的经验。咨询师或某种类型的心理治疗师都是很好的选择。我也建议与经验丰富的实践者一起进行“萨提呼吸法”（Satori
    Breathwork，见第 27 章）。这提供了一种释放情绪的方法。


    ## 愤怒成瘾警告


    这里需要发出警告。人们很容易对愤怒上瘾。愤怒会自我滋养并轻易变成怨恨。怨恨沉迷于反复回味旧伤痛，不断地重温与之相关的痛苦，并以某种形式发泄产生的愤怒。它本身就变成了一种强大的成瘾。


    我们必须意识到，持续存在的愤怒没有任何用处。因此，一旦愤怒的能量被允许作为感受流动，我们应该利用这种能量来创造积极的结果。也许我们需要对围绕我们愤怒转转的那个人的未来互动设定一个边界或条件。也许我们可以做出某种决定，例如愿意对那个人产生同情心或原谅他。只有当我们把愤怒作为积极改变、自我授权或原谅的催化剂时，我们才能防止它变成一种成瘾循环。


    ## 瓦解故事


    故事中唯一真实的部分是原始事件：父亲离开了。剩下的仅仅是解释——由一个非常不成熟、恐惧的心灵所做的假设。这使得这个故事有 95%都是胡言（信念系统）！


    例如，假设我们的父亲在我们五岁时离开了家。对我们来说，这个事件是创伤且痛苦的，但在我们的脑海中，那只是故事的开始。在那个年龄，我们认为世界围绕着我们转，所以我们只能从那个观点来看。因此，我们根据此做出了自己的解释。第一个解释是他抛弃了我！之后又出现了许多以自我为中心、扩展故事的解释，例如：“这一定是我的错。我一定做了些什么赶走了他。他不再爱我了。也许他从未爱过我。如果我父亲都离开我，我一定是个非常不受欢迎的人。他不在乎我，如果他不在乎我，谁会在乎呢？我猜他不爱我，就没有人会爱我，即使他们爱我，也会在五年后离开我，因为那些说爱你的男人就是那样的。你不能真正信任那些说爱你的男人，因为他们反正五年后就会离开。我只是不太受欢迎。我永远不会有超过五年的感情。如果我对我父亲来说不够好，我永远对任何人都不够好。”


    这些故事就像内在的陀仪，有自己的频率，吸引事件和人物来到它们身边，以便根据其包含的信念而发生。但正如我们所见，故事中唯一真实的部分是原始事件：父亲离开了。那可能只占整个故事的
    5%。


    如果我们是女性——正如最近在我的工作坊中一位一直带着这个故事的女性身上发生的那样——我们可能会编造出男人总是会被其他女人“偷走”。然后我们就会下意识地创造出这种情况——在例例子中，是在进入关系大约五年后。


