  raw: "If we are to transform anything, we must be able to experience it completely\
    \ and fully, which means that to transform the victim archetype, we must first\
    \ experience victimhood fully. There is no shortcut! Therefore, we need situations\
    \ in our lives that allow us to feel victimized so we can transform the energy\
    \ through Radical Forgiveness.\n\nTo transform an energy pattern so fundamental\
    \ as the victim archetype, many, many people—souls who possess the wisdom and\
    \ love necessary to accomplish this immense task—must awaken and accept this as\
    \ their spiritual mission. Perhaps you are one of the souls who volunteered for\
    \ this mission. Could that be why this book speaks to you?\n\nJesus gave a powerful\
    \ demonstration of what transforming the victim archetype means, and I believe\
    \ he now waits patiently and lovingly for us to follow his lead. Up to now, at\
    \ least, we have failed to learn from his example precisely because the victim\
    \ archetype has had such a strong hold on our psyches.\n\nWe have ignored the\
    \ lesson of genuine forgiveness that Jesus taught—that there are no victims. We\
    \ straddle the fence and attempt to forgive while staying firmly committed to\
    \ being victims. We have made Jesus himself the ultimate victim, and this will\
    \ not move us forward in our spiritual evolution. True forgiveness must include\
    \ completely letting go of victim consciousness.\n\nIndeed, my main intention\
    \ in writing this book was to make clear the distinction between forgiveness that\
    \ maintains the victim archetype and Radical Forgiveness that frees us from it.\
    \ Radical Forgiveness challenges us to fundamentally shift our perception of the\
    \ world and our interpretation of what happens to us so we can stop being victims.\
    \ My one goal is to help you make that shift.\n\nI recognize that the ideas I\
    \ am presenting here may be extremely challenging for someone who has been severely\
    \ victimized and is still carrying a lot of pain. I ask only that you read this\
    \ book with an open mind and see whether or not you feel better after reading\
    \ it.\n\nAs I write this edition of the book, I can tell you that the feedback\
    \ I have received from my readers and those who come to my workshops has been\
    \ overwhelmingly positive. Even people who have been in emotional pain for a long\
    \ time have found the book to be extremely freeing and healing—and the workshops\
    \ transformational.\n\nWhat has also been amazing and gratifying is the extent\
    \ to which Chapter 1, “Jill’s Story,” has created immediate healing for many,\
    \ many people. I originally thought I was writing it as a useful lead-in to the\
    \ concepts and ideas behind this book, but I now recognize that Spirit knew better\
    \ and was guiding my hand all the way. I get many phone calls from people—often\
    \ still in tears—who, having just read the story, tell me that they see themselves\
    \ in it and feel that their healing has already begun.\n\nA great many of those\
    \ who call have been moved to share their experience with others by emailing “Jill’s\
    \ Story” directly from my website (see Further Resources at the end of the book)\
    \ to all their friends, relations, and business associates—a wonderful chain reaction!\
    \ I shall be forever grateful to my sister and brother-in-law for allowing me\
    \ to tell their story and making that gift to the world.\n\nI find myself very\
    \ humbled by the overall response I am getting to the book, and it is fast becoming\
    \ clear to me that I am being used by Spirit to get this message out so that we\
    \ can all heal, raise our vibration, and go home. I am grateful to be of service.\n\
