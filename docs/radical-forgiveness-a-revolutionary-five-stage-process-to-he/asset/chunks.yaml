    正如我已经指出的，“激进宽恕”（Radical Forgiveness）工具包中的所有工具在本质上都是全息的，几乎不需要任何技巧、信念、知识或认知理解。所需要的是愿意开放面对这种情况可能存在某种完美的可能性——即使你并不不想这么说，也不真的相信。工作表仅仅是表达这种“愿意的意愿”的一种方式。你的灵性智能会捕捉到你的意愿，并将其与宇宙智能连接起来（无论对你来说那是什么）。正如此，我喜欢将工作表视为一种世俗的祈祷。


    由于工作表是一种全息方式运作的能量工具，它不受时空的限制。这就是为什么效果通常是即时的，距离永远不是因素。立即完成工作表可以释放情境中阻塞的能量，结果是一切似乎都会自动解决。


    现在你已经读到了书的这里，你会明白每当任何人让你不快或触发你的负面情绪时，都是一个成长的机会。以前你可能会被卷入戏中，而现在你可以拿起工作表，立即开始宽恕过程，并快速获得结果。


    有时一张表格就够了，但如果能量非常固着，可能需要很多很多张。这很难说。继续做工作表，直到情况、人或事件周围的能量消散为止。这可能需要几天甚至几个月。


    你将通过自己的感受来判断自己何时达到了宽恕的境界。如果你发现再次见到那个人、与他们通话，甚至在想他们时，自己只是感到很中立，那么你可能已经完成了 90%，这个人或这种情况周围几乎或完全没有电荷了。当你对那个人除了爱之外别无感觉时，你就完全（100%）达到了目标。


    标题为“激进宽恕工作表”章节中的工作表可以放大并复印，但你可能更喜欢从 `soundstrue.com/radicalforgiveness` 下载一份信纸大小的。


    在完成工作表时，对激进宽恕的基础原理有合理的理解会有帮助，以下笔记就是对这些原则的提醒。例如，答案的填写方式就像是 Jill 在第一章描述的她与 Jeff
    经历的情况时所完成它的一样。


    当我们开始接触激进宽恕时，我们倾向于对宽恕名单上的许多人做过多的工作表，并关注过去的重大问题。但激进宽恕最好的特点之一在于，我们不需要挖掘过去来治愈当年的大伤。`现在`让你不快的人，就代表了过去曾因相同原因让你不快的`所有`人。所以先处理那个人，即使你认为觉得这没什么大不了。如果它让你不快，它`就是`一件大事。它可以很容易地引导你走向真正重要的事情。


    另一个误解是激进宽恕只是为了处理过去。它当然非常适合过去，但当你每天或经常使用它时，它会变得深刻地改变生活。问题一旦出现，想法就是使用这张工作表或书中的其他工具，来溶解附着在其上面的能量。


    ### 激进宽恕工作表


    #### 用于委屈真正转化的工具


    以下是一个填好的工作表示例以及每个步骤的说明。


    **日期：** `8/7/09` **工作表：** `3`

    **主题：** `Jeff`


    ##### I. 讲述故事


    1. 让我感到不快的情况是或曾是（完全从你的受害者立场，即旧范式讲述故事。如有必要请使用额外纸张。）


    *Jeff 把所有的注意和爱都放在女儿 Lorraine 身上而抛弃了我——完全忽略了我。他觉得我是错的，并指责我精神不正常。他让我觉得自己毫无价值又愚蠢。我们的婚姻结束了，这一切都是他的错。是他强迫我离开他。*


    **说明：** 确保用第三人称描写那人或物。换句话说，就像你在向别人讲述发生或正在发生的事情一样讲述你的故事。从受害者的立场讲述你的愤怒。（受害者意识是旧范式）。不要保留。描述情况现在是或过去是什么，以及你现在的感受如何，和/或当时的感受如何。不要对其进行编辑，或与其叠加任何灵性或心理学的解释。


    2a. **面对 X：** 我对你很不快，`Jeff，` 因为……


    *你毁了了我们的婚姻。你伤害了我并拒绝了我。你的行为太恶心了，我要离开你了，你这个混蛋！*

