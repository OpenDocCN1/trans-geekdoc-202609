    Anyway, contrary to what the ego would have us believe, the truth is that we actually
    come to the physical plane with God’s blessing and His unconditional love. God
    always will honor our free will and our choices at the highest level and will
    offer no divine intervention—unless asked.


    Fortunately, Radical Forgiveness provides the perfect tool for asking for such
    assistance because, in the process, you demonstrate to God that you have seen
    beyond the ego and glimpsed the truth that only love is real and that we are all
    one with God, including those who seemed at first to be our enemy.


    ## 2. THE EGO AS LOVING GUIDE


    This other, friendlier way of looking at the ego—which I find equally tenable
    and, to be truthful, more attractive—holds that, far from being our enemy, the
    ego is a part of our soul that acts as our guide in the World of Humanity. Its
    role is to provide opportunities in our lifetime that will fully test our ability
    to fulfill the mission we carefully planned before we incarnated, the primary
    purpose of which was to experience a certain agreed-upon amount of separation.
    When we have reached the degree of separation we signed up for, the process of
    awakening can begin. That’s when we are likely to find Radical Forgiveness.


    (By the way, I am certain in my own mind that simply by virtue of your having
    picked up this book and gotten this far into it without throwing it at the wall,
    you have arrived at the awakening point or are some distance beyond it. This doesn’t
    mean that you are fully awake all the time—very few people are—but that you are
    at least beginning to see what’s real and remembering the truth.)


    (For a full and detailed explanation of this whole idea of our volunteering to
    experience the pain of separation—and then, when we have reached the amount we
    contracted to have, beginning the awakening process—see my book *Getting to Heaven
    on a Harley.*)


    The only value in having the human experience is precisely to live through such
    things as the ego provides: belief in duality, separateness, pain and suffering,
    guilt and fear. Our ego gives us the opportunity to embody these feelings by creating
    experiences like abandonment, betrayal, abuse, rejection, divorce, physical illness,
    disability, and so on. (FIGURE 6)


    ![](Images/part2_chapter6_image002.jpg)


    FIGURE 6: The Soul’s Journey


    Our ego, then, in this model, is the guide that will take us on all these exciting
    journeys into separation, pain, and discomfort. It does so not out of malice or
    for the sake of its own survival, as many spiritual teachers maintain, but because
    it loves us and knows that we need these experiences for our spiritual growth.


    The Higher Self is our other guide, who waits patiently while we journey into
    illusion with the ego until we are ready to awaken. It is through the gentle whispers
    of the Higher Self that we wake up, bit by bit, until we finally remember who
    we are. It is often at this point in our lives that we shift our direction and
    focus less on material things and become more interested in being of service.


    I invite you to consider both definitions to be true at the same time. My sense
    is that the first one is true in terms of explaining our initial descent into
    physical form and how we came to see that event (falsely) in retrospect, but that
    the second is grounded in a deeper truth—namely, that we need the ego to help
    us to fulfill our mission.


    Maybe they are two different things; I don’t know. It really doesn’t matter. Each
    definition helps me to make sense of this human experience in terms of spiritual
    truth, and I trust they will do the same for you.


    ## 7. Hideouts and Scapegoats


    Understanding the role the twin psychological ego-defense mechanisms of repression
    and projection play in how we heal relationships is essential to the concept of
    Radical Forgiveness. A closer inspection of the mechanisms of each might be helpful.


    Operating together, repression and projection wreak havoc upon our relationships
    and our lives. Together they create and maintain the victim archetype. Understanding
    how they work enables us to counteract the ego’s use of them to keep us separated
    from each other and from God.


    ### REPRESSION


    Operating as a normal psychological defense mechanism, repression occurs when
    feelings like terror, guilt, or rage become so overwhelming that the mind simply
    blocks them entirely from conscious awareness. This makes repression a powerful
    mental safety device, for without this blocking mechanism we could easily go mad.
    It works so effectively that absolutely no memory of the feelings, or the event
    which precipitated them, remains. It can be completely blocked from conscious
    awareness for days, weeks, or years—sometimes even for the rest of the lifetime.


    ### Suppression


    Repression should not be confused with this other similar but less severe defense
    mechanism. Suppression occurs when we `consciously` refuse to acknowledge emotions
    we do not want to feel or express. Though we know they are there, we try to push,
    or stuff, them away and refuse to deal with them. But their continued denial for
    long periods of time may lead to a numbness equivalent to their becoming repressed.


    ### Repressed Guilt and Shame


    Guilt and shame are not the same. We feel guilt when we feel we have `done` wrong.
    Shame takes us to a much deeper level of guilt where we have a sense of actually
    `being` wrong. With shame, the ego makes us feel inherently wrong at the very
    core of our being—a feeling that most reliably separates us from everyone and
    everything. Such shame can be so strong that we have no choice but to repress
    it: we absolutely could not handle it otherwise.


    ### Shame Blocks Energy


    Young children can be easily shamed, say, when they wet themselves, get an erection,
    show anger, act shy, and so on. While these may be natural occurrences, the children
    nevertheless feel shame, and the cumulative effects of this feeling can become
    overwhelming. Consequently, they repress their shame, but it remains in the unconscious
    mind as well as in the body. It becomes locked into their system at the cellular
    level and creates an energy block in the body. If left unresolved for too long,
    this block gives rise to either mental/emotional problems, physical problems,
    or both. Repressed emotion is now recognized by many researchers to be one of
    the principal causes of cancer.


    ### Repressed Feelings


    A large trauma, such as the death of a parent, can cause a child to repress emotion.
    Likewise, something as seemingly insignificant as a casual critical remark interpreted
    as meaningful, or an event incorrectly assumed to be the child’s fault, can cause
    emotions to be repressed. For example, children nearly always interpret a divorce
    as their fault. Research suggests that children remember conversations their parents
    had while they were still in the womb, so a discussion about an unwanted pregnancy
    before birth can lead to a child’s feeling unwanted and afraid of being abandoned.
    Such feelings would be repressed at such an early time in the child’s life.


    ### Generational Guilt


    Groups and even nationalities commonly repress accumulated generational guilt.
    Without doubt, this is the case now with black and white Americans over slavery.
    The racial problems we now experience in America all stem from the unresolved
    and repressed guilt within white people and unresolved and repressed rage in blacks.


    It has become clear to me during my workshops that a lot of the pain people carry
    is not their own and may go back several generations. Most frequently it is their
    parents’ pain they have taken on, but it might also be their grandparents’ or
    siblings’. When we are children, our energy is purer and less fractured than it
    is when we become adults, so children feel able to carry that pain where a wounded
    adult may not. But children forget to give it back, and they make it their own.


    ## The Dark Side

