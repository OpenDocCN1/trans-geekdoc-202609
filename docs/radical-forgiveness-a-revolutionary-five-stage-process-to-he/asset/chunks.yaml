    - Traditional forgiveness, when of a very high vibration, recognizes the profundity
    of the spiritual insight that we all are imperfect and that imperfection characterizes
    the nature of humanity. When we look at a wrongdoer through these eyes, we can
    say in all humility and with tolerance and compassion, “There but for the Grace
    of God, go I.” We own that we, too, are completely capable of whatever the accused
    person has done. If we are acquainted with our shadow self, we know that we all
    have within us the potential to cause harm, to murder, to rape, to abuse children,
    and to annihilate 13 million people. This knowledge allows us to call forth our
    humility and makes us kind and merciful not only to the accused but to ourselves,
    for in them we recognize our own inherent imperfection, our own shadow. This recognition
    brings us very close to actually taking back that which we projected—the vital
    first step in Radical Forgiveness.


    *Radical Forgiveness also lovingly sees the imperfection inherent in human beings,
    but sees the perfection in the imperfection.*


    - Radical Forgiveness recognizes that forgiveness cannot be willed or bestowed.
    We must be willing to forgive and to give the situation over to our Higher Power.
    Forgiveness of any kind comes not from effort but from being open to experiencing
    it.


    ## WHAT IS NOT FORGIVENESS


    While we are dealing with definitions, we should also be clear about what is *not*
    forgiveness. A lot of what passes for forgiveness is what I call “pseudo-forgiveness.”


    Lacking authenticity, pseudo-forgiveness is usually just neatly packaged judgment
    and concealed resentment masquerading as forgiveness. The willingness to forgive
    is not there, and, far from decreasing victim consciousness, it actually expands
    it. However, the line between this and traditional forgiveness may not be easy
    to determine.


    ### Examples of Pseudo-Forgiveness


    The following examples are listed in order of descending clarity, beginning with
    those that are obviously false and ending with those that come close to traditional
    forgiveness.


    | Description |

    | :--- |

    | • **Forgiving out of a sense of obligation.** This is completely inauthentic,
    yet many of us forgive from this place. We think of forgiveness as the right thing
    or even the spiritual thing to do. We think we *ought* to forgive. |

    | • **Forgiving out of a sense of righteousness.** This is the antithesis of forgiveness.
    If you forgive people because you think you are right and they are stupid, or
    because you pity them, that is pure arrogance. |

    | • **Bestowing forgiveness or pardoning.** This is pure self-delusion. We do
    not possess the power to bestow forgiveness on anyone. When we bestow forgiveness,
    we play God. Forgiveness is not something we control—it just happens when we are
    willing. |

    | • **Pretending forgiveness.** Pretending that we are not angry about something
    when we actually are angry provides not so much an opportunity to forgive as an
    opportunity to deny our anger. This represents a form of self-invalidation. When
    we do this, we allow others to treat us like the proverbial doormat. Such behavior
    usually stems from a fear of not forgiving, of being abandoned, or from a belief
    that expressing anger is unacceptable. |

    | • **Forgive and forget.** This simply creates denial. Forgiveness is never simple
    erasure. Wise people forgive but *do not* forget. They strive to appreciate the
    gift inherent in the situation and to remember the lesson it taught them. |

    | • **Making excuses.** When we forgive, we often do it with explanations or by
    making excuses for the person we are forgiving. For example, we might say about
    our parents, “My father abused me because he was abused by his own parents. He
    was doing the best he could.” Forgiveness should be about letting go of the past
    and refusing to be controlled by it. If an explanation helps one to let go, it
    may be helpful to that extent, though an explanation does not remove the idea
    that something wrong happened. Therefore, at best, it can only be traditional
    forgiveness. It also possesses a certain righteousness, which may mask anger.
    On the other hand, understanding why someone did what they did and having empathy
    for them connects us again to our own imperfection and opens the door to feeling
    compassion and mercy—leading to a higher vibration of traditional forgiveness
    but still falling short of Radical Forgiveness. |

    | • **Forgiving the person but not condoning the behavior.** This largely intellectual
    approach may only masquerade as forgiveness, because it remains judgmental and
    self-righteous. It also has practical and semantic problems. How do you separate
    a murderer from the act of murder? |


    This last one raises the issues of accountability and responsibility, both of
    which are the subject of the next chapter.


    ## Accountability


    It must be clearly understood that Radical Forgiveness does not relieve us from
    responsibility in this world. We are spiritual beings having a human experience
    in a world governed by both physical and man-made laws, and as such we are necessarily
    held to account for all our actions. That is an inherent part of the human experience
    that cannot be avoided.


    In other words, when we create circumstances that hurt other people, we must accept
    that in the `World of Humanity` there are consequences for such actions. While
    from a Radical Forgiveness standpoint we would say that all parties involved in
    the situation are getting what they need, it is also true that experiencing the
    consequences, like going to jail or being fined, shamed, or condemned, is all
    part of the lesson and is perfect once again in that spiritual context.


    I am often asked whether, in a situation where someone has done us harm and where
    the normal reaction would be to seek redress through the courts, a forgiving person
    would actually take that course of action. The answer is yes. We live in the `World
    of Humanity`, which operates within the parameters of the `Law of Cause and Effect`.
    This states that for every action there is a corresponding equal reaction. Thus,
    early on we learn that our actions have consequences. If we were never held accountable
    for our actions, forgiveness would be meaningless and valueless. With no accountability
    demanded of us, it would appear as if, no matter what we did, no one would care.
    Such an action or attitude offers no compassion whatsoever. For instance, children
    always interpret *rightful* parental discipline applied appropriately as caring
    and loving. Conversely, they interpret being given total license by their parents
    as non-caring.


    However, the extent to which we respond to other people’s actions with a sense
    of righteous indignation, grievance, revenge, and resentment rather than with
    a genuine desire to balance the scales with regard to principles of fairness,
    freedom, and respect for others determines our level of forgiveness. Righteousness
    and revenge lower our vibration. Conversely, defense of principles and acting
    with integrity raises our vibration. The higher the vibration, the closer we come
    to Divine Truth and the more able we are to forgive radically.

