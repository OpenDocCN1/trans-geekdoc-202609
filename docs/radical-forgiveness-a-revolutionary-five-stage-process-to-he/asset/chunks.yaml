    # The Power of Radical Forgiveness: An Experience of Deep Emotional and Spiritual
    Healing


    Colin Tipping Spoken-Word Audio / F1309D 6 CDs, 5 1/2 hours, 34-page study guide
    on CD-ROM US $69.95/ISBN: 978-1-59179-678-7 UPC: 600835-130929


    # Radical Forgiveness


    Colin Tipping Spoken-Word Audio/W1455D 3 CDs, including an E-CD US $24.95/ISBN:
    978-1-59179-767-8 UPC: 600835-145527 Audio products are available on CD and digital
    download.


    ## Back Cover Material


    **Writer’s Digest Award Winner**


    “This is the most exciting book on forgiveness to come out in a very long time.
    I have never seen anything so well written and so ‘right on the money’ on this
    topic. I am recommending Radical Forgiveness to everyone.”


    –Neale Donald Walsch, author of *Conversations with God*


    “Radical Forgiveness* is required reading! This material is so profound and yet
    utterly accessible that anyone can feel its transformative effect.”


    –James F. Twyman, Peace Troubadour and author of *The Proof: A 40-Day Program
    for Embodying Oneness*


    Is there a divine purpose behind everything that happens? If you’re willing to
    embrace that possibility, every aspect of your life can change. This is the theory
    behind Colin Tipping’s revolutionary method for experiencing the freedom, peace,
    and renewed energy that come with Radical Forgiveness. In `Radical Forgiveness,`
    Tipping gives us step-by-step instruction in what begins as a healing process
    and culminates in an entirely new way of living in the world. Discover how to
    transform difficult emotions like anger, fear, and resentment into unconditional
    love, gratitude, and peace. Explore the five essential stages of Radical Forgiveness
    and how they help us transcend the victim archetype and embrace the inherent perfection
    of life. And put it all into practice with the tools of Radical Forgiveness—a
    series of quick, effective, and easy-to-use techniques.


    ## About the Author


    Colin Tipping was born in England and taught at London University before immigrating
    to the United States in 1984. With his wife, JoAnn, he cofounded the Georgia CancerHelp
    Program and Together-We-Heal, Inc., and founded The Institute for Radical Forgiveness
    Therapy and Coaching. In addition to `Radical Forgiveness,` Tipping has authored
    a series of books, audios, and online programs based on the practice of Radical
    Forgiveness. `radicalforgiveness.com`

