    “没错。在那种情况下，你认为他是那个反派，而你是一个受害者。但事实是，你之所以将他引入你的生活，恰恰是因为在某种程度上，你知道他会证明你关于‘自己不够好’的信念。通过不忠诚，他证明了你对自我的认知是正确的。”


    “你是想说他在帮我吗？我可才不信这一套！”她笑着说道，但也带着一丝掩饰得并不太好的愤怒。


    “嗯，他确实支持了你的信念，不是吗？”我回答道，“你是太‘不够好’了，以至于一直在寻找其他女性，寻找‘更多东西’。如果他反其道而行，通过忠诚来一直把你当成完全足够的人，你会在生活中制造出其他的剧本来证明你的信念。你对自己的信念——尽管那是完全错误的——让你无法变得足够。”


    “同理，如果你在那个时候治愈了你内心深处关于父亲的原始创伤，并将信念改变为‘我是足够的’，亨利会立即停止向你的朋友求爱。如果他没有这样做，你会感到很开心地离开他，找到另一个会把你视作完全足够的人。我们总是根据自己的信念来创造现实。如果你想知道自己的信念是什么，看看你的生活中拥有什么吧。生活总是反映了我们的信念。”


    吉尔显得有些困惑，于是我决定重复一下我提到的某些观点。“亨利每一次背叛你时，他都给了你一个机会去治愈你那种关于不被爸爸喜爱的原始痛苦。他向你展示并演练了你的信念，即你永远对任何男人来说都是不够的。发生前几次时，你可能非常愤怒和难过，以至于触及了那种原始痛苦，并熟悉了你关于自己的信念体系。事实上，他第一次不忠的行为代表了你练习`激进原谅`（Radical
    Forgiveness）并治愈原始创伤的首次机会，但你错过了它们。你每次都证明他是错的，转而把自己造成了一个受害者，这让治愈变得不可能。”


    “你说的原谅是什么意思？”吉尔问，依然看起来很不安，“你是说我应该原谅他诱惑我的朋友，以及他能找到任何其他愿意的人吗？”


    “我是说，在那个时候，他为你提供了一个机会，让你接触到自己的原始痛苦，并看到某种关于自己的信念是如何主宰你的生活的。通过这样做，他给了你理解并改变信念的机会，从而治愈了你的原始痛苦。这就是我所说的原谅的意思。吉尔，你能看出为什么他理应你的原谅吗？”


    “是的，我想是这样，”她说，“他反映了我的信念——那个我因为觉得自己不被爸爸爱而形成的信念。他让我在‘我不够好’这件事上变得正确。是这样吗？”


    “是的，在他为你提供了那个机会的范围内，他应该归于功劳——实际上，比你现在意识到的要多。我们无法得知，如果你在那个时候治愈了关于父亲的问题，他是否会停止那种行为——或者你是否会离开他。无论如何，他对你都会非常有帮助。所以从这个意义上说，他不仅值得你的原谅，也值得你深层的感激。而且你知道吗？你没有理解他行为背后的真实信息，这并不是他的错。”

