  \ 2b 所示），并注意其中的共同元素。）*\n\n### IV. 迈向重构\n\n10. 我现在意识到，只有当他人身上共鸣了我那些否认、否认、压抑并投影到他们身上的部分时，我才会感到不快。我现在看到了这条格言的真相：“如果你发现了它，你就拥有了它！”它就在镜子里！\n\
  \n我感到：`_ 愿意` `_ 开放` `_ 怀疑` `_ 不意愿`\n\n11. `_____` 反映了我自己需要爱和接纳的部分。感谢 `_____` 这份礼物。我现在愿意收回投影，并将其视为我阴影的一部分。我爱并接纳这部分。\n\
  \n我感到：`_ 愿意` `_ 开放` `_ 怀疑` `_ 不意愿`\n\n12. 尽管我可能无法理解一切，我现在意识到你和我都在潜意识里选择了这些经历，并为了彼此而跳了这场舞蹈，以带我们进入觉醒状态。\n\
  \n我感到：`_ 愿意` `_ 开放` `_ 怀疑` `_ 不意愿`\n\n13. 我现在意识到，你 `_____` 所做的任何事并无对错。我现在能够释放指责你或任何他人的需要。我释放了在某件事上保持正确的需要，并且*愿意*看到处境本身所呈现的完美。\n\
  \n我感到：`_ 愿意` `_ 开放` `_ 怀疑` `_ 不意愿`\n\n14. 我愿意看到，出于某种原因，我的使命或“灵魂契约”包含了这些经历，且你和我可能同意在这一生中为了彼此而跳了这场舞蹈。只要这对我们双方都是最高利益。我现在将你和我从该契约中释放。\n\
  \n我感到：`_ 愿意` `_ 开放` `_ 怀疑` `_ 不意愿`\n\n15. 我从我的意识中释放所有（如 2b 所示）的情绪：*\n\n[原书中此处特意留白]\n\
  \n### V. 重构故事\n\n### 重构陈述\n\n16. 数字 1 中的故事是你的受害者故事，基于旧的现实范式（受害者意识）。现在，尝试从你新的、赋能的立场出发，对同一事件进行不同的认知（即重构），这基于你在完成此工作表过程中所经历的洞察。*（这可能仅仅是一个通用的陈述，表示你知道一切都是完美的；或者是一个包含你具体情况的陈述，前提是你确实能看到完美之处在哪里。通常你并不能。注意不要基于“人类世界”的术语进行重构。注意感受语调的任何积极转变。）*\
  \ 我现在意识到……\n\n\n\n\n\n[原书中此处特意留白]\n\n## 六、 整合转变\n\n17. 我完全原谅自己，_\\_\\_\\_\\_\\_，接纳自己作为一个充满爱、慷慨且创造力的生命。我释放所有紧贴过去的、关于匮乏与局限的情绪和想法的需求。我从过去中撤回我的能量，释放所有阻碍我深知此刻所拥有的爱与丰盛的障碍。我创造我的生活，我被赋予了重新做自己的力量，无条件地爱护并支持自己，正如我原本的样子，带着我所有的力量和光辉。\n\
  \n18. 我现在顺服于我所认为的 \\_\\_\\_\\_\\_ 高力量，并相信这种情况将继续完美地展开，并符合神圣指引和灵性法则。我承认我的合一性，感到自己已与我的源头完全重新连接。我恢复了我的真实本性——即爱，我现在将爱归还给\
  \ \\_\\_\\_\\_\\_。我闭上眼睛，感受流进我生命的爱，感受感受到并表达爱时而来的喜悦。\n\n19. 对你 \\_\\_\\_\\_\\_ 的由衷赞赏与感激。完成这份工作表后，我……我完全原谅你，_\\\
  _\\_\\_\\_\\_，因为我现在意识到你并没有做任何错，一切都在神圣的秩序之中。祝福你愿意参与我的觉醒——谢谢你——并赞赏自己愿意参与你的觉醒。我认可并接纳你原本的样子。\n\
  \n20. 写给自己的话语：\n\n[原书中此处特意留白]\n\n我意识到，我是一个在人类躯体中经历灵性体验的灵性存在，我在人性的每一个方面都爱并支持自己。\n\
  \n## # 22\n\n### 宽恕的四个步骤\n\n这一对阿诺德·帕森特（Arnold Patent[5]）所教的三步法的改编，提醒着我们：我们拥有吸引我们所需的事件和人物的力量，从而让我们感受到对某个特定问题所产生的情绪。这个过程只需要几分钟，但它字面上可以拯救你不再无尽地陷入正在发生的各种剧性冲突中，并避免在“受害者之地”（Victimland）长期逗留！\n\
  \n当事情发生且我们心烦时，我们极易忘记曾经过的关于“激进宽恕”的一切知识。在这些原则牢固植根在我们脑海之前，每当我们的心烦产生巨大的情绪动荡时，我们的倾向总是默认回到受害者意识。问题是，一旦进入了那里，我们往往会在那里待很长一段时间。如果没有激进宽恕的观点，你可能会在那儿待上几年，这正是大多数人的所为，正如底图中的虚线所示。但如果你认识一个了解激进宽恕并能识别出你症状的人，他或她会让你做一份工作表或听《激进宽恕》光盘，以便你能回到平静。正如你将在接下来的图中看到的，每当有事情发生时，我们都会默认变成受害者，并在“受害者之地”长期逗留。然后我们会被提醒万物本可以是完美的，于是我们使用这种技术来表达我们看到完美的意愿，并最终回到平静的状态。\n\
  \n不过，这可能是一段艰难的旅程，取决于你是否有一个会救你的人。停止这种过山车的方法，是在你必须为“受害者之地”订房**之前*使用这四步法！在图中，四步法的使用由那些曲线表示，这些曲线在我们通常进入意识状态的线之前稍稍停止。当我们发现自己自然而然、理所当然地使用这个过程时，激进宽恕已成为我们默认的生活方式——这无疑要容易得多！\n\
  \n所以，一旦你发现自己正为某事感到心烦，或者即使你发现自己在做评判、感到自以为是、或想要改变现状的某些方面时，请使用这个过程，让你的意识与激进宽恕的原则保持一致。（图\
  \ 18）\n\n![](img/part4_chapter22_image001.jpg)\n\n图 18：受害者之地过山车\n\n### 第一步：“看我创造了什么！”\n\
  \n第一步提醒我们，我们是自己现实的创造者。然而，我们是为了自己的治愈而创造环境，因此不要为发生的事情承担`guilt`（内疚）。由于急于评判，我们经常将这一步作为一种自我责备的方式。我们会说：“看我创造了什么。噢，太糟糕了——我一定是个糟糕的人，一个在灵性上的失败者。”请不要掉进这个陷阱，因为如果你这样做了，你就陷入了幻象。\n\
  \n### 第二步：“我注意到我的评判，并为产生这些评判而爱自己。”\n\n这一步承认了作为人类，我们会自动对情况附加一连串评判、解释、疑问和信念。我们的任务包括接纳自己人性的不完美，并为拥有这些评判而爱自己，包括那个认为我们因为创造了这种现实而必须是一个灵性枯死的人的评判。我们的评判是我们自己的一部分，所以我们必须像爱自己一样爱它们。这样做将我们与身体和思维中真实发生的事情联系起来，并通过我们的感受将我们带当下。我们的能量随后迅速转变，允许我们进入该过程的第三和第四步。\n\
  \n### 第三步：“我愿意看到情境中的完美。”\n\n“意愿”步骤是激进宽恕过程中的核心步骤。它等同于在当下对神圣计划进行祈祷式的顺服，并为自己无法直接看到这一计划而爱自己。\n\
  \n### 第四步：“我选择平静的力量。”\n\n第四步代表了之前所有步骤的结果。通过接受神圣的目标在这种情况中得到了实现，并接受所见之可能是虚幻的，我们选择感受平静，并在任何行动中使用平静的力量。当我们完全处于当下、行动清晰专注、并对自己的感受完全感知时，就能找到平静的力量。\n\
  \n尽可能多地练习这个四步法。让它成为你意识的一部分。它让你全天都能处在当下。\n\n为了帮助你将这个过程变为习惯，最好将这些步骤写在卡片上。这本书之前的版本曾有一个关于\
  \ 9/11 事件的后记，展示了在这种情况下如何使用四步法（参见更多资源）。\n\n## 23\n\n### 在他人身上看到基督\n\n如果你意识到你与他人之间正在发生的情况代表了治愈自己某些机会，你就可以通过处于当下来创造治愈体验。将你的能量带回当下的方法（而不是让大脑停留在过去或未来），只需要看向与你产生问题的人，看到他们身上的基督。\n\
  \n从这个意义上说，“基督”这个指的是他们身上神性的、与你以及上帝合一的部分。当你这样做时，你就与他们合一，在那一刻你也承认了自己内在的基督。\n\n\n\n\n\
  重要的是，要意识到投射机制不仅适用于我们的阴暗面。我们还会把自己身上那些喜欢却难以承认的特质投射到他人身上。因此，我们在那些身上看到了我们内内在的美感、自己的创造才华、自己的智慧等等。\n\
  \n# 正向反映练习\n\n这是一个由阿诺德·帕廷特（Arnold Patient）教导的练习。它对每个尝试过的人都非常有成效，因为它要求你：首先，看到他人身上奇妙之处；其次，将这种特质归为你自己的。它将人与他们的本质——与内在的基督——连接起来，并让他们真正看清自己。这个练习通常在小组环境中进行，但两个人一起做也同样好。这类似于在一个人身上看到基督，但这项练习不是静静进行的，而是通过语言并配合眼神交流完成的：\n\
  \nA 人发自内心地对 B 人说：“我在你身上看到的、你折射在我身上的那些美好的特质，是……” B 人倾听并回答道：“谢谢。”然后他们交换角色并重复这一练习。\n\
  \n# 24\n\n## 原谅是一个三个字母的单词\n\n这个工具只需涉及写三封信给那个让你觉得欺犯过或伤害过你的人。当你对刚刚发生的事情感到非常愤怒时，它的效果非常好；即使对于很久以前发生的事情也有效。\n\
  \n在第一封信中发泄你所有的愤怒。不要留情。如果这让你感觉好，你可以威胁要进行最卑劣的报复。一直写下去直到你无话可说。写这封信的过程可能会让你流下许多眼泪——愤怒、悲伤、怨恨和受伤的泪水。让它们流出来吧。在身边放一盒纸巾。如果你很愤怒，对着枕头尖叫，或者做一些体育活动来帮助释放你的愤怒。在任何情况下都不要邮寄这封信！\n\
  \n第二天，写另一封信。这封信的愤怒和报复之情要少一些，尽管它仍然不会让那个令你生气的人因你认为他们所做的事脱脱。然而，它应该努力将同情、理解、慷慨，以及某种原谅的可能性纳入考量。这封信也不要邮寄。\n\
  \n第三天，写第三封信。在这一封信中，尝试根据“激进原谅”（Radical Forgiveness）的原则对情况进行新的解释。由于这模仿了激进原谅的工作单，请参考工作单上的笔记作为信件的指南，但要尽可能用你自己的话来写（见第\
  \ 21 章）。起初这可能很困难，但请坚持下去。记住，在真正做到之前，你必须先假装一段时间。\n\n这些信从未被邮寄过——这样做既没有必要也没有意义。它们的设计初衷是改变你的能量，而不是接收者的能量。发泄你的感受，而不是再次将其投射到他人身上，是我们的目标。特别是寄出那封愤怒的信，毫无用处。这样做只会让攻击-防御循环持续下去，并将你进一步拖入戏剧性的深渊。记住，当你将能量向着激进原谅的方向转变时，对方的能量会自动发生变化。\n\
  \n你可以保留这些信以备后用，或在原谅仪式中使用它们。我个人的倾向是使用火仪式来转化它们。当你看到自己的文字变成灰烬并随着一缕烟升起时，会发生某种力量。\n\n\
  # 25\n\n## 原谅仪式\n\n仪式的力量在当今社会被低估了。当我们把任何程序仪式化时，我们就让它变得神圣；因此，仪式直接与我们的灵魂对话。虽然仪式可以非常简单，也可以相当复杂，但复杂性不如你对仪式展现出的敬畏重要。仪式邀请了神性参与人类事务，因此，它代表了另一种祈祷的方式。\n\
  \n当我们亲手创造仪式时，仪式会变得更加强大。在设计自己的仪式时，请尽可能发挥创造力。不过，这里有一些你可能需要的通用指南和想法。\n\n### 火之仪式\n\n\
  火一直是转化和炼金术的元素。每当我们通过火献上某物时，我们就触及了对火转化力量的原始信仰。因此，焚烧激进原谅工作单、释放信或三连信的仪式，提供了一种完成感和转化感。带着仪式感和敬畏之心进行焚烧。在物品焚烧时祈祷。\n\
  \n焚烧香木、鼠尾草、甜草和香会增强任何仪式，并为原谅仪式带来特殊的意义。鼠尾草和甜草烟还能净化你的气场，从而从你的能量场中清除不需要的能量。\n\n### 水之仪式\n\
  \n水具有治愈和清洁的，我们赋予它使事物神圣的能力。仪式化的洗涤、浸泡和漂浮都可以产生良好效果。例如，与其焚烧释放信，不如将其折成一只小船，让湍急的溪水带走它。\n\
  \n### 发挥创意\n\n在你的仪式中发挥创造力，让它们对你产生意义。你可能记得 Jane 的故事，她患有脑癌，在阁楼上放了一个盒子，里面装着与一个让她心碎的人有关的一切物品。我让她把盒子从阁楼取下来，带去参加治疗。如果她不是在我们这样做之前发作并去世，我们就会打开盒子，检查里面的每一件物品以及它们对她意味着什么。然后我们将通过对她有意义的仪式逐一处理它们。这个过程将释放许多被压抑的能量。\n\
  \n# 26\n\n## 艺术化的原谅\n\n艺术为原谅和情感释放提供了强大的工具。我有幸见证或参与的通过艺术进行的最具戏剧性的治愈之一，发生在我在英国举办静营期间。参与者之一是一个患有多发性硬化症的年轻女性。她的身体虚弱枯竭，声音几乎听不见。她的喉轮几乎关闭了。她有一个丈夫和两个孩子，但这段婚姻基本上不存在，她感到被困、无助和绝望。\n\
  \n在一次小组艺术治疗期间的某时刻，她开始以一种特别引人注目的方式画。她无法说话，但一直画。起初很难辨认她在画什么，但随着时间的推移，很明显她正在利用这种媒介作为一种回归的方式来释放童年的痛苦。\n\
  \n我和妻子坐在她身边，看着她画了一个又一个，随着时间的推移，她的画变得越来越幼稚。除了画作之外，她偶尔还会涂下“坏女孩”、“上帝不爱我”等表达深层羞耻、内疚和恐惧的词。最后，她画了一个简陋的火笔画，那是她后来回忆起的童年被舅舅侵奸。在这种宣泄式的释放中，她通过绘画表达了她无法用语言和声音说出的东西。她的喉轮是因为她被迫用嘴所做的事情而关闭的。\n\
  \n\n\n为了支持这位女性进行宣泄，我的妻子走向我们举办静修的那个相当大房间的远端。然后，我们让她用自己的声音告诉我的妻子，她是一个好女孩，上帝爱她。我让她说话的声音越来越大，直到她用尽全身的力气大声叫喊。在她在大声呼喊了大约二十次“上帝爱我！”之后，她停下来，看着我并肯定道：“他真的在爱我，不是吗？”那个治愈的时刻我将永远忘记。\n\
  \n在我们从英国回来三个月后，我们收到了她的来信，说她已经离开了丈夫，找了新住处，并找到了一份工作。她正在运用自己的声音去索取她想要的东西，她发现自己不仅有索取的力量，还有接受的力量。她甚至为多发性硬化症患者建立了一个支持小组，并和他们一起进行艺术治疗。她的力量一天一天地恢复，三年后我们仍然能听到她的消息，并对她不断增长的力量感到惊叹。\n\
  \n## 艺术治疗作为一种工具\n\n如果你不是一个善于言辞的人，也不习惯写下什么，请尝试画画。你可能会对这种沟通方式所产生的结果感到惊讶。买一些尺寸合适的白纸和黑纸，以及一些彩色蜡笔和粉笔。（粉蜡笔在黑纸上的效果非常好。）\n\
  \n要记住，使用这种工具完全不需要任何艺术天赋：它并不是为了画出漂亮的图片。事实上，如果你满腹愤怒，你的画作可能一点也不美。它的意义在于是将情绪和想法投射在纸上。\n\
  \n在没有任何预期或预设设想的情况下开始画画。你可以请求上帝或你的精神向导，帮助你通过绘画和上色的过程释放任何需要释放的情绪——然后直接开始即可。无论什么涌来，就让它来。不要评判。顺其自然。像冥想一样去做。如果你想讲一个故事，就去讲。如果你只想运用颜色，就去用。做任何你想做的。\n\
  \n要将艺术治疗作为原谅工具，可以使用类似于“信件三部曲”的方法。画一系列画，表达你对某个人对你所做的事情的感受；这些画将表达你的愤怒、恐惧、痛苦、悲伤等。然后进入一个更具慈悲和理解的心态，画一些反映这种态度的画。再画第三组画来表达“激进原谅”（Radical\
  \ Forgiveness）的感觉。你可能想在每个阶段之间留出时间，也可以一次性完成。然而，请确保一旦开始进行这种艺术治疗，就完成所有三个阶段——即使你总共只画了三幅画。例如，只做第一幅可能会让你陷入愤怒中无法自拔。\n\
  \n当你完成每一幅画时，把它挂在墙上。按照你完成的精确顺序放置这些画，在墙上创造出一条垂直或水平的条带。如果你是垂直展示，请从底部的第一张愤怒画开始，以顶部的最后一个激进原谅画结束。当你以这种方式放置它们时，你会惊讶地看到每幅画所表达的能量质量的进展和变化。\n\
  \n给每幅画命名并注明日期。花些时间和这些画在一起。让它们向你“说话”。在你画每一幅画时，你在思考某些想法。当你以后看这些画时，清空脑海中的那些想法，检查画作中是否有其他重要的内容。邀请你信任的人对这些画给出他们的解读；他们可能会看到你没有看到的东西。通过说来征他们的意见：“如果这是你的画，你会看到什么？”如果他们看到的与你产生了共鸣，很好。如果对你来说并不完全真实，也可以。他们是通过他们自己的潜意识而不是你的来洞察你的画作，但你会发现他人的观察会在你内心引发一种全新的观察画作的方式，你可能会因此产生新的见解。\n\
  \n# 27\n\n### 悟道呼吸（Satori Breathwork）\n\n正如我们之前讨论过的，压抑或受抑制的情绪对我们的身心健康都有毒影响。释放这些情绪是激进原谅过程的第一步。我们可以在经验老师的指导下，通过使用名为`Satori\
  \ Breathwork`（悟道呼吸）的过程最快、最有效地释放积压的情绪。（Satori 是一个日语单词，意为“洞察”或“觉醒”。）\n\n`Satori Breathwork`通常仰卧进行，涉及以全意识的圆形模式进行呼吸。换句话说，你有意识地呼吸，吸气和呼气之间没有停顿。整个过程中会播放响量较大的音乐。\n\
  \n这个人通过张嘴呼吸四十到六十分钟，有时长而深地进入腹部，有时快速而浅地进入上胸部。这使身体氧化到某种程度，身体从细胞中释放出在细胞内结晶为能量粒的受抑情绪。当这些能量粒被释放时，人通常会意识到当下的这些旧感受。\n\
  \n这些感受可能以纯情感的形式表达，如悲伤、愤怒或绝望，且与与之相关的任何记忆无关。相反，导致这种情绪产生并被压抑的事件、想法、联想或误解的记忆可能会清晰地进入焦点。它甚至可能以符号的方式或隐喻的形式出现。对于每个人和在每次呼吸练习中，体验都是不同的——也是无法预测的。\n\
  \n随着情绪涌起，这个人“通过呼吸”处理它们，这让人不仅能够充分感受到它们，还能释放它们。我们经常为了控制情绪而停止呼吸，因此，通过呼吸来处理它们能让这种感受和释放得以发生。在某些情况下，人会在呼吸时通过口头和肢体动作表达出来。无论情绪是如何释放的，这个过程几乎都会带来深邃的宁静和内在的和平。\n\
  \n这种简单的技术提供了戏剧且持久的治愈效果。对于任何认真想要清理“情绪衣柜”的人，我毫不犹豫地推荐它。（更多信息请参见“更多资源”。）\n\n`Satori\
  \ Breathwork`的效果之所以是深刻的，是因为它们完全发生在个人内部，没有任何引导者的任何干预、指导、引导或操纵。事实上，引导者的存在仅仅是为了维持空间的安全，并支持呼吸者经历这些感受（有时这些感受令人恐惧），而不是再次压抑它们。出于这个原因，我不建议你独自进行这个过程。\n\
  \n\n\n\n\nSatori 呼吸法的另一个巨大好处在于，它能将新的能量模式整合进我们现有的能量场，并相应地重构我们的精细体。这意味着当你转变感知、产生洞察或释放旧的情绪模式时，呼吸法会将这些整合到你的`body’s`数据库中。用计算机类比，这就像是呼吸法充当下载过程，将目前存储在计算机短期内存中的数据传输到硬盘进行永久存储。\n\
  \n这也解释了为什么 Satori 呼吸法在“激进原谅”（Radical Forgiveness）过程中如此重要。它完成这些任务不仅是在过程开始时为了释放情绪，在之后也是如此——因为当我们的信念系统发生变化，能量场中随之产生的所有变化都需要被整合时。整合过程将这些变化锚定在我们身体中，帮助我们防止回到老路。\n\
  \n我建议你在一段时间内进行十到二十次受监督的呼吸练习，这可能需要一年的时间。之后，你可能就可以自己进行呼吸练习了。\n\n# 28\n### 激进释放信\n\n\
  《释放信》改编自催眠治疗师兼身心治疗师 莎龙·福雷斯特（Dr. Sharon Forrest）博士给我的的一封信。她来自墨西哥的福雷斯特基金，这是一个致力于替代性整体疗法的非营利机构。\n\
  \n《释放信》向你的高我（Higher Self）以及你存在的每一个部分宣告：你完全允许任何情境中仍然存在的所有不原谅的方面得到释放。它也是一种自我原谅的工具，因为它承认你创造这些经历是为了学习和成长。\n\
  \n请复印下一页所写的信件，并将其放大到合适的尺寸。要使用这封释放信，请填写空白处，请某人见证，然后以仪式的方式将其焚毁。\n\n日期：`\\_\\_\\_\\\
  _` 姓名：`\\_\\_\\_\\_`\n\n亲爱的高我：\n\n我，`\\_\\_\\_\\_`，特此授予我的高我、我的灵魂、我的超意识、我的`DNA`、我的细胞记忆，以及我所有可能出于任何原因想要留住不原谅的部分，许可释放所有的误解、毫无根据的信念、误读和误导的情绪，无论它们存在于何处，无论是在我的身体、我的潜意识、我的`DNA`、我的意识、我的潜意识、我的脉轮（chakras），甚至我的灵魂中，并请求所有希望我一切顺利的人协助这一释放过程。\n\
  \n我，`\\_\\_\\_\\_`，感谢我的灵魂，创造了这些产生不原谅的经历，我意识到在某些层面上，它们都是我的老师，并为我提供了学习成长的机会。我不带评判地接受这些经历，并特此将它们释放到它们来源虚无中。\n\
  \n我，`\\_\\_\\_\\_`，特此原谅`\\_\\_\\_\\_`。\n\n我将他/她释放给其最高利益并让他他/她自由。我祝福他/她愿意做我的老师。我切断对这个人的所有不健康的依恋，并向他/她发送无条件的爱和支持。\n\
  \n我，`\\_\\_\\_\\_`，特此原谅我自己，接受原本的自己，并无条件地爱我原本的自己，伴随着我所有的力量与光辉。\n\n我，`\\_\\_\\_\\\
  _`，特此将我自己释放给我的最高利益，并为自己索取自由、梦想、愿望和目标的实现、清晰、爱、充分的表达、创造力、健康与繁荣。\n\n签名：`\\_\\_\\_\\\
  _` 日期：`\\_\\_\\_\\_`\n\n见证人：`\\_\\_\\_\\_` 日期：`\\_\\_\\_\\_`\n\n# 29\n### 原谅之玫瑰\n\
  \n当我们向他人敞开心扉时，我们会变得脆弱，并面临成为他们投射目标的危险。他们的心理能量可能会与我们的混合，这会耗尽我们的能量。\n\n我举办的工作坊做得越多，就越意识到，在很多情况下，人们似乎与某个特定个人产生的问题，源于后者能够进入并操纵他们的能量场。几乎总是，与他们产生问题的人似乎是通过`第三脉轮`（third\
  \ chakra）进入的，那是权力和控制问题所在。一旦进入，那个人就很容易控制他们——抽取他们的能量或随心所欲将自己的能量倒在他们身上。当然，这一切都是在潜意识中完成的——没有意识，希望也没有恶意——但对于被操纵的人来说这可能是筋疲力竭，并给关系带来巨大压力。\n\
  \n你可能不会惊讶地发现，通常是母亲在进行侵入和控制——我还要补充一点，甚至在坟墓也是如此。也可能是父亲、配偶或其他任何想要对人的生活拥有某种控制权的人，但大多数是母亲。\n\
  \n停止这种行为或防止其发生在你接触的人身上最简单的方法，就是在你和他人之间放置一朵想象中的玫瑰。这是一种令人惊讶的强大保护装置。\n\n在许多神秘文献中，玫瑰是心理保护的象征。出于原因，它在这方面具有巨大的效力，可能是因为它是爱的通用符号。视觉化玫瑰可以让我们免受他人投射的伤害，提供了一种在不向他人关闭心灵的情况下阻隔负能量的方法。无法解释为什么玫瑰的视觉化在这方面如此有效；事实上，我们可以用任何形式的视觉化建立心理保护，因为仅仅这样做就创造了自我保护的意图。但玫瑰数百年来一直用于此目的，似乎比大多数其他符号都更有效。\n\
  \n所以，从现在起，每当你遇到不想让能量与你混合的人时，想象玫瑰存在于你光场的边缘，或者位于你与那个人之间的中间。然后注意你在他们身边时感觉有何不同。你应该在陪伴对方的同时，感受到更强的自身空间感和身份认同。你不需要出现在某人的物理场中，他们就能控制你的能量，因此即使在通话时建立你的玫瑰也是个好主意。（图\
  \ 19）\n\n![](img/part4_chapter29_image001.jpg)\n\n图 19：玫瑰\n\n# 30\n### 为内在小孩守灵\n\
  \n我们的灵性演化很大程度上取决于我们从最糟糕的成瘾中恢复——我们对“受害者原型”的成瘾，它将我们困在过去并榨干我们的生命能量。内在小孩仅仅是我们伤口和一种可怜的受害者意识的隐喻。将我们的受害者意识包裹在婴儿衣里并让它变得更容易被接受。唤起内在小孩仍然代表着成瘾行为。\n\
  \n请注意，我指的不是那种顽皮、富有创意且肯定生命的内在小孩，例如理查德·巴赫（Richard Bach）[6]描述的那种，或者是我们身上那个出来启发并唤醒我们的部分。我指的是那个住在头脑后房间里、哭闹的小鬼，那个总是可以信赖用来指怪他人导致我们不快乐的不快乐受害者。这就是我们在\
  \ 80 年代在那些内在小孩工作坊中讨好的那一个。\n\n\n\n\n\n为了我们的精神进化以及最终从“受害者原型”中解脱，我们必须慈悲地给内心那个顽童的生活画上句号。因此，我建议你举行葬礼，并宣布他或她已经死亡。如果你选择进行这项练习，你可能会对失去内在小孩感到哀伤，这没关系。毫无疑问，多年来你的内在小孩在你的痛苦中给予过你慰藉和安慰，但现在是时候前行了。激进宽恕让你不再需要执着于受伤，所以现在就允许自己释放你的内在小孩吧。\n\
  \n只要你还抓着过去的伤口，激进宽恕就不可能实现。执着于内在小孩只会阻碍你，因为那个孩子代表了你过去的伤口。当你想要继续生活时，你可能会惊讶地发现，你的内在小孩也想向前走！要释放你的内在小孩，请尝试以下冥想。\n\
  \n### 葬礼冥想\n\n舒服地坐好，深呼吸三次，随着呼吸呼出身体，让身体放松。注意身体内任何仍然紧绷的部位。有意识地放松这些部位，知道在这次冥想过程中，你的身体会随着每一次呼吸不断放松——很快，你将从头到脚感到彻底放松。现在看向你的内心，找到那个房间，那里坐着那个自愿承担你痛苦的年轻人。找到那个怀着你被虐待、忽视、背叛、遗弃、不被接受或不被爱的记忆的内在小孩。\n\
  \n当你在这个房间里遇到这个小人时，注意到他或她周围环满了清单、账簿、图表和评分卡。房间的墙上贴满了人的名字、他们对你做过的事，以及你认为他们应该受到的惩罚。在账簿中，孩子仔细记录了他人受害你的每一个时刻，以及你为此付出的代价。注意这个房间里毫无喜悦。当你看着这个年幼的孩子时，意识到他或她独自被锁在里面与痛苦为伴，陷在受害者意识中，内心是多么悲伤。\n\
  \n意识到是时候做出改变了，你穿过房间，推开窗户让阳光照射进来。当阳光洒满房间，墙上图表上的墨水开始褪色，账簿开始化为灰烬。钉在墙上的清单也落在地上并融化。看着在这个房间里生活了多年、日复一日记录着怨恨分值的小人。看到他或她宽阔的笑容和喜的表情。\n\
  \n“现在我可以自由离走了，”孩子说道。\n\n“去哪里？”你问道。\n\n“我可以自由去下一个地方了。我本该多年前就离开的，但我一直在等你把我从这份工作中解脱出来。”\n\
  \n突然，你注意到这个不久前还那么年轻、像孩子一样的人就在你眼眼前变老、变得枯萎、白发。然而，一种巨大的平静已经取代了他或她的悲伤。\n\n“谢谢你让我走，”他或她喘息着，缓慢地躺在沙发上。\n\
  \n你说：“抱歉花了这么久才把光带进这个房间。抱歉我拖了你的后腿。”\n\n“没关系，”传来轻柔的回道，“真的没关系。反正时间只是幻象。再见。”说完，小人去世了，神情平和而宁静。\n\
  \n你慈悲地用白布裹住这个小人，将遗体带上楼，走向光亮。那里有一辆马车在等候，天使在附近盘旋，轻声歌唱。你生命中出现过的所有人都在等待着致意。所有的过去伤害都已被原谅。爱无处不在。马车上的铃铛轻声作响，随从队开始缓慢走向准备好墓地的山丘。在墓旁，每个人都在歌唱，巨大的喜悦笼罩着众人。你的天使与你在一起，支持你完成最后的告别。看着小人在天体合唱团的歌声中，被慈悲而温柔地放入墓中。当墓石被放在墓上时，你感到一种新的自由和爱流经全身。\n\
  \n你走到山脚，发现那里有一条湍急的小溪。你用水洗手、脸，看到了自己的倒影。感受溪流洁净的水流过你的存在，带走了小人曾经居住的房间里所有的尘土和碎片。听听水流过岩石的声音。看到阳光在水面上闪烁，感受阳光洒在身上的温暖。注意周围绿色的田野和许多鲜艳的花朵。一切都好。当你觉得准备好时，随时睁开眼睛。\n\
  \n没有了受伤的内在小孩会感到很奇怪，但你也将开始注意到一些积极的变化。你会感到更轻盈、负担更少、更活在当下。当你找回曾经用于执着内在小孩伤口的能量时，你的生命能量将会增加。\n\
  \n做好准备，可能会与以前与你分享伤口的亲密朋友产生问题。他们不会喜欢你的这种变化，因为他们会看到你不再赋予伤口力量。如果你是某些以分享伤口为核心的支持小组成员（例如酒精成瘾者\
  \ `ACOA` 或性侵幸存者），请做好准备与小组脱节。\n\n# 后记\n\n在最初出版这本书的十二年后，我终于跟上了自己的思维：激进宽恕远不止是一个简单的宽恕过程——事实上，它比我想象的要大得多。\n\
  \n\n\n\n但它带给人类的真正惊人的礼物在于它能够作为一座桥梁：一座能让我们在不知不觉中，于三维现实与四维现实之间自由、轻松移动的桥梁。这座桥梁让我们能够在身体存在前者的同时，以后者的爱振动进行运作。这种桥梁是必要的，因为尽管我们深处知道四维现实是基于爱、和平、合一和喜的——而且我们极渴望去那里——但对于放弃那些如此熟悉的东西，我们感到恐惧。尽管目前的现实是基于恐惧、分离和痛苦的，事实依然如此。怀疑是真实且根深蒂固的——万一我跳入虚空，发现另一种现实根本不存在怎么办？\n\
  \n所以，虽然`激进宽恕`（Radical Forgiveness）技术表面上是为了帮助我们原谅自己和他人，但它的真实目的是赋予我们一个机会，在对自己实际存在于那里完全无所知的情况下，`练习`处于那种另一种现实。它诱导我们认为自己只是在做一份宽恕工作表或其他过程，而事实上，我们正——在没有意识的情况下——实际上正在跨越那道鸿沟，并在四维现实中运作。通过使用“障眼法”和无知的赐赐，我们的自我乐此地配合了这个过程。\n\
  \n就像其他任何事情一样，我们对某件事练习得越多，对它的恐惧就越少。当我们准备进行转变时——我相信这迫在眉睫——我们将如此习惯于处于基于爱的现实的振动中（通过使用`激进宽恕`），以至于我们对做出最终跳跃的恐惧将烟消云散。\n\
  \n这引出了刚参加完我研讨会的人经常问的问题：“我该如何保持在`激进宽恕`的振动中，而不被周围的世界拉回受害者意识中？”\n\n简单的回答是——继续使用这些工具。我们每一次练习`激进宽恕`，就会越来越地锚定在四维现实中，反之，我们选择回到三维现实的可能性也越来越小。最终，它将成为我们默认的生存方式，我们将在更高的频率上变得完全稳定。\n\
  \n但这个问题还有一个我们必须解决的更深层次的方面。为了继续使用这些工具，让我们留在四维现实中玩并提升我们的振动，我们必须保持清醒。\n\n请参阅`受害者之地过山车`（Victimland\
  \ Roller Coaster）图表，见“图 18”。在这里看到，如果我们情绪波动到超过了标记精神意识丧失和进入受害者之地的线条，我们就陷入了巨大的麻烦。结果是我们的振动频率急剧下降，并失去了对新现实的感知。我们发现自己回到了分离的世界和基于恐惧的现实中——回到了自我的掌控之中。此时，我们脑海中最不想想的事情就是做工作表或听`激进宽恕`光盘。简而言之，我们迷失了。\n\
  \n我现在认为这种现象不仅是那些通过`激进宽恕`体验获得收获的人的一种挫折（正如关于陷入受害者意识的问题所暗示的那样），而且最可能阻碍实现“在 012 年之前创建一个宽恕世界”这一使命的因素。\n\
  \n如你所知，要创造这种觉醒，需要一定临界质量的人其意识足够提高，以抵消许多振动频率保持低水平的人。因此，对于所有振动被提升过的人（即使是通过阅读这本书），保持清醒并参与到让他们持续跨越那座桥梁的过程中是至关重要的。\n\
  \n到为止，我使用`激进宽恕`的主要目标一直是治愈我们的伤口并释放能量块，以改善我们的生活——并不是说我将其局限于个人，因为我发现它对于治愈社区来说同样是非常高效的技术。在澳大利亚的工作让我有机会在当地和解运动的背景下尝试它，在那里，白人和澳大利亚原住民正聚在一起，治愈他们可怕的过去。我在那里编写并出版了一本书，名为`通过激进宽恕实现和解：治愈社区的灵性技术`。这本书的设计是为了给澳大利亚所有想要实现和解的人提供实现这一点的灵性技术——一种他们可以在家里、学校和社区中使用的工具。我现在正在对企业做同样的事情。\n\
  \n所以是的，当然，这项工作将继续，但我和`激进宽恕学院`（Institute for Radical Forgiveness）的同事们也将将关注重点扩展，包括帮助人们不仅保持在`激进宽恕`体验中获得的高振动频率，还要稳步将其增加到尽可能高的水平，这样就没有回头路。\n\
  \n为此，我们创建了一个`激进赋能`（Radical Empowerment）计划，旨在使人们能够以比常常更高的振动频率运作，而不是总是成为因果世界中的“果”，而是成为自己生活的“因”。`激进赋能`是`激进宽恕`（清理过去并有效处理现在）和`激进显化`（创造未来）的结合。因此公式是：`RE=RF+RM`。通过这种方式赋能的人将能够轻松快速地显化他们想要的东西。\n\
  \n我们灵性赋能的关键之一，也是我们保持与`激进宽恕`振动联系的核心，是系统地开发我们意识中被称为被称为`观察者`（observer）的部分。这是我们自身具有自我意识的部分，能够见证或观察内部整个自我群体。从我们之外或独立于我们自己的视角出发，如果经过训练，它会注意到我们何时开始进入无意识状态。然后它会采取步骤将我们带回来——可能通过提醒我们在那一刻执行四步法，或者听`激进宽恕`光盘。受过训练的`观察者`将使我们远离`受害者之地`——让我们在生活中保持自由并始终拥有选择。\n\
  \n另一个不可避免出现的问题是：“我该如何有效地将`激进宽恕`技术应用到我生活的每个领域？”\n\n这个问题的答案也包含在`激进赋能`计划中。一旦你将`激进宽恕/激进显化`模型整合到你的意识中，并将`观察者`培养到相当高的程度，你将自然开始在生活的每个方面利用`激进赋能`。这很难办不起来。\n\
  \n当人们意识到这项工作具有改变世界的潜力，并在身上看到了从事有意义的灵性工作的可能后，第三个问题是：“我该如何与他人分享这些？”\n\n\n\n\n回答这个问题的另一种方式是指出，“激进宽恕”（Radical\
  \ Forgiveness）是一种口口传播的现象。1997 年当我第一次出版这本书时，我收到一封来自亚特兰大最大的独立书店之一的店主的信。她说，她注意到人们会进店买一本书，然后在大周左右又回来买六本送给朋友。她写道：“我看到这种现象只在另外两本书上发生过——《神圣奇言》（Celestine\
  \ Prophecy）和《与上帝对话》（Conversations with God），这两本书都已成为畅畅销书。”我并不是建议你一定要出去买六本送给别人，但如果你只是简单地告诉朋友“激进宽恕”，你也将做出巨大的贡献。如今，可能没有比这更好的方法，就是给你通讯录中你认为可能感兴趣的每个人发送一封电子邮件了。\n\
  \n所以，事实就是这样——“激进宽恕”终于浮出水面了。它一直伪装成一种治愈你生活的方法（当然，它确实如此），但现在它被“揭露”是一项强大的技术。它不仅能帮助你治愈并消除生活中的障碍，还能显著提高你的频率，让你完全觉醒，并帮助你成为一个被赋能的灵性存在，能够完全在现实的第三、第四——乃至第五维度之间轻松切换。\n\
  \n这也是我们每个人（无论是个人还是集体）为世界产生重大影响的方式。随着我们振动频率的提高，我们会发现自己被召唤去更多地帮助他人，并为大觉醒做好准备。\n\n\
  感谢你与我共同开启这段旅程。有很多值得期待和兴奋的事情，我很感激你出现在我的生命中。\n\n*Namaste* 柯林·蒂平（Colin Tipping）\n\n\
