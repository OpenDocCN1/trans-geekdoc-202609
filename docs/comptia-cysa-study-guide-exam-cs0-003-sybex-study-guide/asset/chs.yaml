  \   3. IDS（入侵检测系统）\n   4. DLP（数据泄露防护）\n\n7. Tamara 是一家遭受安全漏洞的企业的网络安全分析师。她认为攻击者入侵了包含敏感信息的数据库。下列活动中哪一个是\
  \ Tamara 的首要任务？\n   1. 识别攻击源\n   2. 根除\n   3. 遏制\n   4. 恢复\n\n8. 在教训总结审查中应该明确识别哪些内容，以减少未来类似事件逃避关注的概率？\n\
  \   1. `IoCs`\n   2. 范围\n   3. 影响\n   4. 重新映像\n\n9. 下列哪项信息对于开展可靠的事件恢复工作至关重要？\n \
  \  1. 攻击者身份\n   2. 攻击时间\n   3. 攻击根源\n   4. 对其他组织的攻击\n\n10. Lynda 正在处置一个在网络安全响应期间收集的包含敏感信息的硬盘。这些信息被类为高安全风险，她希望在未来的事件中重用该介质。这些信息的适当处置方式是什么？\n\
  \    1. `Clear`\n    2. `Erase`\n    3. `Purge`\n    4. `Destroy`\n\n11. 下列活动中哪一项通常不在恢复验证阶段进行？\n\
  \    1. 验证分配给每个账户的权限\n    2. 实现新的防火墙规则\n    3. 进行漏洞扫描\n    4. 验证日志功能是否正常\n\n12.\
  \ 哪种事件响应活动专注于删除组织网络中可能留下的事件痕迹？\n\n\n\n\n\n### 1. 抑制\n2. 恢复\n3. 事件后活动\n4. 根除\n\n\
  13. 下列哪不是正式事件报告的常见用途？\n1. 培训新团队成员\n2. 与其他组织共享\n3. 开发新的安全控制措施\n4. 协助法律行动\n\n14. 下列哪个数据元素通常不会包含在证据日志中？\n\
  1. 序列号\n2. 处理记录\n3. 存储位置\n4. 恶意软件签名\n\n15. Sondra 确定攻击者已经访问了一个包含关键业务文件的服务器，并希望确保攻击者无法删除这些文件。以下哪种策略能满足\
  \ Sondra 的目标？\n1. 隔离\n2. 分段\n3. 移除\n4. 以上均不是\n\n16. Joe 想要确定在事件响应过程中用于收集高度敏感证据的闪存驱动器的适当处置方式。他不需要重复使用该驱动器，但想将其归还给所有者（一个外部承包商）。适当的方式是什么？\n\
  1. 销毁 (Destroy)\n2. 清除 (Clear)\n3. 擦除 (Erase)\n4. 净化 (Purge)\n\n17. 下列哪项通常不在网络安全事件报告中？\n\
  1. 事件时间轴\n2. 攻击者身份\n3. 影响估计\n4. 教训总结文档\n\n18. 哪个 NIST 出物包含了网络安全事件处理的指南？\n1. SP 800-53\n\
  2. SP 800-88\n3. SP 800-18\n4. SP 800-61\n\n19. 下列哪项不是净化活动？\n1. 重置为出厂状态\n2. 覆盖\n\
  3. 块擦除\n4. 密码擦除\n\n20. Ben 正在响应安全事件，并确定攻击者正在使用 Ben 网络上的系统攻击第三方。以下哪种抑制方法可以防止 Ben\
  \ 的系统被以此方式使用？\n1. 移除\n2. 隔离\n3. 检测\n4. 分段\n\n# 领域 IV\n报告与沟通\n\n## 第 12 章\n报告与沟通\n\
  \n报告和沟通是所有类型组织多个内部和外部流程的一部分。内部沟通和报告流程对于确保漏洞管理工作的成功至关重要。它们有助于确保利益相关者了解需要发生什么、漏洞管理计划是否有效且成功，以及是否存在关键缺口或需求。它们还可以帮助获得适当的领导关注，从而有助于确保有可用资源来及时进行漏洞修复。\n\
  \n事件响应过程也在此整个事件响应过程中依赖于报告和沟通。如果没有沟通，事件响应往往会崩溃，导致产生更多问题。在事件响应过程期间和事后的报告有助于确保事件得到适当且充分的解决，且这两者可能都是合同或法律的要求。\n\
  \n在本章中，你将学习如何在漏洞管理和事件响应中使用报告和沟通。你将学习如何识别利益相关者、如何创建报告以及如何使用指标。\n\n## 漏洞报告与沟通\n\n\
  有效的漏洞管理计划需要创建报告并将其分发给责任方。它们还需要持续的沟通，以确保漏洞管理的状态得到良好的理解。\n\n### 漏洞报告\n\n漏洞管理需要向系统管理员和安全人员提供报告。报告通常包含许多常见元素：\n\
  \n*   漏洞，包括 `CVE` 编号、`name` 和 `description`。\n*   `affected hosts` 列表，带有 `IP address`\
  \ 和 `hostname`。\n*   提供严重程度衡量的 `risk score`。\n*   `Mitigation options`，包括 `patches`、`updates`\
  \ 和 `workarounds`。\n*   关于 `recurrence` 的信息。如果漏洞再次出现，这通常意味着出了某些问题并需要调查。\n*   `Prioritization`\
  \ 信息，将帮助负责人确定需要先完成哪些工作。优先级信息通常依赖于风险评分、`CVSS scores` 和组织策略，以优先处理重要的漏洞。\n\n漏洞报告通常以自动方式创建，因为它们是周期性的，并且对于大型组织或复杂环境，可能会达到很长的。坦率地说，自动化补丁工具和集中管理软件有助于减轻大规模漏洞修复的负担。\n\
  \n随时间跟踪漏洞信息和对报告的反馈对于漏洞管理计划的成功关重要。责任方需要方法来标记误报和通融方案，并调整风险评分和其他配置项以匹配环境、风险和安全策略。\n\
  \n### 利益相关者识别与沟通\n\n漏洞报告需要了解所涵盖系统和服务的适当利益相关者是谁，并确保及时进行向每个利益相关者提供适当信息的沟通。\n\n利益相关者通常可以分为以下几类：\n\
  \n*   技术利益相关者，他们需要有关漏洞、修复和缓解方案以及优先级的信息，以便他们按照适当的重要性顺序完成所需工作。\n*   安全、审计和合规利益相关者，他们需要组织整体漏洞状况视图，以及关于反复漏洞和其他趋势信息。\n\
  *   安全管理和监督系统，它们摄取漏洞信息为安全运营提供额外的上下文，并需要通过 `APIs` 或其他接口以标准格式自动地获取安全报告信息。\n*   执行或领导人员，他们提供监督并对组织的整体性能和安全负责，并需要正在进行的漏洞修复实践的仪表板级视图。\n\
  \n### 合规报告\n\n\n\n\n\n漏洞管理系统通常具有专门的报告，旨在提供与 `PCI` 标准等常见合规目标一致的合规信息。当组织的合规要求与常见标准不一致时，它们需要构建自己的报告，以满足这些标准中的要求。\n\
  \n与其他报告一样，`compliance reporting`（合规报告）应该定期进行，通常与标准本身概述的报告要求保持一致。报告可能需要提供给认证机构，或者仅保留作为持续符合该标准的证明。\n\
  \n# 行动计划\n\n虽然漏洞管理的大部分工作是简单地安装补丁来修复漏洞，但行动计划中还可能涉及其他处理漏洞的要素。`CySA+` 考试目标列出了许多你需要关注的此类内容。\n\
  \n## 配置管理\n\n`configuration management` 是漏洞管理的关键部分。仅仅通过配置和服务和应用程序不暴露可能存在漏洞的端口、移除或更改默认配置，以及其他方式对系统和服务进行加固，都是漏洞管理中重要的一步。这意味着配置管理、配置管理工具的使用以及基准配置的都是漏洞管理行动计划的共同部分。\n\
  \n## 补丁\n\n虽然 `patching` 看起来是一个简单的课题，但补丁的行动计划需要考虑业务流程和要求。由于补丁在某些环境和情况下可能导致服务中断，因此补丁需要进行计划和沟通。同时，补丁在生产环境执行之前可能也需要进行测试。补丁不能假设是完美的，事实上，它们可能会引发新问题。\n\
  \n## 补偿措施\n\n在无法安装补丁或补丁不存在，或者补丁存在已知问题的情况下，可以使用补偿措施（compensating controls）。补偿措施是保护或保护服务、系统或设备的替代方法，能够实现与实施首选或典型控制时相同的的结果。\n\
  \n在漏洞管理系统中，这可能意味着部署一个带有保护规则的 Web 应用防火墙（`WAF`）以停止对 Web 服务的已知利用，或者可能涉及禁用服务直到可以打补丁为止。\n\
  \n遗憾的是，补偿措施通常不会被配置管理和漏洞管理系统自动理解或识别。在部署补偿措施的情况下，需要对其进行记录，并在使用的配置管理和漏洞管理系统中设置注释或标记，以确保该漏洞以后不再以相同的方式被报告。\n\
  \n由于供应商不会解决补偿措施，许多组织选择为补偿措施设置审查周期。当补偿措施被视为临时措施时（因为没有可用补丁、补丁有缺陷或由于业务原因无法安装），这一点尤为真实。一旦对补偿措施的需求得到解决，组织将安装补丁或进行正常修复并移除补偿措施，从而简化其持续管理。\n\
  \n## 意识、教育与培训\n\n漏洞管理实践需要员工的意识才能有效。系统管理员和安全从业人员需要意识到漏洞管理和及时修复实践的重要性。领导层需要对组织负责，并对确保监督工作的开展负责。审计员和合规人员需要理解组织的漏洞概况和实践，以及在何种情况下实施了补偿措施或其他解决方案，以及它们为什么适用或不适用。\n\
  \n所有这些都要求组织对所有相关员工持续进行培训、教育和意识提升工作。\n\n## 业务需求的变化\n\n组织的要求和需求会随时间变化，但漏洞管理也可能要求组织修改其做法。因此，`changing\
  \ business requirements`（业务需求的变化）是漏洞管理中频率较低但仍然重要的部分。\n\n# 漏洞管理指标和 KPI\n\n了解你的漏洞管理系统和流程运行良好需要\
  \ `metrics`（指标）和关键性能指标（KPIs）。漏洞管理的 `Trends`（趋势）通常关注漏洞数量、其严重程度或风险评分以及修复时间。复发问题也是报告的频繁目标。\n\
  \n前 10 名列表有助于识别最大的威胁、最常见的漏洞以及类似的项目，这些对于集中组织资源非常有用。然而，仅仅依赖前 10 名并不是组织推荐的做法，因为这个数字是任意的，而且存在更多。\n\
  \n`Critical vulnerabilities`（严重漏洞）是指可能导致利用并可能产生重大影响的漏洞。如果你的组织依赖 `CVSS` 标准，则根据影响、可利用性、时间和环境调整因子等衡量标准，`9.0–10.0`\
  \ 被视为严重漏洞。你可以访问 v3 评分计算器：`https://nvd.nist.gov/vuln-metrics/cvss/v3-calculator`。衡量组织中严重漏洞的数量及其补丁时间，对于理解最关键漏洞的处理情况非常重要。\n\
  \n`Zero-days`（零日漏洞）是在补丁发布之前就公布的漏洞。这允许攻击者在补丁创建并部署之前利用该漏洞。由于它们是未知的，在配置管理系统或漏洞扫描器接收到更新的定义或检测能力之前，无法被识别。衡量零日响应是挑战性的，因为它依赖于供应商和其他机构发布补丁，或取决于组织识别并实施补偿措施。\n\
  \n`Service level objectives (SLOs)`（服务水平目标）描述了特定的指标，如修复或打补丁的时间，它们由组织设定或作为与供应商的服务水平协议的一部分定义。衡量是否满足\
  \ SLO 以及差距之处是服务协议管理的常见元素。\n\n# 修复的阻碍\n\n虽然组织通常意识到漏洞需要修复，但有许多原因导致它们可能不会像希望的那样快速地打补丁或解决。这些包括：\n\
  \n- `Memorandums of understanding (MOUs)`（谅解备忘录）可能有性能或可用性目标，如果系统或服务需要离线打补丁，这些目标可能无法实现。它们还可能指定支持组织，或对谁可以处理系统或是否可以安装补丁设定限制。这对于对软件或操作系统更改敏感的嵌入式专用系统尤为常见。\n\
  - `Service level agreements (SLAs*)`（服务水平协议）也可能影响性能目标的条款。SLA 可能会驱动组织延迟打补丁以确保达到可用性或其他指标。\n\
  - `Organizational governance`（组织治理）可能会由于业务流程需求或验证过程而减慢补丁速度。\n\n*注：原文处有星号标记，此处予以保留。*\n\
  \n\n\n\n\n*   对`业务流程中断`的担忧往往会导致修复工作延后。虽然许多现代系统设计为通过使用负载均衡等技术允许补丁，但并非所有系统或服务都可以在不要求停机的情况下进行补丁。\n\
  \n*   某些补丁或修复可能会导致`功能下降`。补丁可能会禁用或修改某个服务，也可能意味着禁用了旧协议，从而破坏与其它系统或设备的连接性或集成性。理解漏洞修复的影响可能包括查找可能影响现有基础设施配置的变更。\n\
  \n*   `遗留系统`可能没有可用的补丁，这意味着补偿性措施可能是唯一的选择。在补偿措施无法完全修复漏洞的情况下，组织可能需要针对漏洞与系统或服务需求之间做出由风险驱动的选择。\n\
  \n*   `专有系统`（proprietary systems）与遗留系统类似，可能没有可用的补丁，或者供应商对其实施了特定要求。你可能无法在安装特定补丁或更新版本的同时保留供应商的支持，这导致了漏洞管理策略与功能或业务需求之间产生冲突。\n\
  \n无论遇到什么种修复阻碍，充分记录问题并根据风险和策略对应该做的事做出决策都是关重要的。某些阻碍可以通过改变组织流程来解决——治理、SLA 和 MOU 问题通常可以通过这种方式解决。其他问题则通常可以通过改变基础设施或软件及服务设计来改进，例如对业务流程中断、法律系统和专有系统的担忧。\n\
  \n## 事件响应报告与通信\n\n报告和通信也是事件响应过程中的重要组成部分。如果响应人员之间缺乏适当的通信，事件响应过程很容易无法完全解决事件，或导致利益相关者对组织的支持流失。事件后的报告有助于确保组织能够妥善处理根源，并为未来的事件做好充分准备。\n\
  \n本章的剩余部分将带你了解通信是如何织入 IR（事件响应）过程的，以及在事件发生期间和之后充分有效地进行通信需要哪些条件。\n\n### 利益相关者识别与通信\n\
  \n确保相关方在事件期间在正确的时间获得正确的信息依赖于对利益相关者的识别。组织中的利益相关者包括：事件响应人员；技术人员（如系统管理员、开发人员或其他受影响系统/服务的专家）；管理层；法律顾问；组织传播和营销人员；以及整个组织中由于事件的类型、范围或影响而可能需要参与的其他人员。\n\
  \n事件响应通信可能还涉及外部利益相关者，如客户、服务提供商、执法部门、外部顾问、政府机构或其他对受影响组织具有合规或监督作用的机构，以及媒体。\n\n因此，当组织考虑事件响应通信时，通常会在流程和策略中定义明确的通信流程和角色。同时，还会识别关键利益相关者，以确保通信能够及时进行、适合目标受众，并符合组织的需求和要求。\n\
  \n### 事件声明与升级\n\n在第 9 章中，你学习了图 12.1 所示的事件响应周期。当检测到事件并开始分析时，通信流程也随之启动：\n\n1.  引导组织调查事件的入侵指示（`IoCs`）需要传给事件响应人员。\n\
  \n2.  事件响应人员需要判定 `IoCs` 指向的是事件还是假阳性。\n\n3.  如果宣布事件，则需要激活组织的事件响应计划。这是事件声明步骤，随后是遏制、根除和恢复。\n\
  \n![FIGURE 12.1 IR cycle](img/c12f0001.png)\n\n记住通信发生在所有阶段至关重要。事件响应人员需要意识到谁需要知道发生了什么、他们需要什么细节以及何时。\n\
  \n### 事件通信\n\nNIST 的`800-61 计算机事件处理指南》包含了外部通信和信息共享的要求和指南，包括应该与谁共享什么内容、何时共享以及通过什么渠道共享。该指南描述了事件响应中常见的若干外部组织，这些也主要反映在\
  \ CySA+ 目标中。\n\n**FIGURE 12.1 IR cycle**\n\n![FIGURE 12.1 IR cycle](img/c12f0001.png)\n\
  \n#### 法律\n\n由于多种原因，法律顾问可能会被要求提供咨询或参与事件响应。这特别是在涉及敏感数据、合规或人力资源时。如果组织认为可能面临法律行动，可能会聘请外部顾问以获取专业建议。\n\
  \n涉及法律顾问通常是决策过程的一部分，而不是事件响应的自动步骤。组织应确定可能何时以及为何引入顾问。\n\n#### 公关\n\n组织在事件期间可能会选择聘请专业的公关机构或人员，特别是重大事件或可能发生声誉损害的事件。CySA+\
  \ 目标考虑了公关话题。\n\n##### 客户通信\n\n与客户的通信是事件响应通信中最重要且复杂的部分之一。关于何时通信的可能是可能是的，因为通知数据泄露或其他问题对于留住客户至关重要，但可能对事件响应过程产生负面影响。同时，由于调查正在进行且初始假设可能是错误的，在响应过程中提供有用信息可能困难。\n\
  \n所有这些因素意味着组织应该确定客户通信的整体做法是什么——谁负责、通信什么以及何时通信，以及如何提供信息。虽然这些可能会为了满足特定事件的要求而改变，但良好了解组织的通用做法和理念可以确保在客户通信期间出现的问题减少。\n\
  \n##### 媒体\n\n媒体通信程序应与组织现有的媒体互动和信息实践及策略保持一致。NIST 建议组织为媒体互动选择单一联系人以及备份人员以确保覆盖率，并让将与媒体互动的人员接受媒体培训以做好准备。\n\
  \n除了媒体培训外，额外的建议还包括：\n\n*   建立媒体简报程序，并重点关注处理事件相关信息的敏感性\n*   维护事件响应状态文档或声明，以确保媒体通信的一致性和及时性\n\
  *   为员工接触媒体和信息请求做好准备\n\n\n\n\n\n*   作为事件响应（IR）练习的一部分，为响应人员举行演练课程\n\n与媒体和公众的沟通可能是根据监管或立法报告要求的强制性要求、自愿行为，或者是由于安全事件的媒体报道所迫的。无论与媒体进行沟通的原因为何，为媒体互动做好准备都是事件响应准备工作的重要部分，而\
  \ NIST 指南的设计旨在强调这一点。\n\n## 监管性报告\n\n许多组织承担着法律义务，要求根据法律进行沟通。例如，在美国，2022 年的《关键基础设施网络事件报告法》（`CIRCIA`）要求，对于“可能对美国国家安全利益、外交关系或经济，或对美国人民的信任、公民自由或公共健康安全造成可证明损害”的重大网络事件，必须在\
  \ 72 小时内报告给网络和基础设施安全局（`CISA`），并且勒索软件支付情况必须在支付后 24 小时内报告。\n\n由于由法规驱动的报告因组织所在的地区、行业以及许多其他因素而异，因此组织需要对现有的法律要求进行仔细审查，并对新法律法规进行持续评估，以确保其保持合规。\n\
  \n## 执法部门\n\n网络安全事件可能是犯罪性的，或者可能涉及组织无法应对的威胁者，例如国家级攻击者。当这种情况发生时，组织可能希望引入执法部门，或者当网络安全事件看起来具有犯罪性质时，执法部门可能希望参与。\n\
  \n需要重要的是，涉及执法部门可能会以重大方式改变事件响应过程。执法机构可能需要封锁系统、将其离线，或执行其他组织在没有执法部门参与时可能不会选择的操作。组织有时可以权衡选择合作或拒绝参与调查，但应始终在法律顾问的建议下做出这一决定。\n\
  \n## 根原因分析\n\n确定事件的底层（或根源）原因需要响应人员弄清楚事件发生的原因。这意味着必须对事件有充分的理解和记录，通常需要建立时间线，并且需要记录记录其他问题和次要原因。这一过程被称为\
  \ `根原因分析 (RCA)`，在复杂情景下可能非常困难。\n\n要执行根原因分析，你需要理解该过程中的四个步骤：\n\n1.  识别作为事件组成而发生的问题和事件，并尽可能详细地描述它们。\n\
  2.  建立事件时间线。这有助于确定发生了什么、按什么顺序发生，以帮助识别根原因。\n3.  区分每个事件和因果因素。简而言之，你需要确定哪些是根原因，哪些是根原因的结果，哪些是因果因素（或导致了问题产生但不是根原因的事件）。\n\
  4.  记录根原因分析结果，通常通过使用图表或图示来实现。\n\n## 教训总结\n\n如果组织不应用这些知识，那么知道事件是如何发生以及为何发生对它们将没有帮助。这意味着进行`教训总结`（lessons\
  \ learned）练习或分析对于防止未来发生类似问题和事件至关重要。教训总结过程侧重于思考如何防止未来的问题，而不是指责，它们应该用于驱动变革和实施适当的控制。\n\
  \n## 事件响应指标与关键绩效指标 (KPI)\n\nCySA+ 考试目标指出了你在思考事件响应时应该考虑的四个衡量标准。这些指标不仅可能出现在事件响应报告中，也是安全组织持续报告的常见部分：\n\
  \n*   `平均检测时间`（Mean time to detect），即从导致事件的初始事件发生到检测到它所需的时间。这需要取证分析来准确确定，但对于那些寻求确定其检测能力是否适用于其面临的威胁的组织来说，这是一个有意义的衡量。面对高级持续性威胁的组织发现，他们可能被入侵了几个月或几年而未被发现，这将导致平均检测时间的统计结果非常糟糕！\n\
  *   `平均响应时间`（Mean time to respond）衡量从检测到评估为事件并启动流程的时间。将其与下一个指标平均修复时间区分开来很重要，因为修复取决于事件的大小。\n\
  *   `平均修复时间`（Mean time to remediate）衡量从检测到修复的时间，该指标需要更细致的沟通和解释，而非简单的数字。\n*   `告警量`（Alert\
  \ volume）使用较少，因为它很难赋予意义。它可能意味着组织没有正确调整告警，也可能意味着组织的有效告警较少，还可能意味着组织拥有有效的检测系统并只响了关键告警。因此，将告警量作为指标或\
  \ KPI 通常被认为是有缺陷的衡量标准。更有用的衡量可能是告警是否发生并导致了事件，或者是否通过其他方式发现了事件。\n\n寻求实施指标和 KPI 的组织需要理解正在衡量什么以及为什么要衡量。仅仅提供没有意义的背景或使用指标和\
  \ KPI 流程的数字，将无法改进事件响应过程和报告，反而可能消耗其他所需的资源。\n\n## 事件响应报告\n\n事件响应报告有助于组织对事件进行沟通，并作为确保响应、分析和随访一致性的手段。根据组织需求和事件的复杂性，报告可能是简短的摘要，也可能在报告或附件中包含深度细节。\n\
  \n标准的报告表、流程和后续程序有助于组织以一致的方式进行响应。图 12.2 显示了美国国土安全部和 `CISA` 提供的事件报告模板示例。该模板包含了受影响系统和软件的章节，以及编写报告的个人或团队。\n\
  \n\n\n\n\n*   通常会包含事件的`timeline`（时间轴），以概述发生了什么以及发生的时间。时间轴通过指出行动未及时完成或响应滞后之处，帮助确定需要改进的。它们还可以指出攻击者的方法，以及关于攻击者和防御者在事件期间使用的过程和技术等有用信息。\n\
  \n    ![FIGURE 12.2 示例事件响应报告](img/c12f002.png)\n\n    `FIGURE 12.2` 示例事件响应报告\n\n\
  *   `Impact assessment`（影响评估）有助于有助于了解事件的结果以及可能需要解决的问题。这可能包括财务、声誉或其他损害。\n\n*   `Scope`（范围）描述了组织的哪些系统和服务和其他元素受到了影响。\n\
  \n*   调查期间收集的`Evidence`（证据）通常作为附录，但也可以作为报告的一部分进行总结，提供关于事件的有益背景信息。\n\n## 总结\n\n报告和通信是网络安全分析师技能中的重要元素。漏洞管理报告通常包括漏洞名称和描述、受影响主机列表、风险评分、缓解方案、漏洞再次发生的信息以及优先级信息，以帮助确保优先处理最重要的漏洞。\n\
  \n还会采取额外的通信和报告行动，以确保漏洞管理的成功。这些包括创建合规性报告，这些报告通常由监管或合同合规性要求驱动。创建行动计划以记录如何以及何时进行补丁和修复。配置管理和补丁工具系统将提供报告，以证明补丁工作的成功或失败。然后将跟踪指标和`KPIs`（关键性能指标），以确保漏洞管理工作实现了预期目标。趋势、前\
  \ 10 列表、关键漏洞列表和服务水平目标均作为此过程的一部分。\n\n尽管付出了最大努力，组织往往会遇到修复的阻碍。安全分析师需要考虑`MOUs`（谅解备忘录）和`SLAs`（服务等级协议）对组织遵守可用性目标的同时及时补丁的能力的影响。组织治理可能会阻补丁，特别是当补丁可能导致业务流程中断或功能下降时。最后，遗留系统和专有系统可能无法进行补丁，或者在保留支持的情况下无法安装补丁，从而需要补偿措施。\n\
  \n通信贯穿整个事件响应过程，从识别到声明、响应、升级和解决。响应人员需要知道过程中的利益相关者是谁，以及这些利益相关者何时参与。通信还需要考虑如何以及何时涉及法律顾问、与客户和媒体的公关活动、监管报告以及执法部门。\n\
  \n事件一旦解决，根原因分析和教训总结有助于确保组织利用从事件中学到的教训进行改进。指标和`KPIs`，包括平均检测时间、平均响应时间和平均修复时间，都都有助于让领导层和响应人员对及时响应负责。\n\
  \n## 考试要点\n\n**理解漏洞管理报告。** 漏洞报告包括常见元素，如`CVE`编号和`CVSS`评分、名称、描述、受影响主机、缓解方案、关于再次发生的信息以及优先级信息。它们需要定期、及时地发送给相关的利益相关者。在适当的情况下可能会发送合规性报告等特定报告类型。然后准备行动计划来应对报告，可能包括配置管理、补丁、补偿措施、意识、教育和培训以及业务需求信息。\n\
  \n**解释漏洞管理指标和 KPIs。** 趋势数据用于判断计划是否成功，或新问题是否正在变成系统性问题。前 10 列表可以帮助识别最常见的漏洞，从而帮助集中精力。关键漏洞列表也有助于关注最危险的漏洞。在报告中跟踪零日漏洞具有挑战性，但可能是领导层的要求。最后，设定服务水平目标(`SLOs`）来定义及时修复目标并确定组织是否达到了这些目标。\n\
  \n**描述修复的阻碍。** 谅解备忘录(`MOUs`）和服务等级协议(`SLAs`）定义性能或可用性目标，由于系统或服务需要离线，可能会与补丁产生冲突。组织治理可能会引入影响补丁的延迟或额外要求。对补丁导致业务流程中断或功能下降的担忧也可能影响补丁。最后，遗留系统和专有系统可能没有可用补丁，或者在保留支持的情况下无法安装补丁。\n\
  \n**理解事件响应的关键利益相关者。** 必须识别利益相关者以确保适当的事件通信和报告，并需要他们参与事件的声明和升级。通信可能需要涉及法律、与客户和媒体的公关、监管报告以及执法部门。\n\
  \n**列出事件响应报告的关键项目。** 事件报告通常包括执行摘要，以易于理解的简短形式描述事件。它们还必须包含事件的谁、什么、何时、何地和为什么。有关影响、范围和时间轴的信息、改进建议以及与事件相关的证据通常也会包含。根原因分析有助于推动改进以避免未来发生类似的事件。\n\
  \n**描述事件响应指标和 KPIs。** 平均检测时间、平均响应时间和平均修复时间在评估事件响应计划的有效性时都是有用信息。衡量告警量不太可能提供有用数据，但可能会被管理层。\n\
  \n## 实验练习\n\n### 活动 12.1：漏洞管理报告\n\n在活动 6.2 中，你运行了漏洞扫描，在活动 7.1 中你分析了该扫描以考虑修复计划。利用这些结果，准备一份漏洞扫描报告，你可以向部门负责人或其他高级领导提供有关扫描和所需修复的信息。\n\
  \n1. 描述哪些漏洞是关键的，以及为什么。\n2. 识别可能适用补偿措施的漏洞。\n3. 选择一个漏洞并假设它自上次报告运行以来再次发生。你如何在给管理层的报告中描述它？\n\
  4. 你预见到哪些修复的阻碍？你如何在给管理层的书面报告中解决这些问题？\n\n### 活动 12.2：审查公共事件报告\n\n在此练习中，你将审查一份公开的事件报告。\n\
  \n1. 找到一份最近的公开发布的事件报告。可以考虑以下两个示例：\n   - LastPass 的 2022 年安全漏洞通知(`https://blog.lastpass.com/2022/12/notice-of-recent-security-incident`)\n\
  \   - 微软的 DEV-0357 入侵(`www.microsoft.com/en-us/security/blog/2022/03/22/dev-0537-criminal-actor-targeting-organizations-for-data-exfiltration-and-destruction`)\n\
  \n2. 思考以下问题：\n   - 通知是否包含了客户所需的所有信息？\n\n\n\n\n\n*   针对该公告是否有公开评论？如果有，这些评论的基调是怎样的？\n\
  *   是否有后续报告？该报告是什么时候发布的？它是否改变了初始报告中提供的信息？\n*   该组织打算采取哪些行动？这些行动是否适当或充分？\n*   是否有执法部门参与其中？\n\
  \n3. 考虑你所在组织的事件响应流程和报告流程。对于类似的事件，你组织的公共事件报告将包含哪些内容？在哪些方面会有所不同？如果是，原因是什么？\n\n###\
  \ 活动 12.3：事件报告\n\n在本次练习中，你将根据自己经历过的事件填写一份示例事件报告。如果你从未经历过事件，可以简单查看该表单，并考虑对于你熟悉的组织中发生的事件，你想要哪些信息。\n\
