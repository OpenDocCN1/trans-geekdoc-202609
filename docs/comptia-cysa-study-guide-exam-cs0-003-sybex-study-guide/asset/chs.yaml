  ---\n\n### 第二部分：正文内容翻译\n\n[content]\n\n## 第 5 章 侦察与情报收集\n\n安全分析师、渗透测试人员以及负责安全任务的人员需要了解网络环境。这一过程被称为侦察（reconnaissance）。例如，支付行业数据安全标准（PCI\
  \ DSS）要求组织至少每季度执行一次，并在发生重大变更后执行。在本章中，你将探索主动情报，包括工具和真实案例。最后，你将学习被动情报收集。\n\n###  {映射、枚举与资产发现\n\
  \n收集情报的第一步是识别组织的足迹。主机枚举通常通过结合信息收集工具和手动研究来实现。发现过程（我们在侧边栏“资产发现与渗透测试”中讨论）通常用于确保安全专业人员了解网络中的情况。\n\
  \n### 主动侦察\n\n主动侦察使用主机扫描工具收集有关系统、和服务漏洞的信息。需要注意的是，尽管侦察不涉及利用，但它可以提供有关漏洞的信息。\n\n###\
  \ 网络映射与拓扑发现\n\n主动扫描还可以提供有关网络设计和拓扑的信息。当扫描工具遍历网络范围时，它可以评估响应中包含的信息。这可以帮助测试人员根据接收到的数据包生存时间（TTL）、追踪路径以及网络设备的响应，对拓扑做出合理的推断。图\
  \ 5.1 显示了使用 Zenmap 工具进行的扫描，Zenmap 为流行的 nmap 网络扫描工具提供了图形用户界面。该扫描显示了一个简单的网络。路由器或网关中心连接到主机，让你清楚地看到一组主机如何连接。运行\
  \ nmap 的系统成为初始扫描的中心，并显示其本地环回地址 127.0.0.1。许多主机出现在 10.0.2.1 路由器之后的第二个网段上。nmap（以及使用\
  \ nmap 的 Zenmap）可能无法发现所有的系统和网络设备——防火墙或其他安全设备可以阻止扫描流量，导致系统或网络缺失。\n\n\n\n\n扫描工具收集的拓扑信息可能存在缺陷，并且可能与目标网络的实际设计不匹配。安全和网络设备可能会导致\
  \ TTL 和跟踪路由（traceroute）信息的差异，从而导致数据错误或缺失。防火墙还可以让设备和系统对扫描实际上变得不可见，导致从扫描结果构建的拓扑图中某些网络网段无法显示。\n\
  \n除了安全设备带来的挑战外，你可能还需要考虑各种变量，包括有线网络与无线网络之间的差异、虚拟网络与像 `VMware` 和 `Microsoft Hyper-V`\
  \ 等虚拟环境之间的差异，当然，还包括本地网络与云托管服务及基础设施之间的差异。如果你扫描的是你或你组织控制的网络，你应该能够确保你的扫描系统或设备放置恰当，以收集你所需的信息。如果你是在渗透测试或零知识测试中进行扫描，你可能需要检查你的数据，以确保这些变量没有导致你遗漏重要信息。\n\
  \n### 探测宿主机 (Pinging Hosts)\n\n你可以进行的最基础的发现形式是对网络地址进行 ping 操作。`ping` 命令是一种低级网络命令，它向远程\
  \ IP 地址发送一个名为回显请求（echo request）的数据包。如果远程系统接收到请求，它将用回显响应（echo reply）进行响应，表示它已开启并运行，且通信路径是有效的。Ping\
  \ 通信使用互联网控制消息协议（ICMP）。\n\n以下是一个向运行在本地网络上的服务器发送回显请求的示例：\n\n```\n[~/]$ ping 172.31.48.137\n\
  PING 172.31.48.137 (172.31.48.137) 56(84) bytes of data.\n64 bytes from 172.31.48.137:\
  \ icmp_seq=1 ttl=255 time=0.016 ms\n64 bytes from 172.31.48.137: icmp_seq=2 ttl=255\
  \ time=0.037 ms\n64 bytes from 172.31.48.137: icmp_seq=3 ttl=255 time=0.026 ms\n\
  64 bytes from 172.31.48.137: icmp_seq=4 ttl=255 time=0.028 ms\n64 bytes from 172.31.48.137:\
  \ icmp_seq=5 ttl=255 time=0.026 ms\n64 bytes from 172.31.48.137: icmp_seq=6 ttl=255\
  \ time=0.027 ms\n64 bytes from 172.31.48.137: icmp_seq=7 ttl=255 time=0.027 ms\n\
  \ \n--- 172.31.48.137 ping statistics ---\n7 packets transmitted, 7 received, 0%\
  \ packet loss, time 6142ms\nrtt min/avg/max/mdev = 0.016/0.026/0.037/0.008 ms\n\
  ```\n\n在这种情况下，用户使用 `ping` 命令查询了位于 `172.31.48.137` 的系统状态，并对发送的七个请求收到了七个响应。重要的是，虽然来自远程主机的回显响应表示它已开启并运行，但缺乏响应并不一定意味着远程主机未活动。许多防火墙会阻止\
  \ ping 请求，单个系统可能被配置为忽略回显请求。\n\n`hping` 工具是 `ping` 命令的更高级版本，允许对回显请求进行自定义，以增加检测到的概率。`hping`\
  \ 也可以作为渗透测试的一部分来构造数据包。以下是 `hping` 运行的一个示例：\n\n```\n[~/]$ hping 172.31.48.137 \n\
  PING 172.31.48.137 (172.31.48.137) 56(84) bytes of data.\n64 bytes from 172.31.48.137:\
  \ icmp_seq=1 ttl=255 time=0.016 ms\n64 bytes from 172.31.48.137: icmp_seq=2 ttl=255\
  \ time=0.037 ms\n64 bytes from 172.31.48.137: icmp_seq=3 ttl=255 time=0.026 ms\n\
  64 bytes from 172.31.48.137: icmp_seq=4 ttl=255 time=0.028 ms\n64 bytes from 172.31.48.137:\
  \ icmp_seq=5 ttl=255 time=0.026 ms\n64 bytes from 172.31.48.137: icmp_seq=6 ttl=255\
  \ time=0.027 ms\n64 bytes from 172.31.48.137: icmp_seq=7 ttl=255 time=0.027 ms\n\
  \ \n--- 172.31.48.137 ping statistics ---\n7 packets transmitted, 7 received, 0%\
  \ packet loss, time 6142ms\nrtt min/avg/max/mdev = 0.016/0.026/0.037/0.008 ms\n\
  ```\n\n```\n[~/]$ hping -S -p 80 172.31.48.137\nPING 172.31.48.137, 80: flags=SA,\
  \ seq=0, win=58405, len=0\n172.31.48.137 (172.31.48.137) 80: flags=SA, seq=0, win=58405,\
  \ len=0 - d=0.016 ms\n172.31.48.137 (172.31.48.137) 80: flags=SA, seq=1, win=58405,\
  \ len=0 - d=0.037 ms\n172.31.48.137 (172.31.48.137) 80: flags=SA, seq=2, win=58405,\
  \ len=0 - d=0.026 ms\n172.31.48.137 (172.31.48.137) 80: flags=SA, seq=3, win=58405,\
  \ len=0 - d=0.028 ms\n172.31.48.137 (172.31.48.137) 80: flags=SA, seq=4, win=58405,\
  \ len=0 - d=0.026 ms\n172.31.48.137 (172.31.48.137) 80: flags=SA, seq=5, win=58405,\
  \ len=0 - d=0.027 ms\n172.31.48.137 (172.31.48.137) 80: flags=SA, seq=6, win=58405,\
  \ len=0 - d=0.027 ms\n```\n\n### 端口扫描技术与工具\n\nPort Scanning Techniques and Tools\n\
  \n扫描工具的设计目的是向系统发送流量，然后获取响应。由于这些原因，端口扫描通常是收集信息的第一步。`端口扫描`工具具有许多常用功能，包括：\n\n*   主机发现\n\
  *   端口扫描和服务识别\n*   设备指纹识别\n*   操作系统识别\n\n端口扫描的一个重要部分是理解常用端口。0-1023 端口被称为**已知端口**（well-known\
  \ ports）或**系统端口**（system ports），它们由 IANA 分配。1024 到 49151 之间的端口是**注册端口**（registered\
  \ ports），许多端口也被任意用于服务。由于端口可以手动分配，简单地假设给定端口运行的服务并不总是好主意。特别是许多 SSH 和 HTTPS 服务器运行在备用端口，以避免端口扫描。\n\
  \n分析扫描数据是一门艺术，但了解如何扫描的基础知识非常有用，因为扫描可以提供网络中有哪些主机、它们运行哪些服务以及关于它们是否容易受到攻击的线索。在图 5.2\
  \ 中，一个具有广泛服务的漏洞 Linux 系统已被扫描。要读取此扫描，你可以从顶部的运行命令开始。`nmap` 端口扫描器（我们将在后几页中详细讨论）使用了\
  \ `-O` 选项，结果尝试识别操作系统。`-P0` 标志告诉 `nmap` 在扫描前跳过 ping 系统，`-sS` 标志执行了 TCP `SYN` 扫描，每个端口发送连接尝试。最后，我们看到了远程系统的\
  \ IP 地址。默认情况下，`nmap` 扫描 1000 个常用端口，nmap 在该列表中发现了 23 个开放端口。\n\n ![FIGURE 5.2 Nmap\
  \ scan results](img/c05f002.png)\n\n**FIGURE 5.2** Nmap 扫描结果\n\n接下来，扫描显示了它发现的端口、它们是\
  \ TCP 还是 UDP、状态（如果服务可用则为开放，如果不可访问则为关闭，如果有防火墙或类似的保护则为过滤），以及它对端口运行服务的猜测。Nmap 服务识别可能是错误的——它不像某些漏洞扫描器那样功能全，但服务列表是一个很有用的起点。\n\
  \n\n\n关于本次扫描最后需要注意的点是运行时间以及到主机的跳数（hops）。该扫描在不到二秒内完成，这告诉我们主机响应很快，且主机仅一跳之遥——从扫描主机可以直接访问。更复杂的网络路径将显示更多的跳数，而扫描更多主机或在系统以及扫描器与远程目标之间增加安全防护都会减慢速度。\n\
  \n### 操作系统和设备指纹识别\n\n根据其发送的网络流量识别操作系统的能力被称为 `operating system fingerprinting`（操作系统指纹识别），在执行侦察时它可以提供有用信息。这通常使用\
  \ TCP/IP 栈指纹技术完成，重点是比较对发送到远程主机的 TCP 和 UDP 数据包的响应。操作系统甚至操作系统版本响应方式的差异、它们支持的 `TCP`\
  \ 选项、发送数据包的顺序以及许多其他细节，都可以对远程系统运行的 `OS` 提供良好的推测。\n\n在此背景下，`Device fingerprinting`（设备指纹识别）描述收集和关联有关设备的信息（如其运行的软件、和服务操作系统），使其能够唯一标识，或被识别为特定类型或版本的设备。设备指纹对于识别打印机和其他网络设备特别有用，但如果能发现足够的独特或典型信息，也可以用于识别工作站、服务器或任何其他网络连接设备。对于设有防火墙且不对探测响应的设备，如果可以访问其网络流量和可用的网络设备日志，仍然可以进行指纹识别。\n\
  \n### 服务和版本识别\n\n识别服务的能力可以提供潜在漏洞的有用信息，并验证在给定端口上响应的服务与通常使用该端口的服务相匹配。服务识别通常通过两种方式之一完成：通过连接并获取服务提供的\
  \ `banner`（横幅）或连接信息，或者通过将其响应与已知服务的特征进行比较。\n\n图 5.3 显示了图 5.1 中扫描的同一系统，并使用了 `nmap`\
  \ 的 `-sV` 标记。`-sV` 标记获取 banner 并执行其他服务版本验证步骤以捕额外信息，并将其与服务数据库进行比对。\n\n基本的 `nmap`\
  \ 输出与图 5.1 相同，但我们在 `Version` 列中增加了信息，包括服务名称以及版本，有时还有服务协议版本或其他细节的额外信息。这些信息可用于检查补丁级别或漏洞，并帮助识别运行在非标准端口上的服务。\n\
  \n![FIGURE 5.3 Nmap service and version detection](img/c05f003.png)\n\nFIGURE 5.3\
  \ Nmap 服务和版本检测\n\n### 常用工具\n\nCySA+ 考试目标列出了你需要在考试中熟悉的若干工具。这些包括端口扫描器、开源情报（OSINT）收集和管理工具，以及\
  \ Metasploit 框架，后者除了是安全专业人员最流行的通用漏洞利用工具包外，还包含许多许多其他工具。\n\n#### nmap\n\n`nmap` 是一种免费开源的网络发现和安全审计工具。它用于网络发现、端口扫描和操作系统检测。它被网络管理员和安全专业人员广泛使用。\n\
  \n常用的 `nmap` 标记包括：\n- `-sV`: 服务版本检测。\n- `-O`: 操作系统检测。\n- `-sS`: TCP SYN 扫描。\n- `-sT`:\
  \ TCP 连接扫描。\n- `-A`: 激进扫描。\n- `-v`: 详细输出。\n\n示例命令：\n```\nnmap -sV -O <target_host>\n\
  ```\n\n\n\n\n\nCySA+ 考试大纲中特别提到的第三种网络扫描和映射工具是 `Maltego`。`Maltego` 是一个开源工具，专注于开源情报（OSINT）收集以及通过图形用户界面（GUI）将数据点连接在一起。`Maltego`\
  \ 的 GUI 提供了一种理解和记录关联关系及层次结构的方法。它依赖 `transforms`（转换）的概念，即服务器执行的提供关于对象和实体的额外数据或处理的操作。图\
  \ 5.6 显示了 `Maltego` 社区版提供的示例。该软件的企业版和专业版提供了更多功能。\n\n![图 5.6 Maltego 社区版](img/c05f006.png)\n\
  \n`图 5.6` Maltego 社区版\n\n## Metasploit\n\n`Metasploit Framework`（`MSF`）通常简称为 `Metasploit`，是一个提供商业版和开源版本的渗透测试框架。图\
  \ 5.7 所示的开源版本使用命令行界面允许对漏洞进行发现和利用。在示例中，演示了 `Metasploit` 收集 SSH 服务器版本信息的能力。首先选择工具，然后设置目标，显示模块选项，最后运行工具。\n\
  \n![图 5.7 Metasploit 框架](img/c05f007.png)\n\n`图 5.7` Metasploit 框架\n\n`Metasploit`\
  \ 模块包含了广泛的功能，包括使用 `tcp`、`syn` 和其他扫描模块进行端口扫描的能力，以及使用名为 `wmap` 的模块进行 Web 漏洞扫描的能力。可以在\
  \ `https://docs.metasploit.com` 找到详尽文档，但 `www.offensive-security.com/metasploit-unleashed`\
  \ 等网站提供了关于如何使用 `Metasploit` 的极佳教程。虽然 CySA+ 考试大纲侧重于资产发现和漏洞管理，但 `Metasploit` 作为渗透测试工具被应用得更为广泛。\n\
  \n## Recon-ng\n\n`Recon-ng` 是一个模块侦测工具。与 `Metasploit` 类似，它使用命令行界面，具备搜索、模块选择和安装功能，允许你根据需求配置和使用它。它内置于\
  \ `Kali Linux` 中，便于进行练习和探索。它使用模块市场，通过 `marketplace search` 命令进行搜索，诸如 `hackertarget`\
  \ 等工具可以帮助收集开源情报（OSINT）以识别目标。与 `Shodan`（一种开源情报搜索引擎）等服务的集成也可以提供额外的开源情报，而像 `nmap` 模块这样的主动搜索模块可用于主动信息收集。\n\
  \n图 5.8 显示了使用 `hackertarget` 作为域名和主机识别搜索工具收集信息的示例。搜索返回了 500 个主机名和 IP 地址，全部属于 `Wiley.com`\
  \ 的域名。\n\n![图 5.8 Recon-ng 对 Wiley.com 相关域名进行搜索](img/c05f008.png)\n\n`图 5.8` Recon-ng\
  \ 对 Wiley.com 相关域名进行搜索\n\n除了这三个扫描器外，许多工具专注于情报收集、漏洞管理和端口扫描，例如 `Metasploit`、`Qualys`、`OpenVAS`\
  \ 以及 Tenable 的 `Nessus`。\n\n### 被动发现\n\n*被动发现*比主动发现要有挑战性得多。尽管如此，你仍然可以使用现有数据识别系统和网络，而无需执行主动探测。\n\
  \n### 日志与配置分析\n\n日志文件可以提供丰富的信息。在接下来的几页中，我们将介绍这些类型数据的工作原理。\n\n#### 网络设备\n\n网络设备会记录其活动、状态和事件。网络信息包括端口和流。\n\
  \n##### 网络设备日志\n\n默认情况下，许多网络设备会将消息记录到控制台上，这意味着只有登录控制台的用户才能看到它们。幸运的是，大多数托管网络会通过 `syslog`\
  \ 将网络日志发送到中央服务器。许多网络设备还利用简单网络管理协议（`SNMP`）发送设备信息。\n\n网络设备日志通常关联有一个日志级别。虽然日志级别的定义各不同，但许多与\
  \ Cisco 的级别相似，如表 5.1 所示。\n\n`表 5.1` Cisco 日志级别\n\n| 级别 | 级别名称 | 示例 |\n| --- | ---\
  \ | --- |\n| 0 | 紧急 | 故障导致关机 |\n| 1 | 警报 | 温度超过限制 |\n| 2 | 严重 | 软件故障 |\n| 3 | 错误\
  \ | 接口下降消息 |\n| 4 | 警告 | 配置更改 |\n| 5 | 通知 | 链路协议启用/禁用 |\n| 6 | 信息 | ACL 违规 |\n|\
  \ 7 | 调试 | 调试消息 |\n\n当你专注于情报收集时，网络设备日志通常不如设备配置有用，尽管它们可以为拓扑提供一些帮助。在渗透测试或执行安全运维期间，网络设备日志可以提供攻击的有用警告，或揭示配置和系统问题。\n\
  \n图 5.9 所示的 Cisco 路由器日志通过 `show logging` 命令访问，并可以使用 IP 地址、列表编号或其他许多变量进行过滤。在这里，我们看到一系列来自远程主机\
  \ 10.0.2.50 的被拒绝数据包。该远程主机正尝试通过不断增加的 TCP 端口连接目标系统，这可能表明正在进行端口扫描，并被访问列表 210 中的规则拦截。\n\
  \n![图 5.9 Cisco 路由器日志](img/c05f009.png)\n\n`图 5.9` Cisco 路由器日志\n\n## 网络配置\n\n在绘制网络拓扑时，设备的配置文件非常有价值。配置文件通常包含网络、路由、设备交互的系统以及其他网络细节。此外，它们还可以提供有关\
  \ syslog 和 SNMP 服务器、管理员和用户账户信息以及其他作为情报收集部分有用配置项的细节。\n\n\n\n\n\n图 5.10 显示了典型 Cisco\
  \ 路由器的 SNMP 配置部分。读取整个文件可以查看路由信息、接口信息以及帮助你将路由器置于网络拓扑结构中的详细信息。所显示的章节提供了关于 SNMP 社区字符串（community\
  \ strings）、设备联系人，以及启用了哪些陷阱（traps）及其发送发送位置的详细信息。此外，你可以看到该组织使用终端访问控制器访问控制系统 (TACACS)\
  \ 来控制其服务器以及这些服务器的 IP 地址。对于安全分析师来说，这些都是有用的信息——对于攻击者来说，这可能是一次有效社会工程攻击的开始！\n\n![图 5.10\
  \ 典型 Cisco 路由器的 SNMP 配置](img/c05f010.png)\n\n## 图 5.10 典型 Cisco 路由器的 SNMP 配置\n\n\
  ### 流 (Flows)\n\n`Netflow` 是一种 Cisco 网络协议，用于收集 IP 流量信息，从而实现网络流量监控。流数据用于提供流量流和容量的视图。典型的流捕获包括流量的源和目的\
  \ IP、端口以及服务类别（class of service）。Netflows 和 Netflow 分析器有助于识别服务问题并建立典型网络行为基准，在识别异常行为方面也有用。\n\
  \n### Netstat\n\n除了网络日志文件外，还可以使用 Windows、Linux、macOS 以及大多数 Unix 和类 Unix 操作系统中的 `netstat`\
  \ 收集本地主机的网络信息。`netstat` 提供了丰富的信息，其功能在不同操作系统之间略有不同。它可以提供如下信息：\n\n*   活跃的 TCP 和 UDP\
  \ 连接，按每种主要协议进行过滤：TCP、UDP、ICMP、IP、Ipv6 等等。图 5.11 显示了 `netstat -ta` 的 Linux netstat\
  \ 输出，显示了活跃的 TCP 连接。这里开启了一个指向远程主机的 SSH 会话。`-u` 标志对 UDP 起相同；`-w` 显示 RAW，`-X` 显示 Unix\
  \ socket 连接。\n\n    ![图 5.11 Linux netstat -ta 输出](img/c05f011.png)\n\n    图 5.11\
  \ Linux `netstat -ta` 输出\n\n*   哪个可执行文件创建了连接，或其进程 ID (PID)。图 5.12](#c05.xhtml#c05-fig-0012)\
  \ 显示了使用 `-o` 标志识别进程号的 Windows netstat 调用，可以使用 Windows 任务管理器引用。\n\n    ![图 5.12 Windows\
  \ netstat -o 输出](img/c05f012.png)\n\n    图 5.12 Windows `netstat -o` 输出\n\n*   以太网统计，显示发送和接收了多少字节和数据包。图\
  \ 5.13 中，在 Windows 系统上带有 `-e` 标志运行 `netstat`，提供接口统计。这跟踪了发送和接收的字节数，以及错误、丢弃和通过未知协议发送的流量。\n\
  \n    ![图 5.13 Windows netstat -e 输出](img/c05f013.png)\n\n    图 5.13 Windows `netstat\
  \ -e` 输出\n\n*   路由表信息，包括 IPv4 和 IPv6 信息，如图 5.14](#c05.xhtml#c05-fig-0014) 所示。这是使用\
  \ `-nr` 标志检索的，并根据操作系统包含各种信息，显示目标网络、网关、路由关联接口以及用于捕捉链路速度以建立优先级的跃值（metric）。\n\n   \
  \ ![图 5.14 Windows netstat -nr 输出](img/c05f014.png)\n\n    图 5.14 Windows `netstat\
  \ -nr` 输出意味着从系统运行 `netstat` 可以提供有关该机器网络以及本地网络状况的信息。了解系统拥有哪些机器或正在与哪些机器通信可以帮助你理解拓扑和服务。最好的是，由于\
  \ `netstat` 在许多操作系统上默认可用，因此推假设它存在且你可以使用它来收集信息是合理的。\n\n#### DHCP 日志和服务器配置\n\n动态主机配置协议\
  \ (DHCP) 是一种客户端/服务器协议，为主机将所在的网络段提供 IP 地址以及默认网关和子网掩码。当你进行侦察时，来自网络 DHCP 服务器的 DHCP\
  \ 日志可以提供一种快速识别网络上许多主机的方法。如果你将 DHCP 日志与其他日志（如防火墙日志）结合，就可以确定哪些主机被提供了动态 IP 地址，哪些主机使用静态\
  \ IP 地址。如图 5.15](#c05.xhtml#c05-fig-0015) 所示，Linux `dhcpd.conf` 文件提供了有关主机及其所访问的网络的信息。\n\
  \n    ![图 5.15 Linux dhcpd.conf 文件](img/c05f015.png)\n\n    图 5.15 Linux `dhcpd.conf`\
  \ 文件\n\n在此示例中，DHCP 服务器的 DHCP 日志提供了一种快速识别网络上许多主机的方法。如果你将 DHCP 日志与其他日志（如防火墙日志）结合，就可以确定哪些主机被提供了动态\
  \ IP 地址，哪些主机使用静态 IP 地址。如图 5.15](#c05.xhtml#c05-fig-0015) 所示，Linux `dhcpd.conf` 文件提供了有关主机及其所访问的网络的信息。\n\
  \n\n\n\n\n组织使用各种防火墙，包括来自 Cisco、Palo Alto 和 Check Point 的设备，这意味着你可能会遇到多种格式的日志。幸运的是，这三者都有共同特征。每种设备都提供了日期/时间戳以及事件详情，其格式旨在易于于理解。例如，可以使用控制台上的\
  \ `show logging` 命令（通常输入为 `show log`）访问 Cisco ASA 防火墙日志。条目具有良好的可读性，列出了日期、时间、系统以及采取的操作。例如，一条日志可能如下：\n\
  \n```\nSep 13 10:05:11 10.0.0.1 %ASA-5-111008: User 'ASAadmin' executed the 'enable'\
  \ command\n```\n\n此命令表示用户 `ASAadmin` 运行了 Cisco 的 `enable` 命令，该命令通常用于进入设备的特权模式。如果\
  \ `ASAadmin` 不应该使用管理权限，这将在你的调查中成为一个立即的警示信号。\n\n也可以手动对路由器/防火墙 ACL 进行审查。这里显示了示例 Cisco\
  \ 路由器 ACL 的部分：\n\n```\nip access-list extended inb-lan\n permit tcp 10.0.0.0 0.255.255.255\
  \ any eq 22\n permit tcp 172.16.0.0 0.15.255.255 any eq 22\n permit tcp host 192.168.2.1\
  \ any eq 22\n deny tcp 8.16.0.0 0.15.255.255 any eq 22\n```\n\n此 ACL 段命名了访问控制列表，然后设置了一系列被允许的操作以及允许执行这些操作的网络。这组规则专门允许\
  \ `10.0.0.0` 网络中的所有地址使用 TCP 端口 `22` 发送流量，从而允许了 SSH。`172.16.0.0` 网络被允许相同的访问权限，IP\
  \ 地址为 `192.168.2.1` 的主机也是如此。最后的拒绝（deny）规则将防止指定的网络范围发送 SSH 流量。\n\n如果你在考试中遇到防火墙或路由器配置文件、日志文件或规则，将它们重写成你更容易读懂的语言可能会有所帮助。为了做到，从操作或命令开始；然后找到受影响的目标、用户或其他事物。最后，找到任何指定将发生什么或发生了什么的修饰。在之前的路由器配置中，你可以将\
  \ `permit tcp 10.0.0.0 0.255.255.255 any eq 22` 写为“允许来自 `10.0.0.0` 网络的任何源端口到目的端口\
  \ 22 的 TCP 流量”。即使你不熟悉特定的配置或命令，这也能帮助你理解你将遇到的许多条目。\n\n### 系统日志文件\n\n大多数系统都会收集系统日志以提供故障排除和其他系统信息。日志信息的差异很大取决于操作系统、其配置方式以及系统运行的服务和应用程序。\n\
  \n日志文件可以提供有关系统如何配置、系统上运行着哪些应用程序、系统中存在哪些用户账户以及其他细节，但它们通常不是侦察列表的首选。如果可以访问，它们会被收集，但大多数日志文件存储在安全位置，如果没有系统管理访问权限是无法访问的。\n\
  \n### 从 DNS 和 Whois 获取数据\n\n域名系统（DNS）通常是收集组织信息时的首要站点之一。DNS 信息不仅是公开可用的，而且通过简单检查其网站的\
  \ Whois 信息通常就能轻松连接到该组织。有了这些信息，你可以找到其他网站和主机并添加到你的组织足迹中。\n\n### DNS 和 Traceroute 信息\n\
  \nDNS 将像 `google.com` 的域名转换为 IP 地址（如 图 5.16 所示）或从 IP 地址转换为人类可理解的域名。在 Windows、Linux\
  \ 和 macOS 系统上执行此操作命令是 `nslookup`。\n\n![FIGURE 5.16 Nslookup for google.com](img/c05f016.png)\n\
  \n图 5.16 `google.com` 的 nslookup\n\n一旦你获得了 IP 地址，就可以找到其他网站和主机并添加到你的组织足迹中。`traceroute`\
  \ 命令可以显示数据包到达目的地经过的路径。在 Windows 上，命令是 `tracert`，而在 Linux 和 macOS 上，它是 `traceroute`。\n\
  \n可以使用 `nslookup` 查询其他类型的 DNS 记录。例如，要查找域域的 `MX` 记录，你会使用：\n\n```\nnslookup -type=mx\
  \ google.com\n```\n\n\n\n\n\n-   亚太网络信息中心 (APNIC)：负责亚洲、澳大利亚、新西兰以及该地区的其他国家。\n-  \
  \ 拉丁美洲和加勒比地区网络信息中心 (LACNIC)：负责拉丁美洲及未被 ARIN 覆盖的加勒比地区部分。\n-   欧洲 IP 网络协调中心 (RIPE NCC)：负责中亚、欧洲、中东和俄罗斯。\n\
  \n每个区域互联网注册机构（RIR）都提供 Whois 服务，用以识别其负责的 IP 空间所被分配的用户，以及其他有助于确保该地区互联网底层 IP 和 DNS\
  \ 基础正常运行的服务。\n\n## DNS 条目\n\n除了使用 `nslookup` 提供的信息外，DNS 条目还可以通过主机名直接提供有关系统的有用信息。名为“AD4”的系统更有可能是基于活动目录（Active\
  \ Directory）的漏洞利用和 Windows Server 特定扫描的目标目标；而反映特定应用程序或服务的主机名则可以提供目标信息，并为社会工程学和人机智能活动提供线索。\n\
  \n## DNS 发现\n\n组织的外部 DNS 信息作为 Whois 信息的一部分提供，为基于 DNS 的信息收集提供了一个良好的起点。可以通过主动扫描、基于网络流量或日志的被动信息收集，甚至通过查看组织的文档来识别额外的\
  \ DNS 服务器。这可以通过端口扫描并搜索在 UDP 或 TCP 端口 `53` 上提供 DNS 服务的系统来实现。一旦你找到了 DNS 服务器，就可以使用\
  \ `dig` 或其他 DNS 查找命令对其进行查询，也可以测试它是否支持区域传输（zone transfers），这可以使获取组织 DNS 数据变得简单。\n\
  \n## 区域传输\n\n收集组织信息的一种方法是执行区域传输。区域传输旨在在 DNS 服务器之间复制 DNS 数据库，如果目标的 DNS 服务器允许区域传输，那么它就将成为一种功能强大的信息收集工具。这意味着大多数\
  \ DNS 服务器被设置为禁止向其不受信任的 DNS 同等服务器进行区域传输，但安全分析师、渗透测试人员和攻击者仍然可能会检查区域传输是否可行。\n\n要从命令行检查你的\
  \ DNS 服务器是否允许区域传输，可以使用 `host` 或 `dig`：\n\n```\nhost –t axfr domain.name dns-server\n\
  dig axfr @dns-server domain.name\n```\n\n在允许区域传输的 DNS 服务器上运行此命令将得到一个大文件，其数据如下（来自\
  \ DigiNinja 的转储，DigiNinja 是一个允许安全从业人员练习区域传输的网站）：\n\n```\n; <<>> DiG 9.9.5-12.1-Debian\
  \ <<>> axfr @nsztm1.digi.ninja zonetransfer.me\n; (1 server found)\n;; global options:\
  \ +cmd\nzonetransfer.me.     7200     IN     SOA     nsztm1.digi.ninja.\nrobin.digi.ninja.\
  \ 2014101603 172800 900 1209600 3600\nzonetransfer.me.     7200     IN     RRSIG\
  \     SOA 8 2 7200 20160330133700\n20160229123700 44244 zonetransfer.me. GzQojkYAP8zuTO9UAx6mTDiEG26hVI2\n\
  ifk2DpbQLrEAPgM77i0yFWHpnMJIuu8nMQgFVC3yTOe/EMb98FYwEZeWHtbMs88jJlF+cOzWarjdy0+UJ4dGtriC52EXKkw2kv3tdKKVaBE\n\
  zonetransfer.me.     7200     IN     NS     nsztm1.digi.ninja.\nzonetransfer.me.\
  \     7200     IN     NS     nsztm2.digi.ninja.\nzonetransfer.me.     7200     IN\
  \     RRSIG     NS 8 2 7200 20160330133700\n20160229123700 44244 zonetransfer.me.\
  \ TyFngBkPMWxgc6tgRh0kqeWYSBxFxezupFLeiDhVXo+SZP54vwfk7ClNZ9lRNkHyxRElhlH1JI1hjvod0fycqCnx8UCkm2Mxr8OcGf2jNDUcDO5XjOX9tRbVVKIp92f4Qalw\n\
  zonetransfer.me.     7200     IN     A     147.77.157\n```\n\n该传输从起始权威记录（SOA）记录开始，该记录列出了主名称服务器；其联系人\
  \ `robin.digi.ninja`（应读作 `robin@digi.ninja`）以及该域名的当前序列号 `2014101603`。它还提供了二级名称服务器在更改之间应等待的时间：`172800`\
  \ 秒；主名称服务器在刷新失败时应等待的时间：`900` 秒；二级服务器声称拥有权威信息的秒数：`209600` 秒；记录的过期时间（两周）；以及该域名的最小\
  \ TTL：`3600` 秒。该域名的两个主名称服务器也都被列出——`nsztm1` 和 `nsztm2`。\n\n## DNS 发现\n\n（注：此处原文出现重复标题，根据指令要求不重复输出原文，此处对应翻译逻辑）\n\
  \n## 区域传输\n\n（注：此处原文出现重复标题，根据指令要求不重复输出原文，此处对应翻译逻辑）\n\n## DNS 暴力破解\n\n如果区域传输不可用，仍然可以通过暴力破解从公共\
  \ DNS 获取信息。对组织使用的每个 IP 地址发送查询可以获取许多有用的信息。通过以较慢的速率或从多个系统发送查询可以绕过大多数防御措施。\n\n## Whois\n\
  \nWhois 如前所述，允许根据注册信息查询关于组织或个人的信息。在图 19 所示的示例 Whois 查询中，你可以看到关于 Google 的信息，例如总部位置、联系方式和主名称服务器。这些信息可以为信息收集过程提供额外的线索。\n\
  \n其他信息可以通过在 Linux 中使用 `host` 命令来获取的。该命令将提供有关系统的 IPv4 和 IPv6 地址以及邮件服务器的信息，如图 20 所示。\n\
  \n\n\n\n在图 5.21 中，你可以看到`nmap`扫描期间过滤后的数据包获数据。使用数据包获可以让你深入研究特定的响应，或验证你确实在特定时间测试了特定的主机。因此，数据包获既可以作为分析工具，也可以作为任务完成的证明。\n\
  \n![图 5.21 来自 nmap 扫描的数据包获数据](img/c05f021.png)\n\n图 5.21 来自 nmap 扫描的数据包获数据\n\n##\
  \ 总结\n\n资产发现理解环境的关键部分。主动和被动方法都可以用于收集网络上存在哪些设备、系统和服务的信息。对于网络安全从业人员来说，了解如何使用扫描映射设备，以及如何对设备进行指纹识别以识别唯一设备并确定其类型及运行的操作系统是非常重要的。\n\
  \n了解系统和设备上存在有助于资产发现的数据，可以帮助从业人员识别系统、设备和服务。由于安全控制、网络拓扑结构和设计以及其他限制因素需要超出简单端口扫描的额外努力，资产发现有许多形式和技术。\n\
  \n从业人员的关键工具包括如 `nmap` 和 `Angry IP Scanner` 等端口扫描器，以及支持信息收集和侦察工作的工具，如 `Maltego` 和\
  \ `Recon-ng`。`Metasploit Framework` 等多功能工具将这些许多能力构建到其工具集中，允许从业人员能够从信息收集和分析切换到漏洞利用或其他活动。\n\
  \n作为一名安全从业人员，你需要了解如何通过端口和漏洞扫描、日志审查、被动信息收集和组织情报收集来收集信息并执行设备指纹识别和网络映射。你还应该熟悉考试所需的\
  \ `nmap`、`Angry IP Scanner`、`Maltego`、`Metasploit Framework` 和 `Recon-ng` 等工具。这些技能的结合将为你提供理解你必须防御的网络、系统和其他组织资产所需的能力。\n\
  \n## 考试要点\n\n**解释为什么主动侦察对资产发现和映射至关重要。** 主动侦察涉及探测系统和网络以获取信息。端口扫描是侦察过程中常见的第一步，`nmap`\
  \ 是用于系统、端口、操作系统和服务发现及部分扫描的常用工具。主动侦察还可以通过捕获信息并分析网络设备和系统的响应来确定网络拓扑结构。了解常见的端口和服务对有助于分析和理解被发现的服务。\n\
  \n**了解被动发现如何在不进行主动探测的情况下提供信息。** 被动发现依赖于在不探测系统和网络的情况下收集的数据。日志文件、配置文件以及来自 `DNS` 和\
  \ `Whois` 查询的发布数据都可以在不向系统或网络发送任何流量的情况下提供价值数据。数据包获在尝试理解网络时非常有用，可以帮助记录主动侦察活动，并提供诊断和网络数据。\n\
  \n**评估来自常用工具的数据。** 像 `Angry IP Scanner` 和 `nmap` 等工具可用于资产发现和映射。`Maltego` 和 `Recon-ng`\
  \ 用于映射和组织开源情报以及侦察数据。`Metasploit Framework` 包含了信息收集工具、漏洞利用工具以及其他功能。理解这些工具的用途、其基本功能以及如何读取它们的输出。\n\
  \n**解释资产发现和设备指纹识别。** 资产发现帮助组织识别其网络上拥有什么，以及系统和设备上暴露了哪些服务。理解拓扑、操作系统、服务和主机对于确保你拥有准确的网络映射非常重要。网络映射扫描、操作系统和服务检测及其准确性，以及像生存时间（TTL）之类的拓扑信息都在此过程中发挥了作用。\n\
  \n## 实验练习\n\n### 活动 5.1：端口扫描\n\n在此练习中，你将使用 `Kali Linux` 虚拟机来：\n\n* 使用 `nmap` 对系统进行端口扫描。\n\
  * 识别系统的操作系统和版本。\n* 在端口扫描期间捕获数据包。\n\n### 第 1 部分：设置虚拟机\n\n* 关于设置 `Kali Linux` 和 `Metasitable`\
  \ 虚拟机的信息可以在本书的介绍部分找到。如果你已经设置好了，可以使用它们。\n\n    1. 启动 `Kali Linux` 和 `Metasitable`\
  \ 虚拟机并登录。用户名/密码分别为 kali/msfadmin。\n    2. 在控制台使用 `ifconfig`。\n\n### 第 2 部分：执行扫描\n\
  \n* 现在我们将对 `Metasitable` 进行扫描。`Metasitable` 被设计为存在漏洞，因此我们预计看到许多服务。\n\n    1. 打开终端窗口。\n\
  \    2. 输入 `nmap` 以及目标 IP 地址。\n    3. 现在我们将识别操作系统。重新运行 `nmap -O [target IP]` 并添加\
  \ `-p 1-65535` 以扫描所有端口。\n\n### 活动 5.2：设备指纹识别\n\n在此练习中，你将使用 `nmap` 的内置工具对设备进行指纹识别。\n\
  \n1. 重复活动 5.1 中描述的扫描，使用 `target IP`。\n2. 验证响应。\n3. 对其他设备重复扫描。如果你在自己的网络上，可以扫描电视、家居自动化设备或路由器。如果你不在控制的网络上，可以下载并运行其他虚拟机来测试此功能。\n\
  \n### 活动 5.3：使用 Metasploit Framework 进行扫描\n\n`Metasploit Framework` 包含了多种漏洞扫描工具。在此练习中，你将利用其中一个工具获得基础熟悉。在准备考试时，你可能尝试其他的\
  \ Metasploit 工具和模块。Offensive Security 的 Metasploit Unleashed 网站 `www.offensive-security.com/metasploit-unleashed`\
  \ 更深入地介绍了该工具。\n\n此实验假设你已运行了活动 5.1 中描述的虚拟机。\n\n1. 打开 Metasploit Framework。\n2. 在\
  \ `msf>` 提示符下输入 `load wmap`。\n3. 使用 `wmap_sites -a http://[target machine address]`\
  \ 添加你的目标虚拟机。\n4. 使用 `wmap_targets -t http://[target machine address]`将其设置为目标。\n\
  5. 使用命令 `wmap_run -e` 运行 wmap。\n6. 使用 `wmap_vulns -l` 查看输出。\n\n## 复习题\n\n1. Megan\
