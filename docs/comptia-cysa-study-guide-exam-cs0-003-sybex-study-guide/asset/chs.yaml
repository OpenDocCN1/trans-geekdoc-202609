  \ LDAP 注入\n\n13. 下列哪种协议不应在公共网络上使用？\n\n1. SSH\n2. HTTPS\n3. SFTP\n4. Telnet\n\n14.\
  \ Betty 正在为她创建的一个新公共网站选择传输加密协议。哪种协议是最佳选择？\n\n1. SSL 2.0\n2. SSL 3.0\n3. TLS 1.0\n\
  4. TLS 1.3\n\n15. 在对 Web 服务器进行漏洞扫描时，以下哪些情况不会导致证书警告？\n\n1. 使用不受信任的 CA\n2. 包含公共加密密钥\n\
  3. 证书过期\n4. 证书名称不匹配\n\n16. 哪种攻击取决于用户通常在同一个浏览器中同时登录许多网站这一？\n\n1. SQL 注入\n2. 跨站脚本\
  \ (XSS)\n3. 跨站请求伪造 (CSRF)\n4. 文件包含\n\n17. Bonnie 在 Web 服务器日志中发现了一些条目，表明渗透测试人员尝试访问以下\
  \ URL：\n\n`www.mycompany.com/sortusers.php?file=C:\\uploads\\attack.exe`\n\n他们最可能尝试的是哪种攻击？\n\
  \n1. 反射型 XSS\n2. 持久型 XSS\n3. 本地文件包含\n4. 远程文件包含\n\n18. 下列哪个术语通常不用于描述物理设备连接到网络？\n\n\
  1. IoT\n2. IDS\n3. SCADA\n4. ICS\n\n19. Monica 发现一名攻击者在她管理的某个 Web 论坛上发布了一条信息，攻击访问该网站的用户。以下哪种攻击类型最可能发生了？\n\
  \n1. SQL 注入\n2. 恶意软件注入\n3. LDAP 注入\n4. 跨站脚本\n\n20. Alan 在攻击后正在审阅 Web 服务器日志，发现许多记录中来自终端用户的查询语句包含分号和单引号。他应该怀疑是哪种攻击？\n\
  \n1. SQL 注入\n2. LDAP 注入\n3. 跨站脚本\n4. 缓冲区溢出\n\n# 第 8 章：响应漏洞\n\n在 第 6 章和第 7 章中，你学习了组织进行漏洞扫描以及解释扫描结果的各种方法。在本章中，我们将关注接下来的工作——组织应对其环境中存在的漏洞的方法。我们将从风险管理流程开始，然后深入探讨你可以响应漏洞的具体方法。\n\
  \n## 分析风险\n\n我们生活在一个充满风险的世界里。如果你今天早上离开家开车去办公室，你遇到了许多风险。你可能卷入汽车祸、遇到列车延误、在人行道上被自行车撞到，甚至从电梯里的其他乘客那里感染了危险病毒。我们潜意识里知道这些风险，但并不会让它们让我们瘫痪。相反，我们采取简单的预防措施来帮助管理我们认为最可能干扰我们生活的风险。\n\
  \n在*企业风险管理 (ERM)* 计划中，组织采取正式的方法进行风险分析，从识别风险开始，持续到确定每种风险的严重程度，最后采用一种或多种*风险管理*策略来应对每种风险。\n\
  \n在我们深入研究风险评估过程之前，让我们定义几个在讨论中将用到的重要术语：\n\n*   *威胁 (Threats)* 是任何可能对我们信息或信息系统的机密性、完整性和/或可用性产生不利影响的可能事件。\n\
  *   *漏洞 (Vulnerabilities)* 是我们系统或控制中的缺陷，可能会被威胁利用。\n*   *风险 (Risks)* 发生在漏洞和威胁的交汇点。\n\
  \n\n\n\n\n*   `probability`（概率），即风险发生的可能性。我们可以将其表达为威胁在特定时间范围内（例如未来一年内）利用漏洞的百分比几。\n\
  \n*   `magnitude`（规模），或影响，如果风险真的发生，对组织产生的影响。我们可以将其表达为因风险而将遭受的财务成本，尽管还有其他可能的衡量标准。\n\
  \n通过使用这两个因素，我们可以结合概率和规模为每个风险分配一个概念性分数。这使得许多风险分析师使用此公式来表示风险的严重性：\n\n![upper R i s\
  \ k upper S e v e r i t y equals upper P r o b a b i l i t y times upper M a g n\
  \ i t u d e](img/c08-disp-0001.png)<<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  ><mrow><mi mathvariant=\"normal\">Risk&#160;Severity</mi><mo>=</mo><mi mathvariant=\"\
  normal\">Probability</mi><mo>&#215;</mo><mi mathvariant=\"normal\">Magnitude</mi></mrow></math>\
  \ \n\n需要指出的是，这个方程并不总是必须从字面上解释。虽然在某些风险评估过程中你最终可能会将这些值相乘，但最好从概念上将其理解为通过结合概率和规模来确定风险的严重性。\n\
  \n当我们评估在街上被自行车或陨石击中的风险时，我们可以使用这些因素来评估风险的严重性。我们被自行车击中的概率可能很高。这类事故的影响规模可能是中等的，使我们愿意考虑采取措施来降低风险。被陨石击中显然具有灾难性的影响规模，但此类事件发生的概率极低，导致我们承认该风险并在不改变行为的情况下忽略。\n\
  \n### 业务影响分析\n\n`business impact analysis (BIA)`（业务影响分析）是一种正式的风险优先级排序方法，允许组织以结构化的方式进行审查。BIA\
  \ 遵循两种不同的分析方法：\n\n*   `Quantitative risk assessments`（定量风险评估）在分析中使用数值数据，得出的评估允许对风险进行非常优先级排序。\n\
  \n*   `Qualitative risk assessments`（定性风险评估）用主观判断和分类代替严格的数值分析，允许对难以量化的风险进行评估。\n\n\
  随着组织寻求向利益相关者清晰沟通风险因素，他们通常结合定量和定性风险评估的元素。让我们回顾一下这些方法。\n\n#### 定量风险评估\n\n大多数定量风险评估过程遵循相似的方法，包括以下步骤：\n\
  \n1.  确定受风险影响资产的资产价值（`AV`）。该 `asset value (AV)` 以美元或其他货币表示，并可以根据组织的偏好，使用获取资产的成本、更换资产的成本或资产的折旧成本来确定。\n\
  \n2.  确定风险发生的可能性。风险分析师咨询领域专家并确定风险在某一年内发生的概率。这被表达为每年预计发生的次数，并描述为 `annualized rate\
  \ of occurrence (ARO)`（年发生率）。预计每年发生两次的风险 `ARO` 为 `2.0`，而预计每年发生一次的风险 `ARO` 为 `1.0`。\n\
  \n3.  确定如果风险发生，将造成的损害金额。这被称为 `exposure factor (EF)`（暴露因子）。完全销毁资产的风险其 `EF` 为 `100%`，而会损坏资产一半的风险其\
  \ `EF` 为 `50%`。\n\n4.  计算单次损失预期。`single loss expectancy (SLE)`（单次损失预期）通过 `AV` 乘以\
  \ `EF` 计算得出。\n\n5.  计算年损失预期。`annualized loss expectancy (ALE)`（年损失预期）是 `SLE` 和 `ARO`\
  \ 的乘积。\n\n\n\n\n\n# 图 8.2 (#c08.xhtml#R_c08-fig-0002) 定性风险评估使用主观评分量表来评估概率和影响。\n\n\
  虽然使用定性技术评估的风险无法直接计算其财务影响，但这种风险评估量表使得风险优先级排序成为可能。例如，查看图 8.2 中的风险评估，我们可以确定该组织面临的最大风险是未加密设备被盗和鱼叉式网络钓鱼攻击。这两种风险都具有高概率和高影响。。如果我们正在考虑使用资金为数据中心增加更好的物理安全性，这项风险评估告诉我们，我们的时间和金钱可能花在移动设备的全盘加密和安全电子邮件网关上更好。\n\
  \n### 风险管理\n\n完成风险评估后，组织可以将注意力转向处理这些风险。`Risk management`（风险管理）是系统处理组织所面临风险的过程。风险评估在风险管理过程中起着两个重要作用：\n\
  \n*   风险评估为确定风险优先级提供指导，以便优先处理概率和影响最大的风险。\n*   定量风险评估有助于确定风险的潜在影响是否足以抵消采用风险管理方法所产生的成本。\n\
  \n风险经理应该完成风险评估，并为评估中包含的每种风险确定适当的管理策略。他们有四种策略可供选择：风险缓解、风险规避、风险转移和风险接受。在接几个章节中，我们将通过两个示例讨论这些这些策略。\n\
  \n首先，我们讨论与员工笔记本电脑被盗相关的财务风险。在例例中，我们假设笔记本电脑不包含任何未加密的敏感信息。我们正在管理的风险是丢失实际硬件的财务影响。\n\n\
  其次，我们讨论与针对组织网站的分布式拒绝服务攻击（`DDoS`）相关的业务风险。\n\n我们使用这两个场景来帮助你理解在选择风险管理策略时可提供的不同选项，以及在该选择过程中涉及的权衡。\n\
  \n### 风险缓解\n\n`Risk mitigation`（风险缓解）是通过应用安全控制措施来降低风险概率和/或影响的过程。风险缓解是最常见的风险管理策略，安全专业人员的大部分工作都围绕着通过安全控制的设计、实施和管理来缓解风险展开。许多此类控制措施涉及功能、性能和安全性之间的工程权衡。我们将在本章后面的部分讨论一些安全控制措施的示例。\n\
  \n当你选择缓解某种风险时，可能会应用一种安全控制措施或一系列安全控制措施。每种控制措施都应该降低风险发生的概率、风险发生时的影响，或者两者都降低（概率和影响）。\n\
  \n在我们的第一个场景中，我们担心组织的笔记本电脑被盗。如果我们想缓解该风险，可以从各种安全控制措施中进行选择。例如，为笔记本电脑购买防盗锁可能会减少盗窃发生的概率。\n\
  \n我们还可以选择购买设备注册服务，为设备提供防篡的注册标签，例如图 8.3 所示的 `STOP` 标签。当这些标签贴在设备上时，它们会对潜在的窃贼提供明显的警告，如图\
  \ 8.3(a)所示。这对盗窃具有威慑作用，减少了笔记本电脑被盗的概率。如果小偷确实偷了设备并取掉了标签，它会留下永久残留物，如图 8.3(b)所示。任何发现设备的人都被指示联系注册供应商获取说明，从而减少了设备归还时盗窃的潜在影响。\n\
  \n![图 8.3 (a) 贴在设备上的 STOP 标签；(b) 尝试移除 STOP 标签后设备上残留的残留来源：(a) 和 (b) Doug Belfiore](img/c08f003.png)\n\
  \n# 图 8.3 (#c08.xhtml#R_c08-fig-0003) (a) 贴在设备上的 STOP 标签；(b) 尝试移除 STOP 标签后设备上残留的残留来源：(a)\
  \ 和 (b) Doug Belfiore\n\n在我们的第二个场景中，即针对组织网站的 `DDoS` 攻击，我们可以从几种缓解措施中进行选择。例如，我们可以购买更多的带宽和服务器容量，允许我们吸收\
  \ `DDoS` 攻击的轰炸，从而减少攻击的影响。我们还可以选择购买第三方 `DDoS` 缓解服务，防止流量到达我们的网络，从而减少攻击发生的概率。\n\n###\
  \ 风险规避\n\n`Risk avoidance`（风险规避）是一种风险管理策略，通过改变业务实践来完全消除风险发生的可能性。风险规避最初看起来可能是一个非常理想的方法。毕竟，谁不想消除其组织面临的风险呢？然而，它也有一个巨大的缺点。风险规避策略通常会对业务产生严重的负面影响。\n\
  \n例如，考虑本章前面讨论的笔记本电脑被盗风险。我们可以采取风险规避策略，通过不允许员工购买或使用笔记本电脑来完全消除风险。这种方法非常笨拙，并且由于对员工生产力产生负面影响，可能会受到员工和经理的强烈反对。\n\
  \n同样，我们可以通过简单关闭网站来规避针对组织网站的 `DDoS` 攻击风险。如果没有网站被攻击，就没有 `DDoS` 攻击影响网站的风险。但业务领导者极不可能接受关闭网站作为一种可行方案。事实上，你可能会发现自己为了避免\
  \ `DDoS` 攻击而被迫关闭网站，这本身就是终极拒绝服务攻击！\n\n### 风险转移\n\n`Risk transference`（风险转移）是将风险的影响从遭受风险的组织转移到另一个实体。风险转移最常见的例子是购买涵盖风险的保险单。在购买保险时，客户向保险公司支付保费。作为交换，保险公司同意承担保单中指定风险的损失。\n\
  \n在笔记本电脑被盗的示例中，财产保险可能会涵盖该风险。如果员工的笔记本电脑被盗，保险单将提供资金来支付被盗设备的价值或更换设备的费用，取决于具体的类型。\n\n\
  财产保险单不太可能涵盖 `DDoS` 攻击。事实上，许多通用业务保险单都排除了所有网络安全风险。寻求此类攻击保障的组织应该购买网络安全保险，既可以是单独的保单，也可以作为现有业务保险单的附加条款。这种保障将偿还恢复运营的部分或全部费用，并可能涵盖攻击期间的收入损失。\n\
  \n### 风险接受\n\n`Risk acceptance`（风险接受）是最后一种风险管理策略，其核心在于蓄意选择不采取其他风险管理策略，并在面对风险时 simply\
  \ 保持正常运营。如果缓解风险的成本大于风险本身的影响，那么采取风险接受的方法可能是合理的。\n\n\n\n\n在我们的笔记本电脑被窃示例中，我们可能会认为其他风险管理策略都是不适用的。例如，我们可能觉得电缆锁是一种不必要的负担，而且防盗寻回标签不太可能有效，导致我们没有可行的风险缓解策略。业务领导者可能要求员工配备笔记本设备，这使得“风险规避”不再考虑范围内。此外，笔记本电脑保险单的成本可能太高，无法证明其价值。在这种情况下，我们可能会决定直接接受这种风险，并在发生盗窃事件时支付被盗设备的费用。这就是风险接受。\n\
  \n在 DDoS 风险的情况下，我们可能会进行类似的分析，并决定风险缓解和转移策略成本过高。在我们继续运营网站的情况下，我们可能会接受 DDoS 攻击可能导致网站崩溃的风险继续运行。\n\
  \n## 实现安全控制措施\n\n当组织分析其风险环境时，技术和业务领导者会确定保护其信息和系统的机密性、完整性和可用性所需的保护水平。他们通过编写组织希望实现的\
  \ `control objectives`（控制目标）来表达这些需求。这些控制目标是对所期望安全状态的陈述，但它们本身并不会执行安全活动。`Security\
  \ controls`（安全控制措施）是实现组织安全目标的特定措施。\n\n### 安全控制类别\n\n安全控制措施根据其作用机制进行分类，即它们实现目标的方式进行分类。安全控制有三种不同的类别：\n\
  \n*   `Technical controls`（技术控制）在数字空间内强制机密性、完整性和可用性。技术安全控制的示例包括防火墙规则、访问控制列表、入侵防御系统和加密。\n\
  \n*   `Operational controls`（运营控制）包括我们建立的、用于以安全方式管理技术的流程。这些包括用户访问审查、日志监控和漏洞管理。\n\
  \n*   `Managerial controls`（管理控制）是侧重于风险管理过程机制的程序化机制。管理控制的示例包括定期的风险评估、安全规划演练，以及将安全整合到组织的变更管理、服务采购和项目管理实践中。\n\
  \n组织应该根据其为环境选择的标准或外部监管机构施加给它们的标准和参数，选择一组符合其控制目标的安全控制措施。例如，处理敏感信息的组织可能会决定，围绕该信息的机密性问题需要最高水平的控制。同时，他们可能会得出其网站的可用性并非至关重要的结论。考虑到这些因素，他们将投入大量资源用于敏感信息的机密性，而可能投入很少甚至没有时间和金钱来保护其网站免受拒绝服务攻击。\n\
  \n许多控制目标需要技术、运营和管理控制的结合。例如，一个组织可能有一个防止未经授权的访问数据中心的控制目标。他们可能通过实施生物识别访问控制（技术控制）、对授权的访问进行定期审查（运营控制）以及进行例行风险评估（管理控制）来实现这一目标。\n\
  \n### 安全控制类型\n\n我们还可以根据其预期效果将安全控制分为不同的类型。安全控制的类型包括：\n\n*   `Preventive controls`（预防性控制）旨在在安全问题发生之前将其阻止。防火墙和加密是预防性控制的示例。\n\
  \n*   `Detective controls`（检测性控制）识别已经发生的安全事件。入侵检测系统是检测性控制。\n\n*   `Responsive controls`（响应性控制）帮助组织应对活跃的安全事件。使用可以分流并指导第一批响应人员的\
  \ 24×7 安全运营中心是响应性控制的示例。\n\n*   `Corrective controls`（纠正性控制）修复已经发生的安全问题。在勒索软件攻击后恢复备份是纠正性控制的示例。\n\
  \n*   `Compensating controls`（补偿性控制）旨在减轻与对安全策略所许可的例外相关的风险。\n\n## 威胁分类\n\n虽然有许多分类威胁的方法，但常见的分类包括区分已知威胁（你了解并可能拥有其有用信息的威胁）和未知威胁（你只能通过使用通用控制和流程来做准备的威胁）。零日威胁（Zero-day\
  \ threats），或利用未知安全漏洞的威胁，是最常见的威胁类型之一。\n\n高级持续威胁者，特别是拥有国家实力的者，通常获取漏洞信息并利用。\n\n###\
  \ 威胁研究与建模\n\n组织通过开展威胁建模积极寻求理解可能面临的威胁。威胁建模考虑了许多因素，但常见的元素包括：\n\n*   评估 `adversary\
  \ capability`（对手能力），即攻击者的资源、意图和能力。\n\n*   你正在评估的组织总 `attack surface`（总攻击面）。\n\n\
  *   列出可能的 `attack vectors`（攻击向量），即攻击者访问目标的手段。\n\n*   如果攻击成功的影响。\n\n*   攻击发生的可能性。\n\
  \n所有这些项目都可以评分，以帮助评估风险，并帮助组织理解其面临的威胁。\n\n一旦组织建立了威胁模型，或将其作为威胁建模活动的一部分，他们将进行威胁研究。有很多类型的威胁研究供你或你的组织选择。你可能会查看网站、网段或攻击者的声誉，以确定他们是否有恶意行为的历史或习惯。这被称为\
  \ `threat reputation`（威胁声誉），它通常与 IP 地址或域名配合，但也存在文件声誉服务和数据馈。\n\n你可以通过 Cisco 的 Talos\
  \ Intelligence 声誉查询工具查看示例，地址为 `https://ososintelligence.com/reputation_center`，如图\
  \ 8.4（c08.xhtml#c08-fig-0004）所示。注意，你可以看到主机所有者的 DNS 信息，以及电子邮件声誉、网络声誉、它发送了多少垃圾邮件以及它是否在已知恶意攻击者列表中。\n\
  \n行为评估对于内部威胁特别有用，因为内部威胁行为通常与工作或角色相关的任务难以区分。检测内部威胁行为高度依赖于所执行操作的上下文；对内部人员与之交互的所有系统、应用程序和网络的广泛视图；以及提供长期洞察的可用性。许多内部攻击依赖于特权账户滥用、对敏感信息的访问以及共享密码的使用。\n\
  \n\n\n\n另一种用于评估威胁的指标是`indicators of compromise (IOCs)`（入侵指示物）。入侵指示是能够帮助识别攻击的取证证据或数据。与其他评估方法不同，入侵指示专门在攻击开始后才使用——尽管攻击可能仍在进行！尽管如此，这并不意味着它们对威胁评估没有用。\n\
  \n了解哪些 `IOCs` 与特定的威胁攻击者或常见的漏洞路径相关，可以帮助防御者采取适当措施防止进一步的入侵，并可能识别出威胁攻击者。它还能帮助防御者限制损害或阻止攻击进展。\n\
  \n![图 8.4 单个主机的 Talos 信誉报告](img/c08f004.png)\n\n**图 8.4** 单个主机的 Talos 信誉报告\n\n##\
  \ 管理计算环境\n\n计算环境是由应用程序、操作系统、服务器、终端、网络设备和其他组件组成的复杂生态系统，这些组件相互作用以满足业务需求。这种复杂性也为漏洞的产生提供了机会，可能会威胁该环境的安全。组织可以采取重要行动来管理其计算活动，以降低风险。这些活动包括攻击面管理、变更和配置管理以及补丁管理。\n\
  \n### 攻击面管理\n\n组织的 `attack surface`（攻击面）是所有对攻击者暴露并可能允许这些攻击者访问组织环境的系统和服务组合。攻击面包含了从边界防火墙到公共\
  \ Web 服务器，从移动的笔记本电脑到移动设备的所有内容。\n\n寻求管理组织攻击面的网络安全分析师可能会从事各种活动。这些包括：\n\n* `Edge discovery`（边缘发现）扫描，通过扫描属于组织的\
  \ IP 地址来识别任何公开暴露的系统或设备\n* `Passive discovery`（被动发现）技术，通过监控入站和出站流量来检测其他扫描中未出现的设备\n\
  * `Security controls testing`（安全控制测试），验证组织的一系列安全控制措施是否运行正常\n* `Penetration testing\
  \ and adversary emulation`（渗透测试和对手模拟），旨在模拟对手的行为来发现组织安全控制措施中的缺陷\n\n网络安全分析师随后可以使用这些发现和测试技术的结果对环境进行更改，以提高安全性。进行这些更改被称为`attack\
  \ surface reduction`（攻击面减少），因为它减少了潜在攻击者攻击组织的方式。\n\n### 变更和配置管理\n\n`Configuration\
  \ management`（配置管理）跟踪特定终端设备的设置方式。配置管理同时跟踪操作系统设置和设备上安装的软件清单。`Change management`（变更管理）程序为组织提供了一个正式流程，用于识别、请求、批准和实施配置的变更。\n\
  \n`Baselining`（基线设定）是配置管理的一个重要组成部分。基线是系统或应用程序在特定时间的快照。它可用于评估系统是否在批准的变更管理之外发生了更改。系统管理员可能会将运行中的系统与基线进行比较，以识别系统的所有更改，然后将这些更改与批准的变更请求列表进行对比。\n\
  \n`Version control`（版本控制）也是变更管理程序的关键组成部分，特别是在软件和脚本开发领域。版本控制为软件的每个发布版本分配一个递增的版本号，用于识别任何特定副本。\n\
  \n配置管理还应该创建可能有助于理解系统配置的制品。例如，图表在理解系统配置方面经常起着作用。\n\n### 补丁管理\n\n对操作系统应用补丁至关重要，因为这确保系统不会受到攻击者发现的漏洞的影响。在\
  \ Windows 中，Windows Update 机制是应用补丁最简单的方法。在 Linux 上，管理员可能会根据其发行版使用多种机制。作为安全管理员，你应该确保你的系统配置为在更新发布时接收更新。\n\
  \n## 软件保证最佳实践\n\n构建、部署和维护软件需要在整个生命周期中引入安全参与。CySA+ 考试目标重点关注软件生命周期、软件评估方法和工具、编码实践、平台和架构。\n\
  \n### 软件开发生命周期\n\n`software development life cycle (SDLC)`（软件开发生命周期）描述了软件开发模型中的步骤。如图\
  \ 8.5\n\n**图 8.5** 高级 SDLC 视图\n\n### 软件开发阶段\n\n无论组织选择哪种 SDLC 或流程，大多数 SDLC 模型中都会出现几个阶段：\n\
  \n1. `feasibility`（可行性）阶段是开展是否应该进行该工作调查的阶段。可行性还会考虑替代方案以及每个提议方案的高层成本。其结果是一个带有后续行动计划的建议。\n\
  2. 一旦项工作被认为可行，它通常会进入 `analysis and requirements definition`（分析和需求定义）阶段。在此阶段，将寻求客户输入以确定所需的功能是什么、当前系统或应用程序做了和没有做什么，以及希望哪些改进。可能会对需求进行排序，以确定哪些需求对项目的成功至关重要。\n\
  \n\n\n\n\n### 3. `design` 阶段包括功能设计、架构设计、集成点与技术、数据流、业务流程以及任何需要设计考虑的元素。\n\n### 4.\
  \ 应用程序的实际编码发生在 `development` 阶段。此阶段可能涉及软件部分的测试，包括 `unit testing`（对小型组件进行单独测试以确保其功能正常）和\
  \ `code analysis`。\n\n### 5. 虽然开发阶段可能会进行某些测试，但与客户或开发团队之外人员的正式测试发生在 `testing and\
  \ integration` 阶段。单个单元或软件组件将被集成并然后进行测试，以确保功能正常。此外，与外部服务、数据源和其他内容的连接也可能在此阶段发生。在此阶段，会进行\
  \ `user acceptance testing` (UAT)，以确保软件用户对其功能表示满意。\n\n### 6. 确保最终用户接受过软件培训并确保软件进入通用使用的重要任务发生在\
  \ `training and transition` 阶段。此阶段有时被称为验收、安装和部署阶段。\n\n### 7. 一旦项目完成，应用程序或服务将进入通常是最长的一个阶段：`ongoing\
  \ operations and maintenance`。此阶段包括补丁、更新、微调以及其他日常支持工作。\n\n### 8. 当产品或系统寿命结束时，进入\
  \ `disposition` 阶段。尽管在开发新产品的兴奋，处置往往会被忽视，但出于多种原因，它是一个重要的阶段：停止旧产品可以节省成本，更换现有工具可能需要特定知识或额外努力，数据和系统可能需要保存或妥善处置。\n\
  \n阶段的顺序可能有所不同，某些以简单的线性方式进行，而另一些则迭代或并行方法。在成功的软件生命周期中，你仍然可以看到这些阶段的某种形式。\n\n## 软件开发模型\n\
  \nSDLC 有许多处理方法，随着时间的推移，已经建立了许多正式模型来帮助为开发提供通用框架。虽然正式的 SDLC 模型可以非常详细，包含特定的实践、程序和文档，但许多组织会选择一个或多个模型中最符合其组织风格、工作流和要求的元素。\n\
  \n### 瀑布型\n\n`Waterfall` 方法论是一种顺序模型，每个阶段之后都跟着下一个阶段。阶段之间不重叠，每个阶段在逻辑上引向下一个阶段。典型的六阶段瀑布流程见图\
  \ 8.6。在阶段 1 中，收集并记录需求。阶段 2 涉及旨在构建业务规则和模型的分析。在阶段 3 中，设计软件架构，并在阶段 4 中进行软件的编码和集成。一旦软件完成，进入阶段\
  \ 5，在此阶段完成测试和调试。最后，软件进入运行阶段，支持、维护和其他运营活动将持续进行。\n\n![FIGURE 8.6 The Waterfall SDLC\
  \ model](img/c08f006.png)\n\n**FIGURE 8.6** 瀑布型 SDLC 模型\n\n瀑布模型在许多组织中已被其他方法取代，因为它被认为相对缺乏活性，但它仍在使用于复杂系统。由于瀑布模型对变化的响应并不灵敏，因此无法快速响应变化。\n\
  \n### 螺旋型\n\n`Spiral` 模型使用了瀑布模型的概念，并增加了一个多次访问各个阶段的迭代过程。图 8.7 所示的螺旋模型使用了四个阶段：\n\n\
  1. `Identification`，或需求收集。\n2. `Design`，概念性的、逻辑性的有时是物理性的。\n3. `Build`，产生初始证明。\n\
  4. `Evaluation`，涉及风险评估。\n\n![FIGURE 8.7 The Spiral SDLC model](img/c08f007.png)\n\
  \n**FIGURE 8.7** 螺旋型 SDLC 模型\n\n### 敏捷\n\n`Agile` 软件开发是一个迭代和增量的过程，而不是瀑布和螺旋模型所使用的线性过程。敏捷源于《敏捷开发宣言》，该文档包含四个前提：\n\
  \n* 个人和交互比过程和工具更重要。\n* 可行的软件优于详尽的文档。\n* 客户协作取代合同谈判。\n* 响应变化是关键，而不是遵循计划。\n\n工作通常被分成短的工作会议，称为\
  \ `sprints`，持续时间几天到几周不等。图 8.8 显示了具有多个迭代的敏捷项目方法的简化视图。\n\n![FIGURE 8.8 Agile sprints](img/c08f008.png)\n\
  \n**FIGURE 8.8** 敏捷迭代\n\n\n\n\n\n*   进展通过交付可运行的软件来衡量。\n*   开发应以可以持续维持的进度进行。\n* \
  \  持续关注技术卓越性和良好的设计。\n*   简单性——最大化未完成工作量的艺术——是至关重要的。\n*   最佳的架构、需求和设计源于自组织团队。\n*\
  \   团队应该反思如何变得更高效，然后定期实施这些行为。\n\n这些原则驱动着一种软件开发生命周期（SDLC）过程，该过程的结构化比螺旋模型或瀑布模型不那么正式，但提供了许多客户反馈和修订的机会。它能够更敏捷地响应问题，并且通常允许更快的客户反馈——这在发现安全问题时是一个巨大的优势。\n\
  \n敏捷开发使用了一系列专业术语：\n\n*   `Backlogs`（待办列表）是完成项目所需的特性或任务列表。\n*   `Planning poker`（计划扑牌）是敏捷开发过程中用于估计和规划的工具。估算者获得带有完成任务所需工作量分值的卡片。估算者被要求进行估计，并且每个人透露他们对任务的“出价”。这一过程一直持续到达成共识，目标是估算者通过讨论达成相同的估计值。\n\
  *   `Timeboxing`（时间箱）是一个描述使用时间箱的术语。时间箱是个人或团队预先约定的用于完成某个特定目标的时间。它将某个目标的时间限制在时间箱时间内，而不是允许工作一直持续完成。一旦时间箱结束，将对完成的工作进行评估，以确定下一步需要做什么。\n\
  *   `User stories`（用户故事）被收集用于描述高层用户需求。一个用户故事可能是“用户可以通过移动应用程序更改他们的密码”，这将为敏捷工作会议的估计和规划提供方向。\n\
  *   Velocity tracking（速率跟踪）通过累加当前冲刺的工作量估计值，然后将其与完成的内容进行比较来进行。这告诉团队他们是正处于轨道上、更快还是比预期更慢。\n\
  \n### 快速应用开发\n\nRAD（快速应用开发）模型是一个依赖于构建原型的迭代过程。与许多其他方法不同，它没有规划阶段；相反，规划是在编写软件时完成的。RAD\
  \ 依赖于并行开发的各个组件，然后将其集成以产生最终产品。与敏捷开发类似，RAD 可以提供一个高响应的开发环境。\n\nRAD 涉及五个阶段，如图图 8.9\n\
  \n**图 8.9** 快速应用开发原型\n\n### DevSecOps 和 DevOps\n\n`DevOps` 将软件开发与 IT 运维相结合，目标是优化\
  \ SDLC。这是通过使用称为工具链（toolchains）的工具集合实现的，旨在改进开发生命周期中的编码、构建与测试、打包、发布、配置和配置管理以及监控元素。\n\
  \n当然，DevOps 也应该将安全内置在其中。`DevSecOps` 术语将安全描述为 DevOps 模型的一部分。在这个模型中，安全是一项共同责任，是整个开发和运维周期的一部分。这意味着将安全集成到生成应用程序和服务的所进行的设计、开发、测试和运维工作中。\n\
  \n安全从业人员在 DevSecOps 模型中的角色包括威胁分析与通信、规划、测试、提供反馈，当然还有持续改进和安全意识的责任。做到这一点需要对组织的风险容忍度有深刻的理解，并意识到\
  \ DevSecOps 环境中的其他参与者在做什么以及何时做。DevOps 和 DevSecOps 经常与持续集成和持续部署方法相结合，在这些方法中，它们可以依靠自动化安全测试以及集成的安全工具（包括扫描、更新和配置管理工具）来确保安全。\n\
  \n### 持续集成与持续部署\n\n`Continuous integration`（持续集成，`CI`）是一种开发实践，持续持续地将代码提交到共享存储库中。在持续集成环境中，其范围可以从每天几次到非常频繁的提交和自动化构建。\n\
  \n由于持续集成依赖于自动化构建过程，它还需要自动化测试。它通常还与`continuous deployment`（持续部署，`CD`，有时称为持续交付）配合使用，在更改一旦通过测试后自动将其发布到生产环境。\n\
  \n图 8.10\n\n**图 8.10** CI/CD 流水线\n\n使用持续集成和持续部署方法需要将自动化安全测试构建到流水线测试过程中。可能会导致新的漏洞部署到生产环境中，并可能允许不可信或恶意的开发者在部署的代码中插入缺陷，然后在下一个循环中移除这些代码。这意味着日志、报告和监控都必须设计为适应\
  \ CI/CD 流程。\n\n## 为了安全进行设计和编码\n\n作为安全专业人员参与 SDLC 为提高应用程序安全性提供了重大机会。帮助软件安全的第一个机会是在需求收集和设计阶段，此时安全可以作为需求的一部分被构建，并根据这些需求进行设计。随后，在开发过程中，安全编码技术、代码审查和测试可以提高开发代码的质量和安全性。\n\
  \n在测试阶段，可以使用 Web 应用安全扫描或渗透测试技术对集成软件进行测试。这为持续的安全运营奠定了基础，为补丁和更新期间未来的安全扫描和回归测试建立了基准。在整个过程中，理解开发者面临的常见问题会有帮助。\n\
  \n### 常见的软件开发安全问题\n\n安全从业人员可能会遇到许多软件缺陷，但让我们关注一些最常见的，例如以下：\n\n\n\n\n\n*   `错误的错误处理`（Improper\
  \ error handling）通常会导致不应暴露在安全环境之外的错误信息能够被攻击者或普通公众访问。由于错误通常包含发生错误时现场的详细信息，攻击者可以利用这些信息了解应用程序、数据库，甚至获取堆栈跟踪信息，这些信息可以提供他们在进一步攻击中利用的详尽细节。看似没有提供详细信息的错误，仍然可能让攻击者了解更多关于应用程序的信息，因为不同的响应可以给攻击者提供关于其尝试成功程度的线索。作为安全实务人员，你应该密切关注显示可访问错误信息的应用程序漏洞报告，以及这些信息的内容。\n\
  \n*   `解引用`（Dereferencing）问题通常是由于空指针解引用引起的。这意味着一个值为 `NULL`（换句话说，即未设置值）的指针被当成包含预期值来使用。除非被错误处理程序捕获，否则这类错误几乎总是会导致程序崩溃。正如稍后将提到的，竞态条件（Race\
  \ conditions）也是发现解引用问题的常见出处。\n\n*   `不安全的对象引用`（Insecure object references）发生在应用程序暴露内部对象的信息时，允许攻击者看到对象在后端存储系统中是如何被标识和存储的。一旦攻击者知道了这些，他们就可能利用这些信息获取进一步的访问，或者对他们无法以此方式查看的其他数据对象做出假设。\n\
  \n*   `竞态条件`（Race conditions）依赖于时。需要对对象执行操作的应用程序可能对该对象正在发生或已经发生的情况敏感。虽然竞态条件并不总是可靠，但它们可能非常强大，针对竞态条件的反复攻击可能会导致攻击者获得成功。\n\
  \n*   `身份验证破解`（Broken authentication）正如其字面意思。实现不当的身份验证可能允许未登录或未以正确权限用户登录的攻击者访问资源。实现一个强大且可靠的身份验证（以及授权！）系统是应用程序编码的重要部分。\n\
  \n*   `敏感数据泄露`（Sensitive data exposure）可能在多个缺陷中的任何一个被利用时发生。这种情况最简单的形式是应用程序没有妥善保护敏感数据，允许攻击者访问它。\n\
  \n*   `不安全的组件`（Insecure components）包括当应用程序或服务的组件存在漏洞时引入的广泛问题，从而将该漏洞引入应用程序中。了解构成应用程序的所有组件和模块，对于判断其是否存在由于这些组件而导致的已知漏洞至关重要。\n\
  \n*   `日志和监控不足`（Insufficient logging and monitoring）将导致在出现问题时无法确定发生了什么。强大的安全设计的一部分是确定哪些内容应该被记录和监控，确保它们被妥善捕获，然后建立流程和系统来处理这些日志和事件，以便在它们发生时采取正确的处理措施。\n\
  \n*   `弱或默认配置`（Weak or default configurations）在应用程序和服务未经过妥善设置或使用默认设置时非常常见。其一个常见的例子是对服务或数据库连接使用默认密码。许多应用程序漏洞扫描器都会寻找这些默认配置，使得攻击者更容易找到它们。\n\
  \n*   `使用不安全的函数`（Use of insecure functions）会使代码的加固变得困难得多。像 `strcpy` 这样没有内置关键安全功能的函数可能会导致代码更容易被攻击者针对。`strcpy`\
  \ 允许在拷贝数据时而不关心源地是否大于目标地。如果发生这种情况，攻击者可以在原始目标地之外的内存位置放置任意数据，可能导致缓冲区溢出攻击的成功。\n\n###\
  \ 安全编码最佳实践\n\n生成安全代码的最佳实践将取决于应用程序、其基础设施和后端设计，以及它是用什么框架或语言编写的。尽管如此，许多相同的开发、实现和设计最佳实践适用于大多数应用程序。这些包括以下：\n\
  \n*   `输入验证`（Input validation）有助于防止从跨站脚本（XSS）到 SQL 注入攻击的各种范围的问题。\n\n*   `输出编码`（Output\
  \ encoding）在目标应用程序或解释器读取特殊字符之前，将特殊字符翻译成等效但安全的版本。这通过防止插入导致目标应用程序执行操作的特殊字符来帮助 XSS\
  \ 攻击。\n\n*   `安全会话管理`（Secure session management）确保攻击者无法劫持用户会话，或者会话问题不会引起用户之间的混淆。\n\
  \n*   `身份验证`（Authentication）将应用程序的访问限制为仅经过身份验证的用户或系统。使用`多因素身份验证`（multifactor authentication）有助于限制凭据泄露的影响。\n\
  \n*   `数据保护`（Data protection）技术（如加密）可以保护数据在存储或通过网络传输时免受窃听和其他机密性违规的影响。\n\n*   `参数化查询`（Parameterized\
  \ queries）通过预编译 SQL 查询来防止 SQL 注入攻击，这样在执行查询时可能就不会插入新代码。\n\n## 软件安全测试\n\n无论应用程序的开发团队有多才，代码中总会有某些形式的缺陷。Veracode\
  \ 最近的一项研究显示，他们扫描的 140 万个应用程序中有 83% 在初始扫描中至少有一个安全漏洞。这个数字表明，迫切需要将软件安全测试更好地集成到软件开发生命周期中。\n\
  \n安全专业人员和开发者可以使用各种手动和自动测试工具及方法。幸运的是，自动化工具一直在不断改进，为验证代码更安全提供了更简单的方法。在接下来的几页中，我们将回顾一些关键的软件安全测试方法。\n\
  \n### 软件评估：测试和分析代码\n\n构成应用程序的基础代码可能包含各种错误，从编程和语法错误到业务逻辑、错误处理以及与其他系统集成方面的问题。分析代码以理解它是做什么的、如何执行该任务以及何时可能出现缺陷是非常重要的。这通常通过静态或动态代码分析，结合模糊、故障注入、变异测试和压力测试来实现。一旦对代码进行了修改并部署，必须进行回归测试，以确保修复没有产生新的安全问题。\n\
  \n### 静态代码分析\n\n`静态代码分析`（Static code analysis，也称为源代码分析）通过审查应用程序代码来进行。由于静态分析使用了应用程序的源代码，因此可以被视为一种具有完全可见性的白盒测试。这允许测试人员发现其他测试方法可能会漏掉的问题，因为这些逻辑没有暴露在其他测试方法中，或者是由于内部业务逻辑问题。\n\
  \n### 动态代码分析\n\n\n\n\n\n`动态代码分析`依赖于在执行代码的同时向其提供输入以测试软件。与静态代码分析类似，动态代码分析可以通过自动化工具或手动进行，但由于大多数动态代码测试过程中需要进行大量的测试，人们更倾向于使用自动化测试。\n\
  \n### 模糊测试 (Fuzzing)\n\n`模糊测试`（或 `fuzzing`）涉及向应用程序发送无效或随机数据，以测试其处理意外数据的能力。对应用程序进行监控，以确定其是否会崩溃、失败或以错误的方式响应。由于模糊测试涉及的数据量巨大，模糊测试通常是自动化的，它对于检测输入验证和逻辑问题以及内存泄漏和错误处理特别有帮助。遗憾的是，模糊测试往往只能识别出简单的问题；它没有考虑到复杂的逻辑或业务流程问题，而且如果不监控其进度，则可能无法提供完整的代码覆盖率。\n\
  \n### 故障注入 (Fault Injection)\n\n与模糊测试不同，故障注入直接将故障插入错误处理路径中，特别是那些极少使用或在正常测试期间可能会被忽略的错误处理机制。故障注入可以通过三种方式之一进行：\n\
  \n- 编译时注入：通过修改应用程序的源代码来插入故障\n- 协议软件故障注入：使用模糊测试技术向期望符合协议输入的应用程序或服务发送意外或不符合协议的数据\n\
  - 运行中向运行程序注入数据：通过将数据插入程序的运行内存中，或者以一种导致程序必须处理这些故障的方式来注入故障\n\n由于故障注入过程中存在人为错误的风险，故障注入通常是使用自动化工具完成的。\n\
  \n### 变异测试 (Mutation Testing)\n\n变异测试与模糊测试和故障注入有关，但它并不是改变程序的输入或向其引入故障，而是对程序本身进行细微修改。然后对这些更改后的版本（即变异体）进行测试，如果它们导致失败，则予以拒绝。变异本身由规则引导，这些规则旨在创建常见错误，并复制人员在正常编程过程中引入的错误类型。与故障注入类似，变异测试有助于识别很少使用的代码问题，但它还可以通过发现脚本未能充分测试可能问题的地方，帮助识别测试数据和脚本的问题。\n\
  \n### 压力测试与负载测试 (Stress Testing and Load Testing)\n\n应用程序的性能测试与代码缺陷测试同样重要。确保应用程序及其支持的系统能够承受预期的全生产负载是典型的\
  \ SDLC（软件开发生命周期）过程的一部分。当应用程序准备好测试时，会使用`压力测试应用程序`和`负载测试工具`来模拟全应用负载；在压力测试的情况下，会超出任何正常负载水平，以观察应用程序或系统在达到测试点时将如何响应。\n\
  \n压力测试也可以针对应用程序的单个组件进行，确保它们能够处理负载情况。在集成测试和组件测试期间，也可以使用故障注入来确保应用程序能够妥善处理高负载期间出现的问题。\n\
  \n### 安全回归测试 (Security Regression Testing)\n\n`回归测试`侧重于通过测试以确保所作的更改不会产生新问题。从安全的角度来看，这在安装补丁或对系统或应用程序应用新更新时通常会发挥作用。执行`安全回归测试`是为了确保没有引入新的漏洞、配置错误或其他问题。\n\
  \n使用 Web 应用程序漏洞扫描器和其他漏洞扫描工具进行自动化测试，通常作为自动化或半自动化回归测试过程的一部分。通过生成报告，在进行更改之前之后审查应用程序（及其底层服务器和服务）的状态，以确保其保持安全。\n\
  \n### 用户验收测试 (User Acceptance Testing)\n\n除了许多类型的安全测试外，`用户验收测试 (UAT)` 是测试周期中的一个重要元素。一旦完成应用程序或程序的所有功能和安全测试，将要求用户验证其是否满足业务需求和可用性要求。由于开发者很少了解或执行他们编写的应用程序将要执行的所有业务功能，因此阶段对于验证程序在正常情况下运行尤为重要。\n\
  \n理想情况下，UAT 应该有一个正式的测试计划，涉及用户将执行的所有业务流程示例。这应该与验收标准相结合，以指示哪些要求是可以接受的。\n\n### 调试器\
  \ (Debuggers)\n\n`调试器`在代码中也起着重要作用。这些工具旨在帮助开发者排除故障，同时也允许测试人员对执行文件进行动态分析。\n\n在准备考试时，你应该熟悉两种常用的调试工具：\n\
  \n- `Immunity debugger`：专门为渗透测试和恶意软件反向工程设计。\n- `GNU debugger (GDB)`：一种广泛使用的开源 Linux\
  \ 调试器，支持多种编程语言。\n\n渗透测试人员可能会尝试使用调试器和相关工具执行代码的反编译。这一过程尝试获取一个执行文件并通过反向工程将其转换回源代码。这一过程非常困难，且很少成功。\n\
  \n## 策略、治理与服务水平目标 (Policies, Governance, and Service Level Objectives)\n\n组织的`信息安全策略框架`包含了一系列描述组织网络安全计划的文档。这些文档的范围和复杂性差异很大，取决于组织的性质及其信息资源。这些框架通常包含四种类型的文档：\n\
  \n- 策略 (Policies)\n- 标准 (Standards)\n- 步骤 (Procedures)\n- 指南 (Guidelines)\n\n在在本节的剩余部分，你将学习这些不同类型文档之间的区别。然而，请记住，这些类别的定义在不同组织之间差异巨大，发现它们之间的界限模糊是非常常见的。虽然从初看之下这似乎是“错误的”，但它是安全理论遇到现实世界时的自然现象。只要文档实现了其预期的目的，就没有问题。\n\
  \n\n\n\n\n在许多组织中，制定政策的过程非常耗时，并且需要非常高级别的审批，通常需要来自首席执行官（CEO）。保持政策声明的高层级，可以让首席信息安全官（CISO）具备灵活性，根据业务和技术环境的变化来调整和更改特定的安全需求。例如，圣母大学的一份五页纸的信息安全政策简单地规定道：\n\
  \n> 信息治理委员会将为每种“高度敏感”数据元素创建处理标准。数据所有者可以对其管理范围内的其他数据元素创建标准。这些信息处理标准将根据数据的分类，规定用于管理大学信息及相关资产风险的控制措施。该大学的所有人员都有责任遵守这些控制措施。\n\
  \n形成对比的是，美国联邦政府的医疗与梅尔德保险服务中心（CMS）拥有一份达 95 页的信息安全政策。这份巨大的文件包含了极其详尽的要求，例如：\n\n> CMS\
  \ 首席信息官（CIO）必须维护所有监控请求记录，以及监控期间产生的任何其他摘要结果或文档。记录还必须通过记录搜索词和技术来反映监控范围。从监控中收集的所有信息必须受到控制和保护，分发仅限于监控请求中识别的人员，以及\
  \ CMS 管理员或 CMS CIO 特别指定的具有此类信息特定需求的人员。\n\n这种方法可能满足 CMS 的需求，但很难想象该文档的长期维护。冗长的安全政策往往很快过时，因为对单个要求的必要更改不断积累并被忽视，由于员工对不断发布新版本的政策感到疲惫。\n\
  \n组织通常会在信息安全策略库中包含以下文档：\n\n* `Information security policy`（信息安全策略）：为安全计划提供高层权威和指导。\n\
  * `Acceptable use policy (AUP)`（可接受使用策略）：为网络和系统用户提供信息资源明确的方向。\n* `Data ownership\
  \ policy`（数据所有权策略）：明确组织创建或使用的信息的所有权。\n* `Data classification policy`（数据分类策略）：描述组织使用的分类结构以及为数据正确分配分类的过程。\n\
  * `Data retention policy`（数据保留策略）：概述组织将维护的信息以及不同类别的工作产品在销毁前保留的时间。\n* `Account management\
  \ policy`（账户管理策略）：描述从配置到激活使用直至注销的账户生命周期。\n* `Password policy`（密码策略）：规定密码长度、复杂度、重复使用及类似问题的要求。\n\
  * `Continuous monitoring policy`（持续监控策略）：描述组织的监控方法，并告知员工其在工作场所活动受监控。\n* `Code of\
  \ conduct/ethics`（行为准则/伦理）：描述员工和关联人的预期行为，并作为政策未具体说明情况的兜底。\n\n当你阅读此列表时，可能会注意到列出的某些文档倾向于与我们对政策作为“高层文档”的描述相冲突，并且似乎更符合下一节中“标准（standard）”的定义。这是一个合理的结论。CompTIA\
  \ 特别将这些项目作为信息安全策略的元素，而许多组织会将其中某些内容（如密码要求）移动到标准文档中。\n\n### 标准 (Standards)\n\n`Standards`（标准）提供了强制性要求，描述了组织如何执行其信息安全策略。这些标准可能包括用于通用操作系统的特定配置设置、高度敏感信息必须实施的控制措施，或任何其他安全目标。标准的通常在比策略更低的组织级别获得批准，因此更改可能更频繁。\n\
  \n例如，加州大学伯克利分校维护着一份名为《电子信息最低安全标准》的详细文档，可在 `https://security.berkeley.edu/minimum-security-standards-electronic-information`\
  \ 在线获取。该文档将信息分为四个不同的数据保护级别（DPL），然后使用详细矩阵描述了不同级别的数据需要哪些控制措施、哪些是可选或不需要。该矩阵的片段出现在图\
  \ 8.11 中。\n\n![图 8.11 加州大学伯克利电子信息最低安全标准片段 来源：加州大学伯克利分校电子信息最低安全标准](img/c08f011.png)\n\
  \n`图 8.11` 加州大学伯克利电子信息最低安全标准片段 来源：加州大学伯克利分校电子信息最低安全标准\n\n标准随后提供了这些每个要求的详细描述，并对要求中使用的术语进行了定义。例如，图\
  \ 8.11 中的要求 3.1 简单读为“安全配置”。在文档的后半部分，加州大学伯克利分校将其扩展为：“资源管理员必须根据行业标准，对硬件、软件和操作系统利用良好管理的安全配置。”随后定义了“良好管理”为：\n\
  \n* 设备在部署之前必须具备安全配置。\n* 任何对定义安全配置的偏差必须通过变更管理过程批准并记录。必须存在一个流程每年审查偏离定义安全配置的偏差，以确保其持续有效。\n\
  * 必须存在一个流程定期检查设备配置并在发生任何更改时通知资源管理员。\n\n这种方法提供了一个易于阅读的文档层次结构，并根据需要提供日益增加的细节。同时注意，图\
  \ 8.11 中的许多要求行都提供了指南链接。点击这些链接将引导至针对本政策约束组织的建议，该以下文本开头：\n\n> 加州大学伯克利安全政策规定，处理涵盖数据的设备必须遵守《电子信息最低安全标准》。以下建议作为可选指导。\n\
  \n这是信息安全策略框架中三个元素协同工作的完美示例。政策设定了安全计划的高层目标，并要求遵守标准，标准包含了所需控制措施的细节。指南为寻求遵守政策和标准的组织提供建议。\n\
  \n### 程序 (Procedures)\n\n\n\n\n\n`Procedures`（程序）是详细的、分步骤的流程，个人和组织在特定情况下必须遵循这些流程。与清单类似，程序确保了实现安全目标时流程的一致性。组织可能会为构建新系统、发布代码到生产环境、响应安全事件以及许多其他任务创建程序。遵守程序是强制性的。\n\
  \n例如，Visa 发布了一份名为[如果泄露该怎么办（What to Do If Compromised)](https://usa.visa.com/dam/VCOM/download/merchants/cisp-what-to-do-if-compromised.pdf)\
  \ 的文档，该文档列出了怀疑信用卡泄露的商户必须遵循的强制流程。尽管文档标题中没有包含 `procedure`（程序）一词，但引言部分明确指出，该文档“为报告和响应疑似或确认的泄露事件确立了程序和时间表”。该文档提供的要求涵盖了事件响应的以下领域：\n\
  \n*   在三天内向 Visa 通通知该事件。\n*   向 Visa 提供初步调查报告。\n*   通知其他相关方。\n*   向 Visa 提供泄露的支付账户数据。\n\
  *   进行 PCI 取证调查。\n*   进行独立调查。\n*   保留证据。\n\n这些每个部分都提供了关于 Visa 如何期望商户处理事件响应活动的详细信息。例如，取证调查章节描述了支付卡行业取证人员（PFI）的使用，内容如下：\n\
  \n> 在发现账户数据泄露或收到独立取证调查通知后，实体必须：\n>\n> *   在五（5）个工作日内聘用 PFI（或签署合同）。\n> *   在聘用 PFI（或签署合同）后的十（10）个工作日内向\
  \ Visa 提供初步取证（即初步的）报告。\n> *   在评审完成后的十（10）个工作日内向 Visa 提供最终取证报告。\n\n这类语言没有留出太大的解读空间。Visa\
  \ 正在阐述一个清晰且强制的程序，描述了商户必须采取的行动、他们应该雇用的调查人员类型，以及完成不同里程碑的时间表。\n\n组织通常会在其策略框架中包含以下程序：\n\
  \n*   `Monitoring procedures`（监控程序），描述组织将如何执行安全监控活动，包括可能使用的持续监控技术。\n*   `Evidence\
  \ production procedures`（证据制作程序），描述组织将如何响应传票、法院命令和其他提交数字证据的合法请求。\n*   `Patching\
  \ procedures`（补丁程序），描述对组织维护的应用程序和系统应用补丁的频率和流程。\n\n当然，网络安全团队可能会根据组织的运营需求，在他们的框架中包含许多其他类型的程序。\n\
  \n### Guidelines（指南）\n\n`Guidelines`（指南）提供了与给定概念、技术或任务相关的最佳实践和建议。遵守指南不是强制性的，提供的初衷是提供有用的建议。尽管如此，指南的“可选性”可能会根据组织的文化而有很大差异。\n\
  \n2016 年 4 月，华盛顿州首席信息官（CIO）发布了一份 25 页的文档，为州机构使用电子签名提供了指南。该文档的设计并非为了强制执行，而是为寻求采用电子签名技术的机构提供建议。文档从目的部分开始，概述了该指南的三个目标：\n\
  \n1.  帮助机构确定它们将以及在多大程度上实施和依赖电子签名。\n2.  为机构提供其用于建立政策或规则的信息。\n3.  为机构共享政策提供指导。\n\n\
  前两个陈述的目标与指南的功能完全吻合。`help agencies determine`帮助机构确定）和`provide agencies with information`为机构提供信息）等短语在指南文件中很常见。第三个目标出现在指南中似乎有点奇怪。`provide\
  \ direction`提供指导）之类的短语更多出现在政策和程序中。浏览文档，与此目标相关的文本仅是 25 页文档中的一段，内容如下：\n\n> 首席信息官办公室在\
  \ OCIO.wa.gov 网站维护了一个列出各机构签名和提交政策的页面。当机构发布政策时，应将链接和机构联系信息发送到 OCIO 邮箱。信息将在 5 个工作日内添加到页面。如果信息发生变化，机构负责通知\
  \ OCIO。\n\n阅读这段话，文本似乎清晰地概述了一个强制程序，并不适合出现在指南文件中。然而，起草此文档的委员会可能认为，将解释性文本包含在相关的指南中对读者更方便，而不是为一个相当平凡的任务编写单独的程序文档。\n\
  \n### Exceptions and Compensating Controls（例外与补偿控制）\n\n在采用新的安全策略、标准和程序时，组织还应该提供这些规则的例外机制。不可避免地，会出现需要偏离要求的意外情况。策略框架应列出获得例外的具体要求以及有权批准例外的个人或委员会。\n\
  \n华盛顿州使用一种例外流程，要求请求者记录以下信息：\n\n*   需要例外的标准/要求\n*   不符合要求的原因\n*   例外的业务和/或技术理由\n\
  *   例外的范围和期限\n*   与例外相关的风险\n*   缓解例外相关风险的补充控制描述\n*   实现合规的计划\n*   任何未缓解风险的识别\n\n\
  许多例外流程要求使用 `compensating controls`（补偿控制）来减轻与例外相关的风险。支付卡行业数据安全标准（PCI DSS）包含了目前使用的最正式的补偿控制流程之一。它规定了满意的补偿控制必须满足的三个标准：\n\
  \n1.  控制必须符合原始要求的意图和严谨性。\n2.  控制必须提供与原始要求类似的防御水平，使得补偿控制能够充分抵消原始 PCI DSS 要求旨在防御的风险。\n\
  3.  控制必须“超出”其他 PCI DSS 要求。\n\n\n\n\n例如，一个机构可能会发现，它需要在特定机器上运行过旧版本的操作系统，因为运行业务所需的软件只能在该特定操作系统版本上运行。大多数安全策略都会禁止使用过旧的操作系统，因为其可能易受到安全漏洞的影响。该机构可以选择将此系统运行在隔离的网络上，并且对与其他系统的访问极少或不访问，作为一种补偿控制。\n\
  \n其核心思想是，当机构无法满足原始控制要求时，通过补偿控制寻找替代手段来实现目标。虽然 `PCI DSS` 为补偿控制提供了一个非常正式的流程，但补偿控制的使用是许多不同机构（即使是不受\
  \ `PCI DSS` 约束的组织）的常用策略。补偿控制平衡了这样一个事实：即在任何情况下实现每项要求的安全控制都是可能的，以及在可行范围内尽可能管理风险的意愿。\n\
  \n在许多情况下，机构采用补偿控制来解决安全要求的临时例外情况。在这些情况下，机构还应该制定补救计划，使机构恢复符合原始控制的字面规定和意图。\n\n## 总结\n\
  \n网络安全工作的核心在于风险和漏洞管理。在本章中，你学习了网络安全分析师用于识别、评估和管理各种风险与漏洞的技术。你学习了风险缓解、风险规避、风险转移和风险接受之间的区别，以及何时使用每种方法合适。你还探索了机构可以用来缓解风险的不同类型的安全控制。在下一章中，我们将开始探索第\
  \ 3 领域：事件响应与管理。\n\n## 考试要点\n\n**解释风险识别和评估如何帮助机构优先考虑网络安全工作。** 网络安全分析师寻求识别机构面临的所有风险，然后进行业务影响分析，根据风险发生的概率和对机构产生的潜在影响程度来评估风险程度。这项工作允许安全专业人员对风险进行优先级排序，并向机构内的其他人沟通风险因素。\n\
  \n**了解供应商是外部风险的来源。** 机构应该作为其风险评估实践的一部分进行自身的系统评估，但还应该进行供应链评估。执行供应商尽职调查可以减少供应商处先前未识别风险对机构产生负面影响的可能性。硬件源真实性技术可以验证硬件在离开供应商场所后未被篡改。\n\
  \n**描述各种风险管理策略。** 风险规避策略通过改变业务实践来消除风险。风险缓解技术寻求降低风险发生的概率或影响。风险转移方法将部分风险转移给第三方。风险接受承认风险的存在，并在存在风险的情况下继续正常业务运营。\n\
  \n**理解软件安全测试工具的使用。** 静态代码分析工具和技术在不执行代码的情况下分析代码的结构和内容。动态分析技术实际上执行代码。模糊测试（Fuzzing）是一种常见的动态测试技术，向应用程序发送人工生成的输入。调试器用于尝试从可执行文件中逆工程出源代码。\n\
  \n**描述策略框架及其组成部分。** 策略是管理层对信息安全计划的高层意图声明。标准描述了策略的详细实现要求。程序提供了执行安全活动的逐步操作说明。对策略、标准和程序的遵守是强制性的。指南提供了可选的建议，作为策略框架中其他要素的补充。用于设定安全方法的框架可以是规定性的，也可以是基于风险的。\n\
  \n**描述定构机构如何经常采用一套涵盖其安全计划不同区域的安全策略。** 安全程序中使用的常用策略包括信息安全策略、可接受使用策略、数据所有权策略、数据保留策略、账户管理策略和密码策略。任何机构采用的特定策略将取决于该机构的文化和业务需求。\n\
  \n**策略文档应包含例外流程。** 例外流程应当概述获得安全策略例外所需的信息以及每个例外的批准权限。该流程还应该描述缓解与已批准的安全策略例外相关风险的补偿控制要求。\n\
  \n## 实验练习\n\n### 实际 8.1：风险管理策略\n\n将以下风险管理策略与其描述进行匹配。\n\n| 风险 | 描述 |\n| :--- | :---\
  \ |\n| 风险规避 (Risk avoidance) | 尽管存在潜在风险仍选择继续正常运营 |\n| 风险转移 (Risk transference) |\
  \ 改变业务活动以消除风险 |\n| 风险缓解 (Risk mitigation) | 将风险的影响转移给另一个组织 |\n| 风险接受 (Risk acceptance)\
  \ | 实施降低风险概率和/或影响的安全控制措施 |\n\n### 活动 8.2：风险识别与评估\n\n对于此练习，请使用你所在的机构。如果你目前没有就业，可以使用你的学校或你熟悉的其他机构。\n\
  \n思考对你机构生存至关重要的业务流程。识别影响该业务流程持续运行的所有风险。然后选择其中一个风险，对该风险进行定量或定性的风险评估。\n\n### 活动 8.3：风险管理\n\
  \n采用你在活动 8.2 中开发的风险评估。识别以下每种风险管理策略至少一种可以用来来处理该风险的方法：\n\n* 风险缓解\n* 风险规避\n* 风险接受\n\
  * 风险转移\n\n你认为这些策略中哪种最适合你的场景？为什么？如果你认为选择多种策略是管理风险的最佳方式，请自由选择选择一种策略。\n\n## 复习题\n\n\
  1. Jen 发现 Windows 服务器上缺少一个补丁，这可能允许攻击者获得系统的远程控制。在咨询经理意见后，她应用了该补丁。从风险管理的角度来看，她做了什么？\n\
  \    1. 消除了威胁\n    2. 减少了威胁\n    3. 消除了漏洞\n    4. 减少了漏洞\n\n2. 你注意到针对机构运行的 Web 应用程序有大量的\
  \ SQL 注入攻击，你安装了 Web 应用防火墙在这些攻击到达服务器之前拦截大部分。你如何改变了风险的严重程度？\n\n    1. 减少了影响\n    2.\
  \ 消除了漏洞\n    3. 减少了概率\n    4. 消除了威胁\n\n**第 3 至 7 题涉及以下场景。**\n\nAziz 负责电子商务网站的管理，该网站每天为公司产生\
  \ 100 万美元的收入。该网站使用包含公司客户敏感信息的数据库。他预计数据库一旦泄露，将导致公司面临 50 万美元的罚款。\n\n\n\n\n\nAziz 正在评估针对数据库的\
  \ SQL 注入攻击风险，攻击者可能将从数据库中窃取所有客户的个人身份信息 (PII)。在咨询了威胁情报后，他认为在任何一年内，攻击成功的概率为 5%。\n\n\
  ### 3. 资产价值 (AV) 是多少？\n1. $5,000\n2. $100,000\n3. $500,000\n4. $600,000\n\n### 4.\
  \ 暴露因子 (EF) 是多少？\n1. 5%\n2. 20%\n3. 50%\n4. 100%\n\n### 5. 单次损失期望 (SLE) 是多少？\n1.\
  \ $5,000\n2. $100,000\n3. $500,000\n4. $600,000\n\n### 6. 年发生率 (ARO) 是多少？\n1. 0.05\n\
  2. 0.20\n3. 2.00\n4. 5.00\n\n### 7. 年损失期望 (ALE) 是多少？\n1. $5,000\n2. $25,000\n3.\
  \ $100,000\n4. $500,000\n\n问题 8–11 参考以下场景。\n\nGrace 最近完成了对其组织数据泄露风险情况的风险评估，并确定与敏感个人信息丢失相关的风险处于较高水平。她正在考虑多种管理这种风险的方法。\n\
  \n### 8. Grace 的第一个想法是添加一个 Web 应用程序防火墙以保护她的组织免受 SQL 注入攻击。这种方法采用了哪种风险管理策略？\n1. 风险接受\n\
  2. 风险规避\n3. 风险缓解\n4. 风险转移\n\n### 9. 业务负责人正在考虑停止收集和存储敏感个人信息的客户活动。这种方法将哪种风险管理策略？\n\
  1. 风险接受\n2. 风险规避\n3. 风险缓解\n4. 风险转移\n\n### 10. 公司决定安装 Web 应用程序防火墙并继续业务。他们仍然担心防火墙未能解决的其他信息风险，并考虑购买保险单来涵盖这些风险。使用的是哪种策略？\n\
  1. 风险接受\n2. 风险规避\n3. 风险缓解\n4. 风险转移\n\n### 11. 最后，风险管理人员发现保险太贵了，决定不购买。他们没有采取任何额外行动。在这种情况下使用的是哪种风险管理策略？\n\
  1. 风险接受\n2. 风险规避\n3. 风险缓解\n4. 风险转移\n\n### 12. 以下哪项是允许组织在受控环境中开放其系统供安全研究人员检查的正式流程？\n\
  1. 边缘发现\n2. 被动发现\n3. 安全控制措施测试\n4. 漏洞赏金计划\n\n### 13. 以下哪项通常用于协助预防 XSS 和 SQL 注入攻击？\n\
  1. 安全会话管理\n2. 输入验证\n3. SLOs\n4. 维护窗口\n\n### 14. 以下哪项是专门为支持渗透测试和恶意软件反向工程而设计的？\n1.\
  \ 免疫调试器\n2. `GDB`\n3. SDLC\n4. 参数化查询\n\n### 15. Jason 收集了威胁情报，其中指出其组织认为是威胁的攻击者喜欢使用\
  \ USB 优盘投放来攻击其目标。这是哪种示例？\n1. 他的组织的攻击面\n2. 可能的攻击向量\n3. 攻击者能力的示例\n4. 概率评估\n\n### 16.\
  \ 哪种类型的评估对于识别内部威胁特别有用？\n1. 行为\n2. 本能\n3. 习惯\n4. IOCs\n\n### 17. STRIDE、PASTA 和 LID\
  \ 都是什么的示例？\n1. 组织方法\n2. 风险评估\n3. 威胁分类\n4. 漏洞工具\n\n### 18. 以下哪项是在代码执行时对其进行的什么类型测试？\n\
  1. 静态分析\n2. 动态分析\n3. 编译\n4. 反汇编\n\n### 19. Adam 正在通过查看应用程序源代码进行何种类型的测试？\n1. 变异测试\n\
  2. 静态分析\n3. 动态分析\n4. 模糊测试\n\n### 20. 测试期间，Tiffany 逐渐增加应用程序的连接直到其失败。她正在做什么？\n1. 回归测试\n\
  2. 单元测试\n3. 压力测试\n4. 析构测试\n\n# 领域 III\n\n## 事件响应与管理\n\n# 第 9 章\n构建事件响应计划\n\n无论组织如何准备其安全防御，总会遇到损害其信息机密性、完整性和可用性的安全事件。这种事件可能是一个快速修复的微小病毒感染，也可能是引起媒体关注的严重泄露。在任何情况下，组织必须做好协调应对的准备。\n\
  \n## 事件响应阶段\n\n组织依靠 `CSIRT` 成员在发生安全事件时保持冷静且一致的响应。许多安全事件周围的危机氛围可能会导致糟糕的决策，除非组织有一个清晰、经过思且精过的流程。\n\
  \n## 安全事件\n\n许多 IT 专业人员随意且交叉使用 `安全事件` 和 `安全事故` 术语，但这是错误的。安全事件响应团队的成员应该根据精确定义仔细使用这些术语。美国国家标准与技术研究院\
  \ (`NIST`) 为全政府提供了以下标准，许多私营组织也采用：\n\n* 事件 (`event`) 是系统或网络中的任何观察。安全事件包括与安全功能相关的任何情况。例如，用户访问存储在服务器上的文件、管理员更改共享文件夹的权限以及攻击者进行端口扫描都是安全事件。\n\
  \n* 负面事件 (`adverse event`) 是任何产生负面后果的事件。负面事件示例包括系统感染病毒、服务器崩溃以及用户访问权限的文件。\n\n* 安全事故\
  \ (`security incident`) 是对计算机安全策略、可接受使用策略或标准安全实践的违反或即将违反。安全事故示例包括信息的意外丢失、攻击者入侵计算机系统、在高管系统上使用键盘记录器窃取密码以及针对网站发起拒绝服务攻击。\n\
  \n计算机安全事件响应团队 (`CSIRTs`) 负责遵循标准化响应程序并结合专业知识和判断，对组织内部发生的计算机安全事故做出响应。\n\n为了简洁起见，在本书其余部分我们将\
  \ `事故` 作为 `计算机安全事故` 的缩写。\n\n由 `NIST` 提议的简单事件响应过程。`nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf\
  \ / 最后访问于 2023 年 2 月 15 日。`\n![图 9.1 事件响应过程 ¶ 来源：NIST SP 800-61：计算机安全事件处理指南 https://nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf](img/c09f001.png)\n\
  \n\n\n\n\n# 图 9.1 (#c09.xhtml#R_c09-fig-0001) 事件响应过程 来源：NIST SP 800-61：计算机安全事件处理指南\
  \ [`nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf`](https://nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf)\
  \ / 最后访问日期：2023 年 2 月 15 日。\n\n注意，这一过程并不是从开始到结束的简单步骤演进。相反，它包含了循环，允许响应人员在响应期间根据需要返回之前的阶段。这些循环反映了对实际网络安全事件响应的现实。只有在最简单的事件中，组织才能按照简单直接的步骤顺序检测事件、分析数据、进行恢复并关闭事件。相反，封制过程通常包含多个回回检测和分析阶段的循环，以确定事件是否已成功解决。这些循环是网络安全事件响应过程的正常组成部分，并且是预之中的。\n\
  \n## 准备阶段\n\n计算机安全响应小组（CSIRT）并非凭空出现。尽管经理们可能希望如此，但他们不能仅仅通过创建一份政策文件并为 CSIRT 分配员工就凭空变出一个\
  \ CSIRT。相反，CSIRT 需要周密的准备，以确保 CSIRT 拥有正确的政策基础、拥有在组织计算环境中有效的操作程序、接受适当的培训，并准备好响应事件。\n\
  \n本章接下来的两个部分“为事件响应奠定基础”和“创建事件响应团队”将更详细地描述准备阶段。\n\n准备阶段还包括构建强大的网络安全防御体系，以减少未来事件发生的概率和影响。这种构建网络安全深度防御的方法通常包含许多可能不属于\
  \ CSIRT 的人员。\n\n在准备阶段，组织还应该组集进行事件调查所需的硬件、软件和信息。NIST 建议每个组织的事件响应工具包至少包含以下内容：\n\n\
  * 数字取证工作站\n* 备份设备\n* 用于数据收集、分析和报告的笔记本电脑\n* 备用服务器和网络设备\n* 空白移除介质\n* 便携式打印机\n* 取证和数据捕获软件\n\
  * 包含可信取证工具副本的可启动 USB 介质\n* 办公用品和证据收集材料\n\n你将在第 10 章“事件检测与分析”和第 11 章“封制、根与恢复”中学习更多关于用于事件响应过程的工具。\n\
  \n## 检测与分析\n\n事件响应的检测和分析阶段是将其流程化最困难的任务之一。尽管网络安全分析师有许多可用工具可以协助识别安全事件的发生，但许多事件的检测是因为经验丰富的分析师具有敏锐眼光。\n\
  \nNIST 800-61 描述了四类主要的安全事件指标：\n\n* 源自入侵检测和防御系统、安全信息和事件管理系统（SIEM）、杀病毒软件、文件完整性检查软件和/或第三方监控服务的`警报（Alerts）`\n\
  * 由操作系统、服务、应用程序生成的`日志（Logs）`\n* 关于新漏洞和利用程序的公开信息`\n* 来自组织内部或外部来源报告可疑活动的`人员`\n\n当这些来源的任何一个指示可能发生安全事件时，响应人员应转入初始验证模式，试图确定其真伪。这种分析往往更多是艺术而非科学。NIST\
  \ 建议采取以下行动以提高有效性：\n\n* `对网络和系统进行画像以衡量预期行为。`\n* `理解用户、系统和网络的正常行为。`\n* `创建日志策略，规定系统、应用程序和网络设备必须记录的信息。`\n\
  * `执行事件关联以结合来自多个源的信息。`\n* `同步服务器、工作站和网络设备的时钟。`\n* `维护一个包含系统关键信息的组织级知识库。`\n* `一旦怀疑事件，立即捕获网络流量。`\n\
  * `过滤信息以减少冗余。`\n* `寻求外部资源的帮助。`\n\n你将在第 10 章中学习更多关于安全事件检测和分析的过程。\n\n## 封制、根与恢复\n\n\
  在事件检测和分析阶段，CSIRT 主要从事旨在发现和分析事件信息的被动活动。在完成此类评估后，团队将转向采取主动措施，旨在限制事件的影响、从网络中根除事件并恢复正常运行。\n\
  \n从高层次来看，过程的封制、根与恢复阶段旨在实现以下目标：\n\n1. 选择适用于事件情况的封制策略。\n2. 执行所选的封制策略以限制事件造成的损害。\n\
  3. 根据需要收集额外证据以支持响应工作和潜在的法律行动。\n4. 识别攻击者和攻击系统。\n5. 根除事件的影响并恢复正常业务运行。\n\n\n\n\n\n\
  你将在第 11 章中学习更多关于事件响应中遏制、消除和恢复阶段使用的技术。\n\n## 事件后活动\n\n安全专业人员从网络中移除攻击者或完成恢复业务正常运行的工作后，安全事件并没有结束。一旦立即危险消失且正常运行恢复，`CSIRT`\
  \ 就会进入事件响应的事件后活动阶段。在此阶段，团队成员将执行取证程序、进行根原因分析、开展教训回顾，并确保他们符合内部和外部的证据留存要求。\n\n### 取证分析\n\
  \n事件后活动的主要目标之一是确定事件期间实际上发生了什么。`取证分析`技术可以帮助你仔细且有条理地筛选大量的数字证据，以重构事件的细节。你将在第 13 章“执行取证分析与事件响应技术”中学习更多关于取证的技术。\n\
  \n### 根原因分析\n\n在事件发生，网络安全分析师应该对事件的根原因有清晰的理解。这种`根原因分析`对于实施安全的恢复至关重要，可以纠正导致原始攻击的任何控制缺陷。毕竟，如果你不理解攻击者最初是如何突破你的安全控制的，就很难修正这些控制以防止攻击再次发生！\n\
  \n### 教训回顾\n\n在`教训回顾`期间，响应人员会对事件及其自身的响应情况进行彻底审查，旨在为下一次事件改进程序和工具。这种回顾在所有人都到场讨论（物理或虚拟）的会议上进行时效果最有效。尽管有些组织尝试以离线方式进行教训回顾，但这种方法无法引发经常产生深刻见解的反复讨论。\n\
  \n教训回顾应由一个独立的协调员主持，该协调员未参与事件响应，并且被所有参与人员视为客观的局外人。这使得协调员能够以有效的方式引导讨论，而不会让参与者觉得协调员在推行隐藏意图。NIST\
  \ 建议教训过程回答以下问题：\n\n*   究竟发生了什么，发生在什么什么时候？\n*   员工和管理层在响应事件时的表现如何？\n*   是否遵循了记录的程序？这些程序是否充分？\n\
  *   哪些信息需要更早获得？\n*   是否采取了可能阻碍恢复的步骤或行动？\n*   下次发生类似事件时，员工和管理层会采取哪些不同的做法？\n*   与其他组织的信息共享可以如何改进？\n\
  *   哪些纠正措施可以防止未来发生类似事件？\n*   未来应该关注哪些先兆或指标以检测类似事件？\n*   需要哪些额外的工具或资源来检测、分析和缓解未来的事件？\n\
  \n一旦小群组回答了这些问题，管理层必须确保组织根据情况采取后续行动。只有当教训回顾发现了所需的更改，并且这些更改随后发生以改进未来的事件响应工作时，它们才是有效的。\n\
  \n### 证据留存\n\n在事件结束时，`CSIRT` 通常已经收集了大量的证据。团队负责人应与员工合作识别内部和外部的证据留存要求。如果事件可能导致民事诉讼或刑事起诉，团队在丢弃任何证据之前应咨询律师。如果没有证据进入法庭的可能性，团队应遵循组织现行的任何留存政策。\n\
  \n在事件后活动阶段结束，`CSIRT` 取消激活，事件处理周期回到准备、检测和分析阶段。\n\n你将在第 11 章中阅读更多关于事件后活动阶段开展的活动。\n\
  \n## 构建事件响应的基础\n\n组织在事件响应准备阶段承担的主要责任之一是为该计划建立稳固的策略和程序基础。这创建了支持计划持续努力所需的文档。\n\n###\
  \ 策略\n\n事件响应策略是组织事件响应计划的基石。该策略的编写应在并在层面上指导工作，并为事件响应提供授权。策略应在组织内部尽可能可能的级别批准，最好由首席执行官批准。由于此原因，策略编写者应尝试以一种相对永恒的方式来编写策略。这意味着策略应该包含为事件响应提供授权的陈述、为`CSIRT`\
  \ 分配责任，并描述单个用户的角色以及说明组织的优先事项。策略**`不是`**描述特定技术、响应程序或证据收集技术的地方。这些细节可能会频繁变化，应涵盖在更易更改的程序文档中。\n\
  \nNIST 建议事件响应策略包含这些关键要素：\n\n*   管理层承诺的声明\n*   策略的目的和目标\n*   策略的范围（适用于谁以及在什么情况下适用）\n\
  *   网络安全事件及相关术语的定义\n*   组织结构以及角色、职责和权限级别的定义\n*   事件的优先级排序或严重程度评分方案\n*   `CSIRT`\
  \ 的绩效衡量\n*   报告和联系表单\n\n在策略中包含这些要素为 `CSIRT` 的日常和危机活动提供了坚实的基础。\n\n### 程序和剧本\n\n`程序`提供了\
  \ `CSIRT` 成员在响应事件时所需的详细战术信息。它们代表了团队成员和主领域专家在平静时期收集的集体智慧，并准备在实际事件发生时应用。`CSIRT` 团队通常会开发`剧本`，描述他们在遇到特定类型网络安全事件时将遵循的具体程序。例如，金融机构的\
  \ `CSIRT` 开发涵盖以下内容的剧本：\n\n*   个人财务信息泄露\n*   Web 服务器破坏\n*   针对客户的钓鱼攻击\n*   笔记本丢失\n\
  *   其他剧本未涵盖通用安全事件\n\n这显然不是一份清单，每个组织都会开发描述其对高严重性和频繁发生的事件类别响应的剧本。剧本背后的想法是，团队应该拿起它并找到一个可以遵循的响应安全事件的操作计划。剧本在事件响应的早期几个小时内尤为重要，以确保团队对潜在事件的首批报告有计划的、有节制的响应。\n\
  \n### 文档化事件响应计划\n\n\n\n\n\n在制定事件响应计划文档时，组织应特别关注创建在事件响应过程中可能有用工具。这些工具应为响应团队提供清晰的指导，以便在危机时刻被快速阅读和理解。例如，图\
  \ 9.2 所示的事件响应清单以清单的形式提供了事件响应过程的高级概述。计算机安全应急响应小组（CSIRT）领导可以使用此清单来确保团队在危热的危机环境中不会遗掉任何重要步骤。\n\
  \n![图 9.2 事件响应清单 ¶ 来源: NIST SP 800-61: Computer Security Incident Handling Guide\
  \ https://nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf / 最后访问于\
  \ 2023 年 2 月 15 日。](img/c09f002.png)\n\n图 9.2 事件响应清单 ¶ 来源: NIST SP 800-61: Computer\
  \ Security Incident Handling Guide [`nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf`](https://nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf)\
  \ / 最后访问于 2023 年 2 月 15 日。\n\n## 创建事件响应小组\n\nCSIRT 应该代表许多不同的角色。根据组织及其技术需求，其中某些角色可能是始终处于激活状态的核心团队成员，而另一些角色可能根据每次事件的需要才被召回。例如，数据库管理员在调查\
  \ SQL 注入攻击的后果时可能至关重要，但在响应笔记本电脑被盗事件时可能提供不了太大帮助。\n\n核心事件响应团队通常由在事件响应方面具有特定专业知识的网络安全人员组成。在较大的组织中，这些可能是专门负责事件响应的全职员工；而在较小的组织中，可能会聘请担任其他职位的“本职”的网络安全专家在事件发生后担任\
  \ CSIRT 角色。\n\n除了核心团队成员外，CSIRT 还可以包括以下人员的代表：\n\n*   技术领域专家，在响应过程中可能需要他们的知识。这包括系统工程师、网络管理员、数据库管理员、桌面专家和应用程序专家。\n\
  *   IT 支持人员，可能需要他们执行由 CSIRT 指导的操作。\n*   法律顾问，负责确保团队的行为符合法律、政策和监管要求，并能就合规问题和与监管机构的沟通向团队领导提供建议。\n\
  *   人力资源人员，负责调查潜在的员工违规行为。\n*   公关和营销人员，可以协调与媒体和公众的沟通。\n\nCSIRT 应由一名指定的领导运行，该领导具有明确的权限来指导事件响应工作，并作为与管理层的联系人。该领导应该是一个熟练的事件响应人员，要么被分配全职领导\
  \ CSIRT，要么在网络安全领导岗位工作。\n\n### 事件响应提供者\n\n除了在 CSIRT 中包含内部团队成员外，组织还可能决定将部分或全部行动外包给事件响应提供者。保留事件响应提供者使组织能够获得公司内部可能不存在的专业知识。这可能耗费巨资，因此组织应该决定哪些类型的事件可以在内部处理，哪些事件则有必要使用外部提供者。此外，组织应该了解提供者的保证响应时间，并确保已制定计划，在提供者接管之前对事件的早期阶段做出响应。\n\
  \n### CSIRT 控制范围\n\n组织的事件响应策略应明确概述 CSIRT 的范围。这包括对以下问题的回答：\n\n*   什么触发了 CSIRT 的激活？谁有权激活\
  \ CSIRT？\n*   CSIRT 是否涵盖整个组织，还是仅负责某些业务部门、信息类别或其他责任部门？\n*   CSIRT 是否有权与执法部门、监管机构或其他外部实体通信？如果是，是哪些机构？\n\
  *   CSIRT 是否具有内部通信和/或升级责任？如果是，是什么触发了这些要求？\n\n## 事件分类\n\n每当事件发生时，CSIRT 都应该根据标准的事件严重性评分系统，从威胁类型和事件严重性两个对事件进行分类。这种分类有助于其他人员理解事件的性质和严重性，并允许将当前事件与过去的事件进行比较。\n\
  \n## 威胁分类\n\n在许多情况下，事件来自已知的威胁源，这有助于快速识别威胁。NIST 提供了以下有助于分类威胁的攻击向量：\n\n*   `外部/可移动介质`：从可移动介质或外围设备执行的攻击——例如，恶意代码从受感染的\
  \ USB 闪盘传播到系统。\n*   `耗尽`：采用暴力破解方法来破坏、降级或破坏系统、网络或服务的攻击——例如，旨在损害或拒绝访问服务或应用程序的 DDoS\
  \ 攻击，或针对身份验证机制的暴力破解攻击。\n*   `Web`：从网站或基于 Web 的应用程序执行的攻击——例如，用于窃取凭据或重定向到利用浏览器漏洞并安装恶意软件的跨站脚本注入攻击（XSS）。\n\
  *   `邮件`：通过电子邮件消息或附件执行的攻击——例如，伪装成附件文档的利用代码，或邮件正文中指向恶意网站的链接。\n*   `伪装`：涉及将某些良性内容替换为恶意内容的攻击——例如，欺骗攻击、路径攻击（中间人攻击）、非法无线访问点和\
  \ SQL 注入攻击都涉及伪装。\n*   `使用不当`：任何由于获得授权的用户违反组织的可接受使用政策而导致的任何事件，不包括上述类别；例如，用户安装文件共享软件导致敏感数据丢失，或用户在系统上进行非法活动。\n\
  *   `设备丢失或被盗`：组织使用的计算设备或介质的丢失或被盗，例如笔记本电脑、智能手机或身份令牌。\n*   `未知`：来源未知的攻击。\n*   `其他`：来源已知但不符合上述任何类别的攻击。\n\
  \n除了理解这些攻击向量外，网络安全分析师还熟悉高级持续性威胁 (APT) 的概念。APT 攻击者是高技能、有天赋的攻击者，专注于特定目标。这些攻击者通常由国家、组织犯罪和其他拥有巨大资源的来源资助。APT\
  \ 攻击者以利用`零日漏洞`闻名——即安全社区未知的漏洞，因此未包含在漏洞扫描器和其他工具的安全测试中，且没有可用的补丁进行修复。\n\n### 严重性分类\n\
  \n\n\n\n\nCSIRT 成员根据其职责范围和组织规模，每年可能调查几十次、数百甚至数千次安全事件。因此，使用标准化的流程向管理层和其他利益相关者传达每个事件的严重程度至关重要。事件严重性信息有助于确定事件响应工作的优先级和范围。\n\
  \n用于确定事件严重程度的两个关键标准是影响范围和涉及事件的数据类型。\n\n## 影响范围\n\n事件影响的范围取决于其对组织造成的受损程度，以及从事件中恢复所需的努力。\n\
  \n### 功能影响\n事件的功能性影响是指其对组织造成的受损程度。这可能取决于受事件影响的数据、系统或流程的关键性，也取决于组织在事件发生期间及事件发生后继续为用户提供服务的能力。NIST\
  \ 建议使用四个类别来描述事件的功能性影响，如表 9.1 所示。\n\n`表 9.1` NIST 功能性影响分类\n\n 来源：NIST SP 800-61：计算机安全事件处理指南\
  \ [`nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf`](https://nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf)\
  \ / 最后访问于 2023 年 2 月 15 日。\n\n| 类别 || 定义 |\n| --- | --- |\n| 无 | 对组织向所有用户提供所有服务的能力没有影响。\
  \ |\n| --- |\n| 低 | 影响极小；组织仍能向所有用户提供所有关键服务，但效率有所降低。 |\n| 中 | 组织失去了为部分系统用户提供关键服务的能力。\
  \ |\n| 高 | 组织无法为任何用户提供某些关键服务。 |\n\nNIST 提供的功能影响评估标准中存在一个主要缺陷：它没有包含对安全事件给组织经济影响的评估。这可能是因为\
  \ NIST 指南主要面向政府受众。组织可能希望修改表 9.1 中的类别以纳入经济影响，或使用独立的比例来衡量财务影响，如表 9.2 所示。\n\n表 9.2\
  \ 中包含的财务阈值仅供示例，应根据组织规模进行调整。例如，一个导致 500,000 美元损失的安全事件对小型企业来说可能是致命性的，而财富 500 强公司可以轻松吸收这一损失。\n\
  \n`表 9.2` 经济影响分类\n\n| 类别 || 定义 |\n| --- | --- |\n| 无 | 组织预计不会遭受任何财务影响，或财务影响微乎其微。\
  \ |\n| --- | ---\n| 低 | 组织预计遭受 10,000 美元或以下的财务影响。 |\n| 中 | 组织预计遭受超过 10,000 美元但少于\
  \ 500,000 美元的财务影响。 |\n| 高 | 组织预计遭受 500,000 美元或以上的财务影响。 |\n\n### 可恢复努力\n除了衡量安全事件的功能和经济影响外，组织还应该衡量服务不可用的时间。这可以表示为服务经历的停机时间或从事件中恢复所需的时间。表\
  \ 9.3 显示了 NIST 对评估安全事件可恢复影响所提出的建议。\n\n`表 9.3` NIST 可恢复努力分类\n\n 来源：NIST SP 800-61：计算机安全事件处理指南\
  \ [`nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf`](https://nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf)\
  \ / 最后访问于 2023 年 2 月 15 日。\n\n| 类别 || 定义 |\n| --- | --- |\n| 常规 | 利用现有资源，恢复时间是可预测的。\
  \ |\n| --- | --- |\n| 补充 | 利用额外资源，恢复时间是可预测的。 |\n| 扩展 | 恢复时间不可预测；需要额外的资源和外部帮助。 |\n\
  | 不可恢复 | 无法从事件中恢复（例如，敏感数据被泄露并公开）；启动调查。 |\n\n### 数据类型\n安全事件中涉及的数据性质也会影响事件的严重性。当安全事件影响敏感信息的机密性或完整性时，网络安全分析师应分配数据影响评分。NIST\
  \ 建议的数据影响评分标准出现在表 9.4 中。\n\n`表 9.4` NIST 信息影响分类\n\n 来源：NIST SP 800-61：计算机安全事件处理指南\
  \ [`nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf`](https://nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf)\
  \ / 最后访问于 2023 年 2 月 15 日。\n\n| 类别 || 定义 |\n| --- | --- |\n| 无 | 信息未被泄露、更改、删除或受到损害。\
  \ |\n| --- | --- |\n| 隐私泄露 | 纳税人、员工、受益人等的敏感个人身份信息（PII）被访问或泄露。 |\n| 专有泄露 | 未分类的专有信息（如受保护的基础设施信息\
  \ PCII）被访问或泄露。 |\n| 完整性丢失 | 敏感信息或专有信息被更改或删除。 |\n\n尽管表 9.4 中所示的影响标准是 NIST 的建议，但它确实存在一些明显的缺陷。最重要的是，表中的定义倾向于政府机构可能拥的信息类型，可能无法很好地映射到私有组织的信息。某些分析师可能反对将“完整性丢失”作为一个独立于三个取决于分类的泄露类别的类别引入。\n\
  \n表 9.5 提供了一种替代分类方案，私有组织可以将其作为自己的信息影响分类方案的基础。\n\n`表 9.5` 私有组织信息影响分类\n\n| 类别 || 定义\
  \ |\n| --- | --- |\n| 无 | 信息未被泄露、更改、删除或受到损害。 |\n| --- | --- |\n| 受监管信息泄露 | 受外部合规义务监管的信息被访问或泄露。这可能包括触发数据泄露通知法律的个人身份信息（PII）、HIPAA\
  \ 下的保护健康信息（PHI）以及受 PCI DSS 保护的支付卡信息。对于受欧盟《通用数据保护条例》（GDPR）约束的组织，它还应包括 GDPR 定义的敏感个人信息（SPI）。SPI\
  \ 包含特殊类别的信息，例如遗传数据、工会成员身份和性信息。 |\n| 知识产权泄露 | 敏感知识产权被访问或泄露。 |\n\n\n\n\n\n| 机密信息泄露\
  \ | 访问或外泄了公司机密信息。这包括敏感或被归类高价值资产的信息，但不属于受监管信息或知识产权的类别。例如，公司财务信息或有关合并收购的信息。 |\n| 完整性破坏\
  \ | 敏感或专有信息被更改或删除。 |\n\n与财务影响范围一样，组织将需要对表 9.5 中的信息影响分类进行自定义，以满足其业务流程的需要。\n\n## 攻击框架\n\
  \n已有许多尝试通过框架来描述攻击方法，以帮助防御人员模拟攻击和相应的防御。CySA+ 考试关注三个特定的框架，但您的组织可能会使用不同的模型，或者从零开始或通过结合一个或多个框架与其自身的需求和经验来创建自己的模型。框架有助于思考攻击者可能做什么，以便您能够针对攻击建立适当的防御。\n\
  \n### MITRE 的 ATT&CK 框架\n\nMITRE 提供了 `ATT&CK`（即对抗者战术、技术和常见知识），这是一份关于攻击者战术和技术的知识库。ATT&CK\
  \ 矩阵包含了完整威胁生命周期的详细描述、定义和示例，从初始访问到执行、持久化、权限提升和外泄。在每个层级，它都列出了技术和组件，使得威胁评估建模能够利用通用描述和知识。\n\
  \nATT&CK 矩阵包括攻击前矩阵，以及关注于 Windows、macOS、Linux、云计算、网络和容器使用的企业级矩阵。它还产生了关注于移动设备（iOS\
  \ 和 Android）和工业控制系统（ICS）的矩阵。每个矩阵都包含了缓解措施、威胁行为者小组、软件以及许多其他有用细节。所有这些内容使 ATT&CK 成为本书作者所知的最全面的攻击者技术、战术及相关信息的免费可用数据库。\n\
  \n图 9.3 显示了主动扫描技术的 ATT&CK 技术定义示例。它提供了 ID 编号以及分类细节，如战术、适用的平台、潜在的缓解控制和检测机制。\n\n除了\
  \ ATT&CK 网站和材料外，各种第三方项目利用 ATT&CK 来构建剧本（playbooks）、工具甚至商业软件。您可以在 `http://attack.mitre.org`\
  \ 找到 ATT&CK 网站。\n\n### 入侵分析钻石模型\n\n`入侵分析钻石模型（Diamond Model of Intrusion Analysis）描述了攻击者针对受害者基础设施部署能力的序列。在这个模型中，活动被称为“事件”，分析人员将顶点标记为检测或发现的事件。该模型旨在通过跟踪事件之间的边来突出元素之间的关系，从而帮助分析人员发现更多信息。\n\
  \n钻石模型使用了一些特定术语：\n\n* 事件的`核心特征`（Core Features），即攻击者、能力、基础设施和受害者（钻石的顶点）。\n* `元特征`（Meta-Features），包括开始和结束时间戳、阶段、结果、方向、方法论和资源。这些用于将事件按名为“活动线程”（activity\
  \ thread）的序列进行排序，并根据其特征对事件进行分组。\n* `置信值`（Confidence Value），模型未对其定义，但要求分析人员根据自己的工作来确定。\n\
  \n图 9.4 显示了针对受害系统进行的分析示例。注意，每个元素都有助于识别额外信息或审查区域。\n\n钻石模型侧重于理解攻击者及其动机，然后利用这些元素之间的关系，让安全分析人员既能理解威胁，又能考虑可能需要获取或可能已有的其他数据信息。\n\
  \n您可以在 `https://apps.dtic.mil/sti/pdfs/ADA586960.pdf` 阅读钻石模型的论文全文。\n\n![图 9.3 主动扫描的\
  \ ATT&CK 定义](img/c09f003.png)\n\n图 9.3 主动扫描的 ATT&CK 定义\n\n![图 9.4 受害系统的钻石模型分析](img/c09f004.png)\n\
  \n图 9.4 受害系统的钻石模型分析\n\n### 洛克希德·马丁的网络杀伤链\n\n洛克希德·马丁的`网络杀伤链（Cyber Kill Chain）`是一个七阶段的过程，如图\
  \ 9.5 所示。\n\n这七阶段如下：\n\n1. **侦察**（Reconnaissance），用于识别目标。在此阶段，攻击者正在策划他们的攻击，并将收集有关目标的情报，包括开源情报和通过扫描直接获取目标数据。防御人员必须收集有关侦察活动的数据，并根据这些信息优先考虑防御。\n\
  2. **武器化**（Weaponization），涉及构建或获取武器化工具，将恶意软件和漏洞利用结合成一个可以交付给目标的载荷。这可能需要创建诱饵文件、选择正确的命令控制工具以及其他细节。该模型强调，防御人员在这一阶段需要进行全面的恶意软件分析，以不仅了解投放了什么载荷，还了解武器化漏洞利用是如何制作的。防御人员还应该对武器化工具建立检测，查看恶意软件创建与使用的时间线，并收集文件和元数据，以帮助他们查看这些工具是广泛共享的还是秘密持有的（因此针对性非常窄）。\n\
  3. **交付**（Delivery），当攻击者直接向目标部署工具，或通过依赖目标员工与其交互的发布来投放时（例如电子邮件载荷、USB 闪盘或他们访问的网站），即发生此阶段。防御人员在此阶段必须观察攻击是如何交付的以及目标是什么，然后推断攻击者的意图。日志的留存在此阶段也很重要，因为防御人员需要这些日志来跟踪发生了什么。\n\
  \n![图 9.5 网络杀伤链](img/c09f005.png)\n\n图 9.5 网络杀伤链\n\n4. **利用**（Exploitation），利用软件、硬件或人类漏洞获取访问权限。这可能涉及零日漏洞，并可能使用攻击者触发的或受害者触发的利用。针对该阶段的防御关注于用户意识、安全编码、漏洞扫描、渗透测试、终端加固和类似活动，以确保组织具有强大的安全态和非常小的攻击面。\n\
  5. **安装**（Installation），侧重于攻击者的持久性后门访问。防御人员必须监控持久远程 shell 或远程访问方法的典型迹象。\n6. **命令与控制（Command-and-Control,\
  \ C2）**，允许双向通信和对远程系统的持续控制。防御人员将寻求通过加固网络、部署检测能力和进行持续研究来检测 C2 基础设施，以确保他们了解新的 C2 模型和技术。\n\
  \n\n\n\n\n# 7. 目标上的行动\n\n最终阶段发生在目标达成时。攻击者将收集凭据、提升权限、进行转向并在环境中横向移动，以及收集并外泄信息。他们还可能对系统或数据造成破坏。防御者必须建立自己的事件响应剧本（playbook），检测攻击者的行为并捕获相关数据，响应告警，并评估攻击者造成的损害。\n\
  \n完整的洛希德·马丁网络杀伤链（Lockheed Martin Cyber Kill Chain）可以在 `www.lockheedmartin.com/content/dam/lockheed-martin/rms/documents/cyber/Gaining_the_Advantage_Cyber_Kill_Chain.pdf`\
  \ 查看详细信息。\n\n## 统一杀链 (Unified Kill Chain)\n\n尽管 CySA+ 考试没有特别提到，但你可能会发现统一杀链有用。统一杀链将洛希德·马丁的网络杀伤链和\
  \ MITRE ATT&CK 框架（以及许多其他！）整合到一个单一杀链模型中。它使用 18 个阶段来描述发生在防御网络内部和外部攻击，解决了针对这两个框架的意见。你可以在\
  \ `www.unifiedkillchain.com/assets/The-Unified-Kill-Chain.pdf` 学习更多关于统一杀链的信息。\n\n\
  ## 开发测试策略\n\n当然，安全分析师不仅负责调查发生的攻击——他们还花大量时间测试系统，以确保受到未来攻击的保护。幸运的是，有许多测试标准可以帮助你开发全面的测试策略。\n\
  \nCySA+ 考试必须掌握的两个测试资源是：\n\n* 由安全与开放方法学会（Institute for Security and Open Methodologies）发布的\
  \ `开源安全测试方法手册 (OSS TMM)` 为测试物理位置、人员交互和通信的安全提供了指导。你可以在 `www.isecom.org/OSSTMM.3.pdf`\
  \ 找到它。\n\n* `开放 Web 应用安全项目 (OWASP) Web 安全测试指南 (Web Security Testing Guide)`提供了专门针对\
  \ Web 应用安全测试的资源。你可以在 `https://owasp.org/www-project-web-security-testing-guide`\
  \ 找到它。\n\n## 总结\n\n事件响应程序使组织能够冷静、可重复的方式应对安全问题。当发生或怀疑违反或即将违反组织安全策略的情况时，就会发生安全事件。当安全事件发生时，组织应激活其计算机安全事件响应小组\
  \ (`CSIRT`)。\n\n`CSIRT` 引导组织通过事件响应的四个阶段：准备；检测与分析；遏制、根除与恢复；事后活动。在准备阶段，组织确保 `CSIRT`\
  \ 拥有适当的策略基础、在组织计算环境中有效的操作程序、接受适当的培训，并准备好响应事件。\n\n在检测与分析阶段，组织监视安全事件的迹象。这包括监控告警、日志、公开信息，以及来自内部和外部人员关于安全异常的报告。当组织怀疑发生安全事件时，它将进入遏制、根除和恢复阶段，该阶段旨在尽可能地限制损害并尽快恢复正常运行。\n\
  \n正常活动的的恢复并不意味着事件响应努力的结束。在事件结束时，事后活动阶段为组织提供了通过进行教训回顾（lessons learned review）来对事件进行反思的机会。在此阶段，组织还应确保根据策略保留证据以备后用。\n\
  \n网络安全分析师使用各种模型来描述他们面临的威胁以及威胁源者的活动。最重要的三个模型是：洛希德·马丁网络杀伤链、入侵分析钻石模型（Diamond Model\
  \ of Intrusion Analysis）和 MITRE ATT&CK 模型。\n\n## 考试要点\n\n**区分安全事件和安全机事件。** 事件（event）是系统或网络中任何可观测的现象。安全事件（security\
  \ event）包括任何与安全相关的可观测现象。安全事件（incident）是违反或即将违反计算机安全策略、可接受使用策略或标准安全实践的行为。每个事件由一个或多个事件组成，但并非每个事件都是安全机事件。\n\
  \n**说出网络安全事件响应过程的四个阶段。** 事件响应的四个阶段是：准备；检测与分析；遏制、根除与恢复；事后活动。该过程不是从开始到结束的简单步骤线性。相反，它包含了循环，允许响应人员在响应期间根据需要返回之前的阶段。\n\
  \n**识别安全事件指标。** 告警源于入侵检测和防御系统、安全信息和事件管理系统（SIEM）、反病毒软件、文件完整性检查软件和第三方监控服务。日志由操作系统、服务、应用程序、网络设备和网络流生成。公开信息关于在“野外”或受控实验室环境中检测的新漏洞和利用程序。组织内部人员或外部来源报告可能表明安全事件正在进行的可疑活动。\n\
  \n**解释策略、程序和剧本如何引导事件响应工作。** 事件响应策略是组织事件响应程序的基石。该策略应编写为指导高层次工作，并为事件响应提供授权。程序提供了 `CSIRT`\
  \ 成员在响应事件时所需的详细战术信息。`CSIRT` 团队通常会开发剧本（playbooks），描述在发生特定类型网络安全事件时将遵循的特定程序。\n\n**了解事件响应小组应代表多样化的利益相关者。**\
  \ 核心事件响应小组通常由具有事件响应特定专业知识的网络安全专业人员组成。除了核心团队成员外，`CSIRT` 可能包括技术领域专家、IT 支持人员、法律顾问、人力资源人员以及公关和营销团队的代表。团队还需要与内部和外部利益相关者协调，包括高层领导、执法部门和监管机构。\n\
  \n**解释如何根据攻击向量对事件进行分类。** 安全事件的常见攻击向量包括外部/可移动介质、损耗、网络、电子邮件、仿冒、不当使用、设备丢失或被窃以及/未知来源。\n\
  \n**解释响应团队如何对事件的严重性进行分类。** 事件的功能影响（functional impact）是其对组织的损害程度。经济影响（economic impact）是组织遭受的财务损失金额。除了衡量安全事件的功能和经济影响外，组织还应该衡量服务不可用的时间和恢复工作。最后，涉及事件的数据性质也会作为信息影响（information\
  \ impact）对严重性做出贡献。\n\n\n\n\n\n# 能够使用框架描述威胁和攻击，并使用分析技术对其建模。\n\n如`Diamond Model`（钻石模型）、`MITRE\
  \ ATT&CK`框架以及洛克希德·马丁的`Cyber Kill Chain`（网络攻击链）提供了评估和描述威胁的方法。使用威胁模型可以帮助通过识别漏洞更全面地理解威胁。`ATT&CK`等工具还为威胁提供了一个广泛的标准分类法，允许你将在兼容该框架的工具中使用这些数据。包括`开源测试方法论手册\
  \ (OSS TMM)`和`OWASP 测试指南`在内的工具可以帮助你开发稳健的策略，以针对这些框架中识别出的攻击进行系统测试。\n\n## 实验活动\n\n\
  ### 活动 9.1：事件严重分类\n\n你是一家大型网络安全事件响应小组的负责人，该公司目前正遭受网站的拒绝服务（DoS）攻击。此攻击阻止了该机构向客户销售产品，并且在事件解决之前，可能会导致每天产生至少\
  \ 200 万美元的收入损失。\n\n攻击来自许多不同的源，你已经耗尽了所有可用的响应技术。你目前正在寻找一个可以协助响应的外部合作伙伴。\n\n请使用本章描述的标准对此事件进行分类。为功能影响、经济影响、恢复努力和信息影响分配分类评分。请为你的每项分配提供理由。\n\
  \n### 活动 9.2：事件响应阶段\n\n识别与以下各项活动相对应的事件响应过程的正确阶段：\n\n| 活动 | 阶段 |\n| --- | --- |\n\
  | 召开教训总结会议 | | |\n| 接收来自员工的关于恶意软件感染的报告 | | |\n| 升级组织的防火墙以阻止新类型的攻击 | | |\n| 在消除事件后恢复正常运行\
  \ | | | |\n| 识别攻击者和受攻击的系统 | | |\n| 使用 `SIEM` 解释日志条目以识别潜在事件 | | |\n| 组装进行事件调查所需的硬件和软件\
  \ | | |\n\n### 活动 9.3：制定事件通信计划\n\n你是一家大型电子商务网站的 `CSIRT` 负责人，你目前正在响应一起安全事件，你认为攻击者使用了`SQL\
  \ 注入`攻击从你的后端数据库中窃取了交易记录。\n\n目前，只有核心 `CSIRT` 成员正在响应。请制定一份通信计划，描述为你认为需要通知的内部和外部利益相关者通信的性质、时机和受众。\n\
  \n### 活动 9.4：探索 ATT&CK 框架\n\n在本次练习中，你将使用`ATT&CK`框架来分析一个威胁。你可能想选择一个最近在新闻中看到的泄露案例，或者影响过你工作过的组织的案例。如果脑中没有合适的，2019\
  \ 年的第一资本（Capital One）数据泄露是一个非常有用的例子，你可以通过快速搜索在多处找到该漏洞利用的细节。\n\n### 第一部分：构建威胁概况\n\
  \n1. 列出你对该入侵或漏洞利用的已知信息，包括关于威胁行为者的细节、发生了什么、使用了哪些工具以及你能找到的尽可能多的细节。\n2. 结合相应的 `ATT&CK`\
  \ 矩阵标题对你的列表进行检查。你是否有与标题匹配的条目？\n3. 如果你仍然缺乏数据，你应该继续搜索或寻找另一个案例进行分析！\n\n### 第二部分：分析\n\
  \n1. 现在你已经有了基本概况，请遵循矩阵中的详细列表，将威胁与其对应的 `ATT&CK` 技术、威胁行为者和其他细节匹配起来。\n2. 将每个数据点匹配到相应的\
  \ `ATT&CK` 条目。\n3. 审查每个条目的细节，以便你熟悉它们。\n4. 识别你知识中的空白。如果你在研究这项威胁，你会寻找哪些信息？你认为哪些信息是可以合理获取的，而哪些信息可能无法收集？\n\
  5. 根据你的发现，考虑你提交给领导层的报告将包含哪些内容。\n\n## 复习题\n\n1. 以下哪项是安全事件的示例？\n   1. 攻击者访问文件\n  \
