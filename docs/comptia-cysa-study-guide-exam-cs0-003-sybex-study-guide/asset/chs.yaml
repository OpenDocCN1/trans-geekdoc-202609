  \   - Medium（中）\n   - High（高）\n   - Critical（严重）\n\n8. Tara 最近分析了漏洞扫描报告的结果，发现扫描器报告的漏洞并不存在，因为系统实际上已经打了补丁。发生了什么类型的错误？\n\
