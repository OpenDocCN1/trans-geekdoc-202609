  \n   ______________________________________________________________\n   ______________________________________________________________\n\
  \n   如果克隆成功，这些值应该是相同的。\n\n### 活动 13.2：进行 NIST Rhino 猎寻\n\n美国标准与技术研究院提供了一系列练习取证镜像，可以免费下载和使用，以提高你的取证技能。你可以在\
  \ `www.cfreds.nist.gov` 找到全集。在本次练习中，我们将使用 Rhino 猎寻场景以及从 `http://digital-forensics.sans.org/community/downloads`\
  \ 获取的 SANS SIFT 镜像。\n\n1. 运行 SIFT。如果你更喜欢使用 VMware，可以直接运行；否则，使用导入工具将其导入到 VirtualBox。（如果你将虚拟机导入到\
  \ VirtualBox，你需要运行 `sudo apt-get install virtualbox-guest-dkms` 然后重启以获得有用的分辨率。）\n\
