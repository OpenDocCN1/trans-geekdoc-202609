  \n\n\n\n# 分析\n\n18. C. 将日志发送到远程日志服务器或堡垒机（bastion host）是一种适当的补偿性措施。这确保了日志副本存在于安全位置，以便在发生类似的入侵事件时对其进行审查。全盘加密在文件被使用时仍处于解密状态，无法保护日志文件免受攻击；而日志轮转（log\
  \ rotation）意味着当日志达到特定大小或时间范围时会进行更换。对传输中的数据（包括日志）进行 TLS 加密可以保持其私密性并防止被修改，但无法防止日志被删除。\n\
  \n19. B. Ben 知道加固过程通常侧重于禁用不必要的服务，而不是启用额外的服务。更新、补丁、启用日志记录以及配置磁盘加密等安全功能都是常见的加固实践。\n\
  \n20. B. 虽然看起来 Gabby 似乎实施了三个不同的因素，但 PIN 码和密码短语（passphrase）都是基于知识的因素，不能被视为不同的因素。她的设计实施了两个不同的因素。如果她想增加第三个因素，可以将密码或\
  \ PIN 码替换为指纹扫描或其他生物识别因素。\n\n## 第 3 章：恶意活动\n\n1. B. `df` 命令将向你显示系统的当前磁盘率。`top` 命令和\
  \ `ps` 命令都会显示有关进程、CPU 和内存使用的信息，而 `lsof` 是一个用于列出打开文件的多功能工具。\n\n2. C. Perfmon（或性能监器\
  \ Performance Monitor）提供了收集 Windows 中许多项目详细使用统计数据的能力。Resmon（或资源监器 Resource Monitor）监控\
  \ CPU、内存和磁盘使用情况，但不提供有关 USB 主机控制器和其他详细计数的信息。Statmon 和 `winmon` 不是 Windows 内置工具。\n\
  \n3. D. 流数据（Flow data）提供了有关源和目的 IP 地址、协议和发送数据总量的信息，能够提供所需的细节。Syslog、`WMI` 和 `resmon`\
  \ 数据都是系统日志信息，无法提供此类信息。\n\n4. A. 网络访问控制（NAC）可以被设定为需要身份验证。端口安全仅限于识别 MAC 地址，因此较不适用于防止越规设备。PRTG\
  \ 是一种监控工具，而 `NTP` 是网络时间协议。\n\n5. A. 设置监控阈值是为了确定何时何时采取告警或报告操作。阈值通常被设置为特定值或容量的百分比。\n\
  \n6. B. Chris 最可能正在查看一个 JSON 文件。HTML 和 XML 通常使用角括号（`<` 和 `>`）而不是大括号。纯文本既不使用也不需要两者。\n\
  \n7. A. 信标活动（Beaconing activity，有时被称为心跳流量）发生在流量发送到机器人网络命令与控制系统时。其他术语都是虚构的。\n\n8.\
  \ C. Cameron 应该对比已知良好的原始文件和新文件的哈希值（hashes），查看它们是否匹配。文件未被描述为加密文件，因此解密它们没有帮助。Strings\
  \ 命令可以显示二进制文件中的文本，但无法比较文件。文件大小和创建日期不能保证文件是相同的。\n\n9. D. 硬件厂商 ID 代码是 MAC 地址的一部分，可以检查那些未更改过\
  \ MAC 地址的设备。MAC 地址是可以更改的，因此不建议仅依赖 MAC 地址，但它对于识别越规设备可能可能是很有用的。\n\n10. B. 定位越规 AP（非法接入点）最好的方法是进行物理调查，并通过检查其信号强度通过三角定位确定设备可能的位置。如果该\
  \ AP 接入了组织的网络，`nmap` 可能会找到它，但连接到它不太可能提供其位置（而且不安全！）。NAC 可以帮助防止越规设备连接到组织网络，但无法帮助定位。\n\
