  \ SIFT 犀牛照片。\n6. 挂载文件：\n   ```\n   sudo mount -o loop, ro RHINOUSB.dd /mnt/usb\n\
  \   ```\n7. 检查挂载的内容：\n   ```\n   ls /mnt/usb\n   ```\n   注意，你只会看到两个 gumbo 菜谱。该驱动器被做了某种操作覆盖了原始内容，它们需要被恢复！\n\
  \   接下来我们将使用 `foremost` 恢复被删除的文件，这是一个可以根据文件头和其他信息自动恢复文件的实用。\n8. 为输出创建一个目录：\n   ```\n\
  \   mkdir output\n   ```\n9. 针对 `RHINOUSB` 镜像运行 `foremost`：\n   ```\n   foremost\
  \ -o output/ RHINOUSB.dd\n   ```\n10. 检查输出。\n\n要打开你恢复的文件，点击屏幕左上角的文件柜图标，导航到 Home\
