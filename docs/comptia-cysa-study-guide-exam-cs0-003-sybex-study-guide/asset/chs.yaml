  \ `PASTA` 是一种以攻击者为中心的威胁建模工具。\n\n18. B. 动态分析技术实际上在测试过程中执行代码。静态代码分析工具和技术则在不执行代码的情况下分析代码的结构和内容。编译是将源代码转换为可执行文件的过程，而反编译则是尝试反转这一过程。编译和反编译都不执行代码。\n\
  \n19. B. Adam 正在通过审阅源代码进行静态代码分析。动态代码分析需要运行程序，而变异测试和模糊测试（fuzzing）都是动态分析的类型。\n\n20.\
  \ C. Tiffany 正在对应用程序进行压力测试。压力测试故意超出应用程序的正常限制，以观察其对极端负载或其他超出正常能力的异常情况的响应。单元测试测试应用程序的单个组件，而回归测试是为了确保新版本不会引入旧漏洞。`Fagan\
  \ testing`（Fagan 测试）是一种正式的代码检查方法。\n\n## 第 9 章：建立事件响应计划\n\n1. D. 前员工导致服务器崩溃是计算机安全事件的一个示例，因为这违反了该系统的可用性。用户访问安全文件以及管理员更改文件权限设置属于安全事件（events），但不是安全事故（incidents）。\n\
  \n入侵者闯入建筑可能是一个安全事件，除非他们执行了某些影响计算机系统的操作，否则不一定是计算机安全事件。\n\n2. A. 组织在事件响应过程的准备阶段应该建立稳固的、深度防御的网络安全方法。在此阶段建立的控制旨在减少未来事件发生的概率和影响。\n\
  \n3. C. 安全信息和事件管理 (`SIEM`）系统关联来自多个源的日志记录并尝试识别潜在的安全事故。\n\n4. C. 中等功能影响的定义是：组织失去了为部分系统用户提供关键服务的能力。这准确地描述了\
  \ Ben 所面临的境地。只有当组织能够以降低的效率为所有用户提供所有关键服务时，才判定为低功能影响。只有当所有用户都无法使用某个关键服务时，才判定为高功能影响。\n\
  \n5. C. 遏制、根除和恢复阶段中的遏制协议旨在限制正在发生的安全事故造成的损害。\n\n6. C. `Kill Chain`（杀链）包含了防御网络之外的行动，许多防御者无法对这些采取行动，这导致了该模型常见的批评之一。其他批评还包括对传统边界和基于反病毒技术的关注，以及缺乏对内部威胁的关注。\n\
  \n7. C. 在专有数据泄露中，未分类的专有信息被访问或外泄。受保护的关键基础设施信息 (`PCII`) 就是未分类专有信息的示例。\n\n8. A. 网络时间协议\
  \ (`NTP`) 提供了一个通用的时间信息源，允许同步整个企业的时钟。\n\n9. A. 组织的事件响应策略应包含清晰描述在响应活动安全事故时分配给 `CSIRT`（计算机安全响应小组）的权限。\n\
  \n10. D. 网络攻击是从网站或基于 Web 的应用程序执行的攻击——例如，用于窃取凭据或重定向到利用浏览器漏洞并安装恶意软件的跨站脚本攻击（XSS）。\n\
  \n11. C. `Cyber Kill Chain`（网络杀链）的安装阶段专注于为攻击者提供持久的后门访问。当工具直接或间接地投入使用时发生“交付”（Delivery），而当漏洞被利用时发生“利用”（Exploitation）。“命令与控制”（`C2`）利用双向通信提供持续控制。\n\
  \n12. A. 事件响应策略为 `CSIRT` 提供了工作所需的权限。因此，它应该获得组织内最高级别的权威机构批准，最好是首席执行官（CEO）。\n\n13.\
  \ A. 潜在事故的检测发生在检测和分析阶段。列出的其他活动都是遏制、根除和恢复阶段的目标。\n\n14. C. 当恢复时间不可预测时，会发生扩展恢复工作。在这些情况下，需要额外的资源和外部帮助。\n\
  \n15. D. 损耗攻击（attrition attack）采用暴力手段来破坏、损害或毁灭系统、网络或服务——例如旨在损害或拒绝服务的 `DDoS` 攻击，或针对身份验证机制的暴力破解。\n\
  \n16. C. 经验教训会议由未参与事件响应工作的第三方进行主持时效果最好。\n\n17. D. 重建系统的程序具有很的技术性，通常包含在剧本（playbook）或程序中，而不是事件响应策略中。\n\
  \n18. B. 冒充攻击涉及用恶意替换良性内容——例如，欺骗（中间人攻击）、非法无线接入点和 SQL 注入攻击都涉及冒充。\n\n19. C. 事件响应剧本包含详细的步骤说明，指导网络安全事故的早期响应。组织通常为高严重性和频繁发生的事件类型准备剧本。\n\
  \n20. A. 场景中描述的事件不属于可衡量的信息影响的安全事故。虽然笔记本电脑确实包含可能导致泄露的信息，但由于使用了加密保护笔记本电脑的内容，避免了这种泄露。\n\
  \n# 第 10 章：事件检测与分析\n\n1. C. Susan 需要跟踪证据的监管链，并应确保维护适当的监管链。这对于处理可能参与法律诉讼的数据尤为重要。\n\
  \n2. C. Hui 知道她需要根据法律保留通知保留日志，并需要找到一种在维持组织运营的同时保留日志的方法。这样做可能会导致严重的法律后果。\n\n\n\n\n\
  \n### 3. A. 哈希值（Hashes）用于验证驱动映像和其他取证制品。对比原始文件和镜像的哈希值通常用于确保它们匹配。其他选项都无法验证驱动映像，而且加密驱动会修改它，破坏证据。\n\
  \n### 4. B. 流量模式和水平的基准将允许 Kathleen 确定流量是典型的，还是发生了异常情况。启发式算法（Heuristics）关注行为，而 Kathleen\
  \ 想看的是流量水平是否不同，而不是行为。协议分析查看是否存在异常的协议或数据，而网络流日志对于确定哪些系统正在向何处发送流量以及通过什么协议非常有用。\n\n\
  ### 5. B. 开放源数据（Open feed data）的质量和可靠性可能不同。这意味着 Renee 必须建立相关流程来评估她收到的 IoC（入侵检测指标）信息的质量和可靠性。开放源意味着它是免费的。开放馈源通常是活跃的，由于\
  \ IoC 的创建和更新，IoC 的详细程度会有所不同，无论馈源类型如何。\n\n### 6. C. 主动监控（Active monitoring）侧重于使用\
  \ `ping` 和 `iPerf` 等工具主动收集数据。使用协议分析器的被动监控（Passive monitoring）收集网络流量，以及基于 `SNMP`\
  \ 的路由器监控，而流（flows）则通过接收或收集记录信息来收集数据。\n\n### 7. C. 系统映像通常不是 IOC 的一部分。恶意软件的哈希值可能是\
  \ IOC，IP 地址、主机名、域名以及基于行为的信息等常见细节也可能是。\n\n### 8. C. 日志分析、流监控和部署 `IPS`（入侵预防系统）都是帮助检测拒绝攻击的适当解决方案。`iPerf`是一种性能测试工具，用于建立网络连接上的可用最大带宽。\n\
  \n### 9. C. 虽然可能存在其他问题，但循环的计划任务最可能被设置为 `cron` 任务，Sameer 应该从那里开始搜索。`Task Scheduler`（任务计划程序）是\
  \ Windows 工具，系统日志可能包含也可能不包含有关进程的信息，搜索用户目录无法提供特定时间启动进程的指示。\n\n### 10. B. 审查告报发生的原因是\
  \ Jim 的第一步。孤立的 IoC 可能并不指示入侵或攻击，因此验证告报很重要。由于警报而关闭系统可能会导致停机或阻止取证调查。没有任何迹象表明这是一种会被记录的网络攻击，问题中也没有指示要进行端口扫描。\n\
  \n### 11. D. 描述中这种来自全球许多系统的流量大幅增加的行为，如果是恶意的，最有可能是分布式拒绝服务攻击（DDoS）。Mark 的挑战在于判断这是否是攻击，还是发生了某些其他事件驱动流量流向他的网站——在某些情况下，病毒式传播的帖子很难与攻击区分来！\n\
  \n### 12. A. Valentine 知道未经授权的访问通常涉及创建未经授权的用户以及允许访问系统的身份验证事件。系统日志包含系统事件但不包含身份验证或用户创建信息。应用程序日志跟踪应用程序事件，并且通常也不会显示此类信息。\n\
  \n### 13. C. 从远程系统使用相同用户名但不同密码的一系列尝试登录是暴力破解攻击的常见迹象。虽然更复杂的攻击者会使用多个远程系统并在时间上分散尝试，但简单的暴力破解攻击看起来完全是这样。Sayed\
  \ 可以通过与被使用用户名的管理员核实来验证这一点。\n\n### 14. C. 最可能的答案是链接失效了。设置错误的采样率无法提供良好的流量视图，而 DDoS\
  \ 攻击更有可能显示大量流量。`SNMP` 是监控工具，不会导致流数据发生。\n\n### 15. B. 系统日志通常与应用程序日志分开处理。可用/不可用（Up/down）、性能、事务日志和服务日志都是用于确保应用程序运行运行的常见监控形式。\n\
  \n### 16. A. 比典型用户执行得更快速的操作可能是机器人行为的迹象。如果执行操作的用户通常不运行脚本或连接到多台机器，Greg 可能想要进行更深层的调查，包括检查远程系统上的日志以查看尝试了何种身份验证。仅凭\
  \ `SSH` 连接并不是端口扫描、权限提升或拒绝服务攻击的迹象。\n\n### 17. C. 攻击者很可能尝试从整个数据库中收集信息，这意味着缓存命中（cached\
  \ hits）将无法构成全部查询量。因此，数据库的磁盘读取可能比缓存命中数的增加更重要的入侵指标，因为增加可能仅仅是更典型的使用情况。\n\n### 18. C.\
  \ Valerie 专门在寻找网络相关的 IoC，而系统内存消耗是主机或系统相关的 IoC，而不是网络相关的 IoC。\n\n### 19. C. Alex 流程的第一步应该是识别填充驱动器的文件位于何处以及是什么。简单的搜索通过对大目录和文件排序可以帮助实现这一点。Windows\
  \ 没有记录此点的文件系统日志，且安全日志侧重于安全事件而非文件系统信息。搜索已更改的文件需要一种跟踪更改的工具，而这并不是 Windows 默认安装包的一部分。\n\
  \n### 20. B. Joseph 创建了一个用户行为基准，这将允许他看到用户运行的正常行为和命令是否存在异常。模式匹配、指纹识别和用户建模不是描述这一过程的术语。\n\
  \n# 第 11 章：遏制、根除与恢复\n\n### 1. A. 事件响应的遏制、根除和恢复阶段包含了旨在尽量减少事件造成的损害并尽快恢复正常运行的积极措施。\n\
  \n### 2. C. NIST 建议使用六项标准来评估遏制策略：资源的潜在损害、证据保护的需求、服务的可用性、所需的时间和资源（包括成本）、策略的有效性和解决方案的持续时间。\n\
  \n### 3. C. 在分段（segmentation）方法中，怀疑系统被放置在一个网络中，其对其他网络资源的访问非常有限。\n\n### 4. B. 在隔离（isolation）策略中，隔离网络直接连接到互联网或受到防火墙规则的严格限制，以便攻击者可以继续控制它但无法访问任何其他网络资源。\n\
  \n### 5. D. 在移除（removal）方法中，Alice 为了取证目的保持系统运行，但完全切断了它们与其他网络（包括互联网）的访问连接。\n\n###\
  \ 6. A. 沙箱（Sandboxes）是隔离工具，用于将攻击者限制在一个环境中，他们在环境中认为认为正在进行攻击，但实际上在一个无害的环境中操作。\n\n\
  ### 7. C. Tamara 的首要任务应该是遏制攻击。这可以防止攻击扩散到其他系统，并可能可能停止敏感信息的外泄。只有在遏制攻击后，Tamara 才应该进行根除和恢复活动。识别攻击源的优先级较低。\n\
  \n\n\n\n\n### 8. A\n在事件调查期间，团队可能会根据攻击者使用的工具、技术和战术遇到新的入侵指标（`IOCs`）。作为经验教训回顾的一部分，团队应该清晰地识别出任何新的\
  \ `IOCs`，并对更新组织的安全监控计划提出建议，以将这些 `IOCs` 纳入其中。这将减少未来类似事件逃避关注的概率。在遏制、清除和恢复期间，应考虑范围、影响和系统重装。\n\
  \n### 9. C\n理解攻击的根源对于事件恢复工作至关重要。分析师应检查所有所有可用信息，以帮助重构攻击者的行为。这些信息对于修复安全控制和防止未来发生类似攻击至关重要。\n\
  \n### 10. C\nLynda 应该参考图 11.7 中的流程图。根据该图表，对于包含高安全风险信息且将在组织内重复使用的介质，其适当的处置方式是进行数据清除。\n\
  \n### 11. B\n如果需要，新的防火墙规则将在清除和恢复阶段实施。验证阶段包括验证账户和权限、验证日志记录是否正常工作以及进行漏洞扫描。\n\n###\
  \ 12. D\n清除的主要目的是移除可能遗留在组织网络上的任何事件遗迹。这可能包括从网络中删除恶意代码、对受损的介质进行净化以及保护受损的用户账户。\n\n\
  ### 13. B\n书面事件报告有许多潜在用途。首先，它创建了关于事件的机构记忆，这在开发新的安全控制和培训新的安全团队成员时非常有用。其次，如果由于事件导致了法律诉讼，它可以作为事件的重要记录。这些报告应该进行分类，并且不向外部实体披露。\n\
  \n### 14. D\n恶意软件签名通常不会包含在证据日志中。日志通常包含识别信息（例如，计算机的位置、序列号、型号号、主机名、MAC 地址和 IP 地址）、在调查期间收集或处理证据的每个人员的姓名、职位和电话号码、每次处理证据的时间和日期（包括时区），以及存储证据的位置。\n\
  \n### 15. D\n即使将系统从网络中移除，也不能保证攻击不会继续进行。在本章给出的示例中，攻击者可以在服务器上运行脚本，检测服务器何时被从网络中移除，然后开始破坏存储在服务器上的数据。\n\
  \n### 16. A\n图 11.7 中的数据处置流程图规定，任何离开组织控制的包含高度敏感信息的介质必须销毁。Joe 应该购买新的替换设备给承包商。\n\n\
  ### 17. B\n事件报告除了其他信息外，应该包含事件年、影响评估以及经验教训的记录。事件响应工作通常不侧重于发现攻击者的身份，因此此类信息不会出现在事件报告中。\n\
  \n### 18. D\nNIST SP 800-61 是`计算机安全事件处理指南`。NIST SP 800-53 是《联邦信息系统和组织的安全与隐私控制标准》。NIST\
  \ SP 800-88 是《介质净化指南》。NIST SP 800-18 是《联邦信息系统安全计划的制定》。\n\n### 19. A\n将系统重置为出厂状态是数据擦的一个示例，但这并不是组织所需要的。\n\
  \n### 20. A\n仅移除系统无法阻止攻击者。在事件响应（IR）循环的所有阶段都应该与利益相关者进行通信。\n\n# 第 12 章：报告与沟通\n\n###\
  \ 1. C\n组织需要确保将发现与相关的利益相关者共享。\n\n### 2. B\n经验教训练习用于确保组织能够利用从事件中获得的发现和经验。\n\n###\
  \ 3. A\n安全运营和监督可能希望摄入漏洞管理数据。\n\n### 4. D\n如果没有上下文信息，仅仅知道警报的数量并不是一个有用的指标。\n\n###\
  \ 5. B\n平均检测时间、平均响应时间和平均修复时间提供了更有用的信息，尽管每项信息都需要上下文支持。\n\n### 6. D\n服务水平协议（`SLAs`）通常有性能目标，如果系统因打丁而离线，这些目标可能无法实现。\n\
  \n### 7. B\nIan 想要确保整个基础设施的补丁，这表明需要一个大规模部署补丁的配置管理工具。\n\n### 8. A\n影响评估侧重于描述事件对组织的意义，包括财务、声誉或其他影响。\n\
  \n### 9. C\n谅解备忘录（`MOUs`）通常与性能或运行目标相关，如果系统离线，这些目标可能无法实现。\n\n### 10. C\n日志等详细证据通常作为证据附在附录中。\n\
  \n### 11. C\n介质培训是有用的，对培训的需求可能是事件后总结得的经验教训。\n\n### 12. C\n根因分析练习的设计目的并不是为了确定谁该承担责任。相反，它们侧重于识别根源以便对其进行修复。\n\
  \n\n\n\n\n## 14. C. 内部要求不太可能在特定时间线内要求事件报告，因为它们通常承认了事件响应的复杂性。虽然媒体可能希望在特定时间范围内获得报告，但这并不意味着必须做出响应。相反，在列出的选项中，对于大多数组织而言，合规性是在特定时间线内进行报告的主要驱动因素。\n\
  \n## 15. B. Jim 拥有的最佳选择可能是识别补偿控制。这在长期来看可能不是一个合适的解决方案，Jim 的组织可能需要更改其服务或设计，以便实施安全修复。组织治理不会改变功能性影响，题目中没有提到遗留系统，也没有列出服务水平协议（SLA）。\n\
  \n## 16. A. NIST 承认处理媒体事务的必要性，并建议进行媒体培训、建立向媒体简报程序、维护事件响应（IR）状态文档或声明、为员工应对媒体接触和信息请求做好准备，并作为\
  \ IR 练习的一部分为事件响应人员举办持续的演练。\n\n## 17. B. 事后活动（Post-Incident Activity）通常包含 NIST IR\
  \ 生命周期中的事件报告。\n\n## 18. C. Chris 知道零日漏洞意味着扫描器没有针对该漏洞的规则或检测配置。这意味着以前运行的报告和扫描将不会显示它。他们的供应商可能会针对该零日漏洞发布检测配置或规则，但从发布到请求之间的时间非常短，这不太可能已经发生。重新运行报告不会显示未知的漏洞，而如果存在规则，零日漏洞是可以被检测到的。\n\
  \n## 19. A. Mikayla 知道，意识提升和教育是确保员工意识到补丁重要性的第一步。她的第一步应该是确保适当的意识提升、教育和培训。没有迹象表明业务需求发生了变化，补偿控制应仅在需要时使用，而不应作为一种常规做法，而且惩罚不太可能解决底层问题。\n\
  \n## 20. D. Geeta 应该识别一种补偿控制，在对系统功能影响最小的范围内妥妥地确保系统的安全性。示例可能在逻辑上于设备前放置网络防火墙、将其移动到隔离且安全的网络分段或\
  \ VLAN，或者或其他添加保护。将漏洞标记为无法修复并不能保护系统或公司，关闭它将影响组织的功能，而安装补丁可能会导致功能问题或防止供应商支持。\n\n##\
  \ Chapter 13: 执行取证分析与事件响应技术\n\n1. B. `dd` 以位级的 `RAW` 格式创建文件。`EN01` 是 EnCase 取证文件格式，`OVF`\
  \ 是虚拟化文件格式，而 `ddf` 是虚造的答案。\n\n2. A. 一旦完成根原因分析，通常会记录教训，以避免未来出现类似的问题。架构图和更新后的流程可能是这些教训的一部分。当前法律留存（legal\
  \ holds）的列表通常不是该过程的一部分。\n\n3. C. 根原因分析在实施控制措施或修复之前可能涉及成本效益分析，但风险评估通常是一个独立的过程。\n\n\
  4. C. 写保护保护器（Write blockers）确保在创建取证副本时不会对源驱动器进行任何更改。阻止读取将阻止你复制驱动器，磁盘克隆机可能内置或内置写保护功能，而哈希验证对于确保内容匹配有用，但不能阻止源驱动器发生更改。\n\
  \n5. B. 法律留存是一种用于保存与待决诉讼相关或预期可能发生诉讼的所有数据的过程。向律师支付聘金（retainer）是为了让他们随时待命工作。另外两个术语是为此题虚造的。\n\
  \n6. B. 经常进行根原因分析是为了识别哪里出了问题以及为什么出错。然后识别并应用教训，以确保组织未来不再遇到相同的问题。责任归属不是取证程序的一部分。由于哈希是单向函数，无法反推。法律留存与法律行动有关。\n\
  \n7. A. 时间线（Timelines）是进行此类调查时最有用的工具之一。\n\n8. D. 由于 Danielle 在克隆之前没有对驱动器进行哈希处理，无法确定问题发生。如果她在克隆之前运行了\
  \ `MD5sum`，就可以验证原始磁盘。\n\n9. D. `Volatility Framework` 设计用于 Windows、macOS 和 Linux，并提供深度内存分析。`LiME`\
  \ 和 `fmem` 是 Linux 工具，而 `DumpIt` 是 Windows Windows 工具。\n\n10. D. Lisa 发现了证据链的问题。每次传输、取证行动或其他事件都应记录在案。\n\
  \n11. B. 验证数据完整性可以确保镜像或文件是可靠的，没有被故意或无意地修改。最后，法律留存需要数据保护，而不是数据完整性验证。\n\n12. D. 当手机无法进行取证镜像或访问卷/文件系统时，需要手动访问。手动访问需要人工查看，并保留照片和笔记。\n\
  \n13. A. `CCleaner` 是一种清理工具，会清除历史记录、Cookie 和其他缓存数据，并可能阻碍取证。`CCleaner` 可能是反取证活动的迹象。它不是全盘加密工具或恶意软件壳，也不会修改\
  \ MAC 时间。\n\n14. B. 实时镜像通常不会捕获未分配空间，可能导致数据丢失。工具的残留数据、镜像制作期间内存和磁盘内容的变化以及恶意软件检测到工具都是可能的问题。\n\
  \n15. D. Jeff 没有创建镜像，因此无法验证驱动器的证据链。这意味着他无法证明驱动器是原始设备的副本。由于我们不知道原始驱动器的校验和，因此不存在错误的校验和或哈希不匹配——没有原始可以对比。\n\
  \n16. A. 在程序运行时镜像系统最有利于 Jeff 从内存中捕获加密密钥或解密数据。关后的离线镜像可能会导致必须处理加密文件。暴力破解通常很慢且可能不成功，导致系统崩溃可能会导致数据损坏或不存在。\n\
  \n17. A. `tcpdump` 工具是一个命令行数据包捕获工具，存在于许多 Linux 系统中。`Wireshark` 是一个适用于大多数操作系统的 GUI\
  \ 工具。`Netdd` 和 `snifman` 是为此题虚造的。\n\n18. A. Ben 正在维护证据链文档。Chris 担任 Ben 所采取行动的验证者，并作为该过程的见证人。\n\
  \n\n\n\n\n19. D. 虽然 `AES` 确实有一种哈希模式，但 `MD5`、`SHA1` 以及 `FTK` 等其他商业工具内置的哈希工具常用于取证哈希。\n\
  \n20. B. 云环境和虚拟化环境通常是临时的（瞬态的），因此很难对其进行取证。如果你拥有云环境、虚拟化或容器化环境，请确保你已经考虑过如何进行取证，以及你可能需要使用哪些数据保护技术。\n\
