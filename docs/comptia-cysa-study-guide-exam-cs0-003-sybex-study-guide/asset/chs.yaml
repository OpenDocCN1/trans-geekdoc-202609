  \    1. 在 IR 过程中避免媒体\n    2. 建立媒体程序\n    3. 维护 IR 状态文档或声明\n    4. 媒体培训\n\n17. 事件报告通常在响应周期的哪个阶段准备？\n\
  \    1. 检测与分析\n    2. 事件后活动\n    3. 准备\n    4. 遏制、根除与恢复\n\n18. Chris 所在的安全团队收到了今天早晨发布的一个\
  \ Windows 零日漏洞通知。Chris 的经理要求他立即检查最近的漏洞报告以确定组织是否受影响。Chris 应该告诉他的经理什么？\n    1. 需要重新运行报告以列出零日漏洞\n\
  \    2. 他需要更新漏洞扫描器以检测零日漏洞\n    3. 零日漏洞不会出现在之前运行的漏洞报告中\n    4. 零日漏洞无法检测\n\n19. Mikayla\
  \ 的组织根据漏洞管理仪表板报告发现了一个持续问题。趋势表明补丁更新并不及时，且某些最关键漏洞没有安装补丁。如果 Mikayla 认为系统管理员没有优先考虑补丁，她应该做什么？\n\
  \    1. 开展意识、教育和培训活动。\n    2. 评估变化的业务需求。\n\n\n\n\n3. 部署补偿措施。\n4. 让管理层介入惩罚不打补丁的管理员。\n\
  \n20. Geeta 的组织运行着一个供应商提供的关键系统，该供应商规定操作系统无法打补。当她的漏洞报告显示系统补丁滞且存在严重漏洞时，Geeta 应该推荐哪种解决方案？\n\
  \n1. 将漏洞标记为无法修复并继续操作以确保业务连续性。\n2. 关闭系统直到找到解决方案为止。\n3. 安装操作系统补丁并测试其是否会引起问题。\n4. 识别并部署补偿措施。\n\
  \n# 第 13 章：执行取证分析与事件响应技术\n\n计算机取证调查用于确定系统中发生了哪些活动、更改和其他操作，是由谁或什么程序执行的，以及那里存储了哪些数据。这意味着计算机取证技术被应用于多种场景，包括事件响应、警方调查、对系统管理员滥用的查询、受损分析和恶意软件分析，以及与内部政策违规相关的调查。虽然取证调查有很多原因，但\
  \ `CySA+` 考试大纲侧重于事件响应背景和事后活动中的取证。\n\n在本章中，你将学习如何执行事件响应活动，并能够解释事件管理生命周期中的准备和活动后阶段。你还将学习如何准备进行基本的取证调查。你将学习取证工具包及其内容，以及其中设备和工具的使用。然后，你将探索用于网络、端点、移动以及云和虚拟调查捕获和保存取证数据的取证工具和流程。\n\
  \n### 构建取证能力\n\n能够进行取证调查的第一步之一是收集正确的工具集。取证工具具有广泛的功能、成本和目的。在构建你的工具包之前，你应该确定你可能进行什么种类型的调查、需要分析什么种类型的系统和设备，以及你需要遵守何种证据标准。\n\
  \n### 构建取证工具包\n\n完整的取证工具包是任何取证调查的重要部分。拥有正确的工具和材料不仅可以让过程变得更容易，还能帮助确保你的调查拥有正确的文档和支持材料，以防在你需要提供过程证明时——无论是在法庭、管理层还是审计员面前。\n\
  \n在接下来的几页中，你将学习取证工具包的主要组件，包括取证工作站、数据捕获工具和设备，以及帮助提供适当监管链跟踪的管理工具。请记住你的组织可能如何进行取证调查——并非所有这些组件对你的用例都是需要的。\n\
  \n#### 工具包的关键组件\n\n以下组件是大多数取证工具包共有的。取证工作站可以是台式机、笔记本电脑甚至是服务器，具体的组件应根据你的组织进行定制。但这组基本物品将允许你在大多数情况下执行取证调查。\n\
  \n* 数字取证工作站。一个良好的取证工作站设计用于允许进行数据捕获和分析，这些任务可以受益于强大的多核 `CPU` 和充足的 `RAM`。拥有大量快速、可靠的存储空间也很重要，因为大型调查可能处理\
  \ TB 级的数据。\n\n* 取证调查套件或取证软件，如 `FTK`、`EnCase`、`SANS Investigative Forensic Kit (SIFT)`\
  \ 或 `The Sleuth Kit (TSK)`，它们提供了捕获和分析取证镜像以及跟踪取证调查的能力。\n\n* 写保护器（Write blockers），确保连接到取证系统或设备的驱动器无法被写入。这有助于确保取证调查的完整性；文件访问时间被改变——更糟糕的是，分析数据的系统修改了驱动器上文件的内容——可能会导致取证证据失去用处。\n\
  \n* 取证驱动器复制器（Forensic drive duplicators），设计用于取证调查复制驱动器，并验证原始驱动器与新驱动器内容是否匹配。许多取证工具和套件也提供这种功能，但专用的克隆设备可能有用（而且有时可以更容易证明复制过程是以符合取证的方式完成的）。\n\
  \n* 容量充足的擦除驱动器和擦除移动介质，以处理你可能遇到的任何驱动器或系统。幸运的是，大型 `SATA` 硬盘、便携式 `NAS` 设备和大型 `SSD`\
  \ 让捕获和传输多个取证镜像变得容易得多。大 `USB` 优盘、可写 `Blu-ray` 或 `DVD` 介质或闪存等移动介质对于传输取证数据或在必要时发送给其他组织也很有价值。\n\
  \n* 各种类型的电缆和驱动器适配器，确保你可以连接到可能遇到的大多数类型设备。在企业环境中，你可能知道组织部署了什么种机器和驱动器，允许你选择正确的适配器和电缆来匹配你拥有的设备。在执法、咨询或其他可能不知道会遇到什么的环境中，拥有广泛选择的电缆和适配器将非常有帮助。\n\
  \n* 相机，用于记录系统配置、驱动器标签和其他信息。相机是取证捕获中一个意想不到的重要部分，因为它们可以加速数据记录，并提供系统或设备状态的视觉记录。\n\n\
  * 标记和文档工具，包括标签机或标签、不擦之笔和其他有助于监管链和取证过程文档记录的工具。\n\n* 笔记本和预备的文档表单及清单，用于记录取证调查过程和笔记。常见的表单类型包括跟踪谁在任何时候拥有证据的监管链表、用于跟踪响应过程的事件响应表单、事件响应计划和事件表单，以及响应过程中需要联系的人员升级名单或电话列表。这些有时会被取证录制软件软件包或其他提供验证日志条目方法并跟踪变化的软件工具取代。`Figure\
  \ 13.1` 显示了监管链表的一个示例。\n\n## 理解取证软件\n\n有很多类型的取证软件，从专门构建的取证套件和工具（如 `FTK`、`EnCase`、`CAINE`、`Autopsy`\
  \ 和 `SIFT`）到取证实用程序（如 `DumpIt` 和 `Memoryze`）。许多常见的 Linux 和 Windows 实用程序也具有取证应用，包括\
  \ `dd` 和 `WinDbg` 等工具。\n\n### 功能与应用\n\n取证调查可以采取许多形式，这意味着你需要广泛的软件工具包来处理你遇到的情况、系统和特定需求。取证软件工具包中应包含的关键取证工具功能包括镜像、分析、哈希和验证、进程和内存转储分析、密码破解和日志查看器。\n\
  \n#### 镜像媒介和驱动器\n\n\n\n\n\n# 许多取证调查的第一步是创建媒体或磁盘的副本，这些设备可能包含对调查有用的数据。这是通过使用镜像工具完成的，该工具可以创建完整磁盘、磁盘分区或逻辑卷的取证镜像。\n\
  \n取证镜像与原始源驱动器、卷、分区或设备完全匹配，包括空闲空间（slack space）和未分配空间（unallocated space）。空闲空间是写入文件后留下的空间。这些未被使用的空间可能包含之前写入该空间的文件碎片，甚至是刻意隐藏的文件。未分配空间是指未分区的空间。当使用得当时，镜像工具可以确保你捕获了所有此类数据。\n\
  \n## 分析工具\n\n取证分析工具提供了许多实用的功能，可以帮助深入了解系统上发生了什么。示例包括：\n\n*   系统更改时间线\n*   验证工具，用于将系统上发现的文件与已知的良好版本文件进行比对\n\
  *   文件系统分析能力，可以查看文件系统元数据（如 `NTFS` 的 Windows 主文件表）以识别文件的更改、访问和删除\n*   文件雕刻（File carving）工具，允许在文件系统本身不可用的情况下恢复文件\n\
  *   Windows 注册表分析\n*   日志文件解析与审查\n\n这些分析工具可以帮助识别对取证调查有用的信息，但要用好它们需要详细的取证知识，以避免遗漏重要数据。\n\
  \n## 雕刻\n\n当作为取证分析的一部分恢复数据时，原始文件系统可能已不再完整。在这种情况下以及其他无法使用原始文件系统的场景中，文件`雕刻`工具就大显身手了。文件雕刻工具按块为单位查看数据，寻找文件头和其他文件结构指示器等信息。当它们找到这些信息时，会尝试恢复完整甚至部分文件。\n\
  \n三种常见的文件雕刻方法如下：\n\n*   基于文件头和文件脚的雕刻，侧重于类似于 JPEG 文件中的文件头。例如，通过查找文件头中的 `\\xFF\\xD8`\
  \ 和文件脚中的 `\\xFF\\xD9` 来找到 JPEG 文件。\n*   基于内容的雕刻技术，寻找有关文件内容的信息，如字符计数和文本识别。\n*   基于文件结构的雕刻技术，使用有关文件结构的信息。\n\
  \n图 13.2 显示了在免费十六进制编辑器 `HxD` 中打开的 JPEG 文件。在图像左上角，你可以看到 JPEG 的头信息，显示 `FF` 和 `D8`\
  \ 是文件中的第一对项目。\n\n ![图 13.2 使用 HxD 雕刻 JPEG 文件](img/c13f002.png)\n\n`图 13.2` 使用 HxD\
  \ 雕刻 JPEG 文件\n\n## 监管链跟踪\n\n以自动化和记录的方式妥当维护监管链（chain of custody）文档的支持，是取证套件的重要组成部分，也是许多组织记录的取证程序的重要组成部分。维护监管链文档可确保磁盘镜像和其他数据，以及使用该套件采取的操作都经过了妥当的验证并可供审查，从而减少了因保管实践不当而导致法律挑战的风险。\n\
  \n## 哈希与验证\n\n验证镜像的取证完整性是取证镜像的重要组成部分。幸运的是，可以使用取证套件内置的`哈希`（hashing）工具或独立运行这些工具来获取驱动器的哈希值，以验证副本的内容。此过程的目标是确保副本与源驱动器或设备完全匹配。\n\
  \n取证镜像格式（如 EnCase 的 `EO1` 格式）提供了文件内置的哈希。在未使用此类格式的情况下，`MD5`、`SHA1` 和 `SHA2` 哈希经常被用于此目的。即使使用\
  \ `MD5` 这样快速的算法，对大硬盘计算哈希也需要很多时间，但过程本身非常简单，所示。以下提供了 Linux 系统上挂载卷的 MD5 哈希：\n\n```\n\
  user@demo:~# md5sum /dev/sda1\n9b98b637a132974e41e3c6ae1fc9fc96  /dev/sda1\n```\n\
  \n为了验证镜像，会为原始镜像和副本生成哈希值。如果哈希值匹配，则镜像是相同的。两个哈希值都应该作为调查取证日志的一部分记录下来。\n\n哈希还经常用于验证二进制文件和其他应用程序相关文件，以检测二进制文件的更改。可以使用\
  \ `MD5` 或 `SHA1` 工具进行手动校验和，以检查文件是否与已知的良好版本或备份文件匹配，或者与供应商或其他来源提供的校验和进行比对。\n\n对于应急响应人员和取证分析师来说，幸运的是，已知文件哈希数据库由少数组织维护，包括\
  \ NIST 国家软件参考库（National Software Reference Library），该库包含了带有软件数字签名的参考数据集：`www.nist.gov/itl/ssd/software-quality-group/national-software-reference-library-nsrl`。\n\
  \n许多组织还跟踪已知的恶意软件哈希，允许响应人员上传疑似恶意代码进行检查。\n\n## 执行端点取证\n\n传统上，绝大多数取证活动发生在端点系统上：服务器、桌面电脑、笔记本电脑和各种类型的移动设备。随着组织日益向云端迁移，越来越多的取证活动在那里发生，但对于大多数从业人员来说，大部分取证工作可能仍继续涉及传统的端点。\n\
  \n### 操作系统、进程和内存转储分析\n\n关于操作系统（OS）状态的信息（包括存储在内存中的数据）对于取证调查以及恶意软件感染或入侵调查都非常重要。通常，其他情况下加密存储的数据在内存中对进程是可见的，或者这些进程访问加密数据时使用的加密密钥也可用。捕获内存、进程信息和数据以及操作特定的分析能力是一项实用的取证能力。操作系统分析可以提供调查目标时间段内系统运行的关键数据。\n\
  \n除了实时内存捕获和分析外，内存转储（memory dump）分析在恢复 `BitLocker` 等全盘加密产品的解密密钥时特别有价值。休眠文件和崩溃转储都包含解密磁盘所需的数据，这使得访问未锁的机器对于取证从业人员至关重要。\n\
  \n#### 磁盘取证\n\n端点最常见的取证活动是磁盘或基于存储的分析。其范围从手动检查文件到本章提到的对整个磁盘或卷进行完整镜像和分析。\n\n#### 内存取证\n\
  \n执行内存取证需要在正在运行的机器上运行实时取证分析，或者制作实时内存副本以进行时点取证内存分析。像 `Volatility` 这样的开源内存取证框架可以捕获并分析内存。\n\
  \n`Volatility` 拥有广泛的插件命令，包括检测 API 钩、读取键盘缓冲区、获取 Windows 剪贴板、查找活动 TCP 连接、扫描驱动对象等许多功能。如果内存中存在明文形式的可访问数据，你应该假设它是可以被恢复的——即使它是加密的，如果密钥可用，也可以访问加密版本并进行解密。\n\
  \n\n\n\n内存取证在尝试恢复在使用期间存储在内存中的安全产物（例如加密密钥和密码）时特别有用。作为取证实务人员，你应该记住，系统崩溃转储文件通常包含实时内存的副本，这使其成为实务人员和有经验的攻击者极具吸引力的目标。\n\
  \n## 移动设备与手机取证\n\n移动设备取证能力存在于许多商业取证套件中，也以独立工具的形式存在。由于许多手机操作系统提供了安全特性，这些工具通常具有专门的解密或暴力破解能力，允许从锁定且加密的手机或手机分区中提取数据。\n\
  \n手机备份取证能力也是移动取证的有用工具。备份可能不包含所有当前数据，但它们可能包含已删除的旧数据，且其安全性可能不如手机本身，因此它们成为取证获取和审查的极具吸引力的目标。\n\
  \n## 密码破解器与密码恢复\n\n越来越多的驱动和设备被加密或使用密码来保护系统或文件。这使得密码恢复工具（也称为密码破解器）对取证检查员非常有用。除了操作系统或帐户级别之外，发现密码保护的常见区域还包括\
  \ Microsoft Office 文件、PDF，以及 ZIP 和 RAR 压缩文件。\n\n为取证调查恢复密码可能具有挑战性，但如 `ElcomSoft's\
  \ Advanced Office Password Recovery`（如图 13.3 所示）等工具提供了多种文件类型的暴力破解密码功能。\n\n![图 13.3\
  \ Advanced Office Password Recovery 破解 Word DOC 文件](img/c13f003.png)\n\n`图 13.3`\
  \ Advanced Office Password Recovery 破解 Word DOC 文件\n\n## 加密工具\n\n加密工具既用于保护取证数据，也用于保护数据和应用程序免受取证。取证工具通常具有加密功能，以确保在传输驱动器或文件或取证环境受到破坏时，取证调查中的敏感数据不会泄露。\n\
  \n还需要加密工具来处理加密驱动和网络协议。这些能力因工具而异，但处理 `BitLocker`、`Microsoft Office` 以及其他常见的加密机制是取证调查中的常见任务。\n\
  \n当使用取证技术调查恶意软件时，经常会遇到加密和其他保护方案作为防止恶意软件代码分析的手段。许多恶意软件包使用称为“壳器”（packers）的工具，旨在保护它们免受逆向工程。壳器的目的是使直接分析代码变得困难或不可能。某些取证工具支持对\
  \ `Base64` 编码等打包技术进行解包和解码。\n\n## 日志查看器\n\n日志文件可以提供有关系统状态、在系统上执行的操作以及错误或问题的信息，以及各种其他信息。这使得当你尝试理解系统或设备上发生了什么时，日志条目变得特别有用。取证套件通常内置了`日志查看器`，可以将日志条目与其他取证信息匹配，但专门的日志可能需要额外的工具。\n\
  \n## 网络取证\n\n网络流量取证需要捕获网络流量，或审查此类流量的产物，例如安全或网络设备日志、流量监控数据或其他可以帮助取证实务人员重建事件和事故的信息。\n\
  \n### Wireshark 网络取证\n\n`Wireshark` 是一个开源的网络协议分析器（有时被称为数据包嗅探器）。它允许你在微观层面捕获并与网络流量进行交互。`Wireshark`\
  \ 可以通过分析流量监控数据以及安全或网络设备日志来重建事件和事故。\n\n### Tcpdump 网络取证\n\n`tcpdump` 是一个用于拦截网络流量的命令行数据包分析器。它在\
  \ Linux 和 Unix 系统上广泛可用，可以在没有图形用户界面（GUI）的情况下捕获和分析流量。\n\n\n\n虚拟化和容器化具有许多共同目标，且运行方式大体相似。图\
  \ 13.6 显示了这两个概念在高层面的对比。请注意虚拟化环境中的虚拟机与运行在相同容器化引擎下的应用程序之间的区别。\n\n### 容器取证\n\n容器正变得越来越常见，容器取证可能会引发一些独特的问题。其中最重要的一点可能是，大多数容器被设计为一次性使用的，因此一旦出现问题，许多组织会有相应的流程，以自动化或半自动化的方式关闭、销毁并重建容器。即使没有安全问题，由于其瞬态性，容器也可能被销毁或调度到不同的节点。这意味着取证产物可能会丢失。\n\
  \n![图 13.6 虚拟化与容器化](img/c13f006.png)\n\n`图 13.6` 虚拟化 vs 容器化\n\n容器化技术还带来了其他挑战：内部卷和文件系统痕迹是瞬态的；它们通过软件定义网络进行通信，随着容器的上线、下线或移动，这些网络会频繁变化；而且安全上下文由容器化编排工具进行动态修改。\n\
  \n这意味着，如果你预判到需要响应涉及容器化应用程序的事件，你需要预先计划捕获你将需要的数据。这意味着要识别用于审计活动的工具和流程，以及捕获容器取证可能所需的数据的方法。幸运的是，目前已有容器化安全工具可以提供此类帮助。\n\
  \n### 事件后活动与证据获取\n\nCySA+ 考试目标在事件后活动方面重点关注三个主要领域：取证分析、根本原因分析和教训总结。此外，证据获取通常作为取证活动的一部分进行，并包含在本节中。\n\
  \n### 执行取证分析\n\n取证分析不仅依赖取证工具包和取证套件。由于涉及的系统、设备、个人和其他材料，执行取证调查的过程通常非常复杂。\n\n作为事件响应过程一部分进行的取证调查通常侧重于`根本原因分析`，即确定发生了什么以及为什么发生的过程。此外，在取证调查和事件响应过程完成后，`经验\
  \ Learned`将作为`事件后活动`的一部分被记录并落实。\n\n接下来，我们将查看一个典型的取证流程。\n\n### 取证程序\n\n取证分析（有时称为取证调查）可以有许多形式，取证分析也有许多正式模型，但执行这些操作涉及的基本流程是相同的。在几乎所有场景中，你都会采取以下步骤：\n\
  \n1.  确定你想要发现的内容。你可能被要求调查一个受侵害的系统、分析恶意软件采取的操作，或者找出系统管理员是否对系统进行了未经授权的更改。这构成了问题陈述，有助于定义你将采取哪些取证活动。\n\
  2.  概述有助于你回答第 1 步中问题的数据位置和类型。数据可能以多种形式存在，应用程序和系统可以决定数据的格式和可访问性。知道你需要在何时以及如何收集数据也将影响你的取证流程的形式。在这一阶段，你可能不知道具体的硬件或日志位置，但你应该能够想出你需要从中捕获数据的类型和系统。\n\
  3.  记录并审查你的计划。\n4.  获取并保护证据。获取过程可能需要克隆介质、封存系统或设备，或制作内存镜像，以确保系统在关机时信息不会丢失。\n5.  进行初始分析，仔细跟踪你的操作、你处理的系统和数据、你的发现，以及你需要回答的任何问题。\n\
  6.  利用初始分析引导后续工作，包括更深层次的调查，并检查初始分析指向了哪些额外数据，或者哪里缺少回答你原始问题所需的信息。\n7.  报告调查结果。\n\n\
  获取过程需要考虑易失顺序（order of volatility），该顺序衡量数据丢失的难易程度。这意味着存储在内存或缓存中的数据被认为是高度易失的，因为系统关闭后将会丢失，而存储在打印格式或备份中的数据被认为易失性低得多。图\
  \ 13.7 显示了取证调查期间可能从其获取数据的常见存储位置易失顺序视图。\n\n![图 13.7 常见存储位置的易失性](img/c13f007.png)\n\
  \n`图 13.7` 常见存储位置的易失性\n\n### 法律留存与保护\n\n`法律留存`（Legal holds，有时也称为诉讼留存）要求组织保留所有与待决或正在进行的诉讼相关的、潜在相关的数据和信息。这意味着当发生法律留存时，组织必须准备好保留并交付数据。\n\
  \n法律留存通知通常由组织的律师在收到对方律师的通知后发出。该通知可能识别特定信息，或仅提供有关待决诉讼的信息，如名称、日期或其他有助于识别需要保留哪些数据的细节。由于法律留存可能要求组织保留日志、电子邮件或交易信息等数据，而这些数据通常会在计划的维护或销毁程序中被销毁，因此安全专业人员和其他\
  \ IT 人员需要建立流程来保护这些数据。\n\n`保护`也可能出于其他原因而需要。某些数据法律上要求保留一段时间。组织政策可能要求保护某些类型的数据。最后，为了应对未来的法律问题，可能需要作为内部调查的一部分保留数据。\n\
  \n### 证据获取\n\n驱动器镜像必须以符合取证的方式进行捕获。它们还需要通过哈希处理来验证`数据完整性`，并且除了无法完全避免的现场系统取证外，取证复制不应更改源驱动器。为了做到，需要使用镜像工具制作精确的位级拷贝，并使用写保护器以防止修改源驱动器的可能性，同时制作多个副本以保留原始驱动器。\n\
  \n#### 使用 dd 进行镜像\n\n\n\n\n\nLinux `dd` 工具通常用于以 RAW 格式（即逐位格式）克隆驱动器。`dd` 提供了许多实用的运算符，您应该设置这些运算符以确保镜像过程快速且准确地完成：\n\
  \n- 块大小使用 `bs` 标志设置，并以字节为单位。默认情况下，`dd` 使用 512 字节的块大小，但这远小于大多数现代磁盘的块大小。使用更大的块大小通常会快得多，如果你知道正在复制的设备的块大小，使用其原生块大小可以提供极大的速度提升。这可以通过类似于\
  \ `bs = 64k` 的标志来设置。\n- 运算符 `if` 设置输入文件；例如，`if = /dev/disk/sda1`。\n- 运算符 `of` 设置输出文件；例如，`of\
  \ = /mnt/usb/`。\n\n图 13.8 显示将挂载的驱动器镜像复制到 USB 设备的示例 `dd`。复制速度取决于块大小、源驱动器与目标驱动器的相对速度以及系统是虚拟还是物理等其他变量。\n\
  \n![FIGURE 13.8 dd of a volume](img/c13f008.png)\n\nFIGURE 13.8 卷的 dd 操作\n\n###\
  \ 处理加密驱动器\n\n驱动器和设备加密日益普遍，使得处理驱动器镜像变得更具挑战性。当然，现场系统镜像可以避免许多加密卷中存在的问题，但它也带来了自己的系列挑战。幸运的是，只要你有卷的密码，商业取证套件就能处理你可能遇到的许多许多常见加密类型。它们还提供了分布式破解方法，利用多台计算机攻击加密文件和卷。\n\
  \n### 使用写保护器\n\n写保护器是取证调查和取证驱动器镜像获取的重要工具。在获取驱动器镜像期间，使用写保护器可以确保将驱动器连接到取证复制设备或工作站时不会对驱动器进行修改，从而破坏过程的取证完整性。这种防止写入的能力在对驱动器和其他介质进行取证分析时同样有用，因为它确保不会意外对驱动器进行修改。\n\
  \n- 硬件写保护器可以防止驱动器通过其连接时发生写入操作。硬件写保护器可以通过 NIST 标准认证，测试信息可以通过 NIST 计算机取证工具测试程序通过 `www.cftt.nist.gov/hardware_write_block.htm`\
  \ 获取。\n- 软件写保护器通常没有硬件写保护器受欢迎，因此也不那么常见。由于可能出现问题，在防止写入发生非常重要时，会更频繁地使用硬件写保护器。\n\n###\
  \ 验证数据完整性\n\n镜像验证对于确保你的数据在取证上可靠的至关重要。商业工具使用内置的数据完整性验证功能来确保整个镜像与原始文件匹配。当调查人员使用 `dd`\
  \ 或其他手动镜像工具时，经常使用 `md5sum` 或 `sha1sum` 哈希实用来验证镜像。每当你生成一个镜像时，都应该记录原始文件和克隆副本的哈希或验证信息，并将这些信息记录在你的取证日志或监管链表单中。FTK\
  \ Imager Lite 会在过程结束时的报告中显示哈希值，如图 13.9 所示。\n\n### 现场系统镜像\n\n当系统使用全盘加密，或者当应用程序、恶意软件或其他软件可能驻留在内存中而磁盘上没有副本时，可能需要在系统运行时采集镜像。\n\
  \n现场镜像可能无法获取某些理想数据：\n\n- 现场镜像可能会由于镜像工具是从可移动驱动器挂载或安装的而留下残留。\n- 驱动器或内存的内容在镜像过程中可能会变化。\n\
  - 恶意软件或其他软件可能检测到镜像工具，并可能采取行动避免或禁用它。\n- 现场镜像通常不包含未分配空间。\n\n商业和开源工具都提供了便携版本，可以加载到现场系统中提供现场镜像能力。\n\
  \n![FIGURE 13.9 FTK image hashing and bad sector checking](img/c13f009.png)\n\n\
  FIGURE 13.9 FTK 镜像哈希和坏道检查\n\n### 重装系统\n\n当系统使用全盘加密，或者当应用程序、恶意软件或其他软件可能驻留在内存中而磁盘上没有副本时，可能需要在系统运行时采集镜像。CySA+\
  \ 考试大纲将重装系统称为抑制、根除和恢复的一部分。重装系统涉及重新安装系统或设备。在事件响应中，驱动器通常会被擦除而不仅仅是格式化。重装系统将消除取证痕迹，并在大多数情况下使从系统或设备中恢复数据变得困难，甚至不可能。\n\
  \n### 获取其他数据\n\n除了驱动器镜像外，你可能还想要针对其他类型的数据。幸运的是，在大多数情况下，主机的取证镜像如果这些数据驻留在系统中，也将提供访问这些数据的权限。你可能想要针对的其他区域包括日志数据、USB\
  \ 设备历史、应用程序数据、浏览器缓存和历史、电子邮件以及用户生成的文件。\n\n#### 采集和审查日志数据\n\n日志数据通常存储在远程，在机器被攻破或管理员采取行动隐藏的情况下，日志可能是不准确的。在其他情况下，调查可能涉及在中央或网络设备上记录的操作，而不是你可能创建取证镜像的单个系统或设备。在这些情况下，保留日志是重要的，并且需要额外的工作。\n\
  \n要保留和分析日志：\n\n- 确定日志存储在哪里以及以什么格式存储。\n- 确定你需要保留的时间段。记住，如果你发现问题或入侵发生在你最初怀疑之前，你可能想要获取更长时间的日志。\n\
  - 与系统或设备管理员协作获取日志副本，并记录获取方式。使用校验和或其他验证通常是合适的。\n- 识别感兴趣的项目。这可能包括操作、用户 ID、事件 ID、时间范围或其他在你的范围内确定的其他元素。\n\
  - 使用 Splunk、Sawmill、Event Log Analyzer 或文本编辑器等日志分析工具搜索和审查日志。\n\n#### 查看 USB 设备历史\n\
  \nWindows 会连接到系统的 USB 设备历史，为 U 盘和其他设备提供了有用的取证记录。4Discovery 的 USB Historian 可以根据挂载的驱动器镜像进行审查。在取证检查期间，USB\
  \ Historian 或类似工具提供的信息可用于将清单与计算机上使用的驱动器匹配，或验证特定设备是否在给定时间在使用。如图 13.10 所示，USB Historian\
  \ 提供此类数据，如系统名称、设备名称、序列号、使用时间、设备厂商 ID、设备类型以及其他潜在有用的信息。\n\n\n\n\n关闭系统通常会导致存储在内存中的数据丢失。这意味着浏览器内存缓存中的信息或程序状态等取证数据将会丢失。虽然在取证调查中，获取内存信息并不总是必要的，但在需要时能够获取内存至关重要。\n\
  \n![图 13.10 USB Historian 驱动镜像](img/c13f010.png)\n\n`图 13.10` USB Historian 驱动镜像\n\
  \n这里有很多流行的内存采集工具，具有多种功能，包括以下：\n\n*   `fmem` 和 `LiME`，两者都是 Linux 内内核模块，允许访问物理内存。`fmem`\
  \ 设计用于配合 `dd` 或类似工具使用；`LiME` 则直接将数据复制到指定的路径和文件。\n*   `DumpIt` 是一种 Windows 内存采集工具，简单地将系统物理内存复制到\
  \ `DumpIt` 程序所在的文件夹。这允许轻松地采集到 USB 闪存盘，使其成为取证采集工具包的有用部分。\n*   `The Volatility Framework`\
  \ 支持广泛的操作系统，包括 Windows、Linux 和 macOS，并拥有一系列功能，包括提取加密密钥和口令的工具、用户活动分析以及 rootkit 分析。\n\
  *   `EnCase` 和 `FTK` 也均内置了内存采集和分析功能。\n\n### 使用核心转储和休眠文件\n\n除了内存镜像外，核心转储（core dumps）和崩溃转储（crash\
  \ dump）文件可以为刑事和恶意软件调查提供有用的取证信息。由于它们包含了活动内存的内容，它们可能包含在系统硬盘上无法访问的数据，例如内存驻加密密钥、仅在内存中运行的恶意软件以及通常不存储在磁盘上的其他项目。\n\
  \n可以通过检查 `控制面板` ➢ `系统和安全` ➢ `系统` ➢ `高级系统设置` ➢ 启动和恢复` ➢ `设置` 下的设置找到 Windows 崩溃转储文件。通常，转储文件位于系统根目录：`%SystemRoot%\\\
  MEMORY.DMP`。可以使用 `WinDbg` 分析 Windows 内存转储；但 CySA+ 考试不需要分析 Windows 内核转储。\n\n### 移动设备的采集\n\
  \n移动设备取证采集通常从禁用设备的网络连接开始，然后通过禁用密码和屏幕锁定功能来确保可以访问设备。完成这些操作后，将对 SIM 卡、内存卡和设备备份进行物理采集。最后，对设备进行镜像，尽管如果不知道密码或设备被锁定，许多设备可能无法进行镜像。\n\
  \n从移动设备获取数据有四种主要模式：\n\n*   `物理采集`（Physical）：通过采集 SIM 卡、内存卡或备份实现\n*   `逻辑采集`（Logical）：通常需要取证工具创建逻辑存储卷的镜像\n\
  *   `手动访问`（Manual access）：涉及查看已开启且解锁的手机内容，并对发现的内容拍照并做笔记\n*   `文件系统采集`（Filesystem）：可以提供已删除文件以及现有文件和目录的详细信息\n\
  \n## 取证调查：示例\n\n在本节中，你将学习使用 `FTK` 进行取证分析的基础知识。由于我们已经讨论过镜像，我们将从一个之前获取的取证镜像开始，并执行分析，包括以下内容：\n\
  \n*   将数据导入 `FTK`，包括索引和案件管理\n*   数据泄露的证据\n*   与第三方就文件进行的电子邮件通信\n*   指向反取证活动的网络浏览器信息\n\
  *   应用程序安装的证据\n*   文件系统更改的证据，包括重命名文件\n\n请记住，对系统的完整取证检查可能涉及的任务比这里列出的更多，而且调查的范围和方向将有助于确定这些任务。在探索系统镜像时，你还可能遇到额外的线索，引导你向取证检查的新方向探索。\n\
  \n### 导入取证镜像\n\n一旦你拿到了取证镜像并复制了一份用于调查，你通常会将其导入到你的取证工具中。图 13.11 显示了在导入镜像时，案件信息是如何捕获的。\n\
  \n![图 13.11 初始案件信息和跟踪](img/c13f011.png)\n\n`图 13.11` 初始案件信息和跟踪\n\n一旦镜像被导入案件并正确记录，就会对镜像进行索引和分析。这包括识别文件类型、搜索空隙（slack\
  \ space）和未分配空间、建立文件时间索引以及其他分析项目。这可能需要一些时间，特别是对于大容量硬盘。图 13.12 显示了该案件所使用的取证镜像在索引过程中的状态。\n\
  \n![图 13.12 索引过程部分中的案件信息和跟踪](img/c13f012.png)\n\n`图 13.12` 索引过程部分中的案件信息和跟踪\n\n索引完成后，你现在可以开始探索取证镜像。`FTK`\
  \ 提供了一系列带有常见证据类别的标签页，包括电子邮件、图形、视频、互联网/聊天、书签等。大多数调查人员会花费一些时间来确保在此阶段记录操作系统、时区和其他计算机信息（例如系统中有哪些用户拥有账户）。\n\
  \n### 分析镜像\n\n由于这是一个数据泄露案，浏览器历史记录和电子邮件可能是关注重点。图 13.13 显示了如何通过 `FTK` 读取电子邮件。我们可以看到一封已“成功安全加密”的邮件。其他邮件还提到了\
  \ USB 设备，那个间谍如果线人能交付存储设备将会非常高兴。这为进一步调查提供了另一个线索。\n\n![图 13.13 电子邮件提取](img/c13f013.png)\n\
  \n`图 13.13` 电子邮件提取\n\n搜索浏览器历史记录提供了更多关于线人行为的信息。`Chrome` 的历史记录文件包含了对反取证技术的搜索，以及对 `http://forensicswiki.org`\
  \ 反取证页面的访问，如图 13.14\n\n`图 13.14` 网络搜索历史记录\n\n![图 13.15 带时间戳的 iCloud 设置日志](img/c13f015.png)\n\
  \n\n\n\n\n# 图 13.15 带有时间戳的 iCloud 设置日志\n\n![images/c13f016.png)\n\n# 图 13.16 通过索引搜索功能的\
  \ CCleaner 遗留数据\n\n在我们案件中举报人的时间线最后，创建并打印了一封辞职信。可以通过系统的事件时间线轻松找到它，或者作为手动文件审查的一部分，通过索引文件列表搜索\
  \ Microsoft Office 文档来找到，如图 13.17 和图 13.18 所示。\n\n![images/c13f017.png)\n\n# 图 13.17\
  \ 文档类型排序\n\n![images/c13f018.png)\n\n# 图 13.18 根据文档类型找到的辞职信。 来源：Condé Nast [www.wired.com/images_blogs/threatlevel/2012/03/celiginvestigation.pdf](http://www.wired.com/images_blogs/threatlevel/2012/03/celiginvestigation.pdf)\
  \ / 最后访问于 2023 年 2 月 11 日。\n\n## 报告\n\n取证调查的最后阶段是准备和提交报告。报告应包含三个主要部分：调查的目标和范围；取证活动的目标（包括所有系统、设备和介质）；以及发现和结果的完整列表。\n\
  \n### 调查目标\n\n报告的这一部分应包含调查目标，包括取证活动的初始范围声明。此部分通常还会包含关于请求调查的人或组织的信息。调查目标声明的示例是：“人力资源总监\
  \ John Smith 请求我们检查 Alice Potter 的工作站、电子邮件以及她管理的系统，以确保最近泄露给竞争对手的数据没有从她的电子邮件账户或工作站发送。”\n\
  \n### 目标\n\n你创建的报告应包含所有捕获并分析的设备、系统和介质列表。如果你使用了跟踪记录和监管链表，则所有目标都应列在其中。记录系统或设备时使用的相同详细程度也应适用于此列表。一个示例条目可能如下：\n\
  \n> Alice Potter 的工作站，内部库存号 6108，联想 W540 笔记本电脑，配有三星 SSD 序列号为 S12KMFBD644850，物品编号\
  \ 344\n\n如果检查了大量的设备或系统，目标的完整列表通常会移动到附录，而审查内容的列表将列出系统、应用程序、设备和其他介质的高级概述，并引用附录以获取完整细节。\n\
  \n### 发现与分析\n\n发现结果是文档中最关键的部分，应该列出发现了什么、如何发现的以及为什么这些很重要。在关于 Facebook 所有权的合同争议中进行的\
  \ Stroz Friedberg 取证调查为取证结果中所需的细节提供了一个示例。虽然报告现在已经过期了，但许多相同的取证产物和概念仍然出现——尽管软盘已被闪存媒体和云存储所取代！\n\
  \n## 根原因分析\n\n`root cause analysis`（`RCA`）过程用于识别问题、事件或故障发生的原因。执行根原因分析是为了让组织了解他们需要关注什么以防止未来问题，并确保当前问题再次发生。根原因分析程序因组织而异，但通常涉及以下步骤：\n\
  \n* 定义事件或故障\n* 识别原因或影响因素\n* 映射识别出的事件\n* 实现解决方案或修复\n* 验证修复的有效性\n* 报告\n\n### 教训\n\n\
  一旦事件响应完成，事后活动的最后阶段是`教训`。这些是从事件中获得的体会，包括改进机会以及应该实施的新控制或实践。\n\n\n\n\n\n# 描述事件发生后的活动。\n\
  \n解释取证分析如何以及为何作为事件处理的一部分。解释根原因分析和教训总结、它们发生的时间，以及它们通常包含哪些信息。\n\n## 实验练习\n\n### 活动\
  \ 13.1：创建磁盘镜像\n\n在本次练习中，你将使用 `dd` 创建磁盘镜像，然后验证镜像的校验和。\n\n#### 第一部分：启动 Kali Linux\
  \ 系统并挂载驱动器\n\n1. 启动你的 Kali Linux 虚拟机。\n2. 选择一个格式化为 `FAT32` 的 USB 闪盘作为本次练习的镜像对象。较小的磁盘镜像速度更快，且你应该确保镜像的磁盘空间小于你\
  \ Kali Linux 系统可用空间。\n3. 从运行中的 Kali 虚拟机的“设备”菜单中，选择 `USB`，然后选择你插入的驱动器。该设备现在应该出现在\
  \ Kali Linux 桌面上。\n4. 验证你是否从命令行导航到驱动器。打开终端窗口，然后导航到 `/dev/disk/by-label`，确保你看到已挂载的闪存盘的名称。\n\
  \n#### 第二部分：克隆驱动器\n\n1. 在终端窗口中运行以下命令，为你的卷创建一个临时工作目录：\n   ```\n   mkdir ~/tmp\n \
  \  ```\n   此命令将在你的 `home` 目录下创建一个名为 `tmp` 的目录。\n2. 在你的 `home` 目录下为你打算克隆的卷创建 MD5\
  \ 校验和：\n   ```\n   md5sum /dev/disk/by-label/[label of your drive]> ~/exercise7_1_original.md5\n\
  \   ```\n3. 克隆卷或磁盘：\n   ```\n   dd if=/dev/disk/by-label/[label of your drive] of=~/tmp/exercise7_1_disk.img\
