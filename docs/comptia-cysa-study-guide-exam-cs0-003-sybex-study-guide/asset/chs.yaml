  ### 活动 10.3：法律保留与保护\n\n在此练习中，你将为法律保留做准备。\n\n1. 识别一种保护方法。\n2. 他们需要什么？\n3. 什么是法律，或规划。\n\
  4. 考虑以下内容：\n    * 它将变成什么？\n    * 它可能是什么？\n    * 可能产生哪些担忧？\n    * 会产生什么影响？\n    *\
  \ 可能产生什么费用？\n5. 什么能让恢复正常？\n\n## 复习题\n\n1. Susan 需要跟踪已获取的证据。她需要什么文档？\n    * 取证哈希值\
  \ (Forensic hashes)\n    * 法律保留 (Legal hold)\n    * 监管链 (Chain of custody)\n   \
  \ * IoC 评分\n\n2. Hui 遵守法律保留，但知道她的组织在 45 天后会清除日志。她应该怎么做？\n    * 通知法律顾问。\n    * 删除日志。\n\
  \    * 识别一种保护方法。\n    * 不做任何更改。\n\n3. Juan 想要验证他已取证镜像的驱动器的完整性。他应该选择哪个选项？\n    *\
  \ 将原始驱动器的哈希值与驱动镜像进行比较。\n    * 将原始驱动器在磁盘上的文件大小与驱动镜像占用的空间进行比较。\n    * 将厂商驱动器大小列表与驱动镜像占用的空间进行比较。\n\
  \    * 使用 PGP 加密驱动和镜像并确保两个版本匹配。\n\n4. Kathleen 想要确定她看到的流量对于她的网络来说是否异常。以下哪个选项最有助于判断流量水平对于正常周期间的该时间段是否是不典型的？\n\
  \    * 启发式算法 (Heuristics)\n    * 基准线 (Baselines)\n    * 协议分析 (Protocol analysis)\n\
  \    * 网络流日志 (Network flow logs)\n\n5. Renee 想要采用开源的 IoC 馈。在采用时 Renee 最可能需要解决什么问题？\n\
  \    * IoC 馈的成本\n    * 馈的质量\n    * 馈的更新频率\n    * 馈的详尽程度\n\n6. Chris 想要使用主动监控方法来测试他的网络。以下哪些技术是恰当的？\n\
  \    * 收集 NetFlow 数据\n    * 使用协议分析器\n    *  ping 远程系统\n    * 启用 SNMP\n\n7. 下列哪项不是\
  \ IoC 中常见的发现信息？\n    * IP 地址\n    * 域名\n    * 系统镜像\n    * 基于行为的信息\n\n8. Cameron\
  \ 想要能够检测针对其 Web 服务器的拒绝服务攻击。他应该避免使用哪个工具？\n    * 日志分析\n    * 流监控\n\n\n\n\n\n### 3.\
  \ iPerf\n\n### 4. IPS\n\n9. Sameer 发现日志信息显示，他认为是一个恶意的进程在 `Linux` 系统上每天在同一时间启动。他应该从何处开始寻找此类问题？\n\
  1. 他应该检查系统日志。\n2. 他应该检查 `Task Scheduler`（任务计划程序）。\n3. 他应该检查 `cron jobs`（定时任务）。\n\
  4. 他应该检查用户目录。\n\n10. Jim 使用 `IoC` 馈来帮助检测针对其组织的新攻击。如果他的安全监控系统标记了 `IoC` 匹配，他首先应该做什么？\n\
  1. 关闭触发告警的系统\n2. 审查告警以确定其发生原因\n3. 检查网络日志以识别远程攻击者\n4. 运行端口扫描以确定系统是否被入侵\n\n11. Mark\
  \ 在监控其 Web 服务器集群的网络流量时，发现流量大幅增加。他检查了入站流量的源地址，发现流量来自世界各地的不同系统。如果他认为这可能是一次攻击，他应该将其识别为什么？\n\
  1. 拒绝服务攻击\n2. 分布式网络扫描\n3. 基于 DNS 的攻击\n4. 分布式拒绝服务攻击\n\n12. Valentine 想检查系统是否存在未经授权的访问。哪两种类型的日志最可能包含此类信息？\n\
  1. 身份验证日志和用户创建日志\n2. 系统日志和应用程序日志\n3. 身份验证日志和应用程序日志\n4. 系统日志和身份验证日志\n\n13. Sayed\
  \ 注意到远程系统多次使用相同的管理员用户 ID 但不同的密码尝试登录他所负责的系统。Sayed 最可能发现了什么？\n1. 一个忘记了密码的用户\n2. 一个损坏的应用程序\n\
  3. 暴力破解攻击\n4. 配置错误的服务\n\n14. 当 Susan 通过网络流监控路由器时，她看到网络流量水平突然降至零，流量图显示为一条直线。这可能发生了什么？\n\
  1. 采样率设置错误。\n2. 路由器正在使用 `SNMP`。\n3. 被监控的链路故障。\n4. 正在发生 `DDoS` 攻击。\n\n15. Leo 想要监控他的应用程序的常见问题。以下哪项不是监控应用程序问题的典型方法？\n\
  1. 上/下日志记录 (Up/down logging)\n2. 系统日志记录\n3. 性能日志记录\n4. 事务日志记录\n\n16. Greg 注意到他负责的一个\
  \ `Linux` 服务器上的用户账户在几秒钟内通过 `SSH` 连接了 10 台机器。哪种类型的 `IoC` 最符合这种行为？\n1. 类似僵尸的行为\n2.\
  \ 端口扫描\n3. 拒绝服务\n4. 权限提升\n\n17. Arun 想要监控异常的数据库使用情况。以下哪项最可能是恶意攻击者的迹象？\n1. 数据库缓存命中次数增加\n\
  2. 往数据库的网络流量减少\n3. 数据库磁盘读取增加\n4. 数据库大小减小\n\n18. Valerie 担心攻击者可能已经访问了她数据中心内的某个系统。以下哪项不是她应该监控的常见网络类\
  \ `IoC`？\n1. 访问往非预期目的地的流量\n2. 出站流量的异常增大\n3. 系统内存消耗的增加\n4. 在异常时间的出站流量\n\n20. Alex\
  \ 注意到他的 `Windows` 服务器主磁盘正在迅速填满。他应该做什么来确定是什么填满了驱动器？\n1. 检查文件系统日志。\n2. 检查安全日志。\n3.\
  \ 搜索大文件和目录。\n4. 搜索文件更改。\n\n20. Joseph 希望在他维护的系统上的用户行为偏离正常范围时收到通知。他使用工具捕获并分析一周的用户行为，并据此判断是否发生了异常行为。这种做法称为什么？\n\
  1. 模式匹配 (Pattern matching)\n2. 基准建立 (Baselining)\n3. 指纹识别 (Fingerprinting)\n4. 用户建模\
  \ (User modeling)\n\n# 第 11 章：抑制、根除与恢复\n\n第 9 章，“构建应急响应计划”提供了根据美国国家标准技术研究院（NIST）倡导的过程构建和实施网络安全事件响应计划所需步骤的概述。在《计算机安全事件处理指南》（Computer\
  \ Security Incident Handling Guide）中，NIST 概述了图 11.1 所示的四阶段事件响应过程。\n\n![图 11.1 事件响应过程\
  \ ¶ 来源：NIST SP 800-61：计算机安全事件处理指南 https://nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf\
  \ / 最后访问日期：2023 年 2 月 15 日。](img/c11f001.png)\n\n图 11.1 事件响应过程 ¶ 来源：NIST SP 800-61：计算机安全事件处理指南\
  \ [`nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf`](https://nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf)\
  \ / 最后访问日期：2023 年 2 月 15 日。\n\n第 9 章 的剩余部分提供了事件响应中“准备”和“事件后活动”阶段的概述。第 10 章，“事件检测与分析”涵盖了检测与分析阶段的细节，包括网络信息的来源。本章将探讨事件响应的抑制、根除与恢复阶段。\n\
  \n## 抑制损害\n\n事件响应的抑制、根除与恢复阶段使组织从检测与分析阶段主要的被动式事件响应活动转向更主动的任务。一旦组织意识到网络安全事件正在发生，它就会采取行动，以度地减少事件造成的损害并尽快恢复正常运行。\n\
  \n*抑制* 是该阶段的第一项活动，并且应该在分析人员确定事件正在发生后尽快开始。抑制活动旨在限制事件的范围和影响。事件的范围是指涉及的系统或个人数量——你可以将抑制理解为在现有事件周围建立一个围栏，防止其扩散到其他地方。事件的影响是指其对组织产生的结果。通过抑制事件，你限制了该事件影响\
  \ Magnitude。\n\n在不同类型安全事件的背景下，抑制的含义完全不同。例如，如果组织正面临信用卡处理系统的数据正被积极外泄，应急响应人员可能会通过断开该系统与网络的连接来抑制损害，从而防止攻击者继续外泄信息。另一方面，如果组织正遭受针对其网站的拒绝服务攻击，断开网络连接只会帮助攻击者实现其目标。在这种情况下，抑制可能包括在上\
  \ Internet 连接上放置过滤器，阻止所有来自攻击网络的所有入站流量，或阻止带有特定特征的 Web 请求。\n\n\n\n\n遏制活动通常并非完美，往往会造成某些干扰正常业务运行的附带损害。考虑前一段中描述的两个例子：将信用卡处理系统从网络断开可能会导致交易停止，造成可能重大的业务损失。同样，阻止大范围的入站网络流量可能会某些合法用户无法访问网站。事件响应人员在采取遏制策略时，必须理解其行为的潜在副作用，并将其与对组织的更大益处进行权衡。\n\
  \n## 分段 (Segmentation)\n\n正如你在第 1 章中学习到的“今日网络安全分析师”，网络安全分析师经常使用`network segmentation`（网络分段）作为一种主动策略，防止未来安全事件的扩散。例如，图\
  \ 11.2 所示的网络旨在将不同类型的用户隔离开，并与关键系统隔离开。能够访问访客网络的攻击者在不跨越网络防火墙的情况下，无法与属于员工或数据中心的系统进行交互。\n\
  \n`network segmentation` 被用作信息安全深度防御方法中的主动控制手段。除了作为主动控制外，`network segmentation`\
  \ 可能在事件响应中起着至关重要的作用。在事件的早期，响应人员可能意识到部分系统已被入侵，但希望在确定其他适当响应之前，继续观察这些系统上的活动。然而，他们无疑希望保护网络上的其他系统免受这些可能受损的系统的影响。\n\
  \n图 11.3 展示了机构可能在事件响应过程中应用`network segmentation`的示例。网络安全分析师怀疑数据中心内的几个系统已被入侵，并建立了一个独立的虚拟局域网（`VLAN`）来遏制这些系统。该`VLAN`被称为隔离网络，与数据中心网络的其余部分隔离，并受严格防火墙规则控制。将系统放在此网段上提供了某种程度的隔离，防止它们破坏其他段上的系统，同时允许继续进行实地分析。![FIGURE\
  \ 11.2 主动网络分段](img/c11f002.png)\n\n图 11.2 主动网络分段\n\n![FIGURE 11.3 用于事件响应的网络分段](img/c11f003.png)\n\
  \n图 11.3 用于事件响应的网络分段\n\n## 隔离 (Isolation)\n\n虽然`segmentation`确实限制了攻击者对网络其余部分的访问，但它有时还不足以达到遏制目标。网络安全分析师可能会决定使用更强的`isolation`（隔离）措施来切断攻击。在网络安全事件响应过程中可以使用两种主要的隔离技术：隔离受影响系统和隔离攻击者。\n\
  \n### 隔离受影响系统\n\n隔离受影响系统简单来说是将分段提升到另一个水平。受影响系统与网络的其余部分完全断开，尽管它们仍然可以通过互联网相互以及与攻击者通信。图\
  \ 11.4 展示了从分段策略中提取隔离`VLAN`并将其转换为隔离的示例。注意图 11.4 展示了从分段策略中提取隔离`VLAN`并将其转换为隔离的示例。图\
  \ 11.3 和图 11.4 展示了从分段策略中提取隔离`VLAN`并将其转换为隔离的示例。\n\n![FIGURE 11.4 用于事件响应的网络隔离](img/c11f004.png)\n\
  \n图 11.4 用于事件响应的网络隔离\n\n### 隔离攻击者\n\n隔离攻击者是隔离策略中一种有趣的变体，取决于用于监控活动的`sandbox`（沙箱）系统的使用。有关蜜蜜罐的更多信息，请参阅第\
  \ 1 章。\n\n## 移除 (Removal)\n\n从网络中移除受损系统是网络安全分析师工具箱中最强大的遏制技术。如图 11.5 所示，移除与分段和隔离的区别在于，受影响的系统与网络完全断开。移除的具体细节取决于事件的情况以及事件响应人员的专业判断。\n\
  \n![FIGURE 11.5 用于事件响应的网络移除](img/c11f005.png)\n\n图 11.5 用于事件响应的网络移除\n\n## 证据获取与处理\
  \ (Evidence Acquisition and Handling)\n\n事件响应遏制阶段的首要目标是限制对组织及其资源的损害。尽管该目标可能优先于其他目标，但响应人员可能仍然对在遏制过程中收集证据感兴趣。这些证据对于内部目的对事件进行持续分析至关重要，或者可以在针对攻击者的法律诉讼程序中使用。\n\
  \n如果事件处理人员怀疑调查期间收集的证据可能用于法庭，他们应该在调查过程中特别注意保护和记录证据。NIST 建议调查人员维护详细的证据日志，包含以下内容：\n\
  \n- 识别信息（例如计算机的地点、序列号、型号、主机名、MAC 地址和 IP 地址）\n- 每位收集或处理证据的每个人的姓名、职位和电话号码\n- 每次证据处理发生的时间和日期（包括时区）\n\
  - 证据存储的位置\n\n\n\n\n识别网络安全事件的责任者是一项复杂的任务，通常会导致调查人员进入一条跨越国界、经过多个定向主机的复杂路径。尽管你可能会在日志中找到存储的\
  \ IP 地址记录，但这些记录极有可能并不对应攻击者的实际 IP 地址。除了最外级的业余爱好者，任何攻击者都会通过一系列被破坏的系统中继其通信，这使得追踪其真实源头变得困难。\n\
  \n在沿着调查攻击源头的路径进行之前，重要的是问问自己为什么要进行调查。揭露`谁`攻击了你是否真的具有业务价值，还是将你的时间花在遏制、根除和恢复活动上更有意义？NIST\
  \ 的《计算机安全事件处理指南》直接应对了这一问题，认为“识别攻击源主机可能是一个耗时且徒劳的过程，可能会阻止团队实现其首要目标——将对业务的影响降至最低。”\n\
  \n执法人员在处理这种情况时，其目标可能与受攻击组织的网络安全分析师的目标不同。毕竟，执法机构的核心职责之一是识别犯罪分子、将其逮捕并将其诉至法庭。这一责任可能与遏制、根除和恢复的核心网络安全目标发生冲突。网络安全人员和业务领导者在决定是否让执法机构参与事件调查，以及他们对正在进行的调查提供何种程度的时，应当考虑这种冲突。\n\
  \n请参见第 4 章“威胁情报”，获取更多关于识别威胁行为者的信息。\n\n## 事件根除与恢复\n\n一旦网络安全团队成功遏制了事件，就是进入响应的`根除`（eradication）阶段了。根除的主要目的是移除组织网络上可能留下的任何事件痕迹。这包括移除网络中的任何恶意代码、对受破坏的介质进行清理以及保护受破坏的用户账户。\n\
  \n事件响应的`恢复`（recovery）阶段侧重于恢复正常能力和服务。它包括重建资源以及纠正可能导致攻击的安全控制缺陷。这可能包括重建和修补系统、重新配置防火墙、更新恶意软件签名以及类似的活动。恢复的目标不仅是重建组织的网络，而且是以一种能够减少未来攻击成功概率的方式来进行。\n\
  \n在根除和恢复期间，网络安全分析师应对对事件的根源有清晰的理解。这对于实施安全的恢复以纠正导致原始攻击的控制缺陷至关重要。毕竟，如果你从根本上不理解攻击者是如何突破你的安全控制的，就很难纠正这些控制以防止攻击再次发生！理解攻击的根源与识别攻击者是完全不同的活动。这一过程也被称为实施`补偿性控制`（compensating\
  \ controls），因为这些控制补偿了原始的安全缺陷。根源评估是事件恢复的关键组成部分，而前面提到的，识别攻击者可能是一种代价昂贵的精力分散。\n\n根源分析还帮助组织识别其运行的可能可能具有相同漏洞的其他系统。例如，如果攻击者破坏了一个\
  \ Cisco 路由器，且根源分析显示该设备的配置中存在错误，管理员可能会在他们控制的其他路由器上纠正该错误，以防止类似的攻击破坏这些设备。\n\n### 修复与重装\n\
  \n在事件期间，攻击者可能通过恶意软件、Web 应用程序攻击或其他漏洞破坏一个或多个系统。一旦攻击者获得了系统的控制权，安全专业人员应认为该系统已完全被破坏且不可信。仅仅纠正安全问题并继续下去是不安全的，因为攻击者可能在受破坏的系统中仍留有未检测到的立足点。相反，应该重建该系统，是从从头开始，还是使用已知安全状态的系统镜像或备份。\n\
  \n重建和/或恢复系统应始终考虑到事件的根源分析。如果系统是因为包含安全漏洞而被破坏的（而不是通过使用受破坏的用户账户），那么该系统的备份和镜像可能具有相同的漏洞。即使是从头开始重建系统，也可能重新引入先前的漏洞，导致系统易受到相同的攻击。在恢复阶段，管理员应确保重建或恢复的系统已修复以解决已知的安全问题。\n\
  \n修复活动可能还需要对组织的安全控制进行更广泛的改进。你可能需要纠正防火墙规则、添加安全技术或实施其他纠正措施来修复缺陷。\n\n### 系统与应用程序的补丁\n\
  \n在事件期间，攻击者可能通过恶意软件或其他漏洞破坏多个系统。在事件恢复期间，网络安全分析师将修复参与攻击的操作系统和应用程序。这也是审查企业所有系统安全补丁状态的好时机，解决隐藏在后台的其他安全问题。\n\
  \n网络安全分析师应首先将精力放在直接参与的系统上，然后向外扩展，处理间接相关的系统，最后才是完全未参与的系统。图 11.6 显示分析师在恢复阶段修复系统和应用程序时应采取的分阶段方法。\n\
  \n![图 11.6 补丁优先级](img/c11f006.png)\n\n**图 11.6** 补丁优先级\n\n### 清理与安全处置\n\n在恢复期间，网络安全分析师可能需要对事件期间损坏的系统介质进行处置或重复利用。在这种情况下，应特别小心，确保存储在介质上的敏感信息不会泄露。响应人员不希望一个事件的恢复工作导致第二个事件！\n\
  \n通常情况下，含有敏感信息的介质的安全处置有三种选择：清除、净化和销毁。NIST 在 NIST SP 800-88《介质清理指南》中定义了这三种清理活动：\n\
  \n*   `清除`（clear）应用逻辑技术对所有用户可访问存储位置的数据进行清理，以防止简单的非侵入数据恢复技术；这通常通过对存储设备的标准`Read` 和`Write`\
  \ 命令应用，例如通过写入新值或使用菜单选项将设备重置为出厂状态（当不支持重写时）。\n\n*   `净化`（purge）应用物理或逻辑技术，使目标数据无法通过先进的实验室技术恢复。净化活动的示例包括通过使用专门的、标准的设备命令执行的覆盖、块擦除和加密删除活动。`消磁`（Dgaussing）是另一种净化形式，利用极强磁场干扰存储在设备上的数据。\n\
  \n\n\n\n\n*   `Destroy`（破坏）使得目标数据无法通过先进的实验室技术进行恢复，并导致后续无法将该介质用于存储。破坏技术包括粉碎、雾化、熔化和焚烧。\n\
  \n这三个级的数据处置方法按有效性以及难度和成本的顺序列出。例如，物理焚烧硬盘消除了数据恢复的所有可能，但需要使用焚烧炉，并使硬盘在未来无法再次使用。\n\n\
  图 11.7 显示了一个流程图，旨在帮助安全决策者选择合适的信息破坏技术，并可指导事件恢复工作。注意，该流程图在尝试清除、净化或破坏数据之后包含一个 `Validation`（验证）阶段。`Validation`\
  \ 确保了介质清理是成功的，并且在清理后的介质上不存在残留数据。\n\n![FIGURE 11.7 Sanitization and disposition decision\
  \ flow ¶ Source: NIST SP 800-61: Computer Security Incident Handling Guide https://nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf\
  \ / last accessed February 15, 2023.](img/c11f0007.png)\n\nFIGURE 11.7 清洁与处置决策流\
  \ ¶ 来源: NIST SP 800-61：计算机安全事件处理指南 [`nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf`](https://nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r2.pdf)\
  \ / 最后访问：2023 年 2 月 15 日\n\n## 验证数据完整性\n\n在结束恢复工作之前，事件响应人员应花时间验证所实施的恢复措施是否成功。此类验证的确切性质取决于事件的技术状况和组织的基础。这些验证工作应始终包含以下四项活动：\n\
  \n*   **验证组织内每个系统和应用程序上仅存在已授权的用户账户。** 在许多情况下，组织已经进行了定期的账户审查，以验证每个账户的授权情况。在恢复验证工作期间应使用此过程。\n\
  *   **验证分配给每个账户的权限已正确恢复。** 在账户审查期间，响应人员还应验证账户是否具有违反最小权限原则的额外权限。这对于普通用户账户、管理员账户和服务级账户均适用。\n\
  *   **验证系统和数据的完整性。** 确认涉及事件的系统已正确配置以符合安全标准，并且没有对设置或数据进行未经授权的更改。你可能需要从事件发生之前的备份中恢复系统。\n\
  *   **验证所有系统均正常记录日志。** 每个系统和应用程序都应配置为按照与组织日志策略一致的层级记录安全相关信息。这些日志记录应发送到中央日志存储库中，以供归档使用。验证阶段应包含验证这些日志已正确配置并被存储库接收。\n\
  *   **对所有系统进行漏洞扫描。** 每个系统和应用程序都应配置为按照与组织日志策略一致的层级记录安全相关信息。这些日志记录应发送到中央日志存储库中，以供归档使用。验证阶段应包含验证这些日志已正确配置并被存储库接收。\n\
  \n## 总结响应\n\n在完成遏制、根除和恢复的立即行动后，CSIRT（计算机安全响应小组）非常想认为他们的工作已经完成。然而，在团队完成以下工作之前，事件响应并未完全结束：\n\
  \n### 管理变更控制流程\n\n在遏制、根除和恢复过程中，响应人员可能绕过了组织的正常变更流程。这些流程提供了重要的控制和记录。一旦响应工作的紧迫性过去，响应人员应回到这些流程，并记录事件期间进行的所有更改。\n\
  \n### 进行教训总结\n\n在每次网络安全事件结束后，所有参与响应的人都应该参加教训总结会议旨在发现有关响应的关键信息。该会议还突出了响应计划中的潜在缺陷。有关事件后教训总结的更多信息，请参见第\
  \ 9 章的“教训回顾”。\n\n在事件调查期间，团队可能会根据攻击者使用的工具、技术和策略遇到新的“入侵指标”（IOC）。作为教训回顾的一部分，团队应明确识别任何新的\
  \ `IOC`，并建议更新组织的安全计划以包含这些 `IOC`。这将减少未来类似事件逃避检测的概率。\n\n### 编写最终报告\n\n每个启动 CSIRT 的事件都应以正式的书面报告结束，以记录事件供备查。这有几个重要目的。首先，它创建了事件的机构记忆，在开发新的安全控制和培训新的安全团队成员时有用。其次，如果事件导致法律诉讼，它可以作为事件的重要记录。最后，编写书面报告的行为有助于识别响应过程中之前未被检测到的缺陷，这些缺陷可以通过教训总结过程进行反馈。\n\
  \nCSIRT 在事件后报告中涵盖的重要要素包括：\n\n*   事件和响应工作的时间轴\n*   事件的根本原因\n*   事件响应过程中收集的证据的位置和描述\n\
  *   响应人员为遏制、根除和恢复事件所采取的特定行动，包括这些决策的理由\n*   事件对组织及其利益相关者的影响估算\n*   恢复后验证工作的结果\n*\
  \   教训回顾期间识别的问题记录\n\n### 证据留存\n\n\n\n\n\n在事件结束后，团队应对事件发生期间收集的证据的处置方式做出正式决定。如果证据不再需要，则应根据组织的数据处置程序进行销毁。如果需要保留证据以备后用，则应将其放在安全的证据库中，并维护监管链（chain\
  \ of custody）。\n\n保留证据的决定取决于多个因素，包括事件是否可能导致刑事或民事诉讼，以及事件对组织的影响。这一主题应在组织的事件响应程序中直接解决。\n\
  \n## 总结\n\n在识别出正在发生的安全事件后，`CSIRT` 成员应立即进入事件响应的遏制、根除和恢复阶段。该阶段的首要任务是遏制安全事件造成的损害，以降低其对组织的影响。一旦事件得到遏制，响应人员应采取行动消除事件影响并恢复正常运行。一旦完成应急响应工作，`CSIRT`\
  \ 应该进入事后后阶段，开展教训总结会议，并编写一份总结事件响应过程的书面报告。\n\n## 考试要点\n\n### 解释遏制活动的目的\n在识别出正在发生的潜在事件后，响应人员应立即采取行动遏制损害。他们应该根据事件的性质及其对组织的影响选择适当的遏制策略。潜在的遏制活动包括网络分段、隔离和移除受影响的系统。\n\
  \n### 了解响应期间收集证据的重要性\n网络安全事件的大多数证据具有挥发性，如果不在响应期间进行收集，随后可能无法获取。`CSIRT` 成员必须确定证据收集在遏制、根除和恢复阶段的优先级，然后确保妥善处理任何稍后可用于法律诉讼的收集证据，包括妥善保存证据、记录监管链以及验证数据完整性。\n\
  \n### 解释为什么识别攻击者可能会浪费宝贵资源\n识别安全事件后后者的大部分努力都是徒劳的，在消耗了大量资源后最终会走入死胡同。事件响应人员的关注重点应该是保护组织的业务利益。执法官员有不同的优先级，响应人员应该意识到这些目标可能存在冲突。\n\
  \n### 解释根除和恢复的目的\n在遏制损害后，响应人员应转到根除和恢复活动，旨在从组织的网络中删除事件的所有痕迹，并尽快恢复正常运行。这应该包括验证工作，以确保在关闭事件之前安全控制措施已妥善实施。\n\
  \n### 定义事后活动的目的\n在网络安全响应工作结束，`CSIRT` 成员应举行正式的教训总结会议，回顾整个事件响应过程，并根据需要对组织的事件响应计划提出建议。任何此类更改都应通过组织的变更控制流程进行。团队还应完成一份正式的事件总结报告，作为记录事件以备后世参考。在此过程中的其他考虑因素包括证据保留、入侵指示（`IoC`）的生成以及持续监控。\n\
  \n## 实验练习\n\n### 活动 11.1：事件遏制方案\n为以下每个图表标注图中所示的事件遏制活动类型。\n\n![](img/c11uf001.png)\n\
