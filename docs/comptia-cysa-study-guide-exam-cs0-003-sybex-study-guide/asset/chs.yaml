  \ IP Scanner`\n2. `Recon-ng`\n3. `Maltego`\n4. `nmap`\n\n18. Sally 想要使用 `nmap` 确定运行的是什么操作系统。以下哪项不是\
  \ `nmap` 使用的数据点？\n\n1. `TCP sequences`\n2. `TCP timestamps`\n3. `TCP OS header`\n\
  4. `TCP options`\n\n19. Chris 想要执行网络发现。如果依赖端口扫描器，他会遇到什么限制？\n\n1. 端口扫描器无法检测漏洞。\n\
  2. 端口扫描器无法确定给定端口运行着什么服务。\n3. 防火墙可以阻止端口扫描器。\n4. 端口扫描器会导致拒绝服务。\n\n20. Emily 想要使用开源工具收集开源情报并将其集中。以下哪种工具最适合她的工作？\n\
  \n1. `Metasploit Framework`\n2. `Recon-ng`\n3. `nmap`\n4. `Angry IP Scanner`\n\n\
  \n\n\n然而，有两项监管方案明确要求实施漏洞管理计划：支付卡行业数据安全标准（PCI DSS）和联邦信息安全管理法（FISMA）。\n\n## 支付卡行业数据安全标准\
  \ (PCI DSS)\n\nPCI DSS 为处理信用卡交易的商户以及协助商户进行此类交易的服务供应商规定了特定的安全控制措施。该标准包含了被认为是任何标准中对漏洞扫描最具体的要求。\n\
  \nPCI DSS 规定了漏洞扫描的许多细节，包括以下内容：\n\n* 组织必须同时运行内部和外部漏洞扫描。\n* 组织必须至少每三个月（季度）运行一次扫描，并在“发生任何重大变更后”运行扫描。\n\
  * 内部扫描必须由具备资质的人员进行。\n* 组织必须修复任何高风险漏洞并重复扫描以确认漏洞已解决，直到获得“洁净”的扫描报告。\n* 外部扫描必须由 PCI\
  \ SSC 授权的认可扫描供应商（ASV）进行。\n\n用于 PCI DSS 合规性的漏洞扫描是一个蓬勃且竞争激烈的行业，许多网络安全咨询公司专门从事此类扫描。许多组织选择先进行自扫描，以确保在向\
  \ ASV 请求官方扫描之前自己能够获得通过的结果。\n\n## 联邦信息安全管理法 (FISMA)\n\n联邦信息安全管理法（FISMA）要求政府机构以及代表政府机构运行的其他组织遵守一系列安全标准。这些标准要求的特定控制措施取决于政府如何将系统定义为低影响、中等影响或高影响，具体定义见图\
  \ 6.1。有关系统分类的进一步指导，请参阅《联邦信息处理标准 (FIPS) 199：联邦信息和信息系统的安全分类标准》。\n\n![图 6.1 FIPS 199\
  \ 标准 ¶ 来源：FIPS 199 / 美国商务部 / 公有领域](img/c06f001.png)\n\n图 6.1 FIPS 199 标准 ¶ 来源：FIPS\
  \ 199 / 美国商务部 / 公有领域\n\n所有联邦信息系统，无论其影响分类如何，都必须满足 NIST 特别出版物 800-53（《联邦信息系统和组织的安全与隐私控制》）中的漏洞扫描基本要求。这些要求每个受\
  \ FISMA 约束的组织执行以下操作：\n\n1. 监控并扫描系统及托管应用程序中的漏洞，并在发现可能影响系统的新漏洞时进行上报。\n2. 采用漏洞扫描工具和技术，以促进工具之间的互操作性，并通过使用以下标准实现漏洞管理过程的部分自动化：\n\
  \    1. 列举平台、软件缺陷和不当配置\n    2. 格式化检查清单和测试程序\n    3. 衡量漏洞影响\n3. 分析漏洞扫描报告和来自漏洞监控的结果。\n\
  4. 根据组织的风险评估修复合法的漏洞。\n5. 分享从漏洞扫描过程和安全控制评估中获得的信息，帮助消除其他信息系统中的类似漏洞（即系统性缺陷或不足）。\n6.\
  \ 采用漏洞监控工具，其具备随时更新待扫描漏洞的能力。\n\n这些要求为所有联邦信息系统建立了基准。\n\n## 公司政策\n\nPCI DSS 和 FISMA\
  \ 的规定性安全要求涵盖了涉及零售交易处理和运行政府系统的组织，但这两类组织仅占企业的一部分。网络安全专业人士广泛认为，漏洞管理是任何信息安全计划的关键组成部分，正因如此，许多组织在公司政策中强制要求漏洞扫描，即使这一要求并非来自监管法规的要求。\n\
  \n## 行业标准\n\n安全专业人员在为组织创建安全标准时，应当借鉴他人的工作。这些标准包含了控制措施，可以降低漏洞在组织环境中存在的概率，使组织能够更好地检测发生的漏洞，并缓解未检测到的漏洞带来的风险。\n\
  \n### 互联网安全中心 (CIS)\n\n互联网安全中心（CIS）发布了一系列安全基准，这些基准代表了领域专者的共识。这些基准为各种操作系统、应用程序和设备提供了详细的配置说明。\n\
  \n这些行业基准为组织的配置工作提供了良好的起点。从坚实的基础开始可以为定制化的安全标准节省大量工作时间。\n\n### 国际标准化组织 (ISO)\n\n国际标准化组织（ISO）也发布了一系列与信息安全相关的标准。`ISO\
  \ 27001` 建立了信息安全管理标准方法，而 `ISO 27002` 对安全控制的细节进行了详细介绍。这些国际认可的标准在安全领域被广泛使用，组织可能会选择获得\
  \ `ISO 27001` 的合规认证。\n\n### Web 应用安全项目 (OWASP)\n\n安全编码实践的最佳资源之一是 Web 应用安全项目（OWASP）。OWASP\
  \ 是开发者和安全从业人员的广大社区之家，它托管了许多社区开发的标准、指南和最佳实践文档，以及大量的开源工具。OWASP 提供了一个定期更新的重大漏洞和主动控制列表，这不仅可以作为一组实用的最佳实践，也可以作为观察\
  \ Web 应用威胁逐年变化的方式。\n\n最新版本的 OWASP 前十大漏洞列表（2021 年更新）包含以下漏洞：\n\n* 访问控制失效\n* 加密失效\n\
  * 注入\n* 不安全设计\n* 安全配置错误\n* 漏洞和过期组件\n* 身份认证失效\n* 软件和数据完整性失效\n* 安全日志和监控失效\n* 服务器请求伪造\n\
  \n在对 Web 应用进行扫描时，漏洞扫描器通常配置为使用 OWASP 漏洞列表作为核心参考。\n\n\n\n\n\n# 系统是生产系统、测试系统还是开发系统？\n\
  \n组织还使用自动化技术来识别可能被扫描的系统。网络安全人员使用扫描工具在网络中搜索连接的系统（无论它们是之前已知还是未知的），并构建 `asset inventory`（资产清单）。图\
  \ 6.2 显示了使用漏洞扫描器清单功能开发的资产图示例。\n\n![图 6.2 资产图](img/c06f002.png)\n\n`图 6.2` 资产图\n\n\
  管理员随后可以使用有关系统类型及其处理的信息的额外信息来补充此清单。这些信息将有助于判断哪些系统是关键的，哪些是非关键的。资产清单和 `asset criticality`（资产关键性）信息有助于指导有关扫描类型、扫描频率以及管理员在修复扫描检测到的漏洞时应优先考虑的决策。\n\
  \n## 调度扫描\n\n网络安全人员依赖自动化来帮助他们高效、有效的方式履行职责。漏洞扫描工具允许对扫描进行自动化调度，从而减轻管理员的负担。图 6.3 显示了如何在\
  \ Tenable 的 Nessus 产品中配置这些扫描的示例。Nessus 是市场上最早的漏洞扫描器之一，且今天仍被广泛使用。管理员可以设定符合其安全、合规和业务要求的调度表。\n\
  \n![图 6.3 配置 Nessus 扫描](img/c06f003.png)\n\n`图 6.3` 配置 Nessus 扫描\n\n管理员应配置这些扫描，以便在检测到新漏洞时提供自动告警。许多安全团队配置扫描生成扫描结果的自动电子邮件报告，例如\
  \ 图 6.4 所示的报告。\n\n![图 6.4 样本 Nessus 扫描报告](img/c06f004.png)\n\n`图 6.4` 样本 Nessus\
  \ 扫描报告\n\n许多不同因素影响组织决定多久对其系统进行漏洞扫描的频率：\n\n*   组织的 `risk appetite`（风险承受能力）是其对环境中风险的容忍程度。如果一个组织极度规避风险，它可能会选择更频繁地进行扫描，以缩短漏洞产生到被扫描检测之间的时间。\n\
  *   `Regulatory requirements`（监管要求），例如 PCI DSS 或 FISMA，可能会规定漏洞扫描的最低频率。这些要求也可能来自公司政策。\n\
  *   `Performance constraints`（性能限制）可能会限制扫描频率。例如，扫描系统可能每天只能执行特定次数的扫描，组织可能需要调整扫描频率以确保所有扫描成功完成。\n\
  *   `Operations constraints`（运营限制）可能会限制组织在业务高峰期间进行资源密集型漏洞扫描，以避免干扰关键业务流程。\n*   `Licensing\
  \ limitations`（许可限制）可能会限制扫描器消耗的带宽或可同时进行的扫描次数。\n\n网络安全人员在规划漏洞扫描计划时必须平衡这些考虑因素。通常情况下，从小开始并随着时间的推移缓慢扩大漏洞扫描的范围和频率是明智的，以免让扫描基础设施或企业系统不堪重负。\n\
  \n## 主动与被动扫描\n\n大多数漏洞扫描工具执行 `active vulnerability scanning`（主动漏洞扫描），这意味着工具实际上会与扫描的主机交互，以识别开放的服务并检查可能的漏洞。主动扫描确实提供高质量的结果，但这些结果也存在缺点：\n\
  \n*   主动扫描尝试连接网络上的每个设备以寻找开放端口和漏洞应用程序。它具有很强的噪声性，很可能会被扫描系统的管理员发现。在管理员已知扫描的环境中，这可能不是问题，但如果扫描目的是隐蔽的，主动扫描就会有问题。\n\
  *   主动扫描还可能意外利用漏洞并干扰生产系统的运行。虽然主动扫描器通常具有可以使用来尽量减少这种风险的设置，但事实是主动扫描可能会导致生产问题。\n*  \
  \ 如果被防火墙、入侵防御系统、网络分段或其他安全措施阻止，主动扫描可能会完全遗漏某些系统。\n*   `Passive vulnerability scanning`（被动漏洞扫描）采用了一种不同的方法来补充主动扫描。被动扫描器不是探测系统的漏洞，而是监控网络，类似于入侵检测系统使用的技术。但它们寻找的不是入侵尝试，而是寻找过旧系统和应用程序的典型特征，并向管理员报告结果。\n\
  \n被动扫描具有一些非常人的益处，但它们只能检测反映在网络流量中的漏洞。它们不是主动扫描的替代品，但是周期性主动漏洞扫描的强有力补充。\n\n## 配置和执行漏洞扫描\n\
  \n一旦安全人员确定了其漏洞管理计划的基本需求，他们必须配置漏洞管理工具，根据基于基于的扫描规范执行扫描。这些任务包括识别每个扫描的适当范围、配置扫描以满足组织需求以及维护漏洞扫描工具的更新性。\n\
  \n### 确定漏洞扫描范围\n\n漏洞扫描的 `scope`（范围）描述了扫描的程度，包括对以下问题的回答：\n\n*   哪些系统和网络将包含在漏洞扫描中？\n\
  *   将使用哪些技术措施来测试网络上是否存在系统？\n*   对漏洞扫描发现的系统将执行哪些测试？\n\n管理员应首先从宏观上回答这些问题，并确保他们与技术人员和管理层共识，即扫描是适当的且不太可能对业务造成干扰。一旦确定扫描设计良好且可能引起严重问题，他们就可以开始在漏洞管理工具中配置扫描了。\n\
  \n### 配置漏洞扫描\n\n漏洞管理解决方案为管理员提供了配置许多与扫描相关的参数的能力。除了调度自动扫描和生成报告外，管理员还可以自定义扫描器执行的检查类型、提供访问目标服务器的凭据、在目标服务器上安装扫描代理，并从各种网络视角进行扫描。\n\
  \n#### 扫描灵敏度级别\n\n配置漏洞扫描的网络安全人员应特别关注与扫描灵敏度级别相关的配置设置。这些设置决定了扫描器将执行的检查类型，并应进行自定义，以确保扫描在实现目标的同时，度地减少干扰目标环境的可能性。\n\
  \n\n\n\n\n通常，管理员通过从模板开始来创建新的扫描。这可以是由漏洞管理供应商提供并内置于产品中的模板，例如图 6.5 所示的 Nessus 模板，也可以为组织内部使用而开发的自定义模板。当管理员创建自己的扫描配置时，他们应该考虑将常用的配置设置保存到模板中，以便高效地复用工作，在配置未来的扫描时节省时间并减少错误。\n\
  \n![图 6.5 Nessus 扫描模板](img/c06f005.png)\n\n图 6.5 Nessus 扫描模板\n\n管理员还可以通过配置在每次扫描期间运行的特定插件（plug-ins）来提高扫描效率。每个插件都对特定的漏洞进行检查，这些插件通常根据它们涉及的操作系统、应用程序或设备分组成若干族。禁用不必要的插件可以通过跳过不必要的检查来提高扫描速度，并可能减少扫描器检测到的误报结果数量。\n\
  \n例如，不使用 Amazon Linux 操作系统的组织可能选择在扫描模板中禁用所有与 Amazon Linux 相关的检查。图 6.6 显示了在 Nessus\
  \ 中禁用这些插件的示例。\n\n![图 6.6 禁用不使用的插件](img/c06f006.png)\n\n图 6.6 禁用不使用的插件\n\n### 补充网络扫描\n\
  \n基础漏洞扫描通过网络运行，从远程对系统进行探测。这通过模拟攻击者从另一个网络视角可能看到的内容，提供了系统安全的真实视图。然而，位于扫描器和目标服务器路径上的防火墙、入侵防御系统和其他安全控制可能会影响扫描结果，提供独立于这些控制措施的服务器安全不准确视图。\n\
  \n此外，许多安全漏洞仅通过远程扫描很难确认。通过网络运行的漏洞扫描可能会检测到存在漏洞的可能性，但无法可靠地确认它，导致需要管理员花费时间调查的误报结果。\n\
  \n现代漏洞管理解决方案可以使用有关服务器配置的信任信息来补充这些远程扫描。这些信息可以通过两种方式收集。首先，管理员可以为扫描器提供凭据，允许扫描器连接到目标服务器并检索配置信息。凭据扫描（credentialed\
  \ scan）随后使用这些信息来确定是否存在漏洞，相比无凭据扫描方案提高了扫描的准确性。例如，如果漏洞扫描检测到可以通过操作系统更新来修复的潜在问题，凭据扫描可以在报告漏洞之前检查系统是否已安装该更新。\n\
  \n图 6.7 显示了某个漏洞扫描工具中提供的凭据扫描选项示例。凭据扫描可以访问操作系统、数据库和应用程序等源。\n\n![图 6.7 配置身份验证扫描](img/c06f007.png)\n\
  \n图 6.7 配置身份验证扫描\n\n除了凭据扫描外，某些扫描器还使用基于代理（agent-based）的扫描方法来补充传统的基于服务器的无代理漏洞扫描方法。在这种方法中，管理员在每个目标服务器上安装较小的软件代理。这些代理对服务器配置进行扫描，提供“从内而外”的漏洞扫描，然后将信息报告回漏洞管理平台进行分析和报告。\n\
  \n### 扫描视角\n\n全面的漏洞管理程序提供了从各种扫描视角进行扫描的能力。每个扫描视角从网络上的不同位置进行扫描，提供有关漏洞的不同视图。例如，外部扫描从互联网运行，让管理员看到位于组织外部的攻击者可能看到的潜在漏洞视图。内部扫描可能从通用公司网络上的扫描器运行，提供恶意内部人员可能遇到的视点视图。最后，位于数据中心内部的扫描器和位于服务器上的代理，通过显示可能被网络上其他安全控制措施拦截的漏洞，提供了服务器真实状态最准确的视图。可能影响扫描结果的控制措施包括以下内容：\n\
  \n*   防火墙设置\n*   网络分段\n*   入侵检测系统 (IDS)\n*   入侵防御系统 (IPS)\n\n漏洞管理平台具有管理不同扫描器并提供扫描结果汇总视图的能力，汇总来自不同源的数据。图\
  \ 6.8 显示了管理员如何使用 Qualys 漏洞扫描器为新配置的扫描选择扫描器的示例。\n\n![图 6.8 选择扫描设备](img/c06f008.png)\n\
  \n图 6.8 选择扫描设备\n\n### 扫描器维护\n\n与任何技术产品一样，漏洞管理解决方案都需要精心维护。管理员应该定期对他们的漏洞扫描器进行维护，以确保扫描软件和漏洞源保持更新。\n\
  \n#### 扫描器软件\n\n扫描系统本身并不受漏洞的影响。如图 6.9 所示，即使是漏洞扫描器也存在安全问题。定期修补扫描器软件可以保护组织免受特定的扫描器的漏洞，并提供重要的错误修复和功能增强以提高扫描质量。\n\
  \n![图 6.9 NIST 漏洞数据库源：美国商务部公共领域](img/c06f009.png)\n\n图 6.9 NIST 漏洞数据库源：美国商务部公共领域\n\
  \n#### 漏洞插件源\n\n安全研究人员每周都会发现新漏洞，只有当漏洞扫描器频繁更新插件时，它们对这些漏洞才有效。管理员应该配置扫描器定期获取新插件，最好是每天。幸运的是，如图\
  \ 6.10 所示，此过程很容易实现自动化。\n\n![图 6.10 Nessus 自动更新](img/c06f010.png)\n\n图 6.10 Nessus\
  \ 自动更新\n\n## 开发修复流程\n\n漏洞扫描通常会产生大量的安全问题，需要安全专业人员、系统工程师、软件开发人员、网络工程师和其他技术人员的。对环境的初始扫描可能会产生大量需要排序和最终修复的问题。组织应该开发一种修复流程，允许对漏洞进行优先级排序，并在图\
  \ 6.11 所示的检测、修复和测试循环中跟踪修复情况。\n\n![图 6.11 漏洞管理生命周期](img/c06f011.png)\n\n图 6.11 漏洞管理生命周期\n\
  \n\n\n\n鉴于组织现有的工具，这种修复工作流应当尽可能自动化。许多漏洞管理产品包含内置的工作流机制，允许网络安全专家在整个修复过程中跟踪漏洞，并在测试确认修复成功后自动关闭漏洞。尽管这些工具很有帮助，但其他组织往往选择不使用它们，而是倾向于在组织其他用于处理其他技术问题的\
  \ IT 服务管理（ITSM）工具中跟踪漏洞。这种方法避免了要求技术人员使用两个不同的问题跟踪系统，并提高了对修复流程的合规性。然而，这同时也需要选择与组织的\
  \ ITSM 工具原生集成（或反之）的漏洞管理工具，或者在尚不存在集成的情况下在工具之间构建集成方案。\n\n漏洞管理中的一个重要趋势是转向`ongoing scanning`（持续扫描）和`continuous\
  \ monitoring`（持续监控）。持续扫描摒弃了按每周或每月定期对系统进行测试的计划扫描方法，而是配置扫描器循环对系统进行扫描，根据扫描资源允许的频率检查漏洞。这种方法可能会消耗大量的带宽和资源，但确实能更早地发现漏洞。持续监控结合了基于代理的漏洞检测数据，并在安全相关的配置更改发生时立即向漏洞管理平台报告，从而能够分析这些更改是否存在潜在的漏洞。\n\
  \n### 报告与通信\n\n向具有修复能力的技术人员以及负责环境安全的经理传达漏洞扫描结果，是漏洞管理的关键组成部分。毕竟，如果能够纠正问题的团队成员从未看到这些结果，那么漏洞扫描就是在浪费时间！\n\
  \n现代漏洞管理工具提供了非常强大的报告能力。这些报告可以根据需要手动生成以回答特定问题，或者管理员可以设置自动化报告，按计划生成并推送到需要查看它们的人员。此外，管理员还可能设置警报机制，在检测到新的严重漏洞时立即通知关键人员。\n\
  \n管理层仪表板提供了环境网络安全状况的最高层级总结。此类报告通常用于向领导者提供环境的快速快。漏洞扫描仪表板的示例见图 6.12。\n\n![FIGURE 6.12\
  \ Vulnerability dashboard example](img/c06f012.png)\n\nFIGURE 6.12 漏洞仪表板示例\n\n当网络安全分析师深入研究漏洞管理系统时，他们可以看到汇总性技术报告，显示网络上检测到的特定漏洞，并按漏洞类型、严重程度、主机组和其他因素进行排序。来自\
  \ Nessus 的此类报告示例见图 6.13。这些报告有助于识别需要网络安全专业人员关注的广泛性问题。\n\n![FIGURE 6.13 Nessus report\
  \ example by IP address](img/c06f013.png)\n\nFIGURE 6.13 按 IP 地址划分的 Nessus 报告示例\n\
  \n系统工程师通常对列出其所管理系统上所有漏洞的详细报告感兴趣。图 6.14 显示了一份 Nessus 报告，列出了由工具扫描的单个系统中存在的所有漏洞。该报告提供了漏洞的完整列表，并按严重程度排序，可以作为系统工程师用于确定某个系统修复工作优先的检查清单。\n\
  \n![FIGURE 6.14 Nessus report example by criticality](img/c06f014.png)\n\nFIGURE\
  \ 6.14 按关键性划分的 Nessus 报告示例\n\n最后一层钻取分析提供了修复系统上单个漏洞所需的细致细节。图 6.15 显示了此类报告的示例。该报告识别了检测到的漏洞，解释了该漏洞的意义和原因，并提供了修复指令，以指导管理员纠正底层安全问题。\n\
  \n![FIGURE 6.15 Detailed vulnerability report](img/c06f015.png)\n\nFIGURE 6.15 详细漏洞报告\n\
  \n### 修复优先级排序\n\n当网络安全分析师处理漏洞扫描报告时，他们必须在修复优先级排序上做出重要决策，以利用有限的资源解决对组织威胁最大的问题。漏洞优先优先级的排序并没有现成的公式。相反，分析师在选择首先关注哪些问题时，必须考虑几个重要的因素。\n\
  \n修复优先级排序决策过程中一些最重要的因素包括：\n\n*   **受漏洞影响的系统和信息的关键性**：根据漏洞的性质，关键性衡量应考虑机密性、完整性和可用性要求。例如，如果该漏洞允许拒绝服务攻击，网络安全分析师应该考虑如果系统因攻击而无法使用对组织的影响。如果该漏洞允许从数据库中窃取存储的信息，网络安全分析师应该考虑如果这些信息被盗取对组织的影响。\n\
  \n*   **修复漏洞的难度**：如果修复一个漏洞需要投入过量的人力财务资源，则这一事实应被纳入决策过程。网络安全分析师可能会发现，对于解决排名最高的问题所需的相同投入，他们可以按优先级顺序修复五个评级在\
  \ 2 到 6 之间的问题。这并不意味着他们一定应该仅根据成本和难度来做出该决定，但它是优先级排序过程中的一个考虑因素。\n\n*   **漏洞的严重程度**：问题越严重，纠正该问题就越重要。分析师可以参考通用漏洞评分系统（CVSS）为不同的漏洞提供相对严重程度排名。回在本章前面提到的，`CVSS`\
  \ 是 `SCAP` 的组成部分。\n\n*   **漏洞的暴露程度**：网络安全分析师还应该考虑漏洞被潜在利用的暴露程度。例如，如果一个内部服务器存在严重的\
  \ SQL 注入漏洞，但该服务器仅从内部网络访问，那么修复该问题的优先级可能低于修复一个暴露在互联网上、因此更容易受到外部攻击的严重程度稍低的问题。\n\n确定漏洞修复的最佳顺序与其说是科学，不如说门艺术。网络安全分析师必须评估他们掌握的所有信息，并对修复顺序做出明智决策，从而为组织提供最大的安全价值。\n\
  \n### 测试与实施修复\n\n\n\n\n\n在部署任何修复活动之前，你应该在沙箱环境中对计划的修复方案进行彻底测试。这允许你识别修复方案的任何不可预见的副作用，并减少修复活动干扰业务运营或对组织信息资产造成损害的概率。\n\
  \n在通过对受影响系统进行补丁或加固来部署修复后，你应该采取措施验证缓解措施是否有效。这通常涉及重复最初识别出漏洞的漏洞扫描，并确认该问题没有出现在新的扫描结果中。\n\
  \n当你确实执行缓解活动时，务必记住同时也要更新你的配置基准。例如，如果你对系统应用了安全补丁，你还应该修改你的配置基准，以确保未来的系统从一开始就针对相同的漏洞安装了补丁。\n\
  \n## 延迟修复选项\n\n并非总是能够修复每一个漏洞。在无法立即修正问题的情况下，你有两个基本选项可供选择。\n\n首先，你可以实施`补偿控制`（compensating\
  \ control）。补偿控制是你采取的额外安全措施，用于在不修复底层问题的情况下处理漏洞。例如，如果你有一个 Web 应用程序存在 SQL 注入漏洞，但你无法修复该\
  \ 应用程序本身，你可以使用 Web 应用防火墙（WAF）来阻止 SQL 注入攻击尝试。Web 应用防火墙充当了补偿控制。\n\n其次，你可以认为风险是可接受的，并将继续照常业务，即承认风险并继续进行。\n\
  \n## 克服漏洞扫描的风险\n\n漏洞扫描通常是网络安全专业人员的优先事项，但组织中的其他技术人员可能不会将其视为重要活动。网络安全分析师应该意识到他人对漏洞扫描设置的障碍，以及解决这些疑虑的方法。需要克服的一些常见障碍包括：\n\
  \n*   **服务降级**（Service Degradations）：这是技术人员提出的关于漏洞扫描的最常见的障碍。漏洞扫描会消耗网络带宽并占用扫描目标系统的资源。这可能会降低系统功能，并带来中断业务流程的风险。当扫描涉及`legacy\
  \ systems`（旧系统）或`proprietary systems`（专有系统）时，由于这些系统面对自动化漏洞扫描可能会表现出不可预测的行为，风险随之增加。网络安全专业人员可以通过调整扫描以减少带宽消耗，并与运营计划协调扫描时间来解决这些疑虑。图\
  \ 6.16 显示了管理员可以在一个工具中调整扫描强度的方法。\n\n*   **客户承诺**（Customer Commitments）：它们可能会为漏洞扫描制造障碍。与客户签订的`谅解备录（MOUs）`和`服务水平协议（SLAs）`可能会产生组织必须履行的有关可用性、性能和安全的预期。如果扫描将负面影响组织履行客户承诺的能力，客户可能需要参与到决策过程中。\n\
  \n*   **IT 治理与变更管理流程**（IT Governance and Change Management Processes）：这些流程可能会为支持扫描所需的配置更改带来官僚主义障碍。网络安全分析师应该在组织治理流程内工作，以获取支持漏洞管理计划所需的资源和支持。\n\
  \n![FIGURE 6.16 修改扫描性能设置](img/c06f016.png)\n\n**图 6.16** 修改扫描性能设置\n\n## 漏洞评估工具\n\
  \n当你完善自己的网络安全工具箱时，你会希望拥有一个网络漏洞扫描器和一个 Web 应用扫描器可用。漏洞扫描器通常用于预防性扫描和测试，也出现在渗透测试人员的工具箱中，帮助他们识别测试人员可以利用的系统。这也意味着它们是攻击者喜爱的工具！\n\
  \n### 基础设施漏洞扫描\n\n在准备 CySA+ 考试时，你应该熟悉网络安全分析师使用的主要的基础设施漏洞扫描工具。以下工具是网络漏洞扫描器的示例：\n\n\
  *   Tenable 的 `Nessus` 是一款广为人知的备受尊敬的网络漏洞扫描产品，是该领域最早的产品之一。\n\n*   `Qualys` 的扫描器是一种较新开发的商业漏洞扫描器，采用软件即服务（SaaS）模式，可以在本地数据中心和云端运行扫描。\n\
  \n*   Rapid7 的 `Nexpose` 是另一种商业漏洞管理系统，其功能类似于 `Nessus` 和 `Qualys`。\n\n*   开源的 `OpenVAS`\
  \ 提供了漏洞扫描器的替代方案。\n\n在这些工具中，CySA+ 考试关注 `Nessus` 和 `OpenVAS`，因此你应该花时间熟悉它们。市场上还有许多漏洞扫描器的示例，每个成熟组织都应该应该工具箱中配备一个。\n\
  \n### 云基础设施扫描\n\n云基础设施评估工具进入云环境，检索信息，并提供有关环境安全性的报告。它们可能会检测到其他扫描无法发现的问题。例如，专注于云的工具可能会进入云提供者的\
  \ `API`，并发现安全密钥多年未轮换。云提供商为客户提供许多工具，通常免费或费用低，因为确保环境中资源的安全运行符合提供者的利益。例如，图 6.17 显示了使用\
  \ `Inspector` 工具对亚马逊云 (AWS) 环境进行的扫描。\n\n#### Scout Suite\n\n`Scout Suite` 是一种多云审计工具，它可以进入用户的云服务提供商账户并使用这些服务的\
  \ `API` 获取信息。它能够审计 `AWS`、`Microsoft Azure`、`Google Compute Platform`、`阿里云`和 `Oracle\
  \ Cloud Infrastructure` 的账户。\n\n![图 6.17 AWS 扫描结果](img/c06f017.png)\n\n**图 6.17**\
  \ AWS 扫描结果\n\n#### Pacu\n\n\n\n\n\n`Pacu` 并不是一个扫描工具，而是一个专注于云的利用框架。它专门针对 `AWS` 账户工作，旨在帮助攻击者确定他们根据对现有\
  \ `AWS` 账户的访问权限可以做什么。正因如此，它是 `AWS` 渗透测试员喜欢的工具。\n\n![图 6.18 AWS 账户扫描的 Scout Suite\
  \ 仪表板](img/c06f018.png)\n\n**图 6.18** AWS 账户扫描的 Scout Suite 仪表板\n\n使用 `Pacu` 与使用\
  \ `Metasploit` 非常相似，之处在于 `Pacu` 提供了一个模块化的插件框架，用于测试和探测各种信息源。图 6.20 部分列出了供 `Pacu`\
  \ 使用的 `AWS` 利用插件。\n\n![图 6.19 在 Scout Suite 扫描期间报告的 EC2 安全问题](img/c06f019.png)\n\
  \n**图 6.19** 在 Scout Suite 扫描期间报告的 EC2 安全问题\n\n### Prowler\n\n`Prowler` 是一个安全配置测试工具，其目的与\
  \ `Scout Suite` 非常相似。`Prowler` 确实会对某些参数进行更深层的测试，但它限于扫描 `AWS`、`Microsoft Azure` 和\
  \ `Google Compute Platform` 环境。图 6.21 显示了 `Prowler` 对 `AWS` 账户扫描的部分结果。\n\n![图 6.20\
  \ Pacu 中可用利用程序的部分列表](img/c06f020.png)\n\n**图 6.20** Pacu 中可用利用程序的部分列表\n\n### Web\
  \ 应用程序扫描\n\nWeb 应用程序扫描器是用于检查 Web 应用程序安全性的专用工具。这些工具测试 Web 特定的漏洞，例如 `SQL 注入`、跨站脚本\
  \ (`XSS`) 和跨站请求伪造 (`CSRF`) 漏洞。它们通过将对 Web 服务器的传统网络扫描与对 Web 应用程序的详细探测相结合工作，这些技术包括发送已恶意输入序列和模糊测试（fuzzing），以尝试破解应用程序。你将在第\
  \ 8 章“响应漏洞”中学习更多关于模糊测试的内容。\n\n`Nikto` 是 `CySA+` 考试所需知识的两个开源 Web 应用程序扫描工具之一。作为一种开源工具，任何人都可以免费使用。如图\
  \ 6.22 所示，`Nikto` 使用命令行界面，使用起来有些困难。\n\n![图 6.21 针对 AWS 账户进行 Prowler 扫描的部分结果](img/c06f021.png)\n\
  \n**图 6.21** 对 AWS 账户进行 Prowler 扫描的部分结果\n\n![图 6.22 Nikto Web 应用程序扫描器](img/c06f022.png)\n\
  \n**图 6.22** Nikto Web 应用程序扫描器\n\n另一个用于 Web 应用程序扫描的开源工具是 `Arachni`。该工具如图 6.23 所示，是一个适用于\
  \ `Windows`、`macOS` 和 `Linux` 操作系统的包好的扫描器。\n\n![图 6.23 Arachni Web 应用程序扫描器](img/c06f023.png)\n\
  \n**图 6.23** Arachni Web 应用程序扫描器\n\n大多数组织都使用 Web 应用程序扫描器，但他们选择使用提供高级功能和用户友好界面的商业产品。虽然市场上有很多专用\
  \ Web 应用程序扫描器，但许多公司使用传统网络漏洞扫描器的 Web 应用程序扫描功能，例如 `Nessus`、`Qualys` 和 `Nexpose`。图\
  \ 6.24 显示了 `Nessus` 在 Web 扫描角色中的示例。\n\n### 拦截代理\n\n`拦截代理`（Interception proxies）是渗透测试员和其他寻求评估\
  \ Web 应用程序安全性人员的价值工具。因此，它们可以归类为利用工具。它们运行在测试者的系统上，并在 浏览器发送到 Web 服务器的请求发布到网络之前将其拦截。这允许测试人员手动操作请求以尝试注入攻击。\n\
  \n图 6.25 显示了流行的开源 `Zed Attack Proxy` (`ZAP`)。`ZAP` 是一个由 `Open Web Application Security\
  \ Project` (`OWASP`) 协调的社区开发项目。`ZAP` 用户可以拦截从任何 浏览器发送的请求，并在传递给 Web 服务器之前对其进行修改。\n\
  \n![图 6.24 Nessus Web 应用程序扫描器](img/c06f024.png)\n\n**图 6.24** Nessus Web 应用程序扫描器\n\
  \n![图 6.25 Zed Attack Proxy (ZAP)](img/c06f025.png)\n\n**图 6.25** Zed Attack Proxy\
  \ (ZAP)\n\n`Burp Proxy`如图 6.26 所示，是寻求拦截代理的分析者的另一种选择。它是名为 `Burp Suite` 的 Web 应用安全工具包。虽然完整的\
  \ `Burp Suite` 需要许可，但 `Burp Proxy` 目前提供免费版。\n\n![图 6.26 Burp Proxy](img/c06f026.png)\n\
  \n**图 6.26** Burp Proxy\n\n## 总结\n\n漏洞管理计划允许安全专业人员识别并修复系统、应用程序和设备的安全性漏洞。在高度监管的环境中，组织可能根据法律法规进行漏洞扫描，但许多行业之外的组织作为安全最佳实践实施漏洞管理计划。\n\
  \n构建漏洞管理计划的安全分析师应从识别扫描需求开始。这包括审查可能的扫描目标并选择扫描频率。一旦做出这些决策，分析师就可以定期执行漏洞扫描，最好通过自动化扫描调度系统。\n\
  \n扫描期间的每个漏洞都应进入漏洞修复工作流，该工作流将任务分配给相应的工程师，跟踪修复进度，并通过最终漏洞扫描后续修复工作。\n\n处理初始扫描结果可能是一项巨大的任务。组织应根据受漏洞影响的系统和信息的关键性、修复难度、漏洞严重程度以及漏洞对外部网络的暴露情况来优先考虑修复。当组织清理了初始扫描结果后，可能会转向持续性的扫描方法，以快速发现新漏洞。\n\
  \n## 考试要点\n\n**了解漏洞扫描需求可能来自内部和外部源。** 在某些情况下，组织面临进行漏洞扫描的法律和法规要求`支付行业数据安全标准` (`PCI\
  \ DSS`) 和 `联邦信息安全管理法` (`FISMA`) 是这些外部要求的两个例子。\n\n**了解选择扫描目标标准。** 发现扫描为组织提供了一种自动识别网络上现有主机并建立资产清单的方法。安全专业人员可以根据数据分类、系统暴露情况、提供的服务以及系统作为测试、开发或生产环境的状态来选择扫描目标。\n\
  \n\n\n\n\n### 描述扫描频率如何根据组织的需求发生变化。\n管理员可能会根据组织的风险承受能力、监管要求、许可限制以及业务和技术限制，选择每天、每周或每月运行一次扫描。某些组织可能选择采用持续监控方法进行漏洞检测。\n\
  \n### 解释如何配置扫描设置允许自定义以满足组织的安全需求。\n网络安全专业人员可以通过配置敏感性级别（包括包含和排除插件）以及通过从凭据扫描和服务器代理收集的信息来补充基础网络扫描，从而对扫描进行自定义。安全团队还可以从多个扫描视角进行扫描，以提供网络的不同视图。\n\
  \n### 列出负责维护漏洞扫描系统的管理员应该执行的任务。\n负责维护漏洞扫描系统的管理员应该执行两项重要的管理任务。首先，他们应该定期更新扫描器软件，以修复安全问题并添加新功能。其次，他们应该频繁更新插件，以对其环境提供最准确、最新的漏洞扫描结果。\n\
  \n### 描述组织应使用的识别、修复和测试漏洞的修复工作流。\n修复工作流应尽可能自动化，并与 IT 组织使用的其他工作流技术集成。当技术人员修复漏洞时，他们通过安全测试验证修复的有效性，并在跟踪系统中关闭该漏洞。漏洞管理系统应提供一系列报告和报警工具来补充这些工作。\n\
  \n### 了解网络安全专业人员应优先考虑修复活动以有效利用有限资源。\n立即修复所有漏洞是不可能的。安全团队应该根据受影响系统和信息的关键性、修复漏洞的难度、漏洞的严重性以及受影响系统的暴露情况来优先考虑工作。\n\
  \n### 了解网络安全专业人员如何准备克服 IT 团队其他成员对扫描的反对。\n对漏洞扫描的常见反对意见包括扫描引起的服务下降对 IT 服务的影响、对 MOU\
  \ 和 SLA 中客户的承诺，以及对 IT 治理和变更管理流程的使用。\n\n## 实验\n\n### 活动 6.1：安装漏洞扫描器\n在实验中，你将在系统上安装\
