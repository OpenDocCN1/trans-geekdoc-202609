  \n最后，我们要感谢我们的家人和伴侣，感谢他们支持我们完成这类书籍在编写、编辑和出版过程中所付出的无数深夜、忙碌的周末和长时间工作。\n\n# 关于作者\n\n\
  `Mike Chapple, Ph.D., Security+, CySA+, CISSP,` 是 50 多部书籍的作者，其中包括畅销书 *CISSP (ISC)*²\
  \ *Certified Information Security Professional Official Study Guide* (Sybex, 2021)\
  \ 和 *CISSP (ISC)*² *Official Practice Tests* (Sybex, 2021)。他是一位信息安全专业人士，在高等教育、私营部门和政府领域拥有二十年的经验。\n\
  \nMike 目前担任圣母河大学 Mendoza 商学院 IT、分析与运营系的教学教授，在那里教授有关网络安全、数据管理和商业分析的本科和研究生课程。\n\n\
  在回到圣母河之前，Mike 曾担任位于迈阿密的营销咨询公司 `Brand Institute` 的执行副总裁兼首席信息官。Mike 还曾在国家安全局的信息安全研究小组工作过四年，并曾是美国空军的现役情报官。\n\
  \nMike 在圣母河大学获得了计算机科学与工程的 `B.S.` 和 `Ph.D.` 学位。Mike 还拥有爱达荷大学的计算机科学 `M.S.` 学位和奥本恩大学的\
  \ `MBA` 学位。Mike 拥有网络安全分析师+ (`CySA+`)、`Security+`、认证信息安全经理 (`CISM`)、认证云安全专业人员 (`CCSP`)\
  \ 和认证信息系统安全专家 (`CISSP`) 认证。他在自己的网站 `CertMike.com` 上提供安全认证资源。\n\n`David Seidl, CySA+,\
  \ CISSP, PenTest+,` 是迈阿密大学的信息技术副总裁兼首席信息官 (`CIO`)。在他的 IT 职业中，他担任过多种技术和信息安全职位，包括圣母河大学校园技术服务高级总监，在那里他共同领导了圣母河大学的云迁移，并监督了云运营、`ERP`、`数据库`、`身份管理`\
  \ 以及广泛的其他技术和服务。他还曾担任过圣母河大学信息安全总监，并领导了该校的信息安全计划。他曾作为圣母河大学 Mendoza 商学院的讲师教授信息安全和网络本科课程，并编写了\
  \ 18 本关于安全认证和网络战争的书籍，包括合著 *CISSP (ISC)*² *Official Practice Tests* (Sybex, 2021)\
  \ 以及本书和配套书籍 *CompTIA CySA+ Practice Tests* (Sybex, 2020, 2018) 的之前的版本。\n\nDavid\
  \ 拥有东密根大学的通信技术学士学位和信息安全硕士学位，以及 `CISSP`、`CySA+`、`Pentest+`、`GPEN` 和 `GCIH` 认证。\n\n\
  # 关于技术编辑\n\n`Chris Crayton, MCSE, CISSP, CASP, CySA+, A+, N+, S+,` 是技术顾问、培训师、作者和行业领先的技术编辑。他曾担任过计算机技术和网络教师、信息安全总监、网络管理员、网络工程师和\
  \ PC 专家。Chris 曾在几家领先出版公司的众多技术著作中担任技术编辑和内容贡献者。他还获得了许多专业和教学奖项。\n\n# 引言\n\n*CompTIA^®\
  \ CySA+ (网络安全分析师) Study Guide: Exam CS0-003, 第三 Edition,* 为构成网络安全分析师+ 认证的考试目标提供了易懂的解释和实战知识。本书将帮助你在参加考试之前评估自己的知识，并为你所在可能想要扩展技能或专业知识的领域进一步学习提供阶石。\n\
  \n在应对 `CySA+` 考试之前，你应该已经是一名安全从业人员了。`CompTIA` 建议应考者具有大约四年的实操信息安全经验。你还应该熟悉书中描述的某些工具和技术。你不需要了解每一个工具，但理解如何利用现有经验来处理可能不熟悉的新场景、工具或技术，对于通过\
  \ `CySA+` 考试至关重要。\n\n## CompTIA\n\n`CompTIA` 是一个非营利贸易组织，提供各种 IT 领域的认证，从 PC 支持技术员所需的技能（由\
  \ `A+` 考试涵盖）到 CompTIA 高级安全专家 (`CASP+`) 等高级认证。\n\n`CompTIA` 建议从业人员遵循所示的网络安全职业路径：\n\
  \n![](img/fintrou001.png)\n\n网络安全分析师考试是一项更高级的考试，面向具有实操经验并掌握之前考试知识的专业人士。\n\n`CompTIA`\
  \ 认证获得了 `ISO` 和 `ANSI` 认证，并在多个行业中作为技术技能和知识的衡量标准。此外，包括 `CySA+`、`Security+` 和 `CASP+`\
  \ 在内的 `CompTIA` 认证已被美国政府批准为信息基准认证，并包含在技能激励项目中。\n\n## 网络安全分析师考试\n\n网络安全分析师考试（`CompTIA`\
  \ 称为 `CySA+`）旨在为网络安全、威胁和漏洞分析师提供厂商中立的认证。`CySA+` 认证专为安全分析师、工程师以及安全运营中心 (`SOC`) 人员、漏洞分析师和威胁情报分析师设计。它聚焦于安全分析以及安全工具在现实场景中的实际应用。它涵盖四个主要领域：`安全运营`、`漏洞管理`、`事件响应与管理`以及`报告与通信`。这四个领域包含了从侦察到事件响应和取证的各种主题，并侧重于基于场景的学习。\n\
  \n`CySA+` 考试位于初级 `Security+` 考试和 CompTIA 高级安全专家 (`CASP+`) 认证之间，为那些寻求认证和职业路径上更进一步的人士提供了中级职业认证。\n\
  \n\n\n\n\nCySA+ 考试采用 CompTIA 所称为“基于性能的评估（performance-based assessment）”格式。这意味着考试通过实际安全工具和场景进行实操模拟，以执行与安全从业人员日常工作相匹配的任务。考试题可能包括多种类型的题目，例如单选题、填空题、多选题、拖放题以及基于图像的问题。\n\
  \nCompTIA 建议考者在参加此考试之前具有四年的信息安全相关经验。在本书编写时，美国地区的考试费用为 392 美元，全球其他地区的价格也相相当。关于 CySA+\
  \ 考试及如何参加考试的更多信息，可以访问 `www.comptia.org/certifications/cybersecurity-analyst` 查找。\n\
  \n# 学习与备考建议\n\n像这样一本备考书无法教你考试中可能出现的每种安全软件软件包、场景或特定技术。相反，在阅读本书时，你应该关注自己是否熟悉某类技术、工具、流程或场景的类型或类别。如果你发现了自己的短板，可能希望寻找额外的工具来帮助你深入了解这些主题。\n\
  \n用于实操练习的额外资源包括：\n\n* `Exploit Exercises` 在 `http://Exploit-Exercises.com` 提供了涵盖广泛安全问题的虚拟机、文档和挑战。\n\
  * `Hacking-Lab` 在 `hacking-lab.com` 提供了各个领域的攻防夺旗赛（CTF）练习。\n* `PentesterLab` 在 `http://pentesterlab.com/exercises`\
  \ 提供基于订阅的渗透测试练习访问。\n\n由于考试采用基于场景的学习模式，请预计题目将涉及分析和思考，而不是依赖于简单的记忆。正如你预期的那样，在书中复制这种体验是不可能的，因此这里的题目旨在帮助你确信自己已经足够熟悉该主题，能够思考应对实操练习。\n\
  \n# 参加考试\n\n一旦你完全准备好参加考试，可以访问 CompTIA 网站购买考试券：\n\n```\nhttp://store.comptia.org\n\
  ```\n\n目前，CompTIA 提供两种参加考试的选项：在测试中心参加线下考试，以及在您自己的电脑上参加的居家考试。\n\n## 线下考试\n\nCompTIA\
  \ 与 Pearson VUE 的测试中心建立了合作伙伴关系，因此你的下一步是找到你附近的测试中心。在美国，你可以根据地址或邮政编码进行查找，而非美国以外的考者可能会发现输入城市和国家更方便。你可以在\
  \ Pearson Vue 网站搜索附近的测试中心，在那里你需要导航到“查找测试中心（Find a test center）”。\n\n```\nhttps://home.pearsonvue.com/comptia\n\
  ```\n\n确定想在哪里参加考试后，只需设置一个 Pearson VUE 测试账户并在其网站上预约考试。\n\n考试当天，请携带两种身份证明，并确保在考试开始前尽早到达。记住，你无法携带笔记、电子设备（包括手机和手表）或其他材料进入现场。\n\
  \n## 居家考试\n\nCompTIA 还提供了使用 Pearson Vue 远程监考服务的居家考试选项。使用这种方法的候选人将在家中或办公室考试，由远程监考通过摄像头进行监考。\n\
  \n你可以通过访问以下网址了解更多关于居家考试的信息：\n\n```\nwww.comptia.org/testing/testing-options/take-online-exam\n\
  ```\n\n# 安全分析师+ 考试之后\n\n一旦参加完考试，你将立即收到分数，因此你可以立刻知道是否通过了测试。你应该将你的成绩单与考试注册记录以及注册考试时使用的电子邮件地址进行备份。\n\
  \n## 维护你的认证\n\nCompTIA 认证必须定期续期。要续签你的认证，你可以通过通过最新版本的考试、获得符合条件的高级 CompTIA 或行业认证，或者完成足量的持续教育活动以获得足够的持续教育学分（CEUs）来进行续期。\n\
  \nCompTIA 通过其网站提供有关续期的信息：\n\n```\nwww.comptia.org/continuing-education\n```\n\n\
  当你注册续签认证时，将要求你同意 CE 计划的伦理守则、支付续期费并提交你所选续期方法所需的材料。\n\n你可以用于获取助力续签 CySA+ 所需 CEUs 的行业认证完整列表可以在此处找到：\n\
  \n```\nwww.comptia.org/continuing-education/choose/renew-with-a-single-activity/earn-a-higher-level-comptia-certification\n\
  ```\n\n# 本书涵盖了什么？\n\n本书旨在涵盖 CySA+ 考试包含的四个领域。\n\n* **第 1 章: 当代安全分析师** 本书首先教你如何评估网络安全威胁，以及如何评估和选择控制措施以保持你的网络和系统安全。\n\
  * **第 2 章: 系统与网络架构** 理解构成你组织基础设施的底层架构将帮助你防御组织。在本章中，你将探索无服务器（serverless）、容器化技术以及虚拟化概念。你还将探索日志与记录、网络架构与设计概念、身份与访问管理概念，以及如何使用加密进行安全数据保护。\n\
  * **第 3 章: 恶意活动** 分析事件和识别恶意活动是许多安全专业人员工作的关键部分。在本章中，你将探索如何监控和检测基于主机、基于网络和基于应用的攻击以及入侵指标（IOC）。你还将探索日志、电子邮件和其他工具和数据源如何作为调查的一部分使用。\n\
  * **第 4 章: 威胁情报** 安全专业人员需要充分理解威胁，以预防它们或限制其影响。在本章中，你将学习许多类型的威胁情报，包括来源以及评估给定威胁情报来源相关准确性的方法。你将发现如何在你的组织中使用威胁情报。\n\
  * **第 5 章: 侦察与情报收集** 获取有关组织及其系统的信息是攻击者和防御者都会做的。在本章中，你将学习如何使用流行的工具和技术获取组织情报。你还将学习限制针对你自身组织的情报收集的影响。\n\
  * **第 6 章: 设计漏洞管理计划** 管理漏洞有助于保持你的系统安全。在本章中，你将学习如何使用定义的工作流和持续评估方法来识别、优先排序并修复漏洞。\n\
  * **第 7 章: 分析漏洞扫描** 漏洞报告可能包含大量关于系统潜在问题的庞数据。在本章中，你将学习如何阅读和分析漏洞扫描报告、CVSS 评分是什么及其含义，以及如何选择适当的操作来修复你发现的问题。\n\
  \n\n\n\n\n# 第 8 章：响应漏洞\n在 `[c08.xhtml]` 中，在本章中，我们将关注发现漏洞后发生的情况——组织对其环境中存在的漏洞采取响应的方式。我们将从概述风险管理过程开始，然后深入探讨响应漏洞的某些特定方法。\n\
  \n# 第 9 章：构建事件响应计划\n在 `[c09.xhtml]` 中，在本章中，我们重点关注构建正式的事件响应处理计划和团队。你将学习事件处理每个阶段的细节，从准备、检测与分析、遏制、根除和恢复，到最后的事件后恢复，以及如何对事件进行分类和进行相关沟通。\n\
  \n# 第 10 章：事件检测与分析\n在 `[c10.xhtml]` 中，在本章中，安全专业人员将监控妥陷指标（IoCs），一旦发现，将对其进行分析以确定是否发生了事件。在本章中，你将探索与网络、系统、服务和应用程序相关的\
  \ `IoCs`。你还将深入数据和日志分析以及证据获取与分析。\n\n# 第 11 章：遏制、根除与恢复\n在 `[c11.xhtml]` 中，一旦事件发生并完成了事件响应的初始阶段，你就需要努力从事件中恢复。该过程涉及遏制事件以确保不再发生进一步的问题，然后致力于根除恶意软件、根内核程序和其他受侵害元素。一旦事件被清理，就可以开始恢复阶段，包括报告和为未来的问题做准备。\n\
  \n# 第 12 章：报告与沟通\n在 `[c12.xhtml]` 中，沟通和报告是确保组织消化并使用有关漏洞和事件信息的关键。在本章中，你将同时探索与漏洞管理和事件响应相关的沟通。你将探索如何利用漏洞管理和风险评分，同时理解修复的最常见阻因素。你还将查看事件报告、如何与利益相关者互动，以及如何收集和利用教训。\n\
  \n# 第 13 章：执行取证分析与事件响应技术\n在 `[c13.xhtml]` 中，了解系统、设备或网络上发生了什么（无论是作为事件的一部分还是出于其他目的）通常涉及取证分析。在本章中，你将学习如何构建取证能力以及如何使用取证工具包中的关键工具。\n\
  \n# 附录：复习题答案\n在 `[b01.xhtml]` 中，附录包含了你在每章末尾看到的复习题答案。\n\n## 学习指南元素\n本学习指南使用了许多常用元素来帮助你准备。这些包括：\n\
  \n*   **总结 (Summaries)**：每章的 `Summary` 部分简要解释该章节的内容，让你能够轻松理解其涵盖的内容。\n*   **考试要点\
  \ (Exam Essentials)**：`Exam Essentials` 关注主要的考试主题以及你应该带入考试的关键知识。`Exam Essentials`\
  \ 关注 `CompTIA` 提供的考试目标。\n*   **复习题 (Review Questions)**：每章末尾的一系列问题将帮助你评估自己的知识，并根据你对该章节主题的了解判断是否已准备好考试。\n\
  *   **实验练习 (Lab Exercises)**：书面实验提供了更深入的实践机会，以扩展你的技能，并为 `CySA+` 考试中的性能测试做好更好的准备。\n\
  \n## 交互式在线学习环境与题库\n我们整合了一些非常棒的在线工具，帮助你通过 `CompTIA CySA+` 考试。随《CompTIA® CySA+ 学习指南：考试\
  \ CS0-003》一起提供的交互式在线学习环境提供了题库和学习工具，帮助你准备考试。通过使用这些工具，你可以大大增加首次通过考试的概率。\n\n在线题库包含以下内容：\n\
  \n### 示例测试 (Sample Tests)\n书中和在线都提供了许多练习题，包括引言末尾的 `Assessment Test` 中的问题以及 `Chapter\
  \ Tests`（章节测试）中的问题（后者包含了每章末尾的复习题）。此外，还有一个自定义模拟考试。使用所有的练习题来测试你对学习指南内容的掌握情况。在线题库可在多个设备上运行。\n\
  \n### 闪卡 (Flashcards)\n在线题库包含 100 多张专门编写用于测试你知识的闪卡，所以如果一开始没有全部通过也不要气馁！它们是为了确保你掌握了关键术语和概念，并真正为考试做好了准备。别担心——有了复习题、模拟考试和闪卡，当考试日来临时你将准备充分！问题以数字闪卡格式提供（一个问题后跟一个单一正确答案）。你可以使用闪卡来强化学习，并在考试前进行最后的冲刺。\n\
  \n### 其他学习工具 (Other Study Tools)\n书中关键术语及其定义的表以完全可搜索的 `PDF` 格式提供。\n\n## CompTIA\
  \ CySA+ 考试 CS0-003 目标映射\n以下针对 `CompTIA CySA+` 认证考试的目标映射将使你能够找到书中涵盖考试每个目标的章节。\n\n\
  ### 目标映射 (Objectives Map)\n\n| 目标 (Objective) | 章节 (Chapter(s)) |\n| :--- | :---\
  \ |\n| **1.0 安全运营** | |\n| 1.1 解释系统和网络架构概念在安全运营中的性 | `2` |\n| 1.2 根据场景分析潜在恶意活动指标\
  \ | `3` |\n| 1.3 根据场景，使用适当的工具或技术确定恶意活动 | `3` |\n| 1.4 对比威胁情报与威胁狩猎概念 | `4` |\n| 1.5\
  \ 解释效率和流程改进在安全运营中的性 | `1` |\n| **2.0 漏洞管理** | |\n| 2.1 根据场景实施漏洞扫描方法和概念 | `1`, `5`,\
  \ `6`, `7`, `8` |\n| 2.2 根据场景分析来自漏洞评估工具的输出 | `5`, `6`, `8` |\n| 2.3 根据场景分析数据对漏洞排序\
  \ | `7` |\n| 2.4 根据场景，建议缓解攻击和软件漏洞的措施 | `7` |\n| 2.5 解释与漏洞响应、处理和管理的概念 | `8` |\n|\
  \ **3.0 事件响应与管理** | |\n| 3.1 解释与攻击框架相关的概念 | `9` |\n| 3.2 根据场景执行事件响应活动 | `9`, `10`,\
  \ `11`, `13` |\n| 3.3 解释事件管理周期中的准备阶段和事件后阶段 | `9`, `13` |\n| **4.0 报告与沟通** | |\n\
  | 4.1 解释漏洞管理报告和沟通的重要性 | `12` |\n| 4.2 解释事件响应报告和沟通的重要性 | `12` |\n\n\n\n\n为了构建一个基础的虚拟安全实验环境来运行场景，并学习书中使用的应用程序和工具，你需要一个虚拟化程序和虚拟机。除了本例中的工具外，还有许多优秀的面向安全的发行版和工具，随着你经验的积累，你可能想要探索如\
  \ `Security Onion`、`SANS SIFT` 取证发行版以及 `CAINE` 等工具。\n\n运行虚拟机可能需要性能相当的 PC。我们建议使用\
  \ `i5` 或 `i7`（或等效）CPU、至少 `8 GB` 的 `RAM` 以及 `20 GB` 的可用虚拟机磁盘空间。\n\n### VirtualBox\n\
  \n`VirtualBox` 是一个适用于 x86 计算机的虚拟化软件软件包，适用于 Windows、macOS 和 Linux。你可以在 `www.virtualbox.org/wiki/Downloads`\
  \ 下载 `VirtualBox`。\n\n如果你更熟悉 `VMware` 或 `Hyper-V` 等其他虚拟化工具，也可以使用这些工具；但是，你可能需要调整或修改这些指令，以处理你所喜的虚拟化环境工作方式的差异。\n\
  \n### Kali Linux\n\n`www.kali.org/downloads` 提供了多个版本的 `Kali Linux`，包括预构建的虚拟机。如果你正在遵循这些指令，建议下载最新版本的\
  \ `Kali Linux 64-bit` `VirtualBox` 虚拟机；如果你使用替代方案，请下载适用于你虚拟化工具的版本。你需要解压下载的文件才能使用。\n\
  \n### Metasploitable\n\n你可以在 `http://sourceforge.net/projects/metasploitable` 下载\
  \ `Metasploitable` 虚拟机。与 `Kali Linux` 一样，你需要解压文件才能使用。\n\n`VirtualBox` 期望虚拟机为 `OVF`\
  \ 格式，因此你需要将 `Metasploitable` 的 `VMware` 文件转换为 `OVF`。你可以使用来自 `https://developer.vmware.com/web/tool/4.4.0/ovf`\
  \ 的 `VMware` `Open Virtualization Format Tool` (`ovftool`) 来进行此更改。你需要创建一个 `VMware`\
  \ 账户来下载文件。如何进行更改的指令可以在 `https://theautomationblog.com/converting-a-vmware-vmx-file-for-use-in-virtualbox`\
  \ 找到。\n\n在用于准备这些指令的系统中，这意味着要导航到 `C:\\Program Files\\VMware\\Vmware OVF Tool\\`，然后运行命令行：`ovftool.exe\
