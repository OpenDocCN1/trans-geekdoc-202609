  \ 国家级攻击者受政府赞助，通常拥有最大的资源访问，包括工具、资金和人才。\n\n### 7. A. 黑客行动主义（Hacktivists）出于政治原因执行攻击，包括针对政府和企业。此题的关键要素是攻击背后的政治原因。\n\
  \n### 8. B. 攻击向量（即攻击者访问目标的手段）可能包括 USB 优盘投放等物品。你可能想用“对手能力”来回答此问题，但请记住定义：可能的威胁行为者的资源、意图或能力。这里的“能力”不是指他们能做什么，而是指他们这样做的能力。在这个例子中，攻击面可能包括组织的停车场，但这并不是攻击面的范例，而且这道题中没有包含概率评估。\n\
  \n### 9. A. 在尝试识别内部威胁时，行为评估非常有用。由于内部威胁很难与执行操作的正常行为上下文区分来（例如非工作时间登录、滥用凭据，以及从异常位置或以异常模式登录），因此通常会使用其他行为指标。\n\
  \n### 10. D. 犯罪组织等威胁行为者经常通过暗网运行。论坛通过 TOR 托管的站点作为信息、资源和访问的结算中心。虽然社交媒体、博客或政府公告可能提供有关犯罪组织的信息，但这些组织更有可能在暗网上自己发布信息。\n\
