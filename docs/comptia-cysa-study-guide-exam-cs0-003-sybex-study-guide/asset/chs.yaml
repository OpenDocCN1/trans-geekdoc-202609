  \    1. `CEO`\n    2. 安全总监\n    3. `CIO`\n    4. `CSIRT` 负责人\n\n13. 以下哪项不是事件响应中抑制、消除和恢复阶段的目标之一？\n\
  \    1. 检测正在发生的事件。\n    2. 实施抑制策略。\n    3. 识别攻击者。\n    4. 消除事件的影响。\n\n\n\n\n\n###\
  \ 问题\n\n14. Renee 正在响应一起安全事件，该事件导致其公司运营关键的网站无法访问。她不确定恢复网站需要多时间和精力。Renee 应该如何对恢复工作进行分类？\n\
  \n1. 常规（Regular）\n2. 补充（Supplemented）\n3. 扩展（Extended）\n4. 不可恢复（Not recoverable）\n\
  \n15. 下列哪项是耗尽攻击（attrition attack）的示例？\n\n1. SQL 注入\n2. 笔记本电脑被盗\n3. 用户安装文件共享软件\n\
  4. 破解密码攻击\n\n16. 谁是事后总结会议的最佳协调员？\n\n1. 首席执行官 (CEO)\n2. `CSIRT` 领导\n3. 独立协调员\n4.\
  \ 第一响应人员\n\n17. 下列元素通常不会出现在事件响应策略中？\n\n1. `CSIRT` 的性能指标\n2. 网络安全事件的定义\n3. 角色、职责和权限级别的定义\n\
  4. 系统重建程序\n\n18. 路径中攻击（on-path attack）是哪种威胁向量的示例？\n\n1. 耗尽攻击（Attrition）\n2. 冒充（Impersonation）\n\
  3. 网络（Web）\n4. 电子邮件（Email）\n\n19. Tommy 是其组织的 `CSIRT` 团队负责人，正在响应一个新发现的安全事件。哪种文档最可能包含他在响应工作早期可能遵循的逐步说明？\n\
  \n1. 策略（Policy）\n2. 基准（Baseline）\n3. 剧练手册（Playbook）\n4. 教科（Textbook）\n\n20. Hank\
  \ 正在响应一起安全事件，公司 CEO 的笔记本电脑被盗了。电脑经过了加密，但包含了有关公司员工的敏感信息。Hank 如何对此安全事件的信息影响进行分类？\n\n\
  1. 无（None）\n2. 隐私泄露（Privacy breach）\n3. 专有泄露（Proprietary breach）\n4. 完整性丢失（Integrity\
  \ loss）\n\n# 第 10 章\n\n## 事件检测与分析\n\n响应安全事件和网络事件是网络安全分析师的常见任务，为了做到这一点，你需要了解如何检测和分析入侵指标（`IoCs`）、获取证据并保存证据。安全人员可能会遇到基于网络的\
  \ `IoCs`，例如过度或异常的带宽消耗、探测和扫描以及非法设备，了解如何识别和理解它们对于安全从业人员来说至关重要。主机和应用程序问题也是频繁的 `IoCs`，了解识别它们需要理解主机性能问题、恶意软件以及更具针对性的攻击。了解要寻找什么、如何找到它们以及你的响应方案是什么，是事件响应活动的重要组成部分。\n\
  \n在本章中，你将学习入侵指标，包括从带宽使用、数据外泄到扫描、探测和拒绝服务攻击的常见网络事件。在探索 `IoCs` 之后，你将探索证据获取概念，如保护监管存链（chain\
  \ of custody）、验证数据完整性，以及法律留存（legal holds）如何影响保存要求。\n\n### 入侵指标\n\n入侵指标（`IoCs`）由收集有关活动、事件和行为的信息组成，这些信息通常与潜在恶意行为相关。组织使用各种安全工具和手动流程监控\
  \ `IoCs`，寻找能够让其检测潜在问题或及时响应活跃入侵的信息。\n\n常见的入侵指标包括但不限于以下内容：\n\n*   异常的网络流量，包括异常的出站网络流量、意外的点对点流量、指向异常端口或\
  \ IP 地址的活动以及类似事件\n*   数据库或文件共享读取卷的增加\n*   文件系统、`Windows Registry` 和配置文件的可疑更改\n*\
  \   人类使用系统时不常的流量模式\n*   登录和权限使用的异常，包括地理位置和时间上的异常\n*   拒绝服务活动和痕迹\n*   异常的 DNS 流量\n\
  \n捕、分析和关联 `IoCs` 的能力对于组织安全和事件响应至关重要，这使得 `IoC` 馈成为防御操作的重要组成部分。`IoC` 馈提供了有关威胁和威胁攻击者的社区信息，例如：\n\
  \n*   与恶意活动者或活跃威胁相关的 `IP` 地址和主机名\n*   恶意软件、命令控制服务器和受感染网站使用的域名\n*   恶意软件的哈希值（Hashes）\n\
  *   基于行为的威胁攻击和恶意软件信息\n\n你可以通过 `https://otx.alienvault.com` 探索 `IoC` 示例，在那里你可以发现数百万指标。图\
  \ 10.1 显示了 `OTX` 的仪表板。首先要注意之一是，域名可能并不真正有用——你需要了解 `apple-icloud-mx.com`，图 10.2 显示了可能由域名生成算法创建的域名的细分分析。\n\
  \n`IoC` 馈既可以商业订阅馈的形式提供，也可以作为通过 Open Exchange 发现开放免费馈源提供。与任何第三方数据一样，组织需要确定馈源以及任何使用数据的可靠性水平，并且必须考虑他们将对哪些数据采取行动、将如何使用这些数据以及如何将其集成到他们的环境中。\n\
  \n接下来我们将查看如何检测、捕获、分析和关联 `IoCs`。\n\n#### 调查 IoCs\n\n在接下来的几页中，我们将探索 `IoCs` 的示例，包括在哪里找到有关\
  \ `IoCs` 的数据以及识别它们的基本技术。由于 `IoCs` 差异很大，你应该将这一系列示例视为起点而不是完整的列表。当你查看每种类型的 `IoC` 时，考虑你可以使用哪些类型的工具和技术来捕获有关\
  \ `IoC` 的数据，你将如何判断该行为是异常但合法的流量还是可能指示入侵，以及你将分配什么样的阈值以确保可能的问题被检测并告警，同时不会让安全从业人员过载。\n\
  \n#### 异常的网络流量\n\n异常的网络流量是最常见的入侵指标之一，但由于旨在使其难以查看的对抗技术，识别它可能是一项挑战。攻击者将使用如 `TLS` 等加密协议来保护网络流量，将流量封装在看似无害的数据流中，并以其他方式隐藏其活动以避免检测。\n\
  \n一种基于网络和系统的 `IoC` 配置文件关注使用异常端口传输流量。常见服务的典型端口有详尽的文档，虽然组织可能会选择使用备用端口以允许系统运行多个独立服务，或限制默认端口扫描的影响，但在异常端口上接收流量的服务可能指示着入侵。因此，许多工具会检查网络流量并标记异常或意外的服务端口。\n\
  \n\n\n\n\n异常的通信不仅是我们在第 3 章中看到的信标行为（beaconing）。它可能包括攻击或信息收集流量，例如端口和漏洞扫描、数据中心中的点对点流量（在这些系统中本应向外通信而非相互通信），或者任何不符合典型模式的各种流量场景。与我们在这里审查的许多\
  \ IoC（入侵指示器）一样，行为和模式识别可以帮助识别异常通信。防火墙和适当的信任边界可以通过防火墙日志检测问题，并通过不允许异常流量成功穿越网络来限制影响。图\
  \ 10.3 显示了一个示例，其中攻击者已访问了数据中心中的单个系统，并正在使用该系统探测同一网络网段中的其他系统。\n\n![FIGURE 10.3 来自受损系统的探测](img/c10f003.png)\n\
  \nFIGURE 10.3 来自受损系统的探测\n\n监控出站网络流量也可以帮助识别 IoC。你可以观察到许多出站流量指标，包括以下：\n\n*   通往意外位置的流量\n\
  *   异常类型的出站流量，如 `RDP`、`SSH` 或文件传输\n*   异常流量的出站流量\n*   出站 DNS 查询\n*   针对意外域名或在信誉工具中标记为恶意的域名的\
  \ DNS 查询\n*   异常时间的出站流量\n\n### 资源使用的增加\n\n资源利用率可以通过多种方式指示攻击者采取的操作。攻击者可能会因为使用工具或程序而消耗\
  \ CPU 或内存，或者他们可能会收集数据占用更多磁盘空间。随着数据传输、扫描运行或其他活动的发生，网络使用量可能会增加。因此，基于资源使用的 IoC 通常被用于帮助识别可能指示入侵的异常行为。\n\
  \n另一个经常被引用的 IoC 是数据库读取量。它既可以是入侵的有用指标（因为异常峰值可能表明攻击者正在从数据库中收集数据），在没有关于驱动数据库使用增加的额外信息的情况下，也很难以识别其与攻击或入侵有关。\n\
  \n图 10.4 显示了来自 `PoWA`（PostgreSQL Workload Analyzer）的数据，这是一种 `Postgres` 监控工具。虽然 `PoWA`\
  \ 提供了许多数据点，但这张来自 `PoWA` 免费在线演示网站的图表提供了每秒字节块访问的可视示例。你可以看到图表中间既有缓存命中也有磁盘读取增加，然后在最后返回到基准线。\n\
  \n![FIGURE 10.4 Postgres 在 PoWA 中的的数据库读取量](img/c10f004.png)\n\nFIGURE 10.4 Postgres\
  \ 在 PoWA 中的的数据库读取量\n\n这并不意味着每次资源使用的增加都意味着存在入侵。相反，这意味着其他 IoC 通常会与资源使用指标结合起来，在共同评估时可能有助于识别入侵。\n\
  \n### 异常的用户和账户行为\n\n基于行为的 IoC 是极其强大的，因为攻击者几乎必须做一些用户、服务和系统通常不会做的事情。这意味着如果你能识别异常通信，你可能就能检测到它们。防火墙和适当的信任边界可以通过防火墙日志检测问题，并通过不允许异常流量成功穿越网络来限制影响。\n\
  \n以下是一些基于行为的 IoC 示例：\n*   异常登录时间\n*   访问敏感文件\n*   执行不常见的命令\n*   账户权限的意外更改\n\n###\
  \ 文件和配置修改\n\n文件的更改，特别是配置文件或其他对攻击者有用的其他文件，是常见的 IoC。`OSSEC`（开源主机入侵检测系统）和 `Tripwire`\
  \ 充当入侵检测系统。\n\n这是一个用户以 root 身份运行 `netcat` 的日志示例：\n\n```\n** Alert 25109428.105:\
  \ -`syslog**/var/log/syslog-ng**\n2023 Mar 11 00:03:15 example sudo:     root TTY=unknown\
  \ ; PWD=/ ; USER=root ; COMMAND=/usr/home/nc -z -v 192.168.10.1\nRule: 2100 (level\
  \ 3) -> 'Successful sudo executed'\nUser: root\nMar 11 03:14:30 example sudo:  \
  \   root\n```\n\n\n\n\n拒绝服务（DoS）攻击可以是来自单个系统的直接攻击，也可以是分布式的。分布式拒绝服务（DDoS）攻击如图 10.5\n\
  \n图 10.5 拒绝服务攻击\n\n源自你网络内部系统的拒绝服务攻击是另一种入侵陷物指示（IoC）示例。然而，它们并不总是意味着系统或设备本身已被攻破。历史上，放大攻击利用了服务漏洞来放大流量，而无需底层的服务或系统被攻破。\n\
  \n尽管 DoS 攻击可能给调查工作带来挑战，但 DoS 攻击的发生就是一种 IoC。\n\n最后，一种看起来像 DoS 攻击，但通常与漏洞利用尝试或其他非 DoS\
  \ 活动相关的 IoC，是对同一个文件或目录的重复请求。请记住，IoC 可能表现为某些其他活动，或者在发现时可能无法理解其含义。\n\n### 异常 DNS 流量\n\
  \n许多组织监控发送到其 DNS 服务器的查询，并使用威胁和信誉馈送将其与恶意站点列表进行比较。IoC 馈送可能包含活动威胁常用的特定 IP 地址和主机名，允许\
  \ DNS 查询和服务器监控帮助识别受感染的系统。\n\n监控 DNS 相关的 IoC 通常关注以下几点：\n\n*   DNS 查询的异常水平，特别是针对异常域名的查询\n\
  *   异常的域名查询，通常是针对随机生成或机器生成的主机名，如 `jku845.com`。\n*   大量的 DNS 查询失败，可能表明使用了嵌入在恶意软件中的自动生成的\
  \ DNS 名称。\n\n根据恶意软件的复杂性，与 DNS 和主机名相关的入侵指示可能在一段时间内有效，也可能随着恶意软件根据算法或命令控制更新切换新名称而快速更新。\n\
  \nDNS 隧道是另一个可以使用 IDS 和 IPS 等工具监控的潜在问题。通过 DNS 查询传输隧道命令与控制信息，或包含编码或加密数据的 DNS 查询，都是需要关注的潜在\
  \ IoC。\n\n另一种类型的异常 DNS 流量是使用快速闪（fast-flux）DNS，它可以快速更改域的 IP 地址。攻击者使用快速闪 DNS 即使在某些主机被禁用也能保持其命令控制基础设施的活跃，观察涉及快速闪\
  \ DNS 的查询将表明系统可能已被攻破——或者用户可能点击了指向恶意网站的链接！\n\n### 结合 IoC\n\n有效利用入侵指示通常需要结合多个 IoC\
  \ 的数据和分析来识别攻破行为。在攻破场景中，单个 IoC 孤立发生的较少，尽管这种情况确实发生。因此，组织寻找方法将信息和威胁馈送、日志和日志分析工具、以及\
  \ IoC 馈送和检测机制整合到一个综合系统中，该系统将保持更新，并查看多个 IoC 相加起来是否构成一个可能的攻破行为。\n\n## 证据的获取与保护\n\n\
  事件响应期间的证据获取可以采取多种形式，从制作副本或文件到获取虚拟机快照，再到使用司法文件或驱动器副本。\n\n### 保护\n\n无论数据类型和获取方法如何，证据的关键概念是`preservation`（保护）。保护数据需要获取数据、验证获取过程和数据，并以安全且记录的方式进行存储。如果证据可能用于法律诉讼，或者涉及执法部门，保护通常还需要监管链（chain-of-custody）文档记录。\n\
  \n### 监管链\n\n`chain-of-custody`（监管链）过程跟踪证据贯穿其整个生命周期，包括证据的收集、保护和分析。这需要记录谁在何时、何地、何何以及如何存储、使用或传输了数据访问权限。完整的监管链记录有助于确保数据没有被不当访问或修改。\n\
  \n### 法律留存\n\n`legal holds`（法律留存）是电子发现（eDiscovery）过程的一部分。当诉讼即将开始或正在进行时，法律顾问将向组织发布法律留存通知。受影响组织的数据保管员将收到保护数据的通知，包括可能作为正常业务流程的一部分被删除或移除的数据。组织有义务作为法律程序的一部分保护并提供这些数据。如果组织预计将面临诉讼或其他法律行动，它们也可以自己启动法律留存程序。\n\
  \n### 验证数据完整性\n\n保护活动的重要部分是验证数据完整性。为了验证捕获过程没有无意中创建更改，要确保捕获并保留的数据与原始数据匹配。虽然这对于证据和法律案件至关重要，但对于组织调查来说，确保错误数据不会引导调查人员得出错误结论同样重要。\n\
  \n数据完整性验证通常使用哈希工具完成，工具根据原始文件、卷或驱动器计算哈希值，然后使用相同的算法对复制的证据计算哈希值。这些哈希值在副本副本时会进行存储和验证，以确保使用的是匹配的副本，如图\
  \ 10.6 中的 FTK Imager 所示。\n\n![图 10.6 成功镜像后显示哈希值的 FTK Imager](img/c10f006.png)\n\n\
  图 10.6 成功镜像后显示哈希值的 FTK Imager\n\n## 总结\n\n\n\n\n\n# 描述 IoC（失陷指标）对事件检测和分析的重要性。\n\n\
  列并理解常见的 IoC，包括异常网络流量、意外的点对点流量；指向异常端口或 IP 地址的活动；数据库或文件共享读取量的增加；对文件系统、`Windows Registry`（Windows\
  \ 注册表）和配置文件的疑更改；不符合人类使用系统的典型流量模式；以及登录和权限使用的异常，包括地理和时间异常、拒绝服务活动和痕迹，以及异常的 DNS 流量。\n\
  \n# 调查并描述 IoC。\n\n描述与网络流量、资源使用、用户和账户行为、文件和配置修改、权限使用、拒绝服务以及 DNS 流量相关的 IoC。解释与每个主题相关的常见\
  \ IoC 示例，你可能如何利用这些 IoC，以及日志文件和其他证据中的哪些信息与识别失陷指标有关。\n\n# 理解证据的获取和保护。\n\n证据通常作为事件响应活动、内部调查，以及由于待决或正在进行的法律诉讼中的法律保留（legal\
  \ holds）的一部分而被获取和保护。法律保留可能要求暂停正常的数据销毁流程或程序，或限制数据寿命，或者可能需要制作独立的、可验证的副本。为了法律和警方调查会创建并维护监管链（Chain-of-custody）文档，如果调查可能成为法律程序的一部分，也可能创建此类文档。\n\
  \n# 审查日志文件并判断是否发生了事件。\n\n理解常见的日志文件以及需要寻找的内容，以确定记录的事件表明可能发生了事件，还是日志条目指示正常行为。\n\n\
  ## 实验练习\n\n### 活动 10.1：在 Alienvault 的 Open Threat Exchange 中探索 IoC\n\n在此练习中，你将探索\
  \ Alienvault Open Threat Exchange 中的 IoC 示例。\n\n1. 访问 `https://otx.alienvault.com`\
  \ 并注册账户。\n2. 登录并查看你的仪表板。注意那里有 pulses（脉冲），这是社区共享的威胁信息。\n3. 选择 Browse（浏览）并查看一个 pulse。你应该看到如\
  \ IoC 等信息，你可以点击并查看。如果没有，请选择另一个 pulse。考虑以下问题：\n    * 你将如何使用 pulse 中包含的信息？\n    *\
