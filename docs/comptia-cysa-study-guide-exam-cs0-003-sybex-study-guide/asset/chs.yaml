  \ 找到。\n\n（注：由于提供的原文中存在大量重复的段落，译文已根据“不要重复”的要求进行了去重处理）\n\n\n\n\n# 1. 机密性\n# 2. 完整性\n\
  # 3. 不可变性\n# 4. 可用性\n\n# 4. 哪种漏洞扫描方法在扫描期间能提供最准确的细节？\n\n1. 黑盒/未知环境\n2. 身份验证\n3. 内部视图\n\
  4. 外部视图\n\n# 5. 安全研究人员最近在微软 Edge 浏览器的 Chakra JavaScript 脚本引擎发现了一个漏洞，该漏洞可以通过特殊构造的网站允许远程执行或拒绝服务。该漏洞的\
  \ CVSS 3.1 分为：\n\n```\nCVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:H\n```\n\n根据此评分，攻击向量是什么？对完整性的影响是什么？\n\
  \n1. 系统，9， 8\n2. 浏览器，高\n3. 网络，高\n4. 无，高\n\n# 6. Alice 是一名安全工程师，负责为她的组织执行漏洞扫描。她在其中一次扫描中遇到了误报（false\
  \ positive）错误。她应该如何处理？\n\n1. 确认这是一个误报，然后记录该异常。\n2. 实施变通方案。\n3. 更新漏洞扫描器。\n4. 使用身份验证扫描，然后记录该漏洞。\n\
  \n# 7. 事件响应过程中的哪个阶段最可能包含收集额外证据（如支持法律行动的信息）？\n\n1. 准备\n2. 检测与分析\n3. 抑制、根除与恢复\n4.\
  \ 事后活动与报告\n\n# 8. 下列描述中哪项解释了完整性丢失？\n\n1. 系统下线，导致业务收入损失。\n2. 敏感或专有信息被更改或删除。\n3. 受保护的信息被访问或外泄。\n\
  4. 敏感的个人身份信息被访问或外泄。\n\n# 9. Hui 的事件响应计划使用指标来判断其对 IoC（入侵指标）馈的订阅和使用是否符合组织需求。如果 Hui\
  \ 想评估他们对 IoC 馈的使用，以下哪种事件响应指标最有用？\n\n1. 告警量指标\n2. 平均响应时间指标 (MTTR)\n3. 平均检测时间指标 (MTTD)\n\
  4. 平均修复时间指标\n\n# 10. Abdul 的监控检测到，一个怀疑已被入侵并参与僵尸网络的系统正在向一组远程 IP 地址发送定期流量。这被称为什么？\n\
  \n1. 异常 Ping\n2. 探测\n3. 僵尸闲聊 (Zombie chatter)\n4. 信标行为 (Beaconing)\n\n# 11. 使用哪种行业标准来描述风险评分？\n\
  \n1. CRS\n2. CVE\n3. RSS\n4. CVSS\n\n# 12. 使用哪个术语来描述保留待决或进行中的诉讼相关的数据和信息？\n\n1. 保护\
  \ (Preservation)\n2. 法律留存 (Legal hold)\n3. 刑事留存 (Criminal hold)\n4. 取证存档 (Forensic\
  \ archiving)\n\n# 13. 在取证调查期间，Maria 发现了犯罪已发生的证据。组织通常会做什么来确保执法部门可以使用数据起诉犯罪？\n\n1.\
  \ 安全擦除驱动器以防止进一步问题\n2. 为取证数据记录监管链（chain of custody）\n3. 仅在原始存储介质上进行取证调查\n4. 立即实施法律留存\n\
  \n# 14. Oscar 的经理要求他确保被入侵的系统已完全清除入侵残留。Oscar 的最佳行动方案是什么？\n\n1. 使用杀病毒工具移除任何相关的恶意软件。\n\
  2. 使用反恶意软件工具完全扫描并清理系统。\n3. 擦除并重建系统。\n4. 恢复最近的备份。\n\n# 15. 下列哪项操作不是事件响应过程中恢复阶段的常见活动？\n\
  \n1. 审查账户并添加新权限\n2. 验证系统上只有授权的用户账户\n3. 验证所有系统是否正在正常记录日志\n4. 对所有系统进行漏洞扫描\n\n# 16.\
  \ 像“工作站必须……”之类的陈述可能是哪份文档的一部分？\n\n1. 策略 (Policies)\n2. 标准 (Standards)\n3. 规程 (Procedures)\n\
  4. 指南 (Guidelines)\n\n# 17. 防火墙是哪种类型控制示例？\n\n1. 预防性 (Preventive)\n2. 检测性 (Detective)\n\
  3. 响应性 (Responsive)\n4. 纠正性 (Corrective)\n\n# 18. Cathy 想要收集入侵指标（IoC）。以下哪项不是常见的？\n\
  \n1. 带宽消耗\n2. 网络攻击\n3. 计划更新\n4. 意外流量\n\n# 19. Nick 想要分析恶意软件。以下哪项最合适？\n\n1. Strings（字符串）\n\
  2. SIEM\n3. VirusTotal\n4. Cuckoo\n\n# 20. 哪种软件开发模型使用线性开发？\n\n1. 瀑布模型 (Waterfall)\n\
  2. 敏捷模型 (Agile)\n3. RAD\n4. 螺旋模型 (Spiral)\n\n## 测试答案\n\n1. **C**。蜜罐（Honeypots）是设计成看起来是有吸引力的目标。当受到攻击时，它们为防御者提供了观察攻击者如何操作的机会。`sinkholes`（陷洞）向恶意软件提供虚假信息，重定向关于命令与控制（C&C）系统的查询。`darknets`（暗网）是未使用的空间段，通过监控来检测流量。`Crackpots`\
  \ 是古怪的人——不是你 de 遇到的系统。\n2. **A**。冗余系统，特别是当在多个位置运行并采取其他确保可用性的保护时，可以帮助可用性。\n3. **B**。身份验证（或凭据）扫描提供了系统最详细的视图。黑盒评估假设对系统一无所知，且没有凭据或代理与系统交互。内部视图通常比外部视图提供更多细节，但两者都没有提供凭据允许的相同详细程度。\n\
  4. **C**。读取 CVSS 评分时，`AV` 是攻击向量。在这里，`N` 表示网络。机密性（C）、完整性（I）和可用性（A）列在最后，这三项在此 CVSS\
  \ 评分中都被评为“高”。\n5. **A**。当 Alice 在扫描中遇到误报错误时，她的首要行动应该是验证它。这可能涉及运行更深入扫描（如身份验证扫描），但也可能涉及寻求系统管理员的帮助、检查文档或其他验证操作。完成后，她应该记录该异常以便妥善跟踪。\n\
  \n\n\n\n7. C. 事件的**包含、根除和恢复**阶段包括限制损害和记录已发生情况的步骤，包括可能识别攻击者及其用于攻击的工具。这意味着法律行动所需的有用信息最有可能在此阶段收集。要了解更多关于此主题的信息，请参阅第\
  \ 9 章。\n\n8. B. 完整性破坏涉及数据被修改或删除。系统离线是一个可用性问题，受保护的信息被访问可能被归类为专有信息泄露，而敏感的个人身份信息泄露通常被归类为隐私泄露。要了解更多关于此主题的信息，请参阅第\
  \ 9 章。\n\n9. C. IoC（入侵指标）用于改进检测，慧 知道收集平均检测时间指标将帮助组织确定其对 IoC 馈的使用是否提高了检测速度。告警量由告警的配置和维护驱动，它无法判断\
  \ IoC 的使用是否恰当。响应时间和修复时间更适合用于衡量组织的流程和程序。要了解更多关于此主题的信息，请参阅第 12 章。\n\n10. D. 从受损系统到命令与控制节点的定期流量被称为“信标行为”（beaconing）。异常\
  \ ping 可以描述意料的 ping，但它们通常不是僵尸行为的一部分，“僵尸聊天”（zombie chatter）是一个虚构的术语，而探测在某些情况下是扫描行为的一部分。要了解更多关于此主题的信息，请参阅第\
  \ 4 章。\n\n11. D. 通用漏洞评分系统（CVSS）用于对风险进行评分和描述。CVE（常见漏洞和披露）对漏洞进行分类。RSS（实时简单摘要聚合）用于创建网站的馈送。CRS\
  \ 是为了本题而虚构的。要了解更多关于此主题的信息，请参阅第 12 章。\n\n12. B. `legal hold`（法律保留）一词用于描述保留与待决或活跃的法律调查相关的数据和信息。保护（Preservation）是一个更广泛的术语，用于描述出于各种原因（包括业务需求）而保留数据。刑事保留（Criminal\
  \ hold）和取证存档（forensic archiving）是为了本题而虚构的。要了解更多关于此主题的信息，请参阅第 13 章。\n\n13. B. 记录适当的监管链（chain\
  \ of custody）将使执法部门更有可能在法庭成功使用取证数据。擦除驱动器会导致数据丢失，取证检查是在副本而非原始驱动器上进行的，法律保留是为了在诉讼发生或可能发生时保护数据。\n\
  \n14. C. 确保系统不再处于受损状态最万无一失的方法是对进行擦除并重建。在完全不知道受损何时发生的情况下，恢复备份可能没有帮助，而且反恶意软件和防病毒软件包并不能总是确保没有残留的受损，特别是当攻击者创建了账户或进行了其他不会被检测为恶意软件的更改。要了解更多关于此主题的信息，请参阅第\
  \ 11 章。\n\n15. A. 恢复阶段通常不寻求添加新权限。验证仅存在合法账户、所有系统都正确记录日志以及系统已进行漏洞扫描都是事件响应恢复阶段的共同部分。要了解更多关于此主题的信息，请参阅第\
  \ 11 章。\n\n16. B. 该陈述最可能是标准的一部分。策略包含管理意图的高层陈述；标准为策略的执行提供强制性要求，包括如问题中提供的此类陈述。程序（procedure）将包含逐步执行的过程，而指南（guideline）描述了最佳实践或建议。要了解更多关于此主题的信息，请参阅第\
  \ 8 章。\n\n17. A. 防火墙的主要目的是在恶意流量进入网络之前将其拦截，从而防止安全事件发生。因此，它最好被归类为预防性控制。要了解更多关于此主题的信息，请参阅第\
  \ 8 章。\n\n18. C. 网络连接设备上的计划更新是正常活动。潜在恶意活动的常见指标包括带宽消耗、信标行为、不规则的点对点通信、非法设备、扫描、异常的流量激增以及意外端口上的活动。要了解更多关于此主题的信息，请参阅第\
  \ 3 章。\n\n19. D. Cuckoo Sandbox（布谷沙箱）是潜在答案列表中唯一在本地安装并运行的沙箱，它通过在安全的沙箱环境中运行来分析潜在的恶意软件。要了解更多关于此主题的信息，请参阅第\
  \ 3 章。\n\n20. D. 螺旋模型（Spiral model）使用了类似于瀑布模型的线性开发概念，但在其生命周期中重复四个阶段：需求收集、设计、构建和评估。要了解更多关于此主题的信息，请参阅第\
  \ 8 章。\n\n# 领域 I\n\n## 安全运营\n\n# 第 1 章\n\n## 网络安全分析师\n\n网络安全分析师负责保护其组织信息和信息系统的机密性、完整性和可用性。履行这一责任需要对信息安全采取深度防御方法，使用多个重叠的安全控制措施来实现每个网络安全目标。它还要求分析师对组织面临的威胁环境有深入的理解，以便开发出一能够应对并解决这些威胁的控制措施。\n\
  \n在本章的第一部分，你将学习如何评估组织面临的网络安全威胁，并确定它们对操作机密性、完整性和可用性构成的风险。在后续章节中，你将学习可以采取的控制措施来保护网络和终端，并随着时间的推移评估这些控制措施的有效性。\n\
  \n## 网络安全目标\n\n当大多数考虑到网络安全时，他们会想象黑客试图入侵组织的系统并窃取敏感信息，从社会安全号码、信用卡到机密军事信息。虽然保护敏感信息免受未经授权的泄露无疑是安全计划的一个要素，但理解网络安全实际上有三个互补的目标很重要，如图\
  \ 1.1\n\n**图 1.1** 网络安全的三个关键目标是机密性、完整性和可用性。\n\n机密性确保个人无法访问敏感信息。网络安全专业开发并实施安全控制，包括防火墙、访问控制列表和加密，以防止对信息的非法访问。攻击者可能试图破坏机密性控制措施来实现其目标之一：敏感信息的未经授权泄露。\n\
  \n完整性确保信息或系统没有发生未经授权的修改，无论是故意还是无意的。完整性控制（如哈希和完整性监控解决方案）旨在执行这一要求。完整性威胁可能来自寻求未经授权的更改信息的攻击者，也可能来自非恶意来源，例如电压波动导致信息损坏。\n\
  \n\n\n可用性确保信息和系统在合法用户请求时能够准备就绪以满足其需求。可用性控制（如容错、聚类和备份）旨在确保合法用户可以根据需要获得访问。与完整性威胁类似，可用性威胁可能源于寻求破坏访问的攻击者，也可能来自非恶意源，例如火灾摧毁了包含宝贵信息或服务的数据中心。\n\
  \n网络安全分析师在执行工作时经常会提到这三个目标，即`CIA 三要素模型`（CIA Triad）。在描述风险、攻击和安全控制时，他们通常将其描述为符合 `CIA\
  \ 三要素模型` 的某一个或多个目标。\n\n## 隐私 vs 安全\n\n`隐私`与安全是两个密切相关的概念。我们刚刚讨论了安全的三个主要组成部分：机密性、完整性和可用性。这些目标都关注组织保护其自身数据的方法。机密性保护数据免受未经授权的泄露。完整性保护数据免受未经授权的修改。可用性保护数据免受未经授权的拒绝访问。\n\
  \n隐私控制的重点不同。隐私并不关注组织保护自身信息的方法，而是关注组织如何使用和共享其收集的关于个人的信息。这些数据被称为`个人身份信息 (PII)`，通常受到监管标准的保护，并始终受伦理考量的约束。组织寻求保护隐私信息的安全，并可能使用与其保护其他类别敏感信息相同的安全控制，但隐私义务超出了纯安全的范畴。隐私涵盖了组织如何与他人使用和共享其收集并维护的信息。\n\
  \n`通用接受隐私原则 (GAPP)` 概述了组织应努力遵循的 10 隐私实践：\n\n*   **管理**指出，组织应该在隐私政策和相关文档中记录其隐私实践。\n\
  *   **通知**指出，组织应该就其隐私实践通知个人，并告知个人其收集了哪些类型的信息以及如何使用这些信息。\n*   **选择与同意**指出，组织应对 `PII`\
  \ 进行存储、使用和共享前获得个人的直接同意。\n*   **收集**指出，组织仅应为通知中说明的且经个人同意的目的收集 `PII`。\n*   **使用、留存与处置**指出，组织应仅为确定的目的使用信息，不得将为某一声明目的收集的信息用于任何其他未披露的目的。\n\
  *   **访问**指出，组织应根据个人请求，允许其访问组织记录中关于该个人的任何信息。\n*   **披露**指出，组织仅在符合通知和同意的情况下才会向第三方披露信息。\n\
  *   **安全**指出，`PII` 将受到保护以免受未经授权的访问。\n*   **质量**指出，组织将维护准确且完整的信息。\n*   **监控与执行**指出，组织将建立业务流程以确保其符合其隐私政策。\n\
  \n`GAPP` 原则则是构建隐私计划的强大最佳实践。在某些司法管辖区和行业，隐私法律要求实施其中几项原则。例如，欧盟（EU）的《通用数据保护条例》（`GDPR`）要求处理欧盟居民数据的组织必须以符合隐私要求的方式处理个人信息。\n\
  \n## 评估安全风险\n\n网络安全风险分析是任何信息安全计划的基石。分析师必须花时间彻底自己的技术环境以及危及其信息安全的外部威胁。全面的网络安全风险评估结合了内部和外部因素的信息，帮助分析师理解组织面临的威胁，并设计一套适当的控制措施应对这些威胁。\n\
  \n在深入风险评估的世界之前，我们必须从通用词汇开始。你必须了解三个重要术语以便与其他风险分析师进行清晰沟通：漏洞、威胁和风险。\n\n`漏洞`（vulnerability）是设备、系统、应用程序或流程中的弱点，可能导致攻击的发生。漏洞是网络安全专业人员可以控制的内部因素。例如，运行旧版本\
  \ `Apache` 服务的 Web 服务器可能包含漏洞，允许攻击者对该服务器托管的网站进行拒绝服务（`DoS`）攻击，从而危及其可用性。组织内部的网络安全专业人员有能力通过将\
  \ `Apache` 服务升级到不再易受 `DoS` 攻击的最新版本来修复此漏洞。\n\n网络安全世界中的`威胁`（threat）是指可能利用漏洞的外部力量。例如，一个想要对网站进行\
  \ `DoS` 攻击并已知 `Apache` 漏洞的黑客构成了明确的网络安全威胁。虽然许多威胁在本质上是恶意的，但情况并非如此。例如，地震也可能通过破坏包含 Web\
  \ 服务器的数据中心来破坏网站的可用性。地震显然没有敌意。在大多数情况下，网络安全专业人员对消除威胁为不了多少。无论我们意愿如何，黑客都会进行攻击，地震也会发生。\n\
  \n`风险`（risk）是威胁与相应漏洞的结合。只有当这两个因素同时存在时，这种情况才会对组织安全构成风险。例如，如果黑客利用 `DoS` 攻击目标组织的 Web\
  \ 服务器，但该服务器已修补，对该攻击不敏感，那么就没有风险，因为虽然存在威胁（黑客），但没有漏洞。同样，一个数据中心可能对地震敏感，因为墙墙的建造无法抵御地震期间的极端移动，但它可能位于一个不发生地震的地区。该数据中心可能对地震敏感，但其所在地几乎完全没有地震威胁，因此没有风险。\n\
  \n风险、威胁和漏洞之间的关系是非常重要的，通常用以下等式表示：\n\n```\n风险 = 威胁 × 漏洞\n```\n\n这并不是一个让你实际代入数值的字面方程。相反，它是为了证明这样一个事实：只有当存在威胁以及威胁可能利用的相应漏洞时，风险才存在。如果威胁或漏洞其中之一为零，风险也为空。图\
  \ 1.2 以另一种方式展示了这一点：风险是威胁与漏洞的交集。\n\n\n\n\n# 风险评估\n\n风险存在于威胁与漏洞的交叉点。如果缺少威胁或漏洞中的任何一个，就不存在风险。\n\
  \n组织应定期进行风险评估，以掌握现有的风险状况。美国国家标准与技术研究所（`NIST`）发布了一份风险评估指南，该指南在整个网络安全领域被广泛用作风险评估的基础。该文档命名为\
  \ `NIST 特别出版 (SP) 800-30`，建议了如图 1.3 所示的风险评估流程。\n\n![图 1.3 NIST SP 800-30 风险评估流程建议组织应当识别威胁和漏洞，然后利用这些信息确定由这些威胁和漏洞组合构成的风险水平。来源：NIST\
  \ SP 800-30 / 美国商务部 / 公有领域](img/c01f003.png)\n\n图 1.3 NIST SP 800-30 风险评估流程建议组织应当识别威胁和漏洞，然后利用这些信息确定由这些威胁和漏洞组合构成的风险水平。来源：NIST\
  \ SP 800-30 / 美国商务部 / 公有领域\n\n## 识别威胁\n\n组织通过识别环境中存在的威胁类型来开始风险评估过程。虽然某些威胁（如恶意软件和垃圾邮件）会影响所有组织，但其他威胁针对特定类型。例如，政府资助的高级威胁\
  \ (`APT`) 攻击者通常针对政府机构以及在相关领域运营的公司。\n\n`NIST` 识别了组织可能面临且在威胁识别过程中应考虑的四类威胁：\n\n- 敌性威胁（Adversarial\
  \ threats）：是指试图蓄意破坏组织安全的个人、团体和组织。对手可能包括受信任的内部人员、竞争对手、客户、业务伙伴，甚至是国家。在评估敌性威胁时，网络安全分析师应考虑威胁者发起攻击的能力、威胁者的意图，以及该威胁针对该组织的概率。\n\
  - 意外威胁（Accidental threats）：当个人在执行日常工作时误操作了损害安全的行动时发生。例如，系统管理员可能会不小心删除关键卷，导致可用性丢失。在评估意外威胁时，网络安全分析师应考虑该威胁对组织可能产生的影响范围。\n\
  - 结构性威胁（Structural threats）：当设备、软件或环境控制因资源耗尽（如燃料耗尽）、超出其运行能力（如在极热下运行）或简单地由于老化而故障时发生。结构性威胁可能来自\
  \ IT 组件（如存储器、服务器和网络设备）、环境控制（如电源和冷却）以及软件（如操作系统和应用程序）。在评估结构性威胁时，网络安全分析师应考虑该威胁对组织可能产生的影响范围。\n\
  - 环境威胁（Environmental threats）：当发生组织无法控制的自然灾害或人为灾难时发生。这些可能包括火灾、洪水、严重风暴、停电或广泛的电信中断。在评估环境威胁时，网络安全分析师应考虑其所在地理区域常见的环境威胁，以及如何恰善地预防或应对人为威胁。\n\
  \n这些类别中威胁的性质和范围将取决于组织的性质、其技术基础设施的组成以及许多其他特定情况的因素。尽管如此，获取其他相似组织执行的风险评估副本，作为组织自身风险评估的起点，或在组织评估的各个阶段作为质量评估检查点，可能会有所帮助。\n\
  \n## 识别漏洞\n\n在风险评估的威胁识别阶段，网络安全分析师专注于可能影响组织安全努力的外部因素。在完成威胁识别后，评估的重点转向内部，识别那些威胁可能利用以破坏组织机密性、完整性或可用性的漏洞。\n\
  \n本书的第 6 章](#c06.xhtml)“设计漏洞管理计划”和第 7 章](#c07.xhtml)“分析漏洞扫描”重点关注了漏洞的识别和管理。\n\n##\
  \ 确定可能性、影响和风险\n\n在识别了组织面临的威胁和漏洞后，风险评估人员接下来寻找威胁与漏洞的组合，这些组合会对企业信息和系统的机密性、完整性或可用性构成风险。这需要评估风险发生的概率，以及在风险确实发生时对组织产生的影响。\n\
  \n在确定风险发生的概率时，分析师应考虑两个因素。首先，他们应该评估威胁源引发风险的概率。在对于敌性威胁源的情况下，这是对手对组织执行攻击的概率。对于意外、结构性或环境威胁，这是威胁发生的概率。第二个贡献因素是，在考虑到组织安全控制措施状态的情况下下，如果风险发生，它是否真的会对组织产生不利影响。在考虑了这些每一个标准后，风险评估人员分配一个整体可能性评分。这可以使用一些类别（如“低”、“中”和“高”）来定性地描述可能性。\n\
  \n风险评估人员使用类似的评分量表来评估风险的影响。这种评估应该假设威胁确实发生并给组织带来风险，然后尝试识别该风险对组织产生不利影响的程度。在评估此风险时，有助于参考图\
  \ 1.1 所示的网络安全三大目标：机密性、完整性和可用性，然后评估风险对这些目标中每一个目标产生的影响。\n\n在评估了风险的可能性和影响后，风险评估人员随后结合这两项评估来确定整体风险评分。这可能简单地使用一个类似于图\
  \ 1.4 所示的矩阵，该矩阵描述了组织如何为风险分配整体评分。例如，组织可能会认为黑客攻击的可能性为中等，而影响将是高的。在图 1.4 中查找此组合，可以发现它应该被认为是高整体风险。同样，如果组织评估洪水的可能性为中等而影响为低，那么洪水场景的整体风险就是低风险。\n\
  \n![图 1.4 许多组织使用风险矩阵根据可能性和影响评估来确定整体风险评分](img/c01f004.png)\n\n\n\n\n\n图 1.4 许多组织使用风险矩阵根据可能性和影响评估来确定整体风险评分。\n\
  \n## 审查控制措施\n\n网络安全专业人员使用风险管理策略（例如风险接受、风险规避、风险缓解和风险转移），来降低风险评估期间识别出的风险的概率和影响。组织管理安全风险的最常见方法是开发一套技术和操作安全控制措施，将这些风险降低到可接受的水平。\n\
  \n技术控制措施是用于执行机密性、完整性和/或可用性要求的系统、设备、软件和设置。技术控制措施的示例包括构建安全网络和实施端点安全，这两个主题将在本章的后续部分进行讨论。操作控制措施是增强网络安全的实实践和程序。操作控制措施的示例包括进行渗透测试以及使用反向工程来分析获取的软件。这两个主题也会在本章的后续部分进行讨论。\n\
  \n## 构建安全网络\n\n许多针对组织网络安全的威胁是利用组织网络中的漏洞来获取对系统和信息的初始访问。为了帮助缓解这些风险，组织应该专注于构建安全的网络以将攻击者拒之门。组织可能用于有助于构建安全网络的控制措施示例包括：网络访问控制（NAC）解决方案；网络边界安全控制措施（如防火墙）；网络分段以及使用欺骗技术作为防御措施。\n\
  \n### 网络访问控制\n\n大多数组织设定的基本安全目标之一是控制对组织网络的访问。网络访问控制（NAC）解决方案帮助安全专业人员实现两个网络安全目标：将网络访问限制在授权的人员范围内，并确保访问组织网络的系统符合基本安全要求。\n\
  \n`802.1X` 协议是用于 NAC 的常用标准。当新设备希望获得网络访问时（通过连接到无线接入点还是插到有线网络端口），网络都会要求该设备使用 `802.1X`\
  \ 协议进行身份验证。一种被称为“ supplic 方”（supplicant）的特殊软件运行在请求加入网络的设备上。 supplic 方与名为“认证器”（authenticator）的服务通信，认证器运行在无线接入点或网络交换机上。认证器不具备验证用户本身所需的信息，因此它通过远程拨号用户服务（`RADIUS`）协议将访问请求传递给认证服务器。如果用户身份验证通过并被授权访问网络，交换机或接入点会将该用户接入网络。如果用户未成功完成此过程，设备将被拒绝访问网络，或者可能被分配到一个特殊的隔离网络进行修复。图\
  \ 1.5 显示了参与 `802.1X` 身份验证的设备。\n\n![图 1.5 在 802.1X 系统中，尝试加入网络的设备运行 NAC supplicant，该\
  \ supplicant 与网络交换机或无线接入点上的认证器通信。认证器使用 RADIUS 与认证服务器通信。](img/c01f005.png)\n\n图 1.5\
  \ 在 `802.1X` 系统中，尝试加入网络的设备运行 NAC supplicant，该 supplicant 与网络交换机或无线接入点上的认证器通信。认证器使用\
  \ `RADIUS` 与认证服务器通信。\n\n市场上上有许多 NAC 解决方案，它们在两个主要方面有所不同：\n\n*   **基于代理 vs. 无代理（Agent-Based\
  \ vs. Agentless）**：基于代理的解决方案（如 `802.1X`）要求请求访问网络的设备运行专门用于与 NAC 服务通信的特殊软件。无代理 NAC\
  \ 方法在 Web 浏览器中进行身份验证，不需要特殊软件。\n*   **带内 vs. 带外（In-Band vs. Out-of-Band）**：带内（或内联式）NAC\
  \ 解决方案使用位于设备与其想要访问的资源之间的专用设备。它们拒绝或限制未通过 NAC 身份验证过程设备的网络访问。酒店中常见的“强制门户”（captive portal）NAC\
  \ 解决方案会在客客输入房号之前劫持所有 Web 请求，这些都是带内 NAC 的示例。带外 NAC 解决方案（如 `802.1X`）利用现有的网络基础设施，让网络设备与认证服务器通信，然后根据需要重新配置网络以授予或拒绝网络访问。\n\
  \nNAC 通常仅用于根据用户成功身份验证来限制授权用户的访问，但它们也可能根据其他标准做出网络准决策。NAC 解决方案使用的一些标准如下：\n\n*   **时间段**：用户可能仅在特定时间段内（如工作时间内）被授权访问网络。\n\
  *   **角色**：用户可能根据其在组织中的角色被分配到特定的网络段。例如，大学可能会将教职员工和工作人员分配到管理网络（该网络可以访问管理系统），而将学生分配到学术网络（该网络不允许此类访问）。\n\
  *   **地理位置**：用户可能根据其物理位置被授予或拒绝对网络资源的访问。例如，对数据中心网络的访问可能仅限于物理上位于数据中心内的系统。\n*   **系统健康状况**：NAC\
  \ 解决方案可以使用运行在设备上的代理来获取设备的配置信息。未能达到最低安全标准的设备（例如：主机防火墙配置错误、病毒定义过时或缺少安全补丁的设备）可能会被完全拒绝网络访问，或被放置在特殊的隔离网络中，在该网络中它们仅被授予更新系统安全所需的有限访问权限。\n\
  \n管理员可以创建 NAC 规则，根据这些特征的任何组合来限制访问。NAC 产品提供了实施组织特定网络接入安全要求的所需的活性。\n\n### 防火墙与网络安全\n\
  \nNAC 解决方案旨在管理直接连接到组织有线或无线网络的系统。对于那些试图通过物理访问设施并连接设备到物理网络来获取组织信息资源的入侵者，它们提供了极佳的保护。但它们无法防止试图通过网络连接获取访问的入侵者。这就是防火墙发挥作用的地方。\n\
  \n网络防火墙位于网络边界处并提供边界安全。就像安全员可能控制建筑的物理边界一样，网络防火墙控制着电子边界。防火墙通常以图 1.6 所示的三宿方式进行配置。三宿简单意味着防火墙连接到三个不同的网络。图\
  \ 1.6](#c01.xhtml#c01-fig-0006)中的防火墙连接到互联网、内部网络以及一个被称为非军事化区（`DMZ`）或筛选子网的特殊网络。任何想要从一个区域通过另一个区域的流量（例如从互联网到内部网络）都必须经过防火墙。\n\
  \n![图 1.6 三宿防火墙连接到三个不同的网络，通常是内部网络、筛选子网和互联网。](img/c01f006.png)\n\n\n\n\n\n**图 1.6**\
  \ 三网防火墙连接到三个不同的网络，通常是内部网络、受保护子网和互联网。\n\n受保护子网是一个特殊的网络区域，旨在容纳接收来自外部连接的系统，例如 Web 服务器和电子邮件服务器。良好的防火墙设计会将这些系统放置在隔离网络中，这样即使它们被攻破，对内部网络的威胁也很小，因为受保护子网与内部网络之间的连接必须经过防火墙，并受其安全策略的限制。\n\
  \n每当防火墙接收到连接请求时，它都会根据防火墙规则库进行评估。该规则库是一个访问控制列表 (ACL)，用于识别允许通过防火墙的流量类型。防火墙使用的规则通常指定流量的源\
  \ IP 和目的 IP 地址，以及对应授权服务的目的端口。常见端口列表出现在表 1.1 中。防火墙遵循默认拒绝原则，即如果没有显式允许某连接的规则，防火墙将拒绝该连接。\n\
  \n**表 1.1**]常见 TCP 端口\n\n| 端口 || 服务 |\n| --- | --- |\n| 20,21 || FTP |\n| 22 ||\
  \ SSH |\n| 23 || Telnet |\n| 25 || SMTP |\n| 53 || DNS |\n| 80 || HTTP |\n| 110\
  \ || POP3 |\n| 123 || NTP |\n| 143 || IMAP |\n| 389 || LDAP |\n| 443 || HTTPS |\n\
  | 636 || LDAPS |\n| 1433 || SQL Server |\n| 1521 || Oracle |\n| 1723 || PPTP |\n\
  | 3389 || RDP |\n\n如今市场上上有几类防火墙，它们在价格和功能上不相同：\n\n*   包过滤防火墙仅根据防火墙规则检查每个数据包的特征，不具备任何额外的智能。包过滤防火墙的功能通常位于路由器和其他网络设备中，是非常基础的防火墙。\n\
  *   状态检测防火墙超越了包过滤器，并维护着通过防火墙的每个连接的状态信息。这些是作为独立产品出售的最基本的防火墙。\n*   下一代防火墙 (NGFW) 在其决策过程中整合了更多信息，包括关于用户、应用程序和业务流程的上下文信息。它们是目前网络防火墙保护的最先进技术，与状态检测设备相比，价格相当昂贵。\n\
  *   Web 应用防火墙 (WAF) 是专用防火墙，旨在防御 Web 应用程序攻击，例如 SQL 注入和跨站脚本。\n\n### 网络分段\n\n防火墙使用名为\
  \ `network segmentation`（网络分段）的原理将不同安全级别的网络相互隔离开。这一原理显然适用于图 1.6 所示的示例，其中内部网络、受保护子网和互联网具有不同的安全级别。\n\
  \n\n\n\n\n操作系统是极其复杂的软件，旨在执行成千上万种不同的功能。构成现代操作系统的庞代码库是漏洞的频繁来源，操作系统厂商频繁发布的安全补丁证明了这一点。\n\
  \n系统管理员保护端点的最重要的方法之一是对其配置进行加固，使其尽可能地抵御攻击。这包括禁用端点上任何不必要的服务或端口以减少其对攻击的易敏感性，确保设备上存在安全配置设置，并集中控制设备安全设置。\n\
  \n### 补丁管理\n\n系统管理员必须维护其所负责的所有操作系统和应用程序的最新安全补丁水平。一旦厂商发布安全补丁，攻击者可能已经获知漏洞，并可能立即开始攻击易受影响的系统。组织等待应用安全补丁的时间越长，落入攻击的概率就越大。尽管如此，企业在将补丁部署到生产系统和网络之前，应该始终进行测试。\n\
  \n幸运的是，补丁管理软件便于在整个企业集中分发和监控系统的补丁水平。例如，微软的`Endpoint Manager`允许管理员快速查看企业系统的补丁状态，并修复任何缺失补丁的系统。\n\
  \n### 组策略\n\n组策略为管理员提供了一种高效的方法，用于管理大量设备的安全和其他系统配置设置。微软的组策略对象（`GPO`）机制允许管理员一次性定义安全设置组，然后将这些设置应用于企业中的所有系统或基于角色的系统组。\n\
  \n例如，图 1.8\n\n`图 1.8` 组策略对象（GPOs）可用于同时应用于许多不同的系统。\n\n## 渗透测试\n\n网络安全分析师除了负责安全控制的设计和实施外，还负责监控这些控制的持续有效性。渗透测试是他们履行这一义务使用的技巧之一。在渗透测试期间，测试人员使用真实攻击者可使用的相同信息、工具和技术对组织模拟攻击。他们试图获取系统和信息的访问权限，然后向管理层报告他们的发现。渗透测试的结果可能用于增强组织的安全控制。\n\
  \n渗透测试可以由组织的内部人员或外部顾问进行。在内部测试的情况下，它们需要高技能的人员且非常耗时。外部测试缓解了这些担忧，但执行通常非常昂贵。尽管渗透测试存在这些障碍，组织也应尝试定期进行测试，因为一个设计良好且执行良好的渗透测试是衡量组织网络安全状况的最佳措施之一。\n\
  \nNIST 将渗透测试分为图 1.9 所示的四个阶段。\n\n![图 1.9 NIST 将渗透测试分为四个阶段。 来源：NIST SP 800-115 / 美国商务部\
  \ / 公有领域](img/c01f009.png)\n\n`图 1.9` NIST 将渗透测试分为四个阶段。 来源：NIST SP 800-115 / 美国商务部\
  \ / 公有领域\n\n### 渗透测试规划\n\n渗透测试的规划阶段为测试奠定了行政基础。在规划阶段不进行任何技术工作，但它是任何渗透测试的关键组成部分。在规划阶段需要确定以下三个重要的交战规则：\n\
  \n-   **时机**：测试将在何时进行？技术人员会获知测试吗？能否安排时间，使其对业务运营的影响降至最低？\n-   **范围**：渗透测试的约定范围是什么？是否有任何系统、网络、人员或业务流程是测试人员的禁区？\n\
  -   **授权**：谁授权进行渗透测试？如果测试人员遇到员工或其他个人，他们应该怎么办？\n\n这些细节具有行政性质，但事先通过书面形式达成共识非常重要，以避免在渗透测试期间和之后出现问题。\n\
  \n### 执行发现\n\n渗透测试的技术工作开始于发现阶段，此时攻击者进行侦察，并尽可能地收集有关目标网络、系统和应用程序的信息。这可能包括对可用材料进行审查、对系统进行端口扫描、使用网络漏洞扫描器和\
  \ Web 应用程序测试器探测漏洞，以及进行其他信息收集。\n\n### 执行渗透测试\n\n在攻击阶段，渗透测试人员试图绕过组织的安全控制并获取系统和应用程序的访问。测试人员通常遵循图\
  \ 1.10 所示的 NIST 攻击过程。\n\n![图 1.10 渗透测试的攻击阶段使用循环过程获取脚点并利用其在目标组织内扩大访问。 来源：NIST SP\
  \ 800-115：信息安全测试与评估技术指南](img/c01f010.png)\n\n在此过程中，攻击者利用发现阶段收集的信息获取系统的初始访问权限。一旦建立了脚点，他们就会寻求提升访问权限，直到获得系统的完全管理控制。从那里开始，他们可以扫描网络上的其他系统，安装额外的渗透测试工具，并重新开始循环，以扩大他们在目标组织内的足迹。他们继续这种循环，直到耗尽所有可能性或分配测试的时间结束。\n\
  \n### 汇报渗透测试结果\n\n\n\n\n在渗透测试结束后，测试人员会准备一份详细的报告，说明他们所获得的访问权限以及为了获得这些权限而利用的漏洞。渗透测试的结果是非常具价值的安全规划工具，因为它们描述了攻击者可能利用的、获取网络访问权限的实际漏洞。渗透测试报告通常包含详细的附录，其中包含了各种测试的结果，并可能与负责修复这些问题的系统管理员共享。\n\
  \n### 培训与练习\n\n除了进行渗透测试外，一些组织还选择运行攻防演习（wargame）练习，在网络防御场景下让安全专业人员团队之间进行相互竞争。这些练习通常在模拟环境中进行，而不是在生产网络上，旨在通过让安全人员接触攻击者所使用的工具和技术，来提高双方的专业技能。大多数网络安全攻防演习涉及三支团队：\n\
  \n*   红队扮演攻击者的角色，使用侦察和利用工具尝试获取受保护网络的访问。红队的工作与渗透测试期间测试人员的工作相似。\n*   蓝队负责保护目标环境，通过构建、维护和监控一套全面的安全控制措施将红队隔在之外。\n\
  *   白队负责协调演习并担任裁判，调解团队之间的争议，维护技术环境并监控结果。\n\n网络安全攻防演习可以是教育安全专业人员掌握现代攻防战术的有效方式。\n\n\
  ## 逆向工程\n\n在许多情况下，供应商不会发布硬件和软件工作原理的细节。当然，恶意软件的作者也不会向世界解释他们的工作。在这些情况下，安全专业人员可能对其环境安全性一无所知。逆向工程是一种用于从成品反向推导其如何工作原理的技术。安全专业人员有时使用逆向工程来了解可疑软件的内部机制或检查硬件的完整性。逆向工程使用一种被称为“分解”的哲学，逆向工程师从成品开始，逐步追溯到其各个部分。\n\
  \n### 隔离与沙箱\n\n现代组织安全面临的最危险威胁之一是由 APT（高级持续性威胁）组织开发的定制恶意软件，这些组织创建了专门用于渗透单一目标的特殊工具。由于这些工具从未被使用过，因此传统的杀病毒软件所使用的特征检测技术无法发现它们。\n\
  \n沙箱是一种基于软件行为而非特征来检测恶意软件的方法。沙箱系统监控系统和网络中的未知代码段，当它们检测到以前未见过的应用程序时，会立即将该代码隔离在一个名为\
  \ `sandbox`（沙箱）的特殊环境中，在该环境中无法访问任何其他系统或应用程序。沙箱解决方案随后执行代码并观察其行为，检查它是否开始扫描网络其他系统、收集敏感信息、与命令与控制服务器通信或执行任何潜在的恶意活动。\n\
  \n如果沙箱解决方案识别出异常行为，它将阻止代码进入组织网络并将其标记为待管理员审核。此过程也称为 `code detonation`（代码爆炸），是一种根据观察到的软件行为采取行动的自动化逆向工程示例。\n\
  \n### 软件逆向工程\n\n在大多数编程语言中，开发者使用人类可读的语言（如 `C/C++`、`Java`、`Ruby` 或 `Python`）编写软件。根据编程语言的不同，计算机以两种方式之一处理这些代码。在解释型语言中（如\
  \ `Ruby` 和 `Python`），计算机直接从源代码运行。寻求分析解释型语言编写代码的逆向工程师可以简单地阅读代码，通常对代码试图实现的目标有一个良好的了解。\n\
  \n在编译型语言中（如 `Java` 和 `C/C++`），开发者使用名为 `compiler`（编译器）的工具将源代码转换为计算机可读的二进制代码。这些二进制代码通常分发给软件用户，要检查二进制代码并确定其在做什么是非常困难的，甚至是可能的，这使得编译型语言的逆向工程变得困难得多。寻求逆向工程编译型语言的技术人员有两种选择。首先，他们可以尝试使用名为\
  \ `decompiler`（反汇器）的专用程序。然而，这种方法通常效果并不理想。其次，他们可以使用专用环境并仔细监控软件对不同输入的响应。\n\n### 硬件逆向工程\n\
  \n硬件逆向工程比软件逆向工程更加困难，因为硬件的真实性往往取决于嵌入电路的固件内容。虽然组织可能会对硬件进行物理检查以检测篡改，但验证硬件的真实性（即其来自可靠的来源）是非常重要的，因为详尽地测试硬件是不可能的。\n\
  \n美国政府意识到了确保真实性的困难，并为关键防御系统运行可信代工厂计划。美国国防部（`DoD`）和国家安全局（`NSA`）认证公司为可信代工厂，为政府制造敏感集成电路。寻求可信代工厂地位的公司必须证明其完全保护了生产过程，包括设计、原型制作、封装、组装和其他环节。\n\
  \n寻求确定硬件功能的逆向工程师使用与分析编译软件相似的技术，特别是在观察行为方面。在受控环境中运行硬件并观察其对不同输入的响应，为硬件的功能提供线索。逆向工程师可能还会向原始设备制造商（`OEMs`）获取文档，以了解硬件组件的功能。\n\
  \n## 效率与流程改进\n\n网络安全分析师执行大量的日常工作。从分析日志到评估漏洞，我们的工作有时是枯燥且容易出错的。强大的安全团队会投入资金改进自己的流程，通过标准化和自动化提高效率，减少错误概率，并释放分析师宝贵的时间从事更重要的工作。\n\
  \n### 标准化流程与简化操作\n\n团队提高效率的首要方法是为重复性活动创建标准化流程。当你发现自己面对一个需要临时发挥来寻找解决方案的任务时，这说明你可能需要花时间为未来处理类似事件创建一个标准化流程。这对于你发现自己反复执行的活动尤其如此。\n\
  \n\n\n\n标准化流程可以减少应对任务时所需的精力。你不再需要在下一次该任务出现时思考该做什么——你只需查阅该标准化流程的剧本（playbook），并执行你已经思考周全的步骤。这些流程的额外好处还确保了团队的不同成员在类似的情况下能够做出一致的响应。\n\
  \n## 网络安全自动化\n\n标准化任务也有助于你识别自动化机会。你可能不仅局限于标准化团队成员的工作，还可以自动化某些响应，从而完全将人员排除在流程之外。用\
  \ CompTIA 的术语来说，你正在“最大限度地减少人工干预”。`安全编排、自动化和响应 (SOAR)` 平台提供了许多自动化跨多个系统的安全任务的机会。你可能希望与团队其他成员协调，对团队执行的所有活动进行清单，并识别出适用于自动化的活动。可以自动化的流程的两个关键特征是：它们都是可重复的，且不需要人工交互。一旦部署了自动化，你只需要与团队协调来管理现有的自动化，并促进新自动化的采用。\n\
  \n`SOAR` 平台还提供了改进组织对威胁情报利用的机会。通过将有关新出现威胁的信息引入你的 `SOAR` 平台，你可以丰富正在发生的事件的数据，并提高应对新兴网络安全状况的能力。`SOAR`\
  \ 平台为你提供了机会，通过整合多个威胁馈送接收的信息，构建出网络安全格局和你安全态势的完整视图。\n\n## 技术与工具集成\n\n网络安全充满了枯燥的工作。从对大型网络进行漏洞扫描到进行文件完整性测试，我们经常需要使用非常重复的流程来实现目标。如果我们尝试手动完成这些工作，将非常耗时，以至于在我们完成之前就会精疲力竭而停止。\n\
  \n工作流编排技术帮助我们自动化许多此类重复任务。除了我们讨论过的 `SOAR` 平台外，还有两种自动化工作流的方法：`scripting`，即编写自动执行我们工作的代码；以及\
  \ `integration`，即使用供应商提供的接口将不同产品连接起来。\n\n分析师通常利用`应用程序接口 (APIs)` 作为集成多种安全工具的主要手段。`APIs`\
  \ 是用于服务的编程接口，允许你在不使用 Web 界面的情况下与该服务交互。通常情况下，你可以通过 `API` 执行与在服务的 Web 界面上相同的操作，但 `API`\
  \ 允许你编写代码来自动化这些操作。\n\n`APIs` 对网络安全分析师来说非常强大，因为我们可以使用它们触及各种系统。我们的安全工具通常提供我们可以在自动化工作中利用的\
  \ `APIs`，但许多其他技术服务也是如此。我们可以使用 `APIs` 自动化云资源的置备，从远程服务中检索访问日志，并自动化许多其他例行任务。\n\n`Webhooks`\
  \ 允许我们使用 Web 请求从一个应用程序向另一个应用程序发送信号。例如，每当威胁情报平台收到新漏洞报告时，你可能希望运行漏洞扫描。在这种情况下，你可以在威胁情报平台中配置\
  \ `webhook` 动作，每当报告新漏洞时，都会向漏洞扫描器的 `API` 发送请求。该请求可以触发所需的扫描。\n\n`Plug-ins` 也增加了集成的机会。这些是运行在其他程序内部的小型程序，增加了额外的功能。例如，你可能使用插件在每次悬停在\
  \ IP 地址上时自动拉取信誉数据。\n\n网络安全自动化的最终目标是实现“单一视图”（`single pane of glass`）方法。在这种哲学中，网络安全分析师将所有工具集成到单一平台中，以便他们可以使用一个一致的界面来执行所有工作。当然，这并不是一个真正可以实现的目标。总会有“多一个系统”阻止你真正达到`单一视图`。然而，作为一种设计原则，减少网络安全分析师每天必须使用的界面数量可以大幅提高他们的效率。\n\
  \n## 为事件响应带来效率\n\n事件响应是自动化快速发展的领域之一，因为安全团队寻求将自动化的力量引入通常认为最以人为中心的任务中：调查活动。虽然自动化和其他安全工具可能会触发事件，但从该点起，事件响应者的工作通常是一个非常手的手的过程，涉及到部落知识、个人经验和直觉的应用。\n\
  \n### 丰富事件响应数据\n\n虽然事件响应可能始终涉及大量的人工干预，但某些组织在自动化其事件响应程序的方面取得了成功。事件响应自动化的最佳起点之一是为人类分析师提供事件响应数据的自动化丰富，节省他们调查枯燥细节的时间。例如，当入侵检测系统识别出潜在攻击时，安全自动化工作流可以触发一系列活动。这些可能包括：\n\
  \n- 对攻击源地址进行侦察，包括 IP 地址所有权和地理位置信息\n- 根据`安全信息和事件管理 (SIEM)` 查询，用目标系统的其他日志信息补充初始报告。`SIEMs`\
  \ 是一项重要的安全技术，你可以在第 3 章中找到相关内容。\n- 触发对目标系统的漏洞扫描，旨在帮助判断攻击成功的可能性\n\n所有这些操作都可以在检测到事件后立即发生，并添加到跟踪系统中的事件报告中，供网络安全分析师审查。寻求实现事件响应数据丰富的团队将从观察第一响应者的例行活动，并识别任何可能作为自动化候选的信息收集需求中受益。\n\
  \n### 自动化事件响应剧本的部分\n\n除了为响应事件的网络安全分析师提供丰富的数据外，自动化可能在提高响应操作效率方面发挥作用。事件响应团队通常使用剧本（playbooks），定义了他们在响应常见事件类型时遵循的步骤顺序。剧本中定义的动作可能包括旨在遏制事件、从网络中消除事件的影响以及恢复正常运行的活动。\n\
  \n\n\n\n在某些情况下，认为对安全事件的响应可以完全自动化化是合理的。例如，如果本地网络上的某个系统开始向远程 Web 服务器发送大量流量，理性的分析师可能会得出结论：该系统已被入侵，并参与了由僵尸网络驱动的拒绝服务攻击。该分析师的自然反应可能是立即隔离该系统以控制损害，然后将案例发送给适当的\
  \ IT 支持技术人员进行调查并解决问题。这种直接的响应是自动化的理想人选对象。安全自动化平台、网络设备和工单系统之间的集成可以在无需人工干预的情况下执行所有这些活动。\n\
  \n虽然对某些简单事件的响应可以是完全自动化的，但许多事件具有独特的特征，需要某种程度的人为干预。即使在这些情况下，事件响应剧本的部分内容在数据增强阶段之后仍然可以实现自动化。例如，网络安全分析师可能拥有仪表板，允许他们触发一系列活动，从而阻止单个用户对所有资源的访问、隔离可疑系统，或启动事件升级流程。\n\
  \n## 网络安全分析的未来\n\n随着我们继续开发网络安全分析能力，我们所使用的工具和技术变得日益复杂。未来网络安全分析工具最具前景的领域是持续采用`machine\
  \ learning`技术，这些旨在从安全系统产生的海量信息中自动提取知识。\n\n机器学习技术已经整合到许多安全分析工具中，根据该工具其他用户的经验对数据进行自动分析。预计随着组织利用机器学习的力量，这些能力将继续发展，从而减少人类分析师进行繁琐数据筛选的需求，并使他们专注于机器学习算法的输出，这些输出将指导他们从事更有效率的工作。\n\
  \n## 总结\n\n网络安全专业人员负责确保其所属组织维护的信息和系统的机密性、完整性和可用性。**机密性**确保未经授权的人员无法访问敏感信息。**完整性**确保信息或系统不会发生任何故意或无意的未经授权修改。**可用性**确保信息和系统在合法用户请求时随时准备就绪以满足其需求。这三个目标合称为`CIA\
  \ Triad`（CIA 三要素模型）。\n\n当网络安全分析师寻求保护其组织时，他们必须评估对`CIA Triad`的风险。这包括识别漏洞、识别相应的威胁，以及确定漏洞和威胁组合产生的风险水平。分析师随后必须评估每个风险，并确定适当的风险管理策略来缓解或其他处理风险。他们可以使用机器学习技术来协助这项工作。\n\
  \n网络安全分析师使用旨在降低风险可能性或影响的安全控制来缓解风险。网络安全控制包括网络访问控制（`NAC`）系统、防火墙和网络分。安全终端控制包括固系统配置、补丁管理、`Group\
  \ Policies` 和终端安全软件。\n\n渗透测试和反向工程为分析师提供了保证，确保他们实施的缓解风险的控制运行正常。通过遵循严谨的风险分析和控制流程，分析师可以显著增强其所控信息和系统的机密性、完整性和可用性。\n\
  \n最后，网络安全分析师应该花时间通过效率和流程改进倡议投资到自己的运营实践中。标准化流程、简化操作以及整合技术和工具的项目将使网络安全分析师的工作变得更容易，提高生产力并减少错误概率。\n\
  \n## 考试要点\n\n**了解网络安全的三个目标。** `Confidentiality`确保未经授权的人员无法访问敏感信息。`Integrity`确保信息或系统不会发生任何故意或无意的未经授权修改。`Availability`确保信息和系统在合法用户请求时随时准备就绪以满足其需求。\n\
  \n**了解网络安全风险是如何从威胁和漏洞的结合产生的。** 漏洞是设备、系统、应用程序或流程中的弱点，可能允许攻击的发生。网络安全世界中的威胁是指利用漏洞的外部力量。\n\
  \n**能够将网络安全威胁分类为敌对性的、意外的、结构性的或环境性的。** `Adversarial`威胁是试图故意破坏组织安全的个人、团体和组织。`Accidental`威胁发生在个人在执行日常工作时误执行了损害安全的操作。`Structural`威胁发生在设备、软件或环境控制由于资源耗尽、超出运行能力或仅仅由于老化而失效。`Environmental`威胁发生在组织无法控制的自然或人为灾害。\n\
  \n**理解如何通过使用网络访问控制、防火墙和划分使网络更安全。** 网络访问控制（`NAC`）解决方案帮助安全专业人员实现两个网络安全目标：限制授权人员访问网络，并确保访问组织的系统符合基本安全要求。网络防火墙位于网络边界并提供边界安全。网络划分通过隔离将不同安全级别的网络隔离开。\n\
  \n**理解如何通过固化配置、补丁管理、组策略和终端安全软件使终端更安全。** 固化配置包括禁用终端上不必要的的服务以减少其受攻击的敏感性、确保设备上存在安全配置设置并集中控制设备安全设置。补丁管理确保操作系统和应用程序不受已知漏洞的影响。`Group\
  \ Policy`允许同时向许多设备应用安全设置，而终端安全软件防御恶意软件和其他威胁。\n\n**了解渗透测试为组织提供了从攻击者视角审视安全的保障。** `NIST`\
  \ 渗透测试过程分为四个阶段：计划、发现、攻击和报告。渗透测试的结果是很有价值的安全规划工具，因为它们描述了攻击者可能利用来访问网络的实际漏洞。\n\n**理解反向工程技术如何确定硬件和软件的内部运行机制。**\
  \ `Sandboxing`是一种基于行为而非特征检测恶意软件的方法。其他反向工程技术难以执行、通常会失败且非常耗时。\n\n\n\n\n# 了解机器学习技术如何促进网络安全分析。未来网络安全分析工具最有前景的领域是持续采用`machine\
  \ learning` 技术，这些技术旨在从安全系统产生的海量信息中自动提取知识。机器学习技术已经整合到许多安全分析工具中，根据其他工具用户的经验对数据进行自动化分析。\n\
  \n# 理解效率和流程改进对安全运营的重要性。网络安全分析是一项艰巨且有时是枯燥的工作。旨在简化操作、标准化标准流程以及增加工具和技术整合的项目使工作流变得更加顺畅。这不仅提升了网络安全分析师的效率和有效性，还减少了错误的概率。\n\
  \n## 实验练习\n\n### 活动 1.1：创建入站防火墙规则\n\n在本次实验中，你将验证服务器上已启用 `Windows Defender Firewall`，然后创建一个阻止文件和打印机共享的入站防火墙规则。\n\
  \n这些实验指令是为运行 `Windows Server 2022` 的系统编写的。在其他版本的 `Windows Server` 上操作的过程相似，尽管服务、选项和图标的具体名称可能略有不同。\n\
  \n### 第 1 部分：验证 Windows Defender Firewall 是否启用\n\n1. 打开你的 `Windows Server` 的 `Control\
  \ Panel`（控制面板）。\n\n2. 选择 `System and Security`（系统和安全）。\n\n3. 在 `Windows Defender\
  \ Firewall` 下，点击 `Check Firewall Status`（检查防火墙状态）。\n\n4. 验证 `Private`（私有）网络的 `Windows\
  \ Defender Firewall`状态是否设置为 `On`。如果没有开启，使用窗口左侧的 `Turn Windows Defender Firewall\
  \ on or off` 链接启用防火墙。\n\n### 第 2 部分：创建一个允许文件和打印机共享的入站防火墙规则\n\n1. 在 `Windows Defender\
  \ Firewall` 控制面板的左侧，点击 `Allow an app or feature through Windows Defender Firewall`（通过\
  \ Windows 防火墙允许应用或功能）。\n\n2. 滚动应用程序列表并找到 `File and Printer Sharing`（文件和打印机共享）。\n\
  \n3. 勾选该项目左侧的复选框，以阻止与 `File and Printer Sharing` 相关的连接。\n\n4. 确认选项右侧的 `Private`\
  \ 框已自动选中。这允许同一局域网上的其他系统进行 `File and Printer Sharing`。`public`（公共）访问框应取消勾选，这表示远程系统无法访问此功能。\n\
  \n5. 点击 `OK` 应用设置。\n\n### 活动 1.2：创建组策略对象\n\n在本次实验中，你将创建一个组策略对象（GPO）并编辑其内容以强制组织的密码策略。\n\
  \n这些实验指令是为运行 `Windows Server 2022` 的系统编写的。在其他版本的 `Windows Server` 上操作的过程相似，尽管服务、选项和图标的具体名称可能略有不同。要完成本次实验，你的\
  \ `Windows Server` 必须被配置为 `domain controller`（域控制器）。\n\n1. 打开 `Group Policy Management`（组策略管理）应用程序。（如果你在\
  \ `Windows Server` 上没有找到此程序，可能是因为它没有被配置为 `domain controller`。）\n\n2. 展开与你的 `Active\
  \ Directory`（活动目录）森林对应的文件夹。\n\n3. 展开 `Domains`（域）文件夹。\n\n4. 展开与你的 `domain`（域）对应的文件夹。\n\
  \n5. 右键点击 `Group Policy Objects`（组策略对象）文件夹，从弹出菜单中选择 `New`（新建）。\n\n6. 将你的新 GPO 命名为\
  \ `Password Policy`（密码策略）并点击 `OK`。\n\n7. 点击 `Group Policy Objects` 文件夹。\n\n8. 右键点击新的\
  \ `Password Policy`，从弹出菜单中选择 `Edit`（编辑）。\n\n9. `Group Policy Management` 打开后，展开\
  \ `Computer Configuration`（计算机配置）下的 `Policies`（策略）文件夹。\n\n10. 展开 `Windows Settings`（Windows\
  \ 设置）文件夹。\n\n11. 展开 `Security Settings`（安全设置）文件夹。\n\n12. 展开 `Account Policies`（账户策略）文件夹。\n\
  \n13. 点击 `Password Policy`。\n\n14. 双击 `Maximum Age`（长时间）。\n\n15. 在弹出窗口中，选择 `Define\
  \ this policy`（定义此策略）并将过期值设置为 `90` 天。\n\n16. 点击 `OK` 关闭窗口。\n\n17. 双击 `Minimum Length`（最小长度）。\n\
  \n18. 与上一步相同，点击复选框定义此策略，并将最小长度设置为 `12` 个字符。\n\n19. 点击 `OK` 关闭窗口。\n\n20. 双击 `Password\
  \ Must Meet Complexity`（密码必须满足复杂性）。\n\n21. 点击复选框将策略设置为 `Enabled`（已启用）。\n\n22. 点击\
  \ `OK` 关闭窗口。\n\n23. 点击 `X` 退出 Group Policy Management。\n\n你现在已成功创建了一个强制组织密码策略的组策略对象。你可以根据需要将此\
  \ GPO 应用于用户和/或组。\n\n### 活动 1.3：编写渗透计划\n\n在本次活动中，你将为你选择的任意组织设计一个渗透测试计划。如果你已在职，可以选择使用你雇主的网络。如果你是学生，可以选择你的学校。否则，你可以选择任何真实或虚构的组织。\n\
  \n在启动任何测试之前，你的渗透测试计划应涵盖三个主要标准：\n\n*   时间 (Timing)\n*   范围 (Scope)\n*   授权 (Authorization)\n\
  \n### 活动 1.4：识别安全工具\n\n将表中所列每种安全工具与其正确的描述匹配。\n\n| 工具 | 描述 |\n| :--- | :--- |\n|\
  \ Firewall (防火墙) | 确定哪些客户端可以访问有线或无线网络 |\n| Decompiler (反编译器器) | 创建文件的唯一指纹 |\n| Antivirus\
  \ (杀病毒软件) | 根据源、目的和端口过滤网络连接 |\n| NAC (网络访问控制) | 故意创建的看似有漏洞的系统 |\n| GPO (组策略对象) |\
  \ 尝试从二进制代码恢复源代码 |\n| Hash (哈希值) | 扫描系统中的恶意软件 |\n| Honeypot (蜜罐) | 防止 SQL 注入攻击 |\n\
  | WAF (Web 应用程序防火墙) | 向多个 Windows 系统部署配置设置 |\n[/content]\n\n---\n\n### 第二部分：章节目录/引言翻译\n\
  \n[content]\n# 了解机器学习技术如何促进网络安全分析。未来网络安全分析工具最有前景的领域是持续采用`machine learning` 技术，这些技术旨在从安全系统产生的海量信息中自动提取知识。机器学习技术已经整合到许多安全分析工具中，根据其他工具用户的经验对数据进行自动化分析。\n\
  \n# 理解效率和流程改进对安全运营的重要性。网络安全分析是一项艰巨且有时是枯燥的工作。旨在简化操作、标准化标准流程以及增加工具和技术整合的项目使工作流变得更加顺畅。这不仅提升了网络安全分析师的效率和有效性，还减少了错误的概率。\n\
  \n## 第 2 章 系统与网络架构\n\n安全运营需要对基础设施、网络架构和身份访问管理的基础概念有理解。现代基础设施通常包括虚拟化、无服务器和容器化，同时在本地和云端运行。这创建了复杂的安全环境，需要理解后才能进行有效保护。\n\
  \n同时，安全专业人员需要理解计算机和系统所依赖的操作系统。加固系统、了解文件系统、意识系统进程，甚至是他们所保护系统的底层硬件架构都是从业者必须的技能。\n\n\
  除了这些核心基础设施和系统概念，加密、敏感数据保护以及创建、分析和审核日志等额外的能力对于安全运营也同样重要。\n\n在本章中，你将学习当前基础设施的设计概念和技术。随后，你将探索基础操作系统概念和安全实践。接下来，将将回顾现代网络架构和安全设计的主要元素。最后，你将深入研究身份访问管理、加密、敏感数据保护，以及日志如何在这些领域中被使用以帮助安全运营。\n\
  \n\n\n\nCySA+ 考试目标重点关注与安全运营和基础设施相关的三个核心概念：无服务器计算、虚拟化和容器化。这三个模型广泛应用于现代系统和服务中，作为安全专业人员，你可以预计自己会频繁遇到它们。在回顾其中每项内容时，请考虑它们如何影响安全运营，包括它们在日常安全活动和需求方面的相似之处与不同之处。\n\
  \n## 无服务器 (Serverless)\n\n广义上，`Serverless` 计算描述的是云计算，但在目前大多数使用场景中，它指的是有时被称为“函数即服务”（`FaaS`）的技术。本质上，无服务器计算依赖于一个在函数被调用时执行这些函数的系统。这意味着当需要执行某项操作时，函数就会运行——这就是“函数调用”。亚马逊的\
  \ `AWS Lambda`、谷歌的 `App Engine` 和 `Azure Functions` 都是无服务器计算 `FaaS` 实现的示例。在这些情况下，安全模型通常将函数视为与其他代码无异，这意味着用于软件开发的相同控制措施也需要适用于函数服务环境。此外，适用于云计算环境的适当控制措施（如访问控制和权限，以及监控和资源管理能力）对于确保部署的安全也是必要的。\n\
  \n无服务器化带来了许多优势，包括在某些情况下可以降低成本，因为它是按需计费，而不是持续运行。此外，服务器维护和管理等开销成本不再是考虑因素，因为服务是根据应用程序或服务所需的规模和频率按需直接使用的。\n\
  \n## 虚拟化 (Virtualization)\n\n虚拟化使用软件在底层的真实硬件上运行虚拟计算机。这意味着你可以运行多个系统，运行多个操作系统，而所有这些系统都像运行在它们自己的硬件上一样。这种方法对资源使用情况以及呈现给客操作系统的硬件等因素提供了额外的控制，并且由于你可以利用共享资源，允许对底层硬件的高效利用。\n\
  \n虚拟化有多种使用方式。它被用于实现`虚拟桌面基础设施 (VDI)`，该技术在中央硬件上运行如 `Windows` 等桌面操作系统，并通过网络将桌面流传输到各个系统中。许多组织将其几乎所有的服务器都虚拟化，运行虚拟化主机的集群来承载其所有的基础设施。虚拟安全设备以及其他供应商提供的虚拟解决方案也是虚拟化生态系统的一部分。\n\
  \n虚拟化的优势也给安全专业人员带来了挑战，他们现在必须确定如何对虚拟环境中的问题进行监控、防护和响应。与我们讨论过的安全设计的其他元素类似，需要预先规划并投入精力来理解贵组织将使用的架构和实现方式。\n\
  \n## 容器化 (Containerization)\n\n`Containerization` 为虚拟化整个系统提供了一种替代方案，它允许应用程序运行在自己的环境中，并在专用的容器中带有其所需的组件（如库、配置文件和其他依赖项）。`Kubernetes`\
  \ 和 `Docker` 是容器化技术的示例。\n\n容器提供了应用级的虚拟化。容器不是创建需要独立操作系统的复杂虚拟机，而是对应用程序进行打包，并将其视为虚拟化单元，这些单元在不同的操作系统和硬件平台之间具有可移植性。\n\
  \n容器化是将软件与其所需的库和其他依赖项打包的过程。这创建了轻量级、可移植的容器，可以轻松地在环境之间移动，同时由于它们使用宿主机系统，因此比虚拟机更节省资源。\n\
  \n实施容器化的组织运行如 `Docker` 之类的容器化平台，这些平台为操作系统资源提供了标准的接口。无论底层的操作系统或硬件如何，该接口都保持一致，且接口的一致性允许容器根据需要跨系统进行切换。\n\
  \n容器化平台与虚拟化平台具有许多相同的安全考虑因素。它们必须强制容器之间的隔离，以防止当运行在一个容器中的应用程序无意或有意地与分配给另一个容器的资源进行交互时可能发生的运行和安全问题。\n\
  \n容器化允许高水平的可移植性，但也创造了新的安全挑战。传统的基于主机的安全对于底层的容器化服务器可能有效，但容器本身需要不同的处理方式。同时，由于许多容器运行在同一个服务器上，对\
  \ `host OS` 的威胁可能会影响许多容器化服务。幸运的是，存在用于签名容器镜像以及监控和补丁容器的工具。这些工具之外，传统的加固、应用和服务监控以及审计工具也是很有用的。\n\
  \n在处理容器化系统时，请记住共享的底层主机以及通常用于容器的快速部署模型。安全必须被集成到和服务软件开发生命周期中，并集成到系统维护和管理过程中。\n\n云服务提供商提供了许多不同的容器化服务，许多组织管理着自己的\
  \ `Kubernetes` 或 `Docker` 基础设施。你可以在此处阅读更多关于 `Docker` 的信息：\n\n`www.docker.com`\n\n\
  微软在此提供了关于通用容器化技术的有用概述：\n\n`https://azure.microsoft.com/en-us/resources/cloud-computing-dictionary/what-is-a-container`\n\
  \n## 操作系统概念 (Operating System Concepts)\n\n在底层系统和基础设施到位后，需要考虑的下一层是操作系统（`OS`）。保护操作系统需要理解文件系统、配置管理和系统加固，以及\
  \ `OS` 本身是如何工作的。\n\n## 系统加固 (System Hardening)\n\n安全从业务人员需要理解如何通过减少攻击面来保护系统。这意味着在保留系统所需功能的同时，减少攻击者可能破坏或影响系统的潜在方式。对于现代组织中使用的所有技术（包括软件、硬件、网络和服务），都存在加固技术和流程。在这里，我们将关注系统加固概念。\n\
  \n系统加固通常依赖于许多常见做法：\n\n* 更新并修补系统\n* 移除不必要的软件和服务\n* 限制并记录管理员访问\n* 控制新账户的创建\n* 启用日志并使用适当的监控\n\
  * 使用磁盘加密和安全启动等功能\n\n组织经常使用行业最佳实践驱动的基准作为其系统加固活动的基础。互联网安全中心 (`CIS`) 为常见的操作系统提供了一系列系列加固指南和配置基准。你可以在此处找到\
  \ `Windows 11` 桌面基准：\n\n`www.cisecurity.org/benchmark/microsoft_windows_desktop`\n\
  \n以及其他基准，如各种 `Linux` 发行版、`macOS`、`iOS` 以及常用的软件和服务：\n\n`www.cisecurity.org/benchmark`\n\
  \n\n\n\n\n虽然组织通常根据 CIS 基准（CIS benchmark）等标准进行系统加固实践，但它们也需要确保基准中包含的设置和更改不会干扰其运行。这意味着采用基准需要经过深思熟虑的分析，并在真实环境中进行测试，以确保关键功能不受影响。这同时也意味着需要更改基准的组织应该考虑为什么它们的工具、服务或配置需要与不同，以及这是否会为其运行或系统带来额外风险。\n\
  \n## Windows 注册表\n\n`Windows Registry`（Windows 注册表）是一个包含操作系统设置的数据库。程序、服务、驱动程序操作系统本身都依赖于存储在\
  \ `Registry` 中的信息，这使其成为一个关键资源，也是恶意活动频繁攻击的目标，因为它对于持久化非常有用。\n\n图 2.1 显示了 `regedit`，这是内置的\
  \ Windows 注册表编辑工具，用于查看有关 Windows Defender 的注册表信息。`Registry` 中的项通常具有名称、类型和数据值，你可以对其进行设置。\n\
  \n![图 2.1 使用 regedit 查看 Windows 注册表](img/c02f001.png)\n\n图 2.1 使用 `regedit` 查看 Windows\
  \ 注册表\n\n如表 2.1 所示，`Windows Registry` 有五个主根键。\n\n表 2.1 五个主根键\n\n| 根键 || 说明 |\n|\
  \ --- | --- |\n| `HKEY_CLASSES_ROOT` (HKCR) | COM 对象注册信息。将文件类型与程序关联。 |\n| `HKEY_LOCAL_MACHINE`\
  \ (HKLM) | 系统信息，包括计划任务和服务 |\n| `HKEY_USERS` (HKU) | 关于用户账户的信息 |\n| `HKEY_CURRENT_USER`\
  \ (HKCU) | 关于当前登录用户的信息 |\n| `HKEY_CURRENT_CONFIG` (HKCC) | 当前本地硬件配置文件信息存储 |\n\n\
  每个根键都有 `Registry` 组程序（hives），这些是与根键连接的键和值的组。每个键都可以包含值，包括字符串、二进制数据、数值数据、指向其他 `Registry`\
  \ 键的链接或 Windows 特定的组件数据。\n\n`Registry` 键本身可以使用 Windows 原生访问控制进行保护，根据配置允许或拒绝访问，并提供审计信息。\n\
  \n## 文件结构与文件位置\n\n虽然考试不会要求你背下 Linux 和 Windows 文件系统的结构，但你应该对这两个操作系统倾向于如何组织文件位置有基本的了解。你还希望知道它们最常存储关键文件的位置，因为文件结构和配置文件位置都是考试目标的一部分。\n\
  \n`CySA` 考试目标将配置文件位置包含为一个关键项。虽然配置文件的位置可能会异，但每个主要的操作系统都有通用的位置。\n\nWindows 配置信息通常存储在\
  \ `Windows Registry` 中，尽管额外的配置信息可能存储在 `C:\\ProgramData\\` 或 `C:\\Program Files\\\
  ` 目录，以及用户的 `AppData` 目录。\n\nLinux 配置信息通常存储在 `/etc/` 目录。\n\nmacOS 通常将信息存储在 `~/Library/Preferences`\
  \ 中。\n\n## 系统进程\n\n`System processes`（系统进程）是核心。在 Windows 中，它们包括 `ntkrnl.exe`、`smss.exe`、`services.exe`、`winlogon.exe`、`wininit.exe`、`lsass.exe`\
  \ 和 `explorer.exe`。常见的影响之一是攻击者可能会针对这些进程。`System processes` 是安全操作的关键部分。\n\n## 硬件架构\n\
  \n系统的底层 `hardware architecture`（硬件架构）可能会影响安全。虽然大多数计算机运行在 `x86` 上，但 `ARM`架构的使用正在增加，例如\
  \ Apple 的 `M1` 和 `M2` 芯片。尽管如此，了解 `hardware architecture` 并不保证安全。\n\n## 日志、日志与采集\n\
  \n日志是一项复杂的任务。`CySA` 考试目标关注两个两个方面：时间同步和日志级别。\n\n### 时间同步\n\n系统和服务之间的 `Time synchronization`\
  \ 对日志分析至关重要。如果时间没有正确准确地同步，事件将不会按正确的顺序在正确的时间出现。这可能导致评估不准确或误导场景。\n\n幸运的是，网络时间协议（NTP）以及\
  \ NTP 服务器可以实现简单的时间同步。这意味着系统管理员和安全从业人员的一个重要步骤是在发生事件或问题之前，通过定期检查和服务确保时间同步正在进行并且是正确的。\n\
  \n你可以在此处阅读更多关于 Windows 时间服务的设置：\n`https://learn.microsoft.com/en-us/windows-server/networking/windows-time-service/windows-time-service-tools-and-settings`\n\
  \n可以在此处找到一个适用于大多数发行版的 Linux NTP 指南：\n`https://timetoolsltd.com/ntp/how-to-install-and-configure-ntp-on-linux`\n\
  \n### 日志级别\n\n网络设备日志文件通常关联 `log level`（日志级别）。虽然日志级别的定义不同，但许多与 Cisco 的日志级别相似，如表 2.2\
  \ 所示。\n\n| 级别 || 级别 | 示例 |\n| --- | --- | --- |\n| 0 | 紧急 | 故障导致设备关闭 |\n| 1 | 警告\
  \ | 超过温度限制 |\n| 2 | 严重 | 软件故障 |\n| 3 | 错误 | 接口禁用消息 |\n| 4 | 警告 | 配置更改 |\n| 5 | 通知\
  \ | 链路协议启用/禁用 |\n| 6 | 信息 | ACL 违反 |\n| 7 | 调试 | 调试消息 |\n\n\n\n\n\n安全从业人员需要理解日志级别，以及设置日志级别对数据捕获意味着什么。如果你的组织设置的日志级别没有捕获你所需的数据，你可能会错过重要信息。如果你设置了过于详细的日志级别（例如日志级别\
  \ 7），它可能会提供海量的细节，这些细节在大多数情况下是没用的。\n\n## 通用日志考虑因素\n\n虽然 CySA+ 考试目标没有特别提到这些内容，但你仍然需要记住日志基础设施的几项通用最佳实践：\n\
  \n* 日志应该包含足够的信息以发挥作用，并能够以实用的方式进行解释，因此必须同时包含含义和上下文。\n* 日志应该受到保护，以防其被篡改。\n* 日志应该发送到中心位置，以便在其中进行存储、分析和报告。\n\
  * 应该对日志进行验证，以确保它们包含了在发生问题或事件时所需的信息。\n* 应该作为正常系统监控的一部分对日志进行检查，以确保应该发送日志的系统正在发送。\n\
  * 应该避免不必要的日志信息，以节省空间和资源。\n* 应该根据组织和系统的需求实施适当日志保留策略和实践。\n\n## 网络架构\n\n了解你的网络是如何设计的、网络上存在哪些设备及其目的和能力，以及你可以使用这些设备应用哪些控制措施，对于保护网络至关重要。传统的物理网络、软件定义网络、混合云、云和虚拟网络在许多组织中并行存在，你需要理解这些技术每如何影响你组织的架构和安全态势。\n\
  \n### 本地（On-Premises）\n\n`on-premises` 网络架构由路由器、交换机、安全设备、布线以及构成传统网络的所有其他网络组件组成。你可以在物理网络上利用广泛的安全解决方案，但安全设计的常见元素包括以下内容：\n\
  \n* 用于控制网络或系统之间流量流的防火墙。\n*   入侵防御系统（`IPSs`），可以检测并阻止攻击；入侵检测系统（`IDSs`），仅在检测到攻击时发出报警或通知。\n\
  *   内容过滤和缓存设备，用于控制通过受保护设备的信息。\n* 网络访问控制（`NAC`）技术，控制哪些设备能够连接到网络，并可以在允许连接之前评估设备的安全状态或要求其他信息。\n\
  *   网络扫描器，可以识别系统并收集有关它们的信息，包括它们运行的服务、补丁级别以及关于系统的其他细节。\n* 统一威胁管理（`UTM`）设备，结合了许多此类服务，通常包括防火墙、`IDSs/IPSs`、内容过滤和其他安全功能。\n\
  \n在准备 CySA+ 考试时，请熟悉这些常见设备及其基本功能，以便你将它们应用到网络安全设计中。\n\n### 云（Cloud）\n\n整个组织向使用云服务的转变不仅改变了边界并推动了对零信任环境的需求，还产生了组织需要更新其安全实践的需要，以适应更具渗透性、更多样化的运行环境。\n\
  \n与本地系统不同，云服务提供商提供的底层环境通常不供安全从业人员访问以进行配置、测试或其他控制。这意味着保护云服务需要不同的方法。\n\n对于大多数软件即服务（`SaaS`）和平台即服务（`PaaS`）供应商，安全将主要通过合同义务来。配置和实施选项可能会带来安全挑战，身份和访问管理在这些环境中也很重要。\n\
  \n`AWS`、`Azure`、`Google` 等基础设施即服务（`IaaS`）供应商提供了更多的基础设施访问权限，因此围绕操作系统配置、管理和补丁的某些传统安全问题也将适用。同样，服务和应用程序需要以安全的方式进行安装、配置和维护。云提供商通常提供额外的面向安全的服务，这些服务在他们的环境中可能有用，并可能替代或补充你在本地可能使用的工具。\n\
  \n许多云供应商会根据要求提供审计和评估结果，通常在提供信息之前需要签署非保密协议。\n\n在考虑本地与云安全的对比时，你应该检查每个环境中存在哪些选项，哪些威胁是相关的，哪些是不同的（如果有的话）。评估适用于或特定于你的云服务提供商的安全能力、态势、威胁和风险也是一项重要任务。\n\
  \n虚拟私云云（virtual private cloud`, `VPC`）是云服务提供商提供的选项，用于构建按需的半隔离环境。`VPC` 通常存在于私有子网，并可能有额外的安全措施以确保系统间通信的安全。\n\
  \n### 混合（Hybrid）\n\n`hybrid` 网络架构结合了本地和云基础设施及系统。这会引入复杂性，因为每个不同的环境都必须安全并有一个适用于整个基础设施的安全模型。尽管如此，由于组织从本地数据中心迁移到云服务和云基础设施即服务模型，同时保留了一些现场服务和系统，因此混合架构非常常见。\n\
  \n### 网络分段（Network Segmentation）\n\n提供分层防御通常涉及分段或分离。物理 `segmentation` 涉及在单独的基础设施或网络上运行。系统隔离通过确保基础设施是分离的来处理，甚至可以到使用物理隔离（air\
  \ gap），以确保基础设施之间完全没有连接。\n\n虚拟分段利用虚拟化能力将功能分离到虚拟机或容器中，尽管某些虚拟化分段的实现方式在运行独立虚拟机的同时，还运行在独立的物理服务器上。\n\
  \n网络分段（network segmentation`或或分区是网络设计的常见元素。它提供了许多优势：\n\n* 通过对系统和网络进行分区，可以减少暴露给攻击者的系统（通常称为组织的攻击面）的数量。\n\
  * 通过将必须合规的系统、数据或单元放置在与组织其他部分更易维护的环境中，可以帮助限制合规性工作的范围。\n* 在某些情况下，分段可以通过限制问题或攻击的影响来提高可用性。\n\
  * 分段被用于提高网络效率。单个网段内系统数量过多会导致网络拥塞，使得分段在网络增大时具有吸引力。\n\n网络分段可以通过许多方式实现，但出于安全考虑，通常在具有不同信任级别或功能要求的网络段之间使用经过设计的规则集的防火墙。网络分段还经常依赖支持\
  \ `VLAN`（虚拟局域网）标记的路由器和交换机。在某些需要分段但不需要更细致控制的情况下，分段仅通过路由器或交换机处理。\n\n\n\n\n\n访问此类分段环境的一种常见解决方案是使用跳板机（`jump\
  \ box$，有时称为跳板服务器），这是一种位于分段环境中的系统，用于访问和管理其所在区域内的设备。跳板机跨越两个不同的安全区域，因此应对其进行仔细的安全防护、管理和监控。\n\
  \n除了跳板机，另一种从不同安全区域提供远程访问以及进入分段网络的常见方法是通过`virtual private network`（`VPN`）。虽然`VPNs`在技术上并不一定需要提供加密层来保护其承载的流量，但几乎所有现代实现都会使用加密，同时提供安全连接，使系统或设备能够访问远程网络。\n\
  \n图 2.2 展示了一个分段网络的示例，其中安全设备后有一个受保护的网络，通过到`jump box`的`VPN`连接允许访问该受保护的分段。\n\n![图 2.2\
  \ 简单的分段网络](img/c02f002.png)\n\n**图 2.2** 简单的分段网络\n\n### 软件定义网络\n\n`Software-defined\
  \ networking`（`SDN`）使网络变得可编程。使用`SDN`，你可以对网络进行集中控制，比传统的物理网络基础设施更智能地管理网络资源和流量。软件定义网络通过类似`OpenFlow`的`APIs`（应用程序编程接口）提供信息和控制，这意味着可以跨不同的硬件和软件供应商进行网络监控和管理。\n\
  \n由于`SDN`允许通过`APIs`进行控制，因此`API`安全性以及安全代码开发实践都是`SDN`实施中的重要要素。\n\n除了组织内部控制的`SDN`实现外，软件定义网络广域网（`SDN-WANs`）是一种由`SDN`驱动的服务模型，提供商使用`SDN`技术来提供网络服务。它们允许使用混合架构，这些架构在后台可能结合多种技术，以向客户提供网络连接。`SDN-WAN`的实现通常提供加密，但也引入了风险，包括`SDN`编排平台的漏洞、与多供应商网络路径和控制相关的风险，以及流量流经多条路径时的可用性和完整性风险。\n\
  \n### 零信任\n\n现代安全架构设计中的一个主要概念是`zero trust`（零信任）。`zero trust`概念消除了以往置于安全边界内部的系统、服务和个人的信任。在`zero\
  \ trust`环境中，每个被请求并允许的操作在执行之前都必须经过验证和确认。\n\n`zero trust`不再将强边界作为主要的安全层，而是进一步向深层次的分层安全模型演进，其中单个设备、应用程序以及用户账户都是安全设计的一部分。随着边界变得越来越难以定义，`zero\
  \ trust`设计变得更加常见，以应对现代组织所处的安全环境。\n\n实施`zero trust`设计需要技术、流程和策略的结合，以管理、监控、评估和维护一个复杂的环境。\n\
  \n### 安全访问边缘\n\n`Secure access service edge`（`SASE`，读作“sassy”）是一种网络架构设计，它利用软件定义广域网（`SD-WAN`）和安全功能，如云访问安全代理（`CASBs`）、`zero\
  \ trust`、防火墙即服务、反恶意软件工具或其他能力来保护你的网络。该概念侧重于确保终端和网络层的安全，假设组织是去中心化的，且以数据中心为中心的模型在当前组织中用处有限。\n\
  \n## 身份与访问管理\n\n`Identities`（身份），或关于个人或账户持有者由一方提供给另一方（如服务提供商、应用程序或系统）的一系列声明陈述，是身份验证、授权和计费的关键部分。我们用于登录的用户账户需要能够唯一识别个人和其他`subjects`（主体，如服务），以便将权限、权利、组组成和属性与他们关联。\n\
  \n与`identity`关联的属性包括关于`subject`的信息，通常包括他们的姓名、地址、职位、联系信息以及关于该个人的其他详细信息。这些属性可能作为身份验证过程的一部分，可能用于填充`directory`信息，或者可以被收集以帮助满足其他组织需求或业务目的。\n\
  \n`Identities`被用于身份验证、授权和计费（`AAA`）框架，用于控制对计算机、网络和服务的访问。身份系统提供许多常见功能：身份创建和管理、身份验证和授权，以及在某些情况下在本组织之外进行身份联合。`CySA+`考试目标重点关注你需要了解的少数特定技术：多因素身份验证、单点登录、无密码、联合、特权访问管理和云访问安全代理。\n\
  \n### 多因素身份验证 (MFA)\n\n用于验证用户最重要的安全措施之一是`multifactor authentication`（`MFA`）。`MFA`依赖于两个或多个不同的身份验证因素，例如密码、令牌或智能卡、生物识别因素，甚至是个人进行身份验证的地点。它的一个关键部分是因素应该是不同的；两个密码无法构成有效的`MFA`方案。\n\
  \n`MFA`依赖于几种常见的身份验证因素或方法：\n\n- `Knowledge factors`（知识因素）：你所知的。密码和短语是最常见的知识因素，但身份验证系统也使用你可能的数据。例如根据组织拥有的你的个人数据构建问题，如你目前的房贷还款额、十年前的居住地或其他你知道但别人不太可能知道的事情。\n\
  - `Possession factors`（持有因素）：你拥有的。最常见的例子是身份验证器应用程序、安全令牌和智能卡。图 2.3 展示了`Google Authenticator`应用程序的示例，这是一种基于手机的一次性密码生成器工具。在使用此类令牌时，拥有提供代码的应用程序就是持有因素。\n\
  - `Biometric factors`（生物识别因素）：你固有的特征。它们包括指纹、视网膜扫描、声纹以及许多其他测量人体特征的方法。\n\n\n\n\n-\
  \ `Location factors`（位置因素）的使用频率较低，依赖于物理位置，该位置取决于系统或网络所在的位置，或者通过使用 `GPS` 或其他数据验证你处于一个受信任或被允许访问系统的地方。\n\
  \nMFA（多因素身份验证）有助于防止攻击者使用窃取的凭据进行身份验证，因为它让攻击者同时拥有用户账户验证所需的两个（或更多！）因素的可能性大大降低。如果攻击者成功通过网络钓鱼获取了密码或实施了成功的暴力破解密码攻击，他们可能无法访问该个人的手机或令牌，也无法访问指纹等生物识别因素。\n\
  \n这种安全优势意味着，对于比简单密码更高安全要求的系统和服务，MFA 越来越多地被视为默认安全控制措施。主要的电子商务、银行、社交网络和其他服务供应商现在都提供了双因子身份验证（2FA）功能，并且越来越多的供应商默认要求使用该功能。这并不意味着\
  \ MFA 是完美的；手机或令牌丢失、交付第二个因素的方法不安全，或者允许用户通过联系支持人员来绕过第二个因素的备份访问方法，都可能导致多因素系统的失效。\n\n\
  ### 无密码\n\n`Passwordless`（无密码）身份验证允许用户无需密码即可登录。在大多数实现中，这意味着用户输入用户名或用户 ID，然后使用 `USB\
  \ token`、身份验证器应用程序或其他设备。与 MFA 不同，无密码身份验证通常依赖于一个设计得更安全的单一因素。\n\n### 单点登录 (SSO)\n\n\
  许多 Web 应用依赖 `single sign-on (SSO)`（单点登录）系统，允许用户身份验证一次后即可使用多个系统或服务，而无需使用不同的用户名或密码。`Shared\
  \ authentication`（共享身份验证）方案与单点登录类似，允许身份在多个站点上重用，同时通过单一身份提供者进行身份验证。与 SSO 系统不同，共享身份验证系统要求用户在验证每个站点时输入凭据。\n\
  \n常见的 SSO 技术包括 `Lightweight Directory Access Protocol (LDAP)`（轻量级目录访问协议）和 `Central\
  \ Authentication Service (CAS)`（中央认证服务）。共享身份验证技术包括：\n\n- `OpenID`：一种去中心化认证的开源标准。OpenID\
  \ 被 Google、Amazon 和 Microsoft 等主流网站广泛使用。用户在 Google 等身份提供者处创建凭据；然后网站（依赖方）使用该身份。\n\
  \n- `OAuth`：一种开放授权标准。OAuth 被 Google、Microsoft、Facebook 和其他网站使用，允许用户在通过原始身份提供者身份验证的同时，共享其身份元素或账户信息。OAuth\
  \ 依赖于 `access tokens`（访问令牌），令牌由授权服务器发放，然后由客户端提交给资源服务器（如第三方 Web 应用）。\n\n- `OpenID\
  \ Connect` 是使用 `OAuth` 协议构建的身份验证层。\n\n- `Facebook Connect`（也称为 Facebook 登录）是一种依赖\
  \ Facebook 凭据进行身份验证的共享身份验证系统。\n\nSSO 最显著的安全优势之一是减少密码重复使用的发生概率。这可能也会降低用户在重用凭据集时，通过第三方网站泄露凭据的可能性。此外，SSO\
  \ 的流行还由于它通过减少重置密码和支持电话来可能节省成本。\n\n共享身份验证系统具有某些优点，允许用户使用自己的凭据而无需在每个站点上创建新账户，从而减轻密码疲劳。此外，用户通常会被告知将发布给依赖方的数据类型，例如电子邮件账户、联系信息、性别或其他个人信息。共享身份验证系统并不一定提供单点登录体验。\n\
  \n当然，SSO 系统也会产生风险——由于 SSO 使得访问多个系统和服务变得更容易，它使得获得凭据的攻击者更容易访问它们。一旦攻击者控制了用户的浏览器或系统，SSO\
  \ 还可能让攻击者更容易利用额外的系统，因为用户不需要再次登录。这可以通过对关键系统要求重新身份验证以及使用双因子身份验证来部分缓解。尽管 SSO 确实带来了危险，但由于其所创造的易用性，它是大多数组织最常用的解决方案。\n\
  \n### 联邦身份\n\n身份联邦化（federate identity）的能力——即在多个身份管理系统之间链接身份及其相关属性的过程——已变得普遍。这意味着\
  \ `federation`（联邦化）如今被广泛应用于云服务和组织。如果你使用 Microsoft、Google、Facebook 或 LinkedIn 账户访问并非由这些服务提供商托管的网站，你可能已经见过或使用过联邦身份系统。每个站点都允许第三方站点使用他们的凭据以及一组属性。\n\
  \n### 联邦身份的安全考量\n\n联邦身份将信任边界移动到你所在组织之外，这导致在设计、实施或使用联邦身份时产生新的关注点。这导致需要从三个角度来看待联邦安全：\n\
  \n- 作为 `identity provider (IDP)`（身份提供者），`federation` 的成员必须提供身份，向依赖方做出关于这些身份的断言，并向依赖方发布有关身份持有者的信息。身份和相关数据必须保持安全。身份（有时包括属性）必须验证到符合联邦需求的水平，并可能对其发布应用用户层级的控制。此外，由于其在联邦中的角色，服务提供商可能负责为联邦提供事件响应协调、联邦成员之间的通信或其他任务。\n\
  \n- 作为 `relying party (RP)`（依赖方）或 `service provider (SP)`（服务提供商），`federation` 的成员必须为联邦的成员提供服务，并应安全地处理来自用户和身份提供者的数据。\n\
  \n- 联邦服务的 `consumer`（消费者）或用户可能被要求对属性发布做出决策，并向 IDP 提供有关其身份声明的验证信息。\n\n这些角色每一个都出现在图\
  \ 2.4 中，该图显示了联邦身份工作所需的信任关系和认证流示例。\n\n![图 2.4 联邦身份分级设计](img/c02f004.png)\n\n图 2.4\
  \ 联邦身份分级设计\n\n### 联邦身份设计选择\n\n使用联邦身份会产生新的安全设计关注点，你需要对这些进行规划和设计。如果你打算利用联邦身份，第一个要回答的问题是你想与联邦身份提供者使用什么样的信任模型。常见的联邦身份提供者包括\
  \ Google、LinkedIn 和 Amazon，但也存在广泛的商业和私有联邦，包括政府和高等教育机构运营的联邦。\n\n如果你使用 Google 等现有的联邦身份提供者，你可能希望消费者自带自己的身份，然后你在内部将其映射到你自己的权限和权利结构中。这种模型假设你不关心用户是否真的是他们所声称的身份——你只关心他们是否拥有正在使用的账户。\n\
  \n\n\n\n在依赖可验证身份的联合模型中，需要对用户的身份主张提供更高水平的保证，这要求联合身份提供者与依赖方之间存在额外的信任。示例包括研究联合体，它们在联合内部的多个身份提供者之间有身份审查和断言要求。\n\
  \n信任决策还将影响组织关于手动配置（provisioning）与自动配置及去配置（deprovisioning）的决策。当与第三方联合身份服务集成时，如果是在用户请求访问时进行配置，并在联合身份通过验证后立即进行账户配置，其工作效果是最好的。手动配置通过允许额外的监督来提供更高的安全性，但可能会导致用户访问的延迟。\n\
  \n配置还可能涉及属性发布（attribute release），因为联合中的依赖方需要有关用户账户的一些基本信息，以提供授权并联系用户。身份提供者发布的信息量可能不相同，从可能包含所有账户相关数据的完整属性发布，到非常有限的发布（如图\
  \ 2.5 所示的请求）。\n\n图 2.5 显示了 `LoginRadius.com` 的属性发布请求示例，该网站支持通过 LinkedIn 和 Google\
  \ 为其用户提供联合身份。每种技术的实现决策将各不相同，但数据处理、存储和属性发布的设计要求都是非常重要的。\n\n![FIGURE 2.5 LoginRadius.com\
  \ 的属性发布请求](img/c02f005.png)\n\nFIGURE 2.5 `LoginRadius.com` 的属性发布请求\n\n一旦你确定了你打算用于联合身份的身份所对应的适宜信任要求，你将必须采用它们所使用的底层技术，或者选择符合你需求的技术。如果你是在对自己的组织进行联合，而不是使用像\
  \ LinkedIn 或 Google 这样的联合身份提供者，这一点尤为 true。诸诸如安全断言标记语言 (`SAML`)、`OAuth`、`OpenID Connect`\
  \ 和 `Facebook Connect` 等技术都可能是你可能采用的解决方案的一部分。\n\n你打算实施的联合类型也会影响你对从联合成员（包括身份提供者和依赖方）处预期或可能要求的安全要求。在像使用\
  \ Google 账号的站点这种松散的联合中，Google 账号的底层安全模型并不是主要的关注点，因为任何 Google 账号的所有者通常可以使用与 Google\
  \ 联合的服务。\n\n在需要较高信任级别的联合中，对身份提供者和依赖方的安全实践进行审查是必要的。身份提供者必须验证其其支持的用户的身份，必须保护其凭据库的安全，并且应该对于可能影响联合成员的安全问题建立强有的处理和通知流程。依赖方需要确保其凭据处理得到了妥善保护，并确保满足联合提出的任何安全或操作要求。\n\
  \n## 联合身份技术\n\n四种主要技术构成了当前联合身份的核心：`SAML`、`AD FS`、`OAuth` 和 `OpenID Connect`。这些技术为身份提供者提供了与服务提供者安全集成的方法，而无需了解服务提供者如何实现其服务或其如何使用身份。\n\
  \n表 2.3 对了 `SAML`、`OpenID`、`OAuth2` 和 `AD FS`，包括它们对授权和认证的支持、一些最常见的潜在安全风险以及它们通常的使用方式。\n\
  \nTABLE 2.3 联合身份技术比较\n\n| || | SAML | OpenID | OAuth2 | AD FS |\n| --- | --- | ---\
  \ | --- | --- |\n| **授权** | 是 | 否 | 是 | 是 |\n| **认证** | 是 | 是 | 部分 | 是 |\n| **潜在安全风险**\
  \ | 消息机密性、协议使用风险、拒绝服务 | 重定向攻击、消息机密性、重放攻击、CSRF 攻击、钓鱼攻击、资源伪造 | 令牌攻击（重放） |\n| **常见用途**\
  \ | 认证和授权，特别是在 Linux 环境 | 认证 | 认证和授权，特别是在 Windows 环境 |\n\n### SAML\n\n`SAML` 是一种基于\
  \ XML 的语言，用于在身份提供者和服务提供者之间传递认证和授权数据。它经常用于 Web 应用程序和服务的单点登录，因为 `SAML` 允许身份提供者对服务提供者做出断言，以便它们做出决策。\n\
  \n图 2.6 显示了一个非常简单的 SAML 认证流程。在此流程中，用户尝试使用 SAML 认证的服务并被重定向到身份提供者进行身份验证。登录成功后，浏览器向依赖方返回适当的\
  \ SAML 响应，对其进行验证。在完成这些步骤后，用户现在可以使用他们最初应用程序。\n\n![FIGURE 2.6 简单的 SAML 事务](img/c02f006.png)\n\
  \nFIGURE 2.6 简单的 SAML 事务\n\n### AD FS\n\nActive Directory Federation Services (AD\
  \ FS) 是微软对联合的解决方案。`ADFS` 将认证和身份信息作为属性提供给第三方合作伙伴站点。合作伙伴站点随后使用信任策略将属性与服务支持的属性进行匹配，然后使用这些属性做出授权决策。\n\
  \n`ADFS` 使用与 `OAuth` 认证过程类似的流程：\n\n1. 用户尝试访问由资源合作伙伴托管的启用了 ADFS 的 Web 应用程序。\n2. 合作伙伴\
  \ Web 服务器上的 ADFS Web 代理检查 ADFS Cookie；如果存在，则授予访问。如果 Cookie 不存在，用户将被发送到合作伙伴的 ADFS\
  \ 服务器。\n3. 资源合作伙伴的 ADFS 检查来自账户合作伙伴的 SAML 令牌，如果未找到，ADFS 将执行主域发现（home realm discovery）。\n\
  4. 主域发现识别与用户相关的联合服务器，然后通过该主域对用户进行认证。\n5. 账户合作伙伴随后提供属性形式的安全令牌，并将用户发送回资源合作伙伴的 ADFS\
  \ 服务器。\n6. 随后正常进行验证并使用其信任策略将账户合作伙伴属性映射到 Web 应用程序支持的属性。\n7. ADFS 创建包含资源合作伙伴属性的新 SAML\
  \ 令牌，并将 Cookie 存储在用户的计算机上。然后用户被重定向到 Web 应用程序，应用程序可以读取 Cookie 并允许属性支持的访问。\n\n###\
  \ OAuth\n\n\n\n\n\nOAuth 2.0 协议提供了一个授权框架，旨在允许第三方访问基于 HTTP 的服务。它由互联网工程任务组（IETF）开发，支持\
  \ Web 客户端、桌面设备、移动设备以及广泛的其他嵌入式和移动技术，以及它们连接的服务提供者。OAuth 提供了访问委托功能，允许服务提供者代表你执行操作。\n\
  \nOAuth 流程涉及四个方参与：\n\n* `Clients`（客户端）：用户想要使用的应用程序\n* `Resource Owners`（资源所有者）：终端用户\n\
  * `Resource Servers`（资源服务器）：由资源所有者希望应用程序使用的服务所提供的服务器\n* `Authorization Servers`（授权服务器）：由身份提供者拥有的服务器\n\
  \n图 2.7 显示了认证流如何与 OAuth 一工作。在这一链中，客户端尝试访问第三方服务。作为消费者的第三方网站被重定向到服务提供者进行身份验证。为了请求身份验证，消费者发送一个获取请求令牌（request\
  \ token）的请求。服务提供者验证用户身份，授予请求令牌，然后将消费者重定向回服务提供者。在那里，服务提供者获得用户授权并将用户发送到第三方网站。消费者请求访问令牌（access\
  \ token），服务提供者授予令牌，然后消费者就可以访问资源。\n\n![FIGURE 2.7 OAuth 认证过程](img/c02f007.png)\n\n\
  `FIGURE 2.7` OAuth 认证过程\n\n### OpenID Connect\n\nOpenID Connect 通常与 OAuth 配对使用以提供认证。它允许授权服务器在提供\
  \ OAuth 授权令牌之外额外发布 ID 令牌（ID token）。这使得服务能够知道该操作已获得授权，并且用户已通过身份提供者身份验证。\n\n### 特权访问管理\
  \ (PAM)\n\n`特权访问管理`（`PAM`）描述了一系列技术和实践，用于管理和保护组织内部的系统、用户和应用程序的特权账户、访问和权限。PAM 依赖于最小权限原则——即应该授予完成任务或角色所需的最少权限。\n\
  \n特权账户不仅是 root、admin 或类似的账户（尽管这些是超级用户账户常见的示例，因此通常是人们首先想到的特权账户）。其他示例还包括服务账户、应用程序账户、本地和域管理员账户、用于处理密码更改或其他类似特权任务的帮助台账户，以及有时被称为“断路”（break\
  \ glass）的紧急访问账户。在某些情况下，用户账户也可能赋予特定的特权访问，需要对这些账户进行特权访问管理。\n\nPAM 有助于解决许多常见问题，包括权限过度配置、生命周期管理以及由于用户更换工作和角色而保留权限导致的权限蔓延、嵌入式或硬编码凭据的使用以及类似的问题。\n\
  \n虽然 CySA+ 考试目标涵盖的许多 IAM 概念侧关注认证，但 PAM 侧关注权限和生命周期管理，为凭据和权限随时间推移的使用提供了更广泛的视角。\n\n\
  ### 云访问安全网关 (CASB)\n\n另一种云安全工具是云访问安全网关（`CASB`）。CASB 工具是策略执行点，可以存在于本地或云端，并且在使用云资源和服务时强制执行安全策略。CASB\
  \ 可以帮助于数据安全、反恶意软件功能、服务使用情况和访问可见性以及风险管理。正如你对强大工具的预期那样，CASB 可以非常有帮助，但需要仔细的配置和持续的维护。\n\
  \n## 加密与敏感数据保护\n\n加密和哈希对于我们讨论过的每一层中的许多控制措施都是至关重要的。它们在网络安全、主机安全和数据安全中发挥作用，并嵌入在每一层依赖的许多应用程序和系统中。\n\
  \n这意味着使用当前的安全的加密技术并确保进行适当的密钥管理对于分层安全设计至关重要。在审查安全设计时，识别何时加密（以及哈希）、如何使用，以及加密密钥及其密码是如何存储的，是非常重要的。了解数据何时被加密以及何时未加密也很重要——安全设计可能会失败，因为安全发送的经过加密的数据可能未加密并存储在缓存中或由本地用户处理，从而消除了其在传输过程中依赖的保护。\n\
  \n### 公钥基础设施 (PKI)\n\n`公钥基础设施`（PKI）用于发布加密证书，这些证书用于加密、用户和服务身份验证、代码签名和其他目的。PKI 依赖非对称加密来提供机密性、完整性并验证用户或实体确实为其声称的身份。\n\
  \n基本的 PKI 证书请求和颁发流程如图 2.8 所示。\n\n![FIGURE 2.8 PKI 证书请求过程](img/c02f008.png)\n\n`FIGURE\
  \ 2.8` PKI 证书请求过程\n\n五个主要组件如下：\n\n* 证书颁发机构 (CA)，负责创建、存储和签名证书\n* 注册机构 (RA)，负责验证请求证书的实体确实为其声称的身份\n\
  * 存储密钥的目录 (directory)\n* 支持访问和交付证书的证书管理系统\n* 证书策略 (certificate policy)，规定 PKI 使用的实践和程序，并用于验证\
  \ PKI 的信誉\n\nPKI 的另一个关键概念是证书撤销。证书包含各种信息，包括 `CRL` 或证书撤销列表的位置。`CRL` 允许证书颁发机构在证书过期前由于破解或取消而使其失效。这有助于确保不再受信任的证书可以被撤销。\n\
  \n### 安全套层 (SSL) 检查\n\n正如你在第 7 章“分析漏洞扫描”中所学习到的，安全套层（SSL）协议及其继任传输层安全（TLS）用于加密许多类型的网络流量。虽然你最可能看到它们用于加密到\
  \ Web 服务器的连接，但 `TLS` 也用于许多地方。\n\n当然，加密流量意味着无法观察、监控和分析它。这就是 `SSL 检查`设备和技术发挥用场的地方。`SSL\
  \ 检查` 要求插入监控设备进行离线分析，或者通过拦截 HTTPS 或其他 `TLS` 连接，在检查设备或系统中终止连接，然后将连接传递给原始目的地。这允许中间系统在检查流量的同时，保持连接两端的流量加密状态。\n\
  \n由于 `TLS` 依赖证书建立信任，使用此类设备需要组织内的系统信任该证书；否则连接将显示错误或安全问题。\n\n\n\n\n\n由于 SSL 检查通常在在使用之前需要额外的努力和设置，因此在某些情况下，管理员可能无法控制设备，或者带宽或其他限制可能产生问题的情况下，它并不总是实用的。由于它暴露了本应加密的流量，如果攻击者或恶意内部人员能够访问\
  \ SSL 检查系统或服务，他们也将获得查看并可能修改流量的机会。\n\n### 数据泄露防护 (DLP)\n\n`数据泄露防护 (DLP)`` 系统和软件旨在保护数据不离开其应被包含的组织或系统。一个完整的\
  \ `DLP` 系统针对传输中的数据、静态存储的数据和使用中的数据，以及可能访问或存储数据的端点系统。`DLP` 依赖于识别应受保护的数据，然后检测泄露何时发生，当系统之间和跨网络频繁使用加密技术时，这可能是具有挑战性的。这意味着\
  \ `DLP` 安装结合了终端软件以及各种让网络流量对 `DLP` 系统可见的手段。\n\n### 个人身份信息 (PII)\n\n`个人身份信息 (PII)``\
  \ 是是指任何可以通过直接或间接方法合理地识别出个人的任何信息。`PII` 的常见示例包括财务和医疗记录、地址和电话号码，以及美国的国家或州身份号码，如`社会安全号码`、`护照号码`和`驾照号码`。\n\
  \n### 持卡人数据 (CHD)\n\n`持卡人数据`(`CHD`)` 是信用卡信息，包括主账户号 (`PAN`)、持卡人姓名和有效期。被称为敏感身份验证数据的额外信息包括\
  \ `CVV` 或卡片验证码、磁条和芯片中包含的数据，以及如果使用了 `PIN 码`（密码码）。`CHD` 通常根据支付卡行业协会的 `PCI DSS` 标准被称为\
  \ `PCI 数据`。\n\n## 总结\n\n理解系统和网络架构概念及设计是安全专业人员的一项重要技能。利用设计概念并识别安全问题可能发生位置的能力可以帮助组织变得更加安全。\n\
  \n现代基础设施通常涉及虚拟化元素，这允许虚拟计算机在物理硬件上运行。容器化变得越来越普遍，许多组织正努力将应用程序和服务迁移到容器中，因为它们是轻级且易于迁移的，非常适合云环境。同时，越来越多的服务和应用程序正在被构建以利用无服务器计算，即它们以函数的形式存在，而不是运行应用程序或系统。\n\
  \n操作系统安全仍然是组织的优先考虑事项。系统加固限制了其攻击面，是成熟组织正常系统管理实践的一部分。`Windows` 系统的加固利用了多种技术，包括保护 `Windows\
  \ 注册表`。分析师还需要了解配置文件的常见位置、系统进程是什么，以及硬件架构如何影响系统可以运行以及恶意软件如何影响它们。\n\n日志记录允许安全分析师和管理员审查系统或服务上发生的情况。日志分析依赖于关联日志的能力，使得时间同步对于审查至关重要。未进行正确时间同步的日志可能会对发生的情况和时间产生错误或误解。同时，可能需要正确设置日志级别，以在收集的信息量所需的细节之间取得平衡。\n\
  \n安全从业人员需要考虑本地、云和混合网络。通过 `VLANs`、`防火墙`甚至物理隔离等工具和技术进行网络分有助于控制风险。软件定义网络允许通过代码控制网络，使其在不进行物理更改的情况下具有灵活且可管理的。零信任和\
  \ `SASE` 都是现代网络中的重要设计概念。\n\n## 考试要点\n\n**解释基础设施概念和设计。** 描述`无服务器`、`虚拟化`和`容器化`概念，它们通常在何时以及为何使用，以及它们之间有什么不同。\n\
  \n**理解操作系统概念。** 解释系统加固，并理解系统加固在组织安全实践中的作用。描述 `Windows 注册表`，以及为什么它作为操作系统安全的一部分非常重要。了解\
  \ `Windows` 和 `Linux` 等常用操作系统的常见文件结构信息和配置文件位置。描述系统进程。理解硬件架构在系统安全中的作用。\n\n**理解日志记录的关键操作要素。**\
  \ 解释为什么时间同步对日志分析至关重要，以及如何实现同步。描述日志级别以及为什么选择合适的日志级别非常重要。\n\n**解释网络架构概念和技术。** 描述本地、云和混合网络之间的相似之处和差异，以及每种模型的安全关注点。理解网络分段并解释为什么它有用以及如何实现它。描述软件定义网络、零信任和安全访问边缘技术及设计。\n\
  \n**理解身份和访问管理。** 解释多因素身份验证，包括身份验证因子。描述无密码认证。理解单点登录及其在组织中的作用。解释联邦以及联邦身份如何工作。了解特权访问管理\
  \ (`PAM`) 和云访问安全代理（ (`CASBs`) 作为身份基础设施的一部分的作用和用途。\n\n\n\n\n描述如何使用加密来保护敏感数据。解释公钥基础结构（PKI）及其常见组件。理解\
  \ SSL 检查、其用途和缺点。解释如何使用数据泄露防护（DLP）以及有效实施所需的所需的条件。描述敏感数据，并了解个人身份信息（PII）与持卡人数据（CHD）之间的区别。\n\
  \n## 实验练习\n\n### 活动 2.1：为实验设置虚拟机\n\n在本次练习中，你将设置一个供后续实验使用的虚拟机。如果你已经有了 VMware Workstation、VMware\
  \ Player 或 VirtualBox，可以跳过本次练习的第一部分。\n\n### 第 1 部分：下载 VMware Player\n\n1. 访问 `www.vmware.com/products/workstation-player.html`。\n\
  2. 下载 VMware Workstation Player。\n3. 安装 VMware Player。\n\n### 第 2 部分：下载虚拟机\n\n*\
  \ 现在你已经有了虚拟化工具，可以准备下载实用的虚拟机了。这取决于你的带宽，可能需要一些时间。\n\n1. 访问 `www.kali.org/get-kali`\
  \ 并选择 Virtual Machines（虚拟机），然后选择 64 位 VMware 选项。你需要一个像 `7-Zip` 这样的解压缩工具来提取压缩文件。\n\
  2. 访问 `https://information.rapid7.com/download-metasploitable-2017.html` 并下载 Metasploitable\
  \ 虚拟机。\n\n### 第 3 部分：设置虚拟机\n\n1. 导航到你下载的 Kali Linux 文件。如果你还没有存储，请将该文件解压到存储 VMware\
  \ 镜像的位置。\n2. 打开 VMware Player 并选择 `Open A Virtual Machine`（打开虚拟机）。导航到你的 Kali Linux\
  \ 目录并选择 `VMX` 文件，然后点击 `Open`（打开）。\n3. 你现在可以点击虚拟机的绿色播放按钮运行。\n4. 对 Metasploitable\
  \ 虚拟机重复此过程。\n\n你现在拥有了可以在整书中用于练习的虚拟机。\n\n### 活动 2.2：探索 Windows 注册表\n\n在本次练习中，你将探索\
  \ Windows 注册表。\n\n1. 在具有管理员权限的 Windows 系统上，从搜索栏运行 `regedit`。你也可以搜索并运行 `regedit`。你需要在询问是否要允许\
  \ `regedit` 对你的计算机进行更改的提示中回答“是”。\n2. 探索主注册表单元（Hives）。展开每个单元以查看它们包含键和值。不要进行任何更改。\n\
  3. 在注册表中查找最大密码有效期。导航到 `HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\\
  SeCEdit\\Reg Values\\MACHINE/System/CurrentControlSet/Services/Netlogon/Parameters/`。记录你看到的内容。\n\
  4. 从开始菜单搜索 `secpol.msc`，然后右键点击它并选择`以管理员身份运行`。\n5. 导航到 安全设置 ➢ 本地策略 ➢ 安全选项 ➢ 域成员：计算机帐户密码最大有效期并记下该值。\n\
  6. （高级阶）关闭 `regedit`。在 `secpol.msc` 中更改最大密码有效期的值，并使用 `regedit` 检查发生了什么变化。\n\n###\
  \ 活动 2.3：审查系统加固指南\n\n在本次练习中，你将探索 Windows 11 独立版 CIS 基准（Benchmark）。本次练习将帮助你理解基准的组成部分，以及你如何根据组织需求对其进行更改或调整。\n\
  \n1. 访问 `www.cisecurity.org/cis-benchmarks` 并选择 Access All Benchmarks（访问所有基准）。\n\
  2. 你需要提供联系信息以接收提供访问基准的电子邮件。\n3. 收到邮件后，访问下载站点并下载 Windows 11 独立版基准（或者你喜欢的其他基准，但本次练习是针对\
  \ Windows 11 基准编写的——如果你愿意，欢迎调整练习内容）。\n4. 打开基准 PDF 并滚动查看索引——这是一个非常巨大的文档，所以不要尝试读完。\n\
  5. 导航到第 398 页——注意 PDF 中的页码与实际页码不同，你需要的是标记为 398 的页码。该页描述了帐户锁定设置。查看描述、影响和说明。注意它还包含了关于该设置的引用和其他细节。此设置对于你的环境合理吗？为什么合理或不合理？如果你被要求为大型组织中的每个系统都开启此设置，你会表达哪些担忧？\n\
  6. 对第 537 页上的设置重复此过程。针对能够自动连接到开放热点、联系人共享的网络以及提供付费服务的热点的能力，回答相同的问题。\n\n你现在已经对配置基准进行了一些基础审查。滚动查看剩余索引，识别出一两个两个你可能在练习中感兴趣的设置，然后就完成了！\n\
  \n## 复习题\n\n1. Naomi 想让她的应用程序具有可移植性并容易移动到新环境，而无需完整操作系统的开销。她应该选择哪种解决方案？\n   1. x86\
  \ 架构\n   2. 虚拟化\n   3. 容器化\n   4. SASE 解决方案\n\n2. Bharath 想要更改 Windows 注册表。他应该选择什么工具？\n\
  \   1. `regwiz.msc`\n   2. `notepad.exe`\n   3. `secpol.msc`\n   4. `regedit`\n\n\
  3. Tom 在故障时想为他的 Cisco 网络设备设置适当的日志级别。他应该设置什么级别？\n   1. 1\n   2. 3\n   3. 5\n   4.\
  \ 7\n\n4. 以下哪不是网络分的常见用途？\n   1. 减少攻击面\n   2. 限制合规性范围\n   3. 提高可用性\n   4. 降低效率\n\n\
  5. Ric 的组织想要实施零信任。Ric 对实施方案应该提出什么担忧？\n   1. 实施可能非常复杂。\n   2. 零信任不支持 TLS。\n   3.\
  \ 零信任与现代软件不兼容。\n   4. 可能会阻止用户完成工作。\n\n6. Michelle 拥有一个公司发给她的安全令牌。她拥有什么种类型的因素？\n\
  \   1. 生物识别\n   2. 拥有因素\n   3. 知识\n   4. 固有性\n\n7. 在联邦服务模型中，哪一方对身份做出断言？\n   1. RPs\n\
  \   2. CDUs\n   3. IDPs\n   4. APs\n\n8. 这种设计概念要求在允许操作之前进行验证和确认？\n   1. 安全访问\n \
  \  2. 零信任\n   3. 信任验证\n   4. 扩展网络\n\n9. Juan 的组织使用 LDAP 让用户登录各种服务而无需输入用户名和密码。使用的是哪种服务？\n\
  \   1. SSO\n   2. MFA\n   3. EDR\n   4. ZeroAuth\n\n10. Jen 的组织想要确保管理员凭据不被滥用。Jen\
  \ 应该推荐哪种解决方案来解决这个问题？\n    1. SAML\n    2. CASB\n    3. PAM\n    4. PKI\n\n11. 财务和医疗记录是什么种数据的示例？\n\
  \    1. CHD\n    2. PCI\n    3. PII\n    4. TS/SCI\n\n12. 以下哪项不是信用卡的持卡人数据？\n   \
  \ 1. 持卡人姓名\n    2. CVV 代码\n    3. 有期日期\n    4. 主账户号码\n\n13. Sally 想要查找 Windows 系统的配置文件。以下哪项不是常见的配置文件位置？\n\
  \    1. Windows 注册表\n    2. `C:\\Program Files\\`\n    3. `\\Windows\\Temp`\n  \
  \  4. `C:\\ProgramData\\`\n\n14. PIN 是什么种类型的因素？\n    1. 位置因素\n    2. 生物识别因素\n  \
  \  3. 拥有因素\n    4. 知识因素\n\n15. 哪种协议用于确保日志时间同步？\n    1. TTP\n    2. NTP\n    3. SAML\n\
  \    4. FTP\n\n16. OAuth、OpenID、SAML 和 AD FS 都是什么种技术的示例？\n    1. 联邦\n\n\n\n2. 多因素身份认证\n\
  3. 身份验证\n4. PKI\n\n17. Example 公司将其网络分为不同的网络区域，包括销售、人力资源、研发和访客网络，每个区域都使用网络安全设备相互隔离。Example\
  \ 公司正在使用哪种概念进行网络安全管理？\n\n1. 分段\n2. 软件定义网络\n3. 避免单点故障\n4. 分区域路由\n\n18. 在对 Anna 的公司进行渗透测试期间，渗透人员成功破解了公司的\
  \ Web 服务器并删除了其日志文件，防止了对其攻击的分析。未来哪种补偿性控制最适合防止此类问题？\n\n1. 使用全盘加密\n2. 使用日志轮转\n3. 将日志发送到\
  \ syslog 服务器\n4. 使用 TLS 保护流量\n\n19. Ben 正在为组织准备一套系统加固程序。以下列哪项*不是*典型的系统加固过程或步骤？\n\
  \n1. 更新和补丁系统\n2. 启用额外的服务\n3. 启用日志记录\n4. 配置磁盘加密\n\n20. Gabby 正在为她的公司设计多因素身份认证系统。她决定使用密码短语、基于时间的代码生成器和\
  \ PIN 码来提供额外的安全性。完成后，她实现了多少种不同的因素？\n\n1. 一个\n2. 两个\n3. 三\n4. 四\n\n# 第 3 章 恶意活动\n\
  \n响应安全事件和网络事件是网络安全分析师的常见任务，为了做到这一点，你需要如何识别常见的入侵指标（IOC）。网络问题如过度或可疑的带宽消耗、探测和扫描以及非法设备，都是安全专业人员可能会遇到的，并可能指示问题的存在。主机和应用程序问题也经常是响应的一部分，包括主机性能问题、恶意软件和针对性攻击。这使得知道要寻找什么、如何寻找以及你的响应选项是什么，成为网络安全运营的重要部分。\n\
  \n在本章的第一节中，你将学习常见的网络事件，范围从带宽使用、数据外泄到扫描、探测和拒绝服务攻击，以及一些经常用于检测这些事件并进行此类分析的工具和技术。在随后的章节中，你将学习主机和应用程序问题、解决这些问题的检测和分析技术，以及与这些症状相关的常见问题的处理示例。\n\
  \n## 分析网络事件\n\n许多事件始于发现可疑或异常的网络流量。这些事件可能表现为带宽消耗、信标（beaconing）或其他异常流量（如扫描），或不规则的点对点流量、攻击流量，或出现在网络上的非法设备。作为网络安全分析师，你必须能够收集、关联和分析来自大量系统和网络设备的数据，以检测，或者更准确地说，防止这些事件演变成严重问题。\n\
  \n### 捕获网络相关事件\n\n获取网络高层理解的第一步骤之一是获取网络可用带宽使用情况的视图。这通常通过三种常用方法之一实现：基于路由的监控、主动监控或被动监控。\n\
  \n#### 基于路由的监控\n\n基于路由的监控依赖具有路由能力的路由器或交换机，提供有关网络流量和网络设备本身状态的信息。由于路由器通常放置在网络边界或其他内部边界，基于路由的监控可以提供这些点流量的有用视图。\n\
  \n大多数基于路由的监控依赖于捕获通过设备的流量数据。这些关于流量流的信息通常被称为“网络流”（network flows）。存在许多技术来捕获流和其他路由器信息，包括\
  \ `NetFlow`，或类似的技术如 `sFlow` 和 `J-Flow`，这些都是监控流量流的标准。它们记录了网络设备接口上的流量信息，然后将这些信息发送到流收集器（flow\
  \ collectors）。由于数据量巨大，流通常是经过采样的，这意味着每千个或每百个数据包中采样一个，而不是每一个数据包。\n\n除了基于流的报告外，简单网络管理协议（`SNMP`）常用于从路由器和其他网络设备收集信息，并提供更多关于设备本身的信息，而不是流捕获协议提供的流量流信息。\n\
  \n在图 3.1 中，一个典型的网络示例展示了路由器的中心布局如何提供网络整体流量流的视图。从分布交换机发送到其他部门网络或互联网的流量将通过部门路由器并可能通过边界路由器发送，从而在中央流收集系统上捕获网络流信息。\n\
  \n![图 3.1 路由器通过向流收集器发送数据来提供网络流量的中心视图。](img/c03f001.png)\n\n图 3.1 路由器通过向流收集器发送数据来提供网络流量的中心视图。\n\
  \n流信息看起来非常像典型的电话单信息——你可以看到你给谁打了电话、号码是多少以及通话了多久。通过流，你可以看到源、其 IP 地址、目的、其 IP 地址、发送了多少数据包、发送了多少数据，以及使用的端口和协议，这让你对正在使用什么应用程序做出合理的判断。图\
  \ 3.2 显示了 PRTG 的 `NetFlow` 工具示例，数据列出的方式允许对其排序和搜索。\n\n这些信息对于日常监控和调查都非常有用。此外，将流数据馈给具有基于行为检测能力的安全监控工具，可以识别诸如与远程命令控制（C&C）系统的意外通信。在图\
  \ 3.2 中，你可以看到本地主机正在访问远程网站——`192.168.1.14` 访问 `157.240.2.35`（Facebook 内容分发网络主机）。如果你查看流量时发现了非预期的流量，或者在调查可疑流量，流可以提供一种快速查看特定主机正在做什么的有用方法。网络流数据既可用于主动（监控整体网络状况和流量水平），也可用于响应（监控意外流量或网络带宽使用的突然变化）。这些数据通常使用安全信息和事件管理（`SIEM`）设备或日志分析工具与其他网络和系统日志及事件数据相结合，以提供更深层次的分析和能力。\n\
  \n![图 3.2 NetFlow 数据示例](img/c03f002.png)\n\n图 3.2 NetFlow 数据示例\n\n#### 主动监控\n\n\
  主动监控技术访问远程系统和设备以收集数据。与流和 SNMP 监控通过通过向收集器发送信息来收集数据不同，主动监控通常是数据收集点（尽管它们可能会将这些信息转发到收集器）。主动监控通常收集可用性、路由、包延迟或丢失以及带宽的数据。\n\
  \n以下是主动监控的两个示例：\n\n\n\n\n\n*   **Pings:** 也可以使用互联网控制消息报协议 (`ICMP`) 通过 ping 远程系统来主动获取网络数据。这仅提供了基础的在线/离线信息，但对于基本用途，`ICMP`\
  \ 提供了一个简单的解决方案。\n*   **iPerf:** 一种用于测量 IP 网络能够处理的最大带宽的工具。公共 `iPerf` 服务器允许对链路带宽进行远程测试，同时也还支持进行内部带宽测试。`iPerf`\
  \ 测试数据可以帮助建立性能基准，有助于识别网络何时达到其有效界限。\n\n主动监控和基于路由的监控都会向网络添加流量，这意味着网络监控系统可能会与它们正在监控的流量竞争。当出现显著的网络带宽利用问题时，这种类型的网络监控数据可能会丢失或延迟，因为高优先级的流量可能会被置于监控数据之上。\n\
  \n## 被动监控\n\n被动监控依赖于流量通过网络链路上的某个位置时捕获网络信息。在图 3.3 中，网络监控器使用网络分接器发送端点 A 和 B 之间发送的所有流量的副本。这允许监控系统捕获已发送的流量，提供流量速率、协议和内容的详细视图，以及数据包发送和接收的性能细节。\n\
  \n![FIGURE 3.3 两个系统之间的被动监控](img/c03f003.png)\n\nFIGURE 3.3 两个系统之间的被动监控\n\n与主动监控和基于路由的监控不同，被动监控不会向网络添加额外流量。它还执行事后分析，因为数据包必须被捕获并分析，而不是在发送时实时记录。这意味着在选择技术时，应该考虑每种监控方法之间的权衡。\n\
  \n## 检测常见的网络问题\n\n一旦你对网络带宽和设备状态有了了可见性，你就可以利用这些知识来跟踪常见的网络问题。这些常见问题包括带宽消耗、链路和连接故障、信标行为（beaconing）以及意外流量。虽然这些问题都非常常见，但每种类型问题的原因可能非常多样！\n\
  \n### 带宽消耗\n\n带宽消耗会导致服务中断和业务功能故障，使其成为安全分析师和网络管理人员共同关注的问题。在设计良好的网络中，网络将配置为使用符合其设计、安全和监控要求的日志和监控方法，并将这些数据发送到一个可以提供带宽使用告警的中央系统。我们在本章已经讨论的技术可以提供检测带宽消耗问题所需的信息：\n\
  \n*   使用流数据的工具可以显示趋势和状态信息，表明网络带宽利用已达到峰值。\n*   可以使用监控工具检查高使用率水平，并根据阈值发送告警。\n*   可以使用实时或近实时的图表在产生使用时监控带宽。\n\
  *   `SNMP` 数据可用于监控路由器或网络设备层面的高负载以及带宽利用的其它迹象。\n\n### 信标行为 (Beaconing)\n\n信标活动（有时称为心跳）是作为僵尸网络或恶意软件远程控制系统的一部分发送到\
  \ C&C 系统的活动，通常以 `HTTP` 或 `HTTPS` 流量的形式发送。信标可以请求命令、提供状态、下载额外的恶意软件或执行其他操作。由于信标通常是加密的并与其他\
  \ Web 流量混在一起，因此可能很难识别，但检测信标行为是检测恶意软件感染的关键部分。\n\n信标行为的检测通常通过使用具有检测规则的 `IDS` 或 `IPS`\
  \ 来处理，这些规则可以识别已知的僵尸网络控制器或僵尸网络特定行为。此外，使用流分析或其他流量监控工具确保系统没有发送可能可能是信标的意外流量也是可能的。这意味着检查出站流量以确保感染系统未驻留在你的网络中，与处理入站流量的控制一样重要。\n\
  \n图 3.4 信标行为的检测通常通过使用具有检测规则的 `IDS` 或 `IPS` 来处理，这些规则可以识别已知的僵尸网络控制器或僵尸网络特定行为。此外，使用流分析或其他流量监控工具确保系统没有发送可能可能是信标的意外流量也是可能的。这意味着检查出站流量以确保感染系统未驻留在你的网络中，与处理入站流量的控制一样重要。\n\
  \n图 3.4 信标行为显示了通过 `HTTP` 访问远程站点的模拟信标行为，且每 10 秒发送一次。这种重复行为很难发现，但自动化分析可以可以识别它。使用在本章稍后介绍的\
  \ `Wireshark` 等工具直接捕获流量是很有用的，但 `IDS` 和 `IPS` 对于更广泛的视图更有用。\n\n![FIGURE 3.4 Wireshark\
  \ 中的信标](img/c03f003.png)\n\nFIGURE 3.4 Wireshark 中的信标\n\n### 意外流量激增\n\n网络中的意外流量有许多形式：扫描、遍历和探测；不应通信的系统之间的点对点流量；流量激增；意外端口上的活动；或直接攻击流量。意外流量可以通过内置在\
  \ `IDS` 和 `IPS` 中的行为能力、流量监控系统或手动观察系统之间的流量来检测。理解预期和意外流量取决于三种主要技术：\n\n*   基准（或异常检测），需要了解什么是正常。基准通常在正常网络运行时收集。一旦收集了基准数据，当超过给定阈值或网络行为偏离基准时，监控系统即可告警。\n\
  *   启发式（或基于行为的检测），使用网络安全设备和定义的规则来检测扫描、遍历、攻击流量和其他网络问题。\n*   协议分析，使用协议分析器捕获数据包并检查问题。协议分析器可以帮助发现意外流量，例如在没有预期\
  \ VPN 流量的网络中的 VPN 流量，或来自 IPv4 网络中的 IPv6 隧道。它们还可以帮助识别当常用协议通过异常端口发送时，这可能表明攻击者正在设置替代端口。\n\
  \n并不是所有的意外流量都是恶意的，但确保你拥有适当的系统和方法来检测异常和意外行为，并且能够识别意外流量的发生以便做出响应对应的。\n\n## 检测扫描和遍历\n\
  \n扫描、遍历和探测本身对基础设施通常不是重大威胁，但它们通常是针对性攻击的前奏。检测扫描和探测通常非常简单：网络扫描由于其包含的行为（如对服务端口进行顺序测试、连接网络中的许多\
  \ IP 地址以及对可能未服务的重复请求）通常很容易检测。更隐蔽的扫描和探测在网络噪声中更难以检测，而在连接到互联网的系统中检测来自远程系统的隐蔽扫描可能非常有挑战性。\n\
  \n幸运的是，大多数 `IDS` 和 `IPS` 以及如防火墙和网络安全设备等其他网络安全设备都内置了扫描检测功能。启用这些功能可能会产生大量噪声，在许多情况下，你对扫描无能为。许多组织选择将扫描检测数据馈送到安全信息管理工具中，并与攻击和其他事件的数据相结合，而不是直接响应扫描和探测。\n\
  \n\n\n\n\n# 检测拒绝服务与分布式拒绝服务攻击\n\n`Denial-of-service (DoS)` 攻击可以以许多形式存在，但其目标保持不变：阻止对系统或服务的访问。这些攻击可以从单个系统发起，也可以作为分布式拒绝服务（DDoS）攻击的一部分，从多个系统发起。检测和防止\
  \ DoS 攻击已成为网络安全分析师技能中日益重要的一部分。\n\n## DoS 攻击\n\nDoS 攻击通常包含以下一种或多种攻击模式：\n\n*   试图通过大量的请求或流量来淹没网络或服务\n\
  *   针对特定服务或系统漏洞进行攻击，导致系统或服务故障\n*   针对中间系统或网络进行攻击，防止流量在两个位置之间传输\n\n每种类型的攻击都需要略不同的检测方法。这意味着，你的网络、系统和服务监控能力需要进行配置，以便根据可能针对你基础设施的攻击类型来监控多种类型的攻击。\n\
  \n来自单个系统或网络的 DoS 攻击通常可以通过防火墙或其他网络安全设备拦截该系统或网络来停止。`IPS` 也可以拦截已知的攻击流量，防止 DoS 攻击的发生。除非目标受到特定的服务或应用程序漏洞的影响，或者由于带宽或其他资源限制，目标很容易被单个远程系统淹没，否则单系统\
  \ DoS 攻击的可能性低于 DDoS 攻击。\n\n## 分布式拒绝服务攻击\n\n`Distributed denial-of-service (DDoS)`\
  \ 攻击同时来自许多系统或网络。由于流量来自许多地方，它们很难检测，这使得它们更难停止。许多 DDoS 攻击由僵尸网络中的受感染系统组成，允许攻击者从数百或数千个系统发送流量。\n\
  \n## 检测 DoS 和 DDoS 攻击\n\n由于 DoS 和 DDoS 攻击有很多种类，建立有效的 DoS 和 DDoS 检测能力通常涉及多种类型的工具和监控系统。这些通常包括：\n\
  \n*   使用服务性能监控工具进行性能监控\n*   使用本地系统或应用程序日志进行连接监控\n*   网络带宽或系统带宽监控\n*   启用 DoS 和 DDoS\
  \ 检测规则的专用工具，如 `IDS` 或 `IPS`\n\n在事件响应期间，用于分析网络流量的命令行工具（如 `netstat`）可以帮助本地服务器的故障排除，但从网络或服务的角度来看通常能为问题提供更广泛的视角。\n\
  \n## 检测其他网络攻击\n\n可以使用前面概述的技术检测其他基于网络的攻击：\n\n*   使用 `IDS` 或 `IPS`\n*   监控流、`SNMP`\
  \ 和其他网络信息是否存在可疑行为\n*   将防火墙、路由器、交换机和其他网络日志馈到中央日志分析和监控系统\n*   使用 `SIEM` 设备审查并自动对问题流量进行告警\n\
  *   部署主机级工具，如终端检测与响应 (`EDR`)，它们在端点级监控网络行为\n\n## 检测和发现非法设备\n\n`Rogue devices` 是连接到不应连接网络的设备，可能是由于策略原因，也可能是被攻击者添加。发现非法设备可能具有挑战性——许多网络有数百或数千个设备，而且设备管理在网络中可能并不一致。\n\
  \n识别非法设备的常用方法有很多：\n\n*   **有效 MAC 地址检查**：使用提供给网络设备的硬件 (`MAC`) 地址信息，验证设备向已知设备列表呈现的硬件地址。\n\
  *   **MAC 地址厂商信息检查**：网络设备供应商为其设备使用厂商前缀。这意味着根据制造商识别许多设备。\n*   **网络扫描**：使用 `nmap`\
  \ 等工具执行以识别新设备。\n*   **现场勘测**：涉及通过手动验证或检查现场无线网络来物理检查场地的设备。\n*   **流量分析**：用于识别不规则或异常的行为。\n\
  \n有线网络和无线网络面临的非法设备威胁略有不同，在响应潜在事件时，你需要意识到这些差异。\n\n### 有线非法设备\n\n大多数有线非法设备依赖开放或未认证的网络进行连接。没有像检查信任\
  \ `MAC` 地址的 `port security` 或 `network access control` (`NAC`) 技术等访问控制的开放网络是有线非法设备的容易目标。有线非法设备通常意味着发生了以下两种可能的情况之一：\n\
  \n*   组织的员工或其他受信任成员连接了设备。\n*   攻击者向网络连接了设备。\n\n第一种情况可能是简单的失误，但第二种情况意味着攻击者已经物理接触了你的网络。无论何种情况，连接到网络的非法设备都应该迅速响应以便将其移除。\n\
  \n### 无线非法设备\n\n无线非法设备会带来额外的挑战，因为它们并不总是能追踪到特定位置。这意味着追踪非法设备可能涉及使用信号强度测量并将非法设备所在的区域进行映射以尝试定位它。幸运的是，如果无线非法设备接入了你的网络，使用开启了操作系统识别的端口扫描通常可以帮助定位该设备。在图\
  \ 3.5 中，一个常见的家用路由器在连接到网络后被扫描。在这个示例中，`nmap` 无法立即识别该设备，但显然它不是台式系统，因为它显示路由器可能是一个 VoIP\
  \ 电话、防火墙或其他嵌入式设备。\n\n```\n![图 3.5 对潜在非法系统的 nmap 扫描](img/c03f005.png)\n```\n\n[**图\
  \ 3.5**]: 对潜在非法系统的 nmap 扫描\n\n## 调查与主机相关的问题\n\n服务器和工作站的安全问题可能很难识别。现代恶意软件非常擅长隐藏。幸运的是，系统监控工具可以通过检查与主机相关的问题来识别异常行为。这意味着系统监控对于安全和日常系统健康目的都是用的。\n\
  \n### 系统资源\n\n大多数服务器和工作站最基本的监控是资源监控。CPU、内存、磁盘和网络等系统资源的利用信息可以提供有关系统状态、负载以及是否存在问题的价值细节。\n\
  \n#### 处理器消耗与监控\n\n了解哪些进程消耗 CPU 时间、CPU 利用率是多少以及这些进程何时运行，对于事件检测和响应非常有用。突然的激增，或者在利用水平一致的系统中\
  \ CPU `processor consumption` 的增加，可能表明出现了新软件或之前未激活的进程。持续高 CPU 利用率也可能指向 DoS 状况。单用\
  \ CPU 负载信息通常无法说明整个问题，但它应该是你监控工作的一部分。\n\n#### 内存消耗与监控\n\n\n\n\nWindows 提供了内置的资源和性能监控工具。资源监视器（Resource\
  \ Monitor）或 `resmon` 是 Windows 资源监视器，提供了对 CPU、内存、磁盘和网络利用率的直观视图。除了利用率，它的网络监控功能还可以显示网络活动的进程、哪些\
  \ `TCP` 连接是打开的，以及哪些服务关联了系统的端口。图 3.6 显示示例 Windows 系统的资源监视器界面。\n\n性能监控器（Performance\
  \ Monitor）或 `perfmon`提供了更详细的数据，计数器范围从能量使用到磁盘和网络活动。它还支持从远程系统收集数据，提供了更广泛系统视图。对于详细的数据收集，`perfmon`\
  \ 是更好的解决方案，而 `resmon` 用于快速检查机器的基本使用指标。图 3.7 显示了配置了磁盘和处理器监控的 `perfmon`。这些数据可以组合成用户或系统定义的报告。\n\
  \n![图 3.6 Windows 资源监视器系统视图](img/c03f006.png)\n\n**图 3.6** Windows 资源监视器系统视图\n\n\
  **图 3.7** Windows 性能监控器系统使用视图\n\n\n\n\n`Data exfiltration`（数据外泄），即未经授权从系统和数据存储中移除数据，是恶意活动的关键指标。攻击通常寻求数据，以便其进行进一步的攻击和渗透，或者将其作为可以出售或直接利用的昂贵资产。所有类型的组织数据都是攻击者的主要目标。\n\
  \n这意味着安全实务人员需要使用能够检测并阻止数据外泄的工具和技术。同时，恶意攻击者试图通过多种方法掩盖外泄活动，包括使用加密、通过 `HTTPS` 等常用通道发送数据，或者通过\
  \ `DNS` 请求或其他服务的隐蔽通道（如隧道技术）发送。\n\n`EDR`、`IPS` 和数据泄露防护 (`DLP`) 系统等工具在监控和防止数据外泄方面都起着重要作用。分层防御结合适当的数据标记和保护，均可以帮助防御者检测、防止或停止数据外泄。\n\
  \n## 未经授权的访问、更改和权限使用\n\n对系统和设备的未经授权访问，以及导致意外更改的权限使用，是引起警觉的主要原因。遗憾的是，许多组织中系统的数量和种类，以及用户模型和权限模型的复杂性，使得监控未经授权的活动具有挑战性。\n\
  \n好消息是，监控未经授权的访问、更改和权限使用了我们已经讨论过的许多相同的技术和方法。表 3.1 列出了每种未经授权使用的的一些可能检测方法。\n\n**表\
  \ 3.1** 未经授权的使用与检测机制\n\n| 未经授权类型 | 记录数据 | 数据位置 | 分析工具 |\n| --- | --- | --- | ---\
  \ |\n| 未经授权访问 | 身份验证、用户创建 | 身份验证日志、用户创建日志 | 中央管理套件、SIM/SIEM |\n| 未经授权更改 | 文件创建、设置更改\
  \ | 系统日志、应用程序日志、监控工具 | 中央管理套件、SIM/SIEM、文件和目录完整性检查工具 (`Tripwire`) |\n| 未经授权权限使用 |\
  \ 权限使用尝试、权限提升 | 安全事件日志、应用程序日志 | SIM/SIEM、日志分析工具 |\n\n未经授权的权限可能难以追踪，特别是当它们没有经过集中化管理和审计时。幸运的是，像\
  \ `Sysinternals` 的 `AccessChk` 等工具可以通过验证特定用户或组对文件、注册表项和服务的访问来提供帮助。另一方面，尽管 `Linux`\
  \ 中的审计系统可以帮助检测权限的使用，但检查特定权限通常需要你编写脚本来检查你所关注的特定权限。\n\n### 注册表更改或异常\n\nWindows 注册表是想要维持\
  \ Windows 系统访问的攻击者喜欢的位置。使用运行键（run keys）、Windows 启动文件夹和类似技术是常见的持久化技术。\n\n注册表运行键可以在此处找到：\n\
  \n* ` `HKEY_LOCAL_MACHINE\\Software\\Microsoft\\Windows\\CurrentVersion\\Run`\n\
  * `HKEY_CURRENT_USER\\Software\\Microsoft\\Windows\\CurrentVersion\\Run`\n* `HKEY_LOCAL_MACHINE\\\
  Software\\Microsoft\\Windows\\CurrentVersion\\RunOnce`\n* `HKEY_CURRENT_USER\\Software\\\
  Microsoft\\Windows\\CurrentVersion\\RunOnce`\n\n### 社会工程学\n\n*Social engineering*（社会工程学），或利用安全中的人性因素，针对个人来收集信息。这可能通过电话、电子邮件、社交媒体或面对面进行。通常，社会工程学针对特定的访问或帐户，但也可能更具通用性。攻击者经常将人类视为安全架构和设计中的潜在弱点。然而，识别社会工程学需要与我们迄为止讨论的各种工具和流程不同的技术。\n\
  \n社会工程学的检测通常需要：\n\n* 意识培训，以确保员工能够能够检测并报告可能是社会工程学尝试的嫌疑行为\n* 及时时的报告流程，并鼓励员工报告社会工程学尝试和成功案例，且不具有惩罚性\n\
  * 分析和响应能力，以确定社会工程学尝试对哪些方面产生了何种影响（如果有的话），以及影响的范围\n\n考试大纲还特别列出了一种通常与钓鱼相关、但可能用于其他社会工程学攻击的技术。*Obfuscated\
  \ links*（混淆链接），即刻意误导的链接，是欺骗用户点击恶意网站的常用工具。\n\n## 调查服务和应用程序相关问题\n\n调查服务和应用程序问题需要关于正在运行的服务和应用程序的信息、它们的预期行为，以及服务的自报告和系统报告信息。在许多组织中，主动的服务监控也被用于判断服务是否正常工作。\n\
  \n应用程序和服务的相关事件，如错误行为、意外日志消息或错误、新用户或进程以及文件更改，都是服务可能被破坏的迹象。幸运的是，调查这些问题的许多工具已经内置在 Windows\
  \ 和 Linux 系统中。\n\n### 应用程序和服务监控\n\n监控应用程序和服务对组织的运营至关重要，还可以通过显示何时发生了异常行为以及应用程序和服务何时被滥用，来提供重要的安全洞察。\n\
  \n应用程序和服务监控可以分为以下几个常见的监控领域：\n\n\n\n\n\n- **运行/停止：** 服务是否正在运行？\n- **性能：** 它的响应速度是否快且符合预期？\n\
  - **事务日志：** 记录有关服务功能的信息，例如用户采取了哪些操作或执行了哪些操作。\n- **应用程序或服务日志：** 关于服务功能或状态的日志。\n\n\
  这些领域中的每一个都为了解应用程序或服务的状态、性能和行为提供了部分关键线索。在调查过程中，你通常需要识别出与服务典型记录内容不符的行为。\n\n## 应用程序日志\n\
  \n`Application logs`（应用程序日志）可以提供丰富的信息，但它们也要求你了解应用程序的日志格式以及这些日志包含的内容。虽然许多 Linux 日志存储在\
  \ `/var/log` 中，但 Windows 应用程序日志可能会由 Windows 日志基础设施收集，或者存储在应用程序特定的目录或文件中。\n\n安全专业人员的工作部分之一是确保在事件发生之前设置了适当的日志记录，以便日志可用，并防止其被攻击者修改或删除。将关键的应用程序日志发送到中央日志收集和/或分析服务是该策略的常见组成。\n\
  \n## 引入新账户\n\n攻击者经常尝试在应用程序中创建账户，作为其获取并保留访问权限努力的一部分。云托管和本地部署应用程序都需要日志记录和监控，以确保账户创建操作被记录，并且意外的账户创建会触发告报和报告。\n\
  \n对于拥有大量新账户的组织或服务，这可能是一个特殊的挑战。这意味着关注特权账户是一个很好的起点。对批量账户创建、定时创建的账户或从异常位置创建的账户进行额外监控，也是检测和识别潜在恶意账户创建的常用技术。\n\
  \n## 应用程序和服务异常检测\n\n服务和应用程序的异常活动相对常见。多种非安全相关问题可能导致此类问题：\n\n- 应用程序或服务特定的错误，包括身份验证错误、服务依赖问题和权限问题\n\
  - 应用程序或服务未能在启动时启动，可能是由于特定错误，或者对于服务是因为服务被禁用\n- 服务故障，通常由更新、补丁或其他更改引起\n\n服务和应用程序故障的排除通常从尝试启动或重启服务开始。如果没有成功，通过检查服务的日志消息或错误消息可以提供解决问题所需的信息。\n\
  \n由于安全问题导致的服务和应用程序异常可以使用相同的监控技术进行检测；然而，额外的工具对于确保服务及其组成文件和应用程序未被破坏将非常有用。除了常用的服务和日志监控工具，你可能还会选择部署额外的保护措施：\n\
  \n- 反恶意软件、杀病毒软件和 EDR 工具\n- 文件完整性检查工具\n- 允许列表工具\n\n### Windows 服务状态\n\n可以通过服务管理工具\
  \ (`services.msc`) 或使用命令行工具如 `sc`（服务控制器应用程序）来检查 Windows 服务状态。`sc` 接受命令行标记，用于设置服务的启动类型、指定启动失败时应设置的错误级别，并提供服务的详细信息。PowerShell\
  \ 还提供了如 `Start-Service` 等交互命令，用于与本地和远程 Windows 主机上的服务交互。\n\n### Linux 服务状态\n\n在大多数系统中，可以使用\
  \ `service` 命令检查 Linux 服务。`service [servicename] status` 将返回许多并非所有 Linux 服务的状态。你可以尝试运行命令来列出所有服务的状态：\n\
  \n```\nservice --status-all\n```\n\n使用 `init.d` 的 Linux 系统可以通过运行类似命令进行检查：\n\n```\n\
  /etc/init.d/servicename status\n```\n\nLinux 服务的重启过程取决于发行版。请检查你的发行版以验证它期望如何重启服务。\n\
  \n## 应用程序错误监控\n\n大多数 Windows 应用程序记录到 Windows 应用程序日志（尽管某些程序也维护自己的专用日志文件）。要检查应用程序错误，你可以通过\
  \ Windows 事件查看器查看应用程序日志。你还可以使用 SCOM 将这些日志集中化。\n\n许多 Linux 应用程序在 `/var/log` 目录或特定的应用程序日志位置提供有用细节。使用\
  \ `tail` 命令，你可以在测试应用程序时监控这些日志。与 Windows 类似，某些 Linux 应用程序将其文件存储在特定的应用程序位置，因此你可能需要检查应用程序的文档以跟踪应用程序提供的所有数据。\n\
  \n# 应用程序行为分析\n\n被破解或被成功攻击的应用程序可能会突然表现出非典型的行为：可能会发生出站通信、应用程序可能会对数据库或其他资源发出非典型行为请求，或者可能会创建新的文件或用户账户。理解典型的应用程序行为需要结合以下内容：\n\
  \n- 应用程序正常行为的文档，例如它应该连接到哪些系统以及应如何建立这些连接\n- 日志记录，提供正常操作的视图\n 使用 使用反恶意软件工具和其他安全监控系统进行启发式（行为）分析，以标记行为偏离常态的情况\n\
  \n## 使用工具和技术确定恶意活动\n\nCySA+ 考试大纲重点关注你需要在考试中熟悉的一小部分工具。它们包括数据包捕获、日志分析和关联、端点安全、DNS\
  \ 和 IP 信誉、文件分析以及沙箱工具。对于这些许多工具，你至少需要理解工具的概念以及如何应用。对于其他工具，你可能需要对工具或其输出有基本的了解。在查看这些工具时，你应该考虑你对它们的熟悉程度和经验，以确定是否需要进一步复习。\n\
  \n### 日志、日志分析与关联\n\n组织在监控和记录各种系统和服务后可能会产生大量的安全数据。安全分析师经常被要求分析这些数据以识别安全问题并响应安全事件。\n\
  \n这意味着分析师需要知道如何快速评估事件对组织的影响，并能够判断事件是局部的还是具有更广泛范围。分析事件的影响需要以下内容：\n\n- 了解其他事件是否与初始事件相关\n\
  - 了解哪些系统、用户、服务或其他资产涉及或受到影响\n- 对事件涉及任何数据资产进行分类\n- 可能影响组织对事件决策的其他信息\n\n分析数据还需要处理数据的能力，无论是使用安全信息和事件管理\
  \ (SIEM) 工具、通过像 Splunk 或 ELK（Elasticsearch、Logstash 和 Kibana）堆栈实现的日志和聚合技术，还是使用更手动的方法。\n\
  \n\n\n\n\n除了评估组织影响与局部影响之外，分析师还必须确定事件或事故的即时影响与总影响。单次事件可能导致极小或没有损害，但它也可能是更大范围入侵或针对组织的大规模攻击的迹象。\n\
  \n了解整个组织正在发生的情况可能涉及`趋势分析`技术，这有助于分析师看到事件偏离基准或正常水平的变化。它们还可以帮助分析师将事件与行业标准或历史模式进行比较。\n\
  \n### 日志\n\n组织基础设施中的应用程序、服务、系统和许多其他资产将生成日志，或者在配置适当的情况下具备生成日志。日志和日志源的巨大量可能会迅速让人无从下手，即使是小型组织，从日志发现发现意义的数据也可能是不可能的。\n\
  \n安全分析师需要了解系统中默认存在哪些日志、如何访问它们、如何查找这些日志内容的信息以及如何解释这些内容。此外，你需要了解组织如何使用日志、这些日志是否妥妥保护，以及日志收集和分析基础设施中存在哪些漏洞。\n\
  \n在阅读日志时，你还应该考虑组织如何在本地和云端实现日志及日志基础设施的集中。日志集中并使用处理、分析和报告海量日志的工具是现代安全架构中的关键元素。\n\n\
  ### 事件日志\n\n可以使用开始菜单中的`事件查看器`在工作站上直接查看 Windows 日志。默认情况下，Windows 包含应用程序、安全、安装和系统日志，对分析师都很有用。在图\
  \ 3.9 中，你可以看到一个显示安装程序事件的应用程序日志示例。跟踪特定包是在何时安装的以及由谁安装的，是许多恶意软件事件调查以及取证或事件响应过程的共同部分。\n\
  \n![图 3.9 Windows 事件查看器项目](img/c03f009.png)\n\n**图 3.9** Windows 事件查看器项目\n\n`事件查看器`也适用于\
  \ Active Directory 日志，尽管你会很快发现即使中等规模的域生成的日志也可能比你想在`事件查看器`中直接查看的多。将日志导出到专门的日志聚合和分析系统中是一个很有吸引力的选项。\n\
  \n### Syslog\n\nLinux 维护系统状态、事件和许多其他细节的信息，通常位于 `/var/log` 目录。额外的日志可能位于特定应用程序目录中，或者根据特定配置或应用程序及服务的默认位于系统的其他位置。\n\
  \n图 3.10 显示了 Ubuntu 服务器上的`auth.log` 文件，其中包含各种 `sudo` 事件。搜索包含使用管理员权限的已知事件是事件调查的常见部分。\n\
  \n![图 3.10 auth.log 中带有 sudo 事件的 Linux syslog 项目](img/c03f010.png)\n\n**图 3.10**\
  \ `auth.log` 中带有 `sudo` 事件的 Linux syslog 项目\n\n### 安全设备日志\n\n安全设备捕获有关安全事件、系统事件和其他对安全分析师有用的其他信息。尽管大多数设备都能发送兼容\
  \ syslog 的消息，但这些消息的内容及其格式方式在不同供应商之间可能存在显著差异。\n\n无论你查看的是什么种类型的日志，都要记住你正在寻找的事件类型，以及它中哪些与你正在搜索的事件或条目匹配的标识符。在许多情况下，你应该根据初始搜索发现的结果查找相关的条目。例如，如果你正在寻找到\
  \ IP 地址为 `10.1.10.4` 主机的拦截流量，你可能还想查看该主机的其他条目，并可能选择扩大搜索以搜索 `10.1.10.4` 的所有条目。\n\n\
  同样，如果你正在查看拦截的流量并发现 `192.168.1.172` 主机正在向 `10.1.10.4` 发送流量，并且你看到不同端口上有数百次尝试且全部被拦截，你可能会搜索日志查看\
  \ `192.168.1.172` 是否对你的整个网络进行端口扫描。\n\n#### 防火墙日志\n\n虽然有很多类型的防火墙日志，但大多数某些相似之处。它们通常识别源和目的\
  \ IP 地址、端口和协议，以及对流量采取的操作。它们可能还包含数据，例如匹配的角色、阻止相关的特定威胁标识符、流量进入或退出防火墙的接口或端口，以及发送流量的详细信息。\n\
  \n在图 3.11 中，你可以看到 Ubuntu UFW 防火墙的日志条目示例。注意条目显示了源和目的主机，并且正在访问的服务位于端口 `22` 上。在这种情况下，防火墙正在拦截对\
  \ OpenSSH 服务的访问，客户端一直在重试访问直到失败。\n\n![图 3.11 UFW 拦截连接防火墙日志条目示例](img/c03f011.png)\n\
  \n**图 3.11** UFW 拦截连接防火墙日志条目示例\n\n#### WAF 日志\n\nWeb 应用防火墙（WAF）是一种特殊的防火墙，在应用层运行，以过滤针对\
  \ Web 应用程序的攻击。许多 WAF 系统具有默认规则集，用于查找匹配 [OWASP Top Ten](http://owasp.org/www-project-top-ten)或其他常见应用程序风险的攻击，允许管理员快速启用规则集。\n\
  \n图 3.12 显示了一个针对 OWASP Top 10 的 ModSecurity 条目示例，在请求参数中发现了对 Bash shell (`/bin/bash`)\
  \ 的请求。此类日志条目可以根据日志内容识别活动攻击。\n\n![图 3.12 ModSecurity 日志条目示例](img/c03f012.png)\n\n\
  **图 3.12**\n\n### 代理日志\n\n与防火墙日志类似，代理日志可以提供有关连接和流量的有用信息。代理通常用于集中访问流量或过滤流量。因此，代理日志将包含源和目的\
  \ IP 地址、源和目的端口、请求的资源、日期和时间，通常还有内容类型和 HTTP 引用页以及关于内容的详细信息。\n\n在分析代理日志时，你应该寻找如下数据：\n\
  \n*   目标主机 IP、主机名以及请求的内容。\n*   请求的内容量。这可能指示入侵或匹配已知的恶意包。\n*   HTTP 请求方法，对于 `GET`\
  \ 请求可以提供查询字符串的详细信息（`POST` 请求将此内容放在消息正文中，需要读取完整有效负载，这更为复杂）。\n*   异常的 User Agent 和协议版本，这些可能对于识别应用程序、恶意软件或其他目标有用。\n\
  \n\n\n\n\n`IDS` 和 `IPS` 系统依赖规则来识别不受欢迎的流量。这意味着当 `IDS` 和 `IPS` 触发规则时，日志中将包含有关已激活规则的信息，以及有关被捕获并分析以触发该规则的流量信息。由于\
  \ `IDS` 和 `IPS` 系统通常分析数据包内容，并查看跨多个数据包或整个会话的流量以执行其功能，通常可以获得更多关于应用层发生的数据。例如，如果你正在跟踪一个使用基于互联网中继聊天（IRC）的\
  \ C&C 恶意软件，你可以搜索包含特定通道名称或所用昵称的规则命中。\n\n与我们讨论过的其他日志类型类似，找到第一个感兴趣的日志条目通常会引导你发现其他有趣的日志。在审查日志的过程中，对日志条目进行注释是有帮助的，记录下你需要进一步追踪的细节，以及根据你已掌握的知识后续还应该进行哪些其他搜索。\n\
  \n## 安全设备与工具\n\n安全设备和工具通常用于自动化并改进组织检测、识别和响应潜在恶意活动的能力。虽然该领域有很多解决方案，但 `CySA+` 考试大纲重点关注了三个你在考试中需要了解的工具。\n\
  \n### SIEM\n\n`安全信息和事件管理 (SIEM)` 工具利用集中式日志记录和数据收集，结合报告和分析能力来识别潜在的安全问题。这些信息与威胁信息、`IOCs`\
  \ 数据和其他信息相结合，以帮助识别问题。它们利用规则和过滤功能进行分析，允许组织处理由现代基础设施、系统和应用程序产生的海安全信息。\n\n`SIEM` 工具还提供事件管理和响应能力，允许进行跟踪、管理和监督。\n\
  \n### EDR\n\n`端点检测与响应 (EDR)` 工具部署在端点系统中，使用代理来监控并检测潜在的安全问题、攻击和入侵。端点代理向中央控制台或系统报告，提供可见性和管理能力。\n\
  \n`EDRs` 侧重于使用威胁模式、妥陷指标以及行为分析来判断问题是否正在发生或已经发生。它们可以自动做出响应，包括中和威胁、遏制威胁或告警安全从业人员或系统管理员。除了这些功能外，它们通常包含对取证分析和事件响应有帮助的工具。\n\
  \n### SOAR\n\n`编排、自动化和响应 (SOAR)` 工具用于集成安全工具和系统。它们依赖 `APIs`（应用程序编程接口）或其他集成方法从防火墙、漏洞扫描器、反病毒工具、`IDS`\
  \ 和 `IPS` 设备、`EDR` 和 `SIEM` 系统以及组织拥有的任何其他安全数据源收集数据。\n\n`SOAR` 平台提供的数据告警和报告集中化被用于驱动安全自动化任务，例如触发响应、跨系统的关联和告警，以及提供分析能力。`SOARs`\
  \ 的一个关键要素是使用剧本（playbooks），即在发生特定事件组或触发触发器时使用的自动化动作集。\n\n`SOAR` 平台还关注响应，内置了事件管理、监控和报告能力。从多个数据源的事件数据中构建可操作的威胁情报是\
  \ `SOAR` 用户的常见活动。\n\n## 数据包捕获\n\n包捕获工具允许你查看跨网络连接发送的流量。查看发送和接收的流量可以对网络上发生的情况提供深刻洞察，包括识别攻击、恶意活动以及识别连接问题等优点。`CySA+`\
  \ 考试大纲重点关注两个特定的且常用的包捕获工具。\n\n### Wireshark\n\n`Wireshark` 是一款图形化的包捕获和检查工具，适用于 Linux、Windows\
  \ 和 macOS。\n\n图 3.13 显示了使用 `Wireshark` 可以获得的一些深度详细信息。在这种情况下，你可以确定浏览网站的设备的用户代理、浏览了什么网站以及内容的细节。请注意主机是\
  \ `cdn.iphonehacks.com`，且所使用的设备被识别为运行 `iOS 13.2.2` 的 iPad。\n\n通过数据包和协议分析识别网络上的恶意软件，依赖于对流量应该是什么样以及哪些行为和内容是异常的深厚知识。如果你知道自己在寻找什么，或者正常和异常流量长什么样，数据包长度、目标\
  \ IP 地址、端口和协议都可以提供有用信息。当由于加密无法看到数据包内容时，寻找恶意流量可能更具挑战性。在数据包被加密的情况下，你可能需要依靠基于行为的分析，观察指示恶意软件的流量模式（例如访问已知的网站、在不常用的端口上发送意外流量或其他异常行为）。\n\
  \n### Tcpdump\n\n`Tcpdump` 是一种命令行包捕获工具，通常在 Linux 系统上可用，但也适用于其他操作系统。由于它内置在许多 Linux\
  \ 发行版中，安全专业人员通常可以在 `Wireshark` 无法立即可用或不方便使用时利用它。\n\n![图 3.13 带有数据包内容信息的 Wireshark\
  \ 包分析](img/c03f013.png)\n\n图 3.13 带有数据包内容信息的 Wireshark 包分析\n\n一个简单的 `tcpdump` 命令用于捕获端口\
  \ 80 上的流量以查看 HTTP 数据，且不限制捕获的数据量并带有详细输出，可以写为：\n\n```\ntcpdump -i eth0 -s0 -v port\
  \ 80\n```\n\n如果你不熟悉 `tcpdump`，可以在 `https://hackertarget.com/tcpdump-examples` 和\
  \ `https://danielmiessler.com/study/tcpdump` 等许多网站找到用法。\n\n## DNS 和 Whois 信誉服务\n\
  \n组织经常依赖信誉服务来识别潜在的恶意域名和 IP 地址。虽然 `Whois` 数据很有帮助，但由于所需和可用信息的规模，订阅服务或从自动馈获取数据更为常见。\n\
  \n你仍然需要知道如何使用 `Whois` 信息。需要注意的是，虽然 `Whois` 是一个通用术语，但也有名为 `Whois` 的网站地址为 `http://whois.com`。该术语更通用法是指通过\
  \ `Whois` 服务器检查 IP 地址或主机名。`Whois` 默认可以在 Linux 命令行中运行，但在大多数 Windows 机器需要手动添加。\n\n\
  当你运行 `whois` 时，它将尝试解析 IP 地址或域名并提供有关其的信息，包括注册和联系信息。以下是 `Wiley.com` 的 `whois` 搜索示例。请注意代码已省略，未包含此示例中的所有可用信息：\n\
  \n\n\n\n\n```\nDomain Name: wiley.com\nRegistry Domain ID: 936038_DOMAIN_COM-VRSN\n\
  Registrar WHOIS Server: whois.corporatedomains.com\nRegistrar URL: www.cscprotectsbrands.com\n\
  Updated Date: 2021-08-30T12:27:21Z\nCreation Date: 1994-10-12T00:00:00Z\nRegistrar\
  \ Registration Expiration Date: 2023-10-11T04:00:00Z\nRegistrar: CSC CORPORATE DOMAINS,\
  \ INC.\nSponsoring Registrar IANA ID: 299\nRegistrar Abuse Contact Email: domainabuse@cscglobal.com\n\
  Registrar Abuse Contact Phone: +1.8887802723\nDomain Status: clientTransferProhibited\
  \ http://www.icann.org/epp#clientTransferProhibited\nRegistry Registrant ID: \n\
  Registrant Name: Domain Administrator\nRegistrant Organization: John Wiley & Sons,\
  \ Inc\nRegistrant Street: 111 River Street\nRegistrant City: Hoboken\nRegistrant\
  \ State/Province: NJ\nRegistrant Postal Code: 07030\nRegistrant Country: US\nRegistrant\
  \ Phone: +1.3175723355\nRegistrant Phone Ext: \nRegistrant Fax: +1.3175724355\n\
  Registrant Fax Ext: \nRegistrant Email: domains@wiley.com\nRegistry Admin ID: \n\
  Admin Name: Domain Administrator\nAdmin Organization: John Wiley & Sons, Inc\nAdmin\
  \ Street: 111 River Street\nAdmin City: Hoboken\nAdmin State/Province: NJ\nAdmin\
  \ Postal Code: 07030\nAdmin Country: US\nAdmin Phone: +1.3175723355\nAdmin Phone\
  \ Ext: \nAdmin Fax: +1.3175724355\nAdmin Fax Ext: \nAdmin Email: domains@wiley.com\n\
  ```\n\n诸像 `AbuseIPDB` 这样的公共工具允许你搜索 IP 地址、域名或网络，以查看它们是否被举报过滥用。虽然 `AbuseIPDB` 专门包含在\
  \ CySA+ 考试大纲中，但类似的商业和免费服务广泛可用，也存在于邮件滥用跟踪。图 3.14 显示了针对近期有滥用活动的 IP 地址的 `AbuseIPDB`\
  \ 报告示例。\n\n![图 3.14 IP 地址的 AbuseIPDB 输出](img/c03f014.png)\n\n图 3.14 IP 地址的 AbuseIPDB\
  \ 输出\n\n安全管理员经常必须考虑，如果他们负责的系统被破解，应该如何从像 `AbuseIPDB` 这样的列表中移除。虽然每个网站的情况不同，但几乎所有网站都有请求移除的流程。\n\
  \n### 常见技术\n\n为了考试，你将熟悉许多技术。首先是`模式识别`——即能够看到常见的攻击、利用和破解模式，并识别出其本质的能力。这通常由人工智能 (AI)\
  \ 或机器学习 (ML) 系统使用，它们会寻找与破解或恶意活动相关的已知模式。安全从业人员也会寻找可能指示破解或攻击的模式。\n\n`模式识别`技术最常见的关注点之一是识别命令与控制`\
  \ (`C&C`) 流量，或信标（beaconing）。命令与控制流量的识别依赖于如下模式：\n\n*   指向已知恶意 IP 地址或网络的流量\n*   在非预期端口上的流量\n\
  *   通过通常不使用的协议的流量，或超出该协议正常流量范围的流量\n*   大量数据传输\n*   与通常不会发送流量的进程关联的流量（如 Windows 系统上的\
  \ `notepad.exe`）\n*   在与正常业务无关的时间段发送的流量\n*   其他不符合典型使用情况或模式的意外行为\n\n尽管 CySA+ 考试大纲侧重于\
  \ `C&C` 和 `模式识别`，但高级的 AI 和 ML 技术使用了广泛的入侵指标 (IOC) 和基准技术，来帮助识别潜在的非预期或恶意活动，并提供自动化和规模化的优势。\n\
  \n### 邮件的保护与分析\n\n邮件仍然是攻击的频繁媒介，范围从钓鱼攻击到通过邮件附件或其他技术分发恶意软件。安全分析师需要了解邮件分析的基础知识，包括如何分析邮件信头、如何识别常见的攻击技术，以及旨在防止邮件攻击的最常见安全技术。\n\
  \n#### 邮件分析\n\n大多数组织使用自动化邮件分析作为防御恶意和垃圾邮件的第一道防线。自动化工具寻找诸如已知恶意或垃圾邮件发送者之类的指标，通常使用利用全球信息构建的黑名单。它们还会扫描每封邮件以寻找诸如恶意软件或其他不良文件的恶意载荷。\n\
  \n同样的工具通常还会执行头部分析和消息内容分析。信头分析查看邮件信头的内容。垃圾邮件信头的示例在图 3.15 所示。注意前两行显示 `SPF` 是中性的。再往下看，我们看到提到了域名\
  \ `notes.langdale.com`，以及一个显示为 `efianalytics.com` 的来自（received from）头部项。大量的回复列表很奇怪，随后在邮件中发现的消息\
  \ ID 也是如此。\n\n![图 15 IP 地址的 AbuseIPDB 输出](img/c03f014.png)\n\n图 14 IP 地址的 AbuseIPDB\
  \ 输出\n\n这封邮件是一次钓鱼尝试；然而，更老练的攻击者在正文和信头方面都有手段。合法账户是攻击者的热门目标，因为它们可以用来绕过许多过滤器。\n\n如果你不熟悉头部的内容，可以在\
  \ http://mediatem.net/community/dv/20463950/understanding-an-email-header 或 https://blog.mailfence.com/email-header\
  \ 等网站进行查看。邮件分析工具也很有用，许多网站提供了这些工具，如 www.whatismyip.com/email-header-analyzer 和 https://dnschecker.org/email-header。在\
  \ CySA+ 中你无法使用这些自动化工具，因此请确保你学会如何阅读信头！\n\n分析师需要知道，转发的邮件将不包含原始信头。`转发`邮件会将邮件内容放入一个新的“信封”中，从而删除你可能需要的信头信息。大多数现代邮件客户端允许用户在需要时查看信头，但这通常是一个手动过程，并不是大多数用户知道如何做的。\n\
  \n除了转发邮件时可能会丢失的信息外，自动邮件转发也是组织需要解决的安全问题。自动转发有时会被成功破解账户的攻击者利用，将该账户接收的所有邮件发送到他们选择的目的地。即使账户没有被破解，转发也会导致组织不希望离开安全边界的数据进入外部。\n\
  \n#### 邮件元素\n\n除了信头之外，在执行邮件分析时，许多元素都可能引起关注。第一个也是最常见的审查审查元素是嵌入链接。`嵌入链接`通常作为钓鱼诈骗的一部分，因为许多用户在点击之前不会检查链接的去向。\n\
  \n邮件签名块可以帮助识别钓鱼攻击，尽管更老练的攻击者会直接克隆合法签名。由于邮件签名通常包含图像和嵌入链接，它们可能还包含其他危险元素，告诉攻击者邮件是否被打开，或者本身就是攻击的一部分。\n\
  \n\n\n\n数字签名依赖于数字证书和公钥加密，可以帮助证明声称的实际发送者是信息的真实发送者，并且邮件内容未被更改。当对电子邮件进行数字签名时，会创建一个哈希值；然后用签名者的私钥对该哈希值进行加密以创建数字签名。发送者的数字证书和签名会被附在电子邮件中。收件者可以针对收到的邮件对哈希值进行验证，还可以使用发送者的公钥解密签名，验证其是否匹配。许多电子邮件服务提供对数字签名的支持以及如\
  \ S/MIME（安全/多用途互联网邮件扩展）等工具，但只有极少数组织广泛使用这一功能。\n\n## 电子邮件攻击\n\n最常见的电子邮件攻击形式是钓鱼、冒充和包含恶意附件。钓鱼攻击侧重于诱导毫无防备的用户点击某个网站，并在该网站提供其用户名和密码，或其他侧重于通过欺骗获取凭据或其他信息的技巧。\n\
  \n冒充攻击日益常见，它们通常包括一封伪装成来自信任同事或经理的电子邮件。收件者通常被要求执行操作，如购买礼品卡、更改银行信息或其他执行有利于攻击者的行为。\n\
  \n恶意软件也通过电子邮件传播，可以是作为附件，也可以通过可点击的下载链接。尽管反恶意软件软件可以有所帮助，但攻击者和防御者之间存在着持续的战斗，新的技术和工具不断出现，帮助攻击者让恶意软件绕过组织建立的防御措施。\n\
  \n## 电子邮件安全选项\n\n除了头部分析外，还可以使用其他技术来为电子邮件提供更大的保护。这些包括域名密钥识别邮件（DKIM）、发送者策略框架（SPF）以及基于域的消息身份验证、报告和一致性（DMARC）。\n\
  \n`DKIM` 允许组织向消息中添加内容，以识别其来自其的域名。DKIM 对消息正文和头部元素都进行签名，有助于确保消息确实来自其所声称的组织。它添加了 `DKIM-Signature`\
  \ 头部，该头部可以与存储在启用 DKIM 的组织的公共 DNS 条目中的公钥进行比对。\n\n`SPF` 是一种电子邮件验证技术，允许组织发布其授权的电子邮件服务器列表。`SPF`\
  \ 记录被添加到域名的 DNS 信息中，并指定哪些系统允许从该域名发送电子邮件。未列在 `SPF` 中的系统将被拒绝。\n\n`DMARC` 是一个利用 `SPF`\
  \ 和 `DKIM` 来确定电子邮件消息是否真实的协议。与 `SPF` 和 `DKIM` 一样，`DMARC` 记录发布在 DNS 中，但与 `DKIM` 和\
  \ `SPF` 不同，`DMARC` 可判断是否应该接受来自发送者的消息。使用 `DMARC`，你可以拒绝或隔离不是支持 DMARC 的发送者发送的消息。你可以在\
  \ `https://dmarc.org/overview` 阅读 DMARC 的概述。\n\n## 文件分析\n\n分析文件是否存在潜在恶意内容和活动可能是一项复杂的活动。攻击者使用的工具通常使用打包和加密功能对恶意内容混淆，使得在不采取额外操作的情况下难以直接分析文件。安全实践人员通常在可能的情况下采取一些简单的步骤来执行快速的手动分析。\n\
  \n第一种技术是使用哈希处理将潜在的恶意或可疑文件与原始已知良好的文件进行比较。虽然存在像 `Tripwire` 这样根据哈希值持续监控文件的工具，但手动哈希可以使用\
  \ Linux 内置的 `SHA256` 甚至 `MD5` 工具，以及 Windows 中通过 `PowerShell` 提供的工具来比较哈希值。\n\n第二种常见技术是在文件中搜索字符串（即从二进制文件中可以恢复的文本）。当你想要查看编译后的程序（如可执行文件）以查看它可能做什么时，这种方法非常有用。Linux\
  \ 的 `strings` 命令可以通过梳理文件并以人类可读的列表显示这些字符串，来帮助你分析文件。虽然 `strings` 命令没有列在考试大纲中，但像使用\
  \ `strings` 快速查看可疑文件的技术通常是文件分析的一部分。\n\n## 沙箱\n\nCySA+ 考试大纲指出的用于确定恶意活动的最后一种工具是沙箱工具。`Sandboxes`\
  \ 建立了一个安全的、经过仪器监测的环境，你可以在其中运行潜在的恶意文件和应用程序，以确定它们尝试做什么以及如何做。\n\n有很多在线沙箱选项，但考试大纲中特别提到了两种。第一个是\
  \ `Joe Sandbox`，这是一个商业沙箱服务，提供免费的基础选项，可以针对多个操作系统进行测试，并允许使用名为“食谱”（cookbook）的参数和选项进行高级选项。可以在\
  \ `www.joesandbox.com` 找到 Joe Sandbox。\n\n另一个选项是 `Cuckoo Sandbox`，这是一个可以作为自托管工具的自动化恶意软件分析工具。`Cuckoo`\
  \ 不限于恶意软件，还分析 PDF；Microsoft Office 等文件以及恶意网站。当然，自己运行 `Cuckoo` 意味着你需要考虑潜在恶意行为的可能性，因此尽管它是为安全而设计的，你也应该隔离\
  \ `Cuckoo` 系统。你可以在 `cuckoosandbox.org/` 找到 Cuckoo Sandbox。\n\n这两个工具都会分析网络流量和 API\
  \ 调用，以及它们所分析的制品所采取的其他操作。\n\n## 用户行为分析\n\n`用户行为分析` 依赖于对典型用户行为以及与恶意行为最常见的行为的理解。异常账户活动`取决于账户——在许多情况下，典型用户不太尝试使用管理权限、在典型时间之外登录，或从另一个国家登录。因此，基线和行为分析通常被用于识别行为可能表明其账户被盗用或其本人正在恶意操作的用户。一种常见的指标被称为`不可能旅行`，或从不同地点的的登录，且无法通过地点间的旅行得到合理解释。\n\
  \n## 数据格式\n\n编写和使用基本脚本搜索日志中的特定项目，以及进行基础文本处理和其他任务的能力，在许多安全分析师职位中都是需要的。`Python` 是目前最流行的语言之一，但其他语言如\
  \ `PowerShell` 和脚本语言如 `Bash` 脚本仍然很常见。你应该熟悉 CySA+ 考试的一些基本技术、区分特性和语言基础。在接下来的页面中，我们将探索\
  \ `Python` 和 `PowerShell` 的基础“你好世界”脚本以帮助熟悉它们。\n\n`Python` 是一种解释型编程语言，广泛用于信息安全工具以及许多安全实践人员的通用编程。\n\
  \n我们可以使用 `print` 命令在 `Python` 中输出。这里是为安装了 Python 的系统创建我们的“你好世界！”脚本所需的单行代码：\n\n```python\n\
  print(\"Hello, world!\")\n```\n\n如果我们将其保存为 `hello.py`，我们可以使用以下命令执行它：\n\n\n\n\n```\n\
  python ./hello.py\n```\n\n最后，我们来看一下输出结果：\n\n```\nHello, world!\n```\n\n由于 Python\
  \ 是一种解释型语言，它可以像这里这样直接运行。这使得 Python 成为编写比 shell 脚本更复杂的可移植程序的易于选择。\n\n`PowerShell`\
  \ 是 Windows 原生的 shell 脚本环境。它最初由微软设计供 Windows 系统管理员使用，现在是一项适用于 Windows、Mac 和 Linux\
  \ 平台的开源工具。然而，考虑到 Mac 和 Linux 系统提供了其他 Unix shell，`PowerShell` 通常仍然与 Windows 操作系统相关联。在非\
  \ Windows 系统上运行 `PowerShell` 的常见用例是为了代码兼容性。\n\n你发现在 Windows 系统上预装了 `PowerShell`。要在\
  \ `PowerShell` 中创建我们的“Hello, world!”脚本，你只需要一行代码：\n\n```\nWrite-Host \"Hello, world!\"\
  \n```\n\n使用你喜欢的文本编辑器将脚本保存到系统中的目录中。按照惯例，开发者使用 `.ps1` 扩展名命名 `PowerShell` 脚本。\n\n一旦保存了脚本，你就可以尝试使用此命令运行它：\n\
  \n```\n.\\hello.ps1\n```\n\n如果你以前在系统上未使用过 `PowerShell` 脚本，当你尝试执行第一个脚本时，可能会看到如下所示的错误信息：\n\
  \n```\n.\\hello.ps1 : File C:\\Users\\Administrator\\hello.ps1 cannot be loaded.\
  \ The file \nC:\\Users\\Administrator\\hello.ps1 is not digitally signed. You cannot\
  \ run this \nscript on the current system. For more information about running scripts\
  \ and \nsetting execution policy, see about_Execution_Policies at \n[LinkID=135170](http://go.microsoft.com/fwlink/?LinkID=135170).\n\
  At line:1 char:1\n+ .\\hello.ps1\n+ ~~~~~~~~~~~\n+ CategoryInfo : SecurityError:\
  \ (:) [], PSSecurityException\n+ FullyQualifiedErrorId : UnauthorizedAccess\n```\n\
  \n此错误发生的原因是 Windows 系统默认配置为阻止执行 `PowerShell` 脚本。你需要更改 `PowerShell` 执行策略以允许它们运行。共有五种可能的策略：\n\
  \n- `Restricted` 是默认的 `PowerShell` 执行策略，它阻止所有对 `PowerShell` 脚本的使用。\n- `AllSigned`\
  \ 要求你运行的任何 `PowerShell` 脚本必须由受信任发布者签名。\n- `RemoteSigned` 允许执行你在本地上编写的任何 `PowerShell`\
  \ 脚本，但要求从互联网下载的脚本必须由受信任发布者签名。\n- `Unrestricted` 允许执行任何 `PowerShell` 脚本，但在运行从互联网下载的脚本之前会提示你确认请求。\n\
  - `Bypass` 允许执行任何 `PowerShell` 脚本，并且不对从互联网下载的脚本产生任何警告。\n\n你不是受信任的发布者，因此你应该将执行策略设置为\
  \ `RemoteSigned`，以便运行自己的脚本，但仍要求下载的脚本来自受信任发布者。你可以使用此命令更改执行策略：\n\n```\nSet-ExecutionPolicy\
  \ RemoteSigned\n```\n\n注意，你必须以管理员身份启动 `PowerShell` 来更改执行策略。\n\n一旦修复完成，再次尝试运行脚本，你应该看到此输出：\n\
  \n```\nHello, world!\n```\n\n## 正则表达式与 `grep`\n\n使用 `grep` 进行字符串（文本）搜索是一项频繁的任务。`grep`\
  \ 是一个强大的工具，经常与其他命令结合使用，为其他工具准备输入数据。要将数据从一个命令行工具发送到另一个工具，你可以使用管道，由符号 `|` 表示。例如，如果你\
  \ `grep` 搜索一个字符串，并知道会看到多页输出且想对输出进行分页处理，可以将 `grep` 的输出管道到 `more` 命令中：\n\n```\ngrep\
  \ string | more\n```\n\n`正则表达式 (regex)` 也用于匹配字符集。在 `[]` 之间的字母将匹配任何字符，而 `*` 将匹配任意次数的出现。因此，要匹配任何集合，你可以使用以下命令：\n\
  \n```\ngrep \"[abc]\" example.txt\n```\n\n`grep` 列出了一些常用的标志：\n\n| `grep` 标志 | 功能\
  \ |\n| :--- | :--- |\n| `-c` | 统计匹配数量 |\n| `-i` | 同时匹配大小写 |\n| `-n` | 显示行号 |\n|\
  \ `-v` | 显示不匹配的行 |\n| `-r` | 递归读取目录下的所有文件 |\n| `-e` | 允许多个模式 |\n| `-w` | 匹配整个单词\
  \ |\n\n## 数据格式\n\nCySA+ 考试大纲还涉及两种数据格式：JSON 和 XML。JSON 使用 JavaScript 表示法和人类可读文本进行数据交换，而\
  \ XML 是一种具有类似目的标记语言——它既是机器人类可读的，应用范围比 JSON 更广。\n\n如果你需要判断文件是否以 JSON 编码，可以寻找花括号的开启和关闭语句。例如，一个\
  \ JSON 文件可能包含以下内容：\n\n```json\n{\n  \"menu\": {\n    \"filetype\": \"file\",\n \
  \   \"popup\": {\n      \"menuitem\": [\n        {\"value\": \"Create\", \"onclick\"\
  : \"NewFile()\"},\n        {\"value\": \"Edit\", \"onclick\": \"EditFile()\"},\n\
  \        {\"value\": \"Delete\", \"onclick\": \"DeleteFile()\"}\n      ]\n    }\n\
  \  }\n}\n```\n\n注意 JSON 代码中使用花括号和方括号。类似的 XML 文件将使用角括号开启和关闭语句，就像 HTML 一样。例如，菜单项可能列如下：\n\
  \n```xml\n<menuitem value=\"Create\" onclick=\"NewFile()\"/>\n```\n\n关于 JSON 和 XML\
  \ 有更多内容需要了解，但为了考试目的，你通常可以阅读任何一种格式来理解其含义，因为它们都是逻辑结构化的且通常人类可读的。\n\n## 总结\n\n识别恶意活动需要对网络、系统、服务和应用程序具有可见性。从你组织基础设施和系统的每个组件中收集并集中信息，可以让你更容易地检测、响应甚至防止事件发生。同样的信息也可以帮助你及早检测入侵指标（IOC），从而可能在入侵变成严重泄露之前阻止它们。\n\
  \n\n\n\n网络监控通常通过基于路由器的监控进行，它依赖于网络流（network flows）、SNMP 和日志，这些都是收集信息的常见手段。流（Flow）提供了关于流量、协议和端点的摘要数据；SNMP\
  \ 用于收集设备信息；日志则提供洞察，同时也对于发送到集中安全基础设施非常有用。此外，组织还采用主动监控通过发送流量来收集数据。被动监控则依赖于在流量流过网络设备时捕捉有关网络及其性能的信息。被动监控不会给网络增加流量，并且在事后发生，而不是提供实时信息，因此它对于问题分析比预防问题更有用。\n\
  \n网络监控工具汇聚了多种类型的网络数据，并提供集中可视化和详细的钻取分析能力。它们对于事件响应和事件管理至关重要，因为它们既允许轻松的可视化，又允许在一个地方查看来自多个数据源的数据，从而让你能够更容易检测到链路故障、信标行为（beaconing）和异常流量等问题。可以使用监控工具检测攻击和探测，有时可能由网络安全设备进行识别并防止。\n\
  \n监控主机需要对资源、应用程序和日志具有可见性。主机资源监控通常关注处理器、内存和磁盘利用率，而应用程序通常使用集中管理工具进行管理。日志监控依赖于对记录内容的理解以及哪些问题是审查审查。监控未经授权的更改和行为是主机相关监控以及针对恶意活动分析的关键部分。\n\
  \n应用程序问题通常通过监控服务异常（如错误、失败或服务行为的变化）来检测。安全专业人员会寻找异常活动、新的且意料之外的账户创建、意外的输出或出站通信、服务中断和内存溢出问题。与网络和主机数据类似，日志也提供了有关应用程序的关键信息，并通常发送到安全管理和监控工具。\n\
  \n工具是安全分析师实践中不可或缺的一部分，包括执行数据包捕、日志分析与关联、终端安全管理与响应，以及利用 DNS 和 IP 声誉、进行文件分析和使用沙箱。在使用这些工具时的常用技术包括识别命令与控制（C2）流量的模式识别、文件分析、用户行为分析，当然还有电子邮件分析。\n\
  \n分析师还需要熟悉基础编程和脚本工具，包括 Python、PowerShell、Linux Shell 脚本以及正则表达式的使用。作为安全工作的一部分，你还需要理解并能够读取\
  \ JSON- 和 XML 编码的文件。\n\n## 考试要点\n\n### 分析网络相关的潜在恶意活动。\n理解网络带宽是如何消耗的，以及它如何与检测和检测相关。识别并解释常见的网络问题，包括带宽消耗、信标行为、不规则的点对点通信、扫描、探测（sweeps）、流量激增和异常流量。理解如何识别异常端口上的活动，以及如何识别非法设备。\n\
  \n### 分析主机相关的潜在恶意活动。\n监控系统资源使用情况（包括 CPU、内存和磁盘空间）有助于识别恶意活动。在搜索恶意活动和妥态指标（IoC）时，理解意外的处理器、驱动器和内存消耗意味着什么。解释如何识别未经授权的软件、文件系统、权限和注册表更改，以及恶意进程和未经授权的更改。利用内置系统工具搜索并识别这些事件和更改。描述数据外泄以及如何识别它。解释计划任务以及如何搜索对其未经授权的更改。\n\
  \n### 分析应用程序相关的潜在恶意活动。\n使用工具和监控服务异常（如错误、失败或服务行为的变化）。安全专业人员会寻找异常活动、新的且意料之外的账户创建、意外的输出或出站通信、服务中断和内存溢出问题。与网络和主机数据类似，日志也提供了有关应用程序的关键信息，并通常发送到安全管理和监控工具。\n\
  \n工具是安全分析师实践中不可或缺的一部分，包括执行数据包捕、日志分析与关联、终端安全管理与响应，以及利用 DNS 和 IP 声誉、进行文件分析和使用沙箱。在使用这些工具时的常用技术包括识别命令与控制（C2）流量的模式识别、文件分析、用户行为分析，当然还有电子邮件分析。\n\
  \n分析师还需要熟悉基础编程和脚本工具，包括 Python、PowerShell、Linux Shell 脚本以及正则表达式的使用。作为安全工作的一部分，你还需要理解并能够读取\
  \ JSON- 和 XML 编码的文件。\n\n## 实验\n\n### 活动 3.1：识别网络扫描\n在实验中，你将使用 Wireshark 识别网络扫描。\n\
  \n#### 第一部分：启动 Kali Linux 系统和目标系统并设置实验\n1. 启动你的 Kali Linux 虚拟机和 Metploitable 虚拟机；登录两者。\n\
  2. 在 Kali Linux 系统上打开终端窗口和 Wireshark（Wireshark 可以在应用程序菜单的 09 嗅探与欺骗下找到）。\n3. 确定目标系统的\
  \ IP 地址。\n4. 在 Metploitable 系统上的命令行输入 `ifconfig -a` 并记录其 IP 地址。\n5. 启动 Wireshark\
  \ 捕获。选择 `eth0` 接口然后选择 Capture -> Start。\n\n#### 第二部分：执行网络扫描并访问 Web 服务器\n1. 从终端执行命令：`nmap\
  \ -p 1-65535 [metploitable 机器 IP 地址]`。\n2. 记录一个显示为开启的端口。\n3. 在 Kali 中启动 IceWeasel\
  \ 并导航到 Metploitable 的 IP 地址。\n\n#### 第三部分：识别扫描流量\n1. 停止 Wireshark 捕获。点击 Wireshark\
  \ 屏幕左角的红色停止按钮。\n2. 审查捕获的流量。在过滤器框中输入 `tcp.port==[你识别的端口]` 来搜索。\n3. 发送了什么流量？如果你使用其他\
  \ TCP 连接选项（如 `-sS` 或 `-ST`）重新运行扫描，会有变化吗？\n4. 审查端口 80 的流量。你应该看到扫描和来自 Kali Linux 浏览器的访问。\n\
  \n### 活动 3.2：编写应用程序和服务问题响应计划\n\n\n\n\n请为你你熟悉的某个组织所依赖的应用程序和服务编写一份识别与响应计划。你的响应计划应假假设已经报告了服务问题或停机，但原因尚不明确。请确保你涵盖了本章中讨论的关键要素，包括：\n\
  \n* 你将如何使用应用程序日志和系统日志来识别潜在问题。你能够识别出异常行为吗？\n\n* 你将如何监控服务以发现问题。\n\n* 你会寻找哪些类型的问题。\n\
  \n* 该组织的响应应当是什么。\n\n完成计划后，请使用一个示例问题对其进行演练。确保你的计划能够解决该问题，并且你能够向你组织的管理层提供关于该问题的完整报告。\n\
  \n## 活动 3.3：分析钓鱼邮件\n\n你可能已经为这个实验练习准备了很好的源材料：只需打开你的电子邮件垃圾邮件箱，找到一封可能是钓鱼攻击的邮件即可。\n\n\
  ### 第一部分：手动分析邮件标头\n\n* 一旦你识别出一封怀疑的钓鱼邮件，你就需要打开该邮件的标头。如果你不熟悉流程，大多数电子邮件提供程序都提供了关于如何访问标头的帮助。\n\
  \n* 将标头打印出来进行分析，或将其导入你喜爱的文本编辑器中以便在跟踪发现的内容时进行标记，这会有帮助。\n\n* 检查标头并识别你能找到的关于邮件发自哪里、谁发送的以及它在你收到之前经过了什么路径的线索。哪些红旗（异常信号）非常明显？你会如何根据标头信息识别未来的钓鱼邮件？\n\
  \n### 第二部分：分析邮件内容\n\n* 现在你已经检查了标头，可以移动到邮件正文了。在此阶段，检查消息内容，特别关注钓鱼邮件中常见的伪装。你应该寻找嵌入链接并记录任何欺骗性的链接或嵌入内容。你还可以识别拼写错误、糟糕语法以及钓鱼邮件的其他典型元素。\n\
  \n* 一旦你识别了这些组件，使用类似于 `http://zeltser.com/lookup-malicious-websites` 的工具对链接进行检查。该链接或域名是一个已知的恶意链接？\n\
  \n### 第三部分：使用自动化工具\n\n* 使用一个或多个自动化邮件标头分析器来检查第一部分中的标头。注意你是否识别了额外的有用数据以及那些数据是什么。\n\
  \n* 有许多网站可用；你可以从 `www.whatismyip.com/email-header-analyzer/` 或 `mxtoolbox.com/EmailHeaders.aspx`\
  \ 开始。\n\n## 复习题\n\n1. 以下哪种 Linux 命令可以显示磁盘空间的使用情况如何？ \n\n    1. `top`\n    2. `df`\n\
  \    3. `lsof`\n    4. `ps`\n\n2. 哪种 Windows 工具提供了详细信息，包括关于 USB 主控制器、内存使用和磁盘传输的信息？\
  \ \n\n    1. Statmon\n    2. Resmon\n    3. Perfmon\n    4. Winmon\n\n3. 你应该捕获什么类型的网络信息，以便提供关于网络系统向远程系统发送了多少流量的报告？\
  \ \n\n    1. Syslog 数据\n    2. WMI 数据\n    3. Resmon 数据\n    4. 流数据 (Flow data)\n\
  \n4. 以下技术最适合防止有线非法设备连接到网络？ \n\n    1. NAC\n    2. PRTG\n    3. 端口安全 (Port security)\n\
  \    4. NTP\n\n5. 作为工作的一部分，Danielle 设置了一个闹钟，如果她的 Windows 服务器使用了 80% 的内存，将通过电子邮件通知她的团队，如果达到\
  \ 90% 的利用率，则发送短信。这种设置被称为什么？ \n\n    1. 监控阈值 (A monitoring threshold)\n    2. 预设通知级别\
  \ (A preset notification level)\n    3. 页面监控 (Page monitoring)\n    4. Perfmon 校准\
  \ (Perfmon calibration)\n\n6. Chris 正在查看一个漏洞包的一部分的文件。他注意到有一个文件的内容带有大括号 `{}`。根据以下列表，他最可能在查看哪种文件类型？\
  \ \n\n    1. 纯文本 (Plain text)\n    2. JSON\n    3. XML\n    4. HTML\n\n7. 哪个术语描述向控制服务器（command\
  \ and control server）发送心跳流量？ \n\n    1. 信标 (Beaconing)\n    2. 僵尸网络 (Zombie)\n \
  \   3. CNC\n    4. 日志 (Log)\n\n8. Cameron 正在查看一个漏洞包的一部分的文件。他想检查该文件是否为已知的恶意。\n\n\
  \    1. 解密文件 (Decrypt the file)\n    2. 哈希文件 (Hash the file)\n    3. 查询文件 (Query\
  \ the file)\n    4. 比较文件 (Compare the file)\n\n9. MAC 地址可以告诉你什么？ \n\n    1. 操作系统\
  \ (Operating system)\n    2. 存活时间 (TTL)\n    3. 类型 (Type)\n    4. 制造商 (Manufacturer)\n\
  \n10. Jim 如何最有效地定位非法接入点？ \n\n    1. Nmap\n    2. 信号强度 (Signal strength)\n    3.\
  \ 三角测量法 (Triangulation)\n    4. NAC\n\n11. 以下哪种工具提供了 Windows 的实时驱动器监控？ \n\n    1.\
  \ 配置管理器 (Configuration Manager)\n    2. Resmon\n    3. SCOM\n    4. Perfmon\n\n\
  12. 哪个术语描述一个伪装成合法的链接？ \n\n    1. 混淆 (Obfuscated)\n    2. 符号 (Symbolic)\n    3. 钓鱼\
  \ (Phishing)\n    4. 诱饵 (Decoy)\n\n13. Angela 想查看 Linux 系统上的 syslog。她应该检查哪个目录来查找它？\
  \ \n\n    1. `/home/log`\n    2. `/var/log`\n    3. `/log`\n    4. `/var/syslog`\n\
  \n14. Laura 想查看一封她的员工怀疑的邮件标头。为了保留标头，她不应该做什么？ \n\n    1. 打印邮件 (Print the email)\n\
  \    2. 回复邮件 (Reply to the email)\n    3. 转发邮件 (Forward the email)\n    4. 下载邮件\
  \ (Download the email)\n\n15. 以下哪项是 SIEM 和 SOAR 之间的关键区别？ \n\n    1. SIEM 提供仪表板。\n\
  \    2. SOAR 提供自动化响应能力。\n    3. SOAR 不提供日志聚合。\n    4. SIEM 提供日志分析。\n\n16. 以下哪种选项不是检查\
  \ Windows 服务状态的有效方法？ \n\n    1. 在命令行中使用 `sc`。\n    2. 在命令行中使用 `service --status`。\n\
  \    3. 使用 `services.msc`。\n    4. 使用 PowerShell 查询服务状态。\n\n17. Avik 被要求识别她网络中的异常流量。以下哪种技术不是她应该使用的？\
  \ \n\n    1. 协议分析 (Protocol analysis)\n    2. 启发式算法 (Heuristics)\n    3. 基准分析 (Baselining)\n\
  \    4. 信标 (Beaconing)\n\n18. Sofia 怀疑数据中心的一个系统可能正在向远程系统发送信标流量。以下哪种工具不是帮助验证她怀疑的有用工具？\
  \ \n\n    1. 流 (Flows)\n    2. 协议分析器 (Protocol analyzer)\n    3. SNMP\n    4. IDS\
  \ 或 IPS\n\n19. Susan 想使用一种电子邮件安全协议来确定邮件的真实性。以下哪种选项可以确保她的电子邮件服务器可以判断是否接受来自发送者的邮件？\
  \ \n\n    1. DMARC\n    2. SPF\n    3. DKIM\n    4. POP3\n\n20. Juan 想以交互式格式显示带有\
  \ CPU 利用率的进程列表。他应该使用哪种 Linux 内置工具？ \n\n    1. `df`\n    2. `top`\n    3. `tail`\n\
  \    4. `cpugrep`\n\n\n\n\n\n所有类型的安全专业人员都需要充分理解威胁，以防止它们或限制其影响。为了做到这一点，你需要威胁情报：关于你的对手的数据、他们的动机、能力，以及他们可能使用的战术、技术和程序（TTPs）。此外，你还需要了解当你的对手得手时，应该关注哪些信息。\n\
  \n威胁情报的收集依赖于现实世界的信息收集、证据采集和分析。威胁情报可以分为三个级别。第一种是`战略情报`（strategic intelligence），它提供关于威胁和威胁活动者的广泛信息，使组织能够理解并应对趋势。第二是`战术威胁情报`（tactical\
  \ threat intelligence），包含了更详细的技术和行为信息，对安全专业人员以及负责防御和响应的其他人员有直接帮助。最后，`运营威胁情报`（operational\
  \ threat intelligence）由高度详细的信息组成，允许对特定威胁做出响应，并且通常包括关于其来源、谁创建了它或随时间如何变化的、它是如何投递或如何传播的、它试图做什么、如何移除它以及如何防止它的信息。\n\
  \n在本章中，你将学习许多类型的威胁情报，包括评估给定威胁情报源的相关性和准确性的来源和方法。存在一个巨大的威胁情报社区，我们将讨论你可以在工作中使用的来源。我们还将谈论威胁分类和威胁活动者。最后，你将学习如何作为威胁猎寻活动的一部分，将威胁情报应用于整个组织中。\n\
  \n## 威胁数据与情报\n\n威胁情报有许多来源，从你可以从公开来源收集的开源情报（OSINT），到提供专有或闭源情报信息的商业服务。越来越多的产品和服务已经具备了消费威胁馈送数据的能力，允许你在整个基础设施和系统中利用这些数据。\n\
  \n无论来源如何，威胁馈送（threat feeds）旨在提供有关威胁的最新细节，以便你的组织可以利用。威胁馈送通常包含诸如 IP 地址、主机名和域名、电子邮件地址、URL、文件哈希值、文件路径、常见漏洞与披露（CVE）编号以及关于威胁的其他细节。通常还会包含额外信息以帮助使信息变得相关且易于理解，包括可能导致你的组织成为目标或易受威胁的细节、威胁活动者的描述，甚至关于他们的动机和方法论的细节。\n\
  \n### 开源情报\n\n`开源威胁情报`（open source threat intelligence）是从公开来源获取的威胁情报。许多组织已经意识到开放共享威胁信息有多用，开源威胁情报已变得广泛可用。事实上，现在的挑战通常在于决定使用哪些威胁情报源，确保它们是可靠且实新的，并充分利用它们。\n\
  \n一些网站维护着广泛的开源威胁信息源列表：\n\n*   `Senki.org` 提供了一个列表：`www.senki.org/operators-security-toolkit/open-source-threat-intelligence-feeds`。\n\
  *   由 AlienVault 运营的开放威胁交换（OTE）是全球安全专业人员和威胁研究人员社区的一部分：`https://cybersecurity.att.com/open-threat-exchange`。\n\
  *   MISP 威胁共享项目提供来自许多来源的标准化威胁馈送：`www.misp-project.org/feeds`，具有社区驱动的集合。\n*   `Threatfeeds.io`\
  \ 托管了一个开源威胁情报馈送列表，包含关于它们添加和修改时间的细节、维护者以及其他有用信息：`https://threatfeeds.io`。\n\n除了开源和社区威胁数据源外，还有许多政府和公共的威胁情报数据源。例如，图\
  \ 4.1 显示了 CISA 网站上的告警列表。\n\n**政府网站：**\n\n*   美国网络安全和基础设施安全局（CISA）网站：`www.cisa.gov/uscert`\n\
  *   美国国防部网络犯罪中心网站：`www.dc3.mil`\n*   CISA 的自动指标共享（AIS）程序 `www.cisa.gov/ais`，以及他们的信息共享与分析组织（ISAOS）程序\
  \ `www.cisa.gov/information-sharing-and-analysis-organizations-isaos`\n\n**厂商网站：**\n\
  \n*   微软的威胁情报博客：`www.microsoft.com/security/blog/tag/threat-intelligence`\n*   思科的威胁安全网站包含一个带有威胁研究信息的专家博客\
  \ `https://tools.cisco.com/security/center/home.x`，以及 Cisco Talos 信誉查询工具 `https://talosintelligence.com`\n\
  \n![图 4.1 来自 CISA 网站的告警列表](img/c04f001.png)\n\n`图 4.1` 来自 CISA 网站的告警列表\n\n**公共来源：**\n\
  \n*   SANS 风暴中心：`https://isc.sans.org`。\n*   VirusShare 包含上传到 VirusTotal 的恶意软件详情：`https://virusshare.com`。\n\
  *   Spamhaus 专注于黑名单，包括通过 Spamhaus 黑名单（SBL）发送的垃圾邮件、漏洞黑名单（XBL）上的被劫持和受感染计算机、策略黑名单（PBL）、不路由或对等列表（DROP）列出的你可能不想允许流量的网块，以及各种其他信息：`www.spamhaus.org`。\n\
  \nCySA+ 考试大纲还列出了其他你应该记住的开源情报源：\n\n*   社交媒体可以提供非常及时的信息，但也可能难以确定信息的真实性或来源。识别信任的来源并验证从不可信来源接收的信息可能会花费大量的时间和资源。\n\
  *   博客和论坛不像几年前那么常用，但仍然可以提供信息。它们仍然是深度分析和细节的有用来源。\n*   计算机应急响应小组（CERT）和网络安全事件响应小组（CSIRT）网站及组织通常通过其网站和社交媒体源提供公开信息。如果你能识别出与你的组织面临相似威胁的行业相关组织，这些信息将特别有用。\n\
  *   最后，暗网或深层网络可以是有用的资源。商业数据馈送通常包含来自威胁活动者论坛和其他被认为是暗网一部分的自动化和人工源的情报信息。与所有这些类型的信息一样，验证信息可能具有挑战性，但直接获取威胁活动者的对话和数据可能极具价值且及时。\n\
  \n这些只是安全从业人员可以使用的一些开源情报资源；它们可以让你对可用资源有一个良好的了解。\n\n### 专有和闭源情报\n\n商业安全厂商、政府组织和其他以安全为中心的组织也创建并使用专有的、或`闭源情报`。他们进行自己的信息收集和研究，并可能自定义工具、分析模型或其他专有方法来收集、策划和维护他们的威胁馈送。他们可能会作为信息共享协议或组织的一部分、作为`付费馈送`与他人共享信息，或者将情报仅供内部使用。\n\
  \n\n\n\n\n使用专有威胁情报有许多原因。组织可能希望对其威胁数据保持保密，他们可能想要出售或授权这些数据，且其方法和来源是他们的商业秘密，或者他们可能不想让威胁攻击者知道他们正在收集的数据。\n\
  \n商业闭源情报通常是服务提供的一部分，对于安全专业人员来说，这是一个极具吸引力的资源。通过开源威胁情报馈送获取的海量数据让许多组织感到无不从心。筛选威胁馈送以识别相关的威胁，然后确保这些威胁既得到了良好的定义，又恰适用于你的组织，这可能需要投入巨大的精力。在许多情况下，验证威胁数据可能是困难的，一旦你确保拥有了高质量的威胁数据，你仍然需要对其进行处理！\n\
  \n### 评估威胁情报\n\n无论你的威胁情报信息来源如何，你都需要对其进行评估。在评估威胁情报源或特定的威胁情报通知时，会有许多共同因素起作用。评估这些因素决定了你或你的组织对数据的`置信度`（confidence\
  \ level）。\n\n- 是否具有及时性？延迟运行的馈送可能会导致你错过威胁，或者在威胁失去相关后才做出反应。\n- 信息准确吗？你是否可以依赖其所描述的内容，评估有效的概率有多大？它是依赖于单一源还是多个源？这些源正确的频率有多高？\n\
  - 信息相关吗？如果它描述了错误的平台、软件或该组织成为目标的原因，那么这些数据可能非常及时、非常准确，但与你的组织完全不相关。\n\n总结威胁情报评估数据的一种方法是通过`置信评分`（confidence\
  \ score）。置信评分允许组织根据其对数据赋予的信任程度来过滤和使用威胁情报。这并不意味着低置信度的信息没有用；事实上，许多威胁情报都是从较低的置信评分开始，随着信息的固化以及额外信息源的确认或能够进行完整分析，该评分会随之增加。低置信度的威胁情报信息不应被完全忽略，但也不应在不考虑低置信评分的情况下就依赖它来做出重要决策。\n\
  \n### 威胁情报共享\n\n威胁情报共享通常作为组织安全运营的一部分出现。事实上，威胁情报共享在许多关键运营安全实践中都起着作用：\n\n- 对于事件响应，威胁情报是识别威胁攻击者及其常用技术和工具的关键部分。了解威胁攻击者可能部署什么，以及他们通常如何使用其工具和技术，可以使目标识别、响应计划和清理工作都变得简单得多。\n\
  - 漏洞管理工作也利用威胁情报。理解当前的活跃威胁可以帮助安全专业人员更好地评估风险，并影响补丁周期和优先级工作。知道某个广泛部署的防火墙厂商的当前软件版本存在零日漏洞，或者你的组织首选的数据库存在正被攻击的缺陷，可能会导致典型的补丁周期与紧急（尽管有风险）的更新之间产生区别。\n\
  - 检测和监控严重依赖威胁情报信息，以实现及时更新并创建新的检测规则。共享的威胁情报允许更快的响应和更好的行为检测能力，并使情报共享社区更具韧性。\n- 安全工程工作也考虑了威胁情报。虽然安全工程同时关注当前和未来的需求，但威胁情报可以提供关于威胁方向的有用视角，以及在安全设计的生命周期内哪些威胁可能会增长。它们还可以影响可能集成到设计更新中的威胁响应。\n\
  \n总而言之，所有这些威胁情报共享的用途都是组织风险管理工作的一部分。现代组织需要确定他们将如何获取、消费和响应与他们相关的威胁情报。获取、处理威胁情报已成为许多安全运营团队成员的主要运营职责之一。\n\
  \n### 基于标准的威胁信息共享\n\n管理任何规模的威胁信息都需要标准化的工具，以便威胁信息以自动化的方式进行处理和使用。通过定义的术语集，指标管理可以变得简单得多。这就是`STIX`和`OpenIOC`等结构化标记语言用用场。\n\
  \n`结构化威胁信息表达式 (STIX)` 是最初由美国国土安全部赞助的 XML 语言。`STIX` 2.1（本文写作当前版本）定义了 12 个 `STIX`\
  \ 领域对象，包括攻击模式、身份、恶意软件、威胁攻击者和工具等。这些对象通过两种 `STIX` 关系对象模型之一相互关联：要么作为关系（relationship），要么作为观测（sighting）。一个威胁攻击者的\
  \ `STIX` 2.0 JSON 描述可能如下：\n\n```\n{\n  \"type\": \"threat-actor\",\n  \"created\"\
  : \"2019-10-20T19:17:05.000Z\",\n  \"modified\": \"2019-10-21T12:22:20.000Z\",\n\
  \  \"labels\": [ \"crime-syndicate\"],\n  \"name\": \"Evil Maid, Inc\",\n  \"description\"\
  : \"Threat actors with access to hotel rooms\",\n  \"aliases\": [\"Local USB threats\"\
  ],\n  \"goals\": [\"Gain physical access to devices\", \"Acquire data\"],\n  \"\
  sophistication\": \"intermediate\",\n  \"resource:level\": \"government\",\n  \"\
  primary_motivation\": \"organizational-gain\"\n}\n```\n\n`sophistication` 和 `resource:level`\
  \ 等字段使用了定义的词汇选项，允许 `STIX` 2.0 用户一致地将数据作为自动化和手动系统的一部分。\n\n自创建以来，`STIX` 已移交给 `OASIS`（结构化信息促进组织），这是一个国际非营利联盟，维护着许多与信息格式相关的项目，包括\
  \ XML 和 HTML。\n\n`STIX` 的伴侣是`信任自动指标交换 (TAXII)` 协议。`TAXII` 旨在通过 HTTPS 在应用层允许网络威胁信息。`TAXII`\
  \ 专门为支持 `STIX` 数据交换而设计。你可以在 `OASIS` 的 GitHub 文档站点详细阅读关于 `STIX` 和 `TAXII` 的内容：`https://oasis-open.github.io/cti-documentation`。\n\
  \n另一个选项是`开放入侵指标 (OpenIOC)` 格式。像 `STIX`一样，`OpenIOC` 是基于 XML 的框架。`OpenIOC` 架构由 `Mandiant`\
  \ 开发，它使用 Mandiant 的指标作为基础框架。典型的 IOC 包含作者、IOC 名称和描述等元数据；对调查或案件的引用以及有关 IOC 成熟度的信息；以及入侵指标的定义，其中可能包含实际入侵的细节。\n\
  \n\n\n\n情报循环的第一个阶段是为你的情报需求制定计划。你的需求可能是由于成功的破入和渗透、行业趋势，或为你的组织进行的风险评估而产生的。在这一步中，你通常会执行以下操作：\n\
  \n* 评估你曾面临过哪些安全泄露或渗透。\n* 评估哪些信息可以防止或限制泄露的影响。\n* 评估缺少了哪些控制措施和安全措施，这些措施本可以缓解泄露。\n\n\
  ### 数据收集\n一旦你确定了信息需求，就可以从威胁情报源中收集数据以满足这些需求。当增加额外需求或根据可用数据和数据源对需求进行精炼时，此阶段可能会重复。\n\
  \n### 数据处理与分析\n你在数据收集阶段收集的威胁情报数据可能以几种不同的格式存在。某些可能是你现有工具和系统可以读取的易于访问格式。其他数据可能是纯文本或书面形式，也可能几乎完全没有格式。在这一阶段，你必须首先对数据进行处理，以便供你打算使用的任何工具或流程进行读取，然后你必须对数据本身进行分析。此阶段的输出可以是输入到自动化系统或其他工具的数据，也可以编写成报告分发给领导层或组织的其他人员。\n\
  \n### 情报发布\n在情报循环的发布阶段，数据会被分配给领导层和运维人员，他们将这些数据作为其安全运营工作的一部分。\n\n### 反馈\n威胁情报循环的最后一个阶段是收集对你收集的报告和数据的反馈。持续改进是过程中的关键要素，它应该用于创建更好的需求并提高你威胁情报计划的整体产出。\n\
  \n### 威胁情报社区\n除了威胁情报供应商和资源外，还建立了用于共享威胁信息的威胁情报社区。在美国，被称为“信息共享与分析中心（ISACs）”的组织帮助基础设施所有者和运营商共享威胁信息，并为其成员提供工具和帮助。国家\
  \ ISAC 委员会在 `www.nationalisacs.org` 上列出了基于行业的 ISACs。\n\nISAC 概念是于 1998 年作为《总统决定指令第\
  \ 63 号》（`PDD-63`）的一部分引入的，该指令要求关键基础设施部门建立组织，以共享有关威胁和漏洞的信息。ISAC 基于信任模型运行，允许对物理威胁和网络威胁的威胁信息进行深度共享。大多数\
  \ ISAC 每天 24 小时运行，为其所在行业的 ISAC 成员提供事件响应和威胁分析。\n\n除了 ISACs，每个关键基础设施领域都有特定的美国机构或部门合作伙伴。按部门划分的列表可以在此处找到：`www.dhs.gov/cisa/critical-infrastructure-sectors`。\n\
  \n在美国境外，许多国家也存在职责相似的政府机构和部门。英国的国家基础设施保护中心（`www.cpni.gov.uk`）负责向工业界、学术界以及政府和其他部门和执法部门提供威胁信息、资源和指导。\n\
  \n## 威胁分类\n一旦你决定对你组织的威胁进行评估，你很快就会你需要标准的方法来描述它们。幸运的是，行业内存在许多常用的描述方案和术语。许多组织寻求同时描述威胁者，并对他们面临的威胁进行分类，以便更好地理解威胁本身。\n\
  \n### 威胁者\nCySA+ 考试目标专门列出了几种常见的威胁者：\n\n* **国家级** 攻击者通常拥有最多的资源访问权限，包括工具、人才、设备和时间。国家级威胁者背后有国家的资源支持，他们的目标通常是其赞助国的目标。国家级攻击者通常与高级持续性威胁（APT）组织相关，他们拥有在其他威胁者手中并不常见的先进工具和能力。\n\
  * **有组织犯罪** 作为威胁者发挥了重要作用，其重点攻击通常针对财务利益。勒索软件攻击是此类组织犯罪威胁的典型例子。\n* **黑客主义者**（Hacktivists）是通过黑客攻击来实现政治或哲学目的的活动人士。他们的范围从个人到像\
  \ Anonymous 这样的团体不等，其技术能力差异很大。在评估黑客主义者的威胁时，你需要仔细考虑哪些类型的黑客主义者可能针对你的组织。\n* **脚本小子**（Script\
  \ kiddies）是指使用现成工具的恶意攻击者，通常方式并不先进。\n* **内部威胁** 来自组织内部受信任个人或小组的威胁。它们可能是故意的或无意的，无论何种，由于其信任地位都构成了严重威胁。内部威胁通常被认为是泄露最可能的原因之一，且难以检测。\n\
  * **供应链** 威胁者可能作为供应链的一部分，插入恶意软件或硬件、破坏设备或植入后门，或者攻击供应链以中断商品和服务的获取。过去几年中记录了许多供应链攻击，导致国家和行业安全组织对验证设备和软件的完整性以及供应链工作更加关注。\n\
  \n除了这些，你的组织可能希望根据威胁模型和画像考虑其他特定的威胁者，因此你不应认为此列表是完整的。你应该进行组织威胁评估，以确定哪些类型的威胁者最可能针对你的组织以及原因何。\n\
  \n\n\n\n一旦你有了假设，下一步就是调查该威胁。我们在本章节早期讨论的信誉水平分析、威胁分类以及 TTP（技术、技术和程序）概念可以提供基础，让你能够对威胁攻击者进行画像分析，通过执行可执行进程分析或逆向工程等手段分析恶意软件或其他工具，或其他调查新威胁。\n\
  \n如果发现了新威胁，通常会采取某种形式的行动来应对。你可能会识别出减少组织攻击面的方法，或者可能根据你的威胁分析找到其他减少攻击者可利用攻击向量的方法。\n\n\
  这类主动活动的关键在于使用来自多个源的集成情报馈送，并提高组织的检测能力，以便你能够在威胁演变成严重问题之前识别它们。\n\n你可以将主动威胁狩猎看作是一个包含以下步骤的过程：\n\
  \n*   **建立假设**：需要一个假设来进行测试，并且该假设基于所考虑的威胁具有可操作的结果。\n*   **威胁攻击者和活动画像分析**：这有助于确保你已经考虑了谁可能是威胁以及为什么，以及他们典型的操作和流程是什么。\n\
  *   **威胁狩猎战术**：这些威胁狩猎活动成功的。技能、技术和程序是行动与分析相结合之处。\n*   **减少攻击面**：这允许资源集中在剩余的攻击面上，使保护更易管理。\n\
  *   **将关键资产分组并划分保护区域**：这有助于管理攻击面、威胁狩猎和响应活动，因为每个资产都不需要作为唯一项进行单独评估或管理。\n*   **理解、评估和处理攻击向量或攻击手段**：这一步必须基于对威胁攻击者及其技术的分析，以及威胁攻击者可以针对的攻击面。\n\
  *   **集成情报**：此步骤结合了多个情报源，以提供更好的威胁视角。\n*   **提高检测能力**：随着威胁不断改进其技术手段，这是一个持续的过程。如果你不提高检测能力，新威胁随着推推将会绕过现有能力。\n\
  \n在准备考试时，确保考虑这些每项在主动威胁狩猎活动中起着什么作用，以及它们对你的组织会产生什么影响。\n\n### 聚焦你的威胁狩猎\n\n在准备 CySA+\
  \ 考试时，你需要针对考试大纲中提到的三个威胁狩猎重点领域做好准备：\n\n*   可能导致泄露或可能指示攻击者已修改设置的配置和错误配置。\n*   隔离网络，通常用于保护敏感或专用的数据和系统。在隔离网络中进行威胁狩猎可能更容易，因为流量和行为应该是可以完全理解的，但在某些情况下，这也意味着部署和使用集中管理的工具和能力可能更具挑战性。\n\
  *   业务关键资产和流程由于其重要性而成为关注领域。威胁狩猎者可能会由于其组织风险概况以及确保其安全的重要性而关注这些内容。\n\n虽然这三个领域不是组织进行威胁狩猎时关注的唯一三个领域，但你可以预计它们是考试的潜在关注领域。\n\
  \n### 失陷指标 (IOCs)\n\n失陷指标（`IOCs`）是通常与受损系统和软件相关的数据。`IOCs` 用于检测入侵、泄露、恶意软件以及其他与攻击相关的活动。CySA+\
  \ 考试大纲通过三个维度来看待 `IOCs`：\n\n*   **收集 (Collection)**：侧重于如何获取可能指示失陷的数据。这通常侧重于使用工具、日志和其他数据源来收集可能指示失陷的数据。\n\
  *   **分析 (Analysis)**：随后需要确定收集的信息是否真实指示了失陷。例如，异常的网络流量是一个常引用的 `IOC`，但它可能仅仅是一个新进程或用户正在执行罕少需要的任务。分析需要理解所收集的数据的含义，并从上下文角度理解这是否意味着可能发生或正尝试发生失陷。\n\
  *   **应用 (Application)**：`IOCs` 的应用有两种方式：首先，通过分析来理解是否发生了失陷，从而激活事件响应流程和其他安全响应程序。`IOC`\
  \ 的应用也可以作为分析过程的一部分。威胁情报服务和共享小组会记录 `IOCs`，并将其供安全监控和分析工具使用。\n\n在备考 CySA+ 考试时，你应该熟悉常见的\
  \ `IOC` 类型，例如：\n\n*   可疑的登录活动，包括在异常时间段的活动、来自休眠账户的活动，或来自与典型账户行为不符的国家或地理位置的活动\n* \
  \  对文件的修改，特别是配置文件和日志文件\n*   对特权账户的意外或异常使用\n*   异常或意想不到的网络流量\n*   大规模的出站数据传输\n* \
  \  系统或设备上运行的意外之外的服务、端口或软件\n\n还有许多潜在的失陷指标，你不太可能记住每一个可能的 `IOC`。相反，你应该专注于思考你将如何使用 `IOC`\
  \ 数据，在拥有日志和其他信息的情况下你会寻找什么，以及你将如何应用它们来判断是否发生了失陷。\n\n### 威胁狩猎工具与技术\n\n威胁狩猎需要投入额外的能力。CySA+\
  \ 考试大纲中特别提到的一个例子是主动防御。主动防御可能涉及欺骗技术，可以延迟或混淆攻击者。像 `tarpits`（诱阱陷）这样的技术为攻击者提供大量虚假目标，既提供假数据又减慢扫描和攻击，是主动防御的常见组件。\n\
  \n某些主动防御方案中的另一个元素是 `honeypots`（蜜罐）。`honeypots` 是故意留漏洞的系统，用于诱捕攻击者进入。它们经过仪器并开启了日志记录，允许威胁分析师和其他安全人员审查和分析攻击者的行为及技术。除了\
  \ Honeynet 项目（`www.honeynet.org/projects`）创建的传统蜜罐外，许多预制的蜜罐工具是针对攻击者可能感兴趣的基础设施和系统设计的。\n\
  \n## 总结\n\n了解你的组织面临的威胁是你的安全计划和运营的关键部分。为了理解这些威胁，作为安全专业人员，你应该收集由对手、其动机、能力、工具和方法组成的情报情报。\n\
  \n开源威胁情报从公开源获取，而闭源威胁情报来自不向公众提供数据的商业或其他源。许多组织将两者都作为威胁情报工作的一部分。存在许多开源威胁情报源，包括政府赞助的馈送和网站、专业组织、供应商资源、社交媒体甚至来自个人的信息。\n\
  \n\n\n\n威胁情报共享在组织的整个安全工作中都非常有用，包括用于事件响应、漏洞管理、检测、监控，甚至是安全工程。确保威胁情报的可靠性至关重要——需要对威胁情报源进行评估，并且在根据数据采取行动之前，了解你对数据的置信程度非常重要。威胁信息还需要进行管理，并且存在用于描述威胁信息的标准化格式和语言，以提高威胁信息的可用性。`STIX`、`ATT&CK`\
  \ 以及其他工具有助于威胁信息的标准化。它们还帮助使用如国家级攻击者和攻击者能力等通用术语对威胁进行分类。\n\n威胁者通常被归类为少数描述之一：国家级攻击者、高级持续性威胁（`APTs`）、有组织犯罪、黑客分子、内部威胁（包括故意和无意）、脚本小子（script\
  \ kiddies）以及供应链威胁攻击者。理解你所面临的威胁者类型是威胁分析的重要部分。\n\n威胁狩猎活动由威胁情报驱动，通常依赖入侵指标（`IOCs`）来帮助识别攻击。通过\
  \ `IOCs` 的视角对数据的收集、分析和应用，以便组织能够应对威胁者及其行为。理解常见的 `IOCs` 是安全专业人员的一项重要能力。\n\n## 考试要点\n\
  \n### 描述威胁者的分类标准和通用术语。\n解释并区分不同威胁者的类型，包括高级持续性威胁（`APTs`）、国家级、黑客分子、有组织犯罪、脚本小子以及故意和无意的内部威胁。理解为什么组织越来越多地关注供应链威胁。\n\
  \n### 描述战术、技术和程序。\n解释 `TTP`，即战术、技术和程序，它们是威胁者的行为。战术是对威胁者行为方式及其策略的高级描述。技术是用于获取、维持和保留访问权限、获取信息以及执行其他操作的所使用的技术性和非技术性工具。程序是威胁者用于按顺序排列并利用技术以实现战术和战略目标的流程。\n\
  \n### 了解开源和闭源情报是如何收集的，以及它们从何处获取。\n描述开源和闭源（或专有）威胁情报源。理解 `OSINT`（即开源情报）可以来自各种来源，例如社交媒体、博客和论坛、政府公告、如\
  \ `CSIRTs` 和 `CERTs` 等安全组织以及暗网。描述情报共享社区如何提供专门针对行业或专业组的威胁数据。解释如何根据及时性、数据与你需求的关联性以及来源的准确性通过建立置信水平来评估情报源。\n\
  \n### 解释威胁狩猎和 `IOCs`。\n理解什么是入侵指标以及它们是如何被收集、分析和应用的。解释威胁猎者的常见关注领域，包括配置和误配置，以及为什么在对攻击进行仪器监控时隔离网络是有用的。描述为什么组织在威胁狩猎优先级排序中关注业务关键资产和流程。解释主动防御技术，包括蜜罐。\n\
