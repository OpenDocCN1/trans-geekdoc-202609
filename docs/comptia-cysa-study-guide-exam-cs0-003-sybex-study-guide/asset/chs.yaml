  \ (AWS)、Microsoft Azure 或 Google Compute Platform）构建一个。\n对你的服务器进行漏洞扫描并保存生成的报告。如果需要帮助，请查阅\
  \ Nessus 文档。你需要此漏洞扫描的报告来完成下一章中的活动。\n\n## 复习习题\n\n1. 哪部联邦法律要求对联邦政府机构运行的信息系统进行漏洞扫描？\n\
