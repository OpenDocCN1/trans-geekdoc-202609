    # 3.2. Overview of the proposed framework


    In this paper, we propose a novel framework MCAD to tackle the problem of AD diagnosis
    using multi-modal data. In Fig. 2, the proposed framework MCAD contains three
    main parts: feature extraction including imaging encoder and CSF encoder (Section
    3.3), multi-interaction (MI) module to manage the interactions between imaging
    and CSF and classification module (Section 3.4) to perform information reduction
    and age diagnosis (Section 3.5). MCAD consists of two strategies implemented for
    imaging and CSF modalities, respectively are learned with two features in the
    feature extraction module. Based on these fine-grained representations for images
    blocks and CSF components, the interaction module is designed for exploiting the
    information across modalities for AD diagnosis. After the attended intended imaging
    and CSF features, the multi-modal features are used to decide the status in the
    classification task in terms of AD diagnosis and modality alignment. Specifically,
    the modality alignment is introduced to align the inconsistent feature distributions
    of imaging and CSF biomarkers, which can further reduce the inter-modality gap
    at feature-level to improve the diagnostic performance.


    # 3.3. Features extraction


    # 3.3.1. Imaging encoder


    Since AD is believed to affect various brain regions, the disease-affected atrophy
    regions in MRI scans and the low-metabolized regions in FDG-PET scans vary in
    size. Traditional CNN can only capture the information of fixed receptive regions,
    and it is difficult


