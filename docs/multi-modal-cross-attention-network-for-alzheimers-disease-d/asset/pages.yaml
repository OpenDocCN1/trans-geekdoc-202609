    # 5.5. Visualization analysis


    In this section, we demonstrate the behavior of the proposed framework by visualizing
    the attention maps in multi-modal interaction, as shown in Fig. 12. Cross-attention
    attention represents the CSF-attention attention extraction branch, whereas in
    CSF-attention it is the feature attention. Fig. 12 shows the visualization of
    attention maps corresponding to each feature. We use yellow color in the attention
    map to represent high attention weights. The corresponding results show that the
    attention mechanism differs between imaging patches and CSF features. Due to space
    limitations, we only show one example from each disease status is reported. From
    the visualization results, we have the following observations. In AD category,
    P- and T-tau may show significant attention in brain region with atrophy, particularly
    in the temporal lobe and hippocampus. This finding is consistent with previous
    work [78], which shows a relationship between CSF biomarkers and T-tau and A42,
    in different brain regions. Previous researches [77-81] also finds the correlation
    between CSF biomarkers and imaging features in AD. Overall, the proposed method
    could perform the information analysis and learn the potential relationship between
    different-modal data, which leverages their complementary roles to greatly improve
    the diagnostic performance.'
