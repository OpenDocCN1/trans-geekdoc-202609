    the hyper-parameter $t_2$. When $t_2$ is small, the performance of the model gradually
    improves as the model begins to align the features of imaging and non-imaging
    modalities, reducing the discrepancy between models. When $t_2$ increases, the
    performance is degraded to some extent, because the model fails to pay enough
    attention to the classification loss; in other words, the model controls too many
    constraints on the distribution alignment of multi-modal data. Through the comprehensive
