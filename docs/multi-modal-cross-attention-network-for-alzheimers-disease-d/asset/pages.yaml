    [14–17]. Although the previous approaches have been proven effective, there remain
    still some challenges in AD diagnosis based on multi-class data. First, although
    multi-class methods are an important component of modality learning, which is
    cross-modal interaction. These methods combine information from different modality
    by concatenating features from different modality, yet not optimal for exploiting
    the complimentary information across modalities. Second, the modality variation
    caused by different modalities, which greatly affects the feature and diagnosis
    of AD, especially the multi-class nature of AD, needs to be addressed. There are
    up to least three key challenges for AD diagnosis in multi-class data, (1) when
    considering different AD-related scenarios, including two-class classification;
    (2) how to exploit the interaction between modalities to better play their complementary
    role; (3) to reduce the discrepancy between modalities.


    To address the issues above, we propose a multi-class framework for diagnosis
    of AD/MCI using multi-modal data, including CSF, PET, and GF. The framework maintains
    two sets of encoders for both imaging and non-imaging data, multi-modal interaction
    (MI) module and classification module. In this framework, an encoder is designed
    to extract features from different modality respectively. For example, the CSF
    component is embedded to the non-imaging data effectively. Due to the size of
    brain regions affected by disease in brain data and different modality, each encoder
    extracts features with the corresponding receptive field without losing information.
    Then, we introduce a multi-modal interaction module, which takes advantage of
    cross-modal attention to integrate modalities (CSF, PET and GF) and fusion them.
    Finally, an objective function is designed to minimize the discrepancy between
    representations for multi-modal data to guide AD diagnosis. The classification
    task includes AD two-class classification (AD vs. CN), MCI two-class classification
    (MCI vs. CN), and multi-class classification.


    The main contributions of this study are summarized as follows


    +   1. We propose a novel framework MCAD that can be leveraged to learn complementary
    information from different modalities for AD diagnosis more efficiently and accurately.
    And we study for various scenarios including AD-related two-class and multi-class
    classification.


    # 2. Related work


    We review previous studies on AD diagnosis, particularly multi-modal biomarkers,
    which are categorized into two groups: 1, machine learning approaches [16–20],
    and deep learning approaches [21–26].


    Many studies [19] demonstrate the effectiveness of biomarker based learning approaches
    in AD diagnosis, which are includes two parts feature extraction and classification.
    For instance, Lin et al. [16] used multi-modal data (MRI, PET, and CSF) to classify
    MRI, PET, GF, and genes. The others indicated the disease prediction, enrolling
    multi-class diagnosis of AD. W. Waldhof et al. [17] developed logistic regression
    to the AD diagnosis using MRI and PET data for classification and at the same
    time markers which are significant to dementia cognition. Kahn et al. [29] applied
    the machine learning classifier to classify the features from brain image and
    genetic data. The association of filter and feature for selection to achieve AD
    diagnosis using multiple biomarkers, which enhanced the diagnostics accuracy.


    In recent years, deep learning has made outstanding efforts employing convolutional
    networks (CNN) to learn features. With the rapid development of CNN, various neural
    networks are employed to provide a variety of ideas for AD diagnosis. For classification
    performance, deep learning has shown potential through various techniques [22,23,31].
    Many methods are based on neuraisism, such as AD, MRI, PET and GF functional magnetic
    resonance (MRI) for AD diagnosis, [23,25–27,39], which CNN is used to extract
    high-level image representations to capture the complexity of manual feature extraction.
    The existing image representation methods can be categorized into four groups
