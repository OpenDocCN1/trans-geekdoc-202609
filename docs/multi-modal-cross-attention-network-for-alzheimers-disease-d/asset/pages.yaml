    Several learning-based studies for AD diagnosis using multi-modal data have attempted
    to extract and complement information. Despite their great overall performance,
    they ignore a key issue of multi-modal learning-cross-modal interaction. Existing
    methods combine multimodal information in a straightforward way, which is limited
    from different ways to combine the information from modalities, which is conducive
    to improving the diagnostic performance. Moreover, AD diagnosis using multi-modal
    biomarkers suffers from the large discrepancy across modalities, which is missed
    in most previous studies.


    # 3. Materials and method


    # 3.1. Data acquisition


    This paper uses multi-modal data from the Alzheimer''s Disease Neuroimaging Initiative
    (ADNI) [43], which is publicly available to study AD diagnosis. In this work,
    subjects are selected from ADNI-1 and ADNI-2 when their sMRI scans, CSF and PET
    measures are used. The sMRI scans are 1.5T or 3T T1-weighted, which have been
    preprocessed with specific image precessing steps including multiplanar reconstruction
    (MRI), Graphwads,


    # 3.1.2. Processing data


    For data analysis, we use the software platform to register sMRI and FDG-PET scans
    to a DARTel template and perform normalization using standard Montreal Neuroimaging
    Institute (MRI) space, as reported in Fig. 1. The inputs are the sMRI and FDG-PET
    scans. To avoid the effect of irrelevant information, the non-brain tissues between
    sMRI and FDG-PET scans are removed. Additionally, sMRI and FDG-PET scans are resized
    into 128 x 128 voxels to decrease computational expense.


