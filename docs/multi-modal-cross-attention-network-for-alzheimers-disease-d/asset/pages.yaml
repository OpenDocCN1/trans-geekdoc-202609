    AD vs CN: This classification is considered to be the most important in AD-related
    tasks for several reasons. Firstly, the MRI scans of AD patients show lower values,
    significant range, and higher contrast, compared with healthy groups. AD patients
    have abnormal glucose metabolism in glutamate that can be detected by PET scans.
    Secondly, the extracellular space of the brain, so it could reveal the biochemical
    changes that exist in the brain of AD patients with healthy people. This facilitates
    the deep learning network to learn the features of AD more effectively. As seen
    from Table 2 for AD vs CN, the classification of our proposed method outperforms
    competing methods in all tasks. As shown in Table 3, our MCAD, Concation, DC,
    and Gated methods against competing methods (MCAN, MCCN, SA, and BBFNN) show significant
    differences in terms of p-value (p < 0.05). The difference between MCAD and competing
    methods could learn the fine-grained interactions between different modules and
    explore the potential concordance and complementarity between regions and CSF
    biomarkers, providing critical information for AD diagnosis.


