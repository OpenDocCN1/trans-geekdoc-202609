    Many studies are conducted in computer-aided diagnosis of AD. Only a small fraction
    of research utilizes multi-modal data, and even fewer studies cover multi-class
    diagnosis. Most studies differentiate AD from normal control (CN), while the MCI
    stage is ignored, and it is more critical to recognize the multi-class diagnosis
    of AD, MCI patients and healthy elderly. Biomarkers from different modalities
    can reflect changes connected with AD at various stages, providing comprehensive
    information for its diagnosis and further achieving more reliable results.


    +   2. To exploit the complimentary interaction, a multi-modal module based on
