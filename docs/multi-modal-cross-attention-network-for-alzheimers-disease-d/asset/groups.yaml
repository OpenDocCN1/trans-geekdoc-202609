    ## 3.2. Overview of the proposed framework


    In this paper, we propose a novel framework MCAD to tackle the problem of AD diagnosis
    using multi-modal data. In Fig. 2, the proposed framework MCAD contains three
    main parts: feature extraction including imaging encoder and CSF encoder (Section
    3.3), multi-interaction (MI) module to manage the interactions between imaging
    and CSF, classification module (Section 3.4) and modality alignment (Section 3.5).
    Based on these fine-grained representations for images and CSF, the interaction
    module is designed for exploiting information across modalities. Specifically,
    modality alignment is introduced to align inconsistent feature distributions of
    imaging and CSF, which can further reduce the inter-modality gap at feature-level
    to improve diagnostic performance.


    ## 3.3. Features extraction


    Since AD is believed to affect various brain regions, atrophy regions in MRI scans
    and metabolized regions in FDG scans vary in size. Traditional CNN can only capture
    the information of fixed receptive regions, and it is difficult to extract rich
    features due to pooling operations.


    ![](img/35eb289ac20da6b2112bd8090073aee2_3_1.png)


    Fig. 3. Details of the CD module. Dilated convolution provides a solution to enlarge
    the receptive field without increasing the number of parameters and the size of
    convolution kernels. However, representing features without dilated convolution
    is crucial for AD diagnosis. Therefore, the cascaded CD module is designed to
    improve multi-scale representations. The use of three dilated convolutions with
    different sizes (256, 512, 1024), instance normalization (IN), followed by convolution
    layer of 3x3 and stride of 1, detect features such as the shape and contours without
    computational overhead.


    ### 3.3.1. Imaging encoder


    Using an MRI-feat scan, the convolution is performed by pooling layer to produce
    a $B=4 \times 1024$ vector, which is $U = \{u_1, \dots, u_n\}$, where $u_i \in
    \mathbb{R}^{1024}$ is the representation for each image feature. Then $U$ is transformed
    into an $H$-dimensional vector $V$ (768) via linear projection, inspired by BERT
    [51] and Vision Transformer [52]. When $V$ is transformed to 768, the dense connection
    inside the multi-modal interaction module can be transformed as follows: where
    $I$ and $C$ denote the image and CSF representation, respectively. $W_Q^h$ and
    $W_K^h$ are the transformation matrices of head $h$, where $h$ is the $h$th head
    of multi-modal cross-attention. After computing $q, k,$ and $v$, they are used
    in multi-modal cross-attention, whose procedure can be described as follows:


