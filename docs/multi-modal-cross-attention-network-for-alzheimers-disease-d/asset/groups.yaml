    ## 5.4. Discussion of cross-attention extending to imaging modules


    In the proposed MCAD, multi-modal interaction based on cross-attention learns
    to learn the interactions between imaging features and CSF. To investigate the
    performance of MCAD using cross-attention, we perform experiments by comparing
    MCAD with a variant where cross-attention is extended to modules, design "MCAD-extended".
    Specifically, after obtaining features of two modalities, the outputs are concatenated
    for classification. The experimental results are shown in Table 5.


    Looking at Table 5, the performance of multi-modal interaction between imaging
    features and CSF features is better than that of the multi-modal methods with
    some MRI features, PET features, especially in MCI vs. CN classification. The
    metrics are 1.33%, 1.77% and 1.81% higher than "MCAD-extended". Additionally,
    in AD vs. CN and AD vs. MCI. CN diagnostics, cross-attention extending to imaging
    modules does not result in significant performance improvements. A possible explanation
    for this result is that the model complexity increases significantly, increases
    the risk of overfitting and thus affects the performance of.


    ## 5.5. Visualization analysis


    In this section, we demonstrate the behavior of the proposed framework by visualizing
    the attention maps in multi-modal interaction, as shown in Fig. 12. Cross-attention
    attention represents the CSF-attention attention extraction branch, whereas in
    CSF-attention it is the feature attention. Fig. 12 shows the visualization of
    attention maps corresponding to each feature. We use yellow color in the attention
    map to represent high attention weights. The corresponding results show that the
    attention mechanism differs between imaging patches and CSF features. Due to space
    limitations, we only show one example from each disease status is reported. From
    the visualization results, we have the following observations. In AD category,
    P- and T-tau may show significant attention in brain region with atrophy, particularly
    in the temporal lobe and hippocampus. This finding is consistent with previous
    work [78], which shows a relationship between CSF biomarkers and T-tau and A42,
    in different brain regions. Previous researches [77-81] also finds the correlation
    between CSF biomarkers and imaging features in AD.

