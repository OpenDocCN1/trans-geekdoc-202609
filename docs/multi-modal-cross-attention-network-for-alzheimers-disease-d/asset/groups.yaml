    ## (1) Classification Loss


    Cross entropy, a widely used objective function in classification tasks, is employed
    to minimize the AD classification loss from multi-modal data supervised learning
    as follows:


    ```

    $L_{CE} = -\sum_{i=1}^{N_L} \frac{1}{C} \sum_{c=1}^{C} y_{ic} \log(p_{ic})$

    ```


    where $M$ is the number of classes and $y_{ic}$ is the ground truth. The probability
    score for belonging to class $c$ is denoted as $p_{ic}$.


    ## (2) Modality loss


    To fuse features from different modalities (sMRI and PET) and CSF biomarkers to
    share the similarity, the KL divergence is utilized to align the features of the
    AD and non-AD modalities by transforming the different domain. The KL divergence
    between the representation $I$ and $C$ is defined as:


    ```

    $D_{KL}(I||C) = \sum_{i=1}^{d} I_i \log\frac{I_i}{C_i}$

    ```


    where $d$ is the feature dimension. In the proposed MCAD, the modality alignment
    loss between the features of MRI and CSF is further considered for reducing the
    modality gap. The modality loss $L_M$ is calculated as:


    ```

    $L_M = D_{KL}(I||C) + D_{KL}(C||I)$

    ```


    Finally, in order to learn the domain-invariant discriminant features, the classification
    loss and modality loss are combined for model training. The loss function is defined
    as:


    ```

    $L = \gamma_1 L_{CE} + \gamma_2 L_M$

    ```


    where the hyperparameters $\gamma_1$ and $\gamma_2$ are the proportions of each
    representing the representative content, which is determined in experiments.


    ## 4. Results


    ### 4.1. Experimental settings


    All experiments are conducted using Python 3.6 and the PyTorch library. The model
    is trained on a single NVIDIA GeForce 3090 GPU for 100 epochs using Adam optimizer
    with a batch size of 32. The learning rate is 0.0001 with 1e-4 decay strategy.
    The strategies for training and testing are randomly split. The strategies for
    classification and modality loss are set as follows, that $\gamma_1=1.0$ and $\gamma_2=0.0005$.
    A cross-validation strategy is used to assess the performance of MCAD. The process
    is repeated 5 times, and the results are averaged over all 5 iterations.


    ### 4.2. Evaluation criteria


    To quantitatively evaluate the performance of AD diagnosis, the mean sensitivity
    (SEN), specificity (SPEC), accuracy (ACC), F1-score (F1) and the area under curve
    (AUC) are utilized as evaluation criteria, which are defined as follows:


    ```

    $SEN = \frac{T_P}{T_P + F_N}, \quad SPEC = \frac{T_N}{T_N + F_P}$

    ```


    ```

    $ACC = \frac{T_P + T_N}{T_P + T_N + F_P + F_N}, \quad F1 = \frac{2T_P}{2T_P +
    F_P + F_N}$

    ```


    AUC


