    * Xin Wei


    J. Zhang


    Computers in Biology and Medicine 162 (2023) 107050


    更直接地反映与大脑中阿尔茨海默病（AD）相关的生化变化，这些脑脊液（CSF）成分为 AD 的检测提供了宝贵信息。


    目前已有许多关于 AD 辅助诊断的研究。只有极少数的研究利用了多模态数据，而涵盖多类诊断的研究更少。大多数研究将 AD 与正常对照组（CN）进行区分，而忽略了轻度认知障碍（MCI）阶段；但识别
    AD、MCI 患者和健康老年人的多类诊断更为关重要。来自不同模态的生物标志物可以反映与 AD 各阶段相关的变化，为诊断提供全面信息，并进一步获得更可靠的结果。


    - 2. 为了利用互补作用，引入了基于交叉注意力机制（cross-attention mechanism）的多模态模块，用于学习 CSF 和 PET 组件之间的相关性，以相互增强
    AD 诊断。


    - 3. 为了避免多模态数据之间的模态差异对 AD 诊断性能的影响，设计了一个包含模态对齐和分类损失的目标函数，以弥补不同模态之间的异质性并优化分类性能。


    - 4. 我们使用公共数据集 ADNI 中的多模态数据评估了该方法的有效性，结果显示 MCAD 在 AD 相关任务中比现有方法取得了更理想的性能。捕捉交互的评估可以为
    AD 诊断提供关键证据。


    [14–17]。 尽管之前的方法已被证明有效，但基于多类数据的 AD 诊断仍面临一些挑战。首先，虽然多类方法是模态学习（即跨模态交互）的重要组成部分，但这些方法通过拼接不同模态的特征来结合不同模态的信息，对于利用跨模态的互补信息并非最优。其次，不同模态引起的差异极大影响了
    AD 的特征和诊断，特别是 AD 的多类特性，这需要解决。多类数据中的 AD 诊断面临着至少三个关键挑战：(1) 在考虑不同的 AD 相关场景（包括二分类）时；(2)
    如何充分利用模态之间的交互以更好地发挥它们的互补作用；(3) 减少模态之间的差异。


    为了解决上述问题，我们提出了一种使用多模态数据（包括 CSF、PET 和 GF）进行 AD/MCI 诊断的多类框架。该框架为成像和非成像数据维护了两套编码器、一个多模态交互（MI）模块和一个分类模块。在该框架中，编码器被设计用于从不同模态中提取特征。例如，CSF
    组件被有效地嵌入非成像数据中。由于大脑数据中受影响区域的大小以及不同模态的差异，每个编码器在相应的感受野内提取特征而不丢失信息。然后，我们引入了多模态交互模块，利用跨模态注意力来整合并融合模态（CSF、PET
    和 GF）。最后，设计了一个目标函数来最小化多模态数据表示之间的差异，以指导 AD 诊断。分类任务包括 AD 二分类（AD vs. CN）、MCI 二分类（MCI
    vs. CN）以及多类分类。


    本研究的主要贡献总结如下：


    - 1. 我们提出了一种新颖的框架 MCAD，它可以更高效、更准确地从不同模态中学习用于 AD 诊断的互补信息。我们研究了包括 AD 相关二分类和多类分类在内的多种场景。


    ## 2. 相关工作


    我们回顾了以往关于 AD 诊断的研究，特别是多模态生物标志物，这些被分为两类：1. 机器学习方法 [16–20] 和深度学习方法 [21–26]。


    许多研究 [19] 证明了基于生物标志物的学习方法在 AD 诊断中的有效性，包括特征提取和分类两部分。例如，Lin 等人 [16] 使用多模态数据（MRI、PET
    和 CSF）对 MRI、PET、GF 和基因进行分类。其他研究涉及疾病预测，包含了 AD 多类诊断。W. Waldhof 等人 [17] 开发了逻辑回归，利用
    MRI 和 PET 数据进行 AD 诊断分类，同时结合对痴呆认知重要的标记。Kahn 等人 [29] 应用机器学习分类器对脑图像和遗传数据的特征进行分类。通过过滤器和特征选择的选择利用多种生物标志物实现
    AD 诊断，增强了诊断准确性。


    近年来，深度学习在利用卷积神经网络（CNN）学习特征方面付出了巨大努力。随着 CNN 的快速发展，各种神经网络被用于为 AD 诊断提供多种思路。在分类性能方面，深度学习通过各种技术显示了潜力
    [22,23,31]。许多方法基于神经科学，例如用于 AD 诊断的 AD、MRI、PET 和 GF 功能磁共振成像（MRI） [23,25–27,39]，其中
    CNN 用于提取高级图像表示，以捕捉手动特征提取的复杂性。现有的图像表示方法可以根据输入类型分为四类（像素级、方法级和决策级）。研究人员考虑添加不同的模态数据（如临床和生物标志标志物），为融合提供表示以实现更准确的综合诊断。例如，Spasov
    等人 [17] 采用了一种基于 3D 表面分组卷积的多模态 AD 分类框架，将 SMRI、临床分析和通用指标作为输入。


    J. Zhang 等人


