    0 到 120。在此基础上，我们分别为 Aβ42、Tau 和 P-tau 得到 1500、130 和 120，用于计算脑脊液（CSF）向量。


    ## 3. 3.2. 所提框架的概述


    在本文中，我们提出了一种新型框架 MCAD，用于利用多模态数据解决阿尔茨海默病（AD）的诊断问题。如图 2 所示，所提框架 MCAD 包含三个部分：包括图像编码器和
    CSF 编码器的特征提取（3.3 节）、用于管理图像和 CSF 之间交互的相互交互（MI）模块、分类模块（3.4 节）以及模态对齐（3.5 节）。基于这些图像和
    CSF 的细粒度表示，交互模块旨在挖掘跨模态信息。具体而言，引入模态对齐是为了对齐图像和 CSF 不一致的特征分布，这可以进一步缩小特征级别的模态间差异，提高诊断性能。


    ## 3.3. 特征提取


    由于 AD 被认为影响不同的大脑区域，MRI 扫描中的萎缩区域和 FDG 扫描中的代谢区域的大小各不相同。传统的 CNN 只能捕捉固定感受区域的信息，且由于池化操作，很难提取丰富的特征。


    ![](img/35eb289ac20da6b2112bd8090073aee2_3_1.png)


    图 3. CD 模块的细节。空洞卷积为不增加参数数量和卷积核尺寸增大感受野提供了解决方案。然而，在没有空洞卷积的情况下表示特征对于 AD 诊断至关重要。因此，设计了级联
    CD 模块以改进多尺度表示。使用三种不同尺寸（256, 512, 1024）的空洞卷积、实例归一化（IN），以及步长为 1 的 3x3 卷积层，可以在不增加计算开销的情况下检测形状和轮廓等特征。


    ### 3.3.1. 图像编码器


    使用 MRI-feat 扫描，通过池化层进行卷积产生一个 $B=4 \times 1024$ 的向量，$U = \{u_1, \dots, u_n\}$，其中
    $u_i \in \mathbb{R}^{1024}$ 是每个图像特征的表示。受 BERT [51] 和 Vision Transformer [52] 的启发，通过线性投影将
    $U$ 转换为 $H$ 维向量 $V$ (768)。当 $V$ 转换为 768 时，多模态交互模块内部的稠密连接可以转换如下：其中 $I$ 和 $C$ 分别表示图像和
    CSF 表示。$W_Q^h$ 和 $W_K^h$ 是头 $h$ 的变换矩阵，其中 $h$ 是多模态交叉注意力的第 $h$ 个头。在计算 $q, k,$ 和
    $v$ 后，它们被用于多模态交叉注意力，其过程如下：


    $$CA(I,C) = \text{softmax}\left(\frac{(W_Q^h I)^T (W_K^h C)}{\sqrt{d_k}}\right)W_V^h
    C$$


    $$MCA(I,C) = [CA(I,C), CA(C,I), CA(I,I)]$$


    其中 $CA_h$ 是多模态交叉注意力的第 $h$ 个头，$W_{CA}$ 是特征融合的权重矩阵。


    $$V = W^h U + b^h,$$


    其中 $W^h$ 和 $b^h$ 是学习参数。MRI 和 PET-feat 图像拼接表示最终图像表示 $I = \{i_k, \dots, i_n\}$，其中
    $n=128$ 是输入的切片数。


    ### 3.3.2. 编码器


    CSF 测量包含三种类型：A42、Tau 和 P-tau。由于每个 CSF 代表不同的含义，且每个数值不同，我们需要某种尺寸归一化。通过使用位置编码 [59]
    和注意力编码器，我们考虑使用正余弦函数来实现 A42、Tau 和 P-tau 的编码。每种类型 CSF 的编码过程为：


    $$T(c_i) = \sin(i/10000^{2j/d})$$


    $$T(c_i) = \cos(i/10000^{2j/d})$$


    其中 $c$ 代表来自 A42、Tau 和 P-tau 的值，$i=0, 1, \dots, d-1$  $j=0, 1, \dots, d/2-1$，其中
    $d$ 是模型的维度。


    编码通过两个全连接层转换为 $H$ 维向量（$h=768$）。通过此操作，编码的尺度和维度可以与图像表示保持一致。对于样本，我们将每种类型的 CSF 编码为向量，然后将其拼接形成非图像特征。


    ## 3.4. 多模态交互


    对于 AD 诊断，多源数据可以提供更多信息和潜在关系。因此，必须融合图像和 CSF 特征以实现诊断性能。通过使用多模态交互（MMI）机制 [51]，它可以捕捉图像特征和
    CSF 特征之间的交叉注意力，可以将非图像特征与图像及非图像表示融合。该模块聚焦于使用多头注意力融合图像特征和非图像特征。MMI 的结构不仅可以增强多模态表示的交互，还能保留之间信息的价值。


