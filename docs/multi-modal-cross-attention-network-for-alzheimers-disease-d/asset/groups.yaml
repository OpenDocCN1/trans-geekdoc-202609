    # 结论


    在本研究中，我们提出了一种名为 MCAD 的新方法，旨在利用 sMRI、FD-PET 和 CSF 生物标志物等多模态数据区分阿尔茨海默病（AD）和认知正常（CN）。由于
    MRI 和 FD-PET 扫描中疾病相关的差异较小且尺寸不一，我们利用了基于空洞细粒度表示的编码器来学习多尺度特征。同时，CSF 编码器可以捕捉更丰富的信息表示。为了有效利用
    AD 的跨模态相关信息，我们在基于图像块和 CSF 的细粒度表示的互信息（MI）中对模态交互进行建模。我们设计了一个确保模态对齐的目标函数，旨在从特征层面学习
    AD 特征，这有助于多模态特征的有效融合并提高 AD 的诊断性能。在 ADNI 数据集上的实验结果表明，与其他竞争方法相比，我们的方法在 AD 分类任务中表现更好。广泛实验证明，学习多模态之间的细粒度交互为
    AD 提供了关键信息。


    # 声明


    作者声明没有可能影响本文报道工作的竞争性财务利益或关系。


    # 致谢


    本文的研究得到了成都市重大科技应用示范项目（2019-YF09-0012-SN0）的支持。


