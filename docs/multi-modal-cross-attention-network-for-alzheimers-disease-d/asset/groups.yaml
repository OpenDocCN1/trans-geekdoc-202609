    # Conclusion


    In this study, we propose a novel method named MCAD, aiming to distinguish AD,
    CN using multi-modal data including sMRI, FD-PET and CSF biomarkers. Due to the
    disease-related differences in MRI and FD-PET scans being relatively small and
    vary in size, the encoder based on dilated fine-grained representations is utilized
    to learn the multi-scale features. Meanwhile, the CSF encoder can capture more
    rich information representations. To effectively exploit the correlated information
    across modalities for AD, the inter-modality interactions are modeled in the MI
    based on fine-grained representations of image blocks and CSF. We employ an objective
    function to ensure modality alignment is designed to learn AD features feature-level,
    which contributes to the effective fusion of multi-modal features and the AD diagnostic
    performance. Experimental results on ADNI dataset demonstrate that our method
    outperforms other AD classification tasks compared to the competitive approaches.
    Overall proved by extensive experiments, learning the fine-grained interactions
    between multiple modalities could provide critical information for AD.


