    where $CA_h$ is the $h$th head of multi-modal cross-attention, $W_{CA}$ is the
    weight matrix for feature fusion.


    $$V = W^h U + b^h,$$


    where $W^h$ and $b^h$ are learned parameters. The images of MRI and PET-feat are
