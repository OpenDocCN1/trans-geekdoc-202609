    ![](img/35eb289ac20da6b2112bd8090073aee2_3_0.png)


    Fig. 2. Overview of the proposed framework.


    The minimum-maximum normalization is used for the feature range [0, 1].


    For the representing of CSF biomarkers, Aβ42, Tau, and P-tau are set to insert
    feature range from 170 to 200, from 0 to 1300, and from 0 to 120, respectively,
    according to the numerical distribution of CSF biomarkers in the dataset. In this,
    we get 1500, 130, and 120 for Aβ42, Tau, and P-tau values, respectively, for computing
    the CSF encoder vector.


    # 3.2. Overview of the proposed framework


    In this paper, we propose a novel framework MCAD to tackle the problem of AD diagnosis
    using multi-modal data. In Fig. 2, the proposed framework MCAD contains three
    main parts: feature extraction including imaging encoder and CSF encoder (Section
    3.3), multi-interaction (MI) module to manage the interactions between imaging
    and CSF and classification module (Section 3.4) to perform information reduction
    and age diagnosis (Section 3.5). MCAD consists of two strategies implemented for
    imaging and CSF modalities, respectively are learned with two features in the
    feature extraction module. Based on these fine-grained representations for images
    blocks and CSF components, the interaction module is designed for exploiting the
    information across modalities for AD diagnosis. After the attended intended imaging
    and CSF features, the multi-modal features are used to decide the status in the
    classification task in terms of AD diagnosis and modality alignment. Specifically,
    the modality alignment is introduced to align the inconsistent feature distributions
    of imaging and CSF biomarkers, which can further reduce the inter-modality gap
    at feature-level to improve the diagnostic performance.


    # 3.3. Features extraction


    # 3.3.1. Imaging encoder


    Since AD is believed to affect various brain regions, the disease-affected atrophy
    regions in MRI scans and the low-metabolized regions in FDG-PET scans vary in
    size. Traditional CNN can only capture the information of fixed receptive regions,
    and it is difficult


    ![](img/35eb289ac20da6b2112bd8090073aee2_3_1.png)


    Fig. 3. Details of the CD module. Dilated convolution operations are in the format
    (numbersize, stride, dilation).


    to extract rich imaging features. Dilated convolution provides a solution to enlarge
    the receptive field without increasing the number of parameters and the size of
    the convolution kernels. and the dilated convolution allows the receptive field
    to be without losing information due to pooling operations. In addition, dilated
    convolution has been successfully used for feature extraction of MRI and FDG-PET
    scans. However, representing features without dilated convolution is crucial for
    AD diagnosis. Therefore, the cascaded CD based module is designed to improve the
    multi-scale representations, significantly improving the performance of AD diagnosis.
    The use of three dilated convolutions with different sizes to capture multi-scale
    features as shown in Fig. 3 shows architecture detail


    dilation by introducing zeros between filter elements, which causes the receptive
    field to increase more relevant information. The CD module consists of four blocks,
    each of which contains three dilated convolution, instance normalization (IN),
    followed by a convolution layer of 1 x 1 and stride of 1, which can be reached
    as the linear transformation of input channels. The followed dilated convolution
    layers several (256, 512, 1024) filters with small size of 3 x 3, and dilated
    convolution size is 1, 2 and 5, respectively. Instead of using large convolution,
    we use dilation in the convolution layers to detect features such as the shape
    and contours without the computational overhead.


