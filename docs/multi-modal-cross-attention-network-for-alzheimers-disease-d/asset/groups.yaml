    Xu 等人 [40] 提出了一种解释性学习网络，从 sMRI、年龄、性别和类别标签的多模态数据中提取判别特征。Pan 等人 [23] 包含了来自 sMRI
    的多形式特征并结合配准类 AD 分类。同样，Tong 等人 [41] 提出了一种非图融合框架，高效简化了 SMRI、CSF 和 PET 之间的融合以进行 AD
    分类，性能达到 60.2%。Li 等人 [42] 提出了包含 AD 诊断和临床评分回归的多类任务，使用基于 CNN 的注意力机制利用 sMRI 和人口统计学信息。


