  \n[content]\n安排一组人员参与面试过程，并确保小组的规模与职位的水平相匹配。（初级职位的候选人不需要与 25 个人或公司的首席执行官见面！）这个团队可以帮助招聘经理从候选人池中筛选、面试被选中的候选人，并向经理提出最终的录用建议。确保团队了解该职位是什么、你希望候选人具备什么样的技能/经验，以及如何评估这些候选人。如果面试团队缺乏多样性，你对多元化背景申请者的吸引力就会降低。（不要忘记，面试是双向的。他们对你的面试程度并不于你对他们面试的程度。）确保与申请者接触的人尽可能多样化。如有必要，引入来自你直接团队之外的人员。（如果你的团队是同质化的，这可能是必要的。）目前有一种技术趋势，即在面试过程中“测试”候选人的专业领域知识。这对于任何候选人来说都是具有争议的，但对于多元化背景的候选人来说尤其如此。如果你决定必须将测试作为招聘流程的一部分，请从一开始就明确这一点，并尽一切努力让测试尽可能没有偏见。事实上，从开始就让整个招聘过程透明化。让潜在候选人知道包含哪些内容，以便他们判断这个过程是否值得投入时间。有多少次面试？是否有测试？他们是否必须作为流程的一部分进行演示或提交论文？你计划何时招聘？这不仅有助于你的多元化候选人，对所有候选人都有帮助。\n\
