  \ William (作者)\n    * *写作之道,* 288\n\n\n\n\n作为一名患有 ADHD（多动动症）的文科辍学学生，我发现令人眩晕的职业路径迷宫反而适合我。我将工作中的技术知识与外语技能相结合，最终在欧洲一家瑞士银行负责地区安全工作；随后我回到德克萨斯州，为州政府做了同样的工作（是的，德克萨斯州的网络安全有它自己的“方言”）。在担任了五年行业分析师并与数百家安全供应商交流后，我协助建立了零售和酒店业情报共享与分析中心（ISAC）。今天，我领导着由前首席信息安全官（CISO）组成的团队，并利用这些经验帮助指导\
  \ `Cisco`（全球最大的安全公司及网络巨头）的安全战略规划。我不知道自己职业生涯下一步会做什么；这一切都不是计划好的，每天都会带给我一些我需要解决的新问题。\n\
  \n但对于你们中那些对第一份网络安全工作感到焦虑，或者准备好迈向下一步却无法决定该何何的人来说，Helen Patton 正是你们需要的导师。《航行网络安全职业路径》读起来就像是和她一起喝着热饮、聊了几个小时；如果\
  \ 25 年前我能拥有这样的导师或书面教材，也许我会在职业生涯中做出不同的选择。我肯定会少犯一些错误。你不需要是该领域的新手就能从她那里获得深刻的见解：无论你身处何地或正试图掌握什么，Helen\
  \ 都根据来之的经验提供了睿言，告诉你如何判断安全管理是否适合你，如何建立你的第一个网络安全计划，甚至何时是时候离开目前的职位了。\n\n尽管 Helen 目前在工作中向我汇报，但在一个稍有不同的平行宇宙里，我可能会向她汇报，我希望未来能如愿。网络安全领域如此动态且新颖，你永远不应该错过向杰出同事学习的机会，而通过这本书，这个机会就掌握在你的手中。抓住它，守护你的未来！\n\
