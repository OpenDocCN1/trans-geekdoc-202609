  - 293. 295\n- 294. 296\n- 295. 297\n- 296. 298\n- 297. 299\n\n\n\n人们在职业生涯的每个阶段都会问类似的问题。在我们在这个领域不断发展的过程中，我们都在与同样的问题作斗争。行业、公司、他们所就事的经理可能不同，但面临的问题和顾虑是共通的。通常情况下，人们知道该做什么，或者知道如何找到答案，但他们需要先向其他人倾听想法。他们会找到我或像我这样的人，来提供智慧和客观性。我们对行业有足够的了解并可以提供帮助，但我们并没有深陷于日常的琐事中。这有助于他们确认自己处理的并不是特殊情况，而是别人也经历过同样的境地，而且帮助随处可见。我扮演着倾听者、教练和拉拉员的角色。这让我感到非常有成就感。\n\
  \n一对一的会面扩展性并不好。当我同事和我努力吸引更多新人加入我们的行业，并帮助他们蓬勃发展和领导时，需要帮助指引其安全职业的人数正在不断增加。我写这本书是为了回答我经常收到的常见问题，并为那些无法面对面交流的人提供一个广泛的资源。我希望这也能帮助像我这样的导师——我们无法一直回答所有问题，并希望将人们引向有用的资源。\n\
  \n我曾考虑过编写三个不同的书（进入安全领域、在安全领域生活、领导安全领域）。随着思考的深入，我意识到我们的职业生涯并不是线性的。有时候，我们刚刚开始担任领导职务；有时候，我们在一个安全岗位上做了几十年，但我们正考虑跳槽到一个新职位，并研究如何再次进入安全领域。有时候，我们作为中期职业人士面临的挑战与我们作为领导者面临的挑战是相同的。我意识到人们可能想提前阅读或回顾某些主题，因此将它们全部整合在一起会成为一个易于检索的参考。\n\
  \n我假设如果你想在安全领域工作（或者你已经在那里了），那么你的目标公司足够大，能够支持专门的安全资源。这可能意味着一家进入下一增长阶段的初创公司，需要它的第一位安全专业人士；也可能是一个在一个安全负责人领导下拥有许多安全团队的大型企业。无论如何，我的建议适用于具有某些组织文化和结构的公司员工。\n\
  \n每一章的内容都可以从求职者、任职者或经理的角度来阅读——有时甚至同时兼顾。例如，关于写简历、发布招聘公告和建立多元化团队的章节都是相关的，每一章中都有每个人需要的收获。我鼓励你从“另一侧”的角度来看你的问题。如果你是一个求职者，请阅读经理章节，看看他们在想什么。如果你是一个经理，请考虑求职者的视角。安全专业人员在广泛思考问题时能发挥最佳水平。在这里也采取同样的方法，从各个方面探索你的问题。\n\
  \n在每一章中，我都会从一个总结部分开始。总结能让你快速找到所需的信息，并提取出核心主题和资源。你会发现，许多主题在不同章节之间延续。对于整本书以及你的整个职业生涯来说，这意味着你应该了解自己、建立人脉、保持好奇并进行良好的沟通（而且经常沟通！）。\n\
  \n你可以只通过阅读回答你迫切问题的章节来读这本书，尽管某一章节的建议可能适用于其他章节，因此我鼓励你读完。了解你现在问题的答案以及未来可能提出的问题是有帮助的。在未来的某个时刻，人们会向你提出这些问题，所以这也是为了你未来将成为的导师做准备。“做好准备”是安全领域任何人都应该遵循的绝佳格言。\n\
  \n你会发现，被问到的问题中并没有很多是技术问题。是的，安全是一门以技术为中心的学科。是的，你需要具备某种水平的技术知识才能在安全领域有一席之地。但如何“做”技术很少是人们向导师请教的问题。更多时候，问题是关于寻找资源，以及组织结构、性格和政治问题。\n\
  \n\n\n\n询问他人如何获得目前的安全工作是打破冰冰和建立关系的绝佳方式。了解某人如何穿越安全职能、公司政治和人为错误的“迷宫”并获得目前的职位，是非常有趣的。要记住，一个人的故事仅仅是故事——*他们自己*的故事——并不是你可以复制到自己身上的东西。我的故事始于\
  \ 20 世纪 80 年代后的澳大利亚。我在 20 世纪 90 年代初在美国开始从事信息技术（IT）。思考一下：不同的国家、不同的文化、不同的技术。了解我是如何从一个澳大利亚高中生变成俄亥俄州哥伦布斯的首席信息安全官（CISO）的，这是一个有趣的故事，但对于刚起步的人来说，了解我旅程的细节几乎没什么什么可以借鉴的。\n\
  \n所以，你应该询问别人是如何进入安全领域的，以及他们如何继续他们的安全之路的吗？是的，绝对应该。但不要只问一个人；要问及你在安全领域遇到的每一个人。而且不要只问他们是如何成为一名[填空]安全人员的。要进行自己的研究并寻找成功的主题。问问他们是如何开始的，是如何走到现在的。那些在你渴望的职位上的人有什么共同点？他们是如何思考的？他们接受过什么培训？他们有导师帮助他们吗？他们能够留在某个地理位置，还是必须到处奔波？他们的家庭结构是怎样的？他们得到过帮助吗？如果是，他们是从哪里得到的帮助？他们得到了什么样的帮助？\n\
  \n如果你（还）不认识很多安全领域的人，你可能想读读 Marcus J. Carey 和 Jennifer Jin 写的*黑客部落：世界顶尖黑客的网络安全建议》(Tribe\
  \ of Hackers: Cybersecurity Advice from the Best Hackers in the World)*。这本书包含了一系列知名且成功的安全从业人员为想要进入网络安全领域的人提供的建议。\n\
  \n当你得到了这些问题的答案后，将它们与你自己的情况进行比较。哪些是你可以复制的？哪些是很有用但不适用于你特定情况的？你拥有他们没有的机会？这里的目标是找到现在对你有效的策略，而不是十年前或更久以前别人有效的事情。\n\
  \n这样想：你正在编写你自己的故事。现在，你正处于一个起点。这可能是一个纠结选什么课程的高中生或大学生。这可能是一个将安全作为下一个职业选择的中期专业人士。这可能是一个对安全一无所知，但好奇了解更多是否会有帮助的人。无论你从哪里开始，你都需要为通往你想去的地方清理一条路。询问安全领域的人他们是如何走来的，将给你一些想法和关于如何前进的思考。写一个关于你自己的旅程的故事将帮助你了解自己是否处于正确的道路上——即使故事中充满了计划之外的转折。\n\
  \n## 创造你的故事\n\n在编写你的安全故事时，有一些高级的真理需要记在心里。这些主题将帮助你保持灵活性，并在新机会出现时快速转型。如果你的目标是在安全行业寻找工作，甚至是在安全领域继续工作多年，请考虑本章中的这些建议。\n\
  \n### 对齐技能与优势\n\n从了解你自己的“为什么”开始。（我们会在书的后部分讨论这一点。）了解你自己——你为什么喜欢安全，你拥有什么样的技能，以及你想在什么样的文化下工作——是在开始申请工作之前最重要的事情。没有什么比尝试将你那些不匹配的技能和价值观强塞进安全职位中更能让你失败得更快了。\n\
  \n当你与他人交谈并询问他们是如何到达现在的位置时，专注于学习他们的“为什么”。他们为什么要做安全？他们看中安全的什么方面？他们不喜欢安全的什么方面？反思你自己的价值观——它们相似吗？基于你所认为对你重要的事情，你能看到自己出现在他们的角色中吗？\n\
  \n做好安全工作需要耐心、毅力以及对你职责意义的信念。如果你不能用自己的技能和价值观来支撑这一点，这将是一份非常难以从事的职业。花时间来了解自己，并清醒地评估这份职业是否真的适合你。\n\
  \n### 对机会保持开放态度\n\n安全职业没有所谓的“正确路径”。即使在规模大到有定义的基于角色的职业阶梯的公司中，安全从业人员也可以以惊人的方式向上、横向、向下和再次向上移动。通常情况下，你将通过你所结识的人和随机的机会获得下份职位，而不是通过有计划的职业晋升。\n\
  \n> 获得第一份安全工作是在玩一场数字游戏——你了解并申请的职位越多，你找到适合自己的职位的概率就越大。\n\n当你学习他人的故事时，请注意他们是如何在角色与角色之间流转变换的。他们是刻意寻找某个特定的工作，还是偶然获得职位的？他们对自己的选择感到舒适吗，还是必须经历不适才能在职位之间转换？\n\
  \n对新职位保持好奇，并在新机会向你走同时对探索新机会保持开放。结识你所在团队、公司、所在地和行业的安全领域人士。你的圈子越大，当机会出现时你越可能看到它。\n\
  \n### 不要追求完美\n\n做好准备并乐于学习。\n\n事实是，大多数招聘经理和猎头写的安全职位招聘描述写得非常糟糕。他们要求一种奇怪的技能组合，并寻找与职位要求不匹配的教育背景。将他们要求的技能视为“愿景性的”而非“强制性的”。在行业变得更好地编写职位描述之前，少关注是否符合每一项要求，多关注你是否认为能胜任这份工作。在书的后面，我们将讨论如何制作简历以通过筛选并引起招聘经理的注意，从而获得面试机会展示你的优势。\n\
  \n当你遇到其他人了解他们的路径时，询问他们他们担任新职位时的技能水平。他们以前做过这份工作吗？他们认为自己准备好承担新职位了吗？他们是否需要说服招聘经理他们是合格的？从他们的经验中学习。\n\
  \n拥有一套适用于各种潜位的通用技能包。提示：大多数技能不是技术性的，而是职业技能，如团队合作、责任感和可靠性。你对安全的好奇心可以学习安全职能的基础知识。然后你可以将其转化为一份可靠的职位申请，即使它并不完美符合要求。\n\
  \n### 保持好奇\n\n不断阅读、观看和倾听安全意见领袖的观点将帮助你获得职位并帮助你留住职位。永远没有你认为已经“到达”并可以停止学习的时候。没有任何时候你会觉得自己知道了一切（甚至对任何事情都足够了）。总会有新技术、新战术和新工具。\n\
  \n愿意在工作之余花时间学习安全事物，否则很容易掉队。好消息是有很多学习方法：会议、博客、播客和书籍。准备好为它们投入时间。\n\n和其他讨论他们从哪里获取信息。新的来源不断涌现。当你听到/阅读/学习到新东西时，花时间处理它。如果可能，找到一种将其融入到你现在工作中的方法。\n\
  \n\n\n\n\n如果你不喜欢痴迷于安全相关的事物，那么这个职业可能并不适合你。你没有将整个清醒时间都沉浸在安全中——工作与生活的平衡至关重要——但拥有成长/学习的心态是关键的。\n\
  \n## 人脉！\n\n培养安全合作伙伴并与那些同事保持联系，可以为你开启无法数尽的大门。这种技能与其他任何技能都一样重要。学习如何与人结交、建立联系并形成互利的关系。很多时候，这会让你找到真正的朋友。当你与其他安全领域的专业人士交流时，问问他们是否认识什么你应该认识的人，请他们介绍。\n\
  \n寻找你的第一份、第二或下一个安全职位`始终`取决于你人脉的强度，保住你的工作也是如此。人脉建立不是安全领域工作中一个可选的部分；它是至关重要的。你的人脉将扮演导师、队友、伙伴和知己的角色。书中没有任何一个章节没有提到通过人脉来寻求指导和建议。\n\
  \n请注意，建立人脉并不意味着面对面的社交。你可以在社交媒体上、一对一会议和电子邮件建立人脉。面对面的人脉的影响最大，但对于那些宁愿做任何事也不愿社交的人来说，还有其他选择！如果你正打算进入安全领域，请从寻找当地的人脉网络开始，并从那里向外扩展。我在书末的“资源”附录中提供了一些人脉小组的建议。\n\
  \n## 出代价\n\n在技术领域工作——或者从事任何工作——在在你担任安全职位之前，都是无价的培训。仅仅因为你拥有学位或证书并不意味着你已经准备好胜任安全工作。\n\
  \n> 安全专业人士在理解技术与组织之间的关系之前，才能将安全技能和原则应用到它们身上。\n\n为了获得一份安全方面的工作，你可能需要先在其他地方工作。例如，你可能可能是应用程序开发团队或帮助台的一员，或者你可能工作过合规部门或担任业务分析师。对于许多安全岗求职者来说，这是一个“有鸡还是有蛋”的问题：你需要一份工作来获得安全技能，而你需要技能来获得安全工作。解决这个问题的一种方法是在安全相邻领域工作或实习，例如通用\
  \ IT、业务连续性、隐私、审计或合规。一旦你拥有了这些技能，申请安全职位就会容易得多。\n\n一旦你进入了安全职位，不要急于跳槽太快。在参与业务周期中几年是可以学到东西的。通常，初级人员倾向于快速爬升职业阶梯，而在安全领域，有很多机会通过在公司之间跳槽来实现这一点。我建议采取更全面的方法，以便你充分理解这个角色。这意味着要至少呆几个业务周期，这通常是一年或两年（如果你在初创公司，可能会短一点）。如果你处于更高级别的职位（特别是人员管理角色），这个时间范围可能会更长。花时间真正融入你的角色将使你成为更优秀的专业人士，拥有更深厚的技能和经验。不要忽视这段时间的价值。\n\
  \n## 所以，你想从事安全工作\n\n进入安全领域有很多方法，但并非所有路径都是等同的。进入安全领域有很多方法，但并非所有路径都是等同的。进入安全领域的方法有很多，但并非所有路径都是等同的。进入安全领域有很多方法，但并非所有路径都是等同的。进入安全领域的方法有很多，但并非所有路径都是等同的。进入安全领域的方法有很多，但并非所有路径都是等同的。进入安全领域的方法有很多，但并非所有路径都是等同的。进入安全领域的方法有很多，但并非所有路径都是等同的。进入安全领域的方法有很多，但并非所有路径都是等同的。进入安全领域的方法有很多，但并非所有路径都是等同的。进入安全领域的方法有很多，但并非所有路径都是等同的。进入安全领域的方法有很多，但并非所有路径都是等同的。进入安全领域的方法有很多，但并非所有路径都是等同的。进入安全领域的方法有很多，但并非所有路径都是等同的。\n\
  \n\n\n\n\n*   中级和高级安全职位非常火热，候选人期望的薪资和福利比其他信息技术工作更高。然而，公司并没有以同样的程度重视安全角色，提供的薪资也未达到求职者的预期。结果是，职位空缺时间（以及找到合适薪工作的时间）很长，而且存在许多为了更高薪水而跳槽的现象。\n\
  \n*   高级安全领导岗位是高倦怠率的职位。`CISO` 的平均任期大约为两年。这不仅寻找优秀的高级人才变得困难，也让安全部门其他部分的稳定性变得不再可靠。这会影响到所有开放职位的广告频率和质量。\n\
  \n尽管发布了许多安全职位，但对于求职者来说，在正确的时间在合适的地方找到合适的工作仍然是一项挑战。为了应对这个问题，你需要准备好迎接任何潜在的机会。这是可以做到的！一旦你获得了一份安全工作，转到其他职位就会变得更容易。跨入安全领域的大门是最困难的一步。\n\
  \n准备工作这项任务看起来可能不可从心，但有很多资源可以帮助你，也有许多人成功进入安全领域的案例。\n\n## 接下来做什么？\n\n*   花些时间思考你为什么对安全感兴趣。诚实地面对自己。你喜欢玩弄技术吗？防御者的角色吸引你吗？也许你仰佩的某人是安全专家，你想效仿他们。也许潜在的收入和工作保障很有吸引力。写下你的答案，然后花些时间反思它们。这些答案感觉对吗？\n\
  \n*   在社交媒体上寻找那些从事你感兴趣工作的人。查看他们的背景和经验。与他们建立联系，并在交流活动中与其互动。向你的人脉网络寻求介绍。\n\n*   查看你想要的职位的招聘公告。注意他们正在寻找的技能和经验。你拥有这些技能和经验吗？你*想要*拥有这些技能和经验吗？考虑填补你经验和技能短缺的方法。\n\
  \n*   寻找你所在地区的网络小组和安全聚会。参加一次会议。在会期间至少向一个人介绍你自己。列一份问题清单，向你遇到的每一个人提问。准备好在社交活动或职活动中与人进行有意义的对话。\n\
  \n*   阅读 Jessica Barker 博士撰写的《自信网络安全：如何进入网络安全并让你的职业无惧未来》一书，以获得更多进入安全领域的想法。\n\nWileyPRE\n\
  \n# 第 2 章：为什么选择安全？\n\n“我无法相信竟然有人想做安全工作。” ——面试官\n\n在 21 世纪 20 年代后期，我在一家俯瞰纽约公园大道的宏伟办公室内里参加了一个安全职位的面试。面试官是一位穿着笔挺西装、声誉极佳的技术主管。我非常紧张！当面试官的第一句话就对我工作和职业生涯的整个假设表示怀疑时，我惊讶得目瞪眼镜。\n\
  \n我很想告诉你们这种观点是一个特例。但它不是。这种态度反映了他们对安全的无知，以及对安全功能的价值缺失。他们这种观点的人并不孤单——过去如此，现在也如此。在安全领域工作时产生冲突和压力的最大原因之一，是其他人误解了什么是安全，或者为什么安全人员会做出那些决定。他们认为我们顽固、固执或干脆烦人。而我们认为自己正在帮助他们避免他们看不见的东西，帮助他们做好在不发生意外安全事件的情况下实现目标，并帮助他们变得更好。在所有情况下，这些分歧的产生是因为我们不理解别人的“为什么”。\n\
  \n我们安全人员认为安全的目的是显而易见的，任何有基本智的生命体都能理解安全为什么重要。事实是，安全是一个被技术人员和非技术人员共同误解的职业。\n\n> 如果你要成为安全团队的一员或领导安全团队，你需要非常清楚你为什么要这么做，它带来了什么价值，以及为什么安全是一件好事。\n\
  \n如果你从内心深并不相信这一点，你很可能在成功之前就精疲力竭了。\n\n对于刚入行的人来说，找到“为什么”可能是困难的。当你不知道“是什么”或“如何做”时，很难找到“为什么”。一个起点是阅读西蒙·斯涅克（Simon\
  \ Sinek）的书《从为什么开始》（Start with Why）。这不是一本关于安全的书，但它将帮助你思考驱动你的动力、什么是重要的，以及安全如何融入你的生活。现在，你的“为什么”的答案可能仅仅是“因为我好奇想学更多”或“我喜欢目前看到的”。\n\
  \n## 什么样的人做安全？\n\n在安全领域工作足够久，你就会注意到特定的安全文化和亚文化。将你的价值观与你工作的文化对齐非常重要。如果你每天上班必须为了迎合而扭曲自己的个性，那工作就太痛苦了。因此，考虑一下已经在安全领域工作的安全人格，看看你的价值观和风格是否与他们任何一个一致。\n\
  \n有四种安全人格。\n\n### 安全人格\n\n|  | 保护者 (Protector) | 谜题者 (Puzzler) | 道德十字战士 (Moral Crusader)\
  \ | 变革者 (Change Agent) |\n| --- | --- | --- | --- | --- |\n| **关注点** | 社区服务 | 知识追求\
  \ | 伦理与公平 | 新挑战 |\n| --- | --- | --- | --- | --- |\n| **领导风格** | 国民防御 | 战略规划者 |\
  \ 价值观驱动 | 解决问题者 |\n| **初级角色** | 蓝队/应急响应 | 红队/安全分析师 | 治理、风险与政策 | 所有角色但时间不会长 |\n\n\
  ### 保护者\n\n这些人人可能来自军事或其他服务性背景。他们将安全视为一种能够我们自由和组织使命的社区服务。他们经常将安全称为“战场”，他们是保护组织的战士。具有这种心态的安全人员倾向于国家级攻击问题，并个人参与安全运营和其他应急响应活动。新的安全专业人员喜欢安全培训和意识、安全情报以及安全运营。并不意外，你通常可以在国防组织中找到他们，但你可以在大多数行业和地区找到他们。\n\
  \n刚进入安全领域的人通常从防御相关的（蓝队）角色开始。这些是学习安全如何运作、学习保护组织不受网络攻击真正需要什么，以及通常感受安全功能大部分的好地方。具有保护倾向对于这类角色非常有益。\n\
  \n### 谜题者\n\n成为安全计划、功能或服务的一部分是一项智力且复杂的追求。有些人仅仅因为这种挑战被安全吸引。这些专业人士优先考虑战略规划，并享受政策、政治和组织管理的互动。他们是为了长远目标而努力，意识到可能会遇到小挫折。他们可能从事逆向工程、渗透测试或工程设计。在所有情况下，他们喜欢周围围绕着做独特事情的聪明人。\n\
  \n如果你不断学习新技术，对技术进步着迷，或者对通过数据分析解决复杂问题感兴趣，你可能属于这一类。谜题者倾向于成为特定领域的专家——因为他们在学习上非常深入。如果你是一个谜题者，请寻找那些可以向你学习的同事以及支持你知识渴求的公司。\n\
  \n### 道德十字战士\n\n\n\n\n\n也关注伦理吗？这位安全专业人士也是如此。他们认为自己的职责是确保我们管理系统和信息的方式符合伦理且恰当。他们与隐私保护领域的同事保持紧密一致，并经常讨论价值观驱动的安全。他们相信安全是一个优秀组织的基石元素之一。安全信条者对治理和风险角色感兴趣，包括框架和政策。\n\
  \n这一类别中的人既是规则的制定者，也是规则的遵循者。他们要求规则来确保公平性和可预测性。他们希望知道人们是根据指南和最佳实践来确保安全的。他们认为安全不是终极目标；相反，他们将安全视为确保系统或公司公平性和信誉的一种方式。\n\
  \n## 变革者\n\n安全行业中的许多人，无论是新手还是领导者，都会告诉你，安全的吸引力之一在于它在不断变化。这也是让非安全领导者最感到沮丧的事情之一（“我们什么时候才能忙完这些安全事儿？”）。喜欢变化的安全人员会将不断演变的技术及其相关的安全元素作为安全团队的价值主张。也就是说，当业务发生变化时，威胁和漏洞也会随之变化。因此，公司确实需要安全。\n\
  \n安全人员经常利用技术和安全的不断变化性来学习新技能并承担新角色。你会在各种安全角色中发现变革者。\n\n作为变革者的人通常认为自己是“问题解决者”。他们承担一个又一个项目，很快地从一份工作移动到另一个工作。他们厌倦了长时间做同一件事。\n\
  \n## 你的“初心”是什么？\n\n就像所有的性格类型一样，很少有人仅属于某一个类别。我们大多数人都有每种类型的特征，并在职业生涯的不同时期使用它们。\n\n\
  如果你刚进入安全领域，你应该对自己的“初心”有一个感觉，并对符合你风格的工作类型有一个直觉。这能够帮助引导你找到符合你核心价值观的安全领域。随着时间的推移，你的“初心”可能会改变，这没关系。只要你知道自己起初为什么在那儿，你就会在安全方面做得更好、更有趣，压力也更小。\n\
  \n当你与招聘经理交谈时，试着找出他们的“初心”。这可以帮助你找到与你的价值观一致的人，让你的日常工作变得更好。即使他们强调了一个你没有强调的类别，仅仅知道他们看重什么就能帮助你更好地管理工作关系。\n\
  \n那么，你呢？你的“初心”是什么？如果你不确定，考虑做一下后续章节中讨论的内容。\n\n### 思考一下\n\n花些时间进行真正的内省，尝试阐述你的核心价值观。什么对你最重要？为什么这些事情如此重要？我不只是在说安全价值观；我谈论的是整体——家庭、信仰、金钱、地位、地点、教育/学习等等。\n\
  \n你的优势是什么？你是一个沟通者、分析师还是艺术家？优势不是你已经掌握的东西；相反，把它们看作是你喜欢做的事、你做起来很舒服（大多数时候）的事，以及让你充满活力的事。考虑阅读马库斯·巴金汉汉和唐纳德·克里夫顿写的《现在，发现你的优势》（*Now,\
  \ Discover Your Strengths*）。\n\n如果你很难开始，可以考虑思考负面因素，例如你不具备哪些价值观和优势。这可以帮助缩小你拥有的优势和价值观范围，让你选择避开那些带给你快乐的安全角色。\n\
  \n内省是费力的，而且是你应该定期审视的事情，因为虽然你的价值观可能是稳定的，但你的优势可能会随着时间而改变。\n\n### 列一份清单\n\n随手备着。和家人、朋友、同事谈谈。请他们在给你反馈时诚实一些。他们认为你看重什么？他们认为你的优势是什么？\n\
  \n他们所指出的你的优势与你自己的清单匹配吗？如果是，太棒了！他们提出了一些你没想到的点并不稀奇。\n\n\n\n\n理想情况下，你会发现这两者之间存在显著的重叠。重叠就是你可以追求的潜在职业路径。如果你发现你重视安全是因为它能保护组织免受威胁，你喜欢进行威胁分析，而且公司也重视防范威胁，那么一切都是匹配的。太好了！反之，如果你非常喜欢向人们传播安全相关知识，而公司文化又不愿了解潜在的威胁，那么情况就不太妙了。开展安全培训和意识培养是好的，但在你目前的公司可能并不理想。如果你正在为新公司的职位面试，你应该在面试期间询问此类，以确保你的价值观与公司的价值观一致。\n\
  \n当你有了答案后，请利用它们来指导你的职业，并在困难时刻增强你的力量。我们都需要一盏明灯。你的明灯是什么？\n\n## 接下来做什么？\n\n如果你正在考虑从事安全领域工作，或者已经在安全领域工作了十年或以上，现在是回答本章提出的问题的时候了。识别出你的优势、你对安全的重视程度，以及能够放大你优势的工作类型。在这些方面花费的时间将获得回报，确保你找到一个可以让你取得成功并感到快乐的角色。\n\
  \nWileyPRE\n\n# 第 3 章：我该何开始？\n\n当人们开始考虑从事安全工作时，他们往往是根据某人的想法（例如黑客）或他们见过的单一角色（例如 `pentester`\
  \ 渗透测试员或 `analyst` 分析师）开始的。也许他们认识并佩慕某个从事安全工作的人，并想变得像他们。也许他们听说安全领域有很多工作机会，认为这可以是一个值得追求的稳定职业。\n\
  \n因此，他们开始寻找招聘公告、职位描述或安全框架。他们很快发现 `security` 是一个涵盖许多不同类型角色的术语，很快就被琳琅满目的选项所淹没。他们查看所需的技能和经验，发现即使对于入门级工作，他们也没有大部分所需的技能。这种“陷入两难”的困境是：你需要工作来获得技能，但你又需要技能来获得工作。\n\
  \n然后他们可能会陷入僵局。为什么这这么困难？\n\n如果你想学习医学、法律或会计，你的路径是清晰的。你上大学获得该领域的（研究生）学位，然后参加专业考试以获得在该行业工作的执照。然后你进入该行业工作，并接受继续教育以维持你的执照。你没有太多选择。对于这些职业，它们的准则在很久以前就已经建立了，学校的建立也考虑了执照和专业要求。安全行业则不同——出于某些很好的理由。\n\
  \n与医学、会计或法律等职业不同，安全行业没有学位、技能或执照的专业要求。安全行业仍然年轻，公司和机构仍在边摸索边建设。没有一个单一的地方可以找到寻找安全职业的终极指南。没有公认的安全原则可以学习和遵循，也没有被普遍理解的安全行为准则。\n\
  \n安全领域没有通认的组织结构。与任何一个安全领导者谈论他们团队的功能，你会得到各种不同的答案。他们是负责身份管理，还是由 `IT` 团队处理？他们是负责灾难恢复，还是由其他人负责？谁负责安全合规？第三方风险管理又如何？安全风险是企业风险结构中的一个独立风险领域，还是运营风险的一部分？有时，你认为是安全职能的东西实际上属于组织的其他地方——但也可能不是。\n\
  \n业务的其他部门对安全的看法差异很大。有时，安全团队（包括领导者）被埋没在技术组织中，所有的职位描述都是以 `IT` 的术编写的。有时，安全是合规部门的一部分，或者安全人员向首席财务官汇报，或属于业务风险小组。有时，如果你足够幸运，安全领导者直接向\
  \ `CEO` 汇报，他们的职业体系独立于其他任何事物。安全职能在组织中的位置决定了安全职业路径可能是什么样子。\n\n对于一个初入该行业并试图弄清楚有哪些角色、它们有多大的增长潜力以及从哪里开始的人来说，这可能真的令人非常沮丧。\n\
  \n## 成为安全专业人员意味着什么？\n\n大多数时候，当人们考虑“从事安全工作”时，他们首先想到的是支持组织的安全。当然，还有其他类型的角色，但通常，那不是他们首先想到的。他们想象自己成为团队的一员，帮助组织变得更安全，并向首席信息安全官\
  \ (`CISO`) 或其他领导者汇报。在这个世界里，有方法可以思考关注这些内部小组的工作，正如你将在后续章节中将学那样。\n\n### 技术安全：蓝队与红队\n\
  \n蓝队是组织的运营防御者。蓝队的角色包括事件响应人员以及针对终端、身份、应用开发、网络、云、司法取证、威胁情报等的安全工程师。蓝队的技术角色还包括审计和合规，或者包括治理和政策。蓝队的作用是创建保护组织所使用的人、技术和信息的方法。在寻找蓝队工作时，可以将\
  \ `security operations`、`security architecture`、`risk assessment` 或 `threat intelligence`\
  \ 作为起点。\n\n红队负责发现系统和流程的漏洞。他们可能会通过测试来利用这些漏洞，并帮助组织改进安全控制。渗透测试员、漏洞研究员、威胁猎人等构成了与蓝队合作的团队。在寻找红队工作时，请寻找\
  \ `pentesting`、`ethical hacking`、`reverse engineering` 和 `threat intelligence`。（我知道，威胁情报也属于蓝队的一侧。）\n\
  \n### 非技术安全\n\n在安全领域，没有人会完全远离技术，但有些角色的技能并不重点关注技术安全，而是更多关注人员/法律/业务流程。这些角色的存在是为了确保在管理时考虑到安全。这些角色包括安全分析师、安全合规官、运营风险经理、培训和意识分析师或安全业务分析师。通常，这些角色出现在治理、风险和合规\
  \ (`GRC`) 职能以及职位名称为“分析师”的入门级工作中。\n\n通常，这些角色的人将与安全框架合作——以理解监管要求并将其应用于公司内部政策和程序。他们直接或间接地与合规等法律领域接轨。他们与蓝队之间通常存在重叠，因此在某些公司，这些团队在组织上是分开的，而在另一些公司，它们被合并在了一个。\n\
  \n寻找 `governance, risk, and compliance (GRC)`、`security policy` 和 `information risk`\
  \ 等术语，对应安全领域中更非技术性的角色。\n\n### 相邻空间\n\n\n\n\n\n就像组织中的每个部门一样，安全工作必须与工作衔接的人员合作。安全人员高度依赖沟通和营销部门。安全人员还需要培训和意识部门员工的支持。项目和计划经理是不可或缺的。财务和人力资源支持对于直接与安全内部及内部工作至关重要。同样，在某些组织中，这些人全部属于同一个安全组织伞下；而在另一些组织中，它们是独立的职能。无论如何，整个安全团队都需要这些功能才能正常运行。\n\
  \n还有其他合作伙伴，其工作也会影响安全。企业风险管理、隐私、业务连续性管理、IT 运营、销售和营销都是独立于安全的职能，尽管它们对安全计划的成功至关重要。这些领导者出的决策将制定安全团队的战略和工作计划。在较大的公司中，这些小组的人员经常与安全团队直接联系。\n\
  \n## 安全产品公司\n\n除了在组织内部工作的安全团队外，还有生产安全工具和服务的公司。一些首席安全官（CISO）认为这些公司是他们红/蓝团队的延伸。在这些安全产品公司内部，组织中的每个人都在“从事安全工作”。产品设计或销售等角色是该安全生态系统不可或缺的一部分。当然，这些公司寻找具有深厚技术安全背景的人来生产和支持他们的产品以及公司，但他们也需要许多没有安全背景的人员。这些公司是你进入安全领域的绝佳场所，可以让你学习更多安全知识，而不一定从直接的安全防御或进攻经验开始。\n\
  \n## 如何理解这一切？\n\n在向招聘经理发送简历之前，请考虑以下章节中的信息。\n\n### 网站资源\n\n查看 [Cyberseek.org](http://cyberseek.org)\
  \ 和网络安全工作框架（NICE 框架）工作角色表（`https://niccs.us-cert.gov/nice-cybersecurity-workforce-framework-work-roles](https://niccs.us-cert.gov/nice-cybersecurity-workforce-framework-work-roles)`），以了解安全工作分类和技能要求。这些是试图将安全职业规范化的新资源。提醒一下：它们仍然处于进行中，但这是一个非常好的起点。\n\
  \n例如，[Cyberseek.org](http://cyberseek.org) 为求职者、雇主、教育工作者和学生提供资源。其目的是帮助了解存在哪些类型的工作和职业，以及这些工作需要什么样的技能。该网站根据当前发布的职位建立其路径，因此它可能无法为你提供长期的未来愿景。无论如何，这是一个做功课的好地方。\n\
  \n在美国，联邦政府创建了国家网络安全教育倡议（NICE）框架（`https://www.nist.gov/itl/applied-cybersecurity/nice](https://www.nist.gov/itl/applied-cybersecurity/nice)`）。该框架本身是一份很很厚的文档。（只有当你真的想深入钻研它时，我才会推荐你阅读。）然而，NICE\
  \ 网站上有许多总结资源，将帮助你了解工作角色类型和执行这些工作所需的技能。它非常侧重联邦政府，这意味着它没有探索私营部门安全公司的职位（如产品经理、营销或销售），但它一直在不断增加。\n\
  \n### 网络安全思维图\n\n思维导图是概念的可视化。网络安全思维图是构成网络安全的功能视觉化，通常以 CISO 组织形式或 CISO 必须涵盖的角色呈现。在互联网上搜索\
  \ `Cybersecurity Mindmap` 并查看图片。我喜欢 Rafeeq Rehman 在 [`rafeeqrehman.com/`](http://rafeeqrehman.com/)\
  \ 的作品。\n\n没有哪一个思维导图是绝对正确的，所以不要只看一个。相反，看几个以发现共同领域。例如，大多数安全思维导图包括“风险评估”、“治理、风险与合规”或“安全运营”等功能。在许多思维导图中，你会发现“培训和意识”、“渗透测试”或“审计”等功能。有时，渗透测试可以列在“运营”下，有时你会在“风险管理”下看到它。\n\
  \n在你查看这些内容时，考虑你自己的技能和兴趣，并记录任何对你有吸引力的领域。如果你看到新术语或你不熟悉的术语，请进行更多研究。\n\n### 你的技术经验\n\
  \n考虑你已经拥有的技术经验量。\n\n许多安全领域的求职者拥有“技术”背景。我的意思是，他们对计算机有所了解。也许他们知道某种编程语言、如何构建网络或如何运行自己的网站。这太棒了。有很多安全工作会利用这些技能。如果你有技术技能，这里就是开始的地方。\n\
  \n许多人完全没有那种背景。也许他们有项目管理技能。也许他们很擅长音乐、是过训练的老师，或者拥有法学位。安全领域也有适合他们的角色。\n\n> 你*不必非*具备技术背景才能在安全领域有一席之地。\n\
  \n治理、风险、合规、用户意识或访问管理等功能都适合没有深厚技术知识的人。喜欢改进流程、连接人与问题以及理解法律和法规事务的人知道心理学如何在做出风险决策中发挥作用。他们还知道，人类运作的所有因素在安全领域都是需要的。\n\
  \n> 如果要在安全领域工作，你*必须*熟悉技术并学习一些技术知识。\n\n如果你不熟悉技术且不习惯与技术人员合作，那么你来说寻找进入安全的路径并取得成功将会困难。熟悉技术意味着在使用计算机时很放松，并愿意在新技术出现时学习它。这意味着意味着愿意尝试新技术，并与技术人员讨论其运作原理。在高级阶段，这意味着理解技术的历史和未来、安全如何以及为何融入技术之中，以及通用的计算和安全原则。\n\
  \n### 你的通用业务经验\n\n考虑你已经拥有的通用业务经验量。也许你拥有其他可以帮助你转向安全领域的技能。一些安全相关的技能包括业务分析、培训、教育、心理学、项目管理或数据分析。\n\
  \n仅仅在任何行业、地点或领域拥有工作经验都可以成为你的起点。你曾在快餐行业卖过汉堡吗？联系餐饮行业的安全团队，推销你面对客户的经验。你曾为州政府运行过一些项目吗？与该组织或任何其他公共组织的安全团队交谈，推销你的项目管理和公共部门经验。利用你对这些行业的了解来学习他们所面临的安全问题。寻找你的业务技能与他们的安全问题重叠的地方。从那里开始。\n\
  \n\n\n\n\n学习安全的一个绝佳起点是与行业内的人交流，听听他们的故事。参加一些会议，比如当地的 BSides ([`www.securitybsides.com/w/page/12194156/FrontPage`](http://www.securitybsides.com/w/page/12194156/FrontPage))\
  \ 或 ISSA ([www.issa.org](http://www.issa.org)) 活动。你也可以参加当地的安全线下聚会，或者询问你的 LinkedIn\
  \ 或社交媒体联系人。他们做什么做什么？他们是如何学习这些技能的？他们认为哪里存在进入该领域的机会？你不需要请每个人买咖啡，但你确实需要努力通过线上或线下与他们联系。\n\
  \n许多安全从业者喜欢分享自己的经验，并乐于帮助新人加入行业。利用好社区资源。\n\n请注意，虽然与安全领袖交流他们的历程很棒，但要明白他们的经历与你完全不同。请确保你也找到一些安全领域的新人，或者职业生涯处于二至五年的人。他们能为你提供最最新、最相关的经验。这就是加入当地专业组织成员非常有帮助的地方。\n\
  \n## 接下来做什么？\n\n如果你还没有开始，现在是时候做一些研究了。查看招聘公告，并在互联网上搜索 `cybersecurity jobs` 和 `information\
  \ security jobs`。了解一下你所选地区提供哪些类型的工作。考虑你是否对蓝队、红队或相关工作感兴趣。与安全领域的人交流，无论是线上还是线下。提问。\n\
  \n\n\n## 我应该参加什么培训？\n\n进入安全领域没有正确的路径。对于某些人来说，进入安全领域是一系列幸运的意外，是在正确的时间出现在正确的地点，再加上一点努力。对于另一些人来说，他们有计划地去获取正确的技能，结识正确的人，并努力争取一份安全工作。对于大多数安全求职者来说，有计划的行动可能是更成功的路径。“幸运的意外”似乎不再像以前那样频繁。确实，每个人都需要付出努力，努力能让你走得远，而运气可能会带你走得更远。但如今，经理打电话要求你在工作中学习的情况变得少多了（虽然并非不可能，但概率较低）。拥有一个进入安全领域的计划可能是一个更好的选择。\n\
  \n许多安全求职者从评估自己现有知识和探索培训选项开始。安全领域有很多可供选择！\n\n*   你可以上大学获得安全学位（没有两个项目是完全相同的），但这不是必须的。\n\
  *   你可以参加训练营来学习安全技能。\n*   你可以先从事其他工作（通常是在 IT 领域，但不一定），并在横向转到安全职位之前，可能进行一些在职培训。\n\
  *   你可以成为高级领导者（通常在 IT 或风险领域），并将安全纳入你的工作组合中。\n*   你只是恰好认识某人。\n\n没有单一的路径可以遵循，所以我对求职者的建议是考虑你的起点在哪里。\n\
  \n## 针对传统型学生\n\n在某些方面（尤其是现在），这是一条更容易的路径。如果你想进入安全领域（或者认识对此感兴趣的人），有可以遵循的传统项目。\n\n\
  *   大多数（但不是所有）安全相关学科都始于技术，因此在初中/高中阶段，请追求那些能引导你进入计算机科学的课程，例如机器人、数学和计算机（当然如此）。然而，不要忘记写作和分析能力！你可以直接从那里进入初级\
  \ IT 职位，在积累了一些经验后转到安全领域。\n*   许多学院和大学提供信息/网络安全课程（包括两年制和四年制选项）。两年制选项更具实操性，通常附带行业证书。四年制大学的内容会更深、更广，通常包含实习机会。我强烈建议你尽可能找到选修非计算机科学选修课的方法。写作、心理学、数据分析、伦理和政策方面的技能在高级安全职位中起着巨大的作用，所以当你能找到这些课程时，要利用机会。\n\
  *   即使有学位，招聘经理也更青睐有工作经验的人，而有安全工作的经验会更好。所以，如果可能，在校期间寻找实习的机会。（通常，学校的安全团队会雇用学生，所以从那里开始吧。）如果你就读的学校能为实习提供学分，那将是额外的加分！\n\
  *   如果你在完成四年制课程后没有任何工作经验，我建议在考虑任何研究生学位课程之前先进入职场。现实是，大多数安全工作根本不需要四年制学位（至少，不应该需要！），而且初级职位显然不需要硕士学位。你还需要确保自己能将课堂的理论应用于职场的现实中。你会发现，那种被接受的“补丁所有漏洞”的理论在现实世界中从未发生过！\n\
  *   如果你已经有一个本科学位，你可能会询问获得硕士或其他研究生安全学位是否有益。我的答案是？这取决于你的本科专业是什么。如果你的本科已经是与计算相关的领域，如计算机科学、管理信息系统或计算机工程，你可能已经具备足够的资质获得一份初级职位。花时间去获得工作经验。另一方面，如果你的学位与计算无关，可能值得考虑研究生课程、证书或硕士课程。\n\
  \n## 针对非传统型学生\n\n非传统学生是指那些成年后回到学校学习的人。通常，他们要在兼职和照顾家庭的同时努力学习。这不是一条容易的路径，所以我建议寻找尽可能支持你生活方式的学习方法。\n\
  \n*   在这里，行业认证会有很大帮助。证书的好处是它们可以为你提供一条学习路线图。它们将向你展示学习某个安全主题所需的知识。无论你如何获得证书，学习这些材料本身就值得写在简历上。\n\
  *   无论是否能获得证书，训练营都可以作为获得所需技能的良好起点——前提你有时间参加。其中一些营跨越许多周的全职时间，不适合已经在工作的人，但如果你有时间，它们值得尝试。一些行业组织（如\
  \ [ISSA.org](http://issa.org)）设有当地分会，以非常合理的价格提供证书的兼职晚上培训。这些也是极佳的人脉拓展机会！\n*   如果你还没有本科学位，兼职/在线大学可能是实用的。如果你已经拥有其他领域的两年制或四年制学位，我不建议再读一个安全或计算机科学的本科学位。专业证书或研究生证书可能是更快、更廉价的选择。\n\
  \n## 针对全职非安全人员\n\n\n\n\n如果你已经在职但不在安全领域，并想转到安全岗位，我鼓励你从目前的公司开始（如果公司规模够大的话）。在不离开当前职位的情况下，寻找结识安全团队的方法——如果可以，就与他们合作。向他们请教他们所需的技能以及他们正寻求填补的职位。你可能已经具备项目管理、IT\
  \ 支持或风险管理技能。增加少量的安全知识，可能会让你在下一次机会出现时顺利转入该团队。\n\n如果你就的公司没有安全团队（或者该安全团队不是你想加入的），请利用你拓展人脉的能力（下文将介绍）来寻找其他选择。\n\
  \n考虑参加自学型的培训课程。目前有许多选择，例如 YouTube、LinkedIn Learning 等，以及各种书籍。这是一种根据自己的时间表进行学习的绝佳方式，但我鼓励你与导师合作，以确定对于你追求的工作类型来说，什么样的培训是值得的。\n\
  \n## 其他需要考虑的事项\n\n无论你是哪种学生，或者你有多少时间投入，都有在教室之外学习安全知识的方法。以下项目可以帮助你在安全职业的道路上完善你的学习。\n\
  \n### 认证\n\n关于安全认证的真相是：你很少需要它们来做安全工作，但你可能在`最初`获得安全工作时需要它们。认证可以让你通过招聘筛选，并可能让你从类似的候选中脱颖而出。\n\
  \n> 拥有认证或学位向潜在雇主表明，你对该职业足够感兴趣，以至于投入时间和资源来进一步了解它。这并不意味着你具备了从事工作本身的技能。\n\n某些认证非常通用（`CISSP`、`CISA`、`CompTIA+`\
  \ 等），有些则非常具体（云认证、道德黑客攻击等）。根据你想入职的角色来选择认证，并查看该职位的招聘公告，看看他们要求哪些认证/技能。\n\n许多认证要求你通过考试并在相关领域拥有多年工作经验。别担心！如果你只是刚起步，学习材料并通过考试对你的简历和整体学习曲线都是非常有益。在简历上注明你正在争取某项认证是可以的，即使你还没有获得那张证书所需的工作经验。正如下表所示，从初级求职者到资深人士，每个人都有相应的认证：\n\
  \n**认证**\n\n| 类型 | 成本 | 适用对象 |\n| --- | --- | --- |\n| **初级** | | |\n| CompTIA:\
  \ Security+, `A+`, `Linux+` | $ | 基础安全概念。美国联邦政府用于合同工作。事件响应分析师和通用风险分析师使用这些。 |\n|\
  \ Cisco CCNA: 网络管理 | $ | 基础网络安全。 |\n| **行业认证** | | |\n| ISACA: 安全审计 (`CISA`)；安全管理\
  \ (`CISM`) | $$ | 审计和通用安全管理。 |\n| ISC2: 安全专家 (`CISSP`) | $$ | 任何蓝队/红队角色的行业标准。 |\n\
  | **技术认证** | | |\n| SANS: 安全基础 (`GSEC`)；渗透测试与道德黑客 (`GPEN`)；应用渗透测试 (`GWAPT`) | $$$\
  \ 技术上受认可。适合 SOC 分析师、渗透测试、道德黑客。 |\n| Offensive Security (`OSCP`) | $$$ | 渗透测试。 |\n\
  | CREST: 恶意软件反向工程 (`CMRE`) | $$ | 恶意软件分析师。 |\n| 云安全联盟 (`CCSK`) | $ | 云安全。 |\n\n\
  ### 人脉拓展\n\n无论你从哪里开始，都不要低估人脉拓展的价值！如果你是传统的学生，可以从从事安全事务的学生组织开始，例如安全社团、女性安全组织（women\
  \ in security）和夺旗赛（CTF）。如果你的学校没有，就自己创办一个，并把它写在简历上。对于任何寻求安全工作的人，请参加当地的安全会议或专业小组。结识组织和招聘经理将让你尽早获得职位空缺预警，并往往能让你跳过招聘障碍。不要害羞让人们知道你正在寻找安全工作，并明确说明你想找哪种类型的安全工作。这需要时间和精力，但完全值得。\n\
  \n### 职业影子\n\n有些人会花时间进行“职业影子”（job shadowing）。职业影子可以是学习更多关于安全人员“一天的生活”是怎样的以及深入了解特定类型安全工作的好方法。如果你时间有限，我建议你不要花时间做这件事。跟随别人很难学到很多东西，因为需要时间来理解组织背景。由于保密性，你观察的对象通常无法分享有意义的信息。此外，被观察的人往往是较浅的员工，他们还不知道如何交流自己的角色。此外，你最终可能观察的是一位高级领导，他们做的事情你可能不会做（至少短期内不会）。\n\
  \n话虽如此，职业影子最大的处处正如你猜的那样，是人脉拓展。这是一个他们了解你的机会，并在职位空缺时让你成为他们的首选。我可以想到更高效的人脉拓展方式，但如果你有时间的话，可以考虑职业影子。\n\
  \n### 培训类型\n\n安全培训市场正在增长和变化。有些公司与大学和训练营合作，专门为自己的公司创建安全课程，并付员工参加。一些大公司正在创建自己的安全证书，并将以此代替四年制学位。像\
  \ `ISSA` 这样的专业组织合作向成员提供低成本的培训和训练营。你现在可以参加各种培训，因此找到最适合你情况的那种。下表显示了各种培训的优缺点：\n\n**培训类型**\n\
  \n| 类型 | 优点 | 缺点 |\n| --- | --- | --- |\n| 训练营 | 时间跨度短；技术新；与招聘经理联系 | 就投入的时间来说可能昂贵；可能不被招聘经理认可。\
  \ |\n| 两制学位 | 侧重实用技能；通常与行业认证相关；学费较便宜 | 对某些招聘经理来说可能不够。 |\n| 四制学位 | 更深层次的技术学习；完成时间长，特别是对于兼职学生\
  \ | 很难跟上新兴技术；可能过于侧重理论而牺牲了实践经验。 |\n| 自学培训 | 最快的选择；廉价/免费；适应忙碌的生活 | 可能不被招聘经理认可；可能不是针对目标工作的。\
  \ |\n| 实习 | 招聘经理非常看重实践经验；有利于拓展人脉 | 益处很大程度上取决于项目的质量。 |\n\n## 接下来做什么？\n\n*   评估你在安全方面的正式学习情况。如果没有，请考虑你的选择。\n\
  \n\n\n\n\n*   如果你在读大学但没有修读安全专业或辅修，请咨询你的导师，了解哪些课程涉及安全/风险概念的课程。\n*   在你当地寻找本地网络小组并与他们建立联系。建立联系后，在小组内找人面谈并询问他们的工作内容。\n\
  *   如果你在一家有安全团队的公司，请负责人与你会面。询问是否可以进行一天的影子学习（job shadow）。\n*   调查并报名适合你预算和生活方式的安全培训/认证课程。\n\
  \nWileyPRE\n\n# 第 5 章：我应该具备哪些技能？\n\n追求安全知识并将这些知识转化为安全技能，是组织任何层级每个安全角色的部分。在第一次寻找安全工作时，了解需要哪些技能以及学习这些技能的顺序非常重要。\n\
  \n许多安全领导者看重那些先具备通用技术或业务背景，然后再转入安全领域的候选人。许多招聘经理认为，安全本质上`不是`一个入门级职位。相反，这些招聘经理认为，成为分析师或工程师需要安全职能之外的通用技术能力和业务经验。随着越来越多的学校提供安全学位和证书，这种情况可能会发生变化。无论如何，找到一个花过时间建立网络、编写代码或在帮助台工作过的候选人，远比直接聘用没有这些背景的学校毕业生要优得多。\n\
  \n> 无论你从哪里开始，你永远不会停止磨练你的安全技能或学习新的通用技能。\n\n随着你职业的进步，培训的类型也会发生变化。你可能从学习基础安全概念并将其应用于基础安全任务开始。你可能会继续深入学习安全的某个方面的知识，成为该领域的领域专家（SME）。你可以扩展到相关的安全职能和技能，利用你已经学到的知识走一条略有不同的路径。以后，你可能会管理一个团队，这将要求你花更多时间磨炼通的管理技能，例如团队领导力、组织设计、预算等，即使你仍在学习新的安全工具和战术。作为领导者，你可能需要提高你的沟通、影响力和策略能力。\n\
  \n许多人最初是因为他们认识的人或看到的事物而被这个职业所吸引。他们可能被成为安全分析师的想法吸引，作为漏洞赏金项目的一部分发现技术漏洞。（漏洞赏金平台为公司提供了一种与发现公司软件漏洞[并获得补偿]的分析师进行互动的方式。）他们可能被某部电视节目吸引，片中有人无缝地穿越公共数据库寻找罪犯。也许他们曾与安全领域的人共事过，钦佩他们的工作，并认为这是一个很好的职业选择。或者，他们只是在各种调查中注意到安全工程师的薪水，认为这可能是通往更高生活水平的垫石。\n\
  \n无论最初的吸引力是什么，一旦人们开始研究安全行业，他们几乎会对有这么多种角色感到惊讶。他们可能一直认为安全是其他技术部分（应用程序、服务器或网络）中的某一个技术支柱，并惊讶地发现安全还有许多其他部分（分析师、工程师、治理、销售、法律、意识、政策等）。\n\
  \n所有这些选择可能让人感到无从从。从哪里开始？该如何进行？\n\n## 入口点——技术\n\n大多数安全职位假设你曾在技术领域工作过。曾几何时，人们倾向于基础设施技能，特别是网络技能。现在，偏好似乎是软件和集成。无论你从技术栈的底部还是顶部开始，安全在其核心仍然是一项技术职能。图\
  \ 5.1 显示了 OSI 技术栈各层之间如何相互关联。考虑你是否对这些层中的任何层非常熟悉，并考虑关注这些技术部分的安全角色。\n\n### 什么样的技术技能？\n\
  \n这个问题没有标准答案。回到你的价值观和优势。从历史上看，最常见的安全技术技能始于关注技术栈（网络、系统管理或编码）。如果你打算防御或攻击它，了解技术底层的“水路”是如何运作的是重要的。\n\
  \n随着职业的扩展，我们关注的硬件和技术也在增长。像云（基础设施、平台和应用程序）等项目是较新的，但将一直存在下去。物联网（IoT）正在爆发式增长，那么我们如何保护所有连接到互联网的设备？运营技术（OT）安全是安全的一个子集，侧于保护关键基础设施系统（水利、电力等），是保护国家安全的关键。随着国家级网络攻击持续增长，在\
  \ OT 安全领域工作将会是怎样的？\n\n![图 5.1 OSI 技术栈模型](img/c05f001.png)\n\n**图 5.1** OSI 技术栈模型\n\
  \n许多从大学毕业的学生专注于应用安全。虽然应用安全涉及编码，但它也涉及系统集成、逆向工程和通用黑客技术。我建议某种程度的编码对于大多数安全职业都是至关重要的。如果你想在安全领域拥有长远职业，那么能够构建网站或工具，并能够处理你无疑会遇到的海量数据对你来说非常重要。拥有这些技能对于求职者来说是一个巨大的优势。关于选择什么种类型的编程语言存在争议（`Python`?\
  \ `C++`? `HTML`? 其他？）。再次，请查看你正在寻找的工作类型，看看需要什么样的语言，或者与安全团队交流获取他们的意见。\n\n如果你选择深耕技术安全职业，请考虑获取实验室的权限或创建一个家庭实验室，你可以在那里安全地尝试这些技术。在互联网上搜索\
  \ `home security lab` 可以找到各种选择，从基于笔记本电脑的实验室到全服务器设置。也许你可以在云端创建。成本和时间将是因素。利用你的实验室来学习\
  \ `Active Directory`、运行 `DNS` 和 `DHCP`、网络区域、防火墙、`Kali Linux` 以及各种操作系统。\n\n技术技能也可以表现为治理、风险和合规（GRC）。这是关于利用技术知识为组织创建并应用框架、法规和监督。它可能包括审计和其他评估职能。有时，人们也将安全架构纳入\
  \ GRC 领域。GRC 领域的人倾向于从了解一两项技术开始，并学习如何将这些技术应用于业务流程和其他非技术学科。\n\n要了解所有技术是不可能的。做你喜欢做的事。现在那里有很多热门工作——云安全、`IoT`、数据分析、人工智能等——但任何技术都可以作为起点，这些技能将帮助你以后转岗到许多安全角色中。查阅这些书籍：\n\
  \n*   *The Pentester Blueprint: Starting a Career as an Ethical Hacker* by Phillip\
  \ L. Wylie and Kim Crawley\n*   *Confident Cyber Security: How To Get Started in\
  \ Cyber Security and Future Proof Your Career* by Dr. Jessica Barker.\n\n此外，查看这些博客：\n\
  \n\n\n\n\n* Leslie Carhart, [开启信息安全职业 ([`tisiphone.net/2015/10/12/starting-an-infosec-career-the-megamix-chapters-1-3/`](https://tisiphone.net/2015/10/12/starting-an-infosec-career-the-megamix-chapters-1-3/))\n\
  * Daniel Miessler, [如何构建网络安全职业 ([`danielmiessler.com/blog/build-successful-infosec-career/`](https://danielmiessler.com/blog/build-successful-infosec-career/))\n\
  \n无论你关注哪个领域，我都建议你在该领域至少专注于几年。（这同时也取决于你所处的行业。在初创公司工作两年是一段很长的时间，但在金融服务业并不长长。）想要了解所有技术层的所有知识是不可能的。对技术层及其相互关系有通用的理解，结合对某一类技术至少几年的专注，将为几乎任何安全工作提供坚实的基础。这就是为什么许多人从传统的\
  \ IT 领域（网络、帮助台或应用开发）开始，然后转入安全职能。如果你还没有进入技术领域，可以考虑将这种变动作为潜在的第一步。\n\n## 职业技能\n\n在你努力提升技术技能的同时，你还需要什么？对于这一点，请远离职位描述。那些要求（通常）是非常模糊的，以至于毫无意义，例如出色的沟通能力、很强的组织能力和团队合作精神。安全领导者会告诉你，他们可以教你技术技能，但教授“软技能”需要花费大量的精力。有趣的是，大多数职位描述都关注于技术，而不是“软技能”。\n\
  \n成为一名能够良好沟通、能够跨组织边界进行协作或能够根据强有力的分析做出艰难决策的员工，这其中一点都不“软”。相反，请称它们为`专业技能`。这是成为安全专业人士的必备要求，我从未遇到过任何缺乏专业技能的成功安全领域人士。我遇到过许多缺乏专业技能且在安全方面表现糟糕的技术天才。就像技术技能一样，你永远不会停止改进自己的专业技能。作为一个在安全领域寻找第一份工作的人，你需要找到方法向招聘人员和招聘经理展示你的专业技能是什么。此外，你应该知道，我们都在边学边做。在图\
  \ 5.2 中，你可以看到一位同事是如何改进她的专业技能以及她考虑的因素。\n\n在你努力建立自己的技术组合的同时，也要努力以下章节中讨论的技能。\n\n###\
  \ 沟通技能\n\n沟通技能分为两类：写作和演讲。\n\n![图 5.2 技能策略思维图](img/c05f002.png)\n\n**图 5.2** 技能策略思维图\n\
  \n在开始时，当我们谈论安全写作技能时，指的是技术写作。后来，它也意味着“能够写作以便让非技术高管也能理解我们的信息”。长篇大论、辞藻华丽并不如简洁明了重要。在安全领域，清晰、简洁地传达观点至关重要。预见问题、控制情绪、引导他人，这些都是必要的。演讲技能涉及与人的互动。\n\
  \n> 清晰有力地传达观点是很多技能\n\n### 情感智能\n\n我曾听过老板对我说：“你可能是对的，但你并不高效。”这段指导让我很刺痛，但它是我从一个平庸的经理变为安全领导者的关键反馈。我花了很多精力学习如何变得高效，而不仅仅是正确。当你遇到低情感智能（EI）的人时（也称为情商，EQ），你就能看出来。低\
  \ EI 人会制造不必要的麻烦，引起许多误解，并被认为固执或自大。他们完成工作需要更长时间，而且别人不喜欢与他们合作。确保你不是这样的人！讽刺的是，低 EI 的人不知道自己的\
  \ EI 低，而且通常认为自己的 EI 高。\n\n情感智能（EI）不是那种可以直接写在简历上的东西。你的 EI 会在其他人愿意担任你的推荐人时（例如在 LinkedIn\
  \ 上提供证言）、你按时交付项目或你成为他人的导师时表现出来。如果你必须明确说明你拥有情感智能，那么你可能并没有。考虑阅读丹尼尔·戈尔曼的《情感智能》以了解更多。在戈尔曼的书中，他了情感智能的五个特征，如下表所示：\n\
  \n**戈尔曼的情感智能**\n\n| 要素 | 描述 |\n| --- | --- |\n| 情感自我意识 | 了解自己的感受以及这些感受对他人的影响 |\n\
  | --- | --- |\n| 自我调节 | 预判、控制和引导情绪 |\n| 动力 | 利用情绪来实现目标 |\n| 同理心 | 感知他人的情绪 |\n| 社交技巧\
  \ | 关系管理和激励他人 |\n\n### 有效倾听\n\n\n\n\n\n要拥有情商、进行有效沟通并建立强大的伙伴关系，你必须熟练进行有效的倾听。\n\n\
  > 你必须学会倾听他人的，以了解他们明确表达和未表达的需求以及动机，然后对其进行反馈。\n\n了解你自己的触发点：什么让你兴奋，什么让你感到压力，以及当这些情况发生时你的行为如何。你需要知道何时该推进，何时该后退。有很多资源可以帮助你，从与家人、团队成员和其他人的交流开始。问他们对你的观察。考虑阅读由\
  \ Patterson、Grenny、McMillan 和 Switzler 编写的 *Crucial Conversations: Tools for Talking\
  \ When The Stakes Are High*（关键对话：高风险下的沟通工具）。准备好大方接受他们的反馈。这将是非常值得的。\n\n## 伙伴关系\n\n\
  与情商相关，伙伴关系也是必须学习的技能。招聘经理称之为“团队合作”，但它不仅仅是与直接团队的其他成员相处。它还是一种跨越和超越整个组织的能力，以实现一个人无法完成的目标。这关乎有意图地与关键伙伴建立个人关系，以便在困难的对话中拥有相互信任。这是花时间与人们见面仅仅为了更多地了解他们是谁，而不带任何交易利益的预期。\n\
  \n如果你是一个出色的伙伴，你的效率比那些仅仅“尽本职守”的人要高得多。你会寻找改进跨多个团队流程的方法。你会花时间理解为什么其他人和其他团队要以特定的方式做事情。你尝试从他们的角度看世界，而不仅仅是自己的角度。相反，伙伴关系技能极差的人会损害整个团队，并且花费的情感/管理精力超过了他们提供的价值。这些人是没人愿意一起工作的人，其他人会积极尝试避开他们，而且没有人信任他们。\n\
  \n再次，LinkedIn 上的评价或招聘推荐人是展示你伙伴关系技能的好方法。推荐人也有用。\n\n## 主动性\n\n安全领域的事情一直在变化。在你的职业生涯中，永远不会有一个时刻是你掌握了所有需要知道的，或者你完成了所有需要做的事。招聘经理希望你是一个自发型的人。他们希望你将不断挑战自己去学习新事物，从技术技能到更多地了解业务运作。这些可能是与你的工作相关的内容，也可能是“仅仅因为你可以”而学习的新新事物。他们期望即使你是一个初级员工，也会寻找改进你的工作方式、组织运作方式以及改进组织安全概况的方法。\n\
  \n你如何在简历或面试中表现主动性？明确列出你主动采取某项行动的工作或活动。使用动词。例如，说“参加了训练营”、“在会议上做了演讲”或“自学了这项安全技能”，都能向招聘经理表明，他们不需要催促你去承担新的技能或任务。\n\
  \n当你申请安全工作时，你极可能没有招聘经理正在寻找的所有技能。（而且即使你拥有，你真的想要那份工作吗？）寻找一家你想工作的公司，拥有你希望拥有的工作条件，在那里儿你拥有他们需要的某些技能，并且你可以在那里获得成长。然后从那里开始。\n\
  \n## 接下来做什么？\n\n- 查看一些你感兴趣的种类型安全工作的招聘公告。注意他们要求的技能类型或可选技能。（同时也查看一下“资源”附录。）记录下常见的技能/特质。\n\
  - 练习向他人展示安全想法。获取反馈，并将建设性批评像礼物一样收下。\n- 与你的同事或认识你的人交谈，请他们分享他们认为你的个人优势和机会是什么。鼓励他们完全诚实。\n\
  - 进行个人技能清单。记录你的技术和社交/情感优势。记录你缺失的（与你查看的招聘公告相比）或薄弱的技能。\n- 考虑你的优势是否与你想要的安全工作类型相符。如果是，太棒了！如果不是，你可以选择学习你需要的技能，或考虑不同的安全职业路径。\n\
  \nWileyPRE\n\n# 第 6 章 我的简历还可以吗？\n\n一一旦你确定了你想从事什么样的角色、所需的技能和经验，以及你想申请哪里，你就必须创建一个简历。简历需要足够具体，以通过计算机招聘算法的筛选，这些算法会过滤掉缺乏匹配技能的候选人。它需要足够的创意，以在招聘人员和招聘经理筛选大量相似的候选人时引起他们的注意。它需要展示你所有的技能和经验，而不会夸大或低估你的资质。最后，它需要让招聘经理对你是谁有个概念。难怪求职者在写简历时感到压力！\n\
  \n许多新求职者认为简历像学校的成绩单。它显示了你已经做的工作和已经学过的技能。人们知道自己并没有具备招聘经理要求的所有技能，因此他们苦苦于不知道自己是否包含了正确的内容。求职者可能不会撒谎，但他们会在措辞上尽可能发挥创意，试图给招聘经理留下印象。结果是，初级简历倾向于自我中心和使用过去式。我做了什么？我学了什么？我是如何进步的？我对什么感兴趣？我想要什么？如果你认为简历的存在是为了帮助经理了解你，那么你就让简历完全变成了关于你做过的事情。\n\
  \n> 揭示你的潜力，而不仅仅是你的历史。\n\n随着你职业生涯的发展，你会意识到简历不应该仅仅是对你历史的回顾。它还应该是通向你未来的指南。一份好的简历不仅说“这是我做过的”，它还说“这是我*可以*做到的”。所以，创建你的简历来谈论你，并谈论你对他人和公司产生的影响。与其说“参与了某实习”，不如关注你如何帮助公司，例如说“参与了\
  \ XY 项目，结果是为 X 千名员工提供了增强的安全意识培训”。突出显示你所做的自学学习、你撰写的技术论文，以及这些努力的“意义何（so what）”。如果你更有经验一点，谈谈你指导过的人以及你向安全社区做过的演讲。\n\
  \n简历是复杂的东西。对于初级人员来说，简历的挑战在于你没有很多技能和经验。你正试图创造性地包含非专业的内容，以发出你想成为哪种员工的信号（但还没有）。随着你在职场中待的时间越长，挑战变成了决定包含什么（或不包含什么），并确保你的简历是准确的，并反映了你做过的和你想做的。\n\
  \n一份好的简历是简洁地给出个人背景并揭示他们的“为什么”的简历。当它与广告中的职位联系起来，显示出对行业和职位类型的认知，最重要的是给出一个关于候选人是谁的感受时，它是极佳的。\n\
  \n一份糟糕的简历是看起来编写时没有考虑到广告的职位或招聘公司。如果它表现出缺乏关注或不注意细节，就很糟糕。如果它没有结构、没有计划且没有目标，那就真的是非常糟糕了。\n\
  \n\n\n\n\n人们经常忽略了一点：简历的目的是让招聘经理和招聘人员更容易识别潜在候选人，并更快地从招聘池中筛选掉可能不太合适的人。换句话说，简历不是为了你（候选人）的，而是为了招聘经理的。那么，如果你甚至不知道招聘经理是谁，也不知道他们具体在寻找什么，该如何写出一份有意义的简历呢？\n\
  \n无论你是刚起还是正在考虑下一个职业规划，在准备安全简历时都有一些需要考虑的常见事项，你将在接下来的章节中看到。\n\n## 将简历与职位发布挂钩\n\n有些人拥有一份标准简历，用于所有的职位招聘。他们将所有的个性化定制留给求职信。这种策略错过了从其他候选人中脱颖出的机会。\n\
  \n> 准备一份“标准”简历，但要确保针对每份职位申请进行调整。这表明你不仅关注这份工作，还关注公司本身，这对你的简历在众多中脱颖而出非常有帮助。\n\n写出一份优秀的简历意味着对公司、招聘经理、行业以及职位本身做功课。\n\
  \n*   这家公司属于什么行业？它是一个高度监管的行业吗？是一个新兴行业吗？该行业是成熟的还是在挣扎？你为什么想在这个类行业工作？\n*   公司的使命是什么？他们关心什么？利润？社区？创新？你为什么想在这样的公司工作？\n\
  *   招聘经理是谁？他们的背景是什么？他们是技术人员还是合规官？首次任职吗？正在组建新团队？还是在运行一个长期存在的团队？你为什么想为这位经理工作？\n* \
  \  职位是什么？它是公司里的众多职位之一吗？它是公司的新设职位吗？上任该职位的人还在那里吗？（也许他们就是招聘经理，正在招聘接班的人。）你为什么要申请这个职位？\n\
  \n你可能无法获得所有这些问题的答案，但在写简历和求职信之前，你应该尝试尽可能获取答案。你正在试图确定公司和招聘经理看重什么。网络搜索是获取这些信息的绝佳方法。建立人脉以及与目标公司的人交流总是有用的。如果你知道了答案，就可以判断这个职位是否适合你。你首先可以确定它是否值得追求。如果你认为值得追求，那么这些信息就可以用于调整你的简历，以符合他们的价值观。它能让你知道应该把哪些技能放在页面顶部，哪些技能列在后面（如果需要列的话）。它帮助你知道应该包含哪些关键词（不仅是为了简历筛选，也是为了那些阅读你简历的人）。\n\
  \n有时你只是在尝试寻找任何职位，并且玩的是一场数字游戏。你投出的简历越多，获得工作（任何工作）的机会就越大。特别是在起步阶段，对于常见的初级职位，这是可以接受的。这可能就是你唯一有时间做的事情。在这种情况下，你是在寻求创建一个基于职位的通用型简历。例如，如果你在寻找一个初级\
  \ `SOC analyst` 职位，你只需要将你的经验针对通用的 `SOC analyst` 职位即可，而不必叠加经理/公司/行业的元素。你希望自己能击中足够的通用点以获得面试。一旦你获得了面试，你就可以花时间进行背景研究。这是一个非常好的策略；只需知道你需要发送大量的简历才能获得面试，所以要对这种结果做好准备。\n\
  \n## 简历的要素\n\n当招聘经理拿起简历时，他们期望看到一些标准的章节和信息，所以请准备好将它们提供给他们。具体的顺序和细节将根据你以及你申请的职位而异，但最终，大多数简历都包含相同类型的细节。\n\
  \n### 页眉和总结\n\n你可能认为这很简单：姓名、地址等等。很好，这是一份安全简历，所以请想想一下。名字？可以。地址？不要。不要包含完整的物理地址，因为这与工作无关，而且它可能成为立即淘汰的依据。如果你真的觉得需要分享位置，也许提供城市和州名是可以的。包含电子邮箱地址和电话号码。（请注意邮箱名称的妥当性；保持平实且无聊！）如果你有意向，也可以包含指向\
  \ `LinkedIn` 或个人网站的链接。\n\n有些人喜欢包含一段总结陈述（summary statement）。我喜欢读总结陈述——因为这真的是简历上唯一一个你可以直率说明你为什么要申请这份工作的地方。确保你的总结陈述与你申请的职位和公司保持一致。否则，你会立即让自己从候选人池中排除。让总结涵盖你*现在*正在追求的工作；它应该涵盖你的抱负职业目标。再次记住，你是为招聘经理写这些内容的，而不是为你自己。帮助他们了解为什么你现在是担任这份工作的合适人选。\n\
  \n### 工作经验\n\n安全招聘经理倾向于看重经验而非正式教育，所以先从工作经验开始。如果你有一份连续的时间顺序工作历史，使用传统的简历格式（按倒序排列，即最近的工作在前）列出你的工作，那是非常棒的。如果你没有连续的工作历史，列出工作而不详细说明具体的时间顺序也是可行的。如果你是第一次进入职场的学生，这是会被预见并被接受的。如果你已经在职场工作几年且没有提供时间顺序视图，请准备好在求职信和面试中解释这个问题。\n\
  \n在简历上列出工作的一点点是：头衔是没有意义的。一个 `security analyst` 可能意味着成千上万不同的事情，`security engineer`\
  \ 也是如此。更有针对性的头衔如 `vulnerability engineer`，其含义取决于特定公司如何进行 `vulnerability management`（漏洞管理）。因此，当你列出工作历史时，你必须提供背景信息，而不仅仅是公司/头衔/日期。描述你在那个职位上做了什么，使用了哪些技能/技术，如何帮助业务的，以及你掌握了哪些技能。使用动词（动作词汇）来描述你的工作。例如，说\
  \ `managed 20,000 endpoints`（管理了 20,000 个终端）、`analyzed third-party applications`（分析了第三方应用程序）或\
  \ `executed 50 penetration tests`（执行了 50 次渗透测试）。\n\n不要忘记包含你工作的成果——即“又如何”。说你 `managed\
  \ 20,000 endpoints` 是好的，但如果你能展示为什么这很好或有用，会更好。例如，你可以说 `managed 20,000 endpoints and\
  \ remediated 150,000 vulnerabilities in 3 months`（在 3 个月内管理了 2 万个终端并修复了 15 万个漏洞）或\
  \ `reduced high-risk vulnerabilities by 20 percent`（将高风险漏洞减少了 20%）。\n\n### 技能\n\n\
  我倾向于将技能整合到工作经验部分，因为它有助于讲述“我做了什么，以及我学到了什么”的故事。有些人喜欢将技能放在单独的章节中。无论哪种方式，确保你列出的技能与你寻求的职位联系起来。将最相关的技能放在列表顶部，以便招聘经理注意到。关注职位发布中的任何\
  \ `required skills`（必选技能）。即使它们不是你最长的技能也要这样做。让招聘经理注意到你拥有他们需要的东西。接下来添加任何 `preferred\
  \ skills`（优选技能），然后添加其他安全或互补技能来完善你的背景。\n\n\n\n\n如果你打算列出技术技能，请务必不要夸大或低估自己。如果你从事某项工作不到两年就自称`expert`（专家），那你就是在撒谎。如果你已经在该领域工作了五年，还说自己正在`learning`（学习），那你要么是太谦虚，要么是学习能力有问题。请保持准确！\n\
  \n当你考虑到技能时，很容易只想到技术而忽略了软技能。招聘经理正在寻找那些文笔良好、善于演讲并且是优秀团队合作者的人。不要在简历中忽视这些技能。以下是一些示例：\n\
  \n- 与团队合作管理了第三方评估，使风险所有权降低了 30%；并向高级领导层展示了应用策略并获得了批准\n- 为访问管理团队识别了流程改进方案，节省了 20%\
  \ 的时间\n\n有些人担心如果自己没有职位描述中列出的所有技能，只有在符合所有条件时才申请。虽然你希望具备某些技能，但如果你没有具备全部，也不要有压力。大多数招聘经理不会花大量时间让职位描述与最终要完成的工作完全匹配。相反，他们列出技能是为了确保你处于大致范围内，所以如果你拥有\
  \ 60% 的技能并想要这份工作，尽管申请吧。\n\n### 教育背景\n\n作为一名招聘经理，我在教育部分看的第一件事是日期。日期告诉候选人最近何时参加过培训，以及该候选人是否持续对自我投资，因此不要把教育仅仅视为正式教育。当然，你应该包含你所获得的任何学位，但也应该包括专业培训、训练营、自学、专业证书以及参加会议的经历。\n\
  \n大多数招聘经理不会关心你的 GPA 或分数。唯一的例外可能是没有工作经验的大学生，因此请倾向于不包含你的 GPA 或分数。尽管如此，如果你想炫耀荣誉称号或`cum\
  \ laude`（优等毕业），尽管去写。不要对认证含糊其。如果你有一个证书且处于有效期内，那太好了！如果你已经参加了认证考试但尚未获得证书，请明确说明（例如，`已完成\
  \ XYZ 认证的课程`）。如果你以前拥有过证书但已过期，也要这样说。我见过不只一个员工因为在简历上证书或教育状况撒谎而被解雇。不要成为那种。\n\n### 课外活动\n\
  \n你的“爱好”是帮助招聘经理找到理由仔细评估你候选身份的绝佳方式。招聘经理将寻找证据，证明你对安全本身就感兴趣，特别是如果这是你的安全相关工作，无论你申请的是初级职位还是从其他学科转入同级职位。当你整合简历和求职信时，不要忘记提到你做的可能显示你兴趣的业外活动，例如：\n\
  \n- 加入网络安全俱乐部或专业组织\n- 如果你有一个经常玩玩的 `Kali/Linux` 服务器\n- 参加 `CTF`（夺旗赛）活动或其他培训\n- 参加安全会议\n\
  \n还有其他不那么明显的爱好会在安全招聘经理面前脱颖而出。对谜题和棋盘游戏的兴趣、开锁、无线电操作、参加密逃室活动，以及任何与应急管理或灾害响应相关的内容，都是安全社区看重的思维方式的指标。\n\
  \n获得一份安全工作需要的不仅仅是专业教育或证书，所以请确保展示出你的兴趣。\n\n### 关键词和获得关注的方法\n\n你的简历必须帮助你获得关注以获得面试。如果你没有获得面试，问题可能出在你的简历上。\n\
  \n时候，招聘经理并不是第一个看到你的简历或选择你参加面试的人。通常是一个对安全领域一无所知的招聘人员（或算法）。你必须对你的用词谨慎，并确保你的简历包含了会被招聘人员和算法注意到的关键词。这就是专门将你的简历与你所寻求的工作联系起来的地方。查看职位描述，并确保你的简历具有相同的词汇（尽可能完全一致）。例如，如果他们寻找的是`project\
  \ manager`（项目经理），就不要在简历中写`managing projects`（管理项目）。找个方法把`project manager`放在那里。如果公司重视`customer\
  \ experience`（客户体验），就尝试找办法将`customer experience`放入你的简历中。\n\n关键词在检查证书时特别有用。如果你学习过某项证书，即使你尚未通过考试或证书已过期，也要确保将其包含在简历中，以便关键词匹配能找到你。\n\
  \n对于我们的退伍军或政府背景的朋友：如果你有安全审查，即使是过期的审查，也请将其列在简历上。即使工作不需要安全审查，它也是安全团队梦寐以求的特征，并将受到招聘经理的积极评价。\n\
  \n一旦你创建了简历，请某人（最好是安全经理）给你提供反馈。他们可以帮助你完善，将聚光灯聚焦在相关的技能和经验上。当你请求某人查看你的简历时，请确保也将你申请的职位描述发给他们。这将帮助他们帮你让简历具有相关性。\n\
  \n## 数字形象\n\n就像艺术家整理作品集一样，安全专业人士也可以整理一个可以供招聘经理审查的数字作品集。\n\n- 从 LinkedIn 页面开始。除了详细说明工作经验，它还可以展示你与专业组织的关系。此外，它还可以展示关于安全问题的专题帖子以及你是如何与安全社区建立的。如果你打算拥有\
  \ LinkedIn 页面，请确保你在上面保持活跃。这并不意味着你必须写自己的帖子（尽管那样更好！）。然而，阅读其他帖子并评论或点赞显示了你在安全社区中的活跃参与。\n\
  - 如果你从事软件开发，包含 `GitHub` 仓库可以你的你的技能。\n- 考虑写博客。即使是安全新手，维护博客也可以向潜在雇主证明你对安全感兴趣，正在学习安全课题，最重要的是，你懂得写作！\n\
  - 个人网站也是件好事。一个展示你一直在工作的内容（当然要维护你所帮助公司的机密性）、你上过的课程、获得的证书等的简单网站，对招聘经理来说是有用的。\n\n\n\
  \n\n\n你不需要在简历中列出推荐人！以前习惯把他们包含进去，或者至少注明“可应要求提供推荐人”。如今，已没有必要包含这些内容。简历上的空间最好留给其他事情。如果你进入了面试阶段，可以随身携带推荐人的副本，或者至少提到你有现成的推荐人可用。\n\
  \n## 求职信\n\n每当你提交职位申请时，都请附上一封求职信。求职信让你有机会更详细地介绍你所申请的具体职位、你为什么对该职位感到兴奋，以及为什么他们应该雇你。\n\
  \n利用这个机会确保公司名称、联系人姓名和职位无误。如果可能，避免在称呼中使用“致相关人员”（To whom it may concern）或“尊敬的先生，女士”（Dear\
  \ Sir/Madam）。将他们的注意力引导到简历中相关的部分，例如：“正如我在 X 方面的教育背景所示，我对贵职位非常感兴趣……”\n\n确保你的求职信语气与招聘公司相匹配。利用你对他们使命/愿景/价值观的了解他们的他们的沟通方式。如果他们很正式，你的求职信也保持正式；如果他们很随性，你的求职信也可以同样随性。要保持积极。这是你展示对从事安全工作以及为这家公司工作的热情的机会。\n\
  \n如果你的简历中存在空白期，求职信是在高层面上说明这些问题的地方。工作经历中明显的空白、完成学位的时间过长，或简历上的其他疑点都可以在此处理。你不需要深入浅述，只需承认空白期的存在，并简要解释（例如“我任过的公司破产了”或“我在完成学位期间全职工作”），并让他们知道你乐意进一步讨论。\n\
  \n利用求职信帮助他们与你合作。提供你详细的联系信息和可以面试的时间。让与你合作变得尽可能简单。如果你认识在该公司工作的人，请在求职信中提到。（确保那个人知道你这么做了并且他们没意见！）\n\
  \n一如既往，找人帮你校对你的求职信！\n\n## 接下来做什么？\n\n- 针对你希望获得的每种类型的工作，创建一个通用的安全类简历。\n- 创建一个求职信模板，准备好为每个工作进行修改。\n\
  - 更新你的 LinkedIn 简介。确保你正在利用它积极与安全社区和话题进行互动。\n- 考虑其他社交媒体或在线选择，并开始参与那些活动。\n- 与安全联系人和经理分享你的简历草稿和社交媒体简介。向他们寻求反馈，并整合到你的简历和在线形象中。\n\
  - 如果你准备好开始用简历找工作，请准备好你的推荐人。\n\nWileyPRE\n\n# 第 7 章\n\n## 尝试后效果不佳？\n\n一些寻找安全职位的人会遇到障碍。也许他们找不到想入职的公司。也许他们找到了合适的公司，但该公司没有招聘他们想从事的职位。也许提供的职位地理位置不对。也许他们申请了职位，但没有收到回复。即使知道安全类职位供不应求而劳动力短缺，寻找并获得一份安全工作可能感觉像是一项挑战。\n\
  \n许多人的情况确实如此，但这并非不可完成的任务。如果你发现困难，你需要评估自己的策略。你申请的是正确的地方吗？你的简历是否突出了你的技能？你的社交活动足够吗？如果你遇到了障碍，请后退一步审视你的流程。进行必要的调整并继续尝试。坚持在任何求职过程中都是关键。\n\
  \n\n\n\n例如，如果你是一名项目经理，请要求分配包含安全组件的任务。（或者主动邀请安全团队作为项目的一部分参与进来；他们会非常感谢你的！）如果你是一名软件开发人员，请寻找在工作中测试代码的方法，或学习更多关于测试工具的知识（或实现测试工具）。安全团队不能无时地出现在每一个地方，他们非常喜欢那些能够在自己团队之外发起良好安全实践的非安全专业人员。这种展现主动性并与安全团队合作的结合，将使你在有新的安全职位出现时，被考虑（甚至被邀请）担任该职位。\n\
  \n即使你所在的公司没有安全团队，有意识地在现有岗位上开展安全工作也可以成为你职业生涯的助力，并在寻找其他公司的工作时在简历中引用这些工作经历。利用在线资源或人脉伙伴来帮助你起步。大多数资深安全人士之所以进入安全领域，是因为他们公司里没有人做这件事，他们直接投身其中了。你也可以这样做。\n\
  \n## 具体化\n\n通常，我会有有人问我关于如何找一份“安全工作”的问题。这是一个很好的对话切入点，但不够具体，无法让他们轻松地找到合适的职位。\n\n安全是一个广阔且复杂的领域。如果你想让招聘经理注意到你，或让导师帮助你，你必须对不同的安全角色有一个大致的了解，并明确你想追求哪种类型的角色。你不需要非常具体。即使是一个大类别的角色也是一个很好的开始，例如培训与意识提升、漏洞管理、应用安全、风险与治理等。\n\
  \n如果你投了大量简历但没有收到回复，可能是因为你的简历太笼统，与你申请的职位匹配度不够。考虑精炼你的简历，使其针对特定类型的安全角色。查看你使用的词汇、重点突出的经验、提到的技能，并确保它们与那份特定的安全工作尽可能保持一致。\n\
  \n如果你已经收到了面试邀请，但没有获得录用通知（offer），这可能是因为你没有清晰地表达为什么*这个*职位是你想要的。确保你清楚自己想要什么以及为什么，并据此调整你的简历和面试回答。准备好与筛选人员和面试官讨论为什么这份工作对你有吸引力。在你的求职信中表达你对这类工作的渴望。如果可以的话，重点介绍你为这类工作所做的的项目和培训。\n\
  \n如果你已经在从事非安全类工作并正尝试转入安全职位，请明确你是否愿意为了转型而接受一个更初级的安全职位。有时，你必须接受平调或降级来找到安全工作，并深知由于你有其他经验，你可能会很快再次晋升。但并不是所有人都能承担起降薪转岗的代价。你愿意这样做吗？这不是需要写在简历或求职信上的内容。但当你与人交流时，如果你觉得申请的职位比你现在的职位初级，请直接表达你被考虑的意愿。招聘经理不愿意雇佣他们认为资历过高或经验过深的人，因此你需要说服他们你接受这条路线。\n\
  \n## 了解你的市场\n\n正如优秀的营销人员会了解潜在客户一样，求职者应该了解目标市场的机会。查看当地的商业出版物/网站，看看潜在雇主池中有哪些公司。了解他们所属的行业、是否处于增长期，以及他们正在招聘什么样的安全职位。\n\
  \n如果你的目标是国家的任何地方，阅读关于安全行业的通用知识，甚至是像《威然数据泄露调查报告》（Verizon Data Breach Investigations\
  \ Report）这样的安全行业报告，都能帮助你理解谁在寻找人才以及他们在寻找什么样的人。\n\n你可能会发现自己一直在申请处于衰退期公司的职位。这些公司正在寻找能够立即增加价值的人（对“在职培训”的容忍度较低）。你可能在申请需要通用技能的职位，导致申请人数比常常高，从而产生了竞争。如果你一直专注于某个行业的职位申请但没有回复，请考虑尝试不同的行业。如果你一直专注于某一类职位但没有回复，请考虑尝试不同的职位。\n\
  \n如果你已经获得了面试但没有获得录用通知，考虑在与招聘人员或招聘经理交谈之前，熟悉你目标公司的业务，以便你知道什么样的行业压力影响着他们的思考。这家公司是高周转、低利润业务吗？也许公司只有几位高净值客户？他们的愿景和使命是什么？他们活跃于社区还是深事独行？了解这些问题的答案并将其融入你的简历、求职信和对话中，将帮助你从其他候选手中脱颖而出。\n\
  \n不要忘记查看他们的文化！在与任何人交流之前，确保你了解他们的价值观，并找到将这些价值观融入你的讨论或演示的方法。例如，如果公司处于受高度监管的行业，找出相关的法规（`HIPAA`、`PCI`、`NERC-CIP`等），并在说话时引用这些法规。如果他们关心多样性、包容性和公平性，请在对话中反映出这一点。\n\
  \n## 评估你以往的努力\n\n求职者往往落入两类：要么完全没有获得电话筛选或面试，要么获得了面试但没有获得录用通知。这是两个不同的问题，可能对应不同的解决方案。\n\
  \n如果你的问题是没有接到电话筛选或面试邀请，请花些时间关注你的简历和网络。请导师或资深顾问评审你的简历和 LinkedIn 个人页，并提供建议。通常，请确保：\n\
  \n*   你的简历专注于你申请的职位类型，而不是一份通用的简历。\n*   你突出了与职位相关的安全技能和经验，而不是仅仅罗列你所有的经历。\n*   你包含了你做的与安全相关的课外活动。这包括参与网络小组、会议、演讲、志愿者服务等。\n\
  *   你的求职信解释了你的“为什么”——为什么选择安全、为什么选择这家公司、为什么选择这个职位。\n*   你的社交媒体账号显示出对安全社区的活跃参与。确保你是安全小组的一员，与安全专业人士建立了联系（如果他们是你目标公司的人员更好），并且对安全相关的帖子发表了恰当的评论。\n\
  \n如果你的问题是得到了招聘人员的电话但没有进入面试，考虑练习你的电话技巧和推销策略。花时间思考招聘人员/筛选人员可能会问的问题。与朋友、同事或导师一起模拟电话面试。回顾你之前的任何邮件往来，寻找更好地推销自己的机会。虚心接受反馈并做出修改。\n\
  \n\n\n如果你面临的问题是能获得面试但没有录取通知，那么是时候审视一下你的面试技巧了。再次，与导师/教练/同事一起进行模拟面试。如果可能，询问目标公司是否允许你进行“信息面试”，即由你来面试*他们*。这是他们了解你的绝佳方式，你也可以在低压力的环境下练习自己的技能。在面试结束时，询问面试官他们对聘用你是否有任何顾虑是完全合理的。在面试过程中，务必向面试官索要反馈。他们对你的背景/经验是否还有其他问题或疑虑是你可以回答的？他们是否在你的候选人资格中发现了任何短板/弱点，而你可以在现场进行解答？他们通常会给你他们的“第一印象”反馈，这可能并不准确，但它能让你知道自己在面试中的表现如何。\n\
  \n注意你的外表。尽管我很反感外表很重要这一点，但它确实很重要。了解你面试公司的着装要求，并尽可能在面试时穿得稍微正式一点。去科技初创公司面试穿西装可能多此一举，但穿着“商务休闲正式”的服装是非常棒的。去金融公司面试穿商务休闲装则显得过于随意，会传递出你没有准备好胜任该职位的信号。\n\
  \n考虑与安全招聘公司合作。他们可以帮你提高所有的求职技能，并了解何时会有职位空缺。一些安全人员派遣公司会为你提供临时合同工，其中一些是“临时转长期”的职位。这可能是一个同时获得知名度、增加经验并可能获得录用的方法。\n\
  \n## 但我都在做这些事情了！\n\n如果你已经了解了上述所有的建议，这里是一些提醒：\n\n-   不要低估人脉的力量。我在书的其余部分详细提到过这一点，在这里也会再次强调。你必须尽一切可能进入安全社区。社区既能帮助你寻找工作，又在你寻找期间提供积极的支持系统。这可能包括在当地的安全组织担任志愿者。\n\
  -   推销你自己。不要只依赖人脉。找一个方法在社区中获得关注。在当地的安全专业人士分会担任志愿者，在工作或当地学校进行与安全相关的演讲，发布博客等，并在你的社交媒体账号上推广这些内容。\n\
  -   记住这是一个数字游戏。只投递几份简历将是一个缓慢的过程。你申请的职位越多，即使你觉得自己并不完全胜任，你发现的机会也越多。\n-   考虑转向安全领域，而不是采取直接的方法。这意味着寻找一个相邻的角色（帮助台、系统管理、应用程序开发或合规性），并在该工作中执行安全任务。利用这些学习在在以后转到安全职位。\n\
  \n我希望这些建议对你有所帮助。祝你好运！\n\n## 接下来做什么？\n\n-   评估现状。是你的简历吗？你的电话面试技巧吗？你的面对技巧吗？还是完全其他原因？\n\
  -   如果你还没有这样做，请某人审阅你的求职信和简历。进行模拟电话和面对面试。\n-   联系你的人脉，寻求如何解决你薄弱环节的建议。\n-   可能不是你的问题！考虑在不同的地方寻找你想要的工作——不同的行业、地点或职能。\n\
  -   在等待职位出现期间，尽你所能继续培训。\n\nWileyPRE\n\n# 第二部分：在安全领域蓬勃发展\n\n恭喜你，你成为一名安全专业人士了！\n\n\
  当人们最终获得一个安全职位——任何职位——时，他们非常兴奋，并直接投入到新角色中。一段时间后，蜜月期结束了，他们不再像对着消防水管一样拼命吸收，现在有时间抬头看看周围的环境了。当他们这样做时，他们发现从事安全工作有很多益处，也有许多挑战。\n\
  \n他们的许多问题适用于任何工作、任何职业。经理/员工互动、职业晋升、玻璃天花板以及家庭与职业生活之间的平衡等问题不仅限于安全领域。我在这一部分回答的问题具有特定的安全色彩。在安全领域工作的某些特性会让问题变得更难应对或更复杂。在这一部分，我们涵盖了以下主题：\n\
