  \n## 如何向上管理（Manage Up）？\n\n成为安全领导者，不仅仅是管理安全计划。一个成功的领导者会管理他们的管理链条和高级利益相关者。这项工作与运行构成安全职能的工具和服务同样重要，甚至更为重要。为什么这如此重要呢？\n\
  \n大多数安全领导者向一个不理解安全的人汇报。即使是首席信息官（`CIO`）老板——你认为他们最可能理解这些——他们也不会花费精力深于信息风险管理的细节中，这意味着他们往往无法考虑到安全策略和决策的细微差别。许多安全领导者向非技术类高管汇报——财务官、法务部门负责人，甚至是首席执行官（`CEO`）——这些人也很少有任何安全背景。尽管（在上市公司中）他们是安全计划的最终决策者和监督者，董事会成员也很少有理解安全的人士。\n\
  \n作为安全领导者，你必须每天与你的管理链合作，以确保安全计划获得资金、支持和维护。在安全事件发生、形势紧张且时间紧迫时，你也需要与他们合作。向上管理是这两项任务的关键技能。遗憾的是，这是新入职和丰富的安全领导者都感到挣扎的技能。我们大多数人都没有接受过关于如何向上影响的技能培训，都是在工作中学习的。在开始新工作之前，请确保你识别了你的领导者，并制定了合作与参与计划。\n\
  \n## 谁是高级利益相关者？\n\n你的高级利益相关者以及你需要管理的管理层级将取决于你组织的规模和结构。以下章节中列出的利益相关者是最常见的。\n\n###\
  \ 你的直主管\n\n一如既常，你的直主管是你需要确保管理良好的第一个人。在《职场黄金 90 天》（*The First 90 Days*）书中，Michael\
  \ D. Watkins 讨论了如何通过一系列对话来揭示如何合作，从而与主管建立良好关系。尽早讨论预期、风格等问题至关重要。\n\n此外，安全领导者必须与主管进行早期沟通，以了解他们如何看待安全、风险和合规性。以下是你需要了解的一些内容：\n\
  \n* 他们如何看待安全职能？他们认为安全是业务的推动者、行政负担还是其他什么？\n* 他们如何评估风险？他们在行动之前是需要活动事件的证据，还是愿意预先投入安全控制措施？他们现在是否有自己正在担心的风险关注，还是会留给你来告诉他们应该担心什么？\n\
  * 你将拥有多大的自主权？你需要将一切都提交给他们并通过他们进行，还是可以在没有主管重大投入的情况下，向其他利益相关者建立业务案例？\n* 他们对安全术语的理解如何？当你讨论杀伤链（kill\
  \ chains）、零信任或 `MITRE ATT&CK Framework` 时，他们能能跟上你的思路吗？还是他们仍在努力如何识别漏洞？\n\n了解你的老板对安全话题的精通程度以及他们想要参与安全决策的程度至关重要。这些问题没有对错之分，答案只是不同。\n\
  \n### 高级领导\n\n作为安全领导者，你将需要与管理链合作，通过讲述合适的故事来管理这种关系。每个组织的方法各不相同，因此安全领导者必须遵循内部流程来创建并呈现这个故事。\n\
  \n### 董事会成员\n\n所有的安全领导者——无论是在私营部门还是公共部门——都会有一个位于组织日常管理之外的治理小组。该小组作为组织整体管理的一部分，监督安全职能。为了简单起见，我称他们为\
  \ `董事会成员`。如果这个小组运作良好，他们将不会参与运营决策；相反，他们想知道组织是否正在恰当地管理信息和技术风险。\n\n\n\n\n无论你向董事会汇报的频率如何，都要利用每一个机会强化你是一个胜任的安全领导者这一观点。利用当前热点事件来教育他们你的组织是如何受到威胁的，或如何防御威胁的。如果可能，寻找机会与委员会主席进行非正式的、周期外的会议，让他们对你的计划和进展有更深入的理解。不要害怕谈论计划中哪些方面运行良好，哪些运行不佳。向他们请求可以帮助你计划的具体支持（如资金、时间、行业杠杆等）。\n\
  \n监管机构希望董事会成员了解网络和信息安全风险，因此你可以预计他们随着时间的推移会学习更多知识。这可能是一把双刃剑。他们将掌握足够理解术语的，但可能不足以理解这些术语如何适用于你特定的公司。与他们共同这段变得精通的旅程，因为这将为公司的安全计划提供服务。\n\
  \n## 帮助他们理解安全\n\n实施“向上管理”要求你和你的领导层进行有效的沟通。只有当他们具备必要的安全知识水平时，这才能实现。遗憾的是，许多高级经理并不具备这些知识，因此你的首要任务之一就是实施一项帮助他们学习的计划。你的计划应该考虑正式和非正式的方式，通过就安全主题进行定期接触来帮助他们跟上进度。考虑以下章节中的想法。\n\
  \n### 定期会议\n\n当你与经理或高级利益相关者进行一对一会议时，请确保这些会议不仅仅关乎当天的战术问题。花时间分享有助于他们学习安全的话题的信息。这可以通过一种非威胁性且情绪低调的方式进行。在没有“火烧眉毛”的时候讨论这些事情，比在危机期间试图教育他们要好。\n\
  \n与他们谈论他们可能从媒体上听到的当前问题，例如类似公司发生的`ransomware`、`phishing`和`breaches`。让他们知道什么种类型的问题影响着你的行业，以及你的`strategic\
  \ plan`活动是如何应对这些问题的。\n\n帮助他们看到你眼中公司面临的威胁和事件。然后谈谈你正在采取什么措施来应对这些威胁，或者你应对这些威胁需要什么。这不一定会导致某个请求；仅仅是让他们知道你在思考，以及他们应该思考什么。\n\
  \n给出你对公司自身优势和机会的坦诚评估。安全文化强大吗？你的计划是否得到了组织所有部分的支持？让他们知道你对公司当前安全状况的看法，让他们思考可以做些什么来支持你的计划。\n\
  \n### 应急准备\n\n为你的领导团队应对安全事件做好准备是你应该和他们做的早期工作之一。这包括你的直接经理、高级领导者和董事会。\n\n如果没有`security\
  \ incident response plan`，你就需要创建一个。理想情况下，你不需要从零开始创建。也许有一个基础的、非网络安全的危机计划供你遵循。或者也许沟通部门有自己的通信层级结构，可以模仿这种结构来创建一个网络安全计划。创建一个`incident\
  \ response plan`是吸引合作伙伴和建立社区的绝佳方式。利用这个机会培养支持者。\n\n一旦你创建了`incident response plan`，就是时候与你的管理链谈谈他们的角色了。这可以是一个简单的会议，用来概述一般的步骤和流程图。这种会议对于在你到达之后加入公司的任何新高管来说非常好。你正在帮助他们做好准备，以防发生事故。这同时也让你成为他们每当有安全问题或担忧时会寻求你的人。\n\
  \n### 桌面演习\n\n创建和领导桌面演习（`TTX`）是你帮助你的管理链和领导层理解安全的绝佳方法。你可以聘请第三方帮助运行`TTX`，或者由自己来。通过良好的`TTX`，你可以引入涉及`risk\
  \ management`、`communication strategies`和`chain of command`等理念的安全概念。你可以帮助他们理解，安全事件可能会持续几天或几个月，他们需要为长期的事件处理做好准备。你可以将法律法规、外部媒体查询和多因事件纳入其中。\n\
  \n桌面演习是安全领导者学习高级领导者在压力下如何思考和行动的极方法。你将了解到他们最关心什么（例如客户、员工、供应链或其他）。你将了解到在处理危机时他们听从谁的，以及谁在居于次座。你将发现谁愿意做决定并行动，即使没有太多数据来支持决定。当你思考如何构建你的安全沟通和流程时，这些知识是无价的。\n\
  \n参与者将看到你如何模拟适当的危机响应行为。这是一个展示你领导能力的机会，特别是你对安全环境的理解程度以及何何之深，以及在网络安全危机事件期间如何领导他们。明确表示在这种情况下，你*将*是该情况的执行领导者——而不是常态的危机管理或\
  \ IT 运营危机小组。你是事件流程的所有者。利用`TTX`来展示这意味着什么。\n\n### 当前事件\n\n向你的直接经理、高级领导者或董事会“向上管理”的最佳方法之一，是找到方法让他们了解当前的安全事件。一些安全领导者通过提供讨论内部和外部活动的`daily\
  \ incident report`来每天这样做。有些人每月这样做一次。有些人在出现具有新闻价值的外部事件时这样做。你会知道你的公司能容忍什么，我建议你提供尽可能你和他们能够处理的信息。\n\
  \n一个想法是选取一个外部事件，并给出你对它的内部见解。收集和展示这些信息也可以用于季度和年度报告——公司内部以及面向董事会。你可以在单页上涵盖以下内容：\n\n\
  *   事件细节：什么、谁、如何、何时以及为什么\n*   同类事件是否可能发生在你的公司以及为什么\n*   这种事件以前是否发生过你的公司，或者目前是否正在发生\n\
  *   如果发生在你的公司，在`incident response`、业务影响等方面的可能影响\n*   已采取了哪些措施来防止、检测和响应此类事件\n\n高级领导者希望知道你可以被信任来管理安全风险和事件。培训他们了解你正在关注的安全事件类型，将有助于他们了解你的领导力，并激发他们对你支持公司的信心。\n\
  \n## 当事情出现问题时\n\n在你任职期间的某时候，可能会有一个安全事件引起公司高级领导者的关注。没有比教育他们安全如何运作以及你将如何引导组织的更好时机。\n\
  \n当发生事件时，你希望被认为是冷静、响应迅速且有能力的。这始于遵循你已经与高级领导者分享的`incident response playbook`。尽可能表现出可预测性。\n\
  \n不可避免地，会有某些细节无法完美地契入手册。当这种情况发生时，告诉你的领导你正如何处理该问题，或者寻求建议并相应进行调整。\n\n如果由于你的领导或你的团队导致了负面结果，请通过承认并解决问题来承担责任。继续执行手册。\n\
  \n\n\n\n活动结束后，请确保你进行了一次涉及公司高层领导者的“经验教训”回顾。让他们意识到需要采取的任何活动后行动，并在工作完成前保持他们的知情状态。\n\
  \n在整个活动期间，确保你与他们保持联系，并在他们需要联系你时能够随时待命。对于多期活动，这可能意味着要让他们知道你在休息和充电期间由谁来替你工作，并能尽快给他们回复。\n\
  \n向领导层各级“向上管理（Managing up）”是所有安全领导者需要掌握的关键技能。你可以将安全知识元素融入定期会议中，或者利用时发事件作为学习的媒介。无论何种方式，目标都是尽可能地向高层领导者展示安全，并通过这种方式强化你的专业素养和能力。定期的强化将使你在必须为新资金提交业务案例、做出艰难的政策决策或由于需要他们的好感时，能够依靠你们建立的持续关系。\n\
  \n## 接下来做什么？\n\n- 确保所有高层领导者都理解你的事件响应流程和执行剧本（playbooks）。\n- 识别需要特别一对一关系关注的高层领导者。\n\
  - 学习如何与董事会接触，以及谁需要参与重大事项/演示稿的准备。\n- 与你的直属经理谈他们对安全和风险的理解。然后，如果有需要，制定一个计划帮助他们的知识水平达到标准。\n\
  \nWileyPRE\n\n# 第 21 章：我如何为我的项目融资？\n\n当你成为一名中级安全经理时，你不需要太关心支付项目所需的资金从哪里来——它们似乎会魔术般出现（或者不）。获取你所需的预算是你的经理及其经理的职责。这是我们大多数人的共同经历。（我们很乐意继续做一名管理人的经理，但收入来源并不是我们特别担心的事情。）\n\
  \n当你成为一名安全领导者时，确保团队有资金突然就成了你的工作。你必须学习整套融资体系是如何运作的。谁在正式或非正式地对资金如何花钱做出决定？预算周期是什么？你什么时候可以申请资金？即使大家都同意应该投资安全，资金将从哪里来，以及何时获得？\n\
  \n理解资金的运作方式、谁应该决定资金花在哪里，以及如何与机构接触以确保资金流向安全团队，可能需要大量时间。作为安全团队负责人意味着你必须知道你需要多少资金以及用于何处，你如何为组织带来价值，以及如何利用资金来源。虽然你可以在商业课程或书籍中学习基础的组织财务，但*如何*实现它取决于你的工作地点，因此要准备花时间学习你所在的地方这是如何运作的。\n\
  \n像我一样，你可能为自己是一个务实的安全领导者而感到自豪。你可能为自己推动组织达到产生安全变化的程度感到自豪，但又不至于让组织开始反弹。这对于推出新的安全工具或服务非常棒，但如果你正在领导一个安全组织，你不仅仅是在管理运营；你是在管理风险。我花了一段时间才理解到这一点。\n\
  \n> 你必须要求你需要的一切，并且知道领导层可以（并且很可能会）说“不”。\n\n你必须迫使管理层理解资助安全项目所需的一切，即使你知道资金尚不可用。说“不”是一个风险决策，是管理层表达他们愿意投入资源何的方式。如果你不提出你需要的，他们就不知道你需要什么。价格冲击（Sticker\
  \ shock）是真实的，所以不要在一次会议上把所有这些突然抛给他们。然而，你有义务让他们充分意识到你领导安全项目所需的一切。不要对他们隐瞒；这样做只会让你工作变得更困难。\n\
  \n## 为团队提供资金\n\n我们大多数人的领导之旅是从运营一个专注于单一服务领域的小团队开始的。这是理解组织如何资助和重视你团队工作的很好的起点。\n\n\
  从理解你的团队如何获得资金开始。你的部门成本是否被管理层视为“管理（overhead）”支出？内部客户对是否支付你的团队费用有发言权吗？也许他们使用基于消耗的模型付费——用户、应用程序、设备或评估的数量。也许你的收入基于捐赠、捐助或其他“好感”来源。也许你的收入是所有这些者的结合。无论如何，你的收入是某些资金池的一部分，你需要知道这块饼的配方。\n\
  \n一旦你知道了收入的来源，就考虑你是如何花它的。有多少用于人力和相关成本？有多少用于软件、许可、硬件、培训和其他其他物品？这些成本中哪些部分很大程度上是固定的（如薪水），哪些部分是变动的（如培训、差旅等）？与你的财务/会计伙伴建立良好关系；他们知道公司如何分类和跟踪支出，并会帮助你在正确的水平上评估支出。Will\
  \ Larsen 的书《优雅的谜题：工程管理系统》（An Elegant Puzzle: Systems of Engineering Management）是帮助你思考问题的优秀资源。\n\
  \n最后，考虑你的团队、部门和服务。你是否工作得高效且处于高成熟水平？你是否刚开始建立该部门并需要增长的资金支持？你的资源配置能否满足客户现在以及三年后对服务的需求？\n\
  \n如果你有足够的收入支持你现有团队和未来计划，那么你就很顺利了。现在你的工作是继续向组织展示他们投资所获得的价值。然而，如果你有缺口，你需要找到方法填补它。对于初级领导者，这通常意味着与你的直属经理/团队负责人交谈，他们的职责是为你寻找这些资金。找出他们需要提供什么来申请更多资金。\n\
  \n## 为项目融资\n\n如果你正在运营一个拥有多个安全服务和需求的团队，你就负责为你的整个安全组织的所有事务获取资金。这不是一项轻松的任务，它会占用你大量的时间。我建议设定一个年度或每季度与财务管理相关的个人目标。根据年份，它可能仅仅是从零开始创建预算。可能是识别顶级供应商合作伙伴并优化供应商支出。可能是为了重新调整组织以节省成本或为下一个增长期做准备。总有值得做的事情，会成为你整个团队的倍增器。\n\
  \n正如你的初级领导者需要理解他们的价值和资源缺口一样，你需要了解整个安全组织的所有这些情况。你需要将其纳入你的战略计划中。利用你的初级领导者为你收集基础数据。明确你的资金优先顺序，以支持业务使命的战略推进。能够清晰阐述哪些项目对于管理组织的安全风险至关重要，哪些项目是实验性的增长机会。\n\
  \n除非你坐拥一堆钱，否则你必须去不同的小组和地方请求资金。请考虑以下章节的信息。\n\n### 自筹资金\n\n\n\n\n\n你应该始终寻找为安全支出自筹资金的方法。通常，这来自于通过自动化流程来释放资源以进行其他工作。你可以重新谈判供应商合同，以释放资金用于其他用途。你可以将人员空缺的补填从关停服务转移到新兴服务。在去其他地方寻求收入之前，你应该先处理好这些。即使你寻找了自筹资金的机会但没有找到，这种寻找的行为本身也会向你的管理层证明你是公司资源的良好守护者。\n\
  \n### 基于用量的收入\n一些安全领导者会对产品进行结构设计，实行“按次付费”。这是一种直接、显而易见的按使用付费结构。这种方法要小心，因为它会鼓励人们放弃使用安全服务，而人们在预算紧张时往往倾向于这样做。从哲学角度考虑，考虑一下你是否认为人们应该有权“选择”你的服务。如果是这样，那么基于用量的计费结构可能值得考虑。\n\
  \n### 持续/永久性资金\n有时，你需要寻求支持来创建、维护或扩大现有的运营功能。这不能通过一次性投入资金来完成，它需要作为一种持续的组织成本被承诺。即使人员配置和工具保持不变，持续运营成本也不会逐年保持不变。安全员工的成本每年都在增加。如果你必须进行人员更换，其成本将比现有人员更高。许可费用可能会随着组件数量（人员或设备）的增加而增长。因此，在考虑运营成本时，请至少规划未来三年的计划，并考虑到增长、员工流失以及其他业务投入。\n\
  \n### 项目资金\n有时你仍处于实验阶段，正在尝试新的技术或流程。在这里，你可以申请一次性的资金注入，以进行概念验证（PoC）、尝试新事事物，或让你的现有团队接受培训以应对新挑战。这种请求可能会指向你的主要融资小组（特别是如果该项目最终会增加运营成本），或者你也可以向该项目的关键利益相关者（业务其他部门）请求分担较小规模的启动成本。\n\
  \n### 共享成本\n通常，某些成本可以在安全团队与其他小组之间分担。例如，如果你正在推出新的应用安全工具，与应用开发团队合作分摊成本是一种完全合法的资金策略。面对现实吧：大多数安全工具和服务并不是存在于真空中的。它们是由组织的整体业务和技术战略驱动的。因此，确保你在任何战略规划会议上列席（或尽可能接近核心），并确保安全服务的成本被包含在规划中。\n\
  \n### 供应商投资\n通常，供应商愿意投入服务或许可来帮助你推动进展。不要忽视这些战略合作伙伴关系作为资金来源。如果你愿意签署一份多年期采购合同，你可能会在协议有效期内获得更廉的产品，可能是通过降低许可费用，也通过获得一组“免费”的可用许可。然而，对于提供免费赠品的供应商要加小心。没有免费的午餐。通常，这类提议伴随着更高的后端或续约成本，或者它们创造了由你承担的集成成本。考虑这些选项，但要确保你管理好了这些隐藏支出。\n\
  \n### 资助\n根据你所在的行业，你可能申请资助来为项目或倡议提供种子资金。一些大公司为内部员工提供创新资助。也许还有州或联邦资金资助，用于招聘网络安全岗位的人。将此类收入视为仅限一次使用，但不要忽视它们！\n\
  \n### 公司重大倡议\n你的技术和业务伙伴会有他们自己的重大项目和倡议，你的团队可能会被要求以某种方式支持他们的计划。利用这个机会向该项目团队寻求资金以支持你团队的成本。这可能是用于额外的人员、许可或服务的资金。\n\
  \n## 大诉求（The Big Ask）\n一旦你确定了潜在的资金来源，你就需要要去钱。无论来源如何，要钱的典型格式如下：\n\n*   **定义问题：**\
  \ 这里是你讲述故事的机会。你正试图解决的业务问题是什么？是旧风险、新威胁、合规问题，还是竞争优势问题？如果可能，将其与你汇报对象的任务目标挂钩。\n*   **提醒他们你过去所做的良好工作：**\
  \ 你不需要在这里花费大量时间，但微妙地提醒一下你过去管理得有多好将有助于建立信誉，并消除他们对花费更多资金的焦虑。\n*   **描述潜在的解决方案：** 可能不止一种解决方案，但要确保提供给他们的任何选项都是你可以接受的。低价的方案通常比没有方案更糟糕，所以不要让最低成本的选项变成一个糟糕的选项。用功能性术语描述解决方案（它是如何运作的以及谁来运行），并考虑对利益相关者（客户、IT\
  \ 人员或其他）的影响。\n*   **概述未获得资源的风险：** 这就是了解你的受众如此重要的原因。风险对决策者来说必须具有意义。如果可能，你需要在不使用恐惧、不确定性和怀疑（FUD）的情况下，让风险看起来紧迫。人们行动的动力取决于他们认为认为坏事发生的临近程度，所以要帮助他们理解这个解决方案如何在`今天`帮助到你，即使该解决方案是为了应对未来的威胁。\n\
  *   **详细说明解决方案的成本以及你的团队如何在其他地方努力自筹这些资金的：** 领导层想知道你是投入的，他们想知道加入其中需要他们多少成本。\n*   **用业务术语而非仅用安全术语描述结果，并说明为什么会很棒：**\
  \ 以积极的基调结束。是的，存在威胁，解决它需要资源。但如果你做得恰当，它将有助于许多领域，而不只是安全。\n*   **以诉求结束：** 给他们留下一个需要回答的问题。明确表示你需要什么，以及何时需要。\n\
  \n\n\n\n当我们成为安全计划的负责人时，通常在担任这一角色之前没有接受过如何演示业务或向组织分享安全计划成果的培训。我们的大多数人都没有意识到，这种技能是多么重要。难道安全计划本身不会说明一切吗？简短回答是：不会。\n\
  \n对于我们中的一些人来说，第一直觉是使用指标来谈论我们的计划。我们会搜索“安全指标”，或者访问安全分析师网站或参加关于指标的会议。董事会成员、首席财务官（`CFOs`）以及其他数据驱动型的人需要指标。有一种完全合理的观点认为：“你无法管理你无法衡量的东西。”关于这个主题的一本好书是\
  \ Douglas Hubbard 和 Richard Seiersen 写的《如何衡量网络安全风险》（*How to Measure Anything in\
  \ Cybersecurity Risk*）。\n\n随着时间的推移，我发现指标方法是不够的。它在某些地方确实有效，例如向 `CFO` 要要更多资金，但对其他人来说，这些指标往往太琐碎了。实际上，没有人关心我们的漏洞存在了多久、我们审查了多少个供应商产品，或者我们将框架比对了了多少项策略。作为\
  \ `CISO`，这些在操作层面上对我来说都很重要，但谈论这些会让其他人听得昏昏。\n\n你作为安全领导者的角色是让组织投资安全计划和文化。要做到这一点，你需要激发社区对安全事务的兴趣。你需要让他们像你一样关注安全。你通过通过讲故事来实现这一点。\n\
  \n## 我应该讲述什么故事？\n\n如今，大多数安全领导者必须花一些时间向组织领导层——高管层（`C-suite`）、风险委员会或董事会——介绍他们的计划。在所有情况下，都需要解释：你们在做什么？有效吗？与同类机构相比，足够好吗？是否高效？对于许多\
  \ `CISOs` 来说，这*真的非常困难*。\n\n与领导层谈论安全没有一种一成不变的方法。虽然有许多资源可以为你提供关于如何进行安全演示的 PowerPoint\
  \ 模板，但向领导层演示的方式将像组织本身一样多样化。如果一家公司最关心效率，那么安全计划`必须`涵盖安全是如何提高效率的。如果公司关注处于技术尖端，那么安全团队也必须在场，并且演示必须突出这一点。如果你需要申请大量资金，那么演示必须积极为申请资金提供理由。\n\
  \n每场演示都需要花时间制作，并且是独一无二的。你将在后续中学到的，有些内容在所有演示中都是通常的。\n\n### 建立公信力\n\n每当安全领导者进行演示时，演讲者的公信力是被评估的因素之一。对于安全领导者来说，这意味着听众在离开时需要相信计划交给了可靠的人，相信安全领导者精通此道，并且即使在困难时期，由于安全领导者的存在，组织也能很好应对。\n\
  \n你如何建立公信力？\n\n*   **表明你理解你所处的业务。** 不要直接跳入漏洞指标或事件报告。意识到组织领导层关心的当前业务挑战。它是一家关注股价的上市公司吗？找一种方法将安全计划的引入与市场表现联系起来。公司生产安全产品吗？将安全产品的使用与安全计划的成功（或失败）联系起来。\n\
  *   **了解你与同行和竞争对手的对比。** 基准测试（Benchmarking）是你（（多变的）的朋友。与董事会的对话总是包括与其他类似组织在支出、事件、工具使用等方面的比较。你的支出是比同行多还是少？行业状况与你公司相比如何？外部审计师对你的计划怎么看？\n\
  *   **展示对安全趋势的了解。** 这分为两种形式：对你组织的威胁以及采用新工具/技术来解决问题。找到将你拥有的计划和服务与当前问题联系的方法。例如，你正在处理勒索软件吗？讨论你行业目前的勒索软件事件、你的计划如何解决这些问题，以及你需要将计划带到什么种程度以获得并保持领先。\n\
  *   **了解你的听众。** 这非常关键，特别是当你面对董事会时。如果你向一个关注支出的 `CFO` 演示，要准备在演示中讨论支出。至少，要准备好回答任何问题。如果你的董事会成员来自其他行业，也要了解他们领域正在发生什么，并确保将其联系回你自己的计划。有人关注客户会如何反应吗？谈谈你的计划如何支持客户。无论你是向内部小组、董事会还是外部利益相关者演示，都要花时间做好课，了解他们的利益和关注点在哪里。准备好应对这些利益和关注。\n\
  \n### 了解你的资金\n\n在所有这些演示中，始终会有（总是！）对资源的考虑。对于内部小组，问题可能是：“这要花费多少钱？”对于董事会，问题可能是：“我们投入到安全的资源足够吗？”（通常，答案是“否”）。内部安全极很少被视为一种战略性的差异化因素。（如果你为安全产品公司工作，情况可能会不同。）这意味着，即使你有一个极佳的计划，也会有两个底层问题：“它值吗？”以及“我们付得起吗？”如果你在一个为安全投入资金并有既定计划组织中工作，问题通常是：“我们的资金使用得有效？”这个问题是无法回避的。\n\
  \n为了回答资金问题，你需要有宏观和微观视角。\n\n宏观视角是这些总体问题：你们在安全上花了多少钱？足够吗？再次，回到基准测试。通常有两个指标针对这个问题。许多安全领导者讨厌这些指标，所以你可以随意舍弃，但你至少应该了解它们：\n\
  \n*   安全支出占信息技术（`IT`）支出的比例\n*   安全支出占收入的比例\n\n快速搜索通常可以提供过去几年的基准。你还会发现有关同行计划增加、减少还是维持现状安全支出的指标。尽力使其适用于你的语境。我意识到这些指标通常是“苹果和比袋鼠”，但你可以对你的行业做出一些概括（“受监管程度高的行业安全支出占比更高”）并对你的同行做出结论（“在我们行业，安全支出占收入处于领先百分比”）。\n\
  \n微观视角用于当你为安全产品或服务申请资金时。传统的投资回报率（`ROI`）衡量在安全领域并不适用，因为很难在安全服务与销售/收入增加之间建立直接联系。最好的情况是你处理的是成本规避，但如果你斥资购买了一个防御性安全工具，结果什么都没有发生，即使这也很困难！\n\
  \n\n\n因此，在就当前或未来的产品/服务进行演示时，请务必明确你作为安全领导者是如何衡量价值的。可以花时间培训听众让他们了解安全人员是如何衡量价值的。（这样做将建立你的公信力。）这是否让你的安全工作更具主动性（大多数领导者都认为这是一件好事事）？它是否减少了与大量供应商合作的需求，或者简化了应急响应流程？它会是推动组织转向零信任模型的第一步吗？你可能仍然需要讨论投资中涉及的“硬性”成本，但收益也可以是关于一些“软性”方面，例如提高组织的风险概况、减小攻击面等。\n\
  \n如果你从未学习过财务或会计，现在就是时候学习的时候了。我并不是建议你去读一个工商管理硕士（MBA）学位，而是要找一些培训，帮助你理解公司财务状况以及安全是如何融入其中的。\n\
  \n## 关注未来\n\n无论你的安全计划或安全行业发生了什么，那都是过去的事情了。如果你的公司已经挺过了过去，那么在演示中谈论过去，只有在它对未来有所启示时才有用。没必要纠结于过去。你现在需要什么，明天又需要什么？行业今天正在发生什么，未来可能出现什么？\n\
  \n安全领导者的价值通常体现在他们带领组织安全地前行的能力，而不是在马跑掉了之后才修栅栏。因此，在谈论你的安全计划时，只有当你把团队所做出的优秀工作转化为“当未来发生事情时他们将如何表现出色”时，夸奖一下是可以的。讨论已经发生的安全事件是可以的（如果这些事件直接发生在你的组织，你会经常谈论它们！），但重点应该放在你现在正在采取的步骤，以确保未来不会重演过去。\n\
  \n## 保持透明\n\n这可能是你在组织内部谈论安全最困难的部分。\n\n一方面，你必须保持积极、乐观、自信并提供支持。为什么？因为如果你不断给别人带来压力、用现实恐吓他们或只关注负面信息，他们将对你失去信心并忽视你的话。你将失去有效领导团队的能力。\n\
  \n另一方面，你不能粉饰太平问题。你的工作是确保组织中的领导者知道他们面临的安全风险，并让他们处理这些风险（或接受它们并无所作为）。这不是由你做出的决定；而是他们的决定。此外，你的工作是确保他们知道这些风险。隐藏这些风险对你或对公司永远没有好处。\n\
  \n那么，当你意识到组织正在发生一些需要处理的可怕事情时，你如何能保持积极、乐观和自信呢？\n\n*   如果你的组织设有风险或合规委员会，这些地方是你首先提交关注关点的地方。给这些委员会提供理解、评估和应对问题的机会。如果没有风险或合规委员会，就为安全工作建立一个“顾问委员会”（或类似的机构），并要求委员会成员提供“指导”而非“决策”。这些“指导建议”可以在将问题提交给领导层小组或董事会时使用。\n\
  *   务必带着解决方案或得出解决方案的方法出现场（即使该解决方案还伴随着对更多资金的请求）。不要只带着问题出现然后“扔完炸弹就走人”。你也要成为那个能够解决问题的人。\n\
  *   如果一个人的角色没有赋予他们行动的权限，不要要求他们修复问题。向这些人暗示问题是可以的，但要确保在他们无法修复问题时，不要向他们寻求支持或决策。换句话说，要清楚组织中谁拥有权力，并战略性地向他们提出问题。\n\
  *   如果你必须谈论负面信息，请基于事实而非情绪。例如，如果补丁率没有达到你的预期，并且增加了组织的风险，请与运营人员讨论这些数据，然后为决策者提供选项。不要把组织的其他部门推到火上烤。\n\
  *   要务实。当你清楚地知道完美并非遥不可及时，不要追求完美。你应该预期的决策是足够好但并不完美的，并且你需要捍护团队的努力——这些努力并非由于他们的错，但无法满足你的要求。在向领导层汇报时，要对组织的能力保持务实，同时对它应对安全环境挑战的能力保持乐观。\n\
  \n## 保持可见性\n\n无论你的演示计划如何，你都必须准备好谈论你的计划——随时随地。为了赢得你的团队和社区的信赖，你必须不断分享你所知道的知识、你如何处理问题以及你的目标何在。寻找方法与沟通团队合作，生成简报、团队邮件/聊天通知以及其他方式，让安全工作处于每个人脑海的中心。这对于高层领导和董事会更是如此。如果有行业活动正在举行，以此为由主动联系他们，并解释你的安全计划是如何处理类似问题的。如果联邦调查局/信息共享与分析中心（ISAC）发送了警报，请向高层领导分享你是如何处理该问题的。\n\
  \n## 讲述故事\n\n现在你有了所有这些素材，但如何将它们组合在一起呢？\n\n安全领导者必须为安全计划创建一个总的叙事框架，并确保任何演示都与该叙事保持一致——在可能的情况下明确引用它。也许你正在从零开始启动一个新计划。如果是这样，有很多方法可以讲述关于“处于旅程”的故事——为什么需要这个计划、为什么重点在某些安全工具上，以及大家如何共同走这段旅程。也许你已经运行了一个计划了一段时间，现在正开启一个新阶段或新重点。谈谈发生了变化使得这个新阶段变得必要。庆祝你们走过的路，并利用这些优势进入下一阶段。在所有情况下、所有演示中，都要从故事开始，而不是数据或指标。将你的计划植根于组织希望展示的价值观。给出做得良好的例子。谈论那些没有像你这样做的同行或竞争对手以及对他们组织的影响。描绘你希望他们看到的画面。重复这些意象。反复讲述的故事将成为组织基因的一部分，而转瞬逝逝的指标和数据永远无法做到的。\n\
  \n\n\n\n利用关于你想要模仿的行为和计划的故事，将让你组织中的成员更容易看到并付诸行动你的愿景。一旦你让他们与你的思维方式达成一致，你就可以向他们抛出指标、数据和战术性的了。\n\
  \n## 接下来要做？\n\n*   思考你想要让人们了解关于你计划的故事。这是一个关于增长的故事？还是重新的故事？或是持续的专业主义？他们在计划中扮演什么角色？你的角色是什么？你想要得到什么结果？写下你的故事。\n\
  *   与你的组织谈谈他们对安全计划的印象。他们使用了哪些形容词？哪些形容词与你的故事相符，哪些需要改变？\n*   你可以使用哪些图像和轶事来支持你的故事？列一个清单，并在演示中经常引用它。重复是你的朋友。\n\
  *   你的安全计划是一个品牌。创建它、培养它并推销它。如果你有营销或传播人员帮助你，那太好了！如果没有，就找一个具有营销技能的导师，让他们帮助你深入思考如何做到这一点。\n\
  \nWileyPRE\n\n# 第 23 章：我的传承是什么？\n\n在职业生涯的某个时刻，你将开始思考你工作的长期影响。你不会仅仅想：“我今天工作得好吗？”相反，你会想：“当我离开这份工作时，会有什么留下来？人们会记得我什么？”无论你的年龄或经验如何，开始考虑这些都不为太晚。思考工作的传承将迫使你做出对你的团队、组织以及你自己更有影响的决策和策略。\n\
  \n在安全领域，领导职位似乎并不持久。常识认为，首席信息安全官（`CISO`）的平均任期约为两年，尽管这一数字正在增长。任期短的影响之一是没有建立强大团队或创建一个对组织产生持久影响的计划。一个在不同职位或公司之间频繁跳槽的领导者最终会陷入对自己所做工作价值的质疑，并会问：“我的传承是什么？”\n\
  \n思考你领导的目的是很有帮助。我推荐阅读 Mike Figliuolo 写的《一张纸：强大个人化领导的简单方法》（*One Piece of Paper: The\
  \ Simple Approach to Powerful, Personal Leadership*）来帮助你深入思考。它将帮助你思考为什么要领导一个计划，你如何领导团队，以及如何与更广泛的社区分享你的愿景。花时间这样思考和了解你自己，因为这会帮助你明确你的目标——无论是短期还是长期——并帮助你专注于对你最重要的事情。\n\
  \n当你阅读组织管理书籍时，创建一个团队通常被描述为一项精心计划和有方法的努力。在这个完美的世界里，团队根据客户和利益相关者的需求而增长，领导者对团队成员的选择以及如何运作非常有意图。在现实世界中，组织的创建和维护通常是基于领导者的性格。有时团队和功能是有意创建的，有时组织重组会导致新的团队成员和新功能被添加到投资组合中。强大的领导者会吸引更多责任，导致在不断增长的工作基础上增加新的、不同的功能。性格驱动的组织设计更多是规律而非例外。\n\
  \n你可以在现实世界中看到这种情况发生。一个领导者加入或开始一个团队，它就会成长。团队投入度很高且功能强大，交付了许多宝贵的解决方案并进行一些有趣的工作。领导者对团队投入了时间和情感，并为他们所的工作感到自豪。然后领导者离开了，大约一年后，团队被拆分并分配给其他领导者。这种情况发生并不是新团队领导者的错。相反，是旧领导者缺乏如何领导团队（以及利益相关者）以便剩下的团队成员在领导离开后继续工作的理解。他们缺乏准备导致团队暴露在组织压力之下。很少人理解如果团队保持在一起还会剩下什么潜力，所以领导层决定不让团队保持在一起。\n\
  \n很少人理解如果团队保持在一起还会剩下什么潜力，所以领导层决定不让团队保持在一起。思考工作的传承将迫使你做出对你的团队、组织以及自己更有影响的决策和策略。\n\
  \n## 对行业产生影响\n\n安全领域有很多优秀人物——那些思想领袖、为我们指引方向的导师。我们大多数人不会是这些人。然而，尽管有日常工作，我们大多数人都可以开辟一个领域并产生持久的影响。在组织担任领导允许我们产生持久的影响。这可以帮助行业，从而帮助我们所有人。如果你想留下传承，请考虑以下几：\n\
  \n*   **在你所在的地区培养安全人才：** 这可以通过当地分会、一对一指导或建立实习计划来实现。这可以从许多方面帮助你。你所帮助的人像池塘中的涟漪一样散开，并进入其他公司。帮助这些人不仅帮助了他们，还让你对他们正在学习的内容有一些个人见解。这些人将成为你招聘管道的一部分，提高你直接团队的人才和整个行业的人才。与一群新兴人才交流可以让你与他们的思想、经验和需求保持联系，这将帮助你管理自己的团队。你对“当地地区”的定义可以根据你的需要任何小或大。有很多机会帮助举办夺旗赛（capture\
  \ the flag）和其他州、地区或培训活动。\n*   **在当地学校（如高中、社区学院或大学）教授安全/风险知识：** 学校总是在寻找经验丰富的从业人员来分享他们的知识。虽然教学可能是一项耗时的新技能，但它是非常有回报的。这些学生对安全专业或其运作方式一知甚少，有很多机会给他们新技能，并为他们提供原本无法学习或获得的新机会。他们的热情是具有感染力的，教学这一简单行为将帮助你磨练自己的技能。你可以通过与已经在做此事的其他安全人员交流开始，或直接联系学校看看有哪些机会。许多安全网络组织已经向学校派遣安全人员，所以可以将这些计划作为起点查看一下。\n\
  \n\n\n\n\n- **在非营利组织董事会任：** 通常，非营利组织的董事会代表是一个无偿的志愿者职位。在这些董事会服务是学习董事领导力和功能的绝佳方式。我们的非营利伙伴非常需要安全方面的帮助，因此花时间担任董事是回馈社区的一种极方式。你的参与可以增加社区对安全问题的普遍理解。董事会领导职位有时是通过口碑获得的，有时会公开发。再次，与你的安全网络交流，寻找担任董事会的人员，了解他们是如何获得职位的。甚至你所在的安全网络组织也有董事会，也许你可以在那里担任志愿者。\n\
  \n- **在营利性董事会任：** 这些职位更难获得，通常基于声誉和口碑。它们通常是有薪资的职位。花些时间研究你所在地区的营利性董事会。许多营利公司（以及监管机构）都意识到董事会需要安全专业人士，因此你可能会看到这些职位的空缺。考虑到许多在营利性董事会服务的人同时也担任多个董事会。如果你能帮助他们在一个董事会上更好地理解安全问题，这种理解将转化为他们对其他公司的领导——即使那些董事会没有安全领域专家（SME）。\n\
  \n- **深耕一个安全领域：** 成为某个安全领域的领域专家（SME）是回馈行业的一种有意义的方式。面对现实吧，安全行业每天都在变大，专业知识领域日益增加。如果你喜欢分析和知识创造，选择一个你感兴趣的主题并深挖。告诉人们你学到的东西，创建专注于该特定主题的用户组，并传播出去。\n\
  \n- **参与国家级小组以改进行业：** 你可以通过参与威胁情报共享，或与信息共享与分析中心（ISACs）、信息共享与分析组织（ISAOs）或政策智库合作。这些小组正在寻找经验丰富的安全从业人员来帮助扩大他们的影响力并提高他们的影响。成为行业的发声是留下遗产和开启合作之门的绝佳方式。你在这些伙伴关系中学到的东西可以立即应用于日常工作，因此虽然这是时间投入，但它也有即时和长期影响。\n\
  \n- **考虑关注需要额外支持的小群体：** 这包括少数群体、女性、退伍军人、寄养儿童、低收入学生等。这些群体在从技能开发到面试练习的方方面都需要支持。相反，招聘经理需要帮助了解如何包容且公平地接触这些群体。你与这些群体的工作将帮助你成为更好的领导者，并扩大你的招聘管道，因此再次，这项工作具有即时和长期的利益。有很多地方可以参与以帮助这些群体进入安全领域并蓬勃发展，行业需要任何可以获得的帮助！\n\
  \n## 对你的公司产生影响\n\n如果你的工作在你离开公司后仍将继续，那么你现在需要做一些事情来为这些工作的持续铺平道路。首先，影响公司意味着核心团队被识别为一个增加价值的单位。人们应该能够说：“因为安全团队，我们能够做到\
  \ X”，以及“我们需要安全团队做 Y”。安全团队应该能够回溯并说：“我们做到了”，向前看并说：“我们也可以做下一件事”。整体而言，组织和安全团队应该看到是因为安全才才变得更好，而不是尽管安全。那么，如何实现这一点呢？\n\
  \n- **接班计划：** 确保你和你的团队的每个角色都有经过培训的人员在你离开后接替。作为团队领导，拥有一个个人的继接班人尤为重要。识别一个有才华进入你职位的人。确保你的管理链知道你对该个人（或几个人）有多大的信心。如果你有一个大团队，你可能心中有不止一个人。给你的继接班人分配能够彰显他们准备就绪的任务。重点是确保你的利益相关者知道，仅仅因为你的离开并不意味着团队结构需要发生剧变。这也意味着确保你的个人功能和服务是强大的，并且作为一个集体单元良好地运作。如果它们被认为是不支持的、孤立的、脆弱的或无效的，它们可能会被其他小组移除、更改或吸收。\n\
  \n- **晋扬团队成功：** 每当你的团队获得“胜利”时，确保你从团队成功的角度来谈论它，而不是从你个人成功的角度。“看团队做了什么！”要好得多。在每个机会，确保你正在推广团队的价值，而不是个人或你自己。将团队的成功与公司的价值观和目标联系起来。确保除了你以外的人也在推广安全团队。明确大家，团队团结在一起时更强大，分散时更软弱。\n\
  \n- **推广团队历程：** 你的安全工作*永远*不会结束；总会有更多要做的事。确保你有一个团队战略、一个团队路线图和一个实现该目标的团队计划。确保你的上级和利益相关者理解，团队对于完成路线图是必要的，而路线图对于使组织成功是必要的。这将支持团队的持续工作。即使团队对齐到另一个小组或领导，目标也是让团队总体上共同运作。\n\
  \n- **推广团队历史：** 虽然你必须始终面向未来和机会，但你也不不能忘记团队之前增加的价值。继续庆祝胜利。提醒人们，胜利是建立在其他成就之上的——它们不是孤立发生的。提醒利益相关者，他们需要建立在现有团队的基础上继续构建，而不是在其他地方从头开始。\n\
  \n对于我们的一些人来说，每天出现、努力工作而不担心遗产是完全正常且合适的。如果你是这样，那太好了！对于我们其他人来说，在努力中找到长期意义是职业成长的重要部分。如果我们要在工作上投入这么多时间，它应该比我们自己更有意义。\n\
  \n## 接下来做什么？\n\n你如何影响你的行业？首先，决定你想把时间花在教学、董事服务或思想领导力上，然后执行以下操作：\n\n- 寻找那些正在你想做的人，并询问他们是如何到达那里的。\n\
  - 联系可以帮助你完成这段旅程的网络组织。\n- 准备好在日常工作之外投入时间——这将在你的正常角色之外。\n- 为自己设定一个目标——未来六个月内要做或实现的事。执行该计划。\n\
  \n你如何影响你的公司？\n\n- 继续成为公司领导层和你战略合作伙伴的伙伴。\n- 为你的职位制定接班计划，并确保你的团队和管理链理解它。\n- 尽可能让你的继接班人出现在领导面前。有意识地分配给你的继接班人项目和倡议。\n\
  - 在与对话时，确保你的战略路线图放在核心位置。经常提醒他们我们要去哪里，我们在程中的位置，以及接下来是什么。\n\nWileyPRE\n\n结记\n\n\n\n\
  \n通常，当我从导师会议离开时，往往学到了新东西，或者被提醒了一些遗忘已久的事情。这对我来说总是一件乐事且一直有用。理想情况下，这对对我指导的学员也很有用。\n\
  \n涵盖整个安全职业生涯的问题是不可能的。在本书中，我尝试解决那些常见的问题——即人们最常问且最常感到困扰的问题。每个问题领域都会引出几个后续问题，因此我希望我也涵盖了其中一些问题。\n\
  \n导师的作用绝不是给出答案；而是帮助受导师学习如何自己寻找答案。这关乎帮助他们学会如何构建问题以及如何思考问题。这关乎为他们提供背景——为什么存在这个问题，以及哪些因素导致了问题。在书中，我也试图为你这样做；我尝试以一种通俗的方式给出“为什么”，以便你能找到自己的“为什么”，并自己回答这些问题。\n\
  \n导师帮助他人找到自己的答案，因为对导师有效的方法并不总是再次有效。在任何职业（特别是安全领域）取得成功，都需要自我认知。你需要知道是什么激励你做这项工作，以及你的工作环境如何培养你的精神。在整本书中，我提供了许多资源，帮助你在深入研究特定问题时找到答案。安全行业中的许多人随时准备帮助你。我希望我帮助你找到了他们。\n\
  \n我联系了我的人脉以获取他们的意见和经验，并将它们整合到书中。安全社区的支持和投入提醒了我有多么爱这些与我共事的人，我有多佩佩他们一直所做。许多人提供了无价的建议。他们中许多人直接说：“告诉我我可以如何帮助你。”\n\
  \n我希望无论你在安全道路上处于什么位置，都能找到这些安全指南与你同行一段时间。我希望你从中从中学习，并将你学到的知识分享给他人。\n\n旅途愉快。\n\nWileyPRE\n\
