  \n这些章节中的问题是为了帮助你有计划且优雅地应对职业生涯。\n\n# 第 8 章：我如何跟上？\n\n即使在你进入安全行业工作之前，你就能明显地发现发生了巨大的变化，并且有很多东西要学。\n\
  \n技术正在发生变化。新的技术产品不断涌现。旧技术有了新的使用方法。针对新技术也有新的安全工具。这种变化正在以指数级发生。每一年技术的引入和采用速度都在加快。跟上技术是什么以及它对安全从业人员意味着什么是挑战性的。目前，我们正在关注人工智能和\
  \ 5G（仅举几个例子），并正试图找出它们为组织带来了哪些威胁，每个安全部门需要如何调整来应对这些威胁，以及这些威胁是否大到足以另一个安全目标从优先级列表中退出。\n\
  \n\n\n其次，人们使用技术的方式也发生了变化。人们工作地点、方式和时间的变化意味着组织的安全概况也随之改变。应对疫情而转向居家办公，意味着技术和安全团队必须于奔忙，以确保远程办公的安全实现。移动设备和云应用的采用使得传统的网络“城堡与护城河”安全方法变得不再那么适用（关于此点，可以在互联网上搜索“零信任网络”）。对减少纸张使用和减少物理位置束缚的愿望，改变了我们监控和响应事件的方式。\n\
  \n在更近的范围内，新领导的出现可能导致新的组织优先事项。当这种情况发生时，安全负责人及其团队也需要重新聚焦他们的安全优先事项。也许组织希望在一个新的地理区域工作。也许存在合并与收购，现在安全团队需要学习具有新技术和新法规的新业务。也许新领导想要缩减组织，那么不满的内部人员带来的威胁就会变得更加紧迫。组织的变化难以预测，应对起来也更加困难。\n\
  \n法规正在不断出台，并且变得越来越具有侵入性和指令性。法规可能来自联邦政府、行业监管机构、数据监管机构，甚至通过合同产生。新法规的出现带来了新的安全要求，这需要新的学习和执行安全职责的新方法。更糟糕的是，法规往往相互重叠或矛盾。要清楚哪些法规适用于安全人员的角色、团队或公司是非常困难的。已经出现了许多专门安全法律和合规的子行业，来帮助公司管理这些法规。有许多需要考虑的合规级别。跟上法规并非易事，而且这种需求在短期内不会消失。\n\
  \n如果你从事安全相关工作，你会被要求跟上所有这些趋势。公司不会给其安全人员留太多时间来做这件事，因此你的责任将是挤出时间和空间来持续学习。这包含两个方面：如何组织你的时间为学习留出空间，以及如何找到最佳资源以使学习尽可能高效。\n\
  \n## 将其融入你的日程\n\n在尝试跟上所有事情之前，你需要决定你的重点是什么。由于发生的事情太多，你无法无法跟上所有不断变化的安全格局。我的建议是采用“洋葱法”。即，从你所在的地方开始，并向外扩展。\n\
  \n*   你的首要目标是了解在当前工作中取得成功所需的知识。例如，如果你从事安全培训和意识职能，请找时间尽地学习如何做好那份工作。学习你日常使用的工具、需要遵循的程序以及你需要产出的报告。了解你的其他团队成员在做什么以及如何做。理解你的角色和他们的角色是如何契合的。获得在该职位成功的知识和技能——无论你的经理和公司如何定义成功。\n\
  \n*   一旦你规划好了“如何完成我的当前工作”的学习，你就应该拓宽视野，关注其他与行业相关的项目。例如，如果你担任事件响应员，开始学习事件响应领域的当前行业问题，例如通过阅读威胁情报馈送、创建和管理剧本（playbooks）或行业标准的事件响应工具。你应该了解该领域的领先思想者，以及在事件响应中提供安全工具/产品的供应商。你应该了解这些供应商的优缺点。\n\
  \n*   考虑相邻领域，并计划至少学习足够的领域知识以便能够进行交流。例如，如果你进行第三方风险评估，请学习渗透测试（也称为`道德黑客`）。理解被动测试和主动测试。了解这些角色如何与自己的角色对齐。\n\
  \n*   一旦你了解了自己的角色并对相关的行业问题了如指，就是时候考虑你的下一个职位了。在这个工作之后你想找什么样的工作？为了做好准备，你需要学习什么？下一个职位可能是你目前职位的提升，因此学习更多关于你当前职能知识会很好。你可能想转到不同的安全角色，因此将学习新职能纳入你的学习计划中。如果你不知道下一步是什么，选一个看起来有趣的东西并学习它。学习更多没有坏处！\n\
  \n*   无论你的角色、行业或资历如何，你都应该始终花时间学习时事。了解行业热点将帮助你在当前工作中脱颖而出，并帮助你看到未来的职位可能是什么样子。跟上当前的事件、新兴的安全趋势以及非安全媒体上出现的新闻，将有助于你的当前工作，并在寻找下一个职位时提供帮助。\n\
  \n*   了解历史。虽然某些安全相关的话可能看起来新颖且独特，但我们也看到了许多重复的行为。了解过去将帮助你更好地为未来做计划。\n\n在这些学习类别中，你可以挑选主题，并花两周或一个月的时间尽所能学习。一旦你完成了计划要学习的内容，就转向下一个目标。\n\
  \n一旦你列出了想要关注的事务清单，你必须找到一种方法将学习时间挤进你的日程表中。大多数公司乐意支付某些形式的正式培训，让你上课或参加年度会议。公司越来越多地与提供按需学习的在线学习资源签约。虽然许多公司不提供任何类型的培训，但你绝对应该利用公司为你提供的任何培训。请确保它尽可能与你的关注领域保持一致，尽管依靠一年一次的培训不足以保持安全问题和关注点的最新状态。\n\
  \n## 随性学习与计划性学习\n\n为了让这一切运作，你需要结合随性学习（ad hoc learning）和计划性学习。随性学习是你从某些简单的事情中随机获取信息，例如在上班路上听安全播客，在散步狗时，或在吃早餐时。它也可能意味着在社交媒体上关注特定的安全领域人士（下文将有更多介绍），并浏览动态以查看看起来有趣的内容。\n\
  \n> 随性学习不需要专门的专注和深度思考。\n\n随性学习是一种被动吸收涵盖广泛主题的高层次信息的方式。这对于了解时事或行业趋势非常有益。\n\n计划性学习需要专门的思考时间来学习和吸收。在工作日历上挤出时间学习更多如何完成你的当前工作显然是合理的。如果你的角色允许，找到工作日历上的空闲时间并锁定，以便你可以阅读关于你所在的行业甚至你的下一个职位的内容的内容。有些人喜欢每周安排一个小时左右的时间，并将这一小时专门用于阅读与那些主题特别相关的文章、书籍或社交媒体馈送。有些人利用这段时间在他们的家庭实验室或工作沙箱中积极练习技能。\n\
  \n\n\n\n你在行业内的时间越长，就越会意识到你需要学习的内容无法简单地包含在每周 40 小时的工作周内。有些人能做到，但我们大多数人会在工作时间之外抽空进行学习。如果你无法在标准工作周内学习，我建议你制定一个结构化的学习计划。也许你可以在早起阅读一小时，或者在睡前阅读或观看一小时的在线内容。也许你可以在周末花专门的时间在实验室里工作。你可能决定在个人休假期间参加安全会议或观看虚拟活动。\n\
  \n## 开启一次“微休假”\n\n这是最后一个建议：每季度一次，如果可以的话，请假一整天，专注于你的学习并评估你的职业计划。你可能需要这段时间来补上那些你想学但没时间学的东西。很多公司会允许你在工作时间休这一天。如果不行，可以考虑将其作为事假。这种从其他工作生活中抽离的感觉将是一次小假期，你能够让大脑投入一整天不中断的学习中。这种投资非常值得。\n\
  \n我并不是建议你把清醒着的每一秒都在思考安全——那样不健康。相反，我建议你规划你想学的内容，并为你的学习安排结构化的时间。这样，你就可以安心地知道自己正在留时间跟上行业发展，并为下一个职业阶段做好准备。\n\
  \n## 我在哪里可以找到信息？\n\n即使对于经验丰富的安全专业人士来说，寻找并整理安全信息也是一项挑战。外界信息太多了。当你刚接触这个领域时，知道去哪里寻找高质量的信息是很的。当你建立起资源库时，情况会变得容易。考虑以下几点：\n\
  \n* **与你的团队交流**：在公司内部建立人脉对你现在的工作和未来的角色都有处。在与团队交流时，问问他们使用哪些资源。他们在社交媒体上关注谁？活跃在哪些社交媒体平台？他们推荐你阅读哪些安全网站/杂志/书籍？公司里谁是优秀且知识丰富的资源？他们有任何关于你感兴趣的主题的书可以推荐（甚至借给你）吗？\n\
  \n* **自学**：挑选一些在线课程并参加。判断你是否觉得它们很有用（如果有，就多上一些同一公司的课程）。当然，如果你发现某门课程没用，就应该警惕参加同一公司提供的其他课程。这些课程通常会推荐其他资源，所以要利用它们。找关于你感兴趣的话题的书，并花时间阅读或听它们。（如果你没时间静着，听声书很棒。）大多数资源都会给你关于其他资源的建议。遵循它创建的学习路径即可。\n\
  \n* **会议和专业训练营**：这些本身就是学习机会——非常棒。你还和许多许多其他人待在一起，可以与他们建立人脉并分享想法。当在上课或排队买午餐时，问问人们使用什么资源来学习你感兴趣的话题。\n\
  \n* **分析师资源**：通过付费，有一些安全分析公司会提供关于安全的研究文章。\n\n* **安全出版物**：刚开始，很容易认为你面临的压力是因为你——以及你缺乏经验或技能——而且通常，情况确实如此。好消息是这是一个可以解决的问题，周围的人也预感到你会面对这个问题，所以他们可能会帮助你应对。还有很多资源可以帮助你应对学习新事物的压力。\n\
  \n* **社交媒体**：在职业生涯初期，压力通常是由工作量引起的。也许你有太多工作要做，而且你不确定如何划分优先级。也许你还没有学会如何与经理协商工作量。有时，压力是因为你还没有学会如何让分配的工作尽可能简单，技能缺口带给了你压力。你仍在学习行业工具以及如何在你的组织中完成工作。这种组合有时会让人措手无策。\n\
  \n## 接下来怎么办？\n\n* 花时间决定你想如何关注。\n* 花些时间在你的日历上标注时间块。\n* 如果必要，安排时间听或看视频。\n* 与你的团队交流，问问他们从哪里获取信息。\n\
  \n***\n\n# 第 9 章\n\n## 我如何管理压力？\n\n首先让我承认，压力本身并不是坏的。压力也可以是积极的。良好的压力可以帮助我们表现得更好、达到更高的目标、移动得更快。它可以带给我们能量并激励我们。这一章不是关于那种压力。在本章中，我们将讨论负面压力——那种提高你的皮质醇水平、让你感到焦虑并通常消耗你精力的压力。\n\
  \n在职业生涯初期，压力通常是由工作量引起的。也许你有太多工作要做，而且你不确定如何划分优先级。也许你还没有学会如何与经理协商工作量。有时，压力是因为你还没有学会如何让分配的工作尽可能简单，技能缺口带给了你压力。你仍在学习行业工具以及如何在你的组织中完成工作。这种组合有时会让人措手无策。刚开始，很容易认为你面临的压力是因为你——以及你缺乏经验或技能——而且通常，情况确实如此。只有时间和坚持才能解决这个问题。好消息是这是一个可以解决的问题，周围的人也预感到你会面对这个问题，所以他们可能会帮助你应对。还有很多资源可以帮助你应对学习新事物的压力。\n\
  \n一旦你工作了一段时间，并精通了目前的工作，引起压力的事宜就会发生变化。现在，引起压力的事情将不再由你的缺乏经验引起；相反，随着你与更多的人互动，并开始看到你的组织如何管理引起压力的事件和流程。\n\
  \n> 拥有几年经验后，压力的来源从内部转变为外部，应对压力的方法也会随之改变。\n\n现在，你面临着做出更困难的决定。你不能仅仅通过学习来解决问题（或离开！）。你需要有主见、耐心并具有战略眼光。\n\
  \n\n\n\n如果你在任何职业工作足够长时间，你就会体验到压力。压力有许多形式，而且你会经历其中大多数。压力不仅会影响你的工作，它还会影响你的个人生活、家庭和健康。只需在互联网上搜索\
  \ `managing work stress`，你就会发现成千上万篇文章。这是一个慢性问题！\n\n## 安全工作的压力\n\n安全工作有其独特的压力来源，但为什么它会特别压力大呢？\n\
  \n*   安全专业人士是布道者。他们相信安全是任何组织成功的不可或缺的一部分，并认为自己的角色和提供的功能对于实现组织使命至关重要。这种将安全置于其他目标之上的倾向会导致与非安全人员产生误解和冲突。这导致安全人员称客户为“愚蠢”，并且通常意味着完成任何事情都比预期要长。安全人员理解，实施安全控制可以让公司运行得更快。而非安全人员则认为安全控制是通往成功之路上的减速带。因此，完成工作往往比预期的要长时间。安全人员在开始讨论安全需求或解决方案之前，必须花时间处理客户的心理。非安全人员则感到自己的工作目标与往往冲突的安全需求之间存在紧张关系。这种脱节让每个人都感到沮丧。\n\
  \n*   非安全人员不理解安全是什么或在做什么。它似乎是一些模糊的技术性的、神秘的活动，只有在发生坏事情时才被召唤。这导致安全人员被排除在战略或一般的业务规划会议之外，只有在最后一刻才被用来修复问题，而如果在此过程早早咨询安全意见，这些问题处理起来会更便宜、更容易。这意味着安全团队花在“救火”上的时间比交付计划的安全改进要多。而且这意味着非安全人员必须停止手头的工作来关注安全，而他们本更想做那些付钱让他们做的事。\n\
  \n*   安全是需要资金的，而且通常很难将这笔钱直接追踪到组织的收入，这导致缺乏高层的支持。一些领导亲眼目睹了数据泄露的影响以及出错时对公司的负面影响。他们认为安全就像保险一样——一种需要资金的必要恶，而不是业务价值的战略性推动者。他们不想在安全上花钱，因为他们认为花钱保护某些可能不需要保护的东西没有意义。这是典型的冒险心理学。人们会将困难的决定推迟到被迫面对时才，这意味着安全团队长期资金不足。对于安全人员来说，这就像看着慢动作下的车祸发生。他们能看到即将发生的影响，但却无力阻止。这意味着当坏事不可避免地发生时，安全团队可能可以说“我早告诉你们了”，但随后他们必须用有限的资源跳进去修复问题。无论说“我早告诉你们了”有多有感，这句话都不会让任何人感到好受。\n\
  \n*   因为安全不是从一开始就构建在工具或服务中的，安全控制是在事后补上的（如果补了了话）。这些安全控制对客户体验产生了负面影响（更多的点击、更多的密码和更高的成本），并且往往在客户表现出担忧时就被抛弃。通常，抢夺市场意味着安全性降低，这导致安全团队必须说服合作伙伴和客户这种不便是值得的。因为客户和合作伙伴不相信风险迫在眉睫或具有影响力，这种话很难说服。\n\
  \n*   当安全做得很好时，什么都不会发生。当安全做得很好时，坏事可能还是会发生。这种二元性对现有安全团队的价值提出了质疑。没有人喜欢被质疑，但安全团队面临被质疑的方式是其他职业所无法比拟的。\n\
  \n*   在安全行业中，我们寻找并发现正在发生的坏事。我们寻找恶意软件、勒索软件和妥协指标。我们被告知内部人员正在进行可疑或非法行为。我们收到关于国家级攻击的告警。我们花时间思考可能会出现什么问题，以及如果发生了影响会有多糟糕。我们把这些都留存在心里。为了安全考虑，也为了保护人们免受不必要的担心，我们不在安全团队之外分享这些内容。当其他人真的听到我们所知道的事情时，他们会问：“你晚上怎么睡得着觉？”\n\
  \n*   安全人员很难关闭大脑并离开工作。对手是 24/7 不断歇工作的，所以即使在不在工作时，我们也倾向于思考安全事务。永远不关机并进行所需的心理和身体休息太容易了。\n\
  \n所以，你就是这样，一个技能熟练的安全专业人士，利用你的技能和经验帮助组织保护其信息和系统，而组织却在反弹——安全太慢、太贵、太难理解。组织不断向你反弹，直到发生坏事发生，那时你的专业技能可能会受到质疑。换句话说，你做有死，不做也是死。\n\
  \n这种压力在你被投入某种境地就会显现，你必须试图影响那些不想花钱、不想改变或不理解风险的人。换句话说，几乎每个级别的每个安全人员迟早都会面临这种脱节的鸿沟。\n\
  \n除了所有常见的压力之外——过多的优先级、工作与生活的平衡、讨厌的同事和不干练的管理——安全人员还必须叠加安全压力。你确定想在这个行业里工作吗？\n\n##\
  \ 管理安全压力\n\n如果你要在安全领域工作，你将需要学习管理这种压力。你必须比其他人拥有更高的情商。考虑阅读丹尼尔·戈尔曼的书《情绪智能》，帮助你磨练自己的\
  \ EI 能力。你将需要花时间与他人合作并帮助他们理解你的来意。你还需要花时间改变他们对你以及安全议程的看法。你需要通过饮食、运动、睡眠和其他策略来照顾自己，并且处理房间里的“安全大象”。而且，无论你如何努力，如果有些人不理解安全，你需要学会放弃。这不仅仅适用于安全领导者。每个从事安全工作的人都需要管理安全压力。以下章节包含了一些建议。\n\
  \n### 教会他们\n\n安全压力通常是由非安全人员不知道你在做什么引起的。这是一个相对容易解决的问题。找到你的客户和你最近的 IT 合作伙伴，花时间和他们在一起。了解他们在做什么，并告诉他们安全如何支持他们的工作。让他们知道安全团队如何助力他们的最佳工作、防止他们的系统在最糟糕的时间不可用并确保他们不会被监管机构罚款（或坐监狱）。与他们分享你是如何工作的，以及成为这样的安全专业人士需要什么。如果他们能更好地理解你的角色，你也能更好地理解他们的角色，他们更有可能在需要时支持你。这比任何方法都能更好地缓解压力！\n\
  \n\n\n\n有时候，很难记住你周围的大多数人都想成为一个好的伙伴——他们只是不知道如何做。请假设他们的初衷是积极的。这些人并不是那种让你咬牙并需要通过自我药物来缓解压力的喧闹者。他们是那些沉默的人，他们只是在做自己的事情，而没有过多考虑安全问题。不要假设他们能魔术般知道你的工作是如何完成的。他们忙于尝试完成自己的工作。相反，要主动联系并帮助他们理解你的角色。这需要人际关系，因此要有策略地选择接触对象。你需要进行一对一讨论，可能是在喝咖啡或吃午饭时。这个人可能是你的主要合作伙伴，也可能是一个“社交连接者”，他们会向其他人传播你的工作。时间是宝贵的——请明智地使用。\n\
  \n### 寻找共同原因\n\n“我今天去上班，并让我的产品/服务/公司成为有以来最安全的！”这句话没有人说过这种话。如果你是一个安全人员，不要和别人谈论安全目标。他们根本不会足够关注，到让对话产生意义。相反，找出对他们重要的事情——产品发布、成本管理、新市场、服务器构建等——并将安全工作与这些目标重叠。\n\
  \n有时，人们会将你排除在重要的讨论之外，只做满足安全要求的最低限度，并做出导致你或你的团队工作量增加的决定。当你遇到这样一个特别难以相处的人时，尝试专门关注那个人。找时间与他们会面，询问他们以及他们的非安全需求。理解他们的“为什么”。理解是什么以及谁在激励他们——他们的目标和愿景——以及他们是如何工作的。\n\
  \n一旦你知道了他们的出发点，就针对那个“为什么”来定制任何信息传递。如果他们关心服务的可用性（不宕机！），那么就谈论安全如何支持系统可用性。如果他们关心成本，就谈论及早介入安全如何保持低成本。如果他们关心上市时间，让他们知道及早介入安全将防止返工和浪费时间。\n\
  \n通常，特别是在与 IT 合作伙伴合作时，安全由于“客户体验”的名义被忽视。这是一个虚假的二元对立。处理这种压力的方法是找到讲述*因为*安全需求而产生积极客户体验的故事。例如，一家公司实施了安全框架，要求网络工程师对他们的\
  \ IP 地址进行清点。起初，网络组抱怨不断。然后他们执行了，并发现了一些可以释放和重复使用的陈旧 IP 地址，节省了金钱和时间。另一家公司实施了多身份验证。客户服务团队担心增加登录步骤会带来负面的客户体验。当客户发现他们可以使用相同的界面进行个人安全管理（银行等等）时，他们将其视为一种帮助自己的积极行动。寻找此类示例，并在你与\
  \ IT 合作伙伴及其他人的交谈中使用它们。\n\n### 向他们提供建议，然后让他们自己决定\n\n大多数安全专业人员面临的挑战是，我们真的、真的非常相信我们的观点是正确的，并且忽视我们的建议会导致糟糕事情的发生。虽然这可能是事实的，但这种观点没有考虑到组织中的其他人在做出选择时必须权衡许多因素。安全只是许多因素中的之一。归根结底，实施安全控制或资助安全倡议的决定是由他们做出的业务决策，而不是由安全团队。\n\
  \n确保你组织中的决策结构能够让正确的人成为决策者。例如，如果决定不修补服务器上的漏洞，是谁做出的决定？是服务器管理员吗？是使用该服务器的所有者吗？是使用服务的业务副总裁吗？如果有异常流程，由谁来批准该异常？根据你在组织中的位置，如果治理结构已经坏了，你可能没有权限修复它。尽你所能，然后通过适当的管理渠道提出你的疑虑。\n\
  \n如果你建议了一项行动方案而他们拒绝了，或者他们接受了异常并由他人批准了，这没关系。不要针对个人，不要让被拒绝的建议让你觉得你的价值总是被忽视。（参见第 14\
  \ 章“我如何知道该离开了？”）无论如何选择，你的工作做得很好。\n\n### 以原则为引领\n\n在我的安全职业早期，我尝试通过指标和基准来证明安全的成本和设计。这在逻辑上是正确的，任何\
  \ MBA 毕业生都会同意。问题在于，对于大多数组织来说，安全不是收入来源（除非你在安全公司工作）。它看起来像是一个成本中心，而且当什么都没有发生时，证明安全的投资回报是非常困难的。\n\
  \n基准或指标本身没有本质问题。即使你找到了完美的指标，它也不应该是讨论的焦点。相反，你需要在分享你的原则——安全的“为什么”——在尝试说服他人为安全投入时间、资金或人员之前。（西蒙·斯涅克的书籍《从为什么开始》是一本可以帮助你构建自己“为什么”的好资源。）所以，如果你的“为什么”是可用性，那么就讲述安全如何确保技术系统在需要的地方可用。如果你的“为什么”是数据保护和隐私，就讲述你的计划如何确保人们信任公司的行为。\n\
  \n非安全人员不需要了解安全是如何工作的；他们只需要同意安全的存在——你的角色的存在对他们很重要。\n\n### 去睡一会儿吧\n\n安全领域总是有可怕的事情发生。关注所有的泄露、国家级攻击和内部威胁已经足够让你\
  \ 24 小时无法睡眠了。但你需要能够远离这些并充电。清楚地知道你能做什么，不能做什么，并确保你正在做你能做的事。让剩下的过去吧。如果你已经做了你应该做的，那么无论外界持续嘈闹如何，你都可以安心入睡。如果你已经向公司分享了安全疑虑，而公司仍然选择接受风险，那么你就完成了工作。去休息吧。\n\
  \n这些策略对于初级安全分析师和高级安全主管来说同样适用。创建能够理解你们的“为什么”的合作伙伴，有助于管理你的安全压力。谁又不需要这些呢？\n\n## 接下来做什么\n\
  \n*   与能够帮助你管理安全压力因素的人建立联系。\n*   控制好基础：睡眠、运动、饮食等。先照顾好自己。\n*   审视你的工作状况。你能识别压力的来源吗？技能短板？困难的同事？工作文化？还是以上所有？\n\
  \n\n\n\n*   计划有意识地改善/消除压力。在接下来的几个月里尝试一下。\n*   定义你工作的开始和结束，以及哪些是你个人可以负责的。确保你没有承担你职责范围之外的安全事务责任。\n\
  *   与你的人脉网络交流。他们经历过这种事情吗？如果是，他们是如何处理的？\n\nWileyPRE\n\n# 第 10 章：作为少数群体，我如何才能成功？\n\
  \n安全行业面临着问题。这既是一个形象问题，也是一个系统性的功能问题。劳动力过于同质化了。它主要由男性组成，在大多数国家，它是由白人和异性恋的顺性别男性构成的，这在很大程度上与总人口的比例严重不符。非\
  \ `cis-male`（顺性别男性）、非白人或非异性恋的安全工作人员必须采取额外行动，以确保他们是因为自己的工作而被聘佣、培训、纳入、晋升和重视，而不是因为（或尽管）他们的非多数群体属性。\n\
  \n这种不平衡的影响是重大的。当青少年在初中没有将自己视为技术部落的潜在成员时，他们就会放弃那些可能通往传统安全职业道路的课程。当女性女性听到男性主导的安全工作故事时，她们会选择不同的职业选项。当从事安全工作的少数群体人士在领导团队中看不到自己的影子时，他们会离开行业，去往他们能看到自己的地方。这导致我们的招聘管道太小、流失太严重。它的深度和宽度不够，因此我们正经历着劳动力短缺。这让已经在行业内的人面临压力，必须工作更长时间，用更少的资源做更多的事。这给招聘公司带来了压力，而且人才战是耗资巨大的的。这意味着安全团队内部思维的多样性较低——而我们需要多样化和创造性的思维来解决当今的安全问题。最后，这为那些希望自己的贡献被重视和赞赏、并且必须担心工作环境的少数群体员工制造了压力。\n\
  \n其他类型的“少数”身份也会影响一个人的成功能力。年龄、婚姻状况、残障状况、父母身份、地点和教育背景也可能在某人融入现有文化的难易程度方面发挥作用。在安全领域，还有技术与非技术的二元对立需要处理。这些也可能影响白人异性恋男性。在职业生涯中，我们很少有人能完全免疫某种形式的偏见，这种偏见会让成功变得更加。\n\
  \n对于在安全领域工作的少数群体来说，这意味着什么？每个人的情况不同，但这里是一些可能意味着的内容：\n\n*   成为安全团队中唯一的少数群体身份者，你的表现不仅取决于个人表现，还通过他人对你的性别、种族或其他少数群体归属的认知来判断。\n\
  *   被要求在组织内或外代表你的少数群体，这为你本就繁重的工作增加了负担。\n*   在辅导或绩效评估期间，收到的绩效反馈较不直接且实用（如果你是女性的话）。\n\
  *   努力在融入大多数人的工作文化的同时，保持自己原有风格、价值观和传统的真实性，而这些元素可能与多数派并不一致。\n*   如果你是少数群体员工，在晋升前会被要求证明自己已准备好承担更高职位；而如果你属于多数群体，则根据预期的能力被赋予职位。\n\
  *   根据你对他们支持少数群体问题的理解，来评估新公司、团队和职位，这些支持通常在纸面上看起来很好，但在你入职后才会显现出来。\n*   获得工作或晋升后，却被其他人（有时是你自己）质疑你获得它是因为你是“最佳候选人”，还是因为你是“少数群体候选人”。\n\
  \n这听起来让人压力倍增。好消息是，行业内的许多人已经意识到这个问题并正在努力解决。改变的责任在于多数群体，他们要支持对少数群体员工的包容性和公平，许多人已经在做这项工作了。这需要很长时间，因为问题的根源在于安全行业之外，在于我们所生活的社会文化中。文化的改变是困难的。但安全行业、公司和经理可以采取步骤来改善状况。（更多信息，请参见第\
  \ 19 章，“我如何鼓励多样性与包容性？”）与此同时，少数安全专业人士拥有帮助他们在当前环境中成功的资源。\n\n## 让安全工作为你服务\n\n如果你不成为同事、合作伙伴和潜在对手组成的更大生态系统的一部分，你在职业上就无法生存。你必须找到一种成为社区一部分的方法，并对自己的所有权负责。否则，你最终会精力竭并离开。如何做到？没有正确的方法（当然了！），但这里有一些想法。\n\
  \n### 寻找你的社区\n\n如果你不在一家有员工小组的公司工作，即使你在那里，你可能发现加入一些促进和支持多样性的外部组织是有用的。网络安全女性协会 (`WiCyS`)、国际少数族裔人士联盟\
  \ (`ICMP`) 以及其他小组为雇主和员工提供资源。为什么要加入此类小组？\n\n*   这些小组中的人通常与你有相似的经历。当你面临挑战时，他们可以成为你的同情倾听者。他们可以提供你可以用来解决问题的解决方案。当工作遇到困难时，很难判断这是因为你自己的弱点，还是由于偏见和/或缺乏包容性。在你的工作场所之外有一群人可以给你提供一些视角，帮助你应对这个问题。\n\
  *   这些小组是极佳的人脉网络，可以帮助你寻找机会或扩大影响力的方法。最重要的是，当你需要时，他们可以支持你。\n\n### 成为倡导者\n\n我不喜欢少数群体成员被要求完成让组织其他部分更具包容性地思考和行动的工作。然而，我也知道，除非少数群体与权力集团互动以改变他们的行为，否则事情将不会发生。作为少数群体的挑战之一就是平衡这些想法。更糟糕的是，在某些特别有毒的地方，成为代表少数群体发声的人被视为一种限制职业发展的行为。你必须了解你的环境并采取相应的行动。\n\
  \n我们可以用一种非对抗性的、专业的、且不疏远他人的方式为自己的需求发声，并表达我们的价值观。例如，我们可以做以下事情：\n\n*   在团队、子组织或整个公司范围内主导多样性倡议。当然，较大的机构可能已经有了首席多样性官或类似的职位。了解他们在做什么，以及你可以如何参与其中。如果他们或你的团队似乎没有关注多样性问题，向你的经理提议你愿意承担这项工作。\n\
  *   通过在公司内部或安全社区公开演讲来代表我们自己。主题并不非要是关于多样性和包容性的。事实上，消除对少数群体负面刻板印象的最佳方法之一就是讨论技术/核心专业问题。曝光本身就是一种倡导行为。\n\
  \n\n\n\n\n如果你不喜欢在大家面前表现，那么成为一名一对一的倡导者是一个极佳的选择。\n\n*   向那些寻求帮助的人提供建议，是帮助他人走好旅程的绝佳方式。成为其他少数群体的导师，特别是在安全团队以及相关的职能部门中。（招募更多少数裔加入安全领域是一件好事！）\n\
  *   帮助“盟友”伙伴具有巨大的影响力。如果你认识大多数群体中的某人正努力成为一名盟友，请联系他们并提供你的支持。在他们需要时，随时准备提供帮助。\n\n谈论对你重要的事情是通向权力的重要一步。但要小心，这种工作*不是*一种爱好——它是工作，你应该确保自己作为有偿工作的一部分被给予空间去完成。在承担额外工作之前，额外的时间、额外的信誉和额外的薪酬都是值得谈判的好处。\n\
  \n### 寻找你的职场盟友\n\n在我工作过的每一个地方，我都曾遇到过负面情况，因为我在一个男性主导的文化中是一名女性。而在那些同样的地方，我也发现了一些男性赞助人、导师、伙伴和朋友，他们帮助我渡过了那些挑战并最终获得了成功。虽然在一个公平且包容的文化中工作会更理想，但我们与人共事时，他们会带着自己的个性、偏见和文化。\n\
  \n寻找职场盟友从与你一直共事的人开始。他们不需要在你的直接团队中；他们只需要知道你是谁、你是做什么的。与你认为可靠的人建立关系。不要只停留在一个人。寻找一个团队——你自己的“董事会”——他们可以作为你的智囊团，并对出现的情况的情况提供清醒的建议和反馈。如果他们属于你的少数群体，那太好了。但有时你可能没有这个选择，所以不要将自己局限于那一个群体。\n\
  \n如果你在较大的机构工作，可能会有一些关注你所关注问题的员工网络小组。科技女性（Women in Technology）、LGBTQ 组织以及科技领域的有色人种（People\
  \ of Color in Technology）只是你可以加入的一些小组。虽然内部网络小组可能不是针对安全领域的，但它们是一个可能遇到过相似挑战的人群。\n\n\
  找到你的个人支持团队，在需要时支持你。我向你保证，他们是存在的。\n\n### 考虑替代方案\n\n我曾离开过一个特别压力巨大的职位，由于该组织男性化文化对女性领导者的认知方式，这种压力变得更加巨大。离开是一个艰难的决定，但事后看来，这是一个正确的选择。后来，一位同事评论道：“你必须扭曲自己的性格才能在那里工作。”他是对的。直到我离开，我都没有意识到在一个必须为了迎合主流文化而改变行为的环境中工作，我承受了多大的生理和心理压力。\n\
  \n如今，你无法将工作生活与个人生活分开。所以，如果你觉得必须隐藏真实的自我才能在那个地方工作，或者你不断面临着不合理的障碍，请考虑其他选择。这可能无法立即实现。找到一个值得付出努力离开的好职位需要时间。但要赋予自己力量，去寻找合适的职位。\n\
  \n我们将继续向着多元化、包容和公平的职场取得积极进展。在此之前，我们需要坚持自我，并确保我们工作的地方支持我们的个人以及我们周围的人。坚强！\n\n### 下一步是什么？\n\
  \n*   找到你的支持网络。如果你目前网络中不包括那些可以让你舒服讨论这些问题的人，请考虑扩大你的网络。在组织内外寻找可以成为你盟友的人。\n*   考虑你在管理公司多样性、包容性和公平性问题中的角色。你想成为一个发声的倡导者还是一个沉默的倡导者？\n\
  *   评估你目前的工作环境，特别是你的经理。你感到被支持吗？你被包含了吗？你受到了公平对待吗？如果没有，你愿意为此做什么？你能影响改变吗？是时候考虑离开或从内部推动改变了吗？\n\
  \nWileyPRE\n\n# 第 11 章：我如何进步？\n\n当我们还是学校里的孩子时，不可避免地会遇到那种清楚自己长大想成为什么的人。他们在追求那任何目标时都是坚定不移的。他们上了所有正确的课程，参加了所有的夏令营，获得了相关的实习，并通在职业生涯中非常有目的地地前进。而我们剩下的这些人，对于想找什么样的工作，或者完全没有清晰的头绪，不知道如何从一个阶段移动到另一个阶段，也不知道如何知道自己是否正处于正确的道路上——如果真的有路的话。\n\
  \n谈到追求成功的安全职业时，大多数人仍然处于这两个阵营之一。有些人很早就想成为一名伦理黑客。有些人知道运营合规团队正是他们人生的角色。有些人知道他们的目标是成为一名\
  \ `CISO`。然后是我们这些人，模糊地想要“在安全领域工作”。到了那里之后，我们不确定下一步想去哪里。我们可能想成为一名专注于漏洞管理的安全工程师，或者我们可能想领导安全意识和培训计划——两者看起来都不错。我们可能会看到一个我们非常想为之工作的经理——所以我们对具体担任什么种角色就不那么挑剔了。即使对于高级安全领导者来说也是如此。有些人有一个正在忠实执行的职业计划。另一些人仍然不知道长大后想成为什么。\n\
  \n当某人在某个职位上工作几年后，他们会开始问自己如何才能进步，当然，这没有简单的答案。但有些事情是需要考虑的。\n\n## 安全之旅\n\n无论你处于哪条路径上，请将你的职业生涯看作传统的学徒制阶段。\n\
  \n*   在开始阶段（前三到五年），你是一个学徒——主要在工作中学习你所需的技能。即使有学位，前几年也花在理解什么是安全。通常，你做的是运营性工作，项目性工作较少。你通常在负责教你技能的人旁边或下面工作。\n\
  *   在大五年后，你成为一名熟练工。通过更独立的工作，你开始专注于某些类型的安全工作，并通过承担不同的项目来磨练技能。你可能开始教初级人员，即使他们不向你汇报。你更多地接触安全社区，向他人学习而不仅仅是自己的公司。但你还没有准备好被称为“专家”。\n\
  *   专业知识需要时间。即使在技术/安全这样快速发展的行业，成为专家也不是一蹴而就的。通常，这发生在行业工作 10 到 20 年之后。哦，你可以在比 10 年短的时间获得\
  \ `Director`、`VP` 甚至 `CISO` 的头衔，但真正被视为“专家”（如果有这样一个沉重的词的话）所需的经验不能一蹴而就。作为专家，你不仅仅是一个功能专家；你还是公司（如果公司足够大）或你所处领域的思想领袖。你教他人，并被视为信息来源而被寻求。\n\
  \n你处于职业生涯的哪个阶段？你如何进步到下一个阶段？\n\n\n\n\n如果你目前在一家较小的公司工作，你可能已经是一个通才型人才了——大多数小公司负担不起过于专业的人才。你可能需要从事许多不同的工作——漏洞管理、配置管理、安全测试和事件响应。这很棒，但也许“浅尝辄止，博而不精”并无法让你获得足够的职能经验来跳跃到下一个水平。相反，如果你在一家大公司工作，你可能只专注于一或两个职能。你可以深入谈论一个职能，但在其他领域却完全零经验。如果你想留在这些职能上，那很好，但这会限制你在其他领域担任角色的能力。所以，无论公司大小，无论通才还是专才，你该如何为下一次机会做好准备？\n\
  \n### 跟上安全问题和趋势\n\n有海量的资源可以帮助你跟上安全问题的潮流，如果你是一个通才，这些资源可以帮助你深入研究你已经熟悉的话题，包括杂志、博客、播客和会议。每周花时间涉入其中任何一种资源并随便看看。在散狗或开车时听听播客。订阅杂志和精选的数字来源，让它们每天给你发送摘要，并在早上开始工作前阅读它们。在会议上，参加你专业领域之外的话题，只需听听人们在讨论什么。\n\
  \n你可能会发现特别感兴趣的内容；尽管顺着那个话题深入“兔子洞”。阅读文章中的参考文献，在谷歌上搜索该话题，或者给书籍或文章的作者邮件询问更多问题。利用社交媒体对你的社区进行关于该话题的“投票”——他们总是会教你新东西！\n\
  \n> 你可能会发现某些看起来很糟糕；那么，现在你知道不要再继续追寻它了。了解你不喜欢的和了解你喜欢的同样重要。它可以帮助你缩小对可能考虑的下一个工作的思考和选择。\n\
  \n不要只学习你已经知道的东西。相反，去寻找你不知道的东西。如果未知的事物令人敬畏，从与你当前领域相邻的事开始。例如，如果你在从事应用安全，可以多研究容器、API\
  \ 安全或渗透测试。如果你在从事事件响应，考虑更深入地研究威胁情报或加密解决方案。查看安全思维导图，看看其他职能被视为“安全”的一部分，并追踪其中一条路径。\n\
  \n### 人脉网络\n\n结识安全领域的人是获取机会的最佳方式。他们可以让你知道他们正在做什么，未来会有什么，以及他们看重哪些技能。\n\n了解你公司中可以帮助你转到不同或更大角色的人。这从你的直接经理开始——他们需要知道你何时准备好尝试新事物，或者正在考虑尝试新事物。如果他们不愿意帮助你进入新职位，问他们为什么。也许他们认为你还没准备好——即使你不同意，这也是一个重要信息。经理应该一直是你的倡护者。如果你发现当你准备好变动时，他们却想让你留在目前的职位，请考虑找一个新经理！\n\
  \n考虑有意识地与公司中不属于你直接团队的人建立人脉。了解他们是做什么的，并让他们知道你是做什么的。选择能够帮助你在公司内职业发展的人，并让他们知道你正在朝着你的下一个目标努力。如果你的公司足够大，寻找有影响力的安全领域领导者。如果你的公司很小，寻找了解你工作的首要合作伙伴/客户。这些人可以尽早识别出潜在的项目或工作机会，并为你争取支持。他们将为你开启机会之门。\n\
  \n最重要的是，与公司外可以帮助你找到下一个目标的人建立人脉。如果你在一个有活跃安全社交小组的地方，从那里开始。通常，安全人员非常慷慨，愿意分享他们的技术技能和专业人脉——利用这一资源。如果你真的准备好从当前职位变动，告诉这个社区。如果他们听到新消息，会很快通知你，更好的是，如果你需要，他们很可能会担任你的推荐人。如果你是远程办公人员或没有很多本地社交小组，请利用社交媒体作为你的优势。在\
  \ LinkedIn、Twitter 和其他平台上关注他人，将帮助你建立联系，在争取下一份工作时，这些联系可以增加你的知识并提高你的市场竞争力。\n\n###\
  \ 考虑认证\n\n如果你不知道下一个想做什么角色，应该拥有什么证书？考虑获得通用的行业认证——来自 `ISC2` 的 `CISSP`、来自 `ISACA` 的\
  \ `CISM`，甚至是来自 `CSA` 的云安全认证。避免获得一堆“字母汤”式的证书——过多的证书表明你并没有在应用所积累的知识。然而，拥有几个核心认证是开启大门或在别人为你打开门时做好准备的好方法。\n\
  \n小心——并非所有认证都是同等的。（更多细节，请查看第 4 章“我应该参加什么培训？”）有时，你只需通过考试获得认证。对于其他认证，你需要五年的经验。即使认证需要工作经验，准备并通过考试将其放在简历上也是值得的，因为这表明你做过功课，并准备好进入该领域。\n\
  \n如果资金有限，还有在线培训、书籍或其他低成本的选择来学习材料。此外，查看你当地的安全组织，如 Issa.org 或 Isaca.org。有时，他们提供的课程比一些营利训练营要便宜。\n\
  \n### 你需要研究生学位吗？\n\n工作几年后已获得学学位的人通常会考虑硕士学位是否有助于职业发展。正如安全领域的所有事情一样，这没有标准答案。如果你想进入高级领导层，拥有硕士学位会有帮助，尽管在某些行业并非如此。\n\
  \n如果你打算攻读研究生学位，请结合你的本科专业考虑。例如，如果你的本科专业不是技术类，考虑一个至少关注技术的硕士。如果你的本科专业是技术性的，考虑通用的管理学位。对于政策和治理职能人员，政策或法律学位可能是有用的投资。\n\
  \n利用研究生学位完善你的简历，并展示晋升所需的领导力。\n\n\n\n\n\n- **寻找已经在该职位上的人：** 如果你能与他们建立导师或倡者关系，那就太好了。（直接问问吧。你会惊讶地发现有多少高级领导者会对你的直接请求说“好”。）如果不行，至少去查看一下他们的工作经历。他们是如何走到那个位置的？他们接受过什么教育？他们拥有哪些专业经验？他们承担过哪些项目和任务？如果你了解他们做了什么，你就可以有选择性地复制他们的一些职业生涯，从而使你达到同样的高度。\n\
  \n例如，一个假设的 `CISO` 将具有以下背景：10 到 15 年的安全领域经验，在通用技术领域拥有一定经验，领导多层团队的经验，在两个或多个安全学科方面拥有深厚经验，在两个或多个行业或子行业拥有经验，以及领导重大/大型项目的经验。\n\
  \n你将不得不发挥创意。`CISO` 在 20 世纪 90 年代到 20 年代职业生涯中拥有的技术和机会，不会以相同的形式出现在你身上，特别是当你刚刚起步时。因此，要做好准备，将多年前发生在别人身上的职业经历转化为你今天的机会和环境。实现这一点的办法之一是观察处于你目标职位了一半的人。例如，如果一个\
  \ `CISO` 是通过拥有管理经验成为 `CISO` 的，就找一个新经理，弄清楚他们是如何达到那里的。由于时间上的接近，他们成为经理的经验将与你的经验相似。\n\
  \n- **了解该职位所需的知识和技能：** 查看招聘公告，看看你正在追求的职位目前需要哪些技能。多读一些公告。（有些招聘经理撰写招聘公告的能力很糟糕，所以不要把一份公告视为明确的职位要求清单；要参考多个公告的通用样本。）注意必选技能与可选技能之间的区别。此外，还要注意那些并非特定安全技能的技能，例如团队协作、写作和通用沟通能力。这些与安全技能同样重要，甚至更重要，而且是极易转移到其他职位的技能。\n\
  \n我们开始看到针对求职者和招聘经理的资源，例如 `NICE Framework`[`https://niccs.us-cert.gov/nice-cybersecurity-workforce-framework-work-roles`](https://niccs.us-cert.gov/nice-cybersecurity-workforce-framework-work-roles)\
  \ 或 `Cyberseek.org`[`http://cyberseek.org`](http://cyberseek.org)。在这里，你可以学习不同工作需要什么样的技能和经验。然而，要小心，因为这些网站仍在开发中。通过你的人脉验证你的发现。尽管如此，它们可以作为你衡量自己的基准。\n\
  \n### 自我与比较，第一部分\n\n看看你自己的简历。简历上已经有了哪些内容可以帮助你获得理想的职位？如果你已经拥有某些技能/经验，就不要再去寻找类似的。将你的职业生涯想象成一堵砖墙；每一块砖都是一种技能或经验，你需要不断添加它们，直到筑好你想要的墙（职位）。但是，不要一直更换墙上相似的砖，因为那对实现你的计划没有帮助。对于你缺乏的技能或经验，请关注与你现有经验最接近的事，看看你需要做什么来弥补两者之间的差距。那就是你的下一步。\n\
  \n### 自我与比较，第二部分\n\n了解你的优势（那些让你充满能量的事）和爱好。（为了进行通盘点，可以考虑阅读 Marcus Buckingham 和 Donald\
  \ O. Clifton 写的 *Now, Discover Your Strengths*。）在你的优势之上叠加你的安全技能。寻找那些利用你的优势并符合你喜好的职位和项目。例如，如果你喜欢教他人，就找那些能给你时间做这类工作的职位。或者，不要通过承担专注于这些弱点的正式职位来回避你的弱点。相反，寻找课外的方式来填补空白。例如，如果你不擅长公开演讲，就不要找需要大量公开演讲的工作。相反，考虑进行个人培训或加入像\
  \ `Toastmasters`这样的团体来帮助减少那些弱点。\n\n在你职业道路上努力的过程中，你可能会发现你喜欢和擅长的事与你最终寻求获得的工作完全没有关系。如果你发现你的优势和爱好与你的去向不匹配，请做好改变目标的准备。换句话说，要灵活。有很多方法可以成为安全领域的领导者而不必成为首席信息安全官\
  \ (`CISO`)。有很多方法可以成为领域专家而不必成为首席架构师。记住，你想在职业中获得成功，而不是精疲力竭和不快乐。了解你自己并采取行动。\n\n在整个职业生涯中，可能混合着机会主义和刻意为之；你通常知道想往哪里走（刻意），但你可能并不切切该如何到达那里（机会主义）。或者你只是感到无聊并寻找改变（机会主义），但你明确知道你不喜欢什么（刻意）。总而言之，在安全领域工作提供了很多选择，而自我意识将帮助你利用这些选择。所以，请刻意地在自己身上投入时间。\n\
  \n## 如何升职\n\n对许多人来说，升职似乎是一门黑术，有一种只有少数人有权知道的秘密代码。尽管公司尽力提供职业阶梯和晋升资源，但升职机会不能完全由个人控制。当公司需要更高职位的人才、你准备好胜任它，并且你的经理准备好支持你的升职时，机会就会出现。你可以采取一些步骤来增加升职的概率。\n\
  \n- **在公司外部申请：** 我们先解决这一条。许多安全专业人士通过跳到其他公司担任更高的职位来发展职业。这绝对是一个值得追求的策略，而且通常是进步的最快的方式。它可能比内部升职提供更丰厚的薪包。注意不要跳得频繁，特别是当你进入更高级别的职位时。准备在一个职位上至少呆两年再跳新公司。\n\
  \n- **与你的经理交谈：** 告诉他们你对升职感兴趣，并询问他们需要什么才能让你准备就绪。他们可能会为你所需的某些技能或经验提供指导。他们可能认为你现在就准备好了，但还没有空缺。知道起点是有价值的。让你的经理知道你想升职是一个很好的种子。他们可能已经在考虑让你升职了——但也许还没有。你的对话和对指导的请求会鼓励他们认真考虑你的候选资格。\n\
  \n- **寻找赞助者：** 赞助者是你公司内部一个为你和你的表现背书的人。他们会在你作为候选时支持你，或向你推荐有趣的项目。通常，赞助者是与经理级别或更高的人，并且处于对晋升流程有发言权的职位。有时，赞助者也可以是导师，但并非总是。寻找赞助者的理由是为了帮助你以积极形象被关注，从而为你获得更高的职位奠定基础。\n\
  \n\n\n\n\n- **推广你的工作：** 有些人犯了一个错误，认为他们优秀的工作会自己说明，不需要任何自我推广，特别是对于他们的直属经理来说。遗憾的是，事实并非如此。如果你想晋升，你需要帮助周围的人看到你已经做好了晋升的准备。确保你的经理和管理链定期获取你工作情况的更新——包括你完成的任务以及他人给你的感谢。在正式的评审期间，花时间认真记录你为团队、经理和公司所做的一切工作。确保你的工作目标和结果与团队及公司的目标一致，这样你就能证明业务有效性。在赞赏他人时要直言。在任何感谢信息中将他们的经理也包含进来。理想情况下，他们会回馈赞誉。\n\
  \n- **在公司寻找机会：** 并不是所有的晋升都发生在同一个团队。有时，晋升发生在你转到团队的其他职能时，但有时晋升也会发生在你移动到组织的其他地方时。不要等你的经理向那位招聘经理推荐你。如果你看到一个能让你获得预期晋升的职位，不要犹豫去申请。\n\
  \n## 接下来怎么办？\n\n- 与你的经理谈谈。让他们知道你想追求晋升，并向他们寻求指导。\n- 回顾你如何描述你的工作成就。确保你的经理定期获得更新。\n\
  - 寻找一个支持者（Sponsor），并让他们知道你的计划。\n- 进行技能清单。了解你想在哪些基础上建立，以及哪些方面需要投入时间学习新知识。\n- 考虑你的人脉。如果它支持你想去的地方，那就太好了！如果不是，考虑增加人。\n\
  - 如果你有技能缺口，寻找在未来 12 个月内填补它们的方法。\n\nWileyPRE\n\n# 第 12 章：我应该管理人员吗？\n\n安全行业内和外的人认为，职业发展的标志是管理人员——如果他们想在职业上取得进步，也应该管理人员。他们认为成为经理赋予了权威，更多的权威意味着更高的资历，意味着更多的金钱和声望。成为经理是职业发展的一条路径。它并不是唯一的路径，所以不要假设它是你进步的唯一方式。\n\
  \n### 人们倾向于将管理视为现有技能的延伸。例如，如果你是一个优秀的渗透测试员，管理一个渗透测试团队是一个逻辑上的自然步骤。事实完全并非如此。成为一名合格的经理需要特定的培训和在职学习。这与你做过的任何事情都是完全不同的技能集，除非你投入时间成为一名优秀的经理，否则你会成为一个糟糕的经理——而这对你周围的每个人都是艰难的。\n\
  \n大多数获得管理岗位的人在之前都没有接受过任何管理培训。想一想。组织中影响力最大的角色被交给了那些没有以前培训或经验的人，然后我们才发现他们能否胜任这份工作。我们为什么要这样做？这对经理来说不公平，对他们管理的人来说也确实很艰难。似乎有一种观点认为，如果你能管理好自己（达到高绩效），你就能以某种方式管理他人。任何父母都会告诉你，除非有人想要被管理，否则他们不会仅仅因为你告诉他们就去做你要求的事。我们中的一些很幸运，发现自己有一些天赋，能带我们度过最糟糕的学习期。我们中的另一些并不那么幸运，经历了意识到自己入错职的艰巨任务。\n\
  \n我们都听过关于糟糕经理的恐怖故事——微型管理者、过于友好的经理，以及技术水平不足以领导技术团队的经理。我们也听过关于优秀经理的故事——那些支持团队、正直领导并精通自己技术的人。我们都想成为优秀的经理。管理的挑战在于，“好”或“坏”的判断往往掌握在被管理的人手中——而他们想要的东西是不一样的。有些员工想要教练，有些想要朋友，有些则想要任务主管。你很快就会学会，管理人员意味着无法同时满足所有人，这在最好的情况下也是困难的。\n\
  \n如果你正在考虑转入管理岗位，请慢下来，认真思考你为什么要这样做以及为什么是现在。由于风险很高，所以要有意识地做出这一决定，并对你所投入的路径有充分的理解。\n\
  \n## 领导力与管理\n\n当一个人影响他人时，他们就是领导者。无论你是个人贡献者还是经理，你都可以选择成为领导者。你不需要对团队、组织或社区拥有正式的行政权力来成为他们的领导者。追求职业的人往往急于获得第一个管理岗位，认为这会让他们成为领导者。并没有。相反，这赋予了他们更多责任去让别人完成工作，他们很快就会发现他们受尊重程度远抵不上工作量。任何职位的人都可以是领导者。任何人都可以影响他人、指导团队，并做出积极的改变。\n\
  \n此外，如果你具备一些领导力技能，成为一名优秀的经理会有所帮助。也就是说，如果你理解你的员工如何思考、工作和受到激励，你就可以影响他们获得更高的绩效。你仍然需要组织、任务管理、技术理解等管理技能，但你的领导力倾向会很有帮助。\n\
  \n领导力与管理之间这种重叠的关系很容易让人混淆领导力与管理。不要让这种发生。\n\n在职业生涯中，有些时刻是真正具有重大意义的——即你可以看到“之前”和“之后”的时刻。其中之一就是从个人贡献者转变为管理一个团队。你如何知道自己应该是经理还是个人贡献者？让我们考虑一下后续章节中讨论的选项。\n\
  \n### 什么是个人贡献者？\n\n在安全领域，我们都从个人贡献者开始，磨练自己的技术技能。但有几种职业路径可以让你超越初级学习进入领导层而无需管理团队。并不是所有的路都通向首席安全官（CISO）。安全架构师、道德黑客、安全研究人员和安全产品管理都是不自动假设运行团队的角色例子。成为技术专家为组织提供了巨大的价值，这些职位充满挑战，并伴随着高责任和高薪水。\n\
  \n个人贡献者热爱技术、分析、活动和成果，他们比花时间推动其他团队成员的工作更想关注这些事情。这并不意味着他们是内向者、糟糕的团队成员或独行者。这仅仅意味着他们自己的工作是他们工作的重点。\n\
  \n\n\n\n\n要成为安全领域的独立贡献者领导者，一个人需要不断学习、不断建立人脉，并能够在没有直接管理权的情况下从容影响他人。作为领导者的独立贡献者通常具有多年安全领域的经验，并且通常在某一职能领域深耕多年。“自我引导”和“自我激励”是用来描述独立贡献者领导者的常用短语——这并非没有理由。通常情况下，他们已经具备了技术实力，这种能力远超组织中的其他领导——因此，如果他们想继续进步，就需要找到自己的道路。他们还必须成为未来发展方向的积极倡导者。他们的经理并不知道该把他们派到哪里。独立贡献者不会等待指令该做什么或去哪里，他们会开辟道路。\n\
  \n如果你觉得当经理让你索然无味，那么专注于成为独立贡献者是一个很棒的主意。看看你现在的经理在做什么（以及公司其他经理在做什么）。想象一下你在做这些事情。看起来无聊或压力大吗？看看你组织中的独立贡献者领导者（即使是非安全领域的）。看起来有趣吗？充满活力吗？令人兴奋吗？如果你追求地位，经理经理可能会很有成就感——但工作是体现在分钟、小时、天、月、年这些具体的细节之中的。如果你不喜欢管理工作的琐碎，你将无法成功。\n\
  \n## 什么是经理？\n\n当你有一组从事相似工作的人，且团队需要有人来指导其工作产出时，安全管理就发生了。团队的大小取决于许多因素——公司的整体规模、公司的组织哲学（层级分明还是扁平化）、工作的重复性等。很少有组织会规划组织将如何增长。增长是自然发生的，因此管理角色也是应运而生的。\n\
  \n如果你打算管理人员，你就需要想要与人共事工作。（我知道，这听起来是显而易见的，但我遇到过不止一个人，他们太晚才意识到，领导他人意味着要处理人际问题，而他们本以为是别的事情。）你必须把将时间投入到员工身上作为首要义务。衡量你成功的标准是团队的表现优劣，而不是你个人的表现如何。\n\
  \n和安全领域的其他部分一样，你也将希望不断学习、不断建立人脉。你需要在没有权威的情况下产生影响，并且你需要能够直接影响自己的团队。当你进入管理岗位时，你接受了自己将学习管理他人，这意味着你花在自己深度技术学习上的时间会减少。你接受了团队的进步和发展比自己单独工作需要更长时间，因此你需要适应更长、更复杂的交付和成功时间线。你还将从拥有一个可以授权的团队中获益，分担工作量，而且团队的产出往往大于其各部分的总和。换句话之，有了团队，你就可以比作为独立贡献者时更多地放大你的影响力——前提是你具备实现这一点的技能。\n\
  \n作为员工，我们把经理视为与我们一对一工作的人，当然，你的问题是有意义的。但当你成为经理时，你面临着多个员工问题，并非所有问题对你来说都有意义，你必须将精力分配到整个团队中。你必须随时为团队提供支持，他们的问题也将像他们一样独一无二。要成为一名好经理，你需要将团队的需求放在自己之前，也要放在自己的技术优先级之前。\n\
  \n最糟糕的经理是那种首要目标是让他喜欢自己的人。这种性格特征会让经理无法做出艰难的人决策，并导致糟糕的团队和糟糕的结果。如果你是一个想要和所有人做朋友的人，就不要当经理。当你需要批评或对团队的某人进行绩效辅导，或者更糟，解雇他们时，这会给你带来压力。作为经理，你想要相互的信任和尊重。尽管如此，你必须能够将可能让员工难以听受的管理决策（即使这对他们有利）与你维持友谊的愿望分开来。\n\
  \n在考虑管理时，一些人认为管理很棒，因为你有地位、有更多的控制权，并且可以设定团队的方向。这些都是事实，但管理也关乎把他人放在优先；它关乎行政工作、遵循流程、预算编制和其他行政事务。请确保你已经准备好并愿意做这类工作！\n\
  \n## 中层管理 —— 混合角色\n\n提个醒：如果你从独立贡献者跨越到中层经理，你应该知道这种角色是最难做的角色之一。为什么呢？因为这种角色通常是技术/运营职责与团队经理身份的混合。在这个角色中，你将同时根据你的个人技术成果以及整个团队的成功情况接受双重评估。\n\
  \n这是一个艰难的平衡动作。一方面，你有自己的个人交付物和活动。另一方面，你有依赖你提供指导、方向和辅导的员工。他们的需求将优先于你的需求——但你仍然要对自己的交付负责。\n\
  \n另一个挑战是，你的员工可能会向你施压改变，而你并不总是能做到，因为你没有足够的权威来影响高层管理。同情你的团队可能会让他们喜欢你，但这样做也可能让你看起来无所作为。你被困在中间。\n\
  \n如果你发现自己处于这种角色中，学习优先级排序和授权是你最先需要学习的关键技能。能够将重要的置于紧急的之前，将不重要的工作授权给更初级的成员，并利用团队的力量来实现集体目标，这些都会让你的生活变得更容易。要为中层管理角色中的这类挑战做好准备。\n\
  \n## 为你的下一个角色做准备\n\n风险很高。如果你转到管理岗位并成为一名糟糕的经理，你不仅影响了自己的职业，还会影响你所管理的人的职业。成为经理并不一定是通往权威的唯一途径。花时间为管理做好准备是很重要的。\n\
  \n不要觉得通过承担经理职位是晋升的一种。如果这是你公司晋升的唯一途径，但你已经决定走独立贡献者路径，请在其他地方寻找职位。另一个选择是与你的管理/人力资源部门讨论，创建一个不需要人员管理的高级职位。“晋升”可以意味着薪酬、头衔、福利、津贴以及更广泛或更深入责任的改变。例如，不是为单一工具或系统进行工程设计，而是为一个工具平台进行工程设计。不是为单一地点做治理、风险和合规\
  \ (`GRC`)，而是为多个地点做。不是为组织的某一部分做某事，而是为组织的多个部分做同样的事。。你明白我的意思了。如果你扩大了自己的范围和影响力，你就可以承担增加领导力、可见度和责任，而不需要承担行政管理工作。可以考虑阅读马尔沙·戈尔斯写的\
  \ *What Got You Here Won't Get You There: How Successful People Become Even More\
  \ Successful*（《过去的成就无法成就未来：成功人士如何更加成功》）。\n\n\n\n\n\n如果你想在担任管理角色之前“尝试”一下管理工作，请寻找那些你必须影响他人的职位。例如，尝试领导一项重要的倡议或项目，指导或教练不向你汇报的初级员工，或者志愿者为外部安全组织运营活动。这些都是学习如何辅导、鼓励和管理别人的方法，即使你还没有经理的头衔。阅读\
  \ Camille Fournier 写的《经理之路：技术领导者如何应对增长与变化的指南》（*The Manager's Path: A Guide for Tech\
  \ Leaders Navigating Growth and Change*）。\n\n在决定冲击管理岗位之前，先和办公室的其他经理聊聊谈。问问他们的一天是如何过的。问问他们如何管理员工，以及当员工表现不佳时他们做什么。问问他们对比工作中喜欢和不喜欢的地方。问问他们从经理、人力资源部门或公司其他部门获得什么样的支持。在听取他们的回答时，思考你是否喜欢他们喜欢的东西，你是否喜欢做他们做的事。\n\
  \n无论你是选择加倍成为一名更资深的个人贡献者，还是向管理层迈一步，任何一种角色都是你职业生涯的新阶段。你不再是那个受许多监督且自主性较小的初级资源；现在，你是一个正式的经理/领导者，正在做出决策并对结果负责。经理薪水更高的原因之一是，他们的决策可以积极或负面地影响整个组织的结果。不要轻视这份责任。它可能带来巨大的成就感，也可能带来压力。请睁大双眼迎接它。\n\
  \n## 接下来做什么？\n\n*   找一或两位经理并采访他们关于工作的情况。工作是什么样的？他们如何管理人员？他们喜欢或不喜欢什么？\n*   找一或两位资深个人贡献者，并采访他们关于工作的情况。工作是什么样的？他们做什么？他们对与团队合作有什么喜欢或不喜欢的地方？\n\
  *   找一些关于管理、辅导和影响力的课程，并上几门。这个主题让你产生兴趣吗？\n\nWileyPRE\n\n# 第 13 章我该如何应对冒充者综合征？\n\n\
  当人们进入一个职业或作为初级人员入职时，他们很少应对预期带来的焦虑，因为他们预期自己知道的非常少。他们预计周围的人会对包容大量的问题和错误。而通常被标记为“冒充者综合征”的焦虑会在某人表现出经验丰富的专业人士、领域专家或领导者时开始出现。当他们必须向自己和他人证明自己的真实性时，他们可能会开始自我怀疑。\n\
  \n与技术世界的其他部分相比，安全领域具有特定的文化，我们对此感到自豪。这种文化融合了技术才华、反文化的颠覆和救世主情节。这里也存在等级制度——技术程序员和黑客似乎处于顶端，而风险治理和行政控制管理则处于底部。等级制度会随行业和时间而变化，但等级制度始终存在。\n\
  \n人们可能会以个人贡献者的身份利用技术技能进入行业，随着经验的增加和参与更多管理工作，他们发现自己使用的安全技术天赋变少了，而使用的组织技能变多了。因为经理使用的技术技能较少，他们必须更努力才能保持核心安全文化的联系。这种落后感以及需要更努力来保持相关感的感觉加剧了他们的普遍焦虑。\n\
  \n对于我们大多数大多数人来说，这意味着无论我们在安全职业中处于什么位置，都会倾向于自我怀疑。我的技术水平足够吗？我在做对类型的安全工作吗？我属于这里吗？我应该做更多还是或者做些别的吗？安全工作的本质就鼓励我们去质疑我们支持的技术和系统的权威性和完整性，而我们经常将这种批判性的眼光转向自己。这导致了我们担心自己是个骗子，担心某人发现我们其实并不是他们认为的那个安全专家。\n\
  \n没有人会一直处于表现焦虑的状态中。但对我们大多数人来说，在某些情况下我们更容易感到这种情绪。每当我们与比我们更有技术知识、经验或自信的人交谈时，我们往往会屈于冒充者思维——这涉及很多人，而且很多时候！当我们被介绍为领域专家（`SME`）时，会有这种感觉，因为我们很清楚自己并非无所不知，别人知道更多。这是一种不舒服的第一反应感觉。\n\
  \n冒充者综合征影响几乎所有行业的每一个人。在安全领域，它贯穿整个职业。它对女性和少数群体的影响可能比其他人更大，因为他们已经在这种文化中更加努力地生存。\n\n\
  ### 所以，我们能做些什么呢？\n\n## 你的内心独白\n\n当你感到一阵冒充者综合征发作时，要做的第一件事是退一步，客观地审视情况。你是对某一个评论还是一系列反馈做出反应？是在经历让一切都变得更加困难的压力时期吗？与他人的成功相比，你是否觉得自己不够优秀？对自己要清楚是什么驱动了这种不安全感。\n\
  \n在检查时要保持平衡。看看你的过记录。你的怀疑是否反映在你的工作结果中？你是否通常很成功而目前的焦虑与你的感受不符？还是你的工作确实遭受了影响，你的想法可能有某些合理性？想想你信任的人——你从他们那里听到什么信息？他们的评价与你的担忧相符吗？\n\
  \n你对自己公平吗？没有人是一直都是卓越的——即使是我们行业中的超级明星也是如此。你对团队期待完美，还是你对自己要求了比所有人都要高的标准？你现在的个人生活和工作中发生了什么？你的总经验是在帮助还是损害你的工作结果？你的环境是在支持你的工作还是阻碍你的工作？这是一个平衡。高目标可以激励人心。但如果你将目标设定在现实无法实现的水平，它们也是灾难的根源。与你的经理和同事一起努力，验证你是否找到了平衡点，并允许生活的发生，这意味着有时你无法达到目标。这只是成为一名优秀安全专业人员的一部分。\n\
  \n考虑这些评论来自谁。有时，一个关于你表现的评价可能来自一个对你的工作没有完全了解的人，或者反映了评价者的偏见——无论是有意还是无意。如果你的大脑某部分认为这可能是这种情况，再次向信任的伙伴确认。你如何在一个可能存在年龄歧视、性别歧视或种族歧视者的背景下解读这些反馈？无论是否存在偏见，你是否应该根据反馈采取行动？\n\
  \n通常，一段时间的反思就足以提醒自己你做得很好，一切都好，你已经足够了。有时，你可能有一个持续的疑虑。你必须得深一点。\n\n## 辨别能力与无能\n\n这是一个很难的问题，特别是在职业生涯初期。确实有很多卓越的专业人士可以崇仰，而你还没有足够的知识来判断谁真正有能力，谁只是在做很好的营销。时间会揭示一切。\n\
  \n\n\n\n与此同时，请了解在你的`your`职位、`your`公司以及`your`行业中，胜任意味着什么。在安全领域，没有任何工作要求你对一切事都了如指——你的也不例外。你工作的任何部分，或者任何一份工作，都可以被拆解为各项技能。对于每一项\
  \ `skill`，都有一个通往精通的过程。当你第一次学习某项 `skill` 时，你会犯很多错误，并且需要时间才能变得胜任。对于任何新 `skill` 都是如此，即使你拥有多年的专业经验。要成为大师还需要更长的时间。仅仅因为你已经在你的`role`\
  \ 上待了几年或更久，并不意味着你可以在所有方面都成为大师，所以如果你认为自己本应该是这样的，请重置你的预期！\n\n### 理解胜任与自我提升\n\n与你的老板、同事和朋友交谈，由你自己判断你是否工作得良好。这并不意味着要成为你领域内所有方面的专家（除非你的职位名称就是“安全专家”！）。不过，这确实意味着可能存在你可以改进的领域，你应该自豪且积极地努力这些改进。顺便说一下，`proudly`\
  \ 并不一定意味着要向屋顶大喊。它可能意味着安静地掌握自己的学习路径并付诸努力。\n\n记住，胜任不仅仅是技术技能——即使在开始阶段也是如此。最好的员工是那些不制造戏剧、高度协作性、乐于帮助他人，并且通常能够看到自我之外的人。在你的`role`\
  \ 中表现胜任意味着保持好奇心并快速学习、与他人良好相处、有效沟通以及可靠可靠。技术 `skill` 虽然重要，但它不是唯一的成分。不要忘记也去关注其他那些领域的胜任能力。\n\
  \n如果你已经评估了自己，从周围的人那里获得了反馈，并且你认为自己正在做正确的事情，那么太棒了！你可能会发现某些领域还需要下下功夫。既然你已经意识到了这一点，你就可以采取行动了。\n\
  \n## 知道何时寻求帮助\n\n始终从向你周围的人、即你所在公司的人寻求帮助开始。他们比任何人都更了解你的环境，并且能够最有效地引导你在目前的`role` 中取得成功。他们了解公司文化，以及你必须遵循的工具和流程。毕竟，评估你的工作表现终究取决于你所在的公司。\n\
  \n如果你不习惯于向同事寻求帮助（如果是这样，那说明你的公司文化存在红旗警告），或者你所在的公司没有人可以帮助你弥补 `skill` 上的缺陷，那么请考虑更广泛的安全社区。在\
  \ Twitter 或其他社交媒体源上提问，并与那些愿意谈论特定问题或概念的人进行一对一会面。这适用于技术知识。例如，问问“你们对零信任是如何处理的？”以及“我如何才能参加夺旗赛（CTF）活动？”此外，这也适用于职场生存问题，例如“当你认为你的老板做出了错误的决策时，你该怎么办？”这让我想到了……\n\
  \n## 持续学习并知道何时适止\n\n如果你认为自己缺乏某项特定的 `skill` 或经验领域，这可以成为从导师那里获得帮助的绝佳话题。四处寻找那些在某项 `skill`\
  \ 上非常擅长，或者在该领域拥有良好良好教师声誉的人。请求他们收你为门徒。导师关系不需要永远持续，但可以很大程度上帮助你启动任何你认为需要帮助的领域。他们还可以帮你设定基准，让你知道自己是真的需要帮助，还是仅仅是冒充者综合症在作祟。\n\
  \n另一方面，你无法了解一切事——所以即使一个心意良好的人给出的反馈让你觉得需要学习更多，你也需要谨慎在那些对你没有帮助的领域花费时间。\n\n\n\n更换角色是一项巨大的工程。这涉及到更新简历、面试、交接旧工作以及学习新工作。它不仅改变了你的职业生活，还会打乱你的个人生活。你的家人和朋友与你共同这段这段程，所以你不仅影响了你自己。如果你是一个团队经理，你还留下了一群人，他们现在正在好奇新老板会是谁，以及你的离开对他们现在意味着什么。\n\
  \n最终，总会有离开当前团队甚至整个组织的时候。诀窍在于弄清楚你是否是因为正确的理由而变动——包括你为什么要离开，以及你要去的地方是否值得投入。这个问题的答案因提问者的个人情况而异，但决定的方法通常是相同的。以下章节概述了一些需要考虑的事。\n\
  \n## 你对现状感到满意吗？\n\n这听起来可能违反直觉，但我经常被那些对目前职位非常满意的人问到，是否是时候跳槽了。他们担心如果在一个地方待太久，无论是在技术还是职业发展上都会停滞不前。他们担心自己的薪资方案会落后（即“现任者惩罚”）。他们担心会被公司视为理所当然。\n\
  \n要找到一个让你完全满意的地方可能很难。身处这样的环境，健康和福利收益很高。因此，如果你正处于这样的地方，离开一定有一个非常充分的理由。你应该首先考虑内部的增长机会。你现在的雇主是否愿意将你的角色扩展到不同的/新的技术领域？你是否愿意承担新的团队成员（如果你是经理），即使是在完全不同的学科领域？他们能否为你提供更好的培训、福利和薪资，让你留在了原地？思考一下你*为什么*想要离开，并在离开之前目前的公司中寻找这些机会，在在你去寻找完全的新事物之前，先试着在目前公司里找到这些机会。\n\
  \n当然，如果你对现状不满意，那么那个选择就会容易得多——开始寻找吧！\n\n## 你已经完成了所有想做的事吗？\n\n许多人在找工作时并不会考虑要做什么——他们只是对能有一份工作感到高兴。初级人员接受一份工作是因为他们将其视为职业道路上的下一个逻辑步骤。中级专业人士通常会更有眼光。\n\
  \n花些时间思考你希望在当前职位上实现的目标（最好在担任该职位之前思考，但在职位期间思考也会有帮助）。有些人的工作是为了创建一个安全计划而被聘佣的。有些职位是公司为了创建一个新的安全职而设立的。也许你被聘佣是为了为安全团队创造改进的机会。无论公司为什么要创建一个职位，个人都可以利用该角色获得某些某项技术或流程的知识和经验，了解另一个行业，或者在通往更大平台的过程中建立人脉。\n\
  \n如果你已经完成了你想做的事，那太好了。也许现在是寻找下一个大目标的好时机。不要把“完成了你计划要做的事”与“已经没有事可做了”混淆。总*会有*更多工作需要完成，更多的改进需要做出，更多的山峰需要爬，或者更多的事件需要处理。总会有新的技术需要学习，更多的漏洞需要缓解，更多的员工需要培训，以及更多的高管需要去影响。待办工作量并不是衡量你是否已经实现目标的完整标准。要检查的是，你是否完成了*你*计划要做的事。如果没有完成（特别是如果你对你现在的公司承诺过什么），你可能需要双倍地考虑现在是否是离开的好时机。\n\
  \n## 你已经学到了所有你想学的知识吗？\n\n许多安全人员在感到自己在学习新技能或获得新经验方面遇到了天花板时，就开始考虑离开。这些技能可能是技术性的，也可能是职业性的。无论如何，如果他们觉得在当前职位上没有成长，或者增长速度不如以前那么快，他们就会蠢蠢欲动。这在经济低迷期间是一个特别棘手的问题——公司通常开始通过限制培训和参加会议来“节省资金”。安全是一份热门工作，而且有很多空缺职位————但如果新公司也限制培训预算，那么跳到另一家公司可能无法解决这个问题。\n\
  \n如果你喜欢你的工作但想要更多的培训，请考虑有很多免费或低成本的培训选项可供你选择。在线培训、书籍、会议和社交活动都是学习新事物的地方。即使是简单的网络搜索通常也能引导你发现新的想法或培训。\n\
  \n通常，问题不在于你不能自学。相反，你可能觉得公司已经停止了对你的投入——或者你不再需要他们来提供发展。如果你想留在原地，但觉得没有得到所需的开发支持，请从与你的经理和人力资源部门（假设有的话）交流开始。思考你需要的什么样的培训/经历，看看他们是否能提供。通常，公司并不知道你需要什么样的发展，所以请为自己争争取。\n\
  \n偶尔，我会和一些感到沮丧的人交谈，因为他们喜爱的导师离开了公司，而这个人是他们在安全各方面的“导师”。随着那个人的离开，他们觉得学习学习机会大大减少了。在这种情况下，给出一个警告。首先，跳到另一家公司并不意味着你会自动找到替代你老师的人。更关键的是，随着你职业生涯的发展，你会发现自己正在从初级学生转变为高级教师。你面前可以向其学习的人会越来越少。你需要自己开辟学习的道路，这通常需要通过人脉来实现。\n\
  \n如果你尝试了所有选择，仍然觉得在这些方面达到了职业巅峰，那么请考虑离开。\n\n## 你的长期目标是什么？\n\n对于那些知道自己以后想成为什么的人来说，可以清楚地看到该跳到一个新职位以确保向最终目标迈进。有些人想成为首席信息安全官\
  \ (`CISO`)，意识到自己已经掌握了基础，并知道现在需要一个提供管理能力发展的新职位。或者，他们想创业，但首先他们需要学习安全世界的销售/营销方面。他们可能想成为特定技术或安全学科的思想领袖，而在他们目前的职位上无法实现。如果你是这样，跳槽可能是保持迈向最终愿景动的绝佳方法。\n\
  \n如果你没有具体的长期计划，留在原地（假设你喜欢你的工作）会更容易，并等待下一个机会的出现。通过增加人脉和导师活动，你可以增加获得有趣新事物的机会。认识你的人越多，他们告诉你的潜在机会就越多。如果你没有长期计划，但不喜欢现在的工作，人脉和导师仍然是增加你找到良好着陆点机会的方法。\n\
  \n## 你被标签化了吗？\n\n有些人在自己的工作上做得太出色，以至于他们的经理不想让他们离开。他们因此错过了新职位或新任务。即使他们的经理给了他们丰厚的报酬，这可能也不令人满意。\n\
  \n\n\n\n\n我鼓励你与现有管理层进行沟通，让他们知道你对成长的渴望。确保你没有陷入一种“单点故障”的境地——即唯一能做你所工作的人。当这种情况发生时，经理有时不知道如何帮助你进行继任计划，因此他们会让你留在原地。提倡与他人分享你的知识，这样你的经理就知道将你调到新职位是安全的。将你的职责分给其他人，以便你腾出时间来做其他事情。\n\
  \n有时候，经理只了解员工的工作，而不知道员工所拥有的其他技能/兴趣。如果你属于这种情况，可以考虑承担常规工作之外的项目/培训（如果你能抽出时间），以磨练你在其他领域的技能，并向你的经理展示这些学习成果。提醒他们你经验中的其他部分，并表示有将这些技能整合到当前职位中的需求。\n\
  \n如果你在公司里有导师或支持者，请他们他们帮助你争取另一个职位。有时，如果同事或高层领导向经理提出建议，经理会采取行动，所以不要忽视这个角度。\n\n如果你的经理无法满足你的需求，那么可能是时候寻找更好的选择了了。\n\
  \n## 你是否符合公司文化？\n\n即使在最好的工作中，也可能发现自己处于一个组织文化和价值观与你自己的不相符的地方。也许最初并不是这样的，但后来发生了合并、领导层变动，或者你的经理换了。也许你变了，经历了重大的生活事件，或者学习了新的做事方法。也许你是在没有考虑组织文化和价值观的情况下接受了这份工作，而现在你在这里努力让它运作。\n\
  \n这可能很艰难——你可能喜欢你的团队、日常工作和工作的福利，但到头来，你回家时仍然感到有些压力和不满意。也许日常互动具有挑战性。也许你觉得某些“微攻击”单独来看意义不大，但它们累积起来就会产生一种“异类感”和缺乏归属感。\n\
  \n即使一份工作在纸面上看起来很完美，别人告诉你很幸运能拥有它，如果这份工作不符合你的性格和价值观，那永远是一场斗争。你可以在职位上取得成功，但为了获得这种成功所付出的能量超过了成功本身。你可能会注意到你经历的负面压力多于正压力。你的整体健康可能会因为饮食不健康、睡眠不足和皮质醇水平升高而受到影响。如果你无法认同公司的使命，如果你不同意管理层决策的方式，或者如果你在进入办公室之前必须戴上“职业面具”，那么可能是时候寻找其他选择了。\n\
  \n如果你发现自己陷入了这种困境，不要在其中停留太久。这是一个你应该尽快行动以改变境遇的领域。价值观/文化不匹配的累积效应是隐蔽的，会导致表现不佳。尽早行动做出改变。\n\
  \n## 跳槽\n\n传统的职业建议会警告不要频繁地在不同工作之间跳动。如果你每年都跳槽到一份新工作，将会引起质疑。如果你正在考虑转向一个新职位，值得考虑你在目前的公司待了多久。如果时间不到两年，你就需要准备好解释为什么现在就准备好跳到新工作了。如果你连续几份工作的时间都都不满两年，你也真的应该解释一下这一点。\n\
  \n一个频繁跳槽公司的人可能对性格的判断不佳——无论是对他们自己，还是对他们所就职的公司。这样的人可能很容易感到无聊，或者因为其他令人担忧的原因而频繁更换工作。当然，这也可能意味着公司经历了了裁员、合并或其他你无法控制的事情。无论何种，这都可能被招聘经理视为一个红旗。你可能想使用求职信或其他指标来表明为什么你快速在公司之间移动决定是明智的。\n\
  \n在较大的公司里，你有更多机会进行流动。公司了解你的背景，可以不必担心就了解你为什么会在不同角色之间变动。如果你处于安全职业生涯的早期，人们预期你会流动得更频繁，因为你仍在探索如何在行业内工作。从一个入门职位移动到另一个入门职位并不需要太多精力或时间。\n\
  \n## 接下来怎么办？\n\n*   在考虑下一个“闪光的目标”之前，花时间认真思考你为什么要离开。确保你离开或留下是因为正确的理由。\n\n*   考虑你是否可以在当前公司的其他地方找到你寻找的东西。与信赖的导师或顾问交流，看看其他机会是否让你能够留在这里。\n\
  \n*   与你的安全领域网络交流并考虑他们的建议。在你目前职位之外正在发生什么好事？那比你现在所在的地方更好吗？\n\n\n\n\n恭喜你，你现在领导着一个安全团队。欢迎来到这个肩负安全组织重任的社区！\n\
  \n你的团队可能很小，只涵盖几个安全职能；也可能大到跨多个地区拥有多个职能。你可能在为一家初创公司领导安全计划，也可能在为一家才开始投入安全的成熟公司领导。安全领导力的基础是共通的，区别仅在于规模。\n\
  \n我创建这一章节是为了帮助那些首次上任并正尝试寻找道路的领导者。好消息是，大多数新领导者被选中是因为他们已经具备了大部分所需的技能，因此这更多的是磨炼现有能力。在本节中，我们涵盖了以下主题：\n\
  \n*   **第 15 章,“我该从哪里开始？”**\n    当你开始一个新的领导岗位时，有一套开始的方法。我们将讨论如何开始以及在任职初期该做什么。\n\n\
  *   **第 16 章,“我如何从战略角度管理安全？”**\n    陷入战术细节中是很容易的，但你必须抵制这种诱惑。我们将讨论如何为你的计划制定安全战略。\n\
  \n*   **第 17 章,“我如何建立一支团队？”**\n    在本章中，我们将讨论如何扩大安全职能以及将资源放在何处。\n\n*   **第 18 章,“我如何写招聘启？”**\n\
  \    这是任何安全管理者的关键技能。\n\n*   **第 19 章,“我如何鼓励多样性？”**\n    如果你想拥有一个高效的团队，它必须是多样化的。我们将讨论如何做到。\n\
  \n*   **第 20 章,“我如何向上管理？”**\n    成为安全领导者意味着领导你的管理链。在本章中，我们将讨论如何实现这一点。\n\n*   **第\
  \ 21 章,“我如何为我的计划提供资金？”**\n    在这里，我们将讨论寻找资金支持你的安全计划的方法。\n\n*   **第 22 章,“我如何谈论我的安全计划？”**\n\
  \    沟通是安全领导者最大的责任。在本章中，我们将讨论如何有效地进行沟通。\n\n*   **第 23 章,“我的传承是什么？”**\n    在本章中，我们将评估我们为何要做安全工作，以及我们如何产生长远的影响。\n\
  \n成为安全领导者不仅仅是一个头衔；它是一种思维和行动方式，能够带动整个组织一起前进。它关乎让怀疑者变成信徒。它关乎成为安全团队的拉拉队员，而不是那个指挥的将军。它关乎为了人的利益而抑制自己的自我。你如何做到这一点？你可以去哪里寻求帮助？应该避免哪些雷区？\n\
  \n以下章节将帮助你理解安全领导者这一角色。\n\n# 第 15 章\n\n## 我该从哪里开始？\n\n当你开始一个新的领导岗位时，有一套开始的方法。我们将讨论如何开始以及在任职初期该做什么。（为了清晰起见已删除重复内容）。\n\
  \n## 你的时间表是什么？\n\nCISO（首席安全官）的平均任期短得令人惊讶——在十八个月到三年之间。如果你正在从事这项工作，要准备投入大量时间来改变。接受你可能无法做到一切。你的角色是创造某些东西，但可能不是留下传承。请据此规划你的时间，并确保你清楚自己的优先事项。\n\
  \n迈克尔·沃金斯斯的《前 90 天》（The First 90 Days）。\n\n如果你有一些额外的时间，你可以奢侈地慢下来进行更多分析。你有时间去尝试新的人、流程和安全工具。你还需要花费精力在更长的时间内维持公司的关注点。\n\
  \n## 你的合作伙伴是谁？\n\n你作为安全领导者的成功或失败将取决于你在安全团队内外建立关系的能力。现在开始识别你的合作伙伴、导师和利益相关者永远不为晚。当你与人们会面时，你会很快了解到谁的位置可以帮助或阻碍你的工作，谁可以成为你的信赖，谁是能够帮助你影响整个组织的连接者。要有意识地尽早培养这些关系。从个人角度了解。发现周围人们的故事是建立关系最快的方法。他们的个人故事是什么？他们工作之外的爱好是什么？他们关注什么？他们的家庭状况如何？他们在工作中做什么？他们的工作优先事项是什么？\n\
  \n\n\n\n*   不要害怕寻求帮助。这会让别人知道你是一个透明且乐于合作的人。\n*   为他人提供与其角色相符的安全信息。这将使你成为一个备受信赖的顾问和思想领袖。\n\
  \n你的合作伙伴关系将决定你在这个职位上的成败。在开始新工作之前，就开始着手建立这些关系吧。\n\n## 发现优势并记录缺点\n\n当你开始考虑成为一名安全领导者时，在入职之前你就会开始评估这家公司——无论是作为内部员工，还是在面试过程中。公司的优势是显而易见的——人们会告诉你。他们会谈论资金来源（或缺乏来源）、他们喜欢的领导者、运作良好的流程（以及不奏效的流程）。人们喜欢谈论有效的事情，你很快就能了解到组织在哪些方面可以为你提供帮助。有些缺点可能是显而易见的，例如缺乏经过培训的人员或技术设备过于陈旧。有些缺点可能更难发现，例如充满毒性的内部政治、收入流减少或流程低效。请记录公司的优势和机会。\n\
  \n花时间从宏观层面了解业务。它在纸面上和实践中是如何运作的？在这个组织中你如何完成工作？你可以利用哪些工作或思维方式来进一步推进你的安全目标？是“快速行动，事后道歉”？还是建立业务案例并获得批准？倾向于使用外部资源而非内部资源？倾向于从内部培养和提拔？你无法在入职培训包中找到这些内容。你只有通过与人交流并提问才能了解到这些信息。\n\
  \n在你发现这些优势和机会时，考虑一下你自己的。你的优势如何补充公司的优势？你的缺点会在什么地方产生问题？简而言之，你需要进行个人分析并评估自己。你的优势和缺点是什么？有哪些文化/组织上的机会和威胁？在哪里你可以利用优势和机会，并最大限度地减少缺点和威胁？\n\
  \n完成这些不需要花费很长时间。每当你与某人交谈，都应该为你的分析增加新的信息。几周之后（甚至在面试期间），你将看到一些主题浮现出来，这些主题可以成为从一开始关注的重点。\n\
  \n## 绘制业务风险图\n\n始终、始终、始终从理解业务是什么、做什么以及你的公司如何表达自己开始。最重要的业务结果是什么？利润？客户满意度？统治世界？\n\n\
  如果你对公司的“初衷”没有清晰的认知，你将会迷失。\n\n一旦你明确了这一点，就与其他（包括你的直接团队）交流，以验证你的理解。很少情况下你可以将其简化为简单的句子（而且它\
  \ `not` 是使命宣言！）。有许多层需要你剖析的文化细微差别。正式和非正式地与人们会面，获取他们的意见。\n\n如果你知道公司在乎什么，请考虑公司工作的环境。该行业的特征是什么？高销量、低利润？还是低销量、高利润？受高度监管还是未受监管？是局部的、全国性的还是国际的？公众知名度高还是低？是上市公司还是私有公司？哪些外部力量将塑造公司的运营方式，你需要在什么样的框架内运行你的安全计划？\n\
  \n## 你是否有授权（Mandate）？\n\n当你面试领导角色职位时，人们希望你做什么是显而易见的。那项授权将影响你需要做的事情。\n\n### 安全领导者的授权\n\
  \n| 如果你…… | 快速考虑…… |\n| :--- | :--- |\n| 从零创建一个安全团队 | 制定一个为期 12-18 个月的路线图。 |\n|\
  \ 修复受损的安全职能 | 评估团队以查看哪些需要培养，然后做出相应更改。 |\n| 维护一个表现良好的团队 | 评估团队看你是否同意该评估。如果是，规划你未来的路线图。如果否，与利益相关者合作建立业务案例。\
  \ |\n| 扩充现有团队 | 评估团队寻找可以发展的地方并创建路线图。 |\n\n## 接下来是什么？\n\n我认为，如果你先不知道自己身在哪里，你就无法到达你想去的地方。当有人询问从哪里开始时，我建议他们首先确定自己所处的位置，以便制定帮助他们到达想去地方的策略。你的时间表将帮助你思考什么是可行且现实，以及如何利用你的优势和公司的优势来实现它。请记住，随着你对公司及其需求的不断了解，你的时间表可能需要调整。\n\
  \n这并不是关于安全威胁和风险（那是下一个话题）；而是关于理解你被要求运营的背景。因此，对你的个人和组织优缺点进行分析，评估组织的风险管理风格，并考虑你的时间表。你现在已经有了足够的信息来开始。\n\
  \n\n\n\n将策略想象成一张根据你的特定情况标注过的旧式路线图。它描述了你现在处于何处以及将去向何方。你拥有的时间将决定你在沿途中看到多少风景。地图只大体地描述你将如何到达那里。它会告诉你要向西走，但可能还没有告诉你你是在开车、坐飞机还是走路。地图承认你并非无所不知（“此海有巨龙”），并且可能存在需要在旅程后期进行航线修正的绕路。最终，如果你燃料耗尽，你可能无法到达预定目的地，这没关系。策略的意义并不是给你的团队和伙伴提供一份详细的行程单。相反，它的意义在于给你和你的团队提供一些通用的路标——一个在你们愿意让他们经历的冒险类型上带有限制的“选择你自己的冒险”。\n\
  \n安全策略的内容远多于你所部署的安全工具和服务。你必须考虑整个计划是如何管理的，这包括了确保组织安全而涉及的人员和流程。有时，策略会包含非安全的内容。这可能意味着要与人力资源部门合作，改进入职/离职流程，以便更好地管理身份。有时，这可能意味着要与采购部门合作，改变他们的流程，以更好地适应安全供应商的购买周期。从整体上考虑所有可能影响你旅程的因素——这不仅仅关乎技术。\n\
  \n安全策略不是一个短期项目。它不是一年内就能完成的事情。它永远不会“结束”。它也不是一项政策。策略不是用来控制你的团队或公司的东西。它是一种能使他们朝着更大的目标努力，同时在总体的战略框架内为创造力和所有权留下空间的东西。\n\
  \n安全面临着一个独特的策略问题。战略计划从其本质上来说是长期的。这为安全领导者制造了困境，因为我们的任期通常很短。这意味着你需要决定你的计划是否将超出你自己的任期，或者你是否会将规划限制在几年之内。对安全领域的一种批评是，我们不够像一个业务伙伴——而我们大多数合作伙伴都在规划至少三到五年的未来。如果我们想作为业务领导者被认真对待，我们就需要找到方法来解决这种脱节。\n\
  \n许多人投入了你的策略中。董事会、执行团队以及你的直接领导需要认同你的策略，这样你才能获得资金和后盾。你的团队需要知道你提议了什么以及为什么，这样他们才能支持你的愿景。你需要不断谈论你的策略，以提醒他们你为什么要这么做。你的策略需要让安全专业人士以及你所工作的业务和社区认为它是合理的。\n\
  \n## 考虑你的行业\n\n当你开始进行环境分析时，要从大局开始并向内进行。这意味着首先要理解你处于哪个行业或哪些行业中。\n\n考虑你的公司。它是一个零售组织吗？金融？医疗保健？技术？该行业的特征是什么？是低利润、高销量吗？高利润、专业化吗？私营部门还是公立部门？你的行业目前的业务问题是什么？它是在挣扎还是增长？是国家性还是地方性的关注点，还是具有国际色彩？该行业的机遇在哪里，风险在哪里？回答这些问题可能意味着与公司里的人交谈，听取他们的看法。你可能会查看行业分析机构。简单的互联网搜索可能帮助你识别主题。开始创建你的行业画像。\n\
  \n作为一名安全专业人士，你还必须考虑安全趋势，并找出这些趋势可能如何与你的行业和公司保持齐。安全趋势通常由技术趋势驱动。你需要对所有这些进行三角测量。例如，现在，许多老公司正在将他们的技术栈迁移到云端。这意味着安全栈需要支持混合技术环境——本地和基于云。安全行业正在通过考虑零信任和安全访问服务边缘（`SASE`）架构来应对这个问题。你的团队也在做这些吗？如果不是，你认为他们应该做吗？如果是的话，他们接受过培训并准备就绪了吗？你所追求的策略的理由依据，将通过考虑你公司的需求、将这些需求与安全/技术趋势叠加，并将它们与你团队的能力联系而形成。\n\
  \n## 了解你的业务优先事项\n\n你的策略应该与组织的业务优先级保持一致。说起来容易做起来难。一个新的安全领导者可能会认为安全团队的任务是保护组织，或使其变得更安全或更具韧性。作为领导者，你必须找到从这条安全使命宣言到组织目标的路径，即服务客户、支持合并与收购、吸引顶尖人才或任何你决定的业务优先事项。这不仅是从\
  \ A 点（`安全使命`）到 B 点（组织目标），你还必须考虑支持性的“如何做”。要高效、要包容、要抢占市场，要成为业务部门认为重要的任何东西。\n\n大多数业务在运营时有多个优先级。通常，他们想赚钱并提高股价，但他们也可能想扩展到新市场、完成合并、人员人数翻倍或开发新产品。在较大的公司中，你可能会有多条业务线，每条都有自己的优先级。如果你处于这种情况下，请查看增长最大的领域和高关注领域，并确保你的策略与这些努力保持一致。你可能有很多基础性的防御工作要做，但要确保首先在公司的高增长区域开展这些工作。这有助于表明你理解业务优先级，而且更容易获得支持更广泛计划的资源。\n\
  \n在开始阶段，你还没有所有的答案，而且业务优先级和企业文化经常变化。因此，在创建安全策略时要考虑业务优先级，但不要把自己锁死。准备好在变化时随时调整你的策略。\n\
  \n为什么在创建策略策略时要关注业务优先级？因为你的领导层需要你证明理解他们的优先级，这样他们才能支持你的。他们需要看到共同的目标，并认为投资安全计划是一项值得的业务投资，而不仅仅是行政开销。\n\
  \n## 务实\n\n优秀的安全领导者在其他方面一样也是务实的。他们不会利用恐惧、不确定和怀疑（FUD）来推销他们的策略，也不会过度承诺安全投资的可能收益。他们对组织及其自身安全团队的优缺点有清晰的认识，并与组织中的任何人冷静地讨论他们的计划可能的风险和结果。是的，安全领导者需要提供灵感，但彩虹和独角兽并不是人们可以遵循的策略。安全领导者做出的承诺必须是可以做到的，因为他们在任何事情上都必须值得信赖。\n\
  \n\n\n\n了解障碍可能出现在哪里，并围绕、绕过或穿过这些障碍来制定安全策略至关重要。如果你知道预算将受到限制，你可能会考虑为员工使用开源工具或在线免费培训。如果你知道领导层正忙于其他更重大的“燃眉之急”，那么现在可能不是建议领导层将安全目标写入年度目标的时机。如果你在一个高业务量、低利润的业务中工作，将所有资金投入到只能解决一种类型威胁的产品上可能并不合理。或许投资一个通用的安全平台会更容易被“推销”。可能存在一些你完全无法忽视的障碍——例如缺乏资金。在这种情况下，要寻找短期行动，无论资金多么短缺都能尽可能地向前推进，并将解决这一资金障碍作为你策略的一部分。\n\
  \n同样，了解组织中哪些部分可以被推向并拉伸到你策略的前沿也至关重要。对于某些计划来说，威胁程度可能高到需要你尽快地动员整个组织。换句话说，你想要“一口吃掉大象”。要实现这一点，你需要高层管理者的积极参与。或者，可能有一些对时间敏感性不那么高但仍然重要的安全项目需要你关注。这类计划可以执行得慢一些。寻找一个愿意担任领导者的组织合作伙伴，可以向组织展示你策略的益处，创造较小的快速胜利，并建立信任。\n\
  \n要务实地制定你的策略，记录下障碍以及可以帮助你克服障碍的潜在合作伙伴。并不是所有事情都需要像你所希望的那样现在完成——因此要要有地决定何时需要加速某项计划，何时可以缓慢进行。\n\
  \n## 利益者痛点\n\n吸引者支持你策略的最佳方法是听取利益者的痛点，并确保你的策略能够积极解决这些痛点。例如，IT 员工可能会感到受限于限制其行动的预算限制，以及预期高于\
  \ IT 交付能力的审计人员之间的夹缝。在这种情况下，安全团队的一个角色是向高层领导争取，为 IT 团队投入更多安全资金。此外，安全团队还应该就哪些合理的预期与审计人员进行沟通。当双方都感到得到支持时，他们可能更愿意加入安全旅程。\n\
  \n与其他首席信息安全官（CISO）和领导者谈谈他们尝试解决的安全痛点。行业中存在一些共同的问题，且有已知的处理方法。解决这些问题中的一些将建立你社区的信任，并为你的长期计划赢得支持。以下是一些常见的安全痛点：\n\
  \n* 安全审查减慢了软件购买速度\n* 密码重置的帮助台工单\n* 代码审查减慢了应用程序交付\n* 用户不喜欢多重身份验证 (MFA) 体验\n\n有时，痛点与安全策略、技术或服务无关。相反，它更多与其他业务流程有关，例如低效的人力资源入职流程、缺乏胜任的资产管理或预算机制不健全。不要忘记在你的安全策略中也包含这些内容。你可能不是问题的“所有者”，但找到解决这些问题的方法有助于安全计划的成功，并且值得你投入精力和努力解决。\n\
  \n证明你认可自己所处的环境，并将你的策略与该现实保持一致，将为为你的努力赢得机构支持提供极大帮助。\n\n## 威胁与漏洞\n\n如果不考虑已知或可预测的威胁和漏洞，任何安全策略都是不完整的。对于安全领导者来说，这意味着要对趋势和事件完成内部和外部分析，并决定在你的战略路线图中具体针对哪些威胁。\n\
  \n有许多资源可以帮助你进行外部分析：\n\n* 大多数行业都有自己的信息共享与分析中心 (ISAC)。ISAC 提供了关于你行业典型攻击向量的丰富信息。\n\
  * 你网络中的其他安全专业人士也可以提供帮助。例如，与其他安全同事对话或听播客和其他信息源都是极佳的信息来源。\n* 行业报告，如威盛数据泄露调查报告 (`https://enterprise.verizon.com/resources/reports/dbir/`)，将为你提供通用和特定行业的威胁及攻击方法趋势。\n\
  \n你的内部分析还应涵盖以下内容：\n\n* 任何关于安全事件和事件的现有报告。如果你还没有安全团队，可以向 IT 帮助台和其他合作伙伴寻求信息，了解他们处理的事件类型。\n\
  * 如果你的公司购买了网络保险，请与你的风险伙伴或保险供应商交谈。他们可以告诉你他们是如何通过风险分析得出当前保单的，或者他们可以提供关于他们在公司中看到的风险和威胁的一般信息。\n\
  * 对公司技术路线图的审查也将指导你的策略。你公司使用的任何技术都具有固有的特定风险。你的策略应该确保这些风险得到解决。尽早参与到该路线图中。你越早被纳入这些对话中，就越容易对齐安全策略，并被视为有价值的合作伙伴。\n\
  * 通过与人们交谈来评估公司的安全文化。你的策略应该明确讨论组织的“人”的部分，并确保人们是安全倡导者而非内部威胁。你的分析不需要是高度度量化的——几次通用的对话就能让你感受到人们对安全及其在工作中作用的看法。\n\
  \n当你考虑威胁和漏洞时，确保你在向前思考。这不仅关乎你今天面临的威胁，还关乎你一年或以后可能面临的威胁。你作为安全领导者的权威将取决于你对新事物的准备程度，因此要在你的策略中加入一些“面向未来”的设计。这可以是让你的团队接受新技术培训，与产品团队合作尝试新的安全解决方案，或者加强桌面演练。\n\
  \n## 重复\n\n正如公路旅行一样，策略需要不断的维护和投入。虽然策略是一个不经常改变的长期方向，但审查策略以确保你仍然朝着正确的方向前进、路线图对于业务仍然合理也是重要的。\n\
  \n外部可能会发生（9/11、经济衰退、重大数据泄露、流行病等），可能会一夜之间改变你的原始计划。对此做好准备，并且不要让任何事件白费。如果发生重大事件，你会要求什么（而你现在为什么不要求）？如果在获得足够的高层关注之前发生了某些让你获得这种关注的事情，你会做什么？这会如何改变你的策略？\n\
  \n\n\n\n更有可能，内部业务的变化（领导层变动、预算调整或技术策略变更）需要被纳入你的年度计划中，即使你的整体策略保持不变。请准备好将定期策略审查成为你日常工作的一部分。定期对其进行“除尘维护”（具体频率取决于你所处的行业），并问自己它是否仍然合理。准备好与所有利益相关者讨论你任何需要做的重大变更。\n\
  \n安全领导者的角色是成为业务安全计划的架构师。每个计划的利益相关者都会希望领导者能阐明你打算向何处去，以及为什么、如何做以及何时做。准备好随时回答这些问题——无如此。\n\
  \n## 整合规划\n\n在制定策略时，有几项需要考虑的内容，它们听起来是战术性的，但它们需要被整合到你的策略中。\n\n### 安全框架\n框架确保每个人都使用同一种语言，并知道需要做什么。如果执行得当，它还有助于了解组织哪里存在漏洞以及需要关注的地方。从查看适用于你组织的法规开始。创建一个安全框架涉及数百万个细节——政策、法律、法规、标准，以及“必须做”与“应该做”之间的平衡。这需要时间，但它是任何组织中至关的第一步。\n\
  \n### 员工培训\n我说的不是对人员进行政策培训（尽管那也是要求的）；相反，我说的是培训 IT 及其他关键人员安全地履行工作。不要忘记培训安全团队如何根据你的策略来处理安全。培训\
  \ IT 人员可以培养支持者和盟友，所以这很重要！培训你的安全团队可以建立忠诚度，并使团队能够朝着共同目标共同努力。\n\n### 核心服务\n如果你从零开始构建一个计划，你会从哪里开始？也许从法规要求存在服务的地方开始是合理的。合规并不意味着安全（注：此处原文为\
  \ secure，通常译为合规并不意味着安全）。然而，领导层理解当他们根据法规或合同 `must` 某些某些事时，而且这些事情通常可以对安全概况产生积极影响。首先，评估为了满足任何合规性要求而提供的可用安全服务，然后填补任何控制缺口。之后，考虑核心安全职能——识别、保护、检测、响应和恢复——并确保你在核心服务中也涵盖了这些基础。合规领域与安全领域之间会有重叠，因此在可能的情况下进行双重投入。\n\
  \n### 衡量与报告\n创建一个计划，使你能够评估并向高层汇报。将文化转变为更具安全意识需要时间，拥有数据来展示变化是至关重要的。什么时候开始都不早。有多种方法可以跟踪改进并展示进展（在稍后的章节中详细介绍），而且没有标准的方法。将报告与通用业务目标和组织结构对齐特别有用。\n\
  \n## 接下来做什么\n\n- 如果你还没有开始，就开始写下你的计划。思维导图是构建你想要包含的内容极佳方式。一旦你把所有想法从大脑转移到页面上，就寻找思维中的漏洞和错误。创建策略最难的部分是开始——你与他人分享想法开始得越快，你的策略就会变得越好。\n\
  - 与你的管理链交流你的策略。利用这些会议来完善你的思考，明确你的表达，并回应他们可能有的任何疑虑。\n- 与你的整个团队讨论你的策略并邀请他们提供意见。将策略变成一次团队活动可以为未来的工作建立内部拥护者。\n\
  - 不要等策略完美。整体目标不会经常改变，但规划细节会。随着你了解得更多、情况的变化以及你团队的成长，不断完善它。\n\nWileyPRE\n\n# 第 17\
  \ 章：我如何建立团队？\n\n完全从零开始创建一个团队是罕见的。更多时候，至少有几个人已经在一起执行某些安全职，而你被要求在此基础上进行建设。当你获得第一份管理职位时情况尤为如此。通常，你所领导的职能已经存在，你被委负责它。你被要求管理这个团队——所以你就那样做。\n\
  \n对于大多数新经理来说，决定团队应该是什么样子的首次机会出现在其中一名现有员工离职时。第一次，你承担了寻找继任者的责任。第一次，你可以思考在技能方面你真正需要什么。第一次，你可以考虑什么样的性格与团队契合，以及你作为团队成员看重什么样的人。能有这种选择并被提醒管理者的责任是非常棒的。只要知道，如果你做错了，会伤害整个团队。\n\
  \n替换一个现有的空缺与建立团队不是一回事。当你建立一个团队时，特别是一个具有多个职能的团队，你有多得多的选择。你是否会增加人手来缓解工作过载的团队？你是否会创建一个新职位为组织做一些完全不同的事情？你是否会把现有资源调到那个缺缺位置（甚至可能是晋升！）然后在其他地方填补？能够做出这些选择是作为领导者最棒的部分之一，这也是你可以留下领导力印记的地方。\n\
  \n建立一个习惯于管理整个组织安全的团队，意味着要思考公司需要什么、团队能提供什么，并将两者对齐。安全团队的增长意味着增加资源以满足公司的需求，同时考虑到安全团队的文化。这是一个微妙的平衡。这也是作为领导者的一项永无止境的工作。这是你每天都会做的持续运营事务之一。成为安全领导者意味着不断评估你的团队。我们正在提供所需的服务吗？我们拥有所需的技能和人才吗？我们的流程运行正常吗？我的团队经理知道如何团队吗？每当有人离开（理想情况下不要太频繁！）都是重新评估团队结构的机会。\n\
  \n我将团队建设和团队管理视为作为安全领导者所最重要的事情之一。\n\n## 关乎如何做\n\n新的安全领导者必须同时处理两个相关问题：哪些安全威胁和要求影响着组织，我如何创建一个最好应对这些威胁的团队？制定安全策略更多是关于了解公司面临的威胁、组织的风险承受能力，以及缓解威胁的工具和服务。建立团队在制定策略之后。它是关于\
  \ `如何` 执行策略——在哪里投入人手、在哪里外包、在哪里整合、在哪里停用。这对于安全领导者来说是一项持续的活动。你应该不断评估是否在正确的位置拥有正确的资源，并预料它将占据你大量的领导时间。\n\
  \n\n\n\n\n很少有人能完全从零开始组建一支安全团队。即使你目前是一个单兵团队，组织中已经有其他人在从事“安全相关工作”了，包括信息技术（IT）人员、人力资源（HR）伙伴、财务伙伴，甚至是首席执行官（CEO）。所有人在执行安全工作方面都扮演着相应的角色，因此你团队的建设应该符合现有的结构——至少目前是如此。\n\
  \n首先，你需要知道你出现在那里的原因。\n\n### 建立一个新事物\n\n也许这家公司以前从未有过安全团队，而你被请来从零开始构建这个团队。恭喜你！如果公司真的重视安全能带来的价值，这可能是一个非常有成就感的地方。我建议在获取所需资源时尽可能激进。先填补你的短缺，应用基础安全职能，确保你正在支持业务增长，然后继续下去。\n\
  \n准备好花费大量时间来招聘合适的人来担任这些角色。如果你真的是从零开始，可以考虑在投资专家之前，先雇佣通用型人才，让他们能够快速胜任多个角色。在招聘全职员工的同时，考虑通过外包或人员增援来填补一些第二阶段的角色，这样你就可以在不取决于可能长期招聘周期的情况下启动相关职能。随着时间的推移，如果合适，你可以用内部招聘的人取代第三方承包商。\n\
  \n警惕：“建立一个新事物”有一个亲近的表亲，叫做“尽管去做”。这种情况通常发生在公司意识到自己必须处理安全问题，但并不真正理解这意味着什么。也许他们正在准备首次公募募（IPO），监管机构告诉他们必须拥有一位安全负责人和一个安全计划。你被聘雇是为了让这个问题消失。这并不是什么坏事，但这种态度会带来不同的挑战。如果你发现自己处于这种境地，你可能需要将报告和沟通角色纳入早期招聘计划中。\n\
  \n### 修复一个坏掉的东西\n\n也许你接手了一个并不受高层领导认可的安全职能团队。他们需要你来“修复它”。也许他们刚刚经历了数据泄露，或者虚惊一秒，因此决定改变他们安全工作的方式。有时在你接手这份工作之前，你可能不知道情况是如此（我希望不是这样！）。如果你是被请来“解决问题”的，你需要在开始构建之前花时间准确评估问题到底是什么，而且问题往往是多面的。\n\
  \n先与你的领导层交谈，了解他们如何看待安全职能。然后，与现有的安全团队和其他利益相关者交谈（供应商在这里是极好的资源），以验证或反驳领导层的意见。确定哪些需要改变。\n\
  \n如果你进入一个被认为“坏掉了”的团队，你可能会发现一个动荡不安且士气低落的安全团队。你必须迅速评估团队，并确定是否有人应该支持他们在团队之外寻找其他职位，以及你如何投入并支持剩余的团队成员。在这个问题上要快速行动。安全团队处于悬而未决的状态越长，前进就越困难，你在团队和领导层面前的信誉也会越低。\n\
  \n### 延续一个伟大的事物\n\n也许你被请来领导一个高绩效的团队。你被期望维持现有的任何内容。这很罕见。安全人员从不觉得他们已经解决了一切问题，所以永远会有新事情要做。这也是一项艰巨的任务。一个团队之所以高效，是因为领导力、文化和流程之间微妙的平衡。随着新领导者——你——的加入，这种平衡已经被打破了。你需要努力工作以保持团队良好表现。\n\
  \n如果公司领导层认为安全团队很棒，你可以在此基础上尝试除已存在内容之外的新事物。现在不是从根本上改变现状的时候。“新”是可以的，但“不同”会令人恐惧。所以，在你构建团队时，要缓慢改变现有的结构，即使你认为改变是必要的。在确保现有职能运行良好之前，对于增加新事物要保持谨慎。\n\
  \n### 持续成长\n\n也许你被请来领导一个正在增长的团队。可能已经有了安全团队，但需要更多。考虑到技术和安全的发展，安全工作永远不会休止，因此稳步增长是一个合理的假设。考虑你现有的才干。是否有人可以被调整以满足新的需求？或者为了满足业务需求，是否存在某些合规缺口需要关注？无论如何，在承担更多任务之前，确保任何现有职能都运行良好。\n\
  \n## 需要考虑的事项\n\n思考从哪里开始以及如何进行改变可能会让人措手不及。幸运的是，有一些经过考验的方法可以在你构建团队的同时考虑到你独特的需求。\n\n\
  ### 规划职能而非工具\n\n在下文中讨论各种方案时，我特意使用了“职能”（function）一词，而不是“服务”或“工具”。将工具归类为服务，将服务归类为职能，可以让你构建出一个在各种威胁和情况下具有结构性和通用性的功能组合。例如，身份与访问管理（IAM）职能由身份创建、访问生命周期管理、验证与授权、组管理和活动目录管理组成。将\
  \ IAM 加入安全组合并不是关于单一服务。相反，它是系列服务，这些服务允许组织实施零信任计划；促进应急响应的用户行为分析；支持本地、混合或云原生技术栈；管理针对域管理员的威胁等等。它不仅仅关乎某件事（创建登录账户）；它对许多利益相关者都有许多价值。在安全的分类中，工具有很多，但职能很少。规划和讨论职能有助于你与利益相关者合作，让他们理解安全的各个部分是如何结合在一起的。\n\
  \n### 安全卫生\n\n你已经完成了评估，并了解现状。太棒了！现在，你需要决定什么值得保留。会有某些核心安全职能是你应该首先构建的（如果你是从零开始构建团队），或者是确保它们运行得非常好。这些在整个行业中被称为“基础安全卫生”任务或“基础安全”。确保这些措施到位，将为你带来最大的安全投资回报。\n\
  \n问题在于，对于这些基础元素究竟是什么，共识并没有你想象的那么大。目前的青睐包括漏洞管理、治理框架和应急响应。\n事实是，什么被认为是基础的取决于你所处的公司类型，这将由你来决定。\n\
  \n\n\n\n无论如何，一旦你列出了基础清单，请确保这些功能运行良好，方法是确保执行工作的员工经过良好培训并专业管理。其中某些功能（例如资产管理）可能不直接属于你的团队，但它们可能对安全计划的成功至关重要。接下来，审查服务的成本。它的运行高效吗？如果不是，是否应该将其外包？你是否需要更换人员或工具？假设你已经有了合适的人力和工具，那么请确保这些团队得到了良好的支持。一个人负责某项工作只是单点故障。也许你可以安排两个人每人花一半的时间处理，或者你可以增加额外的人手来消除故障点。在基础工作稳固之前，不要开始添加任何新东西。\n\
  \n### 识别所需功能\n\n合规并不等同于安全。没问题。你需要法律或合同要求的基本事项，因此这是添加功能的绝佳起点。咨询你的网络保险提供商。他们假设你已经具备了哪些措施，或期望你拥有哪些？了解影响你所在行业的法规并理解这些法规的要求，将为为团队增加更多功能提供快速的业务理由提供坚实基础。一旦你的基础卫生工作到位，合规性工作应该紧随其后。（它们通常是同一件事，但并不总是如此。）\n\
  \n### 在“可以做的”之前先做“必须做的”\n\n有很多华丽、闪眼的安全“玩具”，许多供应商都愿意卖给你。在处理好基础工作之前，请克制这些欲望。让安全团队成员作为培训和发展的一部分来尝试新事物是可以的，但你的首要重点需要放在需求上，而不是选项上。\n\
  \n## 识别重要事项\n\n“重要”的定义会随着每家公司而变化。这是你可以发挥专业知识并帮助确定公司需要关注什么的地方。考虑以下类别来识别对你最重要的事情。\n\
  \n### 威胁\n\n审查任何数量的行业威胁情报报告都能帮助你识别针对你业务类型的威胁。确保你的功能有助于应对这些类型的威胁（当然，要考虑影响和概率）。没有任何能比关注那些并未真正影响到你业务类型的事情更能更快地破坏你计划的关联性。针对可能威胁你所在行业/公司的因素制定计划。\n\
  \n考虑三类威胁：\n\n*   已经已经影响到你公司的威胁，例如钓鱼攻击、无知内部人员或勒索软件。如果公司经历过事件但尚未解决根源，这可能是一个增加团队成员来协助的地方。\n\
  *   行业威胁。基于你的行业，可能会出现哪些类型的威胁？你是否有应对这些威胁的功能？\n*   国家级威胁。你可能不是政府，但政府之间进行的网络战会反噬到你的公司。这引入了哪些类型的威胁？你的团队是否准备好应对？\n\
  \n### 业务目标\n\n你的团队提供的功能和团队结构是否支持你组织的业务目标？这可能很难识别，特别是对于可能有许多“业务目标”的大型组织。花时间理解“为什么”和“是什么”，然后评估你的安全优先级是否支持了这些目标。如果你的公司非常关注消费者，也许你需要提供直接支持消费者或支持你前线团队的安全服务。如果业务是云原生的，确保你的安全栈支持云端服务至关重要。\n\
  \n始终将与业务保持对齐作为构建团队的首要准则。\n\n### 安全支持功能\n\n在你构建团队时，会有一些运行安全业务所必需的支持功能——财务、市场、指标/报告、分析等。在考虑构建你的团队时，不要忽视这些功能的重要性。你需要自己的首席幕僚吗？通常，你将使用组织内其他部门的服务，但有时你需要自己招聘和培训非安全类人员。无论支持功能是内部化还是外包，这些功能都需要是高效且有效的。确保你拥有能力的支持功能。\n\
  \n如果你能找到涵盖所有这些类别（卫生、合规和重要事项）的功能，那太棒了。优先追求这些事情。准备好进行转型，并确保你的团队也准备好了。情况变化很快！\n\n##\
  \ 识别薄弱环节\n\n进行基础的优劣分析很好，但要真正理解现有安全团队是如何运作的，你需要与许多人交流。从与安全团队开始，因为他们可能知道所有好坏情况发生在哪里。与合作伙伴和利益相关者交谈。你会发现他们对团队有效性的看法。注意，我并没有说你应该只与“客户”交流（尽管他们可能也是利益相关者）。你必须与所有能影响团队成功或可能受安全功能影响成功的人交流。\n\
  \n问一些问题帮助你理解：\n\n*   他们认为安全的角色是什么？安全是服务提供者？战略合作伙伴？还是行政开销？\n*   他们认为团队有效吗？他们知道安全团队在做什么吗？他们认为做得好吗？他们希望看到什么不同的做法？\n\
  *   他们认为团队在伙伴关系和协作方面表现良好吗？安全团队的工作是否支持利益相关者的目标和任务？安全是否支持组织的使命？\n*   他们认为安全工具和流程是有效的还是干扰性的？\n\
  *   他们认为安全团队应该在哪些方面采取与不同的做法？他们应该多做什么？\n\n建立安全团队不仅仅是增加人数。它关乎确保整个人员、流程和工具的生态系统协同工作，以实现组织的使命以及安全团队的使命。一旦你识别了薄弱环节，你需要决定是停止这些领域，还是加倍投入让这些领域变得强大。\n\
  \n### 停止功能\n\n有时，你需要停止做某事。这可能是因为该功能解决的问题已经不再存在。也可能是尽管该功能是一个好主意，但在实践中并没有达到所需的成功。也许该功能的采纳率低于预期。也许与你获得的安全价值相比，成本太高。无论如何，作为领导，当你发现这些功能时，你需要果断地做出改变。\n\
  \n如果你识别出一个薄弱的、且利益相关者认为很好的东西，那么在采取停止该函数的步骤，你必须双倍向利益相关者解释你的想法。这有时很难，并且需要时间帮助他们理解你的观点。单方面地取消某个受欢迎的事物或某人可能会导致利益相关者产生不信任。\n\
  \n\n\n\n如果涉及员工（与外包功能相比），请考虑对他们进行重新培训、技能提升，并将人员重新调整到更需要的功能上。这可能需要时间，但通常是值得的。剩下的团队会看到公司愿意在他们身上投入，这将有助于留住人才并维护机构知识。如果这是一个可行方案，请尽早开始与受影响的员工交流，并经常与他们沟通。如果他们不想为了其他职能重新培训，或者不具备胜任新工作的天赋，请检查他们是否更适合组织内其他部分的职位。不要拖延任何解雇流程。在过渡期间，要保持透明，并对团队（包括离开的人和留下的人）提供支持。\n\
  \n向利益相关者明确说明你正在进行变更。让他们知道你已经听取了他们的意见，并且正在根据他们的反馈做出这一调整。让他们知道资源将如何重新部署，以及这将如何提高组织的安全态势。\n\
  \n## 构建新职能\n\n创建新流程和增加新员工不仅有助于整个组织的安全态势，还能帮助安全团队的其他成员学习新知识，从而整体提升整个安全团队。\n\n现实情况是，在大多数组织中，安全仍然被视为行政开销。人们不想在安全上花费比绝对需要多多的钱。因此，在申请更多资金之前，请确保你现有的团队尽可能高效。如果这是一个可行方案，通过停止无效功能并将资源重新定向到新事物上来实现“自筹资金”是一个极好的起点。无论如何，在要求更多资金之前，请确保你能够证明自己正在做出良好的管理决策。\n\
  \n创造新事物需要时间。你不能浅尝辄止。你需要明确要真正做好某件事需要什么——即在人员、流程、工具和利益相关者参与度方面。在开始之前，务必明确你将如何衡量该职能的成功！\n\
  \n获得高层对新事物的支持非常重要。这不能仅仅是安全团队的想法（即使确实是这样）。它必须是对该职能的集体投资。识别一两个关键利益相关者，让他们向其他人推行你的职能，并在整个部署和持续的运营活动过程中与他们保持密切联系。如果该职能在组织中引起了波动，他们将是你最好的伙伴。\n\
  \n你不能当成“爱好”来做新事物。从一个最小支持的“概念验证”开始是可以的，但如果你打算致力于某项新事物，请确保该承诺与目标最终状态相匹配。从最小的“用例”作为职能的基础可能是开启新事物大门的方法，但这种方法可能充满问题。你选择的用例具有扩展性吗？该用例代表了你试图解决的大多数威胁/需求，还是仅仅是一个边缘案例？你为用例合作的小组能代表组织其他其他伙伴吗，还是他们是那种成功无法复制到公司其他地方的独角兽？请从你的最终状态出发，反向推。\n\
  \n如果你在一个高增长的组织中，你可能同时启动多个新事物——恭喜你！如果没有，请在转向下一个新事物之前，确保当前的新事物运行良好。否则，你可能会面临耗尽和利益相关者的挫败感。建立团队就像盖房子：从你的最终状态出发，反向推。我们需要确保新事物运行良好。\n\
  \n## 接下来做什么？\n\n- 记录你的观察和机会。\n- 与利益相关者讨论你的观察，并与同事确认。\n- 至少每季度将其列入你的日程。\n- 更新你的策略以反映结果。\n\
  \n# 第 18 章：我如何编写招聘公告？\n\n你现在是一个安全领导者了，这意味着你正在壮大团队。在某个时刻，你需要编写一份职位描述。招聘公告将由招聘人员用于吸引最优秀、最明敏的人才。没有时间浪费。我们需要确保公告能吸引尽可能多的人才，即使在没有指导或以往示例的情况下。\n\
  \n## 招聘公告的挑战\n\n安全行业内部存在着争论。是人才不足，还是我们要求的点不对？是人才根本不存在，还是我们找错了地方？只有一件事可以做：我们需要确保创建的招聘公告尽可能好，并且在尽可能多的地方传阅。我们需要尽可能地广而而欢迎。\n\
  \n那么，为什么这这么难呢？因为招聘公告是由安全人员编写的。\n\n你最近读过任何招聘公告吗？它们很容易找到。只需去任何招聘网站，搜索信息安全或网络安全相关的职位即可。（我们给安全工作所贴的标签并没有一致性。）看看职位的描述方式。公告是否显示了该角色如何融入组织、为什么需要它，以及它支持谁？公告是否要求适当的背景和经验，还是在寻找一种无法找到的历史与天赋兼具的“独角兽”组合？公告是否清晰地阐述了招聘过程中的预期、招聘经理是谁（或至少这个人担任什么职位），以及其他重要的后勤安排？我猜你会在某些公告中发现其中一些内容，而且没有一份公告会包含所需的一切。\n\
  \n很少有安全专业人员接受过如何编写招聘公告的培训，这显而易见。在发布该职位之前，请确保从同事、员工和 HR 伙伴那里获得第二或第三意见。使用可以评估语言偏见的应用程序。编写招聘公告不是核心技能，所以请向专业领域人士寻求帮助。同时，如果你正在为自己的团队创建招聘公告，请考虑后续章节讨论的内容。\n\
  \n### 技能\n\n在安全招聘公告的所有挑战中，技能不匹配导致大多数候选人跳过你的公告去别处。行业存在技能缺口，但我们的招聘公告要求太多的技能和证书。此外，人们假设成功的候选人必须进入新工作时已经经过充分培训，以完成任何需要。在你坐下编写公告之前，请充分考虑新员工绝对需要的技能，以及你愿意在工作中帮助候选人发展的技能。\n\
  \n\n\n\n\n当你考虑技能时，也应该考虑你对候选人正式教育的期望。除非你真心认为这是必要要求，否则不要要求四年制学位。（大多数安全领导者并不这么认为。）对于你所要求的认证要要加谨慎；它们真的能支持你正在招聘的职位吗？你是否有愿意考虑的等效条件，例如用工作经验代替正式教育？你所要求的所有培训都必须是安全特定领域的吗，或者你可以让候选人通过其他途径展示技能？你对自学型候选人怎么看？\n\
  \n将自己与其他招聘公告和资源进行基准比较，例如美国国家网络安全教育倡议（NICE）劳动力框架。确保你没有要求一个初级候选人具备高级别的技能。确保高级职位的招聘公告没有要求过多的经验或技术精通程度。仅仅因为是一个高级职位并不意味着该职位需要对每项技能都达到专家级的精通！\n\
  \n区分通用 IT 技能（如编程语言）和安全技能（评估应用程序是否存在不安全代码），并确保你不要因为某个职位位于安全部门就将其标记为“安全”。CISO（首席信息安全官）招聘一名通用的应用程序开发人员、项目经理或数据分析师，而不将他们称为“安全工程师”、“安全经理”或“安全分析师”，这是完全没有问题的。\n\
  \n有趣的是，当你与招聘经理交流时，在工作中难以培养往往不是技术技能，而是像同理心、团队合作和沟通之类的职业技能。当你阅读职位描述时，哪些“必选技能”列在最前面？是技术技能！如果你认为可以在工作中培训技术技能，但想招聘具备职业技能的人才，请将职业技能列在前面。\n\
  \n不要要求你即使没有他们也可以生存的技能或经验。即使只是将不必要的技能放在“可选”或“优选”部分，也足以让高质量的候选望而却之——因此，确保你放在招聘公告中的技能是你真正需要的。\n\
  \n### 背景 (Context)\n\n任何工作都不是孤立存在的。如果你正在为某个职位招聘人员，是因为你的组织出于某些目的需要该职位，而且该目的与你的安全策略以及组织的业务目标和使命相一致。\n\
  \n所以，当你创建招聘公告时，让潜在候选人知道这份工作的“为什么”。为什么会有这个职位？它填补了什么空白？它是如何融入公司、安全团队和安全职能的？该职位是专注于公司的某条业务线，还是整个公司？该职位将成为创收团队的一部分还是产品支持团队的一部分，还是行政部门？你们的核心价值观是什么？这个职位如何支持这些价值观？包含一个指向公司网站重要部分的链接，以便候选人快速查看有关在贵公司工作的基本信息。\n\
  \n不要只谈论工作是什么；要谈论公司将如何支持候选人的成长。告诉候选人他们将变成什么样，以及这份工作可以变成什么。你是否投入资金在工作中培训员工、派遣他们参加会议或支付行业协会费用？那么尽管说出来！让他们知道，当他们加入你的团队时，你将帮助他们成长，而不仅仅是他们的工作表现。让他们知道，他们申请你的工作所承担的风险是值得的。\n\
  \n你应该给候选人一些背景信息，因为这能让他们在职位中看到自己。候选人希望对新机会感到兴奋。如果你能做的只是告诉他们将监控漏洞、对应用程序进行渗透测试或编写策略，你就没有给他们提供全景。\n\
  \n> 给候选人提供“为什么”，允许他们在脑海中完善这个角色，并让他们想象作为你团队一员的成功。\n\n背景将使候选人为面试做好更充分的准备，提出更好的问题，并为完成你的需求做好更好的准备。\n\
  \n### 语言 (Language)\n\n当你创建招聘公告时，你是在为候选人创造一个愿景。你正在讲述一个关于角色可以变成什么以及他们在其中角色将是怎样的故事。所以，就像任何优秀的故事讲述者一样，你需要将读者放在故事的中心——不是作为被动的观察者，而是作为核心。为了做到这一点，你需要使用第一人称语言。\n\
  \n与其说“候选人将监控系统并遵循操作手册响应事件”，你可能选择说“你将利用你的观察能力来识别针对贵公司的异常和攻击。”\n\n与其说“申请者将成为安全团队的一部分”，你可能会说“你将成为一个高度专业且包容的群体的关键成员，确保整个公司的安全。”\n\
  \n当你编写招聘公告时，应该小心避免被认为带有性别色彩、偏见或其他助长负面刻板印象的语言。有些人想成为“摇巨星”，但对另一些来说来说这被视为一种男性的、高竞争的标准，会自动排除女性或其他少数族裔。目前有免费的软件可以检查你计划使用的语言。搜索“偏见语言应用程序”（bias\
  \ language applications）来查看一些选项。请使用它们。如果你使用的语言阻碍了他们看到自己在该职位上成功，他们就不会申请你的工作。\n\n\
  如果可以，请尽量避免将筛选问答（filter Q&A）作为申请流程的第一步。公司喜欢这样做——这有助于它们的算法“剔掉”不合格的候选人。但安全类工作不是千篇一律的，这些算法往往弊大于利，因为它们会过滤掉那些缺乏特定类型经验或在简历中使用了错误词汇的合格候选人。我们的算法还没有准备好应对该领域目前缺乏结构的问题。如果你必须使用这些工具，请要求你的招聘人员查看拒绝名单以及入选名单。你会对谁被留下来感到惊讶的！\n\
  \n### 发布位置 (Where You Post)\n\n如果你正在寻找最大规模的人才库，考虑在哪里发布以及发布什么非常重要。与你的招聘人员（如果你有的话）明确沟通以了解他们在哪里发布，并推动他们考虑安全特定和非传统的发布地点。\n\
  \n知名的招聘公告板是获得传统候选人广泛覆盖的绝佳起点。它们在数量和覆盖范围方面非常出色。这通常是公司招聘人员开始和结束的地方。你招聘公告的标题和标签可能超级重要；安全类工作可能会海量信息中丢失。例如，一个寻找“安全”（security）工作的候选人可能会淹没在无关的物理安全职位中。相反，寻找“网络安全”（cybersecurity）职位的候选人可能会错过你的“信息安全”（information\
  \ security）公告。\n\n专业安全组织（`ISACA`、`ISC2`、`ISSA` 等）是寻找现有安全人才的好地方，尽管你可能需要加入才能使用他们的看板。候选人已经参与了安全社区，所以如果你正在寻找中高级或高级候选人，这些公告是很好的。初级候选人可能还没有发现这些看板，所以不要在这些地方发布初级职位。\n\
  \n\n\n\n\n不要忽视社交媒体在扩大你的发布范围方面的作用。如果你保持活跃的 LinkedIn、Twitter 或其他社交媒体运营，你可以通过这些渠道推广你的开放职位。在这里，使用标签（hashtags）来与少数群体建立互动也非常有效。让你的团队使用他们自己的账号来传播消息。许多少数群体会更倾向于信任同事发布的帖子，而不是在通用的招聘板上冷冰冰地发布。利用你的人脉和你团队的人脉，将信息传递给代表性不足的社区。\n\
  \n## 接下来做什么？\n\n有些招聘经理将他们的职位发布视为必须跨越的门槛，以便获得“最优秀的人才”。我认为，职位发布应该是你对该职位人员所需的`minimum`最低标准，而不是最高标准。发布内容需要具有亲和力且非规定性，以便让尽可能多的人认为自己适合你的职位。\n\
  \n*   通过为你的工作撰写一份职位发布来练习。你会如何让语言更具包容性？你`really`真的需要哪些技能？你在工作中学了什么？将其与你申请该职位时使用的职位描述进行比较。有什么不同之处？为什么？（顺便说一下，对于你团队中任何负责招聘的人来说，都是一个非常棒的练习。）\n\
  *   选取你现有的一些职位发布，并通过反偏见语言应用处理。哪些词需要更改？\n*   与你的招聘人员交流，了解他们从开始到结束的流程。他们在哪里发布职位？职位发布持续多久？他们如何对开放职位进行营销？你可以在哪里增加投入，以便你的职位能够触达尽可能多的社区？\n\
  *   查看 NICE 框架 ([`www.nist.gov/itl/applied-cybersecurity/nice/nice-framework-resource-center`](https://www.nist.gov/itl/applied-cybersecurity/nice/nice-framework-resource-center))\
  \ 和 [Cyberseek.org](http://cyberseek.org)，获取关于技能、薪资和其他基准项目的美国资源。\n*   调查网络安全网络小组中的多样性和包容性，寻找可以用于在你的发布内容中的标签。\n\
  \nWileyPRE\n\n# 第 19 章：我如何鼓励多样性？\n\n建立你想要和需要的社区是作为安全领导者的乐趣部分之一。然而，当你刚开始时，多样性问题可能不会出现。相反，经理会在职业生涯的某个阶段（以及作为经理的成熟度上）开始关注公平问题。这通常发生在某人担任经理一段时间后，并且已经很大程度上掌握了基本管理技能之后。\n\
  \n当这种情况发生时，领导者必须从现有的资源开始。经理领导一个流失率低的团队或一个快速增长的团队。无论哪种，都有方法可以有意地培养一个由不同风格、背景和经验的人组成的多元化团队，他们将为团队更高的性能做出贡献。\n\
  \n从任何衡量来看，安全行业都不是一个以多样性著称的行业。因此，经理们需要特别注意以建立多样化的团队。\n\n从比例上看，与其他科学、技术、工程和数学（STEM）专业相比，安全行业的女性、黑人和棕色人人以及\
  \ LGBTQ+ 群体更少。事实并非如此，公司和行业内部正在采取许多措施来解决这一差距。安全团队在我们的集体形象上挣扎。如果我们看到少数群体，他们通常处于销售、人力资源（HR）或相邻的支持职位上。我们在核心技术、安全或风险职能中并不经常看到少数群体。找到这些人；了解他们，建立关系，并寻求他们的帮助以实现你的目标并让你的团队变得更好。\n\
  \n考虑多样性以及如何在你的团队中培养包容性和公平是一项持续的学习活动。人不是他们的标签，许多人同时具有多种多样性属性。作为经理，一次性学习如何管理这一切可能会让人措措从心。重点在于开始做，并对学习新事物保持开放。这是一个帮助我们自己并让我们生活变得更好的机会。\n\
  \n## 从数字开始\n\n`Diversity`（多样性）对很多人来说有许多含义。从理解它对你和你的公司意味着什么开始。你对引入任何程度的代表性不足的人感兴趣，还是你心中有一个目标？如果是的话，目标是什么？为什么是这个数字？你离它很近还是很远？也许你的目标不是一个固定的数字；相反，你可能想向比现在不同的目标迈进，那么那会是什么样子的？\n\
  \n考虑你目前所在地的人口代表性（小到一个小镇，大到一国家）是合理的。人口中男性、女性或其他人的比例是多少？黑人或棕色人的百分比是多少？移民或第一代国籍者的百分比是多少？LGBTQ+？地区的人口统计数据怎样的？考虑你招聘池的位置，然后考虑你目前的团队。他们是否公平地代表了他们工作的社区？将你的团队与社区比例相匹配不必是你的最终目标，但它是一个起点。\n\
  \n技术行业中流行的另一种方法是看向你的客户。他们多样化吗？情感分析可以衡量你目前的团队在多程度上满足了不同背景客户的需求。许多团队随后使用这些数据，使团队成员的代表尽可能接近他们的客户或合作伙伴基础。除了获得多样性红利，这种方法还可以让你的团队更好地服务和支持客户、非技术合作伙伴以及业务。\n\
  \n建立你的基础数字，然后看看哪里有机会机会。努力留住你已有的多样化人才，并在团队增长或发生员工流失时增加人才。随着时间的推移，你可以改变局面。\n\n## 理解你的文化问题\n\
  \n如果那些人在加入后无法在你的组织中获得成功、支持和赞誉，那么跑去招聘多样化人才也是没有。考虑你团队的运作方式和环境，并询问自己和他人你的环境是否支持多样化员工。\n\
  \n从物理环境开始。办公室墙上挂着什么艺术品？演示材料中使用了哪些图像？有支持哺乳的空间吗？有供内向者的安静空间，也有供外向者协作小组空间吗？当团队聚餐时，菜单上是否包含了族裔食物？你的空间对轮椅、服务犬或神经多样性者友好吗？这些经常被忽略的细节对于创建一个让你的多元化团队蓬勃发展的环境可以产生重大影响。一个小故事增加了这种重要性：一位同事领导者曾说，他总是看到他最才华明的团队成员之一背着背包进入洗手间，每天三四次。一天，他友好地询问那人在做什么，得知那个人是穆斯林，因为由于没有祈告室，他在厕隔间里铺着垫子祈祷。不用说，第二天就提供了一个祈告室供大家使用。重点在于，如果胜利很重要，那么建立多样化团队就很重要，处理好这些细节同样重要。\n\
  \n\n\n\n\n当你与团队交流或泛指他人时，你会使用哪些代词？哪些常用的技术术语在历史上源于偏见？代表性（或缺乏代表性）非常重要且会被人注意到。找到替代 `you\
  \ guys` 来称呼某群人的其他表达。考虑使用 `block lists`（阻塞列表）或 `allow lists`（允许列表）来代替 `blacklists`（黑名单）或\
  \ `white lists`（白名单）。停止默认使用 `he and him` 这样的代词（更糟糕的是，除了她的女性助理外，对所有人都用 `him`）。考虑改用\
  \ `they`、`them` 和 `their`。作为领导者，你展示了你希望的行为，而你在这些领域的领导力将塑造你的整个组织。\n\n了解你现有的员工。团队中是否有人（特别是经理）以发表不敏感言论而闻名？更糟，他们是否有过违法或引发骚扰的行为？你的领导者是否为女性和多元化人才创造了心理安全的环境？确保你的整个团队都能获得有关多样性、公平性和包容（DEI）问题的培训和意识材料，并对他们的行为有明确的期望。同样重要的是，积极参与设定什么是接受的、什么是不接受的基调。告诉你的领导者和团队你支持或不接受什么。划定红线，并要求你的领导者和团队负责建立和维护你所的文化。多样性问题往往是隐藏的文化问题。\n\
  \n研究一下如何创建一个包容性的工作环境，并看看自己处于什么水平。你可能需要与你自己的管理层、人力资源部门或其他人进行交流——但要从基础开始。与你的团队和其他工作同事讨论这个问题。成为多元化群体和问题的发声支持者。在要求他人加入之前，先理好自己的家务。\n\
  \n有很多棒的资源——包括书面的面对面的——可以学习。大多数公司仍在不断尝试哪些方法有效。继续学习！\n\n## 吸引多元化人才\n\n多元化人才到处都是。我重复一遍：多元化人才到处都是。对于一些经理来说，很难知道去哪里寻找他们。答案是？人脉。作为领导者，你需要进入社区，并让他们知道你欢迎多元化的员工和团队成员。（这不仅是为了为自己的团队招聘人员，还意味着为公司跨所有团队倡导多样性。）与网络安全女性组织\
  \ (`WiCys.org` (http://wicys.org)) 或少数族网络安全专业人士国际联盟 (`ICMCP.org` (http://icmcp.org))\
  \ 等小组互动，了解员工需要什么样的公平对待，并建立招聘伙伴关系。\n\n在社交媒体（Twitter、LinkedIn、Instagram 等）上保持活跃，并在公司发布开放职位时标记（tag）多元化群体。社交媒体可以帮助你在你通常不会去的地方出现，如果你建立立了关注多样性和包容性的声誉，口碑就会传开。（如果你不在乎这些，负面口碑也会传开。）\n\
  \n以下是你可以在社交媒体上使用的一些多样性标签：\n\n* @wisporg\n* #ShareTheMicInCyber\n* @ICMCP\\_ORG\n\
  * @WiCySorg\n* #BlackTechTwitter\n* #infosecjobs\n* #Neurodiversity\n* #Womenintech\n\
  * #WomenInCyber\n* #veteransemployment\n\n不要害羞亲自邀请多元化候选人申请你的职位。特别是在安全领域，代表性不足群体的人脉很广，他们知道什么时候经理或组织会支持他们的职业。让这些群体认识你，你将打开以前被忽视的大门。寻找机会与员工网络小组和行业小组讨论这个问题。听听多元化群体告诉你的你需要什么，以及你可以如何提供帮助。\n\
  \n考虑与可以作为人才输送管道的“输送源”组织建立关系。也许有一所当地的社区学院或大学拥有多元化的学生。也许有针对退伍军人、孤儿儿童或女性的在线训练营，也许你可以赞助一个学生（或一个计划！）。考虑国家性的（如\
  \ Pers Scholars）或区域性的学徒计划。投资于建立可持续的人才管道，你将转型你的团队。导师多元化人士。他们会从你那里学到很多，我保证你也会从他们那里学到很多。\n\
  \n##编写职位描述和发布\n\n吸引多元化候选人的最大障碍之一是典型的职位广告。职位描述的要点是让候选人在其中看到自己——而不是为了任意地过滤掉不合适的候选人。你对“不合适”的定义是基于你自己的经验和偏见的，所以让多元化候选人为你开眼界，看看你可能没有考虑过的想法。再次研究如何撰写让多元化候选人考虑申请的职位描述。简而言之，只要求你绝对需要的东西——不要多。如果可以，删除“优先技能”部分。花时间解释这个职位如何符合你的团队，以及你的团队如何融入公司。（详情参见第\
  \ 18 章 (`#c18.xhtml`)，“如何编写职位描述？”。）\n\n强调组织将通过培训、工作与生活的平衡、支持、导师、赞助等支持候选人的发展。没有人从一开始就能满足所有要求。（如果他们满足，他们为什么还需要你的工作？他们已经知道了了。）多元化候选人对文化契合工作条件的关注比传统候选人更多——因为多元化候选人必须付出更多努力，如果不合适，他们的损失更大。所以确保他们在加入你和你的团队之前，就知道预期是什么。\n\
  \n如果你发布职位后候选人池缺乏多元化背景的人员，考虑重新撰写并发布。问问你自己和他人，在编写和广告投放上可能需要改变什么以吸引多元化的候选人阵容。利用你的人脉和社交媒体，向不同光谱的人（神经多样性、退伍军人、代表性不足少数群体、LGBTQ+\
  \ 等）寻求建设性反馈。不要害羞再次尝试。\n\n\n\n\n\n安排一组人员参与面试过程，并确保小组的规模与职位的水平相匹配。（初级职位的候选人不需要与 25\
  \ 个人或公司的首席执行官见面！）这个团队可以帮助招聘经理从候选人池中筛选、面试被选中的候选人，并向经理提出最终的录用建议。确保团队了解该职位是什么、你希望候选人具备什么样的技能/经验，以及如何评估这些候选人。如果面试团队缺乏多样性，你对多元化背景申请者的吸引力就会降低。（不要忘记，面试是双向的。他们对你的面试程度并不亚于你对他们面试的程度。）确保与申请者接触的人尽可能多样化。如有必要，引入来自你直接团队之外的人员。（如果如果你的团队是同质化的，这可能是必要的。）\n\
  \n目前有一种技术趋势，即在面试过程中“测试”候选人的专业领域知识。这对于任何候选人来说都是具有争议的，但对于多元化背景的候选人来说尤其如此。如果你决定必须将测试作为招聘流程的一部分，请从一开始就明确这一点，并尽一切努力让测试尽可能没有偏见。事实上，从开始就让整个招聘过程透明化。让潜在候选人知道包含哪些内容，以便他们判断这个过程是否值得投入时间。有多少次面试？是否有测试？他们是否必须作为流程的一部分进行演示或提交论文？你计划何时招聘？这不仅有助于你的多元化候选人，对所有候选人都有帮助。\n\
  \n## 留住多元化人才\n\n你从一个代表性不足的群体中聘用了一个人。做得好！你如何确保由于缺乏包容性实践而不是他们选择离开你组织的原因？更重要的是，如何在在这份人才对你们双方都具有价值的这段时间内留住他们呢？\n\
  \n确保所有经理都接受过管理多样化团队的培训，并接受过内性偏见培训。人们加入公司，但他们离开是因为经理，因此，如果你和其他经理没有具备支持多样性的培训/技能，你和他们就需要学习。这种培训应该在招聘开始之前进行，但实际上，这是一项经理应该接受重新培训并被定期接受问责的技能。\n\
  \n提供员工网络支持。对于大多数领导者来说，这里有一些挑战性的问题：你认识你所有的多元化人才吗？如果他们在走廊里看到你，你能通过名字、故事或成就认出他们吗？还是说你只有在招聘和留人时才会接触多元化人才？你（以及你的领导层）可能并不认识你的多元化人才。而且，你的多元化人才可能互不相认识。如果你的公司足够大，请创建员工网络小组，例如“科技界女性”、“安全领域的少数群体”、“职场父母”、“LGBTQ+\
  \ 联盟”等。确保你和其他经理也积极参与这些小组。如果你的公司还没有大到可以拥有自己的网络小组，请在你们所在的地区（或在线）寻找小组，并鼓励你的员工（所有人，而不仅仅是少数群体）参与。如果你和你的经理也参加，无论他们自身的多样化特征如何，那将是加分项。\n\
