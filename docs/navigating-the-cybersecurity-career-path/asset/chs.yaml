  \ 安全行业并不特别多样化。在这一章中，我们讨论了少数裔成功的应对策略，无论当前环境如何。\n-   **第 11 章，“我如何进步？”** —— 在这一章中，我们讨论了如何职业发展，包括成为技术专家还是全才型，以及通常情况下如何在领域内流动。\n\
