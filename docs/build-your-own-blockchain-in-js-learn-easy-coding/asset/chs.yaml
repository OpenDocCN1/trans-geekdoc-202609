  \n## 哈希算法\n\n在上述区块链实现中，使用的哈希算法是 SHA-256（安全哈希算法 256 位）。这是许多区块链网络（包括比特币）常用的哈希算法。\n\
  \n在 `Block` 类中，`calculateHash` 方法使用 SHA-256 算法创建区块内容的哈希值。以下代码片段展示了 JavaScript 中\
  \ SHA-256 哈希的实现：\n\n```javascript\nconst SHA256 = require(\"crypto-js/sha256\");\n\
  \nclass Block {\n  constructor(index, timestamp, data, previousHash = \"\") {\n\
  \    this.index = index;\n    this.timestamp = timestamp;\n    this.data = data;\n\
  \    this.previousHash = previousHash;\n    this.hash = this.calculateHash();\n\
  \    this.nonce = 0;\n  }\n\n  calculateHash() {\n    return SHA256(\n      this.index\
  \ +\n      this.previousHash +\n      this.timestamp +\n      JSON.stringify(this.data)\
  \ +\n      this.nonce\n    ).toString();\n  }\n\n  mineBlock(difficulty) {\n   \
  \ while (\n      this.hash.substring(0, difficulty) !== Array(difficulty + 1).join(\"\
  0\")\n    ) {\n      this.nonce++;\n      this.hash = this.calculateHash();\n  \
  \  }\n  }\n}\n```\n\n此处，`SHA256` 从 `crypto-js` 库导入，并用于在 `calculateHash` 方法中计算区块内容的哈希值。\n\
  \n## 为上述新币种创建钱包\n\n要为新币种创建钱包，您需要生成一个由公钥和私钥组成的密钥对。公钥是其他用户发送币种的地址，私钥用于签署交易并证明对与该地址关联的币种的所有权。以下是使用\
  \ JavaScript 中的 `elliptic` 库创建密钥对的示例：\n\n```javascript\nconst EC = require('elliptic').ec;\n\
  const ec = new EC('secp256k1');\n\nclass Wallet {\n  constructor() {\n    this.keyPair\
  \ = ec.genKeyPair();\n    this.publicKey = this.keyPair.getPublic('hex');\n    this.privateKey\
  \ = this.keyPair.getPrivate('hex');\n  }\n}\n```\n\n此处，使用 `secp256k1` 曲线创建 `EC`\
  \ 类的实例，该曲线与比特币使用的曲线相同。然后，在 `Wallet` 类构造函数中，使用 `genKeyPair` 方法生成新的密钥对，并提取公钥和私钥，将它们作为钱包对象的属性存储。\n\
  \n使用此代码，您可以通过调用 `new Wallet()` 创建一个新的钱包对象，这将生成一个新的密钥对，并返回包含公钥和私钥属性的相应钱包对象。然后，您可以使用公钥接收币种，使用私钥签署交易并花费币种。\n\
  \n## 自动生成公钥和私钥\n\n要为每个钱包自动生成公钥和私钥，可以修改 `Wallet` 构造函数，使其在未提供密钥作为参数时生成新的密钥对，如下所示：\n\
  \n```javascript\nconst EC = require('elliptic').ec;\nconst ec = new EC('secp256k1');\n\
  \nclass Wallet {\n  constructor(publicKey = null, privateKey = null) {\n    if (!publicKey\
  \ || !privateKey) {\n      const keyPair = ec.genKeyPair();\n      this.publicKey\
  \ = keyPair.getPublic('hex');\n      this.privateKey = keyPair.getPrivate('hex');\n\
  \    } else {\n      this.publicKey = publicKey;\n      this.privateKey = privateKey;\n\
  \    }\n  }\n}\n```\n\n此处，`publicKey` 和 `privateKey` 参数是可选的，如果未提供，则使用 `EC` 类的 `genKeyPair`\
  \ 方法生成新的密钥对。否则，如果提供了密钥，则将它们用作钱包的公钥和私钥。\n\n通过此修改，您可以在不提供任何密钥的情况下创建新的钱包对象，如下所示：`new\
  \ Wallet()`。这将生成一个新的密钥对，并返回包含公钥和私钥属性的相应钱包对象。或者，您可以使用特定密钥创建钱包对象，如下所示：`new Wallet('public\
  \ key', 'private key')`。\n\n\n\n\n## 生成后打印公钥和私钥\n\n使用 `Wallet` 类生成新钱包后，您可以作为钱包对象的属性访问公钥和私钥。以下是生成新钱包后打印公钥和私钥的示例：\n\
  \n```\nconst myWallet = new Wallet();\nconsole.log('Public key: ' + myWallet.publicKey);\n\
  console.log('Private key: ' + myWallet.privateKey);\n```\n\n此代码使用 `Wallet` 类创建一个新的钱包对象并将其赋值给\
  \ `myWallet` 变量。然后，它使用 `console.log()` 将公钥和私钥记录到控制台。您可以将 `myWallet` 替换为您自己的变量名，并使用\
  \ `publicKey` 和 `privateKey` 属性来访问您钱包对应的密钥。\n\n## 如何从钱包发送和接收币\n\n要从钱包发送和接收币，您需要使用私钥创建并签名交易，然后将交易广播到网络以进行验证并打包入区块链。\n\
  \n以下是如何创建交易对象并使用 JavaScript 中的 elliptic 库通过钱包私钥对其进行签名的示例：\n\n```\nconst EC = require('elliptic').ec;\n\
  const ec = new EC('secp256k1');\n\nclass Transaction {\n  constructor(sender, recipient,\
  \ amount) {\n    this.sender = sender;\n    this.recipient = recipient;\n    this.amount\
  \ = amount;\n    this.timestamp = Date.now();\n  }\n\n  calculateHash() {\n    return\
  \ crypto.createHash('sha256').update(this.sender + this.recipient + this.amount\
  \ + this.timestamp).digest('hex');\n  }\n\n  signTransaction(privateKey) {\n   \
  \ const key = ec.keyFromPrivate(privateKey);\n    const signature = key.sign(this.calculateHash(),\
  \ 'base64');\n    this.signature = signature.toDER('hex');\n  }\n\n  isValid() {\n\
  \    if (!this.signature || this.signature.length === 0) {\n      return false;\n\
  \    }\n    const key = ec.keyFromPublic(this.sender, 'hex');\n    return key.verify(this.calculateHash(),\
  \ this.signature);\n  }\n}\n```\n\n在这里，`Transaction` 类构造函数接受三个参数：交易的发送方、接收方和金额。时间戳使用\
  \ `Date.now()` 自动设置为当前时间。`calculateHash` 方法计算交易数据的 SHA-256 哈希值，`signTransaction`\
  \ 方法使用 `EC` 类的 `keyFromPrivate` 方法通过给定的 `privateKey` 对交易进行签名，并将生成的签名作为交易对象的属性存储。`isValid`\
  \ 方法通过使用 `keyFromPublic` 方法验证签名并返回布尔值来检查交易是否有效。\n\n要从钱包发送币，您可以使用发送方、接收方和金额字段创建一个新的交易对象，然后使用交易对象的\
  \ `signTransaction` 方法通过您的私钥对其进行签名。示例如下：\n\n```\nconst myWallet = new Wallet();\n\
  const recipientAddress = 'recipient public key';\nconst amountToSend = 10;\nconst\
  \ transaction = new Transaction(myWallet.publicKey, recipientAddress, amountToSend);\n\
  transaction.signTransaction(myWallet.privateKey);\n```\n\n在该代码中，使用 `Wallet` 类创建一个新的钱包对象并将其赋值给\
  \ `myWallet` 变量。然后，指定接收地址和发送金额。接下来，使用 `Transaction` 类创建一个新的交易对象，发送方设为 `myWallet.publicKey`，接收方设为\
  \ `recipientAddress`，金额设为 `amountToSend`。最后，调用 `signTransaction` 方法并传入 `myWallet.privateKey`\
  \ 作为参数来对交易进行签名。\n\n要接收币到钱包，您只需将您的公钥（即钱包地址）分享给其他用户，他们即可向该地址发送币。您可以通过遍历区块链并累加所有以该地址为接收方的交易金额来查询该地址的余额。\n\
  \n## 包含上述所有添加功能的完整代码\n\n以下是一个完整的 JavaScript 程序示例，包含区块链实现及新增功能，如自定义币种名称、总供应量、挖矿奖励、挖矿间隔、减半周期，以及带有公私钥生成和交易功能的钱包功能：\n\
  \n```\nconst SHA256 = require('crypto-js/sha256');\nconst EC = require('elliptic').ec;\n\
  const ec = new EC('secp256k1');\n\nclass Transaction {\n  constructor(sender, recipient,\
  \ amount) {\n    this.sender = sender;\n    this.recipient = recipient;\n    this.amount\
  \ = amount;\n  }\n\n  calculateHash() {\n    return SHA256(this.sender + this.recipient\
  \ + this.amount).toString();\n  }\n\n  signTransaction(signingKey) {\n    if (signingKey.getPublic('hex')\
  \ !== this.sender) {\n      throw new Error('You cannot sign transactions for other\
  \ wallets!');\n    }\n    const hashTx = this.calculateHash();\n    const sig =\
  \ signingKey.sign(hashTx, 'base64');\n    this.signature = sig.toDER('hex');\n \
  \ }\n\n  isValid() {\n    if (this.sender === null) return true;\n    if (!this.signature\
  \ || this.signature.length === 0) {\n      throw new Error('No signature in this\
  \ transaction');\n    }\n    const publicKey = ec.keyFromPublic(this.sender, 'hex');\n\
  \    return publicKey.verify(this.calculateHash(), this.signature);\n  }\n}\n\n\
  class Block {\n  constructor(timestamp, transactions, previousHash = '') {\n   \
  \ this.timestamp = timestamp;\n    this.transactions = transactions;\n    this.previousHash\
  \ = previousHash;\n    this.hash = this.calculateHash();\n    this.nonce = 0;\n\
  \  }\n\n  calculateHash() {\n    return SHA256(\n      this.previousHash +\n   \
  \   this.timestamp +\n      JSON.stringify(this.transactions) +\n      this.nonce\n\
  \    ).toString();\n  }\n\n  mineBlock(difficulty) {\n    while (\n      this.hash.substring(0,\
  \ difficulty) !== Array(difficulty + 1).join('0')\n    ) {\n      this.nonce++;\n\
  \      this.hash = this.calculateHash();\n    }\n    console.log('Block mined: '\
  \ + this.hash);\n  }\n\n  hasValidTransactions() {\n    for (const tx of this.transactions)\
  \ {\n      if (!tx.isValid()) {\n        return false;\n      }\n    }\n    return\
  \ true;\n  }\n}\n\nclass Blockchain {\n  constructor(coinName, totalSupply, miningReward,\
  \ miningInterval, halvingPeriod, halvingPercentage) {\n    this.chain = [this.createGenesisBlock()];\n\
  \    this.difficulty = 2;\n    this.pendingTransactions = [];\n    this.miningReward\
  \ = miningReward;\n    this.coinName = coinName;\n    this.totalSupply = totalSupply;\n\
  \    this.miningInterval = miningInterval;\n    this.halvingPeriod = halvingPeriod;\n\
  \    this.halvingPercentage = halvingPercentage;\n  }\n\n  createGenesisBlock()\
  \ {\n    return new Block('01/01/2021', 'Genesis block', '0');\n  }\n\n  getLatestBlock()\
  \ {\n    return this.chain[this.chain.length - 1];\n  }\n\n  minePendingTransactions(miningRewardAddress)\
  \ {\n    const rewardTx = new Transaction(\n      null,\n      miningRewardAddress,\n\
  \      this.miningReward\n    );\n    this.pendingTransactions.push(rewardTx);\n\
  \    let block = new Block(\n      Date.now(),\n      this.pendingTransactions,\n\
  \      this.getLatestBlock().hash\n    );\n    block.mineBlock(this.difficulty);\n\
  \    console.log('Block successfully mined!');\n    this.chain.push(block);\n  \
  \  this.pendingTransactions = [];\n  }\n\n  addTransaction(transaction) {\n    if\
  \ (!transaction.sender || !transaction.recipient) {\n      throw new Error('Transaction\
  \ must include sender and recipient addresses');\n    }\n    Find this code in GitHub\
  \ and Fork the repository.\n  }\n}\n```\n\n\n\n\n\n## 在 VPS 上编译代码\n\n要在 VPS（虚拟专用服务器）上运行此代码，请遵循以下步骤：\n\
