  \   this.nonce = 0;\n    this.hash = this.calculateHash();\n  }\n\n  calculateHash()\
  \ {\n    return sha256(this.index + this.previousHash + this.timestamp + JSON.stringify(this.data)\
  \ + this.nonce).toString();\n  }\n\n  mineBlock(difficulty) {\n    while (this.hash.substring(0,\
  \ difficulty) !== Array(difficulty + 1).join(\"0\")) {\n      this.nonce++;\n  \
  \    this.hash = this.calculateHash();\n    }\n    console.log(\"Block mined: \"\
  \ + this.hash);\n  }\n}\n```\n\n## Blockchain 类（基础版）\n\n```javascript\nclass Blockchain\
