  fmt: "\n# How to Do Mining for Above Coin\n\nTo mine a new coin, you would need\
    \ to perform a series of computationally intensive mathematical calculations in\
    \ order to generate new blocks in the blockchain network. The steps to mine a\
    \ new coin using the example code we have discussed earlier are:\n\n1.  Run the\
    \ node application on your system or VPS using the command `node index.js`.\n\
    2.  Create a new wallet using the `/wallet/new` API endpoint and store the public\
