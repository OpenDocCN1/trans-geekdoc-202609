    \       }       isValid() {       if (!this.signature || this.signature.length\
    \ \\=== 0) {       return false;       }       const key \\= ec.keyFromPublic(this.sender,\
    \ 'hex');       return key.verify(this.calculateHash(), this.signature);       }\
    \       }       Here, the Transaction class constructor takes three arguments:\
    \ the sender, recipient, and amount of the transaction. The timestamp is automatically\
