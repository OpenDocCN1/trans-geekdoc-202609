    \ {\n        return false;\n      }\n    }\n    return true;\n  }\n}\n```\n\n\
    在该示例中，我们向 `Blockchain` 类添加了 `isChainValid` 方法来检查链是否有效。该方法遍历链中的每个区块，从第二个区块开始（因为第一个区块是创世区块，没有前一个区块可供验证）。\n\
    \n对于每个区块，我们首先检查区块的 `hash` 属性是否与使用 `calculateHash` 方法计算的哈希值匹配。如果哈希值不匹配，说明区块中的数据已被篡改，我们返回\
