- raw: "Compile the code in VPS    To run this code on a VPS (Virtual Private Server),\
    \ you need to follow these steps:    Install Node.js: You can install Node.js\
    \ on your VPS by following the installation instructions for your specific operating\
    \ system.  Install the required packages: Once you have installed Node.js, navigate\
    \ to your project directory and run the following command to install the required\
    \ packages:         npm install       3\\. Start the server: After installing\
    \ the required packages, start the server by running the following command:       node\
    \ index.js       This will start the server on port 3000 by default. If you want\
    \ to use a different port, you can specify it in the index.js file by changing\
    \ the value of the port variable.       4\\. Access the blockchain: Once the server\
    \ is running, you can access the blockchain by visiting http://your\\_vps\\_ip\\\
    _address:3000 in your web browser. You should see the blockchain information and\
    \ the mining and transaction forms.       Note: Make sure you have opened the\
    \ port 3000 in the firewall of your VPS to access the blockchain from the internet.\
    \  \n\nHow to install nodes    The steps to install Node.js on a VPS will depend\
    \ on the operating system you are using. Here are the general steps for some popular\
    \ operating systems:       For Ubuntu/Debian:    Update the package index and\
    \ install the dependencies for Node.js:         sudo apt-get update       sudo\
    \ apt-get install curl git-core build-essential openssl libssl-dev    Install\
    \ Node.js using the package manager:         curl \\-sL https://deb.nodesource.com/setup\\\
    _14.x | sudo \\-E bash \\-       sudo apt-get install \\-y nodejs       For CentOS/RHEL:\
    \    Install the EPEL repository and the dependencies for Node.js:         sudo\
    \ yum install epel-release       sudo yum install curl git-core openssl-devel\
    \    Install Node.js using the package manager:         curl \\-sL https://rpm.nodesource.com/setup\\\
    _14.x | sudo bash \\-       sudo yum install \\-y nodejs       For Windows:   \
    \ Download the Node.js installer from the official  Run the installer and follow\
    \ the installation wizard.         Once you have installed Node.js, you can verify\
    \ the installation by running the following command in your terminal:       node\
    \ \\-v       This should output the version number of Node.js if it was installed\
    \ correctly.       Once you have installed Node.js, you can proceed with installing\
    \ the required packages for your blockchain project.    Navigate to your project\
    \ directory using the terminal:         cd /path/to/your/project    Initialize\
    \ your project by running the following command:         npm init \\-y    Install\
    \ the required packages by running the following command:         npm install\
    \ express body-parser crypto-js ejs nodemon—save       This will install the following\
    \ packages:    ●  express: A Node.js web framework for building web applications.\
    \    ●  body-parser: A middleware for parsing request bodies in a readable format.\
    \    ●  crypto-js: A library for implementing cryptographic algorithms.    ● \
    \ ejs: A template engine for generating HTML markup with JavaScript.    ●  nodemon:\
    \ A tool for automatically restarting the server when changes are made to the\
    \ code.         Once the packages are installed, you can start the server using\
    \ the command       nodemon index.js.  \n\nHow to create explorer for above new\
    \ coin    To create an explorer for your blockchain, you can follow these general\
    \ steps:    Create a new directory for your explorer and navigate to it:         mkdir\
    \ blockchain-explorer       cd blockchain-explorer    Initialize your project\
    \ using npm:         npm init \\-y    Install the following dependencies:         npm\
    \ install express body-parser ejs request-promise—save       Here's a brief description\
    \ of each package:    ●  express: A Node.js web framework for building web applications.\
    \    ●  body-parser: A middleware for parsing request bodies in a readable format.\
    \    ●  ejs: A template engine for generating HTML markup with JavaScript.   \
    \ ●  request-promise: A library for making HTTP requests with Promises.    Create\
    \ an index.js file for your server and add the following code:         const express\
    \ \\= require('express');       const bodyParser \\= require('body-parser'); \
    \      const ejs \\= require('ejs');       const rp \\= require('request-promise');\
    \       const app \\= express();       app.set('view engine', 'ejs');       app.use(bodyParser.urlencoded({\
    \ extended: true }));       // Define your routes here       app.listen(3000,\
    \ () \\=> console.log('Blockchain explorer running on port 3000'));    Define\
    \ your routes for the explorer. Here are some examples:         // Route for displaying\
    \ the blockchain       app.get('/blockchain', async (req, res) \\=> {       const\
    \ blockchain \\= await rp('http://localhost:3001/blockchain');       res.render('blockchain',\
    \ { blockchain: JSON.parse(blockchain) });       });       // Route for displaying\
    \ a specific block       app.get('/block/:blockHash', async (req, res) \\=> {\
    \       const block \\= await rp(\\`http://localhost:3001/block/${req.params.blockHash}\\\
    `);       res.render('block', { block: JSON.parse(block) });       });       //\
    \ Route for displaying a specific transaction       app.get('/transaction/:transactionId',\
    \ async (req, res) \\=> {       const transaction \\= await rp(\\`http://localhost:3001/transaction/${req.params.transactionId}\\\
    `);       res.render('transaction', { transaction: JSON.parse(transaction) });\
    \       });    Create the corresponding views for your routes in a views directory.\
    \ Here's an example for the blockchain route:         html>                     \
    \               \n\n# Blockchain Explorer\n\n## Blockchain\n\n     <% blockchain.forEach((block)\
    \ \\=> { %>        *        href=\"/block/<%= block.hash %>\">Block <%= block.index\
    \ %>              <% }); %>                         Start the server using node\
    \ index.js or nodemon index.js if you have nodemon installed.         This is\
    \ a basic example of how you can create an explorer for your blockchain. You can\
    \ customize it according to your needs and add more functionality.  \n\nWhat is\
    \ API for above new coin    API (Application Programming Interface) is a set of\
    \ rules, protocols, and tools for building software and applications that interact\
    \ with a blockchain network. In the case of a new coin, you would need to define\
    \ and implement the API endpoints for various actions such as creating a new wallet,\
    \ sending and receiving coins, getting the balance of a wallet, and retrieving\
    \ transaction details.       The API can be built using any programming language\
    \ or framework that supports HTTP requests and responses, such as Node.js or Django.\
    \ The API endpoints can be exposed through a web server or cloud platform such\
    \ as AWS or Google Cloud.       Some popular blockchain APIs include Ethereum's\
    \ JSON-RPC API and Bitcoin's RESTful API. However, for a new coin, you would need\
    \ to define and implement your own API endpoints based on the features and functionality\
    \ of your coin.  "
  fmt: "\n# 在 VPS 上编译代码\n\n要在 VPS（虚拟专用服务器）上运行此代码，请遵循以下步骤：\n\n## 安装 Node.js\n\n根据您的特定操作系统，按照安装说明在\
    \ VPS 上安装 `Node.js`。\n\n## 安装所需包\n\n安装完 `Node.js` 后，导航至项目目录并运行以下命令以安装所需包：\n\n\
    ```\nnpm install\n```\n\n## 启动服务器\n\n安装完所需包后，运行以下命令启动服务器：\n\n```\nnode index.js\n\
    ```\n\n这将默认在端口 `3000` 上启动服务器。如果您想使用其他端口，可以通过修改 `index.js` 文件中 `port` 变量的值来指定。\n\
    \n## 访问区块链\n\n服务器运行后，您可以在 Web 浏览器中访问 `http://your_vps_ip_address:3000` 来访问区块链。您应该能看到区块链信息以及挖矿和交易表单。\n\
    \n> **注意：** 请确保在 VPS 的防火墙中开放了端口 `3000`，以便从互联网访问区块链。\n\n---\n\n# 如何安装 Node.js\n\
    \n在 VPS 上安装 `Node.js` 的步骤取决于您使用的操作系统。以下是一些流行操作系统的通用步骤：\n\n## Ubuntu/Debian\n\n\
    更新软件包索引并安装 `Node.js` 的依赖项：\n\n```\nsudo apt-get update\nsudo apt-get install curl\
    \ git-core build-essential openssl libssl-dev\n```\n\n使用包管理器安装 `Node.js`：\n\n\
    ```\ncurl -sL https://deb.nodesource.com/setup_14.x | sudo -E bash -\nsudo apt-get\
    \ install -y nodejs\n```\n\n## CentOS/RHEL\n\n安装 EPEL 仓库和 `Node.js` 的依赖项：\n\n\
    ```\nsudo yum install epel-release\nsudo yum install curl git-core openssl-devel\n\
    ```\n\n使用包管理器安装 `Node.js`：\n\n```\ncurl -sL https://rpm.nodesource.com/setup_14.x\
    \ | sudo bash -\nsudo yum install -y nodejs\n```\n\n## Windows\n\n从官方网站下载 `Node.js`\
    \ 安装程序。运行安装程序并按照安装向导操作。\n\n安装完 `Node.js` 后，可以通过在终端运行以下命令来验证安装：\n\n```\nnode -v\n\
    ```\n\n如果安装正确，这应该会输出 `Node.js` 的版本号。\n\n安装完 `Node.js` 后，您可以继续为区块链项目安装所需包。\n\n\
    使用终端导航至项目目录：\n\n```\ncd /path/to/your/project\n```\n\n通过运行以下命令初始化项目：\n\n```\n\
    npm init -y\n```\n\n通过运行以下命令安装所需包：\n\n```\nnpm install express body-parser crypto-js\
    \ ejs nodemon --save\n```\n\n这将安装以下包：\n\n- `express`：用于构建 Web 应用程序的 Node.js Web\
    \ 框架。\n- `body-parser`：用于以可读格式解析请求体的中间件。\n- `crypto-js`：用于实现加密算法的库。\n- `ejs`：用于通过\
    \ JavaScript 生成 HTML 标记的模板引擎。\n- `nodemon`：当代码发生更改时自动重启服务器的工具。\n\n包安装完成后，可以使用以下命令启动服务器：\n\
    \n```\nnodemon index.js\n```\n\n---\n\n# 如何为上述新币创建浏览器\n\n要为您的区块链创建浏览器，可以遵循以下通用步骤：\n\
    \n为浏览器创建一个新目录并导航至其中：\n\n```\nmkdir blockchain-explorer\ncd blockchain-explorer\n\
    ```\n\n使用 `npm` 初始化项目：\n\n```\nnpm init -y\n```\n\n安装以下依赖项：\n\n```\nnpm install\
    \ express body-parser ejs request-promise --save\n```\n\n以下是每个包的简要说明：\n\n- `express`：用于构建\
    \ Web 应用程序的 Node.js Web 框架。\n- `body-parser`：用于以可读格式解析请求体的中间件。\n- `ejs`：用于通过 JavaScript\
    \ 生成 HTML 标记的模板引擎。\n- `request-promise`：用于基于 Promise 发起 HTTP 请求的库。\n\n创建服务器的 `index.js`\
    \ 文件并添加以下代码：\n\n```javascript\nconst express = require('express');\nconst bodyParser\
    \ = require('body-parser');\nconst ejs = require('ejs');\nconst rp = require('request-promise');\n\
    const app = express();\n\napp.set('view engine', 'ejs');\napp.use(bodyParser.urlencoded({\
    \ extended: true }));\n\n// 定义您的路由\napp.listen(3000, () => console.log('Blockchain\
    \ explorer running on port 3000'));\n```\n\n为浏览器定义路由。以下是一些示例：\n\n```javascript\n\
    // 显示区块链的路由\napp.get('/blockchain', async (req, res) => {\n  const blockchain\
    \ = await rp('http://localhost:3001/blockchain');\n  res.render('blockchain',\
    \ { blockchain: JSON.parse(blockchain) });\n});\n\n// 显示特定区块的路由\napp.get('/block/:blockHash',\
    \ async (req, res) => {\n  const block = await rp(`http://localhost:3001/block/${req.params.blockHash}`);\n\
    \  res.render('block', { block: JSON.parse(block) });\n});\n\n// 显示特定交易的路由\napp.get('/transaction/:transactionId',\
    \ async (req, res) => {\n  const transaction = await rp(`http://localhost:3001/transaction/${req.params.transactionId}`);\n\
    \  res.render('transaction', { transaction: JSON.parse(transaction) });\n});\n\
    ```\n\n在 `views` 目录中为路由创建相应的视图。以下是区块链路由的示例：\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <title>Blockchain Explorer</title>\n</head>\n<body>\n  <h1>Blockchain\
    \ Explorer</h1>\n  <h2>Blockchain</h2>\n  <% blockchain.forEach((block) => { %>\n\
    \    <ul>\n      <li><a href=\"/block/<%= block.hash %>\">Block <%= block.index\
    \ %></a></li>\n    </ul>\n  <% }); %>\n</body>\n</html>\n```\n\n使用 `node index.js`\
    \ 启动服务器，如果已安装 `nodemon`，也可使用 `nodemon index.js`。\n\n这是为您的区块链创建浏览器的基本示例。您可以根据需要进行自定义并添加更多功能。\n\
    \n---\n\n# 上述新币的 API 是什么\n\n**API**（应用程序编程接口）是一组用于构建与区块链网络交互的软件和应用程序的规则、协议和工具。对于一种新币，您需要为各种操作定义并实现\
    \ API 端点，例如创建新钱包、发送和接收币、获取钱包余额以及检索交易详情。\n\nAPI 可以使用任何支持 HTTP 请求和响应的编程语言或框架构建，例如\
    \ `Node.js` 或 `Django`。API 端点可以通过 Web 服务器或云平台（如 `AWS` 或 `Google Cloud`）暴露。\n\n\
    一些流行的区块链 API 包括 `Ethereum` 的 `JSON-RPC API` 和 `Bitcoin` 的 `RESTful API`。然而，对于一种新币，您需要根据币的特性和功能定义并实现自己的\
    \ API 端点。\n"
  trans: "\n\n# 在 VPS 上编译代码\n\n要在 VPS（虚拟专用服务器）上运行此代码，请遵循以下步骤：\n\n## 安装 Node.js\n\n\
    根据您的特定操作系统，按照安装说明在 VPS 上安装 `Node.js`。\n\n## 安装所需包\n\n安装完 `Node.js` 后，导航至项目目录并运行以下命令以安装所需包：\n\
    \n```\nnpm install\n```\n\n## 启动服务器\n\n安装完所需包后，运行以下命令启动服务器：\n\n```\nnode index.js\n\
    ```\n\n这将默认在端口 `3000` 上启动服务器。如果您想使用其他端口，可以通过修改 `index.js` 文件中 `port` 变量的值来指定。\n\
    \n## 访问区块链\n\n服务器运行后，您可以在 Web 浏览器中访问 `http://your_vps_ip_address:3000` 来访问区块链。您应该能看到区块链信息以及挖矿和交易表单。\n\
    \n> **注意：** 请确保在 VPS 的防火墙中开放了端口 `3000`，以便从互联网访问区块链。\n\n---\n\n# 如何安装 Node.js\n\
    \n在 VPS 上安装 `Node.js` 的步骤取决于您使用的操作系统。以下是一些流行操作系统的通用步骤：\n\n## Ubuntu/Debian\n\n\
    更新软件包索引并安装 `Node.js` 的依赖项：\n\n```\nsudo apt-get update\nsudo apt-get install curl\
    \ git-core build-essential openssl libssl-dev\n```\n\n使用包管理器安装 `Node.js`：\n\n\
    ```\ncurl -sL https://deb.nodesource.com/setup_14.x | sudo -E bash -\nsudo apt-get\
    \ install -y nodejs\n```\n\n## CentOS/RHEL\n\n安装 EPEL 仓库和 `Node.js` 的依赖项：\n\n\
    ```\nsudo yum install epel-release\nsudo yum install curl git-core openssl-devel\n\
    ```\n\n使用包管理器安装 `Node.js`：\n\n```\ncurl -sL https://rpm.nodesource.com/setup_14.x\
    \ | sudo bash -\nsudo yum install -y nodejs\n```\n\n## Windows\n\n从官方网站下载 `Node.js`\
    \ 安装程序。运行安装程序并按照安装向导操作。\n\n安装完 `Node.js` 后，可以通过在终端运行以下命令来验证安装：\n\n```\nnode -v\n\
    ```\n\n如果安装正确，这应该会输出 `Node.js` 的版本号。\n\n安装完 `Node.js` 后，您可以继续为区块链项目安装所需包。\n\n\
    使用终端导航至项目目录：\n\n```\ncd /path/to/your/project\n```\n\n通过运行以下命令初始化项目：\n\n```\n\
    npm init -y\n```\n\n通过运行以下命令安装所需包：\n\n```\nnpm install express body-parser crypto-js\
    \ ejs nodemon --save\n```\n\n这将安装以下包：\n\n- `express`：用于构建 Web 应用程序的 Node.js Web\
    \ 框架。\n- `body-parser`：用于以可读格式解析请求体的中间件。\n- `crypto-js`：用于实现加密算法的库。\n- `ejs`：用于通过\
    \ JavaScript 生成 HTML 标记的模板引擎。\n- `nodemon`：当代码发生更改时自动重启服务器的工具。\n\n包安装完成后，可以使用以下命令启动服务器：\n\
    \n```\nnodemon index.js\n```\n\n---\n\n# 如何为上述新币创建浏览器\n\n要为您的区块链创建浏览器，可以遵循以下通用步骤：\n\
    \n为浏览器创建一个新目录并导航至其中：\n\n```\nmkdir blockchain-explorer\ncd blockchain-explorer\n\
    ```\n\n使用 `npm` 初始化项目：\n\n```\nnpm init -y\n```\n\n安装以下依赖项：\n\n```\nnpm install\
    \ express body-parser ejs request-promise --save\n```\n\n以下是每个包的简要说明：\n\n- `express`：用于构建\
    \ Web 应用程序的 Node.js Web 框架。\n- `body-parser`：用于以可读格式解析请求体的中间件。\n- `ejs`：用于通过 JavaScript\
    \ 生成 HTML 标记的模板引擎。\n- `request-promise`：用于基于 Promise 发起 HTTP 请求的库。\n\n创建服务器的 `index.js`\
    \ 文件并添加以下代码：\n\n```javascript\nconst express = require('express');\nconst bodyParser\
    \ = require('body-parser');\nconst ejs = require('ejs');\nconst rp = require('request-promise');\n\
    const app = express();\n\napp.set('view engine', 'ejs');\napp.use(bodyParser.urlencoded({\
    \ extended: true }));\n\n// 定义您的路由\napp.listen(3000, () => console.log('Blockchain\
    \ explorer running on port 3000'));\n```\n\n为浏览器定义路由。以下是一些示例：\n\n```javascript\n\
    // 显示区块链的路由\napp.get('/blockchain', async (req, res) => {\n  const blockchain\
    \ = await rp('http://localhost:3001/blockchain');\n  res.render('blockchain',\
    \ { blockchain: JSON.parse(blockchain) });\n});\n\n// 显示特定区块的路由\napp.get('/block/:blockHash',\
    \ async (req, res) => {\n  const block = await rp(`http://localhost:3001/block/${req.params.blockHash}`);\n\
    \  res.render('block', { block: JSON.parse(block) });\n});\n\n// 显示特定交易的路由\napp.get('/transaction/:transactionId',\
    \ async (req, res) => {\n  const transaction = await rp(`http://localhost:3001/transaction/${req.params.transactionId}`);\n\
    \  res.render('transaction', { transaction: JSON.parse(transaction) });\n});\n\
    ```\n\n在 `views` 目录中为路由创建相应的视图。以下是区块链路由的示例：\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <title>Blockchain Explorer</title>\n</head>\n<body>\n  <h1>Blockchain\
    \ Explorer</h1>\n  <h2>Blockchain</h2>\n  <% blockchain.forEach((block) => { %>\n\
    \    <ul>\n      <li><a href=\"/block/<%= block.hash %>\">Block <%= block.index\
    \ %></a></li>\n    </ul>\n  <% }); %>\n</body>\n</html>\n```\n\n使用 `node index.js`\
    \ 启动服务器，如果已安装 `nodemon`，也可使用 `nodemon index.js`。\n\n这是为您的区块链创建浏览器的基本示例。您可以根据需要进行自定义并添加更多功能。\n\
    \n---\n\n# 上述新币的 API 是什么\n\n**API**（应用程序编程接口）是一组用于构建与区块链网络交互的软件和应用程序的规则、协议和工具。对于一种新币，您需要为各种操作定义并实现\
    \ API 端点，例如创建新钱包、发送和接收币、获取钱包余额以及检索交易详情。\n\nAPI 可以使用任何支持 HTTP 请求和响应的编程语言或框架构建，例如\
    \ `Node.js` 或 `Django`。API 端点可以通过 Web 服务器或云平台（如 `AWS` 或 `Google Cloud`）暴露。\n\n\
    一些流行的区块链 API 包括 `Ethereum` 的 `JSON-RPC API` 和 `Bitcoin` 的 `RESTful API`。然而，对于一种新币，您需要根据币的特性和功能定义并实现自己的\
    \ API 端点。\n\n"
