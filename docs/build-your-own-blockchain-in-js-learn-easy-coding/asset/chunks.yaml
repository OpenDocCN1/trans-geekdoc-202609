  fmt: "\n# Print publickey and privatekey after generating\n\nAfter generating a\
    \ new wallet with the `Wallet` class, you can access the public and private keys\
    \ as properties of the wallet object. Here's an example of how to print the public\
    \ and private keys after generating a new wallet:\n\n```\nconst myWallet = new\
    \ Wallet();\nconsole.log('Public key: ' + myWallet.publicKey);\nconsole.log('Private\
    \ key: ' + myWallet.privateKey);\n```\n\nThis code creates a new wallet object\
    \ using the `Wallet` class and assigns it to the `myWallet` variable. Then, it\
    \ logs the public and private keys to the console using `console.log()`. You can\
    \ replace `myWallet` with the name of your own variable, and use the `publicKey`\
    \ and `privateKey` properties to access the corresponding keys for your wallet.\n\
    \n# How to send and receive coins from the wallet\n\nTo send and receive coins\
    \ from the wallet, you need to create and sign transactions with your private\
    \ key, and then broadcast the transactions to the network for validation and inclusion\
    \ in the blockchain.\n\nHere's an example of how to create a transaction object\
    \ and sign it with the wallet's private key using the elliptic library in JavaScript:\n\
    \n```\nconst EC = require('elliptic').ec;\nconst ec = new EC('secp256k1');\n\n\
    class Transaction {\n  constructor(sender, recipient, amount) {\n    this.sender\
    \ = sender;\n    this.recipient = recipient;\n    this.amount = amount;\n    this.timestamp\
    \ = Date.now();\n  }\n\n  calculateHash() {\n    return crypto.createHash('sha256').update(this.sender\
    \ + this.recipient + this.amount + this.timestamp).digest('hex');\n  }\n\n  signTransaction(privateKey)\
    \ {\n    const key = ec.keyFromPrivate(privateKey);\n    const signature = key.sign(this.calculateHash(),\
    \ 'base64');\n    this.signature = signature.toDER('hex');\n  }\n\n  isValid()\
    \ {\n    if (!this.signature || this.signature.length === 0) {\n      return false;\n\
    \    }\n    const key = ec.keyFromPublic(this.sender, 'hex');\n    return key.verify(this.calculateHash(),\
    \ this.signature);\n  }\n}\n```\n\nHere, the `Transaction` class constructor takes\
    \ three arguments: the sender, recipient, and amount of the transaction. The timestamp\
    \ is automatically set to the current time using `Date.now()`. The `calculateHash`\
    \ method calculates the SHA-256 hash of the transaction data, and the `signTransaction`\
    \ method signs the transaction with the given `privateKey` using the `keyFromPrivate`\
    \ method of the `EC` class and stores the resulting signature as a property of\
    \ the transaction object. The `isValid` method checks whether the transaction\
    \ is valid by verifying the signature with the `keyFromPublic` method and returning\
    \ a Boolean value.\n\nTo send coins from the wallet, you can create a new transaction\
    \ object with the sender, recipient, and amount fields, and then sign it with\
    \ your private key using the `signTransaction` method of the transaction object.\
    \ Here's an example:\n\n```\nconst myWallet = new Wallet();\nconst recipientAddress\
    \ = 'recipient public key';\nconst amountToSend = 10;\nconst transaction = new\
    \ Transaction(myWallet.publicKey, recipientAddress, amountToSend);\ntransaction.signTransaction(myWallet.privateKey);\n\
    ```\n\nIn this code, a new wallet object is created using the `Wallet` class and\
    \ assigned to the `myWallet` variable. Then, a recipient address and an amount\
    \ to send are specified. Next, a new transaction object is created using the `Transaction`\
    \ class with the sender set to `myWallet.publicKey`, the recipient set to `recipientAddress`,\
    \ and the amount set to `amountToSend`. Finally, the `signTransaction` method\
    \ is called with `myWallet.privateKey` as the argument to sign the transaction.\n\
    \nTo receive coins to the wallet, you simply need to share your public key (i.e.,\
    \ the wallet address) with other users, and they can send coins to that address.\
    \ You can then check the balance of the address by iterating over the blockchain\
    \ and summing the amounts of all transactions that have the address as the recipient.\n\
    \n# Full code with all above addition\n\nHere's an example of a full JavaScript\
    \ program that includes the blockchain implementation with added features such\
    \ as a custom coin name, total supply, mining reward, mining interval, halving\
    \ period, and wallet functionality with public and private key generation and\
    \ transactions:\n\n```\nconst SHA256 = require('crypto-js/sha256');\nconst EC\
    \ = require('elliptic').ec;\nconst ec = new EC('secp256k1');\n\nclass Transaction\
    \ {\n  constructor(sender, recipient, amount) {\n    this.sender = sender;\n \
    \   this.recipient = recipient;\n    this.amount = amount;\n  }\n\n  calculateHash()\
    \ {\n    return SHA256(this.sender + this.recipient + this.amount).toString();\n\
    \  }\n\n  signTransaction(signingKey) {\n    if (signingKey.getPublic('hex') !==\
    \ this.sender) {\n      throw new Error('You cannot sign transactions for other\
    \ wallets!');\n    }\n    const hashTx = this.calculateHash();\n    const sig\
    \ = signingKey.sign(hashTx, 'base64');\n    this.signature = sig.toDER('hex');\n\
    \  }\n\n  isValid() {\n    if (this.sender === null) return true;\n    if (!this.signature\
    \ || this.signature.length === 0) {\n      throw new Error('No signature in this\
    \ transaction');\n    }\n    const publicKey = ec.keyFromPublic(this.sender, 'hex');\n\
    \    return publicKey.verify(this.calculateHash(), this.signature);\n  }\n}\n\n\
    class Block {\n  constructor(timestamp, transactions, previousHash = '') {\n \
    \   this.timestamp = timestamp;\n    this.transactions = transactions;\n    this.previousHash\
    \ = previousHash;\n    this.hash = this.calculateHash();\n    this.nonce = 0;\n\
    \  }\n\n  calculateHash() {\n    return SHA256(\n      this.previousHash +\n \
    \     this.timestamp +\n      JSON.stringify(this.transactions) +\n      this.nonce\n\
    \    ).toString();\n  }\n\n  mineBlock(difficulty) {\n    while (\n      this.hash.substring(0,\
    \ difficulty) !== Array(difficulty + 1).join('0')\n    ) {\n      this.nonce++;\n\
    \      this.hash = this.calculateHash();\n    }\n    console.log('Block mined:\
    \ ' + this.hash);\n  }\n\n  hasValidTransactions() {\n    for (const tx of this.transactions)\
    \ {\n      if (!tx.isValid()) {\n        return false;\n      }\n    }\n    return\
    \ true;\n  }\n}\n\nclass Blockchain {\n  constructor(coinName, totalSupply, miningReward,\
    \ miningInterval, halvingPeriod, halvingPercentage) {\n    this.chain = [this.createGenesisBlock()];\n\
    \    this.difficulty = 2;\n    this.pendingTransactions = [];\n    this.miningReward\
    \ = miningReward;\n    this.coinName = coinName;\n    this.totalSupply = totalSupply;\n\
    \    this.miningInterval = miningInterval;\n    this.halvingPeriod = halvingPeriod;\n\
    \    this.halvingPercentage = halvingPercentage;\n  }\n\n  createGenesisBlock()\
    \ {\n    return new Block('01/01/2021', 'Genesis block', '0');\n  }\n\n  getLatestBlock()\
    \ {\n    return this.chain[this.chain.length - 1];\n  }\n\n  minePendingTransactions(miningRewardAddress)\
    \ {\n    const rewardTx = new Transaction(\n      null,\n      miningRewardAddress,\n\
    \      this.miningReward\n    );\n    this.pendingTransactions.push(rewardTx);\n\
    \    let block = new Block(\n      Date.now(),\n      this.pendingTransactions,\n\
    \      this.getLatestBlock().hash\n    );\n    block.mineBlock(this.difficulty);\n\
    \    console.log('Block successfully mined!');\n    this.chain.push(block);\n\
    \    this.pendingTransactions = [];\n  }\n\n  addTransaction(transaction) {\n\
    \    if (!transaction.sender || !transaction.recipient) {\n      throw new Error('Transaction\
    \ must include sender and recipient addresses');\n    }\n    Find this code in\
    \ GitHub and Fork the repository.\n  }\n}\n```\n"
  trans: "\n\n# 生成后打印公钥和私钥\n\n使用 `Wallet` 类生成新钱包后，您可以作为钱包对象的属性访问公钥和私钥。以下是生成新钱包后打印公钥和私钥的示例：\n\
    \n```\nconst myWallet = new Wallet();\nconsole.log('Public key: ' + myWallet.publicKey);\n\
    console.log('Private key: ' + myWallet.privateKey);\n```\n\n此代码使用 `Wallet` 类创建一个新的钱包对象并将其赋值给\
    \ `myWallet` 变量。然后，它使用 `console.log()` 将公钥和私钥记录到控制台。您可以将 `myWallet` 替换为您自己的变量名，并使用\
    \ `publicKey` 和 `privateKey` 属性来访问您钱包对应的密钥。\n\n# 如何从钱包发送和接收币\n\n要从钱包发送和接收币，您需要使用私钥创建并签名交易，然后将交易广播到网络以进行验证并打包入区块链。\n\
    \n以下是如何创建交易对象并使用 JavaScript 中的 elliptic 库通过钱包私钥对其进行签名的示例：\n\n```\nconst EC = require('elliptic').ec;\n\
    const ec = new EC('secp256k1');\n\nclass Transaction {\n  constructor(sender,\
    \ recipient, amount) {\n    this.sender = sender;\n    this.recipient = recipient;\n\
    \    this.amount = amount;\n    this.timestamp = Date.now();\n  }\n\n  calculateHash()\
    \ {\n    return crypto.createHash('sha256').update(this.sender + this.recipient\
    \ + this.amount + this.timestamp).digest('hex');\n  }\n\n  signTransaction(privateKey)\
    \ {\n    const key = ec.keyFromPrivate(privateKey);\n    const signature = key.sign(this.calculateHash(),\
    \ 'base64');\n    this.signature = signature.toDER('hex');\n  }\n\n  isValid()\
    \ {\n    if (!this.signature || this.signature.length === 0) {\n      return false;\n\
    \    }\n    const key = ec.keyFromPublic(this.sender, 'hex');\n    return key.verify(this.calculateHash(),\
    \ this.signature);\n  }\n}\n```\n\n在这里，`Transaction` 类构造函数接受三个参数：交易的发送方、接收方和金额。时间戳使用\
    \ `Date.now()` 自动设置为当前时间。`calculateHash` 方法计算交易数据的 SHA-256 哈希值，`signTransaction`\
    \ 方法使用 `EC` 类的 `keyFromPrivate` 方法通过给定的 `privateKey` 对交易进行签名，并将生成的签名作为交易对象的属性存储。`isValid`\
    \ 方法通过使用 `keyFromPublic` 方法验证签名并返回布尔值来检查交易是否有效。\n\n要从钱包发送币，您可以使用发送方、接收方和金额字段创建一个新的交易对象，然后使用交易对象的\
    \ `signTransaction` 方法通过您的私钥对其进行签名。示例如下：\n\n```\nconst myWallet = new Wallet();\n\
    const recipientAddress = 'recipient public key';\nconst amountToSend = 10;\nconst\
    \ transaction = new Transaction(myWallet.publicKey, recipientAddress, amountToSend);\n\
    transaction.signTransaction(myWallet.privateKey);\n```\n\n在该代码中，使用 `Wallet` 类创建一个新的钱包对象并将其赋值给\
    \ `myWallet` 变量。然后，指定接收地址和发送金额。接下来，使用 `Transaction` 类创建一个新的交易对象，发送方设为 `myWallet.publicKey`，接收方设为\
    \ `recipientAddress`，金额设为 `amountToSend`。最后，调用 `signTransaction` 方法并传入 `myWallet.privateKey`\
    \ 作为参数来对交易进行签名。\n\n要接收币到钱包，您只需将您的公钥（即钱包地址）分享给其他用户，他们即可向该地址发送币。您可以通过遍历区块链并累加所有以该地址为接收方的交易金额来查询该地址的余额。\n\
    \n# 包含上述所有添加功能的完整代码\n\n以下是一个完整的 JavaScript 程序示例，包含区块链实现及新增功能，如自定义币种名称、总供应量、挖矿奖励、挖矿间隔、减半周期，以及带有公私钥生成和交易功能的钱包功能：\n\
    \n```\nconst SHA256 = require('crypto-js/sha256');\nconst EC = require('elliptic').ec;\n\
    const ec = new EC('secp256k1');\n\nclass Transaction {\n  constructor(sender,\
    \ recipient, amount) {\n    this.sender = sender;\n    this.recipient = recipient;\n\
    \    this.amount = amount;\n  }\n\n  calculateHash() {\n    return SHA256(this.sender\
    \ + this.recipient + this.amount).toString();\n  }\n\n  signTransaction(signingKey)\
    \ {\n    if (signingKey.getPublic('hex') !== this.sender) {\n      throw new Error('You\
    \ cannot sign transactions for other wallets!');\n    }\n    const hashTx = this.calculateHash();\n\
    \    const sig = signingKey.sign(hashTx, 'base64');\n    this.signature = sig.toDER('hex');\n\
    \  }\n\n  isValid() {\n    if (this.sender === null) return true;\n    if (!this.signature\
    \ || this.signature.length === 0) {\n      throw new Error('No signature in this\
    \ transaction');\n    }\n    const publicKey = ec.keyFromPublic(this.sender, 'hex');\n\
    \    return publicKey.verify(this.calculateHash(), this.signature);\n  }\n}\n\n\
    class Block {\n  constructor(timestamp, transactions, previousHash = '') {\n \
    \   this.timestamp = timestamp;\n    this.transactions = transactions;\n    this.previousHash\
    \ = previousHash;\n    this.hash = this.calculateHash();\n    this.nonce = 0;\n\
    \  }\n\n  calculateHash() {\n    return SHA256(\n      this.previousHash +\n \
    \     this.timestamp +\n      JSON.stringify(this.transactions) +\n      this.nonce\n\
    \    ).toString();\n  }\n\n  mineBlock(difficulty) {\n    while (\n      this.hash.substring(0,\
    \ difficulty) !== Array(difficulty + 1).join('0')\n    ) {\n      this.nonce++;\n\
    \      this.hash = this.calculateHash();\n    }\n    console.log('Block mined:\
    \ ' + this.hash);\n  }\n\n  hasValidTransactions() {\n    for (const tx of this.transactions)\
    \ {\n      if (!tx.isValid()) {\n        return false;\n      }\n    }\n    return\
    \ true;\n  }\n}\n\nclass Blockchain {\n  constructor(coinName, totalSupply, miningReward,\
    \ miningInterval, halvingPeriod, halvingPercentage) {\n    this.chain = [this.createGenesisBlock()];\n\
    \    this.difficulty = 2;\n    this.pendingTransactions = [];\n    this.miningReward\
    \ = miningReward;\n    this.coinName = coinName;\n    this.totalSupply = totalSupply;\n\
    \    this.miningInterval = miningInterval;\n    this.halvingPeriod = halvingPeriod;\n\
    \    this.halvingPercentage = halvingPercentage;\n  }\n\n  createGenesisBlock()\
    \ {\n    return new Block('01/01/2021', 'Genesis block', '0');\n  }\n\n  getLatestBlock()\
    \ {\n    return this.chain[this.chain.length - 1];\n  }\n\n  minePendingTransactions(miningRewardAddress)\
    \ {\n    const rewardTx = new Transaction(\n      null,\n      miningRewardAddress,\n\
    \      this.miningReward\n    );\n    this.pendingTransactions.push(rewardTx);\n\
    \    let block = new Block(\n      Date.now(),\n      this.pendingTransactions,\n\
    \      this.getLatestBlock().hash\n    );\n    block.mineBlock(this.difficulty);\n\
    \    console.log('Block successfully mined!');\n    this.chain.push(block);\n\
    \    this.pendingTransactions = [];\n  }\n\n  addTransaction(transaction) {\n\
    \    if (!transaction.sender || !transaction.recipient) {\n      throw new Error('Transaction\
    \ must include sender and recipient addresses');\n    }\n    Find this code in\
    \ GitHub and Fork the repository.\n  }\n}\n```\n\n"
