- raw: "Despite the theoretical value of both these components, a market that runs\
    \ all by itself still seems impossible to many. Many people look at what has been\
    \ happening the last few years in the country and jump to the premise that capitalism\
    \ doesn’t work. This is a fallacy, right from the beginning to the end. The reality\
    \ is that the customer is the king and that is the only reason businesses, no\
    \ matter how big and powerful, do everything to get customers to use their products.\
    \ Without this there would really be no business, no generation of money, and\
    \ no economics for us to analyze. In essence, the consumer holds the key to the\
    \ direction that the economy takes. Take the example of an initiative by a company\
    \ called \\[Re\\]Waste in the city of Edmonton, Canada. The founder, Corey Saban,\
    \ after pitching a plastic recycling project to the city of Beaumont, has now\
    \ landed major contracts with two companies in the cannabis industry. This shift\
    \ is shaped not just by the ideas of the top management but, to a large extent,\
    \ by the consumers in this industry. According to a survey of more than 15,000\
    \ consumers, 86% of the consumers under 45 years of age said that they would pay\
    \ more for sustainable packaging. When consumers’ demand patterns change, the\
    \ businesses have no option but to oblige by changing their products. That’s the\
    \ beauty of a free market.\n\nI know what you are thinking, “But, this is just\
    \ a small company, isn’t it?! What about the all-powerful, big corporations?”\
    \ The truth is these big corporations, too, are not all-powerful as we may assume\
    \ them to be. Take the pizza experiment of McDonald’s in the 1990s. Even though\
    \ McDonald’s has been a huge brand for a long time, the fact that consumers didn’t\
    \ want to wait around for their food at a fast-food chain resulted in massive\
    \ losses for the franchise company to the point that they eventually shut down\
    \ the pizza ovens. Even in recent times, whenever the company gets too comfortable\
    \ with its success, the consumers have aptly given the well-timed reality checks.\
    \ Imagine a fast-food company giving the consumers healthy choices to keep up\
    \ with the demands of the healthy millennial lifestyle—that is what consumer demand\
    \ has done till now and will continue to do in future, as well!\n\nDon’t get me\
    \ wrong, I am under no illusion that capitalism in its current form is doing anyone\
    \ any good. It’s obviously as dysfunctional as its socialist opponents. And, this\
    \ is why we need to understand the difference between free market capitalism and\
    \ crony capitalism. Free market capitalism, in itself, means giving power to the\
    \ buyers and sellers; whereas crony capitalism gives it to a select section of\
    \ cronies or big business houses that may be in the good graces of the government.\
    \ We have seen this lobbyist crony capitalism take an ugly turn across the globe,\
    \ right from China to Russia and even the United States, in the last few years.\
    \ \n\nIn many of these parts, this crony capitalism, mixed with communism, is\
    \ wreaking havoc on the common man in the most subtle and gradual manner. An ideology\
    \ that started with outlining the evils of capitalism eventually walked the same\
    \ path, but in a very different manner. Take the example of the Naxalite movement\
    \ in India—the constant war between crony capitalists and the communist militant\
    \ group has only resulted in the bloodshed of the innocent, powerless villagers.\
    \ And, this is just one example of how ugly it has gotten on both sides of the\
    \ spectrum. \n\nMost people don’t realize, at all, that this is nothing like free-market\
    \ capitalism. The absence of government interference, explicit as well as implicit,\
    \ makes all the difference here. For a long time, people have been swung to and\
    \ fro between these extreme ideologies, with no other option but to be played\
    \ like pawns. For the first time in history, we have a third option. Blockchains\
    \ can help us facilitate a truly free-market economy as it was always meant to\
    \ be. But, the common masses have to move fast because, if we don’t, then we risk\
    \ blockchains being overtaken by the very ideologies that we are trying to escape.\
    \ \n\n## A Game of (Market) Monopoly\n\nGreed is an inseparable part of the human\
    \ condition. Socrates said, “He who is not contented with what he has, would not\
    \ be contented with what he would like to have” (Socrates Quotes, n.d.). Despite\
    \ this wisdom haven’t we all been found to always want just a little more—that\
    \ one more bite of cake, one more minute of blissful sleep, one more promotion,\
    \ etc.? We have all been greedy in our own way. Let’s face it—evil is not an uncommon\
    \ thing among humankind. We all have a dark side and we all slip up. But, what\
    \ happens when this little individual greed turns into an organizational one,\
    \ impacting millions of lives?\n\nMarket monopolies are arguably the evilest manifestation\
    \ of centralization that takes power away from people. Monopolies allow for organizational\
    \ giants to influence the product prices to such an extent that they can restrict\
    \ the entry of new players into the market. Markets work because they are a place\
    \ of fair exchange, but monopolistic markets take that away by replacing competition\
    \ with complacency. That does nothing but make the ridiculously rich even richer,\
    \ while leaving the poor completely out of the equation.\n\nTake the example of\
    \ the Eskom debacle in South Africa. The power company has been a monopoly in\
    \ the power sector for almost a century, but the cracks in this shining facade\
    \ can no more be hidden. For a long time, the institution was quoted as a shining\
    \ example of how a marriage between governments and corporations was in the best\
    \ interests of the economy. Many believe that the end began its down-the-hill\
    \ journey when it changed from Escom to Eskom. Of course this, as described by\
    \ Frederic Bastiat in his age-old works, would be the perfect example of the logical\
    \ fallacy of judging a situation by its short term results rather than the long-term\
    \ consequences. \n\nIn a nutshell, the monopolistic structure of this organization\
    \ was doomed to fail right from the beginning. When you apply the principles of\
    \ the Austrian school of economics, (which we will discuss in detail a little\
    \ further in this chapter), you will understand exactly what I mean. Austrian\
    \ economics is clear on the importance of price in the economy. Being a state-controlled\
    \ monopoly with no competition, Eskom was destined to fail right from the get-go\
    \ because it could never adjust prices according to the demand-supply patterns.\
    \ \n\nMany believe that giving greater power to policing mechanisms like the judiciary\
    \ and the governments can solve the issue of monopolistic markets that run at\
    \ the expense of people. That, as has been evidenced multiple times and even in\
    \ the Eskom case study, is not true. To understand what works in eradicating monopolies\
    \ from the market, we’d have to understand what leads to the formation of these\
    \ monopolies.\n\n## Patents Vs. Open-Source Technology\n\nBill Gates has an interesting\
    \ take on patents. He says, “If people had understood how patents would be granted\
    \ when most of today’s ideas were invented, and had taken out patents, the industry\
    \ would be at a complete standstill today” (Lee, 2007). If the bitcoin creators\
    \ were to patent the cryptocurrency and blockchain technology, they would be swimming\
    \ in a pool of money and we wouldn’t even be here talking about this. Conflicting\
    \ views on patents have been around almost as long as patents have. Different\
    \ people may take up different positions on this but what no one can deny is patents\
    \ take up tremendous amounts of resources (that may, let’s face it, well be used\
    \ for something much better, though the pro-patent individuals don’t agree). It’s\
    \ useful to understand patents, especially because they may lead us to unravel\
    \ the mystery of monopolies. "
