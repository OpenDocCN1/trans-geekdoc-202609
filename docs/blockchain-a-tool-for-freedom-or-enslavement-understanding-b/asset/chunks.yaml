    Apart from these, there is also one extremely important function of `blockchains`
    in clinical trials: that of smart contracts. The “if, then” logic of these contracts
    allow for. The `COVID-19` has seen a wide range of `blockchain` applications in
    the supply of vaccines, uploading the vaccine certificates on the network for
    the recently announced vaccine passport, and so on. When it comes to medical data
