    # 引言


    许多人认为加密货币是奥斯利利经济学与未来新兴技术之间唯一的桥梁。但，这种观点对于正在发展的局面来说过于局限。虽然加密货币确实提供了与奥斯利利学派最直接的联系，但区块链作为一项宏观技术，也并未偏离该经济学派的原则。


    在 20 世纪 80 年代后期，随着信息技术（IT）作为一种长期力量出现，许多人开始考虑它对市场结构的影响。电子市场假设被提出，认为 IT 行业将通过三种方式影响市场：使通信更加便利和高效；帮助买卖双方直接接触而无需中间人；最后是以一种有助于买卖双方的方式整合有价值的信息。预测其结果将是产生更活跃的市场活动。


    人们希望像 `Mises`（米塞斯）和 `Hayek`（哈耶克）等奥斯利利经济学家此前提出的观点最终能融入这一即将蓬勃的新市场时代。这些经济学家曾认为，任何经济体面临的主要问题不是资源稀缺，而是相关信息的不可用。现在
    IT 作为一种救星出现出现，这些信息可以变得可用，从而导致等级制度的减少和生产活动得到更好的协调。然而，我们都知道这从未发生过。随着 IT 的出现，`Amazon`、`Google`
    等大玩家接管了这些信息，他们并没有消除层级结构，而是利用它创造了更加集中的等级制度。因此，尽管总产量增加了，但小企业主发现生存变得比以往任何时候都困难，而大型科技公司的财富正每秒级地增长。


    # 区块链技术的机遇


    今天，`Hayek`、`Mises` 以及其他奥斯利利经济学追随者在区块链技术方面看到了另一个机会。如果你注意到，区块链技术代表了奥斯利利经济学所代表的一切，甚至超越了加密货币。然而，两者之间最重合的领域将是他们对去中心化的热爱。正如之前讨论过的，区块链允许政府机构进行最少程度的干预（如果有的话），因此不能被用作压制和剥迫的工具。


    但需要注意的是，这种自由意志主义原则只有在像你和我我这样的普通人参与到这项技术中才能得到维护。`Google`、`Samsung`（三星）等大公司已经在采取区块链技术，如果我们不有效参与，即使这个自由的工具可能很快也会从我们手中夺走。


    自从`Satoshi’s Bitcoin`（中本比特币）出现，区块链的许多方面都被置于放大镜下，包括它们的安全性、可行性和采用性等。但我们需要理解，区块链远不止这些技术细节。它是经济和政治价值的化身，这些价值几十年来一直被诋毁甚至受到压制，因为大众被引导认为这是一个完全的骗局。然而，事实仍然是，让对这项新兴技术以及意识形态处于无知状态，只会帮助掌权者吸引越来越多的权威性。


    # 政治和经济后果


    尽管这一论点具有说服力，但人们对这项技术的政治和经济后果几乎没有理解。我们可以随心所欲地谈论区块链的颠覆性，但在我们纳入政治和经济意识形态之前，这种讨论在很大程度上是徒劳的；无论喜欢与否，最终是这些意识形态决定了特定技术（无论其具有多么革命性）在特定文化中能否长期生存。


    不要误会我；我不是说我们到今为止讨论的政治和经济学派对区块链技术的生存有单向影响。它们没有。最终，任何新兴技术都处于技术、经济和政治反馈的或多持续循环中。在相应的文化背景下，不理解其中一个就不可能理解其他的。因此，正如我们的经济和政治哲学可以决定一项技术是否保持其原始预期一样，技术本身也有力量推翻不符合系统运行的意识形态。前者将权力交给了政府等机构，而后者完全由大众对技术的参与来决定。


    这对区块链技术来说确实如此——当大多数人都在浪费时间为支持或反对区块链时，后台的轮子已经在运转。你可以热爱它，也可以讨厌它，但现实是你无法逃避它的。区块链已经以不止一种方式进入你的生活。明智的做法是积极参与其中，不仅通过收集技术方面的知识，还通过理解并个人参与到这项技术的技术、经济和政治背景中。如果你不这样做，你可能很快发现你的生活被你几乎一无所知的科技劫持了。


    互联网不也是这样？我们中没有多少人真正知道或理解互联网是什么以及它是如何运作的，但你（作为用户）被陷在它表面的娱乐影响中（例如社交媒体）。但在所有这些看起来无害的帖子和有趣的滤镜之下，科技行业的巨头们正通过促使你每次登录时允许他们访问你的数据，然后将其出售给广告商以获取利润，正将互联网用于更阴险的用途。更不用说他们拥有的控制言论的不可逾越的力量了，显然互联网并不像它应该那样具有主权。


    我们需要在太晚以及大型科技公司接管新兴区块链技术之前清醒过来并面对现实。正如 `Mike Maloney`（迈克·马洛尼）在他 YouTube 博客 `Hidden
    Secrets of Money` 第八集中贴切地指出的，区块链（`Maloney` 特别提到了加密货币）可以“解放我们，也可以奴役我们”（`Goldsilver
    with Mike Maloney`, 2018）。


    '
