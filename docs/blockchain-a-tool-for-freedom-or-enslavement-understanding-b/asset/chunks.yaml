- raw: "In the child and candy analogy, if you notice, the outcome depends on the\
    \ integrity of that one child. Similarly, our traditional systems usually expect\
    \ integrity to be placed within a person rather than the process itself. We expect\
    \ our politicians to stay true to their word, and our bankers to be honest with\
    \ the money transactions without necessarily having the right accountability system\
    \ in place. Please note that I am in no way attempting to shift the blame away\
    \ from corrupt individuals. But, the system we live in is almost like being in\
    \ a fast-running car with no airbags, carrying on in the hope that we’ll never\
    \ get into an accident. The problem is that we are always living in uncertainty\
    \ of the outcome. And by the time that the coin flips the other way, it’s too\
    \ late to do anything about it\n\nAnswer this question with brutal honesty: If\
    \ I were to tell you that you’d never be caught, would you still do the right\
    \ thing? The way we, as a society, have chosen to regulate this is by imposing\
    \ external rules when, in fact, the much more effective means would be to introduce\
    \ the idea of networked integrity. This means that the transparency and integrity\
    \ of one’s behavior is not determined by the ambiguous territory of moral values,\
    \ but is incentivized by the very structure of the system. \n\nThink how it would\
    \ be to live in a close-knit tribe, for instance. Let’s say, you live with this\
    \ tribe on an island with limited food resources. One day you find the perfect\
    \ kill in the form of a huge delicious fish. The whole tribe assesses this kill\
    \ and puts you in charge of making sure it remains safe until they return from\
    \ the hunt. In this case, you will have two options: one is that you keep the\
    \ fish safe until the tribe returns and then divide it equally among the members,\
    \ and the other is that you gobble up some of it and make up a story for what\
    \ happened. It is very likely that, no matter how much you are starving, you’ll\
    \ still choose the first option. \n\nThe reason for this is simple—the tribe is\
    \ built in such a way that their trust means a lot more to you than the immediate\
    \ gratification of your hunger. If you were to lose that trust, there is a high\
    \ chance that you could be outcast and left to fend for yourself. Thus, cheating\
    \ would be prevented at two levels. Firstly, since the whole tribe has seen the\
    \ catch, it’d require quite a bit of effort to come up with a story. Secondly,\
    \ even if you did come up with one, the tribe members would never be able to see\
    \ you in the same manner that they did before. All in all, sticking to the tribal\
    \ code would be a much easier option. \n\nThat is precisely what a blockchain\
    \ does to the virtual data through its principle of networked integrity. Cheating,\
    \ hacking, and manipulation are either made impossible or make the individual\
    \ pay a heavy price, thereby minimizing the motivation to indulge in any of these\
    \ practices. \n\nThis principle of networked integrity finds its most useful implication\
    \ for the problem of double-spend. Have you ever wondered why it’s possible for\
    \ you to click pictures of food on your phone and send it to multiple friends,\
    \ but you can’t do the same thing with your digital money? It’s obviously because\
    \ money and pictures aren’t the same thing. While you can exchange whatever you\
    \ wish for money, I hardly think you can do the same with your food pictures.\
    \ Well, it seems like a silly question to even ask, I know. But this seems to\
    \ be at the root of a huge problem with online transactions. \n\nAs is obvious,\
    \ digital currency cannot be in two places at the same time. Thus, the money would\
    \ have to leave your account and go into the account of the one you have paid\
    \ it to. In the case of double-spending, the digital token file that represents\
    \ your digital currency may be falsified—the result being that the same token\
    \ can be used twice. This works out perfectly well for the notorious elements\
    \ trying to defraud the system, but can incur great losses for the party receiving\
    \ these tokens. This is usually why we have third-party members like banks monitoring\
    \ the digital transactions. But, as much as we may hate it, these third-party\
    \ members can be equally fraudulent in nature. \n\nBlockchains, with their networked\
    \ integrity, make this duplication impossible while also making the third-party\
    \ monitoring redundant. For instance, in the case of cryptocurrencies, this is\
    \ done through a consensus mechanism where everyone on the blockchain reaches\
    \ the necessary agreement regarding a particular transaction with the exact cryptocurrency\
    \ token. This transaction has a time stamp which cannot be duplicated. This solves\
    \ the double-spend problem in a big way.\n\nIf you are wondering what ensures\
    \ that this group of peers stay honest in their activities on the blockchain,\
    \ then remember that all of these peers have an equal stake in the smooth functioning\
    \ of the system. I am sure you have been on one of those group projects where\
    \ there is one member that invariably slacks off and yet scores the same based\
    \ on the group performance? What if these school projects evaluated the performance\
    \ not of the group, but of the individuals themselves and how they contributed\
    \ to the success or failure of the group output? The free-loaders would, of course,\
    \ aim for a more valuable contribution; and, if they didn’t, they would have to\
    \ face the consequences. This would incentivize those already working hard to\
    \ improve further, knowing that their hard work pays off into meaningful grades\
    \ and those not working at all to pull up their socks. \n\nThe blockchain more\
    \ or less employs the same logic with the peers involved. The fact that every\
    \ individual’s contribution is important in the functioning of the blockchain,\
    \ and that the peers receive their dues only if this smooth functioning continues,\
    \ keeps everyone involved on their toes. This is significant, especially, in those\
    \ parts of the world where major institutions have been consumed by corruption\
    \ and cannot be trusted to verify the transactions. As blockchains rely on not\
    \ one, but many sources of validation, this problem can be avoided to a great\
    \ extent. However, it is important to note that the networked integrity cannot\
    \ be allowed to run on autopilot. If that happens, then it’d be quite easy for\
    \ the nefarious sections to take over a majority in the network, thereby tremendously\
    \ compromising the very integrity that sets blockchains apart. This is why I keep\
    \ telling people that looking at blockchains merely as a technology will not help.\
    \ I call it a revolution because you and I are a part of it—rather, we have to\
    \ be a part of it. Without our involvement, it might as well be just another tool\
    \ of oppressing the masses. \n\n### Security\n\nThe security that blockchain technology\
    \ provides is, of course, the holy grail that liberty-lovers like us have been\
    \ looking for, all along. No more do we have to compromise our freedom to have\
    \ a sense of security, or vice versa. The interesting thing is that, while the\
    \ traditional systems increase security by increasing watchfulness through external\
    \ sources, blockchains do it by simply allowing the users to have absolute control\
    \ over their own data. Since blockchains promote the idea of trustless trust—one\
    \ wouldn’t have to, for instance, know every person involved in the network to\
    \ be sure that their data is secure; it is the mechanism that ensures security\
    \ rather than the identities of those involved.\n\nCryptography has a crucial\
    \ role to play in this scheme of things. It would suffice to note that cryptographic\
    \ code enables us to keep the data secure by ensuring that only the intended recipient\
    \ of the data can read it. In case of cryptocurrency, for instance, the purchase\
    \ and sale of the digital tokens happens with these cryptographic keys which the\
    \ individual uses to access the relevant information, complete the transaction\
    \ and get out. Cryptography is what helps blockchains keep hackers at bay, at\
    \ least most of the time."
