    Another instance is `SHIFT` pool that works for a similar cause. `Stop Monkey
    Shocks` is one more mission driven pool that aims to stop the electrocution of
    monkeys due to the electrical wires for the pathways. The causes may be different,
    but the kind intent supported by technology is changing the ground reality one
    project at a time. If that’s not giving back, I don’t know what is.


    But, also remember that Cardano is not the only public blockchain that does this.
    Other examples that come to mind are `Algorand` and `Harmony` blockchains. I am
    quite certain more and more of these need to be encouraged and supported by the
    masses and are certainly coming up, even as we speak.


    ## Private Blockchains


    A private blockchain, as the name suggests, allows only certain authorized individuals
    the access to the blockchain. This may be more suited for private businesses.
    The access can be gained only through a valid invitation, and the members who
    are allowed access need to be approved by the blockchain operators. This approval
    is ideally done by strict adherence to some preset criteria about the background
    of the individual. Even the members that are in the blockchain may have different
    rights and privileges. So, one person may have full access without any restrictions,
    whereas another may not. An additional way that private blockchains differ prominently
    from public blockchains is that, while the latter allows the transactions to be
    completely anonymous, the former does not.


    A big advantage that private blockchains carry over public ones is the transaction
    speed. Since the number of participants on a private blockchain are quite limited,
    the consensus is reached much quicker. However, as you may have guessed, private
    blockchains are not decentralized in the true sense, but only make use of a distributed
    ledger to keep multiple copies of the data in several nodes. `Hyperledger` and
    `Ripple` (`XRP`) are the most common examples of private blockchains.


    When you look at these from an implementation point of view, it is clear that
    private blockchains cannot be used for wide community-based programs, but are
    only applicable to business organizations looking for a better way to organize
    their data. But, even there, the user would have to be vigilant because, while
    the small numbers give a much better transaction speed, they also make these blockchains
    quite susceptible to attacks from external malicious elements. Trust in transactions
    may also be another issue whereby the credibility of the nodes and their validation
    of the transactions may be open to ambiguity.


    ## Consortium Blockchains


    Another option that private business users may have is the blockchain that tries
    to bring together, at least partially, the goodness of public blockchains to the
    private permissioned ones. Consortium blockchains are quite similar to private
    blockchains, with one major difference. In this type of blockchain the participants
    belong not only to one organization, as in the case of private blockchains, but
    the participants on the network may come from several organizations. This makes
    hacking into the database that much more difficult. These also offer a tad higher
    level of decentralization due to the presence of multiple players.


    ## Hybrid Blockchains


    These add another layer of sophistication to the permissioned blockchains. Though
    they are private to an extent, the records on these blockchains can be made available
    to third parties, whenever necessary, through smart contracts. An example of hybrid
    blockchains would be `Dragonchain`, released by Disney. Yes, you read that right.
    Disney released this open-source platform way back in October 2016 (Knowles, 2017).
    This should tell you how prevalent blockchains are—rather, they have been for
    a while now. Although, now is the turning point, where this technology is not
    only being used to manage businesses but to transform communities.


    Another really cool feature here is that, even though these blockchains may be
    owned by private entities, they cannot make changes to the data, as in the case
    of private and consortium blockchains where network operators have the right to
    override the transaction data. The access granted to members is also equal and
    complete without restrictions on certain selected members. Even the identity of
    the users on this blockchain are kept secure until they participate in a transaction,
    in which case it would have to be divulged. To a great extent, hybrid blockchains
    can be thought of as bringing network integrity, transparency, and security to
    private blockchain structures.


    One thing that’s clear from all of the things we have discussed in this chapter
    is that blockchains are still evolving, and there is a wide scope for both growth
    and improvement of public, as well as private, blockchains. The decentralized
    immutability of data that blockchains offer, especially in the public sector,
    can help the struggling economies stand firmly on their own feet by eliminating
    corruption and faster settlements. You may differ on the choice of blockchain
    based on your area of application, but you cannot deny the life that blockchains
    have breathed into the underprivileged sections of society.


    # Chapter 3: Decentralization or Death


    Give me liberty, or give me death! - Patrick Henry

