  fmt: '

    Why go that far!? We have a smart city coming in Cochrane, a tiny town in the
    middle of nowhere in North Ontario, Canada. As we saw in parts of Africa, the
    pandemic has been a wake-up call for people here, as well, and the Board of Trade
    has taken this opportunity to create a self-reliant town, with the `blockchain`
    and `cryptocurrency` to play a pivotal role. This might seem like a small beginning,
    but it’s expected to rake in pretty investments in the coming times. I find myself
    personally excited by this development because I love the idea that `blockchain`
    is no more a technology of the future, or something that only bug players want
    to be a part of! It’s right now and right here, so close to each and every one
    of our lives. You can be sure that a big part of your lives are going to be touched
    by `blockchains` in the very near future, if it hasn’t done that already, that
    is.


    The beauty of `blockchain` implementation lies not in the brilliant theory of
    the technology, but the practical application of it in the lives of people like
    you and me. Take a simple example of a broken street light. Think back to how
    long it took for someone to come and repair it. Manual monitoring of such details
    is a daunting task. Now, imagine a `blockchain` entering this situation. Street
    lights are installed with sensors in them. The moment something goes wrong in
    the light, a `smart contract` is triggered that generates a job to be completed
    to a technician who immediately comes and repairs the light. Since it is on a
    `blockchain`, the credentials of the person doing the job are verified, and the
    data is stored for any such problems that may occur in the future. This data could
    then be used to audit the company that has installed the lights and the sensors,
    using government funding. This also keeps quality assurance in place and keeps
    tabs on corruption. This is how simple the application of `blockchains` in your
    life can be.


    No matter what technology it is, until and unless you understand how it impacts
    you, it means nothing. A grand technology that doesn’t make life easier and better
    for you is a wasted opportunity. But, at the same time, it would also be a wasted
    opportunity, maybe a bigger one, if you don’t identify the significance this technology
    brings in—if you don’t participate.


    ### Food Safety


    Most people think that unavailability of food is what leads to people suffering
    from malnourishment in third-world countries. Reality, however, is a little more
    complicated. Sure, food scarcity is a real thing; but, while millions of people
    are sleeping hungry at night, tons of food gets dumped in garbage, too. The number
    of people suffering from hunger could be much smaller.


    The reason the produced food doesn’t reach as many people is, in the modern world,
    food goes through complex supply chains. Furthermore, these are closed and opaque
    processes which makes it even harder to pinpoint the problem, let alone work through
    it. As is to be expected, hunger is only one of the injustices that are born out
    of this. With such practices, sustainability has been tossed out of the window
    for decades now. And, we have already seen how it impacts the farmers, making
    their lives increasingly difficult. All in all, these excessively long, complex
    supply chains do no good for anyone. But, what’s strange is, until recently, never
    has much attention been paid to reducing this inefficiency and the resulting waste,
    but most efforts have always been directed to increasing productivity.


    `Blockchains` have been the perfect disruptor here, because of the wide gap of
    unaccountability that existed before. Today, a lot of big players have entered
    the arena and are actively using `blockchains` to protect supply quality food.
    `Walmart` is one such franchise. If you have been buying any greens from here,
    then you are already a beneficiary of `blockchain` technology. This is because
    `Walmart` has made it mandatory for all its suppliers of green, leafy vegetables
    to upload their details, as well as the data about the product, on a `blockchain`—making
    the information highly accessible and free from manipulation. They claim that
    their `smart tracking technology` helps them track contaminations across their
    product to literally a few seconds. This is a major relief to the producers, who
    previously had to risk massive foodborne diseases due to contamination that no
    one was present for. It also saves a lot of time and resources that would otherwise
    be spent on product callbacks. Another major commercial company which is the first
    among many food companies to use a `blockchain`-based supply chain is `Nestle`.
    They aim to make all the product and supply chain-related information readily
    available to the end user, invoking more trust in the brand itself.


    `Supply chain blockchains` would also have a supplementary role to play in the
    case of agricultural `blockchains`. They could give us crucial data about consumer
    behavior, which in turn would be tremendously helpful in determining the demand
    pattern based on the location. Tailoring the supply to this demand more closely
    would be quite effective in reducing the wastage of food; the excess can then
    be directed to other locations which might have unsatisfied demand for it.


    An increased awareness of sustainability and a growing empathy for our underprivileged
    counterparts have thankfully led to quite a `blockchain movement` in the food
    industry. The government would play a major role in promoting `blockchain adoption`
    in the public sector. Through the standards and policies they set, they would
    be able to make the transition to a `blockchain` much smoother.


    ### Voting


    Democracy sounds like a fantastic concept, a great exercise in effecting the will
    of the people, but what happens when people don’t seem to care? Voter apathy is
    a concern that has plagued all democratic elections across the globe. You’d think,
    as the corruption grows, there would be a higher number of people coming out to
    vote. But, it rather seems to be working the other way around; as the trust goes
    down, so does the number of voters who actually think voting has an impact on
    the present functioning of things. An excuse commonly given is that voting is
    a tedious process that takes up a lot of time. Now, imagine there was a way for
    you to vote as easily as by picking up your phone and tapping a button on your
    screen. Would you take it? Most people would, and if you live in places like `Utah
    County`, `West Virginia`, etc. chances are you have already heard of the digital
    ballots, if not used them.


    Companies like `Voatz` and `Follow My Vote`, take care of the end-to-end voting
    procedures, allowing citizens to cast their votes through their phones. While
    the use of `blockchains` in voting has been appreciated, questions and criticisms
    have been targeted at the companies'' infrastructure. Critics are still not convinced
    about the confidentiality of the entire process. They believe that, since a lot
    depends on the security used by the voter’s network, the websites could easily
    be hacked into. The `Voatz` officials have confirmed that their technology has
    a feature that enables them to identify and reject the votes cast from unsecure
    networks. It’s worth noting that their procedures have also stood the test of
    live auditing.

    '
  trans: '


    为什么要做到这一步呢！？我们在科奇伦（Cochrane）正迎来一个智慧城市，那里是加拿大安大略省北部中部一个偏远的小镇。正如我们在非洲部分地区看到的那样，疫情对这里的人来说也是一次大觉醒，商会已借此机会创建一个自给自足的城镇，而
    `blockchain` 和 `cryptocurrency` 将其中发挥关键作用。这看起来可能只是一个很小的开始，但预计未来将吸引大量的投资。我个人对这一发展感到非常兴奋，因为我喜欢这种想法：`blockchain`
    不再是未来的技术，或者只有大玩家才想参与的东西！它就在当下，就在此地，离我们每个人的生活如此如此。你可以确定的是，在不久的将来，你的生活很大一部分将受到 `blockchains`
    的影响，如果还没有发生的话话。


    `blockchain` 实现的魅力之处不在于该技术的精妙理论，而在于它在你我生活中的实际应用。以一个损坏的路灯举简单的例子吧。回想一下，有人来维修它需要多长时间。对这类细节进行人工监控是一项艰巨的任务。现在，想象一下
    `blockchain` 进入这种情况。路灯安装了传感器。灯光出现故障的瞬间，就会触发一个 `smart contract`，生成一个任务并发送给技术人员，他们会立即来维修路灯。由于是在
    `blockchain` 上，执行任务的人员身份经过验证，数据会被存储，以备未来可能发生任何此类问题。这些数据随后可以利用政府资金对安装路灯和传感器的公司进行审计。这还确保了质量保证并监控了腐败。这就是
    `blockchains` 在你生活中的应用可以如此简单。


    无论是什么技术，除非你理解它它是如何影响你的，否则它就没有任何意义。一项不能让你的生活变得更轻松、更好的宏大技术是一种机会的浪费。但同时，如果你没有识别出这项技术带来的意义——如果你不参与其中，那也将是一种机会的浪费，也许是更大的浪费。


    ### 食品安全


    大多数人认为，食物匮乏是导致第三世界国家饱受营养不良的原因。然而，现实要复杂得多。确实，食物短缺是事实；但当数百万人在晚上饥饿着睡去时，也有大量的食物被直接扔进了垃圾桶。受饥饿之苦的人数可能少得多。


    在现代世界，生产的食物没有触及更多的人，原因是食物经过了复杂的供应链。此外，这些是闭环且不透明的过程，使得更难定位问题，更不用说解决它了。正如预期的那样，饥饿只是这种做法产生的不公现象之一。由于这种做法，可持续性几十年来一直被抛之脑外。而且我们已经看到它是如何影响农民的，使他们的生活变得日益困难。总而言之，这些过长、复杂的供应链对任何人都没有处。但奇怪的是，直到最近，从未有人关注过减少这种低效率和由此产生的浪费，大多数努力一直集中在提高生产力上。


    `Blockchains` 在这里是完美的颠覆者，因为以前存在广泛的问责真空。今天，许多大玩家已进入这一领域，并积极使用 `blockchains` 来保护食品质量。`Walmart`
    就是这样的一家。如果你在这里买过任何绿色蔬菜，那么你已经是 `blockchain` 技术的受益者。这是因为 `Walmart` 已要求所有的绿叶蔬菜供应商必须在
    `blockchain` 上上传详细信息以及产品数据——这使得信息极易获取且无法操纵。他们声称，他们的 `smart tracking technology`
    帮助他们将产品污染的追踪到几秒钟以内。这对生产者来说是一个巨大的解脱，他们以前一直因为无人不在场的情况污染而冒着大规模食品传播疾病的风险。它还节省了原本花在产品召回上的大量时间和资源。另一家在众多食品公司中首批基于
    `blockchain` 的供应链的公司是 `Nestle`。他们的目标是让所有产品和供应链相关信息对终端用户随时可用，从而增强对品牌本身的信任。


    `Supply chain blockchains` 在农业 `blockchains` 的案例中也可以起到补充作用。它们可以为我们提供消费者行为的关键数据，这反过来对于根据位置确定需求模式非常有帮助。更紧密地根据这种需求调整供应对于减少食物浪费非常有效；多余的部分可以转到其他可能存在未满足需求的地方。


    感谢对可持续性意识的提高以及对我们弱势群体日益增长的同情，导致了食品行业的一场真正的 `blockchain movement`。政府在促进公共部门 `blockchain
    adoption` 方面将发挥主要作用。通过他们制定的标准和政策，他们能够使向 `blockchain` 的过渡更加顺利。


    ### 投票


    民主听起来是一个极佳的概念，是实现民意的极佳的练习，但当人们似乎不在乎时会发生什么？选民冷淡一直是困扰全球所有民主选举的担忧。你可能会认为，随着腐败的增加，出来投票的人会越来越多。但事实似乎恰恰相反；随着信任度的下降，真正认为投票对事物运行有影响的选民人数也随之减少。一个常见的借口是投票是一个乏味且耗费时间的过程。现在，想象一下有一种方法可以让你像拿起手机并点击屏幕上的按钮那样轻松地投票。你会接受吗？大多数人都会接受，而且如果你住在像
    `Utah County`、`West Virginia` 等这样的地方，很有可能已经听说过数字选票，即使没用过也可能。


    像 `Voatz` 和 `Follow My Vote` 这样的公司负责端到端的投票程序，允许公民通过手机投选。虽然在投票中使用 `blockchains`
    得到了认可，但问题和批评针对的是这些公司的基础设施。批评者仍然对整个过程的机密性不信服。他们认为，由于很大程度上取决于选民网络使用的安全性，网站很容易被黑入。`Voatz`
    的官员已确认，他们的技术有一项功能可以使他们识别并拒绝来自不安全网络的选票。值得注意的是，他们的程序也通过了现场审计的测试。


    '
