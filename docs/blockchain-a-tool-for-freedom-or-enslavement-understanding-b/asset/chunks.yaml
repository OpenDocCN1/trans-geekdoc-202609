- raw: "As we already discussed before, the chances of a farmer in a remote area having\
    \ access to banking services are much less, as compared to them having access\
    \ to smartphones. The peer-to-peer lending blockchain services like the upcoming\
    \ blockchain startup AgriChain, for instance, and transactions across such networks,\
    \ can be completed with the ease of a tap on the phone screen. Moreover, blockchains\
    \ are also much more efficient in storing the documents related to best practices\
    \ that the farmer follows, and the various certifications that they may require\
    \ to prove their special value to the customer. \n\nThis blends into the aspect\
    \ of “smart agriculture” that can help the farmer implement quite sophisticated\
    \ measures of data storage, as well as analysis. This data, being immutable and\
    \ distortion-proof, carries special significance. Take the case of environmental\
    \ monitoring data. This is usually under the centralized control of government\
    \ authorities, and is utilized by them in making policy decisions based on environmental\
    \ trends. But, since the central authorities have their own interests to protect,\
    \ this data may be quite susceptible to manipulations which is just not possible\
    \ on a blockchain enabled network. Many projects utilizing the power of blockchains,\
    \ in relation to Information Communication Technology (ICT) and Internet of Things\
    \ (IoT), are currently in the works to help the farmers make the most of this\
    \ technology.\n\nAnother related area in which the blockchains can, and have been,\
    \ bringing significant improvement is the supply chains of produce. Issues in\
    \ this arena, in addition to making things difficult for the farmers, also result\
    \ in tremendous economic costs to the global society as a whole. From the perspective\
    \ of the farmers alone, blockchain technology helps in building trust with the\
    \ consumers, as information about every product is transparently and freely available\
    \ on the blockchain. This would eliminate competition, which attempts to monopolize\
    \ the market with cheap and bad-quality products. The farmers can thus supply\
    \ true value to the customers. On the other hand, from the customer’s vantage\
    \ point, they can now be certain about how the food that they consume is made.\
    \ A company known as Ripe does exactly this by providing a blockchain platform\
    \ for making the food supply chain digitally transparent.\n\nBlockchains also\
    \ address the concern of traceability, ensuring the least wastage of produce,\
    \ if any. A start-up called TE-FOOD uses identification tools to follow the movement\
    \ of produce—be it packaged edibles, fresh produce, or even livestock—through\
    \ the supply chain. Analyzing the patterns of wastage over a period of time can\
    \ bring valuable insights, which aid coming to a resolution of the issue. There\
