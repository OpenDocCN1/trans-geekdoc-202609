- raw: "As mentioned earlier, the blockchain saga began in 2008 when a mysterious\
    \ paper was published by a person (or a group of people) under the pseudonym of\
    \ Satoshi Nakamoto. But, to what end? Why was the need felt to publish a paper\
    \ that introduced a whole new system, when the well-oiled machines of traditional\
    \ financial systems were already in place? But wait, was it really well-oiled,\
    \ though? Turns out, it wasn’t. The financial crash brought to light some pretty\
    \ serious concerns that plagued our financial world: one of them being the fraudulent\
    \ nature of the so-called gatekeepers of our financial security—the banks. And\
    \ mind you, these fraudulent banks were backed by both the left- and the right-wing\
    \ political parties for their own vested interests. Too many people lost their\
    \ life savings and were pushed to the edge of bankruptcy. \n\nThis is when the\
    \ discontent that was simmering under the surface all along came to the fore with\
    \ full force. It wasn’t just that the blockchain paper was written, but more significant\
    \ was the curiosity it created in the many sectors through the economy. This was\
    \ majorly because this paper talked of a technology that could bypass the fraudulent\
    \ financial institutions altogether. \n\nThis was a never-before-thought-of idea\
    \ because, until now, it was believed that these institutions were the apex bodies\
    \ and no transactions could occur without their approval. Now, here was a group\
    \ of people who rubbished this notion completely and talked of creating a parallel\
    \ currency, the famous Bitcoin. This currency was thought to exist in a world\
    \ where there was no state authority. Though we, till date, do not know who Satoshi\
    \ Nakamoto was, we do this: Whoever invented cryptocurrency, and even those who\
    \ supported it, were not just any people. These were professional coders, who\
    \ knew the ins and outs of the system. In fact, the first description of the idea\
    \ was proposed long before the internet boom came about. Stuart Haber and W. Scott\
    \ Stornetta had already put forth this idea of generating time-stamps for digital\
    \ documents so that they could not be back-dated. These, and many other cryptographers\
    \ like them, didn't believe in centralized governance running interference. But,\
    \ would the human race ever be able to function without the external force of\
    \ authority? \n\n### Liberty Through Spontaneous Order\n\nThis might surprise\
    \ you, but humans don’t need an external jurisdiction in order to live lives that\
    \ are oriented towards general wellbeing. Don’t take my word for it but it is\
    \ an idea that’s at least 2,500 years old. All those years ago, a Chinese philosopher,\
    \ Zhuang Zhou, proposed the exact same thing. He believed that things find their\
    \ way into good order if they are just left alone. If you take interest in economics,\
    \ you might find this idea to be a little similar to what the Nobel laureate Adam\
    \ Smith spoke of—that societies can exist in perfect harmony without government\
    \ intervention. Though the specific terminology of \"spontaneous order\" only\
    \ came later, in the works of Michael Polanyi, the concept has remained the same\
    \ throughout. Moreover, this isn’t a culture-specific phenomenon, either, but\
    \ quite a universal observation.\n\nAs Frederic Bastiat, a French economist, rightly\
    \ put it, \"Life, liberty, and property do not exist because men have made laws.\
    \ On the contrary, it was the fact that life, liberty, and property existed beforehand\
    \ that caused men to make laws in the first place\" (A quote from The Law, n.d.).\n\
    \nIt is this idea of spontaneous order, the notion of absolute freedom from oppressive\
    \ systems, that drives the core of blockchain technology. For a long time, the\
    \ extent of these external influences has been debated. History gives us plenty\
    \ of evidence to show how blurring the boundaries between state and banks can\
    \ create a severely poisonous concoction that can change the course of their very\
    \ existence for the worse. And, if you are someone who likes freedom as much as\
    \ I do, you will get down on that side of the argument that advocates separation\
    \ of state and financial institutions. Blockchains make that spontaneous order\
    \ possible by separating the state from our daily life transactions; that’s what\
    \ makes blockchain technology worth standing up for.\n\n### The Right, the Left,\
    \ and the Free\n\nWhenever I talk about the philosophical and ideological background\
    \ of blockchains, I sense a pessimistic resistance from various sections of the\
    \ political spectrum. The sections of the media and the political community that\
    \ would rather subscribe to ignorance than innovation of blockchains often tend\
    \ to turn the advanced blockchain technology into a political issue, for vested\
    \ gains. The result is an ensuing debate over who is to blame for this ‘radical’\
    \ approach while never really gaining an enlightened insight into the process\
    \ itself. \n\nThe thing to understand, here, is that whichever side of the political\
    \ debate you identify with, blockchain can make life a lot easier for each one\
    \ of us. As I mentioned earlier, this technology can make ours a better world\
    \ for everyone regardless of where you come from. I have already said once before\
    \ that this isn’t a battle between the left and the right. But, it would be like\
    \ leaving a gaping hole right in the middle of a jigsaw puzzle if we didn’t break\
    \ this debate down further. \n\nWhile everyone is busy pledging their allegiance\
    \ to the right or the left, the more important and, possibly the more relevant\
    \ debate, is thrown right out of the window: the statism vs. individualism debate.\
    \ Statism is the ideology that promotes centralization of power as a means to\
    \ the end of merely turning the citizens into slaves to the state’s regulation\
    \ and policies. \n\nThat statement may seem a little harsh but the truth is, even\
    \ though we speak all the time of the religious wars fought across the globe,\
    \ we never address the religion of statism that runs rampant all around us. It\
    \ is no secret that government interference has claimed more lives in the past\
    \ century than anything else. And yet, we continue to trust the same governments\
    \ to lay the laws that govern our finances, healthcare, and so much more. As Thomas\
    \ Sowell famously said, “It is hard to imagine a more stupid and more dangerous\
    \ way of making decisions than by putting those decisions in the hands of people\
    \ who pay no price for being wrong” (Thomas Sowell Quotes, n.d.). Blockchains\
    \ have the potential to change this assumed dependence on authority and political\
    \ ideologies. They have the potential to free us in the most unconventional way\
    \ possible. \n\n## How Blockchains Work\n\nNow that we know the underlying principle,\
    \ let’s start understanding the process in a little more depth. Because of their\
    \ origin, blockchains are, quite often, wrongly used interchangeably with Bitcoin\
    \ and cryptocurrencies. While it cannot be denied that cryptocurrencies are the\
    \ most widely known application of blockchains, it is critical to note that they\
    \ are just one of the several. \n\nBlockchain is essentially a network where records\
    \ can be stored. This hack-proof system makes data forgery next to impossible.\
    \ So, rather than recording the data in only one place, it is stored in multiple\
    \ places at the same time—which means that even if one source may be manipulated,\
    \ the copies of the record keep the data from being corrupted. "
  fmt: "\nAs mentioned earlier, the blockchain saga began in 2008 when a mysterious\
    \ paper was published by a person (or a group of people) under the pseudonym of\
    \ `Satoshi Nakamoto`. But, to what end? Why was the need felt to publish a paper\
    \ that introduced a whole new system, when the well-oiled machines of traditional\
    \ financial systems were already in place? But wait, was it really well-oiled,\
    \ though? Turns out, it wasn’t. The financial crash brought to light some pretty\
    \ serious concerns that plagued our financial world: one of them being the fraudulent\
    \ nature of the so-called gatekeepers of our financial security—the banks. And\
    \ mind you, these fraudulent banks were backed by both the left- and the right-wing\
    \ political parties for their own vested interests. Too many people lost their\
    \ life savings and were pushed to the edge of bankruptcy.\n\nThis is when the\
    \ discontent that was simmering under the surface all along came to the fore with\
    \ full force. It wasn’t just that the blockchain paper was written, but more significant\
    \ was the curiosity it created in the many sectors through the economy. This was\
    \ majorly because this paper talked of a technology that could bypass the fraudulent\
    \ financial institutions altogether.\n\nThis was a never-before-thought-of-idea\
    \ because, until now, it was believed that these institutions were the apex bodies\
    \ and no transactions could occur without their approval. Now, here was a group\
    \ of people who rubbished this notion completely and talked of creating a parallel\
    \ currency, the famous `Bitcoin`. This currency was thought to exist in a world\
    \ where there was no state authority. Though we, till date, do not know who `Satoshi\
    \ Nakamoto` was, we do this: Whoever invented cryptocurrency, and even those who\
    \ supported it, were not just any people. These were professional coders, who\
    \ knew the ins and outs of the system. In fact, the first description of the idea\
    \ was proposed long before the internet boom came about. `Stuart Haber` and `W.\
    \ Scott Stornetta` had already put forth this idea of generating time-stamps for\
    \ digital documents so that they could not be back-dated. These, and many other\
    \ cryptographers like them, didn't believe in centralized governance running interference.\
    \ But, would the human race ever be able to function without the external force\
    \ of authority?\n\n### Liberty Through Spontaneous Order\n\nThis might surprise\
    \ you, but humans don’t need an external jurisdiction in order to live lives that\
    \ are oriented towards general wellbeing. Don’t take my word for it but it is\
    \ an idea that’s at least 2,500 years old. All those years ago, a Chinese philosopher,\
    \ `Zhuang Zhou`, proposed the exact same thing. He believed that things find their\
    \ way into good order if they are just left alone. If you take interest in economics,\
    \ you might find this idea to be a little similar to what the Nobel laureate `Adam\
    \ Smith` spoke of—that societies can exist in perfect harmony without government\
    \ intervention. Though the specific terminology of \"spontaneous order\" only\
    \ came later, in the works of `Michael Polanyi`, the concept has remained the\
    \ same throughout. Moreover, this isn’t a culture-specific phenomenon, either,\
    \ but quite a universal observation.\n\nAs `Frederic Bastiat`, a French economist,\
    \ rightly put it, \"Life, liberty, and property do not exist because men have\
    \ made laws. On the contrary, it was the fact that life, liberty, and property\
    \ existed beforehand that caused men to make laws in the first place\" (A quote\
    \ from `The Law`, n.d.).\n\nIt is this idea of spontaneous order, the notion of\
    \ absolute freedom from oppressive systems, that drives the core of blockchain\
    \ technology. For a long time, the extent of these external influences has been\
    \ debated. History gives us plenty of evidence to show how blurring the boundaries\
    \ between state and banks can create a severely poisonous concoction that can\
    \ change the course of their very existence for the worse. And, if you are someone\
    \ who likes freedom as much as I do, you will get down on that side of the argument\
    \ that advocates separation of state and financial institutions. Blockchains make\
