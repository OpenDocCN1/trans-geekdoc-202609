- raw: "Think of it as the loop of alcohol addiction one may be caught up in. In the\
    \ beginning, the alcohol makes him feel light and high. But, as the initial high\
    \ fades off, what’s left behind is a disoriented body, a guilty conscience and\
    \ the financial burdens. When the frustration of all these shortcomings climbs,\
    \ as tempting as it may be to drown oneself in the alcohol again, it is hardly\
    \ a solution. Getting through the difficult withdrawal symptoms might, indeed,\
    \ do much more good for the person. \n\nEssentially, Austrians believe that when\
    \ the money supply remains constant, even though the immediate consumption might\
    \ be restricted, the long-term savings would increase. Imagine a world where the\
    \ value of your currency could increase rather than decrease. If you knew this\
    \ was to happen, would you want to spend all your money today, or save it for\
    \ the future where it would fetch you a better value? On the other hand, money\
    \ whose value decreases over time, as is the case in our current society, leads\
    \ to a YOLO (You Only Live Once) kind of an attitude where reckless consumerism\
    \ is encouraged, regardless of the cost. \n\nFrom the business perspective, appreciating\
    \ money would also reduce malinvestments in projects which gives one an illusion\
    \ of growth only during the times of inflation. If the inflation were to drop,\
    \ these would become unprofitable at the drop of a hat. To put it simply, investors\
    \ would only contribute to projects that would be profitable in the long run,\
    \ rather than falling for the illusion of profits in the immediate future. \n\n\
    In 1972, a Stanford professor, Walter Mischel, proved with mere marshmallows that\
    \ children who could delay gratification tended to have healthier, happier, and\
    \ more successful lives as compared to their counterparts that could not. Austrian\
    \ economics worked out the same logic for the economies not years, but centuries,\
    \ back. And yet, here we are trying to reinvent the wheel every chance we get\
    \ and still come up with more of the wrong solution: unsound money. \n\nGlobally,\
    \ too, this unsound money has brought to the fore many issues. As it has to go\
    \ through the hassle of conversion, it gives an implicit power to certain economies\
    \ with higher conversion rates than others. This has led to multiple trade conflicts,\
    \ inevitably leading to war and loss. Imagine if there was one global currency\
    \ that you could use without the restrictions of national borders. This has the\
    \ potential to root out much of the current global conflict. \n\nSound money,\
    \ then, would need to have the features that counter the evil brought in by unsound\
    \ fiat money, the most important one of which would be stability through time.\
    \ Even though sound money appreciates over time, the appreciation is not suddenly\
    \ brought about by artificial elements. Another characteristic that sound money\
    \ needs to have, but the current fiat money doesn’t possess, is indestructibility.\
    \ Cryptocurrency serves these functions effortlessly and is thus a favorite of\
    \ the contemporary Austrian economists. The feature that’s most attractive to\
    \ them, however, is that this global currency is a decentralized one with no government\
    \ interference in the form of restrictive policies. We shall discuss cryptocurrencies\
    \ in more detail in a while but, for now, it’s necessary to understand the perfect\
    \ segue that they offer, from the flawed fiat monetary system prevalent in current\
    \ economies to the sound money theory that is staring us in the face from the\
    \ future. \n\n## The Crypto Conundrum\n\nFor a long time, the term cryptocurrency\
    \ remained synonymous with the famous (and infamous) Bitcoin. Somewhere in 2010,\
    \ a man named Laszlo Hanyecz ran out of cash to pay for a pizza he ordered, and\
    \ thus, convinced the delivery boy to take 10,000 bitcoins in exchange for the\
    \ pizza. At that time, these Bitcoins were only worth $40. That was the first\
    \ recorded Bitcoin transaction, and had only a few enthusiasts diligently following\
    \ the Bitcoin progress. Both Bitcoin and cryptocurrency, at large, have come a\
    \ long way since then. Now, not a single day goes by that has no reported news\
    \ on crypto. \n\nRecently, a debate has been raging: Can cryptocurrency be adopted\
    \ by national economies as legal tender? El Salvador has, in fact, named Bitcoin\
    \ as its official currency, along with the U.S. dollar in September 2021. Multiple\
    \ arguments have been made both for and against this move. But, what most people\
    \ don’t realize is that cryptocurrencies have arrived, and you cannot undo them.\
    \ They are gaining more and more traction, and there is no point trying to stop\
    \ this movement. What would be much more useful is to spend time deliberating\
    \ the means of adoption. \n\nA survey by YouGov shows that 27% of the people in\
    \ the United States today support the adoption of Bitcoin as legal tender (Fries,\
    \ 2021). Cryptocurrency, on the whole, seems to be a favorite of the younger section\
    \ of the population. So, why are cryptocurrencies gaining so much popularity?\
    \ The most relatable reason might be the convenient absence of all those transaction\
    \ costs and all those middlemen. In short, all the features we discussed in the\
    \ context of blockchains would all apply here, too. \n\nOne aspect of cryptocurrencies\
    \ that we haven’t discussed yet is the limited supply. Some cryptocurrencies,\
    \ not all, have limited supply through their lifetime. For instance, Bitcoin’s\
    \ supply is capped at 21 million, which means that all the bitcoins that can be\
    \ mined are expected to be mined somewhere by early 2024; and, Cardano (ADA) has\
    \ a limited supply of 45 billion. Once these reach their respective market caps\
    \ is when we will see the true deflationary effect of these currencies. This simply\
    \ means that, as time goes by, the value of these would appreciate, rather than\
    \ depreciate, because there are no more tokens coming in. If it feels similar\
    \ to the idea of sound money we discussed earlier, that’s because it’s exactly\
    \ the same. This is one of the reasons that Austrian economists love these cryptocurrencies.\
    \ \n\nToday, we are at a point where the user has a buffet of cryptocurrencies\
    \ at their disposal. And, even within the cryptocurrency universe, we have come\
    \ to see a lot of conflict and drama. You’d think that, since cryptocurrencies\
    \ are all based on the solid principled foundation of decentralization, that they\
    \ would be all on the same page, more or less. But, unfortunately, that’s not\
    \ the case. Bitcoin enthusiasts, for instance, seem to promote only Bitcoin and\
    \ condemn everything else. Ethereum co-founder Vitalik Buterin calls these people\
    \ “Bitcoin Maximalists.” Such a maximalist attitude defeats the purpose of distributing\
    \ the power in the market as much as possible, and centralizes it only in the\
    \ cryptocurrency of their choice. \n\nBut, Buterin himself hasn’t had a very supportive\
    \ record when it comes to differences with his own partner and co-founder of Ethereum,\
    \ Charles Hoskinson. This is the same person who, due to these clashes, has gone\
    \ on to create his own cryptocurrency (Cardano), which we discussed earlier. Not\
    \ just Charles but Gavin Woods, the creator of Polkadot, along with six other\
    \ founding members of Ethereum left the project because of the ideological clashes.\
    \ The point is, it’s important when investing in cryptocurrencies to understand\
    \ that not all of them follow the principles of decentralization, nor have deflationary\
    \ properties. Charles Hoskinson, being a Libertarian himself, has certainly been\
    \ able to create a blockchain that is the perfect amalgamation of the core principles\
    \ of liberty. The Cardano founder was also an active participant in the campaign\
    \ for Ron Paul’s leadership. I mention Cardano over and over but, in my research\
    \ (and it’s not exhaustive, by any means, considering the vast landscape of cryptocurrencies\
    \ and blockchains in general), I have found that it is certainly one that's built\
    \ with those building blocks. \n\n## Blockchains from the Austrian Economics POV"
  fmt: "\nThink of it as the loop of alcohol addiction one may be caught up in. In\
    \ the beginning, the alcohol makes him feel light and high. But, as the initial\
    \ high fades off, what’s left behind is a disoriented body, a guilty conscience\
    \ and the financial burdens. When the frustration of all these shortcomings climbs,\
    \ as tempting as it may be to drown oneself in the alcohol again, it is hardly\
    \ a solution. Getting through the difficult withdrawal symptoms might, indeed,\
    \ do much more good for the person. \n\nEssentially, Austrians believe that when\
    \ the money supply remains constant, even though the immediate consumption might\
    \ be restricted, the long-term savings would increase. Imagine a world where the\
    \ value of your currency could increase rather than decrease. If you knew this\
    \ was to happen, would you want to spend all your money today, or save it for\
    \ the future where it would fetch you a better value? On the other hand, money\
    \ whose value decreases over time, as is the case in our current society, leads\
    \ to a `YOLO` (`You Only Live Once` ) kind of an attitude where reckless consumerism\
    \ is encouraged, regardless of the cost. \n\nFrom the business perspective, appreciating\
    \ money would also reduce malinvestments in projects which gives one an illusion\
    \ of growth only during the times of inflation. If the inflation were to drop,\
    \ these would become unprofitable at the drop of a hat. To put it simply, investors\
    \ would only contribute to projects that would be profitable in the long run,\
    \ rather than falling for the illusion of profits in the immediate future. \n\n\
    In 1972, a Stanford professor, `Walter Mischel`, proved with mere marshmallows\
    \ that children who could delay gratification tended to have healthier, happier,\
    \ and more successful lives as compared to their counterparts that could not.\
    \ Austrian economics worked out the same logic for the economies not years, but\
    \ centuries, back. And yet, here we are trying to reinvent the wheel every chance\
    \ we get and still come up with more of the wrong solution: unsound money. \n\n\
    Globally, too, this unsound money has brought to the fore many issues. As it has\
    \ to go through the hassle of conversion, it gives an implicit power to certain\
    \ economies with higher conversion rates than others. This has led to multiple\
    \ trade conflicts, inevitably leading to war and loss. Imagine if there was one\
    \ global currency that you could use without the restrictions of national borders.\
    \ This has the potential to root out much of the current global conflict. \n\n\
    Sound money, then, would need to have the features that counter the evil brought\
    \ in by unsound fiat money, the most important one of which would be stability\
    \ through time. Even though sound money appreciates over time, the appreciation\
    \ is not suddenly brought about by artificial elements. Another characteristic\
    \ that sound money needs to have, but the current fiat money doesn’t possess,\
    \ is indestructibility. Cryptocurrency serves these functions effortlessly and\
    \ is thus a favorite of the contemporary Austrian economists. The feature that’s\
    \ most attractive to them, however, is that this global currency is a decentralized\
    \ one with no government interference in the form of restrictive policies. We\
    \ shall discuss cryptocurrencies in more detail in a while but, for now, it’s\
    \ necessary to understand the perfect segue that they offer, from the flawed fiat\
    \ monetary system prevalent in current economies to the sound money theory that\
    \ is staring us in the face from the future.\n\n## The Crypto Conundrum\n\nFor\
