    # Chapter 11: Energy


    I hope you remember the `blockchain` case studies in the energy sector that we
    have already looked at—be it `Bankymoon`’s blockchain-powered smart meters sourcing
    electricity for schools or homes in Africa. This, however, is only the beginning;
    the disruption potential in this sector is massive, and `blockchains` are already
    at work to topple the old energy system on its head.


    It is worth noting that, even before `blockchains` came onto the scene, the power
    utility sector was already on its way to a widespread transition, globally driven
    by the need for decentralization, digitalization, and decarbonization. Seeing
    how the `blockchains` certainly checked the first two boxes, and even for the
    third one provided quite the ecofriendly proof of stake consensus mechanisms,
    this technology (it would seem) was meant to be. Just as `blockchains` spurred
    on the development of the `Internet of Things` was quick to catch on, you’ll also
    hear terms like `smart grid` and `internet of energy` as we dive into the energy
    sector disruption.


    You can think of this discussion as an extension of the case studies in Africa,
    but now let’s consider a few more scenarios. Smart grids can essentially work
    in three different ways. We’ll do a quick review of the first two, as we have
    already discussed these. So, a household that wishes to be self-sufficient with
