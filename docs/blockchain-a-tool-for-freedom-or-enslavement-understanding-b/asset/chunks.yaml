- raw: "The patent vs. open-source debate has come to light prominently during the\
    \ recent decades as the exposure to technology and the drastic improvement it\
    \ can bring in people’s lives has increased. Intellectual property has become\
    \ a landmine that can blow up in your face if you misstep even slightly. So, which\
    \ side of the debate do I get off on, you ask? Well, as you may have guessed by\
    \ now, I am in favor of everything that increases our freedoms and innovation,\
    \ and shall always oppose anything that restricts it. And, you may have also guessed\
    \ where my inclination lies. But, just picking sides won’t help us here; we need\
    \ to understand the role that each of these play in the context of a monopolistic\
    \ market.\n\nPatent is a fickle word the entrepreneurs and innovators are made\
    \ to suffer by the system. They are said to be for the protection of the invention\
    \ so that only the inventor, and no one else, can use, sell, or modify the invention—be\
    \ it a product or a process—for a predetermined period. Anyone else encroaching\
    \ on the inventor’s territory is punishable by law. Despite Gates’ quote, all\
    \ big tech companies in Silicon Valley that produce your phones, gadgets, and\
    \ whatnot are filing, and having patent suits filed against them, every single\
    \ day. \n\nIt’s true that, theoretically, patents give the inventor solid protection\
    \ and ensure that the inventor gets their dues for all the efforts they have put\
    \ in. However, reality might surprise many of these investors seeking these patents.\
    \ The system is so broken that even the intended recipients of this benefit might\
    \ not find it helpful. This is because of what are known as “patent trolls.” These\
    \ people acquire patents without any real intention to develop a product. When\
    \ an inventor does produce something, they find themselves caught in this trap\
    \ where they have to fight to legally obtain the rights to their own products.\
    \ Understand that litigation is no simple task; it takes a lot of money, time\
    \ and effort. Now, who do you think has the resources needed for such drawn-out\
    \ litigation—a big business house already making millions or an individual with\
    \ leaner means? It is the unfortunate truth that, many times, the individual investor\
    \ gets squashed out in the competition, getting either the minimum dues or none\
    \ at all. What’s more, the monopolistic business houses do not just survive, but\
    \ thrive.\n\nMany would consider this a pessimistic view of the world—patents\
    \ have also benefited individual inventors, after all? Yes, by no means is what\
    \ I described above a blanket statement determining every case. And, thus comes\
    \ my next argument. Let’s say the inventor dodges the tricky legalities and gets\
    \ the patents they are looking for. While patents may be really good for the individual\
    \ seeking them, they do much harm to the industry as a whole. In 2014, Tesla Motors\
    \ released all of its patents for electric cars. This has acted as a major boost\
    \ for the electric car industry, and the eco-friendly innovation we have seen\
    \ in the last seven years in terms of technology, as well as infrastructure, is\
    \ staggering. Would this have been possible if the company had scores of lawyers\
    \ protecting the patents for this technology? No, at least it would not for a\
    \ long time to come. \n\nOn the other hand, consider the impact that patents can\
    \ have on access to medicines in African countries. A company that may be producing\
    \ a vital medicine can prevent other companies from manufacturing it, thereby\
    \ critically limiting the availability of the product in the market. The company\
    \ can charge any price that they wish, further limiting the access of the medicine\
    \ to the poor masses. Though these patents on intellectual property of these medicines\
    \ are regulated by the Trade-Related Aspects of Intellectual Property Rights (TRIPS)\
    \ agreement by the World Trade Organization, there is still a lot of conflict\
    \ in the area on the ground.\n\nPatents tend to not only promote self-interest\
    \ but greed, too, wherein monopolizing a certain part of the market is promoted.\
    \ Especially in the field of technology, patents only slow our economic progress\
    \ as a whole. Don’t get me wrong, as I said I do understand the benefits that\
    \ patents carry, especially for the inventor; but, looking at the big picture,\
    \ they take a lot more than they give. It is this discontent that has given rise\
    \ to the open-source movement. This movement has put high quality software and\
    \ technology in the public space where anyone and everyone has the liberty to\
    \ use it. Creators and inventors who put welfare before profits simply come together\
    \ to create something that resolves a particular need of the people and then make\
    \ the resolution public, free to be used. Github is one such platform that brings\
    \ together millions of developers to contribute to the open-source community.\
    \ \n\nSimply put, the open-source movement is turning the copyright law on its\
    \ head and its doing wonders for the world, especially countries that do not have\
    \ the financial resources for technological innovation. In other words, the patent\
    \ approach wants to protect profits over innovation and open-source allows for\
    \ protection of innovation over profits. Remember the big picture here—it’s not\
    \ just about profits and business. Look at all of this in the context of the free\
    \ market ideology, better still, in the context of the centralization vs. decentralization\
    \ debate we have been having all along. Understanding the cogs and wheels in that\
    \ debate is essential to make sense of how, and at what levels, centralization\
    \ has crept into our lives. \n\nSo, what is the relevance of all of this to blockchains?\
    \ Blockchain technology works on this open-source model, too, as professionals\
    \ come together and pool in their expertise for the betterment of society. The\
    \ fact is, regardless of the damage that monopolistic markets do behind the scenes,\
    \ they still seem to have a reputation that makes it all the more easier for them\
    \ to continue monopolizing the markets. This, among other factors, acts as a major\
    \ barrier to entry for a new competitor. With blockchains, the factors of reputation\
    \ and trust vanish because blockchain transactions promote “trustless trust” anyway.\
    \ A new entrant that has a good product, for example, will receive good reviews;\
    \ and, other users can be certain that the reviews (positive and negative) can\
    \ be trusted and aren’t manipulated or deleted, as may be the case otherwise.\
    \ Note that some blockchains have also been taking the more protective copyright\
    \ approach. And, it’s important to steer clear of these, as this protective privatization\
    \ approach goes against the very tenets of decentralization on blockchains in\
    \ the true sense.\n\n## The Political Debate\n\nThe logical progression of the\
    \ monopoly conundrum would have to be in the political realm. The one common way\
    \ monopoly thrives in an economy is the very crony capitalism we discussed earlier.\
    \ Thus, the discussion on the economic implications in the next chapter would\
    \ be incomplete without understanding the political ideologies that surround this\
    \ issue. We have already touched upon the crony capitalism, communism spread of\
    \ ideologies that we have been exposed to, each parading their own superiority\
    \ at the detriment of lives they cost. Libertarianism provides a truly elegant\
    \ solution to this age-old problem."
