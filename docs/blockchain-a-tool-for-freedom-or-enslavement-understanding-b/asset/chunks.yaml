- raw: "\n\n# Book Description\n\n“Only a large-scale popular movement toward decentralization\
    \ and self-help can arrest the present tendency toward statism.” Aldous Huxley\
    \ made this observation decades ago in the foreword to the second edition of his\
    \ novel Brave New World (1947). For a long time, though many have been in support\
    \ of these observations, the movement towards such decentralized systems has been\
    \ slow because “the how” of it all has been shrouded in uncertainty. This scenario,\
    \ however, has been turned on its head by the arrival of blockchains whose very\
    \ foundation is built on the principles of decentralization and mass participation.\n\
    \nThe blockchain movement has been finally getting the attention that it deserves\
    \ in all spheres of life. While industries have been making use of this technology\
    \ in the private sector, the public sector is where blockchain platforms can truly\
    \ shine. There are many blockchain companies working towards this, especially\
    \ in the developing economies, bringing about advances there that were previously\
    \ unimaginable. \n\nDespite the blockchain technology changing the world one aspect\
    \ of lifestyle at a time, the masses remain largely unaware of this technology.\
    \ This is primarily because blockchain has been primarily looked at as a technological\
    \ revolution. Sure, it is that—but what most of us don’t realize is that it is\
    \ also an ideological revolution. The core idea behind the beginnings of blockchains\
    \ still remains elusive to most of us, simply because we have never paid attention.\
    \ \n\nThis core philosophy of decentralization has the potential to revolutionize\
    \ the way citizens live their lives in the structure of their nation’s economy.\
    \ And this is true not just for the technologically equipped first-world countries,\
    \ but also in the third-world nations that have typically been let down by the\
    \ traditional systems. It is when you look at this application of blockchains,\
    \ not just to gain profits but to uplift the lives of the disenfranchised, you\
    \ begin to see the true nature of the blockchain potential.\n\nThis book provides\
    \ the novice with a unique blend between technology, ideology, and the real-world\
    \ solutions comprising blockchains to solve real-world problems. It’s likely you\
    \ have heard a lot about blockchains, but have never had the inclination to know\
    \ more. This may be because of the overwhelming technology or the constant bombardment\
    \ of news items that hardly go beyond cryptocurrencies. But, whatever the reason,\
    \ it's time to learn more about this innovation. \n\nAnd that is why, here, we\
    \ present the arguments that are relevant to you. We talk about how blockchain\
    \ can be the revolution that can truly change your life and the lives of millions\
    \ and billions around the world. We familiarize you not only with the technological\
    \ implications, but also the philosophical and ideological preceding factors to\
    \ help you understand the complex world of blockchains a little more simply. And,\
    \ most importantly, we talk about how the participation of the masses is the only\
    \ thing that can help this technology fulfill its potential to the highest degree.\
    \ \n\nBLOCKCHAIN: A Tool for Freedom or Enslavement?\n\nUnderstanding Blockchains,\
