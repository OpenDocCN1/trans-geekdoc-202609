    electricity produced thereof. The extra energy produced can be stored in a power
    bank for a literal rainy day when the solar panels are not stimulated by the sunlight.
    This would be the primary usage of the generated electricity. Remember that, in
    this particular set-up, a `blockchain` would not be required as the use is limited
