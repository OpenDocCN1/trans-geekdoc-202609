    A few of my fellow political enthusiasts are quick to label libertarianism as
    an extreme, authoritarian ideology that only promotes a rebellion against the
    establishment. The truth is something very different. Walter Williams puts the
    ideology in the context of the government in the most succinct manner possible.
    He says, “Nothing in our Constitution says that the Government is a grantor of
    rights. Instead Government is a protector of rights” (Walter E. Williams Quotes,
    n.d.). Contrary to misdirected popular belief, libertarianism doesn’t nullify
    the position of the government; rather, it places the government in a serving
    position and not a ruling one. I am only one of the many, many libertarians that
    firmly stand by the idea that the constitution was essentially anti-centralization,
    rather than the propaganda that we are made to believe—that it gives all powers
    to the government.


    Libertarianism may be a tricky concept to come to terms with, especially in struggling
    economies. When you apply Abraham Maslow’s theory of the hierarchy of needs to
    the living conditions of people in these countries, it is not too difficult to
    understand why the idea of liberty hasn’t gathered the same steam as it has in
    the developed nations. By keeping the masses engaged in the material aspects of
    living, the political parties have imposed unfair and exploitative practices on
    the people, and have even succeeded in their trickery (up until recently). Take,
    for instance, the case of West Africa. For a long time, politicians made their
    electorates believe that socialism was the most natural fit to their tribal heritage.
    Using this as a premise, the state governments lorded their dominance through
    price controls, nationalization of foreign companies, collectivized agriculture,
    and so on. The result of this political movement was that, while Africa had the
    maximum natural resources in the world, it still was the lowest in terms of socio-economic
    growth.


    It is only in the last few years that the people of Africa are realizing their
    own power and discovering their own paths to prosperity. A growing unrest and
    distrust of political parties and leaderships has been evident in the African
    countries, to the extent that they are looking at entrepreneurship, including
    blockchains and cryptocurrency, as the way out rather than state intervention.
    It is, of course, worth noting that the libertarian movement as we know it might
    not be effective in alleviating the concerns in the other parts of the world,
    and the taxonomy may vary considerably. But, what is fascinating is the core of
    the libertarian ideas that have taken shape in the African continent lately.


    It is crucial to note that libertarianism is not absent of rules. It is not that,
    under this tenet, people can behave anyway they wish. Rather, libertarianism only
    upholds the rights of the individuals to pursue their own happiness as long as
    they respect the rights of the other individuals. Libertarians call it the rule
    of law, which is nothing but respect for the idea of law as developed by deliberation,
    but not by arbitrary commands. This is what the media, that’s hell-bent on discrediting
    the libertarian movement, forgets to mention. Libertarians are posed as liberty-crazed
    radicals who are out to disintegrate order in society when, in reality, it is
    quite the opposite.


    Blockchains are now proving to the world that the libertarian ideas are not the
    stuff of fiction, but can actually be employed through viable and sustainable
    technology. Think about it—blockchains propagate the very principles of libertarianism:
    eliminating state interference, upholding equality, and empowering the lesser
    privileged. There is, of course, another major aspect of Austrian economics in
    that equation that deserves just as much detailed attention as everything else.


    # Chapter 5: The Economical Implications


    Man himself is the beginning and the end of every economy.


    - Carl Menger


    The current global economic system has left very many gaps that blockchains are
    primed to fill. A survey by PricewaterhouseCoopers in 2020 revealed that blockchains
    could boost the global gross domestic product (`GDP`) by $1.76 trillion by 2030.
    Can you imagine the scope of blockchains if these statistics were to be trusted,
    even partly? Even though you don’t need to be an economic genius to understand
    the astonishing beauty in those numbers, you might have to get a grip on a few
    basics when trying to understand the subtler ways a blockchain can be incorporated
    into an economy.


    As rightly put by the founder of the Austrian school of economics in the above
    quote, the human resource is the most important determinant in any economy. But,
    for a long time now, the common man has been kept removed from the workings of
    the economy under the propagated notion that these things are simply too complex.
    Even our school curricula conveniently leave it out when they need to be it with
    the same gusto, if not more, as math, biology, and other socalled sciences. While
    the notion that economics is complex may carry an iota of truth, things are not
    nearly as complicated as they are made to be. We are going to demystify the economics
    of it all and place it in the context of blockchains.


    For centuries now, economists have tried to understand human behavior from the
    vantage point of exchange of value. And, hundreds of years’ worth of experience
    with economic human behavior tells us that we humans like when we lower the uncertainty
    of the transaction, as well as the people we are transacting with. Nobel laureate
    Douglas North, the founder of New Institutional Economics, believed that all through
    history, we have relied on institutions to lower this uncertainty. For the first
    time ever in our economic history, we have the chance to take this blind faith
    in our institution out of the equation and establish transactions which are certain,
    as they are verified not by middlemen institutions, but people like you and me.
    This is why it becomes important for us to understand the economic implications
    of blockchains, as they continue to lower the uncertainty in our transactions.


    ## Understanding Money


    Money is arguably the most intriguing construct created by man. It is not just
    a paper, but a complex set of beliefs, attitudes, and even emotions. Most of the
    time, we seem to look at only the economic value, discounting completely the psychosocial
    nature of this unique entity. But, in an economic discussion, isn’t the economic
    definition more valid, you may ask. Well, in my experience, not necessarily so.
    There is hardly any creation that the human race has witnessed that can be understood
    fully without human involvement in it—both physical and emotional. Thus, it would
    be a folly to exclude human perception from the construct of money if we are to
    understand it in its entirety.

