    a long time, the fact that consumers didn’t want to wait around for their food
    at a fast-food chain resulted in massive losses for the franchise company to the
    point that they eventually shut down the pizza ovens. Even in recent times, whenever
    the company gets too comfortable with its success, the consumers have aptly given
    the well-timed reality checks. Imagine a fast-food company giving the consumers
    healthy choices to keep up with the demands of the healthy millennial lifestyle—that
    is what consumer demand has done till now and will continue to do in future, as
    well!


    Don’t get me wrong, I am under no illusion that capitalism in its current form
    is doing anyone any good. It’s obviously as dysfunctional as its socialist opponents.
    And, this is why we need to understand the difference between free market capitalism
    and crony capitalism. Free market capitalism, in itself, means giving power to
    the buyers and sellers; whereas crony capitalism gives it to a select section
    of cronies or big business houses that may be in the good graces of the government.
    We have seen this lobbyist crony capitalism take an ugly turn across the globe,
    right from China to Russia and even the United States, in the last few years.


    In many of these parts, this crony capitalism, mixed with communism, is wreaking
    havoc on the common man in the most subtle and gradual manner. An ideology that
    started with outlining the evils of capitalism eventually walked the same path,
    but in a very different manner. Take the example of the Naxalite movement in India—the
    constant war between crony capitalists and the communist militant group has only
    resulted in the bloodshed of the innocent, powerless villagers. And, this is just
    one example of how ugly it has gotten on both sides of the spectrum.


    Most people don’t realize, at all, that this is nothing like free-market capitalism.
    The absence of government interference, explicit as well as implicit, makes all
    the difference here. For a long time, people have been swung to and fro between
    these extreme ideologies, with no other option but to be played like pawns. For
    the first time in history, we have a third option. Blockchains can help us facilitate
    a truly free-market economy as it was always meant to be. But, the common masses
    have to move fast because, if we don’t, then we risk blockchains being overtaken
    by the very ideologies that we are trying to escape.


    ## A Game of (Market) Monopoly


    Greed is an inseparable part of the human condition. Socrates said, “He who is
    not contented with what he has, would not be contented with what he would like
    to have” (Socrates Quotes, n.d.). Despite this wisdom haven’t we all been found
    to always want just a little more—that one more bite of cake, one more minute
    of blissful sleep, one more promotion, etc.? We have all been greedy in our own
    way. Let’s face it—evil is not an uncommon thing among humankind. We all have
    a dark side and we all slip up. But, what happens when this little individual
    greed turns into an organizational one, impacting millions of lives?


    Market monopolies are arguably the evilest manifestation of centralization that
    takes power away from people. Monopolies allow for organizational giants to influence
    the product prices to such an extent that they can restrict the entry of new players
    into the market. Markets work because they are a place of fair exchange, but monopolistic
    markets take that away by replacing competition with complacency. That does nothing
    but make the ridiculously rich even richer, while leaving the poor completely
    out of the equation.


    Take the example of the `Eskom` debacle in South Africa. The power company has
    been a monopoly in the power sector for almost a century, but the cracks in this
    shining facade can no more be hidden. For a long time, the institution was quoted
    as a shining example of how a marriage between governments and corporations was
    in the best interests of the economy. Many believe that the end began its down-the-hill
    journey when it changed from `Escom` to `Eskom`. Of course this, as described
    by Frederic Bastiat in his age-old works, would be the perfect example of the
    logical fallacy of judging a situation by its short term results rather than the
    long-term consequences.


    In a nutshell, the monopolistic structure of this organization was doomed to fail
    right from the beginning. When you apply the principles of the Austrian school
    of economics, (which we will discuss in detail a little further in this chapter),
    you will understand exactly what I mean. Austrian economics is clear on the importance
    of price in the economy. Being a state-controlled monopoly with no competition,
    `Eskom` was destined to fail right from the go because it could never adjust prices
    according to the demand-supply patterns.


    Many believe that giving greater power to policing mechanisms like the judiciary
    and the governments can solve the issue of monopolistic markets that run at the
    expense of people. That, as has been evidenced multiple times and even in the
    `Eskom` case study, is not true. To understand what works in eradicating monopolies
    from the market, we’d have to understand what leads to the formation of these
    monopolies.


    ## Patents VS. Open-Source Technology


    Bill Gates has an interesting take on patents. He says, “If people had understood
    how patents would be granted when most of today’s ideas were invented, and had
    taken out patents, the industry would be at a complete standstill today” (Lee,
    2007). If the bitcoin creators were to patent the cryptocurrency and blockchain
    technology, they would be swimming in a pool of money and we wouldn’t even be
    here talking about this. Conflicting views on patents have been around almost
    as long as patents have. Different people may take up different positions on this
    but what no one can deny is patents take up tremendous amounts of resources (that
    may, let’s face it, well be used for something much better, though the pro-patent
    individuals don’t agree). It’s useful to understand patents, especially because
    they may lead us to unravel the mystery of monopolies.

    '
  trans: '


    尽管这两个部分具有理论价值，但对许多人来说，一个完全自发运行的市场似乎是不可能的。许多人看着这个国家过去几年发生的事情，便断言资本主义是行不通的。这从头到尾都是一个谬误。现实是，客户是王，这也是企业无论规模多大、权力有多大，竭一切让客户使用其产品的唯一原因。没有这一点，就没有真正的业务，没有资金产生，也没有了供我们分析的经济学。从本质上说，消费者掌握着经济发展方向的关键。以加拿大埃德蒙顿市一家名为
    `[Re]Waste` 的公司的一项计划为例。创始人 Corey Saban 在向博蒙特市推介了一个塑料回收项目后，现在已与大麻行业的两家公司签署了重大合同。这种转变不仅受到高层管理理念的影响，在很大程度上也受到该行业消费者的影响。根据对
    15,000 多名消费者的调查，86% 45 岁以下的消费者表示他们愿意为可持续包装支付更多费用。当消费者的需求模式改变时，企业只能通过改变产品来顺应。这就是自由市场的魅力所在。


    我知道你在想什么，“但是，这只是一个小公司，不是吗？！那些无所不能的大公司呢？”事实是，这些大公司并不像我们想象的那样无所不能。以 `McDonald’s`
    在 90 世纪的披萨实验为例。尽管 `McDonald’s` 长期以来一直是巨大的品牌，但消费者不想在快餐店等待食物的事实导致该特许公司遭受了巨额损失，以至于他们关闭了披萨炉。即使在最近，每当公司对自己的成功过于安逸时，消费者就会恰到好处给出及时的现实检查。想象一下，快餐公司为消费者提供健康选择以适应健康千禧一代生活方式的需求——这就是消费者需求到目前为止所做的，未来也将继续做的事情！


    不要误解我，我并没有幻觉目前形式的资本主义对任何人有好处。它显然和它的社会主义对手一样功能失调。这就是为什么我们需要理解自由市场资本主义与权贵资本主义之间的区别。自由市场资本主义本身意味着将权力赋予买卖双方；而权贵资本主义将权力交给了少数亲信或可能与政府关系良好的大企业集团。在过去的几年里，我们看到这种游说集团式的权贵资本主义在全球范围内发生了恶性转变，从中国到俄罗斯，甚至是美国。


    在这些许多地区，这种与共产主义混合的权贵资本主义以最微妙、渐进的方式给普通人带来了灾难。一种始于概述资本主义罪恶的意识形态最终走上了同样的道路，但方式非常不同。以印度的纳萨尔派运动（Naxalite
    movement）为例——权贵资本家与共产主义武装团体之间的持续战争只导致了无辜、无助村民的流血。这只是这种光谱两端变得如此丑陋的一个例子。


    大多数人根本没有意识到，这与自由市场资本主义毫无关系。政府显性及隐性干预的缺失在这里产生了本质区别。长期以来，人们在这些极端意识形态之间摇摆，除了像棋子一样被操纵别无选择。历史上第一次，我们有了第三种选择。区块链可以帮助我们促进一个本应是、真正自由的市场经济。但普通大众必须快速行动，因为如果我们不这样做，我们就面临区块链被我们正试图逃避的意识形态所取代的风险。


    ## （市场）垄断游戏


    贪婪是人类状况中不可分割的一部分。苏格拉底说：“不满足于现状的人，对于他想要拥有的也不会满足。”（Socrates Quotes, n.d.）。尽管有这种智慧，但难道我们没有发现自己总是想多要一点吗——多吃一口蛋糕、多睡一分钟美妙睡眠、多一次升职等等？我们都以自己的方式表现过贪婪。面对现实吧——邪恶在人类中并不罕见。我们都有阴暗面，我们都会失足。但是，当这种小小的个人贪婪变成组织性的贪婪并影响数百人的生活时，会发生什么？


    市场垄断无疑是剥夺人民权力的中心化最邪恶的表现。垄断允许组织巨头影响产品价格到这种程度，至于它们可以限制新玩家进入市场。市场之所以运作是因为它是一个公平交易的地方，但垄断市场通过用自满取代竞争而剥夺了这一点。这除了让那些富得离谱的人更有钱之外，让穷人完全被排除在方程之外。


    以南非 `Eskom` 的惨剧为例。这家电力公司在近一个世纪的时间里一直是电力部门的垄断者，但这个华丽表象下的裂纹已无法隐藏。长期以来，该机构一直被作为政府与企业结合最符合经济利益的典范。许多人认为，当它从
    `Escom` 变为 `Eskom` 时，终结就开始了下坡之旅。当然，正如弗雷德里克·巴斯亚特（Frederic Bastiat）在其著作中所描述，这是根据短期结果而非长期后果来判断形势的逻辑谬误的完美例子。


    简之，该组织的垄断结构从一开始就注定失败。当你应用奥斯利派经济学的原理时（我们将在本章稍后部分详细讨论），你将完全理解我的意思。奥斯利派经济学对价格在经济中的性非常明确。作为国家控制的垄断，`Eskom`
    注定失败，因为它无法根据需求模式调整价格。


    ## 专利 VS 开源技术


    比尔·盖茨对专利有独特的看法。他说：“如果人们在发明今天的大多数想法时就能理解专利是如何授予的，并申请了专利，那么现在的行业将陷入完全停滞。”（Lee, 2007）。如果比特币的创造者对加密货币和区块链技术申请专利，他们将钱如贯水，我们甚至不会在这里谈论这些。关于专利的冲突观点几乎和专利存在的时间一样长。不同的人对此此可能持有不同的立场，但没有人能否认的是专利消耗了大量的资源（诚实地说，专利支持者不同意这些资源完全可以用于许多更好的地方）。了解专利是有用的，因为它们可能帮助我们揭开垄断的谜团。


    '
