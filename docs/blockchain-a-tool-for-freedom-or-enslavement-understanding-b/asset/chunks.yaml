- raw: "The second use case is where you would sell the extra electricity to your\
    \ neighbors. So, if the smart grid is to power a neighborhood, it will be connected\
    \ to an automated aggregation service which optimizes the demand and supply for\
    \ electricity. But, what happens when the panels don’t produce enough electricity\
    \ to fulfill the needs of the entire community? Simple, you ask for more! The\
    \ extra electricity that’s needed is negotiated for from another energy-producing\
    \ community; the transactions happen much like they would if electricity was any\
    \ other commodity. These are then paid for in micropayments, simultaneously, which\
    \ are securely recorded on the blockchains. These can be verified to see if the\
    \ transactions are actually working out for both parties. Here, the electricity-generating\
    \ solar panel would act as a secondary provider of energy.\n\nThis system is smart\
    \ not only because of secure transaction logging, but it also assesses the patterns\
    \ of your electricity usage, thereby making an estimate of the amount you will\
    \ need for a stipulated period of time. Based on your usage data, it can even\
    \ schedule major loads like electric vehicle charging, heating water, and so on.\
    \ \n\nThe last case is when the microgrid would fulfill requests for temporary\
    \ deficits. In this case, it would become a tertiary reserve for energy production.\
    \ Now, pay attention to the sophistication of the process—a transaction is activated\
    \ on the blockchain, which comes in as an offer for a certain amount of electricity.\
    \ The grid then syncs this request with your online calendars to determine if\
    \ you have any travel planned. Accordingly, it decides if it can spare enough\
    \ energy, factoring in the electric charging of your vehicle. If it can spare\
    \ the electricity, then it is sold at a much higher price, quite like the surge\
    \ prices for Uber. \n\nEven though it may not seem like much, when looked at in\
    \ the context of one house, this can and is bringing millions access to electricity.\
    \ Besides, blockchains, with their distributed ledgers, can scale up these microgrids\
    \ to a much larger extent, too. Remember that the payment for the electricity\
    \ is through crypto tokens. The blockchain technology successfully incorporates\
    \ into the microgrid model the peer-to-peer energy trade. which is a great possibility\
    \ for a decentralized approach to power generation and distribution. Several platforms\
    \ have been testing this concept flawlessly for quite a while now. Take, for instance,\
    \ Suncontract in Slovenia, Powerledger in Perth, and LO3 Energy in Brooklyn; they\
    \ are fine evidence that decentralized energy projects are possible across the\
    \ globe. \n\nThe same concept has been extended to the retail and wholesale markets\
    \ for energy, where companies can fulfill their energy needs by sourcing them\
    \ from such platforms rather than the traditional centralized authorities. WePower\
    \ is one such platform that helps companies to fulfill their energy needs by providing\
    \ them with the right amount of green and clean energy. \n\nThis is another aspect,\
    \ in addition to consumption of energy itself: the decarbonized energy that we\
    \ spoke of at the beginning of this section. FlexiDAO, for instance, is blockchain-driven\
    \ software aimed to boost the decarbonization and decentralization of power. This\
    \ software tracks the energy production, right from its source to destination,\
    \ and is vigilant against double counting. One can also receive what are known\
    \ as carbon credits for adhering to the green standards, and these can then be\
    \ used to either obtain services or simply be sold in the marketplace.\n\nMany\
    \ of the Ethereum-based decentralized apps (DApps) are also making their own contributions\
    \ in this power revolution. Swether is one such app that provides end-to-end solutions\
    \ for the internet of energy. Right from booking charging stations for your electric\
    \ vehicle, to handling payments, to bidding for energy from various providers,\
    \ to syncing loyalty tokens—this DApp seems to do everything, making your life\
    \ much easier.\n\n# Chapter 12: E-Commerce \n\nIt is no secret that the last decade\
    \ has seen a huge uptick in the e-commerce industries. Whether it is merchandise\
    \ from your favorite TV show, books, electronics—you name it, and it’s available\
    \ with a simple click or a tap. Especially with the onset of the pandemic, the\
    \ e-commerce industry has boomed beyond imagination. If you are like most of the\
    \ people today, you might not even remember the last time you went to a brick-and-mortar\
    \ retail store. But, as much as we may love the ease of sitting in our bed, all\
    \ cozy under the blanket while shopping for our favorite pair of sunglasses, the\
    \ system isn’t entirely without problems. \n\nOne of the biggest problems faced\
    \ by e-commerce platforms is counterfeit products that do not match the product\
    \ descriptions. The result is quite obvious; customers send these products right\
    \ back. This not only results in loss of sale, but also tarnishes the brand image\
    \ of the platform more than the vendor company that sent the substandard product.\
    \ Moreover, the logistical costs of picking up a return are far too high, as compared\
    \ to the profits. Though, usually these platforms tend to fine the vendors for\
    \ low-quality products, it’s still a lot of unnecessary wastage through the supply\
    \ chain. What’s more, managing the payments to the vendors is another arduous\
    \ task. It’s a tedious process with multiple steps, many intermediaries, and a\
    \ lot of documentation. This process, in itself, can incur heavy costs for the\
    \ e-commerce platform. \n\nApart from the product-related concerns, e-commerce\
    \ platforms might also have to face serious functional problems. An e-commerce\
    \ platform, for instance, has to stay up and running, no matter what. But, this\
    \ may be endangered by virtual attacks posing grave security risks. Many cybersecurity\
    \ reports suggest that e-commerce platforms are the most valuable to malicious\
    \ hackers. \n\nAs if these weren’t enough, there are also the problems that occur\
    \ at the customer end, when the delivery happens. If the supply chain is inefficient\
    \ and glitchy, there is no way for the customer to know exactly where the package\
    \ is. Many times, when the package arrives, the customer is not home, forcing\
    \ the delivery executive to either register a failed attempt to deliver or the\
    \ more common route of action—leaving the package at the door, which is very likely\
    \ to be lost or stolen. The customer can then file a complaint to have delivered\
    \ the package again, but this whole grievance redressal protocol is more resources\
    \ down the drain.\n\nNow, before we proceed further to talk about how blockchains\
    \ help, I would like you to engage in a mental exercise with me and try to think\
    \ of some of the ways that they could increase the efficiency of e-commerce platforms.\
    \ You will have realized, by now, that the same blockchain principles of security,\
    \ immutability, traceability, and decentralization are being applied to all of\
    \ the industries we have discussed so far. Those are the same principles here,\
    \ as well. \n\nWith a decentralized inventory management system, the e-commerce\
    \ platforms can greatly decrease the delivery times. Also, the blockchains provide\
    \ the customer with the exact location of the products to be delivered, significantly\
    \ reducing the failed attempts at delivery and, also, the related costs. Blockchains\
    \ also offer protection against malicious attacks and prevent any penetration\
    \ in the system, making sure that the data of the customers remains safe and secure\
    \ within the platform. "
  fmt: "\nThe second use case is where you would sell the extra electricity to your\
    \ neighbors. So, if the smart grid is to power a neighborhood, it will be connected\
    \ to an automated aggregation service which optimizes the demand and supply for\
    \ electricity. But, what happens when the panels don’t produce enough electricity\
    \ to fulfill the needs of the entire community? Simple, you ask for more! The\
    \ extra electricity that’s needed is negotiated for from another energy-producing\
    \ community; the transactions happen much like they would if electricity was any\
    \ other commodity. These are then paid for in micropayments, simultaneously, which\
    \ are securely recorded on the blockchains. These can be verified to see if the\
    \ transactions are actually working out for both parties. Here, the electricity-generating\
    \ solar panel would act as a secondary provider of energy.\n\nThis system is smart\
    \ not only because of secure transaction logging, but it also assesses the patterns\
    \ of your electricity usage, thereby making an estimate of the amount you will\
    \ need for a stipulated period of time. Based on your usage data, it can even\
    \ schedule major loads like electric vehicle charging, heating water, and so on.\
    \ \n\nThe last case is when the microgrid would fulfill requests for temporary\
    \ deficits. In this case, it would become a tertiary reserve for energy production.\
    \ Now, pay attention to the sophistication of the process—a transaction is activated\
    \ on the blockchain, which comes in as an offer for a certain amount of electricity.\
    \ The grid then syncs this request with your online calendars to determine if\
    \ you have any travel planned. Accordingly, it decides if it can spare enough\
    \ energy, factoring in the electric charging of your vehicle. If it can spare\
    \ the electricity, then it is sold at a much higher price, quite like the surge\
    \ prices for Uber. \n\nEven though it may not seem like much, when looked at in\
    \ the context of one house, this can and is bringing millions access to electricity.\
    \ Besides, blockchains, with their distributed ledgers, can scale up these microgrids\
    \ to a much larger extent, too. Remember that the payment for the electricity\
    \ is through crypto tokens. The blockchain technology successfully incorporates\
    \ into the microgrid model the peer-to-peer energy trade. which is a great possibility\
    \ for a decentralized approach to power generation and distribution. Several platforms\
    \ have been testing this concept flawlessly for quite a while now. Take, for instance,\
    \ `Suncontract` in Slovenia, `Powerledger` in Perth, and `LO3 Energy` in Brooklyn;\
