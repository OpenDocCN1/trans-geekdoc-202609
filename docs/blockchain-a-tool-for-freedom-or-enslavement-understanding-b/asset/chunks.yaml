  trans: '


    你不必成为环保主义者也能知道地球正处于深陷危机之中。随着垃圾填埋场比以往任何时候都要高，全球范围内的废物管理似乎正努力追赶日益增长的垃圾山。随着人口增长和商业消费主义的提高，废物也随之增加，尤其是非环保废物。加拿大安大略省最近有报道称，其垃圾处理空间即将耗尽。随着这些以固体、液体和气态形式存在的废物堆积，人类健康日益受到威胁。废物管理不当的问题已有充分记载，特别是在发展中国家，导致了如呼吸系统问题、皮肤感染，甚至是产前和产后缺陷等严重的健康问题。除了腐败之外，发展中国家这种管理不当的主要原因是，废物管理在其物流链中涉及多个动态变动的环节。


    你是否曾想过，从你路边收集的垃圾去向了哪里？简单且可能没那么可怕的答案是，它们进入了填埋场。但除此之外，由于垃圾类型的繁多、过程中涉及的众多收集和处理中心，以及许多在大规模上难以追踪的动态因素，追踪这些垃圾的移动轨迹可能非常困难。区块链在这方面已被证明是极其成功的。


    阿根廷尽管是一个发展中国家，但已被证明将其垃圾纳入区块链的绝佳典范。政府与企业家伊万·祖比莱维茨（Ivan Zubilewicz）合作，实施了使用祖比莱维茨创建的名为`JellyCoin`的加密货币废物收集奖励计划。这种加密货币奖励给所有参与废物管理过程的人。任何想要参加的人只需登录应用程序并注册为垃圾生产者、收集者或处理者。这些人都会根据遵循适当的废物分类获得奖励。这些不同的参与者之间也相互连接，确保了可追溯性以及由此产生的问责制的落实，以改进整个流程。收集者甚至根据他们收集垃圾的距离获得奖励。总而言之，整个过程变成了激励机制，从而使人们在工作中更加积极。由于这种加密货币在阿根廷经济中被广泛接受，可以用来在主流市场购买他们想要的任何东西。这真是不需要联邦政府就能解决古老难题的绝方法！


    另一个类似的试点项目正在推动印度孟加罗尔（Bengaluru）的社区努力，创建一个更好的废物处理系统。区块链提供了一种万无一失的方法，确保垃圾收集中的任何问题都不会被遗漏。如果垃圾收集被忽视，公民可以去注册投诉。在引入区块链元素之前，政府使用一种地理标记系统，收集者会拍摄一张带有时间戳的清理后的现场照片并上传。但问题是，这项技术存在漏洞，允许对过去的数据条目和时间戳进行篡改。将这项技术与区块链相结合，引入了急需的精细化水平，同时让所有利益相关者都能看到这些数据。这种透明度确保了问责制，并让那些正在执行任务和没有执行任务的人之间有了清晰的了解。


    `RecycleGO` 是一个位于纽约的项目，使用 QR 扫描仪扫描塑料瓶，增加了塑料废物管理的可追溯性。他们在尼日利亚拉各斯（Lagos）也设有一个机构，计划通过将整个过程置于区块链上，将他们的塑料回收提升一个层次。


    我们在这里讨论的所有项目都在所谓的世界上发展中地区运行。我强调这一点，是因为通常我们有一种偏见的认知，认为发展中世界并不像其其他对应国家那样精通技术。但是，我们在这一节中看到的，以及到目前为止讨论的内容，完全反驳了这种观点。这些国家可能找不到财政资源，但也许正是这种稀缺激发了他们更加经济、更高效地利用资源。而区块链之所以让我兴奋，是因为它们似乎是这种资源利用的完美工具。


    # 第 7 章：发展中经济体的用例


    遗憾的是，发展中经济体一直是获得先进技术所提供的任何收益的最后。这些社区中功能失调的层级结构往往是这些群体所处社会劣势的根源。但正如我们在文中多次证明的那样，区块链有能力改变这一切。尽管我在这里分享的例子非常令人兴奋，但区块链技术仍处于婴儿阶段。区块链在真正重要的领域仍在寻找自己的话语。


    尽管如此，今天我们已经有足够的证据来确定这种技术是有效的，特别是在世界上最不被认为它们会成功的地区。虽然我们描述了几个区块链作为游戏规则改变者的例子，现在我们来独家观察这项技术如何扭转非洲大陆的现实。本章引导你关注这项技术在非洲国家正在创造的奇迹，一个平台一个地改变他们社会赋能的格局。我们将逐一查看所有平台，并观察它们对非洲经济的影响。


    2020 年，`PositiveBlockchain.io` 的一项调查识别了 69 个在非洲大陆利用区块链进行社会公益的项目（Smart Africa,
    2020）。请记住，当我们谈论社会公益时，这些并不一定是非营利性的。事实上，其中大多数是营利性初创公司。这完全不是坏事，因为这意味着人们和组织开始将区块链视为行的自给自足平台，可以产生收入并获取利润，而不需要依赖特定实体的捐赠和慈善。根据上述报告，这些项目中的大多数（57%）是在非洲大陆本土的总部运营的。然而，这些区块链倡议在整个大陆的传播并不均匀，肯尼亚、南非和尼日利亚是关注最多的地区。尽管如此，毫无疑问，一个充满活力的区块链生态系统已经在该大陆出现，并正走向持久的繁盛发展。


    ## 数字金融基础设施


    区块链上的数字货币已被人们广泛接受。考虑到我们之前讨论过非洲人对 `mpesa` 等移动货币应用的青睐，这并不令人意外。你可能会惊讶地发现，全球大多数移动货币运营商都运行在撒哈拉以南的非洲。当全世界都在纠结加密货币的可行性时，非洲人似乎对交易
    `Bitcoin` 等货币感到非常自在。


    '
