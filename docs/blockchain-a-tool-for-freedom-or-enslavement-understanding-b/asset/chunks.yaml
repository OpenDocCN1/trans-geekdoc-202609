    When one of the United States’ founding fathers said that, he probably had no
    idea that, centuries after freeing themselves from the shackles of colonization,
    we would still be slaves to the whims and fancies of those in power, those that
    claim to be our saviours from evils, and those that call themselves guardians
    of our freedom. Yes, I do think we are still slaves—maybe not in the conventional
    sense of the word, but surely you must have considered the fallacy in thinking
    that we need to constantly worry about guarding our freedoms? The truth is that
    the kind of societal hierarchy we have been conditioned to believe in tells us
    that freedoms shall be given to us only to the extent that they give certain sections
    the power they crave for. This somehow suggests that the freedom-power dynamic
    is a trade-off for the likes of you and me. You can have either, but not both.


    I know what you are thinking: Why on earth am I talking so intensely about freedom
    in a book on blockchains. Well, if you pay close attention, it isn’t difficult
    to understand. The blockchain movement that is so focused on snatching power away
    from the sections in which it has been concentrated for ages and giving it to
    the common man is not a new movement at all. This movement has gone on a long
    time before any of us were here. It has changed faces, but its heart remains the
    same; it still beats with the rebellion screaming for liberty.


    ## The Beginnings of a Rebellion


    Let’s do a thought experiment, shall we? Imagine you wake up one day and you are
    told that, from now on, you can only wear two colors—black and white—for the rest
    of your life. Everyday you can wake up and decide between the two. You are told
    that you can have the best quality suits and skirts, but not any other form of
    clothing. How would you feel about that? Stifled? Frustrated?


    Now, go a step further. You have been fed with messages right from your childhood
    that this policy of black and white clothes is actually good for you, that it
    actually saves your time that you’d otherwise waste on choosing one of the several
    colors, and that those colors would be a distraction for you, anyway. Moreover,
    you have been conditioned to believe that this entity that makes these choices
    wants what’s best for you. You are even told, directly or indirectly, that the
    system is too powerful to be changed and it would be easier to just stick to the
    rules (which are made for your own good, after all).


    This allegory may seem like a silly exaggeration, but if you pay close attention,
    you’ll realize that this isn’t very different from what our centralized systems
    do. They make the laws and take up policies that they think are in our best interest—or
    rather, shall we say, in their own best interest? Whichever it may be, centralized
    powers tend to choke our freedoms to the extent that we start believing that someone
    else would be better at making our decisions themselves that would actually be
    ‘good’ for us.


    I realize it makes me sound like a radical rebel, but believe me when I say this:
    Radical rebels are what are needed in this day and age. Blockchain enterprises
    are just the logical advancement in this line of thought, rather than a surprising,
    miraculous innovation. Our systems have had it coming for a long time, and now
    it’s time to cut them loose. Many parts of the world have already done this, and
    we all need to jump on that wagon before it passes us by.


    Often I am confronted by some of my friends, colleagues, and acquaintances about
    my strong support for decentralized blockchain technology. Why, they ask me, do
    I feel so strongly about blockchains? Well, I could give them all of the brilliant
    examples that we have discussed, but I know they wouldn’t be convinced because,
    most of the time, they are looking for the thing that motivates me personally,
    at the very core of my existence. So, I tell them, I’d rather remind them of a
    little story. Allow me to remind you, too.


    Long ago, in a land known as America, 13 of the British colonies resolved to fight
    oppression like never before, and guess what:: they won! But, it is also interesting
    how their ideas of independence were restricted to the lives that were led by
    others like themselves. The heroes that were once hailed have now been heavily
    criticized, too, for promoting oppression through slavery, themselves. It was
    then the Abolitionist allies that ended this age-old oppression and brought a
    whole new meaning to the word ‘liberty.’


    Having said that, though, reality—as it unfolds—can hardly ever be put into neat
    and clean boxes; and, it is also necessary to acknowledge and appreciate these
    nuances as we shape our perceptions. I have always believed that though the founding
    fathers have now come under fire for their pro-slavery behaviors and justifiably
    so, at least to some extent), they were also the men who wrote the Constitution
    after the Declaration of Independence which eventually strengthened the ideology
    of the Abolitionist movement. Thomas Sowell, in one of his interviews, talks about
    how slavery became a point of contention only because of the founding documents
    when the United States were created; before that, slavery had been rampant throughout
    cultures and civilizations.


    The problem, often, is that the struggles that we have led over the years, decades,
    and centuries have often been tainted by our immediate experience—limited by our
    own political beliefs, social classes, gender, cultural biases, and so on—rather
    than our experience as a whole: as the humankind. When the founding fathers fought
    for their freedom, they were ignorant of the freedoms of their fellow African
    American citizens. I urge you to ask yourself if, today, each one of us is being
    ignorant of the pain points of our lesser privileged counterparts out there in
    other parts of the world. I urge you to reflect on whether, "Oh it didn’t really
    matter to me, so why would I bother about someone miles away?" is something that
    you will proudly tell your next generation someday when they question you. And,
    mind you, they will question us!


    The times that we live in right now demand that we change our definitions about
    freedom. Remember that you have the right to choose your own definition. It may
    not be the same as mine, but it has every right to exist just like mine does.
    Today, we are dealing with a different kind of a freedom struggle. With cancel
    culture and censorship at the peak, today we are all slaves to one central authority
    telling us what to do. We are being ruled by centralized powers and we don’t even
    know it. Just like the sacrificial lamb who is fed a feast before the sacrifice,
    we are living our comfortable lives in our own little cocoons that these central
    powers have built for us. We are wrongly led to believe that we are the ones in
    power, when nothing could be farther from truth.


    Coming back to the question I am asked, the reason I support blockchains so strongly
    is that I love my freedom; I love my ability to disagree and debate with someone
    with another belief system. And, blockchains come closest to this truth. Decentralized
    blockchain solutions give you the power in the truest sense, if you are willing
    to take it.


    And, believe it or not, the decentralization that blockchains propose so fiercely
    is not a new idea, at all. It has been around since the time our ancestors fought
    the British rule, when we showed the fiery courage to break the shackles of slavery,
    and also as we continue to struggle with the discrimination based on gender, ethnicity,
    social class, and so on. I truly believe blokchain technology can do for the injustices
    in our society what our founding fathers did to colonization and the Abolitionists
    did to slavery. We are on the cusp of making history yet again, and it is up to
    you to decide whether you wish to participate or not.

