    \ security of data; instead, it makes the data perfectly transparent and puts\
    \ it right in the view of everyone on the network, thereby eliminating the possibility\
    \ of malpractice, altogether. \n\nTo understand the importance of this system,\
    \ we need to first look at how it differs from traditional transactions. Again,\
    \ the impact is much more apparent in third-world countries. Blockchains tend\
    \ to digitize the transactions which are tremendously regulated and, ironically,\
    \ still reeking of corruption. It is said that when the Afghan soldiers started\
    \ receiving their salaries through the digital medium, they actually thought they\
    \ had received a raise in their pay. It turns out there was no raise; they were\
    \ only receiving what was rightfully their own, only now their superiors didn’t\
    \ have the opportunity to skim off their own cuts from the salaries of the subordinates—hence,\
    \ the increase in the amount received. If mere digitization can bring that kind\
    \ of a financial change, imagine what a fully transparent blockchain system could\
    \ do, in this context. \n\n## Why Blockchains?\n\nThe happenings in Afghanistan\
    \ are a living proof of how blockchains can empower impoverished countries, one\
    \ community at a time. As Afghans struggle with the shortage of cash, and Taliban\
    \ severely limits bank withdrawals, the community has been receiving aid in the\
    \ form of crypto. Combine the economic collapse with the oppressive policies of\
    \ the Taliban; people, especially women, have been laid off and driven into poverty.\
    \ However, as reported in one of their news reports, Business Insider talks about\
    \ the inspiring story of Fereshteh Forough and her venture Code to Inspire, as\
    \ they take on the crypto-for-a-cause journey.\n\nYou might be pondering why I\
    \ keep going back to the third world context over and over again. I want to remind\
    \ you that, while for a first-world citizen blockchain may simply seem like a\
    \ hybrid version of digitization, for the communities in underdeveloped countries,\
    \ it is something that can flip their entire functioning for the better. That\
    \ is what we need to emphasize when having the blockchain conversation. \n\nKeeping\
    \ this in mind: Let’s talk about why you should care about blockchains and what\
    \ this technology brings for you as a stakeholder. In a world where your identity\
    \ is becoming more and more virtual, the basic principles of blockchain technology\
    \ are increasingly relevant to all of our existence. \n\n### Distributed Power\n\
    \nThe American author Edward Abbey once said, \"Power is always dangerous. Power\
    \ attracts the worst and corrupts the best\" (Edward Abbey Quotes, n.d.). There\
    \ is something about power that makes mankind lust after it. Is it the sheer influence\
    \ that can be exerted over another, or is it the fact that you hold the destiny\
    \ of another in your hands, even if for the slightest moment? Whatever it is,\
    \ history reminds us, time and again, that concentration of power in one entity\
    \ is never a good idea. I have often seen people argue about their preferred political\
    \ side with almost misguided reverence. Though there is nothing wrong with adherence\
    \ to certain political beliefs, most people fail to realize that concentrating\
    \ power in the hands of one person or one party can lead to infinite corruption\
    \ of the political values of those involved. \n\nImagine leaving the most crucial\
    \ decisions of global economic value to the supposed good nature of those in power.\
    \ Consider this for a moment: What if your boss called you in one day and told\
    \ you that your fate at the company depended on one and one thing only. Imagine\
    \ they pointed to a two-year-old in one corner of the room, in front of whom a\
    \ bowl of candies is placed. Whether or not the child eats the candy determines\
    \ if you stay or go, respectively. Sounds ridiculous, doesn’t it? It’s a child\
    \ after all; they are bound to be tempted to eat the candy sooner or later! How\
    \ can that be a determining factor for your career?\n\nWithout a doubt, it’d be\
    \ an absurdly laughable system; yet, we seem to have no problem following it on\
    \ a global level. Confused? Here it goes: The state and financial authorities\
    \ that we have had traditionally are no different from the toddler greedily staring\
    \ at the bowl of candy—that’s power. If we leave it upto them, they will sooner\
    \ or later devour the power without the slightest thought for the people’s welfare.\
    \ Isn’t that what happened during the `2008 crisis`? The institutions that the\
    \ people had trusted all along to do the right thing failed, leaving the people\
    \ to pick up pieces of their shattered lives. And, might I add, even after that\
    \ debacle, even after getting bailed out by the government using the taxpayers’\
    \ money, the financial institutions have learned nothing. They continue to make\
    \ the same mistakes, pushing people into suffering over and over.\n\nOn the contrary,\
    \ the blockchains diffuse this power to the extent that no one entity makes the\
    \ rules. The power is distributed to all of the stakeholders, thereby allowing\
    \ for practically no opportunities for corruption. They use the distributed ledger\
    \ system that lets the peer-to-peer network self-regulate in a way that diffuses\
    \ the power component and amplifies the well-being component.\n\nTake the example\
    \ of the outrage that the Indian farmers peacefully exhibited at the introduction\
    \ of the new farm laws. These new farm laws, which were repealed after the massive\
    \ protests throughout the country, were seen as deregularizing trade of agricultural\
    \ crop. The `Minimum Selling Price` was replaced with a vague `guaranteed price`.\
    \ The Farmers worried that they would now be unable to get the price they deserved.\n\
    \nWithout going into the details too much, the amendments to the farm laws were\
    \ seen as oppressive as they likely meant that the big corporations could stock\
    \ the crop limitlessly and farmers would have to accept the price that these corporations\
    \ quoted. Though there was the argument that this would benefit the farmers by\
    \ allowing them to sell their crop without restriction and interference, the farmers\
    \ protested because there was no guarantee that whatever the government proposed\
    \ would actually happen. In this case, wouldn’t it be great if the farm contracts\
    \ could be implemented with full guarantee and if the transactions were hack-proof,\
    \ because there were multiple peers on the blockchain monitoring the situation?\
    \ That is the significance of distributed power in this technology.\n\n### Networked\
    \ Integrity\n"
  trans: '

    当你想到数据库时，你可能会想到类似于 Excel 表格的东西，包含完整的行和列。现在，区块链比这稍微复杂一些。它们以前被称为“区块链”，存储数据的方式不是在行和列中，而是存储在区块中。这些区块在数字上连接起来，随着越来越多的交易发生和更多数据的产生，区块不断添加到数字链中。把这想象成一个文件柜抽屉：一旦抽屉装满了文件，你就关上它并移动到下一个抽屉。同样，在区块链中，区块只能容载特定数量的数据。一旦达到限制，它们就会被关闭并与上一个区块链接。


    然而，文件柜类比与区块链之间的关键区别在于，对于前者，你总是可以回去重新洗牌文件。而对于后者，随着数据不断存储在区块中，这些区块创建了一个不可逆转的时间线，这意味着回溯并更改记录细节是不可能的。每个区块在成为数字链条的一部分时，都会获得一个精确且唯一的时间戳。


    区块链使用点对点网络允许数字信息的记录和分发，而不会让那些臭名昭著的元素以此任何方式编辑或复制数据。简单来说，这项技术并不认为秘密等同于数据安全；相反，它让数据变得完全透明，并将其置于网络上每个人的面前，从而从根本上消除了违规的可能性。


    要理解这个系统的重要性，我们首先需要看看它与传统交易的不同。同样，这种影响在第三世界国家为明显。区块链倾向于将那些受到严格监管但讽刺的是仍然充斥着腐败的交易数字化。据说当阿富汗士兵开始通过数字媒体领取薪水时，他们真的以为自己加薪了。事实证明并没有加薪；他们只是收到了本属于自己的东西，现在他们的上级没有机会从下属的薪水中抽走自己的那份了——因此，收到的金额增加了。如果仅仅是数字化就能带来那种财务变化，想象一下在这种背景下，一个完全透明的区块链系统能做什么。


    ## 为什么选择区块链？


    阿富汗发生的事情生地证明了区块链如何一个一个社区地赋能贫困国家。当阿富汗为现金短缺而挣扎，塔利班严重限制银行取款时，社区一直在以加密货币的形式接受援助。经济崩溃与塔利班的压迫政策相结合；人们（尤其是女性）被失业并陷入了贫困。然而，正如其中一份新闻报道所报道，《商业内幕》讲述了
    Fereshteh Forough 和她的创业项目 Code to Inspire 令人鼓舞的故事，他们开启了一段“以加密货币助力事业”的旅程。


    你可能在想，为什么我一次又一次回到第三世界的背景。我想提醒你，虽然对于第一世界的公民来说，区块链可能看起来只是数字化的某种混合版本，但对于欠发达国家的社区来说，它是可以改变他们整个运作模式并使其更好的。。这就是我们在讨论区块链时需要强调的。


    记住这一点：让我们聊聊为什么你应该关注区块链，以及这项技术作为利益相关者能给你带来什么。在一个你的身份变得越来越虚拟的世界里，区块链技术的基本原理对我们所有人的生存都变得越来越相关。


    ### 分布式权力


    美国作家爱德华·阿比（Edward Abbey）曾说：“权力总是危险的。权力吸引最坏的人，并腐蚀最最好的人”（Edward Abbey Quotes, n.d.）。权力中某些东西让人类对其垂涎。是因为对他人施加的纯粹影响力，还是因为你手中掌握着另一个人的命运，即使只有瞬间？无论如何，历史一次一次地提醒我们，权力集中在一个实体手中绝不是一个好主意。我经常看到人们带着近乎误解的虔诚态度争论他们偏好的政治派别。虽然固守某些政治信仰没有错，但大多数人没有意识到，将权力集中在一个个人或一个政手中会导致相关人员政治价值观的无限腐败。


    想象一下，将全球经济价值最关键的决策交给掌权者所谓的良性。考虑一下：如果你的老板某天叫你进去，告诉你你在公司的命运完全取决于且仅取决于一样呢？想象他们指向房间角落的一个两岁孩子，孩子面前放着一碗糖果。孩子吃不吃糖决定了你是留是走。这听起来很荒谬，不是吗？毕竟这是一个孩子；他们迟早会受到诱惑去吃糖！那怎么能成为你职业的决定因素呢？


    毫无疑问，那是一个荒谬可笑的系统；然而，我们似乎在全球范围内遵循它并没有问题。困惑吗？重点来了：我们传统上拥的国家和金融当局与贪婪盯着糖果碗的幼儿并无异——那就是权力。如果我们听任他们的，他们早晚会吞噬权力，而完全不考虑人民的福祉。这不就是
    `2008 危机` 期间发生的情况吗？人们一直信任会做正确事的机构失败了，让人们去收拾他们破碎生活的残骸。而且，我必须补充一点，即使在那场惨剧之后，即使在政府使用纳税人的钱进行救助之后，金融机构也没有学到任何教训。他们继续犯同样的错误，一次又将人们推入痛苦。


    相反，区块链分散了这种权力，以至于没有任何实体制定规则。权力分配给所有利益相关者，因此几乎没有腐败的机会。它们使用分布式账本系统，让点对点网络进行自我调节，从而分散了权力因素并放大了福祉因素。


    以印度农民对新农法案表现出的和平抗议为例。这些新农法案（在全国范围内大规模抗议后被撤销）被视为对农产品贸易去监管化。`最低销售价格` 被模糊的`保证价格`
    所取代。农民担心他们现在无法获得应得的价格。


    ### 网络诚信


    '
