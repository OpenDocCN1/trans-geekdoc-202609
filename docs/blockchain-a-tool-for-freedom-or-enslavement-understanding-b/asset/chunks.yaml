- raw: "We have all known the critical nature of ledgers for businesses for a long\
    \ time. Distributed ledgers take those ledgers to a whole new level. They make\
    \ decentralization on blockchains possible. The technical details we discussed\
    \ earlier—complete with nodes, blocks, hash, and nonce—make up the distributed\
    \ ledgers. These are the databases that are shared, duplicated, and synchronized\
    \ across blockchains, thus accounting for a uniquely transparent system. Any read\
    \ on blockchains would be incomplete without distributed ledger technology, often\
    \ abbreviated as DLT. But, what most people don’t realize is distributed ledgers\
    \ are not the same as blockchains. While all blockchains require DLT, not all\
    \ distributed ledgers are in the form of blocks and chains. There are multiple\
    \ types of DLT. For instance, Tangle is a form of DLT used in Internet of Things,\
    \ or IoT, applications. \n\nDue to their ability to record data securely and transparently\
    \ on multiple nodes without the need for third-party monitoring, these distributed\
    \ ledgers have the power to drastically reduce transaction and settlement times\
    \ from days to minutes. Remember the example of the distressed Indian man who\
    \ wanted to send money urgently to his hometown? This is the part of the blockchain\
    \ that would allow him to do it with absolute ease. These ledgers also eliminate\
    \ the need to reconcile records from various sources, thereby reducing both time\
    \ and effort.\n\nAs you can see, DLT is a truly remarkable innovation; but, for\
    \ this to fulfill its potential for an impactful implementation, it needs the\
    \ help of what are known as smart contracts. \n\n### Smart Contracts\n\nSmart\
    \ contracts can be thought of as programs on a blockchain that are designed to\
    \ run only if and when certain prior criteria are met. Think of a combination\
    \ locker. Only when the combination of the numbers is perfect will it be unlocked.\
    \ Let’s say you forget even one number—you are locked out. Smart contracts are\
    \ like that, but the conditions are not numbers but some sort of clauses that\
    \ would either activate or deactivate the agreement between the involved parties.\
    \ Again, since the process is automated, there would be no need for an intermediary\
    \ to oversee the proceedings. \n\nLet’s look at an example of how smart contracts\
    \ can make life much easier, especially for disadvantaged groups. It is a well-known\
    \ fact that land registration and titling systems in Africa can play a significant\
    \ role in the empowerment of the poor. However, these systems are so strained\
    \ that the process can be often too tedious to be taken up by, let’s say, a poor\
    \ uneducated farmer. To top this, the trust in legal institutions is likely to\
    \ have suffered due to the corruption that’s rampant in the offices. Smart contracts\
    \ act like a simple solution—the various steps in the registration process—like\
    \ checking for registry of the land in government records, inspection of the property,\
    \ and so on—can be written into the code of these blockchains, thereby minimizing\
    \ the chance for errors, as well as corruption. \n\nThe communities that are frequently\
    \ disrupted by natural disasters (like hurricanes, earthquakes, etc.) can also\
    \ live an anxiety-free life as they don’t need to constantly worry about the safety\
    \ of their records. For example, in 2010 in Haiti, an earthquake destroyed the\
    \ homes and government archives alike, leaving millions homeless physically, as\
    \ well as legally. Something like this can be avoided with smart contracts on\
    \ blockchains. Since the records on the blockchains are stored as multiple copies\
    \ throughout the world, they can claim their rightful ownership to properties\
    \ despite the catastrophic loss. \n\n## Types of Blockchains\n\nA Yahoo!Finance\
    \ report in February 2022 mentioned that Google CEO Sundar Pichai is \"looking\
    \ to help build Web3, blockchain products.\" If this conglomerate is catching\
