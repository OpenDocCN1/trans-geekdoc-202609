- raw: "Here, we specifically focus on sectors and projects that are bringing that\
    \ change to you, not solely for profits but for social good. Be it in India—where\
    \ a firm called ConsenSys ventures working with a government think tank called\
    \ Niti Ayog to streamline land ownership records, or Pan-Impact Korea—which utilizes\
    \ social impact bonds with blockchain technology to make sure that payments are\
    \ released only when the desired social outcomes are met, or 191 other blockchain\
    \ projects across the globe according to a report from Stanford Centre for Social\
    \ Innovation in 2018: all of these are examples of how entrepreneurs are blending\
    \ profits, social outcomes, and blockchain technology in the most elegant manner\
    \ possible. Such projects mushrooming even more in the past couple of years are\
    \ only an evidence of the coming of age of technology, and that’s nothing but\
    \ good news for us.\n\nIt’s not all business, either. In 2021, Vitalik Buterin,\
    \ the Ethereum co-founder we spoke of earlier, donated $1 billion worth of cryptocurrency\
    \ to the Covid-Crypto Relief Fund in India (Terrapass, 2021). The transaction\
    \ was as transparent as could be, and is only a testament to the ease and transparency\
    \ with which blockchain transactions occur. But again, let’s not get caught up\
    \ in these isolated projects and events, because blockchains for social good have\
    \ shaped up to be much more than what may seem like a one-in-a-hundred instance.\n\
    \n## Blockchains for Small Players\n\nTill now, we have only looked at blockchains\
    \ in the context of big players (like Cardano, for instance) and how they are\
    \ using it for creating the much needed social impact. We will get back to blockchains\
    \ in Africa and the social impact in the next chapter; but, here, what I want\
    \ you to remember is that blockchains are not a distant technology. Blockchains\
    \ are just as much for you and me as they are for the big tech industries, as\
    \ well as the third world countries.\n\n### Helping the Small Entrepreneurs\n\n\
    Fighting against the big brands has always been a pain point for small businessmen.\
    \ The accelerating consumerism often has us running behind the commercial brands\
    \ rather than local businesses. Though multiple initiatives have been taken in\
    \ the past to boost small businesses, none seem to have had a lasting impact.\
    \ Blockchains can help the new businesses by leapfrogging to allow them to compete\
    \ in the same space. \n\nA massive advantage of blockchains for small players\
    \ is that they utilize much of existing infrastructure, rather than demanding\
    \ that new setups be built from scratch. These new entrepreneurs have the option\
    \ of using the pre-built blockchains on the open-source platforms like Ethereum,\
    \ Corda, Hyperledger, etc. Of course, they can build these from scratch, too;\
    \ but, with limited resources available to a new entrant in entrepreneurship,\
    \ already functioning blockchain platforms may be particularly appealing. \n\n\
    Large corporations have always had much bigger financial reserves, as well as\
    \ much more sophisticated technology, as compared to local ventures. It’s no secret\
    \ that e-commerce giants like Amazon have torpedoed the industry from all sides,\
    \ making it extremely difficult for small business owners to even survive, let\
    \ alone thrive. Blockchains have the potential to level the playing field, at\
    \ least to some degree. In fact, when it comes to implementing blockchains, the\
    \ freedoms afforded by both the attitudinal openness of a start-up, as well as\
    \ the flexibility of setting protocols and standards, upcoming projects might\
    \ just be better suited for this technology. \n\nBlockchains have the potential\
    \ to level the playing field for small players like never before. This is especially\
    \ true in the context of information asymmetry that has always hampered the growth\
    \ of small industries. Since these do not have the same tools at their disposal\
    \ as their big counterparts, they have always been at a disadvantage. Blockchains\
    \ practically make the information gap disappear by making all data points readily\
    \ available for assessments. \n\nBlockchains have also revitalized loyalty programs\
    \ to help redirect the customers to these small-scale businesses. Traditionally,\
    \ the loyalty programs have been fraught with confusion, leading to quite low\
    \ redemption rates. Customers tend to be wary of these, especially because of\
    \ the personal data they have to give away. Blockchains offer a way around this,\
    \ as the data is all encrypted safely. Also, from the point of view of the entrepreneurs,\
    \ executing these loyalty programs is much easier, and also much less expensive,\
    \ because of the elimination of all middlemen and transaction costs. Moreover,\
    \ the blockchain mechanism can help prevent fraud with stolen tokens or other\
    \ forms of illicit use. \n\nThere is one more implication that has not yet been\
    \ widely explored, but could change the shopping experience completely. The small\
    \ business owners could come together, forming a sort of local marketplace where\
    \ the blockchain loyalty tokens across businesses could be interlinked, thereby\
    \ allowing the customer to utilize these across the linked businesses without\
    \ hassle. These could prove to be quite a turning point in community-building,\
    \ as the money stays within the community and multiple businesses flourish while\
    \ providing the customer with ease of shopping experience. \n\n### Blockchains\
    \ for Small Farmers\n\nEven as global consumption of produce is only increasing,\
    \ the profits that small farmers make still remain quite slim. Ever wondered why?\
    \ It’s because of the fundamental flaw in the way our systems are structured.\
    \ Some may even argue, and quite rightly so, that our society and the systems\
    \ that it relies on are designed only to make the rich richer and the poor poorer.\
    \ Even the global supply chains in effect today centralize the market power at\
    \ the top, and the stakeholders at the bottom without access to opportunities\
    \ of growth. \n\nTake the simple example of the glamorous and ever-growing chocolate\
    \ industry. Can you guess how much percentage value a small farmer, who grows\
    \ his own cocoa/cacao beans, would receive in the end? Seven percent—yes, that’s\
    \ the percentage of the total value of his production that he receives (Fairfood,\
    \ 2020). This is because of the number of actors involved in the supply chain\
    \ of this raw material that most often spreads over continents. \n\nSeveral initiatives\
    \ have been brought forth to resolve this situation and make life a little easier\
    \ for these small farmers in, let’s say, a place like Africa. Many boutique chocolate\
    \ companies which call themselves bean-to-bar have come up, which focus their\
    \ attention on creating shorter supply chains and giving a greater percentage\
    \ of profits to the farmer directly. These companies sell “ethical chocolate”\
    \ at more premium prices. At this point in time, however, there isn’t a way for\
    \ the consumer to verify if these claims are being fulfilled in reality or not.\
    \ Blockchains provide a simple, yet elegant, resolution by providing instant verification\
    \ of these claims. \n\nThis, however, would only be a part of the problem resolved.\
    \ A much bigger issue is that, often, small farmers do not usually have access\
    \ to finances that would allow them to engage in more calculated risk-taking.\
    \ In the case of the above-mentioned farmers, for instance, since they do not\
    \ have the means to purchase equipment to independently process their cocoa harvest,\
    \ they end up having no leveraging power. They have to harvest whenever the crop\
    \ is ready and sell immediately, for fear of wasting the produce due to over-ripening.\
    \ Imagine what financial empowerment could do for a small farmer like this. "
