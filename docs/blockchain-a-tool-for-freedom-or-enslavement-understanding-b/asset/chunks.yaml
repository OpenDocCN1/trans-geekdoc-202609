- raw: "Patient records are a bone of contention not only in developing nations, but\
    \ well-developed nations, too. Electronic health records give the opportunity\
    \ to consolidate the system in favor of the patient. These electronic records\
    \ can be accessed between various systems and departments at the tap of a button\
    \ on the phone screen. Such interoperability can save the precious time of the\
    \ health professionals, as well as of the patient. Moreover, as we discussed in\
    \ the Africa section as well, this kind of system gives the patient absolute control\
    \ over their own medical data and eliminates the possibility that such data will\
    \ be misused. \n\nWhile this seems to be the most exciting use case in healthcare,\
    \ there are also considerable regulatory checks and scrutiny that the process\
    \ undergoes. However, the pandemic seems to have catalyzed the growth of many\
    \ decentralized applications, or DApps. These have been on the scene for a long\
    \ time, from somewhere around 2014-15, some even before that; but, the pandemic\
    \ has diverted the attention of the common folk to the urgent need for such decentralized,\
    \ secure platforms for maintaining electronic health records. Companies like Ever,\
    \ Patientory, Curisium, Chronicled, and many others provide the user with diverse\
    \ features for health tracking.\n\nAs effective as these services are, they are\
    \ still works in progress. The blockchain dream for healthcare remains one of\
    \ hope, where each individual would be given unique identities for a digital health\
    \ wallet. This would consist of every medication they have ever taken and every\
    \ doctor they have ever consulted in their hometown, on a vacation, or when on\
    \ a business trip—with the option for the patient to add any information they\
    \ may feel necessary. This information would only be opened to access when deemed\
    \ appropriate by the individual. As the blockchain healthcare comes of age, the\
    \ current regulatory concerns are to be resolved for much smoother operations.\n\
    \n## Pharmaceuticals\n\nBlockchains have much wider application testing in the\
    \ pharma-sector than the counterfeit drug tracking we discussed earlier. Let’s\
    \ take a step back here. Have you ever given thought to what happens to the medication\
    \ when you have already recovered? More often than not, the drugs pass their expiry\
    \ date as they lay in your pill cabinet, and get thrown out, eventually. It’s\
    \ not your fault, either, because who would you give it to anyway? \n\nDuring\
    \ the COVID-19 pandemic, the story of a couple who are both doctors in Mumbai,\
    \ India, went viral. As the country battled with the second wave of the virus,\
    \ gross shortages were experienced in the medication realm. This couple decided\
    \ to adopt a very small and basic innovation. They contacted all the people from\
    \ their circles—whoever they knew had been diagnosed with COVID-19 at some point\
    \ (and there were many of those people). The couple then asked them to raid their\
    \ medicine cabinets and see if there were any medications lying around from their\
    \ COVID-19 diagnosis. Turns out, they managed to collect 44 pounds (20 kg) of\
    \ unused medication, which was then distributed among the poor. This is a very\
    \ minuscule operation, and it worked because it was a small-scaled mission. Due\
    \ to the multiple moving parts in the collection and distribution, it could have\
    \ gotten pretty messy. Or could it?\n\nBlockchains are helping pharmacies do the\
    \ exact same thing on a much larger scale. Good Shepherd Pharmacy, a non-profit\
    \ pharmacy, partnered with FedEx Institute of Technology at the University of\
    \ Memphis and Lipscomb University in Nashville, to create a blockchain-powered\
    \ supply chain to pick up donated drugs from around the area. This includes oral\
    \ chemotherapy drugs that have not been used. The donors only have to go to the\
    \ app RemediChain and donate them on the interface over their phones. These can\
    \ then be distributed among those that are not able to afford such expensive drugs.\n\
    \n## Medical Equipment\n\nAn exciting arena, that was only a medical fantasy a\
    \ few years ago but has now boomed into a big industry, is the Internet of Medical\
    \ Things (IoMT). This includes the interplay between multiple medical equipment:\
    \ some that are used in patient care—like bedside monitors, ventilators, etc.—and\
    \ others that are part of our daily health tracking—like smartwatches, fitness\
    \ trackers, and so on. Blockchains have been playing a tremendous role in this\
    \ setup, as well. \n\nA centralized approach to IoMT can be time-consuming, and\
    \ even hazardous. Imagine a situation like this: A hospital has several branches\
    \ where the devices have been sourced from a particular company. Now, the performance\
    \ of each device at each hospital is tracked and analyzed back at the headquarters\
    \ of the device company. For the time-sensitive information to be relayed back\
    \ to the hospital utilizing the device could take days, even weeks. All the while,\
    \ the patients have been exposed to danger and the hospital is liable to be sued.\
    \ Such a system helps no one. Instead, on a blockchain, the verification and the\
    \ relaying of the information is quick, and the time gap is bridged, to a great\
    \ extent. \n\nThe National Healthcare System (NHS) in Scotland ran a blockchain\
    \ pilot to resolve these issues. They found that not only was this system much\
    \ more efficient in relaying information, it also gave each hospital the advantage\
    \ of knowing the real-time location of the device. It even provided them with\
    \ the data about the personnel operating these devices—their qualifications, certifications,\
    \ experience, and so on. Such data is extremely relevant when assessing, for instance,\
    \ the performance of a new device. If the personnel aren’t properly trained to\
    \ operate the device, the performance could be quite off and the data entirely\
    \ flawed. If, at all, the device performance is problematic despite other things\
    \ being as they should be, then it may mean that a recall needs to be initiated.\
    \ And, it’s only logical that the faster the data recall, the lesser the loss.\
    \ Blockchains make these faster recalls possible.\n\n## Credentialing Protocols\n\
    \nIn healthcare, credentialing refers to something like an audit of the health\
    \ practitioner’s qualifications. In order for a doctor to be able to treat patients,\
    \ this protocol must be fulfilled when they enter a new facility. There are regular\
    \ checks, too, that are organized to keep the information updated. This is a regulation\
    \ that the hospitals must meet in order to safeguard the interests of the patients,\
    \ as well as secure the reputation of the hospital. But, as useful as these may\
    \ be, they are also tedious—requiring the hospitals to maintain, assess, and verify\
    \ multiple records while the doctors wait to see them ,despite their qualifications.\
    \ \n\nMoreover, the cost of the upkeep is too high and redundant, because all\
    \ the hospitals across the board are doing the same thing but in separate silos,\
    \ which doesn’t make sense. For instance, if one doctor moves from one hospital\
    \ to another, the same procedure has to be completed all over again. This can\
    \ be taken care of by a common system contributed to by all hospitals. This system\
    \ can even be used as a healthcare provider directory. \n\nThe Synaptic Health\
    \ Alliance that brings together various companies in healthcare—Aetna, Humana,\
    \ Quest Diagnostics, UnitedHealth, etc.—use blockchains solutions for information-sharing\
    \ across the companies. Each of these companies have their own providers, and\
    \ pooling in the resources is much more practical and useful, both for the healthcare\
    \ providers as well as the patients. Professional Credentialing Exchange (ProCredEx)\
    \ has partnered with Hashed Health to initiate yet another blockchain-driven platform\
    \ that can obtain and verify information from several independent sources. Their\
    \ work has been so impressive that it has found a user in the form of the Texas\
    \ Health Care System."
  fmt: '

    Patient records are a bone of contention not only in developing nations, but well-developed
    nations, too. Electronic health records give the opportunity to consolidate the
    system in favor of the patient. These electronic records can be accessed between
    various systems and departments at the tap of a button on the phone screen. Such
    interoperability can save the precious time of the health professionals, as well
    as of the patient. Moreover, as we discussed in the Africa section as well, this
    kind of system gives the patient absolute control over their own medical data
    and eliminates the possibility that such data will be misused.


    While this seems to be the most exciting use case in healthcare, there are also
    considerable regulatory checks and scrutiny that the process undergoes. However,
    the pandemic seems to have catalyzed the growth of many decentralized applications,
    or `DApps`. These have been on the scene for a long time, from somewhere around
    2014-15, some even before that; but, the pandemic has diverted the attention of
    the common folk to the urgent need for such decentralized, secure platforms for
    maintaining electronic health records. Companies like `Ever`, `Patientory`, `Curisium`,
    `Chronicled`, and many others provide the user with diverse features for health
    tracking.


    As effective as these services are, they are still works in progress. The blockchain
    dream for healthcare remains one of hope, where each individual would be given
    unique identities for a digital health wallet. This would consist of every medication
    they have ever taken and every doctor they have ever consulted in their hometown,
    on a vacation, or when on a business trip—with the option for the patient to add
    any information they may feel necessary. This information would only be opened
    to access when deemed appropriate by the individual. As the blockchain healthcare
    comes of age, the current regulatory concerns are to be resolved for much smoother
    operations.


    ## Pharmaceuticals


    Blockchains have much wider application testing in the pharma-sector than the
    counterfeit drug tracking we discussed earlier. Let’s take a step back here. Have
    you ever given thought to what happens to the medication when you have already
    recovered? More often than not, the drugs pass their expiry date as they lay in
    your pill cabinet, and get thrown out, eventually. It’s not your fault, either,
    because who would you give it to anyway?


    During the `COVID-19` pandemic, the story of a couple who are both doctors in
    Mumbai, India, went viral. As the country battled with the second wave of the
    virus, gross shortages were experienced in the medication realm. This couple decided
    to adopt a very small and basic innovation. They contacted all the people from
    their circles—whoever they knew had been diagnosed with `COVID-19` at some point
    (and there were many of those people). The couple then asked them to raid their
    medicine cabinets and see if there were any medications lying around from their
    `COVID-19` diagnosis. Turns out, they managed to collect 44 pounds (20 kg) of
    unused medication, which was then distributed among the poor. This is a very minuscule
    operation, and it worked because it was a small-scaled mission. Due to the multiple
    moving parts in the collection and distribution, it could have gotten pretty messy.
    Or could it?


    Blockchains are helping pharmacies do the exact same thing on a much larger scale.
    `Good Shepherd Pharmacy`, a non-profit pharmacy, partnered with `FedEx Institute
    of Technology` at the `University of Memphis` and `Lipscomb University` in Nashville,
    to create a blockchain-powered supply chain to pick up donated drugs from around
    the area. This includes oral chemotherapy drugs that have not been used. The donors
    only have to go to the app `RemediChain` and donate them on the interface over
    their phones. These can then be distributed among those that are not able to afford
    such expensive drugs.


    ## Medical Equipment


    An exciting arena, that was only a medical fantasy a few years ago but has now
    boomed into a big industry, is the Internet of Medical Things (`IoMT`). This includes
    the interplay between multiple medical equipment: some that are used in patient
    care—like bedside monitors, ventilators, etc.—and others that are part of our
    daily health tracking—like smartwatches, fitness trackers, and so on. Blockchains
    have been playing a tremendous role in this setup, as de.


    A centralized approach to `IoMT` can be time-consuming, and even hazardous. Imagine
    a situation like this: A hospital has several branches where the devices have
    been sourced from a particular company. Now, the performance of each device at
    each hospital is tracked and analyzed back at the headquarters of the device company.
    For the time-sensitive information to be relayed back to the hospital utilizing
    the device could take days, even weeks. All the while, the patients have been
    exposed to danger and the hospital is liable to be sued. Such a system helps no
    one. Instead, on a blockchain, the verification and the relaying of the information
    is quick, and the time gap is bridged, to a great extent.


    The National Healthcare System (`NHS`) in Scotland ran a blockchain pilot to resolve
    these issues. They found that not only was this system much more efficient in
    relaying information, it also gave each hospital the advantage of knowing the
    real-time location of the device. It even provided them with the data about the
    personnel operating these devices—their qualifications, certifications, experience,
    and so on. Such data is extremely relevant when assessing, for instance, the performance
    of a new device. If the personnel aren’t properly trained to operate the device,
    the performance could be quite off and the data entirely flawed. If, at all, the
    device performance is problematic despite other things being as they should be,
    then it may mean that a recall needs to be initiated. And, it’s only logic that
    the faster the data recall, the lesser the loss. Blockchains make these faster
    recalls possible.


    ## Credentialing Protocols


    In healthcare, credentialing refers to something like an audit of the health practitioner’s
    qualifications. In order for a doctor to be able to treat patients, this protocol
    must be fulfilled when they enter a new facility. There are regular checks, too,
    that are organized to keep the information updated. This is a regulation that
    the hospitals must meet in order to safeguard the interests of the patients, as
    well as secure the reputation of the hospital. But, as useful as these may be,
    they are also tedious—requiring the hospitals to maintain, assess, and verify
    multiple records while the doctors wait to see them ,despite their qualifications.


    Moreover, the cost of the upkeep is too high and redundant, because all the hospitals
    across the board are doing the same thing but in separate silos, which doesn’t
    make sense. For instance, if one doctor moves from one hospital to another, the
    same procedure has to be completed all over again. This can be taken care of by
    a common system contributed to by all hospitals. This system can even be used
    as a healthcare provider directory.


    The `Synaptic Health Alliance` that brings together various companies in healthcare—`Aetna`,
    `Humana`, `Quest Diagnostics`, `UnitedHealth`, etc.—use blockchains solutions
    for information-sharing across the companies. Each of these companies have their
    own providers, and pooling in the resources is much more practical and useful,
    both for the healthcare providers as well as the patients. Professional Credentialing
    Exchange (`ProCredEx`) has partnered with `Hashed Health` to initiate yet another
    blockchain-driven platform that can obtain and verify information from several
    independent sources. Their work has been so impressive that it has found a user
    in the form of the `Texas Health Care System`.

    '
  trans: '

    患者记录不仅在发展中国家是争议焦点，在发达国家也是如此。电子健康记录为从有利于患者的角度出发来整合系统提供了机会。只需在手机屏幕上轻轻点一下，即可在各种系统和部门之间访问这些电子记录。这种互操作性可以节省医疗人员以及患者的宝贵时间。此外，正如我们在非洲章节中讨论的那样，这种系统让患者对自己的医疗数据拥有绝对控制权，并消除了此类数据被滥用的可能性。


    虽然这似乎是医疗保健领域最令人兴奋的场景，但该过程也经历了大量的监管检查和审查。然而，疫情似乎催化了许多去中心化应用（或 `DApps`）的增长。这些应用已经存在很久了，大约从
    2014-15 年左右，有些甚至更早；但疫情将普通大众的注意力转向了对这种去中心化、安全的电子健康记录平台的紧迫需求。`Ever`、`Patientory`、`Curisium`、`Chronicled`
    等许多公司为用户提供了多样的健康追踪功能。


    尽管这些服务非常有效，但它们仍处于进行阶段。医疗保健领域的区块链梦想仍然是一个希望，每个个人都将获得用于数字健康钱包的唯一身份。这将包括他们服用过的每种药物，以及他们在家乡、度假地或出差期间咨询过的每位医生——患者还可以根据需要添加任何他们认为有必要的信息。这些信息仅在个人认为恰当时才会开放访问。随着区块链医疗保健的成熟，目前的监管担忧将得到解决，以实现更顺畅的运行。


    ## 药物行业


    区块链在制药领域的应用测试比我们之前讨论的假药追踪要广泛得多。让我们退后一步来看。你是否想过，当你已经康复后，药物会发生什么？通常情况下，药物躺在你的药柜里超过了过期日期，并最终被扔掉。这也不是你的错，因为反正你又把它们送给谁呢？


    在 `COVID-19` 疫情期间，一对在印度孟买的医生夫妇的故事传遍了网络。当该国家与病毒的第二波浪斗争时，药品领域经历了严重的短缺。这对夫妇决定采用一种非常小且基础的创新。他们联系了圈子里的所有人——只要他们认识的人曾被诊断为患
    `COVID-19`（这类人有很多）。这对夫妇随后要求他们翻遍药柜，看看是否有因诊断 `COVID-19` 而留下的药物。结果证明，他们成功收集了 44 磅（20
    公斤）未使用的药物，并将其分给了穷人。这是一个非常微小的行动，它之所以成功是因为它是一项小规模的任务。由于收集和分发过程中涉及多个环节，这可能会变得非常混乱。又可能呢？


    区块链正在帮助药店在更大的规模上做同样的事情。非营利药店 `Good Shepherd Pharmacy` 与孟菲斯大学的 `FedEx Institute
    of Technology` 以及纳什维尔的 `Lipscomb University` 合作，建立了一个由区块链驱动的供应链，用于从该地区收集捐赠的药物。这包括未使用的口服化疗药物。捐赠者只需前往
    `RemediChain` 应用，并在手机界面上进行捐赠即可。这些药物随后可以分发给那些负担不起此类昂贵药物的人。


    ## 医疗设备


    一个令人兴奋的领域，几年前还只是医疗幻想，但现在已蓬勃发展为一个大行业，医疗物联网（`IoMT`）。这包括多种医疗设备之间的相互作用：一些用于患者护理——如床边监护仪、呼吸机等；另一些则是我们日常健康追踪的一部分——如智能手表、健身追踪器等。区块链在这一设置中发挥了巨大的作用。


    `IoMT` 的中心化方法可能非常耗时，甚至是危险的。想象这样一种情况：一家医院有几个分院，设备源自某特定公司。现在，每台设备在每家医院的性能都会在设备公司的总部进行跟踪和分析。对于时间敏感的信息，回传到使用该设备的医院可能需要几天甚至几周时间。在此期间，患者暴露在危险之中，医院可能面临诉讼风险。这样的系统对谁都没有帮助。相反，在区块链上，信息的验证和传输是快速的，在很大程度上弥补了时间间隔。


    苏格兰的国家医疗服务体系（`NHS`）运行了一项区块链试点来解决这些问题。他们发现，该系统在传输信息方面不仅高效得多，还让每家医院拥有了设备实时位置的优势。它甚至为他们提供了操作这些设备的人员数据——他们的资质、证书、经验等。在评估例如新设备的设备的性能时，这些数据极其相关。如果人员没有经过适当培训来操作设备，性能可能会非常偏差，数据完全是错误的。如果尽管其他方面都正常，设备性能仍然存在问题，那么可能意味着需要启动召回。逻辑是，数据召回越快，损失就越小。区块链让这些快速的召回成为可能。


    ## 认证协议


    在医疗保健领域，认证是指对医疗执业人员资质的审核。为了让医生能够治疗患者，当他们进入新机构时必须履行这一协议。还有定期的检查，以保持信息更新。这是医院必须遵守的法规，以维护患者利益，并确保医院的声誉。但尽管这些方法很有用，但它们也很繁琐——需要医院维护、评估和验证多份记录，而医生则在等待这些结果。


    此外，维护成本太高且冗余，因为所有的医院都在做相同的事情，但是在各自孤岛中进行的，这没有意义。例如，如果一个医生从一家医院搬到另一家，同样的程序必须重新完成。这可以通过所有医院共同提供的统一系统来解决。该系统甚至可以作为医疗提供者目录。


    汇聚了医疗保健领域各种公司（`Aetna`、`Humana`、`Quest Diagnostics`、`UnitedHealth` 等）的 `Synaptic
    Health Alliance` 使用区块链解决方案进行跨公司的信息共享。这些每家公司都有自己的提供者，整合资源对于医疗提供者和患者来说都更加实用有用。专业认证交易所（`ProCredEx`）与
    `Hashed Health` 合作，启动了另一个区块链驱动的平台，可以从多个独立来源获取并验证信息。他们的工作非常令人印象深刻，已经以 `Texas Health
    Care System` 的形式找到了用户。

    '
