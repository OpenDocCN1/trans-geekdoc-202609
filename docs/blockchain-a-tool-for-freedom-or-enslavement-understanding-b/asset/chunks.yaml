- raw: "When Satoshi brought about the bitcoin, they brought to the fore the rebellion\
    \ that was going on for quite a while now behind the computer screens: the movement\
    \ of crypto anarchy. We cannot fully understand blockchains unless we understand\
    \ crypto anarchy. Blockchains might just be the missing link that connects this\
    \ underground movement to the practical life applications. And, that’s why I say\
    \ blockchains might just be the beginning of a new revolution in history.\n\n\
    ## Roaming the Dark Screens of Crypto Anarchy\n\nThere is a myth in Greek mythology\
    \ about soulmates that humans were initially born with four arms, four legs, and\
    \ two heads—two individuals in one body—until Zeus, in one of his angry fits,\
    \ separated these two individuals; and, humans were cursed to spend the rest of\
    \ their lives searching for their soulmates, finding that one person that fits\
    \ just perfectly. Blockchains and cryptography seem to be the technological version\
    \ of soulmates. They fit like a lock and key. Cryptography is one aspect that\
    \ makes blockchains unstoppable. \n\nAs technical as cryptography may appear (and\
    \ it is, in our context), cryptography isn’t anything new. For centuries, civilizations\
    \ have been using ciphers to protect information. Ciphers as old as 1900 B.C.\
    \ have been uncovered and studied. But, it was only towards the end of the 20th\
    \ century that these ciphers made a mark in the technological wave that gripped\
    \ the world. Cryptography gave the world wide web (or the internet, as it’s called)\
    \ a layer of security that people didn’t even know was needed. It is nothing but\
    \ encrypting the data in a way that makes it very difficult to hack into. This\
    \ ensures that the data reaches only the intended recipient. As we have seen before,\
    \ this sophistication in terms of security is a big USP (unique selling point)\
    \ for blockchain technology.\n\nWe could dig deeper into information on cryptography,\
    \ but that would have to be a separate book altogether because of its vast science\
    \ in itself. What would, however, be relevant to our context is the ideology that\
    \ lies at the core of this brilliant practice. Crypto anarchy started taking shape\
    \ in the 1980s, when the likes of Steven Levy and Steve Wozniak would ‘hack’ into\
    \ computers—not to steal or defraud, but to understand the software as closely\
    \ as possible and to explore how the devices could be made better. In 1984, Levy\
    \ published a book called Hackers: Heroes of the Computer Revolution where he\
    \ talks about the hacker ethos, in which his passion for decentralization is quite\
    \ obvious. A little later, in 1992, Timothy C. May, in his treatise Crypto Anarchist\
    \ Manifesto, took the privacy aspect of cryptography to the next level by proposing\
    \ a novel way of communicating with each other anonymously through cryptographic\
    \ messages. Though he fully anticipated the government crackdown on this aspect\
    \ in the form of laws and regulation, he also knew that nothing would be able\
    \ to stop this anarchy.\n\nNow, understand that crypto anarchy, despite its name,\
    \ isn’t about violence and opposing the establishment for the sake of it by spreading\
    \ hatred and discontent among masses. I, for one, do not support such fanatic\
    \ measures. Libertarianism, not extremism, is the solution. An establishment that\
    \ respects and upholds the rights of all is the utopia that I seek. \n\nI hope\
    \ that, as a reader, you can appreciate the ethical and ideological stand this\
    \ crypto anarchy took. Cypherpunks, as these crypto anarchists call themselves,\
    \ proposed an absolutely peaceful way of rebelling against the centralized authorities\
    \ that are looking to regulate every aspect of our lives. Also crucial to note\
    \ is that these individuals have been looking to bring social change by placing\
    \ more power in the hands of people like you and me, especially when it comes\
    \ to controlling their own data and privacy. When Bitcoin came about, the anarchical\
    \ goal of cryptography seemed to have finally culminated into what it was intended\
    \ for all along. As cryptography evolves blockchain into increasingly complex\
    \ solutions applicable to the most basic aspects of living, the potential remains\
    \ infinite. \n\n## Centralization Vs. Decentralization: A Fair Argument             \
    \ \n\nAnother of my favorite gems by Frederic Bastiat reads:\n\nIf the natural\
    \ tendencies of mankind are so bad that it is not safe to permit people to be\
    \ free. How is it that the tendencies of these organizers are always good? Do\
    \ not the legislators and their appointed agents also belong to the human race?\
    \ Or do they believe that they themselves are made of a finer clay than the rest\
    \ of mankind? (A quote from The Law, n.d.)\n\nBastiat was obviously a vocal supporter\
    \ of decentralization. \n\nI have always been in the habit of using quotes of\
    \ these learned men to seal off the debates I tend to have with my fellow enthusiasts\
    \ from other ideologies. And, whenever the topic of decentralization comes up\
    \ and I bring to their attention, this quote (not in the same words, maybe, but\
    \ a gist of it), tends to have only one retort:\"Those were different times!\"\
    \ Though I believe that the core of the idea of freedom has never changed, I do\
    \ agree about the different times clause. That is the reason why I am constantly\
    \ seeking truth around me, in this day and age. \n\nIn this quest, I have realized\
    \ that the centralization vs. decentralization debate is imperative to us today,\
    \ globally. This is especially because some of the most centralized states are\
    \ aggressively working toward proving their dominance in decentralized technology.\
    \ It makes me wonder why. Take China’s case, for instance. Though it has outright\
    \ rejected Bitcoin, it has been one of the leading players in testing blockchain\
    \ technology. It has recently even named a wide range of services to be the testing\
    \ ground of blockchain technology. So, here is a centralized administration that\
    \ places perpetual censures on its citizens’ freedom of expression, but also wants\
    \ to put out a technology that promotes decentralization? Doesn’t quite fit, does\
    \ it? The sad truth of the matter is such centralized states are indeed making\
    \ a run for blockchains—not because they want to promote decentralization, but\
    \ to control it. And, you don’t need me to tell you that controlled decentralization\
    \ isn't decentralization at all. \n\nEven as I write about the positive impact\
    \ that decentralization can bring about in the lives of the common man, I am quite\
    \ aware of the corresponding arguments in favor of centralization. Exactly opposite\
    \ to decentralization is the belief that accumulating power in a central agency\
    \ can improve the efficiency of decision-making, thereby improving the quality\
    \ of life of the common citizens. The decisions are made, as well as implemented,\
    \ much faster in a centralized structure. \n\nWhile that is certainly a valid\
    \ argument, and there is no denying that decisions are reached at a much faster\
    \ pace, my counter argument to that would be: Is speed always a good thing? There\
    \ is a concept known as groupthink in psychology that would have the perfect relevance\
    \ here. Groupthink refers to the blind trust that certain units may have that\
    \ their group’s decision is infallible and cannot go wrong. This is so often predicated\
    \ in the behavior of the political parties and their leaderships, and can be pretty\
    \ harmful to the bureaucratic process.\n\nLet me give you an example—rather, let\
    \ me ask you a question. Imagine that you have been feeling a little under the\
    \ weather for a while now. You go to a hospital which has a team of doctors. You\
    \ consult some of them, but get nothing definite. Then, after all this, you meet\
    \ with the head of the department who takes one look at you and pronounces you\
    \ a diabetic. The other doctors immediately agree, without any deliberation on\
    \ the topic, because their chief just cannot be wrong about things! As a patient,\
    \ would you find this pace of reaching the conclusion preferable? "
