- raw: "During the 2014 Presidential elections, a startling news item made the highlights\
    \ across various channels. It was reported that certain employees of Cambridge\
    \ Analytica collaborated with Facebook to gain access to the personal data of\
    \ millions of users. This was done in the hope of selling the psychological profiles\
    \ of the American voters to gain a political advantage. Donald Trump’s election\
    \ campaign officials were accused of misusing private data of the citizens. There\
    \ was an uproar, Facebook’s Mark Zuckerberg was ordered to testify—in short, a\
    \ lot of things happened. But, unfortunately, the masses tend to have a short-term\
    \ memory, and today this massive invasion of privacy just remains old news. \n\
    \nBut, we need to remember that: Abuse of power, like any other abuse, can happen\
    \ again if it has happened once. Facebook and most other social media platforms\
    \ have, time and again, shown that they function under the dictates of the unjust\
    \ ruling powers, and are just tools to carry out their agendas, be it hate speeches\
    \ or fake news. The same goes for most other media houses, too. This is why we\
    \ need social media, as well as media platforms, that are not serving the political\
    \ parties but the citizens. Only when we look up above the noise of these centralized\
    \ social media platforms will we be able to see that there are, in fact, many\
    \ decentralized apps out there that can serve us much better than the propaganda\
    \ machines we are exposed to today. \n\n### Steem\n\nSteem, in itself, is a blockchain\
    \ that supports applications like Steemit and DTube. Steemit is the decentralized\
    \ social media platform that rewards content creators by providing them with cryptocurrencies.\
    \ This incentivization model helps keep the blockchain running, with immutability\
    \ of the content as its foundation. The Steem blockchain supports a total of 324\
    \ apps, but Steemit, Utopian, and DTube remain the most popular. \n\nBoth Steemit\
    \ and DTube offer a series of news and videos based on your choice, while also\
    \ offering you a source of income in the form of cryptocurrencies by contributing\
    \ some form of written content. The decentralized nature of these platforms allows\
    \ them to be free from the political and censorship influences, as well as the\
    \ influences of the advertisers. Utopian, on the other hand, is an open-source\
    \ project where crypto-tokens can be earned by contributing not content, but some\
    \ kind of a fix on the open source project: like fixing a bug, for instance. \n\
    \n### Sapien\n\nWhile Steem was an early adopter, the decentralized social media\
    \ platform has only seen growth in the last few years. It is obvious that the\
    \ users are tired of the charades that the news channels and the centralized social\
    \ media platforms are playing with them. They want a communication channel that's\
    \ unscripted, uncensored, and just genuinely authentic. Sapien is one such platform\
    \ that fulfills all of these intellectual needs.\n\nHere, users have full control\
    \ over how much personal information they choose to share, and with whom. The\
    \ platform also curates the user experience based on the user’s interest and preferences.\
    \ Unlike the centralized social media, here there are no restrictions on the content\
    \ posted. For instance, towards the end of the last year, Facebook all of sudden\
    \ declared a ban on crypto ads, but took an about turn on this after it faced\
    \ a backlash from its users. It is clear that these policy flip-flops are quite\
    \ politically motivated, maybe only to gauge how far they can go in curbing the\
    \ freedoms and basic rights of their users. The decentralized platforms are the\
    \ only way to stop treating the big players as if the free citizen is their personal\
    \ pet parrot. \n\nThe Sapien Network uses the age-old remedy for tackling information\
    \ one doesn’t agree with—it’s called choosing not to engage (after a point). The\
    \ users can express themselves to the absolute edge and no one can stop them.\
    \ What you can do, as a user, is to pick and choose what content you take in;\
    \ if you feel offended by something someone said, best not to watch it again,\
    \ especially if you are only going to end up abusing the person and take away\
    \ the others’ right to expression. It also has private and public mode features,\
    \ which means that you can decide if you want to stay anonymous on the platform\
    \ or switch your original identity. What’s attracting a significant number of\
    \ people to this platform is the various social media features like creating groups,\
    \ texting, voice chatting, etc. which are largely missing in Steemit.\n\nSapien\
    \ is still only in its fetal stage. It’s built on the Ethereum blockchain and,\
    \ with its token SPN backed by ERC20 and Ethereum token, it looks excitedly to\
    \ the possibility of turning into a marketplace soon. This will promote various\
    \ other third-party applications and, even, integrations within the network itself.\
    \ \n\n### SoMee Social\n\nSoMee Social is yet another Cardano gem. This is a blockchain-powered\
    \ social media platform primarily designed for privacy, user control, and monetization.\
    \ This was launched in 2017 and is currently putting up the third iteration of\
    \ the platform. They have also been onboarding developers and marketers who have\
    \ been involved with much bigger projects in the past like Google and Zillow,\
    \ and are now doing this to kickstart the platform that can uphold the decentralization\
    \ ideology in the true sense. \n\n### Indorse\n\nIndorse can be thought of as\
    \ a LinkedIn substitute for decentralization enthusiasts. It has been marketed\
    \ as a social network powered by blockchains, but for professionals. This has\
    \ a unique feature that allows other users to verify the personal skills listed\
    \ by any user which essentially serves like testimonials. In return, the users\
    \ are incentivized by a certain share of profits going back to them. The idea\
    \ is simple—if you are claiming expertise in some area, then you would have to\
    \ attach proof of that claim, too. A consensus then follows, deciding whether\
    \ the claim is to be ‘endorsed’ or flagged. This platform has unlocked a unique\
    \ way to weed fake claims without curbing free speech. Though Indorse uses it\
    \ specifically for professional skills, this model might find its uses in avoiding\
    \ propagation of inaccurate information in the name of free speech.\n\nAs we come\
    \ to the end of the disruptions section, I would like to point out one very crucial\
    \ aspect that almost always gets overlooked in the excitement of discussing blockchain\
    \ applications. Let’s remember that the strength of blockchains is immutability\
    \ and, not necessarily, accuracy. This means that, though the information that\
    \ is entered into the system cannot be manipulated, eventually the efficiency\
    \ of the systems may be determined by the information that goes into it, in the\
    \ first place. So, if I, as a user, enter forged data into the system, then the\
    \ data entry will still be inaccurate despite the immutability. This is the reason\
    \ why blockchains, like any other technology, are only as good as the people running\
    \ them. And, that is why I keep saying that more of the commonfolk need to participate\
    \ in this, lest we lose the control over data that gets solidified in blockchains\
    \ for an eternity.\n\nIt would also be wise to note that all the disruptions we\
    \ have noted here are not the end of the blockchain potential, but only the beginning.\
    \ In fact, there are many that we haven’t touched upon; for example, blockchains\
    \ are being used in traffic management, vehicle leasing, management of software\
    \ versions and release of documents, so on and so forth. The list is endless. "
  fmt: '

    During the 2014 Presidential elections, a startling news item made the highlights
    across various channels. It was reported that certain employees of Cambridge Analytica
    collaborated with Facebook to gain access to the personal data of millions of
    users. This was done in the hope of selling the psychological profiles of the
    American voters to gain a political advantage. Donald Trump’s election campaign
    officials were accused of misusing private data of the citizens. There was an
    uproar, Facebook’s Mark Zuckerberg was ordered to testify—in short, a lot of things
    happened. But, unfortunately, the masses tend to have a short-term memory, and
    today this massive invasion of privacy just remains old news.


    But, we need to remember that: Abuse of power, like any other abuse, can happen
    again if it has happened once. Facebook and most other social media platforms
    have, time and again, shown that they function under the dictates of the unjust
    ruling powers, and are just tools to carry out their agendas, be it hate speeches
    or fake news. The same goes for most other media houses, too. This is why we need
    social media, as well as media platforms, that are not serving the political parties
    but the citizens. Only when we look up above the noise of these centralized social
    media platforms will we be able to see that there are, in fact, many decentralized
    apps out there that can serve us much better than the propaganda machines we are
    exposed to today.


    ## Steem


    Steem, in itself, is a blockchain that supports applications like `Steemit` and
    `DTube`. `Steemit` is the decentralized social media platform that rewards content
    creators by providing them with cryptocurrencies. This incentivization model helps
    keep the blockchain running, with immutability of the content as its foundation.
    The Steem blockchain supports a total of 324 apps, but `Steemit`, `Utopian`, and
    `DTube` remain the most popular.


    Both `Steemit` and `DTube` offer a series of news and videos based on your choice,
    while also offering you a source of income in the form of cryptocurrencies by
    contributing some form of written content. The decentralized nature of these platforms
    allows them to be free from the political and censorship influences, as well as
    the influences of the advertisers. `Utopian`, on the other hand, is an open-source
    project where crypto-tokens can be earned by contributing not content, but some
    kind of a fix on the open source project: like fixing a bug, for instance.


    ## Sapien


    While Steem was an early adopter, the decentralized social media platform has
    only seen growth in the last few years. It is obvious that the users are tired
    of the charades that the news channels and the centralized social media platforms
    are playing with them. They want a communication channel that''s unscripted, uncensored,
    and just genuinely authentic. `Sapien` is one such platform that fulfills all
    of these intellectual needs.


    Here, users have full control over how much personal information they choose to
    share, and with whom. The platform also curates the user experience based on the
    user’s interest and preferences. Unlike the centralized social media, here there
    are no restrictions on the content posted. For instance, towards the end of the
    last year, Facebook all of sudden declared a ban on crypto ads, but took an about
    turn on this after it faced a backlash from its users. It is clear that these
    policy flip-flops are quite politically motivated, maybe only to gauge how far
    they can go in curbing the freedoms and basic rights of their users. The decentralized
    platforms are the only way to stop treating the big players as if the free citizen
    is their personal pet parrot.


    The `Sapien Network` uses the age-old remedy for tackling information one doesn’t
    agree with—it’s called choosing not to engage (after a point). The users can express
    themselves to the absolute edge and no one can stop them. What you can do, as
    a user, is to pick and choose what content you take in; if you feel offended by
    something someone said, best not to watch it again, especially if you are only
    going to end up abusing the person and take away the others’ right to expression.
    It also has private and public mode features, which means that you can decide
    if you want to stay anonymous on the platform or switch your original identity.
    What’s attracting a significant number of people to this platform is the various
    social media features like creating groups, texting, voice chatting, etc. which
    are largely missing in `Steemit`.


    `Sapien` is still only in its fetal stage. It’s built on the `Ethereum` blockchain
    and, with its token `SPN` backed by `ERC20` and Ethereum token, it looks excitedly
    to the possibility of turning into a marketplace soon. This will promote various
    other third-party applications and, even, integrations within the network itself.


    ## SoMee Social


    SoMee Social is yet another Cardano gem. This is a blockchain-powered social media
    platform primarily designed for privacy, user control, and monetization. This
    was launched in 2017 and is currently putting up the third iteration of the platform.
    They have also been onboarding developers and marketers who have been involved
    with much bigger projects in the past like Google and Zillow, and are now doing
    this to kickstart the platform that can uphold the decentralization ideology in
    the true sense.


    ## Indorse


    Indorse can be thought of as a LinkedIn substitute for decentralization enthusiasts.
    It has been marketed as a social network powered by blockchains, but for professionals.
    This has a unique feature that allows other users to verify the personal skills
    listed by any user which essentially serves like testimonials. In return, the
    users are incentivized by a certain share of profits going back to them. The idea
    is simple—if you are claiming expertise in some area, then you would have to attach
    proof of that claim, too. A consensus then follows, deciding whether the claim
    is to be ‘endorsed’ or flagged. This platform has unlocked a unique way to weed
    fake claims without curbing free speech. Though `Indorse` uses it specifically
    for professional skills, this model might find its uses in avoiding propagation
    of inaccurate information in the name of free speech.


    As we come to the end of the disruptions section, I would like to point out one
    very aspect that almost gets overlooked in the excitement of discussing blockchain
    applications. Let’s remember that the strength of blockchains is immutability
    and, not necessarily, accuracy. This means that, though the information that is
    entered into the system cannot be manipulated, eventually the efficiency of the
    systems may be determined by the information that goes into it, in the first place.
    So, if I, as a user, enter forged data into the system, then the data entry will
    still be inaccurate despite the immutability. This is the reason why blockchains,
    like any other technology, are only as good as the people running them. And, that
    is why I keep saying that more of the commonfolk need to participate in this,
    lest we lose the control over data that gets solidified in blockchains for an
    eternity.


    It would also be wise to note that all the disruptions we have noted here are
    not the end of the blockchain potential, but only the beginning. In fact, there
    are many that we haven’t touched upon; for example, blockchains are being used
    in traffic management, vehicle leasing, management of software versions and release
    of documents, so on and so forth. The list is endless.

    '
  trans: '

    在 2014 年总统大选期间，一条惊人的新闻占据了各大频道的头条。报道称，剑谷（Cambridge Analytica）的某些员工与 Facebook 合作，获取了数百万用户的个人数据。此举目的是通过出售美国选民的心理画像来获得政治优势。唐纳德·特朗普的竞选官员被指控滥用公民的私人数据。此举引发了骚动，Facebook
    的马克·扎克伯格（Mark Zuckerberg）被要求作证——简而言之，发生了很多事情。但遗憾的是，大众往往记忆短期，今天这种大规模的隐私侵犯行为仅仅成了旧闻。


    但，我们需要记住：权力滥用和任何其他滥用一样，只要发生过一次，就可能再次发生。Facebook 和大多数其他社交平台已经一次又一次证明，它们在不公正统治权的支配下运行，只是执行其议程的工具，无论是仇恨言论还是假新闻。大多数其他媒体机构也是如此。这就是为什么我们需要不服务于政党而服务于公民的社交媒体和媒体平台。只有当我们跳出这些中心化社交媒体平台的噪音时，才能发现事实上有许多去中心化应用（dApps），它们能比我们现在接触到的宣传机器更很好地服务我们。


    ## Steem


    Steem 本身是一种支持`Steemit`和`DTube`等应用的区块链。`Steemit`是一个去中心化的社交媒体平台，通过向内容创作者提供加密货币来奖励他们。这种激励模型有助于保持区块链的运行，并内容的不可篡改性为基础。Steem
    区块链总共支持 324 个应用，但`Steemit`、`Utopian`和`DTube`仍然是最受欢迎的。


    `Steemit`和`DTube`都根据你的选择提供系列新闻和视频，同时通过贡献某种形式的文字内容为你提供加密货币形式的收入。这些平台的去中心化本质使其能够免受政治和审查的影响，以及广告商的影响。另一方面，`Utopian`是一个开源项目，用户可以通过贡献不是内容，而是对开源项目的某种修复来获得加密代币：例如，修复一个漏洞。


    ## Sapien


    虽然 Steem 是早期采用者，但去中心化社交媒体平台在过去几年中才看到增长。显而易见，用户已经厌倦了新闻频道和中心化社交媒体平台对他们进行的把戏。他们想要一个没有剧本、不受审查且真实真实的通信渠道。`Sapien`就是满足所有这些智力需求的平台之一。


    在这里，用户完全控制他们选择分享多少个人信息以及与谁分享。该平台还根据根据的兴趣和偏好来策划用户体验。与中心化社交媒体不同，这里对发布的内容没有限制。例如，在去年年底，Facebook
    突然宣布禁止加密广告，但在面临用户的反弹后又扭转了这一决定。显而易见，这些政策的反复变化具有很强的政治动机，也许只是为了衡量他们在限制用户自由和基本权利方面能走多远。去中心化平台是停止将大巨头视为自由公民的个人宠物鹦鹉的唯一途径。


    `Sapien Network`使用了处理不认同的信息的古老良方——这被称为“选择不参与”（在达到某一点后）。用户可以表达自己的观点直到极限，没有人能阻止他们。作为用户，你可以做的是挑剔选择你摄入的内容；如果你对某人说的话感到被冒犯，最好不要再看了，特别是如果你最终只会辱骂那个人并剥夺他人的言论自由。它还有私有和公共模式功能，这意味着你可以决定是在平台上保持匿名还是切换你的原始身份。吸引大量人员加入该平台的是各种社交媒体功能，如创建小组、短信、语音聊天等，这些在`Steemit`中很大程度上是缺失。


    `Sapien`仍处于胚胎阶段。它构建在`Ethereum`区块链上，凭借由`ERC20`和以太坊代币支持的代币`SPN`，它期待着很快变成市场的可能性。这将促进其他各种第三方应用，甚至是网络内部的整合。


    ## SoMee Social


    SoMee Social 是另一个 Cardano 的明珠。这是一个由区块链驱动的社交媒体平台，主要为隐私、用户控制和货币变现而设计。它于 2017 年推出，目前推出该平台的第三个迭代。他们还招募了曾参与过
    Google 和 Zillow 等更大项目的开发者和营销人员，现在他们正在做这些，是为了启动一个能够在真正意义上维护去中心化理念的平台。


    ## Indorse


    Indorse 可以被认为是去中心化爱好者的 LinkedIn 替代品。它被营销为一种由区块链驱动的、针对专业人士的社交网络。它有一个独特的功能，允许其他用户验证任何用户列出的个人技能，这本质上充当了证言。作为回报，用户通过获得部分利润分成获得激励。这个想法很简单——如果你声称在某个领域拥有专业知识，那么你就必须附上该主张的证明。随后达成共识，决定该主张是被“背书”还是被标记。这个平台开启了一种独特的方法，在不限制言论自由的情况下剔除虚假主张。尽管`Indorse`专门将其用于专业技能，但这种模型可能用于避免以言论自由之名传播不准确的信息。


    当我们接近这一颠覆性变革部分的末尾时，我想指出一个在讨论区块链应用的热情中几乎被忽略的方面。让我们记住，区块链的优势是不可篡改性，而不是准确性。这意味着，尽管输入系统的信息无法被操纵，但系统的效率最终取决于最初进入系统的信息。因此，如果我作为一个用户向系统输入伪造数据，尽管具有不可篡改性，数据输入仍然是不准确的。这就是为什么区块链像任何其他技术一样，其优劣取决于运行它们的人。这也是为什么我一直强调更多普通人需要参与其中，否则我们将失去对在区块链中永久固化的数据的控制。


    另一个明智的做法是注意，在这里记录的所有颠覆性并不是区块链潜力的终点，而只是开始。事实上，还有许多我们尚未涉及的领域；例如，区块链正用于交通管理、车辆租赁、软件版本管理和文档发布等等。列表是无尽的。

    '
