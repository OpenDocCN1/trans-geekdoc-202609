- raw: "Unsure of being watched, the inmates are always following the rules laid down\
    \ by this omnipresent guard—so much so that this discipline is internalized by\
    \ the inmates, no longer needing external supervision. Almost sounds sinister,\
    \ doesn’t it? It is, in a way—even more so when this concept expands beyond the\
    \ prison structure and applies to something as widespread as the global economy.\
    \ (Yes, the global economy.) This isn’t just a lesson in philosophy, but an economic\
    \ phenomenon observed around the globe. \n\nThe panopticon theory has a double-sided\
    \ implication in the context of blockchain technology. On the one hand, the more\
    \ powerful countries seem to have created a global panopticon surveilling the\
    \ developing economies to the extent that the developing economies are evaluated\
    \ on the basis of the standards of the developed nations. This doesn’t necessarily\
    \ help the developing nations, inevitably making the rich countries richer and\
    \ poor countries poorer. \n\nThe blockchain technology, however, flips the panopticon\
    \ theory on its head. Or shall we say, it emphasizes it all the more? Confused?\
    \ Well, here it is. The problem with the global panopticon is that the power is\
    \ centralized in the hands of the omnipotent players who dictate the rules of\
    \ the game. But, what blockchain technology does is to take this power and decentralize\
    \ it in a way that all stakeholders can be the watchful guards. Thus, in essence,\
    \ it diffuses the influence component of the panopticon while proliferating the\
    \ self-regulation aspect. \n\n## Makings of a Revolution\n\nIt’s no coincidence\
    \ that the blockchain movement began gaining steam after the 2008 financial crash.\
    \ This crash made it clearer than ever before that the trust that characterizes\
    \ most of our financial transactions could dissipate overnight with the rampant\
    \ corruption and scandals in the financial institutions. But, if the very medium\
    \ of these financial transactions could not be trusted, then what was the common\
    \ man to do? \n\nAs the American economy was being gradually consumed by this\
    \ hopelessness, a ray of hope emerged from the tiniest crack. Peter Kropotkin,\
    \ a Russian historian, remarked once, \"The hopeless don’t revolt, because revolution\
    \ is an act of hope\" (Peter Kropotkin Quote, n.d.). This time the act of hope\
    \ was carried out by an entity named Satoshi Nakamoto in the form of a white paper\
    \ that spoke of \"trustless trust.\" \n\nTo this day, we do not know who Nakamoto\
    \ was, but the paper they published brought out the wonderful idea of a distributed\
    \ ledger that would eliminate the need for the trust in our transactions altogether,\
    \ simply through the ultra-transparent module of functioning. Soon, Bitcoin was\
    \ launched and, since then, the curiosity about blockchains has only risen. This\
    \ technology challenged the existing systems like never before. It sought to take\
    \ the power from the powerful and distribute it in a way so as to bring even the\
    \ most disenfranchised people into the system. What is a revolution, if not this?!\
    \ \n\nRon Paul, the former Congressman and a libertarian pundit, rightly said,\
    \ \"If you sacrifice liberty for security, you will lose both\" (Ron Paul Quote,\
    \ n.d.). The blockchain, more than anything else, is a symbol of this liberty—the\
    \ liberty that refuses to be bound down by the shackles of invisible powers. We\
    \ shall discuss the concepts of liberty and libertarianism in detail a little\
    \ later; but, for now, understand that this revolution isn’t a struggle between\
    \ the left and the right but a struggle of the people standing firm and united\
    \ against government overreach, often known as statism. It is a struggle to restore\
    \ things that matter the most to you in today’s world—your rights, identity, and\
    \ authenticity of the information which forms the basis of so many of your life\
    \ decisions. \n\nAs someone who values freedom a great deal, I have come to respect\
    \ the workings of a blockchain and I hope that you shall, too, as you finish this\
    \ book. Blockchains have been aptly named as the biggest thing since the internet\
    \ and have become the most vital weapons in the biggest social, political, and\
    \ economic revolution of the 21st century. Don’t let the democratic and peaceful\
    \ nature of this revolution fool you—blockchain technology is changing the future\
    \ one community, one business, one sector at a time. But, here’s the most important\
    \ thing you need to remember—the blockchain revolution doesn’t begin with the\
    \ technology; it begins with you. \n\n## Why Blockchains?\n\nNow that we have\
    \ begun the blockchain conversation, a pertinent question in your head might be:\
    \ why blockchains? What is it about this technology that makes it so unique? More\
    \ importantly, why hype it as this big revolution? The truth is, and I can't stress\
    \ this enough, blockchain is the first thing in a long long time that gives liberty\
    \ and power in the true sense to people like you and me. But, this is not the\
    \ only thing that draws me to this technology. What is truly remarkable to me\
    \ is the profound influence it can have on the third-world economies around the\
    \ globe. \n\nWhenever I talk about blockchain technology in developing economies,\
    \ I am given severe frowns. People almost think of me as this first world citizen\
    \ living in the clouds with no idea of the ground reality in these nations. \"\
    These countries don’t even have the basic technology; how do you plan to implement\
    \ such an advanced one there?\" they ask me. \n\nBut, here’s what most people\
    \ miss out on completely—the financial world of the developed nations and the\
    \ developing nations are completely different. So, even though people like me\
    \ may find the credit/debit card and banking systems cumbersome and time-consuming,\
    \ the services are still present for us. Despite their disadvantages and risks,\
    \ the majority of the people are still able to make these systems work for them.\
    \ Though blockchains would result in significant improvement, the present systems\
    \ are, at least, available to us. \n\nHowever, when we talk about third-world\
    \ economies, most often the transactions tend to be devoid of trust due to the\
    \ widespread corruption, as well as crime. So, the systems that are available\
    \ to the first world citizens rarely fall in the financial spheres of the developing\
    \ nations. Many of the citizens may not even have banking accounts due to the\
    \ several socio-economic factors. \n\nBut, what they do have much more often than\
    \ bank accounts are their smartphones. The use of smartphones familiarizes these\
    \ communities much more easily to the internet than to traditional banking. This\
    \ is one of the reasons that mobile money seems to be so popular in countries\
    \ like Kenya and Tanzania, much more than countries like the United States and\
    \ the United Kingdom, for instance. Mobile money gives these individuals a way\
    \ to safely store and carry their money without being constantly worried about\
    \ theft. Mobile money, as convenient as it may be considered in these parts, still\
    \ poses quite a few challenges. One of them is the clunky nature of operability\
    \ in between networks, making the transactions, again, not quite convenient. Imagine\
    \ the groundbreaking change a blockchain could bring in an environment like this.\
    \ \n\nLet me explain what I mean by this. One of my friends narrated this incident\
    \ to me. He was on a trip to Tanzania and was required to make a few stops before\
    \ crossing the border to Kenya. He had hired a local cab driver who knew the place\
    \ well enough, and arranged to pay the man in cash. Everything was going fine,\
    \ until the driver began sharing the horror stories of theft, robbery, and even\
    \ violence. Of course, these were horror stories to my friend, but for the driver\
    \ these were quite the usual occurrences. As my friend held on to the cash in\
    \ his pocket, it became more and more clear to him the dangers that these people\
    \ were exposed to on a daily basis for merely carrying their own money. "
