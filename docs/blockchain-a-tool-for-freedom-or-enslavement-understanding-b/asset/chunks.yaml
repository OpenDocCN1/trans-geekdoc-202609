- raw: "Yes, that last part is important—at least most of the time. Let’s not be under\
    \ any illusions of invincibility, here. As much as we would love it, despite all\
    \ advanced measures, blockchains aren’t completely immune to malicious attacks.\
    \ Like every other technology, hackers have managed to find loopholes in this\
    \ technology, too. Some noted ways the hackers can find their way into blockchains\
    \ are Sybil attacks, 51% attacks, and phishing and routing attacks. Understanding\
    \ each of these in a little more depth can give us the much required context for\
    \ understanding blockchain technology and the importance of your own involvement\
    \ in it. \n\nPhishing on blockchains works pretty much the same way as it does\
    \ otherwise—scamming unassuming blockchain users with messages that may make them\
    \ give up their personal cryptographic keys. For the expert, these can be quite\
    \ obvious; but, what are known as routing attacks, on the other hand, may be quite\
    \ difficult to detect. Of course, there are protective mechanisms that can be\
    \ deployed to ensure the risk is kept to a minimum; but, the point is, awareness\
    \ is the first step in mitigating this risk. Sybil attacks derive their name from\
    \ the famous and controversial book that chronicles the supposed treatment of\
    \ Sybil and her dissociative identity disorder. Seemingly inspired from the story,\
    \ the hackers create multiple identities designed to overwhelm the system and\
    \ ultimately crash it. And, last but not the least, there are the 51% attacks:\
    \ the unscrupulous elements gain control over a majority of the network. This\
    \ is where the ethical participants’ role is critical, and their active involvement\
    \ can prevent such unethical takeovers. \n\nNote that these threats are not a\
    \ usual occurrence and, despite them, blockchains are probably safer than transactions\
    \ using the traditional systems. It is this security provided by blockchains that\
    \ is proving to be transformational in the rehabilitation of disadvantaged communities\
    \ around the world. Take the example of South African schools that have been equipped\
    \ with blockchain-enabled electric meters launched by a bitcoin startup: Bankymoon.\
    \ Donors from around the world send money directly to these meters, and can track\
    \ how much power these schools utilize and, even, the amount of power that their\
    \ donations can buy. The security of these transactions makes sure that the aid\
    \ is reaching the needy without any theft by middleman agencies and distributors.\
    \ With the security of this technology, the donors no longer have to worry if\
    \ their funds are reaching the desired destination.\n\n### Privacy\n\nWhen George\
    \ Orwell, in his book 1984, wrote the sinister line, \"Big Brother is watching\
    \ you,\" not many of us thought it was anything beyond fiction. But, the truth\
    \ is, surveillance states are fast becoming a global reality. It seems we are\
    \ past the point of discussing whether implicit surveillance is a thing; it is\
    \ most likely already a part of our lives. The data that is collected on a daily\
    \ basis through our smartphones is enough to send shivers down the spine of any\
    \ individual who is conscious about their right to privacy. Allowing all these\
    \ apps to collect our personal data seems like a pretty routine thing. What we\
    \ don’t realize is, with that permission, we are giving away one of the most valuable\
    \ things about ourselves: our privacy.\n\nBlockchains bring a whole new meaning\
    \ to this aspect of privacy. Experts believe that blockchains could, at some point\
    \ in the future, make the hassle of remembering your usernames and passwords obsolete.\
    \ This is to say that blockchains can give us encrypted digital identities. Seems\
    \ to be right out of some sci-fi novel, doesn’t it? It’s anything but imaginary,\
    \ though.\n\nThe World Bank’s ID4D database claims that there are almost one billion\
    \ people around the globe who have no authenticated identities (McKinsey Global\
    \ Institute, 2019). Without this identification, these people are completely left\
    \ out of the systems that govern them. They are unable to take benefits of any\
    \ welfare schemes but, ironically, tend to be ones that are in the most need for\
    \ these schemes. Having said that, digitizing the identity systems comes with\
    \ its own risks. It has been proven multiple times that they can be used for inflicting\
    \ harm, or even persecuting certain ethnic identities.\n\nBlockchains resolve\
    \ this issue by providing a safer and much more secure alternative to just digital\
    \ identities. They promote use of encrypted digital identities. A big blockchain\
    \ movement is underway, for instance, in Ethiopia where the blockchain company\
    \ known as Cardano is giving digital identities to millions of students in rural\
    \ Ethiopia. The first roll-out is for five million students; and, that would be\
    \ just the beginning, as millions would be added in further phases of the project.\
    \ This would enable the students’ academic performance to be tracked by their\
    \ teachers, as well as prospective employers. This is a mighty boost for streamlining\
    \ the students who, for the most part, may drop out of the education system altogether.\n\
    \nYou might be wondering, if someone’s records are online for people to scour\
    \ through, then where is the privacy? Well, most people don’t realize there is\
    \ a difference between privacy and secrecy. While secrecy is about hiding information\
    \ at any cost, privacy is all about the fine nuance of being able to control what\
    \ you’d like to put out there and what you’d wish to keep secret. Blockchains\
    \ afford you the power of privacy better than any technological innovation in\
    \ the history of our civilization. Thus, while blockchains are perfectly transparent\
    \ in terms of transactions, these transactions are not recorded, for instance,\
    \ in the name of the individual but an assigned cryptographic key, as mentioned\
    \ earlier. That is why these transactions are often known as pseudonymous and\
    \ not anonymous. \n\nWith all of the above mentioned, there will be little doubt\
    \ as to why you should care about it. As the social commentator Verna Myers beautifully\
    \ puts it, \"Diversity is being invited to the party; inclusion is being asked\
    \ to dance\" (Diversity Doesn’t Stick Without Inclusion, 2017). Though the internet\
    \ has invited most people to the technological revolution party, not many have\
    \ felt included, still. The hallmark of an inclusive society and economy is the\
    \ ability of all sections to participate in it. It is no secret that this is hardly\
    \ the case with our society—we live in an economy where, despite all the technological\
    \ sophistication, the rich continue to get richer and the poor become poorer.\
    \ Blockchains promise a paradise to people who never before could imagine an impartial\
    \ inclusion, while also preserving their liberties, as well as security, and placing\
    \ the core of power in their own hands.\n\n# Chapter 2: The Technology Behind\
    \ Blockchains\n\nIf you want something new, you have to stop doing something old.\n\
    \n–        Peter F. Drucker\n\nWhen Satoshi identified an age-old problem and\
    \ came up with Bitcoin, many people were skeptical. Bitcoin was widely predicted\
    \ to be a bubble which is likely to burst someday. You will find that the debate\
    \ still rages between the yea-sayers and the nay-sayers on multiple business channels.\
    \ Be that as it may, there is one crucial detail that people seem to have overlooked\
    \ for quite a long time. All cryptocurrency is blockchain, but not all blockchains\
    \ are limited to cryptocurrency. They are not synonymous. "
