- raw: "You’ll often hear quite the Utopian version of the progress that AI is making.\
    \ The CEOs and the founders of the companies leading the AI revolution are constantly\
    \ appearing on our phones screens, newspapers, and televisions preaching how wonderful\
    \ the future looks with the ever-evolving AI scene. Needless to say, the wonderful\
    \ future they are painting is not without limits. While these companies will likely\
    \ be the biggest beneficiaries, as they are even at present, the benefits trickling\
    \ down to the general population can be expected to be significantly limited in\
    \ scope, especially if the current trends of power continue. As is obvious, these\
    \ Silicon Valley technology leaders have done everything to keep the power concentrated\
    \ in their own hands. This shouldn’t be surprising, either, because no matter\
    \ what anyone says at the end of the day, it’s not so much about welfare as it\
    \ is about the big bucks.\n\nElon Musk, recently in news for taking over Twitter\
    \ (among other things), has been one of the few skeptics. Long before the Twitter\
    \ takeover revitalized the talks of a decentralized social media, Musk founded\
    \ the non-profit research company OpenAI in 2015 to ensure that the advancing\
    \ AI benefits all of humanity before it fills the pockets of the big-tech companies.\
    \ When asked about the AI future in an interview, Musk beautifully reiterated\
    \ one of Lord Acton’s quotes, “Freedom consists of the distribution of power and\
    \ despotism in its concentration” (Elon Musk Viral Videos, 2018). In this interview,\
    \ he opened up about his growing concerns of how the brilliantly advancing AI\
    \ might not always be used for the better, especially when the helm of this ship\
    \ is kept in the hands of the powerful few. Coming from a person like Musk, who\
    \ is right in the midst of the technological changes, these concerns may well\
    \ serve as cautions for the rest of us, alerting us to the dangers of centralization\
    \ yet again. In these fast-changing circumstances, imagine what a mix of blockchain\
    \ and AGI can do. Blockchains can be the decentralized antidote to the centralization\
    \ venom spreading fast in the AI sector. It can practically root out the problem\
    \ of privacy intrusion completely and give you the best of both worlds—effective\
    \ algorithms with encrypted and secure personal data.\n\nNote that, just as blockchains\
    \ can make the machine learning experience better for participants, it also works\
    \ the other way around. AGI also has a huge role to play in blockchain decentralization.\
    \ In fact, a decentralized model that combines blockchains with artificial general\
    \ intelligence (AGI) can leverage a much larger vista of resources for bringing\
    \ about development. They both can help each other reach their maximum potential\
    \ in the true sense.\n\nAs in the case of Sophia, machine learning requires large\
    \ quantities, as well as better quality of data, to be able to predict the outcome\
    \ more and more accurately. Blockchains are a great source for both. Industries\
    \ have started utilizing this blend of both in numerous sectors. For instance,\
    \ in healthcare, patient data stored on a blockchain can be analyzed by an artificial\
    \ intelligence model to reveal patterns across communities, which can then be\
    \ utilized to design healthcare policies and, even, manage caregiving models better.\
    \ In a nutshell, decentralized artificial intelligence on blockchains is a trend\
    \ that you cannot ignore anymore. SingularityNET is one such blockchain-driven\
    \ AI network. There are even talks of a partnership between this platform and\
    \ Cardano to provide AI-based blockchain solutions to deal with pertinent challenges\
    \ across the globe. The moral of the story is that AGI and blockchains are an\
    \ unstoppable combo, and a lot more upgrades can be expected as both of these\
    \ grow together. \n\n## Into the Metaverse\n\nIf you are even slightly interested\
