    世界上多个政府，无论属于右翼还是左翼，都为了满足自身的既得利益而剥削大众，受意识形态的影响远大于对选民的情绪或福利。历史中充满了不同时期的此类例子。战争在寻求公民福利的借口下爆发，导致了生命的损失。即便此时此刻，战争仍以“更好世界”的名义在全球多个地区肆虐。我也想要一个更好的世界，每个人都是如此。我只是不想让它通过腐败、社区和政治分裂以及无意义的战争来实现。今天，我们人民有机会推翻这几个世纪以来由各国政府传播的错误观念——区块链就是这个机会，如果我们不全心投入地接受它将是愚蠢的。


    随着政治权力让治理过程变得日益晦暗，人们对政府运作的信任也随下降。这种情况不仅发生在发展中国家，全球各地的发达国家也是如此。加拿大政府近期冻结了所有向反对政府指令的抗议活动捐赠哪怕是最小金额的账户，根据疫苗接种状态对人进行歧视。尽管他们在约一周后解冻了大部分账户，但有推测认为某些账户可能永远无法恢复。这种对权力的公然滥用似乎完全是不正当的。即使加密货币交易所
    `Kraken` 在处理某些抗议者的加密资产时，也被要求冻结，尽管这些加密货币并不属于政府监管范围。人们已经感到疲惫和不信任，而且对于那些保护选民的虚假承诺，这种怀疑是合理的。此外，选举程序本身是如此混乱，以至于是最民主的国家也发现自己在旨在劫持民主过程的腐败影响中摇摇欲坠。


    例如，最近印度和美国的选举。在印度，他们在使用电子投票机（`EVMs`），因为这些机器被认为更准确。然而，在几乎每场选举中，都有报告称随机人员在没有遵循正规流程的情况下带走了某些
    `EVMs`。此外，还有报告称 `EVMs` 可能会被黑客攻击，使得看起来公民将票投给了某个政党，而实际上选票却给了别人。那么，即使使用了 `EVMs`，公民又如何确保自己的选票无误呢？


    即使在最近的美国总统选举中，落败的共和党也对选民欺诈提出了许多问题。诚然，这两个国家的投票程序非常不同。而且，在美国关于选民欺诈的所有指控都经过了调查，尽管存在不规范之处，但法院并未将其视为干预选举的广泛尝试，而是孤立事件。但是，想象一下投入这一程序的时间和财务资源。


    如果存在一个系统，关于有效性的问题永远不会产生会怎样？嗯，这不再是幻想了。区块链承担了将这种信任带回系统的任务。而且，多个国家和州一直在使用这项技术来保护他们的民主制度。你可能会惊讶地发现，犹他州是可以通过电子邮件投票的州之一。不过，我稍后会详细讨论这一点。


    我想在这里强调的一点点是，无论哪个政府上台，无论是哪个政党或政治家，我们都必须理解权力大于其中任何一个。这意味着，无论你投票投给谁，无论谁获胜，掌权者都需要承担责任。这更多是人性的问题而非性格问题——权力和贪婪会腐败最优秀的人。此外，民主的意义不在于在场外为你喜爱的赛马欢呼并然后将他们奉上神坛。相反，它的意义在于能够就他们的行动以及缺乏行动向他们提问。我再次敦促你们，不要仅仅从政治角度来看待，而要从人类行为的角度来看待。你会发现，政府不是为了选择你最喜欢的一方，而是为了让任何获胜的一方对他们为改善公共生活所做的承诺承担责任。让我们尝试理解区块链如何在全球范围内使治理更加高效。


    ## 区块链治理


    关于区块链治理，我们需要了解的第一点是，此类倡议的目的是赋予你最高水平的权力——创建一个真正意义上的民主。想想我们现在所生活的民主；我们选出代表来传达我们的诉求或对某些政策、意识形态、问题的支持。很多时候，我们发现自己对这些代表感到失望，因为他们后来被证明有自己的意图。在某种程度上，这些代表也是我们为了建立功能性等级而选择的中间人，你不觉得吗？


    现在，我推测我们已经很好地理解了一点，那就是区块链讨厌中间人。那么，如果不是选择这些代表，而是你可以坐在舒适的沙发上直接对相关问题投票，会怎样？这个想法对许多人来说可能很离谱，但某些区块链已经在其实际运行使用了这种真正的去中心化意识形态。如果规模得当，没有理由它们在未来不能建立一个完全去中心化的政府。我们将在下一节关于
    `Cardano` 区块链运作的部分详细讨论这一点。但在那之前，让我们从小开始，尝试理解区块链将如何融入我们现在的治理模式。老实说，这一成就不亚于改变整个系统。区块链在治理的许多领域一直扮演着破坏者的角色。让我们来看看。


    ### 城市管理


    我们已经提到了恩特贝的智能城市项目，现在让我们深入一点。为什么智能城市最近如此关注？仅仅是因为想追上技术潮流吗？可能吧，但还有一个实用的原因。我们作为一个社会正处于一种困境。我们希望扩张城市定点以支持日益增长的人口需求，但也希望减少投入这方面的预算。智能城市通过大幅减少所需的时间财务资源优雅地解决了这个问题。它们为运作带来的效率是一个极好的副产品。


    每当视线上出现重大技术时，怀疑者就会对变化感到担忧。区块链也不例外。许多对区块链提出的批评并非出于知情的认知，而是出于误导性的无知。但尽管最初存在阻力，一些国家和城市正在向世界展示这项技术可以带来的繁荣证据。


    无论是爱沙尼亚这样的国家，还是像迪拜这样的大城市，人们都在从区块链治理中获益。你可能会因此认为区块链只适用于整个国家或像迪拜这样的大城市。虽然区块链在被更大的系统采用时确实更有用，因为这些系统提供了巨大的互操作性，但这并非前提条件。以瑞士的格
    Zug（Zug）为例。格是一个小镇，也是世界上第一个采用 `Bitcoin` 作为政府支付手段的地区。这个从市级开始的小实验，现在已经发展成为极其复杂的生态系统，现在被称为“加密谷”。

