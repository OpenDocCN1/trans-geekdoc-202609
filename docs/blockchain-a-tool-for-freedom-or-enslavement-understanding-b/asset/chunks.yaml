    \ right reasons. Multiple companies have joined the race, with more entrants coming\
    \ in all too frequently. Companies like `ShapeShift`, `Circle`, `Coinbase`, `Blockstream`,\
    \ and so on are all utilizing blockchain infrastructures for trading in crypto\
