- raw: "This may seem like it’s only for a corporate advantage, with not much in it\
    \ for the common folks. This is only partially true. People like you and I may\
    \ not be directly impacted by this, but let’s face it: Trade impacts everyone,\
    \ even when you are not a consumer of the specific products being traded. It is\
    \ the backbone of our economies. Fraudulent trade practices are more often than\
    \ not promoted by a festering culture of corruption that certainly impacts every\
    \ citizen. If trade begins to collapse, there’s no saying what’s on the list next.\
    \ \n\n## Insurance\n\nThe major problem with the present centralized insurance\
    \ system is, to a large extent, the costs that it incurs, trying to verify claims\
    \ and detect frauds, if any. The cumbersome process of product development, administration,\
    \ documentation, claim verification, and multiple other protocols take up a lot\
    \ of time. While this doesn’t make much difference for the bigger players, the\
    \ smaller ones are likely to feel quite trapped in a system like this—on the one\
    \ hand, the premiums might be too high to pay, but leaving themselves and their\
    \ families exposed to catastrophe may seem even scarier. \n\nThis is where the\
    \ concept of microinsurance comes in. Very similar to the microfinancing concept,\
    \ microinsurance is to provide protection to those that might not be able to afford\
    \ too many high-end insurance products. This is being successfully run in Kenya\
    \ by ACRE Africa with small farmers. When reaching out to an underprivileged population,\
    \ it is essential that the insurance company tries to understand the problems\
    \ at the grass root level. ACRE Africa, for example, has identified some major\
    \ problem areas with the traditional insurance systems that keep the farmers away.\
    \ \n\nApart from affordability, these farmers seem to be skeptical about the fact\
    \ that the premiums they pay will actually come back to them in the form of claim\
    \ settlement. The issue of eroding trust in the traditional systems raises its\
    \ ugly head again. An associated factor of lack of transparency also comes into\
    \ play here, only worsened by the lengthy timelines leading up to the settlements.\
    \ Blockchain-driven ACRE Africa is changing all of that by bringing trustless\
    \ trust back into the system. Also, the entire process, that took tons of resources\
    \ and money previously, can happen in one go over the blockchain system. This\
    \ leads to a steep drop in the costs to the company, as well as the farmer. \n\
    \nAnother aspect might be the centralized systems often have rigid data points,\
    \ and if the situation of the insured veers even slightly from the standard, disbursement\
    \ of funds might get stuck in the loop. To understand this point, consider a farmer\
    \ whose crop has been destroyed by a locust attack. In a centralized insurance\
    \ system, the claims are likely to be settled on the basis of the region's circumstance.\
    \ If the other farms in the region were not destroyed, the insurance company may\
    \ decide that the farmer doesn’t qualify for a settlement. \n\nIf the same were\
    \ to happen in a blockchain-based insurance company, the claims would be disbursed\
    \ with the help of smart contracts, which have a provision to consider flexible\
    \ data points. Thus, the claim verification would be based on the data taken from\
    \ the installed sensors that trigger the smart contract and release funds automatically,\
    \ in real time. So, a locust attack would be picked up by the sensors immediately,\
    \ leaving the tedious due diligence procedures almost redundant. The timeline\
    \ is now reduced from an average of three weeks to receiving settlements on the\
    \ very same day. \n\nYet another use case for blockchained insurance would be\
    \ in relation to the healthcare that we’ll discuss in the next section. For now,\
    \ it is important to remember that a digitally inclusive system that has the individual’s\
    \ health records and history in one place, makes it much easier and cost efficient\
    \ for an insurance company to verify claims. Since the evidence is in digital\
    \ form, it is much more convenient to incorporate it in the underwriting process\
    \ for claim settlement. \n\nApart from microinsurance and health insurance, the\
    \ industry at large also presents us with several sub-sectors that might be ripe\
    \ for a blockchain disruption: high-value items registries, anti-money laundering\
    \ protocols, know-your-customer (KYC) procedures, reinsurance, claims handling,\
    \ reinsurance—again, the possibilities are endless.\n\nBefore we wrap up the section\
    \ on banking and financial sectors, there’s one aspect I’d like to emphasize here.\
    \ We might think that some of what we discuss in the banking section has to do\
    \ with only the big companies—especially stock trading or trading finance—but,\
    \ we need to learn to look at these as part of the big picture. As we discussed\
    \ in the Austrian economics section, looking at these aspects as isolated instances\
    \ will only lead to a narrow, tunnel vision. As goes the wise phrase: The whole\
    \ is often more than the sum of its parts. And, all of the parts we have discussed\
    \ up until now, and the ones that are coming after this, have great cumulative\
    \ effects on our social, civic, and economic well-being, even when we feel we\
    \ are not directly affected. \n\nFinancial sector still remains the most widespread\
    \ area of disruptions by the blockchains, and rightly so. Authoritarian and power-hungry\
    \ institutes have always used the financial gullibility of the masses to force\
    \ down their throats unjust regulatory practices. The financial insecurities of\
    \ these people have led them to often buckle under the pressure. But now, it’s\
    \ time to question the so-called custodians of your hard-earned money. Blockchains\
    \ have the power to make them accountable—it’s time we draw a line in the sand\
    \ and refuse to be pushed around anymore. \n\n# Chapter 10: Healthcare\n\nWe have\
    \ already seen the kind of impact that blockchains have on healthcare, in the\
    \ chapter on Africa. The simple fact that the patient’s records are securely recorded\
    \ in one place for the authorized doctors to access, in itself, can be life-saving.\
    \ Add to this more aspects like eradication of the counterfeit drug trade, and\
    \ we have a truly life-changing combination of healthcare and blockchains. \n\n\
    Even within the healthcare industry, multiple sectors can be identified where\
    \ the actors have realized the potential that blockchains can bring to the table.\
    \ Having said that, though, there is also a distinct resistance to the change\
    \ in systems on the part of healthcare professionals. While tablets and computers\
    \ are the medium of entering patient data in the system for modern facilities,\
    \ not many would fall under this category. There is still a particular distrust\
    \ about the electronic data being susceptible to hacking attacks. This fear is,\
    \ of course, not completely unfounded, and transferring the systems onto blockchains\
    \ can satisfactorily rule out this concern. Rather than a technological concern,\
    \ this falls more under an awareness problem. \n\nAnd, this is where the participation\
    \ of each of us comes into play. I write this book, not with the goal that my\
    \ reader will go on to make a great blockchain breakthrough, but with the hope\
    \ that each one of us can continue to educate those in our immediate surroundings\
    \ about the blockchain world that’s building up right around us, even at this\
    \ very moment. The more myths around this technology that we help dissolve, the\
    \ closer we will be to a truly participative system we will be able to contribute\
    \ to. I mention this here, specifically, because our healthcare systems are currently\
    \ in dire need of such meaningful transformation. \n\nIt's wonderful to see that,\
    \ despite the resistance, blockchains have been able to make significant inroads\
    \ in the medical community. In this section, I want to direct your focus on blockchain\
    \ projects that are actually transforming the medical industry, one step at a\
    \ time. \n\n## Electronic Health Records"
