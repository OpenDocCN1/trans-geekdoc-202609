  trans: "\n正如我们一直所看到的，无数人正在从事着有意义的工作，以保护这些边缘化群体的声音。我在为这本书做研究期间所看到的工作以及我遇到的人们，通过他们的行动让我相信，无论发生什么——人类的意志和决心，而且最重要的是善良与平等的声音，总能找到出路，即使在重重困难之中。它就像一朵穿过混凝土块缝隙绽出的、细小而明亮的蒲公英，拒绝枯萎，让这块混凝土变得无限美丽。\
    \ \n\n但请注意，这项技术就像任何其他革命性的机械化一样，在错误的人手中是一枚定时炸弹。请记住，能够将我们免受压迫的技术，也可能被压迫者用来推行他们的非民主议程。正如我在书中反复提到的，除非我们各就其指定的岗位，否则你可以确定，这场战斗将由那些压迫者赢得。因此，我敦促你参与区块链，以保持去中心化原则的生命。\n\
    \n我希望这本书带给你的不仅仅是信息。正如我所说，这本书真正的成功将在于你积极的参与以及对周围区块链的关注——这是防止它们像其他技术那样被侵蚀的唯一途径。如果这本书，尤其是这项技术引起了你的共鸣，我希望你开始与朋友、家人甚至那些观点相反的人就此展开对话。打破信息孤岛的唯一方法是和平、持久且有证据支持的对话。没有这些，任何民主制度都无法免疫权威主义的危险。所以，尽管去交流。另外，如果你喜欢这本书，请在\
    \ Amazon 上留言。这对于触达更多人非常有帮助。本书的收益将捐赠给西非去中心化联盟（West Africa Decentralized Alliance）——这是他们不断扩张旅程中的微薄之力。至于你，我的朋友，我希望你全心拥抱区块链，让它们让你自由，永不再受奴役。\n\
    \n# 参考文献\n\n- 关于质押池、运营商和所有者。(无日期.) Cardano 文档。[`docs.cardano.org/getting-started/operating-a-stake-pool/about-stake-pools`](https://docs.cardano.org/getting-started/operating-a-stake-pool/about-stake-pools)\n\
