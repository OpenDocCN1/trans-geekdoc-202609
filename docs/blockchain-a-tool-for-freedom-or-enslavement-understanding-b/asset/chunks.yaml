    The Appzone group, a leader in fintech, has recently launched an app called `Zone`
    which could be the first step in building the continent’s decentralized payment
    network. `Zone` utilizes a blockchain platform for local, as well as Intra-African,
    payment processing in fiat and digital currencies. Traditionally, the companies
    have used centralized Electronic Financial Transaction (`EFT`) switches, which
    are single points of contact between them and the banks. These are problematic
    because they carry out the settlements of transactions only at defined intervals,
    and have also been known to fail altogether in certain situations. As `Zone` uses
    a decentralized blockchain architecture, the settlements happen instantly; and,
    a failure at one point doesn’t bring the whole system to a halt. Moreover, as
    we discussed previously, being a blockchain solution, it saves up on transaction
    costs in a major way, too.


    This isn’t the only player in the game, though. Another leader in the fintech
    arena, `Interswitch Group` has been conducting significant research in collaboration
    with `Interstellar Inc.`, a blockchain infrastructure company. We are likely to
    see a big emergence of blockchain-powered solutions coming from this collaboration.
    The great thing about these projects is that they seem to have identified a major
    gap in the digital finance market in Africa—interoperability between the several
    regions of the continent; and, they are bringing effective resolutions to tackle
    this problem. This, in many ways, would prove to be a major factor in blossoming
    the trade in the region, and herald a new era of economic prosperity.


    ## Government-Partnered Blockchain Projects


    It is often observed that developed nations make the most of any upcoming technology
    because of the resources, both human and financial, that they have at their disposal.
    Blockchain technology seems to partially resolve this issue by utilizing much
    of the available infrastructure. Despite this advantage, however, blockchain architecture
    would require a considerable amount of expertise if this technology were to be
    used at scale, especially in the public sector. You’d think that this could deter
    the African countries from early adoption, but what has been observed is, quite
    wonderfully, the exact opposite. Governments in parts of the continent have formed
    various collaborations with experts from both law and technology to develop infrastructure,
    thereby attracting investment.


    We already looked at the landmark `Cardano` deal with the Ethiopian government
    to provide digital identities to five million students. The great thing is that
    it is one of the projects, a massively important one, but just the one, nonetheless.
    There are many more collaborations like this, either in the works or have already
    been functioning for quite some time.


    The South African National Blockchain Alliance (`SANBA`) is one such collaboration.
    The great thing about this is that it connects government, sponsors, the research
    community, and the industrial community to help adopt blockchains beyond the financial
    and cryptocurrency domains. Since its creation, `SANBA` has been looking at several
    strategic partners for developing a smooth-running and connected blockchain ecosystem
    including `IBM`, `Microsoft`, `Binance`, `Cardano`, and so on. During the last
    year, two stand-out projects that they have undertaken are `ILIMA`—a farm-to-fork
    support program for small farmers and processors powered on a blockchain, and
    `Credentialing Blockchain` to digitally document skill development credentials
    for apprentices. Though both projects are in a proof of concept stage currently,
    it shows the increasing interest that even the government is taking in this technology.


    Blockchain adoption by the Ugandan government is also noteworthy. The major issue
    that the government hopes to tackle is that of counterfeit pharmaceutical drugs
    in all of the East African community. For this, a couple of years back, it partnered
    with blockchain-based platform `MediConnect`—which records the manufacturing of
    pharmaceuticals on a blockchain, thereby making it much easier to trace the fake
    drugs and stop their distribution in the supply chain.


    Another significant blockchain adoption in the public sector in this country is
    the land titles registry. Uganda has a nuanced land tenure system with a variety
    of protection rights and modalities. Despite the fact that the law is very much
    designed to favor the common man, the ground reality suggests quite the opposite.
    The corruption and fraud has been eating away at the system by issuing multiple
    titles over the same property. This basically renders the title certificate, which
    is technically the only requirement to prove ownership, practically useless. To
    make matters worse, a large number of Ugandans have been evicted from their own
    properties due to a growth in foreign investment, without a trace of fair compensation,
    leaving them to the streets. Even their farming lands have been snatched from
    them, taking away what was previously their sole means of earning a livelihood.
    The government has been looking at a pilot project to implement blockchains for
