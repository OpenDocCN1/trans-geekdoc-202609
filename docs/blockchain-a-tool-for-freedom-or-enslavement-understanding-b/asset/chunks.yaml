- raw: "You don’t have to be an environmentalist to know that our planet is in a deep\
    \ crisis. As our landfills sit taller than ever, waste management drives across\
    \ the globe seem to be struggling to catch up with the increasing mounds of garbage.\
    \ As the population and the commercial consumerism increases, so does the waste,\
    \ especially non-eco friendly waste. Ontario, Canada was recently reported to\
    \ be running out of space for its own garbage. As this waste in solid, liquid,\
    \ and gaseous forms piles on, human health is more and more endangered. Waste\
    \ mismanagement has been well-documented, especially in developing countries leading\
    \ to major health concerns like respiratory problems, skin infections, and even\
    \ prenatal and postnatal defects. The primary reason for this mismanagement in\
    \ developing countries, apart from corruption, is that waste management has multiple\
    \ moving parts along its logistical chain.\n\nHave you ever wondered what happens\
    \ to the trash collected from your curb? The easy and probably the less scary\
    \ answer is that it goes to the landfills. But, beyond this, it may be difficult\
    \ to trace the movement of this trash because of the different types of waste,\
    \ the numerous collection and processing centers involved in the process, and\
    \ a number of such dynamic factors which might be quite difficult to track on\
    \ a large scale. Blockchains have proven extremely successful in this regard.\n\
    \nArgentina, despite being a developing country, has proven to be a wonderful\
    \ role model for putting its garbage on blockchain. The government, in collaboration\
    \ with entrepreneur Ivan Zubilewicz, have implemented a reward program for waste\
    \ collection using a cryptocurrency created by Zubilewicz, called JellyCoin. This\
    \ cryptocurrency is awarded to all those who are involved in the waste management\
    \ process. All that anyone who wishes to participate has to do is log in to the\
    \ app and register as either the producer, collector, or processor of trash. Each\
    \ of these is then rewarded for following proper waste segregation. These different\
    \ actors are also connected with each other, ensuring that the traceability—and\
    \ the resulting accountability—are implemented for the betterment of the process.\
    \ The collectors are even rewarded based on the distance they travel to collect\
    \ trash. Overall, the whole process becomes incentive-based, thus making people\
    \ more proactive in their work. This cryptocurrency can then be used to buy anything\
    \ they wish for in the mainstream market, as it is widely accepted in the Argentine\
    \ economy. What a wonderful way to resolve an age-old problem without the need\
    \ of a federal government!\n\nAnother such pilot project is fueling community\
    \ effort to create a better waste disposal system in Bengaluru, India. Blockchains\
    \ have provided a fool-proof way to ensure that no problem in garbage collection\
    \ goes unnoticed. If the garbage collection has been neglected, the citizens can\
    \ go and register complaints. Before the introduction of the blockchain element,\
    \ the government used a geotagging system where the collector would take a picture\
    \ of the cleaned site with a time stamp and upload it. But, the problem is that\
    \ there are loopholes in this technology that can allow for tampering with the\
    \ past data entries and time stamps. Pairing this technology with blockchains\
    \ brings in a much needed level of sophistication, while also keeping the data\
    \ for all stakeholders to see. This transparency ensures accountability, and gives\
    \ a clear understanding of those that are performing and those that are not.\n\
    \nRecycleGO is a New York-based project that uses QR code scanners to scan the\
    \ plastic bottles, increasing the traceability of plastic waste management. They\
    \ also have a unit in Lagos, Nigeria where they plan to use blockchains to take\
    \ their plastic recycling a notch higher by putting the entire process on a blockchain.\n\
    \nAll the projects we have discussed here are being run in the so-called developing\
    \ parts of the world. I highlight this because, often, we have a skewed perception\
    \ that the developing world is not as tech-savvy as the rest of its counterparts.\
    \ But, what we see here in this section, as well as what we have discussed so\
    \ far, completely contradicts that notion. These countries may not find the financial\
    \ resources, but maybe it is this scarcity that inspires them to use the resources\
    \ even more economically, as well as efficiently. And, the reason blockchains\
    \ excite me is they seem to be the perfect tool for this resource utilization.\
    \ \n\n# Chapter 7: Use Cases for Developing Economies\n\nDeveloping economies\
    \ have, unfortunately, always been the last to reap any benefits advanced technologies\
    \ can offer. The dysfunctional hierarchical structures in these communities have\
    \ often been responsible for the social disadvantage that these groups have been\
    \ placed at. But, as we have evidenced multiple times throughout this text, blockchains\
    \ have the capacity to change all of that. As exciting as the examples that I\
    \ have shared here are, the blockchain technology is still in its infancy. Blockchains\
    \ are still finding their voice in sectors that actually matter.\n\nHaving said\
    \ that though, today we have enough proof to be certain that this technology works,\
    \ especially in those parts of the world where they were least expected to succeed.\
    \ Though we have described several examples where blockchains are being the game-changer,\
    \ now we take an exclusive look at this technology, flipping the reality on the\
    \ continent of Africa. This chapter is dedicated to drawing your attention to\
    \ the wonders that this technology is doing in African countries, changing the\
    \ landscape of their social empowerment, one platform at a time. We take a look\
    \ at all of these platforms individually, and see their impact on the African\
    \ economy, as we go along.\n\nIn 2020, a survey by PositiveBlockchain.io identified\
    \ 69 projects that were utilizing blockchains for social good on the continent\
    \ of Africa (Smart Africa, 2020). Remember that, when we talk about social good,\
    \ these are not necessarily non-profit. In fact, most of these are for-profit\
    \ startups. This is not a bad thing at all, because it means that people and organizations\
    \ alike have begun to see blockchains as viable self-sufficient platforms that\
    \ can generate income and fetch profits without depending on donations and charities\
    \ from specific entities. A majority of these projects, 57% according to the above\
    \ report, have been heading their operations from headquarters on the continent\
    \ itself. However, the spread of these blockchain initiatives isn’t uniform throughout\
    \ the continent, with Kenya, South Africa, and Nigeria being in the spotlight\
    \ for the most time. Nonetheless, there is little doubt that a vibrant blockchain\
    \ ecosystem has emerged on the continent and is on its way to a lasting full bloom.\
    \ \n\n## Digital Finance Infrastructures\n\nThe digital money on blockchains has\
    \ seen a widespread acceptance from people. This shouldn’t come as a surprise,\
    \ considering our previous discussion about the Africans’ heartening to mobile\
    \ money apps like mPesa. You might be surprised to know that a majority of global\
    \ mobile money operators run from Sub-Saharan Africa. While the whole world fusses\
    \ over the feasibility of cryptocurrencies, the Africans seem to be quite comfortable\
    \ with trading in Bitcoin, among other things. This comfort level is easily seen\
    \ in the booming manner in which the value of the crypto market has grown in this\
    \ region. This is, of course, because the alternative in the form of traditional\
    \ banking is much more problematic and hasn’t been able to match up to the blockchain-based\
    \ financial solutions. We shall look at these in more functional detail in our\
    \ section on banking; but, for now, let’s look at what’s happening in Africa,\
    \ specifically."
