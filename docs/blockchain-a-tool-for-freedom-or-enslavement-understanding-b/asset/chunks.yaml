    I urge you to ask yourself, at this point—what is money? Depending, to a great
    extent, on the circumstances of your upbringing, you might answer that question
    very differently. Some might think of money as the well-deserved compensation
    for their hard work; others might think of money as a ticket to freedom. But,
    despite this affinity with money, there is often a conflict. Despite wanting money
    so desperately, there is also a fear that it will corrupt. Especially, if you
    have grown up in a household with humble means, you are sure to have heard at
    least once growing up that money is the root of all evil in the world. On the
    other end of the spectrum, if you have been raised in an affluent family, there’s
    a high chance that money is just considered a natural way of existence. Both the
    exaggerated negative view and the trivialized taken-for-granted approach towards
    money can have significant behavioral manifestations, which can eventually turn
    into grave economic attitudes, as well as consequences.


    Let’s talk about this money is the root of all evil fallacy. No matter what political
    ideology you belong to, it’s likely that you have at least somewhat been influenced
    by the socialist ideals where we might think of money in moral and ideal terms
    rather than in factual and practical ones. Assigning human-like qualities of good
    and evil to money is rather pointless. Having said that, though, money would have
    to be the greatest invention of all time because it signifies a medium of exchange.
    Without it, there would be no trade, no production, and no growth. The prosperity
    that you see around you—every single thing that makes your life easy and comfortable—was
    originally produced because the producer knew that he would be fairly compensated
    for his efforts in this very medium. To call money the root of evil would be grossly
    unjustified.


    We have often been made to believe, rather implicitly, that wanting to make money
    and become rich is somehow opposed to humanistic values. This could not be farther
    from the truth. Without an appropriate medium of exchange, human civilization
    capable of values and virtues would never have been possible, to begin with. When
    you think of Abraham Maslow’s hierarchy of needs in this context, you would realize
    that, without meeting the physical needs of food, shelter, safety, etc.—which
    are the result of having an exchange medium—you would never progress to emotional
    growth in terms of virtues and values. Without money, we would probably still
    be the nomadic savages hunting and wandering around, looking for a cave to feel
    safe.


    One thing that probably needs to be clarified is that the money that we talk about
    here is not necessarily fiat money with an arbitrary value. We talk about the
    problems with that in a later section. Money, as we understand it historically,
    would be a store of value. This store of value cannot be condemned as evil. If
    we do that, we are also labeling the entire economic, social, and political history
    that we, as humans, have strived for, for thousands of years, as immoral.


    Ayn Rand’s `Atlas Shrugged (1957)` has a compelling argument in this regard. If
    you haven’t already, I strongly suggest you read this book—it’s a long book, but
    if you don’t have the time, at least go and listen to “Francisco’s money speech”
    on YouTube. I guarantee it will blow your mind. This speech has a powerful line:


    > When money ceases to be the tool by which men deal with one another, then men
    become the tools of men. Blood, whips, and guns—or dollars. Take your choice—there
    is no other—and your time is running out. (Goldsilver with Mike Maloney, 2014)


    ## Keynesians, Monetarists, and Austrians


    Milton Friedman once famously said, “We are all Keynesians now” (Burman, 2007).
    In order to understand the fine nuances of that statement, we would have to go
    back and understand this theory, at least briefly. It’s only when we contrast
    this theory to the Austrian theory that we shall be able to understand what each
    one means for the future of blockchain technology.


    Let’s start at the very beginning. I am sure you have heard the term `macroeconomics`,
    and the length of that word is enough to turn right around and make a run for
    it! In reality, though, `macroeconomics` would only mean the study of economic
    behavior at the national level, as opposed to `microeconomics`: which studies
    economic behavior at more individual, or group, levels. As you may have guessed,
    macroeconomic understanding is much more crucial than a microeconomic one. It’s
    also important to note that the Austrian school of economics doesn’t necessarily
    subscribe to this division of macro and micro (but more on that in a little while).
    For now, let’s keep this broad understanding of `macro` and `micro` variables
    in the background of our discussion.


    So, let’s discuss `macroeconomics`! For hundreds of years, economists have put
    forth different viewpoints about how national economies function, or how they
    should function, for the most optimum output. George Bernard Shaw once said, in
    good humor, “If all economists were laid end to end, they would still not reach
    a conclusion” (George Bernard Shaw Quotes, n.d.). As if to prove him right, several
    theories have been proposed over time, each one priding itself to be superior;
    but here, we shall focus on the Keynesian, monetary, and Austrian models to see
    how they fare in the context of the current global economy. Now, I want you to
    understand that I don’t pretend to be an economic expert, but I have picked up
    a few learnings along the way which I believe are paramount to the big-picture
    understanding of blockchains in our economy.


    Though the Keynesian, monetary, and Austrian economic debate has been raging for
    centuries, the recent Central Bank policies have made it more relevant than ever
    before. Keynesian economics, founded by John Keynes, looks at aggregate demand
    as the main focus of an economy. Keynesians strongly advocate government intervention
    in order to alleviate the impact of recessions, inflation, and other market failures.
    They believe that when governments alter their financial policies by increasing
    spending and lowering taxes, they would play a major role in stimulating demand
    within the masses and encourage them to increase their expenditures, thereby contributing
    to the growth of the economy. This is generally the way most have understood national
    economic growth, for ages now.


    A very similar perspective is provided by the monetary economic theory, though
    this school claims to present quite an antagonist view. This view advocates a
    slightly passive approach, as compared to the Keynesian viewpoint, in that they
    believe that the government should only control the flow of money into the economy
    and the rest of the market will automatically fix itself. Thus, they are essentially
    pointing to the notion that the government doesn’t necessarily have to intervene
    to push the buyers to buy more, as the Keynesian school of thought suggests, but
    rather manipulate the money flow and wait for the puzzle pieces to fall together.
    Think of the economy as a car that’s having problems with starting up—a monetarist
    driver would focus on filling up the tank more than anything, whereas Keynesians
    would focus on revving up the engine.

