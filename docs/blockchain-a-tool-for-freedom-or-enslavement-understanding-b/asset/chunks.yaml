    There is also another alternative to the above method. While what I describe above
    refers to proof of work (`PoW`). There is also the proof of stake (`PoS`) method,
    which is much more feasible for someone who wishes to mine blockchains on, let’s
    say, a home `PC`. So, if you have been thinking that blockchains and mining are
    out of reach for the common folks like you and me, then that’s not the case at
    all. Anyone and everyone with a computer can have a blockchain-based business
    from home producing regular blocks of data. Let’s see how this is possible.


    ## Consensus Mechanisms


    The strength of blockchain technology lies in its decentralized nature. Consensus
    mechanisms have a lot to do with this strength. Depending on the area of application,
    the type of consensus mechanism a blockchain would employ would be one of the
    three used frequently—proof of work (`PoW`), proof of stake (`PoS`), and delegated
    proof of stake (`DPoS`). Though there are multiple other mechanisms that have
    been developed, these three seem to be the most popular.


    - **Proof of Work**: What we discussed in the last section is termed as `PoW`.
    This is where a miner has to prove that he has worked towards decryption and validation.
    The difficulty of the mathematical puzzles increases as the blocks are being mined
    faster. If the miner reaches the puzzle solution quicker than the others, they
    are rewarded the block—which acts as an incentive to work more efficiently.


    They are the most expensive of all types of consensus mechanisms for the simple
    reason that they utilize large amounts of resources: human as well as technological.
    Though this is the type of consensus that was originally desired by `Satoshi`,
    it has been coming under fire often due to the sheer energy that it utilizes,
    and hence the development and evolution of other mechanisms.


    - **Proof of stake**: In `PoW` mechanism, every miner has an equal opportunity
    to solve the puzzle and find the block. Here though, the miner who has the most
    number of tokens gets to be the validator for block transactions. These validators
    can stake their tokens and, on the basis of who has had these tokens the longest
    or has the most staked tokens, are randomly assigned the opportunity to create
    the next block. These validators are then rewarded with either the transaction
    fees or cryptocurrency tokens. This consensus mechanism is much more energy efficient,
    compared to the `PoW` consensus.


    - **Delegated proof of stake**: This is quite the democratic version of the `PoS`
    mechanism. Here, the users with stake (in the form of tokens) have the power to
    vote for the delegates who would get the chance to produce the next blocks. The
    weightage given to every vote depends on the proportion of stake those users hold.
    Besides being among the fastest consensus mechanisms, it also brings in a unique
    digital democracy to the world of blockchains.


    As mentioned above, these aren’t the only consensus mechanisms out there, but
    they sure are the most popular. When you take a close look, you’ll ascertain that
    no matter how highly we talk of blockchain technology, consensus mechanisms, and
    the potential for security, none of it would mean a thing if people didn’t take
    charge. When you look at the consensus mechanisms, especially, it isn’t too hard
    to notice that this protocol, if given in the hands of powerful institutions,
    fails the point of blockchains, altogether. You might wonder, why then is this
    technology any different and/or revolutionary? The truth is, blockchains give
    people like you and me the opportunity to participate like the traditional systems
    never have. And, it’s up to us to make the most of this opportunity.


    ## The Game Theory of Decision-Making


    Another aspect of this technology that we just cannot skip over is the decision-making
    model in this widely distributed system. While consensus mechanism is how the
    nodes reach a decision, why they should feel incentivized to reach there is a
    completely different ball game. Why, for instance, should I keep the good of everyone
    on the system above my own good? Why not cheat my way through it to get the best
    output for myself? The peers that share the network are not from another planet
    and are bound to share the flaws that we, as a human race, share—greed, corruption,
    all of it. But, the whole point of blockchains from the get-go has been to create
    a decentralized system where the flaws of one do not become the weakness of all.
    Game theory explains this perfectly.


    Game theory is nothing but the strategic decision-making model employed on blockchains
    that mathematically predicts the success of all strategic options available to
    the node. Let me try to explain this through something called "prisoners’ dilemma."
    Let’s say two individuals, `Pete` and `Tom`, are arrested for shoplifting. There
    are no other witnesses to the crime, and the case against them can be held only
    with a confession. Logically, there is a definite series of outcomes that can
    be expected in this.


    1. One of them may confess and the other may deny the charges.

    2. Both of them may deny the charges.

    3. Both of them may confess to the charges.


    The best possible scenario in this case would be for both of them to flat out
    deny the charges. The worst that can happen, in that case, is they might be fined
    a minimal amount or receive scolding from the police officers. It’s simple, isn’t
    it? But, here’s the dilemma—since they are being interrogated separately, neither
    can be sure that the other person will deny, too. If, for instance, `Pete` denies
    and `Tom` testifies to become the witness, `Pete` will get the maximum punishment
    while `Tom` will be out free without any punishment at all. Now, this can feel
    like a tempting option for `Tom` because he gets to keep his record clean. But,
    in reality, this is a worse outcome; because `Pete` is getting a bigger punishment,
    he may be fined and sent to jail for five days. Go a step further and imagine
    that `Pete` also thinks the same way and rats `Tom` out. `Tom` and `Tom` have
    have both betrayed each other and will now both be punished with fine and jail
    for five days. This is known as the prisoners’ dilemma, where `Tom` and `Pete`
    both decided to serve their own interests, when in reality it would have been
    much more beneficial for both to have each others’ backs.


    The game theory model simply puts a numerical value to the probability of outcomes
    here:


    | | Pete Testifies | Pete Doesn’t Testify |

    | --- | --- | --- |

    | Tom Testifies | 5, 5 | 0, 5 |

    | Tom Doesn’t Testify | 5, 0 | 0, 0 |


    So, how does this relate to the game theory of decision-making on blockchains?
    Remember that blockchains are designed in a way that the system rewards miners
    only if the transactions are validated by multiple nodes. If the miners are cheating
    or manipulating data, then it invalidates the blocks and the miner may be ousted.
    That means that cheating on a blockchain to put one’s selfish interests ahead
    of the network’s is quite the waste of time. On the contrary, if miners keep the
    transaction data clean, thereby putting the welfare of the system ahead of their
    own interests, they can continue to earn substantial rewards. Thus, blockchains
    inherently encourage its nodes to do what’s best for the group.


    ## Common Features of the Technology


    The elements mentioned above aren’t just fancy terms, but actually result in the
    strength of blockchains as we know it. But, it’s not enough to just know the terms
    and not pay attention to the core features that these individual elements culminate
    into. Aspects that fulfill all those promises that I made to you about blockchains
    are distributed ledgers and smart contracts.


    ### Distributed Ledgers

