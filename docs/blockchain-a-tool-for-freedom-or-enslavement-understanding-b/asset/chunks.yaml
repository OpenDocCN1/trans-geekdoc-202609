- raw: "As we have seen throughout, innumerable people are doing meaningful work to\
    \ protect the voices of this disenfranchised population. The work that I have\
    \ witnessed while doing the research for this book and the people that I have\
    \ met have made me believe, through their actions, that no matter what—the human\
    \ will and determination, and most of all, the voice of kindness and equality\
    \ makes a way somehow, even against the odds. It’s like the tiny and bright dandelion\
    \ that sprouts through a crack in a concrete block, refusing to die out, making\
    \ the block infinitely more beautiful. \n\nBut, be cautioned that this technology,\
    \ like any other revolutionary mechanization, is a ticking time bomb in the wrong\
    \ hands. Remember that the technology that can liberate us from oppression can\
    \ be also used by the oppressors to further their undemocratic agenda. As I have\
    \ mentioned repeatedly throughout the book, until and unless we take our designated\
    \ posts, you can be certain that this battle will be won by those oppressors.\
    \ And hence, I urge you to take part in blockchains to keep the decentralized\
    \ principle alive.\n\nI hope this book has given you more than just information.\
    \ And, like I said, the true success of this book would be your active participation\
    \ and awareness of the blockchains around you—that is the only way to keep it\
    \ from being encroached upon as other technologies have been. If this book and,\
    \ more so, the technology have resonated with you, I hope that you will start\
    \ conversations around it with your friends, family, and even those with opposing\
    \ views. The only way to break the silos is peaceful, persistent, and proof-backed\
    \ conversations. Without these, no democracy can ever be immune to the dangers\
    \ of authoritarianism. So, talk away. Also, if you enjoyed reading this book,\
    \ do leave a comment on Amazon. It will be immensely helpful in reaching more\
    \ people. Proceeds of this book shall go to the West Africa Decentralized Alliance—my\
    \ two cents in their ever expanding journey. As for you, my friend, I hope you\
    \ embrace blockchains with your whole heart and let them free you, never to be\
    \ enslaved. \n\n# References\n\nAbout stake pools, operators, and owners. (n.d.).\
