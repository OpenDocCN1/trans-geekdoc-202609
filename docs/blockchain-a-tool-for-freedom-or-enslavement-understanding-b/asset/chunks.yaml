    \ privileged. There is, of course, another major aspect of Austrian economics\
    \ in that equation that deserves just as much detailed attention as everything\
    \ else. \n\n# Chapter 5: The Economical Implications\n\nMan himself is the beginning\
    \ and the end of every economy.\n\n\\-          Carl Menger\n\nThe current global\
    \ economic system has left very many gaps that blockchains are primed to fill.\
    \ A survey by PricewaterhouseCoopers in 2020 revealed that blockchains could boost\
    \ the global gross domestic product (GDP) by $1.76 trillion by 2030. Can you imagine\
    \ the scope of blockchains if these statistics were to be trusted, even partly?\
    \ Even though you don’t need to be an economic genius to understand the astonishing\
    \ beauty in those numbers, you might have to get a grip on a few basics when trying\
    \ to understand the subtler ways a blockchain can be incorporated into an economy.\
    \ \n\nAs rightly put by the founder of the Austrian school of economics in the\
    \ above quote, the human resource is the most important determinant in any economy.\
    \ But, for a long time now, the common man has been kept removed from the workings\
    \ of the economy under the propagated notion that these things are simply too\
    \ complex for the layman to understand. Even our school curricula conveniently\
    \ leave it out when they need to be teaching it with the same gusto, if not more,\
    \ as math, biology, and other so-called important sciences. While the notion that\
    \ economics is complex may carry an iota of truth, things are not nearly as complicated\
    \ as they are made out to be. We are going to demystify the economics of it all\
    \ and place it in the context of blockchains. \n\nFor centuries now, economists\
    \ have tried to understand human behavior from the vantage point of exchange of\
    \ value. And, hundreds of years’ worth of experience with economic human behavior\
    \ tells us that we humans like it when we lower the uncertainty of the transaction,\
    \ as well as the people we are transacting with. Nobel laureate Douglas North,\
    \ the founder of New Institutional Economics, believed that all through history,\
    \ we have relied on institutions to lower this uncertainty. For the first time\
    \ ever in our economic history, we have the chance to take this blind faith in\
    \ our institution out of the equation and establish transactions which are certain,\
    \ as they are verified not by middlemen institutions, but people like you and\
    \ me. This is why it becomes important for us to understand the economic implications\
    \ of blockchains, as they continue to lower the uncertainty in our transactions.\
