    \ (2022, 1 月 2 日). LoopBlock 网络将为 100 名尼日利亚人提供区块链技术培训。Businessday NG。[`businessday.ng/news/article/loopblock-network-to-train-100-nigerians-in-blockchain-technology/`](https://businessday.ng/news/article/loopblock-network-to-train-100-nigerians-in-blockchain-technology/)\n\
