    is advertised and the transactions run smoothly.


    Now, the disruption is this: `NFTs` are empowering artists and creators to make
    a living doing what they love. The technology that they have added to the mix
    can help these artists reach and engage with a much larger crowd directly, without
    any agents. The other benefit that these `NFTs` bring to the artists is the undisputed
    record of ownership. While, in traditional art, there are a lot of feuds about
    the original vs. fake, here the possibility never arises. From an artistic point
    of view, NFTs provide yet another medium to pour onto the canvas or rather the
    screen, all of the artist’s creative expression. Furthermore, the `NFTs` can bring
    about a much more unbiased and unskewed market, giving equal opportunities to
    artists regardless of gender, race, etc.


    `NFTs` also solve the problem of royalties for the artists. Consider this scenario:
    In the traditional art industry, though the artist holds the rights to his work,
    there would be no way for them to know if their painting has been sold or pirated.
    Thus, even though the concept of royalties exists in theory, in practicality it’d
    be quite difficult to enforce. However, on the blockchains, with the use of `smart
    contracts`, the artists can make sure they receive a certain portion of the consequent
    sales.


    `NFTs` will also change the landscape of art collection, so to say. The art collector
    will no longer have to be a rich man, sipping wine from the glass in one hand
    and holding a cigar in the other. Since the collection remains online, anyone
    with the slightest propensity towards art can purchase an `NFT`. The prices can
    start as low as `$12` and go up to hundreds of millions, giving the purchaser
    a wide variety of choices.


    Another aspect to consider here is that `NFTs` don’t have to be just artwork,
    but could be anything from music, photos, or anything at all. Any music fan would
    know that, historically, recording labels have not been the most respectful toward
    the artists. This reality—which was, for the most part, kept under rug previously—was
    publicly exposed when the legendary Prince wrote ‘slave’ on his face, comparing
    his contract with `Warner Bros. ` to slavery. The recording labels have continued
    to have that hold over musicians, more often than not handing them the shorter
    end of the stick. With the emergence of `NFTs`, however, that can change as artists
    are ditching the labels altogether and selling their work directly to the listeners
    in the form of `NFTs`.


    The same goes for comics selling their standups as `NFTs`. `Jamb` is a comedy
    collectible startup that is raising millions for building a marketplace for `comedy
    NFTs`. Apart from raising money for comedy sets, `NFTs` also offer the censorship-free
    zone to these comedians, to create satirical pieces. Comedians have often come
    under fire for making comedy, which is exactly what they are supposed to do. But,
    there seems to be a wave of the cancel culture, whereby people believe that anything
    they don’t agree with needs to be condemned publicly, and abusively.


    With the woke pseudo-liberals waiting at every turn to cancel a comedian’s right
    to free speech, the social climate is becoming ever more insecure. This self-proclaimed
    moral police hate comedians who do commentary on current events. I wonder if it
    is because they speak the truth—a truth so pathetic that it lands itself into
    the hilarious realm? Blockchains and `NFTs` can certainly breathe new life into
    this artform. One thing is certainly true: The implications of `NFTs` run far
    and wide for all genres of art.


    This may seem like `NFTs` are specifically, and only, for the artist niche; but,
    the truth is that, in recent times, `NFTs` have emerged as the hot property in
    the investment sector. Until `2021`, hardly anyone really knew what `NFT` were;
    but, with the `metaverse` talks gaining momentum, `NFTs` have peaked in popularity,
    too, as the idea of holding commodities in a virtual universe seems that much
    more exciting.


    ## Decentralized Social Media


    Social media is almost a vital part of our social lives today—one we almost cannot
    do without. You’d think it is almost mandatory to post everything, right from
    what you eat to where you are, on your wall. But, at what point can we say that
    our social media platforms stop connecting and start intruding?

    '
  trans: '

    除了这些之外，区块链还带来了两个额外的好处。第一是忠诚度和奖励，我们之前在讨论小创业者时已经提到过。第二个好处甚至更加奇奇：客户评价。同样，不可篡改的原则在这里发挥了作用，但其呈现方式却非常新颖。在基于区块链的电子商务平台上，当客户留下评价时，该评价无法被更改，无论变好还是变坏。因此，这些评价可能更具可信赖可靠性。


    # 第 13 章：艺术与文化


    艺术与文化是任何文明的关键基石。只有当创造力被允许不受审查限制地自由飞翔时，思想、观点和情感的自由表达才成为可能。艺术自由结合对窒息性中心化审查的缺失，可以创造出动人心的作品。但，缺乏审查只是冰山一角。区块链与艺术才华交织在一起，正在创造许多值得关注的项目，导致了艺术本身的多样化方法，同时也为收藏家和艺术爱好者创造了不断增长的市场。


    ## 非同质化代币 (NFTs)


    区块链在艺术和文化领域的一个大用例是非同质化代币（NFT）。我们之前以非常粗略的形式提到过这些，但现在是时候深入挖掘了。为了向你简要回顾一下 NFT 是什么，我们可以说它们是区块链支持的数字代币。这些代币可以是音频剪辑、视频、一件数字艺术品等等；并且它们可以与加密货币绑定。现在，让
    NFT 不同于加密货币的在于，虽然后者具有相同的价值，但前者并非如此。这意味着，我说 `Bitcoin` 价值某个金额时，每个 `bitcoin` 都有相同的汇率；但，当我谈论
    `NFTs` 时，每个 `NFT` 就像一个价格不同的商品。所以，就像两件艺术品的价格不会一样，两个 `NFTs` 的价格也不会一样，因为艺术品本身就是它们所拥有的样子。所以，就像你购买
    `Bitcoin` 时会获得一个唯一的密钥一样——当你购买 `NFTs` 时，你也会获得一个独特且安全的数字代币。


    对于外行人来说，你收到的数字文件看起来可能没什么大，但对于艺术鉴赏家和收藏家来说，它绝对值他们在这些艺术品上花费的数百万美元。它意义的不仅仅是拥有这件作品；本质上意味着这些人已经永远地进入了该作品的数字历史之中，且远不止。然而，通过这次购买，艺术行家并不拥有作品的版权，版权仍然属于艺术家。这意味着艺术家可以创作更多像你拥有的那样的作品——就像限量版棒球卡之类的。出现了一些
    `NFT` 市场，如 `SuperRare`、`OpenSea`、`Nifty Gateway`、`MakersPlace` 等，它们对每件售出的艺术品收取佣金。作为回报，它们确保艺术品得到广告并确保交易顺利运行。


    现在，这种颠覆性在于：`NFTs` 赋予了艺术家和创作者从事他们热爱的事业来维持生活的。他们加入其中的技术可以帮助这些艺术家直接接触并吸引更广泛的群体，而不需要任何代理人。这些
    `NFTs` 为艺术家带来的另一个好处是不可置疑的所有权记录。在传统艺术中，有很多关于真品与伪品的争端，而在这里，这种可能性永远不会出现。从艺术的角度来看，NFTs
    提供了另一种媒介，可以在画布（更准确地说是屏幕）上倾注艺术家所有的创作表达。此外，`NFTs` 还能带来一个更加公正、无偏见的市场，无论性别、种族等，都为艺术家提供平等的机会。


    `NFTs` 还解决了艺术家的版税问题。考虑这样一个场景：在传统艺术行业中，尽管艺术家拥有其作品的权利，但他们没有办法知道自己的画是否被售出或被盗版。因此，尽管版税的概念在理论上存在，但在实践中很难执行。然而，在区块链上，通过使用
    `smart contracts`，艺术家可以确保他们获得后续销售的某部分收益。


    `NFTs` 还将改变艺术收藏的格局，可以这么说。艺术收藏家将不再需要是一个手里拿着杯子喝葡萄酒、另一只手拿着雪茄的富翁。由于收藏品保持在线，任何对艺术有轻微倾向的人都可以购买
    `NFT`。价格可以从 `$12` 开始，一直涨到数亿，为购买者提供了广泛的选择。


    这里另一个需要考虑的方面是，`NFTs` 不一定仅仅是艺术品，可以是音乐、照片或任何东西。任何音乐迷都会知道，从历史角度来看，唱片公司对艺术家的并不尊重。这种现实——以前在大多数时候被掩盖的——在传奇人物普林斯（Prince）在他脸上写下“奴隶”字样，并将与
    `Warner Bros.` 的合同比作奴隶制时被公开了。唱片公司继续对音乐人保持这种控制，而且往往让他们他们处于劣势。然而，随着 `NFTs` 的出现，情况发生了改变，因为艺术家正在完全抛弃唱片公司，并以
    `NFTs` 的形式直接向听众出售他们的作品。


    漫画将他们的表演作为 `NFTs` 销售也是如此。`Jamb` 是一家喜剧收藏品初创公司，正在筹集数百万美元建立一个 `comedy NFTs` 市场。除了为喜剧节目筹集资金外，`NFTs`
    还为这些喜剧演员提供了一个不受审查的区域，让他们创作讽刺作品。喜剧演员经常因为创作幽默而受到攻击，但这恰恰是他们应该做的。但，似乎出现了一股取消文化的浪潮，人们认为任何他们不同意的事情都需要受到公开的、辱性的谴责。


    随着觉醒的伪自由主义者随时准备取消喜剧演员的言论自由，社会氛围变得越来越不安全。这些自认为道德警察的人讨厌对时事进行评论的喜剧演员。我怀疑这是否是因为他们说了实话——一个卑微到足以落入幽默领域的真相？区块链和
    `NFTs` 确实可以为这种艺术形式注入新的生命。有一点是肯定的：`NFTs` 的影响远及所有艺术类型。


    这可能看起来 `NFTs` 专门、且仅针对艺术小众；但事实是，在近期，`NFTs` 已成为投资领域的热门资产。在 `2021` 年之前，几乎没有人真正知道
    `NFT` 是什么；但随着 `metaverse` 话题的增加，`NFTs` 的人气也达到了顶峰。


    ## 去中心化社交媒体


    社交媒体几乎成为我们今天生活的生活的组成部分——我们几乎无法离开它。你可能会认为，把吃什么、去哪里等一切发布在你的主板上几乎是强制性的。但，到什么时候我们才能说我们的社交媒体平台停止了连接并开始侵入了？


    '
