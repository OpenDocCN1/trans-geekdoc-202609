    \ recorded in one place for authorized doctors to access, in itself, can be life-saving.\
    \ Add to this more aspects like eradication of the counterfeit drug trade, and\
    \ we have a truly life-changing combination of healthcare and blockchains.\n\n\
    Even within the healthcare industry, multiple sectors can be identified where\
    \ the actors have realized the potential that blockchains can bring to the table.\
    \ Having said that, though, there is also a distinct resistance to the change\
    \ in systems on the part of healthcare professionals. While tablets and computers\
    \ are the medium of entering patient data in the system for modern facilities,\
    \ not many would fall under this category. There is still a particular distrust\
    \ about the electronic data being susceptible to hacking attacks. This fear is,\
    \ of course, not completely unfounded, and transferring the systems onto blockchains\
    \ can satisfactorily rule out this concern. Rather than a technological concern,\
    \ this falls more under an awareness problem.\n"
  trans: '


    这看起来似乎只是为了企业的利益，对普通人没有太大帮助。这种说法只有部分正确。像你我这样的人可能不会直接受到此影响，但让我们面对现实：贸易影响着每个人，即使你不是某些特定贸易产品的消费者。它是我们经济的支柱。欺诈性贸易往往是由腐败文化的滋生所推动的，而这种文化无疑影响着每一位公民。如果贸易开始崩溃，谁也知道下一个出现在名单上的会是什么。


    ## 保险


    目前的中心化保险系统存在的主要问题，很大程度上在于它在试图核实理赔和检测欺诈（如果有的话）时产生的成本。产品开发、管理、文档记录、理赔验证以及其他多种协议的繁琐过程消耗了大量时间。虽然对于大实体来说这区别不大，但较小的实体可能会感到被困在这样的系统中——一方面，保费可能高到无法负担，但让自己和家人暴露在灾难面前似乎可能更可怕。


    这就是微保险（microinsurance）概念的用武。微保险与微型金融的概念非常相似，旨在为那些可能负担不起太多高端保险产品的人提供保护。`ACRE Africa`
    在肯尼亚针对小农户成功地运营这种模式。在接触弱势群体时，保险公司必须尝试理解基层产生的问题。例如，`ACRE Africa` 已经识别出传统保险系统中让农户望而远之的一些主要问题。


    除了负担能力，这些农民似乎对他们支付的保费是否真的能以理赔结算的形式回到他们手中持态度。对传统系统信任的侵蚀问题再次显现。缺乏透明度的相关因素也起了作用，而结算前的漫长周期使这种状况变得更加糟糕。区块链驱动的
    `ACRE Africa` 正通过将“无须信任赖”带回系统来改变这一切。此外，以前需要消耗大量资源和资金的整个过程，可以在区块链系统上一次性完成。这导致了公司以及农民成本的大幅下降。


    另一个方面是，中心化系统通常具有僵化的数据点，如果被保险人的情况稍微偏离标准，资金发放可能会卡在循环中。为了理解这一点，请考虑一位作物遭受蝗灾侵袭的农户。在中心化保险系统中，理赔可能会根据该地区的状况进行结算。如果该地区的其他农场没有被毁，保险公司可能会决定该农户不符合理赔条件。


    如果同样的情况发生在基于区块链的保险公司，理赔将在 `smart contracts` 的帮助下发放，智能合约具有考虑灵活数据点的条款。因此，理赔验证将基于从安装的传感器中获取的数据，这些数据会触发
    `smart contract` 并自动、实时释放资金。因此，蝗灾会立即被传感器捕捉到，使得繁琐的尽职调查程序几乎变得多余。时间线现在从平均三周缩短到在当天收到结算。


    区块链保险的另一个用例将与我们在下一节中讨论的医疗保健有关。目前，重要的是记住医疗保健系统迫切需要这种有意义的变革。我们已经在非洲的章节中看到了区块链对医疗保健产生的影响。患者记录被安全地记录在一个处以供授权医生访问，这一简单事实本身就能拯救生命。再加上根除假药贸易等等更多方面，我们得到了一个医疗保健与区块链相结合的、真正改变生活的组合。


    即使在医疗保健行业内部，也可以识别出多个领域，这些领域的参与者已经意识到了区块链能带来的潜力。尽管如此，医疗卫生专业人员对系统的变革也存在明显的抵触情绪。虽然在现代设施中，平板电脑和电脑是系统中输入患者数据的媒介，但许多地方并不属于这一类别。人们对于电子数据容易受到黑客攻击仍然存在特别的不信任。这种担心当然不是完全空穴的，而将系统转移到区块链可以圆满地解决这一忧虑。与其说这是一个技术问题，不如说这是一个意识问题。


    '
