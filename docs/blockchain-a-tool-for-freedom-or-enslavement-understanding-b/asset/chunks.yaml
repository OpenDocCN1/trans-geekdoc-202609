- raw: "In 2018, a free trade area called African Continental Free Trade Area (AfCFTA)\
    \ was founded, with the actual trade kick-starting in January 2021. This was a\
    \ massive undertaking, and is considered to be the largest free trade area globally\
    \ connecting billions of people across multiple countries. Free trade area only\
    \ means that this region has entered into an agreement which would allow for minimal\
    \ policy restrictions with regards to trade, and can thus help in boosting economic\
    \ growth. An intriguing observation can be made here—while developed nations have\
    \ been recently moving towards more governance-based solutions for their socioeconomic\
    \ problems, it seems that developing nations are utilizing the capitalist tenets\
    \ of trade to resolve theirs. \n\nAs exciting as it is, there are multiple hurdles\
    \ along the way. Access to processing of trade documents is one of them. Trade\
    \ documents may include several crucial things: like certifications, insurance\
    \ papers, and so on. These would have to be perfectly in place, even more so as\
    \ the trades are happening across national borders. Another concern, high on the\
    \ list, would be the currency conversion across borders, which would result in\
    \ piling up of costs as well as an extension of the timeline to settlements. Blockchains\
    \ have been looked at as the most appropriate platform to tackle these issues.\n\
    \nWhile the AfCFTA is still finding its way through the legislation regarding\
    \ rules of origin, the associated countries remain hopeful. The COVID-19 pandemic\
    \ has also had an interesting impact on this whole process. On one side, it has\
    \ shaken up the economies of multiple countries, leaving the trade in these regions\
    \ severely impacted. But, at the same time, it has also acted like a wake-up call\
    \ for African countries that widely depend on export of commodities to start taking\
    \ their internal trades, as well as trades with other countries. This might have\
    \ been the much-needed impetus for the African countries to speed up the AfCFTA\
    \ activities. \n\nIt is interesting to note, however, that blockchains are already\
    \ helping the trade scenario beyond AfCFTA. Though AfCFTA now seems poised to\
    \ catalyze the trade boom, it is still in its early stages; this means each country\
    \ could have different customs procedures requiring several documentations, as\
    \ we discussed, even in AfCFTA. The difference would be that, while AfCFTA would\
    \ have a uniform procedure, the formalities that need to be completed in a regular\
    \ scenario may be widely different in each country and worse, still, even at each\
    \ port. \n\nThese red tape legislations have traditionally created massive barriers\
    \ to entry for small-scale businesses. With blockchains, these can be reduced\
    \ drastically, if not eliminated altogether. Rather than submitting separate trade\
    \ documents at every point in the trade route, one could upload the information\
    \ on a blockchain once, and it is there for all authorities on the chain to view.\
    \ TradeLens is a platform that currently helps entrepreneurs to do exactly this.\
    \ Traders can upload their information and trace the location of their shipment\
    \ throughout the journey. However, with only a limited number of port operators\
    \ signed up on this particular platform, there remains room for improvement.\n\
    \nThe prosperity that these initiatives can unlock in these regions is beyond\
    \ consequential. Remember that blockchain-aided trade, and especially free trade,\
    \ allows the small players to enter the global markets. Whether it’s Tunisian\
    \ olive oil, Zambian cassava, Rwandan coffee, or the Cote d'Ivoire cocoa that\
    \ we talked about earlier, the African continent has tremendous potential. All\
    \ this while, though these resources were exploited (many times unethically),\
    \ the returns hardly reached the ones who deserved to be paid for their hard work.\
    \ The profits were snatched by middlemen and corrupt government officials, leaving\
    \ the actual producers in the lurch almost every time. Today, with blockchains,\
    \ the traders have an opportunity to make profits while also giving the well-deserved\
    \ share to the small farmers.\n\nAll in all, the trading scenario in the African\
    \ countries is very much on the brink of a breakthrough. Blockchains have been,\
    \ and will certainly in the future be, a valued ally in going the extra mile.\
    \ \n\n## Peer-to-Peer Electricity Model\n\nThe electricity crisis is a real struggle\
    \ for African countries. It would seem that there is a perpetual shortage of produced\
    \ electricity in comparison with the actual needs of the population. Despite importing\
    \ noisy and not-so-environment friendly power generators, an overwhelming percentage\
    \ of rural African territory remains in the dark. Even though the governments\
    \ across the continent have made promises of electrification, universal access\
    \ seems like a distant dream, especially for the rural underprivileged sections\
    \ of the continent. \n\nBecause of the high cost of power generation, many countries\
    \ have now started looking at utilizing renewable sources of energy , especially\
    \ for communities that are largely off-grid. In such areas, projects to harness\
    \ solar and wind energy have received great encouragement in the form of investment\
    \ from several financial institutions. But, even with this development, renewable\
    \ energy—as a resource to power rural territories—still does not match up to the\
    \ needs of the population. The major reason for this is the focus on the number\
    \ of connections and megawatts installed, rather than the actual reach of the\
    \ power produced. This is where the decentralized power comes into the picture.\n\
    \nAn important development has been the upcoming decentralized power where home\
    \ solar panels have been installed on individual homes, or micro/mini grids have\
    \ been installed to power small communities. The real game changer lies ahead,\
    \ though. The houses that produce more energy on their solar panels than they\
    \ use can sell this excess energy to those houses which have no solar panels.\
    \ This way, it’s a win-win for both parties—the one installing panels in their\
    \ homes can repay the loans taken for the installation while enjoying their uninterrupted\
    \ power supply and the ones who cannot afford to install these panels by paying\
    \ for only the energy that they use. The transactions, of course, happen through\
    \ the cryptocurrency in use on the blockchain. A mobile app called Exergy, powered\
    \ by blockchain, has been helping keep track of such trades across Africa. It\
    \ is these peer-to-peer electricity lending initiatives that are making it possible\
    \ for the small consumers, who would never be on any big power company’s radar\
    \ to gain access to electricity, and also achieve financial inclusion in the process\
    \ with cryptocurrency. \n\n## The Cardano-Powered Projects\n\nAs the blockchain\
    \ movement gains momentum, these ecosystems are mushrooming everywhere. They may\
    \ not be as big as their potential as of now, but are surely on the way to impacting\
    \ massive social change. One such blockchain company that intrigues me is Cardano.\
    \ I have mentioned it multiple times already, but I believe this chain has true\
    \ potential because of its truly decentralized nature and the desire to use technology\
    \ for social good. Cardano has undertaken massive blockchain projects in Africa,\
    \ some of which we have already discussed before. But, there are also smaller\
    \ projects that they are collaborating on which are likely to have great cumulative\
    \ impact on the African economy, and also their self-sufficiency. \n\nWhile sophisticated\
    \ technological infrastructure is still largely missing on the African continent,\
    \ the near-ubiquity of smartphones (almost one phone per individual) is an aspect\
    \ that’s screaming to be utilized. Statistics from even a few years back are staggering.\
    \ For instance, in 2018, Kenya had a 94% mobile phone penetration and almost a\
    \ quarter of the population with access to the internet (Gadzala, 2018). That\
    \ was the highest in the world. Those numbers could have only gone up in the intermittent\
    \ years. "
  fmt: '

    In 2018, a free trade area called African Continental Free Trade Area (`AfCFTA`)
    was founded, with the actual trade kick-starting in January 2021. This was a massive
    undertaking, and is considered to be the largest free trade area globally connecting
    billions of people across multiple countries. Free trade area only means that
    this region has entered into an agreement which would allow for minimal policy
    restrictions with regards to trade, and can thus help in boosting economic growth.
    An intriguing observation can be made here—while developed nations have been recently
    moving towards more governance-based solutions for their socioeconomic problems,
    it seems that developing nations are utilizing the capitalist tenets of trade
    to resolve theirs.


    As exciting as it is, there are multiple hurdles along the way. Access to processing
    of trade documents is one of them. Trade documents may include several crucial
    things: like certifications, insurance papers, and so on. These would have to
    be perfectly in place, even more so as the trades are happening across national
    borders. Another concern, high on the list, would be the currency conversion across
    borders, which would result in piling up of costs as well as an extension of the
    timeline to settlements. Blockchains have been looked at as the most appropriate
    platform to tackle these issues.


    While the `AfCFTA` is still finding its way through the legislation regarding
    rules of origin, the associated countries remain hopeful. The COVID-19 pandemic
    has also had an interesting impact on this whole process. On one side, it has
    shaken up the economies of multiple countries, leaving the trade in these regions
    severely impacted. But, at the same time, it has also acted like a wake-up call
    for African countries that widely depend on export of commodities to start taking
    their internal trades, as well as trades with other countries. This might have
    been the much-needed impetus for the African countries to speed up the `AfCFTA`
    activities.


    It is interesting to note, however, that blockchains are already helping the trade
    scenario beyond `AfCFTA`. Though `AfCFTA` now seems poised to catalyze the trade
    boom, it is still in its early stages; this means each country could have different
    customs procedures requiring several documentations, as we discussed, even in
    `AfCFTA`. The difference would be that, while `AfCFTA` would have a uniform procedure,
    the formalities that need to be completed in a regular scenario may be widely
    different in each country and worse, still, even at each port.


    These red tape legislations have traditionally created massive barriers to entry
    for small-scale businesses. With blockchains, these can be reduced drastically,
    if not eliminated altogether. Rather than submitting separate trade documents
    at every point in the trade route, one could upload the information on a blockchain
    once, and it is there for all authorities on the chain to view. `TradeLens` is
    a platform that currently helps entrepreneurs to do exactly this. Traders can
    upload their information and trace the location of their shipment throughout the
    journey. However, with only a limited number of port operators signed up on this
    particular platform, there remains room for improvement.


    The prosperity that these initiatives can unlock in these regions is beyond consequential.
    Remember that blockchain-aided trade, and especially free trade, allows the small
    players to enter the global markets. Whether it’s Tunisian olive oil, Zambian
    cassava, Rwandan coffee, or the Cote d''Ivoire cocoa that we talked about earlier,
    the African continent has tremendous potential. All this while, though these resources
    were exploited (many times unethically), the returns hardly reached the ones who
    deserved to be paid for their hard work. The profits were snatched by middlemen
    and corrupt government officials, leaving the actual producers in the lurch almost
    every time. Today, with blockchains, the traders have an opportunity to make profits
    while also giving the well-deserved share to the small farmers.


    All in all, the trading scenario in the African countries is very much on the
    brink of a breakthrough. Blockchains have been, and will certainly in the future
    be, a valued ally in going the extra mile.


    ## Peer-to-Peer Electricity Model


    The electricity crisis is a real struggle for African countries. It would seem
    that there is a perpetual shortage of produced electricity in comparison with
    the actual needs of the population. Despite importing noisy and not-so-environment
    friendly power generators, an overwhelming percentage of rural African territory
    remains in the dark. Even though the governments across the continent have made
    promises of electrification, universal access seems like a distant dream, especially
    for the rural underprivileged sections of the continent.


    Because of the high cost of power generation, many countries have now started
    looking at utilizing renewable sources of energy, especially for communities that
    are largely off-grid. In such areas, projects to harness solar and wind energy
    have received great encouragement in the form of investment from several financial
    institutions. But, even with this development, renewable energy—as a resource
    to power rural territories—still does not match up to the needs of the population.
    The major reason for this is the focus on the number of connections and megawatts
    installed, rather than the actual reach of the power produced. This is where the
    decentralized power comes into the picture.


    An important development has been the upcoming decentralized power where home
    solar panels have been installed on individual homes, or micro/mini grids have
    been installed to power small communities. The real game changer lies ahead, though.
    The houses that produce more energy on their solar panels than they use can sell
    this excess energy to those houses which have no solar panels. This way, it’s
    a win-win for both parties—the one installing panels in their homes can repay
    the loans taken for the installation while enjoying their uninterrupted power
    supply and the ones who cannot afford to install these panels by paying for only
    the energy that they use. The transactions, of course, happen through the cryptocurrency
    in use on the blockchain. A mobile app called `Exergy`, powered by blockchain,
    has been helping keep track of such trades across Africa. It is these peer-to-peer
    electricity lending initiatives that are making it possible for the small consumers,
    who would never be on any big power company’s radar to gain access to electricity,
    and also achieve financial inclusion in the process with cryptocurrency.


    ## The Cardano-Powered Projects


    As the blockchain movement gains momentum, these ecosystems are mushrooming everywhere.
    They may not be as big as their potential as of now, but are surely on the way
    to impacting massive social change. One such blockchain company that intrigues
    me is `Cardano`. I have mentioned it multiple times already, but I believe this
    chain has true potential because of its truly decentralized nature and the desire
    to use technology for social good. `Cardano` has undertaken massive blockchain
    projects in Africa, some of which we have already discussed before. But, there
    are also smaller projects that they are collaborating on which are likely to have
    great cumulative impact on the African economy, and also their self-sufficiency.


    While sophisticated technological infrastructure is still largely missing on the
    African continent, the near-ubiquity of smartphones (almost one phone per individual)
    is an aspect that’s screaming to be utilized. Statistics from even a few years
    back are staggering. For instance, in 2018, Kenya had a 94% mobile phone penetration
    and almost a quarter of the population with access to the internet (`Gadzala`,
    2018). That was the highest in the world. Those numbers could have only gone up
    in the intermittent years.

    '
  trans: '


    2018 年，一个名为非洲大陆自由贸易区（`AfCFTA`）的自由贸易区成立了，实际贸易于 2021 年 1 月启动。这是一项宏大工程，被认为是全球连接多个国家、数十亿人的最大自由贸易区。自由贸易区仅意味着该地区达成了一项协议，允许在贸易方面实行最小政策限制，从而有助于促进经济增长。这里可以观察到一个有趣的现象——尽管发达国家近期转向了基于治理的解决方案来解决其社会经济问题，但发展中国家似乎正在利用贸易的资本主义原则来解决自己的问题。


    尽管这令人兴奋，但道路上仍有重重障碍。获取贸易文件的处理就是其中之一。贸易文件可能包含几项关键内容：如证书、保险单据等。这些文件必须完美就位，而且当贸易跨越边界进行时，更是如此。另一个位列清单前方的关注问题是跨国货币兑换，这将导致成本堆积并延长结算时间。区块链被认为是解决这些问题的理想平台。


    虽然 `AfCFTA` 仍在寻求有关原产地规则的立法，但相关国家仍保持希望。COVID-19 疫情对整个过程也产生了有趣的影响。一方面，它动摇了多个国家的经济，导致这些地区的贸易受到严重影响。但与此同时，它也像对很大程度上依赖商品出口的非洲国家敲响了警钟，促使他们开始内部贸易以及与其他国家的贸易。这可能是非洲国家加速
    `AfCFTA` 活动所急需的动力。


    然而，有趣的是，区块链已经在帮助 `AfCFTA` 之外的贸易情景。尽管 `AfCFTA` 现在似乎准备好催化贸易繁荣，但它仍处于早期阶段；这意味着正如我们所讨论的那样，即使在
    `AfCFTA` 内部，每个国家也可能有不同的海关程序，需要多份文件。区别在于，`AfCFTA` 将拥有统一的程序，而在常规情况下需要完成的手续在每个国家可能大不相同，更糟糕的是，在每个港口都可能不同。


    这些官僚主义立法传统上为小型企业制造了巨大的准入障碍。有了区块链，这些障碍可以大幅减少，甚至完全消除。人们不需要在贸易路线的每个点提交单独的贸易文件，而可以在区块链上上传一次信息，链上的所有机构都可以查看。`TradeLens`
    是一个目前帮助创业者实现此点的平台。交易者可以上传他们的信息并跟踪货物在整个行程中的位置。然而，由于注册在该特定平台上的港口运营商有限，仍有改进空间。


    这些倡议在这些地区释放的繁荣意义将是非凡的。记住，区块链辅助贸易，特别是自由贸易，让小参与者能够进入全球市场。无论是我们之前讨论的突尼斯的橄榄油、赞比亚的木薯、卢旺达的咖啡，还是科特迪瓦尔的可可，非洲大陆都具有巨大的潜力。在此期间，尽管这些资源被开发（很多时候是不符合伦理的），但回报很难到达那些本应获得辛劳报酬的人。利润被中间商和腐败的政府官员掠夺，导致实际生产者几乎都陷入困境。今天，通过区块链，交易者有机会在获利的同时，为小农提供应得的份额。


    总而言之，非洲国家的贸易情景正处于突破的边缘。区块链过去是、未来也无疑是更上一层楼的有力盟友。


    ## 点对点电力模型


    电力危机是非洲国家面临的真实斗争。与人口的实际需求相比，发电量似乎长期短缺。尽管进口了噪音大且不那么环保的发电机，但非洲农村地区仍有绝大部分地区处于黑暗中。尽管整个大陆的政府都做出了电气化的承诺，但普及化似乎仍是一个遥远的梦想，特别是对于该大陆的农村贫困地区而言。


    由于发电成本高昂，许多国家现在开始考虑利用可再生能源，特别是对于很大程度上离网的社区。在这些地区，开发太阳能和风能的项目已得到了几家金融机构投资的极大鼓励。但尽管有了这些发展，可再生能源——作为农村地区供电的资源——仍然无法满足人口的需求。主要原因是关注连接数量和安装的兆瓦数，而不是发电的实际覆盖范围。这正是去中心化电力大显身之地。


    一项进展是即将到来的去中心化电力，即在个人家庭中安装太阳能电池板，或安装微型/小型电网为小社区供电。然而，真正的游戏改变者在后面。太阳能电池板产生的能量超过消耗量的房屋可以将多余能量卖给那些没有太阳能电池板的房屋。这样，双方都是双赢——家里安装电池板的人可以偿还安装时借的贷款，同时享受不间断的电力供应；而无法负担安装这些电池板的人只需为使用的能量付费。当然，这些交易是通过区块链上使用的加密货币进行的。一个名为
    `Exergy` 的区块链驱动移动应用程序一直在帮助追踪整个非洲的此类交易。正是这些点对点的电力贷款倡议，让那些从未进入任何大型电力公司范围的小消费者能够获得电力，并在过程中实现金融包容。


    ## 卡迪坊驱动的项目


    随着区块链运动势头增长，这些生态系统正在到处涌现。尽管它们现在可能还不如潜力那么大，但无疑正朝着产生巨大社会变革前进。一个让我感兴趣的此类区块链公司是 `Cardano`。我已经提到过多次了，但我认为由于其真正的去中心化本质以及利用技术造善的愿望，这条链具有真正的潜力。`Cardano`
    在非洲承担了大型区块链项目，其中一些我们已经讨论过。但他们合作的一些较小项目也可能对非洲经济以及他们的自给自足产生巨大的累计影响。


    虽然非洲大陆的技术基础设施很大程度上仍然缺失，但智能手机的几乎普及（每个人几乎有一部手机）是一个亟待利用的方面。几年前的数据就令人震惊。例如，在 2018
    年，肯尼亚的手机普及率达到 94%，近四分之一的人口可以访问互联网（`Gadzala`, 2018）。那时是全球最高的水平。在随后的几年里，这些数字只会上升。


    '
