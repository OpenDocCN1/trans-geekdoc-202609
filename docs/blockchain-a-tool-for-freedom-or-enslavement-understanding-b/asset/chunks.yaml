  fmt: '

    Africa’s problems in the healthcare sector are quite widespread. Whether it’s
    HIV/AIDS, Ebola, Malaria, or even the more recent COVID-19, the healthcare system
    across the continent has struggled under the weight of various health crises for
    decades. It is noteworthy, though, that the healthcare systems are also learning
    from their failures. The response to COVID-19 seems to have been far more agile,
    seemingly drawing from their learnings from the Ebola epidemic. But, no matter
    how efficient the medical professionals prove to be, there is only so much that
    can be done with such limited resources! Africa, as a whole, has been silently
    screaming for a system that enables more efficient disease monitoring, as well
    as diagnosis and treatment. Moreover, Africans have always been quite skeptical
    of external parties running interference in their healthcare. These parties, including
    big names like the World Health Organization and Pfizer, have in the past treated
    Africans as guinea pigs in their experimentation labs for development of drugs
    and vaccines, and that has been more than enough to erode the trust in these systems.


    I don’t mean to sound like a broken record, but blockchains resolve these concerns
    quite elegantly, to say the least. Blockchains can help create a self-sufficient
    healthcare ecosystem that protects the data of the patients while also giving
    the authorized doctors instant access to the patient’s past history and medical
    records. This safeguarded data can be a major determinant in the diagnosis and
    treatment. `AfyaRekod` is one such blockchain-driven platform where the patient
    maintains full rights to their own data. This data can be saved at the patient’s
    end or at the medical practitioner’s end; either way, the data is stored in one
    single place, making it much less of a nightmare to access it, especially in the
    case of an emergency.


    ## Credit/Lending


    Lack of access to financial capital is one of the biggest deterrents to small
    entrepreneurs wishing to start their own business. Only a little over a quarter
    of the Small and Mid-size Enterprises (SMEs) have access to loans. And, that is
    only in the formal sector. Imagine what the statistics would be in the informal
    sector. This barrier impacts the youth the most, keeping them trapped in the shackles
    of poverty, never giving them an option to move out of it. `Paylend` is a Kenyan
    fintech blockchain start-up that attempts to resolve this concern. While providing
    lending solutions to the small entrepreneurs, this start-up also attempts to create
    value for them by safely collecting consumer data which they can use to tailor
    their products and services.


    Another interesting project built on the `Cardano` is `Liqwid Labs`. It is essentially
    a marketplace where lenders and borrowers can freely interact by borrowing and
    lending funds, participating in the governance of the `Liqwid` protocol, and earning
    `ADA` tokens as incentives in the process.


    A company that we have already discussed, but in a different context, is `Kiva`.
    At the beginning of this book, I mentioned this company as one that I suggested
    to a man looking for a quick transfer of money. While the platform can certainly
    be used for that, that’s not its main function; lending money to small business
    owners in third world nations is. So, a borrower in, let’s say, Africa would apply
    for a loan which would then go through the underwriting and approval process.
    This loan is then posted on the `Kiva` platform to be taken up by lenders, and
    the funds are then immediately transferred to the borrower. When the borrower
    pays the money back, the lender can either withdraw the money or use it to fund
    other loans. This is a neat system but, again, the high fees can be a barrier
    for the small entrepreneur.


    Blockchain implementation, as discussed before, isn’t only about physical resources.
    Since the technology is still quite new on the ground level, the human resource
    that might be needed to implement this technology is likely to be scarce, especially
    in African countries. What we discussed earlier in terms of collaborating with
    experts can happen at the top level, but until and unless there are enough people
    to implement it on-site, little progress can be made. Projects are being undertaken
    to help especially the underprivileged and displaced youth gain blockchain skills
    so that they can actively participate and profit from the blockchain movement.
    This might seem like a side-project, unrelated to the practical use of the technology
    itself, but such initiatives suggest an open mindset on the part of people, and
    that is a crucial prerequisite for the success of the technology.


    ## The WADA


    An organization that I personally know is doing excellent in-the-field, grass-root-level
    work is the West Africa Decentralized Alliance (`WADA), an organization from West
    Africa. I’ll be honest, I am no expert on blockchains; I am still learning, just
    like you. But, much of what I know of the life-altering capacities of blockchains
    comes from this organization. They are doing truly groundbreaking work on the
    African continent. Their main goal is to guide the African developers to the most
    suitable blockchain solution in the `Cardano` ecosystem. This is done by creating
    development-driven hubs in different parts of Africa.


    One of the intriguing projects they have come up with is `Afrixx`. This is their
    first generative NFT project on the `Cardano` blockchain. This is a particularly
    innovative idea to reinvigorate an entire culture and help them feel more at home
    with this new technology. `Afrixx` is creating around 10,000 art pieces, based
    on 15 African legends and icons. Truly, what a wonderful way to amalgamate cultural
    identity into technology. Usually, early technology adoption can be slightly intimidating.
    But, infusing this kind of a proud association in the form of `NFT` is just brilliant.


    With initiatives like this, it aims to empower the people of Africa to be instruments
    of change themselves, and bring in socioeconomic measures that help them fulfill
    their own dreams and aspirations. A big part of their work is educating African
    entrepreneurs about distributed governance, decentralization, and self-organization.
    It is the work of organizations like this that has drawn me closer and closer
    to the belief that blockchains are so much more than a technology. They are a
    tool of bringing self-sufficiency and socioeconomic empowerment.


    I find it very interesting that the African population is on the verge of exploding—according
    to the `Worldometer` statistics from 2019, the median age of the African population
    was around 19 years. This means that the young and zesty human resource could
    prove to be the most valuable asset in the technological revolution of Africa.
    With organizations like `WADA` nurturing this youth to use blockchain technology
    for social good, I am certain that the development of the continent and the prosperity
    of its people rests in great hands.


    # Part IV: The Blockchain Disruption


    In this section, we look at the global blockchains disruption scenario. We explore
    every sector where blockchains are making a mark, while also investigating their
    impact on the masses. Some of these may not have proven case studies just yet,
    but are useful cases, nonetheless. Here, you will see the widespread nature of
    blockchains around you. There is more technology that’s out there somewhere—it
    might be at work in your backyard, for all you know!


    # Chapter 8: Governance


    If we can but prevent the government from wasting the labours of the people, under
    the pretence of taking care of them, they must become happy.


    - Thomas Jefferson

    '
  trans: '

    非洲医疗保健领域的问题非常广泛。无论是艾滋病（HIV）、埃博拉、疟疾，甚至是最近的新冠肺炎，整个大陆的医疗体系几十年来一直都在各种健康危机的压力下挣扎。然而值得注意的是，这些医疗体系也在从失败中吸取教训。对新冠肺炎的应对似乎比以往敏捷得多，显然是从之前的埃博拉疫情中积累了经验。但是，无论医疗专业人员表现得多么高效，在如此有限的资源下，所能做的终究有限的！整个非洲一直在默默地呼唤，渴望一个能够实现更高效疾病监测以及诊断和治疗的系统。此外，非洲人一直对外部势力干预其医疗健康事务持怀疑态度。这些机构（包括世界卫生组织和辉瑞等知名企业）在过去曾将非洲人视作其药物和疫苗研发实验实验室中的“小白鼠”，这已经足以侵蚀人们对这些系统的信任。


    我的并不是想表现得听起来像在老调重弹，但至少可以这么说，区块链非常优雅地解决了这些担忧。区块链可以帮助创建一个自给自足的医疗保健生态系统，在保护患者数据的同时，让授权的医生能够立即获取患者的病史和医疗记录。这些受保护的数据可以成为诊断和治疗的主要决定因素。`AfyaRekod`
    就是这样一个区块链驱动的平台，患者对自己的数据拥有完全权利。这些数据可以存储在患者端，也可以存储在医疗人员端；无论哪种方式，数据都存储在单一地点，使得访问数据不再是一场噩梦，特别是在紧急情况下。


    ## 信贷/贷款


    缺乏获得资本的机会是阻碍希望创业的小型企业家的最大障碍之一。只有略高于四分之一的小型企业（SMEs）能够获得贷款。而且，这仅仅是在正式部门。想象一下非正式部门的统计数据会是什么。这种障碍对青少年影响最大，让他们被困在贫困的枷锁中，从未给他们脱困的机会。`Paylend`
    是一家肯尼亚金融科技区块链初创公司，试图解决这一问题。在为小型企业家提供贷款解决方案的同时，这家初创公司还试图通过安全收集消费者数据为他们创造价值，他们可以使用这些数据来定制自己的产品和服务。


    另一个建立在 `Cardano` 上的有趣项目是 `Liqwid Labs`。它本质上是一个市场，贷款人和借款人可以通过相互借贷资金进行自由互动，参与 `Liqwid`
    协议的治理，并在过程中获得 `ADA` 令牌作为激励。


    我们已经在不同语境下讨论过的一公司是 `Kiva`。在书的开头，我提到过这家公司，它是我向一位想要快速汇款的人士推荐的公司之一。虽然该平台确实可以用于此，但并不是它的主要功能；它的主要功能是向第三世界的小企业主提供贷款。因此，一个在非洲的借款人会申请贷款，然后通过审核和审批流程。这笔贷款随后发布在
    `Kiva` 平台上供贷款人选择，资金会立即转账给借款人。当借款人还钱时，贷款人可以提回资金，也可以将其用于资助其他贷款。这是一个精妙的系统，但再次强调，高额费用可能是小型企业家的障碍。


    正如之前过的，区块链的实施不仅关乎物理资源。由于这项技术在基层仍然非常新，实施这项技术可能需要的人力资源可能是稀缺的，特别是在非洲国家。我们之前讨论的与专家合作可以在高层进行，但除非有足够的人在现场实施，否则无法取得多少进展。目前正在开展一些项目帮助帮助少数群体和流离失所青少年青少年区块链技能，以便他们积极参与并从区块链运动中获利。这看起来可能是一个与技术本身实际用途无关的边缘项目，但此类倡议表明了人们开放的心态，而这是技术成功的关键先决条件。


    ## 西非去中心化联盟 (WADA)


    我个人知道基层工作中表现优秀的组织是西非去中心化联盟（West Africa Decentralized Alliance, `WADA`），这是一个来自西非的组织。我老实说，我不是区块链专家；我像你一样仍在学习中。但我对区块链改变生活能力的许多认知很大程度上来自于这个组织。他们正在非洲大陆开展着真正具有突破性的工作。他们的主要目标是引导非洲开发者在
    `Cardano` 生态系统中找到合适的区块链解决方案。这是通过在非洲不同地区建立开发驱动的中心来实现的。


    他们提出的一个有趣项目是 `Afrixx`。这是他们在 `Cardano` 区块链上的第一个生成式 NFT 项目。这是一个非常有创意的想法，旨在振兴整个文化，并帮助他们对这项新技术感到更加亲切。`Afrixx`
    正根据 15 个非洲传说和符号创作约 10,000 件艺术品。真的，这是一种将文化认同融入技术的绝佳方式。通常情况下，早期采用技术可能会略显畏惧。但以 `NFT`
    的形式注入这种自豪的关联简直是天才之举。


    通过这样的倡议，其目标是让非洲人民成为他们变革的主体，并引入社会经济措施帮助他们实现自己的梦想和愿望。他们的工作很大一部分是教育非洲企业家关于分布式治理、去中心化和自我组织。正是此类组织的工作让我越来越接近这种信念：区块链不仅仅是技术。它们是带来自给自足和社会经济赋权的工具。


    我发现非常有趣的是非洲人口正处于爆炸边缘——根据 `Worldometer` 2019 年的统计数据，非洲人口的中位年龄约为 19 岁。这意味着年轻且充满活力的人力资源可能成为非洲技术革命中最宝贵的资产。随着像
    `WADA` 这样的组织培养这些青少年使用区块链技术造社会，我确定非洲的发展及其人民的繁荣将掌握在可靠手中。


    # 第四部分：区块链颠覆


    在这一部分中，我们将审视全球区块链颠覆的情景。我们探索区块链正在留下印记的每一个领域，同时调查它们对大众的影响。其中一些可能还没有经过证明的案例研究，但仍然是有用的案例。在这里，你将看到区块链在你周围的广泛存在。那里地方有更多的技术——谁知道呢，它可能就在你的后院工作！


    # 第 8 章：治理


    如果我们能防止政府在照顾人们的借口下浪费人民的劳动，他们就会变得幸福。


    - 托马斯·杰斐逊

    '
