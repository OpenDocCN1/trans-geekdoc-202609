    \ as an extreme, authoritarian ideology that only promotes a rebellion against\
    \ the establishment. The truth is something very different. Walter Williams puts\
    \ the ideology in the context of the government in the most succinct manner possible.\
    \ He says, “Nothing in our Constitution says that the Government is a grantor\
    \ of rights. Instead Government is a protector of rights” (Walter E. Williams\
    \ Quotes, n.d.). Contrary to misdirected popular belief, libertarianism doesn’t\
    \ nullify the position of the government; rather, it places the government in\
    \ a serving position and not a ruling one. I am only one of the many, many libertarians\
    \ that firmly stand by the idea that the constitution was essentially anti-centralization,\
    \ rather than the propaganda that we are made to believe—that it gives all powers\
    \ to the government.\n\nLibertarianism may be a tricky concept to come to terms\
    \ with, especially in struggling economies. When you apply Abraham Maslow’s theory\
    \ of the hierarchy of needs to the living conditions of people in these countries,\
    \ it is not too difficult to understand why the idea of liberty hasn’t gathered\
    \ the same steam as it has in the developed nations. By keeping the masses engaged\
    \ in the material aspects of living, the political parties have imposed unfair\
    \ and exploitative practices on the people, and have even succeeded in their trickery\
    \ (up until recently). Take, for instance, the case of West Africa. For a long\
    \ time, politicians made their electorates believe that socialism was the most\
    \ natural fit to their tribal heritage. Using this as a premise, the state governments\
    \ lorded their dominance through price controls, nationalization of foreign companies,\
    \ collectivized agriculture, and so on. The result of this political movement\
    \ was that, while Africa had the maximum natural resources in the world, it still\
    \ was the lowest in terms of socio-economic growth.\n\nIt is only in the last\
    \ few years that the people of Africa are realizing their own power and discovering\
    \ their own paths to prosperity. A growing unrest and distrust of political parties\
    \ and leaderships has been evident in the African countries, to the extent that\
    \ they are looking at entrepreneurship, including blockchains and cryptocurrency,\
    \ as the way out rather than state intervention. It is, of course, worth noting\
    \ that the libertarian movement as we know it might not be effective in alleviating\
