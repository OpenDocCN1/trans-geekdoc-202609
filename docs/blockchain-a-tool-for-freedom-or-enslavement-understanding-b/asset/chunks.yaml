  trans: '

    尽管 2021 年通常被誉为代币之年，但必须注意到，在开放金融解决方案中，区块链更有可能是许可链。因此，数据在公共领域内从未真正完全透明。此外，中央银行仍然掌握着你的资金，这些资金仍然受中心化法律限制的监管。但总而言之，这仍然是增加人们对数字货币接受度的一小步，而且实际上确实已经在经济界得到了广泛接受。


    在指出了区块链带来的金融发展之后，也有必要提出警告。不要被这些进步带来的虚假安全感所迷惑，尤其是像已经成为新闻焦点一段时间的央行数字货币（`CBDC`）。这只不过是传统银行试图转型到区块链空间的一种。它们完全破坏了区块链的目的，因为区块链本应该是去中心化的，而这仅仅是运行在区块链上的法币。这可能被认为是披着区块链新外衣的、旧有的危险的中心化货币系统。


    另一方面，去中心化金融（`DeFi`）正是我们一直以来讨论的内容。它消除了所有中间环节，是区块链最初初衷的真实应用。尽管越来越多的国家对加密货币敞开了怀抱，但在大多数国家仍然存在监管障碍。萨尔瓦多成为第一个宣布将
    `Bitcoin` 为国家货币的国家，并现在与 DeFi 借贷平台 `Acumen` 合作，帮助小企业家获得以比特币为支持的贷款。


    # 股票交易


    在金融世界，股票交易可能是区块链最稳健的应用。2019 年，全球股票市场价值为 77.6 万亿美元（Daley, 2019），到 2021 年增加到 95
    万亿美元（Mitova, 2021）。由于股票交易每日交易价值的增长速度很快，投入最先进且有效的技术来记录这些交易变得至关重要。对于许多人来说，明显的逻辑选择就是区块链。这也包括大头
    `NASDAQ`（纳斯达克），它已经发布了多种基于区块链的指数。这些指数被用于跟踪公司的表现。


    股票市场与区块链完美契合，主要是因为涉及多个中间商和监管协议的繁琐程序。无论是加密货币交易的潜力，还是智能合约在股票交易中的巨大效用，区块链都在所有正确的原因吸引着交易公司。多家公司已加入竞争，而且新的进入者不断涌。像
    `ShapeShift`、`Circle`、`Coinbase`、`Blockstream` 等公司都在利用区块链基础设施进行加密资产交易。


    这些区块链基础设施在很大程度上实现了系统自动化，使其变得高效得多。然而，在交易场景中，区块链的应用似乎比仅仅结算股票交易广泛得多。它是帮助公司跟踪系统性风险、证券贷款、资产管理等方面的一股主要力量。募资活动也变得更容易追踪了。但最重要的是，从消费者的角度来看，交易成本可以被大幅降低，让个人在获利交易中留有更多资金。虽然在所有情况下可能无法实现，但再次，在没有重大监管变化的情况下，中间商仍然可以被取代（至少在某些情况下），帮助个人获得更快的结算。


    # 信贷与贷款


    正如我们在非洲区块链运动中所看到的，由区块链驱动的贷款和信贷解决方案构成了重要组成部分。当 `Dr. Yunus` 在 2006 年获得诺贝尔和平奖时，微型金融成为了一种运动。


    银行和机构对融资持审慎态度，因为目前没有足够的数据来确定客户的还款能力。此外，规避了验证和发放贷款所需的人力成本，因为 `smart contracts`（智能合约）可以使过程变得尽可能顺畅。由于个人记录和任何其他文件都存储在网上，这些文件丢失或损坏的概率几乎为零。


    此外，区块链还可以影响抵押贷款的处理，从而帮助房主。记录交易的不可篡改性使其更具价值。现在，你会发现在抵押贷款方面区块链还不是标准做法。但它们正在受到关注，像
    `Synechron` 这样的区块链加速器已经在改进用户体验以及抵押贷款流程的速度了。


    # 贸易金融


    国际贸易市场价值数万亿美元，贸易金融已成为区块链复兴的关键领域之一。在一个如此巨大的行业中，行业欺诈随之增加并不意外，特别是在应收账款方面。虚假的应收账款损害了即使是像
    `Citigroup`这样的大集团的声誉。无论是重复融资案例（即误导两个或多家银行对同一贸易应收账款提供融资），还是从一开始就是虚假的应收账款，贸易金融欺诈导致了数十亿美元的诉讼和风险敞口。

    '
