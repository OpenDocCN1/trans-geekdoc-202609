- raw: "My friend’s nightmare was nowhere near over yet, though. As they reached the\
    \ border, the vehicles had to be changed and my friend had to board a new car\
    \ that would take him to his destination in Kenya. Now, my friend was lucky to\
    \ have a kind driver who had arranged for another vehicle, but the transaction\
    \ still had to be made. So, there was the car, and there were my friend and the\
    \ driver negotiating a deal in the middle of the street. My friend was very aware\
    \ of the bundle of cash feeling heavier by the moment in his pocket. There was\
    \ no way for my friend to verify the identity or the records of this driver, and\
    \ yet there was no other option that he had. Wouldn’t blockchains offer a much\
    \ safer and more elegant alternative in a case like this?\n\nUnderstand that these\
    \ are not the issues of tourists but the issues that the citizens face more often\
    \ than not. Blockchains could help create a much better, compassionate world for\
    \ the people that have never been given the consideration they deserve in the\
    \ traditional systems. And, that is why I say that this technology could revolutionize\
    \ the world, and even more so, the third-world nations. This isn’t hype; it’s\
    \ mere reality. More and more organizations are jumping on the blockchain wagon\
    \ simply because they realize the impact this technology creates, as we speak.\
    \ World Mobile is the first blockchain-based mobile network that is executing\
    \ their motto of “Connecting the Unconnected” fabulously across Africa. We discuss\
    \ this in more detail in a later section. Humankind is on the precipice of a technological\
    \ mutiny that’s peaceful and non-violent. You ought to know how blockchains are\
    \ changing the world for you and those around you. \n\n## Overview of This Book\n\
    \nThere are many books out there that will tell you about the blockchain basics\
    \ and the technology itself. But, I believe that the changes this technology can\
    \ bring about for common people like you and me, at the very grass root level,\
    \ is where the golden core of this technology lies. Once you get past the technical\
    \ bumps, you will realize the staggering impact that this technology can have\
    \ on diverse aspects of daily living. \n\nThis book takes a deep dive into everything\
    \ you need to know about blockchains—theoretical and practical. We talk about\
    \ how the concepts from Austrian economics and libertarianism can blend to do\
    \ what other economic systems have only dreamt of doing thus far. But, it also\
    \ goes beyond the financial theories and details to take you on a journey that\
    \ will show you how blockchains can impact your life. In this book, I also pay\
    \ special attention to the mindblowing implications blockchains hold for the developing\
    \ nations in solving not just financial issues, but also the big-picture humanitarian\
    \ issues. \n\nA consistent theme that you will find addressed throughout this\
    \ text is decentralization. As of now, the blockchain technology seems to be toeing\
    \ precariously on the edge of the centralization vs. decentralization debate.\
    \ Ignorance on our part could easily tip it to become the next big centralized\
    \ technology and more centralization is certainly not something we need at present.\
    \ In this day and age when we are bombarded with information from all sides, it\
    \ is easy to not pay attention to how things work as long as they do. If we adopt\
    \ the same attitude towards blockchains, we will be missing out on one of the\
    \ biggest technological opportunities this generation has had. So, as you move\
    \ through this chapter, I urge you to appreciate its impact on yourself, those\
    \ around you, as well as those living on the other side of the planet.\n\nA point\
    \ to take note of before you jump into it—you will realize as you progress with\
    \ the book that I do not talk of cryptocurrencies as much as I emphasize blockchains.\
    \ Of course, there is a section dedicated to cryptocurrency, and they arise here\
    \ and there throughout our discussions; but, if you wish to gain more knowledge\
    \ about it, you’d have to explore more sources. This book is, by design, dedicated\
    \ to the far-reaching potential of blockchains itself. This is a conscious choice,\
    \ because I feel like a lot has been said already about crypto, but not so much\
    \ about the technology underlying it. I believe that it is this technology that\
    \ holds the key to the future even more than the cryptocurrencies. \n\nAt the\
    \ core of this book lies the understanding that decentralization is a turning\
    \ point for all of humanity; and, with the advent of blockchains we, the people,\
    \ finally have the power to will the system in a direction that brings peace,\
    \ prosperity, and equality to all the stakeholders.\n\nEnough of the prelude;\
    \ how about we dig in?!\n\n# Part I: The Blockchain Basics\n\nIn this part, we\
    \ discuss the technical and functional concepts that constitute blockchain technology.\
    \ I am intentionally starting with this chapter before diving into the implications\
    \ of the technology. This section is designed to educate you, the reader, on the\
    \ technology in a way that is not overwhelming, yet covers the most crucial concepts\
    \ in enough depth. This basic knowledge will be quintessential to understand the\
    \ real-life application of the theory and will help you in appreciating the true\
    \ unique nature of the blockchain movement. \n\n# Chapter 1: Blockchain for the\
    \ Noob\n\nNow that we have gone over the basic principle of blockchain technology,\
    \ it’s time to dig deeper into the nitty-gritty of the technology itself. Without\
    \ a doubt, however simply we may attempt to describe the technical aspect here,\
    \ the actual working of a blockchain is a complex process. But, hold on: Before\
    \ you silently skip over the technical details section, let me tell you a story.\
    \ This is a true story, and I urge you to pay close attention and think about\
    \ whether it sounds familiar at all. \n\nSo, one fine day, around a year back,\
    \ I was at my bank resolving an account situation and chatting up an old friend\
    \ when I overheard this young man who was exasperated about the time it was taking\
    \ for the overseas money transfer that he had made to his family back in India.\
    \ His family seemed to be in urgent need of money, and the transfer was taking\
    \ forever. We began talking, and he mentioned how he was fed up with these issues\
    \ and the towering fees, too. I told him about a particular peer lending service,\
    \ called Kiva, which charges a hefty fee but serves the purpose of quick transfers.\
    \ He mentioned that he couldn’t afford high fees and that his options were limited.\n\
    \nBeing a blockchain man, through and through, I also asked him if he had considered\
    \ the option of cryptocurrencies or even peer-to-peer lending through blockchain\
    \ as a means of exchange. We’ll discuss this in detail later but for now it would\
    \ suffice to say that he seemed so surprised, shocked almost, at the suggestion.\
    \ The turn that the conversation took after that made me realize the ignorance\
    \ that is all too common in the case of cryptocurrencies and blockchains, in general.\
    \ The young lad assumed the whole technology to be a scam and said he would rather\
    \ pay the ever-increasing fees to a ‘trusted’ source than be a victim of an online\
    \ fraud. \n\nHave you ever had these thoughts? I am certain they must have at\
    \ least flashed across your mind, and a certain section of the media also has\
    \ something to do with those thoughts. But, here’s the bottomline—you cannot trust\
    \ the blockchain technology until you understand how it functions. And, that is\
    \ the reason I strongly recommend you pay just as much attention to the technical\
    \ details as you would to the output of that technology. Therefore, we shall take\
    \ a macro-look at the workings of a blockchain and at the technology in a deeper\
    \ manner. \n\n## The Philosophical Underpinnings"
