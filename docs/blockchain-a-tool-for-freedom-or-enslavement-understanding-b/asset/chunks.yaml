  trans: '


    金融科技领域的领导者 Appzone 集团近期推出了一个名为 `Zone` 的应用程序，这可能是构建该大陆去中心化支付网络的第一步。`Zone` 利用区块链平台，在法币和数字货币领域进行本地以及非洲内部的支付处理。传统上，这些公司使用中心化的电子金融交易（`EFT`）交换机，这是它们与银行之间的单点接触。这些交换机存在问题，因为它们只在定义的间隔内进行交易结算，而且在某些情况下已知会完全故障。由于
    `Zone` 使用去中心化的区块链架构，结算是瞬时发生的；而且单点的故障不会导致整个系统的停滞。此外，正如我们之前讨论的，作为一种区块链解决方案，它极大降低了交易成本。


    然而，这并不是游戏中的唯一参与者。金融科技领域的另一位领导者 `Interswitch Group` 一直与区块链基础设施公司 `Interstellar
    Inc.` 合作进行重大研究。我们可能会看到由这种合作产生的大量区块链驱动的解决方案。这些项目很棒的地方在于，它们似乎识别了非洲数字金融市场的一个主要缺口——非洲大陆不同地区之间的互操作性；他们正在带来有效的解决方案来解决这一问题。在许多方面，这证明将促进该地区贸易发展的重要因素，并预示着经济繁荣的新时代。


    ## 政府合作伙伴的区块链项目


    人们经常观察到发达国家能够充分利用任何新兴技术，这是因为他们拥有可以支配的人力和财力资源。区块链技术似乎通过利用许多可用基础设施部分地解决了这个问题。然而，如果这项技术要大规模使用，特别是在公共部门，区块链架构将需要大量的专业知识。你可能会认为这会阻止非洲国家的早期采用，但观察到的事实却恰恰相反。该大陆部分地区的政府已与法律和技术领域的专家建立了各种合作，以开发基础设施，从而吸引投资。


    我们已经看过了 `Cardano` 与埃塞俄比亚政府之间的里程碑式交易，即为五百万名学生提供数字身份。很棒的是，这只是项目之一，一个极其重要的项目，但尽管如此，还有许多类似的合作，正在进行中，或者已经运行了相当长。


    南非国家区块链联盟（`SANBA`）就是这样的合作之一。这种做法的伟大之处在于，它连接了政府、赞助商、研究社区和工业界，帮助在金融和加密货币领域之外应用区块链。自成立以来，`SANBA`
    一直寻找几个战略合作伙伴，以开发一个顺畅且连接的区块链生态系统，包括 `IBM`、`Microsoft`、`Binance`、`Cardano` 等。在过去的一年里，他们两个出的项目是
    `ILIMA`——一个由区块链驱动的针对小农民和加工者的“从农场到餐桌”支持计划，以及用于数字化记录学徒技能发展证书的`凭证区块链`。尽管这两个项目目前处于概念验证阶段，但它们显示了即使是政府对这项技术的兴趣也在增加。


    乌干达政府对区块链的采用也值得关注。政府希望解决的主要问题是整个东非共同体内的假药问题。为了这一点，几年前，他们与基于区块链的平台 `MediConnect`
    合作——该平台在区块链上记录药物的制造过程，从而使得假药更容易被溯源并停止其在供应链中的分发。


    该国公共部门另一项重大的区块链应用是土地权登记。乌干达拥有一种细微的土地所有制度，具有多种保护权和模式。尽管法律的设计非常倾向于普通人，但现实情况却恰恰相反。腐败和欺诈通过对同一财产签发多个所有权来侵蚀该系统。这基本上使得权证书（技术上是证明所有权的唯一要求）在实际上毫无处。更糟糕的是，由于外国投资的增长，大量乌干达人从自己的财产中被驱逐，没有任何公平补偿的回迹，导致他们流落街头。甚至他们的农田也被夺走，夺走了他们赖以生存的唯一手段。政府一直在研究一项实施区块链进行土地登记的试点项目——以根除泛滥的腐败。。


    乌干达政府采取的一种有趣方法体现在《坎帕拉宣言》中，其中国家表示在进行进一步研究之前，支持不对区块链进行监管。这将允许所谓的“无许可创新”，意味着区块链创新者可以最大限度地利用他们的创造力，而不必担心政府的限制。这种体现开放性的立法在普通民众中建立接受度方面产生深远影响。


    尼日利亚的倡议也激励着该国的人加入区块链热潮。国家信息技术开发局（`NITDA`）局长 `Kashifu Inuwa Abdullahi` 暗示，尼日利亚计划通过采用区块链技术在
    2030 年产生 100 亿美元的收入（Paul, 2020）。尽管区块链在尼日利亚最广泛的应用仍金融加密货币领域，但政府计划将这项技术用于多个项目，如国家数字身份、数字素养、各行业的初创企业等。这些项目的政策激励无疑可以推动尼日利亚经济进入繁荣。


    然而，这些项目也伴随着警示标志。例如，国家数字身份只有在平台本质上是真正的去中心化时才有意义——即个人不必担心共享个人数据带来的危险影响。另一方面，当中心化的政府系统利用区块链时，他们倾向于采用背离去中心化私有化的区块链，这是我们之前讨论过的。这种对私有区块链的使用，即使在公共部门，也比你想象的要得多——许多国际组织继续考虑使用区块链来加强其中心化的层级驱动结构。例如，`Blockchain4Cities`：这是一个联合国研究小组，为智能城市基础设施中的区块链实施收集全面数据。尽管这加速了区块链的增长，但大众从中获益甚少，因为权力仍然留在中心化政府手中。

    '
