  \ `10,000` 个 `Bitcoin` 换了一个披萨。\n\n\n\n\n\n## 引言\n\n许多人认为加密货币是奥斯利利经济学与未来新兴技术之间唯一的桥梁。但，这种观点对于正在发展的局面来说过于局限。虽然加密货币确实提供了与奥斯利利学派最直接的联系，但区块链作为一项宏观技术，也并未偏离该经济学派的原则。\n\
  \n在 20 世纪 80 年代后期，随着信息技术（IT）作为一种长期力量出现，许多人开始考虑它对市场结构的影响。电子市场假设被提出，认为 IT 行业将通过三种方式影响市场：使通信更加便利和高效；帮助买卖双方直接接触而无需中间人；最后是以一种有助于买卖双方的方式整合有价值的信息。预测其结果将是产生更活跃的市场活动。\n\
  \n人们希望像 `Mises`（米塞斯）和 `Hayek`（哈耶克）等奥斯利利经济学家此前提出的观点最终能融入这一即将蓬勃的新市场时代。这些经济学家曾认为，任何经济体面临的主要问题不是资源稀缺，而是相关信息的不可用。现在\
  \ IT 作为一种救星出现出现，这些信息可以变得可用，从而导致等级制度的减少和生产活动得到更好的协调。然而，我们都知道这从未发生过。随着 IT 的出现，`Amazon`、`Google`\
  \ 等大玩家接管了这些信息，他们并没有消除层级结构，而是利用它创造了更加集中的等级制度。因此，尽管总产量增加了，但小企业主发现生存变得比以往任何时候都困难，而大型科技公司的财富正每秒级地增长。\n\
  \n## 区块链技术的机遇\n\n今天，`Hayek`、`Mises` 以及其他奥斯利利经济学追随者在区块链技术方面看到了另一个机会。如果你注意到，区块链技术代表了奥斯利利经济学所代表的一切，甚至超越了加密货币。然而，两者之间最重合的领域将是他们对去中心化的热爱。正如之前讨论过的，区块链允许政府机构进行最少程度的干预（如果有的话），因此不能被用作压制和剥迫的工具。\n\
  \n但需要注意的是，这种自由意志主义原则只有在像你和我我这样的普通人参与到这项技术中才能得到维护。`Google`、`Samsung`（三星）等大公司已经在采取区块链技术，如果我们不有效参与，即使这个自由的工具可能很快也会从我们手中夺走。\n\
  \n自从`Satoshi’s Bitcoin`（中本比特币）出现，区块链的许多方面都被置于放大镜下，包括它们的安全性、可行性和采用性等。但我们需要理解，区块链远不止这些技术细节。它是经济和政治价值的化身，这些价值几十年来一直被诋毁甚至受到压制，因为大众被引导认为这是一个完全的骗局。然而，事实仍然是，让对这项新兴技术以及意识形态处于无知状态，只会帮助掌权者吸引越来越多的权威性。\n\
  \n## 政治和经济后果\n\n尽管这一论点具有说服力，但人们对这项技术的政治和经济后果几乎没有理解。我们可以随心所欲地谈论区块链的颠覆性，但在我们纳入政治和经济意识形态之前，这种讨论在很大程度上是徒劳的；无论喜欢与否，最终是这些意识形态决定了特定技术（无论其具有多么革命性）在特定文化中能否长期生存。\n\
  \n不要误会我；我不是说我们到今为止讨论的政治和经济学派对区块链技术的生存有单向影响。它们没有。最终，任何新兴技术都处于技术、经济和政治反馈的或多持续循环中。在相应的文化背景下，不理解其中一个就不可能理解其他的。因此，正如我们的经济和政治哲学可以决定一项技术是否保持其原始预期一样，技术本身也有力量推翻不符合系统运行的意识形态。前者将权力交给了政府等机构，而后者完全由大众对技术的参与来决定。\n\
  \n这对区块链技术来说确实如此——当大多数人都在浪费时间为支持或反对区块链时，后台的轮子已经在运转。你可以热爱它，也可以讨厌它，但现实是你无法逃避它的。区块链已经以不止一种方式进入你的生活。明智的做法是积极参与其中，不仅通过收集技术方面的知识，还通过理解并个人参与到这项技术的技术、经济和政治背景中。如果你不这样做，你可能很快发现你的生活被你几乎一无所知的科技劫持了。\n\
  \n互联网不也是这样？我们中没有多少人真正知道或理解互联网是什么以及它是如何运作的，但你（作为用户）被陷在它表面的娱乐影响中（例如社交媒体）。但在所有这些看起来无害的帖子和有趣的滤镜之下，科技行业的巨头们正通过促使你每次登录时允许他们访问你的数据，然后将其出售给广告商以获取利润，正将互联网用于更阴险的用途。更不用说他们拥有的控制言论的不可逾越的力量了，显然互联网并不像它应该那样具有主权。\n\
  \n我们需要在太晚以及大型科技公司接管新兴区块链技术之前清醒过来并面对现实。正如 `Mike Maloney`（迈克·马洛尼）在他 YouTube 博客 `Hidden\
  \ Secrets of Money` 第八集中贴切地指出的，区块链（`Maloney` 特别提到了加密货币）可以“解放我们，也可以奴役我们”（`Goldsilver\
  \ with Mike Maloney`, 2018）。\n\n\n\n\n在这里，我们特别关注那些正在为你带来改变的行业和项目，这些项目不仅仅是为了利润，更是为了社会公益。无论是在印度——一家名为\
  \ `ConsenSys` 的公司正与名为 `Niti Ayog` 的政府智库合作，简化土地所有权记录；还是泛影响韩国（Pan-Impact Korea）——它利用区块链技术和社会影响债券，确保只有在达到预期的社会成果时才会释放资金；又根据斯坦福社会创新中心\
  \ 2018 年的一份报告，全球还有其他 191 个区块链项目：这些都是企业家以最优雅的方式将利润、社会成果和区块链技术融合的例子。此类项目在过去几年中蓬勃发展，恰恰是技术走向成熟的证明，这对我们来说完全是一个好消息。\n\
  \n这也不完全关乎商业。2021 年，我们之前提到的 `Ethereum` 共同创始人 `Vitalik Buterin` 向印度的“新冠加密救援基金”捐赠了价值\
  \ 10 亿美元的加密货币（`Terrapass`，2021）。这笔交易极度透明，这恰恰证明了区块链交易发生的便利性和透明度。但再次，我们不要陷入这些孤立的项目和事件中，因为为了社会公益的区块链已经发展得远超看似“百年分之一”的偶然。\n\
  \n## 面向小型参与者的区块链\n\n到目前，我们只从大玩家（例如 `Cardano`）的背景来看待区块链，以及他们如何利用它来创造急需社会影响。我们将在下一章回到非洲的区块链和社交影响；但在这里，我想让你们记住，区块链并不是一项遥远的技术。区块链对于你我来说，与对于大型科技行业以及第三世界国家一样紧密。\n\
  \n### 帮助小创业者\n\n与大品牌作斗一直是小商人的痛点。日益加速的消费主义往往让我们去追逐商业品牌，而非本地企业。尽管过去已经采取了多项举措来促进小微企业，但似乎没有一项能产生持久的影响。区块链可以通过跨越式的发展来帮助新企业，让他们能够在同一个空间内竞争。\n\
  \n区块链对小型参与者的一个巨大优势是，它们利用了大量的现有基础设施，而不是要求从零开始构建新设施。这些新创业者可以选择使用 `Ethereum`、`Corda`、`Hyperledger`\
  \ 等开源平台上的预构建区块链。当然，他们也可以从零开始构建；但对于创业初期的者来说，资源有限，已经运行的区块链平台可能特别具有吸引力。\n\n与本地创业企业相比，大公司一直拥有更充足的资金储备以及更先进的技术。这并不是什么秘密，像\
  \ `Amazon` 这样的电子商务巨头已经全方位冲击了整个行业，让小企业主即使是生存都极其困难，更不用说发展了。区块链具有平衡竞争环境的潜力，至少在某种程度上如此。事实上，在实施区块链时，由于初创公司在态度上的开放性，以及设定协议和标准的灵活性，即将启动的项目可能更适合这项技术。\n\
  \n区块链有潜力以前所未有的方式为小型参与者提供平等的竞争环境。这在一直阻碍小型行业增长的信息不对称背景下尤为真实。由于这些小企业没有像大对手那样的可用工具，他们一直处于劣势。区块链通过让所有数据点都易于评估，实际上让信息差消失了。\n\
  \n区块链还激活了忠诚度计划，帮助将客户重新引导回小型企业。传统上，忠诚度计划充满了困惑，导致兑换率很低。客户往往对这些持谨慎态度，尤其是考虑到必须交出个人数据。区块链提供了一种解决办法，因为所有数据都是安全加密的。此外，从创业者的角度来看，执行这些忠诚度计划容易得多，也便宜得多，因为消除了所有的中间环节和交易成本。此外，区块链机制可以帮助防止被盗代币或其他形式的欺诈。\n\
  \n还有一个尚未被探索的意义，但它可能会完全改变购物体验。小企业主可以聚集在一起，形成某种本地市场，跨企业的忠诚度代币可以相互关联，从而让客户毫无压力地使用。这被证明是社区建设中的一个转折点，因为资金留在了社区内部，并为客户提供了便捷的购物体验。\n\
  \n### 面向小农的区块链\n\n尽管全球对农产品的消费不断增加，但小农获得的利润仍然微薄。你想过为什么吗？这是因为我们的系统结构上存在根本性缺陷。有些人甚至会认为（而且非常正确），我们的社会及其依赖的系统设计初是为了让富人更富，穷人更穷。目前的全球供应链实际上将市场权力集中在顶端，而底部的利益相关者无法获得机会。\n\
  \n以光鲜且不断增长的巧克力行业为例。你能猜到种植自己的可可豆的小农最终能获得百分之几的价值吗？7%——是的，这就是他收到的生产总价值的百分比（`Fairfood`，2020）。这是因为这种原材料的供应链涉及了大量的参与者，且通常跨越多个大陆。\n\
  \n人们已经提出了多项举措来解决这一局面，让像非洲这样的地方的小农们生活得轻松一点。出现了许多自称为“从豆到棒”（bean-to-bar）的精品巧克力公司，它们将注意力放在创建更短的供应链，并将更高比例的利润直接给农民。这些公司以更高的溢价出售“伦理巧克力”。然而，目前消费者尚没有方法可以验证这些声明是否在现实中得到履行。区块链通过提供这些声明的实时验证，提供了一个简单而优雅的解决方案。\n\
  \n\n\n\n正如我们之前讨论过的，偏远地区农民获得银行服务的机会远小于他们使用智能手机的机会。例如，像即将启动的区块链初创公司 `AgriChain` 这样的点对贷款区块链服务，以及此类网络上的交易，只需在手机屏幕即可轻松完成。此外，区块链在存储农民所遵循的良好实践相关文档，以及他们为了向客户证明其特殊价值可能所需的各种认证方面，效率也高得多。\n\
  \n这融入了“智能农业”的领域，可以帮助农民实施相当复杂的数据存储和分析措施。这些数据具有不可篡改性和防篡改性，具有特殊的意义。以环境监测数据为例，这些数据通常由政府当局进行集中控制，并由他们根据环境趋势做出政策决策。但由于由于中央当局有其需要保护的利益，这些数据可能很容易受到操纵，而这在启用区块链的网络上是不可能的。目前，许多利用区块链技术结合信息技术（`ICT`）和物联网（`IoT`）的项目正在进行，旨在帮助农民充分利用这项技术。\n\
  \n另一个区块链可以并已经带来显著改进的领域领域是农产品的供应链。这一领域的问题不仅给农民带来了困难，还给全球社会带来了巨大的经济成本。单从农民的角度来看，区块链技术有助于与消费者建立信任，因为每种产品的信息在区块链上都是透明且免费的。这将消除那些试图通过廉价劣质产品来垄断市场的竞争。因此，农民可以为客户提供真正的价值。另一方面，从客户的角度来看，他们现在可以确定自己的食品是如何制作的。一家名为\
  \ `Ripe` 的公司正是这样做，通过提供一个区块链平台使食品供应链实现数字化透明。\n\n区块链还解决了追溯性问题，确保农产品浪费最少（如果有的话）。一家名为\
  \ `TE-FOOD` 的初创公司使用识别工具来跟踪农产品在供应链中的移动——无论是包装食品、生鲜农产品还是牲畜。通过分析一段时间内的浪费模式可以带来宝贵的见解，有助于解决这些问题。甚至还有启用区块链的工具可以帮助农民进行畜牧。在这里，动物在出生时就会贴上一些识别标记，这有助于以测量和科学的方式跟踪这些动物整个生命周期内的生长情况。它们的生命体征得到监测，并在早期阶段识别出问题（如果有的话）。\n\
  \n即使对于食品行业中的非法活动，区块链也发挥着至关重要的作用。非法元素通常通过掠夺大量的消费者市场，使守法的生产者处境非常艰难。一个相关的例子是非法捕鱼，长期以来，这对监管机构以及努力遵守所有法规的渔民来说一直是一个困扰。区块链可以让客户非常简单地检查他们购买的农产品是否合法。他们还可以向消费者提供可靠信息，说明他们的鱼源自哪里：养殖场、湖泊等淡水水域，还是海洋盐水域。\n\
  \n尽管这一切看起来可能像是某部现实科幻小说中的情节，但我再次提醒你，这些都是在你们周围的区块链上成功运行的应用。而且，这只是冰山一角。在我们每一个人都参与其中之前，除非我们参与，否则无法释放它们的真正潜力。\n\
  \n## 用于可持续性的区块链\n\n当我们没完没了地谈论这项技术时，我们不能忘记环境因素。区块链技术往往被认为与环境可持续性背道而驰，主要因为工作量证明（`PoW`）共识机制，由于其产生的碳足迹，被认为对环境的消耗很大。虽然事实如此，但正如之前指出的，环保共识机制也被设计出来并广泛使用，特别是在公有区块链中。这就是为什么我们必须将区块链看作远大于其被称为\
  \ `Bitcoin` 的微小子集的原因，而比特币确实使用了 `PoW` 共识机制。即使是其他加密货币，如 `Cardano` (`ADA`），也使用了之前讨论过的\
  \ `Ouroboros` 环保权益证明（`PoS`）共识机制。然而，批评者似乎仍然纠结在使用不环保的区块链进行可持续性项目的讽刺性上。只需快速一眼这些公有区块链的运行机制，就能让你理解，这种讽刺只不过是那些宁愿反对而非接受变革者的幻想。\n\
  \n### 伦理采矿\n\n当我们以发达经济和发展中经济体的二元性来思考世界时，我们往往被认为发达国家是富裕的中心，而发展中经济体正在消耗全球资源。这不仅是一个严酷的观点，而且是一个极不准确的观点。非洲拥有丰富的矿产储备，但当地人口似乎几乎没有从采矿业中受益。在他们的书籍《Mining\
  \ in Africa: Are Local Communities Better Off?》（Chuhan-Pole et al., 2017）中，作者们讨论了“资源诅咒”。他们指出腐败的政治实体结合丰富的资源对当地发展可能产生的灾难性影响。这主要是因为在弱弱且非民主的机构中这种权力集中使得利益集团的垄断者更容易控制和获取租金。区块链可以扭转这些功能失调的系统，并为当地社区改善局面。\n\
  \n例如，刚果民主共和国拥有广泛的小规模钴和铜采矿作业。虽然这些遍布的矿场是数百万人的生命线，但这些采矿作业也是多种人权侵害行为（包括童工）的温床。政府当局经常因未能监管这些行为而面临严厉的批评和反对。`IBM`\
  \ 目前运行着协作区块链试点，确保刚果的矿场符合认证标准。只有当（例如）没有涉及童工，或者矿工的工作条件和工资符合要求时，矿场才能获得认证。虽然这可能是一个巨大的游戏改变者，但人的努力是不容忽视的。记住，留在区块链上的信息将与输入其中的信息一样好。这正是我们作为公众参与其中的之处。\n\
  \n### 废物管理\n\n\n\n\n你不必成为环保主义者也能知道地球正处于深陷危机之中。随着垃圾填埋场比以往任何时候都要高，全球范围内的废物管理似乎正努力追赶日益增长的垃圾山。随着人口增长和商业消费主义的提高，废物也随之增加，尤其是非环保废物。加拿大安大略省最近有报道称，其垃圾处理空间即将耗尽。随着这些以固体、液体和气态形式存在的废物堆积，人类健康日益受到威胁。废物管理不当的问题已有充分记载，特别是在发展中国家，导致了如呼吸系统问题、皮肤感染，甚至是产前和产后缺陷等严重的健康问题。除了腐败之外，发展中国家这种管理不当的主要原因是，废物管理在其物流链中涉及多个动态变动的环节。\n\
  \n你是否曾想过，从你路边收集的垃圾去向了哪里？简单且可能没那么可怕的答案是，它们进入了填埋场。但除此之外，由于垃圾类型的繁多、过程中涉及的众多收集和处理中心，以及许多在大规模上难以追踪的动态因素，追踪这些垃圾的移动轨迹可能非常困难。区块链在这方面已被证明是极其成功的。\n\
  \n阿根廷尽管是一个发展中国家，但已被证明将其垃圾纳入区块链的绝佳典范。政府与企业家伊万·祖比莱维茨（Ivan Zubilewicz）合作，实施了使用祖比莱维茨创建的名为`JellyCoin`的加密货币废物收集奖励计划。这种加密货币奖励给所有参与废物管理过程的人。任何想要参加的人只需登录应用程序并注册为垃圾生产者、收集者或处理者。这些人都会根据遵循适当的废物分类获得奖励。这些不同的参与者之间也相互连接，确保了可追溯性以及由此产生的问责制的落实，以改进整个流程。收集者甚至根据他们收集垃圾的距离获得奖励。总而言之，整个过程变成了激励机制，从而使人们在工作中更加积极。由于这种加密货币在阿根廷经济中被广泛接受，可以用来在主流市场购买他们想要的任何东西。这真是不需要联邦政府就能解决古老难题的绝方法！\n\
  \n另一个类似的试点项目正在推动印度孟加罗尔（Bengaluru）的社区努力，创建一个更好的废物处理系统。区块链提供了一种万无一失的方法，确保垃圾收集中的任何问题都不会被遗漏。如果垃圾收集被忽视，公民可以去注册投诉。在引入区块链元素之前，政府使用一种地理标记系统，收集者会拍摄一张带有时间戳的清理后的现场照片并上传。但问题是，这项技术存在漏洞，允许对过去的数据条目和时间戳进行篡改。将这项技术与区块链相结合，引入了急需的精细化水平，同时让所有利益相关者都能看到这些数据。这种透明度确保了问责制，并让那些正在执行任务和没有执行任务的人之间有了清晰的了解。\n\
  \n`RecycleGO` 是一个位于纽约的项目，使用 QR 扫描仪扫描塑料瓶，增加了塑料废物管理的可追溯性。他们在尼日利亚拉各斯（Lagos）也设有一个机构，计划通过将整个过程置于区块链上，将他们的塑料回收提升一个层次。\n\
  \n我们在这里讨论的所有项目都在所谓的世界上发展中地区运行。我强调这一点，是因为通常我们有一种偏见的认知，认为发展中世界并不像其其他对应国家那样精通技术。但是，我们在这一节中看到的，以及到目前为止讨论的内容，完全反驳了这种观点。这些国家可能找不到财政资源，但也许正是这种稀缺激发了他们更加经济、更高效地利用资源。而区块链之所以让我兴奋，是因为它们似乎是这种资源利用的完美工具。\n\
  \n# 第 7 章：发展中经济体的用例\n\n遗憾的是，发展中经济体一直是获得先进技术所提供的任何收益的最后。这些社区中功能失调的层级结构往往是这些群体所处社会劣势的根源。但正如我们在文中多次证明的那样，区块链有能力改变这一切。尽管我在这里分享的例子非常令人兴奋，但区块链技术仍处于婴儿阶段。区块链在真正重要的领域仍在寻找自己的话语。\n\
  \n尽管如此，今天我们已经有足够的证据来确定这种技术是有效的，特别是在世界上最不被认为它们会成功的地区。虽然我们描述了几个区块链作为游戏规则改变者的例子，现在我们来独家观察这项技术如何扭转非洲大陆的现实。本章引导你关注这项技术在非洲国家正在创造的奇迹，一个平台一个地改变他们社会赋能的格局。我们将逐一查看所有平台，并观察它们对非洲经济的影响。\n\
  \n2020 年，`PositiveBlockchain.io` 的一项调查识别了 69 个在非洲大陆利用区块链进行社会公益的项目（Smart Africa,\
  \ 2020）。请记住，当我们谈论社会公益时，这些并不一定是非营利性的。事实上，其中大多数是营利性初创公司。这完全不是坏事，因为这意味着人们和组织开始将区块链视为行的自给自足平台，可以产生收入并获取利润，而不需要依赖特定实体的捐赠和慈善。根据上述报告，这些项目中的大多数（57%）是在非洲大陆本土的总部运营的。然而，这些区块链倡议在整个大陆的传播并不均匀，肯尼亚、南非和尼日利亚是关注最多的地区。尽管如此，毫无疑问，一个充满活力的区块链生态系统已经在该大陆出现，并正走向持久的繁盛发展。\n\
  \n## 数字金融基础设施\n\n区块链上的数字货币已被人们广泛接受。考虑到我们之前讨论过非洲人对 `mpesa` 等移动货币应用的青睐，这并不令人意外。你可能会惊讶地发现，全球大多数移动货币运营商都运行在撒哈拉以南的非洲。当全世界都在纠结加密货币的可行性时，非洲人似乎对交易\
  \ `Bitcoin` 等货币感到非常自在。\n\n\n\n\n\n金融科技领域的领导者 Appzone 集团近期推出了一个名为 `Zone` 的应用程序，这可能是构建该大陆去中心化支付网络的第一步。`Zone`\
  \ 利用区块链平台，在法币和数字货币领域进行本地以及非洲内部的支付处理。传统上，这些公司使用中心化的电子金融交易（`EFT`）交换机，这是它们与银行之间的单点接触。这些交换机存在问题，因为它们只在定义的间隔内进行交易结算，而且在某些情况下已知会完全故障。由于\
  \ `Zone` 使用去中心化的区块链架构，结算是瞬时发生的；而且单点的故障不会导致整个系统的停滞。此外，正如我们之前讨论的，作为一种区块链解决方案，它极大降低了交易成本。\n\
  \n然而，这并不是游戏中的唯一参与者。金融科技领域的另一位领导者 `Interswitch Group` 一直与区块链基础设施公司 `Interstellar\
  \ Inc.` 合作进行重大研究。我们可能会看到由这种合作产生的大量区块链驱动的解决方案。这些项目很棒的地方在于，它们似乎识别了非洲数字金融市场的一个主要缺口——非洲大陆不同地区之间的互操作性；他们正在带来有效的解决方案来解决这一问题。在许多方面，这证明将促进该地区贸易发展的重要因素，并预示着经济繁荣的新时代。\n\
  \n## 政府合作伙伴的区块链项目\n\n人们经常观察到发达国家能够充分利用任何新兴技术，这是因为他们拥有可以支配的人力和财力资源。区块链技术似乎通过利用许多可用基础设施部分地解决了这个问题。然而，如果这项技术要大规模使用，特别是在公共部门，区块链架构将需要大量的专业知识。你可能会认为这会阻止非洲国家的早期采用，但观察到的事实却恰恰相反。该大陆部分地区的政府已与法律和技术领域的专家建立了各种合作，以开发基础设施，从而吸引投资。\n\
  \n我们已经看过了 `Cardano` 与埃塞俄比亚政府之间的里程碑式交易，即为五百万名学生提供数字身份。很棒的是，这只是项目之一，一个极其重要的项目，但尽管如此，还有许多类似的合作，正在进行中，或者已经运行了相当长。\n\
  \n南非国家区块链联盟（`SANBA`）就是这样的合作之一。这种做法的伟大之处在于，它连接了政府、赞助商、研究社区和工业界，帮助在金融和加密货币领域之外应用区块链。自成立以来，`SANBA`\
  \ 一直寻找几个战略合作伙伴，以开发一个顺畅且连接的区块链生态系统，包括 `IBM`、`Microsoft`、`Binance`、`Cardano` 等。在过去的一年里，他们两个出的项目是\
  \ `ILIMA`——一个由区块链驱动的针对小农民和加工者的“从农场到餐桌”支持计划，以及用于数字化记录学徒技能发展证书的`凭证区块链`。尽管这两个项目目前处于概念验证阶段，但它们显示了即使是政府对这项技术的兴趣也在增加。\n\
  \n乌干达政府对区块链的采用也值得关注。政府希望解决的主要问题是整个东非共同体内的假药问题。为了这一点，几年前，他们与基于区块链的平台 `MediConnect`\
  \ 合作——该平台在区块链上记录药物的制造过程，从而使得假药更容易被溯源并停止其在供应链中的分发。\n\n该国公共部门另一项重大的区块链应用是土地权登记。乌干达拥有一种细微的土地所有制度，具有多种保护权和模式。尽管法律的设计非常倾向于普通人，但现实情况却恰恰相反。腐败和欺诈通过对同一财产签发多个所有权来侵蚀该系统。这基本上使得权证书（技术上是证明所有权的唯一要求）在实际上毫无处。更糟糕的是，由于外国投资的增长，大量乌干达人从自己的财产中被驱逐，没有任何公平补偿的回迹，导致他们流落街头。甚至他们的农田也被夺走，夺走了他们赖以生存的唯一手段。政府一直在研究一项实施区块链进行土地登记的试点项目——以根除泛滥的腐败。。\n\
  \n乌干达政府采取的一种有趣方法体现在《坎帕拉宣言》中，其中国家表示在进行进一步研究之前，支持不对区块链进行监管。这将允许所谓的“无许可创新”，意味着区块链创新者可以最大限度地利用他们的创造力，而不必担心政府的限制。这种体现开放性的立法在普通民众中建立接受度方面产生深远影响。\n\
  \n尼日利亚的倡议也激励着该国的人加入区块链热潮。国家信息技术开发局（`NITDA`）局长 `Kashifu Inuwa Abdullahi` 暗示，尼日利亚计划通过采用区块链技术在\
  \ 2030 年产生 100 亿美元的收入（Paul, 2020）。尽管区块链在尼日利亚最广泛的应用仍金融加密货币领域，但政府计划将这项技术用于多个项目，如国家数字身份、数字素养、各行业的初创企业等。这些项目的政策激励无疑可以推动尼日利亚经济进入繁荣。\n\
  \n然而，这些项目也伴随着警示标志。例如，国家数字身份只有在平台本质上是真正的去中心化时才有意义——即个人不必担心共享个人数据带来的危险影响。另一方面，当中心化的政府系统利用区块链时，他们倾向于采用背离去中心化私有化的区块链，这是我们之前讨论过的。这种对私有区块链的使用，即使在公共部门，也比你想象的要得多——许多国际组织继续考虑使用区块链来加强其中心化的层级驱动结构。例如，`Blockchain4Cities`：这是一个联合国研究小组，为智能城市基础设施中的区块链实施收集全面数据。尽管这加速了区块链的增长，但大众从中获益甚少，因为权力仍然留在中心化政府手中。\n\
  \n\n\n\n2018 年，一个名为非洲大陆自由贸易区（`AfCFTA`）的自由贸易区成立了，实际贸易于 2021 年 1 月启动。这是一项宏大工程，被认为是全球连接多个国家、数十亿人的最大自由贸易区。自由贸易区仅意味着该地区达成了一项协议，允许在贸易方面实行最小政策限制，从而有助于促进经济增长。这里可以观察到一个有趣的现象——尽管发达国家近期转向了基于治理的解决方案来解决其社会经济问题，但发展中国家似乎正在利用贸易的资本主义原则来解决自己的问题。\n\
  \n尽管这令人兴奋，但道路上仍有重重障碍。获取贸易文件的处理就是其中之一。贸易文件可能包含几项关键内容：如证书、保险单据等。这些文件必须完美就位，而且当贸易跨越边界进行时，更是如此。另一个位列清单前方的关注问题是跨国货币兑换，这将导致成本堆积并延长结算时间。区块链被认为是解决这些问题的理想平台。\n\
  \n虽然 `AfCFTA` 仍在寻求有关原产地规则的立法，但相关国家仍保持希望。COVID-19 疫情对整个过程也产生了有趣的影响。一方面，它动摇了多个国家的经济，导致这些地区的贸易受到严重影响。但与此同时，它也像对很大程度上依赖商品出口的非洲国家敲响了警钟，促使他们开始内部贸易以及与其他国家的贸易。这可能是非洲国家加速\
  \ `AfCFTA` 活动所急需的动力。\n\n然而，有趣的是，区块链已经在帮助 `AfCFTA` 之外的贸易情景。尽管 `AfCFTA` 现在似乎准备好催化贸易繁荣，但它仍处于早期阶段；这意味着正如我们所讨论的那样，即使在\
  \ `AfCFTA` 内部，每个国家也可能有不同的海关程序，需要多份文件。区别在于，`AfCFTA` 将拥有统一的程序，而在常规情况下需要完成的手续在每个国家可能大不相同，更糟糕的是，在每个港口都可能不同。\n\
  \n这些官僚主义立法传统上为小型企业制造了巨大的准入障碍。有了区块链，这些障碍可以大幅减少，甚至完全消除。人们不需要在贸易路线的每个点提交单独的贸易文件，而可以在区块链上上传一次信息，链上的所有机构都可以查看。`TradeLens`\
  \ 是一个目前帮助创业者实现此点的平台。交易者可以上传他们的信息并跟踪货物在整个行程中的位置。然而，由于注册在该特定平台上的港口运营商有限，仍有改进空间。\n\n\
  这些倡议在这些地区释放的繁荣意义将是非凡的。记住，区块链辅助贸易，特别是自由贸易，让小参与者能够进入全球市场。无论是我们之前讨论的突尼斯的橄榄油、赞比亚的木薯、卢旺达的咖啡，还是科特迪瓦尔的可可，非洲大陆都具有巨大的潜力。在此期间，尽管这些资源被开发（很多时候是不符合伦理的），但回报很难到达那些本应获得辛劳报酬的人。利润被中间商和腐败的政府官员掠夺，导致实际生产者几乎都陷入困境。今天，通过区块链，交易者有机会在获利的同时，为小农提供应得的份额。\n\
  \n总而言之，非洲国家的贸易情景正处于突破的边缘。区块链过去是、未来也无疑是更上一层楼的有力盟友。\n\n## 点对点电力模型\n\n电力危机是非洲国家面临的真实斗争。与人口的实际需求相比，发电量似乎长期短缺。尽管进口了噪音大且不那么环保的发电机，但非洲农村地区仍有绝大部分地区处于黑暗中。尽管整个大陆的政府都做出了电气化的承诺，但普及化似乎仍是一个遥远的梦想，特别是对于该大陆的农村贫困地区而言。\n\
  \n由于发电成本高昂，许多国家现在开始考虑利用可再生能源，特别是对于很大程度上离网的社区。在这些地区，开发太阳能和风能的项目已得到了几家金融机构投资的极大鼓励。但尽管有了这些发展，可再生能源——作为农村地区供电的资源——仍然无法满足人口的需求。主要原因是关注连接数量和安装的兆瓦数，而不是发电的实际覆盖范围。这正是去中心化电力大显身之地。\n\
  \n一项进展是即将到来的去中心化电力，即在个人家庭中安装太阳能电池板，或安装微型/小型电网为小社区供电。然而，真正的游戏改变者在后面。太阳能电池板产生的能量超过消耗量的房屋可以将多余能量卖给那些没有太阳能电池板的房屋。这样，双方都是双赢——家里安装电池板的人可以偿还安装时借的贷款，同时享受不间断的电力供应；而无法负担安装这些电池板的人只需为使用的能量付费。当然，这些交易是通过区块链上使用的加密货币进行的。一个名为\
  \ `Exergy` 的区块链驱动移动应用程序一直在帮助追踪整个非洲的此类交易。正是这些点对点的电力贷款倡议，让那些从未进入任何大型电力公司范围的小消费者能够获得电力，并在过程中实现金融包容。\n\
  \n## 卡迪坊驱动的项目\n\n随着区块链运动势头增长，这些生态系统正在到处涌现。尽管它们现在可能还不如潜力那么大，但无疑正朝着产生巨大社会变革前进。一个让我感兴趣的此类区块链公司是\
  \ `Cardano`。我已经提到过多次了，但我认为由于其真正的去中心化本质以及利用技术造善的愿望，这条链具有真正的潜力。`Cardano` 在非洲承担了大型区块链项目，其中一些我们已经讨论过。但他们合作的一些较小项目也可能对非洲经济以及他们的自给自足产生巨大的累计影响。\n\
  \n虽然非洲大陆的技术基础设施很大程度上仍然缺失，但智能手机的几乎普及（每个人几乎有一部手机）是一个亟待利用的方面。几年前的数据就令人震惊。例如，在 2018\
  \ 年，肯尼亚的手机普及率达到 94%，近四分之一的人口可以访问互联网（`Gadzala`, 2018）。那时是全球最高的水平。在随后的几年里，这些数字只会上升。\n\
  \n\n\n\n区块链之所以特殊，是因为它们可以利用这种看似不起的基础设施引入急需的定力。将其与人工智能运动相结合，非洲大陆确实拥有着令人惊叹的东西。在数据质量和可用性领域的既有挑战无疑阻碍了人工智能相关技术的采用，但即将上线的去中心化应用程序（dApps）和平台正在克服这些困难，触及非洲人口的核心。例如，dApp\
  \ `UjuziKilimo` 以传感器和其他农场数据分析工具的形式利用人工智能，帮助小农户理解农业数据，从而帮助他们根据科学依据做出决策。该 dApp 一直为肯尼亚农民提供实时土壤测试数据，以改变他们的农业实践。尽管该\
  \ dApp 目前尚未使用区块链，但你可以想象像这样的区块链驱动的 AI 技术可以达到何种完善程度。\n\n区块链人工智能运动在非洲各地势头增长，但尼日利亚似乎处于领先地位。长期以来，尼日利亚经济依赖其原油生产，但近期原油价格的下降使其失去了比利比亚领先的原油生产国的地位。这似乎加速了经济多元化的需求，而区块链驱动的人工智能正处于这种多元化的领导位置。`LoopBlock\
  \ Network` 是一家尼日利亚公司，整合了区块链和人工智能解决方案以构建可行的平台。他们最近宣布了在该领域培训 100 名尼日利亚青年的计划（Anagor,\
  \ 2022）。这看起来可能是一个小事件，但它标志着在未来即将发生区块链-AI 合作的大规模流入。\n\n`Cardano` 仍然处于这些进展的前沿，提供了人工智能与区块链的完美融合。这正是为什么\
  \ AI 公司正押注 `Cardano` 以获得长期收益。`Cardano` 与 `SingularityNET` 和 `iCog Labs` 合作，正忙于挖掘尚未开发的机器人和\
  \ AI 市场，以支持非洲的技术社区。他们甚至被选为为名为 `Grace` 的人形护士提供动力支持。尽管该项目目前独立于他们的非洲关联，但这些努力所在的方向仅仅是作为即将到来的进步的信号。\n\
  \n`EMURGO` 是作为 `Cardano` 创始实体的全球区块链解决方案公司，近期宣布设立一个特殊的非洲分部，将投入 1 亿美元专门用于科技行业的发展。这些资金将留作帮助初创企业，并在过程中构建一个供区块链顺利运行的生态系统。如果不观察这个新兴的生态系统，将无法衡量这项技术的真实影响。\n\
  \n## 住房\n\n在发达国家，我们似乎将拥有财产的权利视为理所当然。当然，即使在西方，这一过程也变得越来越繁琐；但现实是，我们仍然拥有主张这一权利所需的机构和基础设施。遗憾的是，发展中经济体尤其是非洲大陆并非如此。长期以来，非洲一直处于似乎无止境的住房危机之中。政治上的冷漠和缺乏针对负担得住房的合理政策变化，导致非洲的年轻人流落街头。目前，住房积压量达到近\
  \ 5000 万套，而实际所需的数量相比之下。高达 30-45% 的荒谬贷款利率使得购房变得更加困难（Hamilton, 2021）。凭借如此高的利率，普通人实际上无法考虑贷款的长期还款计划。\n\
  \n由于指向该大陆的大量国际援助未能到达预期的接收者，这一事实使情况变得更加恶化。由于立法政策、货币汇率贬值和普遍存在的腐败，国际投资也在萎缩。所有这些因素共同导致大多数非洲人口由于无法以财产形式拥有财富而暴露在痛苦之中。\n\
  \n区块链正通过 `Empowa` 渠道改变这一切。`Empowa` 是 `Cardano` 区块链上第一个旨在帮助非洲人以负担得起的价格拥有财产的。平台。中心化金融（DeFi）平台使用名为\
  \ `EMP` 的令牌。简单来说，它可以被认为是一种通道，允许全球有资金的人为非洲希望拥有住房的弱势群体提供资金。但其实际运行方式要复杂得多。\n\n其原理如下：`Empowa`\
  \ 使用构建在 `Cardano` 上的 `EMP` 令牌，这将帮助世界各地的方以几种独特的方式使用该平台。由于是平台的单一令牌，没有人需要担心使用不同货币交易。这些使用户能够购买\
  \ `Impact Cards`。在交易的另一侧，通过出售 `Impact` 卡获得的 `EMP` 令牌将通过平台的智能合约功能转换为本地货币，而物业实际上正在那里建造。莫桑比克被视为这一特定项目概念验证的候选地。\n\
  \n## 连接未连接者\n\n`Cardano` 还与 `Input-Output Global` (`IOG`) 和 `World Mobile` 合作，使命是确保所有坦桑尼亚人都能拥有移动连接，反过来为他们提供教育、医疗、金融等机会。`World\
  \ Mobile` 声称是第一个建立在区块链上的移动网络。其首席执行官 `Micky Watkins` 对项目的方向非常明确。他在一条推文中说：“要为没有银行账户的人服务，我们必须首先连接未连接的人。世界上有一半没有连接互联网。我们将改变这一点”（World\
  \ Mobile, 2021, para. 2）。\n\n目标是为目前无法享受良好网络稳定性的人口提供稳定且快速的 5G 连接。这种模型似乎很有趣。连接的原因是进入偏远地区并不被普通网络运营商视为价值主张。`World\
  \ Mobile` 通过引入共享经济系统来改变这一点——每家公司可以在网络上运行独立的节点以保持其各自区域的连接，同时获得 `World Mobile` 令牌的激励。\n\
  \n## 智能城市项目\n\n在过去的几年里，新加坡、芝加哥和哥德德堡等城市已成为具有高度数字化城市管理的模型智能城市。区块链有能力为越来越多的城市带来这种水平的精细化。这引起了人们对尝试全面实施细节的浓厚兴趣。乌干达政府与\
  \ `Adanian Labs` 合作，并正在洽将其恩特贝市转变为区块链驱动的智能城市。这个智能城市将包含什么仍有待观察，但齿轮确实在运转。\n\n## 医疗保健\n\
  \n\n\n非洲医疗保健领域的问题非常广泛。无论是艾滋病（HIV）、埃博拉、疟疾，甚至是最近的新冠肺炎，整个大陆的医疗体系几十年来一直都在各种健康危机的压力下挣扎。然而值得注意的是，这些医疗体系也在从失败中吸取教训。对新冠肺炎的应对似乎比以往敏捷得多，显然是从之前的埃博拉疫情中积累了经验。但是，无论医疗专业人员表现得多么高效，在如此有限的资源下，所能做的终究有限的！整个非洲一直在默默地呼唤，渴望一个能够实现更高效疾病监测以及诊断和治疗的系统。此外，非洲人一直对外部势力干预其医疗健康事务持怀疑态度。这些机构（包括世界卫生组织和辉瑞等知名企业）在过去曾将非洲人视作其药物和疫苗研发实验实验室中的“小白鼠”，这已经足以侵蚀人们对这些系统的信任。\n\
  \n我的并不是想表现得听起来像在老调重弹，但至少可以这么说，区块链非常优雅地解决了这些担忧。区块链可以帮助创建一个自给自足的医疗保健生态系统，在保护患者数据的同时，让授权的医生能够立即获取患者的病史和医疗记录。这些受保护的数据可以成为诊断和治疗的主要决定因素。`AfyaRekod`\
  \ 就是这样一个区块链驱动的平台，患者对自己的数据拥有完全权利。这些数据可以存储在患者端，也可以存储在医疗人员端；无论哪种方式，数据都存储在单一地点，使得访问数据不再是一场噩梦，特别是在紧急情况下。\n\
  \n## 信贷/贷款\n\n缺乏获得资本的机会是阻碍希望创业的小型企业家的最大障碍之一。只有略高于四分之一的小型企业（SMEs）能够获得贷款。而且，这仅仅是在正式部门。想象一下非正式部门的统计数据会是什么。这种障碍对青少年影响最大，让他们被困在贫困的枷锁中，从未给他们脱困的机会。`Paylend`\
  \ 是一家肯尼亚金融科技区块链初创公司，试图解决这一问题。在为小型企业家提供贷款解决方案的同时，这家初创公司还试图通过安全收集消费者数据为他们创造价值，他们可以使用这些数据来定制自己的产品和服务。\n\
  \n另一个建立在 `Cardano` 上的有趣项目是 `Liqwid Labs`。它本质上是一个市场，贷款人和借款人可以通过相互借贷资金进行自由互动，参与 `Liqwid`\
  \ 协议的治理，并在过程中获得 `ADA` 令牌作为激励。\n\n我们已经在不同语境下讨论过的一公司是 `Kiva`。在书的开头，我提到过这家公司，它是我向一位想要快速汇款的人士推荐的公司之一。虽然该平台确实可以用于此，但并不是它的主要功能；它的主要功能是向第三世界的小企业主提供贷款。因此，一个在非洲的借款人会申请贷款，然后通过审核和审批流程。这笔贷款随后发布在\
  \ `Kiva` 平台上供贷款人选择，资金会立即转账给借款人。当借款人还钱时，贷款人可以提回资金，也可以将其用于资助其他贷款。这是一个精妙的系统，但再次强调，高额费用可能是小型企业家的障碍。\n\
  \n正如之前过的，区块链的实施不仅关乎物理资源。由于这项技术在基层仍然非常新，实施这项技术可能需要的人力资源可能是稀缺的，特别是在非洲国家。我们之前讨论的与专家合作可以在高层进行，但除非有足够的人在现场实施，否则无法取得多少进展。目前正在开展一些项目帮助帮助少数群体和流离失所青少年青少年区块链技能，以便他们积极参与并从区块链运动中获利。这看起来可能是一个与技术本身实际用途无关的边缘项目，但此类倡议表明了人们开放的心态，而这是技术成功的关键先决条件。\n\
  \n## 西非去中心化联盟 (WADA)\n\n我个人知道基层工作中表现优秀的组织是西非去中心化联盟（West Africa Decentralized Alliance,\
  \ `WADA`），这是一个来自西非的组织。我老实说，我不是区块链专家；我像你一样仍在学习中。但我对区块链改变生活能力的许多认知很大程度上来自于这个组织。他们正在非洲大陆开展着真正具有突破性的工作。他们的主要目标是引导非洲开发者在\
  \ `Cardano` 生态系统中找到合适的区块链解决方案。这是通过在非洲不同地区建立开发驱动的中心来实现的。\n\n他们提出的一个有趣项目是 `Afrixx`。这是他们在\
  \ `Cardano` 区块链上的第一个生成式 NFT 项目。这是一个非常有创意的想法，旨在振兴整个文化，并帮助他们对这项新技术感到更加亲切。`Afrixx`\
  \ 正根据 15 个非洲传说和符号创作约 10,000 件艺术品。真的，这是一种将文化认同融入技术的绝佳方式。通常情况下，早期采用技术可能会略显畏惧。但以 `NFT`\
  \ 的形式注入这种自豪的关联简直是天才之举。\n\n通过这样的倡议，其目标是让非洲人民成为他们变革的主体，并引入社会经济措施帮助他们实现自己的梦想和愿望。他们的工作很大一部分是教育非洲企业家关于分布式治理、去中心化和自我组织。正是此类组织的工作让我越来越接近这种信念：区块链不仅仅是技术。它们是带来自给自足和社会经济赋权的工具。\n\
  \n我发现非常有趣的是非洲人口正处于爆炸边缘——根据 `Worldometer` 2019 年的统计数据，非洲人口的中位年龄约为 19 岁。这意味着年轻且充满活力的人力资源可能成为非洲技术革命中最宝贵的资产。随着像\
  \ `WADA` 这样的组织培养这些青少年使用区块链技术造社会，我确定非洲的发展及其人民的繁荣将掌握在可靠手中。\n\n# 第四部分：区块链颠覆\n\n在这一部分中，我们将审视全球区块链颠覆的情景。我们探索区块链正在留下印记的每一个领域，同时调查它们对大众的影响。其中一些可能还没有经过证明的案例研究，但仍然是有用的案例。在这里，你将看到区块链在你周围的广泛存在。那里地方有更多的技术——谁知道呢，它可能就在你的后院工作！\n\
  \n# 第 8 章：治理\n\n如果我们能防止政府在照顾人们的借口下浪费人民的劳动，他们就会变得幸福。\n\n- 托马斯·杰斐逊\n\n\n\n世界上多个政府，无论属于右翼还是左翼，都为了满足自身的既得利益而剥削大众，受意识形态的影响远大于对选民的情绪或福利。历史中充满了不同时期的此类例子。战争在寻求公民福利的借口下爆发，导致了生命的损失。即便此时此刻，战争仍以“更好世界”的名义在全球多个地区肆虐。我也想要一个更好的世界，每个人都是如此。我只是不想让它通过腐败、社区和政治分裂以及无意义的战争来实现。今天，我们人民有机会推翻这几个世纪以来由各国政府传播的错误观念——区块链就是这个机会，如果我们不全心投入地接受它将是愚蠢的。\n\
  \n随着政治权力让治理过程变得日益晦暗，人们对政府运作的信任也随下降。这种情况不仅发生在发展中国家，全球各地的发达国家也是如此。加拿大政府近期冻结了所有向反对政府指令的抗议活动捐赠哪怕是最小金额的账户，根据疫苗接种状态对人进行歧视。尽管他们在约一周后解冻了大部分账户，但有推测认为某些账户可能永远无法恢复。这种对权力的公然滥用似乎完全是不正当的。即使加密货币交易所\
  \ `Kraken` 在处理某些抗议者的加密资产时，也被要求冻结，尽管这些加密货币并不属于政府监管范围。人们已经感到疲惫和不信任，而且对于那些保护选民的虚假承诺，这种怀疑是合理的。此外，选举程序本身是如此混乱，以至于是最民主的国家也发现自己在旨在劫持民主过程的腐败影响中摇摇欲坠。\n\
  \n例如，最近印度和美国的选举。在印度，他们在使用电子投票机（`EVMs`），因为这些机器被认为更准确。然而，在几乎每场选举中，都有报告称随机人员在没有遵循正规流程的情况下带走了某些\
  \ `EVMs`。此外，还有报告称 `EVMs` 可能会被黑客攻击，使得看起来公民将票投给了某个政党，而实际上选票却给了别人。那么，即使使用了 `EVMs`，公民又如何确保自己的选票无误呢？\n\
  \n即使在最近的美国总统选举中，落败的共和党也对选民欺诈提出了许多问题。诚然，这两个国家的投票程序非常不同。而且，在美国关于选民欺诈的所有指控都经过了调查，尽管存在不规范之处，但法院并未将其视为干预选举的广泛尝试，而是孤立事件。但是，想象一下投入这一程序的时间和财务资源。\n\
  \n如果存在一个系统，关于有效性的问题永远不会产生会怎样？嗯，这不再是幻想了。区块链承担了将这种信任带回系统的任务。而且，多个国家和州一直在使用这项技术来保护他们的民主制度。你可能会惊讶地发现，犹他州是可以通过电子邮件投票的州之一。不过，我稍后会详细讨论这一点。\n\
  \n我想在这里强调的一点点是，无论哪个政府上台，无论是哪个政党或政治家，我们都必须理解权力大于其中任何一个。这意味着，无论你投票投给谁，无论谁获胜，掌权者都需要承担责任。这更多是人性的问题而非性格问题——权力和贪婪会腐败最优秀的人。此外，民主的意义不在于在场外为你喜爱的赛马欢呼并然后将他们奉上神坛。相反，它的意义在于能够就他们的行动以及缺乏行动向他们提问。我再次敦促你们，不要仅仅从政治角度来看待，而要从人类行为的角度来看待。你会发现，政府不是为了选择你最喜欢的一方，而是为了让任何获胜的一方对他们为改善公共生活所做的承诺承担责任。让我们尝试理解区块链如何在全球范围内使治理更加高效。\n\
  \n## 区块链治理\n\n关于区块链治理，我们需要了解的第一点是，此类倡议的目的是赋予你最高水平的权力——创建一个真正意义上的民主。想想我们现在所生活的民主；我们选出代表来传达我们的诉求或对某些政策、意识形态、问题的支持。很多时候，我们发现自己对这些代表感到失望，因为他们后来被证明有自己的意图。在某种程度上，这些代表也是我们为了建立功能性等级而选择的中间人，你不觉得吗？\n\
  \n现在，我推测我们已经很好地理解了一点，那就是区块链讨厌中间人。那么，如果不是选择这些代表，而是你可以坐在舒适的沙发上直接对相关问题投票，会怎样？这个想法对许多人来说可能很离谱，但某些区块链已经在其实际运行使用了这种真正的去中心化意识形态。如果规模得当，没有理由它们在未来不能建立一个完全去中心化的政府。我们将在下一节关于\
  \ `Cardano` 区块链运作的部分详细讨论这一点。但在那之前，让我们从小开始，尝试理解区块链将如何融入我们现在的治理模式。老实说，这一成就不亚于改变整个系统。区块链在治理的许多领域一直扮演着破坏者的角色。让我们来看看。\n\
  \n### 城市管理\n\n我们已经提到了恩特贝的智能城市项目，现在让我们深入一点。为什么智能城市最近如此关注？仅仅是因为想追上技术潮流吗？可能吧，但还有一个实用的原因。我们作为一个社会正处于一种困境。我们希望扩张城市定点以支持日益增长的人口需求，但也希望减少投入这方面的预算。智能城市通过大幅减少所需的时间财务资源优雅地解决了这个问题。它们为运作带来的效率是一个极好的副产品。\n\
  \n每当视线上出现重大技术时，怀疑者就会对变化感到担忧。区块链也不例外。许多对区块链提出的批评并非出于知情的认知，而是出于误导性的无知。但尽管最初存在阻力，一些国家和城市正在向世界展示这项技术可以带来的繁荣证据。\n\
  \n无论是爱沙尼亚这样的国家，还是像迪拜这样的大城市，人们都在从区块链治理中获益。你可能会因此认为区块链只适用于整个国家或像迪拜这样的大城市。虽然区块链在被更大的系统采用时确实更有用，因为这些系统提供了巨大的互操作性，但这并非前提条件。以瑞士的格\
  \ Zug（Zug）为例。格是一个小镇，也是世界上第一个采用 `Bitcoin` 作为政府支付手段的地区。这个从市级开始的小实验，现在已经发展成为极其复杂的生态系统，现在被称为“加密谷”。\n\
  \n\n\n\n为什么要做到这一步呢！？我们在科奇伦（Cochrane）正迎来一个智慧城市，那里是加拿大安大略省北部中部一个偏远的小镇。正如我们在非洲部分地区看到的那样，疫情对这里的人来说也是一次大觉醒，商会已借此机会创建一个自给自足的城镇，而\
  \ `blockchain` 和 `cryptocurrency` 将其中发挥关键作用。这看起来可能只是一个很小的开始，但预计未来将吸引大量的投资。我个人对这一发展感到非常兴奋，因为我喜欢这种想法：`blockchain`\
  \ 不再是未来的技术，或者只有大玩家才想参与的东西！它就在当下，就在此地，离我们每个人的生活如此如此。你可以确定的是，在不久的将来，你的生活很大一部分将受到 `blockchains`\
  \ 的影响，如果还没有发生的话话。\n\n`blockchain` 实现的魅力之处不在于该技术的精妙理论，而在于它在你我生活中的实际应用。以一个损坏的路灯举简单的例子吧。回想一下，有人来维修它需要多长时间。对这类细节进行人工监控是一项艰巨的任务。现在，想象一下\
  \ `blockchain` 进入这种情况。路灯安装了传感器。灯光出现故障的瞬间，就会触发一个 `smart contract`，生成一个任务并发送给技术人员，他们会立即来维修路灯。由于是在\
  \ `blockchain` 上，执行任务的人员身份经过验证，数据会被存储，以备未来可能发生任何此类问题。这些数据随后可以利用政府资金对安装路灯和传感器的公司进行审计。这还确保了质量保证并监控了腐败。这就是\
  \ `blockchains` 在你生活中的应用可以如此简单。\n\n无论是什么技术，除非你理解它它是如何影响你的，否则它就没有任何意义。一项不能让你的生活变得更轻松、更好的宏大技术是一种机会的浪费。但同时，如果你没有识别出这项技术带来的意义——如果你不参与其中，那也将是一种机会的浪费，也许是更大的浪费。\n\
  \n### 食品安全\n\n大多数人认为，食物匮乏是导致第三世界国家饱受营养不良的原因。然而，现实要复杂得多。确实，食物短缺是事实；但当数百万人在晚上饥饿着睡去时，也有大量的食物被直接扔进了垃圾桶。受饥饿之苦的人数可能少得多。\n\
  \n在现代世界，生产的食物没有触及更多的人，原因是食物经过了复杂的供应链。此外，这些是闭环且不透明的过程，使得更难定位问题，更不用说解决它了。正如预期的那样，饥饿只是这种做法产生的不公现象之一。由于这种做法，可持续性几十年来一直被抛之脑外。而且我们已经看到它是如何影响农民的，使他们的生活变得日益困难。总而言之，这些过长、复杂的供应链对任何人都没有处。但奇怪的是，直到最近，从未有人关注过减少这种低效率和由此产生的浪费，大多数努力一直集中在提高生产力上。\n\
  \n`Blockchains` 在这里是完美的颠覆者，因为以前存在广泛的问责真空。今天，许多大玩家已进入这一领域，并积极使用 `blockchains` 来保护食品质量。`Walmart`\
  \ 就是这样的一家。如果你在这里买过任何绿色蔬菜，那么你已经是 `blockchain` 技术的受益者。这是因为 `Walmart` 已要求所有的绿叶蔬菜供应商必须在\
  \ `blockchain` 上上传详细信息以及产品数据——这使得信息极易获取且无法操纵。他们声称，他们的 `smart tracking technology`\
  \ 帮助他们将产品污染的追踪到几秒钟以内。这对生产者来说是一个巨大的解脱，他们以前一直因为无人不在场的情况污染而冒着大规模食品传播疾病的风险。它还节省了原本花在产品召回上的大量时间和资源。另一家在众多食品公司中首批基于\
  \ `blockchain` 的供应链的公司是 `Nestle`。他们的目标是让所有产品和供应链相关信息对终端用户随时可用，从而增强对品牌本身的信任。\n\n\
  `Supply chain blockchains` 在农业 `blockchains` 的案例中也可以起到补充作用。它们可以为我们提供消费者行为的关键数据，这反过来对于根据位置确定需求模式非常有帮助。更紧密地根据这种需求调整供应对于减少食物浪费非常有效；多余的部分可以转到其他可能存在未满足需求的地方。\n\
  \n感谢对可持续性意识的提高以及对我们弱势群体日益增长的同情，导致了食品行业的一场真正的 `blockchain movement`。政府在促进公共部门 `blockchain\
  \ adoption` 方面将发挥主要作用。通过他们制定的标准和政策，他们能够使向 `blockchain` 的过渡更加顺利。\n\n### 投票\n\n民主听起来是一个极佳的概念，是实现民意的极佳的练习，但当人们似乎不在乎时会发生什么？选民冷淡一直是困扰全球所有民主选举的担忧。你可能会认为，随着腐败的增加，出来投票的人会越来越多。但事实似乎恰恰相反；随着信任度的下降，真正认为投票对事物运行有影响的选民人数也随之减少。一个常见的借口是投票是一个乏味且耗费时间的过程。现在，想象一下有一种方法可以让你像拿起手机并点击屏幕上的按钮那样轻松地投票。你会接受吗？大多数人都会接受，而且如果你住在像\
  \ `Utah County`、`West Virginia` 等这样的地方，很有可能已经听说过数字选票，即使没用过也可能。\n\n像 `Voatz` 和 `Follow\
  \ My Vote` 这样的公司负责端到端的投票程序，允许公民通过手机投选。虽然在投票中使用 `blockchains` 得到了认可，但问题和批评针对的是这些公司的基础设施。批评者仍然对整个过程的机密性不信服。他们认为，由于很大程度上取决于选民网络使用的安全性，网站很容易被黑入。`Voatz`\
  \ 的官员已确认，他们的技术有一项功能可以使他们识别并拒绝来自不安全网络的选票。值得注意的是，他们的程序也通过了现场审计的测试。\n\n\n\n\n正如我之前讨论过的，大多数对区块链的抵制源于将其与特定的政治意识形态联系起来。我们需要记住，区块链是一种技术，既不是好也不是坏，取决于我们如何使用它。如果我们允许具有破坏性议程的受政治驱动的人来主导技术的采用，那么它可能会被用来违背人民的利益。但是，如果你和我确保参与并维护民主的神圣性，那么你就有很大机会夺回你被剥夺的民主声音。你的参与就是你的投票，它将影响这项技术的发展。关于这项技术，迈克·马洛尼（Mike\
  \ Maloney）的话是一个温和的提醒——它“要么奴役我们，要么解放我们”。\n\n我们到目前为止讨论的是区块链在投票系统中的当前应用。但，还记得在节章节开头，我们谈论过完全消除代表制度吗？好吧，我承认那是非常遥远的未来；我们还没有到那一步。但我希望你能够理解区块链对我们的民主可能意味着什么。区块链可以实现一种“真正的民主”，在运作上保持\
  \ 100% 透明，在任何政策被采纳或任何法律通过之前，都会征求你的意见。你的投票将具有前所未有的意义。当然，要将其变为现实，必须通过大量的法律，坦率地说，这可能需要多年时间。但我提到这一点是因为这场和平革命必须从某处开始——我们有力量去要求，而且一旦它流行起来，没有任何东西能阻止它。我敦促你要求更大的自由、更透明的系统以及由区块链驱动的未来。\n\
  \n我们已经查看了多个与各种政府合作运行的区块链项目。但，你会惊讶地发现，还有许多我们尚未触及的项目。除了我们已经讨论过的由区块链驱动的土地登记系统和公民数字身份等大影响力的项目外，公共部门还可以开展其他项目，以一种更高效的方式与公民互动。然而，这个想法并不是要用这些项目的名称淹没，而是让你知道世界各地的系统，更重要的是你周围的系统正在发生变化——你可以成为变革的执行者，也可以做一个被动的旁观者。你可以喜欢它们，也可以讨厌它们，但你不能忽视它们，因为区块链已经在这里，并且将一直存在。\n\
  \n## Cardano 的去中心化治理\n\n我想将其作为一个完全、透明民主的案例研究来介绍。是的，我知道你在想——运行一个加密货币社区和运行整个国家的民主是两件非常、非常不同的事情。但请听我解释，因为我真的相信这个过程是可扩展的，如果我们管理好这一点，这可能是现代文明最重大的成就之一。\n\
  \nCardano 在所有领域、所有层面的去中心化本质总是令我印象深刻。我完全意识到我的表现似乎对它有一点偏见（也许确实如此，就一点点）。我希望你尽可能地吸收你周围的区块链信息，并选出你自己的喜爱的平台。尽可能了解现有的所有平台，并根据自己的价值观决定哪一个最符合你。我发现我被这个区块链平台所吸引，完全是因为它们提倡的开放性和参与性。我认为，没有什么比运行在去中心化方法论上的去中心化工具更棒了。但请记住，尽管我在这里提及的任何内容都是坚实的事实，但它们并不是唯一的事实。区块链每天、每刻都在增长；即使在我们说话时，区块链领域也有新事物出现。我希望你也能体验到像我那样的快乐，自己去发现更多利用这项技术促进社会善的区块链平台。不要让我的喜好影响了你的认知。因为我最不想看到的是，这本书让你对区块链产生偏见且封闭的观点。\n\
  \n所以，让我们谈谈 Cardano 吧！到为止，我们查看了 Cardano 执行去中心化原则的项目。现在，让我们看看它如何以同样的原则运行其自身的职能。正如我提到的，观察这个过程很有用，因为它对我们的民主进程也具有有益的启示。它为我们提供了证明：如果我们能激励公民在程序中发挥积极作用，同时确保他们投出的票因为被不可篡改地记录而具有重要性，那么真正的民主实际上是可能的。在\
  \ Cardano 创始人（Hoskinson）的一段常规视频 `On Governance (Part I)` 中，这个过程被简明扼要地解释了 (Hoskinson,\
  \ 2020)。\n\nHoskinson 指出治理问题包含两个部分：决策制定和财务资源。在中心化环境中发生的情况是，中央权威默认在不经过太多深思的情况下处理这些事情。那将类似于专权独裁。但比赤裸裸的独裁更常见的是伪装的民主。正如《动物农场》书中的名言所说：“所有动物都是平等的，但某些动物比其他动物更平等”（Orwell,\
  \ 1945）。在这里，某些声音也拥有更大的权重。通常情况下，这种权重是由每个人投入运行的资金量隐式决定的——钱越多，声音就越大。\n\nCardano 通过创建一个名为\
  \ `Voltaire` 的沙盒来解决这个问题。这本质上是一组协议和实验，用于为 `Cardano (ADA)` 区块带来变革和对财务支出的决策。它被设计为对\
  \ ADA 持有者尽可能公平，无论他们持有的代币数量。这些实验利用 `激励测试网 (ITN)` 来测试不同民主投票方法的有效性。这些实验在实际 Cardano\
  \ 区块并行的、有许可或无许可的侧链上运行，目标是在较短的时间内测试不同的方法。这些模拟基于从 Cardano 区块接收的数据。通过这些数据，选出有资格参与投票的\
  \ ADA 持有者。\n\n\n\n因此，选民需要提交一份“选票”。这就像一份关于他们希望如何支出资金的提案——也许启动一个区块链计划、创办公司、对 Cardano\
  \ 生态系统进行某些改进等。这些选票会被发送到 `Submittable`，这是一个社会影响平台，它会首先筛选这些选票是否存在任何恶意元素（如 `D-DOS`\
  \ 攻击），然后让它们通过一个名为“创新管理”的过程。在这里，社区成员和专家会受到激励，以认真检查选票中想法的有效性。现在，在此时，没有任何选票被拒绝，而是被赋予评分。一旦评分完成，选票将经过两轮投票：偏好投票（用于决定需要优先考虑哪些领域）和门槛投票（用于决定选票中的哪些想法可以获得资助）。\n\
  \n这个系统的完美之处在于，无论社区成员持有多少个 `ADA` 代币，他们的声音与其他人相比都不会受到任何差别对待。只要想法符合人们利益并获得批准，它就会被实施。请记住，我在这里讨论的只是投票过程的一个轮廓。实际的投票非常复杂。\n\
  \n你可能会问，这种投票机制与你有什么关系？我希望你将这个系统与你的市政投票进行比较。如果公民们有机会参与类似的事情会怎样？\n\n例如，在加拿大，有一种在选举期间举行的公投。因此，在投票选出代表时，公民也有机会对他们认为最相关的解决重大问题进行投票。在目前的制度中，这种情况并不常见。现在，想象一下，这种公投随着区块链的便利性而变得越来越频繁，公民参与到影响他们社区的大多数甚至所有重大决策。\n\
  \n这种区块链机制向我们证明了真正的去中心化是非常可能的，而且也可以在地方政府层面实施。`Cardano` 的投票几乎每六到八周举行一次，期间会引入新的功能和政策。如果我们能为公民创建一个类似的激励计划，没有理由无法实现强有参与。是时候夺回我们的声音并让它产生意义了。\n\
  \n# 第 9 章：银与金融领域\n\n让世界上邪恶的中央银行模式如此有效的关键在于，普通百姓——水管工、电工、教师、调酒师、公共公交司机或理发师——并不理解它。——\
  \ 乌鸦所云\n\n长期以来，我们的银行机构一直享有作为金钱守护者所拥有的皇室地位。不仅如此，他们还享有了根据他们认为合适的方法和发行货币的无限权力。当然，这种分配从是不公平的，为经济带来的问题比解决的问题还要多。在\
  \ `2008` 危机之后，幻灭感彻底爆发了；这些守护者自己已经变成了叛徒，背叛了数千人的信任。而且，这正是我们开始认真考虑这意味着什么——这些对我们的生活、经济、贸易、一切都拥有如此无限控制权的机构到底是什么？我们真的需要这些守护者吗？\n\
  \n随着加密货币日益受到关注，银行界的大多数人——那些坐在象牙塔里的人——似乎认为这只是一个暂时的趋势，会像 70 年代的喇叭裤时尚一样消失。他们获得的动力越强，就越意识到这种转变是不可避免的。他们获得的动力越强，就越意识到这种转变是不可避免的。他们获得的动力越强，就越意识到这种转变是不可避免的。他们获得的动力越强，就越意识到这种转变是不可避免的。他们获得的动力越强，就越意识到这种转变是不可避免的。他们获得的动力越强，就越意识到这种转变是不可避免的。他们获得的动力越强，就越意识到这种转变是不可避免的。他们获得的动力越强，就越意识到这种转变是不可避免的。他们获得的动力越强，就越意识到这种转变是不可避免的。\n\
  \n\n\n尽管 2021 年通常被誉为代币之年，但必须注意到，在开放金融解决方案中，区块链更有可能是许可链。因此，数据在公共领域内从未真正完全透明。此外，中央银行仍然掌握着你的资金，这些资金仍然受中心化法律限制的监管。但总而言之，这仍然是增加人们对数字货币接受度的一小步，而且实际上确实已经在经济界得到了广泛接受。\n\
  \n在指出了区块链带来的金融发展之后，也有必要提出警告。不要被这些进步带来的虚假安全感所迷惑，尤其是像已经成为新闻焦点一段时间的央行数字货币（`CBDC`）。这只不过是传统银行试图转型到区块链空间的一种。它们完全破坏了区块链的目的，因为区块链本应该是去中心化的，而这仅仅是运行在区块链上的法币。这可能被认为是披着区块链新外衣的、旧有的危险的中心化货币系统。\n\
  \n另一方面，去中心化金融（`DeFi`）正是我们一直以来讨论的内容。它消除了所有中间环节，是区块链最初初衷的真实应用。尽管越来越多的国家对加密货币敞开了怀抱，但在大多数国家仍然存在监管障碍。萨尔瓦多成为第一个宣布将\
  \ `Bitcoin` 为国家货币的国家，并现在与 DeFi 借贷平台 `Acumen` 合作，帮助小企业家获得以比特币为支持的贷款。\n\n# 股票交易\n\n\
  在金融世界，股票交易可能是区块链最稳健的应用。2019 年，全球股票市场价值为 77.6 万亿美元（Daley, 2019），到 2021 年增加到 95 万亿美元（Mitova,\
  \ 2021）。由于股票交易每日交易价值的增长速度很快，投入最先进且有效的技术来记录这些交易变得至关重要。对于许多人来说，明显的逻辑选择就是区块链。这也包括大头\
  \ `NASDAQ`（纳斯达克），它已经发布了多种基于区块链的指数。这些指数被用于跟踪公司的表现。\n\n股票市场与区块链完美契合，主要是因为涉及多个中间商和监管协议的繁琐程序。无论是加密货币交易的潜力，还是智能合约在股票交易中的巨大效用，区块链都在所有正确的原因吸引着交易公司。多家公司已加入竞争，而且新的进入者不断涌。像\
  \ `ShapeShift`、`Circle`、`Coinbase`、`Blockstream` 等公司都在利用区块链基础设施进行加密资产交易。\n\n这些区块链基础设施在很大程度上实现了系统自动化，使其变得高效得多。然而，在交易场景中，区块链的应用似乎比仅仅结算股票交易广泛得多。它是帮助公司跟踪系统性风险、证券贷款、资产管理等方面的一股主要力量。募资活动也变得更容易追踪了。但最重要的是，从消费者的角度来看，交易成本可以被大幅降低，让个人在获利交易中留有更多资金。虽然在所有情况下可能无法实现，但再次，在没有重大监管变化的情况下，中间商仍然可以被取代（至少在某些情况下），帮助个人获得更快的结算。\n\
  \n# 信贷与贷款\n\n正如我们在非洲区块链运动中所看到的，由区块链驱动的贷款和信贷解决方案构成了重要组成部分。当 `Dr. Yunus` 在 2006 年获得诺贝尔和平奖时，微型金融成为了一种运动。\n\
  \n银行和机构对融资持审慎态度，因为目前没有足够的数据来确定客户的还款能力。此外，规避了验证和发放贷款所需的人力成本，因为 `smart contracts`（智能合约）可以使过程变得尽可能顺畅。由于个人记录和任何其他文件都存储在网上，这些文件丢失或损坏的概率几乎为零。\n\
  \n此外，区块链还可以影响抵押贷款的处理，从而帮助房主。记录交易的不可篡改性使其更具价值。现在，你会发现在抵押贷款方面区块链还不是标准做法。但它们正在受到关注，像\
  \ `Synechron` 这样的区块链加速器已经在改进用户体验以及抵押贷款流程的速度了。\n\n# 贸易金融\n\n国际贸易市场价值数万亿美元，贸易金融已成为区块链复兴的关键领域之一。在一个如此巨大的行业中，行业欺诈随之增加并不意外，特别是在应收账款方面。虚假的应收账款损害了即使是像\
  \ `Citigroup`这样的大集团的声誉。无论是重复融资案例（即误导两个或多家银行对同一贸易应收账款提供融资），还是从一开始就是虚假的应收账款，贸易金融欺诈导致了数十亿美元的诉讼和风险敞口。\n\
  \n\n\n\n这看起来似乎只是为了企业的利益，对普通人没有太大帮助。这种说法只有部分正确。像你我这样的人可能不会直接受到此影响，但让我们面对现实：贸易影响着每个人，即使你不是某些特定贸易产品的消费者。它是我们经济的支柱。欺诈性贸易往往是由腐败文化的滋生所推动的，而这种文化无疑影响着每一位公民。如果贸易开始崩溃，谁也知道下一个出现在名单上的会是什么。\n\
  \n## 保险\n\n目前的中心化保险系统存在的主要问题，很大程度上在于它在试图核实理赔和检测欺诈（如果有的话）时产生的成本。产品开发、管理、文档记录、理赔验证以及其他多种协议的繁琐过程消耗了大量时间。虽然对于大实体来说这区别不大，但较小的实体可能会感到被困在这样的系统中——一方面，保费可能高到无法负担，但让自己和家人暴露在灾难面前似乎可能更可怕。\n\
  \n这就是微保险（microinsurance）概念的用武。微保险与微型金融的概念非常相似，旨在为那些可能负担不起太多高端保险产品的人提供保护。`ACRE Africa`\
  \ 在肯尼亚针对小农户成功地运营这种模式。在接触弱势群体时，保险公司必须尝试理解基层产生的问题。例如，`ACRE Africa` 已经识别出传统保险系统中让农户望而远之的一些主要问题。\n\
  \n除了负担能力，这些农民似乎对他们支付的保费是否真的能以理赔结算的形式回到他们手中持态度。对传统系统信任的侵蚀问题再次显现。缺乏透明度的相关因素也起了作用，而结算前的漫长周期使这种状况变得更加糟糕。区块链驱动的\
  \ `ACRE Africa` 正通过将“无须信任赖”带回系统来改变这一切。此外，以前需要消耗大量资源和资金的整个过程，可以在区块链系统上一次性完成。这导致了公司以及农民成本的大幅下降。\n\
  \n另一个方面是，中心化系统通常具有僵化的数据点，如果被保险人的情况稍微偏离标准，资金发放可能会卡在循环中。为了理解这一点，请考虑一位作物遭受蝗灾侵袭的农户。在中心化保险系统中，理赔可能会根据该地区的状况进行结算。如果该地区的其他农场没有被毁，保险公司可能会决定该农户不符合理赔条件。\n\
  \n如果同样的情况发生在基于区块链的保险公司，理赔将在 `smart contracts` 的帮助下发放，智能合约具有考虑灵活数据点的条款。因此，理赔验证将基于从安装的传感器中获取的数据，这些数据会触发\
  \ `smart contract` 并自动、实时释放资金。因此，蝗灾会立即被传感器捕捉到，使得繁琐的尽职调查程序几乎变得多余。时间线现在从平均三周缩短到在当天收到结算。\n\
  \n区块链保险的另一个用例将与我们在下一节中讨论的医疗保健有关。目前，重要的是记住医疗保健系统迫切需要这种有意义的变革。我们已经在非洲的章节中看到了区块链对医疗保健产生的影响。患者记录被安全地记录在一个处以供授权医生访问，这一简单事实本身就能拯救生命。再加上根除假药贸易等等更多方面，我们得到了一个医疗保健与区块链相结合的、真正改变生活的组合。\n\
  \n即使在医疗保健行业内部，也可以识别出多个领域，这些领域的参与者已经意识到了区块链能带来的潜力。尽管如此，医疗卫生专业人员对系统的变革也存在明显的抵触情绪。虽然在现代设施中，平板电脑和电脑是系统中输入患者数据的媒介，但许多地方并不属于这一类别。人们对于电子数据容易受到黑客攻击仍然存在特别的不信任。这种担心当然不是完全空穴的，而将系统转移到区块链可以圆满地解决这一忧虑。与其说这是一个技术问题，不如说这是一个意识问题。\n\
  \n\n\n\n患者记录不仅在发展中国家是争议焦点，在发达国家也是如此。电子健康记录为从有利于患者的角度出发来整合系统提供了机会。只需在手机屏幕上轻轻点一下，即可在各种系统和部门之间访问这些电子记录。这种互操作性可以节省医疗人员以及患者的宝贵时间。此外，正如我们在非洲章节中讨论的那样，这种系统让患者对自己的医疗数据拥有绝对控制权，并消除了此类数据被滥用的可能性。\n\
  \n虽然这似乎是医疗保健领域最令人兴奋的场景，但该过程也经历了大量的监管检查和审查。然而，疫情似乎催化了许多去中心化应用（或 `DApps`）的增长。这些应用已经存在很久了，大约从\
  \ 2014-15 年左右，有些甚至更早；但疫情将普通大众的注意力转向了对这种去中心化、安全的电子健康记录平台的紧迫需求。`Ever`、`Patientory`、`Curisium`、`Chronicled`\
  \ 等许多公司为用户提供了多样的健康追踪功能。\n\n尽管这些服务非常有效，但它们仍处于进行阶段。医疗保健领域的区块链梦想仍然是一个希望，每个个人都将获得用于数字健康钱包的唯一身份。这将包括他们服用过的每种药物，以及他们在家乡、度假地或出差期间咨询过的每位医生——患者还可以根据需要添加任何他们认为有必要的信息。这些信息仅在个人认为恰当时才会开放访问。随着区块链医疗保健的成熟，目前的监管担忧将得到解决，以实现更顺畅的运行。\n\
  \n## 药物行业\n\n区块链在制药领域的应用测试比我们之前讨论的假药追踪要广泛得多。让我们退后一步来看。你是否想过，当你已经康复后，药物会发生什么？通常情况下，药物躺在你的药柜里超过了过期日期，并最终被扔掉。这也不是你的错，因为反正你又把它们送给谁呢？\n\
  \n在 `COVID-19` 疫情期间，一对在印度孟买的医生夫妇的故事传遍了网络。当该国家与病毒的第二波浪斗争时，药品领域经历了严重的短缺。这对夫妇决定采用一种非常小且基础的创新。他们联系了圈子里的所有人——只要他们认识的人曾被诊断为患\
  \ `COVID-19`（这类人有很多）。这对夫妇随后要求他们翻遍药柜，看看是否有因诊断 `COVID-19` 而留下的药物。结果证明，他们成功收集了 44 磅（20\
  \ 公斤）未使用的药物，并将其分给了穷人。这是一个非常微小的行动，它之所以成功是因为它是一项小规模的任务。由于收集和分发过程中涉及多个环节，这可能会变得非常混乱。又可能呢？\n\
  \n区块链正在帮助药店在更大的规模上做同样的事情。非营利药店 `Good Shepherd Pharmacy` 与孟菲斯大学的 `FedEx Institute\
  \ of Technology` 以及纳什维尔的 `Lipscomb University` 合作，建立了一个由区块链驱动的供应链，用于从该地区收集捐赠的药物。这包括未使用的口服化疗药物。捐赠者只需前往\
  \ `RemediChain` 应用，并在手机界面上进行捐赠即可。这些药物随后可以分发给那些负担不起此类昂贵药物的人。\n\n## 医疗设备\n\n一个令人兴奋的领域，几年前还只是医疗幻想，但现在已蓬勃发展为一个大行业，医疗物联网（`IoMT`）。这包括多种医疗设备之间的相互作用：一些用于患者护理——如床边监护仪、呼吸机等；另一些则是我们日常健康追踪的一部分——如智能手表、健身追踪器等。区块链在这一设置中发挥了巨大的作用。\n\
  \n`IoMT` 的中心化方法可能非常耗时，甚至是危险的。想象这样一种情况：一家医院有几个分院，设备源自某特定公司。现在，每台设备在每家医院的性能都会在设备公司的总部进行跟踪和分析。对于时间敏感的信息，回传到使用该设备的医院可能需要几天甚至几周时间。在此期间，患者暴露在危险之中，医院可能面临诉讼风险。这样的系统对谁都没有帮助。相反，在区块链上，信息的验证和传输是快速的，在很大程度上弥补了时间间隔。\n\
  \n苏格兰的国家医疗服务体系（`NHS`）运行了一项区块链试点来解决这些问题。他们发现，该系统在传输信息方面不仅高效得多，还让每家医院拥有了设备实时位置的优势。它甚至为他们提供了操作这些设备的人员数据——他们的资质、证书、经验等。在评估例如新设备的设备的性能时，这些数据极其相关。如果人员没有经过适当培训来操作设备，性能可能会非常偏差，数据完全是错误的。如果尽管其他方面都正常，设备性能仍然存在问题，那么可能意味着需要启动召回。逻辑是，数据召回越快，损失就越小。区块链让这些快速的召回成为可能。\n\
  \n## 认证协议\n\n在医疗保健领域，认证是指对医疗执业人员资质的审核。为了让医生能够治疗患者，当他们进入新机构时必须履行这一协议。还有定期的检查，以保持信息更新。这是医院必须遵守的法规，以维护患者利益，并确保医院的声誉。但尽管这些方法很有用，但它们也很繁琐——需要医院维护、评估和验证多份记录，而医生则在等待这些结果。\n\
  \n此外，维护成本太高且冗余，因为所有的医院都在做相同的事情，但是在各自孤岛中进行的，这没有意义。例如，如果一个医生从一家医院搬到另一家，同样的程序必须重新完成。这可以通过所有医院共同提供的统一系统来解决。该系统甚至可以作为医疗提供者目录。\n\
  \n汇聚了医疗保健领域各种公司（`Aetna`、`Humana`、`Quest Diagnostics`、`UnitedHealth` 等）的 `Synaptic\
  \ Health Alliance` 使用区块链解决方案进行跨公司的信息共享。这些每家公司都有自己的提供者，整合资源对于医疗提供者和患者来说都更加实用有用。专业认证交易所（`ProCredEx`）与\
  \ `Hashed Health` 合作，启动了另一个区块链驱动的平台，可以从多个独立来源获取并验证信息。他们的工作非常令人印象深刻，已经以 `Texas Health\
  \ Care System` 的形式找到了用户。\n\n\n\n\n`blockchain` 技术能够激发信任，正是由于其去中心化的特性，这导致医疗保健系统面临的大多数问题的主要因素之一。在这里讨论的项目都基于\
  \ `United States`；但事实是，此类倡议正在世界各地涌现，极大地减少了对欺诈的恐惧以及被此类欺诈所占用的资金。现在，患者唯一需要担心的是康复，而不是他们何时、如何或是否会获得可靠的治疗。\n\
  \n## 财务\n\n我知道我们已经讨论过金融部门，但由于其敏感性，医疗保健领域的财务需要单独讨论。回想你上一次去医院的经历，即使只是一件微不足事。在这种环境下，焦虑感可能是显而易见的，脆弱性也是非常真实的。已经出现了一些案例，显示医疗专业人员似乎在利用这种脆弱性，开具检查单并堆积账单。数十亿美元的资金损失于此类欺诈和滥用。\n\
  \n在传统的医疗模式中，医疗服务提供者在治疗完成后提交索赔申请以获得治疗费用。这些索赔申请将由保险公司进行审核并支付。这种系统让患者处于被动地位，他们完全被排除在决策过程之外。我们之前提到的患者控制电子记录系统，正因为这一点而至关重要：让他们掌握主动权，从而减少欺诈风险。\n\
  \n`United States` 一家名为 `Change Health` 的大型健康覆盖机构承担了创建用于账单和支付的 `blockchain` 解决方案的责任。他们几年前与一家名为\
  \ `PokitDok` 的小企业合作，并正成功地应对竞争。\n\n这可能与前述项目略有不同，但尽管如此，它为美国医疗保健带来了某种信誉。`United States`\
  \ `卫生和人类服务部` 的一个早期项目，名为 `Accelerate`，是一个采购和收购计划，在采购高效且具有成本效益的服务方面取得了很大成功。这种收购可能发生在所有不同领域，但最终正在为大众的健康和福祉做出贡献。\n\
  \n## 临床试验\n\n临床试验通常漫长且复杂，并需要严格遵守相关法规。长期以来，关于透明度的问题在很多情况下一直被带过。对知情同意、方法论、临床结果甚至批准的担忧从从初就一直困扰着这些试验。尽管大多数医疗执业人员遵循伦理行为准则，遗憾的是，并非所有人都是如此。日益增加的偏见、不当行为和欺诈风险不仅可能污染研究结果导致资源浪费，在最极端的情况下甚至会导致患者伤亡。`Blockchains`\
  \ 可以简化这些流程，减少死亡人数，并降低医疗服务提供者承担责任的风险。\n\n任何研究试验都必须经过几个阶段，并且每个阶段必须遵守一套不同的程序。在不深入探讨试验性质的情况下，让我们直接跳到\
  \ `blockchain` 在这一领域的应用。这些试验中可以识别出三个主要的应用领域——跟踪各阶段的时间顺序、通过时间戳对数据在这些阶段的移动的可追溯性，以及通过确保不可篡改性来维护数据的完整性。所有这些都有助于研究的可重复性，而许多研究试验正是因为“事后”数据操纵而了这项测试。\n\
  \n除了这些，`blockchains` 在临床试验中还有一个极其重要的功能：即智能合约。这些合约的“如果……那么……”逻辑允许……`COVID-19` 见证了疫苗供应中广泛的\
  \ `blockchain` 应用，例如为最近公布的疫苗护照将疫苗证书上传到网络上等。当涉及到医疗数据和创新时，空间是无限的（可能不仅于此）。\n\n# 第 11\
  \ 章：能量\n\n我希望你记得我们已经看过的能源领域的 `blockchain` 案例研究——无论是 `Bankymoon` 利用 `blockchain`\
  \ 驱动的智能电表为非洲的学校或家庭供电。然而，这仅仅是一个开始；该领域的颠覆潜力是巨大的，`blockchains` 已经在工作，要颠覆旧能源系统。\n\n\
  值得注意的是，即使在 `blockchains` 出现之前，电力公用部门已经在向广泛转型的道路上，全球驱动力是对去中心化、数字化和去碳化的需求。看到 `blockchains`\
  \ 确实满足了前两个要求，甚至为第三个要求提供了非常环保的权益证明共识机制，这项技术（似乎）是命中注定的。正如 `blockchains` 促进了 `物联网`\
  \ 的发展并迅速跟进一样，当我们深入能源领域的颠覆时，你也会听到“智能电网”和“能源互联网”等术语。\n\n你可以将这次讨论看作非洲案例研究的延伸，但现在让我们考虑更多场景。智能电网本质上可以通过三种不同的方式工作。我们将快速回顾前两种，因为我们已经讨论过它们。所以，一个希望在能源生产上自给自足的家庭会安装太阳能电池板，并简单地利用由此产生的电。产生的额外能量可以存储在电池中，以备在太阳能电池板没有阳光照射的阴雨天使用。这将发电的主要用途。记住，在这一特定的设置中，由于仅限于单方，因此不需要\
  \ `blockchain`。\n\n\n\n\n第二个用例是你将多余电卖给邻居。因此，如果智能电网要为一个社区供电，它将连接到一个自动化聚合服务，该服务会优化电力的供需。但是，当太阳能板产生的电不足以满足整个社区的需求时，会发生什么？很简单，你要求更多！所需的额外电力将从另一个发电社区进行协商；交易的发生就像电力作为任何其他商品时一样。这些费用将通过微支付同时结算，并安全地记录在区块链上。可以通过验证这些记录，确认交易是否对双方都有利。在这里，发电的太阳能电池板将作为能源的次级供应商。\n\
  \n这个系统的之处之处在于其安全的交易日志，还因为它能够评估你的用电模式，从而估算出你在特定时期所需的电量。根据你的使用数据，它甚至可以安排电动汽车充电、热水等大负载任务。\n\
  \n最后一种情况是微电网满足临时缺口的需求。在这种情况下，它将成为能源生产的三级储备。现在，请注意这个过程的复杂性——区块链上激活了一项交易，该交易表现为对特定电量的报价。电网随后将此请求与你的在线日历同步，以确定你是否有旅行计划。相应的，它会考虑你车辆充电的情况，决定是否可以空出足够的能量。如果它可以提供电力，则会以高得多的售价，就像\
  \ Uber 的溢价定价一样。\n\n尽管这看起来可能不多，但从一个家庭的角度来看，这可以并且已经让数百万人获得了电力。此外，具有分布式账本的区块链还可以在更大程度上扩展这些微电网的规模。请记住，电费是通过加密代币支付的。区块链技术将点对点能源交易成功整合到微电网模型中，这是去中心化发电分配的一种巨大可能性。几个平台已经完美测试了这一概念很长时间。例如，斯洛文尼亚的\
  \ `Suncontract`、珀斯的 `Powerledger` 以及布鲁克林的 `LO3 Energy`；它们有力地证明了去中心化能源项目在全球范围内都是可能的。\n\
  \n同样的概念已扩展到能源零售和批发市场，公司可以通过从此类平台采购能源，而不是通过传统的集中心化机构。`WePower` 就是这样的平台之一，它通过为公司提供适量的绿色清洁能源来帮助其满足能源需求。\n\
  \n这是能源消耗本身的另一个方面：我们在本节开头谈过的去碳能源。例如，`FlexiDAO` 是一种区块链驱动的软件，旨在推动电力去碳化和去中心化。该软件跟踪从源头到目的地的能源生产过程，并警惕重复计算。人们还可以通过遵守绿色标准获得所谓的碳信用，这些额度随后可以用于获取服务，或简单地在市场上出售。\n\
  \n许多基于 `Ethereum` 的去中心化应用 (`DApps`) 也在这场电力革命中做出贡献。`Swether` 是其中一个应用，为能源互联网提供端到端的解决方案。从为电动汽车预订充电站到处理支付，再到竞标能源。\n\
  \n# 第 12 章：电子商务\n\n并不是秘密，过去十年见证了 `电子商务` 的爆发式增长。特别是随着疫情的爆发，`电子商务`行业异常繁荣。然而，这个系统并非完全没有问题。\n\
  \n`电子商务平台` 面临的最大问题之一是与产品描述不符的假产品。结果显而易见，这不仅导致了销售损失，还损害了平台的品牌形象。此外，取回退货的物流成本远高于利润。这个过程本身就会产生巨额成本。除了产品相关的担忧，`电子商务平台`\
  \ 可能还需要面临功能性问题。例如，一个 `电子商务平台` 无论如何都必须保持运行。但这可能受到构成严重安全风险的虚拟攻击的威胁。许多网络安全报告表明，`电子商务平台`\
  \ 对恶意黑客来说是有价值的。\n\n如果这些还不够，在送货时客户端也会出现问题。如果供应链效率低下且充满故障，客户就无法确切知道包裹的位置。很多时候，当包裹到达时，客户不在家，迫使快递员要么记录投递失败，要么采取更常见的行动方案——将包裹留在门口，这极有可能导致丢失或被盗。客户随后可以投诉要求重新投递，但整个整个申诉解决协议会耗费更多资源。\n\
  \n现在，在我们进一步讨论区块链如何提供帮助之前，我希望你和我一起进行一次心理练习，尝试思考一下它们可以提高 `电子商务平台` 效率的一些方法。到为止，你应该已经，安全性、不可篡改性、可追溯性和去中心化的相同区块链原则正被应用于我们到目前为止讨论的所有行业中。在这里，这些原则也是一样的。\n\
  \n通过去中心化的库存管理系统，`电子商务平台` 可以大大缩短送货时间。此外，区块链为客户提供了待交付产品的的确切位置，显著减少了投递失败的次数以及相关成本。区块链还提供了针对恶意攻击的保护，并防止系统的任何渗透，确保客户数据在平台内部保持安全。\n\
  \n\n\n除了这些之外，区块链还带来了两个额外的好处。第一是忠诚度和奖励，我们之前在讨论小创业者时已经提到过。第二个好处甚至更加奇奇：客户评价。同样，不可篡改的原则在这里发挥了作用，但其呈现方式却非常新颖。在基于区块链的电子商务平台上，当客户留下评价时，该评价无法被更改，无论变好还是变坏。因此，这些评价可能更具可信赖可靠性。\n\
  \n# 第 13 章：艺术与文化\n\n艺术与文化是任何文明的关键基石。只有当创造力被允许不受审查限制地自由飞翔时，思想、观点和情感的自由表达才成为可能。艺术自由结合对窒息性中心化审查的缺失，可以创造出动人心的作品。但，缺乏审查只是冰山一角。区块链与艺术才华交织在一起，正在创造许多值得关注的项目，导致了艺术本身的多样化方法，同时也为收藏家和艺术爱好者创造了不断增长的市场。\n\
  \n## 非同质化代币 (NFTs)\n\n区块链在艺术和文化领域的一个大用例是非同质化代币（NFT）。我们之前以非常粗略的形式提到过这些，但现在是时候深入挖掘了。为了向你简要回顾一下\
  \ NFT 是什么，我们可以说它们是区块链支持的数字代币。这些代币可以是音频剪辑、视频、一件数字艺术品等等；并且它们可以与加密货币绑定。现在，让 NFT 不同于加密货币的在于，虽然后者具有相同的价值，但前者并非如此。这意味着，我说\
  \ `Bitcoin` 价值某个金额时，每个 `bitcoin` 都有相同的汇率；但，当我谈论 `NFTs` 时，每个 `NFT` 就像一个价格不同的商品。所以，就像两件艺术品的价格不会一样，两个\
  \ `NFTs` 的价格也不会一样，因为艺术品本身就是它们所拥有的样子。所以，就像你购买 `Bitcoin` 时会获得一个唯一的密钥一样——当你购买 `NFTs`\
  \ 时，你也会获得一个独特且安全的数字代币。\n\n对于外行人来说，你收到的数字文件看起来可能没什么大，但对于艺术鉴赏家和收藏家来说，它绝对值他们在这些艺术品上花费的数百万美元。它意义的不仅仅是拥有这件作品；本质上意味着这些人已经永远地进入了该作品的数字历史之中，且远不止。然而，通过这次购买，艺术行家并不拥有作品的版权，版权仍然属于艺术家。这意味着艺术家可以创作更多像你拥有的那样的作品——就像限量版棒球卡之类的。出现了一些\
  \ `NFT` 市场，如 `SuperRare`、`OpenSea`、`Nifty Gateway`、`MakersPlace` 等，它们对每件售出的艺术品收取佣金。作为回报，它们确保艺术品得到广告并确保交易顺利运行。\n\
  \n现在，这种颠覆性在于：`NFTs` 赋予了艺术家和创作者从事他们热爱的事业来维持生活的。他们加入其中的技术可以帮助这些艺术家直接接触并吸引更广泛的群体，而不需要任何代理人。这些\
  \ `NFTs` 为艺术家带来的另一个好处是不可置疑的所有权记录。在传统艺术中，有很多关于真品与伪品的争端，而在这里，这种可能性永远不会出现。从艺术的角度来看，NFTs\
  \ 提供了另一种媒介，可以在画布（更准确地说是屏幕）上倾注艺术家所有的创作表达。此外，`NFTs` 还能带来一个更加公正、无偏见的市场，无论性别、种族等，都为艺术家提供平等的机会。\n\
  \n`NFTs` 还解决了艺术家的版税问题。考虑这样一个场景：在传统艺术行业中，尽管艺术家拥有其作品的权利，但他们没有办法知道自己的画是否被售出或被盗版。因此，尽管版税的概念在理论上存在，但在实践中很难执行。然而，在区块链上，通过使用\
  \ `smart contracts`，艺术家可以确保他们获得后续销售的某部分收益。\n\n`NFTs` 还将改变艺术收藏的格局，可以这么说。艺术收藏家将不再需要是一个手里拿着杯子喝葡萄酒、另一只手拿着雪茄的富翁。由于收藏品保持在线，任何对艺术有轻微倾向的人都可以购买\
  \ `NFT`。价格可以从 `$12` 开始，一直涨到数亿，为购买者提供了广泛的选择。\n\n这里另一个需要考虑的方面是，`NFTs` 不一定仅仅是艺术品，可以是音乐、照片或任何东西。任何音乐迷都会知道，从历史角度来看，唱片公司对艺术家的并不尊重。这种现实——以前在大多数时候被掩盖的——在传奇人物普林斯（Prince）在他脸上写下“奴隶”字样，并将与\
  \ `Warner Bros.` 的合同比作奴隶制时被公开了。唱片公司继续对音乐人保持这种控制，而且往往让他们他们处于劣势。然而，随着 `NFTs` 的出现，情况发生了改变，因为艺术家正在完全抛弃唱片公司，并以\
  \ `NFTs` 的形式直接向听众出售他们的作品。\n\n漫画将他们的表演作为 `NFTs` 销售也是如此。`Jamb` 是一家喜剧收藏品初创公司，正在筹集数百万美元建立一个\
  \ `comedy NFTs` 市场。除了为喜剧节目筹集资金外，`NFTs` 还为这些喜剧演员提供了一个不受审查的区域，让他们创作讽刺作品。喜剧演员经常因为创作幽默而受到攻击，但这恰恰是他们应该做的。但，似乎出现了一股取消文化的浪潮，人们认为任何他们不同意的事情都需要受到公开的、辱性的谴责。\n\
  \n随着觉醒的伪自由主义者随时准备取消喜剧演员的言论自由，社会氛围变得越来越不安全。这些自认为道德警察的人讨厌对时事进行评论的喜剧演员。我怀疑这是否是因为他们说了实话——一个卑微到足以落入幽默领域的真相？区块链和\
  \ `NFTs` 确实可以为这种艺术形式注入新的生命。有一点是肯定的：`NFTs` 的影响远及所有艺术类型。\n\n这可能看起来 `NFTs` 专门、且仅针对艺术小众；但事实是，在近期，`NFTs`\
  \ 已成为投资领域的热门资产。在 `2021` 年之前，几乎没有人真正知道 `NFT` 是什么；但随着 `metaverse` 话题的增加，`NFTs` 的人气也达到了顶峰。\n\
  \n## 去中心化社交媒体\n\n社交媒体几乎成为我们今天生活的生活的组成部分——我们几乎无法离开它。你可能会认为，把吃什么、去哪里等一切发布在你的主板上几乎是强制性的。但，到什么时候我们才能说我们的社交媒体平台停止了连接并开始侵入了？\n\
  \n\n\n\n在 2014 年总统大选期间，一条惊人的新闻占据了各大频道的头条。报道称，剑谷（Cambridge Analytica）的某些员工与 Facebook\
  \ 合作，获取了数百万用户的个人数据。此举目的是通过出售美国选民的心理画像来获得政治优势。唐纳德·特朗普的竞选官员被指控滥用公民的私人数据。此举引发了骚动，Facebook\
  \ 的马克·扎克伯格（Mark Zuckerberg）被要求作证——简而言之，发生了很多事情。但遗憾的是，大众往往记忆短期，今天这种大规模的隐私侵犯行为仅仅成了旧闻。\n\
  \n但，我们需要记住：权力滥用和任何其他滥用一样，只要发生过一次，就可能再次发生。Facebook 和大多数其他社交平台已经一次又一次证明，它们在不公正统治权的支配下运行，只是执行其议程的工具，无论是仇恨言论还是假新闻。大多数其他媒体机构也是如此。这就是为什么我们需要不服务于政党而服务于公民的社交媒体和媒体平台。只有当我们跳出这些中心化社交媒体平台的噪音时，才能发现事实上有许多去中心化应用（dApps），它们能比我们现在接触到的宣传机器更很好地服务我们。\n\
  \n## Steem\n\nSteem 本身是一种支持`Steemit`和`DTube`等应用的区块链。`Steemit`是一个去中心化的社交媒体平台，通过向内容创作者提供加密货币来奖励他们。这种激励模型有助于保持区块链的运行，并内容的不可篡改性为基础。Steem\
  \ 区块链总共支持 324 个应用，但`Steemit`、`Utopian`和`DTube`仍然是最受欢迎的。\n\n`Steemit`和`DTube`都根据你的选择提供系列新闻和视频，同时通过贡献某种形式的文字内容为你提供加密货币形式的收入。这些平台的去中心化本质使其能够免受政治和审查的影响，以及广告商的影响。另一方面，`Utopian`是一个开源项目，用户可以通过贡献不是内容，而是对开源项目的某种修复来获得加密代币：例如，修复一个漏洞。\n\
  \n## Sapien\n\n虽然 Steem 是早期采用者，但去中心化社交媒体平台在过去几年中才看到增长。显而易见，用户已经厌倦了新闻频道和中心化社交媒体平台对他们进行的把戏。他们想要一个没有剧本、不受审查且真实真实的通信渠道。`Sapien`就是满足所有这些智力需求的平台之一。\n\
  \n在这里，用户完全控制他们选择分享多少个人信息以及与谁分享。该平台还根据根据的兴趣和偏好来策划用户体验。与中心化社交媒体不同，这里对发布的内容没有限制。例如，在去年年底，Facebook\
  \ 突然宣布禁止加密广告，但在面临用户的反弹后又扭转了这一决定。显而易见，这些政策的反复变化具有很强的政治动机，也许只是为了衡量他们在限制用户自由和基本权利方面能走多远。去中心化平台是停止将大巨头视为自由公民的个人宠物鹦鹉的唯一途径。\n\
  \n`Sapien Network`使用了处理不认同的信息的古老良方——这被称为“选择不参与”（在达到某一点后）。用户可以表达自己的观点直到极限，没有人能阻止他们。作为用户，你可以做的是挑剔选择你摄入的内容；如果你对某人说的话感到被冒犯，最好不要再看了，特别是如果你最终只会辱骂那个人并剥夺他人的言论自由。它还有私有和公共模式功能，这意味着你可以决定是在平台上保持匿名还是切换你的原始身份。吸引大量人员加入该平台的是各种社交媒体功能，如创建小组、短信、语音聊天等，这些在`Steemit`中很大程度上是缺失。\n\
  \n`Sapien`仍处于胚胎阶段。它构建在`Ethereum`区块链上，凭借由`ERC20`和以太坊代币支持的代币`SPN`，它期待着很快变成市场的可能性。这将促进其他各种第三方应用，甚至是网络内部的整合。\n\
  \n## SoMee Social\n\nSoMee Social 是另一个 Cardano 的明珠。这是一个由区块链驱动的社交媒体平台，主要为隐私、用户控制和货币变现而设计。它于\
  \ 2017 年推出，目前推出该平台的第三个迭代。他们还招募了曾参与过 Google 和 Zillow 等更大项目的开发者和营销人员，现在他们正在做这些，是为了启动一个能够在真正意义上维护去中心化理念的平台。\n\
  \n## Indorse\n\nIndorse 可以被认为是去中心化爱好者的 LinkedIn 替代品。它被营销为一种由区块链驱动的、针对专业人士的社交网络。它有一个独特的功能，允许其他用户验证任何用户列出的个人技能，这本质上充当了证言。作为回报，用户通过获得部分利润分成获得激励。这个想法很简单——如果你声称在某个领域拥有专业知识，那么你就必须附上该主张的证明。随后达成共识，决定该主张是被“背书”还是被标记。这个平台开启了一种独特的方法，在不限制言论自由的情况下剔除虚假主张。尽管`Indorse`专门将其用于专业技能，但这种模型可能用于避免以言论自由之名传播不准确的信息。\n\
  \n当我们接近这一颠覆性变革部分的末尾时，我想指出一个在讨论区块链应用的热情中几乎被忽略的方面。让我们记住，区块链的优势是不可篡改性，而不是准确性。这意味着，尽管输入系统的信息无法被操纵，但系统的效率最终取决于最初进入系统的信息。因此，如果我作为一个用户向系统输入伪造数据，尽管具有不可篡改性，数据输入仍然是不准确的。这就是为什么区块链像任何其他技术一样，其优劣取决于运行它们的人。这也是为什么我一直强调更多普通人需要参与其中，否则我们将失去对在区块链中永久固化的数据的控制。\n\
  \n另一个明智的做法是注意，在这里记录的所有颠覆性并不是区块链潜力的终点，而只是开始。事实上，还有许多我们尚未涉及的领域；例如，区块链正用于交通管理、车辆租赁、软件版本管理和文档发布等等。列表是无尽的。\n\
  \n\n\n如今正在开发的许多区块链项目都拥有十年的愿景，这意味着今天通过这些颠覆性用例所播下的种子，将在 2030 年左右结出结果。这并不意味着我们现在无法获得任何收益。我们所讨论的一切，都是我们已经在享受的早期采用带来的果实。但在此时此刻，很难确定区块链技术在未来（比如十年后）将走向什么方向——它是会继续愉快地颠覆现有的行业，还是会把它们彻底颠覆，创造出一种全新的秩序？还有许多事情有待观察。\n\
  \n# 结论\n\n如果自由意味着任何意义，那么它意味着告诉人们他们不想听的话的权利。– 乔治·奥威尔\n\n我相信人类有两样不可不可缺的东西：希望和自由。当我看到这项不断演进的技术时，我同时看到了这两者。在本文中，我们详细地讨论了区块链。我们谈论了伟大的技术和项目；我们谈论了所谓的革命。坦率说，我意识到这些信息非常难以吸收，如果你一直读到这里，我认为你在理解这项技术方面已经迈出了非常长、非常长的一路。那么，让我给你一个建议。如果你从书中学只到一件事，且只有一件事，那么让它是：区块链已经并继续为那些没有声音的人赋予话语。它从山丘上的城堡中夺走了权力，将其交到大众手中。\n\
  \n但是，我是否已经说服了你们每一个人这项技术能带来什么？也许吧，也许没有——但这从来不是重点。重点在于把望远镜交给你，让你们自己观察天空的展开，一个星辰，一个星球。我在这里的宗旨不是让你们相信我所说的，而是向你们展示世界上正在发生什么。我想向你们展示——尽管存在悲剧、仇恨、战争和腐败，仍然存在希望；而且希望正在蔓延，每天感染越来越多的人。如果我让你们在阅读时即使只有一刻看到了这一点，我将视视为成功。\n\
  \n我通过经验意识到，人就是人；在任何地方都是那样的。想一想。想象一下你去超市，排在你面前队列里的女士掉掉了她选好的水果，水果向四面八滚落。你的第一直觉是什么？很可能是弯腰帮她捡起水果。尽管你接触了许多分裂性的新闻报道，你的第一直觉是去询问，甚至怀疑她是保守派还是自由派吗？！你不会的，因为这无关紧要。\n\
  \n而且，无论你的政治倾向、社会阶层、宗教和种族如何，你都应该受到尊重，最重要的是，你应该被听到。每个人都需要一个声音，每个人都需要别人听到这个声音，即使他们并不认同或反对。正如奥斯卡·王尔德幽默所说：“我不一定同意你的观点，但我会捍卫你让自己变得愚蠢的权利，直到死。”（Oscar\
  \ Wilde Quotes, n.d.）。在我们所处的这个极极化的时代，记住这一点变得更加至关重要。随着煽动大众产生仇恨的演讲，以及所谓的“取消文化”——它否认了对任何持有与其不同意见的人的基本尊重——言论自由权变得比以往任何时候都更加重要。\n\
  \n区块链带给我希望，因为它们以人的本目对待人们：作为人。它们赋予每个人一个声音，无论他们的政治派别如何。当然，各界都会出现无知的评论，但让世界自己去判断这些评论吧。好的主意不需要反对者的保护；坏的主意需要。但是，只有当它们以提议时的原始形状和形式处于公共领域时，它们才能根据其本身被评判。\n\
  \n然而，言论自由带来的唯一警示是：言论自由指的是说话的行为，而不是指随之而来的后果。那位说“让他们吃蛋糕吧”的伟大女王还是被推翻了。言论自由意味着每个人都有声音，而不仅仅是特权阶层。今天，我们拥有的或少就是我喜欢的“言论自由孤房”——一个你可以在其中大声叫自己的观点甚至因此赢得欢呼的泡沫，而没有意识到每种意识形态也有自己的泡沫。当一个人听到对其观点的反对时，他们就会头埋进沙子里，试图控制尽可能多的渠道来为自己的叙事服务。叫得最大的人拥有最大的孤房，但结到底，这并不重要，因为没有哪个孤房愿意采取合作的方法。\n\
  \n我们在脑海中经营着自己的国家，而我们的政客乐于保持现状。因为归根结底，这难道不是赋予他们权力的来源吗？让鸡群互相争斗，而他们的朋友猪正在被宰杀？正如我所说，我们并没有像表现出来那样不同。我们都想要良好的医疗保健、良好的教育、就业机会和住房；然而，我们却是那些争夺谁应该住在白宫的人，就好像我们唯一关心的事情只有这一点。不要误会我——政党派别都是完全好的，但它们的存在是为了为你而战战，而不是反过来。\n\
  \n历史充满了男人的例子——那些所谓的政客和所谓的公共利益的守护者，他们背叛了人民。历史充斥着以福利之名掠夺人民财富的机构：希特勒的德国、斯大林的俄罗斯、墨索里尼的意大利。在这些例子中，不可避免地，这些人从人们那里夺走的首要东西不是财富，而是言论自由。当然，任何自由都是无法被给予或夺取的——甚至是言论自由。但恐惧是一种强大的工具，这也是历史以来一直被使用的工具。对于那些有权被听到的人，恐惧是通过引入“如果我失去了这种特权怎么办”的思想引入的；对于那些从未拥有过的人，恐惧表现为“如果我永远无法拥有怎么办？”共同的结果正是独裁者所预期的：一种震耳欲聋的沉默。因此，指令变成了强制，历史被永远染上了污点。\n\
  \n今天，情况既是不同的，又又那么不同。言论自由仍然面临着巨大的危险，不仅来自独裁者，也来自硅谷的大玩家们。当政客和技术先驱联手时，权力与特权的结合在中心化技术的器皿中威胁着变得更加危险。正是这种结合决定了哪些声音被放大，哪些声音被抑制。再次，孤房变得比以前任何时候都更加强大、更加隔音。\n\
  \n记住奥尔德·赫胥黎在小说《美丽新世界》（1947 年）序言中的话：“只有大规模的去中心化和自力更生的群众运动才能阻止目前国家主义的趋势。”在我们政客和机构辜负我们时，区块链具有复活我们的潜力。区块链技术并没有区别对待我们；它不会根据我们倾向于政治、意识形态或社会经济光谱的哪一端赋予我们不同的特权。我们欠这项技术，不去把它束缚在政治意识形态传播的谎言和欺骗网中。给区块链一个机会；它可能会为你以及多年来被剥夺权利、自生自灭的人让世界变得好一点。\n\
  \n\n\n正如我们一直所看到的，无数人正在从事着有意义的工作，以保护这些边缘化群体的声音。我在为这本书做研究期间所看到的工作以及我遇到的人们，通过他们的行动让我相信，无论发生什么——人类的意志和决心，而且最重要的是善良与平等的声音，总能找到出路，即使在重重困难之中。它就像一朵穿过混凝土块缝隙绽出的、细小而明亮的蒲公英，拒绝枯萎，让这块混凝土变得无限美丽。\
  \ \n\n但请注意，这项技术就像任何其他革命性的机械化一样，在错误的人手中是一枚定时炸弹。请记住，能够将我们免受压迫的技术，也可能被压迫者用来推行他们的非民主议程。正如我在书中反复提到的，除非我们各就其指定的岗位，否则你可以确定，这场战斗将由那些压迫者赢得。因此，我敦促你参与区块链，以保持去中心化原则的生命。\n\
  \n我希望这本书带给你的不仅仅是信息。正如我所说，这本书真正的成功将在于你积极的参与以及对周围区块链的关注——这是防止它们像其他技术那样被侵蚀的唯一途径。如果这本书，尤其是这项技术引起了你的共鸣，我希望你开始与朋友、家人甚至那些观点相反的人就此展开对话。打破信息孤岛的唯一方法是和平、持久且有证据支持的对话。没有这些，任何民主制度都无法免疫权威主义的危险。所以，尽管去交流。另外，如果你喜欢这本书，请在\
  \ Amazon 上留言。这对于触达更多人非常有帮助。本书的收益将捐赠给西非去中心化联盟（West Africa Decentralized Alliance）——这是他们不断扩张旅程中的微薄之力。至于你，我的朋友，我希望你全心拥抱区块链，让它们让你自由，永不再受奴役。\n\
