- "# 区块链：自由还是奴役的工具？理解区块链，理解自由\n\n\n\n# 图籍简介\n\n“只有一场大规模的去中心化和自力更生的运动，才能阻止目前国家主义的趋势。”奥尔斯·赫胥黎（Aldous\
  \ Huxley）在几十年前的小说《美丽新世界》（1947 年）第二版序言中提出了这一观察。长期以来，尽管许多人支持这些观点，但这种走向去中心化系统的运动一直进展缓慢，因为这一切“如何实现”一直笼罩在不确定之中。然而，区块链的出现扭转了局面，其基石正是建立在去中心化和大众参与的之上。\n\
  \n区块链运动终于在生活的各个领域获得了它应有的关注。虽然各行业已经在私营部门使用了这项技术，但公共部门才是区块链平台真正大放异彩的地方。许多区块链公司正为此努力，特别是在发展中经济体中，带来了此前无法想象的进展。\n\
  \n尽管区块链技术正在通过改变生活的各个方面改变世界，但大众在很大程度上对这项技术一无所知。这主要是因为区块链主要被视为一场技术革命。没错，它确实是如此——但我们大多数人没有意识到，它也是一场意识形态革命。区块链起源背后的核心理念对我们大多数人来说仍然难以捉摸，仅仅是因为我们从未关注过。\n\
  \n这种去中心化的核心哲学具有潜力改变公民在国家经济结构中的生活方式。这不仅适用于拥有技术设备的第一世界国家，也适用于那些通常被传统系统辜负的第三世界国家。当你看到区块链的应用不仅仅是为了盈利，而是为了提升那些被剥夺权利的人的生活时，你开始看到区块链潜力的真实面目。\n\
  \n本书为初学者提供了技术、意识形态与解决现实世界问题的区块链解决方案之间的独特融合。你可能听过很多关于区块链的内容，但从未有过进一步了解的意愿。这可能是因为技术过于令人望而生畏，也因为那些几乎局限于加密货币的新闻的不断轰炸。但无论原因何在，是时候了解更多关于这项创新了。\n\
  \n这这就是为什么我们在这里向你展示与你相关的论点。我们讨论了区块链如何成为一场真正改变你的生活以及全球数十亿人生活的革命。我们不仅让你熟悉技术上的影响，还让你熟悉哲学和意识形态上的先决因素，帮助你更简单地理解区块链复杂的领域。最重要的是，我们谈到了大众的参与是帮助这项技术在最大程度上发挥其潜力的唯一途径。\n\
  \n## 区块链：自由还是奴役的工具？\n\n### 理解区块链，理解自由\n\nKevin Gagnon\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n## 引言\n\n区块链是近年来一个热门词汇，但对许多人来说，它仍然是一个神秘的概念。区块链的核心是一个分布式数字账本，它在许多计算机上记录交易，且这些记录无法被追溯地修改。这创造了透明度、安全性和信任，使其成为各行业的革命性技术。\n\
  \n要理解区块链，首先了解它的工作原理很有帮助。区块链本质上是一个区块链，每个区块都包含一个交易列表。当创建一个新区块时，它会经过加密哈希处理并与上一个区块链接，形成一个连续的数据链。这使得更改数据变得极其困难，因为对任何一个区块的更改都需要更改链中随后的所有区块。\n\
  \n区块链的应用非常广泛，涵盖了金融、供应链、医疗保健等领域。在金融领域，区块链可以用于促进更快速、更廉价的交易，而无需中间机构。在供应链管理中，它可以用于跟踪产品从源头到消费者的移动，确保透明度和真实性。在医疗保健领域，区块链可以安全地存储患者记录，并允许授权的医疗服务提供者轻松访问。\n\
  \n随着技术的不断演进，它的潜在影响只会不断增长。它是一个强大的工具，具有改变我们生活、工作和互动方式的潜力。在本书中，我们将探索区块链的各个方面以及它如何被用于解决现实世界中的问题。\n\
  \n\n\n\n由于不确定被监视，囚犯们总是遵循着这个无处不在的守卫所规定的规则——以至于这种纪律已经被囚犯们内化了，不再需要外部监督。听起来很阴险，不是吗？在某种程度上确实如此——当这个概念扩展到监狱结构之外，并应用于全球经济如此广泛的领域时（是的，全球经济），更是如此了。这不仅仅是一堂哲学课程，更是全球范围内观察到的经济现象。\n\
  \n在区块链技术的背景下，全景监狱理论具有双重含义。一方面，实力强大的国家似乎创造了一个全球全景监狱，监控着发展中经济，以至于这些发展中经济是根据发达国家的标准进行评估的。这并不一定有助于发展中国家，反而不可避免地让富国越来越富有，穷国越来越贫穷。\n\
  \n然而，区块链技术颠转了全景监狱理论。或者我们应该说，它更加强调了这一点？感到困惑吗？那么，重点。全球全景监狱的问题在于，权力集中在制定游戏规则的全能参与者手中。但是，区块链技术所做的是将这种权力去中心化，让所有利益相关者都能成为警觉的守卫。因此，本质上，它分散了全景监狱的影响因素，同时促进了自我监管的属性。\n\
  \n## 革命的成因\n\n区块链运动在 2008 年金融危机后开始发力，这并非巧合。这场危机比以往任何时候都更清楚地表明，我们大多数金融交易的特征——信任，由于金融机构蔓延的腐败和丑闻可能会在一夜之间消失无踪。但是，如果这些金融交易的媒介本身都是不可的，那么普通人该怎么办？\n\
  \n当美国经济逐渐被这种绝望吞噬时，一线希望从最微小的裂缝中出现。俄罗斯历史学家彼得·克鲁泡金（Peter Kropotkin）曾评论道：“绝望者不反，因为革命是希望的行为”（彼得·克鲁泡金，引言，无日期）。这一次，这种希望的行为由一个名为中本聪（Satoshi\
  \ Nakamoto）的实体通过一份关于“无须信任的信任”的白书形式实现的。\n\n直到今天，我们仍然不知道中本聪是谁，但他们发表的论文提出了分布式账本的绝佳想法，通过通过超透明的功能运作模式，可以完全消除我们交易中对信任的需求。很快，`Bitcoin`\
  \ 启动了，从那时起，对区块链的好奇心日益增长。这项技术以前所未有的方式挑战了现有系统。它试图从权贵手中夺取权力并将其分配，以便让即使是最边缘的人也能进入系统。如果革命不是这样，那还能是什么呢？！\n\
  \n前美国议员、自由意志主义评论员罗恩·保罗（Ron Paul）曾正确地说：“如果你为了安全而牺牲自由，你将两者皆失”（罗恩·保罗，引言，无日期）。区块链比任何其他东西都是这种自由的象征——这种拒绝被无形权力的枷锁束缚的自由。我们将在稍后详细讨论自由和自由意志主义的概念；但现在，请理解，这场革命不是左派与右派之间的斗争，而是人们坚定且团结地反对政府越权（通常被称为国家主义\
  \ statism）的斗争。这是一场为了恢复当今世界中对你最重要的事物的斗争——你的权利、身份，以及构成了你许多生活决策基础的信息的真实性。\n\n作为作为一个非常看重自由的人，我已开始尊重区块链的运作方式，我希望你在读完这本书后也能如此。区块链被恰切地命名为互联网以来最大的发明，并已成为\
  \ 21 世纪最大的社会、政治和经济革命中至关重要的武器。不要让这场革命的民主和平本质误导了你——区块链技术正在通过一个社区、一个企业、一个行业在改变未来。\n\
  \n## 为什么是区块链\n\n当我们开始讨论区块链时，你脑海中的一个问题可能是：为什么是区块链？这种技术有什么让它如此独特？更重要的是，为什么要炒作它？事实是，无论我如何强调，区块链是长期以来赋予像我这样的人自由和权力的事物。但，这不是吸引我关注技术的唯一原因。真正令我惊讶的是它对第三世界经济可能产生的深远影响。\n\
  \n每当我谈论发展中经济区块链技术时，我都会被白眼。人们几乎把我看作是一个对现实一无所知的世界公民。“这些国家甚至连基础技术都没有，你们如何计划实施这种先进的技术？”他们问道。\n\
  \n但是，这里是大多数人错过的这一点——发达国家的金融世界与发展中国是完全不同的。所以，尽管像我这样的人觉得信用卡/借记卡和银行系统繁琐且耗时，但这些服务对我们仍然是存在的。尽管存在缺点和风险，大多数人仍然在使用这些系统。尽管区块链会带来重大的改进，但目前的系统至少对我们是可用。\n\
  \n然而，当我们谈论第三世界经济时，交易往往缺乏信任，这源于蔓延的腐败和犯罪。所以，世界公民拥有的系统很少适用于发展中国家。许多公民由于社会经济因素可能没有银行账户。\n\
  \n但是，他们比银行账户更常用智能手机。智能手机的使用让这些社区比传统银行更容易地接触互联网。这就是为什么移动支付在肯尼亚和坦桑尼亚等国家如此受欢迎的原因，而在美国或英国等国家则不然。移动支付为这些个人提供了一种安全存储和携带资金的方式，而不必时刻担心被窃。移动支付尽管在这些地方被认为是方便的，但仍然面临挑战。挑战之一就是网络之间操作的笨拙，使得交易再次变得不方便。想象一下区块链在这样的环境下可以带来怎样的突破性变化。\n\
  \n\n\n然而，我朋友的噩梦还没有结束。当他们到达边境时，必须更换车辆，我朋友必须乘坐一辆新车送他前往肯尼亚的目的地。现在，我朋友很幸运地遇到了一个善良的司机，他安排了另一辆车，但交易仍然必须进行。于是，车在那里，我的朋友和司机正在街上讨价还价。我的朋友清楚地感觉到口袋里那叠现金正变得越来越重。我的朋友根本无法核实这名司机的身份或记录，但他也没有其他选择。在在这种情况下，`blockchains`\
  \ 难道不是提供了一种更安全、更优雅的替代方案吗？\n\n请理解，这些并非游客的问题，而是公民们往往经常面临临的问题。`Blockchain` 能够帮助为那些在传统系统中从未获得应有关注的人们创造一个更美好、更充满关怀的世界。这就是为什么我说这项技术可能会改变世界，对于第三世界国家来说更是如此。这并非炒作，而是赤裸裸的现实。越来越多的组织正在加入区块链的行列，仅仅是因为他们意识到这项技术此刻正在产生的影响。`World\
  \ Mobile` 是首个基于区块链的移动网络，在整个非洲出色地执行着他们“连接未连接者”的格号。我们将在稍后的章节中详细讨论这一点。人类正处于一场和平且非暴力的技术叛变的边缘。你应该了解\
  \ `blockchains` 是如何为你以及你周围的人改变世界的。\n\n## 本书概述\n\n市上有许多书会教你 `blockchain` 的基础知识以及技术本身。但我相信，这项技术为像你我这样的普通人在最根基上能带来的变化，才是这项技术的黄金核心所在。一旦你克服了技术上的障碍，你就会发现这项技术对日常生活各个方面所能产生的惊人影响。\n\
  \n本书深入探讨了你关于 `blockchains` 所需的一切——包括理论与实践。我们讨论了 `Austrian economics` 和 `libertarianism`\
  \ 的概念如何融合，实现其他经济系统至今仅梦寐以求的事。但它也超越了金融理论和细节，带你开启一段旅，向你展示 `blockchains` 如何影响你的生活。在书中，我特别关注了\
  \ `blockchains` 在解决发展中国家不仅是金融问题，还有宏观的人道主义问题方面所具有的令人震惊的影响。\n\n你将在全文中看到贯穿始终的主题是 `decentralization`。到目前为止，`blockchain`\
  \ 技术似乎正危险地走在中心化与去中心化争论的边缘。我们的无知很容易使其倾斜成为下一个重大的中心化技术，而更多的中心化绝不是我们目前所需要的。在这个被四面八方信息轰炸的时代，只要事物在运转，人们就很容易不关注它们是如何运作的。如果我们对\
  \ `blockchains` 采取同样的态度，我们将错过这一代人拥过的最大技术机会之一。所以，当你阅读本章时，我敦促你去体会它对你自己、你周围的人以及生活在地球另一端的人的影响。\n\
  \n在你开始之前需要注意的一点——随着你不断学习……，你会发现……\n\n\n\n如前所述，区块链的传奇始于 2008 年，当时一个化名为 `Satoshi Nakamoto`（中本聪）的个人（或一群人）发表了一篇论文。但其目的是什么？在传统金融系统这台已经运转良好的机器的情况下，为什么有必要发表一篇介绍整个全新系统的论文呢？但等一下，它们真的运转良好吗？事实证明，它们并非如此。金融危机揭示了困扰着我们金融世界的某些严重问题：其中之一就是所谓的我们金融安全的“守门人”——银行的欺诈本质。请记住，这些欺诈性银行为了自身的既利益，同时得到了左翼和右翼政党的支持。太多的人失去了毕生积蓄，被推向了破产的边缘。\n\
  \n这时，一直潜表面下涌动的情绪全方位爆发了。这不仅仅是因为写了一篇区块链论文，更重要的是它在经济的许多领域引发了好奇心。这很大程度上是因为这篇论文提到了一种可以完全绕过欺诈金融机构的技术。\n\
  \n这是一个前所未有的想法，因为直到现在，人们认为这些机构是最高机构，没有它们的批准就无法发生任何交易。现在，有一群人完全抛弃了这种观念，并讨论创建一种平行货币，即著名的\
  \ `Bitcoin`（比特币）。这种货币被认为存在于没有国家权威的世界中。尽管直到今天我们还不知道 `Satoshi Nakamoto` 是谁，但我们知道：发明加密货币的人，甚至支持它的人，并不是普通人。他们是专业的程序员，了了系统的内部运作机制。事实上，这个想法的首次描述在互联网热潮出现很久以前就被提出的。`Stuart\
  \ Haber` 和 `W. Scott Stornetta` 已经提出了为数字文档生成时间戳的观点，以便它们无法被追溯修改日期。他们以及许多其他类似的密码学家不相信中心化治理会产生干预。但是，人类真的能够在没有外部权威力量的情况下正常运作吗？\n\
  \n### 通过自发秩序获得自由\n\n这可能会让你感到惊讶，但人类不需要外部管辖就可以过上导向普遍福祉的生活。不要听取我的，但这是一个至少有 2500 年历史的想法。在多年年前，一位中国哲学家\
  \ `Zhuang Zhou`（庄子）提出了完全相同的观点。他认为，事物只要被听任其，就会找到良好的秩序。如果你对经济学感兴趣，你可能会发现这个想法与诺贝尔奖得主\
  \ `Adam Smith`（亚当·斯密）所说的有些相似——社会可以在没有政府干预的情况下完美和谐。虽然“自发秩序”这一特定术语后来出现在 `Michael Polanyi`（迈克尔·波兰尼）的作品中，但概念始终如一。此外，这不是特定文化的现象，而是一个普遍的观察。\n\
  \n正如法国经济学家 `Frederic Bastiat`（弗雷德里克·巴斯泰）所说：“生命、自由和财产的存在并不是因为人类制定了法律。相反，正是因为生命、自由和财产先存在，才使人类制定了法律”（引自\
  \ `The Law`, n.d.）。\n\n正是这种自发秩序的思想，这种从压迫体系中绝对自由的理念，驱动了区块链技术的核心。长期以来，这些外部影响的程度一直存在争议。历史为我们提供了大量的证据，表明国家与银行边界模糊如何产生一种极其有毒的混合物，从而改变它们生存的轨迹并变得更加恶劣。如果你像我一样喜欢自由，你将会支持主张国家与金融机构分离的论点。区块链通过将国家与我们的日常交易分离，使这种自发秩序成为可能；这正是区块链技术值得为之坚持。\n\
  \n### 右翼、左翼与自由\n\n每当我谈论区块链的哲学和意识形态背景时，我都能感受到政治光谱不同部门的悲观抵制。媒体和政治界中宁愿信从无知也不愿接受区块链创新的部分，往往为了既得利益将先进的区块链技术变成一个政治问题。结果是引发了一场关于谁应该为这种“激进”方法负责的辩论，而从未真正对过程本身获得启发性的见解。\n\
  \n在这里需要理解的是，无论你认同政治辩论的哪一方，区块链都能让我们每个人的生活变得简单得多。正如我之前提到的，无论你来自何何处，这项技术都能为我们创造一个更好的世界。我以前说过一次，这不是一场左派和右派之间的战斗。但如果我们不进一步拆解这场辩论，那么（如果我们不进一步拆解这场辩论）就像在拼图正中间留下了一个巨大的洞。\n\
  \n当每个人都在忙于宣誓对右派或左派的忠诚时，更重要且可能更相关的辩论却被抛到了窗外：国家主义与个人主义的辩论。国家主义是一种提倡权力集中的意识形态，其目的仅仅是将公民变成国家监管和政策的奴隶。\n\
  \n这个说法听起来可能有点严厉，但事实是，尽管我们一直在谈论全球范围内发生的宗教战争，但我们从未处理在我们四周横行的国家主义宗教。这并不是秘密，政府干预在过去一个世纪中夺取的生命比任何其他事情都多。然而，我们继续信任同样的政府来制定管理我们财务、医疗等方面的法律。正如\
  \ `Thomas Sowell`（托马斯·索维尔）所说：“很难想象有比将决策交给那些对错误不付出代价的人更愚蠢、更危险的决策方式了”（引自 `Thomas Sowell\
  \ Quotes`, n.d.）。区块链有潜力改变这种对权威和政治意识形态的假设性依赖。它们有可能以最不常规的方式释放我们。\n\n## 区块链是如何工作的\n\
  \n现在我们已经知道了底层原理，让我们更深入地理解这个过程。由于起源的原因，区块链经常与 `Bitcoin` 和加密货币交替使用。虽然不能否认加密货币是区块链最广为人的应用，但关键在于，它们只是几种应用之一。\n\
  \n区块链本质上是一个可以存储记录的网络。这种防黑客系统使得数据伪造几乎是不可能的。因此，数据不是只被记录在一个地方，而是同时存储在多个地方——这意味着即使一个源被操纵，记录的副本也能防止数据被损坏。\n\
  \n\n\n当你想到数据库时，你可能会想到类似于 Excel 表格的东西，包含完整的行和列。现在，区块链比这稍微复杂一些。它们以前被称为“区块链”，存储数据的方式不是在行和列中，而是存储在区块中。这些区块在数字上连接起来，随着越来越多的交易发生和更多数据的产生，区块不断添加到数字链中。把这想象成一个文件柜抽屉：一旦抽屉装满了文件，你就关上它并移动到下一个抽屉。同样，在区块链中，区块只能容载特定数量的数据。一旦达到限制，它们就会被关闭并与上一个区块链接。\n\
  \n然而，文件柜类比与区块链之间的关键区别在于，对于前者，你总是可以回去重新洗牌文件。而对于后者，随着数据不断存储在区块中，这些区块创建了一个不可逆转的时间线，这意味着回溯并更改记录细节是不可能的。每个区块在成为数字链条的一部分时，都会获得一个精确且唯一的时间戳。\n\
  \n区块链使用点对点网络允许数字信息的记录和分发，而不会让那些臭名昭著的元素以此任何方式编辑或复制数据。简单来说，这项技术并不认为秘密等同于数据安全；相反，它让数据变得完全透明，并将其置于网络上每个人的面前，从而从根本上消除了违规的可能性。\n\
  \n要理解这个系统的重要性，我们首先需要看看它与传统交易的不同。同样，这种影响在第三世界国家为明显。区块链倾向于将那些受到严格监管但讽刺的是仍然充斥着腐败的交易数字化。据说当阿富汗士兵开始通过数字媒体领取薪水时，他们真的以为自己加薪了。事实证明并没有加薪；他们只是收到了本属于自己的东西，现在他们的上级没有机会从下属的薪水中抽走自己的那份了——因此，收到的金额增加了。如果仅仅是数字化就能带来那种财务变化，想象一下在这种背景下，一个完全透明的区块链系统能做什么。\n\
  \n## 为什么选择区块链？\n\n阿富汗发生的事情生地证明了区块链如何一个一个社区地赋能贫困国家。当阿富汗为现金短缺而挣扎，塔利班严重限制银行取款时，社区一直在以加密货币的形式接受援助。经济崩溃与塔利班的压迫政策相结合；人们（尤其是女性）被失业并陷入了贫困。然而，正如其中一份新闻报道所报道，《商业内幕》讲述了\
  \ Fereshteh Forough 和她的创业项目 Code to Inspire 令人鼓舞的故事，他们开启了一段“以加密货币助力事业”的旅程。\n\n你可能在想，为什么我一次又一次回到第三世界的背景。我想提醒你，虽然对于第一世界的公民来说，区块链可能看起来只是数字化的某种混合版本，但对于欠发达国家的社区来说，它是可以改变他们整个运作模式并使其更好的。。这就是我们在讨论区块链时需要强调的。\n\
  \n记住这一点：让我们聊聊为什么你应该关注区块链，以及这项技术作为利益相关者能给你带来什么。在一个你的身份变得越来越虚拟的世界里，区块链技术的基本原理对我们所有人的生存都变得越来越相关。\n\
  \n### 分布式权力\n\n美国作家爱德华·阿比（Edward Abbey）曾说：“权力总是危险的。权力吸引最坏的人，并腐蚀最最好的人”（Edward Abbey\
  \ Quotes, n.d.）。权力中某些东西让人类对其垂涎。是因为对他人施加的纯粹影响力，还是因为你手中掌握着另一个人的命运，即使只有瞬间？无论如何，历史一次一次地提醒我们，权力集中在一个实体手中绝不是一个好主意。我经常看到人们带着近乎误解的虔诚态度争论他们偏好的政治派别。虽然固守某些政治信仰没有错，但大多数人没有意识到，将权力集中在一个个人或一个政手中会导致相关人员政治价值观的无限腐败。\n\
  \n想象一下，将全球经济价值最关键的决策交给掌权者所谓的良性。考虑一下：如果你的老板某天叫你进去，告诉你你在公司的命运完全取决于且仅取决于一样呢？想象他们指向房间角落的一个两岁孩子，孩子面前放着一碗糖果。孩子吃不吃糖决定了你是留是走。这听起来很荒谬，不是吗？毕竟这是一个孩子；他们迟早会受到诱惑去吃糖！那怎么能成为你职业的决定因素呢？\n\
  \n毫无疑问，那是一个荒谬可笑的系统；然而，我们似乎在全球范围内遵循它并没有问题。困惑吗？重点来了：我们传统上拥的国家和金融当局与贪婪盯着糖果碗的幼儿并无异——那就是权力。如果我们听任他们的，他们早晚会吞噬权力，而完全不考虑人民的福祉。这不就是\
  \ `2008 危机` 期间发生的情况吗？人们一直信任会做正确事的机构失败了，让人们去收拾他们破碎生活的残骸。而且，我必须补充一点，即使在那场惨剧之后，即使在政府使用纳税人的钱进行救助之后，金融机构也没有学到任何教训。他们继续犯同样的错误，一次又将人们推入痛苦。\n\
  \n相反，区块链分散了这种权力，以至于没有任何实体制定规则。权力分配给所有利益相关者，因此几乎没有腐败的机会。它们使用分布式账本系统，让点对点网络进行自我调节，从而分散了权力因素并放大了福祉因素。\n\
  \n以印度农民对新农法案表现出的和平抗议为例。这些新农法案（在全国范围内大规模抗议后被撤销）被视为对农产品贸易去监管化。`最低销售价格` 被模糊的`保证价格`\
  \ 所取代。农民担心他们现在无法获得应得的价格。\n\n### 网络诚信\n\n\n\n\n\n在“孩子与糖果”的类比中，如果你留意，结果取决于那个孩子的诚信程度。同样，我们的传统系统通常期望将诚信性置于个人身上，而不是过程本身。我们期望政治家信守诺言，期望银行家在金钱交易中保持诚实，而并不一定要求他们建立正确的问责体系。请注意，我绝无意图将责任从腐败个人身上转移开。但是，我们所处的系统几乎就像坐在一辆没有安全气囊的速驰汽车里，抱着希望永远不会发生事故的心态行驶。问题在于，我们一直生活在结果的不确定性中。而当硬币翻向另一面时，一切都太无能为力了。\n\
  \n请用残酷的诚实回答这个问题：如果我告诉你永远不会被抓到，你还会做正确的事吗？我们作为一个社会，选择监管这种行为的方式是施加外部规则，而事实上，更有效的手段应该是引入“网络化诚信”的概念。这意味着，一个人行为的透明度和诚信度并不取决于道德价值观的模糊地带，而是由系统本身的结构驱动的。\n\
  \n想一下生活在一个紧密的部落中会是什么体验，例如。假设你和一个部落生活在一个食物资源有限的岛上。某天，你发现了一个完美的猎物，是一条巨大的肥美鱼鱼。整个部落评估了这次猎获，并由你负责确保它在他们狩猎回来之前是安全的。在这种情况下，你有两个选择：一个是保护好这条鱼直到部落返回，然后在成员之间平均平分；另一个是你自己吞掉一部分，并为发生的事情编造一个故事。很有可能，无论你饥饿到什么程度，你仍然会选择第一种。\n\
  \n原因很简单——这个部落的构建方式使得他们的信任对你的意义远比饥饿带来的即时满足大得多。如果你失去了那份信任，你极有可能被放逐出去任由你自生自灭。因此，欺诈将在两个层面上得到防止。首先，由于整个部落都看到了猎物，要编出一个故事需要耗费很大精力。其次，即使你真的编造了一个，部落成员也永远无法以以前的方式看待你了。总而言之，遵守部落法则将是一个容易得多的选择。\n\
  \n这正是区块链通过其网络化诚信原则对虚拟数据所做的。欺诈、黑客攻击和操纵要么变得不可能，要么让个人付出沉重的代价，从而最大限度地减少沉溺于此类行为的动机。\n\
  \n这种网络化诚信原则在“双重花费”问题上找到了最有用的启示。你是否想过，为什么你可以在手机上拍食物的照片并发送给多个朋友，但对你的数字货币却做不到这一点？这显然是因为钱和照片不是一回事。虽然你可以用任何想要的东西换钱，但我很难认为你可以对食物照片做同样的事。好吧，我知道，问这个问题似乎很愚蠢。但这似乎是在线交易中巨大问题的根源。\n\
  \n显而易见，数字货币不能同时出现在两个地方。因此，钱必须离开你的账户进入你支付给的账户。在双重花费的情况下，代表你数字货币的数字代币文件可能会被伪造——结果就是同一个代币可以使用两次。这对于试图欺骗系统的臭恶元素非常完美，但会给接收这些代币的方带来巨大损失。这通常就是为什么我们需要银行这样的第三方成员来监控数字交易。但是，无论我们多么讨厌，这些第三方成员在本质上同样可以是欺诈性的。\n\
  \n数字货币无法同时出现在两个地方。因此，钱必须离开你的账户进入你支付给的账户。在双重花费的情况下，代表你数字货币的数字代币文件可能会被伪造——结果就是同一个代币可以使用两次。这对于试图欺骗系统的臭恶元素非常完美，但会给接收这些代币的方带来巨大损失。这通常就是为什么我们需要银行这样的第三方成员来监控数字交易。但是，无论我们多么讨厌，这些第三方成员在本质上同样可以是欺诈性的。\n\
