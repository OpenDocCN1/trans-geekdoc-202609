  \n*(注：由于原文后半部分存在大量重复段落，遵循“不要重复输出原文”原则，以下为结尾部分的翻译)*\n\n### 安全\n\n区块链技术提供的安全性，自然是我们这些自由爱好者一直以来寻找的圣杯。我们不再需要为了获得安全感而牺牲自由，反之亦然。有趣的是，传统系统通过增加外部来源的监视来提高安全性，而区块链则通过让用户对数据拥有绝对控制权来实现。由于区块链促进了“无信任信任”的概念——例如，你不需要认识网络中的每个人就能确保数据是安全的；确保安全的是机制，而不是参与者的身份。\n\
  \n密码学在这种方案中起着至关重要的作用。只需注意到，加密代码通过确保只有预期的接收者才能读取数据来保持数据安全。以加密货币为例，数字代币的买卖是通过个人使用的这些加密密钥访问相关信息、完成交易并离开来实现的。\n\
  \n\n\n\n是的，最后一部分非常重要——至少在大多数情况下如此。我们在这里不要对自己的无所不能抱有幻想。尽管我们非常希望如此，但尽管采取了所有先进措施，区块链并不能完全免疫恶意攻击。与其他任何技术一样，黑客也设法发现了这项技术的漏洞。黑客发现进入区块链的某些已知方法包括双女攻击、`51%\
  \ 攻击`，以及钓鱼攻击和路由攻击。更深入地了解其中每一项，可以为我们理解区块链技术以及你参与其中的重要性提供必不可背景。\n\n区块链上的钓鱼工作方式与其他领域几乎无异——通过可能让用户放弃个人加密密钥的信息，来诈骗毫无防备的区块链用户。对于专家来说，这些可能非常显而易见；但另一方面，所谓的路由攻击可能非常难以检测。当然，可以部署保护机制以确保风险降至最低；但重点在于，提高意识是减轻这种风险的第一步。双女攻击的名称源于那本著名且极有争议的书，该书记录了所谓的对西比尔（Sybil）及其分裂性身份障碍的治疗。黑客似乎受到了这个故事的启发，创建了多个身份，旨在淹没系统并最终使其崩溃。最后，但同样重要的是，还有\
  \ `51% 攻击`：肆无忌惮的获得了网络大部分的控制权。这就是伦道德参与者的作用至关重要的，他们的积极参与可以防止此类不道德的接管。\n\n请注意，这些威胁并非常态，尽管存在这些威胁，区块链可能比使用传统系统的交易更安全。正是区块链提供的这种安全性，对全球弱势社区的复兴具有变革意义。以南非学校为例，这些学校配备了由比特币初创公司\
  \ `Bankymoon` 推出的区块链电表。来自世界各地的捐赠者直接向这些电表发送资金，并可以跟踪这些学校使用了多少电力，甚至是他们的捐赠可以购买的电量。交易的安全性确保了援助到达需要者，而不会被中间机构和分销商盗取。有了这项技术的安全性，捐赠者不再需要担心他们的资金是否到达了目的地。\n\
  \n### 隐私\n\n当乔治·奥威尔在他的书籍 `1984` 中写下那句阴险的“老大哥在看着你”时，我们并没有多少人认为这不仅仅是小说。但事实是，监控国家正迅速成为全球性的现实。看来我们已经过了讨论隐性监控是否存在的界点；它极可能已经成为我们生活的一部分。每天通过我们的智能手机收集的数据，足以让任何意识到自己隐私权利的个人感到脊背发凉。允许所有这些应用程序收集我们的个人数据似乎是一件很寻常的事。而我们没有意识到的是，通过这种权限，我们正在交出我们自己最有价值的物品之一：我们的隐私。\n\
  \n区块链为隐私的这一方面带来了全新的意义。专家认为，区块链在未来的某个时间点，可能会让记住用户名和密码的烦恼变得过时。这意味着区块链可以给我们提供加密的数字身份。这听起来就像直接出自某部科幻小说，不是吗？尽管如此，这绝非虚构。\n\
  \n世界银行的 `ID4D` 数据库声称，全球有近十亿人没有认证身份（`麦肯锡全球研究院`，2019 年）。由于缺乏这种身份识别，这些人完全被排除在管理他们的系统之外。他们无法从任何福利计划中受益，但讽刺的是，他们往往是最需要这些计划的人。尽管如此，身份系统的数字化也伴随着自身的风险。事实多次证明，它们可以被用来造成伤害，甚至迫害某些种族身份。\n\
  \n区块链通过提供比纯数字身份更安全、更强大的替代方案解决了这个问题。它们促进了加密数字身份的使用。例如，一场大型区块链运动正在埃塞俄比亚进行，名为 `Cardano`\
  \ 的区块链公司正在为那里的学生提供数字身份。第一批试点针对五百万名学生；而这仅仅是一个开始，在后续阶段还将增加更多。\n\n# 第二章：区块链背后的技术\n\n\
  如果你想要一些新事物，你就必须停止做旧事物。\n\n当 `Satoshi` 发现了一个老旧问题并提出 `Bitcoin` 时，许多人持怀疑态度。`Bitcoin`\
  \ 被广泛预测为终将破灭的泡沫。你会发现，支持者和反对者在多个商业频道上的争论仍在激烈进行。尽管如此，有一个关键细节人们似乎已经忽略了很久。所有的加密货币都是区块链，但并非所有的区块链都局限于加密货币。\n\
  \n\n\n\n那些强调加密货币相关的波动性和风险的人，往往会犯一个错误，即将所有这一切都与区块链联系起来，而这与事实大相径远。当然，我们稍后会详细讨论 `Bitcoin`，但现在重要的是将两者区分开来。为了做到这一点，我们需要更深入地理解这项技术。理解我们之前讨论的原理是理解区块链的一部分，另一部分则是技术创新。只有当我们对区块链技术轮轴中的各种齿轮有了深入的理解时，关于区块链的那些误导性迷言才能被消除。\n\
  \n## 区块链的要素\n\n尽管本书的重点更偏向于影响方面，但我仍然希望带你领略区块链的技术细节。我们不会深入到让任何阅读此书的人都能亲手创建一个区块链的程度。但是，我真心希望如果你对通技术领域感兴趣，那么接下来的章节将激发你的兴趣，使你更有热情地投入到区块链解决方案中。然而，出于目前更广泛的目的，我们将从简化的角度来看待技术方面，并理解这些方面对我们的日常生活意味着什么。\n\
  \n## 常用术语\n\n在阅读关于区块链的内容时，你经常会遇到某些看起来像拉丁语和希腊语的单词。但，难道每个孩子在学习字母表之前没有同样的感受吗？所以，我们开始吧，学习构成区块链世界的字母表。\n\
  \n首先，我们需要理解的是区块链是由几个 `nodes`（节点）组成的网络。`Nodes` 可以被比作在网络上来回传输数据的微服务器。这些多个 `nodes`\
  \ 的存在确保了透明度，你很快就会看到它是如何工作的。\n\n![](img/image00156.jpeg)\n\n在处理完基础框架之后，让我们首先从区块链中的\
  \ `block`（区块）开始。这些 `blocks` 具有对我们参考很有用的某些特征和方面。链中的第一个 `block` 被恰形象地命名为 `genesis\
  \ block`（创世区块）。将其想象为区块链的零起点；这是所有一切开始的地方。随着交易数据的增加，它们被打包在这个 `block` 中，然后填充到其容量上限。容量可能取决于区块链应用程序的类型。一旦\
  \ `genesis block` 被填满，下一个 `block` 就会出现，交易会被记录在其中。`genesis block` 和后续 `blocks` 之间的主要区别在于后者都对之前的\
  \ `blocks` 有引用；由于 `genesis block` 是第一个，显然没有先前的引用。\n\n`blocks` 有三个从区块链终端用户角度来看具有特殊意义的方面。其中之一无疑是\
  \ `time stamp`（时间戳）。这个 `time stamp` 是根据从区块链上所有 `nodes` 接收到的交易时间决定的。因此，想象一个分布在美国、澳大利亚、加拿大和印度的区块链。由于这些地方都处于不同的时区，区块链应用程序将调整来自所有这些\
  \ `nodes` 的时间，以获得交易的中位 `time stamp`。由于这些 `time stamps` 由多个 `nodes` 证实，操纵记录将变得完全是不可能的。\n\
  \n第二个方面是随每个 `block` 生成的 `hash`（哈希值）。`Hashing`（哈希）是一个非常数学化的过程，它接收来自交易数据的不同长度的字符串，并将其转换为固定长度的输出。由于整个过程具有极强的数学算法属性，`hash`\
  \ 为交易增加了额外的安全性。这确实使得恶意黑客篡改数据本身变得困难得多。因此，数据能够到达精确的预期接收者，使操纵变得更加困难。\n\n![](img/image00157.jpeg)\n\
  \n与其深入探讨这个 `hash function`（哈希函数）的算法细节，我想和你谈谈它对你终端用户意味着什么，而你却毫无察觉。区块链的每个 `block`\
  \ 头部都嵌入了前一个 `block` 的 `hash`。这项技术的精妙之处在于所用逻辑的简单性。这种对之前 `hashes` 的链式嵌入使得在不操纵其他区块的情况下，操纵其中一个\
  \ `block` 几乎是不可能的。而在如此大的规模上操纵所有 `blocks` 来修改数据是极不可能的。\n\n![](img/image00158.jpeg)\n\
  \n如果有人真的拥有巨大的智力去这样做，那么获得完成它所需的物理资源仍然是一项巨大的财务工程。记住我们之前提到的点——在区块链中，作弊要么极其困难，要么极其昂贵，或者二者兼有。`hash\
  \ function` 就是使其如此的因素之一。`hash function` 也是让我们所有人熟悉的数字签名成为可能的因素。\n\n构成区块链的第三也是最后一个方面是所谓的\
  \ `nonce`（随机数）——一个只使用一次的数字。这是分配给每个 `block` 的每个 `hash` 的数字。这是 `miner`（矿工）必须发现的开始\
  \ `mining`（挖矿）过程的数字。由于寻找这个数字并不容易，`nonce` 就像筛选测试一样，用来淘汰能力较弱的 `miners`。\n\n为了理解这一点，我们需要深入研究\
  \ `mining process`（挖矿过程）。`mining` 是那些运行区块链 `nodes` 的人员赚取所需奖励的方式，并激励他们维护网络的完整性。将这些\
  \ `miners` 想象成付薪以保持交易数据整洁的审计师。如果你对区块链技术有一丝丝兴趣，`mining` 是一个你一定听过的术语。而且，这个词的传统用法显然会让人联想到劳工聚集在闷热、潮湿且黑暗的地下隧道中。事实是，`blockchain\
  \ miners` 同样努力，但区别在于，只要他们有一些强大的 `CPUs` 和大量的数学计算知识，他们就可以舒适的家里完成工作。\n\n\n\n\n上述方法还有另一种替代方案。虽然我上面描述的是工作量证明（`PoW`）。但还有权益证明（`PoS`）方法，对于那些希望在……比如，家里的\
  \ `PC` 上进行区块矿的人来说，这种方法要可行得多。所以，如果你一直认为区块链和挖矿对于像你我这样的普通人来说遥不可及，那么事实并非如此。任何拥有电脑的每个人都可以在家里经营基于区块链的业务，生产定期的数据块。让我们来看看这是如何实现的。\n\
  \n## 共识机制\n\n区块链技术的强大之处在于其去中心化的本质。共识机制与这种强度密切相关。根据应用领域的不同，区块链采用的共识机制类型通常是频繁使用的三种之一：工作证明（`PoW`）、权益证明（`PoS`）和委托权益证明（`DPoS`）。尽管已经开发了其他机制，但这三种是最流行的。\n\
  \n-   **工作证明**：我们在上一节讨论的内容被称为 `PoW`。在这种情况下，矿工必须证明自己进行了解密和验证。随着区块的产生，数学题的难度会增加，如果矿工比其他人更快地解决了难题，他们将获得区块——这是所有共识机制中最昂贵的，因为它们消耗大量的资源：包括人类和技术方面。尽管这是\
  \ `Satoshi` 最初想要的共识类型，但由于其巨大的消耗，经常受到批评。\n\n-   **权益证明**：在 `PoW` 机制中，每个矿工都有相等的机会解决难题并找到区块。在这里，根据持有代币最多的人来随机分配区块验证者。这些验证者将获得交易费或加密货币作为奖励。与\
  \ `PoW` 相比，这种共识机制要高效得多。\n\n-   **委托权益证明**：这是 `PoS` 的民主化版本。在这里，持有代币（以代币的形式）的用户拥有投票选择产生区块区块者的权力。投票权重取决于用户所持有的代币比例。正如上面提到的，这些并不是共识机制，但它们确实是最流行的。当你仔细观察时会发现，无论我们如何谈论区块链技术，如果人们不参与，其安全性将毫无意义。你可能会问，那么这项技术有什么不同或革命性之处？事实是，区块链为像你我这样的人提供了传统系统从未过的机会。而且，我们要充分利用这个机会。\n\
  \n## 决策博弈论\n\n这项技术的另一个我们无法忽视的方面是分布式系统中的决策模型。共识机制是节点如何做出决策，以及为什么他们应该被激励去达成一个完全不同的局面。例如，为什么我应该维护系统的利益而不是我自己的利益？为什么不通过作弊来获得最好的结果？共享网络的人并非来自另一个星球，我们作为人类共享同样的缺陷——贪婪、腐败。但区块链从一开始的整个重点就是创建一个个人的缺陷不会变成所有人弱点的去中心化系统。博弈论完美地解释了这一点。\n\
  \n博弈论只是区块链上应用的决策模型，它从数学上预测了节点可用策略的成功率。让我通过被称为“囚困困境”的东西解释这一点。假设两个个人 `Pete` 和 `Tom`\
  \ 因为偷窃被捕。没有其他证人，案件只能通过供词来判定。逻辑上，这里可以预期以下一系列结果：\n\n1. 其中一人可能招认，另一个可能否认。\n2. 两人都可能否认。\n\
  3. 两人都可能招认。\n\n在这种情况下，最好的情况是他们人都否认。最坏的情况是他们可能被处以少额罚款或受到警察的责备。这很简单，不是吗？但这里的困境在于——由于他们是分别被审问的，没有人确定对方是否也会否认。例如，如果\
  \ `Pete` 否认而 `Tom` 出面作证，`Pete` 将受到最大的处罚，而 `Tom` 将无惩罚地释放。现在，这对于 `Tom` 来说可能是一个诱人的选择，因为他可以保持记录洁洁。但实际上，这是一个糟糕的结果；因为\
  \ `Pete` 受到了更大的处罚，他可能会被罚款并关禁五天。再进一步，想象 `Pete` 也是这样想并告了 `Tom`。`Tom` 和 `Pete` 都背叛了对方，现在两人都会受到罚款和关禁五天的处罚。这被称为囚徒困境，其中\
  \ `Tom` 和 `Pete` 都决定服务自己的利益，而实际上，互相支持对双方都有利。\n\n博弈论模型简单地为这里的结果概率赋予了一个数值：\n\n| |\
  \ Pete 作证 | Pete 不作证 |\n| --- | --- | --- |\n| Tom 作证 | 5, 5 | 0, 5 |\n| Tom 不作证\
  \ | 5, 0 | 0, 0 |\n\n那么，这与区块链上的决策博弈论有什么关系？记住，区块链的设计方式是，只有当交易被多个节点验证时，系统才会奖励矿工。如果矿工作弊或操纵数据，就会导致区块失效，矿工可能会被驱逐。这意味着，在区块链上作弊并将个人利益置于网络之上是完全的浪费时间。相反，如果矿工保持交易数据的洁净，从而将系统的利益放在个人利益之上，他们就可以继续获得丰厚的奖励。因此，区块链从生地鼓励其节点做出对集体有利的事。\n\
  \n## 技术的共同特征\n\n上述元素不仅仅是华丽的术语，它们实际上构成了我们所知的区块链的强度。但是，仅仅知道术语是不够的，还要关注这些单独元素汇成的核心特征。实现我对关于区块链的所有承诺的方面是分布式账本和智能合约。\n\
  \n### 分布式账本\n\n\n\n\n长期以来，我们都知道账本对企业而言至关重要的性。分布式账本将这些账本推向了一个全新的高度。它们让区块链上的去中心化成为可能。我们之前讨论的技术细节——包括节点、区块、`hash`\
  \ 和 `nonce`——构成了分布式账本。这些是跨区块链进行共享、复制和同步的数据库，从而形成了一个独特的透明系统。如果没有分布式账本技术（通常缩写为 `DLT`），对区块链的任何读取都是不完整的。但大多数人并没有意识到，分布式账本等同于区块链。虽然所有区块链都需要\
  \ `DLT`，但并不是所有的分布式账本都以区块的形式存在。`DLT` 有多种类型。例如，`Tangle` 就是物联网（`IoT`）应用中的一种 `DLT` 形式。\n\
  \n由于能够在多个节点上安全、透明地记录数据，且不需要第三方监控，这些分布式账本有将交易和结算时间从几天缩短到几分钟的能力。还记得那个急需向家乡汇款的窘困印度男人的例子吗？区块链的这部分可以让他非常轻松地完成操作。这些账本还消除了对各种来源记录进行核对的需求，从而节省了时间和精力。\n\
  \n正如你所看到的，`DLT` 是一项真正了不起的创新；但要实现其产生影响的实施潜力，它需要所谓的智能合约的帮助。\n\n## 智能合约\n\n智能合约可以被看作区块链上的程序，设计用于仅在满足某些先决条件时运行。想象一个组合锁箱：只有当数字组合完全完美时，它才会解锁。假设你忘记了哪怕一个数字——你就被锁在外面了。智能合约也是如此，但条件不是数字，而是某种条款，这些条款会激活或取消相关方之间的协议。同样，由于过程是自动化的，因此不需要中间人来监督流程。\n\
  \n让我们来看智能合约如何让生活变得更加简单的例子，特别是对于弱势群体。众所周知的是，非洲的土地登记和所有权系统在赋能贫困人口方面可以起重要作用。然而，这些系统非常紧张，以至于这个过程往往过于繁琐，让一个没受教育的穷农民无法负担。更糟糕，由于办公室内泛滥的腐败，对法律机构的信任可能已经受到了损害。智能合约像是一个简单的解决方案——注册过程中的各个步骤——如检查政府记录中的土地登记、物业检查等——可以被写入这些区块链的代码中，从而最大限度地减少错误和腐败的机会。\n\
  \n经常受到自然灾害（如飓风、地震等）影响的社区也可以过上无忧的生活，因为他们不需要不断担心记录的安全。例如，2010 年海地的地震摧毁了房屋，也摧毁了政府档案，导致数百万人在物理和法律上都变得流家失所。这种情况可以通过区块链上的智能合约来避免。由于区块链上的记录存储在世界各地的多个副本，尽管遭受了灾难性的损失，他们仍然可以主张财产的所有权。\n\
  \n## 区块链类型\n\n2022 年 2 月的一份 `Yahoo!Finance` 报告提到，谷歌首席执行官 Sundar Pichai 正“寻求帮助构建\
  \ `Web3` 区块链产品”。如果这家巨头都在关注，那么你可以确信区块链已经到来。但是，这个 `Web3` 到底是什么？在我们深入之前，让我们先来看第 1 和第\
  \ 2 版本，好吗？在 2008 年爆发性进入后，区块链技术经历了自身的演变。有些人会说这项技术领先于时代，尽管它备受青睐，但我们最近几年才看到它的实现。这可能就是为什么我们现在生活的时代被某些人称为区块链复兴时代的原因吧。\n\
  \n人们经常讨论区块链 1.0、2.0 和 3.0。第一代区块链 1.0 与 `Bitcoin`（比特币）同义词。它由 `Satoshi` 引入，专门用于加密货币。因此，所有的加密货币都属于这一类。但随后，创新者们开始意识到区块链技术蕴含的无限潜力。如果加密货币可以在没有外部监管和干预的情况下进行交换，那么这些账本中也可以实施智能合约。于是，区块链\
  \ 2.0 诞生了。但，区块链的演变远未结束，它将在未来很长一段时间内持续。区块链 3.0 是这项技术开始走出萌芽阶段，并在治理和医疗保健等多个领域实现其真正潜时期。\n\
  \n正如预期的那样，区块链不仅在实施上，而且在核心结构上发生了巨大的变化。从这种变化中出现了四种常见的区块链类型：\n\n1. 公有链\n2. 私有链\n3.\
  \ 联盟链\n4. 混合链\n\n使用的区块链类型将取决于使用它的行业，以及它旨在希望从中获得的收益。让我们尝试深入了解一下这些。\n\n### 公有链\n\n\
  公有链最著名的类型非 `Bitcoin` 属。“公有”意味着任何人都可以加入区块链，而不需要获得先前成员的任何许可。这就是为什么也被称为无许可账本。这种区块链通常需要加密货币作为代币形式，并遵循我们之前讨论的共识方法。例如，`Bitcoin`\
  \ 使用 `Proof of Work`（工作量证明）共识机制。\n\n一方面，在四种类型中提供了最高形式的去中心化。由于没有准入门槛，普通人可以轻松地接入节点网络。所有人都可能对这种区块链构设置的运行有平等的参与感。但另一方面，由于高能密集型协议，这些对环境的负担也很大。此外，并不是每个区块链都需要加密货币。\n\
  \n这类区块链经常遇到的另一个问题是缺乏可扩展性。这意味着这些区块链无法支持大规模交易。正是这个问题阻碍了这类区块链（特别是在加密货币方面）发挥其全部潜力。例如，`Bitcoin`\
  \ 每秒可以处理的交易数量远低于其竞争对手：`VISA`。一种被称为 `sharding`（分片）的技术通常被用来解决这个问题。也就是说，较大的区块链本质上被分成较小的部分，称为\
  \ `shards`（分片）。这些分片可以由多个节点同时处理。尽管这看起来像是一个极其简单的解决方案，但事实是将此类分片整合到区块链架构中是一项复杂的任务。这就是为什么有时人们可能偏好其他类型的区块链，尽管公有链平台提供了可能的去中心化。\n\
  \n\n\n尽管存在这些缺点，公共区块链在为世界上某些被认为特别弱势的地区带来变革方面已展现出巨大的潜力。Cardano 公共区块链就是此类区块链的一个例子。它是完全去中心化且完全开源的。该区块链甚至尝试通过实现\
  \ `Ouroboros` 共识机制协议来绕过资源密集型任务。它属于权益证明（Proof of Stake）共识家族，并有效地解决了验证交易时需要不断增加能量消耗的问题——至少很大程度上，如果不是完全解决的话。这种节能协议使其非常适合在非洲某些地区构建基于区块链的社会和经济。\n\
  \nCardano 使用了被称为质押池运营者（SPOs）的技术。这些人被信任负责建立和运行质押池。在 Cardano 区块链上，`ADA` 是一种数字货币，其作用类似于\
  \ Cardano 区块链中的权益。质押池是 Cardano 区块链上的节点，存储各种用户的权益。作为回报，质押池运营者是受托维护这些质押池的个人，他们通过拥有或租用服务器来实现这一点。这就像把钱存入银行并获得一些利息。当你持有\
  \ Cardano 的权益时，可以获得大约百分之五的收益，这些收益在用户和运营者之间分配。更有趣的是，许多此类质押池是使命驱动的，这意味着部分收益也用于慈善。以\
  \ `BIO` 质押池为例——这是一个由 `ADA` 持有者组成的社区，他们利用池收入用于全球环境和物种保护计划。将 `ADA` 委托给该组织的人还可以投票决定他们希望执行的项目。因此，即使是保护环境也是以民主的方式进行的。另一个例子是\
  \ `SHIFT` 质押池，它致力于类似的事业。`Stop Monkey Shocks` 是另一个使命驱动的质押池，旨在防止因道路上的电线而导致猴子触电死亡。原因可能不同，但技术支持的这种善意正在通过一个又一个项目改变现实。如果这都不算回馈，我不知道什么才算。\n\
  \n但请记住，Cardano 并不是唯一这样做此事的公共区块链。我想到的其他例子还有 `Algorand` 和 `Harmony` 区块链。我确定，越来越多这样的项目需要大众的鼓励和支持，而且在我们说话时，它们确实正在出现。\n\
  \n## 私有区块链\n\n私有区块链顾如其名，允许某些授权的个人访问区块链。这可能更适合私有企业。只有通过有效的邀请才能获得访问，并且允许访问的成员需要经过区块链运营者的批准。这种批准理想情况下是通过严格遵守某些关于个人背景的预设标准完成的。即使是区块链中的成员可能有不同的权利和特权。因此，一个人可能拥有不受任何限制的完全访问权限，而另一个人可能没有。私有区块链与公共区块链有显著区别的另一个办法是，后者允许交易完全匿名，而前者则不然。\n\
  \n私有区块链相比公共区块链的一个大优势是交易速度。由于私有区块链上的参与者数量非常有限，达成共识的速度快得多。然而，正如你可能猜的那样，私有区块链在真正意义上并不是去中心化的，它们只是利用分布式账本在多个节点中保留数据的多个份副本。`Hyperledger`\
  \ 和 `Ripple` (`XRP`) 是私有区块链最常见的例子。\n\n从实现的角度来看，很清楚，私有区块链不能用于广泛的社区计划，而仅适用于寻找更好数据组织方式的企业。但即便如此，用户也必须保持警惕，因为虽然较少的人带来了更好的交易速度，但也使得这些区块链非常容易受到外部恶意元素的攻击。交易中的信任也可能是另一个问题，其中节点的信誉和它们对交易的验证可能存在模糊性。\n\
  \n## 联盟链\n\n私有用户的另一种选择是联盟链，它试图至少部分将公共区块链的优点引入许可链区块链。联盟链与私有区块链非常相似，一个主要区别是，在这种区块链中，参与者不仅属于一个组织（如私有区块链），而且可能来自多个组织。这使得入侵数据库变得更加困难。由于多个参与者的存在，它们还提供了更高程度的去中心化。\n\
  \n## 混合链\n\n这些为许可链区块链增加了另一层复杂性。尽管它们在某种程度上是私有的，但区块链上的记录可以通过智能合约随时向第三方开放。混合链的一个例子是迪士尼发布的\
  \ `Dragonchain`。是的，你没读错。迪士尼在 2016 年 10 月就发布了这个开源平台（Knowles, 2017）。这应该告诉你区块链是多么流行——事实上，它们已经流行一段时间了。尽管，现在是一个转折点，这项技术不仅被用于管理业务，还在改变社区。\n\
  \n另一个非常酷的功能是，尽管这些区块链可能由私有实体拥有，但它们无法对数据进行更改，就像网络运营者有权覆盖数据的私有链和联盟链一样。授予成员的访问也是平等且完全的，对特定成员没有限制。即使是区块链上用户的身份在他们参与交易之前也是安全的，在这种情况下必须披露。在很大程度上，混合链可以被认为为私有区块链结构引入了网络完整性、透明度和安全性。\n\
  \n\n\n当美国的开国元勋之一说出这句话时，他可能并不知道，在从殖民统治的枷锁中解放几个世纪后，我们仍然是那些权势者的欲望和幻想的奴隶——那些声称是我们免受苦难之救主的人，以及那些自称为我们自由守护者的人。是的，我认为我们仍然是奴隶——也许不是传统意义上的这个词，但你一定考虑过，认为“我们需要不断担心守护自己的自由”这种想法是谬误的吗？事实是，我们被训练去相信的那种社会等级制度告诉我们，只有当自由能赋予某些群体他们渴望的权力时，自由才会被赋予我们。这在某种程度上意味着，自由与权力动态对于你我这些人来说是一种权衡。你可以拥有其中一种，但两者不可兼得。\n\
  \n我知道你在想什么：为什么我非要在一本关于区块链的书里如此激烈地谈论自由？嗯，如果你仔细观察，这并不难理解。区块链运动致力于从长期高度集中的某些阶层手中夺回权力并将其交给普通人，这根本不是一个新运动。这场运动在我们任何一个人出现之前很久就已经存在了。它改变了面目，但核心保持未变；它依然随着为了自由而呐喊的反叛之心跳动着。\n\
  \n## 反叛的起源\n\n让我们做一个思想实验，好吗？想象你某一天醒来，被告知从现在起，你余生只能穿两种颜色——黑色和白色。每天你醒来后在这两者之间做出选择。你被告知你可以拥有最高品质的西装和裙子，但不能有任何其他形式的衣服。你对此何感觉？压抑？挫败？\n\
  \n现在，再进一步。你从小起就被不断灌输了信息，说这种黑白衣服的政策实际上对你有好处，它实际上节省了你本会浪费在几种颜色中做选择的时间，而且那些颜色对你来说反正会分心。此外，你被训练去相信，做出这些选择的实体是想为你好。你甚至被直接或间接地地告诉，这个系统太强大了无法改变，遵循规则会更容易（毕竟，这些规则都是为了你好）。\n\
  \n这个寓言可能看起来像是一个愚蠢的夸大，但如果你仔细观察，你会发现这与我们的中心化系统所做的事情并没有区别。他们制定法律，采取他们认为符合我们最大利益的政策——或者，我们应该说，符合他们自己最大利益的？无论如何，中心化权力倾向于扼杀我们的自由，以至于我们开始相信，别人比我们自己更擅长做那些对我们真正“有益”的决定。\n\
  \n我意识到这让我听起来像个激进的反叛者，但请相信我的话：在当今时代，我们需要的是激进的反叛者。区块链企业仅仅是这种思想的逻辑演进，而不是一个令人惊讶的奇迹般的创新。我们的系统早就该得此一报了，现在是时候让它们彻底断联系了。世界上许多地方已经做到了这一点，我们都需要在列车驶过我们之前跳上去。\n\
  \n我经常面临一些朋友、同事和熟人的质疑，关于我对比去中心化区块链技术的强烈支持。为什么，他们问我，为什么我对区块链有如此强烈的感觉？嗯，我可以给他们讲我们讨论过的所有精彩例子，但我知道他们不会被说服，因为在大多数时候，他们寻找的是驱动我个人的动力，即我存在的最核心。所以，我告诉他们，我宁愿提醒他们一个小故事。也请允许我提醒你们。\n\
  \n很久以前，在一个被称为美国的土地上，13 个殖民地决定以前所所未有的方式反抗压迫，猜怎么着：他们赢了！但有趣的是，他们的独立思想被限制在由与他们相似的人所领导的生活中。曾经被赞颂的英雄现在也受到了严厉的批评，因为他们自己通过奴隶制推行了压迫。是那些废奴主义盟友结束了这种古老的压迫，并为“自由”一词带来了全新的意义。\n\
  \n尽管如此，现实——随着它的展开——几乎无法被放入整齐洁净的盒子里；而且，在我们塑造感知时，有必要承认并欣赏这些细微差别。我一直认为，尽管开国元勋们由于他们支持奴隶的行为而正受到攻击（这是完全合理的，至少在某种程度上），但他们也是在《独立宣言》之后撰写宪法的人，这最终加强了废奴运动的思想基础。托马斯·索威尔（Thomas\
  \ Sowell）在一次采访中提到，奴隶制之所以成为争议焦点，仅仅是因为美国建立时的开国文件；在此之前，奴隶制在各种文化和文明中都是盛行的。\n\n问题往往在于，我们多年、几十年、几个世纪以来领导的斗争往往被我们的即时经验所污染——受限于自己的政治信仰、社会阶层、性别、文化偏见等——而不是我们作为人类整体的经验。当开国元勋为自己的自由而战时，他们忽视了非裔美国公民的自由。我敦促你问自己，在今天，我们每一个人是否对世界上其他地区那些弱势群体的痛苦点无知？我敦促你反思，“噢，那对我真的没影响，我为什么要关心几英里外的人？”是否是你某天当后代质问你时会自豪地告诉他们的话。请记住，他们会质问我们的！\n\
  \n我们现在生活的时代要求我们改变对自由的定义。记住，你有权选择自己的定义。它可能与我的不一样，但它完全有权像我的定义一样存在。今天，我们面对的是一种不同的自由斗争。随着取消文化和审查制度达到顶点，今天我们都是一个告诉我们该做什么的中央权威的奴隶。我们正被中心化权力统治，而我们甚至不知道。就像在牺牲之前被喂养盛宴的祭品一样，我们住在这些中心化权力为我们建造的小茧中，过着舒适的生活。我们被错误地引导认为自己是掌权者，而事实与此相差甚远。\n\
  \n回到我问的问题，我如此支持区块链的原因是因为我热爱我的自由；我热爱与拥有另一种信仰体系的人产生异议和辩论的能力。而区块链最接近这一真理。如果你愿意接受，去中心化的区块链解决方案将给你真正意义上的权力。\n\
  \n而且，无论信不信，区块链如此激烈地提出的去中心化完全不是一个新想法。它从我们的祖先反抗英国统治时期就开始存在了，那时我们展现了打破奴隶枷锁的热血勇气；我们也继续与基于性别、种族、社会阶层等的歧视作斗争。我深信区块链技术对我们社会中的不公所做的，正如开国元勋对殖民统治所做的、废奴主义者对奴隶制所做的一样。我们正处于再次创造历史的边缘，取决于你决定是否参与。\n\
  \n\n\n\n当中本（Satoshi）带来比特币时，他们将计算机屏幕后持续已久的反叛推向了台前：加密无政府主义（crypto anarchy）运动。如果不理解加密无政府主义，我们就无法完全理解区块链。区块链可能正是连接这一地下运动与现实生活应用之间缺失的链环节。这就是为什么我说，区块链可能只是历史上某场新革命的开始。\n\
  \n## 在加密无政府主义的黑暗屏幕中漫游\n\n希腊神话中有一个关于灵魂伴侣的传说：人类最初出生时四条手臂、四条腿和两个头——一个身体里有两个个体——直到宙斯在一次大发雷时将这两个个体分开；从此以后，人类被诅咒终生都在寻找自己的灵魂伴侣，寻找那个完美契合的人。区块链和密码学似乎是灵魂伴侣的技术版本。它们像锁和钥匙一样完美契合。密码学是让区块链不可阻挡的一个方面。\n\
  \n尽管密码学看起来很有技术性（在我们的语境中确实如此），但它并不是什么新事物。几个世纪以来，文明一直在使用密码来保护信息。人们已经发现并研究了追溯到`公元前\
  \ 1900 年`的古密码。但直到 20 世纪末，这些密码在席卷全球的技术浪潮中留下了印记。密码学为万维网（或所谓的互联网）提供了一层人们甚至不知道需要的安全保障。它无非是以一种极难破解的方式对数据加密。这确保了数据只到达预期的接收者。正如我们之前看到的，这种安全复杂性是区块链技术的一大独特卖点（USP）。\n\
  \n我们可以深入挖掘关于密码学的信息，但由于其本身是一门巨大的科学，那将是完全另一本书的内容。然而，与我们的语境相关的是这一卓越实践的核心意识形态。加密无政府主义在`1980\
  \ 年代`开始成形，当时像史蒂芬·列维（Steven Levy）和史夫·沃兹尼亚克（Steve Wozniak）这样的人会`黑`计算机——不是为了偷取或欺诈，而是为了尽可能理解软件并探索如何让设备变得更好。`1984\
  \ 年`，列维出版了一本名为《黑客：计算机革命的英雄》的书，在书中他谈到了黑客精神，他对比去中心化的激情显而易见。晚些时候，在`1992 年`，提摩西·C·梅（Timothy\
  \ C. May）在他的论文《加密无政府主义宣言》中，通过提出一种通过加密信息匿名通信的新方法，将密码学的隐私维度提升了高度。尽管他完全预料到了政府会以法律法规的形式对此方面进行打击，但也知道没有什么能阻止这种无政府状态。\n\
  \n现在，请理解加密无政府主义尽管正如其名，但并不是关于暴力，也不是为了在群众中传播仇恨和不满而盲目反对体制。我个人并不支持这种狂热的措施。自由意志而非极端主义，才是解决方案。一个尊重并维护所有人权利的体制是我所追求的乌托邦。\n\
  \n我希望作为读者，你能欣赏这种加密无政府主义所采取的伦理和思想立场。密码朋客（这些加密无政府主义者自称）提出了一种绝对和平的方式来反抗试图监管的中心化权威。\n\
  \n## 中心化 vs. 去中心化\n\n密码朋客（这些加密无政府主义者自称）提出了一种绝对和平的方式来反抗试图监管的中心化权威。我希望作为读者，你能欣赏这种加密无政府主义所采取的伦理和思想立场。密码朋客（这些加密无政府主义者自称）提出了一种绝对和平的方式来反抗试图监管的中心化权威。我希望作为读者，你能欣赏这种加密无政府主义所采取的伦理和思想立场。\n\
  \n密码朋客（这些加密无政府主义者自称）提出了一种绝对和平的方式来反抗试图监管的中心化权威。我希望作为读者，你能欣赏这种加密无政府主义所采取的伦理和思想立场。\n\
  \n即使我在写关于去中心化能给普通人生活带来的积极影响时，我也清楚地意识到对应的支持中心化的论点。\n\n### 支持中心化的论点\n\n与去中心化完全相反的是一种信念：将权力集中在一个中央机构可以提高决策效率，从而提高普通公民的生活质量。在中心化结构中，决策的制定和执行要快得多。\n\
  \n虽然这确实是一个有效的论点，而且不可否认决策的达成速度快得多，但我的反驳论点是：速度一直是好事吗？心理学中有一个被称为“群体思维”（groupthink）的概念，这在这里具有完美的关联性。群体思维是指某些单位可能盲目信任其小组决策是无懈可击且不会出错的。\n\
  \n\n\n\n\n如果你问我的意见，我不会！尽管那位医生可能才华横溢，但团队的共识并非源于按应的方式讨论证据，而是源于他们相信领导永远不会出错。在这种情况下，即使年轻医生对某事有不同意见，这些意见也可能无法进入核心，因为在这样的环境中，任何个性或冲突都会被含蓄地遏制，而从性则会被强化。\n\
  \n这种情况在集权结构中发生的概率比去中心化结构高得多。现在，想象一下医院的这位医生给出了诊断，然后你去找其他医院的医生寻求第二和第三意见意见。他们更有可能以公正的角度看待这一诊断，因为他们不受这位医生有多优秀的影响。更有可能的情况是，他们根据症状证实该意见并得出自己的结论。当然，为了方便理解，我在这里简化了问题，但你明白我的意思。要点在于，更快的决策并不总是更好的决策。\n\
  \n正如 T.S. 艾利特优辞华丽地所说：“世界上大多数的恶是由心怀善意的人所做的”（T.S. Eliot Quotes）。如果你从历史背景来看这句话，人类面临的几乎所有灾难性事件，无论是大屠杀还是其他形式的所谓种族灭绝，无疑都是权力集中在某一个政党、个人甚至某种意识形态的结果。\n\
  \n去中心化极大地降低了此类灾难发生的概率。去中心化结构，特别是利用区块链的结构，在验证证据后达成共识的能力要强得多。这些结构促进了个体性和对原则的遵循，而不是对群体或个人的遵循。众所认为，它们的共识机制是资源密集型的，仍需完善，但正如我之前提到的，区块链仍在增长中。基于我们在这一领域看到的创新，我们可以预计未来在像\
  \ `Ouroboros` 这样的环保型共识机制方面会有更多工作。\n\n每当谈到区块链去中心化时，经常提出的另一个论点是对这类在线网络中可能出现的犯罪活动的恐惧。我无数次看到人们将“在线”自动等同于“阴暗”。媒体中区块链技术的反对者，以及政府和监管机构，继续利用这种恐惧和无知向人们脑海中灌输错误信息，而如果他们能获得正确的信息，他们确实会有不同的看法。例如，有一种说法认为区块链因为是匿名性的所以支持非法交易。数据表明事实并非如此。\n\
  \n2011 年的 `Silk Road` 失败是许多谴责区块链技术人士喜欢的案例。Ross Ulbricht 在此被定罪经营一个名为 `Silk Road`\
  \ 的暗网黑市平台，在那里毒品交易、洗钱等非法活动非常猖獗。Ulbricht 被判处终身监。区块链技术的批评者利用这一惨剧为区块链去中心化的辩论定下了一个过早的结论。但，这正是他们不理解的地方。FBI\
  \ 打击后收集的证据之所以在很大程度上可能，是因为它使用了加密货币区块链。由于数据是如此去中心化，它无法被操纵。同时，交易的透明性实际上让所有搜查令和监控的文件工作变得完全多余，从而加速了定罪。\n\
  \n如果我们考虑到使用法定货币实施以及为了法定货币而产生的不断犯罪率，那些主张传统金融机构而非区块链解决方案的人那种自高一下的态度令人惊讶。当然，法定货币交易是非法活动的温床这一事实，不能作为去中心化区块链上可能发生的犯罪的辩护。说区块链完全免疫此类活动是不准确的；它们确实不是。但，信不信，在区块链这种不可篡改的分布式账本上追踪犯罪，远比在现金非法交易的物理黑市上容易得多。\n\
  \n我想在这里指出，这并不是我在试图说服你采纳去中心化意识形态，而是为了创建一个开放的沟通渠道，让你能够看清你周围正在发生的那些巨大而微妙的变化的本质。要点是开始一段对话，也许最终通过承诺增加对这项技术的参与，为自己争取改变现状的主动权。\n\
  \n## 通用人工智能的角色\n\n几年前，先进的人工智能曾是科幻电影里的情节，演员们扮演来自未来的类人角色。我们当时都想：“那永远不会发生，但看起来确实很有趣！”时光快进到\
  \ 2016 年，机器人 `Sophia` 登场了，她用幽默的回答和近乎人类的外表及部表情让我们叹为观止。不，她并不像老派的《终结者》施瓦辛格那样酷酷，但她是第一个会开笑话的机器人。当然，机器人并不是真的在说话，而是内部插入了一个带有预设回答的聊天框。但这个机器人有趣的地方在于，它可以感知与它交谈的人的情绪和语言语调。其创造者\
  \ David Hanson 声称，随着时间的推移，记录和分析这些回答会让 `Sophia` 变得更聪明，对人类反应更敏感。这是多么巨大的跨越啊！\n\n我提到这一点是因为这人工智能正在取得的百万进步中的之一——从\
  \ `Netflix` 上的推荐，到广告商发现并向你推销你一直在寻找的精确礼物。人工智能已成为我们生活中不可分割的一部分。尽管 `Sophia` 可能无法帮助你过得更轻松，但更微妙的机器学习应用通过其算法确实可以。\n\
  \n是的，我说的是那些在深夜派对对话中成为多种阴谋论主题的神秘的算法。稍微了解一下营销技术就会告诉你，这些算法并不是阴谋，而是帮助你在广阔复杂的互联网领域连接到你所需的确切资源的绝佳方法。信不信，这些你有时觉得很讨厌的算法正在为许多行业（包括医疗保健）提供喘息。\n\
  \n然而，这些算法的问题在于，为了使其有效，它们通常也必须具有侵入性。它们需要个人数据，这可能对你的隐私甚至身份安全产生危害。如果你留了心，你会记得当你登录一个应用——比如\
  \ `Facebook`——时，你允许你的个人数据被使用。你可以确定，所有的社交媒体公司都在追踪你所有的数据，而它们对这些数据能做的一切没有任何限制。\n\n\n\
  \n\n你经常会听到关于 AI 进展的各种乌托邦式的描述。那些引领 AI 革命的公司首席执行官和创始人不断出现在我们的手机屏幕、报纸和电视上，宣扬在不断演变的\
  \ AI 领域下，未来是多么美好。不用说，他们所描绘的美好未来并非没有限制。虽然这些公司很可能成为最大的受益者（尽管他们现在也是如此），但下放到到普通民众的利益预计范围将非常有限，特别是如果目前的权力趋势持续下去。显而易见，这些硅谷科技领袖已尽一切手段让权力依然集中在他们自己手中。这也不应该意外，因为无论别人如何说，到底与其说是关乎福利，不如说是关乎大钱。\n\
  \n埃隆·马斯克近期因收购 Twitter（以及其他事件）成为新闻，他是少数怀疑者之一。早在 Twitter 收购振兴去中心化社交媒体的讨论之前，马斯克于 2015\
  \ 年创立了非营利研究公司 `OpenAI`，以确保先进的 AI 在填满科技巨头口袋之前造全人类。在采访中被问及 AI 未来时，马斯克完美地重申了阿克顿勋爵的名言：“自由在于权力的分配，而专制在于权力的集中”（Elon\
  \ Musk Viral Videos, 2018）。在这次采访中，他坦言自己日益增长的担忧，即飞速发展的 AI 可能并不总是被用于善意，特别是当这艘船的舵掌握在少数权贵手中时。对于像马斯克这样正处于技术变革中心的人来说，这些担忧可能足以为我们其他人提供警示，再次提醒我们集权化的危险。在这些瞬息变化的情况下，想象一下区块链与\
  \ `AGI` 的结合能产生什么影响。区块链可以成为 AI 领域迅速蔓的集权化毒性的去中心化解毒剂。它可以从上上根除隐私侵入问题，并带给你两者的完美结合——高效的算法结合加密安全的个人数据。\n\
  \n请注意，正如区块链可以使参与者的机器学习体验变得更好，反之亦然。`AGI` 在区块链去中心化中也发挥着巨大的作用。事实上，一种结合区块链与通用人工智能（`AGI`）的去中心化模型可以利用更广阔的资源景观来推动发展。它们都可以帮助彼此在真正意义上达到最大潜力。\n\
  \n正如 `Sophia` 的情况一样，机器学习需要大量以及更高质量的数据，以便越来越准确地预测结果。区块链是这两者的绝佳来源。各已开始在许多领域利用这种结合。例如，在医疗领域，存储在区块链上的患者数据可以由人工智能模型进行分析，以揭示跨社区的模式，这些模式可以被用于设计医疗政策，甚至更好地管理护理模式。简而言之，区块链上的去中心化人工智能是你无法再忽视的趋势。`SingularityNET`\
  \ 就是这样一个由区块链驱动的 AI 网络。甚至有关于该平台与 `Cardano` 建立伙伴关系的讨论，以提供基于 AI 的区块链解决方案来应对全球范围的相关挑战。这个故事的道理是，`AGI`\
  \ 和区块链是一个不可阻挡的组合，随着这两者的共同成长，可以期待更多的升级。\n\n## 进入元宇宙 (Into the Metaverse)\n\n如果你对技术哪怕有一点点兴趣，那么你很有可能在最近听过这个术语：元宇宙。如果\
  \ Facebook 转型为“Meta”品牌还不够明显，那么是时候你深入挖掘一下了。这在未来几年中具有将去中心化推向另一个水平的潜力。但在我们深入之前，有一句警告——元宇宙仍然是一个非常新的概念，现在就用绝对肯定的语气讨论它可能为时过早。但目前的推测确实非常有趣。\n\
  \n如果你觉得元宇宙似乎是一个带有科幻色彩的晦涩概念，那么你实际上抓住了重点。这个概念实际上源于尼尔·史蒂芬森（Neal Stephenson）1992 年的一的小小说《崩溃》（`Snow\
  \ Crash`）。这确实证明了技术如何模糊虚构与现实之间的边界。当你玩在线多人游戏时，你已经在与地理位置之外的人进行互动，通过你创建的各种化身。\n\n但请记住，游戏不等同于元宇宙；例如，`Fortnite`\
  \ 有特定的游戏目标。还有你可以虚拟参加的演唱会活动。虽然 `Fortnite` 展示了元宇宙的某些方面，但它本身并不是元宇宙，至少不是我们想象中的那种类型。要被视为元宇宙，它的范围必须广得多。\n\
  \n就我们的目的而言，我们关注的是超越元宇宙娱乐和休闲方面的方面。正如我们预期的那样，区块链在元宇宙的某些方面被证明是特别方便的。\n\n*   **永无止的在线体验**：元宇宙将是持续且不断扩张的，就像我们生活的物理现实一样。这种体验将没有任何障碍，无论是个人还是职业，无论是私密还是公共。\n\
  *   **多个利益相关者**：想象一下我们的物理世界属于一个人或一个实体。这看起来像是个荒谬的想法，不是吗？我们生活在一个自由的世界，而元宇宙至少在理论上旨在复制这种自由，让多个贡献者共同创造一个自由移动的在线世界。\n\
  *   **互操作的经济**：这本质上意味着，尽管有各种贡献者聚集在一起，元宇宙将具有无缝的互操作性，创建一个功能完全的经济，买家和卖家都在在线平台上。\n\n\
  尽管元宇宙的细节目前很大程度上处于开发阶段，但我们知道的一点是，为了确保上述方面的顺利运行，元宇宙将成为一个巨大的数据收集器，可能比我们今天看到的社交媒体还要大。虽然社交媒体应用和游戏宇宙（如\
  \ `Fortnite`）是非常且针对特定平台的，但元宇宙预计将是全的。想象你的现实生活转化为虚拟现实：一个你可以在其中工作、买卖并与无论位置如何的人社交的虚拟空间——这就是对元宇宙最接近的描述。区块链可能是元宇宙所迫需要的内在数据安全协议。\n\
  \n此外，`NFTs` 或区块链的不可同质代币技术是区块链元宇宙的关键链接。想象你有两张 20 美元钞票。如果我拿走你的，并还给你四张十元的，你拥有的金额仍然相同。这意味着十元和二十元是同质的。然而，当两种商品具有无法准确比较的独特价值时，你拥有的就是\
  \ NFT。例如，如果我让你从家里挑一件对你最有价值的东西，你可能会挑一本朋友送给你的定制日记，而我可能会捡起我最喜欢的画。这两种价值完全是无法比较的。在某些情况下，你们可能会就如何衡量这些价值达成共识。例如，我可以说我可以以某个价格出售这幅画，但这必须经过双方同意，而不是物体本身固有的属性。\n\
  \n\n\n许多游戏平台已经在对游戏资产进行数字化处理，这些资产随后可以转换为加密货币。像 `Axie Infinity` 这样的游戏公司正在发展中国家运行着成功的商业模式，通过奖励和鼓励用户“边玩边赚”（play-to-earn）的概念。进一步，在区块链上创建此类数字资产的所有权和销售，对于一个超越游戏领域、更像我们不断扩大的生活范围的虚拟现实来说，具有革命性的意义。\n\
  \n考虑到目前对元宇宙（metaverses）的热热，多个玩家正投入资源创建他们自己的元宇宙，这并不令人意外。尽管在理论上，个人将能够通过单一身份穿于所有的元宇宙，但这似乎并不现实，因为不同的开发者会有不同的平台。\n\
  \n无论界面的形式如何，毫无疑问的是，将这种增强现实（AR）和虚拟现实（VR）平台与区块链相结合，可以帮助我们实现真正去中心化的未来梦想。人们最近才开始看到这种强强结合，科技巨头们已经在此投入了数十亿美元。这也是为什么像你我这样的普通人必须抛弃对区块链的无知的另一个原因，因为否则，区块链的未来也面临被垄断的风险。从根本上说，区块链、人工智能、元宇宙以及所有这些新兴技术都到了一个十字路口——一条路通向民主和去中心化的功能，而另一条则通向独裁和集中。我们需要理解这些配对是不可避免的，因为中心化不可避免会导致独裁，而去中心化则是民主的真正表达。\n\
  \n# 第二部分：这一切的政治与经济\n\n区块链技术并非产生于真空。在上一章中，你可能已经注意到这项技术具有某种政治上的争议性。在这一部分中，我们从货币的背景观察区块链，以及多年来演变的产生的经济和政治。特别强调了奥地利经济学和自由意志主义与区块链技术的关联性。在我们学习这一节时，你可能想记住那个“希腊灵魂侣”的类比，因为事实证明不止有一个灵魂侣。密码学是技术上的灵魂侣，奥地利经济学作为经济灵魂侣优雅地扮演了它的角色，而自由意志主义则是这项复杂精妙技术的政治灵魂侣。简而言之，你会发现它们完全是天生一对的。\n\
  \n# 第 4 章：释放自由市场\n\n大多数反对自由市场的论点，其根源在于对自由本身的缺乏信仰。\n\n> 米尔顿·弗里德曼\n\n几千年来，市场一直是人类的伴侣。自从人类开始定居以来，市场就应运而生——无论大小——以确保彼此实际上是陌生的人之间能够顺畅交换商品。在任何货币媒介发明之前，物物交换市场就已经运行得相当顺畅。无论是当地买卖双方访问的当地市场，还是来自远方土地商人访问的国际市场，似乎从古风时期起一直很繁荣。当然，本书的范围并不要求我们深入历史深处，但我想要表达的观点是，市场活动已经持续了几个世纪，而且似乎在没有任何行政系统干预的情况下，陌生人之间已经实现了完美的协调。\n\
  \n其主要原因是，这些市场完全是由经济学的供需原则驱动的。这些原则似乎足以在平衡被打破时随时恢复平衡。这正是自由市场的确切定义。自由市场似乎也一直很繁荣。\n\n\
  ## 自由市场 vs 权贵资本主义\n\n这种为了市场顺畅运行的自利观念，其明显的问题似乎是好得令人难以信。例如，这难道不会由于价格故意抬高而导致腐败吗？如果没有竞争，确实会。存在多个卖家争夺买家关注的事实，意味着他们中没有一个能越界剥削买家。这被称为“看不见的手”理论——自利与竞争的互补力量。\n\
  \n1776 年，被称为现代经济学之父的亚当·斯密出版了《国富论》，他在书中讨论了将成为讨论主题的话题。他认为，没有任何任何限制的自由贸易将带来更多的繁荣。\n\
  \n等一下，考虑一下——是什么激励了你上学？答案可能和人数一样多，但所有这些理由的核心都是自利。许多人似乎误解了这个概念，认为它意味着纯粹的贪婪，但这远非事实。现在，请理解这并不等同于自私，因为我们并不一定以别人的福祉为代价来寻求这种自利。在《国富论性质和成因探究》中，斯密这样描述：“我们期待晚餐，不是由于屠肉师、酿酒师或面包师的仁慈（善良），而是由于他们对自身利益的考虑”（Sanderson,\
  \ 2008）。换句话说，有人会说不存在无私的行为。作为人类，我们天生就会在考虑任何其他事情之前先考虑自己。\n\n你问，这一切是如何融入对市场的经济理解的？嗯，这确实很简单——当个人被留给根据自己的手段行动时，人们在一个服务于他们自利的经济中生产和消费商品。当一个卖家想要赚钱时，他们更有可能生产买家想要购买的商品，而且产出的质量良好。另一方面，买家因为有兴趣为高质量物品省钱，他们会趋向于满足这些条件的卖家。结果是，双方都获益了，而且整个市场系统都在积极的环境中运行。\n\
  \n\n\n\n尽管这两个部分具有理论价值，但对许多人来说，一个完全自发运行的市场似乎是不可能的。许多人看着这个国家过去几年发生的事情，便断言资本主义是行不通的。这从头到尾都是一个谬误。现实是，客户是王，这也是企业无论规模多大、权力有多大，竭一切让客户使用其产品的唯一原因。没有这一点，就没有真正的业务，没有资金产生，也没有了供我们分析的经济学。从本质上说，消费者掌握着经济发展方向的关键。以加拿大埃德蒙顿市一家名为\
  \ `[Re]Waste` 的公司的一项计划为例。创始人 Corey Saban 在向博蒙特市推介了一个塑料回收项目后，现在已与大麻行业的两家公司签署了重大合同。这种转变不仅受到高层管理理念的影响，在很大程度上也受到该行业消费者的影响。根据对\
  \ 15,000 多名消费者的调查，86% 45 岁以下的消费者表示他们愿意为可持续包装支付更多费用。当消费者的需求模式改变时，企业只能通过改变产品来顺应。这就是自由市场的魅力所在。\n\
  \n我知道你在想什么，“但是，这只是一个小公司，不是吗？！那些无所不能的大公司呢？”事实是，这些大公司并不像我们想象的那样无所不能。以 `McDonald’s`\
  \ 在 90 世纪的披萨实验为例。尽管 `McDonald’s` 长期以来一直是巨大的品牌，但消费者不想在快餐店等待食物的事实导致该特许公司遭受了巨额损失，以至于他们关闭了披萨炉。即使在最近，每当公司对自己的成功过于安逸时，消费者就会恰到好处给出及时的现实检查。想象一下，快餐公司为消费者提供健康选择以适应健康千禧一代生活方式的需求——这就是消费者需求到目前为止所做的，未来也将继续做的事情！\n\
  \n不要误解我，我并没有幻觉目前形式的资本主义对任何人有好处。它显然和它的社会主义对手一样功能失调。这就是为什么我们需要理解自由市场资本主义与权贵资本主义之间的区别。自由市场资本主义本身意味着将权力赋予买卖双方；而权贵资本主义将权力交给了少数亲信或可能与政府关系良好的大企业集团。在过去的几年里，我们看到这种游说集团式的权贵资本主义在全球范围内发生了恶性转变，从中国到俄罗斯，甚至是美国。\n\
  \n在这些许多地区，这种与共产主义混合的权贵资本主义以最微妙、渐进的方式给普通人带来了灾难。一种始于概述资本主义罪恶的意识形态最终走上了同样的道路，但方式非常不同。以印度的纳萨尔派运动（Naxalite\
  \ movement）为例——权贵资本家与共产主义武装团体之间的持续战争只导致了无辜、无助村民的流血。这只是这种光谱两端变得如此丑陋的一个例子。\n\n大多数人根本没有意识到，这与自由市场资本主义毫无关系。政府显性及隐性干预的缺失在这里产生了本质区别。长期以来，人们在这些极端意识形态之间摇摆，除了像棋子一样被操纵别无选择。历史上第一次，我们有了第三种选择。区块链可以帮助我们促进一个本应是、真正自由的市场经济。但普通大众必须快速行动，因为如果我们不这样做，我们就面临区块链被我们正试图逃避的意识形态所取代的风险。\n\
  \n## （市场）垄断游戏\n\n贪婪是人类状况中不可分割的一部分。苏格拉底说：“不满足于现状的人，对于他想要拥有的也不会满足。”（Socrates Quotes,\
  \ n.d.）。尽管有这种智慧，但难道我们没有发现自己总是想多要一点吗——多吃一口蛋糕、多睡一分钟美妙睡眠、多一次升职等等？我们都以自己的方式表现过贪婪。面对现实吧——邪恶在人类中并不罕见。我们都有阴暗面，我们都会失足。但是，当这种小小的个人贪婪变成组织性的贪婪并影响数百人的生活时，会发生什么？\n\
  \n市场垄断无疑是剥夺人民权力的中心化最邪恶的表现。垄断允许组织巨头影响产品价格到这种程度，至于它们可以限制新玩家进入市场。市场之所以运作是因为它是一个公平交易的地方，但垄断市场通过用自满取代竞争而剥夺了这一点。这除了让那些富得离谱的人更有钱之外，让穷人完全被排除在方程之外。\n\
  \n以南非 `Eskom` 的惨剧为例。这家电力公司在近一个世纪的时间里一直是电力部门的垄断者，但这个华丽表象下的裂纹已无法隐藏。长期以来，该机构一直被作为政府与企业结合最符合经济利益的典范。许多人认为，当它从\
  \ `Escom` 变为 `Eskom` 时，终结就开始了下坡之旅。当然，正如弗雷德里克·巴斯亚特（Frederic Bastiat）在其著作中所描述，这是根据短期结果而非长期后果来判断形势的逻辑谬误的完美例子。\n\
  \n简之，该组织的垄断结构从一开始就注定失败。当你应用奥斯利派经济学的原理时（我们将在本章稍后部分详细讨论），你将完全理解我的意思。奥斯利派经济学对价格在经济中的性非常明确。作为国家控制的垄断，`Eskom`\
  \ 注定失败，因为它无法根据需求模式调整价格。\n\n## 专利 VS 开源技术\n\n比尔·盖茨对专利有独特的看法。他说：“如果人们在发明今天的大多数想法时就能理解专利是如何授予的，并申请了专利，那么现在的行业将陷入完全停滞。”（Lee,\
  \ 2007）。如果比特币的创造者对加密货币和区块链技术申请专利，他们将钱如贯水，我们甚至不会在这里谈论这些。关于专利的冲突观点几乎和专利存在的时间一样长。不同的人对此此可能持有不同的立场，但没有人能否认的是专利消耗了大量的资源（诚实地说，专利支持者不同意这些资源完全可以用于许多更好的地方）。了解专利是有用的，因为它们可能帮助我们揭开垄断的谜团。\n\
  \n\n\n\n随着人们对技术的接触日益增加，以及技术给人类生活带来的巨大改进，专利与开源之间的争论在近几十年中变得日益突出。知识产权已成为一颗地雷，只要你稍有不慎，它就会在你面前引爆炸。那么，你问我在这场辩论中站在哪一边呢？嗯，正如你现在可能猜到的，我支持一切能增加我们自由和创新的事物，并将始终反对任何限制这些事物的。而且，你可能也猜到了我的倾向所在。但，仅仅选边对我们来说没有帮助；我们需要理解在垄断市场背景下，这两者分别扮演的角色。\n\
  \n“专利”是一个反复无常的词，企业家和创新者正被系统深受其苦。据说，专利是为了保护发明，使得在预定的期间内，只有发明者本人而非而非可以使用可以使用、销售或修改该发明——无论是产品还是过程。任何侵犯发明者领地的人都会受到法律惩处。尽管\
  \ `Gates` 曾说过，硅谷所有生产你手机、小设备等等的大型科技公司每天都在提交专利，或者面临专利诉讼。\n\n诚然，从理论上讲，专利为发明者提供了坚实的保护，并确保发明者能为其付出的所有努力获得回报。然而，现实可能会让许多寻求专利的投资者感到惊讶。这个系统是太糟糕了，以至于这些预期的受益者可能也发现它毫无帮助。这是因为所谓的“专利流氓”。这些人获取专利并没有开发产品的真实意图。当发明者真的生产出某种东西时，他们会发现自己陷入了陷阱，必须通过战斗来合法地获得他们自己产品的权利。要理解，诉讼并非易事；它需要大量的金钱、时间和精力。现在，你认为谁拥有这种冗长诉讼所需的资源——是一个已经赚入数百万的大型企业，还是一个手段拮据的个人？不幸的事实是，很多时候，个人投资者在竞争中被挤出，得到的报酬极少或是一无无获。而且，垄断性企业不仅生存了下来，而且还在蓬勃发展。\n\
  \n许多人会认为这是一种对世界的悲观观点——毕竟，专利也造福过个人发明者？是的，我上面描述的绝非适用于所有情况的概括。因此，我的下一个论点随之而至。假设发明者避开了复杂的法律问题，获得了他们想要的专利。虽然专利对于寻求专利的个人来说可能非常好，但它们对整个行业造成了巨大伤害。2014\
  \ 年，`Tesla Motors` 发布了其所有的电动汽车专利。这为电动汽车行业发挥了巨大的推动，而我们在过去七年在技术以及基础设施方面看到的环保创新是令人惊叹的。如果这家公司有数十名律师来保护这项技术的专利，这还可能实现吗？不，至少在未来的很长一段时间内是不可能实现的。\n\
  \n另一方面，考虑专利对非洲国家获取药物的影响。一家可能正在生产关键药物的公司可以阻止其他公司制造它，从而批判性地限制了该产品在市场上的可用性。该公司可以收取任何他们想要的价格，进一步限制了贫困大众获取药物的机会。（注：此处原文存在大量重复句子，已根据核心内容进行清理）一家可能生产关键药物的公司可以阻止其他公司制造它，从而批判性地限制了该产品在市场上的可用性。尽管知识产权受世界组织（`World\
  \ Organization`）《贸易有关知识产权协定》（`TRIPS`）的监管，该领域仍有许多冲突。专利往往不仅促进个人利益，还会导致贪婪，从而促进了对市场某部分的垄断。在其他因素中，这为新竞争者构成了巨大的进入障碍。有了区块链，声誉和信任因素消失了，因为区块链交易本身促进了“无须信任的信任”。例如，一个拥有好产品将收到好评；其他用户可以确定这些评价（无论好坏）是可靠的，且不会像其他那样被操纵或删除。注意，某些区块链采取了更具保护性的版权方法。避开这些，因为这种保护性的私有化方法违背了真正意义上的去中心化原则。\n\
  \n许多人会认为这是一种对世界的悲观观点——毕竟，专利也造福过个人发明者？是的，我上面描述的绝非适用于所有情况的概括。因此，我的下一个论点随之而至。假设发明者避开了复杂的法律问题，获得了他们想要的专利。虽然专利对于寻求专利的个人来说可能非常好，但它们对整个行业造成了巨大伤害。2014\
  \ 年，`Tesla Motors` 发布了其所有的电动汽车专利。这为电动汽车行业发挥了巨大的推动，而我们在过去七年在技术以及基础设施方面看到的环保创新是令人惊叹的。如果这家公司有数十名律师来保护这项技术的专利，这还可能实现吗？不，至少在未来的很长一段时间内是不可能实现的。\n\
  \n另一方面，考虑专利对非洲国家获取药物的影响。一家可能正在生产关键药物的公司可以阻止其他公司制造它，从而批判性地限制了该产品在市场上的可用性。该公司可以收取任何他们想要的价格，进一步限制了贫困大众获取药物的机会。知识产权受世界组织（`World\
  \ Organization`）《贸易有关知识产权协定》（`TRIPS`）的监管，该领域仍有许多冲突。专利往往不仅促进个人利益，还会导致贪婪，从而促进了对市场某部分的垄断。\n\
  \n开源运动以这种开源模式运作，专业人士聚集在一起并汇聚他们的知识以造福社会。一个这样的平台是 `Github`，它汇聚了数百万开发者进行贡献。简单来说，专利方法想要保护利润而非创新，而开源则允许保护创新。\n\
  \n## 政治辩论\n\n垄断困境的逻辑延伸必须进入政治领域。垄断在经济中繁衍的一种常见方式就是我们之前讨论过的权钱资本主义。因此，如果不理解围绕这一问题的政治意识形态，下一章关于经济影响的讨论将是不完整的。我们已经触及了权钱资本主义以及我们接触过的各种共产主义意识形态，它们都以牺牲他人的生命为代价来标榜自己的优越性。自由主义为这个古老的问题提供了一个真正优雅的解决方案。\n\
  \n\n\n\n我的几位政治狂热者很快就会将自由意志主义贴上一种极端的、威权的意识形态，认为它只煽动对体制的反叛。事实大不相同。沃尔特·威廉姆斯（Walter\
  \ Williams）用简洁的方式将这种意识形态置于政府背景之下。他说：“我们的宪法中没有一句话规定政府是权利的授予者。相反，政府是权利的保护者”（Walter\
  \ E. Williams Quotes, n.d.）。与误导性的流行观点相反，自由意志主义并没有否定政府的地位；而是将政府置于服务位置，而不是统治位置。我只是许多自由意志主义者之一，我们坚定地坚持一个观点：宪法本质上是反集权化的，而不是我们被迫使相信的那种宣传——即它将所有权力交给了政府。\n\
  \n自由意志主义可能是一个难以理解的概念，特别是在经济挣扎的国家。当你将亚伯拉罕·马斯洛（Abraham Maslow）的需求层次理论应用于这些国家的人的生活条件时，并不难理解为什么自由理念没有像发达国家那样获得同样的动力。通过让大众忙于生活的物质层面，政党对人民施加了不公平且剥削性的做法，甚至在他们的欺骗中取得了成功（直到最近）。以西非为例，长期以来，政治家让他们的选民相信社会主义最符合他们的部落传统。以此为前提，国家政府通过价格控制、外资公司国有化、集体农业等手段宣扬其主导地位。这种政治运动的结果是，尽管非洲拥有世界上最丰富的自然资源，但在社会经济增长方面仍然是最低的。\n\
  \n在过去的几年里，非洲人民才意识到他们自己的力量，并发现了通往繁荣的自身道路。非洲国家对政党和领导层日益增长的不满和不信任已显而易见，至于他们正将创业（包括区块链和加密货币）视为出路，而不是国家干预。当然，值得注意的是，我们所所知的自由意志主义运动可能无法缓解世界其他地区的担忧，其分类也可能大不相同。但令人着迷的是最近在非洲大陆形成的自由意志主义思想的核心。\n\
  \n至关重要的一点是，自由意志主义并不是没有规则。并不是说在这一准则下，人们可以随心所欲地行为。相反，自由意志主义只在尊重其他个人权利的情况下，维护个人追求自身幸福的权利。自由意志主义者将其称为法治，这无非是对通过审议而非任意命令所发展出来的法律理念的尊重。这就是那些一心想要抹黑自由意志主义运动的媒体忘记提到的这一点。自由意志主义者被描绘成痴迷自由的激进分子，他们旨在瓦解社会秩序，但实际上情况恰恰相反。\n\
  \n区块链现在向世界证明，自由意志主义思想并非虚构，而是实际上可以通过可行且可持续的技术付诸实践。想想——区块链传播了自由意志主义的核心原则：消除国家干预、维护平等以及赋能弱势群体。当然，在这个方程式中，奥地利学学的另一个主要方面也值得像其他一切事物一样受到详细关注。\n\
  \n# 第 5 章：经济影响\n\n人类本身是每个经济体的起点和终点。\n\n- 卡尔·孟格（Carl Menger）\n\n当前的全球经济体系留下了许多区块链正准备填补的空白。普华道会计师（PricewaterhouseCoopers）2020\
  \ 年的一项调查显示，到 2030 年，区块链可以使全球国内总值（`GDP`）增加 1.76 万亿美元。如果这些统计数据可信（即使只是部分可信），你能想象区块链的规模有多大吗？尽管不需要成为经济天才就能理解这些数字中令人惊叹的美感，但在尝试理解区块链融入经济的更微妙方式时，你可能需要掌握一些基础知识。\n\
  \n正如奥地利经济学派创始人在上述引言中所正确指出的那样，人力资源是任何经济体最重要的决定因素。但长期以来，在“这些事情太复杂”的流行观念下，普通人被隔绝在经济运作之外。即使是我们的学校课程，在需要像对待数学、生物学和其他所谓的科学那样以同样的热情（甚至更高）来对待它时，也方便地将其遗漏了。虽然经济学是复杂的这一观点可能有一丝事实依据，但事情并没有被描述得那么复杂。我们将揭开这一切的神秘面纱，并置于区块链的背景之下。\n\
  \n几个世纪以来，经济学家一直试图从价值交换的角度来理解人类行为。数百年的经济人类行为经验告诉我们，人类喜欢降低交易的不确定性，以及降低我们交易对象的不确定性。诺贝尔奖得主、道格拉斯·诺斯（Douglas\
  \ North）、新制度经济学的创始人认为，在整个历史上，我们一直依赖制度来降低这种不确定性。在我们经济历史上第一次，我们有机会将对制度的盲目信任从方程式中取出，并建立确定的交易，因为这些交易不是通过中介机构，而是通过像你我这样的人验证。这就是为什么理解区块链的经济影响对我们来说很重要，因为它们不断降低我们交易中的不确定性。\n\
  \n## 理解货币\n\n货币无疑是人类创造的最迷人的构造之一。它不仅仅是一张纸，更是一套复杂的信念、态度甚至情感的集合。大多数时候，我们似乎只看经济价值，完全忽略了这一独特实体的心理社会属性。但在经济讨论中，你可能会问，经济定义是否更有效？嗯，根据我的经验，未必如此。人类见证过的任何产物，几乎没有哪一种是在没有人类参与（包括物理和情感上）的情况下被完全理解的。因此，如果我们想完全理解货币，将人类感知从货币的构造中排除在外将是愚蠢的。\n\
  \n\n\n\n\n我敦促你在此时问问自己：金钱是什么？在很大程度上，取决于你的成长环境，你对这个问题的回答可能大然不同。有些人可能认为金钱是对辛勤工作的应当回报；另一些人可能认为金钱是通往自由的门票。但是，尽管对金钱有这种亲近，但往往存在冲突。在极其渴望金钱的同时，也担心它会腐败。特别是如果你在一个贫困的家庭长大，你肯定在成长过程中至少听过一次“金钱是万恶之根源”。在光谱的另一端，如果你在一个富裕家庭长大，那么很有可能金钱仅仅被视为一种自然存在的方式。对金钱这种夸大的负面观点，还是轻视化的理所当然的态度，都可能导致显著的行为表现，并最终演变成严重的经济态度及后果。\n\
  \n让我们谈谈“金钱是万恶之根源”这一谬误。无论你属于哪种政治意识形态，你可能在某种程度上受到社会主义理想的影响，在这些理想中，我们倾向于从道德和理想的角度来看金钱，而不是从事实和实务的角度。给金钱赋予人类的善恶属性是相当毫无意义的。话虽如此，金钱必须是历史上最伟大的发明，因为它代表了交换媒介。没有它，就没有贸易、没有生产、也没有增长。你周围看到的繁荣——每一件让你的生活变得便利舒适的事物——最初之所以产生，是因为生产者知道他的努力将通过这种媒介得到公平的回报。将金钱称为邪恶的根源是极不合理的。\n\
  \n我们经常被（某种程度上含蓄地）告知，赚钱和富有在某种程度上与人文主义价值是对立的。事实绝非如此。如果没有适当的交换媒介，能够产生价值和美德的人类文明从根本上就不可能存在。当你在这个背景下考虑亚伯拉罕·马斯洛的需求层次理论时，你会发现，如果不满足食物、住所、安全等生理需求（这些都是交换媒介的结果），你永远无法在美德和价值的情感成长上进步。没有钱，我们可能仍然是流浪的野蛮人，到处狩猎游荡，寻找一个能有安全感的洞穴。\n\
  \n可能需要澄清的一点是，我们在这里所讨论的金钱并不一定是具有任意值的法定货币。我们将在稍后的章节中讨论这个问题。从历史角度理解的金钱是一种价值载体。这种价值载体不能被定性为邪恶。如果我们这样做，也是为我们人类在数千年来所奋斗的整个经济、社会和政治历史贴上了不道德的标签。\n\
  \n阿涅·兰德的《肯定的耸耸》（1957）在这方面提出了一个非常有服力的论点。如果你还没读过，我强烈建议你读读这本书——这是一本大书，但如果你没有时间，至少去\
  \ YouTube 上听听“弗朗西斯科的金钱演讲”。我保证它会让你大为震撼。这段演讲中有一句非常有力量的话：\n\n> 当金钱不再是人与人交易的工具时，人就变成了人的工具。血液、鞭子和枪支——或者美元。做出你的选择——别无选择——你的时间已经不多了。(Goldsilver\
  \ with Mike Maloney, 2014)\n\n## 凯恩斯主义者、货币主义者与奥地利学派\n\n米尔顿·弗里德曼曾有一句名言：“我们现在都是凯恩斯主义者”\
  \ (Burman, 2007)。为了理解这句话的细微差别，我们必须回溯并至少简要理解一下这一理论。只有当我们将这一理论与奥地利学派理论进行对比时，才能理解它们对区块链技术的未来分别意味着什么。\n\
  \n让我们从开始开始。我确定你听过 `macroeconomics`（宏观经济学）这个词，这个词的长度足以让人想掉头逃跑！但实际上，`macroeconomics`\
  \ 仅意味着对国家层面的经济行为的研究，区别于 `microeconomics`（微观经济学）：后者研究的是更个人或群体层面的经济行为。正如你可能猜到的那样，宏观的理解比微观的理解要重要得多。同样重要的是，奥地利经济学派并不一定认同这种宏观和微观的划分（稍后会详细介绍）。现在，让我们把对\
  \ `macro` 和 `micro` 变量的宽泛理解留在讨论的背景中。\n\n那么，让我们来讨论 `macroeconomics` 吧！数百年来，经济学家们对于国家经济如何运作，或者它们应该如何运作以实现最优产出提出了不同的观点。乔治·伯纳德·肖曾幽默地说道：“如果把所有的经济学家并排放在，他们也得不出结论”\
  \ (George Bernard Shaw Quotes, n.d.)。仿佛为了证明他是对的，随着时间的推移，出现了许多理论，每种理论都自认为优越；但在这里，我们将关注凯恩斯主义、货币主义和奥地利学派模型，看看它们在当前全球经济背景下表现如何。现在，我想让你明白，我不装自己是经济专家，但在过程中我学了一些东西，我相信这些对于宏观理解经济中的区块链至关重要。\n\
  \n尽管凯恩斯主义、货币主义和奥地利学派的经济争论已经持续了几个世纪，但最近的银行政策比以往任何时候都更有意义。由约翰·凯恩斯创立的凯恩斯经济学将总需求视为经济的核心。凯恩斯主义者强烈主政府干预，以缓解衰退、通货膨胀和其他市场失灵的影响。他们认为，当政府通过增加支出和降低税收调整财政政策时，将在刺激大众需求方面发挥作用，鼓励他们增加支出，从而为经济增长做贡献。这长期以来一直是大多数理解国家经济增长的方式。\n\
  \n货币经济理论提供了一个非常类似的视角，尽管这个学派声称提出了一个相当对立的观点。与凯恩斯主义观点相比，这种观点主张一种稍微被动的方法，他们认为政府应该只控制进入经济的货币流，其他部分会自动修复。因此，他们本质上是认为政府并不一定需要干预来推着买家去买更多（正如凯恩斯学派建议的那样），而是应该操纵货币流动并等待拼图对位。将经济想象成一辆启动遇到问题的汽车——货币主义司机比任何事情都更关注加油箱，而凯恩斯主义者会更关注启动发动机。\n\
  \n\n\n\n对于局外人来说，这两种理论代表了某种政府行为，目的是人为诱导市场行为，似乎是为了“解决”当前的问题。第三种有趣的学派是奥地派经济学。正如我之前提到的，奥地派经济学并不遵循宏观/微观经济模型。相反，奥地派经济学家认为个人和群体经济行为之间竟然如此疏远是非常奇怪的。例如，宏观层面的经济学家往往完全不知道动力、健康等微观经济元素是如何结合在一起的。一个在这两个水平上保持一致、并且实际上是将这些较小的碎片整合成宏大蓝图，而不是痛苦地将它们分开的理论，难道不是更有意义吗？\n\
  \n奥地派经济学家对市场危机采取了相当放任（Laissez-Faire）的方法。他们坚信最小限的政府干预，并假设市场倾向于经历自己的生命周期，自动调整以应对危机。这种意识形态基于物品主观价值的核心理念。他们所说的主观价值是指每个物品的价值取决于它所满足的主观需求和欲望。而且，该物品的易得程度或稀缺程度将决定其被使用的效率。例如，一个生活富足、衣食无忧的家庭比其贫困的对手倾向于扔掉剩下的面包，后者在分量上必须非常节约。因此，在食物短缺的地方，剩余面包的价值会比在食物充足的地方高得多，而且使用效率也高得多。\n\
  \n由于消费者行为直接取决于基于产品可用性的感知价值，因此存在一种内在机制来处理供需循环。但，每当像国家这样的外部实体干预这一过程时，整个平衡就付之脑后了。这在巴西经济的崩溃中得到了充分证明。多年来，特别是自\
  \ 2008 年危机以来，巴西见了日益增加干预色彩的经济政策。以汽车行业为例，政府提供了大量的补贴，这导致了人为扩张的繁荣衰衰周期，对整体经济产生了重大的负面影响。对这种现象的不满现在正导致巴西的话语体系向奥地派方向转变。\n\
  \n货币理论还有另一个分支被称为现代货币理论（`MMT`）。其支持者之一的斯蒂芬妮·凯尔尔恩（Stephanie Kelton）反驳了奥地派思想中宏观/微观经济界限的模糊化。她提出，家庭在经济上的运作方式不能与国家相同，因为家庭没有创造货币的权力。关于创造货币权的假设似乎是\
  \ `MMT` 与奥地派学派之间许多核心意识形态差异之一。这个假设决定了一切，因为如果山姆叔（Uncle Sam）可以随心所欲创造货币，那么国家经济负债多少或国家有多少财政赤字又有什么关系呢？\n\
  \n这是一个诱人的想法，不是吗？几乎好得令人难以置信？如果看起来是那样，那是因为它确实如此。奥地派经济学通过 `MMT` 反驳了这种“爱丽丝梦游境”的世界。如果\
  \ `MMT` 被字面接受，那么那些几个世纪以来困扰国家的所有恶魔——通货膨胀、破产等等都将只是完美的想象词汇。然而，现实是，这些并不是想象，而且长期以来一直困着我们的社会。奥地派经济学通过澄清这一点支持支持：`MMT`\
  \ 的政策处方可能导致资本结构的萎缩和整体经济的停滞。\n\n## 法币惨剧（The Fiat Fiasco）\n\n好了，既然我们刚刚上了一节微型的经济学入门课程，现在呢？这如何帮助我们的区块链讨论呢？这个问题的答案在于我喜欢说的“法币惨剧”，它将我们这里讨论的经济、政治和区块链要素全部整合在了一起。是的，目前看来我们似乎在讨论一些我喜欢的随机话题，但你很快就会发现，法币是完成拼图的缺失环节。\n\
  \n奥地派经济学直面法币货币的牛角。。要理解的是，法币的基础建立在所谓的中央银行系统之上。这并不是秘密，`MMT` 确实对的一点是，国家对货币生产拥有垄断，而中央银行系统依赖国家批准的金融机构来传播这种垄断。然而，对于奥地派经济学家来说，法币或纸币只有一个功能：作为交换介质。事实上，他们甚至认为法币对于一个运行良好的经济并不是必不可少的。相反，奥地派经济学家坚信法币带来了集权主义邪恶，而我们完全可以不需要它。\n\
  \n奥地派经济学家一直支持由商品支撑的交换介质。因此，像金本位这样的东西将非常符合奥地派的观点。从这个角度来看，很容易看出为什么法币会产生问题。让我们回到最喜欢的\
  \ 2008 年崩溃案例。但首先，回答这个问题：你预计在这次崩溃后银行业会发生什么？不需要火箭科学家也能猜到，由于所有坏贷款，银行业会或或少地发生崩溃。但是，你知道实际上发生了什么吗？银行总资产在\
  \ 2010 年实际上增长了 18.4%（Polleit, 2010）。这是因为联邦储备储恰好做了 `MMT` 所建议做的事，向银行提供了大量资金以防止其崩溃。\n\
  \n虽然这看起来可能是一个可行的方案，但这种扩张货币供应的注入对经济可能是灾难性的，并会创造我们之前提到的那种繁荣衰衰周期。要让法币经济达到平衡几乎是不可能的，因为它完全没有内在价值，它被视为货币仅仅是因为大家都接受它作为货币。相比之下，当货币与金本位挂钩时，政府不能挥挥魔杖就变出新货币；他们必须购买额外的黄金。因此，即使银行进行了欺诈交易，他们最终也必须根据可用黄金进行对齐，系统最终会自我修正以回到最初理想的平衡。简单来说，法币长期以来给我们的经济造成了不可弥补的损害。\n\
  \n## 良好货币的替代方案（The Sound Money Alternative）\n\n在和你们讨论加密货币之前，我们需要更多地讨论奥地派经济学家所说的“良好货币”（sound\
  \ money）概念。正如上一节所示，奥地派经济学家讨厌政府控制货币供应的想法。如果你稍微关注全球经济新闻，你可能就能看到这一理论的价值。几十年来，我们共同见证了各国政府通过操纵资金流将经济陷入混乱。当混乱变成普通人生活水平不可避免的下降时，同样的政府（政党可能不同）会通过进一步操纵已经挣扎的资金流，用对未来的虚假承诺来诱导大众，其唯一目的是为了赢得选票。\n\
  \n\n\n将其想象成一个人可能陷入的酒精成瘾循环。在起初，酒精让他感到轻盈和快感。但，随着最初的快感消退，留下的是迷失了方向的身体、内疚的心灵和财务负担。当所有这些缺陷带来的挫败感不断攀升时，尽管再次沉浸在酒精中可能极具诱惑，但这绝不是解决方案。度过艰难的戒断症状确实对那个人有益良多。\n\
  \n本质上，奥地利派学者认为，当货币供应保持不变时，尽管即时消费可能会受到限制，但长期储蓄将会增加。想象一个你的货币价值增加而不是减少的世界。如果你知道这将会发生，你是想在今天把钱都花光，还是把它存到未来，让它在那里为你获得更高的价值？另一方面，价值随时间推移而下降的货币（正如我们目前社会的情况），会导致一种\
  \ `YOLO`（人生只有一次）的心态，无论成本如何，都鼓励挥霍的消费主义。\n\n从业务角度来看，货币的升值还将减少对某些项目的错误投资，这些项目仅在通胀期间会给人一种增长的幻象。如果通胀下降，这些项目将立即变得无利可。简单来说，投资者只会投资于长远来看能够盈利的项目，而不是落入短期利润幻象的陷阱。\n\
  \n1972 年，斯坦福大学的教授 `Walter Mischel` 通过简单的棉花糖实验证明，能够延迟满足的孩子与不能这样做的孩子相比，倾向于拥有更健康、更快乐、更成功的生活。奥地利派经济学几十年前、甚至几个世纪前就为经济得出了同样的逻辑。然而，我们现在仍然在每一个机会都尝试重新发明轮子，却仍然得出了更多错误的解决方案：不健全的货币。\n\
  \n在全球范围内，这种不健康的货币也凸显了许多问题。由于它必须经历转换的烦恼，它赋予了某些转换率高于其他经济体的隐性权力。这导致了多次贸易冲突，不可避免地导致了战争和损失。想象如果有一种全球货币，你可以在不受国界限制的情况下使用。这具有潜力根除许多目前的全球冲突。\n\
  \n那么，健康的货币需要具备抵消不健康的法币货币带来的邪恶的特征，其中最重要的一个是跨时间的稳定性。尽管健康的货币随着时间推移而升值，但这种升值并不是由人为因素突然带来的。健康的货币需要的另一个特征（而目前的法币并不具备）是不可毁灭性。加密货币毫不费力地承担了这些功能，因此成为当代奥地利派经济学家的喜爱。然而，对他们最有吸引力的特征是，这种全球货币是去中心化的，没有限制政策形式的政府干预。我们将在稍后详细讨论加密货币，但现在，理解它们所提供的完美过渡是必要的——从当前经济中盛行的缺陷法币货币体系，到从未来面对我们的健康货币理论。\n\
  \n## 加密货币困境\n\n长期以来，“加密货币”一词与著名（且臭名昭著）的 `Bitcoin` 同义化。在 2010 年的某处，一位名为 `Laszlo Hanyecz`\
