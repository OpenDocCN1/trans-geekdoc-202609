    # 5.5. A case study


    In this section, we use a specific case study to demonstrate the reliability of
    the LNFS framework.


    # 5.5.1. Step 1: embedding


    The label data of the location is processed into a word vector. The data we use
    includes the user-location data pairs shown in Table 1, and each data pair indicates
    that a user has checked in once at a certain location. And the users will leave
    comments in their check-in positions. The location-labels data is shown in Table
    2, which represents all user-added labels received at each location. We transform
    all label information into a 300-dimension vector through FastText for subsequent
    processing, which is shown in Table 3.


    # 5.5.2. Step 2: label noise filtering


    For the location $v_t$ with more than 3 labels, we need to select the most representative
    label. Therefore, we use (1) to find the similarity between all the label vectors
    of $v_t$. The similarity matrix of $v_t$ can be obtained. Then, each row of the
    similarity matrix is added to get the eigenvalue of each label, and the label
    with the largest eigenvalue is the unique label of $v_t$. Finally, Fig. 6 shows
    the label noise filtering process. Then, the attackers add malicious labels, and
    the LNFS model performs label noise filtering. The performance of the model is
    optimized by the game between the model and the attackers.


    # 5.5.3. Step 3: missing label supplement


    Each location contains comments left by users. For location $v_t$ without a label,
    we find a similar location by judging the similarity of comments, and use the
    label of the similar location to supplement the location without a label. In addition,
    for the location with two labels, the similarity between the two labels is the
    same, so a unique label cannot be found by calculating the eigenvalue. We first
    use the similarity of comments to find a label of the similar location, and then
    use the label filtering method to select a unique label. Finally, Fig. 7 shows
    the missing label supplement process.


