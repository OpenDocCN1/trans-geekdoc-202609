    $f_i = \sigma(W_f \cdot [h_{t-1}, x_t] + b_f)$ (1)

    $i_t = \sigma(W_i \cdot [h_{t-1}, x_t] + b_i)$ (2)

    \(\bar{C}_t = \tanh(W_C \cdot [h_{t-1}, x_t] + b_C)\) (3)

    $C_t = f_t * C_{t-1} + i_t * \bar{C}_t$ (4)

    $o_t = \sigma(W_o[h_{t-1}, x_t] + b_o)$ (5)

    $h_t = o_t * \tanh(C_t)$ (6)


