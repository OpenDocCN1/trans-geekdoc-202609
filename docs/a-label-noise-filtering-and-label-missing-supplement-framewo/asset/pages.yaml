    # 3. Motivation


    In the Location-Based Social Network (LBSN), users often check in at different
    locations. For example, users will mark the restaurant they have been to, and
    leave their comments about the restaurant. As shown in Fig. 1, user 1 gives a
    comment “Try the taro flavor, it’s refreshing way to end a meal; Super delicious”
    after eating in an English restaurant, while user 2 who likes lounge bar gives
    a comment like “Preferably at the back corner of the bar where you can have a
    good view of the entire room”. In addition to leaving comments on the restaurant,
    LBSN also provides the function to give labels on restaurants to facilitate the
    user retrieval. In Fig. 1, the location accessed by user 2 has four labels, while
    the location accessed by user 4 has no label. Users can take the initiative to
    label the restaurant as they think, therefore location labels are subjectively
    added by a variety of users and there may be malicious users who deliberately'
