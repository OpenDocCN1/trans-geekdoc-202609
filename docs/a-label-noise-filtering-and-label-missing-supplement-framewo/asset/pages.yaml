    It can be seen from the figure that location 1 has three different labels. If
    user 2 adds an erroneous label "happy hour" to location 1, other users may not
    be satisfied when searching for location 1 according to the erroneous label. And
    location 2 has no user to add labels. This situation will lead to the situation
    that some labels are accurate, while some labels are redundant or inappropriate.
    There are also some locations that are not labeled by users. It is a serious obstacle
    for users to search a location accurately. At present, there are few studies on
    location label noise filtering in LBSN.


    To solve the above problems, we propose a framework of label noise filtering and
    missing label supplement. (1) We assume that the label most similar to all other
    labels in the location is the most representative. For each location with redundant
    labels, cosine similarity is used to calculate the similarity between each label
    and all other labels, and then the sum of similarity is used as the feature of
    the keyword. Finally, the largest label of all features is taken as the label
    of the location. (2) For locations missing the label, we use the user’s comments
    to find a similar location by judging the similarity of comments, and then use
    the label of the similar location to assign a label to the location. (3) To optimize
    the performance, we apply the evolutionary game theory to our scheme. By continuously
    increasing the label noise and performing corresponding noise filtering, the proposed
    model is optimized.


    # 4. Preliminaries


    # 4.1. Problem formulation


    Users U = {u1, u2, ..., uM} will visit different locations V = {v1, v2, ..., vN}
    and post their comments Cv = {c1, c2, ..., c0} ∈ C. The comments often imply the
    users’ attitude towards the locations. For different locations vi ∈ V, users will
    label them subjectively with Lv = {l1, l2, ..., lQ} ∈ L. In particular, M, N,
    O and Q refer to the total number of users, locations, comments and labels respectively.
    However, the user’s subjective labeling of locations leads to the decrease of
    the reliability of labels. Some location labels are accurate, which is conducive
    to other users’ retrieval. Meanwhile, some labels are added by users arbitrarily,
    which will mislead users’ search results. Still, some locations have not been
    labeled by any users, which is also not conducive to being retrieved by other
    users.


    **Definition 1.** Label noise filtering: We need to select a unique label for
    each location vj ∈ V (1 ≤ j ≤ N), i.e., for each label lk ∈ L (1 ≤ k ≤ Q), if
    k ≥ 2, it is proved that there is noise. We need to identify and delete the location
    labels.


    **Definition 2.** Label supplement: For locations without labels, i.e., lk ∈ L(k
    = 0), we need to find similar locations according to the users’ comments between
    locations, and use labels of similar locations to supplement the label for locations
    without labels.


    # 4.2. FastText


    Informal discussions on social platforms have accumulated a large body of knowledge
    in the form of natural language text [39]. For example, text descriptions can
    be used to mine and create compatible mashups [40]. There are many ways to represent
    the text, such as Term Frequency-Inverse Document Frequency (TF-IDF) and TextRank
    based on one-hot encoding [41], Latent Semantic Analysis (LSA) and Latent Dirichlet
    Allocation (LDA) based on the topic model [42], and fixed representation based
    on word vectors, such as world2vec [43] and FastText [44]. One-hot coding is a
    waste of memory and cannot capture the relationship between words. LDA is suitable
    for topic modeling and infers the subject topic distribution of the document from
    the text. Obviously, it needs a lot of information to train the document topics
    which are not suitable for labeled data. Word2vec does not share any


