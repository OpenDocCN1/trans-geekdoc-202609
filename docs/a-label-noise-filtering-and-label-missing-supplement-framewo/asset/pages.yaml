    # ## 2. Related work


    # ### 2.1. Game theory


    Game theory is a new branch of modern mathematics. It is a mathematical theory
    and method for studying phenomena with struggle or competition. At present, the
    combination of game theory and various applications has made great contributions
    to social progress [7,8]. He et al. [9] proposed to introduce game theory into
    an integrated energy system. It can solve problems in the energy supply side,
    distribution network, demand side and common planning and dispatching problems
    in integrated energy systems. Game theory is also used in solving power system
    problems. Abapour et al. [10] made a systematic summary of the application of
    game theory in power systems. In addition, to improve the performance of radar,
    it is necessary to control the polarization state of transmit waveforms. Zhang
    et al. [11] proposed a framework to find the optimal transmit polarizations. The
    polarization problem of the radar


    system is transformed into a zero-sum game between the radar and the jammer, so
    as to improve the anti-jamming performance of the system. Traditional game theory
    assumes that all players are absolutely rational, which is difficult to guarantee
    in most cases. Therefore, the evolutionary game theory provides new ideas to solve
    this problem [12]. At this time, people are no longer absolutely rational players,
    and the evolutionary game has begun to develop rapidly. Lin et al. [13] proposed
    to use the evolutionary game theory to study long-term green behavior. They have
    fully considered the price elasticity, market competition, green investment and
    green relevance to formulate a price decision model. Shipping companies can maximize
    their profits while reducing environmental pollution. However, the evolutionary
    game theory has not been applied to noise filtering of location labels. This will
    be an appropriate strategy to optimize the noise filtering model.


    # ### 2.2. Problems in label noise filtering


    Data with label noise will affect the performance of many tasks, such as prediction
    [14–17], security [18,19] and privacy protection [20] [–] [22]. Datasets with
    label noise have many negative effects on classifiers. At present, there have
    been many studies focusing on mitigating the negative effects of label noise.
    Some studies focus on establishing a robust model to achieve better model performance
    in the data with label noise [23,24]. Some research aims to distinguish the label
    noise from the real labels in the dataset and to get a better dataset for model
    training. Next, this section will introduce the research progress on label noise.


    Label noise has hindered some sampling techniques [25,26]. Researchers often use
    the Synthetic Minority Over-sampling Technique (SMOTE) method when they achieve
    unbalanced classification tasks. In the process of data sampling, once the collected
    data contains too much label noise, it is difficult for SMOTE to achieve the desired
    effect. Chen et al. [27] proposed an adaptive robust SMOTE, which uses relative
    density to measure the local density of a small number of samples, and then distinguishes
    features according to the relative density for imbalanced classification of label
    noise. Establishing a model in the presence of label noise, Huang et al. [28]
    predicted the fault of rolling bearing in the wind turbine gearbox. They faced
    the problem of insufficient data and excessive noise labels and used an improved
    label-noise robust Auxiliary Classifier Generative Adversarial Network (AC-GAN)
    driven by the limited data. This method improved the generalization ability of
    the model in practical operation and had good robustness. In addition to some
    text label noises, there are also image label noises [29]. It is a difficult task
    to extract information from the image and then label the image. For example, extracting
    buildings from satellite images requires extensive accurate data to train the
    deep neural network and to realize the automatic generation of building labels.
    But the model training needs a lot of accurate data, and the image label noises
    will hinder the model training. To cope with this challenge, Zhang et al. [30]
    proposed a general label noise adaptive neural network framework to judge the
    relationship between real labels and noise labels. This framework helps to automatically
    generate image labels and reduce manual annotation. In addition, Cai et al. [31]
    proposed a method of uploading data efficiently under the condition of privacy
    protection, and Qi et al. [32] proposed a model of data fusion in the smart city
    scene. Zhang et al. [33] proposed an improved noise loss correction algorithm
    for learning from noise labels.


    As for the distinction of label noise, there are also diverse studies. In industrial
    informatics, data is high-dimensional, noisy and easily mislabeled. Guan et al.
    [34] integrated the traditional two-step method, and then proposed a Sequential
    Ensemble Noise Filter (SENF) to generate noise fractions for each feature instance,
    so as to identify the noise label. In terms of classification technology, Quadratic
    Discriminant Analysis (QDA) is often used. However, label noise and measurement
    noise will seriously damage the prediction ability of the model. Vrankx et al.
    [35] proposed a new real-time robust QDA method that takes the most atypical observation
    as label noise. This method can not only distinguish'
