    parameters. Every word is learned according to the context. Word2vec cannot deal
    with any word hasn’t been met in training. For example, word2vec cannot find the
    connection between words with the same root, such as “eat” and “eaten”. But FastText
    can deal with such problems. Its key idea is to use the internal structure of
    words to obtain the vector representation of words. When each location contains
    too many labels or lacks a label, we need to find the most appropriate label for
    the location, so that users can accurately retrieve it. Since the computer cannot
    deal with the text information directly, the first step we consider is to train
    a certain word vector for each label. FastText is a tool for the word vector calculation
    and text classification, and its advantages are also obvious. In text classification
    tasks, FastText can often achieve the same accuracy as a deep network, but the
    training time is much faster than a deep network.


