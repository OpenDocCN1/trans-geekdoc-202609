    # 6. Conclusions


    Aiming at solving the problem of unreliable labels in LBSN, we propose a framework
    of label noise filtering and missing label supplement. To solve the problem of
    label noise filtering, we first use FastText to convert the restaurant''s labels
    into the vector form, and then use cosine similarity to get the label which is
    most similar to other labels of the location. To solve the problem of label missing,
    we use the simple common word similarity to judge the similarity of users'' comments,
    and then use the label of the similar restaurant to supplement the missing labels.
    In order to increase the reliability of the model and protect the reputation of
    the location from being affected by malicious labels, game theory is used to simulate
    malicious users adding wrong labels, and LNFS model is constantly used to identify
    label noise. Finally, we apply a case study to demonstrate the effectiveness and
    reliability of our method.


    In future work, we will apply this research to point-of-interest recommendation.
    According to the unique label of the location, the users'' interest preference
    for the locations can be mined. Then we can recommend interesting locations to
    users.


