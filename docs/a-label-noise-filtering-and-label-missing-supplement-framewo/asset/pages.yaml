    First of all, the labels are diverse because they are marked by various people
    according to their own understanding. And some malicious users will deliberately
    add false labels to competitors to damage the reputation of other stores. Therefore,
    we need a model that can identify the incorrect labels timely and generate the
    correct label for location. The most appropriate label for a location must cover
    most of the meanings of other general labels. Therefore, we first assume that
    the label most similar to all other labels in the location is the most representative.
    Secondly, since the computer cannot process the text directly, we need to take
    an embedding method to transform the labels into the form of word vectors. Then
    an appropriate label similarity measurement method is adopted to judge the similarity
    between each label. And we select the label which is most similar to all other
    labels as the unique label of the location. To enhance the recognition ability,
    we use the idea of game theory. We first identify the unique label, then simulate
    the attacker, actively increase the label noise to the location, and then use
    the model to identify the unique label. It is worth mentioning that while there
    are many labels for some places, which need to filter the label noise, there are
    still some places still lack labels. For the location without a label, we consider
    the similarity of locations to make an appropriate label supplement. Finally,
    we find the best label for each location so that the data can play the maximum
    value in practical application. The main thrust of our research is as follows.


    +   (1) We propose a label noise filtering and missing label supplement model.
    We use FastText to train appropriate word vectors for all user text labels, and
    use cosine similarity to calculate the similarity between the labels. Then, the
    label most similar to all other labels is selected as the unique label of the
    location, and the noise of other labels is deleted. For locations without labels,
    we can find similar places through users'' comments. The label of the similar
    place is used as the label of that place.


    +   (2) In order to continuously optimize the performance of our proposed model,
    we apply the evolutionary game theory to the process of location label filtering
    and discuss the detailed simulation scenarios of game modeling.


    +   (3) We apply our evolutionary game method to a location labels noise filtering
    scheme and make a case study. The results show that our method can describe a
    detailed evolution process, and our model can achieve better performance.


