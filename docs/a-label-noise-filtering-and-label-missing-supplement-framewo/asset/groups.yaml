    ## 3. 动机


    在基于位置的社交网络（LBSN）中，用户经常在不同地点签到。例如，用户会标记他们去过的餐厅，并留下关于餐厅的评论。如图 1 所示，用户 1 在一家英国餐厅用餐后发表评论“尝试芋头味，它是结束一餐的清爽方式；超级美味”，而喜欢酒廊酒吧的用户
    2 则发表类似“最好在酒吧的后角落，那里可以看到整个房间的美景”的评论。除了对餐厅发表评论外，LBSN 还提供为餐厅添加标签的功能，以方便用户检索。在图 1
    中，用户 2 访问的位置有四个标签，而用户 4 访问的位置没有标签。用户可以主动根据自己的想法为餐厅添加标签，因此位置标签是由各种用户主观添加的，可能存在故意添加错误标签的恶意用户。我们以真实应用为例，如图
    2 所示，说明噪声标签对模型性能的影响。从图中可以看出，位置 1 有三个不同的标签。如果用户 2 向位置 1 添加错误标签“happy hour”，其他用户根据该错误标签搜索位置
    1 时可能不满意。而位置 2 没有用户添加标签。这种情况会导致一些标签准确，而一些标签冗余或不恰当。还有些位置没有被用户标记。这对用户准确搜索位置是严重障碍。目前，关于
    LBSN 中位置标签噪声过滤的研究很少。


    为解决上述问题，我们提出了一种标签噪声过滤和缺失标签补充框架。（1）我们假设，位置中与所有其他标签最相似的标签是最具代表性的。对于每个具有冗余标签的位置，使用余弦相似度计算每个标签与所有其他标签之间的相似度，然后将相似度之和作为关键词的特征。最后，将所有特征中最大的标签作为位置的标签。（2）对于缺失标签的位置，我们使用用户的评论，通过判断评论的相似度来找到相似位置，然后使用相似位置的标签为该位置分配标签。（3）为优化性能，我们将演化博弈论应用于我们的方案。通过不断增加标签噪声并执行相应的噪声过滤，对所提出的模型进行优化。


