    等人 [30] 提出了一个通用标签噪声自适应神经网络框架，用于判断真实标签与噪声标签之间的关系。该框架有助于自动生成图像标签并减少人工标注。此外，Cai 等人
    [31] 提出了一种在隐私保护条件下高效上传数据的方法，Qi 等人 [32] 提出了智慧城市场景中的数据融合模型。Zhang 等人 [33] 提出了一种改进的噪声损失修正算法，用于从噪声标签中学习。


