    ### 4.1. 问题表述


    用户 U = {u1, u2, ..., uM} 将访问不同位置 V = {v1, v2, ..., vN} 并发布他们的评论 Cv = {c1, c2,
    ..., cO} ∈ C。评论通常暗示用户对位置的态度。对于不同位置 vi ∈ V，用户会主动使用 Lv = {l1, l2, ..., lQ} ∈ L 为其打标签。特别是，M、N、O
    和 Q 分别指用户、位置、评论和标签的总数。然而，用户对位置的主观打标签导致标签可靠性下降。有些位置标签是准确的，有利于其他用户的检索。与此同时，有些标签是用户随意添加的，这会误导用户的搜索结果。还有些位置没有被任何用户标记，这也不利于被其他用户检索。


    **定义 1.** 标签噪声过滤：我们需要为每个位置 vj ∈ V（1 ≤ j ≤ N）选择一个唯一标签，即，对于每个标签 lk ∈ L（1 ≤ k ≤ Q），如果
    k ≥ 2，则证明存在噪声。我们需要识别并删除位置标签。


    **定义 2.** 标签补充：对于没有标签的位置，即 lk ∈ L（k = 0），我们需要根据位置之间的用户评论找到相似位置，并使用相似位置的标签为没有标签的位置补充标签。


