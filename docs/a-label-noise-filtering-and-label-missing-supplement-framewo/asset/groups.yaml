    to add labels. In any case, the lack of labels will make it difficult for other
    users to search these restaurants, which is not conducive to the development of
    restaurants. Although these restaurants lack labels, they collect users'' comments.
    Since the restaurants that users leave comments often have the same type of location,
    our proposed method is to add a label for the location by judging a labeled location
    similar to it. The process is shown in Fig. 4 step 4-6. This involves how to judge
    the similarity between user comments. Due to the large number of user comments,
    we choose a more complex method which is time-consuming and labor-consuming. Therefore,
    we choose the simple common word similarity method. Intuitively, we first count
    the total number of characters of the two locations under comparison, then count
    the total number of characters of the common words about the location, and finally
    divide the common words by the number of characters in the longest document to
    get the similarity measurement value.


    Suppose that for location A = {c_1, c_2, ..., c_Q} ∈ C without a label, we compare
    it with other locations with a unique label to find a similar location. Let''s
    assume there is a location B = {c_1, c_2, ..., c_P} ∈ C, then the text similarity
    of location A and B is calculated by the following equations (9) and (10).


    ```

    S(v_{ij}) = \frac{A \cap B}{Q} (Q \ge P) (9)

    ```


    ```

    S(v_{ij}) = \frac{A \cap B}{P} (Q < P) (10)

    ```


    Where A represents the comments words about location A, B represents the words
    about location B, Q represents the total number of words about location A, and
    P represents the total number of words about location B. By judging the similarity
    between the comments on different locations, we can find the label of locations
    which are similar to the location without a label and then add the label to the
    location. In addition, the specific experimental process is shown in Algorithm
    2.


    ```

    **Algorithm 2 Missing label supplement**

    Require: Users U, locations V, labels L and comments C

    Ensure: Unique label {l_k2} for every missing location v

    //Select a location without label

    1: V_s = Ø

    2: for each location v in V do

    3:   if L_v = Ø then

    4:     Add v in V_s

    5:   end if

    6: end for

    //Finding similar locations

    7: Training label vectors with FastText

    8: for each location v in V_s do

    9:     for each comments c in C do

    10:     Calculate S(v_ij) by (9) (10)

    11:     l_v = l_v + sim_v

    12:   end for

    13: end for

    14: return label {l_k2}

    ```


    Finally, we summarize the proposed label noise filtering and missing label supplement
    framework. For a location with only one label, we default that this label is the
    only label of the location. For locations with three or more labels, we assume
    that the label most similar to other labels about the location is the most representative,
    and then we use cosine similarity to calculate the similarity matrix of each location,
    and sum up the eigenvalues of each label. The label with the largest eigenvalue
    is taken as the unique label of the location. For the location with missing label,
    we use the simple common word similarity method to find a similar location with
    a unique label, and make its label as the label of the location. In particular,
    the above solution cannot be used for locations with two labels. Therefore, we
    first find a similar location according to the common word similarity method.
    At this time, the location has three labels, and finally determine the unique
    label according to the label noise filtering method.


