    等人 [28] 预测了风力涡轮齿轮箱中滚动轴承的故障。他们面临数据不足和噪声标签过多的问题，并使用了一种由有限数据驱动的改进标签噪声鲁棒辅助分类器生成对抗网络（AC-GAN）。该方法提高了模型在实际运行中的泛化能力，并具有良好的鲁棒性。除了文本标签噪声外，还有图像标签噪声
