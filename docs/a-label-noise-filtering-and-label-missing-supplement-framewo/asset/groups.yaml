    word2vec [43] 和 FastText [44]。One-hot 编码浪费内存，无法捕捉单词之间的关系。LDA 适用于主题建模，并从文本中推断文档的主题主题分布。显然，它需要大量信息来训练文档主题，不适合标记数据。Word2vec
