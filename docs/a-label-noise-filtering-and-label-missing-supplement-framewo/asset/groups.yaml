    | 标签 1 | 0 | 0.27 | 0.09 | 0.092 | 0.452 |

    | 标签 2 | 0.27 | 0 | 0.03 | 0.04 | 0.34 |

    | 标签 3 | 0.09 | 0.03 | 0 | 0.97 | 1.09 |

    | 标签 4 | 0.092 | 0.04 | 0.97 | 0 | 1.102 |


    图 5. 用于噪声过滤的包含四个标签的位置示例。


    与该位置所有其他标签最相似的标签最具代表性。许多用户已为该站点添加了标签，因此最合适的标签通常是公众舆论的集合。选择唯一标签也是为了尽可能准确地表示位置。在后续的用户兴趣挖掘中，唯一标签可用作用户的兴趣。当保留多个标签时，可能存在一些重复标签，或者存在一些与位置不太匹配的标签。这会导致信息冗余。但这并不意味着选择多个标签是不合理的。带有多个标签的位置更容易被搜索到。因此，可以根据不同场景保留不同数量的标签。在我们的研究场景中，与站点所有其他标签最相似的标签被选为唯一标签。接下来，以特定位置及其标签为例介绍我们的方法。假设一个地方包含四个标签。首先，我们提取四个标签的词向量。然后，我们使用余弦相似度
    [47] 计算四个标签之间的相似度。余弦相似度的计算公式如 (7) 和 (8) 所示。


    \(F(v_i) = \frac{\vec{x} \cdot \vec{y}}{|\vec{x}||\vec{y}|}\) (7)


    \(\cos \theta = \frac{\sum_{i=1}^n (x_i y_i)}{\sqrt{\sum_{i=1}^n (x_i)^2} \sqrt{\sum_{i=1}^n
    (y_i)^2}}\) (8)


    其中 \(\vec{x}\) 表示目标标签向量，\(x_i\) 表示向量元素。\(\vec{y}\) 表示位置的其他标签向量，\(y_i\) 表示向量元素。此外，我们得到位置的相似度矩阵，将每个标签与其他标签之间的相似度之和作为标签的特征，并得到位置的特征向量。其中，特征值最大的标签与其他位置最相似，该标签被选为位置的唯一标签。该过程如图
    4 步骤 1–3 所示。首先，我们通过 FastText 获取标签向量，然后使用余弦相似度计算每个位置中所有标签向量的特征值。最后，选择特征值最大的标签。如图
    5 所示，一个位置有四个标签。使用余弦相似度获得标签之间的相似度后，得到相似度矩阵。通过对每个位置的相似度矩阵求和，我们得到四个标签的特征值。可以看出，标签
    4 的特征值最大，因此我们选择标签 4 作为位置的标签。此外，具体实验过程如算法 1 所示。


    ```

    **Algorithm 1 Label noise filtering**

    Require: Locations V and their labels L

