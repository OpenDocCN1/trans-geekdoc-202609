    ## 2. 相关工作


    ### 2.1. 博弈论


    博弈论是现代数学的一个新分支。它是研究具有斗争或竞争现象的数学理论和方法。目前，博弈论与各种应用的结合对社会进步做出了巨大贡献 [7,8]。He 等人 [9]
    提出将博弈论引入综合能源系统。它可以解决综合能源系统中能源供应侧、配电网、需求侧以及共同规划和调度等问题。博弈论也用于解决电力系统问题。Abapour 等人
    [10] 对博弈论在电力系统中的应用进行了系统总结。此外，为了提高雷达性能，有必要控制发射波形的极化状态。Zhang 等人 [11] 提出了一个寻找最优发射极化的框架。雷达系统的极化问题被转化为雷达与干扰机之间的零和博弈，以提高系统的抗干扰性能。传统博弈论假设所有参与者都是绝对理性的，但在大多数情况下这很难保证。因此，演化博弈论为解决这个问题提供了新思路
    [12]。此时，人们不再是绝对理性的参与者，演化博弈开始迅速发展。Lin 等人 [13] 提出使用演化博弈论来研究长期绿色行为。他们充分考虑了价格弹性、市场竞争、绿色投资和绿色相关性，制定了价格决策模型。航运公司可以在减少环境污染的同时最大化利润。然而，演化博弈论尚未应用于地点标签的噪声过滤。这将是优化噪声过滤模型的一个合适策略。


