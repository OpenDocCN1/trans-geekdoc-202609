    LSTM 模型进行训练，并预测用户可能下次访问的标签类别。通过比较这两个 LSTM 模型的性能，我们可以充分证明我们提出的 LNFS 框架的优势。


    ## 5.5. 案例研究


    在本节中，我们使用特定的案例研究来演示 LNFS 框架的可靠性。


    ### 5.5.1. 步骤 1：嵌入


    位置的标签数据被处理为词向量。我们使用的数据包括表 1 中显示的用户-位置数据对，每个数据对表示用户在某个位置签到过一次。用户会在签到位置留下评论。位置-标签数据显示在表
    2 中，表示每个位置收到的所有用户添加的标签。我们通过 FastText 将所有标签信息转换为 300 维向量以供后续处理，如表 3 所示。


    ### 5.5.2. 步骤 2：标签噪声过滤


    对于拥有超过 3 个标签的位置 $v_t$，我们需要选择最具代表性的标签。因此，我们使用 (1) 来查找 $v_t$ 所有标签向量之间的相似度。可以得到 $v_t$
    的相似度矩阵。然后，将相似度矩阵的每一行相加以得到每个标签的特征值，特征值最大的标签即为 $v_t$ 的唯一标签。最后，图 6 显示了标签噪声过滤过程。然后，攻击者添加恶意标签，LNFS
    模型执行标签噪声过滤。模型与攻击者之间的博弈优化了模型的性能。


    ### 5.5.3. 步骤 3：缺失标签补充


    每个位置都包含用户留下的评论。对于没有标签的位置 $v_t$，我们通过判断评论的相似度来找到一个相似位置，并使用相似位置的标签来补充没有标签的位置。此外，对于拥有两个标签的位置，两个标签之间的相似度相同，因此无法通过计算特征值来找到唯一标签。我们首先使用评论的相似度来找到相似位置的一个标签，然后使用标签过滤方法来选择唯一标签。最后，图
    7 显示了缺失标签补充过程。


    ### 5.5.4. 步骤 4：用户签到位置预测


    通过前面的步骤 1-3，我们已经能够为每个位置选择一个唯一标签。我们需要验证我们提出的 LNFS 框架的性能。由于标签是由不同人员添加的，没有统一标准能直接证明我们框架的性能。


