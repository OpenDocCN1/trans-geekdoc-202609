    - LSTM


    标注数据广泛应用于各种分类任务。然而，存在一个巨大的挑战，即标签通常是人工添加的。恶意用户添加的错误标签会影响模型的训练效果。标注数据的不可靠性阻碍了研究。为了解决上述问题，我们提出了一种标签噪声过滤与缺失标签补充（LNFS）框架。我们以基于位置的社交网络（LBSN）中的位置标签为例来实现我们的框架。针对标签噪声过滤问题，我们首先使用
    FastText 将餐厅的标签转换为向量，然后基于这样一个假设：位置中与所有其他标签最相似的标签最具代表性。我们使用余弦相似度来判断并选择最具代表性的标签。针对标签缺失问题，我们使用简单的常用词相似度来判断用户评论的相似度，然后使用相似餐厅的标签来补充缺失的标签。为了优化模型性能，我们将博弈论引入模型，以模拟恶意用户与模型之间的博弈，提高模型的可靠性。最后，给出了一个案例研究来说明
    LNFS 的有效性和可靠性。


    ## 1. 引言


    物联网 [1]、移动众包 [2] 等新技术已在各行各业得到广泛普及和应用，催生了海量数据。此类数据的形成往往离不开人的参与。此类数据蕴含的巨大价值不容小觑。对于许多行业来说，如何利用大数据是赢得市场竞争的关键。随着计算机设备的不断进步，人们已经能够处理大规模数据。然而，由于大部分数据来自网络，其真实性会因人们的恶意行为而降低。例如，在机器学习
    [3] 中，一项常见的工作是使用标注数据来训练神经网络用于分类、回归或其他目的 [4]。此时，数据质量将直接影响模型性能。标签通常由人类分配，数据标注任务耗时、费力且昂贵。一些恶意标记行为会导致大量标签噪声。因此，在实际应用中必须考虑噪声标签的影响。我们需要一个能够准确识别标签噪声的模型，以主动消除噪声数据的影响。


    目前，人们乐于标记一些热门地点以证明自己去过那里。同时，用户会留下评论并为他们去过的餐厅打上标签，以展示他们有多喜欢这些餐厅，并帮助他人判断餐厅是否符合自己的兴趣。然后，其他用户可以通过搜索不同的标签来找到他们偏好的餐厅。像大众点评
    [5] 这样的应用可以实现这一功能。然而，此类标签的质量参差不齐，因为它们是由各种人标记的。一些恶意用户会向地点添加无效标签，导致一些标签准确真实，而另一些则错误或模糊
    [6]。因此，一个巨大的挑战是如何为地点选择一个正确的标签，以帮助有真实需求的其他用户进行搜索并过滤掉不准确的噪声标签。我们提出一个标签噪声过滤框架来解决上述问题。


    首先，标签是多样的，因为它们是由各种人根据自己的理解来标记的。而且，一些恶意用户会故意向竞争对手添加虚假标签，以损害其他商店的声誉。因此，我们需要一个能够及时识别错误标签并为地点生成正确标签的模型。地点最合适的标签必须涵盖其他通用标签的大部分含义。因此，我们首先假设，地点中与所有其他标签最相似的标签是最具代表性的。其次，由于计算机无法直接处理文本，我们需要采用嵌入方法将标签转换为词向量形式。然后采用适当的标签相似度测量方法来判断每个标签之间的相似度。我们选择与所有其他标签最相似的标签作为地点的唯一标签。为了增强识别能力，我们使用博弈论的思想。我们首先识别唯一标签，然后模拟攻击者，主动向地点增加标签噪声，然后使用模型来识别唯一标签。值得注意的是，虽然有些地方有许多标签，需要过滤标签噪声，但仍有一些地方缺乏标签。对于没有标签的地点，我们考虑地点相似度来进行适当的标签补充。最后，我们为每个地点找到最佳标签，以便数据在实际应用中能发挥最大价值。我们的研究主要贡献如下。


    - (1) 我们提出了一种标签噪声过滤和缺失标签补充模型。我们使用 FastText 为所有用户文本标签训练合适的词向量，并使用余弦相似度来计算标签之间的相似度。然后，选择与所有其他标签最相似的标签作为地点的唯一标签，并删除其他标签的噪声。对于没有标签的地点，我们可以通过用户评论找到相似的地点。相似地点的标签用作该地点的标签。


    - (2) 为了持续优化我们提出的模型性能，我们将演化博弈论应用于地点标签过滤过程，并讨论了博弈建模的详细仿真场景。


