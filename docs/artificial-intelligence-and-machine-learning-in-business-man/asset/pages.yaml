    # 3.3 MACHINE LEARNING: FUNCTIONS AND METHODS


    Machine Learning is a continual mechanism in which the discovery determines development,
    either by automated or by manual methods. In an exploratory research situation,
    Machine Learning is quite useful, where there are no fixed ideas of what would
    make an interesting result. Machine Learning is the quest for new, useful and
    non-trivial knowledge in vast quantities of data. It is a joint endeavour between
    humans and machines. The best outcomes are obtained by balancing the expert knowledge
    of human specialists in explaining challenges and priorities with the automated
    searched capabilities. In operation, Machine Learning’s two main objectives tend
    to be estimation and explanation. To forecast uncertain or possible values of
    other variables of interest, estimation requires the use of certain variables
    or fields in the set of data. Explanation, on the other hand focuses on identifying
    patterns that illustrate the data which humans can understand. It is also to put
    the tasks of Machine Learning into two groups [77,80]:


    +   1. Predictive, which generates the system model as defined in the provided
    set of data.

    2. Descriptive, which generates new, non-trivial outcomes dependent on the set
    of data.


    The purpose of Machine Learning is to generate a model, represented as an executable
    code, on the predictive end of the spectrum, that can be utilized to perform categorization,
    predictive analytics, approximation or other related tasks. The aim is to obtain
    an interpretation of the analyzed structure on the descriptive end of the spectrum,
    by discovering techniques and connections in data sets. For specific Machine Learning
    applications, the significance of prediction and explanation may differ quite
    considerably. Machine Learning has its roots in numerous fields, of which Statistics
    and Machine Learning are the two most important. Statistics had its origins in
    Mathematics, so focus was laid upon Mathematical rigour, and before before to
    bring it into practice. The Machine Learning culture, on the other hand, is very
    much rooted in computer experience. This has resulted in a mindset that is practical,
