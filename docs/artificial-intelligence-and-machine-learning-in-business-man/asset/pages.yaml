    possible to provide personalized care to almost every person in society [5], in
    the pandemic era due to SARS-COV-19 virus, our healthcare system realized importance
    of modern technology adoption [6]. With the remarkable gains in life expectancy,
    current society is becoming a society of geriatric patients of an ageing population.
    Adults and the geriatric population need constant care and support as most of
    them are suffering from lifestyle disorders like high blood pressure, cardiac
    arrhythmia, diabetes, etc. The geriatric patient needs more personalized care
    as they are unable to control their physical symptoms and constantly seeking support
    from family and medical practitioners [7].


    Personalized medicine is defined as to adapt to the healthcare of individuals
    to the possible extent at all the phases starting from treatment, diagnosis and
    treatment, to post-treatment and further follow up. Some concepts which are used
    mostly along personalized medicine are genomic medicine, stratified medicine and
    precision medicine. A clear understanding of these terms helps in any miscommunication.


    The main motivation for the evolution of personalized medicine is due to the generation
    of data from genome sequencing. The potential of personalized medicine is the
    forecasting of the disease risk, treatment response and care built upon genomic
    data. The variety of data that can be used to adapt healthcare is far away from
    the genome sequence data. Moreover, the acceptability of participants in the expansion
    and execution of personalized medicine might be inclined with the discernment
    that genomics has not suffered to the required level of hope and may lead to vulnerability
    to a whole mass of diseases. Hence it is necessary to answer the disapprovals
    that personalized medicine is grounded on the misinterpretation that it denotes
    genomic only [8].


    The usage of information systems by the clinical laboratories helps in the consolidation
    of the reports and warnings and the outcomes to be applied with the help of electronic
    health records (EHR) and related systems. The gateways facilitates accessing genetic
    data and decides how they can be used. Currently, the development of the required
    infrastructure is in the nascent stage and the basic infrastructure for precision
    medicine is evolving.


    The role of the patient is crucial for supporting precision medicine. The customized
    precision medicine can be provided to every patient whose genome sequencing is
    unique by collecting as much information as possible [9]. EHRs are positioned
    to support the genetic information with the help of technology. They should facilitate
    the clinicians by providing complete information about the patient along with
    the genetic data. The information which is obtained should be systematized and
    demonstrated in such a way that enables smooth diagnostics and the decisions related
    to treatment [10].


    This biggest challenge of 21st-century medicine is to provide an effective treatment
    that is customized based on the precise biological condition of the patient to
    facilitate healthcare solutions. Generally, an assessing scheme of the patient
    should evolve before the treatment starts to help the healthcare practitioners
    can provide exact medicine, dose or intervention. This led to the categorization
    of patients based on some genetic characteristics which provide an efficient model
    for providing balanced nutrition and lifestyle [11].'
