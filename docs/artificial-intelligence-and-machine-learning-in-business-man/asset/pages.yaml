  md: '# Artificial Intelligence and Machine Learning in Business Management


    # Example 5:


    +   * Which are the mutable objects in Python?

    * Int

    * String

    * List

    * Dictionary

    * Tuple

    * Do not know


    Let us analyze possible answers and their corresponding inferences on the knowledge
    of the student:


    +   * List and Dictionary – Correct. Knows Mutable and immutable objects in the
    given list. The person may or may not the complete list of mutable and immutable
    objects in Python.

    * List, Dictionary and String – Wrong. Does not know String is immutable.

    * List and String – Wrong. Does not know Dictionary is mutable and String is immutable.

    * String and Tuple – Wrong. Does not know mutable and immutable objects.

    * None of the above – Wrong. Does not know mutable and immutable objects.


    In summary, these types are limited with number of choices. They are also immune
    to familiarity or prior inferences to the person answering.

    We have other type of questions, which seek minimum input from the user. Questions
    like ‘Correct the Sentence’, ‘Fill in the missing fields’, ‘Give alternate solution’
    etc.

    We will look at the example given below:


    # Example 6:


    +   * Place parentheses so that the following expression is valid.

    * 7² + 6² - 5² - 4² * 3² - 2² * 1 = 0


    This question aims to test the knowledge of the student about the order in which
    the expressions are evaluated. If a student answers it correctly, then we can
    infer that they have the required knowledge. The answer evaluation requires simple
    comparison with the correct result. Since the answer is entered, rather than selected,
    the quality of inference will be more accurate.


    In summary, as we involve the student more and to work out a solution rather selecting
    or guessing an answer, the inference about the knowledge of the learner will be
    more accurate.


    There are more type of questions and we will not be detailing each one of them.
    The approach given in this paper is applicable to all types of questions, provided
    they come with a set of rules:


    Rule 1: The intent of a question should be focused to test the knowledge of the
    student in one logically independent topic. It is not recommended to make a compound
    question to test in one more related or unrelated topic. In'
  merge: -1
  img_proc: true
