    # 3.1.1.3 Negotiation Types


    # Auctions


    In an auction, the bidding is initiated by one or more agents termed as auction-eers,
    and some other agents termed as bidders make bids according to the protocol implemented
    (which might allow one or many rounds). A contract between the auctioneer and
    the effective buyer is then typically the type of auction [36].


    # Bilateral negotiations


    Bilateral negotiation comprises two sides, a service/good seller and a customer,
    finding a mutually agreeable compromise on the terms and conditions of a trade.
    Bilateral negotiation typically involves multi-attribute bids (price/cost, delivery
    date, and so on) [12,14,29,33].


    # Decision-making by the opponent''s behaviour


    Agents specifically think for their opponents'' goals and actions using the techniques
    and then determine the acceptable response of their behaviour. A significant method
    for evaluating strategic relationships between agents is the non-cooperative game
    theory [12,14,29,33].


    # Multi-attribute negotiations


    Multi-attribute negotiation is an agreement comprising several issues which must
    be rectified simultaneously on issues,[12,14,29,33]. In this case, agents can
    have different interests on issues, and by trading some that are not so important,
    both parties may reach greater consensus on issues that are more important to
    them.


    # Issue-by-issue negotiation


    Negotiation on issue by issue is often based on the negotiating paradigm of Rubinstein,
    where agents may select either sequential negotiation with sequential implementation
    or simultaneous negotiation with simultaneous implementation.'
