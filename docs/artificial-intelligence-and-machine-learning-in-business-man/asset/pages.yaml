  md: '# Artificial Intelligence and Machine Learning in Business Management


    A typical online learning environment is shown in Figure 9.1

    The algorithms used may differ with various implementations.


    # 9.2.2 EVALUATION PROCESS


    The evaluation process provides feedback about the student after evaluating the
    performance of the student. This process heavily depends upon the quality of questions,
    strategy to select the questions, capturing the behaviour of the student while
    awaiting. To enhance the generation of questions, automatic question generation
    was proposed in 2014 [2]. A review published in ‘The International Journal of
    Artificial Intelligence in Education (IJAIED)’ suggests the need to further perform
    experimental research, harmonizing evaluation metrics and investigate other evaluation
    methods that are more feasible [3]. The evaluation process consists of question
    delivery, test and behaviour capture, evaluate and provide feedback.


    The question delivery mechanism in an online learning environment should have
    consistent knowledge about the student to avoid repetition of question. This differs
    from online tests to test the student knowledge in a broader sense at the end
    of the course. The application of Markov chain to assess the reliability of question
    classification and to classify the performance of the students based on the attainment
    of handling difficulty levels over a period of time was presented by Nandakumar
    [4].


    # 9.3 QUESTION ANSWER MODEL


    Typically, questions are randomly selected and presented to the students. The
    student’s knowledge is judged from the answers. The questions are framed to judge
    the knowledge upon a particular subject (topic or concept). If the answer is right,
    we infer that the student knows the subject, otherwise he/she does not know the
    subject.


    Even though the question-and-answer method is widely accepted, it may not accurately
    find out whether the student has acquired the required knowledge. The main reason
    is the probabilistic nature of answering. To understand this, we shall first discuss
    the type of questions and classify them.


    # 9.3.1 MOST WIDELY-USED QUESTION TYPES


    The easiest and most used question is YES (True) or NO (False) type. The answer
    is of Binary nature. This includes ‘This or That’, ‘True or False’ type questions
    also. Few examples are:


    Example 1:


    +   - Python is a snake

    - YES

    - NO'
