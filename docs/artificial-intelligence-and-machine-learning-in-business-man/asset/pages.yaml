    and five ML models, i.e., multiple linear regression (MLR), Decision tree regression
    (DTR), Random forest regression (RFR), support vector regression (SVR), and neural
    network regression (NNR) to predict weekly movie goals. The findings suggest that
    the predictive ability of the ML models are as high as linear models used for
    predictive work.


    Yildiz et al. [14] did comparative analysis of regression and ML models to forecast
    electricity cost of local building to minimize environmental hazards and enhance
    economic benefit. The ANN and Bayesian Regression Backpropagation have lowest
    mean percentage error in case of modelling campus load than single building. While
    the regression model still better performed compared to adjusted ML models.


