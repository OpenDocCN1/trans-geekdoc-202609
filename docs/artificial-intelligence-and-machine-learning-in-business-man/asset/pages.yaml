    # 3.1.1.2 Negotiation Strategies


    # Social welfare


    In a given solution, social security is the sum of all agents’ payoffs or utilities.
    It tests the agents’ global goal. Through comparing the solutions that the mechanisms
    lead to, it can be used as a criterion to compare alternative mechanisms. The
    criterion is somewhat subjective when calculated in terms of utilities, since
    it involves inter-agent utility comparisons and currently the utility function
    of each agent can be defined only up to positive affine transformations) [18,46].


    # Pareto efficiency


    Another solution measurement parameter that takes a global view is Pareto Efficiency.
    Again, by comparing the solutions that the mechanism leads to, alternate mechanisms
    can be tested according to Pareto Efficiency. A solution-x is effective for Pareto,
    i.e. Pareto is ideal if no x₀ solution exists, off in x and no agent is worse
    off in x₀ than in . Pareto Efficiency tests global good, and it does not entail
    questionable comparison of inter-agent utility. A subset of Pareto effective solutions
    is social welfare. Once the total of the payoff is maximized, the payoff of another
    agent decreases [52].


