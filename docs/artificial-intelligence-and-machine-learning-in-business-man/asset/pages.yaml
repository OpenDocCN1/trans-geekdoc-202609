    the ANN model to deal with non-stationary data. This study also analyzed lag effect
    of methodological data. The findings show the highest level of accuracy subject
    to condition of used time.


    Pathak [18] used hybrid ML models to forecast chaotic process. ML techniques promising
    result compared to the knowledge-based models used in the past. The combination
    of ML and knowledge-based technique fills the non-defined gap of old techniques.


    Pechacek [19] used Machine Learning algorithm to develop military retention prediction.
    The objective of this study was to predict when individual service members would
    leave the military. A high level of accuracy was achieved by the model as predictive
    accuracy of the model up to one year was 88%, up to four years 80%, and for to
    longer periods predictive accuracy was 78%.


    Shi et al [20] studied predictive accuracy of speed used for wind energy. The
    proposed forecasting models based on spatial temporal correlation (SC) theory
    and Wavelet Coherence Transformation Analysis (WCT). The results show that there
    is strong correlation between adjacent wind turbine and targeted wind turbine.
    This study used deep neural network models and compared same with traditional
    methods used for wind speed. The findings show that mean square error (RMSE),
    mean absolute error (MAE), mean absolute percentage error (MAPE) for wind prediction
    are lowest for ML models. The overall concluded hybrid models used for wind prediction
    are better than those used in the future.


    Sun et al [21] used ML and Internet search index to forecast tourist arrivals
