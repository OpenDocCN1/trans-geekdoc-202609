  md: '# Artificial Intelligence and Machine Learning in Business Management


    # 8.1 INTRODUCTION


    Technological progression throughout the history timeline is punctuated by radical
    changes preceding the current era of computerization. These technological epochs
    brought broad changes in social and political beliefs and material wealth in society.


    The term technology is derived from two Greek words meaning systematic treatment
    of art and craft. It defines what scientific knowledge is employed for achieving
    required outcomes [1]. Technological changes improved human skills and application
    of deploying natural resources and gain competitive advantages. Requirements of
    the increased population, environmental and competitive challenges led to the
    development of tools to maximize and optimize the human efforts [2]. Machines
    were designed and developed to reduce or replace human efforts and convert electrical
    and mechanical energy to convert material and form from one to another. This led
    to a change in the economy from hunter–gatherer to agrarian to an industrial economy.
    The noun “industry” signifies the production of goods and services using technology
    and machines. Industrialization means the development of industries on a larger
    scale. The industrial revolution started in the latter part of the 18th century.
    The industrial revolution of the 1770s marked the shift from an agrarian society
    to an industrial society centred around the proliferation of industries [3]. The
    population and the wealth of nations have exploded tenfold from period of the
    first phase of industrialization of the 1770s [4]. This led to the 2nd and 3rd
    Industrial Revolutions necessitated by the surge in demand for goods and services
    for the teeming millions of consumers.


    # 8.2 THE INDUSTRIAL REVOLUTIONS


    The industrialization of the west followed by that of east took different paths
    marked by the differences in the geography and technological advances. The industrial
    revolution is taken as the period from 1770s to 1870s when technological leaps
    enabled us to harness electrical and mechanical energy for social benefit. This
    led to several changes in the way of manufacturing and production were made. New
    forms of transport were discovered and developed which led to the creation of
    infrastructure for much of the society and in turn, led to the expansion of populations
    greatly. Great Britain became the epicentre of the industrial and spread the technological
    waves to its very colonial frontier [5].


    At the beginning of the 20th century, the world population crossed 1.6 billion
    with a corresponding increase in the world GDP, rapid advancements in generation
    and distribution of electricity, mass production of goods and the onset of globalization
    with faster modes of transportation appearing on the scene. By the middle of the
    20th century, the world had witnessed two wars which resulted in rapid industrialization.
    The war efforts necessitated changes in the way machinery and equipment were produced
    efficiently. New global power balances emerged, and nuclear power and advances
    in consumer electronics were witnessed. Gradually, the'
