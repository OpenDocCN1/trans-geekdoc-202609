    # 2.2 WHAT VALUE ANALYTICS BRING TO RETAIL?


    The science of analyzing raw data so as to draw conclusion from mass of information
    in the form of trends and metrics is termed as “data analytics”. In practice,
    data analytics is an umbrella term that covers divergent aspects of data analytics.


    The process of employing analytical tools for analyzing business trends, and calculating
    metrics to comprehend retail business decisions is termed as “Retail Analytics”.
    Retail is the upcoming business domains for analytics because of its prolific
    data and numerous optimization problems such as optimal prices, discounts, recommendations
    and stock levels which can be solved by deploying analytical techniques. Especially
    when the retail industry is facing new challenges like uncertainty in economy,
    digital competition, and emergence of customers being well informed and increasingly
    demanding. This opens a new opportunity for retailers who can accurately anticipate
    the customers’ wants and needs by offering the right product, in the right place,
    at the right time and for the right price.


    # 2.3 TYPES OF CUSTOMER DATA USED IN RETAIL ANALYTICS


    Customer data can be collected in three ways: by directly asking customers, by
    indirectly tracking customers, and by appending other sources of customer data
    to your own”, said Hanham. “A robust business strategy needs all three”. For simplicity,
    the retail customer can be categorized in four domains ([4–9]; and [10]).


    +   a) **Personal data**: This category includes personally identifiable information
    such as name, age, gender, IP address, browser cookies and others.

    b) **Engagement data**: This type of data encompasses the way customer interact
    with retailer’s physical stores visits, its website and mobile apps, also company’s
    social media pages, and other digital footprints of the company.'
