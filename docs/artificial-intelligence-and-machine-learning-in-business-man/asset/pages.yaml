    method for the implementation of research work whereas Section 5.4 consists of
    results and finally the conclusion and future scope is presented in Section 5.5.


    # 5.2 RELATED WORK


    Thulysalam Ramiah Pillai at [1] have used MLP to identify fraud. They have tuned
    parameters such as activation function, number of neurons and number of hidden
    layers to compare the performance of the model. They have found that logistic
    activation function with 10 and 100 neurons and 3 hidden layer models, and in
    case of hyperbolic tangent activation function when the node is 1000 and number
    of hidden layers is 1, 2, and 3, get the most sensitive scores.


    Mohamad Zamini at [2,3], have proposed a deep learning model with autoencoder
    to detect credit fraud. In [2] the author has suggested to use an unsupervised
    method for fraud detection, which they have used an auto-encoder having 3 hidden
    layers and a k-means clustering. The implementation results show that their proposed
    method has outperformed when compared with other models. In [3] the authors have
    used different methods, such as K-nearest neighbour (KNN), Genetic Programming
    (GP), Self-Organizing Mapping (SOM) with auto-encoder for extraction of relevant
    features and Softmax to determine whether the class belongs to fraudulent or non-fraudulent.'
