    carried out by illegitimate persons by misrepresenting themselves for money or
    property gain. Therefore, credit card scams are nothing but gaining of confidential
    information like password, CVV number, etc. by the intruders. So, we need credit
    fraud detection technique is required to protect the cardholders from false activity.


    India is on its way to becoming a developed country. To achieve this, the Government
    of India (GoI) has launched several initiatives, and one of these is the Digital
    India Campaign. The main intent of government through this initiative is to empower
    the nation through the promotion of a cashless economy, which can be operated
