    #  15.4.3 PREPROCESSING


    The segmentation step is of prime importance as the rest of the steps are based
    on it. If the segmentation fails, recognition will also fail to produce the desired
    output. To ensure accuracy, performing preprocessing on data before processing
    is necessary. Preprocessing is the primary transformation made on initial input
    data or the output data from the previous process to make it ready for further
    processing. It may include some geometrical transformation, colour transformation,
    standardizing image, image blurring, etc.

    Image blurring/smoothing is one of the most used preprocessing steps. It is achieved
    by convolving the image with a low-pass filter kernel. It is useful for noise
    removal. When this filter is applied, it removes high-frequency content (e.g.,
    noise, edges) from the image resulting in unwanted boundaries being blurred.

    OpenCV mainly provides four types of blurring techniques.


    +   - Averaging:

    Averaging is a method of smoothing images by reducing the amount of intensity
    difference between pixels. It is done by combining an image with a normalized
    box filter. It calculates the average of all pixels under the kernel area and
    then replaces the central element by the average pixel value. This is done with
    the height of the function cv.blur() or cv.boxFilter().

    - Gaussian filtering:

    The Gaussian filter is linear. Here blurring is achieved by a Gaussian function.
    It uses a Gaussian kernel rather than a box filter. It is done using the function
    cv.GaussianBlur(), Gaussian blurring is highly effective in removing any Gaussian
    noise from an image.

    - Median filtering:

    A median filter is a nonlinear technique that is used to remove noise from an
    image. Here, it is a preprocessing step to improve the results. Here, the median
    of all pixels under the kernel area and the central element is replaced with the
    median value calculated by the cv.medianBlur() function. It is mostly used where
    salt-and-pepper noise resides. In the median blurring, the central element is
    always replaced by some pixel value in the image, whereas in the above filters,
    the central cost is newly calculated.

    - Bilateral filtering:

    A bilateral filter is a noise-reducing smoothing filter. It is highly effective
    in noise removal and at the same time, keeps the edges sharp. A filter used to
    do this is cv.bilateralFilter(). We already saw that a Gaussian filter takes neighbourhoods
    pixels while filtering. It does not consider whether the pixels have the same
    intensity, or it is an edge pixel. It blurs the edges we do not want. The bilateral
    filter uses a Gaussian filter, which is a function of pixel difference with a
    Gaussian filter in space. Both filters make sure that the edges are not blurred.


