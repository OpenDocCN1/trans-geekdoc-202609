    # 11.4.1 AUC–ROC CURVE


    AUC is called as Area Under Curve of Receiver Characteristic Operator. It is mostly
    used to visualize how our model performing well. ROC or Receiver Characteristic
    Operator is used for classification problem plots True positive vs False positive,[10]
    AUC or Area Under Curve is a measure to show how much portion is acquired by model.
    When AUC value is 1 that means our model perfectly and correctly classifies the
    True positive and False negative. If AUC value is 0 then our model wrongly classifies
    all False negative as True positive and vice versa. When AUC value is 0.5 that
    means our model is not to classify True positive and False negative. When AUC
    value falls between 0.5 and 1 there is a good and high chance that our model is
    correctly classifying the True positive and False negative.

    ROC Curve of KNN is shown in Figure 11.12.

