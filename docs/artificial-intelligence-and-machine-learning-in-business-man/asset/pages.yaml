  md: '# 210 Artificial Intelligence and Machine Learning in Business Management


    For the back-propagation, we have to calculate the derivatives of the loss function.


    ```

    $\delta e = \Delta t = o - \hat{o}$  (13.7)

    ```


    Now for the back-propagation of the LSTMs model.


    ```

    $\delta h_t = \Delta t + \delta h_t$  (13.8)

    ```


    $\Delta h$, Where $\Delta t$ is the difference between the output of subsequent
    layers and is the output difference as computed by the next time-step LSTMs.


    ```

    $$\delta c_i = \delta h_i \cdot o_i \cdot (1 - \tanh^2(c_i)) + \delta c_{i+1}
    \cdot f_{i+1}$$\n$\delta a_i = \delta c_i \cdot i_i \cdot (1 - a_i^2)$$\n$\delta
    i_i = \delta c_i \cdot a_i \cdot (1 - i_i)$$\n$\delta f_i = \delta c_{t-1} \cdot
    f_i \cdot (1 - f_i)$$\n$\delta o_i = \delta h_i \cdot \tanh(c_i) \cdot o_i \cdot
    (1 - o_i)$$\n$\delta x_i = W'' \cdot \delta s_i$\n$\delta h_{i-1} = U'' \cdot
    \delta s_i$  (13.9)

    ```


    The final updates to the internal parameters are computed:


    ```

    $$\delta W = \sum_{t=0}^{T} \delta s_t \cdot x_t$\n$\$\delta U = \sum_{t=0}^{T}
    \delta s_{t+1} \cdot h_t$  (13.10)\n$\$\delta b = \sum_{t=0}^{T} \delta s_{t+1}$

    ```


    To adjust the neural network model, previous weight values of the weight matrix
    must update by adding the multiplicative results of learning rate and changes
    in weight matrix.


    ```

    $W^{new} = W^{old} - \lambda \cdot \delta W$\n$U^{new} = U^{old} - \lambda \cdot
    \delta U$\n$b^{new} = b^{old} - \lambda \cdot \delta b$  (13.11)

    ```


    $W^{new}$ and $U^{new}$ and $b^{new}$ are new weights and bias value; $W^{old}$
    and $b^{old}$ old values and the $\delta W$, $\delta U$ and $\delta b$ are the
    change in weight and bias; and $\lambda$ is the learning rate of the neural network.'
