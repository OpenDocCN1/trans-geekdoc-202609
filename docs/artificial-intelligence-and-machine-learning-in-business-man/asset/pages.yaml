    (SMAPE), MLP was ranked one BNN, GP, GRNN, KNN, SVR, CART and BERT ranked. Along
    with this they used two models called recurrent neural network (RNN) and Long
    Short-Term Memory Network (LSTM). The comparison of top M3 models with six statistical
    methods (SES), Holt and Damped exponential smoothing and the fifth is combination
