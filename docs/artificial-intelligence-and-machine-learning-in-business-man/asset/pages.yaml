    # 13.2 RELATED WORK


    Various Learning-based prediction models have been implemented by many researchers
    to enhance the accuracy of the model. The standard deviation of daily forex data
    in the logarithm rate over a statistical model [1], weighted average of daily
    high and low-forecast rates are empirically better than daily close price. Forecasting
    of forex [2] rates using ANN (i.e., Standard Back-propagation (SBP), Scaled Conjugate
    Gradient (SCG) and Backpropagation with Bayesian Regularization (BPR)) outperformed
    ARIMA model. Moving average of different technical indicators are used to develop
    and investigate estimation, where SCG gave the best output among three ANN. Analysis
    of financial markets [3] applying ANN in USD vs GBP predicted with low values
    of MSE and conjunction with other forms of technical & fundamental analysis. Short-term
    exchange rate predictions are generally more accurate [4] than long-term. Use
    of weekly, monthly and quarterly datasets can increase the accuracy in long-term
    prediction. In comparison of different frequencies of input [5], one week ahead
    is better than one day & month ahead because weekly data have appropriate fluctuation
    information of exchange rate. To improve performance of the model, many researchers
    [6,7] have developed hybrid model merging individual methods. To increase accuracy
    of ensemble model, each individual performance must be good. A hybrid ANN applying
    logistic regressive models [8], genetically optimized adaptive ANN [9] to evolve
    the structure and multilayer neural networks. The outcome of the proposed model
    succeeded in achieving significant improvement in accuracy for we ahead prediction.
    Another hybrid structure [10] consisting of two parallel systems (Least Mean Square
    (LMS) and Adaptive Functional Artificial Neural Network (FLANN)) provides more
    accurate and efficient result than individual LMS and FLANN. Return Genetic Programming
    [11] has ability to select the best possible feature, network architecture and
    connectivity pattern to decide whether to use a recurrent connection or a feed-forward
    connection. The accuracy of the model increased with number of feedback paths
    and improves the capabilities of the network. As exchange rate forecasting became
    popular, use of various ANN techniques increased. The newly developed Deep Belief
    technique [12,13] had some improvements and gave better results than typical forecasting
    methods (such as Feed-Forward Neural Network (FFNN)). This improved model using
