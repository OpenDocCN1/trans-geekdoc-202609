    \ + b_f)$ (13.1)\n```\n\nShort-Term Memory networks (LSTMs) cell is shown below\
    \ in Figure 13.1. Next steps decide which new information is going to store in\
    \ the cell state. A sigmoid layer (i.e., input layer, $i_t$) outputs the updating\
    \ value and $tanh$ layer\n\n```\n$tanh = \\left(\\frac{e^x-e^{-x}}{e^x+e^{-x}}\r\
    ight)$ creates a vector value $a_t$\n```\n\n```\n$i_t = \\sigma(W_i \\cdot x_t\
    \ + U_i \\cdot h_{t-1} + b_i)$\nna_t = \\tanh(W_a \\cdot x_t + U_a \\cdot h_{t-1}\
    \ + b_a)$ (13.2)\n```\n\nPoint-wise multiplication of these two layers is used\
    \ when updating the cell state $C_{t-1}$ into $C_t$. The update is carried out\
    \ by adding the multiplication of $f_t$ & old state $C_{t-1}$ with $i_t * \\tilde{C}_t$.\n\
    \n```\n$c_t = f_t \\cdot c_{t-1} + i_t \\cdot a_t$ (13.3)\n```\n\nFinally, the\
    \ output operation is to be performed. The filtered version of the cell state\
    \ will be the output. First, output gate decides which of the cell state going\
    \ to output. We let cell state through $tanh$ layer and multiply with result of\
    \ output gate to get the final output.\n\n```\n$o_t = \\sigma(W_o \\cdot x_t +\
    \ U_o \\cdot h_{t-1} + b_o)$\nh_t = o_t * \\tanh(c_t)$ (13.4)\n```\n\nFor the\
    \ simplicity of the calculation, we regroup the above parameters in a matrix form.\n\
    \n```\n$S_t = \\begin{bmatrix} i_t \\ f_t \\ o_t \\end{bmatrix}, W = \\begin{bmatrix}\
