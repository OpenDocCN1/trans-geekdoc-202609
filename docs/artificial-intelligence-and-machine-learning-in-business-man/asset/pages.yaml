  md: '# 146 Artificial Intelligence and Machine Learning in Business Management


    Currently there are different online methods for learning and evaluation which
    include virtual classrooms, video/audio tutorials, eBooks etc. There is very little
    evidence on the application of AI as an online teaching tool. We would like to
    present AI techniques to evaluate the effectiveness of online learning methods.
    The techniques presented here are independent of the current evaluation methods
    described. The most commonly accepted system to test a student is through the
    question-and-answer method which relies on a sample-based questionnaire from a
    student and collecting the responses from the student/examinee. assessment is
    performed at the end of the course. An evaluation by this method is limited to
    the correctness of the answers and the forms based on how we infer the student''s
    knowledge on the subject. In this paper we propose that the student should be
    assessed on a continuous basis. This type of assessment is based on testing the
    student on a graded scale which is different from testing a student to qualify
    as ‘Pass’ or ‘Fail’. We focus on the AI techniques to assist grading the performance
    of a student in an online learning environment and provide a feedback to improve
    the learning process. A simple implementation based on Markov Decision Process
    is demonstrated to understand this approach.


    # 9.1 PROBLEM DESCRIPTION


    An online learning environment consists of learning material (lessons and associated
    questions), a lesson delivery mechanism and an evaluation process. All the three
    entities play a very important role in making the learning process very effective.
    It is important to note that all of these entities are related and share feedback
    to improve the effectiveness of the learning process. The student assessment is
    done through an evaluation process on a continuous basis till the student completes
    the online course. The evaluation is based on the question and answer Model. The
    questions are focused to test the student on the subject that has been learned
    recently.


    In this paper we will be focusing on the Evaluation Process driven by AI techniques.
    The evaluation is performed at regular intervals. It is an accepted fact that
    the effectiveness of the Learning Systems can be measured from the knowledge or
    skills acquired by the student. Hence the performance evaluation should be done
    as accurate as possible to provide a feedback to the learning environment to improve
    the learning process.


    +   1 SaharaNext, Lucknow, India. 2 Shri Ramswaroop Memorial University, Lucknow,
    India


    Hence the problem folds into:


    To improve the performance of the learning process, to provide a good feedback
    to the learning environment, by evaluating the students learning through online
    methods.


    # 9.2 THE ONLINE LEARNING ENVIRONMENT


    Content Delivery and Evaluation Process are the key components of the online learning
    environment. The main objective is to provide an environment for the student to
    acquire the desired knowledge/skills. The content delivery is mainly responsible
    for'
