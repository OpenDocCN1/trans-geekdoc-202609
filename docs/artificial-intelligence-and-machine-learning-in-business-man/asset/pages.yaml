    # 13.4 RESULTS AND SIMULATIONS STUDY


    In this study, we have implemented three neural network models, BPNN, FLANN and
    LSTM, for forecasting forex values. We have considered and compared five different
    currency exchange values for prediction using these three models. The historical
    exchange rate value couldn''t be applied directly to the prediction models, so
    we need to go for extracting features from the historical data and details of
    the data preparation explained in section 13.5.1, as well as to evaluate the prediction
    accuracy, we need to rely on some performance measures, as discussed in section
    13.5.2.


    # 13.4.1 DATA PREPARATION


    The historical data sets were downloaded from the Financial Forecast Center (www.forecasts.org).
    Five different currencies (Indian Rupee (INR), Australian Dollar (USD), Canadian
    Dollar (CAD), British Pound (GBP) and Japanese Yen (JPY) in terms of 1 US Dollar,
    are obtained over the period of January 2012 to April 2018. There are 1,570 daily
    exchange rate samples are obtained in each exchange rate datasets.


    After downloading the data sets, these samples are initially normalized in the
    range of [0,1], max–min normalization techniques. Using the concept of sliding
    window, the input feature patterns are determined from the normalized samples.
    Similarly, the subsequent input feature patterns have been extracted by sliding
    the window size one step at a time and so on. From the samples of sliding window
    three features are extracted, those are 12th value, mean and standard deviation.
    The data having N samples and W sliding window size, the total number of generated
    will be (N–W+1). For this study we have taken window size as 12 as many researchers
    have reported the same window size for their analysis in this domain. The extracted
    feature patterns are further divided into two different sets by splitting 80%
    samples for the training purpose and 20% samples for the testing purpose.


    # 13.4.2 PERFORMANCE MEASURE


    To evaluate and validate the performance of the prediction models, we have used
    two widely accepted error measures, Mean Absolute Percentage Error (MAPE) and
    Root Mean Square Error (RMSE). The less MAPE and RMSE value we obtained during
    testing of the prediction the more accurate is the prediction. These two error
    measures can be calculated as follows:


    ```

    MAPE = \frac{1}{n}\sum\frac{|d_a - d_f|}{d_a}*100\%

    ```


    ```

    RMSE = \sqrt{\frac{1}{n}\sum(d_a - d_f)^2}

    ```


    Where $d_a$ is the actual forex value, $d_f$ is the predicted forex value and
    n is the number of testing sample carried out for the prediction.'
