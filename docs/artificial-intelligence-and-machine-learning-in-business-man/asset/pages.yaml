    AI is developed and adopted in banking sector. It aims to impart some basic idea
    on the area of practical AI application and how this technique is used and helpful
    for the banking sector. Here through this chapter has been made to explore about
    the banks who have started implementing the AI and ML solution doing their business
    and at the same time highlighting the benefits they avail of.


    Section 4.1 is the Introduction, which gives a brief description of Artificial
    Intelligence with ML, AI application in finance area with the special focus on
    banking sector. 4.2 summarizes the areas where AI can be applied and how it works
    in particular for both banks and clients. 4.3 deals with the adoption of AI technology
    by Indian banks as case study and the companies who providing such technology.
    4.4 contains benefits and influence of AI and ML on banks with respect to different
    parameters of Key Performance Indicator (KPI) like profitability, performance
    and reduction of number of frauds. Lastly, Section 4.5 presents remarks along
    with the future of AI implemented banking industry. Figure 4.1 shows the conceptual
    framework of AI application on banking sector.


