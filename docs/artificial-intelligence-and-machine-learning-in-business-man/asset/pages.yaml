    problems. By a result, lot of time and resources spent in the process of model-building
    entails examining of increasing variables to use in the model. It may take more
    time than is to adapt a neural network or a decision tree to a set of variables
    this large.


    The collection of features helps the variable range to be minimized in size, providing
    a more accessible range of modelling attributes. There are some advantages of
    introducing feature selection to the analytical procedure:


    +   - Streamlines and narrows the spectrum of the characteristics that is important
    in constructing a predictive model.

    - Minimizes the processing time and memory demands for the creation of a predictive
    model, so that attention can be drawn to the most relevant subset of predictors.

    - Leads to lead models that are more precise and/or parsimonious.

    - Reduces time for scores to be generated since only a subset of predictors is
    based on the predictive model.'
