    digital transaction because of several advantages. One of the most important benefits
    of digital transaction is that it saves time. Customers no longer have to visit
    ATMs and stand in a queue to withdraw money. Whenever they want to make payment,
    they have to swipe the card and enter the PIN or need to provide OTP while doing
    shopping. Another important reason for the promotion of electronic transaction
    is to trace the flow of black money and charge tax defaulters.


