  md: '# Consumer Insights through Retail Analytics


    +   c) Behavioural data: Under this category data pertaining to consumers’ transactional
    details, such as buying history, trail and usage information, repeated purchases
    and some qualitative data like mouse movement information.


    +   d) Attitudinal data: This type data is related to consumer metrics of customer
    satisfaction, criteria of purchases, product desirability and customer loyalty.


    # 2.4 APPLICATION OF CONSUMER DATA – RETAIL ANALYTICS


    There are several ways by which retail companies can use the consumer data that
    they collect so to draw relevant consumer insights:


    +   i. Enhancing Customer Experience: Consumer data offers an avenue to the retail
    organizations to get a better understanding of their customer needs to not only
    meet their customers'' expectations. But also gain a competitive advantage by
    exceeding the customer expectations based on the insight they gained from retail
    analytics. For example, analyzing customer behaviour along reviews and feedback,
    companies can gain agility in fine tuning their physical as well digital presence
    of goods, or services or brand to align the current competitive landscape.


    +   ii. Creating effective marketing strategy: Data which is contextualized can
    identify how consumers are engaging as well as responding to their marketing campaigns,
    and thus in the process that will be able to personalize the marketing strategy
    as per the target needs. The predictive power of retail analytics can improve
    the effectiveness of the current marketing strategies in meeting not only present
    needs of the consumers, but also be ready for all possible futures of their current
    as well as potential consumers.


    +   iii. Transformation of data into cash flow: Increasingly, companies who are
    using retail analytics to make their business decisions are the turning out to
    be more profitable than those who do not. Consequently, service providers who
    deal in buying and selling information on customers are tremendous boost in their
    business operations. Thus, the businesses that capture large amounts of data,
    transforms it into valuable insights and then they will represent opportunities
    for new revenue streams.


    +   iv. Securing More Data: In this case consumer data is often used as a means
    of securing information which are highly sensitive in nature. For instance, increasingly
    most of the retail banks are using cutting technology like voice recognition to
    authorize a user to access their financial information so as to safeguard for
    fraudulent attempts to steal their sensitive information. Thus, with growing sophistication
    in data capture and analytics technologies, the retail organizations will have
    to up their game by finding novel and comparatively more effective ways to collect
    and contextualize data on each and every interaction point with their customers
    (Table 2.1).'
