    # 14.3.4 BIAS IN AI APPLICATIONS


    In order to address the issues of bias that get inbuilt in AI systems and end
    up discriminating sections of society, utmost care has to be in the design and
    training phase of the application development. Ideally, system designers should
    be aware of possible biases that exist in a given status to avoid them. However,
    this may not always be known to the system themselves. Therefore, efforts need
    to be in selecting training data that is representative of all categories of end
    users. Algorithmic techniques are employed at pre- and post-processing levels
    to reduce bias. Techniques like balancing sensitive data, removing sensitive attributes,
    transforming model''s prediction to satisfy fairness constraints, imposing fairness
    constraints on the optimization process and innovative data training techniques
    are used to prevent biases of offline system from creeping in AI systems [133].


    Efforts to increase explainability of deep learning models are made to identify
    which factors are considered by algorithms to those bias. A participatory design
    approach needs to be followed to make sure target users are involved in all phases
    of싼 design.


    However, the key challenge is in defining ''fairness''. There are multiple definitions
    for fairness at both individual and group levels. None of the definitions are
    exhaustive and cover all aspects of fairness. Thus, selecting what parameters
    an AI system should adhere to is a fairly complex task. Expecting data scientists
    and engineers to get involved at level of definitional complexity in addition
    to their already challenging technical roles is not practical. Organizations need
    to invest in ethics specialists who can work with AI teams and guide them in such
    matters.


