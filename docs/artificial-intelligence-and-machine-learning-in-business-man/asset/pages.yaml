    Google Index gave a better result. The modelling of tourist data in the form of
    “tourist volume series + Baidu index + Google index” provided more accuracy and
    robust results. This completes the studies formed by [22,23].


    Feizabadi [24] used ML techniques to forecast demand and supply chain performance.
    ARIMAX and Neural Network in their hybrid form used to forecast variance amplification
    emanating of demand and supply chain information from multi-stage supply chain
    distortion. The modelling with ML significantly improved the forecasted results.'
