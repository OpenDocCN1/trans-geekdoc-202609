  md: '# 11.3.3 RANDOM FOREST CLASSIFIER


    Random forest is a type of ensemble technique that is used for both regression
    and classification problems. It contains a large number of decision trees to find
    the output. Every decision tree uses its own to find the better result. Then,
    after getting all the results from these decision trees, random forest polls to
    find which output is best. [6] The classification problems and the class that
    get maximum votes become the output of the random forest model. For regression,
    the mean value of the score is the final output of the model. Random forest always
    looks for better features from the data, rather than just taking all data. It
    starts from the root node and moves towards the leaf node, and the final output
    is always present in the leaf node [7]. For classification tasks, leaf node contains
    the predicting class. Whilst both decision tree and random forest work in a similar
    way, there exist differences in the operations. In deep decision tree there might
    be a chance of overfitting, random forest handles the situation by taking the
    subset of features and building smaller trees using those subset features. It
    then combines smaller trees to arrive at the final outcome. Random forest provides
    better results in comparison to decision trees from low bias and high variance
    problem so it may not get accurate prediction values.[8] Therefore, to overcome
    such type of problem in random many number of decision trees are used so that
    the high variance can be reduced, and it will provide more accurate prediction.
    The main problem with random forest is it makes the process slower when number
    of decision tree increases.


    We applied the random forest algorithm to build the model as it handled the imbalanced
    dataset very well. After creating the model, we tested it with train dataset,
    which returned an accuracy of 0.99786647201796. But when we tested the model with
    unseen data or test dataset, we got an accuracy of 0.9864, which is a good one.


    # 11.3.4 XGBOOST


    XGBoost is a new kind of Machine Learning algorithm which is an implementation
    of gradient boosted decision trees designed for speed and performance. XGBoost
    is a perfect combination of hardware and software to solve Machine Learning problems.
    It takes very long time and provides better result in comparison to other algorithm.
    It is also called "Extreme Gradient Boosting" [9]. Boosting is an ensemble technique
    where new models are added to correct the errors made by existing models.


    XGBoost uses parallelized approach to build sequential decision trees which takes
    less time than other tree-based algorithm. This algorithm is designed to make
    efficient use of hardware resources using the buffers properly which make it faster.
    XGBoost supports both regression and classification problems. Even in most of
    the problems, XGBoost does not require hyperparameter tuning; it naturally performs
    better. For this reason, XGBoost is the most preferred by modern day data scientists.


    We used XGBoost algorithm on our dataset to see its performance. When we tested
    the model with training data, we got an accuracy of 0.995107476220108'
