    a typical human resource management department deal with employee churn. By using
    this model, we can predict which employee will leave the organization in the near
    future by analyzing the previous data set of the organization in a meaningful
    way. If the human resource management get this information early enough, they
    can take steps to manage employees, and for the benefit of organization [3]. As
    per various research, acquiring a skilled employee is more difficult than maintaining
    them. Hence, no organization will want to lose their workforce. To develop this
    model, factors as salary, satisfaction level, performance evaluation and work
    accident rates are taken into consideration. We have implemented various Machine
    Learning algorithms, like random forest, XGBoost, KNN and tried to get more accu-rate
    model which can give better performance.


