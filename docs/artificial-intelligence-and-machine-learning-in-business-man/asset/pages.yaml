    Restricted Boltzmann Machines has ability to model continuous data. Adaptive Smoothing
    Network [14] uses adaptive smoothing techniques to adjust the ANN learning parameters
    automatically. This model tracks signals under dynamic environments, and speed
    up training process and convergence, and make network''s generalization stronger
    than the traditional Multilayer Feed-Forward Network (MLFFN). Similarly, regularized
    dynamic self-organized multilayer perceptron [15], using immune algorithm improve
    the financial time series prediction. Multilayer Perception [16] used the old
    statistical techniques such as Simple Moving Average (SMA) and Autoregressive
    Moving Average (ARIMA) as input and computed with Single Layer Perceptron (SLP),
    Multilayer Perception (MLP), Radial Basis Function (RBF) and Support Vector Machine
    (SVM). A paper on SVM [17] has demonstrated a better forecasting performance than
    ARIMA based model. Efficient prediction of forex rate.[18] single layer ANN model
    with non-linear inputs is trained using past data, yields excellent prediction
    and predict one month ahead. Bootstrap-strap [19] multiple neural network (for
    both daily and weekly) time series prediction, use contrast machine learning and
    each model output with the help of combination. This function works better than
    the traditional simple model (Neural network, support vector machine, etc.). Two
    stage forecasting model [20] incorporates parametric (ARIMA and Autoregressive)
    and non-parametric (MLP and SVR), which is able to estimate the parameters of
    the mathematical model by determine the number of values of dependent & independent
    variables. For quadratic convex programming problem, the Support Vector Regression
    (SVR) outperforms the MLP by achieving a global optimum. The simple ANN with single
    or multiple or hybrid neural network has been applied with various learning algorithms.
    However, these models struggle with long term dependency problem. Then any architecture
    unit to memorize by storing the previous data is able to handle long-term dependency
    problem by the model can be useful to minimize the error as well as to enhance
    the performance of the model. By day by day, the deep learning neural network
    models are gaining popularity due to their characteristics of processing long
    sequence of data makes itself successfully and widely applying to the Machine
    Learning applications. One of these applications is [21] for speech recognition
    and a bidirectional LSTM is produced by the authors in that a well-trained RNN
    is able to provide better results. One more research has reported for stock market
    prediction using RNN based model [22]. The accurate prediction of stock prices
    is difficult due to its volatility and non-linear features. With the advantage
    of LSTM memories of RNN architecture, it is possible to forecast the stock values
    with a greater precision. The application of Long Short-Term Memory Neural Network
    (LSTM)[23] has also been reported in the field of tourism flow and the experiments
    reveal that LSTM model performed well than the adaptive models (Auto Integrated
    Moving Average (ARIMA)) model and Back Propagation Neural Network (BPNN). A stacked
    LSTM [24] model is used successfully for sentiment intensity prediction and outperforms
    lexicon-, regression- and conventional NN-based methods proposed in previous studies.
    Then, we thought to use LSTM for exchange rate forecasting to achieve high prediction
    of accuracy.'
