- pgno: 9
  md: "# Preface\n\nThe focus of this book is to introduce Artificial Intelligence\
    \ (AI) and Machine Learning (ML) technologies in the context of Business Management.\
    \ The advent of AI & ML technologies has the potential to deeply impact the traditional\
    \ ways of managing businesses. The book consists of the introduction of Artificial\
    \ Intelligence and its relationship with other technologies. The reader will also\
    \ get to know the impact and challenges associated with this. The remaining chapters\
    \ will cover the impacts of AI and ML in various fields of business and management\
    \ which operations management, marketing management, human resource management,\
    \ finance and strategy.\n\nThe chapters of the book will give insights into the\
    \ implementation and impact of AI & ML to business leaders, managers and technology\
    \ developers and implementers.\n the maturing use of Artificial Intelligence or\
    \ Machine Learning in the field of business intelligence, this book examines a\
    \ number of innovative uses of AI beyond data organization and access. It follows\
    \ the Predictive Modelling Toolkit for providing insight on how to use AI tools\
    \ in the field of business. It explores cultural heritage and risk assessments\
    \ for mitigation and conservation and discusses on onshore and off-shore technological\
    \ capabilities and spatial tools for addressing marketing change and change in\
    \ retail, insurance and healthcare system etc. Taking a multidisciplinary approach\
    \ for using AI, this book provides a single comprehensive resource for undergraduate,\
    \ graduate, business professionals and related disciplines.\n\nNowadays, AI improves\
    \ in the area of supply chain to track the product, to provide intelligence in\
    \ industry field, to finance field etc. In this regard, the traditional approach\
    \ of teaching and learning is not meeting the requirement of the policies of Industry\
    \ 4.0 revolution. Here, we edited this book to minimize the gap between academia\
    \ and industry.\n\nThe book is organized in 15 chapters:\n\nChapter 1, Artificial\
    \ Intelligence in Marketing, discusses how AI help to the making people better\
    \ understand the speech (recognition) by applying techniques like text mining,\
    \ with latest advancement in programming it has made modelling of direct marketing\
    \ responses and predicting churn using classification trees and machines to better\
    \ understand customer needs.\n\nChapter 2, Consumer Insights through Retail Analytics,\
    \ describes an in depth understanding on how Indian retail companies such as ‘Shoppers\
    \ Stop’ and ‘Future Group’ are exclusive among customers’ and other transaction\
    \ data to predict their future purchase behaviour and design product placement\
    \ strategies.\n\nChapter 3, Multi-Agent Paradigm for B2C E-Commerce, discusses\
    \ the business applications of KBS, CBR, ANN, GA and MAS along with negotiation,\
    \ customer relationship management and customer orientation. From computational\
    \ point of view, agent characteristics, multi-agent paradigm and its communication\
    \ protocol also been discussed. Lastly, the chapter describes the Belief-Desire-Intention\
    \ (BDI) architecture for mental state and other cognitive parameters such as"
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Preface


    preference, commitment, and capability required for computation of trust in any
    e-business system to formalize the internal architecture of complex agents.


    Chapter 4, Artificial Intelligence and Machine Learning: Discovering New Way of
    Doing Business, illustrates the impact of AI and ML application on finance with
    the principal focus on Banking sector, how AI affects customers, maintains the
    customer relationship, influences business performance and how AI will change
    future of Banking sector. Artificial Intelligence is one of the front digital
    transformation strategies that can spread in the area of finance today.


    Chapter 5, Analysis and Comparison of Credit Card Fraud Detection Using Machine
    Learning, discusses fraud detection technique to protect or prevent the cardholder
    from huge losses. To determine the fraud transaction various deep learning like
    Long Short-Term Memory (LSTM), Gated Recurrent Units (GRU), Convolutional Neural
    Network (CNN), and Multilayer Perceptron (MLP) have been used.


    Chapter 6, Artificial Intelligence for All: Machine Learning and Healthcare: delves
    on the healthcare sector as its main threat area to the application of Machine
    Learning. The role of ML is to help the common people to access healthcare facilities
    without any constraints.


    Chapter 7, Demystifying the Capabilities of Machine Learning and Artificial Intelligence
    for Personalized Care, discusses Machine Learning enabled Artificial Intelligence,
    which detects the abnormality at an early stage, where physician, as well as patient,
    can be alerted early about a future disease or health conditions, enabling early
    entry to provide early treatment with personalized recommendation and physicians,
    as well as patients, look at these technologies along with small case studies.


    Chapter 8, Artificial Intelligence and the 4th Industrial Revolution, focuses
    on briefly understanding the threads of governance over data privacy, net ethics
    and cybersecurity issues and underscores the need for broader laws and policymakers
    in the future. The transformative impact of Artificial Intelligence, Machine Learning
    and embedded technology will shape the new economy and market space. How will
    the economies, markets, ecosystems and organizations react and respond in this
    ever-expanding interconnected world to be seen.


    Chapter 9, AI-Based Evaluation to Assist Students Studying through Online Systems,
    focuses on the AI techniques used to grade the performance of students in an Online
    Learning Environment and provides a feedback to improve the Learning Process.
    A simple implementation based on Markov Decision Process is present to understand
    this approach.


    Chapter 10, Investigating Artificial Intelligence Usage for Revolution in E-Learning
    during COVID-19, examines the portrayal of AI in E-learning during COVID-19 and
    apart from discovering the role of AI during this pandemic. The study has investigated
    the future of AI in E-learning post COVID-19.


    Chapter 11, Employee Churn Management Using AI, describes an AI model which can
    help the Human Resource Management to anticipate which representative can leave
    the association in not-so-distant future by investigating the past index of the
    association in a significant manner.'
