    # 12.4 CONCLUSION


    The above literature review shows that ML play crucial roles in the domain of
    forecasting time series data. The use of eight individual models by Moghamad et
    al. [16] and eight families of Machine Learning models called MLP, BNN, RBF, GRNN,
    also called Kernel Regression, K-Nearest Neighbour Regression (KNN), CART Regression
    Trees (KART), SVR and Gaussian Processes (GP) by Makridakis et al. [15] show that
    Machine Learning has better prospects over traditional models. Chen et al. [13]
    and Chang et al. [12] also used GA and two-stage procedure to forecast small samples
    in early hours of the business showed results over traditional models. The overall
    analysis of the models and techniques used for the purpose of forecasting time
    series data indicate that ML techniques will become the future learning tools
    in the field of forecasting.


