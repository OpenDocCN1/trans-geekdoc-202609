  md: '# AI-Based Evaluation to assist Students Studying through Online Systems 149


    The student who does not have any knowledge about snakes can answer ''YES''. But
    if someone says ''NO'', then we can infer with high probability he/she knows the
    species of snakes.


    # Example 2:


    +   - Python is a programming language

    - TRUE

    - FALSE


    The student who does not have any knowledge on programming languages can answer
    ''YES''. But if someone says ''NO'', then we can infer with high probability he/she
    does not know Python Programming Language.


    # Example 3:


    +   - Which is the heavier metal?

    - Aluminium

    - Copper


    The student who answers copper, may not know the density of copper (8,940 Kg per
    m³) and that of aluminium (2,710 Kg per m³).


    In summary, it is difficult to infer the knowledge of a student from these types
    of questions.

    The second type of question used widely is MCQ (Multiple Choice Question). The
    question presents a few choices and asks for an answer from these. The right answer
    could be one or more from the list of choices given.


    # Example 4:


    +   - For a given area, which shape has the smallest circumference?

    - Square

    - Triangle

    - Pentagon

    - Circle

    - Do not know


    If the student selects ''Circle'', can we infer that he/she has knowledge on calculating
    area and circumference of various shapes and optimization techniques? If the student
    has prior knowledge or familiarity with this question, then he/she can select
    the right answer. However, if the student selects any answer other than Circle,
    then we infer that he/she does not know how to use optimization techniques. We
    can assume that this student knows how to calculate the area and circumference
    of different shapes? The intention of the question always be to find one and only
    one aspect of knowledge. Hence if the intention of question is to test the knowledge
    on area or circumference of various shapes, then we should reframe the question.'
