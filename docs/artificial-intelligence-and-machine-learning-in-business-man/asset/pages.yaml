    machine algorithm [19] is to find a hyperplane in N-dimensional space (N = the
    number of features) that distinctly classifies the data points as shown in Figure
    15.9. To separate the two classes of data points, many possible hyperplanes could
    be chosen. Our aim is to find a plane that has the maximum margin, i.e., the maximum
    distance between data points of both classes. Maximizing the margin offers some
    reinforcement so that future data can be categorized with more confidence.


    Support vector classifier is given in Figure 15.9.


    Hyperplanes are decision boundaries that help categorize the data points. Data
    points lying on either side of the hyperplane can be attributed to distinct classes.
    Also, the dimension of the hyperplane depends upon the number of features. If
    the number of input features is 2, then the hyperplane is just a line. Support
    vectors are data points that are closer to the hyperplane and determines the position
    and orientation of the hyperplane. Using these support vectors, we maximize the
    margin of the classifier.'
