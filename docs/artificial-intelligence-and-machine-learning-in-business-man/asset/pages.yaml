  md: '# Artificial Intelligence and Machine Learning in Business Management


    Selection of features consists of three steps:


    +   1. **Screening** – Unimportant and problematic predictors and cases are excluded.

    2. **Ranking** – Sorts and assigns ranking to the remaining predictors.

    3. **Selecting** – Determines the significant subset of characteristics to be
    included in future models.


    The algorithm mentioned here is restricted to the mention of supervised learning
    in the target variable is estimated using a series of predictor variables. Any
    variable can be, either, categorical or continuous in the analysis. Common target
    variables determine whether or not a client chooses, whether a person would buy
    or not, and whether there is a presence of disease.


    The phrases traits, causes and traits are also used interchangeably. In this document,
    while addressing feedback to the feature selection algorithm, we use variables
    and predictors, with features relating to the predictors that are currently chosen
    for in later modelling procedure by the algorithm.


    # 3.4 CONCLUSION


    In this chapter we have illustrated a variety of notions/concepts relating to
    modern intelligent computing methods to implement the various functionalities
    of e-business. The concepts of brokering customer orientation, customer relationship
    management and negotiation have been outlined and described to make the content
    meaningful and relevant. Agent characteristics, the multi-agent device model and
    its communication protocol from a computational point of view also been elaborated.
    The functions and methods of Artificial Intelligence, concepts of supervised and
    unsupervised learning, decision tree, neural network and sensitivity analysis
    have also been explained to understand their applications in e-commerce.


