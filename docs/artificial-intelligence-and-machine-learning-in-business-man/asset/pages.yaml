    +   (i) Negotiation is a method of interaction aimed at settling a disagreement
    in interests between two or more parties with the help of a given protocol and
    agents'' techniques [30].

    (ii) Typically, the protocol follows the sequence of steps agents need to take
    during negotiation, while the techniques of the agents are part of their thinking
    process (which requires collecting and evaluation knowledge and providing components
    of generation) [4,6].

    (iii) Negotiation is the practice of negotiating with each other through a group
    of agents to obtain consensus on a matter of mutual concern. The purpose of negotiation,
    as be deduced from the aforementioned description, is to reach an agreement that
    fits the preferences or restrictions of the agents, but such meetings do not necessarily
    end up in an agreement (and an agent can obtain zero or negative utility from
    it).

    (iv) Non-agreement can arise from a lack of time, an unavailability for the participants
    of suitable alternatives (which may result from a lack of information about the
    inclinations of the participants), or an incompatibility between the agents''
    strategies [9,18]. However, both parties are generally committed to ensuring the
    substance of the agreement if it is possible and the agents are genuinely willing
    to implement it [8].


