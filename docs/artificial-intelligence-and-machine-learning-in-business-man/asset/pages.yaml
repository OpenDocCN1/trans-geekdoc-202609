- pgno: 11
  md: 'Preface


    Chapter 12, Machine Learning: Beginning of New Era in the Dominance of Statistical
    Methods of Forecasting, briefly covers the popular empirical studies forecasting
    and ML (AI) methods used for the purpose of forecasting and their outcomes and
    suggestions for the future cope of study.


    Chapter 13, Recurrent Neural Network-Based Long Short-Term Memory Deep Neural
    Network Model for Forex Prediction, provides the historical data of different
    countries on a daily basis that are compared separately using Back-propagation
    Neural Network (BPNN), Functional Link Artificial Neural Network (FLANN) and LSTMs.
    Comparing daily exchange rate prediction of these three models, LSTMs model outperformed
    with maximum accuracy with faster convergence.


    Chapter 14, Ethical Issues Surrounding AI Applications, highlights ethical issues
    and approaches that are currently undertaken to address in the different domain.


    Chapter 15, Semantic Data Extraction Using Video Analysis: An AI Analytical Perspective,
    deliberates on extracting vehicle numbers off vehicles from a CCTV captured video
    through four steps, including conversion of video to a continuous image sequence,
    image segmentation, character segmentation and character recognition, with preprocessing
    at every stage to improve the quality of input data available for the next step.
    In the era of the growing complexity of problems along with the increasing functionalities
    offered by video analytics, this can be the most basic and generic solution supporting
    many applications.'
