    \ are passed through the block (Figure 13.1) and activated using Sigmoid function.\
    \ The gate $f_t$ decides what information to discard from the state using Sigmoid\
    \ activation function $s=\\frac{1}{1+e^{-x}}$ over the inputs $h_{t-1}$ and $x_t$,\
    \ where $h_{t-1}$ is the input from previous hidden layer and $x_t$ is the input\
