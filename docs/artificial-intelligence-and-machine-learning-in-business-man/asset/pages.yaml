    have autoimmune disease through IT and practicing the replacement of time where
    patients and physicians make interventions. Then health benefits are assessed
    with improved clinical outcomes. [16] suggests healthcare from temporality that
    IT and analytics to be generated by healthcare provider organizations for identification,
    tracking and analyzing of health situations at appropriate times of timeliness
    is an essential factor in monitoring and managing services and activities of chronic
    diseases.


    The theory deals with when tasks and services are consumed by a group in the treatment
    of chronic disease, which also includes how an individual is being treated. The
    assumptions made by [16] are restricted to lifestyle chronic disorders and do
    not include infectious treatment or protocols to be followed in the treatment
    of acute diseases. However, there are some cases available in the present situation,
    where the theory stands true for acute and infectious conditions also. Patients
    with lifestyle disorders will be happy to engage and collaborate during their
    treatment period prescribed by the provider. However, [17] identified non-compliance
    in diabetic type-2 patients and concluded that they remain escape from the project.


    For the implementation of better displacement of the intervention of time between
    care, a provider must be provided with IT and analytics, with the capabilities
    of codifying the time factor, treatment class, cost and consequences. Assimilation
    of information into IT systems enables knowledge to be accessible, captures and
    transmitted directions and details distributed, which expands the collaboration
