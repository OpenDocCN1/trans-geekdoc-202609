    # 3.2.4 FOUNDATION FOR INTELLIGENT PHYSICAL AGENTS (FIPA)


    FIPA is a global non-profit community of businesses and establishments that share
    the initiative to develop standardized agent technology requirements. FIPA is
    designed not only as a single-application technology


    The following set of principles is at the centre of FIPA ():


    +   1. Agent innovations have a modern framework for addressing old problems and
    new ones.

    2. A large degree of maturity has been achieved by technologies of agent.

    3. Standardization is necessary for certain agent technology to be of use.

    4. It has been shown that standardization of generic technology is feasible and
    that other standardization for agent produces successful outcomes.

    5. It is not a priority to standardize the internal mechanics of the agents themselves,
    but rather the framework and language needed for accessible coordination.


    The communication of agents in FIPA is focused on the passing of messages, where
    agents interact by formulating and sending each other messages. By setting forth
    the encoding, grammar and pragmatics of the texts, the FIPA ACL defines a basic
    message language. A specific method for the internal transport of messages is
    not laid out in the standard. Instead, FIPA specifies that messages transported
    between platforms should be encoded in a textual format, because different agents
    may operate on different platforms and use different networking technologies.
    The agent is believed to have some way to convey this kind. The ACL syntax is
    very similar to the commonly used language KQML. However, there are fundamental
    differences between ACL and KQML, considering syntactic resemblance, the amass
    the presence of a formal semantics for ACL that can eradicate complexity and uncertainty
    from the use of the language. Through defining contact protocols, the specification
    facilitates typical types of inert-agent conversations, which are patterns of
    messages shared by two or more agents. These protocols vary by basic query-request
    methods to better know negotiation method for contracts and auctions in English
    and Dutch. Other elements, including agent-software integration, agent agility
    and protection, ontology service, and human-agent communication, are defined in
    other sections of the FIPA standard. Even so, they have not been taken into account
    in the implementation of JADE [60,67].


    FIPA reference model is given in Figure 3.1.


    FIPA-compliant Agent Framework comprises the DF (Directory Facilitator), ACL (Agent
    Contact Channel) and the AMS (Agent Management System). These agents are all enabled
    synchronously at the start-up of the agent platform. It is possible to break the
    agent platform into many hosts (where the firewall is absent between them). In
    order to implement multi-domain applications, a set of FIPA-compliant (Directory
    Facilitator) DFs can be initiated at runtime.'
