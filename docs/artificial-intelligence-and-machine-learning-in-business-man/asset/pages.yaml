    # 12.1 INTRODUCTION


    Robotics and robots have intelligence to sense like human beings. The algorithm-based
    AI in these machines brings a new era of scientific journey. From recognition

    of voice to sensing of human emotions and working somehow beyond systematic

    patterns have completely changed the outcomes predicted with the help of statistical

    modelling. AI techniques based on trial and error are consistently changing, with

    outcomes improved each time (Hamzaeeebi et al. [1], Deng [2], and Suganthan

    [3], Salaken et al. [4]).


    In line with the above outcomes, the use of AI for the forecasting of time

    series data became a peculiar subject attracting attractions. The use of ML in
    form of

    eural network gained momentum. A number of research papers based on MLS suggested
    methodological advancement to improve accuracy in the forecasting of the future.
    In recent years, forecasting of stock gained momentum and dominated the field
    of forecasting. The forecasting of stock prices is classified into two branches:

    one called fundamental analysis, and the other technical analysis. The concept
    of

    fundamental analysis is based on a company’s financial statement analysis, while

    technical analysis incorporates past historical data to find future trends. The
    accuracy

    of forecasted results depends on the modelling of data with appropriate models.
    In


