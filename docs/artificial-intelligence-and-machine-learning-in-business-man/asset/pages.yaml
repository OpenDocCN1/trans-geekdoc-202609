  md: '# Artificial Intelligence and Machine Learning in Business Management


    through supervised, unsupervised and reinforced learning. In supervised learning,
    several input and output sets are provided to the machine. In this approach, data
    is fed to an algorithm and the machine tries to recognize the relationship between
    the input and the output. When the machine has stopped learning – in other words,
    it has learned optimally – the learned model can predict the value or class of
    new data points. For example, a system can be trained to differentiate between
    a kangaroo and a koala. By feeding the system with dozens of images of both animals,
    the system will learn about the features which distinguish each and improve its
    prediction. In unsupervised learning, data is analyzed without trying to make
    any predictions. It is focused on learning and understanding the underlying structural
    properties and associations between the observed data. This kind of learning can
    be used in detecting outliers, classifying and segmenting customers and the market.
    In reinforcement ML, the system does not have historical data to draw conclusions;
    instead, the algorithm learns by taking different actions and evaluating its successes
    and failures. Reinforcement learning is used by Facebook in advertising on it
    when it flighted for the first time. With time, and when sales rise, Facebook''s
    algorithms analyze the data available, and it then shows the advertisements to
    sets of customers, in certain geographical locations, at times of the day and
    using on-screen placements.


