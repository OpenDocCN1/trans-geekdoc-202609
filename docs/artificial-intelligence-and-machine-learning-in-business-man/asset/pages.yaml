- pgno: 174
  md: '# 9.6 EVALUATION PROCESS


    As stated above, the learning environment has two related entities: content delivery
    and evaluation process. Content delivery is not within our present scope. However,
    we will discuss the necessary feedback elements required to bind it with the evaluation
    process. We shall proceed to build a template implementation of Evaluation Process
    to demonstrate the use of RL techniques.


    The main tasks to be performed by the Evaluation Process are:


    +   1. Question delivery

    2. Performing the test

    3. Metrics collection

    4. Assessment

    5. Feedback to other agents


    # 9.6.1 QUESTION DELIVERY


    Question delivery comprises of question selection based on the current state of
    the evaluation, student level and the attributes of the question. When the question
    is selected, it is presented to the student to answer. This is not our main scope,
    and hence we shall force a question to the student. However, the feedback from
    the evaluation process is important to ensure the questions are managed to follow
    the rules mentioned in Table 9.1. This is achieved by binding attributes to the
    questions.


    # 9.6.2 QUESTION ATTRIBUTES


    The attributes of the question required is classified as static and dynamic. The
    static attributes, given in Table 9.2, are only referred by the Evaluation Process.
    They do not change during the life of the question and assigned while the creation
    of a new question. The dynamic attributes are updated mainly by the evaluation
    process to provide a feedback to the learning environment.


    # TABLE 9.1

    Rules and Its Relationship with Evaluation Process


    | Rule to be Associated | Question delivery | Presentation | Evaluation Feedback
    |

    |---|---|---||}{

    | Rule 4 | Uses to prevent the question for presenting | None | Updates the data
    to maintain the life count |

    | Rule 5 | Uses to prevent the question for presenting | None | Updates the data
    to maintain the appearance |

    | Rule 6 | Uses to prevent the question for presenting | None | Updates the data
    accordingly |

    | Rule 7 | | Uses to present the question | |

    | Rule 8 | None | | Feedback Generated |'
  merge: -1
  img_proc: true
