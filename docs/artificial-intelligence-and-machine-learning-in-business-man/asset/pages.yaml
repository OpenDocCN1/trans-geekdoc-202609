  md: "# Al-Based Evaluation to assist Students Studying through Online Systems\n\n\
    # TABLE 9.2\nStatic Attributes of a Question\n\n| Attribute | Description |\n\
    | --- | --- |\n| Identifier | To identify the question in a Programming Environment.\
    \ |\n| Content | Statement of the question (text, audio, video) |\n| Type | Question\
    \ type such as MCQ. Yes or No, etc. |\n| List of Answer(s) Choices | Each element\
    \ in the list has a set of choices to select the correct answer(s). If None, then\
    \ the student needs to enter the answer. The list is provided to reframe the choices\
    \ to Rule 7. |\n| List of Correct Answer(s) | List of Correct Answer(s) corresponding\
    \ to the List of Choices. |\n| Number of Appearances | Maximum number of times\
    \ a question is presented |\n| Expected Answer Time Interval Between Appearances\
    \ | Time required to answer by subject knowledgeable person The other options\
    \ in the pool to be presented before this question can appear. The question will\
    \ disappear at the end of this time. |\n\nThe dynamic attributes, given in Table\
    \ 9.3, are updated after the student completes answering the question. The static\
    \ attributes are referred (used) to select a question to be presented. Since we\
    \ are not implementing the question delivery process, we shall force a question\
    \ with minimal attributes to test our implementation.\n\n# 9.7 EVALUATOR STATES\
    \ AND ACTIONS\n\nThe Evaluator is implemented using a simple Markov Decision Process\
    \ (MDP). The MDP States and the Actions are shown in Figure 9.2. It has five states:\
    \ Beginning, Basic, Average, Good and Poor. The evaluator changes its state using\
    \ present state, metrics collected from the student response to the question,\
    \ and the student level.\n\nMarkov Decision Process Evaluators and the Actions\
    \ are shown in Figure 9.2. The initial state of the Evaluator is S1 (Beginning).\
    \ This state is assigned when the Evaluator is created to test a student on a\
    \ new subject. The behaviour of the student, while answering the question, is\
    \ observed and collected as metrics. They are listed below:\n\n+   1. Answered\n\
    \   a. Correct answer with first attempt\n   b. Correct answer with iteration\n\
    \   c. Partially correct answer\n   d. Wrong answer\n2. Not Answered\n\nThe logic\
    \ used and the actions performed to implement the MDP uses these metrics. The\
    \ State Transition Logic and the action taken is given below:"
