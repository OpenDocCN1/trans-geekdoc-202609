    # 10.2 REVIEW OF EXISTING LITERATURE


    India currently has a high number of cases confirmed in Asia. India''s Prime Minister
    announced a nationwide lockdown affecting 1.3 billion people in India (Source:
    CNBC World News). People are forced to stay home and work from home because of
    compulsory lockdown. Classes in India have been started by both schools and universities.
    The use of AI for the revolution of E-learning during COVID-19 is experimental
    in this research paper. The analysis of current studies is intended to fill the
    research gaps for the same reason.


    Falevale [1] & Jolivet et al. [6] explained that the only step to save the economy
    from the pandemic is social distancing and lockdown. People have to change their
    behaviours and follow online learning services due to lockdown, such as individuals
    using the Microsoft Teams collaboration network, VPM, zoom, WebEx, etc. In the
    midst of the COVID-19 outbreaks, Rajmi and Sultana [7] & Jaeger and Blaabek [8]
    conduct a report on online class preparedness in developing countries. For this,
    the analysis is about an interview with 402 students from different universities
    and evaluate the findings. The results of the author''s research show that all
    schools and colleges are closed, and online courses are mandatory to cover the
    student''s losses and keep them psychologically healthy.


    But this study does not apply in all cases, as developing countries face many
    difficulties such as internet, mobile data prices, the financial status of the
    family and the mental health of the students. The government of all developing
    countries needs to focus on current constraints and help introduce online learning
    to a broader cluster of students (Dev & Sengupta [9]. AI is a branch of computer
