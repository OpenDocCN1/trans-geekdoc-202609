  md: '# Ethical Issues Surrounding AI Applications


    # 14.2.1 POWER IMBANCE


    Use of AI solutions has been proposed as a solution to many of world''s problems
    under labels like ''AI for good''. However, access to sophisticated AI applications
    and their impact on society is seriously plagued by differential power distribution
    in the society. Unthoughtful use and deployment of AI/ML applications can lead
    to further widening of the gap between less powerful and more powerful. This issue
    can be seen from two perspectives:


    # 14.2.1.1 Existing Power Imbalance in Funding Agencies and Organizations Developing
    AI Solutions


    The entire process of conceptualization, design, training and deployment of sophisticated
    AI solutions is often very costly. Organizations require highly skilled data scientists,
    software engineers, researchers and UX designers AI solutions that would be capable
    of addressing a practical need satisfactorily. This human power is often accessible
    to large, heavily funded organizations and corporations that have these resources
    from across the world. Access to human resource in developing/underdeveloped countries
    is often difficult for smaller companies, non-profit organizations and even academia
    is facing this issue as quality researchers are often recruited by private firms
    creating a gap in resource constrained academic research efforts. Such concentration
    of key human resource under the hands of few powerful agencies can influence the
    kind of AI solutions that get attention. The area of research and development
    in AI can get impacted and can generate more profit are compared to applications
    that may have a greater impact on society but have less earning capacity. The
    recent incident of Google''s ethics researcher Timnit Gebru''s termination from
    the company on differences in research focus is example of such scenario.


    The latest AI applications employ deep learning algorithms with multiple network
    layers process a large amount of data in parallel. To handle heavy computing requirements,
    specialized chips called GPUs or Graphics Processing Units may be required. These
    GPUs are not only costly to build and produce, but they also consume large amount
    of data required to handle the intense algorithms.


    Furthermore, the amount of data required to train such algorithms is also very
    high. Data, collection, pre-processing and cleaning of such data is another layer
    of cost that organizations have to bear. Investment of such large scale is also
    affordable to large corporations, while smaller, privately owned or not-for-profit
    organizations may not be able to afford these costs. All costs can make AI technology
    accessible to only a few powerful stakeholders, add to their productivity and
    profits and in turn further widen the economic and digital divide in the society.


    For example, in AI interventions in agriculture, farmers backed up by large corporations
    have sufficient funds and backup to experiment with such solutions. Even when
    these solutions may not be immediately successful, these farmers are able to contain
    the sunk cost, as they have adequate financial support from the industry. Once
    the AI deployments start paying off, these farmers are likely to gain multiplied
    output from their farms. On other hand, small family-owned'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'farms with limited resources would most likely not have the financial flexibility
    to experiment with these technologies.


    This lack or resources will be further amplified once the larger farmers start
    reaping benefits of increased productivity [1].


    This problem of differential access and widening of gap between haves and havenots
    isnt new. It has been extant in various domains of society from pharmaceutical
    research to education, industrialization, internet access and many more. However,
    identifying that AI also fails this phenomenon and it is important to create mechanisms
    for addressing such problems.


    # 14.2.1.2 Biased AI Solutions Amplifying Existing Power Imbalance in Society


    Poorly designed AI systems can further shift the power balance of society by unintentionally
    or intentionally discriminating against certain members of the society. The way
    an AI system has been conceptualized, trained and defines its performance and
    impact on end users. If these systems are not adequately trained on data representative
    of all sections of society and if these systems are not appropriately tested with
    all categories of users, the system may solidify biases in their performances.
    For example, a prediction algorithm for selecting candidates in a healthcare program
    in US was found to be biased against the African American members of the community.
    In another example, Goldman Sachs and Apple faced backlash when their payment
    card solution assigned higher credit limits in comparison to women with even better
    credit ratings [2].


    Even if these biases are identified once the application is rolled out, it is
    difficult to hold someone accountable, the company employing the system may not
    necessarily understand the code behind the application. In Apple''s case, the
    company, developers and Goldman Sachs denied the algorithm was biased, but could
    not provide explanation of why the algorithm was making those decisions. Most
    of the deep learning AI applications are ''Black Box'' models, where even the
    developers do not understand the rules used by algorithms to make decisions. developers
    often measure success on parameters like accuracy which the code does deliver
    the biases present. Clustering algorithms, for example, are often used to make
    large changes of data by dividing it into homogenous chunks of data points. However,
    unless specifically taken care of, the algorithm may not follow ''individual or
    group fairness '' principles, and may result in highly skewed clusters that may
    amplify existing biases in the society.


    Speech recognition systems are widely used across geographies today. But these
    systems are generally trained on data from native English speakers mostly from
    western countries. This lack of diversity in training is felt by non-native English
    speakers struggling with these systems. In fact, instead of Machine Learning systems
    adapting to users'' needs, these users are nudged to change their speech to accommodate
    these devices. This issue can be even more serious for users with serious speech
    impairments. Such users may be completely unable to use the systems. The problem
    is not with the algorithm itself, but due to a lack of diversity in training data,
    and lack of representation of the wide variety of end users'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# Ethical Issues Surrounding AI Applications


    in the input data. Similar issues occur with other forms of AI systems like recognition
    not identifying people of certain races or facial differences, computer vision
    systems not recognizing physically disabled people as human beings due to change
    in body shape, posture or use of mobility support. Content analysis systems may
    not consider spells of dyslexia perhaps.


    Algorithmic Coloniality or Data Coloniality are the terms used by scholars in
    reference to the idea that "modern-day power imbalances between races, countries,
    rich and poor groups are extensions of the power imbalances between colonizer
    and colonized". It can manifest in multiple ways in the current AI driven world.
    Inbuilt racism and other biases in training data and algorithm performance is
    one aspect that has already been discussed above. Other ways in which this form
    of "colonialism" becomes evident are not including developing countries in discussion
    of AI policies and data agreements, using low cost from these countries to get
    the ghost work of data preparation, using certain vulnerable populations for beta
    testing the application before rolling it out in western markets and taking a
    ‘paternalist’ approach in ‘AI for good’ initiatives without allowing developing
    nations to actually build capabilities of designing AI solutions for their needs
    [3].


    # 14.2.2 LABOUR ISSUES


    One of the major feared threats of AI/ML applications is that these will completely
    replace humans and lead to mass unemployment in society. There are indeed many
    examples of AI systems which claim to automate labour-intensive operation and
    remove the need of humans as intermediaries. Call centres, customer service kiosks,
    which out personnel at retail shops, and many such rules are under the threat
    of becoming redundant due to AI interventions. There are multiple aspects of this
    threat that need attention. Two key aspects are:


    # 14.2.2.1 What Kind of Jobs Are Most Likely to Be Impacted by the Threat of AI?


    The key capability of AI/ML as a technology is to be able to predict events efficiently.
    AI applications for job application filtering to predict which candidate is mostly
    likely to perform well on the job, AI applications for medical diagnostic may
    try to predict if a tumour is likely to be cancerous or benign, autonomous driving
    vehicle to predict the next move of vehicles/pedestrian on the road and accordingly
    making decisions. These and many other examples of AI systems basically rely on
    the algorithm''s efficiency to predict an outcome. The effect these systems will
    on the workforce depend on the importance of this prediction capability in the
    jobs. For jobs that are completely dependent on the prediction ability before
    forecasting, legal summary, email response by executive assistants, the threat
    of replacement would be strong. However, for jobs that are a mix of prediction
    and some other kind of skills like medicine, diagnostics or education where the
    decision-making skill, human touch of the practitioner is also important AI application
    may complement the existing jobs but not completely replace it [4].'
  merge: -1
  img_proc: true
- pgno: 248
  md: "# 14.2.2.2 Can AI Actually Remove All Need for Human Intervention?\n\nFor AI\
    \ applications that can be efficient at replacing needs of humans completely,\
    \ the actual truth may not be the. AI applications still rely on human workers\
    \ for smoothing out their edges. Many new kinds of jobs are created to support\
    \ the performances of AI applications. Human workers are often required for collection\
    \ of extensive data needed for training the applications.\n Labour’, refers to\
    \ this workforce hired on contract by the companies, to help in accommodating\
    \ their related tasks [5].\n\nThese people, from developing countries, spend hours\
    \ collecting, categorizing and cleaning data for AI applications. In some cases,\
    \ the results of the applications needs to be smoothed out, which requires human\
    \ support. For example, in content moderation on platforms like Facebook, the\
    \ use of sophisticated AI algorithms, human intervention is still required in\
    \ many cases. Thus, AI application being positioned to reduce manual labour are\
    \ also creating for new forms of manual jobs. The problem is that these jobs are\
    \ often invisible without ends, leading to mistreatment of workers, lack of fair\
    \ wages and limited guidelines. The case of workers of the content moderation\
    \ wing of Indian firms suffering severe mental stress is an extreme example of\
    \ such scenarios. Other forms of jobs that may arise of AI implementation are\
    \ the ones that compliment AI usage at customer’s end “Emotional Labour” refers\
