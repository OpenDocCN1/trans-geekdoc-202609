    # 5.3 PROPOSED METHOD


    All the experiments are conducted in Jupyter Python 3.7 programming language.
    The software operating environment is Jupyter notebook 6.0.3 which is an Anaconda
    platform. This research experiment implemented deep learning architecture like
    LSTM, GRU, CNN, and Multilayer Perceptron (MLP) using Keras library by Tensorflow
    library as back. Other libraries which have been used are numpy, scipy, pandas,
    matplotlib, seaborn, sklearn. The data sets have been split in ratio of 20:80.
    Figure 5.1 shows the flowchart of the experiment.


    The experiment has done on three publicly available data sets which are the German
    data set, the Taiwanese data set and the European data set. The European and Taiwanese
    data sets have been downloaded from Kaggle, and the German data set has been downloaded
    from UCI repository. The German credit card data set consists of 25 features and
    1,000 transactions out of which only 300 are fraudulent. The Taiwanese credit
    card data set has 25 features and 30,000 transactions, out of which 6,636 are
    fraudulent, and the European credit card data set consists of 31 features and
    2,840,807 transactions, out of which 492 are fraudulent. These data sets are all
    highly balanced.


    After collecting the data, the pre-processing step has been applied to data feeding
    into the deep learning-based classifiers. The preprocessing of data involves basically
    three steps, which are Data Cleaning, Reduction and Data Transformation. In this
    proposed method, initially it checked whether there any missing or inconsistent
    values in collected data sets or not. And it has found that there were no missing
    values present in any of the three'
