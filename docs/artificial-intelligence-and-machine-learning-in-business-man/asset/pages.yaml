  md: '# Editors


    Sandeep Kumar Panda is currently working as an Associate Professor in the Department
    of Data Science and Artificial Intelligence, IcfaiTech (Faculty of Science and
    Technology) at ICFAI Foundation for Higher Education (deemed to be University),
    Hyderabad, Telangana, India. His research interests include Cryptography & Security,
    Blockchain Technology, Internet of Things, Artificial Intelligence and Cloud Computing.
    He has published many papers in international journals and in international conferences
    refer. He received “Research and Innovation of the Year Award” hosted by WIEF
    and EduSkills under the Banner of MSME, Govt. of India at New Delhi in January
    2020. He has seventeen Indian patents in his credit. His professional affiliations
    are MIEEE, MACM and LMIAENG.


    Daibrav Mishra is currently working as an Assistant Professor at the IBS Hyderabad,
    IFHE University, India. He completed his engineering in computer science from
    Technical University. Subsequently, he completed a MBA and PhD from the Indian
    Institute of Information Technology (IIT), Illabad. During his PhD, Dr Mishra
    got the MHRD scholarship. He has a few certificates in his account like Six Sigma
