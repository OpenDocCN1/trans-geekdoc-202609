  md: '# Artificial Intelligence in Marketing


    # 1.4 BENEFITS AND DETRIMENTS OF USING AI IN MARKETING


    # 1.4.1 Benefits


    +   A) Personalization and relevant messages

    AI fueled predictive analytics can help companies by tapping the right customer
    base and analyzing their browsing history, and then showing appropriate advertisements
    to the right set of people. This can help companies understand their customer
    preferences before and then make appropriate recommendations. This is being used
    widely by Amazon and Netflix, saving billions by keeping customers hooked to their
    services and avoiding cancellation of services. As a marketer, AI gives you much
    power in terms of developing certain data points which guide your customers to
    the right product.


    +   B) Streamlining the marketing efforts

    Deep learning AI can understand behaviour patterns and predict which segment of
    customers are likely to make a certain kind of purchase. This can help businesses
    in targeting the customer base more accurately without wasting time and money
    on possible leads.


    +   C) Cost saving

    According to various research conducted worldwide, around 85% of the interactions
    between brands and customers are going to happen online. Compared to other advertising
    media like prime time television, print advertisements, billboards etc. online
    advertising is cheaper as well as more precise in targeting the right set of customers
    with the aid of AI.


    # 1.4.2 DETRIMENTS


    +   A) Human control is still required

    AI cannot function without human intervention, as it lacks the creativity, flexibility
    and imagination which makes humans the centre of the marketing world. Humans have
    various tastes, preferences, experiences etc. which enable them to make better
    decisions than machines, which are run on algorithms comprising formulas, statistics,
    commands etc.


    +   B) Algorithms can be wrong

    Due to bad data AI can develop biases. For example, automatically preferring and
    shortlisting CVs of white males over people belonging to other ethnicities, genders,
    colours etc. because most of the successful people in those positions were white
    males. This makes AI infer that white males are better suited for those over other
    people.


    +   C) Automated chat boxes and machine answering is not always the solution

    Many people, especially of older generations, are not comfortable talking with
    machines instead of human customer care agents. Moreover, we know how exasperating
    it can be when we have an urgent matter at head, and are looking for solutions
    from a robot. Therefore, chatbots should be installed by businesses only after
    careful research on their customer segment and product offerings.'
