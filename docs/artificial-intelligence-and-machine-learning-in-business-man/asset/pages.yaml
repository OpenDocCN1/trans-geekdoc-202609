    7.1 INTRODUCTION

    Personalized care is a modern model of the health system where treatments are
    based not on ‘one-size-fits-all’ recommendations but specific patient characteristics
    [11]. As epidemiological data systems continue to flourish in size and sophistication,
    it becomes important to analyze and create pronouncements from underlying data
    with influential methodologies such as statistical learning and Artificial Intelligence
    [2]. Machine Learning (ML) can be used via such research to promote personalized
    medicine through its precise predictions. Other Artificial Intelligence (AI) technologies
    will also lead to the personalization of treatment for patients’ lifestyle diseases,
    such as diabetes and cardiac disorders. So, we can understand, how these innovations
    will encourage an extended task for more personalized medicine and hence, change
    the healthcare setting.

    With the introduction of modernized, state-of-the-art technologies in healthcare,
    the standard of living and life expectancy of the population has been increased
    drastically [3,4]. Today, with the help of modernized healthcare technologies
    it is'
