  md: '# AI-Based Evaluation to assist Students Studying through Online Systems 151


    such cases, the questions need to be hierarchically broken to a group of logically
    connected questions, rather than a single question.


    Rule 2: There should be a pool of large number of questions to address the same
    intent. This will help reduce randomness in delivery. For example, it is possible
    to generate one million questions on expression evaluation.


    The above rules are the responsibility of the author/teacher who is expecting
    feedback on the performance of the learner.


    Rule 3: In MCQ, to select ‘None of the above’ shall not be used. Instead, the
    option ‘Do Not Know’ shall be used.


    Rule 4: Each question should have a ‘life’. After its life, it conducts a dormant
    period, and will be reborn again. This helps us to keep track of familiarity and
    anticipation by the learner.


    Rule 5: Each question should have a cooling period to avoid repetition.


    Rule 6: Question should not be repeated, if already attempted successfully by
    the same person. If the person was not answered correctly, then it can be presented
    with low priority (no new questions can be selected from the pool).


    Rule 7: In case of MCQs, the phrases/sequence of the answers can be modified to
    avoid familiarity.


    Rule 8: If the student does not answer a question, it is treated as ‘Do Not Know’.


    The implementation of question generation is not in the present scope of this
    paper. We will be focusing on using AI techniques for the evaluation process.


    # 9.4 A SHORT INTRODUCTION TO AI AND MACHINE LEARNING


    In 1950, Alan M Turing, in his paper ‘Computing Machinery and Intelligence’, mentions
    that ‘An important feature of learning a machine is that its teacher will be very
    ignorant of what is going on inside, although he may still be able to predict
    the pupil’s behaviour’. This is in clear contrast with normal procedure when using
    a machine to do computations one''s object is to have a clear mental picture of
    the state of the machine at each moment in the computation’ [5]. The term “teacher”
    used by him the computer and the algorithm used for learning. It is important
    to note that he used three important entities: learning machine, teacher and pupil.
    He also mentioned the pupil’s behaviour is predictable to some extent. The goal
    of the Machine Learning Algorithms is to make a prediction as accurate as possible.


    The term Artificial Intelligence was first introduced (coined) in 1956, by a group
    of scientists at a computer science conference in Dartmouth [6]. Their objective
    was to lay out a framework to better understand human intelligence. Based on their
    work, they identified the key factor for a machine to model human factors is Machine
    Learning.


    Machine Learning (ML) is a set of algorithms, data structures and models used
    to solve specific real-world problems. It is a subset of AI, used to understand
