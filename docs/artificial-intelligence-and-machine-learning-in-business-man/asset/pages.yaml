    # ## 14 INTRODUCTION


    Advent of Artificial Intelligence (AI) and Machine Learning (ML) technology has
    ushered us into an era that was once considered a part of science fantasy novels.
    Today, these applications address problems in sectors like medicine, defence,
    education, transport, manufacturing, retail, and many more. AI technologies are'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# 224 Artificial Intelligence and Machine Learning in Business Management


    playing crucial roles with solutions like computer vision, speech recognition,
    text analysis and pattern recognition. These have drastically improved our capability
    to process large amount of data generated in today''s sensor-enabled world. Insights
    from this data have the potential to transform human lives for good. However,
    like any other technology, AI is bound to go through a learning curve where unintended
    outcomes might negatively affect the recipients. The community today is not just
    limited to scientists, developers and engineers, but also involves all the stakeholders
    who are in one or another impacted by these solutions. These includes citizens,
    industries, governments, policy makers, lawmakers and most other members society.
    In order to promote trustworthy, holistic and responsible development of this
    technology for greater good of society, it is important that all stakeholders
    are sensitized to various ethical aspects of this technology. This chapter aims
    to highlight such ethical issues and approaches that are currently being undertaken
    to address these issues.


    # 14.2 ETHICAL ISSUES WITH AI APPLICATIONS


    Ethical Issues with AI applications are shown below in Figure 14.1.

    Despite being an immensely powerful and potentially game-changing technology,
    AI applications are raising serious ethical concerns about their use. The level
    of current AI application is not as advanced as give rise to a robot uprising
    and put human existence in danger. Such concerns may form an interesting plot
    of science movies but are not the immediate pressing issues for society. The immediate
    serious concerns are related to issues like power imbalance and societal divide
    that AI can create, labour issues that will be raised, privacy of users and serious
    threats to democracy by disinformation capabilities powered by AI tools. These
    concerns, as summarized in Figure 14.1, are discussed in detail in the following
    sections.


    | Power Imbalance | Labour Issues | Privacy | Disinformation |

    | --- | --- | --- | --- |

    | Existing power imbalance | Loss of jobs | Leak of personal data | Fake news
    |

    | Bias in AI models amplifying power imbalance | Computational Labor | Lack of
    Consent | Deepfake content |

    | Algorithmic Colonisation | Emotional Labor | Complex Policy documents | Artificially
    generated text |

    | | Poor Work conditions | | Threat to democracy |


    FIGURE 14.1 Ethical Issues with AI applications.'
