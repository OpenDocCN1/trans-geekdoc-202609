    # 13.6 CONCLUSION


    This paper describes the implementation of an special type of RNN, Long Short-Term
    Memory network for the exchange rate forecasting in details. Due to its distinct
    features, gated input and output and memory block LSTM model is performing well
    in time series prediction. Gates are responsible for the selection of the data,
    removal of the data and the modification of the data of the block. These gates
    work as a memory cell by storing previous values and compare them with upcoming
    variance to update the model by observing the inherited features out of the input
    patterns. Due to this unique working principle of the LSTM model and from the
    simulation study made in Section 4, it is clearly observed that the proposed deep
    learning neural'
