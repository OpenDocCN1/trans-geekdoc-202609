    studies on Parkinson''s (mPower app), cardiovascular health (MyHeart Counts),
    breast cancer (The Journey), asthma (Asthma Mobile), and diabetes (GlucoSuccess).
    These studies were conducted in collaboration with 17 various research institutions
    in the US. Research Kit is driving creativity that pursues to connect along mobile
    technology, wearable sensors for determining phenotypic indicators, and extremely
    penetrating machinery for determining genomic, epigenetic, proteomic and metabolic
    markers in blood, stool and tissue. This advent of technology with the computational
    facilities to store, share, filter and analyze the data will lead to collect health
    and data for human inhabitants, provide huge opportunities for biomedical research
    [12].


    Another strong point of this mobile technology is that it provides the capability
    to monitor phenotypes in long run. With the usage of the mPower app, researchers
    could track how the disease affects gait, tremors, mood, cognition, speech and
    sleep on a day-to-day basis. This understanding new patterns which may be the
    indicators for which reveal the development and severity of the disease. This
    enables to obtain statistical analysis with an adequate sample which helps in
    the stratification of diseases into precisely defined groups. This helps in diagnosis
    of the faster and effectively [12].


    With the advent of these technologies and huge data is Data-driven and networks-driven
    rational and approaches become crucial in the development of personalized healthcare.
    Several diseases have avoidable risk features or at least are the predictors of
    risk. Proper classification of these features would be beneficial for personalized
    healthcare and reduces the risk of diseases. Since the possible risk factors are
    complex it would be difficult to identify the real-time data individually by a
    physician while interacting with the patient. In general, the healthcare providers
    look at the previous history of the patient and the physical check up and diagnosis
    to determine the health of the patient and predict the risk of the disease. This
    has a limitation to certain diseases and the ability and expertise of the practitioner
    and the challenging uncertainties of the people. In this scenario, an analytics
    framework is required to combine and assimilate big data to obtain indepth knowledge
    obtained from electronic medical records of the patient and comparing patients''
