  md: "# Artificial Intelligence and Machine Learning in Business Management\n\nimprove\
    \ its performance, without any change in implementation (programming). Machines\
    \ can learn to perform specific tasks. Examples of common tasks for ML is recognizing\
    \ objects from digital pictures or predicting behaviour of a buyer doing an online\
    \ purchase. ML techniques have contributed largely to applications that are commonly\
    \ associated with Artificial Intelligence (AI).\n\n# 9.5 SELECTION OF MACHINE\
    \ LEARNING ALGORITHMS TO ADDRESS OUR PROBLEM\n\nFor every learning paradigm, there\
    \ is a problem and a solution method. Usually, a learning paradigm uses the input\
    \ data and produces an output to address the solution. We shall consider the widely\
    \ used three major ML Paradigms vs supervised learning, Unsupervised Learning\
    \ and Reinforcement Learning.\n\nSupervised learning refers to working with a\
    \ set of known labelled training data. For every training data set, exists an\
    \ object objective. The objective of supervised learning is to map the unseen\
    \ samples that are not included in the sample dataset and produce an acceptable\
    \ result. Supervised learning minimizes the error of the predicted output of the\
    \ model with respect to a target specified in the training set. This learning\
    \ paradigm is most suitable for classification, identification, prediction type\
    \ of tasks.\n\nUnsupervised learning, where we liberate the machine to find a\
    \ hidden pattern in a data set. We do not provide any known output against a data\
    \ set. Hence, in unsupervised learning, hidden pattern in a data set is identified\
    \ and give as an output. unsupervised learning algorithms include clustering and\
    \ Principal Component Analysis (PCA) and for data mining type of applications\
    \ to find a pattern or behaviour. PCA is an unsupervised algorithm used for dimensionality\
    \ reduction of the input data and feature extraction. PCA tries to gather information\
    \ matches in the data and derive a clustering by grouping.\n\nReinforced Learning\
    \ (RL) uses a set of control actions in a sequential decisionmaking problem. Unlike\
    \ the supervised and unsupervised learning algorithms, where the known data set\
    \ is fixed, RL uses a continuously varying data set. RL is based on a feedback\
    \ mechanism, which is the environment's feedback evaluating the behaviour of the\
    \ agent. It is precisely the presence of feedback that also makes RL different\
    \ from unsupervised learning. Also, if we want to use supervised or unsupervised\
    \ learning algorithms, then we need to try every question with large number of\
    \ students and collect their response to create a fixed set of known data. It\
    \ is not an easy task to accomplish. In this paper, we use RL techniques to solve\
    \ our problem.\n\n# 9.5.1 REINFORCED LEARNING (RL)\n\nThere are many elements\
    \ in RL framework, viz Agent, Actions, Environment and Policy.\n\n+   - Agent:\n\
    \  This is the main element. It performs actions based on the current situation.\n\
    - Actions:\n  The various actions that can be performed by the Agent."
