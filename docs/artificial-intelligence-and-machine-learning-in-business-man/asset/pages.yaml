    networks (they are seldom called units). There is usually one input neuron layer
    – the input layer, or more than one processing unit layers – the hidden layer,
    and one for output neurons – the output layer. The subsequent layer are entirely
    interconnected to each layer. To produce projections, information flows from the
    input layer to the output layer via processing layers. The network learns to deliver
    better predictions by tuning the connection weights during the training to equate
    projections to target values for particular records.


