    # 13.1 INTRODUCTION


    The prediction of forex data is a crucial and challenging task in short- and long-run
    financial decision making. The accurate prediction of foreign currency exchange
    rate can be beneficial to the financial institutions to deal with global import
    and export business as the risk associated with it. Nevertheless, the investors
    and economists are always eager to anticipate the securing value to rely upon
    the business. To determine the future values of forex rate with percent accuracy
    is impossible due to its dynamic nature. For decades, many linear statistical
    methods have been introduced and implemented. However, the introduction of artificial
    neural network (ANN) in this field has reduced the percentage of error by adjusting
    the model parameters in each iteration with calculated errors. Also, the complex
    architecture of neural network has minimized the error and risk associated with
    high-frequency


