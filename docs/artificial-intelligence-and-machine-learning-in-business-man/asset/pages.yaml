    level of expertise, they need to be trained extensively in real-world scenarios
    rather than just working with AI systems. The case of Air France flight crash
    in 2009 is an example of how much reliance on automated systems and lack of sufficient
    real-world training may reduce human agency''s decision-making capability. The
    Air France AF447 crashed in the ocean in 2009 leading to the loss of 228 lives
    on board. The accident was a result of ''loss of control'' in the aircraft. Control
    of situations often arise when the aircraft (most of the time were on auto-pilot
    systems) withdraws the auto-pilot mode due to inconsistencies in input data and
    transfers to manual pilots. In the case of the doomed Air France flight, the pilots
    were shocked when they suddenly had to manually fly the aircraft at high-altitude
    conditions. The pilots could not interpret the system readings correctly, leading
    to a freefall of the aircraft into the ocean. This accident could be attributed
    to lack of pilot experience in real-world scenarios due to over reliance on autonomous
    systems [14]. With autonomous driving systems if the overriding capability is
    given to a human, it wouldn''t be very useful unless the human in control is properly
    trained to make such decisions.


