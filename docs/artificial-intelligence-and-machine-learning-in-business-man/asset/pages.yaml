    # 15.4 THE WORKFLOW


    Semantic data extraction using video analysis aims at making use of enormous data
    available to extract useful information. For obtaining the vehicle number, it
    uses the concept of image processing and computer vision to collect the valuable
    portion of the video or image data and then implements the concept of optical
    character recognition [3] to extract information from it. In other words, it takes
    video or images as input and produces some text as an output.


    Data extraction from surveillance video data can be used for several purposes
    like crowd analysis, traffic detection, violence detection, etc. The flow of the
    process may differ with the purpose for which the analysis is performed. This
    flow of the process for VA can be best understood by considering the fundamental
    element of identifying the vehicle number of vehicles from the video data and
    depicted in Figure 15.1. To become familiar with the concepts of VA, the necessary
    steps involved and where to use, let us start with the simplest example. The whole
    process of obtaining the vehicle number from a CCTV captured video is first broken
    into smaller steps. The methodology for the same is shown in Figure 15.1.


    The methodology involves four stages:


    +   1. Frame Extraction: This is the first and perhaps the most straightforward
    stage. Here, the provided video is converted into a set of frames. The input of
    this stage is a video, and output is an image sequence obtained from the video.

    2. Licence Plate Detection: In this stage, the position of the licence plate of
    the vehicle is detected and segmented using the segmentation model. The segmentation
    model takes the image as an input and returns the segmented licence plate as output
    [4–10].

    3. Segmentation: In this stage, the licence plate is further segmented to obtain
    individual images for each character on the plate [11,12].'
