  md: '# Artificial Intelligence and Machine Learning in Business Management


    # TABLE 9.3

    Dynamic Attributes of a Question


    | Name | Description | Remarks | Inference |

    | --- | --- | --- | --- |

    | Answer Time | Time taken to answer the question correctly | Stored as a List.
    This is a subset of list of response Time | The maximum time, minimum time (best
    answer time) and average time taken shall be calculated |

    | Response Time | Total Time spent by the person | Stored as a List | It is possible
    to derive whether the visibility is time |

    | Part Answer Time | Time taken to answer partly correctly | Stored as a List.
    This is a subset of list of response Time | |

    | Number of correct answers | Number of persons answered correctly | | Larger
    number indicates that the question is easy |

    | Number of wrong Answers | Number of persons answered wrongly | | Larger number
    indicates that the question is hard to solve or unclear |

    | Number of partly correct answers | Number of persons answered partly correctly
    | Example: In MCQ, the correct answer could be more than one choice and the Person
    has selected a few and not a complete set. Not relevant for certain type of questions
    | Person lacks knowledge or insufficient time |

    | Number of partly correct and partly wrong answers | Number of persons answered
    part correctly and part wrongly | Example: In MCQ, the correct answer could be
    more than one choice and the Person has selected a few correctly and few wrongly.
    Not relevant for certain type of questions | The person has not understood the
    subject completely. |

    | Number of First Attempt of correct answer | Number of persons answered in first
    attempt, without correcting the answer before submitting the answer | This value
    will be less or equal to Persons correctly. The count excludes partly correct
    answers | The person is sure of the answer |

    | Not Answered | Number of persons answered (may be due to timed out) | | Larger
    number indicates that the question is not clear and needs refraining |

    | Current Appearance Number | A sequence number which gets incremented after every
    appearance | | Indicated the maturity level of the question and the evaluation
    outcome |'
