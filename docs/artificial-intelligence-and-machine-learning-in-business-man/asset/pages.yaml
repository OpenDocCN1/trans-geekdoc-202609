    # 13.3 WORKING PRINCIPLE OF LSTM


    The Long Short-Term Memory networks were first introduced by Hochreiter and Schmidhuber
    in 1997 [25], and was modified and popularized by other researchers in a wide
    range of research fields. The feature of memorizing the information for long periods
    of time is to overcome the problem of long-term dependency in RNN architecture.
    Due to this feature of RNN networks it resembles the process of human understanding
    based on their experiences by having loop of similar networks to persist the information
    which was required to predict the future values.


    In this paper, the Long Short-Term Memory networks (LSTMs), a special type of
    RNN that has the capacity to learn long-term dependencies, have been implemented
    to predict foreign exchange rates.


    In this model, back-propagation algorithm is used to train LSTMs through time,
    thus sophisticated Recurrent Neural Network (RNN) can be developed to implement
    on different sequence problems. LSTM cells have model blocks in the place of neurons
    which component should choose. The cell state ($C_{t-1}$ or $C_t$), is the soul
    of LSTM, runs as a conveyor belt performing some simple linear calculation. The
    LSTM is capable to remove old information and add new information with the help
    of neural structures as gates. Gates (Forget gate, Input gate and Output gate)
    are composition of an activated Sigmoid layer and point-wise multiplication. Sigmoid
    layer outputs value between 0 to 1 and decides how much & which one value let
    through.


    ![](img/9665bc5b38d724f414bf1c78dda7410a_228_0.png)


    FIGURE 13.1 Long Short-Term Memory networks (LSTMs) cell.'
