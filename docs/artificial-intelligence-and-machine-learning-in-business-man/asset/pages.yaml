    ![](img/9665bc5b38d724f414bf1c78dda7410a_167_0.png)


    **FIGURE 9.1** A typical online learning environment.


    navigating the lessons. The evaluation process is responsible for performing periodic
    assessment and provides the feedback. The popular methods to evaluate the student
    are giving assignments (homework), question-and-answer sessions, conducting a
    quiz, etc. The most popular and suitable feedback mechanism is question-and-answer
    method. However, the analysis by Ann Polis, et al., demonstrated that effectiveness
    of feedback extends beyond mode of delivery and timeliness to ensure the credibility
    of the lecturer giving the feedback [1]. In a teacherless environment an automated
    feedback mechanism should take this credibility. A typical online learning environment
    is given below in Figure 9.1


    # 9.2.1 CONTENT DELIVERY PROCESS


    The main task of content delivery is to present the learning material (text/audio/video)
    to the student, emulating a classroom environment. An experienced teacher in a
    classroom delivers the lessons in a face-to-face environment and he/she understands
    how well a student understands the subject by analyzing the response of the student
    while answering questions. The teacher can enhance and explain the subject to
    assist the students. If we can simulate this model, we could achieve an effective
    online learning environment. While in a classroom, the teacher faces a group of
    students with various capacities to learn, in an online there will be individual
    students and the content delivery should tailor the contents to each student.
    Hence it is necessary to assess each student separately.'
