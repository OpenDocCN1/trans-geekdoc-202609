  md: '# 15.1 INTRODUCTION


    The current era of technology offers ample opportunity to users to face up to
    the mighty stream of data with every click, swipe, share, search and stream. As
    a result, the digital universe is unlike never before. A huge volume of data is
    generated every moment worldwide. The scale is no longer limited to kilobytes,
    megabytes, gigabytes or ever. One of the major contributors to this escalating
    data is video data. Healthcare, education, media and communications, tours and
    travels, food and culture, geographical exploration, safety and security, social
    media and interactive platforms, satellite-generated data, etc. are the key sources
    generating tremendous amounts of data on a daily basis. The surveillance data
    captured from security cameras that are recorded every day add a significant share
    to the stockpiled video data.


    Surveillance videos are a crucial untold to the unstructured big data [1]. The
    role of video streams from security cameras is no less than any other video sources
    like social platform data, agriculture data, medical data, sensor spatial data
    and data evolved from space research. CCTV cameras are installed in almost every
    corner of the world, where safety is paramount. And this escalating demand for
    safety and security is driving the need for intelligent surveillance systems [2].


    In crowded places, surveillance cameras act as a third eye covering all types
    of unusual events, demanding fulfillment of human operators. Monitoring, retrieval
    and processing of gigantic data have requirements in terms of storage space, time
    and human efforts. Therefore, in this chapter, we will deal with performing semantic
    video analysis on the most common source of video data: videos captured by CCTV
    cameras. We look forward to using this video data, perform analysis and extract
    the useful portion from it, thereby automating the surveillance process to some
    extent.


    # 15.2 VIDEO ANALYTICS


    Video analytics (VA) is the ability to automatically process and analyze a video
    segment to derive the required information. It is a more advanced method of video
    monitoring. VA helps to cut off irrelevant portions of video, making surveillance
    systems more intelligent and efficient and also reducing the workload on management.
    It is a subset of computer vision and freedom of AI too. It provides a wide variety
    of functionalities, including object detection, shapes and faces recognition,
    video tracking, crowd analysis and a lot more. In addition to these functionalities,
    it also supports an innumerable number of applications in several fields.


    # 15.3 NEED FOR VIDEO ANALYTICS


    With the rapid increase in the number of security cameras, video data creation
    rate is on an exponential rise. To capture behaviours in public places, a large
    number of surveillance cameras are creatively exploited. Considering the massive
    amount of'
