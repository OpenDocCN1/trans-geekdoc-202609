    想深入了解吗？使用长文本格式，如 Instagram 轮播图或 Twitter 推文。


    基于此想法创建一个 7 页的 Instagram 轮播图，目标受众为 `[audience]`。


    每一页应包含：

    – 第 1 页：钩子（Hook）

    – 第 2-6 页：步骤、价值、故事

    – 第 7 页：总结 + 行动号召（CTA）


    语气：`教育性的、激励性的、策略性的`


    想要推文吗？

    将此轮播图转换为 5-8 条推文。添加个性化的观点。


    现在你默认实现了多平台发布。


    # 提示词包 #5：内容复用机器


    将一条帖子转化为多个内容。


    将这段 Instagram 文案转换为：

    – 推推文

    – LinkedIn 帖子

    – 30 秒视频脚本

    – 封邮件预告

    – 轮播图大纲


    **后续：**

    现在为每种格式创建 3 个选项。


    你最好的想法现在随处都能发挥作用。


    # 提示词包 #6：价值干货与教学帖子


    想成为你所在领域的知名专家吗？

    开始教学。


    写一个帖子，解释如何帮助 `[audience]` `[达成结果]`。包含：

    – 清晰的引言

    – 3-5 个步骤（每步带有一个建议）

    – 结尾语


    语气：`明智的、慷慨的`


    现在将此重构为轮播图或推文以深入讲解。

    教学 = 信任。


    # 提示词包 #7：故事讲述与真实性帖子


    人们关注真实的人——而不是机器人。

    让我们真实真实。


    写一个关于真实性的帖子，关于我 `[在业务或生活中遇到困难]`。包含：

    – 快速故事开头

    – 发生了什么变化

    – 我学到的

    – 给别人的建议


    语气：`诚实的、感同的、非说教的`


    想要更短的？

    现在将其压缩为 5 条推文，讲述同一个故事。


    你建立了情感连接——仅用 5 分钟。


    # 提示词包 #8：行动号召（CTA）与互动提示


    你已经发布了……现在做什么？

    使用提示词引导你的受众。


    写 5 个有创意的 CTA，用于教学 `[主题]` 的帖子。组合：

    – 评论 CTA

    – 分享/标记 CTA

    – 收藏/书签 CTA

    – 私信 CTA

    – 点击链接 CTA


    保持友好、具体且不咄咄。

    你的内容不应只是说说，应该引发对话。


    ## 案例故事：30 天内增长 3 倍


    Pam 是一位健康教练，粉丝量在 800 人停留了 4 个月。每天“露面”让她精疲力竭。


    于是她建立了一个提示词系统：

    ● 定义了 4 个内容支柱

    ● 使用 AI 每周 5 个帖子

    ● 将 IG 帖子转换为 Threads 和 Reels

    ● 生成了文案、CTA 和轮播图脚本


    在 30 天内，她获得了 2400 个新粉丝、92 个订阅并预约了咨询电话。

    “一旦我停止过度思考每一个帖子并开始使用提示词，一切都变得简单了。”


    ## 社交媒体增长提示词清单


    ✅ 定义内容支柱

    ✅ 针对 3-5 个主题生成 15 个帖子创意

    ✅ 创建停止用户下滑的钩子

    ✅ 以不同的语气和格式编写帖子

    ✅ 构建轮播图并跨平台复用

    ✅ 清晰地教学并讲述故事

    ✅ 自动化 CTA 和行动号召

    ✅ 让你最好的内容发挥最大价值


    “你的内容不需要完美——只需要持续。”


    ### 结语：更聪明地发布，而不是更努力


    你不需要追逐趋势、破解算法或每天发布 5 次。你需要：

    ● 了解你的受众

    ● 提供价值

    ● 结构化的重复


    提示词让内容从任务变成系统。当内容变成系统，增长就成为必然。去创作吧。发布。连接。一次一个提示词。


    # 第 6 章：教练与咨询包


    ## 服务更多、卖得更好、扩展更快


    你成为教练或顾问是为了帮助他人——而不是淹没在行政、内容创作或发布压力中。但在服务之间……你可能想过：“我需要第二个大脑。”这一章为你提供了一个——由 AI
    驱动的提示词，与你一起思考和计划。无论你是刚开始还是约满当，这些工具包都能帮助你：

    ● 明确你的产品和理想客户

    ● 构建教练课程和资源

    ● 自动化入职和客户邮件

    ● 创建社交媒体、网络研会和销售内容

    ● 在不筋力竭的情况下服务他人


    让我们建立一个由你的智慧驱动并由 AI 支持的教练引擎。


    ### 提示词包 #1：明确你的领域与核心产品


    ![](img/Image00006.jpg)


    你的产品应该是一个承诺——而不是一个包裹。

    扮演一个清晰度教练。帮助我精炼我的领域和核心产品。我是一个 `[教练或顾问类型]`。我帮助 `[受众]` 达成 `[结果]`。


    问我 3 个问题以深入探讨。然后总结：

    – 我的领域

    – 我解决的核心问题

    – 用一句话描述我的核心产品


    想要更多吗？

    现在为我的核心教练包建议一个响亮的名字 + 口号。

    清晰度带来销量。AI 帮助你磨炼它。


    # 提示词包 #2：课程与教学构建器


    在几分钟内构建一个 4、6 或 8 周的课程。

    为 `[受众]` 创建一个 6 周的教练课程大纲，帮助他们 `[达成目标]`。


    每一周包含：

    – 主题或重点

    – 核心收获

    – 行动步骤


    语气：`变革性的、简单的`


    需要资源吗？

    现在为第 1 周创建一个工作表。包含 3 个问题 + 一个练习。

    你现在有了结构化的产品来支持它。


    ### 提示词包 #3：客户入职邮件与表单


    第一印象至关重要。自动化这一体验。


    **欢迎邮件：**

    为新的教练客户写一封温暖的入职邮件。包含：

    – 感谢

    – 预期内容

    – 预约链接

    – 他们应该准备什么

    语气：`欢迎的、组织的、赋能的`


    **入职表单：**

    创建入职表单问题，帮助我了解他们的目标、挑战和预期结果。保持简单、反思性。

    你从第一天起就会显得专业且富有关怀。


    ### 提示词包 #4：课程总结与教练笔记


    在每次课程后，保持势头。

    扮演教练助手。在客户课程后写一段总结总结邮件。包含：

    – 我们涵盖的内容

    – 核心收获

    – 本周的行动步骤

    – 鼓励性的笔记


    想深入了解吗？

    现在创建一个让客户在下次课程前回答的反思提示词。这种程度的跟进会创造留存率和好评。


    ### 提示词包 #5：小组教练与网络讨会规划


    如果你运营小组或现场活动——规划你的议程。

    创建一个 60 分钟的小组课程大纲。主题：`[插入主题]` 包含：

    – 5 分钟引言

    – 教学点

    – 2 个反思问题

    – 小组讨论建议

    – 总结与 CTA


    对于网络讨会：

    写一个网络讨会大纲，通过 3 个核心观点教授 `[主题]`。在结尾包含对我产品的软推销。

    你现在几分钟内规划好了下一次发布或工作坊。


    ### 提示词包 #6：教练的内容创作


    你的客户需要提醒、灵感和严厉的爱。

    写 5 条 Instagram 文案，激励 `[受众]` 为 `[目标]` 行动。语气：`大胆的、智慧的、激励的——像一个直言不讳的教练。`


    想要故事帖子吗？

    写一个关于客户从 `[困难]` 变为 `[结果]` 的故事（更改具体细节）。包含：引言、转化和给读者的 1 个教训。

    现在你在发送私信之前就建立了信任。


    # 提示词包 #7：证言与成功故事


    让 AI 帮助你捕捉你最好的作品。


    **请求邮件：**

    写一封信息，向满意的客户索要证言。包含：

    – 感谢

    – 3 个提示问题

