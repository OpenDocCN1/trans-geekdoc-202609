    ### \U0001F9E0 Prompt Stack: Build Your Freelance Profile\n\n**Prompt 1:**\nAct\
    \ as a branding expert. Help me create a compelling freelancer bio for my `[freelance\
    \ skill — e.g., copywriting, graphic design, etc.]`, targeting `[ideal clients]`.\
    \ Keep it under 200 words, with a confident and friendly tone.\n\n**Prompt 2:**\n\
