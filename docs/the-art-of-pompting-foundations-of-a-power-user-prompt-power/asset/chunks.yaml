    Include chapter titles + a 1–2 sentence description for each.


    **Still refining?**

    Now group these chapters into 3 parts: Beginning, Middle, End. Add a one-sentence
    summary for each part. Now you’re ready to write with direction.


    # Prompt Stack #3: Chapter Drafts (That Don’t Sound Robotic)


    Writing chapters with AI is like co-writing with a brilliant, fast ghostwriter.


    Act as a non-fiction ebook writer.


    Write Chapter 1 of “[[ebook title]” for `[audience]`.


    **Tone:** `[friendly, practical, motivational, etc.]`


    **Structure:**

    1. Hook or story intro

    2. Teaching or core content (3–4 sub-sections)

    3. Summary or takeaway


    **Word count:** ~1,000–1,200


    **Tweak as you go:**

    - Rewrite section 2 with more storytelling and less instruction.

    - Make it sound like a real person sharing experience.

    - You don’t need perfect — you need a solid first draft.


    # Prompt Stack #4: Edits, Voice, & Flow Polish


    Let AI help you tighten your prose and unify your voice.


    **Improve clarity:**

    Edit this chapter for clarity and structure. Break long paragraphs. Use simpler
    language. Remove fluff.


    **Adjust tone:**

    Rewrite this chapter in a more `[bold / compassionate / witty]` voice. Keep the
    ideas, change the delivery.


    **Add a quote or metaphor:**

    Add a relevant quote or metaphor in the intro to create emotional pull.


    Your raw draft now sounds sharp, human, and readable.


    # Prompt Stack #5: Title, Subtitle & Tagline


    Titles sell. But coming up with a great one is hard — until you prompt it.


    Act as a book marketer. Suggest 10 title + subtitle combinations for a non-fiction
    ebook that helps `[audience]` with `[problem]`.


    **Make titles:**

    - Clear, not clever

    - Benefit-driven

    - Skimmable


    **Tone:** `[friendly / bold / empowering]`


    **Follow-up:**

    Now give me one ultra-short tagline I can use on the cover or landing page. Test
    your favorites. Then lock it in.


    # Prompt Stack #6: Author Bio, Back Cover, and Amazon Description


    Let’s polish your presence.


    **Author bio:**

    Write a short author bio (75–100 words) for someone who `[your background/role]`.

    Tone: approachable, credible, a touch of personality.


    **Amazon description:**

    Write a book description for “[[title]” that:

    - Hooks attention

    - Outlines what’s inside

    - Describes transformation

    - Ends with a CTA


    **Limit:** 200 words. Format with short paragraphs.


    **Back cover blurb:**

    Now shorten that into a back cover: 3 lines, 2 benefits, 1 sentence. Your ebook
    now sounds pro as it is.


    # Prompt Stack #7: Formatting Guidance (Without the Headache)


    You’t need `Vellum` or fancy tools. You need structure.


    Act as a layout guide. How should I format a Kindle ebook in `Word` or `Google
    Docs`?

    Include:

    - Font suggestions

    - Heading styles

    - Paragraph spacing

    - Page breaks

    - TOC setup


    Make it clean and Kindle-friendly.


    **Need visuals?**

    Suggest a `Canva` template for a minimalist cover. Recommend 2–3 visual themes
    that fit this book’s tone. Consistency = professionalism.


    # Prompt Stack #8: Launch Content & Promotion


    Let’s sell this thing.


    Act as a digital strategist. Create a 7-day content plan for my ebook “[[title]”
    for `[audience]`.


    Include:

    - 3 tweet ideas

    - 2 Instagram captions

    - 1 launch email

    - 1 “behind the scenes” story


    **Tone:** `[educational / hype-light]`


    Want evergreen content? Now turn that into 5 evergreen posts I can reuse.


    ## Case Story: From Blog Posts to Bestseller


    Nikhil, a productivity coach, had dozens of blog posts and email content but never
    had time to write a book. Using prompt stacks, he:

    - Picked his best topic using audience pain points

    - Generated a full 8-chapter outline

    - Pasted blogs and prompted `AI` to restructure and rewrite

    - Used `ChatGPT` to edit for tone and flow

    - Launched it on `Gumroad` with an AI-written landing page


    He made $297 in the first week, but more importantly — that ebook became the gateway
    to 3 new coaching clients. “Prompting didn’t write the book for me. It made it
    possible to finish it.”


    ## Ebook Prompt Pack: Master Checklist


    ✅ Define audience, promise, and unique angle

    ✅ Prompt a clean chapter outline

    ✅ Write first drafts using chapter stacks

    ✅ Edit and polish with clarity and tone prompts

    ✅ Prompt your title, subtitle, and author bio

    ✅ Create your Amazon page, back cover, and CTA copy

    ✅ Format your manuscript cleanly

    ✅ Design a cover (or prompt for mockup)

    ✅ Create launch content and evergreen posts

    ✅ Upload, promote — repeat


    “You’t need to be a writer. You need a message, a structure, and a system. Prompting
    gives you all three.”


    ## Closing Thought: Your Story, Shared Smarter


    - You’ve got something to say — now you’ve got the system to say it.

    - AI won’t write your story for you. But it will walk beside you as an editor,
    coach, formatter, and cheerleader.

    - You don’t have to stare at the blank page again. Just open your prompt stack.
    Type a sentence. And let momentum begin.

    - Write the ebook. Publish it. Share your voice.

    - Because someone out there needs your words — and you finally have the tool to
    deliver them.


    Next up → Chapter 5: Social Media Growth Prompt Pack


    # Chapter 5: Social Media Growth Prompt Pack – Build, Post, Repeat


    There’s a myth that growing on social media requires:

    - A graphic design degree

    - Viral dance skills

    - Endless time to “engage” in the comments


    **The truth?**

    You don’t need to go viral. You just need to show up consistently with valuable,
    clear, well-structured content — and prompting can help you do exactly that.


    In this chapter, we’ll build prompt stacks to:

    - Define your strategy

    - Create daily content fast

    - Repurpose across platforms

    - Write hooks, carousels, and CTAs

    - Grow with intention (not burnout)


    Whether you’re a creator, coach, small business, or side hustler — this is your
    content system in a prompt stack.


    ## Prompt Stack #1: Define Your Content Pillars


    ![](Image00005.jpg)


    Start by anchoring your brand.


    Act as a content strategist. Help me define 3–5 content pillars for my brand.

    Business: `[describe what you do / sell / teach]`

    Audience: `[your target followers]`

    Tone: `[e.g., bold, witty, chill, empowering]`


    **Follow-up:**

    Now suggest 3 post ideas for each pillar — include a sample title or hook. Boom.
    You now have 15 content ideas.


    ## Prompt Stack #2: Daily Post Creation in Seconds


    Build a repeatable format for content creation.


    Write a short-form social post based on this idea: “[insert idea or headline]”

    Platform: `[Instagram / Twitter / LinkedIn]`

    Tone: `[educational / funny / vulnerable / spicy]`

    **Structure:**

    - Hook

    - 2–3 lines of insight

    - 1 line CTA (question or action)


    **Bonus prompt:**

    Rewrite this post in a more casual tone, with emojis and line breaks for IG captions.
    Daily content, done in under 10 minutes.


    ## Prompt Stack #3: Hooks That Stop the Scroll


    The hook is the headline of your post. If it doesn’t grab, no one reads the rest.


    Give me 10 hook ideas for a post about “[[insert topic]” for `[audience]`. Make
    them curiosity-driven, punchy, and platform-optimized. Each under 100 characters.


    **Want niche tone?**

    Now rewrite those hooks in a Gen Z / corporate / poetic / no-BS tone. Your scroll-stoppers
    now speak their language.


