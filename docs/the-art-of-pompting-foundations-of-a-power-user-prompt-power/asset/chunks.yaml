- fmt: "\nYou’ll also get prompt stacks to build with tools like `Notion`, `Airtable`,\
    \ `Glide`, `Zapier`, `Softr`, and more — without writing a line of code.\n\n##\
    \ Prompt Stack #1: Micro SaaS Idea Generator\n\n![Image](Image00009.jpg)\n\nStart\
    \ with a real-world problem you’ve seen — and let AI spin ideas.\n\nAct as a SaaS\
    \ ideation coach. Suggest 10 micro SaaS or automation product ideas for: \n\n\
    – Audience: `[target user, e.g. solopreneurs, coaches, agency owners]`\n– Problem:\
    \ `[insert a known pain point or inefficiency]`\n\nEach idea should include:\n\
    \n– One-sentence pitch\n– Monetization potential\n– No-code tool suggestion for\
    \ building it\n\nWant market-ready direction?\n\nNow rank the top 3 ideas by ease\
    \ of building vs. demand potential.\n\n`Clarity` → `confidence` → `momentum`.\n\
    \n## Prompt Stack #2: Define Your MVP\n\nMost SaaS founders overbuild. Don’t.\n\
    \nLet AI define your minimum viable product.\n\nAct as a product strategist.\n\
    \nDefine an MVP for this idea: `“[insert micro SaaS idea]\"`\n\nInclude:\n\n–\
    \ 1 problem it solves\n– 3 core features\n– Ideal user persona\n– Platform to\
    \ build it (no-code stack preferred)\n\nFollow-up:\n\nNow create a 3-day build\
    \ plan using `[Notion / Glide / Airtable / Tally / Zapier]`.\n\nYou now have a\
    \ doable roadmap — not just a dream.\n\n## Prompt Stack #3: UI / UX Flow Planning\n\
    \nYou don’t need to “design.” You need to map the journey.\n\nDesign a simple\
    \ user flow for a micro SaaS product that helps `[audience]` do `[task]`.\n\n\
    Include:\n\n– Entry point (login or homepage)\n– Main 3 actions a user can take\n\
    – Basic layout suggestion\n– Tools to build it (`Notion + Super`, `Glide`, etc.)\n\
    \nBonus:\n\nWrite dummy copy for a welcome screen or onboarding walkthrough.\n\
    \nYou now have a wireframe — without opening `Figma`.\n\n## Prompt Stack #4: Feature\
    \ Description & AI-Powered Fill-ins\n\nUse AI to write out what your tool does\
    \ — clearly and convincingly.\n\nWrite a 1-paragraph description for a feature\
    \ called `“[insert feature name]\"` in my SaaS product.\n\nExplain how it works,\
    \ who it helps, and why it matters — in plain English.\n\nNeed UI fill text?\n\
    \nCreate sample input fields, default text, and tooltips for a dashboard that\
    \ tracks `[X metric]`.\n\nThis is what makes your MVP feel real to users.\n\n\
    ## Prompt Stack #5: Landing Page & Sales Copy\n\nYou built it — now sell it.\n\
    \nWrite a landing page for my no-code micro SaaS: `“[product name]\"`\n\nAudience:\
    \ `[describe user]`\n\nInclude:\n\n– Headline + subhead\n– Problem → solution\
    \ flow\n– Feature highlights (3 bullets)\n– Pricing or free trial CTA\n\nTone:\
    \ modern, clean, no hype\n\nFollow-up:\n\nNow write 3 headline options and a bold\
    \ one-liner I can use above the fold.\n\nYou now have a website copy draft in\
    \ 5 minutes flat.\n\n## Prompt Stack #6: Beta User Feedback & Survey Creation\n\
    \nEvery great product evolves — if you listen.\n\nWrite a 5-question user feedback\
    \ survey for beta users of my `[product name]` micro SaaS.\n\nGoal: Understand\
    \ what’s working, what’s confusing, and what they wish it had.\n\nFollow-up:\n\
    \nNow write a short email inviting my beta users to give feedback.\n\nTone: grateful,\
    \ curious, and friendly.\n\nYour next update writes itself from this feedback\
    \ loop.\n\n## Prompt Stack #7: Automation & Backend Prompts\n\nBuild smart, not\
    \ just fast.\n\nSuggest 3 automation workflows using `Zapier` or `Make` for my\
    \ product `“[insert product]\"` that would:\n\n– Save user time\n– Auto-send email\
    \ or Slack updates\n– Log data in a spreadsheet\n\nWant extra magic?\n\nNow suggest\
    \ how I can plug `GPT` into this workflow (e.g., summarizing data, generating\
    \ reports).\n\nNow you’ve got AI inside your product — not just around it.\n\n\
    ## Prompt Stack #8: Launch Strategy & Growth Experiments\n\nBuild it? Great. Let’s\
    \ get it seen.\n\nCreate a 7-day pre-launch and post-launch plan for my micro\
    \ SaaS.\n\nGoal: Build a waitlist, get first users, and drive feedback.\n\nInclude:\n\
    \n– 2 tweet ideas\n– 2 email angles\n– 1 referral incentive\n– 1 community post\n\
    \nExtra:\n\nNow suggest 3 indie hacker-style growth experiments to get my first\
    \ 50 users.\n\nYou’re not just launching — you’re validating.\n\n## Mini Case\
    \ Story: The $19 SaaS That Replaced 10 Hours a Week\n\nAmy, a virtual assistant,\
    \ was constantly building onboarding forms and trackers manually.\n\nUsing this\
    \ chapter’s prompt stacks, she:\n\n● Ideated a simple CRM tracker for VAs using\
    \ `Notion + Tally`\n● Built it in 48 hours\n● Prompted a landing page, onboarding\
    \ flow, and usage guide\n● Shared it on `Reddit` and `LinkedIn`\n\nShe priced\
    \ it at $19.\n\nWithin 3 weeks, she’d sold 93 copies — and later turned it into\
    \ a $7/month micro SaaS.\n\n“I didn’t want to build a startup. I just wanted to\
    \ stop doing things the hard way. Prompting showed me how to build and sell smarter.”\n\
    \n## Micro SaaS & No-Code Prompt Stack Checklist\n\n✅ Brainstorm & validate a\
    \ niche problem\n✅ Define the MVP and essential features\n✅ Map a basic UI/UX\
    \ flow\n✅ Prompt sample fields, dashboards, tooltips\n✅ Draft a landing page with\
    \ sales copy\n✅ Automate the backend with `Zapier`, `Airtable`, or `GPT`\n✅ Collect\
    \ beta user feedback\n✅ Launch with growth-friendly experiments\n\n“You don’t\
    \ need to know how to code. You just need to know how to prompt clearly — and\
    \ build tiny tools that solve big headaches.”\n\nClosing Thought: Code Less. Think\
    \ Sharper. Build Faster.\n\n***\n\n## Chapter 10: Client Work, Outreach & Branding\n\
    \n### Win Clients, Build Trust, Show Up Like a Pro\n\nWhether you’re a freelancer,\
    \ consultant, or service-based founder, client work is your engine. But that engine\
    \ runs smoothly when you:\n\n- Communicate clearly\n- Pitch strategically\n- Deliver\
    \ confidently\n- Brand yourself\n\nThis chapter arms you with prompt stacks to:\n\
    \n- Improve client communication\n- Create proposal and onboarding assets own-\
    \ Personalize outreach at scale\n- Sharpen your messaging\n- Turn great work into\
    \ repeat business\n\n### Prompt Stack #1: Client Messaging\n\n![Image](Image0010.jpg)\n\
    \nClear communication builds client confidence.\n\nAct as a client communication\
    \ coach.\n\nWrite a 3-paragraph onboarding message for a new client I just closed.\n\
    \nInclude:\n\n– Warm welcome\n– Summary of what’s next\n– CTA to book kickoff\
    \ call or fill intake form\n\nTone: warm, direct, professional\n\nNow clarify\
    \ deliverables:\n\nWrite a one-pager that outlines the project scope, key milestones,\
    \ and 2–3 boundaries to avoid scope creep.\n\nYou sound like a pro from Day One.\n\
    \n### Prompt Stack #2: Personalized Proposals & Offers\n\nGeneric proposals don’t\
    \ convert — custom ones do.\n\nWrite a 1-page proposal for `[service type]` for\
    \ a client who needs help with `[pain point]`.\n\nInclude:\n\n– Their problem\n\
    – Your solution\n– Timeline + deliverables\n– Price + CTA\n\nTone: confident and\
    \ collaborative\n\nNow add this:\n\nWrite a custom intro paragraph that makes\
    \ the proposal feel tailored, not templated.\n\nPersonalization = more yeses.\n\
    \n### Prompt Stack #3: Cold Outreach, Warm Style\n\nYou don’t need to be pushy\
    \ — just valuable.\n\nWrite a short outreach email to a `[business type]` offering\
    \ help with `[pain point]`.\n\nInclude:\n\n– Quick compliment or observation\n\
    – What you can do for them\n– A CTA to reply or book a 15-min call\n\nTone: curious,\
    \ kind, and sharp\n\nFor DMs:\n\nRewrite that as a 2–3 sentence DM for `Instagram`\
    \ or `LinkedIn`.\n\n### Prompt Stack #4: Showcase Work Like a Brand\n\nGreat work\
    \ means nothing if no one sees it.\n"
