  trans: "\n\n你还将获得一系列提示词栈，用于使用 `Notion`、`Airtable`、`Glide`、`Zapier`、`Softr` 等工具进行构建——无需编写一行代码。\n\
    \n## 提示词栈 #1：微型 SaaS 创意生成器\n\n![Image](img/Image00009.jpg)\n\n从你观察过的真实世界问题开始——让\
    \ AI 为你构思灵感。\n\n担任 SaaS 构思教练。针对以下内容建议 10 个微型 SaaS 或自动化产品创意： \n\n– 受众：`[目标用户，例如：个人创业者、教练、机构所有者]`\n\
    – 问题：`[插入已知的痛点或低效环节]`\n\n每个创意都应包含：\n\n– 一句式推销（Pitch）\n– 变现潜力\n– 构建它的无代码工具建议\n\n\
    想要市场就绪的方向吗？\n\n现在根据“构建易用性 vs 需求潜力”对前 3 个创意进行排名。\n\n`Clarity` → `confidence` →\
    \ `momentum`。\n\n## 提示词栈 #2：定义你的 MVP\n\n大多数 SaaS 创始人过度开发。不要这样做。\n\n让 AI 定义你的最小可行性产品（MVP）。\n\
    \n担任产品策略师。\n\n为这个创意定义一个 MVP：`“[插入微型 SaaS 创意\"`\n\n包含：\n\n– 它解决的 1 个问题\n– 3 个核心功能\n\
    – 理想用户画像\n– 构建它的平台（优先考虑无代码技术栈）\n\n后续：\n\n现在使用 `[Notion / Glide / Airtable / Tally\
    \ / Zapier]` 创建一个为期 3 天的构建计划。\n\n你现在有了一个可行的路线图——而不仅仅是一个梦想。\n\n## 提示词栈 #3：UI /\
    \ UX 流程规划\n\n你不需要“设计”。你需要映射旅程。\n\n为一款微型 SaaS 产品设计一个简单的用户流，帮助 `[受众]` 完成 `[任务]`。\n\
    \n包含：\n\n– 入口（登录或首页）\n– 用户可以执行的 3 个主要操作\n– 基础布局建议\n– 构建它的工具（`Notion + Super`、`Glide`\
    \ 等）\n\n额外奖励：\n\n为欢迎屏幕或引导流程编写一段占位文案（Dummy copy）。\n\n你现在有了一个线框——无需打开 `Figma`。\n\
    \n## 提示词栈 #4：功能描述与 AI 自动填充\n\n使用 AI 来写出你工具的功能——清晰且有说服力。\n\n为我的 SaaS 产品中一个名为 `“[插入功能名称]\"\
    ` 的功能写一段话的描述。\n\n解释它是如何工作的、能帮助谁，以及为什么重要——使用通俗易懂的英语。\n\n需要 UI 填充文本吗？\n\n为跟踪 `[X\
    \ 指标]` 的仪表板创建示例输入字段、默认文本和提示。\n\n这让你的 MVP 在用户面前显得真实。\n\n## 提示词栈 #5：落地页与销售文案\n\n\
    你构建了它——现在卖掉它。\n\n为我的无代码微型 SaaS 写一个落地页：`“[产品名称]\"`\n\n受众：`[描述用户]`\n\n包含：\n\n– 标题\
    \ + 副标题\n– 问题 → 解决方案的流程\n– 功能亮点（3 个要点）\n– CTA（行动号召）\n\n语气：现代、简洁\n\n后续：\n\n现在写一个市场就绪的标题。\n\
    \n你现在有了一个可执行的草稿。\n\n## 提示词栈 #6：线框与用户反馈\n\n你现在有了一个线框——无需打开 `Figma`。\n\n## 提示词栈\
    \ #7：自动化与增长\n\n你现在有了一个可执行的路线图——而不仅仅是一个梦想。\n\n## 提示词栈 #8：启动策略与增长\n\n你现在有了一个可执行的路线图——而不仅仅是一个梦想。\n\
    \n"
- fmt: "\nWrite a short case study from this client project:\n\n- Client type: `[describe]`\n\
    - Problem: `[brief summary]`\n- Solution: `[your process]`\n- Result: `[data or\
    \ qualitative feedback]`\n\nTone: focused, visual, humble-brag\n\nThen reuse it:\n\
    \nWrite 3 captions I can use to share this case study across social platforms.\n\
    \nLet your results do the talking.\n\n# Prompt Stack #5: Testimonials & Social\
    \ Proof\n\nMake it easy for happy clients to rave about you.\n\n### Testimonial\
    \ Request\nWrite a testimonial request email to send after wrapping up a project.\n\
    \nInclude:\n- Gratitude\n- 2–3 quick questions\n- Offer to help shape their feedback\
    \ into a quote\n\nTone: appreciative and easygoing\n\n### Then repurpose\nRewrite\
    \ this testimonial into:\n- A short quote for a website\n- A caption for Instagram\n\
    - A blurb for my portfolio\n\nOne testimonial = multiple proof points.\n\n# Prompt\
    \ Stack #6: Client Feedback Loops & Review Process\n\nPrevent confusion and scope\
    \ creep before it starts.\n\n### Requesting revisions\nWrite a message to ask\
    \ for client feedback on a delivered project.\n\nInclude:\n- Reminder of what’s\
    \ included\n- CTA to review\n- Timeline for responses\n\nTone: calm and proactive\n\
    \n### Pushing back politely\nHelp me write a message that kindly reminds the client\
    \ we’ve hit the final round of included edits.\n\nOffer paid revision options\
    \ if needed.\n\nBoundaries build respect.\n\n# Prompt Stack #7: Brand Messaging\
    \ That Converts\n\nIf you’re a service provider, your brand isn’t your logo —\
    \ it’s your clarity.\n\n### Brand Bio\nHelp me write a brand bio that describes:\n\
    - Who I help\n- What I do\n- Why it works\n- What makes me different\n\nLimit:\
    \ 75–100 words\nTone: smart, friendly, punchy\n\n### Follow-up\nWrite 3 one-liner\
    \ taglines I can use for my social bios or website headers.\n\nThis is how you\
    \ turn invisible talent into memorable positioning.\n\n# Prompt Stack #8: Referrals,\
    \ Retainers, and Repeat Work\n\nDon’t just close — reopen doors.\n\n### Ask for\
    \ referrals\nWrite a polite email asking a happy client if they know anyone else\
    \ who might benefit from my services.\n\nTone: warm, no pressure, professional\n\
    \n### Offer retainer packages\nWrite a simple retainer pitch email for a client\
    \ I finished a project with.\n\nInclude:\n- What I can help with monthly\n- Pricing\
    \ tier\n- Option to book a call\n\nTone: helpful and low-key\n\nOne client done\
    \ well → three new opportunities.\n\n## Mini Case Story: From Freelancer to Trusted\
    \ Partner\n\nSara was a freelance designer who constantly jumped between projects.\n\
    \nShe was great at what she did — but inconsistent with outreach, follow-ups,\
    \ and scope clarity.\n\nUsing this chapter’s prompt stacks, she:\n- Tightened\
    \ her onboarding with one-click welcome kits\n- Wrote pitch-perfect proposals\
    \ in minutes\n- Followed up with clear boundaries and next steps\n- Built a `Notion`-based\
    \ testimonial vault\n- Landed 2 retainer clients using repurposed case studies\n\
    \n“I stopped just ‘delivering’ and started ‘leading.’ Prompting gave me the system\
    \ to grow from freelancer to brand.”\n\n## Client Work & Branding Prompt Stack\
    \ Checklist\n\n✅ Create clear onboarding messages and expectations\n✅ Write personalized\
    \ proposals that close more deals\n✅ Reach out cold — in a warm, human voice\n\
    ✅ Share work through mini case studies + social posts\n✅ Ask for testimonials\
    \ and rewrite for multiple formats\n✅ Manage feedback and scope like a pro\n✅\
    \ Craft bio, brand message, and offers that convert\n✅ Invite repeat work, referrals,\
    \ and retainers\n\n“Client trust isn’t built in the project. It’s built in the\
    \ details around it — and prompting gives you the language for those details.”\n\
    \n## Closing Thought: Deliver Like a Creative. Lead Like a Brand.\n\nClients don’t\
    \ just want talent — they want trust.\n\nThey want clarity. Boundaries. Confidence.\
    \ Presence.\n\nPrompting helps you:\n- Communicate better\n- Sell better\n- Lead\
    \ better\n- Be remembered\n\nThis isn’t about working harder — it’s about working\
    \ with structure.\n\nSo show up with clarity.\n\nDeliver with excellence.\n\n\
    Let AI help you do both — at scale.\n\nNext up → Bonus Chapter: Build Your Own\
    \ Prompt Stack – The Framework Method\n\n# Bonus Chapter\n\n### Build Your Own\
    \ Prompt Stack – The Framework Method\n\nBy now, you’ve seen how prompting can\
    \ transform your workflow.\n\nFrom ebooks and digital products… To freelance systems,\
    \ content creation, SaaS ideas, and client work —\n\nPrompting lets you turn clarity\
    \ into action and ideas into income.\n\n- But here’s the ultimate unlock:\n- But\
    \ here’s the ultimate unlock:\n- But here’s the ultimate unlock:\n\nWait, let's\
    \ refine the structure:\n\n## What is a Prompt Stack, Really?\n\nA prompt stack\
    \ is more than one prompt. It’s a series of prompts that helps you:\n- Brainstorm\n\
    - Plan\n- Create\n- Refine\n- Launch\n\nOne great prompt is helpful. A great stack\
    \ is unstoppable.\n\n## The 5-Part Prompt Stack Framework\n\nUse this when you\
    \ want to build your own:\n\n### 1. Define Outcome\nWhat do you want the result\
    \ to be? A blog post? A course? A script?\nPrompt: `I want to use AI to [describe\
    \ the goal]`.\n\n### 2. Break It Into Stages\nNow engineer the process. What are\
    \ the steps?\n- Define\n- Outline\n- Write\n- Format\n\nPrompt: `Break down [task]\
    \ into 3–5 stages`.\n\n### 3. Choose Format & Tone\nWill your output be a PDF?\
    \ Carousel? Web copy? Tweet? What tone should it reflect?\n\nPrompt: `Suggest\
    \ the best format and tone for this type of content`.\n\n### 4. Iterate at Each\
    \ Stage\nEach part of the stack should allow for testing, rewriting, or scaling.\n\
    Prompt: `Rewrite this in a [tone/format] way`. \n\n### 5. Systemize & Save\nOnce\
    \ it works, don’t start over next time. Store your stack in `Notion`, `Google\
    \ Docs`, or any prompt library. Pro tip: Name your stacks.\n\n## Example: Creating\
    \ a Prompt Stack from Scratch\n\nLet’s say you want to sell a Notion template.\
    \ Here’s how to build your custom stack using the Framework:\n\n### Outcome\n\
    Sell a Notion template for remote workers.\n\n### Stages\n- Brainstorm use case\n\
    - Outline content\n- Fill in sample data\n\n### Stack\n1. `Act as a product strategist.\
    \ What are 10 useful Notion templates remote workers needed?`\n2. `Outline the\
    \ sections of a Notion template called ‘Workday Clarity Planner’.`\n3. `Add sample\
    \ fields and example content for each section.`\n4. `Write sales page copy for\
    \ this template, including 3 bullet benefits.`\n5. `Suggest a visual mockup idea\
    \ using Canva, and write a caption for launch.`\n\nSave that. Tweak it. Use it\
    \ again.\n\nNow you’ve got your custom prompt system.\n\n## Prompt Stack Builder\
    \ Checklist\n\n✅ Define your desired output or deliverable\n✅ Break the process\
    \ into 3–5 stages\n"
