- fmt: "\nBefore you use AI for anything, run through this:\n\n- ✅ Who is the AI acting\
    \ as? (e.g., coach, writer, marketer)\n- ✅ What is the task? (write, brainstorm,\
    \ summarize, outline?)\n- ✅ Who is it for? (audience, niche)\n- ✅ What tone or\
    \ format should it follow?\n- ✅ Can you give it context, examples, or references?\n\
    \nIf you can answer all five — your results will be \U0001F525.\n\n### Closing\
    \ Thought: You + AI = Infinite Leverage\n\n- You don’t need to master every tool.\n\
    - You don’t need to follow every trend.\n- But if you can master the art of prompting\n\
    - You gain the ultimate power: leverage.\n\nThe ability to:\n- Think clearer\n\
    - Work faster\n- Build smarter\n- Launch quicker\n\nThis is just the beginning.\
    \ \n\nLet’s build your prompt empire — one stack at a time.\n\n## \U0001F9E0 Wait\
    \ — What’s the Difference Between a Prompt Stack and a Prompt Pack?\n\nLet’s clear\
    \ it up early so you can use them with confidence:\n\n| Term | Think of it like...\
    \ | What It Does | Structure |\n| :--- | :--- | :--- | :--- |\n| `Prompt Stack`\
    \ | A recipe | Helps you complete one specific task using a series of prompts\
    \ | Step-by-step sequence |\n| `Prompt Pack` | A cookbook | Gives you a full collection\
    \ of prompt stacks for one goal or role | Multiple stacks + bonuses |\n\n### \U0001F539\
    \ Prompt Stack\n\nA `prompt stack` is a mini-system. Each prompt builds on the\
    \ last — guiding you from idea to execution.\n\n**Example:**\nWant to write a\
    \ blog post? A `prompt stack` might include:\n1. Define your reader\n2. Generate\
    \ title options\n3. Outline the structure\n4. Write section drafts\n5. Add CTA\
    \ and polish\n\n### \U0001F538 Prompt Pack\n\nA `prompt pack` is a bundle of multiple\
    \ stacks and related prompts. It’s designed to help you win in a category — like\
    \ freelancing, coaching, or content creation.\n\n**Example:**\nThe Freelancer’s\
    \ `Prompt Pack` includes stacks for:\n- Building a bio\n- Pitching clients\n-\
    \ Writing proposals\n- Automating follow-ups\n\nThink of `prompt stacks` as the\
    \ “how,” and `prompt packs` as the “what.” Together? You become unstoppable.\n\
    \n---\n\n## Chapter 2: Digital Products Prompt Pack – Create Once, Sell Forever\n\
    \nWelcome to your new favourite stream: digital products. Unlike service work,\
    \ which trades time for money, digital products give you scale. Create something\
    \ once. Sell it a hundred — or a thousand — times.\n\nEven better? You’t need\
    \ to be an expert, designer, or course creator. You just need the right idea,\
    \ a simple system, and a few prompts. In this chapter, we’ll use `prompt stacks`\
    \ to:\n- Find high-demand, low-effort ideas\n- Outline and draft your product\
    \ with AI\n- Name, package, and sell it\n- Automate your content creation\n\n\
    Start earning passively (or semi-passively) with confidence\n\n### Prompt Stack\
    \ #1: Idea Generator – Low Effort, High Demand\n\nThe best digital product ideas\
    \ solve a small but annoying problem. `Act as a digital coach. I want to launch\
    \ a simple product under $25. Target audience: [describe your niche].`\n\n**Prompt:**\n\
    `Suggest 10 digital product ideas I can make under a week using AI + no-code tools.\
    \ For each, include: Product title, What it solves, Format (e.g. Notion, Canva,\
    \ etc.), Monetization potential`\n\n**Follow-up prompt:**\n`Rank these ideas based\
    \ on effort to build vs. audience demand. validated list tailored to your strengths.`\n\
    \n### Prompt Stack #2: Product Structure & Build Plan\n\nOnce you pick an idea,\
    \ map it out. `Act as a product strategist. I’ve chosen [product idea].`\n\n**Prompt:**\n\
    `Create a structure for it — outline 5 sections or modules. For each section,\
    \ write 1–2 sentence description. Format: [Notion / PDF / Template Kit]`\n\n**Want\
    \ a build plan too?**\n`Now give me a simple 3-day build plan. Day-by-day tasks\
    \ to complete this product from scratch using AI.`\n\n### Prompt Stack #3: Drafting\
    \ with AI (Content + Voice)\n\nTime to create your product content — fast. `Act\
    \ as a product writer. Create the content for Section 1 of my product titled \"\
    [insert title].\" Tone: [fun, actionable, empowering, minimalist, etc.]`\n**Audience:**\
    \ `[entrepreneurs, creators, parents, etc.]`\n**Output:** `bullet points, short\
    \ tips, or formatted text that’s skimmable and usable.`\n\n**Tip:** `Keep the\
    \ word count under [X].` — Use this per section, then polish as you go. Add your\
    \ personal insights, stories, and examples.\n\n### Prompt Stack #4: Product Name\
    \ & Tagline\n\nNaming paralysis? Prompt it away. `Act as a branding expert. Suggest\
    \ 10 catchy names for a digital product that helps [audience] with [result].`\n\
    \n**Prompt:**\n`Make the names short, clear, and benefit-driven. Include a one-line\
    \ tagline or subtitle for each.`\n\n**Still stuck?**\n`Give me names in these\
    \ tones: clever, minimalist, emotional.`\n\n### Prompt Stack #5: Design Suggestions\
    \ & Format Flow\n\nEven if you’re not a designer, your product can still look\
    \ amazing. `Act as a digital product designer. Suggest a layout for a Notion/Canva/PDF\
    \ product based on my content outline.`\n\nInclude: own- Section headers\n- Icons\
    \ or visuals\n- Fonts to use\n- Color scheme\n\nKeep it clean and on-brand for\
    \ `[audience type]`.\n**Bonus:** Suggest where I can add callouts, quotes, or\
    \ illustrations to improve visual flow.\n\n### Prompt Stack #6: Sales Page Copy\
    \ That Converts\n\nNow let’s make it sell. `Act as a sales copywriter. Write a\
    \ product sales page for \"[product name]\" that helps [audience] solve [pain\
    \ point].`\n\nInclude:\n1. Hook headline\n2. Problem section\n3. Features + benefits\n\
    4. What’s inside\n5. Call-to-action\n**Tone:** `friendly, no hype, clear value`\n\
    \n**Optional CTA prompt:**\n`Write 3 CTAs I can use — soft, bold, and curious\
    \ tones.`\n\n### Prompt Stack #7: Lead Magnet or Bonus Creation\n\nWant to boost\
    \ sales or grow your email list? Add a freebie. `Act as a marketing strategist.\
    \ Based on my product \"[product name],\" suggest 3 lead magnets or bonuses I\
    \ can offer.`\n\nFor each, describe:\n- What it is\n- How it connects to the main\
    \ product\n- Why it adds value or increases conversions\n\n**Now prompt to build\
    \ one:**\n`Now create the first draft of bonus #2 — make it light, useful, and\
    \ quick to consume.`\n\n### Prompt Stack #8: Launch Content Engine\n\nYou’ve built\
    \ it — now let’s tell the world. `Act as a content marketer. Create 5 short-form\
    \ post ideas (Twitter/Instagram/LinkedIn) to promote \"[product name]\" to [audience].`\n\
    \nInclude:\n- hook\n- body\n- call-to-action\n**Tone:** `[bold, educational, vulnerable,\
    \ etc.]`\n\n**Want a carousel idea?**\n`Now turn Post #2 into a 5-slide Instagram\
    \ carousel. Include slide headings and caption copy.`\n\n---\n\n## Mini Case Story:\
    \ The 3-Hour Digital Kit\n\nAshley, a virtual assistant, always wanted to create\
    \ a product but didn’t think she had time. She used the prompt stacks in this\
    \ chapter and in 3 hours:\n- Prompted 5 product ideas for beginner VAs\n- Chose\
    \ one: The VA Starter SOP\n- Used AI to outline 10 SOP templates\n- Prompted copy,\
    \ sales page, and 3 Instagram posts\n- Upload to Gumroad\n\nWithin 2 days, she\
    \ made $87. Within 2 weeks, over $400. The best part? She now has a repeatable\
    \ system to create, launch, and scale — without overwhelm.\n\n### Your Digital\
    \ Product Prompt Stack Checklist\n\n- ✅ Generate 10 low-effort, high-demand product\
    \ ideas\n- ✅ Validate with effort vs. demand ranking\n- ✅ Outline the product\
    \ in 3–5 sections\n- ✅ Prompt drafts for each section or template\n- ✅ Name it\
    \ + write a subtitle or tagline\n- ✅ Build the layout using visual design suggestions\n"
