    – Offer to write a rough version for them


    ### Case study

    Now write a short success story (3–4 sentences) from this client journey:


    Before: `[struggle]`


    After: `[result]`


    Tone: proud but humble. Speak from my brand’s voice.


    Social proof → new leads → more impact.


    ## Prompt Stack #8: Sales Page & DM Strategy


    Now let’s fill your calendar.


    #### Sales page draft

    Write a sales page for my coaching program `[name]` that helps `[audience]` achieve
    `[result]`.


    Include:

    – Hook headline

    – Pain point section

    – What’s inside

    – Testimonials (placeholder)

    – Pricing & CTA


    Tone: calm, clear, confident


    #### DM script

    Write a friendly, non-pushy DM to a follower who liked my post about `[topic]`,
    inviting them to book a clarity call.


    Let AI help you sell without being spammy.


    ---


    ## Mini Case Story: From Burnout to Booked Solid


    Jordan, a mindset coach, felt drained by content, admin, and inconsistent client
    systems.


    In 2 weeks, he used prompting to:


    ● Clarify his offer in 1 sentence

    ● Build a 6-week program

    ● Create a beautiful onboarding experience

    ● Generate 30 days of content

    ● Automate post-session follow-ups

    ● Build a `Notion` client tracker with AI support


    “Prompting gave me a system I didn’t know I needed. It feels like I’m coaching
    inside my genius now — not chasing tasks.”


    Within a month, he raised prices and created a waitlist.


    ### Coaching & Consulting Prompt Stack Checklist


    ✅ Clarify niche, message, and offer

    ✅ Build your program structure and tools

    ✅ Create onboarding emails and intake forms

    ✅ Automate session recaps and follow-ups

    ✅ Plan webinars, workshops, or launches

    ✅ Generate inspiring, trustworthy content

    ✅ Collect and rewrite testimonials

    ✅ Build sales pages and outreach messages


    “Your clients don’t need more content. They need clarity. Prompting helps you
    create it — for them, and for yourself.”


    ---## Closing Thought: You Coach the Client — Let AI Coach the Workflow


    Coaching is emotional, human, and transformational.


    That part? Still yours.


    But the behind-the-scenes stress? The writing, structuring, emailing, selling?


    That’s where AI shines — and where prompt stacking becomes your secret weapon.


    Use it to serve better.

    Scale smarter.

    And most importantly — stay in your zone of genius.


    You got into this work to help others.

    Now let prompting help you.


    Next up → Chapter 7: YouTube & TikTok Content Prompt Pack


    ---


    ## Chapter 7: YouTube & TikTok Content Prompt Pack – Lights, Camera, Prompt Stack


    Creating video content is one of the fastest ways to build authority and trust
    online.


    But most people get stuck before they ever hit “record.”


    “What do I say?”

    “How do I script it?”

    “Is this even interesting?”


    Enter: prompting.


    This chapter is your behind-the-scenes production crew — helping you generate:


    ● Engaging video ideas

    ● Hooky intros and CTAs

    ● Scripts for short and long-form content

    ● Repurposed reels and shorts

    ● Descriptions, captions, titles, and hashtags


    Whether you’re a camera-shy beginner or a content machine looking to save hours
    — this prompt pack is your video wingman.


    ### Prompt Stack #1: Brainstorm Viral-Aware Video Ideas


    ![](Image00007.jpg)


    Start with relevant, searchable, audience-specific ideas.


    Act as a video strategist. Suggest 15 content ideas for my `[YouTube / TikTok
    / Reels]` channel.


    Topic: `[insert niche or theme]`

    Audience: `[describe ideal viewer]`

    Goal: `[grow audience, drive sales, build trust]`

    Tone: `[educational / fun / bold / emotional]`


    Follow-up:

    Now label each idea as:

    – Hook-driven

    – Story-driven

    – Tip-based

    – Trend-jump

    – Evergreen


    Now you have content with range — not randomness.


    ### Prompt Stack #2: Short-Form Video Scripts (Under 60 Sec)


    Hook fast. Deliver value. End strong.


    Write a 45–60 second video script for TikTok or Reels.


    Topic: `“[insert idea]"`

    Audience: `[target viewer]`

    Structure:

    1. Hook (first 3 seconds)

    2. 3 quick points or tips

    3. CTA (comment, follow, or DM)

    Tone: `[bold, casual, witty, motivational]`


    Bonus:

    Now reformat this into 3 short bullet points for use as on-screen text overlays.

    The script is written — just show up and read it.


    ### Prompt Stack #3: Long-Form Video Scripting for YouTube


    If you teach, demo, or share stories — YouTube is your stage.


    Write a 5-minute YouTube script for this title: `“[insert topic/title]"`

    Audience: `[describe viewer]`

    Include:

    – Attention-grabbing intro

    – 3–4 main teaching points

    – Personal example

    – Recap & CTA


    Tone: educational, high-energy, trustworthy


    Follow-up:

    Now add 2 time stamps and suggest 3 B-roll clip ideas to match each section.

    That’s your next YouTube video — half-edited already.


    ### Prompt Stack #4: Hooks, Openers & First 3 Seconds


    Attention is earned fast. AI can write like a scroll-stopper.


    Write 10 short-form video hooks for a `[coach / designer / freelancer / creator]`
    talking about `“[insert pain point or result].”`


    Each under 12 words.

    Make them curious, bold.


    ### Prompt Stack #5: CTAs That Actually Convert


    If they watch but don’t act… what’s the point?


    Write 5 short-form CTAs that invite the viewer to:

    – Comment

    – Save the video

    – DM for help

    – Download a resource

    – Click the link


    Tone: casual, confident


    ### Prompt Stack #6: Repurposing Across Platforms


    Turn one video into five formats.


    Act as a repurposing expert.

    Take this TikTok/Reel script and repurpose it into:

    – A tweet

    – A carousel outline

    – A podcast intro

    – A blog paragraph

    – A quote graphic


    ### Prompt Stack #7: YouTube Titles, Thumbnails & Descriptions


    Discoverability starts with clickability.


    Write 5 YouTube title options for `[insert topic].”

    Make them:

    – Click-worthy but not clickbait

    – Keyword-optimized


    Then:

    Write a 150-word YouTube description that includes:

    – What the video teaches

    – 2–3 search-friendly keywords

    – CTA to subscribe or download a resource

    – Hashtags


    Bonus:

    Suggest 3 thumbnail text options and 2 image ideas.


    ### Stack #8: Caption Generator for Short-Form


    Captions extend reach — and deepen relatability.


    Write an Instagram Reel caption for this video: `“[insert summary]"`

    Include:

    – 1 relatable intro sentence

    – Key insight or story

    – 1 CTA to comment

    – Up to 5 relevant hashtags


    Tone: friendly, punchy, not over-formal


    Want a spicier voice?

    Rewrite it in Gen Z / sarcastic / poetic / thought-leader style.


    ## Mini Case Story: The Silent Creator Who Bleed Up


    David, a financial literacy creator, was terrified of speaking on camera.


    Instead of fighting it, he used AI to:


    ● Write 20 short-form scripts with confident hooks

    ● Batch record voiceovers with visuals and stock B-roll

    ● Prompt YouTube descriptions, SEO tags, and shorts versions


    His second video hit 48K views in 4 days.

    His email list grew 300+ in 2 weeks.

    All without ever showing his face.


    “Prompting gave me a video engine — one I could actually run without burning out.”

