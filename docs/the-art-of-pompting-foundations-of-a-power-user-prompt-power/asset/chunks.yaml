    \ It should sound expert-level but approachable. My top 3 skills are `[skill1]`,\
    \ `[skill2]`, and `[skill3]`.\n\n**Prompt 3:**\nGive me 3 unique value propositions\
    \ I can highlight to stand out from other freelancers in `[industry]`. Avoid generic\
    \ phrases like 'hardworking' or 'attention to detail.'\n\n### \U0001F9E0 Prompt\
    \ Stack: Write Proposals That Win\n\n**Prompt 1:**\nAct as a top-rated freelancer.\
