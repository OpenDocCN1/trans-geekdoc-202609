    根据此客户项目编写一个简短的案例研究：


    - 客户类型：`[describe]`

    - 问题：`[brief summary]`

    - 解决方案：`[your process]`

    - 结果：`[data or qualitative feedback]`


    语调：专注的、视觉化的、低调的炫耀


    然后复用它：


    写 3 条文案，供我用于社交平台，分享这个案例研究。


    让你的结果自己说话。


    # 提示词栈 #5：证言与社交证明


    让满意的客户能够轻松地疯狂赞美你。


    ### 证言请求

    写一封证言请求邮件，在项目结束时发送。


    包含内容：

    - 感谢

    - 2–3 个简单的问题

    - 提议帮助将他们的反馈整理成引言


    语调：亲切且随和


    ### 然后进行二次创作

    将这条证言改写为：

    - 网站上的短引言

    - Instagram 文案

    - 个人作品集中的简介介绍


    一条证言 = 多个信任证明点。


    # 提示词栈 #6：客户反馈循环与评审流程


    在混乱和范围蔓延发生前防止它们。


    ### 请求修改

    写一条消息，要求客户对已交付的项目提供反馈。


    包含内容：

    - 对包含内容的提醒

    - 评审行动号召 (CTA)

    - 回复时间线


    语调：冷静且主动


    ### 委婉地拒绝

    帮我写一条消息，委婉提醒客户我们已经达到了包含在内的最后一轮修改。


    如果需要，提供付费修改选项。


    边界建立尊重。


    # 提示词栈 #7：高转化的品牌信息


    如果你是服务提供者，你的品牌不是 Logo —— 而是你的清晰度。


    ### 品牌简介

    帮我写一个品牌简介，描述：

    - 我帮助的对象是谁

    - 我做什么

    - 为什么有效

    - 我的独特之处


    字数限制：75–100 个单词

    语调：机智、友善、有力


    ### 后跟进

    写 3 条单行标语（taglines），供我用于社交媒体简介或网站页眉。


    这就是你如何将无形的才华转化为令人深刻的定位。


    # 提示词栈 #8：推荐、留存与重复业务


    不要只是结束 —— 要重新开启大门。


    ### 请求推荐

    写一封礼貌的邮件，询问满意的客户是否知道其他可能从我的服务中受益的人。


    语调：温暖、无压力、专业


    ### 提供留存方案

    为我刚完成项目的客户写一封简单的留存推销邮件。


    包含内容：

    - 我每月可以提供什么帮助

    - 价格区间

    - 预约通话的选项


    语调：乐于助人且低


    一个良好的客户 → 三个新机会。


    ## 迷你案例故事：从自由职业者到信赖的伙伴


    Sara 是一位自由设计师，经常在不同项目之间跳槽。


    她业务能力很强 ——但在拓展、跟进和范围清晰度方面表现不稳定。


    使用本章的提示词栈，她：

    - 通过一键欢迎包收紧了入职流程

    - 在几分钟内写出了完美的提案计划书

    - 以清晰的边界和后续步骤进行跟进

    - 建立了一个基于 `Notion` 的证言库

    - 通过复用案例研究赢得了 2 个留存客户


    “我停止了仅仅是‘交付’，开始‘领导’。提示词给了我从自由职业者成长为品牌的系统。”


    ## 客户工作与品牌建设提示词栈检查清单


    ✅ 创建清晰的入职信息和预期

    ✅ 编写个性化的提案以促成更多交易

    ✅ 进行冷启动 —— 采用温暖的、人性化的语气

    ✅ 通过迷你案例研究 + 社交帖子分享作品

    ✅ 请求证言并将其改写为多种格式

    ✅ 像专家一样管理反馈和范围

    ✅ 打造高转化的简介、品牌信息和报价

    ✅ 邀请重复业务、推荐和留存


    “客户的信任不是在项目本身中建立的。它是建立在项目周围的细节中的 —— 而提示词为你提供了这些细节的语言。”


    ## 结语：像创意者一样交付，像品牌一样领导。


    客户需要的不仅仅是才华 —— 他们需要信任。


    他们需要清晰度。边界。自信。存在感。


    提示词帮助你：

    - 更好的沟通

    - 更好的销售

    - 更好的领导

    - 被记住


    这不仅关乎更努力地工作 —— 更关乎更有结构地工作。


    所以带着清晰度出现。


    以卓越的标准交付。


    让 AI 帮你同时做到这两点 —— 规模化。


    下一步 → 奖励章节：构建你自己的提示词栈 – 框架方法


    # 奖励章节


    ### 构建你自己的提示词栈 – 框架方法


    现在，你已经看到提示词如何改变你的工作流了。


    从电子书和数字产品…… 到自由职业系统、内容创作、SaaS 创意和客户工作 ——


    提示词让你将清晰度转化为行动，将想法转化为收入。


    - 但这是终极的密钥：

    - 但这是终极的密钥：

    - 但这是终极的密钥：


    等等，让我们完善一下结构：


    ## 什么是提示词栈？


    提示词栈不仅仅是一个提示词。它是一系列提示词，帮助你完成：

    - 头脑风暴

    - 计划

    - 创建

    - 完善

    - 发布


    一个很棒的提示是有用的。一个强大的提示词栈是不可阻挡的。


    ## 五部分法提示词栈框架


    当你想要构建自己的时，使用此方法：


    ### 1. 定义结果

    你希望结果是什么？博客文章？课程？脚本？

    提示词：`I want to use AI to [describe the goal]`。


    ### 2. 拆分为阶段

    现在对过程建模。步骤有哪些？

    - 定义

    - 大纲

    - 编写

    - 格式化


    提示词：`Break down [task] into 3–5 stages`。


    ### 3. 选择格式和语调

    你的输出是 PDF？轮播？网页文案？推文？应该反映什么样的语调？


    提示词：`Suggest the best format and tone for this type of content`。


    ### 4. 在每个阶段进行迭代

    栈中的每个部分都应该允许测试、重写或扩展。

    提示词：`Rewrite this in a [tone/format] way`。


    ### 5. 系统化并保存

    一旦可行，下次不要从头开始。将你的栈存储在 `Notion`、`Google Docs` 或任何提示词库中。专业提示：给你的提示词栈命名。


    ## 示例：从零开始提示词栈


    假设你想卖一个 Notion 模板。以下是使用框架构建自定义栈的方法：


    ### 结果

    销售一个面向远程工作者的 Notion 模板。


    ### 阶段

    - 头脑风暴用例

    - 列出内容大纲

    - 填充示例数据


    ### 栈

    1. `Act as a product strategist. What are 10 useful Notion templates remote workers
    needed?`

    2. `Outline the sections of a Notion template called ‘Workday Clarity Planner’.`

    3. `Add sample fields and example content for each section.`

    4. `Write sales page copy for this template, including 3 bullet benefits.`

    5. `Suggest a visual mockup idea using Canva, and write a caption for launch.`


    保存它。微调它。再次使用它。


    现在，你有了自定义的提示词系统。


    ## 提示词栈构建器检查清单


    ✅ 定义你所需的输出或交付物

    ✅ 将过程拆分为 3–5 个阶段


