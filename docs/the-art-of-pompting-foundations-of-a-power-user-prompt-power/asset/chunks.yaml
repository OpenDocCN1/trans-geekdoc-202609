    – 主动为他们编写一个草案


    ### 案例研究

    现在根据这段客户旅程写一个简短的成功故事（3–4 句话）：


    之前：`[struggle]`


    之后：`[result]`


    语气：自豪但谦逊。以我的品牌口吻说话。


    社交证明 → 新线索 → 更大影响力。


    ## 提示词栈 #8：销售页面与私信策略


    现在让我们来填满你的日程。


    #### 销售页面草案

    为我的教练课程 `[name]` 编写一个销售页面，帮助 `[audience]` 实现 `[result]`。


    包含：

    – 钩子标题（Hook headline）

    – 痛点章节

    – 内部内容

    – 证言（占位符）

    – 价格与行动号召（CTA）


    语气：冷静、清晰、自信


    #### 私信（DM）脚本

    为一个点赞过我关于 `[topic]` 帖子的粉丝写一封友好、不推销的私信，邀请他们预约咨询电话（clarity call）。


    让 AI 帮你销售，而不会像垃圾信息。


    ---


    ## 微案例：从精疲力竭到约约满满


    Jordan 是一位心态教练，他对内容、行政事务和不稳定的客户系统感到精疲力竭。


    在 2 周内，他利用提示词实现了：


    ● 用一句话明确了他的产品

    ● 构建了一个期 6 周的课程

    ● 创建了精美的入职体验

    ● 生成了 30 天的内容

    ● 自动化课后跟进

    ● 构建了一个带有 AI 支持的 `Notion` 客户跟踪器


    “提示词给了我一个我不知道自己需要的系统。感觉我现在是在自己的才华领域进行教学——而不是在追逐任务。”


    在一个月内，他提高了价格并创建了候补名单。


    ### 教练与咨询提示词栈清单


    ✅ 明确利基市场、核心信息和产品

    ✅ 构建你的课程结构和工具

    ✅ 创建入职邮件和 intake 表单

    ✅ 自动化课程总结和跟进

    ✅ 计划网络研讨会、工作坊或发布活动

    ✅ 生成启发性、信赖的内容

    ✅ 收集并重写证言

    ✅ 构建销售页面和外联消息


    “你的客户不需要更多内容。他们需要的是清晰。提示词帮助你创造这种清晰度——为了他们，也为了你自己。”


    ---## 结语：你教客户——让 AI 教工作流


    教练是感性的、人性化的、转型性的。


    那部分？仍然属于你。


    但背后的压力呢？写作、结构化、发邮件、销售？


    那是 AI 发光发的地方——也是提示词栈成为你秘密武器的地方。


    用它提供更好的服务。

    更智能地扩展。

    最重要的是——留在你的才华领域。


    你进入这份工作是为了帮助他人。

    现在让提示词来帮助你。


    下一站 → 第 7 章：YouTube & TikTok 内容提示词包


    ---


    ## 第 7 章：YouTube & TikTok 内容提示词包 – 灯光、摄像、提示词


    创作视频内容是建立在线权威和信任的最快方式之一。


    大多数人在按下“录制”之前就卡住了。


    “我要说什么？”

    “我该怎么写脚本？”

    “这真的有趣吗？”


    引入提示词。


    这一章是你的幕后制作团队——帮助你生成：


    ● 具吸引力的视频创意

    ● 吸引人的开头和行动号召（CTA）

    ● 短视频和长视频脚本

    ● 重新利用的 Reels 和 Shorts

    ● 描述、说明、标题和标签


    无论你是一个害摄像头的初学者，还是一个想要节省数小时的内容机器——这个提示词包都是你的视频助攻手。


    ### 提示词栈 #1：脑风暴具有病毒传播意识的视频创意


    ![](img/Image00007.jpg)


    从相关的、可搜索的、针对观众的创意开始。


    作为一个视频策略师。为我的 `[YouTube / TikTok / Reels]` 频道建议 15 个内容创意。


    主题：`[插入利基或主题]`

    受众：`[描述理想观众]`

    目标：`[增长粉丝，驱动销售，建立信任]`

    语气：`[教育性的 / 有趣的 / 大胆的 / 感性的]`


    后续：

    现在将每个创意标记为：

    – 钩子驱动

    – 故事驱动

    – 技巧驱动

    – 趋势跳转

    – 常青（Evergreen）


    现在你拥有了有范围的内容——而不是随机的内容。


    ### 提示词栈 #2：短视频脚本（60 秒以内）


    快速钩子。交付价值。强力结尾。


    为 TikTok 或 Reels 写一个 45–60 秒的视频脚本。


    主题：`“[插入创意]"`

    受众：`[目标观众]`

    结构：

    1. 钩子（前 3 秒）

    2. 3 个快速要点或技巧

    3. CTA（评论、关注或私信）

    语气：`[大胆的、随意的、幽默的、励性的]`


    奖励：

    现在将其重新格式化为 3 个短要点，用于屏幕文字叠加。

    脚本写好了——只需出现并读出来即可。


    ### 提示词栈 #3：YouTube 长视频脚本编写


    如果你在教学、演示或分享故事——YouTube 是你的舞台。


    为这个标题写一个 5 分钟的 YouTube 脚本：`“[插入主题/标题]"`

    受众：`[描述观众]`

    包含：

    – 吸人的开头

    – 3–4 个主教学点

    – 个人案例

    – 总结与 CTA


    语气：教育性的、高能量的、信赖的


    后续：

    现在添加 2 个时间戳，并为每个部分建议 3 个 B-roll（空镜）片段建议。

    这就是你的下一个 YouTube 视频——已经完成了一半。


    ### 提示词栈 #4：钩子、开头与前 3 秒


    注意力是快速赢得的。AI 可以写出让人停止滑动屏幕的文字。


    为一个 `[教练 / 设计师 / 自由职业者 / 创作者]` 写 10 个短视频钩子，关于 `“[插入痛点或结果]。”`


    每个少于 12 个单词。

    让它们充满好奇感且大胆。


    ### 提示词栈 #5：真正转化的行动号召（CTA）


    如果他们看了但不行动……有什么意义？


    写 5 个短视频 CTA，邀请观众：

    – 评论

    – 保存视频

    – 私信咨询

    – 下载资源

    – 点击链接


    语气：随意的、自信的


    ### 提示词栈 #6：跨平台重新利用


    将一个视频变成五种格式。


    作为一个重新利用专家。将 TikTok/Reel 脚本重新利用为：

    – 推文

    – 轮播图大纲

    – 播客介绍

    – 博客段落

    – 引用图


    ### 提示词栈 #7：YouTube 标题、缩图与描述


    发现性始于点击率。


    为 `[插入主题]` 写 5 个 YouTube 标题选项。让它们：

    – 值得点击但不标题党

    – 关键词优化


    然后：

    写一个 150 字的 YouTube 描述，包含：

    – 视频教了什么

    – 2–3 个搜索关键词

    – 订阅或下载资源的 CTA

    – 标签


    奖励：

    建议 3 个缩图文字选项和 2 个图片建议。


    ### Stack #8：短视频说明生成器


    说明扩展范围——并深化共鸣。


    为这个视频写一个 Instagram Reels 说明：`“[插入总结]"`

    包含：

    – 1 句引起共感的开头

    – 核心洞察或故事

    – 1 个评论 CTA

    – 最多 5 个相关标签


    语气：友好的、简洁的、不过正式


    想要更有力的语气？

    用 Z 世代/讽刺的/诗意的/思想领袖风格重写。


    ## 微案例：默默崛起的沉默创作者


    David 是一位金融理财创作者，他非常害怕面对镜头说话。


    他没有逃避，而是利用 AI 实现了：


    ● 为 20 个带有自信钩子的短视频脚本

    ● 结合视觉效果和素材 B-roll 批量录制旁

    ● 生成 YouTube 描述、SEO 标签和短视频版本


    他的第二个视频在 4 天内获得了 4.8 万次观看。

    他的邮件列表在 2 周内增加了 300 多人。

    全程没有露脸。


    “提示词给了我一个视频引擎——一个我可以运行而不会精疲力竭的引擎。”


