    ## 第一章：提示词的艺术 – 高级用户的基础

    我们处于一场革命之中——而你正握着遥控器。


    不，不是电视那种。是 AI 那种。


    那种只需通过输入一个清晰且带有意图的句子，就能在几秒钟解锁数小时工作量的类型。


    创建一个 Logo。起草一份商业计划。写一封邮件。设计一节课程。为一个品牌进行头脑风暴。

    这一切只需一个提示词。


    但事实是：

    关键不在于 AI 能做什么，而在于你利用 AI 能做什么。


    这本书不是关于理论或炒作。

    它关乎将你变成一个 `提示词高级用户`（Prompt Power User）——一个不仅仅是为了好而使用 AI，而是为了有目的地进行构建、扩展、盈利和创作的人。


    ### 什么是提示词，到底是什么？

    提示词（Prompting）是以获取最佳可能输出的方式与 AI 模型进行通信的行为。它就像是给一个超级快速、超级聪明的实习生下指令：

    如果你描述得很模糊，它就会猜（而且会出错）。

    如果你描述得很具体，它就会执行（通常非常出色）。

    一个提示词不仅仅是一个命令。它是一场创造性的协作。当方法正确时，它感觉像魔法一样。


    ### 为什么提示词是新的素养

    过去，我们学习打字。然后是学习用 Google。现在？我们学习写提示词。我们提问的方式比我们知道的更重要。考虑一下：

    - 一个提示词良好的设计师生成资产的速度比一个设计团队更快。

    - 一个能构建提示词组合的教练可以服务更多客户并实现入职自动化。

    - 一个理解提示词的创作者可以将一个想法转化为 15 篇内容——瞬间完成。


    提示词是数字时代的元技能。而且，是的——你可以快速学会它。


    ### 提示词威力 = 输入 × 迭代

    ![](img/Image00001.jpg)

    你从 AI 获取的输出取决于两点：

    - 你定义任务的程度如何（`input`）

    - 你改进它的速度有多快（`iteration`）


    糟糕的提示词 = 通用的垃圾。

    良好的提示词 = 定制的黄金。

    伟大的提示词 = 一个可重复的系统。


    让我们来看一个例子：

    弱的提示词：`“帮我写一篇关于心态的博客文章。”`

    更好的提示词：`“为千禧一代写一篇关于建立成长心态的 700 字博客文章，包含 3 个例子，励性的语气，并在结尾带有一个可以推文的总结。”`

    威力提示词：`“扮演一名励性作家。为 25-35 岁深受自我怀疑困扰的人写一篇 700 字的博客文章，专注于建立成长心态。结构：1) 引人共鸣的故事开头，2)
    心态转变，3) 带有核心要点的总结。让语气显得真实但充满力量。”`


    第三个提示词给了 AI 角色、结构、受众和目标。这就是像高级用户一样使用提示。


    ### 一个优秀提示词的解剖

    这是一个让任何提示词变得强大的简单模板：

    - `ACT AS`（作为）：给 AI 分配一个角色或人格。

    - `TASK`（任务）：告诉它要创建什么。

    - `AUDIENCE`（受众）：说明它是为谁的。

    - `TONE & FORMAT`（语气与格式）：设定氛围或结构。

    - `CONTEXT/EXAMPLES`（背景/示例）：（可选但非常强大）


    如果不确定，就给 AI 提供过度信息。它在清晰的约束下效果最好。


    ### 提示词是一种技能，而不是捷径

    很多人认为：“如果我找到了一个完美的提示词，我就再也不需要其他的了。”并不是那么回事。提示词就像学习一门新语言。练习得越多，就越流利。


    真正的胜利是？提示词叠加（Stacking prompts）。

    使用它们来：

    - 头脑风暴想法

    - 制定项目计划

    - 创建草稿

    - 润色结果

    - 发布


    你不需要一个完美的提示词。你需要一个随你一起进化的系统。


    ### 提示词在哪里节省时间和精力的

    这里是 AI 提示词成为你快捷径的几个用例：

    - **创意生成**：`“为想要在线扩大规模的瑜伽老师提供 10 个产品想法。”`

    - **起草邮件或内容**：`“为加入我生产力课程的新成员写一封欢迎邮件。”`

    - **制定课程或工具包大纲**：`“为一个关于数字服务定价的工作坊会创建一个 5 步大纲。”`

    - **润色文案**：`“重写这段话，使其更有信心、更有活力。”`

    - **创建数字资产**：`“将这个推文串转化为一个电子书大纲。”`


    每一项都可以为你节省数小时。将这些倍加到整个业务中？你现在正以创始者的速度运行。


    ### 迷你案例故事：学会提示词的副业者

    认识 Zoya，她是一个 34 岁的全职员工，想开始一份副业但“没有时间”。

    她尝试过：

    - 头脑风暴数字产品想法：卡住了。

    - 编写销售页面：空白。

    - 创建内容：毫无反应。


    然后她学会了如何叠加提示词。在 3 天内，她：

    - 通过提示词生成了 5 个经过验证的想法

    - 制定并编写了一个 `Notion` 模板：“创作者时间追踪器”

    - 使用 AI 生成的文案建立了 `Gumroad` 销售页面

    - 通过 3 条提示词辅助的社交媒体帖子进行了发布


    她在前 3 笔销售中赚了 63 美元。但比起钱，她获得了动力。

    “提示词给了我在我以前会停滞时向前前进的方法。”


    Zoya 没有外包她的创造力——而是升级了它。


    提示词威力清单


