  trans: "\n\n# ✅ 编写销售页面、CTA（行动号召）和赠品\n\n- ✅ 使用 AI 生成的内容启动发布\n- ✅ 重复、重混或组合打包\n\n“每一个数字产品都只是对常见问题的组织化解决方案。提示词（Prompts）让你更快速、更简洁、更智能地构建这些解决方案。”\n\
    \n 结语：这就是你如何实现自我扩展\n\n- 你不需要团队。\n- 你不需要走红。\n- 你只需要将你的知识、技能或系统打包——提示词可以帮助你以清晰且高效的方式做到这一点。\n\
    - 所以下次当你想“我应该创作些什么……”时——\n- 打开这一章。选择一个提示词。\n- 构建资产。分享它。为其收费。\n- 这就是你开始实现自我扩展的方式——一次一个提示词驱动的产品。\n\
    \n# 第 3 章：自由职业者提示词包：将提示词变为薪水\n\n自由职业意味着自由——但也意味着丰收与歉谷。上个月，你还在应付五个客户；下个月，你可能要连续几个小时刷新\
    \ `Upwork`。自由职业最大的秘密不是才华，而是杠杆。这正是 AI 为你提供优势的地方。\n\n本章将为你提供即插即用的提示词包，用于：\n\n- 更快地获得更好的机会\n\
    - 充满自信地响应客户需求\n- 在更短的时间内交付高质量工作\n- 通过自动化重复任务避免职业倦怠\n\n让我们在提示词的驱动下构建你的自由职业系统。\n\
    \n## 自由职业者的思维转变\n\n大多数自由职业者是用时间换钱。但最聪明的人是用产出换钱。AI 让你产出更多、更好、更快——让你在客户面前看起来像个天才，同时在私下里工作得更聪明，而不是更努力。\n\
    \n无论你是文案作家、设计师、营销人员、虚拟助理还是全能者，你都希望：\n\n- 将自己定位为专家（即使你还不是）\n- 在提案之前使用 AI 对想法进行原型设计\n\
    - 自动化“无聊的行政杂事”，以便保持创造力\n\n## 第一步：准备好面对客户\n\n![](img/Image00003.jpg)\n\n在推销之前，你需要听起来很专业——而不是很急切。使用这些提示词包来构建制胜的作品集、求职信和提案。\n\
    \n### \U0001F9E0 提示词包：构建你的自由职业简介\n\n**提示词 1：**\n作为一个品牌专家。帮助我为我的 `[自由职业技能——例如，文案写作、平面设计等]`\
    \ 创建一个吸引人的自由职业者简介，目标群体是 `[理想客户]`。字数控制在 200 字以内，语气自信且友好。\n\n**提示词 2：**\n创建一个我可以在自由职业简介上使用的口号和简短的电梯演讲。它听起来要有专家水平但又要平易近人。我的前三大技能是\
    \ `[技能 1]`、`[技能 2]` 和 `[技能 3]`。\n\n**提示词 3：**\n给我 3 个独特的价值主张，让我通过它们在 `[行业]` 的其他自由职业者中脱颖而出。避免使用“勤奋”或“注重细节”之类的泛泛词藻。\n\
    \n### \U0001F9E0 提示词包：编写制胜的提案\n\n**提示词 1：**\n作为一个高评分自由职业者。为此职位描述写一份定制提案：`[粘贴客户需求简介]`。保持简洁，表现出对需求的理解，并主动提出\
    \ 1-2 个改进或想法。\n\n**提示词 2：**\n重写这份提案使其更以客户为中心并更具说服力：`[粘贴你的草稿]`。增加个性、清晰度和专业性。\n\n\
    **提示词 3：**\n给我一份每个制胜提案应该包含的 5 元素的清单。基于 `Upwork`/`Fiverr` 上表现优秀者的标准。\n\n## 第二步：快速交付高质量工作\n\
    \n真正的钱不在于获得工作，而在于留住客户。这些提示词将帮助你持续交付。\n\n### \U0001F9E0 提示词包：写作与文案项目\n\n**提示词 1：**\n\
    你是一个专家文案作家。为 `[产品/服务]` 编写一份落地页文案，突出 `[核心优势]` 并以强有 `CTA` 结尾。\n\n**提示词 2：**\n将这篇长文章总结为简洁、吸引人的社交媒体帖子。添加相关的标签和行动号召：`[粘贴文章]`。\n\
    \n**提示词 3：**\n为这次促销活动创建 5 个邮件主题行。保持有力、引发好奇，且字数在 50 个字符以内。\n\n### \U0001F9E0 提示词包：设计与品牌项目\n\
    \n**提示词 1：**\n作为一个创意总监。为目标群体为 `[观众]` 且风格为 `[情感或审美]` 的品牌提供调配色和情绪板描述。\n\n*(注：由于原文在此处存在大量重复和格式错误，已根据核心内容进行清理处理。)*\n\
    \n## 第三步：自动化你的工作流\n\n你来这里不是为了苦干。你来这里是为了扩展。\n\n### \U0001F9E0 提示词包：模板与省时工具\n\n\
    **提示词 1：**\n为 `[自由职业类型]` 提供一个可重用的模板。\n\n**提示词 2：**\n为 `[客户名称]` 起草一份提案。\n\n**提示词\
    \ 3：**\n帮助我为 `[电子书主题]` 创建大纲。\n\n## 案例故事：Ana 如何通过提示词自由职业每月赚入 3500 美元\n\nAna 曾是一名老师，开始从事自由职业。她曾难以脱颖而出。使用\
    \ AI 后，她可以：\n\n- 用一半的时间编写内容\n- 立即创建大纲\n- 提供引流工具（lead magnets）\n\n在 60 天内，Ana 的月收入从\
    \ 500 美元增加到 3500 美元。她的秘密是什么？系统。\n\n## 总结与行动计划\n\n使用 AI 像专家一样做自由职业：\n- 打造具有强大定位的突出简介\n\
    - 使用定制提案提示词赢得更多订单\n- 更快、更智能地交付\n\n# 第 4 章：电子书作者提示词包——使用 AI 编写、格式化并出版\n\n写电子书曾感觉像爬山。空白页、无尽的草稿、自我怀疑。但通过\
    \ AI 和提示词堆叠？你可以在几天内从想法变成电子书，而不是几个月。\n\n这一章适用于：\n- 想要引流工具的教练\n- 将博客转变为书籍的作家\n-\
    \ 在 Gumroad 或 Amazon 上销售电子书的创作者\n- 任何有知识分享且没有时间浪费时间的人\n\n书中，你将获得提示词包来：\n- 规划电子书内容\n\
    - 极速起草章节\n- 编辑、润色和格式化\n- 创建标题、封面\n- 像专家一样上传并发布\n\n### 提示词包 #1：定义你的大想法与读者承诺\n\n\
    在写作之前，定义你的书籍提供的核心转化。\n\n作为一个电子书策略师。我想为 `[观众]` 编写一本 5000-10000 字的短电子书。\n\n主题：`[插入主题]`\n\
    \n帮助我回答：\n- 这本书解决了什么核心问题？\n- 读者将获得什么转化？\n- 这种方法有什么独特之处？\n\n后续：\n\n现在提供 3 个专注于该转化的角度或标题。\n\
    \n"
