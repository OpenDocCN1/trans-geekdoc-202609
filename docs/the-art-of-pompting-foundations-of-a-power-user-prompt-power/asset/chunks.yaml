  trans: "\n\n# 提示词组合 #2：章节大纲生成器\n\n结构即清晰。让 AI 来构建骨架。\n\n为名为“[[插入暂定标题]”、面向 `[受众]`\
    \ 的电子书创建一个 7–10 章节的大纲。\n\n**目标：** 帮助读者从 `[起始点]` 达到 `[预期结果]`。\n\n包含章节标题以及每个章节的\
    \ 1–2 句描述。\n\n**仍在完善中？**\n现在将这些章节分为 3 部分：开头、中间、结尾。为每个部分添加一句话总结。现在，你已经准备好带着方向进行写作了。\n\
    \n# 提示词组合 #3：章节草稿（听起来不像机器人）\n\n用 AI 编写章节就像和一位才华横溢、高效的影子作家共同创作。\n\n扮演一名非虚构电子书作家。\n\
    \n为 `[受众]` “[[电子书标题]”的第一章。\n\n**语气：** `[友好、实用的、励舞的等.]`\n\n**结构：**\n1. 钩子或故事引言\n\
    2. 教学或核心内容（3–4 个子章节）\n3. 总结或收获\n\n**字数：** ~1,000–1,200 字\n\n**在过程中调整：**\n- 重写第\
    \ 2 部分，增加叙事性，减少指令感。\n- 让它听起来像是一个真人在分享经验。\n- 你不需要完美——你需要一个扎实的初稿。\n\n# 提示词组合 #4：编辑、风格与流畅度润色\n\
    \n让 AI 帮你精炼文字并统一你的语调。\n\n**提高清晰度：**\n为了清晰度和结构编辑此章节。拆分长段落。使用更简单的语言。删掉废话。\n\n**调整语气：**\n\
    用更具 `[大胆 / 有同理心 / 幽默]` 的语气重写此章节。保留观点，改变表达方式。\n\n**添加名言或比喻：**\n在引言中加入相关的名言或比喻，以产生情感吸引。\n\
    \n你的原始草稿现在听起来犀利、人性化且易于阅读。\n\n# 提示词组合 #5：标题、副标题与标语\n\n标题决定销量。但想出一个出色的标题很难——直到你用提示词生成它。\n\
    \n扮演一名图书营销人员。为一本帮助 `[受众]` 解决 `[问题]` 的非虚构电子书建议 10 组标题+副标题的组合。\n\n**制作标题：**\n- 清晰，而非花哨\n\
    - 利益驱动\n- 易于快速扫读\n\n**语气：** `[友好 / 大胆 / 赋能]`\n\n**后续：**\n现在给我一个可以用在封面或落地页上的极简短标语（Tagline）。测试你最喜欢的。然后定稿。\n\
    \n# 提示词组合 #6：作者简介、封底与亚马逊描述\n\n让我们来完善你的个人形象。\n\n**作者简介：**\n为一位 `[你的背景/角色]` 的人写一段简短的作者简介（75–100\
    \ 单词）。\n语气：平易近人、可信赖、带一点个性。\n\n**亚马逊描述：**\n为“[[标题]]”写一段书籍描述，要求：\n- 吸引注意力\n- 概述内部内容\n\
    - 描述转变过程\n- 以行动号召（CTA）结尾\n\n**限制：** 200 单词。使用短段落格式。\n\n**封底文案：**\n现在将其缩短为封底：3\
    \ 行内容，2 个利益点，1 句话。你的电子书现在听起来非常专业了。\n\n# 提示词组合 #7：格式指南（告别头疼）\n\n你不需要 `Vellum` 或花哨的工具。你需要结构。\n\
    \n扮演布局指南。我应该如何在 `Word` 或 `Google Docs` 中格式化 Kindle 电子书？\n包含：\n- 字体建议\n- 标题样式\n\
    - 段落间距\n- 分页\n- 目录（TOC）设置\n\n让它简洁且符合 Kindle 。\n\n**需要视觉效果吗？**\n推荐一个极简风格的 `Canva`\
    \ 模板。推荐 2–3 个符合本书语气的视觉主题。一致性 = 专业。\n\n# 提示词组合 #8：发布内容与推广\n\n让我们把这个东西卖出去。\n\n扮演数字战略师。为我的电子书“[[标题]”为\
    \ `[受众]` 创建为期 7 天的内容计划。\n\n包含：\n- 3 个推文创意\n- 2 个 Instagram 标题\n- 1 封发布邮件\n- 1\
    \ 个“幕后”故事\n\n**语气：** `[教育性的 / 轻微炒热的]`\n\n想要长青内容吗？现在将其转化为 5 篇我可以重复使用的长青帖子。\n\n\
    ## 案例故事：从博客文章到畅销书\n\nNikhil 是一位效率教练，拥有几十篇博客文章和邮件内容，但从没时间写书。通过提示词组合，他：\n- 根据受众痛点挑选了他最棒的话题\n\
    - 生成了完整的 8 章节大纲\n- 粘贴博客并提示 `AI` 进行重构和重写\n- 使用 `ChatGPT` 对语气和流畅度进行编辑\n- 在 `Gumroad`\
    \ 上发布，配有 AI 的落地页\n\n他在第一周就赚了 297 美元，但更重要的是——那本电子书成为了获取 3 个新教练客户的敲门砖。“提示词并没有替我写书。它让完成这本书成为可能。”\n\
    \n## 电子书提示词包：主清单\n\n✅ 定义受众、承诺和独特视角\n✅ 提示词生成清晰的章节大纲\n✅ 使用章节组合撰写初稿\n✅ 提示词生成标题、副标题与标语\n\
    ✅ 提示词生成作者简介、封底与亚马逊描述\n✅ 提示词获取格式指南\n✅ 提示词生成发布内容与推广\n\n## 结语思考：提示词让写作成为可能\n\n- 提示词并没有替我写书。它让完成这本书成为可能。\n\
    - 你的故事\n- “提示词并没有替我写书。它让完成这本书成为可能。”\n- \n现在，你已经准备好带着方向进行写作了。\n\n"
- fmt: "\nWant to go deeper? Use long-form formats like Instagram carousels or Twitter\
    \ threads.\n\nCreate a 7-slide Instagram carousel based on this idea: “[[insert\
    \ idea]”\n\nFor `[audience]`. \n\nEach slide should be:\n– Slide 1: Hook\n– Slide\
    \ 2–6: Steps, value, story\n– Slide 7: Summary + CTA\n\nTone: `[educational, motivational,\
    \ tactical]`\n\nWant a thread?\nTurn this carousel into a 5–8 tweet thread. Add\
    \ personality and 1 bold opinion.\n\nNow you’re multi-platform by default.\n\n\
    # Prompt Stack #5: Content Repurposing Machine\n\nRepurpose one great post into\
    \ five.\n\nTake this Instagram caption and repurpose it into:\n– A tweet\n– A\
    \ LinkedIn post\n– A 30-second video script\n– An email teaser\n– A carousel outline\n\
    \n**Follow-up:**\nNow create 3 title options for each format.\n\nYour best ideas\
    \ now work harder — everywhere.\n\n# Prompt Stack #6: Value Bombs & Teaching Posts\n\
    \nWant to be known as the go-to person in your niche?\nStart teaching.\n\nWrite\
    \ a step-by-step social post explaining how to `[achieve a result]` for `[audience]`.\
    \ \n\nInclude:\n– Clear intro\n– 3–5 steps (each with 1-line tip)\n– Closing line\
    \ that invites action or feedback\n\nTone: `smart, kind , generous`\n\nNow reframe\
    \ that as a carousel or thread to go deeper.\nTeaching = trust. Trust = growth.\n\
    \n# Prompt Stack #7: Storytelling & Vulnerability Posts\n\nHumans follow humans\
    \ — not robots.\nLet’s get real.\n\nWrite a vulnerable story post about a time\
    \ I `[struggled with something in my business or life]`.\n\nInclude:\n– A quick\
    \ story intro\n– What changed\n– What I learned\n– One takeaway for others\n\n\
    Tone: `honest, relatable, non-preachy`\n\nWant it shorter?\nNow condense that\
    \ into 5 tweets that tell the same story.\n\nYou just built emotional connection\
    \ — in 5 minutes.\n\n# Prompt Stack #8: CTAs & Engagement Prompts\n\nYou’ve posted…\
    \ now what?\nPrompt it to prompt your audience.\n\nWrite 5 creative CTAs for a\
    \ post that teaches `[topic]`. \n\nMix:\n– Comment CTA\n– Share/tag CTA\n– Save/bookmark\
    \ CTA\n– DM me CTA\n– Click the link CTA\n\nKeep them friendly, specific, and\
    \ non-pushy.\nYour content shouldn’t just talk. It should start conversations.\n\
    \n## Mini Case Story: 3X Growth in 30 Days\n\nPam, a wellness coach, was stuck\
    \ at 800 followers for 4 months.\nShe felt drained trying to “show up” online\
    \ daily.\n\nSo she built a prompt system:\n● Defined 4 content pillars\n● Used\
    \ AI to create 5 posts/week\n● Repurposed her IG posts into Threads and Reels\n\
    ● Prompted captions, CTAs, and carousel scripts\n\nIn 30 days, she gained 2,400\
    \ new followers, 92 subscribers, and booked discovery calls.\n“Once I stopped\
    \ overthinking every post and started prompting, it all felt easier.”\n\n## Social\
    \ Media Growth Prompt Checklist\n\n✅ Define content pillars\n✅ Generate 15 post\
    \ ideas across 3–5 themes\n✅ Create scroll-stopping hooks\n✅ Write posts in different\
    \ tones and formats\n✅ Build carousels and repurpose across platforms\n✅ Teach\
    \ clearly and tell stories\n✅ Automate CTAs and call-to-actions\n✅ Stack your\
    \ best content for mileage\n\n“Your content doesn’t need to be perfect — it needs\
    \ to be consistent.”\n\n### Closing Thought: Post Smarter, Not Harder\n\nYou don’t\
    \ need to chase trends, hack the algorithm, or post 5 times a day. You need to:\n\
    ● Know your audience\n● Show up with value\n● Repeat with structure\n\nPrompting\
    \ turns content from a chore into a system. And when content becomes a system,\
    \ growth becomes inevitable. So go create. Post. Connect. One prompt at a time.\n\
    \n# Chapter 6: Coaching & Consulting Pack\n\n## Serve More, Sell Better, Scale\
    \ Smarter\n\nYou became a coach or consultant to help people — not to drown in\
    \ admin, content creation, or launch overwhelm. But between services… you’ve probably\
    \ thought: “I need a second brain.” This chapter gives you one — in the form of\
    \ AI-powered prompts that think and plan with you. Whether you’re just starting\
    \ or fully booked, these stacks help you:\n● Clarify your offer and ideal client\n\
    ● Build coaching programs and resources\n● Automate onboarding and client emails\n\
    ● Create social, webinar, and sales content\n● Serve your people without burning\
    \ out\n\nLet’s build a coaching engine powered by your wisdom — and supported\
    \ by AI.\n\n### Prompt Stack #1: Clarify Your Niche & Signature Offer\n\n![](Image00006.jpg)\n\
    \nYour offer should be a promise — not just a package.\nAct as a clarity coach.\
    \ Help me refine my niche and signature offer. I’m a `[type of coach or consultant]`.\
    \ I help `[audience]` achieve `[result]`.\n\nAsk me 3 questions to go deeper.\
    \ Then summarize:\n– My niche\n– The core problem I solve\n– My signature offer\
    \ in 1 sentence\n\nWant more?\nNow suggest a bold name + tagline for my signature\
    \ coaching package.\n Clarity sells. AI helps you sharpen it.\n\n### Prompt Stack\
    \ #2: Program & Curriculum Builder\n\nBuild a 4, 6, or 8-week program in minutes.\n\
    Create a 6-week coaching program outline for `[audience]` to help them `[achieve\
    \ goal]`.\n\nFor each week, include:\n– A theme or focus\n– Key lesson or shift\n\
    – 1 action step or exercise\n\nTone: `transformational but simple`\n\nNeed client\
    \ resources?\nNow write a client worksheet for Week 1. Include 3 questions + 1\
    \ journaling prompt.\nYou now have a structured offer and resources to support\
    \ it.\n\n### Prompt Stack #3: Client Onboarding Emails & Intake Forms\n\nFirst\
    \ impressions matter. Automate the experience.\n\n**Welcome email:**\nWrite a\
    \ warm onboarding email for a new 1:1 coaching client. Include:\n– Gratitude\n\
    – What to expect\n– Call scheduling link\n– What they should prepare\nTone: `welcoming,\
    \ organized, empowering`\n\n**Intake form:**\nCreate 7 intake form questions I\
    \ can send new clients to help me understand their goals, challenges, and desired\
    \ outcomes. Keep them simple, reflective, and aligned to personal growth.\nYou’ll\
    \ look organized, professional, and caring from Day 1.\n\n### Prompt Stack #4:\
    \ Session Recaps & Coaching Notes\n\nAfter each session, keep the momentum alive.\n\
    Act as a coaching assistant. Write a 1-paragraph recap email after a client session.\
    \ Include:\n– What we covered\n– Key takeaway\n– Action step for the week\n– Encouraging\
    \ note\n\nWant to go deeper?\nNow create a reflection journaling prompt the client\
    \ can respond to before our next session. This level of follow-up creates retention\
    \ and rave reviews.\n\n### Prompt Stack #5: Group Coaching & Webinar Planning\n\
    \nIf you run groups or live events — prompt your agenda.\nCreate a 60-group coaching\
    \ session outline. Topic: `[insert topic]` Include:\n– 5-min intro\n– Teaching\
    \ points\n– 2 reflection questions\n– Group breakout suggestion\n– Wrap-up & CTA\n\
    \nFor webinars:\nWrite a webinar outline that teaches `[topic]` in 3 core points.\
    \ Include a soft pitch for my offer at the end.\nYou now have your next launch\
    \ or workshop mapped — in minutes.\n\n### Prompt Stack #6: Content Creation for\
    \ Coaches\n\nYour clients need reminders, inspiration, and tough love.\nWrite\
    \ 5 Instagram captions that inspire `[audience]` to take action toward `[goal]`.\
    \ Tone: `bold, wise, and motivating — like a coach who tells it like it is.`\n\
    \nWant a story post?\nWrite a story about a client who went from `[struggle]`\
    \ to `[result]` (change details). Include: intro, transformation, and 1 lesson\
    \ for the reader.\nNow you’re building trust before the first DM.\n\n### Prompt\
    \ Stack #7: Testimonials & Success Stories\n\nLet AI help you capture your best\
    \ work.\n\n**Request email:**\nWrite a message asking a happy client for a testimonial.\
    \ Include:\n– A thank-you\n– 3 prompt questions\n"
