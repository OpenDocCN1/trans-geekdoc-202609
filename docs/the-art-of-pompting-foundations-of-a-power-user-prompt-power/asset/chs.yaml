- "# 提示词艺术：高级用户基础指南 (提示词力量系列 2)\n\n\n\n![](img/Image00012.jpg)\n![](img/Image00012.jpg)\n\
  ![](img/Image00000.jpg)\n\n\n\n\n\n\n\n## Jordan Lane 的其他作品\n想超越这本书的内容吗？\n\n探索 AI\
  \ 驱动的提示词组合、实用的数字工具以及独家的创作者资源，旨在帮助你工作更聪明、变现更快。\n\n请在此处访问完整收藏：[www.crescentrowmedia.com](https://www.crescentrowmedia.com)\n\
  \n下载即刻用的提示词包：[jordanwrites6.gumroad.com/l/jieaie](https://jordanwrites6.gumroad.com/l/jieaie)\n\
  \n更快创作。更智能地发布。像高级用户一样使用提示词。\n\n## 关于作者\nJordan Lane 是一位数字战略家、提示词工程师，也是使用 AI 创建真实、可持续收入的倡导者。Jordan\
  \ 拥有内容设计和数字创业的背景，赋能创作者释放 `ChatGPT` 及其他工具的全部潜力——不是通过炒作，而是通过智能的系统和真实的成果。\n\n这是系列丛中的第二本书，旨在帮助你将创意变现，并掌握提示词的艺术。\n\
  \n\n## 第一章：提示词的艺术 – 高级用户的基础\n我们处于一场革命之中——而你正握着遥控器。\n\n不，不是电视那种。是 AI 那种。\n\n那种只需通过输入一个清晰且带有意图的句子，就能在几秒钟解锁数小时工作量的类型。\n\
  \n创建一个 Logo。起草一份商业计划。写一封邮件。设计一节课程。为一个品牌进行头脑风暴。\n这一切只需一个提示词。\n\n但事实是：\n关键不在于 AI 能做什么，而在于你利用\
  \ AI 能做什么。\n\n这本书不是关于理论或炒作。\n它关乎将你变成一个 `提示词高级用户`（Prompt Power User）——一个不仅仅是为了好而使用\
  \ AI，而是为了有目的地进行构建、扩展、盈利和创作的人。\n\n### 什么是提示词，到底是什么？\n提示词（Prompting）是以获取最佳可能输出的方式与\
  \ AI 模型进行通信的行为。它就像是给一个超级快速、超级聪明的实习生下指令：\n如果你描述得很模糊，它就会猜（而且会出错）。\n如果你描述得很具体，它就会执行（通常非常出色）。\n\
  一个提示词不仅仅是一个命令。它是一场创造性的协作。当方法正确时，它感觉像魔法一样。\n\n### 为什么提示词是新的素养\n过去，我们学习打字。然后是学习用 Google。现在？我们学习写提示词。我们提问的方式比我们知道的更重要。考虑一下：\n\
  - 一个提示词良好的设计师生成资产的速度比一个设计团队更快。\n- 一个能构建提示词组合的教练可以服务更多客户并实现入职自动化。\n- 一个理解提示词的创作者可以将一个想法转化为\
  \ 15 篇内容——瞬间完成。\n\n提示词是数字时代的元技能。而且，是的——你可以快速学会它。\n\n### 提示词威力 = 输入 × 迭代\n![](img/Image00001.jpg)\n\
  你从 AI 获取的输出取决于两点：\n- 你定义任务的程度如何（`input`）\n- 你改进它的速度有多快（`iteration`）\n\n糟糕的提示词 =\
  \ 通用的垃圾。\n良好的提示词 = 定制的黄金。\n伟大的提示词 = 一个可重复的系统。\n\n让我们来看一个例子：\n弱的提示词：`“帮我写一篇关于心态的博客文章。”`\n\
  更好的提示词：`“为千禧一代写一篇关于建立成长心态的 700 字博客文章，包含 3 个例子，励性的语气，并在结尾带有一个可以推文的总结。”`\n威力提示词：`“扮演一名励性作家。为\
  \ 25-35 岁深受自我怀疑困扰的人写一篇 700 字的博客文章，专注于建立成长心态。结构：1) 引人共鸣的故事开头，2) 心态转变，3) 带有核心要点的总结。让语气显得真实但充满力量。”`\n\
  \n第三个提示词给了 AI 角色、结构、受众和目标。这就是像高级用户一样使用提示。\n\n### 一个优秀提示词的解剖\n这是一个让任何提示词变得强大的简单模板：\n\
  - `ACT AS`（作为）：给 AI 分配一个角色或人格。\n- `TASK`（任务）：告诉它要创建什么。\n- `AUDIENCE`（受众）：说明它是为谁的。\n\
  - `TONE & FORMAT`（语气与格式）：设定氛围或结构。\n- `CONTEXT/EXAMPLES`（背景/示例）：（可选但非常强大）\n\n如果不确定，就给\
  \ AI 提供过度信息。它在清晰的约束下效果最好。\n\n### 提示词是一种技能，而不是捷径\n很多人认为：“如果我找到了一个完美的提示词，我就再也不需要其他的了。”并不是那么回事。提示词就像学习一门新语言。练习得越多，就越流利。\n\
  \n真正的胜利是？提示词叠加（Stacking prompts）。\n使用它们来：\n- 头脑风暴想法\n- 制定项目计划\n- 创建草稿\n- 润色结果\n\
  - 发布\n\n你不需要一个完美的提示词。你需要一个随你一起进化的系统。\n\n### 提示词在哪里节省时间和精力的\n这里是 AI 提示词成为你快捷径的几个用例：\n\
  - **创意生成**：`“为想要在线扩大规模的瑜伽老师提供 10 个产品想法。”`\n- **起草邮件或内容**：`“为加入我生产力课程的新成员写一封欢迎邮件。”`\n\
  - **制定课程或工具包大纲**：`“为一个关于数字服务定价的工作坊会创建一个 5 步大纲。”`\n- **润色文案**：`“重写这段话，使其更有信心、更有活力。”`\n\
  - **创建数字资产**：`“将这个推文串转化为一个电子书大纲。”`\n\n每一项都可以为你节省数小时。将这些倍加到整个业务中？你现在正以创始者的速度运行。\n\
  \n### 迷你案例故事：学会提示词的副业者\n认识 Zoya，她是一个 34 岁的全职员工，想开始一份副业但“没有时间”。\n她尝试过：\n- 头脑风暴数字产品想法：卡住了。\n\
  - 编写销售页面：空白。\n- 创建内容：毫无反应。\n\n然后她学会了如何叠加提示词。在 3 天内，她：\n- 通过提示词生成了 5 个经过验证的想法\n-\
  \ 制定并编写了一个 `Notion` 模板：“创作者时间追踪器”\n- 使用 AI 生成的文案建立了 `Gumroad` 销售页面\n- 通过 3 条提示词辅助的社交媒体帖子进行了发布\n\
  \n她在前 3 笔销售中赚了 63 美元。但比起钱，她获得了动力。\n“提示词给了我在我以前会停滞时向前前进的方法。”\n\nZoya 没有外包她的创造力——而是升级了它。\n\
  \n提示词威力清单\n\n\n\n\n\n在你使用 AI 任何任何事情之前，请先检查以下几点：\n\n- ✅ AI 扮演的是什么角色？（例如：教练、作家、营销人员）\n\
  - ✅ 任务是什么？（写作、头脑风暴、总结、列大纲？）\n- ✅ 它是为谁服务的？（受众、利基市场）\n- ✅ 它应该遵循什么样的语气或格式？\n- ✅ 你能为它提供背景、示例或参考吗？\n\
  \n如果你能回答这五个问题 —— 结果将会非常火 \U0001F525。\n\n### 结语：你 + AI = 无限杠杆\n\n- 你不需要掌握每一个工具。\n\
  - 你不需要跟随每一个趋势。\n- 但如果你能掌握提示词（Prompting）的艺术\n- 你将获得终极力量：杠杆。\n\n这种能力让你：\n- 思维更清晰\n\
  - 工作更快速\n- 构建更智能\n- 发布更迅速\n\n这仅仅是一个开始。\n\n让我们开始构建你的提示词帝国吧——一次一个堆栈（Stack）。\n\n##\
  \ \U0001F9E0 等等——提示词栈（Prompt Stack）和提示词包（Prompt Pack）有什么区别？\n\n让我们尽早弄清楚，这样你就可以放心地使用它们：\n\
  \n| 术语 | 想象成…… | 功能 | 结构 |\n| :--- | :--- | :--- | :--- |\n| `Prompt Stack` | 菜谱\
  \ | 帮助你通过一系列提示词完成一个特定的任务 | 逐步执行的序列 |\n| `Prompt Pack` | 一本食谱 | 为一个目标或角色提供全套提示词栈集合\
  \ | 多个堆栈 + 赠品 |\n\n### \U0001F539 提示词栈 (Prompt Stack)\n\n`prompt stack` 是一个微系统。每个提示词都建立在上一个之上\
  \ —— 引导你从想法走向执行。\n\n**示例：**\n想写一篇博客文章吗？一个 `prompt stack` 可能包含：\n1. 定义你的读者\n2. 生成标题选项\n\
  3. 列出结构大纲\n4. 编写章节草稿\n5. 添加行动号召（CTA）并进行润色\n\n### \U0001F538 提示词包 (Prompt Pack)\n\
  \n`prompt pack` 是多个堆栈和相关提示词的组合。它旨在帮助你在某个领域中获胜——比如自由职业、教练或内容创作。\n\n**示例：**\n自由职业者的\
  \ `Prompt Pack` 包含以下堆栈：\n- 构建个人简介\n- 洽谈客户\n- 编写计划书\n- 自动化跟进\n\n将 `prompt stacks`\
  \ 视为“如何做”，而将 `prompt packs` 视为“做什么”。两者结合？你将变得无所不能。\n\n---\n\n## 第 2 章：数字产品提示词包 –\
  \ 一次创建，永远售卖\n\n欢迎来到你最喜欢的新领域：数字产品。与用时间换钱的服务工作不同，数字产品带给你规模效应。创建一次东西。卖出百次——甚至千次。\n\n\
  更好的是？你不需要成为专家、设计师或课程创作者。你只需要正确的想法、一个简单的系统和几个提示词。在本章中，我们将使用 `prompt stacks` 来：\n\
  - 寻找高需求、低努力的想法\n- 使用 AI 为你的产品列大纲并起草\n- 命名、包装并销售\n- 自动化你的内容创作\n\n充满自信地开始被动（或半被动）收入\n\
  \n### 提示词栈 #1：想法生成器 – 低投入、高需求\n\n最好的数字产品想法是解决一个小但令人烦恼的问题。`扮演一名数字教练。我想发布一个低于 25 美元的简单产品。目标受众：[描述你的利基市场]。`\n\
  \n**提示词：**\n`建议 10 个我可以使用 AI + 无代码工具在一周内完成的数字产品想法。对于每个想法，请包括：产品标题、解决了什么问题、格式（例如\
  \ Notion、Canva 等）、变现潜力`\n\n**后续提示词：**\n`根据构建难度与受众需求的对比，对这些想法进行排序。列出一份根据你的优势定制的验证过的列表。`\n\
  \n### 提示词栈 #2：产品结构与构建计划\n\n一旦你选定了一个想法，就对它进行规划。`扮演一名产品战略师。我选择了 [产品想法]。`\n\n**提示词：**\n\
  `为它创建一个结构 —— 列出 5 个章节或模块。每个章节写下 1–2 句描述。格式：[Notion / PDF / 模板包]`\n\n**也想要构建计划吗？**\n\
  `现在给我一个简单的 3 天构建计划。每天的任务，以便使用 AI 从零开始完成这个产品。`\n\n### 提示词栈 #3：使用 AI 起草（内容 + 语气）\n\
  \n是时候创建你的产品内容了——快一点。`扮演一名产品作家。为我标题为“[插入标题]”的产品第一部分创建内容。语气：[有趣、可操作、赋能、极简、等]`\n**受众：**\
  \ `[创业者、创作者、家长等]`\n**输出：** `项目要点列表、短提示，或便于扫读和使用的格式化文本。`\n\n**提示：** `将字数控制在 [X] 以下。`\
  \ —— 每个章节使用一次，然后在过程中不断润色。加入你的个人见解、故事和示例。\n\n### 提示词栈 #4：产品名称与标语\n\n命名困难？用提示词解决它吧。`扮演一名品牌专家。为一个帮助\
  \ [受众] 获得 [结果] 的数字产品建议 10 个朗朗上口的名称。`\n\n**提示词：**\n`让名称简洁、清晰并以收益为导向。为每个名称包含一行标语或副标题。`\n\
  \n**还是卡住了？**\n`给我提供这些语气的名称：幽默的、极简的、感性的。`\n\n### 提示词栈 #5：设计建议与格式流程\n\n即使你不是设计师，你的产品也可以看起来很棒。`扮演一名数字产品设计师。根据我的内容大纲，为\
  \ Notion/Canva/PDF 产品建议一种布局。`\n\n包含：自己的章节标题\n- 图标或视觉元素\n- 使用的字体\n- 配色方案\n\n保持 `[受众类型]`\
  \ 的整洁且符合品牌形象。\n**额外：** 建议哪里可以添加标注、插图以提升视觉效果。\n\n### 提示词栈 #6：转化销售页文案\n\n现在让它卖出去。`扮演一名销售文案专家。为“[产品名称]编写销售页，帮助[受众]解决[痛点]。`\n\
  \n包含：\n1. 钩子标题\n2. 问题章节\n3. 功能 + 收益\n4. 内容\n5. 行动号召\n语气：`友好、直接`\n\n**可选 CTA 提示词：**\n\
  `给我 3 个可以使用的 CTA —— 温和的、大胆的、好奇。`\n\n### 提示词栈 #7：引流磁或赠品创建\n\n想增加销量或你的邮件列表吗？添加一个赠品。`扮演一名营销战略师。根据我的产品“[产品名称]”，建议\
  \ 3 个引流磁或赠品。`\n\n对于每个，描述：\n- 它是什么\n- 它与主产品的联系\n- 它如何增加价值或转化\n\n**现在提示构建：**\n`现在创建第二个赠品的草稿\
  \ —— 让它轻量、实用且易于消费。`\n\n### 提示词栈 #8：发布内容引擎\n\n产品好了——让全世界知道。`扮演一名内容营销人员。创建 5 个短形式帖子创意（推特/Instagram/LinkedIn），向[受众]推广“[产品名称]”。`\n\
  \n包含：\n- 钩子\n- 正文\n- 行动号召\n语气：`[大胆的、教育性的、感性的等]`\n\n**想要幻灯片创意？**\n`现在将帖子 2 转换为 5\
  \ 页 Instagram 幻灯片。包含幻片标题和标题文案。`\n\n---\n\n## 迷你案例故事：3 小时数字包\n\nAshley 一直想创建一个产品，但认为自己没有时间。她使用了本章中的提示词栈，并在\
  \ 3 小时内完成了：\n- 为初级助理提示了 5 个产品想法\n- 选择了一个：助理入门 SOP\n- 使用 AI 列出了 10 个 SOP 模板\n- 提示了文案、销售页和\
  \ 3 条 Instagram 帖子\n- 上传到 Gumroad\n\n两天内，她赚了 87 美元。两周内超过 400 美元。最棒的部分是什么？她现在拥有一套重复的系统来创建、发布和扩展\
  \ —— 而不会感到压力。\n\n### 你的数字产品提示词栈清单\n\n- ✅ 生成 10 个低投入、高需求的产品想法\n- ✅ 根据投入与需求的对比进行验证\n\
  - ✅ 将产品分为 3–5 个章节\n- ✅ 为每个章节或模板提示草稿\n- ✅ 命名 + 编写副标题或标语\n- ✅ 使用视觉设计建议构建布局\n\n\n\n\
  ## ✅ 编写销售页面、CTA（行动号召）和赠品\n\n- ✅ 使用 AI 生成的内容启动发布\n- ✅ 重复、重混或组合打包\n\n“每一个数字产品都只是对常见问题的组织化解决方案。提示词（Prompts）让你更快速、更简洁、更智能地构建这些解决方案。”\n\
  \n 结语：这就是你如何实现自我扩展\n\n- 你不需要团队。\n- 你不需要走红。\n- 你只需要将你的知识、技能或系统打包——提示词可以帮助你以清晰且高效的方式做到这一点。\n\
  - 所以下次当你想“我应该创作些什么……”时——\n- 打开这一章。选择一个提示词。\n- 构建资产。分享它。为其收费。\n- 这就是你开始实现自我扩展的方式——一次一个提示词驱动的产品。\n\
  \n## 第 3 章：自由职业者提示词包：将提示词变为薪水\n\n自由职业意味着自由——但也意味着丰收与歉谷。上个月，你还在应付五个客户；下个月，你可能要连续几个小时刷新\
  \ `Upwork`。自由职业最大的秘密不是才华，而是杠杆。这正是 AI 为你提供优势的地方。\n\n本章将为你提供即插即用的提示词包，用于：\n\n- 更快地获得更好的机会\n\
  - 充满自信地响应客户需求\n- 在更短的时间内交付高质量工作\n- 通过自动化重复任务避免职业倦怠\n\n让我们在提示词的驱动下构建你的自由职业系统。\n\n\
  ## 自由职业者的思维转变\n\n大多数自由职业者是用时间换钱。但最聪明的人是用产出换钱。AI 让你产出更多、更好、更快——让你在客户面前看起来像个天才，同时在私下里工作得更聪明，而不是更努力。\n\
  \n无论你是文案作家、设计师、营销人员、虚拟助理还是全能者，你都希望：\n\n- 将自己定位为专家（即使你还不是）\n- 在提案之前使用 AI 对想法进行原型设计\n\
  - 自动化“无聊的行政杂事”，以便保持创造力\n\n## 第一步：准备好面对客户\n\n![](img/Image00003.jpg)\n\n在推销之前，你需要听起来很专业——而不是很急切。使用这些提示词包来构建制胜的作品集、求职信和提案。\n\
  \n### \U0001F9E0 提示词包：构建你的自由职业简介\n\n**提示词 1：**\n作为一个品牌专家。帮助我为我的 `[自由职业技能——例如，文案写作、平面设计等]`\
