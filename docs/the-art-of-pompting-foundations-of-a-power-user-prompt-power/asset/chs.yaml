  \ 3 个问题 + 一个练习。\n你现在有了结构化的产品来支持它。\n\n### 提示词包 #3：客户入职邮件与表单\n\n第一印象至关重要。自动化这一体验。\n\
  \n**欢迎邮件：**\n为新的教练客户写一封温暖的入职邮件。包含：\n– 感谢\n– 预期内容\n– 预约链接\n– 他们应该准备什么\n语气：`欢迎的、组织的、赋能的`\n\
  \n**入职表单：**\n创建入职表单问题，帮助我了解他们的目标、挑战和预期结果。保持简单、反思性。\n你从第一天起就会显得专业且富有关怀。\n\n### 提示词包\
  \ #4：课程总结与教练笔记\n\n在每次课程后，保持势头。\n扮演教练助手。在客户课程后写一段总结总结邮件。包含：\n– 我们涵盖的内容\n– 核心收获\n\
  – 本周的行动步骤\n– 鼓励性的笔记\n\n想深入了解吗？\n现在创建一个让客户在下次课程前回答的反思提示词。这种程度的跟进会创造留存率和好评。\n\n###\
  \ 提示词包 #5：小组教练与网络讨会规划\n\n如果你运营小组或现场活动——规划你的议程。\n创建一个 60 分钟的小组课程大纲。主题：`[插入主题]` 包含：\n\
  – 5 分钟引言\n– 教学点\n– 2 个反思问题\n– 小组讨论建议\n– 总结与 CTA\n\n对于网络讨会：\n写一个网络讨会大纲，通过 3 个核心观点教授\
  \ `[主题]`。在结尾包含对我产品的软推销。\n你现在几分钟内规划好了下一次发布或工作坊。\n\n### 提示词包 #6：教练的内容创作\n\n你的客户需要提醒、灵感和严厉的爱。\n\
  写 5 条 Instagram 文案，激励 `[受众]` 为 `[目标]` 行动。语气：`大胆的、智慧的、激励的——像一个直言不讳的教练。`\n\n想要故事帖子吗？\n\
  写一个关于客户从 `[困难]` 变为 `[结果]` 的故事（更改具体细节）。包含：引言、转化和给读者的 1 个教训。\n现在你在发送私信之前就建立了信任。\n\n\
  ### 提示词包 #7：证言与成功故事\n\n让 AI 帮助你捕捉你最好的作品。\n\n**请求邮件：**\n写一封信息，向满意的客户索要证言。包含：\n– 感谢\n\
  – 3 个提示问题\n\n\n\n\n– 主动为他们编写一个草案\n\n### 案例研究\n现在根据这段客户旅程写一个简短的成功故事（3–4 句话）：\n\n\
  之前：`[struggle]`\n\n之后：`[result]`\n\n语气：自豪但谦逊。以我的品牌口吻说话。\n\n社交证明 → 新线索 → 更大影响力。\n\
  \n### 提示词栈 #8：销售页面与私信策略\n\n现在让我们来填满你的日程。\n\n#### 销售页面草案\n为我的教练课程 `[name]` 编写一个销售页面，帮助\
