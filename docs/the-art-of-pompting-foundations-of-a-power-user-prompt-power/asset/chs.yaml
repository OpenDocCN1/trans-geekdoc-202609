  \ call）。\n\n让 AI 帮你销售，而不会像垃圾信息。\n\n---\n\n## 微案例：从精疲力竭到约约满满\n\nJordan 是一位心态教练，他对内容、行政事务和不稳定的客户系统感到精疲力竭。\n\
  \n在 2 周内，他利用提示词实现了：\n\n● 用一句话明确了他的产品\n● 构建了一个期 6 周的课程\n● 创建了精美的入职体验\n● 生成了 30 天的内容\n\
  ● 自动化课后跟进\n● 构建了一个带有 AI 支持的 `Notion` 客户跟踪器\n\n“提示词给了我一个我不知道自己需要的系统。感觉我现在是在自己的才华领域进行教学——而不是在追逐任务。”\n\
  \n在一个月内，他提高了价格并创建了候补名单。\n\n### 教练与咨询提示词栈清单\n\n✅ 明确利基市场、核心信息和产品\n✅ 构建你的课程结构和工具\n\
  ✅ 创建入职邮件和 intake 表单\n✅ 自动化课程总结和跟进\n✅ 计划网络研讨会、工作坊或发布活动\n✅ 生成启发性、信赖的内容\n✅ 收集并重写证言\n\
  ✅ 构建销售页面和外联消息\n\n“你的客户不需要更多内容。他们需要的是清晰。提示词帮助你创造这种清晰度——为了他们，也为了你自己。”\n\n---## 结语：你教客户——让\
  \ AI 教工作流\n\n教练是感性的、人性化的、转型性的。\n\n那部分？仍然属于你。\n\n但背后的压力呢？写作、结构化、发邮件、销售？\n\n那是 AI\
  \ 发光发的地方——也是提示词栈成为你秘密武器的地方。\n\n用它提供更好的服务。\n更智能地扩展。\n最重要的是——留在你的才华领域。\n\n你进入这份工作是为了帮助他人。\n\
  现在让提示词来帮助你。\n\n下一站 → 第 7 章：YouTube & TikTok 内容提示词包\n\n---\n\n## 第 7 章：YouTube &\
  \ TikTok 内容提示词包 – 灯光、摄像、提示词\n\n创作视频内容是建立在线权威和信任的最快方式之一。\n\n大多数人在按下“录制”之前就卡住了。\n\n\
  “我要说什么？”\n“我该怎么写脚本？”\n“这真的有趣吗？”\n\n引入提示词。\n\n这一章是你的幕后制作团队——帮助你生成：\n\n● 具吸引力的视频创意\n\
  ● 吸引人的开头和行动号召（CTA）\n● 短视频和长视频脚本\n● 重新利用的 Reels 和 Shorts\n● 描述、说明、标题和标签\n\n无论你是一个害摄像头的初学者，还是一个想要节省数小时的内容机器——这个提示词包都是你的视频助攻手。\n\
  \n### 提示词栈 #1：脑风暴具有病毒传播意识的视频创意\n\n![](img/Image00007.jpg)\n\n从相关的、可搜索的、针对观众的创意开始。\n\
  \n作为一个视频策略师。为我的 `[YouTube / TikTok / Reels]` 频道建议 15 个内容创意。\n\n主题：`[插入利基或主题]`\n\
  受众：`[描述理想观众]`\n目标：`[增长粉丝，驱动销售，建立信任]`\n语气：`[教育性的 / 有趣的 / 大胆的 / 感性的]`\n\n后续：\n现在将每个创意标记为：\n\
  – 钩子驱动\n– 故事驱动\n– 技巧驱动\n– 趋势跳转\n– 常青（Evergreen）\n\n现在你拥有了有范围的内容——而不是随机的内容。\n\n###\
  \ 提示词栈 #2：短视频脚本（60 秒以内）\n\n快速钩子。交付价值。强力结尾。\n\n为 TikTok 或 Reels 写一个 45–60 秒的视频脚本。\n\
  \n主题：`“[插入创意]\"`\n受众：`[目标观众]`\n结构：\n1. 钩子（前 3 秒）\n2. 3 个快速要点或技巧\n3. CTA（评论、关注或私信）\n\
  语气：`[大胆的、随意的、幽默的、励性的]`\n\n奖励：\n现在将其重新格式化为 3 个短要点，用于屏幕文字叠加。\n脚本写好了——只需出现并读出来即可。\n\
  \n### 提示词栈 #3：YouTube 长视频脚本编写\n\n如果你在教学、演示或分享故事——YouTube 是你的舞台。\n\n为这个标题写一个 5 分钟的\
  \ YouTube 脚本：`“[插入主题/标题]\"`\n受众：`[描述观众]`\n包含：\n– 吸人的开头\n– 3–4 个主教学点\n– 个人案例\n– 总结与\
  \ CTA\n\n语气：教育性的、高能量的、信赖的\n\n后续：\n现在添加 2 个时间戳，并为每个部分建议 3 个 B-roll（空镜）片段建议。\n这就是你的下一个\
  \ YouTube 视频——已经完成了一半。\n\n### 提示词栈 #4：钩子、开头与前 3 秒\n\n注意力是快速赢得的。AI 可以写出让人停止滑动屏幕的文字。\n\
  \n为一个 `[教练 / 设计师 / 自由职业者 / 创作者]` 写 10 个短视频钩子，关于 `“[插入痛点或结果]。”`\n\n每个少于 12 个单词。\n\
  让它们充满好奇感且大胆。\n\n### 提示词栈 #5：真正转化的行动号召（CTA）\n\n如果他们看了但不行动……有什么意义？\n\n写 5 个短视频 CTA，邀请观众：\n\
  – 评论\n– 保存视频\n– 私信咨询\n– 下载资源\n– 点击链接\n\n语气：随意的、自信的\n\n### 提示词栈 #6：跨平台重新利用\n\n将一个视频变成五种格式。\n\
  \n作为一个重新利用专家。将 TikTok/Reel 脚本重新利用为：\n– 推文\n– 轮播图大纲\n– 播客介绍\n– 博客段落\n– 引用图\n\n###\
  \ 提示词栈 #7：YouTube 标题、缩图与描述\n\n发现性始于点击率。\n\n为 `[插入主题]` 写 5 个 YouTube 标题选项。让它们：\n\
  – 值得点击但不标题党\n– 关键词优化\n\n然后：\n写一个 150 字的 YouTube 描述，包含：\n– 视频教了什么\n– 2–3 个搜索关键词\n\
  – 订阅或下载资源的 CTA\n– 标签\n\n奖励：\n建议 3 个缩图文字选项和 2 个图片建议。\n\n### Stack #8：短视频说明生成器\n\n\
  说明扩展范围——并深化共鸣。\n\n为这个视频写一个 Instagram Reels 说明：`“[插入总结]\"`\n包含：\n– 1 句引起共感的开头\n–\
  \ 核心洞察或故事\n– 1 个评论 CTA\n– 最多 5 个相关标签\n\n语气：友好的、简洁的、不过正式\n\n想要更有力的语气？\n用 Z 世代/讽刺的/诗意的/思想领袖风格重写。\n\
  \n## 微案例：默默崛起的沉默创作者\n\nDavid 是一位金融理财创作者，他非常害怕面对镜头说话。\n\n他没有逃避，而是利用 AI 实现了：\n\n●\
  \ 为 20 个带有自信钩子的短视频脚本\n● 结合视觉效果和素材 B-roll 批量录制旁\n● 生成 YouTube 描述、SEO 标签和短视频版本\n\n\
  他的第二个视频在 4 天内获得了 4.8 万次观看。\n他的邮件列表在 2 周内增加了 300 多人。\n全程没有露脸。\n\n“提示词给了我一个视频引擎——一个我可以运行而不会精疲力竭的引擎。”\n\
  \n\n\n\n\n✅ 将内容想法批量整合进 30 天日历\n\n✅ 追踪哪些提示词（prompts）带来了最佳互动率\n\n“如果你的信息足够有力，AI 会让它传播。如果你的内容足够优秀，提示词会让它规模。”\n\
  \n## 结语：你不仅仅是一个创作者——你还是导演\n\n每一位伟大的创作者都是部分艺术家、部分制作人和部分策略家。\n\n提示词可以帮助你：\n\n● 像策略家一样头脑风暴\n\
  ● 像剧作家一样写作\n● 像制作人一样规划\n● 像专家一样发布\n\n这并不是为了走红。\n\n而是为了建立一个记得你的观众。\n\n所以，灯光就绪。摄影就位。提示词在手。\n\
  \n开始吧。\n\n接下来 → 第 8 章：模板、工具包与速表提示词包\n\n## 第 8 章\n\n### 模板、工具包与速表提示词包 —— 构建一次，售卖永远\n\
  \n如果你想在不用时间换钱的情况下让你的技能变现——数字工具包、模板和速表就是你的黄金门票。\n\n它们是：\n\n● 构建快速\n● 易于扩展\n● 对你的观众有价值\n\
  ● 而且通过提示词叠加（prompt stacking）变得简单得惊人\n\n本章将帮助你从空白屏幕快速变为可下载的产品。\n\n你将学会：\n\n● 根据你的技能生成产品创意\n\
  ● 使用 AI 规划模板和清单\n● 编写说明和使用指南\n● 格式化你的最终产品\n● 创建销售文案和原型\n\n无论是 `Canva` 工具包、`Notion`\
  \ 计划表、`Google Sheet` 还是 `PDF` 速表——这就是如何构建一次并售卖永远。\n\n### 提示词栈 #1：生成可售的产品创意\n\n![](img/Image00008.jpg)\n\
  \n从专注于高实用性、低摩擦的产品开始。\n\n扮演产品策略家。根据这项专业知识，建议 10 个我可以创建的数字模板或工具包创意：`[插入垂直领域，例如：效率教练\
  \ / 社交媒体自由职业者 / 健康顾问]`\n\n每个创意都应该包含：\n\n– 产品名称\n– 格式（`Notion`、`Canva`、`PDF` 等）\n\
  – 它解决的问题\n– 为什么易于使用\n\n后续：\n按从易构建到最有利的顺序对这些创意进行排序。\n\n选择你的 MVP（最小可行性产品）——然后去构建它。\n\
  \n### 提示词栈 #2：规划产品结构\n\n每一个好的工具包分步骤解决问题。让 AI 来拆解。\n\n为我的产品创建一个结构：`“[插入产品创意]\"`\n\
  \n观众：`[描述目标客户]`\n\n包含：\n\n– 3–5 个章节或模块\n– 每个模块的一句句描述\n– 推荐的文件格式或工具（例如，`Notion`、`Google\
  \ Docs`）\n\n额外奖励：\n现在写一个使用流程——详细说明某如何与这个工具包进行交互。这将成为你的说明页面和你的话术。\n\n### 提示词栈 #3：速表\
  \ + 清单创建器\n\n速表和清单 = 高感知价值，低构建时间。\n\n扮演文案人员。为 `[观众]` 创建一个标题为 `“[插入标题]\"` 的单页速表，帮助他们\
  \ `[达成结果]`。\n\n包含：\n\n– 3–5 个类别\n– 下的项目符号（简短、易于扫读）\n– 底部的引言或提醒\n\n清单变体：\n为 `[任务、过程或结果]`\
  \ 编写一个 15 步的清单。分为 3 个阶段：之前、期间、之后。保持对新手友好且易于扫描。你现在有了一个引流磁、赠品或产品了。\n\n### 提示词栈 #4：模板内容\n\
  \n让 AI 帮助用智能默认值填充字段和章节。\n\n创建一个示例文案，包含在 `[Notion / Canva / Google Sheets]` 模板中，用于\
  \ `“[插入使用场景]\"`\n\n包含：\n\n– 标题或标签\n– 示例输入\n– 占符提示\n\n语气：清晰、有帮助、轻微引导\n\n示例：客户入职表单、习惯追踪器。提示一次，永久复制。\n\
  \n### 提示词栈 #5：说明性文案与使用指南\n\n不要让你的买家感到困惑——引导他们。\n\n为 `[描述产品]` 编写一个友好的“如何使用此模板”页面。\n\
  \n包含：\n\n– 欢迎辞\n– 此模板有什么帮助\n– 开始开始的 3–5 个步骤\n– 自定义提醒\n\n语气：鼓励性的、清晰的、非技术性的\n\n###\
  \ 提示词栈 #6：赠品资产与配套文件\n\n增加价值。在不推销的情况下进行向上销售。\n\n建议我可以在我的 `[产品名称]` 工具包中提供的 3 个配套赠品，以增加感知价值。每个赠品都应该是使用提示词或模板轻松创建的。解释为什么它增加了价值以及如何将其捆绑。\n\
  \n然后构建一个：\n现在为赠品 #2 编写内容：`[插入赠品名称或创意]`。你 15 美元的产品看起来像一个 47 美元的组合包。\n\n### 提示词栈 #7：会卖的销售文案\n\
  \n不仅在于你做了什么——更在于你如何展示它。\n\n为 `“[产品名称]\"` 写一个产品销售页面。\n\n观众：`[描述买家]`\n\n它解决的问题：`[插入痛点]`\n\
  \n包含：\n\n– 标题\n– 3 个利益点\n– 内部预览\n– 价格行动号召（CTA）\n\n语气：有帮助的、热情的、非炒作\n\n然后……现在为列表页写一个\
  \ `Gumroad` 描述和一行标语。\n\n可选：\n建议 3 个可以用于推广此次发布的推特风格文案。\n\n### 提示词栈 #8：原型、设计与交付创意\n\
  \n展示至关重要。\n\n扮演产品设计师。建议 2 种在原型中视觉化展示产品的方法。\n\n工具：`Canva`、`Figma`、`Preview`\n\n包含：\n\
  \n– 原型类型（平板、手机、幻灯片）\n– 背景想法\n– 符合氛围的字体\n\n然后：\n现在写下包含项的文字。这将成为你的店铺视觉图。\n\n## 案例故事：一个模板，100+\
  \ 销量\n\nElla 是一位社交媒体经理使用提示词栈构建了：\n\n● 配文公式速表\n● `Notion` 内容日历\n● 客户入职工具包\n\n每个构建不到\
