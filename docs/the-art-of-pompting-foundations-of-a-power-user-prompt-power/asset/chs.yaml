  \ 500 美元增加到 3500 美元。她的秘密是什么？系统。\n\n## 总结与行动计划\n\n使用 AI 像专家一样做自由职业：\n- 打造具有强大定位的突出简介\n\
  - 使用定制提案提示词赢得更多订单\n- 更快、更智能地交付\n\n## 第 4 章：电子书作者提示词包——使用 AI 编写、格式化并出版\n\n写电子书曾感觉像爬山。空白页、无尽的草稿、自我怀疑。但通过\
  \ AI 和提示词堆叠？你可以在几天内从想法变成电子书，而不是几个月。\n\n这一章适用于：\n- 想要引流工具的教练\n- 将博客转变为书籍的作家\n- 在\
  \ Gumroad 或 Amazon 上销售电子书的创作者\n- 任何有知识分享且没有时间浪费时间的人\n\n书中，你将获得提示词包来：\n- 规划电子书内容\n\
  - 极速起草章节\n- 编辑、润色和格式化\n- 创建标题、封面\n- 像专家一样上传并发布\n\n### 提示词包 #1：定义你的大想法与读者承诺\n\n在写作之前，定义你的书籍提供的核心转化。\n\
  \n作为一个电子书策略师。我想为 `[观众]` 编写一本 5000-10000 字的短电子书。\n\n主题：`[插入主题]`\n\n帮助我回答：\n- 这本书解决了什么核心问题？\n\
  - 读者将获得什么转化？\n- 这种方法有什么独特之处？\n\n后续：\n\n现在提供 3 个专注于该转化的角度或标题。\n\n\n\n\n\n### 提示词组合\
  \ #2：章节大纲生成器\n\n结构即清晰。让 AI 来构建骨架。\n\n为名为“[[插入暂定标题]”、面向 `[受众]` 的电子书创建一个 7–10 章节的大纲。\n\
  \n**目标：** 帮助读者从 `[起始点]` 达到 `[预期结果]`。\n\n包含章节标题以及每个章节的 1–2 句描述。\n\n**仍在完善中？**\n现在将这些章节分为\
  \ 3 部分：开头、中间、结尾。为每个部分添加一句话总结。现在，你已经准备好带着方向进行写作了。\n\n### 提示词组合 #3：章节草稿（听起来不像机器人）\n\
  \n用 AI 编写章节就像和一位才华横溢、高效的影子作家共同创作。\n\n扮演一名非虚构电子书作家。\n\n为 `[受众]` “[[电子书标题]”的第一章。\n\
  \n**语气：** `[友好、实用的、励舞的等.]`\n\n**结构：**\n1. 钩子或故事引言\n2. 教学或核心内容（3–4 个子章节）\n3. 总结或收获\n\
  \n**字数：** ~1,000–1,200 字\n\n**在过程中调整：**\n- 重写第 2 部分，增加叙事性，减少指令感。\n- 让它听起来像是一个真人在分享经验。\n\
  - 你不需要完美——你需要一个扎实的初稿。\n\n### 提示词组合 #4：编辑、风格与流畅度润色\n\n让 AI 帮你精炼文字并统一你的语调。\n\n**提高清晰度：**\n\
  为了清晰度和结构编辑此章节。拆分长段落。使用更简单的语言。删掉废话。\n\n**调整语气：**\n用更具 `[大胆 / 有同理心 / 幽默]` 的语气重写此章节。保留观点，改变表达方式。\n\
  \n**添加名言或比喻：**\n在引言中加入相关的名言或比喻，以产生情感吸引。\n\n你的原始草稿现在听起来犀利、人性化且易于阅读。\n\n### 提示词组合\
  \ #5：标题、副标题与标语\n\n标题决定销量。但想出一个出色的标题很难——直到你用提示词生成它。\n\n扮演一名图书营销人员。为一本帮助 `[受众]` 解决\
