  \ 5%、10%、15% 和 20% 时会发生什么？\n\n### 10\n\n#### 频繁模式挖掘\n\n频繁模式挖掘是数据挖掘中的一项重要无监督学习任务，具有多种应用。它可以纯粹作为一种无监督的探索性数据分析方法，也可以作为发现关联规则的基础。此外，它还可用于为分类或聚类寻找判别性特征。\n\
  \n本章介绍构建流模式挖掘算法的技术。我们首先（第 10.1 节）介绍与模式挖掘相关的主要概念、批处理设置中使用的基本技术，以及`closed`模式的概念，这在流设置中尤为重要。然后我们概述（第\
  \ 10.2 节）如何使用批处理挖掘器构建流挖掘器，以及如何使用`coresets`提高效率。随后，我们重点介绍模式概念的两个实例——项集和图——以及使用通用方法并进行各种优化的算法。第\
  \ 10.3 节描述了几种频繁项集挖掘算法，特别是 MOA 中实现的 `IncMine` 算法。第 10.4 节描述了频繁子图挖掘算法，包括 MOA 中实现的\
  \ `AdaGraphMiner`。第 10.5 节提供了进一步阅读的参考文献。\n\n# 10.1 模式挖掘简介\n\n## 10.1.1 模式：定义与示例\n\
  \n从广义上讲，`patterns`（模式）是指其存在或不存在、或其频率能够指示数据偏离随机性方式的实体。接下来介绍的组合结构，如项集、序列、树和图，被广泛用于体现这一思想。从这个意义上说，所有模式都可以被视为图的子类\
  \ [255]。我们的介绍基于`pattern relation`（模式关系）的思想，遵循文献 [34] 的思路；我们认为这能使许多算法思想的表述更加统一。\n\
  \n`Itemsets`（项集）是项集合 *I* = {*i*[1],⋯ *,i*[*n*]} 的子集。在项集中，子模式和超模式的概念分别对应于子集和超集的概念。项集挖掘最常被引用的例子是：*I*\
  \ 是超市待售产品的集合，而项集是某次特定购买中的产品集合。挖掘频繁项集意味着找出客户经常一起购买的产品集合。\n\n`Sequences`（序列）在其最基本的形式下是项的有序列表，例如\
  \ ⟨*i*[3]*, i*[7]*, i*[2]*, i*[10]*, i*[6]⟩；⟨*i*[7]*, i*[10]⟩ 和 ⟨*i*[3]*, i*[7]*,\
  \ i*[6]⟩ 都是该序列的子序列。一个使用示例是找出某软件用户频繁发出的命令序列。一种推广形式使有序列表的每个元素成为一个项集，例如 *S* = ⟨*I*[1]*,\
  \ I*[2], . . . , *I*[*n*]⟩，其中每个 *I*[*i*] 是 *I* 的子集。子序列的概念相应地变得更复杂：![](img/pg166-in-1.png)是\
  \ *S* 的子序列，如果存在整数 ![](img/pg166-in-2.png) 使得 ![](img/pg166-in-3.png)。\n\n`Trees`（树）是无环图的一种特殊情况；树可能有根也可能无根，节点和边可能有标签也可能无标签。存在几种可能的`subtree`（子树）或树子模式概念。树\
  \ *t* 的`induced subtree`（导出子树）是指以 *t* 的某个节点 *v* 为根、其顶点和边是 *t* 的子集的任何树。树 *t* 的`top-down\
  \ subtree`（自顶向下子树）是包含 *t* 的根的 *t* 的导出子树。树 *t* 的`embedded subtree`（嵌入子树）是指以 *t* 的某个节点\
  \ *v* 为根的任何树。示例和讨论请参见文献 [69, 142]。频繁树挖掘的一个实际应用与 XML 查询服务器相关，因为 XML 查询本质上是带标签的有根树。检测频繁子树或子查询可能很有用，例如用于对查询进行分类，或优化、预计算或缓存其答案。\n\
  \n`Graph G`（图 *G*）是由节点集合 *V* 和节点间的边集合 *E* 组成的二元组。可以为节点和边添加标签。*G* = (*V, E*) 是 *G*′\
  \ = (*V*′*, E*′) 的`subgraph`（子图）或图子模式的一个常见定义是：*V* ⊆ *V*′ 且 *E* ⊆ (*V* × *V*) ∩ *E*′。在复杂网络分析中，`motifs`（基序）是在较大网络中反复出现的子网络，通常可用于预测或解释较大网络中的行为。在网络中寻找显著基序与挖掘频繁子图密切相关。\n\
  \n现在让我们将这些定义推广为一个统一的定义。模式类是一个带有关系 ≼ 的集合 \U0001D4AB，该关系是一种偏序：自反、反对称和传递，可能存在无法通过 ≼\
  \ 比较的模式对。对于模式 *p, p*′ ∈ \U0001D4AB，如果 *p* ≼ *p*′，我们称 *p* 是 *p*′ 的子模式，而 *p*′ 是 *p*\
  \ 的超模式。此外，如果 *p* 是 *p*′ 的真子模式，即 *p* ≼ *p*′ 且 *p* ≠ *p*′，我们记作 *p* ≺ *p*′。\n\n我们的数据挖掘过程的输入是一个数据集（或流，在流设置中）*D*，其中每个事务\
  \ *s* ∈ *D* 由一个事务标识符和一个模式组成。我们通常会忽略事务标识符，将 *D* 视为模式的多重集，或等价地视为对 (*p, i*) 的集合，其中\
  \ *p* 在 *D* 中出现 *i* 次。\n\n如果模式 *p* 是事务 *t* 中模式的子模式，则称事务 *t supports*（支持）模式 *p*。模式\
  \ *p* 在数据集 *D* 中的`absolute support`（绝对支持度），记作 *supp*(*p*)，是数据集 *D* 中支持 *p* 的事务数量。模式\
  \ *p* 的`relative support`（相对支持度）为 *σ*(*p*) = *supp*(*p*)/|*D*|，其中 |*D*| 是 *D* 的基数。*数据库中的\
  \ `σ-frequent patterns`（σ-频繁模式）是指相对支持度至少为 *σ* 的模式。请注意，大小为 1 的 `σ-frequent itemsets`（σ-频繁项集）在第\
  \ 4.6 节中被称为 `σ-heavy hitters`（σ-重击者）。\n\n`frequent pattern mining problem`（频繁模式挖掘问题）定义如下：给定一个数据集\
  \ *D* 和 [0, 1] 区间内的阈值 *σ*，找出 *D* 中所有的 `σ-frequent patterns`（σ-频繁模式）。\n\n\n\n\n\n\
  图 10.1 展示了一个项集数据集，而 图 10.2 显示了该数据集的频繁、闭合和最大项集（闭合和最大模式将在后面定义）。例如，模式 `de` 和 `cde`\
  \ 出现在事务 `t2, t4, t5` 中，且仅出现在这三个事务中，因此它们的支持度为 3。\n\n![Figure 10.1 Example of an itemset\
  \ dataset.](img/Fig10-1.png)\n\n**图 10.1**\n\n项集数据集示例。\n\n![Figure 10.2 Frequent,\
  \ closed, and maximal itemsets with minimum absolute support 3, or relative support\
  \ 0.5, for the dataset in figure 10.1.](img/Fig10-2.png)\n\n**图 10.2**\n\n最小绝对支持度为\
  \ 3 或相对支持度为 0.5 时，图 10.1 中数据集的频繁、闭合和最大项集。\n\n在大多数感兴趣的情况下，都存在 `size`（大小）的概念，即与每个模式相关联的一个自然数。我们假设大小与模式关系兼容，即如果\
  \ `p ≺ p′`，则 `p` 的大小小于 `p′`。项集的大小是其基数，序列的大小是其包含的项数，树或图的大小是其边数。通常，给定大小 `n` 的可能模式数量随\
  \ `n` 呈指数级增长。\n\n###### 10.1.2 频繁模式挖掘的批处理算法\n\n原则上，查找所有频繁模式的一种方法是对数据集进行一次遍历，记录数据集中作为子模式出现的每个模式及其支持度，最后报告支持度大于所需最小支持度的那些模式。然而，数据集中的子模式数量通常随数据集大小增长过快，导致这种方法不可行。因此，需要更高效的方法。\n\
  \n一个最有用的性质是 `antimonotonicity`（反单调性），也称为 `Apriori property`（Apriori 性质）：频繁模式的任何子模式也是频繁的；等价地说，非频繁模式的任何超模式也是非频繁的。这启发了以下方法，即用于频繁项集挖掘的开创性\
  \ Apriori 算法 [9] 所体现的方法：\n\n1.  对数据集进行一次遍历，计算大小为 1 的频繁模式集合 `F[1]`。\n2.  对于 `k >\
  \ 1`，给定集合 `F[k−1]`：\n    2.1. 计算候选模式集合 `C[k]`，即大小为 `k` 且其所有大小为 `k − 1` 的子模式都在 `F[k−1]`\
  \ 中的那些模式；\n    2.2. 对数据集进行一次遍历，计算 `C[k]` 中每个模式的支持度；令 `F[k]` 为 `C[k]` 中频繁的模式子集。\n\
  3.  当 `F[k]` 为空时停止。\n\n请注意，由于反单调性性质，在步骤 2.1 中将搜索限制在 `C[k]` 时，我们不会丢失任何真正频繁的模式。此外，在实践中，`F[k]`\
  \ 中频繁模式的数量随 `k` 的增加而迅速减少，因此步骤 2.1 会逐渐变快，遍历次数也适中。换句话说，Apriori [9] 对所有频繁模式集合执行 `breadth-first`（广度优先）探索。它还结合了其他策略，使候选生成阶段\
  \ 2.1 高效，特别是按字典顺序表示项集。\n\n批处理项集挖掘的其他方法在探索策略和为提高效率而添加的数据结构上有所不同。例如，FP-growth 算法 [131]\
  \ 使用一种称为 `FP-Trees`（FP 树）的巧妙数据结构，通过两次遍历以紧凑形式存储数据集，然后直接从 FP 树中检索频繁项集，从而避免了昂贵的候选生成阶段。Eclat\
  \ 算法 [256] 可视为执行深度优先搜索：它将观察到的每个项集与一个支持该项集的事务标识符列表相关联，然后递归地交集这些集合以获得更大项集的列表。\n\n\
  这些及类似的思想已被应用于挖掘频繁序列、树和图。参考文献请参见第 10.5 节引用的综述。\n\n上述概述的算法显然是面向批处理的：Apriori 对数据集执行多次遍历；Eclat\
  \ 和 FP-growth 分别执行一次和两次遍历，但不清楚它们如何以随时可得的方式返回结果，并且它们存储了太多模式，不适合流式设置。在描述适用于流式处理的方法之前，我们引入一些额外的概念，这些概念有助于减少批处理和流式处理两种情况下的内存需求。\n\
  \n###### 10.1.3 闭合模式和最大模式\n\n频繁模式挖掘在实践中面临的一个主要问题是，算法获得的模式往往远多于后续可分析或使用的数量；不仅如此，这些模式往往以显而易见或微妙的方式存在冗余或无趣。关于模式挖掘中\
  \ `interest measures`（有趣度度量）的提议，请参见 [119]。\n\n一种冗余形式是存在两个频繁模式 `p` 和 `q`，使得 `p ≺\
  \ q`，但 `p` 和 `q` 具有相同或几乎相同的支持度。当我们知道 `q` 是频繁时，知道 `p` 是频繁并没有增加太多信息。`closed`（闭合）和\
  \ `maximal`（最大）模式的概念有助于减少输出中的冗余，以及批处理和流式挖掘器中的时间和内存使用。\n\n**定义 10.1** 如果一个模式在数据集\
  \ `D` 中的支持度高于其所有超模式，则该模式对 `D` 是 `closed`（闭合）的。如果一个模式是频繁的，且其所有超模式都不是频繁的，则该模式是 `maximal`（最大）的。\n\
  \n图 10.2 显示了 图 10.1 中数据集的频繁闭合项集和频繁最大项集。例如，`ce` 是闭合的，因为它的支持度高于其超集 `ace`、`bce` 和 `cde`，但\
  \ `e` 不是，因为它与其超集 `ce` 具有相同的支持度。模式 `ce` 是频繁的但不是最大的，因为其超集 `cde` 也是频繁的。\n\n请注意，每个最大模式都是闭合的。很容易看出（练习\
  \ 10.1），给定所有频繁闭合模式，我们可以检索所有频繁模式。如果我们此外还知道所有闭合模式的频率，就可以推导出每个模式的频率。数据集中频繁闭合模式的数量通常远少于频繁模式。因此，寻找频繁闭合模式而不计算所有频繁模式的算法，在时间和内存方面可能高效得多，同时提供相同的信息和更少冗余的输出。这在实践中已被反复验证。最大模式仅告知我们频繁与非频繁之间的边界。\n\
  \nCHARM、CLAIM 和 FPClose 是用于挖掘频繁闭合项集的批处理算法。BIDE+、ClaSP 和 CloSPan 是用于频繁闭合序列的批处理挖掘器。CloseGraph\
  \ 发现频繁闭合子图。参考文献可参见第 10.5 节引用的综述。\n\n##### 10.2 数据流中的频繁模式挖掘：方法\n\n从数据流中提取频繁模式的算法可以根据多个标准进行分类，包括：\n\
  \n*   是挖掘所有频繁模式，还是仅挖掘闭合或最大模式。\n*   是从流开始处考虑模式频率，还是通过滑动窗口或某种重要性衰减方案，赋予近期项目更高的重要性。\n\
  *   是在每个项目到达后更新频繁项集，还是执行批量更新：即收集一批流项目，然后使用该批次更新表示频繁模式的数据结构。`batch size`（批量大小）的选择对性能至关重要。\n\
  *   是精确还是近似，即是返回确切满足频率条件的模式集合，还是仅返回该集合的某种近似。近似算法可能产生假阳性（将非频繁模式报告为频繁）、假阴性（未报告频繁模式），或两者兼有。\n\
  \n\n\n\n我们将主要关注使用执行批量更新的近似算法进行闭合模式挖掘。这是因为闭合模式挖掘具有显著优势，即它意味着内存和时间的减少。在许多应用中，近似答案是可以接受的，特别是当这能节省精确算法的高计算成本时。最后，逐项更新在大多数情况下太慢，且与批量更新相比，对结果几乎没有差别。\n\
  \n执行批量更新的算法通常如图 10.3 所示。特定算法会固定一个摘要数据结构，以记住当前被监控的模式集合。摘要类型将取决于算法是挖掘所有模式、闭合模式还是最大模式。当然，摘要的设计也出于效率考虑。关键操作是`add(C,\
  \ C′)`和`remove(C, C′)`。这里，`C`和`C′`是代表两个模式数据集`D`和`D′`的摘要结构。这些操作应返回对应于`D ∪ D′`和`D\
  \ \\ D′`的摘要，或其近似值。这里`D \\ D′`表示多重集差集，即包含每个模式`p`的`max{0, suppD − suppD′}`个副本的多重集。如前所述，精确算法为精确性支付了高昂的计算代价，因此那些不精确但不会引入许多假阳性或假阴性的`add`和`remove`操作可能更有价值。\n\
  \n```\nFigure 10.3 A general stream pattern miner with batch updates and sliding\
  \ window.\n```\n\n**图 10.3** 具有批量更新和滑动窗口的通用流模式挖掘器。\n\n数据集`D`最明显的摘要就是忽略`D`中事务的顺序，仅保留它们所包含的模式多重集，或者更紧凑地保存对`(p,\
  \ suppD)`的集合。此时，`add`和`remove`就是简单的多重集并集和多重集差集，且是精确的。一种更复杂的摘要是保留`D`中所有闭合模式的对`(p,\
  \ suppD)`，即使它们不在`D`中字面出现。这仍然是精确的，因为所有非闭合模式的支持度都可以从摘要中恢复。例如，文献[34]给出了在此表示上实现精确`add`和`remove`操作的高效规则。\n\
  \n**示例 10.1** 假设`D = {ab, ac, ab}`。其按闭合模式表示的摘要为`C = {(ab, 2), (ac, 1), (a, 3)}`，因为`a`在`D`中是闭合的。如果新批次为`D′\
  \ = {ac, bd}`，其摘要为`C′ = {(ac, 1), (bd, 1)}`，则`add(C, C′)`理想情况下应返回`D ∪ D′`的摘要，即`{(ab,\
  \ 2), (ac, 2), (bd, 1), (a, 4), (b, 3)}`。观察到`add`必须以某种方式包含`(b, 3)`，即使`b`既不在`C`中也不在`C′`中。\n\
  \n由于字面出现在事务中的每个模式都是闭合的，此摘要包含的*不同*模式甚至比流本身还多，这似乎效率低下。然而，如果我们在摘要中仅保留`σ`-频繁闭合模式，存储的模式数量会大幅减少，代价是失去精确性。特别是，我们可能会随着时间的推移引入假阴性，因为我们可能会从批次摘要中丢弃`p`的出现，而这些出现对于使`p`在流中成为`σ`-频繁至关重要。这些假阴性可以通过在算法第\
  \ 15 行使用某个支持度值`σ′ < σ`来减少。假设模式分布是平稳的，这会降低真正`σ`-频繁的模式因统计波动而在某批次中甚至不是`σ′`-频繁而被丢弃的可能性。可以使用\
  \ Hoeffding 界或正态近似来根据`σ`、`σ′`和批次大小，限制这种方法引入的假阴性率（例如见文献[35]）。\n\n###### 10.2.1 闭合模式的核心集\n\
  \n回顾第 9.6 节，集合`C`关于某问题的*核心集*是`C`的一个小子集，使得在核心集上求解该问题能为`C`上的问题提供近似解。我们描述核心集概念在加速频繁模式挖掘中的应用，代价是引入一些近似误差。它最初在文献[35]中针对图提出，作为闭合图的推广，但可应用于其他模式类型。\n\
  \n回顾`supp(p)`和`σ(p)`分别表示`p`的绝对支持度和相对支持度。我们称`p`在`D`中是`δ`-闭合的，如果`p`的每个超模式的支持度都小于`(1\
  \ − δ) suppD`。闭合模式是 0-闭合模式，最大模式是 1-闭合模式。这一概念与文献中使用的其他概念相关，例如 CLAIM 算法[230]中的*松弛支持度*。\n\
  \n现在定义`D`的`(σ, δ)`-*核心集*为任意数据集`D′ ⊆ D`，使得对于每个模式`p`：\n\n*   `D′`中出现的每个模式`p`在`D`中都是`σ`-频繁且`δ`-闭合的；\n\
  *   此外，如果`p ∈ D′`，则`p`在`D′`中出现的次数与在`D`中相同。\n\n`(σ, δ)`-核心集是数据集的一种有损压缩摘要。这种压缩是二维的：\n\
  \n*   最小支持度`σ`排除非频繁模式；\n*   `δ`-闭合性排除支持度与某个子模式非常相似的模式。\n\n**示例 10.2** 假设`D = {(ab,\
  \ 10), (ac, 5), (a, 8), (b, 2)}`。`D`的一个`(0, 0.4)`-核心集是`{(ab, 10), (ac, 5), (a, 8)}`。`a`在核心集中，因为它在`D`中的支持度为\
  \ 23，而`ab`和`ac`的支持度都低于`0.6 · 23`。另一方面，`b`不在，因为它在`D`中的支持度为 12，而`ab`的支持度高于`0.6 · 12`。从核心集我们只能推断`b`在`D`中的支持度至少为\
  \ 10，至多为 16。\n\n我们可以通过贪婪地选择`D`中`σ`-频繁、`δ`-闭合模式的一个子集，然后将它们在`D`中的所有出现放入`D′`来构建`(σ,\
  \ δ)`-核心集。如果我们一直这样做直到无法继续，就能得到一个极大核心集，即无法再从`D`添加更多模式并保持核心集性质的核心集。见练习 10.2。对于`δ =\
  \ 0`，所有`σ`-频繁闭合模式的集合是唯一的极大`(σ, 0)`-核心集。然而，如果`0 < δ < 1`，`D`可能存在多个极大`(σ, δ)`-核心集。\n\
  \n在通用算法中减少计算时间和内存的一种策略是仅保留批次的`(σ, δ)`-核心集摘要。当然，这些摘要并不精确地代表完整数据集，甚至不精确代表数据集中的`σ`-频繁模式，因此输出只能是近似的。\n\
  \n##### 10.3 流上的频繁项集挖掘\n\n###### 10.3.1 归约为重击元素\n\n在第 4 章中，我们描述了多种用于维护流中重击元素的草图，即相对频率高于阈值`\U0001D716\
  `的元素。此类草图通常可用于维护流中的频繁模式集合。扩展时需要考虑：不再最多只有`1/\U0001D716`个频繁元素，因为每个流元素可能为许多模式生成更新。\n\
  \n例如，提出 Lossy Counting 算法的论文[165]也给出了一个用于计数频繁项集的扩展。流被划分为批次，每个批次挖掘频繁项集，并用结果更新草图。Lossy\
  \ Counting 中频率估计的误差转化为频繁模式集合中的假阳性和假阴性率。类似的思路可用于 SPACESAVING 草图（练习 10.3）。\n\n这种方法在某些场景下有两个缺点：一是它跟踪所有频繁项集而非频繁闭合项集，因此可能需要大量内存。二是\
  \ Lossy Counting 和 Space Saving 不支持删除操作，因此无法模拟滑动窗口的遗忘效应。\n\n###### 10.3.2 Moment\n\
  \n\n\n####### Moment\n\n**Moment**，由 Chi 等人提出 [70]，是一种基于滑动窗口的闭频繁项集挖掘算法。它是一种**精确算法**：在每一时刻，它都能精确报告滑动窗口中的闭频繁项集。\n\
  \n该方法使用一种称为**闭枚举树**的树形结构来存储任意时刻所需的所有项集，其中根节点位于顶部，对应最小（空）项集。树中的节点属于以下四种类型中的一种，其中两种位于频繁与非频繁项集的边界上，另外两种位于闭与非闭频繁项集的边界上：\n\
  \n*   **非频繁网关节点**：包含一个非频繁项集 `x`，但其父节点包含一个频繁项集 `y`，且 `y` 有一个频繁的兄弟节点 `z`，使得 `x = y\
  \ ∪ z`。\n*   **无前途网关节点**：包含一个频繁项集 `x`，且存在一个闭频繁项集 `y` 是 `x` 的超集，具有相同的支持度，且在字典序上排在\
  \ `x` 之前。\n*   **中间节点**：非无前途网关节点，包含一个非闭频繁项集，但拥有一个包含相同支持度项集的子节点。\n*   **闭节点**：包含一个闭频繁项集。\n\
  \n这些定义蕴含了闭枚举树的以下性质：\n\n1.  非频繁网关节点中项集的所有超集均为非频繁。\n2.  无前途网关节点中的项集及其所有后代均为非闭。\n3.\
  \  中间节点中的项集为非闭，但拥有某个闭后代。\n4.  添加事务时，闭项集保持闭合。\n5.  删除事务时，非频繁项保持非频繁，非闭项集保持非闭。\n\n\
  **Moment** 的核心是一组用于向树中添加和删除事务、同时维护这五个性质的规则。\n\n###### 10.3.3 FP-STREAM\n\n**FP-STREAM**，由\
  \ Giannella 等人提出 [121]，是一种从数据流中以多种时间粒度挖掘频繁项集的算法。它使用类似 FP-growth 的 FP-Tree 结构来存储频繁模式集，并采用倾斜时间窗口。倾斜时间窗口分为两类：\n\
  \n*   **自然倾斜时间窗口**：维护最近 4 个 15 分钟、最近 24 小时和最近 31 天的数据。仅需 59 个计数器即可保存这些信息。\n*   **对数倾斜时间窗口**：维护的时间槽包括最近\
  \ 15 分钟、随后的 2 个 15 分钟、4 个、8 个、16 个，以此类推。与指数直方图类似，所需内存随监控时间长度呈对数增长。\n\nFP-STREAM\
  \ 维护一个全局 FP-Tree 结构，并以批次处理事务。每当收集到一个新批次，它会计算一个新的 FP-Tree 并将其合并到全局 FP-Tree 中。\n\n\
  如果仅保留每个批次中的频繁项集，或仅在全局 FP-Tree 中维护频繁项集，将会丢失大量项集，因为许多未达到最小支持度阈值 `σ` 的非零计数不会被包含，从而被视为实际为零。保留一些非频繁项集以备将来可能变为频繁是很方便的。为此，FP-STREAM\
  \ 引入了**亚频繁模式**的概念。若模式的支持度大于 `σ'` 但小于 `σ`（其中 `σ' < σ`），则称该模式为*亚频繁*。FP-STREAM 计算频繁模式和亚频繁模式。某批次中频率低于\
  \ `σ'` 的模式出现不会被添加到全局 FP-Tree，因此会被低估，并可能在稍后成为假阴性。不过，这排除了大量真正非频繁的模式，节省了内存和时间。这一思想的强化对下一个将要介绍的算法至关重要。\n\
  \n总之，FP-STREAM 允许我们近似地回答时间敏感型查询，并保留更详细的近期数据信息。但它考虑的是所有频繁项集，而非闭项集。\n\n###### 10.3.4\
  \ IncMine\n\n**IncMine** 算法由 Cheng 等人在文献 [66] 中提出，用于挖掘频繁闭项集。它是一种近似算法，表现出可控的、通常较小的假阴性量，但比\
  \ Moment 和 FP-STREAM 快得多。其在 MOA 中的实现（包括文献 [66] 中未明确的某些细节）见文献 [202]。\n\n从宏观层面看，IncMine\
  \ 维护一个包含最近事务批次的滑动窗口。IncMine 旨在报告窗口中的频繁闭项集（FCI）。但实际上它存储的是这些项集的超集，包括一些在当前窗口中不频繁但未来可能变为频繁的项集；我们称该集合为**半\
  \ FCI**。其定义比 FP-STREAM 中的亚频繁模式更严格。\n\n流元素以批次 `B` 的形式收集，批次大小为 `b`。设 `w` 为窗口中存储的批次数，因此窗口代表\
  \ `wb` 个事务。\n\n设 `C` 表示在任意给定时间从当前窗口挖掘出的半 FCI 集合。当新批次事务 `b` 到达时，`C` 必须更新以反映 `B` 中的事务，并遗忘窗口中最旧批次事务的影响。粗略地说，IncMine\
  \ 通过首先在 `B` 中挖掘 FCI 集合 `C2`，然后根据一组规则用 `C2` 的内容更新 `C`（该规则也实现了过期事务的遗忘）来执行此操作。我们省略这部分描述，但需注意这对\
  \ IncMine 的效率至关重要。还要注意，这部分专门针对项集，不像后续思想那样适用于序列和图等其他类型的模式。\n\n然而，直接实现这一想法代价高昂。为了精确执行此任务而必须存储的项集数量可能变得非常大，因为即使某项集在当前看来非常非频繁，也必须保留在\
  \ `C` 中，以防它在随后的 `wb` 时间单位或 `w` 个批次内开始更频繁地出现并成为窗口中的频繁项集。\n\nIncMine 采用以下启发式方法以减少内存和计算量。假设最小频繁支持度为\
  \ `σ`。若模式 `p` 在包含 `wb` 个批次的窗口中频繁，则由定义它在其中至少出现 `σwb` 次。天真地认为，它可能在前 `i` 个批次中出现 `σib`\
  \ 次。但期望模式在批次间如此均匀分布是不现实的。然而，若 `p` 在前 `i` 个批次中出现次数**远少于** `σib`，则它不太可能在后续窗口中达到所需出现次数，我们可能决定从窗口中丢弃模式\
  \ `p`，但承担它稍后成为假阴性的风险。随着 `i` 接近 `w`，这种风险越来越小。\n\n更一般地，若 `σ` 是 FCI 的期望最小支持度，IncMine\
  \ 为 `i = 1…b` 设定一组增强支持度 `r(i)`，使得 `r(1) < r(2) < ⋯ < r(w − 1) < r(w) = 1`。当窗口中第\
  \ `i` 个批次内的模式频率低于 `r(i)σib` 时，认为它不太可能在再添加 `w − i` 个批次后达到频率 `σwb`，因此将其从当前集合 `C` 中丢弃。\n\
  \n因此，IncMine 在给定时刻保留的集合 `C` 精确来说是：窗口中的 `σ`-频繁闭项集，加上在过去 `w` 个批次中未被作为无前途项集丢弃的非频繁闭项集。若\
  \ `r(w) = 1`，这意味着所有存活了 `w` 个批次的项集在窗口中均为 `σ`-频繁，可作为真 FCI 报告。因此，IncMine 可能产生假阴性，但不会产生假阳性，因为被报告为频繁的项集保证是频繁的。\n\
  \n\n\n\nCheng 等人 [66] 提出了线性调度 `r(i) = (i−1) · (1−r)/(w−1) + r`，其中 `r < 1`。观察可知 `r(1)\
  \ = r` 且 `r(w) = 1`。文献 [202] 中的分析给出了另一种基于 Hoeffding 界的调度，它能更激进地剪除无前途的项集，同时仍保证产生的假阴性率不超过期望值，这假设流中的分布是平稳的。\n\
  \n还需注意，文献 [202] 中描述的 MOA 实现使用 CHARM [254] 作为批量挖掘器，部分原因是 [254] 报告了其卓越的性能，部分原因是它可以使用序列模式挖掘框架\
  \ SPMF [106] 中经过充分测试的实现。文献 [202] 通过实验表明，该实现比 Moment 快几个数量级，内存占用少得多，且产生的假阴性数量非常少，通常可以忽略不计。\n\
  \n##### 10.4 流上的频繁子图挖掘\n\n首先请注意，*图挖掘* 一词曾被用于描述多种任务。一种常见含义（此处不涉及）是从单个大型图（如社交网络）中挖掘社区、最短路径和中心性度量等信息；图以一条边的形式逐个到达，通常伴随边的插入和删除。此处我们与本章其余部分保持一致：流中的每个元素本身就是一个图，任务是挖掘这些传入图中频繁（或许还有闭合）的子图。\n\
  \n我们介绍文献 [35] 中描述的两种基于核心集的算法，一种实现了第 10.2 节所述在固定大小滑动窗口上挖掘模式的通用思想，另一种通过报告近期图（即流上分布似乎平稳的自适应大小滑动窗口中的图）的近似闭合频繁图集合来适应变化。\n\
  \n请注意，文献 [35] 以一种等价但比第 10.2 节隐含假设的形式（即一组（闭合模式，频度）对）更方便的形式表示闭合图集合。模式的 `Δ-support`\
  \ 定义为其支持度减去所有其闭合真超模式绝对支持度之和；在 [35] 中称为相对支持度，但该术语在本文中已用于另一含义。\n\n`Δ-support` 一个有趣的性质是，反之，一个闭合模式的绝对支持度等于其所有闭合超模式（包括自身）的\
  \ `Δ-support` 之和。这使得向摘要添加模式变得快得多。假设我们已计算出一个数据集的闭合模式集合并关联了各自的绝对支持度。要向摘要添加模式 `p` 的一次出现，我们需要将\
  \ `p` 及其所有闭合子模式的绝对支持度加 1。如果我们改为保留每个闭合模式的 `Δ-support`，根据上述性质，仅将 `p` 的 `Δ-support`\
  \ 加 1 就隐式地将其所有子模式的常规支持度加 1。同样的论证也适用于删除操作。常规支持度仅在算法被要求输出频繁闭合图集合时才需计算，这发生的频率应远低于添加和删除操作。\n\
  \n如果 `D` 的所有闭合模式都保留在摘要中，`p` 的 `Δ-support` 就是 `D` 中模式恰好为 `p` 的事务数量。然而，如果摘要基于 `(σ,\
  \ δ)`-核心集，被省略模式中 `p` 缺失的出现可能导致*负* `Δ-support`。\n\n###### 10.4.1 WINGRAPHMINER\n\n\
  `WINGRAPHMINER` 算法维护固定大小滑动窗口中的频繁闭合图，实现了第 10.2 节所述的核心集思想。其伪代码见 图 10.4。注意，为简洁起见，第\
  \ 8 行使用了 `(G ∪ C) \\ R` 中的集合运算来表示实际的 `add` 操作应用和 `remove` 操作应用。\n\n![Figure 10.4\
  \ The WINGRAPHMINER algorithm and procedure CORESET.](img/Fig10-4.png)\n\n**图 10.4**\
  \  \n\n`WINGRAPHMINER` 算法和过程 `CORESET`。\n\n从流中到达的每一批图都使用某个批量挖掘器挖掘闭合频繁图，并转换为相对支持度表示。过程\
  \ `CORESET` 使用 `CloseGraph` 算法 [252] 实现这一思想。算法维护的核心集通过添加传入批次的核心集进行更新。此外，在前 `w` 个批次之后，窗口已满，因此算法减去滑出滑动窗口的那个批次的核心集。减法运算可通过改变被减数据集中所有\
  \ `Δ-support` 的符号，然后添加核心集摘要来执行。\n\n###### 10.4.2 ADAGRAPHMINER\n\n`ADAGRAPHMINER`\
  \ 是前一方法的扩展，能够适应流中的变化，报告当前分布下频繁且闭合的图。\n\n该方法有两个版本。一个监控全局分布的某个简单统计量，在检测到变化时收缩窗口；在所呈现的实现中，使用\
  \ `ADWIN` 作为变化检测器，监控的统计量是闭合图的总数。另一个版本为每个频繁闭合子图的支持度使用单独的 `ADWIN` 实例进行监控。此版本有两个优势：首先，它对全局分布中难以察觉的单个图的微小变化敏感。其次，它无需在内存中保存滑动窗口中的所有批次，因此每个图仅随其\
  \ `ADWIN` 实例存储一次，而非 `w` 次。尽管为每个图存储一个 `ADWIN`，但实验表明对于中等 `w` 值，这需要的内存更少。\n\n图 10.5\
  \ 展示了 `ADAGRAPHMINER` 的伪代码，其中参数 `mode` 用于在两个版本中选择。\n\n![Figure 10.5 The ADAGRAPHMINER\
  \ algorithm.](img/Fig10-5.png)\n\n**图 10.5**  \n\n`ADAGRAPHMINER` 算法。\n\n##### 10.5\
  \ 补充材料\n\n频繁模式挖掘（包括批处理和流式）的文献浩如烟海。我们优先参考综述文章（若有），从中可找到许多其他参考文献。综述 [5] 对模式挖掘最为全面；特别参见\
  \ [156] 第 4 章关于数据流中模式挖掘的内容。\n\n关于项集，[67] 专注于流上频繁项集挖掘，[202] 除了描述 `IncMine` 的 MOA\
  \ 实现外，还包含多种流上项集挖掘算法优缺点的对比。\n\n关于序列模式，[180] 是近期综述，主要针对批处理场景。[174, 204] 是流上序列挖掘的两种方法。\n\
  \n关于频繁子树挖掘，[24, 69, 142] 详细阐述了各种“子树”概念并综述了相关批处理算法。[158] 提出了 `FQT-Stream`，一种用于在 XML\
  \ 数据流上挖掘所有频繁树模式的在线算法。[34] 描述了本章采用的流模式挖掘通用方法，并特别将其应用于子树挖掘。\n\n关于子图挖掘，两篇针对批处理情况的综述是\
  \ [142, 206]。从图流中挖掘频繁子图的两个算法是 `gspan` [251] 及其闭合图扩展 `CloseGraph` [252]。[35] 提出了图流中子图挖掘的核心集概念及第\
  \ 10.2.1 节中的算法。[207] 探讨了在单个大型动态（流式）图中寻找频繁子图的问题。\n\n\n\n\n我们省略了关于*关联规则*的讨论，因为通常它们是通过首先从数据集（或流）中挖掘频繁项集，然后从挖掘出的项集中确定频繁规则来获得的；也就是说，除了挖掘频繁项集之外，没有什么本质上特定于流设置的内容。树的关联规则或概率蕴涵在文献[23]中有讨论，并被证明在若干非平凡方面与集合上的关联规则表现不同。\n\
  \n序列模式挖掘框架（SPMF）[106]包含许多模式挖掘算法的实现，主要用于批处理设置，且多为 Java 语言。`IncMine`、`AdaGraphMiner`\
  \ 和 `Moment` 的实现可在 MOA 网站的*扩展*部分获得。\n\n##### 10.6 练习\n\n**练习 10.1** 证明：1. 数据集中所有频繁模式的集合可以从其闭频繁模式集合导出。2.\
  \ 如果此外我们知道每个频繁闭模式的支持度，我们可以计算每个频繁模式的支持度。\n\n**练习 10.2** 1. 形式化第 10.2.1 节中概述的贪心算法，以计算一个极大（`σ`，`δ`）-核心集。\n\
  \n2. 考虑项集数据集 `D` = {(`a`, 100), (`ab`, 80), (`abc`, 60), (`abcd`, 50)}。找出 `D` 的两个不同的极大（0.1,\
  \ 0.3）-核心集。\n\n**练习 10.3** 如果你学习过第 4 章中的 `SPACESAVING` 概要，思考如何将其改造为维护 `σ`-频繁项集，从流的开始计算频率。它需要多少内存？它会有假阳性或假阴性吗？如果有，你能证明误差率的什么界限？\n\
  \n**练习 10.4** 不看原始论文，根据本章给出的思路，为 `IncMine` 算法编写伪代码。\n\n**练习 10.5** 证明一个闭模式的绝对支持度等于其所有闭超模式（包括其自身）的\
  \ Δ-支持度之和。*提示：* 从极大模式向下使用数学归纳法。\n\n### III\n\n#### MOA 软件\n\n### 11\n\n#### MOA\
  \ 及其生态系统简介\n\n**M**assive **O**nline **A**nalysis（MOA）是一个开源软件框架，允许用户在不断演变的数据流上构建和运行机器学习及数据挖掘实验。它由新西兰怀卡托大学开发，并以一种名为恐鸟的大型、已灭绝、不会飞的鸟类命名，这种鸟过去只生活在新西兰。\n\
  \nMOA 的显著特点是它可以通过仅对数据进行一次扫描、每个数据项耗时极短，从大型数据集或流中学习和挖掘。在扫描数据时，它仅存储摘要和统计信息，而不是实例本身，因此内存使用通常也很小。\n\
  \nMOA 使用 Java 编写，并在 GNU 通用公共许可证条款下分发。它包含一组学习器、流生成器和评估器，可从图形用户界面（GUI）、命令行界面（CLI）和\
  \ Java API 使用。基于 Java 的优势在于可移植性以及强大且成熟的支持库。该语言使用广泛，自动垃圾回收等特性有助于减轻编程负担和错误。MOA 可在任何拥有合适\
  \ Java 虚拟机的平台上运行，如 Linux、Mac、Windows 和 Android。\n\nMOA 的一个预期设计目标是易于使用且易于扩展。\n\n\
  有几个与 MOA 相关的开源软件库。其中一些，如 `ADAMS`、`MEKA` 和 `OpenML`，在其系统内部使用 MOA 执行数据流分析。`StreamDM`\
  \ 包含 MOA 中一些最流行方法的 C++ 实现，而 `Apache SAMOA` 是一个新平台，利用 Hadoop 硬件在分布式环境中执行流挖掘。\n\n\
  在本书的这一部分中，我们将展示如何使用 GUI、CLI 和 Java API，以及如何掌握 MOA 算法、生成器和评估器。\n\n在本章中，我们首先简要讨论 MOA\
  \ 的架构以及如何安装软件。之后我们将介绍 MOA 的最新发展和可用的扩展，最后展示一些可以与 MOA 结合使用或作为其替代品的开源框架。目的不是使读者精通所有这些其他包，而是让他们了解这些工具的可能性。\n\
  \n##### 11.1 MOA 架构\n\nMOA 围绕*任务*的概念构建。在 MOA 中运行的所有实验都被定义为任务。有简单的任务，如将流写入文件或计算流的速度，但最重要的任务是评估任务。例如，在分类中，第\
  \ 6.1 节描述了两种主要的评估方法：留出法和预测式。\n\nMOA 包含用于分类、回归、聚类、异常检测、推荐和频繁模式挖掘的方法。任务通常由流源、学习器和评估参数组成，例如使用的实例数量、输出结果的周期性以及输出预测的文件名。此外，不同类型的任务需要不同的评估策略。\n\
  \n任务可以从 GUI 或 CLI 运行。\n\n##### 11.2 安装\n\nMOA 可从 [`moa.cms.waikato.ac.nz`](https://moa.cms.waikato.ac.nz)\
  \ 获取，最新版本始终可以作为压缩 zip 文件下载。发布包包含一个 `moa.jar` 文件，这是一个可执行的 Java jar 文件，可以作为 Java 应用程序运行或从命令行调用。它还包含\
  \ `sizeofag.jar` 文件，用于测量实验使用的内存。脚本 `bin\\moa.bat`（Windows）和 `bin/moa.sh`（Linux 和\
  \ Mac）是启动 MOA GUI 的最简便方式。\n\n##### 11.3 MOA 的最新发展\n\n本书未详细涵盖的 MOA 最新发展包括：\n\n* \
  \  **多目标学习：** 一个用于多目标学习 [91, 188, 232] 的选项卡，其目标是同时预测多个相关的目标属性。多目标学习的例子包括同一建筑中温度的预测、同一路网中的轨迹预测或股票价格预测。\n\
  \n*   **异常检测**：一个用于基于距离的异常检测 [20, 120] 的选项卡。该选项卡使用最广泛采用的标准来确定一个元素是否为异常，该标准基于固定距离内邻居元素的数量，对比一个固定阈值。\n\
  \n*   **推荐系统**：MOA 有一个任务用于使用在线推荐算法。MOA 中的 `EvaluateOnlineRecommender` 任务接收一个评分预测器和一个数据集（每个训练实例为一个\
  \ [用户, 物品, 评分] 三元组），并评估模型在给定用户和物品的情况下预测评分的效果，随着处理实例越来越多。这类似于推荐系统的在线场景，其中用户对物品的新评分不断到达，系统必须对用户未评分的物品进行预测，以知道推荐哪些物品。有两种在线推荐算法可用：`BaselinePredictor`\
  \ 和 `BRISMFPredictor`。第一种是一个非常简单的评分预测器，第二种实现了文献 [234] 中描述的一种分解算法。\n\n##### 11.4\
  \ MOA 扩展\n\n以下有用的 MOA 扩展可从其网站获得：\n\n*   **IBLStreams：** `IBLStreams` [225]，在第 8.4\
  \ 节中描述，是一种用于数据流分类和回归问题的基于实例的学习算法。\n\n*   **MOA-IncMine：** `IncMine`，由文献 [66] 提出并在第\
  \ 10.3.4 节中描述，从不断演变的数据流中计算频繁闭项集。MOA 中的实现描述于文献 [202]，并使用了来自文献 [106] 的 `CHARM` 批量挖掘器实现。\n\
  \n\n\n\n###### MOA 扩展组件\n\n*   **MOA-AdaGraphMiner:** `AdaGraphMiner` \\[35\\]（参见第\
  \ 10.4 节）是一个用于在时变流中挖掘频繁子图的框架。它包含三种用于挖掘频繁闭合子图的新方法。所有方法均在闭合子图的核心集（图集合的压缩表示）上工作，并以批增量方式维护这些集合，但采用不同的方法来应对潜在的概念漂移。\n\
  \n*   **MOA-Moment:** `Moment` \\[70\\] 是一种基于流滑动窗口的闭合频繁项集挖掘器。此版本由 M. Jarka 实现（[www.admire-project.eu](http://www.admire-project.eu)）。\n\
  \n*   **MOA-TweetReader:** 该扩展从 Twitter Streaming API 读取并转换推文为 MOA 实例，以促进推文的流式分析。\n\
  \n*   **Classifiers & DDMs:** 该扩展提供多种已发布的集成分类器（`DWM`、`RCD`、`Learn++.NSE`、`EB`）、概念漂移检测器（`ECDD`、`PHT`、`Paired\
  \ Learners`）和人工数据集（`Sine` 和 `Mixed`）。\n\n*   **MODL split criterion and GK class\
  \ summary:** 这种用于数值属性的新分裂标准基于 `MODL` 方法 \\[48\\]。`GK class summary` 基于 Greenwald\
  \ 和 Khanna 的分位数摘要（参见第 6.4.3 节），但在该版本中，类别计数包含在摘要的每个元组中。\n\n*   **Incrementally Optimized\
  \ Very Fast Decision Tree (iOVFDT):** `Hoeffding tree`（第 6.3.2 节）的一种新扩展，提出于文献 \\\
  [132\\]。\n\n*   **Anytime Nearest Neighbor**: `Liu` 和 `Bell` 实现的基于文献 \\[227\\] 的随时分类器。\n\
  \n*   **Social Adaptive Ensemble 2 (SAE2)**: 基于社会的算法，包括 `Scale-Free Network Classifier\
  \ (SFNClassifier)` \\[25, 126\\] 和 `Social Network Clusterer Stream (SNCStream)`\
  \ \\[26\\]。\n\n*   **Framework for Sentiment Analysis of a Stream of Texts**: 该项目旨在构建一个在线实时系统，能够分析传入的文本流并使用最小化的桌面应用程序可视化其主要特征\
  \ \\[18\\]。\n\n*   **MOAReduction**: 一个允许用户在无漂移流上执行数据缩减技术的 MOA 扩展。它包含用于不同任务的多种缩减方法，如离散化、实例选择和特征选择，如文献\
  \ \\[205\\] 所述。\n\n*   **MOA for Android**: 包含使 MOA 可作为 Android 应用程序一部分使用的软件。\n\n\
  ##### 11.5 ADAMS\n\n`WEKA` 和 `MOA` 是执行数据挖掘分析任务的强大工具。通常在实际应用和专业环境中，数据挖掘过程复杂且包含多个步骤。这些步骤可视为工作流。专业数据挖掘人员会使用工作流构建解决方案，而非编写\
  \ Java 程序，这样非程序员用户也能更轻松地理解和维护。`Advanced Data mining And Machine learning System\
  \ (ADAMS)` \\[213, 214\\] 是一个灵活的工作流引擎，旨在快速构建和维护真实世界的复杂工作流。它集成了 `MOA`、`WEKA` 和 `MEKA`\
  \ 等数据挖掘应用，支持 `R` 语言、图像和视频处理及特征生成能力、电子表格和数据库访问、可视化、`GIS`、Web 服务，并支持使用脚本语言（`Groovy`/`Jython`）快速原型开发新功能。\n\
  \nADAMS 的核心是工作流引擎，遵循“少即是多”的理念。它不让用户在画布上放置操作符（或称作 `actor`）并手动连接输入输出，而是使用树状结构。该结构和控制\
  \ `actor` 定义了数据在工作流中的流动方式；无需显式连接。树状结构源于内部对象表示和 `actor` 处理程序中子 `actor` 的嵌套。\n\n图\
  \ 11.1 展示了加载了 `adams-moa-classifier-evaluation` 流的 ADAMS 流编辑器。它使用 `Kappa` 统计量和决策桩（仅有一个内部节点的决策树）。图\
  \ 11.2 展示了运行工作流的结果。\n\n![图 11.1 ADAMS 流编辑器](img/Fig11-1.png)\n\n**图 11.1**  \nADAMS\
  \ 流编辑器。\n\n![图 11.2 ADAMS 流示例](img/Fig11-2.png)\n\n**图 11.2**  \nADAMS 流示例。\n\n\
  ADAMS 还可执行推文分析。可使用公共 Twitter API 记录推文及其关联元数据，并存储以供未来重放。此推文流重放功能允许按需重复实验，每次使用相同的推文流，并应用不同的过滤器（如检查元数据）和算法。带有地理标记信息的推文可利用\
  \ `OpenStreetMap` `GIS` 功能显示，从而实现地理现象的可视化。\n\nADAMS 还能近实时处理视频，按特定间隔获取帧。除了跟踪对象外，还可利用图像处理和特征生成功能为\
  \ `MOA` 或 `WEKA` 等机器学习平台生成输入。\n\n##### 11.6 MEKA\n\n`MEKA` \\[212\\] 是怀卡托大学发起的一个开源项目，用于执行和评估多标签分类。它使用所谓的问题转换方法，使\
  \ `WEKA` 单标签（二分类或多分类）方法可作为多标签分类的基分类器；参见第 6.7 节。\n\n`MEKA` 包含所有基本问题转换方法、高级方法（包括常作为近期多标签文献基准的各种分类器链变体），以及算法适配（如多标签神经网络和深度神经网络）。它包含两种自动阈值校准策略和多种文献中的评估指标。`MEKA`\
  \ 易于通过 `CLI` 或 `GUI` 使用（图 11.3）。因此无需编程即可参数化、运行和评估分类器，适合不熟悉 Java 的从业者。不过，扩展 `MEKA`\
  \ 的新分类器并将其集成到其他框架中非常简单。熟悉 `WEKA` 的用户几乎没有学习曲线——`WEKA` 的大部分文档和操作模式直接适用。任何新的 `MEKA`\
  \ 分类器均可结合 `MEKA` 现有的任何集成方案和任何 `WEKA` 基分类器，无需编写额外代码，并可轻松与基准及最先进方法比较。`MEKA` 还支持多标签背景下的半监督和流式分类，如第\
  \ 6.7 节所述。\n\n![图 11.3 MEKA GUI](img/Fig11-3.png)\n\n**图 11.3**  \nMEKA GUI。\n\n\
  ##### 11.7 OpenML\n\n`OpenML` \\[238, 239\\] 是一个在线平台，科学家可在其中自动记录和共享机器学习数据集、代码和实验，在线组织它们，并直接基于他人的工作构建。它有助于自动化研究中许多繁琐的方面，易于集成到多种机器学习工具中，并提供易用的\
  \ `API`。它还支持大规模和实时协作，允许研究人员共享最新结果，同时追踪其影响力和复用情况。组合和关联的结果提供了丰富信息，可加速研究、辅助数据分析或实现实验全自动化。\n\
  \n\n\n\n\n###### OpenML\n\nOpenML 拥有一个广泛的 REST API，用于搜索、下载和上传数据集、任务、流程和运行。此外，还提供了\
  \ Java、R 和 Python 编程 API，以便轻松集成到现有的软件工具中。使用这些 API，OpenML 已经集成到 MOA 中，如图 11.4 所示。另外，还提供了\
  \ R 和 Python 库，只需几行代码即可搜索和下载数据集和任务，并上传机器学习实验的结果。\n\n![图 11.4 OpenML 与 MOA 的集成。](img/Fig11-4.png)\n\
  \n**图 11.4**\n\nOpenML 与 MOA 的集成。\n\n##### 11.8 StreamDM\n\n**StreamDM-C++** [43]\
  \ 是华为诺亚方舟实验室发起的一个开源项目。它用 C++ 为数据流实现了 Hoeffding 自适应树（第 6.3.5 节），并在华为内部得到了广泛应用。Hoeffding\
  \ 自适应树能适应数据流中的变化，这是一个巨大的优势，因为标准决策树是使用数据快照构建的，无法随时间演变。\n\n**用于 Spark Streaming 的\
  \ StreamDM** [39] 是一个用于挖掘大数据流的开源项目，它使用 **Spark Streaming** [253]，后者是核心 Spark API\
  \ 的一个扩展，可实现对数据流的可扩展流处理。\n\n##### 11.9 Streams\n\n**streams** [46] 框架是一个简单流处理环境的\
  \ Java 实现。它旨在提供一个清晰且易于使用的基于 Java 的平台来处理流数据。streams 库的核心模块是一层薄薄的接口和类 API，反映了流式处理过程的高层视图。该\
  \ API 是使用 streams 库实现自定义处理器和提供服务的基础。\n\nstreams 库的流分析模块提供了用于分析的在线方法实现，例如不同的近似计数算法和在线统计计算（如分位数摘要）。由于\
  \ streams 包含 MOA，因此 MOA 的方法可在该框架内使用。\n\n##### 11.10 Apache SAMOA\n\n**Apache 可扩展高级海量在线分析\
  \ (SAMOA)** [181] 是一个为大数据流提供分布式机器学习的框架，具有可插入不同流处理平台的接口，这些平台运行在 Hadoop 生态系统中。\n\n\
  SAMOA 可用于两种不同的模式：它可以作为一个运行平台，向其中添加新算法；或者开发人员可以实现自己的算法，并在自己的生产系统中运行它们。SAMOA 的另一个特性是流处理平台抽象，开发人员也可以通过使用可用的\
  \ API 添加新平台。通过这种角色分离，SAMOA 项目分为 **SAMOA API 层** 和 **DSPE 适配器层**。SAMOA API 层允许开发人员为\
  \ SAMOA 进行开发，而无需担心将使用哪种分布式流处理引擎 (SPE)。当发布新的 SPE 或有兴趣与另一个平台集成时，可以添加一个新的 DSPE 适配器层模块。目前，SAMOA\
  \ 支持四种当前最先进的 SPE：**Apache Flink**、**Storm**、**Samza** 和 **Apex**。\n\nSAMOA 的模块化组件包括\
  \ `processor`、`stream`、`content event`、`topology` 和 `task`。\n\n###### Processor\n\
  \nSAMOA 中的 `processor` 是一个计算单元元素，它在 `特定的 SPE` 上执行算法的某一部分。处理器包含算法的实际逻辑。**处理项 (PI)**\
  \ 是针对每个 SPE 的处理器的不同内部具体实现。\n\nSPE 适配器层负责处理 PI 的实例化。PI 有两种类型：`入口 PI` 和 `普通 PI`。`入口\
  \ PI` 将外部源的数据转换为实例，或独立生成实例。然后，它使用正确类型的 `content event` 通过相应的流将实例发送给目标 PI。`普通 PI`\
  \ 从传入流中消费 `content event`，处理 `content event`，并可能将相同的 `content event` 或新的 `content\
  \ event` 发送到传出流。开发人员可以指定 `并行度提示`，即 SAMOA 执行期间的 `运行时 PI` 数量，如图 11.5 所示。`运行时 PI` 是底层\
  \ SPE 在执行期间创建的实际 PI。SAMOA 根据底层 SPE 动态实例化 PI 的具体类实现。\n\n![图 11.5 SAMOA 中的并行度提示。](img/Fig11-5.png)\n\
  \n**图 11.5**\n\nSAMOA 中的并行度提示。\n\nPI 通过组合包含其对应的处理器和流。处理器是可复用的，这允许开发人员在多个机器学习算法实现中使用相同的处理器实现。PI\
  \ 和处理器之间的分离使开发人员能够专注于开发他们的算法，而无需担心 PI 的 SPE 特定实现。\n\n###### Stream\n\n`stream` 是从一个\
  \ PI 到其对应的目标 PI 的连接。开发人员将流视为 PI 之间的连接器，以及在 PI 之间发送 `content event` 的媒介。`content\
  \ event` 封装了通过流从一个 PI 传输到另一个 PI 的数据。此外，与处理器类似，`content event` 也是可复用的。开发人员可以在多个算法中使用一个\
  \ `content event`。\n\n`源 PI` 是通过流发送 `content event` 的 PI。`目标 PI` 是通过流接收 `content\
  \ event` 的 PI。开发人员通过将流与恰好一个 `源 PI` 关联来实例化流。当 `目标 PI` 想要连接到流时，它们需要指定 `分组` 机制，该机制决定了流如何路由传输的\
  \ `content event`。\n\n###### Topology\n\n`topology` 是连接的处理项和流的集合。它代表一个处理传入数据流的组件网络。在\
  \ SAMOA 之上实现的分布式流式算法对应一个 `topology`。\n\n###### Task\n\n`task` 是一项与机器学习相关的活动，例如对分类器执行特定评估。`task`\
  \ 的一个例子是 `预测性评估任务`，即使用每个实例测试模型性能，然后使用相同的实例通过特定算法训练模型的 `task`。在 SAMOA 中，`task` 也对应一个\
  \ `topology`。\n\n平台用户本质上调用 SAMOA `task`。他们指定想要执行哪种 `task`，SAMOA 会根据 `task` 自动构建一个\
  \ `topology`。接下来，平台用户需要确定可用于部署的 SPE 集群，并配置 SAMOA 在该集群上执行。一旦配置正确，SAMOA 会将 `topology`\
  \ 无缝部署到配置好的集群中，平台用户可以通过执行的专用日志文件观察执行结果。\n\nSAMOA 中的 **ML 适配器层** 由封装其他机器学习框架中 ML\
  \ 算法实现的类组成。目前，SAMOA 有一个用于 MOA 算法或学习器的包装类，这意味着 SAMOA 可以轻松使用 MOA 学习器来执行某些 `task`。SAMOA\
  \ 不会改变 MOA 学习器的底层实现，因此学习器仍然在 SAMOA 底层 SPE 之上以顺序方式执行。\n\n开发人员使用 `processor`、`content\
  \ event`、`stream` 和 `processing item` 的抽象来设计和实现分布式流式机器学习算法。使用这些模块化组件，他们可以灵活地通过复用现有的\
  \ `processor` 和 `content event`，或从头编写新的组件来实现新算法。他们还可以通过 **ML 适配器层** 复用现有机器学习框架中的现有算法和学习器，从而获得灵活性。\n\
  \n开发人员也可以使用相同的抽象实现 `task`。由于 `processor` 和 `content event` 可复用；`topology` 及其对应的算法也可复用。这意味着他们也可以灵活地通过复用现有算法和组件，或从头编写新算法和组件来实现新的\
  \ `task`。\n\n\n\n\n目前，SAMOA 包含以下算法：\n\n*   **垂直霍夫丁树 [149]：** 垂直并行方法按属性对实例进行划分以实现并行处理。具有垂直并行性的决策树诱导器处理划分后的实例（由属性子集组成）以并行计算分裂标准。例如，如果我们有包含\
  \ 100 个属性的实例，并将实例划分为 5 个部分，则每部分将有 20 个属性。在每个部分中，算法并行处理这 20 个属性以确定局部最佳分裂属性，并结合并行计算结果以确定全局最佳分裂属性并增长树。\n\
  \n*   **AMRules [241]：** SAMOA 使用垂直和水平并行性的混合体在集群上分发 AMRules。AMRules 构建的决策规则是可理解的模型，其中规则的前件是属性值条件的合取，后件是属性的线性组合。\n\
  \n*   **自适应装袋：** 这是一种易于并行化的方法。每个装袋副本被分配给不同的处理器。\n\n*   **分布式聚类：** SAMOA 中的聚类分为两层：第一层对拆分后的数据执行聚类，第二层使用第一层输出的微簇执行元聚类。\n\
  \n### 12 图形用户界面\n\nMOA 图形用户界面 (GUI) 允许通过菜单选择和表单填写来使用 MOA。顶部包含多个选项卡，对应四种学习任务：分类、回归、聚类和异常检测。本章将介绍评估、分类和聚类的主要选项；建议读者进一步探索，并阅读\
  \ MOA 文档以获取更多细节，例如每种方法可用的参数。\n\n#### 12.1 GUI 入门\n\n用于配置和运行任务的 GUI 通过以下命令调用：\n\n\
  ```\nbin/moa.sh\n```\n\n在 Linux 或 Mac 中，以及\n\n```\nbin\\moa.bat\n```\n\n在 Windows\
  \ 中。这些命令使用以下方式调用 GUI：\n\n```\njava -Xmx1G … moa.gui.GUI\n```\n\n有多个选项卡，分别用于分类、回归、聚类和异常检测。在以下章节中，我们将介绍如何使用它们。\n\
  \n#### 12.2 分类与回归\n\nMOA 中的分类和回归选项卡包含四个不同的组件，如 图 12.1 所示：\n\n*   配置当前任务\n*   任务列表\n\
  *   输出面板\n*   评估指标和图表输出面板\n\n![图 12.1 MOA 图形用户界面。](img/Fig12-1.png)\n\n**图 12.1**\n\
  \nMOA 图形用户界面。\n\n要使用分类 GUI，首先需要配置一个任务，然后运行它，最后在输出面板中查看结果。\n\n我们可以点击 *Configure*（配置）来设置任务，修改任务参数（参见\
  \ 图 12.2），准备就绪后，可以点击 *Run*（运行）启动任务。可以同时运行多个任务。我们可以点击列表中的不同任务，并使用下方的按钮进行控制。如果任务有文本输出，将显示在\
  \ GUI 底部，并可保存到磁盘。如果有图形输出，将显示在底部的图表显示区。\n\n![图 12.2 在 MOA 中设置任务的选项。](img/Fig12-2.png)\n\
  \n**图 12.2**\n\n在 MOA 中设置任务的选项。\n\n请注意，窗口顶部显示的命令行文本框代表可用于在命令行上运行任务的文本命令，如下一章所述。该文本可被选中并复制到剪贴板。GUI\
  \ 底部有一个结果的图形显示。可以比较两个不同任务的结果：当前任务以红色显示，之前执行的任务以蓝色显示。\n\n##### 12.2.1 任务\n\nMOA 中的主要任务如下：\n\
  \n*   **WriteStreamToARFFFile** 将数据流输出到 ARFF 文件。ARFF 是 WEKA 项目 [107] 使用的一种方便的数据格式，它通过包含指定属性类型、名称和值的头部来扩展\
  \ CSV 格式。\n\n*   **MeasureStreamSpeed** 测量数据流的速度。\n\n*   **LearnModel** 从数据流中学习预测模型。\n\
  \n*   **EvaluateModel** 在数据流上评估静态预测模型。\n\n*   **EvaluatePeriodicHeldOutTest** 通过定期在保留集上测试，在数据流上评估分类器。\n\
  \n*   **EvaluateInterleavedTestThenTrain** 通过按顺序对每个实例先测试后训练，在数据流上评估分类器。没有遗忘机制，因此所有实例在评估中同等重要。\n\
  \n*   **EvaluatePrequential** 通过按顺序对每个示例先测试后训练，在数据流上评估分类器。它可以选择使用滑动窗口或衰减因子作为遗忘机制。\n\
  \n*   **EvaluatePrequentialCV** 通过执行 *k* 折分布式交叉验证，在数据流上评估分类器；每次新实例到达时，随机选择一个分类器用于测试，使用其他分类器进行训练。它可以选择使用滑动窗口或衰减因子作为遗忘机制。\n\
  \n*   **EvaluateInterleavedChunks** 通过按顺序对数据块先测试后训练，在数据流上评估分类器。\n\n评估方法在第 6.1 节中定义。\n\
  \n##### 12.2.2 数据源与数据生成器\n\nMOA 数据流通过生成器构建、读取 ARFF 文件、连接多个数据流或过滤数据流来创建。它们允许模拟潜在的无限数据序列。已实现以下组件：\n\
  \n*   **ArffFileStream** 从 ARFF 文件读取数据流。\n\n*   **ConceptDriftStream** 通过平滑合并两个具有相同属性和类的数据流，创建一个包含概念漂移的数据流。\n\
  \nMOA 将数据流中的概念漂移建模为两个现有数据流的加权混合，这两个数据流分别描述漂移前后的数据分布。MOA 使用 Sigmoid 函数作为一种简单实用的解决方案，定义两个数据流的合并以模拟漂移。\n\
  \n我们从第 3.2.1 节的 图 3.5 中看到，Sigmoid 函数\n\n![sigmoid function](img/pg204-1.png)\n\n\
  在点 *p* 处的导数为 *f*′(*p*) = *s/*4。角度 *α* 的正切等于此导数，tan *α* = *s/*4。我们观察到 tan *α* = 1*/w*，且因为\
  \ *s* = 4 tan *α*，所以 *s* = 4*/w*。因此，Sigmoid 中的参数 *s* 给出了 *w* 的长度和角度 *α*。在这个 Sigmoid\
  \ 模型中，我们只需要指定两个参数：变化点 *p* 和变化长度 *w*。注意，对于任意正实数 *β*\n\n![formula](img/pg205-1.png)\n\
  \n且 *f*(*p* + *β* · *w*) 和 *f*(*p* − *β* · *w*) 是不依赖于 *p* 和 *w* 的常数值。例如，\n\n![formula](img/pg205-2.png)\n\
  \n给定两个数据流 ![stream a](img/pg205-in-1.png) 定义为通过连接两个数据流 *a* 和 *b* 构建的数据流，其中 *p* 是变化点，*w*\
  \ 是变化长度，\n\n![formula](img/pg205-3.png)\n\n我们观察到以下性质，如果 *a* ≠ *b*：\n\n![formula](img/pg205-4.png)\n\
  \n为了创建具有多个概念变化的数据流，我们可以通过连接不同的概念漂移来构建新数据流：\n\n![formula](img/pg205-5.png)\n\n* \
  \  **ConceptDriftRealStream** 通过合并两个具有不同属性和类的数据流，生成一个包含概念漂移的数据流。新数据流包含两个数据流的属性和类。\n\
  \n*   **FilteredStream** 通过过滤器从数据流获得的数据流，例如 `AddNoiseFilter`。\n\n*   **AddNoiseFilter**\
  \ 向数据流中的示例添加随机噪声。仅用于 `FilteredStream`。\n\n*   **generators.AgrawalGenerator** 生成十种不同的预定义贷款函数之一。\n\
  \n\n\n\n该生成器由 Agrawal 等人在文献 [8] 中提出。它是早期决策树学习器扩展研究工作的常用数据来源。该生成器产生一个包含九个属性的数据流，其中六个为数值型，三个为分类型。尽管作者未明确说明，但一个合理的推测是这些属性描述的是假设的贷款申请。定义了十个函数用于根据属性生成二元类标签。推测这些函数决定了贷款是否应被批准。\n\
  \nC 语言源代码公开可用。内置函数基于所引用论文（第 924 页），在公开的 C 语言实现中对应 `pred20` 至 `pred29` 函数。扰动函数的工作方式遵循\
  \ C 语言实现，而非论文中的描述。\n\n*   **generators.HyperplaneGenerator** 生成预测旋转超平面类别的问题。\n\n\
  该问题在文献 [138] 中被用作 CVFDT 与 VFDT 对比的测试平台。*d* 维空间中的超平面是满足 ![](img/pg206-in-2.png) 的点\
  \ *x* ∈ℜ^(*d*) 的集合，其中 *x*[*i*] 是点 *x* 的第 *i* 个坐标。满足 ![](img/pg206-in-3.png) 的点示例被标记为正类，满足\
  \ ![](img/pg206-in-4.png) 的点示例被标记为负类。超平面适用于模拟时变概念，因为我们可以通过改变权重的相对值，以平滑的方式改变超平面的方向和位置。我们通过给每个权重属性添加漂移来引入变化：*w*[*i*]\
  \ = *w*[*i*] + *dσ*，其中 *σ* 是变化方向反转的概率，*d* 是变化速度。\n\n*   **generators.LEDGenerator**\
  \ 生成预测七段 LED 显示器上显示数字的问题。\n\n该数据源源自 CART 书籍 [56]。目标是预测七段 LED 显示器上显示的数字，其中每个属性有 10%\
  \ 的几率被反转。其最优贝叶斯分类率（最佳可能分类器的速率）为 74%。实验中使用的特定生成器配置（led）产生 24 个二元属性，其中 17 个是无关属性。\n\
  \n*   **generators.LEDGeneratorDrift** 生成预测七段 LED 显示器上显示数字（带漂移）的问题。\n\n*   **generators.RandomRBFGenerator**\
  \ 生成随机径向基函数数据流。\n\n设计该生成器是为了提供一种替代的复杂概念类型，这种类型不易用决策树近似。RBF（径向基函数）生成器的工作原理如下：生成固定数量的随机簇。每个簇有一个随机中心、一个标准差、一个类标签和一个权重。通过按权重成比例的概率选择一个簇，然后从以该簇中心为中心、以该簇在每个轴上的标准差为标准差的高斯分布中生成一个点，从而产生新示例。这实际上在每个中心周围创建了一个密度各异的正态分布超球体示例。仅生成数值属性。被选中的簇也决定了示例的类标签。\n\
  \n*   **generators.RandomRBFGeneratorDrift** 生成带漂移的随机径向基函数数据流。漂移通过以恒定速度移动中心来引入。\n\
  \n*   **generators.RandomTreeGenerator** 基于随机生成的树生成数据流。\n\n该生成器基于文献 [88] 中的提议，产生的概念应有利于决策树学习器。它通过随机选择属性进行分裂，并为每个叶节点分配随机类标签来构建决策树。树构建完成后，数据流中的示例通过为属性分配均匀分布的随机值来生成，这些值再通过树确定类标签。该生成器具有参数以控制类别数量、属性数量、名义属性标签和树的深度。\n\
  \n生成示例后可引入噪声。对于离散属性和类标签，噪声概率参数决定了某个特定值被切换为非原始值的几率。对于数值属性，会向所有值添加一定程度的随机噪声，该噪声源自标准差等于原始值标准差乘以噪声概率的随机高斯分布。\n\
  \n*   **generators.SEAGenerator** 生成 SEA 概念函数。\n\n该生成器在文献 [233] 中提出，用于研究对突发概念漂移的反应。数据流使用三个属性生成，只有前两个相关。所有三个属性的值均在\
  \ 0 到 10 之间。数据流中的点被划分为四个具有不同概念的块。在每个块中，0/1 类由不等式 *f*[1] + *f*[2] ≤ *θ* 确定，其中 *f*[1]\
  \ 和 *f*[2] 代表前两个属性，*θ* 为阈值。这四个类最常用的阈值分别为 9、8、7 和 9.5。\n\n*   **generators.STAGGERGenerator**\
  \ 生成 STAGGER 概念函数，由 Schlimmer 和 Granger 在文献 [223] 中提出。\n\nSTAGGER 概念是三个属性的布尔函数，用于编码对象：大小（小、中、大）、形状（圆、三角、矩形）和颜色（红、蓝、绿）。概念是两个属性的合取或析取，例如\
  \ *(颜色=红 且 大小=小)* 或 *(颜色=绿 或 形状=圆)*。\n\n*   **generators.WaveformGenerator** 生成预测三种波形类型之一的问题。\n\
  \n它与 LED 数据集同源。该任务的目标是区分三种不同的波形类别，每种类别由两个或三个基础波组合生成。最优贝叶斯分类率已知为 86%。该问题有两个版本：wave21\
  \ 拥有 21 个数值属性，均包含噪声；wave40 则额外引入了 19 个无关属性。\n\n*   **generators.WaveformGeneratorDrift**\
  \ 生成预测三种波形类型之一（带漂移）的问题。\n\n##### 12.2.3 贝叶斯分类器\n\n*   **NaiveBayes** 执行经典贝叶斯预测，做出所有属性相互独立的朴素假设。详见第\
  \ 6.2.3 节。\n\n*   **NaiveBayesMultinomial** 多项式朴素贝叶斯分类器详见第 6.2.4 节。\n\n##### 12.2.4\
  \ 决策树\n\n*   **HoeffdingTree** 适用于无变化数据流的决策树诱导器，详见第 6.3.2 节。要在叶节点使用多数类学习器，请使用 `HoeffdingTree\
  \ -l MC`。\n\n*   **DecisionStump** 仅含单个内部节点的决策树，因此仅测试一个属性来预测实例。\n\n*   **HoeffdingOptionTree**\
  \ Hoeffding 选项树，详见第 7.6.1 节。可以选择放置在叶节点的分类器类型：多数类、朴素贝叶斯或自适应朴素贝叶斯。默认选择自适应朴素贝叶斯，因为它往往能给出最佳结果；它监控多数类和朴素贝叶斯预测器的错误率，并跟踪近期实例上表现较好的预测器进行切换。要在叶节点使用多数类学习器运行实验，请使用\
  \ `HoeffdingOptionTree -l MC`。\n\n*   **HoeffdingAdaptiveTree** 适用于演变数据流的决策树诱导器，详见第\
  \ 6.3.5 节。\n\n*   **AdaHoeffdingOptionTree** 适用于流式数据的自适应 Hoeffding 选项树，叶节点使用自适应朴素贝叶斯分类器\
  \ [38]。*自适应 Hoeffding 选项树* 是一种具有以下改进的 Hoeffding 选项树：每个叶节点存储当前错误的估计值，使用 *α* = 0.2\
  \ 的 EWMA 计数器进行估计。投票过程中每个节点的权重与其错误的倒数平方成正比。\n\n##### 12.2.5 元分类器（集成）\n\n\n\n\n\n\
  # 12.2.6 函数分类器\n\n*   **MajorityClass** 始终预测在训练数据中观察到频率最高的类别。\n*   **NoChange**\
  \ 它预测用于训练模型的最后一个实例中观察到的类别。\n*   **Perceptron**，单感知机分类器。以增量方式执行经典的多类感知机学习。\n*   **SGD**\
  \ 实现随机梯度下降以学习各种线性模型：二分类 SVM、二分类逻辑回归和线性回归。\n*   **SPegasos** 实现 Shalev-Shwartz 等人\
  \ [226] 提出的 Pegasos（SVM 的原始估计次梯度求解器）方法的随机变体。\n\n# 12.2.7 漂移分类器\n\n*   **SingleClassifierDrift**\
  \ 用于处理概念漂移数据流的分类器，基于使用变化检测器来监控分类器的错误。当变化检测器发出警告信号时，会创建一个新分类器；当发出变化信号时，当前分类器将被新分类器替换。这是\
  \ Gama 等人 [114] 提出的 DDM 方法中的策略，详见第 5.3.4 节。可以使用多种漂移检测方法：\n    *   **CusumDM** 和\
  \ **PageHinkleyDM**，见第 5.3.2 节。\n    *   **DDM**，见第 5.3.4 节。\n    *   **EDDM**，基于分类错误间距离的估计分布，见文献\
  \ [22]。\n    *   **ADWINChangeDetector**，见第 5.3.5 节。\n    *   **EWMAChartDM**，基于使用指数加权移动平均（EWMA）控制图\
  \ [216]，见第 5.3.4 节提及。\n    *   **GeometricMovingAverageDM**，基于使用几何移动平均估计。\n    *\
  \   **HDDM_A_Test** 和 **HDDM_W_Test**，基于使用 Hoeffding 界，见文献 [44]。\n    *   **SEEDChangeDetector**，基于检测波动率偏移，见文献\
  \ [136]。\n    *   **SeqDrift1ChangeDetector** 和 **SeqDrift2ChangeDetector**，第一个基于比较滑动窗口中的数据和存储库中的数据，第二个基于比较水库中的数据和存储库中的数据，见文献\
  \ [196, 220]。\n    *   **STEPD**，基于使用比例相等的统计检验，见文献 [186]。\n\n# 12.2.8 主动学习分类器\n\n\
  *   **ActiveClassifier** 用于主动学习的分类器，旨在在不请求超过其预算允许的标签数量的前提下学习一个准确的模型。该分类器可以使用多种显式处理概念漂移的主动学习策略，详见第\
  \ 6.8 节。\n\n# 12.3 聚类\n\nMOA 中的聚类选项卡包含以下主要组件：\n\n*   面向演化流的流聚类数据生成器（包括新奇性、合并等事件），\n\
  *   一组最先进的流聚类算法，\n*   用于流聚类的评估度量，以及\n*   用于分析结果和比较不同设置的可视化工具。\n\n## 12.3.1 数据馈送与数据生成器\n\
  \n图 12.3 显示了带有事件的 RBF 数据生成器配置对话框的截图。通常可以设置簇的维度、数量和大小，以及漂移速度、衰减视界（老化）和噪声率。事件构成了底层数据模型的变化，如簇增长、簇合并或新簇的创建。利用事件频率和各个事件的权重，可以研究不同方法在各种设置下的行为和性能。最后，数据生成器的设置可以存储和加载，这提供了共享设置的机会，从而为可重复性和比较提供基准流数据集。\n\
  \n![图 12.3 RBF 数据生成器的选项对话框。通过存储和加载设置，流数据集可共享用于基准测试、可重复性和比较。](img/Fig12-3.png)\n\n\
  **图 12.3**  \nRBF 数据生成器的选项对话框。通过存储和加载设置，流数据集可共享用于基准测试、可重复性和比较。\n\n## 12.3.2 流聚类算法\n\
  \n目前 MOA 包含多种流聚类方法，包括：\n\n*   **StreamKM++**，见第 9.2 节。\n*   **CluStream**，见第 9.3\
  \ 节。\n*   **ClusTree**，见第 9.5 节。\n*   **Den-Stream**，见第 9.5 节。\n*   **CobWeb**。一种层次聚类器，也是最早的数据增量聚类方法之一，由\
  \ Fisher [102] 提出。\n\n## 12.3.3 可视化与分析\n\n评估过程开始后，有多种分析输出的选项：\n\n*   可以停止流，并将当前的（微）聚类结果作为数据集传递给\
  \ WEKA Explorer 进行进一步分析或挖掘；\n*   在可配置的时间间隔评估的评估度量，可以存储为 CSV 文件，以便使用首选程序离线获取图表；\n\
  *   最后，聚类结果和相应的度量都可以在 MOA 内部在线可视化。\n\nMOA 允许同时配置和评估两种不同的设置以进行直接比较，例如在同一流上比较两种不同算法，或在具有不同噪声水平的流上比较同一算法，等等。\n\
  \n可视化组件允许可视化流以及聚类结果，为多维数据选择维度，并并行比较不同设置的实验。图 12.4 显示了可视化选项卡的截图。在该截图中，在相同的流设置下比较了\
  \ **CluStream** 算法的两种不同设置，包括每 50000 个样本发生一次合并/分裂事件，并选择了四种度量进行在线评估（F1、精确率、召回率和 SSQ）。\n\
  \n![图 12.4 MOA 聚类 GUI 的可视化选项卡。](img/Fig12-4.png)\n\n**图 12.4**  \nMOA 聚类 GUI 的可视化选项卡。\n\
  \n\n\n\nMOA 聚类 GUI 的可视化选项卡。\n\nGUI 的上半部分提供了暂停和恢复流、调整可视化速度、选择 x 和 y 的维度以及要显示的组件（点、微聚类和宏聚类以及真实标签）的选项。GUI\
  \ 的下半部分以数字形式显示两种设置的测量值（左侧，包含均值），并以图表形式显示当前选定的度量随已处理示例的变化情况（右侧，此例中为 SSQ 度量）。\n\n\
  ### 13 使用命令行\n\n如前一章所述，MOA 方法和任务既可以通过 GUI 使用，也可以使用 CLI。对于分类和回归，GUI 中使用的任务命令可以直接在\
  \ CLI 中使用。在本章中，我们将展示如何从命令行运行这些任务以及其他任务。\n\n运行任务就像从命令行调用 `moa.DoTask` 命令一样简单。例如，要运行\
  \ `LearnModel` 任务，只需输入\n\n```java\njava -cp moa.jar -javaagent:sizeofag.jar moa.DoTask\
  \ LearnModel\n```\n\n……参数……\n\n在接下来的章节中，我们将看到这种用法的具体示例。\n\n#### 13.1 分类和回归的学习任务\n\
  \n第一个示例将命令 MOA 训练 `HoeffdingTree` 分类器并创建一个模型。`moa.DoTask` 类是命令行运行任务的主类。它将接受任务名称以及任何适当的参数。我们将使用的第一个任务是\
  \ `LearnModel` 任务。`-l` 参数指定学习器，在本例中为 `trees.HoeffdingTree` 类。`-s` 参数指定用于学习的数据流，在本例中为\
  \ `generators.WaveformGenerator`，生成一个三类学习问题。`-m` 选项指定用于训练学习器的最大示例数，在本例中为 1,000,000\
  \ 个示例。`-O` 选项指定一个文件以输出生成的模型：\n\n```java\njava -cp moa.jar -javaagent:sizeofag.jar\
  \ moa.DoTask \\\nLearnModel -l trees.HoeffdingTree \\\n-s generators.WaveformGenerator\
  \ -m 1000000 -O model1.moa\n```\n\n这将创建一个名为 `model1.moa` 的文件，其中包含训练期间诱导的树模型。\n\n\
  #### 13.2 分类和回归的评估任务\n\n下一个示例将评估模型，以计算其在使用不同随机种子生成的一组示例上的准确性。`EvaluateModel` 任务获得加载上一步生成的模型所需的参数，使用随机种子\
  \ 2 生成新的波形流，并在另外 1,000,000 个示例上进行测试：\n\n```java\njava -cp moa.jar -javaagent:sizeofag.jar\
  \ moa.DoTask \\\n\"EvaluateModel -m file:model1.moa \\\n-s (generators.WaveformGenerator\
  \ -i 2) -i 1000000\"\n```\n\n请注意使用括号的嵌套参数。任务描述周围添加了引号，否则操作系统可能会被括号搞混。\n\n评估后将输出以下统计信息：\n\
  \n```text\nclassified instances = 1,000,000\nclassifications correct (percent) =\
  \ 84.474\nKappa Statistic (percent) = 76.711\n```\n\n请注意，上述两个步骤可以合二为一，避免创建外部文件，如下所示：\n\
  \n```java\njava -cp moa.jar -javaagent:sizeofag.jar moa.DoTask \\\n\"EvaluateModel\
  \ -m (LearnModel -l trees.HoeffdingTree \\\n-s generators.WaveformGenerator -m 1000000)\
  \ \\\n-s (generators.WaveformGenerator -i 2) -i 1000000\"\n```\n\nMOA 将在内存中创建并使用分类器，而不将其存储在文件中。\n\
  \n#### 13.3 分类和回归的学习与评估任务\n\n`EvaluatePeriodicHeldOutTest` 任务将在定期间隔使用留出测试集拍摄性能快照的同时训练模型。以下命令创建一个\
  \ CSV 文件，在 `WaveformGenerator` 数据上训练 `HoeffdingTree` 分类器，保留前 100,000 个示例用于测试，总共训练\
  \ 100,000,000 个示例，并每 1,000,000 个示例在留出集上测试一次：\n\n```java\njava -cp moa.jar -javaagent:sizeofag.jar\
  \ moa.DoTask \\\n\"EvaluatePeriodicHeldOutTest -l trees.HoeffdingTree \\\n-s generators.WaveformGenerator\
  \ \\\n-n 100000 -i 100000000 -f 1000000\" > dsresult.csv\n```\n\n为了进行比较，可以在同一个问题上训练一个使用\
  \ 10 棵决策树的 Bagging 学习器：\n\n```java\njava -cp moa.jar -javaagent:sizeofag.jar moa.DoTask\
  \ \\\n\"EvaluatePeriodicHeldOutTest -l (OzaBag -l trees.HoeffdingTree \\\n-s 10)\
  \ -s generators.WaveformGenerator \\\n-n 100000 -i 100000000 -f 1000000\" > htresult.csv\n\
  ```\n\nMOA 中实现的另一种评估方法是交错测试后训练。它能生成随时间变化更平滑的准确率图表，因为每个单独的示例对总体平均值的意义越来越小。下面是一个 `EvaluateInterleavedTestThenTrain`\
  \ 任务的示例，它创建一个 CSV 文件，在 `WaveformGenerator` 数据上训练 `HoeffdingTree` 分类器，总共训练和测试 100,000,000\
  \ 个示例，并每 1,000,000 个示例记录一次准确率：\n\n```java\njava -cp moa.jar -javaagent:sizeofag.jar\
  \ moa.DoTask \\\n\"EvaluateInterleavedTestThenTrain -l trees.HoeffdingTree \\\n\
  -s generators.WaveformGenerator \\\n-i 100000000 -f 1000000\" > htresult.csv\n```\n\
  \n#### 13.4 比较两个分类器\n\n假设我们要比较两个分类器的学习曲线：决策树桩和霍夫丁树。首先，我们必须执行 `EvaluatePeriodicHeldOutTest`\
  \ 任务，以便在定期间隔使用留出测试集拍摄性能快照的同时训练模型。以下命令创建 CSV 文件，在 `WaveformGenerator` 数据上训练 `DecisionStump`\
  \ 和 `HoeffdingTree` 分类器，使用 1,000 个示例进行留出测试，总共训练 100,000 个示例，并每 10,000 个示例测试一次：\n\
  \n```java\njava -cp moa.jar -javaagent:sizeofag.jar moa.DoTask \\\n\"EvaluatePeriodicHeldOutTest\
  \ -l trees.DecisionStump \\\n-s generators.WaveformGenerator \\\n-n 1000 -i 100000\
  \ -f 10000\" > dsresult.csv\n```\n\n```java\njava -cp moa.jar -javaagent:sizeofag.jar\
  \ moa.DoTask \\\n\"EvaluatePeriodicHeldOutTest -l (trees.HoeffdingTree -l MC) \\\
  \n-s generators.WaveformGenerator \\\n-n 1000 -i 100000 -f 10000\" > htresult.csv\n\
  ```\n\n假设系统上安装了 `gnuplot`，可以使用以下命令绘制学习曲线：\n\n```gnuplot\ngnuplot> set datafile separator\
  \ \",\"\ngnuplot> set ylabel \"% correct\"\ngnuplot> set xlabel \"examples processed\"\
  \ngnuplot> plot [][] \\\n\"dsresult.csv\" using 1:9 with linespoints \\\ntitle \"\
  DecisionStump\", \\\n\"htresult.csv\" using 1:9 with linespoints \\\ntitle \"HoeffdingTree\"\
  \n```\n\n这将生成 图 13.1 所示的图形。\n\n![图 13.1 使用 gnuplot 绘制的两个分类器学习曲线渲染图。](img/Fig13-1.png)\n\
  \n**图 13.1**  \n使用 gnuplot 绘制的两个分类器学习曲线渲染图。\n\n对于这个问题，很明显完整的树比单个树桩能达到更高的准确率。树桩的准确率几乎恒定（约\
  \ 58%），不会随着进一步训练而提高，而完整树的准确率在前 100,000 个示例上提高了 10%。\n\n### 14 使用 API\n\n可以通过调用 MOA\
  \ 的 API 从外部 Java 代码中使用 MOA。在 Java 应用程序中使用 MOA 的生成器、方法和任务非常容易。在本章中，我们将展示如何使用 MOA\
  \ API 并在程序中包含流式机器学习功能。我们假设读者具备基本的 Java 和面向对象编程知识。\n\n#### 14.1 MOA 对象\n\nMOA API\
  \ 提供的基本对象包括：\n\n*   **Task（任务）**：MOA 中的所有任务都遵循此接口。所有将结果写入文件的任务必须扩展 `MainTask` 并实现\
  \ `doMainTask` 方法。\n*   **InstanceStream（实例流）**：MOA 中使用的流使用此接口。要使用流，请调用 `prepareForUse`\
  \ 进行准备，然后调用 `nextInstance` 从流中获取每个新实例。\n*   **Classifier（分类器）**：分类器应扩展 `AbstractClassifier`。要使用分类器，首先调用\
  \ `prepareForUse` 进行准备，然后使用 `trainOnInstance` 通过新实例训练模型，或使用 `getVotesForInstance`\
  \ 获取实例的分类预测。\n\n#### 14.2 选项\n\n\n\n##### MOA 类与选项处理\n\n带有参数或选项的 MOA 类必须继承 `AbstractOptionHandler`\
  \ 类。这些选项可以是以下类型：\n\n*   **Integer**：`IntOption` (name, char, purpose, default Value,\
  \ min Value, max Value)\n*   **Float**：`FloatOption` (name, char, purpose, default\
  \ Value, min Value, max Value)\n*   **Flag**：`FlagOption` (name, char, purpose)\n\
  *   **File**：`FileOption` (name, char, purpose, default File name, default File\
  \ extension, Output)\n*   **String**：`StringOption` (name, char, purpose, default\
  \ Value)\n*   **Multichoice**：`MultichoiceOption` (name, char, purpose, option labels,\
  \ option descriptions, default option index)\n*   **Class**：`ClassOption` (name,\
  \ char, purpose, required type, default CLI string)\n*   **List**：`ListOption` (name,\
  \ char, purpose, expected option type, default list, separator char)\n\n以下是一些定义为\
  \ Java 类的选项示例：\n\n**Listing 14.1: 带有默认值的选项类定义。**\n\n```java\npublic IntOption gracePeriodOption\
  \ = new\nIntOption(\n    \"gracePeriod\",\n    'g',\n    \"The number of instances\
  \ a leaf should observe between split attempts.\",\n    200, 0, Integer.MAX_VALUE);\n\
  \npublic ClassOption splitCriterionOption = new\nClassOption(\"splitCriterion\"\
  ,\n    's', \"Split criterion to use.\",\n    SplitCriterion.class,\n    \"InfoGainSplitCriterion\"\
  );\n\npublic FloatOption splitConfidenceOption = new\nFloatOption(\n    \"splitConfidence\"\
  ,\n    'c',\n    \"The allowable error in split decision, values closer to 0 will\
  \ take longer to decide.\",\n    0.0000001, 0.0, 1.0);\n\npublic FlagOption binarySplitsOption\
  \ = new\nFlagOption(\"binarySplits\", 'b',\n    \"Only allow binary splits.\");\n\
  \npublic FileOption dumpFileOption = new\nFileOption(\"dumpFile\", 'd',\n    \"\
  File to append intermediate csv results to.\", null, \"csv\", true);\n\npublic StringOption\
  \ xTitleOption = new\nStringOption(\"xTitle\", 'm',\n    \"Title of the plots’ x-axis.\"\
  ,\n    \"Processed instances\");\n```\n\n要通过 API 从 Java 源代码更改这些选项的值，有两种可能性：\n\n\
  *   `setValueViaCLIString(String s)`：通过文本设置此选项的值，该文本可以包含多个嵌套参数，类似于 CLI 文本。\n*  \
  \ 每个选项都有特定的方法来更改其值：\n    *   **Integer**：`setValue(int v)`\n    *   **Float**：`setValue(double\
  \ v)`\n    *   **Flag**：`setValue(boolean v)`\n    *   **File**：`setValue(String\
  \ v)`\n    *   **String**：`setValue(String v)`\n    *   **Multichoice**：`setChosenIndex(int\
  \ index)`\n    *   **Class**：`setCurrentObject(Object obj)`\n    *   **List**：`setList(Option[]\
  \ optList)`\n\n获取这些选项值也有两种方式：\n\n*   `getValueAsCLIString()`：获取描述此选项嵌套参数的文本。\n*\
  \   每个选项都有特定的方法来获取其值：\n    *   **Integer**：`getValue()`\n    *   **Float**：`getValue()`\n\
  \    *   **Flag**：`isSet()`\n    *   **File**：`getFile()`\n    *   **String**：`getValue()`\n\
  \    *   **Multichoice**：`getChosenIndex()`\n    *   **Class**：`getPreparedClassOption(ClassOption\
  \ classOption)`\n    *   **List**：`getList()`\n\n#### 14.3 预测评估示例\n\n作为示例，我们将编写\
  \ Java 代码来执行预测评估。\n\n我们首先初始化将从中读取实例的数据流。在本例中，我们将使用第 12.2.2 节中解释的 `RandomRBFGenerator`。\n\
  \n**Listing 14.2: 流初始化的 Java 代码。**\n\n```java\nRandomRBFGenerator stream = new\n\
  RandomRBFGenerator();\nstream.prepareForUse();\n```\n\n现在我们必须构建一个空的学习器。我们创建一个霍夫丁树，并使用\
  \ `setModelContext` 告诉它实例属性的信息。\n\n**Listing 14.3: 学习器初始化的 Java 代码。**\n\n```java\n\
  Classifier learner = new HoeffdingTree();\nlearner.setModelContext(stream.getHeader());\n\
  learner.prepareForUse();\n```\n\n要执行预测评估，我们必须先测试然后在流中的每个实例上训练。同时，我们保留一些准确率统计数据以便计算最终的准确率值。\n\
  \n**Listing 14.4: 预测评估的 Java 代码。**\n\n```java\nint numInstances = 10000;\nint numberSamplesCorrect\
  \ = 0;\nint numberSamples = 0;\nboolean isTesting = true;\n\nwhile (stream.hasMoreInstances()\
  \ &&\n       numberSamples < numInstances) {\n    Instance inst = stream.nextInstance().getData();\n\
  \    if (isTesting) {\n        if (learner.correctlyClassifies(inst)) {\n      \
  \      numberSamplesCorrect++;\n        }\n    }\n    numberSamples++;\n    learner.trainOnInstance(inst);\n\
  }\n```\n\n最后，我们输出评估结果。在我们的例子中，我们关注准确率，因此打印该设置下霍夫丁树的最终预测准确率。\n\n**Listing 14.5: 输出结果的\
  \ Java 代码。**\n\n```java\ndouble accuracy = 100.0 * (double)\n    numberSamplesCorrect\
  \ / (double) numberSamples;\nSystem.out.println(numberSamples + \" instances processed\
  \ with \" + accuracy + \"% accuracy\");\n```\n\n完整的评估方法 Java 代码如下：\n\n**Listing\
  \ 14.6: 完整的 Java 代码。**\n\n```java\nRandomRBFGenerator stream = new\nRandomRBFGenerator();\n\
  stream.prepareForUse();\n\nClassifier learner = new HoeffdingTree();\nlearner.setModelContext(stream.getHeader());\n\
  learner.prepareForUse();\n\nint numInstances = 10000;\nint numberSamplesCorrect\
  \ = 0;\nint numberSamples = 0;\nboolean isTesting = true;\n\nwhile (stream.hasMoreInstances()\
  \ &&\n       numberSamples < numInstances) {\n    Instance inst = stream.nextInstance().getData();\n\
  \    if (isTesting) {\n        if (learner.correctlyClassifies(inst)) {\n      \
  \      numberSamplesCorrect++;\n        }\n    }\n    numberSamples++;\n    learner.trainOnInstance(inst);\n\
  }\n\ndouble accuracy = 100.0 * (double)\n    numberSamplesCorrect / (double) numberSamples;\n\
  System.out.println(numberSamples + \" instances processed with \" + accuracy + \"\
  % accuracy\");\n```\n\n### 15 在 MOA 中开发新方法\n\n在某些情况下，开发扩展 MOA 功能的新方法很有用。在本章中，我们介绍\
  \ MOA 中一些最流行对象的结构，并展示如何实现新对象。本章需要对 Java 中的数据结构有良好的理解。\n\n#### 15.1 MOA 中的主要类\n\n\
  MOA 中的所有对象都应实现 `MOAObject` 接口并继承 `AbstractMOAObject` 抽象类。要在 Java 中创建一个需要配置选项的新类，需要继承\
  \ `AbstractOptionHandler` 抽象类。MOA 选项非常灵活，并且由于它们可以是递归的，因此可以将具有选项的对象本身定义为选项。例如，这是一个具有不同于默认选项的霍夫丁树分类器的规范：\n\
  \n```\nmoa.classifiers.trees.HoeffdingTree\n-n (VFMLNumericAttributeClassObserver\
  \ -n 20)\n-g 300 -s GiniSplitCriterion -t 0.04 -l MC\n```\n\n在该示例中，我们选择 `VFMLNumericAttributeClassObserver`\
  \ 对象作为数值属性类观察器，它有 20 个箱。我们将数字 20 作为选项传递给该类。注意选项是递归的，并且可以包含大量 Java 类。\n\nMOA 中的主要学习器接口有：\n\
  \n*   **Classifier**：该接口由分类器和回归器使用。分类器通常继承 `AbstractClassifier` 抽象类，并实现以下三个方法：\n\
  \    *   `resetLearningImpl`：重置或初始化分类器\n    *   `trainOnInstanceImpl`：使用新实例更新学习器\n\
  \    *   `getVotesForInstance`：从学习器获得预测\n\n    `AbstractClassifier` 抽象类包含以下两个用于\
  \ API 的方法：\n    *   `prepareForUse`：调用 `resetLearningImpl` 以准备分类器\n    *   `trainOnInstance`：使用\
  \ `trainOnInstanceImpl` 通过新实例训练学习器\n\n*   **Regressor**：回归方法实现此接口并继承 `AbstractClassifier`\
  \ 抽象类。分类和回归的区别在于，对于分类，`getVotesForInstance` 返回一个包含每个类估计预测值的数组，而对于回归，`getVotesForInstance`\
  \ 返回一个长度为 1 的数组，包含预测结果。\n\n\n\n*   **Clusterer（聚类器）**：此接口由聚类器和离群点检测器使用。聚类器继承 `AbstractClusterer`\
  \ 抽象类，并实现以下方法：\n    *   `resetLearningImpl()`：用于重置或初始化聚类器\n    *   `trainOnInstanceImpl()`：用于使用新实例更新聚类器\n\
  \    *   `getClustering()`：用于获取聚类器计算出的聚类点\n*   **OutlierDetector（离群点检测器）**：与聚类器类似，但专门设计用于离群点检测。\n\
  \n#### 15.2 创建新分类器\n\n为了演示系统中学习算法的实现和使用，我们展示并解释了一个简单决策树桩分类器的 Java 代码。该分类器监控在每个属性上分割时的类别信息增益，并选择使该值最大化的属性。该决策会被多次重新审视，因此随着更多示例的出现，树桩有可能随时间改变。实际上，如果流分布没有变化，在充分训练后它不太可能再发生改变。\n\
  \n为了描述实现细节，我们依次讨论相关代码片段，完整代码列在最后（清单 15.7）。片段中的行号指的是最终清单中的行号。\n\n编写分类器的一种简单方法是继承\
  \ `moa.classifiers.AbstractClassifier` 类（第 10 行），它将处理某些细节以简化任务。\n\n##### 清单 15.1：选项处理\n\
  \n![](img/pg229-1.png)\n\n要设置分类器的公共接口，必须指定可供用户使用的选项。为了让系统自动处理选项，这些选项需要作为类的公共成员，并继承\
  \ `moa.options.Option` 类型，如清单 15.1 所示。\n\n示例分类器——决策树桩——有三个选项，每个类型不同。用于构建选项的前三个参数的含义在不同选项类型之间是一致的。第一个参数是用于标识选项的短名称。第二个是用于命令行的字符，应当唯一——命令行字符不能在不同选项间重复，否则会抛出异常。第三个标准参数是描述选项用途的字符串。选项构造函数的额外参数允许指定附加信息，如默认值或值的有效范围。\n\
  \n决策树桩分类器指定的第一个选项是“宽限期”。该选项用整数表示，因此类型为 `IntOption`。该参数控制从示例流学习时重新考虑最佳树桩的频率。这提高了分类器的效率——在每个单独示例后评估代价高昂，且单个示例不太可能改变当前最佳树桩的选择。默认值\
  \ 1,000 意味着树桩的选择仅每 1,000 个示例重新评估一次。最后两个参数指定选项允许的值范围——负的宽限期没有意义，因此范围限制为大于或等于 0 的整数。\n\
  \n第二个选项是一个标志，即二元开关，由 `FlagOption` 表示。默认情况下所有标志均关闭，仅在用户请求时开启。此标志控制决策树桩是否仅允许二向分裂。默认情况下树桩允许有两个以上的分支。\n\
  \n第三个选项确定用于决定哪个树桩最佳的分裂准则。这是一个 `ClassOption`，需要特定的 `SplitCriterion` 类型 Java 类。如果所需类恰好是\
  \ `OptionHandler`，则这些选项将用于配置传入的对象。\n\n##### 清单 15.2：杂项字段\n\n![](img/pg230-1.png)\n\
  \n清单 15.2 中使用了四个全局变量来维护分类器的状态：\n\n*   `bestSplit` 字段维护分类器当前选择的树桩。其类型为 `AttributeSplitSuggestion`，该类用于将实例分割成不同子集。\n\
  *   `observedClassDistribution` 字段记录分类器观察到的总体类别标签分布。其类型为 `DoubleVector`，这是一个方便的类，用于维护浮点值向量而无需管理其大小。\n\
  *   `attributeObservers` 字段存储 `AttributeClassObservers` 的集合，每个属性对应一个。这是决定以哪个属性作为树桩基础所需的信息。\n\
  *   `weightSeenAtLastSplit` 字段记录上次执行评估的时间，以便分类器根据宽限期参数确定何时进行下一次评估。\n\n`isRandomizable()`\
  \ 函数需实现以指定分类器是否包含随机性。如果包含，将自动设置为接受随机种子。此分类器不包含随机性，因此返回 `false`。\n\n##### 清单 15.3：学习准备\n\
  \n![](img/pg231-1.png)\n\n清单 15.3 中的 `resetLearningImpl()` 函数在学习开始前调用，因此应在未提供任何信息、未见任何训练示例时设置默认状态。在此例中，四个全局字段均设置为合理的默认值。\n\
  \n##### 清单 15.4：示例训练\n\n![](img/pg231-2.png)\n\n清单 15.4 中的 `trainOnInstanceImpl()`\
  \ 函数是学习算法的主函数，针对流中的每个训练示例调用。第一步（第 47-48 行）更新总体记录的类别分布。第 49-59 行的循环针对数据中的每个属性重复。如果某属性此前未见过观测值，则第\
  \ 53-55 行创建新的观测对象。第 57-58 行使用新示例的值更新观测。第 60-61 行检查宽限期是否已过。如果是，则重新评估最佳分裂。\n\n#####\
  \ 清单 15.5：训练期间使用的函数\n\n![](img/pg232-1.png)\n\n清单 15.5 中的函数协助训练算法。`newNominalClassObserver()`\
  \ 和 `newNumericClassObserver()` 类分别负责为名义属性和数值属性创建新的观测对象。`findBestSplit()` 函数将遍历可能的树桩，并返回“优度”得分最高的那个。\n\
  \n##### 清单 15.6：预测未知示例的类别\n\n![](img/pg233-1.png)\n\n清单 15.6 中的 `getVotesForInstance()`\
  \ 函数是分类器除训练外的另一个重要功能——利用已诱导的模型预测新示例的类别。对于决策树桩，这涉及调用 `branchForInstance()` 和 `resultingClassDistributionFromSplit()`\
  \ 函数，它们由 `AttributeSplitSuggestion` 类实现。\n\n将所有元素整合在一起，教程类的完整清单如下。\n\n##### 清单 15.7：完整清单\n\
  \n![](img/pg234-1.png)![](img/pg235-1.png)![](img/pg236-1.png)\n\n#### 15.3 编译分类器\n\
  \n假设以下文件位于当前工作目录中：\n\n*   `DecisionStumpTutorial.java`\n*   `moa.jar`\n*   `sizeofag.jar`\n\
  \n示例源代码可使用以下命令编译：\n\n```\njavac -cp moa.jar DecisionStumpTutorial.java\n```\n\n\
  此命令生成名为 `DecisionStumpTutorial.class` 的已编译 Java 类文件。\n\n继续之前，请注意以下命令设置目录结构以反映包结构：\n\
  \n```\nmkdir moa\nmkdir moa/classifiers\ncp DecisionStumpTutorial.class moa/classifiers/\n\
  ```\n\n类现已准备就绪，可供使用。\n\n#### 15.4 MOA 中的良好编程实践\n\n我们建议在 MOA 中开发方法时遵循以下 Java 编程良好实践：\n\
  \n*   构建新学习器或任务时，为添加新策略或行为，请使用类选项。请遵循以下步骤：\n    1.  为该策略创建一个新接口。\n\n\n\n\n#####\
  \ 策略模式实施步骤\n\n2. 创建实现该新接口的不同策略类。\n\n3. 添加类选项，以便用户可以从 GUI 或命令行中选择要使用的策略。\n\n#####\
  \ 编程最佳实践\n\n* 尽量减小变量的作用域。\n* 优先使用组合而非继承。\n* 优先使用静态成员类而非非静态成员类。\n* 尽量减小类和成员的访问权限。\n\
  * 通过接口引用对象。\n* 使用构建器代替参数过多的构造函数。\n\nBloch 编写的书籍 *Effective Java* [45] 是掌握 Java 编程最佳实践的优秀参考资料。\n\
