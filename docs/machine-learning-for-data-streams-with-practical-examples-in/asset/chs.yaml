  \n**图 3.7**\n\n练习 3.4，比较三种不同的分类器。\n\n#### 3.3 使用命令行\n\n使用命令行的一个简便方法是复制并粘贴 GUI 中\
  \ `Configure` 行的文本。例如，假设我们想从命令行执行任务\n\n```\nEvaluatePrequential -l trees.HoeffdingTree\
  \ -i 1000000 -w 10000\n```\n\n我们可以简单地写成\n\n```\njava -cp moa.jar -javaagent:sizeofag.jar\
  \ moa.DoTask\n\"EvaluatePrequential -l trees.HoeffdingTree -i 1000000 -w 10000\"\
  \n```\n\n注意某些参数缺失，因此将使用默认值。我们将在以下段落中解释该行命令。\n\n类 `moa.DoTask` 是在命令行运行任务的主类。它将接受一个任务名称及其相应的任何参数。第一个使用的任务是\
  \ `LearnModel` 任务。`-l` 参数指定学习器，本例中为 `HoeffdingTree` 类。`-s` 参数指定学习所用的流，本例中为 `generators.WaveformGenerator`，这是一个数据流生成器，产生一个识别三种波形类型的三分类学习问题。`-m`\
  \ 选项指定用于训练学习器的最大示例数，本例中为 1,000,000 个示例。`-O` 选项指定一个文件以输出结果模型：\n\n```\njava -cp moa.jar\
  \ -javaagent:sizeofag.jar moa.DoTask\nLearnModel -l trees.HoeffdingTree\n-s generators.WaveformGenerator\
  \ -m 1000000 -O model1.moa\n```\n\n这将创建一个名为 `model1.moa` 的文件，其中包含训练期间生成的决策树模型。\n\
  \n下一个示例将评估该模型，以查看其在使用不同随机种子生成的示例集上的准确率。`EvaluateModel` 任务获得加载上一步生成的模型、生成随机种子为 2\
  \ 的新波形流、并在 1,000,000 个示例上测试所需的参数：\n\n```\njava -cp moa.jar -javaagent:sizeofag.jar\
  \ moa.DoTask\n\"EvaluateModel -m file:model1.moa\n-s (generators.WaveformGenerator\
  \ -i 2) -i 1000000\"\n```\n\n注意我们正在使用括号嵌套参数。任务描述外加了引号，否则操作系统可能会对括号的含义感到困惑。\n\n评估后显示以下统计信息：\n\
  \n```\nclassified instances = 1,000,000\nclassifications correct (percent) = 84.474\n\
  Kappa Statistic (percent) = 76.711\n```\n\n请注意，上述两步可以合二为一，避免创建外部文件，如下所示：\n\n```\n\
  java -cp moa.jar -javaagent:sizeofag.jar moa.DoTask\n\"EvaluateModel -m (LearnModel\
  \ -l trees.HoeffdingTree\n-s generators.WaveformGenerator -m 1000000)\n-s (generators.WaveformGenerator\
  \ -i 2) -i 1000000\"\n```\n\n任务 `EvaluatePeriodicHeldOutTest` 将在周期性间隔使用保留测试集拍摄性能快照的同时训练模型。以下命令创建一个*逗号分隔值*\
  \ (CSV) 文件，在 `WaveformGenerator` 数据上训练 `HoeffdingTree` 分类器，使用前 100,000 个示例进行测试，总共训练\
  \ 100,000,000 个示例，并每 1,000,000 个示例测试一次：\n\n```\njava -cp moa.jar -javaagent:sizeofag.jar\
  \ moa.DoTask\n\"EvaluatePeriodicHeldOutTest -l trees.HoeffdingTree\n-s generators.WaveformGenerator\n\
  -n 100000 -i 10000000 -f 1000000\" > dsresult.csv\n```\n\n这些是我们如何从命令行使用 MOA 的示例。在本书第二部分中，我们将讨论此处出现的分类器。在第三部分中，我们将解释此处使用的生成器，并了解如何从用\
  \ Java 编写的源代码中使用 MOA API。\n\n### 第二部分：流挖掘\n\n#### 4 流与素描\n\n流可以被视为数据的一次性读取序列。流上的算法必须在我们称为*数据流公理*的条件下工作，这些公理已在第二章中说明：\n\
  \n1.  只允许对流进行一次遍历；每个流项目只能被观察一次。\n2.  每个项目的处理时间必须很低。\n3.  内存使用也必须很低，当然要低于流长度的亚线性级别；这意味着只能显式存储少量流项目。\n\
  4.  算法必须能够随时提供答案。\n5.  流随时间演化，即它们是非平稳数据源。\n\n本章关注的是满足前四条公理的算法设计。我们对流、生成流项目的过程或其可能遵守的任何统计规律*不做任何概率假设*。流是*对抗性*生成的，即遵循对算法最困难的模式。因此，公理\
  \ 5 在本章中无关紧要。相比之下，在第五章中，我们将定义一种更良性的流生成模型，其中项目根据某个随机过程生成，因此遵守统计规律。这一假设让我们能够形式化公理\
  \ 5，且隐含在大多数可用的流机器学习和数据挖掘算法中。\n\n许多流问题的解决方案都使用流*素描*或*摘要*的概念。素描是一种数据结构及其伴随算法，它们读取流并存储足够的信息，以便能够回答关于流的一个或多个预定义查询。我们将把素描视为流上高层学习和挖掘算法的构建模块。从这个角度来看，使用少量内存的要求尤为迫切，因为挖掘算法通常不会创建单个素描，而是创建许多素描，以同时跟踪数据上的许多不同统计量。\n\
  \n##### 4.1 设置：近似算法\n\n\n\n###### 符号与预备知识\n\n我们首先确定本书其余部分将使用的一些符号。我们用 `E[X]` 和 `Var(X)`\
  \ 分别表示随机变量 `X` 的期望值和方差。不带下标的对数表示以 2 为底的对数，而 `ln` 表示自然对数。如果存在常数 `c > 0` 使得对每个 `x`\
  \ 都有 `f(x) ≤ c · g(x)`，则称函数 `f` 为 `O(g)`。集合 `A` 的基数记为 `|A|`。在伪代码中，`←` 表示变量赋值，`⊳`\
  \ 开启注释行。\n\n在流处理中，*项* 仅仅是项的全集 `I` 中的一个元素，不包含任何相关的内部结构。集合 `I` 可能非常大，这意味着使用与 `|I|`\
  \ 成正比的内存是不可行的。我们有时会假设存储 `I` 的一个元素占用一单位内存；当 `I` 是无限集时（例如实数集），这是必要的。在其他情况下，我们将更详细地计算存储一个项所需的比特数，这至少为\
  \ `log |I|`。\n\n我们通过给出三个操作来定义一个 *草图* 算法：一个 `Init(...)` 操作用于初始化数据结构，可能带有一些参数，如所需的近似精度或要使用的内存量；一个\
  \ `Update(item)` 操作将应用于流上的每个项；以及一个 `Query(...)` 操作返回迄今为止已读流上某个感兴趣函数的当前值（可能带有参数，也可能不带）。通常，一个草图可能实现多种类型的查询。\n\
  \n许多可以在离线数据上轻松计算的函数，无法在亚线性内存下 *精确* 计算流上的结果。例如，在最坏情况和足够大的项全集下，计算所见不同项的数量需要与流长度成线性关系的内存。另一方面，对于许多函数，存在提供\
  \ *近似* 解的算法，仅以很小的精度损失换取内存和时间的巨大提升，这在应用中通常是可以接受的。接下来我们引入一些形式化方法来讨论近似计算。\n\n设 `f`\
  \ 和 `g` 为两个实值函数。我们将 `g` 视为 `f` 的近似。对于一个 *精度* 值 `ε`，我们称 `g` 为\n\n*   `f` 的 *绝对* 或\
  \ *加性* `ε`-近似，如果对每个输入 `x` 都有 `|f(x) − g(x)| ≤ ε`；\n*   `f` 的 *相对* 或 *乘性* `ε`-近似，如果对每个输入\
  \ `x` 都有 `|f(x) − g(x)| ≤ ε |f(x)|`。\n\n流上的许多近似算法也是 *随机化* 的，意味着它们可以访问随机比特或随机数源以做出选择。它们在固定输入上的输出不是唯一定义的，因为不同运行可能产生不同结果。因此，其输出应被视为一个\
  \ *随机变量 g*，希望它在大多数情况下接近期望的 `f`。*(ε, δ)*-近似（绝对或相对）的定义类似于上述的 `ε`-近似，但只要求上述近似以至少 `1\
  \ − δ` 的概率（在算法的多次运行中）成立，而非在每一次运行中都成立。例如，要说算法的输出 `g` 是期望函数 `f` 的绝对 `(0.1, 0.01)`-近似，我们要求对每个\
  \ `x`，`g(x)` 至少在 99% 的运行中落在 `f(x)` 的 `±0.1` 范围内。值 `1 − δ` 通常称为 *置信度*。\n\n该框架类似于用于形式化预测学习问题的\
  \ PAC 学习模型 [146]，其中 PAC 代表“概率近似正确”。应注意，通常近似保证仅在更新和查询不依赖于先前查询返回的答案时成立。也就是说，我们不能将这些保证应用于\
  \ *自适应查询*，后者在探索性数据分析中很常见。\n\n在统计学中，近似描述随机变量 `X` 的传统方法是给出其期望值 `E[X]` 和方差 `Var(X)`。假设我们有一个随机化算法\
  \ `g` 近似期望函数 `f`，即 `E[g(x)] = f(x)` 且方差 `Var(g) = σ²`。在这种情况下，我们可以在 `g` 的基础上设计另一个算法\
  \ `h`，使其在看似更严格的 *(ε, δ)*-近似意义上近似 `f`。新算法 `h` 除 `x` 外，还接受任意 `ε` 和 `δ` 作为参数，并使用 `O((σ²/ε²)\
  \ ln(1/δ))` 倍于 `f` 的内存和运行时间。正如预期的那样，随着所需精度和置信度的提高，它消耗更多资源。转换的细节见第 4.9.2 节，但我们接下来描述主要成分，因为它在流算法和流挖掘中无处不在。\n\
  \n##### 4.2 浓度不等式\n\n在处理流时，算法通常需要根据已见信息做出决策，例如决定输出值或在有限选项中选择。如果决策必须基于累积统计量，那么一种建立不期望事件发生可能性的方法将是一个有用的工具。换句话说，可以问：如果我此时对正在构建的模型做出决策，从长远来看我犯错的概率是多少？这种决策高度依赖于浓度不等式。\n\
  \n陈述随机变量以高概率集中在均值附近的不等式称为 *浓度不等式* 或 *大偏差界*。它们也可以被视为为变量提供 *置信界*。一个例子是经典概率论中的大数定律，或三西格玛法则，该法则指出对于正态分布，几乎所有（99.73%）的概率质量都位于均值附近三个标准差范围内。\n\
  \n最基本的浓度不等式是 *马尔可夫不等式*，它指出对于任意非负随机变量 `X` 和 `t > 0`，\n\n```\n![](img/pg38-1.png)\n\
  ```\n\n*切比雪夫不等式* 是马尔可夫不等式的一个应用，它指出对于任意非负随机变量 `X` 和 `t > 0`，\n\n```\n![](img/pg38-2.png)\n\
  ```\n\n通常，我们希望通过对 `X` 的多个副本取平均来估计 `E[X]`。随着副本数量的增长，平均值（一种特殊的随机变量）收敛到其期望的速度比切比雪夫不等式所述要快得多。对于任意\
  \ `n`，定义\n\n```\n![](img/pg38-in-1.png)\n```\n\n其中 `X[1], …, X[n]` 是取值在 `[0, 1]`\
  \ 且 `E[X] = p` 的独立变量。则：\n\n1.  **切尔诺夫界：** 对所有 `ε ∈ (0, 1)`，\n\n    ```\n    ![](img/pg38-3.png)\n\
  \    ```\n\n2.  **霍夫丁界：** 对所有 `ε > 0`，\n\n    ```\n    ![](img/pg38-4.png)\n   \
  \ ```\n\n3.  **正态近似：** 如果在一次 `X[1], …, X[n]` 的抽样中我们得到\n\n    ```\n    ![](img/pg38-in-2.png)\n\
  \    ```\n\n    那么\n\n    ```\n    ![](img/pg38-in-3.png)\n    ```\n\n    发生的概率约为\n\
  \n    ```\n    ![](img/pg38-in-4.png)\n    ```\n\n    其中 `Φ(z)` 是均值为 0、标准差为 1 的正态分布变量小于\
  \ `z` 的概率。函数 `Φ(z)` 等于\n\n    ```\n    ![](img/pg38-in-5.png)\n    ```\n\n    其中\
  \ `erf` 是大多数编程语言中可用的误差函数。\n\n我们可以反向应用这些界，推导出偏离均值的程度与其概率之间的关系公式。例如，如果 `ε = ![](img/pg38-in-6.png)`，霍夫丁界给出\
  \ `Pr[ |X − p| > ε ] ≤ δ`。这对于获得加性 `(ε, δ)`-近似很有用。切尔诺夫界则给出乘性近似，但其缺点是界中提到了 `p = E[X]`，即我们想要估计的未知值；此外，它仅适用于\
  \ `ε < 1` 的情况。\n\n\n\n正态近似基于这样一个事实：当 `n` 趋向无穷大时，变量 `nX` 趋向于一个均值为 `pn`、标准差至多为 `sqrt(p(1-p)/n)`\
  \ 的正态分布；注意 0/1 值或伯努利变量是最坏情况，并精确导出了这个方差。这并不完全严谨，既因为 `n` 是有限的，也因为它交换了 `p` 和 `p_hat`\
  \ 的角色。然而，经验法则表明，当 `p_hat * n` 和 `(1 - p_hat) * n` 都大于约 30 时，该近似对于所有实际目的来说都足够正确，且比\
  \ Hoeffding 界和 Chernoff 界更紧，后者需要更大的 `n` 才能达到相同的不确定度 `ε`。因此，在大多数实际场景中它是首选，除非我们有兴趣严格证明算法性能方面的定理。\n\
  \n还有许多其他的不等式。例如，Bernstein 不等式利用变量 `X[i]` 的方差，将 Chernoff 和 Hoeffding 不等式都进行了推广（在常数因子范围内）。McDiarmid\
  \ 不等式适用于 `X[i]` 的和以外的函数，只要单个 `X[i]` 不会过多地决定该函数。其他不等式放宽了 `X[i]` 完全独立的条件。除了正态近似外，还有其他的近似界，例如\
  \ Agresti-Coull 界，它在 `p` 接近 0 或 1 且 `n` 较小时表现更好。\n\n在以下章节中，我们将详细探讨这些问题：\n\n*   采样\n\
  *   计数项与计数不同项\n*   频率问题\n*   滑动窗口内的计数\n*   合并分布式计算的草图\n\n为提高可读性，一些技术细节和参考文献推迟到第\
  \ 4.9 节讨论。\n\n##### 4.3 采样\n\n采样是处理流的一种显而易见的方法：对流中的每个项，以概率 `α` 处理它，以概率 `1 - α` 忽略它。\n\
  \n对于许多任务，包括学习和数据挖掘语境中的许多任务，我们可以通过在采样元素的 `α` 部分上计算函数，在降低计算成本的同时获得相当好的近似。但要警惕采样并非万能解，因为它在某些任务上表现不佳。例如，对于估计不同元素数量的问题，稀有元素可能完全被遗漏，其数量通常会被低估。\n\
  \n通常，我们希望减少待处理的项数，同时保持给定大小 `k` 的流的代表性样本。**水库采样**，由 Vitter [240] 提出，是一种实现此目的的简单高效技术。它在\
  \ 图 4.1 中展示。\n\n![图 4.1 水库采样草图。](img/Fig4-1.png)\n\n**图 4.1**\n\n水库采样草图。\n\n水库采样具有这样一个性质：无论迄今已读取了多少流元素\
  \ `t`，每个元素当前都在水库中，且概率相同，为 `k/t`。也就是说，它对早期元素和后期元素的偏向程度相同。要看出这是真的，可对 `t` 使用数学归纳法。在前\
  \ `t` 步之后（对于 `t ≤ k`），这显然成立。在稍后的时间 `t > k`，第 `t` 个流项在水库中的概率是 `k/t`，因为它以该概率被加入。对于编号为\
  \ `i` 的项（其中 `i < t`）要在水库中，必须满足：(1) 它在时刻 `t - 1` 时在水库中，根据归纳假设这发生的概率为 `k/(t - 1)`；(2)\
  \ 第 `t` 个项*不*被选中（概率 `k/t`）*且*被放置在水库中第 `i` 项所在的位置（概率 `1/k`）的事件*不*发生。所有这些按期望发生的概率为\n\
  \n```\nk/(t-1) * (1 - k/t * 1/k) = k/t\n```\n\n一种称为**跳跃计数**的变体，在处理一项的时间超过项到达间隔时效果更好。其思路是在时刻\
  \ `t` 随机选择下一个将被纳入样本的项的索引 `t' > t`，并跳过它之前的所有记录而无需计算——特别是无需相对昂贵的随机数生成。给定 `t` 和 `k`\
  \ 随机选择 `t'` 的规则可以推导出来，使该方法的输出在概率上与水库采样完全相同 [240]。\n\n##### 4.4 计数总项数\n\n计数迄今已见的总项数，或许是人们能在流上想象出的最基本问题。平凡的解法维护一个标准整数计数器，更新操作只是将计数器加一。典型编程语言用固定位数实现整数，如\
  \ 16、32 或 64 位，这至少应为 `log t` 才能计数到 `t`。\n\n一种更节省的解法是 **Morris 近似计数器** [183]。它是一种随机近似计数器，使用\
  \ `log log t` 位而非 `log t` 位即可计数到 `t`。这意味着它可以用 `log log 10⁹ = 5` 位计数到 10⁹，用 6 位计数到任何实际的项数。当然，代价是计数只是近似的。\n\
  \n最初的想法是使用我们之前描述的均匀采样：固定某个是 2 的幂的概率 `p`，设为 `2^(-k)`。像以前一样使用整数计数器 `c`，但在收到一项时，以概率\
  \ `p` 增加计数器，以概率 `1 - p` 什么都不做。现在，`t` 项后 `c` 的期望值是 `pt`，所以 `c/p` 应该是 `t` 的一个良好近似。草图使用\
  \ `log(pt) = log t - k` 位而不是 `log t` 位；例如，当 `p = 1/8` 时，节省 3 位。不过，由于 `c` 在 `pt`\
  \ 周围的随机波动，返回值将不准确。\n\nMorris 简单而巧妙的想法是：不预先固定 `k` 并计数到 `2^k`，而是用 `c` 代替 `k`。算法如 图\
  \ 4.2 所示；注意它没有提及 `k`。\n\n![图 4.2 Morris 近似计数算法。](img/Fig4-2.png)\n\n**图 4.2**\n\n\
  Morris 近似计数算法。\n\n更精确地说，可以证明 [103] 在读取 `t` 个流元素后，`2^c` 的期望值为 `t + 1`，方差为 `t(t -\
  \ 1)/2`。也就是说，它在期望下返回正确值，尽管方差较大。只需存储 `c` 的值，这使用 `log c ≃ log log t` 位，在 `Update`\
  \ 过程中仅额外保留一份 `c` 的副本。\n\n我们可以通过运行多个算法副本并取平均来减小方差。但在这种情况下，存在一种特设的更高效方法。直观上，`c` 大约每在\
  \ `t` 翻倍时增加一次——这就是为什么 `t ≃ 2^c`；草图在概率上将 `t` 放入形如 `(2^c, 2^(c+1))` 的区间中。如果我们将算法中的\
  \ 2 替换为较小的底数 `b < 2`，直观上我们将分辨率提高到形如 `(b^c, b^(c+1))` 的更细区间。可以证明 [103] `b^c` 的期望值为\
  \ `(b - 1)t + 1`，方差为 `(b - 1)t(t - 1)/2`。所需位数大致为 `log c = log log t - log log b`。例如，取\
  \ `b = 1.08`，我们可以用 1 字节内存计数到 `t ≃ 10⁹`，标准差为 `0.2t`。\n\n作为应用示例，Van Durme 和 Lall [94]\
  \ 通过使用 Morris 计数器的一个变体，解决了在大型文本语料库中估计 `k`-gram 频率的问题。即使对于中等 `k` 值，出现的 `k`-gram 数量也可能巨大，且为求速度必须保存在内存中，因此为每个计数器使用尽可能少的位至关重要。\n\
  \n##### 4.5 计数不同元素\n\n\n\n##### 4.5 不同元素计数\n\n一个更具挑战性的问题是计算迄今为止在流中观察到的*不同*元素的数量（也有些不正确地称为*唯一*元素，也许是类比\
  \ Unix 的 `uniq` 命令）。困难在于，一个项目可能只出现一次，而另一个项目出现数百万次，但两者对不同元素计数的贡献相同，都是 1。\n\n作为动机，考虑计算互联网链路所见不同流（源-目的\
  \ IP 地址对）数量的问题。潜在项目的数量巨大：IPv6 地址为 64 位，因此有 $2^{128} \\simeq 10^{38}$ 个潜在项目，即地址对。直接的解决方案是保留某种关联表，如哈希表，并记录实际已见的地址对。对于繁忙链路，这可能很快变得太大而无法存储。幸运的是，我们通常可以用近似质量换取内存使用量。\n\
  \n###### 4.5.1 线性计数\n\n不同元素计数的几种方法都是经典 *Bloom filter*（布隆过滤器）思想的变体。作为示例，我们讨论 **LINEAR\
  \ COUNTING**（线性计数），由 Whang 等人 [246] 提出，如 图 4.3 所示。\n\n![图 4.3 LINEAR COUNTING 概要。](img/Fig4-3.png)\n\
  \n**图 4.3**\n\nLINEAR COUNTING 概要。\n\n初始化中的参数 $D$ 是流中不同元素数量 $d$ 的上界，即我们假设 $d \\\
  le D$。两个集合之间的*哈希函数*，直观上讲，将第一个集合中的每个元素 $x$ 映射到第二个集合中的一个“随机”元素。关于这究竟意味着什么，以及如何构建可用少量位存储的“足够好”的哈希函数的技术讨论留待第\
  \ 4.9.1 节。我们只说明，对于我们的目的足够随机且将 $\\{0,\\dots,m-1\\}$ 映射到自身的哈希函数，可以从 $O(\\log m)$ 个真正随机位获得，并用\
  \ $O(\\log m)$ 位存储。\n\n流中存在的每个项目都将表 $B$ 的一个条目设为 1，无论它出现多少次，设置的都是同一个条目。直观上，一个好的哈希函数确保流中出现的不同项目均匀地分配到\
  \ $B$ 的条目中。然后，`Query` 返回的期望值是流中见到的不同值的数量加上一个微小的偏差项，其标准差为 ![](img/pg44-in-1.png)。对于相当大的不同元素数量\
  \ ![](img/pg44-in-2.png)，这比 $d$ 本身小得多，这意味着 LINEAR COUNTING 在相对意义上将相当准确。\n\n######\
  \ 4.5.2 Cohen 的对数计数器\n\n**Cohen 计数器** [74] 基于这一思想，但利用以下观察转移到对数空间。$B$ 中两个连续 1 之间的平均间隔由流中\
  \ 1 位的数量决定，约为 $s/d$。这对于第一个间隔特别成立，等价地，对于第一个 1 的位置也是如此。方便的是，存储这个第一个位置只需 $\\log s$\
  \ 位，因为它是观察到的哈希函数值的最小值。概要如 图 4.4 所示。Cohen 计数器仅使用 $\\log D$ 位来存储 $p$。\n\n![图 4.4 Cohen\
  \ 计数算法。](img/Fig4-4.png)\n\n**图 4.4**\n\nCohen 计数算法。\n\n可以证明 $p$ 的期望值为 $D/d$，且 `Query`\
  \ 过程在期望下返回 $d$。其方差较大，约为 $(D/d)²$。可以通过并行运行多个副本并取平均值来减小方差，但这需要构建多个独立且“良好”的哈希函数，这是有问题的。一种使用单个哈希函数的替代方法将作为下一个概要的一部分呈现。\n\
  \n###### 4.5.3 Flajolet-Martin 计数器与 HyperLogLog\n\n一系列算法始于 Flajolet-Martin 计数器 [105]，终于\
  \ HyperLogLog [104]，能以更少的位实现相对近似 $\\epsilon$，即 $O((\\log \\log D)/\\epsilon²)$，外加存储哈希函数所需的空间。该方法的直觉如下：设\
  \ $D$ 为 $2^k$。在范围 $[0, 2^k - 1]$ 内不重复地均匀随机选择数字；这就是将良好的哈希函数应用于流项目后得到的结果。所有这些数字都可以用二进制的\
  \ $k$ 位表示；其中一半的第一位为 0，四分之一有两个前导 0，八分之一以 000 开头，依此类推。一般来说，前导模式 $0^i 1$ 出现的概率为 $2^{-(i+1)}$，因此如果\
  \ $0^i 1$ 是迄今为止哈希值中最长的此类模式，则我们可以预期 $d$ 约为 $2^{i+1}$。Durand 和 Flajolet [93] 在改进 Flajolet-Martin\
  \ 算法时意识到，只需记住 $k$，用 $\\log k = \\log \\log D$ 位，即可跟踪最长模式，即最大的 $i$。带有此改进的基本 Flajolet-Martin\
  \ 概率计数器以伪码形式给出在 图 4.5 中。\n\n![图 4.5 基本 Flajolet-Martin 概率计数器。](img/Fig4-5.png)\n\
  \n**图 4.5**\n\n基本 Flajolet-Martin 概率计数器。\n\n该方法需要一个哈希函数 $h$，将每个项目尽可能随机地转换为 0 到 $L\
  \ - 1$ 之间的整数。文献 [105] 表明，如果已读取 $d$ 个不同项目，$p$ 的期望值为 $\\log(0.77351 d)$，其标准差为 $1.12127\\\
  dots$。概要仅需存储 $p$ 的内存，其值最大为 $L = \\log D$，因此需要 $\\log \\log D$ 位。\n\n该方法的主要缺点是估计中的相对较大误差，数量级约为\
  \ $d$。如前所述，可以通过平均多个副本来减小误差。但这有两个问题：一是相应地增加了更新操作的计算时间。二是获取多个真正独立的哈希函数很难。\n\nFlajolet\
  \ 和 Martin 提出了一种他们称为*随机平均*的技术：概念上将流分成 $m = 2^b$ 个子流，每个子流馈送一个不同的计数器副本。对于每个项目 $x$，使用\
  \ $h(x)$ 的前 $b = \\log m$ 位来决定 $x$ 分配到哪个子流，并用 $h(x)$ 的其余 $m - \\log m$ 位来馈送相应的计数器。现在可以使用单个哈希函数，因为不同子流中的项目看到的是同一函数的独立部分，且更新时间本质上与单个计数器相同。内存使用仍乘以\
  \ $m$。\n\n上述算法的不同变体在于如何将 $m$ 个副本的结果组合成单一估计。\n\n*   **LogLog** [93] 返回其估计的几何平均数，即其变量\
  \ $p$ 的算术平均数的 2 的幂，乘以一个常数。\n*   **SuperLogLog** [93] 在执行上述操作前移除排名前 30% 的估计值；这减小了异常值的影响。\n\
  *   **HyperLogLog**，由 Flajolet 等人 [104] 提出，则返回 $m$ 个估计值的调和平均数，这同样能平滑较大的异常值。\n\n\
  上述变体实现的标准差分别为 $1.3d/\\sqrt{m}$、$1.05d/\\sqrt{m}$ 和 $1.04d/\\sqrt{m}$，并使用 $O(m \\\
  log \\log D)$ 内存，外加 $O(\\log D)$ 位存储可在所有计数器实例间共享的哈希函数。通过使用切比雪夫不等式，只要 $m = O(1/(\\\
  delta \\epsilon²))$，即可获得 $(\\epsilon, \\delta)$-近似；注意不清楚如何应用霍夫丁界，因为估计值不是平均值。换种说法，取\
  \ $\\epsilon = O(1/\\sqrt{m})$，我们使用 $O((\\log \\log D)/\\epsilon²)$ 位内存，即可为固定置信度实现相对近似\
  \ $\\epsilon$。\n\n用更具体的术语来说，根据 [104]，HyperLogLog 可以在 2% 误差内近似高达 $10⁹$ 的基数，仅使用 1.5\
  \ 千字节内存。关于 HyperLogLog 在大规模应用中的实际实现讨论，见 [134]。\n\n\n\n\n###### 4.5.4 应用：计算图中的距离函数\n\
  \n让我们提及 Flajolet-Martin 计数器的一个非流式应用，以说明流式算法有时可用于提高非流式问题的时间或内存效率。\n\nBoldi 等人 [47]\
  \ 在 [192] 的基础上改进，提出了 HyperANF 计数器，它使用 HyperLogLog 来近似图的*邻域函数 N*。对于节点 *v* 和距离 *d*，*N*(*v,d*)\
  \ 定义为从节点 *v* 出发，通过长度至多为 *d* 的路径可达的节点数量。该概率计数器允许在给定 *N*(*.,d*− 1) 值的情况下，以内存高效的方式近似计算\
  \ *N*(*.,d*)，并且只需对图的边进行一次顺序遍历，顺序为它们在磁盘上存储的任意顺序，即无需昂贵的磁盘随机访问。\n\n我们给出实现此目的的直观解释。第一个关键观察是：如果一个顶点要么通过长度至多为\
  \ *d* − 1 的路径从 *v* 可达，要么通过长度至多为 *d* − 1 的路径从顶点 *u* 可达（其中 (*v,u*) 是一条边），那么它就通过长度至多为\
  \ *d* 的路径从 *v* 可达。第二个关键观察是 HyperLogLog 计数器是可合并的，这是一个我们将在第 4.8 节探讨的概念。这意味着，给定两个 HyperLogLog\
  \ 计数器 *H*[*A*] 和 *H*[*B*]，它们分别由处理流 *A* 和 *B* 得到，存在一种方法获得一个新的 HyperLogLog 计数器 `merge(H[A],\
  \ H[B])`，它与处理 *A* 和 *B* 的拼接 *C* 所得到的计数器完全相同。也就是说，它包含 *C* 中不同项目的数量。然后，假设归纳地我们已经为每个顶点\
  \ *v* 计算了一个 HyperLogLog 计数器 *H**d*−1，它（近似地）计算距离 *v* 至多为 *d* − 1 的顶点数量，换句话说，近似 *N*(*v,d*\
  \ − 1)。然后按如下方式计算 *H**d*：\n\n1.  *H**d* ← *H**d*−1。\n2.  对每条边 (*v,u*)（按任意顺序）执行\n\n\
  ```\nHd ← merge(Hd, Hd-1)\n```\n\n根据上述第一个关键观察，显然如果计数是精确的，*H**d* 等于 *N*(*v,d*)；由于近似导致的误差原则上可能随着\
  \ *d* 的增加而累积和放大，但 [47] 中的实验并未显示这种效应。一旦计算出 *H*[*d*]，我们就可以丢弃 *H*[*d*−1] 计数器，并重用它们占用的空间。因此，我们可以用\
  \ *d* 次边数据库的顺序扫描和 *O*(*n*log log *n*) 内存来近似距离 *d* 以内的邻域函数。\n\n利用这一想法和大量巧妙的优化，Backstrom\
  \ 等人 [21] 能够解决 Facebook 图中距离的估计问题，该图的节点是 Facebook 用户，边是他们直接的好友关系。该图拥有 7.21 亿用户和\
  \ 690 亿条链接。值得注意的是，他们在单台机器上仅用几小时就完成了用户间平均距离的计算，结果为 4.74，对应 3.74 个中介或“分隔度”。非正式地说，这证实了\
  \ S. Milgram 在 1960 年代著名的实验 [177]，该实验使用实体信件和邮政服务，暗示当时世界上大多数人之间的分隔度不超过六度。\n\n[75]\
  \ 提供了大规模图中距离相关查询草图的统一视图。\n\n###### 4.5.5 讨论：对数 vs. 线性\n\n关于寻找不同元素算法的更多细节可参见 [176]，其中也提供了实证评估。它关注何时值得使用相对复杂的亚线性草图，而不是简单的线性计数。结论是，当需要极高精度时，例如低于\
  \ \U0001D716 = 10^(−4)，线性草图更可取。对数草图通常需要 *O*(1/*\U0001D716*²) 空间来实现乘法误差 \U0001D716\
  ，对于高精度要求来说，这确实可能很大。\n\n在数据挖掘和机器学习应用中，通常可以接受相对较大的近似误差，例如 \U0001D716 = 10^(−1) 以内，因为挖掘出的模型是许多统计量的组合，单个统计量本身都不太关键，而且无论如何数据都被视为现实的随机样本。因此，对数空间草图可能是一个有吸引力的选择。\n\
  \n还值得一提的是，[144] 给出了一种更复杂、渐近最优的计算不同元素算法，使用 *O*(\U0001D716^(−2) + log *d*) 位，即去除了\
  \ HyperLogLog 中的 log log *d* 因子。对于实际用途，HyperLogLog 似乎仍然更快且更小。\n\n##### 4.6 频率问题\n\
  \n在许多情况下，我们不仅仅想计算流中所有项目的总数，而是分别计算流中不同类型项目的数量。在一般情况下，用亚线性内存估计所有项目的频率是不可能的，但通常只需获得最高频项目的近似计数即可。\n\
  \n对于流的长度为 *t* 的初始片段，项目 *x* 的*绝对频率*是它在该片段中出现的次数，其*相对频率*是绝对频率除以 *t*。我们主要考虑以下问题表述：\n\
  \n**重击者问题。** 给定阈值 \U0001D716 和对流的访问权限，在从流中读取任意数量的项目后，生成*重击者*集合，即所有相对频率超过 \U0001D716\
  \ 的项目。\n\n该问题与数据库领域计算*冰山查询* [97] 的问题密切相关。一个基本观察是：相对频率高于 \U0001D716 的项目最多只能有 1/*\U0001D716\
  * 个；否则相对频率之和将超过 1，这是不可能的。\n\n重击者问题的一个初步近似解是使用采样；例如，使用水库采样从流中抽取均匀样本，并始终声明样本中的频繁元素就是流中的频繁元素。这是一个有效的算法，但要达到任何固定的置信度，所需的样本量与\
  \ 1/*\U0001D716*² 成正比。在本节中，我们将介绍三种重击者问题的算法，每种都有其自身的优势。第一种是基于计数器的确定性算法；另外两种基于哈希。\n\
  \n综述 [80, 164] 讨论并评估了我们将要介绍的算法及其他几种算法。\n\n在本节中，我们以字（word）为单位衡量内存，假设一个项目、整数、指针等简单变量适合存放在一个内存字中。\n\
  \n###### 4.6.1 SPACESAVING 草图\n\n基于计数器的算法历史上是 Boyer 和 Moore [50] 方法的演变，该方法用于在多数元素（频率至少为\
  \ 1/2 的元素）存在时找到它。Misra 和 Gries [179]、Demaine 等人 [86] 以及 Karp 等人 [145] 独立发现了该方法的一个改进版本。通常称为\
  \ FREQUENT，该方法仅用 *O*(1/*\U0001D716*) 内存就能找到一个保证包含所有 \U0001D716–重击者的元素列表。\n\nFREQUENT\
  \ 的一个缺点是它只提供重击者，而无法给出其频率的可靠估计，而频率估计通常很重要。其他提供频率近似值的基于计数器的草图包括 Lossy Counting 和 Sticky\
  \ Sampling，均由 Manku 和 Motwani [165, 166] 提出，以及 Space Saving，由 Metwally 等人 [175]\
  \ 提出。我们描述 Space Saving，据 [80, 161, 164] 报道，它在多种重击者算法中性能最好。此外，它简单直观，并对近似质量有严格的保证。\n\
  \n\n\n\n图 4.6 展示了 `SPACESAVING` 的伪代码。它在内存中维护一组至多 *k* 个（项目，计数）对，用前 *k* 个不同元素及其计数进行初始化。当新的流项目到达时，如果该项目在集合中已有条目，则其计数加\
  \ 1。如果没有，则该项目替换计数最低的项目，后者的计数随后加 1。非直观的部分在于，该项目继承了它所驱逐元素的计数，即使这是它的首次出现。然而，正如以下断言所示，误差永远不会太大，既不会让稀有元素看起来过于频繁，也不会让真正的重击者看起来过于不频繁。\n\
  \n![图 4.6 SPACESAVING 概略图。](img/Fig4-6.png)\n\n**图 4.6**\n\nSPACESAVING 概略图。\n\n\
  令 *f*[*t,x*] 为前 *t* 个流元素中项目 *x* 的绝对频率，若 *x* 在时刻 *t* 位于概略图中，令 *count**t* 为其关联的计数；当从上下文中清楚时，我们省略下标\
  \ *t*。以下对于每个项目 *x* 且在所有时间 *t* 均成立：\n\n1.  最小计数器 *min* 的值至多为 *t/k*。\n2.  若 *x* ∉\
  \ *S*，则 *f*[*x*] ≤ *min*。\n3.  若 *x* ∈ *S*，则 *f*[*x*] ≤ *count*(*x*) ≤ *f*[*x*]\
  \ + *min*。\n\n（1）和（2）蕴含了每个频率高于 *t/k* 的 *x* 都在 *S* 中，即概略图包含所有（1*/k*）重击者。（3）表明 *S*\
  \ 中元素的计数既不低估真实频率，也不高估超过 *t/k*。*t/k* 的值可视为最小分辨率：计数仅对远大于 *t/k* 的频率是良好的近似，而频率为 1 的项目可能刚进入概略图，其关联计数高达\
  \ *t/k*。\n\n文献 [175] 中提出的 `Stream-Summary` 数据结构实现了该概略图，确保了每次更新的摊还常数时间。对于概略图中存在的每个计数值\
  \ *c*，都会创建一个包含 *c* 以及指向所有具有计数 *c* 的项目的双向链表指针的桶。桶保存在一个按其值 *c* 排序的双向链表中。项目链表中的节点都包含指向其父桶的指针，还有一个哈希表，给定一个项目，可提供指向包含它的节点的指针。细节留作练习。\n\
  \n总而言之，取 *k* = ⌈1*/*\U0001D716⌉ 时，`SPACESAVING` 可找到所有 \U0001D716–重击者，其频率近似正确至 \U0001D716\
  ，使用 *O*(1*/*\U0001D716) 个内存字和常数摊还时间。\n\n`SPACESAVING`、`FREQUENT`、`Lossy Counting`\
  \ 和 `Sticky Sampling` 均为确定性算法；除哈希表内部可能用于搜索集合的哈希函数或随机化外，它们不使用哈希函数或随机化。很容易将 `SPACESAVING`\
  \ 适配为形式为 (*x,c*) 的更新，其中 *x* 为项目，*c* 为任意*正*权重，该对代表赋值 *f*[*x*] ← *f*[*x*] + *c*，对内存或更新时间无显著影响。但它无法模拟项目删除，或等价地，无法处理带*负*权重的更新。\n\
  \n###### 4.6.2 CM-Sketch 算法\n\n*Count-Min sketch*（计数-最小概略图）或 *CM-sketch* 由 Cormode\
  \ 和 Muthukrishnan [81] 提出，可用于解决与项目频率相关的多个问题，其中包括重击者问题。与 `FREQUENT` 和 `SPACESAVING`\
  \ 不同，它是概率性的，并大量使用随机哈希函数。对某些应用更重要的是，它能处理具有正负权重的更新，特别是项目的添加和减去。\n\n我们首先描述概略图能实现什么，然后是其实现。我们考虑形式为\
  \ (*x,c*) 的元素流，其中 *x* 为项目，*c* 为对 *f*[*x*] 的任意正或负权重更新。我们用 *F* 表示给定时刻的总权重 ![](img/pg51-in-1.png)。\n\
  \nCM-sketch 的创建函数接受两个参数：宽度 *w* 和深度 *d*。其更新函数接收如上所述的对 (*x,c*)。其 `Query` 函数以项目 *x*\
  \ 为参数，返回一个值 ![](img/pg52-in-1.png)，满足：在概率 1 −*δ* 下，\n\n![](img/eq4-1.png)\n\n前提是\
  \ *w* ≥ ⌈e*/*\U0001D716⌉ 且 *d* ≥ ⌈ln(1*/δ*)⌉。这在任何时刻均成立，无论之前添加并删除了多少项目。\n\n我们从现在起假设\
  \ *F >* 0，以使上述不等式有意义，即负权重小于正权重。同 `SPACESAVING` 一样，这意味着对于重项目，即权重占 *F* 显著比例的项目，![](img/pg52-in-1.png)\
  \ 是 *f*[*x*] 的合理近似。此外，算法使用的内存约为 *wd* 个计数器或累加器。总之，*f*[*x*] 的值可在加性因子 \U0001D716 内近似，概率为\
  \ 1 − *δ*，使用 *O*(ln(1*/δ*)*/*\U0001D716) 个内存字。\n\n现在让我们描述概略图的实现。具有参数 *w,d* 的 CM-sketch\
  \ 由一个具有 *d* 行 *w* 列的二维计数器数组组成，连同 *d* 个独立的哈希函数 *h*[0], …, *h*[*d*−1]，将项目映射到区间 \\\
  [0…*w* − 1\\]。图 4.7 展示了 *d* = 4 和 *w* = 7 时 CM-sketch 结构的示例，图 4.8 展示了该算法的伪代码。\n\n\
  ![图 4.7 宽度为 7、深度为 4 的 CM-sketch 结构示例，对应 \U0001D716 = 0.4 和 δ = 0.02。](img/Fig4-7.png)\n\
  \n**图 4.7**\n\n宽度为 7、深度为 4 的 CM-sketch 结构示例，对应 \U0001D716 = 0.4 和 *δ* = 0.02。\n\n\
  ![图 4.8 CM-SKETCH 算法。](img/Fig4-8.png)\n\n**图 4.8**\n\nCM-SKETCH 算法。\n\n可见 `Update`\
  \ 和 `Query` 操作均执行 *O*(*d*) 次操作。我们不正式证明不等式（4.1）中的近似界，但提供一些关于其为何成立的直观解释。首先观察到，对于第\
  \ *i* 行第 *j* 列，*A*\\[*i,j*\\] 包含该行中所有满足 *h**i* = *j* 的项目 *x* 在流中的权重之和。仅此一点就保证了 *f*[*x*]\
  \ ≤ *A*\\*i,h*[*i*\\]，因此 *f*[*x*] ≤ `Query`(*x*)。但如果有其他项目 *y* 恰好被映射到该行的同一单元格，即 *h**i*\
  \ = *h**i*，则 *A*\\*i,h*[*i*\\] 可能会高估 *f*[*x*]。需分配给该行 *w* 个单元格的总权重为 *F*，因此落在任意特定单元格上的期望权重为\
  \ *F/w*。可以证明，任何单元格接收远超该期望值的权重的可能性不大。直观上，这可能发生在特别重的项目被映射到该单元格时，但重项目数量有限，所以这种情况很少发生；或者太多轻项目被映射到该单元格，但这也不太可能，因为哈希函数将项目或多或少均匀地分布在该行的所有\
  \ *w* 个单元格中。马尔可夫不等式在证明中起核心作用。\n\n回到重击者问题，CM-sketch 为重击者元素的频率提供了合理的近似，但没有明显的方法从数据结构中定位它们。对所有可能的\
  \ *x* 调用 `Query`(*x*) 的暴力搜索对于大型项目全集是不可行的。解决方案使用了所谓的*区间求和查询* 的高效实现，这在许多情况下具有独立的研究价值。\n\
  \n区间求和查询定义在可与 {1, . . . , |*I*|} 中的整数对应的项目集合上。参数为 \\[*x,y*\\] 的区间求和查询返回 *f*[*x*]\
  \ + *f*[*x*+1] + ⋯ + *f*[*y*−1] + *f*[*y*]。例如，考虑一个处理发往 IP 地址数据包的路由器。路由器的一个区间求和查询可能是：“你见过多少发往\
  \ IPv4 地址范围 172.16.aaa.bbb 的数据包？”我们期望比遍历该范围内的 2¹⁶ 个地址更快地解决此查询。\n\n\n\n\n#######\
  \ 使用 CM-Sketch 进行范围求和查询\n\n范围求和查询可以使用 CM-Sketch 实现，方法如下：设 `|I| = 2^n` 为潜在项的数量。对于每个\
  \ 2 的幂 `2^i`（`0 ≤ i ≤ n`），创建一个 CM-Sketch `C[i]`，用于对大小为 `2^i` 的区间内的项进行范围求和。更准确地说，向\
  \ `C[i]` 发出的 `Query(j)` 将返回区间 `[j·2^i … (j + 1)·2^i − 1]` 内项的总计数。或者，我们可以想象在第 `i`\
  \ 层，每个项 `x` 都属于“超级项” `x mod 2^(n−i)`。特别地，`C[0]` 存储单个项的计数，而 `C[n]` 存储所有计数的总和。然后，我们可以使用以下递归来回答针对\
  \ `C[i]` 的范围求和查询 `(x, y)`，其中 `x` 和 `y` 位于同一个大小为 `2^i` 的区间内：\n\n1. 如果 `x` 和 `y` 落在同一个大小为\
  \ `2^(i−1)` 的区间内，我们向 `C[i−1]` 查询 `(x, y)` 并返回其答案。\n2. 否则，如果存在某个 `j` 使得 `x < j·2^(i−1)\
  \ ≤ y`（即 `x` 和 `y` 不属于同一个大小为 `2^(i−1)` 的区间），我们向 `C[i−1]` 查询范围求和 `(x, j·2^(i−1) −\
  \ 1)` 和 `(j·2^(i−1), y)`，然后返回两个答案的总和。\n\nSketch `C[0]` 是递归的基础。\n\n现在，带参数 `k` 的重击项问题可以通过按深度探索区间集合\
  \ `[j·2^i, (j + 1)·2^i − 1]` 来解决。如果区间的权重低于 `F/k`，则其下方的任何叶节点都不可能是重击项，因此返回空列表。否则，将其划分为两个大小相等的区间分别探索，并将返回的列表连接起来。当到达叶节点时，当且仅当它是重击项时（即其权重为\
  \ `F/k` 或更多）才返回它。此外，在树的每一层中，权重为 `F/k` 或更多的节点最多有 `k` 个，因此最多探索树的 `k log |I|` 个节点。总而言之，重击项的查找使用\
  \ `O((log |I|) ln(1/δ) / ε)` 个内存字。\n\n如前所述，CM-Sketch 可用于高效解决流上的其他几个问题 [81]，包括分位数计算、项频率直方图、相关性以及两个流的内积。然而，对于分位数计算的情况，专用\
  \ Sketch FrugalStreaming [163] 被认为是最先进的技术。我们将在第 6.4.3 节描述分类问题中数值属性的管理时介绍另一种分位数摘要。\n\
  \n###### 4.6.3 CountSketch\n\nCOUNTSKETCH 算法由 Charikar 等人 [64] 提出。与 CM-SKETCH 一样，它支持具有正负权重的更新。它使用\
  \ `O(1/ε²)` 的内存，但能找到所谓的 `F[2]`–重击项，这是常规重击项（或 `F[1]`–重击项）的一个有趣的超集。\n\n流的 `F[2]` 范数定义为\
  \ `√(∑_x f[x]²)`。如果 `f[x] ≥ ε √(∑_y f[y]²)`，则项 `x` 是阈值为 `ε` 的 `F[2]`–重击项。一些简单的代数运算表明，每个\
  \ `F[1]`–重击项也是 `F[2]`–重击项。\n\n在其最简单的形式中，COUNTSKETCH 可以描述如下。它选择两个哈希函数。函数 `h` 将项映射到一组\
  \ `w` 个桶 `{0, …, w − 1}`。函数 `σ` 将项映射到 `{−1, +1}`。假设两者都足够随机。特别是 `σ` 的一个重要性质是：对于不同的\
  \ `x` 和 `y`，`σ(x)` 和 `σ(y)` 相互独立，这意味着 `Pr[σ(x) = σ(y)] = 1/2`，进而意味着 `E[σ(x) · σ(y)]\
  \ = 0`。\n\n算法维护一个包含 `w` 个累加器的数组 `A`，初始化为 0。对于流中的每一对 `(x, c)`，它向 `A[h(x)]` 添加值 `σ(x)\
  \ · c`。注意，给定 `x` 的更新要么全部相加，要么全部相减，取决于 `σ(x)`。当被要求提供 `f[x]` 的估计值时，算法返回 `Query(x)\
  \ = σ(x) · A[h(x)]`。如果没有其他项 `y` 被映射到 `A` 中与 `x` 相同的单元格，该估计将是精确的，但这种情况很少见。尽管如此，可以证明在哈希函数的随机选择下，其期望是正确的。确实：\n\
  \n```\nE[Query(x)] = E[σ(x) · A[h(x)]]\n            = E[σ(x) · ∑_y σ(y) · f[y] ·\
  \ I(h(y) = h(x))]\n            = ∑_y f[y] · E[σ(x)σ(y)] · Pr[h(y) = h(x)]\n    \
  \        = f[x]\n```\n\n因为如前所述，对于 `x ≠ y`，`E[σ(x)σ(y)] = 0`，且 `σ(x)² = 1`。类似的代数运算表明\
  \ `Var(Query(x)) ≤ F[2] / w`。\n\n现在我们可以使用类似第 4.9.2 节所述的策略，先提高精度，再提高置信度：取 `w = 12/(5ε²)`\
  \ 个独立副本的平均值；根据切比雪夫不等式，这以 `5/6` 的概率用加性误差 `ε √(F[2]/w)` 估计每个频率。然后独立地重复此过程 `d = O(ln(1/δ))`\
  \ 次并返回结果的中位数；霍夫丁不等式表明（见练习 4.9），这将置信度提升至 `1 − δ`。因此，满足 `Query(x) ≥ ε √(F[2])` 的 `x`\
  \ 的集合以高概率包含每个 `F[2]`–重击项。注意，与 CM-SKETCH 和 SPACESAVING 不同，这里除了假阳性外可能还有假阴性，因为使用的是中位数而非最小值。内存使用为\
  \ `O(ln(1/δ) / ε²)` 字。\n\n此时，我们可以将基本算法的 `d` 个副本视为一个类似于 CM-SKETCH 的单一算法：它选择哈希函数 `h[0],\
  \ …, h[d−1]`、`σ[0], …, σ[d−1]`，并维护一个具有 `d` 行 `w` 列的数组 `A`。伪代码如 图 4.9 所示。为了高效地恢复重击项，COUNTSKETCH\
  \ 还基于估计权重维护一个迄今为止见过的最频繁元素的堆。\n\n![图 4.9 COUNTSKETCH 算法。](img/Fig4-9.png)\n\n**图\
  \ 4.9**  \nCOUNTSKETCH 算法。\n\nCOUNTSKETCH 的改进见文献 [51, 249]。\n\n作为重击项方法的简要总结，并遵循\
  \ [164]，如果应用严格局限于发现频繁项，基于计数器的技术（如 Lossy Counting 或 Space Saving）在时间、内存和精度方面可能更可取，且更易于实现。例如，发现\
  \ COUNTSKETCH 和 CM-SKETCH 稳定性较差，在某些参数范围内表现更差。另一方面，基于哈希的方法是支持负项权重的唯一替代方案，且除了重击项外还能提供有用的信息。\n\
  \n###### 4.6.4 矩计算\n\n*频率矩* 是项频率的一种推广，能提供关于流中项分布的不同信息。在每个项 `x` 具有绝对频率 `f[x]` 的流中，第\
  \ `p` 阶矩定义为\n\n```\nF[p] = ∑_x f[x]^p\n```\n\n观察可知，`F[1]` 是流的长度，而 `F[0]` 是流包含的不同项的数量（如果我们取\
  \ `0⁰` 为 0，且对于任何其他 `f` 有 `f⁰ = 1`）。`F[2]` 尤为重要，因为它可用于计算流中项的方差。极限情况是 `F[∞]`，定义为\n\
  \n```\nF[∞] = max_x f[x]\n```\n\n即最高频元素的频率。\n\nAlon 等人 [14] 开启了用于计算频率矩近似值的流算法研究。他们针对\
  \ `p ≥ 2` 的 Sketch（称为 Alon-Matias-Szegedy 或 AMS Sketch）使用了一种类似于 CM-SKETCH 的技术：选取将每个项映射到\
  \ `{−1, +1}` 的哈希函数，利用它们构建一个无偏但高方差的矩估计器，然后对多个副本取平均和中位数，以产生任意精确的估计。\n\n他们的工作已经表明，计算\
  \ `p ≤ 2` 时的 `F[p]` 与 `p > 2` 时的 `F[p]` 在内存需求上存在突发性差异。经过一长系列论文的研究，文献 [141] 证明了，考虑相对近似：\n\
  \n*   对于 `p ≤ 2`，`F[p]` 可以在数据流中使用 `O(ε^(−2) (log t + log m) ln(1/δ))` 比特内存进行近似，且\n\
  *   对于 `p > 2`，`F[p]` 可以在数据流中使用 `Ω(m^(1−2/p) / (ε² log m))` 比特内存进行近似。\n\n\n\n\n\n\
  忽略对数因子，其中 `t` 是流的长度，`m = |I|` 是项目集合的大小。此外，对于除 0 和 1 以外的每个 `p`，该数量级的内存实际上是*必要*的。后续工作也基本消除了对数间隙。特别是，对于\
  \ `F[∞]` 或最大频率，需要流长度级别的线性内存。请注意，对于特殊情况 `p = 0` 和 `p = 1`，我们在前几节中给出的算法使用的内存是 `O(log\
  \ log t)`，而不是 `O(log t)`。\n\n##### 4.7 滑动窗口的指数直方图\n\n通常，流中较新的项目对于分析应被视为更重要。我们将在第\
  \ 5 章中通过几种方式对这一想法进行建模，但这里我们考虑最简单的模型，即*滑动窗口*：在任何时候，我们只认为最后接收到的 `W` 个项目是相关的，其中 `W`\
  \ 是窗口大小；所有之前的项目都是无关的。或者，我们固定一个时间持续时间 `T`（如一周、一小时或一分钟），并且只考虑从现在起时间 `T` 内到达的项目。我们将主要考虑第一种模型，但适应第二种模型也很容易。\n\
  \n考虑在实数流中维护最后 `W` 个值的和这一问题。自然的解决方案是使用大小为 `W` 的循环缓冲区；每个到达的元素都加到总和中；它将最旧的元素从缓冲区中逐出，并从总和中减去该元素。该方案具有常数更新时间，但使用内存\
  \ `W`。事实上，可以证明任何*精确*解决此问题的流算法必须使用至少 `W` 的内存。\n\n接下来我们将看到一种仅存储 `O(log W)` 个值来维护和的*近似*值的方法。Datar\
  \ 等人 [83] 提出的*指数直方图*草图维护实数滑动窗口上聚合函数的近似值。我们仅详细描述聚合函数为求和且项目为比特的情况。\n\n该草图将长度为 `W`\
  \ 的窗口划分为一系列子窗口，并用一个*桶*表示每个子窗口。直观上，桶编码了大小为 `W` 的所需窗口，其中较旧的 1 以越来越低的分辨率表示。每个桶有一个*容量*，它是\
  \ 2 的幂，并表示一个包含与其容量一样多的 1 的子窗口。它包含一个整数值，即*时间戳*，这是它所代表的子窗口中最近的 1 的时间戳。对于参数 `k > 1`，有\
  \ `k` 个容量为 1 的桶，由最近的 `k` 个 1 界定；`k` 个容量为 2 的桶；`k` 个容量为 4 的桶；依此类推，直到容量为 `2^(m)` 的\
  \ `k` 个桶，其中 `m` 是确保有足够桶来容纳 `W` 个项目的最小值，即\n\n```\nm ≃ log(W/k)\n```\n\n注意 `m ≃ log(W/k)`，因此共有\
  \ `km ≃ k log(W/k)` 个桶。\n\n该方法的伪代码见图 4.11，将滑动窗口划分为桶的示例见图 4.10。该示例展示了在某一时刻 `t`，流的最后\
  \ 29 个比特如何划分为 6 个桶，其中 `k = 2`。每个桶包含的 1 的数量等于其容量。最近的比特在右侧，时间戳为 `t`。最旧的比特在左侧，时间戳为\
  \ `t − 28`。每个桶的时间戳是其最近的 1 的时间戳。如果所需的滑动窗口大小 `W` 为 25，则最近 `W` 个比特中 1 的真实计数为 11，因为时间戳在\
  \ `t − 24` 和 `t` 之间的 1 有 11 个。草图将报告窗口的和为 12：所有桶中 1 的总数（14），减去最旧桶容量的一半（2）。因此相对误差为\
  \ `(12 − 11)/11 ≃ 9%`。\n\n![Figure 4.10 Partitioning a stream of 29 bits into buckets,\
  \ with k = 2. Most recent bits are to the right.](img/Fig4-10.png)\n\n**图 4.10**\n\
  \n将 29 个比特的流划分为桶，`k = 2`。最近的比特在右侧。\n\n![Figure 4.11 The EXPONENTIAL HISTOGRAMS sketch.](img/Fig4-11.png)\n\
  \n**图 4.11**\n\n指数直方图草图。\n\n近似中的误差仅由最旧的桶引入。它必须至少包含一个时间戳大于 `t − W` 的 1，否则它就会被丢弃，但也可能包含多达\
  \ `2^(m) − 1` 个时间戳至多为 `t − W` 且不应被精确方法计数的 1。因此相对误差至多为最旧桶容量的一半除以所有桶的容量之和。由于经过短暂的过渡期后，除最大桶外，每种大小的桶都有\
  \ `k − 1` 或 `k` 个，因此相对误差至多为 `(2^(m)/2)/(2^(m) + (k − 1)(2^(m−1) + ⋯ + 1)) ≃ 1/2k`。\n\
  \n如果期望的近似率为 `\U0001D716`，则设置 `k = 1/2\U0001D716` 即可。桶的数量则为 `(log W)/2\U0001D716\
  `。每个桶包含一个时间戳，原则上这是一个无界数。然而，我们可以通过对 `W` 取模计数，将时间戳缩减到区间 `0…W − 1`，因此一个时间戳有 `log W`\
  \ 位，总共需要 `O((log W)²/\U0001D716)` 位内存。如果桶更新的级联影响所有桶，最坏情况下更新时间为 `O(log W)`，但这种情况很少发生；摊还时间为\
  \ `O(1)`。一种称为*确定性波*的指数直方图变体实现了最坏情况 `O(1)` 时间 [122]。\n\n该草图可以通过将内存乘以 `log B` 来适应范围\
  \ `[0, B]` 内的非负数，也可以维护其他聚合的近似值，如方差、最大值、最小值、不同元素数量和直方图 [83]。\n\n##### 4.8 分布式草图：可合并性\n\
  \n到目前为止讨论的大多数草图都具有称为*可合并性*的属性，这使它们适合分布式计算。如果一种草图类型是*可合并的*，则意味着从数据流 `D[1]` 和 `D[2]`\
  \ 构建的两个草图可以高效地合并为同类型的另一个草图，该草图能正确回答关于 `D[1]` 和 `D[2]` 交织的查询。请注意，对于仅依赖项目频率的问题，所有流交织的答案都是相同的。对于其他问题，可合并性的定义可能更复杂。\n\
  \n作为一个简单的例子，考虑一个由计算流中项目数量的整数组成的“草图”。现在我们从两个流构建两个这样的草图。如果我们将它们的值相加，结果正确地是将原始两个流合并后得到的任何流中的项目数量。\n\
  \n不那么平凡的是，取 OR 运算是线性计数器的正确合并操作。对于 Cohen 和 Flajolet-Martin 计数器及其变体，取其存储值的最小值（如果我们使用多个副本以减少方差，则逐分量取最小值）。对于\
  \ CM-sketch，将两个计数器数组逐分量相加。在这些情况下，待合并的两个草图必须使用相同的哈希函数。SPACESAVING 和指数直方图的情况留作练习。\n\
  \n可合并性允许按如下方式进行分布式处理：假设我们有 `k` 个不同的计算节点，每个节点接收不同的流——或者等价地接收一个大型分布式流的某一部分。想要为这个大型隐式流构建草图的中心节点可以定期请求\
  \ `k` 个节点发送它们的草图，并将它们合并到自己的全局草图中。\n\n对于 Morris 计数器，Cohen（[75] 第 7 节）提出了一种合并方法；它不像上述方法那样平凡，特别是正确性分析方面。\n\
  \n##### 4.9 一些技术讨论和补充材料\n\n###### 4.9.1 哈希函数\n\n\n\n\n对于几个草图，我们假设存在将一组项目 *I* 随机映射到集合\
  \ *B* 的哈希函数。严格来说，*完全独立* 的哈希函数 *h* 应该满足：给定 *I* 中其余元素上 *h* 的值，无法以任何优势猜测 *h* 在某个值 *x*\
  \ 上的值；形式上，对于每个 *i*，\n\n```\n![](img/pg61-1.png)\n```\n\n但认为 *h*(*x*[*i*]) 每次调用都生成一个新的随机值是不正确的——它必须始终在相同输入上返回相同的值。因此它是随机的，但可复现地随机。要创建这样的\
  \ *h*，我们可以为每个 *x*[*i*] ∈ *I* 随机猜测并存储 *h*(*x*[*i*]) 的值，但存储 *h* 将使用与 |*I*|log |*B*|\
  \ 成比例的内存，这违背了使用远低于 |*I*| 内存的目标。\n\n幸运的是，在某些情况下我们可以证明较弱的“随机哈希函数”概念就足够了。算法不使用固定的哈希函数，而是每当需要新的哈希函数时，使用几个随机位从哈希函数*族*\
  \ *H* 中随机选择一个。我们说族 *H* 是*成对独立* 的，如果对于 *I* 中任意两个不同的值 *x* 和 *y* 以及 *B* 中的 *α*、*β*，有\n\
  \n```\n![](img/pg61-2.png)\n```\n\n其中概率取自于对 *h* ∈ *H* 的随机选择。这意味着如果我们不知道 *H* 中选定的\
  \ *h*，且仅知道 *h* 的一个值，我们就无法猜测 *h* 的任何其他值。\n\n当 |*I*| 是某个素数 *p* 时，这里有一个成对独立哈希函数族的简单构造。将\
  \ *I* 视为区间 \\[0…*p* − 1\\]。族中的函数 *h* 由 \\[0…*p* − 1\\] 中的两个值 *a* 和 *b* 定义，并计算 *h*(*x*)\
  \ = (*ax* + *b*) mod *p*。注意，这样一个函数由 *a* 和 *b* 描述，因此用 2log *p* 位。这个族是成对独立的，因为给定 *x*、*y*\
  \ 和值 *h*(*y*)，对于每个可能的值 *h*(*x*)，方程组 {*h*(*x*) = *ax* + *b*, *h*(*y*) = *ay* + *b*}\
  \ 都有唯一解 (*a*, *b*)，所以 *h*(*x*) 的所有值等可能。然而请注意，如果我们知道 *x*、*y*、*h*(*x*) 和 *h*(*y*)，我们可以唯一地求解\
  \ *a*、*b*，从而知道对于其他每个输入 *z* 的值 *h*(*z*)。如果 |*I*| 是素数幂 *p*^(*b*)，我们可以通过在大小为 *p*^(*b*)\
  \ 的有限域中运算来推广这个构造；请注意这*不*等同于模 *p*^(*b*) 运算。我们也可以选择一个略大于 |*I*| 的素数，得到仅在边缘上偏离成对独立性的函数。\n\
  \n成对独立函数足以用于 CM-sketch。矩估计算法需要一种称为 4-wise independence 的推广。对于其他算法，如 HyperLogLog，据我们所知，*k*\\\
  -wise independence 无法被正式证明为足够。然而，尽管不存在正式保证，著名的哈希函数如 `MD5`、`SHA1`、`SHA256` 和 `Murmur3`\
  \ 在实践中似乎没有问题 [104, 134]。文献 [71] 提出了理论论据，解释为什么简单的哈希函数在草图等数据结构问题上可能表现良好。\n\n######\
  \ 4.9.2 创建 (\U0001D716, *δ*)-近似算法\n\n设 *f* 为待近似的函数，*g* 为随机算法，使得对所有 *x* 有 E\\[*g*(*x*)\\\
  ] = *f*(*x*)，且 Var(*g*(*x*)) = *σ*²。运行 *k* 个独立的 *g* 副本，记为 *g*[1], …, *g*[*k*]，通过平均它们的输出来组合，结果记为\
  \ *h*。我们有 E\\[*h*(*x*)\\] = *f*(*x*)，且由方差的简单性质，Var(|*f*(*x*) − *h*(*x*)|) ≤ Var(*f*(*x*)\
  \ − *h*(*x*)) = Var(*h*(*x*)) = *σ*²/*k*。然后由切比雪夫不等式，对于每个 \U0001D716，有 |*f*(*x*)\
  \ − *h*(*x*)| > \U0001D716 的概率至多为 *σ*²/(*k*\U0001D716²)。这意味着如果我们选择 *k* = *σ*²/(\U0001D716\
  ²*δ*)，则 *h* 是 *f* 的 (\U0001D716, *δ*)-近似。*h* 的内存和更新时间是 *g* 的 *k* 倍。\n\n通常为了达到精度\
  \ \U0001D716，需要 *σ*²/\U0001D716² 形式的依赖关系，但 1/*δ* 形式的依赖关系可以按如下方式改进：使用上述方法达到固定置信度，例如\
  \ (\U0001D716, 1/6)-近似。然后运行该固定置信度算法的 *ℓ* 个副本并取结果的*中位数*。使用霍夫丁不等式可以证明，如果取 *ℓ* = *O*(ln(1/*δ*))，则新算法是\
  \ (\U0001D716, *δ*)-近似；见练习 4.9。因此最终算法使用的内存和运行时间是原始算法 *g* 的 *k* · *ℓ* = *O*((*σ*²/\U0001D716\
  ²) ln(1/*δ*)) 倍。\n\n这种转换已经存在于 Alon 等人 [14] 关于流上矩估计的开创性论文中。\n\n###### 4.9.3 其他草图技术\n\
  \n本章展示的草图是因其在流挖掘和数据流学习中的潜在用途而选取的。数据流上还提出了许多其他算法问题，例如解决组合问题、几何问题和图问题。此外，我们的展示中省略了小波、低维嵌入和压缩感知等深度算法技术的流式变体。近期的综合参考文献包括\
  \ [79, 172]。\n\n鉴于线性代数问题在机器学习中日益突出，相关算法值得特别提及。在线奇异值分解（[221] 和最近的 [159]）以及主成分分析 [49]\
  \ 的进展很可能在流式处理中变得极具影响力。书籍 [248] 深入介绍了线性代数草图；它们在流挖掘和学习任务中的实际应用是一个非常有前景但很大程度上未被探索的方向。\n\
