  \ 表 6.1 的修改版混淆矩阵。\n6.3 预算分配策略摘要。\n### 前言\n\n实时流数据分析正成为从当前正在发生的事件中获取有用知识的标准，使组织能够在问题出现时快速反应，或检测新趋势，从而帮助其提升绩效。本书介绍了数据流挖掘领域目前使用的许多算法和技术。一个实现了本书许多技术的软件框架可在网络上作为名为\
  \ `MOA` 的开源项目获得。\n\n本书的目标是向三类特定读者展示数据流挖掘技术：\n\n1.  希望将流挖掘作为工具使用的读者，他们没有扎实的算法或编程背景，但具备基本的数据挖掘背景。例如管理、商业智能或市场营销等领域的学生或专业人士。我们以面向任务（而非面向算法）的方式，提供了\
  \ `MOA` 的实践入门介绍。\n\n2.  希望在数据流挖掘领域进行研究或创新的读者。他们希望了解算法、评估方法等的细节，以便创建新算法或使用现有算法，评估其性能，并可能将其集成到应用中。这类读者包括计算机或数据科学领域的高年级本科生、硕士生和博士生，以及创新环境中的开发人员。\n\
  \n3.  除了上述需求外，还希望尝试在 `MOA` 中加入新算法，并可能将其贡献给该项目的读者。他们需要了解 `MOA` 的类结构，以及如何为 `MOA` 创建新学习器等。\n\
  \n为实现这一目标，本书分为三部分。第一部分是大数据流挖掘的快速入门。它包含三章：两章介绍大数据挖掘和挖掘数据流的基本方法论，还有一章是面向希望自行上手探索的读者的\
  \ `MOA` 实践指南。\n\n\n\n\n\n### 第一部分：简介\n\n#### 1 简介\n\n如今，我们每天都在从各种设备、以不同格式、从独立或关联的应用程序中创造海量数据。这种大数据洪流已超越了我们处理、分析、存储和理解这些数据集的能力。社交网络应用的普及率大幅提升，允许用户自由创建内容，进一步加速了这种急剧扩张，使得本已庞大的\
  \ Web 规模持续膨胀。\n\n此外，随着手机成为从不同侧面获取人员实时数据的感知网关，移动运营商潜在可处理的海量数据（旨在改善我们的日常生活）已显著超越过去基于通话详单的处理模式（该模式仅为计费目的而设计）。我们可以预见，物联网应用将把数据规模提升到前所未有的水平。人和设备（从家用咖啡机到汽车、公交车、火车站和机场）都松散地连接在一起。数万亿个此类连接组件将生成一个巨大的数据海洋，必须从中发现有价值的信息，以帮助提高我们的生活质量，让世界变得更美好。例如，我们每天早上起床后，为了优化上班通勤时间并在抵达办公室前完成优化，系统需要处理来自交通、天气、施工、警方活动以及我们日程安排的信息，并在严格的时间限制下执行深度优化。\n\
  \n为了应对这种惊人的海量数据，我们需要能够在合理资源消耗下实时运行的快速高效方法。\n\n##### 1.1 大数据\n\n用特定的数据集大小（例如 PB 级）来定义\
  \ `big data` 并没有太大用处。一个更有用的定义是：数据集大到无法在不使用非标准算法或技术的情况下进行管理，特别是当它要用于知识抽取时。\n\n虽然二十年前人们还在为\
  \ GB 级数据而苦恼，但在撰写本书时，表 1.1 中对应的内存单位介于 TB 和 PB 之间。毫无疑问，再过二十年，我们将从这个位置向下推移几个数量级。\n\n\
  **表 1.1** 以字节为基础的内存单位倍数。\n\n| 内存单位 | 十进制大小 | 二进制大小 |\n| --- | --- | --- |\n| 千字节\
  \ (kB, KB) | 10³ | 2¹⁰ |\n| 兆字节 (MB) | 10⁶ | 2²⁰ |\n| 吉字节 (GB) | 10⁹ | 2³⁰ |\n|\
  \ 太字节 (TB) | 10¹² | 2⁴⁰ |\n| 拍字节 (PB) | 10¹⁵ | 2⁵⁰ |\n| 艾字节 (EB) | 10¹⁸ | 2⁶⁰ |\n\
  | 泽字节 (ZB) | 10²¹ | 2⁷⁰ |\n| 尧字节 (YB) | 10²⁴ | 2⁸⁰ |\n\nLaney 在文献 [154] 中用大数据管理的“三个\
  \ V”来刻画大数据：\n\n*   **容量**：数据量前所未有地庞大，且规模持续增长，但我们的工具能处理的数据比例却没有增加。\n*   **多样性**：存在多种不同类型的数据，如文本、传感器数据、音频、视频、图等，我们希望从中提取信息。\n\
  *   **速度**：数据以流的形式持续到达，我们有兴趣实时从中获取有用信息。\n\n此后又增加了其他几个 V：\n\n*   **可变性**：数据的结构，或用户解读数据的方式，会随时间变化。\n\
  *   **价值**：数据只有在能带来更好决策、并最终形成竞争优势的程度上才具有价值。\n*   **有效性与真实性**：部分数据可能不完全可靠，管理这种不确定性非常重要。\n\
  \n\n\n\n###### Gartner 对大数据的定义\n\nGartner [200] 在 2012 年对大数据的定义中总结道：“高容量、高速度和高多样性的信息资产，需要具有成本效益的创新形式的信息处理，以增强洞察力和决策能力。”\n\
  \n大数据的应用应使人们能够获得更好的服务、更好的客户体验，并更加健康：\n\n*   **商业**：客户个性化和流失检测（客户从一家公司转移到竞争对手）。\n\
  *   **技术**：将处理时间从小时缩短到秒级。\n*   **健康**：挖掘人们的医疗记录和基因组数据，以监测和改善他们的健康。\n*   **智慧城市**：专注于可持续经济发展和高质量生活的城市，并对自然资源进行明智管理。\n\
  \n作为大数据挖掘实用性的一个例子，我们参考 Global Pulse [236] 的工作，该工作利用大数据改善发展中国家的生活。Global Pulse 是联合国的一项倡议，作为一个创新实验室运作，其策略是挖掘大数据以：\n\
  \n1.  研究分析实时数字数据的创新方法和技术，以检测早期出现的脆弱性。\n2.  组装一个免费的开源技术工具包，用于分析实时数据和共享假设。\n3.  建立一个集成的全球\
  \ Pulse Labs 网络，在国家层面试点该方法。\n\n大数据挖掘革命不仅限于工业化世界，因为移动设备在发展中国家也在普及。据估计，移动电话超过 50 亿部，其中\
  \ 80% 位于发展中国家。\n\n##### 1.1.1 工具：开源革命\n\n大数据现象与开源软件革命密不可分。雅虎、Twitter、LinkedIn、Google\
  \ 和 Facebook 等大公司既受益于开源项目，也为开源项目做出了贡献。一些例子包括：\n\n*   **Apache Hadoop** [16]：一个用于数据密集型分布式应用的平台，基于\
  \ `MapReduce` 编程模型和 `Hadoop Distributed File System (HDFS)`。`Hadoop` 允许我们编写应用程序，在计算节点集群上并行快速处理大量数据。\n\
  *   **与 Apache Hadoop 相关的项目** [260]：`Apache Pig`、`Apache Hive`、`Apache HBase`、`Apache\
  \ ZooKeeper`、`Apache Cassandra`、`Cascading`、`Scribe` 和 `Apache Mahout` [17]（主要基于\
  \ `Hadoop` 的可扩展机器学习和数据挖掘开源软件）。\n*   **Apache Spark** [253]：一个用于大规模数据处理的引擎，运行在 `Hadoop`\
  \ 基础设施上。`Spark` 提供了一个库栈，包括 `SQL` 和 `DataFrames`、`MLlib`（用于机器学习）、`GraphX` 和 `Spark\
  \ Streaming`。这些库可以在同一个应用程序中轻松组合。\n*   **Apache Flink** [62]：一个流数据流引擎，为分布式计算提供数据分发、通信和容错。`Flink`\
  \ 包含多个用于创建应用程序的 API。如果 `Apache Spark` 是一个批处理引擎，可以使用微批次通过 `Spark Streaming` 模拟流处理，那么\
  \ `Apache Flink` 就是一个流处理引擎，也可以执行批处理。\n*   **Apache Storm** [168]：用于流数据密集型分布式应用的软件，类似于\
  \ `Apache S4` 和 `Apache Samza`。\n*   **TensorFlow** [1]：一个用于机器学习和深度神经网络的开源包。\n\n\
  ##### 1.2 大数据挑战\n\n大数据管理和分析的未来面临许多挑战，源于数据的本质：大量、多样和不断演变 [128]。研究人员和从业者在未来几年将不得不面对的一些挑战包括：\n\
  \n*   **分析架构**。目前尚不清楚如何构建最优的分析系统架构，以同时处理历史数据和实时数据。Nathan Marz [169] 提出了 `Lambda`\
  \ 架构作为首个方案。`Lambda` 架构通过将问题分解为三层来解决实时计算任意数据上任意函数的问题：批处理层、服务层和速度层。它在同一系统中结合了用于批处理层的\
  \ `Hadoop` 和用于速度层的 `Storm`。一个较新的提议是 `Kappa` 架构，由 LinkedIn 的 Kreps [152] 提出。它简化了\
  \ `Lambda` 架构，移除了批处理系统。\n*   **评估**。实现统计学显著结果很重要，不能被随机性误导。如果不妥善处理“多重假设问题”，在海量数据集和数千个同时待答问题面前很容易出错，Efron\
  \ [95] 对此有解释。此外，避免只关注误差或速度等技术指标而忽视现实世界影响的陷阱也很重要，Wagstaff [242] 讨论了这一点：只有定期发布符合本文中解释的挑战问题合理标准的应用，才能反驳认为大数据全是炒作的观点。\n\
  *   **分布式挖掘**。许多数据挖掘技术并非易于并行化。要获得某些方法的分布式版本，需要通过实际实验和理论分析进行大量研究。\n*   **时变数据**。数据可能随时间演变，因此大数据挖掘技术能够适应变化，并在某些情况下显式检测变化非常重要。本书中的许多数据流挖掘技术正是由这一需求驱动的\
  \ [110]。\n*   **压缩**。处理大数据时，存储所需的空间量非常相关。主要有两种方法：压缩（不丢失信息）和采样（选择被认为有代表性的数据）。使用压缩，我们用更多时间换取更少空间，可视为从时间到空间的转换。使用采样，我们丢失信息，但空间收益可能达到数量级。例如\
  \ Feldman 等人 [99] 使用核心集来降低大数据问题的复杂度；核心集是数据的一个小子集，可针对给定问题可证明地近似原始数据。\n*   **可视化**。大数据分析的一个主要问题是如何可视化结果。以人类可理解的方式呈现来自大量数据的信息是一项挑战。这需要新的技术和框架来讲述故事，如精美书籍\
  \ *The Human Face of Big Data* [228] 所涵盖的内容。\n*   **隐藏的大数据**。大量有用数据实际上毫无用处，因为它们未标记、基于文件且非结构化。2012\
  \ 年 IDC 的大数据研究 [117] 解释说，2012 年数字宇宙中 23%（643 EB）的数据如果经过标记和分析将对大数据有用。然而，当时只有 3% 的潜在有用数据被标记，分析的更少。近年来数据可能变得更糟。开放数据和语义\
  \ Web 运动的出现，部分是为了让我们意识到并改善这一状况。\n\n##### 1.2 实时分析\n\n大数据场景的一个特例是实时分析。组织不仅需要立即获得查询答案，还需要根据刚刚到达的数据来获得答案。\n\
  \n###### 1.2.1 数据流\n\n\n\n\n####### 数据流\n\n*数据流* 是一种算法抽象，用于支持实时分析。它们是项目的序列，可能是无限的，每个项目都有一个时间戳，因此具有时间顺序。数据项逐个到达，我们希望实时构建并维护这些项目的模型，例如模式或预测器。处理流式数据时存在两个主要的算法挑战：流数据量大且速度快，我们需要实时从中提取信息。这意味着通常我们需要接受近似解，以便使用更少的时间和内存。此外，数据可能在演变，因此当数据发生变化时，我们的模型必须能够适应。\n\
  \n####### 时间与内存\n\n准确性、时间和内存是流挖掘过程的三个主要资源维度：我们关注的是那些能以最少的时间和较低的总内存获得最大准确性的方法。稍后我们将展示，通过将内存和时间结合在一个单一的成本度量中，可以将评估简化为一个二维任务。另请注意，由于数据以高速到达，无法被缓冲，因此处理单个项目的时间与总时间一样重要，而总时间通常是传统数据挖掘中考虑的指标。\n\
  \n####### 应用\n\n流式数据有许多场景。这里我们提供几个示例领域：\n\n*   **传感器数据与物联网**：每天，工业界使用更多的传感器来监控流程并提高其质量。城市开始部署庞大的传感器网络，以监控人员流动、检查桥梁和道路的健康状况、城市交通、人们的生命体征等。\n\
  *   **电信数据**：电信公司拥有大量的通话数据。如今，移动通话和手机位置是需要处理的海量数据源，通常要求实时处理。\n*   **社交媒体**：Facebook、Twitter、LinkedIn\
  \ 和 Instagram 等社交网站的用户持续产生关于其互动和贡献的数据。话题与社区发现以及情感分析只是由此产生的实时分析问题中的两个例子。\n*   **市场营销与电子商务**：销售企业实时收集大量交易数据，可对其进行分析以挖掘价值。检测电子交易中的欺诈行为至关重要。\n\
  *   **医疗保健**：医院在照顾病人时会收集大量时效性数据，例如监测病人的生命体征，如血压、心率和体温。远程医疗也将在病人居家时对其进行监测，可能包括通过独立传感器获取的日常活动数据。此外，系统还可能包含实验室检测结果、病理报告、X\
  \ 光片和数字影像。其中一些数据可用于实时提供病人病情变化的预警。\n*   **流行病与灾难**：源自互联网的数据流可用于检测流行病和自然灾害，并可与疾病控制和预防中心及灾害控制和预防中心的官方统计数据相结合\
  \ [63]。\n*   **计算机安全**：计算机系统必须免受硬件、软件和信息的盗窃与损坏，以及所提供服务的中断或误导，特别是内部威胁检测 [11, 229]\
  \ 和入侵检测 [194, 195]。\n*   **电力需求预测**：供应商需要提前一段时间知道客户将请求多少电力。这些数字随一天中的时间、一年中的季节、地理位置、天气、经济状况、客户习惯以及许多其他因素而变化，使其成为一个在海量分布式数据上的复杂预测问题。\n\
  \n##### 本书内容\n\n在大数据的众多方面中，本书专注于从数据流中进行挖掘和学习，因此专注于对高速到达的序列数据执行数据分析的技术。在定义大数据的诸多“V”特征中，我们主要解决的是**速度**\
  \ 问题。\n\n这些技术通过 `MOA`（大规模在线分析）以实操方式进行演示。`MOA` 是最流行的开源数据流挖掘框架，拥有非常活跃且不断壮大的社区。它包含一系列机器学习\
  \ (ML) 算法（分类、回归、聚类、模式挖掘、异常检测、变化检测和推荐系统）以及评估工具。`MOA` 与 `WEKA` 项目相关，同样使用 Java 编写，但设计用于扩展以应对更苛刻的问题。\n\
  \n第一部分介绍大数据领域、主要技术概览以及 `MOA` 使用的初步实操指南。第二部分详细介绍了大量流挖掘算法，优先介绍已在 `MOA` 中实现的算法，并为有兴趣深入了解的读者提供相关文献指引。第三部分深入探讨\
  \ `MOA`。它提供了一些额外的实操练习和 `MOA` 的部分内部结构，面向希望向 `MOA` 添加算法、修改现有算法，或通过其 API 在应用程序中使用 `MOA`\
  \ 的读者。\n\n最后，我们要提到还有其他非常有用且重要的数据流挖掘技术，但本书未涵盖，例如匹配问题、主题发现、排序/学习排序、推荐系统、循环概念挖掘、地理空间数据和大规模流式图挖掘。此外，在实际项目中，缺失数据、特征提取、异常检测和形成训练实例等方面将很重要；我们在此不显式涵盖它们，因为它们往往高度依赖于具体问题。\n\
  \n##### 大数据流挖掘\n\n在本章中，我们将简要介绍一些从数据流中学习的基本方法。在下一章中，我们将展示一个使用 `MOA` 及本章简要介绍的一些方法的实践示例。这些及其他方法将在本书第二部分中详细介绍。\n\
  \n##### 算法\n\n数据流挖掘的主要算法包括分类、回归、聚类和频繁模式挖掘。\n\n假设我们有一个项目流，也称为实例或样本，它们持续不断地到达。当我们需要根据项目的其他特征，从一组标称标签中为每个项目分配一个标签时，我们就处于分类场景中。只要稍后能获得（许多）样本的正确标签，分类器就可以被训练。分类的一个例子是将传入的电子邮件标记为垃圾邮件或非垃圾邮件。回归是一个类似于分类的预测任务，不同之处在于要预测的标签是数值而非标称值。回归的一个例子是预测明天股市中某股票的价值。\n\
  \n分类和回归需要一组适当标记的样本来学习模型，以便我们可以使用该模型预测未见样本的标签。它们是*监督* 学习任务的主要例子。当样本未被标记时，一个有趣的任务是将它们分组到同质簇中。聚类可用于例如获取网站的用户画像。它是*无监督*\
  \ 学习任务的一个例子。\n\n频繁模式挖掘在样本中寻找最相关的模式。例如，在超市销售数据集中，可以知道哪些商品被一起购买并获得关联规则，例如：*大多数购买奶酪的顾客也会购买葡萄酒*。\n\
  \n对于预测器、聚类器和频繁模式挖掘器，流挖掘算法最重要的要求是相同的：\n\n> **要求 1**：一次处理一个实例，并（至多）检查它一次。\n>\n> **要求\
  \ 2**：处理每个实例使用有限的时间。\n\n\n\n\n> 要求 3：使用有限的内存量。\n>\n> 要求 4：随时准备给出答案（预测、聚类、模式）。\n\
  >\n> 要求 5：适应时间上的变化。\n\n##### 2.2 分类\n\n在批量或离线分类中，分类器构建算法会获得一组带标签的示例。该算法创建一个模型，在此情况下即为分类器。随后模型被部署，即用于预测分类器构建者从未见过的未标记实例的标签。如果我们深入细节，就会知道在第一阶段将可用数据集分成两部分（训练数据集和测试数据集），或采用交叉验证，是一种良好的方法论，以确保分类器具有合理的准确性。但在任何情况下，都存在一个首训练阶段，它在时间上与预测阶段明显分离。\n\
  \n在在线设置中，特别是在流式处理中，训练、评估和测试之间的这种分离远非泾渭分明，而是交织在一起的。我们需要在拥有所有数据之前就开始预测，因为数据可能永无止境。如果可能，我们需要使用我们预测标签的数据来持续训练模型。而且我们可能需要以某种方式持续评估模型，以决定模型是否需要更激进或更保守的重新训练。\n\
  \n一般来说，流挖掘分类器随时准备执行以下任一操作：\n\n1.  接收一个未标记示例，并根据其当前模型对其进行预测。\n2.  接收过去某个示例的标签，并用它来调整模型，即进行训练。\n\
  \n例如，一家在线商店可能想要预测每位到达的顾客是否会购买某件特定商品（预测）。当顾客会话结束时（例如几分钟后），系统会获得一个“标签”，指示该顾客确实是否购买了该商品，该反馈可用于调整预测器。在其他情况下，标签可能永远无法知晓；例如，如果任务是判断顾客是机器人还是人类，真实标签可能仅对少数顾客可用。如果试图检测欺诈交易以将其拦截，被预测为欺诈的交易不会被执行，因此它们的真实标签永远无法知晓。\n\
  \n这一简单描述掩盖了许多重要的实际问题。首先，最终有多少未标记实例会收到其正确标签？显然，收到的标签越少，预测任务就越难。在放弃实例之前，我们应该等待实例标签到达多久？在处理海量、高速流时，高效管理等待标签的实例缓冲区是一个非常棘手的实现问题。最后，我们是否应该使用所有带标签的实例进行训练？如果实际上有许多标签可用，那么在所有实例上训练所增加的计算成本，可能会导致准确率的边际收益递减。\n\
  \n很难用通用的方法处理这些问题，因为好的解决方案往往过多地依赖于特定实际场景的细节。因此，流分类研究的很大一部分处理的是一个简化的训练/预测循环：我们假设获得*每个*未标记实例的真实标签，并且是在做出预测后*立即*获得，且在下一个实例到达之前。换句话说，算法执行以下循环：\n\
  \n* 获取一个未标记实例 `x`。\n* 利用当前模型 `f`，对 `x` 的标签做出预测 `ŷ = f(x)`。\n* 获取 `x` 的真实标签 `y`。\n\
  * 使用配对 `(x, y)` 来更新（训练）`f`，并使用配对 `(ŷ, y)` 来更新关于分类器性能的统计数据。\n* 处理下一个实例。\n\n从业者理所当然地批评该模型过于简单，因为它忽略了*延迟*和*缺失*标签反馈这一非常现实的问题。然而，它对于在干净的环境下比较学习算法非常有用，前提是我们能够访问或模拟一个拥有所有标签的流。\n\
  \n有两种循环变体值得一提。在*半监督*学习中，我们也使用未标记示例进行训练，因为它们至少提供了关于示例分布的信息。遗憾的是，关于半监督流学习的研究很少，尽管高速流中数据的丰富性使其前景广阔，且是解决延迟/缺失标签反馈问题的良好途径。在*主动学习*中，算法不期望获得所有实例的标签，而是有选择地挑选请求标签的实例。当每个标签理论上都可用但获取标签有成本时，这是一种好的方法。本书涵盖流式主动学习，但不涵盖半监督学习。\n\
  \n###### 2.2.1 数据流中的分类器评估\n\n鉴于此循环，合理的问题是：我们如何评估分类算法的性能？在传统的批量学习中，评估通常通过将数据随机分割为训练集和测试集（留出法）来执行；如果数据有限，则首选交叉验证（创建多个模型并跨训练和测试数据的多个随机分区平均结果）。\n\
  \n在流设置中，（实际上）无限的数据倾向于使交叉验证在计算上过于昂贵，且无论如何都不太必要。但它带来了新的挑战。主要挑战是建立随时间变化的准确性的准确图景。一种解决方案是在模型归纳过程中不同时间点拍摄快照，以观察模型准确性如何变化。由此产生两种主要方法：\n\
  \n* **留出法：** 这是在单个留出分区上衡量性能。当训练集和测试集之间的划分已预先定义时，它最为有用，以便不同研究的结果可以直接比较。然而，只有当留出集与当前数据相似时，留出法才能给出分类器当前准确性的准确估计，这在实践中可能难以保证。\n\
  * **交错测试后训练或预序列：** 每个单独示例在用于训练*之前*先用于测试模型，并以此增量更新准确率。当评估有意按此顺序执行时，模型始终在未见过的实例上接受测试。该方案的优势在于测试不需要留出集，从而最大限度地利用了可用数据。它还能确保随时间变化的准确率图平滑，因为每个单独示例对总体平均值的意义会越来越小。在测试后训练评估中，计算准确率时考虑了迄今为止见过的所有示例，而在预序列中，则仅考虑最近示例的滑动窗口中的那些。\n\
  \n由于数据流分类是一个相对较新的领域，此类评估实践远不如在传统批量设置中那样经过充分研究和确立。\n\n接下来，我们列举并描述一些最知名的流分类器。前两个非常简单，通常仅被视为评估其他分类器的基线。\n\
  \n###### 2.2.2 多数类分类器\n\n多数类分类器是最简单的分类器之一。它存储每个类标签的计数，并将新实例的类别预测为最频繁的类标签。\n\n######\
  \ 2.2.3 无变化分类器\n\n无变化分类器是另一个最简单的分类器：预测数据流中的最后一个类。它利用标签分配中的自相关性，这非常常见。\n\n######\
  \ 2.2.4 惰性分类器\n\n\n\n####### 惰性分类器\n\n惰性分类器基于一个非常简单的想法：分类器由保留部分已见实例组成，并利用最接近待预测类标签实例的那些实例的类标签进行预测。特别地，`k`近邻或`k`-NN\
  \ 方法输出最接近待预测实例的`k`个实例的多数类标签。\n\n对于该分类器，需要预先定义一种接近度或距离概念，且其性能取决于该距离相对于标签的意义程度。\n\n\
  ####### 示例 2.1\n\n考虑以下推文数据集，我们想在此基础上构建一个模型来预测新到达推文的情感（+ 或 −）。\n\n| **ID** | **文本**\
  \ | **情感** |\n| --- | --- | --- |\n| T1 | glad happy glad | + |\n| T2 | glad glad\
  \ joyful | + |\n| T3 | glad pleasant | + |\n| T4 | miserable sad glad | − |\n\n\
  假设我们要对以下新实例进行分类：\n\n| **ID** | **文本** | **情感** |\n| --- | --- | --- |\n| T5 | glad\
  \ sad miserable pleasant glad | ? |\n\n简单分类器将执行以下预测：\n\n*   **多数类分类器：** 多数类标签为 +，因此预测为\
  \ +。\n*   **无变化分类器：** 最后一个实例（T4）的类标签为 −，因此预测为 −。\n*   **惰性分类器：** 如果我们用共同单词的数量来衡量相似度，最接近\
  \ T5 的推文是 T4，其标签为 −。因此，1-NN 分类器预测 T5 为 −。\n\n###### 2.2.5 朴素贝叶斯\n\n朴素贝叶斯分类器是一种基于贝叶斯定理使用的简单分类器。基本思想是根据属性值计算每个类的概率，并选择概率最高的类。在假设所有属性相互独立的朴素假设下，可以通过将所有属性在特定取值下该特定类标签的条件概率相乘来计算类概率。独立性假设几乎总是错误的，但可以证明较弱的假设已足够，且朴素贝叶斯凭借其简洁性在各类任务中表现出惊人的优异性能。\n\
  \n###### 2.2.6 决策树\n\n决策树学习器从训练示例构建树结构，以预测未见示例的类标签。决策树的主要优势在于其预测易于理解。这就是为什么在不希望使用黑箱分类器的场景中（例如医疗健康相关应用），它们是最常用的分类器之一。\n\
  \n在流挖掘中，最先进的决策树分类器是 `Hoeffding tree`（霍夫丁树），由 Domingos 和 Hulten [88] 提出，及其变体。传统决策树会扫描整个数据集以发现形成数据初始划分的最佳属性。一旦找到，数据将按所选属性的值进行划分，并将算法递归地应用于生成的数据集，以构建子树。递归将持续直到满足某些停止准则。这种方法无法直接用于流设置，因为我们无法承担存储实例并反复扫描它们的资源成本（时间和内存）。\n\
  \n`Hoeffding tree` 基于这样的思想：我们不查看之前（存储的）实例来决定树中如何划分，而是等待接收足够多的实例，并在可以有信心地做出划分决策时才做决定。这种方法的主要优势是不需要存储实例。相反，保留足够统计量以做出划分决策。足够统计量使得将朴素贝叶斯模型整合到树的叶节点中变得容易。\n\
  \n`Hoeffding adaptive tree`（霍夫丁自适应树）[33] 是 `Hoeffding tree` 的扩展，当数据流演变且类标签分布或实例分布发生变化时，它能够创建和替换新分支。\n\
  \n###### 2.2.7 集成学习\n\n集成学习是分类器的集合，当它们组合在一起时，预测效果优于其中任何一个单独预测。如果我们使用相同的算法来构建集成中的所有分类器，我们将需要向算法提供不同的数据子集以使它们有所不同。`Bagging`（装袋法）是一种集成方法，它（1）使用通过对原始输入数据流有放回采样获得的子集作为分类器构建器每次运行的输入，（2）使用分类器的多数投票作为预测策略。\n\
  \n`ADWIN bagging` 方法 [38] 在 MOA 中实现为 `OZABAGADWIN`，是装袋法的扩展，当数据流演变且类标签分布发生变化时，它能够创建和替换新分类器。\n\
  \n##### 2.3 回归\n\n与分类一样，回归任务的目标是学习一个模型，用于预测标签未知实例的标签属性值。然而，这里的标签是一个实值，而不是离散值集合中的一个。精确预测标签是不现实的，因此目标是在某些度量下（如平均平方距离）尽可能接近正确值。\n\
  \n几种分类算法都有天然的回归对应版本，包括惰性学习和决策树。\n\n##### 2.4 聚类\n\n当我们拥有未标记实例并希望根据它们的相似性或亲和力在其中找到同质组或簇时，聚类很有用。与分类的主要区别在于，在学习过程之前这些组是未知的，学习之后我们也不知道它们是否是“正确”的。这就是为什么它被称为*无监督*学习。聚类的用途包括市场营销中的客户细分和社交网络中的社区发现。\n\
  \n我们可以将聚类视为一个优化问题，即我们希望最小化一个成本函数，该函数评估将示例划分为簇的“差异程度”。一些聚类方法需要被告知要在数据中寻找的期望簇数，而另一些则会自行发现一定数量的簇。\n\
  \n`k`-means（k 均值）聚类方法是聚类中最常用的方法之一，因其简洁性。它首先以随机方式选择 `k` 个质心。之后，重复两个步骤：首先，将每个实例分配给最近的质心；其次，通过计算分配给该质心的实例的质心（质心即中心）来重新计算簇质心。重复此过程直到满足某些停止准则，例如分配不再发生变化。它不是一种流式方法，因为它需要对同一数据进行多次遍历。\n\
  \n流式聚类方法通常有两个层次，一个在线层次和一个离线层次。在在线层次，从数据流中高效地计算和更新一组微簇；在离线阶段，在微簇上执行经典的批量聚类方法，如 `k`-means。在线层次仅对数据进行一次遍历；离线阶段执行多次遍历，但不是遍历所有数据，而是遍历微簇集合，这通常是一个相当小的、可控大小的集合。离线层次可以在流结束时（如果结束）调用一次，也可以随着流动定期调用以更新簇集合。\n\
  \n##### 2.5 频繁模式挖掘\n\n频繁模式挖掘是无监督学习中的一项重要任务。它可用于简单描述数据结构、发现关联规则，或发现可用于分类或聚类任务的判别特征。模式类别的示例包括项集、序列、树和图\
  \ [255]。\n\n\n\n问题如下：给定一个包含模式的数据源（批量数据集或数据流）和一个阈值 `σ`，找出所有在数据集中以至少 `σ` 的比例作为子模式出现的模式。例如，如果我们的数据源是超市购物记录流，且\
  \ `σ` = 10%，如果至少 10% 的购物记录同时包含奶酪*和*葡萄酒（或许还有其他产品），我们就称 {奶酪,葡萄酒} 为频繁模式。对于图而言，三角形可以是一个图模式，如果我们有一个图数据库，当至少\
  \ `σ` 比例的图至少包含一个三角形时，该模式即为频繁模式。\n\n在批量设置中，Apriori、Eclat 和 FP-growth 是在数据库中寻找频繁项集的三个最著名算法，其中每个项都是一个集合。针对序列和图等数据结构也存在类似的算法。然而，很难将它们直接迁移到流设置中，要么是因为它们需要对数据进行多次扫描，要么是因为它们存储了过多的信息。\n\
  \n流上频繁模式挖掘的算法通常以批量挖掘算法为基础，但需要实现其他思路；此外，它们通常是近似的而非精确的。Moment 和 IncMine 是数据流中频繁项集挖掘的算法。\n\
  \n### 3\n\n# MOA 实战入门\n\n在本章中，我们将开始使用 MOA，学习其基础知识，并运行一个比较两个分类器的简单示例。如果您具备非流式设置下数据挖掘的背景知识，本快速入门将帮助您探索其他选项，如聚类和频繁模式挖掘。否则，最好继续阅读第二部分，其中涵盖了这些技术。\n\
  \n#### 3.1 入门指南\n\n首先，我们需要从 [`moa.cms.waikato.ac.nz`](https://moa.cms.waikato.ac.nz)\
  \ 下载 MOA 的最新版本。它是一个压缩的 zip 文件，包含 `moa.jar` 文件，这是一个可执行的 Java jar 文件，既可作为 Java 应用程序使用，也可从命令行使用。该版本还包含\
  \ `sizeofag.jar` 文件，用于测量运行实验时的内存使用情况。脚本 `bin\\moa.bat`（Windows）和 `bin/moa.sh`（Linux\
  \ 和 Mac）是启动 MOA 图形用户界面的简便方式（图 3.1）。\n\n![Figure 3.1 MOA graphical user interface.](img/Fig3-1.png)\n\
  \n**图 3.1**  \n\nMOA 图形用户界面。\n\n点击 *Configure*（配置）以设置任务；准备好启动任务时，点击 *Run*（运行）。可以同时运行多个任务。点击列表中的不同任务，并使用下方的按钮进行控制。如果任务有文本输出可用，将显示在\
  \ GUI 中心，并可保存到磁盘。\n\n请注意，窗口顶部显示的命令行文本框代表可用于在命令行运行任务的文本命令。可以选中该文本，然后复制到剪贴板。GUI 底部有一个结果的图形化显示。可以比较两个不同任务的结果：当前任务以红色显示，先前选中的任务以蓝色显示。\n\
  \n作为示例，让我们使用默认的 RandomTreeGenerator 流生成器生成的 1,000,000 个实例，通过预先评估（prequential evaluation）来比较两个不同的分类器：朴素贝叶斯和决策树（图\
  \ 3.2）：\n\n```\nEvaluatePrequential -i 1000000 -f 10000 -l bayes.NaiveBayes\n\n\
  EvaluatePrequential -i 1000000 -f 10000 -l trees.HoeffdingTree\n```\n\n![Figure\
  \ 3.2 MOA GUI running two different tasks.](img/Fig3-2.png)\n\n**图 3.2**  \n\nMOA\
  \ GUI 运行两个不同任务。\n\n请记住，预先评估是一种在线评估技术，区别于批量设置中使用的标准交叉验证。每当一个新实例到达时，它首先被用于测试，然后用于训练。\n\
  \n您可以使用来自 ARFF 文件的流，这是由 WEKA 项目定义的一种方便的数据格式。示例 ARFF 数据集可从 [`moa.cms.waikato.ac.nz`](https://moa.cms.waikato.ac.nz)\
  \ 获取。\n\n```\nEvaluatePrequential -s (ArffFileStream -f elec.arff)\n```\n\n此外，您可以通过连接多个不同的流来生成具有概念漂移的流。例如，SEA\
  \ 概念数据集是通过连接四个不同的流生成的，每个流包含不同的 SEA 概念：\n\n```\nEvaluatePrequential\n-s (ConceptDriftStream\n\
  -s (generators.SEAGenerator -f 1) -d (ConceptDriftStream\n-s (generators.SEAGenerator\
  \ -f 2) -d (ConceptDriftStream\n-s generators.SEAGenerator\n-d (generators.SEAGenerator\
  \ -f 4)\n-w 50 -p 250000 )\n-w 50 -p 250000)\n-w 50 -p 250000)\n```\n\n#### 3.2\
  \ 分类的图形用户界面\n\n我们首先比较两个分类器的准确性。\n\n**练习 3.1** 对于由 1,000,000 个实例组成的 RandomTreeGenerator\
  \ 流，使用交错测试-再训练评估，比较 Hoeffding 树和朴素贝叶斯分类器的准确性。使用 10,000 个实例的采样频率，每 10,000 个实例输出一次评估结果。\n\
  \n我们配置并运行以下任务：\n\n```\nEvaluateInterleavedTestThenTrain -l bayes.NaiveBayes\n-i\
