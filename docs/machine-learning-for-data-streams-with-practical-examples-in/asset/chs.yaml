  \nc. 你能对 SPACESAVING 摘要做类似的事情吗？\n\n**练习 5.5** DDM 的缺点是在长时间无变化后，对变化的反应可能需要很长时间。建议几种修复方法，即使以引入一些参数为代价。\n\
  \n**练习 5.6** 面向数学：\n\n*   推导第 5.3.3 节给出的基于 Hoeffding 界的均值差异检验。\n\n*   考虑使用基于 Hoeffding\
  \ 检验的 ADWIN 实现。分析并描述 ADWIN 将如何对以下情况做出反应：\n\n    *   **突变流**：在一长段平均值为 *μ*[0] 的比特流后，某时刻\
  \ *T* 平均值突然变为 *μ*[1] ≠ *μ*[0]。\n\n    *   **渐变**：在一长段平均值为 *μ*[0] 的比特流后，时刻 *T* 起平均值开始线性增加，使得\
  \ *t > T* 时刻的平均值为 *μ*[*t*+1] = *μ*[*t*] + Δ，其中 Δ 为较小值。\n\n    推断 ADWIN 何时会宣布变化，以及从那时起窗口长度和平均值估计将如何演变。\n\
  \n**练习 5.7** 面向编程：编写一个随机比特流生成器，其中获得 1 的概率在长期无变化后突变或渐变。编写 Page-Hinkley 检验、DDM 检验以及第\
  \ 5.3.3 节中的三种检验（带参考窗口和滑动窗口）。比较第 5.3.1 节描述的这些检验的度量，包括最后三种检验的不同窗口大小。不要忘记对每个实验进行多次随机运行并取平均，以获得可靠的估计。\n\
  \n#### 第 6 章 分类\n\n分类是最广泛使用的数据挖掘技术之一。从非常一般的角度来看，给定一组群体（通常称为*类别*），分类旨在预测新实例可能属于哪个群体。分类的结果通常是识别单个群体，或给出每个群体的成员资格可能性的概率分布。它是*监督*学习最重要的情况，意味着可供学习算法使用的标签可用于指导它。垃圾邮件过滤器是一个很好的例子，我们要预测新邮件是否被视为垃圾邮件。Twitter\
  \ 情感分析是另一个例子，我们要预测新传入推文的情感是正面还是负面。\n\n更正式地说，分类问题可以表述如下：给定一组形式为 (*x, y*) 的带标签*实例*或*样本*，其中\
  \ *x* = *x*[1], ..., *x*[*k*] 是一个*特征*或*属性*值向量，*y* 是 *n*[*C*] 个不同*类别*之一，也被视为称为*类别*的离散属性的值。分类器构建算法构建一个分类器或模型\
  \ *f*，使得 *y* = *f*(*x*) 是任意无标签样本 *x* 的预测类别值。例如，*x* 可以是一条推文，*y* 是其情感极性；或者 *x* 可以是一封邮件，*y*\
  \ 是关于它是否为垃圾邮件的决定。大多数经典分类方法将所有训练数据加载到主内存，然后通过对数据的多次遍历来构建 *f*。在流设置中，*f* 通常是增量构建的，数据检查限制为单次遍历，实例逐个呈现。\n\
  \n\n\n\n\n##### 6.1 分类器评估\n\n我们首先回顾如何评估分类器、最流行的分类方法，以及它们如何应用于数据流环境。流环境下任何分类方法的两个重要特征是：在内存和时间方面存在限制（因此我们无法将所有实例存储在内存中），以及分类模型必须能够适应传入数据分布可能发生的变化。这些特征意味着精确解不太可能存在，因此我们应该期望近似解，并因此期望相关误差是有界的。误差界在某些方面是有问题的：当它们自身对生成误差的分布做出的假设很少时，它们往往是保守的（即在实践中，结果比界所预测的要好得多）。当它们确实做出假设时，它们可以与实验结果更加一致，但容易受到那些假设根本不成立的情况的影响。\n\
  \n第三个要求（本章未涉及）是应对特征空间变化的能力。例如，在传感器网络中，为某些特征提供值的一个或多个传感器可能会因故障或更换而时不时离线。替换的传感器可能是更新的型号，因此它们的测量方式可能与过去不同。事实上，传感器被永久移除也是合情合理的。几乎所有流分类算法都假设特征空间是固定的，无法轻松应对这种类型的变化。除了特征空间，类标签的集合也可能随时间变化。因此，算法需要能够应对新类标签的增加和现有类标签的删除。`x`\
  \ 和 `y` 中的这两种变化都代表了开发新的流分类算法的沃土。\n\n评估是所有数据挖掘过程中最基本的任务之一，因为它有助于决定哪些技术更适合特定问题，以及如何设置参数。主要挑战在于判断一种方法优于另一种方法是否仅属巧合，抑或该说法具有统计显著性。流挖掘中应用的一些方法论与非流式数据（所有数据均可存储在内存中）的情况相同。然而，挖掘数据流带来了新的挑战，必须使用修改后的评估方法论。\n\
  \n在继续之前，有一点值得注意：数据挖掘中几乎所有的发现，特别是分类，都假设数据是独立同分布（IID）的。因此，平稳分布以无特定顺序随机产生数据，且生成数据的底层分布不发生变化。在流式环境中，IID\
  \ 假设的任何部分都不再成立。例如，在某些时间段内，实例的标签或类别往往是相关的。在入侵检测中，存在漫长的时期所有类标签均为“非入侵”，夹杂着不频繁、短暂的入侵时期。这是数据流挖掘的另一个方面，将从进一步的研究中受益。\n\
  \n评估框架应由以下部分组成：\n\n*   误差估计，\n*   评估性能度量，\n*   统计显著性验证，以及\n*   过程的代价度量。\n\n对于演化数据流，与传统数据挖掘评估的主要区别在于如何进行误差估计。资源有限，交叉验证可能代价太高。我们首先探讨如何定义和估计准确率，然后看哪些度量最适合衡量算法性能。最后我们回顾一些用于检验显著性和衡量整个过程代价的统计技术。\n\
  \n###### 6.1.1 误差估计\n\n学习算法的评估程序决定哪些示例用于训练算法，哪些用于测试算法输出的模型。\n\n在传统的批量学习中，第一种方法是将数据集拆分为不相交的训练集和测试集。如果数据有限，则首选交叉验证：我们创建多个模型，并使用训练和测试数据的不同随机排列来平均结果。\n\
  \n在流环境中，（实际上）无限的数据带来了不同的挑战。交叉验证通常计算代价太高，且不那么必要。另一方面，描绘随时间变化的准确率图景至关重要。主要出现以下几种方法：\n\
  \n*   **留出法：** 当数据极其丰富，以至于可以定期拥有测试集时，我们可以在这些留出集上衡量性能。有一个用于持续训练学习器的训练数据流，以及用于定期计算性能的小型测试数据集。在\
  \ `MOA` 中，实现这一概念要求用户指定两个参数（假设为 `j` 和 `k`）：`j` 是用于测试的第一个窗口（实例集）的大小，`k` 是测试频率——即每\
  \ `k` 个实例测试一次（使用大小为 `j` 的测试集）。\n\n*   **交织测试后训练：** 每个单独的示例可在用于训练*之前*先用于测试模型，并据此增量更新准确率。因此，模型始终在其未见过的示例上接受测试。在\
  \ `MOA` 中，该方案使用地标窗口模型实现（考虑从流开始到现在的数据）。\n\n*   **预测式：** 类似于交织测试后训练，但在 `MOA` 中——实现了更近期的示例更重要这一理念，使用滑动窗口或衰减因子。滑动窗口的大小和衰减因子是参数。\n\
  \n*   **交织数据块：** 也类似于交织测试后训练，但按顺序使用数据块。可能需要考虑不同大小的数据块（这是 `MOA` 实现中的一个参数）。\n\n请注意，如果我们将滑动窗口的大小设置为整个数据集中的实例数量，则中间两种方案等价。\n\
  \n留出法评估能更准确地估计分类器在近期数据上的准确率。然而，它需要难以针对真实数据集获取的近期测试数据。还存在一个问题，即如何确保涵盖重要的变化事件：如果留出测试发生在变化不剧烈的时期，则可能会高估分类器性能。\n\
  \nGama 等人 [115] 提出了一种利用预测式准确率来估计留出法准确率的遗忘机制：包含最近观测值的大小为 `w` 的滑动窗口，或使用衰减因子 `α` 对观测值加权的衰减因子法。衰减因子\
  \ `α` 的使用如下：\n\n```\nn[i] = 1\n```\n\n其中\n\n```\nL[i] = α * L[i-1] + (1 - α) * loss(i)\n\
  ```\n\n此处 `n[i]` 是用于计算损失函数 `L[i]` 的示例数量。我们令 `n[i] = 1`，因为损失 `L[i]` 是针对每个单独示例计算的。\n\
  \n这两种机制的输出非常相似，因为大小为 `w` 的窗口可以用衰减因子 `α ∼ 1/w` 来近似。图 6.1 展示了留出法评估、交织测试后训练评估，以及使用大小为\
  \ 1,000 的滑动窗口的预测式评估的对比。观察图 6.1 中的曲线，对于该数据集而言，使用滑动窗口的预测式评估似乎是留出法评估的一个良好近似。\n\n![图\
  \ 6.1 对包含 1,000,000 个实例的流进行评估，对比留出法、交织测试后训练法、以及带滑动窗口的预测式评估方法。](img/Fig6-1.png)\n\
  \n**图 6.1**  \n\n\n\n\n\n####### 在包含 1,000,000 个实例的数据流上进行评估，对比保留集、交错测试后训练以及带滑动窗口的预训练评估方法。\n\
  \n###### 6.1.2 分布式评估\n\n在分布式数据流设置中，我们拥有可以同时训练的分类器。这提供了一个实现类似经典 `k` 折交叉验证的机会。针对该设置下的评估，已提出多种方法以涵盖数据丰富或稀缺、以及待比较分类器数量的不同组合\
  \ [40]：\n\n*   **`k` 折分布式分割验证：** 适用于数据丰富且有 `k` 个分类器的情况。每当一个新实例到达时，以概率 `1/k` 决定它是否用于测试。如果用于测试，则由所有分类器使用。如果不用于测试，则用于训练，并仅分配给一个分类器。因此，每个分类器看到的实例不同，但它们使用相同的数据进行测试。\n\
  \n*   **`5x2` 分布式交叉验证：** 适用于数据较少，且我们想仅使用（例如）十个分类器的情况。我们创建五组分类器对，对于每一组，每当一个新实例到达时，以概率\
  \ `1/2` 决定这两个分类器中的哪一个用于测试；该组的另一个分类器用于训练。所有实例均用于测试或训练，测试实例与训练实例之间没有重叠。\n\n*   **`k`\
  \ 折分布式交叉验证：** 适用于数据稀缺且我们有 `k` 个分类器的情况。每当一个新实例到达时，它被随机选定的一个分类器用于测试，并被其他分类器用于训练。这种评估等同于\
  \ `k` 折分布式交叉验证。\n\n###### 6.1.3 性能评估度量\n\n在真实数据流中，每个类别的实例数量可能在不断演变和变化。有人可能会认为，预训练准确率度量仅适用于所有类别平衡且拥有大致相同示例数量的情况。Kappa\
  \ 统计量是一种对量化流式分类器预测性能更敏感的度量。\n\nKappa 统计量 `κ` 由 Cohen [76] 提出，定义如下：\n\n![](img/pg90-1.png)\n\
  \n其中 `p[0]` 是分类器的预训练准确率，`p[c]` 是随机分类器——即以与待考察分类器相同的数量随机分配示例给每个类别的分类器——做出正确预测的概率。如果分类器总是正确的，则\
  \ `κ = 1`。如果其预测与正确结果一致的频率与随机分类器相同，则 `κ = 0`。\n\nKappa M 统计量 `κ[m]` [40] 是一种与多数类分类器而非随机分类器进行比较的度量：\n\
  \n![](img/pg90-2.png)\n\n在预测类别的分布与实际类别的分布存在显著差异的情况下，多数类分类器的表现可能优于给定分类器，而该分类器却拥有正的\
  \ `κ` 统计量。\n\nKappa 统计量的一种替代方案是计算接收者操作特征曲线下面积 AUC。Brzezinski 和 Stefanowski 在文献 [59]\
  \ 中提出了一种增量算法，该算法使用带有滑动窗口的排序树结构来计算带遗忘机制的 AUC。由此产生的评估度量称为预训练 AUC，也可在 `MOA` 中使用。\n\n\
  另一种 Kappa 度量，Kappa 时间统计量 [42, 262]，考虑了数据流中时间依赖性的存在。其定义为\n\n![](img/pg91-1.png)\n\
  \n其中 ![](img/pg91-in-1.png) 是无变化分类器的准确率，该分类器只是简单地重复最后接收到的标签（第 6.2.2 节），当相同标签成批出现时，这是一个简单且有用的分类器。\n\
  \n统计量 `κ[per]` 取值范围为 0 到 1。其解释类似于 `κ`：如果分类器完全正确，则 `κ[per] = 1`。如果分类器达到的准确率与无变化分类器相同，则\
  \ `κ[per] = 0`。优于无变化分类器的分类器介于 0 和 1 之间。有时 `κ[per] < 0`，这意味着分类器的表现比无变化基线更差。\n\n使用\
  \ `κ[per]` 代替 `κ[m]`，我们可以检测非 IID 数据的误导性分类器性能。对于高度不平衡但独立分布的数据，多数类分类器可能击败无变化分类器。`κ[per]`\
  \ 和 `κ[m]` 度量可视为正交的，因为它们衡量性能的不同方面。\n\n其他关注类别间不平衡的度量包括算术平均和几何平均：\n\n![](img/pg91-2.png)\n\
  \n其中 `A[i]` 是类别 `i` 上的测试准确率，`n[c]` 是类别数量。请注意，多数投票分类器的几何准确率将为 0，因为除多数类外其他类别的准确率均为\
  \ 0。完全正确的分类器准确率为 1。如果分类器在所有类别上的准确率相等，则算术平均和几何平均准确率均等于常规准确率。\n\n考虑 表 6.1 所示的简单混淆矩阵。从该表中我们可以看到，Class+\
  \ 正确预测了 75 次，Class− 正确预测了 10 次。因此准确率 `p[0]` 为 85%。然而，一个仅按给定比例随机预测的分类器将分别以 68.06%\
  \ 和 3.06% 的概率正确预测 Class+ 和 Class−。因此，其准确率 `p[c] = 71.12%`，`κ = 0.48`；多数类分类器的准确率\
  \ `p[m] = 75%`，`κ[m] = 0.40`。\n\n**表 6.1**\n\n简单混淆矩阵示例。\n\n| | 预测 | 预测 | |\n| ---\
  \ | --- | --- | --- |\n| | Class+ | Class− | 总计 |\n| 实际 Class+ | 75 | 8 | 83 |\n\
  | 实际 Class− | 7 | 10 | 17 |\n| 总计 | 82 | 18 | 100 |\n| | | | |\n\nClass+ 的准确率为 90.36%，Class−\
  \ 为 58.82%。算术平均 `A` 为 74.59%，几何平均 `G` 为 72.90%。因此我们看到 `A ≥ G`，且 `G` 趋向于较低值。\n\n\
  设想如 表 6.2 所示，Class− 的误分类示例数量增加到 57。此时，Class− 的准确率下降至 14.92%，`κ` 降至 0.05，`κ[m]` 降至\
  \ 0.13。算术平均 `A` 变为 52.64%，几何平均 `G` 变为 36.72%。\n\n**表 6.2**\n\n表 6.1 的修改版混淆矩阵。\n\n\
  | | 预测 | 预测 | |\n| --- | --- | --- | --- |\n| | Class+ | Class− | 总计 |\n| 实际 Class+\
  \ | 75 | 8 | 83 |\n| 实际 Class− | **57** | 10 | **67** |\n| 总计 | **132** | 18 | **150**\
  \ |\n| | | | |\n\n###### 6.1.4 统计显著性\n\n在评估分类器时，我们应关注结果的统计显著性。仅观察单个分类器的性能时，提供关于其统计显著性的一些见解是很方便的。我们可以使用参数估计的*置信区间*来指示估计的可靠性。为此，我们可以使用\
  \ Chernoff 界或 Hoeffding 界，它们比 Markov 不等式或 Chebyshev 不等式更精确，因为我们关心的度量是对单个项目评估的平均值。对于数量合理的大量数据点，通常适用正态分布近似；参见第\
  \ 4.2 节。\n\n\n\n\n####### 当比较两个分类器时\n\n当比较两个分类器时，我们需要区分实验准确率中的随机差异和非随机差异。McNemar\
  \ 检验 [173] 是流挖掘文献中最流行的非参数检验，用于评估两个分类器性能差异的统计显著性。该检验需要存储和更新两个变量：被第一个分类器误分类而第二个分类器未误分类的实例数\
  \ `a`，以及被第二个分类器误分类而第一个分类器未误分类的实例数 `b`。McNemar 统计量计算公式为 `M = |a − b − 1|²/(a + b)`。该检验服从\
  \ `χ²` 分布。在 0.99 置信度下，如果 `M > 6.635`，则拒绝原假设（即性能相等）。\n\n尽管机器学习领域已有数十年历史，但关于比较分类器性能以及随之而来的显著性能差异度量问题，仍存在诸多争论。最新的贡献来自\
  \ Berrar [29]，他认为应关注性能差异的大小（以及该差异的合理界限），而非统计显著性。这项工作的成果是一种名为置信曲线的新评估工具，可直接显示差异大小。原假设显著性检验和\
  \ `p` 值的相关问题，也最近促使人们提出了该问题的贝叶斯替代方案 [78]。因此，目前无法给出关于性能度量的定论，因为经典和流式机器学习仍需进一步研究。特别是，尚未提出用于估计数据流随时间变化的效应量的度量。\n\
  \n###### 6.1.5 挖掘过程的成本度量\n\n同时度量三个评估维度的问题，导致了数据流挖掘中的另一个重要问题，即估算学习和预测过程在时间和内存方面的综合成本。例如，存在多种租赁成本选项：\n\
  \n*   **每小时使用成本**：Amazon Elastic Compute Cloud (Amazon EC2) 是一项提供云端可调整计算容量的 Web\
  \ 服务。成本取决于时间和所租机器的规模（例如，配备 2 GB 内存的小型实例、8 GB 的大型实例或 16 GB 的超大型实例）。\n*   **每小时及内存使用成本**：GoGrid\
  \ 是一项类似于 Amazon EC2 的 Web 服务，但它按 RAM-小时收费。按定义，部署 1 GB 内存 1 小时即等于 1 RAM-小时。\n\n上述定义的\
  \ RAM-小时的使用，在文献 [37] 中被引入作为流式算法所用资源的评估度量。尽管是为学习任务提出的，但它也可应用于其他数据挖掘任务。\n\n##### 6.2\
  \ 基准分类器\n\n批量学习促成了数百种不同分类器的发展，它们属于多种范式，如分治法、规则学习器、惰性学习器、核方法、图模型等。若要将这些范式中的方法 `streamify`（流式化），我们需要考虑如何使它们既增量又快速。有些方法天然具有增量和快速的特性，我们将从这些方法开始介绍。关于将批量方法应用于大型数据集的研究告诉我们，应寻找具有良好偏差管理能力的方法。如果一种方法具有高偏差（如我们接下来将介绍的方法），则其泛化能力将受到限制。产生更复杂模型的方法通常泛化能力更好，但必然具有更高的维护成本，并应控制过拟合。产生能够良好管理权衡（模型表示的复杂性与模型更新的速度）的方法，是数据流分类研究中的主要问题。\n\
  \n###### 6.2.1 多数类\n\n`Majority Class`（多数类）算法是最简单的分类器之一：它预测新实例的类别为最频繁的类别。它主要用作基准，也可用作决策树叶节点上的默认分类器。`Majority\
  \ Class` 分类器非常易于计算和维护，因为它只需为每个类别保留一个计数器数组。\n\n###### 6.2.2 无变化分类器\n\n另一种用于数据流的简单分类器是\
  \ `No-change`（无变化）分类器，它预测新实例的标签为前一个实例的真实标签。与 `Majority Class` 分类器一样，它不需要实例特征，因此非常易于实现。在入侵检测场景中，长时间的“无入侵”后伴随短暂的“入侵”时期，该分类器仅在边界情况下会出错，并能快速适应标签的一致模式。\n\
  \n当怀疑连续标签之间存在时间依赖性时，通常将前一个实例（或多个实例）的标签作为新属性添加进去是有益的。这种能力在文献 [42, 262] 中提出，在 MOA\
  \ 中作为通用包装器 `TEMPORALLYAUGMENTEDCLASSIFIER` 可用。\n\n###### 6.2.3 朴素贝叶斯\n\n`Naive Bayes`（朴素贝叶斯）是一种以计算成本低、简单著称的分类算法。作为一种增量算法，它非常适合数据流场景。然而，它假设属性之间相互独立，这在许多真实数据流中可能并不成立。\n\
  \n它基于贝叶斯定理，非正式表述如下：\n\n```\nPr(c|d) = Pr(c)Pr(d|c) / Pr(d)\n```\n\n即，它说明了在考虑证据后事件概率如何被修正。更正式地表述为：\n\
  \n```\nPr(c|d) = Pr(c)Pr(d|c) / Pr(d)\n```\n\n其中 `Pr(c)` 是先验概率，即事件 `c` 的初始概率；`Pr(c|d)`\
  \ 是后验概率，即考虑 `d` 后的概率；`Pr(d|c)` 是似然概率，即事件 `c` 发生时事件 `d` 的概率；`Pr(d)` 是事件 `d` 的概率。它基于条件概率的定义，即\
  \ `Pr(c ∩ d) = Pr(c)Pr(d|c) = Pr(d)Pr(c|d)`。\n\n`Naive Bayes` 模型的构建过程如下：设 `x[1],\
  \ …, x[k]` 为 `k` 个离散属性，假设 `x[i]` 可取 `n[i]` 个不同值。设 `C` 为类别属性，可取 `n[C]` 个不同值。收到一个无标签实例\
  \ `I = (x[1] = v[1],…,x[k] = v[k])` 时，`Naive Bayes` 分类器按如下方式计算 `I` 属于类别 `c` 的“概率”：\n\
  \n```\nPr(c|I) = Pr(c) ∏ Pr(x[i] = v[j] | c)\n```\n\n值 `Pr(x[i] = v[j] ∧ C = c)`\
  \ 和 `Pr(C = c)` 从训练数据中估计得出。因此，训练数据的摘要仅是一个三维表，用于存储每个三元组 `(x[i], v[j], c)` 的计数 `n[i,j,c]`，即满足\
  \ `x[i] = v[j]` 且类别为 `c` 的训练实例数，连同一个用于 `C = c` 计数的一维表。该算法天然具有增量性：收到新样本（或一批新样本）时，只需增加相关计数即可。可随时根据当前计数进行预测。\n\
  \n####### 示例 6.1\n\n假设我们有以下推文数据集，并且想要构建一个模型来预测新到达推文的极性。\n\n| **ID** | **文本** | **情感**\
  \ |\n| --- | --- | --- |\n| T1 | glad happy glad | + |\n| T2 | glad glad joyful\
  \ | + |\n| T3 | glad pleasant | + |\n| T4 | miserable sad glad | − |\n\n首先，我们将与每个实例关联的文本转换为属性向量。\n\
  \n```\n向量表示\n```\n\n现在，我们可以建立一个包含每个类别计数的表：\n\n```\n计数表\n```\n\n假设我们要对以下新实例进行分类：\n\
  \n| **ID** | **文本** | **情感** |\n| --- | --- | --- |\n| T5 | glad sad miserable pleasant\
  \ glad | ? |\n\n首先，将其转换为属性向量。\n\n```\nT5 的向量\n```\n\n现在我们按如下方式计算概率：\n\n*   `Pr(+|T5)\
  \ = Pr(+) · Pr(glad = 1|+) · Pr(happy = 0|+) · Pr(joyful = 0|+) · Pr(pleasant =\
  \ 1|+) · Pr(miserable = 1|+) · Pr(sad = 1|+)`, 因此\n\n```\nPr(+|T5) = 0.75 * (3/3)\
  \ * (1/3) * (1/3) * (1/3) * (0/3) * (1/3) = 0\n```\n\n\n\n\n###### 6.2.4 多项式朴素贝叶斯\n\
  \n多项式朴素贝叶斯分类器 [171] 是用于文档分类的朴素贝叶斯扩展，通常能产生令人惊讶的良好结果。多项式朴素贝叶斯将文档视为词袋，因此它考虑了文档中每个词的频率，而不仅仅是其出现与否。由于词频通常与文本分类相关，因此与朴素贝叶斯相比，该方法在文本挖掘中更受青睐。\n\
  \n设 `n[wd]` 为词 `w` 在文档 `d` 中出现的次数。则给定测试文档的类别 `c` 的概率计算如下：\n\n```\nPr(c|d) = Pr(c)\
  \ * ∏ Pr(w|c)^n[wd] / Pr(d)\n```\n\n其中 `Pr(d)` 可被视为归一化因子。\n\n但与朴素贝叶斯的一个关键区别在于对 `Pr(w|c)`\
  \ 的解释：这里它是类别 `c` 的文档中 `w` 的出现次数与类别 `c` 的文档中总词数之比。换句话说，它是属于类别 `c` 的文档在任意位置观察到词 `w`\
  \ 的概率。请注意，同样与朴素贝叶斯不同，文档中某词的缺失并不会使任何类别比其他类别更有可能，因为这相当于 0 次幂。\n\n方便的是，通过维护适当的计数器，`n[wd]`、`Pr(w|c)`\
  \ 和 `Pr(c)` 在数据流上很容易估计。可以通过将所有计数初始化为 1 而不是 0 来添加拉普拉斯修正。\n\n**示例 6.2** 假设我们想使用示例\
  \ 6.1 中的推文构建一个多项式朴素贝叶斯分类器。首先，我们计算每个词在每个文档中的出现次数。我们使用拉普拉斯修正，在开始计数前将每个条目设置为 1：\n\n\
  ![](img/pg99-1.png)\n\n现在每个类别的概率为：\n\n*   `Pr(+|T5) = Pr(+) · Pr(glad|+) · Pr(pleasant|+)\
  \ · Pr(miserable|+) · Pr(sad|+)`，\n\n![](img/pg99-2.png)\n\n*   `Pr(−|T5) = Pr(−)\
  \ · Pr(glad|−) · Pr(pleasant|−) · Pr(miserable|−) · Pr(sad|−)`，\n\n![](img/pg99-3.png)\n\
  \n在这种情况下，我们看到 `Pr(+|T5) > Pr(−|T5)`，多项式朴素贝叶斯分类器预测新推文具有正极性，这与预测为负极性的普通朴素贝叶斯形成对比。\n\
  \n##### 6.3 决策树\n\n*决策树* 是一种非常流行的分类器技术，因为树模型非常容易解释和可视化。在决策树中，每个内部节点对应一个属性，该属性针对每个属性值分裂出一个分支，而叶节点对应分类预测器，通常是多数类分类器。图\
  \ 6.2 显示了一个示例。\n\n![图 6.2 描述用于判断邮件是否为垃圾邮件的邮件特征的数据集，及其对应的决策树。](img/Fig6-2.png)\n\n\
  **图 6.2**\n\n描述用于判断邮件是否为垃圾邮件的邮件特征的数据集，及其对应的决策树。\n\n可以通过在叶节点使用其他分类器（如朴素贝叶斯）或使用决策树集成（稍后将看到）来提高决策树的准确性。\n\
  \n构建树的基本方法是首先在开头创建一个根节点 `node = root`，然后执行以下操作：\n\n1.  如果训练实例在该节点被完美分类，则停止。否则：\n\
  2.  将 `A` 分配为 `node` 的“最佳”决策属性。\n3.  对于 `A` 的每个值，创建 `node` 的新后代（叶节点）。\n4.  根据 `A`\
  \ 的值分割训练实例，并将每个分割传递给相应的叶节点。\n5.  递归地将此方法应用于每个叶节点。\n\n两种常用度量用于选择最佳决策属性：\n\n*   **信息增益**，即按属性分裂前后类别熵的差值。回想一下，样本\
  \ `S` 的熵 `H` 为 `H(S) = -∑ p[c] log p[c]`，其中 `p[c]` 是 `S` 中类别标签 `c` 的概率。按属性 `A` 分裂后\
  \ `S` 的熵为 `H(S,A) = ∑ (|S[a]|/|S|) H(S[a])`，其中 `S[a]` 是 `A` 取值为 `a` 的 `S` 的子集。`A`\
  \ 的信息增益为 `IG(S,A) = H(S) − H(S,A)`。该度量在 C4.5 决策树算法后变得流行。\n*   **基尼不纯度减少**，即按属性分裂前后基尼指数的差值。该度量在\
  \ CART 决策树算法后变得流行。随机变量 `C` 的基尼指数是 `C` 离散程度的另一种非线性度量，定义为 `Gini(C) = 1 - ∑ p[c]²`。\n\
  \n###### 6.3.1 估计分裂准则\n\n上述度量需要从有限样本中估计，但要以一种能泛化到未来示例的方式进行（即无论现在还是一个月、一年、十年后做出决策，假设平稳性，决策仍将相同）。这需要第\
  \ 4.2 节所述那些浓度不等式精神的不等式，它们限定了有限样本上的估计值偏离其期望值的概率。\n\n霍夫丁不等式常用于估计信息增益或基尼指数等度量。不幸的是，这些度量不能表示为独立随机变量之和，因此\
  \ Rutkowski 等人 [218] 近期的工作指出霍夫丁界是错误的工具。\n\n然而，霍夫丁不等式的一种推广称为麦克迪阿米德不等式，可用于利用这些度量做分裂决策，因为它显式地作用于数据的函数\
  \ [218]。对于信息增益 `IG`，可以证明对于任意两个属性 `A` 和 `B`：如果 `E[S][IG(S,A) − IG(S,B)] > ε`，则以概率\
  \ `1 − δ` 有 `IG(S,A) − IG(S,B) > 0`，其中 `ε = √( (ln(1/δ)) / (2n) ) * (log n_c)`，`n`\
  \ 是 `S` 的大小，`n[c]` 是类别数。基尼指数的公式更简单：只需 `ε = √( (ln(1/δ)) / (2n) )` 即可。文献 [215] 给出了类似的界。错误分类率也可使用\
  \ [217]，最终给出一个与霍夫丁界非常相似的界。\n\n请注意，我们对流式决策树工作的描述采取了历史视角。麦克迪阿米德界的使用是该特定方法的前沿成果，代表了相对较新的结果。未来霍夫丁树可能会被证明在*假设不成立*的意义上是**不正确**的，然而它们在实践中仍然非常有效，因此值得研究。\n\
  \n###### 6.3.2 霍夫丁树\n\n\n\n\n\n####### Hoeffding 树及其扩展\n\n######## Hoeffding 树\n\
  \n在数据流场景中，由于无法存储所有数据，构建决策树的主要问题是需要重复使用实例来计算最佳分裂属性。Domingos 和 Hulten [88] 提出了 Hoeffding\
  \ 树，这是一种用于流数据的极快决策树算法，它不重复使用实例，而是等待新实例到达。Hoeffding 树最有趣的特性在于，它构建的树在理论上能收敛于批量学习器在拥有足够大数据时构建的树；本节稍后将给出这一等价性的更精确表述。\n\
  \nHoeffding 树的伪代码如 图 6.3 所示。它基于第 4.2 节讨论的 Hoeffding 界。根据该界，文献 [88] 的提议是，将节点处熵估计的置信区间选为以下值：\n\
  \n```\nε = √(R² ln(1/δ) / 2n)\n```\n\n其中 `R` 是随机变量的取值范围，`δ` 是估计值*不*在其期望值 `ε` 范围内的期望概率，`n`\
  \ 是在该节点收集到的示例数量。对于信息增益，熵的取值范围为 `[0,…,log n[c]]`，其中 `n[c]` 为类别值的数量。尽管如前所述，在此语境下使用\
  \ Hoeffding 界在形式上是不正确的，但它仍被大多数实现所采用；它取得合理结果的原因可能在于，在大多数情况下，它给出了真实错误概率的高估。\n\n![图\
  \ 6.3 Hoeffding 树算法。](img/Fig6-3.png)\n\n**图 6.3** Hoeffding 树算法。\n\nHoeffding 树算法在每个节点中维护分裂属性所需的统计信息。对于离散属性，这与计算朴素贝叶斯预测所需的信息相同：一个三维表，用于存储每个三元组\
  \ `(x[i], v[j], c)` 的计数 `n[i,j,c]`，即满足 `x[i] = v[j]` 的训练实例数量，连同一个用于 `C = c` 计数的一维表。所需内存取决于树的叶子数量，而不取决于数据流的长度。\n\
  \nHoeffding 树一个具有理论吸引力的特性——其他增量决策树学习器不具备——是它拥有可靠的性能保证。文献 [88] 证明了其输出在以下意义上与使用无限多示例的非增量学习器渐近近似相同。\n\
  \n两棵决策树 `DT[1]` 和 `DT[2]` 之间的*内涵分歧* `Δ[i]`，是指一个示例通过 `DT[1]` 的路径与其通过 `DT[2]` 的路径在长度、测试属性或叶节点处的类别预测上出现差异的概率。文献\
  \ [88] 严格证明了以下结果：设 `HT[δ]` 为 Hoeffding 树算法以参数 `δ` 从无限示例流中产生的树，`DT` 为从无限批量数据构建的批量树，`p`\
  \ 为 `DT` 中叶节点的最小概率。则有 `EΔ[i] ≤ δ/p`。\n\nDomingos 和 Hulten [88] 将 Hoeffding 树算法改进为一种更实用的方法，称为极快决策树（VFDT），具有以下特征：\n\
  \n*   **平局处理**：当两个属性具有相似的分裂增益 `G` 时，改进方法会在 Hoeffding 界低于某个阈值参数 `τ` 时进行分裂。\n\n  \
  \  ```\n    G_best - G_second_best < ε\n    ```\n\n*   为加快处理速度，VFDT 不在每个新实例到达时都计算最佳分裂属性，而是在每\
  \ `n_min` 个实例到达时计算一次。\n\n*   为减少挖掘过程中的内存使用，VFDT 会停用最不具潜力的节点，即乘积 `p[l] × e[l]` 最低的节点，其中\n\
  \    *   `p[l]` 是到达叶节点 `l` 的概率，且\n    *   `e[l]` 是节点 `l` 中的误差。\n\n*   该方法可从任何预先存在的决策树开始，例如，从可用的一批数据构建的树开始。Hoeffding\
  \ 树生长缓慢且初期性能可能较差，因此此扩展为学习曲线提供了即时提升。\n\n值得注意的是，关于 VFDT 方法的最后一点，研究非常少。初期学习缓慢是这些树的一个问题，通过初始决策树进行引导以创建更好的起点是合理的。\n\
  \n改进 Hoeffding 树分类性能的一种方法是在叶节点使用朴素贝叶斯学习器，而不是多数类分类器。Gama 和 Medas [113] 首次在 Hoeffding\
  \ 树叶节点中使用朴素贝叶斯，替代了多数类分类器。然而，Holmes 等人 [135] 发现了一些情况：朴素贝叶斯方法初期优于标准 Hoeffding 树，但最终被后者超越。为了解决这个问题，他们提出了一种混合自适应方法，该方法通常在简单和复杂概念上都优于这两种原始预测方法：在对测试实例进行预测时，如果朴素贝叶斯预测的总体准确率高于多数类预测，则叶节点返回朴素贝叶斯预测，否则返回多数类预测。唯一的开销是维护两个计数器，记录每个分类器正确的次数。\n\
  \n###### 6.3.3 CVFDT\n\nHulten 等人 [138] 提出了概念适应极快决策树（CVFDT）算法，作为 VFDT 的扩展以处理概念漂移，维护一个与滑动窗口中存储的实例一致的模型。遗憾的是，此类树不像\
  \ Hoeffding 树那样拥有理论保证。值得注意的是，从理论上讲，Hoeffding 树在一定程度上可以适应概念漂移，因为在平稳分布下不再生长的叶节点，如果收集到的证据表明进一步分裂能提高准确性，可能会重新开始生长。然而，这一过程在实践中太慢。\n\
  \n![图 6.4 CVFDT 算法。](img/Fig6-4.png)\n\n**图 6.4** CVFDT 算法。\n\n图 6.4 展示了 CVFDT 算法的代码草图；更完整的描述见上文引用。它与\
  \ Hoeffding 树的代码相似，但有以下变化。注意此处我们使用了“移除”和“遗忘”这两个看似相同的术语。它们是不同的，因为遗忘是一个复杂的过程，它从树中移除一个实例。相比之下，添加和移除实例仅适用于滑动窗口。\n\
  \n*   主方法维护一个包含最新实例的滑动窗口，因此它必须添加、移除和遗忘实例。\n*   主方法调用过程 `CVFDTGROW` 处理示例，同时也调用方法\
  \ `CHECKSPLITVALIDITY` 检查所选分裂是否仍然有效。\n*   `CVFDTGROW` 还会更新排序过程中遍历节点的计数。\n*   如果当前选为分裂的属性与分裂时选定的属性不同，`CHECKSPLITVALIDITY`\
  \ 将创建一个备选子树。\n*   算法定期检查备选分支的表现是否优于原始分支树，如果是则替换原始分支，否则移除备选分支。\n\n###### 6.3.4 VFDTc\
  \ 和 UFFT\n\nVFDTc 和 UFFT 是两种将 Hoeffding 树扩展以处理数值属性和概念漂移的方法。Gama 等人 [111] 开发的 VFDTc\
  \ 执行以下操作：\n\n1.  它在叶节点保留朴素贝叶斯学习器以进行预测。\n2.  它使用二叉树处理数值属性，如第 6.4.2 节所述。\n3.  为处理概念漂移，它使用第\
  \ 5.3.4 节所述的统计 DDM 方法。\n\n\n\n\n\n####### 超快树林（UFFT）\n\n超快树林（UFFT）由 Gama 和 Medas\
  \ [113] 开发，可生成一组二叉树，为每一对可能的类别各生成一棵。这些树在每个节点都包含一个 `Naive Bayes` 分类器，类似于 `VFDTc`。与\
  \ `VFDTc` 的主要区别在于对数值属性的处理方式。\n\nUFFT 使用分析技术来选择分裂标准，并利用信息增益来估计每个可能分裂测试的优劣。针对多分类问题，该算法为每一对可能的类别构建一棵二叉树，从而形成一个树林，对于\
  \ *k* 分类问题，该树林包含 *k*(*k* − 1)/2 个分类器。该分析方法采用了一种修改形式的二次判别分析，以纳入两个类别上不同的方差。\n\n######\
  \ 6.3.5 Hoeffding 自适应树\n\n*Hoeffding 自适应树* [33] 是 Hoeffding 树的一种自适应扩展，它使用 `ADWIN`\
  \ 作为变化检测器和误差估计器。它具有性能方面的理论保证，且不需要与变化控制相关的参数。相比之下，`CVFDT` 没有理论保证，并且需要若干个带有默认值的参数，这些默认值可由用户更改，但在给定的执行过程中是固定的。它需要：\n\
  \n1.  **`W`**：样本窗口大小。\n2.  **`T[0]`**：每 `T[0]` 个样本，`CVFDT` 遍历整棵决策树，并检查每个节点的分裂属性是否仍然是最佳的。如果存在更好的分裂属性，它将开始以该节点为根生长一棵备选树，并根据该节点的统计数据在当前最佳属性上进行分裂。\n\
  3.  **`T[1]`**：创建备选树后，随后的 `T[1]` 个样本用于构建该备选树。\n4.  **`T[2]`**：在 `T[1]` 个样本到达后，随后的\
  \ `T[2]` 个样本用于测试备选树的准确性。如果备选树比当前树更准确，`CVFDT` 将用该备选树替换当前树（我们称备选树被“提升”了）。\n\n默认值为\
  \ `W = 50,000`，`T[0] = 10,000`，`T[1] = 9,000` 和 `T[2] = 1,000`。我们可以将这些数字理解为：假设最近的\
  \ 50,000 个样本通常是相关的；变化不太可能比每 10,000 个样本发生得更快；并且 1,000 个样本足以判断当前树和候选树中哪个更好。对于给定的数据源，这些假设可能正确，也可能不正确。此外，数据流在不同时间可能以不同方式变化，因此没有一组固定的值可能适合整个数据流的所有阶段。\n\
  \nHoeffding 自适应树相对于 `CVFDT` 的主要区别在于：\n\n*   备选树在检测到变化时立即创建，无需等待变化发生后固定数量的样本到达。此外，变化越剧烈，新备选树的创建速度就越快。\n\
  *   Hoeffding 自适应树一旦有证据表明备选树更准确，就会立即用备选树替换旧树，而不是等待另一组固定数量的样本。\n\n这两个效应可以总结为：Hoeffding\
  \ 自适应树能适应数据中时间变化的尺度，而不依赖于用户做出的先验猜测。\n\n##### 6.4 处理数值属性\n\n在数据流分类器中处理数值属性，比在非流式环境中要困难得多。在本节中，我们将回顾在演化数据流中用于决策树和朴素贝叶斯算法*离散化*的最流行方法。我们需要考察如何管理数值属性的统计信息，以及如何确定决策树中的最佳分裂点。\n\
  \n我们首先提及非流式场景下的方法。在那里，主要的离散化策略有：\n\n*   **等宽（Equal width）**：数值属性的范围被划分为固定数量的、大小相同的箱。需要最大值和最小值来计算箱的上下限。这是最简单的方法，因为它不需要对数据进行排序，但它容易受异常值和偏态分布的影响。\n\
  *   **等频（Equal frequency）**：该策略也使用固定数量的箱，但每个箱包含相同数量的元素。对于 *n* 个值和 *k* 个箱，箱的权重将是\
  \ *n/k*（四舍五入除外）。它非常适合处理异常值和偏态分布，但需要更多处理时间，因为它需要对值进行排序。\n*   **Fayyad 和 Irani 方法**\
  \ [98]：该方法基于使用信息增益计算最佳切分点，这正如在决策树中所用。首先，它对数据进行排序，然后选择相邻值对之间的每个点作为分裂候选。利用信息增益选择最佳切分点，然后在每个部分中递归地继续该过程。需要一个停止准则来终止递归过程。该准则基于：当区间变得纯净（仅包含单一类别的值）时停止，或者当*最小描述长度*原则估计划分数值范围不会带来进一步收益时停止。\n\
  \n###### 6.4.1 VFML\n\nHulten 和 Domingos [137] 的极快机器学习（VFML）包包含了一种在 `VFDT` 和 `CVFDT`\
  \ 中处理数值属性的方法。数值属性值由一组有序箱进行汇总。每个箱覆盖的值范围在创建时固定，并且不会随着更多样本的出现而改变。一个隐藏参数作为允许的箱总数上限——在\
  \ VFML 实现中，这被硬编码为最多允许 1,000 个箱。最初，每当看到一个新的唯一数值，就会创建一个新箱。一旦分配了固定数量的箱，流中随后的每个值都会更新最近箱的计数器。\n\
  \n本质上，该算法使用一个由最多 1,000 个箱组成的直方图来汇总数值分布。箱的边界由流中看到的前 1,000 个唯一值决定，之后静态箱的计数会增量更新。\n\
  \n这种方法存在两个潜在问题。显然，该方法对数据顺序敏感。如果流中看到的前 1,000 个样本碰巧偏向值总范围的一侧，那么最终的汇总就无法准确代表完整的值范围。\n\
  \n另一个问题是估计最佳箱数。箱太少会导致汇总虽小但不准确，而箱太多会以空间为代价换取准确性。在实验比较中，通过改变最大箱数来测试这种影响。\n\n######\
  \ 6.4.2 穷举二叉树\n\nGama 等人 [111] 在他们的 `VFDTc` 系统中提出了这种方法。它以存储空间为代价，旨在实现完美的准确性。所做的决策与批处理方法相同，因为本质上它*就是*一种批处理方法——除了值的顺序外，没有丢弃任何信息。\n\
  \n它通过在观察到值时增量构建一棵二叉树来工作。值在树中向下的路径取决于它小于、等于还是大于树中特定节点的值。随着树的构建，值被隐式地排序，每个时刻的节点数等于所见不同值的数量。如果不同值的数量很少，则可节省空间。\n\
  \n另一方面，只要树保持合理平衡，该结构相比将值存储在数组中能节省搜索时间。特别是，如果值按顺序到达，树将退化为一个列表，无法节省搜索时间。\n\n######\
  \ 6.4.3 Greenwald 和 Khanna 的分位数摘要\n\n数据库研究领域也关注如何在单次遍历和有限空间下汇总大型数据集的数值分布。这种能力有助于优化海量数据库上的查询。\n\
  \n\n\n\n\n####### Greenwald 和 Khanna 分位数摘要\n\nGreenwald 和 Khanna [129] 提出了一种*分位数摘要*方法，其准确性保证比以往方法更强。该方法通过维护一个有序元组集合来工作，每个元组记录输入流中的一个值，以及每个值真实秩范围的隐式边界。确切地说，元组\
  \ `t[i] = (v[i], g[i], Δ[i])` 由三个值组成：\n\n*   迄今为止在流中见到的元素之一的值 `v[i]`，\n*   值 `g[i]`\
  \ 等于 `r_min(v[i]) − r_min(v[i−1])`，其中 `r_min(v)` 是 `v` 在迄今为止见到的所有值中的秩的下界，以及\n* \
  \  值 `Δ[i]` 等于 `r_max(v[i]) − r_min(v[i])`，其中 `r_max(v)` 是 `v` 在迄今为止见到的所有值中的秩的上界。\n\
  \n注意\n\n```\nr_min(v[i]) = Σ_{j=1..i} g[j]\nr_max(v[i]) = r_min(v[i]) + Δ[i]\n```\n\
  \n分位数摘要是 `ε`-近似的，具体含义为：在看到序列的 `N` 个元素后，返回的任何分位数估计值与精确值的差异不会超过 `ε*N`。定义了一个压缩分位数摘要的操作，保证\
  \ `max(g[i] + Δ[i]) ≤ 2ε*N`，从而将摘要的误差控制在 `2ε` 以内。\n\n已证明最坏情况下的空间需求为 `O((1/ε) log(εN))`，经验证据表明在实践中其表现甚至优于此理论界限。\n\
  \n###### 6.4.4 高斯近似\n\n该方法见文献 [199]，利用高斯分布或正态分布，在小的常数空间内近似数值分布。此类分布可通过仅存储三个数字来增量维护，且不敏感于数据顺序。Gama\
  \ 和 Medas 在其 UFFT 系统 [113] 中描述了一种类似的方法。\n\n对于每个数值属性，该方法为每个类别标签维护一个单独的高斯分布。可能的值被简化为一组在观测到的最小值和最大值之间等间距分布的点。评估点的数量由一个参数决定，因此对分裂点的搜索是*参数化的*，尽管底层的高斯近似不是。对于每个候选点，可以利用各自的高斯曲线近似分裂点两侧各类别值的权重，并据此计算信息增益。\n\
  \n该过程在图 6.5 中演示。图顶部是两条高斯曲线，每条近似某数值属性在特定类别下的值分布。每条曲线可用三个值描述：均值、方差和样本总权重。例如，在图 6.5\
  \ 中，左侧所示类别的均值较低、方差较高、样本权重较高（曲线下面积较大）。曲线下方，值域被划分为十个分裂点，标记为 A 到 J。底部的垂直条显示了为每个分裂点计算出的相对信息增益量。评估显示点\
  \ E 具有最高的信息增益，因此会被选为最佳分裂点。\n\n![图 6.5 两个类别的高斯近似。图基于 [199]。](images/Fig6-5.png)\n\
  \n**图 6.5**  \n\n两个类别的高斯近似。图基于 [199]。\n\n该方法的一个改进是同时跟踪每个类别的最小值和最大值。这需要每个类别额外存储两个计数，但它们简单且维护开销极小。在评估分裂点时，该方法利用每个类别的最小值和最大值信息，判断类别值是否完全位于分裂点的一侧，从而消除高斯曲线尾部原本存在的微小不确定性。通过各类别的最小值和最大值，可以确定整个值域的最小值和最大值，这有助于确定待评估分裂点的位置。\n\
  \n高斯求和近似几乎肯定无法捕捉复杂数值分布的全部细节，但该方法在计算和内存方面均高效。二叉树方法以极高的内存代价换取尽可能高的准确性，而该方法采取相反策略——使用粗略近似以占用尽可能少的内存。事实上，对数值分布的简化视图不一定会损害其生成树的准确性。在树的更深处再次分裂，仍有机会细化对特定属性的分裂决策。此外，用少数简单参数进行近似比专注于细节的复杂方法更稳健，更能抵抗噪声和离群点。\n\
  \n##### 6.5 感知机\n\n感知机由 Rosenblatt 于 1957 年提出，是一种线性分类器，也是最早的在线学习方法之一。因其计算成本低，文献\
  \ [37] 指出它是决策树叶节点处多数类和朴素贝叶斯分类器的有益补充。\n\n算法接收一对流 `(x[i], y[i])`，其中 `x[i]` 是第 *i*\
  \ 个样本，`y[i]` 是其类别。感知机始终维护一个权重向量 `w`，定义函数 `f(x) = σ(w·x)` 用于给样本打标签；具体而言，对每个样本 `x[i]`\
  \ 有 `ŷ[i] = σ(w·x[i])`，其中 `σ` 是取值范围为 `[0,1]` 的软阈值函数。对外给出的预测更可能由符号函数产生（即 0 或 1 值），但使用\
  \ `σ` 更便于推导更新规则。非零决策阈值可通过在 `x` 中添加一个恒为 1 的额外特征来模拟。\n\n更新规则的推导见于许多机器学习教材，此处省略。其本质目标是更新权重\
  \ `w` 以最小化误分类样本数，通过沿减少误差的梯度方向移动 `w` 的每个分量来实现。更准确地说，规则为：\n\n```\nw ← w + η (y[i]\
  \ - ŷ[i]) x[i]\n```\n\n其中 `η` 是称为*学习率*的参数。\n\n该方法是所谓随机梯度下降在样本集或流上对损失函数进行增量优化的最简单示例。\n\
  \n##### 6.6 惰性学习\n\n在流式环境中最容易尝试的批处理方法或许是 *k* 近邻方法，*k*-NN [209]。通过使用滑动窗口作为搜索空间来确定新未分类实例的\
  \ *k* 个最近邻，并预测其 *k* 个标签中的多数类，即可轻松实现流式化。投票可选择按到待预测点距离的倒数加权，或采用其他方案。文献 [209] 发现，使用包含最近\
  \ 1,000 个实例的滑动窗口的方法效果显著。\n\n随着窗口滑动，该方法自然响应概念漂移。概念漂移可以是剧烈的或渐进的，针对惰性学习者区别对待这两种情况是合理的\
  \ [28]。\n\n若朴素实现，该方法在预测时通常因邻居搜索而效率低下，但可以对滑动窗口中的实例建立索引以提高预测效率 [257]。\n\n\n\n\n最近，Losing\
  \ 等人 [162] 提出使用双内存机制来应对不同类型和速度的概念漂移。短期内存包含最近窗口的数据，用于建模当前概念；长期内存则用于保留过往概念的知识。通过精心管理这两个内存，可在基准测试中取得极具竞争力的结果。作者指出，该方法在实践中很有用，因为它不需要调整任何元参数。\n\
  \n评估新分类方法时，应始终使用 `k`-NN 的某个变体，哪怕只是最简单的一个。\n\n##### 6.7 多标签分类\n\n在许多现实应用中，特别是涉及文本的应用，我们面临的是多类问题：将实例分类到多个类标签，而非仅一个。文本分类中的一个例子是给文档打\
  \ `tags`（标签）。设想我们在给新闻文章打标签，需要给一篇关于法国和新西兰橄榄球比赛的文章打标签。该文档可同时归类为 `France`（法国）、`New\
  \ Zealand`（新西兰）、`rubgy`（橄榄球）以及可能的 `sports`（体育）。还有许多其他应用：场景和视频分类、医学诊断、微生物学应用等。\n\n\
  多标签分类的主要挑战在于检测和建模标签间的依赖关系，同时避免计算复杂度过高。一种简单的基线方法是二元相关法。BR 将多标签问题转化为多个二元问题，从而可以利用二元模型来学习和预测每个标签的相关性。该方法的优势在于它对标签集过拟合具有相当的抵抗力，因为它是基于单个标签进行学习的。文献中常忽视该方法，因为它在分类过程中未直接考虑标签相关性\
  \ [123, 210, 235]，尽管存在若干克服这一局限的方法 [68, 123, 211]。例如，文献 [211] 中 Read 等人引入了 BR 分类器集成，以及\
  \ `classifier chains`（分类器链）的概念，两者在预测性能上均大幅优于 BR。\n\nBR 方法在数据流中的一个问题是，大量训练样本可能加剧类标签不平衡。可采取对策，例如使用逐标签阈值法或如文献\
  \ [203] 所示的分类器加权法。\n\n通过使用流式二元基模型，BR 可直接应用于数据流。在流式环境下，BR 还具有时间复杂度低、易于并行化的额外优势。\n\
  \nBR 的一种替代范式是 `label combination`（标签组合）或 `label powerset`（标签幂集）法（LC）。LC 将所有标签组合视为原子标签，将多标签问题转化为单标签（多类）问题，即训练集中的每个标签集成为单标签问题中的单个类标签。因此，单类标签的集合代表了原始多标签表示中所有不同的标签子集，从而考虑了标签相关性。LC\
  \ 的缺点包括最坏情况下的计算代价（在 *L* 个标签上可能有高达 2^(*L*) 个标签集）以及对训练数据过拟合的强烈倾向，尽管较新方法 [210, 235]\
  \ 已很大程度克服了这一问题；思路包括例如从标签集中随机抽取标签子集来训练分类器集成，以及各种剪枝策略。\n\nLC 方法在数据流场景下的一个特殊挑战是，由于新标签组合的出现，标签空间会随时间扩大。可以调整概率模型以适应随时间出现的新标签集组合；然而，概率模型不一定是表现最好的。通用的“缓冲”策略可能有用\
  \ [208]，即从初始数量的样本中学习标签组合，并认为这些足以代表分布。在缓冲阶段，可采用另一模型以满足“随时准备预测”的要求。\n\n另一种多标签方法是成对分类（PW），即对每一对可能的\
  \ `pair`（标签对）使用二元模型 [109]。PW 在某些场景下表现良好，但模型数量上的复杂度——即针对 *L* 个标签需 *L* × (*L* − 1)/2\
  \ 个模型——要求新思路使其适用于大规模问题。\n\n注意，这些都是 `problem transformation`（问题转换）方法，即将多标签问题转化为一个或多个单标签问题，随后可使用任何现成的多类分类器（或针对\
  \ BR 和 PW 的二元分类器）。这些方法因其灵活性和普适性而备受关注。\n\niSOUP-Tree（增量结构化输出预测）方法 [188] 是一种通过多目标回归执行多标签分类的多标签分类器。iSOUP-Tree\
  \ 方法有两种变体（构建回归树和模型树），以及 iSOUP-Tree 的集成。\n\n###### 6.7.1 多标签霍夫丁树\n\n文献 [208] 提出了多标签霍夫丁树，基于将信息增益准则改造为多标签问题。\n\
  \n回顾一下，霍夫丁树使用信息增益准则决定每个扩展节点的最佳属性，属性的信息增益是划分前后数据集熵的差值。既然熵度量数据集的不确定性，在多标签示例情况下，我们需要在熵中加入描述示例*不*属于的所有类别所需的信息。\n\
  \nClare 和 King [72] 表明，这可以通过在常规熵中增加一项来实现，该项针对每个标签，增加一个与拥有该标签的示例中的类熵相关的量。由此，他们提出了\
  \ C4.5 的多标签版本。多标签霍夫丁树 [208] 使用此策略构建决策树。多数标签集分类器（Majority Class 的多标签版本）被用作多标签霍夫丁树叶节点上的默认分类器。不过，叶节点上也可使用任何多标签分类器。\n\
  \n##### 6.8 主动学习\n\n分类器方法需要带标签的训练数据来构建模型。通常未标记数据丰富但标记成本高昂。标签获取成本高可能源于所需的人工投入（人力成本）。例如，以流形式到达的文本新闻。目标是预测某新闻项在特定时间是否会引起特定用户兴趣，而用户兴趣可能变化。为获取训练数据，历史新闻需被阅读并标记为有趣或不有趣。目前这需要人工劳动。标记成本高也可能源于所需昂贵、侵入性或破坏性的实验室测试。设想化工厂的生产过程，目标是预测生产输出质量。因持续人工调试、辅助配料或物理传感器更换，输入与输出质量的关系可能随时间变化。为知晓输出质量（真实标签），需进行实验室测试，成本高昂。在此类条件下，要求所有传入实例都有真实标签可能是不合理的。\n\
  \n主动学习算法选择性地请求标签，而非期望接收所有实例标签。这在基于池 [157] 和在线 [77] 设置中均有深入研究。在基于池的设置中，关于标记哪些实例的决策是基于所有历史数据做出的。\n\
  \n\n\n在文献[261]中，提出了一个用于演化数据流中主动学习的框架设置。其工作原理如下：数据以流的形式到达，且需要实时进行预测。预期会发生概念漂移，因此学习过程需要具有自适应能力。真实标签可以立即请求，也可能永远无法获取，因为实例会定期从内存中丢弃。目标是在保持标注成本固定在分配的预算范围内的同时，最大化随时间推移的预测准确率。在扫描一个实例并输出其预测结果后，我们需要一种策略来决定是否查询其真实标签，以便模型能利用这个新实例进行自我训练。由于数据分布的变化，需要定期重新训练。除了在平稳情况下学习一个准确的分类器外，数据流中的主动学习策略还必须能够：\n\
  \n*   随时间平衡标注预算，\n*   察觉实例空间中任意位置发生的变化，以及\n*   保留传入数据的分布以用于检测变化。\n\n更正式地说，该设置如下：算法接收一系列未标记实例\
  \ `x[t]` 和一个预算 `B`，`B` 表示算法被允许请求标注的过往实例比例。如果算法请求 `x[t]` 的标签，它将获得 `x[t]` 的真实标签，记为\
  \ `y[t]`。假设获取标签的成本对所有实例均相同。`B = 1` 意味着所有到达的实例都可以被标注，而 `B = 0.2` 意味着在任何时刻，算法最多只能请求标注迄今为止所见实例的\
  \ 20%。\n\n图 6.6 展示了将主动学习策略与自适应学习相结合的框架。该框架采用了文献[114]的变化检测技术：当分类器的准确率开始下降时，利用新到达的实例构建并训练一个新分类器。当检测到变化时，旧分类器将被新分类器取代。\n\
  \n![图 6.6 主动学习框架。](img/Fig6-6.png)\n\n**图 6.6**\n\n主动学习框架。\n\n接下来我们将描述四种用于预算分配的策略。\n\
  \n###### 6.8.1 随机策略\n\n第一种（基线）策略之所以朴素，是因为它随机标注传入的实例，而不是主动决定哪个标签最相关。对于每个传入的实例，以概率\
  \ `B` 请求其真实标签，其中 `B` 为预算。\n\n###### 6.8.2 固定不确定性策略\n\n不确定性采样或许是最简单、最常用的主动学习策略 [224]。其思路是标注当前分类器最不自信的那些实例。在在线设置中，这对应于标注确定性低于某个固定阈值的实例。衡量不确定性的一种简单方法是使用分类器输出的后验概率估计值。\n\
  \n###### 6.8.3 可变不确定性策略\n\n固定不确定性策略在流数据设置中面临的挑战之一，是如何随时间分配标注工作量。使用固定阈值时，经过一段时间后，分类器要么会耗尽预算，要么会达到阈值确定性。在这两种情况下，它都将停止学习，从而无法适应变化。\n\
  \n我们不再标注那些不确定性低于阈值的实例，而是希望在一个时间区间内标注最不确定的实例。因此，我们可以引入一个可变阈值，它根据传入数据自我调整以符合预算。如果分类器变得更加确定（平稳情况），阈值会扩大以捕捉最不确定的实例。如果发生变化并突然出现大量标注请求，则阈值会收缩，仅查询最不确定的实例。\n\
  \n在平静时期请求更多标签、在变化点请求较少标签，这似乎违反直觉。但实际上，这确保了算法在所有情况下请求标签的比例相同。由于算法不知道变化何时或以何种频率发生，这有助于在时间上均匀地花费预算。\n\
  \n可变不确定性策略在图 6.7 中进行了描述。更多细节及与其他策略的对比可参见文献[261]。\n\n![图 6.7 可变不确定性策略，具有动态阈值。](img/Fig6-7.png)\n\
  \n**图 6.7**\n\n可变不确定性策略，具有动态阈值。\n\n###### 6.8.4 带随机化的不确定性策略\n\n不确定性策略总是标注最接近分类器决策边界的实例。在数据流中，变化可能发生在实例空间的任何位置。当标签发生概念漂移时，如果没有真实标签，分类器将无法察觉。为了不错过概念漂移，我们应不时标注一些分类器非常确定的实例。为此，该策略通过乘以一个服从\
  \ `N(1, δ)` 的正态分布随机变量，对每个实例的标注阈值进行随机化。这样，它更频繁地标注靠近决策边界的实例，但偶尔也会标注一些远离边界的实例。\n\n\
  该策略以标注一些非常不确定的实例为代价，换取标注一些非常确定的实例，以免错过变化。因此，在平稳情况下，该策略的表现预期会比不确定性策略差，但在变化情况下，预期能更快适应。\n\
  \n表 6.3 从若干需求方面总结了这四种策略。随机策略满足所有三项需求。随机化不确定性策略满足预算和覆盖需求，但会产生有偏的标注数据。可变不确定性策略仅满足预算需求，而固定不确定性策略则一项也满足不了。\n\
  \n**表 6.3**\n\n预算分配策略总结。\n\n| | 预算控制 | 实例空间覆盖 | 标注数据分布 |\n| --- | --- | --- | ---\
  \ |\n| 随机 | 满足 | 完全 | IID |\n| 固定不确定性 | 不满足 | 片段 | 有偏 |\n| 可变不确定性 | 处理 | 片段 | 有偏\
  \ |\n| 随机化不确定性 | 处理 | 完全 | 有偏 |\n\n##### 6.9 概念演化\n\n当新类别出现在演化数据流中时，会发生*概念演化*。例如，在从\
  \ Twitter 挖掘文本数据时，推文中可能出现新话题；又如在网络数据流的入侵检测中，可能出现代表新类别的新型攻击。\n\nMasud 等人 [170] 首先处理了这一设置。他们的方法包含训练一个基于\
  \ `k-NN` 的分类器集成，这些分类器包含通过半监督 `k-means` 聚类获得的伪点。集成中的每个成员在不同的已标注数据块上训练。新实例通过集成中分类器的多数投票进行分类。\n\
  \n每个伪点代表特征空间中的一个超球体，具有相应的质心和半径。模型的决策边界是特征空间的并集；而集成的决策边界是集成中所有模型决策边界的并集。\n\n\n\n\
  每个新实例首先由模型集合进行检查，以确定它是否位于集合的决策边界之外。如果它在决策边界内部，则使用集合中模型的多数投票进行正常分类。否则，它将被声明为 F-outlier（过滤异常值）。这些\
  \ F-outliers 是潜在的新类实例，它们被临时存储在缓冲区中，以观察它们彼此之间是否接近。这是通过使用 `q`-邻域轮廓系数（q-NSC）来完成的，这是一种衡量内聚度和分离度的统一度量，其值介于\
  \ -1 和 +1 之间。正值表示该点更接近 F-outlier 实例（内聚度更高）且远离现有类实例（分离度更高），反之亦然。如果对于集合中的所有分类器，都有足够数量的\
  \ F-outliers 具有正的 q-NSC，则声明发现了一个新类。\n\nSAND（半监督自适应新颖性检测）方法 [133] 根据分类器置信度的变化动态确定数据块大小。因此\
  \ SAND 更高效，并避免了在无变化期间进行不必要的训练。\n\n最后，文献 [10] 提出了一种“基于类”的集成技术，用以取代传统的“基于数据块”的方法，以检测循环类。作者声称基于类的集成方法优于基于数据块的技术。\n\
  \n##### 6.10 MOA 实验课\n\n在本实验课中，你将通过图形界面使用 MOA 来学习多个分类器模型，并以不同方式对其进行评估。初始 MOA GUI\
  \ 界面如 图 6.8 所示。\n\n![图 6.8 MOA 图形用户界面。](img/Fig6-8.png)\n\n**图 6.8**\n\nMOA 图形用户界面。\n\
  \n**练习 6.1** 点击 `Configure` 以设置任务。将顶部下拉菜单中的任务类型更改为 `LearnModel`。正如你所见，默认学习器是 `NaiveBayes`。你可以通过点击\
  \ `Edit` 按钮，然后从顶部的下拉菜单中选择来更改它。不过，目前请保持为 `NaiveBayes`。默认数据流是 `RandomTreeGenerator`。使用相应的\
  \ `Edit` 按钮将其更改为 `WaveformGenerator`，后者从波形组合生成实例。将生成的实例数量从 10,000,000 改为 1,000,000。最后，指定一个\
  \ `taskResultFile`，例如 `modelNB.moa`，MOA 将把模型输出到该文件。\n\n现在点击 `OK`，然后点击 `Run` 启动此任务。文本输出出现在中间面板中：在本例中，每\
  \ `10,000` 步输出一次。各种评估指标出现在底部面板中，并持续更新直到任务完成。如果你快速连续点击两次 `Run`，你将看到 MOA 可以同时运行多个任务。点击顶部面板中的某个作业，会在底部两个面板中显示其信息。\n\
  \n你刚刚运行的任务是\n\n```\nLearnModel -l bayes.NaiveBayes\n-s generators.WaveformGenerator\n\
  -m 1000000 -O modelNB.moa\n```\n\n——你可以在 `Configure` 按钮旁边的那一行看到它——它已将朴素贝叶斯模型存储在文件\
  \ `modelNB.moa` 中。（但是，具有默认值的参数不会显示在配置文本中。）\n\n点击 `Configure` 并将学习器更改为霍夫丁树，输出文件为\
  \ `modelHT.moa`：\n\n```\nLearnModel -l trees.HoeffdingTree\n-s generators.WaveformGenerator\n\
  -m 1000000 -O modelHT.moa\n```\n\n然后运行它。现在我们在磁盘上存储了两个模型，`modelNB.moa` 和 `modelHT.moa`。\n\
  \n我们将使用 `WaveformGenerator` 生成的 `1,000,000` 个新实例来评估朴素贝叶斯模型，这通过以下任务完成：\n\n```\nEvaluateModel\
  \ -m file:modelNB.moa\n-s (generators.WaveformGenerator -i 2) -i 1000000\n```\n\n\
  `-i 2` 为波形生成器设置了不同的随机种子。你可以在 `Configure` 面板中设置其中大部分：顶部将任务设为 `EvaluateModel`，并配置流（现已变为\
  \ `RandomTreeGenerator`）为 `WaveformGenerator`，将 `instanceRandomSeed` 设为 2。遗憾的是，你无法指定从文件读取模型。\n\
  \n学习如何解决此类问题很有用。点击 `OK` 返回 MOA 主界面，从右键菜单中选择 `Copy configuration to clipboard`，然后选择\
  \ `Enter configuration` 并将剪贴板内容粘贴到新配置中，你可以在其中编辑它，并在命令行中输入 `-m file:modelNB.moa`。这为\
  \ `EvaluateModel` 任务提供了加载上一步生成的朴素贝叶斯模型、生成随机种子为 2 的新波形流以及在 `1,000,000` 个示例上测试所需的参数。\n\
  \na. 正确分类的百分比是多少？\n\nb. 编辑命令行以评估霍夫丁树模型。正确分类的百分比是多少？\n\nc. 根据 Kappa 统计量，哪个模型表现最好？\n\
  \n**练习 6.2** 在 MOA 中，你可以嵌套命令。例如，`LearnModel` 和 `EvaluateModel` 步骤可以合二为一，避免创建外部文件。你无法在交互式\
  \ `Configure` 界面中执行此操作；相反，你必须编辑 `Configure` 命令文本。\n\n`OzaBag` 是一种增量装袋技术，我们将在下一章中看到。按如下方式评估它：\n\
  \n```\nEvaluateModel -m (LearnModel -l meta.OzaBag\n-s generators.WaveformGenerator\
  \ -m 1000000)\n-s (generators.WaveformGenerator -i 2) -i 1000000\n```\n\n通过右键点击、选择\
  \ `Enter configuration`，将此命令复制并粘贴为 `Configure` 文本来执行此操作。\n\n`OzaBag` 的准确率是多少？\n\n\
  **练习 6.3** 任务 `EvaluatePeriodicHeldOutTest` 在训练模型的同时，定期在保留测试集上获取性能快照。\n\na. 以下命令在\
  \ `WaveformGenerator` 数据的 10,000,000 个样本上训练 `HoeffdingTree` 分类器，首先保留前 100,000 个样本作为测试集；每\
  \ 1,000,000 个示例后，它在此集合上执行一次测试：\n\n```\nEvaluatePeriodicHeldOutTest -l trees.HoeffdingTree\n\
  -s generators.WaveformGenerator\n-n 100000 -i 10000000 -f 1000000\n```\n\n你可以复制此配置并粘贴进去（作弊！），或在交互式\
  \ `Configure` 界面中设置（测试集大小 100,000，训练集大小 10,000,000，采样频率 1,000,000）。它在中间面板输出一个包含\
  \ 10 行的 CSV 文件，并在底部面板输出最终统计数据。最终准确率是多少？\n\nb. 最终 Kappa 统计量是多少？\n\n**练习 6.4** 预测式评估先对任意实例进行评估，然后用它进行训练。这是一个\
  \ `EvaluatePrequential` 任务，它在 `WaveformGenerator` 数据的 1,000,000 个示例上训练 `HoeffdingTree`\
  \ 分类器，每 10,000 个示例测试一次，以创建一个 100 行的 CSV 文件：\n\n```\nEvaluatePrequential -l trees.HoeffdingTree\n\
  -s generators.WaveformGenerator\n-i 1000000 -f 10000\n```\n\n在交互式 `Configure` 界面中设置并运行它。底部\
  \ GUI 显示结果的图形显示——一条学习曲线。你可以比较两个不同任务的结果：点击不同任务，你会发现当前任务显示为红色，先前选中的任务显示为蓝色。\n\na.\
  \ 比较 `NaiveBayes` 与 `HoeffdingTree` 的预测式评估。在学习曲线显示中，霍夫丁树是否总是优于朴素贝叶斯？\n\nb. 霍夫丁树的最终\
  \ Kappa 统计量是多少？\n\nc. 朴素贝叶斯的最终 Kappa 统计量是多少？\n\n**练习 6.5** 默认情况下，预测式评估显示基于 1000\
  \ 个实例窗口计算的性能，这会产生一条跳跃、锯齿状的学习曲线。查看 `Configure` 面板中的评估器：你可以看到使用了 `WindowClassificationPerformanceEvaluator`，窗口大小为\
  \ `1000`。相反，选择 `BasicClassificationPerformanceEvaluator`，它从流的开始使用每个示例计算评估指标：\n\n\
  ```\nEvaluatePrequential -l trees.HoeffdingTree\n-s generators.WaveformGenerator\n\
  ```\n\n\n\n-e `BasicClassificationPerformanceEvaluator`\n\n-i `1000000` -f `10000`\n\
  \n正如你所见，这确保了随时间推移的平滑绘图，因为每个单独的样本对总体平均值的意义越来越小。\n\na. 再次使用 `BasicClassificationPerformanceEvaluator`\
  \ 比较霍夫丁树和朴素贝叶斯的预测式评估。在学习曲线显示中，霍夫丁树是否总是优于朴素贝叶斯？\n\nb. 霍夫丁树的最终 Kappa 统计量是多少？\n\nc.\
  \ 朴素贝叶斯的最终 Kappa 统计量是多少？\n\n### 7\n\n# 集成方法\n\n集成预测器是较小模型的组合，它们的单独预测以某种方式（例如平均或投票）结合形成最终预测。在批处理和流式场景中，集成往往能提高预测准确性，优于其任何单一组成部分，代价是需要更多的时间和内存资源，并且它们通常易于并行化。但在流式处理中，分类器集成相对于单分类器方法还有额外的优势：它们易于扩展；如果挖掘分布式流，不需要将多个流集中到单个站点；并且可以通过修剪集成中表现不佳的部分并添加新分类器来使其适应变化。关于流式集成的全面且最新的讨论见文献\
  \ [124]。\n\n我们首先讨论通过加权或投票现有分类器来创建集成的通用方法，如加权多数和堆叠。然后讨论装袋和提升，这两种流行的方法通过在将输入分布交给创建分类器的基础算法之前对其进行转换来创建集成。接下来，我们讨论一些使用霍夫丁树作为基础分类器的方法。最后，我们讨论循环概念，即过去出现的分布倾向于稍后重新出现的场景，以及如何用集成来应对它们。\n\
  \n#### 7.1 准确率加权集成\n\n一种简单的集成方案采用 *N* 个预测器 *C*[1], …, *C*[*N*] 并应用某个函数 *f* 来组合它们的预测：在每个待预测的实例\
  \ *x* 上，集成预测 *f*(*C*1,…,*C**N*)，其中 *C**i* 表示 *C*[*i*] 对 *x* 的预测。这些预测器可能从一开始就是固定的，也许是从批量数据离线训练的，或者是在同一流上在线训练的。\n\
  \n对于分类，*f* 可以简单地是*投票*，即在 *C**i* 中产生最受欢迎的类别。在*加权投票*中，每个分类器 *C*[*i*] 都有一个权重 *w*[*i*]\
  \ 附加到其投票上。如果我们有一个二分类问题，类别在 {0, 1} 中，加权投票可以表示为：\n\n![](img/pg129-1.png)\n\n其中 *θ*\
  \ 是一个合适的阈值。权重可能在整个过程中固定，由专家或离线训练确定，或者随时间变化。我们专注于后者，更有趣的情况。\n\n准确率加权集成（AWE）由 Wang\
  \ 等人 [244] 提出，旨在使用非流式学习器挖掘演变数据流。AWE 以块为单位处理流，并为每个新块构建一个新分类器。每当添加一个分类器时，最旧的一个就会被移除，从而允许集成适应变化。AWE\
  \ 在 MOA 中作为 `ACCURACYWEIGHTEDENSEMBLE` 实现。\n\n文献 [244] 表明，如果每个分类器被赋予与 *err*[*r*]\
  \ − *err*[*i*] 成比例的权重，则集成的表现优于基础分类器，其中 *err*[*i*] 是第 *i* 个分类器在测试集上的误差，*err*[*r*]\
  \ 是随机分类器的误差，后者以训练集中类别 *c* 的概率预测类别 *c*。作为测试集的代理，AWE 在最近的块上计算这些误差，假设它是最相似于接下来将到达的实例的块。\n\
  \n该方法的优点是其简单性，以及它可以与非流式基础分类器一起使用，但在平稳和非平稳流上都能良好工作。该方法的一个缺点是块大小必须由领域专家在外部确定，并考虑基础分类器的学习曲线。\n\
  \nAWE 的变体已在 [148, 58] 等文献中提出。[58] 中的变体在 MOA 中作为 `ACCURACYUPDATEDENSEMBLE` 实现。\n\n\
  #### 7.2 加权多数\n\n加权多数算法由 Littlestone 和 Warmuth [160] 提出，结合 *N* 个现有的预测器（在此语境下称为“专家”），并学习随时间调整它们的权重。它类似于感知机算法，但其更新规则以乘法方式而非加法方式改变权重。与感知机不同，可以证明它收敛于几乎等于最佳专家的错误率，加上一个取决于\
  \ *N* 的小项。因此，当专家数量大且许多专家表现不佳时，它很有用。\n\n该算法见图 7.1。算法的输入是一个需要预测的项目流，每个项目后跟其正确标签。接收到第\
  \ *t* 个项目 *x*[*t*] 后，算法发出对 *x*[*t*] 标签的预测 *ŷ*[*t*]。然后算法接收 *x*[*t*] 的正确标签 *y*[*t*]。在算法中，`sign`\
  \ 函数对负数返回 0，对非负数返回 1。\n\n![图 7.1 加权多数算法。](img/Fig7-1.png)\n\n**图 7.1**\n\n加权多数算法。\n\
  \n在时刻 *t*，如果专家预测的当前权重加权和至少为 1/2，则算法预测 1。在此之后，犯错的每个分类器的权重按因子 *β* 减少。权重被重新归一化，使其在所有时刻加起来等于\
  \ 1。\n\n该算法的直觉是专家的权重随其犯错次数呈指数级下降。因此，如果任何专家的错误率比其他专家略低，其权重将下降得慢得多，并很快主导用于预测的线性组合。形式化这一论点，文献\
  \ [160] 证明了无论流元素的顺序如何，在所有时刻 *t*，\n\n![](img/pg131-1.png)\n\n其中 *err*[WM*,t*] 是加权多数算法直到时刻\
  \ *t* 所犯的预测错误数（即 *ŷ* ≠ *y* 的样本数），*err*[*i,t*] 是专家 *i* 的类似数字（即 *C**i* ≠ *y* 的样本数）。特别地，对于\
  \ *β* = 0.5，我们有\n\n![](img/pg131-2.png)\n\n换句话说，加权多数算法犯的错误数仅比*最佳*专家大一个常数因子，加上一个不随\
  \ *t* 增长且仅对专家数量呈对数依赖的项。然而请注意，除非算法并行化，否则每个样本的运行时间至少是 *N* 的线性函数。\n\n对于确定性算法，min[*i*]\
  \ *err*[*i,t*] 前的常数因子不能小于 2。文献 [160] 提出了一个随机变体：在第 5 行不预测 *ŷ* = `sign`(*p*)，而是以概率\
  \ *p* 预测 *ŷ* = 1，以概率 1 − *p* 预测 *ŷ* = 0。随机性在一定程度上挫败了对手对标签的最坏选择，并且在期望下界中的常数得到改进为\n\
  \n![](img/pg132-1.png)\n\n因此，选择足够接近 1 的 *β*，min[*i*] *err*[*i,t*] 前的常数可以任意接近 1。特别地，设置\
  \ *β* = 0.5 我们得到\n\n![](img/pg132-2.png)\n\n如果我们有兴趣限制直到已知时间范围 *T* 的错误，我们可以设置 ![](img/pg132-in-1.png)；一些微积分表明：\n\
  \n![](img/pg132-3.png)\n\n因此，对于大的 *T*，第一项中的系数趋向于 1。加权多数是指数梯度方法 [147] 的一个特例，当标签和预测是不在\
  \ {0,1} 中的实值时适用，即它适用于回归问题。\n\n#### 7.3 堆叠\n\n\n\n\n##### 堆叠法\n\n堆叠法 [247] 是加权多数表决法的推广，实际上是组合专家最通用的方法。假设有\
  \ *N* 个专家 `C[1]` 到 `C[N]`，元学习算法用于在形式为 `(C1, …, CN)` 的实例上训练元模型，即专家 `C[i]` 的预测被视为第\
  \ *i* 个特征。实例 `x` 也可以选择性地提供给元分类器。\n\n堆叠法中使用的元学习器通常是相对简单的，例如感知机。加权多数表决法和指数梯度法可以被视为堆叠法的特例，其中元学习器使用乘法更新规则（而非感知机中的加法规则）来学习线性分类器。\n\
  \n#### 7.4 Bagging（装袋法）\n\n*Bagging* 方法由 Breiman [52] 提出，适用于批处理设置，其工作方式截然不同。基础学习算法用于推断\
  \ *M* 个不同的模型，它们之所以可能不同，是因为它们是用不同的 *bootstrap samples*（自助样本）训练的。每个样本通过从原始训练集中有放回地随机抽取样本创建。生成的元模型通过对这\
  \ *M* 个分类器的预测进行简单多数投票来进行预测。\n\nBagging 背后的基本原理是投票可以降低基础算法的样本方差，即从同一源分布中抽取的不同样本训练出的分类器之间的差异。事实上，bootstrapped\
  \ 分类器之间的方差越大，效果越好。\n\n##### 7.4.1 在线 Bagging 算法\n\n在流式设置中，最初似乎很难从流中有放回地抽取样本。然而，以下性质允许模拟自助法：在一个\
  \ bootstrap 副本中，训练集中 *n* 个样本每个样本的副本数 *K* 服从二项分布：\n\n```\nimages/pg133-1.png\n```\n\
  \n对于较大的 *n* 值，该二项分布趋于 Poisson(1) 分布，其中 Poisson(1) = exp(−1)*/k*!。利用这一性质，Oza 和 Russell\
  \ 提出了 Online Bagging [189, 190]，它不进行有放回采样，而是根据 Poisson(1) 给每个到达的样本赋予权重。其伪码见 Figure\
  \ 7.2。它在 MOA 中作为 OZABAG 实现。\n\n![Figure 7.2 Online Bagging for M models. The indicator\
  \ function I(condition) returns 1 if the condition is true, and 0 otherwise.](img/Fig7-2.png)\n\
  \n**Figure 7.2**\n\n针对 *M* 个模型的在线 Bagging。指示函数 *I*(condition) 在条件为真时返回 1，否则返回 0。\n\
  \n##### 7.4.2 带概念漂移检测器的 Bagging\n\n上述方法的一个问题是它并非专门设计用于应对流中的概念漂移，除非基础分类器本身具有高度自适应能力。\n\
  \nADWIN Bagging [38]（在 MOA 中作为 OZABAGADWIN 实现）通过以下方式改进了 Online Bagging：它使用 *M* 个\
  \ ADWIN 实例来监控基础分类器的错误率。当任意一个检测到变化时，集成中最差的分类器被移除，并添加一个新分类器。这种策略有时被称为“replace the\
  \ loser”（替换失败者）。\n\n##### 7.4.3 Leveraging Bagging（杠杆 Bagging）\n\n使用 Online Bagging\
  \ 时的一个实验观察是，增加输入的随机性似乎能提高性能。由于增加随机性会增加基础分类器的多样性或方差，这与“bagging 受益于更高的分类器方差”这一直觉相符。\n\
  \n可以通过使用 Poisson(1) 以外的分布进行采样来引入额外的随机性。例如，Lee 和 Clyde [155] 使用 Γ(1,1) 分布获得了 bagging\
  \ 的贝叶斯版本。注意 Γ(1,1) 等于 `Exp(1)`。Bühlmann 和 Yu [60] 提出了 subbagging，即不放回重采样。\n\nLeveraging\
  \ Bagging [36] 使用分布 Poisson(*λ*) 对流进行采样，其中 *λ* ≥ 1 是算法的参数。由于 Poisson 分布的方差（和均值）为\
  \ *λ*，这相对于常规 Online Bagging 增加了 bootstrap 样本中的方差。它在 MOA 中作为 LEVERAGINGBAG 实现。\n\n\
  除了增加输入随机性，Leveraging Bagging 还使用输出码在集成输出端增加随机化。Dietterich 和 Bakiri [87] 引入了一种基于纠错输出码的方法，仅使用二分类器处理多分类问题。分配给每个样本的类别被修改，以创建由从类别集到\
  \ {0,1} 的映射诱导的新的二元分类。Schapire [222] 提出的该方法变体展示了一种使用输出码的 boosting 形式。Leveraging Bagging\
  \ 使用随机输出码而非确定性码。在标准集成方法中，所有分类器试图预测同一函数。然而，使用输出码时，每个分类器将预测不同的函数。这可能减少分类器间相关性的影响，并增加集成的多样性。\n\
  \nLeveraging Bagging 还结合了 ADWIN Bagging 中的“replace the loser”策略。[36] 中的实验表明，Leveraging\
  \ Bagging 优于常规 Online Bagging 和 ADWIN Bagging。\n\n#### 7.5 Boosting（提升法）\n\n与 bagging\
  \ 一样，boosting 算法结合多个用输入样本训练的基础模型以实现更低的分类错误。与 bagging 不同，模型是顺序创建而非并行创建的，每个新模型的构建取决于先前构建模型的性能。Boosting\
  \ 的直观思想是给当前集成分类器误分类的样本更大的权重，使序列中的下一个分类器更关注这些样本。AdaBoost.M1 [108] 是批处理 boosting 最流行的变体。\n\
  \n这种顺序性质使得 boosting 比 bagging 更难迁移到流式场景。对于在线设置，Oza 和 Russell [189, 190] 提出了 *Online\
  \ Boosting*，这是一种在线方法，它不是每次新实例到达时都顺序构建新模型，而是根据前序分类器的性能计算权重来更新每个模型。它在 MOA 中作为 OZABOOST\
  \ 实现。其他类在线 boosting 方法见 [53, 54, 65, 85, 197, 243, 259]。\n\n根据 [187] 等，在批处理设置中，boosting\
  \ 通常优于 bagging，但它也更敏感于噪声，因此 bagging 能更一致地带来改进。早期比较在线 boosting 和在线 bagging 方法的研究似乎倾向于\
  \ bagging [38, 189, 190]。一个例外是 [100]，报告 Arc-x4 boosting 算法 [53] 优于在线 bagging。比较更新变体的额外研究会很有意思。此外，如何让\
  \ boosting 算法处理概念漂移尚不清楚，因为“replace the loser”这类策略在 boosting 中似乎不如在 bagging 中合理。\n\
  \n#### 7.6 Hoeffding Trees 集成\n\n由于 Hoeffding Trees 是最有用、研究最深入的流式分类器之一，因此已提出多种将它们组合成集成的方法。\n\
  \n##### 7.6.1 Hoeffding Option Trees（霍夫丁选项树）\n\nHoeffding Option Trees (HOT) [198]\
  \ 在单棵树结构中隐式地表示树的集成。除了测试一个属性的常规节点，HOT 还包含 *option nodes*（选项节点），它们不进行测试，只是分支为多棵子树。当实例到达选项节点时，它会继续下降通过所有子节点，最终到达多个叶节点。该树对实例的输出则由所有到达的叶节点投票决定。\n\
  \n\n\n\n当 Hoeffding Tree 算法的分裂标准在接收到合理数量的样例后，似乎对多个属性的评价相似时，就会引入选项节点。与其任意等待很长时间来打破平局，不如将所有平局属性作为选项添加进去。这样可以缓解有限前瞻和不稳定性的影响，从而得到更准确的模型。\n\
  \n我们省略了文献 [198] 中给出的并已在 MOA 版本的 HOT（即 `HOEFFDINGOPTIONTREE`）中实现的其他一些细节。叶节点间的投票是加权的，而非使用简单的多数投票。需要限制树增长的策略，因为如果不加控制，选项树往往会增长得非常快。用于回归的\
  \ HOT 在构建过程中有细微差别，相关内容见文献 [140]。\n\n##### 7.6.2 随机森林\n\nBreiman [55] 在批处理设定下提出了随机森林，它是树的集成，这些树在输入端和决策树的内部构建过程中都使用了随机化。输入通过采用自助采样样本进行随机化，这与标准的\
  \ Bagging 相同。树的构建通过要求每个节点只能使用随机选择的属性子集进行分裂来实现随机化。该子集通常很小，其大小例如为属性总数的平方根。此外，树在生长过程中不进行剪枝。随机森林通常是在许多批处理任务中表现最好的分类器方法之一。\n\
  \n流式随机森林的实现已由 Abdulsalam 等人 [2] 等人提出，他们并未完全使用 Hoeffding Tree，而是采用了另一种类型的在线树构建器。利用\
  \ Hoeffding Tree 并发挥 GPU 算力的实现见文献 [167]。这些以及大多数其他流式随机森林实现都采用“替换失败者”策略来应对概念漂移。\n\n\
  遗憾的是，这些随机森林算法都无法有效地与前述各种基于 Bagging 和 Boosting 的算法竞争。然而，最近 Gomes 等人 [125] 提出了自适应随机森林（ARF）算法，它似乎是一个强有力的竞争者。与之前尝试为数据流学习复制随机森林\
  \ [124] 的做法相反，ARF 包含一种有效的重采样方法和自适应算子，能够在无需针对不同数据集进行复杂优化的情况下应对不同类型的概念漂移。文献 [125]\
  \ 中展示的 ARF 并行实现与串行实现相比，在分类性能方面没有退化，因为树和自适应算子彼此独立。\n\n##### 7.6.3 受限 Hoeffding Tree\
  \ 的感知机堆叠\n\n在机器学习中反复观察到的一个现象是：通常，复杂模型会被那些不试图对属性间复杂交互建模的简单模型所超越。Bifet 等人 [31] 针对\
  \ Hoeffding Tree 集成研究了这种可能性。与全 Hoeffding Tree 的随机森林不同，他们提出使用带有感知机算法作为元学习器的堆叠方法，并使用小型树。\n\
  \n更准确地说，他们的算法枚举大小为 *k* 的所有属性子集，并在每个子集上学习一棵 Hoeffding Tree。这些树作为输入提供给一个堆叠算法，该算法使用感知机算法作为元学习器。树的生长很快，因为每棵树都很小，我们期望元学习器最终会给最佳的\
  \ *k* 个属性组合分配较大的权重。\n\n由于在 *n* 个属性中有 $\\binom{n}{k}$ 个大小为 *k* 的集合，因此对于大多数 *n* 值，只有较小的\
  \ *k* 值是可行的。当 *k* = 1 时，该算法退化为感知机，但 *k* = 2 被发现适用于中等规模的数据集。为了应对概念漂移，该方法为每棵树添加了一个\
  \ `ADWIN` 变化检测器。当一棵树的错误率发生显著变化时，该树将被重置，并使用该属性组合学习一棵新树。文献 [31] 表明，该方法在简单合成数据集上的表现优于\
  \ ADWIN Bagging，这表明在预测关键不在于属性的复杂组合的情况下，该方法可能表现良好。\n\n该方法在 MOA 中作为 `LIMATTCLASSIFIER`\
  \ 实现。\n\n##### 7.6.4 自适应大小 Hoeffding Tree\n\n自适应大小 Hoeffding Tree（ASHT）方法 [38] 在\
  \ MOA 中作为 `OZABAGASHT` 实现，它创建一个具有以下限制的 Hoeffding Tree 集成：\n\n*   集成中的每棵树都有一个关联值，代表其可达到的最大内部节点数。\n\
  *   在一棵树发生节点分裂后，如果其大小超过其关联值，则该树将被重置为一个叶节点。\n\n如果集成中有 *N* 棵树，分配最大尺寸的一种方法是选择 2 的幂：2,\
  \ 4, … 直到 $2^k$。该方法背后的直觉是：较小的树能更快地适应变化，而较大的树在变化很少或没有变化的时期表现更好，仅仅是因为它们是用更多数据构建的。大小限制为\
  \ *s* 的树重置频率约为大小限制为 2*s* 的树的两倍。这为这组树创建了一系列不同的重置速度，因此总有一部分树能很好地逼近当前的变化率。\n\n集成的输出可以是所有树的多数投票，尽管文献\
  \ [38] 通过实验发现，按其误差平方的反比对它们进行加权效果更好。每棵树的误差由 `EWMA` 估计器监控。\n\n重要的是要注意，重置会一直发生，即使在平稳数据集上也是如此，但这种行为不应损害集成的预测性能。\n\
  \n#### 7.7 循环概念\n\n在许多场景中，数据流分布的演变方式是：过去出现的分布在未来重新出现。具有明显每日、每周或每年周期性的数据流（如天气、客户销售和道路交通）就是例子，但重现也可能以非周期性的方式发生。\n\
  \n针对这些场景，已提出了*循环*或*反复出现的概念*框架 [112, 127, 143, 219]。提案的细节各异，但主要思想是保存一个过去曾有用但已从集成中移除的分类器库，例如因为它们在某个时刻表现不佳。尽管如此，仍会定期重新检查它们的准确性，以防它们似乎又表现良好，如果是，则将它们重新加入集成。\n\
  \n估计一个分类器的准确性所需的样例远少于从头构建一个新分类器所需的样例，因此这种方案以内存换取训练时间。当库变得太大时，需要额外的规则来丢弃分类器。\n\n\
  Gonçalves 和 de Barros [143] 提出的 RCD 循环概念框架可作为 MOA 扩展获得。\n\n#### 7.8 MOA 实验课\n\n\
  在本实验课中，我们将通过图形界面使用 MOA，结合各种集成流式分类器和演化数据流。\n\n**练习 7.1** 我们从非演化场景开始。`RandomRBF` 数据生成器为每个类创建一组随机中心，每个中心包含一个权重、每个属性的一个中心点和一个标准差。然后它通过随机选择一个中心（考虑权重）来生成实例，这决定了类别，并随机选择属性值和一个相对于中心的偏移量。整体向量被缩放到一个长度，该长度从围绕中心的高斯分布中随机采样。\n\
  \na. 使用 Prequential 评估和 `BasicClassificationPerformanceEvaluator`，在默认值下，Naive Bayes\
  \ 在 1,000,000 个实例的 `RandomRBFGenerator` 数据流上的准确率是多少？\n\nb. 在相同情况下，Hoeffding Tree\
  \ 的准确率是多少？\n\n\n\n##### 练习 7.2\n\nMOA 的霍夫丁树算法可以在叶节点使用不同的预测方法。默认是自适应朴素贝叶斯方法，但也可以通过指定\
  \ `-l` (`trees.HoeffdingTree -l MC`) 来使用多数类分类器。您可以在 MOA 的*配置*界面中进行设置（您需要向下滚动）。\n\
  \na. 当叶节点使用多数类分类器时，霍夫丁树的准确率是多少？\n\nb. OzaBag 装袋分类器的准确率是多少？\n\n##### 练习 7.3\n\n现在让我们使用一个演化数据流。`RandomRBFGeneratorDrift`\
  \ 生成器质心的移动速率可以通过 `speedChange` 参数控制。\n\na. 在 `speedChange` 为 0.001 的 `RandomRBFGeneratorDrift`\
  \ 数据流（1,000,000 个实例）上使用朴素贝叶斯分类器。再次使用 `BasicClassificationPerformanceEvaluator` 进行预测式评估。获得的准确率是多少？\n\
  \nb. 在相同条件下，霍夫丁树的准确率是多少？\n\nc. OzaBag 对应的准确率是多少？\n\n##### 练习 7.4\n\n霍夫丁自适应树通过构建尝试性的“替代分支”来为变化做准备，并在它们变得更准确时切换到这些分支，从而适应数据流中的变化。使用一个具有理论保证的变化检测器\
  \ (ADWIN) 来检查是否替换替代子树。\n\na. 在上述情况下，`HoeffdingAdaptiveTree` 的准确率是多少？\n\nb. `OzaBagAdwin`（ADWIN\
  \ 自适应装袋技术）的准确率是多少？\n\nc. 最后，`LeveragingBag` 方法的准确率是多少？\n\n##### 练习 7.5\n\n除了数据流，MOA\
  \ 还可以处理 ARFF 文件。我们将使用 `covtypeNorm.arff` 数据集，该数据集可以从 MOA 网站下载。运行以下任务，该任务使用朴素贝叶斯分类器：\n\
  \n```\nEvaluatePrequential\n-s (ArffFileStream -f covtypeNorm.arff)\n-e BasicClassificationPerformanceEvaluator\n\
  -i 1000000 -f 10000\n```\n\n您必须将其复制并粘贴到*配置*文本框中，因为您无法在 MOA 的交互式界面中指定 `ArffFileStream`。此外，文件的默认位置是\
  \ MOA 安装文件夹的顶层——您可能会在那里找到您在上一节实验中创建的模型文件 `modelNB.moa` 和 `modelHT.moa`——所以您应该将 ARFF\
  \ 文件复制到那里，或者在命令中使用其完整路径名。\n\na. 朴素贝叶斯在此数据集上的准确率是多少？\n\nb. 霍夫丁树在同一数据集上的准确率是多少？\n\n\
  c. 最后，杠杆装袋的准确率是多少？\n\nd. 哪种方法在此数据上速度最快？\n\ne. 哪种方法最准确？\n\n#### 8 回归\n\n回归是一种学习任务，其目标是预测一个数值，而不是像分类那样预测一个分类属性。分类中使用的一些技术可用于回归，但并非全部。决策树、感知机和惰性学习经过修改后可用于回归。\n\
  \n##### 8.1 简介\n\n给定一个要预测的*数值*属性，称为*结果* (outcome)，回归算法构建一个模型，为每个未标记实例 *x* 预测 *x*\
  \ 的结果的数值预测 *y*。\n\n回归问题的例子包括无法简化为离散标签的数量预测，例如股市价格、产品销量、时间延迟或网站访问量。可以通过将结果的值离散化为区间，将回归问题归约为分类问题；反之，也可以将离散类别转换为数值变量，利用回归算法进行分类。当然，这些转换不一定能产生最优结果。\n\
  \n最简单的回归算法是返回目标属性的平均值。这相当于分类中的多数类方法，即一种不使用其他属性信息的学习器。一种在非流式回归中更有用的方法是*线性回归*。\n\n\
  线性回归构建一个形式为\n\n```\nf(x) = w0 + w1*x1 + ... + wp*xp\n```\n\n的线性模型 *f*，该模型最小化残差平方和：\n\
  \n```\nRSS(w) = Σ(yi - f(xi))²\n```\n\n其中输入是 *N* 对 (*x*[*i*]*, y*[*i*]) 的集合。然而，精确解是\n\
  \n```\nw = (X^T X)^-1 X^T y\n```\n\n这很难增量计算，更不用说在流式设置中了。可以使用随机投影草图给出近似解（例如参见 [73,\
  \ 248]），但它们在实际数据挖掘中的应用仍处于初步阶段。因此，我们寻找其他更明显具有增量性和自适应性的策略。\n\n##### 8.2 评估\n\n为了评估回归方法，我们可以使用与分类相同的方法论，如留出法、预测式和交错测试-训练法，但错误分类率度量不适用。回归中通常考虑以下度量：\n\
  \n*   **均方误差 (MSE)：** 这是最常用的度量，通过实际值与预测值之差的平方的平均值给出误差：\n\n```\nMSE = (1/N) * Σ(yi\
  \ - ŷi)²\n```\n\n*   **均方根误差：** 均方误差的平方根：\n\n```\nRMSE = sqrt(MSE)\n```\n\n*   **相对平方误差：**\
  \ 回归方法的 MSE 与最简单回归方法（均值回归算法）的 MSE 之比：\n\n```\nRSE = MSE(model) / MSE(mean)\n```\n\
  \n*   **相对平方根误差：** 相对平方误差的平方根：\n\n```\nRRSE = sqrt(RSE)\n```\n\n*   **平均绝对误差：**\
  \ 该度量类似于 MSE，但考虑差值的绝对值：\n\n```\nMAE = (1/N) * Σ|yi - ŷi|\n```\n\n*   **相对绝对误差：**\
  \ 类似于相对平方误差，但考虑差值的绝对值：\n\n```\nRAE = MAE(model) / MAE(mean)\n```\n\n很容易看出，所有这些度量都可以通过在内存中维护固定数量的值来增量计算。\n\
  \n##### 8.3 感知机学习\n\n感知机 [37] 在第 6.5 节中作为一种在线分类方法被提出。然而，它也可以很自然地被视为一种回归方法。\n\n给定一个实例对\
  \ (*x*[*i*]*, y*[*i*]) 的数据流，其中 *x*[*i*] 是一个示例，*y*[*i*] 是其数值结果值，感知机的目标是在示例上最小化 MSE。为此，策略再次是沿着下降误差梯度的方向移动权重向量\
  \ *w* 中的每个权重。\n\n在这种情况下，更新规则变为：\n\n```\nw <- w + η * (yi - ŷi) * xi\n```\n\n与分类一样，权重可以在每个单独示例上更新，如上述权重所示，或者以小批量为单位进行单次更新步骤。这使我们能够微调更新时间和自适应性之间的权衡。\n\
  \n##### 8.4 惰性学习\n\n惰性学习是分类和回归中最简单、最自然的模型之一——特别是 *k* 近邻算法。给定实例间的距离函数 *d*，回归中的 *k*-NN\
  \ 方法找到最接近待预测实例的 *k* 个实例，并对它们的结果取平均。与分类一样，平均值可以根据到每个邻居的距离进行加权。\n\n该方法的性能强烈依赖于所使用的距离函数。对于具有数值属性的稠密实例，欧几里得距离可能是合适的。对于文本数据，余弦相似度度量或\
  \ Jaccard 系数可能更合适。\n\n`IBLStreams` 是由 Shaker 和 Hüllermeier [225] 提出的用于流式回归的惰性学习实现。除了流式\
  \ *k*-NN 的基本思想外，它还包括用于从数据库中移除异常点、移除与数据库中已有实例过于接近的实例（因此不太有用），以及自适应选择数据库大小和参数 *k*\
  \ 的启发式方法。\n\n##### 8.5 决策树学习\n\n\n\n\n###### 带漂移检测的快速增量模型树 (FIMT-DD)\n\n带漂移检测的快速增量模型树\
  \ (FIMT-DD) 是一种用于流式回归的决策树，由 Ikonomovska 等人 [139] 提出。它是 Hoeffding Tree 方法的扩展，主要在以下方面有所不同：\n\
  \n#### 分裂标准\n\n使用**方差缩减**代替信息增益；即，选择使方差 ![](img/pg146-in-1.png) 最大程度缩减的属性进行分裂。\n\
  \n#### 数值属性\n\n它们通过第 6.4.2 节中详尽二叉树方法的扩展来处理。在树的每个节点，该方法存储一个 `key` 值，并为两个范围 `≤ key`\
  \ 和 `> key` 分别保留以下信息：\n\n*   数值结果值的总和，\n*   结果值平方的总和，以及\n*   实例数量的计数。\n\n#######\
  \ 剪枝\n\n使用一些剪枝规则以避免存储结果的每一个单独值。\n\n####### 叶节点的线性模型\n\n在叶节点使用感知机以适应漂移。\n\n#######\
  \ 概念漂移处理\n\n在决策树的内部节点使用 Page-Hinkley 检测来检测错误率的变化。\n\n####### 树更新\n\n当子树表现不佳时，利用新到达的实例生长一棵备选树；当（且仅当）备选树表现更好时，它将替换原始树。\n\
  \n总体而言，FIMT-DD 的行为类似于用于分类的 Hoeffding Trees，是回归任务的最先进方法之一。[140] 中随后提出了一种用于回归的选项树。\n\
  \n##### 8.6 决策规则\n\n决策规则是一种兼具高表达能力与高可解释性的形式化方法。因此，在批处理场景下，学习决策规则集受到了高度关注。在流式场景中，由\
  \ Almeida、Ferreira、Gama、Duarte 和 Bifet [12, 13, 90–92] 开发的 AMRules 算法是第一个且仍然是最流行的规则学习系统。\n\
  \nAMRules 代表自适应模型规则，专门设计用于随着数据流演进而向规则集中添加和移除规则。AMRules 中的规则形式为 `A → M`，其中：\n\n*\
  \   前件 `A` 是字面量的合取，`M` 是发出预测的模型。\n*   字面量要么是形式为 `A = a` 的条件，其中 `A` 是离散属性，`a` 是其值之一；要么是形式为\
  \ `A ≤ v` 或 `A ≥ v` 的条件，其中 `A` 是连续属性，`v` 是实数值。如果示例 `x` 满足规则前件中的所有条件，我们称该规则**覆盖**示例\
  \ `x`。\n*   模型 `M` 是一个回归模型。AMRules 支持三种类型的回归器：\n    1.  由该规则覆盖的示例计算得出的目标属性均值；\n\
  \    2.  属性的线性组合；以及\n    3.  一种自适应策略，在 (1) 和 (2) 之间选择，挑选近期示例上 MSE（均方误差）较低的那个。\n\n\
  AMRules 维护一组既不互斥也不完备的规则，这意味着它们不必覆盖所有示例，且一个示例可能被多条规则覆盖。这使其区别于决策树，后者自然可视为一组互斥且完备的规则。规则集可视为有序或无序；AMRules\
  \ 同时支持这两种视图。若视为有序，示例的预测为覆盖它的第一条规则的预测。若视为无序，则对覆盖该示例的所有规则进行评估并将其预测结果取平均。此外，AMRules\
  \ 维护一条特殊的*默认*规则，它没有前件，在没有规则覆盖示例时应用。\n\n算法的核心在于创建新规则、扩展现有规则和删除表现不佳规则的方法。\n\n######\
  \ 规则扩展\n\n以类似于 Hoeffding Tree 对树的处理方式，对于每条规则和每个属性，算法监控若将该属性添加到规则中所引入的标准差缩减 (SDR)。如果所有潜在属性中最大的两个\
  \ SDR 度量的比值超过阈值，则将具有最大 SDR 的特征添加到规则中以扩展它。当接收到一个示例时，若规则集为有序，则用它更新计算覆盖它的第一条规则的 SDR\
  \ 值所需的统计量；若规则集为无序，则更新覆盖它的所有规则的统计量。仅当规则接收到一定最小数量的示例 `N[min]` 后，才会考虑对其进行扩展。\n\n######\
  \ 规则创建\n\n如果默认规则被扩展，它将成为一条普通规则并被添加到模型的规则集中。一个新的默认规则会被初始化以替代被扩展的那条。\n\n###### 规则删除\n\
  \n使用 Page-Hinkley 检测监控每条规则在其覆盖示例上的错误率。如果检测指示其累积错误超过阈值，则该规则可能被移除。\n\n据 [90, 92] 报道，AMRules\
  \ 在各种合成和真实数据集上的平均性能优于 IBLStreams 和 FIMT-DD。无序版本似乎能达到比有序版本略低的错误率；然而，这是以可解释性为代价的，因为如果预测来自单条规则，比作为多条规则预测的平均值更容易理解。\n\
  \n##### 8.7 MOA 中的回归\n\nMOA 目前包含本章讨论的算法：Average（或 Majority）算法、Perceptron、IBLStreams（作为扩展）和\
  \ AMRules。\n\n它还包含 SGD，一种用于学习各种线性模型（二分类 SVM、二分类逻辑回归和线性回归）的随机梯度下降法，以及 SPegasos，即\
  \ Shalev-Shwartz 等人 [226] 提出的 Pegasos（支持向量机的原始估计次梯度求解器）方法的随机变体。\n\n#### 9 聚类\n\n\
  聚类是一项*无监督*学习任务，作用于无标签数据。它包含根据实例的共性或亲和性将一组实例分配到不同组中。与分类的主要区别在于，在学习过程开始前组别是未知的，事实上任务正是创建这些组别。聚类的用途包括市场营销中的客户细分和社交网络中的社区发现等。\n\
  \n许多（但非全部）聚类方法基于这样一个假设：实例是某空间中的点，我们可以在该空间上施加距离函数 `d`，且更相似的实例在距离上更近。在许多此类方法中，聚类由该空间中的一组质心点决定。一种更正式的基于质心的聚类定义如下：给定一组属于某空间\
  \ `X` 的实例 `P`，`X` 中元素间的距离函数 `d`，以及可选的聚类数 `k`，聚类算法计算一组质心或聚类中心 `C ⊆ P`，满足 `|C| = k`，使其（近似地）最小化目标函数\n\
  \n![](img/pg149-1.png)\n\n其中\n\n![](img/pg149-2.png)\n\n即 `x` 到 `C` 中最近点的距离。\n\n\
  如所述，一些算法要求用户指定 `k` 的值，而另一些则自行确定聚类数量。请注意，若取 `k = |P|` 并将每个实例单独分配到一个聚类，会导致代价为 0 的聚类，因此如果\
  \ `k` 不受限制，为了获得有意义的结果，将需要对聚类数量施加某种形式的惩罚。\n\n\n\n\n我们首先讨论聚类中的评估问题，并回顾流行的 `k`-means\
  \ 方法。然后我们讨论三种增量方法，它们或多或少地受到 `k`-means 的启发：Birch、BICO 和 CLUSTREAM。之后，我们将研究两种基于密度的方法，从用于非流数据的\
  \ DBSCAN 开始，这引出了用于流式设置的 Den-Stream。最后，我们描述了两种更新的、最先进的基于树的流式聚类方法：ClusTree 和 StreamKM++。我们在结束语第\
  \ 9.7 节中提供了其他方法的参考和简要讨论。\n\n##### 9.1 评估度量\n\n不幸的是，评估聚类不像评估分类器那样明确无误。文献中描述了许多不同的聚类质量度量，也许太多了，它们形式化了“良好聚类”应达到的不同期望。\n\
  \n度量可分为两大类：结构性或内部度量，以及基于真实标签的度量，称为外部度量。第一类严格基于数据点和获得的聚类结果。关于三十种内部度量的广泛研究见文献 [178]，外部度量的其他研究包括\
  \ [57, 231, 250]。一些示例如下：\n\n*   **凝聚度：** 数据集中某点到其分配的簇质心的平均距离。越小越好。\n*   **SSQ（误差平方和）：**\
  \ 数据点到其分配质心的平方距离之和。与凝聚度密切相关。越小越好。\n*   **分离度：** 某点到分配给其他簇的点的平均距离。越大越好。\n*   **轮廓系数：**\
  \ 粗略地说，是凝聚度与点到其第二近质心的平均距离之比。它奖励那些点非常接近其分配的质心且远离任何其他质心的聚类结果，即具有良好凝聚度和良好分离度的聚类。\n\n\
  另一方面，外部度量需要知道数据点的“真实”聚类，或真实标签，根据定义，这在实际场景中几乎总是未知的。然而，在评估新的聚类算法时，人们通常从已知的生成器创建合成数据集，因此可以将算法获得的聚类与真实模型进行比较。在这种情况下，某些度量类似于分类或信息检索中应用的其他度量：\n\
  \n*   **准确率：** 分配到其“正确”簇的点的比例。\n*   **召回率：** 一个簇中实际上被分配到该簇的点的比例。\n*   **精确率：** 分配到一个簇且真正属于该簇的点的比例。\n\
  *   **纯度：** 在纯度最高的聚类中，簇内的所有点都属于同一个真实标签类别或簇。形式上，纯度为\n\n![](img/pg151-in-1.png)（簇\
  \ `c` 中属于 `c` 的多数类别的点数）：\n\n*   **簇映射度量 (CMM)：** Kremer 等人 [151] 引入的一种度量，专门为演化数据流设计，它考虑到簇随时间的合并和分裂可能会产生表面上的错误。\n\
  \n如果质心保持固定，上述列出的度量可以通过存储固定数量的值轻松增量维护。当质心随时间演化时，我们可以求助于将这些值转化为 EWMA 累加器，或在滑动窗口上进行评估。\n\
  \n##### 9.2 `k`-means 算法\n\n`k`-means（也称为 Lloyd 算法）是聚类中最常用的方法之一，因其简单性而著称。图 9.1 展示了其伪代码。\n\
  \n![图 9.1 k-means 聚类算法，或 Lloyd 算法。](img/Fig9-1.png)\n\n**图 9.1**\n\nk-means 聚类算法，或\
  \ Lloyd 算法。\n\n`k`-means 假设点集 `P` 是某维度 `d` 下 ℜ^(`d`) 的子集，以便点可以相加和求平均。算法以未指定的方式选择\
  \ `k` 个质心开始——例如，随机选择。之后，迭代两个步骤：首先，将每个实例分配给最近的质心；其次，将质心重新计算为分配给它的示例的均值或质心。该过程通常在没有点改变质心时停止，或在执行了最大迭代次数后停止。产生的\
  \ `k` 个质心决定了算法找到的 `k` 个簇。\n\n`k`-means 隐含的贪心启发式仅保证收敛到局部最小值，且 `k`-means 找到的解的质量和收敛速度众所周知地取决于初始随机分配步骤。`k`-means++\
  \ [19] 通过使用新的初始化步骤，提高了该方法相对于纯随机方法的稳定性：\n\n```\n1        choose center c[1] to be\
  \ p[1]\n2        for i = 2,…,k\n3              do select c[i] = p ∈ P with probability\
  \ d(p,C)/cost(C,P).\n```\n\n简而言之，初始中心随机选择，但所有后续中心的选择概率与其到已选中心的距离成正比。分散 `k` 个初始簇中心有助于加快收敛速度并达到更好的局部最小值。流式聚类方法\
  \ StreamKM++ 也采用了这一策略。\n\n将 `k`-means 转换为流式设置并不直接，因为它需要反复迭代数据集。我们将看到，大多数流式聚类方法有两个阶段，一个在线阶段和一个离线阶段。在线阶段更新数据的统计信息，生成某种形式的摘要或草图，通常表示为称为\
  \ `microclusters`（微簇）的少量点。然后离线阶段利用这些摘要高效地计算最终聚类，要么在固定的时间间隔，要么按需进行。\n\n##### 9.3\
  \ BIRCH、BICO 和 CLUSTREAM\n\n这三种算法是增量式的，并共享一个共同的思想：用微簇来总结数据流，以便在离线阶段对它们进行聚类。\n\n\
  平衡迭代缩减和聚类利用层次结构 (BIRCH) 由 Zhang 等人 [258] 提出。它是第一种提出使用所谓的 `clustering feature`（聚类特征，CF）向量来表示微簇的增量聚类方法。假设数据集点是\
  \ `d` 个实数的向量，CF 是一个三元组 (`N, LS, SS`)，由以下项目组成：\n\n*   `N`：CF 中数据点的数量\n*   `LS`：`N`\
  \ 个数据点的 `d` 维向量和\n*   `SS`：`N` 个数据点的 `d` 维平方和。\n\nCF 具有以下有用属性：\n\n*   它们是可加的：`CF[1]\
  \ + CF[2] = (N[1] + N[2], LS[1] + LS[2], SS[1] + SS[2])`。\n*   从 CF 很容易计算点到簇的距离、平均簇间距离和平均簇内距离。\n\
  \nBIRCH 的另一个特点是使用 `CF trees`（CF 树），一种类似于经典 `B+` 树数据结构的高度平衡树。它由两个参数定义：分支因子 `B`，即任何给定节点可能拥有的最大子节点数，以及叶子半径阈值\
  \ `R`。算法维护这样一个属性：由叶子表示的所有点都落在该处质心半径 `R` 的球内。每个叶子节点和每个内部节点都包含一个 CF 向量。\n\nBIRCH 算法包含多达四个阶段：\n\
  \n> 阶段 1：扫描所有数据并构建初始内存 CF 树\n>\n> 阶段 2：将 CF 树压缩成一个更小的树（可选）\n>\n> 阶段 3：全局聚类\n>\n\
  > 阶段 4：细化簇（可选且离线，因为它需要更多遍数）。\n\n\n\n\n###### 第 2、3 和 4 阶段：离线部分\n\n特别是第 3 阶段，基于 CF\
  \ 树中收集的信息执行批量聚类。第 1 阶段是在线过程，也是实际作用于数据流的过程。对于每个到达的点，算法会下降树，更新遍历的内部节点 CF 的统计信息，以到达最接近该点的叶节点。然后它检查叶节点是否能在半径\
  \ `R` 内吸收该点。如果可以，则通过更新叶节点统计信息将该点“分配”给叶节点。如果不行，则为新点创建一个新叶节点。这个新叶节点可能导致父节点拥有超过 `B`\
  \ 个子节点；如果是这样，它必须分裂成两个，以此类推，递归地向上直到根节点。此处未描述的另一条规则，会被应用于合并在此过程中可能变得过近的叶节点和内部节点。\n\
  \n###### BICO\n\n**BICO**（“BIRCH meets coresets for `k`-means clustering”，即 BIRCH\
  \ 结合用于 `k` 均值聚类的核心集）由 Fichtenberger 等人 [101] 提出。它将 BIRCH 的数据结构与用于聚类的核心集理论概念相结合。核心集在\
  \ 9.6 节中有详细解释。BIRCH 通过启发式方式决定如何将点分组到子簇中。BICO 的目标是找到一个不仅规模小，而且能提供近似原始点集保证的简化集合。\n\
  \n###### CLUSTREAM\n\n**CLUSTREAM** 由 Aggarwal 等人 [6] 提出，旨在作为 BIRCH 的一种自适应扩展，能够处理不断变化的数据流。在\
  \ CLUSTREAM 中，CF 树的节点维护形式为 `(N, LS, SS, LT, ST)` 的 CF 向量，这通过两个额外的时间特征扩展了 BIRCH CF：\n\
  \n*   `LT`：时间戳之和\n*   `ST`：时间戳平方和\n\nCLUSTREAM 的离线阶段只是定期对 CF 树叶节点处的微簇应用 `k` 均值算法。在线阶段类似于\
  \ BIRCH，但它考虑了簇的新近度。它在内存中保持最大数量的微簇。如果一个点需要创建一个新微簇（叶节点）但没有更多可用空间，算法要么删除最旧的微簇，要么合并两个最旧的微簇。“最旧”微簇的概念是通过考虑微簇中是否有显著的近期活动来定义的。更准确地说，统计量\
  \ `LT` 和 `ST` 被用来计算其时间戳的平均值和标准差；假设时间戳呈正态分布，算法可以利用它们来决定微簇中所需比例的点是否早于期望的新近度阈值。\n\n\
  由于选择删除的是最旧的簇而不是最小的簇，这赋予了 CLUSTREAM 一个有趣的特性：通过查看具有相似时间戳分布的微簇，我们可以获得所需时间范围内的聚类快照，对更近的时间范围分辨率更高，随着时间推移分辨率逐渐降低。这有时被称为*金字塔式*时间范围。\n\
  \n##### 9.4 基于密度的方法：DBSCAN 和 Den-Stream\n\n基于密度的聚类器基于这样一种思想：簇的形成不仅基于距离上的整体邻近性，还基于连接的密度。因此，它们生成的簇可能不是球形的，而是具有适应特定被聚类数据形状的形状。\n\
  \n**DBSCAN** 算法 [96] 由 Ester 等人提出，是最著名的基于密度的离线算法。它基于这样一种思想：簇应该围绕其邻域内拥有大量点的点来构建。以下定义将这一思想形式化：\n\
  \n*   `p` 的 `ε`-邻域是距离 `p` 在 `ε` 或以内的点的集合。\n*   **核心点** 是其 `ε`-邻域具有至少 `μ` 总权重（数据集点的比例）的点。\n\
  *   **密度区域** 是核心点 `ε`-邻域的并集。\n*   如果 `q` 在 `p` 的 `ε`-邻域内，则点 `q` 从 `p` **直接可达**。如果存在序列\
  \ `p[1], …, p[n]` 使得 `p[1] = p`，`p[n] = q`，且每个 `p[i+1]` 都从 `p[i]` 直接可达，则点 `q` 从\
  \ `p` **可达**。\n*   核心点 `p` 与所有从它可达的（核心或非核心）点形成一个簇。\n*   所有从核心点不可达的点都被视为 **异常值**。\n\
  \n请注意，簇由其包含的任意核心点决定，并且对于给定的 `ε` 和 `μ` 值，这些定义为任何数据集创建了唯一的聚类。\n\nDBSCAN 算法具有参数 `ε`\
  \ 和 `μ`，并利用这些属性来寻找这个唯一的聚类。它以任意顺序访问数据集中的点。对于一个先前未访问的点 `p`，它找到所有从 `p` 直接 `ε`-可达的点。如果发现\
  \ `p` 是一个 `μ` 核心点，则形成一个新簇，并将所有从 `p` 可达的点添加到该簇中并标记为已访问；否则，如果 `p` 的权重低于 `μ`，则暂时将其标记为“异常值”，并继续处理下一个未访问的点。异常值稍后可能被发现从真正的核心点可达，并被宣布为“非异常值”并添加到某个簇中。\n\
  \n观察可知，DBSCAN 强烈依赖非流式处理，因为每个点可能被反复访问。\n\n**Den-Stream** 由 Cao 等人 [61] 开发，是一种基于与\
  \ DBSCAN 相似思想但使用微簇快速计算在线统计信息的基于密度的流式方法。它使用阻尼窗口模型，意味着每个数据点的权重使用衰减函数 `f(t) = 2^(-λt)`\
  \ 指数级减小，其中 `λ > 0`。\n\n对于一个中心为 `c` 且代表点 `p[1], p[2], …, p[n]`、时间戳为 `T[1], T[2],\
  \ …, T[n]` 的微簇，Den-Stream 在时间 `t` 维护以下信息：\n\n*   **权重**：![](img/pg156-in-1.png)\n\
  *   **中心**：![](img/pg156-in-2.png)\n*   **半径**：![](img/pg156-in-3.png) （实际上，保存的是\
  \ `p[i]` 平方和，需要时可由此计算 `r`）\n\n微簇有两种类型：根据权重是大于还是小于 `μ`，微簇被称为 **潜在核心微簇** 或 **异常值微簇**。因此，异常值微簇是尚未（或还没有）拥有足够权重被视为核心的微簇。\n\
  \n**DEN-STREAM** 方法有两个阶段：在线阶段和离线阶段。它们的伪代码如 图 9.2 所示。在在线阶段，每当一个新点到达时，DEN-STREAM 首先尝试将其合并到潜在微簇之一中。如果不可能，则尝试将该点与异常值微簇合并。如果异常值微簇的权重增加到足以成为潜在微簇，则该微簇被提升。否则，DEN-STREAM\
  \ 启动一个新的异常值微簇。离线阶段包括移除未达到足够权重的微簇，并执行批量 DBSCAN 聚类。\n\n![图 9.2 DEN-STREAM 算法。](img/Fig9-2.png)\n\
  \n**图 9.2**\n\nDEN-STREAM 算法。\n\n##### 9.5 CLUSTREE\n\n迄今为止介绍的流式聚类算法都需要应用离线阶段才能在请求时生成簇。相比之下，**CLUSTREE**（Kranen\
  \ 等人 [150]）是一种 **随时聚类** 方法，即它可以在任何时间点提供聚类结果。它是一种无参数算法，能自动适应流的速度，并能检测流中的概念漂移、新颖性和异常值。\n\
  \nCLUSTREE 使用一种紧凑且自适应的索引结构来维护流摘要，具有对数插入时间。该结构是一棵平衡树，其中每个节点包含一定数量点的 CF，类似于 CLUSTREAM。这棵树包含不同粒度层级的微簇层次结构。平衡条件保证了对所有微簇的对数访问时间。\n\
  \n\n\n\n当一个新点到达时，CLUSTREE 方法会沿树向下遍历，以找到与该新点最相似的微簇。如果到达的叶节点处的微簇足够相似，则更新该微簇的统计信息；否则创建一个新的微簇。但是，与其他算法不同的是，该过程是可中断的：如果在到达叶节点之前有新点到达，正在处理的点会被暂时存储在当前内部节点的一个聚合中，插入过程随即中断。当稍后有新点通过该节点时，缓冲的局部聚合会作为“搭便车者”被带走并继续向下推送。通过这种方式，CLUSTREE\
  \ 可以防止在变速流的突发时刻丢失数据点。\n\n##### 9.6 StreamKM++：核心集\n\n给定一个问题和一组输入实例 `P`，*核心集* 是一个小的加权子集，可用于近似该问题的解。换句话说，为核心集求解该问题，即可为\
  \ `P` 上的问题提供一个近似解。在聚类中，我们可以将 (`k`, \U0001D716)-核心集定义为一对 (`S, w`)，其中 `S` 是 `P` 的子集，函数\
  \ `w` 为每个点分配一个非负实数值（即权重），使得对于 `P` 的每个大小为 `k` 的子集 `C`，以下条件均成立：\n\n```\ncost_w(C)\
  \ ≤ (1 + ε) cost_P(C)\n```\n\n其中 `cost_w` 表示成本函数，其中 `S` 的每个点 `s` 由 `w(s)` 加权。也就是说，在\
  \ `P` 上选择的任何可能的聚类，在由 `w` 加权的 `S` 上几乎同样好，反之亦然。因此，在 `S` 和 `P` 上求解聚类问题确实是近似相同的。\n\n\
  StreamKM++ 由 Ackermann 等人 [3] 提出，基于这一核心集思想。它使用第 9.2 节解释的随机 `k`-means++ 算法来创建一组初始种子\
  \ `S = {s[1], …, s[m]}`。然后将 `w(s[i])` 定义为 `P` 中比 `S` 中任何其他种子更接近 `s[i]` 的点的数量。文献\
  \ [3] 的主要结果之一是，如果 `m` 大致为 `O((k d / ε²) log n)` 形式，则以这种方式定义的 (`S, w`) 以概率 1 − `δ`\
  \ 成为一个 (`k`, \U0001D716)-核心集。此处，`d` 是 `P` 中点的维度，`n` 是 `P` 的基数。对 `n` 的依赖性非常好；对 `d`\
  \ 的依赖性则不那么理想，尽管实验结果似乎表明该界限关于 `d` 远非紧致。\n\n此外，StreamKM++ 将点放置在一个*核心集树*中，这是一种二叉树，旨在根据\
  \ `d` 加速采样。该树以层次结构描述簇，即根节点代表整个点集 `P`，树中每个节点 `p` 的子节点代表 `p` 中示例的一个划分。\n\nStreamKM++\
  \ 执行在线和离线两个阶段。在线阶段使用核心集树桶维护大小为 `m` 的核心集。对于包含 `n` 个点的流，该方法维护 `L = ⌈log₂(n/m)⌉` 个桶\
  \ `B[0], B[1], ..., B[L−1]`。桶 `B[0]` 可存储少于 `m` 个数，其余桶为空或维护 `m` 个点。每个桶维护一个大小为 `m`\
  \ 的核心集，代表 `2^(i−1)m` 个点。每当一个点到达时，它被插入第一个桶。如果第一个桶已满，则计算一个新桶，将 `B[0]` 和 `B[1]` 合并为一个新的核心集树桶，并移入\
  \ `B[2]`。如果 `B[2]` 不为空，则重复此合并并移动过程，直到到达一个空桶。\n\n在任何时间点，离线阶段都包含将 `k`-means++ 应用于大小为\
  \ `m` 的核心集。大小为 `m` 的核心集是从桶 `B[0], B[1], ..., B[L−1]` 的并集中获得的。\n\n请注意，StreamKM++\
  \ 无法处理演化数据流，因为它没有遗忘或时间衰减机制。\n\n##### 9.7 补充材料\n\n聚类可能是流挖掘中仅次于分类研究最多的任务，因此除了此处描述的方法外，还提出了许多其他方法，其中包括一些也可被视为最先进水平的方法。最近的综合性综述见\
  \ [84, 185] 和 [7, 第 10 章]。另请参阅 [4] 的第 2 章以获取早期的综述视角。\n\n文献 [84] 将流式聚类方法分为五类：划分方法、层次方法、基于密度的方法、基于网格的方法和基于模型的方法。在划分方法中，DGClust\
  \ 和 ODAC 属于性能最好的方法之一。在层次方法中，改进 CLUSTREAM 的有 HPstream、SWClustream（与 CLUSTREAM 不同，它可以分裂微簇）、EStream（通过出现、消失、合并和分裂操作显式建模簇动态）和\
  \ REPSTREAM（受 CHAMELEON 启发）。Andrés-Merino 和 Belanche [15] 提出的 STREAMLEADER 方法已在\
  \ MOA 上实现，并在指标和可扩展性方面均与 CLUSTREAM、Den-Stream 和 ClusTree 表现出极具竞争力的性能。在基于网格的方法中，除了\
  \ D-Stream，还可提及 MR-Stream 和 CellTree。更多参考和细节请参阅上述综述。\n\n鉴于我们在分类章节中对 Hoeffding 树的重视，我们提到了\
  \ Domingos 和 Hulten [89] 提出的极快 k-means (VFKM)。它延续了 Hoeffding 树的理念：即不对同一数据进行多次遍历，而是使用新鲜的流数据来模拟进一步的遍历，并利用\
  \ Hoeffding 界来确定算法何时已看到足够的数据以做出统计上可靠的选择。与 Hoeffding 树一样，VFKM 具有正式保证：如果两者都在无限数据上工作，它收敛到与\
  \ `k`-means 相同的聚类结果。\n\n##### 9.8 MOA 实验课\n\n在本实验课中，你将通过图形界面使用 MOA 来比较两种聚类算法，并以不同方式对它们进行评估。\n\
