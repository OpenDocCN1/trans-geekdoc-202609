  \n**图 3.4**  \n\n练习 3.2，在同一分类器上比较三种不同的评估方法。\n\n##### 3.2.1 漂移流生成器\n\nMOA 流是通过生成器构建的，可以读取\
  \ ARFF 文件、连接多个流或过滤流。MOA 流生成器允许我们模拟潜在的无限数据序列。\n\n可以构建表现出概念漂移或概念随时间变化的流。两个例子是旋转超平面和随机\
  \ RBF 生成器。这些流中的变化率由一个参数决定，其操作将在第 12 章中解释。\n\n我们也可以通过连接多个流来引入概念漂移或变化。在 MOA 中，这是通过构建两个纯分布的加权组合来完成的，这两个纯分布表征了变化前后的目标概念。MOA\
  \ 使用 Sigmoid 函数作为一种优雅且实用的解决方案，来定义流中每个新实例在漂移后属于新概念的概率。Sigmoid 函数引入了一种渐进、平滑的过渡，其持续时间由两个参数控制：`p`，即变化发生的位置，以及过渡的长度\
  \ `w`，如 图 3.5 所示。\n\n![Figure 3.5 A sigmoid function f(t) = 1/(1 + e−4(t−p)/w).](img/Fig3-5.png)\n\
  \n**图 3.5**  \n\n一个 Sigmoid 函数 `f(t) = 1/(1 + e^(-4(t-p)/w))`。\n\n\n\n一个示例是：\n\n\
  ```\nConceptDriftStream -s (generators.AgrawalGenerator -f 7)\n-d (generators.AgrawalGenerator\
  \ -f 2) -w 1000000 -p 900000\n```\n\n其中 `ConceptDriftStream` 的参数为：\n\n*   `-s`：初始流生成器\n\
  *   `-d`：漂移或变化后的流生成器\n*   `-p`：变化的中心位置\n*   `-w`：变化周期的宽度\n\n##### 练习 3.3\n\n比较霍夫丁树与朴素贝叶斯分类器的准确率，针对速度变化为\
  \ 0.001、包含 1,000,000 个实例的 `RandomRBFGenerator` 流，使用交织测试-再-训练评估。\n\n此示例所需的任务为：\n\n\
  ```\nEvaluateInterleavedTestThenTrain -l bayes.NaiveBayes\n-s (generators.RandomRBFGeneratorDrift\
  \ -s 0.001)\n-i 1000000 -f 10000\n```\n\n```\nEvaluateInterleavedTestThenTrain -l\
  \ trees.HoeffdingTree\n-s (generators.RandomRBFGeneratorDrift -s 0.001)\n-i 1000000\
  \ -f 10000\n```\n\n两个分类器的对比显示在 图 3.6。\n\n![图 3.6 练习 3.3，在非平稳流上比较霍夫丁树和朴素贝叶斯分类器。](img/Fig3-6.png)\n\
  \n**图 3.6**\n\n练习 3.3，在非平稳流上比较霍夫丁树和朴素贝叶斯分类器。\n\n##### 练习 3.4\n\n比较上一练习中流使用三种不同分类器的准确率：\n\
