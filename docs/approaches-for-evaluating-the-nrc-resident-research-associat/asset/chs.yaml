  \ 国家科学院，DataRAP 数据库，工作人员统计表。\n\n### 年龄\n\n如章节开头所述，博士后学生的平均年龄正在上升，部分原因是获得博士学位的时间延长。图\
  \ 2-12\n\n```\n图 2-12 按研究项目划分的申请者和授予者的平均年龄，1965-2007\n```\n\n**注：** 2007 年，并非所有的申请周期都已完成并记录在数据库中。\n\
  **来源：** 国家科学院，DataRAP 数据库，工作人员统计表。\n\n### 婚姻状况\n\n婚姻状况可能是博士后项目的重要人口统计特征。当许多人追求博士后职位时，他们也处于建立家庭的年龄。许多科学家的配偶也是科学家。了解这一统计特征有助于处理相关问题：双薪夫妻；薪资、福利和生活成本；育儿和产假。申请表包含一个婚姻状况问题。有两个选项：已婚和单身；尽管许多申请者留空。此外，有\
  \ 4 位申请者选择了 `F`——可能是关于性别的的数据编码。27 位 NIST 的申请者留了空白，368 位非 NIST 的申请者留了空白。121 位其他研究项目的授予者没有回答该问题。在注明婚姻状况的申请者和授予者中，已婚或单身的百分比情况见图\
  \ 2-13 和 2-14。\n\n```\n图 2-13 按研究项目划分的已婚申请者百分比，1965-2007\n```\n\n```\n图 2-14 按研究项目划分的已婚授予者百分比，1965-2007\n\
  ```\n\n\n\n\n其他 RAP 的申请者和研究助理（RA）通常比 NIST/NRC RAP 的申请者和获得者年龄更大，且更有结婚。（基础数据见附录表 B-10）。如图\
  \ 2-13）。这在许多方面存在问题。首先，268 名申请者简单地填写了“国家标准与技术研究院”。其次，几个旧的部门——例如国家工程实验室和国家测量实验室——映射到多个当代部门。我们将这些情况合并为一个新类别：“多个（Multiple）”，但它也可以被视为一个未知类别。最后，尽管对实验室名称进行了映射努力，但随时间变化的数据显示这并非完全成功。技术服务部门的申请涵盖了\
  \ 1965 年到 1978 年，但随后停止了，尽管该名称仍然存在，可能是申请者研究的内容更适合其他地方。其他实验室显然在 1992 年之前没有申请者，这同样可能反映了组织机构的变化。因此，跨越变化的分析以及基于种族/民族的分析（1980\
  \ 年之前没有此类数据）是不可根据的。在现有数据基础上，可以提供两个表格，分别侧重于按总计和按性别划分的实验室申请与录取情况。\n\n![](img/t200138f5_22.png)\n\
  \n这里的主要发现是申请在实验室之间的分布并不均匀。某些实验室比其他实验室吸引了更多申请者。同样，某些实验室授予的研究助理职位比其他实验室多。第二个发现是，录取率差异超过了一倍——这是一个很大的范围。确定为什么会出现这种情况可能具有启发性。可能的答案可能集中在研究领域、这些领域近期博士毕业生的其他机会，以及不同实验室的推广工作上。另一个可能的解释是刻意的“共享财富”努力。\n\
  \n表 2-18 \n\n### 拒绝录用\n\n焦点小组听到的一个担忧是 NIST 提供录取通知的速度不够快。本节查看了被接受的录用和被拒绝的录用。表 2-19\n\
  \n由于助理人数相对较少，这些拒绝可能更加明显。初步分析表明，该计划正变得越来越有声望，就业市场发生了变化，或者录取流程也发生了变化。\n\n## 初步结果\n\
  \n推广工作产生的合格申请者超过了 NIST 需要填充的名额，且人才日益多样化。总体而言，22% 的申请者获得了任命——这一比例低于其他 RAP。女性越来越多地申请\
  \ NIST/NRC RAP 并获得助理职位。对于女性来说，NIST/NRC RAP 似乎与其他 RAP 一样受欢迎。少数少数族裔也越来越多地申请 NIST/NRC\
  \ RAP 并获得助理职位。对于 NIST/NRC RAP 的申请者和获得者，至少有一半来自美国 20 所顶尖的博士学位授予机构。NIST/NRC RAP 的申请者和获得者与其所在\
  \ RAP 的对应者不同。自 1990 年以来，少数族裔获得 NIST/NRC 助理职位的比例高于获得其他项目的助理职位。NIST 助理申请者和获得者的平均年龄比申请其他助理职位的人年轻。NIST/NRC\
  \ RAP 的申请者和获得者更有可能是单身。他们更有可能拥有物理科学的博士学位，而非生物科学。大多数奖励授予了物理科学领域的博士。但由于该学科申请非常多，只有五分之一的此类背景申请者获得了奖励。\n\
  \n## 建议\n\n1. **NIST 应该对推广工作进行评估。**\n\na. 为了进行此类评估，需要收集数据。在这方面，申请表上关于申请者如何获知计划的问题是有用的并应该保留。然而，应对对“其他”类别进行进一步分析，并增加“网站”作为一个类别。\n\
  \nb. 可以从 NIST 人员和现任任助理收集额外数据。此类数据可以回答如下问题：\n\ni. NIST 人员和助理使用哪些机制与潜在申请者互动，以及\n\n\
  ii. 哪些机制似乎最有效？\n\niii. 是否有过针对多样性的专门努力？是如何做的？\n\n\n\n此类研究可以通过专家小组或对 NIST 员工以及现任或任研究助理（RA）进行调查来进行，以回答第一个和第三个问题，并为第二个问题的评估提供信息。还应该收集个人外推广工作的成本信息（例如，在广告上的花费、与毕业生会面的时间），以便与收益进行比较（每种个人推广类型带来了多少申请人）。\n\
  \nc. 促进推广工作评估的第二步是确定量化不同推广策略所得价值的指标，例如网站访问量或在专业会议上结识的研究生人数。\n\nd. 检查个人外推广策略的投资回报率。这可能包括此类策略：评估\
  \ NIST 网站的可用性和信息内容，或评估出版物广告的回报率。作为评估 NIST 网站的一部分，NIST 可以考虑增加研究导师的联系信息，以促进潜在申请者与相关\
  \ NIST 员工之间的对话。\n\ne. 最后，考虑目前是否有其他未充分利用但可能具有潜在价值的推广策略，例如向院长、系主任及其他大学管理人员发送直接邮邮件。\n\
  \nf. 此外，确定是否有任何可以作为 NIST/NRC RAP 良好候选人的研究生群体（以及潜在申请者）并不了解该计划以及如何申请，这一点非常重要。要构建一个研究生随机样本很困难，但进行有限的调查可能是可能的。\n\
  \n2. **NIST 应对拒绝研究助理职位录取的人员进行评估。** 这可以通过电话采访或调查的方式进行。由于每个周期拒绝的人寥寥，负担将相对较小。对于那些获得录取但拒绝的人，应该询问他们两个基本问题：（1）你为什么要拒绝？（2）你计划改做什么？\n\
  \n3. **NRC 应修改申请表。** 应该减少字段数量，特别是通过合并非常相似的标签，并移除用于多个字段的标签（例如，“生物物理、物理、生物化学”）。至少在博士领域，可以在美国国家科学基金会（NSF）的《已获博士学位调查》（Survey\
  \ of Earned Doctorates）中找到一个更短的领域列表示例（参见 附录 B）。\n\n4. **NRC 应更新 DataRAP 数据库，用当前的等效名称替换\
  \ NIST 中不再存在的组织名称（例如学院或实验室）。**\n\n# 3\n\n# 研究助理的经历\n\n研究助理（RA）在 NIST 留任最多两年进行研究。在专家小组期间，我们向现任和前任研究助理就他们在\
  \ NIST 的经历询问了几个问题。在现任研究助理中，他们很快指出这一任命是他们研究生后的第一项职业活动，也是学术之外的首次体验。现任研究助理报告说，在 NIST\
  \ 可以拥有相当大的研究自由，但因实验室和小组的不同而异。NIST 不同部门之间的差异可能是专家小组中出现的最重要主题之一。\n\n现任研究助理认为这一职位让他们对科学有了更广泛的视角。他们对这一经历感到非常满意，认为\
  \ NIST 是一个极佳的工作场所。他们还注意到加入 NIST/NRC RAP 为他们提供了更好的福利和更多进入 NIST 校区的机会。最后，一些参与者认为，在\
  \ NIST 等地方获取资源的机会可能比其他环境更好。\n\n从负面来看，他们认为 NIST/NRC RAP 是一种负担。现任研究助理指出，他们面临的官僚主义比其他环境更多。他们认为\
  \ NIST/NRC RAP 的设立并不是提供大量的指导，而且 NIST 的指导和导师制并不常见。他们认为需要大量指导或手把手帮助的 RA 在 NIST 表现并不好，而自给其力和独立是更成功（可能更满意）的\
  \ RA 的特征。\n\n现任研究助理对改进该计划的建议是增加薪水、可能延长任期并制定更好的休假政策。一些研究助理认为薪水高于许多学术职位。RA 的年底薪为 `60000`。最近一项针对博士后的调查显示，2005`\
  \ 年的薪水为 `38000`（Davis）。Sigma Xi 对博士后的一项调查发现，2006 年薪水在工业界为 `52750`，政府为 `50000`，医学院为\
  \ `40000`，学术界为 `38000`（Austin）。\n\n一些 RA 注意到他们的同事将他们视为平等对待，尽管考虑到前任 RA 目前处于临时或有条件的任命中，这是预期之中的。有些\
  \ RA 提到，考虑延长期限的原因之一与研究领域的转变有关。进入一个新的研究领域需要大量时间进入状态，并且最后还要急于进行研究和发表发现。参与者还认为家庭假不足。他们担心如果因为新生婴儿而请假，他们将直接失去任期时间，且无法补偿。\n\
  \n前任研究助理（正如 [第 1 章](../Text/ch010.xhtml#p200138f5ddd0015）所示，这些人仅限于留在 NIST 的人员）也对该计划推崇备至。相对于现任研究助理，他们认为该计划非常有声望。博士后被视为良好的跳板，特别是对于准备政府职业。前任\
  \ RA 认为该计划有几个好处，包括：合作（包括接触的科学家或工程师范围）、职业道路上的良好跳板，以及在 NIST 工作的良好途径。既不描述为负面也不正面，前任\
  \ RA 注意到有些 RA 并没有从事他们最初在申请中提议的研究。\n\n\n\n\n前任助理（RA）对改进计划的可能方法提出了一些建议。与目前的助理一样，他们认为薪资偏低，这再次归因于他们认为华盛顿大地区高昂的生活成本。关于助理是否能加薪，进行了一场有趣的讨论。他们发现，加薪信息的透明度不如他们的预期，一些前任助理认为，由于官僚主义的手段，他们无法获得加薪。同样，参与者的意见存在差异，这很大程度上取决于他们对哪个实验室比较熟悉。前任助理认为，两年的任期对于任命来说是合适的。最后，前任助理们不确定\
  \ NIST 内部谁是助理的“倡导者”（指当他们遇到任何问题时能提供帮助的人）。\n\n导师和部门部门负责人对该计划的益处持有不同的观点，更多地关注对 NIST\
  \ 的益处。他们指出，该计划是招募潜在员工、对人员进行两年考核以及留住优秀人才的好方法。一些参与者注意到，该计划是 NIST 招募的“主要”方式。他们还认为在\
  \ NIST 留助理有许多好处，包括：涵盖更广泛的专业知识、完成研究、引入新思想、进行创新研究以及帮助 NIST 与大学建立联系。\n\n导师和部门负责人还对改进计划提出了不同的建议。他们认为需要更好的招募手段。参与者认为人际关系是招募的关键。其次，他们认为应该建立一个全\
  \ NIST 范围的助理支持机制。他们希望看到更多供助理互动和建立人网络的活动。第三，与前任助理一样，他们认为两年是一个合适的期限，尽管他们愿意为选定的助理探索第三年的选择。导师和部门负责人认为，在某些领域申请者人数不足。增加申请量的一种方法是考虑将该奖项计划向非公民开放，尽管他们注意到非公民在\
  \ NIST 工作面临着更多限制。提到的另一个替代想法是让该奖项向绿卡持有者开放。总的来说，三个专家小组的参与者认为，该计划对助理个人和 NIST 都有无数的益处。\n\
  \n在量化这些益处方面，可利用的数据较少。两个主要来源是助理在完成其 NIST 任期（或任期）时填写的评估表，以及研究导师对助理的评估。（请见附录 8 和 9\
  \ 中的表格。）许多人并不认为这两份表格是强制性的，且大多数助理或导师并未填写。只有 253 名 NIST/NRC 助理部分或完全填写了最终报告，回复率约为 20%。`⁴¹`（此外，在计划初期，填写表格的助理与过去约\
  \ `t10` 年相比要少得多。）对于其他 RAP 计划的助理，有 6,936 人部分或完全填写了表格，回复率约为 69%。`⁴²` 研究导师的评估表没有足够的\
  \ NIST 导师进行填写（少于 20 人），以至于将表中的信息纳入对助理的评估中。因此，基于这些数据得出的结果应当谨慎。某些助理可能是无意或刻意回答的。\n\n\
  （注：提示词中提供的文本结尾包含一些乱码/重复短语，例如“这种差异在 0.05 水平上具有统计学意义。而且 NIST/NRC 助理更有可能进行至少一次国内报告。”）\n\
  \n\n\n对于国际报告，49%（共 253 人）的 NIST/NRC 研究人员（RAs）和 31%（共 6,936 人）的其他 RAP 研究人员提供了相关信息。NIST/NRC\
  \ 研究人员参加了 0 到 7 次国际报告，而其他 RAP 的研究人员则参加了 0 到 25 次国际报告。在受访者中，有更高比例的 NIST/NRC 研究人员至少参加过一次国际报告。如\
  \ 表 3-2 所示，NIST/NRC 研究人员和其他 RAP 的研究人员都没有进行过多次国际报告，平均次数均为一次。虽然 NIST/NRC 研究人员的平均次数略低于其他\
  \ RAP 研究人员（0.9 次对比 1 次），但这种差异在统计学上并不显著。\n\n![](img/t200138f5_28.png)\n\n### 专利\n\
  \n对于研究人员来说，博士后期间获得专利是非常罕见的。57%（共 253 人）的 NIST/NRC 研究人员和 28%（共 6,936 人）的其他 RAP 研究人员提供了有关获得专利的信息。在受访者中，如\
  \ 表 3-4 所示，NIST/NRC 研究人员与其他 RAP 研究人员的比例相似，均表示他们拥有一个或多个专利。从数字上来看，NIST/NRC 研究人员和其他\
  \ RAP 研究人员报告的平均专利数均为 0.1 个，没有统计学上的显著差异。\n\n![](img/t200138f5_29.png)\n\n### 奖项\n\
  \n对于任何计划的研究人员来说，奖项也是罕见的。29%（共 253 人）的 NIST/NRC 研究人员和 10%（共 6,936 人）的其他 RAP 研究人员提供了有关获得奖项的信息。与专利的情况类似，无论是从百分比还是数值上看结果都非常相似。在受访者中，如\
  \ 表 3-5 所示，12% 的 NIST/NRC 研究人员获得过奖项，而获得一个或多个奖项的其他研究人员比例为 16%。从数字上看，NIST/NRC 研究人员获得的这些稀有奖项少于其他\
  \ RAP 研究人员（0.1 个对比 0.2 个）。这种差异在 0.05 水平上具有统计学意义。⁴⁵ 然而，对奖项的定量衡量并没有太大帮助，因为某些奖项显然比其他奖项更重要。\n\
  \n|  ||  ⁴⁵ 基于异方差非对 t 检验。注意样本量不同，且样本不符合正态分布。 |\n| --- | --- |\n\n![](img/t200138f5_30.png)\n\
  \n## 研究人员对计划的看法\n\n评估表要求研究人员在 1 到 10 分的范围内，从六个维度对 RAP 进行评分，其中 1 代表差，10 代表优秀。考虑到专家小组中听到的积极反馈，这并不意外，大多数受访者对该计划有非常积极的看法。注意，问卷这部分的回答数量远少于其他部分，可能因为它位于问卷的末尾。这里的回答率约为\
  \ 15% 到 20%。因此，所有这些发现都需要谨慎对待。\n\n### 短期\n\n该维度要求研究人员从知识发展、技能提升和研究产出的方面对计划进行评估。37%（共\
  \ 253 人）的 NIST/NRC 研究人员和 14%（共 6,936 人）的其他 RAP 研究人员提供了该类别的信息。在受访者中，如 表 3-6 所示，平均得分为\
  \ 8.7，其中 NIST/NRC 研究人员的平均分为 8.5，其他 RAP 研究人员平均分为 8.7。两组之间的差异在统计学上并不显著。\n\n表 3-6 按计划研究人员对研究人员计划短期价值的评估\n\
