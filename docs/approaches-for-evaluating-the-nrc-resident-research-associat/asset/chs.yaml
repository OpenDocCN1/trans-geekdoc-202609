  \   d. 我的博士后经历教会了我进行独立研究所需的大部分知识\n   e. 我的博士后经历使我获得了我本不会发展的专业知识\n   f. 我与所在机构的人建立了长期的友谊\n\
  \   g. 我为能当一名 NIST 博士后感到自豪\n18. 您的博士后经历在多大程度上阻碍或帮助了以下每一项？（1 = 完全没有帮助 5 = 非常有帮助，加不适用）\n\
  \    a. 您当前研究的质量\n    b. 您当前研究的特定方向\n    c. 您当前研究的进展\n    d. 您获得后续资金的成功\n    e.\
  \ 您的教学/课程活动\n    f. 您指导他人的能力\n    g. 您从事前沿研究的信心\n    h. 您的整个职业\n    i. 其他：\\_\\\
  _\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\n19. 其他\n    a. 您向其他人推荐过这个博士后职位吗？\n\
  \    b. 您会推荐吗？\n    c. 博士后最好的特点是什么？\n    d. 博士后最糟糕的特点是什么？\n\n\n\n\ne. 如果你可以对程序进行改进，你会做出哪些改进？\n\
  \n# 5\n\n# 初步结果与建议\n\n## 初步结果\n\n报告的总体结论是，支持对 `NIST/NRC RAP` 进行全面评估的部分数据目前尚未被收集。虽然收集了一些数据，但填写表格的\
  \ `RAs`（研究助理）和顾问人数仍然较少，这可能意味着基于那些填写表格的人员所提供的信息的结果不能代表所有的 `RAs` 或所有的顾问。因此，在阅读结果时必须保持谨慎。在牢记这些前提的情况下，仍有许多有趣的发现。\n\
  \n首先考察申请者，申请表是一个非常实用的数据收集工具。在目前的三个工具——**申请表、最终报告、导师评估**中，申请表产生的数据最多。此外，个人沟通是申请者获知\
  \ `RAPs`（包括 `NIST/NRC RAP`）最可能的途径。关于申请者如何获知该计划的发现发现如下：\n\n-   `NIST/NRC RAP` 的申请者比申请其他\
  \ `RAPs` 的申请者有两倍可能最初通过他们的 `Ph.D.` 导师或其他教授获知该职位；通过同事或研究生同学获知该计划的可能性也稍高，但通过联邦实验室的研究型导师或其他科学人员获知该计划的可能性则较低。\n\
  \n-   `NIST/NRC RAP` 申请者最常见的信息来源是教授或同事。\n\n-   男性和女性申请者获知 `NIST/NRC RAP` 的途径相似，但通过专业会议的陈述除外，女性提到该途径的频率是男性的两倍。\n\
  \n-   `NIST/NRC RAP` 申请者获知该计划的方式在种族/民族上没有差异。\n\n外展工作产生的合格申请者多于 `NIST` 为 `RAs` 提供的空额；申请人池包含了许多来自顶尖研究机构的人员，且多样性日益增加。总体而言，22%\
  \ 的申请者获得了任命——这一比例低于其他地方的 `RAPs`。女性越来越多地申请 `NIST/NRC RAP` 并被授予研究助理职位。对于女性来说，`NIST/NRC\
  \ RAP` 似乎与其他的 `RAPs` 一样受欢迎。少数族裔也越来越多地申请 `NIST/NRC RAP` 并获得研究助理职位。对于 `NIST/NRC RAP`\
  \ 的申请者和获得奖励者，至少有一半来自美国排名前 20 的博士学位授予机构。\n\n`NIST/NRC RAP` 的申请者和获得奖励者与其他 `RAPs` 的对应者不同。自\
  \ 1990 年以来，少数族裔获得 `NIST/NRC Research Associateship` 的比例高于获得其他研究助理职位的比例。`NIST/NRC\
  \ RAP` 的申请者和获得奖励者平均比申请其他计划的人更年轻。`NIST/NRC RAP` 的申请者和获得奖励者更有可能是单身。他们更有可能拥有物理科学的 `Ph.D.s`\
  \ 而非生物科学。大多数奖项授予了物理科学的博士。但由于该学科的申请非常多，具有此类背景的申请者中只有约五分之一的人获得了奖励。\n\n初步分析表明，各实验室收到的申请数量不同，且奖项在不同实验室之间并非统一分配的。一些获得奖励者拒绝了\
  \ `NIST/NRC Research Associateships`，尽管拒绝提议的比例通常低于其他 `RAPs`，并且随着时间的推移而下降。\n\n现在转向对研究助理经历的评估，目前可用的数据尚不允许对该计划的直接成果进行计划评估。关于研究助理的经历或研究导师对\
  \ `RAs` 的评估收集的数据很少。也没有收集关于该计划对 `NIST` 或更广泛的科学与工程社区价值的数据。\n\n其次，尽管这一结论是基于可能因无响应而产生偏差的有限数据，但\
  \ `NIST/NRC RAs` 的产出与其他计划中的 `RAs` 相当。从统计上讲，`NIST/NRC RAs` 获得奖励或进行国内陈述的可能性高于其他计划中的\
  \ `RAs`。相反，他们发表的期刊文章较少。然而，虽然这些差异在统计上是显著的，但在实质上并不大。`NIST/NRC RAs` 在获得专利或进行国际陈述方面与其他计划的\
  \ `RAs` 相当。最后，在具有相同前提下，`RAs` 对该计划非常满意。在 1 到 10 分的评分标准上（10 分为优秀），`NIST/NRC RAs` 对计划的短期和长期价值、实验室、导师、行政（`NIST`\
  \ 和 `NRC`）的支持评分在 7.7 到 8.5 之间。在一半的类别中，`NIST/NRC RAs` 与其他计划中的研究助理报告的满意度统计相似。在另一一半中，其他\
  \ `RAs` 报告了更高的满意度。\n\n最后，观察前 `RAs` 的职业，初步证据（非常有限）表明 `RAs` 为 `NIST` 永久职位的合格申请人池做出了贡献。约\
  \ 45% 的 `RAs` 报告说他们在任命后的直接任职是在 `NIST` 担任永久、临时或合同员工——这一比例高于其他联邦机构的 `RAs`。对前 `RAs`\
  \ 的调查发现，高比例的前 `NIST/NRC RAs` 留在 `NIST`，高于其他联邦机构的 `RAs` 留在其所在机构的比例（37.6% 对 28.1%）。其次，关于计划结果的证据很大程度上缺失。关于前\
  \ `RAs` 的职业结果收集的数据很少；关于计划对 `NIST` 或更广泛的科学与工程社区价值的数据也没有。\n\n## 建议\n\n1. **NIST 应对\
  \ NIST/NRC 研究助理计划进行更彻底的评估。**\n\n   a. 作为第一步，`NIST` 和 `NRC` 应审查该计划的具体目标。\n\n   b.\
  \ 评估应包括以下部分：对潜在申请者的外展评估；对拒绝接受研究助理职位人员的评估；该计划在 RAs 完成任命后对其收益的评估；`NIST` 托管 RAs 的收益评估；以及该计划对更广泛的科学与工程社区的收益评估。\n\
  \n2. **NIST 应对外展工作进行评估。**\n\n   a. 为了进行此类评估，需要收集数据。在这方面，申请表中关于申请者如何获知该计划的问题很有帮助并应该保留。然而，应对对“其他”类别进行进一步分析，并增加“网站”作为一个类别。\n\
  \n   b. 可以从 `NIST` 人员以及现任 `RAs` 处收集额外数据。这些数据可回答以下问题：\n\n      i. `NIST` 人员和 RAs\
  \ 使用什么机制与潜在申请者进行互动？\n\n      ii. 哪些机制似乎最有效？\n\n      iii. 是否有专门针对多样性的努力？是如何做的？\n\
  \n      此类研究可以通过专家小组或对 `NIST` 员工及现任或前 `RAs` 的调查来进行，以回答第一个和第三个问题，并为第二个问题的评估提供信息。还应该收集个人外展工作的成本（例如花在广告上的费用、与毕业生会面的时间），以便与收益进行比较（每种外展类型带来了多少申请者）。\n\
  \n   c. 促进外展工作工作的第二步是确定量化从不同外展策略中获得价值的指标，例如网站访问量或在专业会议上会见的研究生人数。\n\n\n\n\n\nd. 评估各项对外推广策略的投资回报率。这可能包括此类策略：评估\
  \ `NIST` 网站的可用性和信息内容，或评估出版物广告的回报率。作为 `NIST` 网站评估的一部分，`NIST` 可以考虑增加研究导师的联系方式信息，以促进潜在申请者与相关\
  \ `NIST` 工作人员之间的对话。\n\ne. 最后，考虑目前是否有其他未充分利用但可能具有价值的推广策略，例如向院长、系主任及其他大学管理人员直接寄送邮件。\n\
  \nf. 此外，确定是否有任何可以作为 `NIST/NRC RAP` 理想人选的研究生（以及潜在申请者）不了解该计划以及如何申请，是非常重要的。虽然构建研究生的随机样本很困难，但可能进行小范围的调查。\n\
  \n3. **NIST 应该对拒绝研究助理职位（Research Associateships）报价的个人进行评估。** 这可以通过电话采访或问卷调查进行。由于每个周期拒绝的人很少，负担会相对较小。对于获得录取但拒绝的人员，应该询问两个基本问题：(1)\
  \ 你们拒绝的原因是什么？(2) 你打算转而去做什么？\n\n4. **NRC 应该修改申请表。** 应该减少字段数量，特别是合并非常相似的标签，并移除涵盖多个字段的标签（例如，“生物物理物理学生物化学”）。至少在博士领域方面，更精简的领域列表示例可以参考\
  \ `NSF` 的《已获博士调查》（参见 `Appendix B`）。\n\n5. **NIST 应该更新 DataRAP 数据库，用当前的等效名称替换 NIST\
  \ 内部已不存在的机构名称（例如学院或实验室）。**\n\n6. **NIST 应该对研究助理（RAs）在博士后任命期间的经历进行更彻底的评估，包括他们对该计划益处的满意度及看法，以及\
  \ `NIST` 对该计划益处的满意度及看法。**\n\na. 为了协助工作，`NRC` 重新设计最终报告和研究导师评估表，以最大限度地从这些工具中收集数据（建议的问题请参见\
  \ `Box 3-1` 和 `Box 3-2`）。\n\nb. 最终报告和研究导师评估应设为强制性。\n\nc. 目前收集的数据中的某些元素可以进行进一步分析。\n\
  \ni. 例如，`NIST` 可能希望对同行评审期刊进行进一步分析，例如通过：\n\n1. 询问研究助理是否为唯一作者或第一作者；\n2. 检查研究助理是否与\
  \ `NIST` 工作人员共同发表论文；\n3. 检查研究助理发表期刊的质量，尽管这需要对期刊进行排名。\n\nii. `NIST` 可能希望对研究助理的生产力进行影响分析，例如通过：\n\
  \n1. 进行引用分析，以查看他人引用研究助理论文的频率（注意，这可以使用引用索引完成），或\n2. 评估博士后获得的资助金类型或规模。\n\niii. `NIST`\
  \ 可能希望对其对研究助理的支持情况进行更彻底的审查，询问他们对 `NIST` 行政部门的熟悉程度、向这些部门寻求帮助的频率以及原因。\n\nd. `NIST`\
  \ 还可以对研究助理（或 `NIST` ）的协作进行社交网络分析，以查看研究助理计划如何促进科学家和工程师之间新的或更广泛的协作。\n\ne. 在数据允许的情况下，`NIST`\
  \ 可以考虑按实验室、性别和种族/民族对研究助理的生产力和满意度衡量进行分类统计。\n\n7. **NIST 应该对前研究助理的职业进行广泛评估，以评估该计划对研究助理职业、NIST\
  \ 以及更广泛的科学工程领域的影响。** 执行此工作的最佳方法是问卷调查，将 `NIST/NRC 研究助理` 的职业成果与类似的博士后进行比较。调查将针对这些前研究助理和合适的对照组进行。理想情况下，可以进行两种可能的比较。首先，可以构建一个同行组。该组将由一组与\
  \ NIST 博士后相似的人员的匹配或分层样本组成。虽然并不理想，但一种解决方案是从奖学金办公室目录中提取前研究助理的分层样本。这是对前研究助理的普查；但正如报告早期提到的，许多...\n\
