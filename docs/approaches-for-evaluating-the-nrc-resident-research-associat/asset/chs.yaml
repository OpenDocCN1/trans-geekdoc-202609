  - 29. 博士后最糟糕的特点是什么？\n- 30. 如果你对该计划进行改进，你会怎么？\n\n# 4 职业发展\n\n关于前 NIST/NRC 研究员（RA）职业生涯的信息非常少。信息来源将在下一节介绍，但总而言之，数据涵盖了研究员在任命结束后的计划计划，或者他们在某个近期时间点的当前就业情况。目前没有职业历史数据。根据这些数据，前研究员已进入了所有领域的就业。NIST\
  \ 特别感兴趣的是位于 NIST 的 NRC 驻留研究员计划（NIST/NRC RAP）是否提供了职位候选人源。回答此问题的可用信息是通过专家小组和 NIST\
  \ 收集的数据获得的。\n\n从 NIST 现任和前研究员以及 NIST 员工的角度来看，该计划被认为对扩大 NIST 职申请人池是有益的。在专家小组期间接受采访的许多现任研究员加入\
  \ RAP 是希望留在 NIST。他们意识到转为正式员工是困难的，但一些人认为拥有 NIST/NRC 研究员身份是留下的最佳方式。根据他们的估计，成功率根据研究员在\
  \ NIST 的就职地点不同而有很大差异。估计范围从 5% 到 60% 不等，尽管 NIST 全范围的估计被认为在 30% 到 40% 之间。留在 NIST 的前研究员认为，整体留任率约为\
  \ 50%，且留任百分比因实验室而异，例如在某些实验室中，他们认为这一比例为 15% 到 20%。虽然现任和前研究员都注意到留在 NIST 很困难，但前研究员认为现任研究员高估了留下的机会。导师和部门主管将研究员被聘用为\
  \ NIST 的比例定在 33% 左右。他们报告说，约一半的研究员询问过留任。参与者注意到，在许多情况下，研究员打算在任期结束后去他处，而那些来到 NIST 并非常喜欢那里工作的人经常找到了留下的办法。在与\
  \ NIST 顾问和经理的专家小组会议期间，他们指出该计划是招募和留住人才的好方法（有些人称其是招募的“主要”方式）。正如一位参与者所说：“这是尝试一个人的绝佳方式。”\n\
  \n## 研究员的职业发展\n\n关于研究员任命后职业生涯的三个信息来源是：研究员在博士后任期结束时填写的最终报告、国家科学院（The National Academies）编写的目录，以及来自\
  \ NIST 关于研究员身份变更的信息。1996 年，国家科学院编制了一份《驻留研究员目录》（Directory of Resident Research Associates）。第一个数据来源关注研究员在完成任命后的计划。这是研究员任命后职业初期获取的唯一职业信息。\n\
  \n`Table 4-1` 查看了研究员在任命后计划去何处。再次，这些数据取自研究员填写的最终报告，而且正如 `Chapter 3` 所述，并没有许多研究员完成此表。57%（共\
  \ 253 人）NIST/NRC 研究员和 37%（共 6,936 人中）来自其他 RAP 的研究员提供了他们任期后的就业职位信息。\n\n![](img/t200138f5_37.png)\n\
  \n如 `Table 4-1` 所示，在回答问题的研究员中，NIST/NRC 研究员常见的回答是留在 NIST 成为正式员工。加上那些打算继续在 NIST 或为\
  \ NIST 工作的合同工或临时员工的研究员，回答问题的人中约有 45% 继续与 NIST 保持所属关系，而其他 RAP 研究员的这一比例仅为 22.5%。这证明了\
  \ NIST/NRC 研究员对该计划满意度的观点，证明了专家小组参与者的观点（即研究员计划是进入 NIST 职业的良好入门点），也证明了 NIST 将研究员计划作为寻找技能员工的招聘工具之一的观点。最终报告的受访者还被要求确定他们下一站计划去的组织名称。对于学术职位，受访者列出了\
  \ 27 个不同的机构。除了 NIST 之外，研究员还确定了许多其他政府职位，包括国家实验室的几个。正如学术界的情况一样，直接就业计划在工业领域的受访者每人提到了一家不同的公司。因此，那些没有以某种方式继续留在\
  \ NIST 的受访者倾向于遍布全国各主要就业领域。\n\n该《目录》旨在识别在编制《目录》时前研究员的去向。它最初涵盖 1959-1995 年。随后数据更新至\
  \ 2002 年并开放了网络访问。纸质目录及其后续更新信息基于个人在获得奖励时收集的数据以及对其当前活动的问卷回复。许多前研究员没有回答问卷，在许多情况下无法找到某些前研究员的联系信息（NRC,\
  \ 1996）。\n\n从 1965 年开始，当前数据库中有 9,924 条记录。其中，1,035 人（约 10%）是获得 NIST/NRC 研究员计划的人员。NIST/NRC\
  \ 研究员就业数据的回收率为 37.5%（共 1,035 人），其他 RAP 前研究员为 37.7%（共 8,889 人）。在回答者中，如 `Table 4-3`\
  \ 所示，超过三分之一 NIST/NRC 研究员的当前雇主是 NIST。NIST/NRC 研究员更有可能在政府就业，而在学术界或其他领域的可能性较低。一个重要的发现是，37.6%\
  \ 的 NIST/NRC 研究员在 NIST 工作。\n\n![](img/t200138f5_38.png)\n\n如 `Table 4-2` 所述（类似于\
  \ `Table 4-1`）——在为编制《目录》而发的问卷回答者中，调查时 37.6% 的前 NIST/NRC 研究员在 NIST 就业，而其他 RAP 前研究员的比例约为\
  \ 28.1%，他们在所在地机构。\n\n最后一个数据来源是 NIST 收集的博士后状态变更数据，即：任命开始日期、任命终止、辞职，以及对本文而言最重要的，研究员转为期限期职业聘用的情况。\n\
  \n![](img/t200138f5_39.png)\n\n（抱歉，此处翻译漏掉了最后一句，补全如下：\n如 `Table 4-3` 所示，约 25% 的前研究员转岗（不包括转为合同工身份的研究员），在这些转岗的前研究员中，约\
  \ 31% 转为了正式员工身份。）\n\n\n\n\n有许多理由应对前研究助理（RA）的职业生涯进行更彻底的评估。收集目前尚未进行的前 RA 职业生涯数据，将为\
  \ NIST 如果想对该计划进行更改或进一步改进提供基准参考，并将有关该计划的信息从定性数据转向定量数据。未来的评估可以从几个方向开展，总体而言包括：\n\n\
  (1) 研究对 RA 的益处（潜在益处包括：更好或更多的培训、博士后任命后更高的生产力、博士后任命后获得更多资助）；\n(2) 研究对 NIST 的益处（潜在益处包括：NIST/NRC\
  \ RA 的成功、更多、更好的招聘替代方案、专业知识范围的扩大、新研究项目及其影响、合作的增加、计划申请人数的增加或声誉的提高）；以及\n(3) 审查该计划对\
  \ NIST 的成本（潜在成本包括：导师的成本或未聘用其他人员的机会成本）。\n\n在方法论上，此类分析可以采取对前 RA 进行调查的形式、社交网络分析（以考察合作）、简历分析（以考察该职位对职业的影响）或引用分析（以评估\
  \ RA 工作的影响）。\n\n## 初步结果\n\n初步证据表明，RA 为 NIST 永久职位的合格申请人库提供了贡献。约 45% 的 RA 表示，他们在获得任命后的第一份工作是在\
  \ NIST 担任永久、临时或合同员工——这一比例高于其他联邦机构的 RA。对前 RA 的一项调查发现，前 NIST/NRC RA 留在 NIST 的比例高于其他联邦机构\
  \ RA 留存在其所属机构的比例（37.6% 对 28.1%）。其次，很大程度上缺乏关于该计划结果的证据。关于前 RA 职业结果收集的数据较少，且该计划对 NIST\
  \ 或更广泛的科学工程社区的价值也缺乏数据。\n\n## 建议\n\n1. **NIST 应对对前 RA 的职业生涯进行广泛评估，以评估该计划对 RA 职业生涯、NIST\
  \ 以及更广泛的科学工程社区的影响。** 实施此目标最佳方法是调查，将 NIST/NRC RA 的职业结果与类似的博士后进行比较。调查将针对这些前 RA 以及一个适当的对照组进行。理想情况下，可以进行两种可能的比较。首先，可以构建一个同伴群体。这将由一组具有与\
  \ NIST 博士后相似经历的匹配或分层样本组成，作为比较组。虽然不理想，但一种解决方案是从奖学金办公室的目录中对前 RA 进行分层抽样。这是对前 RA 的普查；但正如报告早些时候提到的，许多这些人无法被找到，或未能对之前旨在收集其当前就业信息的调查做出答复。第二个比较组将由类似的博士组成。可以通过联系一组未获得\
  \ RAP（研究助理计划）申请人群体来编制一份名单。这些人可能会表现出多样化的职业路径，包括一些选择了博士后职位（学术界或工业界），另一些则直接进入就业。`Box\
  \ 4-1` 提供了可能提出的问题。\n\n### Box 4-1 前研究助理职业评估调查\n\n1. 您是哪种类型的助理？\n2. 哪个实验室？\n3. 哪个部门/科室？\n\
