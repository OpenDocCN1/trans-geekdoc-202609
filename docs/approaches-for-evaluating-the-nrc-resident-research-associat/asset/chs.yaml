  \ (NVESD) |\n| 国防部 | 美国陆军研究、开发与工程司令部/军备研究、开发与工程中心 (RDECOM/ARDEC) |\n| 环保保护局 | 美国环保保护局\
  \ (EPA) |\n| 内政部 | 美国地质调查局 (USGS) |\n| 美国海陆哺乳类动物委员会 | 美国海陆哺乳类动物委员会 (MMC) |\n| 国防部\
  \ | 美国军事兵学院/美国陆军研究实验室 (USMA/ARL) |\n\n| 注意：排除了仅针对博士前学生或教职人员的计划。 |\n| 来源：NRC 合作伙伴研究机会目录。\
  \ |\n\n正如 `GAO` (2005) 和 `学术竞争力委员会` (`ACC`) (2007) 所出的，一个担忧是，并非所有的计划都经过了评估，即使在已完成或正在进行的评估案例中，对于单个计划产生的积极影响也知之甚少。⁶\
  \ 这种评估非常重要，并且可以阐明许多影响，包括：\n\n| | ⁶ 然而，对联邦科学与工程（S&E）计划已进行了多次评估，这些评估的作者可能不同意评估没有产生关于这些计划影响的信息。例如：`OSIRE`\
  \ (2003)、`McCullough` 和 `Thurgood` (2004)、`NRC` 中的 `Kimsey` (2006a)、`Mantovani et\
  \ al.` (2006)、`Michie et al.` (2007) 以及 `Finkelstein` 和 `Libarkin` (未注明日期)。 |\n\
  | --- | --- |\n\n* 计划在促进性别、种族/民族和/或社会地位多样化方面的成功；\n* 机构信息传播策略的有效性；\n* 通过学者在计划中的体验质量来衡量对接收者、机构和国家带来的利益；以及\n\
  * 通过博士后人员的职业生涯来衡量对接收者、机构和国家带来的利益。\n\n正本着这种精神，`国家标准与技术研究院` (`NIST`) 联系了`科学院`，以对 `NIST`\
  \ 的 `NRC 驻留研究员合作伙伴计划`（以下简称“NIST/NRC RAP”）进行研究。\n\n# NIST 的 NRC 驻留研究员合作伙伴计划\n\n如上述所示，`科学院`国家研究委员会\
  \ (`NRC`) 的`学金办公室`管理着若干联邦机构的一系列博士后计划。这些计划统称为 `NRC 驻留研究员合作伙伴计划`。该计划建立于 1954 年，效仿了由\
  \ `NRC` 在 1919 年至 1955 年间管理的`洛克菲勒基金会学金`计划。`NIST` 是第一个赞助者：“`NIST` 的最初赞助是通过 1954 年的`标准局`（现为\
  \ `NIST`）进行的。1955 年，海军研究部门也加入了其中。`合作伙伴计划`一直扩大到今天，`NIST` 各机构都参与了其中。”⁷](../Text/ch010.xhtml#p200138f5ftt00007\n\
  \n| --- | --- |\n\n`NIST` 的`合作伙伴计划`与 `NRC` 计划脱钩。每个参与`研究助理员合作伙伴计划`的机构其`目标`可能超出 `NRC`\
  \ 的目标，强调不同的方面，或与其他机构的目标有所不同。`NIST` 所述的 `NIST/NRC RAP` 目标是：“博士后计划带来了极具潜力和能力的研究科学家和工程师，他们能够开展与\
  \ `NIST` 任务相关的先进研究，将最新的大学研究成果和技术引入 `NIST` 科学计划，加强与大学研究人员的相互交流，与`美国科学与工程界`共享 `NIST`\
  \ 独特的研究设施，并为研究结果从 `NIST` 向科学工程界的的转化提供了一个宝贵的机制。”¹⁰\n\n| --- | --- |\n\n\n\n\n\nNIST\
  \ 的其他目标可能包括吸引足够数量的候选人、增加潜在员工储备、提高 NIST 研究能力的广度或深度，或提高 NIST 的生产力。NIST 可能还会关注曾担任研究助理的员工是否比未参加该计划的员工更好的成果，以及该计划对\
  \ NIST 任务和声誉的长期影响。\n\n> ¹¹ 在与 NIST 顾问和管理人员的专家小组会议期间，参与者评论说研究助理是 NIST 涵盖更广泛专业知识的一种方式。博士后项目引入了从事研究人员，也带来了新思想。NIST\
  \ 的研究助理进行着一些创新研究。NRC 指出，具有研究产出记录的优秀、高积极性的近期博士毕业生的加入，为参与实验室的计划带来了刺激。新的思想、技术和解决问题的方法有助于实验室的整体研究氛围。间接而言，这种合作关系还让更广泛的科学和工程界能够利用联邦实验室存在的优秀且通常独特的科研设施。\n\
  \n最后，对于申请 NIST/NRC RAP 的人员来说也有一些目标，包括增加合作或人脉建立、提高生产力、培训、技能、知识、独立工作能力或职业选择。许多过去的\
  \ NIST/NRC RA 已经拥有了卓越的职业：“十名目前在 NIST 工作的高级管理人员曾是博士后。\n\n> ¹² 在与前研究助理的专家小组会议期间，参与者认为该计划的处包括增加合作（包括接触的人员范围）和人脉建立。博士后职位被视为通向下一个职业选择的有用步骤。参与者提到该计划让博士后适应了政府工作。在\
  \ NIST 内部某些领域，参与者认为博士后职位是在那里获得全职工作的主要途径——前博士后之所以这样认为，是因为在某些领域几乎每个人都是以前的研究助理。在与 NIST\
  \ 顾问和管理人员的专家小组会议期间，参与者评论说博士后是人们探索在 NIST 工作的一种方式——博士可能不想以全职规聘身份进入，但会有兴趣尝试 2 年。NIST\
  \ 顾问和管理人员还指出，该计划是 NIST “试用”未来可能成为员工的博士后的一种良好方法。\n\n国家工程院和国家科学院的三名成员曾是 NIST 博士后。在目前的\
  \ 27 名 NIST 会士（Fellows）中，有 4 人曾是博士后（Curry, 2004）。\n\n> ¹³ 参见 Curry (2004) 获取选定 NIST\
  \ 博士后的传记。NIST 会士是受尊敬的资深科学家。\n\n### 当前申请要求\n\n目前的申请要求包括：\n\n*   NIST 研究助理计划仅对美国公民开放；永久居民身份并不足够；\n\
  *   NIST 研究助理计划仅授予申请时获得博士学位未满五年的人员；\n*   获奖者必须持有 `Ph.D.`、`Sc.D.` 或其他在美国学术界认可等同于\
  \ `Ph.D.` 的已获研究型博士学位，或者在开始任期期之前提供可接受的证明，证明其已完成这些学位之一的所有正式学术要求；\n*   申请人必须在创新研究方面表现出卓越的能力；以及\n\
  *   助理计划的主要目标是提供一种机制，将新思想和刺激源引入赞助实验室。因此，近期与特定实验室有隶关系的人可能没有资格申请该实验室的助理。\n\n> ¹⁴ 先前的隶关系包括与实验室或在该处工作的承包商之间的直接全职雇佣关系。长期咨询关系通常使申请人不符合资格。\n\
  \n可以重新申请。曾获得过助理计划的人员只有在第一项奖励终止与拟议的第二次任期之间至少间隔两年后，才能申请另一项奖励。曾申请过助理计划但未被小组推荐授予奖励的人员，可以在一年后重新申请。被小组推荐授予奖励但因资金或其他限制未获得录取通知的候选人，可以随时重新申请，无需强制性等待期。\n\
  \n该计划源于微的开端：“1954 年，当美国民事委员会（现为人事管理局）授予博士后为期两年的联邦雇员身份时，有 21 名科学家参加了首届竞争，NIST 授予了六项奖励，每项\
  \ 5,940 美元。到 2004 年，每年聘用的博士后人数上限为 60 人（Curry, 2004）。”迄为止，NIST/NRC RAP 已收到超过 6,000\
  \ 申请，授予了超过 1,000 名研究助理。\n\n## 国家科学院的角色\n\n国家研究委员会——通过其学金办公室——与批准参与的赞助联邦实验室和研究组织合作开展研究助理计划。学金办公室开展全国性竞争，为博士后水平的优秀科学家和工程师推荐并授予奖励，使其作为参与实验室的客座研究员任期（NIST\
  \ 自行授予奖励）。\n\n> ¹⁵ 本节材料改编自 NRC RAP 网站“NIST 的助理计划”，访问地址为：[`qdev.nist.gov/817.03/jobs/nrc_local.html`](http://qdev.nist.gov/817.03/jobs/nrc_local.html)。[访问日期：2007\
  \ 年 6 月 24 日]。\n\n助理计划办公室接收所有申请材料和证明文件，并对申请进行竞争性评估。针对 NIST/NRC 研究助理（`NIST/NRC RAs`）的评估是由为此目的专门召集的特别小组进行的。小组成员的选取基于对申请人在科学和工程领域的地位和经验来评审申请，他们的评估结果是\
  \ NIST 授予奖励的依据。按质量进行最终排名以及对申请人的授予奖励建议是小组的专属权利。NIST 根据小组推荐的名单选出奖励候选人。NIST 在整个春季和秋季发放录取通知。\n\
  \n## 委员会的任务\n\n国家科学院任命了一个特别委员会来准备本报告（`Appendix A`）。该委员会的任务：\n\n\n\n\n“学术竞争力委员会（ACC）为了推进政府的‘美国竞争力倡议’，旨在确保国家在教育计划上进行明智且有效的投资，以实现其科学技术目标。因此，ACC\
  \ 要求对重要的 STEM¹⁶ 教育计划进行评估，其中包括 NIST/NRC 博士后研究员计划。在高等教育与劳动力委员会的支持下，一个特别委员会将描述 NIST/NRC\
  \ 博士后研究员计划的申请者和接收群体，并根据现有信息对 NIST 博士后学者的职业成果进行描述性分析。在数据允许范围内，还将描述该计划如何应对机构目标。委员会还将概述一种相对于国家科学与技术（S&E）目标、NIST\
  \ 机构目标以及该计划对参与者价值的计划评估方法，该评估可以在未来的研究中进行。”\n\n| --- | --- |\n\n## 方法与范围\n\n为了完成任务，委员会关注了三个目标：\n\
  \n• 将 NIST/NRC RAP 申请者的特征与新晋科学与工程博士群体进行对比；\n• 将 NIST/NRC 研究员（RA）的经历与其他计划中的研究员进行对比；以及\n\
  • 就对 NIST/NRC 研究员的职业生涯进行更深入的评估提供建议，特别关注量化该职位任命对接收者以及 NIST 带来的益处。\n\n委员会受两个主要问题的指导：\n\
  \n• NIST 是否正在吸引“最优秀、最才华的人才”加入 NIST/NRC RAP？\n• 该计划对研究员、NIST 以及整个科学与工程社区产生了什么影响？\n\
  \n此外，委员会决定在适当的情况下，就计划申请者的数据收集、现任及前任 NIST/NRC 研究员的经历，以及 NIST/NRC 研究员和 NIST 员工对该计划对\
  \ NIST/NRC 研究员、NIST 以及整个科学与工程社区价值的观点，提供建议。\n\n在评估 NIST/NRC RAP 时，委员会试图将该计划与 NRC\
  \ 管理的其他 RAP 进行比较。首先，委员会将 NIST/NRC RAP 的申请者特征与其他 RAP 进行比较，并在较小程度上与近期科学与工程博士学位的总体群体进行比较。其次，委员会将\
  \ NIST/NRC 研究员的特征和经历与其他计划中的研究员进行比较。¹⁷。最后，委员会对前任 NIST/NRC 研究员与其他前任研究员的职业进行了非常有限的比较，但数据局限性导致除了简单的描述性分析外无法进行其他分析。\n\
  \n| --- | --- |\n\n委员会采取的方法在几个方面具有局限性。最重要的是，该分析在本质上不是因果性的。委员会无法解释 NIST/NRC 研究员与对比组之间的相似之处或差异。\n\
  \n\n\n\n在将 NIST/NRC RA 申请者与近期获得博士学位的人员进行比较时，一个信息来源是美国国家科学基金会（NSF）的“获得博士学位调查”（SED）。该调查始于\
  \ 1957-1958 年，每年收集从所有美国认证机构获得研究型博士学位的人的人数及特征数据。²¹ 所有个人在获得其研究型博士学位时均被要求完成该调查。SED\
  \ 收集了个人教育背景、特征和毕业后计划的信息。选定的变量包括：\n\n\n\n• 博士学位的学术机构\n• 出生年份\n• 毕业时的国籍状态\n• 出生国和国籍\n\
  • 学位领域（N = 279）\n• 婚姻状况、受供养人数/年龄\n• 毕业后计划（工作、博士后、其他学习/培训）\n• 主要和次要工作活动\n• 博士后学习/研究的资金来源和类型\n\
  • 雇主的类型和地点\n• 种族和西班牙裔民族（针对选定的子群体）\n• 性别²² |\n\n|  ||  ²² NSF 使用“sex（性别）”一词而非“gender（性别身份）”。在本报告中，“sex”和“gender”同义使用。\
  \ |\n\n\n该调查的响应率超过 90%。趋势数据可追溯至 1957-1958 年。1920-1956 年期间有部分数据。\n\n关于被授予研究助理（RA）人员特征及其在博士后任期期间经历的数据主要来自两个来源：奖学办公室（Fellowships\
  \ Office）对研究助理进行的任期后调查，以及 NSF 的“博士学位获得者调查”。\n\n这些信息还由国家科学院（The National Academies）和\
  \ Sigma Xi（西格西）对博士后进行的一次性调查进行了补充。²³ 最后，NSF 的“科学与工程领域研究生和博士后调查”也是一个潜在的资源。\n\n|  ||\
