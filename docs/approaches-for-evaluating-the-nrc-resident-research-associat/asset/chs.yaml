  | 来源：美国科学院，DataRAP 数据库，工作人员统计表。 |\n\n转到种族/族裔，我们比较了白人和所有其他群体首次获知该计划的情况。与女性类似，结果在两个组别之间相当一致，少数族裔比白人更有可能通过专业会议获知该计划——但并不显著。\n\
  \n### 表 2-6 1989-2007 年 NIST/NRC 研究助理计划申请者首次获知计划的情况，按种族/族裔划分\n\n| 信息来源 | 白人 (%)\
  \ | 其他 (%) | |\n| N | 505 | 238 |\n| 来源：美国科学院，DataRAP 数据库，工作人员统计。 |\n\n下一步，未来的分析可以检查不同信息来源与结果之间的关系。例如，`表\
  \ 2-7` 为 NIST/RAP 申请者检查了这种关联。\n\n### 表 2-7 1965-2007 年按计划来源的获奖者比例\n\n| 来源：美国科学院，DataRAP\
  \ 数据库，工作人员统计表。 |\n\n如 `[表 2-7]` 所示，成功的 NIST/NRC RAP 申请者更有可能通过 NRC 工作人员或 NRC 关联获知该计划；尽管在这些情况下，很少申请者通过这些来源获知计划。与其他\
  \ RAP 的成功申请者相比，成功的申请者获知 NIST/NRC RAP 的方式似乎差异更多。`[表 2-8]` 专注于那些获得 RA 的申请者。\n\n###\
  \ 表 2-8 1965-2007 年按计划来源的获奖者比例\n\n\n\n\n\n\n| 来源：美国科学院，DataRAP 数据库，按人员统计。 |\n\n\
  表 2-8 显示，NIST/NRC RAP 的资助者中约有三分之一是通过教授首次得知该计划；而其他 RAP 的资助者中约有三分之一是通过实验室人员首次得知该计划的。综合表\
  \ 2-6 到 2-8 表表明，人员之间的沟通是向潜在申请者传递计划信息最重要的机制。这种分析可以通过侧重于申请者的子集（即按性别、种族/民族或学科）来扩展，以观察外推活动的效果如何。\n\
  \n## 初步结果\n\n首先，申请表是一个非常实用的数据收集工具。在目前的三个工具——申请表、最终报告、导师评估——中，申请表产生的数据最多。其次，个人沟通是申请者获知\
  \ RAP（包括 NIST/NRC RAP）最可能的途径。关于申请者如何得知该计划的主要发现如下：\n\n*   NIST/NRC RAP 的申请者最初通过其博士导师或其他教授得知该职位的概率，是其他\
  \ RAP 申请者的两倍；且从同事或同届研究生处得知该计划的概率也略高一些，但从联邦实验室的研究导师或其他科学工作人员处得知该计划的概率则较低；\n*   NIST/NRC\
  \ RAP 申请者获知最常见的信息来源是教授或同事；\n*   男性和女性申请者得知 NIST/NRC RAP 的情况相似，但在专业会议的报告除外（女性提及的频率是男性的两倍）；以及\n\
  *   NIST/NRC RAP 申请者得知该计划的方式在种族/民族上没有差异。\n\n## 申请者与资助者的特征\n\n从 1965 年到 2007 年 2\
  \ 月，NIST/NRC RAP 有 6,147 份申请。³⁹ 从 1965 年到 2007 年 2 月，其他 RAP 有 33,298 份申请，如图图 2-1\
  \ 所示。⁴⁰\n\n| | ³⁹ 还有 35 份来自科学与工程（S&E）以外领域的博士学位的申请，有 58  Case 申请者未注明专业或专业无法分类。 |\n\
  | :--- | :--- |\n| | ⁴⁰ 还有 797 份来自科学与工程（S&E）以外领域的博士学位的申请，有 1033 Case 申请者未注明专业或专业无法分类。\
