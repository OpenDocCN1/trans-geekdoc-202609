  \ |\n\n# 1 执行摘要\n\n## 执行摘要\n\n美国国家标准与技术研究院（NIST）的研究员计划（RAP，以下简称 `NIST/NRC`）于 1954\
  \ 年启动，旨在为杰出的科学家和工程师提供机会。该委员会由国家研究委员会（NRC）任命，负责评估该计划。\n\n委员会的具体任务下所示：\n\n1. NIST\
  \ 是否正在将“最优秀、最才华”的人才吸引到 RAP 计划？\n2. 该计划对研究员、NIST 以及科学领域有何影响？\n\n为了完成任务，委员会重点关注了三个目标：\n\
  1. 描述该计划申请者的特征；\n2. 描述研究员在 NIST 及其他联邦机构的经历；\n3. 为研究员的职业生涯提供更深入评估的建议。\n\n在准备本报告时，确定并使用了多个信息来源。主要信息来源是\
  \ NRC 学金办公室收集的数据，包括申请数据、研究员编写的报告数据以及往届研究员的名录。此外，委员会还从三个专家小组收集了原始数据。然而，总体而言，数据不足以得出结论。\n\
  \n本报告分为五章：\n* 第一章描述了该计划以及研究的方法和范围。\n* 第二章考察了 NIST/NRC RAP 的申请者，并与其他员计划的申请者进行比较。它还根据性别或博士学位机构等多个维度对申请和获奖进行了分类分析。\n\
  * 第三章考察了 NIST/NRC 研究员和其他联邦机构研究员的经历，以及研究员对其参与计划价值的看法。\n* 第四章考察了前研究员的职业生涯。\n* 第五章提供了初步结果和建议的总体总结。\n\
  \n由于数据有限，委员会未能对该计划进行全面评估。此外，委员会决定在适当的情况下提出建议，涉及关于申请者的数据收集、现任及前任研究员的经历，以及研究员和 NIST\
  \ 对计划价值的看法。鉴于现有数据，委员会无法对该计划的影响 2 进行全面评估。\n\n\n\n\n\n# 1. 推广工作产生的合格申请人数超过了 NIST 研究员的空缺名额；申请人中包含许多来自顶尖研究机构的人员，且多样性日益增加。总体而言，NIST\
  \ 有 22% 的申请者获得了任命——这一录取率低于其他研究员计划（RAP）的整体水平。NIST 和其他 RAP 申请者的录取率因性别、种族和领域有所异。然而，在所有领域中，申请人数和获得者中女性及少数族裔的比例随时间推移而增加，但增长速度低于博士学位者及计划成为博士后的人员中的比例。个人沟通是\
  \ NIST/NRC 研究员了解该计划的主要途径。\n\n# 2. NIST/NRC 研究员的产出似乎与其他计划中的研究员相当。平均而言，NIST/NRC 研究员大约发表两篇文章，进行约四次演讲，但在任期内很少获得专利或奖项。他们更有可能进行国内演讲或获奖，而发表期刊文章的可能性较低，在获得专利或进行国际演讲方面则与其他者持平。然而，产出数据源于一项回复率较低的调查，可能存在非响应偏差。\n\
  \n# 3. 研究员对该计划非常满意。对于在最终报告中提供信息的研究员，在 1 到 10 分的量表上（10 分为优秀），NIST/NRC 研究员对计划的短期和长期价值评分为：实验室、导师、行政（NIST\
  \ 和 NRC）支持在 7.7 到 8.5 之间。在一半的类别中，NIST/NRC 研究员与其他计划的研究员报告的满意度水平在统计学上相似。在另一半类别中，其他研究员报告的满意度更高。然而，满意度数据源于一项回复率较低的调查，可能存在非响应偏差。\n\
  \n# 4. 研究员为 NIST 永久职位的合格申请储备做出了贡献。在完成任命的研究员中，NIST 的 45% 人员报告其终身结束后的直接职位是永久性、临时性或合同员工——这一比例高于其他联邦机构的研究员。非响应人员的就业情况尚未知。对前研究员的调查发现，在能够追踪到的这些前研究员中，前\
  \ NIST/NRC 研究员留任 NIST 的比例高于其他计划的研究员留在其所在机构的比例（37.6% 对 28.1%）。\n\n## 结论\n\n# 1. 目前可用数据无法对计划进行全面评估。目前，最详尽的数据是针对申请者的。关于研究员的经历、导师对研究员的评估、前研究员的职业结果，以及该计划对\
  \ NIST 或更广泛的科学工程社区的价值的数据收集较少。\n\n## 建议\n\n# 1. NIST 应对 NIST/NRC 研究员计划进行更详尽的评估。\n\
  \na. 作为第一步，NIST 和 NRC 应审查该计划的特定目标。\n\nb. 评估应包含以下部分：对潜在申请者的推广评估；对拒绝接受研究员职位的个人的评估；该计划在研究员完成任期后对其产生的益处评估；NIST\
  \ 接收研究员的益处评估；以及计划对更广泛科学工程社区的益处评估。\n\n# 2. NIST 应对推广工作进行评估。\n\na. 可以对申请者如何了解该计划进行额外分析（例如关注“其他”类别）。\n\
  \nb. 可以从 NIST 人员以及前任任研究员处收集更多数据。这些数据可用于回答诸如 NIST 人员如何与潜在申请者互动以及哪些机制似乎最有效等问题。\n\n\
  c. 促进推广工作评估的第二步是确定量化推广策略所获价值的指标。\n\nd. 检查个人推广策略的投资回报。\n\ne. 最后，考虑目前是否存在其他未被充分利用但具有可能价值的推广策略，例如向院长、系主任和其他大学管理人员发送直接邮邮件。\n\
  \n3. NIST 应对拒绝研究员邀请的个人进行评估。这可以通过电话访谈或问卷调查完成。对获得录取但拒绝的人员提问两个基本问题：（1）你为什么拒绝，（2）你计划改做什么？\n\
  \n4. NRC 应修改申请表。应减少字段列表，特别是通过合并非常相似的标签并移除适用于多个字段的标签。\n\n5. NRC 应更新 `DataRAP` 数据库，将\
  \ NIST 中已不存在的组织名称（如学院或实验室）替换为当前的等效名称。\n\n6. NIST 应对研究员在博士后任期期间的经历进行更详尽的评估、他们对计划益处的满意度及看法，以及\
  \ NIST 员工对计划益处的满意度和看法。\n\na. 为了协助这项工作，NRC 应重新设计最终报告和导师评估表，以最大限度地从这些工具中收集数据。\n\n\
  b. 最终报告和导师评估应设为强制性。\n\nc. 目前收集的某些元素可以进行进一步分析。\n\n   i. NIST 可能希望对同行评审期刊进行进一步分析。\n\
  \n   ii. NIST 可能希望对研究员的产出进行影响分析。\n\n   iii. NIST 可能希望对其对研究员的支持进行更详尽的审查，询问他们对 NIST\
  \ 行政部门的熟悉程度、向这些部门寻求帮助频率以及原因。\n\nd. NIST 还可以对研究员（或 NIST 员工）的协作进行社交网络分析，以查看研究员计划如何促进科学家和工程师之间新的或更广泛的协作。\n\
  \ne. 在数据允许的情况下，NIST 可以考虑根据实验室、性别和种族/民族对研究员的产出和满意度量进行进行分类。\n\n\n\n\n# 1 概述\n\n**NIST\
  \ 应对对前研究助理的职业生涯进行广泛评估，以评估该计划对研究助理职业生涯、NIST 以及更广泛的科学与工程社区的影响**。实施此目标的最佳方法是调查，通过将\
  \ NIST/NRC 研究助理与类似的博士后人员的职业成果进行比较。调查将针对这些前研究助理以及一个合适的对照组。理想情况下，可以进行两种可能的比较。首先，可以构建一个同伴群体。该群体由一组匹配或分层的样本组成，这些人员拥有与\
  \ NIST 博士后职位类似的经历，用作比较组。尽管并不理想，但一种解决方案是从奖学办公室（Fellowships Office）的名录中对前研究助理进行分层抽样。这是对前研究助理的普查；但正如报告早些提到的，许多此类人员无法被找到，或者未能对早先收集其当前就业情况的调查做出回应。第二个对照组将由类似的博士人员组成。可以通过联系未获得研究助理计划（RAPs）的申请者群体来编制一份名单。这些人可能会表现出多样化的职业路径，包括其中一些在学术界或工业界从事博士后研究的人，以及其他直接进入就业的人。\n\
  \n在《超越聚集的风暴》（*Rising Above the Gathering Storm*）中，美国科学院指出：“美国今天所享有的繁荣很大程度上归功于过去\
  \ 50 年国家在大学、公司和国家实验室在研发方面所做的投资。然而，最近企业、政府和国家科学技术领袖表示担心，对科技事业的压力可能会严重侵蚀过去的成功，并危及美国未来的繁荣”（NAS/NAE/IOM,\
  \ 2007）。\n\n为了应对这些挑战，《聚集的风暴》报告建议在四个领域采取行动：K–12 教育、高等教育、科学工程研究以及经济与技术政策。报告的许多建议后来在布什总统于\
  \ 2006 年 1 月 31 日的国情演讲中提出的“美国竞争力倡议”（ACI）中得到了呼应。ACI 受到了国会山两党立法员的热烈欢迎，并产生了旨在旨在实施其关键条款的法案。\n\
  \n在考虑这些提议时，国会采取了即时措施，要求对科学、技术、工程和数学（STEM）领域的现有联邦教育计划进行审查。正如斯佩林斯部长关于新的学术竞争力委员会（ACC）及其使命的声明中所提到的：“总统于\
  \ 2006 年 2 月 8 日签署的《减少赤字法》包含了由教育部长主持的学术竞争力委员会，其成员由在科学、技术、工程和数学领域拥有教育计划的联邦政府机构组成。法律规定的使命是评估每个计划的有效性，识别重叠领域，并为未来的高效整合和协调提供建议。”ACC\
  \ 的努力包括评估这些计划的成功情况、识别当前和未来计划的改进领域，并为计划之间的持续合作奠定基础（DOE, 2007）。\n\n博士后计划——在科学和工程（S&E）领域有若干个——对于提供额外的研究培训、知识和机会以桥接高等教育与\
  \ S&E 职业生涯具有至关重要的意义。虽然许多博士直接进入了全职工作，但大量博士将几年的博士后工作视为建立技能和声誉的宝贵机会，也是在劳动力市场进行实验的机会。\n\
  \n| |  ³ 博士后职位或“博士后”是在学术界、工业界、非营利组织或政府授予的临时职位，主要为了获得研究领域的额外教育和培训。拥有博士后任命的人员被称为博士后。\
  \ |\n| :--- | --- |\n\n## 支持 S&E 领域博士后的联邦计划\n\n根据 GAO（2005:3），在 2004 财年资助的 207 个“教育计划中旨在增加追求\
  \ STEM 学位和职业的学生及毕业生人数，或改进 STEM 领域的教育计划……”。这些计划中包括几个提供并强调博士后机会的计划，例如：美国国家航空航天局（NASA）的\
  \ NASA 博士后计划；国立卫生研究院（NIH）针对个人博士后研究员的 Ruth L. Kirschstein 国家研究服务奖（NRSA）（F32）、职业转型奖（K22）、通独立路径（PI）奖（K99）、博士后内部研究培训奖（IRTA）、癌症研究培训奖（CRTA）、博士后访问访问金（VF）、国立普通医学科学研究院药理学研究助理（PRAT）计划以及女性健康博士后访问金；国立科学基金会（NSF）的博士后研究奖金；美国农业部农业研究局（ARS）博士后研究助理计划。\n\
  \n| :--- | --- |\n| | ⁵ 虽然这些计划侧重于个人博士后，其他计划则针对学术机构，提供资金以支持博士后群体。 |\n| :--- | ---\
