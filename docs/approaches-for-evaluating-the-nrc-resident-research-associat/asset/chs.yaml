  来源：美国国家科学院，DataRAP 数据库，职员统计。\n\n### 种族/族裔\n\n本节通过将 NIST/NRC RAP 的申请者与其他 RAP 的申请者以及总体池进行比较，研究了种族/族裔在申请者和录取申请者比例上是否存在差异。在分析之前有两个说明。首先，由于非白人的申请者和获奖者人数非常少（这反映了在\
  \ S&E 领域获得博士学位的少数群体人数相对较少），我们将个人种族/族裔类别合并为三组：白人、代表性少数族、亚洲人和未知。这里的代表性少数族是指：美国印第安人或阿拉斯加原住民；黑人或非洲裔美国人；西班牙裔；夏威夷人或其他太平洋岛民。亚洲人指的是亚洲或太平洋岛民或亚洲人。许多人没有填写申请表上的这个可选问题。其次，这些数据在\
  \ 1980 年之前未收集。最后，这里的百分比是在标明种族/族裔的人群中代表性少数族的比例。\n\n![](img/p200138f5g42001.png)\n\
  \n图 2-7 按研究助理计划划分的代表性少数族申请者占比，1980-2007。\n注：2007 年并非所有申请周期都已完成并记录在数据库中。\n来源：美国国家科学院，DataRAP\
  \ 数据库，职员统计。\n\n根据上述图 2-7，随着时间的推移，NIST 收到的代表性少数族申请更多，尽管近期有所下降。这种下降需要进一步调查。通常情况下，代表性少数族的申请在\
  \ NIST/NRC RAP 和其他 RAP 之间是相当的。然而，代表性少数族申请或获得奖项的比例通常低于代表性少数族获得博士学位或意图从事博士后研究的比例（比较数据请参见附录\
  \ E）。\n\n![](img/p200138f5g43001.png)\n\n图 2-8 按研究助理计划划分的代表性少数族获奖占比，1980-2007。\n\
  注：1986 年 NIST 项目未授予任何奖项。2007 年并非所有申请周期都已完成并记录在数据库中。\n来源：美国国家科学院，DataRAP 数据库，职员统计。\n\
  \nNIST 对少数族族的奖项在 1990 年代也高于 1980 年代；这是一个积极的信号，尽管考虑到在 1980 年代几乎没有代表性少数族获得奖项，这并不容易。在过去几年，代表性少数族的获奖人数出现了明显的下降趋势，这一点需要进一步审查。\n\
  \n在两幅图中，NIST/NRC RAP 的趋势线波动较大，可能部分由于是将一个项目与多个项目的汇总情况进行比较。然而，由于数据限制，看来 NIST/NRC RAP\
  \ 在授予代表性少数族研究助理职位的比例上，通常比其他 RAP（总体）更具多样性。在识别招聘申请者的最佳实践方面，观察 NIST/NRC RAP 与其他 RAP\
  \ 之间是否存在不同的推广策略可能具有启发意义。\n\n\n\n\n\n图 2-9 和 2-10 重复了早期对成功申请者的性别的分析，此处是按种族/族裔进行的分析。这里比较了代表性少数群体与白人和亚洲人的成功率。代表性少数群体的趋势线波动相当剧烈，因为申请者人数较少，导致申请者中获奖者的比例波动很大。在\
  \ NIST/NRC RAP 和其他 RAP 项目中，这两组的成功率相似。\n\n![](img/p200138f5g44001.png)\n\n图 2-9 1965-2007\
  \ 年按种族/族裔划分的 NIST/NRC 研究助理员计划申请成功率。\n\n注：1986 年 NIST 项目未颁发任何奖项。2007 年并非所有的申请周期都已完成并记录在数据库中。\n\
