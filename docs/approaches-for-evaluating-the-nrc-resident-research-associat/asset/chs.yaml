  \ NIST RAP 的申请者识别了约 190 出版物。（然而，由于其他 RAP 涵盖更广泛的领域，这种较多的出版物数量是预期的，且 NIST/NRC RAP\
  \ 出版物较少本身并不意味着通过出版物触达潜在申请者的努力较少。NIST/NRC RAP 申请者识别的顶级出版物包括：*物理今日* (Physics Today)、学金办公室邮件、*化学与工程新闻*\
  \ (Chemical & Engineering News)、*机械工程* (Mechanical Engineering)、*IEEE 射谱* (Spectrum\
  \ of the IEEE) 和《科学》(Science)。通过检查随时间变化的所引来源趋势（如 `表 2-4` 所示），可以看出 NIST/NRC RAAs\
  \ 申请者通常不是通过出版物广告首次获知该计划的。）\n\n![](img/t200138f5_6.png)\n\n期刊在 20 世纪 90 年代前半叶作为来源比在当前十年更重要。另一个值得注意的发现是大学的就业办公室往往是一个很少被引用的信息来源。尽管委员会没有预先预期，但从前任或现任\
  \ RA 处获知计划的申请者比例并不大仍然令人惊讶。\n\n我们接着检查了 NIST/NRC RAP 申请者的某些特征，以查看不同类型的申请者在首次获知计划的方式上是否存在差异。比较男性和女性，我们没有发现显著差异，但在专业会议的演示方面，女性首次获知该计划的概率是男性的两倍。\n\
