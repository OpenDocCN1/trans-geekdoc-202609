  \ 年\n注：2007 年并非所有申请周期均已完成\n来源：美国科学院，DataRAP 数据库。\n\n总体而言，对 RAP 的兴趣自 1960 年代以来呈上升趋势，如表\
  \ Appendix E 所示。NIST/NRC RAP 的申请在 1970 年代达到峰值（1970-1972），并在 1990 年代再次达到高峰（1992-1995）。1990\
  \ 年代 NIST/NRC RAP 申请的波动可能反映了外推活动的变化。特别是，1990 年代初 NIST/NRC RAP 申请的减少可能反映了竞争加剧。接下来的图表检查了\
  \ NIST 和其他 RAP 的申请人数。图 2-3 比较了 NIST/NRC RAP 与所有 RAP 的录取率（Appendix E）。对于 1965 年至\
  \ 2007 年 2 月拥有 S&E 学位的申请者，NIST/NRC RAP 的录取总人数为 1,383 人，占 22%；而其他 RAP 的总人数为 9,810\
  \ 人，占 29%。总体而言，NIST/NRC RAP 的竞争更为激烈。\n\n![](img/p200138f5g36001.png)\n图 2-2 各计划的研究员计划录取百分比，1965-2007\
  \ 年\n注：1986 年 NIST/NRC 计划并未全部完成\n来源：美国科学院，DataRAP 数据库。\n\n由于研究员计划的申请人数远多于名额，一个有趣的问题是如果提高研究员计划的门槛会发生什么？一种方法是查看评审人员给申请者打出的评分。评分从\
  \ 0 到 10 分不等，10 分最高，尽管实践中尚未有人获得 10 分。约三分之一的人获得了推荐（但最终未获得录取），约 5% 的人被录取但拒绝了。\n\n\
  NIST/NRC RAP 的录取率可能因多种特征而异。接下来，我们将按学科、性别和种族/民族对申请池进行细分。\n\n### 学科\n\n本节介绍了按学科划分的潜在申请者、申请和录取数据。这可能反映了学科多年来的演变，以及申请者被要求注明所学领域的情况，申请者确定了大量的领域。申请者共有\
  \ 1,398 种选择，其中一些令人困惑。申请者他们的博士学位选择了 536 个不同的领域。为了简化起见，创建了一组主要类别：农业科学与自然资源；生物、医学与健康科学；工程；数学与计算机科学；以及物理科学以便研究。（哪些细分领域属于这些主要类别的列表见\
  \ Appendix F。\n\n首先，按主要领域划分的申请比例如何？如表 2-7 所示，无论是 NIST/NRC RAP 还是其他 RAP 的申请者，很少来自农业或自然资源背景。NIST/NRC\
  \ RAP 的申请者来自物理科学背景的可能性比其他 RAP 的申请者得多，而获得生物或健康科学博士学位的申请者则相反。\n\n![](img/t200138f5_11.png)\n\
  \n\n\n\n\n其次，各领域的获奖者占百分比是多少？如表 2-8 所示，奖项的分布与申请的分布相当一致。因此，对于 NIST 博士后而言，72% 的申请来自物理科学领域的博士，而\
  \ 69% 的 NIST 博士后奖项也授予了物理科学领域的博士。\n\n![](img/t200138f5_12.png)\n\n第三，各主要领域获奖人数与申请人数的比例是多少？如表\
  \ 2-9 所示，尽管 NIST/NRC RAP 收到的来自广义定义的生物科学领域博士的申请较少，尽管它也选拔了少数生命科学家担任研究助理（RA）职位，但在这一小部分申请者中，获得研究助理职位（Research\
  \ Associateships）的博士比例相对相当高——接近 40%。相反，如果背景是物理科学领域，获得研究助理职位的比例上要困难得多：仅 21%。\n\n\
  表 2-11 按研究助理计划和申请者主要领域划分的奖项占比，1965-2007\n\n| 领域 || NIST/NRC RAP (%) || 其他 RAP (%)\
  \ |\n| :-- | :-: | :-: |\n| 农业/自然资源 | 0.0 || 26.0 |\n| 生物/生物医学/健康 | 37.5 || 33.2\
  \ |\n| 工程 | 25.1 || 27.2 |\n| 数学/计算机科学 | 24.8 || 26.0 |\n| 物理 | 21.3 || 29.4 |\n\
  | 所有领域 | 22.5 || 29.5 |\n| 来源：美国国家科学院，DataRAP 数据库，职员统计。 | |\n\n### 性别\n\n近年来的多项研究（尽管这无疑不是一个新问题）都关注了鼓励女性从事科学与工程（S&E）领域职业的努力。正如本章前面提到的，女性获得博士学位的比例正在增加，但他们在就业方面尚未取得类似的成果。部分原因是女性晋升到更高级别的职位（例如学术界的正教授）需要时间，因此较最近的进展可能尚未在就业特征中得到显现。尽管如此，让女性在职业生涯初期获得鼓励是非常重要的——而\
  \ NIST/NRC RAP 无疑可以是一个很好的跳板。下图通过将 NIST/NRC RAP 的情况与其他 RAP 以及总体池进行比较，研究了申请者和获奖者比例在性别比例上是否存在差异。\n\
  \n![](img/p200138f5g38001.png)\n\n图 2-3 按研究助理计划划分的女性申请者占比，1965-2007。\n\n来源：美国国家科学院，DataRAP\
  \ 数据库，职员统计。\n\n![](img/p200138f5g39001.png)\n\n图 2-4 按研究助理计划划分的女性获奖者占比，1965-2007。\n\
  注：1986 年 NIST 项目未授予任何奖项。2007 年并非所有申请周期都已完成并记录在数据库中。\n来源：美国国家科学院，DataRAP 数据库，职员统计。\n\
  \n图 2-3 和 2-4 显示，女性越来越多地申请 NIST/NRC RAP；而且对于申请者来说，NIST/NRC RAP 与其他 RAP 一样受欢迎。然而，女性申请或获得奖项的比例低于女性获得博士学位或意图从事博士后研究的比例（比较数据请参见附录\
  \ E）。\n\n接下来，按性别比较了这两个项目的申请成功率。以下图表涉及的问题是，男性和女性的总体申请是否产生了相似的获奖率。对于 NIST/NRC RAP\
