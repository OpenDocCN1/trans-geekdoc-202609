  初步结果\n\n首先，现有数据尚以进行计划评估。其次，在数据非常有限的情况下，`NIST/NRC` 研究助理的生产力与其他计划的研究助理相当。相反，`NIST/NRC`发表的论文较少。然而，尽管这些差异具有统计学意义，但在实质上并不大。最后，在同样的情况下，研究助理对该计划非常满意。在\
  \ 1 到 10 分的范围内，`NIST/NRC`给出的评分在`7.7`到`8.5`之间。\n\n## 建议\n\n1. **NIST 应该对研究助理在博士后期间的经历、他们对计划的满意度和看法，以及\
  \ NIST 员工对计划的满意度和看法进行更全面的评估。**\n\na. 为了为此，NRC 应重新设计最终报告和导师评估表，以最大限度地从这些工具中收集数据（参见[Box\
  \ 3-1](../Text/ch012.xhtml#p200138f5bbb0078）和[Box 3-2](../Text/ch012.xhtml#p200138f5bbb0082）中的建议问题）。\n\
  \nb. 最终报告应设为强制性要求。\n\nc. 目前收集的某些数据可以进行进一步分析。\n\ni. 例如，NIST 可能希望对同行评审期刊进行进一步分析，例如：\n\
  1. 询问研究助理是否为单作者或第一作者；\n2. 检查研究助理是否与 NIST 工作人员共同发表；\n\nii. NIST 可能希望对研究助理的生产力进行影响分析，例如：\n\
  1. 进行引用分析以查看其作品被引用的频率（这可以使用引用索引完成）；\n2. 评估博士后获得的资助类型或规模。\n\n\n\n\n\niii. `NIST`\
  \ 可能希望对其对 `RAs` 的支持进行更彻底的审查，询问他们对 `NIST` 行政部门的熟悉程度、向这些部门寻求帮助的频率以及求助原因。\n\nd. `NIST`\
  \ 还可以对 `RAs`（或 `NIST` 员工）的合作进行社交网络分析，以查看 `RAP` 如何促进科学家和工程师之间新的或更广泛的合作。\n\ne. 在数据允许的情况下，`NIST`\
  \ 可以考虑按实验室、性别和种族/民族对 `RAs` 的生产力和满意度衡量进行细分统计。\n\n### 表格 3-1 针对研究助理的建议最终报告\n\n1. 姓名\n\
