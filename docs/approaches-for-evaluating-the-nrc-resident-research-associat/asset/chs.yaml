  \n来源：美国科学院，DataRAP 数据库，工作人员统计。\n\n### 机构\n\nNIST 在评估 NIST/NRC RAP 时，感兴趣的一个领域是审查申请者的博士学位授予机构。由于\
  \ NIST 的目标之一是吸引最优秀、最才华的人才，因此预计许多申请者已从所谓的顶尖机构获得了博士学位。同时，顶尖候选人确实可能来自广泛的机构，因此预计该计划申请者的博士学位授予机构范围也将具有某种多样性。申请者要求在申请表上注明他们的教育经历和就读院校。我们关注了授予申请者博士学位的机构，特别是下列出的申请和录取的前\
  \ 20 所机构。（部分申请者未注明其博士学位授予机构：NIST/NRC RAP 申请者中有 2 人，其他 RAP 申请者中有 86 例。这些情况被排除在分析之外。总体而言，NIST/NRC\
  \ RAP 的申请者来自总共 333 所授予学位的机构；而其他 RAP 的申请者则来自 1534 所授予学位的机构。这可能部分由于 NIST/NRC RAP 对美国公民身份的要求。在录取方面，所有获得\
  \ NIST/NRC RAP 奖项的人都注明了他们的博士学位授予机构；但有 14 位获得其他研究助理员计划的人没有注明。NIST/NRC RA 的博士学位来自\
  \ 173 所不同的机构。其他 RAP 的 RA 博士学位来自 983 所不同的机构。如 图 2-11 所示，NIST 的申请者来自大量的机构。\n\n![](img/p200138f5g46001.png)\n\
