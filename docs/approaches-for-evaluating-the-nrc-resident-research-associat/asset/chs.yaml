  \ |\n| --- | --- |\n\n## 筛选过程\n\n申请者的筛选过程可以总结为几个步骤：\n\n- 潜在申请者获知计划\n- 申请人向 NRC 申请\n\
  - 专家小组评审申请\n- 国家科学院转发选定的申请人\n- 资助实验室首先向评分最高的申请者提供奖励，并继续授予奖励直到名额填满\n\n有多种方式公布博士后职位，例如\
  \ *Physics Today*、*Science* 和 *Chronicle of Higher Education*。国家科学院有关该计划的信息可访问此处：`http://www.nationalacademies.org/rap/`\n\
  \n一旦潜在申请人获知该计划，下一步是完成申请。收集的信息包括：\n\n- 教育背景\n- 人口统计数据（例如：国籍、性别、婚姻状况、出生国、信仰、种族或族群）\n\
  - 申请人如何获知该计划\n- 之前的研究和出版物\n- 一份拟在任期内执行的研究计划\n\n申请人还由他人提交推荐信。完成的申请由国家科学院收集。随后是评审过程，正如国家科学院网站上“评审标准”页描述的那样（参见\
  \ `框 2-1`）。\n\n### 评审标准\n\nNRC 研究助理计划的奖励申请由 6 个大学科领域的专家小组评审：化学；地球和大气科学；工程、应用科学和数学；生命科学；物理学；空间科学。每份申请至少由\
  \ 3 名评审员阅读。评审员评估申请的质量、成功的可能性以及研究对资助实验室使命的贡献。博士后申请人的评估基于其作为学生的已证明能力以及其作为独立科学家做出贡献的潜力。高级申请人（包括夏季教师计划的申请人）的评估基于其已证明的能力和已证明的研究成果。评估不考虑年龄、性别、婚姻状况、出生国、信仰、种族或族群。\n\
  \n每份申请都会分配一个数值分数，申请人的最终得分是所有评审的平均分。评分采用 10 分制，只有得分 7.5 分及以上的申请者会被考虑授予奖励。资助实验室首先向评分最高的申请者提供奖励，并继续授予奖励直到名额填满。在评审过程中，每位申请人将根据四个主要要素进行评估，近似权重所示：\n\
  \n**拟议研究的科学价值 (40%)**\n\n\n\n\n\n研究计划书是申请中最重要的元素，因此在评审中占的权重最高。计划书的评估标准包括：拟议研究领域的重要性、明确陈述的目标、工作计划的技术合理性、计划书的创新性、成功的可行性、时效性（是否能在规定时间内完成计划书）、研究成果发表的可能性的，以及该研究对资助实验室使命的贡献。\n\
  \n### 推荐报告或推荐信 (20%)\n\n推荐报告或推荐信包含了那些与申请人本应有紧密专业关系的人员的意见；推荐信为评审人员提供了有关申请人学术能力的重要信息。对于博士后申请者，推荐报告的权重更大，因为他们的发表记录可能没有资深申请者那样丰富。\n\
  \n### 学术与研究记录 (20%)\n\n小组成员评审申请人的培训背景与其拟议研究的匹配性、此前的研究经验以及发表记录。仅对于博士后申请者，需要提供学术成绩单。\n\
  \n### 实验室技术评估 (20%)\n\n实验室/中心评审表包含了拟任导师的意见，以及实验室/中心计划委员会或代表对申请人拟议研究适用性的处理意见。这些信息有助于评审人员确定拟议研究对资助机构的价值。\n\
  \n在专家小组会议期间，申请人的评分从 10 分到 0 分，10 分为最高分。在实践中，分数在 9.90 到 0 分之间，申请人的分数差异可能仅为 0.02 分（例如\
  \ 9.65 到 9.63）。评审过程对 NIST 的员工来说像是一个谜。在与前研究员的专家小组中，他们评论说不懂候选人是如何排名的。前研究员对候选人应该如何排名有自己的见解。由于\
  \ NIST 员工与潜在申请人之间的个人联系，NIST 员工对谁是顶尖候选人形成了观点，而当这些人最终没有排在顶端时，他们感到惊讶。在相关的评论中，前研究员提到，他们希望能够更清楚地了解申请人打算从事的研究项目（如申请中所述）是如何评分的。他们认为目前的评分体系不透明，且过于笼统。NIST\
  \ 员工代表申请人提交建议，而员工似乎并不确定在建议中应该强调什么。\n\n导师和分部门主任在他们的专家小组中关注了另一个问题：评审小组。他们质疑 NRC 评审小组的组织是否良好。他们担心小组倾向于来自学术界的评审员。他们不知道小组是由哪些人构成的。他们希望对小组的构成有更多参与权，例如通过建议潜在评审员的人选（然后知道他们的建议是否被采纳）。另一个担心是排名是否在不同小组之间进行了标准化处理。\n\
  \n申请人的评审结果及分数将发送给 NIST，由 NIST 选择提供博士后职位的申请人。在实践中，大多数获得录取的人会接受研究员（Research Associate）的职位。\n\
  \n## 招聘\n\nNIST 和科学院关注的一个问题是该计划与潜在申请人的接触效果如何。在专家小组会议期间，现任研究员指出，IST 往往是他们的首选。原因包括：家庭原因、导师的质量、协作能力以及所在地。这些研究员申请了多个职位，例如学术界或其他政府实验室。关于研究员是如何得知该职位的，最频繁的回答涉及个人沟通——要么是在会议、招聘会上，或导师在他们学校举办讲座时遇到了未来的导师；或者是研究生导师建议他们申请。（导师和主任们也反复提到个人沟通——人际关系具有最高的投资回报率。）在几种情况下，他们的导师是前研究员。口碑传播非常重要。\n\
  \n前研究员呼应了这些评论。参与者的回答包括：有个人关系——在一种情况下，该前研究员的配偶在 NIST 工作；被导师招募（在会议或 NIST 员工在大学举办的演讲中）；在\
  \ NIST 遇到研究人员（这是由当地大学的前研究员建议的）；以及偶然发现了 RAP 的网站。一位研究员曾申请过 NIST 的一个正式职位，然后看到了 RAP\
  \ 的职位列表。这些前研究员注意到，有时工作人员会邀请研究生在 NIST 进行研究报告演讲/讲座，以此作为一种吸引潜在申请人来到 NIST 的方式。在参与者看来，个人联系似乎有效得多。一位前研究员指出，NIST\
  \ 在生物领域的推广较少。这很重要，因为 NIST 未来可能会向更多具有生物成分的跨学科研究发展，这将需要更多具有生物科学训练背景的人才。一位物理学家指出，在过去的某个时期，《物理今日》（*Physics\
  \ Today*）上曾登过广告，但他最近没有看到过。他认为广告工作可以做得更好。最后，前研究员注意到，有些人申请了多个博士后职位，并选择了 NIST 作为更好的选择。\n\
  \n导师和实验室主任也注意到，在某些领域他们认为申请人数较低。特别关注的是工程和计算机科学领域的某些领域。他们注意到，博士人在这些领域有许多选择，许多人放弃了博士后职位，而且认为这些领域获得学位的外国人较多，美国公民较少。他们同意现任研究员的观点，即个人沟通似乎是招聘最好的方式。该小组的成员注意到，不同实验室在尝试招聘申请人的方法以及尝试程度上有所不同。\n\
  \n总体而言，参与者报告说：\n\n- 该计划非常有声望（尽管一些现任研究员觉得该计划声誉较低）；\n- 该计划广为人知（再次，有少数意见认为它并不十分有名）；\n\
  - 人们得知该计划最常见的方式是通过个人沟通。\n\n为了更广泛地研究这些发现，委员会转向了 NRC 助学办公室 RAP 申请表收集的数据。博士后计划申请包含一个关于申请人如何得知职位的问题。申请人被要求从以下选项中选择一个：同事或同学；博士导师或其他教授；大学就业办公室；前或现任\
  \ NRC 研究员；联邦实验室的研究导师或其他科学工作人员；在专业科学会议上的 RAP 工作人员；专业出版物上的广告；或其他。数据涵盖 1989 年至 2007\
  \ 年。\n\n| | ³⁷ 问题是：“为了帮助我们向更多潜在申请人提供信息，对我们来说，了解您最初得知科学院 RAP 的非常重要。” |\n| --- | ---\
  \ |\n\n\n\n\n数据集包含 24,849 申请，其中 2,743 份是 NIST/NRC RAP 的申请。申请人数远少于这一数字，因为申请者可以在同一年或跨年申请多个职位。（由于\
  \ NIST/NRC RAP 直到最近都是每年评审一次，因此只有少数情况下申请者在一年内多次申请了这一特定项目。）`³⁸` 在评估申请者是如何获知该计划时，我们将申请了多个职位且选择了不同信息来源的个人信息合并为单条记录。这样做是因为在大多数情况下，申请多个职位的申请者在每个情况下都识别出了相同的来源。因此，数据集进行了更新，使得每个人都有一条记录，无论他们提交了多少份申请。\n\
  \n对于同时申请了 NIST/NRC RAP 和任何其他 RAP 的申请者，存在例外。由于目标是比较申请者识别的 NIST 以及所有其他联邦机构 RAP 博士后职位的来源，因此任何申请了这两个项目的个人在数据库中保留了两次。有\
  \ 236 人同时申请了 NIST 和其他联邦职位，符合这一例外。在剔除重复项后，数据库包含 12,737 条记录：2,717 名 NIST 申请者和 10,020\
  \ 名其他联邦 RAP 申请者（其中有 236 名申请者同时出现在两个列表中）。NIST 申请者总共识别出 2,890 个来源，非 NIST 申请者总共识别出\
  \ 10,497 个来源。\n\n\n如 `表 2-3` 所示，NIST/NRC RAP 的申请者最初通过其博士导师或其他教授获知职位的概率是其他 RAP 申请者的两倍，且通过同事或研究生获知该计划的概率也略高。令人惊讶的是，与其他联邦\
  \ RAP 的申请者相比，他们通过联邦实验室的研究导师或其他科学人员获知该计划的概率较低。\n\n### 表 2-3 1989-2007 年申请者首次获知研究助理计划的情况\n\
