  \ |\n\n### LPR（行政）支持\n\n`LPR` 是实验室（例如`NIST`）NRC 计划代表的缩写。该问题旨在了解研究助理在现场获得的行政支持。回答此问题的受访者更少。14%（共\
  \ 253 人中）的`NIST/NRC` 研究助理和 3%（共 6,936 人中）的来自其他 RAP 计划的研究助理提供了该类别的信息。在回答者中，如表 3-10\
  \ 所示，尽管这一发现不应大加解读，但它是平均分最低的因素（`7.8`）。`NIST/NRC` 研究助理给出的评分为`7.7`，而其他 RAP 计划的研究助理平均评分为`7.9`。这种差异不具有统计学意义。\n\
