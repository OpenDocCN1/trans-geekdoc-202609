  \ Xi 会员。全球共有 500 多个 Sigma Xi 分会，分布于大学、工业研究中心和政府实验室。”源自“关于 Sigma Xi”，访问地址为：[`www.sigmaxi.org/about/overview/index.shtml`](http://www.sigmaxi.org/about/overview/index.shtml)。\
  \ |\n\n\n奖学办公室在研究助理完成其博士后任期时会对其进行任期后退出调查。该调查由一份书面问卷组成，虽然名义上是强制，但许多博士后并未填写。此外，还要求研究助理的导师提供一份评估表。这两项评估的关键变量包括：\n\
