  \ ![](img/p20013f5g125001.png)\n\n# 附录 E\n## 预期项目审查\n\n在下表中，我们检查了 NIST（美国国家标准研究院）和非\
  \ NIST 博士后职位的申请人数以及相应项目的录取人数。申请者和录取者的比例与潜在申请池进行了对比。在 NIST 博士后申请者的情况下，该池是指在申请当年之前（包括申请当年）获得科学与工程博士学位的美国公民总和。我们还查看了打算从事博士后工作的美国公民博士子集（这些是有明确博士后学习或研究计划的博士）。所示数字为明确计划者的五年移动平均值。\n\
