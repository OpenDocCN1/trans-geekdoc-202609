  \n## 报告大纲\n\n报告按照时间顺序组织，遵循了博士从申请、获得录取到在计划期间的经历的轨迹，并以获得者在任期结束后的职业评估作为总结。第二章 考察了 NIST/NRC\
  \ RAP 的申请者，并将其与其他 RAP 的申请者进行了对比。它还从多个维度（如性别或授予学位的机构）对申请和授予情况进行了细分分析。第三章 考察了 NIST\
  \ 研究助理和其他联邦机构研究助理的经历，以及研究助理对该计划价值的观点。第四章 考察了前研究助理的职业生涯。第五章 提供了初步结果和建议的总体总结。\n\n\
  # 招募与选择\n\nNIST 博士后计划（以下简称“NIST RAP”）对于博士后本身以及 NIST 本身都有价值。本章分为三个部分。首先，通过研究博士学位授予和博士后任命趋势，对招募进行背景说明。其次，考察了选择过程。最后，描述了申请者的特征。\n\
  \n## 博士学位与博士后趋势\n\n### 博士学位趋势\n\n正如前章所述，博士学位信息来自国家科学基金会（NSF）的《博士学位授予调查》（附录 B 获取更多数据）。美国的博士学位数量在过去\
  \ 100 年中总体增长，并在 1973 年达到顶峰。在 1953 年之前，博士学位是在私立机构产生的（NSF, 2006）。通过分析 1920 年至 1999\
  \ 年的全部博士学位趋势（不仅是美国公民）：\n\n• 大三分之二的博士学位授予科学工程领域。\n\n• 在 1920 年至 1974 年间，科学工程博士学位中有\
  \ 87.2% 授予了男性。这一数字从 1975 年开始持续下降。在 1995-1999 年期间，比例为 30\n\n• 科学工程博士学位中授予外国籍人士的比例在增加：占比\
  \ 31\n\n• 少数族裔获得的博士学位较少：科学工程博士学位占比 32\n\n• 博士学位获得者的中位年龄随时间推移在增加；尽管科学工程博士的中位年龄远低于非科学工程。\n\
  \n• 大多数博士毕业生在毕业时已婚，尽管已婚毕业者的比例自 1960 年以来一直在下降。\n\n对于 2000 年至 2005 年，某些趋势仍在持续。在 2005\
  \ 年，科学工程博士占总博士位的 64%，与 1990 年代的比例相似。然而，越来越多的女性正在获得科学工程博士学位。在 2005 年，约 38% 的科学工程博士授予了女性。美国公民获得科学工程博士学位的人从\
  \ 2000 年到 2005 年有所下降。在已知国籍的博士学位中，2005 年约 56% 的科学工程博士授予了美国公民。\n\n### 博士后任命趋势\n\n\
  博士后任命可以追溯到 100 年以前；然而，博士后的聘用直到 20 世纪下半叶才显著增长。第一波快速增长时期出现在 1950 年代，受冷战对科学家和工程师的需求推动。在\
  \ 1970 年代以及 1990 年代的经济衰退期间，由于博士学位的就业市场疲软，博士后职位数量有所增加。\n\n\n\n\n\n# 博士后职位可以为接收者和雇主带来益处。对于博士后来说，这一职位是获得进一步培训的途径。联邦实验室或工业界的博士后职位可以作为进入非学术职业的入场券。\n\
  \n关于对雇主的影响，一份报告指出：“从整体而言，博士后群体已成为科学和工程事业不可或缺的一部分，在每个环境中都承担了该国家大部分的研究工作。例如，对 *Science*\
  \ 杂志近期两期研究文章的调查发现， 43% 的第一作者是博士后`³³`。在许多实验室中，博士后还负责教育、培训和指导初级成员，帮助撰写资助计划和论文，并在专业协会上展示实验室的研究成果”（NAS/NAE/IOM,\
  \ 2000:10）。然而，值得注意的是，目前对博士后的处境也存在一些不满意见。\n\n| --- | --- |\n\n根据美国科学基金会（NSF）的数据，2005\
  \ 年在广义的所有科学和工程领域中约有 35,000 名博士后（NSF, 2007）。然而，不同领域之间存在差异。“在某些领域，如计算机科学和工程学，追求博士后（甚至是博士学位）的动力相对较小，因为本科和硕士水平就能获得有回报的工作。在其他领域，如生物学和物理学，博士后几乎是强制性的，尤其是对于学术就业而言”（NAS/NAE/IOM,\
  \ 2000:14）。`表 2-1` 给出了博士后任命人员数量的领域分布，而 `表 2-2` 列出了各领域中明确计划从事博士后学习或研究的博士学位获得者的百分比。\n\
  \n![](img/t200138f5_3.png) \n\n表 2-2 按研究领域划分的计划进行博士后学习或研究的博士学位获得者百分比，1982 年和 2002\
