- raw: "The dataset contained 24,849 applications, of which 2,743 were applications\
    \ to the NIST/NRC RAP. The number of applicants is much less than this since applicants\
    \ can apply for multiple positions in the same year or across years. (Because\
    \ the NIST/NRC RAP was until recently reviewed once per year, there are only a\
    \ handful of cases where an applicant applied more than once per year to this\
    \ particular program.)[^(38)](../Text/ch011.xhtml#p200138f5ftt00038) In assessing\
    \ how applicants heard about the program, we combined information from individuals\
    \ who applied for multiple positions, if they selected different information sources,\
    \ into a single record. This was done because in most cases, an applicant applying\
    \ to multiple positions identified the same source in each case. Thus, the dataset\
    \ was updated so that there was one record for each individual, regardless of\
    \ how many applications they submitted. An exception occurred for applicants who\
    \ applied to both the NIST/NRC RAP and any other RAP. Since a goal is to compare\
    \ the sources identified by applicants to NIST and all other federal agency RAP\
    \ postdoctoral positions, any individual who applied to both programs remained\
    \ in the database twice. Two hundred and thirty-six individuals who applied to\
    \ both NIST and other federal positions at the same time fit this  exception.\
    \ After reducing duplicate entries, the database consisted of 12,737 records:\
    \ 2,717 applicants to NIST and 10,020 applicants to other federal RAPs (with 236\
    \ applicants appearing on both lists). The NIST applicants identified a total\
    \ of 2,890 sources and the non-NIST applicants identified a total of 10,497 sources.\n\
    \n|  ||  ^(38) It is not clear if this is a data entry error. |\n\n| --- | ---\
    \ |\n\nAs [Table 2-3](../Text/ch011.xhtml#p200138f5ttt00005) shows, the applicants\
    \ to the NIST/NRC RAP were twice as likely as applicants to the other RAPs to\
    \ hear about the position initially from their Ph.D. advisor or other professor\
    \ and somewhat more likely to hear about the program from colleagues or fellow\
    \ graduate students. Surprisingly, they were less likely to hear about the program\
    \ from a research advisor or other scientific staff at the federal laboratory,\
    \ compared with applicants to other federal RAPs.\n\nTABLE 2-3 How Applicants\
    \ First Heard About the Research Associateship Program, 1989-2007\n\n| Source\
    \ of Information || NIST/NRC RAP (%) || Other RAPs (%) || All Programs (%) |\n\
