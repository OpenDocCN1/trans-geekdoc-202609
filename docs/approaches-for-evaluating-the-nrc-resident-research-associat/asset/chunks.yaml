    ### LPR (administrative) Support


    `LPR` is an acronym for Laboratory (e.g., `NIST`) NRC Program Representative.
    This question is designed to tap the administrative support Research Associates
    get on-site. Even less respondents answered this question. Fourteen percent (of
    253) `NIST/NRC` Research Associates and three percent (of 6,936) of research associates
    from other RAPs provided information on this category. Among those who responded,
    as seen in [Table 3-10](../Text/ch012.xhtml#p200138f5ttt00035), and although little
    should be made of this finding, it was the factor with the lowest average score
    (`7.8`). The `NIST/NRC` Research Associates gave it a `7.7`, while the Research
    Associates of other RAPs gave it an average score of `7.9`. This difference is
    not statistically significant.


    ### TABLE 3-10 Research Associates’ Appraisal of Support at Their Host Agency,
    by Program


