  trans: "\n\n# 博士后职位可以为接收者和雇主带来益处。对于博士后来说，这一职位是获得进一步培训的途径。联邦实验室或工业界的博士后职位可以作为进入非学术职业的入场券。\n\
    \n关于对雇主的影响，一份报告指出：“从整体而言，博士后群体已成为科学和工程事业不可或缺的一部分，在每个环境中都承担了该国家大部分的研究工作。例如，对 *Science*\
    \ 杂志近期两期研究文章的调查发现， 43% 的第一作者是博士后`³³`。在许多实验室中，博士后还负责教育、培训和指导初级成员，帮助撰写资助计划和论文，并在专业协会上展示实验室的研究成果”（NAS/NAE/IOM,\
    \ 2000:10）。然而，值得注意的是，目前对博士后的处境也存在一些不满意见。\n\n|  ||  ³³ Vogel, G. *Science*, 1999,\
    \ Vol. 285, p. 1531. |\n| --- | --- |\n\n根据美国科学基金会（NSF）的数据，2005 年在广义的所有科学和工程领域中约有\
    \ 35,000 名博士后（NSF, 2007）。然而，不同领域之间存在差异。“在某些领域，如计算机科学和工程学，追求博士后（甚至是博士学位）的动力相对较小，因为本科和硕士水平就能获得有回报的工作。在其他领域，如生物学和物理学，博士后几乎是强制性的，尤其是对于学术就业而言”（NAS/NAE/IOM,\
    \ 2000:14）。`表 2-1` 给出了博士后任命人员数量的领域分布，而 `表 2-2` 列出了各领域中明确计划从事博士后学习或研究的博士学位获得者的百分比。\n\
    \n![](img/t200138f5_3.png) \n\n表 2-2 按研究领域划分的计划进行博士后学习或研究的博士学位获得者百分比，1982 年和 2002\
    \ 年\n\n|  研究领域 ||  1982 ||  2002 |\n| :-: | :-: | :-: |\n| 生物科学 ||  72.1 ||  74.4\
    \ |\n| 物理学/天文学 ||  48.8 ||  66.7 |\n| 化学 ||  39.8 ||  52.9 |\n| 地球、大气、海洋科学 ||\
    \  25.9 ||  51.6 |\n| 数学 ||  15.8 ||  42.5 |\n| 农业科学 ||  15.9 ||  38.3 |\n| 工程学\
    \ ||  11.4 ||  24.8 |\n| 健康科学 ||  15.4 ||  21.1 |\n| 计算机科学 ||  9.1 || |\n| 来源：NSF/NIH/USDA，博士学位调查,\
    \ 2004: 1 |\n\n由于领域之间存在差异，博士后的情况也各异。根据调查，得出了以下结论：\n\n- 生命科学、物理科学和工程学领域的大多数博士后为男性。\n\
    - 约 75% 的博士后持有临时签证。\n- 大多数博士后为白人种。\n- 大多数博士后年龄在 30 到 35 岁之间；69% 已婚或其他婚姻状态；约三分之一有孩子。\n\
    \n`³³` 很难得知结果的普遍性如何：\n\n|  ||  ³⁴ 国家科学院，“评审标准，”访问地址：`http://www.nationalacademies.org/rap/`\
    \ |\n| --- | --- |\n\n## 筛选过程\n\n申请者的筛选过程可以总结为几个步骤：\n\n- 潜在申请者获知计划\n- 申请人向 NRC\
    \ 申请\n- 专家小组评审申请\n- 国家科学院转发选定的申请人\n- 资助实验室首先向评分最高的申请者提供奖励，并继续授予奖励直到名额填满\n\n有多种方式公布博士后职位，例如\
    \ *Physics Today*、*Science* 和 *Chronicle of Higher Education*。国家科学院有关该计划的信息可访问此处：`http://www.nationalacademies.org/rap/`\n\
    \n一旦潜在申请人获知该计划，下一步是完成申请。收集的信息包括：\n\n- 教育背景\n- 人口统计数据（例如：国籍、性别、婚姻状况、出生国、信仰、种族或族群）\n\
    - 申请人如何获知该计划\n- 之前的研究和出版物\n- 一份拟在任期内执行的研究计划\n\n申请人还由他人提交推荐信。完成的申请由国家科学院收集。随后是评审过程，正如国家科学院网站上“评审标准”页描述的那样（参见\
    \ `框 2-1`）。\n\n### 评审标准\n\nNRC 研究助理计划的奖励申请由 6 个大学科领域的专家小组评审：化学；地球和大气科学；工程、应用科学和数学；生命科学；物理学；空间科学。每份申请至少由\
    \ 3 名评审员阅读。评审员评估申请的质量、成功的可能性以及研究对资助实验室使命的贡献。博士后申请人的评估基于其作为学生的已证明能力以及其作为独立科学家做出贡献的潜力。高级申请人（包括夏季教师计划的申请人）的评估基于其已证明的能力和已证明的研究成果。评估不考虑年龄、性别、婚姻状况、出生国、信仰、种族或族群。\n\
    \n每份申请都会分配一个数值分数，申请人的最终得分是所有评审的平均分。评分采用 10 分制，只有得分 7.5 分及以上的申请者会被考虑授予奖励。资助实验室首先向评分最高的申请者提供奖励，并继续授予奖励直到名额填满。在评审过程中，每位申请人将根据四个主要要素进行评估，近似权重所示：\n\
    \n**拟议研究的科学价值 (40%)**\n\n"
