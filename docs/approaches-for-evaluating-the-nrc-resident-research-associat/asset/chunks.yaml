    在问卷的这一部分，回答人数显著下降。只有极少数受访者回答了这个问题，该问题侧重于从研究导师处获得的指导质量。此问题忽略了研究助理（Research Associate）可能在受访机构内部或外部接受了其他人的指导可能性。16%（共
    253 人中）的`NIST/NRC` 研究助理和 3%（共 6,936 人中）的来自其他研究助理计划（RAPs）的研究助理提供了该类别的信息。在回答者中，如表
    3-9 所示，尽管鉴于前任研究助理的评价，这可能令人意外，但平均分相当高，为`8.6`，且`NIST/NRC` 研究助理的得分略低于其他 RAP 计划的研究助理（在`8.2`到`8.7`之间）。这种差异在`0.05`的水平上具有统计学意义，但应非常谨慎地对待。然而，考虑到响应率非常低，获得大量支持的人可能更有可能回答这个问题。


