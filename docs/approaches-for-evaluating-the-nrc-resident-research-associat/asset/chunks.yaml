    Kathryn Newcomer 是乔治·华盛顿大学公共政策与管理博士项目主任，该校公共政策与管理学院副院长。她在该校教授公共与非营利组织管理、项目评估、研究设计和应用统计学。她为联邦和地方政府机构提供绩效衡量和项目评估方面的研究与培训。Newcomer
    博士出版了五部著作，包括《改进政府绩效》（*Improving Government Performance*, 1989）、《实用项目评估手册》（*The
    Handbook of Practical Program Evaluation*, 1994, 2004）、《利用绩效衡量改进公共和非营利项目》（*Using
    Performance Measurement to Improve Public and Nonprofit Programs*, 1997）、《应对绩效导向政府的挑战》（*Meeting
    the Challenges of Performance-Oriented Government*, 2002）以及《获得成果：联邦领导者和经理指南》（*Getting
    Results: A Guide for Federal Leaders and Managers*, 2005），并在《公共行政评论》在内的众多期刊上发表了大量文章。2001
    年，她被《美国评估杂志》评为美国前 25 位评估专家之一。她是美国国家公共行政学院的成员，目前担任审计长教育者顾问小组成员。她于 2006-2007 年度担任公共事务与管理学院协会（NASPAA）主席。她曾获得两次富布莱特奖金，一次针对台湾（1993
    年），一次针对埃及（2001-2004 年）。Newcomer 博士在堪萨斯大学获得教育学学士和政治学硕士，在爱荷华大学获得政治学博士学位。


    Georgine M. Pion 博士是范德堡大学皮博迪学院心理学与人类发展系研究副教授。Pion 博士的研究重点是职业发展和人力资源政策，特别是涉及科学家和临床人员的教育、培训和就业。除了培训计划外，她的工作还涉及大规模调查，旨在评估神经科学领域的同行评审、识别影响
    NIH 经费申请者满意度的因素、评估特殊教育教师的供需，以及心理学家的教育和就业趋势。她是美国科学院的成员。


