- raw: "For international presentations, 49 percent (of 253) NIST/NRC RAs and 31 percent\
    \ (of 6,936) of RAs from other RAPs provided information. NIST/NRC RAs gave between\
    \ 0 and 7 international presentations, while RAs from other RAPs gave between\
    \ 0 and 25 presentations. Among those who responded, a greater percentage of NIST/NRC\
    \ RAs gave at least one international presentation. As [Table 3-2](../Text/ch012.xhtml#p200138f5ttt00027)\
    \ shows, neither NIST/NRC RAs nor RAs in other RAPs give many international presentations,\
    \ however, with an average of one presentation. While the NIST/NRC RAs have a\
    \ slightly lower average than RAs in other RAPs (0.9 to 1), the difference is\
    \ not statistically significant.  \n\n ![](Images/t200138f5_28.png) \n\n### **Patents**\n\
    \nPatents during a postdoctoral appointment were quite rare for Research Associates.\
    \ Fifty-seven percent (of 253) NIST/NRC Research Associates and 28 percent (of\
    \ 6,936) of research associates from other RAPs provided information on patents\
    \ received. Among those who responded, as presented in [Table 3-4](../Text/ch012.xhtml#p200138f5ttt00029),\
    \ similar percentages of NIST/NRC Research Associates and Research Associates\
    \ in other RAPs indicated that they had one or more. Numerically, both NIST/NRC\
    \ Research Associates and Research Associates of other RAPs reported an average\
    \ of 0.1 patents, with no statistically significant difference. \n\n ![](Images/t200138f5_29.png)\
    \ \n\n### **Awards**\n\nAwards were also rare for Research Associates in any Program.\
    \ Twenty-nine percent (of 253) NIST/NRC Research Associates and 10 percent (of\
    \ 6,936) of research associates from other RAPs provided information on awards\
    \ received. As with patents the results were quite similar, both in percentage\
    \ terms and numerically. Among those who responded, as [Table 3-5](../Text/ch012.xhtml#p200138f5ttt00030)\
    \ illustrates, 12 percent of NIST/NRC Research Associates had received an award,\
    \ compared with 16 percent of other Research Associates who had received one or\
    \ more awards. Numerically, on average, NIST/NRC Research Associates received\
    \ fewer of these rare awards than did Research Associates of other RAPs (0.1 to\
    \ 0.2). This difference is statistically significant at the 0.05 level.[^(45)](../Text/ch012.xhtml#p200138f5ftt00045)\
    \ However, quantitative measures of awards are not very helpful, as some awards\
    \ are clearly more important than others.\n\n|  ||  ^(45) Based on an unpaired\
    \ t-test with unequal variances. Note the different sample sizes and that the\
    \ samples are not normally distributed. |\n\n| --- | --- |\n\n ![](Images/t200138f5_30.png)\
    \ \n\n## **RESEARCH ASSOCIATES’ VIEWS OF THE PROGRAM**\n\nThe evaluation form\
    \ asks Research Associates to rate the RAP on six dimensions on a scale of 1 to\
    \ 10, with 1 representing poor and 10 meaning excellent. Not surprisingly, given\
    \ the positive feedback heard in the expert panels, most respondents had a very\
    \ positive view of the program. Note that the number of responses to this part\
    \ of the questionnaire was much lower than other parts, possibly because it comes\
    \ at the end of the questionnaire. Here the response rate is around 15 to 20 percent.\
    \ As a result all of these findings need to be taken cautiously.\n\n### **Short\
    \ Term**\n\nThis dimension asks Research Associates to evaluate the program in\
