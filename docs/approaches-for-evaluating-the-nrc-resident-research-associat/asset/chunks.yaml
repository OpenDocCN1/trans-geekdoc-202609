    Given that there are many applicants who not offered a research associateship,
    due to limitations on the number of positions available, an interesting question
    is what would happen if the ceiling on research associateships was raised? One
    way to examine this question is to look at the average scores, assigned by the
    reviewers, to the applicants who do and not ultimately get offers. Scores range
    from 10 to 0, with 10 being the highest, although in practice no one has yet to
    receive a perfect 10. Reviewers recommended many more candidates than NIST had
    space for—and some of those who were offered declined. About one-third of all
    applicants were recommended by the reviewers (but did not receive an award) and
    about five percent were offered, but declined.


    It is likely that the award rates for applicants to the NIST/NRC RAP and the other
    RAPs vary by a number of characteristics. Next, the applicant pools to the NIST/NRC
    RAP and the other RAPs are disaggregated by discipline or field, gender, and race/ethnicity.


    ### Discipline


    This section presents data on the total pool of potential applicants, applications,
    and acceptances by discipline. Perhaps reflecting the evolving nature of disciplines
    over the years, and the fact that applicants are asked to identify a field for
    each degree received, there are a large number of fields that applicants have
    identified over the years. There were 1,398 choices applicants could pick. Several
    are a bit confusing. Applicants picked 536 different fields for their Ph.D.s.
    To simplify matters, a small group of major categories was created: agricultural
    sciences and natural resources; biological, biomedical, and health sciences; engineering;
    mathematical and computer sciences; and the physical sciences to examine. (A list
    of which fine fields are part of each of these major categories is found in [Appendix
    F](../Text/ch021.xhtml#p20013f5ddd00070). This process was subjective, particularly
    in terms of whether a field should be included in these major categories or not,
    but it should not effect the general results presented in the following tables
    because the least clear fine fields were listed by very few applicants.) See [Appendix
    E](../Text/ch020.xhtml#p20013f5ddd0069) for underlying data.


    First, what is the proportion of applications by major field? As [Table 2-7](../Text/ch011.xhtml#p200138f5ttt00009)
    illustrates, very few applicants to either the NIST/NRC RAP or other RAPs come
    from a background in agriculture or natural resources. Applicants to the NIST/NRC
    RAP are much more likely to come from the physical sciences than applicants to
    other RAPs, while the reverse is true for applicants who received a Ph.D. in the
    biological or health sciences.


