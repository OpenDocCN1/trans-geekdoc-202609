    ### Long Term


    This question focuses on how the award has affected the Research Associate’s career
    to date. This question is bit problematic, given that it is not clear what an
    excellent or poor is, or whether Research Associates are thinking in the same.
    Forty-one percent (of 253) NIST/NRC Research Associates and 21 percent (of 6,936)
    of research associates from other RAPs provided information on this category.
    Among those who responded, as seen in [Table 3-7](../Text/ch012.xhtml#p200138f5ttt00032),
    the scores were similar to above, with an average of 8.7. NIST/NRC Research Associates
    again 8.5, compared with the average of 8.8. This difference was statistically
    significant at the 0.05 level.[^(46)](../Text/ch012.xhtml#p200138f5ftt0046)


