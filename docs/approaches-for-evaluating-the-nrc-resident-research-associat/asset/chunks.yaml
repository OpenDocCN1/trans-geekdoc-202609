  trans: '

    此类研究可以通过专家小组或对 NIST 员工以及现任或任研究助理（RA）进行调查来进行，以回答第一个和第三个问题，并为第二个问题的评估提供信息。还应该收集个人外推广工作的成本信息（例如，在广告上的花费、与毕业生会面的时间），以便与收益进行比较（每种个人推广类型带来了多少申请人）。


    c. 促进推广工作评估的第二步是确定量化不同推广策略所得价值的指标，例如网站访问量或在专业会议上结识的研究生人数。


    d. 检查个人外推广策略的投资回报率。这可能包括此类策略：评估 NIST 网站的可用性和信息内容，或评估出版物广告的回报率。作为评估 NIST 网站的一部分，NIST
    可以考虑增加研究导师的联系信息，以促进潜在申请者与相关 NIST 员工之间的对话。


    e. 最后，考虑目前是否有其他未充分利用但可能具有潜在价值的推广策略，例如向院长、系主任及其他大学管理人员发送直接邮邮件。


    f. 此外，确定是否有任何可以作为 NIST/NRC RAP 良好候选人的研究生群体（以及潜在申请者）并不了解该计划以及如何申请，这一点非常重要。要构建一个研究生随机样本很困难，但进行有限的调查可能是可能的。


    2. **NIST 应对拒绝研究助理职位录取的人员进行评估。** 这可以通过电话采访或调查的方式进行。由于每个周期拒绝的人寥寥，负担将相对较小。对于那些获得录取但拒绝的人，应该询问他们两个基本问题：（1）你为什么要拒绝？（2）你计划改做什么？


    3. **NRC 应修改申请表。** 应该减少字段数量，特别是通过合并非常相似的标签，并移除用于多个字段的标签（例如，“生物物理、物理、生物化学”）。至少在博士领域，可以在美国国家科学基金会（NSF）的《已获博士学位调查》（Survey
    of Earned Doctorates）中找到一个更短的领域列表示例（参见 附录 B）。


    4. **NRC 应更新 DataRAP 数据库，用当前的等效名称替换 NIST 中不再存在的组织名称（例如学院或实验室）。**


    # 3


    # 研究助理的经历


    研究助理（RA）在 NIST 留任最多两年进行研究。在专家小组期间，我们向现任和前任研究助理就他们在 NIST 的经历询问了几个问题。在现任研究助理中，他们很快指出这一任命是他们研究生后的第一项职业活动，也是学术之外的首次体验。现任研究助理报告说，在
    NIST 可以拥有相当大的研究自由，但因实验室和小组的不同而异。NIST 不同部门之间的差异可能是专家小组中出现的最重要主题之一。


    现任研究助理认为这一职位让他们对科学有了更广泛的视角。他们对这一经历感到非常满意，认为 NIST 是一个极佳的工作场所。他们还注意到加入 NIST/NRC
    RAP 为他们提供了更好的福利和更多进入 NIST 校区的机会。最后，一些参与者认为，在 NIST 等地方获取资源的机会可能比其他环境更好。


    从负面来看，他们认为 NIST/NRC RAP 是一种负担。现任研究助理指出，他们面临的官僚主义比其他环境更多。他们认为 NIST/NRC RAP 的设立并不是提供大量的指导，而且
    NIST 的指导和导师制并不常见。他们认为需要大量指导或手把手帮助的 RA 在 NIST 表现并不好，而自给其力和独立是更成功（可能更满意）的 RA 的特征。


    现任研究助理对改进该计划的建议是增加薪水、可能延长任期并制定更好的休假政策。一些研究助理认为薪水高于许多学术职位。RA 的年底薪为 `60000`。最近一项针对博士后的调查显示，2005`
    年的薪水为 `38000`（Davis）。Sigma Xi 对博士后的一项调查发现，2006 年薪水在工业界为 `52750`，政府为 `50000`，医学院为
    `40000`，学术界为 `38000`（Austin）。


    一些 RA 注意到他们的同事将他们视为平等对待，尽管考虑到前任 RA 目前处于临时或有条件的任命中，这是预期之中的。有些 RA 提到，考虑延长期限的原因之一与研究领域的转变有关。进入一个新的研究领域需要大量时间进入状态，并且最后还要急于进行研究和发表发现。参与者还认为家庭假不足。他们担心如果因为新生婴儿而请假，他们将直接失去任期时间，且无法补偿。


    前任研究助理（正如 [第 1 章](../Text/ch010.xhtml#p200138f5ddd0015）所示，这些人仅限于留在 NIST 的人员）也对该计划推崇备至。相对于现任研究助理，他们认为该计划非常有声望。博士后被视为良好的跳板，特别是对于准备政府职业。前任
    RA 认为该计划有几个好处，包括：合作（包括接触的科学家或工程师范围）、职业道路上的良好跳板，以及在 NIST 工作的良好途径。既不描述为负面也不正面，前任
    RA 注意到有些 RA 并没有从事他们最初在申请中提议的研究。


