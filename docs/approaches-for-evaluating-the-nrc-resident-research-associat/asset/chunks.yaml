    ## OUTLINE OF REPORT


    The report is organized in a chronological way, following the trajectory of doctorates
    from application, to award, to their experiences in the Program, and concluding
    with a career assessment of awardees after their appointments have ended. [Chapter
    Two](../Text/ch011.xhtml#p200138f5ddd00023) examines applicants to the NIST/NRC
    RAP and compares them to applicants to other RAPs. It also examines applications
    and awards disaggregated across several dimensions, such as gender or doctoral-granting
    institution. [Chapter Three](../Text/ch012.xhtml#p200138f5ddd00041) examines the
    experiences of NIST RAs and RAs at other federal agencies, as well as research
    associates’ views on the value of the Program. [Chapter Four](../Text/ch013.xhtml#p200138f5ddd00057)
    examines the careers of former research associates. [Chapter Five](../Text/ch014.xhtml#p200138f5ddd00061)
    presents an overall summary of preliminary results and recommendations.


    # 2 Recruitment and Selection


    The NRC Research Associateship Program at NIST (hereafter “NIST/NRC RAP”) is thought
    to be a value to both the postdoctoral recipients and to NIST itself. This chapter
    is divided into three sections. First, the recruitment of RAs is put put into
    context by examining trends in Ph.D. production and trends in postdoctoral appointments.
    Second, the application process is examined. Finally, characteristics of applicants
    and awardees are described.


    ## TRENDS IN DOCTORATES AND POSTDOCTORATES


    ### Trends in Doctorates


    As noted in the previous chapter, information on doctorates comes from the National
    Science Foundation’s Survey of Earned Doctorates (see [Appendix B](../Text/ch017.xhtml#p200138f5ddd00066)
    for a recent questionnaire). The number of doctorates granted in the United States
    has generally grown over the past 100 years, peaking in 1973 and 1998. Prior to
    1953, more doctorates were produced at private institutions (NSF, 2006c). Examining
    trends from 1920-1999, for all doctorates—not just U.S. citizens:


    • About two-thirds of doctorates were awarded in science and engineering (S&E).


    • Between 1920 and 1974, between 87.2 and 93.6 percent of doctorates in S&E were
    awarded to men. This figure dropped steadily from 1975 to 1999. In the period
    1995-1999, it stood at `66.8` percent.[`30](../Text/ch011.xhtml#p200138f5ddd00030)


    • A growing percentage of S&E doctorates were awarded to foreign nationals: `38.6`
    percent.[`31](../Text/ch011.xhtml#p200138f5ddd00031)


    • Underrepresented minorities receive few Ph.D.s: `7.4` percent of S&E doctorates.[`32](../Text/ch011.xhtml#p200138f5ddd00032)


    • The median age of doctorate recipients has been increasing over time; although
    the median age for recipients of Ph.D.s in S&E is much lower than those for non-S&E.


    • A majority of doctoral recipients were married at the time of graduation, though
    the percentage of married graduates has been declining since the 1960s.


    For the years 2000 to 2005, some trends have continued (see [appendix C](../Text/ch018.xhtml#p200138f5ddd0067)
    for underlying data). In 2005, S&E doctorates accounted for `64` percent of all
    doctorates, which is similar to the ratio in the 1990s. However, more and more
    women are receiving doctorates in S&E. In 2005, about `38` percent of S&E Ph.D.s
    went to women. The number of U.S. citizens receiving doctorates in science and
    engineering has declined somewhat from 2000 to 2005. Among doctorates where citizenship
    was known, in 2005, about `56` percent of S&E Ph.D.s were awarded to U.S. citizens.


    ### Trends in Postdoctoral Appointments


    Postdoctoral appointments date back over 100 years; however the hiring of postdocs
    did not grow significantly until the second half of the twentieth century. An
    initial period of rapid growth occurred in the 1950s, stimulated by the Cold War
    demand for scientists and engineers. In the 1970s, and again during the recession
    of the 1990s, the number of postdoctoral positions increased due to a weaker economic
    market for Ph.D.s.

