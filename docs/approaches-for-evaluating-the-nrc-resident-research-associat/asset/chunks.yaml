    图 2-9 和 2-10 重复了早期对成功申请者的性别的分析，此处是按种族/族裔进行的分析。这里比较了代表性少数群体与白人和亚洲人的成功率。代表性少数群体的趋势线波动相当剧烈，因为申请者人数较少，导致申请者中获奖者的比例波动很大。在
    NIST/NRC RAP 和其他 RAP 项目中，这两组的成功率相似。


    ![](img/p200138f5g44001.png)


    图 2-9 1965-2007 年按种族/族裔划分的 NIST/NRC 研究助理员计划申请成功率。


    注：1986 年 NIST 项目未颁发任何奖项。2007 年并非所有的申请周期都已完成并记录在数据库中。


    来源：美国科学院（National Academies），DataRAP 数据库，工作人员统计。


    ![](img/p200138f5g45001.png)


    图 2-10 1965-2007 年按种族/族裔划分的所有其他研究助理员计划申请成功率。


    注：2007 年并非所有的申请周期都已完成并记录在数据库中。


    来源：美国科学院，DataRAP 数据库，工作人员统计。


    ### 机构


    NIST 在评估 NIST/NRC RAP 时，感兴趣的一个领域是审查申请者的博士学位授予机构。由于 NIST 的目标之一是吸引最优秀、最才华的人才，因此预计许多申请者已从所谓的顶尖机构获得了博士学位。同时，顶尖候选人确实可能来自广泛的机构，因此预计该计划申请者的博士学位授予机构范围也将具有某种多样性。申请者要求在申请表上注明他们的教育经历和就读院校。我们关注了授予申请者博士学位的机构，特别是下列出的申请和录取的前
    20 所机构。（部分申请者未注明其博士学位授予机构：NIST/NRC RAP 申请者中有 2 人，其他 RAP 申请者中有 86 例。这些情况被排除在分析之外。总体而言，NIST/NRC
    RAP 的申请者来自总共 333 所授予学位的机构；而其他 RAP 的申请者则来自 1534 所授予学位的机构。这可能部分由于 NIST/NRC RAP 对美国公民身份的要求。在录取方面，所有获得
    NIST/NRC RAP 奖项的人都注明了他们的博士学位授予机构；但有 14 位获得其他研究助理员计划的人没有注明。NIST/NRC RA 的博士学位来自
    173 所不同的机构。其他 RAP 的 RA 博士学位来自 983 所不同的机构。如 图 2-11 所示，NIST 的申请者来自大量的机构。


    ![](img/p200138f5g46001.png)


    图 2-11 1965-2007 年 NIST/NRC 研究助理员计划申请者的博士学位授予机构数量。


    注：2007 年并非所有的申请周期都已完成并记录在数据库中。


    来源：美国科学院，DataRAP 数据库，工作人员统计。


    在接下来的两个表中，展示了 NIST/NRC RAP 以及其他 RAP 计划申请者和获奖者的前 20 所博士学位授予机构的数据。


    ![](img/t200138f5_14.png) ![](img/t200138f5_15.png)


    表格显示出相当大的重叠。NIST/NRC RAP 的第一点是，前 20 所机构都是主要的研究机构。根据 1994 年的卡内基分类方案，它们均被归类为“研究
    I”机构。其次，NIST/NRC RAP 所有申请的 44% 来自 20 所机构，而超过一半的奖项授予了这 20 所机构的申请者。


    接下来，我们按选定的科学与工程（S&E）领域专门查看 NIST。首先，在 表 2-14 中，审查了申请者和获奖者获得博士学位的学位授予机构数量。如 表 2-14
    所示，除农业科学和自然资源外，申请者来自大量的机构。即使在申请者人数较少的生物科学领域，所代表的大学数量也相对较高。


