    # 1 Overview


    **7. NIST should conduct a broad evaluation of the careers of former Research
    Associates to evaluate the impact of the Program on Research Associates’ careers,
    NIST, and the broader science and engineering community**. The best approach for
    doing this is a survey, which would compare the career outcomes of NIST/NRC Research
    Associates to similar postdocs. The survey would be directed towards these former
    Research Associates and a suitable control group. Ideally, two possible comparisons
    could be made. First, one could construct a peer group. This would consist of
    a matched or stratified sample of individuals who had postdocs similar to the
    one at NIST for the comparison group. Although not ideal, one solution would be
    to take a stratified sample of former Research Associates from the Fellowships
    Office’s Directory. This is a census of former Research Associates; but as noted
    earlier in the report, many of these individuals could not be found or failed
    to respond to an earlier survey designed to collect information on their current
    employment. A second comparison group would consist of similar doctorates. A roster
    could be assembled by tapping the group of applicants to RAPs, who did not receive
    an award. These individuals will likely exhibit a diversity of career paths, including
    some who took postdocs (in academia or industry) and others who went straight
    into employment.


    In *Rising Above the Gathering Storm*, the National Academies posited that “The
    prosperity the United States enjoys today is due in no small part to investments
    the nation has made in research and development at universities, corporations,
    and national laboratories over the last 50 years. Recently, however, corporate,
    government, and national scientific and technical leaders have expressed concern
    that pressures on the science and technology enterprise could seriously erode
    this past success and jeopardize future U.S. prosperity”(NAS/NAE/IOM, 2007).


    To address these challenges, the *Gathering Storm* report recommended action in
    four areas: K–12 education, higher education, science and engineering research,
    and economic and technology policy. Many of the report’s recommendations were
    later echoed in the American Competitiveness Initiative (ACI), introduced by President
    Bush in his State of the Union Address on January 31, 2006. The ACI was warmly
    received by legislators from both parties on Capitol Hill, generating bills designed
    to implement its key provisions.


    While considering these proposals, Congress took the immediate step of requiring
    an examination of existing federal education programs in science, technology,
    engineering, and mathematics (STEM) fields. As noted in a statement by Secretary
    Spellings on the new Academic Competitiveness Council (ACC) and its mission, “The
    Deficit Reduction Act, signed into law by the President on February 8, 2006, included
    an Academic Competitiveness Council chaired by the Secretary of Education, and
    consisting of members of the Federal Government whose agencies have education
    programs in science, technology, engineering, and mathematics. Its mission under
    law is to evaluate the effectiveness of each program, identifying areas of overlap
    and recommending ways to efficiently integrate and coordinate in the future.”
    The ACC’s efforts included assessing the success of these programs, identifying
    areas for improvement for current and future programs, and laying the groundwork
    for sustained collaboration among the programs (DOE, 2007).


    Postdoctoral programs—of which there are several in the sciences and engineering
    (S&E)—are of critical importance in providing additional research training, knowledge,
    and opportunities to bridge higher education with the start of a career in S&E.
    While many Ph.D.s do go straight into full-time employment, a large number of
    doctorates view a few years as a postdoc to be a valuable opportunity to build
    skills and a reputation and a chance to experiment in the labor market.


    | |  ³ A postdoctoral position or “postdoc” is a temporary position awarded in
    academia, industry, non-profits, or government primarily for gaining additional
    education and training in research. Individuals with postdoctoral appointments
    are called postdocs. |

    | :--- | --- |


    ## FEDERAL PROGRAMS TO SUPPORT POSTDOCS IN S&E


    According to the GAO (2005:3), there were 207 “education programs funded in fiscal
    year 2004 that were designed to increase the numbers of students and graduates
    pursuing STEM degrees and occupations or improve educational programs in STEM
    fields….” Included in these programs are several programs that provide and emphasize
    postdoctoral opportunities, such as: the National Aeronautics and Space Administration’s
    NASA Postdoctoral Program; the National Institute of Health’s Ruth L. Kirschstein
    National Research Service Awards (NRSA) for Individual Postdoctoral Fellows (F32),
    Career Transition Award (K22), Pathway to Independence (PI) Award (K99), Postdoctoral
    Intramural Research Training Award (IRTA), Cancer Research Training Award (CRTA),
    Postdoctoral Visiting Fellowship (VF), National Institute of General Medical Sciences
    Pharmacology Research Associate (PRAT) Program, and Women’s Health Postdoctoral
    Fellowship; the National Science Foundation’s Postdoctoral Research Fellowships;
    and the U.S. Department of Agriculture’s Agricultural Research Service (ARS) Postdoctoral
    Research Associate Program.


    | | ⁴ STEM is science, technology, engineering, and mathematics. |

    | :--- | --- |

    | | ⁵ While these programs focus on individual postdocs, other programs target
    academic institutions with funding to support groups of postdocs. |

    | :--- | --- |


    The National Research Council Fellowships Office of The National Academies manages
    several postdoctoral research programs on behalf of federal agencies. Table 1-1
    lists several programs administered by National Research Council.


    ### TABLE 1-1 Selected National Council Researchhip Programs


    | Agency | Researchhip Program |

    | :--- | :--- |

    | Department of Defense | Air Force Research Laboratory (AFRL) |

    | Department of Defense | Armed Forces Radiobiology Institute (AFRI) |

