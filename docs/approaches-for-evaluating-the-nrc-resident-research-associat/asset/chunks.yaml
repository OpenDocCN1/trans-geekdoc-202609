    ### NRC 支持


    最后，研究助理被要求评价 NRC 提供的支持。所有研究助理都与 NRC 有互动。有趣的是，尽管该问题出现在最后，但回答人数较多。26%（共 253 人中）的`NIST/NRC`
    研究助理和 21%（共 6,936 人中）的来自其他计划的研究助理提供了该类别的信息。在回答者中，如表 3-11 所示，总体而言，研究助理的反馈是积极的，平均分为`8.8`。然而，`NIST/NRC`
    研究助理与其他 RAP 计划的研究助理之间的差异较大（在`8.0`到`8.8`之间）。这种差异在`0.05`水平上具有统计学意义。


    ### 表 3-11 研究助理对 NRC 的评价，按计划划分


