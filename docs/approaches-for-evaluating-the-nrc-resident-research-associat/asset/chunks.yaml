    # 1 执行摘要


    ## 执行摘要


    美国国家标准与技术研究院（NIST）的研究员计划（RAP，以下简称 `NIST/NRC`）于 1954 年启动，旨在为杰出的科学家和工程师提供机会。该委员会由国家研究委员会（NRC）任命，负责评估该计划。


    委员会的具体任务下所示：


    1. NIST 是否正在将“最优秀、最才华”的人才吸引到 RAP 计划？

    2. 该计划对研究员、NIST 以及科学领域有何影响？


    为了完成任务，委员会重点关注了三个目标：

    1. 描述该计划申请者的特征；

    2. 描述研究员在 NIST 及其他联邦机构的经历；

    3. 为研究员的职业生涯提供更深入评估的建议。


    在准备本报告时，确定并使用了多个信息来源。主要信息来源是 NRC 学金办公室收集的数据，包括申请数据、研究员编写的报告数据以及往届研究员的名录。此外，委员会还从三个专家小组收集了原始数据。然而，总体而言，数据不足以得出结论。


    本报告分为五章：

    * 第一章描述了该计划以及研究的方法和范围。

    * 第二章考察了 NIST/NRC RAP 的申请者，并与其他员计划的申请者进行比较。它还根据性别或博士学位机构等多个维度对申请和获奖进行了分类分析。

    * 第三章考察了 NIST/NRC 研究员和其他联邦机构研究员的经历，以及研究员对其参与计划价值的看法。

    * 第四章考察了前研究员的职业生涯。

    * 第五章提供了初步结果和建议的总体总结。


    由于数据有限，委员会未能对该计划进行全面评估。此外，委员会决定在适当的情况下提出建议，涉及关于申请者的数据收集、现任及前任研究员的经历，以及研究员和 NIST
    对计划价值的看法。鉴于现有数据，委员会无法对该计划的影响 2 进行全面评估。


