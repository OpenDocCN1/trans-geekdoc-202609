- raw: 'There are a number of reasons to conduct a more thorough evaluation of the
    careers of former RAs. Collecting data currently not being done on the careers
    of former RAs would facilitate benchmarking should NIST want to make changes to
    the program, further improvements to the program, and would shift information
    about the program from qualitative to quantitative data. There are several directions
    that future assessment could go in. In general, these include: (1) studying benefits
    to RAs (potential benefits could include: better or more training, greater productivity
    after the postdoctoral appointment, receiving more grants after the postdoctoral
    appointment); (2) studying benefits to NIST (potential benefits could include:
    success of NIST/NRC RAs, more and better alternatives for hiring, increased breadth
    of expertise, novel research projects and their impact, increased collaboration,
    increased numbers of applicants to the program, or increased prestige); and (3)
    examining the costs of the program to NIST (potential costs could include: costs
    to advisors or opportunity cost of not hiring other staff). Methodologically,
    such analysis could take the form of surveys of former RAs, social network analysis
    (to examine collaboration), CV analysis (to examine the impact of the position
    on careers), or citation analysis (to assess the impact of RAs’ work).


    ## **PRELIMINARY RESULTS**


    Preliminary evidence suggests that RAs contribute to the pool of qualified applicants
    to permanent positions at NIST. About 45 percent of RAs indicated that their immediate
    post-tenure position was at NIST as a permanent, temporary, or contract employee
    after their appointment—a higher percentage than RAs at other federal agencies.
    A survey of former RAs found that a higher percentage of former NIST/NRC RAs stayed
    at NIST than RAs at other federal agencies stayed at their host agency (37.6 to
    28.1 percent). Second, evidence on the outcomes of the Program is largely lacking.
    Little data are collected on the career outcomes of former RAs; and the value
    of the program to NIST or to the broader scientific and engineering community.


    ## **RECOMMENDATIONS**


    1\. **NIST should conduct a broad evaluation of the careers of former RAs to evaluate
    the impact of the Program on RAs’ careers, NIST, and the broader science and engineering
    community.** The best approach for doing this is a survey, which would compare
    the career outcomes of NIST/NRC RAs to similar postdocs. The survey would be directed
    towards these former RAs and a suitable control group. Ideally, two possible comparisons
    could be made. First, one could construct a peer group. This would consist of
    a matched or stratified sample of individuals who had postdocs similar to the
    one at NIST for the comparison group. Although not ideal, one solution would be
    to take a stratified sample of former RAs from the Fellowships Office’s Directory.
    This is a census of former RAs; but as noted earlier in the report, many of these
    individuals could not be found or failed to respond to an earlier survey designed
    to collect information on their current employment. A second comparison group
    would consist of similar doctorates. A roster could be assembled by tapping the
    group of applicants to RAPs, who did not receive an award. These individuals will
    likely exhibit a diversity of career paths, including some who took postdocs (in
    academia or industry) and others who went straight into employment. [Box 4-1](../Text/ch013.xhtml#p200138f5bbb00087)
    offers suggested questions that might be asked.


    **Box 4-1** **Career Assessment Survey of Former Research Associates**


    1\. Which Research Associateship Program were you in?


    2\. Which lab?


    3\. Which division/directorate/department?


    4\. Start date of postdoc


    5\. End date of postdoc


    6\. What was your primary reason for taking this postdoc?


    a. Additional training in Ph.D. field


    b. Training in an area outside of Ph.D. field


    c. Work with a specific person or place


    d. Other employment not available


    e. Postdoc generally expected for a career in this field


    f. Salary/benefits


    g. Location


    h. Some other reason: \_\_\_\_\_\_\_\_\_\_\_\_\_\_


    7\. Demographic information


    a. Highest degree


    b. Year received highest degree


    c. Ph.D. field


    d. Gender


    e. Race/ethnicity


    f. Citizenship


    8\. Employment characteristics


    a. Have you been employed in any position since completing your postdoc?


    b. Are you currently employed (or self-employed) either full-time or part-time?


    c. Where are you currently employed?


    i. Educational institution


    ii. Industry


    iii. Government


    iv. Not-for-profit


    v. Self-employed


    vi. Other: \_\_\_\_\_\_\_\_\_\_\_\_\_


    d. If educational, are you employed at:


    i. K-12


    ii. Two-year college, community college, or technical institute


    iii. Four-year college or university


    9\. If government, are you at the same agency that you had the postdoc with?


    10\. Is your current position a postdoctoral appointment?


    11\. Is your current employer the same as your first post-postdoctoral appointment
    employer?


    12\. If no, what was the type of employer for your first post-postdoctoral appointment
    employer?


    13\. Was your first post-postdoctoral appointment employer the type of employer
    that you envisioned when you applied for the postdoctoral appointment?


    14\. How useful did you find the following factors in seeking your first post-postdoctoral
    appointment employer? (1 = not at all useful to 5 = extremely useful, plus Not
    Applicable)


    a. Contacts initiated by the employer


    b. Contacts you initiated


    c. Contacts provided by your research advisor


    d. Contacts provided by someone else at the agency


    e. Prestige of the your advisor


    f. Prestige of the agency


    g. Prestige of the RAP


    h. Publications for which you received credit while a postdoc


    i. Presentations you gave while a postdoc


    j. Participation of grants


    k. The area you were researching while a postdoc


    l. Other: \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_


    15\. Productivity (Over the past five years or since the end of your postdoc)


    a. Publications


    i. Books, book chapters


    ii. Publications in peer-reviewed journals


    b. Patents awarded


    c. Presentations


    i. Domestic


    ii. International


    d. Awards received


    e. Grants


    16\. Views about how the program helped you (1 = not at all to 5 = a great deal,
    plus Not Applicable)


    a. To what extent have you continued to stay in touch with various persons you
    met during the postdoc appointment?


    i. Your research advisor


    ii. Other agency staff


    iii. Other postdocs


    17\. To what extent do you agree or disagree with the following statements (1
    = strongly disagree to 5 = strongly agree)?


    a. Overall, I found my postdoc experience to be valuable


    b. When it came to securing my first post-postdoc position, my postdoc experiences
    put me on an equal footing with other postdoctoral researchers of similar qualifications


    c. My postdoc experiences taught me most of what I needed to know to prepare grant
    proposals


    d. My postdoc experiences taught me most of what I needed to know to conduct independent
    research


    e. My postdoc experience led to a professional expertise that I would not have
    developed otherwise


    f. I established on-going friendships with people I met at my host institution


    g. I am proud to have been a NIST Postdoc


    18\. To what extent did your postdoctoral experience hinder or help with each
    of the following? (1 = no help at all to 5 = extremely helpful, plus Not Applicable)


    a. Quality of your current research


    b. Specific direction of your current research


    c. Progress of your current research


    d. Your success in obtaining subsequent funding


    e. Your teaching/curricular activities


    f. Your ability to mentor others


    g. Your confidence in performing leading-edge research


    h. Your career as a whole


    i. Other: \_\_\_\_\_\_\_\_\_\_\_\_\_


    19\. Other


    a. Have you recommended the postdoc to others?


    b. Would you?


    c. What were the best features of the postdoc?


    d. What were the worst features of the postdoc?'
