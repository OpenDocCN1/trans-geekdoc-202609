    • 您为什么申请 NIST 博士后计划？(CRA/FRA)


    • 您还申请了哪些其他博士后计划、工作或其他机会？(CRA/FRA)


    • 在 NIST 担任博士后的经历是否影响了您倾向的雇佣地点？(CRA)


    • 博士后结束后您的职业计划是什么？(CRA)


    ![](img/9675.png)

    这是否因为您在 NIST 的博士后经历而发生了变化？


    • 您认为 NIST 博士后与科学工程领域的其他博士后相比何不同？(AD)


    • 您对目前的 NIST 博士后选拔流程是否满意？（所有人）


    • 如果这个博士后计划不存在，将如何影响您的工作和人员配置？(AD)


    • 在您的记忆中是否有哪些 NIST 博士后令您印象深刻，对领域产生了重大影响？(AD)


    • 您是否继续与之前的博士后保持联系（通过什么方式）？(AD)


    • 关于该计划，您还有什么想告诉我们的信息吗？（所有人）


    ## 报告大纲


    报告按照时间顺序组织，遵循了博士从申请、获得录取到在计划期间的经历的轨迹，并以获得者在任期结束后的职业评估作为总结。第二章 考察了 NIST/NRC RAP
    的申请者，并将其与其他 RAP 的申请者进行了对比。它还从多个维度（如性别或授予学位的机构）对申请和授予情况进行了细分分析。第三章 考察了 NIST 研究助理和其他联邦机构研究助理的经历，以及研究助理对该计划价值的观点。第四章
    考察了前研究助理的职业生涯。第五章 提供了初步结果和建议的总体总结。


    # 招募与选择


    NIST 博士后计划（以下简称“NIST RAP”）对于博士后本身以及 NIST 本身都有价值。本章分为三个部分。首先，通过研究博士学位授予和博士后任命趋势，对招募进行背景说明。其次，考察了选择过程。最后，描述了申请者的特征。


    ## 博士学位与博士后趋势


    ### 博士学位趋势


    正如前章所述，博士学位信息来自国家科学基金会（NSF）的《博士学位授予调查》（附录 B 获取更多数据）。美国的博士学位数量在过去 100 年中总体增长，并在
    1973 年达到顶峰。在 1953 年之前，博士学位是在私立机构产生的（NSF, 2006）。通过分析 1920 年至 1999 年的全部博士学位趋势（不仅是美国公民）：


    • 大三分之二的博士学位授予科学工程领域。


    • 在 1920 年至 1974 年间，科学工程博士学位中有 87.2% 授予了男性。这一数字从 1975 年开始持续下降。在 1995-1999 年期间，比例为
    30


    • 科学工程博士学位中授予外国籍人士的比例在增加：占比 31


    • 少数族裔获得的博士学位较少：科学工程博士学位占比 32


    • 博士学位获得者的中位年龄随时间推移在增加；尽管科学工程博士的中位年龄远低于非科学工程。


    • 大多数博士毕业生在毕业时已婚，尽管已婚毕业者的比例自 1960 年以来一直在下降。


    对于 2000 年至 2005 年，某些趋势仍在持续。在 2005 年，科学工程博士占总博士位的 64%，与 1990 年代的比例相似。然而，越来越多的女性正在获得科学工程博士学位。在
    2005 年，约 38% 的科学工程博士授予了女性。美国公民获得科学工程博士学位的人从 2000 年到 2005 年有所下降。在已知国籍的博士学位中，2005
    年约 56% 的科学工程博士授予了美国公民。


    ### 博士后任命趋势


    博士后任命可以追溯到 100 年以前；然而，博士后的聘用直到 20 世纪下半叶才显著增长。第一波快速增长时期出现在 1950 年代，受冷战对科学家和工程师的需求推动。在
    1970 年代以及 1990 年代的经济衰退期间，由于博士学位的就业市场疲软，博士后职位数量有所增加。


