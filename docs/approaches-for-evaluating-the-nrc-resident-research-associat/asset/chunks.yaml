- raw: '1\. **Outreach efforts produce more qualified applicants than NIST has slots
    to fill for Research Associates; and the pool of applicants includes many from
    top research institutions and is increasingly diverse.** Overall, 22 percent of
    applicants to NIST were awarded an appointment—a lower awards ratio than for other
    RAPs overall. The award ratios for NIST and other RAP applicants vary by gender,
    race, and field. Across all fields, the proportion of women and underrepresented
    minorities in the applicant pool and as awardees has grown over time, however
    less so than the proportion among Ph.D.s and those intending to be postdoctorates.
    Personal communication is the primary way that NIST/NRC Research Associates heard
    about the program.


    2\. **NIST/NRC Research Associates appear to be about as productive as Research
    Associates in other Programs.** On average, NIST/NRC Research Associates publish
    about two articles, give about four presentations, but rarely receive a patent
    or award during their appointments. They are more likely to give a domestic presentation
    or win an award, less likely to publish journal articles, and as likely to receive
    a patent or give an international presentation. Productivity data, though, are
    derived from a survey with a low response rate and possible nonresponse bias.


    3\. **Research Associates are quite satisfied with the program.** For those Research
    Associates who provided information on their final reports, on a scale of 1 to
    10, with 10 being excellent, NIST/NRC Research Associates rated short-term and
    long-term value of the program; lab, advisor, administrative (NIST and NRC) support
    between 7.7 and 8.5.  In half the categories NIST/NRC Research Associates and
    Research Associates in other programs reported statistically similar levels of
    satisfaction. In the other half, other Research Associates reported higher levels
    of satisfaction. Satisfaction data, though, are derived from a survey with a low
    response rate and possible nonresponse bias.


    4\. **Research Associates contribute to the pool of qualified applicants to permanent
    positions at NIST.** Among Research Associates completing their awards, 45 percent
    of those at NIST reported that their immediate post-tenure position was as a permanent,
    temporary, or contract employee—a higher percentage than Research Associates at
    other federal agencies. The employment of nonrespondents remains unknown. A survey
    of former Research Associates found that a higher percentage of former NIST/NRC
    Research Associates stayed at NIST than Research Associates in other programs
    stayed at their host agency (37.6 to 28.1 percent), among those former Research
    Associates who could be located.


    ## **CONCLUSION**


    1\. **Currently available data do not allow for a full program evaluation.** Currently,
    the most thorough data are collected on applicants. Little data are collected
    on Research Associates’ experiences; research advisors’ evaluation of Research
    Associates; career outcomes of former Research Associates; and the value of the
    program to NIST or to the broader scientific and engineering community.


    ## **RECOMMENDATIONS**


    1\. **NIST should conduct a more thorough evaluation of the NIST/NRC Research
    Associateship Program.**


    a. As a first step, NIST and the NRC should review specific goals of the program.


    b. The evaluation should include the following components: an assessment of outreach
    to potential applicants; an assessment of individuals who decline to accept a
    Research Associate position; an assessment of the benefits of the program on the
    Research Associates after they complete their appointments; an assessment of the
    benefits to NIST of hosting Research Associates; and an assessment of benefits
    of the program to the broader scientific and engineering community.


    2\. **NIST should conduct an evaluation of outreach efforts.**


    a. Additional analysis could be undertaken on how applicants hear about the program
    (e.g., focusing on the “Other” category).


    b. Additional data could be collected from NIST personnel and former or current
    NIST Research Associates. Such data could be used to answer such questions as
    how NIST personnel and Research Associates interact with potential applicants
    and which mechanisms seem to work best.


    c. A second step to facilitate an evaluation of outreach efforts is to identify
    metrics for quantifying value obtained from different outreach strategies.


    d. Examine individual outreach strategies for return on investment.


    e. Finally, consider whether there might be other outreach strategies that are
    being underused currently, and which might have potential value, such as direct
    mail to deans, department heads and other university administrators.


    3\. **NIST should conduct an evaluation of individuals who decline offers of research
    associateships.** This could be done as a telephone interview or via a survey.
    Two basic questions should be asked of those who are awarded but decline: (1)
    why are you declining, and (2) what are you planning to do instead?


    4\. **The NRC should amend the application form.** The list of fields should be
    reduced, in particular by collapsing very similar labels and by removing labels
    that are for multiple fields.


    5\. **The NRC should update the DataRAP database to replace organizational names
    (e.g., institutes or labs) that no longer exist at NIST with current equivalents.**


    6\. **NIST should conduct a more thorough assessment of Research Associates’ experiences
    during the postdoctoral appointment, their satisfaction with and views on the
    benefits of the program, and NIST staff’s satisfaction with and views on the benefits
    of the program.**


    a. To assist in this, the NRC should redesign the final report and the Research
    Advisor’s evaluation form to maximize the collection of data from these instruments.


    b. The final report and the Research Advisor’s evaluation should be made mandatory.


    c. Some elements of the current data collected could be subjected to further analysis.


    i. NIST may wish to conduct further analysis on peer-reviewed journals.


    ii. NIST may wish to conduct an impact analysis of Research Associates’ productivity.


    iii. NIST may wish to conduct a more thorough review of their support of Research
    Associates, asking how familiar they are with NIST administrative offices, how
    often they turn to those offices for help, and for what reasons.


    d. NIST could also conduct a social network analysis of the collaboration of the
    Research Associates (or of NIST employees) to see how the Research Associateship
    Program facilitates new or wider collaboration among scientists and engineers.


    e. When data allow, NIST could consider disaggregating productivity and satisfaction
    measures for Research Associates by lab, gender, and race/ethnicity.'
