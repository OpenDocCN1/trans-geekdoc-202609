- raw: "Postdoctoral appointments can provide benefits both to the recipients and\
    \ the employers. For postdocs, the position is a way to obtain further training.\
    \ Postdoctoral appointments in federal labs or industry can be an entrée into\
    \ non-academic careers. Concerning the impact on the employer, one report notes\
    \ that “As a whole, the postdoctoral population has become indispensable to the\
    \ science and engineering enterprise, performing a substantial portion of the\
    \ nation’s research in every setting. For example, a survey of research articles\
    \ in two recent issues of *Science* found that 43 percent of the first authors\
    \ were postdocs.[^(33)](../Text/ch011.xhtml#p200138f5ftt00033) In many labs, postdocs\
    \ also educate, train, and supervise junior members, help write grant proposals\
    \ and papers, and present the laboratory’s research results at professional society\
    \ meetings” (NAS/NAE/IOM, 2000:10). However, it is important to note that there\
    \ have been some complaints about the situation for postdocs.\n\n|  ||  ^(33)\
    \ Vogel, G. *Science*, 1999, Vol. 285, p. 1531. |\n\n| --- | --- |\n\nAccording\
    \ to the NSF, in 2005 there were approximately 35,000 postdocs in academia, across\
    \ all science and engineering fields broadly defined (NSF, 2007). However, there\
    \ are differences by field. “In some fields, such as computer science and engineering,\
    \ there is relatively little incentive to pursue a postdoc—or even a Ph.D.—because\
    \ rewarding jobs are available at the bachelor’s and master’s levels. In other\
    \ fields, such as biology and physics, a postdoc is virtually mandatory, especially\
    \ for academic employment” (NAS/NAE/IOM, 2000:14). [Table 2-1](../Text/ch011.xhtml#p200138f5ttt00003)\
    \ gives a field breakdown for number of postdoctoral appointees, while [Table\
    \ 2-2](../Text/ch011.xhtml#p200138f5ttt00004) lists the percentage of doctoral\
    \ recipients with definite plans to pursue postdoctoral study or research by field.\
    \  \n\n ![](Images/t200138f5_3.png) \n\nTABLE 2-2 Percent of Doctoral Recipients\
    \ with Definite Commitments Who Plan Postdoctoral Study or Research, by Broad\
    \ Field of Study, 1982 and 2002\n\n|  Field of Study ||  1982 ||  2002 |\n\n|\
    \ :-: | :-: | :-: |\n\n| Biological sciences ||  72.1 ||  74.4 |\n\n| Physics/astronomy\
    \ ||  48.8 ||  66.7 |\n\n| Chemistry ||  39.8 ||  52.9 |\n\n| Earth, atmospheric,\
    \ ocean sciences ||  25.9 ||  51.6 |\n\n| Mathematics ||  15.8 ||  42.5 |\n\n\
    | Agricultural sciences ||  15.9 ||  38.3 |\n\n| Engineering ||  11.4 ||  24.8\
    \ |\n\n| Health sciences ||  15.4 ||  21.1 |\n\n| Computer sciences ||  9.1 ||\
    \  19.7 |\n\n| Source: NSF/NIH/USED/NEH/USDA/NASA, Survey of Earned Doctorates,\
    \ in Hill et al., 2004: Figure 1. |\n\nAs there are differences by field, so too\
    \ do postdocs vary by demographic characteristics. Based on the Sigma Xi survey\
    \ of postdocs, the following conclusions are noted:\n\n• The majority of postdocs\
    \ in the life and health sciences, in the physical sciences, and in engineering\
    \ are men. Men also comprise the majority of postdocs who are temporary-visa holders.\n\
    \n• About 75 percent of citizen and permanent resident postdocs identified themselves\
    \ as white.\n\n• The majority of postdocs responding to the survey held temporary\
    \ visas. 40 percent were U.S. citizens and 6 percent were permanent residents.\n\
    \n• The majority of postdocs were between 30 and 35 years old; 69 percent were\
    \ married or otherwise partnered; and about a third had children (Davis, 2005).[^(34)](../Text/ch011.xhtml#p200138f5ftt00034)\
    \ \n\n|  ||  ^(34) It is difficult to know how generalizable the results of this\
    \ survey are: the percentages are based on a 34 percent response rate and from\
    \ postdocs at select institutions. Nonresponse bias may have affected the survey\
    \ estimates. |\n\n| --- | --- |\n\n## **THE SELECTION PROCESS**\n\nThe process\
    \ by which applicants apply and are selected to become NIST/NRC RAs can be summarized\
    \ in a few basic steps:\n\n• Potential applicants hear about the NIST/NRC RAPs\n\
    \n• Applicants apply to the Program\n\n• Applications are reviewed by expert panels\
    \ overseen by the NRC’s Fellowships Office. Each applicant receives a rating based\
    \ on the average scores of three reviewers (possibly two more if the scores are\
    \ disparate (differ by 1.5 points between highest and lowest score)\n\n• The Fellowships\
    \ Office forwards ranked (highest to lowest rated) applicants on to NIST\n\n•\
    \ Partly on the basis of those rankings, NIST offers selected applicants postdoctoral\
    \ positions\n\n• Most of those who receive offers accept and become research associates\n\
    \nThere are a number of ways to publicize postdoctoral positions. Both the National\
    \ Academies and NIST have links to the program on their respective websites.[^(35)](../Text/ch011.xhtml#p200138f5ftt00035)\
    \ Staff from the National Academies attend conferences where they make information\
    \ on the program available. Advertisements are also placed in relevant publications,\
    \ such as *Physics Today*, *Science*, and the *Chronicle of Higher Education*.\n\
    \n|  ||  ^(35) The National Academies, “RAP Home,” available at: [http://www7.nationalacademies.org/rap/](http://www7.nationalacademies.org/rap/)\
    \ and NIST, “NIST Postdoctoral Research Associateships Program,” available at:\
    \ [http://www.nist.gov/oiaa/postdoc.htm](http://www.nist.gov/oiaa/postdoc.htm).\
    \ |\n\n| --- | --- |\n\nOnce prospective applicants hear about the program, the\
    \ next step is to complete an application (see [Appendix D](../Text/ch019.xhtml#p200138f5ddd00068)).\
    \ Noteworthy information collected by the application includes:\n\n• Educational\
    \ background\n\n• Demographic data (e.g., citizenship, gender, date of birth,\
    \ race/ethnicity, marital status)\n\n• How the applicant heard about the program\n\
    \n• Previous research and publications\n\n• A research proposal intended to be\
    \ carried out during the postdoctoral tenure\n\nApplicants also have recommendations\
    \ submitted on their behalf. In addition, the proposed research advisor at the\
    \ laboratory/center also reviews the applicant’s proposed research project.\n\n\
    Completed applications are collected by the National Academies. This is followed\
    \ by a review process, as described on the National Academies’ Web site “Review\
    \ Criteria” (see [Box 2-1](../Text/ch011.xhtml#p200138f5bbb00025)).[^(36)](../Text/ch011.xhtml#p200138f5ftt00036)\
    \  \n\n|  ||  ^(36) The National Academies, “Review Criteria,” available at: [http://www7.nationalacademies.org/rap/Review\\\
    _Criteria.html](http://www7.nationalacademies.org/rap/Review_Criteria.html). |\n\
    \n| --- | --- |\n\n**Box 2-1** **Review Criteria**\n\nApplications for awards\
    \ from the NRC Research Associateship Programs are reviewed by panels of experts\
    \ in 6 broad discipline areas: Chemistry; Earth and Atmospheric Sciences; Engineering,\
    \ Applied Sciences and Mathematics; Life Sciences; Physics; and Space Sciences.\
    \ Each application is read by a minimum of 3 panelists. Panelists assess the quality\
    \ of an application, the likelihood for success and the contribution of the research\
    \ to the mission of the sponsoring federal laboratory. Postdoctoral applicants\
    \ are evaluated on the basis of demonstrated ability as a student and on their\
    \ potential for making contributions as an independent scientist. Senior applicants,\
    \ including applicants to Summer Faculty programs, are evaluated on the basis\
    \ of proven ability and demonstrated research accomplishments. Evaluations are\
    \ made without regard to age, sex, marital status, national origin, creed, racial\
    \ group, or ethnic group.\n\nEach application is assigned a numerical score and\
    \ the applicant’s final score is an average of all reviews. Scoring is on a 10-point\
    \ scale and only applicants scoring 7.5 or above are considered for awards. Sponsoring\
    \ laboratories offer awards to the highest scoring applicants first and continue\
    \ to make awards until available slots are filled. In the review process each\
    \ applicant is evaluated on four major elements with the approximate weighting\
    \ as indicated:\n\n**Scientific merit of the proposed research (40%)**"
