    \ RAP` applicants and awardees are more likely to be single. They are more likely\
    \ to have `Ph.D.s` in the physical sciences than biological. The majority of awards\
    \ go to doctorates from the physical sciences. But, because there are so many\
    \ applications from this discipline, only about one in five applicants with this\
    \ background receive awards.\n\nPreliminary analysis suggests that labs receive\
    \ different amounts of applications and awards are not made uniformly across different\
    \ labs. Some awardees do decline `NIST/NRC Research Associateships`, though the\
    \ percentage of declined offers is often lower than that for the other `RAPs`\
    \ and has declined over time.\n\nTurning now to an assessment of the experiences\
    \ of Research Associates, currently available data do not allow for a program\
    \ evaluation of immediate outcomes of the Program. Little data are collected on\
    \ Research Associates’ experiences or on research advisors’ evaluation of `RAs`.\
    \ Data are also not collected on the value of the program to `NIST` or to the\
    \ broader scientific and engineering community.\n\nSecond, with the caveat that\
    \ this conclusion is based on very limited data that may be biased by nonresponse,\
    \ `NIST/NRC RAs` are as productive as `RAs` in other Programs. `NIST/NRC RAs`\
    \ statistically were more likely to receive an award or give domestic presentations\
    \ than `RAs` in other Programs. Conversely, they published fewer journal articles.\
    \ However, while these differences were statistically significant, they were not\
    \ substantively large. `NIST/NRC RAs` patent or give international presentations\
    \ comparably with `RAs` in other Programs. Finally, and subject to the same caveat,\
    \ `RAs` are quite satisfied with the Program. On a scale of 1 to 10, with 10 being\
    \ excellent, `NIST/NRC RAs` rated short-term and long-term value of the program;\
    \ lab, advisor, administrative (`NIST` and `NRC`) support between 7.7 and 8.5.\
    \ In half the categories `NIST/NRC RAs` and Research Asssociates in other programs\
    \ reported statistically similar levels of satisfaction. In the other half, other\
    \ `RAs` reported higher levels of satisfaction.\n\nFinally, looking at the careers\
    \ of former `RAs`, preliminary evidence—which is quite limited—suggests that `RAs`\
    \ contribute to the pool of qualified applicants to permanent positions at `NIST`.\
    \ About 45 percent of `RAs` reported that their immediate post-tenure position\
    \ was at `NIST` as a permanent, temporary, or contract employee after their appointment—a\
    \ higher percentage than `RAs` at other federal agencies. A survey of former `RAs`\
    \ found that a higher percentage of former `NIST/NRC RAs` stayed at `NIST` than\
    \ `RAs` at other federal agencies stayed at their host agency (37.6 to 28.1 percent).\
    \ Second, evidence on the outcomes of the Program is largely lacking. Little data\
    \ are collected on the career outcomes of former `RAs`; and the value of the program\
    \ to `NIST` or to the broader scientific and engineering community.\n\n## RECOMMENDATIONS\n\
    \n1. **NIST should conduct a more thorough evaluation of the NIST/NRC Research\
    \ Associateship Program.**\n\n   a. As a first step, `NIST` and the `NRC` should\
    \ review specific goals of the program.\n\n   b. The evaluation should include\
    \ the following components: an assessment of outreach to potential applicants;\
    \ an assessment of individuals who decline to accept a Research Associate position;\
    \ an assessment of the benefits of the program on the RAs after they complete\
    \ their appointments; an assessment of the benefits to NIST of hosting RAs; and\
    \ an assessment of benefits of the Program to the broader scientific and engineering\
    \ community.\n\n2. **NIST should conduct an evaluation of outreach efforts.**\n\
    \n   a. To conduct such an evaluation, data need to be collected. In this regard,\
    \ the question on the application about how applicants hear about the program\
    \ is helpful and should be retained. However, the “Other” category should be further\
    \ analyzed and a choice of “Website” should be added as a category.\n\n   b. Additional\
    \ data could be collected from NIST personnel and former or current `RAs`. Such\
    \ data could be used to answer such questions as:\n\n      i. What mechanisms\
    \ do NIST personnel and RAs use to interact with potential applicants and\n\n\
    \      ii. Which mechanisms seem to work best?\n\n      iii. Has there been any\
    \ effort to focus specifically on diversity? How?\n\n      Such research could\
    \ be undertaken via a combination of expert panels or surveys of NIST staff and\
    \ current or former `RAs` to answer the first and third questions and to provide\
    \ information for an assessment of the second question. Information should also\
    \ be collected on the costs for individual outreach efforts (e.g., money spent\
    \ on advertisements, time spent meeting with graduates) to compare to the benefits\
    \ (how many applicants come from each individual outreach type).\n\n   c. A second\
    \ step to facilitate an evaluation of outreach efforts is to identify metrics\
    \ for quantifying value obtained from different outreach strategies, such as hits\
    \ to the website or number of graduate students met with at professional meetings.\n"
  trans: "\n\ne. 如果你可以对程序进行改进，你会做出哪些改进？\n\n# 5\n\n# 初步结果与建议\n\n## 初步结果\n\n报告的总体结论是，支持对\
    \ `NIST/NRC RAP` 进行全面评估的部分数据目前尚未被收集。虽然收集了一些数据，但填写表格的 `RAs`（研究助理）和顾问人数仍然较少，这可能意味着基于那些填写表格的人员所提供的信息的结果不能代表所有的\
    \ `RAs` 或所有的顾问。因此，在阅读结果时必须保持谨慎。在牢记这些前提的情况下，仍有许多有趣的发现。\n\n首先考察申请者，申请表是一个非常实用的数据收集工具。在目前的三个工具——**申请表、最终报告、导师评估**中，申请表产生的数据最多。此外，个人沟通是申请者获知\
    \ `RAPs`（包括 `NIST/NRC RAP`）最可能的途径。关于申请者如何获知该计划的发现发现如下：\n\n-   `NIST/NRC RAP` 的申请者比申请其他\
    \ `RAPs` 的申请者有两倍可能最初通过他们的 `Ph.D.` 导师或其他教授获知该职位；通过同事或研究生同学获知该计划的可能性也稍高，但通过联邦实验室的研究型导师或其他科学人员获知该计划的可能性则较低。\n\
    \n-   `NIST/NRC RAP` 申请者最常见的信息来源是教授或同事。\n\n-   男性和女性申请者获知 `NIST/NRC RAP` 的途径相似，但通过专业会议的陈述除外，女性提到该途径的频率是男性的两倍。\n\
    \n-   `NIST/NRC RAP` 申请者获知该计划的方式在种族/民族上没有差异。\n\n外展工作产生的合格申请者多于 `NIST` 为 `RAs`\
    \ 提供的空额；申请人池包含了许多来自顶尖研究机构的人员，且多样性日益增加。总体而言，22% 的申请者获得了任命——这一比例低于其他地方的 `RAPs`。女性越来越多地申请\
    \ `NIST/NRC RAP` 并被授予研究助理职位。对于女性来说，`NIST/NRC RAP` 似乎与其他的 `RAPs` 一样受欢迎。少数族裔也越来越多地申请\
    \ `NIST/NRC RAP` 并获得研究助理职位。对于 `NIST/NRC RAP` 的申请者和获得奖励者，至少有一半来自美国排名前 20 的博士学位授予机构。\n\
    \n`NIST/NRC RAP` 的申请者和获得奖励者与其他 `RAPs` 的对应者不同。自 1990 年以来，少数族裔获得 `NIST/NRC Research\
    \ Associateship` 的比例高于获得其他研究助理职位的比例。`NIST/NRC RAP` 的申请者和获得奖励者平均比申请其他计划的人更年轻。`NIST/NRC\
    \ RAP` 的申请者和获得奖励者更有可能是单身。他们更有可能拥有物理科学的 `Ph.D.s` 而非生物科学。大多数奖项授予了物理科学的博士。但由于该学科的申请非常多，具有此类背景的申请者中只有约五分之一的人获得了奖励。\n\
    \n初步分析表明，各实验室收到的申请数量不同，且奖项在不同实验室之间并非统一分配的。一些获得奖励者拒绝了 `NIST/NRC Research Associateships`，尽管拒绝提议的比例通常低于其他\
    \ `RAPs`，并且随着时间的推移而下降。\n\n现在转向对研究助理经历的评估，目前可用的数据尚不允许对该计划的直接成果进行计划评估。关于研究助理的经历或研究导师对\
    \ `RAs` 的评估收集的数据很少。也没有收集关于该计划对 `NIST` 或更广泛的科学与工程社区价值的数据。\n\n其次，尽管这一结论是基于可能因无响应而产生偏差的有限数据，但\
    \ `NIST/NRC RAs` 的产出与其他计划中的 `RAs` 相当。从统计上讲，`NIST/NRC RAs` 获得奖励或进行国内陈述的可能性高于其他计划中的\
    \ `RAs`。相反，他们发表的期刊文章较少。然而，虽然这些差异在统计上是显著的，但在实质上并不大。`NIST/NRC RAs` 在获得专利或进行国际陈述方面与其他计划的\
    \ `RAs` 相当。最后，在具有相同前提下，`RAs` 对该计划非常满意。在 1 到 10 分的评分标准上（10 分为优秀），`NIST/NRC RAs`\
    \ 对计划的短期和长期价值、实验室、导师、行政（`NIST` 和 `NRC`）的支持评分在 7.7 到 8.5 之间。在一半的类别中，`NIST/NRC RAs`\
    \ 与其他计划中的研究助理报告的满意度统计相似。在另一一半中，其他 `RAs` 报告了更高的满意度。\n\n最后，观察前 `RAs` 的职业，初步证据（非常有限）表明\
    \ `RAs` 为 `NIST` 永久职位的合格申请人池做出了贡献。约 45% 的 `RAs` 报告说他们在任命后的直接任职是在 `NIST` 担任永久、临时或合同员工——这一比例高于其他联邦机构的\
    \ `RAs`。对前 `RAs` 的调查发现，高比例的前 `NIST/NRC RAs` 留在 `NIST`，高于其他联邦机构的 `RAs` 留在其所在机构的比例（37.6%\
    \ 对 28.1%）。其次，关于计划结果的证据很大程度上缺失。关于前 `RAs` 的职业结果收集的数据很少；关于计划对 `NIST` 或更广泛的科学与工程社区价值的数据也没有。\n\
    \n## 建议\n\n1. **NIST 应对 NIST/NRC 研究助理计划进行更彻底的评估。**\n\n   a. 作为第一步，`NIST` 和 `NRC`\
    \ 应审查该计划的具体目标。\n\n   b. 评估应包括以下部分：对潜在申请者的外展评估；对拒绝接受研究助理职位人员的评估；该计划在 RAs 完成任命后对其收益的评估；`NIST`\
    \ 托管 RAs 的收益评估；以及该计划对更广泛的科学与工程社区的收益评估。\n\n2. **NIST 应对外展工作进行评估。**\n\n   a. 为了进行此类评估，需要收集数据。在这方面，申请表中关于申请者如何获知该计划的问题很有帮助并应该保留。然而，应对对“其他”类别进行进一步分析，并增加“网站”作为一个类别。\n\
    \n   b. 可以从 `NIST` 人员以及现任 `RAs` 处收集额外数据。这些数据可回答以下问题：\n\n      i. `NIST` 人员和 RAs\
    \ 使用什么机制与潜在申请者进行互动？\n\n      ii. 哪些机制似乎最有效？\n\n      iii. 是否有专门针对多样性的努力？是如何做的？\n\
    \n      此类研究可以通过专家小组或对 `NIST` 员工及现任或前 `RAs` 的调查来进行，以回答第一个和第三个问题，并为第二个问题的评估提供信息。还应该收集个人外展工作的成本（例如花在广告上的费用、与毕业生会面的时间），以便与收益进行比较（每种外展类型带来了多少申请者）。\n\
    \n   c. 促进外展工作工作的第二步是确定量化从不同外展策略中获得价值的指标，例如网站访问量或在专业会议上会见的研究生人数。\n\n"
