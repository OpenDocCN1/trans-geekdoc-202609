- raw: 'In comparing NIST/NRC RA applicants to others who have recently received doctorates,
    one source of information is the NSF’s Survey of Earned Doctorates (SED), which
    began in 1957-1958 to collect data annually on the number and characteristics
    of individuals receiving research doctoral degrees from all accredited U.S. institutions.[^(21)](../Text/ch010.xhtml#p200138f5ftt00021)
    All individuals, as they receive their research doctorate, are asked to complete
    the survey. The SED collects information on the individual’s education, characteristics,
    and postgraduation plans. Selected variables include:


    |  ||  ^(21) For more information, see: “SRS Survey of Earned Doctorates,” available
    at: [http://www.nsf.gov/statistics/showsrvy.cfm?srvy\_CatID=2&srvy\_Seri=1](http://www.nsf.gov/statistics/showsrvy.cfm?srvy_CatID=2&srvy_Seri=1).
    \[Accessed June 24, 2007.\] |


    | --- | --- |


    • Academic institution of doctorate


    • Birth year


    • Citizenship status at graduation


    • Country of birth and citizenship


    • Field of degrees (N = 279)


    • Marital status, number/age of dependents


    • Postgraduation plans (work, postdoc, other study/training)


    • Primary and secondary work activities


    • Source and type of financial support for postdoctoral study/research


    • Type and location of employer


    • Race and Hispanic ethnicity (for selected sub-groups)


    • Sex[^(22)](../Text/ch010.xhtml#p200138f5ftt00022)


    |  ||  ^(22) The NSF uses the term “sex” instead of “gender.” In this report,
    the terms “sex” and “gender” are used synonymously. |


    | --- | --- |


    The survey has a greater than 90 percent response rate. Trend data are available
    back to 1957-1958. Partial data are available for the period 1920-1956.


    Data on characteristics of those awarded research associates and their experiences
    during the postdoctoral appointment come primarily from two sources: the post-tenure
    survey given to research associates by the Fellowships Office and the NSF’s Survey
    of Doctoral Recipients.


    This information is supplemented by one-time surveys of postdocs conducted by
    The National Academies and by Sigma Xi.[^(23)](../Text/ch010.xhtml#p200138f5ftt00023)
    Finally, the NSF’s Survey of Graduate Students and Postdoctorates in Science and
    Engineering is also a potential resource.


    |  ||  ^(23) Sigma Xi is “an international, multidisciplinary research society
    whose programs and activities promote the health of the scientific enterprise
    and honor scientific achievement. There are nearly 60,000 Sigma Xi members in
    more than 100 countries around the world. Sigma Xi chapters, more than 500 in
    all, can be found at colleges and universities, industrial research centers and
    government laboratories.” From “About Sigma Xi,” available at: [http://www.sigmaxi.org/about/overview/index.shtml](http://www.sigmaxi.org/about/overview/index.shtml).
    |


    | --- | --- |


    The Fellowships Office conducts a post-tenure exit survey with individual research
    associates as they complete their postdoctoral appointment. The survey consists
    of a written questionnaire, and while nominally required, many postdocs do not
    fill it out. In addition, an evaluation form is requested of the research associates’
    advisors. Key variables from these two evaluations:


    • Assessment of the research associate on innovative thinking, knowledge of field,
    motivation/initiative, overall science ability, independent research, and research
    technique;


    • Productivity during postdoctoral tenure, including: number of domestic and international
    presentations given, number of peer-reviewed journal articles, number of patents
    applied for, and number of awards received;


    • Research associate’ views of the program, including: quality of mentoring from
    the Lab NRC Advisor, quality of laboratory support (e.g., equipment), how the
    National Academies Associateship award affected your career to date, quality of
    administrative support from the Laboratory, development of knowledge, skills,
    and research productivity, and evaluation of advisor (open ended); and


    • Future plans, including: future plans of the research associate, level of post
    tenure position, organization with whom post-tenure associate will be affiliated,
    and title of post tenure position.


    The principal source for information on postdocs in general—particularly outside
    academia—is the NSF’s Survey of Doctoral Recipients (SDR).[^(24)](../Text/ch010.xhtml#p200138f5ftt00024)
    The SDR collects information from individuals who have obtained a doctoral degree
    in a science, engineering, or health field. The SDR is biennial, and data are
    available for 1973-2003.[^(25)](../Text/ch010.xhtml#p200138f5ftt00025) The SDR
    is a longitudinal survey that follows recipients of research doctorates from U.S.
    institutions, who were living in the United States during the survey reference
    week, and who are under age 76.


    |  ||  ^(24) For more information on the SDR, see: “SRS Survey of Doctoral Recipients”
    available at [http://www.nsf.gov/statistics/showsrvy.cfm?srvy\_CatID=3&srvy\_Seri=5](http://www.nsf.gov/statistics/showsrvy.cfm?srvy_CatID=3&srvy_Seri=5).
    \[Accessed June 24, 2007.\] |


    | --- | --- |


    |  ||  ^(25) The next SDR will cover 2006 and future surveys are expected to switch
    to even-numbered years. |


    | --- | --- |


    Using postdoctoral status as a starting point, a number of potential relevant
    variables can be assessed. Selected variables include:


    • Citizenship status


    • Country of birth


    • Country of citizenship


    • Date of birth


    • Educational history (for each degree held: field, level, institution, when received)


    • Employment status (unemployed, employed part time, or employed full time)


    • Geographic place of employment


    • Marital status


    • Number of children


    • Occupation (current or past job)


    • Primary work activity (e.g., teaching, basic research, etc.)


    • Postdoctorate status


    • Publication and patent activities


    • Race/ethnicity


    • Salary


    • Satisfaction and importance of various aspects of job


    • Sector of employment (e.g., academia, industry, government, etc.)


    • Sex


    As noted by the NSF: “There have been a number of changes in the definition of
    the population surveyed over time. For example, prior to 1991, the survey included
    some individuals who had received doctoral degrees in fields outside of S&E or
    had received their degrees from non-U.S. universities. Because coverage of these
    individuals had declined over time, the decision was made to delete them beginning
    with the 1991 survey. Survey improvements made in 1993 are sufficiently great
    that SRS staff suggest that trend analyses between the data from the surveys after
    1991 and the surveys in prior years must be performed very cautiously, if at all.”[^(26)](../Text/ch010.xhtml#p200138f5ftt00026)
    A more limiting factor for the committee was that the survey merely asks respondents
    if they are currently in a postdoctoral position—but does not specify how long.
    Therefore, some respondents could be just starting a postdoctoral appointment
    (probably their first, but not necessarily) while others could be in the first,
    second, or third year of a position. This makes it difficult to compare the experiences
    of postdocs identified in the survey with research associates.


    |  ||  ^(26) “SRS Survey of Doctoral Recipients” available at [http://www.nsf.gov/statistics/showsrvy.cfm?srvy\_CatID=3&srvy\_Seri=5](http://www.nsf.gov/statistics/showsrvy.cfm?srvy_CatID=3&srvy_Seri=5).
    \[Accessed June 24, 2007.\] |


    | --- | --- |'
