    be eligible to apply for an associateship there.


    > ^(14) Prior affiliation includes direct full-time employment relationships either
    with the laboratory or with a contractor whose work is performed there. A long-term
    consulting relationship usually makes an applicant ineligible.


    Reapplication is possible. Persons who have previously held an associateship may
    apply for another award only if a period of at least two years will have elapsed
    between termination of the first award and the proposed tenure of a second. Persons
    who have previously applied for an associateship, but who were not recommended
    for an award by the panels, may reapply after one year. Candidates who were recommended
    for an award by the panels, but who were not offered an award because of funding
    or other limitations, may reapply at any time without a mandatory waiting period.


    The program arose from humble beginnings: “In 1954, when the U.S. Civil Commission
    [now the Office of Personnel Management] granted the postdocs status as two-year
    term federal employees, 21 scientists applied for the first competition, and NIST
    made six awards, paying $5,940 each. By 2004, the number of postdocs who may be
    hired annually is capped at 60 (Curry, 2004).” To date there have been over 6,000
    applications to the NIST/NRC RAP and over 1,000 Research Associateships have been
    awarded.


    ## THE ROLE OF THE NATIONAL ACADEMIES


    The National Research Council—via its Fellowships Office—conducts the Research
    Associateship Programs in cooperation with sponsoring federal laboratories and
    research organizations approved for participation. The Fellowships Office conducts
    a national competition to recommend and make awards (except NIST, which makes
    its own awards) to outstanding scientists and engineers at the postdoctoral level
    for tenure as guest researchers at participating laboratories.


    > ^(15) Material in this section was adapted from the NRC RAP website, “Associateship
    Programs at NIST,” available at: [http://qdev.nist.gov/817.03/jobs/nrc_local.html](http://qdev.nist.gov/817.03/jobs/nrc_local.html).
    [Accessed June 24, 2007].


    The Associateship Programs office receives all application materials and supporting
    documents and conducts the competitive evaluation of applications. This evaluation
    for NIST/NRC Research Associates (`NIST/NRC RAs) is conducted by special panels
    convened for this purpose. Panelists are chosen to review applications on the
    basis of the applicants’ stature and experience in the fields of science and engineering,
    and their evaluation becomes the basis from which awards are offered by NIST.
    Final ranking in order of quality and the recommendation of applicants for awards
    are the exclusive prerogatives of the panels. Candidates for awards are selected
    by NIST from the panel’s recommended list. NIST makes award offers throughout
    the spring and fall.


    ## THE COMMITTEE’S CHARGE


    The National Academies appointed an ad hoc committee to prepare this report (`Appendix
    A`). The committee’s charge:

