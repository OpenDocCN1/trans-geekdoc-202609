    # 1 Executive Summary


    ## Executive Summary


    The Research Associateship Program (RAP) of the National Institute of Standards
    and Technology (NIST), hereafter `NIST/NRC`, was started in 1954 to provide an
    opportunity for outstanding scientists and engineers. The committee was appointed
    by the National Research Council (NRC) to evaluate the program.


    The committee’s specific charge is presented below:


    1. Is NIST attracting the “best and the brightest” to RAP?

    2. What is the impact of the program on Research Associates, NIST, and scientific
    fields?


    To meet its charge, the committee focused on three objectives:

    1. To describe characteristics of applicants to the program;

    2. To describe the experiences of Research Associates at NIST and other federal
    agencies;

    3. To offer suggestions for more in-depth assessment of the careers of Research
    Associates.


    Multiple sources of information were identified and used in preparing this report.
    The primary source of information was data collected by the NRC’s Fellowships
    Office, including application data, data from final reports prepared by the Research
    Associates, and a directory of past Research Associates. In addition, the committee
    collected original data from three expert panels. In general, however, the data
    were inadequate to draw definitive conclusions.


    This report is divided into five chapters:

    * [Chapter One](../Text/ch010.xhtml#p200138f5ddd0015) describes the program and
    the approach and scope of the study.

    * [Chapter Two](../Text/ch011.xhtml#p200138f5ddd0023) examines applicants to the
    NIST/NRC RAP and compares them to applicants to other Research Associateship Programs.
    It also examines applications and awards disaggregated across several dimensions,
    such as gender or doctoral-granting institution.

    * [Chapter Three](../Text/ch012.xhtml#p200138f5ddd00041) examines the experiences
    of NIST/NRC Research Associates and Research Associates at other federal agencies,
    as well as Research Associates’ views on the value of the program they participated
    in.

    * [Chapter Four](../Text/ch013.xhtml#p200138f5ddd00057) examines the careers of
    former Research Associates.

    * [Chapter Five](../Text/ch014.xhtml#p200138f5ddd00061) presents an overall summary
    of preliminary results and recommendations.


    Given the limited data, the committee could not provide a full assessment of the
    program. In addition, the committee determined to offer recommendations where
    appropriate regarding data collection on applicants to the Program; on the experiences
    of current and former Research Associates; and on the views of Research Associates
    and NIST towards the value of the program. Given the available data, the committee
    could not provide a full assessment of the impact of the program[2](../Text/ch009.xhtml#p200138f5ftt0002)

    '
