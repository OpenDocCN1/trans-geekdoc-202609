- raw: 'e. If you could make improvements to the program what would they be?


    # **5**


    # **Preliminary Results and Recommendations**


    ## **PRELIMINARY RESULTS**


    An overall conclusion of the report is that some of the data that would support
    a full-fledged evaluation of the NIST/NRC RAP are simply not collected at this
    time. Some data are collected, but the number of RAs and advisers filling out
    the forms remain small, which may mean that the results based on information provided
    by those who did fill out the form are not representative of all RAs or all advisers.
    Thus caution must be exercised in reading the results. With those caveats firmly
    in mind, there are a number of interesting findings.


    Turning first to examine applicants, the application form is a very useful data
    collection instrument. Among the three current instruments—application form, final
    report, adviser’s evaluation—the application form has produced the most data.
    Further, personal communication is the most likely means by which applicants hear
    about the RAPs, including the NIST/NRC RAP. Key findings regarding how applicants
    heard about the program were:


    • Applicants to the NIST/NRC RAP were twice as likely as applicants to the other
    RAPs to hear about the position initially from their Ph.D. advisor or other professor
    and somewhat more likely to hear about the program from colleagues or fellow graduate
    students, but less likely to hear about the program from a research advisor or
    other scientific staff at the federal laboratory.


    • The most common sources of information for applicants to the NIST/NRC RAP were
    professors or colleagues.


    • Male and female applicants heard about the NIST/NRC RAP similarly, except via
    presentations at professional meetings, which women cited twice as often as men.


    • There were no differences by race/ethnicity in how applicants to the NIST/NRC
    RAP heard about it.


    Outreach efforts produce more qualified applicants than NIST has slots to fill
    for RAs; and the pool of applicants includes many from top research institutions
    and is increasingly diverse. Overall, 22 percent of applicants were awarded an
    appointment—a lower ratio than for RAPs elsewhere. Women are increasingly applying
    to the NIST/NRC RAP and being awarded research associateships. The NIST/NRC RAP
    seems to be as popular as the other RAPs for women. Underrepresented minorities
    are increasingly applying to the NIST/NRC RAP and being awarded research associateships.
    For applicants to the NIST/NRC RAP and awardees, at least half came from 20 of
    the top doctoral-granting institutions in the United States.


    Applicants and awardees to the NIST/NRC RAP differ from their counterparts in
    the other RAPs. Since 1990, underrepresented minorities are proportionately more
    likely to be awarded a NIST/NRC Research Associateship than another research associateship.
    Applicants to, and awardees of the NIST/NRC RAP are younger on average than those
    who apply for the other programs. NIST/NRC RAP applicants and awardees are more
    likely to be single. They are more likely to have Ph.D.s in the physical sciences
    than biological. The majority of awards go to  doctorates from the physical sciences.
    But, because there are so many applications from this discipline, only about one
    in five applicants with this background receive awards.


    Preliminary analysis suggests that labs receive different amounts of applications
    and awards are not made uniformly across different labs. Some awardees do decline
    NIST/NRC Research Associateships, though the percentage of declined offers is
    often lower than that for the other RAPs and has declined over time.


    Turning now to an assessment of the experiences of Research Associates, currently
    available data do not allow for a program evaluation of immediate outcomes of
    the Program. Little data are collected on Research Associates’ experiences or
    on research advisors’ evaluation of RAs. Data are also not collected on the value
    of the program to NIST or to the broader scientific and engineering community.


    Second, with the caveat that this conclusion is based on very limited data that
    may be biased by nonresponse, NIST/NRC RAs are as productive as RAs in other Programs.
    NIST/NRC RAs statistically were more likely to receive an award or give domestic
    presentations than RAs in other Programs. Conversely, they published fewer journal
    articles. However, while these differences were statistically significant, they
    were not substantively large. NIST/NRC RAs patent or give international presentations
    comparably with RAs in other Programs. Finally, and subject to the same caveat,
    RAs are quite satisfied with the Program. On a scale of 1 to 10, with 10 being
    excellent, NIST/NRC RAs rated short-term and long-term value of the program; lab,
    advisor, administrative (NIST and NRC) support between 7.7 and 8.5. In half the
    categories NIST/NRC RAs and Research Asssociates in other programs reported statistically
    similar levels of satisfaction. In the other half, other RAs reported higher levels
    of satisfaction.


    Finally, looking at the careers of former RAs, preliminary evidence—which is quite
    limited—suggests that RAs contribute to the pool of qualified applicants to permanent
    positions at NIST. About 45 percent of RAs reported that their immediate post-tenure
    position was at NIST as a permanent, temporary, or contract employee after their
    appointment—a higher percentage than RAs at other federal agencies. A survey of
    former RAs found that a higher percentage of former NIST/NRC RAs stayed at NIST
    than RAs at other federal agencies stayed at their host agency (37.6 to 28.1 percent).
    Second, evidence on the outcomes of the Program is largely lacking. Little data
    are collected on the career outcomes of former RAs; and the value of the program
    to NIST or to the broader scientific and engineering community.


    ## **RECOMMENDATIONS**


    1\. **NIST should conduct a more thorough evaluation of the NIST/NRC Research
    Associateship Program.**


    a. As a first step, NIST and the NRC should review specific goals of the program.


    b. The evaluation should include the following components: an assessment of outreach
    to potential applicants; an assessment of individuals who decline to accept a
    Research Associate position; an assessment of the benefits of the program on the
    RAs after they complete their appointments; an assessment of the benefits to NIST
    of hosting RAs; and an assessment of benefits of the Program to the broader scientific
    and engineering community.


    2\. **NIST should conduct an evaluation of outreach efforts.**


    a. To conduct such an evaluation, data need to be collected. In this regard, the
    question on the application about how applicants hear about the program is  helpful
    and should be retained. However, the “Other” category should be further analyzed
    and a choice of “Website” should be added as a category.


    b. Additional data could be collected from NIST personnel and former or current
    NIST RAs. Such data could be used to answer such questions as:


    i. What mechanisms do NIST personnel and RAs use to interact with potential applicants
    and


    ii. Which mechanisms seem to work best?


    iii. Has there been any effort to focus specifically on diversity? How?


    Such research could be undertaken via a combination of expert panels or surveys
    of NIST staff and current or former RAs to answer the first and third questions
    and to provide information for an assessment of the second question. Information
    should also be collected on the costs for individual outreach efforts (e.g., money
    spent on advertisements, time spent meeting with graduates) to compare to the
    benefits (how many applicants come from each individual outreach type).


    c. A second step to facilitate an evaluation of outreach efforts is to identify
    metrics for quantifying value obtained from different outreach strategies, such
    as hits to the website or number of graduate students met with at professional
    meetings.'
