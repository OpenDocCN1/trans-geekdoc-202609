    # **Appendix A**


    # **COMMITTEE MEMBERS BIOGRAPHICAL INFORMATION**


    Dr. Isaac C. Sanchez (NAE), Chair, is William J. Murray Endowed Chair in Engineering,
    Department of Chemical Engineering at The University of Texas. Dr. Isaac C. Sanchez
    earned his Ph.D. in chemical engineering from the University of Delaware in 1969.
    He joined the faculty of The University of Texas at Austin in 1988. In 1997, he
    was elected to the National Academy of Engineering, the nation’s highest engineering
    honor. Sanchez researches properties of polymer liquids, solutions and blends.
    He attempts to solve problems in polymer science and engineering by studying polymer
    interfacial phenomena, and how changes in temperature, pressure and volume affect
    polymers. Sanchez develops models and uses computer simulations to understand
    polymer solubility and conformation and to understand the role of water in polymer
    processes.


    Dr. Burt S. Barnow is associate director for research and principal research scientist
    at the Institute for Policy Studies of the Johns Hopkins University. Dr. Barnow
    received a B.S. in economics from the Massachusetts Institute of Technology and
    a Ph.D. in economics from the University of Wisconsin at Madison. His work focuses
    on the operation of labor markets and evaluating social programs, and his current
    research includes an evaluation of the welfare-to-work program, an evaluation
    of training programs to train U.S. workers for jobs currently filled with foreign
    workers who come to the United States on an H-1B visa, and an evaluation of New
    Hampshire’s welfare reforms. Dr. Barnow also teaches program evaluation in the
    Institute’s graduate public policy program and labor economics in the Department
    of Economics. Before coming to Johns Hopkins, he was vice president of a consulting
    firm in the Washington, D.C., area. Dr. Barnow served nine years in the Department
    of Labor, most recently as director of the Office of Research and Evaluation for
    the Employment and Training Administration. Dr. Barnow is a member of the Board
    on Higher Education, the Committee for Review of the Title VI and Fulbright-Hays
    International Education Programs, the Committee on Meeting the Workforce Needs
    for the National Vision for Space Exploration, and was a member and Vice-Chair
    of the Committee on Workforce Needs in Information Technology.'
