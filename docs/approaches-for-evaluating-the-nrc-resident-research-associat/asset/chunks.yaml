    “学术竞争力委员会（ACC）为了推进政府的‘美国竞争力倡议’，旨在确保国家在教育计划上进行明智且有效的投资，以实现其科学技术目标。因此，ACC 要求对重要的
    STEM¹⁶ 教育计划进行评估，其中包括 NIST/NRC 博士后研究员计划。在高等教育与劳动力委员会的支持下，一个特别委员会将描述 NIST/NRC 博士后研究员计划的申请者和接收群体，并根据现有信息对
    NIST 博士后学者的职业成果进行描述性分析。在数据允许范围内，还将描述该计划如何应对机构目标。委员会还将概述一种相对于国家科学与技术（S&E）目标、NIST
    机构目标以及该计划对参与者价值的计划评估方法，该评估可以在未来的研究中进行。”


    |  ||  ¹⁶ STEM 是科学、技术、工程和数学。 |

    | --- | --- |


    ## 方法与范围


    为了完成任务，委员会关注了三个目标：


    • 将 NIST/NRC RAP 申请者的特征与新晋科学与工程博士群体进行对比；

    • 将 NIST/NRC 研究员（RA）的经历与其他计划中的研究员进行对比；以及

    • 就对 NIST/NRC 研究员的职业生涯进行更深入的评估提供建议，特别关注量化该职位任命对接收者以及 NIST 带来的益处。


    委员会受两个主要问题的指导：


    • NIST 是否正在吸引“最优秀、最才华的人才”加入 NIST/NRC RAP？

    • 该计划对研究员、NIST 以及整个科学与工程社区产生了什么影响？


    此外，委员会决定在适当的情况下，就计划申请者的数据收集、现任及前任 NIST/NRC 研究员的经历，以及 NIST/NRC 研究员和 NIST 员工对该计划对
    NIST/NRC 研究员、NIST 以及整个科学与工程社区价值的观点，提供建议。


    在评估 NIST/NRC RAP 时，委员会试图将该计划与 NRC 管理的其他 RAP 进行比较。首先，委员会将 NIST/NRC RAP 的申请者特征与其他
    RAP 进行比较，并在较小程度上与近期科学与工程博士学位的总体群体进行比较。其次，委员会将 NIST/NRC 研究员的特征和经历与其他计划中的研究员进行比较。¹⁷。最后，委员会对前任
    NIST/NRC 研究员与其他前任研究员的职业进行了非常有限的比较，但数据局限性导致除了简单的描述性分析外无法进行其他分析。


    |  ||  ¹⁷ 于完成报告的时间限制，委员会未能将申请者与 NIST/NRC 研究员以及在 RAP 之外获得任命的同类博士后进行比较，尽管在其他维护博士后计划的机构合作下，这种比较在未来可能是可能的。
    |

    | --- | --- |


    委员会采取的方法在几个方面具有局限性。最重要的是，该分析在本质上不是因果性的。委员会无法解释 NIST/NRC 研究员与对比组之间的相似之处或差异。

