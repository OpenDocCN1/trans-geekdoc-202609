    As `[Table 2-7]` illustrates, successful applicants to the NIST/NRC RAP were more
    likely to hear about the Program from NRC staff or an NRC associate; although
    in these cases, few applicants had heard about the Program from these sources.
    There seems to be much more variability in how successful applicants hear about
