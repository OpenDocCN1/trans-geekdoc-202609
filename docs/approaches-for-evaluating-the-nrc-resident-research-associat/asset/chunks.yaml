  trans: "\n\niii. `NIST` 可能希望对其对 `RAs` 的支持进行更彻底的审查，询问他们对 `NIST` 行政部门的熟悉程度、向这些部门寻求帮助的频率以及求助原因。\n\
    \nd. `NIST` 还可以对 `RAs`（或 `NIST` 员工）的合作进行社交网络分析，以查看 `RAP` 如何促进科学家和工程师之间新的或更广泛的合作。\n\
    \ne. 在数据允许的情况下，`NIST` 可以考虑按实验室、性别和种族/民族对 `RAs` 的生产力和满意度衡量进行细分统计。\n\n### 表格 3-1\
