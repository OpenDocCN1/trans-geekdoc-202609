    - c. Meet with graduate students/doctorates at professional meetings

    - d. Invite graduate students/doctorates to visit or give presentations at your
    agency

    - e. Other: \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_

    - 26. Does your group make any efforts to recruit postdocs

    - a. If yes, what?

    - 27. Does your lab or center make any efforts to recruit postdocs?

    - a. If yes, what?

    - 28. What were the best features of the postdoc?

    - 29. What were the worst features of the postdoc?

    - 30. If you could make improvements to the program what would they be?


    # 4 Careers


    There is very little information on the careers of former NIST/NRC RAs. Sources
    of information are described in the next section, but to summarize, the data cover
    the immediate post-appointment plans of RAs or their current employment at an
    arbitrary, recent time point. Career histories are not available. Based on these
    data, former RAs are seen to have moved into employment in all sectors. Of particular
    interest to NIST is whether the NRC Resident Research Associateship Program at
    NIST (NIST/NRC RAP) is providing a source of job candidates. Some information
    available to answer this question was obtained through the expert panels and data
    collected by NIST.


    From the point of view of current and former RAs at NIST, as well as NIST staff,
    the Program is viewed as beneficial to expanding the pool of potential applicants
    to NIST jobs. Many current RAs, interviewed during the expert panels came to the
    RAP with the hopes of remaining at NIST. They were aware that it was difficult
    to make the transition to permanent employee, but some felt that having the NIST/NRC
    Research Associateship was the best way to stay. The success rate, based on their
    estimates, varies widely by where at NIST the RAs were employed. Estimates ranged
    from 5 to 60 percent, although the NIST-wide estimate was thought to be around
    30 to 40 percent. Former RAs who remained at NIST thought that the overall retention
    rate was around 50 percent, and that the percentage retained varied by labs, for
    example in some labs they felt it was 15 to 20 percent. While both current and
    former RAs noted that it was difficult to remain at NIST, former RAs felt that
    current RAs overestimate their chances of staying. Advisors and division chiefs
    put the percentage of RAs being hired at NIST at about 33 percent. They reported
    that about half of RAs ask about staying. Participants noted that in many cases,
    RAs intended to go elsewhere after their tenure, while those who came to NIST
    and highly enjoyed working there often found a way to remain. During the expert
    panel with NIST advisors and managers, they noted that the program was a good
    way to recruit (some said “primary” way to recruit) and retain good people. As
    one participant noted: “It’s a great way to try someone out.”


    ## RESEARCH ASSOCIATES’ CAREERS


    Three sources of information about the careers of RAs after the appointment are
    the final reports RAs fill out at the end of their postdoctoral appointment, a
    directory put together by The National Academies, and information from NIST about
    change in status of RAs. In 1996, The National Academies put together a `Directory
    of Resident Research Associates`. The first data source focuses on the plans of
    RAs after completing their appointments. It is the only career information taken
    at the beginning of the RAs post-appointment career.


    `[Table 4-1](../Text/ch013.xhtml#p200138f5ttt00037)` looks at where RAs planned
    to go next, following their appointment. Again, these data are taken from the
    final reports filled out by RAs, and as noted in `[Chapter 3](../Text/ch012.xhtml#p200138f5ddd00041)`,
    not many RAs complete this form. Fifty-seven percent (of 253) NIST/NRC RAs and
    37 percent (of 6,936) of RAs from other RAPs provided information on their post-tenure
    employment position.


    ![](Images/t200138f5_37.png)


    As `[Table 4-1](../Text/ch013.xhtml#p200138f5ttt00037)` shows, among those RAs
    who answered the question, the most common response for NIST/NRC RAs was remaining
    at NIST as a permanent employee. When adding in those RAs who were going to continue
    working at or for NIST as a contractor or as a temporary employee, about 45 percent
    of those who answered the question continued to be affiliated with NIST, compared
    with only 22.5 percent for the Research Associates who were in other RAPs. This
    lends credence to the views expressed by NIST/NRC Research Associates about their
    satisfaction with the program, to the view expressed by participants in the expert
    panels that the Research Associateships are a good entrée into a career at NIST,
    and to the view that NIST uses the Research Associateships as one recruiting tool
    for finding skilled employees. Respondents to the final report also are asked
    to identify the name of the organization that they plan to go to for their next
    position. For academic appointments, respondents listed 27 different institutions.
    Aside from NIST, Research Associates identified a number of other government positions,
    including several at the national labs. As was true for academia, respondents
    whose immediate employment plans were in industry each cited a different company.
    Thus, those respondents who were not continuing in some fashion at NIST tended
    to go all over the country within the major employment sectors.


    The `Directory` was intended to identify where former RAs were at the time the
    `Directory` was compiled. It initially covered the years 1959-1995. The data were
    then updated to cover up to the period 2002 and made web-accessible. Information
    in the written Directory and its subsequent update were based on data collected
    at the time individuals received their reward and responses to a questionnaire
    requesting information about their current activities. Many former RAs did not
    respond to the questionnaire and in many cases it was not possible to find contact
    information for some former RAs (NRC, 1996).


    Beginning in 1965, there are 9,924 entries in the current database. Of these,
    1,035 or about 10 percent were individuals who had received NIST/NRC Research
    Associateships. The response rate for current employment data was 37.5 percent
    (of 1035) for NIST/NRC RAs and 37.7 percent (of 8889) for former RAs in other
    RAPs. Among those who responded, as `[Table 4-3](../Text/ch013.xhtml#p200138f5ttt00039)`
    shows, the current employer for over one-third of former NIST/NRC RAs is NIST.
    NIST/NRC RAs were more likely to be employed in government and less likely to
    be employed in academia or other sectors. An important finding is that about 37.6
    percent of NIST/NRC RAs were working at NIST.


    ![](Images/t200138f5_38.png)


    As `[Table 4-2](../Text/ch013.xhtml#p200138f5ttt00038)` notes—similarly with `[Table
    4-1](../Text/ch013.xhtml#p200138f5ttt00037)`)—among those who answered the questionnaire
    sent out to compile the Directory, 37.6 percent of former NIST/NRC RAs were employed
    at NIST when the survey was taken, compared with about 28.1 percent of former
    RAs of other RAPs, who were at their host agencies.


    A final data source are data collected by NIST of changes in postdoctoral status,
    that is: appointment start dates, appointment terminations, resignations, and
    most important for our purposes here, conversions of RAs to either term of career
    conditional appointments.


    ![](Images/t200138f5_39.png)


    As `[Table 4-3](../Text/ch013.xhtml#p200138f5ttt00039)` shows, about 25 percent
    of former RAs converted (this does not include RAs who converted to contractor
    status) and among those former RAs who converted, about 31 percent converted to
    permanent employee status.

