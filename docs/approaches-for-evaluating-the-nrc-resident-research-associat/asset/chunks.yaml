  trans: '


    2004 年，美国国家标准与技术研究院（NIST）的国家研究委员会驻院研究员计划庆祝了成立 50 周年。该计划由国家研究委员会（NRC）奖学办公室管理，并在国家标准与技术研究院（NIST）实施，为科学和工程领域提供博士后机会。在过去的
    53 年里，该计划已支持了 1,300 多名研究员。据介绍，NIST 和 NRC 的现任及前任参与者和员工认为，该计划是博士后参与重要研究并继续培训的成功手段，同时也协助
    NIST 履行使命，并培养规模更大、人才更优的科学家和工程师群体。目前为止，使用更多定量证据对该计划进行整体评估的尝试非常有限。本报告旨在根据现有证据对该计划进行评估，并为
    NIST 提供可能考虑的收集计划数据的方法，以便进行更严谨的评估。委员会强烈希望 NIST 未来能开展更深入的评估，并希望本研究能为 NIST 奠定某些基础。


    本报告草案已由因多元视角和技术专业知识被选中的个人进行审阅，符合国家科学院报告评审委员会批准的程序。此次独立评审的目的是提供坦诚和批判性的意见，以帮助机构使其发布的报告尽可能完善，并确保报告符合机构关于客观性、证据以及对研究任务响应的标准。评审意见和报告初稿保持保密，以保护流程的完整性。


    我们感谢以下个人对本报告的审阅：Dean Atkinson 院长，波特兰州立大学；Donald Bitzer，北卡罗来纳州立大学；Booker Stephen
    Carpenter，国家标准与技术研究院（退休）；Michael J. Finn，奥克拉荷马协会联合大学；Jason Floyd，Hughes Associates,
    Inc.；Lee Sechrest，亚利桑那大学；Lewis Siegel，美国国家科学基金会；以及 Paula Stephan，佐治亚州立大学。


    尽管上述评审员提供了许多建设性的意见和建议，但并未要求他们背书报告的结论或建议，他们在报告发布前也没有看到报告的终稿。本报告的评审由罗彻斯特大学的 Charles
    Phelps 监督。他受国家科学院任命，负责确保按照机构程序对本报告进行独立审查，并仔细考虑了所有的评审意见。本报告最终内容的责任完全由撰稿委员会和相关机构承担。


    此外，委员会还感谢 Jeovanny Paz、Jim Voytuk、Joe Finan、Charlie Fink、Suzanne White、Ray Gamble
    以及国家科学院奖学办公室的所有人员。此外，我们还要感谢 Claire Saundry、Susan Heller-Zeisler、Hratch Semerjian，并特别感谢所有参与我们专家小组的人。


    Isaac Sanchez，*主席*


