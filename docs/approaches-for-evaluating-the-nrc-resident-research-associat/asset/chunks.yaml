    # Appendix E

    ## EXAMINATION OF APPLICATIONS TO PREPECTIVE PROGRAMS


    In the next table, we examine the number of applicants to NIST and non-NIST postdoc
    positions and the number of accepted to the respective programs. The proportion
    of applicants and awardees is contrasted with the relevant pool of potential applicants.
    In the case of applicants to NIST postdocs, the pool is the sum of U.S. citizens,
    who received a Ph.D. in the five years prior to the application year, including
    the application year, in science and engineering. We also look at the subset of
    Ph.D.s who were U.S. citizens and intended to pursue a postdoctoral appointment.
    (These are doctorates who had definite plans for postdoctoral study or research.)
    The figure presented in a five-year moving average of those with definite plans.


    | | |

    | :--- | :--- |

    | (48) Science and engineering is defined as those fields on the SED with 000
    to 599. In 16 cases the Ph.D. field was unknown. These cases were dropped from
    the analysis. This leaves a total of 667,255 individuals with S&E degrees. | |


    In the case of applicants to non-NIST postdocs, the pool consists of all Ph.D.s
    in the five years prior to the application year, including the application year,
    in science and engineering. Again, we also look at the subset of Ph.D.s who intended
    to pursue a postdoctoral appointment. Data on Ph.D.s and those intending to do
    postdocs is taken from the National Science Foundation’s Survey of Earned Doctorates,
    described in Chapter 1. (Selected pages from the 2007 survey questionnaire is
    found in Appendix B.) For comparative purposes, we focus on data from 1965 through
    2005, which is the most current SED data available at this time.


    | | |

    | :--- | :--- |

    | (49) This is a less-precise comparison group, as some of the postdoc positions
    in the non-NIST group are open to a subset, e.g., U.S. citizens or permanent residents,
    while others are open to U.S. citizens and foreign nationals. | |


    ![](Images/t200138f5_49.png) ![](Images/t200138f5_50.png)


    Next, we disaggregated the total pool of potential applicants, applications, and
    acceptances by discipline. Perhaps, reflecting the changing nature of disciplines
    over the years, and the fact that applicants are supposed to identify a field
    for all degrees received, there are a large number of fields that applicants have
    put over the years. There were 1398 choices applicants could pick. Several are
    a bit confusing. As we are interested in doctoral degrees, applicants picked 536
    different fields for their Ph.D.s. To simplify matters, we created a small group
    of major categories: agricultural sciences and natural resources; biological,
    biomedical, and health sciences; engineering; mathematical and computer sciences;
    and the physical sciences to examine. (A list of which fine fields are part of
    each of these major categories is found in Appendix F.) There was some amount
    of subjectivity in this process, particularly in terms of whether a field should
    be included in these categories or not, but it should not effect the general results
    presented in the following tables.) We contrast these data to groups of Ph.D.s
    from the SED where agriculture and natural resources is anyone with a field code
    of 000 to 099; biological and health is anyone with a field code of 100-299; engineering
    is anyone with a field code of 300-399, mathematics and computer science is anyone
    with a field code of 400-499; and the physical science is anyone with a field
    code of 500-599.

