    正如 `GAO` (2005) 和 `学术竞争力委员会` (`ACC`) (2007) 所出的，一个担忧是，并非所有的计划都经过了评估，即使在已完成或正在进行的评估案例中，对于单个计划产生的积极影响也知之甚少。⁶
    这种评估非常重要，并且可以阐明许多影响，包括：


    | | ⁶ 然而，对联邦科学与工程（S&E）计划已进行了多次评估，这些评估的作者可能不同意评估没有产生关于这些计划影响的信息。例如：`OSIRE` (2003)、`McCullough`
    和 `Thurgood` (2004)、`NRC` 中的 `Kimsey` (2006a)、`Mantovani et al.` (2006)、`Michie
    et al.` (2007) 以及 `Finkelstein` 和 `Libarkin` (未注明日期)。 |

    | --- | --- |


    * 计划在促进性别、种族/民族和/或社会地位多样化方面的成功；

    * 机构信息传播策略的有效性；

    * 通过学者在计划中的体验质量来衡量对接收者、机构和国家带来的利益；以及

    * 通过博士后人员的职业生涯来衡量对接收者、机构和国家带来的利益。


    正本着这种精神，`国家标准与技术研究院` (`NIST`) 联系了`科学院`，以对 `NIST` 的 `NRC 驻留研究员合作伙伴计划`（以下简称“NIST/NRC
    RAP”）进行研究。


    # NIST 的 NRC 驻留研究员合作伙伴计划


    如上述所示，`科学院`国家研究委员会 (`NRC`) 的`学金办公室`管理着若干联邦机构的一系列博士后计划。这些计划统称为 `NRC 驻留研究员合作伙伴计划`。该计划建立于
    1954 年，效仿了由 `NRC` 在 1919 年至 1955 年间管理的`洛克菲勒基金会学金`计划。`NIST` 是第一个赞助者：“`NIST` 的最初赞助是通过
    1954 年的`标准局`（现为 `NIST`）进行的。1955 年，海军研究部门也加入了其中。`合作伙伴计划`一直扩大到今天，`NIST` 各机构都参与了其中。”⁷](../Text/ch010.xhtml#p200138f5ftt00007


    | | ⁷ 此信息改编自`科学院` `NIST`，获取地址：[`http://www.nationalacademies.org/rap/Mission`](http://www.nationalacademies.org/rap/Mission)。
    |

    | --- | --- |


    `NIST` 的`合作伙伴计划`与 `NRC` 计划脱钩。每个参与`研究助理员合作伙伴计划`的机构其`目标`可能超出 `NRC` 的目标，强调不同的方面，或与其他机构的目标有所不同。`NIST`
    所述的 `NIST/NRC RAP` 目标是：“博士后计划带来了极具潜力和能力的研究科学家和工程师，他们能够开展与 `NIST` 任务相关的先进研究，将最新的大学研究成果和技术引入
    `NIST` 科学计划，加强与大学研究人员的相互交流，与`美国科学与工程界`共享 `NIST` 独特的研究设施，并为研究结果从 `NIST` 向科学工程界的的转化提供了一个宝贵的机制。”¹⁰


    | | ¹⁰ `学术事务办公室`，“学术事务办公室。”获取地址：[`http://www.nist.gov/oiaa/acdmaffr.htm`](http://www.nist.gov/oiaa/acdmaffr.htm)。
    |

