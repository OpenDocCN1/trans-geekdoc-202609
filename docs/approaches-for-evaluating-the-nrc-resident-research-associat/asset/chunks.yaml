- raw: "“The Academic Competitiveness Council, in furtherance of the Administration’s\
    \ American Competitiveness Initiative, seeks to ensure that the nation invests\
    \ wisely and effectively in educational programs to meet its science and technology\
    \ goals. The ACC, therefore, requires evaluations of important STEM[^(16)](../Text/ch010.xhtml#p200138f5ftt00016)\
    \ education programs, including the NIST/NRC Postdoctoral Research Associateships\
    \ Program. An ad hoc committee under the auspices of the Board on Higher Education\
    \ and Workforce will describe the pool of applicants for and recipients of the\
    \ NIST/NRC Postdoctoral Research Associateships and carry out a descriptive analysis\
    \ of career outcomes of NIST postdoctoral scholars based on available information.\
    \ As possible given available data, the committee will also describe how the program\
    \ addresses agency goals. The committee will also outline an approach to evaluating\
    \ the program relative to national S&E goals, NIST agency goals, and the value\
    \ of the program to participants, which could be undertaken in a future study.”\n\
    \n|  ||  ^(16) STEM is science, technology, engineering, and mathematics. |\n\n\
    | --- | --- |\n\n## **APPROACH AND SCOPE**\n\nTo meet its charge, the committee\
    \ focused on three objectives:\n\n• To describe characteristics of NIST/NRC RAP\
    \ applicants compared to the general pool of new science and engineering doctorates;\n\
    \n• To describe the experiences of NIST/NRC RAs compared to Research Associates\
    \ in other programs; and\n\n• To offer suggestions for conducting a more in-depth\
    \ assessment of the careers of NIST/NRC RAs, with a particular focus on quantifying\
    \ the benefits of the appointment to the recipients as well as to NIST.\n\nThe\
    \ committee was guided by two principal questions:\n\n• Is NIST attracting the\
    \ “best and the brightest” to the NIST/NRC RAP?\n\n• What is the impact of the\
    \ program on the Research Associates, NIST, and to the scientific and engineering\
    \ communities in general?\n\nIn addition, the committee determined to offer recommendations\
    \ where appropriate regarding data collection on applicants to the program, on\
    \ the experiences of current and former NIST/NRC RAs, and on the views of NIST/NRC\
    \ RAs and NIST employees toward the value of the program to NIST/NRC RAs, NIST,\
    \ and to the scientific and engineering communities in general.\n\nIn assessing\
    \ the NIST/NRC RAP, the committee sought to compare that program to the other\
    \ RAPs administered by the NRC. First, the committee compared characteristics\
    \ of applicants to the NIST/NRC RAP to other RAPs, and to a lesser degree to the\
    \ general pool of recent science and engineering doctorates. Second, the committee\
    \ compared characteristics and experiences of NIST/NRC RAs to Research Associates\
    \ in other programs.[^(17)](../Text/ch010.xhtml#p200138f5ftt00017) Finally, the\
    \ committee undertook a very limited comparison of the careers of former NIST/NRC\
    \ RAs to other former research associates, but data limitations prevented all\
    \ but simple descriptive analyses.\n\n|  ||  ^(17) Given the timeframe for completing\
    \ the report, the committee was not able to also compare the applicants to the\
    \ NIST/NRC RAs and those awarded appointments to comparable postdocs outside the\
    \ RAPs, although such a comparison might be possible in the future with the cooperation\
    \ of other agencies that maintain postdoctoral programs. |\n\n| --- | --- |\n\n\
    The approach taken by the committee is limited in several ways. Most importantly,\
    \ the analysis is not causal in nature. The committee cannot explain similarities\
    \ or differences between NIST/NRC RAs and the comparison groups. However, description\
    \ is an informative first step that reveals patterns and trends. It suggests potential\
    \ causal hypotheses (e.g., the rise in the number of female applicants is due\
    \ to the growing number of women receiving doctorates, better recruitment of women\
    \ doctorates, or the changing nature of the profession, in which postdocs have\
    \ become necessary in the career pathway) that can be tested in the future. Description\
    \ also reveals gaps in data collection that might be addressed in the future.\
    \ The analysis can also highlight similarities and differences between the NIST/NRC\
    \ RAP and other RAPs, which can be useful in designing more rigorous evaluations\
    \ to assess the impact of the award.\n\nSecond, the comparison between the NIST/NRC\
    \ RAP and the other RAPs combined is imperfect. Not all of the RAPs have the same\
    \ eligibility requirements (e.g., limited to U.S. citizens), nor are the appointments\
    \ necessarily similar. However, in practice, these two groups of postdocs and\
    \ postdoctoral appointments are quite close and there is the advantage that individuals\
    \ in both groups fill out the same application form, awardees fill out the same\
    \ final report, and Research Associate advisors fill out the same evaluation form—thus\
    \ providing similar data.[^(18)](../Text/ch010.xhtml#p200138f5ftt00018)\n\n| \
    \ ||  ^(18) Due to privacy concerns over the small number of individuals in some\
    \ of the RAPs (because they do not make many awards or are relatively newer programs),\
    \ it is not recommended to conduct analysis on each of the RAPs identified in\
    \ [Table 1-1](../Text/ch010.xhtml#p200138f5ttt00001). |\n\n| --- | --- |\n\nThird,\
    \ the committee was limited by data availability (for details see below). Data\
    \ do not exist back to the beginning of the NIST program in 1954. Comparative\
    \ data on postdoctoral appointments and postdocs is relatively new—dating back\
    \ to the mid- or late-1970s—and the most in-depth quantitative analysis of postdocs\
    \ has only been undertaken in the past several years.\n\n## **SOURCES OF INFORMATION**\n\
    \nTo complete its charge, the committee relied primarily on three sources of information:\
    \ (1) data on applicants to the NIST/NRC and other RAPs and the experiences of\
    \ NIST/NRC and other RAs, which are collected by the NRC’s Fellowships Office;\
    \ (2) data on the careers of former RAs collected by NIST and the Fellowships\
    \ Office; and (3) data on S&E doctorates and postdoctorates collected by the National\
    \ Science Foundation (NSF). In addition, the committee examined relevant literature\
    \ on S&E postdoctorates, including surveys of postdoctorates, and examples of\
    \ evaluations of other federal education programs. Finally, the committee conducted\
    \ original research in the form of multiple expert panels with current and former\
    \ NIST RAs and NIST employees. [Table 1-2](../Text/ch010.xhtml#p200138f5ttt00002)\
    \ summarizes the sources, which are further elaborated on below.  \n\n ![](Images/t200138f5_2.png)\n\
    \nData on applicants comes from two sources: a database constructed by the NRC’s\
    \ Fellowship Office to hold application data and the NSF’s Survey of Earned Doctorates.\
    \ The Fellowship’s Office maintains a database on applicants, collecting information\
    \ submitted by applicants during the application process. Until very recently,\
    \ data were entered manually from an application form (see [Appendix B](../Text/ch017.xhtml#p200138f5ddd00066));\
    \ currently, some information is pulled from a web-based application. Data are\
    \ available from 1959 (1966 for NIST/NRC RAs) through February 2007. Key variables\
    \ are:\n\n• Demographic information, including: birth date, citizenship, gender,\
    \ race/ethnicity, and marital status;\n\n• Educational background, including highest\
    \ degree, degree field, and doctorate awarding institution;\n\n• Desired postdoctoral\
    \ position, including program and lab applied to;\n\n• Outcome indicators, including\
    \ the ranking of the applicants and the outcome of the applications; and\n\n•\
    \ How the applicant heard about the program."
