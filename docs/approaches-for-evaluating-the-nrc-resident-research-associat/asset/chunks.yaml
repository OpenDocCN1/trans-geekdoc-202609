    Second, what is the percentage of awardees, by field? As [Table 2-8](../Text/ch011.xhtml#p200138f5ttt00010)
    shows, the breakdown of awards is fairly consistent with the breakdown of applications.
    Thus, for NIST postdocs, 72 percent of applications are from doctorates in the
    physical sciences, and 69 percent of the awards of NIST postdocs are to doctorates
    in the physical sciences.


    ![](Images/t200138f5_12.png)


    Third, what is the ratio of awards to applications, by major field? As [Table
    2-9](../Text/ch011.xhtml#p200138f5ttt00011) shows, while the NIST/NRC RAP received
    few applications from doctorates in the biological sciences, broadly defined,
    and although it selected few life scientists for RA positions, the percentage
    of doctorates who received Research Associateships from that small group of applicants
    was relatively quite high—almost 40 percent. Conversely, it was much harder, proportionately,
    to be awarded a Research Associateship if one’s background was in the physical
    sciences: only 21 percent.


    TABLE 2-11 Percent of Awards, by Research Associateship Program and Major Field
    of Applicants, 1965-2007


    | Field || NIST/NRC RAP (%) || Other RAP (%) |

    | :-- | :-: | :-: |

    | Agric./Nat. res. || 0.0 || 26.0 |

    | Bio/Biomed/Health || 37.5 || 33.2 |

    | Engineering || 25.1 || 27.2 |

    | Math/Comp. sci. || 24.8 || 26.0 |

    | Physical || 21.3 || 29.4 |

    | All fields || 22.5 || 29.5 |

    | Source: National Academies, DataRAP Database, tabulations by staff. |


    ### Gender


    A number of recent studies—though this is certainly not a new issue—have focused
    on efforts to encourage women to pursue careers in S&E. Women are,as noted earlier
    in the chapter, receiving a growing proportion of Ph.D.s, and yet they have not
    yet achieved similar results in employment. Some of this is due to the fact that
    it takes time for women to rise to more senior positions (e.g., full professor
    in academia), and so more recent gains may not yet be evident in employment characteristics.
    Nevertheless, it is important that women are receiving encouragement at the beginning
    of their career—and the NIST/NRC RAP could certainly be a good stepping stone.
    The following figures examine whether there are differences in the proportion
    of applicants and awards by gender comparing applicants to the NIST/NRC RAP to
    other RAPs and to the overall pool.


    ![](Images/p200138f5g38001.png)


    FIGURE 2-3 Percent of applications from women, by Research Associateship Program,
    1965-2007.


    Source: National Academies, DataRAP Database, tabulations by staff.


    ![](Images/p200138f5g39001.png)


    FIGURE 2-4 Percent of awardees who are women, by Research Associateship Program,
    1965-2007.

    Note: No awards were made in the NIST program in 1986. In 2007, not all application
    cycles have been completed and recorded in the database.

    Source: National Academies, DataRAP Database, tabulations by staff.


    Figures [2-3](../Text/ch011.xhtml#p200138f5mmm0003) and [2-4](../Text/ch011.xhtml#p200138f5mmm0004)
    show that women are increasingly applying to the NIST/NRC RAP; and that the NIST/NRC
    RAP is as popular as the other RAPs, for applicants. However, the percentage of
    women applying or receiving an award is lower than the percentage of women receiving
    Ph.D.s or intending to pursue a postdoc (see [Appendix E](../Text/ch020.xhtml#p200138f5ddd0069)
    for comparison data).


    Next, the success rate for applications to the two programs are compared, by gender.
    The question underlying the following figures is whether applications from men
    and women, overall, produce similar award rates. For applicants to the NIST/NRC
    RAP, the two trends are volatile, but roughly similar, as shown in [Figure 2-5](../Text/ch011.xhtml#p200138f5mmm0005).
    As [Figure 2-6](../Text/ch011.xhtml#p200138f5mmm0006) illustrates, male and female
    award rates track quite closely, though applications from women are somewhat more
    likely to produce awardees.


    ![](Images/p200138f5g40001.png)


    FIGURE 2-5 Success rate of applications to NIST/NRC Research Associateship Program,
    by gender, 1965-2007.

    Note: No awards were made in the NIST program in 1986. In 2007, not all application
    cycles have been completed and recorded in the database.

    Source: National Academies, DataRAP Database, tabulations by staff.


    ![](Images/p200138f5g41001.png)


    FIGURE 2-6 Success rate of applications to all other Research Associates Programs,
    by gender, 1965-2007.

    Note: In 2007, not all application cycles have been completed and recorded in
    the database.

    Source: National Academies, DataRAP Database, tabulations by staff.


    ### Race/Ethnicity


    This section examines whether there are differences in the proportion of applicants
    and accepted applicants by race/ethnicity comparing applicants to the NIST/NRC
    RAP to applicants to the other RAPs and to the overall pool. Two comments preface
    the analysis. First, because the number of applicants and awardees who are not
    white is very small (which reflects the relatively smaller number of minorities
    receiving Ph.D.s in S&E), we grouped the individual race/ethnicity categories
    together into three groups: white, underrepresented minority, Asian, and unknown.
    Underrepresented minority here means: American Indian or Alaska Native; Black
    or African American; Hispanic; or Native Hawaiian or Other Pacific Islander. Asian
    means Asian or Pacific Islander or Asian. Many people do not fill out this optional
    question on the application form. Second, these data were not collected prior
    to 1980. Finally, the percentages here are the proportion of underrepresented
    minorities among those who indicated a race/ethnicity.


    ![](Images/p200138f5g42001.png)


    FIGURE 2-7 Percent of applications from underrepresented minorities, by Research
    Associateship Program, 1980-2007.

    Note: In 2007, not all application cycles have been completed and recorded in
    the database.

    Source: National Academies, DataRAP Database, tabulations by staff.


    Based on the [Figure 2-7](../Text/ch011.xhtml#p200138f5mmm0007) above, NIST has
    received a greater share of applications from underrepresented minorities over
    time, although there has been a bit of a drop off in more recently. The decline
    should be further explored. In general applications from underrepresented minorities
    are comparable between the NIST/NRC RAP and the other RAPs. However, the percentage
    of underrepresented minorities applying or receiving an award is generally lower
    than the percentage of underrepresented minorities receiving Ph.D.s or intending
    to pursue a postdoc (see [Appendix E](../Text/ch020.xhtml#p200138f5ddd0069) for
    comparison data).


    ![](Images/p200138f5g43001.png)


    FIGURE 2-8 Percent of awards to underrepresented minorities, by Research Associateship
    Program, 1980-2007.

    Note: No awards were made in the NIST program in 1986. In 2007, not all application
    cycles have been completed and recorded in the database.

    Source: National Academies, DataRAP Database, tabulations by staff.


    NIST awards to minorities are also higher in the 1990s than in the 1980s; a positive
    sign, although not difficult to achieve given that almost no underrepresented
    minorities received awards in the 1980s. There is a a decline evident in awards
    to underrepresented minorities over the past few years, something that should
    be further scrutinized.


    In both figures, the trend line shows more volatility for the NIST/NRC RAP, perhaps
    in part because one program is being compared to several collectively. However,
    given data limitations, it appears that the NIST/NRC RAP is often more diverse
    proportionally in terms of awarding Research Associateships to underrepresented
    minorities than the other RAPs (taken collectively). In terms of identifying best
    practices for recruiting applicants, it may be instructive to see if there are
    different outreach strategies between the NIST/NRC RAP and other RAPs—although
    in some cases, outreach strategies are conducted by the NRC.

