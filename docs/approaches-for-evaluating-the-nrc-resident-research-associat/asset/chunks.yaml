    \ while applicants to the other RAPs had received doctorates from 1534 institutions.\
    \ This is likely due in part to the U.S. citizenship requirement for the NIST/NRC\
    \ RAP. Concerning acceptances, all of those awarded an NIST/NRC RAP identified\
    \ their doctoral-granting institutions; but 14 of those awarded another Research\
    \ Associateship did not. NIST/NRC RAs received doctorates from 173 different institutions.\
    \ RAs for other RAPs received doctorates from 983 different institutions. As [Figure\
    \ 2-11](../Text/ch011.xhtml#p200138f5mmm00011) shows, applicants to NIST come\
