- raw: 'In the most recent wave of the SDR—collected in 2006, though not available
    at the time this report was prepared—a series of questions relating to postdocs
    was added. Questions include: whether the respondent is currently employed as
    a postdoc and the number of postdoctoral appointments the individual has had.
    For each appointment, respondents are asked to provide data on start and end dates,
    the primary reason for taking the position, employment sector (e.g., academic,
    industry, government), whether the employer provided health or retirement benefits,
    and to what extent the most recent or current postdoctoral appointment impacted
    on the respondent (e.g., increasing knowledge, research skills, career opportunities).
    If these questions continue to be asked in future SDRs, these data would be very
    helpful in getting a broad picture of postdocs’ experiences.


    A one-time survey of postdocs was conducted by Sigma Xi, in partnership with the
    National Postdoctoral Association, the American Association for the Advancement
    of Science, and the National Bureau of Economic Research, in 2003. Invitations
    to participate in the survey were sent to 1,432 provosts and vice provosts, deans,
    human resources personnel, and leaders of postdoc offices and associations at
    174 institutions. Of these, 46 institutions, including 18 of the top 20 academic
    employers and the largest government employer of postdocs, the National Institutes
    of Health (NIH), agreed to participate (Davis, 2005). Email was used to contact
    the 22,000 postdocs at the participating institutions, roughly 40 percent of all
    postdocs working in the United States at the time. The survey’s response rate
    was 34 percent.


    The survey focused on the following characteristics of postdocs:


    • Demographic information (e.g., sex, race/ethnicity, age, citizenship);


    • Benefits and services (e.g., salaries, benefits, and the adequacy of various
    resources);


    • Institutional environment (written policies and procedures and about the availability
    of various types of training);


    • The postdoc’s advisor;


    • The postdoc’s position;


    • Outcomes (e.g., time allocation, papers);


    • Career plans; and


    • The postdoc’s satisfaction with the postdoctoral appointment.


    A departmental survey by the NSF is the Survey of Graduate Students and Postdoctorates
    in Science and Engineering (GSS).[^(27)](../Text/ch010.xhtml#p200138f5ftt00027)
    The survey includes data on the number and characteristics of postdocs in S&E
    fields in U.S. institutions. The survey is conducted annually, and it is targeted
    to individual academic departments at graduate institutions. Data include count
    data on postdoctorates by source of support, sex, and citizenship. Data was collected
    beginning in 1966, and the most current data, as of this writing, is for 2005.
    However, the collection of data on postdocs has changed over time, making it difficult
    to examine long term trends.[^(28)](../Text/ch010.xhtml#p200138f5ftt00028)


    |  ||  ^(27) For more information on the survey, see: “SRS Survey of Graduate
    Students and Postdoctorates in Science and Engineering,” available at: [http://www.nsf.gov/statistics/showsrvy.cfm?srvy\_CatID=2&srvy\_Seri=2](http://www.nsf.gov/statistics/showsrvy.cfm?srvy_CatID=2&srvy_Seri=2).
    \[Accessed on June 24, 2007.\] |


    | --- | --- |


    |  ||  ^(28) Of particular note is that prior to 1975, NSF did not seek to collect
    data on all doctorate-granting institutions. For a fuller description of changes
    in the survey over time, see “SRS Survey of Graduate Students and Postdoctorates
    in Science and Engineering,” available at: [http://www.nsf.gov/statistics/showsrvy.cfm?srvy\_CatID=2&srvy\_Seri=2](http://www.nsf.gov/statistics/showsrvy.cfm?srvy_CatID=2&srvy_Seri=2).
    \[Accessed on June 24, 2007.\] |


    | --- | --- |


    Finally, a one-time survey of institutions with postdocs was conducted by the
    Committee on Science, Engineering, and Public Policy (COSEPUP) at The National
    Academies. “COSEPUP decided to survey the top 25 academic institutions (in terms
    of the largest numbers of postdoctoral scholars) and five each of the following:
    smaller institutions (in terms of number of postdoctoral scholars), medical schools,
    historically black colleges and universities (HBCUs), industry, research institutions,
    and government laboratories. The survey was conducted from November 1999 to April
    2000. The survey was conducted of 49 organizations who have postdoctoral scholars.
    Forty of the 49 organizations responded (82 percent response rate) (NAS/NAE/IOM,
    2000:138).”


    Career data are more difficult to come by. One source of information is The National
    Academies’ Associateships Program Directory: “A Directory of former NRC Associates
    was published in book form in 1995. Since then, more than 2,000 additional associateships
    have been awarded. In this web Directory, we have updated current information
    on many of our former Associates. This information can be viewed by Associate
    name, program, or date of award, or by state or country of the Associate’s current
    employment. The Directory is fully searchable.”[^(29)](../Text/ch010.xhtml#p200138f5ftt00029)
    Data cover 1959-2002. Using these data, it is possible to see where former NIST
    and other research associates have ended up—with the caveat that the information
    is limited to their current position, when they were asked to respond.


    |  ||  ^(29) NRC Associateships Program Directory, available at: [http://nrc58.nas.edu/pgasurvey/data/aodir/gen\_page.asp](http://nrc58.nas.edu/pgasurvey/data/aodir/gen_page.asp).
    \[Accessed on July 13, 2007.\] |


    | --- | --- |


    A second source of career data consists of monthly reports on NIST Research Associates
    collected and maintained by NIST. These data record changes in the employment
    status of NIST Research Associates. NIST Research Associates may resign or be
    terminated (although they may then work as contractors with NIST) or stay at NIST
    by being converted to a term position or by being converted to a career conditional
    position. Data are available in hardcopy for 1998-2001 and in electronic format
    for 2002-2007. Since these data cover research associates at the end of their
    tenure; these data cover research associates who began their appointments in 1996
    or later.


    A third source of information on the careers of postdocs which might be helpful
    comes from the NSF’s SDR. It is possible to examine respondents who completed
    multiple surveys, so one could identify survey respondents who were postdocs in
    the 1999 survey and examine changes in employment or other characteristics, for
    those respondents who also responded to the 2001 survey. The NSF is currently
    in the middle of a feasibility study designed to explore ways to fill  in the
    gap in data on postdocs. One goal is to improve coverage in two ways: by obtaining
    information on more postdocs (e.g., foreign Ph.D.-degreed postdocs or M.D.-Ph.D.
    postdocs) than might be covered in the SDR; and by covering more sectors beyond
    academia (e.g., postdocs at non-profits or government agencies), which fall outside
    the scope of the GSS. The NSF’s study may lead to a future survey of postdocs.


    Finally, the committee undertook original data collection in the form of three
    expert group discussions with current NIST RAs (CRA), former NIST RAs still working
    at NIST (FRA), and NIST RA advisors and division chiefs (AD). Each of the panels
    lasted approximately one hour and occurred on July 25, 2007. Questions asked of
    these participants (with the person the questions were directed to in parentheses)
    are listed in [Box 1-1](../Text/ch010.xhtml#p200138f5bbb00018).'
