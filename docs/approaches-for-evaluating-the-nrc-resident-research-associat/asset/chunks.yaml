    \ |\n\n|   |\n\n# 1\n\n# **Executive Summary**\n\nThe NRC Resident Research Associateship\
    \ Program (RAP) of the National Institute of Standards and Technology (NIST),\
    \ hereafter “NIST/NRC RAP,” was started in 1954. The program provides two-year\
    \ temporary appointments at NIST for outstanding scientists and engineers chosen\
    \ through a national competition. These appointments are designed to provide an\
    \ opportunity for some of the nation’s best scientists, mathematicians, and engineers\
    \ to engage in state-of-the-art research in association with senior research specialists\
    \ of NIST’s staff and to make use of the well-regarded and often unique research\
    \ facilities at NIST. The RAP is perceived to provide multiple benefits to the\
    \ postdoctoral research associates, to NIST, and to the scientific and engineering\
    \ community at large. NIST approached The National Academies with a desire to\
    \ see what sort of evaluation could be undertaken given available data. In addition,\
    \ NIST was interested in recommendations for future data collection where data\
    \ were found to be currently lacking, and for more in-depth evaluation strategies\
    \ that could be done in the future. Based on this request from NIST, an ad hoc\
    \ study committee—the Committee on Approaches for the Evaluation of the NIST/NRC\
    \ Postdoctoral Research Associateships Program—was appointed by the National Research\
    \ Council to conduct a study.\n\nThe committee’s specific charge is presented\
    \ below:\n\n“The Academic Competitiveness Council, in furtherance of the Administration’s\
    \ American Competitiveness Initiative, seeks to ensure that the nation invests\
    \ wisely and effectively in educational programs to meet its science and technology\
    \ goals. The ACC, therefore, requires evaluations of important STEM[¹](../Text/ch009.xhtml#p200138f5ftt00001)\
    \ education programs, including the NIST/NRC Postdoctoral Research Associateship\
    \ Program. An ad hoc committee under the auspices of the Board on Higher Education\
    \ and Workforce will describe the pool of applicants for and recipients of the\
    \ NIST/NRC Postdoctoral Research Associateship Program and carry out a descriptive\
    \ analysis of career outcomes of NIST postdoctoral scholars based on available\
    \ information. As possible given available data, the committee will also describe\
    \ how the program addresses agency goals. The committee will also outline an approach\
    \ to evaluating the program relative to national S&E goals, NIST agency goals,\
    \ and the value of the program to participants, which could be undertaken in a\
    \ future study.”\n\n|  ||  ¹ STEM is science, technology, engineering, and mathematics.\
    \ |\n\n| --- | --- |\n\n To meet its charge, the committee focused on three objectives:\
    \ (1) to describe characteristics of NIST applicants compared to the general pool\
    \ of new science and engineering doctorates; (2) to describe the experiences of\
    \ Research Associates at NIST compared to other Research Associates in other programs;\
    \ and (3) to offer suggestions for conducting a more in-depth assessment of the\
    \ careers of Research Associates at NIST, with a particular focus on quantifying\
    \ the benefits of the appointment to the recipients as well as to NIST—during\
    \ and after the appointment period. The committee was guided by two principal\
    \ questions:\n\n(1) Is NIST attracting the “best and the brightest” to the Research\
    \ Associateship Program?\n\n(2) What is the impact of the Program on the Research\
    \ Associates, NIST, and relevant scientific fields in general?[²](../Text/ch009.xhtml#p200138f5ftt00002)\n\
    \n|  ||  ² Given the limited data available and the charge to the committee, the\
    \ committee could not provide a full assessment of the impact of the program in\
    \ this report. |\n\n| --- | --- |\n\nIn addition, the committee determined to\
    \ offer recommendations where appropriate regarding data collection on applicants\
    \ to the Program; on the experiences of current and former NIST Research Associates;\
    \ and on the views of Research Associates and NIST employees towards the value\
    \ of the Program to Research Associates, to NIST, and to science and engineering\
    \ broadly.\n\nMultiple sources of information were identified and used in preparing\
    \ this report. The primary source of information was data collected by the NRC’s\
    \ Fellowships Office, including: application data, data from final reports prepared\
    \ by the Research Associates, and a directory of past Research Associates. In\
    \ addition, the committee collected original data from three expert panels. In\
    \ general, however, the data were inadequate to draw definitive conclusions.\n\
    \nThis report is divided into five chapters. [Chapter One](../Text/ch010.xhtml#p200138f5ddd00015)\
    \ describes the program and the approach and scope of the study. [Chapter Two](../Text/ch011.xhtml#p200138f5ddd00023)\
    \ examines applicants to the NIST/NRC RAP and compares them to applicants to other\
    \ Research Associateship Programs. It also examines applications and awards disaggregated\
    \ across several dimensions, such as gender or doctoral-granting institution.\
    \ [Chapter Three](../Text/ch012.xhtml#p200138f5ddd00041) examines the experiences\
    \ of NIST/NRC Research Associates and Research Associates at other federal agencies,\
    \ as well as Research Associates’ views on the value of the program they participated\
    \ in. [Chapter Four](../Text/ch013.xhtml#p200138f5ddd00057) examines the careers\
    \ of former Research Associates. [Chapter Five](../Text/ch014.xhtml#p200138f5ddd00061)\
    \ presents an overall summary of preliminary results and recommendations.\n\n\
    ## **PRELIMINARY RESULTS BASED ON AVAILABLE DATA**"
