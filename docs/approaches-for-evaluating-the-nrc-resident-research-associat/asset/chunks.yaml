- raw: "Former RAs made a few suggestions regarding possible ways to improve the program.\
    \ Like the current RAs, they saw the salary as a bit low, again in reference to\
    \ the high cost of living they felt in the Washington metro area. An interesting\
    \ discussion took place over whether RAs could get raises. They found information\
    \ on raises to be less transparent then they preferred and some former RAs believed\
    \ that because of bureaucratic maneuvering they could not get raises. Again, there\
    \ were different opinions based largely on which lab the participants were familiar\
    \ with. Former RAs felt that the two-year time period was appropriate for the\
    \ appointment. Finally, former RAs were unsure of who in NIST was the “champion”\
    \ for RAs (in reference to who could help them if they experienced any problems).\n\
    \nAdvisors and division leaders offered a different view of the benefits of the\
    \ program, focusing more on the benefits to NIST. They noted the program was a\
    \ good way to recruit potential employees, try people out for two years, and retain\
    \ good people. Some participants noted that the program was the “primary” way\
    \ NIST recruited. They also see many benefits in having the RAs at NIST, including:\
    \ covering a wider range of expertise, getting research done, bringing in new\
    \ ideas, doing innovative research, and helping NIST connect to universities.\n\
    \nAdvisors and division leaders also offered different suggestions for improving\
    \ the program. They felt that better recruiting was needed. Participants believed\
    \ that personal relationships were key to recruiting. Second, they felt that there\
    \ should be a NIST-wide support mechanism for RAs. They wanted to see more activities\
    \ for RAs to interact and network. Third, like the former RAs, they felt that\
    \ two years was an appropriate duration, although they were willing to explore\
    \ a third year option for selected RAs. Advisors and division leaders felt that\
    \ in some areas there were not enough applicants. One way to get more applications\
    \ was to consider opening up the award to non-citizens, although they note that\
    \ non-citizens face more restrictions in working at NIST. An alternative idea\
    \ mentioned was to open the award up to green card holders. Overall, participants\
    \ in the three expert panels felt that the program had myriad benefits to the\
    \ individual RAs and to NIST.\n\nIn terms of quantifying those benefits, there\
    \ is less to work with. The two principal sources are an evaluation form filled\
    \ out by the RAs when they complete their tenure, or term, at NIST; and an evaluation\
    \ of the RAs by their research advisor. (See Appendixes 8 and 9 for the forms.)\
    \ Neither form was viewed by many as required and was not filled out by most RAs\
    \ or advisors. Only 253 NIST/NRC RAs partially or completely filled out the final\
    \ report for a response rate of  about 20 percent.[^(41)](../Text/ch012.xhtml#p200138f5ftt00041)\
    \ (Additionally, in the beginning of the program very few RAs filled out the form\
    \ compared with the last t10 years or so.) For RAs in the other RAPs, 6,936 partially\
    \ or completely filled out the form, for a response rate of about 69 percent.[^(42)](../Text/ch012.xhtml#p200138f5ftt00042)\
    \ The research advisor’s evaluation form was not filled out by a sufficient number\
    \ of advisors at NIST (less than 20 did so) to include information from the form\
    \ in an assessment of the RAs. Therefore, results drawing on these data should\
    \ be taken cautiously. There may be nonresponse bias, particularly if RAs who\
    \ had better experiences or more positive outcomes also tended to be more likely\
    \ to fill out the form. Additionally, in some cases, the forms ask for historical\
    \ information, such as the number of presentations RAs gave. It is possible that\
    \ some respondents answered inaccurately, either unintentionally or intentionally.\
    \ But this seems unlikely, as respondents are asked to provide details (e.g.,\
    \ title, publication) rather than counts (i.e., the number of journal articles\
    \ published). In any case, there was no way in this study to independently confirm\
    \ these data, as respondents were not identified by name. However, future analysis,\
    \ if confidentiality concerns could be met, could undertake a CV analysis of a\
    \ sample of respondents to compare with responses on the final reports.\n\n| \
    \ ||  ^(41) Counting partial interviews as respondents. |\n\n| --- | --- |\n\n\
    |  ||  ^(42) Counting partial interviews as respondents. |\n\n| --- | --- |\n\n\
    Hopefully, as the forms are completed more in the future, they will provide more\
    \ data for NIST. There is no evaluation by NIST employees of the value of the\
    \ program overall, save for a question on the research advisor’s evaluation form.\
    \ As an open-ended question, it is difficult to quantify answers.\n\nThe final\
    \ report completed by RAs provides information in two areas: productivity of the\
    \ research associate during the tenure and their views of the Program. Each of\
    \ these areas is addressed in turn.\n\n## **PRODUCTIVITY DURING THE POSTDOCTORAL\
    \ APPOINTMENT**\n\nProductivity measures focus on both quantity and quality metrics,\
    \ although only the quantitative ones are entered into the NRC’s DataRAP database.\
    \ Measures focus on publications (peer-reviewed journals); books, book chapters,\
    \ other publications; patents, international or domestic presentations, seminars\
    \ or lectures delivered, manuscripts in preparation and manuscripts submitted;\
    \ and professional awards received. Selected outcome measures are examined.\n\n\
    ### **Journals**\n\nIn the final report, RAs are asked to provide complete citations\
    \ for their publications, including journal articles in peer-reviewed journals.\
    \ The data which is entered into the database consists of counts of journal articles.\
    \ Fifty-five percent (of 253) NIST/NRC RAs and 34 percent (of 6,936) of RAs from\
    \ other RAPs provided information on journals. As [Table 3-1](../Text/ch012.xhtml#p200138f5ttt00026)\
    \ shows, for those who responded, NIST/NRC RAs published between 0 and 13 articles;\
    \ while RAs from other RAPs published between 0 and 36 articles during their appointments.\
    \ On average, NIST/NRC RAs published slightly fewer articles in peer-reviewed\
    \ journals than RAs in other RAPs (2.3 to 2.7). This difference is statistically\
    \ significant at the 0.05 level.[^(43)](../Text/ch012.xhtml#p200138f5ftt00043)\
    \ However, a greater percentage of responding NIST/NRC RAs published at least\
    \ one article.  \n\n|  ||  ^(43) Based on an unpaired t-test with unequal variances.\
    \ Note the different sample sizes and that the samples are not normally distributed.\
    \ |\n\n| --- | --- |\n\n ![](Images/t200138f5_26.png) \n\n### **Presentations**\n\
    \nResearch associates were also asked to provide details on each of their presentations\
    \ (both domestic and international) made during their appointment. Fifty-six percent\
    \ (of 253) NIST/NRC RAs and 35 percent (of 6,936) of RAs from other RAPs provided\
    \ information on domestic presentations. NIST/NRC RAs gave between 0 and 14 domestic\
    \ presentations, while RAs from other RAPs gave between 0 and 27 presentations,\
    \ although more than 90 percent of all RAs gave at least one presentation. As\
    \ [Table 3-2](../Text/ch012.xhtml#p200138f5ttt00027) shows, for those who responded,\
    \ on average, NIST/NRC RAs gave slightly more domestic presentations at scientific\
    \ meetings or conferences than RAs in other RAPs did (3.5 to 3.0). This difference\
    \ is statistically significant at the 0.05 level.[^(44)](../Text/ch012.xhtml#p200138f5ftt00044)\
    \ And NIST/NRC RAs were more likely to give at least one domestic presentation\
    \ than their counterparts at other RAPs.  \n\n|  ||  ^(44) Based on an unpaired\
    \ t-test with unequal variances. Note the different sample sizes. |\n\n| --- |\
    \ --- |\n\n ![](Images/t200138f5_27.png)"
