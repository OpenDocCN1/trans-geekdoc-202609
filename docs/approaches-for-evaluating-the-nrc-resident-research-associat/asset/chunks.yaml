    | Professional meeting | 4.8 | 5.3 |

    | Other | 7.8 | 10.6 |

    | Source: National Academies, DataRAP Database, tabulations by staff. |


    Turning to race/ethnicity, we compared how whites and all other groups first heard
    about the program. Similar to women, the results were fairly consistent across
    two groups and minorities were more likely than whites to hear about the program
    via a professional meeting—but not significantly.


