- raw: "Applicants and RAs in other RAPs tend to be older and more likely to be married\
    \ than NIST/NRC RAP applicants and awardees. (See Appendix Table B-10 for the\
    \ underlying data.) As [Figure 2-13](../Text/ch011.xhtml#p200138f5mmm00013) shows,\
    \ other RAP applicants are more likely to be married. [Figure 2-14](../Text/ch011.xhtml#p200138f5mmm00014)\
    \ shows that other RAP awardees are also more likely to be married. These figures\
    \ raise a question of whether the NIST/NRC RAP is less attractive to married scientists\
    \ and engineers or whether some other characteristic of applicants to the NIST/NRC\
    \ RAP explains the trend that NIST/NRC Research Associates are more likely to\
    \ be single.\n\n### **Laboratories**\n\nApplicants to the NIST/NRC RAP select\
    \ a lab on their application form. Over the years NIST has reorganized, which\
    \ means that some older organizational names are no longer valid, while some recent\
    \ laboratories may not yet have any applicants. Since 1965, applicants have applied\
    \ to 18 different parts of NIST. We used the current organizational chart to map\
    \ older institutional names onto current names (see [Appendix E](../Text/ch020.xhtml#p200138f5ddd00069)).\
    \ This was problematic in a number of ways. First, 268 applicants simply put “National\
    \ Institute of Standards and Technology.” Second, several older divisions—e.g.,\
    \ National Engineering Laboratory and the National Measurement Laboratory—map\
    \ onto multiple contemporary divisions. We combined these situations into a new\
    \ category: “Multiple,” but it can also be thought of as an unknown category.\
    \ Finally, in spite of the efforts to map the laboratory names, viewing the data\
    \ over time shows that this is not fully successful. Applicants to Technology\
    \ Services covered the years 1965 to 1978,  but then stopped, although the name\
    \ still exists, perhaps what the applicants were researching fit better elsewhere.\
    \ Other labs apparently had no applicants until 1992, again which might reflect\
    \ an organizational change. Thus, analysis over time, and analysis by race/ethnicity—for\
    \ which data do not exist prior to 1980—are unwarranted. With available data,\
    \ two tables can be presented, which focus on applications and acceptances by\
    \ lab in total, and by gender.\n\n ![](Images/t200138f5_22.png)\n\nThe principal\
    \ finding here is that applications are not evenly distributed among labs. Some\
    \ labs attract more applicants than others. Likewise, some labs see more research\
    \ associateships awarded than others. A second finding is that the acceptance\
    \ rate varies by more than a factor of two—a large range. It may be instructive\
    \ to determine why this might be the case. Possible answers could focus on the\
    \ field, other opportunities for recent doctorates in those fields, and outreach\
    \ by the different labs. Another possible explanation is an intentional “share\
    \ the wealth” effort.\n\n[Table 2-18](../Text/ch011.xhtml#p200138f5ttt00023) continues\
    \ this examination for gender. Half of the applications from women were to the\
    \ Chemical Science and Technology Laboratory and the Materials Science and Engineering\
    \ Laboratory. These are also the two places where a greater proportion of women\
    \ receive awards. Other labs receive very few applications from women—the Building\
    \ and Fire Research Laboratory, for example. A second finding is that, in general,\
    \ the percentages for female applications are similar to the percentage of female\
    \ awardees. For example, 7 percent of applications to the Electronics and Electrical\
    \ Engineering Laboratory came from women, while 9 percent of awardees to this\
    \ lab were women. Additionally, 14 percent of women who applied for the NIST/NRC\
    \ RAP applied to this lab and 18 percent of women who received awards were in\
    \ this lab.\n\nAgain, it may be instructive to seek out explanations for differences\
    \ across the labs in terms of the gender (or for that matter, the race/ethnicity)\
    \ of postdocs. Possible explanations might focus on the role of lab staff in recruiting\
    \ women candidates; how female-friendly the lab is perceived to be; or the underlying\
    \ number of female doctorates in fields appropriate to the research of each lab.\
    \  \n\n ![](Images/t200138f5_23.png)\n\n### **Declined Offers**\n\nOne concern\
    \ heard at focus groups was that NIST was not quick enough at offering applicants\
    \ awards. Individuals were accepting other positions instead of coming to NIST.\
    \ This section looks at offers that were accepted and those that were declined.\
    \ [Table 2-19](../Text/ch011.xhtml#p200138f5ttt00024) shows the number and percentage\
    \ of offers declined among those who accepted or declined. On average, 7 people\
    \ per year decline to accept an award from NIST, compared with an average of 68\
    \ people per year for other RAPs.  \n\n ![](Images/t200138f5_24.png)\n\nSince\
    \ the number of research associates is relatively small for NIST, these declinations\
    \ may be more noticeable. Interestingly, the rate of declined offers is itself\
    \ declining. Perhaps the program is becoming more prestigious, the job market\
    \ has changed, or the offer process has changed.\n\n## **PRELIMINARY RESULTS**\n\
    \nOutreach efforts produce more qualified applicants than NIST has slots to fill\
    \ for research associates; and the pool of applicants includes many from top research\
    \ institutions and is increasingly diverse. Overall, 22 percent of applicants\
    \ were awarded an appointment—a lower ratio than for RAPs elsewhere. Women are\
    \ increasingly applying to the NIST/NRC RAP and being awarded research associateships.\
    \ The NIST/NRC RAP seems to be as popular as the other RAPs for women. Underrepresented\
    \ minorities are also increasingly applying to the NIST/NRC RAP and being awarded\
    \ research associateships. For applicants to the NIST/NRC RAP and awardees, at\
    \ least half came from 20 of the top doctoral-granting institutions in the United\
    \ States\n\nApplicants and awardees to the NIST/NRC RAP differ from their counterparts\
    \ in the other RAPs. Since 1990, underrepresented minorities are proportionately\
    \ more likely to be awarded a NIST/NRC Research Associateship than a research\
    \ associateship in another program. Applicants to, and awardees of, NIST research\
    \ associateships are younger on average than those who apply for other research\
    \ associateships. NIST/NRC RAP applicants and awardees are more likely to be single.\
    \ They are more likely to have Ph.D.s in the physical sciences than biological.\
    \ The majority of awards go to doctorates from the physical sciences. But, because\
    \ there are so many applications from this discipline, only about one in five\
    \ applicants with this background receive awards.\n\nPreliminary analysis suggests\
    \ that labs receive different amounts of applications and awards are not made\
    \ uniformly across different labs. Some awardees do decline NIST/NRC Research\
    \ Associateships, though the percentage of declined offers is often lower than\
    \ that for the other RAPs and has declined over time.\n\n## **RECOMMENDATIONS**\n\
    \n1\\. **NIST should conduct an evaluation of outreach efforts.**\n\na. To conduct\
    \ such an evaluation, data need to be collected. In this regard, the question\
    \ on the application about how applicants hear about the program is  helpful and\
    \ should be retained. However, the “Other” category should be further analyzed\
    \ and a choice of “Website” should be added as a category.\n\nb. Additional data\
    \ could be collected from NIST personnel and former or current NIST RAs. Such\
    \ data could be used to answer such questions as:\n\ni. What mechanisms do NIST\
    \ personnel and RAs use to interact with potential applicants and\n\nii. Which\
    \ mechanisms seem to work best?\n\niii. Has there been any effort to focus specifically\
    \ on diversity? How?"
