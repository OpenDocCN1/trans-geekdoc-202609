- raw: 'In 2004, the NRC Resident Research Associateship Program at NIST celebrated
    its 50th anniversary. The Program, administered by the Fellowships Office of the
    National Research Council (NRC), and carried out at the National Institute for
    Standards and Technology (NIST), provides postdoctoral opportunities in the sciences
    and engineering. Over the past 53 years, the program has supported over 1,300
    Research Associates. Anecdotally, the program is seen by current and former participants
    and staff at NIST and the NRC as a successful means to engage postdoctorates in
    important research and continue their training, as well as to assist NIST in meeting
    its mission, and grow a larger and more talented pool of scientists and engineers.
    There have been limited attempts to evaluate the program in general, using more
    quantitative evidence. This report was designed to assess the program, based on
    currently-available evidence and suggest approaches that NIST might consider in
    collecting data on the program and subjecting it to a more rigorous assessment.
    It was strongly hoped by the committee that NIST would undertake a more in-depth
    evaluation in the future and that this study would help lay some of the groundwork
    for NIST.


    This report has been reviewed in draft form by individuals chosen for their diverse
    perspectives and technical expertise, in accordance with procedures approved by
    the National Academies’ Report Review Committee. The purpose of this independent
    review is to provide candid and critical comments that will assist the institution
    in making its published report as sound as possible and to ensure that the report
    meets institutional standards for objectivity, evidence, and responsiveness to
    the study charge. The review comments and draft manuscript remain confidential
    to protect the integrity of the process.


    We wish to thank the following individuals for their review of this report: Dean
    Atkinson, Portland State University; Donald Bitzer, North Carolina State University;
    Booker Stephen Carpenter, National Institute of Standards and Technology (retired);
    Michael J. Finn, Oak Ridge Associated Universities; Jason Floyd, Hughes Associates,
    Inc.; Lee Sechrest, University of Arizona; Lewis Siegel, National Science Foundation;
    and Paula Stephan, Georgia State University.


    Although the reviewers listed above have provided many constructive comments and
    suggestions, they were not asked to endorse the conclusions or recommendations,
    nor did they see the final draft of the report before its release. The review
    of this report was overseen by Charles Phelps, University of Rochester. Appointed
    by the National Academies, he was responsible for making certain that an independent
    examination of this report was carried out in accordance with institutional procedures
    and that all review comments were carefully considered. Responsibility for the
    final content of this report rests entirely with the authoring committee and the
    institution.


    In addition, the committee would like to thank Jeovanny Paz, Jim Voytuk, Joe Finan,
    Charlie Fink, Suzanne White, Ray Gamble, and all in The National Academies’ Fellowships
    Office. In addition, we would like to thank Claire Saundry, Susan Heller-Zeisler,
    Hratch Semerjian and a special thanks to everyone at NIST who participated on
    our expert panels.


    Isaac Sanchez, *Chair*


