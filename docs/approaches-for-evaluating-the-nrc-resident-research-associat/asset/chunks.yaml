- raw: 'Such research could be undertaken via a combination of expert panels or surveys
    of NIST staff and current or former RAs to answer the first and third questions
    and to provide information for an assessment of the second question. Information
    should also be collected on the costs for individual outreach efforts (e.g., money
    spent on advertisements, time spent meeting with graduates) to compare to the
    benefits (how many applicants come from each individual outreach type).


    c. A second step to facilitate an evaluation of outreach efforts is to identify
    metrics for quantifying value obtained from different outreach strategies, such
    as hits to the website or number of graduate students met with at professional
    meetings.


    d. Examine individual outreach strategies for return on investment. This could
    include such strategies as assessing the NIST website for usability and informational
    content or assessing the return on advertising in publications. As part of the
    assessment of the NIST Web site, NIST could consider adding contact information
    for research advisors to facilitate a dialogue between potential applicants and
    relevant NIST staff.


    e. Finally, consider whether there might be other outreach strategies that are
    being underused currently, and which might have potential value, such as direct
    mail to deans, department heads and other university administrators.


    f. In addition, it is important to determine if any groups of graduate students—and
    potential applicants—who would make good candidates for the NIST/NRC RAP are unaware
    of the Program and how one applies. It would be difficult to craft a random sample
    of graduate students, but a limited survey might be possible.


    2\. **NIST should conduct an evaluation of individuals who decline offers of Research
    Associateships.** This could be done as a telephone interview or via a survey.
    As there are only a few people who decline each cycle, the burden would be relatively
    small. Two basic questions should be asked of those who are awarded but decline:
    (1) why are you declining, and (2) what are you planning to do instead?


    3\. **The NRC should amend the application form.** The number of fields should
    be reduced, in particular by collapsing very similar labels and by removing labels
    that are for multiple fields (e.g., “Biophysics Physics Biochemistry”). At least
    with regard to Ph.D. fields, an example of a smaller field list is found in the
    NSF’s Survey of Earned Doctorates (see [Appendix B](../Text/ch017.xhtml#p200138f5ddd00066)).


    4\. **The NRC should update the DataRAP database to replace organizational names
    (e.g., institutes or labs) that no longer exist at NIST with current equivalents.**


    # **3**


    # **Research Associates’ Experiences**


    Research Associates (RAs) spend up to two years in residence at NIST conducting
    research. During the expert panels we asked current and former research associates
    several questions about their experiences at NIST. Among the current RAs, they
    were quick to point out that this appointment was their first professional activity
    after graduate school and their first experience outside academia. Current research
    associates reported that one could have a fair amount of research freedom at NIST,
    but that it varied across labs and groups. Variation across different parts of
    NIST was perhaps one of the most important themes that emerged from the expert
    panels.


    The current research associates felt that the position gave them a broader view
    of science. They were overwhelmingly satisfied with the experience, noting that
    NIST was a great place to work. They also noted that being in the NIST/NRC RAP
    gave them better benefits and more access on the NIST campus. Finally, some participants
    felt that access to resources at places such as NIST were likely to be better
    than in other settings, such as academia.


    On the negative side, they felt that they faced additional bureaucracy by being
    in the program. Other concerns of current research associates included that there
    were no teaching opportunities and that there were few graduate students in their
    labs. Current RAs seemed to refer to the NIST/NRC RAP in terms of their recent
    academic experience and while some of them reported that their colleagues treated
    them as equals, others felt like they were the “lowest on the totem pole.” Internal
    review of manuscripts was also seen as something of a burden, again perhaps in
    reference to graduate school, although participants noted that in practice the
    delay caused by internal review was not long and that having additional reviewers
    helped improve their work.


    Current research associates’ suggestions for improving the program were to increase
    the salary, possibly increase the duration of the appointment, and create a better
    family leave policy. In referencing the salary, research associates believed the
    salary to be higher than many other—especially academic—postdoctoral positions.
    The annual base salary for a NIST RA is $60,000. The Sigma Xi postdoctoral survey
    noted that the average salary for postdocs was $38,000 (Davis, 2005). A recent
    survey of postdocs in the life sciences found that in 2006 the average salary
    for postdocs was $52,750 in industry; $50,000 in government; $40,000 in medical
    schools; and $38,000 in academia (Austin, 2006). They did, however, identify at
    least one postdoctoral position that they thought had a higher salary (Sandia),
    but primarily their motivation for increasing the salary tended to do with the
    high cost of living in the Washington metro area, where the majority of NIST RAs
    work. Participants mentioned that one reason for considering longer postdoctoral
    terms had to do with research associates’ shifting fields of research. They noted
    that moving into a new research area required significant time to get up to speed
    in that area and then at the end, there was a rush to conduct research and publish
    findings. Participants also believed that family leave was insufficient. They
    were concerned that if they took time off because of a new baby, they would simply
    lose time off their appointment, which was not replaced.


    Former research associates (and as noted in [Chapter 1](../Text/ch010.xhtml#p200138f5ddd00015),
    these were limited to those who stayed at NIST) also held the program in high
    esteem. Perhaps more so than the current research  associates, they viewed the
    program as very prestigious. The postdoc was seen as a good stepping stone, particularly
    for preparing for a government career. Former RAs saw several benefits to the
    program, including: collaboration (including the range of scientists or engineers
    worked with), a good stepping stone on the career pathway, and a good way to get
    a job at NIST. Former RAs still working at NIST were more likely to view their
    colleagues as treating them as professional colleagues, although this of course
    might be expected given that the former RAs were currently on temporary or career
    conditional appointments.


    On the negative side, some participants noted that the postdoc was not as helpful
    for RAs seeking academic positions in liberal arts colleges. Former RAs did note
    that NIST was not, in their view, set up to provide a lot of mentoring and that
    advising and mentoring were less common at NIST. They felt that RAs who needed
    a lot of mentoring or hand-holding did not do well at NIST, but that self-sufficiency
    and independence were characteristics of more successful (perhaps more satisfied)
    RAs. Neither described as a negative nor a positive, it was noted by former RAs
    that some RAs do not end up researching what they originally proposed in their
    applications.'
