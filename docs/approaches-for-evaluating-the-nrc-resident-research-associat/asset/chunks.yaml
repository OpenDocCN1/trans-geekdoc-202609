    impact of individual programs.[⁶](../Text/ch010.xhtml#p200138f5ftt00006) Such
    evaluation is important and can illuminate a number of impacts, including:


    |  ||  ⁶ However, there have been several program evaluations of federal S&E programs
    and the authors of those evaluations might disagree that the evaluations have
    not produced information about the impact of those programs. See for example:
    OSIRE (2003), McCullough and Thurgood (2004), Kimsey in NRC (2006a), Mantovani
    et al. (2006), Michie et al. (2007), and Finkelstein and Libarkin (undated). |


    | --- | --- |


    • The program’s success in fostering diversity across gender, race/ethnicity,
    and/or socioeconomic status;


    • The effectiveness of an agency’s information dissemination strategies;


    • Benefits to the recipients, the agency, and the nation as measured by the quality
    of the scholars’ experiences in the program; and


    • Benefits to recipients, the agency, and the nation as measured by the careers
    of postdocs.


    It was in this spirit that the National Institute of Standards and Technology
    (NIST) approached The National Academies to undertake a study of the NRC Resident
    Research Associateship Program at NIST (hereafter “NIST/NRC RAP”).


    ## **THE NRC RESIDENT RESEARCH ASSOCIATESHIP PROGRAM AT NIST**


    As noted above, the Fellowships Office of the National Research Council (NRC)
    of the National Academies administers a series of postdoctoral programs at several
    federal agencies. Collectively, these programs are known as the NRC Resident Research
    Associateship Programs. The Programs were established in 1954, modeled after the
    Rockefeller Foundation Fellowship program administered by the NRC from 1919 to
    1955. NIST was the first sponsor: “The initial sponsorship of the RAP was through
    the National Bureau of Standards (now NIST) in 1954. NIST was joined by the Naval
    Research Laboratory in 1955 and other sponsors soon followed. The Research Associateship
    programs have continued to expand to the present day where over 30 federal agencies
    participate.”[⁷](../Text/ch010.xhtml#p200138f5ftt00007) The NRC has made more
    than 1,000 awards in the NRC Resident Research Associateship Program at NIST.
    (Overall, the NRC has made 11,000 awards to postdoctoral and senior scientists
    and engineers to conduct research in federal laboratories.)


    |  ||  ⁷ This information is adapted from The National Academies’ RAP website,
    “Mission,” available at: [http://www7.nationalacademies.org/rap/RAP\_Mission\_Statement.html](http://www7.nationalacademies.org/rap/RAP_Mission_Statement.html).
    \[Accessed June 24, 2007.\] |


    | --- | --- |


    A NRC Resident Research Associate at NIST is a researcher and a term (temporary)
    employee of NIST. Associateships are analogous to fellowships or similar temporary
    employment programs at the postdoctoral level in universities and other organizations.
    Awardees are offered two-year term civil service appointments. During their tenure,
    Associates conduct research in one of six areas of interest to NIST: chemistry,
    computer science, engineering, materials science, mathematics, and physics. Associates
    devote their full-time effort to the research program proposed in their applications
    and are in residence at the sponsoring laboratory at NIST during the entire period
    of the Associateship.[⁸](../Text/ch010.xhtml#p200138f5ftt00008)


    |  ||  ⁸ However, during the expert panels held with NIST/NRC Research Associates
    (see description at the end of this chapter), it was noted that some Research
    Associates work on research projects other than what they proposed in their application
    packages. This fact is independent of whether such change is a positive or negative
    for the Research Associate. It is not clear how often this happens. |


    | --- | --- |


    According to the NRC, the objectives of the programs are “(1) to provide postdoctoral
    scientists and engineers of unusual promise and ability opportunities for research
    on problems, largely of their own choice that are compatible with the interests
    of the sponsoring laboratories and (2) to contribute thereby to the overall efforts
    of the federal laboratories. For recent doctoral graduates, the programs provide
    an opportunity for concentrated research in association with  selected members
    of the permanent professional laboratory staff, often as a climax to formal career
    preparation. Participating laboratories receive a stimulus to their programs by
    the presence of bright, highly motivated, recent doctoral graduates with records
    of research productivity. New ideas, techniques, and approaches to problems contribute
    to the overall research climate of the laboratories. Indirectly, associateships
    also make available to the broader scientific and engineering communities the
    excellent and often unique research facilities that exist in federal laboratories.”[⁹](../Text/ch010.xhtml#p200138f5ftt00009)
    Associates are encouraged to publish their research in refereed science and engineering
    journals, and many also present papers at U.S. and international conferences.


    |  ||  ⁹ NRC, “NRC Associateships Research Opportunities Directory.” Available
    at: [http://nrc58.nas.edu/pgasurvey/data/aobooks/rapbooks.asp?mode=frntmtr&progctr=50&seq=20](http://nrc58.nas.edu/pgasurvey/data/aobooks/rapbooks.asp?mode=frntmtr&progctr=50&seq=20).
    |


    | --- | --- |


    The objectives for each agency participating in the Research Associateship Programs
    may go beyond the NRC’s goals, emphasize different aspects, or vary from the objectives
    of other agencies. The objectives of the NIST/NRC RAP, as stated by NIST, are:
    “The postdoctoral program brings research scientists and engineers of unusual
    promise and ability to perform advanced research related to the NIST mission,
    introduces the latest university research results and techniques to NIST scientific
    programs , strengthens mutual communication with university researchers, shares
    NIST unique research facilities with the U.S. scientific and engineering communities,
    and provides a valuable mechanism for the transfer of research results from NIST
    to the scientific and engineering communities.”[^(10)](../Text/ch010.xhtml#p200138f5ftt00010)


    |  ||  ^(10) Office of Academic Affairs, “Office of Academic Affairs.” Available
    at: [http://www.nist.gov/oiaa/acdmaffr.htm](http://www.nist.gov/oiaa/acdmaffr.htm).
    |


