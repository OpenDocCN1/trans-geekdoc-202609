    \ DataRAP Database, tabulations by staff. |\n\n## **RESEARCH ADVISORS’ EVALUATION\
    \ OF RESEARCH ASSOCIATES**\n\nThe current evaluation of the associate by the research\
    \ advisor (see [Appendix I](../Text/ch024.xhtml#p200138f5ddd00073)) is limited\
    \ as it is currently not filled out by many advisors, does not go into much depth\
    \ concerning the value of the program, and is currently designed to tackle to\
    \ separate objectives: whether the evaluation is for the renewal of their term\
    \ (where the data are collected by the host agency) or for the end of the term\
    \ (where the data are collected by the NRC).\n\n## **PRELIMINARY RESULTS**\n\n\
    Currently available data do not allow for a program evaluation of immediate outcomes\
    \ of the Program. Little data are collected on Research Associates’ experiences\
    \ or on research advisors’ evaluation of Research Associates. Data are also not\
    \ collected on the value of the program to NIST or to the broader scientific and\
    \ engineering community.\n\nSecond, with the caveat that this conclusion is based\
    \ on very limited data that may be biased by nonresponse, NIST/NRC RAs are as\
    \ productive as Research Associates in other programs. NIST/NRC RAs, statistically\
    \ were more likely to receive an award or give domestic presentations than Research\
    \ Associates in other Programs. Conversely, they published fewer journal articles.\
    \ However,while these differences were statistically significant, they were not\
    \ substantively large. NIST/NRC RAs patent or give international presentations\
    \ comparably with Research Associates in other Programs. Finally, and subject\
    \ to the same caveat, RAs are quite satisfied with the program. On a scale of\
    \ 1 to 10, with 10 being excellent, NIST/NRC RAs rated short-term and long-term\
    \ value of the program; lab, advisor, administrative (NIST and NRC) support between\
    \ 7.7 and 8.5. In half the categories NIST/NRC RAs and RAs in other programs reported\
    \ statistically similar levels of satisfaction.In the other half, other RAs reported\
    \ higher levels of satisfaction.\n\n## **RECOMMENDATIONS**\n\n1\\. **NIST should\
    \ conduct a more thorough assessment of RAs’ experiences during the postdoctoral\
    \ appointment, their satisfaction with and views on the benefits of the Program,\
    \ and NIST staff’s satisfaction with and views on the benefits of the Program.**\n\
    \na. To assist in this, the NRC should redesign the final report and the Research\
    \ Advisor’s evaluation form to maximize the collection of data from these instruments\
    \ (see [Box 3-1](../Text/ch012.xhtml#p200138f5bbb00078) and [Box 3-2](../Text/ch012.xhtml#p200138f5bbb00082)\
    \ for suggested questions).\n\nb. The final report and the Research Advisor’s\
    \ evaluation should be made mandatory.\n\nc. Some elements of the current data\
    \ collected could be subjected to further analysis.\n\ni. For example, NIST may\
    \ wish to conduct further analysis on peer-reviewed journals, for example by:\n\
    \n1\\. asking whether the RA was sole or lead author,\n\n2\\. examining whether\
    \ RAs publish with NIST staff, and\n\n3\\. examining the quality of the journals\
    \ in which RAs publish, although this requires some ranking of journals.\n\nii.\
    \ NIST may wish to conduct an impact analysis of RAs’ productivity, for example\
    \ by:\n\n1\\. conducting a citation analysis to see how often RAs’ publications\
    \ are referenced by others (note this can be accomplished using citation indexes),\
    \ or\n\n2\\. assessing the type or size of grants postdocs receive."
