    Figures [2-9](../Text/ch011.xhtml#p200138f5mmm00009) and [2-10](../Text/ch011.xhtml#p200138f5mmm00010)
    repeat the earlier analysis on successful applicants by gender, for race/ethnicity.
    Here the success rates are compared for underrepresented minorities against whites
    and Asians. The trend line for underrepresented minorities is quite volatile,
    as there are few applicants, which makes proportion of awardees among applicants
    jump around quite a bit. The success rate is similar for the two groups in both
    the NIST/NRC RAP and other RAPs.


    ![](Images/p200138f5g44001.png)


    FIGURE 2-9 Success rate of applications to NIST/NRC Research Associateship Program,
    by race/ethnicity, 1965-2007.


    Note: No awards were made in the NIST program in 1986. In 2007, not all application
    cycles have been completed and recorded in the database.


    Source: National Academies, DataRAP Database, tabulations by staff.


    ![](Images/p200138f5g45001.png)


    FIGURE 2-10 Success rate of applications to all other Research Associateship Programs,
    by race/ethnicity, 1965-2007.


    Note: In 2007, not all application cycles have been completed and recorded in
    the database.


    Source: National Academies, DataRAP Database, tabulations by staff.


    ### Institution


    One area of interest for NIST in assessing the NIST/NRC RAP was to examine the
    doctoral-granting institutions of applicants. Since one goal for NIST was to attract
    the best and the brightest, there was an expectation that many applicants had
    received Ph.D.s from what were considered to be top institutions. At the same
    time, it is true that top candidates can come from a wide range of institutions,
    so there was also an expectation that there would be some diversity in the range
    of doctoral-granting institutions of applicants to the program. Applicants were
    requested on the application form to identify their educational experience and
    institutions attended. We focused on the institutions that awarded applicants
    their doctorates, and in particular the top 20 institutions for applications and
    acceptances are listed below. (Some applicants failed to identify their doctoral-granting
    institutions: 2 applicants for NIST/NRC RAP applicants and 86 cases among other
    RAP applicants. These cases were excluded from the analysis. Overall, applications
    to the NIST/NRC RAP came from Ph.D.s who had received their Ph.D.s from a total
    of 333 institutions; while applicants to the other RAPs had received doctorates
    from 1534 institutions. This is likely due in part to the U.S. citizenship requirement
    for the NIST/NRC RAP. Concerning acceptances, all of those awarded an NIST/NRC
    RAP identified their doctoral-granting institutions; but 14 of those awarded another
    Research Associateship did not. NIST/NRC RAs received doctorates from 173 different
    institutions. RAs for other RAPs received doctorates from 983 different institutions.
    As [Figure 2-11](../Text/ch011.xhtml#p200138f5mmm00011) shows, applicants to NIST
    come from a large number of institutions.


    ![](Images/p200138f5g46001.png)


    FIGURE 2-11 Number of doctoral-granting institutions for applicants to the NIST/NRC
    Research Associateship Program, 1965-2007.


    Note: In 2007, not all application cycles have been completed and recorded in
    the database.


    Source: National Academies, DataRAP Database, tabulations by staff.


    In the next two tables, data are presented on the top 20 doctoral-granting institutions
    for applicants and awardees for the NIST/NRC RAP and for the other RAPs.


    ![](Images/t200138f5_14.png) ![](Images/t200138f5_15.png)


    The tables show quite a bit of overlap. A first point for the NIST/NRC RAP is
    that the top 20 institutions are all major research institutions. They are all
    classified as Research I institutions under the 1994 Carnegie classification scheme.
    Second, 44 percent of all applications to the NIST/NRC RAP come from individuals
    at 20 institutions and just over half of all awards were made to applicants from
    20 institutions.


    Next we looked just at NIST, by selected S&E fields. First, in [Table 2-14](../Text/ch011.xhtml#p200138f5ttt00016),
    the number of doctoral-granting institutions, from which applicants and awardees
    received their Ph.D.s are examined. As [Table 2-14](../Text/ch011.xhtml#p200138f5ttt00016)
    shows, excepting agricultural sciences and natural resources, the applicants come
    from a large number of institutions. Even in the biological sciences, which produce
    few applications, there were a relatively high number of universities represented.


    TABLE 2-14 Number of Universities from Which Applicants and Awardees Received
    Their Ph.D.s, by Field, 1965-2007


    | Discipline | No. of Schools (Applicants) | No. of Schools (Accepted) |

    | :--- | :-: | :-: |

    | Agric. Sciences/Nat. resources | 1 | 0 |

    | Bio/Biomed/Health | 49 | 25 |

    | Engineering | 156 | 80 |

    | Mathematics | 97 | 45 |

    | Physical sciences | 282 | 152 |

    | Note: In 2007, not all application cycles have been completed and recorded in
    the database. | | |

    | Source: National Academies, DataRAP Database, tabulations by staff. | | |


