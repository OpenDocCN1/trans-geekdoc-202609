    奖学办公室在研究助理完成其博士后任期时对其进行任期后退出调查。该调查由一份书面问卷组成，虽然名义上是强制，但许多博士后并未填写。此外，还要求研究助理的导师提供一份评估表。这两项评估的关键变量包括：


    • 对研究助理在创新思维、领域知识、动机/主动性、综合科学能力、独立研究和研究技术方面的评估；

