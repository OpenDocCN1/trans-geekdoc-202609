    Overall, interest in postdoctoral positions has tracked upwards since the 1960s,
    as noted in the data tables in [Appendix E](../Text/ch020.xhtml#p20013f5ddd0069).
    In general, applications to the NIST/NRC RAP tend to track the other RAPs. Applications
    peaked in the early 1970s (1970-1972) and again in the mid-1990s (1992-1995).
    The reduced number of applications between these two periods likely reflects alternative
    employment. In particular, the upswing in the early 1990s may reflect tougher
    times for finding a regular appointment. Some of the volatility in the NIST/NRC
    RAP may also be a result of changes in outreach efforts. However, data are not
    available on employment preferences of applicants or on efforts to recruit applicants
    over time. As a final note, in every year, there are more applicants than positions.


    The next figure examines the number of applicants to NIST and other Research Associate
    positions and the number of those accepted to the respective programs. [Figure
    2-3](../Text/ch011.xhtml#p200138f5mmm0003) compares the acceptance rate for applicants
    overall to the NIST/NRC RAP and to all other RAPs. (See [Appendix E](../Text/ch020.xhtml#p20013f5ddd0069)
    for underlying data.) For those with S&E degrees, from 1965 through February 2007,
    NIST awardees totaled 1,383—or 22 percent of applicants for NIST/NRC Research
    Associate positions; while other RAP awardees totaled 9,810—or 29 percent of applicants
    for other RAPs. In general, the NIST/NRC RAP is more competitive, in the sense
    that percentage of awardees to applicants is lower.


