    ### NRC Support


    Finally, Research Associates are asked to appraise administrative support provided
    by the NRC. It is the case that all Research Associates have interaction with
    the NRC, as it administers the RAPs. Interestingly, more respondents answered
    this question than the questions on support, even though this question appears
    last on the list. Twenty-six percent (of 253) `NIST/NRC` Research Associates and
    21 percent (of 6,936) of research associates from other RAPs provided information
    on this category. Among those who responded, as seen in [Table 3-11](../Text/ch012.xhtml#p200138f5ttt00036),
    in general, there was positive feedback from Research Associates with average
    score of `8.8`. However, in this instance, there was a larger difference between
    `NIST/NRC` Research Associates and Research Associates of other RAPs (`8.0` to
    `8.8`). This difference is statistically significant at the `0.05` level. There
    is no evidence as to why `NIST/NRC` Research Associates were lower.


    ### TABLE 3-11 Research Associates’ Appraisal of the NRC, by Program


