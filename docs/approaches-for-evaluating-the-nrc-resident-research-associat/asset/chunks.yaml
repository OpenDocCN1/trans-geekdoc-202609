    The dataset contained 24,849 applications, of which 2,743 were applications to
    the NIST/NRC RAP. The number of applicants is much less than this since applicants
    can apply for multiple positions in the same year or across years. (Because the
    NIST/NRC RAP was until recently reviewed once per year, there are only a handful
    of cases where an applicant applied more than once per year to this particular
    program.)`[^(38)](../Text/ch011.xhtml#p200138f5ftt00038)` In assessing how applicants
    heard about the program, we combined information from individuals who applied
    for multiple positions, if they selected different information sources, into a
    single record. This was done because in most cases, an applicant applying to multiple
    positions identified the same source in each case. Thus, the dataset was updated
    so that there was one record for each individual, regardless of how many applications
    they submitted.


    An exception occurred for applicants who applied to both the NIST/NRC RAP and
    any other RAP. Since a goal is to compare the sources identified by applicants
    to NIST and all other federal agency RAP postdoctoral positions, any individual
    who applied to both programs remained in the database twice. Two hundred and thirty-six
    individuals who applied to both NIST and other federal positions at the same time
    fit this exception. After reducing duplicate entries, the database consisted of
    12,737 records: 2,717 applicants to NIST and 10,020 applicants to other federal
    RAPs (with 236 applicants appearing on both lists). The NIST applicants identified
    a total of 2,890 sources and the non-NIST applicants identified a total of 10,497
    sources.


    | | ^^(38) It is not clear if this is a data entry error. |

    | --- | --- |


    As `[Table 2-3](../Text/ch011.xhtml#p200138f5ttt00005)` shows, the applicants
    to the NIST/NRC RAP were twice as likely as applicants to the other RAPs to hear
    about the position initially from their Ph.D. advisor or other professor and somewhat
    more likely to hear about the program from colleagues or fellow graduate students.
    Surprisingly, they were less likely to hear about the program from a research
    advisor or other scientific staff at the federal laboratory, compared with applicants
    to other federal RAPs.


    ### TABLE 2-3 How Applicants First Heard About the Research Associateship Program,
    1989-2007


    | Source of Information | NIST/NRC RAP (%) | Other RAPs (%) | All Programs (%)
    |

    | :-- | :-: | :-: | :-: |

    | Colleague | 23.3 | 20.9 | 21.4 |

    | Professor | 33.7 | 16.6 | 20.3 |

    | Placement office | 1.0 | 1.7 | 1.5 |

    | NRC associate | 8.2 | 9.3 | 9.1 |

    | Laboratory staff | 18.0 | 26.7 | 24.8 |

    | Journal | 3.0 | 8.7 | 7.4 |

    | NRC staff | 0.2 | 0.3 | 0.3 |

    | Professional meeting | 4.8 | 5.3 | 5.2 |

    | Other | 7.8 | 10.6 | 10.0 |

    | Source: National Academies, DataRAP Database, tabulations by staff. |


    Regarding advertisements in professional publications, applicants to NIST/NRC
    RAP identified about 30 publications, while applicants to non-NIST RAPs identified
    approximately 190 publications. (However, since the other RAPs include a broader
    set of fields, this larger number of publications should be expected and the smaller
    number of publications for the NIST/NRC RAP is not an indication, by itself, of
    less effort to reach potential applicants via publications. Top publications identified
    by applicants to NIST/NRC RAP: *Physics Today*, Fellowships Office mailing, *Chemical
    & Engineering News*, *Mechanical Engineering*, *Spectrum of the IEEE*, and *Science*.
    Examining trends in the sources cited over time, as is done in `[Table 2-4](../Text/ch011.xhtml#p200138f5ttt00006)`,
    shows that applicants for NIST/NRC RAs did not usually first find out about the
    program via an advertisement in a publication.)


    ![](Images/t200138f5_6.png)


    Journals seemed to be more important as a source in the first half of the 1990s
    than in the current decade. Another finding of note is that placement offices
    at universities tend to be an infrequently cited source of information. Although
    the committee did not have prior expectations, it was still a bit surprising that
    the proportion of applicants hearing about the program from former or current
    RAs was not that great.


    We next examined some characteristics of applicants to the NIST/NRC RAP to see
    if different types of applicants differed on how they first heard about the program.
    Comparing men and women, we found no significant differences, except for presentations
    at professional meetings, where women were twice as likely as men to first hear
    about the program.


    ### TABLE 2-5 How Applicants to the NIST/NRC Research Associateship Program First
    Heard About the Program, by Gender, 1989-2007


