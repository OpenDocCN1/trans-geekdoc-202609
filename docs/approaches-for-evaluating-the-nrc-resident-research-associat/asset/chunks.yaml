  trans: '


    其次，各领域的获奖者占百分比是多少？如表 2-8 所示，奖项的分布与申请的分布相当一致。因此，对于 NIST 博士后而言，72% 的申请来自物理科学领域的博士，而
    69% 的 NIST 博士后奖项也授予了物理科学领域的博士。


    ![](img/t200138f5_12.png)


    第三，各主要领域获奖人数与申请人数的比例是多少？如表 2-9 所示，尽管 NIST/NRC RAP 收到的来自广义定义的生物科学领域博士的申请较少，尽管它也选拔了少数生命科学家担任研究助理（RA）职位，但在这一小部分申请者中，获得研究助理职位（Research
    Associateships）的博士比例相对相当高——接近 40%。相反，如果背景是物理科学领域，获得研究助理职位的比例上要困难得多：仅 21%。


    表 2-11 按研究助理计划和申请者主要领域划分的奖项占比，1965-2007


    | 领域 || NIST/NRC RAP (%) || 其他 RAP (%) |

    | :-- | :-: | :-: |

    | 农业/自然资源 | 0.0 || 26.0 |

    | 生物/生物医学/健康 | 37.5 || 33.2 |

    | 工程 | 25.1 || 27.2 |

    | 数学/计算机科学 | 24.8 || 26.0 |

    | 物理 | 21.3 || 29.4 |

    | 所有领域 | 22.5 || 29.5 |

    | 来源：美国国家科学院，DataRAP 数据库，职员统计。 | |


    ### 性别


    近年来的多项研究（尽管这无疑不是一个新问题）都关注了鼓励女性从事科学与工程（S&E）领域职业的努力。正如本章前面提到的，女性获得博士学位的比例正在增加，但他们在就业方面尚未取得类似的成果。部分原因是女性晋升到更高级别的职位（例如学术界的正教授）需要时间，因此较最近的进展可能尚未在就业特征中得到显现。尽管如此，让女性在职业生涯初期获得鼓励是非常重要的——而
    NIST/NRC RAP 无疑可以是一个很好的跳板。下图通过将 NIST/NRC RAP 的情况与其他 RAP 以及总体池进行比较，研究了申请者和获奖者比例在性别比例上是否存在差异。


    ![](img/p200138f5g38001.png)


    图 2-3 按研究助理计划划分的女性申请者占比，1965-2007。


    来源：美国国家科学院，DataRAP 数据库，职员统计。


    ![](img/p200138f5g39001.png)


    图 2-4 按研究助理计划划分的女性获奖者占比，1965-2007。

    注：1986 年 NIST 项目未授予任何奖项。2007 年并非所有申请周期都已完成并记录在数据库中。

    来源：美国国家科学院，DataRAP 数据库，职员统计。


    图 2-3 和 2-4 显示，女性越来越多地申请 NIST/NRC RAP；而且对于申请者来说，NIST/NRC RAP 与其他 RAP 一样受欢迎。然而，女性申请或获得奖项的比例低于女性获得博士学位或意图从事博士后研究的比例（比较数据请参见附录
    E）。


    接下来，按性别比较了这两个项目的申请成功率。以下图表涉及的问题是，男性和女性的总体申请是否产生了相似的获奖率。对于 NIST/NRC RAP 的申请者来说，这两个趋势波动较大，但大致相似，如图
    2-5 所示。如图 2-6 所示，男性和女性的获奖率轨迹非常接近，尽管女性的申请更容易产生获奖者。


    ![](img/p200138f5g40001.png)


    图 2-5 按性别划分的 NIST/NRC 研究助理计划申请成功率，1965-2007。

    注：1986 年 NIST 项目未授予任何奖项。2007 年并非所有申请周期都已完成并记录在数据库中。

    来源：美国国家科学院，DataRAP 数据库，职员统计。


    ![](img/p200138f5g41001.png)


    图 2-6 按性别划分的所有其他研究助理计划申请成功率，1965-2007。

    注：2007 年并非所有申请周期都已完成并记录在数据库中。

    来源：美国国家科学院，DataRAP 数据库，职员统计。


    ### 种族/族裔


    本节通过将 NIST/NRC RAP 的申请者与其他 RAP 的申请者以及总体池进行比较，研究了种族/族裔在申请者和录取申请者比例上是否存在差异。在分析之前有两个说明。首先，由于非白人的申请者和获奖者人数非常少（这反映了在
    S&E 领域获得博士学位的少数群体人数相对较少），我们将个人种族/族裔类别合并为三组：白人、代表性少数族、亚洲人和未知。这里的代表性少数族是指：美国印第安人或阿拉斯加原住民；黑人或非洲裔美国人；西班牙裔；夏威夷人或其他太平洋岛民。亚洲人指的是亚洲或太平洋岛民或亚洲人。许多人没有填写申请表上的这个可选问题。其次，这些数据在
    1980 年之前未收集。最后，这里的百分比是在标明种族/族裔的人群中代表性少数族的比例。


    ![](img/p200138f5g42001.png)


    图 2-7 按研究助理计划划分的代表性少数族申请者占比，1980-2007。

    注：2007 年并非所有申请周期都已完成并记录在数据库中。

    来源：美国国家科学院，DataRAP 数据库，职员统计。


    根据上述图 2-7，随着时间的推移，NIST 收到的代表性少数族申请更多，尽管近期有所下降。这种下降需要进一步调查。通常情况下，代表性少数族的申请在 NIST/NRC
    RAP 和其他 RAP 之间是相当的。然而，代表性少数族申请或获得奖项的比例通常低于代表性少数族获得博士学位或意图从事博士后研究的比例（比较数据请参见附录
    E）。


    ![](img/p200138f5g43001.png)


    图 2-8 按研究助理计划划分的代表性少数族获奖占比，1980-2007。

    注：1986 年 NIST 项目未授予任何奖项。2007 年并非所有申请周期都已完成并记录在数据库中。

    来源：美国国家科学院，DataRAP 数据库，职员统计。


    NIST 对少数族族的奖项在 1990 年代也高于 1980 年代；这是一个积极的信号，尽管考虑到在 1980 年代几乎没有代表性少数族获得奖项，这并不容易。在过去几年，代表性少数族的获奖人数出现了明显的下降趋势，这一点需要进一步审查。


    在两幅图中，NIST/NRC RAP 的趋势线波动较大，可能部分由于是将一个项目与多个项目的汇总情况进行比较。然而，由于数据限制，看来 NIST/NRC RAP
    在授予代表性少数族研究助理职位的比例上，通常比其他 RAP（总体）更具多样性。在识别招聘申请者的最佳实践方面，观察 NIST/NRC RAP 与其他 RAP
    之间是否存在不同的推广策略可能具有启发意义。


