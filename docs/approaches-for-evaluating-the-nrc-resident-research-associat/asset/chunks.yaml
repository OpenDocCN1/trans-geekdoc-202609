    # 附录 A


    ## 委员会成员简介


    Isaac C. Sanchez 博士（NAE），担任德克萨斯大学化学工程系 William J. Murray 特座教授。Isaac C. Sanchez
    博士于 1969 年在特拉华大学获得化学工程博士学位。他于 1988 加入德克萨斯大学奥斯汀分校教学院。1997 年当选国家工程院，这是工程领域的最高荣誉。Sanchez
    研究聚合物液体、溶液和混合物的性质。他通过研究聚合物界面现象以及温度、压力和体积的变化如何影响聚合物来解决聚合物科学和工程问题。Sanchez 开发模型并使用计算机模拟来理解聚合物的溶解度和构象以及水在聚合物工艺中的作用。


    Burt Barnow 博士是约翰霍普金大学政策研究所副主任兼首席科学家。Barnow 博士在马萨诸理工学院获得经济学学士学位，在威斯康星大学麦迪逊分校获得经济学博士学位。他的工作重点是劳动力市场的运作和社会计划评估，他目前的研究包括对福利工作计划的评估、对培训美国工人从事目前持
    H-1B 签证入境工作的项目的评估，以及对新罕布什州福利改革的评估。Barnow 博士还在研究所的公共政策计划教授计划评估，并在经济系教授劳动力经济学。在进入约翰霍普金大学之前，他曾在华盛顿特区的一家咨询公司担任总裁。Barnow
    博士在劳工部工作过多年，最近担任就业和培训管理局研究评估办公室处长。Barnow 博士是高等教育委员会、第六类和富尔布莱特-海斯国际教育计划审查委员会、国家太空探索愿景劳动力需求委员会的成员，并曾信息技术劳动力需求委员会的成员兼副主席。


