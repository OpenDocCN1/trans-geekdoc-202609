    数据集包含 24,849 申请，其中 2,743 份是 NIST/NRC RAP 的申请。申请人数远少于这一数字，因为申请者可以在同一年或跨年申请多个职位。（由于
    NIST/NRC RAP 直到最近都是每年评审一次，因此只有少数情况下申请者在一年内多次申请了这一特定项目。）`³⁸` 在评估申请者是如何获知该计划时，我们将申请了多个职位且选择了不同信息来源的个人信息合并为单条记录。这样做是因为在大多数情况下，申请多个职位的申请者在每个情况下都识别出了相同的来源。因此，数据集进行了更新，使得每个人都有一条记录，无论他们提交了多少份申请。


    对于同时申请了 NIST/NRC RAP 和任何其他 RAP 的申请者，存在例外。由于目标是比较申请者识别的 NIST 以及所有其他联邦机构 RAP 博士后职位的来源，因此任何申请了这两个项目的个人在数据库中保留了两次。有
    236 人同时申请了 NIST 和其他联邦职位，符合这一例外。在剔除重复项后，数据库包含 12,737 条记录：2,717 名 NIST 申请者和 10,020
    名其他联邦 RAP 申请者（其中有 236 名申请者同时出现在两个列表中）。NIST 申请者总共识别出 2,890 个来源，非 NIST 申请者总共识别出
    10,497 个来源。


    | | ^³⁸ 不清楚这是否为数据输入错误。 |

    | --- | --- |


    如 `表 2-3` 所示，NIST/NRC RAP 的申请者最初通过其博士导师或其他教授获知职位的概率是其他 RAP 申请者的两倍，且通过同事或研究生获知该计划的概率也略高。令人惊讶的是，与其他联邦
    RAP 的申请者相比，他们通过联邦实验室的研究导师或其他科学人员获知该计划的概率较低。


    ### 表 2-3 1989-2007 年申请者首次获知研究助理计划的情况


    | 信息来源 | NIST/NRC RAP (%) | 其他 RAPs (%) | 所有计划 (%) | |

    | :-- | :-: | :-: | :-: |

    | 同事 | 23.3 | 20.9 | 21.4 |

    | 教授 | 33.7 | 16.6 | 20.3 |

    | 就业办公室 | 1.0 | 1.7 | 1.5 |

    | NRC 关联 | 8.2 | 9.3 | 9.1 |

    | 实验室人员 | 18.0 | 26.7 | 24.8 |

    | 期刊 | 3.0 | 8.7 | 7.4 |

    | NRC 工作人员 | 0.2 | 0.3 | 0.3 |

    | 专业会议 | 4.8 | 5.3 | 5.2 |

    | 其他 | 7.8 | 10.6 | 10.0 |

    | 来源：美国科学院，DataRAP 数据库，工作人员统计表。 |


    关于专业出版物中的广告，NIST/NRC RAP 的申请者识别了约 30 出版物，而非 NIST RAP 的申请者识别了约 190 出版物。（然而，由于其他
    RAP 涵盖更广泛的领域，这种较多的出版物数量是预期的，且 NIST/NRC RAP 出版物较少本身并不意味着通过出版物触达潜在申请者的努力较少。NIST/NRC
    RAP 申请者识别的顶级出版物包括：*物理今日* (Physics Today)、学金办公室邮件、*化学与工程新闻* (Chemical & Engineering
    News)、*机械工程* (Mechanical Engineering)、*IEEE 射谱* (Spectrum of the IEEE) 和《科学》(Science)。通过检查随时间变化的所引来源趋势（如
    `表 2-4` 所示），可以看出 NIST/NRC RAAs 申请者通常不是通过出版物广告首次获知该计划的。）


    ![](img/t200138f5_6.png)


    期刊在 20 世纪 90 年代前半叶作为来源比在当前十年更重要。另一个值得注意的发现是大学的就业办公室往往是一个很少被引用的信息来源。尽管委员会没有预先预期，但从前任或现任
    RA 处获知计划的申请者比例并不大仍然令人惊讶。


    我们接着检查了 NIST/NRC RAP 申请者的某些特征，以查看不同类型的申请者在首次获知计划的方式上是否存在差异。比较男性和女性，我们没有发现显著差异，但在专业会议的演示方面，女性首次获知该计划的概率是男性的两倍。


