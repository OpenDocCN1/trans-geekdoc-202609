    ## 美国国家科学院

    *国家科学、工程和医学的顾问*


    美国国家科学院是一个私营、非营利、自我延续的协会，由杰出的学者组成，致力于科学和工程研究，致力于促进科学技术的发展及其造福社会福利。根据国会于 1863 年授予的宪章，科学院有一项使命，要求其在科学和技术事务方面向联邦政府提供建议。Ralph
    J. Cicerone 博士是美国国家科学院院长。


    国家工程院于 1964 年根据国家科学院的宪章成立，是一个由优秀工程师组成的平行机构。它在管理和成员选择方面具有自主性，与国家科学院共同承担向联邦政府提供建议的责任。国家工程院还赞助旨在满足国家工程计划，鼓励教育和研究，并表彰工程师的卓越成就。Charles
    M. Vest 博士是国家工程院院长。


    医学研究所由国家科学院于 1970 年建立，旨在确保相关领域的杰出成员在审查与公共健康相关的政策方面提供服务。该研究所根据国会宪章授予国家科学院的责任运行，即作为联邦政府的顾问，并主动识别医疗保健、研究和教育问题。Harvey
    V. Fineberg 博士是医学研究所院长。


    国家研究委员会由国家科学院于 1916 年组织，旨在将广泛的科技界与科学院促进知识和向联邦政府建议的宗旨联系起来。委员会根据科学院确定的一般政策运行，已成为国家科学院和国家工程院向政府、公众以及科学和工程界提供服务的主要运营机构。该委员会由两所科学院和医学研究所共同管理。Ralph
    J. Cicerone 博士和 Charles M. Vest 博士分别担任国家研究委员会主席和副主席。


    [www.national-academies.org](http://www.national-academies.org)


