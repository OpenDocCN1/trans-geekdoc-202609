    在最近一波的科学发展调查（SDR）中（数据收集于 2006 年，但在编制本报告时尚未可用）——增加了一系列关于博士后的问题。问题包括：受访者目前是否担任博士后工作，以及该个人曾过的多少次博士后任命。对于每项任命，受访者被要求提供开始和结束日期、担任该职位的主要原因、就业部门（例如学术界、工业界、政府）、雇主是否提供医疗或退休福利，以及最近或当前的博士后任命对受访者的影响程度有多大（例如：增加知识、研究技能、职业机会）。如果这些问题在未来的
    SDR 中继续被询问，这些数据对于获取博士后经历的广泛图景将非常有帮助。


    Sigma Xi 科学会（Sigma Xi）与国家博士后协会（PDA）、美国科学促进会（AAAS）以及美国经济研究所（NBER）合作，于 2003 年对博士后进行了一次性调查。调查邀请发送给
    174 机构的 1,432 名教务和副教务、院长、人力资源人员以及博士后办公室和协会的领导者。其中，46 机构同意参与，包括前 20 强学术学术雇主中的 18
    个，以及最大的政府博士后雇主——国立卫生研究院（NIH）（Davis, 2005）。调查通过电子邮件联系了参与机构的 22,000 名博士后，这大约占当时美国所有工作博士后总数的
    40%。调查的响应率为为 34%。


    该调查侧重于博士后的以下特征：


    *   人口统计学信息（例如：性别、种族/族群、年龄、国籍）；

    *   福利与服务（例如：薪资、福利以及各种资源的充足性）；

    *   机构环境（书面政策和程序，以及各种类型培训的可用性）；

    *   博士后导师；

    *   博士后职位；

    *   成果（例如：时间分配、论文）；

    *   职业计划；以及

    *   博士后对博士后任命的满意度。


    美国科学基金会（NSF）的一项部门调查是《科学与工程研究生及博士后调查》（GSS）。27 该调查包含了美国机构科学与工程（S&E）领域博士后的数量和特征数据。该调查每年进行一次，针对研究生院校的个人学术部门。数据包括按资金来源、性别和国籍划分的博士后计数数据。数据自
    1966 年开始收集，截至本文的最新数据为 2005 年。然而，由于博士后数据的收集方式随时间发生了变化，这使得难以研究长期趋势。28


    | | |

    | :--- | :--- |

    | | ²⁷ 有关该调查的更多信息，请参阅：“科学与工程研究生及博士后调查”，访问地址：[`www.nsf.gov/statistics/showsrvy.cfm?srvy_CatID=2&srvy_Seri=2`](http://www.nsf.gov/statistics/showsrvy.cfm?srvy_CatID=2&srvy_Seri=2)。[访问日期：2007
    年 6 月 24 日。] |

    | | ²⁸ 特别注意的是，在 1975 年之前，NSF 并不寻求收集所有授予博士学位机构的数据。有关调查随时间变化的更详细描述，请参阅：“科学与工程研究生及博士后调查”，访问地址：[`www.nsf.gov/statistics/showsrvy.cfm?srvy_CatID=2&srvy_Seri=2`](http://www.nsf.gov/statistics/showsrvy.cfm?srvy_CatID=2&srvy_Seri=2)。[访问日期：2007
    年 6 月 24 日。] |


    最后，国家科学院的科学、工程与公共政策委员会（COSEPUP）对拥有博士后的机构进行了一次一次性调查。“COSEPUP 决定调查前 25 所学术机构（按博士后学者人数计）以及以下各类中的各
    5 所：小型机构（按博士后学者人数计）、医学院、历史悠久的黑人大学（HBCUs）、工业界、研究机构和政府实验室。调查于 1999 年 11 月至 2000
    年 4 月进行。调查针对 49 个拥有博士后学者的组织进行。49 个组织中有 40 个做了回复（响应率为 82%）（NAS/NAE/IOM, 2000:138）。”


    ### 职业数据来源


    职业数据更难获得。信息来源之一是国家科学院的合作计划目录：“一份前国家研究委员会（NRC）合作成员名录于 1995 年以书籍的形式出版。从那时起，又授予了
    2,000 多项合作计划。在这个网络目录录中，我们更新了许多前合作成员的当前信息。可以通过成员姓名、计划或授予日期，或者根据成员目前就业的州或国家来查看这些信息。该目录录支持完全搜索。”29
    数据涵盖 1959-2002 年。


    | | |

    | :--- | :--- |

    | | ²⁹ NRC 合作计划目录，访问地址：[`nrc58.nas.edu/pgasurvy/data/aodir/gen_page.asp`](http://nrc58.nas.edu/pgasurvy/data/aodir/gen_page.asp)。[访问日期：2007
    年 7 月 13 日。] |


    职业数据的第二个来源是由国立标准技术研究院（NIST）收集并维护的研究成员每月报告。这些数据记录了 NIST 成员就业状态的变化。NIST 研究成员可能会辞职或被终止（尽管他们可能以合同工身份工作），或者通过转为定期职位或职业职位留任
    NIST。1998-2001 年的数据提供纸质版，2002-2007 年提供电子格式。由于这些数据涵盖的是研究成员任期结束；这些数据涵盖了 1996 年或之后任命的研究成员。


    关于博士后职业的第三个有用信息来自 NSF 的 SDR。可以检查完成多次调查的受访者，因此可以识别出 1999 年调查中的博士后受访者，并对于那些也参加了
    2001 年调查的受访者，检查其就业或其他特征的变化。NSF 目前正在进行一项可行性研究，旨在探索填补博士后数据空白的方法。其中一个目标是通过两种方式提高覆盖率：通过获取更多博士后信息（例如：外国博士学位博士后或医学博士博士后），使其比
    SDR 可能涵盖的要多；通过涵盖学术界以外的更多领域（例如：非营利组织或政府机构的博士后），这些领域超出了 GSS 的范围。NSF 的研究可能会导致未来对博士后的调查。


    最后，委员会通过专家小组讨论的形式，对当前的 NIST 研究成员（CRA）、仍任职于 NIST 的前 NIST 研究成员（FRA）以及 NIST 研究成员导师和部门主任（AD）进行了原始数据收集。每个小组持续约一小时，并于
    2007 年 7 月 25 日举行。向这些参与者提的问题（括号内为提问所针对的对象）列在 Box 1-1 中。


    '
