  trans: '


    在将 NIST/NRC RA 申请者与近期获得博士学位的人员进行比较时，一个信息来源是美国国家科学基金会（NSF）的“获得博士学位调查”（SED）。该调查始于
    1957-1958 年，每年收集从所有美国认证机构获得研究型博士学位的人的人数及特征数据。²¹ 所有个人在获得其研究型博士学位时均被要求完成该调查。SED
    收集了个人教育背景、特征和毕业后计划的信息。选定的变量包括：


    |  ||  ²¹ 更多信息，请参阅：“SRS 获得博士学位调查”，访问地址为：[`www.nsf.gov/statistics/showsrvy.cfm?srvy\_CatID=2&srvy\_Seri=1`](http://www.nsf.gov/statistics/showsrvy.cfm?srvy_CatID=2&srvy_Seri=1)。[2007
    年 6 月 24 日访问。] |


    | --- | --- |


    • 博士学位的学术机构

    • 出生年份

    • 毕业时的国籍状态

    • 出生国和国籍

    • 学位领域（N = 279）

    • 婚姻状况、受供养人数/年龄

    • 毕业后计划（工作、博士后、其他学习/培训）

    • 主要和次要工作活动

    • 博士后学习/研究的资金来源和类型

    • 雇主的类型和地点

    • 种族和西班牙裔民族（针对选定的子群体）

    • 性别²² |


    |  ||  ²² NSF 使用“sex（性别）”一词而非“gender（性别身份）”。在本报告中，“sex”和“gender”同义使用。 |


    | --- | --- |


    该调查的响应率超过 90%。趋势数据可追溯至 1957-1958 年。1920-1956 年期间有部分数据。


    关于被授予研究助理（RA）人员特征及其在博士后任期期间经历的数据主要来自两个来源：奖学办公室（Fellowships Office）对研究助理进行的任期后调查，以及
    NSF 的“博士学位获得者调查”。


    这些信息还由国家科学院（The National Academies）和 Sigma Xi（西格西）对博士后进行的一次性调查进行了补充。²³ 最后，NSF
    的“科学与工程领域研究生和博士后调查”也是一个潜在的资源。


    |  ||  ²³ Sigma Xi 是“一个国际性的多学科研究学会，其计划和活动促进科学事业的健康并表彰科学成就。全球 100 多个国家有近 60,000
    名 Sigma Xi 会员。全球共有 500 多个 Sigma Xi 分会，分布于大学、工业研究中心和政府实验室。”源自“关于 Sigma Xi”，访问地址为：[`www.sigmaxi.org/about/overview/index.shtml`](http://www.sigmaxi.org/about/overview/index.shtml)。
    |


    | --- | --- |


    奖学办公室在研究助理完成其博士后任期时会对其进行任期后退出调查。该调查由一份书面问卷组成，虽然名义上是强制，但许多博士后并未填写。此外，还要求研究助理的导师提供一份评估表。这两项评估的关键变量包括：


    • 对研究助理在创新思维、领域知识、动机/主动性、综合科学能力、独立研究和研究技术方面的评估；

    • 博士后任期期间的产出，包括：发表的国内和国际报告次数、同行评审期刊文章数量；

    • 博士后任期期间的，对研究助理在创新思维、领域知识、动机/主动性、综合科学能力、独立研究和研究技术方面的评估；• 博士后任期期间的产出，包括：发表的国内和国际报告次数、同行评审期刊文章数量；

    • 博士后任期期间，对研究助理在创新思维、领域知识、动机/主动性、综合科学能力、独立研究和研究技术方面的评估；• 博士后任期期间的产出，包括：发表的国内和国际报告次数、同行评审期刊文章数量；

    • 博士后任期期间，对研究助理在创新思维、领域知识、动机/主动性、综合科学能力、独立研究和研究技术方面的评估；• 博士后任期期间的产出，包括：发表的国内和国际报告次数、同行评审期刊文章数量；

    • 博士后任期期间，对研究助理在创新思维、领域知识、动机/主动性、综合科学能力、独立研究和研究技术方面的评估；• 博士后任期期间的产出，包括：发表的国内和国际报告次数、同行评审期刊文章数量；

    • 博士后任期期间，对研究助理在创新思维、领域知识、动机/主动性、综合科学能力、独立研究和研究技术方面的评估；• 博士后任期期间的产出，包括：发表的国内和国际报告次数、同行评审期刊文章数量；

    • 博士后任期期间，对研究助理在创新思维、领域知识、动机/主动性、综合科学能力、独立研究和研究技术方面的评估；• 博士后任期期间的产出，包括：发表的国内和国际报告次数、同行评审期刊文章数量；

