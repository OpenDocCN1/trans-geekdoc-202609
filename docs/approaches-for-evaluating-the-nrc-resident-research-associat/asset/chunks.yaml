    ## 初步结果


    首先，申请表是一个非常实用的数据收集工具。在目前的三个工具——申请表、最终报告、导师评估——中，申请表产生的数据最多。其次，个人沟通是申请者获知 RAP（包括
    NIST/NRC RAP）最可能的途径。关于申请者如何得知该计划的主要发现如下：


    *   NIST/NRC RAP 的申请者最初通过其博士导师或其他教授得知该职位的概率，是其他 RAP 申请者的两倍；且从同事或同届研究生处得知该计划的概率也略高一些，但从联邦实验室的研究导师或其他科学工作人员处得知该计划的概率则较低；

    *   NIST/NRC RAP 申请者获知最常见的信息来源是教授或同事；

    *   男性和女性申请者得知 NIST/NRC RAP 的情况相似，但在专业会议的报告除外（女性提及的频率是男性的两倍）；以及

    *   NIST/NRC RAP 申请者得知该计划的方式在种族/民族上没有差异。


