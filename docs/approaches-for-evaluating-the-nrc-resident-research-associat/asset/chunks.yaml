    - c. 在专业会议上与研究生/博士会面

    - d. 邀请研究生/博士访问您的机构或在该处进行演讲

    - e. 其他：\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\

    - 26. 你们的小组是否在招募博士后方面做出努力？

    - a. 如果是，是什么？

    - 27. 您的实验室或中心是否在招募博士后方面做出努力？

    - a. 如果是，是什么？

    - 28. 博士后最大的特点是什么？

    - 29. 博士后最糟糕的特点是什么？

    - 30. 如果你对该计划进行改进，你会怎么？


    # 4 职业发展


    关于前 NIST/NRC 研究员（RA）职业生涯的信息非常少。信息来源将在下一节介绍，但总而言之，数据涵盖了研究员在任命结束后的计划计划，或者他们在某个近期时间点的当前就业情况。目前没有职业历史数据。根据这些数据，前研究员已进入了所有领域的就业。NIST
    特别感兴趣的是位于 NIST 的 NRC 驻留研究员计划（NIST/NRC RAP）是否提供了职位候选人源。回答此问题的可用信息是通过专家小组和 NIST
    收集的数据获得的。


    从 NIST 现任和前研究员以及 NIST 员工的角度来看，该计划被认为对扩大 NIST 职申请人池是有益的。在专家小组期间接受采访的许多现任研究员加入 RAP
    是希望留在 NIST。他们意识到转为正式员工是困难的，但一些人认为拥有 NIST/NRC 研究员身份是留下的最佳方式。根据他们的估计，成功率根据研究员在 NIST
    的就职地点不同而有很大差异。估计范围从 5% 到 60% 不等，尽管 NIST 全范围的估计被认为在 30% 到 40% 之间。留在 NIST 的前研究员认为，整体留任率约为
    50%，且留任百分比因实验室而异，例如在某些实验室中，他们认为这一比例为 15% 到 20%。虽然现任和前研究员都注意到留在 NIST 很困难，但前研究员认为现任研究员高估了留下的机会。导师和部门主管将研究员被聘用为
    NIST 的比例定在 33% 左右。他们报告说，约一半的研究员询问过留任。参与者注意到，在许多情况下，研究员打算在任期结束后去他处，而那些来到 NIST 并非常喜欢那里工作的人经常找到了留下的办法。在与
    NIST 顾问和经理的专家小组会议期间，他们指出该计划是招募和留住人才的好方法（有些人称其是招募的“主要”方式）。正如一位参与者所说：“这是尝试一个人的绝佳方式。”


    ## 研究员的职业发展


    关于研究员任命后职业生涯的三个信息来源是：研究员在博士后任期结束时填写的最终报告、国家科学院（The National Academies）编写的目录，以及来自
    NIST 关于研究员身份变更的信息。1996 年，国家科学院编制了一份《驻留研究员目录》（Directory of Resident Research Associates）。第一个数据来源关注研究员在完成任命后的计划。这是研究员任命后职业初期获取的唯一职业信息。


    `Table 4-1` 查看了研究员在任命后计划去何处。再次，这些数据取自研究员填写的最终报告，而且正如 `Chapter 3` 所述，并没有许多研究员完成此表。57%（共
    253 人）NIST/NRC 研究员和 37%（共 6,936 人中）来自其他 RAP 的研究员提供了他们任期后的就业职位信息。


    ![](img/t200138f5_37.png)


    如 `Table 4-1` 所示，在回答问题的研究员中，NIST/NRC 研究员常见的回答是留在 NIST 成为正式员工。加上那些打算继续在 NIST 或为
    NIST 工作的合同工或临时员工的研究员，回答问题的人中约有 45% 继续与 NIST 保持所属关系，而其他 RAP 研究员的这一比例仅为 22.5%。这证明了
    NIST/NRC 研究员对该计划满意度的观点，证明了专家小组参与者的观点（即研究员计划是进入 NIST 职业的良好入门点），也证明了 NIST 将研究员计划作为寻找技能员工的招聘工具之一的观点。最终报告的受访者还被要求确定他们下一站计划去的组织名称。对于学术职位，受访者列出了
    27 个不同的机构。除了 NIST 之外，研究员还确定了许多其他政府职位，包括国家实验室的几个。正如学术界的情况一样，直接就业计划在工业领域的受访者每人提到了一家不同的公司。因此，那些没有以某种方式继续留在
    NIST 的受访者倾向于遍布全国各主要就业领域。


    该《目录》旨在识别在编制《目录》时前研究员的去向。它最初涵盖 1959-1995 年。随后数据更新至 2002 年并开放了网络访问。纸质目录及其后续更新信息基于个人在获得奖励时收集的数据以及对其当前活动的问卷回复。许多前研究员没有回答问卷，在许多情况下无法找到某些前研究员的联系信息（NRC,
    1996）。


    从 1965 年开始，当前数据库中有 9,924 条记录。其中，1,035 人（约 10%）是获得 NIST/NRC 研究员计划的人员。NIST/NRC 研究员就业数据的回收率为
    37.5%（共 1,035 人），其他 RAP 前研究员为 37.7%（共 8,889 人）。在回答者中，如 `Table 4-3` 所示，超过三分之一 NIST/NRC
    研究员的当前雇主是 NIST。NIST/NRC 研究员更有可能在政府就业，而在学术界或其他领域的可能性较低。一个重要的发现是，37.6% 的 NIST/NRC
    研究员在 NIST 工作。


    ![](img/t200138f5_38.png)


    如 `Table 4-2` 所述（类似于 `Table 4-1`）——在为编制《目录》而发的问卷回答者中，调查时 37.6% 的前 NIST/NRC 研究员在
    NIST 就业，而其他 RAP 前研究员的比例约为 28.1%，他们在所在地机构。


    最后一个数据来源是 NIST 收集的博士后状态变更数据，即：任命开始日期、任命终止、辞职，以及对本文而言最重要的，研究员转为期限期职业聘用的情况。


    ![](img/t200138f5_39.png)


    （抱歉，此处翻译漏掉了最后一句，补全如下：

    如 `Table 4-3` 所示，约 25% 的前研究员转岗（不包括转为合同工身份的研究员），在这些转岗的前研究员中，约 31% 转为了正式员工身份。）


    '
