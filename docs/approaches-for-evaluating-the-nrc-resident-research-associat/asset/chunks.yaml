    ```


    **注：** 2007 年，并非所有的申请周期都已完成并记录在数据库中。

    **来源：** 国家科学院，DataRAP 数据库，工作人员统计表。


    ### 婚姻状况


    婚姻状况可能是博士后项目的重要人口统计特征。当许多人追求博士后职位时，他们也处于建立家庭的年龄。许多科学家的配偶也是科学家。了解这一统计特征有助于处理相关问题：双薪夫妻；薪资、福利和生活成本；育儿和产假。申请表包含一个婚姻状况问题。有两个选项：已婚和单身；尽管许多申请者留空。此外，有
    4 位申请者选择了 `F`——可能是关于性别的的数据编码。27 位 NIST 的申请者留了空白，368 位非 NIST 的申请者留了空白。121 位其他研究项目的授予者没有回答该问题。在注明婚姻状况的申请者和授予者中，已婚或单身的百分比情况见图
    2-13 和 2-14。


