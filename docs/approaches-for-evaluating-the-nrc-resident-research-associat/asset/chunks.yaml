    # 1 概述


    **NIST 应对对前研究助理的职业生涯进行广泛评估，以评估该计划对研究助理职业生涯、NIST 以及更广泛的科学与工程社区的影响**。实施此目标的最佳方法是调查，通过将
    NIST/NRC 研究助理与类似的博士后人员的职业成果进行比较。调查将针对这些前研究助理以及一个合适的对照组。理想情况下，可以进行两种可能的比较。首先，可以构建一个同伴群体。该群体由一组匹配或分层的样本组成，这些人员拥有与
    NIST 博士后职位类似的经历，用作比较组。尽管并不理想，但一种解决方案是从奖学办公室（Fellowships Office）的名录中对前研究助理进行分层抽样。这是对前研究助理的普查；但正如报告早些提到的，许多此类人员无法被找到，或者未能对早先收集其当前就业情况的调查做出回应。第二个对照组将由类似的博士人员组成。可以通过联系未获得研究助理计划（RAPs）的申请者群体来编制一份名单。这些人可能会表现出多样化的职业路径，包括其中一些在学术界或工业界从事博士后研究的人，以及其他直接进入就业的人。


    在《超越聚集的风暴》（*Rising Above the Gathering Storm*）中，美国科学院指出：“美国今天所享有的繁荣很大程度上归功于过去
    50 年国家在大学、公司和国家实验室在研发方面所做的投资。然而，最近企业、政府和国家科学技术领袖表示担心，对科技事业的压力可能会严重侵蚀过去的成功，并危及美国未来的繁荣”（NAS/NAE/IOM,
    2007）。


    为了应对这些挑战，《聚集的风暴》报告建议在四个领域采取行动：K–12 教育、高等教育、科学工程研究以及经济与技术政策。报告的许多建议后来在布什总统于 2006
    年 1 月 31 日的国情演讲中提出的“美国竞争力倡议”（ACI）中得到了呼应。ACI 受到了国会山两党立法员的热烈欢迎，并产生了旨在旨在实施其关键条款的法案。


    在考虑这些提议时，国会采取了即时措施，要求对科学、技术、工程和数学（STEM）领域的现有联邦教育计划进行审查。正如斯佩林斯部长关于新的学术竞争力委员会（ACC）及其使命的声明中所提到的：“总统于
    2006 年 2 月 8 日签署的《减少赤字法》包含了由教育部长主持的学术竞争力委员会，其成员由在科学、技术、工程和数学领域拥有教育计划的联邦政府机构组成。法律规定的使命是评估每个计划的有效性，识别重叠领域，并为未来的高效整合和协调提供建议。”ACC
    的努力包括评估这些计划的成功情况、识别当前和未来计划的改进领域，并为计划之间的持续合作奠定基础（DOE, 2007）。


    博士后计划——在科学和工程（S&E）领域有若干个——对于提供额外的研究培训、知识和机会以桥接高等教育与 S&E 职业生涯具有至关重要的意义。虽然许多博士直接进入了全职工作，但大量博士将几年的博士后工作视为建立技能和声誉的宝贵机会，也是在劳动力市场进行实验的机会。


    | |  ³ 博士后职位或“博士后”是在学术界、工业界、非营利组织或政府授予的临时职位，主要为了获得研究领域的额外教育和培训。拥有博士后任命的人员被称为博士后。
    |

    | :--- | --- |


    ## 支持 S&E 领域博士后的联邦计划


    根据 GAO（2005:3），在 2004 财年资助的 207 个“教育计划中旨在增加追求 STEM 学位和职业的学生及毕业生人数，或改进 STEM 领域的教育计划……”。这些计划中包括几个提供并强调博士后机会的计划，例如：美国国家航空航天局（NASA）的
    NASA 博士后计划；国立卫生研究院（NIH）针对个人博士后研究员的 Ruth L. Kirschstein 国家研究服务奖（NRSA）（F32）、职业转型奖（K22）、通独立路径（PI）奖（K99）、博士后内部研究培训奖（IRTA）、癌症研究培训奖（CRTA）、博士后访问访问金（VF）、国立普通医学科学研究院药理学研究助理（PRAT）计划以及女性健康博士后访问金；国立科学基金会（NSF）的博士后研究奖金；美国农业部农业研究局（ARS）博士后研究助理计划。


    | | ⁴ STEM 是科学、技术、工程和数学。 |

    | :--- | --- |

    | | ⁵ 虽然这些计划侧重于个人博士后，其他计划则针对学术机构，提供资金以支持博士后群体。 |

    | :--- | --- |


    美国科学院国家研究委员会奖学办公室代表联邦机构管理若干博士后研究计划。表 1-1 列出了由国家研究委员会管理的若干计划。


    ### 表 1-1 选定的国家委员会研究计划


    | 机构 | 研究计划计划 |

    | :--- | :--- |

    | 国防部 | 空军研究实验室 (AFRL) |

    | 国防部 | 军军放射生物学研究所 (AFRI) |

    | 药品监督管理局/卫生与服务部 | 设备与放射健康中心 (CDRH) |

    | 国防威胁减少署/国防部 | 化学和生物防御 (CBD) |

    | 联邦航空管理局/交通部 | FAA/民用航天学院 (CAMI) |

    | 联邦公路局/交通部 | Turner-Fairbank 公路研究中心 (FHWA) |

    | 美国陆军工程兵团/国防部 | 水资源学院 (IWR) |

    | 能源部 | 国家能源技术实验室 (NETL) |

    | 能源部 | 国家能源技术实验室甲烷水合物奖金计划 (NETL/MHFP) |

    | 卫生与服务部 | 国家职业安全与健康研究院 (NIOSH) |

    | 商务部 | 国家标准与技术研究院 (NIST) |

    | 卫生与服务部 |国立卫生研究院 (NIH) |

    | 卫生与服务部和商务部 | 国立卫生研究院 (NIH)/国家标准与技术研究院 (NIH/NIST) |

    | 商务部 | 国家海洋大气管理局 (NOAA) |

    | 国防部 | 海军医学研究中心/海军健康研究中心 (NMRC/NHRC) |

    | 国防部 | 海军研究生学校 (NPS) |

    | 国防部 | 海军研究实验室 (NRL) |

    | 国防部 | 海军哺乳动物计划 (MMP) |

    | 太平洋灾害中心 | 太平洋灾害中心 (PDC) |

    | 国防部 | 美国陆军航空和导弹司令 (AMCOM) |


