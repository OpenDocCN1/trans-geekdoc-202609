    ### 长期


    这个问题关注奖项迄今如何影响了研究人员的职业生涯。这个问题有点问题，因为目前并不清楚什么是“优秀”或“差”，或者研究人员的思考是否在同一频道。41%（共 253
    人）的 NIST/NRC 研究人员和 21%（共 6,936 人）的其他 RAP 研究人员提供了该类别的信息。在受访者中，如 表 3-7 所示，得分与上述相似，平均分为
    8.7。NIST/NRC 研究人员为 8.5，而其他 RAP 研究人员为 8.8。这一差异在 0.05 水平上具有统计学意义。⁴⁶ 所示，与一样，得分很高，平均为
    8.5。NIST/NRC 研究人员平均分为 8.4；其他 RAP 研究人员平均分为 8.5。这些差异在统计学上并不显著。


