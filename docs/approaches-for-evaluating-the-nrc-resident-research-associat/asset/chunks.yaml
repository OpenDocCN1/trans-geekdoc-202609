    This number of responses declined significantly at this point in the questionnaire.
    Very few respondents answered this question, which focuses on the quality of mentoring
    received from the research advisor. This question ignores the possibility that
    the Research Associate received mentoring from someone else either at the host
    agency or external to it. Sixteen percent (of 253) `NIST/NRC` Research Associates
    and three percent (of 6,936) of research associates from other RAPs provided information
    on this category. Among those who responded, as seen in [Table 3-9](../Text/ch012.xhtml#p200138f5ttt00034),
    and somewhat surprisingly given the comments of the former Research Associates,
    the average score was quite high at `8.6`, and again `NIST/NRC` Research Associates
    were slightly lower than Research Associates of other RAPs (`8.2` to `8.7`). This
    difference is statistically significant at the `0.05` level, but should be taken
    very cautiously. However, given the very low response rate, it is likely that
    people who received a lot of support might be more likely to answer the question.


