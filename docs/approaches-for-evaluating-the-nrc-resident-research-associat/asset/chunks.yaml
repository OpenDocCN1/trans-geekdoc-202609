  trans: "\n\n# 1. 推广工作产生的合格申请人数超过了 NIST 研究员的空缺名额；申请人中包含许多来自顶尖研究机构的人员，且多样性日益增加。总体而言，NIST\
    \ 有 22% 的申请者获得了任命——这一录取率低于其他研究员计划（RAP）的整体水平。NIST 和其他 RAP 申请者的录取率因性别、种族和领域有所异。然而，在所有领域中，申请人数和获得者中女性及少数族裔的比例随时间推移而增加，但增长速度低于博士学位者及计划成为博士后的人员中的比例。个人沟通是\
    \ NIST/NRC 研究员了解该计划的主要途径。\n\n# 2. NIST/NRC 研究员的产出似乎与其他计划中的研究员相当。平均而言，NIST/NRC\
    \ 研究员大约发表两篇文章，进行约四次演讲，但在任期内很少获得专利或奖项。他们更有可能进行国内演讲或获奖，而发表期刊文章的可能性较低，在获得专利或进行国际演讲方面则与其他者持平。然而，产出数据源于一项回复率较低的调查，可能存在非响应偏差。\n\
    \n# 3. 研究员对该计划非常满意。对于在最终报告中提供信息的研究员，在 1 到 10 分的量表上（10 分为优秀），NIST/NRC 研究员对计划的短期和长期价值评分为：实验室、导师、行政（NIST\
    \ 和 NRC）支持在 7.7 到 8.5 之间。在一半的类别中，NIST/NRC 研究员与其他计划的研究员报告的满意度水平在统计学上相似。在另一半类别中，其他研究员报告的满意度更高。然而，满意度数据源于一项回复率较低的调查，可能存在非响应偏差。\n\
    \n# 4. 研究员为 NIST 永久职位的合格申请储备做出了贡献。在完成任命的研究员中，NIST 的 45% 人员报告其终身结束后的直接职位是永久性、临时性或合同员工——这一比例高于其他联邦机构的研究员。非响应人员的就业情况尚未知。对前研究员的调查发现，在能够追踪到的这些前研究员中，前\
    \ NIST/NRC 研究员留任 NIST 的比例高于其他计划的研究员留在其所在机构的比例（37.6% 对 28.1%）。\n\n## 结论\n\n# 1.\
    \ 目前可用数据无法对计划进行全面评估。目前，最详尽的数据是针对申请者的。关于研究员的经历、导师对研究员的评估、前研究员的职业结果，以及该计划对 NIST\
    \ 或更广泛的科学工程社区的价值的数据收集较少。\n\n## 建议\n\n# 1. NIST 应对 NIST/NRC 研究员计划进行更详尽的评估。\n\n\
    a. 作为第一步，NIST 和 NRC 应审查该计划的特定目标。\n\nb. 评估应包含以下部分：对潜在申请者的推广评估；对拒绝接受研究员职位的个人的评估；该计划在研究员完成任期后对其产生的益处评估；NIST\
    \ 接收研究员的益处评估；以及计划对更广泛科学工程社区的益处评估。\n\n# 2. NIST 应对推广工作进行评估。\n\na. 可以对申请者如何了解该计划进行额外分析（例如关注“其他”类别）。\n\
    \nb. 可以从 NIST 人员以及前任任研究员处收集更多数据。这些数据可用于回答诸如 NIST 人员如何与潜在申请者互动以及哪些机制似乎最有效等问题。\n\
    \nc. 促进推广工作评估的第二步是确定量化推广策略所获价值的指标。\n\nd. 检查个人推广策略的投资回报。\n\ne. 最后，考虑目前是否存在其他未被充分利用但具有可能价值的推广策略，例如向院长、系主任和其他大学管理人员发送直接邮邮件。\n\
    \n3. NIST 应对拒绝研究员邀请的个人进行评估。这可以通过电话访谈或问卷调查完成。对获得录取但拒绝的人员提问两个基本问题：（1）你为什么拒绝，（2）你计划改做什么？\n\
    \n4. NRC 应修改申请表。应减少字段列表，特别是通过合并非常相似的标签并移除适用于多个字段的标签。\n\n5. NRC 应更新 `DataRAP` 数据库，将\
    \ NIST 中已不存在的组织名称（如学院或实验室）替换为当前的等效名称。\n\n6. NIST 应对研究员在博士后任期期间的经历进行更详尽的评估、他们对计划益处的满意度及看法，以及\
    \ NIST 员工对计划益处的满意度和看法。\n\na. 为了协助这项工作，NRC 应重新设计最终报告和导师评估表，以最大限度地从这些工具中收集数据。\n\n\
    b. 最终报告和导师评估应设为强制性。\n\nc. 目前收集的某些元素可以进行进一步分析。\n\n   i. NIST 可能希望对同行评审期刊进行进一步分析。\n\
    \n   ii. NIST 可能希望对研究员的产出进行影响分析。\n\n   iii. NIST 可能希望对其对研究员的支持进行更详尽的审查，询问他们对 NIST\
    \ 行政部门的熟悉程度、向这些部门寻求帮助频率以及原因。\n\nd. NIST 还可以对研究员（或 NIST 员工）的协作进行社交网络分析，以查看研究员计划如何促进科学家和工程师之间新的或更广泛的协作。\n\
    \ne. 在数据允许的情况下，NIST 可以考虑根据实验室、性别和种族/民族对研究员的产出和满意度量进行进行分类。\n"
