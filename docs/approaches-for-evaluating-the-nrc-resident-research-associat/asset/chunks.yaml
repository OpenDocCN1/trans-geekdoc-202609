- raw: 'd. Examine individual outreach strategies for return on investment. This could
    include such strategies as assessing the NIST website for usability and informational
    content or assessing the return on advertising in publications. As part of the
    assessment of the NIST website, NIST could consider adding contact information
    for Research Advisors to facilitate a dialogue between potential applicants and
    relevant NIST staff.


    e. Finally, consider whether there might be other outreach strategies that are
    being underused currently, and which might have potential value, such as direct
    mail to deans, department heads and other university administrators.


    f. In addition, it is important to determine if any groups of graduate students—and
    potential applicants—who would make good candidates for the NIST/NRC RAP are unaware
    of the Program and how one applies. It would be difficult to craft a random sample
    of graduate students, but a limited survey might be possible.


    3\. **NIST should conduct an evaluation of individuals who decline offers of Research
    Associateships.** This could be done as a telephone interview or via a survey.
    As there are only a few people who decline each cycle, the burden would be relatively
    small. Two basic questions should be asked of those who are awarded but decline:
    (1) why are you declining, and (2) what are you planning to do instead?


    4\. **The NRC should amend the application form.** The number of fields should
    be reduced, in particular by collapsing very similar labels and by removing labels
    that are for multiple fields (e.g., “Biophysics Physics Biochemistry”). At least
    with regard to Ph.D. fields, an example of a smaller field list is found in the
    NSF’s Survey of Earned Doctorates (see [Appendix B](../Text/ch017.xhtml#p200138f5ddd00066)).


    5\. **The NRC should update the DataRAP database to replace organizational names
    (e.g., institutes or labs) that no longer exist at NIST with current equivalents.**


    6\. **NIST should conduct a more thorough assessment of RAs’ experiences during
    the postdoctoral appointment, their satisfaction with and views on the benefits
    of the Program, and NIST staff’s satisfaction with and views on the benefits of
    the Program.**


    a. To assist in this, the NRC should redesign the final report and the Research
    Advisor’s evaluation form to maximize the collection of data from these instruments
    (see [Box 3-1](../Text/ch012.xhtml#p200138f5bbb00078) and [Box 3-2](../Text/ch012.xhtml#p200138f5bbb00082)
    for suggested questions).


    b. The final report and the Research Advisor’s evaluation should be made mandatory.


    c. Some elements of the current data collected could be subjected to further analysis.


    i. For example, NIST may wish to conduct further analysis on peer-reviewed journals,
    for example by:


    1\. asking whether the RA was sole or lead author,


    2\. examining whether RAs publish with NIST staff, and


    3\. examining the quality of the journals in which RAs publish, although this
    requires some ranking of journals.


    ii. NIST may wish to conduct an impact analysis of RAs’ productivity, for example
    by:


    1\. conducting a citation analysis to see how often RAs’ publications are referenced
    by others (note this can be accomplished using citation indexes), or


    2\. assessing the type or size of grants postdocs receive.


    iii. NIST may wish to conduct a more thorough review of their support of RAs,
    asking how familiar they are with NIST administrative offices, how often they
    turn to those offices for help, and for what reasons.


    d. NIST could also conduct a social network analysis of the collaboration of the
    RAs (or of NIST employees) to see how the Research Associateship Program facilitates
    new or wider collaboration among scientists and engineers.


    e. When data allow, NIST could consider disaggregating productivity and satisfaction
    measures for RAs by lab, gender, and race/ethnicity.


    7\. **NIST should conduct a broad evaluation of the careers of former RAs to evaluate
    the impact of the Program on RAs’ careers, NIST, and the broader science and engineering
    community**. The best approach for doing this is a survey, which would compare
    the career outcomes of NIST/NRC RAs to similar postdocs. The survey would be directed
    towards these former RAs and a suitable control group. Ideally, two possible comparisons
    could be made. First, one could construct a peer group. This would consist of
    a matched or stratified sample of individuals who had postdocs similar to the
    one at NIST for the comparison group. Although not ideal, one solution would be
    to take a stratified sample of former RAs from the Fellowships Office’s Directory.
    This is a census of former RAs; but as noted earlier in the report, many of these
    individuals could not be found or failed to respond to an earlier survey designed
    to collect information on their current employment. A second comparison group
    would consist of similar doctorates. A roster could be assembled by tapping the
    group of applicants to RAPs, who did not receive an award. These individuals will
    likely exhibit a diversity of career paths, including some who took postdocs (in
    academia or industry) and others who went straight into employment.[^(47)](../Text/ch014.xhtml#p200138f5ftt00047)


    |  ||  ^(47) An alternative approach is to construct a comparison group for the
    NSF’s Survey of Doctorate Recipients by identifying a group of former postdocs.
    For an example of a report that uses this approach, see: Oak Ridge Institute for
    Science and Education, 2003. |


    | --- | --- |


    # **Bibliography**


    Austin, J. 2006. Salary survey: U.S. life scientists report rising salaries and
    high job satisfaction. *Science* 314(5800):842-847.


    Bhatiacharjee, Y. 2006. NSF wants PIs to mentor their postdocs. *Science* 313(5788):748.


    Curry, E. 2004. *50th Anniversary of the NIST Postdoctoral Research Associates
    Program.* \[Online\]. Office of International and Academic Affairs, NIST. Available
    at: [http://www.nist.gov/oiaa/pdanniv.htm](http://www.nist.gov/oiaa/pdanniv.htm).


    Davis, G. 2005. Doctors without orders. \[Online\]. *American Scientist* 93(3,
    supplement). Available at: [http://postdoc.sigmaxi.org/results/](http://postdoc.sigmaxi.org/results/).


    Ferber, D. 1999. Getting to the front of the bus. *Science* 285(5433):1514-1517.


    Finkelstein, N. and J. Libarkin. (no date). *Who Cares About Postdocs Anyway?
    Evaluating the National Science Foundation’s Postdoctoral Fellowships in Science,
    Mathematics, Engineering and Technology Education*. \[Online\]. Available at:
    [http://lchc.ucsd.edu/nfinkels/higher\_ed\_postdoc.pdf](http://lchc.ucsd.edu/nfinkels/higher_ed_postdoc.pdf).


    Hill, S.T., T.B. Hoffer, and M.J. Golladay. 2004. *Plans for Postdoctoral Research
    Appointments Among Recent U.S. Doctorate Recipients*. NSF InfoBrief, NSF 04-308.
    Arlington, VA.


    Mantovani, R., M.V. Look, and E. Wuerker. 2006. *The Career Achievements of National
    Research Service Award Postdoctoral Trainees and Fellows: 1975–2004*. Bethesda,
    MD: ORC Macro.


    McCullough, J. and D. Thurgood. 2004. *Outcomes and Impacts of the National Science
    Foundation’s Program of Minority Postdoctoral Research Fellowships*. Arlington,
    VA: SRI International.


    Mervis, J. 2007. Program evaluation: Researchers fault U.S. report critiquing
    education programs. *Science* 316(5829):1267.


    Mervis, J. 1999. Minority postdocs are rare, independent breed. *Science* 285(5433):1529-1530.


    Michie, J., X. Zhang, J. Wells, L. Ristow, G. Pion, A. Miyaoka, J. Frechtling.
    2007. *Feasibility, Design and Planning Study for Evaluating the NIH Career Development
    Awards: Final Report*. Rockville, MD: Westat.


    National Academy of Sciences, National Academy of Engineering, Institute of Medicine.2007.
    *Rising Above the Gathering Storm: Energizing and Employing America for a Brighter
    Economic Future*. Washington, DC: National Academies Press.'
