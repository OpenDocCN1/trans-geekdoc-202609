- raw: 'The research proposal is the most important element of the application and
    as such is weighted most heavily in the review. The proposal is evaluated for:
    importance of the proposed research area, clearly stated objectives, technical
    soundness of the work plan, innovative aspects of the proposal, feasibility of
    success, timeliness (can the proposal be completed in the allotted time), likelihood
    that the research will result in publication, and contribution of the research
    to the mission of the sponsoring laboratory.


    **Reference reports or letters of recommendation (20%)**


    Reference Reports or letters of reference contain opinions of persons who should
    have had a close professional relationship with an applicant; references provide
    reviewers with important information regarding the applicant’s scholarly abilities.
    Reference reports are given greater weight for Postdoctoral applicants, where
    a publication record may not be as extensive as that of a Senior applicant.


    **Academic and research record (20%)**


    Panelists review the appropriateness of the applicant’s training for the proposed
    research, previous research experience and record of publication. For Postdoctoral
    applicants only, a transcript of the academic record is required.


    **Laboratory technical evaluation (20%)**


    The Laboratory/Center Review form includes comments of the prospective Advisor
    and the disposition of the Laboratory/Center’s program committee or representative
    concerning the suitability of the applicant’s proposed research. This information
    aids reviewers in determining the value of the proposed research to the sponsoring
    agency.


    During the expert panel meetings, applicants are rated from 10 to 0, with 10 being
    the highest possible score. In practice, scores have ranged from 9.90 to 0 and
    applicants’ scores may differ by as little as 0.02 (e.g., 9.65 to 9.63). The review
    process is seen as something of a mystery to NIST staff. During the expert panel
    with former research associates, they commented that they did not understand how
    candidates were ranked. Former research associates had their own ideas about how
    candidates should be ranked. As a consequence of the personal connections between
    NIST employees and potential applicants, NIST employees formed opinions about
    who they thought top candidates were, and then registered their surprise when
    those people did not end up ranked at the top. In a related comment, former research
    associates commented that they would like to have a much better idea of how the
    research project that the applicant intends to work on (as described in the application)
    is graded. They felt that the current grading system is not transparent and is
    too general. NIST staff submit a recommendation on behalf of applicants and the
    staff do not seem sure what they ought to stress in their recommendation.


    Advisors and division chiefs focused on another issue in their expert panel: the
    review panels. They questioned whether the NRC review panels were organized well.
    They were concerned the panels were skewed to reviewers from academia. They did
    not know who serves on the panels. They would like to have more input into panel
    makeup, for example by suggesting names of potential reviewers (and then knowing
    if their suggestions were used). Another concern was whether rankings were normalized
    across panels.


    The applicants’ reviews, with scores, are sent to NIST, which selects the applicants
    to be offered postdoctoral positions. In practice, most of those offered, will
    accept a Research Associate.


    ## **RECRUITMENT**


    A concern for NIST and The National Academies is how well the program is reaching
    out to potential applicants. During the expert panels, current research associates
    noted that NIST was often their first choice. Reasons why included: family reasons,
    quality of advisors, ability to collaborate, and location. The research associates
    had applied to multiple positions, for example in academia or other government
    labs. Concerning how research associates heard about the position, the most frequent
    answer involved personal communication—either they met their future advisor at
    a conference, job fair, or when the advisor gave a lecture at their school; or
    a graduate advisor suggested they apply. (Personal communication was also repeatedly
    mentioned by the advisors and chiefs—that personal relationships had the best
    return on investment.) In several cases, their advisors were former research associates.
    Word of mouth was very important.


    Former research associates echoed these comments. Answers given by participants
    included: had a personal relationship—in one case the former research associate’s
    spouse worked at NIST; were recruited by advisors (at conferences or presentations
    made by NIST employees at universities); met researchers at NIST (this was suggested
    by former RA from local universities); and came across the Web site describing
    the RAPs. One RA had applied to a regular position at NIST and then saw the listing
    for the RAP. The former RAs noted that sometimes staff invite graduate students
    to give research talks at NIST as a way to bring potential applicants out to NIST.
    It did seem to the participants that the personal connections were much more effective.
    One former research associate noted that there is less outreach by NIST in the
    biological areas. This is important, as NIST may be moving in the future to more
    interdisciplinary research that  has a biological component and there will be
    a need for more people with training in biological sciences. A physicist noted
    that at one point in the past, there was an advertisement in *Physics Today*,
    but he had not seen it recently. He felt that a better job of advertising could
    be done. Finally, former research associates noted that some had applied to multiple
    postdoctoral positions and had chosen NIST as the better alternative.


    Advisors and lab chiefs did note that in some areas they felt that the number
    of applications was low. Of particular concern were some areas within engineering
    and computer science. They noted that doctorates had many options in these areas
    and many forego postdocs, as well as the view that there are more foreign nationals
    and fewer U.S. citizens getting degrees in these areas. They did agree with the
    current and former research associates that personal communication seemed to be
    the best way to recruit. Participants in this panel did note that different labs
    differed in how they attempted to recruit applicants and to what degree they tried.


    Overall, participants reported that:


    • The program is very prestigious (although some current RAs felt that the program
    was less so);


    • The program is well-known (again, with some minority comment that it is not
    that well known); and


    • The most common way people heard about the program was through personal communication.


    To examine these findings more broadly, the committee turned to data collected
    on the NRC’s Fellowships Office RAP application form. The application for postdoctoral
    programs includes a question on how the applicant heard about the position.[^(37)](../Text/ch011.xhtml#p200138f5ftt00037)
    Applicants were requested to select one of the following: colleague or fellow
    graduate student; Ph.D. thesis advisor or other professor; university placement
    office; former or current NRC Research Associate; research advisor or other scientific
    staff at the federal Laboratory; RAP’s staff member at professional scientific
    meeting; Advertisement in professional publication; or other. Data are available
    for 1989 to 2007.


    |  ||  ^(37) The question is: “To assist us in making information available to
    a greater number of potential applicants, it is important for us to learn how
    you initially heard about the National Academies RAPs.” |


