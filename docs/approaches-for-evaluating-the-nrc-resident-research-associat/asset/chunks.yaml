    d. 评估各项对外推广策略的投资回报率。这可能包括此类策略：评估 `NIST` 网站的可用性和信息内容，或评估出版物广告的回报率。作为 `NIST` 网站评估的一部分，`NIST`
    可以考虑增加研究导师的联系方式信息，以促进潜在申请者与相关 `NIST` 工作人员之间的对话。


    e. 最后，考虑目前是否有其他未充分利用但可能具有价值的推广策略，例如向院长、系主任及其他大学管理人员直接寄送邮件。


    f. 此外，确定是否有任何可以作为 `NIST/NRC RAP` 理想人选的研究生（以及潜在申请者）不了解该计划以及如何申请，是非常重要的。虽然构建研究生的随机样本很困难，但可能进行小范围的调查。


    3. **NIST 应该对拒绝研究助理职位（Research Associateships）报价的个人进行评估。** 这可以通过电话采访或问卷调查进行。由于每个周期拒绝的人很少，负担会相对较小。对于获得录取但拒绝的人员，应该询问两个基本问题：(1)
    你们拒绝的原因是什么？(2) 你打算转而去做什么？


    4. **NRC 应该修改申请表。** 应该减少字段数量，特别是合并非常相似的标签，并移除涵盖多个字段的标签（例如，“生物物理物理学生物化学”）。至少在博士领域方面，更精简的领域列表示例可以参考
    `NSF` 的《已获博士调查》（参见 `Appendix B`）。


    5. **NIST 应该更新 DataRAP 数据库，用当前的等效名称替换 NIST 内部已不存在的机构名称（例如学院或实验室）。**


    6. **NIST 应该对研究助理（RAs）在博士后任命期间的经历进行更彻底的评估，包括他们对该计划益处的满意度及看法，以及 `NIST` 对该计划益处的满意度及看法。**


    a. 为了协助工作，`NRC` 重新设计最终报告和研究导师评估表，以最大限度地从这些工具中收集数据（建议的问题请参见 `Box 3-1` 和 `Box 3-2`）。


    b. 最终报告和研究导师评估应设为强制性。


    c. 目前收集的数据中的某些元素可以进行进一步分析。


    i. 例如，`NIST` 可能希望对同行评审期刊进行进一步分析，例如通过：


    1. 询问研究助理是否为唯一作者或第一作者；

    2. 检查研究助理是否与 `NIST` 工作人员共同发表论文；

    3. 检查研究助理发表期刊的质量，尽管这需要对期刊进行排名。


    ii. `NIST` 可能希望对研究助理的生产力进行影响分析，例如通过：


    1. 进行引用分析，以查看他人引用研究助理论文的频率（注意，这可以使用引用索引完成），或

    2. 评估博士后获得的资助金类型或规模。


    iii. `NIST` 可能希望对其对研究助理的支持情况进行更彻底的审查，询问他们对 `NIST` 行政部门的熟悉程度、向这些部门寻求帮助的频率以及原因。


    d. `NIST` 还可以对研究助理（或 `NIST` ）的协作进行社交网络分析，以查看研究助理计划如何促进科学家和工程师之间新的或更广泛的协作。


    e. 在数据允许的情况下，`NIST` 可以考虑按实验室、性别和种族/民族对研究助理的生产力和满意度衡量进行分类统计。


    7. **NIST 应该对前研究助理的职业进行广泛评估，以评估该计划对研究助理职业、NIST 以及更广泛的科学工程领域的影响。** 执行此工作的最佳方法是问卷调查，将
    `NIST/NRC 研究助理` 的职业成果与类似的博士后进行比较。调查将针对这些前研究助理和合适的对照组进行。理想情况下，可以进行两种可能的比较。首先，可以构建一个同行组。该组将由一组与
    NIST 博士后相似的人员的匹配或分层样本组成。虽然并不理想，但一种解决方案是从奖学金办公室目录中提取前研究助理的分层样本。这是对前研究助理的普查；但正如报告早期提到的，许多...


