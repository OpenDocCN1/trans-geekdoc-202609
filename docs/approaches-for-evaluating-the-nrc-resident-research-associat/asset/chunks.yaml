    \ for hiring, increased breadth of expertise, novel research projects and their\
    \ impact, increased collaboration, increased numbers of applicants to the program,\
    \ or increased prestige); and\n(3) examining the costs of the program to NIST\
    \ (potential costs could include: costs to advisors or opportunity cost of not\
    \ hiring other staff).\n\nMethodologically, such analysis could take the form\
    \ of surveys of former RAs, social network analysis (to examine collaboration),\
    \ CV analysis (to examine the impact of the position on careers), or citation\
    \ analysis (to assess the impact of RAs’ work).\n\n## Preliminary Results\n\n\
    Preliminary evidence suggests that RAs contribute to the pool of qualified applicants\
    \ to permanent positions at NIST. About 45 percent of RAs indicated that their\
    \ immediate post-tenure position was at NIST as a permanent, temporary, or contract\
    \ employee after their appointment—a higher percentage than RAs at other federal\
    \ agencies. A survey of former RAs found that a higher percentage of former NIST/NRC\
    \ RAs stayed at NIST than RAs at other federal agencies stayed at their host agency\
    \ (37.6 to 28.1 percent). Second, evidence on the outcomes of the Program is largely\
    \ lacking. Little data are collected on the career outcomes of former RAs; and\
    \ the value of the program to NIST or to the broader scientific and engineering\
    \ community.\n\n## Recommendations\n\n1. **NIST should conduct a broad evaluation\
    \ of the careers of former RAs to evaluate the impact of the Program on RAs’ careers,\
    \ NIST, and the broader science and engineering community.** The best approach\
    \ for doing this is a survey, which would compare the career outcomes of NIST/NRC\
    \ RAs to similar postdocs. The survey would be directed towards these former RAs\
    \ and a suitable control group. Ideally, two possible comparisons could be made.\
    \ First, one could construct a peer group. This would consist of a matched or\
    \ stratified sample of individuals who had postdocs similar to the one at NIST\
    \ for the comparison group. Although not ideal, one solution would be to take\
    \ a stratified sample of former RAs from the Fellowships Office’s Directory. This\
    \ is a census of former RAs; but as noted earlier in the report, many of these\
    \ individuals could not be found or failed to respond to an earlier survey designed\
    \ to collect information on their current employment. A second comparison group\
    \ would consist of similar doctorates. A roster could be assembled by tapping\
    \ the group of applicants to RAPs, who did not receive an award. These individuals\
    \ will likely exhibit a diversity of career paths, including some who took postdocs\
    \ (in academia or industry) and others who went straight into employment. `[Box\
    \ 4-1](../Text/ch013.xhtml#p200138f5bbb00087)` offers suggested questions that\
    \ might be asked.\n\n### Box 4-1 Career Assessment Survey of Former Research Associates\n\
    \n1. Which Associateship were you?\n2. Which lab?\n3. Which division/department?\n\
    4. Start date of postdoc\n5. End date of postdoc\n6. What was your primary reason\
    \ for?\n   a. Training in Ph.D.\n   b. Specific direction of postdoc\n   c. Area\
    \ outside of postdoc\n   d. Employment\n   e. Prestige of your\n   f. Citizenship\n\
    \   g. Gender\n   h. Other: \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\n8. Demographic\
    \ information\n   a. Highest degree\n   b. Year received (since the postdoc)\n\
    \   c. Where are you currently:\n   i. Educational institution\n   ii. Industry\n\
    \   iii. Government\n   iv. Not-for-profit\n   v. Self-employed\nd. If government,\
    \ are you at:\n   i. K-12\n   ii. Two-year college or technical institute\n  \
    \ iii. Four-year university\n9. Did you find the program?\n10. Is your current\
    \ position?\n11. Is your postdoctoral appointment the same as your first?\n12.\
    \ If no, what was the type of?\n13. When it came to securing my first-postdoc\
    \ position?\n14. How useful did you find the following factors? (1 = not at all\
    \ to 5 = extremely useful, plus Not Applicable)\n   a. Contacts initiated by\n\
    \   b. Contacts you initiated\n   c. Contacts provided by your advisor\n   d.\
    \ Contacts provided by someone else\n   e. Prestige of your\n   f. Prestige of\
    \ the agency\n   g. Prestige of the RAP\n   h. Publications for which you received\
    \ credit\n   i. Presentations you gave while postdoc\n   j. Grants\n   k. The\
    \ area you were researching while postdoc\n   l. Other: \\_\\_\\_\\_\\_\\_\\_\\\
    _\\_\\_\\_\\_\\_\\_\\_\\_\n15. Productivity (Over the past five years since the\
    \ end of postdoc)\n    a. Publications\n    i. Books, book chapters\n    ii. Publications\
    \ in peer-reviewed journals\n    b. Patents awarded\n    c. Presentations\n  \
    \  i. Domestic\n    ii. International\n    d. Awards received\n    e. Grants\n\
    16. To what extent did the program help you? (1 = not at all to 5 = a great deal,\
    \ plus Not Applicable)\n    a. To what extent have you continued to stay in touch\
    \ with people you met during the postdoc?\n    i. Your research advisor\n    ii.\
    \ Other agency staff\n    iii. Other postdocs\n17. To what extent do you agree\
    \ or disagree with the following statements (1 = strongly disagree to 5 = strongly\
    \ agree)?\n    a. Overall, I found my postdoc experience valuable\n    b. When\
    \ it came to securing my first postdoc position, my postdoc experiences put me\
    \ on equal footing with other postdoctoral researchers of similar qualifications\n\
    \    c. My postdoc experiences taught me most of what I needed to prepare grant\
    \ proposals\n    d. My postdoc experiences taught me most of what I needed to\
    \ conduct independent research\n    e. My postdoc experience led to a professional\
    \ expertise that I would not have developed\n    f. I established on-going friendships\
    \ with people I met at my host institution\n    g. I am proud to have been a NIST\
    \ Postdoc\n18. To what extent did your postdoctoral experience hinder or help\
    \ with each of the following? (1 = no help at all to 5 = extremely helpful, plus\
    \ Not Applicable)\n    a. Quality of your current research\n    b. Specific direction\
    \ of your current research\n    c. Progress of your current research\n    d. Your\
    \ success in obtaining subsequent funding\n    e. Your teaching/curricular activities\n\
    \    f. Your ability to mentor others\n    g. Your confidence in performing leading-edge\
    \ research\n    h. Your career as a whole\n    i. Other: \\_\\_\\_\\_\\_\\_\\\
    _\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\n19. Other\n    a. Have you recommended the postdoc\
    \ to others?\n    b. Would you?\n    c. What were the best features of the postdoc?\n\
    \    d. What were the worst features of the postdoc?\n"
  trans: "\n有许多理由应对前研究助理（RA）的职业生涯进行更彻底的评估。收集目前尚未进行的前 RA 职业生涯数据，将为 NIST 如果想对该计划进行更改或进一步改进提供基准参考，并将有关该计划的信息从定性数据转向定量数据。未来的评估可以从几个方向开展，总体而言包括：\n\
    \n(1) 研究对 RA 的益处（潜在益处包括：更好或更多的培训、博士后任命后更高的生产力、博士后任命后获得更多资助）；\n(2) 研究对 NIST 的益处（潜在益处包括：NIST/NRC\
    \ RA 的成功、更多、更好的招聘替代方案、专业知识范围的扩大、新研究项目及其影响、合作的增加、计划申请人数的增加或声誉的提高）；以及\n(3) 审查该计划对\
    \ NIST 的成本（潜在成本包括：导师的成本或未聘用其他人员的机会成本）。\n\n在方法论上，此类分析可以采取对前 RA 进行调查的形式、社交网络分析（以考察合作）、简历分析（以考察该职位对职业的影响）或引用分析（以评估\
    \ RA 工作的影响）。\n\n## 初步结果\n\n初步证据表明，RA 为 NIST 永久职位的合格申请人库提供了贡献。约 45% 的 RA 表示，他们在获得任命后的第一份工作是在\
    \ NIST 担任永久、临时或合同员工——这一比例高于其他联邦机构的 RA。对前 RA 的一项调查发现，前 NIST/NRC RA 留在 NIST 的比例高于其他联邦机构\
    \ RA 留存在其所属机构的比例（37.6% 对 28.1%）。其次，很大程度上缺乏关于该计划结果的证据。关于前 RA 职业结果收集的数据较少，且该计划对\
    \ NIST 或更广泛的科学工程社区的价值也缺乏数据。\n\n## 建议\n\n1. **NIST 应对对前 RA 的职业生涯进行广泛评估，以评估该计划对\
    \ RA 职业生涯、NIST 以及更广泛的科学工程社区的影响。** 实施此目标最佳方法是调查，将 NIST/NRC RA 的职业结果与类似的博士后进行比较。调查将针对这些前\
    \ RA 以及一个适当的对照组进行。理想情况下，可以进行两种可能的比较。首先，可以构建一个同伴群体。这将由一组具有与 NIST 博士后相似经历的匹配或分层样本组成，作为比较组。虽然不理想，但一种解决方案是从奖学金办公室的目录中对前\
    \ RA 进行分层抽样。这是对前 RA 的普查；但正如报告早些时候提到的，许多这些人无法被找到，或未能对之前旨在收集其当前就业信息的调查做出答复。第二个比较组将由类似的博士组成。可以通过联系一组未获得\
    \ RAP（研究助理计划）申请人群体来编制一份名单。这些人可能会表现出多样化的职业路径，包括一些选择了博士后职位（学术界或工业界），另一些则直接进入就业。`Box\
    \ 4-1` 提供了可能提出的问题。\n\n### Box 4-1 前研究助理职业评估调查\n\n1. 您是哪种类型的助理？\n2. 哪个实验室？\n3.\
    \ 哪个部门/科室？\n4. 博士后开始日期\n5. 博士后结束日期\n6. 您的主要目的是？\n   a. 博士期间培训\n   b. 博士后特定方向\n\
    \   c. 博士后之外的领域\n   d. 就业\n   e. 您的声望\n   f. 国籍\n   g. 性别\n   h. 其他：\\_\\_\\_\\\
    _\\_\\_\\_\\_\\_\\_\n8. 人口统计信息\n   a. 最高学历\n   b. 获得年份（自博士后以来）\n   c. 您目前所在地：\n\
    \      i. 教育机构\n      ii. 工业界\n      iii. 政府\n      iv. 非营利组织\n      v. 自雇\nd.\
    \ 如果在政府，您是在：\n   i. K-12 教育\n   ii. 二制学院或技术学院\n   iii. 四制大学\n9. 您觉得这个计划有用吗？\n\
    10. 您目前的职位是？\n11. 您的博士后任命与第一个相同吗？\n12. 如果不同，类型是什么？\n13. 在获得我的第一份博士后职位时？\n14. 您认为以下因素有多用？（1\
    \ = 完全没用到 5 = 非常有用，加不适用）\n   a. 由……发起的联系\n   b. 您发起的联系\n   c. 您的导师提供的联系\n   d.\
    \ 其他提供的联系\n   e. 您的声望\n   f. 机构的声望\n   g. RAP 的声望\n   h. 您获得信名的出版物\n   i. 您在博士后期间做的演讲\n\
    \   j. 资助\n   k. 您在博士后期间的研究领域\n   l. 其他：\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\\
    _\\_\\_\\_\n15. 生产力（博士后结束后的过去五年）\n    a. 出版物\n      i. 书籍、书籍章节\n      ii. 同评审期刊上的出版物\n\
    \    b. 授予的专利\n    c. 演讲\n      i. 国内\n      ii. 国际\n    d. 获得的奖励\n    e. 资助\n\
    16. 该计划在多大程度上对你有帮助？（1 = 完全没有帮助 5 = 极大，加不适用）\n    a. 您在多大程度上继续与博士后期间认识的人保持联系？\n\
    \      i. 您的研究导师\n      ii. 其他机构人员\n      iii. 其他博士后\n17. 您在多大程度上同意或不同意以下陈述（1\
    \ = 强烈不同意 5 = 强烈同意）\n   a. 总体而言，我认为博士后经历非常有价值\n   b. 在获得第一份博士后职位时，我的博士后经历让我与具有相似资质的其他博士后研究人员处于平等水平\n\
    \   c. 我的博士后经历教会了我准备资助申请所需的大部分知识\n   d. 我的博士后经历教会了我进行独立研究所需的大部分知识\n   e. 我的博士后经历使我获得了我本不会发展的专业知识\n\
    \   f. 我与所在机构的人建立了长期的友谊\n   g. 我为能当一名 NIST 博士后感到自豪\n18. 您的博士后经历在多大程度上阻碍或帮助了以下每一项？（1\
    \ = 完全没有帮助 5 = 非常有帮助，加不适用）\n    a. 您当前研究的质量\n    b. 您当前研究的特定方向\n    c. 您当前研究的进展\n\
    \    d. 您获得后续资金的成功\n    e. 您的教学/课程活动\n    f. 您指导他人的能力\n    g. 您从事前沿研究的信心\n   \
    \ h. 您的整个职业\n    i. 其他：\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\n19.\
    \ 其他\n    a. 您向其他人推荐过这个博士后职位吗？\n    b. 您会推荐吗？\n    c. 博士后最好的特点是什么？\n    d. 博士后最糟糕的特点是什么？\n"
