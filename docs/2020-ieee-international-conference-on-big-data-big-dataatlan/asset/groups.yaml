    ## VI. 结论与展望


    在本文中，我们使用半监督学习方法从卫星图像中识别粉埃。我们设计了一种工作流，从 CALIPSO 识别像素中提取时空范围，并使用这些数据选择 K 均类作为最终结果。我们在不同实验中检查了方法的效率，包括：

    - 在不同区域检测粉埃的能力

    - 比较不同方法的平均准确率

    - 使用常用分类对所有像素验证我们的结果

    - 使用轮廓系数评估聚类性能


    图 9. 物理方法得到的图 5-7 真实示例的粉埃结果。(a) 真彩色，(b) 粉埃复合图，(c) 所提方法的生成是 Ackerman [3] 生成的粉埃结果副本。


    对于未来的工作，我们将从以下方向改进这项研究。首先，我们将通过与现有气溶胶和粉埃产品对比来验证粉埃结果。我们将使用的产品之一是可见光辐射计数据套环境数据 (VIIRS
    Aerosol EDD) 产品 [35]，但该产品未检测到它。我们将寻找替代产品。此外，我们将使用 CALIPSO 数据引导聚类，但 CALIPSO 数据仅沿轨道可用；因此无法用于全监督方法的空间聚类。第三，我们将探索半监督方法作为使用少量
    CALIPSO 派生层分割粉埃的替代方案。


