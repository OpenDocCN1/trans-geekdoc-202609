    subplots). The two study areas show different distributions, the difference between
    dust and non-dust categories significant. The significant difference between dust
    and non-dust categories inspired us to find the most similar clusters to the dust
    category in spectrum and consider them as dust clusters.


    Fig. 3. Workflow of the methods.


    ### A. K-Means Clustering


    K-means clustering is used to segment the VIIRS imagery into different clusters.
    K-means clustering [34] is a method that partitions a dataset of observations
    $(x_1, \dots, x_n)$.


    ![](img/2edf0e112d39cfbfea23cd10c348daec_5_0.png)


    The similarity function utilized here is the Euclidean distance. The cluster that
    has the highest similarity to the dust signature is considered as the dust cluster.
    Additionally, k-means clusters may contain information, especially since several
    types of dust (pure, polluted, etc.). If the similarity values of other clusters
    to the dust signature are within a wide range, the similarity values are also
    high enough, then these clusters are considered potential dust clusters. Potential
    dust clusters can complete the small dust region when the number of clusters (K)
    is large.


