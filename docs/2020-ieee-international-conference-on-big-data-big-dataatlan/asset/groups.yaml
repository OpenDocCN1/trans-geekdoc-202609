    **Abstract**—Dust plumes originate from the arid and semi-arid areas can significantly
    affect the climate system and human health. Many methods have been developed to
    identify dust pixels from satellite imagery, but these methods are limited by
    spectral rules and therefore make difficult to detect dust above or below the
    detectable thresholds. Supervised machine learning methods have also been applied
    to detect dust but fail outside the training data due to inadequate of ground
    truth data. In this work, we propose an automatic segmentation framework based
    on spectral features learned from alocated dataset using Visible Infrared Radiometer
    Suite (VIIRS) and Cloud-Aerosol L Pathfinder Satellite Observation (CALIPSO).
    We propose the segmentation of VIIRS imagery, and provide the guidance from the
    dust labels using the dust product of CALIPSO to detect the dust clusters as primary
    and secondary dust clusters. Experimental results show that the accuracy of the
    proposed framework outperforms the literature, and the method performs well across
    three different areas, the North Atlantic Ocean, East Asia, and Northern Africa.


