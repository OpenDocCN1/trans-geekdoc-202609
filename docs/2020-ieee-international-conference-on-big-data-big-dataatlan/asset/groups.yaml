    **摘要**——源自干旱和半干旱地区的沙尘云会显著影响气候系统和人类健康。目前已开发出许多从卫星图像中识别沙尘像素的方法，但这些方法受限于光谱规则，因此难以检测探测阈值之上或以下的沙尘。监督机器学习方法也被应用于检测沙尘，但由于缺乏地面真值数据，它们在训练数据之外会失效。在这项工作中，我们提出了一种自动分割框架，该框架基于利用可见红外辐射计套件（VIIRS）和云气溶胶激光路径器观测（CALIPSO）从分配的数据集中学习的光谱特征。我们对
    VIIRS 图像进行分割，并利用 CALIPSO 沙尘产品提供的沙尘标签引导，将沙尘簇检测为主要和次要沙尘簇。实验结果表明，该框架的精度优于现有文献，该方法在北大西洋、东亚和北非三个不同区域均表现良好。


    沙尘暴受多种因素影响，包括天气变量，如降水和风速 [1]。观测到局部沙尘暴的频率正在增加，对风力、人类社会和社区的影响日益增大 [2]。卫星遥感可以获取大气成分的空间连续信息，但在亮表面上很难将沙尘与其他大气成分区分开来。在时间、空间和光谱特征上，卫星传感器存在差异。例如，位于太阳极地轨道伙伴（S
    NPP）卫星上的可见红外辐射计套件（VIIRS）具有较宽的覆盖范围（跨径约3400km），使其能够捕捉更多的沙尘暴事件。同时，云气溶胶激光和距离观测（CALIPSO）上的云到正交极化的去极化增强了传感器检测非光谱颗粒（如沙尘）的能力。然而，激光束仅有很窄幅幅（跨径方向约330km）。为了检测沙尘事件并提取光谱信息，通过合成方法结合这两种卫星观测是有益的。


    **索引术**——沙尘检测，半监督机器学习，多传感器遥感，图像分割


    # I. 引言


    沙尘事件是干旱和半干旱地区的常见现象，通常在强风吹起来自地球表面的细颗粒时发生。大气沙尘对空气质量、水形成、辐射平衡、生物地球化学循环和气候有影响。另一方面，沙尘暴通常具有破坏性。由于气候的影响，局部尺度的沙尘暴随着气候的变化发生了剧烈变化……


    为了解决这个问题，研究人员一直在使用监督学习方法来学习沙尘发生情况与卫星图像像素级光谱辐射之间的关系 [8]。训练后的模型随后被用于确定观测到的像素是否为沙尘。然而，监督学习方法存在若干缺点。坦率地说，它们需要一组标记了沙尘像素的训练示例，对图像进行像素级标记是极其耗时的人力。CALIPSO
    垂直特征和气溶胶剖面产品被用于分类气溶胶，但 CALIPSO 是空间标记的，且可能无法覆盖整个几何区域 [11]。现有的沙尘检测监督学习方法 [8] 利用
    CALIPSO 沙尘作为地面真值，使用训练好的 CALIPSO 离轨模型。即使离轨测试是准确的，离轨检测性能也可能较低，因为模型处理受到离轨沙尘带的数量。其次，很难从卫星图像中检测沙尘，因为将沙尘与其他挑战区分开来具有挑战性。标记沙尘图像也很困难。第三，现有的监督学习方法使用来自
    CALIPSO 的数据训练，没有考虑到沙尘的变率。众周知沙尘暴出现在单个像素中——而不是随时间演变；因此，跟踪沙尘暴的卫星内容更有用。


    为了解决这个问题，……学习方法；然后它一步到位确定识别出的一个或多个沙尘簇。沙尘聚类基于簇与来自相同时空位置样本之间的相似性。


    ## 2. 据我们所知，这是首次将半监督学习方法用于从卫星图像检测沙尘。


    半监督学习方法适用于这项任务，因为它将利用来自 CALIPSO 的有限沙尘带，并产生具有一定精度的分割。然而，这种半监督学习方法是新颖，与现有的图像分割方法（见
    II.C 节）不同，且使用了有限的沙尘带。


    ## 3. 所提方法的沙尘检测验证结合了监督和无监督学习方法的精度指标。仅通过一种学习方法的传统精度不足以评估结果。本研究利用分类、精确率和召回率在像素位于轨道内
    CALIPSO 时评估结果，然后利用轮廓系数评估聚类质量。结果涵盖轨道内和离轨。


    另一方面，无监督学习可以在没有预标记的情况下提取模式，适用于标签稀缺卫星图像沙尘检测。无监督学习无法利用 CALIPSO 的沙尘带，因为无监督方法的结果很难与物理意义联系起来。


    本文旨在开发一种利用半监督学习的自动框架，结合无监督学习和 CALIPSO 从 VIIRS 图像检测沙尘。首先应用 K 聚类生成 VIIRS 图像簇，然后根据与
    CALIPSO 沙尘特征的相似性选择一个或多个簇作为沙尘簇。沙尘特征展示了不同波段观测值的密集值。这种方法解决了固定阈值和参数的局限性并确保了可重复性。


    本研究的创新性来自三个领域：


    - 1) 方法论。如上述，监督和无监督学习方法都有局限性。本研究提出了一种新的半监督学习方法来解决这些局限性。该方法首先使用无监督方法对卫星图像进行聚类


    # II. 相关工作


    ### A. 传统沙尘检测方法


    现有的云团遥感沙尘检测方法使用热红外在 1 微米和 12 微米波附近的亮度温度差（BDT）检测沙尘 [12]。该方法分配具有沙尘 BDT 值的像素，当观测到
    BDT 值通常下降到零以下时存在沙尘 [14]。后来，一组带有相应启发式规则的 BDT 被用于从气象云中检测沙尘。Ackerman [13] 使用两个传感器，即
    BT11-BT12 和 BT08-BT11（分析 8.5 微米和 11 微米波长的信号）检测气溶胶和沙尘层。Wald [15] 使用两个 BDT 识别沙漠地区的沙尘，Miller
    [16] 增强了对水陆地上白天气溶胶沙尘的调查。然而，BDT


