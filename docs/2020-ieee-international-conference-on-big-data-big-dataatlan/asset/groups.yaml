    ## C. Comparison of Accuracy Using The Proposed Method Among Three Study Areas


    Table II measures the mean and standard deviation of accuracy metrics using the
    proposed method over the three different areas. The proposed method performs best
    detecting the Asian spring dust area with an accuracy of 0.71 but performs worst
    (0.060) detecting dust in the North Arctic region.


    For the dust category, the mean precision ranges 0.55 to 0.63 for three study
    areas, 50% of detected dust is CALIPSO observed; but the mean recall shows significant
    differences among the three areas. The mean recall for the North Arctic is high
    (0.99), which is the lowest (0.42), indicating that less than half of the CALIPSO
    observed dust pixels are detected. The assumptions for the high recall values
    in the North Arctic region are valid since the region is mainly ocean or ice.
    It is relatively easier than detecting dust in the other two study areas. The
    North African spring area contains arid areas or deserts, which makes it difficult
