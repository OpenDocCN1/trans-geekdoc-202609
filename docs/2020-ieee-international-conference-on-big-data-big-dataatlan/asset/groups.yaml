    Many variants of K-means clustering proposed in the literature based on initialization
    methods, distances, or different cluster representations. For example, the K-medians
    use the median of each cluster instead of the mean. Nevertheless, these methods
    are similar to the current K-means, and their results are not included in this
    paper.


