    # II. RELATED WORKS


    # A. Traditional Dust Detection Methods


    Existing methods of dust detection from plumes satellite remote sensing are using
    the brightness temperature difference (BDT) between Thermal Infrared (TIR) at
    around 1 μm and 12 μm wavelengths to detect dust [12]. This method assigns pixels
    with dust BDT values, lower than what is observed that the dust exists when the
    BDT values generally decrease to below zero [14]. Later, a set of BDTs with corresponding
    heuristics was used to detect dust from meteorological clouds. Ackerman [13] using
    two sensors, i.e., BT11-BT12 and BT08-BT11 (analyzing the signal at 8.5 μm and
    11 μm wavelengths) to detect aerosol and dust layers. Wald [15] used two BDTs
    to identify dust over desert regions, Miller [16] enhanced the investigation of
    daytime aerosol dust over water and land. However, BDT


