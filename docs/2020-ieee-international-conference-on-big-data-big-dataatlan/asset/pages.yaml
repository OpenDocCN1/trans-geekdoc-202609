    # B. VIIRS


    The Visible Infrared Radiometer Suite (VIIRS) instruments and collects global
    satellite observations that span the visible and infrared (IR) wavelengths across
    cloud, ocean, and atmosphere (https://tesac.iis.nasa.gov/VIIRS/) VIIRS uses passive
    sensors. It has twelve channels ranging from 0.41 µm to 12.1 µm. Five of these
    channels are high-resolution image bands and I-bands, with moderate-resolution
    bands and M-bands. In this study we use the 16 M-bands with 75 m spatial resolution
    which visible/reflective, near IR, medium-wave IR, and longwave M-bands provide
    ocean aerosol color information, M8 provides clear atmospheric information, M9
    provides cloud cover information, M10 provides snow cover information, M11 provides
    cloud information, M12-M13 and M16 provide surface water temperature and fires,
    and M14 provides all cloud types.


    # C. CALIPSO


    The Cloud-Aerosol Lidar and Infrared Pathfinder (CALIPSO) provides range-resolved
    information on the vertical distribution of aerosols and cloud boards (https://calipso.larc.nasa.gov/).
    The Cloud-Aerosol Lidar (CALIPOP) uses a two-wavelength elastic backscatter laser
    that transmits linearly polarized light at 532 nm and 1064 nm, each with a receiver
    that measures the parallel and orthogonal components of the attenuated backscatter
    at 532 nm and the total attenuated backscatter at 1064 nm. The CALIOP Level 2
    (L2) aerosol


