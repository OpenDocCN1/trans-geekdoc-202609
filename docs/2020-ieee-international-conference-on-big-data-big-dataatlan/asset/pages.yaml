    # I. INTRODUCTION


    Dust events are common phenomena in the arid and semi-arid regions, often rising
    when winds uplift fine-grained particles from the surface of the Earth. Atmospheric
    dust has impacts on air quality, water formation, radiation balance, biogeochemical
    cycles and climate. On the other hand, dust storms are usually damaging. Due to
    the climate, changes of dust storms at a local scale have changed drastically
    with climate and and'
