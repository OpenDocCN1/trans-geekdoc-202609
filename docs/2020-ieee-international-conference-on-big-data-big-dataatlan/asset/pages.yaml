    # IV. METHODS


    The automated framework of dust event detection is utilized in the workflow. Step
    1 pixels on CALIPOP tracks are categorized into dust and non-dust. Step 2 prepared
    VIIRS subset is generated using K-means. Step 3, the segmentation result is generated.
    Each cluster occupies a portion of the VIIRS granule set. Step 4, signature of
    the study area is generated from all dust pixels on CALIPOP tracks, and the corresponding
    VIIRS spectral band values stored in a column. Step 5, of the spectral band values
    between each cluster in the segmentation result and dust, are examined to determine
    if the cluster is more likely to be dust, Cluster(1) with high similarity values
    to dust. The dust event is generated. Step 7, pixels on track of CALIPOP are used
    to validate the dust detection result. Silhouette areas are also calculated to
    evaluate the quality of clustering.'
