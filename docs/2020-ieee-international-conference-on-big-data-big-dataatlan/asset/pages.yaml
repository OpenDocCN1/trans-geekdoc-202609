    # C. Semi-supervised Machine Learning for Image Segmentation


    While supervised machine learning methods have not been explored for dust detection,
    recent research using supervised machine learning for various kinds of semantic
    segmentation tasks has


    Semantic image segmentation is commonly used using supervised machine learning.
    One of the performing methods is Deep Convolutional Neural Network (DCNN), which
    can perform semantic segmentation using pixel-level labels [26]. Acquiring pixel-level
    annotation is time-consuming, so researchers are exploring ways to train models
    using weak annotations, such as bounding boxes or image-labels. Papadrou et al.
    [27] used either bounding boxes or a mixture of weak labels for semantic image
    segmentation using Expectation-Maximization (EM) methods. For dust detection,
    the CALIOP labels are pixel-based, but the pixels are on CALIPOP tracks. These
    labels are not sufficient to form a bounding box nor enough to be one per image.


    Another direction is to use unsupervised learning for semantic segmentation [28].
    This type of semantic segmentation uses fully labeled and unlabeled images to
    perform segmentation. For example, Huang et al. [29] proposed an adversarial learning
    for semi-supervised semantic segmentation, and used images to enhance the results.
    A full-convolutional network is trained to map the input image to a segmentation
    map. For dust detection, the CALIOP labels on-track are not able to form fully
    labeled labels, thus the semi-supervised machine learning methods for the task
    of dust detection are to be explored.


    # B. Supervised Machine Learning for Dust Detection


    To address the limitations of fixed thresholds or parameters, machine learning,
    including deep learning, can be used to learn the complex relationships between
    satellite imagery, making it possible to perform the derived statistics from statistical
    analysis. Some researchers have demonstrated the effectiveness of machine learning
    (and deep learning) in dust detection. Many studies have explored the common classification
    methods, including Support Vector Machines, Random Forests, Neural Networks, and
    Convolutional Networks [9]. It is found that machine learning algorithms outperform
    the derived from statistical analysis [10]. For example, Smith et al. [25] used
    an Artificial Neural Network (ANN) to study the characteristics of clouds and
    aerosols on both SEVI and CALIOP. Shi et al. [8] performed supervised machine
    learning methods, including SVM, Random Forest, Logistic Regression, on classifying
    dust or dust-free pixels along CALIPOP tracks using the spectral information from
    Resolution Spectometer (MODIS). They also developed a hybrid model combining the
    physical input with machine learning methods. Can et al. [9] Logistic Regression,
    K-Nearest, Random Forest, Feed Neural Network, and Convolutional Network on the
    capacity of classifying dust or dust-free pixels along CALIPOP tracks using the
    spectral information from VIIRS satellite. Kolos and Hassan [10] used an ANN to
    model the relationship between the aerosol optical depth (AOD) values, obtained
