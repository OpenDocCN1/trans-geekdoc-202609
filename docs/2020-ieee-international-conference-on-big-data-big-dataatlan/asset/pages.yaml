  md: '![](img/2edf0e112d39cfbfea23cd10c348daec_4_0.png)


    into $K (k \le n)$ sub-groups clusters ($C_1, \dots, C_K$). Each cluster $C_k$
    is identified by its $m_k$ value and generally an arbitrary label $k$. Observations
    from the dataset are assigned to the cluster with the nearest $m_k$, the Euclidean
    distance used to measure the cluster center. The underlying principle of the K-means
    clustering is to create a partition $(C_1, \dots, C_K)$ that minimizes the sum
    over the within-cluster variance. Within-cluster sum of squares (WSS) also called
    inertia Clusters and their means are derived from a random guess of clusters $m_1,
    \dots, m_K$, and by alternating through the two steps until reaching a stopping
    criterion. The first step is assigned to the cluster with the nearest $m_k$ in
    Euclidean distance. The second step is an update which calculates the $m_k$ of
    the observations in each cluster during the process. Several stopping criteria
    are used, such as no change in the means at a tolerance, the number of iterations,
    and no improvement in the cluster variance.


