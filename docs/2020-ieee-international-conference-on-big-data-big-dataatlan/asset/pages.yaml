    # VI. CONCLUSIONS AND FUTURE DIRECTIONS


    In this paper, we are using a semi-supervised learning method to identify dust
    extracts from satellite imagery. We designed a workflow to extract dust signature
    spatiotemporal ranges from CALIPOD identified pixels and used these data to select
    from the K-means clusters as final results. We examined the efficiency of our
    method in different experiments, including 1) testing the capability in detecting
    dust in different areas, 2) comparing the average accuracy among different methods,
    3) comparing our validated results using the common classification accuracy for
    all the pixels along the CALIPSO tracks, and 4) using silhouette coefficients
    to evaluate the clustering performance.


    Fig. 9. Dust resulted from the physical method for the true example of Figs. 5-7.
    Sub-images (a true colors, (b) dust composites), and (c) results generated from
    the proposed method are replicates of images in Figs. 5-7. Submatrices of dust
    results generated by Ackerman [3].


    For the future work, we will improve this study in the following directions. First,
    we will validate the dust results by comparing it with existing aerosol and dust
    products. One of the products we will use is the Visible Imaging Radiometer Suite
    Environmental Data (VIIRS Aerosol EDD) product [35], but the product did not detect
    it in dust and failed to identify dust in all time periods. We will search for
    alternative products. In addition, we will use the CALIPSO data to guide the clustering,
    but the CALIPSO data is only available along the track; thus it cannot be used
    in a fully supervised method for spatial clustering. Third, we will explore semi-supervised
    methods as an alternative to segment dust from using a small number of CALIPOD-derived
    layers.


