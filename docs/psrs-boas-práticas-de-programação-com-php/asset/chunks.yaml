- raw: "Ao combinar o operador de referência `&` e o operador variável de três pontos\
    \ `...`, NÃO DEVE haver nenhum espaço entre os dois. Essa regra é bem semelhante\
    \ à anterior, vamos analisar o exemplo a seguir para vermos onde está a diferença:\n\
    \n```\n<?php\n\ndeclare(strict_types=1);\n\nnamespace App\\Crypt;\n\nclass Crypt\n\
    {\n    public function crypt(string $string, &...$parts): string\n    {\n    \
    \    //Código\n    }\n}\n```\n\nA única diferença apresentada nesse exemplo é\
    \ a combinação do operador de referência `&` e o operador variável de três pontos,\
    \ `...`. As demais regras de espaçamento se aplicam identicamente a essa regra.\n\
    \nE como seria um dos modos considerado incorreto pela PSR-12? Seria da seguinte\
    \ maneira:\n\n```\n<?php\n\ndeclare(strict_types=1);\n\nnamespace App\\Crypt;\n\
    \nclass Crypt\n{\n    public function crypt(string $string, & ... $parts): string\n\
    \    {\n        //Código\n    }\n}\n```\n\n### Conclusão\n\nComo você pôde ver\
    \ são inúmeras regras que a PSR-12 disponibiliza, e ainda tem mais! No próximo\
    \ capítulo continuaremos vendo quais são as demais regras da PSR-12. Então, siga\
    \ em frente!\n\nCapítulo 11 \n\n# PSR-12 (Extended Coding Style) - Parte II\n\n\
    Vimos no capítulo anterior um total de 35 regras da PSR-12. Neste capítulo vamos\
    \ continuar vendo essas regras que visam facilitar o estilo do nosso código-fonte\
    \ para obtermos uma melhor leitura e compreensão através dos padrões estabelecidos\
    \ pela PSR-12. Lembrando que a PSR12 é uma extensão da PSR-2 e por esse motivo\
    \ a PSR-2 foi descontinuada.\n\n## 11.1 Regras\n\nA seguir vamos continuar com\
    \ as regras de onde paramos no capítulo anterior.\n\n### Regra 36\n\nAs palavras-chaves\
    \ `abstract` e `final` DEVEM ser declaradas antes de definir a visibilidade de\
    \ classes e métodos. Há casos em que precisamos criar uma classe abstrata ou final,\
    \ por exemplo, ou até mesmo métodos, e existe uma maneira correta de fazer isso.\n\
    \nPara simplificar o entendimento, vamos analisar o exemplo a seguir, que demonstra\
    \ a maneira correta de seguir essa regra:\n\n```\n<?php\n\ndeclare(strict_types=1);\n\
    \nnamespace App\\Sercice;\n\nabstract class AbstractService\n{\n    protected\
    \ static $dados;\n\n    abstract protected function insert(): bool;\n\n    final\
    \ public static function start(): bool\n    {\n        //Código\n    }\n}\n```\n\
    \nPerceba que as palavras-chaves `abstract` e `final` precedem a visibilidade\
    \ dos dois métodos `insert()` e `start()`. Na classe não existe a visibilidade\
    \ para ser definida, mas podemos informar se é uma classe abstrata ou final.\n\
    \nPerceba também que a palavra-chave `static` está definida após a visibilidade\
    \ do método e da propriedade.\n\nÉ um exemplo simples, mas que demonstra a utilização\
    \ dessas palavras-chaves. Agora veremos um exemplo que demonstra a maneira incorreta\
    \ de utilizá-las:\n\n```\n<?php\n\nnamespace App\\Sercice;\n\nclass abstract AbstractService\n\
    {\n    protected $dados;\n\n    protected abstract function insert(): bool;\n\n\
    \    public final static function start(): bool\n    {\n        //Código\n   \
    \ }\n}\n```\n\nNesse exemplo, as palavras-chaves `abstract` e `final` encontram-se\
    \ logo após a visibilidade dos métodos e também logo após a palavra-chave `class`.\n\
    \nEsse exemplo já não funcionará pois não podemos definir uma classe abstrata\
    \ após a palavra-chave `class`, sendo permitido apenas antes.\n\nPerceba que nos\
    \ métodos também existem as palavras `abstract` e `final` após a definição da\
    \ visibilidade, e não há problemas. Porém, se fizer deste modo, seu código não\
    \ ficará de acordo com a regra estabelecida.\n\n### Regra 37\n\nAo declarar um\
    \ método ou função NÃO DEVE existir espaço entre o nome do método/função e o parêntese\
    \ de abertura.\n\nNÃO DEVE existir espaço após o parêntese de abertura e NÃO DEVE\
    \ existir espaço antes do parêntese de fechamento; e na lista de parâmetros NÃO\
    \ DEVE existir espaço antes de cada vírgula, mas DEVE existir um espaço após cada\
    \ vírgula. Parece complexo, não é mesmo? Mas não é complicada, na verdade é tão\
    \ simples quanto definir uma variável. Veja o exemplo a seguir que demonstra a\
    \ maneira correta da aplicação dessa regra:\n\n```\n<?php\n\ndeclare(strict_types=1);\n\
    \nnamespace App\\Sercice;\n\nclass AbstractService\n{        \n    protected function\
    \ update($id, array $dados): bool\n    {\n        //Código\n    }\n}\n```\n\n\
    Simples, não? Note que quando definimos o nome do método não existe espaço antes\
    \ e após o parêntese de abertura, não existe espaço antes da vírgula entre os\
    \ parâmetros e não existe espaço antes e após o parêntese de fechamento.\n\nAgora\
    \ vamos analisar um exemplo considerando a maneira incorreta e que não estará\
    \ em conformidade com essa regra da PSR:\n\n```\n<?php\n\ndeclare(strict_types=1);\n\
    \nnamespace App\\Sercice;\n\nclass AbstractService\n{        \n    protected function\
    \ update ( $id , array $dados ): bool\n    {\n        //Código\n    }\n}\n```\n\
    \nEsse exemplo está completamente fora da regra, pois existe espaço em tudo quanto\
    \ é lugar na definição do método, evite ao máximo utilizar esse estilo de código.\n\
    \n### Regra 38\n\nA lista de parâmetros pode ser dividida em várias linhas, onde\
    \ cada linha subsequente é recuada uma vez. Ao fazer isso, o primeiro item da\
    \ lista DEVE estar na próxima linha e DEVE haver apenas um parâmetro por linha.\n\
    \nUm único parâmetro dividido em várias linhas (como pode ser o caso de uma função\
    \ ou matriz anônima) não constitui a divisão da própria lista de parâmetros.\n\
    \nVamos analisar o exemplo a seguir para tornar mais clara a utilização dessa\
    \ regra:\n\n```\n<?php\n\n$usuario->setDados(\n    $nome,\n    $sobrenome,\n \
    \   $idade\n)\n```\n\nPerceba que assim como podemos quebrar a definição da lista\
    \ de parâmetros dos métodos e funções, também podemos quebrar em linhas a lista\
    \ de parâmetros passados para o método/função.\n\nVamos analisar um outro exemplo\
    \ que segue a mesma ideologia do exemplo anterior, porém com outros exemplos que\
    \ são permitidos pela PSR-12, inclusive utilizando função anônima:\n\n```\n<?php\n\
    \n$usuario->setDados($nome, $sobrenome, [\n    'idade' => 29,\n    'data_nascimento'\
    \ => '1990-06-06'\n], $sexo);\n\n$app->get('/hello/{name}', function ($name) use\
    \ ($app) {\n    return 'Hello ' . $app->escape($name);\n});\n```\n\n### Regra\
    \ 39\n\nApós a palavra-chave da estrutura de controle DEVE existir um espaço.\
    \ NÃO DEVE existir um espaço após o parêntese de abertura (se necessário).\n\n\
    NÃO DEVE existir espaço antes do parêntese de fechamento (se necessário). DEVE\
    \ existir um espaço entre o parêntese de fechamento e a chave de abertura.\n\n\
    O corpo da estrutura de controle DEVE ser indentado uma vez. A chave de fechamento\
    \ DEVE ser colocada uma linha após o corpo da estrutura de controle. Essa regra\
    \ também parece assombrosa, mas ela é simples. Volto a dizer que é mais uma questão\
    \ de adaptação e costume do que uma dificuldade lógica propriamente dita.\n\n\
    Vamos analisar um exemplo para cada estrutura de controle, que demonstra a maneira\
    \ correta a ser seguida:\n\n**Exemplos com `if`, `elseif`, `else`**\n\n```\n<?php\n\
    \nnamespace App\\Sercice;\n\nclass AbstractService\n{        \n    protected function\
    \ update($id, array $dados)\n    {\n        $resultado = null;\n\n        if (is_int($id))\
    \ {\n            $resultado = 'ID é um inteiro';\n        } elseif (is_numeric($id))\
    \ {\n            $resultado = 'ID é uma string contendo apenas números';\n   \
    \     } else {\n            $resultado = 'ID não possui um formato válido';\n\
    \        }\n    }\n}\n```\n\nPerceba a indentação da estrutura de controle, o\
    \ espaço antes do parêntese de abertura e ainda o espaço após o parêntese de fechamento\
    \ antes da chave de abertura da estrutura de controle.\n\nExpressões entre parênteses\
    \ podem ser divididas em várias linhas, sendo que cada linha subsequente é recuada\
    \ pelo menos uma vez. Ao fazer isso, a primeira condição DEVE estar na próxima\
    \ linha. O parêntese de fechamento `)` e a chave de abertura `{` DEVEM ser colocados\
    \ juntos em sua própria linha, com um espaço entre eles. Operadores booleanos\
    \ entre condições DEVEM estar sempre no início ou no final da linha, não uma mistura\
    \ de ambos.\n\nVamos analisar um exemplo de aplicação dessa regra:"
