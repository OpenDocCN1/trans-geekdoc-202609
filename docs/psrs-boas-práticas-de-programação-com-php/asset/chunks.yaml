- raw: "Nosso próximo passo é falar sobre a PSR-6, e por isso, talvez você possa estar\
    \ se perguntando, mas o que aconteceu com a PSR-5? Até o momento da escrita deste\
    \ livro a PSR-5 (PHPDoc Standard) está em faze de esboço e por isso não será tratada\
    \ aqui. Focamos apenas nas PSRs que foram aprovadas e estão ativas no momento,\
    \ tudo bem? Excelente, então vamos nessa rumo à PSR-6.\n\nCapítulo 7 \n\n# PSR-6\
    \ (Caching Interface)\n\nFazer cache dos dados da aplicação se tornou cada vez\
    \ mais necessário, porém há muitas maneiras de se fazer isso. Cada framework e/ou\
    \ microframework possui uma forma diferente de fazer esse gerenciamento e uma\
    \ das principais consequências disso é que o desenvolvedor tem que ficar se adaptando\
    \ a cada novo modelo de definir o cache. No Zend Framework é de um jeito, no Symfony\
    \ é de outro e por aí vai.\n\nCom o objetivo de acabar com esse problema, surgiu\
    \ a PSR-6 que visa definir um padrão para criação de cache e é exatamente isso\
    \ que veremos a seguir.\n\n## 7.1 Regras\n\nConfira nesta seção o conjunto de\
    \ todas as regras e características que fazem parte dessa PSR.\n\n### Regra 1\n\
    \n**Chamando na aplicação** - A aplicação ou o código que utilizar os serviços\
    \ de cache DEVERÁ implementar a interface padrão, caso contrário, a aplicação\
    \ não saberá da existência do serviço de cache.\n\nIsso significa que, se a sua\
    \ aplicação for implementar o cacheamento de dados seguindo esta PSR, então deverá\
    \ ter uma classe que realizará a implementação da interface padrão de cache definida,\
    \ que no caso é a interface `Psr\\Cache\\CacheItemPoolInterface`.\n\n### Regra\
    \ 2\n\n**Implementando na aplicação** - A aplicação é responsável por implementar\
    \ o padrão estabelecido pela PSR com o objetivo de fornecer os serviços de cache\
    \ para qualquer aplicação ou código de forma simples.\n\nA implementação DEVE\
    \ prover classes que implementam as interfaces `Psr\\Cache\\CacheItemPoolInterface`\
    \ e `Psr\\Cache\\CacheItemInterface`. A implementação das bibliotecas DEVE suportar\
    \ ao menos a funcionalidade TTL (*Time To Live*).\n\nIsso significa que em uma\
    \ biblioteca/aplicação ao menos a funcionalidade TTL deve ser suportada. Ela é\
    \ basicamente obrigatória, já que define o tempo de vida de um item de cache.\n\
    \n### Regra 3\n\n**TTL (Time To Live)** - Cada item de cache possui o que chamamos\
    \ de tempo de vida. Esse tempo de vida é a quantidade de tempo entre o momento\
    \ em que esse item é armazenado e quando é considerado obsoleto.\n\nO TTL é definido\
    \ por um número inteiro que representa o tempo em segundos ou por um objeto `DateInterval`.\n\
    \n### Regra 4\n\n**Expiração** - É o tempo definido para que o cache se torne\
    \ obsoleto, geralmente é calculado adicionando o TTL (*Time To Live*) ao tempo\
    \ em que um determinado objeto é armazenado.\n\nO tempo também pode ser adicionado\
    \ através de um objeto `DateTime`. Por exemplo, um item de cache com um TTL de\
    \ 300 segundos que foi armazenado às 09:00:00 terá um tempo de expiração em 09:05:00,\
    \ ou seja, terá um tempo de 5 minutos antes de os dados em cache tornarem-se obsoleto.\n\
    \nA aplicação PODE expirar um item armazenado em cache antes do tempo de expiração\
    \ definido, porém DEVE tratar um determinado item como expirado apenas quando\
    \ o seu tempo de expiração for atingido.\n\nSe a aplicação passar um item para\
    \ ser armazenado e não especificar um tempo de expiração ou TTL, ela PODE utilizar\
    \ um tempo de expiração padrão.\n\nCaso nenhum tempo de duração for definido,\
    \ então a aplicação DEVE interpretar como uma solicitação para armazenar o item\
    \ em cache para sempre ou pelo tempo em que a implementação suportar.\n\n### Regra\
    \ 5\n\n**Chave** - É a chave que define um item de cache. Esse nome deve ser exclusivo\
    \ para cada item de cache. As aplicações DEVEM suportar as chaves que consistem\
    \ nos caracteres de A-Z, a-z, 0-9, undescore (`_`) e ponto (`.`), e em qualquer\
    \ ordem na codificação `UTF-8`, sendo que o nome da chave deve ter um comprimento\
    \ de no máximo 64 caracteres.\n\nA aplicação que implementar PODE suportar outros\
    \ caracteres, outras codificações e/ou um nome de chave com um comprimento maior.\n\
    \nA aplicação também será responsável por escapar a sequência de caracteres conforme\
    \ a necessidade, mas DEVE retornar a sequência original da chave sem nenhum tipo\
    \ de modificação.\n\nOs caracteres `{`, `}`, `(`, `)`, `/`, `\\`, `@` e `:` NÃO\
    \ DEVEM ser suportados pela aplicação, porque são reservados para extensões futuras.\n\
    \n### Regra 6\n\n**Ocorrência** - Uma ocorrência de cache é quando a aplicação\
    \ solicita um item através da chave e um valor correspondente a essa chave é encontrado,\
    \ sendo que esse valor não expirou e não é inválido.\n\nAntes de utilizar a chave\
    \ de um item de cache, a aplicação DEVE verificar se a consulta ao item de cache\
    \ resultou em um `hit` (acerto). Esse procedimento é realizado através da utilização\
    \ do método `isHit()` em todas as chamadas `get()`.\n\n### Regra 7\n\n**Falha/Erro**\
    \ - Ocorre quando a aplicação solicita um item de cache pela chave e o valor correspondente\
    \ não é encontrado, ou o valor é encontrado mas já expirou, ou até mesmo o valor\
    \ é inválido por outros motivos. Sempre que um valor for considerado expirado,\
    \ DEVERÁ ser considerado como um erro de cache.\n\n### Regra 8\n\n**Adiado** -\
    \ Um item de cache adiado indica que ele não pode ser armazenado imediatamente\
    \ pelo pool. Um pool de objetos PODE adiar a persistência de um determinado item\
    \ de cache para que seja possível aproveitar as operações em massa suportadas\
    \ por alguns tipos de mecanismos de persistência.\n\nUm pool DEVE garantir que\
    \ quaisquer itens de cache adiados possam ser eventualmente persistidos e que\
    \ os dados não sejam perdidos. Os pools de objetos PODEM persistir os itens de\
    \ cache antes de a aplicação solicitar a gravação deles.\n\nQuando a aplicação\
    \ chamar o método `commit()`, todos os itens adiados DEVEM ser mantidos, a aplicação\
    \ PODE utilizar a lógica mais adequada e apropriada para determinar quando persistir\
    \ os itens de cache.\n\nAs solicitações de um item de cache que foram adiadas\
    \ DEVEM retornar o item adiado mas que ainda não foi persistido.\n\n### Regra\
    \ 9\n\nA aplicação DEVE suportar todos os tipos de dados PHP que possam ser serializados.\
    \ Isso inclui tipos como:\n\n*   **Strings** - Cadeia de caracteres de qualquer\
    \ tamanho e em qualquer codificação compatível com o PHP.\n\n*   **Integers**\
    \ - Todos os inteiros de qualquer tamanho suportados pelo PHP, até 64 bits.\n\n\
    *   **Floats** - Todos os pontos flutuantes.\n\n*   **Boolean** - `True` (Verdadeiro)\
    \ e `False` (Falso).\n\n*   **Null** - O valor nulo real.\n\n*   **Arrays** -\
    \ Arrays indexados, associativos e multidimensionais de qualquer profundidade.\n\
    \n*   **Object** - Qualquer objeto que tenha suporte a serialização e desserialização\
    \ sem perdas, tal que `$object == unserialize(serialize($object))`.\n\nObjetos\
    \ PODEM aproveitar os métodos mágicos `sleep()` ou `wakeup()` do PHP.\n\n### Regra\
    \ 10\n\nTodos os dados passados para a aplicação DEVEM ser retornados da mesma\
    \ maneira como foram passados. Isso significa que, se a aplicação passar uma variável\
    \ com o valor (string) \"10\", ela DEVERÁ retornar o valor (string) \"10\", e\
    \ não um valor (int) 10.\n\nA aplicação PODE utilizar as funções `serialize()`\
    \ e `unserialize()` do PHP, mas não é obrigatório utilizá-las. A compatibilidade\
    \ é simplesmente usada como uma base para objetos que são aceitos.\n\nSe por algum\
    \ motivo o valor exato não puder ser retornado, a aplicação DEVE retornar um erro\
    \ de cache e não um erro de dados corrompidos/inválidos.\n\n### Regra 11\n\n**Pool**\
    \ - Representa uma coleção de itens em um sistema de cache, ou seja, basicamente\
    \ é um repositório que contém todos os itens de cache, e todos eles podem ser\
    \ recuperados do pool como um objeto. Toda interação com os objetos que estiverem\
    \ armazenados em cache acontecerá através do pool de objetos.\n\n### Regra 12\n\
    \n**Itens** - Um item é representado pelo par chave/valor dentro de uma coleção\
    \ de dados, sendo que a chave é o principal identificador para um item e ela DEVE\
    \ ser imutável, mas o valor pode ser alterado a qualquer momento ou sempre que\
    \ necessário.\n\n### Regra 13"
