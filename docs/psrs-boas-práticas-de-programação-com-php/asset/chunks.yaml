    \ utilizada (`$StudlyCaps`, `$camelCase`, `$snake_case`) desde que respeitadas\
    \ as regras anteriormente descritas.\n\n### Regra 8\n\nO nome dos métodos DEVE\
    \ ser declarado na convenção de nomenclatura `camelCase`. Essa regra também não\
    \ é nada demais, basta atentar-se em escrever o nome dos métodos neste padrão.\
    \ Para facilitar o entendimento, vamos ao exemplo a seguir que demonstra a forma\
    \ correta de definir o nome de um método:\n\n```\n<?php\n\npublic function getNomeUsuario()\n\
    {\n}\n```\n\nRepare que o nome do método foi definido utilizando a convenção de\
    \ nomenclatura `camelCase`. Agora vamos ver as formas consideradas incorretas\
    \ ao declarar o nome de um método:\n\n```\n<?php\n\n//Declaração em snake_case\n\
    public function get_nome_usuario()\n{\n}\n\n//Declaração em StudlyCaps\npublic\
    \ function GetNomeUsuario()\n{\n}\n```\n\n### Conclusão"
