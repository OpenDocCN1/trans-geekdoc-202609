- raw: "Nesse exemplo não existe uma linha em branco adicionada após a definição do\
    \ namespace, sendo considerado incorreto pela PSR-2. Então, sempre deixe uma linha\
    \ em branco antes de prosseguir com o código.\n\n### Regra 12\n\nTodas as declarações\
    \ `use` existentes DEVEM estar após o namespace. Há momentos em que queremos importar\
    \ um código que está contido em outra classe, e para incorporá-lo em nossa classe\
    \ precisamos utilizar a declaração `use`.\n\nPara entendermos melhor, vamos ao\
    \ exemplo considerado correto de acordo com a PSR2:\n\n```\n<?php\n\nnamespace\
    \ App\\Controller\\Usuario;\n\nuse App\\Controller\\AbstractController;\n\nclass\
    \ UsuarioController extends AbstractController\n{\n    //Código\n}\n```\n\nPerceba\
    \ que após a declaração do namespace estou importando o controller `AbstractController`\
    \ para dentro da minha classe. A declaração `use` está abaixo da definição do\
    \ namespace da classe. Agora vamos analisar um exemplo em que a declaração `use`\
    \ estará incorreta:\n\n```\n<?php\n\nuse App\\Controller;\n\nnamespace App\\Controller\\\
    Usuario;\n\nclass UsuarioController extends AbstractController\n{\n    //Código\n\
    }\n```\n\nEsse código não está correto e nem segue o padrão estabelecido pela\
    \ PSR-2, pois toda declaração `use` deve estar após a definição do namespace.\n\
    \n### Regra 13\n\nApenas DEVE existir um `use` por declaração. Cada `use` deve\
    \ possuir uma declaração. Vamos ao exemplo que simplifica a explicação demonstrando\
    \ a maneira correta:\n\n```\n<?php\n\nnamespace App\\Service\\Usuario;\n\nuse\
    \ App\\Service\\AbstractService;\nuse App\\Entity\\Usuario;\n\nclass UsuarioService\
    \ extends AbstractService\n{\n    //Código\n}\n```\n\nComo pode ser notado, para\
    \ cada declaração foi utilizado um `use` em cada linha. Apenas atente-se no momento\
    \ de utilizar o `use`. Agora vamos verificar o exemplo considerado incorreto na\
    \ utilização do `use`:\n\n```\n<?php\n\nnamespace App\\Service\\Usuario;\n\nuse\
    \ App\\Service\\AbstractService, App\\Entity\\Usuario;\n\nclass UsuarioService\
    \ extends AbstractService\n{\n    //Código\n}\n```\n\nTer múltiplas declarações\
    \ em uma única linha `use` não é um erro, então este código até vai funcionar.\
    \ Entretanto seu código já não estará em conformidade com a PSR-2.\n\n### Regra\
    \ 14\n\nAs palavras-chaves `extends` e `implements` DEVEM ser declaradas na mesma\
    \ linha que contém o nome da classe. Sempre que houver a necessidade de estender\
    \ uma classe e/ou implementar uma interface, é necessário que ambas estejam na\
    \ mesma linha que contém o nome da classe, pois também fazem parte da definição\
    \ da classe.\n\nVamos ver o exemplo a seguir que demonstra a maneira correta de\
    \ fazer isso:\n\n```\n<?php\n\nnamespace App\\Service\\Usuario;\n\nuse App\\Service\\\
    ServiceInterface;\nuse App\\Service\\AbstractService;\n\nclass UsuarioService\
    \ extends AbstractService implements ServiceInterface\n{\n    //Código\n}\n```\n\
    \nNada demais até aqui. Como foi dito anteriormente, `extends` e `implements`\
    \ fazem parte da definição de uma classe, então devem estar na mesma linha. Vamos\
    \ analisar agora um exemplo incorreto:\n\n```\n<?php\n\nnamespace App\\Service\\\
    Usuario;\n\nuse App\\Service\\ServiceInterface;\nuse App\\Service\\AbstractService;\n\
    \nclass UsuarioService\nextends AbstractService \nimplements ServiceInterface\n\
    {\n    //Código\n}\n```\n\nEsse código até funcionará, porém não estará em conformidade\
    \ com a regra estabelecida pela PSR-2.\n\n### Regra 15\n\nQuando houver a necessidade\
    \ de múltiplos `implements`, eles PODEM ser divididos em múltiplas linhas, sendo\
    \ que o primeiro item da lista DEVE estar na próxima linha e DEVE possuir somente\
    \ uma interface por linha.\n\nSe você ainda nunca viu ou ouviu falar em uma classe\
    \ implementando múltiplas interfaces, saiba que não é incorreto e, sim, existem\
    \ muitos projetos que, devido à complexidade, acabam implementando esse tipo de\
    \ lógica.\n\nPara melhor entendimento, vamos analisar o exemplo a seguir que demonstra\
    \ a maneira considerada a correta pela PSR-2:\n\n```\n<?php\n\nnamespace App\\\
    Service\\Usuario;\n\nuse App\\Service\\ServiceInterface;\nuse App\\Filter\\FilterInterface;\n\
    use App\\Validator\\ValidatorInterface;\n\nclass UsuarioService implements \n\
    \    ServiceInterface,\n    FilterInterface,\n    ValidatorInterface\n{\n    //Código\n\
    }\n```\n\nO exemplo demonstra com clareza exatamente o que a PSR-2 define, ou\
    \ seja, quando há múltiplas interfaces, cada interface deve estar em uma nova\
    \ linha.\n\nAgora vamos analisar o mesmo código, porém com as interfaces em uma\
    \ única linha, sendo considerada a maneira incorreta:\n\n```\n<?php\n\nnamespace\
    \ App\\Service\\Usuario;\n\nuse App\\Service\\ServiceInterface;\nuse App\\Filter\\\
    FilterInterface;\nuse App\\Validator\\ValidatorInterface;\n\nclass UsuarioService\
    \ implements ServiceInterface, FilterInterface, ValidatorInterface\n{\n    //Código\n\
    }\n```\n\nApesar de o código não estar em conformidade com a PSR-2 ele funcionará\
    \ normalmente.\n\n### Regra 16\n\nA visibilidade ou modificadores de acesso DEVEM\
    \ ser definidos em todas as propriedades. Toda propriedade que for definida deve\
    \ possuir o modificador de acesso definido antes do seu nome. Isso não é novidade,\
    \ mas para quem não é acostumado a definir a visibilidade de uma propriedade,\
    \ basta atentar-se sempre antes de criá-la.\n\nVamos analisar um exemplo em que\
    \ as propriedades são definidas com os modificadores de acesso e que é a maneira\
    \ considerada correta:\n\n```\n<?php\n\nnamespace App\\Entity\\Usuario;\n\nclass\
    \ Usuario\n{\n    private $nome;\n    private $idade;\n    public $etnia;\n  \
    \  protected $dataDeNascimento;\n}\n```\n\nPerceba que todas as propriedades que\
    \ foram definidas possuem antes de seu nome o modificador de acesso, seja ele\
    \ `private`, `protected` ou `public`. Agora vamos analisar o mesmo exemplo, porém\
    \ sem os modificadores de acesso:\n\n```\n<?php\n\nnamespace App\\Entity\\Usuario;\n\
    \nclass Usuario\n{\n    $nome;\n    $idade;\n    $etnia;\n    $dataDeNascimento;\n\
    }\n```\n\nAnalisando o código do exemplo anterior, fica difícil de saber qual\
    \ propriedade é privada, pública ou protegida.\n\nNa verdade, quando o modificador\
    \ de acesso não é definido na propriedade, um erro chamado **PHP Parse error**\
    \ será lançado, pois dentro de uma classe obrigatoriamente as suas propriedades\
    \ devem possuir o modificador de acesso.\n\n### Regra 17\n\nA palavra-chave `var`\
    \ NÃO DEVE ser utilizada para a definição de propriedades da classe. No momento\
    \ de definir a propriedade da classe, não utilize `var`, ok?\n\n### Regra 18\n\
    \nNÃO DEVE haver mais de uma propriedade por declaração. Se houver a necessidade\
    \ de declarar mais de uma propriedade, então defina-as de forma separada, conforme\
    \ mostrado no exemplo a seguir:\n\n```\n<?php\n\nnamespace App\\Entity\\Usuario;\n\
    \nclass Usuario\n{\n    private $nome;\n    private $idade;\n    public $etnia;\n\
    \    protected $dataDeNascimento;\n}\n```\n\nEsse é o mesmo exemplo citado anteriormente.\
    \ Como pode ser visto, cada declaração de propriedade está definida de forma separada.\
    \ Agora veremos a maneira incorreta de se declarar as propriedades da classe:\n\
    \n```\n<?php\n\nnamespace App\\Entity\\Usuario;\n\nclass Usuario\n{\n    private\
    \ $nome, $idade, $etnia, $dataDeNascimento\n}\n```\n\nSe você testar, o código\
    \ funcionará perfeitamente. Mas lembre-se: o código não estará em conformidade\
    \ com a PSR-2.\n\n### Regra 19\n\nO nome das propriedades NÃO DEVE iniciar com\
    \ `_` (*underscore*) para indicar a visibilidade `private` ou `protected`. Certamente\
    \ você já deve ter visto em algum lugar que há programadores que definem as propriedades\
    \ privadas ou protegidas da classe com um `_` como prefixo.\n\nIsso não é necessário,\
    \ uma vez que o PHP fornece os modificadores de acesso - basta você utilizá-los.\
    \ Vamos analisar a maneira correta ao definir as propriedades privadas ou protegidas\
    \ de uma classe:\n\n```\n<?php\n\nnamespace App\\Entity\\Usuario;\n\nclass Usuario\n\
    {\n    private $nome;\n    protected $idade;\n}\n```\n\nPerceba que não há segredo\
    \ algum, o nome das propriedades está limpo e claro como deve ser. Agora vamos\
    \ analisar um exemplo considerado incorreto:\n\n```\n<?php\n\nnamespace App\\\
    Entity\\Usuario;\n\nclass Usuario\n{\n    private $_nome;\n    protected $_idade;\n\
    }\n```\n\nNesse exemplo, o modificador de acesso já informa o tipo de visibilidade\
    \ da propriedade tornando completamente inútil o uso do `_` (underscore).\n\n\
    ### Regra 20"
