- raw: "Todos os métodos DEVEM ter a visibilidade definida. Lembre-se de que a visibilidade\
    \ torna o encapsulamento mais claro. Para facilitar, vamos ao exemplo a seguir:\n\
    \n```\n<?php\n\nnamespace App\\Entity\\Usuario;\n\nclass Usuario\n{\n    private\
    \ $nome;\n\n    public function getNome()\n    {\n        return $this->nome;\n\
    \    }\n\n    public function setNome($nome)\n    {\n        $this->nome = $nome;\n\
    \    }\n}\n```\n\nPerceba que os métodos `getNome()` e `setNome($nome)` possuem\
    \ o modificador de acesso `public` definido, indicando que eles possuem visibilidade\
    \ pública.\n\nO tipo de visibilidade vai depender do que será necessário expor\
    \ ou não para o resto da aplicação.\n\nAgora vamos analisar o exemplo considerado\
    \ incorreto e que não está em conformidade com a PSR-2:\n\n```\n<?php\n\nnamespace\
    \ App\\Entity\\Usuario;\n\nclass Usuario\n{\n    private $nome;\n\n    function\
    \ getNome()\n    {\n        return $this->nome;\n    }\n\n    function setNome($nome)\n\
    \    {\n        $this->nome = $nome;\n    }\n}\n```\n\nÉ importante ressaltar\
    \ que o código do exemplo funciona, mas não é válido para a regra da PSR-2.\n\n\
    ### Regra 21\n\n*Underscore* (`_`) NÃO DEVE ser utilizado para indicar a visibilidade\
    \ `private` ou `protected` do método. Essa regra é semelhante à que se aplica\
    \ na definição das propriedades da classe. Então, nada de usar *underscore* para\
    \ indicar a visibilidade do método.\n\nPara exemplificar, vamos ao exemplo a seguir\
    \ que demonstra a maneira correta de definir um método:\n\n```\n<?php\n\nnamespace\
    \ App\\Entity\\Usuario;\n\nclass Usuario\n{\n    private $nome;\n\n    private\
    \ function getNome()\n    {\n        return $this->nome;\n    }\n\n    protected\
    \ function setNome($nome)\n    {\n        $this->nome = $nome;\n    }\n}\n```\n\
    \nProvavelmente você deve estar se perguntando: \"Qual o sentido de ter os métodos\
    \ `setNome($nome)` e `getNome()` protegido e privado?\". Na verdade não tem sentido\
    \ mesmo, é apenas para mostrar que os modificadores de acesso `private` e `protected`\
    \ existem, podem e devem ser utilizados na definição do método.\n\nAgora veremos\
    \ um exemplo considerado incorreto:\n\n```\n<?php\n\nnamespace App\\Entity\\Usuario;\n\
    \nclass Usuario\n{\n    private $nome;\n\n    function _getNome()\n    {\n   \
    \     return $this->nome;\n    }\n\n    function _setNome($nome)\n    {\n    \
    \    $this->nome = $nome;\n    }\n}\n```\n\nO exemplo funciona, mas não é correto,\
    \ pois os modificadores de acesso existem para serem utilizados. Então use e abuse\
    \ deles e evite utilizar `_` (*underscore*) como modificador de acesso pois seu\
    \ código não ficará em conformidade com a PSR-2, ok?\n\n### Regra 22\n\nApós o\
    \ nome do método NÃO DEVE existir um espaço em branco. A chave de abertura do\
    \ método DEVE estar em uma nova linha e a chave de fechamento DEVE ficar logo\
    \ após o corpo do método.\n\nApós o parêntese de abertura NÃO DEVE existir um\
    \ espaço em branco e antes do parêntese de fechamento também NÃO DEVE haver um\
    \ espaço em branco.\n\nPode parecer estranho, mas isso é considerado mais uma\
    \ questão de adaptação e costume. Constantemente vejo códigos que não seguem essa\
    \ regra da PSR. Para facilitar o entendimento, vamos ao exemplo considerado correto:\n\
    \n```\n<?php\n\nnamespace App\\Controller;\n\nclass HomeController\n{\n    public\
    \ function indexAction()\n    {\n        //Código\n    }\n}\n```\n\nNo exemplo\
    \ citado, veja que o método `indexAction()` segue perfeitamente essa regra da\
    \ PSR-2: não há espaços após o nome do método, a chave de abertura está em uma\
    \ nova linha e a chave de fechamento está logo após o conteúdo do método.\n\n\
    Vamos analisar agora um exemplo em que a definição do método não segue o padrão\
    \ estipulado:\n\n```\n<?php\n\nnamespace App\\Controller;\n\nclass HomeController\n\
    {\n    public function indexAction ( $request ) {\n        //Código\n    }\n}\n\
    ```\n\nApesar de o código funcionar sem problemas, ele não é compatível com a\
    \ regra da PSR-2.\n\n### Conclusão\n\nComo você pôde ver são inúmeras regras que\
    \ a PSR-2 disponibiliza, e ainda tem mais! No próximo capítulo continuaremos vendo\
    \ quais são as demais regras da PSR-2. Então siga em frente!\n\nCapítulo 4 \n\n\
    # PSR-2 (Coding Style Guide) - Parte II\n\nVimos no capítulo anterior um total\
    \ de 22 regras da PSR-2, neste capítulo vamos continuar vendo essas regras que\
    \ visam facilitar o estilo do nosso código-fonte para obtermos uma melhor leitura\
    \ e compreensão através dos padrões estabelecidos pela PSR-2.\n\n## 4.1 Regras\n\
    \nA seguir vamos continuar com as regras de onde paramos no capítulo anterior.\n\
    \n### Regra 23\n\nQuando o método possuir uma lista de parâmetros, NÃO DEVE haver\
    \ espaço antes de cada vírgula, mas DEVE ter espaço após cada vírgula. Bem simples,\
    \ não é mesmo? Sempre que você for definir uma lista de parâmetros no método,\
    \ você deve separá-los por vírgula (`,`) e em seguida, um espaço, seguindo basicamente\
    \ o padrão já usado em nosso próprio idioma.\n\nVamos ao exemplo considerando\
    \ a maneira correta de definir os parâmetros do método:\n\n```\n<?php\n\nnamespace\
    \ App\\Controller;\n\nclass HomeController\n{\n    public function indexAction($request,\
    \ $response)\n    {\n        //Código\n    }\n}\n```\n\nO exemplo mostra exatamente\
    \ como a regra explica, cada parâmetro ou argumento é separado por vírgula seguida\
    \ de um espaço (`,`). Agora vamos ver um exemplo considerado como a maneira incorreta\
    \ na definição dos parâmetros de um método:\n\n```\n<?php\n\nnamespace App\\Controller;\n\
    \nclass HomeController\n{\n    public function indexAction($request ,$response)\n\
    \    {\n        //Código\n    }\n}\n```\n\nPerceba que dessa vez os parâmetros\
    \ são separados apenas pela vírgula, porém o espaço que deveria estar após a vírgula\
    \ está definido antes dela. Sendo assim, o código não está em conformidade com\
    \ a PSR-2.\n\n### Regra 24\n\nCaso o método possua muitos parâmetros a serem definidos,\
    \ a lista PODE ser dividida em múltiplas linhas contendo uma indentação, sendo\
    \ que o primeiro parâmetro da lista DEVE estar na próxima linha.\n\nDEVE haver\
    \ apenas um parâmetro por linha e o parêntese de fechamento da lista e a chave\
    \ de abertura do método DEVEM estar na mesma linha, contendo apenas um espaço\
    \ entre eles. A definição dessa regra pode ser grande, mas não é difícil. Na verdade,\
    \ na primeira vez em que comecei a usar a PSR-2 eu estranhei bastante a forma\
    \ como ficava o código, mas com o tempo acabei me acostumando.\n\nA explicação\
    \ desta regra fica mais fácil ao visualizar um exemplo que atenda à especificação:\n\
    \n```\n<?php\n\nnamespace App\\Sercice\\Paginacao;\n\nclass PaginacaoService\n\
    {\n    public function paginate(\n        $limite,\n        $pagina,\n       \
    \ $dados\n    ) {\n        //Código\n    }\n}\n```\n\nPerceba como a lista de\
    \ parâmetros foi dividida, e ficou fácil de ler e identificar os parâmetros. Agora\
    \ vamos analisar o mesmo exemplo em que a divisão em múltiplas linhas não é correta\
    \ e deve ser evitada:\n\n```\n<?php\n\nnamespace App\\Sercice\\Paginacao;\n\n\
    class PaginacaoService\n{\n    public function paginate(\n        $limite, $pagina,\n\
    \        $dados\n    ) {\n        //Código\n    }\n}\n```\n\nO código do exemplo\
    \ funciona perfeitamente, porém não está em conformidade com a regra de se ter\
    \ cada parâmetro em uma nova linha, então evite esse tipo de estilo.\n\n### Regra\
    \ 25\n\nAs palavras-chaves `abstract` e `final` DEVEM ser declaradas antes de\
    \ definir a visibilidade de classes e métodos. Há casos em que precisamos criar\
    \ uma classe abstrata ou final, por exemplo, ou até mesmo métodos, e existe uma\
    \ maneira correta de se fazer isso.\n\nPara simplificar o entendimento, vamos\
    \ analisar o exemplo a seguir que demonstra a maneira correta de seguir essa regra:\n\
    \n```\n<?php\n\nnamespace App\\Sercice;\n\nabstract class AbstractService\n{\n\
    \    protected static $dados;\n\n    abstract protected function insert();\n\n\
    \    final public static function start()\n    {\n        //Código\n    }\n}\n\
    ```\n\nPerceba que as palavras-chaves `abstract` e `final` precedem a visibilidade\
    \ dos dois métodos `insert()` e `start()`. Na classe, não existe a visibilidade\
    \ para ser definida, mas podemos informar se é uma classe abstrata ou final.\n\
    \nÉ um exemplo simples, mas que demonstra a utilização dessas palavras-chaves.\
    \ Agora veremos um exemplo que demonstra a maneira incorreta de utilizá-las:"
