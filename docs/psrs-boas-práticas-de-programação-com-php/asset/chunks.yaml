    \ do `namespace` do arquivo;\n- Uma ou mais instruções de importação `use` baseadas\
    \ em classes;\n- Uma ou mais instruções de importação `use` baseadas em funções;\n\
    - Uma ou mais instruções de importação `use` baseadas em constantes;\n- O restante\
    \ do código.\n\nQuando um arquivo contém HTML e PHP, qualquer uma das seções descritas\
    \ anteriormente ainda poderá ser utilizada. Nesse caso, eles DEVEM estar presentes\
    \ no topo do arquivo, mesmo que o restante do código consista de uma tag de fechamento\
    \ `?>` do PHP e, em seguida, uma mistura de HTML e PHP.\n\nAs instruções de importação\
    \ nunca DEVEM começar com uma barra invertida.\n\nVamos conferir um exemplo a\
    \ seguir que ilustra a aplicação da sequência definida pela `PSR-12` citada anteriormente:\n\
    \n```php\n<?php\n\n/**\n * Descrição do arquivo\n */\n\n declare(strict_types=1);\n\
    \n namespace App\\Controller\\Usuario;\n\n use App\\Controller\\{AbstractController\
    \ as Abc, ControllerInterface, BaseController as Base};\n use App\\Entity\\Usuario\n\
    \n use function App\\Functions\\{functionA, functionN, functionC};\n use function\
    \ App\\Repository\\Functions\\insert;\n\n use const App\\Controller\\{RESPONSE_JSON,\
    \ RESPONSE_XML, RESPONSE_ERROR};\n use const App\\Service\\{CONSTANT_A};\n\n/**\n\
    \ *  Classe de exemplo\n */\n class UsuarioController\n {\n     //Código...\n\
    \ }\n```\n\nUau, perceba como tivemos mudanças, se compararmos com `PSR-2`. Uma\
    \ delas é a importação de múltiplas classes dentro de mesma instrução `use` através\
    \ da utilização das chaves `{}`. Se você recordar, na `PSR-2` era permitido apenas\
    \ uma importação por instrução. Outras evoluções foram com relação à importação\
    \ de funções e constantes da mesma maneira que importamos ou mais classes. Sem\
    \ dúvidas, foi uma bela evolução e com certeza nos ajudará muito a manter o código\
    \ com padrão definido.\n\n### Regra 12\n\nOs `namespaces` compostos com profundidade\
    \ superior a dois NÃO DEVEM ser utilizados. O exemplo a seguir demonstra a utilização\
    \ máxima de composição permitida:\n\n```php\nuse App\\Service\\{UsuarioService,\
    \ ContatoService, ServiceAbstract};\n```\n\nO exemplo a seguir não é permitido\
    \ pela `PSR-12`:\n\n```php\nuse App\\Service\\{Admin\\UsuarioService, ContatoService,\
    \ ServiceAbstract};\n``` \n\nNesse exemplo, a adição de mais um `namespace` no\
    \ caso `Admin` não é permitido, pois ultrapassa o nível máximo de profundidade,\
    \ que é até dois.\n\n### Regra 13\n\nSe desejar declarar tipos estritos em arquivos\
    \ contendo marcação HTML fora das tags de abertura `<?php` e fechamento `?>` do\
    \ PHP, a declaração DEVE estar na primeira linha do arquivo e incluir a abertura\
    \ `<?php` do PHP, a declaração de tipos estritos e em seguida o fechamento `?>`\
    \ do PHP.\n\nVamos conferir o exemplo a seguir que demonstra a aplicação correta:\n\
    \n```php\n<?php declare(strict_types=1); ?>\n```\n\n### Regra 14\n\nAs declarações\
    \ de tipo de dados devem estar em uma única linha. Se houver múltiplas declarações,\
    \ elas devem ser separadas por uma vírgula.\n\n### Regra 15\n\nAs variáveis, constantes,\
    \ funções e propriedades DEVEM ser declaradas uma por linha.\n\n```php\n$a = 1;\n\
    const CONSTANTE = 2;\nfunction minhaFuncao() {}\n```\n\n### Regra 16\n\nAs declarações\
    \ de métodos e propriedades devem ter uma única linha. O modificador de visibilidade\
    \ deve estar presente.\n\n```php\npublic $propriedade;\npublic function metodo()\
    \ {}\n```\n\n### Regra 17\n\nOs nomes de métodos e propriedades DEVEM seguir o\
    \ padrão `camelCase`. Os nomes de classes DEVEM seguir o padrão `PascalCase`.\n\
    \n### Regra 18\n\nOs nomes de constantes DEVEM seguir o padrão `UPPER_SNAKE_CASE`.\n\
    \n### Regra 19\n\nOs nomes de variáveis DEVEM seguir o padrão `camelCase`.\n\n"
