    \  //Código\n};\n```\n\nPerceba que o espaçamento e a indentação seguem princípios\
    \ que já vimos anteriormente nessa PSR.\n\n### Conclusão\n\nChegamos ao final\
    \ da PSR-12, como pôde ser visto nessa PSR, há várias regras e condições que devem\
    \ ser seguidas para que seu código esteja em conformidade. Aplicamos regras de\
