    ### Regra 13\n\nUma exceção ou erro lançado por um `Listener` DEVE bloquear a\
    \ execução de outros `Listeners` e DEVE ter permissão para se propagar de volta\
    \ para o emissor.\n\n### Regra 14\n\nUm `Dispatcher` PODE pegar um objeto para\
    \ registrá-lo, permitir que medidas adicionais sejam tomadas etc., mas, em seguida,\
    \ DEVE recriar o item original.\n\n```\n\n```\n\n### Regra 15\n\nUm `Listener\
    \ Provider` é um objeto de serviço responsável por determinar quais `Listeners`\
    \ são relevantes e devem ser chamados para um determinado evento. Pode determinar\
    \ tanto que os `Listeners` são relevantes quanto a ordem pela qual retorná-los.\n\
    \nIsso PODE incluir:\n\n*   Permitir alguma forma de mecanismo de registro para\
    \ que as aplicações possam atribuir um `Listener` a um evento em uma ordem fixa.\n\
    *   Derivar uma lista de `Listeners` aplicáveis por meio da reflexão com base\
    \ no tipo e nas interfaces implementadas do evento.\n*   Gerar uma lista compilada\
    \ de `Listeners` anteadamente que podem ser consultados em tempo de execução.\n\
    *   Implementar alguma forma de controle de acesso para que determinados `Listeners`\
    \ sejam chamados apenas se o usuário atual tiver uma determinada permissão.\n\
    *   Extrair algumas informações de um objeto referenciado pelo evento, como uma\
    \ entidade, e chamando métodos de ciclo de vida predefinidos nesse objeto.\n*\
    \   Delegar sua responsabilidade a um ou mais `Listener Proveiders` usando alguma\
    \ lógica arbitrária.\n\nQualquer combinação dos itens citados anteriormente PODE\
    \ ser usada como desejado.\n\n### Regra 16\n\n`Listener Providers` DEVEM usar\
    \ o nome da classe de um evento para diferenciar um evento do outro. Eles também\
    \ PODEM considerar qualquer outra informação sobre o evento, conforme seja mais\
    \ apropriado.\n\n### Regra 17\n\nOs `Listener Providers` DEVEM tratar os tipos\
    \ de pai de forma idêntica ao tipo do próprio evento ao determinar a aplicabilidade\
    \ do `Listener`. No seguinte caso:\n\n```\n<?php\nclass A {}\n\nclass B extends\
    \ A {}\n\n$b = new B();\n\nfunction listener(A $event): void {};\n```\n\nUm `Listener\
    \ Provider` DEVE tratar o método `listener()` como um `Listener` aplicável por\
    \ `$b`, pois é compatível com o tipo, a menos que outros critérios o impeçam de\
    \ faz-lo.\n\n### Regra 18\n\nUm `Dispatcher` DEVE compor um `Listener Provider`\
    \ para determinar os `Listeners` relevantes. É RECOMENDADO que um `Listener Provider`\
    \ seja implementado como um objeto distinto do `Dispatcher`, mas NÃO É NECESSÁRIO.\n\
    \n## 13.2 Interfaces\n\nA seguir vamos conhecer as interfaces que fazem parte\
    \ desse pacote.\n\n### `Psr\\EventDispatcher\\EventDispatcherInterface`\n\nEsta\
    \ interface define um `Dispatcher` para eventos.\n\n```php\n<?php\nnamespace Psr\\\
    EventDispatcher;\n\ninterface EventDispatcherInterface\n{    \n    public function\
    \ dispatch(object $event);\n}\n```\n\n### `Psr\\EventDispatcher\\ListenerProviderInterface`\n\
    \nEsta interface é um mapeador de um evento para os `Listeners` que são aplicáveis\
    \ a esse evento.\n\n```php\n<?php\nnamespace Psr\\EventDispatcher;\n\ninterface\
    \ ListenerProviderInterface\n{\n    public function getListenersForEvent(object\
    \ $event) : iterable;\n}\n```\n\n### `Psr\\EventDispatcher\\StoppableEventInterface`\n\
    \nEsta interface verifica um evento cujo processamento pode ser interrompido quando\
    \ o evento foi tratado.\n\n```php\n<?php\nnamespace Psr\\EventDispatcher;\n\n\
    interface StoppableEventInterface\n{\n    public function isPropagationStopped()\
    \ : bool;\n}\n```\n\n### Conclusão\n\nNo próximo capítulo vamos abordar sobre\
    \ a PSR-15, que trata conceitos conhecidos como os `middlewares`/`handlers`. Então\
    \ vamos nessa!\n\nCapítulo 14\n\n# PSR-15 (HTTP Server Request Handlers)\n\nCom\
    \ o principal objetivo de fornecer interfaces comuns para a manipulação das requisições\
    \ HTTP, os `handlers` (manipuladores) são essenciais em qualquer aplicação Web.\
    \ O código do lado do servidor recebe uma requisição que é processada e então\
    \ é gerada uma resposta que pode ser repassada para outra aplicação ou não.\n\n\
    Os `middlewares` em APIs podem ser considerados como estruturas que trabalham\
    \ sob o protocolo HTTP, por meio do qual recebem uma requisição e geram uma resposta\
    \ como saída. Essa resposta pode ou não ser repassada para outros middlewares.\n\
    \nPor exemplo, para realizar a autenticação de um usuário, teríamos algo como\
    \ um middleware de autenticação que recebe as credenciais. Se os dados estiverem\
    \ corretos, ele poderá passar para o próximo middleware, indicando que a autenticação\
    \ foi bem-sucedida e ele está pronto para receber autorização para acessar os\
    \ recursos. Para entendermos melhor o funcionamento dos middlewares, veja o exemplo\
    \ a seguir, que demonstra o seu funcionamento dentro de uma API:\n\n![Funcionamento\
    \ dos middlewares](middlewares.png)\n\nFigura 14.1: Funcionamento dos middlewares\n\
    \nConforme mostrado na imagem anterior nós temos duas camadas de middlewares.\
    \ O `AuthenticationMiddleware` recebe a requisição e realiza a verificação concedendo\
    \ ou não o acesso ao usuário. Em caso afirmativo, os dados da requisição são passados\
    \ para o próximo middleware, o `AuthorizationMiddlware`, que é responsável por\
    \ verificar se o usuário possui autor para acessar um recurso do sistema. Se sim,\
    \ então os dados são enviados para a camada da aplicação para continuar o processamento.\
    \ Podemos ter quantos middlewares forem necessários, tudo vai depender da sua\
    \ aplicação.\n\n## 14.1 Regras\n\nVamos conhecer a seguir as regras que definem\
    \ essa PSR para entendermos como aplicá-la de forma coesa.\n\n### Regra 1\n\n\
    **Request Handlers (Manipuladores de Requisição/Solicitação)** - É um componente\
    \ individual que realiza o processamento de uma solicitação e consequentemente\
    \ gera uma resposta, conforme definido pela PSR-7. Um `request handler` (manipulador\
    \ de requisição) PODE lançar uma exceção caso as condições da requisição sejam\
    \ impedidas de produzirem uma resposta, porém, o tipo de exceção não está definido.\n\
    \nOs `requests handlers` que utilizam esse padrão DEVEM implementar a interface\
    \ `Psr\\Http\\Server\\RequestHandlerInterface`.\n\n### Regra 2\n\n**Middleware**\
    \ - É um componente individual que trabalha junto com outros middlewares durante\
    \ o processamento de uma requisição e gera uma resposta como saída, conforme definido\
    \ pela PSR-7.\n\nUm middleware PODE criar e retornar uma resposta sem que haja\
    \ a delegação para um `request handler` (manipulador de requisição) desde que\
    \ as condições necessárias sejam atendidas.\n\nPara utilizar este padrão, os middlewares\
    \ DEVEM implementar a interface `Psr\\Http\\Server\\MiddlewareInterface`.\n\n\
    ### Regra 3\n"
  trans: "\n\n`Dispatcher` 是一个实现了 `EventDispatcherInterface` 接口的服务对象。它负责从 `Listener\
    \ Provider` 获取用于分发事件的 `Listeners`，并带事件调用每个 `Listener`。\n\n一个 `Dispatcher`：\n\n\
    *   必须按照它们从 `Listener Provider` 返回的顺序同步调用 `Listeners`。\n*   必须在调用 `Listeners`\
    \ 之后返回最初传入的同一个 `Event` 对象。\n*   在所有 `Listeners` 执行完毕之前，不能将结果返回给发送者（`Emitter`）。\n\
    \n### 规则 11\n\n如果传递了一个 `Stoppable` 类型的事件，`Dispatcher` 必须在调用每个 `Listener` 之前调用事件的\
    \ `isPropagationStopped()` 方法。如果该方法返回 `true`，它必须立即将事件返回给 `Emitter`（发送者），并且**不能**再调用任何其他\
    \ `Listener`。\n\n如果传递给 `Dispatcher` 的事件通过 `isPropagationStopped()` 方法始终返回 `true`，则将没有任何\
    \ `Listeners` 被调用。\n\n### 规则 12\n\n`Dispatcher` 必须假设从 `ListenerProvider` 返回的任何\
    \ `Listener` 都是类型安全的，也就是说，`Dispatcher` 必须假设调用 `$listener($event)` 不产生 `TypeError`。\n\
    \n### 规则 13\n\n`Listener` 抛出的异常或错误必须阻止其他 `Listeners` 的执行，并允许其回传给发送者。\n\n### 规则\
    \ 14\n\n`Dispatcher` 可以获取一个对象以进行注册、允许采取额外措施等，但随后它必须重建原始项。\n\n```\n\n```\n\n###\
    \ 规则 15\n\n`Listener Provider` 是一个服务对象，负责确定哪些 `Listeners` 对于特定事件是相关的并且应该被调用。它可以既确定哪些\
    \ `Listeners` 是相关的，也可以决定它们返回的顺序。\n\n这**可能**包括：\n\n*   允许某种形式的注册机制，以便应用程序按照固定顺序将\
    \ `Listener` 分配给事件。\n*   通过反射根据事件的类型和实现的接口推导出适用的 `Listeners` 列表。\n*   预先生成编译好的\
    \ `Listeners` 列表，以便在运行时查询。\n*   实现某种形式的访问控制，以便在当前用户具有特定权限时才调用特定的 `Listeners`。\n\
    *   从事件引用的对象（如实体）中提取某些信息，并在该对象上调用预定义的生命周期方法。\n*   使用任意逻辑将其责任委托给一个或多个 `Listener\
    \ Proveiders`。\n\n上述项的任何组合**都可以**根据需要使用。\n\n### 规则 16\n\n`Listener Providers`\
    \ 必须使用事件的类名来区分不同的事件。它们也**可以**根据需要考虑有关事件的任何其他信息。\n\n### 规则 17\n\n`Listener Providers`\
    \ 在确定 `Listener` 的适用性时，必须以与事件本身类型相同的方式处理父类型。在以下情况下：\n\n```\n<?php\nclass A {}\n\
    \nclass B extends A {}\n\n$b = new B();\n\nfunction listener(A $event): void {};\n\
    ```\n\n`Listener Provider` 必须将 `listener()` 方法视为适用于 `$b` 的 `Listener`，因为它是与类型兼容的，除非有其他标准阻止其这样做。\n\
    \n### 规则 18\n\n`Dispatcher` 必须组合一个 `Listener Provider` 来确定相关的 `Listeners`。**建议**将\
    \ `Listener Provider` 实现为与 `Dispatcher` 不同的对象，但**不是必须**的。\n\n## 13.2 接口\n\n接下来我们将了解该包中包含的接口。\n\
    \n### `Psr\\EventDispatcher\\EventDispatcherInterface`\n\n该接口定义了一个事件的 `Dispatcher`。\n\
    \n```php\n<?php\nnamespace Psr\\EventDispatcher;\n\ninterface EventDispatcherInterface\n\
    {    \n    public function dispatch(object $event);\n}\n```\n\n### `Psr\\EventDispatcher\\\
    ListenerProviderInterface`\n\n该接口是事件到适用于该事件的 `Listeners` 的映射。\n\n```php\n<?php\n\
    namespace Psr\\EventDispatcher;\n\ninterface ListenerProviderInterface\n{\n  \
    \  public function getListenersForEvent(object $event) : iterable;\n}\n```\n\n\
    ### `Psr\\EventDispatcher\\StoppableEventInterface`\n\n该接口检查一个在处理处理后可以中断处理的事件。\n\
    \n```php\n<?php\nnamespace Psr\\EventDispatcher;\n\ninterface StoppableEventInterface\n\
    {\n    public function isPropagationStopped() : bool;\n}\n```\n\n### 结论\n\n在下一章节中我们将讨论\
    \ PSR-15，它涉及被称为 `middlewares`（中间件）/`handlers`（处理器）的概念。让我们开始吧！\n\n第 14 章\n\n# PSR-15\
    \ (HTTP 服务器请求处理器)\n\n为了给处理 HTTP 请求提供通用接口，`handlers`（处理器）在任何 Web 应用程序中都是本质的。服务器端代码接收请求并对其进行处理，然后生成一个响应，该响应可以传递给另一个应用程序或直接返回。\n\
    \nAPI 中的 `middlewares`（中间件）可以被视为在 HTTP 协议下工作的结构，通过该协议它们接收请求并生成响应作为输出。该响应可以或传递给其他中间件。\n\
    \n例如，为了进行用户身份验证，我们需要一个接收凭据的身份验证中间件。如果数据正确，它可以传递给下一个中间件，表示身份验证成功且它已准备好接收访问资源的授权。为了为了地理解中间件的工作原理，请看下面的示例，它展示了它们在\
    \ API 中的工作方式：\n\n![中间件的工作原理](img/middlewares.png)\n\n图 14.1：中间件的工作原理\n\n如上图所示，我们有两层中间件。`AuthenticationMiddleware`\
    \ 接收请求并执行验证，授予或拒绝用户访问权限。如果是，请求数据将传递给下一个中间件 `AuthorizationMiddlware`，它负责检查用户是否有权限访问系统资源。如果是，则数据将发送到应用层以继续处理。我们可以根据需要拥有多个中间件，完全取决于您的应用程序。\n\
    \n## 14.1 规则\n\n接下来我们将了解定义此 PSR 的规则，以便理解如何连贯地应用它。\n\n### 规则 1\n\n**Request Handlers\
    \ (请求处理器)** - 这是一个执行请求处理并相应生成响应的独立组件，其定义遵循 PSR-7。当 `request handler`（请求处理器）由于请求条件无法产生响应时，**可以**抛出异常，但异常的类型没有定义。\n\
    \n使用此模式的 `requests handlers` 必须实现 `Psr\\Http\\Server\\RequestHandlerInterface`\
    \ 接口。\n\n### 规则 2\n\n**Middleware (中间件)** - 这是一个在请求处理期间与其他中间件共同工作的独立组件，并根据 PSR-7\
    \ 的定义生成响应作为输出。\n\n在满足必要条件的情况下，中间件可以在可以在不委托给 `request handler`（请求处理器）的情况下创建并返回响应。\n\
    \n要使用此模式，中间件必须实现 `Psr\\Http\\Server\\MiddlewareInterface` 接口。\n\n### 规则 3\n\n"
