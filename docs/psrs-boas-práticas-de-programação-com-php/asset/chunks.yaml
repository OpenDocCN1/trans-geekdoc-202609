    \ e `$arquivos[1]`, teremos a seguinte saída dada pelo PHP.\n\n```\narray(\n \
    \   'arquivos' => array(\n        'name' => array(\n            0 => 'file0.txt',\n\
    \            1 => 'file1.html',\n        ),\n        'type' => array(\n      \
    \      0 => 'text/plain',\n            1 => 'text/html',\n        ),\n       \
    \ /* etc. */\n    ),\n)\n```\n\nQuando, na verdade, o esperado seria algo como:\n\
    \n```\narray(\n    'arquivos' => array(\n        0 => array(\n            'name'\
    \ => 'file0.txt',\n            'type' => 'text/plain',\n            //...\n  \
    \      ),\n        1 => array(\n            'name' => 'file1.html',\n        \
    \    'type' => 'text/html',\n            //...\n        ),\n    ),\n)\n```\n\n\
