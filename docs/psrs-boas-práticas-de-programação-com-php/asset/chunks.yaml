- raw: "**Todos os dados passados para a aplicação DEVEM ser retornados da mesma maneira\
    \ como foram passados**. Isso significa que, se a aplicação passar uma variável\
    \ com o valor (string) \"10\", ela DEVERÁ retornar o valor (string) \"10\", e\
    \ não um valor (int) 10.\n\nA aplicação PODE utilizar as funções `serialize()`\
    \ e `unserialize()` do PHP, mas não é obrigatório utilizá-las. A compatibilidade\
    \ é simplesmente usada como uma base para objetos que são aceitos. Se por algum\
    \ motivo o valor exato não puder ser retornado, a aplicação DEVE retornar um erro\
    \ de cache e não um erro de dados corrompidos/inválidos.\n\nConhecemos as regras\
    \ que a PSR-16 define e como você pôde perceber são bem semelhantes com as regras\
    \ da PSR-6. A diferença é que a PSR-16 é um modelo mais simples e enxuto da PSR-6,\
    \ isso não impede que você utilize as duas PSRs em conjunto.\n\n## 15.2 Interfaces\n\
    \nA seguir vamos conhecer as interfaces que fazem parte dessa PSR.\n\n### `Psr\\\
    SimpleCache\\CacheInterface`\n\nEsta interface define as operações básicas para\
    \ uma coleção de cache, que requer leitura, gravação e exclusão de itens de cache\
    \ individuais, além disso, possui métodos que lidam com várias entradas de cache,\
    \ como escrever, ler ou excluir várias entradas de cache por vez. Isso é muito\
    \ útil quando temos muitas leituras/gravações em cache para executar e permite\
    \ executar essas operações através de uma única chamada para o servidor de cache,\
    \ reduzindo drasticamente a latência.\n\nUma única instância de `Psr\\SimpleCache\\\
    CacheInterface` é correspondente a uma única coleção de itens de cache com um\
    \ único namespace de chave e é equivalente a um `pool` da PSR-6. É permitido diferentes\
    \ instâncias de `Psr\\SimpleCache\\CacheInterface` e essas PODEM ser apoiadas\
    \ pelo mesmo armazenamento de dados, porém, DEVEM ser logicamente independentes.\
    \ A definição dessa interface é mostrada a seguir:\n\n```\n<?php\n\nnamespace\
    \ Psr\\SimpleCache;\n\ninterface CacheInterface\n{    \n    public function get($key,\
    \ $default = null);\n    public function set($key, $value, $ttl = null);\n   \
    \ public function delete($key);\n    public function clear();\n    public function\
    \ getMultiple($keys, $default = null);\n    public function setMultiple($values,\
    \ $ttl = null);\n    public function deleteMultiple($keys);    \n    public function\
    \ has($key);\n}\n```\n\n### `Psr\\SimpleCache\\CacheException`\n\nEsta interface\
    \ define as exceções de cache que podem ocorrer.\n\n```\n<?php\n\nnamespace Psr\\\
    SimpleCache;\n\ninterface CacheException\n{\n}\n```\n\n### `Psr\\SimpleCache\\\
    InvalidArgumentException`\n\nEsta interface define as exceções de argumentos inválidos\
    \ que podem ocorrer.\n\n```\n<?php\n\nnamespace Psr\\SimpleCache;\n\ninterface\
    \ InvalidArgumentException extends CacheException\n{\n}\n```\n\n### Conclusão\n\
    \nA PSR-16 define uma interface comum para trabalhar com cache de maneira simples\
    \ e compatível também com a PSR-6, que também trabalha com cache.\n\nNo próximo\
    \ capítulo vamos falar sobre a PSR-17, que trabalha `HTTP Factory` para a criação\
    \ de objetos definidos pela PSR-7.\n\nCapítulo 16 \n\n# PSR-18 (HTTP Client)\n\
    \nEsta PSR descreve uma interface comum para o envio e recebimento de requisições\
    \ `HTTP` compatíveis com a PSR-7. Um dos principais objetivos é permitir que os\
    \ desenvolvedores criem bibliotecas totalmente desacopladas das implementações\
    \ do cliente `HTTP`, tornando-as ainda mais reutilizáveis. Além disso, o intuito\
    \ desta PSR é diminuir a quantidade de dependências e ainda diminuir a probabilidade\
    \ de conflitos de versões.\n\nUm outro ponto importante é que os clientes `HTTP`\
    \ possam ser substituídos de acordo com o **princípio de substituição de Liskov**.\
    \ Todos os clientes, ao enviarem uma requisição, DEVEM se comportar exatamente\
    \ da mesma maneira.\n\n> **O que é o princípio de substituição de Liskov (LSP)?**\n\
    \n> \n\n> Barbara Liskov criou uma definição para o conceito de subtipo. Segundo\
    \ Liskov: Se q(x) é uma propriedade demonstrável dos objetos x de tipo T. Então\
    \ q(y) deve ser verdadeiro para objetos y de tipo S onde S é um subtipo de T.\n\
    \n> \n\n> De maneira bem resumida, o princípio de Liskov sugere que uma classe\
    \ base deve poder ser substituída pela sua classe derivada.\n\n## 16.1 Regras\n\
    \nVamos conhecer a seguir as regras que fazem parte dessa PSR.\n\n### Regra 1\n\
    \nUm cliente PODE:\n\n*   Optar por enviar uma requisição `HTTP` diferente da\
    \ requisição que foi fornecida. Um exemplo seria a compactação do corpo de uma\
    \ mensagem de resposta.\n\n*   Optar por alterar uma resposta `HTTP` recebida\
    \ antes de retorná-la para quem a solicitou. Um exemplo seria a descompactação\
    \ de um corpo de mensagem de entrada.\n\n### Regra 2\n\nSe um cliente optar por\
    \ alterar a requisição ou a resposta `HTTP`, o cliente DEVE garantir que o objeto\
    \ permaneça internamente consistente. Por exemplo, ao descompactar o corpo da\
    \ mensagem o cliente também DEVERÁ remover o cabeçalho `Content-Encoding` e ajustar\
    \ o cabeçalho `Content-Length`.\n\n### Regra 3\n\nComo os objetos definidos pela\
    \ PSR-7 são imutáveis, a aplicação NÃO DEVE assumir que o objeto enviado para\
    \ `ClientInterface::sendRequest()` será realmente o mesmo objeto enviado. Por\
    \ exemplo, o objeto `Request` que é retornado por uma exceção PODE ser diferente\
    \ daquele que foi passado para `sendRequest()`, portanto, a comparação por referência\
    \ (`===`) não será possível.\n\n### Regra 4\n\nUm cliente DEVE remontar uma resposta\
    \ `HTTP` de status 1xx (informativa), ou seja, com os status (100 - Continuar,\
    \ 101 - Mudando Protocolos, 102 - Processamento e 122 - Pedido-URI Muito Longo)\
    \ de várias etapas para que o que é retornado para a aplicação seja uma resposta\
    \ `HTTP` válida do código de status 200 ou superior.\n\n### Regra 5\n\nUm cliente\
    \ NÃO DEVE tratar uma requisição `HTTP` bem formada ou uma resposta `HTTP` como\
    \ uma condição de erro. Os códigos de status de resposta na faixa 400 e 500 NÃO\
    \ PODEM causar uma exceção e DEVEM ser devolvidos para a aplicação normalmente.\n\
    \n```\n\n```\n\n### Regra 6\n\nUm cliente deve lançar uma exceção de `Psr\\Http\\\
    Client\\ClientExceptionInterface` se, e somente se, o cliente não puder enviar\
    \ uma requisição `HTTP` ou se a resposta `HTTP` não puder ser analisada em um\
    \ objeto de resposta da PSR-7.\n\n### Regra 7\n\nCaso uma requisição não possa\
    \ ser enviada porque a mensagem de requisição não é uma requisição `HTTP` bem\
    \ formada ou está faltando alguma informação crítica (como um host ou método),\
    \ o cliente DEVE lançar uma exceção de `Psr\\Http\\Client\\RequestExceptionInterface`.\n\
    \n### Regra 8\n\nSe a requisição não puder ser enviada devido a uma falha de rede\
    \ de qualquer tipo, incluindo um tempo limite, o cliente DEVE lançar uma exceção\
    \ de `Psr\\Http\\Client\\NetworkExceptionInterface`.\n\n### Regra 9\n\nOs clientes\
    \ PODEM lançar exceções mais específicas do que as que foram definidas por esta\
    \ PSR (um `TimeOutException` ou `HostNotFoundException`, por exemplo), desde que\
    \ implementem a interface apropriada definida anteriormente.\n\nEssas foram as\
    \ regras definidas pela PSR-18 e, como pudemos ver, não são muitas e também não\
    \ são tão complexas como outras regras que vimos nas PSRs anteriormente.\n\n##\
    \ 16.2 Interfaces\n\nA seguir vamos conhecer as interfaces que fazem parte dessa\
    \ PSR.\n\n### `Psr\\Http\\Client\\ClientInterface`\n\nEsta interface implementa\
    \ apenas um método e possui a responsabilidade de enviar e receber uma requisição\
    \ compatível com a PSR-7.\n\n```\n<?php\nnamespace Psr\\Http\\Client;\n\nuse Psr\\\
    Http\\Message\\RequestInterface;\nuse Psr\\Http\\Message\\ResponseInterface;\n\
    \ninterface ClientInterface\n{\n    public function sendRequest(RequestInterface\
    \ $request): ResponseInterface;\n}\n```\n\n### `Psr\\Http\\Client\\ClientExceptionInterface`\n\
    \nToda exceção relacionada ao cliente `HTTP` DEVE implementar esta interface.\n\
    \n```\n<?php\nnamespace Psr\\Http\\Client;\n\ninterface ClientExceptionInterface\
    \ extends \\Throwable\n{\n}\n```\n\n### `Psr\\Http\\Client\\RequestExceptionInterface`\n\
    \nEsta interface possui a responsabilidade de lançar uma exceção para o caso de\
    \ uma requisição falhar."
  fmt: "\nTodos os dados passados para a aplicação DEVEM ser retornados da mesma maneira\
    \ como foram passados. Isso significa que, se a aplicação passar uma variável\
    \ com o valor (string) \"10\", ela DEVERÁ retornar o valor (string) \"10\", e\
    \ não um valor (int) 10.\n\nA aplicação PODE utilizar as funções `serialize()`\
    \ e `unserialize()` do PHP, mas não é obrigatório utilizá-las. A compatibilidade\
    \ é simplesmente usada como uma base para objetos que são aceitos. Se por algum\
    \ motivo o valor exato não puder ser retornado, a aplicação DEVE retornar um erro\
    \ de cache e não um erro de dados corrompidos/inválidos.\n\nConhecemos as regras\
    \ que a PSR-16 define e como você pôde perceber são bem semelhantes com as regras\
    \ da PSR-6. A diferença é que a PSR-16 é um modelo mais simples e enxuto da PSR-6,\
    \ isso não impede que você utilize as duas PSRs em conjunto.\n\n## 15.2 Interfaces\n\
    \nA seguir vamos conhecer as interfaces que fazem parte dessa PSR.\n\n### `Psr\\\
    SimpleCache\\CacheInterface`\n\nEsta interface define as operações básicas para\
    \ uma coleção de cache, que requer leitura, gravação e exclusão de itens de cache\
    \ individuais, além disso, possui métodos que lidam com várias entradas de cache,\
    \ como escrever, ler ou excluir várias entradas de cache por vez. Isso é muito\
    \ útil quando temos muitas leituras/gravações em cache para executar e permite\
    \ executar essas operações através de uma única chamada para o servidor de cache,\
    \ reduzindo drasticamente a latência.\n\nUma única instância de `Psr\\SimpleCache\\\
    CacheInterface` é correspondente a uma única coleção de itens de cache com um\
    \ único namespace de chave e é equivalente a um `pool` da PSR-6. É permitido diferentes\
    \ instâncias de `Psr\\SimpleCache\\CacheInterface` e essas PODEM ser apoiadas\
    \ pelo mesmo armazenamento de dados, porém, DEVEM ser logicamente independentes.\
    \ A definição dessa interface é mostrada a seguir:\n\n```php\n<?php\n\nnamespace\
    \ Psr\\SimpleCache;\n\ninterface CacheInterface\n{    \n    public function get($key,\
    \ $default = null);\n    public function set($key, $value, $ttl = null);\n   \
    \ public function delete($key);\n    public function clear();\n    public function\
    \ getMultiple($keys, $default = null);\n    public function setMultiple($values,\
    \ $ttl = null);\n    public function deleteMultiple($keys);    \n    public function\
    \ has($key);\n}\n```\n\n### `Psr\\SimpleCache\\CacheException`\n\nEsta interface\
    \ define as exceções de cache que podem ocorrer.\n\n```php\n<?php\n\nnamespace\
    \ Psr\\SimpleCache;\n\ninterface CacheException\n{\n}\n```\n\n### `Psr\\SimpleCache\\\
    InvalidArgumentException`\n\nEsta interface define as exceções de argumentos inválidos\
    \ que podem ocorrer.\n\n```php\n<?php\n\nnamespace Psr\\SimpleCache;\n\ninterface\
    \ InvalidArgumentException extends CacheException\n{\n}\n```\n\n### Conclusão\n\
    \nUma PSR-16 define uma interface comum para trabalhar com cache de maneira simples\
    \ e compatível também com a PSR-6, que também trabalha com cache.\n\nNo próximo\
    \ capítulo vamos falar sobre a PSR-17, que trabalha `HTTP Factory` para a criação\
    \ de objetos definidos pela PSR-7.\n\nCapítulo 16\n\n# PSR-18 (HTTP Client)\n\n\
    Esta PSR descreve uma interface comum para o envio e recebimento de requisições\
    \ `HTTP` compatíveis com a PSR-7. Um dos principais objetivos é permitir que os\
    \ desenvolvedores criem bibliotecas totalmente desacopladas das implementações\
    \ do cliente `HTTP`, tornando-as ainda mais reutilizáveis. Além disso, o intuito\
    \ desta PSR é diminuir a quantidade de dependências e ainda diminuir a probabilidade\
    \ de conflitos de versões.\n\nUm outro ponto importante é que os clientes `HTTP`\
    \ possam ser substituídos de acordo com o princípio de substituição de Liskov.\
    \ Todos os clientes, ao enviarem uma requisição, DEVEM se comportar exatamente\
    \ da mesma maneira.\n\n> **O que é o princípio de substituição de Liskov (LSP)?**\n\
    > \n> Barbara Liskov criou uma definição para o conceito de subtipo. Segundo Liskov:\
    \ Se `q(x)` é uma propriedade demonstrável dos objetos x de tipo T. Então `q(y)`\
    \ deve ser verdadeiro para objetos y de tipo S onde S é um subtipo de T.\n> \n\
    > De maneira bem resumida, o princípio de Liskov sugere que uma classe base deve\
    \ poder ser usada.\n\n## 16.1 Regras\n\nVamos conhecer a seguir as regras que\
    \ fazem parte dessa PSR.\n\n### Regra 1\n\nUm cliente PODE:\n\n* Optar por enviar\
    \ uma requisição `HTTP` diferente da que foi fornecida.\n* Optar por alterar a\
    \ resposta antes de retorná-la.\n\n### Regra 2\n\nO cliente DEVE garantir que\
    \ a mensagem de requisição seja consistente.\n\n### Regra 3\n\nSe o cliente não\
    \ puder enviar uma requisição, o objeto enviado não deve ser o mesmo.\n\n### Regra\
    \ 4\n\nSe uma requisição não puder ser enviada porque a mensagem não é uma requisição\
    \ `HTTP` bem formada ou está faltando informação crítica (como um host ou método),\
    \ o cliente DEVE lançar uma exceção de `Psr\\Http\\Client\\RequestException`.\n\
    \n### Regra 5\n\nUm cliente DEVE tratar uma requisição `HTTP` de status 200 ou\
    \ superior como um erro.\n\n### Regra 6\n\nUm cliente deve lançar uma exceção\
    \ de `Psr\\Http\\Client\\ClientException` se, e somente se, o cliente não puder\
    \ analisar a resposta `HTTP`.\n\n### Regra 7\n\nCaso uma requisição não puder\
    \ ser enviada porque a mensagem não é uma requisição `HTTP` bem formada, o cliente\
    \ DEVE lançar uma exceção de `Psr\\Http\\Client\\RequestException`.\n\n### Regra\
    \ 8\n\nSe a requisição não puder ser enviada devido a uma falha de rede de qualquer\
    \ tipo, incluindo um tempo limite, o cliente DEVE lançar uma exceção de `Psr\\\
    Http\\Client\\NetworkException`.\n\n### Regra 9\n\nOs clientes PODEM lançar exceções\
    \ mais específicas do que as foram definidas por esta PSR (um `TimeOutException`\
    \ ou `HostNotFoundException`, por exemplo), desde que implementem a interface\
    \ apropriada definida anteriormente.\n\nEssas foram as regras definidas pela PSR-18\
    \ e, como pudemos ver, não são muitas e também não são tão complexas.\n\n## 16.2\
    \ Interfaces\n\n### `Psr\\Http\\Client\\ClientInterface`\n\nEsta interface implementa\
    \ apenas um método e possui a responsabilidade de enviar e receber uma requisição\
    \ compatível com a PSR-7.\n\n```php\n<?php\nnamespace Psr\\Http\\Client;\n\nuse\
    \ Psr\\Http\\Message\\RequestInterface;\nuse Psr\\Http\\Message\\ResponseInterface;\n\
    \ninterface ClientInterface\n{\n    public function sendRequest(RequestInterface\
    \ $request): ResponseInterface;\n}\n```\n\n### `Psr\\Http\\Client\\ClientExceptionInterface`\n\
    \nToda exceção relacionada ao cliente `HTTP` DEVE implementar esta interface.\n\
    \n```php\n<?php\nnamespace Psr\\Http\\Client;\n\ninterface ClientExceptionInterface\
    \ extends \\Throwable\n{\n}\n```\n\n### `Psr\\Http\\Client\\RequestExceptionInterface`\n\
    \nEsta interface possui a responsabilidade de lançar uma exceção para o caso de\
    \ uma requisição falhar.\n"
  trans: "\n\n传递给应用的所有数据**必须**以传入相同的方式返回。这意味着，如果应用传递了一个值为（字符串）\"10\"的变量，它**必须**返回值（string）\"\
    10\"，而不是整数（int）值 10。\n\n应用**可以**使用 PHP 的 `serialize()` 和 `unserialize()` 函数，但并非强制使用它们。兼容性仅被用作接受的对象的标准。如果由于某种原因无法返回精确的值，应用**必须**返回缓存错误，而不是数据损坏/无效错误。\n\
    \n我们了解 PSR-16 定义的规则，正如你可能察觉到的，它们与 PSR-6 的规则非常相似。区别在于，PSR-16 是 PSR-6 一个更简单、更精简的模型，这并不会阻止你结合使用这两个\
    \ PSR。\n\n## 15.2 接口\n\n接下来我们将了解该 PSR 部分的接口。\n\n### `Psr\\SimpleCache\\CacheInterface`\n\
    \n此接口定义了缓存集合的基本操作，要求对单个缓存项进行读取、写入和删除，此外，它拥有处理多个缓存条目的的方法，例如一次写入、读取或删除多个缓存条目。当我们有大量的缓存读/写需要执行时，这非常有用，并允许通过对缓存服务器的单一调用执行这些操作，从而大幅降低延迟。\n\
    \n`Psr\\SimpleCache\\CacheInterface` 的单个实例对应于单一键命名空间的单一缓存项集合，等同于 PSR-6 中的 `pool`。允许存在不同的\
    \ `Psr\\SimpleCache\\CacheInterface` 实例，它们**可以**由相同的数据存储支持，但**必须**在逻辑上保持独立。该接口的定义如下：\n\
    \n```php\n<?php\n\nnamespace Psr\\SimpleCache;\n\ninterface CacheInterface\n{\
    \    \n    public function get($key, $default = null);\n    public function set($key,\
    \ $value, $ttl = null);\n    public function delete($key);\n    public function\
    \ clear();\n    public function getMultiple($keys, $default = null);\n    public\
    \ function setMultiple($values, $ttl = null);\n    public function deleteMultiple($keys);\
    \    \n    public function has($key);\n}\n```\n\n### `Psr\\SimpleCache\\CacheException`\n\
    \n此接口定义了可能发生的缓存异常。\n\n```php\n<?php\n\nnamespace Psr\\SimpleCache;\n\ninterface\
    \ CacheException\n{\n}\n```\n\n### `Psr\\SimpleCache\\InvalidArgumentException`\n\
    \n此接口定义了可能发生的无效参数异常。\n\n```php\n<?php\n\nnamespace Psr\\SimpleCache;\n\ninterface\
    \ InvalidArgumentException extends CacheException\n{\n}\n```\n\n### 结论\n\nPSR-16\
    \ 定义了一个通用接口，用于简单地处理缓存并与同样处理缓存的 PSR-6 兼容。\n\n在下一章我们将讨论 PSR-17，它通过 `HTTP Factory`\
    \ 创建由 PSR-7 定义的对象。\n\n第 16 章\n\n# PSR-18 (HTTP Client)\n\n此 PSR 描述了一个用于发送和接收兼容\
    \ PSR-7 的 `HTTP` 请求的通用接口。其主要目标之一是允许开发者创建完全解耦于 HTTP 客户端实现的库，使其具有更高的复用性。此外，此 PSR\
    \ 的目的是减少依赖数量并进一步降低版本冲突概率。\n\n另一个重要点是 `HTTP` 客户端可以根据替换原则进行替换。所有客户端在发送请求时**必须**表现完全一致。\n\
    \n> **什么是替换原则 (LSP)？**\n> \n> Barbara Liskov 为子类型概念创建了一个定义。根据 Liskov 的观点：如果 `q(x)`\
    \ 是类型 T 对象 x 的可证明属性，那么对于类型 S 的对象 y（其中 S 是 T 的子类型），`q(y)` 必须为真。\n> \n> 来说，替换原则建议基类应该是可以使用的。\n\
    \n## 16.1 规则\n\n我们将了解该 PSR 部分的规则。\n\n### 规则 1\n\n客户端**可以**：\n\n* 选择发送与提供的不同的 `HTTP`\
    \ 请求。\n* 选择在返回之前对响应进行修改。\n\n### 规则 2\n\n客户端**必须**确保请求消息的一致性。\n\n### 规则 3\n\n如果客户端无法发送请求，则发送的对象不应是同一个。\n\
    \n### 规则 4\n\n如果因为消息不是格式良好的 `HTTP` 请求或缺少关键信息（如主机或方法）而无法发送请求，客户端**必须**抛出 `Psr\\\
    Http\\Client\\RequestException` 。\n\n### 规则 5\n\n客户端**必须**将状态为 200 或以上的 `HTTP`\
    \ 请求视为错误。\n\n### 规则 6\n\n当且仅当客户端无法解析 `HTTP` 响应时，客户端应抛出 `Psr\\Http\\Client\\ClientException`\
    \ 。\n\n### 规则 7\n\n如果因为消息不是格式良好的 `HTTP` 请求而无法发送请求，客户端**必须**抛出 `Psr\\Http\\Client\\\
    RequestException` 。\n\n### 规则 8\n\n如果由于任何类型的网络故障（包括超时）导致无法发送请求，客户端**必须**抛出 `Psr\\\
    Http\\Client\\NetworkException` 。\n\n### 规则 9\n\n客户端**可以**抛出比此 PSR 定义的更具体的异常（例如\
    \ `TimeOutException` 或 `HostNotFoundException`），只要它们实现了之前定义的相应接口即可。\n\n这些就是 PSR-18\
    \ 定义的规则，正如我们所看到的，规则并不多，也不复杂。\n\n## 16.2 接口\n\n### `Psr\\Http\\Client\\ClientInterface`\n\
    \n此接口仅实现了一个方法，负责发送和接收兼容 PSR-7 的请求。\n\n```php\n<?php\nnamespace Psr\\Http\\Client;\n\
    \nuse Psr\\Http\\Message\\RequestInterface;\nuse Psr\\Http\\Message\\ResponseInterface;\n\
    \ninterface ClientInterface\n{\n    public function sendRequest(RequestInterface\
    \ $request): ResponseInterface;\n}\n```\n\n### `Psr\\Http\\Client\\ClientExceptionInterface`\n\
    \n所有与 `HTTP` 客户端相关的异常**必须**实现此接口。\n\n```php\n<?php\nnamespace Psr\\Http\\Client;\n\
    \ninterface ClientExceptionInterface extends \\Throwable\n{\n}\n```\n\n### `Psr\\\
    Http\\Client\\RequestExceptionInterface`\n\n此接口负责在请求失败时抛出异常。\n\n"
