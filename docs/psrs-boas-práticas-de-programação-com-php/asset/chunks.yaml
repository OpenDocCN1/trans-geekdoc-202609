  trans: "\n\n```php\n<?php\n\nnamespace App\\Controller\\Usuario;\n\nuse App\\Usuario\\\
    UsuarioTrait;\nuse App\\Contato\\ContatoTrait;\nuse App\\Endereco\\EnderecoTrait;\n\
    \nclass UsuarioController\n{\n    use UsuarioTrait;\n    use ContatoTrait;\n \
    \   use EnderecoTrait;\n}\n```\n\n### 规则 20\n\n当类在 `use` 声明后没有任何内容时，类的闭大括号**必须**放在下一行。\n\
    \n我们已经在之前的 `Traits` 示例中见过了这一点，但为了说明，请查看下面的示例：\n\n```php\n<?php\n\nnamespace App\\\
    Controller\\Usuario;\n\nuse App\\Usuario\\UsuarioTrait;\n\nclass UsuarioController\n\
    {\n    use UsuarioTrait;\n}\n```\n\n但如果类在 `Trait` 声明后有内容呢？那么很简单，在 `use` 声明之后**必须**有一个空行，如下例所示：\n\
    \n```php\n<?php\n\nnamespace App\\Controller\\Usuario;\n\nuse App\\Usuario\\UsuarioTrait;\n\
    \nclass UsuarioController\n{\n    use UsuarioTrait;\n\n    private $usuario;\n\
    }\n```\n\n### 规则 21\n\n`insteadof` 和 `as` 操作符的使用应按如下方式进行，注意缩进、间距和换行：\n\n```php\n\
    <?php\n\nnamespace App\\Controller\\Usuario;\n\nuse App\\Usuario\\UsuarioTrait;\n\
    use App\\Contato\\ContatoTrait;\nuse App\\Endereco\\EnderecoTrait;\n\nclass UsuarioController\n\
    {\n    use A, B, C {\n        B::getUsuario insteadof A;\n        A::getContato\
    \ insteadof B;\n        C::getEndereco as Endereco;\n    }\n}\n```\n\n### 规则 22\n\
    \n可见性或访问修饰符**必须**定义在所有属性上。定义的定义的属性必须在其名称之前定义访问修饰符。\n\n下面的示例演示了该规则的应用：\n\n```php\n\
    <?php\n\nnamespace App\\Entity\\Usuario;\n\nclass Usuario\n{\n    private $nome;\n\
    \n    private $sobrenome;\n\n    protected static $sexo;\n\n    public int $idade;\n\
    \n    //更多属性、方法等...\n}\n```\n\n请注意，所有定义的属性在其名称之前都有访问修饰符，无论是 `private`、`protected`\
    \ 还是 `public`。\n\n现在我们来分析同一个示例，但去掉了访问修饰符：\n\n```php\n<?php\n\nnamespace App\\\
    Entity\\Usuario;\n\nclass Usuario\n{\n    $nome;\n\n    $sobrenome;\n\n    static\
    \ $sexo;\n\n    int $idade;\n}\n```\n\n分析上一个示例的代码，很难知道哪个属性是私有的、公共的或保护的。\n\n实际上，当属性没有定义访问修饰符时，将抛出名为\
    \ `PHP Parse error` 的错误，因为类中的属性必须具有访问修饰符，静态属性 `static` 除外，静态属性会自动具有公共可见性。\n\n\
    ### 规则 23\n\n定义类属性时**不要**使用 `var` 关键字。定义类属性时，不要使用 `var`，也就是说下面的示例被 PSR-12 认为是不正确的：\n\
    \n```php\n<?php\n\nnamespace App\\Entity\\Usuario;\n\nclass Usuario\n{\n    var\
    \ $nome;\n\n    var $sobrenome;\n\n    var $sexo;\n\n    var $idade;\n}\n```\n\
    \n尽管是不正确的，代码仍会被正确解析，并且所有属性将自动具有公共可见性。\n\n### 规则 24\n\n如果项目中的最低 PHP 版本为 7.1 或更高，则所有常量都**必须**声明可见性，否则该规则不适用。\n\
    \n让我们分析下面的示例，它展示了这一新性的的应用：\n\n```php\n<?php\n\nnamespace App\\Entity\\Usuario;\n\
    \nclass Usuario\n{\n    private const RG = '112341233';\n\n    protected const\
    \ CPF = '111.222.333-44';\n\n    public const NOME = 'Jhones S. Clementino';\n\
    }\n```\n\n如果你曾使用旧版本的 PHP 开发过，就会知道在定义常量时无法指定每个常量的可见性。\n\n### 规则 25\n\n如果项目中的最低\
    \ PHP 版本为 7.1 或更高，则所有常量都**必须**声明可见性，否则该规则不适用。\n\n### 规则 26\n\n如果项目中的最低 PHP 版本为\
    \ 7.1 或更高，则所有常量都**必须**声明可见性，否则该规则不适用。\n\n### 规则 27\n\n类型声明与属性名称之间**必须**有一个空格。\n\
    \n### 规则 28\n\n所有方法都**必须**定义可见性。\n\n### 规则 29\n\n方法名称之后**不允许**存在空格。\n\n"
