- raw: "O controle de dados em cache geralmente é essencial e visa aumentar o desempenho\
    \ da aplicação, mas nem por isso deve ser uma parte crítica que possa afetar as\
    \ demais funcionalidades. Sendo assim um erro no cache NÃO DEVERIA resultar em\
    \ falhas na aplicação.\n\nPara o tratamento adequado dos erros provenientes de\
    \ falhas de cache, a aplicação deve ser capaz de capturar todos os erros que possam\
    \ ocorrer, mas NÃO DEVE lançar exceções que não foram definidas pela interface.\n\
    \nEla DEVE ser capaz de capturar qualquer erro ou exceções que foram ocasionadas\
    \ por outro sistema de armazenamento e NÃO DEVE permitir que esses dados se misturem.\n\
    \nA aplicação DEVE registrar esses erros e fazer o tratamento mais apropriado.\
    \ Se for desejado que um ou mais itens do cache sejam excluídos, caso a chave\
    \ especificada não exista, isso NÃO DEVE ser considerado erro.\n\n## 7.2 Interfaces\n\
    \nA seguir vamos conhecer um pouco das interfaces que fazem parte dessa PSR:\n\
    \n### `CacheItemInterface`\n\nO objetivo dessa interface é definir um item de\
