- raw: "Um `Dispatcher` é um objeto de serviço que implementa a interface `EventDispatcherInterface`.\
    \ Ele é responsável por recuperar os `Listeners` de um `Listener Provider` para\
    \ o evento despachado e invocar cada `Listener` com esse evento.\n\nUm `Dispatcher`:\n\
    \n*   DEVE chamar os `Listeners` sincronicamente na ordem em que eles são retornados\
    \ de um `Listener Provider`.\n\n*   DEVE retornar o mesmo objeto `Event` que foi\
    \ passado depois de ser feito, chamando `Listeners`.\n\n*   NÃO DEVE retornar\
    \ ao emissor até que todos os `Listeners` tenham executado.\n\n### Regra 11\n\n\
    Se passou um evento `Stoppable`, um `Dispatcher` DEVE chamar o método `isPropagationStopped()`\
    \ no evento antes que cada `Listener` seja chamado. Se esse método retornar `true`,\
    \ ele DEVE retornar o evento ao `Emitter` (Emissor) imediatamente e NÃO DEVE chamar\
    \ mais nenhum `Listener`.\n\nSe um evento for passado para o `Dispatcher` que\
    \ sempre retorna `true` através do método `isPropagationStopped()`, zero `Listeners`\
    \ será chamado.\n\n### Regra 12\n\nUm `Dispatcher` deve assumir que qualquer `Listener`\
    \ retornado a ele de um `ListenerProvider` é seguro para o tipo, ou seja, o `Dispatcher`\
    \ DEVE assumir que chamar `$listener($event)` não produzirá um `TypeError`.\n\n\
    ### Regra 13\n\nUma exceção ou erro lançado por um `Listener` DEVE bloquear a\
    \ execução de outros `Listeners` e DEVE ter permissão para se propagar de volta\
    \ para o emissor.\n\n### Regra 14\n\nUm `Dispatcher` PODE pegar um objeto para\
    \ registrá-lo, permitir que medidas adicionais sejam tomadas etc., mas, em seguida,\
    \ DEVE recriar o item original.\n\n```\n\n```\n\n### Regra 15\n\nUm `Listener\
    \ Provider` é um objeto de serviço responsável por determinar quais `Listeners`\
    \ são relevantes e devem ser chamados para um determinado evento. Pode determinar\
    \ tanto que os `Listeners` são relevantes quanto a ordem pela qual retorná-los.\n\
    \nIsso PODE incluir:\n\n*   Permitir alguma forma de mecanismo de registro para\
    \ que as aplicações possam atribuir um `Listener` a um evento em uma ordem fixa.\n\
    \n*   Derivar uma lista de `Listeners` aplicáveis por meio da reflexão com base\
    \ no tipo e nas interfaces implementadas do evento.\n\n*   Gerar uma lista compilada\
    \ de `Listeners` antecipadamente que podem ser consultados em tempo de execução.\n\
    \n*   Implementar alguma forma de controle de acesso para que determinados `Listeners`\
    \ sejam chamados apenas se o usuário atual tiver uma determinada permissão.\n\n\
    *   Extrair algumas informações de um objeto referenciado pelo evento, como uma\
    \ entidade, e chamando métodos de ciclo de vida predefinidos nesse objeto.\n\n\
    *   Delegar sua responsabilidade a um ou mais `Listener Proveiders` usando alguma\
    \ lógica arbitrária.\n\nQualquer combinação dos itens citados anteriormente PODE\
    \ ser usada como desejado.\n\n### Regra 16\n\n`Listener Providers` DEVEM usar\
    \ o nome da classe de um evento para diferenciar um evento do outro. Eles também\
    \ PODEM considerar qualquer outra informação sobre o evento, conforme seja mais\
    \ apropriado.\n\n### Regra 17\n\nOs `Listener Providers` DEVEM tratar os tipos\
    \ de pai de forma idêntica ao tipo do próprio evento ao determinar a aplicabilidade\
    \ do `Listener`. No seguinte caso:\n\n```\n<?php\nclass A {}\n\nclass B extends\
    \ A {}\n\n$b = new B();\n\nfunction listener(A $event): void {};\n```\n\nUm `Listener\
    \ Provider` DEVE tratar o método `listener()` como um `Listener` aplicável por\
    \ `$b`, pois é compatível com o tipo, a menos que outros critérios o impeçam de\
    \ fazê-lo.\n\n### Regra 18\n\nUm `Dispatcher` DEVE compor um `Listener Provider`\
    \ para determinar os `Listeners` relevantes. É RECOMENDADO que um `Listener Provider`\
    \ seja implementado como um objeto distinto do `Dispatcher`, mas NÃO É NECESSÁRIO.\n\
    \n## 13.2 Interfaces\n\nA seguir vamos conhecer as interfaces que fazem parte\
    \ desse pacote.\n\n### `Psr\\EventDispatcher\\EventDispatcherInterface`\n\nEsta\
    \ interface define um `Dispatcher` para eventos.\n\n```\n<?php\nnamespace Psr\\\
    EventDispatcher;\n\ninterface EventDispatcherInterface\n{    \n    public function\
    \ dispatch(object $event);\n}\n```\n\n### `Psr\\EventDispatcher\\ListenerProviderInterface`\n\
    \nEsta interface é um mapeador de um evento para os `Listeners` que são aplicáveis\
    \ a esse evento.\n\n```\n<?php\nnamespace Psr\\EventDispatcher;\n\ninterface ListenerProviderInterface\n\
    {\n    public function getListenersForEvent(object $event) : iterable;\n}\n```\n\
    \n### `Psr\\EventDispatcher\\StoppableEventInterface`\n\nEsta interface verifica\
    \ um evento cujo processamento pode ser interrompido quando o evento foi tratado.\n\
    \n```\n<?php\nnamespace Psr\\EventDispatcher;\n\ninterface StoppableEventInterface\n\
    {\n    public function isPropagationStopped() : bool;\n}\n```\n\n### Conclusão\n\
    \nNo próximo capítulo vamos abordar sobre a PSR-15, que trata conceitos conhecidos\
    \ como os `middlewares`/`handlers`. Então vamos nessa!\n\nCapítulo 14 \n\n# PSR-15\
    \ (HTTP Server Request Handlers)\n\nCom o principal objetivo de fornecer interfaces\
    \ comuns para a manipulação das requisições HTTP, os `handlers` (manipuladores)\
    \ são essenciais em qualquer aplicação Web. O código do lado do servidor recebe\
    \ uma requisição que é processada e então é gerada uma resposta que pode ser repassada\
    \ para outra aplicação ou não.\n\nOs `middlewares` em APIs podem ser considerados\
    \ como estruturas que trabalham sob o protocolo HTTP, por meio do qual recebem\
    \ uma requisição de entrada e geram uma resposta como saída. Essa resposta pode\
    \ ou não ser repassada para outros middlewares.\n\nPor exemplo, para realizar\
    \ a autenticação de um usuário, teríamos algo como um middleware de autenticação\
    \ que recebe as credenciais do usuário. Se os dados estiverem corretos, ele poderá\
    \ passar para o próximo middleware, indicando que a autenticação foi bem-sucedida\
    \ e ele está pronto para receber autorização para acessar os recursos permitidos\
    \ para aquele usuário. Para entendermos melhor o funcionamento dos middlewares,\
    \ veja o exemplo a seguir, que demonstra o seu funcionamento dentro de uma API:\n\
    \n![Funcionamento dos middlewares](middlewares.png)\n\nFigura 14.1: Funcionamento\
    \ dos middlewares\n\nConforme mostrado na imagem anterior nós temos duas camadas\
    \ de middlewares. O `AuthenticationMiddleware` recebe a requisição e realiza a\
    \ verificação concedendo ou não o acesso ao usuário. Em caso afirmativo, os dados\
    \ da requisição são passados para o próximo middleware, o `AuthorizationMiddlware`,\
    \ que é responsável por verificar se o usuário possui autorização para acessar\
    \ um determinado recurso do sistema. Se sim, então os dados são enviados para\
    \ a camada da aplicação para continuar o processamento. Podemos ter quantos middlewares\
    \ forem necessários, tudo vai depender da sua aplicação.\n\n## 14.1 Regras\n\n\
    Vamos conhecer a seguir as regras que definem essa PSR para entendermos como aplicá-la\
    \ de forma coesa.\n\n### Regra 1\n\n**Request Handlers (Manipuladores de Requisição/Solicitação)**\
    \ - É um componente individual que realiza o processamento de uma solicitação\
    \ e consequentemente gera uma resposta, conforme definido pela PSR-7. Um `request\
    \ handler` (manipulador de requisição) PODE lançar uma exceção caso as condições\
    \ da requisição sejam impedidas de produzirem uma resposta, porém, o tipo de exceção\
    \ não está definido.\n\nOs `requests handlers` que utilizam esse padrão DEVEM\
    \ implementar a interface `Psr\\Http\\Server\\RequestHandlerInterface`.\n\n###\
    \ Regra 2\n\n**Middleware** - É um componente individual que trabalha junto com\
    \ outros middlewares durante o processamento de uma requisição e gera uma resposta\
    \ como saída, conforme definido pela PSR-7.\n\nUm middleware PODE criar e retornar\
    \ uma resposta sem que haja a delegação para um `request handler` (manipulador\
    \ de requisição) desde que as condições necessárias sejam atendidas.\n\nPara utilizar\
    \ este padrão, os middlewares DEVEM implementar a interface `Psr\\Http\\Server\\\
    MiddlewareInterface`.\n\n### Regra 3"
