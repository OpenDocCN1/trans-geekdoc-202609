- raw: "```\n<?php\n\nnamespace App\\Controller\\Usuario;\n\nuse App\\Usuario\\UsuarioTrait;\n\
    use App\\Contato\\ContatoTrait;\nuse App\\Endereco\\EnderecoTrait;\n\nclass UsuarioController\n\
    {\n    use UsuarioTrait;\n    use ContatoTrait;\n    use EnderecoTrait;\n}\n```\n\
    \n### Regra 20\n\nQuando a classe não tem nada após a declaração de uso `use`,\
    \ a chave de fechamento da classe DEVE estar na linha subsequente.\n\nJá vimos\
    \ isso nos exemplos anteriores de `Traits`, mas para exemplificar vamos verificar\
    \ o exemplo a seguir:\n\n```\n<?php\n\nnamespace App\\Controller\\Usuario;\n\n\
    use App\\Usuario\\UsuarioTrait;\n\nclass UsuarioController\n{\n    use UsuarioTrait;\n\
    }\n```\n\nMas e se a classe tiver conteúdo após a declaração de uso da `Trait`?\
    \ Então é simples, DEVE ter uma linha em branco após a declaração de uso `use`,\
    \ conforme demonstra o exemplo a seguir:\n\n```\n<?php\n\nnamespace App\\Controller\\\
    Usuario;\n\nuse App\\Usuario\\UsuarioTrait;\n\nclass UsuarioController\n{\n  \
    \  use UsuarioTrait;\n\n    private $usuario;\n}\n```\n\n### Regra 21\n\nO uso\
    \ dos operadores `insteadof` e `as` deve ser feito da seguinte maneira, percebendo\
    \ recuo, espaçamento e novas linhas:\n\n```\n<?php\n\nnamespace App\\Controller\\\
    Usuario;\n\nuse App\\Usuario\\UsuarioTrait;\nuse App\\Contato\\ContatoTrait;\n\
    use App\\Endereco\\EnderecoTrait;\n\nclass UsuarioController\n{\n    use A, B,\
    \ C {\n        B::getUsuario insteadof A;\n        A::getContato insteadof B;\n\
    \        C::getEndereco as Endereco;\n    }\n}\n```\n\n### Regra 22\n\nA visibilidade\
    \ ou modificadores de acesso DEVEM ser definidos em todas as propriedades. Toda\
    \ propriedade que for definida deve possuir o modificador de acesso definido antes\
    \ do seu nome.\n\nO exemplo a seguir demonstra como é a aplicação dessa regra:\n\
    \n```\n<?php\n\nnamespace App\\Entity\\Usuario;\n\nclass Usuario\n{\n    private\
    \ $nome;\n\n    private $sobrenome;\n\n    protected static $sexo;\n\n    public\
    \ int $idade;\n\n    //Mais propriedades, métodos etc...\n}\n```\n\nPerceba que\
    \ todas as propriedades que foram definidas possuem antes de seu nome o modificador\
    \ de acesso, seja ele `private`, `protected` ou `public`.\n\nAgora vamos analisar\
    \ o mesmo exemplo, porém sem os modificadores de acesso:\n\n```\n<?php\n\nnamespace\
    \ App\\Entity\\Usuario;\n\nclass Usuario\n{\n    $nome;\n\n    $sobrenome;\n\n\
    \    static $sexo;\n\n    int $idade;\n}\n```\n\nAnalisando o código do exemplo\
    \ anterior, fica difícil de saber qual propriedade é privada, pública ou protegida.\n\
    \nNa verdade, quando o modificador de acesso não é definido na propriedade, um\
    \ erro chamado **PHP Parse error** será lançado, pois dentro de uma classe obrigatoriamente\
    \ as suas propriedades devem possuir o modificador de acesso, com exceção das\
    \ propriedades estáticas `static`, que automaticamente assumirão a visibilidade\
    \ pública.\n\n### Regra 23\n\nA palavra-chave `var` NÃO DEVE ser utilizada para\
    \ a definição de propriedades da classe. No momento de definir as propriedades\
    \ da classe, não utilize `var`, ou seja, o exemplo a seguir não é considerado\
    \ correto pela PSR-12:\n\n```\n<?php\n\nnamespace App\\Entity\\Usuario;\n\nclass\
    \ Usuario\n{\n    var $nome;\n\n    var $sobrenome;\n\n    var $sexo;\n\n    var\
    \ $idade;\n}\n```\n\nApesar de não ser correto, o código será interpretado corretamente,\
    \ e automaticamente todas as propriedades assumirão a visibilidade pública.\n\n\
    ### Regra 24\n\nA visibilidade DEVE ser declarada em todas as constantes se a\
    \ versão mínima do PHP em seu projeto for 7.1 ou superior, caso contrário, a regra\
    \ não se aplica.\n\nVamos analisar o exemplo a seguir, que demonstra a aplicação\
    \ dessa novidade:\n\n```\n<?php\n\nnamespace App\\Entity\\Usuario;\n\nclass Usuario\n\
    {\n    private const RG = '112341233';\n\n    protected const CPF = '111.222.333-44';\n\
    \n    public const NOME = 'Jhones S. Clementino';\n}\n```\n\nSe você já desenvolveu\
    \ utilizando as versões anteriores do PHP, sabe que ao definir as constantes não\
    \ era possível informar a visibilidade de cada uma, porque o próprio PHP assumia\
    \ automaticamente que cada constante definida possuía visibilidade pública.\n\n\
    ### Regra 25\n\nNÃO DEVE haver mais de uma propriedade por declaração. Se houver\
    \ a necessidade de declarar mais de uma propriedade, então defina-as de forma\
    \ separada, conforme demonstra o exemplo a seguir:\n\n```\n<?php\n\nnamespace\
    \ App\\Entity\\Usuario;\n\nclass Usuario\n{\n    private $nome;\n\n    private\
    \ $sobrenome;\n\n    protected static $sexo;\n\n    public int $idade;\n}\n```\n\
    \nEsse é o mesmo exemplo citado anteriormente. Como pode ser visto, cada declaração\
    \ de propriedade está definida de forma separada. Agora veremos a maneira incorreta\
    \ de se declarar as propriedades da classe:\n\n```\n<?php\n\nnamespace App\\Entity\\\
    Usuario;\n\nclass Usuario\n{\n    private $nome, $sobrenome, $sexo, $idade;\n\
    }\n```\n\nNesse exemplo, a declaração das propriedades está incorreta, porém,\
    \ se você testar o código funcionará perfeitamente. Mas lembre-se: o código não\
    \ estará em conformidade com a PSR-12.\n\n### Regra 26\n\nO nome das propriedades\
    \ NÃO DEVE iniciar com `_` (underscore) para indicar a visibilidade `private`\
    \ ou `protected`. Certamente você já deve ter visto em algum lugar que há programadores\
    \ que definem as propriedades privadas ou protegidas da classe com um `_` como\
    \ prefixo.\n\nIsso não é necessário, uma vez que o PHP fornece os modificadores\
    \ de acesso, basta você utilizá-los. Vamos analisar a maneira correta ao definir\
    \ as propriedades privadas ou protegidas de uma classe:\n\n```\n<?php\n\nnamespace\
    \ App\\Entity\\Usuario;\n\nclass Usuario\n{\n    private $nome;\n\n    private\
    \ $sobrenome;\n\n    protected static $sexo;\n\n    public int $idade;\n}\n```\n\
    \nPerceba que é o mesmo exemplo que já fizemos anteriormente e não há segredo\
    \ algum, o nome das propriedades está limpo e claro como deve ser. Agora vamos\
    \ analisar um exemplo considerado incorreto:\n\n```\n<?php\n\nnamespace App\\\
    Entity\\Usuario;\n\nclass Usuario\n{\n    private $_nome;\n\n    private $_sobrenome;\n\
    \n    protected static $_sexo;\n\n    public int $idade;\n}\n```\n\nNesse exemplo,\
    \ o modificador de acesso já informa o tipo de visibilidade da propriedade tornando\
    \ completamente inútil o uso do `_` (underscore).\n\n### Regra 27\n\nDEVE haver\
    \ um espaço entre a declaração de tipo e o nome da propriedade, já vimos isso\
    \ nos exemplos anteriores, mas se você ficou na dúvida, pode conferir mais uma\
    \ vez o código a seguir:\n\n```\n<?php\n\nnamespace App\\Entity\\Usuario;\n\n\
    class Usuario\n{\n    private $nome;\n\n    private $sobrenome;\n\n    protected\
    \ static $sexo;\n\n    public int $idade;\n}\n```\n\nPerceba que, após a declaração\
    \ do tipo `int`, temos um espaço e em seguida o nome da propriedade, que no caso\
    \ é `$idade`.\n\n### Regra 28\n\nTodos os métodos DEVEM ter a visibilidade definida.\
    \ Lembre-se de que a visibilidade torna o encapsulamento mais claro. Para facilitar,\
    \ vamos ao exemplo a seguir:\n\n```\n<?php\n\nnamespace App\\Entity\\Usuario;\n\
    \nclass Usuario\n{\n    private $nome;\n\n    public function getNome()\n    {\n\
    \        return $this->nome;\n    }\n\n    public function setNome($nome)\n  \
    \  {\n        $this->nome = $nome;\n    }\n}\n```\n\nPerceba que os métodos `getNome()`\
    \ e `setNome($nome)` possuem o modificador de acesso `public` definido, indicando\
    \ que eles possuem visibilidade pública.\n\nO tipo de visibilidade vai depender\
    \ do que será necessário expor ou não para o resto da aplicação. Agora vamos analisar\
    \ o exemplo considerado incorreto e que não está em conformidade com a PSR-12:\n\
    \n```\n<?php\n\nnamespace App\\Entity\\Usuario;\n\nclass Usuario\n{\n    private\
    \ $nome;\n\n    function getNome()\n    {\n        return $this->nome;\n    }\n\
    \n    function setNome($nome)\n    {\n        $this->nome = $nome;\n    }\n}\n\
    ```\n\nÉ importante ressaltar que o código do exemplo funciona e automaticamente\
    \ o PHP assumirá que os métodos possuem visibilidade pública, porém, não é válido\
    \ para a PSR-12.\n\n### Regra 29\n\nApós o nome do método NÃO DEVE existir um\
    \ espaço em branco. A chave de abertura do método DEVE estar em uma nova linha\
    \ e a chave de fechamento DEVE ficar logo após o corpo do método em uma nova linha.\n\
    \nApós o parêntese de abertura NÃO DEVE existir um espaço em branco, e antes do\
    \ parêntese de fechamento também NÃO DEVE haver um espaço em branco."
