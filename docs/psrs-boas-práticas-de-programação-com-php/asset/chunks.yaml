- raw: "Você pode definir um `array` de arquivos, mas a implementação da especificação\
    \ deve agregar todas as informações relacionadas ao arquivo de acordo com o índice\
    \ fornecido, isso porque `$_FILES` acaba saindo da sua estrutura convencional\
    \ em alguns casos. Como os dados dos arquivos enviados são derivados de `$_FILES`\
    \ ou do corpo do pedido, o método `withUploadedFiles()` também está disponível\
    \ na interface `Psr\\Http\\Message\\UploadedFileInterface`, permitindo a delegação\
    \ da padronização para um outro processo. Além disso, a interface disponibiliza\
    \ métodos que garantem que as operações funcionarão independentemente do ambiente:\n\
    \n*   O método `moveTo($targetPath)` é disponibilizado como uma alternativa recomendada\
    \ e segura para realizar chamadas através do método `move_uploaded_file()` diretamente\
    \ no arquivo temporário. As implementações vão detectar a operação correta para\
    \ ser utilizada conforme o ambiente.\n\n*   O método `getStream()` retornará uma\
    \ instância de `Psr\\Http\\Message\\StreamInterface`. Em ambientes que não sejam\
    \ SAPI. A proposta é realizar uma análise dos arquivos de upload individuais em\
    \ `php://temp`. Em alguns casos, o arquivo de upload não está presente, portanto,\
    \ o método `getStream()` é garantido para manter a funcionalidade independentemente\
    \ do ambiente.\n\n## 8.2 Interfaces\n\nApós a passagem por toda a PSR-7, não podíamos\
    \ deixar de especificar as interfaces que fazem parte desse pacote, então vamos\
    \ conferi-las a seguir:\n\n### `Psr\\Http\\Message\\MessageInterface`\n\n```\n\
    <?php\n\nnamespace Psr\\Http\\Message;\n\ninterface MessageInterface\n{    \n\
    \    public function getProtocolVersion();\n    public function withProtocolVersion($version);\n\
    \    public function getHeaders();\n    public function hasHeader($name);\n  \
    \  public function getHeader($name);\n    public function getHeaderLine($name);\n\
