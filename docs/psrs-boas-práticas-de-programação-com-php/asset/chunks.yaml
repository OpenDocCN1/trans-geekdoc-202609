  trans: "\n我们到达了 PSR-1 的最后，它向我们展示了一些必须遵循的规则，以便我们的代码更具可读性并符合开发规范。这不是一个复杂的 PSR，但值得关注它的规则，以便你能够在代码中更准确、更高效地应用它们。\n\
    \n在接下来的章节中，我们将讨论 PSR-2，它涉及源代码的可读性规则，所以，让我们开始吧！\n\n# 第 3 章\n\n## PSR-2 (编码风格指南)\
    \ - 第一部分\n\n你是否厌倦了看着代码时必须花时间进行缩进，并将所有内容放在它们应在的位置以提高理解？有了这个 PSR，你的问题就可以结束了。PSR-2\
    \ 的出现是为了让开发者的代码编写和可读性变得更加简单快捷。\n\n在接下来的节中，我们将看到具体的规则、概念以及如何将它们应用到你的项目中，以获得更美、更易读的代码。\n\
    \n> **重要信息**\n> 由于 PHP 中不断出现新功能，PSR-2 已经被**废弃**；但不用担心，替代者是 **PSR-12**，我们将在本书的后续部分介绍它。你可以继续阅读\
    \ **PSR-2**，因为其中的许多内容在 **PSR-12** 中被重用或扩展了，你可以了解它们之间的差异以及针对 PHP 7 的特定特性。\n\n###\
    \ 3.1 规则\n\n在本节中查看此 PSR 的一些规则和特征。\n\n### 规则 1\n\nPHP 代码**必须**遵循 PSR-1 (`Basic\
    \ Code Standard`) 中建立的标准。由于它是 PSR-1 的扩展，显然在应用 PSR-2 之前，必须遵循其中呈现的标准。\n\n### 规则\
    \ 2\n\nPHP 文件**必须**采用 UNIX 行结束符标准。你知道可用的行结束有哪些吗？如果不知道，请看下方：\n\n- **CRLF**: 回车+换行，Unicode\
    \ 字符 `D` + `000A` `000`\n- **LF**: 换行，Unicode 字符 `000A`\n- **NEL**: 下一行，Unicode\
    \ 字符 `0085`\n- **LS**: 行分隔符，Unicode 字符 `2028`\n- **PS**: 段落分隔符，Unicode 字符 `2029`\n\
    \nPSR-2 采用的 UNIX 标准是 `LF`。通常 IDE 已经配置为 UNIX 标准，但可以根据所选的 IDE 轻松进行更改。\n\n### 规则\
    \ 3\n\nPHP 代码**必须**使用 4 个空格缩进，而不是 TAB。这不是一个复杂的规则，只需注意并避免使用 TAB 的习惯即可。某些 IDE 已经配置为按下\
    \ TAB 键产生 4 个空格，但值得检查一下，以确保你的代码不违反 PSR-2 规范。这可以很不费力地配置。\n\n### 规则 4\n\n仅包含 PHP\
    \ 的文件**必须**省略结束标签。这起初看起来可能很奇怪，但确实，如果省略了结束标签 (`?>`)，你的 PHP 脚本也不会停止运行。该规则不适用于包含\
    \ HTML + PHP 文件。为了方便理解，我们来看下面的示例，它展示了应用此规则的正确方法：\n\n```php\n<?php\nclass Usuario\n\
    {\n    private $nome;\n\n    public function __construct($nome)\n    {\n     \
    \   $this->nome = $nome;\n    }\n}\n```\n\n注意，结束标签 (`?>`) 被省略了，这不会影响代码的运行。现在我们分析一个省略标签会导致代码错误的示例：\n\
    \n```php\n<?php\n$nome = 'Jhones S. Clementino';\n\n<html>\n    <head>\n     \
    \   <title>Teste</title>\n    </head>\n    <body>\n        <h1>Olá, <?php echo\
    \ $nome</</span>!</h1>\n    </body>\n</html>\n```\n\n与之前的示例不同，如果从变量 `$nome` 声明之后没有结束标签，那么省略\
    \ PHP 结束标签 (`?>`) 将导致错误。这是因为该文件并不仅仅包含 PHP 代码。\n\n### 规则 5\n\n仅包含 PHP 代码的文件**必须**在末尾留有一个空行。在应用了所有逻辑后，应该存在一个空行。\n\
    \n### 规则 6\n\n代码行的最大长度**必须**为 120 个字符。自动样式检查器**必须**发出警告，但**不应**显示错误。\n\n代码行**不应**超过\
    \ 80 个字符。超过 80 个字符的代码行**必须**折分到后续的最多 80 个字符的行中。\n\n这个解释听起来很奇怪，但非常有道理。在遗留系统中，经常有长度超过\
    \ 1000 个字符的——相信我，这不是夸张！我工作过这类系统，维护这类代码非常困难。\n\n因此，请注意每 80 个字符就进行换行以保持其可读性；如果无法做到，你还有\
    \ 120 个字符的限制。\n\n这不是一个错误，但如果你想遵循 PSR-2 标准并保持你的良好实践，那么注意这一额外规则是非常重要的，好吗？\n\n###\
    \ 规则 7\n\n包含内容的行**不应**在内容末尾留有空格。\n\n```php\n\n```\n\n```\n\n### 规则 8\n\n为了方便解释代码，**可以**添加空行。你可以添加空行来使代码的解释更易理解。我们来看来看该规则应用的简短示例：\n\
    \n```php\n<?php\n\nclass Usuario \n{\n    private $nome;\n\n     private $idade;\n\
    \n     private $sexo;\n\n    public function __construct($nome, $idade, $sexo)\n\
    \    {\n          $this->nome = $nome;\n         $this->idade = $idade;      \
    \   \n\n         if ($sexo == 'M') {\n            $this->sexo = 'Masculino';\n\
    \        } elseif ($sexo == 'F') {\n            $this->sexo = 'Feminino';\n  \
    \      }\n    }\n}\n```\n\n看应用了换行后代码变得变得多易读。现在看下面这个没有换行的示例：\n\n```php\n<?php\n\
    \nclass Usuario \n{\n    private $nome;\n\n     private $idade;\n\n     private\
    \ $sexo;\n\n    public function __construct($nome, $idade, $sexo)\n    {\n   \
    \       $this->nome = $nome;\n         $this->idade = $idade;         \n\n   \
    \      if ($sexo == 'M') {\n            $this->sexo = 'Masculino';\n        }\
    \ elseif ($sexo == 'F') {\n            $this->sexo = 'Feminino';\n        }\n\
    \    }\n}\n```\n\n### 规则 9\n\n**不应**在同一行内有多个声明。每个变量声明都应该在新的一行中。定义了一个变量？那么跳到行定义下一个变量。\n\
    \n```php\n<?php\n$nome = 'Jhones';\n$sobrenome = 'S. Clementino';\n```\n\n###\
    \ 规则 10\n\n关键字和常量 `true`、`false` 以及 `null` **必须**用小写字母。\n\n### 规则 11\n\n在定义 namespace\
    \ 之后，**必须**有一个空行。当你定义一个 namespace 时，在继续编写代码之前应该有一个空行。\n\n```php\n<?php\n\nnamespace\
    \ App\\Entity\\Usuario;\n\nclass Usuario\n{\n    //代码\n}\n```\n"
