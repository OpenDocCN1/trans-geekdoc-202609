    \ (\n            $atualizado, \n            $usuario \n        ) use (\n     \
    \       $id,\n            $dados\n        ): bool {\n            //Código\n  \
    \      }        \n    }\n}\n```\n\nPerceba o tipo de retorno definido na `closure`,\
    \ no caso `bool`. Existe um espaço após os dois pontos `:` e antes da chave de\
    \ abertura `{` da `closure`.\n\n### Regra 43\n\nListas de parâmetros e listas\
    \ de variáveis PODEM ser divididas em várias linhas, sendo que cada linha subsequente\
    \ é recuada uma vez. Ao fazer isso, o primeiro item da lista DEVE estar na próxima\
    \ linha e DEVE haver apenas um parâmetro ou variável por linha.\n\nQuando a lista\
    \ final (seja de parâmetros ou variáveis) é dividida em várias linhas, o parêntese\
    \ de fechamento `)` e a chave de abertura `{` DEVEM ser colocados juntos em sua\
    \ própria linha, com um espaço entre eles.\n\nA seguir vamos analisar exemplos\
    \ que demonstram a aplicação dessa regra:\n\n```\n<?php\n\n$closureSemVariaveis\
    \ = function (\n    $param1,\n    $param2,\n    $param3\n) {\n   // Código\n};\n\
    \n$closureSemParametroEComVariaveis = function () use (\n    $var1,\n    $var2,\n\
