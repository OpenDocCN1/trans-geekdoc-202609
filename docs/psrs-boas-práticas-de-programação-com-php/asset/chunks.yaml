- raw: "```\n    <?php\n\n    namespace App\\Middleware\\Authorization\n\n    use\
    \ Psr\\Http\\Message\\RequestInterface;\n\n    class AuthorizationMiddleware\n\
    \    {\n        private $request;\n\n        public function __construct(RequestInterface\
    \ $request)\n        {\n            $this->request = $request->withMethod('OPTIONS')\n\
    \                ->withRequestTarget('*')\n                ->withUri(new Uri('https://www.php-fig.org/'));\n\
    \        }\n    }\n```\n\nO resultado obtido dessa alteração seria semelhante\
    \ ao mostrado a seguir:\n\n```\nOPTIONS * HTTP/1.1\n```\n\nCaso necessário, o\
    \ cliente HTTP pode utilizar o URL efetivo obtido através do método `getUri()`\
    \ para definir o protocolo, o hostname e a porta a ser utilizada.\n\nO cliente\
    \ HTTP DEVE ignorar os valores contidos nos métodos `getPath()` e `getQuery()`\
    \ presentes na interface `Psr\\Http\\Message\\UriInterface` e utilizar o valor\
    \ obtido através do método `getRequestTarget()`, que por padrão concatena os valores\
    \ obtidos nos métodos anteriormente citados (`getPath()` e `getQuery()`).\n\n\
    Os clientes que optarem por não fazer a implementação de uma ou mais das 4 formas\
    \ de pedido-alvo, DEVERÃO, mesmo assim, utilizar o método `getRequestTarget()`.\n\
    \nEsses clientes DEVEM rejeitar as metas de solicitação porque eles não suportam\
    \ e NÃO DEVEM retroceder nos valores obtidos através do método `getUri()`.\n\n\
    A interface `Psr\\Http\\Message\\RequestInterface` disponibiliza métodos para\
    \ recuperar a requisição ou criar uma nova instância com a requisição fornecida.\n\
    \nPor padrão, caso o destino da solicitação não seja especificamente composto,\
    \ então o método `getRequestTarget()` retornará o formulário de origem do URI\
    \ composto, ou `/` se nenhum URI for composto.\n\nO método `withRequestTarget($requestTarget)`\
    \ é responsável por criar uma nova instância com a solicitação de destino especificada,\
    \ permitindo que os desenvolvedores criem mensagens de requisição que possam representar\
    \ as outras três formas de requisição de destino (formulário absoluto, formulário\
    \ de autoridade e formato asterisco).\n\nQuando utilizada, a instância de URI\
    \ composta ainda pode ser utilizada, principalmente em clientes que requerem a\
    \ criação da conexão com o servidor.\n\n### Regra 5\n\n**Requisições do lado do\
    \ servidor** - A interface `Psr\\Http\\Message\\RequestInterface` fornece uma\
    \ representação geral de uma requisição de uma mensagem HTTP, porém essas requisições\
    \ precisam de um tratamento adicional do lado do servidor.\n\nO processamento\
    \ do lado do servidor precisa levar em consideração a CGI e ainda a abstração\
    \ do PHP por meio da extensão de CGI.\n\nO PHP fornece uma simplificação em torno\
    \ do empacotamento de entrada por meio de variáveis superglobais, como:\n\n* \
    \  **`$_COOKIE`** - Desserializa e concede acesso simplificado aos `cookies` HTTP.\n\
    \n*   **`$_GET`** - Desserializa e concede acesso simplificado aos parâmetros\
    \ da string de consulta.\n\n*   **`$_POST`** - Desserializa e concede acesso simplificado\
    \ aos parâmetros enviados via método `POST` do HTTP.\n\n*   **`$_FILES`** - Provê\
    \ metadados que são serializados ao fazer uploads de arquivos.\n\n*   **`$_SERVER`**\
    \ - Concede acesso a variáveis de ambiente CGI/SAPI, que incluem o método de requisição,\
    \ o esquema de requisição, o URI de requisição e os cabeçalhos.\n\n> **O que é\
    \ SAPI (*Server Application Programming Interface*)?** Server Application Programming\
    \ Interface ou Interface de Programação de Aplicativos do Servidor em português,\
    \ como o próprio nome sugere, é uma interface de programação de aplicativos que\
    \ é fornecida pelo servidor, possibilitando que desenvolvedores estendam os recursos\
    \ do servidor.\n\n> \n\n> **O que é CGI (*Common Gateway Interface*)?** Common\
    \ Gateway Interface ou Interface Comum de Porta de Entrada em português, é uma\
    \ tecnologia que permite a geração de páginas dinâmicas através de parâmetros\
    \ enviados pelo navegador a scripts que estão armazenados no servidor. Os scripts\
    \ CGI interpretam os parâmetros, realizam o processamento e, por fim, geram a\
    \ página.\n\nA interface `Psr\\Http\\Message\\ServerRequestInterface` estende\
    \ a interface `Psr\\Http\\Message\\RequestInterface` para que seja possível obter\
    \ uma abstração envolvendo essas variáveis superglobais, ajudando a reduzir o\
    \ acoplamento junto a elas pelos clientes.\n\nAlém disso, incentiva e promove\
    \ a capacidade de testar a solicitação do cliente. A solicitação do servidor fornece\
    \ uma propriedade adicional chamada `attributes` para permitir aos clientes a\
