    \ \n\n# ISBN\n\nImpresso e PDF: 978-85-7254-030-8\n\nEPUB: 978-85-7254-031-5\n\
    \nMOBI: 978-85-7254-032-2\n\n> Caso você deseje submeter alguma errata ou sugestão,\
    \ acesse [http://erratas.casadocodigo.com.br](http://erratas.casadocodigo.com.br).\n\
    \n# Agradecimentos\n\nPrimeiramente agradeço a Deus por ter me concedido forças\
    \ nos momentos mais difíceis em que pensei que não iria superar algumas dificuldades\
    \ da minha vida. Agradeço a minha esposa que me incentivou muito desde o começo\
    \ até o término desta obra. Também faço agradecimentos aos meus pais por terem\
    \ me proporcionado o melhor que puderam e também por terem feito de tudo para\
    \ que eu tivesse uma boa educação e pudesse avançar na escalada da vida.\n\nPor\
    \ fim, agradeço a todas as pessoas com quem trabalhei em todos esses anos favorecendo\
    \ e muito para a troca de conhecimentos e aprendizagem de novas tecnologias e\
    \ conceitos.\n\n# Sobre o autor\n\nEu me chamo Jhones dos Santos Clementino, sou\
    \ apaixonado por programação desde os 17 anos, quando descobri que os softwares,\
    \ games e sites eram desenvolvidos através de alguma linguagem de programação\
    \ - essa descoberta mudou minha vida. Comecei a me interessar por esses assuntos\
    \ cada vez mais porque achava incrível uma sequência de código fazer algo tão\
    \ útil e interessante como os jogos, por exemplo. Isso é fascinante!\n\nSou formado\
    \ em Ciência da Computação pela Universidade Paulista - UNIP e trabalho com desenvolvimento\
    \ de sistemas WEB desde 2009 quando ocorreu meu primeiro contato com o PHP. Desde\
    \ aquela época fui me dedicando a aprender mais e mais com cursos online, tutoriais,\
    \ livros e apostilas. Meu foco tem sido a Web porque são tecnologias que estão\
    \ em constante evolução.\n\nTambém sou o autor do livro: *Zend Expressive e PHP\
    \ 7: Uma união poderosa para a criação de APIs*, publicado pela editora Casa do\
    \ Código.\n\nQuando possuo um tempo livre gosto de fazer alguma coisa que tire\
    \ a minha atenção do mundo virtual por algum tempo, então gosto de sair com a\
    \ minha mulher, desenhar e até mesmo cantar (vamos deixar isso para uma outra\
    \ hora, OK? Rs). Bom, meu amigo, esse é um resumão de quem sou eu.\n\n# Prefácio\n\
    \nHoje em dia, o número de aplicações disponíveis é absurdamente grande, e assim\
    \ como é o número de aplicações, também é a quantidade de códigos.\n\nPorém, será\
    \ que esses códigos são bem escritos? Será que qualquer desenvolvedor consegue\
    \ dar manutenção sem dificuldades? A resposta para essas perguntas é que depende\
    \ muito da equipe que desenvolveu, depende muito das regras de cada linguagem\
    \ de programação.\n\nNão existe no mundo um meio de padronizar como um desenvolvedor\
    \ deve pensar, para que os códigos sejam escritos de forma padrão tanto em lógica,\
    \ quanto em regras de formatação.\n\nEm PHP não é diferente, basta você trabalhar\
    \ em alguma aplicação legada que já está em funcionamento desde os primórdios\
    \ de uma empresa, que você verá o quão assombroso é o código em sua frente.\n\n\
    Neste livro, vamos abordar as boas práticas de programação com o PHP utilizando\
    \ as PSRs (*PHP Standards Recommendations*), e veremos os mais variados tipos\
    \ de conceitos e como aplicá-los em nosso código.\n\nEste livro é indicado para\
    \ todos os tipos de desenvolvedores desde os estagiários, estudantes, ao mais\
    \ experientes, portanto, não é necessário ter conhecimento avançado em PHP, mas\
    \ é importante conhecer o básico da linguagem e de Programação Orientada a Objetos.\
    \ O conhecimento básico de ambos é indispensável pois eles serão utilizados com\
    \ frequência.\n\nCaso você possua dúvidas, críticas, sugestões ou correções, poderá\
    \ entrar em contato através do e-mail: **jhones.developer@gmail.com** ou através\
    \ do LinkedIn: [https://www.linkedin.com/in/jhones-dos-santos-clementino-91a90256/](https://www.linkedin.com/in/jhones-dos-santos-clementino-91a90256/).\n\
    \nNo decorrer deste livro vamos abordar diversas PSRs, desde as que cuidam da\
    \ formatação do código até as que cuidam de maiores complexidades como troca de\
    \ mensagens HTTP, logs, cache etc.\n\nEntão, sem desanimar, siga em frente e vamos\
    \ nessa!\n\nCapítulo 1 \n\n# Introdução\n\nSe você já é um desenvolvedor que possui\
    \ um certo nível de experiência, com certeza já se deparou com códigos mal escritos,\
    \ mal indentados, códigos horrendos que fazem até mesmo você questionar a sua\
    \ própria sanidade mental e ficar se perguntando: como é que isso está funcionando\
    \ ainda? Funciona mesmo? Não pode ser... Pois é, meu amigo, eu digo, pode sim,\
    \ e bem-vindo ao mundo digital onde certezas e incertezas tomam os seus pensamentos\
    \ durante o processo de reconhecimento de códigos criados por mentes maquiavélicas.\n\
    \nSe você já passou horas e até mesmo dias tentando entender o impossível, então\
    \ você já sabe o quanto é difícil dar manutenção em um código desse tipo, totalmente\
    \ fora de padrão, sem ter explicação lógica para o monstro à sua frente. Acontece\
    \ que em PHP até um tempo atrás não havia um grupo focado em definir padrões e\
    \ regras que deveriam ser seguidas para que o código ficasse o mais legível e\
    \ padronizado possível. Felizmente, em 2009 ocorreu o surgimento de um abençoado\
    \ grupo chamado **PHP-FIG (Framework Interop Group)**.\n\nO PHP-FIG é um grupo\
    \ focado em definir padrões para o PHP. Em outras palavras, o grupo é responsável\
    \ por criar padrões e regras em comum que possam ser utilizados em qualquer tipo\
    \ de projeto em PHP. Regras de carregamento de classes (`autoloader`), de formatação\
    \ do código-fonte, regras de log, dentre muitas outras que veremos mais adiante\
    \ neste livro.\n\nFoi então criado o que chamamos de **PSR** (*PHP Standard Recommendation*\
    \ ou Padrão Recomendado para PHP, em português), que são especificações que foram\
    \ definidas pelos membros que fazem parte do PHP-FIG. São membros como Zend Framework,\
    \ Symfony, Slim, Composer e muitos outros que participam de projetos diferentes\
    \ para chegar a soluções concisas que ajudam todos os desenvolvedores PHP - isso\
    \ sem dúvidas!\n\nÉ importante conhecer que o PHP-FIG define algumas palavras-chaves\
    \ dentro das PSRs que servem como uma identificação no projeto. São elas:\n\n\
    *   **MUST** - DEVE\n\n*   **MUST NOT** - NÃO DEVE\n\n*   **REQUIRED** - OBRIGATÓRIO\n\
    \n*   **SHALL** - TEM QUE\n\n*   **SHALL NOT** - NÃO TEM QUE\n\n*   **SHOULD**\
    \ - DEVERIA\n\n*   **SHOULD NOT** - NÃO DEVERIA\n\n*   **RECOMMENDED** - RECOMENDADO\n\
    \n*   **MAY** - PODE\n\n*   **OPTIONAL** - OPCIONAL\n\nNão se preocupe se você\
    \ não estiver entendendo para que servem essas palavras-chaves. Quando entrarmos\
    \ em cada PSR você entenderá.\n\nAgora que você já sabe que existe um grupo focado\
    \ em criar padrões para serem seguidos em PHP, está na hora de conhecermos todas\
    \ as PSRs disponíveis até o momento da escrita deste livro.\n\nCapítulo 2 \n\n\
    # PSR-1 (Basic Coding Standard)"
