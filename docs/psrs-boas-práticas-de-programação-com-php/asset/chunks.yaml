    \ (容器接口)\n\nPSR-11 规范了通过容器进行依赖注入的接口。目前许多框架都在使用它，一个很好的例子是 Zend Framework 和 Zend\
    \ Expressive。与 PSR-7 不同，该 PSR 非常简单且易用。\n\n## 9.1 规则\n\n接下来我们将了解描述 PSR-11 的元素，以及其规则和接口。\n\
    \n### 规则 1\n\n**输入标识符** - 输入标识符可以被视为唯一标识容器内项的字符序列。它本质上是不透明的字符串，因此调用者不应假设字符串的结构带有任何语义。\n\
    \n### 规则 2\n\n**读取容器** - `Psr\\Container\\ContainerInterface` 接口暴露了两个方法：`get()`\
    \ 和 `has()`。\n\n`get()` 方法只有一个参数，且该参数是强制的。该参数必须是标识符的字符串。\n\n该方法可以返回任何值，或者在标识符未被容器识别时抛出\
    \ `Psr\\Container\\NotFoundException` 异常。\n\n连续获取相同标识符必须返回相同的值。这意味着，如果你有一个名为 `user`\
    \ 的服务，并对其进行 1 次、2 次或 N 次调用，容器返回的值必须完全相同。\n\n`has()` 方法同样只有一个参数，即标识符，且该参数必须是字符串。如果标识符被容器识别，该方法应返回\
    \ `true`，否则返回 `false`。如果 `has()` 方法返回 `false`，那么 `get()` 方法必须抛出 `Psr\\Container\\\
    NotFoundException` 异常。\n\n### 规则 3\n\n**异常** - 直接由容器抛出的异常必须实现 `Psr\\Container\\\
    ContainerExceptionInterface` 接口。如果传递给 `get()` 方法的 ID 不，则必须抛出 `Psr\\Container\\\
    NotFoundException` 异常。\n\n### 规则 4\n\n"
