- raw: "Chegamos ao final da PSR-1, que mostra para nós algumas regras que devem ser\
    \ seguidas para que o nosso código fique mais legível e adequado para o desenvolvimento.\
    \ Não é uma PSR complexa, mas vale a pena atentar-se às regras dela, para que\
    \ você possa aplicá-las com mais precisão e eficácia em seus códigos.\n\nNo próximo\
    \ capítulo falaremos sobre a PSR-2 que trata das regras de legibilidade do código-fonte,\
    \ então vamos nessa!\n\nCapítulo 3 \n\n# PSR-2 (Coding Style Guide) - Parte I\n\
    \nEstá cansado de olhar um código e ter que ficar perdendo tempo fazendo a indentação\
    \ e colocando tudo em seu devido lugar para melhorar o seu entendimento? Com essa\
    \ PSR seus problemas podem acabar. A PSR-2 surgiu com o objetivo de tornar a escrita\
    \ e a legibilidade do código mais simples e fácil para os desenvolvedores.\n\n\
    Veremos na seção a seguir quais são as regras, quais são os conceitos e como aplicá-los\
    \ em seu projeto para que se obtenha um código mais bonito e legível.\n\n> **Informação\
    \ importante**\n\n> \n\n> A PSR-2 foi **descontinuada** devido a inúmeras funcionalidades\
    \ que foram surgindo no PHP; mas não se preocupe, a PSR substituta é a **PSR-12**\
    \ e a veremos mais adiante neste livro. Você pode continuar lendo a **PSR-2**\
    \ sem problemas, pois muitas coisas presentes nela foram reaproveitadas/estendidas\
    \ na **PSR-12** e você poderá conhecer as diferenças entre elas e as peculiaridades\
    \ específicas para o PHP 7.\n\n## 3.1 Regras\n\nConfira nesta seção algumas regras\
    \ e características dessa PSR.\n\n### Regra 1\n\nOs códigos PHP DEVEM seguir os\
    \ padrões estabelecidos na PSR-1 (*Basic Code Standard*). Por ser uma extensão\
    \ da PSR-1, obviamente deve-se seguir o padrão apresentado nela, antes de se aplicar\
    \ a PSR-2.\n\n### Regra 2\n\nArquivos PHP DEVEM possuir o padrão UNIX de terminação\
    \ de linha. Você sabe quais são as terminações de linhas disponíveis? Caso não,\
    \ veja a seguir:\n\n*   **CRLF**: retorno de carro + avanço de linha, Unicode\
    \ caracteres D + 000A 000\n\n*   **LF**: alimentação de linha, caracteres Unicode\
    \ 000A\n\n*   **NEL**: próxima linha, o caractere Unicode 0085\n\n*   **LS**:\
    \ separador de linha, caracteres Unicode 2028\n\n*   **PS**: separador de parágrafo,\
    \ caractere Unicode 2029\n\nO padrão UNIX adotado pela PSR-2 é o LF. Geralmente\
    \ as IDEs já vêm configuradas para o padrão UNIX, mas isso pode ser alterado facilmente,\
    \ dependendo da IDE escolhida.\n\n### Regra 3\n\nCódigos PHP DEVEM possuir indentação\
    \ com 4 espaços e não com TABs. Não é uma regra complexa, basta atentar-se e evitar\
    \ o costume de utilizar TABs. Algumas IDEs já vêm com o padrão de 4 espaços ao\
    \ teclar o TAB, mas vale conferir para que seu código não saia das conformidades\
    \ da PSR-2. Isso pode ser configurado sem muita dor de cabeça.\n\n### Regra 4\n\
    \nArquivos contendo apenas PHP DEVEM ter a TAG de fechamento omitida. Pode parecer\
    \ estranho no primeiro momento, mas sim, o seu script PHP não vai deixar de funcionar\
    \ se a TAG de fechamento (`?>`) for omitida. A regra não se aplica aos arquivos\
    \ contendo HTML + PHP. Para facilitar o entendimento, vamos ver o exemplo a seguir,\
    \ que demonstra a forma correta de aplicar essa regra:\n\n```\n<?php\nclass Usuario\n\
    {\n    private $nome;\n\n    public function __construct($nome)\n    {\n     \
    \   $this->nome = $nome;\n    }\n}\n```\n\nPerceba que a TAG de fechamento (`?>`)\
    \ foi omitida e isso não afeta o funcionamento do código. Agora vamos analisar\
    \ o exemplo em que a omissão da TAG ocasionará em erro no código:\n\n```\n<?php\n\
    $nome = 'Jhones S. Clementino';\n\n<html>\n    <head>\n        <title>Teste</title>\n\
    \    </head>\n    <body>\n        <h1>Olá, <?php echo $nome</span>!</h1>\n   \
    \ </body>\n</html>\n```\n\nDiferentemente do exemplo anterior, a omissão da TAG\
    \ de fechamento do PHP (`?>`) ocasionará erro se após a declaração da variável\
    \ `$nome` não houver a TAG de fechamento. Isso porque o arquivo não possui apenas\
    \ código PHP.\n\n### Regra 5\n\nArquivos contendo apenas código PHP DEVEM possuir\
    \ uma linha em branco ao seu final. Após toda a lógica aplicada, deverá existir\
    \ uma linha em branco.\n\n### Regra 6\n\nO comprimento máximo de uma linha de\
    \ código DEVE ser de 120 caracteres. Verificadores de estilo automatizado DEVEM\
    \ avisar, mas NÃO DEVEM exibir erro.\n\nAs linhas de código NÃO DEVEM ter mais\
    \ de 80 caracteres. Linhas de código mais longas DEVEM ser quebradas em várias\
    \ linhas subsequentes de no máximo 80 caracteres.\n\nPode parecer estranha a explicação,\
    \ mas faz todo o sentido. Em sistemas legados, principalmente, há linhas com mais\
    \ de 1000 caracteres de comprimento - acredite, não é exagero! Já trabalhei em\
    \ sistemas desse tipo e é complicado dar manutenção nesse tipo de código.\n\n\
    Portanto, atente-se para que a cada 80 caracteres você possa quebrar a linha de\
    \ modo que fique legível; caso não consiga, você ainda possui o limite de 120\
    \ caracteres.\n\nNão é um erro, mas se quiser seguir o padrão da PSR-2 e manter\
    \ suas boas práticas é muito importante atentar-se a mais esta regra, ok?\n\n\
    ### Regra 7\n\nLinhas que possuem conteúdo NÃO DEVEM possuir espaços em branco\
    \ ao final de seu conteúdo.\n\n```\n\n```\n\n### Regra 8\n\nPara facilitar a interpretação\
    \ do código, linhas em branco PODEM ser adicionadas. Você pode adicionar linhas\
    \ em branco para tornar a interpretação do código mais fácil. Vamos ver a seguir\
    \ um breve exemplo da aplicação dessa regra:\n\n```\n<?php\n\nclass Usuario \n\
    {\n    private $nome;\n\n     private $idade;\n\n     private $sexo;\n\n    public\
    \ function __construct($nome, $idade, $sexo)\n    {\n          $this->nome = $nome;\n\
    \         $this->idade = $idade;         \n\n         if ($sexo == 'M') {\n  \
    \          $this->sexo = 'Masculino';\n        } elseif ($sexo == 'F') {\n   \
    \         $this->sexo = 'Feminino';\n        }\n    }\n}\n```\n\nPerceba como\
    \ o código ficou legível com a aplicação das quebras de linha. Agora veja o exemplo\
    \ a seguir em que não existe quebra de linha na escrita da lógica:\n\n```\n<?php\n\
    \nclass Usuario \n{\n    private $nome;\n     private $idade;\n     private $sexo;\n\
    \    public function __construct($nome, $idade, $sexo)\n    {\n          $this->nome\
    \ = $nome;\n         $this->idade = $idade;         \n         if ($sexo == 'M')\
    \ {\n            $this->sexo = 'Masculino';\n        } elseif ($sexo == 'F') {\n\
    \            $this->sexo = 'Feminino';\n        }\n    }\n}\n```\n\nO código funciona\
    \ sem nenhum problema, mas perceba como fica um pouco estranho.\n\n### Regra 9\n\
    \nNÃO DEVE haver múltiplas declarações em uma única linha. Cada declaração de\
    \ variável deve ser feita em uma nova linha. Definiu uma variável? Então pule\
    \ uma linha para definir a próxima variável.\n\nVamos ver o exemplo a seguir que\
    \ demonstra a maneira considerada correta ao declarar uma variável seguindo o\
    \ padrão da PSR-2:\n\n```\n<?php\n$nome = 'Jhones';\n$sobrenome = 'S. Clementino';\n\
    ```\n\nEstá correto, do jeito que tem que ser, uma declaração por linha. Agora\
    \ veremos a maneira considerada incorreta:\n\n```\n<?php\n$nome = 'Jhones'; $sobrenome\
    \ = 'S. Clementino';\n```\n\nEste é um exemplo bem simples que não é considerado\
    \ correto pela PSR-2, então lembre-se de declarar uma variável, constante, função\
    \ etc. por linha.\n\n### Regra 10\n\nAs palavras-chaves e constantes `true`, `false`\
    \ e `null` DEVEM ser escritas com letras minúsculas. Simplesmente use-as com letras\
    \ minúsculas e não use variações como: `TRUE`, `FALSE`, `NULL` ou `True`, `False`,\
    \ `Null`, ou `TrUe`, `FaLsE`, `NuLl`.\n\n### Regra 11\n\nLogo após a definição\
    \ de um namespace, DEVE haver uma linha em branco. Quando você for definir um\
    \ namespace, deve haver uma linha em branco antes de dar continuidade no código.\
    \ Vamos a um exemplo para simplificar a explicação. O exemplo a seguir demonstra\
    \ a maneira considerada correta:\n\n```\n<?php\n\nnamespace App\\Entity\\Usuario;\n\
    \nclass Usuario\n{\n    //Código\n}\n```\n\nPerceba que logo após a definição\
    \ do namespace uma linha em branco foi adicionada antes de declarar a classe `Usuario`.\
    \ Agora veremos um exemplo da maneira considerada incorreta na definição do namespace:\n\
    \n```\n<?php\n\nnamespace App\\Entity\\Usuario;\nclass Usuario\n{\n    //Código\n\
    }\n```"
