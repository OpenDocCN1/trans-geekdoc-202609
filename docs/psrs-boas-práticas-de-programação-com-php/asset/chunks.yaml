    \ e a recuperação dos dados em cache, sendo que cada item do tipo `Cache\\CacheItemInterface`\
    \ armazenado em cache é gerado através de um objeto do tipo `Psr\\Cache\\CacheItemPoolInterface`,\
    \ responsável por qualquer configuração necessária e também por associar o objeto\
    \ a uma chave exclusiva.\n\nOs objetos `Psr\\Cache\\CacheItemInterface` DEVEM\
    \ ser capazes de armazenar e recuperar qualquer tipo de valor, conforme vimos\
    \ anteriormente.\n\nA aplicação NÃO DEVE realizar a chamada de itens diretamente,\
    \ eles só podem ser chamados a partir de um pool de objetos, através do método\
    \ `getItem()`.\n\nA aplicação NÃO DEVERIA assumir que um item criado por ela mesma\
    \ é compatível com um pool de objetos de outra biblioteca.\n\nVamos ver a seguir\
    \ o modelo dessa interface disponibilizado pelo site oficial da PSR:\n\n```\n\
    <?php\n\nnamespace Psr\\Cache;\n\ninterface CacheItemInterface\n{\n    public\
    \ function getKey();\n    public function get();\n    public function isHit();\n\
    \    public function set($value);\n    public function expiresAt($expiration);\n\
    \    public function expiresAfter($time);\n}\n```\n\n### `CacheItemPoolInterface`\n\
    \nPossui o objetivo de aceitar uma chave passada pela aplicação e retornar o objeto\
