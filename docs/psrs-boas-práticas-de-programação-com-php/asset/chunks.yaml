  trans: "\n\n```php\n<?php\nnamespace Psr\\Http\\Client;\n\nuse Psr\\Http\\Message\\\
    RequestInterface;\n\ninterface RequestExceptionInterface extends ClientExceptionInterface\n\
    {\n    public function getRequest(): RequestInterface;\n}\n```\n\n### `Psr\\Http\\\
    Client\\NetworkExceptionInterface`\n\n该接口负责在请求由于网络问题无法完成时抛出异常。\n\n```php\n<?php\n\
    namespace Psr\\Http\\Client;\n\nuse Psr\\Http\\Message\\RequestInterface;\n\n\
    interface NetworkExceptionInterface extends ClientExceptionInterface\n{\n    public\
    \ function getRequest(): RequestInterface;\n}\n```\n\n### 结语\n\n正如我们所看到的，这是一个非常直观的\
    \ PSR，它展示了我们如何拥有一个与 PSR-7 兼容的 `HTTP` 请求发送接收通用接口，使得库更具重用性，并大幅减少了依赖的数量。\n\n# 第 17\
    \ 章\n\n# PSR-17 (HTTP 工厂)\n\n`PSR-17` 定义了用于创建 PSR-7 定义的 `HTTP` 对象的接口，也就是说，`PSR-17`\
    \ 是一个 `HTTP Factory`（HTTP 工厂），为这些工厂提供接口。因此，`HTTP` 工厂必须为 PSR-7 提供的每种对象类型实现 `PSR-17`\
    \ 提供的接口。\n\n与之前的 PSR 不同，它没有包含一组需要遵循的规则，而是一组必须实现的接口。我们将在下一节中认识这些接口。\n\n## 17.1\
    \ 接口\n\n以下接口可以通过两种方式实现：合并在一个类中，或者在单独的类中实现。\n\n### `Psr\\Http\\Message\\RequestFactoryInterface`\n\
    \n该接口负责创建 `HTTP` 请求。\n\n```php\n<?php\nnamespace Psr\\Http\\Message;\n\nuse Psr\\\
    Http\\Message\\RequestInterface;\nuse Psr\\Http\\Message\\UriInterface;\n\ninterface\
    \ RequestFactoryInterface\n{\n    public function createRequest($method, $uri);\n\
    }\n```\n\n### `Psr\\Http\\Message\\ResponseFactoryInterface`\n\n该接口负责创建 `HTTP`\
    \ 响应。\n\n```php\n<?php\nnamespace Psr\\Http\\Message;\n\nuse Psr\\Http\\Message\\\
    ResponseInterface;\n\ninterface ResponseFactoryInterface\n{\n    public function\
    \ createResponse($code = 200, $reasonPhrase = '');\n}\n```\n\n### `Psr\\Http\\\
    Message\\ServerRequestFactoryInterface`\n\n该接口负责创建服务器请求。\n\n```php\n<?php\nnamespace\
    \ Psr\\Http\\Message;\n\nuse Psr\\Http\\Message\\ServerRequestInterface;\nuse\
    \ Psr\\Http\\Message\\UriInterface;\n\ninterface ServerRequestFactoryInterface\n\
    {\n    public function createServerRequest($method, $uri, array $serverParams\
    \ = []);\n}\n```\n\n### `Psr\\Http\\Message\\StreamFactoryInterface`\n\n该接口负责为请求和响应创建流。\n\
    \n```php\n<?php\nnamespace Psr\\Http\\Message;\n\nuse Psr\\Http\\Message\\StreamInterface;\n\
    \ninterface StreamFactoryInterface\n{\n    public function createStream($content\
    \ = '');\n    public function createStreamFromFile($filename, $mode = 'r');\n\
    \    public function createStreamFromResource($resource);\n}\n```\n\n此接口的实现在创建流式资源时必须使用临时流。推荐的方法如下所示代码所示：\n\
    \n```php\n<?php\n$resource = fopen('php://temp', 'r+');\n```\n\n### `Psr\\Http\\\
    Message\\UploadedFileFactoryInterface`\n\n该接口负责为已上传的文件创建流，即文件上传。\n\n```php<?php\n\
    namespace Psr\\Http\\Message;\n\nuse Psr\\Http\\Message\\StreamInterface;\nuse\
    \ Psr\\Http\\Message\\UploadedFileInterface;\n\ninterface UploadedFileFactoryInterface\n\
    {\n    public function createUploadedFile(\n        StreamInterface $stream,\n\
    \        int $size = null,\n        int $error = UPLOAD_ERR_OK,\n        string\
    \ $clientFilename = null,\n        string $clientMediaType = null\n    ): UploadedFileInterface;\n\
    }\n```\n\n### `Psr\\Http\\Message\\UriFactoryInterface`\n\n该接口负责为客户端和服务器请求创建 URI。\n\
    \n```php<?php\nnamespace Psr\\Http\\Message;\n\nuse Psr\\Http\\Message\\UriInterface;\n\
    \ninterface UriFactoryInterface\n{\n    public function createUri($uri = '');\n\
    }\n```\n\n### 结语\n\n尽管这个 PSR 并不大且没有规则定义，但上述描述接口具有创建 PSR-7 定义的 `HTTP` 对象的能力。在下一章中，我们将看到\
    \ PSR-18，它描述了发送和接收 `HTTP` 请求的接口。\n\n# 第 18 章\n\n# 结语\n\n正如我们在书中看到的，每个 PSR 都定义了一组规范并具有其特性。我们学习了如何通过\
    \ PSR-2 让代码更具可读性，如何通过 PSR-3 实现日志写入标准，还看到了如何通过 PSR-7 标准化我们的请求，以及许多可以让开发者生活更简单的良好实践。\n\
    \n最后，希望你喜欢这本书，并获得了关于良好实践的卓越知识。\n\n"
