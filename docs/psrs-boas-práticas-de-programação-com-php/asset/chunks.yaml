    # Capítulo 7


    # PSR-6 (Caching Interface)


    Fazer cache dos dados da aplicação se tornou cada vez mais necessário, porém há
    muitas maneiras de se fazer isso. Cada framework e/ou microframework possui uma
    forma diferente de fazer esse gerenciamento e uma das principais consequências
    disso é que o desenvolvedor tem que ficar se adaptando a cada novo modelo de definir
    o cache. No `Zend Framework` é de um jeito, no `Symfony` é de outro e por aí vai.


    Com o objetivo de acabar com esse problema, surgiu a `PSR-6` que visa definir
    um padrão para criação de cache e é exatamente isso que veremos a seguir.


    ## 7.1 Regras


    Confira nesta seção o conjunto de todas as regras e características que fazem
    parte dessa PSR.


    ### Regra 1


    **Chamando na aplicação** - A aplicação ou o código que utilizar os serviços de
    cache DEVERÁ implementar a interface padrão, caso contrário, a aplicação não saberá
    da existência do serviço de cache.


    Isso significa que, se a sua aplicação for implementar o cacheamento de dados
    seguindo esta `PSR`, então deverá ter uma classe que realizará a implementação
    da interface padrão de cache definida, que no caso é a interface `Psr\Cache\CacheItemPoolInterface`.


    ### Regra 2


    **Implementando na aplicação** - A aplicação é responsável por implementar o padrão
    estabelecido pela `PSR` com o objetivo de fornecer os serviços de cache para qualquer
    aplicação ou código de forma simples.


    A implementação DEVE prover classes que implementam as interfaces `Psr\Cache\CacheItemPoolInterface`
    e `Psr\Cache\CacheItemInterface`. A implementação das bibliotecas DEVE suportar
    ao menos a funcionalidade `TTL` (`Time To Live`).


    Isso significa que em uma biblioteca/aplicação ao menos a funcionalidade `TTL`
    deve ser suportada. Ela é basicamente obrigatória, já que define o tempo de vida
    de um item de cache.


    ### Regra 3


    **TTL (Time To Live)** - Cada item de cache possui o que chamamos de tempo de
    vida. Esse tempo de vida é a quantidade de tempo entre o momento em que esse item
    é armazenado e quando é considerado obsoleto.


    O `TTL` é definido por um número inteiro que representa o tempo em segundos ou
    por um objeto `DateInterval`.


    ### Regra 4


    **Expiração** - É o tempo definido para que o cache se torne obsoleto, geralmente
    é calculado adicionando o `TTL` (`Time To Live`) ao tempo em que um determinado
    objeto é armazenado.


    O tempo também pode ser adicionado através de um objeto `DateTime`. Por exemplo,
    um item de cache com um `TTL` de 300 segundos que foi armazenado às 09:00:00 terá
    um tempo de expiração em 09:05:00, ou seja, terá um tempo de 5 minutos antes de
    os dados em cache tornarem-se obsoleto.


    A aplicação PODE expirar um item armazenado em cache antes do tempo de expiração
    definido, porém DEVE tratar o item expirado.


    Se a aplicação não especificar um tempo, DEVE utilizar o tempo padrão.


    ### Regra 5


    **Chave** - É a chave que define o nome do item. A aplicação DEVE suportar caracteres
    `A-Z`, `a-z`, `0-9`, `_` e `.`.


    ### Regra 6


    **Ocorrência** - A aplicação solicita um item e o item de cache é encontrado,
    resultando no método `hit()`.


    ### Regra 7


    **Falha/Erro** - Ocorre quando a aplicação solicita um item e ele não é encontrado,
    ou está expirado.


    ### Regra 8


    **Adiado** - Um item de cache adiado indica que ainda não foi persistido.


    ### Regra 9


    A aplicação DEVE suportar todos os tipos de dados que possam ser serializados.
    Isso inclui:


    *   Strings

    *   Integers

    *   Floats

    *   Boolean

    *   Null

    *   Arrays

    *   Object (`serialize*(serialize()))


    ### Regra 10


    **Pool** - Representa uma coleção de itens em um sistema de cache, ou seja, basicamente
    é um repositório que contém todos os itens de cache.


    ### Regra 11


    **Itens** - Um item é representado pelo par chave/valor dentro de uma coleção
    de dados.

