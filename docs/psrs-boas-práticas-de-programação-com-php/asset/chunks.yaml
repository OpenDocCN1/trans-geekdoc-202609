- raw: "Está correto, do jeito que tem que ser, uma declaração por linha. Agora veremos\
    \ a maneira considerada incorreta:\n\n```\n<?php\n$nome = 'Jhones'; $sobrenome\
    \ = 'S. Clementino';\n```\n\nEste é um exemplo bem simples que não é considerado\
    \ correto pela PSR-12, então lembre-se de declarar uma variável, constante, função\
    \ etc. por linha.\n\n### Regra 9\n\nCódigos PHP DEVEM possuir indentação com 4\
    \ espaços e não com TABs. Não é uma regra complexa, basta atentar-se aos 4 espaços\
    \ e em vez do costume de utilizar TABs.\n\nAlgumas IDEs já vêm com o padrão de\
    \ 4 espaços ao teclar o TAB, mas vale conferir para que seu código não saia das\
    \ conformidades da PSR-12. Isso pode ser configurado sem muita dor de cabeça.\n\
    \n### Regra 10\n\nAs palavras-chaves, tipos reservados e constantes `true`, `false`\
    \ e `null` DEVEM ser escritas com letras minúsculas. Simplesmente use-as com letras\
    \ minúsculas e não use variações como: `TRUE`, `FALSE`, `NULL` ou `True`, `False`,\
    \ `Null`, ou `TrUe`, `FaLsE`, `NuLl`.\n\nQuaisquer novos tipos e palavras-chaves\
    \ adicionados em versões futuras do PHP DEVEM estar em minúsculas.\n\nÉ necessário\
    \ usar uma forma abreviada de palavras-chaves do tipo de dado, ou seja, `bool`\
    \ em vez de `boolean`, `int` em vez de `integer` etc.\n\n### Regra 11\n\nO cabeçalho\
    \ de um arquivo PHP pode consistir em vários blocos diferentes. Se o cabeçalho\
    \ estiver presente, cada um dos blocos a seguir DEVE ser separado por uma única\
    \ linha em branco e NÃO DEVE conter uma linha em branco.\n\nCada bloco DEVE estar\
    \ na ordem listada a seguir, mas os blocos que não são relevantes podem ser omitidos.\n\
    \n*   Tag de abertura `<?php` do PHP;\n\n*   Docblock `/** Descrição */` no nível\
    \ do arquivo;\n\n*   Uma ou mais declarações `declare()`;\n\n*   A definição do\
    \ `namespace` do arquivo;\n\n*   Uma ou mais instruções de importação `use` baseadas\
    \ em classes;\n\n*   Uma ou mais instruções de importação `use` baseadas em funções;\n\
    \n*   Uma ou mais instruções de importação `use` baseadas em constantes;\n\n*\
    \   O restante do código.\n\nQuando um arquivo contém HTML e PHP, qualquer uma\
    \ das seções descritas anteriormente ainda poderá ser utilizada. Nesse caso, eles\
    \ DEVEM estar presentes no topo do arquivo, mesmo que o restante do código consista\
    \ em uma tag de fechamento `?>` do PHP e, em seguida, uma mistura de HTML e PHP.\n\
    \nAs instruções de importação nunca DEVEM começar com uma barra invertida.\n\n\
    Vamos conferir um exemplo a seguir que ilustra a aplicação da sequência definida\
    \ pela PSR-12 citada anteriormente:\n\n```\n<?php\n\n/**\n * Descrição do arquivo\n\
    \ */\n\n declare(strict_types=1);\n\n namespace App\\Controller\\Usuario;\n\n\
    \ use App\\Controller\\{AbstractController as Abc, ControllerInterface, BaseController\
    \ as Base};\n use App\\Entity\\Usuario\n\n use function App\\Functions\\{functionA,\
    \ functionN, functionC};\n use function App\\Repository\\Functions\\insert;\n\n\
    \ use const App\\Controller\\{RESPONSE_JSON, RESPONSE_XML, RESPONSE_ERROR};\n\
    \ use const App\\Service\\{CONSTANT_A}\n\n/**\n *  Classe de exemplo\n */\n class\
    \ UsuarioController\n {\n     //Código...\n }\n```\n\nUau, perceba como tivemos\
    \ mudanças, se compararmos com a PSR-2. Uma delas é a importação de múltiplas\
    \ classes dentro de uma mesma instrução `use` através da utilização das chaves\
    \ `{}`. Se você recordar, na PSR-2 era permitido apenas uma importação por instrução\
    \ `use`.\n\nOutras evoluções foram com relação à importação de funções e constantes\
    \ da mesma maneira que importamos uma ou mais classes. Sem dúvidas, foi uma bela\
    \ evolução e que com certeza nos ajudará muito a manter o código com um padrão\
    \ bem definido.\n\n### Regra 12\n\nOs namespaces compostos com profundidade superior\
    \ a dois NÃO DEVEM ser utilizados. O exemplo a seguir demonstra a utilização máxima\
    \ de composição permitida:\n\n```\n<?php\n\nuse App\\Service\\{\n    Usuario\\\
    UsuarioService,\n    Contato\\ContatoService,\n    ServiceAbstract,\n}\n```\n\n\
    O exemplo a seguir não é permitido pela PSR-12:\n\n```\n<?php\n\nuse App\\Service\\\
    {\n    Usuario\\Admin\\UsuarioService,\n    Contato\\ContatoService,\n    ServiceAbstract,\n\
    }\n```\n\nNesse exemplo, a adição de mais um `subnamespace` no caso `Admin` não\
    \ é permitido, pois ultrapassa o nível máximo de profundidade permitido, que é\
    \ até dois níveis.\n\n### Regra 13\n\nSe desejar declarar tipos estritos em arquivos\
    \ contendo marcação HTML fora das TAGs de abertura `<?php` e fechamento `?>` do\
    \ PHP, a declaração DEVE estar na primeira linha do arquivo e incluir uma TAG\
    \ de abertura `<?php` do PHP, a declaração de tipos estritos e em seguida TAG\
    \ de fechamento `?>` do PHP.\n\nVamos conferir o exemplo a seguir que demonstra\
    \ a aplicação dessa regra:\n\n```\n<?php declare(strict_types=1) ?>\n<html>\n\
    <body>\n    <?php //Código PHP... ?>\n</body>\n</html>\n```\n\nInstruções `declare()`\
    \ NÃO DEVEM conter espaços e DEVEM ser declaradas exatamente da maneira a seguir:\
    \ `declare(strict_types=1)`. O ponto e vírgula no final da instrução é opcional.\n\
    \n### Regra 14\n\nAs declarações de bloco `declare` contendo o código a ser executado\
    \ são permitidas e DEVEM ser formatadas como demonstrado no exemplo a seguir.\
    \ Observe a posição das chaves e o espaçamento:\n\n```\n<?php\ndeclare(ticks=1)\
    \ {\n    // código...\n}\n```\n\n### Regra 15\n\nApós qualquer chave de fechamento,\
    \ NÃO DEVE haver nenhum comentário ou declaração na mesma linha.\n\nAo instanciar\
    \ uma nova classe, os parênteses DEVEM estar sempre presentes, mesmo quando não\
    \ houver parâmetros passados para o construtor.\n\nVamos ver o exemplo a seguir\
    \ que demonstra a aplicação dessa regra:\n\n```\n<?php\n\nnew Usuario();\n```\n\
    \n### Regra 16\n\nAs palavras-chaves `extends` e `implements` DEVEM ser declaradas\
    \ na mesma linha que contém o nome da classe.\n\nA chave de abertura `{` da classe\
    \ DEVE ser inserida em uma nova linha e NÃO DEVE ser precedida ou seguida por\
    \ uma linha em branco.\n\nA chave de fechamento `}` da classe também DEVE ser\
    \ inserida em uma nova linha logo após a definição do corpo da classe e NÃO DEVE\
    \ ser precedida ou seguida por uma linha em branco.\n\nVamos ver o exemplo a seguir,\
    \ que demonstra a aplicação dessa regra:\n\n```\n<?php\n\nnamespace App\\Controller\\\
    Usuario;\n\nuse App\\Controller\\ControllerAbstract;\nuse App\\Service\\UsuarioService;\n\
    \nclass UsuarioController extends ControllerAbstract implements \\Serializable,\
    \ \\Countable\n{\n    //Definição do corpo da classe...\n}\n```\n\n### Regra 17\n\
    \nQuando houver a necessidade de múltiplos `implements`, eles PODEM ser divididos\
    \ em múltiplas linhas, sendo que cada linha subsequente é recuada uma vez. Sempre\
    \ que fizer isso, o primeiro item da lista DEVE estar na próxima linha e DEVE\
    \ possuir somente uma interface por linha.\n\nSe você ainda nunca viu ou nunca\
    \ ouviu falar em uma classe implementando múltiplas interfaces, saiba que não\
    \ é incorreto e, sim, existem muitos projetos que, devido à complexidade, acabam\
    \ implementando esse tipo de lógica.\n\nVamos analisar o exemplo a seguir, que\
    \ demonstra a aplicação correta dessa regra:\n\n```\n<?php\n\nnamespace App\\\
    Controller\\Usuario;\n\nuse App\\Controller\\ControllerAbstract;\nuse App\\Service\\\
    UsuarioService;\n\nclass UsuarioController extends ControllerAbstract implements\
    \ \n    \\Serializable,\n    \\Countable\n{\n    //Definição do corpo da classe...\n\
    }\n```\n\nO exemplo demonstra com clareza exatamente o que a PSR-12 define, ou\
    \ seja, quando há múltiplas interfaces, cada interface deve estar em uma nova\
    \ linha.\n\n### Regra 18\n\nPara utilizar `Traits` e usufruir da herança vertical\
    \ dentro das classes, a instrução `use` DEVE ser declarada na próxima linha após\
    \ a chave `{` de abertura da classe.\n\nVeja o exemplo a seguir, que demonstra\
    \ a aplicação dessa pequena regra:\n\n```\n<?php\n\nnamespace App\\Controller\\\
    Usuario;\n\nuse App\\Usuario\\UsuarioTrait;\n\nclass UsuarioController\n{\n  \
    \  use UsuarioTrait;\n}\n```\n\n### Regra 19\n\nCada `Trait` a ser utilizada dentro\
    \ da classe DEVE ser incluída uma por linha, sendo que cada `Trait` DEVE ter a\
    \ sua própria declaração de uso `use`.\n\nVeja o exemplo a seguir para melhor\
    \ entendimento:"
