    \ do formato de serialização utilizado, permitindo que a aplicação serialize uma\
    \ resposta com links de hipermídia em um ou mais formatos.\n\n## 12.1 Regras\n\
    \nNesta seção vamos conhecer as regras que definem a `PSR-13`, mas antes precisamos\
    \ conhecer algumas características:\n\n**Links básicos** - Um link de hipermídia\
    \ consiste em: um `URI` que representa o recurso de destino que está sendo referenciado\
    \ e um relacionamento que define como o recurso de destino se relaciona com a\
    \ origem. Vários outros atributos do link podem existir dependendo do formato\
    \ utilizado.\n\n- **Instanciando um objeto** - Um objeto deve ser criado através\
    \ de um objeto.\n\n- **Serializador** - Uma aplicação que utiliza um ou mais objetos\
    \ `Link` e produz uma representação em algum formato.\n\n### Regra 1\n\nTodos\
    \ os links PODEM incluir zero ou mais atributos além do `URI` e do relacionamento.\
    \ Os valores comumente suportados são `hreflang`, `title` e `type`.\n\n### Regra\
    \ 2\n\nSerializadores PODEM omitir atributos em um objeto caso haja necessidade,\
    \ porém, os serializadores DEEM codificar todos os atributos fornecidos, a menos\
    \ que seja impedido pela definição de algum formato.\n\n### Regra 3\n\nCaso um\
    \ determinado atributo não possa ter múltiplos valores em seu contexto, os serializadores\
    \ DEEM utilizar o primeiro valor fornecido e ignorar todos os valores subsequentes.\
    \ Se o atributo possuir um valor booleano `true`, os serializadores PODEM usar\
    \ formas abreviadas, se apropriadas e suportadas por algum formato de serialização.\n\
    \n### Regra 4\n\nCaso o atributo possua um valor booleano `false`, os serializadores\
    \ DEEM omitir o atributo, a menos que o significado semântico do resultado seja\
    \ alterado. Esta regra se aplica se, e somente se, o atributo for booleano `false`,\
    \ ou seja, o valor 0 utilizado para `false` não é válido.\n\n### Regra 5\n\nRelacionamentos\
    \ de links são definidos como string e são simplesmente uma palavra-chave no caso\
    \ de uma relação definida publicamente ou um `URI` absoluto no caso de relações\
    \ privadas. Caso uma palavra-chave simples seja utilizada, DEVE corresponder a\
    \ um registro do `IANA (http://www.iana.org/assignments/link-relations/link-relations.xhtml)`.\
    \ Opcionalmente, o registro contido em `http://microformats.org/wiki/existing-rel-values`\
    \ PODE ser utilizado, mas pode não ser válido em todos os contextos.\n\n### Regra\
    \ 6\n\nUm relacionamento que não esteja definido em um dos registros citados anteriormente\
    \ ou em um registro público é considerado privado, isto é, é específico de uma\
    \ determinada aplicação. Essas relações DEVEM utilizar um `URI` absoluto.\n\n\
    ### Regra 7\n\nModelos de link são um padrão para um `URI` que deve ser preenchido\
    \ com valores enviados por um cliente. Alguns formatos de hipermídias suportam\
    \ modelos de links, enquanto outros não, e podem ter uma maneira diferente de\
    \ denotar que um link é um modelo.\n\nUm serializador que não suporta modelos\
    \ de `URI` DEVE ignorar quaisquer links modelados que encontrar.\n\n### Regra\
    \ 8\n"
  trans: "\n上一个例子恰恰演示了不应该做的事情。不要这样缩进代码，即使它可以运行。如果你这样做，你的代码将不符合 `PSR-12`。\n\n### 规则\
    \ 42\n\n如果存在返回类型，则必须遵循与普通函数和方法相同的规则；如果存在 `use` 关键字，冒号 `:` 必须紧跟在括号内的使用列表之后，两个字符之间不能有空格。下面的示例演示了如何正确应用这一规则：\n\
    \n```php\n<?php\n\nnamespace App\\Controller\\Usuario;\n\nclass UsuarioController\n\
    {        \n    public function updateAction($id, array $dados)\n    {        \
    \ \n        $closure = function (\n            $atualizado, \n            $usuario\
    \ \n        ) use (\n            $id,\n            $dados\n        ): bool {\n\
    \            //代码\n        }        \n    }\n}\n```\n\n请注意 `closure` 中定义的返回类型，在本例中为\
    \ `bool`。冒号 `:` 之后和 `closure` 的起始大括号 `{` 之前有一个空格。\n\n### 规则 43\n\n参数列表和变量列表可以被拆分为多行，后续每一行都缩进一次。这样做时，列表的第一个项必须位于下一行，并且每行只能有一个参数或变量。\n\
    \n当最终列表（无论是参数列表还是变量列表）被拆分为多行时，闭合括号 `)` 和起始大括号 `{` 必须放在单独的一行中，它们之间有一个空格。\n\n接下来我们将分析演示应用此规则的示例：\n\
    \n```php\n<?php\n\n$closureSemVariaveis = function (\n    $param1,\n    $param2,\n\
    \    $param3\n) {\n   // 代码\n};\n\n$closureSemParametroEComVariaveis = function\
    \ () use (\n    $var1,\n    $var2,\n    $var3\n) {\n   // 代码\n};\n\n$closureComParametrosEVariaveis\
    \ = function (\n    $param1,\n    $param2,\n    $param3\n) use (\n    $var1,\n\
    \    $var2,\n    $var3\n) {\n   // 代码\n};\n\n$closureComParametrosEUmaVariavel\
    \ = function (\n    $param1,\n    $param2,\n    $param3\n) use ($var1) {\n   //\
    \ 代码\n};\n\n$closureComUmParametroEVariasVariaveis = function ($param1) use (\n\
    \    $var1,\n    $var2,\n    $var3\n) {\n   // 代码\n};\n```\n\n注意每个种情况是如何进行缩进和间距的。接下来来看一个示例，在该示例中，当闭合直接用于函数调用或作为方法的参数时，格式规则同样适用：\n\
    \n```php\n<?php\n\n$object->method(\n    $param1,\n    function ($param2) use\
    \ ($var1) {\n        // 代码\n    },\n    $param3\n);\n```\n\n### 规则 44\n\n匿名类必须遵循与我们之前看到的闭包（closures）相同的指南和原则。让我们来看定义符合\
    \ `PSR-12` 的匿名类的示例：\n\n```php\n<?php\n\n$instance = new class {};\n```\n\n###\
    \ 规则 45\n\n起始大括号 `{` 可以与类关键字在同一行，只要接口列表尚未结束。如果接口列表结束，大括号必须放在最后一个接口之后的下一行。\n\n\
    我们将通过下面的示例了解该规则在实践中的应用：\n\n```php\n<?php\n\n// 起始大括号在同一行\n$instance = new class\
    \ extends AbstractClass implements \\HandleableInterface {\n    //代码\n};\n\n//\
    \ 起始大括号在下一行\n$instance = new class extends AbstractClass implements\n    \\ArrayAccess,\n\
    \    \\Countable,\n    \\Serializable\n{\n    //代码\n};\n```\n\n注意间距和缩进遵循了之前在该\
    \ PSR 中见过的原则。\n\n### 结论\n\n我们来到了 `PSR-12` 的结尾。正如在该 PSR 中所示，有很多规则和条件必须遵守，以确保代码符合规范。我们应用的空格和缩进规则清楚地表明，代码变得更容易理解了。\n\
    \n起初代码看起来可能很奇怪，但随着时间的推移，你会习惯的，甚至记住每条规则是如何应用的。让我们继续前进，了解 `PSR-13` 及其规则。\n\n第 12\
    \ 章\n\n# PSR-13 (链接定义接口)\n\n此 PSR 规定了一种简单且通表示超媒体链接的方法，无论使用何种序列化格式，允许应用程序以一种或多种格式序列化带有超媒体链接的响应。\n\
    \n## 12.1 规则\n\n在本节中，我们将了解定义 `PSR-13` 的规则，在此之前我们需要了解一些特性：\n\n**基础链接** - 一个超媒体链接由：一个代表被引用的目标资源的\
    \ `URI` 以及一个定义目标资源与源之间的关系。取决于所使用的格式，链接可能存在其他其他属性。\n\n- **实例化对象** - 对象必须通过一个对象来创建。\n\
    \n- **序列化器** - 一个使用一个或多个 `Link` 对象并产生某种格式表示的应用程序。\n\n### 规则 1\n\n所有链接都可以包含 `URI`\
    \ 和关系之外的零或多个属性。通常支持的值有 `hreflang`、`title` 和 `type`。\n\n### 规则 2\n\n序列化器在需要时可以省略对象的属性，但序列化器必须编码所有提供的属性，除非被某些格式的定义所阻止。\n\
    \n### 规则 3\n\n如果特定属性在上下文中不能有多个值，序列化器必须使用提供的第一个值并忽略所有后续值。如果该属性具有布尔值 `true`，序列化器可以使用适当且被某种序列化格式支持的缩写形式。\n\
    \n### 规则 4\n\n如果该属性具有布尔值 `false`，序列化器必须省略该属性，除非结果的语义含义会改变。此规则当且仅当该属性为布尔 `false`\
    \ 时适用，即用于 `false` 的值 0 是无效的。\n\n### 规则 5\n\n链接关系被定义为字符串，在公开定义关系的情况下为简单的关键字，在私有关系的情况下为绝对\
    \ `URI`。如果使用了简单的关键字，它必须匹配 `IANA (http://www.iana.org/assignments/link-relations/link-relations.xhtml)`\
    \ 中的记录。可选地，也可以可以使用来自 `http://microformats.org/wiki/existing-rel-values` 的记录。\n\
    \n### 规则 6\n\n未在上述任何记录或公共记录中定义的关系被视为私有的，即它是特定应用程序的。这些关系必须使用绝对 `URI`。\n\n### 规则\
    \ 7\n\n链接模型（templates）是需要由客户端发送的值填充的 `URI` 模式。某些超媒体格式支持链接模型，而其他格式不支持，并可能有不同的方式来指示某个链接是模型。\n\
    \n不支持 `URI` 模型的序列化器必须忽略它找到的任何模型链接。\n\n### 规则 8\n\n"
