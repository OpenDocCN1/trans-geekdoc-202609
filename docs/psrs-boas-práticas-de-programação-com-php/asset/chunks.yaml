- raw: "Essa PSR tem como objetivo definir alguns elementos padrões de codificação\
    \ que devem garantir um maior nível de interoperabilidade entre os códigos PHP.\n\
    \n> **O que é interoperabilidade?**\n\n> \n\n> Interoperabilidade é a capacidade\
    \ de um sistema ou aplicação comunicar-se com outros sistemas ou aplicações de\
    \ maneira eficiente, alcançando um maior nível de integridade dos dados.\n\nGarantir\
    \ que a sua aplicação seja interoperável traz consigo uma maior integridade dos\
    \ dados, e além disso, a sua aplicação torna-se mais eficiente quando precisar\
    \ se comunicar com outras aplicações.\n\nJá aplicações que não possuem um alto\
    \ nível de interoperabilidade tendem a ter dificuldades em se comunicar com outras,\
    \ e dentro de um ambiente corporativo isso pode levar a drásticas consequências,\
    \ como refatorar a aplicação de maneira que possa atender às necessidades da empresa\
    \ ou até mesmo iniciar a criação de uma nova aplicação mais eficiente.\n\nPortanto,\
    \ se a aplicação for interopeŕavel, você não deverá ter dor de cabeça no momento\
    \ em que precisar realizar a comunicação com outros sistemas.\n\n## 2.1 Regras\n\
    \nConfira nesta seção o conjunto de todas as regras e características dessa PSR.\n\
    \n### Regra 1\n\nArquivos PHP DEVEM usar apenas as tags `<?php` e `<?=`. Isso\
    \ significa que qualquer outro tipo de tag, como a ASP tag `(<%)` ou a tag de\
    \ script PHP, não deve ser utilizado. Em muitos servidores, as *short open tags*\
    \ estão desabilitadas por padrão e isso pode ocasionar muita dor de cabeça, então\
    \ por convenção utilize somente as tags `<?php` ou `<?=`.\n\n### Regra 2\n\nArquivos\
    \ PHP DEVEM usar apenas UTF-8 sem BOM (*Byte Order Mark*). Sabe quando você abre\
    \ um arquivo que não está utilizando esse padrão e aparece um monte de código\
    \ estranho nele? Pois bem, isso acontece porque o arquivo provavelmente está usando\
    \ uma codificação com BOM, por exemplo: ISO-8859-1 ou UTF-8 com BOM.\n\nFoi definido\
    \ que o padrão a ser seguido e utilizado é a UTF-8 sem BOM, desse modo, os problemas\
    \ de incompatibilidade de codificação acabam. Vale ressaltar que maioria das IDEs\
    \ já vem configurada para o padrão UTF-8 sem BOM.\n\n### Regra 3\n\nArquivos PHP\
    \ DEVERIAM declarar (classes, métodos, constantes, atributos etc.) ou causar efeitos\
    \ colaterais (gerar outputs, realizar modificações no `php.ini` etc.), mas NÃO\
    \ DEVERIAM fazer as duas coisas.\n\nImagine um arquivo PHP que possui a declaração\
    \ de uma classe, mas também possui trechos de código que alteram a configuração\
    \ do `php.ini` e que ainda possui exibição de conteúdo na tela. Já sabe a bagunça\
    \ e a zona que é: tudo desorganizado, misturando as responsabilidades em uma verdadeira\
    \ sopa de lógica mal definida. E isso resulta em um tempo considerável para fazer\
    \ a correção e a separação das responsabilidades.\n\nSe seu arquivo for de declaração\
    \ de uma classe ou interface, então respeite. Faça apenas isso, nada de exibir\
    \ conteúdo ou alterar configurações do `php.ini` antes da declaração da classe\
    \ ou após a declaração. Para fazer isso, crie um arquivo que seja responsável\
    \ por fazer essas tarefas, ok?\n\nVeja o exemplo a seguir para melhor entendimento\
    \ sobre um arquivo que faz exatamente ambas as coisas, o que DEVE ser evitado:\n\
    \n```\n<?php\n//Alterando a configuração do php.ini\nini_set('error_reporting',\
    \ E_ALL);\n\n//Incluindo um arquivo externo\ninclude \"arquivo.php\";\n\n//Gerando\
    \ uma saída na tela\necho \"<html>\\n\";\n\n//Declarando uma classe\nclass Usuario\n\
    {\n}\n```\n\nComo você pôde ver, é um tipo de exemplo que - para ser bem sincero\
    \ - é muito mais comum do que se pensa. Basta você trabalhar com qualquer tipo\
    \ de sistema legado em PHP que você já encontrará algumas assombrações dessas,\
    \ então, lembre-se: evite colocar em um mesmo arquivo declarações e outputs como\
    \ o exemplo citado.\n\nAgora veremos um exemplo que seria o correto, um arquivo\
    \ apenas com a declaração:\n\n```\n<?php\n//Declarando uma classe\nclass Usuario\n\
    {\n    private $nome;\n\n    public function setNome($nome)\n    {\n        $this->nome\
    \ = $nome;\n    }\n}\n```\n\nNote que nesse exemplo não há nenhuma geração de\
    \ output no arquivo de declaração. Ele faz exatamente a declaração da classe,\
    \ do método e do atributo, nada além disso.\n\n```\n\n```\n\n### Regra 4\n\nNamespaces\
    \ e classes DEVEM seguir o padrão descrito na PSR-0 (depreciada) e PSR-4 (substituta\
    \ da PSR-0). Para que se obtenha um `autoloading` compreensível e eficaz é necessário\
    \ seguir a mesma estrutura de diretórios no namespace na declaração dos arquivos.\n\
    \n> **O que é Autoloading?**\n\n> \n\n> É a maneira de realizar o carregamento\
    \ automático de arquivos como classes, interfaces, traits etc., sem que haja a\
    \ necessidade de o desenvolvedor vincular esses arquivos explicitamente no código.\n\
    \nO autoloading de arquivos é considerado compreensível e eficaz quando realizado\
    \ da maneira correta, ou seja, da maneira que é estipulada por esta PSR.\n\nPara\
    \ entendermos melhor, vamos ao exemplo a seguir:\n\n```\n|-src\n  |-App\n    |-Controller\n\
    \      |-HomeController.php\n```\n\nNote que temos uma estrutura de diretórios\
    \ bem simples. Com a utilização de namespace, o exemplo ficaria conforme a seguir:\n\
    \n```\n<?php\nnamespace App\\Controller;\n\nclass HomeController\n{\n}\n```\n\n\
    Temos uma classe `HomeController` que está dentro do diretório `App` e consequentemente\
    \ dentro do subdiretório `Controller`, logo, o namespace dessa classe é `App\\\
    Controller`. Não é uma coisa difícil de se aprender, é apenas uma questão habitual.\n\
    \nA utilização de namespaces facilita e muito, pois não precisamos ficar dando\
    \ vários `require()` no arquivo, apesar de que por trás da lógica de `autoloading`\
    \ ele faz um `require` para o arquivo original.\n\nEntão, em vez de fazer `require\
    \ __DIR__ '/src/App/Controller/HomeController.php'`, utilize o padrão considerado\
    \ correto, que é através da utilização de namespaces.\n\n### Regra 5\n\nO nome\
    \ de arquivos como classes, interfaces e traits DEVEM seguir o padrão `StudlyCaps`.\
    \ Isso significa que a primeira letra de cada palavra deve ser escrita com letra\
    \ maiúscula, como é o caso do nosso exemplo `HomeController`.\n\n### Regra 6\n\
    \nConstantes DEVEM ser declaradas com todas as letras em maiúsculo e separadas\
    \ por *underscores* (`_`). Nada de declarar uma constante com letras em minúsculo,\
    \ ou `camelCase`, ou `snake_case`. O único modo permitido é a utilização de todas\
    \ as letras em maiúsculo.\n\nPara facilitar o entendimento, vamos ao exemplo a\
    \ seguir do que é considerada a maneira correta na declaração de constantes:\n\
    \n```\n<?php\nconst LOG_CRITICAL = 'critical';\n```\n\nNada demais, não é mesmo?\
    \ E o jeito considerado incorreto? Vamos verificar a seguir:\n\n```\n<?php\nconst\
    \ logCritial = 'critical';\nconst log_info = 'info';\n```\n\nEste último exemplo\
    \ mostra uma das formas incorretas de declarar uma constante em PHP, então evite\
