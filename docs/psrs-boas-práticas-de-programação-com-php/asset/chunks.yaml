- raw: "Pode parecer estranho, mas isso é considerado mais uma questão de adaptação\
    \ e costume. Constantemente vejo códigos que não seguem essa regra da PSR. Para\
    \ facilitar o entendimento, vamos ao exemplo considerado correto:\n\n```\n<?php\n\
    \nnamespace App\\Controller;\n\nclass HomeController\n{\n    public function indexAction()\n\
    \    {\n        //Código\n    }\n}\n```\n\nNo exemplo citado, veja que o método\
    \ `indexAction()` segue perfeitamente essa regra, ou seja, não há espaços após\
    \ o nome do método, a chave de abertura está em uma nova linha e a chave de fechamento\
    \ está logo após o conteúdo do método em uma nova linha. O mesmo se aplica para\
    \ funções.\n\nVamos analisar agora um exemplo em que a definição do método não\
    \ segue o padrão estipulado:\n\n```\n<?php\n\nnamespace App\\Controller;\n\nclass\
    \ HomeController\n{\n    public function indexAction ( $request ) {\n        //Código\n\
    \    }\n}\n```\n\nApesar de o código funcionar sem problemas, ele não é compatível\
    \ com a regra da PSR-12.\n\n### Regra 30\n\nQuando o método possuir uma lista\
    \ de parâmetros, NÃO DEVE haver espaço antes de cada vírgula, mas DEVE ter espaço\
    \ após cada vírgula. Sempre que você for definir uma lista de parâmetros no método,\
    \ você deve separá-los por vírgula (`,`) e em seguida espaço, seguindo basicamente\
    \ o padrão já usado em nosso próprio idioma.\n\nVamos ao exemplo considerando\
    \ a maneira correta de definir os parâmetros do método:\n\n```\n<?php\n\nnamespace\
    \ App\\Controller;\n\nclass HomeController\n{\n    public function indexAction($request,\
    \ $response)\n    {\n        //Código\n    }\n}\n```\n\nO exemplo mostra exatamente\
    \ como a regra explica, cada parâmetro é separado por vírgula seguida de um espaço\
    \ (`,`). A mesma regra se aplica para as funções. Agora vamos ver um exemplo que\
    \ é considerado a maneira incorreta na definição dos parâmetros de um método/função:\n\
    \n```\n<?php\n\nnamespace App\\Controller;\n\nclass HomeController\n{\n    public\
    \ function indexAction($request ,$response)\n    {\n        //Código\n    }\n\
    }\n```\n\nPerceba que dessa vez os parâmetros são separados apenas pela vírgula,\
    \ porém o espaço que deveria estar após a vírgula está definido antes da vírgula.\
    \ Sendo assim, o código não está em conformidade com a PSR-12.\n\n### Regra 31\n\
    \nCaso o método possua muitos parâmetros a serem definidos, a lista de parâmetros\
    \ PODE ser dividida em múltiplas linhas contendo uma indentação, sendo que o primeiro\
    \ parâmetro da lista DEVE estar na próxima linha.\n\nDEVE haver apenas um parâmetro\
    \ por linha e o parêntese de fechamento da lista e a chave de abertura do método\
    \ DEVEM estar na mesma linha, contendo apenas um espaço entre eles. A definição\
    \ dessa regra pode ser grande mas não é difícil. Na verdade, a primeira vez que\
    \ comecei a usar lá na PSR-2 eu estranhei bastante a forma como ficava o código,\
    \ mas com o tempo acabei me acostumando.\n\nA explicação desta regra fica mais\
    \ fácil ao visualizar um exemplo que atenda à especificação, vamos nessa:\n\n\
    ```\n<?php\n\ndeclare(strict_types=1);\n\nnamespace App\\Sercice\\Paginacao;\n\
    \nclass PaginacaoService\n{\n    public function paginate(\n        int $limite,\n\
    \        int $pagina,\n        array $dados\n    ): array {\n        //Código\n\
    \    }\n}\n```\n\nPerceba como a lista de parâmetros foi dividida, ficou fácil\
    \ de ler e identificar os parâmetros. Essa regra é muito bem aplicada em empresas\
    \ que trabalhei, pois acredite, havia métodos que continham mais de 15 parâmetros,\
    \ uma verdadeira aberração da programação.\n\nAgora vamos analisar o mesmo exemplo\
    \ em que a divisão em múltiplas linhas não é correta e deve ser evitada:\n\n```\n\
    <?php\n\ndeclare(strict_types=1);\n\nnamespace App\\Sercice\\Paginacao;\n\nclass\
    \ PaginacaoService\n{\n    public function paginate(\n        int $limite, int\
    \ $pagina,\n        array $dados\n    ): array {\n        //Código\n    }\n}\n\
    ```\n\nO código do exemplo funciona perfeitamente, porém não está em conformidade\
    \ com a regra de ter cada parâmetro em uma nova linha, então evite esse tipo de\
    \ estilo.\n\n### Regra 32\n\nQuando o(s) método(s) possuem a declaração de tipo\
    \ de retorno definida, DEVE haver um espaço após os dois pontos seguido pela declaração\
    \ de tipo. Os dois pontos e a declaração DEVEM estar na mesma linha que a lista\
    \ de parâmetros entre parênteses, sem espaços entre os dois caracteres. O exemplo\
    \ a seguir demonstra como é a aplicação dessa regra:\n\n```\n<?php\n\ndeclare(strict_types=1);\n\
    \nnamespace App\\Sercice\\Paginacao;\n\nclass PaginacaoService\n{\n    public\
    \ function paginate(int $limite, int $pagina, array $dados): array \n    {\n \
    \       //Código\n        return [];\n    }\n\n    public function getPagina():\
    \ int\n    {\n        return 1;\n    }\n}\n```\n\nPerceba que após o parêntese\
    \ de fechamento `)` dos parâmetros do método `getPaginate` os dois pontos `:`\
    \ foram definidos, indicando que o método obrigatoriamente deve ter um tipo de\
    \ retorno definido, que nesse caso é o retorno do tipo `array`. Perceba também\
    \ que entre os dois pontos `:` e o tipo de retorno `array` existe um espaço separando\
    \ os dois.\n\nVamos analisar a seguir como seria o mesmo exemplo, porém com a\
    \ forma incorreta na formatação:\n\n```\n<?php\n\ndeclare(strict_types=1);\n\n\
    namespace App\\Sercice\\Paginacao;\n\nclass PaginacaoService\n{\n    public function\
    \ paginate(int $limite, int $pagina, array $dados):array \n    {\n        //Código\n\
    \        return [];\n    }\n\n    public function getPagina():int\n    {\n   \
    \     return 1;\n    }\n}\n```\n\nEsse exemplo é considerado incorreto porque\
    \ não existe espaço entre os dois pontos `:` e o tipo de retorno de ambos os métodos.\n\
    \n### Regra 33\n\nNas declarações de tipo `null`, NÃO DEVE haver um espaço entre\
    \ o ponto de interrogação e o tipo. Essa regra parece estranha, mas não é e na\
    \ verdade é bem simples. Vamos analisar o exemplo a seguir que demonstra como\
    \ deve ser aplicada essa regra:\n\n```\n<?php\n\ndeclare(strict_types=1);\n\n\
    namespace App\\Entity\\Usuario;\n\nclass Usuario\n{\n    public function getNome():\
    \ ?string\n    {\n        return $this->nome;\n    }\n\n    public function getDataAtualizacao():\
    \ ?\\DateTime\n    {\n        return $this->dataAtualizacao;\n    }\n\n    public\
    \ function setDados(?string $nome, ?int $idade): Usuario\n    {\n        $this->nome\
    \ = $nome;\n        $this->idade = $idade;\n        return $this;\n    }\n}\n\
    ```\n\nPerceba que após os dois pontos `:` temos um espaço seguido por um ponto\
    \ de interrogação `?` seguido pelo tipo de retorno. Essa sequência está informando\
    \ que o método espera o retorno do tipo especificado ou um valor nulo `null`,\
    \ é isso que o ponto de interrogação `?` significa, ou seja, ou retorna o valor\
    \ esperado ou retorna nulo `null`.\n\nAinda no exemplo, perceba o método `setDados`.\
    \ Nele, passamos dois parâmetros `?string $nome` e `?int $idade`, que podem ou\
    \ não ser informados. Caso sejam informados, devem ser do tipo `string` e `int`\
    \ respectivamente, mas caso não sejam informados, o valor nulo `null` será assumido.\
    \ Perceba ainda que definimos que obrigatoriamente o retorno do método deve ser\
    \ a instância da própria classe, no caso `Usuario`.\n\n### Regra 34\n\nAo usar\
    \ o operador de referência e antes de um parâmetro, NÃO DEVE haver um espaço depois\
    \ dele. NÃO DEVE haver um espaço entre o operador variável de três pontos `...`\
    \ e o nome do parâmetro.\n\nVamos analisar o exemplo que demonstra a aplicação\
    \ dessa regra:\n\n```\n<?php\n\ndeclare(strict_types=1);\n\nnamespace App\\Crypt;\n\
    \nclass Crypt\n{\n    public function crypt(string $string, ...$parts): string\n\
    \    {\n        //Código\n    }\n}\n```\n\nPerceba que na definição do segundo\
    \ parâmetro nós temos o operador variável de três pontos `...` seguido pelo nome\
    \ do parâmetro `$parts`. Ao utilizar esse operador, não deve haver espaço entre\
    \ os três pontos `...` e o nome do parâmetro.\n\nVamos analisar um exemplo que\
    \ é a forma incorreta de utilizar o operador de três pontos `...`:\n\n```\n<?php\n\
    \ndeclare(strict_types=1);\n\nnamespace App\\Crypt;\n\nclass Crypt\n{\n    public\
    \ function crypt(string $string, ... $parts): string\n    {\n        //Código\n\
    \    }\n}\n```\n\nPerceba que existe um espaço entre os três pontos `...` e o\
    \ nome do parâmetro. Apesar de estar incorreto pela PSR-12, o código funcionará\
    \ perfeitamente.\n\n### Regra 35"
