- raw: "*   `Psr\\Log\\AbstractLogger` - Essa classe abstrata possui a implementação\
    \ da interface `LoggerInterface`, que possui os nove métodos, oito dos quais são\
    \ referentes aos níveis de log permitidos por padrão, para que a aplicação possa\
    \ estender a classe abstrata que já contém todos os métodos necessários para serem\
    \ utilizados.\n\n*   `Psr\\Log\\LoggerTrait` - Funciona basicamente da mesma maneira\
    \ que a classe `AbstractLogger`, tendo como diferença o fato de que a `Trait`\
    \ não implementa a interface `LoggerInterface` porque as `Traits` não podem implementar\
    \ interfaces. Por conter o mesmo funcionamento que a classe abstrata, o resultado\
    \ será exatamente o mesmo, já que a `LoggerTrait` já possui o método abstrato\
    \ `log`.\n\n*   `Psr\\Log\\NullLogger` - Estende a classe abstrata `AbstractLogger`\
    \ e é responsável por ser uma espécie de contenção caso nenhuma classe responsável\
    \ pela gravação de log na aplicação tenha sido definida.\n\n*   `Psr\\Log\\LoggerAwareInterface`\
    \ - Essa interface possui apenas um método chamado `setLogger`, que é responsável\
    \ por setar uma determinada classe de logs.\n\n*   `Psr\\Log\\LoggerAwareTrait`\
    \ - Funciona como uma implementação da interface `LoggerAwareInterface`, que provê\
    \ o método `setLogger` e também a propriedade `$this->logger`.\n\n*   `Psr\\Log\\\
    LogLevel` - Simplesmente contém as oito constantes referentes aos níveis de log.\n\
    \n### Conclusão\n\nChegamos ao final de mais uma PSR e vimos através dela como\
    \ podemos desenvolver um sistema de logs seguindo as regras descritas aqui. Essa\
    \ PSR não é tão grande e também não é tão complicada após conhecer as regras que\
    \ a define.\n\nÉ importante ressaltar que a PSR-3 não descreve um passo a passo\
    \ de como desenvolver um sistema de logs, mas sim, nos dá o direcionamento e a\
    \ estrutura inicial de como podemos implementar em nossa aplicação.\n\nCapítulo\
    \ 6 \n\n# PSR-4 (Autoloader)\n\nCom o objetivo de fornecer um padrão para o carregamento\
    \ de classes através de caminhos de arquivos, a PSR-4 é totalmente interoperável,\
    \ podendo ser utilizada em conjunto com qualquer outro tipo de PSR. Além disso,\
    \ a PSR-4 descreve onde podemos colocar os arquivos que serão carregados automaticamente.\n\
    \n## 6.1 Regras\n\nConfira nesta seção o conjunto de todas as regras e características\
    \ dessa PSR.\n\n### Regra 1\n\nO nome completo da classe DEVE possuir um namespace\
    \ de nível superior, conhecido como *namespace raiz*. Caso você não conheça ou\
    \ não saiba como funciona, um namespace raiz nada mais é do que um namespace base\
    \ em que todas as nossas classes (incluindo *traits* e interfaces) devem ser incluídas.\
    \ Vamos analisar o exemplo a seguir para melhor entendimento:\n\n```\n<?php\n\n\
    namespace App\\Validator\\Cpf;\n\nclass CpfValidator\n{        \n    //Código\n\
    }\n```\n\nNo exemplo, foi criada uma classe `CpfValidator`, que por sua vez está\
    \ dentro do namespace raiz `App`, onde `App` é o nome dado ao projeto ou ao módulo\
    \ dele.\n\nSe fôssemos criar outra classe, ela também deveria ficar dentro do\
    \ namespace raiz `App`. Se você nunca ouviu falar ou nunca trabalhou com namespaces,\
    \ deve estar se perguntando: mas posso definir qualquer nome para o namespace\
    \ raiz? A resposta é SIM!\n\nSe você quiser chamar o seu namespace raiz de `Sistema`\
    \ ou até mesmo colocar seu nome, você pode fazer isso sem problemas, mas lembre-se\
    \ de que o namespace deve fazer sentido prático. Geralmente é o nome da aplicação\
    \ ou o nome do módulo. No nosso exemplo, isso significa que a estrutura de diretórios\
    \ seria:\n\n```\n|-src\n    |-App\n        |-Validator\n            |-Cpf\n  \
    \              |-CpfValidator.php\n```\n\nSimples, não é?\n\n### Regra 2\n\nO\
    \ nome completo da classe PODE ter um ou mais *subnamespaces*. Entenda como um\
    \ subnamespace como sendo um subdiretório em uma estrutura de diretórios. No exemplo\
    \ anterior você pôde ver que dentro do namespace raiz `App` temos ainda o `Validator`\
    \ e o `Cpf`, então o namespace completo fica da seguinte maneira: `App\\Validator\\\
    Cpf`.\n\n### Regra 3\n\nO nome completo da classe DEVE terminar com o nome de\
    \ uma classe. Ainda, seguindo o último exemplo citado, `App\\Validator\\Cpf`,\
    \ quando formos chamar esse `validator` dentro de uma outra classe, faremos da\
    \ seguinte maneira:\n\n```\n<?php\n\nnamespace App\\Service\\Usuario;\n\nuse App\\\
    Validator\\Cpf\\CpfValidator;\n\nclass UsuarioService\n{        \n    //Código\n\
    }\n```\n\nO trecho `use App\\Validator\\Cpf\\CpfValidator` está dizendo que estamos\
    \ importando a classe `CpfValidator`. Ou seja, para o *autoloader* chamar uma\
    \ classe, ele sempre vai considerar o que estiver após a última `\\`, sendo o\
    \ nome da classe somado ao namespace completo.\n\n### Regra 4\n\nUnderscores (`_`)\
    \ NÃO DEVEM ter efeito especial no nome da classe. Significa que o underscore\
    \ no nome de uma classe (incluindo *traits* e interfaces) deve ser simplesmente\
    \ um caractere, sem causar nenhum tipo de efeito especial.\n\n### Regra 5\n\n\
    O nome completo da classe PODE conter qualquer tipo de combinação de caracteres\
    \ em maiúsculos ou minúsculos. Isso significa que não existe uma regra para definição\
    \ do nome da classe incluindo o namespace, você pode utilizar qualquer tipo de\
    \ combinação de letras.\n\nPor convenção, o padrão adotado para nomes de classes\
    \ e namespaces é o `StudlyCaps`, ou seja, a primeira letra de cada palavra é em\
    \ maiúsculo, por exemplo: `App\\Entity\\Acl\\PapelDeAcesso`.\n\n### Regra 6\n\n\
    Todos os nomes de classes DEVEM ser referenciados de maneira sensível (*case-sensitive*).\
    \ Sempre que o *autoloader* chamar uma classe, ele utilizará o nome real da classe,\
    \ respeitando a diferenciação das letras. Por exemplo, `CpfValidator` é diferente\
    \ de `cpfValidator`, sendo que neste último caso a classe não seria encontrada,\
    \ pois o nome real dela é `CpfValidator` e não `cpfValidator`.\n\n### Regra 7\n\
    \nAo carregar um nome de arquivo correspondente a um nome completo de classe,\
    \ uma série de um ou mais namespaces com exceção do namespace principal DEVE corresponder\
    \ a um diretório raiz. Já vimos isso em um dos exemplos anteriores: todo namespace\
    \ deve ser correspondente a um diretório raiz com exceção do namespace raiz, afinal\
    \ ele já é a raiz.\n\nMas vamos analisar novamente a estrutura de diretórios de\
    \ um dos exemplos anteriores:\n\n```\n|-src\n    |-App\n        |-Validator\n\
    \            |-Cpf\n                |-CpfValidator.php\n```\n\nPerceba que o diretório\
    \ `App` é a base de todos os subdiretórios subsequentes, e a estrutura de diretórios\
    \ é convertida em formato de namespace `App\\Validator\\Cpf\\CpfValidator`.\n\n\
    ### Regra 8\n\nCada subnamespace corresponde a um subdiretório incluso no diretório\
    \ raiz e o nome do subdiretório DEVE ser escrito da mesma maneira que o nome do\
    \ subnamespace, sempre respeitando a diferenciação de letras.\n\nNão há segredo:\
    \ o nome do namespace deverá será ser definido exatamente da maneira que for definido\
    \ o nome do diretório, conforme mostrado anteriormente.\n\n### Regra 9\n\nA classe\
    \ que for chamada após o namespace DEVE corresponder a um arquivo `.php` e o nome\
    \ desse arquivo DEVE ser escrito da mesma maneira que o nome da classe, sempre\
    \ respeitando a diferenciação de letras.\n\nTambém já falamos disso anteriormente.\
    \ No caso da nossa classe `CpfValidator`, note que ela segue exatamente o que\
    \ descreve essa regra. Ela está sendo chamada por um namespace base e ainda respeita\
    \ exatamente o mesmo nome do arquivo contido no diretório, diferenciando as letras\
    \ maiúsculas e minúsculas.\n\n### Regra 10\n\nImplementações de *autoloader* NÃO\
    \ DEVEM lançar exceções, NÃO DEVEM gerar erros de qualquer nível e NÃO DEVERIAM\
    \ retornar nenhum valor. O único objetivo do *autoloader* é fazer o carregamento\
    \ automático, nada além disso.\n\nPara evitar erros, o desenvolvedor deve saber\
    \ exatamente os namespaces que deverá utilizar de modo que não ocasione nenhum\
    \ tipo de exceção ou erro.\n\n### Conclusão\n\nPodemos concluir que a PSR-4 é\
    \ uma especificação que define o carregamento automático de classes através de\
    \ arquivos contidos em diretórios e subdiretórios que formam um determinado namespace.\n\
    \nCada namespace deve seguir exatamente a mesma estrutura de diretórios e a mesma\
    \ diferenciação de letras maiúsculas e minúsculas."
