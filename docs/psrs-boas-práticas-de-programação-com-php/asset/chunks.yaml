  trans: "\n\n**推荐用法** - 开发者**不应该**将容器传递给对象，以便该对象能够获取自身的依赖项。这意味着容器被用作服务定位器（`Service\
    \ Locator`），也就是说，它将根据提供的名称查找或不查找特定的服务。\n\n如果提供的名称存在，则可以返回该服务的对象实例。例如，我们有一个名为 `usuario`\
    \ 的容器，它返回名为 `Usuario` 的服务的实例。\n\n## 9.2 接口\n\n现在我们已经了解了使用规则，让我们来认识该包中的三个接口。\n\n\
    ### `Psr\\Container\\ContainerInterface`\n\n```php\n<?php\n\nnamespace Psr\\Container;\n\
    \ninterface ContainerInterface\n{    \n    public function get($id);\n    public\
    \ function has($id);\n}\n```\n\n### `Psr\\Container\\ContainerExceptionInterface`\n\
    \n```php\n<?php\n\nnamespace Psr\\Container;\n\ninterface ContainerExceptionInterface\n\
    {\n}\n```\n\n### `Psr\\Container\\NotFoundExceptionInterface`\n\n```php\n<?php\n\
    \nnamespace Psr\\Container;\n\ninterface NotFoundExceptionInterface extends ContainerExceptionInterface\n\
    {\n}\n```\n\n### 结论\n\n如你所观察到的，此 PSR 定义了一个用于通过容器进行依赖注入的接口。它非常简单，只有两个方法：`get()`\
    \ 和 `has()`，分别用于获取和检查信息。\n\n在接下来的章节中，我们将讨论 PSR-12，它是 PSR-2 的扩展，具有与 PHP 7 新功能兼容的新格式规则，那么，让我们开始吧！\n\
    \n## 第 10 章 \n\n# PSR-12 (扩展编码风格) - 第一部分\n\nPSR-12 是 PSR-2 的扩展，其目标与后者相同，但具有更现代的背景和遵循\
    \ PHP 演进的新功能。如果我们思考一下，PSR-2 是在 2012 年接受的，从那时起不断更新以跟上 PHP 的演进，使代码在开发者之间能够更高效地解析。由于\
    \ PHP 7 有许多变化，有必要将 PSR-2 重写为新的 PSR，以满足 PHP 中提供的所有新特性。\n\n我们将在接下来的章节中查看规则、概念以及如何将它们应用到你的项目中，以便获得更美观、更易读且兼容\
    \ PHP 7 及其功能的代码。需要指出的是，PSR-2 已被废弃，但出于教学和理解的考虑，它没有从书中删除，因为你可以注意到 PSR-2 和 PSR-12\
    \ 之间的差异。\n\n## 10.1 规则\n\n在本节查看此 PSR 的所有规则和特征。\n\n### 规则 1\n\nPHP 代码**必须**遵循 PSR-1（`Basic\
    \ Code Standard`）建立的标准。作为 PSR-1 的扩展，你的代码在应用之前首先必须符合 PSR-1。`StudlyCaps` 术语应解释为\
    \ `PascalCase`，其中每个单词的首字母大大写。\n\n### 规则 2\n\nPHP 文件**必须**拥有 UNIX 行结束符标准。你知道有哪些行结束符吗？如果不知道，请看下文：\n\
    \n- `CRLF`: 回车 + 换行\n- `LF`: 换行\n- `NEL`: 下一行\n- `LS`: 行分隔符\n- `PS`: 段落分隔符\n\n\
    PSR-12 采用的标准是 `LF`。通常情况下，IDE 已经配置为 UNIX 标准，但可以根据所使用的 IDE 进行更改。\n\n### 规则 3\n\n\
    仅包含代码的文件**必须**在末尾留有一个空行。在应用所有逻辑后，末尾必须有一个空行。看下面的示例，它展示了该规则的应用：\n\n```php\nclass\
    \ Usuario\n{\n    private $nome;\n    public function __construct($nome)\n   \
    \ {\n        $this->nome = $nome;\n    }\n}\n```\n\n### 规则 4\n\n仅包含 PHP 的文件**必须**省略结束标签。这在最初看起来可能很奇怪，但如果省略结束标签\
    \ `?>`，PHP 脚本将无法运行。此规则适用于包含 HTML 的。为了方便理解，我们来看下面的示例，它展示了正确的应用方式：\n\n```php\nclass\
    \ Usuario\n{\n    private $nome;\n\n    public function __construct($nome)\n \
    \   {\n        $this->nome = $nome;\n    }\n}\n```\n\n与之前的示例不同，省略 PHP 结束标签 `?>`\
    \ 将导致变量 `$nome` 声明后的代码出现错误，因为该文件不仅仅包含代码。让我们分析一下发生这种情况的示例：\n\n```php\n<?php\n$nome\
    \ = 'Jhones S. Clementino';\n\n<html>\n<head>\n    <title>Teste</title>\n</head>\n\
    <body>\n    <h1>Olá, <?php echo $nome;!</h1>\n</body>\n</html>\n```\n\n### 规则\
    \ 5\n\n每行代码的最大长度应为 120 个字符。自动样式检查器**必须**警告，但如果你通过换行使其保持易读，则**不应**显示错误；如果无法做到，你仍然有\
    \ 120 个字符的限制。代码行**不应**超过 80 个字符。较长的代码行**必须**拆分成后续最多 80 个字符的多个行。\n\n这个解释可能看起来很奇怪，但非常有道理。在遗留系统中，特别是有很多长度超过\
    \ 100 个字符的行——相信我，这不是夸张！我工作过此类系统，维护这类这类代码非常复杂。因此，请注意在 80 个字符处可以换行。这不是错误，但如果你想遵循\
    \ PSR-12 标准并保持你的良好实践，注意这一额外规则非常重要。\n\n### 规则 6\n\n包含内容的行**不应**在内容的末尾留有空白符。\n\n\
    ### 规则 7\n\n为了方便解析代码，**可以**添加空行。你可以添加空行来使代码的解析变得更容易。让我们看下文该规则应用的简短示例：\n\n```php\n\
    <?php\n\nclass Usuario\n{\n    private $nome;\n\n    private $idade;\n\n    private\
    \ $sexo;\n\n    public function __construct($nome, $idade, $sexo)\n    {\n   \
    \     $this->nome = $nome;\n        $this->idade = $idade;\n\n        if ($sexo\
    \ == 'M') {\n            $this->sexo = 'Masculino';\n        } elseif ($sexo ==\
    \ 'F') {\n            $this->sexo = 'Feminino';\n        }\n    }\n}\n```\n\n\
    看应用了换行后代码变得多多易读。现在看下面的示例，在编写逻辑时没有换行：\n\n```php\n<?php\n\nclass Usuario\n{\n  \
    \  private $nome;\n    private $idade;\n    private $sexo;\n    public function\
    \ __construct($nome, $idade, $sexo)\n    {\n        $this->nome = $nome;\n   \
    \     $this->idade = $idade;\n        if ($sexo == 'M') {\n            $this->sexo\
    \ = 'Masculino';\n        } elseif ($sexo == 'F') {\n            $this->sexo =\
    \ 'Feminino';\n        }\n    }\n}\n```\n\n之前的代码运行没有问题，但请看它看起来多么奇怪，并且在某种程度上有点难以理解，特别是类属性和构造方法之间的分离。\n\
    \n### 规则 8\n\n单行内**不应**有多个声明。每个变量声明都必须在新的的一行中进行。也就是说，定义了一个变量？那么跳过一行来定义下一个变量。\n\
    \n让我们来看下面的示例，展示了遵循 PSR-12 标准声明变量正确方式：\n\n```php\n<?php\n$nome = 'Jhones';\n$sobrenome\
    \ = 'S. Clementino';\n```\n\n"
