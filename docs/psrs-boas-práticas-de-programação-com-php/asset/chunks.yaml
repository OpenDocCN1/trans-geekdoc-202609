- raw: "**Provedores evoluídos** - Um provedor de links poderá precisar da capacidade\
    \ de ter links adicionais adicionados a ele. Em outros casos, um provedor de link\
    \ é somente leitura, com links derivados em tempo de execução de outra fonte de\
    \ dados, por esse motivo, provedores de links modificáveis são uma interface secundária\
    \ que opcionalmente pode ser implementada.\n\nAlém disso, alguns objetos provedores\
    \ de link como objetos de resposta da PSR-7 teriam os métodos para adicionar links\
    \ a eles totalmente incompatíveis por possuírem um design imutável. Portanto,\
    \ o método definido pela interface `Psr\\Link\\EvolvableLinkProviderInterface`\
    \ exige que um novo objeto idêntico ao original seja devolvido, mas contendo um\
    \ objeto de link adicional incluído.\n\n**Objetos de link evoluídos** - A PSR-13\
    \ permite que os objetos possam evoluir da mesma maneira que os objetos da PSR-7.\
    \ Por essa razão, um objeto `Psr\\Link\\EvolvableLinkInterface` adicional está\
    \ incluído e disponibiliza métodos para produzir novas instâncias de objeto com\
    \ uma única alteração.\n\nGraças ao comportamento `copy-on-write` do PHP, ainda\
    \ é eficiente em termos de `CPU` e memória. Não existe um método evolutivo para\
    \ modelos, porém, como o valor é um modelo de um link, então é baseado exclusivamente\
    \ no valor de `href`.\n\nUm objeto de link evoluído NÃO DEVE ser definido de forma\
    \ independente.\n\n## 12.2 Interfaces\n\nAgora que conhecemos as regras desta\
    \ PSR, vamos conhecer a seguir, as interfaces que fazem parte deste pacote.\n\n\
    ### `Psr\\Link\\LinkInterface`\n\n```\n<?php\n\nnamespace Psr\\Link;\n\ninterface\
    \ LinkInterface\n{\n    public function getHref();\n    public function isTemplated();\n\
    \    public function getRels();\n    public function getAttributes();\n}\n```\n\
    \n### `Psr\\Link\\EvolvableLinkInterface`\n\n```\n<?php\n\nnamespace Psr\\Link;\n\
    \ninterface EvolvableLinkInterface extends LinkInterface\n{\n    public function\
    \ withHref($href);\n    public function withRel($rel);\n    public function withoutRel($rel);\n\
    \    public function withAttribute($attribute, $value);\n    public function withoutAttribute($attribute);\n\
    }\n```\n\n### `Psr\\Link\\LinkProviderInterface`\n\n```\n<?php\n\nnamespace Psr\\\
    Link;\n\ninterface LinkProviderInterface\n{\n    public function getLinks();\n\
    \    public function getLinksByRel($rel);\n}\n```\n\n### `Psr\\Link\\EvolvableLinkProviderInterface`\n\
    \n```\n<?php\n\nnamespace Psr\\Link;\n\ninterface EvolvableLinkProviderInterface\
    \ extends LinkProviderInterface\n{\n    public function withLink(LinkInterface\
    \ $link);\n    public function withoutLink(LinkInterface $link);\n}\n```\n\n###\
    \ Conclusão\n\nChegamos ao final da PSR-13, que define um conjunto de interfaces\
    \ para a definição de links. A PSR em si não é grande e pode parecer um pouco\
    \ confusa, mas na prática, quando os conceitos são aplicados, ela não é tão complexa.\n\
    \nNo próximo capítulo vamos abordar sobre a PSR-14, que trata conceitos de *Event\
    \ Dispatcher*, permitindo que os desenvolvedores insiram lógica em uma aplicação\
    \ de maneira fácil e consistente. Então vamos nessa!\n\nCapítulo 13 \n\n# PSR-14\
    \ (Event Dispatcher)\n\nO principal objetivo dessa PSR é estabelecer um mecanismo\
    \ comum para a extensão e colaboração baseada em eventos, de modo que bibliotecas\
    \ e componentes possam ser reutilizados mais livremente entre várias aplicações.\n\
    \nTer interfaces comuns para despachar e manipular eventos permite aos desenvolvedores\
    \ a liberdade de criarem bibliotecas que podem interagir com muitas estruturas\
    \ e outras bibliotecas.\n\nPodemos citar alguns exemplos de uso, a seguir:\n\n\
    *   Uma estrutura de segurança que impedirá a gravação/acesso a dados quando um\
    \ usuário não possuir permissão.\n\n*   Um sistema comum de cache de página inteira.\n\
    \n*   Bibliotecas que estendem outras bibliotecas, independentemente de quais\
    \ estruturas estão integradas.\n\n*   Rastrear todas as ações executadas na aplicação.\n\
    \nConhecendo um pouco mais sobre os elementos do Event Dispatcher, nós temos:\n\
    \n*   **`Event`** (Evento) - É uma mensagem produzida por um emissor. Pode ser\
    \ qualquer objeto PHP arbitrário.\n\n*   **`Listener`** (Ouvinte) - É qualquer\
    \ chamada do PHP que espera receber um evento. Zero ou mais ouvintes podem ser\
    \ passados no mesmo evento. Um ouvinte PODE enfileirar algum outro comportamento\
    \ assíncrono, se assim desejar.\n\n*   **`Emitter`** (Emissor) - É qualquer código\
    \ arbitrário que deseje despachar um evento. Isso também é conhecido como o “código\
    \ de chamada”. Ele não é representado por nenhuma estrutura de dados específica,\
    \ mas se refere ao caso de uso.\n\n*   **`Dispatcher`** (Despachante) - É um objeto\
    \ de serviço que recebe um objeto `Event` por um `Emitter`. O Despachante é responsável\
    \ por garantir que o evento seja passado a todos os ouvintes relevantes, mas DEVE\
    \ adiar a determinação dos ouvintes responsáveis para um provedor de escuta.\n\
    \n*   **`Listener Provider`** (Provedor de Ouvinte) - É responsável por determinar\
    \ quais ouvintes são relevantes para um determinado evento, mas NÃO DEVE chamar\
    \ os ouvintes em si. Um `Listener Provider` pode especificar zero ou mais ouvintes\
    \ relevantes.\n\n## 13.1 Regras\n\nVamos conhecer a seguir as regras que definem\
    \ essa PSR.\n\n### Regra 1\n\nEventos são objetos que atuam como a unidade de\
    \ comunicação entre um `Emitter` (Emissor) e `Listener` (Ouvinte) apropriado.\n\
    \nOs objetos `Event` PODEM ser mutáveis, ou seja, quando o caso de uso chama os\
    \ `Listeners` fornecendo informações de volta ao `Emitter` (Emissor). Porém, se\
    \ nenhuma comunicação bidirecional for necessária, é RECOMENDADO que o evento\
    \ seja definido como imutável, isto é, definido de tal modo que não tenha métodos\
    \ de mutação.\n\n### Regra 2\n\nAs aplicações DEVEM assumir que o mesmo objeto\
    \ será passado para todos os `Listeners`.\n\n### Regra 3\n\nÉ RECOMENDADO, MAS\
    \ NÃO NECESSÁRIO, que os objetos `Event` suportem serialização e desserialização\
    \ sem perdas, ou seja, `$event == unserialize(serialize($event))` DEVE ser verdadeiro.\n\
    \n### Regra 4\n\nObjetos PODEM alavancar a interface serializável do PHP, os métodos\
    \ mágicos `__sleep()` ou `__wakeup()` ou a funcionalidade semelhante.\n\n### Regra\
    \ 5\n\nUm evento `Stoppable` é um caso especial de evento que contém formas adicionais\
    \ de impedir que outros `Listeners` sejam chamados. É indicado implementando a\
    \ interface `StoppableEventInterface`.\n\nUm evento que implementa a interface\
    \ `StoppableEventInterface` DEVE retornar `true` do método `isPropagationStopped()`\
    \ quando o evento que ele representa for concluído. É de responsabilidade da aplicação\
    \ determinar quando o evento deve ou não ser concluído.\n\nPor exemplo, um evento\
    \ que esteja solicitando que um objeto PSR-7 `RequestInterface` seja correspondido\
    \ com um objeto `ResponseInterface` correspondente poderia ter um método `setResponse(ResponseInterface\
    \ $response)` para um `Listener` chamar, o que faria com que o método `isPropagationStopped()`\
    \ retornasse `true`.\n\n### Regra 6\n\nUm `Listener` PODE ser chamado por qualquer\
    \ código PHP. Um `Listener` DEVE ter apenas um parâmetro, que é o evento ao qual\
    \ ele responde. Os `Listeners` DEVEM indicar a dica desse parâmetro de acordo\
    \ com a relevância do caso de uso. Uma dica do tipo de `Listener` PODE indicar\
    \ para uma interface que é compatível com qualquer tipo de evento que realiza\
    \ uma implementação específica ou não dessa interface.\n\n### Regra 7\n\nUm `Listener`\
    \ DEVE ter um retorno nulo e DEVE informar a dica que retorna explicitamente.\
    \ Um `Dispatcher` deve ignorar os valores de retorno dos `Listeners`(Ouvintes).\n\
    \n### Regra 8\n\nUm `Listener` PODE delegar ações para outro código. Isso inclui\
    \ um `Listener` sendo um `wrapper` (embrulho) em torno de um objeto que executa\
    \ a lógica de negócios real.\n\n### Regra 9\n\nUm `Listener` PODE enfileirar informações\
    \ do evento para processamento posterior por um processo secundário, usando o\
    \ cron, um servidor de filas ou técnicas semelhantes.\n\nUm `Listener` pode serializar\
    \ o próprio objeto `Event` para fazer isso. Um processo secundário DEVE presumir\
    \ que quaisquer alterações feitas em um objeto `Event` NÃO serão propagadas para\
    \ outros `Listeners`.\n\n### Regra 10"
