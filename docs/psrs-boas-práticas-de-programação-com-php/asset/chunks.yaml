  fmt: "\n```php\n<?php\nnamespace Psr\\Http\\Client;\n\nuse Psr\\Http\\Message\\\
    RequestInterface;\n\ninterface RequestExceptionInterface extends ClientExceptionInterface\n\
    {\n    public function getRequest(): RequestInterface;\n}\n```\n\n### `Psr\\Http\\\
    Client\\NetworkExceptionInterface`\n\nEsta interface possui a responsabilidade\
    \ de lançar uma exceção quando a requisição não puder ser concluída devido a problemas\
    \ de rede.\n\n```php\n<?php\nnamespace Psr\\Http\\Client;\n\nuse Psr\\Http\\Message\\\
    RequestInterface;\n\ninterface NetworkExceptionInterface extends ClientExceptionInterface\n\
    {\n    public function getRequest(): RequestInterface;\n}\n```\n\n### Conclusão\n\
    \nComo pudemos ver, trata-se de uma PSR bem intuitiva e que demonstra como podemos\
    \ ter uma interface comum para o envio e recebimento de requisições `HTTP` compatíveis\
    \ com a PSR-7, tornando as bibliotecas ainda mais reutilizáveis e reduzindo drasticamente\
    \ a quantidade de dependências.\n\n# Capítulo 17\n\n# PSR-17 (HTTP Factories)\n\
    \nA `PSR-17` define interfaces que são utilizadas para fabricar objetos `HTTP`\
    \ definidos pela PSR-7, ou seja, a `PSR-17` é uma `HTTP Factory` (fábrica de objetos\
    \ `HTTP`) provendo interfaces para essas fábricas. Sendo assim, as fábricas `HTTP`\
    \ DEVEM implementar as interfaces providas pela `PSR-17` para cada tipo de objeto\
    \ que é fornecido pela PSR-7.\n\nDiferentemente das PSRs anteriores, esta não\
    \ possui um conjunto de regras a serem seguidas, mas sim um conjunto de interfaces\
    \ que devem ser implementadas. E são elas que vamos conhecer na próxima seção.\n\
    \n## 17.1 Interfaces\n\nAs interfaces a seguir PODEM ser implementadas de duas\
    \ maneiras: juntas em uma única classe ou em classes separadas.\n\n### `Psr\\\
    Http\\Message\\RequestFactoryInterface`\n\nEsta interface possui a responsabilidade\
    \ de criar requisições `HTTP`.\n\n```php\n<?php\nnamespace Psr\\Http\\Message;\n\
    \nuse Psr\\Http\\Message\\RequestInterface;\nuse Psr\\Http\\Message\\UriInterface;\n\
    \ninterface RequestFactoryInterface\n{\n    public function createRequest($method,\
    \ $uri);\n}\n```\n\n### `Psr\\Http\\Message\\ResponseFactoryInterface`\n\nEsta\
    \ interface possui a responsabilidade de criar respostas `HTTP`.\n\n```php\n<?php\n\
    namespace Psr\\Http\\Message;\n\nuse Psr\\Http\\Message\\ResponseInterface;\n\n\
    interface ResponseFactoryInterface\n{\n    public function createResponse($code\
    \ = 200, $reasonPhrase = '');\n}\n```\n\n### `Psr\\Http\\Message\\ServerRequestFactoryInterface`\n\
    \nEsta interface possui a responsabilidade de criar requisições do servidor.\n\
    \n```php\n<?php\nnamespace Psr\\Http\\Message;\n\nuse Psr\\Http\\Message\\ServerRequestInterface;\n\
    use Psr\\Http\\Message\\UriInterface;\n\ninterface ServerRequestFactoryInterface\n\
    {\n    public function createServerRequest($method, $uri, array $serverParams\
    \ = []);\n}\n```\n\n### `Psr\\Http\\Message\\StreamFactoryInterface`\n\nEsta interface\
    \ possui a responsabilidade de criar fluxos para requisições e respostas.\n\n\
    ```php\n<?php\nnamespace Psr\\Http\\Message;\n\nuse Psr\\Http\\Message\\StreamInterface;\n\
    \ninterface StreamFactoryInterface\n{\n    public function createStream($content\
    \ = '');\n    public function createStreamFromFile($filename, $mode = 'r');\n\
    \    public function createStreamFromResource($resource);\n}\n```\n\nAs implementações\
    \ desta interface DEVEM utilizar um fluxo temporário ao criar recursos de cadeia.\
    \ A maneira recomendada para fazer isso é demonstrada no código a seguir:\n\n\
    ```php\n<?php\n$resource = fopen('php://temp', 'r+');\n```\n\n### `Psr\\Http\\\
    Message\\UploadedFileFactoryInterface`\n\nEsta interface possui a responsabilidade\
    \ de criar fluxos para arquivos enviados, ou seja, para uploads de arquivos.\n\
    \n```php<?php\nnamespace Psr\\Http\\Message;\n\nuse Psr\\Http\\Message\\StreamInterface;\n\
    use Psr\\Http\\Message\\UploadedFileInterface;\n\ninterface UploadedFileFactoryInterface\n\
    {\n    public function createUploadedFile(\n        StreamInterface $stream,\n\
    \        int $size = null,\n        int $error = UPLOAD_ERR_OK,\n        string\
    \ $clientFilename = null,\n        string $clientMediaType = null\n    ): UploadedFileInterface;\n\
    }\n```\n\n### `Psr\\Http\\Message\\UriFactoryInterface`\n\nEsta interface possui\
    \ a responsabilidade de criar URIs para requisições de clientes e servidores.\n\
    \n```<?php\nnamespace Psr\\Http\\Message;\n\nuse Psr\\Http\\Message\\UriInterface;\n\
    \ninterface UriFactoryInterface\n{\n    public function createUri($uri = '');\n\
    }\n```\n\n### Conclusão\n\nApesar de esta PSR não ser grande e não possuir definições\
    \ de regras, as interfaces descritas anteriormente possuem a capacidade de criar\
    \ objetos `HTTP` definidos pela PSR-7. No próximo capítulo veremos a PSR-18, que\
    \ descreve interface para enviar e receber requisições `HTTP`.\n\n# Capítulo 18\n\
    \n# Conclusão\n\nComo pudemos ver durante este livro, cada PSR define um conjunto\
    \ de definições e possui as suas características. Vimos como deixar o nosso código\
    \ mais legível com a PSR-2, como podemos implementar um padrão para a escrita\
    \ de logs com a PSR-3, vimos ainda como padronizar nossas requisições com a PSR-7\
    \ e muitas outras boas práticas que poderão tornar a vida dos desenvolvedores\
    \ mais fácil.\n\nPor fim, espero que tenha gostado deste livro e que você tenha\
    \ obtido um excelente conhecimento de boas práticas de programação com o PHP através\
    \ da PHP-FIG e as PSRs.\n\nBoa sorte no mundo da programação em PHP, um abraço\
    \ e até a próxima!\n\n# Capítulo 19\n\n# Referências bibliográficas\n\nBOGGIANO,\
