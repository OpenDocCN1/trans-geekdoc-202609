    \ (\n    $param1,\n    $param2,\n    $param3\n) use (\n    $var1,\n    $var2,\n\
    \    $var3\n) {\n   // Código\n};\n\n$closureComParametrosEUmaVariavel = function\
    \ (\n    $param1,\n    $param2,\n    $param3\n) use ($var1) {\n   // Código\n\
    };\n\n$closureComUmParametroEVariasVariaveis = function ($param1) use (\n    $var1,\n\
    \    $var2,\n    $var3\n) {\n   // Código\n};\n```\n\nPerceba como é realizada\
    \ a indentação e os espaçamento para cada um dos casos. A seguir vamos ver um\
