    \nCapítulo 12 \n\n# PSR-13 (Link Definition Interfaces)\n\nEssa PSR especifica\
    \ uma maneira simples e comum de representar link de hipermídia independentemente\
    \ do formato de serialização utilizado, permitindo que a aplicação serialize uma\
    \ resposta com links de hipermídia em um ou mais formatos.\n\n## 12.1 Regras\n\
    \nNesta seção vamos conhecer as regras que definem a PSR-13, mas antes precisamos\
    \ conhecer algumas características:\n\n**Links básicos** - Um link de hipermídia\
    \ consiste em: um `URI` que representa o recurso de destino que está sendo referenciado\
    \ e um relacionamento que define como o recurso de destino se relaciona com a\
    \ origem. Vários outros atributos do link podem existir dependendo do formato\
    \ utilizado.\n\n*   **Instanciando um objeto** - Um objeto deve ser criado através\
    \ da implementação de uma das interfaces definidas nesta PSR.\n\n*   **Serializador**\
    \ - Uma aplicação que utiliza um ou mais objetos `Link` e produz uma representação\
    \ serializada em algum formato definido.\n\n### Regra 1\n\nTodos os links PODEM\
    \ incluir zero ou mais atributos adicionais além do `URI` e do relacionamento.\
    \ Não há uma descrição dos valores permitidos e a validade dos valores depende\
    \ do contexto e, geralmente, de um formato de serialização específico. Os valores\
    \ comumente suportados são `hreflang`, `title` e `type`.\n\n### Regra 2\n\nSerializadores\
    \ PODEM omitir atributos em um objeto de link caso haja a necessidade, porém,\
    \ os serializadores DEVEM codificar todos os atributos fornecidos, a fim de permitir\
    \ a extensão do usuário a menos que seja impedido pela definição de algum formato\
    \ de serialização.\n\nAlguns atributos (geralmente o `hreflang`) podem aparecer\
    \ mais de uma vez em seu contexto. Portanto, o atributo pode possuir valores em\
    \ forma de `array` (matriz) em vez de valores simples.\n\nOs serializadores PODEM\
    \ codificar esse `array` em qualquer formato apropriado para o formato serializado.\n\
    \n### Regra 3\n\nCaso um determinado atributo não possa ter múltiplos valores\
    \ em seu contexto específico, os serializadores DEVEM utilizar o primeiro valor\
    \ fornecido e ignorar todos os valores subsequentes. Se o atributo possuir um\
    \ valor booleano `true`, os serializadores PODEM usar formas abreviadas, se apropriadas\
    \ e suportadas por algum formato de serialização. Essa regra se aplica se, e somente\
    \ se, o atributo for booleano `true`, ou seja, o valor 1 utilizado como `true`\
    \ não é válido.\n\n### Regra 4\n\nCaso o atributo possua um valor booleano `false`,\
    \ os serializadores DEVEM omitir o atributo, a menos que o significado semântico\
    \ do resultado seja alterado. Esta regra se aplica se, e somente se, o atributo\
    \ for booleano `false`, ou seja, o valor 0 utilizado para representar `false`\
    \ não é válido.\n\n### Regra 5\n\nRelacionamentos de links são definidos como\
    \ string e são simplesmente uma palavra-chave no caso de uma relação definida\
    \ publicamente ou um `URI` absoluto no caso de relações privadas.\n\nCaso uma\
    \ palavra-chave simples seja utilizada, DEVE corresponder a um registro do `IANA\
    \ (http://www.iana.org/assignments/link-relations/link-relations.xhtml)`. Opcionalmente,\
    \ o registro contido em `http://microformats.org/wiki/existing-rel-values` PODE\
    \ ser utilizado, mas pode não ser válido em todos os contextos.\n\n### Regra 6\n\
    \nUm relacionamento que não esteja definido em um dos registros citados anteriormente\
    \ ou em um registro público é considerado privado, isto é, é específico de uma\
    \ determinada aplicação. Essas relações DEVEM utilizar um `URI` absoluto.\n\n\
    ### Regra 7\n\nModelos de link são um padrão para um `URI` que deve ser preenchido\
    \ com valores enviados por um cliente. Alguns formatos de hipermídias suportam\
    \ modelos de links, enquanto outros não, e podem ter uma maneira diferente de\
    \ denotar que um link é um modelo.\n\nUm serializador que não suporta modelos\
    \ de `URI` DEVE ignorar quaisquer links modelados que encontrar.\n\n### Regra\
    \ 8"
