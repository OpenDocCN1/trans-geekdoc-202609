    \ insiram lógica em uma aplicação de maneira fácil e consistente. Então vamos\
    \ nessa!\n\n## Capítulo 13\n\n# PSR-14 (Event Dispatcher)\n\nO principal objetivo\
    \ dessa PSR é estabelecer um mecanismo comum para a extensão e colaboração baseada\
    \ em eventos, de modo que bibliotecas e componentes possam ser reutilizados mais\
    \ livremente entre várias aplicações.\n\nTer interfaces comuns para despachar\
    \ e manipular eventos permite aos desenvolvedores a liberdade de criarem bibliotecas\
    \ que podem interagir com muitas estruturas e outras bibliotecas.\n\nPodemos citar\
    \ alguns exemplos de uso, a seguir:\n\n* Uma estrutura de segurança que impedirá\
    \ a gravação/acesso a dados quando um usuário não possuir permissão.\n* Um sistema\
    \ comum de cache de página inteira.\n* Bibliotecas que estendem outras bibliotecas,\
    \ independentemente de quais estruturas estão integradas.\n* Rastrear todas as\
    \ ações executadas na aplicação.\n\nConhecendo um pouco mais sobre os elementos\
    \ do Event Dispatcher, nós temos:\n\n* `Event` (Evento) - É uma mensagem produzida\
    \ por um emissor. Pode ser qualquer objeto PHP arbitrário.\n* `Listener` (Ouvinte)\
    \ - É qualquer chamada do PHP que espera receber um evento. Zero ou mais ouvintes\
    \ podem ser passados no mesmo evento. Um ouvinte PODE enfileirar algum outro comportamento\
    \ assíncrono, se assim desejar.\n* `Emitter` (Emissor) - É qualquer código arbitrário\
    \ que deseje despachar um evento. Isso também é conhecido como o “código de chamada”.\
    \ Ele não é representado por nenhuma estrutura de dados específica, mas se refere\
    \ ao caso de uso.\n* `Dispatcher` (Despachante) - É um objeto de serviço que recebe\
    \ um objeto `Event` por um `Emitter`. O Despachante é responsável por garantir\
    \ que o evento seja passado a todos os ouvintes relevantes, mas DEVE adiar a determinação\
    \ dos ouvintes responsáveis para um provedor de escuta.\n* `Listener Provider`\
    \ (Provedor de Ouvinte) - É responsável por determinar quais ouvintes são relevantes\
    \ para um determinado evento, mas NÃO DEVE chamar os ouvintes em si. Um `Listener\
    \ Provider` pode especificar zero ou mais ouvintes relevantes.\n\n## 13.1 Regras\n\
    \nVamos conhecer a seguir as regras que definem essa PSR.\n\n### Regra 1\n\nEventos\
    \ são objetos que atuam como a unidade de comunicação entre um `Emitter` (Emissor)\
    \ e `Listener` (Ouvinte) apropriado.\n\nOs objetos `Event` PODEM ser mutáveis,\
    \ ou seja, quando o caso de uso chama os `Listeners` fornecendo informações de\
    \ volta ao `Emitter` (Emissor). Porém, se nenhuma comunicação bidirecional for\
    \ necessária, é RECOMENDADO que o evento seja definido como imutável, isto é,\
    \ definido de tal modo que não tenha métodos de mutação.\n\n### Regra 2\n\nAs\
    \ aplicações DEVEM assumir que o mesmo objeto será passado para todos os `Listeners`.\n\
    \n### Regra 3\n\nÉ RECOMENDADO, MAS NÃO NECESSÁRIO, que os objetos `Event` suportem\
    \ serialização e desserialização sem perdas, ou seja, `$event == unserialize(serialize($event))`\
    \ DEVE ser verdadeiro.\n\n### Regra 4\n\nObjetos PODEM alavancar a interface serializável\
    \ do PHP, os métodos mágicos `__sleep()` ou `__wakeup()` ou a funcionalidade semelhante.\n\
    \n### Regra 5\n\nUm evento `Stoppable` é um caso especial de evento que contém\
    \ formas adicionais de impedir que outros `Listeners` sejam chamados. É indicado\
    \ implementando a interface `StoppableEventInterface`.\n\nUm evento que implementa\
    \ a interface `StoppableEventInterface` DEVE retornar `true` do método `isPropagationStopped()`\
    \ quando o evento que ele representa for concluído. É de responsabilidade da aplicação\
    \ determinar quando o evento deve ou não ser concluído.\n\nPor exemplo, um evento\
    \ que esteja solicitando que um objeto PSR-7 `RequestInterface` seja correspondido\
    \ com um objeto `ResponseInterface` correspondente poderia ter um método `setResponse(ResponseInterface\
    \ $response)` para um `Listener` chamar, o que faria com que o método `isPropagationStopped()`\
    \ retornasse `true`.\n\n### Regra 6\n\nUm `Listener` PODE ser chamado por qualquer\
    \ código PHP. Um `Listener` DEVE ter apenas um parâmetro, que é o evento ao qual\
    \ responde. Os `Listeners` DEVEM indicar a dica desse parâmetro de acordo com\
    \ a relevância do caso de uso. Uma dica do tipo de `Listener` PODE indicar para\
    \ uma interface que é compatível com qualquer tipo de evento que realiza uma implementação\
    \ específica ou não dessa interface.\n\n### Regra 7\n\nUm `Listener` DEVE ter\
    \ um retorno nulo e DEVE informar a dica que retorna explicitamente. Um `Dispatcher`\
    \ deve ignorar os valores de retorno dos `Listeners`.\n\n### Regra 8\n\nUm `Listener`\
    \ PODE delegar ações para outro código. Isso inclui um `Listener` sendo um `wrapper`\
    \ (embrulho) em torno de um objeto que executa a lógica de negócios real.\n\n\
    ### Regra 9\n\nUm `Listener` PODE enfileirar informações do evento para processamento\
    \ posterior por um processo secundário, usando o cron, um servidor de filas ou\
    \ técnicas semelhantes.\n\nUm `Listener` pode serializar o próprio objeto `Event`\
    \ para fazer isso. Um processo secundário DEVE presumir que quaisquer alterações\
    \ feitas em um objeto `Event` NÃO serão propagadas para outros `Listeners`.\n\n\
    ### Regra 10\n"
  trans: "\n\n## 可演化的提供者\n\n链接提供者可能需要向其添加额外链接的能力。在其他情况下，链接提供者是只读的，链接是从其他数据源运行时派生的，因此，`可修改的链接提供者`是一个可选实现的辅助接口。\n\
    \n此外，某些链接提供者对象（如 PSR-7 的响应对象）由于其不可变的设计，其添加链接的方法是完全不兼容的。因此，`Psr\\Link\\EvolvableLinkProviderInterface`\
    \ 定义的方法要求返回一个与原始相同的新对象，但其中包含一个额外的链接对象。\n\n## 可演化的链接对象\n\nPSR-13 允许对象像 PSR-7 对象一样进行演化。因此，包含了一个额外的\
    \ `Psr\\Link\\EvolvableLinkInterface` 对象，并提供了产生具有单一更改的新对象实例的方法。\n\n得益于 PHP 的 `copy-on-write`\
    \ 行为，这在 `CPU` 和内存方面仍然是高效的。模型没有演化方法，但由于值是链接的模型，因此它完全基于 `href` 的值。\n\n可演化的链接对象不应被独立定义。\n\
    \n## 12.2 接口\n\n现在我们已经了此 PSR 的规则，接下来让我们了解该包包含的接口。\n\n### `Psr\\Link\\LinkInterface`\n\
    \n```php\n<?php\n\nnamespace Psr\\Link;\n\ninterface LinkInterface\n{\n    public\
    \ function getHref();\n    public function isTemplated();\n    public function\
    \ getRels();\n    public function getAttributes();\n}\n```\n\n### `Psr\\Link\\\
    EvolvableLinkInterface`\n\n```php\n<?php\n\nnamespace Psr\\Link;\n\ninterface\
    \ EvolvableLinkInterface extends LinkInterface\n{\n    public function withHref($href);\n\
    \    public function withRel($rel);\n    public function withoutRel($rel);\n \
    \   public function withAttribute($attribute, $value);\n    public function withoutAttribute($attribute);\n\
    }\n```\n\n### `Psr\\Link\\LinkProviderInterface`\n\n```php\n<?php\n\nnamespace\
    \ Psr\\Link;\n\ninterface LinkProviderInterface\n{\n    public function getLinks();\n\
    \    public function getLinksByRel($rel);\n}\n```\n\n### `Psr\\Link\\EvolvableLinkProviderInterface`\n\
    \n```php\n<?php\n\nnamespace Psr\\Link;\n\ninterface EvolvableLinkProviderInterface\
    \ extends LinkProviderInterface\n{\n    public function withLink(LinkInterface\
    \ $link);\n    public function withoutLink(LinkInterface $link);\n}\n```\n\n###\
    \ 结论\n\n我们到达了 PSR-13 的结尾，它定义了一组用于定义链接的接口。PSR 本身并不大，看起来有些混乱，但在实践中，当应用这些概念时，它并不复杂。\n\
    \n在下一章节我们将讨论 PSR-14，它涉及 `Event Dispatcher`（事件分发器）概念，允许开发者以简单一致的方式向应用程序中插入逻辑。让我们开始吧！\n\
    \n## 第 13 章\n\n# PSR-14 (事件分发器)\n\n此 PSR 的主要目标是建立一种基于事件的扩展和协作机制，以便库和组件可以在多个应用程序之间更自由地重用。\n\
    \n分发和处理事件的通用接口允许开发者能够自由创建可以与许多结构和其他库交互的库。\n\n我们可以列出以下用法示例：\n\n*   一个安全结构，当用户没有权限时阻止数据的写入/访问。\n\
    *   一个常见的全页缓存系统。\n*   扩展其他库的库，无论集成了哪些结构。\n*   跟踪应用程序中执行的所有操作。\n\n通过更多了解事件分发器的元素，我们有：\n\
    \n*   `Event` (事件) - 由发送者产生的消息。它可以是任意的 PHP 对象。\n*   `Listener` (监听器) - 任何等待接收事件的\
    \ PHP 调用。零或多个监听器可以传递给同一个事件。如果需要，一个监听器可以队列其他异步行为。\n*   `Emitter` (发送者) - 任何想要发送事件的任意代码。这被称为“调用代码”。它不由特定的数据结构表示，而是指的是用例。\n\
    *   `Dispatcher` (分发器) - 一个通过 `Emitter` 接收 `Event` 对象的服务对象。分发器负责确保事件传递给所有相关的监听器，但必须将确定相关监听器的任务交给监听器提供者。\n\
    *   `Listener Provider` (监听器提供者) - 负责确定哪些监听器与特定事件相关，但不应调用监听器本身。`Listener Provider`\
    \ 可以指定零或多个相关的监听器。\n\n## 13.1 规则\n\n接下来我们将了解定义此 PSR 的规则。\n\n### 规则 1\n\n事件是充当 `Emitter`\
    \ (发送者) 和适当 `Listener` (监听器) 之间通信单元的对象。\n\n`Event` 对象可以是可变的，即当用例调用 `Listeners`\
    \ 并向 `Emitter` (发送者) 提供反馈时。然而，如果不需要双向通信，建议将事件定义为不可变的，即定义为不具有突变方法的状态。\n\n### 规则\
    \ 2\n\n应用程序必须假设传递所有 `Listeners` 的同一个对象。\n\n### 规则 3\n\n建议但并非必须 `Event` 对象支持无损序列化和反序列化，即\
    \ `$event == unserialize(serialize($event))` 必须为真。\n\n### 规则 4\n\n对象可以利用 PHP 的可序列化接口、魔术方法\
    \ `__sleep()` 或 `__wakeup()` 或类似的功能。\n\n### 规则 5\n\n`Stoppable` 事件是一种特殊的事件，它包含了阻止其他\
    \ `Listeners` 被调用的额外形式。建议通过实现 `StoppableEventInterface` 接口来实现。\n\n实现 `StoppableEventInterface`\
    \ 接口的事件在其所代表的事件完成时，必须从 `isPropagationStopped()` 方法返回 `true`。确定何时结束事件是应用程序的责任。\n\
    \n例如，一个请求 PSR-7 `RequestInterface` 对象匹配对应 `ResponseInterface` 对象的事件可以有一个 `setResponse(ResponseInterface\
    \ $response)` 方法供 `Listener` 调用，这将导致 `isPropagationStopped()` 返回 `true`。\n\n###\
    \ 规则 6\n\n`Listener` 可以被任何 PHP 代码调用。`Listener` 必须只有一个参数，该参数是它响应的事件。`Listeners`\
    \ 应该根据用例的相关性指示该参数的类型提示。`Listener` 类型提示可以指向一个接口，该接口兼容任何实现或特定的事件类型。\n\n### 规则 7\n\
    \n`Listener` 必须返回空且必须显式指示返回类型。`Dispatcher` 应该忽略 `Listeners` 的返回值。\n\n### 规则 8\n\
    \n`Listener` 可以将操作委托给其他代码。这包括 `Listener` 成为执行实际业务逻辑对象的 `wrapper`（包装器）。\n\n###\
    \ 规则 9\n\n`Listener` 可以将事件信息放入队列，以便以后由辅助进程进行处理，使用 cron 任务、队列服务器或类似技术。\n\n`Listener`\
    \ 可以通过序列化 `Event` 对象本身来实现此操作。辅助进程必须假设对 `Event` 对象所做的任何更改都不会传播到其他 `Listeners`。\n\
    \n### 规则 10\n\n"
