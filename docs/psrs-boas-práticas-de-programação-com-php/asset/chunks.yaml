    \n        public function defineHeaderValues()\n        {\n            $mensagem\
    \ = $this->mensagem->withHeader('authorization', 'Bearer AbcDef1234@#')\n    \
    \            ->withAddedHeader('authorization', 'Bearer 1234567890')\n\n     \
    \       $cabecalhoString = $mensagem->getHeaderLine('authoriation');\n       \
    \     //Retorna 'Bearer AbcDef1234@#, Bearer 1234567890'\n\n            $cabecalho\
    \ = $mensagem->getHeader('authorization');\n            //Retorna ['Bearer AbcDef1234@#',\
    \ 'Bearer 1234567890']\n        }\n    }\n```\n\nConforme podemos ver, definimos\
    \ dois valores para um mesmo cabeçalho e os recuperamos de duas formas diferentes,\
    \ em forma de `array` e em forma de `string`.\n\nUma observação muito importante\
    \ a ser considerada é que nem todos os valores podem ser concatenados usando uma\
    \ vírgula (por exemplo, `Set-Cookie`).\n\nQuando for trabalhar com esses cabeçalhos,\
    \ a aplicação DEVE confiar no método `getHeader()` que está contido na interface\
    \ `Psr\\Http\\Message\\MessageInterface` para obter esses cabeçalhos com múltiplos\
    \ valores.\n\nEm requisições, o cabeçalho do host espelha o componente de host\
    \ do URI (*Uniform Resource Identifier* ou Identificador de Recursos Universal,\
    \ em português), assim como o host utilizado ao estabelecer a conexão TCP (*Transmission\
    \ Control Protocol* ou Protocolo de Controle de Transmissão).\n\nNo entanto, a\
    \ especificação do HTTP permite que o cabeçalho de host seja diferente de cada\
    \ um dos dois. As aplicações DEVEM tentar definir o cabeçalho de host de um URI\
    \ se nenhum cabeçalho dele for definido.\n\nPor padrão, o método `withUri()` definido\
    \ na interface `Psr\\Http\\Message\\RequestInterface` substituirá o pedido retornado\
    \ com um cabeçalho de host correspondente ao componente do host passado.\n\nVocê\
    \ poderá optar por preservar o estado original do cabeçalho do host passando `true`\
    \ para o segundo parâmetro do método `withUri()`.\n\nQuando esse parâmetro é definido\
    \ como `true`, o pedido retornado não atualizará o cabeçalho do host retornado\
    \ pela mensagem, a menos que ela não possua um cabeçalho de host definido.\n\n\
    ### Regra 3\n\n**Streams (Fluxos)** - As mensagens HTTP consistem em uma linha\
    \ inicial (método), cabeçalhos e um corpo, sendo que o corpo de uma mensagem HTTP\
    \ pode possuir tamanhos variados, desde muito pequeno a extremamente grande.\n\
    \nAo tentar representar o corpo de uma mensagem como uma `string`, por exemplo,\
    \ a aplicação facilmente consome mais memória do que o necessário. Isso ocorre\
    \ porque o corpo dessa mensagem deve ser armazenado completamente na memória.\n\
    \nSe a aplicação tentasse persistir o corpo de uma resposta ou requisição muito\
    \ grande na memória, isso impossibilitaria a utilização dessa solução, pois facilmente\
