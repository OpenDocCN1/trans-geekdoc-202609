- raw: "**Uso recomendado** - Os desenvolvedores NÃO DEVEM passar um contêiner em\
    \ um objeto para que este objeto possa recuperar suas próprias dependências. Isso\
    \ significa que o contêiner é usado como um localizador de serviço (`Service Locator`),\
    \ ou seja, ele localizará ou não um determinado serviço através do nome informado.\n\
    \nSe o nome informado existir, então pode-se retornar a instância do objeto pertencente\
    \ ao serviço. Por exemplo, temos um contêiner chamado `usuario` que retorna a\
    \ instância de um serviço chamado `Usuario`.\n\n## 9.2 Interfaces\n\nAgora que\
    \ conhecemos as regras para sua utilização, vamos conhecer as três interfaces\
    \ que fazem parte desse pacote.\n\n### `Psr\\Container\\ContainerInterface`\n\n\
    ```\n<?php\n\nnamespace Psr\\Container;\n\ninterface ContainerInterface\n{   \
    \ \n    public function get($id);\n    public function has($id);\n}\n```\n\n###\
    \ `Psr\\Container\\ContainerExceptionInterface`\n\n```\n<?php\n\nnamespace Psr\\\
    Container;\n\ninterface ContainerExceptionInterface\n{\n}\n```\n\n### `Psr\\Container\\\
    NotFoundExceptionInterface`\n\n```\n<?php\n\nnamespace Psr\\Container;\n\ninterface\
    \ NotFoundExceptionInterface extends ContainerExceptionInterface\n{\n}\n```\n\n\
    ### Conclusão\n\nComo você pôde perceber, essa PSR define uma única interface\
    \ usada para injeção de dependências através de contêineres. Ela é bem simples,\
    \ possui apenas dois métodos, `get()` e `has()`, que são utilizados para obter\
    \ e verificar as informações respectivamente.\n\nNo próximo capítulo falaremos\
    \ sobre a PSR-12, que é uma extensão da PSR-2 e que possui novas regras de formatação\
    \ compatíveis com as novas funcionalidades do PHP 7, então vamos nessa!\n\nCapítulo\
    \ 10 \n\n# PSR-12 (Extended Coding Style) - Parte I\n\nA PSR-12 é uma extensão\
    \ da PSR-2 e possui o mesmo objetivo que ela, porém com um contexto mais moderno\
    \ e novas funcionalidades que seguem a evolução do PHP. Se pararmos para pensar,\
    \ a PSR-2 foi aceita em 2012 e desde então vinha sofrendo atualizações para acompanhar\
    \ a evolução do PHP e fazer com que o código pudesse ser interpretado de maneira\
    \ mais eficaz entre os desenvolvedores. Como o PHP 7 teve muitas mudanças, a reescrita\
    \ da PSR-2 em uma nova PSR foi necessária para atender a todas as novidades disponíveis\
    \ no PHP 7.\n\nVeremos na seção a seguir quais são as regras, os conceitos e como\
    \ aplicá-los em seu projeto para que se obtenha um código mais bonito e legível\
    \ compatível com o PHP 7 e suas funcionalidades.\n\nVale ressaltar que a PSR-2\
    \ foi descontinuada, mas não foi removida deste livro por questões didáticas e\
    \ de entendimento, pois assim você poderá notar as diferenças entre ambas, PSR-2\
    \ e PSR-12.\n\n## 10.1 Regras\n\nConfira nesta seção todas as regras e características\
    \ dessa PSR.\n\n### Regra 1\n\nOs códigos PHP DEVEM seguir os padrões estabelecidos\
    \ na PSR-1 (`Basic Code Standard`). Por ser uma extensão da PSR-1, seu código\
    \ primeiramente deve estar em conformidade com a PSR-1 antes de aplicar a PSR-2.\n\
    \nO termo `StudlyCaps` no PSR-1 DEVE ser interpretado como `PascalCase`, onde\
    \ a primeira letra de cada palavra é maiúscula.\n\n### Regra 2\n\nArquivos PHP\
    \ DEVEM possuir o padrão UNIX de terminação de linha. Você sabe quais são as terminações\
    \ de linhas disponíveis? Caso não, vejamos a seguir:\n\n*   **CRLF**: retorno\
    \ de carro + avanço de linha, Unicode caracteres D + 000A 000\n\n*   **LF**: alimentação\
    \ de linha, caracteres Unicode 000A\n\n*   **NEL**: próxima linha, o caractere\
    \ Unicode 0085\n\n*   **LS**: separador de linha, caractere Unicode 2028\n\n*\
    \   **PS**: separador de parágrafo, caractere Unicode 2029\n\nO padrão UNIX adotado\
    \ pela PSR-12 é o LF. Geralmente, as IDEs já vêm configuradas para o padrão UNIX,\
    \ mas isso pode ser alterado facilmente dependendo da IDE utilizada.\n\n### Regra\
    \ 3\n\nArquivos contendo apenas código PHP DEVEM possuir uma linha em branco ao\
    \ final. Após toda a lógica aplicada, deve haver uma linha em branco ao final\
    \ do arquivo. Veja o exemplo a seguir, que demonstra a aplicação dessa regra:\n\
    \n```\n1.<?php\n2.class Usuario\n3.{\n4.    private $nome;\n5.\n6.    public function\
    \ __construct($nome)\n7.    {\n8.        $this->nome = $nome;\n9.    }\n10.}\n\
    11.//Linha em branco, sem espaços\n```\n\n### Regra 4\n\nArquivos contendo apenas\
    \ PHP DEVEM ter a TAG de fechamento omitida. Pode parecer estranho no primeiro\
    \ momento, mas o seu script PHP não vai deixar de funcionar se a TAG de fechamento\
    \ (`?>`) for omitida. A regra não se aplica aos arquivos contendo HTML + PHP.\
    \ Para facilitar o entendimento, vamos ver o exemplo a seguir que demonstra a\
    \ forma correta de aplicar essa regra:\n\n```\n<?php\nclass Usuario\n{\n    private\
    \ $nome;\n\n    public function __construct($nome)\n    {\n        $this->nome\
    \ = $nome;\n    }\n}\n```\n\nPerceba que a TAG de fechamento (`?>`) foi omitida\
    \ e isso não afeta o funcionamento do código. Agora vamos analisar o exemplo em\
    \ que a omissão da TAG ocasionará em erro no código:\n\n```\n<?php\n$nome = 'Jhones\
    \ S. Clementino';\n\n<html>\n    <head>\n        <title>Teste</title>\n    </head>\n\
    \    <body>\n        <h1>Olá, <?php echo $nome</span>!</h1>\n    </body>\n</html>\n\
    ```\n\nDiferentemente do exemplo anterior, a omissão da TAG de fechamento do PHP\
    \ (`?>`) ocasionará erro após a declaração da variável `$nome`, isso porque o\
    \ arquivo não possui apenas código PHP.\n\n### Regra 5\n\nO comprimento máximo\
    \ de uma linha de código DEVE ser de 120 caracteres. Verificadores de estilo automatizado\
    \ DEVEM avisar, mas NÃO DEVEM exibir erro.\n\nAs linhas de código NÃO DEVEM ter\
    \ mais de 80 caracteres. Linhas de código mais longas DEVEM ser quebradas em várias\
    \ linhas subsequentes de no máximo 80 caracteres.\n\nPode parecer estranha a explicação,\
    \ mas faz todo o sentido. Em sistemas legados, principalmente, há linhas com mais\
    \ de 1000 caracteres de comprimento - acredite, não é exagero! Já trabalhei em\
    \ sistemas desse tipo e é complicado dar manutenção nesse tipo de código.\n\n\
    Portanto, atente-se para que a cada 80 caracteres você possa quebrar a linha de\
    \ modo que fique legível e, caso não consiga, você ainda possui o limite de 120\
    \ caracteres.\n\nNão é um erro, mas se quiser seguir o padrão da PSR-12 e manter\
    \ suas boas práticas é muito importante atentar-se a mais esta regra.\n\n### Regra\
    \ 6\n\nLinhas que possuem conteúdo NÃO DEVEM possuir espaços em branco ao final\
    \ de seu conteúdo.\n\n### Regra 7\n\nPara facilitar a interpretação do código,\
    \ linhas em branco PODEM ser adicionadas. Você pode adicionar linhas em branco\
    \ para tornar a interpretação do código mais fácil. Vamos ver a seguir um breve\
    \ exemplo da aplicação dessa regra:\n\n```\n<?php\n\nclass Usuario \n{\n    private\
    \ $nome;\n\n     private $idade;\n\n     private $sexo;\n\n    public function\
    \ __construct($nome, $idade, $sexo)\n    {\n          $this->nome = $nome;\n \
    \        $this->idade = $idade;         \n\n         if ($sexo == 'M') {\n   \
    \         $this->sexo = 'Masculino';\n        } elseif ($sexo == 'F') {\n    \
    \        $this->sexo = 'Feminino';\n        }\n    }\n}\n```\n\nPerceba como o\
    \ código ficou legível com a aplicação das quebras de linha. Agora veja o exemplo\
    \ a seguir, em que não existe quebra de linha na escrita da lógica:\n\n```\n<?php\n\
    \nclass Usuario \n{\n    private $nome;\n     private $idade;\n     private $sexo;\n\
    \    public function __construct($nome, $idade, $sexo)\n    {\n          $this->nome\
    \ = $nome;\n         $this->idade = $idade;         \n         if ($sexo == 'M')\
    \ {\n            $this->sexo = 'Masculino';\n        } elseif ($sexo == 'F') {\n\
    \            $this->sexo = 'Feminino';\n        }\n    }\n}\n```\n\nO código anterior\
    \ funciona sem nenhum problema, mas perceba como fica um pouco estranho e de certa\
    \ forma um pouco difícil de entender principalmente a separação entre os atributos\
    \ da classe e o método construtor.\n\n### Regra 8\n\nNÃO DEVE haver múltiplas\
    \ declarações em uma única linha. Cada declaração de variável deve ser feita em\
    \ uma nova linha. Ou seja, definiu uma variável? Então pule uma linha para definir\
    \ a próxima variável.\n\nVamos ver o exemplo a seguir que demonstra a maneira\
    \ considerada correta ao declarar uma variável seguindo o padrão da PSR-12:\n\n\
    ```\n<?php\n$nome = 'Jhones';\n$sobrenome = 'S. Clementino';\n```"
