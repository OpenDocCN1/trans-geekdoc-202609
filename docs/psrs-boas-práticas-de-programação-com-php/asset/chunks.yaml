    \ do servidor também pode fornecer mensagens entre vários pedidos.\n\n**Upload\
    \ de arquivos** - A interface `Psr\\Http\\Message\\ServerRequestInterface` especifica\
    \ um método para recuperar uma árvore de arquivos decorrentes de uploads em uma\
    \ estrutura onde cada folha é uma instância de `Psr\\Http\\Message\\UploadFileInterface`.\n\
    \nÉ importante ressaltar que a variável superglobal `$_FILES` possui alguns problemas\
    \ ao lidar com `arrays` de entradas de arquivos, por exemplo, se a aplicação enviar\
