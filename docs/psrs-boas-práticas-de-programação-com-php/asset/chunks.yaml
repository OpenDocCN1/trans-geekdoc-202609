    \n```\n<?php\n\n$object->method(\n    $param1,\n    function ($param2) use ($var1)\
    \ {\n        // Código\n    },\n    $param3\n);\n```\n\n### Regra 44\n\nClasses\
    \ anônimas DEVEM seguir as mesmas diretrizes e princípios que os fechamentos que\
    \ vimos anteriormente. Vamos ver um exemplo de como definir uma classe anônima\
