    \ function updateAction($id, array $dados)\n    {         \n        return function\
    \ (\n            $atualizado, \n            $usuario \n        ) use (\n     \
    \       $id,\n            $dados\n        ) {\n            //Código\n        }\n\
    \    }\n}\n```\n\nVamos analisar um exemplo considerado incorreto:\n\n```php\n\
    <?php\n\nnamespace App\\Controller\\Usuario;\n\nclass UsuarioController\n{   \
    \     \n    public function updateAction($id, array $dados)\n    {         \n\
    \        return function ($atualizado, \n            $usuario) use ($id,\n   \
    \         $dados) {\n            //Código\n        }\n    }\n}\n```\n"
  trans: "\n\n```php\n<?php\n\nnamespace App\\Sercice;\n\nclass AbstractService\n\
    {        \n    protected function update($id, array $dados)\n    {         \n\
    \        foreach ($dados as $key => $value) {\n            //Código\n        }\n\
    \    }\n}\n```\n\n此示例与应用于 `for` 的示例类似，相同的间距规则也适用于 `foreach`。此示例包含了 PSR-12 认为正确的间距，并且应该被使用。\n\
    \n现在我们来分析同一个示例，但在缺少间距的情况下，这被认为是错误的：\n\n```php\n<?php\n\nnamespace App\\Sercice;\n\
    \nclass AbstractService\n{        \n    protected function update($id, array $dados)\n\
    \    {         \n        foreach($dados as $key=>$value){\n            //Código\n\
    \        }\n    }\n}\n```\n\n到此为止并没有特别的，该示例运行正常，但由于定义中缺少空格，它被 PSR-12 认为是不正确的。\n\
    \n## 使用 `try`、`catch`、`finally` 的示例\n\n```php\n<?php\n\nnamespace App\\Sercice;\n\
    \nclass AbstractService\n{        \n    protected function update($id, array $dados)\n\
    \    {         \n        try {\n            //Código\n        } catch (\\InvalidArgumentException\
    \ $e) {\n            //Código\n        } catch (\\ArithmeticError | \\Exception\
    \ $e) {\n            //Código\n        } finally {\n            //Código\n   \
    \     }\n    }\n}\n```\n\n当需要使用 `try catch` 或 `try catch finally` 块时，它必须具有上一个示例所示的间距和缩进结构。\n\
    \n在关键字 `try` 之后，在大括号 `{` 之前**必须**存在一个空格，在闭括号 `}` 之后**必须**存在一个空格。\n\n对于每个 `catch`\
    \ 块，在关键字 `catch` 之后**必须**存在一个空格，在 `)` 之后**必须**存在一个空格。\n\n同样适用于 `finally`（如果存在），在关键字\
    \ `finally` 之后，在块的大括号 `{` 之前**必须**存在一个空格。\n\n此示例完全符合 PSR-12 规则。我们来分析一个没有遵循该规则且被认为错误的示例：\n\
    \n```php\n<?php\n\nnamespace App\\Sercice;\n\nclass AbstractService\n{       \
    \ \n    protected function update($id, array $dados)\n    {         \n       \
    \ try{\n            //Código\n        }\n        catch(\\InvalidArgumentException\
    \ $e){\n            //Código\n        }\n        catch(\\ArithmeticError|Exception\
    \ $e){\n            //Código\n        }\n        finally{\n            //Código\n\
    \        }\n    }\n}\n```\n\n在上面的示例中，所有代码都被更改了，在应该有间距的地方没有间距，缩进也是错误的，不被 PSR-12\
    \ 接受。\n\n## 规则 40\n\n运算符的样式规则根据它们使用的操作数数量进行分组。\n\n当运算符周围允许有空格时，可以使用多个空格来提高可读性。\n\
    \n### 一元运算符\n\n递增/递减运算符**不应该**在运算符和操作数之间留空格。下面的示例演示了该规则的应用：\n\n```php\n<?php\n\
    \n$i++;\n++$j;\n\n$i--;\n--$i\n```\n\n该规则规定在 `$i` 和运算符 `++` 之间不应该有空格。对于这两个变量的其他变体也是如此。\n\
    \n下面的示例演示了 PSR-12 认为错误的方式：\n\n```php\n<?php\n\n$i ++;\n++ $j;\n\n$i --;\n-- $i\n\
    ```\n\n类型转换运算符在括号之间**不应该**有任何空格：\n\n```php\n<?php\n\nnamespace App\\Sercice;\n\
    \nclass AbstractService\n{        \n    protected function update($id, array $dados)\n\
    \    {         \n        (int) $id\n    }\n}\n```\n\n注意在将 `$id` 转换为整数 `int` 时，括号内没有任何间距。这是\
    \ PSR-12 认为正确的做法，大多数开发者都这样做。错误的方式如下：\n\n```php\n<?php\n\nnamespace App\\Sercice;\n\
    \nclass AbstractService\n{        \n    protected function update($id, array $dados)\n\
    \    {         \n        (int)$id;\n    }\n```## 二元运算符\n\n所有的算术、比较、赋值、位运算、逻辑运算符**必须**在前面和后面至少有一个空格。正确示例如下：\n\
    \n```php\n<?php\n\nnamespace App\\Sercice;\n\nclass AbstractService\n{       \
    \ \n    protected function update($id, array $dados)\n    {         \n       \
    \ $result = $id + $dados;\n    }\n}\n```\n\n注意在运算符定义前后有空格，这是有效的。现在我们来看看被 PSR-12\
    \ 认为错误的方式：\n\n```php\n<?php\n\nnamespace App\\Sercice;\n\nclass AbstractService\n\
    {        \n    protected function update($id, array $dados)\n    {         \n\
    \        $result=$id+$dados;\n    }\n}\n```## 三元运算符\n\n条件运算符（简单称为三元运算符）**必须**在\
    \ `?` 和 `:` 周围至少各有一个空格。正确示例如下：\n\n```php\n<?php\n\nnamespace App\\Sercice;\n\n\
    class AbstractService\n{        \n    protected function update($id, array $dados)\n\
    \    {         \n        $result = $id ? $dados : 0;\n    }\n}\n```\n\n注意移除空格会使代码变得难以易读：\n\
    \n```php\n<?php\n\nnamespace App\\Sercice;\n\nclass AbstractService\n{       \
    \ \n    protected function update($id, array $dados)\n    {         \n       \
    \ $result=$id?$dados:0;\n    }\n}\n```\n\n当条件运算符中间的操作数被省略时，运算符**必须**遵循与二元相同的规则。正确示例如下：\n\
    \n```php\n<?php\n\nnamespace App\\Sercice;\n\nclass AbstractService\n{       \
    \ \n    protected function update($id, array $dados)\n    {         \n       \
    \ $result = $id ?: 0;\n    }\n}\n\n## 规则 41\n\n与方法一样，`closure`（匿名函数）的参数列表**可以**拆分成多行，且每行都**必须**缩进一次。\n\
    \n每当发生时，第一个参数**必须**位于下一行，并且每行仅有一个参数。\n\n当参数列表拆分为多行时，闭括号 `)` 和开启的大括号 `{` **必须**在同一行，两者之间仅包含一个空格。正确示例如下：\n\
    \n```php\n<?php\n\nnamespace App\\Controller\\Usuario;\n\nclass UsuarioController\n\
    {        \n    public function updateAction($id, array $dados)\n    {        \
    \ \n        return function (\n            $atualizado, \n            $usuario\
    \ \n        ) use (\n            $id,\n            $dados\n        ) {\n     \
    \       //Código\n        }\n    }\n}\n```\n\n我们来分析一个认为错误的示例：\n\n```php\n<?php\n\
    \nnamespace App\\Controller\\Usuario;\n\nclass UsuarioController\n{        \n\
    \    public function updateAction($id, array $dados)\n    {         \n       \
    \ return function ($atualizado, \n            $usuario) use ($id,\n          \
    \  $dados) {\n            //Código\n        }\n    }\n}\n```\n\n"
