- raw: "**Generating Responses (Gerando Respostas)** - É RECOMENDADO que qualquer\
    \ manipulador de middleware ou de requisição que gere uma resposta componha um\
    \ modelo de resposta baseado na PSR-7, implementando a interface `Psr\\Http\\\
    Message\\ResponseInterface` ou até mesmo uma `factory` (fábrica) capaz de gerar\
    \ uma instância de `Psr\\Http\\Message\\ResponseInterface`, evitando a dependência\
    \ de uma implementação específica de mensagem HTTP.\n\n### Regra 4\n\n**Handling\
    \ Exceptions (Tratamento de Exceções)** - É RECOMENDADO que qualquer aplicação\
    \ que utilizar o middleware inclua um componente responsável por realizar a captura\
    \ das exceções e as converta em respostas. Este middleware DEVE ser o primeiro\
    \ componente a ser executado e envolver todo o processamento adicional para garantir\
    \ que uma resposta seja sempre gerada.\n\nEssas são as regras que a PSR-15 define.\
    \ Não é nada complicado e é tecnicamente muito simples de implementar em sua aplicação.\
    \ A maioria dos frameworks e microframeworks já possui suporte a essa PSR, basta\
    \ você desenvolver a lógica da sua aplicação e seguir as regras conforme estipuladas,\
    \ ok?\n\n## 14.2 Interfaces\n\nA seguir vamos conhecer as interfaces que fazem\
    \ parte desse pacote.\n\n### `Psr\\Http\\Server\\RequestHandlerInterface`\n\n\
    ```\n<?php\n\nnamespace Psr\\Http\\Server;\n\nuse Psr\\Http\\Message\\ResponseInterface;\n\
    use Psr\\Http\\Message\\ServerRequestInterface;\n\ninterface RequestHandlerInterface\n\
    {    \n    public function handle(ServerRequestInterface $request): ResponseInterface;\n\
    }\n```\n\n### `Psr\\Http\\Server\\MiddlewareInterface`\n\n```\n<?php\n\nnamespace\
    \ Psr\\Http\\Server;\n\nuse Psr\\Http\\Message\\ResponseInterface;\nuse Psr\\\
    Http\\Message\\ServerRequestInterface;\n\ninterface MiddlewareInterface\n{   \
    \ \n    public function process(ServerRequestInterface $request, RequestHandlerInterface\
    \ $handler): ResponseInterface;\n}\n```\n\n### Conclusão\n\nConforme você pôde\
    \ ver, são duas interfaces bem simples que não possuem muitos métodos e com isso\
    \ chegamos ao final da PSR-15 que definem os conceitos de middlewares e manipuladores\
    \ de requisição para que sua aplicação possa ou não delegar os dados para um outro\
    \ middleware.\n\nEm nosso próximo capítulo vamos falar da PSR-16, que define interfaces\
    \ comuns para aplicações de cache, vamos nessa!\n\nCapítulo 15 \n\n# PSR-16 (Common\
    \ Interface for Caching Libraries)\n\nEssa PSR possui o objetivo de descrever\
    \ uma interface simples, porém extensível para um item de cache e um driver de\
    \ cache, sendo que as implementações finais PODEM decorar os objetos com mais\
    \ funcionalidades do que o que foi proposto, mas estes DEVEM realizar a implementação\
    \ das funcionalidades da interface primeiro.\n\nO cache é uma maneira de melhorar\
    \ o desempenho de qualquer aplicação, tornando aplicações/bibliotecas de cache\
    \ uma das características mais comuns de muitos frameworks. Obter interoperabilidade\
    \ neste nível significa que podemos realizar a implementação de cache específico\
    \ para a aplicação e confiar no que é enviado ao cache pelo framework ou qualquer\
    \ outra biblioteca de cache.\n\nÉ importante mencionar que a PSR-6 já atende perfeitamente\
    \ esse problema, porém de maneira bem detalhada. O que é abordado aqui na PSR-16\
    \ é uma maneira mais simples que visa construir uma interface simplificada padronizada\
    \ para os casos comuns, além disso, é independente da PSR-6 e foi projetada para\
    \ ter compatibilidade com ela de maneira simples.\n\n## 15.1 Regras\n\nVamos conhecer\
    \ a seguir a regras que a PSR-16 define para entendermos melhor.\n\n### Regra\
    \ 1\n\n**Calling Library (Chamando na Aplicação)** - A aplicação ou o código que\
    \ realmente precisar utilizar os serviços de cache deverá implementar a interface\
    \ padrão `Psr\\SimpleCache\\CacheInterface`, caso contrário, não saberá da existência\
    \ do serviço de cache.\n\n### Regra 2\n\n**Implementing Library (Implementando\
    \ na Aplicação)** - A aplicação é responsável por implementar o padrão estabelecido\
    \ pela PSR com o objetivo de fornecer os serviços de cache para qualquer aplicação\
    \ ou código de forma simples. A implementação DEVE prover a classe que implementa\
    \ a interface `Psr\\SimpleCache\\CacheInterface`. A implementação de bibliotecas\
    \ DEVE suportar ao menos a funcionalidade `TTL (Time To Live)`.\n\n### Regra 3\n\
    \n**TTL (Time To Live)** - Cada item de cache possui o que chamamos de tempo de\
    \ vida, esse tempo é o que define se determinado item está obsoleto ou não. O\
    \ `TTL` é definido por um número inteiro que representa o tempo em segundos ou\
    \ por um objeto `DateInterval`.\n\n### Regra 4\n\n**Expiration (Expiração)** -\
    \ É o tempo definido para que o cache se torne obsoleto, geralmente é calculado\
    \ adicionando o `TTL (Time To Live)` ao tempo em que um determinado objeto é armazenado.\
    \ O tempo também pode ser adicionado através de um objeto `DateTime`, por exemplo,\
    \ um item de cache com um `TTL (Time To Live)` de 300 segundos que foi armazenado\
    \ às 09:00:00 terá um tempo de expiração em 09:05:00, ou seja, terá um tempo de\
    \ 5 minutos antes de tornar-se obsoleto.\n\nA aplicação PODE expirar um item antes\
    \ de seu tempo de expiração definido, porém DEVE tratar um determinado item como\
    \ expirado quando o seu tempo de expiração for atingido. Se a aplicação passar\
    \ um item para ser armazenado e não especificar um tempo de expiração ou `TTL\
    \ (Time To Live)`, ela PODE utilizar um tempo de expiração padrão.\n\nCaso nenhum\
    \ tempo de duração for definido, então a aplicação DEVE interpretar como uma solicitação\
    \ para armazenar o item em cache para sempre ou pelo tempo em que a implementação\
    \ suportar.\n\n### Regra 5\n\n**Key (Chave)** - É a chave que define um item de\
    \ cache, e esse nome deve ser exclusivo para cada item de cache. As bibliotecas\
    \ DEVEM suportar as chaves que consistam nos caracteres de A-Z, a-z, 0-9, undescore\
    \ (`_`) e ponto (`.`), e em qualquer ordem na codificação UTF-8, sendo que o nome\
    \ da chave deve ter um comprimento de no máximo 64 caracteres.\n\nA aplicação\
    \ que implementar PODE suportar outros caracteres, outras codificações e/ou um\
    \ nome de chave com um comprimento maior. A aplicação também será responsável\
    \ por escapar a sequência de caracteres conforme a necessidade, mas DEVE retornar\
    \ a sequência original da chave sem nenhum tipo de modificação.\n\nOs caracteres\
    \ `{`, `}`, `(`, `)`, `/`, `\\`, `@`, `:` NÃO DEVEM ser suportados pela aplicação,\
    \ isso porque são reservados para extensões futuras.\n\n### Regra 6\n\n**Cache**\
    \ - Um objeto que implementa a interface `Psr\\SimpleCache\\CacheInterface`.\n\
    \n### Regra 7\n\n**Cache Misses** - Um erro de cache retornará `null` (nulo),\
    \ portanto, detectar se um valor nulo está armazenado é impossível.\n\n### Regra\
    \ 8\n\n**A aplicação que realizar a implementação PODE fornecer um mecanismo para\
    \ que o desenvolvedor possa especificar um padrão `TTL`** - Caso nenhum valor\
    \ seja especificado para um item de cache, a aplicação DEVE utilizar como valor\
    \ padrão o valor máximo permitido pela implementação subjacente. Caso a implementação\
    \ subjacente não possua suporte ao `TTL`, o valor especificado pelo desenvolvedor\
    \ para o `TTL` DEVE ser ignorado.\n\n### Regra 9\n\n**A aplicação DEVE suportar\
    \ todos os tipos de dados PHP que possam ser serializados** - Isso inclui tipos\
    \ como:\n\n*   **`Strings`** - Cadeia de caracteres de qualquer tamanho e em qualquer\
    \ codificação compatível com o PHP.\n\n*   **`Integers`** - Todos os inteiros\
    \ de qualquer tamanho suportados pelo PHP, até 64 bits.\n\n*   **`Floats`** -\
    \ Todos os pontos flutuantes.\n\n*   **`Boolean`** - `true` (verdadeiro) e `false`\
    \ (falso).\n\n*   **`Null`** - O valor nulo, embora não seja possível distinguir\
    \ de um erro de cache ao realizar a leitura.\n\n*   **`Arrays`** - Arrays indexados,\
    \ associativos e multidimensionais de qualquer profundidade.\n\n*   **`Object`**\
    \ - Qualquer objeto que tenha suporte a serialização e desserialização sem perdas,\
    \ tal que `$object == unserialize(serialize($object))`. Objetos PODEM aproveitar\
    \ os métodos mágicos `sleep()` ou `wakeup()` do PHP.\n\n### Regra 10"
  fmt: "\nGenerating Responses (Gerando Respostas) - É RECOMENDADO que qualquer manipulador\
    \ de middleware ou de requisição que gere uma resposta componha um modelo de resposta\
    \ baseado na PSR-7, implementando a interface `Psr\\Http\\Message\\ResponseInterface`\
    \ ou até mesmo uma `factory` (fábrica) capaz de gerar uma instância de `Psr\\\
    Http\\Message\\ResponseInterface`, evitando a dependência de uma implementação\
    \ específica de mensagem HTTP.\n\nHandling Exceptions (Tratamento de Exceções)\
    \ - É RECOMENDADO que qualquer aplicação que utilizar o middleware inclua um componente\
    \ responsável por realizar a captura das exceções e as converta em respostas.\
    \ Este middleware DEVE ser o primeiro componente a ser executado e envolver todo\
    \ o processamento adicional para garantir que uma resposta seja sempre gerada.\n\
    \nEssas são as regras que a PSR-15 define. Não é nada complicado e é tecnicamente\
    \ muito simples de implementar em sua aplicação. A maioria dos frameworks e microframeworks\
    \ já possui suporte a essa PSR, basta você desenvolver a lógica da sua aplicação\
    \ e seguir as regras conforme estipuladas, ok?\n\n## 14.2 Interfaces\n\nA seguir\
    \ vamos conhecer as interfaces que fazem parte desse pacote.\n\n### `Psr\\Http\\\
    Server\\RequestHandlerInterface`\n\n```php\n<?php\n\nnamespace Psr\\Http\\Server;\n\
    \nuse Psr\\Http\\Message\\ResponseInterface;\nuse Psr\\Http\\Message\\ServerRequestInterface;\n\
    \ninterface RequestHandlerInterface\n{    \n    public function handle(ServerRequestInterface\
    \ $request): ResponseInterface;\n}\n```\n\n### `Psr\\Http\\Server\\MiddlewareInterface`\n\
    \n```php\n<?php\n\nnamespace Psr\\Http\\Server;\n\nuse Psr\\Http\\Message\\ResponseInterface;\n\
    use Psr\\Http\\Message\\ServerRequestInterface;\n\ninterface MiddlewareInterface\n\
    {    \n    public function process(ServerRequestInterface $request, RequestHandlerInterface\
    \ $handler): ResponseInterface;\n}\n```\n\n### Conclusão\n\nConforme você pôde\
    \ ver, são duas interfaces bem simples que não possuem muitos métodos e com isso\
    \ chegamos ao final da PSR-15 que definem os conceitos de middlewares e manipuladores\
    \ de requisição para que sua aplicação possa ou não delegar os dados para um outro\
    \ middleware.\n\nEm nosso próximo capítulo vamos falar da PSR-16, que define interfaces\
    \ comuns para aplicações de cache, vamos nessa!\n\n## Capítulo 15\n\n# PSR-16\
    \ (Common Interface for Caching Libraries)\n\nEssa PSR possui o objetivo de descrever\
    \ uma interface simples, porém extensível para um item de cache e um driver de\
    \ cache, sendo que as implementações finais PODEM decorar os objetos com mais\
    \ funcionalidades do que o que foi proposto, mas estes DEVEM realizar a implementação\
    \ das funcionalidades da interface primeiro.\n\nO cache é uma maneira de melhorar\
    \ o desempenho de qualquer aplicação, tornando aplicações/bibliotecas de cache\
    \ uma das características mais comuns de muitos frameworks. Obter interoperabilidade\
    \ neste nível significa que podemos realizar a implementação de cache específico\
    \ para a aplicação e confiar no que é enviado ao cache pelo framework ou qualquer\
    \ outra biblioteca de cache.\n\nÉ importante mencionar que a PSR-6 já atende perfeitamente\
    \ esse problema, porém de maneira bem detalhada. O que é abordado aqui na PSR-16\
    \ é uma maneira mais simples que visa construir uma interface simplificada padronizada\
    \ para os casos comuns, além disso, é independente da PSR-6 e foi projetada para\
    \ ter compatibilidade com ela de maneira simples.\n\n## 15.1 Regras\n\nVamos conhecer\
    \ a seguir a regras que a PSR-16 define para entendermos melhor.\n\n### Regra\
    \ 1\n\nCalling Library (Chamando na Aplicação) - A aplicação ou o código que realmente\
    \ precisar utilizar os serviços de cache deverá implementar a interface padrão\
    \ `Psr\\SimpleCache\\CacheInterface`, caso contrário, não saberá da existência\
    \ do serviço de cache.\n\n### Regra 2\n\nImplementing Library (Implementando na\
    \ Aplicação) - A aplicação é responsável por implementar o padrão estabelecido\
    \ pela PSR com o objetivo de fornecer os serviços de cache para qualquer aplicação\
    \ ou código de forma simples. A implementação DEVE prover a classe que implementa\
    \ a interface `Psr\\SimpleCache\\CacheInterface`. A implementação de bibliotecas\
    \ DEVE suportar ao menos a funcionalidade `TTL (Time To Live)`.\n\n### Regra 3\n\
    \nTTL (Time To Live) - Cada item de cache possui o que chamamos de tempo de vida,\
    \ esse tempo é o que define se determinado item está obsoleto ou não. O `TTL`\
    \ é definido por um número inteiro que representa o tempo em segundos ou por um\
    \ objeto `DateInterval`.\n\n### Regra 4\n\nExpiration (Expiração) - É o tempo\
    \ definido para que o cache se torne obsoleto, geralmente é calculado adicionando\
    \ o `TTL (Time To Live)` ao tempo em que um determinado objeto é armazenado. O\
    \ tempo também pode ser adicionado através de um objeto `DateTime`, por exemplo,\
    \ um item de cache com um `TTL (Time To Live)` de 300 segundos que foi armazenado\
    \ às 09:00:00 terá um tempo de expiração em 09:05:00, ou seja, terá um tempo de\
    \ 5 minutos antes de tornar-se obsoleto.\n\nA aplicação PODE expirar um item antes\
    \ de seu tempo de expiração definido, porém DEVE tratar um determinado item como\
    \ expirado quando o seu tempo de expiração for atingido. Se a aplicação passar\
    \ um item para ser armazenado e não especificar um tempo de expiração ou `TTL\
    \ (Time To Live)`, ela PODE utilizar um tempo de expiração padrão.\n\nCaso nenhum\
    \ tempo de duração for definido, então a aplicação DEVE interpretar como uma solicitação\
    \ para armazenar o item em cache para sempre ou pelo tempo em que a implementação\
    \ suportar.\n\n### Regra 5\n\nKey (Chave) - É a chave que define um item de cache,\
    \ e esse nome deve ser exclusivo para cada item de cache. As bibliotecas DEEM\
    \ suportar os caracteres A-Z, a-z, 0-9, underscore (`_`) e ponto (`.`), e em qualquer\
    \ codificação UTF-8, sendo que o nome da chave tenha no máximo 64 caracteres.\n\
    \nA aplicação PODE suportar outros caracteres, outras codificações e um nome de\
    \ chave maior. A aplicação também será responsável por retornar a sequência de\
    \ chave sem nenhum tipo de modificação.\n\nOs caracteres `{`, `}`, `(`, `)`, `/`,\
    \ `\\`, `@`, `:` NÃO DEVEM ser suportados pela aplicação, isso são reservados\
    \ para extensões futuras.\n\n### Regra 6\n\nCache - Um objeto que implementa `Psr\\\
    SimpleCache\\CacheInterface`.\n\n### Regra 7\n\nCache Misses - Um erro de cache\
    \ retornará `null`, portanto, detectar se um valor nulo está armazenado é impossível.\n\
    \n### Regra 8\n\nA aplicação que realizar a implementação PODE fornecer um mecanismo\
    \ para que o desenvolvedor possa especificar um padrão `TTL` - Caso nenhum valor\
    \ seja especificado para um item de cache, a aplicação DEVE utilizar como valor\
    \ padrão o valor máximo permitido pela implementação subjacente. Caso a implementação\
    \ subjacente não possua suporte ao `TTL`, o valor especificado pelo desenvolvedor\
    \ DEVE ser ignorado.\n\n### Regra 9\n\nA aplicação DEVE suportar todos os tipos\
    \ de dados PHP que possam ser serializados - Isso inclui tipos como:\n\n*   `Strings`\
    \ - Cadeia de caracteres de qualquer tamanho e em qualquer codificação compatível\
    \ com o PHP.\n*   `Integers` - Todos os inteiros de qualquer tamanho suportados\
    \ pelo PHP, até 64 bits.\n*   `Floats` - Todos os pontos flutuantes.\n*   `Boolean`\
    \ - `true` (verdadeiro) e `false` (falso).\n*   `Null` - O valor nulo, embora\
    \ não seja possível distinguir de um erro de cache ao realizar a leitura.\n* \
    \  `Arrays` - Arrays indexados, associativos e multidimensionais de qualquer profundidade.\n\
    *   `Object` - Qualquer objeto que tenha suporte a serialização e desserialização\
    \ sem perdas, tal que `$object == unserialize(serialize($object))`. Objetos PODEM\
    \ aproveitar os métodos mágicos `sleep()` ou `wakeup()` do PHP.\n"
  trans: "\n\n生成响应 (Gerando Respostas) - **建议**任何生成响应的中间件或请求处理器都编写一个基于 PSR-7 的响应模型，实现\
    \ `Psr\\Http\\Message\\ResponseInterface` 接口，甚至是一个能够生成 `Psr\\Http\\Message\\ResponseInterface`\
    \ 实例的 `factory`（工厂），以避免对特定 HTTP 消息实现的的依赖。\n\n异常处理 (Tratamento de Exceções) - **建议**任何使用该中间件的应用程序都包含一个负责捕获异常并转换为响应的组件。该中间件**必须**是第一个执行的组件，并涵盖所有的后续处理，以确保始终能生成响应。\n\
    \n这些就是 PSR-15 定义的规则。它们并不复杂，在技术上在你的应用程序中实现也非常简单。大多数框架和微框架已经支持了该 PSR，你只需要开发自己的应用逻辑并按照规定的规则操作即可，好吗？\n\
    \n## 14.2 接口\n\n接下来我们将了解该包包含的接口。\n\n### `Psr\\Http\\Server\\RequestHandlerInterface`\n\
    \n```php\n<?php\n\nnamespace Psr\\Http\\Server;\n\nuse Psr\\Http\\Message\\ResponseInterface;\n\
    use Psr\\Http\\Message\\ServerRequestInterface;\n\ninterface RequestHandlerInterface\n\
    {    \n    public function handle(ServerRequestInterface $request): ResponseInterface;\n\
    }\n```\n\n### `Psr\\Http\\Server\\MiddlewareInterface`\n\n```php\n<?php\n\nnamespace\
    \ Psr\\Http\\Server;\n\nuse Psr\\Http\\Message\\ResponseInterface;\nuse Psr\\\
    Http\\Message\\ServerRequestInterface;\n\ninterface MiddlewareInterface\n{   \
    \ \n    public function process(ServerRequestInterface $request, RequestHandlerInterface\
    \ $handler): ResponseInterface;\n}\n```\n\n### 结论\n\n正如你所看到的，这是两个非常简单的接口，没有多少方法。我们到达\
    \ PSR-15 的结尾，它定义了中间件和请求处理器的概念，以便你的应用程序可以可以将数据委托给另一个中间件。\n\n在下一个章节中，我们将讨论 PSR-16，它定义了缓存应用程序的通用接口，让我们开始吧！\n\
    \n## 第 15 章\n\n# PSR-16 (缓存库通用接口)\n\n该 PSR 的目标是描述一个针对缓存项和缓存驱动的简单且可扩展的接口。实现**可以**为对象装饰比建议更多的功能，但这些实现**必须**首先完成接口定义的功能。\n\
    \n缓存是提高任何应用程序性能的方法，使得缓存应用程序/库成为许多框架中最常见的特征之一。在这一层实现互操作性，意味着我们可以针对应用程序实现特定的缓存，并信任框架或任何其他缓存库发送到缓存中的内容。\n\
    \n需要提到，PSR-6 已经完美地解决了这个问题，但方式非常详尽。PSR-16 在此处理的是一种简单的方法，旨在为常见情况构建一个简化的标准接口；此外，它独立于\
    \ PSR-6，并设计为能够以简单的方式与其保持兼容。\n\n## 15.1 规则\n\n接下来我们将了解 PSR-16 定义的规则，以便更好地理解。\n\n\
    ### 规则 1\n\n调用库 (Chamando na Aplicação) - 真正需要使用缓存服务的应用程序或代码应实现标准接口 `Psr\\SimpleCache\\\
    CacheInterface`，否则它将不知道缓存服务的存在。\n\n### 规则 2\n\n实现库 (Implementing na Aplicação)\
    \ - 应用程序负责实现 PSR 建立的标准，旨在以简单的方式为任何应用程序或代码提供缓存服务。实现**必须**提供实现 `Psr\\SimpleCache\\\
    CacheInterface` 接口的类。库的实现**必须**至少支持 `TTL (生存时间)` 功能。\n\n### 规则 3\n\nTTL (生存时间)\
    \ - 每个缓存项都有我们所说的生命周期，这个时间决定了特定项是否过期。`TTL` 由一个表示秒秒的整数定义，或由一个 `DateInterval` 对象定义。\n\
    \n### 规则 4\n\n过期 (Expiração) - 这是缓存过期的定义时间，通常通过在存储特定对象的时间上加上 `TTL (生存时间)` 计算得出。时间也可以通过\
    \ `DateTime` 对象添加，例如，一个 `TTL` 为 300 秒且在 09:00:00 存储的缓存项，其过期时间为 09:05:00，也就是说，它在过期之前还有\
    \ 5 分钟的时间。\n\n应用程序**可以**在设定的过期时间之前使项失效，但在达到定义的过期时间时，应用程序**必须**将其视为已过期。如果应用程序传递一个项且没有指定\
    \ `TTL (生存时间)`，则可以使用默认的过期时间。\n\n### 规则 5\n\n键 (Key) - 定义缓存项的键，该名称对于每个缓存项必须是唯一的。库**必须**支持\
    \ A-Z、a-z、0-9、下划线 (`_`) 和点 (`.`) 以及任何 UTF-8 编码，且键名最大为 64 个字符。\n\n应用程序**可以**支持其他字符、编码以及更大的名称。应用程序还将负责返回未经修改的键序列。\n\
    \n字符 `{`、`}`、`(`、`)`、`/`、`\\`、`@`、:` 保留给未来的扩展。\n\n### 规则 6\n\n缓存 - 一个实现 `Psr\\\
    SimpleCache\\CacheInterface` 的对象。\n\n### 规则 7\n\n缓存缺失 - 缓存缺失返回 `null`，因此无法检测是否存储了空值。\n\
    \n### 规则 8\n\n实现应用程序**可以**提供一种机制，允许开发者指定默认的 `TTL` - 否则使用底层实现允许的最大值。如果底层实现不支持 `TTL`，开发者指定的值**必须**被忽略。\n\
    \n### 规则 9\n\n应用程序**必须**支持所有可以序列化的 PHP 数据类型 - 这包括以下类型：\n\n*   `Strings` - 任何长度和任何兼容\
    \ PHP 编码的字符串。\n*   `Integers` - PHP 支持的所有任何大小的整数，最高 64 位。\n*   `Floats` - 所有浮点数。\n\
    *   `Boolean` - `true`（真）和 `false`（假）。\n*   `Null` - 空值，尽管在读取时无法与缓存缺失区分来。\n* \
    \  `Arrays` - 任何深度的索引数组、关联数组和多维数组。\n*   `Object` - 任何支持无损序列化和反序列化的对象，使得 `$object\
    \ == unserialize(serialize($object))` true。对象**可以**利用 PHP 的魔术方法 `sleep()` 或 `wakeup()`。\n\
    \n"
